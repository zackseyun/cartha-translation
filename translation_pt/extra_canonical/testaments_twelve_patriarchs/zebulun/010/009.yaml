base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/009.yaml
  text: But you, fear the Lord our God with all your strength all the days of your life.
translation:
  language: pt
  text: Mas vocês, temam o Senhor [nosso Deus, com toda a força de vocês, todos os dias da vida de vocês].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na edição grega consultada, as palavras desde “nosso Deus” até “vida de vocês” aparecem entre colchetes, indicando incerteza textual.
    reason: Preservar de modo visível a incerteza assinalada na fonte, em vez de apresentar toda a frase como igualmente segura.
lexical_decisions:
- source_word: φοβεῖσθε
  choice: temam
  rationale: Mantém o sentido direto de reverência obediente expressa pelo verbo grego, sem enfraquecê-lo para apenas “respeitem”.
- source_word: Κύριον
  choice: o Senhor
  rationale: Equivalente tradicional, natural e digno para Κύριον neste contexto religioso.
- source_word: ἐν πάσῃ ἰσχύι ὑμῶν
  choice: com toda a força de vocês
  rationale: Reproduz o singular ἰσχύι e explicita naturalmente em português que o possessivo plural se refere aos destinatários.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς ὑμῶν
  choice: todos os dias da vida de vocês
  rationale: Conserva integralmente a extensão temporal e evita a possível ambiguidade de “sua vida” no português moderno.
theological_decisions:
- issue: Relação entre “Senhor” e “nosso Deus”
  choice: Senhor [nosso Deus]
  alternative: Senhor, nosso Deus
  rationale: A tradução inclui a identificação presente no texto fornecido, mas não elimina a incerteza textual indicada pelos colchetes da edição.
- issue: Força do imperativo de φοβεῖσθε
  choice: temam
  alternative: reverenciem
  rationale: “Temam” preserva a tensão semântica e teológica do grego, que pode abranger temor, reverência e obediência, sem restringi-lo a uma interpretação explicativa.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”. A construção mantém a ordem básica da fonte e usa “vida de vocês” para evitar ambiguidade pronominal. Os colchetes no texto principal refletem os colchetes da edição grega.
