  text: And now, my children, do not be grieved that I am dying, nor fall down that I am coming to my end.
translation:
  language: pt
  text: E agora, meus filhos, não fiquem tristes porque estou morrendo, nem desfaleçam porque estou chegando ao fim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Expressão natural e digna em português para a forma afetiva de tratamento, preservando a relação familiar.
- source_word: μὴ λυπεῖσθε
  choice: não fiquem tristes
  rationale: Traduz diretamente a ideia de sentir tristeza ou pesar, em linguagem corrente.
- source_word: μηδὲ συμπέσητε
  choice: nem se deixem abater
  rationale: O verbo pode sugerir cair, desfalecer ou sucumbir emocionalmente; a expressão portuguesa comunica esse sentido no contexto de uma despedida diante da morte.
- source_word: ἀπολήγω
  choice: estou chegando ao fim
  rationale: Preserva o eufemismo e a progressividade da expressão grega, sem substituir explicitamente 'fim' por 'morte'.
