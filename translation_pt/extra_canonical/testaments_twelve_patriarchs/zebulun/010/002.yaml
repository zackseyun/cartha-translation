    rationale: O grego diz apenas ἐκ τοῦ Βελίαρ, literalmente «de Beliar». Embora «do poder de» seja uma inferência contextual compreensível, ela introduz um substantivo interpretativo não expresso. A tradução de equivalência ótima deve conservar a formulação mais aberta.
