id: T12P.ZEB.10.2
reference: Testament of Zebulun 10:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἴασις *καὶ εὐσπλαγχνία⁵⁷ ἐν⁵⁸ ταῖς πτέρυξιν αὐτοῦ. Αὐτὸς λυτρώσεται πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων ἐκ τοῦ Βελίαρ καὶ πᾶν πνεῦμα πλάνης πατηθήσεται⁵⁹.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/002.yaml
  text: And healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deception will be trampled down.
translation:
  language: pt
  text: E cura e compaixão estarão em suas asas. Ele mesmo resgatará de Beliar todo cativeiro dos filhos dos homens, e todo espírito de engano será pisado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴασις
  choice: cura
  rationale: Equivalente direto e natural para a ideia de cura ou restauração.
- source_word: εὐσπλαγχνία
  choice: compaixão
  rationale: Expressa a misericórdia profunda indicada pelo termo grego em português atual e digno.
- source_word: ἐν ταῖς πτέρυξιν αὐτοῦ
  choice: em suas asas
  rationale: Preserva literalmente a imagem metafórica do texto.
- source_word: λυτρώσεται
  choice: resgatará
  rationale: Comunica libertação mediante resgate sem impor uma formulação teológica mais específica.
- source_word: πᾶσαν αἰχμαλωσίαν
  choice: todo cativeiro
  rationale: Mantém a construção abrangente e um tanto incomum do original, sem convertê-la silenciosamente em 'todos os cativos'.
- source_word: ἐκ τοῦ Βελίαρ
  choice: do poder de Beliar
  rationale: Em português, explicita de modo natural a libertação da sujeição a Beliar; o grego usa ἐκ para indicar a origem ou domínio do qual ocorre o resgate.
- source_word: πνεῦμα πλάνης
  choice: espírito de engano
  rationale: πλάνη pode denotar erro, extravio ou engano; 'engano' preserva a força moral e espiritual no contexto.
- source_word: πατηθήσεται
  choice: será pisado
  rationale: Conserva a imagem concreta e passiva do verbo grego.
theological_decisions:
- issue: Sentido de πᾶσαν αἰχμαλωσίαν
  choice: todo cativeiro
  alternative: todos os cativos
  rationale: A opção escolhida preserva o substantivo abstrato do grego e evita decidir se o objeto do resgate são as pessoas cativas ou a própria condição/dominação do cativeiro.
- issue: Relação expressa por ἐκ τοῦ Βελίαρ
  choice: do poder de Beliar
  alternative: de Beliar
  rationale: A formulação torna inteligível a ideia de libertação do domínio de Beliar sem identificar ou explicar além do que o contexto permite.
- issue: Agente de πατηθήσεται
  choice: voz passiva sem agente explícito
  alternative: ele pisará todo espírito de engano
  rationale: O original não declara o agente da ação; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação inicial com 'E' e a imagem das 'asas' foram mantidas por continuidade e fidelidade literária.
