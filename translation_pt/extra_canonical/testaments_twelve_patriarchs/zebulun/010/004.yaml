review_pass:
  verdict: revise
  source_fidelity: A construção ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ indica que os destinatários serão lançados/rejeitados para longe dele; «serão rejeitados por ele» transforma ἀπ᾽ αὐτοῦ em agente e deixa de traduzir explicitamente o afastamento. Além disso, παροργίζω traz o sentido específico de provocar à ira.
  naturalness: «Na astúcia de suas obras» é compreensível e mantém a formulação concisa e solene. «Serão lançados para longe dele» é natural em português e comunica tanto a passiva quanto a separação expressa pelo grego.
  terminology: «Astúcia», «obras» e «consumação» são escolhas adequadas. «Consumação» preserva a abertura escatológica de συντέλεια sem identificar um evento doutrinariamente específico.
  issues:
  - severity: medium
    issue: «serão rejeitados por ele» para ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
    rationale: A preposição ἀπό com pronome genitivo significa «dele/para longe dele», não «por ele». A redação proposta muda a relação expressa e perde o elemento de afastamento.
  - severity: low
    issue: «o provocarão» para παροργίσετε
    rationale: 'Embora o contexto permita entender a ira, o verbo grego é intensivo/específico: «provocarão à ira» reproduz melhor seu sentido sem acrescentar interpretação.'
