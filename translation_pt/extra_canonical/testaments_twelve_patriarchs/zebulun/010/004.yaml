- from: E novamente, na astúcia das suas obras, vocês o provocarão, e serão rejeitados por ele até o tempo da consumação.
  to: E novamente, na astúcia de suas obras, vocês o provocarão à ira e serão lançados para longe dele até o tempo da consumação.
