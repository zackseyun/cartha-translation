source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 9. Καὶ⁶⁴ πάλιν ⌈ἐν *τῇ πανουργίᾳ⁶⁵ *τῶν ἔργων⁶⁶ ὑμῶν⁶⁷⌉ παροργίσετε⁶⁸ αὐτόν, καὶ ἀπορριφήσεσθε⁶⁹ ⌈ἀπ᾽ αὐτοῦ⌉⁷⁰ ἕως καιροῦ συντελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/004.yaml
  text: And again, in the craftiness of your works you will provoke him, and you will be cast away from him until the time of completion.
translation:
  language: pt
  text: E novamente, na astúcia de suas obras, vocês o provocarão à ira e serão lançados para longe dele até o tempo da consumação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανουργίᾳ
  choice: astúcia
  rationale: Preserva o sentido negativo de habilidade ardilosa ou malícia, sem ampliar para uma formulação interpretativa.
- source_word: ἔργων
  choice: obras
  rationale: Equivalente direto e natural de ἔργων, mantendo a consistência lexical da fonte.
- source_word: παροργίσετε
  choice: provocarão
  rationale: Expressa o ato de provocar à ira; o objeto pronominal e o contexto já deixam implícito o resultado, evitando explicitação desnecessária.
- source_word: ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
  choice: serão rejeitados por ele
  rationale: Verte naturalmente a construção passiva e entende ἀπό com o agente da rejeição, sem perder a ideia de afastamento.
- source_word: καιροῦ συντελείας
  choice: tempo da consumação
  rationale: Mantém a formulação escatológica concisa e a possível amplitude de συντέλεια como conclusão ou consumação.
theological_decisions:
- issue: Sentido de συντέλεια
  choice: consumação
  alternative: conclusão
  rationale: “Consumação” preserva o peso escatológico possível da expressão sem especificar além do grego o evento em vista.
- issue: Relação expressa por ἀπ᾽ αὐτοῦ
  choice: rejeitados por ele
  alternative: lançados para longe dele
  rationale: A forma passiva favorece a leitura de Deus como agente; a alternativa enfatizaria sobretudo separação espacial. A escolha portuguesa permanece próxima do sentido contextual e do texto de consulta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A sintaxe conserva a repetição inicial e a tensão do anúncio profético sem acrescentar identificação explícita ao pronome “ele”.
