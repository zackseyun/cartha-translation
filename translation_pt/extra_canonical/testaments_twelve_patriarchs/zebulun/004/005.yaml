base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/005.yaml
  text: When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?”
translation:
  language: pt
  text: 'Quando Rúben chegou e soube que José havia sido vendido enquanto ele estava ausente, rasgou sua túnica e, lamentando, disse: “Como poderei olhar para o rosto de meu pai Jacó?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθη
  choice: havia sido vendido
  rationale: Preserva a voz passiva e expressa naturalmente em português uma ação anterior à chegada e à notícia recebida por Rúben.
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  choice: rasgou sua túnica
  rationale: Traduz χιτών de modo específico como “túnica”, em vez do mais genérico “vestes”, e mantém o gesto antigo de luto.
- source_word: θρηνῶν
  choice: lamentando
  rationale: Conserva a ideia de expressão aberta de pesar sem acrescentar detalhes não presentes no grego.
- source_word: Πῶς ὄψωμαι τὸ πρόσωπον
  choice: Como poderei olhar para o rosto
  rationale: Forma idiomática e digna que mantém a imagem concreta e a angústia da pergunta.
theological_decisions:
- issue: Identidade do sujeito de ἐπράθη (“foi vendido”)
  choice: José havia sido vendido
  alternative: ele havia sido vendido
  rationale: O grego emprega sujeito implícito, recuperado do contexto narrativo. Explicitar “José” evita em português a possível leitura de que Rúben foi vendido, sem alterar o referente contextual.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe narrativa permanece próxima do grego, mas evita ambiguidades referenciais artificiais em português.
