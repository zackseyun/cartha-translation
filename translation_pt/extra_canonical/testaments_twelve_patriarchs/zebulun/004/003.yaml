base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/003.yaml
  text: And when they saw that I also was not eating, they set me to guard him until he was sold.
translation:
  language: pt
  text: Quando viram que eu não estava comendo, encarregaram-me de vigiá-lo até que fosse vendido aos ismaelitas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos omitem “aos ismaelitas”.
    reason: Asterisco e nota crítica no texto-fonte indicam variação textual ligada a τοῖς Ἰσμαηλίταις; a leitura foi mantida no texto principal por constar da forma grega apresentada.
lexical_decisions:
- source_word: Ὁρῶντές με δὲ μὴ ἐσθίοντα
  choice: Quando viram que eu não estava comendo
  rationale: Reproduz naturalmente a construção participial e a negação do grego; não se acrescenta “também”, ausente no texto grego apresentado.
- source_word: ἔθετό με τηρεῖν αὐτὸν
  choice: encarregaram-me de vigiá-lo
  rationale: Expressa em português corrente a ideia idiomática de designar alguém para guardar ou vigiar uma pessoa.
- source_word: ἕως οὗ ἀπεδόθη
  choice: até que fosse vendido
  rationale: Mantém a voz passiva e o limite temporal, sem identificar um agente que o grego não explicita.
- source_word: τοῖς Ἰσμαηλίταις
  choice: aos ismaelitas
  rationale: Preserva o destinatário explicitamente atestado no texto grego, embora omitido na camada inglesa fornecida.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação evita explicitar quem efetuou a venda e conserva a referência textual aos ismaelitas.
