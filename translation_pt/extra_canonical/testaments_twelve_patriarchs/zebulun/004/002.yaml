  text: 2. Ἐγὼ δὲ σπλαγχνιζόμενος τὸν Ἰωσὴφ *οὐκ ἔφαγον³, προσέχων⁴ δὲ τῷ λάκκῳ, ἐπειδὴ⁵ ἐφοβεῖτο⁶ Ἰούδας μήπως ἀποπηδήσαντες⁷ Συμεὼν καὶ ὁ Δὰν καὶ ὁ Γὰδ ἀνέλωσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/002.yaml
  text: But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Dan and Gad might leap up and kill him.
translation:
  language: pt
  text: Mas eu, tendo compaixão de José, não comi; vigiei o poço, porque Judá temia que Simeão, Dã e Gade saltassem e o matassem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: movido de compaixão
  rationale: Expressa de modo natural a compaixão profunda indicada pelo particípio grego.
- source_word: οὐκ ἔφαγον
  choice: não comi
  rationale: Mantém de forma direta o sentido do aoristo grego e sua ligação com a compaixão por José.
- source_word: προσέχων δὲ τῷ λάκκῳ
  choice: fiquei atento junto à cisterna
  rationale: προσέχω indica atenção ou vigilância; 'junto à cisterna' comunica naturalmente o foco e a localização implícita, enquanto 'cisterna' é adequado ao poço escavado do relato.
- source_word: ἀποπηδήσαντες
  choice: se lançassem sobre ele
  rationale: No contexto da ameaça contra José, transmite o movimento súbito e agressivo sem impor a imagem pouco natural de simplesmente 'saltar'.
- source_word: ἀνέλωσιν αὐτόν
  choice: o matassem
  rationale: Traduz claramente o uso contextual de ἀναιρέω, isto é, tirar a vida.
theological_decisions:
- issue: Motivação da vigilância de Zebulom
  choice: A compaixão explica que ele não comeu, enquanto a vigilância é ligada ao temor de Judá.
  alternative: Fazer da compaixão a causa explícita tanto de não comer quanto de vigiar.
  rationale: Preserva a sequência e as relações sintáticas do grego sem acrescentar uma conexão causal não expressa.
- issue: Referente de αὐτόν
  choice: José, expresso por 'ele' e retomado por 'o'.
  alternative: A cisterna ou outro irmão.
  rationale: O pronome masculino e o contexto de ameaça tornam José o referente natural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Os nomes seguem as formas portuguesas usuais. A pontuação conserva a progressão lógica da frase grega sem produzir uma construção excessivamente pesada.
