  - severity: medium
    issue: «se lançassem sobre ele»
    rationale: A formulação acrescenta que o salto seria diretamente contra José. ἀποπηδήσαντες expressa salto/movimento súbito, sem especificar «sobre ele»; convém conservar essa abertura.
