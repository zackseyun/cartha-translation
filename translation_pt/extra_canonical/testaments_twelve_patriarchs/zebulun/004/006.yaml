revisions:
- from: E, tomando a prata, ele correu atrás dos mercadores; mas, não os encontrando, voltou angustiado. Os mercadores haviam deixado a estrada principal e seguido por um atalho através da terra dos trogloditas.
  to: E, tomando a prata, correu atrás dos mercadores; mas, não os encontrando, voltou lamentando. Os mercadores, porém, tinham deixado a estrada principal e seguido por uma rota mais curta através dos trogloditas.
  rationale: A revisão conserva todos os elementos do grego e evita especificar que os Trogloditas constituem necessariamente uma «terra» ou que o percurso curto era tecnicamente um atalho. Também traduz de forma mais imediata o lamento expresso por ὀδυρόμενος. Não há conteúdo de notas de fonte fornecido que permita reproduzir com segurança os sobrescritos editoriais gregos 25–28; por isso não foram criadas notas novas.
  reviewer_model: gpt-5.6-terra
