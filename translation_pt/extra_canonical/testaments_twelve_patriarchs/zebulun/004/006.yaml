  text: 6. Καὶ λαβὼν τὸ ἀργύριον κατέδραμεν ὀπίσω τοῖς ἐμπόροις· μὴ εὑρὼν δὲ αὐτοὺς ὑπέστρεψεν ὀδυρόμενος²⁵. καταλιπόντες²⁶ δὲ οἱ ἔμποροι τὴν πλατεῖαν ὁδὸν διόδευσαν²⁷ διὰ *Τρωγλοδιτῶν ἐν συντόμῳ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/006.yaml
  text: And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes.
translation:
  language: pt
  text: E, tomando a prata, correu atrás dos mercadores; mas, não os encontrando, voltou lamentando. Os mercadores, porém, tinham deixado a estrada principal e seguido por uma rota mais curta através dos trogloditas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀργύριον
  choice: a prata
  rationale: Mantém o sentido concreto do grego, podendo referir-se à prata usada como dinheiro, sem especificar moedas que o texto não menciona.
- source_word: κατέδραμεν ὀπίσω τοῖς ἐμπόροις
  choice: correu atrás dos mercadores
  rationale: Expressa de modo natural em português a perseguição ou tentativa de alcançar os comerciantes.
- source_word: ὑπέστρεψεν ὀδυρόμενος
  choice: voltou angustiado
  rationale: Preserva tanto o retorno quanto a aflição intensa indicada pelo particípio ὀδυρόμενος, elemento presente no grego embora omitido na camada inglesa.
- source_word: τὴν πλατεῖαν ὁδὸν
  choice: a estrada principal
  rationale: No contexto, πλατεῖα ὁδός contrasta com o percurso abreviado; 'estrada principal' comunica melhor essa função do que a tradução literal 'estrada larga'.
- source_word: διὰ Τρωγλοδιτῶν
  choice: através da terra dos trogloditas
  rationale: O genitivo plural após διά parece designar o povo ou a região por ele habitada; a explicitação 'terra dos' produz português claro sem transformar o nome em uma precisão geográfica indevida.
- source_word: ἐν συντόμῳ
  choice: por um atalho
  rationale: Transmite idiomaticamente a ideia de uma rota mais curta ou abreviada.
