source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. *Ἤκουσαν γὰρ ὅσα ἐνεδείξαντο αὐτῷ κακά⁵⁰. IV. Μετὰ δὲ τὸ †πραθῆναι¹ αὐτὸν ἐκάθησαν οἱ ἀδελφοί μου² ἐσθίειν καὶ πίνειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/001.yaml
  text: For they had heard how much evil had been done against him. And after he had been thrown into the pit, my brothers sat down to eat and drink.
translation:
  language: pt
  text: Pois tinham ouvido quanto mal lhe haviam feito. Depois de ele ter sido vendido[a], meus irmãos sentaram-se para comer e beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura grega “ter sido vendido” está assinalada como incerta na edição. Uma reconstrução alternativa, refletida em algumas traduções, diz “ter sido lançado no poço”.
    reason: Tornar transparente a incerteza textual indicada na edição e a divergência em relação à reconstrução alternativa refletida na tradução inglesa de consulta.
lexical_decisions:
- source_word: ἐνεδείξαντο αὐτῷ κακά
  choice: lhe haviam feito males
  rationale: No contexto, a expressão indica os males praticados contra ele; a formulação portuguesa é natural e preserva o sentido adverso do dativo αὐτῷ.
- source_word: πραθῆναι
  choice: foi vendido
  rationale: O infinitivo aoristo passivo de πιπράσκω significa ‘ser vendido’. A leitura é traduzida diretamente, embora esteja assinalada como textualmente incerta na edição.
- source_word: ἐκάθησαν ... ἐσθίειν καὶ πίνειν
  choice: se sentaram para comer e beber
  rationale: Reproduz com clareza a construção grega de sentar-se com a finalidade de comer e beber.
theological_decisions:
- issue: Destino de José antes de os irmãos comerem
  choice: foi vendido
  alternative: foi lançado no poço
  rationale: O grego fornecido traz πραθῆναι, ‘ser vendido’, apesar do sinal crítico e da redação divergente da camada inglesa. Não se substitui a leitura da fonte por uma harmonização narrativa silenciosa.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com sintaxe direta. A tradução segue prioritariamente o grego e explicita em nota a dificuldade textual, sem harmonizá-la silenciosamente com o relato de Gênesis.
