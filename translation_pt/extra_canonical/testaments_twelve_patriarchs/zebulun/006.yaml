base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006.yaml
  text: First[a], then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it. And I fastened a piece of wood behind it[b], and
translation:
  language: pt
  text: 6 Eu fui, portanto, o primeiro a construir uma embarcação para navegar no mar, porque o Senhor me deu entendimento e sabedoria[b] nisso. Coloquei uma peça de madeira atrás dela, e[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego disponível deste capítulo é fragmentário e se interrompe no meio da frase, depois de “Coloquei uma peça de madeira atrás dela, e”.
    reason: textual_variant
  - marker: b
    text: Aqui, “sabedoria” também pode incluir habilidade prática para construir, e não apenas sabedoria em sentido abstrato.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉ ἐγώ
  choice: Eu fui, portanto, o primeiro
  rationale: Πρῶτος, no nominativo e ligado a ἐγώ, é expresso naturalmente como uma afirmação de prioridade; “portanto” representa o οὖν transmitido com incerteza editorial.
- source_word: σκάφος
  choice: embarcação
  rationale: Termo geral para uma estrutura destinada à navegação; “embarcação” evita especificar indevidamente o porte como barco ou navio.
- source_word: ἐπιπλέειν
  choice: para navegar
  rationale: Embora possa significar literalmente flutuar sobre a água, o contexto de uma embarcação construída favorece o sentido funcional de navegar, sem especificar o meio de propulsão.
- source_word: σύνεσιν
  choice: entendimento
  rationale: Preserva o aspecto cognitivo do termo e forma um par natural com “sabedoria”.
- source_word: σοφίαν
  choice: sabedoria
  rationale: Mantém o alcance amplo e teológico do termo, enquanto a nota registra sua possível nuance de habilidade prática na construção.
- source_word: ἐν αὐτῷ
  choice: nisso
  rationale: Conserva a referência pouco determinada do pronome grego, sem decidir se aponta para a embarcação, a construção ou a atividade de navegar.
- source_word: καθῆκα
  choice: Fixei
  rationale: No contexto de construção e diante de ξύλον, transmite adequadamente a colocação firme ou anexação da peça, sem identificar sua função náutica.
- source_word: ξύλον
  choice: uma peça de madeira
  rationale: Representa o material e objeto de modo neutro, pois o fragmento não permite identificar com segurança o componente náutico.
- source_word: Κύριος
  choice: o Senhor
  rationale: Trata-se de referência divina e segue a forma portuguesa tradicional e clara.
theological_decisions:
- issue: Origem divina da capacidade técnica
  choice: O Senhor concede “entendimento e sabedoria” para a atividade descrita.
  alternative: Entender σοφία apenas como destreza artesanal.
  rationale: A combinação σύνεσις e σοφία admite aplicação prática à construção, mas também mantém ressonância intelectual e teológica; o texto principal preserva a amplitude, e a nota explicita a nuance prática.
- issue: Referente de ἐν αὐτῷ
  choice: Usar “nisso”, mantendo o referente aberto.
  alternative: Explicitar “para essa tarefa” ou “na embarcação”.
  rationale: O pronome grego é ambíguo no fragmento disponível; explicitar um referente resolveria indevidamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Embarcação” e “peça de madeira” evitam precisão náutica não sustentada pelo fragmento. A frase termina deliberadamente em “e”, refletindo a interrupção da fonte.
