  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005.yaml
  text: 'And they said to Jacob[a], “Recognize, then, whether this is your son’s tunic.” And they did so. For they stripped Joseph of the tunic when they were selling him, and clothed him in a slave’s garment. And Simeon took the tunic and did not want to give it. For he wanted to cut him down with the sword, being angry because he had not killed him. But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.” And so he gave it to them.


    And now, my children, I command you to guard your neighbor and to have compassion toward all, not only among people, but also toward unreasoning animals. For because of these things the Lord blessed me, and when all my brothers were sick, I passed through without illness. For the Lord knows each person’s purpose. Have mercy, therefore, in your hearts[b], because whatever a person does to his neighbor, so the Lord also will do with him. For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their hearts; but my sons were kept free from sickness, as you know.


    And when I was in the land of Canaan, by the seashore, I used to catch fish[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].'
translation:
  language: pt
  text: 'E disseram a Jacó: “Veja se esta é a túnica do seu filho.” E assim fizeram. Pois tinham tirado a túnica de José quando o venderam e o vestiram com roupa de escravo. Simeão pegou a túnica e não queria entregá-la, pois queria matar José à espada, irado por não o ter matado. Mas todos nós nos levantamos e lhe dissemos: “Se você não entregar a túnica, diremos ao nosso pai que foi você sozinho quem praticou este mal em Israel.” Então ele a entregou a eles. E fizeram conforme Dã havia dito.


    E agora, meus filhos, ordeno a vocês que guardem os mandamentos do Senhor, pratiquem misericórdia para com o próximo e tenham compaixão de todos, não somente dos seres humanos, mas também dos animais irracionais. Pois foi por essas coisas que o Senhor me abençoou; quando todos os meus irmãos adoeceram, eu passei sem ficar doente. Porque o Senhor conhece a intenção de cada um. Portanto, tenham misericórdia no coração[a], pois aquilo que alguém fizer ao seu próximo, assim também o Senhor fará com ele. De fato, os filhos dos meus irmãos adoeciam e morriam por causa de José, porque não tiveram misericórdia no coração. Meus filhos, porém, foram preservados sem doença, como vocês sabem.


    Quando eu estava na terra de Canaã, junto ao litoral, eu caçava[b] para Jacó, meu pai; e, quando muitos se sufocavam no mar, eu permanecia ileso.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “misericórdia nas entranhas”. No idioma grego, as entranhas eram consideradas a sede dos afetos profundos e da compaixão.
    reason: cultural_note
  - marker: b
    text: O grego diz literalmente “eu caçava uma presa”. A referência ao litoral e ao mar pode sugerir pesca ou captura de criaturas marinhas, mas o texto não a especifica.
    reason: lexical_alternative
  - marker: c
    text: A frase parece prosseguir além do trecho grego fornecido; a tradução termina onde termina o segmento disponível.
    reason: textual_note
lexical_decisions:
- source_word: χιτών
  choice: túnica
  rationale: Designa uma peça básica de vestuário; “túnica” é específica e natural em português bíblico moderno.
- source_word: ἱμάτιον δουλικόν
  choice: roupa de escravo
  rationale: Preserva de modo claro a condição servil indicada por δουλικόν, sem eufemismo.
- source_word: κατακόψαι αὐτόν
  choice: matar José à espada
  rationale: O contexto explicita a intenção homicida e a espada; o nome evita a ambiguidade pronominal presente em português.
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: guardem os mandamentos do Senhor
  rationale: Traduz o texto grego fornecido, que inclui explicitamente “os mandamentos do Senhor”; evita seguir a omissão da camada inglesa.
- source_word: εὐσπλαγχνίαν
  choice: compaixão
  rationale: Comunica de modo corrente a misericórdia sentida profundamente.
- source_word: ἀλόγοις ζώοις
  choice: animais irracionais
  rationale: Mantém o contraste antigo entre seres humanos e animais sem razão, em formulação portuguesa compreensível.
- source_word: προαίρεσιν
  choice: intenção
  rationale: Expressa a disposição ou escolha deliberada de cada pessoa no contexto moral.
- source_word: ἔλεος ἐν σπλάγχνοις
  choice: misericórdia no coração
  rationale: Verte naturalmente o idioma grego que situa a compaixão nas entranhas, consideradas sede dos afetos.
- source_word: ἐθήρευον θήραν
  choice: eu pescava
  rationale: Embora literalmente seja “eu caçava uma presa”, o litoral e o mar tornam a pesca a referência contextual mais provável; a nota preserva a forma literal.
- source_word: ἀβλαβὴς διέμενον
  choice: eu permanecia ileso
  rationale: Mantém o aspecto durativo de διέμενον e o sentido de não sofrer dano.
theological_decisions:
- issue: Princípio de reciprocidade moral em 5:3
  choice: “aquilo que alguém fizer ao seu próximo, assim também o Senhor fará com ele”
  alternative: “o Senhor o tratará da mesma maneira”
  rationale: Preserva a simetria direta e a tensão teológica da afirmação grega, sem suavizá-la nem explicá-la doutrinariamente.
- issue: Alcance da compaixão aos animais em 5:1
  choice: “não somente dos seres humanos, mas também dos animais irracionais”
  alternative: “não apenas das pessoas, mas também dos animais”
  rationale: Mantém explícita a ampliação ética do texto e o qualificativo ἀλόγοις.
- issue: Doença e morte “por causa de José” em 5:4
  choice: “por causa de José”
  alternative: “por causa do que fizeram a José”
  rationale: A formulação grega é concisa e potencialmente ambígua; não se acrescentou uma explicação causal ausente do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução segue prioritariamente o grego, restaurando elementos ausentes na camada inglesa, especialmente “os mandamentos do Senhor” e “fizeram conforme Dã havia dito”. Evitaram-se arcaísmos como “reconhece” e construções excessivamente literais, preservando-se em notas os idiomas e ambiguidades relevantes.
