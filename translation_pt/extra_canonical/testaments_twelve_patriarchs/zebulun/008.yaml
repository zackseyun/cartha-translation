base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008.yaml
  text: 'And so, my children, have compassion toward every person with mercy, so that the Lord also, having had compassion on you, may show you mercy. For indeed in the last days God will send his compassion upon the earth, and wherever he finds merciful compassion, there he dwells. For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.


    And when we went down into Egypt, Joseph did not hold a grudge against us. Giving heed to him, then, you also, my children, love one another, and let each one not reckon evil against his brother. For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.'
translation:
  language: pt
  text: '**8**¹ Portanto, meus filhos, sejam compassivos para com todas as pessoas e tratem-nas com misericórdia, para que também o Senhor tenha compaixão de vocês e lhes mostre misericórdia. ² Pois, de fato, nos últimos dias Deus enviará a sua compaixão sobre a terra; e, onde encontrar compaixão misericordiosa, ali habita. ³ Porque, na mesma medida em que uma pessoa tem compaixão do seu próximo, o Senhor também tem compaixão dela.


    ⁴ Quando descemos ao Egito, José não guardou ressentimento contra nós. ⁵ Portanto, tendo-o como exemplo, vocês também, meus filhos, amem uns aos outros, e ninguém alimente maldade contra seu irmão. ⁶ Pois isso rompe a unidade, dispersa todo vínculo de parentesco, perturba a alma e desfigura o rosto.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνία / σπλαγχνίζομαι / σπλάγχνα
  choice: compaixão / ser compassivo / ter compaixão
  rationale: A família de palavras evoca profunda compaixão, literalmente ligada às entranhas. A repetição foi preservada tanto quanto o português natural permite.
- source_word: ἐν ἐλέει / ἐλεέω / σπλάγχνα ἐλέους
  choice: com misericórdia / mostrar misericórdia / compaixão misericordiosa
  rationale: Mantém a distinção e a associação deliberada entre compaixão e misericórdia no texto grego.
- source_word: ἐν αὐτῷ κατοικεῖ
  choice: ali habitará
  rationale: Reproduz a referência locativa do grego sem definir além do texto se a habitação é na pessoa ou no lugar onde essa compaixão se encontra.
- source_word: οὐκ ἐμνησικάκησεν ἡμῖν
  choice: não guardou ressentimento contra nós
  rationale: Expressa de modo corrente o sentido de não conservar na memória a ofensa com intenção rancorosa.
- source_word: προσέχοντες
  choice: tendo-o como exemplo
  rationale: No contexto, a exortação é prestar atenção a José e orientar a própria conduta pela dele; esta formulação comunica naturalmente essa força.
- source_word: μὴ λογίζεσθε ... κακίαν
  choice: ninguém alimente maldade
  rationale: Preserva a dimensão interior de considerar, nutrir ou manter o mal contra um irmão, sem restringi-la apenas a planos ou atos.
- source_word: πᾶσαν συγγένειαν
  choice: todo vínculo de parentesco
  rationale: Comunica a ideia de relações ou laços familiares, mais precisamente do que o abstrato 'parentesco' isolado.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: desfigura o rosto
  rationale: Segue o sentido forte de arruinar ou tornar irreconhecível a aparência, conforme o contexto dos efeitos visíveis da maldade interior.
theological_decisions:
- issue: Relação proporcional entre a compaixão humana e a do Senhor
  choice: na mesma medida em que... também
  alternative: porque a pessoa tem compaixão... o Senhor terá compaixão
  rationale: O correlativo grego ὅσον... τοσοῦτον apresenta uma correspondência de medida. A tradução a conserva sem explicar se se trata de mérito, reciprocidade moral ou máxima sapiencial.
- issue: Deus enviar 'a sua compaixão' nos últimos dias
  choice: Deus enviará a sua compaixão sobre a terra
  alternative: Deus enviará o Compassivo à terra
  rationale: O texto traz τὰ σπλάγχνα αὐτοῦ, uma expressão abstrata e visceral para a compaixão divina. Não foi personificada nem identificada com uma figura específica além do que o grego afirma.
- issue: Habitação divina onde há compaixão
  choice: onde encontrar compaixão misericordiosa, ali habitará
  alternative: habitará nessa pessoa
  rationale: O antecedente masculino de ἐν αὐτῷ pode apontar para o ser humano em quem a compaixão é encontrada, mas a formulação locativa preserva a abertura do texto sem impor uma antropologia ou doutrina específica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A repetição temática de 'compaixão' e 'misericórdia' foi mantida por ser estrutural no original. Empregou-se 'vocês' para o plural, evitando regionalismos marcados; 'seu irmão' conserva a imagem familiar e moral do texto.
