source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: VI. Πρῶτος ⌈οὖν⌉¹ ἐγὼ ἐποίησα σκάφος² ἐπιπλέειν³ ἐν τῇ⁴ θαλάσσῃ, ὅτι Κύριος ἔδωκέ μοι ⌈*σύνεσιν καὶ σοφίαν⁵⌉ ἐν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006/001.yaml
  text: First, then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it.
translation:
  language: pt
  text: Fui, pois, o primeiro a fazer uma embarcação para navegar no mar, porque o Senhor me deu entendimento e sabedoria nisso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉ ἐγώ
  choice: Fui, pois, o primeiro
  rationale: Reproduz com naturalidade a ênfase de πρῶτος e do pronome ἐγώ, enquanto «pois» representa οὖν sem tornar a frase artificial.
- source_word: σκάφος
  choice: embarcação
  rationale: Termo corrente e suficientemente amplo para uma construção destinada à navegação, sem especificar tamanho ou tipo não indicado pelo grego.
- source_word: ἐπιπλέειν ἐν τῇ θαλάσσῃ
  choice: para navegar no mar
  rationale: Expressa de modo idiomático a finalidade de fazer a embarcação e o sentido de deslocar-se flutuando sobre o mar.
- source_word: σύνεσιν καὶ σοφίαν
  choice: entendimento e sabedoria
  rationale: Mantém a distinção entre capacidade de compreender ou conceber e sabedoria prática.
- source_word: ἐν αὐτῷ
  choice: para isso
  rationale: O pronome pode remeter ao empreendimento ou trabalho mencionado; em português, «para isso» comunica naturalmente a competência concedida pelo Senhor nesse âmbito.
theological_decisions:
- issue: Origem divina da habilidade técnica
  choice: porque o Senhor me deu entendimento e sabedoria para isso
  alternative: porque o Senhor me deu entendimento e sabedoria nisso
  rationale: Preserva a afirmação explícita de que o entendimento e a sabedoria foram dados pelo Senhor, sem acrescentar uma doutrina sobre o modo dessa concessão; «para isso» torna inteligível a referência de ἐν αὐτῷ.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A construção «Fui, pois, o primeiro» conserva a ênfase do original sem rigidez; «embarcação» evita tanto o tom infantil de «barquinho» quanto uma especificação náutica indevida.
