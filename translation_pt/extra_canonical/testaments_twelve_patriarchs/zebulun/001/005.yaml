base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/005.yaml
  text: I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.
translation:
  language: pt
  text: Não me lembro de ter cometido transgressão alguma, a não ser o mal que fiz sem intenção no caso de José, quando dei minha palavra aos meus irmãos de que não contaria a meu pai o que havia acontecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lawlessness
  choice: transgressão
  rationale: Como o grego deste versículo ainda não está alinhado no fragmento fornecido, a escolha segue a camada inglesa auditada. “Transgressão” preserva a ideia de violação moral ou legal sem recorrer ao tom mais arcaico de “iniquidade”.
- source_word: unwitting wrong
  choice: o mal que fiz sem intenção
  rationale: Expressão natural e clara que mantém a ausência de intenção sem negar que o ato tenha sido errado.
- source_word: gave my brothers my pledge
  choice: dei minha palavra aos meus irmãos
  rationale: Equivalente idiomático atual para um compromisso verbal solene, sem sugerir necessariamente juramento formal.
theological_decisions:
- issue: Natureza da culpa declarada por Zebulom
  choice: Preservar a tensão entre a transgressão e a falta de intenção
  alternative: Amenizar o ato como simples engano ou absolver plenamente o personagem
  rationale: O texto reconhece um mal real, embora cometido sem intenção; a tradução não deve eliminar nenhum dos dois aspectos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O grego fornecido é apenas um fragmento de âmbito capitular e não contém alinhamento verificável para este versículo; por isso, a redação foi baseada com cautela na camada inglesa auditada, sem acrescentar conteúdo interpretativo.
