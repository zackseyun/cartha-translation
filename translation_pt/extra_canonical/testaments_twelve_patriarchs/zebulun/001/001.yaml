  source_fidelity: 'O texto português segue com precisão o fragmento grego: Ἀντίγραφον λόγων é adequadamente vertido por “Cópia das palavras”; Ζαβουλών por “Zebulom”; πρὶν ἢ ἀποθανεῖν por “antes de morrer”; a idade é corretamente 114 anos; e μετὰ ... δύο ἔτη τοῦ θανάτου Ἰωσήφ é preservado como “dois anos depois da morte de José”. A revisão anterior que menciona Dan, 120 anos e omite a morte de José é claramente estranha à fonte desta unidade e não deve influenciar esta tradução.'
