base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/001.yaml
  text: A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.
translation:
  language: pt
  text: Cópia das palavras de Zebulom, que ele deixou como instrução a seus filhos antes de morrer, no centésimo décimo quarto ano de sua vida, dois anos depois da morte de José.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: Cópia das palavras
  rationale: Reproduz de modo direto a expressão grega, que apresenta o texto como registro ou cópia das palavras de Zebulom.
- source_word: διέθετο
  choice: deixou como instrução
  rationale: O verbo pode indicar dispor, ordenar ou transmitir determinações; esta formulação conserva o caráter testamentário sem impor o sentido técnico moderno de fazer um testamento.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: antes de morrer
  rationale: Tradução natural e fiel da oração temporal grega.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει
  choice: no centésimo décimo quarto ano
  rationale: Mantém o número 114 atestado no texto grego fornecido.
- source_word: μετὰ οὖν δύο ἔτη τοῦ θανάτου Ἰωσήφ
  choice: dois anos depois da morte de José
  rationale: Expressa com clareza a relação cronológica do grego; a partícula οὖν não requer equivalente explícito neste contexto.
theological_decisions:
- issue: Identidade do patriarca e cronologia
  choice: Zebulom; centésimo décimo quarto ano; dois anos depois da morte de José
  alternative: Dan; centésimo vigésimo ano; omissão da referência à morte de José
  rationale: A alternativa da revisão registrada contradiz tanto o título quanto o corpo do texto grego apresentado. A tradução segue a evidência primária desta unidade, não a revisão aparentemente pertencente a outro Testamento.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe fluente para leitores brasileiros e compreensão internacional. O título grego da obra não foi incluído porque a referência solicitada corresponde ao versículo 1:1, cujo conteúdo começa em Ἀντίγραφον.
