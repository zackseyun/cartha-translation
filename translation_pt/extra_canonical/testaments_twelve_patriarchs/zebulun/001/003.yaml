base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/003.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.
translation:
  language: pt
  text: Eu, Zebulom, fui uma boa dádiva para meus pais; pois, quando nasci, meu pai prosperou muitíssimo, e o mesmo aconteceu com os rebanhos e as manadas, quando ele obteve sua parte por meio das varas malhadas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: good gift
  choice: boa dádiva
  rationale: A formulação preserva a imagem de Zebulom como um presente benéfico para os pais, em linguagem natural e digna.
- source_word: increased very greatly
  choice: prosperou muitíssimo
  rationale: No contexto do aumento dos rebanhos e da aquisição da parte de Jacó, «prosperou» comunica melhor o sentido econômico do que o literal e pouco natural «aumentou».
- source_word: flocks and herds
  choice: rebanhos de ovelhas como de gado
  rationale: Distingue de modo claro os dois grupos de animais implícitos nos termos pastoris.
- source_word: speckled rods
  choice: varas malhadas
  rationale: Mantém a ligação narrativa com as varas marcadas usadas por Jacó em Gênesis 30, sem acrescentar uma explicação interpretativa ao texto.
- source_word: gained his portion
  choice: obter a sua parte
  rationale: Preserva a ideia de Jacó receber ou adquirir a porção que lhe cabia, sem especificar além da evidência disponível.
theological_decisions:
- issue: Relação entre o nascimento de Zebulom e a prosperidade de Jacó
  choice: 'Manter a afirmação causal do texto: «pois, quando nasci»'
  alternative: Atenuar para mera coincidência temporal
  rationale: O testemunho atribui significado favorável ao nascimento de Zebulom; a tradução não deve eliminar essa relação nem ampliá-la para uma doutrina explícita de causalidade sobrenatural.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Como o fragmento grego fornecido não chega ao versículo 3 e não está alinhado em nível de versículo, a redação foi estabelecida com cautela a partir da camada inglesa auditada e do contexto narrativo de Gênesis 30, sem fingir acesso a evidência grega ausente.
