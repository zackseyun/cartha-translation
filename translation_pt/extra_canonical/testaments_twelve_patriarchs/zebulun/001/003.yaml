revisions:
- from: Eu, Zebulom, fui uma boa dádiva para meus pais, pois, quando nasci, meu pai prosperou muitíssimo, tanto em rebanhos de ovelhas como de gado, ao obter a sua parte por meio das varas malhadas.
  to: Eu, Zebulom, fui uma boa dádiva para meus pais; pois, quando nasci, meu pai prosperou muitíssimo, e o mesmo aconteceu com os rebanhos e as manadas, quando ele obteve sua parte por meio das varas malhadas.
  rationale: A revisão preserva todos os elementos da camada inglesa auditada e esclarece que tanto o pai quanto os seus animais aumentaram. Não acrescenta explicação sobre as varas nem sobre a porção obtida. Como o grego fornecido não alcança o v. 3, a redação continua necessariamente dependente da trilha inglesa para este versículo.
