  text: But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.
translation:
  language: pt
  text: Mas chorei em segredo durante muitos dias por causa de José, pois tinha medo dos meus irmãos, porque todos haviam concordado que quem revelasse o segredo seria morto.
