  naturalness: O português é em geral claro, moderno e apropriado. As revisões propostas mantêm a leitura brasileira e internacional, sobretudo ao tornar explícito em 3:10 que os irmãos receberam o ato de cuspir.
  terminology: José, Rúben, Simeão, Dã, Gade, ismaelitas, Lei de Moisés, sandália e Faraó estão adequados. “Suscitar descendência” conserva bem a fórmula legal; a expressão anômala “suscitar a vida de seu irmão” deve permanecer, com a nota explicativa.
