  text: '1[a]. And when they had done this, they all sat down to eat and drink. But I, seeing that Joseph was grieving, did not eat with them, but I kept watch over the pit, praying for help for him.


    2. And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits which our fathers dug and found no water.”


    3. For this reason the Lord prevented water from springing up in them, so that Joseph might be preserved[b].


    4. And they did so until they sold him to the Ishmaelites.


    5. As for his price, my children, I had no share in it. But Simeon and Dan and Gad, and their sons, took his price and bought sandals for themselves and for their wives and their children,


    6. saying, “We will not eat from it, because it is the price of our brother’s blood; rather, we will trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”


    7. Therefore it is written in the record of the law of Moses: “The man who does not wish to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”


    8. And the brothers of Joseph were not willing to raise up the life of their brother, and the Lord removed from them the sandal which they wore against Joseph their brother.


    9. For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner of those before King Pharaoh.


    10. And not only did they bow down to him, but immediately, as they fell before him, they were also spat upon[c], and they were put to shame by the Egyptians.'
translation:
  language: pt
  text: '1. Depois de fazerem isso, todos se sentaram para comer e beber. Eu, porém, vendo que José chorava, não comi com eles; fiquei vigiando junto à cova e orando para que ele recebesse ajuda.


    2. Nesse meio-tempo, Rúben se levantou e disse: “Venham, meus irmãos! Não o matemos; lancemo-lo, antes, numa destas covas secas que nossos pais cavaram e nas quais não encontraram água.”


    3. Foi por isso que o Senhor impediu que a água brotasse nelas, a fim de que José fosse preservado.


    4. E assim fizeram, até que o venderam aos ismaelitas.


    5. Quanto ao preço pago por ele, meus filhos, eu não tive parte alguma nele. Simeão, Dã e Gade, porém, juntamente com seus filhos, pegaram o preço pago por José e compraram sandálias para si, para suas mulheres e para seus filhos,


    6. dizendo: “Não gastaremos esse dinheiro com comida, pois é o preço do sangue de nosso irmão. Em vez disso, vamos pisá-lo, porque ele disse que reinaria sobre nós; então veremos o que são os seus sonhos.”


    7. Por isso está escrito no registro da Lei de Moisés: “Ao homem que não quiser suscitar descendência para seu irmão será tirada a sandália, e lhe cuspirão no rosto.”[a]


    8. Os irmãos de José não quiseram suscitar a vida de seu irmão,[b] e o Senhor lhes tirou a sandália que haviam calçado contra José, seu irmão.


    9. De fato, quando chegaram ao Egito, os servos de José lhes tiraram as sandálias do lado de fora do portão; e assim eles se curvaram diante de José como diante do rei Faraó.


    10. E não somente se curvaram diante dele; ao caírem em sua presença, imediatamente também foram alvo de cusparadas,[c] e foram envergonhados pelos egípcios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alusão a Deuteronômio 25:5–10, onde a recusa de cumprir o dever para com o irmão falecido traz vergonha pública por meio da retirada da sandália e do ato de cuspir.
    reason: cross_reference
  - marker: b
    text: A formulação grega é incomum; literalmente, “os irmãos de José não quiseram suscitar a vida de seu irmão”. Ela parece adaptar a linguagem da lei do levirato, citada no versículo anterior, como analogia moral, e não como citação jurídica exata.
    reason: lexical_alternative
  - marker: c
    text: 'Alguns podem entender o ato de cuspir como uma extensão simbólica da citação legal, e não necessariamente como detalhe histórico; a narrativa grega, contudo, o declara diretamente. O verbo está na voz passiva: os irmãos receberam o ato de cuspir.'
    reason: alternative_reading
lexical_decisions:
- source_word: λάκκων / ξηρῶν λάκκων
  choice: covas / covas secas
  rationale: “Cova” conserva a amplitude de λάκκος e se ajusta a escavações nas quais se esperava encontrar água, sem especificá-las indevidamente como cisternas; “secas” traduz diretamente a ausência de água.
- source_word: ἐκώλυσε ... ἀναβλῦσαι ὕδωρ
  choice: impediu que a água brotasse
  rationale: Mantém o Senhor como agente explícito e preserva a imagem vívida da água que poderia brotar.
- source_word: περιποίησις
  choice: fosse preservado
  rationale: Expressa a conservação providencial da vida de José sem ampliar o termo para uma noção soteriológica de salvação.
- source_word: τιμή
  choice: preço pago por ele / preço pago por José
  rationale: No contexto, refere-se ao valor recebido pela venda de José. A explicitação ocasional do referente evita ambiguidade em português.
- source_word: ὑποδήματα
  choice: sandálias
  rationale: Preserva a imagem cultural e jurídica ligada à alusão à lei do levirato.
- source_word: καταπατήσωμεν
  choice: vamos pisá-lo
  rationale: Comunica o gesto depreciativo de pôr o dinheiro debaixo dos pés; o pronome retoma naturalmente “esse dinheiro” em português.
- source_word: ἀναστῆσαι σπέρμα
  choice: suscitar descendência
  rationale: Mantém o registro bíblico-jurídico da fórmula, mas usa “descendência”, mais claro ao leitor moderno do que o literal “semente”.
- source_word: ζωὴν ἀδελφοῦ αὐτῶν
  choice: suscitar a vida de seu irmão
  rationale: Conserva a formulação grega incomum e sua adaptação retórica da linguagem do levirato, em vez de corrigi-la silenciosamente para “descendência”.
- source_word: παῖδες
  choice: servos
  rationale: No ambiente da casa oficial de José, indica pessoas a seu serviço; “servos” é natural e não exige a leitura literal inadequada de “meninos”.
- source_word: ἐνεπτύσθησαν
  choice: cuspiram neles
  rationale: A forma passiva indica que os irmãos receberam o ato de cuspir. A tradução o declara diretamente, como faz a narrativa grega.
theological_decisions:
- issue: Interpretação providencial da cova seca
  choice: O Senhor impediu ativamente que a água brotasse para preservar José.
  alternative: Tratar a secura da cova como mera coincidência posteriormente moralizada.
  rationale: O grego nomeia explicitamente o Senhor como sujeito e apresenta a preservação de José como finalidade.
- issue: Aplicação moral da lei do levirato
  choice: Preservar a expressão incomum “suscitar a vida de seu irmão” e explicar sua relação analógica com a lei em nota.
  alternative: Normalizar a expressão para “suscitar descendência para seu irmão”.
  rationale: A formulação recebida cria deliberadamente uma analogia moral entre a recusa do dever fraterno e o tratamento dado a José; suavizá-la apagaria uma tensão real do texto.
- issue: O ato de cuspir diante de José
  choice: Apresentá-lo como acontecimento narrado diretamente, mantendo uma nota sobre sua possível função simbólica.
  alternative: Reduzi-lo a simples figura literária derivada da citação legal.
  rationale: Embora o episódio amplie simbolicamente a lei citada, a sintaxe grega o afirma na sequência narrativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções de legibilidade brasileira. O texto conserva algum vocabulário bíblico-jurídico (“suscitar descendência”) onde ele é essencial à cadeia retórica, mas evita arcaísmos desnecessários. As formas de tratamento e a pontuação do discurso direto foram naturalizadas. A numeração segue a unidade fornecida em dez versículos.
