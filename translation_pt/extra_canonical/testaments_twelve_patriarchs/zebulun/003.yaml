    issue: 3:1 traduz συνκλαίοντα de modo enfraquecido.
    rationale: “Estava aflito” não transmite o ato de chorar expresso pelo particípio grego. “Chorava” preserva a imagem sem tentar resolver as dificuldades sintáticas do testemunho.
  - severity: medium
    issue: 3:6 muda a pergunta acerca dos sonhos para uma pergunta sobre seu desfecho.
    rationale: “O que será dos seus sonhos” acrescenta a noção de resultado. O grego pergunta “o que são os seus sonhos”; esta formulação deve ser mantida.
  - severity: high
    issue: 3:10 verte uma forma passiva como se os irmãos fossem agentes do ato de cuspir.
    rationale: ἐνεπτύσθησαν significa que eles receberam cusparadas. “Também cuspiram neles” inverte a voz e deixa o sujeito indevidamente associado aos irmãos.
  - severity: low
    issue: 3:6 “Não compraremos comida com esse dinheiro” é mais explicativo que o grego.
    rationale: O grego diz literalmente que não comerão do preço. “Não gastaremos esse dinheiro com comida” torna a elipse idiomática em português, preservando o sentido contextual.
