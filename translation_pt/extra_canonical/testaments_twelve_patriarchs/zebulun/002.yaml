  text: '1 Sons of Zebulun[a], pay attention to the words of your father.

    2 I, Zebulun, became a good gift to my parents; for when I was born, my father prospered greatly, and the sheep and the cattle also, when with the variegated rods he had his share.

    3 And I do not know that I sinned in my days, except in intention.

    4 I do not remember that I committed lawlessness, except for the ignorance that I showed concerning Joseph, in that I gave my brothers my word not to tell my father what had happened.

    5 But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.

    6 Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin[b].

    7 For Simeon and Dan and Gad came against Joseph to kill him, and he said to them with tears,

    8 “Have mercy on me, my brothers; pity the inward compassion of Jacob our father. Do not lay your hands on me to shed innocent blood, for I have not sinned against you.

    9 But even if I have sinned, discipline me with correction, my brothers; yet do not bring your hand to the murder of your brother, for the sake of Jacob your father.”

    10 And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.

    11 And I wept together with Joseph, and my heart thundered, and the joints of my body trembled[c][d], and I had no strength.'
translation:
  language: pt
  text: '**Testamento de Zebulom 2**


    1 Filhos de Zebulom, prestem atenção às palavras de seu pai.


    2 Eu, Zebulom, tornei-me uma boa dádiva para os meus pais, pois, quando nasci, meu pai prosperou muito, assim como as ovelhas e o gado, quando tinham a sua parte entre as varas de diversas cores.[a]


    3 Não tenho consciência de ter pecado durante os meus dias, a não ser em intenção.[b]


    4 Não me lembro de ter cometido transgressão alguma, exceto pela ignorância em que incorri no caso de José, quando dei minha palavra aos meus irmãos de que não contaria a meu pai o que havia acontecido.


    5 Contudo, chorei em segredo durante muitos dias por causa de José. Eu tinha medo dos meus irmãos, pois todos haviam combinado que quem revelasse o segredo seria morto.


    6 No entanto, quando quiseram matá-lo, supliquei-lhes, com lágrimas, que não cometessem esse pecado.


    7 Pois Simeão, Dã e Gade avançaram contra José para matá-lo, e ele lhes disse entre lágrimas:


    8 — Tenham misericórdia de mim, meus irmãos! Compadeçam-se das entranhas de Jacó, nosso pai.[c] Não ponham as mãos sobre mim para derramar sangue inocente, pois não pequei contra vocês.


    9 Ainda que eu tenha pecado, corrijam-me com disciplina, meus irmãos; mas, por causa de Jacó, seu pai, não levantem a mão para assassinar o próprio irmão.


    10 Enquanto ele dizia essas palavras em profundo sofrimento, eu, não suportando seus lamentos, comecei a chorar. Meu fígado se derramou,[d] e toda a substância das minhas entranhas desfaleceu.


    11 Chorei junto com José; meu coração ribombava, as articulações do meu corpo tremiam, e eu não conseguia ficar de pé.


    [a] A menção às varas de diversas cores alude ao episódio da reprodução dos rebanhos de Jacó em Gênesis 30.


    [b] A expressão grega traduzida como “a não ser em intenção” é difícil e pode indicar um pensamento interior, em contraste com um ato exterior.


    [c] Literalmente, “compadeçam-se das entranhas de Jacó, nosso pai”. Trata-se de uma antiga expressão corporal que comunica profunda compaixão.


    [d] Literalmente, “meu fígado se derramou”, uma vívida expressão antiga de sofrimento intenso.'
  philosophy: optimal-equivalence
