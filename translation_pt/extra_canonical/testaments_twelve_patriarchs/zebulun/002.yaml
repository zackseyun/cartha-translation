  rationale: A revisão corrige o valor resultativo de γέγονα em 2:2 e torna mais cautelosa a tradução da construção elíptica ὅτε ἐν ταῖς ποικίλαις ῥάβδοις εἶχον τὸν κλῆρον. Também substitui «a ignorância que demonstrei» por «a ignorância em que incorri», mais próxima de «a ignorância que cometi» e mais natural em português. O restante foi preservado, inclusive as ambiguidades e imagens corporais do grego.
