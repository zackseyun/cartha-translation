lexical_decisions:
- source_word: προσέχετε
  choice: prestem atenção
  rationale: Expressa com clareza a exortação imperativa do discurso testamentário, sem tom arcaico.
- source_word: δόσις ἀγαθή
  choice: uma boa dádiva
  rationale: Mantém o substantivo concreto e a autodescrição de Zebulom em relação a seus pais.
- source_word: ηὐξήνθη
  choice: prosperou muito
  rationale: No contexto do aumento dos rebanhos e dos bens de Jacó, comunica melhor a ideia de crescimento material.
- source_word: ποικίλαις ῥάβδοις
  choice: varas de diversas cores
  rationale: Preserva a alusão a Gênesis 30 e traduz de modo acessível a aparência variada das varas.
- source_word: παρεκτὸς ἐννοίας
  choice: a não ser em intenção
  rationale: Conserva a formulação difícil e a tensão entre intenção interior e ação exterior, sem decidir além da evidência textual.
- source_word: παρανομίαν
  choice: transgressão
  rationale: Retém a força moral e jurídica do termo em português natural.
- source_word: ἄγνοιαν
  choice: ignorância
  rationale: Preserva a maneira como Zebulom caracteriza sua culpa, sem convertê-la em rebelião deliberada.
- source_word: ἐβεβαίωσα
  choice: dei minha palavra
  rationale: Comunica seu assentimento firme ao pacto de silêncio entre os irmãos.
- source_word: μυστήριον
  choice: segredo
  rationale: Refere-se ao acontecimento ocultado acerca de José, e não a um mistério em sentido teológico técnico.
- source_word: ἀναιρεθῆναι
  choice: seria morto
  rationale: Torna explícita e natural a ameaça de morte contida no infinitivo passivo.
- source_word: προσεκάλουν
  choice: supliquei-lhes
  rationale: Transmite a intensidade do apelo feito entre lágrimas.
- source_word: ἐβόμβει
  choice: ribombava
  rationale: Preserva a imagem sonora e violenta do coração, em vez de reduzi-la a uma emoção abstrata.
theological_decisions:
- issue: A afirmação de inocência de Zebulom apesar de sua culpa no caso de José
  choice: 'Manter diretamente a tensão: ele não tem consciência de haver pecado, salvo em intenção, e depois reconhece sua ignorância no caso de José.'
  alternative: Harmonizar o trecho como uma simples declaração de irrepreensibilidade, com uma única exceção referente a José.
  rationale: O grego apresenta uma autoavaliação moral complexa. A tradução não elimina nem explica silenciosamente essa tensão.
- issue: A linguagem corporal da compaixão e do sofrimento
  choice: Conservar imagens corporais como “entranhas”, “meu fígado se derramou” e “substância das minhas entranhas”.
  alternative: Substituí-las por formulações abstratas como “tenham profunda compaixão” e “fiquei arrasado”.
  rationale: As imagens corporais são parte da retórica afetiva do texto grego; notas breves esclarecem seu sentido cultural sem apagá-las.
- issue: A alegação de José de não ter pecado
  choice: Traduzir οὐχ ἥμαρτον ... εἰς ὑμᾶς como “não pequei contra vocês”.
  alternative: 'Reproduzir de modo rígido a construção participial incomum: “não pequei, tendo caído entre vocês”.'
  rationale: A construção grega é difícil, mas o contexto favorece uma declaração de que José não ofendeu seus irmãos; a versão escolhida permanece sóbria e inteligível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” nas falas para naturalidade contemporânea. As imagens corporais antigas foram mantidas no texto e esclarecidas em notas. A numeração segue a camada de consulta da POB em onze unidades, cobrindo o final do capítulo anterior na edição grega e o capítulo II.
