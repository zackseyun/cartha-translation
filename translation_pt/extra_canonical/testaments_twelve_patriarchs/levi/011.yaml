  naturalness: O texto é em geral claro e digno. “Para o lado do nascente” preserva o caráter direcional da expressão grega em português inteligível. A redação da visão foi ajustada para fluir naturalmente sem resolver a ambiguidade de ἐν ὑψηλοῖς.
  terminology: As formas Melca, Gérsam, Coate, Merari e Joquebede são adequadas. “Congregação”, “amargura” e “honrado” são apropriados. A glosa de Coate continua assinalada como textualmente difícil.
