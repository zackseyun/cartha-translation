lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: tomei uma esposa
  rationale: Preserva o idiomatismo semítico-grego para contrair matrimônio e mantém o registro testamentário e bíblico.
- source_word: ἐν γῇ παροικίας
  choice: numa terra onde éramos estrangeiros
  rationale: Expressa a condição de residentes estrangeiros em português natural, mantendo a relação entre a circunstância e o nome de Gérsam.
- source_word: πρώτῃ τάξει
  choice: primeira ordem
  rationale: τάξις pode indicar ordem, posição ou categoria. “Primeira ordem” conserva a ambiguidade entre precedência e posição hierárquica.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: ao nascer do sol
  rationale: A expressão significa literalmente “para os nascimentos do sol”. Ligá-la ao nascimento de Coate segue a sequência sintática do grego apresentado e preserva a imagem temporal sem reduzi-la simplesmente a “ao leste”.
- source_word: ἐν ὑψηλοῖς
  choice: nas alturas
  rationale: Mantém o plural substantivado e o tom elevado da visão, sem definir se as alturas são celestes, espaciais ou simbólicas.
- source_word: συναγωγῆς
  choice: congregação
  rationale: Designa uma reunião ou comunidade reunida; “congregação” se ajusta ao cenário coletivo e solene sem impor uma instituição posterior.
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  choice: princípio de majestade e união
  rationale: A glosa é textualmente difícil. “Princípio de majestade” segue de perto ἀρχὴ μεγαλείου, e “união” representa συμβιβασμός de modo compreensível sem tornar o texto artificialmente preciso.
- source_word: πικριασμός
  choice: amargura
  rationale: É o sentido lexical direto e preserva a explicação etimológica associada ao parto difícil.
- source_word: ἔνδοξος
  choice: honrado
  rationale: O adjetivo indica distinção ou boa reputação. “Honrado” é natural e digno, sem a possível conotação excessivamente grandiosa de “glorioso”.
theological_decisions:
- issue: Sentido da avaliação visionária de Gérsam e Coate
  choice: Apresentar a visão como uma indicação breve de ordem e destaque, sem explicitar uma hierarquia sacerdotal posterior.
  alternative: Interpretar a visão diretamente como profecia da precedência cultual dos clãs levíticos.
  rationale: O grego menciona ordem, alturas e congregação, mas não explica plenamente o alcance desses símbolos. A tradução conserva essa abertura.
- issue: Relação de πρὸς ἀνατολὰς ἡλίου com o nascimento ou com a visão
  choice: 'Ligar a expressão ao nascimento de Coate: “nasceu... ao nascer do sol”.'
  alternative: 'Ligá-la à visão: “vi numa visão, voltado para o nascer do sol”.'
  rationale: Na fonte grega fornecida, a expressão encerra a frase sobre o nascimento no versículo 4, enquanto a visão começa explicitamente no versículo 5. A tradução prioriza essa sequência, reconhecendo que a tradição textual é comprimida.
- issue: Sujeito implícito de ἔνδοξος em 11:8
  choice: 'Entender Levi como o sujeito contextual: “eu era honrado entre meus irmãos”.'
  alternative: 'Entender Joquebede como sujeito: “ela era honrada entre meus irmãos”.'
  rationale: Embora a forma grega possa ser masculina ou feminina, a referência aos “meus irmãos” e a tradição de leitura favorecem Levi. A nota registra a instabilidade do contexto sem desenvolver uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas bíblicas correntes para Melca, Coate, Merari e Joquebede. “Gérsam” translitera a forma específica Γηρσάμ do testemunho, evitando corrigi-la silenciosamente para outro nome. A coordenação narrativa foi preservada sem repetir mecanicamente todas as ocorrências de καί.
