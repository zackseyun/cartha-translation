  text: 1[a]. When I took a wife, I was twenty-eight years old, and her name was Melcha. 2. And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning. 3. And I saw concerning him that he was not in the first rank. 4. And Kohath was born in the thirty-fifth year of my life, and I saw in a vision, toward the sunrise, 5. that he stood in the midst of the congregation[b], in the heights. 6. Therefore I called his name Kohath, which is, beginning of majesty and assembly. 7. And a third son, Merari, was born to me in the fortieth year of my life; and because his mother bore him with difficulty, I called him Merari, which is bitterness. 8. And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: pt
  text: '**Testamento de Levi 11**


    1. Quando tomei uma esposa, eu tinha vinte e oito anos, e o nome dela era Melca. 2. Ela concebeu e deu à luz um filho, e eu lhe dei o nome de Gérsam, porque vivíamos numa terra onde éramos estrangeiros. 3. E vi a respeito dele que não pertencia à primeira ordem. 4. Coate nasceu, para o lado do nascente, no trigésimo quinto ano da minha vida. 5. E vi numa visão que ele estava no meio de toda a congregação, nas alturas. 6. Por isso lhe dei o nome de Coate, que significa “princípio de majestade e união”.[a] 7. E, no quadragésimo ano da minha vida, nasceu-me um terceiro filho, Merari. Como sua mãe teve um parto difícil, dei-lhe o nome de Merari, que significa “amargura”. 8. Joquebede nasceu no Egito, no sexagésimo quarto ano da minha vida, pois naquele tempo eu era honrado entre meus irmãos.[b]


    [a] A expressão explicativa ligada ao nome de Coate é textualmente difícil no testemunho grego. A tradução acompanha o sentido preservado sem tentar reconstruir um texto mais fluente.


    [b] O adjetivo traduzido por “honrado” pode, quanto à forma, referir-se tanto a Levi como a Joquebede. O contexto de “meus irmãos” favorece a referência a Levi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão explicativa ligada ao nome de Coate é textualmente difícil no testemunho grego. A tradução acompanha o sentido preservado sem tentar reconstruir um texto mais fluente.
