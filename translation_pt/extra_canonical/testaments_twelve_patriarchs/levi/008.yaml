  text: '1 And there again I saw a vision like the former one, after we had remained there seventy days. 2 And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the oracle of understanding, and the full-length robe of truth, and the plate of faith, and the turban of the head, and the ephod of prophecy.” 3 And each one of them was carrying these things, and they put them on me and said to me, “From now on, become a priest—you and all your seed.”


    4 And the first anointed me with holy oil and gave me a priestly staff. 5 And the second washed me with pure water of the Lord, and fed me holy bread and wine, and put around me a holy and glorious robe. 6 And the third put on me a linen garment, like an ephod. 7 And the fourth wrapped around me a girdle, like purple. 8 And the fifth gave me a branch of rich olive. 9 And the sixth placed a crown on my head. 10 And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.


    11 And they say to me, “Levi, your seed will be divided into three offices, for a sign of the glory of the Lord who is coming. 12 And the first lot will be great; none will arise greater than it. 13 And the second will be in priesthood. 14 And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, after the pattern of the nations, for all the nations. 15 And his presence is beloved, like a prophet of the Most High, from the seed of Abraham our father. 16 Therefore every desirable thing in Israel will be for you and for your seed, and your seed will eat every beautiful thing, and will apportion the table of the Lord. 17 And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”


    18 So when I awoke, I understood that this was like the first vision.'
translation:
  language: pt
  text: '1 Ali tornei a ter uma visão semelhante à anterior, depois de termos permanecido naquele lugar por setenta dias. 2 Vi sete homens vestidos de branco, que me diziam: “Levante-se e vista a veste do sacerdócio, a coroa da justiça, o peitoral do entendimento, a túnica comprida da verdade, a lâmina da fé, o turbante para a cabeça[a] e o éfode da profecia”. 3 Cada um deles trazia uma dessas coisas; eles as colocaram sobre mim e me disseram: “De agora em diante, torne-se sacerdote, você e toda a sua descendência”.


    4 O primeiro me ungiu com óleo santo e me deu um bastão. 5 O segundo me lavou com a água pura do Senhor, deu-me de comer pão e vinho santos e me revestiu de uma veste santa e gloriosa. 6 O terceiro colocou sobre mim uma veste de linho fino, semelhante a um éfode. 7 O quarto pôs em torno de mim um cinto de púrpura[b]. 8 O quinto me deu um ramo de oliveira viçosa[c]. 9 O sexto colocou uma coroa na minha cabeça. 10 O sétimo colocou sobre mim um diadema sacerdotal e encheu minhas mãos de incenso, para que eu exercesse o sacerdócio diante do Senhor Deus.


    11 Eles me disseram: “Levi, sua descendência será dividida em três funções, como sinal da glória do Senhor que vem. 12 A primeira porção será grande, e nenhuma outra surgirá maior do que ela. 13 A segunda estará no sacerdócio. 14 À terceira será dado um novo nome, pois um rei se levantará de Judá e estabelecerá um novo sacerdócio, segundo o modelo das nações, para todas as nações. 15 Sua presença é querida, como a de um profeta do Altíssimo, descendente de Abraão, nosso pai. 16 Portanto, tudo o que é desejável em Israel pertencerá a você e à sua descendência; vocês comerão tudo o que for belo à vista, e sua descendência repartirá a mesa do Senhor. 17 Dentre eles haverá sacerdotes, juízes e escribas, e pela palavra deles será recebido o que é santo[d]”.


    18 Quando despertei, entendi que essa visão era semelhante à primeira.


    [a] O texto grego traz literalmente “o turbante da cabeça”; a expressão pode ter sofrido corrupção textual.


    [b] Ou: “um cinto de aspecto púrpura”.


    [c] O grego é incomum e diz literalmente “um ramo de oliveira de gordura”, imagem de fertilidade, vigor ou abundância.


    [d] O texto grego desta frase é incerto; também pode significar “e por sua palavra o santo será recebido”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz literalmente “o turbante da cabeça”; a expressão pode ter sofrido corrupção textual.
    reason: A edição marca τῆς κεφαλῆς como textualmente suspeito, e a literalidade é redundante em português.
  - marker: b
    text: 'Ou: “um cinto de aspecto púrpura”.'
    reason: A construção ὁμοίαν πορφύρας é irregular e permite mais de uma compreensão da relação do cinto com «púrpura».
  - marker: c
    text: O grego é incomum e diz literalmente “um ramo de oliveira de gordura”, imagem de fertilidade, vigor ou abundância.
    reason: A expressão κλάδον ἐλαίας πιότητος é semanticamente incomum e não deve ter sua dificuldade ocultada.
  - marker: d
    text: O texto grego desta frase é incerto; também pode significar “e por sua palavra o santo será recebido”.
    reason: A edição assinala corrupção em ληφθήσεται, e τὸ ἅγιον admite referência ao que é santo ou ao santo.
lexical_decisions:
- source_word: λόγιον
  choice: peitoral
  rationale: No contexto da investidura sacerdotal e da sequência de vestes, designa melhor o peitoral sacerdotal/oracular do que o abstrato “oráculo”; “do entendimento” preserva o valor simbólico do genitivo.
- source_word: ποδήρη
  choice: túnica comprida
  rationale: O termo denota uma veste que desce até os pés; a formulação é clara e mantém a imagem cultual.
- source_word: πέταλον
  choice: lâmina
  rationale: Refere-se à placa ou lâmina frontal da indumentária sacerdotal, sem acrescentar material não expresso no grego.
- source_word: σπέρμα
  choice: descendência
  rationale: Expressa naturalmente em português o sentido coletivo genealógico de “semente”, sem perder a continuidade familiar.
- source_word: ἀρχάς
  choice: funções
  rationale: O termo pode significar domínios, posições ou ofícios; “funções” se ajusta à subsequente diferenciação sacerdotal, mas evita impor uma hierarquia institucional excessivamente definida.
- source_word: κλῆρος
  choice: porção
  rationale: Preserva a ideia de parte atribuída ou lote, sem reduzir o termo a um cargo e sem tornar a frase pouco natural.
- source_word: παρουσία
  choice: presença
  rationale: Mantém o sentido lexical direto e a possível ressonância escatológica, sem resolver a expressão como “vinda”.
- source_word: πιότητος
  choice: viçosa
  rationale: O genitivo de “gordura/riqueza” aplicado à oliveira sugere fertilidade e vigor; a nota conserva a literalidade incomum.
- source_word: διανεμεῖται
  choice: repartirá
  rationale: Conserva a noção distributiva do verbo no contexto da mesa do Senhor.
theological_decisions:
- issue: Identidade do rei e do novo sacerdócio em 8.14
  choice: 'Traduzir de modo indefinido: “um rei se levantará de Judá” e “estabelecerá um novo sacerdócio”'
  alternative: Identificar explicitamente o rei com uma figura messiânica específica
  rationale: O texto apresenta linguagem potencialmente messiânica, mas não nomeia a figura; a tradução preserva a tensão sem importar uma identificação confessional.
- issue: Relação entre o novo sacerdócio e as nações
  choice: “segundo o modelo das nações, para todas as nações”
  alternative: “à maneira dos gentios” ou “conforme o padrão dos povos”
  rationale: Mantém separadas as duas expressões gregas, uma de padrão e outra de alcance, sem harmonizar sua aparente tensão.
- issue: παρουσία em 8.15
  choice: “presença”
  alternative: “vinda”
  rationale: “Presença” é semanticamente direta e deixa em aberto se o autor enfatiza manifestação, chegada ou presença pessoal.
- issue: Sujeito de ἔδεσθε em 8.16
  choice: “vocês comerão”
  alternative: “sua descendência comerá”
  rationale: O verbo está na segunda pessoa do plural, embora o contexto alterne Levi e sua descendência; a tradução mantém a forma gramatical sem eliminar a oscilação.
- issue: Objeto de ληφθήσεται em 8.17
  choice: “o que é santo”
  alternative: “o santo”
  rationale: O neutro τὸ ἅγιον pode indicar uma coisa santa, o sagrado ou, menos provavelmente, uma pessoa; a formulação principal evita personificação indevida e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e legível, com formas amplamente naturais no Brasil e inteligíveis internacionalmente. A tradução conserva a solenidade visionária, emprega terminologia cultual reconhecível e usa notas apenas onde o grego é irregular, ambíguo ou textualmente incerto.
