review_pass:
  verdict: revise
  source_fidelity: A tradução segue de perto o grego e preserva adequadamente as ambiguidades relevantes, em especial a identidade do rei de 8.14, o valor de παρουσία em 8.15 e a formulação difícil de 8.17. A correção proposta em 8.16 restitui mais diretamente a imagem da «mesa do Senhor», sem a transformar em mera referência ao seu conteúdo.
  naturalness: O texto é geralmente claro, atual e de registro apropriadamente solene. Em 8.15, porém, a construção «Sua presença é amada, como profeta...» fica sintaticamente truncada em português. Em 8.16, «repartirá o que está na mesa» é explicativo demais e desloca o objeto expresso pelo grego.
  terminology: 'A terminologia cultual é consistente e inteligível: «peitoral», «túnica comprida», «lâmina», «éfode» e «diadema sacerdotal» são escolhas defensáveis. «Cinto de púrpura» comunica de modo mais natural a expressão irregular de 8.7, enquanto a nota mantém a ressalva interpretativa.'
  issues:
  - severity: low
    issue: '8.7: «um cinto semelhante à púrpura» é pouco idiomático.'
    rationale: A construção grega é irregular, mas «um cinto de púrpura» é uma solução portuguesa natural que conserva a provável referência à cor ou ao tecido; a nota registra a incerteza.
  - severity: medium
    issue: '8.15: construção sintática pouco clara.'
    rationale: O grego compara a παρουσία a um profeta do Altíssimo oriundo da descendência de Abraão. «Querida como a de um profeta..., descendente de Abraão» torna a comparação compreensível sem identificar a personagem.
  - severity: medium
    issue: '8.16: «repartirá o que está na mesa do Senhor» explicita além do texto.'
    rationale: O objeto de διανεμεῖται é «a mesa do Senhor». «Repartirá a mesa do Senhor» mantém a expressão e sua estranheza institucional/cultual, sem especificar que apenas os alimentos sejam distribuídos.
