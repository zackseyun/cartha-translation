source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *ἔσεσθε βδέλυγμα⁹ αὐτοῖς¹⁰, καὶ λήψεσθε¹¹ ὄνειδος¹² καὶ αἰσχύνην αἰώνιον παρὰ *τῆς δικαιοκρισίας¹³ τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/002.yaml
  text: And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God.
translation:
  language: pt
  text: E vocês serão uma abominação para eles e receberão afronta e vergonha eterna da parte do justo juízo de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βδέλυγμα
  choice: objeto de repulsa
  rationale: Expressa a ideia de algo detestável ou abominável em português natural, sem perder a força negativa do grego.
- source_word: ὄνειδος
  choice: afronta
  rationale: Preserva o sentido de desonra e censura pública, distinguindo-o de αἰσχύνην.
- source_word: αἰσχύνην αἰώνιον
  choice: vergonha eterna
  rationale: Tradução direta que conserva tanto a desonra quanto sua duração permanente.
- source_word: παρὰ τῆς δικαιοκρισίας τοῦ Θεοῦ
  choice: da parte do justo juízo de Deus
  rationale: Mantém o juízo divino como origem da afronta e da vergonha, preservando a construção e a ênfase teológica do grego.
theological_decisions:
- issue: Relação entre a vergonha eterna e o juízo divino
  choice: da parte do justo juízo de Deus
  alternative: por causa do justo juízo de Deus
  rationale: A preposição παρά com genitivo indica mais naturalmente procedência ou origem; evita transformar a relação em mera causalidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. O plural explícito “vocês” representa a segunda pessoa do plural; “objeto de repulsa” evita a possível leitura de que as próprias pessoas sejam chamadas literalmente de uma abominação, embora preserve a contundência do original.
