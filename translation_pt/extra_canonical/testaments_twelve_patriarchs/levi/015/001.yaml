id: T12P.LEV.15.1
reference: Testament of Levi 15:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Διὰ¹ τοῦτο² *ὁ ναός³, ὃν⁴ ἐκλέξεται⁵ κύριος⁶, *ἔρημος ἔσται⁷ *ἐν τῇ ἀκαθαρσίᾳ ὑμῶν⁸, καὶ ὑμεῖς αἰχμάλωτοι ἔσεσθε εἰς πάντα τὰ ἔθνη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/001.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness, and you will be taken captive to all the nations.
translation:
  language: pt
  text: Por isso, o templo que o Senhor escolher ficará desolado em meio à impureza de vocês, e vocês serão levados como cativos para todas as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ναός
  choice: o templo
  rationale: Ναός designa o santuário ou templo; neste contexto, “o templo” é a forma natural e suficientemente precisa em português.
- source_word: ἐκλέξεται
  choice: escolher
  rationale: Mantém o valor futuro do verbo grego e a escolha divina do templo, sem explicitar além do texto.
- source_word: ἔρημος ἔσται
  choice: ficará desolado
  rationale: Reproduz o estado futuro de abandono ou devastação expresso pela construção grega.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: por causa da impureza de vocês
  rationale: O ἐν pode indicar esfera ou circunstância, mas aqui a relação causal é natural no contexto profético; “impureza” preserva a dimensão ritual e moral de ἀκαθαρσία.
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: serão levados como cativos
  rationale: Torna explícito em português natural o resultado de serem cativos, sem alterar o sentido da construção nominal grega.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: para todas as nações
  rationale: Preserva a direção ou dispersão indicada por εἰς, em vez de substituí-la por “entre”.
theological_decisions:
- issue: Relação entre a impureza do povo e a desolação do templo
  choice: por causa da impureza de vocês
  alternative: na impureza de vocês
  rationale: A formulação causal comunica com clareza a relação mais provável no contexto, embora a preposição grega também possa ser entendida como esfera ou circunstância.
- issue: Objeto da escolha do Senhor
  choice: o templo que o Senhor escolher
  alternative: o santuário que o Senhor escolher
  rationale: Mantém a referência diretamente ligada ao substantivo grego ναός e não identifica um edifício histórico específico além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento por “vocês” adequado à legibilidade brasileira e sem coloquialismo excessivo. A ordem e a progressão profética do grego foram preservadas.
