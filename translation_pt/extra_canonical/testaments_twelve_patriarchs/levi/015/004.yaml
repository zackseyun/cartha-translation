base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/004.yaml
  text: And if it were not for Abraham and Isaac and Jacob, our fathers, you would receive no mercy; not one of your seed would be left on the earth.
translation:
  language: pt
  text: E, se não receberem misericórdia por meio de Abraão, Isaque e Jacó, nossos pais, nem um só descendente de vocês será deixado na terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: por Abraão, Isaque e Jacó
  rationale: A preposição διά com genitivo indica aqui a razão ou mediação pela qual a misericórdia seria concedida; “por” preserva essa amplitude sem impor uma explicação teológica mais específica.
- source_word: τῶν πατέρων ἡμῶν
  choice: nossos pais
  rationale: Mantém a designação ancestral do grego e a aposição aos três patriarcas, com pontuação clara em português.
- source_word: ἔλεος λήψεσθε
  choice: vocês não receberiam misericórdia
  rationale: No período contrafactual introduzido por εἰ μή, a formulação portuguesa explicita naturalmente a consequência negativa, em conformidade com o sentido global da oração.
- source_word: εἷς ἐκ τοῦ σπέρματος ὑμῶν
  choice: nem um só descendente de vocês
  rationale: σπέρμα significa literalmente “semente”, mas neste contexto coletivo designa a descendência; “nem um só descendente” comunica a força individualizante de εἷς.
- source_word: οὐ μὴ καταλειφθῇ
  choice: seria deixado
  rationale: A combinação οὐ μή expressa negação enfática; em português, “nem um só” transmite essa força, enquanto a voz passiva preserva καταλειφθῇ.
- source_word: ἐπὶ τῆς γῆς
  choice: sobre a terra
  rationale: Tradução direta e idiomática que conserva a referência à permanência na terra.
theological_decisions:
- issue: O papel de Abraão, Isaque e Jacó na concessão de misericórdia
  choice: “se não fosse por Abraão, Isaque e Jacó”
  alternative: “se não recebessem misericórdia por meio de Abraão, Isaque e Jacó”
  rationale: A redação escolhida conserva a relação causal ou mediadora indicada por διά sem definir se ela decorre de mérito ancestral, intercessão, aliança ou outra concepção teológica.
- issue: Sentido de “semente” como posteridade
  choice: “descendente”
  alternative: “semente”
  rationale: O contexto refere-se claramente a pessoas pertencentes à posteridade dos destinatários; a opção natural em português evita uma leitura biológica ou agrícola, sem alterar o conteúdo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com “vocês” para o plural de segunda pessoa. A construção contrafactual “se não fosse... não receberiam” torna explícita a lógica da frase grega, e o ponto e vírgula preserva a estreita ligação entre a ausência de misericórdia e a extinção da descendência.
