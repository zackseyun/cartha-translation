  text: And all who hate you will rejoice over your destruction.
translation:
  language: pt
  text: E todos os que odeiam vocês se alegrarão com a destruição de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισοῦντες
  choice: odeiam
  rationale: Expressa diretamente o particípio presente grego, mantendo a força contínua da hostilidade.
- source_word: χαρήσονται
  choice: se alegrarão
  rationale: Reproduz o futuro do verbo grego e conserva o sentido explícito de alegria.
- source_word: ἐπὶ τῇ ἀπωλείᾳ
  choice: com a destruição
  rationale: Em português natural, «alegrar-se com» comunica adequadamente a reação diante da ruína ou destruição; «destruição» preserva a força de ἀπώλεια sem especificar além do texto.
- source_word: ὑμᾶς / ὑμῶν
  choice: vocês / de vocês
  rationale: Representa com clareza o plural da segunda pessoa em português moderno de ampla compreensão.
theological_decisions:
- issue: Alcance de ἀπώλεια
  choice: destruição
  alternative: perdição
  rationale: «Destruição» mantém o sentido contextual de ruína sem impor a possível conotação teológica específica que «perdição» pode adquirir.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de «vocês» evita a ambiguidade possessiva de «sua» e preserva explicitamente o plural grego.
