base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004.yaml
  text: '1. Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are being split, and the sun is being extinguished, and waters are drying up, and fire is cowering, and all creation is being shaken, and the invisible spirits are melting away, and Hades is being plundered at the suffering of the Most High, men will persist in disobedience and remain in their injustices. Therefore they will be judged with a greater punishment.


    2. Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister of his presence.


    3. You shall shine forth the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.


    4. And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son forever.


    5. And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.


    6. For those who bless him will be blessed, and those who curse him will perish.'
translation:
  language: pt
  text: '**Testamento de Levi 4**


    **1.** Agora, portanto, saiba que o Senhor executará juízo sobre os filhos dos homens. Pois, quando as rochas se partirem, o sol se apagar, as águas secarem, o fogo se encolher de medo, toda a criação for abalada, os espíritos invisíveis se derreterem e o Hades for saqueado durante o sofrimento do Altíssimo[a], os seres humanos persistirão desobedientes em suas injustiças. Por isso, serão julgados com castigo maior.


    **2.** Portanto, o Altíssimo ouviu a sua oração, para separá-lo da injustiça e para que você se torne, para ele, filho, servo e ministro de sua presença.


    **3.** Você fará brilhar em Jacó a luz do conhecimento e será como o sol para toda a descendência de Israel.


    **4.** Uma bênção será dada a você e a toda a sua descendência, até que o Senhor visite todas as nações na terna compaixão de seu filho para sempre.[b]


    **5.** Por essa razão, foram dados a você conselho e entendimento, para que instrua seus filhos a respeito disso.


    **6.** Pois os que o abençoarem serão abençoados, e os que o amaldiçoarem perecerão.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “durante o sofrimento do Altíssimo” aparece entre colchetes na edição grega, indicando incerteza textual.
    reason: Sinaliza uma leitura textual incerta sem retirar do texto principal a leitura adotada pela edição.
  - marker: b
    text: 'A palavra “filho” é textualmente incerta. Depois desta frase, a edição grega também registra, entre colchetes: “Contudo, seus filhos porão as mãos sobre ele para empalá-lo.”'
    reason: Documenta a incerteza de «filho» e a cláusula inteira que a edição assinala como duvidosa, com tradução de «ἀνασκολοπίσαι» que não impõe uma identificação histórica ou doutrinária.
  - marker: c
    text: O texto grego diz literalmente “os que o abençoarem” e “os que o amaldiçoarem”; o referente do pronome não é explicitado de modo inequívoco.
    reason: Preserva a ambiguidade do referente e evita uma identificação interpretativa silenciosa.
lexical_decisions:
- source_word: κρίσιν ποιήσει
  choice: executará juízo
  rationale: Mantém a expressão judicial e a ação deliberada do Senhor, com formulação digna e corrente em português bíblico.
- source_word: καταπτήσσοντος
  choice: se encolher de medo
  rationale: O verbo comunica recuo ou encolhimento aterrorizado; a tradução preserva a personificação incomum do fogo sem reduzi-la a simples extinção.
- source_word: ᾅδου σκυλευομένου
  choice: o Hades for saqueado
  rationale: Translitera o nome do domínio dos mortos, evitando identificá-lo automaticamente com uma concepção posterior de inferno, e conserva a imagem de despojo expressa por σκυλεύω.
- source_word: ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις
  choice: ainda continuarão desobedientes e persistirão em suas injustiças
  rationale: Representa tanto o particípio de desobediência quanto a persistência nas injustiças, e explicita naturalmente o contraste com os acontecimentos cósmicos.
- source_word: θεράποντα ... λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: servo e ministro diante de sua presença
  rationale: Distingue os dois termos de serviço e entende τοῦ προσώπου como serviço realizado perante a presença divina.
- source_word: σπλάγχνοις
  choice: terna compaixão
  rationale: Traduz o sentido afetivo idiomático de 'entranhas' sem usar em português uma imagem anatômica opaca.
- source_word: σπέρματι
  choice: descendência
  rationale: Expressa naturalmente o valor coletivo de 'semente' em português moderno.
theological_decisions:
- issue: O sofrimento do Altíssimo
  choice: Manter explicitamente “durante o sofrimento do Altíssimo” no texto principal
  alternative: Reformular como sofrimento de outra pessoa ou omitir a expressão
  rationale: A frase grega atribui o πάθος ao Altíssimo. Embora seja textualmente assinalada como incerta na edição, sua tensão teológica não deve ser resolvida por paráfrase.
- issue: υἱοῦ em 4.4
  choice: “de seu filho”, com nota sobre a incerteza textual
  alternative: “dele” ou omissão completa de “filho”
  rationale: A palavra está entre colchetes na edição e deve ser apresentada sem esconder sua incerteza; a minúscula evita impor uma identificação dogmática que o trecho, isoladamente, não define.
- issue: Cláusula sobre os filhos de Levi e a crucificação
  choice: Não inserir no corpo principal, mas registrar integralmente em nota
  alternative: Incluir sem qualificação no versículo 4
  rationale: A edição coloca a cláusula inteira entre colchetes, sinalizando forte dúvida textual. A nota preserva a evidência sem lhe dar o mesmo peso do texto contínuo.
- issue: Referente de αὐτόν em 4.6
  choice: Preservar o pronome “o” e indicar a ambiguidade em nota
  alternative: Substituir por “seu filho”, “o Senhor” ou “Levi”
  rationale: O referente não é inequívoco no contexto imediato; nomeá-lo importaria uma interpretação teológica não exigida pelo grego.
- issue: Natureza do castigo em 4.1
  choice: “serão julgados para receber castigo”
  alternative: “serão julgados com castigo maior”
  rationale: O texto grego apresentado contém κολάσει, mas não traz um adjetivo lexicalmente claro correspondente a “maior”; a tradução evita acrescentar um grau de punição não seguro.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. Mantiveram-se imagens apocalípticas fortes e termos reconhecíveis como “Hades”, evitando tanto arcaísmos desnecessários quanto paráfrases confessionais. O tratamento por “você” favorece compreensão ampla, enquanto a sintaxe conserva solenidade moderada.
