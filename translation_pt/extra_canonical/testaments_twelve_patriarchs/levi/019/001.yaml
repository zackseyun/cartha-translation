source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν, τέκνα μου¹, πάντα ἠκούσατε². Ἐκλέξασθε³ ἑαυτοῖς *ἢ τὸ φῶς ἢ τὸ σκότος⁴, ἢ τὸν⁵ νόμον⁶ κυρίου, ἢ *τὰ ἔργα τοῦ Βελίαρ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/001.yaml
  text: And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar.
translation:
  language: pt
  text: 'E agora, meus filhos, vocês ouviram tudo. Escolham para si mesmos: ou a luz ou as trevas, ou a lei do Senhor ou as obras de Belial.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Expressa de modo natural a relação paternal do discurso; embora τέκνα possa ser inclusivo, o contexto testamentário apresenta Levi falando a seus descendentes.
- source_word: πάντα ἠκούσατε
  choice: vocês ouviram tudo
  rationale: Mantém o aspecto concluído do aoristo e a abrangência de πάντα em português claro.
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Escolham para si mesmos
  rationale: Preserva tanto o imperativo de escolha quanto o elemento reflexivo, sem reduzir a força deliberativa da expressão.
- source_word: τὸ φῶς / τὸ σκότος
  choice: a luz / as trevas
  rationale: Conserva a oposição moral e simbólica do grego; 'trevas' é a forma portuguesa digna e corrente nessa imagem.
- source_word: νόμον κυρίου
  choice: lei do Senhor
  rationale: Tradução direta da expressão, preservando seu conteúdo teológico sem especificar além do texto.
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: as obras de Belial
  rationale: Mantém o nome tradicional Belial e traduz ἔργα por 'obras', preservando o contraste entre norma e conduta.
theological_decisions:
- issue: Estrutura das alternativas morais
  choice: 'Manter dois pares paralelos introduzidos por ''ou'': luz/trevas e lei do Senhor/obras de Belial.'
  alternative: Fundir os pares como equivalências explícitas, identificando a luz com a lei e as trevas com as obras de Belial.
  rationale: A sintaxe sugere correspondência, mas não a declara formalmente; preservar o paralelismo evita resolver além do que o texto diz.
- issue: Identidade de Βελίαρ
  choice: Transliterar como 'Belial'.
  alternative: Traduzir interpretativamente como 'o Maligno' ou manter a forma 'Beliar'.
  rationale: A transliteração tradicional preserva a designação própria e evita impor uma identificação interpretativa; 'Belial' tem maior reconhecimento em português bíblico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A pontuação com dois-pontos torna explícita a introdução das alternativas sem alterar seu conteúdo; o paralelismo e a tensão moral do original foram preservados.
