base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/003.yaml
  text: And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him, “We are witnesses.”
translation:
  language: pt
  text: 'E o pai deles lhes disse: “O Senhor é testemunha, seus anjos são testemunhas, vocês são testemunhas, e eu sou testemunha quanto à palavra da boca de vocês.” E seus filhos lhe disseram: “Somos testemunhas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς / μάρτυρες
  choice: testemunha / testemunhas
  rationale: Mantém a linguagem formal de atestação do grego e reproduz a repetição enfática do texto.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: quanto à palavra que saiu da boca de vocês
  rationale: Expressa em português natural o sentido da formulação semítica preservada no grego, referindo-se à declaração feita por eles.
- source_word: Μάρτυρες
  choice: Somos testemunhas
  rationale: O predicativo isolado no grego pressupõe o verbo; sua explicitação produz uma resposta natural em português sem acrescentar conteúdo substantivo.
theological_decisions:
- issue: Identidade do referente de κύριος
  choice: O Senhor
  alternative: o senhor
  rationale: O contexto, junto da referência a “seus anjos”, indica o título divino, sem especificar além do que o texto declara.
- issue: Força jurídica ou pactual de μάρτυς
  choice: Preservar simplesmente “testemunha”
  alternative: fiador / garantia
  rationale: “Testemunha” conserva a imagem e a possível dimensão solene ou pactual sem impor uma interpretação mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “testemunha(s)” foi mantida por ser retoricamente central. Empregou-se “vocês” para clareza contemporânea e ampla compreensão.
