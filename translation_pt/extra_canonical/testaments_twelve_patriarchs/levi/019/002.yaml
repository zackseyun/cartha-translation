translation:
  language: pt
  text: 'E seus filhos lhe responderam: “Andaremos diante do Senhor, segundo a sua lei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ οἱ υἱοὶ αὐτοῦ λέγοντες
  choice: seus filhos lhe responderam
  rationale: Expressa naturalmente em português a fórmula grega de resposta; o particípio λέγοντες não precisa ser reproduzido por um redundante “dizendo” antes do discurso direto.
- source_word: Ἐνώπιον κυρίου
  choice: diante do Senhor
  rationale: Mantém a imagem espacial e relacional do grego, com formulação bíblica clara e corrente.
- source_word: πορευσόμεθα
  choice: andaremos
  rationale: Preserva o futuro e a metáfora ética de conduzir a vida como um caminhar.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: segundo a sua lei
  rationale: Traduz κατά com valor normativo, indicando conformidade com a lei dele.
theological_decisions:
- issue: Relação entre andar diante do Senhor e a lei
  choice: manter ambas as expressões sem explicação adicional
  alternative: parafrasear como “viveremos na presença do Senhor, obedecendo à sua lei”
  rationale: A formulação conserva a imagem e a tensão próprias do texto grego, sem acrescentar uma interpretação teológica explícita.
- issue: Conjunção καὶ antes de κατὰ τὸν νόμον αὐτοῦ
  choice: não representar a conjunção no texto corrido
  alternative: “Andaremos diante do Senhor e segundo a sua lei”
  rationale: A conjunção está textualmente assinalada como incerta e soa desnecessária em português; a ausência dela produz uma frase natural sem perda de conteúdo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada à sintaxe natural do português, preservando o tom solene e a metáfora bíblica do caminhar.
