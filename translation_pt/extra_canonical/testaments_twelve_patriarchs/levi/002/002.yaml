base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/002.yaml
  text: And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor.
translation:
  language: pt
  text: Eu ainda era jovem, com cerca de vinte anos; e então, junto com Simeão, tomei vingança por nossa irmã Diná contra Hamor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεώτερος
  choice: jovem
  rationale: Expressa naturalmente a juventude relativa de Levi, sem sugerir necessariamente que ele era o mais novo.
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: executei a vingança
  rationale: Preserva o sentido forte e deliberado da expressão grega, sem justificar moralmente o ato.
- source_word: μετὰ Συμεών
  choice: junto com Simeão
  rationale: Indica participação conjunta de modo claro e idiomático.
- source_word: τῆς ἀδελφῆς ἡμῶν Δείνας
  choice: por nossa irmã Diná
  rationale: O genitivo é entendido como a pessoa em favor de quem a vingança foi realizada; a formulação portuguesa permanece concisa.
- source_word: ἀπὸ Ἐμμώρ
  choice: contra Hamor
  rationale: Neste contexto de vingança, ἀπό marca aquele de quem se cobra vingança; 'contra' comunica essa relação naturalmente em português.
theological_decisions:
- issue: Avaliação moral da vingança
  choice: Manter a descrição direta como relato do personagem
  alternative: Atenuar como 'fiz justiça' ou explicitar condenação moral
  rationale: O grego descreve o ato como vingança, sem inserir aqui uma avaliação teológica explícita; a tradução não deve legitimá-lo nem condená-lo além do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A ordem da frase foi ajustada para fluidez, mantendo o conteúdo e a tensão moral do grego.
