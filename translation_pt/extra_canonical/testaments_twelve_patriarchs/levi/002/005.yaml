  source_fidelity: 'A tradução reproduz adequadamente a sequência narrativa e os elementos principais do grego. Contudo, «sobre ele» estreita indevidamente ἐν αὐτῷ («nele/no monte»): embora o contexto permita entender que Levi estava sobre a montanha, a preposição grega é ἐν, e o português idiomático «no monte» conserva a formulação sem sugerir que estivesse necessariamente no cume.'
  naturalness: «Então, o sono caiu sobre mim» é compreensível e preserva a imagem solene do original. «Eu estava no monte» é mais natural em português do que «eu estava sobre ele», além de evitar uma retomada pronominal menos fluida.
