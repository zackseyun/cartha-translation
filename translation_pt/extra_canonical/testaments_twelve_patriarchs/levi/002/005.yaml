    issue: «sobre ele» para ἐν αὐτῷ
    rationale: O grego diz literalmente «nele». O contexto e o inglês de auditoria justificam a noção locativa de estar na montanha, mas «sobre ele» pode especificar posição no topo e não corresponde tão diretamente à preposição grega. «No monte» é idiomático e preserva a ambiguidade espacial.
  revised_text: Então, o sono caiu sobre mim, e vi um monte alto, e eu estava no monte.
