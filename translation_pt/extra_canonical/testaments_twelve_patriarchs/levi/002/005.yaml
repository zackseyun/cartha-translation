- source_word: ἤμην ἐν αὐτῷ
  choice: eu estava sobre ele
  rationale: Neste contexto espacial, ἐν αὐτῷ indica que Levi se encontrava no monte; “sobre ele” acompanha o sentido provável e evita sugerir que estivesse dentro da montanha.
