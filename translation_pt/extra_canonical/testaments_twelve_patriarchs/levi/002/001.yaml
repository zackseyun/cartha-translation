  rationale: Reproduz com clareza a relação de companhia expressa pelo grego.
- source_word: Χαρρὰν
  choice: Harã
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: Σίκημα
  choice: Siquém
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
