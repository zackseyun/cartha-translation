id: T12P.LEV.2.3
reference: Testament of Levi 2:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς δὲ ἐποίμαινον¹⁸ ἐν Ἀβελμαούλ¹⁹, πνεῦμα συνέσεως Κυρίου ἦλθεν ἐπʼ ἐμέ²⁰, καὶ *ἐθεώρουν πάντας ἀνθρώπους²¹ *ἀφανίσαντας τὴν ὁδὸν αὐτῶν²², καὶ *ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία καὶ ἐπὶ πύργους ἡ ἀδικία ἐκάθητο²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/003.yaml
  text: And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers.
translation:
  language: pt
  text: Enquanto eu apascentava os rebanhos em Abelmaul, veio sobre mim um espírito de entendimento da parte do Senhor, e vi todos os seres humanos destruindo o seu próprio caminho; o pecado estava sendo edificado sobre uma muralha, e a injustiça estava assentada sobre torres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινον
  choice: apascentava os rebanhos
  rationale: O verbo descreve a atividade de pastorear; a explicitação de “os rebanhos” produz português natural sem mudar a cena.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: um espírito de entendimento da parte do Senhor
  rationale: Preserva tanto o sentido de discernimento de σύνεσις quanto a relação de procedência expressa pelo genitivo Κυρίου, sem identificar além do que o grego afirma.
- source_word: πάντας ἀνθρώπους
  choice: todos os seres humanos
  rationale: Traduz de modo inclusivo e atual a referência genérica a toda a humanidade.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: destruindo o seu próprio caminho
  rationale: Mantém a força de ἀφανίζω, “destruir/arruinar”, e explicita naturalmente que o caminho pertence aos próprios agentes.
- source_word: ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία
  choice: o pecado estava sendo edificado sobre uma muralha
  rationale: Conserva a imagem visionária, a preposição espacial e o aspecto passivo e progressivo do imperfeito.
- source_word: ἐπὶ πύργους ἡ ἀδικία ἐκάθητο
  choice: a injustiça estava assentada sobre torres
  rationale: Reproduz a personificação e a postura estática de ἐκάθητο, mantendo o plural “torres”.
theological_decisions:
- issue: Natureza do “espírito de entendimento”
  choice: um espírito de entendimento da parte do Senhor
  alternative: o Espírito de entendimento do Senhor
  rationale: O grego não traz artigo antes de πνεῦμα e não exige uma identificação técnica com o Espírito Santo; a formulação escolhida preserva essa abertura.
- issue: Imagens do pecado e da injustiça
  choice: manter literalmente a edificação sobre uma muralha e a injustiça assentada sobre torres
  alternative: interpretar as imagens como fortificação ou domínio social do mal
  rationale: A visão é metafórica e enigmática; interpretá-la no corpo do texto eliminaria uma tensão genuína do original.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. As imagens incomuns do original foram preservadas, sem paráfrase doutrinária.
