base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/004.yaml
  text: And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved.
translation:
  language: pt
  text: E eu estava entristecido pela raça dos filhos dos homens e orei ao Senhor para que eu fosse salvo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην λυπούμενος
  choice: eu me entristecia
  rationale: A construção perifrástica no imperfeito indica um estado ou processo contínuo de tristeza; a formulação portuguesa preserva esse aspecto com naturalidade.
- source_word: ὑπὲρ γένους
  choice: pela raça
  rationale: ὑπέρ com genitivo expressa aqui preocupação ou pesar a respeito de alguém, enquanto γένος designa raça, linhagem ou conjunto humano.
- source_word: τῶν υἱῶν τῶν ἀνθρώπων
  choice: dos filhos dos homens
  rationale: Mantém a expressão semítica representada literalmente no grego e sua possível ressonância tradicional, sem reduzi-la simplesmente a “humanidade”.
- source_word: ηὐξάμην τῷ Κυρίῳ
  choice: orei ao Senhor
  rationale: Tradução direta e idiomática do aoristo de εὔχομαι com dativo.
- source_word: ὅπως σωθῶ
  choice: para que eu fosse salvo
  rationale: Preserva a oração final e a voz passiva de σωθῶ, sem especificar de que perigo ou condição Levi desejava ser salvo.
theological_decisions:
- issue: Alcance da salvação pedida por Levi
  choice: para que eu fosse salvo
  alternative: para que eu fosse libertado
  rationale: O verbo σῴζω pode significar salvar, preservar ou livrar. Como o contexto imediato fornecido não define o tipo de perigo, “salvo” conserva a amplitude e a possível tensão teológica do original.
translation_notes:
  register: Português moderno, claro e digno, com leve preservação da cadência bíblica. A expressão tradicional “filhos dos homens” foi mantida por corresponder de perto ao grego e evitar apagar sua coloração semítica.
