  naturalness: O texto é claro e de registro adequado. «Estava entristecido» reproduz mais precisamente o estado contínuo expresso no original e soa natural em português moderno. «Raça dos filhos dos homens» é deliberadamente literal e algo solene, mas é aceitável neste registro e preserva a formulação do texto-fonte.
  terminology: «Senhor» corresponde adequadamente a Κυρίῳ. «Filhos dos homens» conserva a expressão tradicional do grego sem a reduzir interpretativamente a «humanidade». «Salvo» mantém a amplitude de σωθῶ e não determina o tipo de salvação ou livramento em vista.
