lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva o marcador grego de atenção e o tom visionário solene, em formulação bíblica ainda compreensível.
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: os céus se abriram
  rationale: Reproduz o plural de οἱ οὐρανοί e expressa naturalmente em português a forma passiva grega.
- source_word: ἄγγελος Κυρίου
  choice: um anjo do Senhor
  rationale: O grego não traz artigo antes de ἄγγελος; o artigo indefinido é a forma natural em português sem identificar um anjo específico.
- source_word: εἴσελθε
  choice: entre
  rationale: Traduz o imperativo aoristo singular como uma ordem direta e respeita o sentido básico de entrar.
