  - marker: d
    text: Ou “espiritual”. A expressão grega também pode ser entendida como “uma oferta dotada de razão”; em todos os casos, ela é contrastada com uma oferta de sangue.
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνός
  choice: sombrio
  rationale: Expressa a aparência lúgubre do céu inferior sem atribuir a ele, de modo indevido, uma emoção de ódio.
- source_word: ἀδικίας
  choice: injustiças
  rationale: Preserva tanto o caráter moral quanto a referência aos atos injustos praticados pelos seres humanos.
- source_word: κρύσταλλον
  choice: gelo
  rationale: No contexto de fogo e neve como elementos punitivos, o termo designa gelo ou cristal de gelo; “gelo” é natural e claro em português.
- source_word: δικαιοκρισίᾳ
  choice: justo julgamento
  rationale: Mantém explicitamente o caráter justo do juízo divino.
- source_word: πνεύματα τῶν ἐπαγωγῶν
  choice: espíritos das calamidades
  rationale: ἐπαγωγή pode indicar algo que é trazido sobre alguém, especialmente calamidade ou punição; a formulação conserva a personificação apocalíptica.
- source_word: δυνάμεις τῶν παρεμβολῶν
  choice: forças dos exércitos
  rationale: Reproduz a imagem militar de poderes ou forças pertencentes a acampamentos/exércitos celestes.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma presente no testemunho grego, sem harmonizá-la silenciosamente com “Belial”.
- source_word: κατάλυμα
  choice: morada
  rationale: No contexto celeste, comunica adequadamente um lugar de habitação, sem a conotação temporária que “alojamento” poderia sugerir.
- source_word: ἡ μεγάλη δόξα
  choice: a Grande Glória
  rationale: Conserva a expressão reverencial como título da presença divina, em vez de substituí-la diretamente por “Deus”.
- source_word: λειτουργοῦντες
  choice: prestam serviço sagrado
  rationale: Torna perceptível a dimensão cultual do verbo sem depender do sentido eclesiástico moderno de “ministrar”.
- source_word: ἐξιλασκόμενοι
  choice: fazem propiciação
  rationale: Preserva a força sacrificial e cultual do verbo; “fazem expiação” é indicada em nota como alternativa legítima.
- source_word: ἀγνοίαις
  choice: pecados cometidos por ignorância
  rationale: Explicita o uso cultual de faltas ou pecados não intencionais, evitando o sentido meramente cognitivo de “ignorância”.
- source_word: ὀσμὴν εὐωδίας
  choice: um aroma agradável
  rationale: Reproduz com naturalidade o conhecido idioma sacrificial grego.
- source_word: λογικὴν
  choice: racional
  rationale: Mantém a ambiguidade semântica básica do adjetivo; a possível interpretação “espiritual” é registrada em nota.
- source_word: ἐξουσίαι
  choice: autoridades
  rationale: É a equivalência mais direta para a classe de poderes celestes mencionada ao lado dos tronos.
- source_word: μεγαλωσύνης
  choice: majestade
  rationale: Expressa a grandeza soberana divina em registro elevado e natural.
- source_word: ἀναισθητοῦντες
  choice: insensíveis
  rationale: Conserva a ideia de falta de percepção ou sensibilidade diante das realidades descritas.
theological_decisions:
- issue: Ação cultual dos arcanjos em favor dos justos
  choice: “prestam serviço sagrado e fazem propiciação perante o Senhor”
  alternative: “ministram e fazem expiação ao Senhor” ou uma paráfrase em termos de intercessão
  rationale: O grego emprega linguagem explicitamente cultual e logo menciona aroma e oferta. A tradução mantém essa tensão teológica, sem reduzi-la a oração intercessória genérica; a alternativa lexical “expiação” aparece em nota.
- issue: A Grande Glória como designação divina
  choice: Manter “a Grande Glória” como título
  alternative: Substituir por “Deus” ou traduzir como “a Glória majestosa”
  rationale: A forma reverencial e possivelmente circunlocutória do original faz parte do registro apocalíptico e não deve ser nivelada.
- issue: Identidade do poder maligno
  choice: Usar “Beliar”
  alternative: Harmonizar com “Belial”
  rationale: A transliteração segue o testemunho grego; a forma tradicional alternativa é informada em nota.
- issue: Alcance da vingança no segundo céu
  choice: “contra os espíritos do engano e de Beliar”
  alternative: Entender Beliar como uma segunda entidade diretamente coordenada aos espíritos
  rationale: A sintaxe permite relação genitiva com “espíritos”; a tradução preserva essa construção sem explicar além do texto.
- issue: Tremor cósmico diante da majestade divina
  choice: Incluir Levi e seus companheiros em “todos trememos”, seguido do abalo do céu, da terra e do abismo
  alternative: Reformular apenas como abalo cósmico ou importar a leitura mais extensa da camada inglesa
  rationale: Esta formulação segue o texto grego fornecido, que traz “todos trememos” e nomeia céu, terra e abismo, sem a expressão “por meio do grau de sua santidade” nem a expansão sobre os fundamentos da terra.
translation_notes:
  register: Português moderno, internacional e solene, com legibilidade brasileira. Empregou-se “você” implícito na forma “lhe”, sem arcaísmos pronominais, e vocabulário cultual claro. A tradução segue prioritariamente o grego fornecido, inclusive onde ele difere da camada inglesa auditada. As passagens textualmente perturbadas sobre a ordem dos céus foram traduzidas com cautela e assinaladas em nota, sem reconstruir uma cosmologia mais precisa do que o testemunho permite.
