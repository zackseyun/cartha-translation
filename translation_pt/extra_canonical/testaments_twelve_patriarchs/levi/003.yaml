  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
translation:
  language: pt
  text: '3


    1 Ouça, pois, a respeito dos céus que lhe foram mostrados. O mais baixo lhe parece sombrio porque vê todas as injustiças dos seres humanos. 2 Ele contém fogo, neve e gelo, preparados para o dia do juízo, no justo julgamento de Deus; pois nele estão todos os espíritos das punições, para vingança contra os seres humanos. 3 No segundo céu estão as forças dos exércitos, designadas para, no dia do juízo, executar vingança contra os espíritos do engano e de Beliar.[a] Acima delas estão os santos. 4 Na morada mais elevada de todas está a Grande Glória, acima de toda santidade. 5 No céu seguinte[b] estão os arcanjos, que prestam serviço sagrado e fazem propiciação[c] perante o Senhor por todos os pecados cometidos por ignorância pelos justos. 6 Eles oferecem ao Senhor um aroma agradável, uma oferta racional[d] e sem sangue. 7 No céu logo abaixo estão os anjos que levam as respostas aos anjos da presença do Senhor. 8 No céu seguinte[b] estão tronos e autoridades, onde continuamente se oferecem
    hinos a Deus. 9 Portanto, quando o Senhor olha para nós, todos trememos, e o céu, a terra e o abismo são abalados diante da sua majestade. 10 Mas os seres humanos, insensíveis a essas coisas, pecam e provocam o Altíssimo à ira.


    [a] “Beliar” reproduz a forma grega do nome, também conhecido como “Belial” em outras tradições.


    [b] O grego traz uma expressão obscura, literalmente algo como “o [céu] com eles”; por isso, a posição exata deste céu na sequência é incerta.


    [c] Ou “fazem expiação”. Em contexto cultual, o verbo grego admite ambos os sentidos.


    [d] Ou “espiritual”. A expressão grega também pode ser entendida como “uma oferta dotada de razão”; em todos os casos, ela é contrastada com uma oferta de sangue.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beliar” reproduz a forma grega do nome, também conhecido como “Belial” em outras tradições.
    reason: lexical_alternative
  - marker: b
    text: O grego traz uma expressão obscura, literalmente algo como “o [céu] com eles”; por isso, a posição exata deste céu na sequência é incerta.
    reason: textual_uncertainty
  - marker: c
    text: Ou “fazem expiação”. Em contexto cultual, o verbo grego admite ambos os sentidos.
