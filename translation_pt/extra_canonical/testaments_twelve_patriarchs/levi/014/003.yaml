base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/003.yaml
  text: For just as the sun is pure before the Lord upon the earth, so also you are, the lights of Israel, beyond all the nations.
translation:
  language: pt
  text: Pois, assim como o sol é puro diante do Senhor sobre a terra, assim também vocês são, os luzeiros de Israel, acima de todas as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρός
  choice: puro
  rationale: Correspondência direta e natural, preservando a possível dimensão moral ou cultual do termo.
- source_word: φωστῆρες
  choice: luzeiros
  rationale: Expressa corpos ou fontes de luz e mantém a metáfora elevada aplicada aos destinatários.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: acima de todas as nações
  rationale: A construção comparativa indica superioridade ou distinção em relação a todas as nações; 'acima de' preserva isso sem acrescentar uma explicação ausente do grego.
theological_decisions:
- issue: Sentido da pureza do sol diante do Senhor
  choice: Manter a afirmação metafórica sem explicá-la
  alternative: Interpretar 'puro' como 'brilhante' ou como pureza ritual
  rationale: O grego usa καθαρός e não especifica em que sentido o sol é puro; a tradução conserva a abertura sem impor uma leitura.
- issue: Comparação de Israel com as nações
  choice: Traduzir como posição 'acima de todas as nações'
  alternative: Traduzir como 'mais do que todas as nações' ou 'entre todas as nações'
  rationale: O contexto sintático favorece uma comparação de superioridade, embora a formulação grega seja concisa.
translation_notes:
  register: Português moderno, digno e acessível, com 'vocês' para legibilidade ampla no Brasil. A estrutura paralela do grego foi preservada, e 'luzeiros' mantém o tom literário sem soar excessivamente arcaico.
