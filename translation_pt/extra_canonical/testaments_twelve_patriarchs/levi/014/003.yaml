source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς²³ γάρ ἐστιν ὁ †ἥλιος²⁴ καθαρὸς ἐνώπιον κυρίου †ἐπὶ τὴν γῆν²⁵, οὕτω καὶ ὑμεῖς ἐστε²⁸, οἱ φωστῆρες τοῦ Ἰσραήλ, παρὰ πάντα τὰ ἔθνη.
