base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/001.yaml
  text: Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands in wickedness [upon him], and among all the nations you will become a mockery.
translation:
  language: pt
  text: Portanto, eu, meus filhos, soube que, no fim das eras, vocês agirão de modo ímpio contra o Senhor, pondo as mãos com maldade [sobre ele]ᵃ, e se tornarão motivo de zombaria entre todas as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: soube
  rationale: O aoristo de γινώσκω é vertido de modo direto, indicando conhecimento adquirido, sem transformá-lo silenciosamente no presente «sei».
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: no fim das eras
  rationale: Mantém a imagem temporal e o plural de αἰώνων em português natural, sem substituir a expressão por uma formulação escatológica mais interpretativa.
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: agirão de modo ímpio contra o Senhor
  rationale: Expressa o sentido verbal de ἀσεβέω e conserva a direção hostil indicada por ἐπί.
- source_word: χεῖρας ἐπιβάλλοντες
  choice: pondo as mãos
  rationale: Preserva a expressão concreta do grego, que neste contexto sugere ação hostil, sem explicitar além do texto a forma dessa violência.
- source_word: χλευασμός
  choice: motivo de zombaria
  rationale: 'Comunica naturalmente o substantivo predicativo: eles se tornarão aquilo de que as nações zombam.'
theological_decisions:
- issue: Referente de ἐπ᾿ αὐτόν
  choice: Manter «[sobre ele]» entre colchetes e explicar a incerteza textual em nota.
  alternative: Integrar «sobre ele» sem colchetes ou omitir as palavras.
  rationale: A edição-fonte põe ἐπ᾿ αὐτόν entre colchetes; a tradução deve preservar essa incerteza sem decidir se o objeto da agressão é explicitamente o Senhor no texto original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «vocês» para o plural de segunda pessoa. A construção conserva o tom profético e acusatório do original.
