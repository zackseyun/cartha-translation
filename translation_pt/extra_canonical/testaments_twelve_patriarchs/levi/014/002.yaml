base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/002.yaml
  text: For our father Israel is pure from the ungodliness of the chief priests [who will lay their hands on the Savior of the world].
translation:
  language: pt
  text: Pois também o nosso pai Israel é puro da impiedade dos sumos sacerdotes [que porão as mãos sobre o Salvador do mundo].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração entre colchetes tem status textual incerto na tradição grega utilizada.
    reason: Explica ao leitor por que a frase final foi preservada entre colchetes, sem ocultar a questão textual.
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Pois também
  rationale: Reproduz a conexão explicativa de γάρ e mantém o valor aditivo de καί de modo natural em português.
- source_word: ὁ πατὴρ ἡμῶν Ἰσραήλ
  choice: nosso pai Israel
  rationale: Tradução direta, clara e digna da expressão genealógica.
- source_word: καθαρός ἐστιν ἀπὸ
  choice: está puro de
  rationale: Preserva a imagem de pureza e separação expressa pela construção grega, sem substituí-la por uma interpretação jurídica.
- source_word: ἀσεβείας
  choice: impiedade
  rationale: Termo corrente no registro bíblico que comunica irreverência e perversidade religiosa.
- source_word: τῶν ἀρχιερέων
  choice: dos principais sacerdotes
  rationale: Equivalente amplamente compreensível para ἀρχιερεῖς, evitando restringir o plural ao cargo singular de sumo sacerdote.
- source_word: ἐπιβαλοῦσι τὰς χεῖρας αὐτῶν ἐπὶ
  choice: lançarão as mãos sobre
  rationale: Mantém o futuro e a expressão corporal do grego, que neste contexto sugere captura ou violência sem explicitar além do texto.
- source_word: τὸν σωτῆρα τοῦ κόσμου
  choice: o Salvador do mundo
  rationale: Verte literalmente o título e seu alcance universal; a inicial maiúscula sinaliza seu uso titular no registro formal.
theological_decisions:
- issue: Sentido da pureza de Israel em relação à impiedade dos principais sacerdotes
  choice: está puro da impiedade
  alternative: é inocente da impiedade
  rationale: A formulação escolhida conserva a metáfora cultual e moral de καθαρός e não resolve o enunciado exclusivamente em termos de culpa jurídica.
- issue: Identidade e caráter titular de σωτήρ
  choice: Salvador
  alternative: salvador
  rationale: A maiúscula é adequada ao uso como título definido, sem acrescentar ao texto uma identificação denominacional explícita.
- issue: Status textual da oração sobre o Salvador
  choice: manter a oração entre colchetes
  alternative: integrá-la sem colchetes ou omiti-la
  rationale: Os colchetes presentes na fonte fornecida indicam incerteza ou marcação textual relevante e devem ser preservados visivelmente.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A ordem foi levemente naturalizada, mas a metáfora de pureza, o futuro verbal e os colchetes críticos foram preservados.
