source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶν οὖν ἐπιθυμητὸν⁸⁶ ἐν Ἰσραὴλ⁸⁷ σοὶ⁸⁸ ἔσται καὶ τῷ σπέρματί σου⁸⁹, καὶ ἔδεσθε⁹⁰ πᾶν ὡραῖον ἐν⁹¹ ὁράσει, καὶ τὴν τράπεζαν Κυρίου διανεμεῖται⁹² τὸ σπέρμα σου⁹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/016.yaml
  text: Therefore every desirable thing in Israel will be for you and for your seed, and you will eat every beautiful thing for the eye, and your seed will apportion the table of the Lord.
translation:
  language: pt
  text: Portanto, tudo o que é desejável em Israel será seu e da sua descendência; vocês comerão tudo o que é belo aos olhos, e a sua descendência repartirá a mesa do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμητόν
  choice: o que é desejável
  rationale: Expressa aquilo que é cobiçado, estimado ou digno de desejo sem restringir o referente a bens materiais.
- source_word: σπέρμα
  choice: descendência
  rationale: É o equivalente coletivo natural em português para a linhagem ou os descendentes do destinatário.
- source_word: πᾶν ὡραῖον ἐν ὁράσει
  choice: tudo o que é belo aos olhos
  rationale: Conserva a referência à beleza perceptível pela visão e reproduz de modo idiomático a expressão grega.
- source_word: διανεμεῖται
  choice: repartirá
  rationale: Mantém a ideia de distribuir ou repartir porções, sem explicar além do que o texto declara.
- source_word: τὴν τράπεζαν Κυρίου
  choice: a mesa do Senhor
  rationale: Preserva a imagem concreta e potencialmente cultual do original, sem substituí-la por uma interpretação específica.
theological_decisions:
- issue: Sentido da expressão “mesa do Senhor”
  choice: Manter literalmente “a mesa do Senhor”
  alternative: Explicitar como alimentos, ofertas ou serviço sacerdotal
  rationale: O grego não determina sozinho qual aspecto cultual está em primeiro plano; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português atual, digno e de leitura ampla. O plural “vocês comerão” reproduz ἔδεσθε e abrange o destinatário com sua descendência. A redação segue ἐν ὁράσει (“aos olhos”) do texto-fonte fornecido, e não a leitura ἐν δράσει mencionada no histórico de revisão.
