lexical_decisions:
- source_word: ζώνην
  choice: um cinto
  rationale: “Cinto” é a correspondência moderna e natural para ζώνη neste contexto, sem o caráter antiquado de “cinturão” ou “cinta”.
- source_word: μοι περιέβαλεν
  choice: pôs em volta de mim
  rationale: Reproduz o sentido de envolver ou colocar ao redor da pessoa, em português claro e digno.
- source_word: ὁμοίαν πορφύρας
  choice: semelhante à púrpura
  rationale: Mantém a formulação comparativa e algo incomum do grego, sem acrescentar “cor de” ou identificar um material específico.
