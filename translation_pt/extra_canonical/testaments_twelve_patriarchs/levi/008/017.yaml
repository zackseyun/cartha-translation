  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐξ αὐτῶν⁹⁴ ἔσονται ἱερεῖς⁹⁵ καὶ⁹⁶ κριταὶ καὶ⁹⁶ γραμματεῖς· καὶ⁹⁷ ἐπὶ στόματος αὐτῶν †ληφθήσεται⁹⁸ τὸ ἅγιον⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/017.yaml
  text: And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”
translation:
  language: pt
  text: E dentre eles haverá sacerdotes, juízes e escribas; e, pela boca deles, será recebido[a] o que é santo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega traduzida como “será recebido” está assinalada na edição como leitura textual incerta; também pode significar “será tomado”.
    reason: O obelo no texto-fonte indica que ληφθήσεται é considerado problemático ou possivelmente corrompido, e a incerteza deve ser visível ao leitor.
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: dentre eles
  rationale: Expressa com naturalidade a ideia de que essas pessoas surgirão do grupo anteriormente mencionado.
- source_word: ἱερεῖς καὶ κριταὶ καὶ γραμματεῖς
  choice: sacerdotes, juízes e escribas
  rationale: Mantém os três ofícios do grego em linguagem corrente e historicamente apropriada.
- source_word: ἐπὶ στόματος αὐτῶν
  choice: pela boca deles
  rationale: Preserva a imagem semítica do texto, que atribui à fala ou ao pronunciamento deles o meio pelo qual algo é recebido.
- source_word: τὸ ἅγιον
  choice: o que é santo
  rationale: Reproduz o neutro substantivado sem especificar indevidamente se se trata de uma coisa, ensino, objeto ou realidade santa.
- source_word: ληφθήσεται
  choice: será recebido
  rationale: Conserva a voz passiva e um dos sentidos diretos de λαμβάνω, sem tentar reparar conjecturalmente a leitura assinalada como problemática.
theological_decisions:
- issue: Identidade de τὸ ἅγιον
  choice: o que é santo
  alternative: a coisa santa / o Santo
  rationale: O grego neutro não identifica precisamente o referente. A tradução preserva essa abertura e evita transformá-lo em título pessoal masculino.
- issue: Função da expressão ἐπὶ στόματος αὐτῶν
  choice: pela boca deles
  alternative: segundo a palavra deles / por determinação deles
  rationale: A formulação literal conserva a possível tensão entre fala, testemunho e autoridade, sem escolher uma interpretação institucional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi levemente ajustada com pontuação natural, mas as imagens e ambiguidades relevantes do grego foram preservadas.
