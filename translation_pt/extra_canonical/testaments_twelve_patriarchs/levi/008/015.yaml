source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἡ δὲ παρουσία⁷⁹ αὐτοῦ ἀγαπητή⁸⁰ ἐστιν⁸¹ ὡς προφήτης⁸² ὑψίστου⁸³ ἐκ σπέρματος Ἀβραὰμ τοῦ⁸⁴ πατρὸς ἡμῶν⁸⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/015.yaml
  text: And his appearance is beloved, like a prophet of the Most High, from the seed of Abraham our father.
translation:
  language: pt
  text: E a sua aparência é amada, como a de um profeta do Altíssimo, da descendência de Abraão, nosso pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  choice: aparência
  rationale: Neste contexto, indica a manifestação ou o aspecto da pessoa; “aparência” é natural em português e acompanha a leitura contextual adotada, sem impor o sentido técnico posterior de “vinda”.
- source_word: ἀγαπητή
  choice: amada
  rationale: Preserva diretamente o valor afetivo do adjetivo grego e sua concordância com “aparência”.
- source_word: ὡς προφήτης ὑψίστου
  choice: como a de um profeta do Altíssimo
  rationale: 'A inserção de “a de” torna a comparação idiomática em português: a aparência é comparada à de um profeta, sem alterar a relação expressa pelo grego.'
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: da descendência de Abraão
  rationale: “Descendência” comunica naturalmente o sentido genealógico de σπέρμα, evitando o literalismo pouco corrente “semente”.
- source_word: τοῦ πατρὸς ἡμῶν
  choice: nosso pai
  rationale: Mantém a designação ancestral e coletiva do texto grego em português corrente e digno.
theological_decisions:
- issue: Valor de παρουσία
  choice: aparência
  alternative: presença; vinda
  rationale: O contexto favorece a manifestação ou aspecto da figura descrita. “Vinda” poderia importar um sentido escatológico técnico que o verso, isoladamente, não exige; “presença” é possível, mas menos natural nesta predicação.
- issue: Alcance da comparação com o profeta
  choice: a aparência é como a de um profeta do Altíssimo
  alternative: ele é como um profeta do Altíssimo
  rationale: A formulação conserva a ligação gramatical da comparação com παρουσία e evita transformar a comparação de aparência em identificação direta da pessoa como profeta.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A ordem final foi levemente ajustada por clareza, preservando a concisão e a tensão do grego.
