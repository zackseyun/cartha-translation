source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ λέγουσι⁶¹ πρός με· Λευί⁶², εἰς τρεῖς ἀρχὰς διαιρεθήσεται⁶³ τὸ σπέρμα σου⁶⁴, εἰς⁶⁵ σημεῖον⁶⁶ *δόξης Κυρίου ἐπερχομένου⁶⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/011.yaml
  text: And they say to me, “Levi, your seed will be divided into three divisions, as a sign of the glory of the Lord who is coming.”
translation:
  language: pt
  text: 'E eles me dizem: “Levi, a sua descendência será dividida em três divisões, como sinal da glória do Senhor que vem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα σου
  choice: a sua descendência
  rationale: No contexto genealógico, σπέρμα designa os descendentes de Levi; “descendência” comunica isso com naturalidade e dignidade em português atual.
- source_word: εἰς τρεῖς ἀρχὰς
  choice: em três grupos
  rationale: ἀρχάς pode sugerir começos, chefias ou divisões. Em combinação com διαιρεθήσεται, “três grupos” preserva o sentido distributivo sem impor a ideia específica de três cargos.
- source_word: εἰς σημεῖον
  choice: como sinal
  rationale: A construção indica função ou resultado; “como sinal” é natural em português e acompanha a ambiguidade relacional do grego.
- source_word: Κυρίου ἐπερχομένου
  choice: do Senhor que vem
  rationale: O particípio presente pode indicar aquele que está vindo ou que há de vir. “Que vem” mantém o caráter iminente e evita especificar além do texto.
theological_decisions:
- issue: Referência de “que vem” em Κυρίου ἐπερχομένου
  choice: 'Ligação gramatical direta com “Senhor”: “do Senhor que vem”'
  alternative: “da glória vindoura do Senhor”
  rationale: O genitivo Κυρίου e o particípio genitivo ἐπερχομένου concordam entre si; a tradução mantém essa relação sem identificar explicitamente a figura segundo uma leitura confessional.
- issue: Natureza das três ἀρχαί
  choice: “três grupos”
  alternative: “três ofícios” ou “três ordens”
  rationale: O versículo não define claramente funções institucionais. A formulação escolhida evita importar uma estrutura sacerdotal específica e conserva a abertura semântica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação é solene sem arcaísmo; usa “descendência” em vez do literalismo pouco claro “semente” e evita interpretar ἀρχάς como cargos definidos.
