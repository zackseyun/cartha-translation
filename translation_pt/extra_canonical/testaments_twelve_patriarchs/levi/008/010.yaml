source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ⁵⁵ ἕβδομος *διάδημά μοι ἱερατείας περιέθηκεν καὶ⁵⁶ ἐπλήρωσε⁵⁷ τὰς χεῖράς μου θυμιάματος⁵⁸, ὥστε ἱερατεύειν με⁵⁹ Κυρίῳ, *τῷ θεῷ⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/010.yaml
  text: And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.
translation:
  language: pt
  text: E o sétimo pôs sobre mim um diadema do sacerdócio e encheu minhas mãos de incenso, para que eu servisse como sacerdote ao Senhor Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάδημα ἱερατείας
  choice: um diadema do sacerdócio
  rationale: Conserva a imagem régia e cultual do grego, bem como a relação genitiva, sem substituí-la por um termo interpretativo mais específico.
- source_word: ἐπλήρωσε τὰς χεῖράς μου θυμιάματος
  choice: encheu minhas mãos de incenso
  rationale: Mantém a expressão concreta do texto grego e seu possível eco de investidura sacerdotal, sem explicitar além do que a frase afirma.
- source_word: ἱερατεύειν
  choice: servisse como sacerdote
  rationale: Expressa de modo natural em português o exercício da função sacerdotal indicado pelo verbo grego.
- source_word: Κυρίῳ, τῷ θεῷ
  choice: ao Senhor Deus
  rationale: Reproduz de forma idiomática a designação grega, entendendo a aposição como uma unidade titulativa, conforme também sugere a tradição textual consultada.
theological_decisions:
- issue: Possível sentido técnico de investidura em «encher as mãos»
  choice: Preservar literalmente «encheu minhas mãos de incenso»
  alternative: «consagrou-me com incenso» ou «investiu-me no sacerdócio»
  rationale: As alternativas resolveriam a imagem em favor de uma interpretação ritual específica; a tradução conserva tanto a ação concreta quanto sua possível ressonância técnica.
- issue: Relação do serviço sacerdotal com κύριος e θεός
  choice: «ao Senhor Deus»
  alternative: «ao Senhor, o Deus» ou «diante do Senhor Deus»
  rationale: O dativo indica o destinatário do serviço sacerdotal; «ao» evita importar a ideia espacial de «diante de», ausente no grego.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do original sem rigidez excessiva. «Diadema» e «sacerdócio» preservam o registro solene e cultual do trecho.
