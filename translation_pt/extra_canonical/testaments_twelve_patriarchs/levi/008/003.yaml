base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/003.yaml
  text: And each one of them was carrying something, and they placed it on me and said to me, “From now on, become a priest—you and all your seed.”
translation:
  language: pt
  text: 'E cada um deles trazia algo, e o colocaram sobre mim e me disseram: “De agora em diante, torne-se sacerdote — você e toda a sua descendência.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάζοντες ἦσαν
  choice: trazia algo
  rationale: A construção indica ação contínua, mas não traz objeto expresso. “Algo” preserva essa indeterminação e concorda naturalmente com “cada um”.
- source_word: ἐπέθηκαν μοι
  choice: o colocaram sobre mim
  rationale: Traduz o sentido concreto de pôr ou colocar sobre alguém; o pronome retoma o objeto indeterminado sem especificá-lo.
- source_word: γενοῦ εἰς ἱερέα
  choice: torne-se sacerdote
  rationale: Expressa de modo natural em português a ordem para passar a exercer ou assumir a condição sacerdotal.
- source_word: πᾶν τὸ σπέρμα σου
  choice: toda a sua descendência
  rationale: Embora σπέρμα signifique literalmente “semente”, aqui funciona coletivamente para os descendentes; “descendência” comunica isso com clareza e dignidade em português.
theological_decisions:
- issue: Alcance coletivo de σπέρμα
  choice: toda a sua descendência
  alternative: toda a sua semente
  rationale: A opção escolhida preserva o sentido genealógico coletivo sem introduzir uma leitura denominacional nem produzir uma expressão pouco natural em português.
- issue: Relação entre Levi e seus descendentes no imperativo
  choice: “torne-se sacerdote — você e toda a sua descendência”
  alternative: “seja sacerdote, você e toda a sua descendência”
  rationale: Mantém a tensão do grego, no qual o imperativo singular dirigido a Levi é seguido pela inclusão de sua descendência, sem reformular a frase em imperativos plurais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ausência de objeto explícito no grego foi preservada por “algo”; o travessão mantém a inclusão enfática de Levi e de sua descendência.
