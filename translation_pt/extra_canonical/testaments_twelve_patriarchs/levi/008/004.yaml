  text: E o primeiro me ungiu com óleo santo e me deu um bastão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma vara”. O texto grego não qualifica o objeto como sacerdotal.'
