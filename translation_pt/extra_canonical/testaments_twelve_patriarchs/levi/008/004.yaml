lexical_decisions:
- source_word: ἤλειψέ με ἐλαίῳ ἁγίῳ
  choice: me ungiu com óleo santo
  rationale: Reproduz de modo natural e fiel o ato de ungir com óleo consagrado, preservando sua dimensão ritual.
- source_word: ῥάβδον
  choice: bastão
  rationale: O grego significa de modo amplo vara ou bastão. A qualificação sacerdotal presente na camada inglesa não está expressa neste versículo grego e, por isso, não foi incorporada ao texto principal.
theological_decisions:
- issue: Caráter sacerdotal do bastão
  choice: Manter apenas “bastão” no texto
  alternative: “bastão sacerdotal”
  rationale: Embora o contexto possa sugerir uma investidura sacerdotal, o adjetivo “sacerdotal” não aparece no texto grego fornecido. A tradução evita tornar explícita uma interpretação contextual.
translation_notes:
  register: Português moderno, claro e digno. A coordenação simples acompanha a estrutura grega, e “o primeiro” preserva a referência contextual sem explicitação adicional.
