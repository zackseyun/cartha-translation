base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/005.yaml
  text: And the second washed me with the Lord's pure water, and fed me holy bread and wine, and put around me a holy and glorious robe.
translation:
  language: pt
  text: E o segundo me lavou com a água pura do Senhor, deu-me de comer pão e vinho santos e me revestiu com uma veste santa e gloriosa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλουσέ με ὕδατι κυρίου καθαρῷ
  choice: me lavou com a água pura do Senhor
  rationale: Reproduz com naturalidade o ato de lavar e conserva o genitivo κυρίου ligado à água, sem definir além do texto o sentido dessa relação.
- source_word: ἐψώμισέν με
  choice: deu-me de comer
  rationale: O verbo pode indicar alimentar ou dar um bocado de comida; esta formulação corrente preserva a ação concreta sem impor uma conotação ritual ausente do verbo por si só.
- source_word: ἄρτον καὶ οἶνον ἅγιον
  choice: pão e vinho santos
  rationale: Mantém os dois alimentos e verte ἅγιον em sentido atributivo. Embora o adjetivo esteja no singular neutro, o contexto o apresenta como qualificação da expressão coordenada; o plural em português evita sugerir que somente o vinho é santo.
- source_word: περιέθηκε μοι στολὴν
  choice: me revestiu com uma veste
  rationale: Expressa idiomaticamente a ação de colocar uma veste ao redor da pessoa, preservando a imagem de investidura.
- source_word: ἁγίαν καὶ ἔνδοξον
  choice: santa e gloriosa
  rationale: Conserva os dois qualificativos aplicados à veste, em linguagem digna e direta.
theological_decisions:
- issue: Possíveis alusões sacramentais no lavar, no pão e no vinho
  choice: Traduzir literalmente as imagens, sem acrescentar terminologia como “batismo” ou “eucaristia”
  alternative: Explicitar os atos como ritos sacramentais
  rationale: O grego menciona água, pão, vinho e veste santos, mas não nomeia sacramentos; a tradução preserva as imagens e sua tensão teológica sem interpretá-las denominacionalmente.
- issue: Relação expressa pelo genitivo κυρίου
  choice: “a água pura do Senhor”
  alternative: “água pura vinda do Senhor” ou “água pura dedicada ao Senhor”
  rationale: O genitivo admite mais de uma nuance. A formulação escolhida conserva a ambiguidade de pertencimento, origem ou associação, sem a resolver silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. “Veste” preserva o tom elevado e a imagem cerimonial; a colocação pronominal combina naturalidade contemporânea com registro literário.
