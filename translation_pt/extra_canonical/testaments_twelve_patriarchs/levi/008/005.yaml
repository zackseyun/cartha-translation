  source_fidelity: 'O texto português reproduz adequadamente a sequência e os elementos do grego: o segundo lava o visionário com «a água pura do Senhor», alimenta-o com pão e vinho santos e lhe põe uma veste santa e gloriosa. «Água pura do Senhor» conserva sem explicação indevida a relação genitiva de κυρίου. A extensão de «santos» a «pão e vinho» é uma solução contextual justificável para o singular neutro ἅγιον na expressão coordenada e evita em português a impressão artificial de que a santidade qualifica exclusivamente o vinho.'
