  text: And the third put on me a linen garment, like an ephod.
translation:
  language: pt
  text: E o terceiro me vestiu com uma roupa de linho fino, semelhante a um éfode.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυσσίνην
  choice: uma roupa de linho fino
  rationale: O adjetivo substantivado feminino indica uma peça de tecido de linho fino; “roupa” mantém a referência genérica sem especificar um tipo não expresso no grego.
- source_word: περιέθηκεν
  choice: me vestiu com
  rationale: No contexto de uma peça de roupa colocada ao redor do corpo, esta formulação é natural em português e preserva a ação do verbo.
- source_word: ἐφούδ
  choice: éfode
  rationale: Transliteração portuguesa tradicional do termo cultual, preservando a referência sacerdotal específica.
- source_word: ὁμοίαν
  choice: semelhante a
  rationale: Mantém a comparação explícita sem afirmar identidade entre a roupa de linho e o éfode.
theological_decisions:
- issue: Natureza da veste sacerdotal
  choice: roupa de linho fino, semelhante a um éfode
  alternative: um éfode de linho fino
  rationale: O texto distingue a peça e o éfode por meio de uma comparação; a tradução evita fundi-los e não acrescenta uma identificação sacerdotal mais precisa do que a fonte permite.
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual reconhecível. A construção conserva a comparação e a relativa indefinição do tipo de vestimenta.
