  text: And the first lot will be great, and no other will arise above it.
translation:
  language: pt
  text: E a primeira porção será grande, e nenhuma outra surgirá acima dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλῆρος
  choice: porção
  rationale: No contexto, designa a parte ou posição atribuída por sorte; “porção” preserva esse sentido sem sugerir apenas o objeto usado no sorteio.
- source_word: μέγας
  choice: grande
  rationale: Equivalente direto que mantém aberta a natureza da grandeza mencionada.
- source_word: ἕτερος
  choice: outra
  rationale: Traduz explicitamente a ideia de outra porção, cujo referente é recuperado pelo feminino em português.
- source_word: ὑπὲρ αὐτόν
  choice: acima dela
  rationale: Preserva a imagem comparativa e espacial do grego, sem reformulá-la simplesmente como “maior do que ela”.
- source_word: οὐ γενήσεται
  choice: nenhuma ... surgirá
  rationale: Expressa a ideia de vir a existir ou aparecer, de modo natural em português e coerente com a formulação do período.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima ao grego. “Porção” foi preferido a “sorte” para evitar a leitura moderna de acaso ou fortuna, preservando a ideia de uma parte atribuída.
