source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ὁ δὲ⁷⁵ τρίτος *ἐπικληθήσεται αὐτῷ ὄνομα καινόν⁷⁶, ὅτι βασιλεὺς †ἐκ τοῦ†⁷⁷ Ἰούδα ἀναστήσεται καὶ ποιήσει *ἱερατείαν νέαν, κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη⁷⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/014.yaml
  text: And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, according to the pattern of the nations, for all the nations.
translation:
  language: pt
  text: E o terceiro será chamado por um novo nome, porque um rei se levantará de Judá e estabelecerá um novo sacerdócio, segundo o modelo das nações, para todas as nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικληθήσεται αὐτῷ ὄνομα καινόν
  choice: será chamado por um novo nome
  rationale: Expressa de modo natural em português a atribuição de um novo nome, sem acrescentar quem o dará.
- source_word: ἀναστήσεται
  choice: se levantará
  rationale: Preserva a formulação bíblica e o sentido de surgir ou apresentar-se como rei.
- source_word: ποιήσει ἱερατείαν νέαν
  choice: estabelecerá um novo sacerdócio
  rationale: No contexto, ποιήσει indica instituir ou estabelecer, enquanto ἱερατεία designa o sacerdócio como ordem ou função.
- source_word: κατὰ τὸν τύπον
  choice: segundo o modelo
  rationale: Mantém o valor normativo ou comparativo de κατά com τύπος, em português claro e formal.
- source_word: τῶν ἐθνῶν ... πάντα τὰ ἔθνη
  choice: das nações ... todas as nações
  rationale: Conserva a repetição do mesmo termo grego e sua abrangência coletiva, sem substituí-lo por 'gentios'.
theological_decisions:
- issue: Relação entre o novo sacerdócio e as nações
  choice: segundo o modelo das nações, para todas as nações
  alternative: à maneira dos gentios, em favor de todos os gentios
  rationale: A tradução preserva a construção e a repetição gregas sem explicar se o 'modelo' é institucional, profético ou de outro tipo, nem restringir o alcance de ἔθνη.
- issue: Identidade do terceiro e do rei
  choice: manter as referências sem identificação adicional
  alternative: explicitar uma interpretação messiânica ou sacerdotal
  rationale: O versículo não identifica expressamente essas figuras; a tradução mantém a tensão teológica do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha de perto o grego, mas evita rigidez desnecessária.
