    text: O texto grego da expressão “para a cabeça” é incerto.
    reason: As cruzes críticas em torno de τῆς κεφαλῆς indicam dúvida textual na edição-fonte.
  revision_rationale: A revisão conserva todas as escolhas lexicais e a ambiguidade textual da tradução, mas ajusta o particípio presente grego e torna natural em português a construção reflexiva do imperativo «vestir-se».
