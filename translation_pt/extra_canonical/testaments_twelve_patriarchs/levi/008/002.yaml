source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶδον⁵ ἑπτὰ ἄνδρας⁶ ἐν ἐσθῆτι⁷ λευκῇ⁸ *λέγοντάς μοι⁹· Ἀναστὰς ἔνδυσαι τὴν στολὴν τῆς ἱερατείας, καὶ¹⁰ τὸν στέφανον τῆς δικαιοσύνης¹¹, *καὶ τὸ λόγιον¹² τῆς συνέσεως καὶ τὸν ποδήρη¹³ τῆς ἀληθείας καὶ τὸ πέταλον¹⁴ τῆς πίστεως καὶ τὴν μίτραν¹⁵ †τῆς κεφαλῆς†¹⁶ καὶ τὸ ἐφοὺδ τῆς προφητείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/002.yaml
  text: And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the breastpiece of understanding, and the full-length robe of truth, and the plate of faith, and the turban for the head, and the ephod of prophecy.”
translation:
  language: pt
  text: 'E vi sete homens vestidos de branco, dizendo-me: “Levanta-te e veste-te com a veste do sacerdócio, a coroa da justiça, o peitoral do entendimento, a túnica comprida da verdade, a lâmina da fé, o turbante para a cabeça[a] e o éfode da profecia.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego da expressão “para a cabeça” é incerto.
    reason: As cruzes críticas em torno de τῆς κεφαλῆς indicam dúvida textual na edição-fonte.
lexical_decisions:
- source_word: ἐσθῆτι λευκῇ
  choice: vestidos de branco
  rationale: Expressa de modo natural em português a ideia de vestimenta branca, sem exigir o singular coletivo do grego.
- source_word: στολὴν τῆς ἱερατείας
  choice: a veste do sacerdócio
  rationale: Mantém o caráter cerimonial de στολή e a relação explícita com o sacerdócio.
- source_word: λόγιον τῆς συνέσεως
  choice: o peitoral do entendimento
  rationale: Neste contexto de paramentos sacerdotais, λόγιον designa o peitoral, não um pronunciamento ou oráculo; συνέσεως é vertido por “entendimento”.
- source_word: ποδήρη τῆς ἀληθείας
  choice: a túnica comprida da verdade
  rationale: ποδήρης indica uma peça de roupa que se estende até os pés; “túnica comprida” comunica a forma sem recorrer a termo técnico obscuro.
- source_word: πέταλον τῆς πίστεως
  choice: a lâmina da fé
  rationale: πέταλον refere-se à lâmina ou placa sacerdotal, provavelmente de metal; “lâmina” preserva essa imagem cultual.
- source_word: μίτραν
  choice: o turbante
  rationale: Equivalente claro e corrente para a cobertura sacerdotal da cabeça.
- source_word: ἐφοὺδ
  choice: éfode
  rationale: Emprega a forma portuguesa tradicional do nome da vestimenta sacerdotal.
theological_decisions:
- issue: Sentido de πίστεως
  choice: fé
  alternative: fidelidade
  rationale: O grego pode abranger fé e fidelidade. “Fé” mantém a formulação nominal tradicional e a abertura semântica do contexto simbólico, sem impor uma interpretação específica.
- issue: Metáforas dos paramentos sacerdotais
  choice: preservar cada associação genitiva literalmente
  alternative: explicitar as virtudes como qualidades conferidas pelas vestes
  rationale: O texto apresenta uma série simbólica deliberadamente densa; a tradução não resolve a relação exata entre cada peça e sua qualidade abstrata.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacerdotal reconhecível. A enumeração e o paralelismo do grego foram preservados, enquanto construções pouco naturais foram suavizadas.
