lexical_decisions:
- source_word: ἔλαβεν ... γυναῖκα / ἔλαβον γυναῖκα
  choice: tomou uma mulher por esposa
  rationale: Mantém a fórmula matrimonial do grego e o tom genealógico, mas explicita em português atual que se trata de casamento.
- source_word: ἔτεκεν ... ἐξ αὐτῆς
  choice: ela lhe deu à luz
  rationale: Reflete diretamente o verbo de dar à luz e produz uma formulação natural em português, sem deslocar o foco para uma expressão causal artificial.
- source_word: υἱοί
  choice: filhos
  rationale: Neste contexto genealógico, o termo designa especificamente os descendentes masculinos enumerados.
- source_word: ἐν μιᾷ ἡμέρᾳ ἐγεννήθησαν
  choice: nasceram no mesmo dia
  rationale: Expressa de modo idiomático a coincidência da data de nascimento indicada pelo grego.
- source_word: ἱεράτευσα
  choice: exerci o sacerdócio
  rationale: Preserva o sentido verbal de desempenhar função sacerdotal; a alternativa mais literal é registrada em nota.
- source_word: ἰδού
  choice: eis que
  rationale: Conserva a força solene do marcador de atenção, adequada ao discurso testamentário.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: É a forma natural de tratamento patriarcal em português neste contexto; não altera a referência aos descendentes presentes.
- source_word: ἐνενηκοστῷ τετάρτῳ μου ἔτει
  choice: no nonagésimo quarto ano da minha vida
  rationale: Traduz o numeral do texto grego fornecido, que é noventa e quatro, sem seguir a leitura divergente de sessenta e quatro da camada inglesa.
theological_decisions:
- issue: Formas dos nomes genealógicos divergem de grafias bíblicas mais familiares
  choice: Conservar formas próximas ao grego, como Gersam, Lomné, Semeí, Abraam, Ozeel e Mooli.
  alternative: Normalizar todos os nomes segundo grafias correntes das Bíblias portuguesas.
  rationale: A prioridade do testemunho grego exige evitar harmonização silenciosa. Empregam-se apenas adaptações ortográficas necessárias à legibilidade portuguesa.
- issue: Joquebede é chamada de “minha filha”
  choice: Traduzir literalmente a relação de parentesco declarada no grego.
  alternative: Entender ou parafrasear “filha” como “descendente”.
  rationale: A formulação explícita do texto deve permanecer, inclusive a tensão genealógica que ela produz.
- issue: Idade de Levi quando Abraam tomou Joquebede por esposa
  choice: Traduzir “nonagésimo quarto ano”.
  alternative: Adotar “sexagésimo quarto ano”, como na camada inglesa fornecida.
  rationale: O texto grego apresentado traz ἐνενηκοστῷ τετάρτῳ, isto é, “nonagésimo quarto”; a tradução deve seguir diretamente a fonte original.
translation_notes:
  register: Português moderno, digno e acessível, com cadência genealógica e testamentária. Mantiveram-se fórmulas levemente elevadas, como “eis que” e “tomou uma mulher por esposa”, evitando arcaísmos excessivos. Os nomes foram transliterados de modo legível em português, sem harmonização genealógica silenciosa.
