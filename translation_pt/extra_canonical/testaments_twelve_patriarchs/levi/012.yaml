  text: 1. And Gersam took a wife, and by her he fathered Lomne and Semee. 2. And the sons of Kaath were Ambram, Isachar, Chebron, and Ozeel. 3. And the sons of Merari were Mooli and Mouses. 4. And in the sixty-fourth year of my life, Ambram took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt. 6. And behold, my children, you are the third generation. 7. Joseph died in the one hundred eighteenth year of my life.
translation:
  language: pt
  text: '1. Gersam tomou uma mulher por esposa e, por ela, gerou Lomné e Semee. 2. Os filhos de Caate foram Abraam, Issacar, Hebrom e Ozeel.[a] 3. Os filhos de Merari foram Mooli e Moisés.[b] 4. No nonagésimo quarto ano da minha vida, Abraam tomou para si como esposa Joquebede, minha filha,[c] porque ele e minha filha nasceram no mesmo dia. 5. Eu tinha oito anos quando entrei na terra de Canaã; dezoito, quando matei Siquém; dezenove, quando exerci o sacerdócio;[d] vinte e oito, quando tomei uma mulher por esposa; e quarenta e oito, quando entrei no Egito. 6. E eis que vocês, meus filhos, são a terceira geração. 7. José morreu no centésimo décimo oitavo ano da minha vida.


    [a] O texto grego apresenta alguns nomes em formas diferentes das grafias bíblicas mais conhecidas. A tradução conserva formas próximas às transmitidas em grego, sem harmonizá-las com outras genealogias.


    [b] As formas gregas destes nomes provavelmente correspondem a nomes da linhagem de Merari conhecidos das genealogias bíblicas; a tradução, porém, segue as formas aqui transmitidas.


    [c] A declaração “Joquebede, minha filha” cria uma tensão com tradições genealógicas bíblicas mais conhecidas. A tradução segue diretamente o texto grego, sem entender “filha” como “descendente”.


    [d] Ou: “prestei serviço sacerdotal”.'
