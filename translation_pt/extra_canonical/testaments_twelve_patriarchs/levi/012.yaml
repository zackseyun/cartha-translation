  naturalness: O português é claro, atual e apropriadamente solene. «Exerci o sacerdócio», «eis que» e a construção cronológica de 12:5 são naturais. A revisão de 12:1 mantém essa fluência.
  terminology: «Filhos», «minha filha», «tomou ... por esposa», «exerci o sacerdócio» e «terceira geração» são escolhas adequadas. Mantêm-se as formas não harmonizadas dos nomes conforme o testemunho grego, com adaptação ortográfica portuguesa moderada.
