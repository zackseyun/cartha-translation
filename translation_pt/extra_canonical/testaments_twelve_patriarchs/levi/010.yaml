  text: 1[v2]. And now, children, keep what I command you, since I have declared to you all that I heard from my fathers. 2[v2]. And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils from the Lord against him. 3. And you will act lawlessly in Israel, so that Jerusalem will not be able to bear it because of your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame. 4. And you will be scattered as captives among the nations, and there you will be for reproach and for a curse. 5. For the house which the Lord will choose shall be called Jerusalem[v5][v3], as the book of Enoch the righteous contains.
translation:
  language: pt
  text: '**Testamento de Levi 10**


    1. E agora, filhos, guardem tudo o que lhes ordeno, pois lhes anunciei tudo o que ouvi de meus antepassados.


    2. Eis que sou inocente da impiedade de vocês e da transgressão que cometerão na consumação dos tempos [contra o Salvador do mundo, o Messias][a], desviando Israel e suscitando contra ele grandes males vindos do Senhor.[b]


    3. Vocês agirão sem lei em Israel, de modo que Jerusalém não poderá suportar isso por causa da maldade de vocês. Mas o véu[c] do templo será rasgado, para que já não encubra a vergonha de vocês.


    4. Vocês serão dispersos como cativos entre as nações e ali se tornarão objeto de desprezo e maldição.


    5. Pois a casa que o Senhor escolher será chamada Jerusalém, conforme consta no livro de Enoque, o Justo.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “contra o Salvador do mundo, o Messias” aparecem no testemunho grego usado aqui, mas muitos estudiosos as consideram uma expansão cristã posterior; por isso, foram mantidas entre colchetes.
    reason: textual_variant
  - marker: b
    text: A frase “suscitando contra ele grandes males vindos do Senhor” tem sintaxe difícil. O referente de “ele” pode ser entendido de maneiras diferentes.
    reason: alternative_reading
  - marker: c
    text: Ou “cortina”. A imagem se refere à cortina interior do templo.
    reason: lexical_alternative
  - marker: d
    text: A referência a Enoque reflete o ambiente literário mais amplo do período do Segundo Templo, no qual livros ancestrais considerados autorizados podiam ser citados fora do cânon bíblico posterior.
    reason: cultural_note
lexical_decisions:
- source_word: φυλάξατε
  choice: guardem
  rationale: No contexto de mandamentos, exprime observância obediente em português atual, sem perder a força exortativa.
- source_word: ἐντέλλομαι
  choice: ordeno
  rationale: Preserva a autoridade testamentária e a força do encargo dado por Levi.
- source_word: ἀθῷός εἰμι
  choice: sou inocente
  rationale: Comunica que Levi não é responsável pelos pecados futuros que anuncia.
- source_word: ἀσεβείας
  choice: impiedade
  rationale: Mantém a dimensão religiosa da ofensa, além da simples maldade moral.
- source_word: παραβάσεως
  choice: transgressão
  rationale: Preserva a ideia de violação de um limite ou mandamento conhecido.
- source_word: συντελείᾳ τῶν αἰώνων
  choice: consumação dos tempos
  rationale: Conserva o registro apocalíptico; 'tempos' é mais natural em português do que o literal 'eras', sem reduzir a expressão a um chavão escatológico.
- source_word: σωτῆρα
  choice: Salvador
  rationale: Traduz diretamente o título grego e mantém seu peso no contexto profético.
- source_word: χριστόν
  choice: Messias
  rationale: Representa o uso titular de χριστός e conserva sua matriz judaica.
- source_word: πλανῶντες
  choice: desviando
  rationale: Expressa a ação de levar Israel para fora do caminho, com fluência em português.
- source_word: ἐπεγείροντες
  choice: suscitando
  rationale: Mantém o sentido causativo de provocar ou fazer surgir os males anunciados.
- source_word: κακὰ μεγάλα
  choice: grandes males
  rationale: Segue de perto o grego e conserva a severidade profética sem especificar indevidamente se são calamidades ou juízos.
- source_word: ἀνομήσετε
  choice: agirão sem lei
  rationale: Reproduz verbalmente a conduta contrária à lei, sem transformar o verbo em conceito abstrato.
- source_word: καταπέτασμα
  choice: véu
  rationale: Termo tradicional e inteligível para a cortina interior do templo; a alternativa lexical é registrada em nota.
- source_word: εἰς ὄνειδος καὶ εἰς κατάραν
  choice: objeto de desprezo e maldição
  rationale: Forma idiomática em português que preserva os dois resultados da dispersão.
- source_word: περιέχει ἡ βίβλος
  choice: conforme consta no livro
  rationale: Transmite naturalmente que o conteúdo citado se encontra no livro de Enoque.
theological_decisions:
- issue: Expressão entre colchetes no versículo 2 sobre o Salvador do mundo, o Messias
  choice: Mantida no texto principal entre colchetes
  alternative: Omiti-la como expansão cristã secundária ou incluí-la sem sinalização textual
  rationale: A expressão aparece no testemunho grego fornecido, mas é frequentemente considerada uma expansão cristã posterior. Os colchetes preservam tanto o testemunho quanto a incerteza textual.
- issue: Referente de ἐπ᾿ αὐτόν na expressão sobre os grandes males
  choice: Traduzido literalmente como 'contra ele', com nota sobre a ambiguidade
  alternative: Identificar explicitamente o referente como Israel, o Messias ou os transgressores
  rationale: A sintaxe e o referente do pronome são difíceis. A tradução evita resolver no texto uma ambiguidade genuína.
- issue: Rasgar do véu do templo no versículo 3
  choice: Mantido como imagem profética de juízo e exposição da vergonha
  alternative: Explicitar uma alusão aos relatos da paixão ou interpretar a imagem apenas de modo simbólico
  rationale: O grego afirma que o véu será rasgado para deixar de encobrir a vergonha; a tradução não impõe uma identificação canônica posterior.
- issue: A casa escolhida pelo Senhor ser chamada Jerusalém
  choice: Preservada a formulação direta do texto grego
  alternative: Reformular 'casa' como templo ou entender Jerusalém apenas como localização
  rationale: A relação entre a casa e o nome Jerusalém é incomum, mas está expressa no testemunho e não deve ser harmonizada silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural, mantém o tom profético e testamentário e evita arcaísmos desnecessários. As ambiguidades textuais e sintáticas são preservadas e explicadas em notas, sem impor uma interpretação denominacional.
