base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/004.yaml
  text: And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.
translation:
  language: pt
  text: E naquele tempo exterminei os filhos de Hamor, conforme está escrito nas tábuas dos pais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσα
  choice: exterminei
  rationale: No contexto da ação contra os filhos de Hamor, o verbo exprime levá-los ao fim ou destruí-los; “exterminei” preserva a força do grego de modo natural em português.
- source_word: τοὺς υἱοὺς Ἐμμώρ
  choice: os filhos de Hamor
  rationale: Tradução direta do sintagma; “Hamor” segue a forma portuguesa bíblica reconhecível do nome próprio.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: nas tábuas dos pais
  rationale: Mantém literalmente tanto “tábuas” quanto o genitivo “dos pais”, sem acrescentar “celestiais”, termo ausente do texto grego.
theological_decisions:
- issue: Natureza das tábuas mencionadas
  choice: nas tábuas dos pais
  alternative: nas tábuas celestiais dos pais
  rationale: O grego não contém termo equivalente a “celestiais”; a tradução preserva a formulação e a possível ambiguidade da fonte sem explicação teológica importada.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe próxima da fonte. “Conforme está escrito” reproduz naturalmente a fórmula καθὼς γέγραπται.
