  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/006.yaml
  text: And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down.”
translation:
  language: pt
  text: 'E ele disse: “Eu sou o anjo que intercede pelo povo de Israel, para que não sejam feridos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραιτούμενος
  choice: intercede
  rationale: No particípio médio, o verbo pode expressar súplica ou apelo em favor de alguém; “intercede” transmite naturalmente essa atuação mediadora sem especificar a quem o pedido é dirigido.
- source_word: τὸ γένος Ἰσραήλ
  choice: o povo de Israel
  rationale: Embora γένος possa significar “linhagem”, “raça” ou “povo”, neste contexto “povo de Israel” é idiomático, digno e evita conotações modernas indevidas de “raça”.
- source_word: πατάξαι
  choice: seja ferido
  rationale: O verbo πατάσσω significa golpear ou ferir e pode, conforme o contexto, implicar morte. “Seja ferido” conserva a formulação mais ampla do grego, sem acrescentar “morto” ou “completamente”.
theological_decisions:
- issue: A função protetora do anjo em favor de Israel
  choice: “o anjo que intercede pelo povo de Israel”
  alternative: “o anjo que suplica em favor do povo de Israel”
  rationale: “Intercede” preserva a linguagem mediadora do texto sem definir o estatuto teológico do anjo nem introduzir uma doutrina específica.
- issue: Sujeito implícito de τοῦ μὴ πατάξαι αὐτούς
  choice: 'Construção passiva: “para que não seja ferido”'
  alternative: “para que [alguém] não os fira”
  rationale: O grego não nomeia explicitamente o agente do golpe. A passiva portuguesa mantém essa indeterminação e evita identificar indevidamente o agente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O singular coletivo “povo” exige “não seja ferido”; a tradução não incorpora a continuação presente em versões mais longas, pois ela não consta do texto grego fornecido.
