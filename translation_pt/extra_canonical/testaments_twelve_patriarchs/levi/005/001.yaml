  text: Καὶ †ἐν τούτῳ¹ ἤνοιξέ μοι² *ὁ ἄγγελος³ τὰς πύλας τοῦ οὐρανοῦ· καὶ εἶδον τὸν *ἅγιον ὕψιστον ἐπὶ θρόνου καθήμενον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/001.yaml
  text: And in this, the angel opened to me the gates of heaven, and I saw the Holy Most High seated on a throne.
translation:
  language: pt
  text: E, nesse momento[a], o anjo abriu para mim as portas do céu, e eu vi o Santo Altíssimo sentado em um trono.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: nisso.'
    reason: A expressão grega ἐν τούτῳ pode ser entendida de modo temporal (“nesse momento”) ou mais literalmente como referência ao que precede (“nisso”).
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: nesse momento
  rationale: Expressa de modo natural a possível força temporal da locução grega, sem ocultar em nota a leitura mais literal “nisso”.
- source_word: ἤνοιξέ μοι
  choice: abriu para mim
  rationale: Reproduz o dativo de interesse de maneira clara e idiomática em português.
- source_word: τὰς πύλας τοῦ οὐρανοῦ
  choice: as portas do céu
  rationale: Mantém a imagem concreta e a determinação do texto grego.
- source_word: τὸν ἅγιον ὕψιστον
  choice: o Santo Altíssimo
  rationale: Conserva os dois títulos/adjetivos substantivados e evita inserir explicitamente “Deus”, termo não presente na frase.
- source_word: ἐπὶ θρόνου καθήμενον
  choice: sentado em um trono
  rationale: Verte naturalmente o particípio e preserva a referência indefinida a um trono.
theological_decisions:
- issue: Identidade daquele que está no trono
  choice: o Santo Altíssimo
  alternative: o Deus santo e altíssimo
  rationale: A tradução mantém a formulação explícita do grego sem acrescentar o substantivo “Deus”, embora o contexto e os títulos apontem para uma figura divina.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe fluente e preservação da imagem visionária. A repetição de “e” acompanha o encadeamento narrativo do grego.
