  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/005.yaml
  text: And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in the day of affliction.”
translation:
  language: pt
  text: 'E eu lhe disse: “Eu te imploro, Senhor, ensina-me o teu nome, para que eu te invoque no dia da aflição.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέομαί σου
  choice: Eu te imploro
  rationale: Expressa de modo natural e digno o pedido insistente do verbo δέομαι com o pronome no genitivo.
- source_word: δίδαξόν με
  choice: ensina-me
  rationale: Reproduz diretamente o imperativo aoristo e mantém a formulação simples do grego.
- source_word: ἐπικαλέσομαί σε
  choice: eu te invoque
  rationale: “Invocar” preserva o sentido religioso de apelar diretamente ao Senhor, mais preciso aqui do que apenas “chamar”.
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: no dia da aflição
  rationale: Mantém a construção definida e solene, com θλίψεως traduzido por “aflição”.
theological_decisions:
- issue: O sentido de conhecer o nome divino
  choice: Mantida literalmente a expressão “ensina-me o teu nome”
  alternative: “revela-me o teu nome”
  rationale: O texto traz δίδαξόν, “ensina”, e não um verbo específico para “revelar”; a tradução evita explicar ou ampliar a possível função teológica do nome.
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla compreensão no Brasil e em outros contextos lusófonos. A colocação pronominal em “ensina-me” conserva solenidade sem soar arcaica.
