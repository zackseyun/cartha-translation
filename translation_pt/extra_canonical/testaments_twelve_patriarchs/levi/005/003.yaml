  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/003.yaml
  text: Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Execute vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”
translation:
  language: pt
  text: 'Então o anjo me fez descer à terra, deu-me uma arma e uma espada e me disse: “Tome vingança em Siquém por Diná, sua irmã. Eu estarei com você, porque o Senhor me enviou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατήγαγέν
  choice: me fez descer
  rationale: Expressa naturalmente o movimento descendente e a ação causativa do anjo no contexto da visão.
- source_word: ὅπλον
  choice: arma
  rationale: O termo é amplo e designa um instrumento de combate; evita restringi-lo indevidamente a “escudo”.
- source_word: ῥομφαίαν
  choice: espada
  rationale: Equivalente claro e corrente para a arma cortante mencionada, preservando a coordenação incomum “uma arma e uma espada” do grego.
- source_word: Ποίησον ἐκδίκησιν
  choice: Execute a vingança
  rationale: Mantém a força imperativa e o sentido judicial ou retributivo de ἐκδίκησις em registro digno, sem suavizar a ordem.
- source_word: ὑπὲρ Δείνας
  choice: por Diná
  rationale: Preserva de modo conciso a ideia de agir em favor de Diná ou em resposta ao que lhe aconteceu, sem especificar além do grego.
- source_word: Συχὲμ
  choice: Siquém
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do topônimo bíblico.
theological_decisions:
- issue: Atribuição da ordem de vingança e do envio
  choice: Conservar explicitamente que o anjo ordena a vingança, promete acompanhar Levi e afirma ter sido enviado pelo Senhor.
  alternative: Atenuar a ordem ou tornar menos direta a relação entre a missão do anjo e o Senhor.
  rationale: O texto grego apresenta essa tensão de forma explícita; a tradução não deve amenizá-la nem acrescentar uma justificativa teológica ausente da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação preserva a repetição semântica de “arma e espada” e a força da ordem, evitando linguagem arcaica ou interpretação denominacional.
