lexical_decisions:
- source_word: ἔξυπνος γενόμενος
  choice: quando despertei
  rationale: A expressão idiomática indica que Levi acordou ou despertou; a oração temporal reproduz com naturalidade a relação com a ação principal.
- source_word: εὐλόγησα
  choice: bendisse
  rationale: Preserva o sentido religioso de louvar ou declarar bendito, mantendo correspondência direta com o verbo grego.
- source_word: τὸν ὕψιστον
  choice: o Altíssimo
  rationale: Título divino tradicional, claro e fiel ao superlativo substantivado grego.
theological_decisions:
- issue: Referência divina em τὸν ὕψιστον
  choice: o Altíssimo
  alternative: o Deus Altíssimo
  rationale: O texto grego traz apenas o título substantivado, sem θεός; acrescentar “Deus” explicitaria algo implícito, mas não necessário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a sequência narrativa e a oração temporal do grego sem soar artificial.
