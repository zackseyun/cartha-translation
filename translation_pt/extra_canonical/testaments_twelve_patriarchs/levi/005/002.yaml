  text: And he said to me, “Levi, to you I have given the blessings of the priesthood until I come and dwell in the midst of Israel.”
translation:
  language: pt
  text: 'E ele me disse: “Levi, a você dei as bênçãos do sacerdócio, até que eu venha e habite no meio de Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: as bênçãos do sacerdócio
  rationale: Reproduz de modo claro e direto a construção genitiva grega, sem especificar uma relação mais estreita do que o texto exige.
- source_word: κατοικήσω
  choice: habite
  rationale: Expressa residência ou permanência, mantendo o sentido de κατοικέω e o registro solene do contexto.
- source_word: ἐν μέσῳ τοῦ Ἰσραήλ
  choice: no meio de Israel
  rationale: Preserva a formulação espacial e teologicamente sugestiva do grego sem explicitar se Israel designa o povo ou seu território.
theological_decisions:
- issue: Referente do sujeito de “venha e habite”
  choice: Manter a primeira pessoa sem identificar explicitamente o falante
  alternative: Explicitar “Deus” ou outra figura celestial como sujeito
  rationale: O versículo grego apenas conserva a fala na primeira pessoa; nomear o sujeito resolveria uma questão que depende do contexto mais amplo.
- issue: Valor temporal de ἕως com subjuntivo
  choice: “até que eu venha e habite”
  alternative: “até eu vir habitar” ou uma leitura que implique o fim das bênçãos nesse momento
  rationale: A tradução preserva o limite temporal expresso, sem decidir se a chegada encerra, culmina ou confirma as bênçãos sacerdotais.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros e preservação da solenidade do discurso.
