base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/001.yaml
  text: A copy of the words of Levi, which he ordained for his sons about all that they would do, and all that would happen to them[a] until the day of judgment.
translation:
  language: pt
  text: Cópia das palavras de Levi, que ele deixou como instruções a seus filhos acerca de tudo o que fariam e de tudo o que lhes aconteceria[a] até o dia do juízo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de tudo o que lhes sobreviria”. A expressão grega sugere literalmente aquilo que viria ao encontro deles.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: Cópia das palavras
  rationale: Reproduz de modo direto a fórmula de título do grego, sem transformar ἀντίγραφον em um gênero literário mais específico.
- source_word: διέθετο
  choice: deixou como instruções
  rationale: O verbo pode envolver dispor, ordenar ou estabelecer. A formulação portuguesa comunica um legado deliberadamente dirigido aos filhos sem impor a ideia técnica de testamento.
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: acerca de tudo o que fariam
  rationale: Mantém a abrangência de πάντα e apresenta o futuro a partir da perspectiva narrativa do título.
- source_word: ὅσα συναντήσει αὐτοῖς
  choice: tudo o que lhes aconteceria
  rationale: Expressa naturalmente o idioma grego de coisas que 'encontrariam' ou sobreviriam a eles, preservando a alternativa mais literal em nota.
- source_word: ἕως ἡμέρας κρίσεως
  choice: até o dia do juízo
  rationale: Formulação corrente e digna que conserva a referência escatológica sem explicá-la além do texto.
theological_decisions:
- issue: Alcance do 'dia do juízo'
  choice: Manter simplesmente 'o dia do juízo'
  alternative: Explicitar a identidade ou a natureza desse juízo
  rationale: O grego não especifica aqui quem julga nem desenvolve a doutrina do evento; a tradução preserva essa concisão e tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe conserva o caráter de título antigo, mas evita rigidez excessiva. O marcador [a] está presente no texto principal.
