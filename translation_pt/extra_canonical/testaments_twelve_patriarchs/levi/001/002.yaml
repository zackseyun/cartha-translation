base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/002.yaml
  text: 'For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: pt
  text: 'Pois ele estava com boa saúde quando os chamou para junto de si; mas lhe foi revelado que estava prestes a morrer. E, quando eles se reuniram, disse-lhes:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: estava com boa saúde
  rationale: Expressa de modo natural o estado de saúde indicado pelo particípio grego, sem sugerir apenas ausência momentânea de doença.
- source_word: ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν
  choice: os chamou para junto de si
  rationale: Preserva tanto o ato de chamar quanto o movimento relacional em direção a ele.
- source_word: ἀπεκαλύφθη
  choice: lhe foi revelado
  rationale: Mantém a voz passiva e não especifica o agente da revelação, como no grego.
- source_word: μέλλει ἀποθνήσκειν
  choice: estava prestes a morrer
  rationale: Reproduz a iminência expressa pela construção μέλλει com infinitivo.
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: Equivalente corrente e digno para a reunião do grupo, sem acrescentar local ou agente.
- source_word: εἶπεν πρὸς αὐτούς
  choice: disse-lhes
  rationale: Formulação portuguesa concisa e natural para 'disse a eles'.
theological_decisions:
- issue: Agente da revelação
  choice: Não identificar quem revelou
  alternative: Explicitar que Deus lhe revelou
  rationale: O passivo ἀπεκαλύφθη não nomeia o agente; explicitar Deus resolveria uma ambiguidade que o texto conserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das ideias e os contrastes do grego foram preservados sem rigidez sintática.
