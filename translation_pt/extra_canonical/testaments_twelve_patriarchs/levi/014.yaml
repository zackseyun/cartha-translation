  text: 1[a]. Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands on him in wickedness, and among all the nations you will become a mockery[b]. 2. For our father Israel is pure from the ungodliness of the chief priests, who will lay their hands on the savior of the world. 3. For just as the sun is pure before the Lord upon the earth, so also...
translation:
  language: pt
  text: 1. Portanto, meus filhos, vim a saber que, no fim das eras, vocês agirão de modo ímpio contra o Senhor, pondo as mãos sobre ele[a] com maldade, e se tornarão motivo de zombaria entre todas as nações. 2. Pois Israel, nosso pai, é puro, livre da impiedade dos principais sacerdotes, os quais porão as mãos sobre o salvador do mundo.[b] 3. Pois, assim como o sol é puro diante do Senhor sobre a terra,[c] assim também vocês são os luminares de Israel, acima de todas as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “sobre ele” aparecem entre colchetes no texto grego fornecido, indicando incerteza editorial quanto à sua forma ou presença no texto transmitido.
    reason: textual_variant
  - marker: b
    text: A oração “os quais porão as mãos sobre o salvador do mundo” aparece entre colchetes no texto grego fornecido e pode ser uma expansão posterior na transmissão; foi traduzida porque integra o testemunho apresentado.
    reason: textual_variant
  - marker: c
    text: A edição assinala como textualmente incertas as expressões correspondentes a “sol” e “sobre a terra”. A tradução conserva a redação grega fornecida sem tentar corrigi-la.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: vim a saber
  rationale: Expressa uma tomada de conhecimento já ocorrida e evita tratar a forma grega como simples presente.
- source_word: ἀσεβήσετε
  choice: agirão de modo ímpio
  rationale: Preserva a força verbal da conduta irreligiosa, em vez de reduzi-la a uma qualidade estática.
- source_word: ἐπὶ Κυρίου
  choice: contra o Senhor
  rationale: O contexto hostil de pôr as mãos sobre alguém favorece o sentido adversativo de ἐπί.
- source_word: χεῖρας ἐπιβάλλοντες / ἐπιβαλοῦσι τὰς χεῖρας
  choice: pondo / porão as mãos sobre
  rationale: Mantém a expressão concreta e sua possível abrangência entre captura e violência, sem especificar além do grego.
- source_word: χλευασμός
  choice: motivo de zombaria
  rationale: Formulação portuguesa natural para o substantivo predicativo que descreve a humilhação pública entre as nações.
- source_word: καθαρός
  choice: puro
  rationale: Conserva a ressonância moral e religiosa em contraste com a impiedade.
- source_word: ἀρχιερέων
  choice: principais sacerdotes
  rationale: O plural e o uso do período favorecem a designação coletiva, sem sugerir apenas titulares individuais do sumo sacerdócio.
- source_word: σωτῆρα τοῦ κόσμου
  choice: salvador do mundo
  rationale: Tradução direta da expressão grega, sem identificar explicitamente seu referente além do que diz o testemunho.
- source_word: φωστῆρες
  choice: luminares
  rationale: Preserva a imagem elevada de corpos ou fontes luminosas e seu registro testamentário.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: acima de todas as nações
  rationale: Representa o valor comparativo ou de superioridade de παρά com acusativo, embora a relação exata permaneça concisa no grego.
theological_decisions:
- issue: Referente de “o Senhor” e “ele” no versículo 1
  choice: 'Manter a acusação direta: “contra o Senhor, pondo as mãos sobre ele”'
  alternative: Entender apenas como rebelião contra a autoridade do Senhor ou identificar expressamente “ele” com o “salvador do mundo” do versículo 2
  rationale: O texto grego apresenta a formulação direta e surpreendente; a tradução não deve harmonizar nem explicitar o referente além do testemunho.
- issue: Oração entre colchetes que identifica os principais sacerdotes como aqueles que porão as mãos sobre o salvador do mundo
  choice: Incluir no texto principal e assinalar sua condição textual em nota
  alternative: Omitir a oração como expansão secundária
  rationale: A oração consta no grego fornecido, embora entre colchetes editoriais; sua transparência textual é preferível à omissão silenciosa.
- issue: Pureza de Israel em contraste com a impiedade dos principais sacerdotes
  choice: Traduzir literalmente a tensão como “nosso pai Israel está puro da impiedade”
  alternative: Reformular como inocência jurídica ou ausência de participação
  rationale: “Puro” conserva a possível dimensão moral e cultual sem resolver como Israel se relaciona com seus descendentes sacerdotais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural e vocabulário bíblico acessível. A sintaxe foi alisada onde necessário, mas foram preservadas a acusação profética, a tensão teológica e as incertezas textuais. Diferentemente da camada inglesa de consulta, o versículo 3 foi traduzido até o fim porque o texto grego fornecido contém a continuação completa.
