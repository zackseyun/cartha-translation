base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/002.yaml
  text: Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister before him.
translation:
  language: pt
  text: Portanto, o Altíssimo ouviu sua oração, para separá-lo da injustiça e para que você se torne filho e servo dele e ministro diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσήκουσεν
  choice: ouviu
  rationale: O aoristo indica que a oração foi ouvida; em português, «ouviu» expressa isso com naturalidade, sem precisar explicitar «atendeu».
- source_word: ὁ ὕψιστος
  choice: o Altíssimo
  rationale: Título divino tradicional, claro e diretamente correspondente ao grego.
- source_word: ἀδικίας
  choice: injustiça
  rationale: Preserva o sentido amplo de conduta contrária à justiça, sem restringi-lo apenas a uma categoria moral específica.
- source_word: θεράποντα
  choice: servo
  rationale: Expressa serviço pessoal e devotado; distingue-se suficientemente de λειτουργόν no contexto.
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: ministro diante dele
  rationale: «Ministro» mantém o serviço oficial ou cultual de λειτουργός, enquanto «diante dele» comunica idiomaticamente a ideia de servir perante a presença divina.
theological_decisions:
- issue: Sentido da oração e relação dos infinitivos com «ouviu»
  choice: 'usar dois complementos coordenados: «separar você... e fazer com que...»'
  alternative: 'entender os infinitivos como propósito explícito: «para separar você...»'
  rationale: A construção grega permite uma relação de conteúdo ou resultado da oração ouvida; a redação escolhida preserva essa abertura sem impor uma causalidade teológica adicional.
- issue: Filiação expressa por υἱόν sem artigo
  choice: «filho» em sentido relacional, sem artigo
  alternative: «um filho»
  rationale: A ausência de artigo em português mantém a qualidade ou função relacional e evita sugerir indevidamente uma filiação exclusiva ou titular.
- issue: τοῦ προσώπου αὐτοῦ
  choice: «diante dele»
  alternative: «de sua presença»
  rationale: No contexto, a expressão é idiomática para serviço prestado perante Deus; «diante dele» é natural e não transforma «presença» em uma entidade teológica distinta.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega «você» em conformidade com a referência direta a Levi e evita construções excessivamente literais. Mantém a sequência solene «filho, servo e ministro».
