revisions:
- from: 'Portanto, o Altíssimo ouviu a sua oração: separar você da injustiça e fazer com que se torne para ele filho, servo e ministro diante dele.'
  to: Portanto, o Altíssimo ouviu sua oração, para separá-lo da injustiça e para que você se torne filho e servo dele e ministro diante dele.
  rationale: 'A revisão elimina a causatividade não expressa, melhora a sintaxe portuguesa e conserva a sequência e as distinções do grego: separação da injustiça, filiação, serviço pessoal e ministério perante Deus. A formulação com «para» preserva de modo aceitável a relação, algo flexível, dos infinitivos com a oração ouvida.'
  reviewer_model: gpt-5.6-terra
