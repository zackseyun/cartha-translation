  source_fidelity: A tradução preserva adequadamente a estrutura da advertência, a sequência de fenômenos cósmicos expressa pelos particípios em genitivo absoluto, as imagens incomuns do fogo que recua e dos espíritos invisíveis que se derretem, e a designação «Hades». A cláusula textualmente incerta sobre o sofrimento do Altíssimo foi mantida com uma nota apropriada. «No castigo», porém, é uma reprodução excessivamente literal de ἐν ... κολάσει e soa pouco natural em português; «com punição» conserva o sentido judicial sem introduzir especificações ausentes no texto fornecido.
  naturalness: «Agora, portanto» é compreensível, mas «Agora, pois» é uma ligação inferencial mais idiomática e fluida no registro solene. A formulação final foi ajustada para português atual e natural, mantendo a cadência do enunciado.
  terminology: «Senhor», «juízo», «filhos dos homens», «Altíssimo» e «Hades» são escolhas consistentes com o registro e com os termos-fonte. «Hades» evita a identificação indevida com o lugar escatológico final de punição.
