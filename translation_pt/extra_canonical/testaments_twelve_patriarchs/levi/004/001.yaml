  to: Agora, pois, saiba que o Senhor executará juízo sobre os filhos dos homens. Pois, quando as rochas se fenderem, o sol se apagar, as águas secarem, o fogo se encolher, toda a criação for abalada, os espíritos invisíveis se derreterem e o Hades for saqueado por ocasião do sofrimento do Altíssimo[a], os homens desobedientes persistirão em suas injustiças; por isso, serão julgados com punição.
