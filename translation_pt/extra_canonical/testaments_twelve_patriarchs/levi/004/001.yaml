source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Νῦν οὖν γίνωσκε¹ ὅτι ποιήσει Κύριος κρίσιν ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων. Ὅτι² πετρῶν³ σχιζομένων, καὶ τοῦ ἡλίου σβεννυμένου⁴ καὶ ὑδάτων⁵ ξηραινομένων καὶ τοῦ⁶ πυρὸς καταπτήσσοντος⁷ καὶ πάσης [τῆς]⁸ κτίσεως κλονουμένης⁹ καὶ τῶν ἀοράτων πνευμάτων¹⁰ τηκομένων¹¹ καὶ¹² τοῦ ᾅδου σκυλευομένου¹³ [ἐπὶ τῷ πάθει τοῦ ὑψίστου]¹⁴ *οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις¹⁵, διὰ τοῦτο ἐν Γτῇ¹⁶ κολάσει κριθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/001.yaml
  text: Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are split, and the sun is extinguished, and waters dry up, and fire cowers, and all creation is shaken, and the invisible spirits melt away, and Hades is plundered at the suffering of the Most High[a], disobedient men will persist in their injustices; therefore they will be judged in punishment.
translation:
  language: pt
  text: Agora, pois, saiba que o Senhor executará juízo sobre os filhos dos homens. Pois, quando as rochas se fenderem, o sol se apagar, as águas secarem, o fogo se encolher, toda a criação for abalada, os espíritos invisíveis se derreterem e o Hades for saqueado por ocasião do sofrimento do Altíssimo[a], os homens desobedientes persistirão em suas injustiças; por isso, serão julgados com punição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “por ocasião do sofrimento do Altíssimo” é textualmente incerta na tradição grega e pode refletir uma ampliação posterior; foi traduzida aqui porque consta no texto testemunhal fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: γίνωσκε
  choice: saiba
  rationale: Imperativo singular direto e natural, que preserva a exortação pessoal do texto grego.
- source_word: ποιήσει ... κρίσιν
  choice: executará juízo
  rationale: Conserva a colocação judicial e o sentido ativo de realizar ou aplicar o juízo, sem reduzir a expressão a mera opinião ou avaliação.
- source_word: τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: os filhos dos homens
  rationale: Mantém o idioma antropológico do original, inteligível em registro bíblico português.
- source_word: καταπτήσσοντος
  choice: se encolher
  rationale: Expressa a imagem incomum de o fogo recuar ou acovardar-se, em vez de normalizá-la como simples extinção.
- source_word: τῶν ἀοράτων πνευμάτων ... τηκομένων
  choice: os espíritos invisíveis se derreterem
  rationale: Preserva tanto a invisibilidade quanto a imagem concreta e extraordinária de dissolução.
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: o Hades for saqueado
  rationale: Mantém Hades como designação do mundo dos mortos e traduz o particípio passivo com sua força de pilhagem ou despojo.
- source_word: ἐπιμενοῦσι ταῖς ἀδικίαις
  choice: persistirão em suas injustiças
  rationale: Reproduz a ideia de continuidade obstinada e o plural do substantivo grego.
- source_word: ἐν ... κολάσει κριθήσονται
  choice: serão julgados no castigo
  rationale: Segue de perto a construção preposicional preservada no texto fornecido, sem acrescentar o comparativo 'maior', que não está seguro nessa forma do grego.
theological_decisions:
- issue: O sofrimento atribuído ao Altíssimo
  choice: por ocasião do sofrimento do Altíssimo
  alternative: por causa do sofrimento do Altíssimo / quando o Altíssimo sofrer
  rationale: A formulação conserva a associação temporal ou circunstancial de ἐπί com dativo sem decidir de modo excessivo por causalidade nem reformular a cláusula como oração verbal.
- issue: Destino dos mortos em ᾅδης
  choice: Hades
  alternative: inferno / mundo dos mortos
  rationale: A transliteração evita identificar automaticamente o termo com o lugar de punição final e preserva sua referência mais ampla ao domínio dos mortos.
translation_notes:
  register: Português moderno, solene e acessível, com cadência apocalíptica. Empregou-se o futuro nas orações temporais, como pede o português natural, embora o grego use particípios presentes em uma cena de juízo futuro. Imagens difíceis, como o fogo que se encolhe e os espíritos que se derretem, foram preservadas em vez de explicadas ou suavizadas.
