  text: You shall shine the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.
translation:
  language: pt
  text: Farás brilhar a luz do conhecimento em Jacó e serás como o sol para toda a descendência de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωτιεῖς
  choice: iluminarás
  rationale: O verbo grego significa iluminar ou dar luz; esta formulação é natural em português e mantém a imagem da luz sem recorrer ao menos idiomático «brilharás a luz».
- source_word: ἐν τῷ Ἰακώβ
  choice: Jacó
  rationale: 'Com «iluminarás», o âmbito expresso por ἐν é vertido naturalmente como o objeto alcançado pela iluminação: «iluminarás Jacó».'
- source_word: σπέρματι Ἰσραήλ
  choice: descendência de Israel
  rationale: Embora literalmente seja «semente de Israel», «descendência» comunica com clareza o sentido coletivo genealógico em português atual.
theological_decisions:
- issue: Identidade do destinatário da profecia
  choice: Manter a segunda pessoa do singular sem identificar explicitamente seu referente.
  alternative: Acrescentar um título ou nome que identifique a figura mencionada.
  rationale: O versículo grego não nomeia o destinatário; explicitar uma identificação resolveria indevidamente uma possível questão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal e futuro simples adequados ao tom profético. «Toda a descendência» preserva a abrangência de παντί.
