source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δοθήσεταί σοι εὐλογία *καὶ παντὶ τῷ σπέρματί σου³⁵ ἕως³⁶ ἐπισκέψεται³⁷ Κύριος πάντα τὰ ἔθνη³⁸ ἐν σπλάγχνοις [υἱοῦ]³⁹ αὐτοῦ *ἕως αἰῶνος⁴⁰. [Πλὴν⁴¹ οἱ υἱοί σου ἐπιβαλοῦσι χεῖρας *ἐπ᾿ αὐτὸν⁴² *τοῦ ἀνασκολοπίσαι⁴³ αὐτόν.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/004.yaml
  text: And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son[a] forever.
translation:
  language: pt
  text: E uma bênção será dada a você e a toda a sua descendência, até que o Senhor visite todas as nações, na profunda compaixão de seu [filho], para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρματί
  choice: descendência
  rationale: No contexto de uma bênção dirigida também aos descendentes de Levi, “descendência” comunica naturalmente o sentido coletivo de σπέρμα sem a ambiguidade moderna de “semente”.
- source_word: ἐπισκέψεται
  choice: visite
  rationale: Mantém o verbo tradicional “visitar”, que aqui pode envolver atenção e intervenção divina, sem explicitar como favorável ou judicial aquilo que o grego deixa em aberto.
- source_word: ἐν σπλάγχνοις
  choice: na profunda compaixão
  rationale: A expressão idiomática associa as entranhas à misericórdia e ao afeto profundo; a tradução comunica esse sentido de modo natural e digno.
- source_word: ἕως αἰῶνος
  choice: para sempre
  rationale: Expressa o valor temporal duradouro da locução, preservando sua posição final e a tensão sintática com o primeiro ἕως.
theological_decisions:
- issue: Referência filial textualmente incerta
  choice: seu [Filho]
  alternative: sua compaixão / seu filho
  rationale: Os colchetes preservam a incerteza textual de υἱοῦ no texto grego fornecido. A inicial maiúscula acompanha a referência filial divina entendida no contexto, sem retirar o sinal explícito de incerteza.
- issue: Sentido da visita do Senhor às nações
  choice: visite todas as nações
  alternative: venha socorrer todas as nações
  rationale: A formulação literal preserva a amplitude de ἐπισκέπτομαι e evita decidir se a visita é exclusivamente salvífica, pastoral ou judicial.
- issue: Expansão sobre os filhos de Levi e o Filho
  choice: não incluir a expansão no texto principal
  alternative: 'incluir: “Contudo, seus filhos lançarão as mãos sobre ele para empalá-lo”'
  rationale: A frase aparece entre colchetes na fonte fornecida e pertence a uma forma textual expandida; sua existência e conteúdo são registrados na nota, sem promovê-la silenciosamente ao texto principal.
translation_notes:
  register: Português atual, claro e solene, com ampla legibilidade brasileira. “Você” é usado no singular por naturalidade moderna; “descendência” evita o arcaísmo semântico de “semente”. A construção temporal algo tensa do grego é mantida, e a variante textual é sinalizada tanto no corpo quanto em nota.
