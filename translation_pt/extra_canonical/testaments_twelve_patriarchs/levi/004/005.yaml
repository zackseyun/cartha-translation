- source_word: τοῦ συνετίσαι
  choice: para que instrua
  rationale: Expressa a finalidade do infinitivo e o sentido causativo de levar alguém a compreender, em português corrente.
- source_word: τοὺς υἱούς σου
  choice: seus filhos
  rationale: Tradução direta e natural do plural masculino no contexto familiar.
- source_word: περὶ τούτου
  choice: a respeito disso
  rationale: Mantém a referência demonstrativa sem resolver seu antecedente, preservando a ambiguidade do grego.
theological_decisions:
- issue: Natureza do conselho e do entendimento concedidos
  choice: foram dados a você conselho e entendimento
  alternative: você recebeu a capacidade de aconselhar e compreender
  rationale: A formulação escolhida preserva os substantivos abstratos e a voz passiva do grego, sem definir quem concede os dons nem reinterpretá-los como capacidades específicas.
