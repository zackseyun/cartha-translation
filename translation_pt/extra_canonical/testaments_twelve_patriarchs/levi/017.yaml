base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017.yaml
  text: 'And since you have heard about the seventy weeks[1], hear also about the priesthood. For in each jubilee there will be a priesthood. In the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be complete with the Lord. [And in the days of his joy he will arise for the salvation of the world.]


    In the second jubilee, the one anointed will be conceived in the sorrow of a beloved one, and his priesthood will be honored, and he will be glorified by all.


    But the third priest will be taken in grief. And the fourth will be in pains, because unrighteousness will increase upon him in abundance, and all Israel will hate, each one, his neighbor. The fifth will be taken in darkness. Likewise also the sixth and the seventh.


    But in the seventh there will be a defilement which I cannot speak of before men, for those who do these things will know them. Therefore they will be in captivity and in plundering, and their land and their possessions will be destroyed.


    And in the fifth week they will return to the land of their desolation[4][3][2], and they will renew the house of the Lord.'
translation:
  language: pt
  text: '**17** E, visto que vocês ouviram falar das setenta semanas[a], ouçam também a respeito do sacerdócio. **2** Pois em cada jubileu haverá um sacerdócio. No primeiro jubileu, aquele que primeiro for ungido para o sacerdócio será grande e falará com Deus como com um pai; e seu sacerdócio será pleno com o Senhor. [E, nos dias de sua alegria, ele se levantará para a salvação do mundo.][b]


    **3** No segundo jubileu, o que for ungido será concebido em meio ao luto de alguém amado; seu sacerdócio será honrado, e ele será glorificado por todos.


    **4** O terceiro sacerdote, porém, será tomado pela tristeza. **5** O quarto estará em meio a dores, pois a injustiça aumentará muito sobre ele, e todo o Israel odiará, cada um, o seu próximo. **6** O quinto será tomado em trevas. **7** Do mesmo modo, também o sexto e o sétimo.


    **8** No sétimo, porém, haverá uma contaminação[c] da qual não posso falar diante das pessoas, pois os próprios que praticam essas coisas saberão quais são. **9** Por isso, estarão em cativeiro e sob saque, e sua terra e seus bens serão destruídos.


    **10** Na quinta semana, voltarão à terra de sua desolação e renovarão a casa do Senhor.[d]


    **Notas**


    [a] “Setenta semanas” evoca a linguagem cronológica apocalíptica conhecida no livro de Daniel; o texto pressupõe que os ouvintes já receberam essa explicação.


    [b] A frase entre colchetes — “E, nos dias de sua alegria, ele se levantará para a salvação do mundo” — é textualmente incerta no testemunho aqui utilizado e pode ser uma ampliação posterior. Por isso, foi mantida entre colchetes.


    [c] “Contaminação” pode ter aqui tanto sentido ritual quanto moral, especialmente por se tratar da corrupção do sacerdócio.


    [d] “Renovarão a casa do Senhor” pode indicar a restauração ou a reconstrução do templo depois da devastação.'
