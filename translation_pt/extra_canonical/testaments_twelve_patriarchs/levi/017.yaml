lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: setenta semanas
  rationale: Conserva a expressão apocalíptica associada à cronologia de Daniel e traduz naturalmente ἑβδομάδες, sem converter a expressão em uma interpretação cronológica específica.
- source_word: ἱερωσύνη
  choice: sacerdócio
  rationale: É o equivalente corrente para o ofício ou instituição sacerdotal e permite manter a repetição estrutural do grego.
- source_word: ἰωβηλαῖον
  choice: jubileu
  rationale: Mantém o termo calendárico que organiza a sequência profética do capítulo.
- source_word: χριόμενος
  choice: aquele que for ungido
  rationale: Explicita a forma participial ligada à investidura sacerdotal sem transformar automaticamente a expressão em um título messiânico.
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: falará com Deus como com um pai
  rationale: Preserva a comparação filial marcante e expressa em português natural a relação indicada pelo dativo grego.
- source_word: πλήρης μετὰ κυρίου
  choice: seu sacerdócio será pleno com o Senhor
  rationale: Mantém a formulação comprimida e algo incomum do grego, sem especificar de que modo essa plenitude se relaciona com o Senhor.
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: para a salvação do mundo
  rationale: Reproduz de forma direta a finalidade ou orientação da frase, mantendo-a dentro dos colchetes que indicam sua incerteza textual.
- source_word: συλληφθήσεται
  choice: será concebido
  rationale: O sentido de concepção ajusta-se melhor à sucessão de sacerdotes; a formulação evita identificar a pessoa amada mencionada no contexto.
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: em meio ao luto de alguém amado
  rationale: 'Preserva a carga de πένθος e deixa relativamente aberta a relação genitiva: pode tratar-se do luto experimentado por alguém amado ou ligado a essa pessoa.'
- source_word: παραληφθήσεται
  choice: será tomado
  rationale: Escolha deliberadamente contida que funciona tanto com a tristeza quanto com as trevas, sem definir se a ideia é ser dominado, levado ou recebido.
- source_word: μιασμός
  choice: contaminação
  rationale: Abrange a impureza cultual e a corrupção moral, ambas pertinentes ao contexto sacerdotal.
- source_word: ἀνακαινοποιήσουσιν
  choice: renovarão
  rationale: Mantém a ideia de tornar nova ou restaurar a casa do Senhor, sem decidir no texto principal entre reforma e reconstrução completa.
theological_decisions:
- issue: Caráter possivelmente secundário da frase final do versículo 2
  choice: Manter a frase no texto entre colchetes e explicar a incerteza em nota.
  alternative: Omitir a frase como interpolação ou apresentá-la sem qualquer marca textual.
  rationale: O testemunho fornecido conserva a frase entre colchetes. A solução torna visível a evidência textual sem eliminar uma afirmação teologicamente relevante nem tratá-la como indiscutivelmente original.
- issue: Identificação histórica ou messiânica dos sacerdotes e períodos
  choice: Traduzir a sequência profética sem identificar os personagens.
  alternative: Associar cada sacerdote a uma figura histórica específica ou interpretar toda a série como eras puramente simbólicas.
  rationale: O grego apresenta uma sucessão esquemática vinculada a jubileus e semanas, mas não fornece no próprio capítulo as identificações necessárias para incorporá-las à tradução.
- issue: Sentido de μιασμός no sétimo período
  choice: Usar “contaminação” e registrar em nota sua possível força ritual e moral.
  alternative: Traduzir exclusivamente como “impureza ritual” ou exclusivamente como “corrupção moral”.
  rationale: O contexto sacerdotal permite as duas dimensões, e uma tradução mais estreita resolveria indevidamente a tensão semântica.
- issue: Alcance da restauração da casa do Senhor
  choice: Traduzir ἀνακαινοποιήσουσιν por “renovarão”.
  alternative: Especificar “reconstruirão o templo”.
  rationale: “Renovarão” permite tanto restauração quanto reconstrução e não excede a precisão do verbo grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Empregou-se “vocês” para o plural implícito no grego e conservaram-se termos estruturantes como “sacerdócio”, “jubileu” e “semanas”. Formulações incomuns do original foram suavizadas apenas até o ponto necessário para a inteligibilidade, preservando ambiguidades textuais, lexicais e históricas relevantes.
