base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/001.yaml
  text: 'And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity in accordance with all his law.'
translation:
  language: pt
  text: 'E agora, meus filhos, ordeno a vocês: temam o Senhor, seu Deus, de todo o coração e andem com simplicidade, de acordo com toda a sua lei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Expressão familiar e natural em português, adequada ao tratamento de um pai a seus descendentes.
- source_word: φοβεῖσθε
  choice: temam
  rationale: Preserva o sentido direto de reverenciar e temer a Deus, sem reduzir a expressão apenas a respeito ou admiração.
- source_word: ἐξ ὅλης τῆς καρδίας ὑμῶν
  choice: de todo o coração
  rationale: Formulação idiomática em português que conserva a ideia de devoção integral.
- source_word: πορεύεσθε
  choice: andem
  rationale: Mantém a metáfora bíblica de conduzir a vida ou proceder.
- source_word: ἐν ἁπλότητι
  choice: com simplicidade
  rationale: Conserva a amplitude de ἁπλότης, que pode sugerir singeleza, sinceridade e integridade, sem explicitar apenas uma dessas nuances.
- source_word: κατὰ πάντα τὸν νόμον αὐτοῦ
  choice: de acordo com toda a sua lei
  rationale: Reproduz a conformidade com a lei em sua totalidade e soa natural em português contemporâneo.
theological_decisions:
- issue: Sentido do temor de Deus
  choice: temam o Senhor
  alternative: reverenciem o Senhor
  rationale: O verbo grego φοβεῖσθε expressa temor e reverência; manter «temam» preserva a força e a tensão do original sem restringir seu significado.
- issue: Sentido moral de ἁπλότης
  choice: com simplicidade
  alternative: com sinceridade / com integridade
  rationale: A tradução mais transparente evita decidir entre nuances possíveis do termo, preservando sua ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais («ordeno a vocês», «temam», «andem»). A redação mantém o paralelismo exortativo do grego e evita explicações confessionais.
