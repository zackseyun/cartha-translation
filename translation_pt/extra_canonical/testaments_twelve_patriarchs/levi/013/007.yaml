id: T12P.LEV.13.7
reference: Testament of Levi 13:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Σοφίαν κτήσασθε³⁵ *ἐν φόβῳ³⁶ Θεοῦ³⁷, ὅτι³⁸ ἐὰν *γένηται αἰχμαλωσία, καὶ ὀλοθρευθῶσι πόλεις καὶ χῶραι³⁹ *καὶ χρυσὸς καὶ ἄργυρος καὶ πᾶσα⁴⁰ κτῆσις⁴¹ ἀπολεῖται⁴², *τοῦ σοφοῦ τὴν σοφίαν⁴³ †οὐδεὶς⁴⁴ δύναται⁴⁵ ἀφελέσθαι⁴⁶ εἰ μὴ τύφλωσις⁴⁷ ἀσεβείας⁴⁸ καὶ πώρωσις⁴⁹ ἁμαρτίας⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/007.yaml
  text: Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perish, no one can take away the wise man's wisdom, except the blindness of ungodliness and the hardening of sin.
translation:
  language: pt
  text: Adquiram sabedoria no temor de Deus, porque, se vier o cativeiro, e cidades e regiões forem destruídas, e ouro, prata e todos os bens perecerem, ninguém poderá tirar do sábio a sua sabedoria, a não ser a cegueira da impiedade e o endurecimento do pecado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοφίαν κτήσασθε
  choice: Adquiram sabedoria
  rationale: Mantém a força do imperativo plural e o sentido de obter ou conquistar sabedoria.
- source_word: ἐν φόβῳ Θεοῦ
  choice: no temor de Deus
  rationale: Reproduz a expressão religiosa tradicional sem reduzir φόβος a mero respeito.
- source_word: αἰχμαλωσία
  choice: cativeiro
  rationale: Expressa a condição coletiva de captura ou exílio sugerida pelo contexto de devastação.
- source_word: πόλεις καὶ χῶραι
  choice: cidades e regiões
  rationale: χώρα pode designar território, distrito ou região; “regiões” é natural e evita restringi-lo apenas a terras agrícolas.
- source_word: πᾶσα κτῆσις
  choice: todos os bens
  rationale: No contexto de ouro e prata, κτῆσις se refere ao conjunto das posses; “bens” soa mais natural em português.
- source_word: τοῦ σοφοῦ τὴν σοφίαν
  choice: do sábio a sua sabedoria
  rationale: Preserva a construção enfática que vincula a sabedoria à pessoa sábia.
- source_word: τύφλωσις ἀσεβείας
  choice: a cegueira da impiedade
  rationale: Conserva o genitivo ambíguo, que pode indicar cegueira produzida pela impiedade ou própria dela.
- source_word: πώρωσις ἁμαρτίας
  choice: o endurecimento do pecado
  rationale: Mantém a metáfora de insensibilidade ou endurecimento e a ambiguidade da relação genitiva.
theological_decisions:
- issue: A exceção que pode privar o sábio de sua sabedoria
  choice: a não ser a cegueira da impiedade e o endurecimento do pecado
  alternative: exceto se ele for cegado pela impiedade e endurecido pelo pecado
  rationale: A formulação nominal preserva a tensão do grego, sem explicitar indevidamente se impiedade e pecado causam essas condições ou são caracterizados por elas.
translation_notes:
  register: Português atual, digno e de leitura ampla, com imperativos no plural e vocabulário bíblico inteligível. A coordenação extensa do grego foi preservada, mas pontuada para clareza.
