source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ⸀Ἐὰν γάρ τις φυλάξῃ αὐτὸν ἐκ τῶν πονηρῶν τούτων ἔργων⸀⁵¹ τότε⁵² γενήσεται⁵³ αὐτῷ σοφία⁵⁴ καὶ *παρὰ τοῖς πολεμίοις λαμπρὰ⁵⁵ καὶ ἐπὶ⁵⁶ γῆς ἀλλοτρίας⁵⁷ πατρίς, καὶ ἐν μέσῳ⁵⁸ ἐχθρῶν εὑρηθήσεται⁵⁹ φίλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/008.yaml
  text: For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend.
translation:
  language: pt
  text: Pois, se alguém se guardar dessas obras más, então a sabedoria se tornará para ele esplêndida até entre inimigos; em terra estrangeira, será uma pátria; e, no meio de adversários, ele será considerado amigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃ αὐτόν
  choice: se guardar
  rationale: Expressa de modo natural o sentido reflexivo de proteger ou preservar a si mesmo, sem acrescentar a ideia mais específica de mera abstinência.
- source_word: πονηρῶν τούτων ἔργων
  choice: dessas obras más
  rationale: Mantém o demonstrativo e traduz ἔργων de modo formal, claro e corrente.
- source_word: λαμπρά
  choice: esplêndida
  rationale: Preserva a imagem de brilho, distinção ou honra aplicada à sabedoria, sem reduzir o termo a 'famosa' ou 'admirada'.
- source_word: γῆς ἀλλοτρίας
  choice: terra estrangeira
  rationale: Reproduz a ideia de uma terra pertencente a outros, em português natural.
- source_word: πατρίς
  choice: pátria
  rationale: Mantém o contraste metafórico entre terra estrangeira e lugar de pertença.
- source_word: εὑρηθήσεται φίλος
  choice: será considerado amigo
  rationale: O passivo idiomático 'será achado/encontrado amigo' indica que a pessoa será reconhecida ou tida como amiga; esta formulação comunica isso naturalmente.
theological_decisions:
- issue: Relação entre a sabedoria e as três descrições seguintes
  choice: Pontuação com ponto e vírgula, preservando a sequência predicativa do grego
  alternative: Repetir explicitamente 'a sabedoria será' em cada membro
  rationale: 'O grego apresenta uma cadeia condensada: sabedoria esplêndida entre inimigos, pátria em terra estrangeira e amigo no meio de adversários. A tradução conserva a tensão e a força proverbial sem impor uma explicação teológica.'
translation_notes:
  register: Português moderno, digno e acessível, com estrutura proverbial próxima do grego. 'Adversários' no último membro evita repetição excessiva de 'inimigos' sem apagar o paralelismo entre πολέμιοι e ἐχθροί.
