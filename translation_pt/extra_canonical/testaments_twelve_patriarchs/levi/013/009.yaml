  source_fidelity: A tradução comunica corretamente a exortação geral, mas «compartilhará o trono» torna a expressão adjetival σύνθρονος mais concreta e singular do que o grego requer. Além disso, «aconteceu com José» substitui a predicação elíptica sobre José por uma construção impessoal, enfraquecendo a correspondência com o original.
