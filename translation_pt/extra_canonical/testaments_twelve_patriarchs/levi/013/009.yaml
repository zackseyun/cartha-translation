  terminology: «Ensina o que é bom» e «o pratica» são aceitáveis, mas «ensina coisas boas e as pratica» conserva de modo mais transparente o plural καλὰ e sua retomada. «Ser entronizado com reis» exprime naturalmente σύνθρονος sem introduzir o «trono» singular.
