  text: Everyone who teaches good things and does them will be enthroned with kings, just as Joseph my brother also was.
translation:
  language: pt
  text: Todo aquele que ensina coisas boas e as pratica será entronizado com reis, assim como José, meu irmão, também o foi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διδάσκει καλὰ
  choice: ensina o que é bom
  rationale: Expressa naturalmente o plural substantivado καλὰ, preservando a ideia de ensinar coisas moralmente boas.
- source_word: πράττει
  choice: o pratica
  rationale: O pronome retoma o que é bom e comunica que a pessoa põe em prática aquilo que ensina.
- source_word: σύνθρονος ἔσται βασιλέων
  choice: compartilhará o trono com reis
  rationale: Representa o sentido de σύνθρονος, 'associado no trono/entronizado junto', sem sugerir necessariamente vários tronos separados.
- source_word: ὥσπερ καὶ Ἰωσὴφ ὁ ἀδελφός μου
  choice: assim como também aconteceu com José, meu irmão
  rationale: Supre de modo idiomático em português a elipse do predicado grego e mantém καί como 'também'.
