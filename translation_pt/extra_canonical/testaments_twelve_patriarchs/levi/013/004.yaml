source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται¹⁹ καὶ ἐπιθυμήσουσι πολλοὶ τῶν ἀνθρώπων δουλεῦσαι αὐτῷ²⁰ καὶ ἀκοῦσαι νόμου²¹ ἐκ τοῦ²² στόματος αὐτοῦ²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/004.yaml
  text: Indeed, he will gain many friends beyond his parents, and many among men will desire to serve him and to hear the law from his mouth.
translation:
  language: pt
  text: De fato, ele conquistará muitos amigos, para além dos pais[a], e muitas pessoas desejarão servi-lo e ouvir a lei de sua boca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais do que os pais”. O grego permite tanto a ideia de amigos para além do círculo dos pais quanto uma comparação com eles.'
    reason: Preservar a ambiguidade genuína da expressão ὑπὲρ γονεῖς.
lexical_decisions:
- source_word: Καίγε
  choice: De fato
  rationale: Expressa a força enfática e continuativa da partícula composta em português natural.
- source_word: κτήσεται
  choice: conquistará
  rationale: Comunica a ideia de adquirir ou granjear amigos, evitando a leitura meramente possessiva de “terá”.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: muitas pessoas
  rationale: Reproduz o sentido humano genérico de ἄνθρωποι em linguagem moderna e inclusiva, sem limitar a referência a homens do sexo masculino.
- source_word: δουλεῦσαι αὐτῷ
  choice: servi-lo
  rationale: Mantém o sentido de prestar serviço ou sujeitar-se a ele, com formulação idiomática em português.
- source_word: ἀκοῦσαι νόμου ἐκ τοῦ στόματος αὐτοῦ
  choice: ouvir a lei de sua boca
  rationale: Preserva a imagem semítica de receber instrução oral diretamente da boca dele e mantém “lei” como corpo de ensino.
theological_decisions:
- issue: Ausência de artigo diante de νόμου
  choice: a lei
  alternative: lei / uma lei
  rationale: Embora νόμου esteja sem artigo em grego, o substantivo pode designar qualitativamente o corpo reconhecido de instrução ou lei. Em português, “ouvir a lei” é natural e não exige decidir se a referência é especificamente à Torá ou à instrução em sentido mais amplo.
- issue: Força comparativa de ὑπὲρ γονεῖς
  choice: para além dos pais
  alternative: mais do que os pais
  rationale: A formulação escolhida conserva a tensão entre exceder os pais em número ou estima e adquirir amigos além do círculo parental, sem impor uma comparação afetiva específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Conserva-se a imagem “de sua boca”, comum ao registro bíblico, sem tornar a sintaxe artificial.
