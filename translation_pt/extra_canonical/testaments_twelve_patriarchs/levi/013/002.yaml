source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διδάξατε δὲ καὶ ὑμεῖς⁷ τὰ τέκνα ὑμῶν γράμματα⁸ ἵνα ἔχωσι⁹ σύνεσιν ἐν *πάσῃ τῇ ζωῇ αὐτῶν¹⁰, ἀναγινώσκοντες¹¹ ἀδιαλείπτως¹² τὸν νόμον τοῦ Θεοῦ¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/002.yaml
  text: And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing.
translation:
  language: pt
  text: E vocês também ensinem seus filhos a ler e escrever, para que tenham entendimento durante toda a vida, lendo sem cessar a lei de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράμματα
  choice: a ler e escrever
  rationale: No contexto de ensinar crianças, o plural grego se refere às letras e, por extensão, à instrução elementar e à alfabetização; a formulação natural em português comunica esse sentido sem sugerir apenas nomes de caracteres.
- source_word: σύνεσιν
  choice: entendimento
  rationale: Preserva o sentido de compreensão ou discernimento intelectual, em correspondência direta e natural com o grego.
- source_word: ἐν πάσῃ τῇ ζωῇ αὐτῶν
  choice: durante toda a vida
  rationale: Expressa de modo idiomático a extensão por toda a vida indicada pelo grego, sem acrescentar uma ideia ausente de esfera ou conduta.
- source_word: ἀδιαλείπτως
  choice: sem cessar
  rationale: Mantém a força de continuidade do advérbio grego e o tom exortativo do texto.
- source_word: τὸν νόμον τοῦ Θεοῦ
  choice: a lei de Deus
  rationale: Tradução formal e teologicamente não restritiva da expressão grega.
theological_decisions:
- issue: Relação entre entendimento, alfabetização e leitura da lei
  choice: 'Manter a sequência do texto: alfabetização para que haja entendimento ao longo da vida, com leitura contínua da lei de Deus.'
  alternative: Explicitar que o entendimento vem exclusivamente da leitura da lei.
  rationale: A construção grega associa as ideias, mas não define de maneira inequívoca uma causalidade teológica exclusiva; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no uso brasileiro corrente (“ensinem”) e vocabulário amplamente compreensível. “E vocês também” reproduz a continuidade e a ênfase de δὲ καὶ ὑμεῖς.
