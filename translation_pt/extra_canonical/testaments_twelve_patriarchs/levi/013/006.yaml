source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ σπείρατε²⁷ ἐν *ταῖς ψυχαῖς²⁸ ὑμῶν²⁹ ἀγαθὰ *καὶ εὑρήσετε³⁰ αὐτὰ³¹ *ἐν τῇ ζωῇ ὑμῶν³². *Ἐὰν δὲ σπείρητε πονηρὰ³³ *πᾶσαν ταραχὴν καὶ θλίψιν θερίσετε³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/006.yaml
  text: And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction.
translation:
  language: pt
  text: E semeiem coisas boas em suas almas, e vocês as encontrarão em suas vidas. Mas, se semearem coisas más, colherão toda perturbação e aflição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρατε / σπείρητε
  choice: semeiem / semearem
  rationale: Preserva a metáfora agrícola e a distinção entre a exortação inicial e a condição posterior.
- source_word: ἐν ταῖς ψυχαῖς ὑμῶν
  choice: na alma de vocês
  rationale: Traduz ψυχαῖς diretamente por “alma”; o singular distributivo em português soa mais natural com “de vocês” e conserva a referência à interioridade de cada ouvinte.
- source_word: ἀγαθὰ
  choice: coisas boas
  rationale: Mantém o adjetivo substantivado em sentido amplo, sem restringi-lo a obras, pensamentos ou virtudes.
- source_word: εὑρήσετε αὐτὰ ἐν τῇ ζωῇ ὑμῶν
  choice: vocês as encontrarão em sua vida
  rationale: Conserva o verbo “encontrar” e a relação entre o bem semeado interiormente e sua descoberta na vida.
- source_word: πονηρὰ
  choice: coisas más
  rationale: Reproduz o paralelismo com ἀγαθὰ e evita especificar uma categoria moral não expressa no grego.
- source_word: πᾶσαν ταραχὴν καὶ θλίψιν
  choice: toda espécie de perturbação e aflição
  rationale: “Toda espécie de” comunica de modo natural o alcance de πᾶσαν sobre a expressão coordenada; “perturbação” e “aflição” preservam a diferença entre desordem/agitação e sofrimento/opressão.
- source_word: θερίσετε
  choice: colherão
  rationale: Mantém a imagem da colheita em correspondência direta com “semear”.
theological_decisions:
- issue: Relação entre semeadura moral e consequências na vida
  choice: Preservar a formulação proverbial direta do texto
  alternative: Explicitar recompensa ou juízo divino
  rationale: O grego afirma que o bem será encontrado na vida e que o mal produzirá perturbação e aflição, mas não identifica explicitamente o agente nem define o mecanismo teológico.
- issue: Sentido de ψυχή
  choice: alma
  alternative: coração, interior ou vida
  rationale: “Alma” mantém a correspondência lexical e a tensão antropológica do original sem reinterpretar ψυχή como uma faculdade específica.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento plural por “vocês”. A metáfora de semear e colher foi mantida. Empregou-se “sua vida” como singular distributivo, natural em português brasileiro e compatível com o plural do grego.
