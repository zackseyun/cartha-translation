translation:
  language: pt
  text: Portanto, pratiquem a justiça, meus filhos, na terra, para que sejam encontrados nos céus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego de “sejam encontrados” é incerto; outra leitura possível seria: “encontrem [isso] nos céus”.'
    reason: Sinaliza a crux textual indicada pela adaga na edição e preserva a ambiguidade sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: Ποιήσατε ... δικαιοσύνην
  choice: pratiquem a justiça
  rationale: Reproduz de modo natural a expressão grega literalmente equivalente a “fazer justiça”, preservando seu sentido ético de agir com retidão.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Forma corrente e digna de manter a linguagem familiar de exortação.
- source_word: ἐπὶ τῆς γῆς
  choice: na terra
  rationale: Expressão idiomática em português para a esfera da vida terrena.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: nos céus
  rationale: Mantém o plural do grego e evita reduzir a expressão a um conceito singular.
theological_decisions:
- issue: Sentido de εὕρητε
  choice: sejam encontrados
  alternative: encontrem [isso]
  rationale: A forma grega, assinalada como textualmente problemática na edição, admite dificuldade. O contexto e a revisão da camada de consulta favorecem uma leitura passiva/intransitiva, sem inserir um objeto não expresso como “isso”.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla inteligibilidade brasileira. Conserva o paralelismo entre “na terra” e “nos céus” e evita linguagem denominacional.
