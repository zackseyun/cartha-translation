base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/003.yaml
  text: For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes.
translation:
  language: pt
  text: Pois todo aquele que conhecer a lei do Senhor será honrado e não será estrangeiro onde quer que vá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσεται
  choice: conhecer
  rationale: Expressa a aquisição ou posse de conhecimento da lei, preservando de modo natural o valor do futuro grego.
- source_word: νόμον Κυρίου
  choice: a lei do Senhor
  rationale: Equivalência direta, clara e tradicional, sem acrescentar especificação interpretativa.
- source_word: τιμηθήσεται
  choice: será honrado
  rationale: Mantém a voz passiva e o sentido de receber honra ou consideração.
- source_word: ξένος
  choice: estrangeiro
  rationale: Preserva a imagem social de alguém de fora, sem restringi-la a 'desconhecido' ou 'forasteiro'.
- source_word: ὅπου ὑπάγει
  choice: por onde quer que vá
  rationale: Formulação idiomática em português que comunica a abrangência indefinida do lugar e do deslocamento.
theological_decisions:
- issue: Relação entre conhecer a lei do Senhor, receber honra e não ser estrangeiro
  choice: Manter a sequência afirmativa e causal introduzida por 'Pois', sem explicar o mecanismo da promessa
  alternative: Explicitar que a observância da lei produz aceitação social ou favor divino
  rationale: O grego declara os resultados, mas não especifica se decorrem da conduta, da providência divina ou do reconhecimento humano; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e próxima da estrutura grega. 'Por onde quer que vá' foi preferido a 'onde quer que vá' para refletir naturalmente a ideia de deslocamento.
