base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
translation:
  language: pt
  text: '**Testamento de Levi 15**


    **1** Por isso, o templo[a] que o Senhor escolher ficará desolado em meio à impureza de vocês, e vocês serão levados cativos para o meio de todas as nações. **2** Vocês se tornarão uma abominação para elas e receberão opróbrio e vergonha eterna da parte do justo juízo[b] de Deus. **3** Todos os que odeiam vocês se alegrarão com a destruição de vocês. **4** E, se não fosse por Abraão, Isaque e Jacó, nossos pais, vocês não receberiam misericórdia; nem um sequer da descendência de vocês seria deixado sobre a terra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “santuário”; o grego ναός designa especificamente o templo santo.
    reason: lexical_alternative
  - marker: b
    text: “Justo juízo” também pode ser traduzido por “julgamento justo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναός
  choice: templo
  rationale: No contexto judaico, refere-se ao templo santo escolhido pelo Senhor. “Templo” é natural em português e mantém a referência cultual específica.
- source_word: ἔρημος ἔσται
  choice: ficará desolado
  rationale: Conserva tanto a ideia de devastação quanto a de abandono, além do tom profético da advertência.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: na impureza de vocês
  rationale: Mantém a preposição ἐν sem transformar explicitamente a impureza em causa, preservando a formulação e a tensão do grego.
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: serão levados cativos
  rationale: Expressão idiomática e clara em português, adequada ao contexto de exílio entre as nações.
- source_word: βδέλυγμα
  choice: abominação
  rationale: Preserva a forte carga moral e cultual do termo no contexto de uma denúncia de juízo.
- source_word: ὄνειδος
  choice: opróbrio
  rationale: Mantém o registro solene e se combina naturalmente com “vergonha eterna”.
- source_word: αἰσχύνην αἰώνιον
  choice: vergonha eterna
  rationale: Transmite de modo direto a duração e a gravidade da vergonha anunciada, sem acrescentar uma categoria escatológica não explicitada.
- source_word: δικαιοκρισίας
  choice: justo juízo
  rationale: O composto indica um julgamento caracterizado pela justiça; “justo juízo” é conciso, bíblico e natural em português.
- source_word: ἀπωλείᾳ
  choice: destruição
  rationale: No contexto, designa a ruína do povo; evita restringir o termo a uma interpretação de condenação final.
- source_word: ἔλεος λήψεσθε
  choice: receberiam misericórdia
  rationale: A forma condicional em português expressa naturalmente a lógica contrafactual da oração e mantém a misericórdia como algo concedido.
- source_word: σπέρματος
  choice: descendência
  rationale: Comunica claramente o sentido de linhagem em português moderno, embora o grego diga literalmente “semente”.
- source_word: οὐ μὴ καταλειφθῇ
  choice: nenhum ... seria deixado
  rationale: A construção com “nenhum” transmite a negação enfática e a totalidade da ameaça em português idiomático.
theological_decisions:
- issue: Os patriarcas como fundamento da misericórdia
  choice: A misericórdia e a sobrevivência são apresentadas como concedidas por causa de Abraão, Isaque e Jacó.
  alternative: Tratar os patriarcas apenas como exemplos de fidelidade, sem função na lógica da misericórdia anunciada.
  rationale: A construção grega δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ vincula diretamente a misericórdia aos patriarcas. A tradução conserva essa lógica pactual sem definir como ela deve ser sistematizada teologicamente.
- issue: Alcance de “vergonha eterna”
  choice: Manter a linguagem forte e duradoura do texto sem especificar se ela descreve apenas a história nacional ou uma condenação escatológica plenamente desenvolvida.
  alternative: Restringir a expressão a uma desonra histórica temporária ou ampliá-la explicitamente para uma doutrina posterior de condenação eterna.
  rationale: O adjetivo αἰώνιον sustenta a ideia de vergonha duradoura, mas o capítulo não resolve sozinho todas as possíveis implicações escatológicas.
- issue: Relação entre a impureza e a desolação do templo
  choice: Traduzir ἐν por “na”, sem explicitar uma relação exclusivamente causal.
  alternative: Traduzir “por causa da impureza de vocês”.
  rationale: A formulação escolhida preserva mais de perto a ambiguidade da preposição grega e evita resolver silenciosamente se a impureza é causa, esfera ou circunstância da desolação.
translation_notes:
  register: Português moderno, solene e acessível, com preferência por “vocês” para ampla legibilidade brasileira. A repetição de “vocês” preserva a força acusatória da segunda pessoa plural. O texto mantém a cadência profética sem arcaísmos desnecessários.
