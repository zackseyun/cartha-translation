  text: E Gersam tomou uma mulher e teve com ela Lomné e Semeé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γερσὰμ
  choice: Gersã
  rationale: Transliteração portuguesa natural do nome grego, com terminação nasal legível em português.
- source_word: γυναῖκα
  choice: uma mulher
  rationale: Mantém o sentido direto de ‘mulher/esposa’; no contexto de ‘tomou’, a relação matrimonial fica clara sem tornar explícito mais do que o grego.
- source_word: ἔτεκεν ἐξ αὐτῆς
  choice: teve com ela
  rationale: Expressão portuguesa natural que representa a geração dos filhos por Gersã com essa mulher e respeita a construção grega ‘dela/por meio dela’, sem seguir a leitura menos provável de que a mulher seja o sujeito do verbo.
- source_word: Λομνὴ καὶ Σεμεῆ
  choice: Lomné e Semeé
  rationale: Transliteração dos nomes gregos com acentos que indicam a tonicidade final ao leitor lusófono.
