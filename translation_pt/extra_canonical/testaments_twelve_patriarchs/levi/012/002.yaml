  text: And the sons of Kohath were Amram, Issachar, Hebron, and Uzziel.
translation:
  language: pt
  text: Os filhos de Coate foram Abraão[a], Issacar, Hebrom e Uziel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego fornecido diz “Abraão”; a genealogia correspondente em Êxodo 6:18 traz “Anrão”.
    reason: Sinaliza uma provável dificuldade textual sem apagar a leitura efetivamente atestada na fonte fornecida.
lexical_decisions:
- source_word: Καὰθ
  choice: Coate
  rationale: Forma portuguesa tradicional e amplamente reconhecível do nome bíblico correspondente a Kohath.
- source_word: Ἀβραάμ
  choice: Abraão
  rationale: Traduz diretamente a forma presente no texto grego fornecido, sem substituí-la silenciosamente por Anrão.
- source_word: Ἰσαχάρ
  choice: Issacar
  rationale: Forma portuguesa corrente do nome representado pelo grego.
- source_word: Χεβρών
  choice: Hebrom
  rationale: Forma portuguesa bíblica corrente.
- source_word: Ὀζηήλ
  choice: Uziel
  rationale: Forma portuguesa tradicional do nome, correspondente à tradição hebraica subjacente.
theological_decisions:
- issue: Divergência genealógica no primeiro nome
  choice: Manter “Abraão” no texto principal
  alternative: Adotar “Anrão”, como no inglês POB e na genealogia de Êxodo 6:18
  rationale: A fonte grega explicitamente fornecida traz Ἀβραάμ (“Abraão”). Como a tradução deve partir primeiro da evidência na língua original, a possível corrupção textual não foi corrigida sem apoio de aparato crítico.
translation_notes:
  register: Português moderno, claro e digno, com formas tradicionais dos nomes bíblicos. Não se acrescentou “Ele morreu”, pois essa oração não aparece no texto grego fornecido.
