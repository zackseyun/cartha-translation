  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/005.yaml
  text: I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt.
translation:
  language: pt
  text: Eu tinha oito anos quando entrei na terra de Canaã, dezoito anos quando matei Siquém, dezenove anos quando exerci o sacerdócio, vinte e oito anos quando tomei esposa e quarenta e oito anos quando entrei no Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθον
  choice: entrei
  rationale: Reproduz diretamente o sentido de ingressar em uma terra, com naturalidade em português.
- source_word: ἀπέκτεινα τὸν Συχέμ
  choice: matei Siquém
  rationale: Mantém a formulação direta do grego; o artigo diante do nome não precisa ser reproduzido em português.
- source_word: ἱεράτευσα
  choice: exerci o sacerdócio
  rationale: Expressa de modo claro e digno a atividade sacerdotal indicada pelo verbo grego, sem acrescentar detalhes sobre ordenação ou duração.
- source_word: ἔλαβον γυναῖκα
  choice: tomei esposa
  rationale: Preserva a expressão semítica refletida no grego e continua compreensível em registro bíblico moderno.
