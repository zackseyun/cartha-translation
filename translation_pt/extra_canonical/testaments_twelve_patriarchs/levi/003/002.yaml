    issue: Regência de «fazem propiciação diante do Senhor»
    rationale: Para a ação cultual dirigida a Deus, «fazem propiciação ao Senhor» reproduz mais diretamente a relação expressa no texto de controle. «Diante do Senhor» pode sugerir apenas o local ou a presença da ação.
  - severity: low
    issue: Formulação espacial «desde o grau de sua santidade»
    rationale: A expressão é compreensível, mas pouco natural no português moderno. «A partir do nível de sua santidade» conserva a noção de grau/nível e a perspectiva vertical sem resolver a referência.
