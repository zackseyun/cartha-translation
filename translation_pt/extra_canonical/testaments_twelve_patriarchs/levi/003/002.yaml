base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/002.yaml
  text: And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are
    shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.
translation:
  language: pt
  text: E nele há fogo, neve e gelo, preparados para o dia determinado por Deus, como justo juízo de Deus sobre os seres humanos. Nele estão todos os espíritos dos castigos destinados à vingança contra os que desprezam a lei. Acima dele fica o lugar santo, onde estão as hostes dos exércitos designados para o dia do juízo, a fim de executar vingança contra os espíritos do engano e de Beliar[b]. Acima deles estão os santos. No mais alto de todos habita a Grande Glória, muito acima de toda santidade. No céu logo abaixo dele estão os arcanjos, que servem e fazem propiciação[a] ao Senhor por todos os pecados que os justos cometem por ignorância, oferecendo ao Senhor um aroma suave, uma oferta racional e sem sangue[c]. No céu abaixo desse estão os anjos que levam as respostas aos anjos da presença do Senhor. No céu imediatamente inferior estão tronos e domínios, nos quais se oferecem continuamente hinos a Deus. Portanto, quando o Senhor olha para nós a partir do nível de sua santidade, os céus
    são abalados. A terra também se move desde seus alicerces e, tremendo, é sacudida até as profundezas. Mas os filhos dos homens, sem compreender essas coisas, desviam-se e provocam a ira dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fazem expiação ao Senhor”. Em contextos cultuais, o verbo grego pode ser traduzido das duas maneiras.'
    reason: lexical_alternative
  - marker: b
    text: “Beliar” reproduz a forma grega do nome, frequentemente vertida como “Belial” em outras tradições.
    reason: lexical_alternative
  - marker: c
    text: “Uma oferta racional e sem sangue” traduz uma expressão que também pode ser entendida como “uma oferta razoável” ou, de modo mais interpretativo, “uma oferta espiritual e sem sangue”.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρύσταλλον
  choice: gelo
  rationale: No contexto da enumeração de fenômenos ou reservas celestes — fogo, neve e κρύσταλλος — “gelo” comunica com naturalidade o sentido provável, sem introduzir a imagem moderna de cristal lapidado.
- source_word: Beliar
  choice: Beliar
  rationale: Mantém a forma do nome refletida pela tradição grega do texto, deixando em nota a variante tradicional “Belial”.
- source_word: reasonable offering
  choice: oferta racional
  rationale: Preserva a formulação conceitualmente tensa da expressão transmitida, sem interpretá-la de modo automático como “espiritual”; a nota registra as possibilidades.
- source_word: sons of men
  choice: filhos dos homens
  rationale: Conserva o caráter semítico e solene da expressão, que designa a humanidade, em vez de reduzi-la simplesmente a “pessoas”.
- source_word: degree of his holiness
  choice: grau de sua santidade
  rationale: Mantém a imagem hierárquica ou espacial pouco comum do texto, evitando resolver uma possível referência aos níveis celestes.
theological_decisions:
- issue: Função cultual dos arcanjos
  choice: fazem propiciação diante do Senhor
  alternative: fazem expiação perante o Senhor
  rationale: “Propiciação” conserva o aspecto relacional da ação dirigida ao Senhor, enquanto a nota reconhece que o verbo cultual também pode ser traduzido por “fazer expiação”.
- issue: Natureza da oferta celestial
  choice: uma oferta racional e sem sangue
  alternative: uma oferta espiritual e sem sangue
  rationale: A tradução principal evita decidir que “racional” equivale necessariamente a “espiritual” e preserva a tensão teológica da expressão.
- issue: Identidade dos “santos” acima das hostes
  choice: os santos
  alternative: os seres santos
  rationale: A forma mais concisa preserva a ambiguidade entre pessoas santas e seres celestes, sem impor uma identificação.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura cosmológica e as repetições de “céu” foram mantidas para preservar a progressão vertical do texto. Formulações deliberadamente incomuns, como “Grande Glória”, “filhos dos homens” e “grau de sua santidade”, foram conservadas por seu peso literário e por sua ambiguidade.
