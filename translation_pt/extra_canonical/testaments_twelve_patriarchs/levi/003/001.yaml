source:
  edition: Charles 1908 Greek Versions (pages 92-133, Levi pilot full)
  text: ῎Ακουσον οὖν¹ περὶ τῶν δει- χθέντων σοι οὐρα- νῶν· ὁ κατώτερος *διὰ τοῦτό σοί ἐστι στυγνός, ἐπειδὴ² ὁρᾷ πάσας³ τὰς ἀδικίας τῶν ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/001.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is gloomy for this reason: because it sees all the injustices of people.'
translation:
  language: pt
  text: 'Escuta, pois, a respeito dos céus que te foram mostrados. O mais baixo é sombrio por esta razão: porque vê todas as injustiças dos seres humanos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουσον οὖν
  choice: Escuta, pois
  rationale: Preserva o imperativo singular e a conexão discursiva de οὖν em português natural e digno.
- source_word: περὶ τῶν δειχθέντων σοι οὐρανῶν
  choice: a respeito dos céus que te foram mostrados
  rationale: Mantém o plural οὐρανῶν e expressa com clareza o particípio passivo e o pronome dativo.
- source_word: ὁ κατώτερος
  choice: O mais baixo
  rationale: Conserva o comparativo substantivado, cujo referente contextual é um dos céus, sem acrescentar uma numeração ausente no grego.
- source_word: στυγνός
  choice: sombrio
  rationale: Comunica a tonalidade escura, lúgubre ou austera do termo, sem reduzi-lo apenas à ausência física de luz.
- source_word: πάσας τὰς ἀδικίας τῶν ἀνθρώπων
  choice: todas as injustiças dos seres humanos
  rationale: Traduz ἀδικίας de modo lexicalmente próximo e usa uma designação humana inclusiva e corrente para ἀνθρώπων.
theological_decisions:
- issue: Os céus no plural e a identificação do céu inferior
  choice: Manter “céus” no plural e “o mais baixo” sem explicação adicional
  alternative: Explicitar “o céu mais baixo” ou harmonizar com uma cosmologia específica
  rationale: O grego pressupõe vários céus, mas não exige aqui uma sistematização cosmológica; a tradução preserva a formulação e a tensão do texto.
- issue: Personificação do céu inferior
  choice: Manter “porque vê”
  alternative: Parafrasear como “porque nele são vistas” ou interpretar a visão metaforicamente
  rationale: O sujeito gramatical personificado do original deve permanecer, sem resolver a natureza dessa linguagem.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção “Escuta, pois” mantém um tom de exortação sem arcaísmo excessivo; “seres humanos” evita que “homens” seja entendido apenas como masculino.
