  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005.yaml
  text: 'And in this[a], the angel opened to me the gates of heaven, and I saw the holy Most High seated on a throne.


    2 And he said to me, “Levi, to you I have given the blessings of the priesthood until, having come, I dwell in the midst of Israel.”


    3 Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Carry out vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”


    4 And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers[b].


    5 And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in a day of affliction.”


    6 And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down utterly; for every evil spirit attacks it.”


    7 And after this, when I awoke, I blessed the Most High.'
translation:
  language: pt
  text: '5 Nisso, o anjo me abriu as portas do céu, e vi o santo Altíssimo sentado num trono.


    2 E ele me disse: “Levi, a você dei as bênçãos do sacerdócio, até que eu venha e habite no meio de Israel.”


    3 Então o anjo me fez descer à terra, deu-me uma arma e uma espada e me disse: “Tome vingança em Siquém por Diná, sua irmã. Eu estarei com você, porque o Senhor me enviou.”


    4 E, naquele tempo, destruí os filhos de Hamor, conforme está escrito nas tábuas dos pais.[a]


    5 Eu lhe disse: “Suplico-te, Senhor: ensina-me o teu nome, para que eu te invoque no dia da aflição.”


    6 Ele respondeu: “Eu sou o anjo que intercede pela descendência de Israel, para que eles não sejam golpeados.”[b]


    7 Depois disso, quando despertei, bendisse o Altíssimo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nas tábuas dos pais”. No contexto apocalíptico, a expressão pode referir-se a tábuas ou registros celestiais, embora “celestiais” não apareça no grego preservado.
    reason: lexical_alternative
  - marker: b
    text: O grego deste versículo é difícil, especialmente na descrição da função do anjo e na construção da oração final. A tradução entende o anjo como intercessor ou protetor de Israel. Alguns testemunhos apresentam uma forma ampliada, com o sentido de “para que não sejam completamente destruídos”, mas essa expansão não consta do texto grego aqui traduzido.
    reason: textual_variant
lexical_decisions:
- source_word: ἅγιον ὕψιστον
  choice: o santo Altíssimo
  rationale: Preserva os dois elementos do título reverencial sem transformar ἅγιον em parte inequívoca de um nome próprio.
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: as bênçãos do sacerdócio
  rationale: Mantém explícita a relação genitiva entre as bênçãos e o ofício sacerdotal.
- source_word: ἕως ἐλθὼν κατοικήσω ἐν μέσῳ τοῦ Ἰσραήλ
  choice: até que eu venha e habite no meio de Israel
  rationale: Reproduz a primeira pessoa e a força temporal da construção grega em português natural.
- source_word: ὅπλον καὶ ῥομφαίαν
  choice: uma arma e uma espada
  rationale: ὅπλον é amplo e não exige a especificação interpretativa de “escudo”; ῥομφαία é vertido como “espada” em linguagem corrente.
- source_word: Ποίησον ἐκδίκησιν
  choice: Execute a vingança
  rationale: Conserva a força imperativa e retributiva da expressão, sem suavizá-la como mera justiça.
- source_word: συνετέλεσα
  choice: destruí
  rationale: No contexto da ação violenta contra os filhos de Hamor, exprime o sentido consumativo de levá-los ao fim.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: nas tábuas dos pais
  rationale: Traduz apenas o que está explícito no grego; a possível referência a tábuas celestiais é registrada em nota.
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: no dia da aflição
  rationale: Preserva o singular e o registro elevado da locução.
- source_word: ὁ ἄγγελος ὁ παραιτούμενος τὸ γένος Ἰσραήλ
  choice: o anjo que intercede pela descendência de Israel
  rationale: No contexto da oração final de proteção, “intercede” expressa o provável papel mediador, embora o particípio seja lexical e textualmente difícil.
- source_word: τοῦ μὴ πατάξαι αὐτούς
  choice: para que eles não sejam feridos
  rationale: Mantém a oração de finalidade e evita acrescentar a ideia de destruição total, ausente do texto grego fornecido.
- source_word: ἔξυπνος γενόμενος
  choice: quando despertei
  rationale: Forma portuguesa natural para o idioma participial que encerra a visão.
theological_decisions:
- issue: Identidade do falante no versículo 2
  choice: Mantida a fala na primeira pessoa — “até que eu venha e habite” — sem identificar explicitamente se o falante é o Altíssimo ou o anjo.
  alternative: Atribuir expressamente a promessa ao Altíssimo, ou entender que o anjo fala em nome de Deus.
  rationale: A sequência narrativa permite tensão entre a visão do Altíssimo e a atuação do anjo. A tradução não resolve uma ambiguidade que o texto não resolve de modo inequívoco.
- issue: Natureza das “tábuas dos pais” no versículo 4
  choice: Expressão traduzida literalmente no texto, com a interpretação apocalíptica indicada apenas em nota.
  alternative: “Tábuas celestiais dos pais.”
  rationale: O contexto pode sugerir registros celestiais, mas o adjetivo “celestiais” não aparece no grego transmitido.
- issue: Função do anjo no versículo 6
  choice: Anjo que intercede em favor da descendência de Israel para protegê-la de ser ferida.
  alternative: Anjo que recusa, desculpa ou afasta algo da descendência de Israel.
  rationale: O particípio παραιτούμενος é difícil, mas a oração de finalidade favorece uma função protetora. A nota informa a dificuldade sem introduzir expansões ausentes da fonte fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. Empregou-se “você” na fala dirigida a Levi e “te” na súplica solene, refletindo usos correntes sem regionalismos marcados. A numeração inicia com o capítulo 5 e conserva os versículos 2–7.
