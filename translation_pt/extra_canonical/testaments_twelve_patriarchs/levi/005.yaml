review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o grego. Mantém corretamente a primeira pessoa no v. 2, não acrescenta “celestiais” no v. 4 e não importa para o texto do v. 6 a expansão presente em alguns testemunhos. No v. 6, porém, “não sejam feridos” enfraquece πατάξαι, verbo de golpear/abater, e a nota deve deixar claro que a dificuldade está tanto no particípio quanto na construção da oração final.
  naturalness: O português é moderno, claro e de registro adequadamente elevado. “Tomem/executem vingança” pode soar algo burocrático em português brasileiro; “Tome vingança” é mais natural, preservando o teor retributivo sem o suavizar.
  terminology: “Altíssimo”, “sacerdócio”, “Siquém”, “Diná” e “Hamor” são adequados. “Descendência de Israel” traduz bem γένος neste contexto. “Tábuas dos pais” preserva a formulação transmitida, e a nota trata de modo apropriado a possível leitura apocalíptica.
  issues:
  - severity: low
    issue: O v. 6 traduz πατάξαι por “sejam feridos”.
    rationale: πατάσσω normalmente exprime golpear ou abater, com força mais marcada que um ferimento genérico. “Sejam golpeados” preserva melhor o verbo sem introduzir a expansão “completamente destruídos”.
  - severity: low
    issue: “Execute a vingança” no v. 3 é menos idiomático no português corrente.
    rationale: “Tome vingança” é uma formulação natural e conserva o imperativo retributivo de Ποίησον ἐκδίκησιν.
