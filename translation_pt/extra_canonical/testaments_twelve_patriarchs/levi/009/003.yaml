  text: ΓὩς δὲ ἤλθομεν εἰς Βεθήλ⁹⁾, εἶδεν¹⁰ ὁ πατήρ μου Ἰακώβ¹¹ ὅραμα¹² περὶ ἐμοῦ, ὅτι ἔσομαι αὐτοῖς εἰς ἱερέα¹³.
