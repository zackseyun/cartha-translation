base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/003.yaml
  text: And when we came to Bethel, my father Jacob saw a vision about me, that I would be a priest to them.
translation:
  language: pt
  text: 'E, quando chegamos a Betel, meu pai Jacó teve uma visão a meu respeito: eu seria sacerdote para eles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤλθομεν εἰς Βεθήλ
  choice: chegamos a Betel
  rationale: Expressa naturalmente em português o movimento de chegada indicado pelo grego, preservando o nome tradicional do lugar.
- source_word: εἶδεν ... ὅραμα
  choice: teve uma visão
  rationale: Embora literalmente seja “viu uma visão”, a colocação portuguesa “teve uma visão” evita redundância pouco natural sem alterar o sentido.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Reproduz com clareza o sentido de que a visão dizia respeito a Levi.
- source_word: εἰς ἱερέα
  choice: sacerdote
  rationale: O predicativo indica a função ou condição futura de Levi; “sacerdote” é o equivalente direto e corrente de ἱερεύς.
- source_word: αὐτοῖς
  choice: para eles
  rationale: Mantém o referente plural não explicitado no versículo e expressa de modo idiomático a relação de serviço sacerdotal.
theological_decisions:
- issue: Identidade do referente de αὐτοῖς (“eles”)
  choice: Manter “eles” sem explicitação
  alternative: Explicitar como “seus descendentes”, “meus irmãos” ou “o povo”
  rationale: O texto grego não identifica aqui o referente. Explicitá-lo resolveria indevidamente uma ambiguidade contextual e poderia introduzir uma interpretação teológica.
- issue: Força da declaração futura ὅτι ἔσομαι
  choice: “eu seria”
  alternative: “eu haveria de ser” ou “eu me tornaria”
  rationale: No discurso narrativo passado, “seria” comunica naturalmente o futuro revelado na visão, sem acrescentar a ideia de transformação contida em “me tornaria”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com fluidez brasileira. A estrutura foi levemente ajustada com dois-pontos para apresentar o conteúdo da visão com clareza, sem alterar sua relação sintática ou teológica.
