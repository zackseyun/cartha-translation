base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/010.yaml
  text: Therefore take for yourself a wife while you are still young, one who has no blemish or defilement, and not from the stock of foreign nations.
translation:
  language: pt
  text: Portanto, tome para si uma esposa enquanto ainda é jovem, que não tenha mácula nem seja profanada, nem seja da linhagem de povos estrangeiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῶμον
  choice: mácula
  rationale: Preserva a ideia de defeito ou censura moral em linguagem digna e corrente no registro bíblico.
- source_word: βεβηλωμένην
  choice: profanação
  rationale: Expressa o estado de ter sido profanada, mantendo-o distinto de μῶμον sem especificar uma forma de impureza que o grego não explicita.
- source_word: γένους
  choice: linhagem
  rationale: Comunica origem familiar ou étnica de modo natural.
- source_word: ἀλλοφύλων ἐθνῶν
  choice: povos estrangeiros
  rationale: Reproduz a referência a nações ou povos de outra origem, sem acrescentar uma identificação étnica específica.
theological_decisions:
- issue: Natureza de μῶμον e βεβηλωμένην
  choice: sem mácula nem profanação
  alternative: sem defeito e não profanada
  rationale: Mantém os dois conceitos separados e evita determinar se a mácula é física, moral, ritual ou social, pois o texto não resolve essa questão.
- issue: Proibição relativa à origem da esposa
  choice: que não seja da linhagem de povos estrangeiros
  alternative: que não seja descendente de nações estrangeiras
  rationale: Conserva a afirmação étnico-genealógica do texto sem justificá-la, ampliá-la ou convertê-la em regra teológica geral.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A construção imperativa foi mantida, e a formulação evita resolver ambiguidades presentes nos qualificativos gregos.
