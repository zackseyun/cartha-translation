source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀναστὰς¹⁴ *τῷ πρωὶ¹⁵ *ἀπεδεκάτωσε πάντα¹⁶ δι’ ἐμοῦ ῾τῷ Κυρίῳ’¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/004.yaml
  text: And rising early in the morning, he tithed everything through me to the Lord.
translation:
  language: pt
  text: E, levantando-se de manhã cedo, entregou por meu intermédio o dízimo de tudo ao Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς τῷ πρωὶ
  choice: levantando-se de manhã cedo
  rationale: Reproduz com naturalidade a ação circunstancial e o sentido temporal da expressão grega, conforme também indicado pela tradição textual assinalada.
- source_word: ἀπεδεκάτωσε πάντα
  choice: entregou ... o dízimo de tudo
  rationale: Expressa de modo claro e corrente o ato de separar ou dar a décima parte de tudo, evitando o pouco usual verbo português “dizimar”.
- source_word: δι’ ἐμοῦ
  choice: por meu intermédio
  rationale: Preserva o valor instrumental ou mediador de διά com genitivo sem especificar além do que o texto afirma.
- source_word: τῷ Κυρίῳ
  choice: ao Senhor
  rationale: Equivalente convencional e reverente de Κύριος neste contexto religioso.
theological_decisions:
- issue: Natureza da participação do narrador no dízimo
  choice: por meu intermédio
  alternative: por meio de mim
  rationale: Mantém a ambiguidade quanto ao modo exato pelo qual Levi serviu de intermediário, sem atribuir-lhe uma função sacerdotal mais definida do que o texto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação “entregou o dízimo de tudo” é mais idiomática do que “dizimou tudo” e mantém a precisão sem sugerir que tudo, em vez da décima parte de tudo, foi entregue.
