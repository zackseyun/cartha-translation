  text: And after two days, I and Judah went up with our father Jacob to Isaac our grandfather.
translation:
  language: pt
  text: E, depois de dois dias, eu e Judá subimos com nosso pai Jacó até Isaque, nosso avô.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας δύο
  choice: depois de dois dias
  rationale: Reproduz naturalmente a expressão temporal grega sem acrescentar precisão não presente no texto.
- source_word: ἀνέβην
  choice: subimos
  rationale: Embora o verbo esteja na primeira pessoa do singular, o sujeito composto «eu e Judá» exige o plural em português; mantém-se o sentido de subir ou viajar para um lugar mais elevado.
- source_word: πρὸς Ἰσαὰκ
  choice: até Isaque
  rationale: Expressa o movimento em direção à pessoa de Isaque de modo idiomático em português.
- source_word: τὸν προπάτορα ἡμῶν
  choice: nosso avô
  rationale: No contexto genealógico, Isaac é avô de Levi e Judá; a escolha preserva a relação concreta em vez do sentido mais amplo possível de «antepassado».
