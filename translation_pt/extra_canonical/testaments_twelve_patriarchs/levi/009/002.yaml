lexical_decisions:
- source_word: ὁ πατὴρ τοῦ πατρός μου
  choice: meu avô
  rationale: Expressa em português natural a locução grega literal «o pai de meu pai», sem perda de sentido.
- source_word: κατὰ τῶν ὁραμάτων ὧν εἶδον
  choice: por causa das visões que eu tinha visto
  rationale: Entende κατά, neste contexto, em sentido causal; o mais-que-perfeito composto preserva a anterioridade das visões em relação à bênção.
- source_word: οὐκ ἠθέλησε πορευθῆναι
  choice: não quis ir
  rationale: Tradução corrente e fiel da recusa expressa por ἠθέλησε com o infinitivo πορευθῆναι.
- source_word: Βεθήλ
  choice: Betel
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo bíblico.
