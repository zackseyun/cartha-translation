lexical_decisions:
- source_word: συνετίζων
  choice: instruía
  rationale: O particípio presente indica uma ação contínua de fazer compreender ou dar instrução; “instruía” é natural e preserva o sentido sem acrescentar um assunto ausente no texto grego.
- source_word: ἀσχολούμενος εἰς ἐμὲ
  choice: ocupando-se comigo
  rationale: Reproduz a ideia de dedicar tempo e atenção à pessoa, mantendo a formulação incomum do grego sem especificar além da evidência textual.
- source_word: ἔλεγέ μοι
  choice: me dizia
  rationale: O imperfeito sugere fala reiterada ou em andamento; “me dizia” combina naturalmente com “todos os dias” e introduz a fala que segue.
