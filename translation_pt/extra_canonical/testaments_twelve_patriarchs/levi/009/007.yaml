id: T12P.LEV.9.7
reference: Testament of Levi 9:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐδίδασκέ *με²⁷ νόμον ἱερωσύνης²⁸, *θυσιῶν, ὁλοκαυτωμάτων²⁹, *ἀπαρχῶν ἑκουσίου, σωτηρίου³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/007.yaml
  text: And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of freewill offerings, and of peace offerings.
translation:
  language: pt
  text: E ele me ensinava a lei relativa ao sacerdócio, aos sacrifícios, aos holocaustos, às primícias, às ofertas voluntárias e às ofertas de comunhão[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ofertas de paz” ou “ofertas de bem-estar”.'
    reason: O grego σωτηρίου admite essas nuances no vocabulário sacrificial.
lexical_decisions:
- source_word: νόμον ἱερωσύνης
  choice: a lei relativa ao sacerdócio
  rationale: A formulação explicita de modo natural a relação expressa pelo genitivo grego, sem reduzir νόμος a simples costume ou instrução.
- source_word: ὁλοκαυτωμάτων
  choice: holocaustos
  rationale: Termo sacrificial tradicional e preciso para ofertas inteiramente queimadas, compreensível no contexto bíblico.
- source_word: ἀπαρχῶν
  choice: primícias
  rationale: O substantivo está presente no texto grego fornecido e designa as primeiras porções oferecidas; por isso foi preservado, apesar de sua ausência na camada inglesa revisada.
- source_word: ἑκουσίου
  choice: ofertas voluntárias
  rationale: O adjetivo substantivado designa uma oferta apresentada espontaneamente; o substantivo 'ofertas' foi suprido em português para clareza.
- source_word: σωτηρίου
  choice: ofertas de comunhão
  rationale: O termo sacrificial pode referir-se a uma oferta de bem-estar, paz ou comunhão; 'ofertas de comunhão' comunica sua função cultual sem sugerir que o sacrifício efetue salvação em sentido posterior.
theological_decisions:
- issue: Sentido de σωτηρίου como categoria sacrificial
  choice: ofertas de comunhão
  alternative: ofertas de paz / ofertas de bem-estar
  rationale: A tradução escolhida evita impor uma leitura soteriológica e mantém a referência a uma categoria de sacrifício, enquanto a nota registra a amplitude lexical.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia bíblica reconhecível. A coordenação da lista grega foi mantida, e 'primícias' foi traduzido diretamente do texto-fonte, embora tenha sido omitido na revisão inglesa fornecida.
