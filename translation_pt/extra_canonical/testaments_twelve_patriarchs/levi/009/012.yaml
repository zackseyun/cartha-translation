  text: From twelve trees having leaves, then offer to the Lord, as Abraham taught me.
translation:
  language: pt
  text: Portanto, de doze árvores que têm folhas, oferece ao Senhor[a], como Abraão também me ensinou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz subir ao Senhor”. O objeto da ação não está expresso no texto grego.'
    reason: Registra o sentido literal de ἀνάγαγε e preserva a elipse textual, sem inserir folhas, ramos ou frutos.
lexical_decisions:
- source_word: ἀνάγαγε
  choice: oferece
  rationale: 'O imperativo significa literalmente “faz subir” ou “leva para cima”, mas, no contexto de algo levado ao Senhor, assume naturalmente sentido cultual: “oferece”.'
- source_word: δένδρων ἐχόντων φύλλα
  choice: árvores que tenham folhas
  rationale: Reproduz a qualificação explícita das árvores sem especificar espécie ou tipo de folhagem não indicado no grego.
- source_word: οὖν
  choice: Portanto
  rationale: Conserva a conexão inferencial ou sequencial marcada pela partícula grega.
- source_word: κἀμέ
  choice: também a mim
  rationale: A contração de καὶ ἐμέ inclui explicitamente a ideia de “também a mim”, preservada sem a apagar.
theological_decisions:
- issue: Sentido cultual de ἀνάγαγε
  choice: oferece ao Senhor
  alternative: leva ao Senhor
  rationale: “Oferece” expressa o provável uso sacrificial ou cultual no contexto, enquanto a nota mantém acessível o sentido verbal mais literal.
- issue: Objeto não expresso do imperativo
  choice: manter a elipse em “de doze árvores... oferece”
  alternative: suprir “folhas”, “ramos” ou “frutos” como objeto
  rationale: O texto grego transmitido não explicita o objeto oferecido; acrescentá-lo resolveria indevidamente uma dificuldade real do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe deliberadamente um pouco elíptica para refletir o texto grego. A formulação “ensinou também a mim” preserva o valor de κἀμέ e evita confundir “também” com uma qualificação do ato de ensinar.
