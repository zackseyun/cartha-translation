base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/014.yaml
  text: And of all your first produce and of wine offer firstfruits as a sacrifice to the Lord God. And every sacrifice you shall salt with salt.
translation:
  language: pt
  text: E, de todos os seus primogênitos e do vinho, ofereça as primícias como sacrifício ao Senhor Deus. E salgue com sal todo sacrifício.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς πρωτογεννήματός σου
  choice: de todos os seus primeiros produtos
  rationale: Expressa o sentido de toda a produção inicial pertencente ao destinatário, sem restringi-lo indevidamente a filhos ou animais primogênitos.
- source_word: ἀπαρχὰς
  choice: as primícias
  rationale: Conserva o termo cultual tradicional e claro para a primeira porção oferecida a Deus.
- source_word: εἰς θυσίαν
  choice: como sacrifício
  rationale: Traduz naturalmente a função ou finalidade da oferta.
- source_word: Κυρίῳ τῷ θεῷ
  choice: ao Senhor Deus
  rationale: Preserva o título divino composto de maneira idiomática em português.
- source_word: ἅλατι ἁλιεῖς
  choice: salgue com sal
  rationale: Mantém a formulação enfática e concreta do grego, em vez de suavizá-la para 'tempere'.
theological_decisions:
- issue: Natureza de πρωτογέννημα
  choice: primeiros produtos
  alternative: primogênitos
  rationale: No contexto de vinho e primícias agrícolas, a referência mais provável é à produção inicial; a tradução evita sugerir uma oferta humana.
- issue: Formulação do mandamento sobre o sal
  choice: salgue com sal todo sacrifício
  alternative: tempere todo sacrifício com sal
  rationale: A opção escolhida preserva a repetição lexical do original e sua possível ressonância cultual, sem interpretar o sal como mero tempero.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção cultual tradicional em 'primícias' e 'sacrifício'. O imperativo singular é vertido por formas de tratamento com 'você' implícito ('ofereça', 'salgue'), favorecendo a legibilidade brasileira sem regionalismo marcado.
