  source_fidelity: 'A tradução segue com precisão a sequência do grego: lavagem antes de entrar em τὰ ἅγια, lavagem durante/ao sacrificar e nova lavagem ao completar o sacrifício. Não introduz a referência ao Senhor que não consta da fonte grega fornecida. A nota [a] preserva adequadamente a amplitude de τὰ ἅγια, e a nota [b] explica sem extrapolar a diferença entre λούου e νίπτου.'
