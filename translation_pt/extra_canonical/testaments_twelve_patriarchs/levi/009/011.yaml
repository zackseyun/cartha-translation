id: T12P.LEV.9.11
reference: Testament of Levi 9:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ πρὸ⁴⁶ τοῦ εἰσελθεῖν σε⁴⁷ εἰς τὰ ἅγια, λούου· καὶ ἐν τῷ θύειν σε⁴⁸, νίπτου⁴⁹· καὶ ἀπαρτίζων πάλιν⁵⁰ τὴν θυσίαν, νίπτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/011.yaml
  text: And before you enter into the holy things, wash; and when you sacrifice, wash; and again, when you finish the sacrifice, wash.
translation:
  language: pt
  text: E, antes de entrar no santuário[a], banhe-se; ao oferecer o sacrifício, lave-se; e, ao terminar o sacrifício, lave-se novamente.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nas coisas santas” ou “nos lugares santos”.'
    reason: τὰ ἅγια pode referir-se ao santuário, aos lugares santos ou, de modo mais literal, às coisas sagradas.
  - marker: b
    text: O grego usa primeiro um verbo normalmente associado a banhar-se e, nas duas instruções seguintes, outro verbo que significa lavar-se, sem indicar explicitamente a parte do corpo.
    reason: Preserva a distinção lexical entre λούου e νίπτου e evita a especificação indevida de “mãos”.
lexical_decisions:
- source_word: τὰ ἅγια
  choice: o santuário
  rationale: No contexto sacerdotal, a expressão neutra plural designa naturalmente o espaço sagrado. “Santuário” é claro e idiomático em português, enquanto a possibilidade mais literal é registrada em nota.
- source_word: λούου
  choice: banhe-se
  rationale: Distingue o banho indicado por λούω das lavagens posteriores expressas por νίπτω.
- source_word: νίπτου
  choice: lave-se
  rationale: O verbo está sem objeto corporal explícito; por isso, a tradução não acrescenta “as mãos” nem outra parte do corpo.
- source_word: ἀπαρτίζων
  choice: ao terminar
  rationale: Expressa o sentido circunstancial de completar ou concluir o sacrifício em português natural.
- source_word: πάλιν
  choice: novamente
  rationale: Liga o advérbio à repetição da lavagem final, conforme a sequência ritual do grego, sem inserir elementos ausentes do texto-fonte.
theological_decisions:
- issue: Objeto das lavagens rituais
  choice: Não especificar mãos, pés ou outra parte do corpo
  alternative: “lave as mãos”
  rationale: O grego emprega νίπτου de modo absoluto e não nomeia a parte lavada; especificá-la resolveria indevidamente uma ambiguidade do texto.
- issue: Referência divina ausente nesta forma grega
  choice: Não acrescentar “diante do Senhor” nem “do Senhor”
  alternative: Incluir uma referência ao Senhor com base em outra forma textual
  rationale: A fonte grega fornecida não contém ἐνώπιον, κύριος nem equivalente. A revisão inglesa citada parece refletir material não presente no texto-fonte informado.
translation_notes:
  register: Português moderno, claro e digno, com cadência ritual preservada pela repetição de “lave-se”. Usa “oferecer o sacrifício” para tornar θύειν natural no contexto cultual, sem acrescentar referência divina ausente da fonte.
