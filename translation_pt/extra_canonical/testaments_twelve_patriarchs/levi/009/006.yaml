  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/006.yaml
  text: And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me.
translation:
  language: pt
  text: E Isaque me chamava continuamente para me fazer lembrar da lei do Senhor, assim como o anjo me mostrou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλει με συνεχῶς
  choice: me chamava continuamente
  rationale: Preserva o aspecto iterativo do imperfeito ἐκάλει e traduz diretamente o advérbio συνεχῶς, indicando uma ação repetida ou persistente.
- source_word: τοῦ ὑπομνῆσαί με
  choice: para me lembrar
  rationale: Expressa naturalmente em português a construção grega de finalidade com τοῦ e infinitivo; o pronome με funciona como objeto daquele que faz lembrar.
- source_word: νόμον Κυρίου
  choice: da lei do Senhor
  rationale: A ausência de artigo em grego não exige indefinição; no contexto, trata-se da lei pertencente ao Senhor.
- source_word: καθὼς ἔδειξέ μοι ὁ ἄγγελος
  choice: assim como o anjo me havia mostrado
  rationale: O mais-que-perfeito em português torna clara a anterioridade da revelação do anjo em relação à ação contínua de Isaque, sem acrescentar conteúdo ao objeto elíptico.
theological_decisions:
- issue: Objeto elíptico de ἔδειξέ μοι
  choice: manter implícito o que o anjo mostrou
  alternative: 'explicitar: “assim como o anjo me havia mostrado essa lei”'
  rationale: O grego deixa o objeto subentendido, provavelmente retomando a lei do Senhor; a tradução preserva essa elipse e evita explicitação desnecessária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação preserva a estrutura e o sentido do grego sem rigidez excessiva.
