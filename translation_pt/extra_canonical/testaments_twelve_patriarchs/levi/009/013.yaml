  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/013.yaml
  text: And from every clean animal and bird offer a sacrifice to the Lord.
translation:
  language: pt
  text: E, de todo animal puro e de toda ave, ofereça um sacrifício ao Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς ζώου καθαροῦ
  choice: todo animal puro
  rationale: Reproduz diretamente a categoria ritual expressa pelo grego, em linguagem bíblica clara e corrente.
- source_word: πετεινοῦ
  choice: toda ave pura
  rationale: O substantivo significa ave; o adjetivo 'pura' é naturalmente entendido como aplicável também a este termo na construção coordenada e é explicitado em português para evitar leitura ambígua.
- source_word: πρόσφερε
  choice: ofereça
  rationale: Imperativo singular, traduzido de modo natural e digno.
- source_word: θυσίαν
  choice: um sacrifício
  rationale: Equivalente direto, preservando a referência genérica ao ato sacrificial.
- source_word: τῷ Κυρίῳ
  choice: ao Senhor
  rationale: Forma tradicional e clara para o título divino no dativo de destinatário.
theological_decisions:
- issue: Extensão da qualificação ritual 'puro'
  choice: Explicitar 'pura' tanto para animal quanto para ave
  alternative: Traduzir literalmente 'de todo animal puro e ave'
  rationale: A coordenação grega e o paralelo conceitual indicam que a pureza ritual rege ambas as categorias; a repetição em português evita sugerir que qualquer ave seria aceitável.
translation_notes:
  register: Português moderno, claro e dignificado, com imperativo singular. Mantém a formulação ritual sem acrescentar especificações denominacionais.
