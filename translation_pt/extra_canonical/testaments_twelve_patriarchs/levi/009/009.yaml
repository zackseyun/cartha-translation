id: T12P.LEV.9.9
reference: Testament of Levi 9:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Πρόσεχε³⁴ σεαυτῷ³⁵ ἀπὸ τοῦ πνεύματος τῆς πορνείας. τοῦτο γὰρ³⁶ †ἐνδελεχῆ ἐστιν†³⁷ *καὶ μέλλει μιαίνειν³⁸ διὰ³⁹ τοῦ σπέρματός σου⁴⁰ *τὰ ἅγια⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/009.yaml
  text: Take heed to yourself from the spirit of sexual immorality, for this is persistent and is about to defile the holy things through your offspring.
translation:
  language: pt
  text: Guarde-se do espírito da imoralidade sexual, pois ele é persistente[a] e está prestes a profanar, por meio da sua descendência, as coisas santas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta expressão é incerto; outra leitura ou reconstrução pode produzir um sentido diferente.
    reason: A edição assinala †ἐνδελεχῆ ἐστιν† como trecho textualmente problemático.
lexical_decisions:
- source_word: Πρόσεχε σεαυτῷ ἀπό
  choice: Guarde-se de
  rationale: Expressa em português natural a exortação para estar atento e proteger-se de uma influência perigosa.
- source_word: πνεύματος τῆς πορνείας
  choice: espírito da imoralidade sexual
  rationale: Preserva tanto o referente espiritual quanto o sentido amplo de πορνεία, sem o restringir a uma única prática sexual.
- source_word: ἐνδελεχῆ
  choice: persistente
  rationale: Segue o sentido contextual adotado pelo texto de consulta, embora a transmissão grega desta expressão seja incerta.
- source_word: μέλλει μιαίνειν
  choice: está prestes a profanar
  rationale: Mantém a iminência de μέλλει e traduz μιαίνω com um verbo apropriado ao objeto sagrado.
- source_word: διὰ τοῦ σπέρματός σου
  choice: por meio da sua descendência
  rationale: No contexto, σπέρμα designa a linhagem ou os descendentes; a formulação conserva a relação instrumental indicada por διά.
- source_word: τὰ ἅγια
  choice: as coisas santas
  rationale: Conserva a amplitude e a ambiguidade do plural substantivado, sem especificar santuário, sacerdócio ou objetos sagrados.
theological_decisions:
- issue: Referente de τὰ ἅγια
  choice: as coisas santas
  alternative: o santuário / os objetos sagrados
  rationale: O grego não identifica com precisão o referente; a tradução evita resolver indevidamente a ambiguidade cultual.
- issue: Agência na profanação
  choice: ele é persistente e está prestes a profanar
  alternative: isso é persistente e está prestes a profanar
  rationale: O pronome retoma naturalmente “o espírito” em português, sem negar que o antecedente conceitual possa abranger a imoralidade sexual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Empregou-se “você” de modo implícito em “sua”, evitando formas excessivamente arcaicas. A ordem foi levemente ajustada para fluência, sem eliminar as ambiguidades do original.
