  source_fidelity: 'A tradução reproduz com fidelidade o conteúdo e as imagens principais do grego: a vingança com Simeão, o espírito de entendimento do Senhor, a destruição do próprio caminho, o pecado edificado, a injustiça sentada, a oração por salvação e a abertura dos céus. A revisão ajusta pequenos pontos para conservar melhor a sequência marcada por τότε em 2:2 e evitar introduzir um «então» não expresso em 2:4.'
