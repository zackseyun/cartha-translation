  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002.yaml
  text: 1[a]. I, Levi, was born in Haran, and I came with my father to Shechem. 2. And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor. 3[b]. And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers. 4. And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved. 5. Then sleep fell upon me, and I saw a high mountain, and I was on it. 6. And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi[c], enter.”
translation:
  language: pt
  text: '1. Eu, Levi, nasci em Harã e fui com meu pai para Siquém. 2. Eu ainda era jovem, com cerca de vinte anos, e então, junto com Simeão, executei a vingança por nossa irmã Diná contra Hamor. 3. Enquanto eu pastoreava em Abel-Maul, um espírito de entendimento do Senhor veio sobre mim, e vi todas as pessoas destruindo o próprio caminho[a]; o pecado era edificado sobre uma muralha, e a injustiça estava sentada sobre torres. 4. Entristeci-me por causa da linhagem dos filhos dos homens[b] e orei ao Senhor para que eu fosse salvo. 5. Então o sono caiu sobre mim, e vi uma alta montanha; eu estava sobre ela. 6. E eis que os céus se abriram[c], e um anjo do Senhor me disse: “Levi, Levi, entra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “arruinando” ou “corrompendo seu modo de viver”; literalmente, as pessoas destroem o próprio “caminho”, isto é, sua conduta.
    reason: Alternativa lexical e esclarecimento do idioma moral.
  - marker: b
    text: “A linhagem dos filhos dos homens” é uma expressão solene, de estilo semítico, que se refere à humanidade.
    reason: Nota cultural e estilística.
  - marker: c
    text: A abertura dos céus é linguagem característica de visões apocalípticas, encontrada também em outras cenas visionárias bíblicas e judaicas.
    reason: Contexto literário e referência temática.
lexical_decisions:
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: executei a vingança
  rationale: Mantém a força ativa da expressão e a gravidade da participação de Levi na retaliação, sem suavizá-la como mero sentimento.
- source_word: νεώτερος
  choice: ainda era jovem
  rationale: Expressa naturalmente a juventude relativa de Levi no contexto autobiográfico, imediatamente precisada como cerca de vinte anos.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: um espírito de entendimento vindo do Senhor
  rationale: Preserva a construção sem artigo e a procedência divina sem identificar explicitamente a expressão como título do Espírito Santo.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: destruindo o próprio caminho
  rationale: Conserva de perto a força de ἀφανίζω e o idioma moral de 'caminho', deixando a nota esclarecer que se trata do modo de viver ou da conduta.
- source_word: ἁμαρτία ... οἰκοδομεῖτο
  choice: o pecado era edificado
  rationale: Retém a metáfora arquitetônica e a forma passiva da fonte.
- source_word: ἀδικία ἐκάθητο
  choice: a injustiça estava sentada
  rationale: Preserva a personificação deliberadamente incomum da injustiça assentada sobre torres.
- source_word: γένος τῶν υἱῶν τῶν ἀνθρώπων
  choice: a linhagem dos filhos dos homens
  rationale: Mantém o tom solene e semitizante da expressão, sem reduzi-la simplesmente a 'humanidade'.
- source_word: ὅπως σωθῶ
  choice: para que eu fosse salvo
  rationale: Conserva a amplitude de σωθῶ, que pode abranger livramento e salvação sem limitar a oração à preservação física.
- source_word: ἐπέπεσέ με ὕπνος
  choice: o sono caiu sobre mim
  rationale: Reproduz a imagem vívida do idioma grego e combina com o cenário visionário.
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: os céus se abriram
  rationale: Mantém o plural grego e emprega linguagem apocalíptica natural em português.
theological_decisions:
- issue: Natureza de πνεῦμα συνέσεως
  choice: um espírito de entendimento vindo do Senhor
  alternative: o Espírito de entendimento / o Espírito Santo de entendimento
  rationale: A construção grega não exige uma identificação titular ou pneumatológica posterior; a tradução preserva a origem divina e a ambiguidade.
- issue: Alcance de σωθῶ
  choice: fosse salvo
  alternative: fosse livrado / fosse preservado
  rationale: O contexto envolve corrupção moral e um pedido pessoal de resgate; 'salvo' preserva tanto a dimensão existencial quanto a teológica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi tornada natural sem eliminar as imagens marcantes da fonte, como o pecado edificado, a injustiça sentada e o sono que cai sobre Levi. Os topônimos seguem formas portuguesas correntes quando disponíveis: Harã, Siquém, Diná e Hamor; Abel-Maul foi transliterado.'
