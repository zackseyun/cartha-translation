  terminology: Os nomes Harã, Siquém, Simeão, Diná e Hamor são adequados. «Espírito de entendimento do Senhor» mantém a origem divina sem impor uma identificação doutrinal posterior. «Linhagem dos filhos dos homens» preserva de modo aceitável o tom solene e semitizante; a nota esclarece o seu referente.
  issues:
