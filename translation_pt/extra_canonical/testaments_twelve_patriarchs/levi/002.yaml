    issue: A sequência temporal de τότε em 2:2 fica atenuada por «quando».
    rationale: O grego apresenta a idade de Levi e acrescenta «então» à sua ação. «E então» preserva melhor essa progressão, sem alterar o sentido.
  - severity: low
    issue: «Então» em 2:4 não corresponde a um marcador temporal explícito no grego.
    rationale: O texto tem apenas δέ, uma ligação discursiva. Retirar «Então» evita criar uma sequência temporal mais forte do que a fonte indica.
  - severity: low
    issue: «um espírito de entendimento vindo do Senhor veio sobre mim» repete «veio» de modo pouco natural.
    rationale: «Um espírito de entendimento do Senhor veio sobre mim» é mais fluente e continua a refletir πνεῦμα συνέσεως Κυρίου.
