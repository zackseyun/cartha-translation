  text: '1[a]. And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity according to all his law. 2. And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing. 3. For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes. 4[b]. Indeed, he will gain many friends more than parents, and many among men will desire to serve him and to hear the law from his mouth. 5. Therefore do righteousness, my children, upon the earth, so that you may find it in the heavens. 6. And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction. 7. Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perishes, no one can take away the wise man''s wisdom, except
    the blindness of ungodliness and the hardening of sin. 8. For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend. 9. Everyone who teaches good things and does them will share the throne of kings[c], just as Joseph my brother also did.'
translation:
  language: pt
  text: '**Testamento de Levi 13**


    **1.** E agora, meus filhos, eu lhes ordeno: temam o Senhor, seu Deus, de todo o coração e andem com simplicidade, segundo toda a sua Lei. **2.** Ensinem também as letras a seus filhos, para que tenham entendimento durante toda a vida, lendo sem cessar a Lei de Deus. **3.** Pois todo aquele que vier a conhecer a Lei do Senhor será honrado e não será estrangeiro aonde quer que vá. **4.** De fato, conquistará muitos amigos, mais do que pais,[a] e muitos desejarão servi-lo e ouvir a Lei de sua boca. **5.** Portanto, meus filhos, pratiquem a justiça na terra, para que a encontrem nos céus.[b] **6.** Semeiem coisas boas em suas almas, e vocês as encontrarão em sua vida. Mas, se semearem coisas más, colherão toda espécie de perturbação e aflição. **7.** Adquiram sabedoria no temor de Deus, pois, se houver cativeiro, cidades e terras forem destruídas, e ouro, prata e todos os bens se perderem, ninguém poderá tirar do sábio a sua sabedoria, a não ser a cegueira da impiedade e o endurecimento
    do pecado. **8.** Pois, se alguém se guardar dessas obras más, então a sabedoria se tornará para ele resplandecente até entre inimigos; em terra estrangeira, será uma pátria; e, no meio de adversários, ele encontrará um amigo.[c] **9.** Todo aquele que ensina coisas boas e as pratica será companheiro de trono de reis, assim como José, meu irmão.


    [a] A expressão grega “muitos amigos, mais do que pais” é difícil. Provavelmente indica que a pessoa instruída conquista muitos amigos para além do círculo familiar, ou mais do que obteria somente por sua posição familiar.


    [b] Literalmente, o grego diz: “pratiquem a justiça [...] para que encontrem nos céus”. O objeto de “encontrem” está implícito; aqui foi entendido como referência à justiça praticada na terra.


    [c] O grego é muito condensado: a sabedoria se torna “resplandecente entre inimigos”, e a pessoa encontra “pátria” até em território estrangeiro.'
