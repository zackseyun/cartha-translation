lexical_decisions:
- source_word: ἁπλότης
  choice: simplicidade
  rationale: Preserva a ideia ética de conduta íntegra, sem duplicidade e direta, sem reduzi-la a mera sinceridade subjetiva.
- source_word: γράμματα
  choice: as letras
  rationale: Mantém a referência concreta à instrução elementar e à alfabetização como meio para a leitura contínua da Lei.
- source_word: σύνεσις
  choice: entendimento
  rationale: Expressa adequadamente o alcance intelectual e moral do termo no contexto educativo.
- source_word: ξένος
  choice: estrangeiro
  rationale: Conserva o sentido social de alguém que, fora de seu lugar de origem, poderia não encontrar pertencimento.
- source_word: δουλεῦσαι
  choice: servir
  rationale: Embora o verbo possa indicar escravidão, neste contexto de honra e ensino denota serviço ou assistência voluntária.
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Em português corrente, 'praticar a justiça' comunica naturalmente a conduta reta diante de Deus, preservando a dimensão moral e religiosa.
- source_word: ψυχαῖς
  choice: almas
  rationale: Mantém a textura antropológica do grego e a imagem de semear no interior da pessoa.
- source_word: ταραχή
  choice: perturbação
  rationale: Abrange desordem, inquietação e dificuldades, formando um par natural com 'aflição'.
- source_word: κτήσασθε
  choice: adquiram
  rationale: Preserva o imperativo forte de obter a sabedoria como bem precioso.
- source_word: φόβῳ Θεοῦ
  choice: temor de Deus
  rationale: Mantém a expressão bíblica tradicional e seu peso moral e religioso.
- source_word: πώρωσις
  choice: endurecimento
  rationale: Reproduz a imagem de insensibilidade moral e combina naturalmente com a cegueira mencionada em paralelo.
- source_word: παρὰ τοῖς πολεμίοις λαμπρά
  choice: resplandecente até entre inimigos
  rationale: Transmite que a sabedoria continua manifesta e honrada mesmo em ambiente hostil, sem desfazer a formulação comprimida.
- source_word: σύνθρονος
  choice: partilhará o trono
  rationale: Expressa a ideia de estar entronizado juntamente com reis, evitando a sugestão menos precisa de tronos independentes.
theological_decisions:
- issue: Retribuição moral em 'pratiquem a justiça [...] para que a encontrem nos céus'
  choice: A justiça praticada na terra é encontrada nos céus, deixando implícita a natureza exata dessa correspondência.
  alternative: Para que encontrem um tesouro nos céus; ou para que vocês sejam encontrados nos céus.
  rationale: O objeto de εὕρητε não está expresso. O pronome português retoma naturalmente 'justiça', mas a nota registra a elipse e evita definir a recompensa além do que o grego permite.
- issue: Alcance da exceção no versículo 7
  choice: Somente a corrupção moral e espiritual — cegueira da impiedade e endurecimento do pecado — pode privar o sábio de sua sabedoria.
  alternative: A cegueira e o endurecimento seriam forças externas personificadas, ou a oração seria uma glosa explicativa posterior.
  rationale: A sintaxe apresenta esses vícios como a única exceção à impossibilidade de retirar a sabedoria; a tradução conserva a advertência sem desenvolver uma explicação doutrinária.
- issue: Imagens comprimidas acerca da sabedoria no versículo 8
  choice: 'Preservar as predicações sucessivas: resplandecente entre inimigos, pátria em terra estrangeira e amigo entre adversários.'
  alternative: Explicitar que a sabedoria faz a pessoa ser honrada, sentir-se em casa e conquistar amizade.
  rationale: A formulação nominal e ambígua do grego é poeticamente densa; explicá-la no corpo do texto eliminaria uma tensão genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' apenas quando necessário para explicitar o sujeito, mantém o imperativo plural natural e conserva expressões bíblicas reconhecíveis, como 'temor de Deus', sem arcaísmos excessivos.
