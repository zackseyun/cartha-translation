  text: But I tell you that because of him, your holy places will be laid waste to the ground.
translation:
  language: pt
  text: Mas eu lhes digo que, por causa dele, os lugares santos de vocês serão devastados até o chão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἅγια ὑμῶν
  choice: os lugares santos de vocês
  rationale: O neutro plural substantivado τὰ ἅγια, com o possessivo ὑμῶν, designa naturalmente os locais sagrados pertencentes ao grupo; esta formulação é clara e preserva o plural.
- source_word: ἔρημα
  choice: devastados
  rationale: O predicativo expressa que os lugares ficarão desolados ou arrasados; “devastados” comunica com naturalidade o resultado da destruição.
- source_word: ἕως ἐδάφους
  choice: até o chão
  rationale: Reproduz a imagem enfática de destruição que chega ao nível do solo, sem acrescentar uma interpretação mais específica.
theological_decisions:
- issue: Referente de δι᾽ αὐτόν
  choice: por causa dele
  alternative: por meio dele
  rationale: A preposição διά com acusativo indica causa. O pronome masculino singular permanece sem referente explicitado, preservando a dependência do contexto e a ambiguidade do texto isolado.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural ὑμῖν/ὑμῶν e pontuação que delimita claramente a expressão causal.
