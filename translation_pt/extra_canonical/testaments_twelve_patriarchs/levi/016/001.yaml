id: T12P.LEV.16.1
reference: Testament of Levi 16:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν *ἐγὼ ἔγνωκα¹ ὅτι ἑβδομήκοντα ἑβδομάδας² πλανηθήσεσθε³, καὶ τὴν ἱερωσύνην βεβηλώσετε⁴ καὶ *τὰ θυσιαστήρια⁵ μιανεῖτε⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/001.yaml
  text: And now I know that for seventy weeks you will go astray, and you will profane the priesthood and defile the altars.
translation:
  language: pt
  text: E agora eu sei que, durante setenta semanas[a], vocês se desviarão, profanarão o sacerdócio e contaminarão os altares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “setenta períodos de sete”; o texto não especifica se se trata de semanas comuns ou de uma contagem simbólica.'
    reason: Preservar a ambiguidade cronológica da expressão grega ἑβδομήκοντα ἑβδομάδας.
lexical_decisions:
- source_word: ἔγνωκα
  choice: eu sei
  rationale: O perfeito grego expressa conhecimento adquirido com resultado presente; em português natural, “eu sei” comunica bem esse estado atual.
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: durante setenta semanas
  rationale: Preserva a expressão temporal literalmente mensurada, sem decidir se “semanas” representa semanas comuns ou unidades simbólicas.
- source_word: πλανηθήσεσθε
  choice: vocês se desviarão
  rationale: O futuro passivo com sentido intransitivo pode indicar sair do caminho ou cair em erro; “se desviarão” mantém essa amplitude.
- source_word: βεβηλώσετε
  choice: profanarão
  rationale: Traduz diretamente a ideia de tratar como comum ou violar aquilo que é sagrado.
- source_word: μιανεῖτε
  choice: contaminarão
  rationale: Expressa impureza ritual e moral sem reduzir o verbo a mera sujeira física.
- source_word: θυσιαστήρια
  choice: altares
  rationale: Equivalente corrente e preciso para altares destinados ao sacrifício.
theological_decisions:
- issue: Sentido das “setenta semanas”
  choice: Manter “setenta semanas” no texto e registrar a ambiguidade em nota
  alternative: Interpretar como “setenta períodos de sete anos” ou “quatrocentos e noventa anos”
  rationale: O grego apresenta “semanas” sem explicitar a duração simbólica ou cronológica de cada unidade; a tradução não deve resolver essa questão interpretativa.
- issue: Agência no desvio
  choice: “vocês se desviarão”
  alternative: “vocês serão desencaminhados”
  rationale: Embora a forma grega seja passiva, πλανάομαι frequentemente funciona com sentido intransitivo. A opção adotada preserva a responsabilidade dos destinatários sem introduzir um agente externo não declarado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural de segunda pessoa. A coordenação verbal foi mantida direta e solene, e a ambiguidade temporal foi preservada por nota.
