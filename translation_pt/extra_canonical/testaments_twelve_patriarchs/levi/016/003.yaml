base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/003.yaml
  text: '[And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his rising, taking innocent blood in wickedness upon your heads.]'
translation:
  language: pt
  text: '[E vocês chamarão de enganador um homem que renova a Lei no poder do Altíssimo; por fim, se lançarão a matá-lo, sem conhecerem a sua estatura[b], assumindo, com maldade, sangue inocente sobre as suas cabeças.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego de todo este versículo é transmitido com sinais de incerteza, e uma parte da frase apresenta dificuldades textuais e sintáticas.
    reason: A edição-fonte põe o versículo entre colchetes e marca uma seção com sinais críticos; a nota informa o leitor sem reconstruir silenciosamente o texto.
  - marker: b
    text: 'Ou: “elevação”, “altura” ou “grandeza”. O sentido exato do termo grego neste contexto é incerto.'
    reason: ἀνάστημα pode indicar estatura ou altura e admitir sentido figurado; a nota preserva essa ambiguidade relevante.
lexical_decisions:
- source_word: καινοποιοῦντα νόμον
  choice: que renova a Lei
  rationale: O particípio exprime fazer novo ou renovar; “renova” é natural em português e mantém aberta a questão de como esse homem torna a Lei nova.
- source_word: ἐν δυνάμει ὑψίστου
  choice: no poder do Altíssimo
  rationale: Tradução direta da expressão preposicional, ligada de modo natural à ação de renovar a Lei, sem excluir por pontuação toda possível ambiguidade sintática.
- source_word: πλάνου προσαγορεύσετε
  choice: chamarão de enganador
  rationale: πλάνος designa alguém que desvia ou engana; “enganador” preserva a acusação feita contra o homem.
- source_word: τέλος ὁρμήσετε τοῦ ἀποκτεῖναι
  choice: por fim, avançarão para matá-lo
  rationale: Reproduz a ideia de um impulso ou avanço hostil que culmina na tentativa de matar, em português corrente e digno.
- source_word: ἀνάστημα
  choice: estatura
  rationale: Mantém o sentido lexical mais direto e a possível dimensão figurada do termo, sem decidir se se trata de altura física, posição ou grandeza.
- source_word: τὸ ἀθῷον αἷμα ... ἐπὶ τῆς κεφαλῆς ὑμῶν ἀναδεχόμενοι
  choice: tomarão sobre a própria cabeça ... sangue inocente
  rationale: Conserva a imagem bíblica de assumir culpa ou responsabilidade por sangue inocente.
theological_decisions:
- issue: Relação de “no poder do Altíssimo” com as expressões vizinhas
  choice: ligar primariamente a “renova a Lei”
  alternative: ligar a expressão a “chamarão de enganador”
  rationale: A posição e o sentido favorecem a renovação da Lei realizada no poder do Altíssimo; a redação evita acrescentar interpretação cristológica ou denominacional.
- issue: Sentido de ἀνάστημα
  choice: preservar literalmente como “estatura”
  alternative: traduzir interpretativamente como “elevação”, “grandeza” ou “ressurreição”
  rationale: O termo é semanticamente aberto neste contexto, e uma formulação mais específica resolveria indevidamente uma tensão genuína do texto.
- issue: Força de ὁρμήσετε τοῦ ἀποκτεῖναι
  choice: “avançarão para matá-lo”
  alternative: “conseguirão matá-lo” ou simplesmente “o matarão”
  rationale: O grego descreve o ímpeto dirigido ao ato de matar, não afirma de modo inequívoco o resultado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas naturais para leitores brasileiros. Mantiveram-se os colchetes externos da edição para sinalizar a condição textual do versículo. “Lei” foi grafada com inicial maiúscula por se referir à Lei religiosa, sem acrescentar identificação confessional.
