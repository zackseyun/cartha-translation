  to: '[E vocês chamarão de enganador um homem que renova a Lei no poder do Altíssimo; por fim, se lançarão a matá-lo, sem conhecerem a sua estatura[b], assumindo, com maldade, sangue inocente sobre as suas cabeças.][a]'
  rationale: A revisão corrige o plural exigido por «cabeças» e mantém a construção participial final sem acrescentar o conector «e assim». Não modifica a ambiguidade sintática em torno de «no poder do Altíssimo», nem resolve de modo interpretativo o sentido de ἀνάστημα.
