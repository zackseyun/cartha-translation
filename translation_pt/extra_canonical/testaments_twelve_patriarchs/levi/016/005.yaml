source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *τόπος ὑμῖν καθαρὸς οὐκ ἔσται³², ἀλλ᾽ ἔσεσθε³³ ἐν τοῖς ἔθνεσιν εἰς κατάραν καὶ *εἰς διασκορπισμόν³⁴, ἕως³⁵ *αὐτὸς πάλιν³⁶ ἐπισκέψηται³⁷ καὶ *οἰκτειρήσῃ καὶ³⁸ προσδέξηται³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/005.yaml
  text: And no clean place will be for you, but you will be among the nations of the earth for a curse and for scattering, until he himself visits again and shows compassion and receives you.
translation:
  language: pt
  text: E não haverá para vocês lugar puro, mas vocês estarão entre as nações para maldição e dispersão, até que ele mesmo volte a visitá-los, tenha compaixão e os acolha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπος ὑμῖν καθαρὸς οὐκ ἔσται
  choice: não haverá para vocês lugar puro
  rationale: Reproduz de perto a construção existencial grega e evita acrescentar a ideia de que o lugar deixará de existir ou de permanecer.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: É a equivalência natural de ἐν com sentido de presença no meio dos povos; o grego fornecido não contém a expressão 'da terra'.
- source_word: εἰς κατάραν
  choice: como objeto de maldição
  rationale: Expressa de modo natural em português a condição ou resultado indicado por εἰς, sem sugerir necessariamente que eles próprios pronunciarão uma maldição.
- source_word: εἰς διασκορπισμόν
  choice: e dispersão
  rationale: Mantém o substantivo abstrato e o paralelismo com 'maldição', comunicando a condição de serem espalhados.
- source_word: αὐτὸς πάλιν ἐπισκέψηται
  choice: ele mesmo volte a visitá-los
  rationale: Preserva a ênfase de αὐτός e o valor de πάλιν; o objeto pronominal é suprido naturalmente em português a partir do contexto.
- source_word: οἰκτειρήσῃ
  choice: tenha compaixão
  rationale: Traduz diretamente a ação misericordiosa do verbo sem impor uma formulação teológica mais específica.
- source_word: προσδέξηται
  choice: os acolha
  rationale: Comunica a ideia de receber favoravelmente ou aceitar, em linguagem atual e digna.
theological_decisions:
- issue: Identidade do sujeito de 'visitar', 'ter compaixão' e 'acolher'
  choice: manter o pronome 'ele' sem identificar explicitamente o referente
  alternative: explicitar 'Deus' ou outro referente
  rationale: O trecho grego usa apenas αὐτός e não nomeia o sujeito neste versículo; a tradução preserva essa dependência contextual e a ambiguidade genuína.
- issue: Natureza da maldição
  choice: traduzir como condição de serem 'objeto de maldição'
  alternative: traduzir 'para uma maldição'
  rationale: A formulação escolhida é idiomática e mantém a tensão do texto sem determinar quem profere a maldição nem desenvolver sua natureza.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação mantém solenidade moderada, paralelismo e proximidade sintática com o grego, sem reproduzir de modo rígido construções pouco naturais.
