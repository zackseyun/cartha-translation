id: T12P.LEV.16.2
reference: Testament of Levi 16:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ τὸν νόμον ἀθετήσετε⁷ καὶ λόγους προφητῶν ἐξουδενώσετε⁸ *ἐν διαστροφῇ κακῇ⁹. *διώξετε δὲ¹⁰ ἄνδρας¹¹ δικαίους, καὶ εὐσεβεῖς μισήσετε¹², ἀληθινῶν¹³ λόγους βδελύξεσθε¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/002.yaml
  text: And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.
translation:
  language: pt
  text: E vocês rejeitarão a Lei e tratarão com desprezo as palavras dos profetas, em perversa corrupção. Perseguirão homens justos, odiarão os piedosos e abominarão as palavras dos verazes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσετε
  choice: rejeitarão
  rationale: Expressa a ideia de invalidar, desprezar ou pôr de lado a Lei, com força mais clara que uma simples negligência.
- source_word: ἐξουδενώσετε
  choice: tratarão com desprezo
  rationale: Reproduz o sentido de considerar sem valor ou desprezível, em linguagem portuguesa natural.
- source_word: ἐν διαστροφῇ κακῇ
  choice: em sua perversa corrupção
  rationale: Mantém a combinação enfática de desvio/corrupção e maldade; o possessivo explicita naturalmente que essa disposição pertence aos destinatários.
- source_word: διώξετε
  choice: Perseguirão
  rationale: Equivalente direto para perseguir ou hostilizar.
- source_word: εὐσεβεῖς
  choice: os piedosos
  rationale: Designa pessoas devotas ou reverentes para com Deus sem acrescentar uma identidade confessional.
- source_word: βδελύξεσθε
  choice: abominarão
  rationale: Preserva a forte repulsa expressa pelo verbo grego.
- source_word: ἀληθινῶν
  choice: dos que dizem a verdade
  rationale: Entende o adjetivo substantivado como referência a pessoas verazes, em concordância com a construção transmitida e com o paralelismo envolvendo grupos de pessoas.
theological_decisions:
- issue: Sentido de νόμος
  choice: a Lei
  alternative: a lei
  rationale: A referência parece ser à Lei recebida por Israel, em paralelo com as palavras dos profetas; a inicial maiúscula torna essa referência reconhecível sem especificar uma delimitação canônica.
- issue: Relação sintática de ἀληθινῶν com λόγους
  choice: as palavras dos que dizem a verdade
  alternative: palavras verdadeiras
  rationale: A forma genitiva plural ἀληθινῶν favorece a leitura substantivada, 'dos verazes', embora a construção seja compacta; a tradução evita corrigir silenciosamente o texto para um adjetivo acusativo que qualificaria 'palavras'.
translation_notes:
  register: Português moderno, digno e acessível, com segunda pessoa do plural expressa por “vocês” apenas na abertura e verbos subsequentes sem repetição do pronome. A formulação conserva o tom profético e acusatório do grego.
