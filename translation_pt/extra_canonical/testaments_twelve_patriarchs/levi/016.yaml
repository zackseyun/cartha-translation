base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016.yaml
  text: 'And now I know that for seventy weeks you will go astray[a], and you will profane the priesthood and defile the altars. And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.


    And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his stature, taking innocent blood upon your heads in wickedness.


    But I tell you that because of him your holy places will be laid waste to the ground. And no clean place will remain for you, but you will be among the nations of the earth for a curse and for scattering[b][a][a], until he himself visits again and shows compassion and receives you.'
translation:
  language: pt
  text: '**Testamento de Levi 16**


    **1** E agora sei que, durante setenta semanas, vocês se desviarão; profanarão o sacerdócio e contaminarão os altares. **2** Porão de lado a Lei e, com perversa distorção, tratarão com desprezo as palavras dos profetas. Perseguirão homens justos, odiarão os piedosos e abominarão as palavras dos que dizem a verdade.


    **3** E[a] a um homem que renova[b] a Lei no poder do Altíssimo vocês chamarão de enganador. Por fim, se lançarão a matá-lo, sem conhecer a sua estatura[c], e, por maldade, trarão sobre as próprias cabeças o sangue inocente.


    **4** Mas eu lhes digo que, por causa dele, os lugares santos de vocês serão arrasados até o chão. **5** E não haverá lugar puro para vocês; pelo contrário, entre as nações vocês serão objeto de maldição e dispersão, até que ele mesmo[d] volte a visitá-los, tenha compaixão e os acolha.


    **Notas**


    [a] O texto grego desta frase é difícil e apresenta sinais de perturbação textual. A tradução acompanha o testemunho fornecido, mas a redação pode refletir uma ampliação ou interpolação posterior.


    [b] Ou: “torna nova a Lei”. A expressão também poderia ser entendida como uma acusação hostil contra alguém que reforma a Lei.


    [c] “Estatura” traduz literalmente o grego; o sentido também pode ser “seu verdadeiro valor” ou “sua majestade”.


    [d] O sujeito de “ele mesmo volte a visitá-los” pode ser Deus ou, possivelmente, o homem mencionado anteriormente. O grego não impõe uma única interpretação.'
