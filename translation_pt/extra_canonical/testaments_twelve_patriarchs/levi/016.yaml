  register: Português moderno, digno e acessível, com uso de “vocês” e formas verbais correntes para boa legibilidade brasileira. O vocabulário cultual — “sacerdócio”, “altares”, “Lei”, “lugares santos” — foi preservado, e as ambiguidades textuais e teológicas foram mantidas ou explicitadas em notas.
