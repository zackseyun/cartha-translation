lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: setenta semanas
  rationale: Mantém a expressão temporal literal e sua possível ressonância apocalíptica, sem interpretá-la como “setenta setes” ou convertê-la em anos.
- source_word: πλανηθήσεσθε
  choice: vocês se desviarão
  rationale: Preserva o sentido de afastamento moral e admite, sem explicitar em excesso, a possível nuance passiva de ser induzido ao erro.
- source_word: ἱερωσύνην βεβηλώσετε
  choice: profanarão o sacerdócio
  rationale: Conserva o vocabulário cultual e a ideia de violação do que é sagrado.
- source_word: θυσιαστήρια μιανεῖτε
  choice: contaminarão os altares
  rationale: Expressa impureza cultual de maneira clara e mantém o plural do grego.
- source_word: τὸν νόμον ἀθετήσετε
  choice: porão de lado a Lei
  rationale: Comunica rejeição ou desconsideração sem introduzir conotações teológicas técnicas posteriores.
- source_word: λόγους προφητῶν ἐξουδενώσετε
  choice: tratarão com desprezo as palavras dos profetas
  rationale: Reproduz a força de desdenhar ou considerar sem valor em português corrente e digno.
- source_word: ἐν διαστροφῇ κακῇ
  choice: com perversa distorção
  rationale: Mantém a imagem moral de torção ou perversão, em vez de reduzi-la a um advérbio genérico.
- source_word: εὐσεβεῖς
  choice: os piedosos
  rationale: Termo natural em português para pessoas devotas ou tementes a Deus, sem especificação denominacional.
- source_word: ἀληθινῶν λόγους
  choice: as palavras dos que dizem a verdade
  rationale: Explicita com naturalidade a construção grega comprimida, preservando a referência provável a pessoas verazes.
- source_word: ἄνδρα καινοποιοῦντα νόμον
  choice: um homem que renova a Lei
  rationale: Reflete a ideia de fazer nova ou renovar a Lei, preservando a carga potencialmente controversa da expressão; a alternativa literal é registrada em nota.
- source_word: πλάνου
  choice: enganador
  rationale: Traduz a acusação de alguém que desvia outros sem antecipar uma identificação teológica específica.
- source_word: τὸ ἀνάστημα
  choice: a sua estatura
  rationale: Segue literalmente o substantivo grego e deixa em nota os sentidos figurados possíveis, como valor ou majestade.
- source_word: τὰ ἅγια
  choice: os lugares santos
  rationale: Preserva o plural e a amplitude do termo, que pode abranger santuários ou coisas/lugares consagrados.
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  choice: objeto de maldição e dispersão
  rationale: Conserva os dois substantivos e apresenta de modo idiomático a condição resultante entre as nações.
- source_word: ἐπισκέψηται ... προσδέξηται
  choice: volte a visitá-los ... e os acolha
  rationale: “Visitar” mantém a linguagem de intervenção ou cuidado, enquanto “acolher” comunica recepção favorável sem acrescentar um referente explícito.
theological_decisions:
- issue: Possível perturbação, ampliação ou interpolação em 16:3
  choice: Incluir a passagem no texto principal e assinalar sua dificuldade em nota
  alternative: Omitir a seção como secundária ou vertê-la em linguagem messiânica explícita
  rationale: O testemunho grego fornecido contém a passagem. Incluí-la respeita a evidência disponível, enquanto a nota informa com transparência sua condição textual sem impor uma conclusão.
- issue: Identidade do homem que renova a Lei
  choice: Traduzir de forma não identificadora como “um homem que renova a Lei”
  alternative: Identificá-lo explicitamente como Messias, legislador ou reformador
  rationale: O texto não nomeia a figura. A formulação conserva sua função literária e evita importar uma identificação doutrinária.
- issue: Referente de αὐτός em 16:5
  choice: Manter “ele mesmo” sem identificar o sujeito
  alternative: Explicitar “o próprio Deus” ou entender a expressão como referência ao homem anteriormente mencionado
  rationale: O antecedente permanece aberto no grego. A nota registra as duas possibilidades principais sem resolver a tensão teológica.
