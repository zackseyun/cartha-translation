lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: um escudo de bronze
  rationale: Traduz diretamente o objeto e preserva a relação etimológica com o topônimo Áspis.
- source_word: συνετήρουν ... ἐν τῇ καρδίᾳ μου
  choice: guardei ... no coração
  rationale: Expressão portuguesa natural que mantém a ideia de reter interiormente as palavras.
- source_word: συνεβούλευσα
  choice: aconselhei-me com
  rationale: Comunica consulta deliberada sem o arcaísmo de uma tradução excessivamente literal.
- source_word: μὴ περιτμηθῆναι αὐτούς
  choice: que não se circuncidassem
  rationale: Reproduz naturalmente em português a construção infinitiva médio-passiva no contexto.
- source_word: ἐζήλωσα
  choice: ardia de indignação
  rationale: No contexto, denota zelo intenso diante de um ultraje, não inveja ou ciúme.
- source_word: βδέλυγμα
  choice: abominação
  rationale: Preserva a forte repulsa moral expressa pelo termo grego.
- source_word: ἐν στόματι μαχαίρας
  choice: ao fio da espada
  rationale: Equivalente idiomático consagrado e claro para a expressão semítica reproduzida no grego.
- source_word: παρεῖδεν ἡμῖν
  choice: passou por nós sem nos favorecer
  rationale: Explicita com moderação o sentido contextual de não conceder favor nas bênçãos, mantendo em nota uma alternativa mais literal.
- source_word: παρὰ γνώμην αὐτοῦ
  choice: contra o parecer dele
  rationale: Expressa decisão ou juízo considerado, e não simples desconhecimento.
- source_word: ἐμαλακίσθη
  choice: ficou enfraquecido
  rationale: Escolha cautelosa para um verbo difícil; a nota preserva outras possibilidades sem decidir em excesso.
- source_word: ἀπόφασις θεοῦ
  choice: uma sentença de Deus
  rationale: Mantém a força judicial de uma decisão divina determinada.
- source_word: εἰς κακά
  choice: para o mal deles
  rationale: Conserva a formulação severa e a direção adversa do juízo sem identificar o mal moralmente com Deus.
- source_word: τὰ ποίμνια ὀγκούμενα
  choice: seus rebanhos quando estavam prenhes
  rationale: Interpreta ὀγκούμενα como animais aumentados ou avolumados pela gestação, adequado ao contexto pastoril.
- source_word: τὰς ξένας
  choice: mulheres estrangeiras
  rationale: Preserva o feminino substantivado e a conexão com o tratamento hostil dispensado a estrangeiros.
- source_word: εἰς τέλος
  choice: por completo
  rationale: Comunica a ideia de alcance pleno ou final, registrando a expressão literal na nota.
theological_decisions:
- issue: Interpretação providencial da destruição de Siquém
  choice: Preservar simultaneamente a confissão de pecado dos irmãos e a afirmação de Levi de que o acontecimento era uma sentença divina contra os habitantes.
  alternative: Apresentar o massacre como inteiramente justo ou, no sentido oposto, eliminar sua dimensão providencial.
  rationale: Os versículos 7–11 mantêm em tensão a responsabilidade humana pecaminosa e o juízo providencial; a tradução não deve resolver essa tensão.
- issue: Referência a Sara e Rebeca no versículo 8
  choice: Traduzir os nomes e a intenção atribuída aos homens de Siquém, assinalando a dificuldade textual.
  alternative: Omitir a frase como corrupção textual ou generalizá-la para mulheres ancestrais não nomeadas.
  rationale: Apesar da sintaxe difícil, o testemunho grego conservado nomeia explicitamente Sara e Rebeca.
- issue: Formulação do mal na sentença divina
  choice: “uma sentença de Deus para o mal deles”
  alternative: “um decreto de Deus para fazer o mal” ou “uma calamidade determinada por Deus”.
  rationale: A escolha conserva a linguagem adversa do grego e indica que o dano recai sobre eles, sem transformar a frase em uma afirmação mais ampla sobre a autoria divina do mal moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os nomes seguem formas bíblicas correntes em português quando disponíveis. A sintaxe narrativa foi levemente naturalizada, mas ambiguidades textuais e a tensão teológica central foram preservadas em texto e notas.
