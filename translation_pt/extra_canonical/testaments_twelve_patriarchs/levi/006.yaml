  text: 1 And as I was going to my father[a], I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, on the right of Abim. 2 And I kept these words in my heart. 3 After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous on account of the abomination which they had committed against my sister. 4 And I killed Shechem first, and Simeon killed Emmor. 5 And after this my brothers came and struck that city with the edge of the sword. 6 And my father heard these things, and being angry he was grieved because they had accepted circumcision and died, and in his blessings he passed over us. 7 For we sinned, because we had done this contrary to his judgment, though he became weak on that day. 8 But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them. 9 And
    they pursued Abraham our father when he was a stranger, and they oppressed his flocks when they were swollen with increase, and they cruelly mistreated Eblan his home-born servant. 10 And indeed in this way they used to act toward all strangers, seizing foreign women by force and driving them away[b][c][d][e]. 11 But the wrath of God came upon them completely.
translation:
  language: pt
  text: '**Testamento de Levi 6**


    1 Quando eu estava indo ao encontro de meu pai, encontrei um escudo de bronze; por isso, o nome do monte é Áspis, que fica perto de Gebal, à direita de Abim. 2 E guardei essas palavras no coração. 3 Depois disso, consultei meu pai e Rúben, para que ele dissesse aos filhos de Emor que não se circuncidassem, pois eu ardia de indignação por causa da abominação que haviam cometido contra minha irmã. 4 Eu fui o primeiro a matar Siquém, e Simeão matou Emor. 5 Depois disso, meus irmãos vieram e feriram aquela cidade ao fio da espada. 6 Meu pai soube dessas coisas e, irado, entristeceu-se porque eles haviam aceitado a circuncisão e depois morreram; e, em suas bênçãos, passou por nós sem nos favorecer.[a] 7 Pois pecamos, porque fizemos isso contra o parecer dele, embora naquele dia ele tenha ficado enfraquecido.[b] 8 Eu, porém, vi que era uma sentença de Deus para o mal deles, porque pretendiam fazer a Sara e a Rebeca o que haviam feito a Diná, nossa irmã;[c] e o Senhor os impediu.


    9 Eles também perseguiram Abraão, nosso pai, quando ele era estrangeiro, oprimiram seus rebanhos quando cresciam e maltrataram cruelmente Eblã, servo nascido em sua casa.[d] 10 De fato, era assim que costumavam agir com todos os estrangeiros: apoderavam-se à força de mulheres estrangeiras e as expulsavam. 11 Mas a ira de Deus os alcançou por completo.[e]


    [a] Ou: “não nos levou em conta nas bênçãos”; isto é, Jacó não favoreceu Levi e Simeão ao pronunciar as bênçãos.


    [b] O verbo grego é difícil e pode indicar que Jacó ficou abrandado, enfraquecido ou abatido naquele dia.


    [c] Este versículo apresenta dificuldades textuais. O grego parece dizer que os homens de Siquém pretendiam tratar Sara e Rebeca como haviam tratado Diná.


    [d] O nome “Eblã” é incerto na transmissão do texto. O sentido é que um servo nascido na casa de Abraão foi duramente maltratado.


    [e] A expressão grega, literalmente “a ira de Deus os alcançou até o fim”, indica um juízo completo ou definitivo.'
