  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ΓΚαὶ ἰδοὺ⁴⁾ ἀθῷός εἰμι⁵ τῆς⁶ ἀσεβείας⁷ ὑμῶν⁸ *καὶ παραβάσεως⁹ ἣν ποιήσετε ἐπὶ *τῇ συντελείᾳ¹⁰ *τῶν αἰώνων¹¹ [εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν]¹² *πλανῶντες τὸν Ἰσραήλ¹³, καὶ ἐπεγείροντες¹⁴ *ἐπ᾿ αὐτὸν¹⁵ κακὰ μεγάλα¹⁶ *παρὰ Κυρίου¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/002.yaml
  text: And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils against him from the Lord.
translation:
  language: pt
  text: E eis que sou inocente da impiedade e da transgressão de vocês, que cometerão na consumação das eras [contra o Salvador do mundo, o Messias][a], desencaminhando Israel e suscitando contra ele grandes males vindos do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “contra o Salvador do mundo, o Messias” aparece entre colchetes na edição grega utilizada, indicando incerteza textual; o grego traz literalmente “Cristo” como título.
    reason: Sinalizar ao leitor a condição textual da expressão e esclarecer a tradução de χριστόν.
lexical_decisions:
- source_word: ἀθῷός εἰμι
  choice: estou inocente
  rationale: Expressa diretamente a declaração de isenção de culpa do grego, em linguagem natural e digna.
- source_word: ἀσέβεια
  choice: impiedade
  rationale: Preserva o sentido religioso e moral do termo sem o reduzir a mera maldade.
- source_word: παράβασις
  choice: transgressão
  rationale: Mantém a ideia de ultrapassar ou violar um limite ou mandamento.
- source_word: ἐπὶ τῇ συντελείᾳ τῶν αἰώνων
  choice: na consumação das eras
  rationale: Conserva o plural αἰώνων e o sentido escatológico de συντέλεια sem substituí-lo simplesmente por 'fim do mundo'.
- source_word: χριστόν
  choice: o Messias
  rationale: Trata χριστός como título, adequado ao contexto judaico da obra; evita que seja entendido apenas como nome próprio.
- source_word: πλανῶντες
  choice: desencaminhando
  rationale: Comunica a ação de levar Israel ao erro de modo claro e corrente.
- source_word: ἐπεγείροντες ... κακὰ μεγάλα
  choice: suscitando ... grandes males
  rationale: Reproduz a ideia de fazer levantar ou provocar males, sem tornar a formulação excessivamente literal.
- source_word: παρὰ Κυρίου
  choice: vindos do Senhor
  rationale: Preserva a indicação explícita de procedência presente no grego e sua tensão teológica.
theological_decisions:
- issue: Referente de ἐπ᾿ αὐτόν ('contra ele')
  choice: Mantido como pronome masculino, com referência mais próxima ao Salvador/Messias.
  alternative: Entender o pronome como referência a Israel.
  rationale: A frase interpolada fornece um antecedente masculino semanticamente forte, e esta leitura acompanha a sintaxe adotada na camada inglesa auditada; o pronome permanece sem explicitação adicional para não eliminar totalmente a ambiguidade.
- issue: Origem dos 'grandes males'
  choice: Traduzido literalmente como 'vindos do Senhor'.
  alternative: Atenuar para 'diante do Senhor' ou deslocar a expressão para evitar atribuir os males ao Senhor.
  rationale: παρὰ com genitivo indica procedência; a tensão teológica é genuína e não deve ser silenciosamente resolvida.
- issue: Status da expressão sobre o Salvador/Messias
  choice: Mantida entre colchetes e acompanhada de nota textual.
  alternative: Integrá-la sem marcação ao corpo do versículo ou omiti-la.
  rationale: A própria edição-fonte assinala a expressão entre colchetes, indicando incerteza textual.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conserva termos de peso religioso como “impiedade”, “transgressão” e “consumação das eras”, mas usa construções correntes como “de vocês” e “desencaminhando”. Mantém os colchetes editoriais e a tensão de que os males vêm do Senhor.
