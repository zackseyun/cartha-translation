  text: And you will be scattered as captives among the nations, and there you will be for a reproach and a curse.
translation:
  language: pt
  text: E vocês serão dispersos como cativos entre as nações, e ali serão alvo de desprezo e de maldição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασπαρήσεσθε
  choice: serão dispersos
  rationale: Reproduz o futuro passivo do verbo grego e comunica com naturalidade a dispersão forçada.
- source_word: αἰχμάλωτοι
  choice: como cativos
  rationale: Expressa a condição em que serão dispersos, sem restringir o termo a uma formulação militar mais estreita.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: Neste contexto de dispersão, 'entre' é a formulação portuguesa mais natural para a presença no meio de povos estrangeiros.
- source_word: εἰς ὄνειδος
  choice: motivo de vergonha
  rationale: Comunica o sentido de desonra pública ou opróbrio em português corrente e digno.
- source_word: εἰς κατάραν
  choice: de maldição
  rationale: Preserva diretamente a linguagem forte de κατάρα e o paralelismo com a expressão anterior.
- source_word: ἐκεῖ
  choice: ali
  rationale: Mantém a referência explícita ao lugar da dispersão entre as nações.
theological_decisions:
- issue: Agência implícita no futuro passivo
  choice: Manter 'serão dispersos' sem identificar o agente
  alternative: Explicitar Deus ou as nações como agente
  rationale: O grego usa uma forma passiva e não nomeia quem realiza a dispersão; a tradução preserva essa abertura.
- issue: Força de κατάρα
  choice: Traduzir literalmente por 'maldição'
  alternative: Atenuar para 'objeto de desprezo' ou expressão semelhante
  rationale: A atenuação eliminaria a tensão teológica e retórica presente no termo grego.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão ampla no espaço lusófono. O paralelismo final foi preservado sem arcaísmos.
