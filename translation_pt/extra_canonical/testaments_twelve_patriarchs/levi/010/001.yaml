lexical_decisions:
- source_word: φυλάξατε
  choice: guardem
  rationale: Preserva o sentido de observar e cumprir cuidadosamente as instruções, com formulação natural em português.
- source_word: τέκνα
  choice: meus filhos
  rationale: O vocativo é dirigido aos descendentes de Levi; a inclusão de 'meus' torna a relação explícita e idiomática sem alterar o sentido.
- source_word: ἀνήγγειλα
  choice: anunciei
  rationale: Expressa a comunicação fiel do que foi recebido, preservando o valor de relatar ou dar a conhecer.
- source_word: παρὰ τῶν πατέρων μου
  choice: de meus pais
  rationale: Mantém a possível referência aos antepassados conforme o uso de 'pais' em linguagem bíblica, sem substituí-la interpretativamente por 'antepassados'.
