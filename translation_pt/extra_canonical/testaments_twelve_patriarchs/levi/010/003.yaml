source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνομήσετε¹⁸ *ἐν τῷ¹⁹ Ἰσραήλ²⁰, ὥστε μὴ βαστάζειν²¹ τὴν²² Ἱερουσαλήμ²³ ἀπὸ προσώπου τῆς²⁴ πονηρίας ὑμῶν, ἀλλὰ σχισθήσεται²⁵ τὸ καταπέτασμα²⁶ τοῦ ναοῦ, ὥστε μὴ καλύψαι²⁷ τὴν²⁸ ἀσχημοσύνην ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/003.yaml
  text: And you will act lawlessly in Israel, so that Jerusalem will not be able to bear your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame.
translation:
  language: pt
  text: E vocês agirão sem respeito pela lei em Israel, de modo que Jerusalém não poderá suportar a maldade de vocês; mas o véu do templo será rasgado, de modo que já não cubra a vergonha de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομήσετε
  choice: agirão contra a Lei
  rationale: Expressa o sentido de praticar a ilegalidade ou transgredir a Lei, preservando a dimensão moral e religiosa do verbo sem recorrer ao pouco natural «agir iniquamente».
- source_word: βαστάζειν
  choice: suportar
  rationale: Mantém a imagem de carregar ou aguentar um peso, aqui aplicada à maldade dos destinatários.
- source_word: πονηρίας
  choice: maldade
  rationale: Equivalente corrente e abrangente para a conduta perversa indicada pelo termo grego.
- source_word: καταπέτασμα
  choice: véu
  rationale: Designação tradicional e clara para a cortina do templo.
- source_word: σχισθήσεται
  choice: será rasgado
  rationale: Reproduz diretamente o futuro passivo do grego.
- source_word: ἀσχημοσύνην
  choice: vergonha
  rationale: No contexto, refere-se ao caráter vergonhoso ou à ignomínia da conduta; «vergonha» é natural e preserva a força moral da expressão.
theological_decisions:
- issue: Relação entre a transgressão e a Lei
  choice: agirão contra a Lei
  alternative: agirão de modo perverso / cometerão iniquidades
  rationale: O verbo ἀνομέω está ligado a ἀνομία e pode evocar especificamente a violação da Lei; a formulação escolhida mantém essa ressonância sem acrescentar uma identificação denominacional da Lei.
- issue: Finalidade ou resultado de ὥστε μὴ καλύψαι
  choice: e já não cobrirá
  alternative: para que já não cubra
  rationale: A construção consecutiva decorre do rasgar do véu. A coordenação em português comunica naturalmente o resultado, sem sugerir que o véu tenha intenção própria.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por «vocês». A sintaxe foi levemente ajustada para fluência, mantendo o paralelismo profético e as imagens do texto grego.
