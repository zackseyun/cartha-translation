base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/005.yaml
  text: For the house that the Lord will choose shall be called Jerusalem, as the book of Enoch the righteous contains.
translation:
  language: pt
  text: Pois a casa que o Senhor escolher será chamada Jerusalém, como consta no livro de Enoque, o justo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  choice: casa
  rationale: Preserva o sentido direto de οἶκος e a possível referência tanto a uma casa quanto a um santuário ou linhagem, sem explicitar além do grego.
- source_word: ἐκλέξεται
  choice: escolher
  rationale: Verbo natural em português e equivalente direto do futuro médio grego no contexto.
- source_word: περιέχει
  choice: consta
  rationale: Neste contexto de referência escrita, 'como consta no livro' expressa idiomaticamente que o livro contém ou registra a informação.
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: Enoque, o justo
  rationale: Mantém o epíteto substantivado e evita a leitura menos natural de que 'justo' modificaria o livro.
theological_decisions:
- issue: Identidade da 'casa' escolhida
  choice: Manter 'casa' sem interpretá-la como templo, santuário, povo ou dinastia
  alternative: Traduzir como 'templo' ou explicar a referência
  rationale: O termo οἶκος é semanticamente amplo, e o texto grego não resolve aqui qual aspecto está em primeiro plano.
- issue: Frase adicional mencionada na revisão inglesa
  choice: Não incluir 'e para maldição'
  alternative: Acrescentar 'e para maldição' com base na revisão registrada
  rationale: A frase καὶ εἰς κατάραν não aparece no texto grego fornecido nem no English POB apresentado. A tradução deve seguir primeiro a evidência da fonte original efetivamente disponibilizada.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A construção 'como consta no livro' é corrente e clara; a vírgula em 'Enoque, o justo' torna explícita a função de epíteto sem alterar o conteúdo.
