base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/009.yaml
  text: And they pursued Abraham our father while he was a stranger, and they oppressed his flocks while they were increasing, and they cruelly mistreated Eblan, his home-born servant.
translation:
  language: pt
  text: E perseguiram Abraão, nosso pai, enquanto ele vivia como estrangeiro; oprimiram seus rebanhos enquanto estes aumentavam e maltrataram cruelmente Eblã, o servo nascido em sua casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωξαν
  choice: perseguiram
  rationale: Expressa diretamente a ação hostil de perseguir, sem enfraquecê-la para mera pressão ou expulsão.
- source_word: ξένον ὄντα
  choice: enquanto ele vivia como estrangeiro
  rationale: Preserva a circunstância contínua indicada pelo particípio e comunica naturalmente a condição de Abraão como residente estrangeiro.
- source_word: κατεπόνησαν
  choice: oprimiram
  rationale: Reflete o sentido de afligir, sobrecarregar ou tratar duramente os rebanhos.
- source_word: τὰ ποίμνια ὀγκούμενα ὄντα
  choice: seus rebanhos enquanto estes aumentavam
  rationale: Traduz o particípio de modo natural, mantendo a ideia de crescimento ou expansão sem a imagem estranha de rebanhos 'inchados'.
- source_word: Ἐβλαὴν
  choice: Eblã
  rationale: Transliteração portuguesa simples do nome próprio grego, com acento para indicar a tonicidade final.
- source_word: οἰκογενῆ
  choice: o servo nascido em sua casa
  rationale: Comunica que Eblã era membro servil nascido no âmbito doméstico de Abraão; 'servo' é inferido pelo uso substantivado e pelo contexto.
- source_word: σφόδρα ἠκίσαντο
  choice: maltrataram cruelmente
  rationale: Reproduz a forte intensidade do advérbio e o sentido de ultrajar ou tratar de maneira abusiva.
