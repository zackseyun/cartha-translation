  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/006.yaml
  text: And my father heard these things, and being angry, he was grieved because they had accepted circumcision and died, and in his blessings he passed over us.
translation:
  language: pt
  text: E meu pai ouviu essas coisas e, irado, entristeceu-se porque eles haviam aceitado a circuncisão e morrido; e, em suas bênçãos, deixou-nos de lado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: irado
  rationale: Preserva de modo conciso e digno o sentido participial de ficar ou estar tomado de ira.
- source_word: κατεδέξαντο τὴν περιτομὴν
  choice: haviam aceitado a circuncisão
  rationale: Reproduz diretamente a ideia de aceitar ou consentir em receber a circuncisão, sem explicar além do grego.
- source_word: παρεῖδεν ἡμῖν
  choice: passou por nós sem nos abençoar
  rationale: O verbo pode significar passar por alto ou não levar em conta; no contexto das bênçãos, a formulação explicita apenas a implicação contextual necessária para soar natural em português.
theological_decisions:
- issue: Sentido de παρεῖδεν ἡμῖν no contexto das bênçãos
  choice: passou por nós sem nos abençoar
  alternative: não nos levou em conta
  rationale: A escolha mantém a imagem de omissão presente no verbo e esclarece seu efeito no contexto imediato, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O ponto e vírgula separa a reação do pai da consequência nas bênçãos, e a nota registra a dificuldade da oração final.
