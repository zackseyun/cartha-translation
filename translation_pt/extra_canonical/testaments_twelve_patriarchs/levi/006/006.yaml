  source_fidelity: A oração final do rascunho acrescenta «sem nos abençoar», explicitação que não está no grego. παρεῖδεν ἡμῖν significa que ele nos deixou de lado / não nos levou em conta; o contexto são as bênçãos, mas o texto não afirma diretamente que deixou de nos abençoar.
  naturalness: «E meu pai ouviu essas coisas e, irado, entristeceu-se» é natural e mantém adequadamente a sequência participial. «Deixou-nos de lado» é uma forma moderna, clara e idiomática para a oração final.
  terminology: «Circuncisão» e «irado» são adequados. «Em suas bênçãos» preserva a referência contextual sem transformar a omissão em uma afirmação mais específica.
