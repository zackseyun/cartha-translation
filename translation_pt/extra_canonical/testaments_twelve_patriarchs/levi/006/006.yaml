  - severity: low
    issue: Nota de rodapé apresenta uma alternativa semântica desnecessária e não sustenta a expansão do texto
    rationale: A incerteza editorial assinalada não autoriza inserir «sem nos abençoar» no corpo. Uma tradução direta preserva a concisão e a abertura sem exigir nota.
