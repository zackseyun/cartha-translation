  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/001.yaml
  text: And as I was going to my father, I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, to the right of Abim.
translation:
  language: pt
  text: E, enquanto eu ia ao encontro de meu pai, encontrei um escudo de bronze; por isso, o nome do monte é Áspis,[a] que fica perto de Gebal, à direita de Abimá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Áspis é a palavra grega para “escudo”; o nome do monte faz alusão ao escudo encontrado.
    reason: O jogo de palavras entre ἀσπίδα e Ἄσπις não é plenamente visível na transliteração portuguesa.
lexical_decisions:
- source_word: ὡς ἠρχόμην πρὸς τὸν πατέρα μου
  choice: enquanto eu ia ao encontro de meu pai
  rationale: Expressa naturalmente o valor temporal de ὡς com o imperfeito e preserva πρὸς como movimento em direção ao pai.
- source_word: ἀσπίδα χαλκῆν
  choice: um escudo de bronze
  rationale: ἀσπίς designa um escudo, e χαλκοῦς indica que era feito de bronze ou cobre; “bronze” é claro e tradicional neste contexto.
- source_word: Ἄσπις
  choice: Áspis
  rationale: Mantém o nome grego do monte e o vínculo verbal explícito com ἀσπίδα, embora esse jogo de palavras seja menos evidente em português.
- source_word: ἐκ δεξιῶν Ἀβιμά
  choice: à direita de Abim
  rationale: Reproduz a indicação espacial do grego sem especificar um ponto de vista que o texto não declara.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. Os topônimos foram transliterados com acentuação útil à leitura em português; preservou-se a relação espacial potencialmente ambígua de ἐκ δεξιῶν.
