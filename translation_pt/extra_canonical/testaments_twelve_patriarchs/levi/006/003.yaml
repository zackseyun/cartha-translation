base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/003.yaml
  text: After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous because of the abomination which they had committed against my sister.
translation:
  language: pt
  text: Depois disso, consultei meu pai e Rúben, para que ele dissesse aos filhos de Emor que não se circuncidassem, pois me enchi de zelo por causa da abominação que haviam cometido contra minha irmã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβούλευσα τῷ πατρί μου καὶ τῷ Ῥουβήμ
  choice: aconselhei-me com meu pai e com Rúben
  rationale: O verbo no contexto expressa consulta ou deliberação conjunta; a forma pronominal é natural em português e mantém ambos como participantes da consulta.
- source_word: τοῖς υἱοῖς Ἐμμώρ
  choice: aos filhos de Emor
  rationale: Reproduz literalmente a designação grega, sem substituí-la por uma identificação interpretativa como 'homens de Siquém'.
- source_word: τοῦ μὴ περιτμηθῆναι αὐτούς
  choice: que não se circuncidassem
  rationale: Expressa em português natural a construção grega de proibição ligada ao verbo 'dissesse', preservando a ação reflexiva/passiva de receber a circuncisão.
- source_word: ἐζήλωσα
  choice: estava indignado
  rationale: No contexto da violência cometida contra a irmã, o verbo denota ardor ou zelo inflamado; 'indignado' comunica naturalmente esse estado sem sugerir inveja ou ciúme.
- source_word: διὰ τὸ βδέλυγμα
  choice: por causa da abominação
  rationale: Mantém a relação causal e a forte avaliação moral de βδέλυγμα.
- source_word: ἐπὶ τῇ ἀδελφῇ μου
  choice: contra minha irmã
  rationale: Neste contexto, ἐπί indica que a irmã foi o alvo da ação ofensiva; 'contra' é idiomático e fiel.
theological_decisions:
- issue: Sentido de ἐζήλωσα
  choice: estava indignado
  alternative: fui zeloso / agi com zelo
  rationale: A tradução escolhida preserva a intensidade moral do termo no contexto e evita apresentar explicitamente a ação de Levi como zelo divinamente aprovado.
- issue: Referente singular de ἵνα εἴπῃ
  choice: para que ele dissesse
  alternative: para que dissessem
  rationale: O grego traz verbo singular e deixa o referente masculino singular potencialmente ambíguo entre o pai e Rúben; a tradução conserva o singular sem resolver a identidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Mantiveram-se o nome Emor, a estrutura narrativa e a ambiguidade do pronome singular; evitou-se linguagem denominacional ou explicação além do texto.
