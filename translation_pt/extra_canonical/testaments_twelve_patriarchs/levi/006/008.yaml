source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἀλλ᾿ ἐγὼ εἶδον ὅτι ἀπόφασις θεοῦ ἦν εἰς κακὰ³⁸ διότι ἤθελον ἐποίησεν *καὶ τὴν Σαρρὰ³⁹ ⌈καὶ τὴν Ῥεβέκκα⌉⁴⁰ ποιῆσαι ⌈ὃν τρόπον ἐποίησαν *τὴν Δείναν⁴¹ *τὴν ἀδελφὴν ἡμῶν⁴²⌉, καὶ ὁ⁴³ Κύριος ἐκώλυσεν αὐτούς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/008.yaml
  text: But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them.
translation:
  language: pt
  text: Mas eu vi que havia contra eles um decreto de Deus para que males lhes sobreviessem, porque pretendiam fazer com Sara e Rebeca o mesmo que haviam feito com Diná, nossa irmã; e o Senhor os impediu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόφασις θεοῦ
  choice: uma sentença de Deus
  rationale: Expressa uma decisão judicial ou determinação divina em português natural, sem tornar o sentido mais específico do que o grego permite.
- source_word: εἰς κακὰ
  choice: para o mal
  rationale: Preserva a formulação ampla e teologicamente tensa do original, em vez de suavizá-la como simples castigo ou desgraça.
- source_word: ἤθελον
  choice: pretendiam
  rationale: Neste contexto, comunica intenção deliberada de modo mais natural do que o literal 'queriam'.
- source_word: ὃν τρόπον
  choice: o mesmo que
  rationale: Equivalência idiomática clara para a comparação introduzida pelo grego.
- source_word: ἐκώλυσεν
  choice: impediu
  rationale: Traduz diretamente a ação de obstar ou impedir, sem acrescentar o modo pelo qual isso ocorreu.
theological_decisions:
- issue: A relação entre a sentença divina e o mal
  choice: havia contra eles uma sentença de Deus para o mal
  alternative: Deus havia decretado que lhes sobreviesse uma calamidade
  rationale: A opção escolhida conserva a linguagem difícil e ambígua de εἰς κακά e evita resolver antecipadamente se se trata de mal moral, dano, calamidade ou juízo.
- issue: Referente de αὐτούς em 'o Senhor os impediu'
  choice: os impediu
  alternative: impediu que fizessem isso
  rationale: Mantém o pronome masculino plural do grego, cujo referente mais natural são os homens que tinham essa intenção, sem explicitar além do texto.
translation_notes:
  register: 'Português moderno, digno e acessível, com sintaxe próxima do original sem rigidez excessiva. Os nomes próprios seguem as formas correntes em português brasileiro: Sara, Rebeca e Diná.'
