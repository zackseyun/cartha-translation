- source_word: τὸν Συχὲμ
  choice: Siquém
  rationale: Transliteração portuguesa tradicional do nome próprio bíblico Συχέμ.
- source_word: ἐν πρώτοις
  choice: fui o primeiro a
  rationale: A expressão indica prioridade na ação; esta formulação é natural em português e evita o possível sentido meramente temporal de “primeiro” isolado.
- source_word: Συμεὼν
  choice: Simeão
  rationale: Forma portuguesa tradicional do nome bíblico.
- source_word: τὸν Ἐμμώρ
  choice: Hamor
  rationale: Adota a forma portuguesa tradicional do nome hebraico, em vez de reproduzir diretamente a grafia grega Emmor.
