lexical_decisions:
- source_word: Ἔφθασε
  choice: veio sobre
  rationale: No contexto, o verbo indica que a ira os alcançou; “veio sobre” conserva a construção idiomática natural em português e corresponde ao sentido contextual.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: a ira de Deus
  rationale: Tradução direta e tradicional da expressão grega, preservando seu peso teológico sem paráfrase.
- source_word: εἰς τέλος
  choice: até o fim
  rationale: Mantém a formulação e a possível amplitude do grego, que pode indicar chegada ao limite, cumprimento pleno ou caráter definitivo, sem reduzir a expressão apenas a um advérbio como “plenamente”.
theological_decisions:
- issue: Alcance e caráter da ira divina em εἰς τέλος
  choice: até o fim
  alternative: plenamente / por completo
  rationale: A escolha preserva a ambiguidade entre plenitude e finalidade ou término, evitando decidir além do que a expressão grega exige.
translation_notes:
  register: Português moderno, claro e solene. A conjunção “Mas” reproduz δέ como contraste discursivo; a tradução evita linguagem excessivamente técnica.
