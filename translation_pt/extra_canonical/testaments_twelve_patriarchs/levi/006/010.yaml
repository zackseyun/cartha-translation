base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/010.yaml
  text: And indeed in this way they used to act toward all strangers, seizing the foreign women by force and driving them away.
translation:
  language: pt
  text: 'E, de fato, era assim que agiam com todos os estrangeiros: agarravam à força as mulheres estrangeiras e as expulsavam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: E, de fato
  rationale: Reproduz a força afirmativa e enfática da expressão grega sem tornar a frase artificial em português.
- source_word: ἐποίουν
  choice: era assim que agiam
  rationale: O imperfeito indica uma conduta habitual ou repetida, não apenas uma ação pontual.
- source_word: πᾶσι τοῖς ξένοις
  choice: com todos os estrangeiros
  rationale: Mantém o alcance universal de πᾶσι e o sentido pessoal de ξένοις.
- source_word: ἐν δυναστείᾳ ἁρπάζοντες
  choice: agarravam à força
  rationale: Expressa tanto o ato violento de ἁρπάζω quanto a ideia de força ou poder coercitivo em ἐν δυναστείᾳ.
- source_word: τὰς ξένας
  choice: as mulheres estrangeiras
  rationale: O artigo e o adjetivo feminino substantivado designam mulheres estrangeiras; evita a noção possessiva indevida de “suas mulheres”.
- source_word: ἐξενηλάτουν αὐτάς
  choice: as expulsavam
  rationale: Traduz o verbo de expulsar ou pôr para fora e conserva αὐτάς como referência explícita às mulheres.
