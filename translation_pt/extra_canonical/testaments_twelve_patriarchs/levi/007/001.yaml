source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπον¹ Γἐγὼ²⁾ τῷ πατρί μου³, Ἰακώβ⁴, ὅτι ἐν σοὶ ἐξουδενώσει⁵ Κύριος⁶ τοὺς Χαναναίους⁷ καὶ δώσει⁸ τὴν γῆν αὐτῶν σοι καὶ τῷ σπέρματί σου μετὰ σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/001.yaml
  text: And I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you.”
translation:
  language: pt
  text: 'E eu disse a meu pai Jacó: “Em você, o Senhor reduzirá os cananeus a nada e dará a terra deles a você e à sua descendência depois de você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουδενώσει
  choice: reduzirá ... a nada
  rationale: Reproduz de modo natural e vigoroso o sentido de desprezar, anular ou reduzir a nada, sem enfraquecer a afirmação.
- source_word: σπέρματί
  choice: descendência
  rationale: Neste contexto de promessa territorial, o coletivo português “descendência” comunica com clareza o sentido de linhagem posterior, sem sugerir necessariamente apenas um indivíduo.
- source_word: γῆν
  choice: terra
  rationale: Mantém o sentido concreto do território pertencente aos cananeus.
theological_decisions:
- issue: Sentido de ἐν σοί
  choice: Em você
  alternative: Por meio de você
  rationale: A formulação grega é genuinamente aberta quanto à força instrumental ou associativa. A tradução formal “Em você” preserva essa tensão em vez de explicá-la.
- issue: Referente singular ou coletivo de σπέρμα
  choice: descendência
  alternative: semente
  rationale: “Descendência” preserva o valor coletivo natural no contexto e evita impor uma leitura cristológica singular ou uma literalidade pouco idiomática.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “você” mantém explícitos os destinatários do grego e evita a mistura regional de formas de tratamento.
