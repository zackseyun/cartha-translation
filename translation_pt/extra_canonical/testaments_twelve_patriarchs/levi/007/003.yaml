source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὅτι καίγε¹⁶ ἀφροσύνην ἔπραξαν ἐν Ἰσραὴλ μιάναντες¹⁷ τὴν ἀδελφήν μου¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/003.yaml
  text: because they indeed committed folly in Israel, defiling my sister.
translation:
  language: pt
  text: porque de fato cometeram uma infâmia em Israel, desonrando minha irmã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίγε
  choice: de fato
  rationale: Reproduz a força enfática da partícula composta de modo natural em português.
- source_word: ἀφροσύνην ἔπραξαν
  choice: cometeram uma infâmia
  rationale: Neste contexto, ἀφροσύνη indica não mera falta de inteligência, mas um ato moralmente vergonhoso; «cometeram» preserva a construção idiomática com ἔπραξαν.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Mantém a formulação coletiva e tradicional do grego, referindo-se à comunidade de Israel.
- source_word: μιάναντες
  choice: desonrando
  rationale: O particípio expressa a ação associada ao ato infame; «desonrando» comunica a violação sexual e social sem impor ao português uma imagem ritual excessivamente estreita.
- source_word: τὴν ἀδελφήν μου
  choice: minha irmã
  rationale: Tradução direta e natural da relação familiar expressa no grego.
theological_decisions:
- issue: Sentido moral ou ritual de μιάναντες
  choice: desonrando
  alternative: profanando / contaminando
  rationale: O contexto é a violência contra a irmã de Levi. «Desonrando» preserva a gravidade moral e social, enquanto «profanando» poderia sugerir exclusivamente uma categoria cultual e «contaminando» soaria menos natural para uma pessoa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente. A oração participial foi mantida após vírgula para preservar sua relação aberta com a afirmação principal.
