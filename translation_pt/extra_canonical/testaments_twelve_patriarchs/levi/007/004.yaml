  text: '*Ἀπάραντες δὲ¹⁹ *ἤλθομεν εἰς²⁰ Δίναν Βεθήλ²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/004.yaml
  text: And departing, we came to Dinan Bethel.
translation:
  language: pt
  text: Partindo, chegamos a Dinan Betel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz literalmente a sequência difícil «a Dinan Betel». Talvez haja aqui uma corrupção textual ou uma referência abreviada a Diná e Betel; a relação exata entre os dois nomes é incerta.
    reason: A sintaxe de Δίναν Βεθήλ após εἰς é anômala, e resolvê-la no corpo do texto exigiria acrescentar elementos não presentes na fonte.
lexical_decisions:
- source_word: Ἀπάραντες
  choice: partindo
  rationale: 'O particípio de ἀπαίρω é usado aqui em sentido intransitivo: levantar acampamento, partir ou seguir viagem. “Partindo” comunica o movimento sem introduzir um objeto que o grego não expressa.'
- source_word: ἤλθομεν
  choice: chegamos
  rationale: Embora ἔρχομαι possa significar genericamente “ir/vir”, com destino introduzido por εἰς o português natural permite “chegamos a”.
- source_word: Δίναν Βεθήλ
  choice: Dinã Betel
  rationale: Mantém na ordem recebida os dois nomes em acusativo após εἰς, sem inserir uma conjunção ou relação sintática ausente no texto grego. “Dinã” translitera a forma textual Δίναν sem identificá-la silenciosamente com a pessoa Diná.
theological_decisions:
- issue: Relação entre Δίναν e Βεθήλ
  choice: Preservar a sequência ambígua “Dinã Betel”
  alternative: “a Diná, em Betel” ou “a Diná e a levamos a Betel”
  rationale: O texto grego fornecido não contém conjunção, segundo verbo nem preposição que autorizem essas soluções. Como a dificuldade é textual e não teológica, a tradução conserva a tensão e a explica em nota.
translation_notes:
  register: Português moderno, conciso e digno. A construção deliberadamente incomum “Dinã Betel” reflete uma dificuldade real do texto-fonte; a nota impede que essa estranheza pareça mero erro editorial.
