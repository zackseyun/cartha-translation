  text: For from this day the city called Sychem shall be a city of senseless people. For just as someone mocks a fool, so we mocked them,
translation:
  language: pt
  text: Pois, a partir de hoje, a cidade chamada Siquém será uma cidade de gente sem entendimento, porque, assim como alguém zombará de um insensato, nós zombamos deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Σύκημα λεγομένη πόλις
  choice: a cidade chamada Siquém
  rationale: Mantém o topônimo bíblico em sua forma portuguesa corrente e reproduz naturalmente a construção grega.
- source_word: ἀσυνέτων
  choice: gente sem entendimento
  rationale: Expressa a falta de discernimento ou entendimento indicada pelo adjetivo, sem reduzi-lo simplesmente a «tolos».
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: zomba / zombamos
  rationale: Preserva a repetição retórica do mesmo verbo grego e seu sentido de escarnecer ou ridicularizar.
- source_word: μωρόν
  choice: um insensato
  rationale: Distingue este termo de ἀσυνέτων, ao mesmo tempo que comunica em português atual a ideia de alguém sem juízo.
