source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε⁶¹ αὐτὸς⁶² ἀνοίξει τὰς θύρας⁶³ τοῦ παραδείσου, *καὶ ἀποστήσει⁶⁴ τὴν ἀπειλοῦσαν ῥομφαίαν⁶⁵ κατὰ τοῦ⁶⁶ Ἀδάμ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/010.yaml
  text: And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam.
translation:
  language: pt
  text: E, de fato, ele mesmo abrirá as portas do paraíso e afastará a espada ameaçadora voltada contra Adão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: E
  rationale: No contexto, introduz a continuação com ênfase; a construção com «ele mesmo» transmite naturalmente a força enfática em português sem sobrecarregar a frase.
- source_word: αὐτὸς
  choice: ele mesmo
  rationale: Preserva a ênfase explícita do pronome grego.
- source_word: ἀνοίξει τὰς θύρας τοῦ παραδείσου
  choice: abrirá as portas do paraíso
  rationale: Correspondência direta, clara e idiomática com a expressão grega.
- source_word: ἀποστήσει
  choice: afastará
  rationale: Expressa o sentido causativo de retirar ou fazer sair de sua posição, sem especificar além do grego como isso ocorrerá.
- source_word: τὴν ἀπειλοῦσαν ῥομφαίαν
  choice: a espada ameaçadora
  rationale: Mantém o particípio atributivo e a imagem de uma espada que ameaça; «espada» é a equivalência natural de ῥομφαία neste contexto.
- source_word: κατὰ τοῦ Ἀδάμ
  choice: voltada contra Adão
  rationale: Torna explícita em português a relação hostil indicada por κατά com genitivo, preservando que a espada está dirigida contra Adão.
theological_decisions:
- issue: Identidade do sujeito de «ele mesmo»
  choice: Manter apenas «ele mesmo», conforme o grego
  alternative: Nomear ou identificar o sujeito com base no contexto ou em uma interpretação messiânica
  rationale: O versículo recebido não nomeia o sujeito; explicitá-lo resolveria uma referência que deve permanecer dependente do contexto.
- issue: Relação da espada com Adão
  choice: «voltada contra Adão»
  alternative: «que ameaçava Adão» ou «posta contra Adão»
  rationale: A tradução preserva a construção relacional do grego sem transformar inequivocamente Adão em objeto direto de ἀπειλοῦσαν nem importar detalhes narrativos adicionais.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conserva a repetição coordenativa do grego e a ênfase em «ele mesmo», sem acréscimos interpretativos.
