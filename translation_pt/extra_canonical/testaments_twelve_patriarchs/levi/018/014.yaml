source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Τοτὲ ἀγαλλιάσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ, κἀγὼ χαρήσομαι⁷⁴, καὶ πάντες οἱ ἅγιοι ἐνδύσονται⁷⁵ δικαιοσύνην⁷⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/014.yaml
  text: Then Abraham and Isaac and Jacob will exult, and I will rejoice, and all the holy ones will put on righteousness.
translation:
  language: pt
  text: Então Abraão, Isaque e Jacó exultarão; eu também me alegrarei, e todos os santos se revestirão de justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: exultarão
  rationale: Conserva a ideia de alegria intensa e o registro elevado do verbo grego; a flexão no plural decorre do sujeito composto Abraão, Isaque e Jacó em português.
- source_word: κἀγὼ χαρήσομαι
  choice: eu também me alegrarei
  rationale: κἀγώ significa «e eu» ou «eu também»; «me alegrarei» distingue naturalmente χαίρω do exultar anterior sem perder seu sentido.
- source_word: οἱ ἅγιοι
  choice: os santos
  rationale: Equivalente substantivado tradicional e claro para «os que são santos», sem especificar além do texto quem integra o grupo.
- source_word: ἐνδύσονται δικαιοσύνην
  choice: se revestirão de justiça
  rationale: Preserva a metáfora explícita de vestir-se ou revestir-se e traduz δικαιοσύνη sem reduzir sua possível amplitude moral e forense.
theological_decisions:
- issue: Identidade de πάντες οἱ ἅγιοι
  choice: todos os santos
  alternative: todos os que são santos
  rationale: Mantém a referência coletiva aberta, sem identificar os santos como um grupo denominacional ou celestial específico.
- issue: Sentido de δικαιοσύνη
  choice: justiça
  alternative: retidão
  rationale: «Justiça» preserva melhor a amplitude semântica e teológica do grego, incluindo conduta reta e condição justa, sem resolver a tensão em favor de apenas uma nuance.
translation_notes:
  register: Português moderno, digno e acessível. O ponto e vírgula organiza as duas reações coordenadas antes da declaração final. Não há marcadores de nota, pois os sobrescritos da edição remetem ao aparato editorial e não foi fornecido conteúdo textual que exija nota de tradução.
