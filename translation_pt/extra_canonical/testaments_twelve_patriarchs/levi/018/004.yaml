  text: He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth.
translation:
  language: pt
  text: Ele resplandecerá como o sol sobre a terra, removerá toda a escuridão de debaixo do céu, e haverá paz em toda a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: resplandecerá
  rationale: Expressa o ato de brilhar intensamente e mantém o tom elevado da imagem solar.
- source_word: ἐξαρεῖ
  choice: removerá
  rationale: Verte de modo claro o sentido de tirar ou eliminar, sem acrescentar a ideia específica de destruição.
- source_word: ὑπ᾽ οὐρανὸν
  choice: de debaixo do céu
  rationale: Preserva a formulação espacial abrangente do grego, entendida como toda a região sob o céu.
- source_word: εἰρήνη
  choice: paz
  rationale: Equivalente direto e natural, preservando a amplitude do termo no contexto.
theological_decisions:
- issue: Referente de Οὗτος
  choice: Ele
  alternative: Este
  rationale: O pronome retoma uma figura masculina no contexto; “Ele” é natural em português e não acrescenta uma identificação teológica ausente do versículo.
- issue: Alcance de πᾶν σκότος
  choice: toda a escuridão
  alternative: todas as trevas
  rationale: Mantém aberta a dimensão literal ou simbólica da imagem, sem explicar teologicamente o que a escuridão representa.
