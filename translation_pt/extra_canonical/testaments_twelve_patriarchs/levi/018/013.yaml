  text: And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever.
translation:
  language: pt
  text: E o Senhor se alegrará por seus filhos e terá prazer em seus amados para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφρανθήσεται
  choice: se alegrará
  rationale: Expressa de modo natural o sentido futuro passivo/deponente de experimentar alegria.
- source_word: ἐπὶ τοῖς τέκνοις αὐτοῦ
  choice: com seus filhos
  rationale: Em português, «alegrar-se com» comunica naturalmente a alegria do Senhor a respeito de seus filhos.
- source_word: εὐδοκήσει
  choice: terá prazer
  rationale: Preserva o sentido de agradar-se ou deleitar-se, sem reduzi-lo apenas a aprovação.
- source_word: τοῖς ἀγαπητοῖς αὐτοῦ
  choice: em seus amados
  rationale: Mantém o substantivo afetivo e inclusivo do grego, sem acrescentar uma identificação não explicitada.
- source_word: ἕως αἰῶνος
  choice: para sempre
  rationale: Equivalente português corrente para a duração ilimitada indicada pela expressão.
theological_decisions:
- issue: Identidade dos «amados»
  choice: seus amados
  alternative: aqueles a quem ele ama
  rationale: A tradução conserva a forma substantivada e não determina além do texto se o grupo é idêntico aos «filhos» ou apenas paralelo a eles.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo próximo ao grego e boa legibilidade brasileira.
