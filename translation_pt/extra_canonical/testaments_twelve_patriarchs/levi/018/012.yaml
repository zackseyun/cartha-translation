id: T12P.LEV.18.12
reference: Testament of Levi 18:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ὁ Βελίαρ δεθήσεται ὑπ᾿ αὐτοῦ, καὶ δώσει ἐξουσίαν τοῖς τέκνοις αὐτοῦ⁶⁹ πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/012.yaml
  text: And Beliar will be bound by him, and he will give authority to his children to trample on the evil spirits.
translation:
  language: pt
  text: E Belial será amarrado por ele, e ele dará autoridade aos seus filhos para pisarem sobre os espíritos malignos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βελίαρ
  choice: Belial
  rationale: Emprega a forma portuguesa tradicional do nome, correspondente à variante grega Βελίαρ.
- source_word: δεθήσεται
  choice: será amarrado
  rationale: Reproduz de modo natural o passivo futuro e a imagem concreta de sujeição.
- source_word: ἐξουσίαν
  choice: autoridade
  rationale: Preserva o sentido de poder ou direito conferido para agir.
- source_word: τοῖς τέκνοις αὐτοῦ
  choice: aos seus filhos
  rationale: Mantém a relação filial expressa pelo grego sem especificar gênero além do uso coletivo normal em português.
- source_word: πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα
  choice: pisarem os espíritos malignos
  rationale: Conserva a metáfora de domínio de πατεῖν ἐπί e reflete o artigo definido de τὰ πονηρὰ πνεύματα.
theological_decisions:
- issue: Referente dos pronomes em ὑπ᾿ αὐτοῦ e τοῖς τέκνοις αὐτοῦ
  choice: manter “por ele” e “aos seus filhos”
  alternative: explicitar o referente pelo contexto mais amplo
  rationale: O versículo isolado usa pronomes masculinos e não nomeia aqui o referente; explicitá-lo resolveria uma dependência contextual que o grego preserva.
- issue: Força metafórica de pisar sobre os espíritos malignos
  choice: preservar a imagem literal “pisarem”
  alternative: traduzir interpretativamente como “dominarem” ou “vencerem”
  rationale: A imagem expressa autoridade e vitória, mas a tradução não deve reduzir a metáfora a uma única interpretação.
translation_notes:
  register: Português moderno, claro e digno, com construção próxima do grego. “Belial” segue a forma consagrada em português; “amarrado” é mais corrente que “atado” e mantém a imagem concreta. A repetição de “ele” preserva a estrutura e a ambiguidade referencial do original.
