id: T12P.LEV.18.7
reference: Testament of Levi 18:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *δόξα ὑψίστου ἐπ’ αὐτὸν ῥηθήσεται⁴², καὶ πνεῦμα συνέσεως καὶ ἁγιασμοῦ⁴³ καταπαύσει *ἐπ’ αὐτόν⁴⁴ [ἐν τῷ ὕδατι].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/007.yaml
  text: And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him [in the water].
translation:
  language: pt
  text: E a glória do Altíssimo será declarada sobre ele, e um espírito de entendimento e santificação repousará sobre ele [na água].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “na água” tem transmissão textual incerta.
    reason: Explica por que a expressão é mantida entre colchetes, refletindo a incerteza assinalada na edição grega.
lexical_decisions:
- source_word: δόξα ὑψίστου
  choice: a glória do Altíssimo
  rationale: Mantém a expressão genitiva e o título divino do grego em linguagem portuguesa natural e solene.
- source_word: ῥηθήσεται
  choice: será proclamada
  rationale: O verbo significa literalmente “será dita”; “será proclamada” comunica melhor, neste contexto, a declaração pública da glória sobre alguém sem identificar um agente não expresso.
- source_word: πνεῦμα συνέσεως
  choice: um espírito de entendimento
  rationale: Preserva πνεῦμα e traduz σύνεσις como capacidade de compreender ou discernir, sem restringir a referência ao Espírito Santo.
- source_word: ἁγιασμοῦ
  choice: santificação
  rationale: Reproduz o substantivo abstrato grego e evita substituí-lo por “santidade”, leitura semanticamente próxima, mas distinta.
- source_word: καταπαύσει ἐπ’ αὐτόν
  choice: repousará sobre ele
  rationale: Expressa a ideia de vir a descansar e permanecer sobre alguém, conservando a formulação teológica do original.
theological_decisions:
- issue: Identidade do “espírito”
  choice: um espírito de entendimento e santificação
  alternative: o Espírito de entendimento e santificação
  rationale: O grego não traz artigo diante de πνεῦμα. A tradução mantém essa indeterminação e não decide silenciosamente se a expressão designa formalmente o Espírito Santo.
- issue: Status textual de ἐν τῷ ὕδατι
  choice: manter “[na água]” entre colchetes e acrescentar nota
  alternative: incorporar “na água” sem marcação ou omitir a expressão
  rationale: Os colchetes da fonte assinalam incerteza textual; preservá-los mantém transparente a condição da expressão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem e o paralelismo do grego foram preservados onde soam naturais; evitou-se definir além do texto a identidade do espírito mencionado.
