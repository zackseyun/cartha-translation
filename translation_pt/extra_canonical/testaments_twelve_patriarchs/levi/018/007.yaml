- from: E a glória do Altíssimo será proclamada sobre ele, e um espírito de entendimento e santificação repousará sobre ele [na água].[a]
  to: E a glória do Altíssimo será declarada sobre ele, e um espírito de entendimento e santificação repousará sobre ele [na água].[a]
  rationale: Revisa-se somente o verbo que traduz ῥηθήσεται, evitando a intensificação interpretativa de «proclamada». Mantêm-se a sintaxe paralela, a indeterminação de «um espírito» e a expressão textual incerta entre colchetes.
