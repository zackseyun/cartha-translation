base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/005.yaml
  text: The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; [and the knowledge of the Lord will be poured out upon the earth like the water of the seas;] and the angels of the glory of the Lord's presence will be glad in him.
translation:
  language: pt
  text: Os céus exultarão nos dias dele, a terra se alegrará, e as nuvens se regozijarão. [E o conhecimento do Senhor será derramado sobre a terra como as águas dos mares;][a] e os anjos da glória da presença do Senhor se alegrarão nele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase entre colchetes tem transmissão textual incerta; os colchetes reproduzem a sinalização da edição grega. A palavra traduzida por “nuvens” também aparece marcada como leitura problemática no texto editado.
    reason: 'Informa ao leitor as duas incertezas textuais explícitas da fonte: o trecho bracketed e a crux em νεφέλαι.'
lexical_decisions:
- source_word: ἀγαλλιάσονται
  choice: exultarão
  rationale: Expressa a alegria intensa do verbo grego e preserva a variação em relação a χαρήσεται e εὐφρανθήσονται.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: nos dias dele
  rationale: Tradução direta e natural, sem identificar além do texto o referente masculino.
- source_word: νεφέλαι
  choice: nuvens
  rationale: Equivalente comum do substantivo grego, embora a crux textual exija nota.
- source_word: ἡ γνῶσις κυρίου
  choice: o conhecimento do Senhor
  rationale: Preserva o sentido cognitivo e relacional potencial de γνῶσις sem explicitá-lo indevidamente.
- source_word: ἐκχυθήσεται
  choice: será derramado
  rationale: Mantém a metáfora líquida e a voz passiva do original.
- source_word: ὕδωρ θαλασσῶν
  choice: as águas dos mares
  rationale: Reproduz o plural de θαλασσῶν em português idiomático; o singular coletivo grego ὕδωρ é naturalmente vertido como 'águas' neste contexto.
- source_word: οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου
  choice: os anjos da glória da presença do Senhor
  rationale: Mantém a cadeia genitiva e verte πρόσωπον por 'presença', valor semítico plausível e inteligível em português.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Preserva a referência masculina e a possível amplitude relacional de ἐν, sem resolver se significa esfera, causa ou associação.
theological_decisions:
- issue: Identidade do referente de αὐτοῦ e αὐτῷ
  choice: dele / nele
  alternative: do sacerdote escatológico / por causa dele
  rationale: O versículo não nomeia novamente o referente; a tradução conserva a anáfora e evita impor uma identificação ou relação causal.
- issue: Sentido de πρόσωπον κυρίου
  choice: presença do Senhor
  alternative: face do Senhor
  rationale: '''Presença'' comunica o provável valor idiomático da expressão, enquanto ''face'' seria formalmente possível, mas menos natural e potencialmente enganosa neste sintagma.'
- issue: Estatuto da frase entre colchetes
  choice: manter entre colchetes e explicar em nota
  alternative: incorporar sem marcação ou omitir
  rationale: Os colchetes da edição indicam incerteza textual; preservá-los torna visível a situação da fonte sem decidir silenciosamente sua originalidade.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. Empregaram-se 'exultar', 'alegrar-se' e 'regozijar-se' para refletir, tanto quanto naturalmente possível, os diferentes verbos gregos de alegria. O marcador [a] aparece no texto principal e corresponde à nota textual.
