id: T12P.LEV.18.8
reference: Testament of Levi 18:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Αὐτὸς γὰρ⁴⁵ δώσει τὴν μεγαλωσύνην⁴⁶ κυρίου⁴⁷ τοῖς υἱοῖς αὐτοῦ⁴⁸ ἐν ἀληθείᾳ εἰς τὸν αἰῶνα, καὶ οὐκ ἔσται διαδοχὴ⁴⁹ αὐτοῦ⁵⁰ εἰς γενεὰς *καὶ γενεὰς⁵¹ ἕως τοῦ αἰῶνος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/008.yaml
  text: For he will give the majesty of the Lord to his sons in truth forever, and there will be no succession to him for generations and generations, until eternity.
translation:
  language: pt
  text: Pois ele dará a majestade do Senhor aos seus filhos, em verdade, para sempre; e não haverá sucessão depois dele[a] por gerações e gerações, até a eternidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «sucessão dele». O grego usa uma construção pronominal concisa cujo sentido exato pode ser entendido como a sucessão pertencente a ele ou a sucessão que viria depois dele.'
    reason: Registra a ambiguidade de διαδοχὴ αὐτοῦ e explica a pequena explicitação necessária para um português natural.
lexical_decisions:
- source_word: μεγαλωσύνην
  choice: majestade
  rationale: Expressa grandeza e dignidade soberana, preservando o tom elevado do substantivo grego.
- source_word: ἐν ἀληθείᾳ
  choice: em verdade
  rationale: Mantém a formulação substantiva e a possível ligação com o ato de dar, sem reduzi-la apenas a «verdadeiramente».
- source_word: εἰς τὸν αἰῶνα
  choice: para sempre
  rationale: É a expressão portuguesa natural para a duração indefinida ou perpétua indicada pelo grego neste contexto.
- source_word: διαδοχή
  choice: sucessão
  rationale: Preserva o substantivo abstrato do grego, em vez de convertê-lo em «sucessor».
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: por gerações e gerações
  rationale: Reproduz a repetição enfática do original em português corrente.
- source_word: ἕως τοῦ αἰῶνος
  choice: até a eternidade
  rationale: Mantém a construção distinta da expressão anterior, inclusive sua tensão idiomática, sem simplesmente repeti-la como «para sempre».
theological_decisions:
- issue: Referentes dos pronomes αὐτός e αὐτοῦ
  choice: Manter «ele», «seus» e «dele» sem identificar explicitamente os referentes
  alternative: Nomear o sacerdote, o Senhor ou outra figura contextual
  rationale: O versículo isolado não explicita os referentes; nomeá-los resolveria uma ambiguidade genuína por interpretação.
- issue: Sentido de διαδοχὴ αὐτοῦ
  choice: «sucessão depois dele», com nota sobre a forma literal
  alternative: «não haverá sucessor para ele» ou «não haverá sucessão do seu ofício»
  rationale: A escolha conserva a ideia abstrata de sucessão e produz português inteligível, sem introduzir explicitamente um ofício nem substituir o substantivo por uma pessoa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência solene adequada a um texto testamentário. A repetição «gerações e gerações» e a expressão incomum «até a eternidade» foram mantidas para refletir de perto a forma e a tensão do grego.
