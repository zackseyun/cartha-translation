source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δώσει τοῖς ἁγίοις φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, καὶ *πνεῦμα ἁγιωσύνης ἔσται⁶⁷ ἐπ᾿ αὐτοῖς⁶⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/011.yaml
  text: And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them.
translation:
  language: pt
  text: E ele dará aos santos de comer da árvore da vida, e o espírito de santidade estará sobre eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἁγίοις
  choice: aos santos
  rationale: Reproduz de modo natural o substantivo adjetival grego e mantém aberta a identidade do grupo.
- source_word: φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: de comer da árvore da vida
  rationale: Conserva a construção com infinitivo e a imagem tradicional de ξύλον como árvore neste contexto.
- source_word: πνεῦμα ἁγιωσύνης
  choice: o espírito de santidade
  rationale: Mantém a formulação genitiva do grego sem identificar explicitamente a expressão com um título técnico.
- source_word: ἐπ᾿ αὐτοῖς
  choice: sobre eles
  rationale: Preserva a imagem espacial e a possível nuance de presença ou atuação.
theological_decisions:
- issue: Identidade de πνεῦμα ἁγιωσύνης
  choice: o espírito de santidade
  alternative: o Espírito Santo
  rationale: A tradução literal preserva a ambiguidade do sintagma e evita transformá-lo sem necessidade em um título teológico fixo.
- issue: Referente de τοῖς ἁγίοις
  choice: aos santos
  alternative: aos seus santos
  rationale: O grego não traz possessivo; por isso, ele não foi acrescentado.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com estrutura próxima do grego sem sacrificar a naturalidade.
