source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οἱ οὐρανοὶ³⁵ ἀνοιγήσονται³⁶, καὶ³⁷ ἐκ τοῦ ναοῦ τῆς δόξης³⁸ ἥξει³⁹ ἐπ᾽⁴⁰ αὐτὸν ἁγίασμα μετὰ φωνῆς πατρικῆς ὡς ἀπὸ *Ἀβραὰμ πρὸς Ἰσαάκ⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/006.yaml
  text: The heavens will be opened, and from the temple of glory holiness will come upon him with a fatherly voice, as from Abraham to Isaac.
translation:
  language: pt
  text: Os céus se abrirão, e do templo da glória virá sobre ele santidade, acompanhada de uma voz paterna, como a de Abraão dirigida a Isaque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοὶ ἀνοιγήσονται
  choice: Os céus se abrirão
  rationale: Preserva o plural de οὐρανοί e traduz naturalmente o futuro passivo ἀνοιγήσονται.
- source_word: ἐκ τοῦ ναοῦ τῆς δόξης
  choice: do templo da glória
  rationale: Mantém a construção genitiva do grego sem especificar se a glória caracteriza o templo ou pertence a Deus.
- source_word: ἁγίασμα
  choice: santidade
  rationale: Neste contexto, o substantivo indica uma realidade santa que vem sobre a pessoa; “santidade” é mais natural que “santificação” e evita transformar a expressão em um processo teológico explícito.
- source_word: μετὰ φωνῆς πατρικῆς
  choice: acompanhada de uma voz paterna
  rationale: Expressa a associação indicada por μετά e faz a relação sintática soar clara em português, sem identificar explicitamente quem profere a voz.
- source_word: ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ
  choice: como a de Abraão dirigida a Isaque
  rationale: Torna idiomática a comparação e preserva a direção da voz, de Abraão para Isaque.
theological_decisions:
- issue: Sentido de ἁγίασμα
  choice: santidade
  alternative: santificação; coisa santa; consagração
  rationale: “Santidade” preserva o caráter substantivo e sagrado do dom sem definir se se trata de um ato, processo ou objeto consagrado.
- issue: Identidade da voz paterna
  choice: não identificar o falante além da comparação com Abraão
  alternative: voz do Pai
  rationale: O grego diz φωνῆς πατρικῆς, “voz paterna”, e não nomeia explicitamente Deus como o Pai; a tradução conserva essa abertura.
- issue: Relação entre a santidade e a voz
  choice: a santidade vem acompanhada de uma voz
  alternative: tanto a santidade quanto a voz vêm sobre ele
  rationale: μετά favorece acompanhamento, mas a formulação evita elaborar uma sequência ou mecanismo não expresso no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para clareza, preservando as imagens e ambiguidades essenciais do grego.
