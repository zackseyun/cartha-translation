  revision_rationale: A revisão substitui «em toda a terra habitada» por «no mundo habitado», que reproduz οἰκουμένη sem acrescentar «toda» e com maior precisão semântica. Também acrescenta uma nota ancorada à expressão derivada de uma sequência marcada por crux na edição grega. O restante é preservado, inclusive a ambiguidade do referente e a elipse em «como a de um rei».
