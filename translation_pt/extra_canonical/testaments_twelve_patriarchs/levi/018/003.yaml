source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνατελεῖ¹³ ἄστρον αὐτοῦ¹⁴ ἐν οὐρανῷ ὡς βασιλέως¹⁵ φωτίζων¹⁶ φῶς γνώσεως †ἐν ἡλίῳ ἡμέρα†¹⁷, καὶ μεγαλυνθήσεται ἐν τῇ οἰκουμένῃ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/003.yaml
  text: And his star will rise in heaven like a king, giving the light of knowledge like the sun by day, and he will be magnified in the inhabited world.
translation:
  language: pt
  text: E a sua estrela surgirá no céu como a de um rei, irradiando a luz do conhecimento como o sol durante o dia¹, e ele será engrandecido no mundo habitado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: surgirá
  rationale: Expressa naturalmente o despontar ou nascer de um astro, preservando o valor futuro do verbo grego.
- source_word: ἄστρον αὐτοῦ
  choice: a sua estrela
  rationale: Mantém a referência possessiva do grego sem explicitar uma identidade não declarada no versículo.
- source_word: ὡς βασιλέως
  choice: como a de um rei
  rationale: O genitivo ‘de um rei’ provavelmente qualifica ‘estrela’; a elipse portuguesa evita a leitura gramaticalmente estranha de que a estrela surge ‘como um rei’.
- source_word: φωτίζων φῶς γνώσεως
  choice: irradiando a luz do conhecimento
  rationale: Reproduz a imagem luminosa e evita a redundância pouco natural de uma tradução mecanicamente literal como ‘iluminando luz’.
- source_word: ἐν ἡλίῳ ἡμέρα
  choice: como o sol durante o dia
  rationale: Segue a compreensão contextual refletida na camada inglesa para uma expressão grega textualmente corrompida, oferecendo sentido claro sem ampliar a afirmação.
- source_word: μεγαλυνθήσεται
  choice: será engrandecido
  rationale: Preserva a voz passiva e a ideia de exaltação ou reconhecimento, sem especificar o agente.
- source_word: ἐν τῇ οἰκουμένῃ
  choice: em toda a terra habitada
  rationale: Mantém o sentido antigo de οἰκουμένη como o mundo habitado, em formulação portuguesa inteligível.
theological_decisions:
- issue: Identidade do referente masculino
  choice: Manter os pronomes possessivo e pessoal sem identificar explicitamente o personagem
  alternative: Nomeá-lo como Messias, sacerdote ou rei
  rationale: O versículo isolado não nomeia o referente; explicitá-lo resolveria uma questão interpretativa além do texto fornecido.
- issue: Relação entre a estrela e o rei
  choice: Entender ‘como a de um rei’ como qualificação da estrela
  alternative: Traduzir ‘a estrela surgirá como um rei’
  rationale: A forma genitiva βασιλέως favorece ‘de um rei’, embora a construção seja compacta; a tradução conserva essa relação sem desenvolver sua possível simbologia.
- issue: Agente do engrandecimento
  choice: Conservar a passiva ‘será engrandecido’
  alternative: Explicitar que Deus ou os povos o engrandecerão
  rationale: O grego não declara o agente, e a tradução não deve suprir uma conclusão teológica.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação busca equivalência ótima: conserva imagens e passivas relevantes, mas evita redundância artificial. A sequência marcada por crux na edição (†ἐν ἡλίῳ ἡμέρα†) foi vertida pelo sentido contextual provável, em consonância com a versão inglesa auditada.'
