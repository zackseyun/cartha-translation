source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐπὶ *τῆς ἱερωσύνης⁵² αὐτοῦ⁵³ *τὰ ἔθνη⁵⁴ πληθυνθήσονται⁵⁵ ἐν γνώσει ἐπὶ τῆς γῆς, καὶ φωτισθήσονται διὰ χάριτος κυρίου. [ὁ δὲ Ἰσραὴλ ἐλαττωθήσεται ἐν ἀγνωσίᾳ καὶ σκοτισθήσεται ἐν πένθει]⁵⁶. ἐπὶ τῆς ἱερωσύνης αὐτοῦ ἐκλείψει⁵⁷ ἡ⁵⁸ ἁμαρτία καὶ οἱ ἄνομοι *καταπαύσουσιν εἰς κακά⁵⁹, [οἱ δὲ δίκαιοι καταπαύσουσιν ἐν αὐτῷ]⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/009.yaml
  text: And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. [But Israel will be diminished in ignorance and darkened in mourning.] During his priesthood sin will cease, and the lawless will cease from evil; [and the righteous will rest in him].
translation:
  language: pt
  text: E durante o seu sacerdócio, as nações se multiplicarão em conhecimento sobre a terra e serão iluminadas pela graça do Senhor. [Mas Israel será reduzido na ignorância e envolto em trevas no luto.][a] Durante o seu sacerdócio, o pecado cessará, e os que vivem sem lei deixarão de praticar o mal; [e os justos descansarão nele][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase entre colchetes — “Mas Israel será reduzido na ignorância e envolto em trevas no luto” — tem transmissão textual incerta e não aparece de modo uniforme nos testemunhos gregos.
    reason: Sinalizar a condição textual da cláusula assinalada entre colchetes na edição-fonte.
  - marker: b
    text: A frase entre colchetes — “e os justos descansarão nele” — tem transmissão textual incerta e não aparece de modo uniforme nos testemunhos gregos.
    reason: Sinalizar a condição textual da cláusula assinalada entre colchetes na edição-fonte.
lexical_decisions:
- source_word: ἐπὶ τῆς ἱερωσύνης αὐτοῦ
  choice: durante o seu sacerdócio
  rationale: A expressão temporal indica o período em que ele exerce o sacerdócio; esta formulação é natural em português e conserva a referência pronominal do grego.
- source_word: τὰ ἔθνη πληθυνθήσονται ἐν γνώσει
  choice: as nações se multiplicarão em conhecimento
  rationale: Mantém a imagem incomum do original, em vez de a resolver como simples crescimento do conhecimento, preservando sua possível ambiguidade.
- source_word: φωτισθήσονται διὰ χάριτος κυρίου
  choice: serão iluminadas pela graça do Senhor
  rationale: Reproduz a voz passiva, a metáfora da iluminação e a mediação expressa por διά.
- source_word: ἐλαττωθήσεται ἐν ἀγνωσίᾳ
  choice: será reduzido na ignorância
  rationale: Preserva o contraste formal entre πληθυνθήσονται e ἐλαττωθήσεται, bem como a formulação difícil do texto grego.
- source_word: σκοτισθήσεται ἐν πένθει
  choice: envolto em trevas no seu luto
  rationale: Expressa com naturalidade a passiva de σκοτίζω e mantém a associação entre trevas e luto sem definir além do texto a relação entre ambos.
- source_word: ἐκλείψει ἡ ἁμαρτία
  choice: o pecado cessará
  rationale: ἐκλείπω pode indicar desaparecimento ou cessação; “cessará” é claro e adequado neste contexto.
- source_word: οἱ ἄνομοι καταπαύσουσιν εἰς κακά
  choice: os que vivem sem lei deixarão de praticar o mal
  rationale: ἄνομοι é vertido de modo compreensível sem pressupor apenas infração civil; a construção difícil εἰς κακά é entendida contextualmente como cessação do mal.
- source_word: οἱ δίκαιοι καταπαύσουσιν ἐν αὐτῷ
  choice: os justos descansarão nele
  rationale: Conserva a imagem de repouso e a referência masculina singular de ἐν αὐτῷ, sem explicitar sua identidade.
theological_decisions:
- issue: Referente de “seu” e “nele”
  choice: Manter os pronomes sem identificar explicitamente a personagem
  alternative: Substituí-los por um título messiânico ou pelo nome de uma figura específica
  rationale: O versículo depende do contexto anterior, e o grego não fornece aqui um título explícito; a tradução não deve resolver a referência por interpretação doutrinária.
- issue: Alcance da iluminação das nações
  choice: Traduzir literalmente como iluminação pela graça do Senhor
  alternative: Explicitar conversão, salvação ou revelação de uma doutrina específica
  rationale: A metáfora permite mais de uma nuance teológica, e o texto não exige uma formulação confessional mais estreita.
- issue: Cessação do pecado
  choice: Preservar a afirmação absoluta “o pecado cessará”
  alternative: Atenuar para “o pecado diminuirá” ou restringi-la a um grupo
  rationale: ἐκλείψει expressa cessação ou desaparecimento; qualquer limitação seria acrescentada ao texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Foram preservadas as construções semanticamente marcadas do grego quando sua simplificação eliminaria ambiguidade ou contraste literário. Os colchetes foram mantidos no texto para refletir os sinais críticos da edição-fonte e acompanhados de notas textuais.
