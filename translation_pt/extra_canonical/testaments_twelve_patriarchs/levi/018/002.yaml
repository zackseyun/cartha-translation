source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ³ τότε ἐγερεῖ⁴ κύριος ἱερέα καινόν⁵, ᾧ⁶ πάντες οἱ λόγοι κυρίου⁷ ἀποκαλυφθήσονται⁸, καὶ αὐτὸς ποιήσει κρίσιν⁹ ἀληθείας¹⁰ ἐπὶ τῆς γῆς¹¹ *ἐν πλήθει¹² ἡμερῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/002.yaml
  text: Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute true judgment upon the earth for many days.
translation:
  language: pt
  text: Então o Senhor levantará um novo sacerdote, a quem serão reveladas todas as palavras do Senhor; e ele exercerá juízo verdadeiro sobre a terra por muitos dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερεῖ
  choice: levantará
  rationale: Preserva a imagem bíblica de suscitar ou fazer surgir alguém para uma função, com formulação natural em português.
- source_word: ἱερέα καινόν
  choice: um novo sacerdote
  rationale: Tradução direta, mantendo a novidade qualitativa ou temporal sem explicá-la além do grego.
- source_word: πάντες οἱ λόγοι κυρίου
  choice: todas as palavras do Senhor
  rationale: Mantém o plural λόγοι e a referência explícita ao Senhor.
- source_word: ποιήσει κρίσιν ἀληθείας
  choice: exercerá juízo verdadeiro
  rationale: Expressa naturalmente o valor atributivo do genitivo ἀληθείας, sem o português pouco idiomático 'juízo de verdade'.
- source_word: ἐν πλήθει ἡμερῶν
  choice: por muitos dias
  rationale: Reproduz o sentido temporal da expressão, literalmente associada a uma multiplicidade de dias.
theological_decisions:
- issue: Identidade do novo sacerdote
  choice: Não identificar nem caracterizar o sacerdote além do texto
  alternative: Explicitar uma identificação messiânica ou histórica
  rationale: O versículo anuncia um novo sacerdote, mas não fornece aqui uma identificação explícita; a tradução preserva essa abertura.
- issue: Natureza de κρίσιν ἀληθείας
  choice: juízo verdadeiro
  alternative: juízo de verdade / juízo justo
  rationale: '''Verdadeiro'' mantém a relação lexical com ἀλήθεια sem substituir diretamente a ideia por ''justo'', embora justiça possa estar implicada no contexto.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a repetição de 'Senhor' e a estrutura profética no futuro.
