source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹ μετὰ τὸ γενέσθαι τὴν ἐκδίκησιν αὐτῶν παρὰ κυρίου, *ἐκλείψει ἡ ἱερωσύνη².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/001.yaml
  text: And after their vengeance has come from the Lord, the priesthood will fail.
translation:
  language: pt
  text: E, depois que a vingança deles vier da parte do Senhor, o sacerdócio chegará ao fim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκδίκησιν αὐτῶν
  choice: a vingança contra eles
  rationale: 'O genitivo αὐτῶν pode, isoladamente, indicar vingança exercida por eles ou dirigida contra eles. A construção com παρὰ κυρίου e o contexto de juízo favorecem o sentido objetivo: a retribuição do Senhor contra eles.'
- source_word: παρὰ κυρίου
  choice: do Senhor
  rationale: Expressa a origem da vingança, preservando a referência divina de forma natural e digna em português.
- source_word: ἐκλείψει
  choice: chegará ao fim
  rationale: Traduz claramente a ideia de cessar ou deixar de existir, evitando o possível sentido moderno de mera falha funcional em 'falhará'.
- source_word: ἡ ἱερωσύνη
  choice: o sacerdócio
  rationale: Equivalente corrente para a instituição ou condição sacerdotal designada pelo substantivo grego.
theological_decisions:
- issue: Agente e alvo da vingança
  choice: A vingança vem do Senhor e é dirigida contra 'eles'.
  alternative: A vingança pertencente a eles vem do Senhor.
  rationale: Embora αὐτῶν seja formalmente ambíguo, παρὰ κυρίου identifica o Senhor como fonte, e a leitura objetiva produz a relação mais coerente entre retribuição divina e o grupo anteriormente mencionado.
- issue: Cessação do sacerdócio
  choice: O sacerdócio 'chegará ao fim'.
  alternative: O sacerdócio 'falhará' ou 'se extinguirá'.
  rationale: A formulação comunica a cessação indicada por ἐκλείψει sem especificar além do texto se ela é temporária, definitiva ou referente a uma forma particular de sacerdócio.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A coordenação inicial foi preservada, e a frase mantém tom profético e solene sem arcaísmo.
