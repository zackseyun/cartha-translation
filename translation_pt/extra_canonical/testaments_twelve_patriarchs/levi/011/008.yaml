base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/008.yaml
  text: And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: pt
  text: E Joquebede nasceu no Egito, no sexagésimo quarto ano da minha vida, pois naquela época ela era ilustre entre os meus irmãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωχαβέδ
  choice: Joquebede
  rationale: Forma portuguesa tradicional e reconhecível do nome bíblico Jochebed.
- source_word: ἐγεννήθη
  choice: nasceu
  rationale: Equivalente natural e direto do aoristo passivo com sentido de nascimento.
- source_word: τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει
  choice: no sexagésimo quarto ano da minha vida
  rationale: Reproduz com clareza a contagem da idade do narrador sem alterar a referência temporal.
- source_word: ἔνδοξος
  choice: ilustre
  rationale: Preserva o sentido de alguém notável, honrado ou de elevada reputação, bem como o predicativo feminino referente a Joquebede.
- source_word: ἐν μέσῳ τῶν ἀδελφῶν μου
  choice: entre os meus irmãos
  rationale: Tradução idiomática e semanticamente próxima da expressão grega.
theological_decisions:
- issue: Relação causal introduzida por γάρ
  choice: pois
  alternative: porque
  rationale: Mantém explicitamente a relação explicativa ou causal do texto grego, embora ela pareça incomum no contexto, sem tentar harmonizá-la.
- issue: Referente feminino de ἔνδοξος
  choice: ela era ilustre
  alternative: eu era ilustre
  rationale: A forma feminina ἔνδοξος retoma naturalmente Joquebede; não se adotou a leitura da camada inglesa, que muda o referente para o narrador.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego. A formulação incomum da última oração foi preservada em vez de ser explicada ou corrigida conjecturalmente.
