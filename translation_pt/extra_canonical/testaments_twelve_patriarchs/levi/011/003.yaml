lexical_decisions:
- source_word: περὶ αὐτόν
  choice: a respeito dele
  rationale: Mantém o sentido relacional de περί com acusativo sem acrescentar uma interpretação não expressa no grego.
- source_word: πρώτῃ τάξει
  choice: primeira ordem
  rationale: “Ordem” preserva a possível referência a uma ordem ou categoria hierárquica; “posição” ou “fileira” resolveriam indevidamente a ambiguidade.
theological_decisions:
- issue: Natureza da “primeira ordem”
  choice: Manter a expressão aberta como “primeira ordem”
  alternative: “primeira posição” ou “primeira fileira”
  rationale: O contexto imediato fornecido não determina se τάξις designa ordem hierárquica, categoria, posição ou disposição; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. O pretérito imperfeito “estava” expressa naturalmente οὐκ ἔστιν no discurso indireto dependente do verbo passado “vi”.
