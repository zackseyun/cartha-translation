source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ εἶδον ἐν ὁράματι· μέσος ἐν ὑψηλοῖς ἵστατο πάσης τῆς συναγωγῆς²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/005.yaml
  text: And I saw in the vision that he stood in the midst of the congregation, in the heights.
translation:
  language: pt
  text: E vi, numa visão, que ele estava em pé no meio de toda a congregação, nas alturas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁράματι
  choice: numa visão
  rationale: Expressa de modo natural o caráter visionário da experiência sem acrescentar conteúdo.
- source_word: μέσος ... πάσης τῆς συναγωγῆς
  choice: no meio de toda a congregação
  rationale: Preserva o valor de μέσος com o genitivo e traduz πάσης, explicitamente presente no grego.
- source_word: ἐν ὑψηλοῖς
  choice: nas alturas
  rationale: Mantém a expressão espacial elevada e sua possível conotação celestial sem especificá-la além do texto.
- source_word: ἵστατο
  choice: estava em pé
  rationale: Representa o sentido estativo do imperfeito de ἵστημι, em vez do simples e menos preciso “estava”.
theological_decisions:
- issue: Relação sintática de “nas alturas” com o restante da frase
  choice: Mantê-la como expressão final, separada por vírgula
  alternative: “no meio de toda a congregação que estava nas alturas”
  rationale: A ordem grega é incomum e não determina inequivocamente se a expressão modifica apenas a posição dele ou o cenário da congregação. A formulação escolhida preserva essa abertura sem introduzir uma oração relativa ausente.
translation_notes:
  register: Português moderno, digno e de leitura corrente. “Congregação” conserva o sentido coletivo e potencialmente religioso de συναγωγή; “nas alturas” mantém a imagem do original.
