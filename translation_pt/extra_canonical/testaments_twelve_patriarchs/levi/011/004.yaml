  text: And Kohath was born in the thirty-fifth year of my life, toward the sunrise.
translation:
  language: pt
  text: E Coate nasceu no trigésimo quinto ano da minha vida, em direção ao nascer do sol.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Καὰθ
  choice: Coate
  rationale: Forma portuguesa tradicional e reconhecível do nome bíblico grego Καάθ, correspondente a Kohath.
- source_word: ἐγεννήθη
  choice: nasceu
  rationale: Equivalente natural e direto do aoristo passivo, cujo sentido idiomático aqui é nascimento.
- source_word: ἐν τῷ τριακοστῷ πέμπτῳ ἔτει τῆς ζωῆς μου
  choice: no trigésimo quinto ano da minha vida
  rationale: Reproduz com clareza a indicação cronológica e mantém a perspectiva em primeira pessoa.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: em direção ao nascer do sol
  rationale: Conserva a imagem concreta do grego e sua possível função direcional, sem reduzi-la silenciosamente a apenas 'leste'.
theological_decisions:
- issue: Relação sintática de πρὸς ἀνατολὰς ἡλίου com o nascimento
  choice: 'Mantida como expressão final ligada ao nascimento: «em direção ao nascer do sol»'
  alternative: «ao leste» ou associação com uma visão mencionada em outra forma textual
  rationale: O texto grego fornecido não contém referência a visão; por isso, a expressão direcional foi preservada onde aparece, sem importar material de outra tradição textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção preserva a concisão do grego e sua imagem solar concreta.
