  text: '*Διὰ τοῦτο ἐκάλεσα τὸ ὄνομα αὐτοῦ Καάθ²¹, [ὅ ἐστιν ἀρχὴ μεγαλείου καὶ συμβιβασμός]²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/006.yaml
  text: Therefore I called his name Kohath, [which is, the beginning of majesty and uniting].
translation:
  language: pt
  text: Por isso, dei-lhe o nome de Coate, [que significa princípio da majestade e união].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A explicação do nome aparece entre colchetes na fonte grega, indicando que sua presença no texto é incerta.
    reason: Preservar de modo transparente a incerteza textual assinalada pela edição-fonte.
lexical_decisions:
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ
  choice: dei-lhe o nome
  rationale: Expressão natural em português para o ato de nomear, preservando o sentido do grego.
- source_word: Καάθ
  choice: Coate
  rationale: Forma portuguesa tradicional e reconhecível do nome bíblico Kohath.
- source_word: ἀρχὴ μεγαλείου
  choice: princípio da majestade
  rationale: Tradução formal que mantém a relação genitiva e a possível ideia tanto de começo quanto de origem.
- source_word: συμβιβασμός
  choice: união
  rationale: Neste contexto etimológico, comunica a ideia de junção ou união sem acrescentar o elemento 'de todos', ausente do texto grego fornecido.
theological_decisions:
- issue: Sentido etimológico atribuído ao nome Coate
  choice: Preservar literalmente a explicação do autor entre colchetes
  alternative: Reformular como etimologia historicamente verificável ou como 'reconciliação'
  rationale: O texto apresenta uma interpretação do nome; a tradução não deve validar nem corrigir essa etimologia, nem estreitar συμβιβασμός a uma leitura teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção 'dei-lhe o nome' evita o literalismo pouco natural de 'chamei o nome dele'. O acréscimo interpretativo 'de todos', presente em uma revisão inglesa, não foi adotado porque não consta no texto grego fornecido.
