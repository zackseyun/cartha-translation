review_pass:
  verdict: revise
  source_fidelity: 'Os vv. 1–3 são, em geral, fiéis: «reduzirá ... a nada» transmite bem ἐξουδενώσει; «descendência» é uma solução natural para σπέρμα; e os ecos «insensatos/insensato» e «zomba/zombamos» preservam os paralelos gregos. Em 7.2, porém, «será conhecida como» acrescenta a noção de notoriedade, enquanto λεγομένη significa simplesmente «chamada». Em 7.4, «levando Diná conosco» resolve de modo excessivamente seguro uma sequência grega manifestamente difícil (εἰς Δίναν Βεθήλ). O particípio ἀπάραντες, por si, significa «partindo»; a referência a tomar Diná é uma possível reconstrução, não o sentido inequívoco do texto transmitido.'
  naturalness: O português é claro, atual e de registro apropriado. «A cidade chamada Siquém será uma cidade de insensatos» é mais direto e natural do que «será conhecida como cidade de insensatos», além de mais próximo do grego. «Então partimos e fomos para Betel» evita uma construção interpretativa e mantém uma narrativa fluente.
  terminology: «Senhor», «cananeus», «descendência», «insensatez», «contaminando» e os topônimos «Siquém» e «Betel» são adequados. A nota de Siquém é útil, embora se deva grafar o nome grego de forma simples e consistente. A nota final deve identificar a dificuldade textual sem apresentar a leitura conjectural como tradução principal.
  issues:
  - severity: low
    issue: «será conhecida como» em 7.2
    rationale: λεγομένη é «chamada/denominada». «Será conhecida como» sugere uma reputação pública que não está explicitada no grego.
  - severity: high
    issue: «Depois, levando Diná conosco» em 7.4
    rationale: A tradução atribui a ἀπάραντες o objeto Diná e o sentido «levar», embora o particípio normalmente signifique «partir». A sequência transmitida com Δίναν antes de Βεθήλ é obscura ou corrompida; a hipótese de retirar Diná deve permanecer em nota, não na linha principal.
  revised_text: '**Testamento de Levi 7**


    Eu disse a meu pai, Jacó: “Em você, o Senhor reduzirá os cananeus a nada e dará a terra deles a você e à sua descendência depois de você. Pois, a partir de hoje, a cidade chamada Siquém[a] será uma cidade de insensatos, porque, assim como alguém zomba de um insensato, nós zombamos deles. De fato, eles cometeram uma insensatez em Israel, contaminando minha irmã. Então partimos[b] e fomos para Betel.”'
  revised_footnotes:
  - marker: a
    text: O grego traz Sýkēma, forma do nome do lugar conhecido em português como Siquém.
    reason: lexical_alternative
  - marker: b
    text: O grego traz uma sequência difícil que inclui «Diná» antes de «Betel». Ela pode refletir uma leitura como «depois de levar Diná embora», mas o particípio traduzido «partimos» normalmente significa «partindo», e o texto é incerto.
    reason: textual_ambiguity
  revision_rationale: A revisão substitui uma leve amplificação em 7.2 por uma formulação literal e idiomática. Em 7.4, traduz o sentido seguro de ἀπάραντες («partindo») e transfere para a nota a possível, mas incerta, reconstrução que envolve Diná. Assim, a tradução não oculta a dificuldade do texto nem impõe uma solução conjectural.
