  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007.yaml
  text: And I said to my father Jacob[a], “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you. For from this day the city called Sychem shall be a city of fools. For just as one mocks a fool, so we mocked them, because they indeed committed folly in Israel by defiling my sister. Then, after taking her up[b], we came to Bethel.”
translation:
  language: pt
  text: '**Testamento de Levi 7**


    Eu disse a meu pai, Jacó: “Em você, o Senhor reduzirá os cananeus a nada e dará a terra deles a você e à sua descendência depois de você. Pois, a partir de hoje, a cidade chamada Siquém[a] será conhecida como cidade de insensatos, porque, assim como alguém zomba de um insensato, nós zombamos deles. De fato, eles cometeram uma insensatez em Israel, contaminando minha irmã. Depois, levando Diná conosco[b], fomos para Betel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz Sýkēma, forma do nome do lugar conhecido em português como Siquém.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “depois de a levarmos dali”. O particípio grego pode indicar que Diná foi retirada do lugar antes da ida a Betel; a redação desta frase apresenta dificuldade textual.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐν σοὶ ἐξουδενώσει
  choice: Em você ... reduzirá ... a nada
  rationale: Mantém a construção incomum ἐν σοὶ, sem explicá-la como instrumento, causa ou mérito, e expressa a força de ἐξουδενώσει no contexto da derrota dos cananeus.
- source_word: σπέρματί σου
  choice: sua descendência
  rationale: Em português atual, “descendência” comunica naturalmente o sentido coletivo e pactual de σπέρμα sem a possível estranheza ou ambiguidade biológica de “semente”.
- source_word: Σύκημα
  choice: Siquém
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o topônimo, registrando em nota que o grego apresenta a forma Sýkēma.
- source_word: πόλις ἀσυνέτων
  choice: cidade de insensatos
  rationale: Preserva a caracterização moral e estabelece a repetição com “insensato” na comparação seguinte.
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: zomba / zombamos
  rationale: Conserva o eco lexical e a estrutura retórica entre a máxima comparativa e a ação narrada.
- source_word: ἀφροσύνην
  choice: insensatez
  rationale: Mantém a ligação vocabular e temática com ἀσυνέτων, além do tom de censura moral.
- source_word: μιάναντες
  choice: contaminando
  rationale: Expressa a dimensão moral e religiosa de μιάναντες sem acrescentar uma descrição sexual mais explícita que o grego.
- source_word: Ἀπάραντες
  choice: levando Diná conosco
  rationale: Adota o sentido contextual de retirar ou levar Diná antes da viagem a Betel, ao mesmo tempo que a nota registra a dificuldade textual e lexical.
- source_word: Βεθήλ
  choice: Betel
  rationale: Usa a forma portuguesa consagrada do topônimo bíblico.
theological_decisions:
- issue: Linguagem da promessa da terra e da descendência
  choice: Manter como declaração explícita de que o Senhor dará a terra a Jacó e à sua descendência
  alternative: Reformular como previsão geral de vitória ou usar linguagem menos ligada às promessas patriarcais
  rationale: O texto grego apresenta conjuntamente a ação do Senhor, a dádiva da terra e a descendência de Jacó; essa textura pactual deve permanecer sem harmonização adicional.
- issue: Sentido de ἐν σοὶ na derrota dos cananeus
  choice: “Em você”
  alternative: “Por meio de você”, “por sua causa” ou “diante de você”
  rationale: A preposição admite mais de uma relação possível. A formulação próxima do grego conserva a ambiguidade em vez de definir o papel de Jacó.
- issue: Caracterização moral do ato contra Diná
  choice: “cometeram uma insensatez em Israel, contaminando minha irmã”
  alternative: Empregar termos sociais como “desonra” ou explicitar violência sexual
  rationale: A tradução conserva a avaliação moral-religiosa de ἀφροσύνην e μιάναντες, mas não acrescenta detalhes que esta redação grega não declara expressamente.
translation_notes:
  register: Português atual, digno e acessível, com nomes bíblicos nas formas portuguesas consagradas. A repetição “insensatos/insensato” e “zomba/zombamos” reproduz deliberadamente os paralelos do grego. A sintaxe incomum “Em você” foi preservada por sua ambiguidade genuína.
