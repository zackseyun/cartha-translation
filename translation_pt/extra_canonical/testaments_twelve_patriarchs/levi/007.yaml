review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a estrutura e os termos principais do grego: a ambiguidade de «em você» (ἐν σοί), a redução dos cananeus «a nada», a dádiva da terra à descendência, o paralelismo «zomba/zombamos» e a caracterização moral-religiosa do ato contra Diná. «Contaminando» é uma opção aceitável para μιαίνοντες, embora «manchando» ou «profanando» pudesse soar menos material em português.'
  naturalness: O português é claro, atual e de registro apropriado. A repetição deliberada de «insensatos/insensato» e «zomba/zombamos» funciona bem. Contudo, «será conhecida como cidade de insensatos» introduz a noção de notoriedade pública («conhecida como») que não está expressa em ἔσται ... πόλις ἀσυνέτων («será uma cidade de insensatos»).
  terminology: Jacó, Siquém, Diná e Betel são formas portuguesas estabelecidas. «Descendência» comunica naturalmente σπέρμα em português contemporâneo, sem perder o contexto de promessa. «Insensatez» mantém adequadamente o campo semântico de ἀφροσύνη.
  issues:
  - severity: low
    issue: A expressão «será conhecida como cidade de insensatos» acrescenta «conhecida como».
    rationale: O grego diz literalmente que a cidade «será uma cidade de insensatos»; não afirma que ela receberá essa designação ou reputação. A correção remove esse pequeno acréscimo interpretativo.
  revised_text: '**Testamento de Levi 7**


