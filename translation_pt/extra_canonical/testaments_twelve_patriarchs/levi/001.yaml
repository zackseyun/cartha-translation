  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (page 92, Levi source-fix v2)
  text: Διαθήκη Λευὶ τοῦ τρίτου υἱοῦ Ἰακὼβ καὶ Λίας¹. I. ᾿Αντίγραφον λόγων² Λευί³, ὅσα διέθετο⁴ τοῖς υἱοῖς αὐτοῦ⁵ κατὰ πάντα ἃ⁶ ποιήσουσιν⁷, καὶ ὅσα συναντήσει αὐτοῖς *ἕως ἡμέρας κρίσεως⁸. 2. Ὑγιαίνων⁹ γὰρ¹⁰ ἦν ὅτε ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν· *ἀπεκαλύφθη δὲ¹¹ αὐτῷ ὅτι μέλλει ἀποθνήσκειν¹². *Καὶ ὅτε¹³ συνήχθησαν¹⁴, *εἶπεν πρὸς αὐτούς¹⁵.
  language: Greek
  source_pages:
  - 92
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001.yaml
  text: 'A copy of the words of Levi, which he ordained for his sons concerning all that they would do, and what would happen to them[a] until the day of judgment.


    For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: pt
  text: 'Cópia das palavras de Levi, que ele determinou para seus filhos a respeito de tudo o que fariam e de tudo o que lhes sucederia[a] até o dia do juízo.


    Pois ele estava em boa saúde quando os chamou para junto de si; mas lhe foi revelado que estava prestes a morrer. Quando se reuniram, ele lhes disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “viria sobre eles”. A expressão grega sugere literalmente aquilo que os “encontraria” no futuro.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Cópia
  rationale: Apresenta o escrito como cópia ou registro das palavras de Levi, preservando o caráter documental do cabeçalho sem especificar uma prática arquivística.
- source_word: λόγων
  choice: das palavras
  rationale: É a opção mais ampla e natural para a fórmula introdutória, mantendo o tom solene do gênero testamentário.
- source_word: διέθετο
  choice: deixou estabelecidas
  rationale: No contexto de um testamento, o verbo pode indicar dispor, determinar ou prescrever. A expressão preserva a solenidade das disposições finais sem sugerir necessariamente ordenação religiosa.
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: a respeito de tudo o que fariam
  rationale: Mantém o alcance abrangente e prospectivo da frase grega em português natural.
- source_word: συναντήσει αὐτοῖς
  choice: lhes sucederia
  rationale: Traduz de modo idiomático os acontecimentos que viriam ao encontro deles, preservando em nota a imagem mais literal.
- source_word: ἕως ἡμέρας κρίσεως
  choice: até o dia do juízo
  rationale: Conserva a fórmula escatológica formal do grego sem acrescentar especificidade doutrinária.
- source_word: Ὑγιαίνων
  choice: estava em boa saúde
  rationale: Explicita que Levi não parecia estar enfermo quando convocou os filhos.
- source_word: ἀπεκαλύφθη
  choice: lhe foi revelado
  rationale: Preserva a voz passiva e o tom de revelação, sem identificar além do texto quem a concedeu.
- source_word: μέλλει ἀποθνήσκειν
  choice: estava prestes a morrer
  rationale: Expressa com clareza a iminência indicada pela construção grega.
- source_word: συνήχθησαν
  choice: se reuniram
  rationale: Verte naturalmente a reunião dos filhos em resposta à convocação de Levi.
theological_decisions:
- issue: Sentido da fórmula escatológica ἕως ἡμέρας κρίσεως
  choice: até o dia do juízo
  alternative: até o Dia do Juízo
  rationale: A forma em minúsculas mantém a referência escatológica presente no grego, mas evita transformar a expressão em título técnico ou importar uma elaboração doutrinária posterior.
- issue: Agente de ἀπεκαλύφθη
  choice: lhe foi revelado
  alternative: Deus lhe revelou
  rationale: A construção passiva grega não nomeia o agente; a tradução preserva essa indeterminação, embora o contexto possa sugerir revelação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. “Deixou estabelecidas” conserva o caráter testamentário sem o arcaísmo ou a possível ambiguidade religiosa de “ordenou”. A pontuação mantém o período solene, mas legível.
