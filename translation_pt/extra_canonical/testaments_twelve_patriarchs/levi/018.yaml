  text: 1 And after their vengeance has come from the Lord[5], the priesthood will fail. 2 Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute a judgment of truth upon the earth for many days. 3 And his star will rise in heaven like a king, giving light with the light of knowledge like the sun by day, and he will be magnified in the inhabited world. 4 He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth. 5 The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; and the angels of the glory of the Lord's presence will be glad in him. 6 The heavens will be opened, and from the temple of glory sanctification will come upon him with a fatherly voice, as from Abraham to Isaac. 7 And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him. 8 For
    he will give the majesty of the Lord to his sons in truth forever, and there will be no successor to him for generation upon generation, forever. 9 And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. During his priesthood sin will fail, and the lawless will cease from evil. 10 And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam. 11 And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them. 12 And Beliar will be bound by him, and he will give authority to his children to trample on evil spirits. 13 And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever. 14 Then Abraham and Isaac and Jacob will exult, and I will be glad[10][9b][9a][7], and all the holy ones will put on righteousness.
translation:
  language: pt
  text: '1 Depois que a vingança deles vier da parte do Senhor, o sacerdócio cessará. 2 Então o Senhor levantará um novo sacerdote, a quem todas as palavras do Senhor serão reveladas. Ele executará sobre a terra um julgamento conforme a verdade por muitos dias. 3 Sua estrela surgirá no céu como a de um rei, irradiando a luz do conhecimento como o sol durante o dia[a], e ele será engrandecido em todo o mundo habitado. 4 Ele resplandecerá como o sol sobre a terra, removerá toda a escuridão de debaixo do céu, e haverá paz em toda a terra.


    5 Os céus exultarão nos dias dele, a terra se alegrará e as nuvens se regozijarão.[b] Os anjos da glória da presença do Senhor se alegrarão nele. 6 Os céus se abrirão, e do templo da glória virá sobre ele a consagração, acompanhada de uma voz paterna, como a de Abraão dirigida a Isaque. 7 A glória do Altíssimo será proclamada sobre ele, e um espírito de entendimento e santificação repousará sobre ele.[c] 8 Pois ele dará aos seus filhos a majestade do Senhor em verdade para sempre. Ninguém lhe sucederá, de geração em geração, por toda a eternidade.


    9 Durante o sacerdócio dele, as nações se multiplicarão em conhecimento na terra e serão iluminadas pela graça do Senhor.[d] Durante o sacerdócio dele, o pecado cessará, e os que vivem sem lei deixarão de praticar o mal.[e] 10 Ele certamente abrirá as portas do paraíso e afastará a espada que ameaça Adão.[f] 11 Dará aos santos a comer da árvore da vida, e um espírito de santidade estará sobre eles. 12 Beliar será amarrado por ele, e ele dará aos seus filhos autoridade para pisar os espíritos maus.


    13 O Senhor se alegrará com seus filhos e terá prazer em seus amados para sempre. 14 Então Abraão, Isaque e Jacó exultarão; eu também me alegrarei, e todos os santos se revestirão de justiça.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação grega da expressão traduzida como “como o sol durante o dia” é textualmente difícil.
    reason: textual_variant
  - marker: b
    text: 'Alguns testemunhos acrescentam: “E o conhecimento do Senhor será derramado sobre a terra como a água dos mares.”'
    reason: textual_variant
  - marker: c
    text: 'Alguns testemunhos acrescentam: “na água”.'
    reason: textual_variant
  - marker: d
    text: 'Alguns testemunhos acrescentam: “Israel, porém, diminuirá em ignorância e será obscurecido pela tristeza.”'
    reason: textual_variant
  - marker: e
    text: 'Alguns testemunhos acrescentam: “mas os justos repousarão nele”.'
    reason: textual_variant
  - marker: f
    text: A espada ameaçadora alude à espada colocada para guardar o caminho da árvore da vida depois que Adão foi expulso do Éden.
    reason: cross_reference
lexical_decisions:
- source_word: ἱερωσύνη
  choice: sacerdócio
  rationale: Expressa naturalmente em português tanto a instituição quanto o exercício sacerdotal que cessa e depois é renovado na figura singular do novo sacerdote.
- source_word: ἱερέα καινόν
  choice: um novo sacerdote
  rationale: Preserva a novidade de caráter ou de época indicada por καινός sem identificar a figura com um personagem específico.
- source_word: κρίσιν ἀληθείας
  choice: um julgamento conforme a verdade
  rationale: Comunica o genitivo grego de modo claro e digno, sem reduzir a expressão simplesmente a 'julgamento verdadeiro'.
- source_word: οἰκουμένη
  choice: todo o mundo habitado
  rationale: Mantém a referência à terra habitada, e não ao universo em sentido cósmico.
- source_word: ἀναλάμψει
  choice: resplandecerá
  rationale: Conserva a imagem luminosa em harmonia com a estrela e o sol dos versículos próximos.
- source_word: ἁγίασμα
  choice: consagração
  rationale: No contexto da investidura do sacerdote, indica adequadamente uma dádiva ou ação santificadora que vem sobre ele, sem introduzir um objeto não expresso.
- source_word: φωνῆς πατρικῆς
  choice: voz paterna
  rationale: Preserva o caráter de pai expresso pelo adjetivo e mantém o registro elevado.
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  choice: um espírito de entendimento e santificação
  rationale: Mantém os dois substantivos abstratos e não transforma a expressão em um título doutrinário posterior.
- source_word: μεγαλωσύνην
  choice: majestade
  rationale: Traduz a grandeza divina comunicada pelo sacerdote com concisão e dignidade.
- source_word: διαδοχή
  choice: ninguém lhe sucederá
  rationale: Verte a ideia de ausência de sucessão em português natural, preservando a singularidade desse sacerdócio.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: É a opção mais ampla e menos condicionada por terminologia cristã posterior do que 'os gentios'.
- source_word: φωτισθήσονται
  choice: serão iluminadas
  rationale: Conserva simultaneamente os sentidos cognitivo e revelatório dentro do motivo de luz e conhecimento do capítulo.
- source_word: πνεῦμα ἁγιωσύνης
  choice: um espírito de santidade
  rationale: Mantém a construção indefinida e evita impor a leitura técnica 'o Espírito Santo', embora a expressão possa ter forte alcance teológico.
theological_decisions:
- issue: Identidade do novo sacerdote
  choice: Manter a designação genérica 'um novo sacerdote'.
  alternative: Identificá-lo explicitamente como Messias, Cristo, sumo sacerdote histórico ou personificação de um sacerdócio renovado.
  rationale: O texto descreve uma figura sacerdotal singular com funções cósmicas e salvíficas, mas não resolve expressamente sua identidade; a tradução preserva essa tensão.
- issue: Expansões entre colchetes nos versículos 5, 7 e 9
  choice: Omiti-las do corpo principal e registrá-las em notas de variante textual.
  alternative: Incorporar todas as expansões ao texto principal.
  rationale: A edição-fonte assinala essas frases como textualmente incertas ou secundárias; as notas mantêm transparência sem lhes atribuir certeza indevida.
- issue: Expressão 'espírito de santidade' no versículo 11
  choice: 'Usar inicial minúscula e artigo indefinido: ''um espírito de santidade''.'
  alternative: Traduzir como o título definido 'o Espírito Santo'.
  rationale: A formulação grega não exige que a expressão seja convertida em título trinitário técnico; a redação conserva sua possível amplitude teológica.
- issue: A vingança no versículo 1
  choice: Traduzir literalmente 'a vingança deles', preservando a referência ambígua do pronome.
  alternative: Explicitar 'a vingança contra eles' ou 'a vingança que eles executarão'.
  rationale: O genitivo αὐτῶν não determina por si só se o grupo sofre ou exerce a vingança; a tradução não resolve silenciosamente essa ambiguidade.
- issue: Filhos do sacerdote nos versículos 8 e 12
  choice: Manter 'seus filhos' sem definir se a relação é física, sacerdotal ou espiritual.
  alternative: Explicitar 'descendentes', 'discípulos' ou 'povo'.
  rationale: O texto usa υἱοί/τέκνα e deixa a natureza da filiação em aberto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira e vocabulário internacional. O paralelismo profético, as imagens de luz e a repetição de 'durante o sacerdócio dele' foram preservados. Construções excessivamente literais foram suavizadas quando não carregavam ambiguidade relevante, enquanto referências pronominais e afirmações teologicamente abertas permaneceram sem explicitação denominacional.
