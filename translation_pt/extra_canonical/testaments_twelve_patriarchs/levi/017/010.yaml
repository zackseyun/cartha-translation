source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/010.yaml
  text: And in the fifth week they will return to the land of their desolation, and they will renew the house of the Lord.
translation:
  language: pt
  text: E, na quinta semana, eles voltarão à terra da sua desolação e renovarão a casa do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομάδι
  choice: semana
  rationale: Mantém a imagem temporal do grego e a sequência simbólica do contexto, sem explicá-la no corpo do texto.
- source_word: γῆν ἐρημώσεως αὐτῶν
  choice: terra da sua desolação
  rationale: Reproduz de perto a construção grega e preserva a possível ambiguidade entre a terra que lhes pertence e a terra cuja desolação os afeta.
- source_word: ἀνακαινοποιήσουσιν
  choice: renovarão
  rationale: Expressa a ideia de tornar novo ou restaurar, com formulação natural em português.
- source_word: οἶκον κυρίου
  choice: casa do Senhor
  rationale: Tradução formal e tradicional que mantém a referência cultual sem substituir explicitamente por “templo”.
theological_decisions:
- issue: Sentido de “casa do Senhor”
  choice: casa do Senhor
  alternative: templo do Senhor
  rationale: O grego diz literalmente “casa”; conservar essa forma evita restringir indevidamente o alcance da expressão, embora o templo seja provavelmente o referente.
- issue: Relação expressa por “sua” em “sua desolação”
  choice: manter a ambiguidade possessiva
  alternative: terra que havia sido devastada
  rationale: A formulação grega admite tensão interpretativa; a tradução não identifica de maneira explícita o agente nem redefine a relação da desolação com o povo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe próxima ao grego sem perder naturalidade brasileira. Não há marcadores de nota no texto porque não foram acrescentadas notas editoriais.
