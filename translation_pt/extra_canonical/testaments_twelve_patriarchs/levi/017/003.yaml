base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/003.yaml
  text: In the second jubilee, the anointed one will be seized in mourning for a beloved one, and his priesthood will be honored, and he will be glorified by all.
translation:
  language: pt
  text: No segundo jubileu, o ungido será preso enquanto estiver de luto por alguém amado, e seu sacerdócio será honrado, e ele será glorificado por todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ δευτέρῳ ἰωβηλαίῳ
  choice: No segundo jubileu
  rationale: Reproduz diretamente a expressão temporal grega e mantém o termo técnico «jubileu».
- source_word: ὁ χριόμενος
  choice: o ungido
  rationale: O particípio substantivado designa aquele que é ungido; «o ungido» é natural e preserva a possível relevância messiânica sem explicitá-la além do grego.
- source_word: συλληφθήσεται
  choice: será preso
  rationale: O futuro passivo de συλλαμβάνω, neste contexto pessoal, indica apreensão ou detenção. «Será preso» é claro e não adota o sentido alternativo de concepção.
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: enquanto estiver de luto por alguém amado
  rationale: πένθος indica luto; o genitivo ἀγαπητοῦ pode indicar a pessoa amada por quem se lamenta. «Alguém amado» conserva a indefinição do substantivo implícito.
- source_word: ἡ ἱερωσύνη αὐτοῦ τιμία
  choice: seu sacerdócio será honrado
  rationale: τιμία admite a ideia de algo estimado, precioso ou honrado; a formulação predicativa «será honrado» se ajusta à coordenação futura do contexto.
- source_word: παρὰ πάντων δοξασθήσεται
  choice: ele será glorificado por todos
  rationale: Mantém a voz passiva e traduz παρά com agente como «por», sem restringir quem são «todos».
theological_decisions:
- issue: Possível identificação messiânica de ὁ χριόμενος
  choice: «o ungido» em minúscula
  alternative: «o Messias» ou «o Ungido»
  rationale: O grego diz literalmente «aquele que é ungido» e não exige que o título seja convertido explicitamente em «Messias»; a minúscula preserva a abertura do texto.
- issue: Sentido de συλληφθήσεται
  choice: «será preso»
  alternative: «será concebido»
  rationale: Embora συλλαμβάνω possa significar conceber em certos contextos, a leitura de apreensão é lexicalmente adequada aqui e evita introduzir uma afirmação sobre concepção que o contexto imediato não sustenta com clareza.
- issue: Relação expressa por ἀγαπητοῦ
  choice: «por alguém amado»
  alternative: «do amado» ou «por causa de um ente querido»
  rationale: O genitivo sem substantivo expresso permanece indefinido quanto à identidade e à relação da pessoa amada; a tradução não a identifica nem especifica parentesco.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Conserva a repetição coordenativa de «e», característica do texto, e evita terminologia confessional não exigida pelo grego.
