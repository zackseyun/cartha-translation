  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/002.yaml
  text: For in each jubilee there will be a priesthood. And in the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be full with the Lord. [And in the days of his joy, he will arise for the salvation of the world.]
translation:
  language: pt
  text: Pois, em cada jubileu, haverá um sacerdócio. E, no primeiro jubileu, aquele que primeiro for ungido para o sacerdócio será grande e falará a Deus como a um pai; e seu sacerdócio estará pleno com o Senhor. [E, nos dias de sua alegria, ele se levantará para a salvação do mundo.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração entre colchetes é textualmente incerta na edição grega.
    reason: A edição-fonte coloca toda a oração final entre colchetes; a nota preserva essa sinalização sem especificar indevidamente a natureza da incerteza.
lexical_decisions:
- source_word: ἰωβηλαῖον / ἰωβηλαίῳ
  choice: jubileu
  rationale: Mantém o termo técnico bíblico e a estrutura temporal do grego.
- source_word: ἱερωσύνη
  choice: sacerdócio
  rationale: Designa a instituição ou condição sacerdotal, sem reduzir o sentido a um sacerdote individual.
- source_word: ὁ χριόμενος πρῶτος
  choice: aquele que primeiro for ungido
  rationale: Preserva tanto o particípio passivo quanto a posição semântica de πρῶτος, cuja relação exata pode admitir alguma ambiguidade.
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: falará com Deus como com um pai
  rationale: Expressa naturalmente em português a interlocução indicada pelo dativo, sem transformar a comparação em identificação absoluta.
- source_word: πλήρης μετὰ κυρίου
  choice: estará pleno com o Senhor
  rationale: Conserva a formulação incomum do texto grego, incluindo μετὰ, em vez de resolver a expressão como 'pleno do Senhor' ou 'completo diante do Senhor'.
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: para a salvação do mundo
  rationale: Representa o valor final ou benéfico provável da expressão e segue a leitura contextual mais natural.
- source_word: ἀναστήσεται
  choice: se levantará
  rationale: Preserva a amplitude do verbo, que pode indicar levantar-se, surgir ou, em certos contextos, ressuscitar.
theological_decisions:
- issue: Sentido de πλήρης μετὰ κυρίου
  choice: estará pleno com o Senhor
  alternative: estará cheio do Senhor / será completo com o Senhor
  rationale: A construção grega é difícil; a tradução mantém sua tensão sem converter μετὰ em um genitivo teológico não expresso.
- issue: Possível sentido ressuscitacional de ἀναστήσεται
  choice: se levantará
  alternative: ressuscitará / surgirá
  rationale: O contexto pode permitir mais de uma leitura. 'Se levantará' retém a ambiguidade lexical sem impor uma interpretação cristológica específica.
- issue: Passagem textualmente marcada entre colchetes
  choice: manter os colchetes e acrescentar nota textual
  alternative: incorporar a frase sem indicação
  rationale: Os colchetes na edição-fonte assinalam incerteza ou condição textual relevante e devem permanecer visíveis ao leitor.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego onde isso preserva ambiguidade relevante. Emprega-se 'com um pai' por naturalidade e para manter o valor comparativo de ὡς πατρί. A expressão deliberadamente incomum 'pleno com o Senhor' reflete a dificuldade do original.
