  to: Pois, em cada jubileu, haverá um sacerdócio. E, no primeiro jubileu, aquele que primeiro for ungido para o sacerdócio será grande e falará a Deus como a um pai; e seu sacerdócio estará pleno com o Senhor. [E, nos dias de sua alegria, ele se levantará para a salvação do mundo.][a]
