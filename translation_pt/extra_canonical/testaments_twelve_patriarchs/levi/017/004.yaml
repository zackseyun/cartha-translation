lexical_decisions:
- source_word: Ὁ δὲ τρίτος ἱερεὺς
  choice: Mas o terceiro sacerdote
  rationale: Mantém a sequência enumerativa e traduz δέ por «mas», preservando o contraste com o contexto anterior.
- source_word: λύπῃ
  choice: pela tristeza
  rationale: O dativo pode indicar meio ou causa; «pela tristeza» preserva essa relação sem acrescentar uma interpretação mais específica.
- source_word: παραληφθήσεται
  choice: será levado
  rationale: Reproduz a forma passiva futura e o sentido básico de παραλαμβάνω, sem explicitar indevidamente quem ou o que o levará.
theological_decisions:
- issue: Sentido da expressão λύπῃ παραληφθήσεται
  choice: será levado pela tristeza
  alternative: será arrebatado pela tristeza; será levado embora em tristeza
  rationale: A formulação escolhida conserva a ambiguidade entre a tristeza como causa ou meio e evita decidir se o verbo constitui um eufemismo para morte ou remoção.
translation_notes:
  register: Português atual, digno e de leitura ampla. A construção é concisa e mantém a ambiguidade do grego; não se acrescenta «embora», pois essa nuance não é exigida pelo verbo no contexto fornecido.
