base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/005.yaml
  text: And the fourth will be in pains, because lawlessness will increase upon him to abundance, and all Israel will hate each one his neighbor.
translation:
  language: pt
  text: E o quarto estará em sofrimentos, porque a injustiça se multiplicará sobre ele em grande medida, e todo o Israel odiará, cada um, o seu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὀδύναις
  choice: em sofrimentos
  rationale: Preserva o sentido amplo de dores ou aflições, sem restringi-lo indevidamente à dor física.
- source_word: ἀδικία
  choice: injustiça
  rationale: Equivalente natural e semanticamente amplo para a falta de retidão ou justiça; evita limitar o termo à transgressão explícita de uma lei.
- source_word: εἰς πλῆθος
  choice: em grande medida
  rationale: Expressa idiomaticamente a ideia de aumento até a abundância, evitando a construção pouco natural 'para abundância'.
- source_word: τὸν πλησίον αὐτοῦ
  choice: o seu próximo
  rationale: Correspondência tradicional, clara e direta para a pessoa próxima ou semelhante.
theological_decisions:
- issue: Referente de ἐπ’ αὐτῷ ('sobre ele')
  choice: sobre ele
  alternative: no tempo dele
  rationale: O pronome masculino aponta formalmente para 'o quarto', mas a relação exata permanece ambígua; a tradução conserva essa ambiguidade em vez de interpretá-la temporalmente.
- issue: Valor de ἀδικία
  choice: injustiça
  alternative: ilegalidade
  rationale: O termo grego pode abranger injustiça, iniquidade e falta de retidão. 'Injustiça' preserva essa extensão melhor do que uma formulação centrada exclusivamente na lei.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe próxima ao grego onde isso não compromete a naturalidade. A aposição 'cada um' foi mantida para refletir ἕκαστος e esclarecer a reciprocidade individual dentro de todo o Israel.
