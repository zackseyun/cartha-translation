source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ὅτι ἠκούσατε¹ περὶ τῶν ἑβδομήκοντα² ἑβδομάδων³, ἀκούσατε καὶ⁴ περὶ τῆς ἱερωσύνης⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/001.yaml
  text: And since you have heard about the seventy weeks, hear also about the priesthood.
translation:
  language: pt
  text: E, visto que vocês ouviram falar das setenta semanas, ouçam também a respeito do sacerdócio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: setenta semanas
  rationale: Reproduz diretamente a expressão grega e preserva sua possível carga simbólica ou cronológica sem interpretá-la.
- source_word: ἱερωσύνης
  choice: sacerdócio
  rationale: Equivalente natural e preciso para a instituição ou função sacerdotal mencionada no contexto.
- source_word: ἀκούσατε
  choice: ouçam
  rationale: Mantém o imperativo plural e estabelece correspondência verbal com ἠκούσατε, traduzido por “vocês ouviram”.
theological_decisions:
- issue: Sentido das “setenta semanas”
  choice: Manter literalmente “setenta semanas”
  alternative: Explicitar “setenta períodos de sete” ou identificar uma referência profética específica
  rationale: O versículo não esclarece sozinho a natureza dessas semanas; a tradução preserva a ambiguidade do texto e evita impor uma interpretação cronológica ou teológica.
translation_notes:
  register: Português moderno, claro e digno, com plural explícito em “vocês” para refletir as formas verbais gregas no plural. “Visto que” comunica naturalmente a relação introduzida por καὶ ὅτι, enquanto “também” preserva καὶ antes de “a respeito do sacerdócio”.
