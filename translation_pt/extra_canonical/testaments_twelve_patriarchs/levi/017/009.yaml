  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/009.yaml
  text: Therefore they will be in captivity and in plunder, and their land and their possessions will be destroyed.
translation:
  language: pt
  text: Por isso, estarão em cativeiro e sujeitos à pilhagem; sua terra e seus bens serão destruídos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἰχμαλωσίᾳ
  choice: levados ao cativeiro
  rationale: Expressa em português natural a condição resultante indicada pela construção grega, sem perder a ideia de captura e deportação.
- source_word: ἐν προνομῇ
  choice: entregues ao saque
  rationale: Mantém o paralelismo com o cativeiro e comunica que eles ficarão sujeitos à pilhagem; é mais idiomático que uma reprodução nominal rígida.
- source_word: ἡ ὕπαρξις
  choice: seus bens
  rationale: No contexto, o singular coletivo designa aquilo que possuem, isto é, seus bens ou posses.
- source_word: ἀφανισθήσεται
  choice: serão destruídos
  rationale: Traduz a ideia de fazer desaparecer, arruinar ou destruir; a concordância plural em português abrange a terra e os bens, sujeitos coordenados.
