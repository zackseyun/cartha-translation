    issue: Explicitação verbal na primeira oração
    rationale: «Serão levados» e «entregues» são inferências plausíveis, mas o texto grego usa ἔσονται com dois complementos preposicionais. Uma formulação que preserve «estarão» e a condição de exposição ao saque é mais fiel à estrutura e à ênfase da fonte.
