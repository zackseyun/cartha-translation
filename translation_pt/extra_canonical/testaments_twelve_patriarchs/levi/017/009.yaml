  source_fidelity: A segunda oração traduz adequadamente γῆ e ὕπαρξις como «terra» e «bens», e «serão destruídos» comunica bem ἀφανισθήσεται. Na primeira oração, porém, o grego diz literalmente que «estarão em cativeiro e em/para saque», com duas condições paralelas. «Serão levados ... e entregues» explicita ações que não estão verbalmente expressas e enfraquece esse paralelismo.
  naturalness: A redação é clara e de registro apropriado. «Estarão em cativeiro e sujeitos à pilhagem» permanece natural em português moderno e reproduz mais de perto o anúncio de duas situações.
  terminology: «Cativeiro», «pilhagem», «terra» e «bens» são escolhas amplamente compreensíveis e adequadas. «Pilhagem» evita sugerir uma doutrina ou interpretação adicional e torna explícito que προνομῇ se refere à condição de ser objeto de saque.
