  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/008.yaml
  text: But in the seventh there will be defilement, which I cannot speak of before men, because those who do these things will know them.
translation:
  language: pt
  text: Mas, no sétimo, haverá contaminação, da qual não posso falar diante das pessoas, porque os próprios que fazem essas coisas as conhecerão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιασμός
  choice: contaminação
  rationale: Expressa profanação ou impureza moral/cultual sem acrescentar uma especificação ausente no grego.
- source_word: ἐνώπιον ἀνθρώπων
  choice: diante das pessoas
  rationale: Tradução natural e inclusiva de ἀνθρώπων no sentido genérico de seres humanos.
- source_word: αὐτοὶ γνώσονται
  choice: os próprios ... as conhecerão
  rationale: Preserva a ênfase de αὐτοί e o futuro de γινώσκω, mantendo a referência algo enigmática do original.
theological_decisions:
- issue: Natureza da contaminação no sétimo período
  choice: Não especificar o tipo de contaminação
  alternative: Explicitar como impureza sacerdotal, moral ou sexual
  rationale: O texto usa uma designação ampla e declara que o assunto não pode ser dito publicamente; especificá-lo resolveria indevidamente a ambiguidade.
- issue: Sentido de γνώσονται
  choice: 'Traduzir literalmente como conhecimento futuro: “as conhecerão”'
  alternative: 'Interpretar como conhecimento presente ou reconhecimento por experiência: “sabem quais são”'
  rationale: O futuro grego deve permanecer visível, mesmo que a relação temporal e o objeto do conhecimento sejam pouco claros.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “No sétimo” conserva a elipse do substantivo presente no contexto, e a sintaxe mantém deliberadamente o caráter velado da declaração.
