  text: The fifth will be taken in darkness.
translation:
  language: pt
  text: O quinto será levado em trevas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: O quinto
  rationale: Preserva a referência ordinal substantivada do grego, cujo referente é fornecido pelo contexto.
- source_word: ἐν σκότει
  choice: em trevas
  rationale: Mantém a imagem figurada e a formulação concisa do grego sem especificar se as trevas são literais, morais ou espirituais.
- source_word: παραληφθήσεται
  choice: será levado
  rationale: Reproduz a forma passiva futura e evita identificar o agente ou definir além do texto o destino ou propósito da ação.
theological_decisions:
- issue: Sentido das trevas e natureza de ser levado
  choice: Manter ambas as expressões sem explicação interpretativa no texto
  alternative: Explicitar como condenação, morte, afastamento ou queda espiritual
  rationale: O verso isolado não resolve a natureza das trevas nem da ação passiva; a tradução preserva essa ambiguidade e tensão.
translation_notes:
  register: Português atual, conciso e digno, com leitura natural no Brasil e compreensão internacional. A expressão “em trevas” conserva deliberadamente o tom solene e imagético do original.
