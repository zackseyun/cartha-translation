  naturalness: 'O português é moderno, claro e de registro adequado. Pequenos ajustes tornam a formulação mais direta: “avô” em vez de “antepassado” e “lave-se” em vez de “banhe-se” preservam melhor o vocabulário de purificação sem sacrificar a fluência.'
  terminology: “Sacerdote”, “holocaustos”, “primícias”, “ofertas voluntárias”, “ofertas de comunhão” e “coisas santas” funcionam bem. A nota sobre ofertas de comunhão preserva alternativas legítimas. A expressão “doze árvores que tenham folhas” deve permanecer sem suplemento interpretativo; a obscuridade pertence ao texto-fonte.
