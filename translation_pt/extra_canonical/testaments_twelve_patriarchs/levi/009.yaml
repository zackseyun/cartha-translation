  text: 'And after two days[a], I and Judah went up with our father Jacob to Isaac our grandfather. And the father of my father blessed me according to the visions that I had seen, and he was not willing to go with us to Bethel.


    And when we came to Bethel, my father Jacob saw a vision concerning me, that I would be a priest for them. And rising early in the morning, he gave a tenth of everything through me to the Lord.


    And so we came to Hebron to remain there. And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me. And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of firstfruits, of freewill offerings, and of peace offerings. And every day he kept instructing me in freewill offerings, and giving his attention to me he said:


    “Take heed to yourself from the spirit of sexual immorality[b], for this persists and is about to defile the holy things through your offspring. Therefore take for yourself a wife while you are still young, one having no blemish and not defiled, and not from the stock of foreign nations.


    And before you enter into the holy things, wash; and when you sacrifice in the presence of the Lord, wash your hands. And when you complete the sacrifice again, wash.


    And from twelve trees having leaves offer to the Lord, as Abraham taught me. And from every clean animal and bird offer a sacrifice to the Lord. And from all your first produce and wine offer firstfruits as a sacrifice to the Lord God[c][d]. And season every sacrifice with salt.”'
translation:
  language: pt
  text: 'Depois de dois dias, eu e Judá subimos com nosso pai Jacó até Isaque, nosso avô. O pai de meu pai me abençoou de acordo com as visões que eu tinha visto, mas não quis ir conosco a Betel.


    Quando chegamos a Betel, meu pai Jacó teve uma visão a meu respeito: eu seria sacerdote para eles. Levantando-se de manhã cedo, entregou ao Senhor, por meu intermédio, a décima parte de tudo.


    Assim, fomos a Hebrom para permanecer ali. Isaque me chamava continuamente para me fazer recordar a lei do Senhor, conforme o anjo me havia mostrado. Ele me ensinava a lei do sacerdócio, dos sacrifícios, dos holocaustos, das primícias, das ofertas voluntárias e das ofertas de comunhão[a]. Todos os dias ele me instruía e, dedicando sua atenção a mim, dizia:


    “Guarde-se do espírito da imoralidade sexual, pois ele é persistente[b] e há de profanar as coisas santas por meio de sua descendência. Portanto, enquanto você ainda é jovem, tome para si uma esposa que não tenha defeito nem tenha sido profanada e que não seja da linhagem de povos estrangeiros.


    “Antes de entrar nas coisas santas, lave-se; quando estiver sacrificando, lave-se; e, depois de terminar o sacrifício, lave-se novamente.[c]


    “Das doze árvores que tenham folhas, ofereça ao Senhor[d], assim como Abraão me ensinou. De todo animal puro e de toda ave, ofereça um sacrifício ao Senhor. De tudo o que primeiro for produzido e do vinho, apresente primícias como sacrifício ao Senhor Deus. Tempere com sal todo sacrifício.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser traduzida como “ofertas de paz”, “ofertas de bem-estar” ou “ofertas de salvação”.
    reason: lexical_alternative
  - marker: b
    text: A expressão grega traduzida como “ele é persistente” é textualmente difícil; o sentido provável é que esse espírito é contínuo ou persistente.
    reason: textual_variant
  - marker: c
    text: Os verbos empregados indicam lavagem ritual; no contexto sacrificial, as duas últimas ordens provavelmente se referem à lavagem das mãos.
    reason: cultural_note
  - marker: d
    text: A instrução acerca de “doze árvores que tenham folhas” é obscura. O texto grego não declara claramente o que deve ser oferecido, e a tradução preserva essa elipse sem suprir um objeto ritual específico.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεδεκάτωσε πάντα
  choice: entregou ... a décima parte de tudo
  rationale: Expressa claramente a ação de dar o dízimo sem depender do verbo técnico “dizimar”, preservando o sentido cultual.
- source_word: ἱερέα
  choice: sacerdote
  rationale: É o equivalente corrente e preciso para o ofício no contexto do sacerdócio hereditário.
- source_word: νόμον ἱερωσύνης
  choice: a lei do sacerdócio
  rationale: Mantém visível a construção genitiva e o tom de instrução normativa.
- source_word: ὁλοκαυτωμάτων
  choice: holocaustos
  rationale: Termo cultual estabelecido em português para sacrifícios inteiramente queimados; o contexto impede o sentido histórico moderno da palavra.
- source_word: ἀπαρχῶν
  choice: primícias
  rationale: Termo bíblico corrente para a primeira parte da produção oferecida a Deus.
- source_word: ἑκουσίου
  choice: ofertas voluntárias
  rationale: Preserva de modo natural o elemento de espontaneidade da oferta.
- source_word: σωτηρίου
  choice: ofertas de comunhão
  rationale: Designa de modo compreensível a categoria sacrificial, sem restringir o campo semântico a “paz”; a nota registra outras possibilidades.
- source_word: πρόσεχε σεαυτῷ
  choice: Guarde-se
  rationale: Imperativo natural e solene em português, adequado a uma advertência moral direta.
- source_word: πνεύματος τῆς πορνείας
  choice: espírito da imoralidade sexual
  rationale: Mantém a dimensão espiritual ou personificada e traduz πορνεία em linguagem moderna e abrangente.
- source_word: ἐνδελεχές
  choice: persistente
  rationale: Comunica o provável sentido de continuidade, embora a forma do texto grego seja difícil.
- source_word: μιαίνειν τὰ ἅγια
  choice: profanar as coisas santas
  rationale: Preserva a linguagem de contaminação cultual e a referência concreta ao âmbito sagrado.
- source_word: μὴ ἔχουσαν μῶμον μήτε βεβηλωμένην
  choice: que não tenha defeito nem tenha sido profanada
  rationale: Conserva a ressonância da linguagem cultual aplicada à esposa, sem transformar o texto em uma avaliação moral genérica.
- source_word: λούου ... νίπτου
  choice: banhe-se ... lave-se
  rationale: Distingue o primeiro verbo, associado ao banho, dos dois usos posteriores de νίπτω, associados à lavagem ritual.
theological_decisions:
- issue: Advertência de pureza ligada aos descendentes sacerdotais
  choice: A imoralidade sexual ameaça profanar as coisas santas por meio da descendência de Levi.
  alternative: Uma advertência moral geral, sem referência específica ao sacerdócio hereditário.
  rationale: O grego liga expressamente a ameaça à descendência de Levi e às coisas santas; essa relação foi mantida sem generalização.
- issue: Sentido cultual de σωτηρίου
  choice: ofertas de comunhão
  alternative: ofertas de paz, de bem-estar ou de salvação
  rationale: A lista indica uma categoria técnica de sacrifício. “Comunhão” é inteligível e cultualmente apropriado, enquanto a nota preserva a amplitude semântica.
- issue: Objeto obscuro na instrução sobre doze árvores
  choice: Suprir [madeira] entre colchetes e manter a referência a doze árvores com folhas.
  alternative: Traduzir como se as próprias árvores devessem ser apresentadas, ou reconstruir detalhadamente um rito não preservado.
  rationale: A construção grega parece incompleta ou corrompida. O suplemento mínimo torna a frase legível, e os colchetes e a nota deixam explícita a incerteza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe narrativa foi tornada natural sem apagar repetições significativas. Mantiveram-se termos cultuais reconhecíveis, e incertezas textuais ou semânticas foram sinalizadas em notas e, no caso de “madeira”, por colchetes.
