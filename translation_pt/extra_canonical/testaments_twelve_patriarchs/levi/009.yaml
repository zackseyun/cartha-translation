  - severity: low
    issue: “Antepassado” para προπάτορα em 9:1
    rationale: Embora προπάτωρ possa significar “antepassado”, Isaque é especificamente o pai de Jacó no próprio contexto; “avô” comunica com precisão a relação genealógica imediata e é mais natural.
  - severity: low
