base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019.yaml
  text: '1[a]. And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar[b].

    2. And his sons answered him, saying, “Before the Lord we will walk, and according to his law.”

    3. And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him[c], “Witnesses.”'
translation:
  language: pt
  text: '19


    1. E agora, meus filhos, vocês ouviram tudo. Escolham para si mesmos ou a luz ou as trevas, ou a lei do Senhor ou as obras de Beliar.[a]


    2. Seus filhos lhe responderam: “Andaremos diante do Senhor[b] e segundo a sua lei.”


    3. O pai deles lhes disse: “O Senhor é testemunha, e os seus anjos são testemunhas; vocês também são testemunhas, e eu sou testemunha quanto à palavra da boca de vocês.” Seus filhos lhe disseram: “Testemunhas.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beliar” é a forma do nome encontrada no texto grego; em outros textos, também aparece a forma “Belial”.
    reason: alternative_reading
  - marker: b
    text: “Andar diante do Senhor” é uma expressão bíblica que significa conduzir a vida na presença de Deus e sob sua autoridade.
    reason: cultural_note
  - marker: c
    text: Literalmente, apenas “Testemunhas”; a resposta é elíptica.
    reason: literal_rendering
lexical_decisions:
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Escolham para si mesmos
  rationale: O imperativo médio, acompanhado do pronome reflexivo, ressalta que os filhos devem fazer pessoalmente essa escolha; a formulação preserva essa força sem perder naturalidade.
- source_word: φῶς / σκότος
  choice: luz / trevas
  rationale: Mantém diretamente o contraste moral e simbólico do grego, sem reduzi-lo a uma explicação como “bem e mal”.
- source_word: νόμον κυρίου
  choice: a lei do Senhor
  rationale: Conserva a formulação pactual e traduz κύριος pelo título tradicional e amplamente compreensível “Senhor”.
- source_word: ἔργα τοῦ Βελίαρ
  choice: as obras de Beliar
  rationale: “Obras” preserva o sentido moral de ἔργα, enquanto “Beliar” translitera a forma do nome atestada neste texto grego.
- source_word: Ἐνώπιον κυρίου πορευσόμεθα
  choice: Andaremos diante do Senhor
  rationale: Reproduz o conhecido idioma bíblico de conduzir a vida perante Deus e sob sua autoridade, com uma ordem natural em português.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: segundo a sua lei
  rationale: Expressa de modo conciso a lei como norma que orientará a conduta prometida.
- source_word: Μάρτυς / μάρτυρες
  choice: testemunha / testemunhas
  rationale: A repetição consistente mantém o tom jurídico e pactual da declaração.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: quanto à palavra que saiu da boca de vocês
  rationale: Preserva a imagem concreta da palavra pronunciada pela boca, mas explicita idiomaticamente em português que se trata da declaração que acabaram de fazer.
- source_word: Μάρτυρες
  choice: Somos testemunhas
  rationale: O grego traz apenas o predicativo plural “testemunhas”; em português, a cópula implícita é expressa para formar uma resposta natural.
theological_decisions:
- issue: Dualismo ético entre luz e trevas, e entre a lei do Senhor e as obras de Beliar
  choice: Preservar literalmente os dois pares contrastantes
  alternative: Explicá-los como “bem e mal” ou “justiça e perversidade”
  rationale: A forma imagética e paralela é parte da exortação testamentária e não deve ser reduzida a categorias interpretativas.
- issue: Forma do nome Βελίαρ
  choice: Beliar
  alternative: Belial
  rationale: A tradução segue a forma que consta no testemunho grego fornecido, sem normalizá-la silenciosamente para a forma bíblica mais conhecida.
- issue: Sentido de andar diante do Senhor
  choice: Manter o idioma bíblico “andar diante do Senhor”
  alternative: Expandir para “viver em obediência responsável perante o Senhor”
  rationale: A expressão portuguesa é inteligível e conserva a metáfora bíblica, enquanto a nota esclarece seu alcance sem incorporá-lo interpretativamente ao texto.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com legibilidade brasileira. Mantiveram-se o paralelismo solene, o idioma bíblico de “andar diante do Senhor” e o vocabulário jurídico-pactual de “testemunha”, evitando tanto arcaísmos desnecessários quanto paráfrases doutrinárias.
