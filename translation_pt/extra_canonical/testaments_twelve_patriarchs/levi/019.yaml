  naturalness: O português é moderno, claro e apropriado ao registro solene. «Testemunhas» como resposta elíptica é natural no contexto jurídico-solene e preserva melhor a concisão enfática do original.
  terminology: «Senhor», «Beliar», «obras», «andar diante do Senhor» e «testemunha(s)» são escolhas consistentes e adequadas. As notas sobre Beliar e o idioma de andar diante do Senhor estão corretamente ancoradas.
