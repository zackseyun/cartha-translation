source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
translation:
  language: pt
  text: Mas, se ele negar e ficar envergonhado ao ser repreendido, fique quieto; não o repreenda[a]. Pois quem nega se arrepende de ter pecado contra você e, [tomado de medo][b], faz as pazes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega traduzida por «repreenda» está assinalada como textualmente incerta na edição utilizada.
    reason: Sinalizar a incerteza textual indicada pelo punhal crítico no texto-fonte.
  - marker: b
    text: A expressão «tomado de medo» aparece entre colchetes na edição grega, indicando incerteza textual.
    reason: Preservar de modo transparente o status editorial de φοβηθείς.
lexical_decisions:
- source_word: αἰδεσθῇ
  choice: ficar envergonhado
  rationale: Expressa de modo natural o sentimento de vergonha ou constrangimento indicado pelo verbo, sem acrescentar uma ideia explícita de remorso.
- source_word: ἡσύχασον
  choice: fique quieto
  rationale: Preserva a ordem direta de cessar e permanecer em silêncio ou tranquilidade.
- source_word: ἐλέγξῃς
  choice: repreenda
  rationale: Corresponde ao campo semântico de censurar, confrontar ou expor a falta; a repetição de «repreendido/repreenda» reflete a repetição da mesma raiz grega.
- source_word: πλημμελῆσαι εἰς σέ
  choice: ter pecado contra você
  rationale: Traduz a falta moral de πλημμελέω e conserva a direção pessoal expressa por εἰς σέ.
- source_word: εἰρηνεύει
  choice: faz as pazes
  rationale: Neste contexto relacional, comunica naturalmente a ação de restabelecer a paz, em vez do sentido meramente estático de estar em paz.
theological_decisions:
- issue: Relação entre a negação da falta e o arrependimento
  choice: Preservar a afirmação paradoxal de que «quem nega se arrepende»
  alternative: Explicitar que a vergonha demonstra arrependimento apesar da negação
  rationale: O grego mantém essa tensão sem oferecer uma explicação; acrescentá-la resolveria uma ambiguidade genuína do texto.
- issue: Finalidade ou consequência futura não expressa no texto grego fornecido
  choice: Não acrescentar «para que não volte a fazer mal»
  alternative: Seguir a expansão presente na camada inglesa
  rationale: Essa oração não aparece no texto grego apresentado; a tradução prioriza a evidência da fonte original.
translation_notes:
  register: Português moderno, digno e direto, com tratamento por «você» para ampla legibilidade brasileira. Mantém-se a concisão imperativa e a tensão lógica do grego, sem incorporar a oração explicativa adicional da versão inglesa.
