  text: VI. *Καὶ νῦν¹, τέκνα μου, Γπαραινῶ ὑμῖν⌉². ἀγαπᾶτε³ ἕκαστος *τὸν πλησίον⁴ αὑτοῦ⁵, καὶ ἐξάρατε τὸ μῖσος ἀπὸ τῶν καρδιῶν ὑμῶν· ἀγαπήσατε⁶ ἀλλήλους⁷ ἐν ἔργῳ καὶ λόγῳ καὶ διανοίᾳ ψυχῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/001.yaml
  text: 'And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and in thought of soul.'
translation:
  language: pt
  text: 'E agora, meus filhos, exorto vocês: cada um ame o seu próximo e removam o ódio de seus corações. Amem uns aos outros em obras, em palavras e no pensamento da alma.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no entendimento da alma” ou “na disposição da alma”. A expressão grega é compacta e pode abranger pensamento, entendimento ou disposição interior.'
    reason: Registra a amplitude semântica de διανοίᾳ e evita que a tradução principal pareça eliminar outras leituras legítimas.
lexical_decisions:
- source_word: παραινῶ
  choice: eu os exorto
  rationale: Expressa uma recomendação solene e insistente, preservando o tom paterno do discurso.
- source_word: τὸν πλησίον αὑτοῦ
  choice: o seu próximo
  rationale: Equivalente corrente e fiel para a pessoa próxima ou semelhante a quem se deve amar.
- source_word: ἐξάρατε
  choice: retirem
  rationale: Reproduz a ordem de remover ou extirpar o ódio sem acrescentar uma imagem ausente do texto.
- source_word: ἐν ἔργῳ καὶ λόγῳ
  choice: em atos, palavras
  rationale: Usa português natural para indicar que o amor deve manifestar-se tanto na conduta quanto na fala.
- source_word: διανοίᾳ ψυχῆς
  choice: no pensamento da alma
  rationale: Mantém a formulação compacta e a relação genitiva do grego, sem restringi-la interpretativamente a intenção, mente ou disposição.
theological_decisions:
- issue: Alcance interior do amor em διανοίᾳ ψυχῆς
  choice: no pensamento da alma
  alternative: na intenção da alma
  rationale: A escolha preserva a amplitude e certa tensão da expressão grega; “intenção” definiria de modo mais estreito o aspecto interior referido.
translation_notes:
  register: Português moderno, digno e acessível, com formas plurais de tratamento de boa legibilidade brasileira. A sequência “ame cada um” conserva a distribuição individual do mandamento, enquanto “retirem” e “amem” refletem as exortações dirigidas ao grupo.
