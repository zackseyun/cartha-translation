source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/007.yaml
  text: But even if he is shameless and persists in evil, even so forgive him from the heart, and give vengeance to God.
translation:
  language: pt
  text: Mas, ainda que ele seja desavergonhado e persista no mal, mesmo assim perdoe-lhe de coração e entregue a vingança a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδής
  choice: desavergonhado
  rationale: Expressa a falta de vergonha ou pudor moral indicada pelo termo grego, em linguagem atual e direta.
- source_word: ἐνίσταται τῇ κακίᾳ
  choice: persista no mal
  rationale: Preserva tanto a ideia de continuidade ou resistência obstinada em ἐνίσταται quanto o sentido geral de maldade em κακία, sem restringi-lo a um ato específico.
- source_word: ἄφες αὐτῷ ἀπὸ καρδίας
  choice: perdoe-lhe de coração
  rationale: Formulação natural em português que conserva o sentido de remissão dirigida à pessoa e sua sinceridade interior.
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  choice: entregue a vingança a Deus
  rationale: Mantém a imagem verbal de dar ou confiar a vingança a Deus, evitando a formulação menos natural 'dê a vingança' sem reduzir a expressão a mera passividade.
theological_decisions:
- issue: Responsabilidade pela vingança
  choice: entregue a vingança a Deus
  alternative: deixe a vingança para Deus
  rationale: A opção escolhida segue mais de perto o imperativo δός ('dê, entregue') e preserva a afirmação de que a retribuição deve ser confiada a Deus, sem explicar como ou quando ele a exercerá.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos na forma brasileira corrente. A repetição concessiva 'ainda que... mesmo assim' reproduz a ênfase do grego de modo natural.
