base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/005.yaml
  text: Do not let another hear your secret in a quarrel, lest, having come to hate you, he become your enemy and commit a great sin against you; for many times he either murders you by treachery or entangles you in evils, having received the poison from you.
translation:
  language: pt
  text: Não deixe que outra pessoa ouça o seu segredo durante uma discussão, para que, passando a odiar você, não se torne sua inimiga e cometa um grande pecado contra você; pois muitas vezes ela o mata à traição ou o envolve em males, depois de receber de você o veneno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν μάχῃ
  choice: durante uma discussão
  rationale: Aqui μάχη indica conflito verbal ou contenda; “discussão” comunica isso naturalmente sem sugerir necessariamente combate físico.
- source_word: ἀλλότριος
  choice: outra pessoa
  rationale: O adjetivo substantivado designa alguém de fora ou um terceiro; a formulação mantém o sentido amplo sem impor “estranho”.
- source_word: τὸ μυστήριόν σου
  choice: o seu segredo
  rationale: No contexto, μυστήριον é informação confidencial revelada durante a contenda, não um “mistério” teológico.
- source_word: δολοφωνεῖ σε
  choice: o mata à traição
  rationale: Preserva tanto o ato de matar quanto a ideia de dolo ou emboscada presente no composto.
- source_word: περιεργάζεται σε ἐν κακοῖς
  choice: o envolve em males
  rationale: Expressa a ação de enredar ou envolver alguém em situações más, preservando a relativa amplitude do grego.
- source_word: τὸν ἰόν
  choice: o veneno
  rationale: ἰός significa literalmente veneno; aqui funciona também como imagem do conteúdo nocivo fornecido pelas próprias palavras da pessoa.
theological_decisions:
- issue: Agência e responsabilidade pelo pecado provocado pela revelação do segredo
  choice: Manter que a outra pessoa comete o pecado “contra você”, embora tenha recebido de você o “veneno”.
  alternative: Explicitar que quem revelou o segredo também participa da culpa.
  rationale: O texto cria deliberadamente tensão entre o pecado praticado pelo inimigo e a ocasião fornecida pelo falante; a tradução não acrescenta uma conclusão moral que o grego apenas sugere.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de tratamento de boa legibilidade brasileira. A repetição de “você” foi mantida onde ajuda a conservar as relações explícitas do grego; “ela” retoma “outra pessoa” sem restringir o gênero do referente.
