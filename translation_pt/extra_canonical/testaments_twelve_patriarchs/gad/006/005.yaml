  source_fidelity: 'A tradução preserva adequadamente a sequência e as relações do grego: a advertência contra deixar um terceiro ouvir o segredo no contexto de conflito, o resultado de ódio e inimizade, o grande pecado cometido contra o interlocutor e as duas consequências finais ligadas ao "veneno" recebido dele. “Durante uma discussão” é uma contextualização aceitável de ἐν μάχῃ, que neste contexto pode indicar contenda, sem exigir combate militar literal.'
