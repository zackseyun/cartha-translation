base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/002.yaml
  text: For I myself, in my father’s presence, spoke peaceably to Joseph; but when I had gone out from him, the spirit of hatred darkened my mind and disturbed my thoughts to kill him.
translation:
  language: pt
  text: Pois eu, na presença de meu pai, falava pacificamente a José; mas, ao sair de junto dele, o espírito de ódio obscurecia minha mente e perturbava meus pensamentos, voltando-os para matá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόσωπον τοῦ πατρὸς μου
  choice: na presença de meu pai
  rationale: Expressa naturalmente a ideia de estar diante do pai, sem o literalismo pouco idiomático de “perante o rosto”.
- source_word: εἰρηνικὰ ἐλάλουν
  choice: falava pacificamente
  rationale: Mantém o valor adverbial de εἰρηνικά e sugere fala cordial ou conciliadora, sem acrescentar conteúdo ausente do grego.
- source_word: ἐξερχόμενος δὲ ἐξ αὐτοῦ
  choice: mas, quando me afastava dele
  rationale: O grego indica sair de junto de José; “afastava” é natural em português e evita a possível leitura de que algo saía de dentro dele.
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: o espírito de ódio
  rationale: Preserva a personificação e a possível dimensão espiritual da expressão, sem reduzi-la a mero sentimento.
- source_word: ἐσκότιζέ μου τὸν νοῦν
  choice: obscurecia minha mente
  rationale: Traduz diretamente a imagem de escurecer o νοῦς, entendido aqui como mente ou percepção.
- source_word: ἐτάρασσέ μου τὸν λογισμόν
  choice: perturbava meus pensamentos
  rationale: “Pensamentos” comunica o campo semântico de λογισμός em linguagem corrente e preserva sua distinção aproximada de νοῦς.
- source_word: πρὸς τὸ ἀνελεῖν αὐτόν
  choice: levando-me a matá-lo
  rationale: Torna clara em português a orientação resultante ou intencional da perturbação, sem expandi-la para uma formulação volitiva como “eu queria”.
theological_decisions:
- issue: Natureza do “espírito de ódio”
  choice: Manter “espírito de ódio” literalmente
  alternative: Traduzir como “sentimento de ódio”
  rationale: O texto pode personificar uma disposição interior ou referir-se a uma influência espiritual; a tradução preserva essa ambiguidade em vez de decidir entre as leituras.
- issue: Força de πρὸς τὸ ἀνελεῖν αὐτόν
  choice: “levando-me a matá-lo”
  alternative: “para matá-lo”
  rationale: A escolha comunica a direção ou resultado dos pensamentos perturbados sem afirmar mais especificamente um desejo consciente nem tornar a construção portuguesa obscura.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Os verbos no imperfeito refletem as formas gregas e apresentam ações habituais ou em curso no relato. Não foram necessárias notas de rodapé.
