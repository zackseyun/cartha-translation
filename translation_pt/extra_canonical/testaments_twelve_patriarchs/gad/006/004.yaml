  text: But if he denies it, do not contend with him, lest, when he swears, you sin doubly.
translation:
  language: pt
  text: Mas, se ele negar, não discuta com ele, para que, caso ele jure, você não peque duas vezes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνεῖται
  choice: negar
  rationale: Expressa diretamente a recusa ou negação do fato em questão, sem acrescentar um objeto ausente no grego.
- source_word: μὴ φιλονείκει
  choice: não discuta
  rationale: Traduz a proibição de entrar em contenda ou disputa, em linguagem corrente e digna.
- source_word: ὁμόσαντος
  choice: ao jurar
  rationale: Preserva a formulação concisa do particípio grego, sem explicitar indevidamente 'um juramento'.
- source_word: δισσῶς ἁμαρτάνεις
  choice: você não peque duas vezes
  rationale: Mantém a ideia literal de pecar de modo duplo; a construção final em português comunica naturalmente a advertência.
theological_decisions:
- issue: Responsabilidade pelo pecado duplo
  choice: Manter o destinatário como sujeito de 'pecar duas vezes'.
  alternative: Reformular de modo impessoal ou atribuir o segundo pecado a quem jura.
  rationale: O verbo ἁμαρτάνεις está na segunda pessoa do singular e atribui explicitamente o pecado ao interlocutor; a tensão moral do texto deve ser preservada.
translation_notes:
  register: Português moderno, claro e amplamente compreensível, com tratamento por 'você'. A ordem da oração foi mantida próxima ao grego, e não foram acrescentadas explicações ausentes no texto-fonte.
