base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/003.yaml
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
translation:
  language: pt
  text: Amem uns aos outros de coração. Se alguém pecar contra você, diga-lhe palavras de paz e não guarde engano em sua alma; e, se ele se arrepender e confessar, perdoe-lhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há duas formas gregas principais deste trecho. A forma seguida no texto diz literalmente «diga-lhe paz» e traz «se ele, arrependendo-se, confessar». A outra diz «fale com ele em paz», acrescenta «expulsando o veneno do ódio» e traz «se ele, confessando, se arrepender».
    reason: Registra as variantes substanciais — a formulação da abordagem pacífica, o acréscimo sobre o ódio e a ordem entre arrependimento e confissão — sem misturar leituras no texto principal.
lexical_decisions:
- source_word: Ἀγαπήσατε ἀλλήλους ἀπὸ καρδίας
  choice: Amem uns aos outros de coração
  rationale: Reproduz diretamente o imperativo e a ideia de amor sincero e interior, em português natural.
- source_word: ἁμαρτήσει εἰς σέ
  choice: pecar contra você
  rationale: A expressão grega indica uma falta dirigida contra a pessoa; «pecar contra» preserva sua força moral e relacional.
- source_word: εἰπὲ αὐτῷ εἰρήνην / εἰπὲ αὐτῷ ἐν εἰρήνῃ
  choice: fale com ele em paz
  rationale: A formulação acomoda de modo natural as duas formas textuais gregas, «fale-lhe paz» e «fale com ele em paz», sem sugerir mera saudação.
- source_word: ἐν τῇ ψυχῇ σου μὴ κρατήσῃς δόλον
  choice: sem guardar engano em sua alma
  rationale: Mantém «alma» e o sentido de não conservar dolo, falsidade ou intenção traiçoeira no íntimo.
- source_word: ὁμολογήσῃ / ὁμολογήσας
  choice: confessar
  rationale: Traduz o reconhecimento declarado da falta sem explicitar um objeto ausente no grego.
- source_word: μετανοήσας / μετανοήσῃ
  choice: se arrepender
  rationale: «Arrepender-se» expressa adequadamente a mudança interior e moral indicada por μετανοέω.
- source_word: ἄφες αὐτῷ
  choice: perdoe-lhe
  rationale: Verte o imperativo de remissão pessoal de modo conciso e digno.
theological_decisions:
- issue: Relação entre confissão, arrependimento e perdão
  choice: «se ele confessar e se arrepender, perdoe-lhe»
  alternative: «se ele se arrepender e confessar, perdoe-lhe»
  rationale: As testemunhas variam na ordem dos dois atos. O texto principal segue a ordem refletida na forma β e na consulta inglesa, enquanto a nota registra a inversão da forma α; não se acrescenta uma doutrina sobre condições gerais do perdão.
- issue: Disposição pacífica diante de quem peca
  choice: «fale com ele em paz»
  alternative: '«diga-lhe: “Paz”»'
  rationale: A opção conserva a exortação à abordagem pacífica presente nas variantes e evita restringir a frase a uma saudação ritual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. Emprega «você» no singular por naturalidade ampla no Brasil, mantendo construções que não dependem de regionalismos. A pontuação organiza a longa sequência grega sem apagar sua progressão ética.
