  text: So Joseph my brother was shepherding all the livestock with us for thirty days, and being young, he was weakened by the heat.
translation:
  language: pt
  text: 4 Assim, José, meu irmão, pastoreava conosco durante trinta dias e, sendo jovem, ficou enfraquecido pelo calor intenso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινε μεθ’ ἡμῶν
  choice: cuidou dos rebanhos conosco
  rationale: O verbo ποιμαίνω descreve o trabalho de pastorear; em português corrente, “cuidou dos rebanhos” expressa naturalmente a atividade sem acrescentar uma totalidade não explícita no grego.
- source_word: ἕως ἡμέρας τριάκοντα
  choice: durante trinta dias
  rationale: Embora ἕως tenha sentido básico de “até”, neste contexto a expressão indica a duração do período e é vertida de modo idiomático.
- source_word: ἐμαλακίσθη
  choice: ficou debilitado
  rationale: O passivo indica que José perdeu as forças ou ficou enfraquecido, não necessariamente que adoeceu.
- source_word: τοῦ καύσωνος
  choice: pelo calor intenso
  rationale: καύσων denota calor abrasador ou escaldante; “calor intenso” é claro, natural e preserva a força do termo.
