  text: And beyond this I was angry with Joseph until the day of his being sold.
translation:
  language: pt
  text: E, além disso, guardei rancor de José até o dia em que ele foi vendido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ τοῦτο
  choice: além disso
  rationale: A expressão acrescenta esse motivo ou aspecto ao que precede; em português corrente, «além disso» preserva a conexão sem tornar a frase artificial.
- source_word: ἐνεκότουν
  choice: guardei rancor
  rationale: O verbo denota ressentimento ou hostilidade persistente, não apenas um momento de ira; «guardei rancor» comunica naturalmente esse caráter continuado.
- source_word: ἕως ἡμέρας διαπράσεως αὐτοῦ
  choice: até o dia em que ele foi vendido
  rationale: A construção nominal refere-se ao dia da venda de José. A oração verbal é idiomática e mantém o sentido passivo indicado pelo contexto e pela tradição textual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A formulação conserva a confissão direta de ressentimento prolongado contra José.
