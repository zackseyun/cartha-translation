  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A expressão enfática “na nossa cara” reproduz o caráter direto de κατὰ πρόσωπον; as ambiguidades relevantes são preservadas ou registradas em nota.
