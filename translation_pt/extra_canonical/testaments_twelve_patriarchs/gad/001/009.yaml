base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/009.yaml
  text: And the spirit of hatred was in me, and I did not want to perceive Joseph, neither through hearing nor through sight, because he rebuked us to our face, saying that we were eating the livestock without Judah. For in everything he said to our father, he believed him.
translation:
  language: pt
  text: 9. O espírito de ódio estava em mim, e eu não queria nem ouvi-lo nem vê-lo, a José, porque ele nos havia repreendido diretamente, dizendo que comíamos os animais do rebanho sem Judá. Pois nosso pai acreditava em tudo o que José lhe dizia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego emprega pronomes na frase final. Pelo contexto, o sentido mais provável é que nosso pai acreditava em José.
    reason: A tradução explicita os referentes para leitura clara, preservando em nota a indeterminação pronominal da redação grega.
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: o espírito de ódio
  rationale: Mantém a expressão concreta e a possível dimensão moral ou espiritual do grego, sem reduzi-la apenas a um sentimento.
- source_word: οὔτε δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν ἰδεῖν
  choice: nem ouvir falar de José nem vê-lo
  rationale: Comunica em português natural a oposição entre audição e visão, preservando em nota a construção grega incomum.
- source_word: κατὰ πρόσωπον
  choice: na nossa cara
  rationale: Equivalente corrente e enfático de uma repreensão feita diretamente, face a face.
- source_word: τὰ θρέμματα
  choice: os animais do rebanho
  rationale: Abrange os animais criados ou o gado, sem restringir indevidamente a uma espécie.
- source_word: χωρὶς Ἰούδα
  choice: sem Judá
  rationale: Preserva a formulação concisa e ambígua do grego, sem especificar se Judá estava ausente ou se não participou.
- source_word: ἐπείθετο αὐτῷ
  choice: acreditava em tudo o que José lhe dizia
  rationale: 'No contexto, explicita os referentes pronominais para evitar a ambiguidade artificial do português: o pai dava crédito ao relato de José.'
