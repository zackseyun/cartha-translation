  text: And he returned to Hebron to our father. And he made him recline near himself, because he loved him very much.
translation:
  language: pt
  text: 5. E ele voltou a Hebrom, para junto de nosso pai. E nosso pai o fez reclinar-se ao seu lado, porque o amava muito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: voltou
  rationale: Expressa de modo natural o retorno indicado pelo aoristo grego.
- source_word: πρὸς τὸν πατέρα ἡμῶν
  choice: para junto de nosso pai
  rationale: Preserva a ideia direcional e relacional de πρός sem sugerir que o pai estivesse necessariamente dentro da cidade.
- source_word: ἀνέκλινεν αὐτὸν πλησίον αὐτοῦ
  choice: nosso pai o fez reclinar-se ao seu lado
  rationale: Torna explícito em português o referente contextual do sujeito e conserva a imagem de fazê-lo reclinar-se perto de si, provavelmente à mesa.
- source_word: πάνυ
  choice: muito
  rationale: Equivalente corrente e digno para o intensificador grego.
theological_decisions:
- issue: Referentes pronominais em ἀνέκλινεν αὐτὸν πλησίον αὐτοῦ
  choice: Identificar o sujeito como “nosso pai” e manter o objeto como “o”.
  alternative: “E ele o fez reclinar-se perto de si.”
  rationale: O grego depende do contexto para os referentes; a explicitação mínima evita uma sequência pronominal ambígua e preserva o sentido refletido na tradição textual consultada, sem introduzir conteúdo doutrinário.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira. “Reclinar-se” foi mantido para preservar o costume antigo de tomar lugar à mesa, sem acrescentar essa interpretação ao corpo do texto.
