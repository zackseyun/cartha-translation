  text: I therefore guarded the flock by night; and when a lion or a wolf or any wild beast came against the flock, I would chase it down, and overtaking it I would seize its foot with my hand, and hurl it about a stone's throw, and so kill it.
translation:
  language: pt
  text: Eu, portanto, guardava o rebanho durante a noite. Quando um leão, um lobo ou qualquer animal selvagem atacava o rebanho, eu o perseguia; ao alcançá-lo, agarrava-lhe a pata com a mão, arremessava-o a uma distância equivalente ao alcance de uma pedra lançada e o matava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: guardava
  rationale: O imperfeito descreve a atividade habitual de Gad, preservada naturalmente pelo pretérito imperfeito em português.
- source_word: ἐπὶ τὴν ποίμνην
  choice: atacava o rebanho
  rationale: Neste contexto de animais predadores, traduz de modo natural o movimento hostil contra o rebanho.
- source_word: κατεδίωκον
  choice: perseguia
  rationale: Expressa perseguição ativa e habitual sem acrescentar a ideia não explícita de captura.
- source_word: φθάνων ἐκράτουν
  choice: ao alcançá-lo, agarrava
  rationale: Reproduz a sequência do particípio e do verbo principal, mantendo o aspecto habitual dos imperfeitos do contexto.
- source_word: τὸν πόδα αὐτοῦ
  choice: a pata
  rationale: Em referência a um animal, 'pata' é a expressão corrente e semanticamente adequada em português.
- source_word: ἠκόντισα αὐτὸ ὡσεὶ λίθου βολήν
  choice: arremessava-o à distância de um tiro de pedra
  rationale: Preserva a comparação de distância do grego com formulação clara e digna.
- source_word: ἀνῄρουν
  choice: matava
  rationale: No contexto, o verbo significa tirar a vida; o imperfeito concorda com a narrativa de ação repetida.
