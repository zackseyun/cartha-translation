  rationale: Reproduz diretamente a ideia de uma cópia ou transcrição de um documento, preservando o caráter titular da frase.
- source_word: διαθήκης
  choice: testamento
  rationale: No contexto do gênero literário, designa as últimas disposições e exortações atribuídas ao patriarca; “testamento” é natural e tradicional em português.
- source_word: ἐλάλησε
  choice: proferiu
  rationale: Expressa um pronunciamento oral solene com mais naturalidade neste cabeçalho do que o literal “falou”.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: no centésimo vigésimo quinto ano de sua vida
  rationale: Mantém com precisão a formulação ordinal e biográfica do grego.
- source_word: λέγων αὐτοῖς
  choice: dizendo-lhes
  rationale: Preserva o particípio introdutório e sua ligação com o discurso que segue.
