translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação grega inclui explicitamente Rúben e Judá; ambos foram preservados, em vez da revisão inglesa mais antiga que mencionava apenas Judá.
