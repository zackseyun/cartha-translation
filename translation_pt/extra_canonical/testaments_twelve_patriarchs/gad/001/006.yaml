  text: And Joseph told our father that the sons of Zilpah and Bilhah were slaughtering the best of the livestock and eating them without the consent of Reuben and Judah.
translation:
  language: pt
  text: 6. E José disse ao nosso pai que os filhos de Zilpa e Bila estavam abatendo os melhores animais do rebanho e comendo-os sem o consentimento de Rúben e Judá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θύουσι
  choice: estavam abatendo
  rationale: No contexto de animais destinados à alimentação, o verbo indica matar ou abater; evita-se «sacrificar», que poderia sugerir sem necessidade um rito cultual.
- source_word: τὰ θρέμματα τὰ καλὰ
  choice: os melhores animais do rebanho
  rationale: Θρέμματα designa animais criados ou gado, e καλά, neste contexto, os qualifica como bons ou escolhidos; a formulação portuguesa é natural e preserva o sentido.
- source_word: παρὰ γνώμην
  choice: sem o consentimento
  rationale: A expressão significa agir contra a opinião, vontade ou autorização de alguém; «sem o consentimento» comunica claramente a falta de anuência.
