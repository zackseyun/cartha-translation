base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/007.yaml
  text: For he had seen that I rescued a lamb from the mouth of a bear, and I killed her, but I slaughtered the lamb — over which I grieved, because it could not live — and we ate it.
translation:
  language: pt
  text: Pois ele tinha visto que eu resgatei um cordeiro da boca de uma ursa e a matei, mas abati o cordeiro — do qual me entristeci, pois não podia viver — e nós o comemos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξειλάμην
  choice: havia arrancado
  rationale: Expressa o resgate do cordeiro das mandíbulas da ursa com naturalidade e preserva a força concreta do verbo no contexto.
- source_word: ἄρκου
  choice: ursa
  rationale: O pronome feminino κἀκείνην confirma que o animal é apresentado como fêmea.
- source_word: ἔθυσα
  choice: sacrifiquei
  rationale: Mantém o sentido básico de abater ritualmente ou sacrificar, sem reduzi-lo ao simples ato de matar; no contexto, o cordeiro é abatido para ser comido.
- source_word: ἐλυπούμην
  choice: fiquei pesaroso
  rationale: Transmite tristeza e pesar em registro digno, sem intensificar indevidamente a emoção.
- source_word: οὐκ ἠδύνατο ζῆν
  choice: não podia sobreviver
  rationale: Em português corrente, indica naturalmente que o cordeiro ferido já não tinha condições de continuar vivo.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe narrativa natural. A construção parentética conserva a sequência e a tensão do grego: Gad salva o cordeiro, mata a ursa, depois sacrifica o animal irrecuperável e o come com os demais.'
