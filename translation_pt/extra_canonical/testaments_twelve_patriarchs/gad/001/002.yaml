lexical_decisions:
- source_word: Ἀκούσατε
  choice: Ouçam
  rationale: Imperativo aoristo plural, vertido de modo direto e natural no português moderno.
- source_word: ἐγενόμην ἔννατος υἱὸς τῷ Ἰακώβ
  choice: eu fui o nono filho de Jacó
  rationale: Expressa com clareza a posição de Gad entre os filhos de Jacó; o dativo τῷ Ἰακώβ indica a relação filial.
- source_word: ἀνδρεῖος
  choice: valente
  rationale: Preserva o sentido de coragem e bravura sem acrescentar conotações militares ausentes do contexto.
- source_word: ἐπὶ τῶν ποιμνίων
  choice: ao cuidar dos rebanhos
  rationale: Formulação idiomática que comunica a atuação corajosa de Gad em relação aos rebanhos; evita o pouco natural 'sobre os rebanhos'.
