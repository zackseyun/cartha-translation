  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/003.yaml
  text: He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.
translation:
  language: pt
  text: Ele censura a verdade, inveja quem é bem-sucedido, acolhe a calúnia e ama a arrogância, porque o ódio lhe cega a alma, assim como cegou a minha alma, quando eu olhava para José.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψέγει
  choice: censura
  rationale: Expressa reprovação ou crítica condenatória de modo natural e digno, sem enfraquecer o verbo grego.
- source_word: τῷ κατορθοῦντι
  choice: quem é bem-sucedido
  rationale: O particípio pode indicar quem alcança êxito ou prospera; a formulação preserva esse sentido amplo sem acrescentar uma causa específica para o sucesso.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: acolhe a calúnia
  rationale: Mantém a imagem de receber ou abraçar favoravelmente a fala difamatória, em português corrente.
- source_word: ὑπερηφανίαν ἀγαπᾷ
  choice: ama a arrogância
  rationale: Reproduz diretamente a força de ἀγαπᾷ e o sentido negativo de ὑπερηφανία no contexto.
- source_word: ἐκτυφλοῖ
  choice: cega
  rationale: Transmite com clareza a imagem central de privação da percepção moral; o contexto não exige explicitar separadamente a força intensiva do composto.
- source_word: ἔβλεπον τὸν Ἰωσήφ
  choice: eu olhava para José
  rationale: O imperfeito sugere uma ação ou disposição continuada; 'olhava para' conserva essa nuance melhor que uma forma pontual.
theological_decisions:
- issue: Sujeito e objeto implícitos na comparação final
  choice: assim como cegou a minha
  alternative: assim como também eu, quando olhava para José
  rationale: A frase grega final é comprimida, mas o contexto fornece naturalmente 'o ódio' como sujeito e 'a minha alma' como objeto. A explicitação produz português compreensível sem introduzir uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo verbal preservado. Optou-se por 'acolhe' em vez do mais literal 'abraça' para soar natural sem perder a ideia de aprovação voluntária.
