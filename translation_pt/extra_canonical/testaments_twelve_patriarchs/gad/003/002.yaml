base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/002.yaml
  text: Whatever the one who hates may do is abominable. If anyone does the law of the Lord, the hater does not praise him. If anyone fears the Lord and desires what is righteous, the hater does not love him.
translation:
  language: pt
  text: Tudo o que aquele que odeia faz é abominável. Se alguém pratica a lei do Senhor, aquele que odeia não o elogia. Se alguém teme o Senhor e deseja o que é justo, aquele que odeia não o ama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μισῶν
  choice: aquele que odeia
  rationale: Preserva o particípio substantivado grego e identifica com clareza a pessoa dominada pelo ódio, sem recorrer ao menos natural «o odiador».
- source_word: ποιῇ τὸν νόμον Κυρίου
  choice: pratica a lei do Senhor
  rationale: Expressa de modo natural a ideia semítica de fazer ou observar a lei, evitando tanto o literalismo pouco idiomático «faz a lei» quanto a possível conotação excessiva de «cumpre».
- source_word: τὸ δίκαιον
  choice: o que é justo
  rationale: 'Reproduz o adjetivo neutro substantivado e mantém seu sentido abrangente: aquilo que é justo ou correto.'
- source_word: βδελυκτόν
  choice: abominável
  rationale: Conserva a forte avaliação moral do termo grego em registro digno e corrente.
theological_decisions:
- issue: Sujeito não expresso de οὐκ ἐπαινεῖ e οὐκ ἀγαπᾷ
  choice: Repetir «aquele que odeia» como sujeito nas duas frases
  alternative: Deixar o sujeito apenas implícito ou entender como sujeito indeterminado
  rationale: O grego naturalmente retoma ὁ μισῶν da primeira frase; a repetição em português elimina uma ambiguidade gramatical desnecessária sem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de «aquele que odeia» acompanha a coesão retórica do texto e evita o substantivo pouco corrente «odiador».
