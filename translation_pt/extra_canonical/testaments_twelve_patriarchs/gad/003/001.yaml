reference: Testament of Gad 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: III. Καὶ νῦν ἀκούσατε¹ λόγον² ἀληθείας³, *τοῦ ποιεῖν⁴ δικαιοσύνην, καὶ πάντα⁵ νόμον⁶ ὑψίστου, καὶ μὴ⁷ πλανᾶσθε⁸ τέκνα *τῷ πνεύματι⁹ τοῦ μίσους¹⁰, ὅτι κακόν ἐστιν ἐπὶ πάσαις ταῖς¹¹ πράξεσι τῶν¹¹ ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/001.yaml
  text: 'And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, children, by the spirit of hatred, because it is evil in all the deeds of men.'
translation:
  language: pt
  text: E agora ouçam uma palavra de verdade, para praticarem a justiça e cumprirem toda lei do Altíssimo. E não se deixem desviar, filhos, pelo espírito do ódio, pois ele é mau em todas as ações humanas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: uma palavra de verdade
  rationale: Preserva a expressão grega e seu tom solene sem transformá-la em uma afirmação abstrata como «a verdade».
- source_word: ποιεῖν δικαιοσύνην
  choice: praticarem a justiça
  rationale: Expressa naturalmente a ideia semítica e grega de fazer o que é justo.
- source_word: πάντα νόμον ὑψίστου
  choice: cumprirem toda lei do Altíssimo
  rationale: «Cumprir» é mais idiomático em português com «lei» do que «praticar»; «toda lei» mantém o singular distributivo de νόμον e o alcance de πάντα.
- source_word: πλανᾶσθε
  choice: se deixem desviar
  rationale: A forma passiva admite a ideia de ser desencaminhado; a formulação portuguesa conserva essa agência sem acrescentar um agente não expresso.
- source_word: τῷ πνεύματι τοῦ μίσους
  choice: pelo espírito do ódio
  rationale: Mantém literalmente «espírito» e não decide se a expressão indica um ser espiritual, uma influência ou uma disposição interior.
- source_word: ἐπὶ πάσαις ταῖς πράξεσι τῶν ἀνθρώπων
  choice: em todas as ações humanas
  rationale: Reproduz o alcance geral da frase grega em português atual e inclusivo, sem restringir ἀνθρώπων ao sexo masculino.
theological_decisions:
- issue: Natureza do «espírito do ódio»
  choice: Conservar «espírito do ódio» sem explicação no texto
  alternative: Interpretar como «atitude de ódio» ou como um espírito maligno pessoal
  rationale: O grego não resolve se πνεῦμα é pessoal, sobrenatural ou disposicional; a tradução preserva essa ambiguidade.
- issue: Relação do espírito do ódio com as ações humanas
  choice: «ele é mau em todas as ações humanas»
  alternative: «ele torna más todas as ações humanas»
  rationale: A alternativa introduziria uma relação causal que não está explicitada no grego; a redação escolhida conserva a formulação ampla e tensa do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativos no plural. A coordenação foi levemente explicitada com «praticarem» e «cumprirem» para evitar a combinação pouco idiomática «praticar uma lei», sem alterar os dois objetos do infinitivo grego.
