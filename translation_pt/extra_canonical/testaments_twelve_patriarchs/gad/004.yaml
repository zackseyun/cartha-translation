  text: Therefore guard yourselves[a], my children, from hatred, because it works lawlessness even against the Lord himself. For it does not want to hear the words of his commandments concerning love of one's neighbor, and it sins against God. For if a brother falls, it is eager at once to report it to everyone, and it hastens that he may be judged and punished and die. And if it is some slave, it brings accusations against him before his master, and in every distress it rejoices over him, if perhaps he may be put to death. For hatred works together with envy also against those who prosper; hearing of their success and seeing it, it is always weakened. Just as love would even make the dead alive and would call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned only a little to live. For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through
    longsuffering[c][b], works together with the law of God for the salvation of men.
translation:
  language: pt
  text: '**Testamento de Gade 4**


    1 Portanto, meus filhos, guardem-se do ódio, pois ele pratica a injustiça até contra o próprio Senhor. 2 Ele não quer ouvir as palavras dos mandamentos do Senhor a respeito do amor ao próximo e peca contra Deus. 3 Pois, se um irmão cai, o ódio se apressa a contar isso imediatamente a todos e procura fazer com que ele seja julgado, castigado e morra. 4 Se for algum escravo, o ódio o denuncia ao seu senhor[a] e se alegra com todas as aflições dele, na esperança de que talvez seja morto. 5 Pois o ódio coopera com a inveja até contra os que prosperam; ao ouvir e ver o progresso deles, sempre desfalece. 6 Assim como o amor quer até dar vida aos mortos e chamar de volta os que estão sob sentença de morte, também o ódio quer matar os vivos e não quer que vivam os que pecaram em coisa pequena[b]. 7 Pois o espírito do ódio, por meio da fraqueza de ânimo[c], coopera em tudo com Satanás para a morte dos seres humanos; mas o espírito do amor, com paciência perseverante[d], coopera com a lei de Deus
    para a salvação dos seres humanos.


    [a] Ou: “volta-o contra o seu senhor”. A expressão grega pode indicar uma denúncia hostil feita diante de alguém que tem autoridade.


    [b] Ou: “os que pecaram apenas um pouco”. O grego admite tanto uma referência à pequena gravidade da falta quanto à pequena medida do pecado.


    [c] A expressão grega também pode significar “desânimo”, “pusilanimidade” ou “covardia”.


    [d] Traduz um termo que também pode ser vertido por “longanimidade”: a disposição de suportar por muito tempo sem ceder à ira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “volta-o contra o seu senhor”. A expressão grega pode indicar uma denúncia hostil feita diante de alguém que tem autoridade.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “os que pecaram apenas um pouco”. O grego admite tanto uma referência à pequena gravidade da falta quanto à pequena medida do pecado.'
    reason: lexical_ambiguity
  - marker: c
    text: A expressão grega também pode significar “desânimo”, “pusilanimidade” ou “covardia”.
    reason: lexical_ambiguity
  - marker: d
