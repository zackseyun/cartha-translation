    reason: lexical_alternative
lexical_decisions:
- source_word: μῖσος
  choice: ódio
  rationale: Mantém o substantivo abstrato como força moral personificada e preserva o tema dominante do capítulo.
- source_word: ἀνομίαν ποιεῖ
  choice: pratica a injustiça
  rationale: Expressa a ação moral do idioma grego em português natural sem reduzir ἀνομία a uma infração meramente jurídica.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: as palavras dos mandamentos do Senhor
  rationale: Conserva os dois substantivos do grego e torna explícito, sem ambiguidade referencial em português, que os mandamentos pertencem ao Senhor mencionado no versículo anterior.
- source_word: ἀγάπης τοῦ πλησίον
  choice: amor ao próximo
  rationale: Emprega a formulação bíblica corrente em português e preserva claramente o objeto do amor.
- source_word: σπουδάζει εὐθὺς ἀναγγεῖλαι τοῖς πᾶσιν
  choice: se apressa a contar isso imediatamente a todos
  rationale: Reproduz tanto a prontidão maliciosa quanto a divulgação pública da queda do irmão.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva a condição social explícita de alguém submetido a um senhor, sem suavizá-la como simples serviço.
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: o denuncia ao seu senhor
  rationale: O contexto aponta para uma ação hostil perante uma autoridade com vistas à punição; a nota registra outra leitura possível da construção.
- source_word: ἐπιχαίρει αὐτῷ
  choice: se alegra com todas as aflições dele
  rationale: Mantém a alegria moralmente perversa diante do sofrimento alheio, sem intensificá-la para 'tripudia'.
- source_word: ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: os que pecaram em coisa pequena
  rationale: Preserva a ambiguidade entre uma falta de pequena gravidade e uma pequena medida de pecado; a nota apresenta a alternativa.
- source_word: ὀλιγοψυχία
  choice: fraqueza de ânimo
  rationale: Formulação compreensível que conserva a ideia literal de pequenez ou debilidade de alma sem escolher definitivamente entre desânimo, covardia e pusilanimidade.
- source_word: μακροθυμία
  choice: paciência perseverante
  rationale: Comunica em linguagem corrente a capacidade de suportar por longo tempo; a nota conserva o equivalente tradicional 'longanimidade'.
theological_decisions:
- issue: Personificação do ódio e do amor como forças ativas
  choice: Manter o ódio e o amor como sujeitos de ações intencionais, culminando em “espírito do ódio” e “espírito do amor”.
  alternative: Tratá-los apenas como disposições psicológicas impessoais.
  rationale: O texto grego passa dos substantivos abstratos à linguagem explícita de πνεῦμα. A personificação preserva a tensão moral e espiritual sem definir uma ontologia específica para esses espíritos.
- issue: Linguagem vivificadora do amor
  choice: Conservar “dar vida aos mortos” e “chamar de volta os que estão sob sentença de morte”.
  alternative: Parafrasear como mero esforço para ajudar ou salvar pessoas em perigo.
  rationale: As imagens fortes do grego podem funcionar como hipérbole ética, mas também evocam vida e morte em sentido mais amplo; a tradução não decide entre essas possibilidades.
- issue: Cooperação dos espíritos com Satanás e com a lei de Deus
  choice: Traduzir diretamente a estrutura paralela “coopera ... com Satanás” e “coopera com a lei de Deus”.
  alternative: Explicar o espírito do amor como cooperação direta com Deus.
  rationale: 'A assimetria está no próprio texto: Satanás aparece como agente pessoal, enquanto o outro polo é a lei de Deus. Preservá-la evita harmonização teológica indevida.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “o ódio” em pontos estratégicos esclarece o referente personificado sem desfazer o paralelismo. “Seres humanos” traduz ἄνθρωποι de modo inclusivo e atual. As notas limitam-se a ambiguidades lexicais relevantes.
