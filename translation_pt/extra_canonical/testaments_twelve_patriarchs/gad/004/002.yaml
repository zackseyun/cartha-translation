source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Οὐ γὰρ θέλει ἀκούειν Γλόγων⁵ ἐντολῶν⁶ αὐτοῦ περὶ ἀγάπης *τοῦ πλησίον⁷* *Γκαὶ¹ εἰς Θεὸν ἁμαρτάνει⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/002.yaml
  text: For it does not want to hear the words of his commandments concerning love for his neighbor, and it sins against God.
translation:
  language: pt
  text: Pois ele não quer ouvir as palavras dos mandamentos de Deus acerca do amor ao próximo e peca contra Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλει ἀκούειν
  choice: quer ouvir
  rationale: Reproduz de modo natural a ideia volitiva do grego, sem enfraquecê-la para simples recusa de obediência.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: as palavras dos mandamentos de Deus
  rationale: Mantém os dois substantivos do texto grego. O referente de αὐτοῦ é explicitado como Deus para evitar, em português, uma referência pronominal obscura.
- source_word: περὶ ἀγάπης τοῦ πλησίον
  choice: acerca do amor ao próximo
  rationale: Formulação corrente e digna em português, preservando o sentido de amor dirigido ao próximo.
- source_word: εἰς Θεὸν ἁμαρτάνει
  choice: peca contra Deus
  rationale: Equivalência idiomática direta da construção grega com εἰς.
theological_decisions:
- issue: Referente do pronome em ἐντολῶν αὐτοῦ
  choice: Deus
  alternative: seus mandamentos
  rationale: O contexto imediato associa a rejeição dos mandamentos ao pecado contra Deus; explicitar o referente produz português claro sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, claro e digno, de leitura natural no Brasil e compreensível internacionalmente. O sujeito masculino singular foi mantido, em continuidade com o contexto, por meio de «ele».
