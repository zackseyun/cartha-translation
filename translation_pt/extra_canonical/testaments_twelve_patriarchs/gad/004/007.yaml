id: T12P.GAD.4.7
reference: Testament of Gad 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Τὸ γὰρ πνεῦμα τοῦ μίσους *διὰ τῆς²⁹ ὀλιγοψυχίας συνεργεῖ τῷ Σατανᾷ ἐν πᾶσιν εἰς θάνατον τῶν ἀνθρώπων, τὸ δὲ πνεῦμα τῆς ἀγάπης *ἐν μακροθυμίᾳ³⁰ συνεργεῖ *τῷ νόμῳ³¹ τοῦ Θεοῦ εἰς σωτηρίαν τῶν³² ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/007.yaml
  text: For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through longsuffering, works together with the law of God for the salvation of men.
translation:
  language: pt
  text: Pois o espírito do ódio, por meio do desânimo, coopera em tudo com Satanás para a morte das pessoas; mas o espírito do amor, por meio da paciência, coopera com a lei de Deus para a salvação das pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοψυχίας
  choice: desânimo
  rationale: Expressa a falta de ânimo ou abatimento indicada pelo termo grego, de modo natural em português, sem restringi-lo à ideia moderna de covardia.
- source_word: συνεργεῖ
  choice: coopera
  rationale: Mantém a noção explícita de agir ou trabalhar em conjunto, tanto com Satanás quanto com a lei de Deus.
- source_word: μακροθυμίᾳ
  choice: paciência
  rationale: Termo corrente e digno que comunica constância paciente e tolerância prolongada; evita o pouco natural «longanimidade» no texto principal.
- source_word: ἀνθρώπων
  choice: pessoas
  rationale: Representa o plural genérico referente aos seres humanos sem sugerir que o enunciado se limite ao sexo masculino.
theological_decisions:
- issue: A relação do espírito do amor com a lei de Deus
  choice: coopera com a lei de Deus
  alternative: age de acordo com a lei de Deus
  rationale: A tradução conserva a construção simétrica e potencialmente tensa de συνεργεῖ com o dativo, sem explicar ou suavizar a personificação da lei.
- issue: Finalidade ou resultado de εἰς θάνατον / εἰς σωτηρίαν
  choice: para a morte / para a salvação
  alternative: resultando na morte / resultando na salvação
  rationale: «Para» preserva a abertura semântica de εἰς entre direção, finalidade e resultado, em vez de decidir a relação de modo mais específico.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado entre «espírito do ódio» e «espírito do amor», bem como entre morte e salvação. A pontuação mantém as duas metades antitéticas em um único período.
