base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/001.yaml
  text: Therefore guard yourselves, my children, from hatred, because it even commits lawlessness against the Lord himself.
translation:
  language: pt
  text: Portanto, meus filhos, guardem-se do ódio, pois ele pratica iniquidade até contra o próprio Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: guardem-se
  rationale: Expressa de modo natural a ordem reflexiva de estar alerta e proteger-se de algo.
- source_word: μίσους
  choice: ódio
  rationale: Equivalente direto e corrente para o substantivo que designa ódio.
- source_word: ἀνομίαν ποιεῖ
  choice: pratica iniquidade
  rationale: Preserva a ideia de agir contra a lei ou a ordem justa, mantendo o registro moral e religioso do grego.
- source_word: καὶ εἰς αὐτὸν τὸν Κύριον
  choice: até contra o próprio Senhor
  rationale: 'Mantém a força enfática da expressão: o ódio chega a dirigir sua iniquidade contra o próprio Senhor.'
theological_decisions:
- issue: O ódio como sujeito de ποιεῖ
  choice: Manter o ódio personificado por meio do pronome “ele”
  alternative: Reformular como “quem odeia pratica iniquidade”
  rationale: O grego apresenta o ódio como antecedente conceitual do verbo no singular; a personificação preserva a forma e a tensão retórica do texto sem identificar o sujeito com quem odeia.
translation_notes:
  register: Português moderno, claro e digno, com colocação natural de “meus filhos” e preservação da personificação retórica do ódio.
