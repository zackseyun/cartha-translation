source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. ΓἘὰν γὰρ πέσῃ ὁ ἀδελφός⁹, *σπουδάζει εὐθὺς¹⁰ ἀναγγεῖλαι τοῖς¹¹ πᾶσιν, καὶ σπεύδει *περὶ αὐτοῦ ἵνα κριθεὶς¹² καὶ κολασθεὶς ἀποθάνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/003.yaml
  text: For if a brother falls, it is eager at once to report it to everyone, and it hastens concerning him so that, having been judged and punished, he may die.
translation:
  language: pt
  text: Pois, se um irmão cair, o ódio logo se empenha em contar isso a todos e age depressa a respeito dele, para que, julgado e castigado, morra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέσῃ
  choice: cair
  rationale: Preserva a amplitude da metáfora grega, que pode indicar queda moral ou transgressão, sem especificar além do texto.
- source_word: σπουδάζει εὐθὺς
  choice: logo se empenha
  rationale: Exprime tanto a prontidão de εὐθύς como o zelo ou empenho de σπουδάζει em português natural.
- source_word: ἀναγγεῖλαι τοῖς πᾶσιν
  choice: contar isso a todos
  rationale: Comunica de modo corrente a ideia de divulgar ou denunciar a queda perante todos; “isso” explicita naturalmente o objeto implícito no grego.
- source_word: σπεύδει περὶ αὐτοῦ
  choice: age depressa contra ele
  rationale: O grego significa literalmente que se apressa a respeito dele; no contexto hostil, “contra ele” torna inteligível a direção adversa da ação sem eliminar a ideia de urgência.
- source_word: κριθεὶς καὶ κολασθεὶς
  choice: depois de julgado e castigado
  rationale: Mantém a sequência dos particípios aoristos passivos como ações anteriores à morte.
- source_word: ἀποθάνῃ
  choice: morra
  rationale: 'O subjuntivo após ἵνα expressa o desfecho pretendido: que ele morra.'
theological_decisions:
- issue: Referente do sujeito implícito de σπουδάζει e σπεύδει
  choice: “ele”, retomando o referente masculino do contexto anterior, provavelmente o ódio
  alternative: Repetir explicitamente “o ódio” ou empregar uma construção impessoal
  rationale: O versículo grego não repete o sujeito. O pronome preserva essa coesão contextual sem inserir no próprio versículo um substantivo ausente da fonte fornecida.
- issue: Valor de ἵνα na oração final
  choice: 'finalidade: “para que ... morra”'
  alternative: 'resultado: “de modo que ... morra”'
  rationale: A construção favorece propósito, mas a formulação portuguesa ainda permite perceber o desfecho visado sem elaborar uma motivação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. Evitou-se linguagem jurídica excessivamente técnica; “julgado e castigado” conserva o paralelismo e a força do grego.
