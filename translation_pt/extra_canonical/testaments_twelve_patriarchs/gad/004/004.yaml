source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ *δοῦλός τις ᾖ¹³, συμβαλεῖ¹⁴ αὐτὸν πρὸς τὸν κύριον αὐτοῦ, καὶ ἐν πάσῃ θλίψει¹⁵ *ἐπιχαίρει αὐτῷ¹⁶, εἴπως¹⁷ θανατωθῇ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/004.yaml
  text: And if someone is a slave, it slanders him to his master, and in every distress it rejoices over him, if perhaps he may be put to death.
translation:
  language: pt
  text: E, se alguém for escravo, o ódio o difama perante seu senhor e se alegra em toda aflição dele, na expectativa de que talvez seja morto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: Expressa diretamente a condição jurídica e social indicada pelo termo grego, sem suavizá-la para “servo”.
- source_word: συμβαλεῖ ... πρὸς τὸν κύριον αὐτοῦ
  choice: o difama perante seu senhor
  rationale: Neste contexto hostil, o verbo indica agir contra a pessoa por meio de acusações dirigidas ao seu senhor; “difama” preserva o sentido adotado pela camada inglesa e soa natural em português.
- source_word: ἐν πάσῃ θλίψει ἐπιχαίρει αὐτῷ
  choice: se alegra com cada aflição que lhe sobrevém
  rationale: Traduz a alegria maliciosa diante do sofrimento alheio e evita a leitura equivocada de que o ódio se alegra junto com a vítima.
- source_word: εἴπως θανατωθῇ
  choice: para ver se ele acaba sendo morto
  rationale: “Para ver se” conserva a ideia de expectativa ou propósito incerto de εἴπως, enquanto a forma passiva mantém o sentido de θανατωθῇ.
theological_decisions:
- issue: Sujeito implícito dos verbos
  choice: o ódio
  alternative: ele/isso
  rationale: O grego omite o sujeito por continuidade com o contexto anterior, no qual o ódio é o agente. Torná-lo explícito em português evita um pronome sem antecedente dentro do versículo, sem acrescentar uma interpretação denominacional.
- issue: Grau de certeza da morte desejada
  choice: para ver se ele acaba sendo morto
  alternative: para que seja morto
  rationale: A formulação escolhida preserva a nuance eventual e incerta de εἴπως, em vez de convertê-la em finalidade certa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção explicita o sujeito recuperado do contexto e mantém tanto a dureza de “escravo” quanto a expectativa incerta do desfecho mortal.
