revisions:
- from: E, se alguém for escravo, o ódio o difama perante seu senhor e se alegra com cada aflição que lhe sobrevém, para ver se ele acaba sendo morto.
  to: E, se alguém for escravo, o ódio o difama perante seu senhor e se alegra em toda aflição dele, na expectativa de que talvez seja morto.
  rationale: A revisão preserva as escolhas centrais do rascunho, mas substitui a finalidade mais explícita e o aspecto adicional de «acaba sendo morto» por uma construção que comunica a expectativa incerta do grego εἴπως. Também torna mais direta a relação entre o escravo e suas aflições.
