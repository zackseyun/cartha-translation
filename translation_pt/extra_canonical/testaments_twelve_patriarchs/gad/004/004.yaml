review_pass:
  verdict: revise
  source_fidelity: A tradução identifica corretamente o sujeito contextual como «o ódio», preserva «escravo» para δοῦλος e reproduz adequadamente a denúncia hostil perante o senhor. Contudo, «para ver se» apresenta εἴπως sobretudo como finalidade deliberada e «acaba sendo morto» introduz uma ideia aspectual de desfecho que o grego não expressa. A formulação revista conserva melhor a expectativa incerta indicada por εἴπως e a passiva de θανατωθῇ.
  naturalness: O texto é claro e de registro moderno. «Em toda aflição dele» evita a possível leitura, em «se alegra com cada aflição que lhe sobrevém», de que o ódio se alegra juntamente com o escravo, e permanece natural em português internacional.
  terminology: «Escravo», «senhor» e «difama» são escolhas adequadas ao quadro social e ao tom hostil do original. A explicitação de «o ódio» é justificável pelo contexto imediato e não acrescenta conteúdo doutrinal.
  issues:
  - severity: medium
    issue: «para ver se ele acaba sendo morto» para εἴπως θανατωθῇ
    rationale: «Para ver se» tende a converter a oração em propósito, enquanto εἴπως retém a modalidade de expectativa/incerteza («se talvez»). Além disso, «acaba sendo» acrescenta a noção de resultado final, ausente do aoristo passivo grego.
  - severity: low
    issue: «com cada aflição que lhe sobrevém» para ἐν πάσῃ θλίψει ἐπιχαίρει αὐτῷ
    rationale: 'A redação é compreensível, mas pode sugerir que o ódio se alegra com as aflições como tais. «Em toda aflição dele» mantém mais de perto a construção grega: o ódio se alegra à custa dele em cada situação de aflição.'
  revised_text: E, se alguém for escravo, o ódio o difama perante seu senhor e se alegra em toda aflição dele, na expectativa de que talvez seja morto.
  revised_footnotes: []
  revision_rationale: A revisão preserva as escolhas centrais do rascunho, mas substitui a finalidade mais explícita e o aspecto adicional de «acaba sendo morto» por uma construção que comunica a expectativa incerta do grego εἴπως. Também torna mais direta a relação entre o escravo e suas aflições.
