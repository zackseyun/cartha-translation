base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/005.yaml
  text: For hatred works together with envy, even against those who prosper; hearing and seeing them in their progress, it is always weakened.
translation:
  language: pt
  text: 5 Pois o ódio coopera com a inveja contra os que prosperam; ao ouvir e ver o progresso deles, sempre definha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'No grego, os particípios são masculinos, literalmente “ouvindo e vendo”, mas μῖσος (“ódio”) é neutro. A construção pode apontar para uma pessoa dominada pelo ódio e pela inveja: “ao ouvir e ver o progresso deles, essa pessoa sempre definha”.'
    reason: Preserva a dificuldade sintática e a ambiguidade do grego sem atribuir gênero feminino à pessoa implícita nem confundir o gênero grego de μῖσος com o português.
lexical_decisions:
- source_word: φθόνῳ
  choice: inveja
  rationale: Mantém a distinção do grego entre a inveja e o ódio, apresentados como forças que atuam juntas.
- source_word: εὐπραγούντων
  choice: os que prosperam
  rationale: Expressa naturalmente aqueles que estão indo bem ou obtendo sucesso.
- source_word: ἐν προκοπῇ
  choice: do progresso deles
  rationale: O substantivo indica avanço ou progresso; o possessivo explicita em português o referente implícito.
- source_word: ἀσθενεῖ
  choice: definha
  rationale: O verbo é intransitivo e significa enfraquecer, perder vigor ou adoecer; “definha” preserva a imagem sem convertê-lo numa passiva.
theological_decisions:
- issue: Sujeito da oração final
  choice: Mantém-se “o ódio” como referente contextual de “sempre definha”
  alternative: Entender como sujeito implícito a pessoa invejosa ou dominada pelo ódio
  rationale: O substantivo “ódio” é o sujeito explícito da oração principal e a leitura corresponde ao fluxo do período, embora os particípios gregos no masculino criem uma dificuldade gramatical real, registrada em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Coopera” conserva a personificação do ódio e da inveja; “definha” comunica o enfraquecimento contínuo sugerido pelo verbo grego.
