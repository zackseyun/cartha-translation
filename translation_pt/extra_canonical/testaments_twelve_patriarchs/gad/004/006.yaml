source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὥσπερ²³ ἡ ἀγάπη Γκαὶ¹ τοὺς νεκροὺς *θέλει ζωοποιῆσαι²⁴ καὶ τοὺς ἐν²⁵ ἀποφάσει θανάτου θέλει²⁶ ἀνακαλέσασθαι, οὕτως καὶ²⁷ τὸ μῖσος τοὺς ζῶντας θέλει ἀποκτεῖναι, καὶ *τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας²⁸ οὐ θέλει ζῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/006.yaml
  text: Just as love wants to make the dead alive and to call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned in a little matter to live.
translation:
  language: pt
  text: Assim como o amor quer dar vida aos mortos e chamar de volta os que estão sob sentença de morte, também o ódio quer matar os vivos e não quer que vivam os que pecaram em algo de pouca importância.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγάπη
  choice: amor
  rationale: Equivalente direto e natural, preservando o contraste ético com o ódio.
- source_word: θέλει ζωοποιῆσαι
  choice: quer dar vida
  rationale: Mantém o sentido volitivo de θέλει e expressa ζωοποιῆσαι em português corrente, sem acrescentar a ideia de ressurreição de modo mais específico que o grego.
- source_word: ἀνακαλέσασθαι
  choice: chamar de volta
  rationale: Conserva a imagem de convocar ou trazer alguém de volta, sem substituir o verbo por uma interpretação teológica mais definida.
- source_word: ἐν ἀποφάσει θανάτου
  choice: sob sentença de morte
  rationale: Expressa com clareza a condição jurídica indicada pela frase grega.
- source_word: μῖσος
  choice: ódio
  rationale: Equivalente direto, em contraste paralelo com ἀγάπη.
- source_word: ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: os que pecaram em coisa pequena
  rationale: Preserva a formulação pouco específica do grego, que pode indicar pecado em assunto de pouca importância ou uma falta pequena, sem a tornar mais precisa do que o original.
theological_decisions:
- issue: O desejo do amor de vivificar os mortos
  choice: quer dar vida aos mortos
  alternative: ressuscitaria os mortos
  rationale: A tradução escolhida preserva tanto a força volitiva repetida de θέλει quanto a amplitude de ζωοποιῆσαι, evitando transformar a afirmação em uma formulação técnica sobre ressurreição.
- issue: A extensão da falta em ἐν ὀλίγῳ
  choice: pecaram em coisa pequena
  alternative: pecaram um pouco
  rationale: A construção grega admite alguma tensão entre uma falta em assunto pequeno e uma falta de pequena medida; a redação escolhida acompanha mais de perto a forma locativa do texto sem resolver inteiramente sua abrangência moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A estrutura comparativa e a repetição de «quer» foram mantidas para preservar o paralelismo retórico do grego.
