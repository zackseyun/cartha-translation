  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008.yaml
  text: 'Say these things[a], you also, to your children:


    that they honor Levi and Judah; for from them the Lord will raise up salvation for Israel.

    And tell them concerning Joseph, that they should love him, because in every affliction he was innocent,

    and he kept the commandment of God, not returning evil for evil.

    For he suffered much from his brothers, yet he loved them,

    and though they plotted against him, he spoke peaceably to them.


    And now, my children, I command you: love one another from the heart,

    and if anyone sins against you, speak peaceably to him, and in your soul hold no deceit;

    and if he confesses and repents, forgive him.

    But if he denies it, do not become heated in argument with him,

    lest, after taking in poison[b], he begin to swear and so commit a double sin.

    If anyone prospers beyond you, do not be grieved;

    but pray also for him, that he may be made complete in every good thing.


    If anyone is glorified, do not envy him;

    if anyone is enriched, do not be jealous.

    Bless the Lord who gives good things to all,

    because the poor man, if he is free from envy, is rich before the Lord.

    Do not hate a beautiful woman because of her appearance,

    and do not hate a man because of the abundance of his glory.

    For God gives the good things of the earth to whom he wills.


    Seek uprightness in your own works,

    and pray for your neighbor, so that if he prospers in every good thing, you may not be jealous.

    For the one who is jealous is always in turmoil,

    and the one who hates is always darkened.

    Love one another in deed and in word and in the intention of the soul.

    For I also spoke peaceably with Joseph, but in my heart I intended to kill him.

    The spirit of hatred is evil, because it is never at peace with men;

    it always desires their downfall.

    It weakens the body and disturbs the soul,

    and it puts wrath upon the mind.


    Therefore, if anyone does evil to you, do good to him,

    and pray for him; and you will be redeemed by the Lord from every evil.

    For if anyone prospers, and if he is shameless or lawless, do not be jealous;

    but wait for the end from the Lord.

    For either he receives his reward in this life,

    or, if he is kept for punishment, he will be repaid in the judgment.

    And if a poor man prospers and is without envy, even if he is not rich,

    he is blessed beyond all men, because he has the treasure that does not perish.

    Therefore cast away hatred[c], and love one another in uprightness of heart.'
translation:
  language: pt
  text: '**Testamento de Gade 8**


    **1** Digam também estas coisas a seus filhos, para que honrem Judá e Levi, pois deles o Senhor fará surgir salvação para vocês, para Israel.[a]


    **2** Pois eu sei que os filhos de vocês se afastarão dele[b] e, em toda espécie de maldade, aflição e corrupção, ficarão longe do Senhor.


    **3** Depois de ficar em silêncio por um instante, ele disse novamente: “Meus filhos, obedeçam a seu pai e sepultem-me perto de meus antepassados.”


    **4** Então recolheu os pés e adormeceu em paz.


    **5** Cinco anos depois, levaram-no para Hebrom e o colocaram junto de seus antepassados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega pode ser entendida como “salvação para vocês, isto é, para Israel” ou simplesmente “salvação para Israel”.
    reason: syntactical_ambiguity
  - marker: b
    text: O referente mais provável de “dele” é o Senhor, embora o pronome grego não o repita explicitamente.
    reason: referential_ambiguity
lexical_decisions:
- source_word: τιμήσωσιν
  choice: honrem
  rationale: Expressa respeito elevado sem transformar a honra prestada a Judá e Levi em culto.
- source_word: ἀνατελεῖ ... σωτηρίαν
  choice: fará surgir salvação
  rationale: Preserva a imagem verbal de algo que nasce ou desponta e mantém o peso teológico de σωτηρία.
- source_word: ἀποστήσονται
  choice: se afastarão
  rationale: Reproduz a ideia de abandono ou separação sem especificar além do texto a natureza desse afastamento.
- source_word: κακώσει
  choice: aflição
  rationale: Termo amplo que pode indicar sofrimento, opressão ou condição miserável; 'aflição' mantém essa amplitude no contexto.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Mantém o eufemismo tradicional do texto para a morte, sem substituí-lo pela interpretação explícita 'morreu'.
- source_word: τῶν πατέρων
  choice: antepassados
  rationale: No contexto de sepultamento ancestral, comunica naturalmente o sentido coletivo de 'pais' em português moderno.
theological_decisions:
- issue: A salvação que surge de Judá e Levi
  choice: “deles o Senhor fará surgir salvação”
  alternative: “deles surgirá a salvação do Senhor”
  rationale: Mantém o Senhor como sujeito expresso do verbo e não define se a expectativa se refere genericamente às linhagens real e sacerdotal ou a um cumprimento messiânico específico.
- issue: Referente de αὐτοῦ em 8.2
  choice: “se afastarão dele”, com nota sobre o referente provável
  alternative: “se afastarão do Senhor”
  rationale: O pronome grego é formalmente ambíguo; embora 'o Senhor' seja o referente mais provável, o texto principal preserva a forma pronominal em vez de resolver silenciosamente a questão.
- issue: “Adormeceu” como descrição da morte
  choice: preservado como “adormeceu em paz”
  alternative: “morreu em paz”
  rationale: Conserva a metáfora do original sem extrair dela uma formulação doutrinária mais específica sobre o estado dos mortos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento no plural naturais para leitores brasileiros. A tradução segue o texto grego fornecido, inclusive a ordem “Judá e Levi”, e não incorpora o material extenso da camada inglesa que não aparece neste capítulo grego.
