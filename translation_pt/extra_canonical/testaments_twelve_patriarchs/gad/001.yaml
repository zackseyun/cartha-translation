    **4.** Meu irmão José pastoreou conosco por até trinta dias; mas, como ainda era jovem, ficou enfraquecido pelo calor intenso.


    **5.** Então voltou a Hebrom, para junto de nosso pai, que o fez reclinar-se ao seu lado, porque o amava muito.


