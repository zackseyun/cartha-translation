  text: '1[a]. And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and with the intention of the soul.


    2. For I myself, in my father’s presence, spoke peaceably to Joseph; but when I went out from his presence, the spirit of hatred darkened my mind and disturbed my understanding so that I wanted to kill him.


    3. Love one another from the heart; and if anyone sins against you[b], speak peace to him, and in your soul hold no deceit; and if he confesses and changes his mind, forgive him.


    4. But if he denies it, do not contend with him, lest, when he swears an oath, you sin doubly.


    5. Do not let a stranger hear your secret in a quarrel, lest, hating you, he become your enemy and commit a great sin against you; for many times he either kills by treachery or entangles you in evils, having taken in from you the poison.


    6. But if he denies it and is ashamed when reproved, be still and do not reprove him further. For the one who denies it repents of having done wrong against you, so as not to wrong you again, and, being afraid, makes peace.


    7. But even if he is shameless and persists in his wrongdoing, even so forgive him from the heart[c], and leave vengeance to God.'
translation:
  language: pt
  text: '1. E agora, meus filhos, eu os exorto: que cada um ame o seu próximo e retire o ódio dos seus corações. Amem uns aos outros por atos, palavras e pelo propósito da alma.


    2. Pois eu mesmo, na presença de meu pai, falava pacificamente com José; mas, ao sair de junto dele, o espírito de ódio escureceu minha mente e perturbou meus pensamentos, levando-me a querer matá-lo.


    3. Amem uns aos outros de coração. Se alguém pecar contra você, fale com ele em paz[a] e não guarde engano em sua alma. Se ele confessar e mudar de atitude, perdoe-lhe.


    4. Mas, se ele negar, não entre em discussão com ele, para que, se ele jurar, você não peque duas vezes.


    5. Não permita que um estranho ouça o seu segredo durante uma disputa[b], para que ele não passe a odiar você, torne-se seu inimigo e cometa um grande pecado contra você. Pois muitas vezes ele o mata à traição ou o envolve em males, por ter recebido de você o veneno.


    6. Mas, se ele negar e ficar envergonhado ao ser repreendido, fique em silêncio e não continue a repreendê-lo. Pois aquele que nega se arrepende de ter cometido uma falta contra você e, tomado de medo, faz as pazes.[c]


    7. Mas, ainda que ele seja descarado e persista na maldade, mesmo assim perdoe-lhe de coração e deixe a vingança nas mãos de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há variação textual no versículo 3 quanto à formulação “fale com ele em paz” e à posição de “não guarde engano em sua alma”. O sentido geral — falar pacificamente sem alimentar falsidade interior — permanece seguro.
    reason: textual_variant
  - marker: b
    text: O texto do versículo 5 é difícil. A advertência parece ser contra revelar um assunto particular durante uma disputa, pois um terceiro pode absorver o “veneno” do ódio e agir com hostilidade ou traição.
    reason: textual_variant
  - marker: c
    text: Algumas testemunhas diferem no versículo 6 quanto às palavras sobre o medo e a mudança daquele que nega a falta. O sentido geral é que sua vergonha pode fazê-lo abandonar a ofensa e buscar a paz.
    reason: textual_variant
lexical_decisions:
- source_word: παραινῶ
  choice: eu os exorto
  rationale: Preserva a força de uma séria exortação testamentária, em português claro e digno.
- source_word: πλησίον
  choice: próximo
  rationale: É o termo ético consagrado e mantém o sentido interpessoal do grego.
- source_word: ἐξάρατε τὸ μῖσος
  choice: retire o ódio
  rationale: Comunica a remoção deliberada do ódio sem tornar a frase artificial.
- source_word: διανοίᾳ ψυχῆς
  choice: pelo propósito da alma
  rationale: Conserva a linguagem interior e relativamente incomum do grego, sem reduzi-la apenas a 'sinceramente'.
- source_word: εἰρηνικά
  choice: pacificamente
  rationale: Mantém o contraste entre a fala exterior pacífica e o ódio interior.
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: o espírito de ódio
  rationale: Preserva a personificação e a possível dimensão espiritual da expressão, sem defini-la além do texto.
- source_word: νοῦν / λογισμόν
  choice: mente / pensamentos
  rationale: Distingue de modo natural as duas faculdades ou atividades mentais mencionadas em paralelo.
- source_word: εἰπὲ αὐτῷ εἰρήνην / ἐν εἰρήνῃ
  choice: fale com ele em paz
  rationale: Expressa de modo idiomático o apelo a uma abordagem pacífica e mantém a imagem da paz.
- source_word: δόλον
  choice: engano
  rationale: Abrange falsidade e intenção traiçoeira interior em linguagem compreensível.
- source_word: μετανοήσας
  choice: mudar de atitude
  rationale: No contexto de conflito interpessoal, indica mudança interior demonstrada pela confissão, sem impor uma fórmula religiosa técnica.
- source_word: δολοφωνεῖ
  choice: mata à traição
  rationale: Reproduz diretamente a ideia de homicídio ou morte por meio traiçoeiro.
- source_word: ἐκδίκησιν
  choice: vingança
  rationale: Mantém o peso ético e judicial da palavra e a ordem de confiar a Deus a retribuição.
theological_decisions:
- issue: Natureza do 'espírito de ódio'
  choice: 'Manter a expressão literalmente aberta: ''o espírito de ódio'''
  alternative: Reduzir a expressão a 'o sentimento de ódio'
  rationale: O grego permite uma força moral personificada ou espiritual; a tradução não deve decidir que se trata apenas de uma emoção psicológica.
- issue: Sentido de μετανοήσας no versículo 3
  choice: mudar de atitude
  alternative: arrepender-se
  rationale: A confissão e a reversão da conduta em uma disputa pessoal estão em primeiro plano; a formulação preserva essa mudança sem excluir arrependimento moral.
- issue: A vingança no versículo 7
  choice: deixe a vingança nas mãos de Deus
  alternative: deixe a retribuição para Deus
  rationale: Preserva a tensão entre perdão humano e juízo divino, sem explicar como Deus exercerá a vingança.
- issue: Responsabilidade pelo juramento no versículo 4
  choice: para que, ao jurar, ele não leve você a pecar duas vezes
  alternative: para que, quando ele jurar, você não peque duas vezes
  rationale: A formulação esclarece minimamente a relação sintática difícil, mas conserva como destinatário da advertência aquele que prolonga a discussão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega 'você' no singular para refletir a passagem ao destinatário individual nos conselhos sobre conflitos, evitando arcaísmos como 'contender' e preservando expressões teologicamente abertas como 'espírito de ódio'.
