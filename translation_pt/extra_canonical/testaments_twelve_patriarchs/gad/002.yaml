lexical_decisions:
- source_word: Ὁμολογῶ
  choice: confesso
  rationale: Preserva o caráter penitencial e direto da admissão de Gad.
- source_word: ἁμαρτίαν
  choice: pecado
  rationale: Mantém o peso moral e religioso do termo grego, sem reduzi-lo a uma mera falta.
- source_word: ἀνελεῖν
  choice: matá-lo
  rationale: Expressa de modo claro e vigoroso a intenção homicida.
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: eu o odiava do fundo da alma
  rationale: Conserva a intensidade e a referência explícita à alma em português natural.
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: aumentei meu ódio contra ele
  rationale: Reproduz a ideia de acréscimo do ódio sem recorrer a uma construção artificial em português.
- source_word: ἐκλεῖξαι
  choice: eliminá-lo
  rationale: Comunica o valor idiomático no desejo de removê-lo da terra dos viventes; a nota e a comparação subsequente preservam o sentido concreto de “lamber por completo”.
- source_word: ἐκ γῆς ζώντων
  choice: da terra dos viventes
  rationale: Mantém a expressão bíblica tradicional, compreensível e solene.
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: a vegetação verde do campo
  rationale: Representa o plural neutro como crescimento vegetal sem restringi-lo especificamente a capim.
- source_word: ἐρρύσατο
  choice: livrou
  rationale: Termo corrente no registro bíblico para resgate de um perigo imediato.
- source_word: ἀνομίαν μεγάλην / ἀνόμημα
  choice: uma grande transgressão / uma transgressão
  rationale: Preserva a força jurídico-moral da família lexical de ἀνομία e a diferença de intensidade entre as duas formas.
- source_word: πλεονεξίᾳ
  choice: ganância
  rationale: Expressa de maneira direta o desejo ávido de ganho material indicado pelo contexto.
- source_word: ἐπληροφορήθημεν τῆς ἀναιρέσεως αὐτοῦ
  choice: ficamos plenamente resolvidos a matá-lo
  rationale: Transmite a ideia de determinação completa em relação à morte de José, em português idiomático.
theological_decisions:
- issue: Duas formas textuais divergentes sobre quem vendeu José e sobre o livramento divino
  choice: Apresentar integralmente as duas formas, em blocos separados, com nota explicativa
  alternative: Harmonizar as tradições em uma única narrativa ou escolher apenas uma delas
  rationale: O material grego fornecido preserva as duas tradições. Mantê-las visíveis respeita a evidência textual e não resolve artificialmente sua tensão.
- issue: Sentido da imagem com ἐκλεῖξαι e o bezerro
  choice: Traduzir idiomaticamente o primeiro uso como “eliminá-lo” e conservar literalmente a ação de lamber na comparação
  alternative: Repetir “lambê-lo por completo” no primeiro membro ou substituir toda a imagem por “consumi-lo”
  rationale: A solução mantém claro o propósito homicida em português e, ao mesmo tempo, não perde a imagem explícita que fundamenta a metáfora grega.
- issue: Força moral de ἀνομία e ἀνόμημα
  choice: Usar “transgressão”
  alternative: Usar “crime”, “maldade” ou “iniquidade”
  rationale: “Transgressão” conserva a dimensão de violação moral sem impor uma classificação jurídica moderna nem um jargão confessional específico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. Evitaram-se tanto arcaísmos como coloquialismos excessivos. A repetição e a numeração paralela foram mantidas para tornar visível a duplicidade textual.
