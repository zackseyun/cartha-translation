base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002.yaml
  text: '1 Therefore I confess my sin[a], children: many times I wanted to kill him, because I hated him from my soul. 2 And because of the dreams I added hatred toward him, and I wanted to wipe him out from the land of the living, as a calf licks up the green growth of the field. 3 But Judah sold him secretly to the Ishmaelites. 4 Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers. 4 And so, through greed, we were fully set on his murder. 5 But the God of my fathers rescued him from my hands[d][c][b], so that I might not commit a lawless deed in Israel.'
translation:
  language: pt
  text: '1 Portanto, confesso meu pecado, filhos[a]: muitas vezes quis matá-lo, porque eu o odiava do fundo da alma. 2 E, por causa dos sonhos, aumentei meu ódio contra ele e quis eliminá-lo[b] da terra dos viventes, assim como o bezerro lambe a vegetação verde do campo. 3 E Judá o vendeu secretamente aos ismaelitas.[c] 4 Assim, o Deus de nossos pais o livrou de nossas mãos, para que não cometêssemos uma grande transgressão em Israel.


    3 Por isso, Simeão e eu o vendemos aos ismaelitas por trinta peças de ouro[d]; depois de escondermos dez, mostramos vinte a nossos irmãos. 4 E assim, por causa da ganância, ficamos plenamente resolvidos a matá-lo. 5 Mas o Deus de meus pais o livrou de minhas mãos, para que eu não cometesse uma transgressão em Israel.


    [a] O capítulo preserva mais de uma forma textual do episódio da venda de José. Esta tradução apresenta as duas tradições, sem tentar harmonizá-las.


    [b] O verbo grego significa literalmente “lamber por completo” e também pode expressar a ideia de consumir ou eliminar. Aqui, “eliminá-lo” comunica o sentido no contexto, enquanto a comparação seguinte preserva a imagem concreta do bezerro lambendo a vegetação.


    [c] Alguns testemunhos atribuem a venda secreta a Judá; outra tradição textual diz: “Por isso, Simeão e eu o vendemos aos ismaelitas por trinta peças de ouro”.


    [d] “Trinta peças de ouro” traduz o texto grego desta tradição; a informação de que dez foram escondidas e vinte mostradas aos irmãos também pertence a essa forma textual.'
  philosophy: optimal-equivalence
