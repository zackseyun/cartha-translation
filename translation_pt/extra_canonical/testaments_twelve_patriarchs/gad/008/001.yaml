base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/001.yaml
  text: Speak these things, you also, to your children, so that they may honor Judah and Levi; for from them the Lord will raise up for you salvation for Israel.
translation:
  language: pt
  text: Digam também estas coisas aos seus filhos, para que honrem Judá e Levi, pois, deles, o Senhor fará surgir para vocês a salvação para Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção grega também pode ser entendida como: “o Senhor fará surgir dentre eles, para vocês, salvação para Israel”.'
    reason: O fragmento apresenta uma sequência sintaticamente difícil em ἐξ αὐτῶν ... ὑμῖν ... σωτηρίαν ... τῷ Ἰσραήλ, e os sinais críticos da edição indicam incerteza textual.
lexical_decisions:
- source_word: Εἴπατε
  choice: Digam
  rationale: Imperativo aoristo plural, vertido de modo direto e natural.
- source_word: τιμήσωσιν
  choice: honrem
  rationale: Preserva o sentido de demonstrar honra e respeito.
- source_word: ἀνατελεῖ
  choice: fará surgir
  rationale: Mantém a imagem de algo que desponta ou surge, sem limitar o referente a uma interpretação específica.
- source_word: σωτηρίαν
  choice: a salvação
  rationale: Equivalente corrente de σωτηρία, preservando sua amplitude teológica.
theological_decisions:
- issue: Relação de 'deles' com Judá e Levi
  choice: pois deles o Senhor fará surgir
  alternative: pois, dentre eles, o Senhor levantará
  rationale: Conserva o plural ἐξ αὐτῶν e a afirmação de origem sem explicar como Judá e Levi se relacionam com a salvação.
- issue: Construção 'para vocês ... para Israel'
  choice: para vocês a salvação para Israel
  alternative: para vocês, isto é, para Israel, a salvação
  rationale: Mantém a tensão e a possível dificuldade sintática do texto grego, sem identificar explicitamente os destinatários com Israel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem 'Judá e Levi' segue o grego fornecido; evitou-se acrescentar o material ausente da fonte.
