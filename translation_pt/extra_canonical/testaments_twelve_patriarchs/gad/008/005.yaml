base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/005.yaml
  text: And after five years they brought him up to Hebron, and laid him with his fathers.
translation:
  language: pt
  text: E, depois de cinco anos, subiram com ele a Hebrom e o depositaram junto de seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνήγαγον
  choice: levaram-no para
  rationale: O verbo indica conduzir ou levar para cima; em português, «levaram-no para Hebrom» expressa naturalmente o deslocamento sem impor uma referência topográfica além do que o contexto exige.
- source_word: ἔθηκαν
  choice: sepultaram
  rationale: Embora o sentido básico seja «puseram» ou «colocaram», o objeto é o falecido e a colocação junto dos antepassados descreve o sepultamento; «sepultaram» comunica com clareza o sentido contextual.
- source_word: τῶν πατέρων αὐτοῦ
  choice: seus antepassados
  rationale: Aqui «pais» designa os familiares ancestrais já sepultados, não apenas os genitores imediatos; «antepassados» evita ambiguidade indevida em português moderno.
- source_word: εἰς Χεβρών
  choice: para Hebrom
  rationale: A preposição marca o destino do traslado; «Hebrom» é a forma portuguesa consagrada do topônimo.
theological_decisions: []
translation_notes:
  register: Redação narrativa, concisa e digna, com sintaxe corrente e ampla legibilidade brasileira. A tradução mantém a sequência temporal do grego e explicita apenas o sentido funerário já presente no contexto. Os números sobrescritos da edição parecem remissões de aparato crítico, mas, como o conteúdo dessas notas não foi fornecido, não foram convertidos em notas textuais.
