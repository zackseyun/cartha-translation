  text: 5. Καὶ μετὰ *ἔτη πέντε¹⁷ ἀνήγαγον αὐτὸν *εἰς Χεβρών, καὶ ἔθηκαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ¹⁸.
