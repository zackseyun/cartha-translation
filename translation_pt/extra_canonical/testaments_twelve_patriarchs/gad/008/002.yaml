id: T12P.GAD.8.2
reference: Testament of Gad 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ἐγὼ γὰρ ἔγνων⁶, ὅτι ἀποστήσονται⁷ τὰ τέκνα ὑμῶν ἀπ᾽ αὐτοῦ⁸, καὶ⁹ πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ ἔσονται ἀπὸ¹⁰ Κυρίου.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/002.yaml
  text: For I have known that your children will turn away from him, and in every wickedness and affliction and corruption they will be away from the Lord.
translation:
  language: pt
  text: Pois eu sei que os seus filhos se afastarão dele e, em toda espécie de maldade, aflição e corrupção, ficarão longe do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: sei
  rationale: O aoristo pode expressar conhecimento adquirido ou percepção; no contexto profético, o presente natural em português comunica o estado resultante sem acrescentar como esse conhecimento foi obtido.
- source_word: ἀποστήσονται
  choice: se afastarão
  rationale: Preserva a ideia de abandono ou afastamento futuro, sem especificar indevidamente apostasia formal.
- source_word: πάσῃ πονηρίᾳ
  choice: em toda espécie de maldade
  rationale: Expressa de modo idiomático o alcance de πάσῃ sem sugerir necessariamente que cada indivíduo praticará toda maldade possível.
- source_word: κακώσει
  choice: aflição
  rationale: Mantém o sentido amplo de sofrimento, dano ou maus-tratos presente no substantivo grego.
- source_word: διαφθορᾷ
  choice: corrupção
  rationale: Conserva a amplitude moral e destrutiva do termo sem restringi-lo a um único tipo de depravação.
- source_word: ἔσονται ἀπὸ Κυρίου
  choice: ficarão longe do Senhor
  rationale: Reproduz a construção de separação com ἀπό em português natural, sem transformar a frase numa declaração explícita de rejeição divina.
theological_decisions:
- issue: Referente de αὐτοῦ (‘dele’)
  choice: Manter ‘dele’
  alternative: Explicitar ‘do Senhor’ ou outro antecedente contextual
  rationale: O excerto isolado não fornece antecedente seguro; preservar o pronome mantém a ambiguidade genuína do texto.
- issue: Natureza do afastamento do Senhor
  choice: ‘ficarão longe do Senhor’
  alternative: ‘serão afastados pelo Senhor’
  rationale: A construção grega indica separação, mas não marca claramente agência divina; a tradução evita decidir se o afastamento é voluntário, consequencial ou imposto.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação algo tensa do grego foi suavizada apenas o necessário, preservando a distinção entre afastar-se de ‘dele’ e ficar longe do Senhor.
