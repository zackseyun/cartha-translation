  source_fidelity: 'A tradução preserva os elementos centrais do grego: γὰρ («Pois»), o conhecimento expresso por ἔγνων («eu sei», entendido como estado presente decorrente de conhecimento adquirido), o futuro ἀποστήσονται («se afastarão»), o pronome ambíguo αὐτοῦ («dele») e a separação do Senhor em ἔσονται ἀπὸ Κυρίου («ficarão longe do Senhor»). A sequência «em toda espécie de maldade, aflição e corrupção» mantém, sem sobreinterpretar, os três substantivos coordenados e o alcance de πάσῃ.'
