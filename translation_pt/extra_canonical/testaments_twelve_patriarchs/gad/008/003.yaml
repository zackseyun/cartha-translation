base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/003.yaml
  text: 'And after resting a little he spoke again: My children, obey your father, and bury me near my fathers.'
translation:
  language: pt
  text: 'Depois de descansar um pouco, ele falou novamente: “Meus filhos, obedeçam ao pai de vocês e sepultem-me perto dos meus antepassados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσυχάσας ὀλίγον
  choice: depois de descansar um pouco
  rationale: O particípio aoristo indica uma breve pausa ou repouso anterior à nova fala; esta formulação é natural e preserva a sequência.
- source_word: ὑπακούσατε
  choice: obedeçam
  rationale: Imperativo aoristo plural, dirigido aos filhos.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: ao pai de vocês
  rationale: Preserva a referência de Gad a si mesmo na terceira pessoa e evita a ambiguidade de número que 'vosso pai' pode produzir no português corrente.
- source_word: θάψατέ με
  choice: sepultem-me
  rationale: Traduz diretamente o imperativo plural com o objeto de primeira pessoa, em registro digno e corrente.
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: perto dos meus antepassados
  rationale: No contexto funerário, πατέρες designa os ancestrais já sepultados, não apenas o pai ou pais imediatos.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. A fala direta foi marcada por aspas; não foram necessárias notas textuais.
