base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/004.yaml
  text: And drawing up his feet, he fell asleep in peace.
translation:
  language: pt
  text: E, recolhendo os pés, adormeceu em paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  choice: recolhendo os pés
  rationale: Expressa naturalmente o gesto de trazer ou erguer os próprios pés, provavelmente ao leito, sem acrescentar detalhes ausentes do grego.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva o eufemismo grego para a morte e a imagem do sono, sem explicitá-la além do texto.
- source_word: ἐν εἰρήνῃ
  choice: em paz
  rationale: Equivalência direta e idiomática, mantendo tanto o sentido de tranquilidade quanto sua possível ressonância religiosa.
theological_decisions:
- issue: O verbo ἐκοιμήθη pode designar sono literal ou funcionar como eufemismo para a morte.
  choice: adormeceu
  alternative: morreu
  rationale: O contexto provavelmente indica morte, mas a tradução conserva a figura e a ambiguidade lexical do original, sem resolver silenciosamente a tensão.
translation_notes:
  register: Português atual, digno e acessível. A formulação concisa acompanha a estrutura narrativa do grego; não há marcadores de nota, pois os números sobrescritos da edição parecem pertencer ao aparato editorial, não ao texto.
