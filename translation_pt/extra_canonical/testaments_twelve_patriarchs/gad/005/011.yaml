source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 11. Ἐπεὶ Γοὖν⌉ ἔκειτο⁶⁵ τὰ ἥπατα μου ἀνιλεως⁶⁶ κατὰ τοῦ Ἰωσήφ, *τῷ ἥπατι⁶⁷ πάσχων⁶⁸ ἀνιλεως ἐκρινόμην ἐπὶ *χρόνους δέκα⁶⁹, καθ’ *ὃν χρόνον⁷⁰ ἐπείχον⁷¹ τῷ Ἰωσήφ⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/011.yaml
  text: Since, then, my liver was pitilessly set against Joseph, I too, suffering in my liver, was judged pitilessly for ten years.
translation:
  language: pt
  text: 11 Portanto, visto que meu fígado se mantinha impiedosamente contra José, eu também, sofrendo no fígado, fui julgado sem misericórdia durante dez anos — o mesmo tempo em que mantive minha hostilidade contra José.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No mundo antigo, o fígado podia ser associado à vida interior e às emoções. Aqui, a repetição de “fígado” relaciona a hostilidade de Gad contra José ao sofrimento que atingiu o próprio órgão.
    reason: Ajuda o leitor moderno a perceber o jogo retórico e antropológico preservado pela tradução literal.
lexical_decisions:
- source_word: ἥπατα / ἥπατι
  choice: fígado / no fígado
  rationale: Mantém a referência corporal literal e a repetição intencional do grego, que liga a disposição interior de Gad à enfermidade que sofreu.
- source_word: ἀνιλεως
  choice: impiedosamente / sem misericórdia
  rationale: Reproduz as duas ocorrências e sua correspondência retórica, com variação natural em português sem apagar o vínculo semântico.
- source_word: ἐκρινόμην
  choice: fui julgado
  rationale: Preserva o sentido judicial ou retributivo do verbo, sem substituí-lo por uma interpretação mais específica como “fui castigado”.
- source_word: χρόνους δέκα
  choice: durante dez anos
  rationale: No contexto da tradição textual e da revisão fornecida, a expressão designa um período de dez anos, não dez meses.
- source_word: ἐπείχον τῷ Ἰωσήφ
  choice: mantive minha hostilidade contra José
  rationale: Expressa o sentido contextual de persistir numa atitude adversa contra José; evita uma tradução portuguesa obscura ou excessivamente literal.
theological_decisions:
- issue: Relação entre a hostilidade de Gad e seu sofrimento
  choice: Conservar a formulação “fui julgado”, juntamente com a correspondência temporal
  alternative: Explicitar que Deus o castigou por exatamente dez anos
  rationale: O texto apresenta uma relação retributiva, mas não nomeia explicitamente o agente do julgamento neste versículo; a tradução não deve acrescentá-lo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “fígado” e a linguagem de julgamento foram mantidas por serem estruturais ao sentido do original; o travessão torna clara a correspondência entre os dez anos e o período de hostilidade.
