  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/006.yaml
  text: These things I learned at last after I repented concerning Joseph.
translation:
  language: pt
  text: Finalmente compreendi estas coisas, depois de me arrepender quanto a José.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατον ἔγνων
  choice: finalmente compreendi
  rationale: ἔσχατον tem sentido temporal, “por fim/finalmente”, e ἔγνων indica chegar a saber ou compreender; a formulação é natural em português sem acrescentar a ideia de compreensão plena.
- source_word: μετὰ τὸ μετανοῆσαί με
  choice: depois de me arrepender
  rationale: Expressa a anterioridade da construção grega e preserva o sentido moral de μετανοέω neste contexto.
- source_word: περὶ Ἰωσήφ
  choice: do que fiz a José
  rationale: O grego diz literalmente “a respeito de José”, mas, neste contexto, a referência é ao arrependimento pela conduta de Gad para com José. A explicitação evita em português a leitura pouco natural de que ele se arrependeu de uma opinião ou assunto chamado José.
theological_decisions:
- issue: Natureza do arrependimento em μετανοῆσαι
  choice: me arrepender
  alternative: mudar de ideia
  rationale: O contexto relativo à culpa de Gad para com José favorece arrependimento moral, sem impor uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e leitura amplamente acessível no Brasil. Não há marcadores de nota no texto porque nenhuma nota é necessária.
