base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/009.yaml
  text: For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed.
translation:
  language: pt
  text: Pois Deus fez vir sobre mim uma doença no fígado; e, se as orações de meu pai não me tivessem socorrido, meu espírito quase teria desfalecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπήγαγε
  choice: fez vir sobre mim
  rationale: Preserva a causalidade explícita atribuída a Deus e a ideia de algo trazido sobre a pessoa, em português natural.
- source_word: νόσον ἥπατος
  choice: uma doença no fígado
  rationale: Tradução direta e clara da enfermidade localizada no fígado.
- source_word: αἱ εὐχαὶ τοῦ πατρός μου
  choice: as orações de meu pai
  rationale: Mantém o plural do grego e a relação familiar sem explicitação interpretativa.
- source_word: ἐβοήθησάν μοι
  choice: me tivessem socorrido
  rationale: Expressa ajuda em situação de perigo grave, preservando o sujeito gramatical 'orações'.
- source_word: ὀλίγου δεῖν ἐξέλειπε τὸ πνεῦμα μου
  choice: por pouco meu espírito não teria desfalecido
  rationale: Reproduz a construção de quase ocorrência e mantém πνεῦμα como 'espírito', sem reduzir o termo a vida, fôlego ou ânimo.
theological_decisions:
- issue: Atribuição da enfermidade a Deus
  choice: Deus fez vir sobre mim
  alternative: Deus permitiu que me sobreviesse
  rationale: O grego atribui diretamente a Deus a ação de trazer a enfermidade; 'permitiu' enfraqueceria e interpretaria essa causalidade.
- issue: Eficácia das orações do pai
  choice: as orações de meu pai [...] me tivessem socorrido
  alternative: Deus não tivesse atendido às orações de meu pai
  rationale: Mantém a formulação personificada do texto, segundo a qual as próprias orações ajudaram, sem inserir um mecanismo teológico não expresso.
- issue: Sentido de πνεῦμα
  choice: meu espírito
  alternative: minha vida
  rationale: Preserva a amplitude e a possível tensão antropológica do termo grego, evitando resolver sua referência de modo indevido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a relação condicional e a linguagem teológica do original sem rigidez excessiva.
