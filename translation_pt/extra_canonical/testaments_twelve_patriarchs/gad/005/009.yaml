- from: Pois Deus fez vir sobre mim uma doença no fígado; e, se as orações de meu pai não me tivessem socorrido, por pouco meu espírito não teria desfalecido.
  to: Pois Deus fez vir sobre mim uma doença no fígado; e, se as orações de meu pai não me tivessem socorrido, meu espírito quase teria desfalecido.
  rationale: Apenas se reposiciona o advérbio de aproximação para eliminar uma ambiguidade idiomática portuguesa, mantendo a condicional contrafactual, a causalidade divina explícita e a amplitude de «espírito».
