source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 8. *Καὶ οὐκ ἔμαθεν ἀπὸ ἀνθρώπων τοῦτο ἀλλ᾽ οἶδε διὰ μετανοίας τοὺς ἐπιστρέφοντας δέχεσθαι⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/008.yaml
  text: And he did not learn this from men, but through repentance he knows how to receive those who turn back.
translation:
  language: pt
  text: E ele não aprendeu isso dos seres humanos, mas sabe, por meio do arrependimento, acolher os que voltam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega traduzida como “por meio do arrependimento” também pode qualificar “os que voltam”: “acolher os que voltam por meio do arrependimento”.'
    reason: Preservar a ambiguidade sintática genuína de διὰ μετανοίας.
lexical_decisions:
- source_word: ἀπὸ ἀνθρώπων
  choice: dos seres humanos
  rationale: Reproduz de modo inclusivo e natural o sentido genérico de ἄνθρωποι, sem restringi-lo a homens do sexo masculino.
- source_word: διὰ μετανοίας
  choice: por meio do arrependimento
  rationale: Mantém a relação instrumental ou mediadora expressa por διά com genitivo, embora a ligação sintática da expressão seja ambígua.
- source_word: τοὺς ἐπιστρέφοντας
  choice: os que voltam
  rationale: Preserva o sentido de retornar ou voltar-se, sem explicitar indevidamente um complemento como 'para Deus'.
- source_word: δέχεσθαι
  choice: acolher
  rationale: Expressa receber favoravelmente, com naturalidade em português e sem perder a dimensão relacional do verbo.
theological_decisions:
- issue: Ligação sintática de διὰ μετανοίας
  choice: 'Ligação principal com οἶδε...δέχεσθαι: ''sabe, por meio do arrependimento, acolher'''
  alternative: 'Ligação com τοὺς ἐπιστρέφοντας: ''acolher os que voltam por meio do arrependimento'''
  rationale: A ordem grega permite mais de uma leitura. O texto principal acompanha a segmentação mais direta refletida na camada inglesa auditada, enquanto a nota preserva a alternativa sem resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva a concisão do grego e evita acrescentar um agente ou destino não expresso.
