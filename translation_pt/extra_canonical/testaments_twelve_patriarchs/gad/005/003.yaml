id: T12P.GAD.5.3
reference: Testament of Gad 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. Ἡ²⁵ δικαιοσύνη²⁶ ἐκβάλλει τὸ μῖσος²⁷, ἡ ταπείνωσις ἀναιρεῖ *τὸ ζῆλος²⁸. ὁ γὰρ δίκαιος καὶ ταπεινῶς αἰδεῖται ποιῆσαι ἄδικον²⁹, ⸀οὐχ ὑπ᾽ ἄλλου³⁰ καταγινωσκόμενος³¹ ἀλλ᾽³² ὑπὸ τῆς ἰδίας καρδίας³³, ὅτι Κύριος ἐπισκοπεῖ³⁴ *τὴν ψυχὴν³⁵ αὐτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/003.yaml
  text: Righteousness casts out hatred, and humility removes jealousy. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul.
translation:
  language: pt
  text: A justiça expulsa o ódio, e a humildade elimina o ciúme. Pois o justo, sendo humilde, envergonha-se de praticar a injustiça, não por ser condenado por outra pessoa, mas pelo próprio coração, porque o Senhor observa a sua alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justiça
  rationale: Equivalente direto e natural, preservando tanto o sentido moral quanto a qualidade de agir corretamente.
- source_word: ἐκβάλλει
  choice: expulsa
  rationale: Mantém a imagem forte de lançar para fora, em vez de apenas reduzir ou superar.
- source_word: ταπείνωσις
  choice: humildade
  rationale: Expressa naturalmente a disposição humilde indicada pelo substantivo grego.
- source_word: ἀναιρεῖ
  choice: elimina
  rationale: Reproduz a força de remover ou suprimir; evita o sentido moderno mais específico de 'matar'.
- source_word: ζῆλος
  choice: ciúme
  rationale: Neste paralelismo com o ódio, o termo tem sentido negativo de ciúme ou inveja; 'ciúme' segue a leitura contextual sem introduzir zelo positivo.
- source_word: αἰδεῖται
  choice: envergonha-se
  rationale: Conserva a ideia de vergonha ou pudor moral diante da prática injusta.
- source_word: καταγινωσκόμενος
  choice: ser condenado
  rationale: Mantém o sentido de receber juízo condenatório, em contraste com o julgamento interior do próprio coração.
- source_word: ἐπισκοπεῖ
  choice: observa
  rationale: Expressa a vigilância atenta do Senhor sem definir se ela é protetora, judicial ou ambas.
theological_decisions:
- issue: Natureza da vigilância divina sobre a alma
  choice: o Senhor observa a sua alma
  alternative: o Senhor cuida da sua alma / examina a sua alma
  rationale: O verbo ἐπισκοπεῖ pode envolver olhar atento, supervisão ou cuidado. 'Observa' preserva essa amplitude e evita resolver a tensão em sentido exclusivamente protetor ou judicial.
- issue: Fonte da condenação moral
  choice: pelo próprio coração
  alternative: pela própria consciência
  rationale: O grego diz literalmente 'coração'. Mantê-lo preserva a antropologia e a linguagem moral do texto, sem substituí-lo pelo conceito interpretativo de consciência.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez. A repetição de 'justo/justiça' foi preservada por sua função temática. 'Praticar a injustiça' soa natural e mantém a ligação lexical com 'justiça'.
