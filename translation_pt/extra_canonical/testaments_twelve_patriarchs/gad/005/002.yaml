base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/002.yaml
  text: Therefore I say these things to you from experience, my children, so that you may drive out devilish hatred and cling to the love of God.
translation:
  language: pt
  text: Por isso, digo estas coisas a vocês por experiência própria, meus filhos, para que expulsem o ódio diabólico e se apeguem ao amor de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πείρας
  choice: por experiência própria
  rationale: Expressa de modo natural que o conselho procede da experiência pessoal do falante.
- source_word: ἐξώσητε
  choice: expulsem
  rationale: Preserva a imagem forte de fazer sair ou lançar para fora, em vez de apenas evitar.
- source_word: τὸ μῖσος τὸ διαβολικόν
  choice: o ódio diabólico
  rationale: Mantém o substantivo μῖσος e a caracterização explícita διαβολικόν, sem desenvolver além do grego se significa originado pelo diabo ou semelhante a ele.
- source_word: κολληθῆτε
  choice: se apeguem
  rationale: Reproduz a ideia de aderir firmemente ou unir-se, em português atual e digno.
- source_word: τῇ ἀγάπῃ τοῦ Θεοῦ
  choice: ao amor de Deus
  rationale: Conserva a construção genitiva e sua possível amplitude, sem decidir se se trata primariamente do amor vindo de Deus ou dirigido a Deus.
theological_decisions:
- issue: Sentido do genitivo em τοῦ Θεοῦ
  choice: amor de Deus
  alternative: amor por Deus
  rationale: A formulação portuguesa preserva a ambiguidade do grego entre o amor que procede de Deus e o amor dirigido a Deus.
- issue: Força de διαβολικόν
  choice: diabólico
  alternative: do diabo
  rationale: O adjetivo grego caracteriza o ódio sem exigir uma leitura exclusivamente possessiva ou causal.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “vocês” favorece clareza contemporânea; “meus filhos” conserva o tom paterno e exortativo.
