base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/004.yaml
  text: He does not speak against a holy man, because the fear of God dwells in him.
translation:
  language: pt
  text: Ele não fala mal de um homem santo, porque o temor de Deus habita nele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλεῖ
  choice: fala mal de
  rationale: Expressa de modo natural a ideia de falar contra alguém, difamá-lo ou denegri-lo, sem restringir indevidamente o sentido a uma acusação formal.
- source_word: ἀνδρὸς ὁσίου
  choice: de um homem santo
  rationale: Mantém o referente masculino explícito de ἀνήρ e traduz ὅσιος pelo equivalente direto e digno “santo”.
- source_word: ὁ φόβος τοῦ Θεοῦ
  choice: o temor de Deus
  rationale: Preserva a expressão religiosa tradicional e sua amplitude sem reduzi-la apenas a medo ou respeito.
- source_word: οἰκεῖ ἐν αὐτῷ
  choice: habita nele
  rationale: Conserva a metáfora de residência presente no verbo οἰκέω e a ambiguidade pronominal do grego.
theological_decisions:
- issue: Referente de ἐν αὐτῷ (“nele”)
  choice: 'Preservar o pronome ambíguo: “nele”'
  alternative: Explicitar “naquele que não fala mal” ou “no homem santo”
  rationale: A forma grega permite ambiguidade gramatical quanto ao referente; explicitá-lo resolveria uma tensão que o texto não resolve.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação mantém a concisão e o paralelismo causal do grego.
