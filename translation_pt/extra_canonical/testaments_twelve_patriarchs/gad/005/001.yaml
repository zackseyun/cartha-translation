base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/001.yaml
  text: Hatred, then, is evil, because it continually associates with falsehood, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.
translation:
  language: pt
  text: O ódio, portanto, é um mal, porque se associa continuamente à falsidade e fala contra a verdade; faz as coisas pequenas parecerem grandes, apresenta a luz como trevas e chama o doce de amargo. Ensina a calúnia, atiça a ira e a guerra e enche o coração de insolência e de toda ganância, de males e de veneno diabólico.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μῖσος
  choice: o ódio
  rationale: Equivalente direto e natural, preservando a personificação do ódio como agente.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: se associa continuamente à falsidade
  rationale: Expressa a ideia de manter ligação persistente com o que é falso, sem tornar a construção excessivamente literal.
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: faz as coisas pequenas parecerem grandes
  rationale: Torna explícito o sentido de exagerar questões pequenas, sem sugerir uma transformação física.
- source_word: συκοφαντίαν
  choice: a calúnia
  rationale: Neste contexto, designa acusação difamatória ou falsa, adequadamente expressa por 'calúnia'.
- source_word: ὕβριν
  choice: insolência
  rationale: Preserva a noção de arrogância ofensiva e comportamento ultrajante.
- source_word: πλεονεξίαν
  choice: ganância
  rationale: Termo corrente que comunica o desejo desmedido de possuir ou obter mais.
- source_word: ἰοῦ διαβολικοῦ
  choice: veneno diabólico
  rationale: Mantém a imagem forte de veneno e o adjetivo relacionado ao diabo, sem explicitação teológica adicional.
theological_decisions:
- issue: Valor de διαβολικοῦ
  choice: diabólico
  alternative: do caluniador
  rationale: O adjetivo pode ter associação lexical com calúnia, mas aqui, ligado a 'veneno' e em uma enumeração moral, 'diabólico' preserva de modo natural a provável referência ao diabo sem ampliá-la.
- issue: Coordenação final de κακῶν καὶ ἰοῦ διαβολικοῦ
  choice: de males e de veneno diabólico
  alternative: com males e veneno diabólico
  rationale: Conserva os dois elementos coordenados como conteúdos que enchem o coração e evita fundi-los em uma única expressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e imagens do grego preservadas. A personificação do ódio foi mantida. Não foram necessárias notas de rodapé.
