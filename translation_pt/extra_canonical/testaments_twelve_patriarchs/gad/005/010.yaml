source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 10. Δι’ ὧν γὰρ δ⁶³ ἄνθρωπος παρανομεῖ, δι’ ἐκείνων⁶⁴ κολάζεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/010.yaml
  text: For by the very things through which a man transgresses, through those he is punished.
translation:
  language: pt
  text: Pois uma pessoa é punida pelas mesmas coisas por meio das quais transgride.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δι’ ὧν ... δι’ ἐκείνων
  choice: pelas coisas por meio das quais ... por elas
  rationale: Preserva a correspondência enfática entre o meio da transgressão e o da punição, expressa pela repetição grega de διά com o genitivo.
- source_word: ἄνθρωπος
  choice: uma pessoa
  rationale: Neste enunciado geral, ἄνθρωπος designa o ser humano sem ênfase no sexo; “uma pessoa” comunica isso com naturalidade no português atual.
- source_word: παρανομεῖ
  choice: transgride
  rationale: Expressa a ideia de agir contra a lei ou ultrapassar seus limites, sem acrescentar um objeto que o grego deixa implícito.
- source_word: κολάζεται
  choice: é punida
  rationale: Mantém a voz passiva e o sentido judicial ou disciplinar do verbo, sem especificar quem aplica a punição.
theological_decisions:
- issue: Relação entre a transgressão e a punição
  choice: Manter que as próprias coisas usadas para transgredir são o meio da punição.
  alternative: Generalizar como “a pessoa é punida por seus pecados”.
  rationale: A formulação grega estabelece uma correspondência específica e enfática entre instrumento ou esfera da transgressão e instrumento ou esfera da punição; generalizá-la apagaria essa tensão.
translation_notes:
  register: Português moderno, claro e sentencioso, com tom sapiencial digno. A construção foi levemente reorganizada para soar natural, sem perder o paralelismo causal e instrumental do grego.
