id: T12P.GAD.5.7
reference: Testament of Gad 5:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/007.yaml
  text: For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
translation:
  language: pt
  text: 7 Pois o verdadeiro arrependimento segundo Deus [elimina a ignorância e][a] põe as trevas em fuga, ilumina os olhos, dá conhecimento à alma e conduz a mente à salvação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes têm atestação textual incerta.
    reason: O texto grego da edição apresenta ἀναιρεῖ τὴν ἄγνοιαν καὶ entre colchetes, sinalizando incerteza textual; a tradução preserva essa indicação.
lexical_decisions:
- source_word: ἡ κατὰ Θεὸν ἀληθὴς μετάνοια
  choice: o verdadeiro arrependimento segundo Deus
  rationale: Mantém a formulação teológica e a relação expressa por κατὰ Θεόν sem explicá-la além do que o grego permite.
- source_word: φυγαδεύει τὸ σκότος
  choice: põe as trevas em fuga
  rationale: Reproduz a imagem vigorosa do verbo φυγαδεύω e soa natural em português.
- source_word: γνῶσιν παρέχει τῇ ψυχῇ
  choice: dá conhecimento à alma
  rationale: Tradução direta e clara, preservando ψυχή como «alma» e γνῶσις como «conhecimento».
- source_word: ὁδηγεῖ τὸ διαβούλιον πρὸς σωτηρίαν
  choice: conduz a mente à salvação
  rationale: No contexto, διαβούλιον designa a faculdade interior de ponderar e decidir; «mente» comunica essa ideia com clareza, sem reduzir o termo a um plano ou propósito específico.
theological_decisions:
- issue: Sentido de κατὰ Θεόν aplicado ao arrependimento
  choice: segundo Deus
  alternative: de acordo com Deus
  rationale: '«Segundo Deus» conserva a concisão e a possível tensão do original: pode indicar conformidade com Deus ou um arrependimento orientado por ele, sem escolher silenciosamente entre essas nuances.'
- issue: Destino expresso por πρὸς σωτηρίαν
  choice: à salvação
  alternative: para a salvação
  rationale: A forma escolhida expressa direção ou finalidade sem desenvolver uma doutrina específica sobre o modo da salvação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura em série do grego foi preservada, e a linguagem figurada não foi suavizada.
