source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Φοβούμενος γὰρ⁴¹ μὴ προσκρούσαι⁴² Κυρίῳ⁴³, οὐ θέλει τὸ καθόλου⁴⁴ οὐδὲ⁴⁵ ἕως ἐννοίας⁴⁶ ἀδικῆσαι ἄνθρωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/005.yaml
  text: For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.
translation:
  language: pt
  text: Pois, temendo ofender o Senhor, ele não quer de modo algum fazer injustiça a alguém, nem sequer em pensamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκρούσαι
  choice: ofender
  rationale: No contexto da relação com o Senhor, exprime a ideia de incorrer em sua desaprovação ou agir contra ele, preservando a formulação concisa do grego.
- source_word: τὸ καθόλου
  choice: de modo algum
  rationale: Reproduz a negação enfática e abrangente em português natural.
- source_word: ἕως ἐννοίας
  choice: nem sequer em pensamento
  rationale: Comunica que a recusa de praticar injustiça se estende até à esfera interior da intenção ou do pensamento.
- source_word: ἀδικῆσαι ἄνθρωπον
  choice: fazer injustiça a alguém
  rationale: Preserva o sentido moral amplo de ἀδικέω sem restringi-lo a dano físico; 'alguém' é mais natural em português moderno do que o genérico 'um homem'.
theological_decisions:
- issue: Relação entre temor do Senhor e conduta para com o próximo
  choice: Manter o temor de ofender o Senhor como motivo para não cometer injustiça nem interiormente
  alternative: Explicitar o temor como reverência religiosa ou substituir 'ofender' por 'pecar contra'
  rationale: O grego afirma a motivação sem definir a natureza exata do temor nem empregar o vocabulário específico de pecado; a tradução evita ampliar teologicamente o texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção fluente e sem marcas confessionais. O pronome 'ele' conserva a referência pessoal presente no contexto e no verbo grego.
