  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005.yaml
  text: '1[a]. Hatred, then, is evil, because it keeps company with falsehood continually, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.


    2. Therefore I say these things to you from experience, my children, so that you may drive out the devilish hatred and cling to the love of God. 3. Righteousness casts out hatred, and humility removes jealousy[b]. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul. 4. He does not speak against a holy man, because the fear of God dwells in him. 5. For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.


    6. These things I learned at last after I repented concerning Joseph. 7. For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the purpose toward salvation. 8. And he did not learn this from men, but through repentance he knows how to receive those who turn back.


    9. For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed. 10. For by the very things through which a man transgresses, through those he is punished. 11. Since, then, my liver lay pitilessly set against Joseph, I too, suffering in my liver[c], was judged pitilessly for ten years.'
translation:
  language: pt
  text: '1. Portanto, o ódio é mau, pois está continuamente na companhia da falsidade e fala contra a verdade; faz as coisas pequenas parecerem grandes, apresenta a luz como trevas e chama o doce de amargo. Ensina a calúnia, atiça a ira, provoca a guerra e enche o coração de insolência, de toda ganância, de males e de veneno diabólico.


    2. Digo-lhes, portanto, estas coisas por experiência própria, meus filhos, para que expulsem o ódio diabólico e se apeguem ao amor de Deus. 3. A justiça expulsa o ódio, e a humildade elimina o ciúme[a]. Pois o justo e humilde envergonha-se de cometer injustiça, não por ser condenado por outra pessoa, mas pelo próprio coração, porque o Senhor observa a sua alma. 4. Ele não fala mal de um homem piedoso, porque o temor de Deus habita nele. 5. Pois, temendo ofender o Senhor, não quer de modo algum tratar alguém injustamente, nem sequer em pensamento.


    6. Aprendi essas coisas por fim, depois de me arrepender a respeito de José. 7. Pois o verdadeiro arrependimento segundo Deus [remove a ignorância e][b] põe as trevas em fuga, ilumina os olhos, dá conhecimento à alma e conduz o propósito para a salvação. 8. E ele não aprendeu isso dos seres humanos, mas sabe acolher, por meio do arrependimento, os que retornam[c].


    9. Pois Deus trouxe sobre mim uma doença do fígado; e, se as orações de meu pai não me tivessem ajudado, por pouco meu espírito não teria desfalecido. 10. Pois uma pessoa é castigada pelas mesmas coisas pelas quais transgride. 11. Visto que meu fígado se havia voltado impiedosamente contra José, também eu fui julgado sem piedade, sofrendo no fígado durante dez anos[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «inveja»; o termo grego pode indicar tanto ciúme hostil quanto rivalidade invejosa.
    reason: lexical_alternative
  - marker: b
    text: As palavras «remove a ignorância e» são textualmente incertas no testemunho grego e, por isso, aparecem entre colchetes.
    reason: textual_variant
  - marker: c
    text: O grego não identifica expressamente o sujeito deste versículo; ele pode ser entendido como Deus ou, conforme outra leitura, como a pessoa que se arrepende.
    reason: ambiguity
  - marker: d
    text: Literalmente, «durante dez períodos (ou tempos)». A identificação desses períodos como anos é uma interpretação; também se propôs «dez meses».
    reason: alternative_reading
lexical_decisions:
- source_word: μῖσος
  choice: ódio
  rationale: Preserva o substantivo abstrato que funciona como tema do catálogo de vícios.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: está continuamente na companhia da falsidade
  rationale: Mantém tanto a continuidade quanto a personificação do ódio aliado à falsidade.
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: faz as coisas pequenas parecerem grandes
  rationale: Comunica em português natural a amplificação enganosa sem perder o contraste retórico.
- source_word: τὸ φῶς σκότος παρέχει
  choice: apresenta a luz como trevas
  rationale: Preserva a inversão moral expressa pelo grego.
- source_word: συκοφαντίαν
  choice: calúnia
  rationale: É o equivalente conciso e corrente para acusação falsa e maliciosa neste contexto ético.
- source_word: ὕβριν
  choice: insolência
  rationale: Expressa arrogância ofensiva e socialmente agressiva, não apenas orgulho interior.
- source_word: πλεονεξίαν
  choice: ganância
  rationale: Termo moderno e claro para o desejo ávido de possuir mais.
- source_word: ἰοῦ διαβολικοῦ
  choice: veneno diabólico
  rationale: Conserva a imagem forte do veneno e o valor adjetival do genitivo.
- source_word: ζῆλος
  choice: ciúme
  rationale: Adequado ao sentido de rivalidade hostil; a possível nuance de inveja é indicada em nota.
- source_word: διαβούλιον
  choice: propósito
  rationale: Representa a deliberação ou intenção interior orientada pelo arrependimento.
- source_word: χρόνους δέκα
  choice: dez anos
  rationale: Segue a compreensão temporal tradicional do contexto, enquanto a expressão grega menos específica é explicitada em nota.
theological_decisions:
- issue: μετανοῆσαι / μετάνοια nos vv. 6–8
  choice: arrepender / arrependimento
  alternative: mudar de ideia / mudança de mente
  rationale: No v. 6, a mudança diz respeito à culpa concreta contra José; nos vv. 7–8, o termo assume alcance moral e religioso. A mesma família lexical em português preserva a ligação do argumento.
- issue: Expressão entre colchetes no v. 7
  choice: manter «[remove a ignorância e]» entre colchetes
  alternative: omitir a expressão ou incorporá-la sem marcação
  rationale: Os colchetes preservam de modo transparente a incerteza textual apresentada pela fonte.
- issue: Sujeito implícito no v. 8
  choice: preservar o sujeito não expresso em português
  alternative: identificá-lo explicitamente como Deus ou como a pessoa arrependida
  rationale: O grego não nomeia o sujeito, e sua identificação é discutível. A construção portuguesa mantém a ambiguidade em vez de impor uma solução teológica.
- issue: Duração da enfermidade no v. 11
  choice: dez anos, com nota textual
  alternative: dez períodos ou dez meses
  rationale: «Anos» oferece uma leitura temporal inteligível e atestada na tradição de tradução, mas a nota informa que o grego disponível diz literalmente «dez períodos/tempos».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Empregou-se «vocês» de modo implícito em formas verbais de terceira pessoa e «meus filhos» no vocativo. Evitaram-se arcaísmos, mas foram preservadas as imagens retóricas, o paralelismo moral e as ambiguidades reais do grego.
