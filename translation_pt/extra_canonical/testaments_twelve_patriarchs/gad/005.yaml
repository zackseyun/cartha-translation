    2. Digo-lhes, portanto, estas coisas por experiência própria, meus filhos, para que expulsem o ódio diabólico e se apeguem ao amor de Deus. 3. A justiça expulsa o ódio, e a humildade elimina o ciúme[a]. Pois o justo, por ser humilde, envergonha-se de cometer injustiça, não por ser condenado por outra pessoa, mas pelo próprio coração, porque o Senhor observa a sua alma. 4. Ele não fala mal de um homem piedoso, porque o temor de Deus habita nele. 5. Pois, temendo ofender o Senhor, não quer de modo algum fazer injustiça a ninguém, nem sequer em pensamento.


    6. Aprendi essas coisas por fim, depois de me arrepender do que fiz com José. 7. Pois o verdadeiro arrependimento segundo Deus [remove a ignorância e][b] põe as trevas em fuga, ilumina os olhos, dá conhecimento à alma e conduz o propósito para a salvação. 8. E isso não aprendeu dos seres humanos; antes, por meio do arrependimento, sabe acolher os que retornam[c].


