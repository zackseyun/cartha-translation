  text: 1[a]. But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be brought to completion. For in this way it is to your advantage. 2. And if he is exalted still more[b], do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who gives good and profitable things to all people. 3. Examine the judgments of the Lord, and your purpose will be illumined and be at rest. 4. But if someone grows rich through evil, like Esau my father's brother, do not be jealous; rather, wait for the appointed limit of the Lord. 5. For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment. 6. For the poor man, if being free from envy in all things he is pleasing to the Lord, is richer than all, because he does not have the distraction of vain people. 7. Therefore cast out hatred from your souls[d][c], and love one another in deed and in word and in the
    disposition of your soul.
translation:
  language: pt
  text: '**Testamento de Gade 7**


    1. Se alguém prosperar mais do que vocês, não fiquem tristes; antes, orem por ele, para que alcance a plenitude.[a] Pois isso é benéfico para vocês. 2. E, se ele for ainda mais exaltado, não o invejem, lembrando-se de que toda carne morrerá. Ofereçam, porém, hinos ao Senhor, que concede coisas boas e proveitosas a todos os seres humanos. 3. Examinem os juízos do Senhor, e o propósito de vocês será iluminado e encontrará descanso. 4. Mas, se alguém enriquecer por meio do mal, como Esaú, irmão de meu pai, não o invejem; esperem pelo limite estabelecido pelo Senhor.[b] 5. Pois, se essas coisas lhe forem tiradas por meio de males,[c] ou se ele se arrepender, será perdoado; mas, se permanecer sem arrependimento, será guardado para o castigo eterno.[d] 6. Pois o pobre, se, livre de inveja em todas as coisas, agradar ao Senhor, é mais rico do que todos, porque não sofre a distração dos seres humanos fúteis.[e] 7. Portanto, eliminem o ódio da alma de vocês e amem uns aos outros com retidão de
    coração.


    [a] Ou: “para que seja aperfeiçoado”.


    [b] “O limite estabelecido pelo Senhor” também pode ser entendido como “o tempo fixado pelo Senhor” ou “o decreto do Senhor”.


    [c] O texto grego desta oração é difícil; literalmente, algo como: “se essas coisas lhe são tiradas em/por males”. Pelo contexto, “essas coisas” provavelmente se refere aos bens ou riquezas mencionados no versículo anterior.


    [d] Ou: “castigo da era”. O adjetivo grego também pode exprimir aquilo que pertence a uma era, sem que a expressão, por si só, resolva todas as questões sobre duração.


    [e] Ou: “a preocupação própria dos seres humanos fúteis”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que seja aperfeiçoado”.'
    reason: lexical_alternative
  - marker: b
    text: “O limite estabelecido pelo Senhor” também pode ser entendido como “o tempo fixado pelo Senhor” ou “o decreto do Senhor”.
    reason: lexical_alternative
  - marker: c
