    reason: lexical_alternative
  - marker: e
    text: 'Ou: “a preocupação própria dos seres humanos fúteis”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδοῦται
  choice: prosperar
  rationale: No contexto de comparação social, o verbo indica ir bem ou prosperar, e não uma viagem literal.
- source_word: τελειωθῇ
  choice: alcance a plenitude
  rationale: Preserva a ideia de chegar a um estado completo sem restringir o termo à prosperidade material nem transformá-lo em linguagem técnica de perfeição.
- source_word: ὕμνους προσφέρετε
  choice: ofereçam hinos
  rationale: Mantém a coloração cultual de προσφέρετε e o registro solene da exortação.
- source_word: κρίματα Κυρίου
  choice: juízos do Senhor
  rationale: Pode abranger decisões e atos judiciais divinos; “juízos” conserva essa amplitude e a dicção bíblica.
- source_word: διαβούλιον
  choice: propósito
  rationale: Expressa o conselho ou a resolução interior, com linguagem compreensível ao leitor moderno.
- source_word: ὅρον Κυρίου
  choice: limite estabelecido pelo Senhor
  rationale: ὅρος pode indicar limite, termo ou determinação; a formulação mantém aberta a dimensão temporal e judicial.
- source_word: ἄφθονος
  choice: livre de inveja
  rationale: Neste capítulo centrado na inveja, o sentido privativo “sem inveja” é contextual e lexicalmente adequado.
- source_word: περισπασμὸν τῶν ματαίων ἀνθρώπων
  choice: distração dos seres humanos fúteis
  rationale: Segue de perto a construção grega, sem substituir silenciosamente “seres humanos” por “coisas”.
- source_word: ἐν εὐθύτητι καρδίας
  choice: com retidão de coração
  rationale: Reproduz a imagem ética de sinceridade, integridade e retidão interior.
theological_decisions:
- issue: Sentido de τελειωθῇ na oração por quem prospera
  choice: “para que alcance a plenitude” no texto principal
  alternative: “para que seja aperfeiçoado”
  rationale: A opção principal conserva a orientação para um fim completo ou maduro, sem impor uma doutrina técnica de perfeição.
- issue: Sentido de ὅρον Κυρίου diante da prosperidade injusta
  choice: “limite estabelecido pelo Senhor”
  alternative: “tempo fixado pelo Senhor” ou “decreto do Senhor”
  rationale: O grego admite noções de fronteira, termo e determinação. A tradução principal preserva a tensão, e a nota registra as alternativas.
- issue: Força de αἰωνίαν κόλασιν
  choice: “castigo eterno”
  alternative: “castigo da era”
  rationale: “Castigo eterno” é a leitura corrente e natural da expressão neste aviso escatológico, mas a nota preserva a ligação lexical de αἰώνιος com “era” sem decidir além do que a expressão isolada permite.
- issue: Objeto implícito e sequência lógica em 7.5
  choice: Entender αὐτά como as riquezas do versículo anterior e apresentar perdão em caso de arrependimento
  alternative: Manter a formulação quase literal “se essas coisas lhe são tiradas em males”
  rationale: O texto grego é sintaticamente difícil e marcado como problemático na edição. A tradução oferece uma leitura contextual inteligível, enquanto a nota expõe a dificuldade e a forma mais literal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” nas exortações plurais. Mantiveram-se expressões bíblicas reconhecíveis, como “toda carne”, “juízos do Senhor” e “retidão de coração”. A conclusão foi traduzida diretamente do grego completo fornecido, sem a ampliação não atestada que aparece na camada inglesa.
