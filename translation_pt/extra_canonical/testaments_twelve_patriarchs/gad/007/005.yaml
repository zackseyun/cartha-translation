  source_fidelity: A cláusula inicial é textualmente difícil, mas o texto principal acrescenta “foi tomado”, um perfeito passivo que não está expresso no grego. Além disso, “com maldade” fixa ἐν κακοῖς como modo moral, quando a locução pode ter valor circunstancial (“em meio aos males”) e a sintaxe de toda a oração permanece incerta. A revisão evita esse acréscimo e conserva a dificuldade mediante nota.
  naturalness: A redação revista continua clara em português moderno. “Essas coisas” reproduz αὐτά sem inventar um antecedente, e “fica reservado” mantém adequadamente a passiva de τηρεῖται.
  terminology: “Arrepende”, “perdoado” e “castigo eterno” são escolhas naturais e semanticamente adequadas para μετανοέω, ἀφίημι e αἰωνία κόλασις. Não se acrescenta explicação doutrinária.
