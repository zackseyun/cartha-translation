    rationale: O grego traz αὐτά (“essas coisas/elas”) junto de ἀφαιρεῖται, não uma forma que justifique “foi tomado”. O acréscimo torna a já difícil cláusula mais determinada do que o testemunho permite.
  - severity: medium
    issue: “Com maldade” resolve indevidamente ἐν κακοῖς.
    rationale: A expressão literalmente se refere a “males/coisas más” e, neste contexto sintaticamente incerto, pode ser circunstancial. “Em meio aos males” é menos interpretativo; a nota registra a incerteza.
