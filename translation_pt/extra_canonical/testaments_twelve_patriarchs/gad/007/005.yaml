  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/005.yaml
  text: For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment.
translation:
  language: pt
  text: Pois, se lhe são tiradas essas coisas em meio aos males[a], ou, se ele se arrepende, é perdoado; mas, se permanece sem arrependimento, fica reservado para o castigo eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta oração é difícil e apresenta incerteza textual. Literalmente, lê-se algo como “se lhe são tiradas essas coisas em meio aos males”; a relação entre essa cláusula e as alternativas seguintes não é inteiramente clara.
    reason: Sinaliza a construção problemática em torno de αὐτά e ἐν κακοῖς, sem introduzir no texto principal uma ação anterior não expressa.
lexical_decisions:
- source_word: ἀφαιρεῖται
  choice: lhe é tirado
  rationale: Mantém a voz passiva ou média do grego e a ideia de privação, sem especificar quem realiza a ação.
- source_word: ἐν κακοῖς
  choice: com maldade
  rationale: Expressa o sentido instrumental ou circunstancial da locução, preservando sua ligação com o ato de tomar.
- source_word: μετανοήσαντι
  choice: caso se arrependa
  rationale: Reproduz em português natural a condição ligada ao arrependimento, embora a forma grega seja um particípio no dativo.
- source_word: ἀμετανόητος
  choice: permanece sem arrependimento
  rationale: Traduz o estado persistente de impenitência sem recorrer a vocabulário técnico pouco corrente.
- source_word: αἰωνίαν κόλασιν
  choice: castigo eterno
  rationale: É a correspondência direta e tradicional, deixando intacta a força escatológica da expressão.
theological_decisions:
- issue: Relação entre arrependimento, perdão e castigo
  choice: Conservar as alternativas condicionais do texto sem explicar seu mecanismo teológico
  alternative: Reformular como uma doutrina explícita de restituição obrigatória ou de salvação por obras
  rationale: O grego apresenta uma sequência concisa e de sintaxe difícil; a tradução não deve acrescentar uma estrutura doutrinária ausente.
- issue: Duração de αἰώνιος
  choice: eterno
  alternative: duradouro ou pertencente à era futura
  rationale: Neste contexto judicial, “eterno” é a tradução portuguesa mais direta de αἰώνιος, sem comentário destinado a reduzir ou ampliar seu alcance.
translation_notes:
  register: Português moderno, claro e digno, com construção condicional natural. Evitou-se linguagem confessional técnica; a nota registra a incerteza textual sem sobrecarregar o texto principal.
