id: T12P.GAD.7.1
reference: Testament of Gad 7:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/001.yaml
  text: But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be made complete. For in this way it is to your advantage.
translation:
  language: pt
  text: Mas, se alguém prospera mais do que vocês, não fiquem tristes; pelo contrário, orem por ele, para que seja aperfeiçoado. Pois é assim que isso é vantajoso para vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐοδοῦται
  choice: prospera
  rationale: Expressa de modo natural o sentido de ter êxito ou seguir por um caminho favorável, sem restringi-lo à riqueza.
- source_word: μὴ λυπεῖσθε
  choice: não fiquem tristes
  rationale: Reproduz diretamente a reação emocional indicada pelo verbo, em linguagem corrente e digna.
- source_word: τελειωθῇ
  choice: seja aperfeiçoado
  rationale: Preserva a ideia passiva de ser levado à plenitude ou completude, sem especificar indevidamente em que consiste esse aperfeiçoamento.
- source_word: συμφέρον
  choice: vantajoso
  rationale: Comunica que tal atitude resulta em benefício para os destinatários.
theological_decisions:
- issue: Sentido de τελειωθῇ
  choice: para que seja aperfeiçoado
  alternative: para que alcance a plenitude
  rationale: A forma passiva foi mantida e a natureza da perfeição não foi definida, preservando a abertura semântica e teológica do grego.
- issue: Referente implícito de εἰς
  choice: alguém
  alternative: uma pessoa
  rationale: O grego apresenta um referente humano indefinido; “alguém” é a formulação portuguesa mais natural e não acrescenta identidade ou grupo.
translation_notes:
  register: Português moderno, claro e digno, com plural “vocês” para ampla legibilidade brasileira. “Pelo contrário” marca com naturalidade o contraste de ἀλλά. A última oração foi formulada de modo idiomático, preservando o benefício dirigido aos destinatários.
