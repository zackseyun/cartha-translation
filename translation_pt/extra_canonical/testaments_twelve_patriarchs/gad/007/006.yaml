base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/006.yaml
  text: For the poor man, if being free from envy in all things he is pleasing to the Lord, this one is richer than all, because he does not have the distraction of vain people.
translation:
  language: pt
  text: 6. Pois o pobre, se, sendo abundante em tudo,[a] agrada ao Senhor, é mais rico do que todos, porque não tem a distração das pessoas vãs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego também pode significar «generoso» ou «livre de inveja».
    reason: Registra acepções possíveis de ἄφθονος sem deslocar a construção condicional nem resolver além do necessário o paradoxo do texto.
lexical_decisions:
- source_word: ἄφθονος
  choice: generoso
  rationale: O termo pode significar “sem inveja”, “generoso” ou “abundante”. No contexto de alguém pobre que, apesar disso, é rico diante de Deus, “generoso” comunica de modo natural a ausência de inveja e a disposição desprendida, sem confundir pobreza material com abundância de bens.
- source_word: ὑπὲρ πάντας πλουτεῖ
  choice: é mais rico do que todos
  rationale: Reproduz diretamente a comparação do grego e preserva o contraste entre a pobreza material e uma riqueza de outra ordem.
- source_word: περισπασμὸν τῶν ματαίων ἀνθρώπων
  choice: as preocupações das pessoas fúteis
  rationale: “Preocupações” expressa aqui aquilo que ocupa e distrai a mente; o genitivo foi mantido como caracterização das preocupações próprias de pessoas voltadas ao que é vão.
theological_decisions:
- issue: Natureza da riqueza atribuída ao pobre
  choice: Preservar o paradoxo sem definir explicitamente a riqueza como espiritual
  alternative: “é espiritualmente mais rico do que todos”
  rationale: O texto contrasta pobreza e riqueza, mas não acrescenta o advérbio “espiritualmente”; explicitar isso resolveria uma tensão que o original deixa implícita.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “pessoas” em vez do masculino genérico “homens”. A coordenação “se for... e agradar” torna clara a relação condicional sem alterar o conteúdo.
