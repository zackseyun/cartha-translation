  text: Therefore cast out hatred from your souls, and love one another in uprightness of heart.
translation:
  language: pt
  text: Portanto, eliminem o ódio das almas de vocês e amem uns aos outros com retidão de coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρατε
  choice: eliminem
  rationale: O imperativo aoristo pede uma ação decidida de remover ou expulsar; “eliminem” é natural e vigoroso em português atual.
- source_word: τὸ μῖσος
  choice: o ódio
  rationale: Equivalência direta e corrente para o substantivo grego.
- source_word: ἀπὸ τῶν ψυχῶν ὑμῶν
  choice: da alma de vocês
  rationale: Mantém ψυχή como “alma”; o singular distributivo em português soa mais natural e expressa a alma de cada destinatário.
- source_word: ἀγαπήσατε ἀλλήλους
  choice: amem uns aos outros
  rationale: Reproduz o imperativo e a reciprocidade de ἀλλήλους em linguagem clara.
- source_word: ἐν εὐθύτητι καρδίας
  choice: com retidão de coração
  rationale: Preserva a imagem antropológica e moral do grego, sem explicitar além do texto ideias como sinceridade ou pureza de intenção.
theological_decisions:
- issue: Sentido de ψυχή
  choice: alma
  alternative: vida / íntimo
  rationale: “Alma” preserva o termo e sua abertura semântica, evitando reduzir a expressão apenas à interioridade psicológica.
- issue: Força de εὐθύτης
  choice: retidão
  alternative: sinceridade
  rationale: “Retidão” conserva a dimensão moral mais ampla do termo; “sinceridade” poderia estreitar o sentido à honestidade subjetiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no plural brasileiro (“eliminem”, “amem”) e sem marcas confessionais.
