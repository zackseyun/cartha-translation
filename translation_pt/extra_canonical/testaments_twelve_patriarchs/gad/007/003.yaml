  text: Examine the judgments of the Lord, and your purpose will be illumined and be at rest.
translation:
  language: pt
  text: Examina os juízos do Senhor, e o teu propósito será iluminado e ficará em repouso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξέτασον
  choice: Examina
  rationale: Imperativo que preserva a ideia de investigar ou considerar cuidadosamente.
- source_word: κρίματα Κυρίου
  choice: os juízos do Senhor
  rationale: Mantém o sentido jurídico e moral de κρίματα sem reduzi-lo apenas a decisões ou mandamentos.
- source_word: καταλάμψει
  choice: será iluminado
  rationale: Reflete a imagem de luz do verbo grego e concorda naturalmente com «propósito».
- source_word: ἡσυχάσει
  choice: encontrará descanso
  rationale: Expressa o estado de quietude e repouso de modo natural em português.
- source_word: τὸ διαβούλιόν σου
  choice: teu propósito
  rationale: Representa a deliberação, intenção ou plano interior, preservando a formulação concisa do texto.
theological_decisions:
- issue: Relação entre examinar os juízos divinos e o estado do propósito humano
  choice: Mantida como consequência afirmada, sem explicitar o agente da iluminação ou do descanso.
  alternative: «o Senhor iluminará e dará descanso ao teu propósito»
  rationale: A sintaxe grega faz de «teu propósito» o sujeito dos verbos; explicitar Deus como agente acrescentaria uma interpretação não expressa diretamente.
translation_notes:
  register: Português atual, digno e acessível, com uso de «teu» para conservar concisão e tom sapiencial. A construção mantém o paralelismo e a ambiguidade do texto grego quanto ao modo pelo qual o propósito é iluminado e aquietado.
