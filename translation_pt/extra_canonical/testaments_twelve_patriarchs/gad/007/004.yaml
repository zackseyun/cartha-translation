  text: 4. Ἐὰν δὲ¹⁵ ἐκ κακῶν¹⁶ τις πλουτήσει, ὡς Ἡσαῦ ὁ πατράδελφός¹⁷ μου, μὴ ζηλώσητε¹⁸· ὅρον¹⁹ γὰρ²⁰ Κυρίου ἐκδέξασθε²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/004.yaml
  text: But if someone becomes rich through evil, like Esau my father's brother, do not be jealous; rather, await the appointed limit of the Lord.
translation:
  language: pt
  text: Mas, se alguém enriquecer por meios maus, como Esaú, irmão de meu pai, não tenham inveja; pois aguardem o limite do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ κακῶν
  choice: por meio de males
  rationale: Preserva a ideia de que a riqueza procede de atos ou meios maus, sem restringir o plural grego a uma única forma de maldade.
- source_word: πλουτήσει
  choice: enriquecer
  rationale: Verbo natural e direto em português para o futuro grego, no sentido de tornar-se rico.
- source_word: πατράδελφος
  choice: irmão de meu pai
  rationale: Reproduz de modo claro a relação de parentesco indicada pelo composto grego.
- source_word: μὴ ζηλώσητε
  choice: não tenham inveja
  rationale: No contexto da prosperidade obtida pelo mal, ζηλόω exprime invejar ou cobiçar a condição de alguém.
- source_word: ὅρον
  choice: limite estabelecido
  rationale: Ὅρος pode indicar limite, termo ou determinação. A formulação conserva a imagem de um limite e torna perceptível a noção contextual de algo fixado pelo Senhor.
- source_word: ἐκδέξασθε
  choice: aguardem
  rationale: Expressa a espera expectante do imperativo aoristo médio sem acrescentar um objeto ou resultado não declarado.
theological_decisions:
- issue: Sentido de ὅρον Κυρίου
  choice: o limite estabelecido pelo Senhor
  alternative: o limite do Senhor / o termo determinado pelo Senhor
  rationale: A expressão é ambígua quanto a um limite temporal, um fim decretado ou uma determinação divina. A tradução mantém 'limite' e explicita apenas a ideia inerente de fixação, sem identificar qual evento se espera.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Manteve-se a construção exortativa e a relação causal introduzida por γάρ.
