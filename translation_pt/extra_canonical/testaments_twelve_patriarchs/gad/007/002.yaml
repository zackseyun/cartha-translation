source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/002.yaml
  text: And if he is exalted still more, do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who provides good and beneficial things to all people.
translation:
  language: pt
  text: E, se ele for ainda mais exaltado, não tenham inveja dele, lembrando-se de que toda carne morrerá. Mas ofereçam hinos ao Senhor, que concede coisas boas e benéficas a todos os seres humanos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον ὑψοῦται
  choice: for ainda mais exaltado
  rationale: Preserva a forma passiva e o sentido de elevação adicional, sem especificar quem o exalta.
- source_word: μὴ φθονεῖτε αὐτῷ
  choice: não tenham inveja dele
  rationale: Expressão natural em português para a proibição de φθονεῖν com dativo.
- source_word: πᾶσα σὰρξ
  choice: toda carne
  rationale: Mantém a expressão antropológica tradicional e abrangente do grego, aqui associada à mortalidade.
- source_word: ὕμνους προσφέρετε
  choice: ofereçam hinos
  rationale: Conserva a imagem cultual de apresentar ou oferecer hinos, em vez de reduzi-la simplesmente a cantar.
- source_word: παρέχοντι
  choice: concede
  rationale: Comunica de modo corrente e digno a ideia de prover ou proporcionar.
- source_word: τὰ καλὰ καὶ συμφέροντα
  choice: coisas boas e proveitosas
  rationale: 'Distingue as duas qualidades: aquilo que é bom e aquilo que traz benefício.'
- source_word: πᾶσιν ἀνθρώποις
  choice: a todos os seres humanos
  rationale: Traduz explicitamente o alcance universal e usa linguagem inclusiva natural sem apagar o substantivo ἀνθρώποις.
theological_decisions:
- issue: Agente da exaltação
  choice: 'manter a voz passiva: “for ... exaltado”'
  alternative: “subir ainda mais” ou “Deus o exaltar ainda mais”
  rationale: O grego não nomeia o agente; a tradução preserva essa ambiguidade e não introduz uma atribuição teológica.
- issue: Alcance da provisão do Senhor
  choice: “a todos os seres humanos”
  alternative: “a todos”
  rationale: Mantém o universal explícito de πᾶσιν ἀνθρώποις sem restringir a afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O contraste δέ foi vertido por “Antes”, que liga naturalmente a proibição da inveja à exortação positiva. Não há marcadores de nota no texto porque nenhuma nota é necessária.
