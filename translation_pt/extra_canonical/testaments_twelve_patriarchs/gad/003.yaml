base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003.yaml
  text: '1[a]. And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, my children, by the spirit of hatred, because it is evil in all the deeds of men. 2. For whatever the one who hates may do, it is abominable. If someone does the law of the Lord[b], the hater does not praise him. If someone fears the Lord and desires what is righteous, the hater does not love him. 3. He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.'
translation:
  language: pt
  text: '1[a] E agora ouçam uma palavra de verdade: ouçam para praticar a justiça e toda lei do Altíssimo. Meus filhos, não se deixem desviar pelo espírito do ódio, pois ele é mau em todas as ações humanas. 2 Tudo o que aquele que odeia fizer será abominável. Se alguém cumpre a lei do Senhor, aquele que odeia não o elogia. Se alguém teme o Senhor e deseja o que é justo, aquele que odeia não o ama. 3 Ele censura a verdade, inveja quem prospera[b], acolhe a calúnia e ama a arrogância, porque o ódio cega a sua alma, como cegou a minha quando eu olhava para José.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ouçam a palavra verdadeira”. A expressão grega inicial pode ser entendida como uma fórmula de exortação indefinida ou mais definida.'
    reason: lexical_alternative
  - marker: b
    text: “Quem prospera” também pode ser traduzido por “quem tem êxito” ou, possivelmente, “quem age corretamente”; o contexto imediato da inveja favorece a ideia de ação bem-sucedida.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: uma palavra de verdade
  rationale: Preserva a introdução solene sem tornar definida uma expressão grega que não tem artigo; a alternativa “a palavra verdadeira” é mantida em nota.
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: para praticar a justiça
  rationale: O infinitivo exprime finalidade, e “praticar a justiça” comunica conduta íntegra diante de Deus em português natural.
- source_word: πάντα νόμον ὑψίστου
  choice: toda a lei do Altíssimo
  rationale: Conserva o título divino elevado e entende πάντα νόμον como a totalidade da lei, sem reduzir νόμος a mandamentos isolados.
- source_word: πλανᾶσθε
  choice: não se deixem desviar
  rationale: Expressa a nuance médio-passiva de sofrer a influência desviadora do espírito do ódio.
- source_word: πνεύματι τοῦ μίσους
  choice: pelo espírito do ódio
  rationale: Mantém a personificação ou quase personificação da força moral sem impor uma leitura plenamente demonológica.
- source_word: βδελυκτόν
  choice: abominável
  rationale: Preserva a forte censura moral e religiosa do termo grego.
- source_word: φοβεῖται Κύριον
  choice: teme o Senhor
  rationale: Mantém o conhecido idioma bíblico em sua força reverencial e moral.
- source_word: θέλει τὸ δίκαιον
  choice: deseja o que é justo
  rationale: Comunica inclinação moral e preserva a relação lexical com justiça sem soar artificial em português.
- source_word: τὴν ἀλήθειαν ψέγει
  choice: censura a verdade
  rationale: Representa a reprovação expressa por ψέγει e mantém o ritmo do catálogo de vícios.
- source_word: τῷ κατορθοῦντι φθονεῖ
  choice: inveja quem prospera
  rationale: A associação com a inveja favorece o sentido de êxito ou prosperidade, embora o verbo também possa indicar agir corretamente.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: acolhe a calúnia
  rationale: Conserva a imagem de receber favoravelmente a fala difamatória em formulação corrente e digna.
theological_decisions:
- issue: Personificação do ódio como poder espiritual
  choice: “o espírito do ódio” no texto principal
  alternative: “um espírito de ódio” ou “a intenção odiosa”
  rationale: A formulação grega admite uma força moral personificada ou quase personificada. Manter “espírito” conserva essa tensão sem definir a expressão como referência obrigatória a um ser demoníaco.
- issue: Referente implícito nas ações do versículo 2
  choice: explicitar “aquele que odeia”
  alternative: deixar os verbos com sujeito oculto
  rationale: O grego estabelece ὁ μισῶν como sujeito temático. A explicitação em português evita que “não o elogia” e “não o ama” sejam atribuídos ambiguamente ao Senhor, sem acrescentar uma nova entidade ao texto.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. Emprega “vocês” de modo implícito nas formas verbais, evita arcaísmos e conserva os termos bíblicos “Altíssimo”, “Senhor”, “justiça” e “teme”. Os marcadores de nota aparecem no texto principal e correspondem às notas fornecidas.
