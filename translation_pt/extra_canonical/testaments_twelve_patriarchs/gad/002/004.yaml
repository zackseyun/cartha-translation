id: T12P.GAD.2.4
reference: Testament of Gad 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 5. Οὕτως¹⁴ ὁ Θεὸς τῶν πατέρων ἡμῶν ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν, ἵνα μὴ ποιήσωμεν ἐν τῷ Ἰσραὴλ ἀνομίαν μεγάλην. [β, Α, S¹] 4. Καὶ οὕτως τῇ πλεονεξίᾳ ἐπληροφορήθημεν¹⁹ τῆς ἀναιρέσεως αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/004.yaml
  text: 'Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    And so, through greed, we were fully persuaded of his murder.'
translation:
  language: pt
  text: 'Assim, o Deus de nossos pais o livrou de nossas mãos, para que não cometêssemos uma grande iniquidade em Israel.[a]


    E assim, por ganância, ficamos plenamente convencidos de matá-lo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta frase aparece no texto α como 2:5.
    reason: Informa a diferença de tradição textual e numeração presente na fonte grega sem ocultá-la.
  - marker: b
    text: Esta frase aparece como 2:4 nos testemunhos β, A e S¹.
    reason: Identifica os testemunhos que preservam esta forma e sua numeração na edição-fonte.
lexical_decisions:
- source_word: ἐρρύσατο
  choice: livrou
  rationale: Expressa naturalmente o resgate de alguém que estava sob o poder de outros, preservando a ação salvadora do verbo grego.
- source_word: ἀνομίαν μεγάλην
  choice: uma grande iniquidade
  rationale: Mantém o peso moral e religioso de ἀνομία sem restringi-lo a uma infração jurídica específica.
- source_word: πλεονεξίᾳ
  choice: por ganância
  rationale: O dativo indica aqui causa ou meio; “ganância” comunica em português corrente o desejo egoísta e excessivo expresso pelo termo.
- source_word: ἐπληροφορήθημεν
  choice: ficamos plenamente convencidos
  rationale: Preserva a forma passiva e a intensidade do verbo, sem enfraquecê-lo para mera intenção ou disposição.
- source_word: τῆς ἀναιρέσεως αὐτοῦ
  choice: de matá-lo
  rationale: No contexto, o substantivo ἀναίρεσις designa a morte violenta pretendida contra ele; a forma verbal é mais natural em português e evita a ambiguidade artificial de “do assassinato dele”.
theological_decisions:
- issue: Sentido de ἀνομία em relação à Lei
  choice: iniquidade
  alternative: transgressão da Lei
  rationale: “Iniquidade” preserva a dimensão moral e religiosa sem explicitar uma referência técnica à Lei que o grego não exige.
- issue: Força de ἐπληροφορήθημεν na intenção homicida
  choice: ficamos plenamente convencidos de matá-lo
  alternative: ficamos plenamente decididos a matá-lo
  rationale: A opção escolhida conserva mais diretamente a ideia de persuasão ou plena convicção, em vez de transformar o verbo em simples resolução volitiva.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva o paralelismo de “Assim / E assim” e mantém a tensão entre o livramento divino e a culpabilidade humana.
