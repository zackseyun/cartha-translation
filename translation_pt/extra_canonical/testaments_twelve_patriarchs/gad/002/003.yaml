source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 3. Καὶ κρυφῆ πράσας αὐτὸν Ἰούδας τοῖς Ἰσμαιλίταις. [β, Α, S¹] 3. Διὸ¹⁵ ἐγὼ καὶ Συμεὼν¹⁶ πεπράκαμεν αὐτὸν τοῖς Ἰσμαηλίταις [*τριάκοντα χρυσίων¹⁷, καὶ τὰ δέκα ἀποκρύψαντες τὰ εἴκοσι ἐδείξαμεν τοῖς ἀδελφοῖς ἡμῶν¹⁸].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/003.yaml
  text: 'But Judah sold him secretly to the Ishmaelites.


    Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers.'
translation:
  language: pt
  text: '[Texto α] E Judá o vendeu secretamente aos ismaelitas.


    [Textos β, A, S¹] Por isso, Simeão e eu o vendemos aos ismaelitas por trinta peças de ouro; escondemos dez e mostramos vinte aos nossos irmãos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A edição imprime entre colchetes a frase «por trinta peças de ouro; escondemos dez e mostramos vinte aos nossos irmãos», indicando incerteza textual quanto à sua presença ou ao seu estatuto no texto.
    reason: Reflete com precisão a marcação editorial fornecida, sem afirmar pormenores de distribuição entre manuscritos que não constam do excerto.
lexical_decisions:
- source_word: κρυφῆ πράσας
  choice: vendeu-o secretamente
  rationale: Expressa de modo natural tanto o ato de vender quanto seu caráter oculto.
- source_word: πεπράκαμεν
  choice: vendemos
  rationale: Equivalente direto e corrente para o perfeito grego, cujo resultado permanece relevante no relato.
- source_word: τριάκοντα χρυσίων
  choice: trinta moedas de ouro
  rationale: Χρυσίων designa peças ou moedas de ouro; 'moedas de ouro' é claro sem especificar uma denominação não indicada pelo grego.
- source_word: ἀποκρύψαντες ... ἐδείξαμεν
  choice: escondemos ... mostramos
  rationale: Mantém o contraste deliberado entre ocultar dez e apresentar vinte aos irmãos.
theological_decisions:
- issue: Divergência textual sobre quem vendeu José
  choice: Apresentar separadamente o texto α e os textos β, A e S¹
  alternative: Combinar as versões numa única narrativa ou escolher apenas uma delas
  rationale: 'As formas gregas preservadas divergem de maneira substantiva: uma atribui a venda secreta a Judá; a outra, a Simeão e Gad. Exibir ambas evita resolver silenciosamente a tensão textual e narrativa.'
- issue: Frase sobre as trinta moedas em testemunhos textuais
  choice: Incluir a frase no corpo do texto com nota textual
  alternative: Omiti-la ou tratá-la como indiscutivelmente original
  rationale: A edição sinaliza a passagem com marca crítica; a nota comunica sua condição sem apagar o conteúdo preservado.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. As duas formas textuais foram identificadas explicitamente porque não podem ser harmonizadas sem perda de evidência. Empregou-se 'o' como pronome referente a José, seguindo o contexto imediato do escrito.
