  text: Therefore I confess my sin, children, that many times I wanted to kill him, because I hated him from my soul.
translation:
  language: pt
  text: 'Portanto, confesso o meu pecado, filhos: muitas vezes quis matá-lo, porque o odiava do fundo da alma.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: confesso
  rationale: Expressa diretamente a admissão aberta do pecado no presente.
- source_word: πλειστάκις
  choice: muitas vezes
  rationale: Equivalente natural que preserva a ideia de repetição frequente.
- source_word: ἀνελεῖν
  choice: matá-lo
  rationale: Neste contexto, indica tirar deliberadamente a vida, e não apenas afastar ou destruir.
- source_word: ἐκ ψυχῆς
  choice: do fundo da alma
  rationale: Mantém a imagem da ψυχή e comunica em português um ódio profundo e interior.
