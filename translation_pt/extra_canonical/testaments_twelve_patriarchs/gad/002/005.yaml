base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/005.yaml
  text: But the God of my fathers rescued him from my hands, so that I might not commit a lawless deed in Israel.
translation:
  language: pt
  text: Mas o Deus dos meus pais o livrou das minhas mãos, para que eu não cometesse um ato contrário à Lei em Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρύσατο
  choice: livrou
  rationale: Expressa naturalmente a ideia de resgatar alguém de um perigo ou poder, preservando a ação divina sem sugerir necessariamente uma fuga física.
- source_word: ἐκ τῶν χειρῶν μου
  choice: das minhas mãos
  rationale: Mantém a imagem concreta e idiomática do grego, indicando que ele estava sob o poder do falante.
- source_word: ἀνόμημα
  choice: ato contrário à Lei
  rationale: Preserva a relação explícita do termo com νόμος, comunicando uma transgressão concreta sem reduzi-la apenas à criminalidade civil.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Conserva a formulação ambígua, que pode indicar tanto o povo quanto seu âmbito comunitário.
theological_decisions:
- issue: Sentido de ἀνόμημα
  choice: ato contrário à Lei
  alternative: ato perverso; transgressão
  rationale: A escolha mantém a dimensão normativa e religiosa do termo grego sem especificar qual mandamento teria sido violado.
- issue: Finalidade expressa por ἵνα μή com subjuntivo
  choice: para que eu não cometesse
  alternative: a fim de me impedir de cometer
  rationale: Preserva a construção final do grego e evita explicitar um mecanismo de ação divina que o texto não define.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação das imagens do original. A expressão “meus pais” foi mantida por sua ressonância ancestral e pactual.
