source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καίγε διὰ τὰ ἐνύπνια⁵ *προσεθέμην αὐτῷ τὸ μῖσος⁶, καὶ ἤθελον αὐτὸν⁷ ἐκλεῖξαι⁸ *ἐκ γῆς⁹ ⌈ζώντων⌉¹⁰, ὃν τρόπον¹¹ ἐκλείχει¹² ὁ μόσχος τὰ χλωρὰ *τοῦ πεδίου¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/002.yaml
  text: And because of the dreams I added hatred toward him, and I wanted to lick him up from the land of the living, as a calf licks up the green growth of the field.
translation:
  language: pt
  text: E, por causa dos sonhos, aumentei ainda mais o meu ódio contra ele e queria lambê-lo para fora da terra dos vivos, como um bezerro lambe a vegetação verde do campo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: aumentei ainda mais o meu ódio contra ele
  rationale: Expressa o sentido de acrescentar ou intensificar o ódio dirigido contra ele, em português natural, sem perder a ideia cumulativa do grego.
- source_word: ἐκλεῖξαι ἐκ γῆς ζώντων
  choice: lambê-lo para fora da terra dos vivos
  rationale: Preserva a metáfora incomum e violenta do verbo ‘lamber por completo/para fora’, esclarecida pela comparação seguinte, em vez de substituí-la por ‘eliminar’.
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: a vegetação verde do campo
  rationale: Traduz o substantivado plural como vegetação tenra ou verde, evitando a formulação menos idiomática ‘as coisas verdes’.
theological_decisions:
- issue: A expressão ‘terra dos vivos’ como imagem de morte ou destruição
  choice: manter literalmente ‘terra dos vivos’
  alternative: traduzir interpretativamente como ‘mundo dos vivos’ ou ‘matá-lo’
  rationale: A formulação tradicional preserva a imagem do texto e sua tensão, sem explicitar além do grego o resultado pretendido.
translation_notes:
  register: Português moderno, digno e acessível. A estranheza deliberada da imagem de ‘lamber para fora’ foi mantida porque a comparação com o bezerro lhe dá coerência interna.
