  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/002.yaml
  text: For the Lord will raise up from Levi a high priest, and from Judah a king, [God and man]; he will save [all the nations and] the race of Israel.
translation:
  language: pt
  text: Pois o Senhor levantará de Levi um sumo sacerdote e de Judá um rei, [Deus e homem][a]; ele salvará [todas as nações e][b] a descendência de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “Deus e homem” têm transmissão textual incerta e aparecem entre colchetes na edição grega consultada.
    reason: Sinalizar de maneira acessível a incerteza textual da expressão.
  - marker: b
    text: As palavras “todas as nações e” têm transmissão textual incerta e aparecem entre colchetes na edição grega consultada.
    reason: Preservar a variante que amplia o alcance da salvação sem tratá-la como texto indiscutível.
lexical_decisions:
- source_word: Ἀναστήσει
  choice: levantará
  rationale: Mantém o sentido de suscitar ou fazer surgir alguém para uma função, sem explicitar além do grego.
- source_word: ἐκ τοῦ Λευὶ / ἐκ τοῦ Ἰούδα
  choice: de Levi / de Judá
  rationale: Reproduz de modo natural a origem tribal ou genealógica expressa por ἐκ, preservando a concisão do texto.
- source_word: ὡς ἀρχιερέα / ὡς βασιλέα
  choice: como sumo sacerdote / como rei
  rationale: Conserva o valor comparativo ou funcional de ὡς, que não deve ser silenciosamente omitido.
- source_word: γένος τοῦ Ἰσραήλ
  choice: descendência de Israel
  rationale: Expressa o sentido genealógico de γένος em português atual e evita as conotações modernas potencialmente enganosas de “raça”.
- source_word: σώσει
  choice: salvará
  rationale: Equivalente direto que preserva tanto a força religiosa quanto a possibilidade de livramento coletivo.
theological_decisions:
- issue: Identidade da figura levantada de Levi e de Judá
  choice: “alguém” é repetido em ambas as expressões, sem declarar se se trata de uma única pessoa ou de duas
  alternative: “um sumo sacerdote... e um rei” ou explicitar “a mesma pessoa”
  rationale: A construção grega permite tensão quanto à relação entre as figuras; a tradução evita resolver essa questão por inferência teológica.
- issue: Expressão “Deus e homem”
  choice: preservada entre colchetes
  alternative: integrá-la sem colchetes ou omiti-la
  rationale: Os colchetes da edição sinalizam incerteza textual; mantê-los evita apresentar a expressão como indiscutivelmente original.
- issue: Alcance da salvação
  choice: “todas as nações e” preservado entre colchetes
  alternative: limitar a salvação à descendência de Israel ou incluir as nações sem ressalva
  rationale: A forma entre colchetes representa leitura textualmente incerta e deve permanecer visível ao leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “alguém como” reflete ὡς e evita uma formulação truncada, enquanto os colchetes e as notas tornam transparentes as incertezas textuais.
