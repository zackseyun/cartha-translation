revisions:
- from: Pois o Senhor levantará, de Levi, alguém como sumo sacerdote e, de Judá, alguém como rei — [Deus e homem][a]. Ele salvará [todas as nações e][b] a descendência de Israel.
  to: Pois o Senhor levantará de Levi um sumo sacerdote e de Judá um rei, [Deus e homem][a]; ele salvará [todas as nações e][b] a descendência de Israel.
  rationale: A revisão substitui a expressão comparativa potencialmente enganosa «alguém como» por uma formulação portuguesa direta para os cargos, em consonância com o sentido contextual de ὡς e com o audit trail inglês. Mantêm-se os colchetes e suas notas, sem decidir questões textuais ou teológicas sobre «Deus e homem», o alcance da salvação ou a relação precisa entre as figuras de Levi e Judá.
