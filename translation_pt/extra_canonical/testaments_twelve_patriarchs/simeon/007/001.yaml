base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/001.yaml
  text: And now, my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will rise for us.
translation:
  language: pt
  text: E agora, meus filhos, deem ouvidos a Levi e a Judá e não se coloquem acima dessas duas tribos, pois delas despontará para nós a salvação de Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “de Deus” apresentam incerteza na tradição textual grega.
    reason: A edição-fonte coloca τοῦ Θεοῦ entre sinais que indicam dúvida textual; a nota preserva essa informação sem interromper a leitura.
lexical_decisions:
- source_word: ἐπακούσατε
  choice: deem ouvidos a
  rationale: Expressa a ideia de escutar com atenção e acatar, preservando o complemento pessoal no genitivo.
- source_word: γενεὰς
  choice: tribos
  rationale: Embora o termo possa significar “gerações” ou “linhagens”, aqui Levi e Judá designam claramente os dois grupos tribais deles derivados.
- source_word: μὴ ἐπαίρεσθε ἐπὶ
  choice: não se coloquem acima de
  rationale: Transmite de modo natural a proibição de se elevar ou considerar superior em relação a outros.
- source_word: ἀνατελεῖ
  choice: despontará
  rationale: Preserva a imagem de algo que nasce ou se levanta, comum ao verbo grego, sem perder a naturalidade em português.
- source_word: τὸ σωτήριον
  choice: a salvação
  rationale: Equivalente substantivo natural em português para o que traz livramento ou salvação.
theological_decisions:
- issue: Sentido de “a salvação de Deus”
  choice: Manter o genitivo sem explicá-lo
  alternative: Traduzir como “a salvação que vem de Deus” ou “a salvação realizada por Deus”
  rationale: O grego pode indicar origem, posse ou ação divina; a formulação “de Deus” preserva essa abertura interpretativa.
- issue: Referência de “deles/delas”
  choice: Usar “delas”, retomando as duas tribos
  alternative: Usar “deles”, retomando Levi e Judá
  rationale: No contexto, a salvação desponta das duas tribos ou linhagens associadas a Levi e Judá; o feminino torna essa ligação explícita sem alterar o sentido contextual.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Deem ouvidos” conserva o tom de exortação; “despontará” mantém a imagem verbal grega.
