  choice: ordeno / as ordenem
  rationale: Preserva a força de dar uma ordem ou instrução vinculante, mantendo também a repetição verbal do grego.
- source_word: φυλάξωσιν
  choice: as guardem
  rationale: Expressa a ideia de observar e conservar fielmente as ordens recebidas.
- source_word: εἰς τὰς γενεὰς αὐτῶν
  choice: ao longo de suas gerações
  rationale: Formulação natural em português que conserva a continuidade pelas gerações dos descendentes, sem acrescentar uma identificação étnica ausente no texto.
