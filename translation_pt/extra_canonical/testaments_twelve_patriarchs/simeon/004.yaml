  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004.yaml
  text: 1[a]. Now my father kept asking about me, because he had seen me gloomy, and I told him, “My liver is swollen.” 2. For I was grieving more than all the others, because I was responsible for the sale of Joseph. 3. And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not distressed. 4. But Joseph was a good man[b], and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers. 5. Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you favor and glory and blessing upon your heads, just as you saw in Joseph. 6. All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us riches and livestock and produce. 7. And you also, my children, let each one love his brother with a good heart, and the spirit of
    envy will depart from you. 8. For this makes the soul savage, and destroys the body; it brings anger and war to one’s designs, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling. 9. For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body start up in fear, and wakes the mind in turmoil; and like an evil and venomous spirit[c][d], so he appears to people.
translation:
  language: pt
  text: '1. Meu pai continuava a perguntar por mim, pois tinha me visto abatido, e eu lhe disse: “Meu fígado está inchado”.[a] 2. Eu lamentava mais do que todos os outros, porque era responsável pela venda de José. 3. Quando descemos ao Egito e ele me prendeu como espião, compreendi que sofria com justiça e não fiquei aflito. 4. José, porém, era um homem bom e, tendo em si o Espírito de Deus,[b] sendo compassivo e misericordioso, não guardou rancor de mim, mas me amou juntamente com meus irmãos. 5. Portanto, meus filhos, protejam-se de todo ciúme e inveja[c] e andem com simplicidade de coração,[d] para que Deus também lhes conceda favor, glória e bênção sobre as cabeças de vocês, assim como vocês viram em José. 6. Em todos os seus dias, ele nunca nos censurou por esse assunto; pelo contrário, amou-nos como à sua própria alma, honrou-nos mais do que a seus próprios filhos e nos concedeu riquezas, rebanhos e frutos. 7. E vocês também, meus filhos, cada um ame seu irmão de bom coração, e o
    espírito da inveja se afastará de vocês. 8. Pois a inveja torna selvagem a alma e destrói o corpo; produz ira e guerra nos desígnios, incita ao derramamento de sangue, leva a mente ao delírio, causa perturbação à alma e tremor ao corpo. 9. Pois, até durante o sono, a inveja o consome, apresentando-lhe imagens de maldade; perturba sua alma com espíritos malignos, faz o corpo sobressaltar-se e desperta a mente em meio à agitação. E assim se apresenta às pessoas como um espírito maligno e venenoso.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meu fígado está inchado” preserva uma antiga expressão corporal ligada à angústia interior; Simeão dá ao pai uma explicação física para sua aparência abatida.
    reason: cultural_note
  - marker: b
    text: A expressão grega, sem artigo, também pode ser vertida por “espírito de Deus”; neste contexto, “o Espírito de Deus” expressa a provável referência à presença ou atuação divina em José.
    reason: alternative_reading
  - marker: c
    text: “Ciúme” e “inveja” traduzem dois termos gregos relacionados (ζῆλος e φθόνος), ambos empregados aqui em sentido negativo.
    reason: lexical_alternative
  - marker: d
    text: “Simplicidade de coração” também pode ser entendida como “sinceridade de coração” ou “coração íntegro”.
    reason: lexical_alternative
  - marker: e
    text: A frase final pode significar que a pessoa invejosa aparece aos outros como um espírito maligno e venenoso, ou que a própria inveja aparece dessa maneira.
    reason: alternative_reading
lexical_decisions:
- source_word: σκυθρωπόν
  choice: abatido
  rationale: Expressa uma aparência visivelmente triste e desanimada em português atual, sem atribuir hostilidade ou mau humor.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: Meu fígado está inchado
  rationale: Mantém a imagem corporal concreta e antiga do grego; a nota explica sua relação com a angústia interior.
- source_word: τῆς πράσεως
  choice: a venda
  rationale: Designa concretamente a venda de José, em vez de ampliar o sentido para uma traição genérica.
- source_word: δικαίως πάσχω
  choice: sofria com justiça
  rationale: Preserva o juízo moral de Simeão de que seu sofrimento era justo, sem explicitar além do texto que ele o merecia.
- source_word: ἀγαθὸς ἀνήρ
  choice: um homem bom
  rationale: Formulação direta e natural que comunica o caráter moral de José.
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  choice: tendo em si o Espírito de Deus
  rationale: Reproduz a construção participial e sua forte referência divina; a nota registra a possibilidade formal de entender 'espírito de Deus'.
- source_word: ἐμνησικάκησέν
  choice: não guardou rancor
  rationale: Equivalente idiomático moderno para não conservar ressentimento por uma ofensa.
- source_word: ζήλου καὶ φθόνου
  choice: ciúme e inveja
  rationale: Mantém os dois termos gregos relacionados e negativos neste contexto, sem fundi-los em um único vício.
- source_word: ἁπλότητι καρδίας
  choice: simplicidade de coração
  rationale: Conserva a linguagem ética do texto, que sugere um interior íntegro, sincero e não dividido.
- source_word: ψυχὴν αὐτοῦ
  choice: a própria alma
  rationale: Preserva a linguagem antropológica de ψυχή e sua distinção contextual de corpo e mente.
- source_word: κλόνον
  choice: perturbação
  rationale: Comunica a agitação ou convulsão interior causada à alma, em paralelo com o tremor do corpo.
- source_word: ἰοβόλον
  choice: venenoso
  rationale: Transmite a imagem de algo que lança ou inocula veneno, com linguagem portuguesa clara.
theological_decisions:
- issue: πνεῦμα θεοῦ em José
  choice: o Espírito de Deus
  alternative: um espírito de Deus / o espírito de Deus
  rationale: O contexto apresenta uma atuação ou presença divina em José, favorecendo a leitura pessoal forte; como o grego não usa artigo, a nota conserva a alternativa formal sem impor uma formulação doutrinária posterior.
- issue: Linguagem antropológica de ψυχή
  choice: alma
  alternative: vida / ser
  rationale: O capítulo distingue alma, corpo, mente e espírito em sua descrição moral e psicológica; traduzir ψυχή por 'alma' preserva essa textura conceitual.
- issue: Referente da oração final de 4:9
  choice: ele aparece às pessoas
  alternative: a pessoa invejosa aparece às pessoas / a inveja aparece às pessoas
  rationale: O grego permite relacionar a comparação tanto à pessoa dominada pela inveja quanto à própria inveja. O pronome português mantém a ambiguidade, explicitada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais como “vocês” e “protejam-se”. A sintaxe foi moderadamente ajustada para fluidez, mas imagens antigas, distinções antropológicas e ambiguidades reais foram preservadas no texto ou em notas.
