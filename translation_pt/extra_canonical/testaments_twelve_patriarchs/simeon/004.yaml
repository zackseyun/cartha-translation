    e o espírito da inveja se afastará de vocês. 8. Pois a inveja torna selvagem a alma e destrói o corpo; produz ira e guerra nos desígnios da pessoa, incita ao derramamento de sangue, leva a mente ao delírio, causa perturbação à alma e tremor ao corpo. 9. Pois, até durante o sono, a inveja o consome, apresentando-lhe imagens de maldade; perturba sua alma com espíritos malignos, faz o corpo sobressaltar-se e desperta a mente em meio à agitação. E, como um espírito maligno e venenoso, assim ele aparece às pessoas.[e]'
