    issue: Aspecto verbal de ἦσαν
    rationale: “Estiveram” é possível, mas o pretérito imperfeito grego ἦσαν é mais bem refletido por “estavam”, que apresenta a permanência no Egito como situação em curso até a saída.
  - severity: low
    issue: Ambiguidade de “sua saída”
    rationale: Em português, o possessivo singular pode remeter ao “pai” da oração precedente. “Da saída deles” explicita o referente plural αὐτῶν, isto é, os filhos de Simeão.
