  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009.yaml
  text: And the sons of Simeon wept for their father[c][b][a]. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: pt
  text: E os filhos de Simeão choraram por seu pai. E estavam no Egito até o dia da saída deles[a], pela mão de Moisés[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até o dia do êxodo deles”.'
    reason: lexical_alternative
  - marker: b
    text: “Pela mão de Moisés” é um idiomatismo bíblico que significa “por meio de Moisés” ou “sob a liderança de Moisés”.
    reason: cultural_note
  - marker: c
    text: 'Na fonte, a linha final passa diretamente ao título da obra seguinte: “O Testamento de Levi, terceiro filho de Jacó e Lia”. Esse título não faz parte de Simeão 9 propriamente dito.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: choraram
  rationale: O aoristo de κλαίω indica choro ou lamentação audível. “Choraram” é natural, digno e não acrescenta a ideia específica de ritos formais de luto.
- source_word: υἱοὶ Συμεὼν
  choice: filhos de Simeão
  rationale: “Filhos” preserva com precisão o registro genealógico e patriarcal do contexto.
- source_word: εἰς Αἴγυπτον
  choice: no Egito
  rationale: 'Embora εἰς normalmente expresse movimento para dentro, com ἦσαν e a expressão durativa funciona idiomaticamente como localização ou permanência: eles estavam no Egito.'
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: até o dia de sua saída
  rationale: ἐξόδου pode significar “saída”, “partida” ou “êxodo”. “Saída” mantém o substantivo comum e deixa perceptível a alusão histórica sem convertê-lo em título.
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: pela mão de Moisés
  rationale: A formulação conserva o conhecido idiomatismo bíblico de agência ou mediação e o tom escritural do texto.
theological_decisions:
- issue: Se ἐξόδου deve ser vertido como nome comum ou como o evento intitulado “Êxodo”
  choice: “saída” no texto principal
  alternative: “êxodo” ou “o Êxodo”
  rationale: O grego emprega o substantivo comum, sem marcar um título. A referência a Moisés torna clara a alusão ao êxodo histórico, sem necessidade de explicitá-la por capitalização ou terminologia mais interpretativa.
- issue: Grau de literalidade na tradução de ἐν χειρὶ Μωϋσῆ
  choice: manter o idiomatismo “pela mão de Moisés”
  alternative: “por meio de Moisés” ou “sob a liderança de Moisés”
  rationale: A expressão literal é inteligível em português bíblico e preserva a textura da fonte; as alternativas explicitam o sentido, mas eliminam a imagem semítica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva-se a coordenação simples das duas frases e o idiomatismo bíblico “pela mão de Moisés”. O marcador [c] foi colocado ao fim do texto para assinalar a transição textual descrita na nota, sem sugerir que o título seguinte pertença ao versículo.
