base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/002.yaml
  text: 'And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up, kissed them[b], and said:'
translation:
  language: pt
  text: 'Quando Simeão estava doente, seus filhos vieram visitá-lo. Reunindo forças, ele se sentou, beijou-os[b] e disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: O verbo grego traduzido por “beijou-os” é intensivo e pode sugerir que Simeão os beijou repetidamente ou com grande afeto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρρωστοῦντος
  choice: estava doente
  rationale: 'O particípio presente em construção genitiva indica a circunstância em curso: Simeão se encontrava doente quando os filhos chegaram.'
- source_word: ἐπισκέψασθαι
  choice: visitar
  rationale: No contexto, o infinitivo expressa a visita feita a uma pessoa enferma; a formulação é clara e natural em português.
- source_word: ἐνισχύσας
  choice: reunindo forças
  rationale: Expressa que Simeão se fortaleceu ou fez um esforço para conseguir sentar-se, sem acrescentar a ideia não explícita de recuperação duradoura.
- source_word: κατεφίλησεν
  choice: beijou-os
  rationale: O verbo intensivo pode sugerir beijos repetidos ou afetuosos. A tradução principal permanece natural, e a nuance é preservada em nota.
