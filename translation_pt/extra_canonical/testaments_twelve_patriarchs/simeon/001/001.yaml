  text: Διαθήκη Συμεὼν τοῦ δευτέρου υἱοῦ Ἰακὼβ καὶ Λίας¹. I. *¹Ἀντίγραφον λόγων² Συμεών, ἃ³ ἐλάλησε τοῖς υἱοῖς αὐτοῦ⁴, *πρὸ τοῦ ἀποθανεῖν⁵ αὐτὸν⁶ *ἐν ἑκατοστῷ εἰκοστῷ ἔτει⁷ τῆς ζωῆς αὐτοῦ⁸ *ἐν ᾧ χρόνῳ⁹ ἀπέθανεν Ἰωσὴφ ὁ ἀδελφὸς αὐτοῦ¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/001.yaml
  text: A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died.
translation:
  language: pt
  text: Uma cópia[a] das palavras de Simeão, que ele falou a seus filhos antes de morrer, no centésimo vigésimo ano de sua vida, na época em que morreu seu irmão José.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Um registro das palavras de Simeão”.'
    reason: Alternativa lexical para Ἀντίγραφον, que pode designar uma cópia ou um registro escrito.
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Uma cópia
  rationale: Mantém o sentido mais direto de uma reprodução escrita; a alternativa possível, “registro”, é preservada em nota.
- source_word: λόγων
  choice: das palavras
  rationale: Equivalente natural e formalmente próximo, adequado às declarações que Simeão dirigiu aos filhos.
- source_word: πρὸ τοῦ ἀποθανεῖν
  choice: antes de morrer
  rationale: Expressão corrente em português que reproduz com clareza a relação temporal do grego.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  choice: no centésimo vigésimo ano de sua vida
  rationale: Preserva com precisão a formulação cronológica do texto grego em registro digno e compreensível.
- source_word: ἐν ᾧ χρόνῳ
  choice: na época em que
  rationale: Reproduz a referência temporal sem impor uma simultaneidade mais exata do que a expressão grega exige.
