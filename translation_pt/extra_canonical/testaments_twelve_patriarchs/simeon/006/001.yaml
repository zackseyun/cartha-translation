base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/001.yaml
  text: Behold, I have told you everything, so that I may be justified from your sin.
translation:
  language: pt
  text: Eis que lhes disse tudo, para que eu seja justificado do pecado de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Eis que
  rationale: Preserva o marcador enfático e solene do grego em linguagem bíblica ainda compreensível.
- source_word: εἴρηκα
  choice: disse
  rationale: Expressa naturalmente o perfeito grego no contexto, indicando que Simeão já comunicou tudo aos ouvintes.
- source_word: πάντα
  choice: tudo
  rationale: Equivalente direto e idiomático.
- source_word: δικαιωθῶ
  choice: eu seja justificado
  rationale: Mantém o sentido forense e a formulação formal de δικαιόω, sem reduzi-lo a mera absolvição ou exoneração.
- source_word: ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: do pecado de vocês
  rationale: Conserva a preposição ἀπό e a ambiguidade da relação entre a justificação do falante e o pecado dos destinatários.
theological_decisions:
- issue: Sentido de δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: para que eu seja justificado do pecado de vocês
  alternative: para que eu fique livre da culpa pelo pecado de vocês
  rationale: A opção adotada segue mais de perto a construção grega e preserva sua tensão teológica e semântica, sem explicitar uma culpa compartilhada que o texto não declara diretamente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve solenidade em “Eis que”. Emprega “vocês” para o plural ὑμῖν/ὑμῶν, favorecendo legibilidade brasileira sem regionalismo marcado.
