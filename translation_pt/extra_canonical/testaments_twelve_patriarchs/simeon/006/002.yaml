source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν δὲ⁴ ἀφέλητε⁵ ἀφ᾽ ὑμῶν τὸν φθόνον καὶ πᾶσαν σκληροκαρδίαν⁶, Ὡς⁷ ῥόδον ἀνθήσει⁸ τὰ ὀστᾶ μου⁹ ἐν Ἰσραήλ, καὶ¹⁰ ὡς κρίνον *ἡ σάρξ μου¹⁰ ἐν Ἰακώβ, καὶ ἔσται¹¹ *ἡ ὀσμή μου ὡς¹² ὀσμὴ Λιβάνου,¹³ καὶ πληθυνθήσονται¹⁴ ἅγιοι¹⁵ *ἐξ ἐμοῦ¹⁶ *ἕως αἰῶνας¹⁷ αἰώνων¹⁷ καὶ *οἱ κλάδοι¹⁸ αὐτῶν¹⁹ εἰς μακρὰν ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/002.yaml
  text: But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.
translation:
  language: pt
  text: Mas, se vocês removerem de vocês mesmos a inveja e toda dureza de coração, meus ossos florescerão como uma rosa em Israel, e minha carne, como um lírio em Jacó; meu aroma será como o aroma do Líbano. De mim se multiplicarão santos para todo o sempre, e os ramos deles se estenderão para longe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: inveja
  rationale: Equivalente direto e natural para o sentimento de ciúme ou ressentimento expresso pelo termo grego.
- source_word: σκληροκαρδίαν
  choice: dureza de coração
  rationale: Preserva a metáfora antropológica do composto grego e mantém linguagem bíblica inteligível.
- source_word: ῥόδον
  choice: rosa
  rationale: Tradução tradicional e provável do nome floral, sem substituir a imagem por uma identificação botânica mais especulativa.
- source_word: κρίνον
  choice: lírio
  rationale: Equivalente tradicional que conserva a imagem floral, embora o termo grego possa abranger flores semelhantes ao lírio.
- source_word: ὀσμή
  choice: aroma
  rationale: Comunica uma fragrância perceptível e agradável neste contexto, com naturalidade em português.
- source_word: ἅγιοι
  choice: santos
  rationale: Mantém o substantivo plural e sua possível dimensão religiosa sem explicitar se designa descendentes, pessoas consagradas ou justas.
- source_word: εἰς μακράν
  choice: para longe
  rationale: Reproduz a extensão espacial indefinida da expressão grega sem acrescentar destino ou alcance específico.
theological_decisions:
- issue: Identidade dos “santos” que procedem de Simeão
  choice: De mim se multiplicarão santos
  alternative: Muitos descendentes santos procederão de mim
  rationale: A formulação conserva a concisão e a ambiguidade do grego, que não contém explicitamente “descendentes”.
- issue: Sentido da restauração corporal e floral
  choice: meus ossos florescerão... e minha carne, como um lírio
  alternative: minha descendência florescerá
  rationale: Preserva literalmente a tensão das imagens corporais do texto, sem convertê-las silenciosamente em uma interpretação genealógica.
- issue: Duração expressa por ἕως αἰῶνας αἰώνων
  choice: para todo o sempre
  alternative: pelos séculos dos séculos
  rationale: Expressão portuguesa corrente que transmite duração ilimitada, sem definir filosoficamente a natureza dessa eternidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada em “De mim se multiplicarão santos” para soar natural sem eliminar a ênfase na origem. Mantiveram-se as imagens corporais, florais e genealógicas do grego.
