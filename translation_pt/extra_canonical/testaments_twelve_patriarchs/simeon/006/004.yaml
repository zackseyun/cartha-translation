base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/004.yaml
  text: Then the land of Ham will perish, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.
translation:
  language: pt
  text: Então a terra de Cam desaparecerá, e todo povo perecerá. Então toda a terra deixará de estar em tumulto, e tudo o que há debaixo dos céus deixará de estar em guerra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείψει
  choice: desaparecerá
  rationale: O verbo pode indicar cessar, faltar ou desaparecer. Aqui, aplicado à terra de Cam em contexto de juízo, “desaparecerá” comunica sua eliminação sem simplesmente igualá-lo ao verbo seguinte, ἀπολεῖται.
- source_word: ἡ γῆ Χάμ
  choice: a terra de Cam
  rationale: Preserva a referência geográfica e tradicional do grego, sem substituir Cam por uma identificação histórica interpretativa.
- source_word: πᾶς ὁ λαὸς
  choice: todo o povo
  rationale: Mantém o singular coletivo de λαός. Embora possa ser entendido de modo distributivo, “todo o povo” reproduz mais diretamente a forma grega.
- source_word: ἀπὸ ταραχῆς
  choice: de estar em tumulto
  rationale: Em combinação com καταπαύσει, esta formulação natural em português expressa a cessação de agitação, desordem ou perturbação.
- source_word: πᾶσα ἡ ὑπ᾿ οὐρανῶν
  choice: tudo o que há debaixo dos céus
  rationale: Supre em português o referente elíptico do grego e conserva o plural “céus”, evitando restringi-lo a povos ou terras.
theological_decisions:
- issue: Alcance de πᾶς ὁ λαός
  choice: todo o povo
  alternative: todos os povos
  rationale: O grego apresenta λαός no singular; por isso, a tradução não amplia explicitamente a declaração para todas as nações, embora a expressão possa ter sentido coletivo abrangente.
- issue: Paralelo entre a terra de Cam e toda a terra
  choice: manter as duas expressões distintas
  alternative: interpretar ambas como referências universais
  rationale: O texto passa de uma região nomeada para uma afirmação de alcance universal. A tradução preserva essa progressão sem harmonizá-las.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “Então” e a estrutura paralela foram mantidas. A segunda ocorrência de “deixará de estar” foi explicitada para produzir uma frase natural e inequívoca em português.
