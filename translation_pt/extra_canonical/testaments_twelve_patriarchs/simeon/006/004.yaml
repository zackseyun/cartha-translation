review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto a sequência e o paralelismo do grego. «A terra de Cam» preserva ἡ γῆ Χάμ, e «desaparecerá» é uma representação defensável de ἐκλείψει no contexto. Contudo, «todo o povo» em português normalmente significa a totalidade de um povo específico já identificado; sem antecedente, isso pode restringir indevidamente πᾶς ὁ λαός. «Todo povo» expressa melhor o valor distributivo/genérico preservado também pela auditoria inglesa («every people»).
  naturalness: O texto é claro e digno. «Deixará de estar em tumulto/em guerra» é compreensível, mas algo perifrástico; não exige alteração para a fidelidade. A repetição de «Então» e a construção paralela são adequadas.
  terminology: «Cam» é a forma portuguesa estabelecida para Χάμ. «Terra», «tumulto», «céus» e «guerra» preservam as imagens e o registro do original, sem impor identificação histórica ou interpretação teológica.
  issues:
  - severity: medium
    issue: «todo o povo» pode ser lido como «a população inteira de um único povo»
    rationale: πᾶς ὁ λαός, neste enunciado sem um povo previamente especificado, é mais bem conservado em português por «todo povo», que pode designar cada povo sem introduzir um referente particular ausente no grego.
  revised_text: Então a terra de Cam desaparecerá, e todo povo perecerá. Então toda a terra deixará de estar em tumulto, e tudo o que há debaixo dos céus deixará de estar em guerra.
