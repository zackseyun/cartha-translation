revisions:
- from: Então a terra de Cam desaparecerá, e todo o povo perecerá. Então toda a terra deixará de estar em tumulto, e tudo o que há debaixo dos céus deixará de estar em guerra.
  to: Então a terra de Cam desaparecerá, e todo povo perecerá. Então toda a terra deixará de estar em tumulto, e tudo o que há debaixo dos céus deixará de estar em guerra.
  rationale: A única alteração necessária é retirar o artigo de «todo o povo», para evitar que o português identifique um povo determinado não expresso no texto de partida. O restante da redação é mantido, inclusive a distinção entre o desaparecimento da terra de Cam e o perecimento de todo povo, bem como a extensão universal das cláusulas finais.
