  text: Τότε ἀναστησόμαι⁵⁶ κἀγὼ⁵⁷ ἐν⁵⁸ εὐφροσύνῃ καὶ εὐλογήσω⁵⁹ τὸν ὕψιστον ἐπὶ⁶⁰ τοῖς θαυμασίοις αὐτοῦ [ὅτι ὁ⁶¹ Θεὸς σῶμα λαβών, καὶ⁶² συνεσθίων ἀνθρώποις *ἔσωσεν ἀνθρώπους⁶³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/007.yaml
  text: Then I also will arise in gladness, and I will bless the Most High for his wonders [because God, having taken a body and eaten with men, saved men].
translation:
  language: pt
  text: Então eu também me levantarei com alegria e bendirei o Altíssimo por suas maravilhas [porque Deus, tendo assumido um corpo, salvou seres humanos enquanto comia com seres humanos][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase entre colchetes tem condição textual incerta na tradição grega.
    reason: Explica ao leitor o significado editorial dos colchetes sem retirar a cláusula do texto.
lexical_decisions:
- source_word: ἀναστησόμαι
  choice: me levantarei
  rationale: Mantém o sentido básico do futuro médio e preserva a possível ressonância de ressurreição sem explicitá-la além do grego.
- source_word: ἐν εὐφροσύνῃ
  choice: com alegria
  rationale: Expressão natural em português para o estado ou modo alegre indicado pela construção grega.
- source_word: εὐλογήσω
  choice: bendirei
  rationale: Equivalente tradicional, digno e claro para louvar ou declarar bendito.
- source_word: τὸν ὕψιστον
  choice: o Altíssimo
  rationale: Preserva o título divino substantivado.
- source_word: ἐπὶ τοῖς θαυμασίοις αὐτοῦ
  choice: por suas maravilhas
  rationale: Expressa naturalmente o fundamento do louvor, sem reduzir θαυμάσια a milagres em sentido estrito.
- source_word: σῶμα λαβών
  choice: tendo assumido um corpo
  rationale: Reproduz a construção participial e comunica com naturalidade a ideia de tomar para si um corpo.
- source_word: συνεσθίων ἀνθρώποις
  choice: comido com seres humanos
  rationale: Preserva a ação concreta de compartilhar refeições; 'seres humanos' representa ἀνθρώποις sem restringi-lo a homens do sexo masculino.
- source_word: ἔσωσεν ἀνθρώπους
  choice: salvou os seres humanos
  rationale: Mantém o verbo teologicamente carregado 'salvar' e o alcance humano genérico de ἀνθρώπους.
theological_decisions:
- issue: Possível sentido de ressurreição em ἀναστησόμαι
  choice: me levantarei
  alternative: ressuscitarei
  rationale: O contexto pode sugerir ressurreição, mas o verbo também significa levantar-se. A tradução conserva essa ambiguidade em vez de resolvê-la.
- issue: Afirmação sobre Deus assumir um corpo
  choice: porque Deus, tendo assumido um corpo
  alternative: porque Deus se fez carne
  rationale: A escolha segue a formulação específica do grego, σῶμα λαβών, sem substituí-la pela linguagem joanina nem impor uma formulação dogmática posterior.
- issue: Status textual da cláusula final
  choice: manter a cláusula entre colchetes
  alternative: integrá-la sem colchetes ou omiti-la
  rationale: Os colchetes da edição-fonte sinalizam incerteza ou condição editorial da passagem; preservá-los torna essa tensão textual visível.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição de “seres humanos” é mantida para refletir a repetição de ἀνθρώποις/ἀνθρώπους e evitar leitura exclusivamente masculina.
