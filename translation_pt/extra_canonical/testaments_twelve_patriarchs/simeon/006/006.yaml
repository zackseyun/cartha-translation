base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/006.yaml
  text: Then all the spirits of deceit will be given over to trampling, and men will rule over the evil spirits.
translation:
  language: pt
  text: Então todos os espíritos do engano serão entregues ao pisoteio, e os seres humanos dominarão os espíritos malignos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: os espíritos do engano
  rationale: Mantém a construção genitiva e a ideia de engano ou desvio expressa por πλάνη, em linguagem natural e digna.
- source_word: εἰς καταπάτησιν
  choice: para serem pisados
  rationale: Expressa de modo claro o destino de sujeição e humilhação indicado por καταπάτησις; a forma passiva é exigida naturalmente em português pelo contexto de δοθήσεται.
- source_word: οἱ ἄνθρωποι
  choice: os seres humanos
  rationale: Representa o plural genérico ἄνθρωποι sem restringi-lo desnecessariamente ao sexo masculino.
- source_word: βασιλεύσουσιν τῶν πονηρῶν πνευμάτων
  choice: dominarão os espíritos malignos
  rationale: O verbo βασιλεύω comunica exercício de governo ou domínio; 'dominarão' produz uma construção portuguesa natural, embora o grego use genitivo.
theological_decisions:
- issue: Natureza do domínio humano sobre os espíritos malignos
  choice: dominarão os espíritos malignos
  alternative: reinarão sobre os espíritos malignos
  rationale: A tradução conserva a afirmação de autoridade humana sem explicar sua forma, agente ou alcance escatológico, evitando acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene sem arcaísmos; 'seres humanos' é inclusivo e semanticamente preciso.
