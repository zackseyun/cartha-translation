  text: Then the seed of Canaan will perish, and no remnant will remain in Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed.
translation:
  language: pt
  text: Então a descendência de Canaã perecerá, e não restará remanescente em Amaleque; todos os capadócios perecerão, e todos os hititas serão completamente exterminados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ σπέρμα Χαναάν
  choice: a descendência de Canaã
  rationale: Neste contexto coletivo e genealógico, «descendência» comunica com naturalidade o sentido de σπέρμα sem recorrer ao literalismo menos claro «semente».
- source_word: ἐγκατάλειμμα
  choice: sobrevivente algum
  rationale: O substantivo indica aquilo ou aquele que resta; em uma enumeração de povos destinados à destruição, «sobrevivente» expressa naturalmente o referente humano.
- source_word: ἐν τῷ Ἀμαλήκ
  choice: entre os amalequitas
  rationale: Embora a forma grega diga literalmente «em Amalec», o nome designa aqui o povo; «entre os amalequitas» preserva o valor locativo de ἐν e soa claro em português.
- source_word: ἐξολοθρευθήσονται
  choice: serão completamente exterminados
  rationale: A formulação mantém a força intensiva do verbo e sua forma passiva futura.
theological_decisions:
- issue: Alcance das declarações de destruição
  choice: Manter as afirmações universais e enfáticas do texto
  alternative: Atenuar para uma derrota ou redução parcial dos povos
  rationale: Os quantificadores πάντες e o verbo intensivo ἐξολοθρευθήσονται não autorizam atenuação interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura profética no futuro e o paralelismo entre os grupos foram preservados.
