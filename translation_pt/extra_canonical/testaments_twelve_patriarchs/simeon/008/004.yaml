  text: '*Ἔλεγον γὰρ ⌜αὐτοῖς⌝¹⁷ οἱ ἐπαοιδοί¹⁸, ὅτι ἐν ἐξόδῳ τῶν¹⁹ ὀστῶν Ἰωσὴφ²⁰ ἔσται ἐν πάσῃ *τῇ γῇ²¹ σκότος καὶ γνόφος καὶ πληγὴ²² μεγάλη²³ τοῖς Αἰγυπτίοις, ὥστε μετὰ λύχνου²⁴ μὴ²⁵ ἐπιγινώσκειν ἕκαστος²⁶ *τὸν ἀδελφὸν²⁷ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/004.yaml
  text: For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague on the Egyptians, so that each man would not recognize his brother, even with a lamp.
translation:
  language: pt
  text: Pois os encantadores lhes diziam que, quando os ossos de José fossem levados para fora, haveria em toda a terra escuridão, trevas e uma grande praga sobre os egípcios, de modo que cada um não reconheceria seu irmão, nem mesmo com uma lamparina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαοιδοί
  choice: encantadores
  rationale: Designa praticantes de encantamentos ou fórmulas mágicas; «encantadores» conserva essa referência de modo natural e sem especificar indevidamente uma função sacerdotal.
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσήφ
  choice: quando os ossos de José fossem levados para fora
  rationale: Expressa a saída ou remoção dos ossos de José e mantém a relação temporal indicada por ἐν com o substantivo ἔξοδος.
- source_word: σκότος καὶ γνόφος
  choice: escuridão, trevas
  rationale: Preserva os dois termos próximos, mas distintos, que intensificam a ausência de luz.
- source_word: πληγὴ μεγάλη τοῖς Αἰγυπτίοις
  choice: uma grande praga sobre os egípcios
  rationale: πληγή pode indicar golpe, flagelo ou praga; no contexto de calamidade contra o Egito, «praga» é claro e adequado, enquanto «sobre» reproduz o alvo da aflição.
- source_word: μετὰ λύχνου
  choice: nem mesmo com uma lamparina
  rationale: λύχνος é uma pequena lâmpada alimentada a óleo; «lamparina» é compreensível e historicamente apropriado.
- source_word: ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: ninguém reconheceria o próprio irmão
  rationale: A construção grega significa literalmente que cada um não reconheceria seu irmão; a formulação portuguesa transmite naturalmente o valor distributivo sem sugerir que apenas homens estejam incluídos.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente inteligível, com boa legibilidade brasileira. A tradução conserva a acumulação enfática «escuridão, trevas» e evita identificar os encantadores com uma classe religiosa mais específica do que o grego permite.
