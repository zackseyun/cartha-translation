source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔθηκαν αὐτὸν ἐν *θήκῃ ξυλίνῃ⁹, *τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ¹⁰ ἐν Χεβρών. Καὶ ἀνήγαγον¹¹ *αὐτὰ ἐν πολέμῳ Αἰγυπτίων κρυφῇ¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/002.yaml
  text: And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly in a war of the Egyptians.
translation:
  language: pt
  text: E o colocaram num caixão de madeira, a fim de levar seus ossos para Hebrom. E os levaram secretamente durante uma guerra dos egípcios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θήκῃ ξυλίνῃ
  choice: num caixão de madeira
  rationale: θήκη pode designar uma caixa ou receptáculo; no contexto funerário, «caixão» comunica naturalmente o sentido, enquanto ξυλίνῃ especifica o material.
- source_word: ἀναγαγεῖν / ἀνήγαγον
  choice: levar para / levaram
  rationale: O verbo indica conduzir ou transportar para cima; em português, «levar para Hebrom» evita uma indicação topográfica excessivamente explícita, e a repetição preserva a ligação verbal do grego.
- source_word: ἐν πολέμῳ Αἰγυπτίων
  choice: durante uma guerra dos egípcios
  rationale: Embora ἐν tenha o sentido básico de «em», a expressão temporal idiomática em português é «durante uma guerra»; o genitivo «dos egípcios» foi preservado sem especificar quem combatia contra quem.
- source_word: κρυφῇ
  choice: secretamente
  rationale: Reproduz diretamente o valor adverbial de uma ação feita às escondidas.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. O referente pronominal muda naturalmente de «o» (Simeão ou seu corpo) para «seus ossos», seguindo o grego. Não foram acrescentadas explicações históricas nem identificados os participantes da guerra.
