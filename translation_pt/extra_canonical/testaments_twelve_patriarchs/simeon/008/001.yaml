source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ὡς¹ συνετέλεσεν² Συμεὼν ἐντελλόμενος³ τοῖς υἱοῖς⁴ αὐτοῦ⁵, ἐκοιμήθη⁶ *μετὰ τῶν πατέρων αὐτοῦ⁷ *ὢν ἐτῶν ἑκατὸν εἴκοσι⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/001.yaml
  text: And when Simeon had finished commanding his sons, he fell asleep with his fathers, being one hundred and twenty years old.
translation:
  language: pt
  text: E, quando Simeão terminou de dar instruções a seus filhos, adormeceu com seus antepassados, aos cento e vinte anos de idade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντελλόμενος
  choice: dar instruções
  rationale: Expressa naturalmente a ideia de transmitir ordens ou determinações finais, sem a rigidez potencial de “ordenar” em português moderno.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva o eufemismo grego para a morte e sua imagem literária, sem explicá-lo no corpo do texto.
- source_word: πατέρων
  choice: antepassados
  rationale: Neste contexto funerário, refere-se aos ancestrais, não apenas aos pais imediatos; “antepassados” comunica com clareza o sentido idiomático.
- source_word: ὢν ἐτῶν ἑκατὸν εἴκοσι
  choice: aos cento e vinte anos de idade
  rationale: Formulação portuguesa natural e fiel para indicar a idade de Simeão ao morrer.
theological_decisions:
- issue: O eufemismo do sono para a morte
  choice: adormeceu com seus antepassados
  alternative: morreu e reuniu-se a seus antepassados
  rationale: A tradução mantém a metáfora explícita do grego e evita resolver teologicamente o que significa estar “com” os antepassados.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção conserva o tom narrativo testamentário e a imagem tradicional de adormecer com os antepassados.
