source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Φυλάξασθε οὖν¹⁶ *ἀπὸ τῆς πορνείας¹⁷, ὅτι *ἡ πορνεία¹⁸ μήτηρ¹⁹ ἐστὶ²⁰ τῶν κακῶν, χωρίζουσα²¹ *ἀπὸ τοῦ²² θεοῦ καὶ προσεγγίζουσα²³ τῷ Βελίαρ²⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/003.yaml
  text: Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.
translation:
  language: pt
  text: Portanto, guardem-se da imoralidade sexual, pois a imoralidade sexual é a mãe dos males, afastando de Deus e aproximando de Beliar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: guardem-se
  rationale: Reproduz o imperativo médio e a ideia de vigilância e proteção pessoal em linguagem natural.
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Expressão ampla e corrente que representa o campo semântico de conduta sexual ilícita sem restringi-lo a um único ato.
- source_word: μήτηρ τῶν κακῶν
  choice: a mãe dos males
  rationale: Preserva a metáfora enfática e o plural genérico do grego.
- source_word: χωρίζουσα ἀπὸ τοῦ θεοῦ
  choice: afastando de Deus
  rationale: Mantém a construção participial e a noção de separação, sem acrescentar um objeto que o grego deixa implícito.
- source_word: προσεγγίζουσα τῷ Βελίαρ
  choice: aproximando de Beliar
  rationale: Conserva o paralelismo com o particípio anterior e translitera o nome próprio Βελίαρ.
theological_decisions:
- issue: Objeto implícito dos particípios χωρίζουσα e προσεγγίζουσα
  choice: 'manter o objeto implícito: “afastando de Deus e aproximando de Beliar”'
  alternative: explicitar “afastando a pessoa de Deus e aproximando-a de Beliar”
  rationale: O texto grego não expressa diretamente o objeto; a formulação escolhida preserva essa concisão e ambiguidade sintática genuína.
- issue: Identidade de Beliar
  choice: manter o nome “Beliar” sem identificação interpretativa
  alternative: traduzir ou explicar como “o Diabo/Satanás”
  rationale: A transliteração evita importar uma equivalência teológica não declarada neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla legibilidade brasileira. A repetição de “imoralidade sexual” e a metáfora “mãe dos males” foram preservadas por sua força retórica.
