  text: Καὶ ἔσονται ὀλιγοστοί³⁶ ἐπιμεριζόμενοι³⁷ *ἐν τῷ³⁸ Λευὶ καὶ *ἐν τῷ³⁹ Ἰούδᾳ⁴⁰ καὶ οὐκ⁴¹ ἔσται ἐξ ὑμῶν *τις εἰς ἡγεμονίαν⁴² καθὼς καὶ ὁ πατὴρ ἡμῶν⁴³ προεφήτευσεν⁴⁴ *ἐν ταῖς⁴⁵ εὐλογίαις⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/006.yaml
  text: And they will be few in number, being divided among Levi and among Judah, and none from among you will be for leadership, just as our father also prophesied in the blessings.
translation:
  language: pt
  text: E eles serão poucos em número, repartidos entre Levi e Judá, e não haverá entre vocês ninguém em posição de liderança, como nosso pai também profetizou nas bênçãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοστοί
  choice: poucos
  rationale: Expressa diretamente a ideia de serem poucos em número, sem tornar explícito mais do que o grego.
- source_word: ἐπιμεριζόμενοι
  choice: repartidos
  rationale: Preserva o sentido de distribuição ou divisão entre grupos, com formulação natural em português.
- source_word: ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ
  choice: entre Levi e Judá
  rationale: Em contexto distributivo, «entre» comunica de modo idiomático que eles estarão repartidos no meio desses dois grupos.
- source_word: εἰς ἡγεμονίαν
  choice: para exercer a liderança
  rationale: Mantém a construção de finalidade ou função do grego sem especificar indevidamente uma forma particular de governo.
- source_word: ἐν ταῖς εὐλογίαις
  choice: nas bênçãos
  rationale: Conserva o plural definido do texto grego e evita acrescentar o possessivo «suas», ausente na fonte.
theological_decisions:
- issue: Identidade do grupo que será pouco e repartido
  choice: Manter o pronome «eles»
  alternative: Explicitar «seus descendentes» ou «os simeonitas»
  rationale: O versículo depende do antecedente contextual, e o grego não repete nem explicita a identidade do grupo.
- issue: Natureza da liderança negada
  choice: Usar a expressão geral «exercer a liderança»
  alternative: Traduzir por «governar», «ser príncipe» ou «assumir o poder»
  rationale: ἡγεμονίαν é suficientemente amplo para abranger liderança ou governo; uma designação política mais específica resolveria indevidamente essa amplitude.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto o encadeamento do grego, mas evita construções artificiais. Não foram necessárias notas de rodapé.
