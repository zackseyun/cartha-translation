base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/004.yaml
  text: For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.
translation:
  language: pt
  text: Pois eu vi no escrito de Enoque que os filhos de vocês se corromperão na imoralidade sexual e cometerão injustiça contra os filhos de Levi com a espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: no escrito de Enoque
  rationale: Expressa de modo natural a referência a um registro escrito associado a Enoque, sem sobrecarregar o texto com a formulação incomum de χαρακτήρ.
- source_word: ἐν πορνείᾳ
  choice: na imoralidade sexual
  rationale: Mantém a construção com ἐν e traduz πορνεία por uma expressão ampla e corrente, sem restringi-la a um ato sexual específico.
- source_word: φθαρήσονται
  choice: se corromperão
  rationale: Preserva a forma passiva/média e a ideia de corrupção ou ruína moral, sem determinar explicitamente um agente.
- source_word: ἀδικήσουσιν
  choice: cometerão injustiça contra
  rationale: Conserva o sentido amplo de agir injustamente ou causar dano, evitando especificar uma agressão não explicitada pelo verbo.
- source_word: ἐν ῥομφαίᾳ
  choice: com a espada
  rationale: Traduz o instrumento de modo direto e idiomático.
theological_decisions:
- issue: Agência na corrupção dos filhos
  choice: se corromperão na imoralidade sexual
  alternative: serão corrompidos pela imoralidade sexual
  rationale: A forma grega permite nuance passiva ou média, enquanto ἐν indica esfera ou contexto; a tradução preserva essa tensão sem transformar a imoralidade sexual inequivocamente em agente.
- issue: Natureza da injustiça contra os levitas
  choice: cometerão injustiça contra os filhos de Levi com a espada
  alternative: ferirão os filhos de Levi com a espada
  rationale: O texto emprega ἀδικέω, de alcance mais amplo que 'ferir'; por isso, não se explicita além do grego a forma exata da violência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural 'vocês' comunica com clareza a segunda pessoa plural do contexto. A redação mantém a ambiguidade do grego quanto ao modo da corrupção e à natureza precisa da injustiça.
