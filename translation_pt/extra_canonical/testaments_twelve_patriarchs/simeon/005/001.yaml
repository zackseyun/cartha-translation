base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/001.yaml
  text: Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.
translation:
  language: pt
  text: Por isso, José era belo de corpo e formoso de aparência, porque nele não habitava mal algum; pois o rosto revela a perturbação do espírito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει
  choice: belo de corpo
  rationale: Expressa de modo natural a beleza quanto à forma física, preservando a distinção em relação à aparência mencionada em seguida.
- source_word: καλὸς τῇ ὄψει
  choice: formoso de aparência
  rationale: Mantém o paralelismo do grego e distingue a impressão visível da forma corporal.
- source_word: ἐνοίκησεν ἐν αὐτῷ
  choice: nele não habitava
  rationale: Preserva a metáfora de habitação do verbo grego, com ordem natural em português.
- source_word: ταραχῆς τοῦ πνεύματος
  choice: perturbação do espírito
  rationale: Traduz diretamente a agitação ou desordem interior, sem definir se πνεῦμα se refere especificamente ao espírito humano, à disposição ou ao estado interior.
- source_word: τὸ πρόσωπον δηλοῖ
  choice: o rosto revela
  rationale: Verte δηλοῖ por uma expressão corrente que comunica tornar visível ou manifesto.
theological_decisions:
- issue: Relação entre o estado interior e a aparência exterior
  choice: pois o rosto revela a perturbação do espírito
  alternative: pois a perturbação do espírito se manifesta no rosto
  rationale: Mantém o rosto como sujeito gramatical, conforme o grego, e preserva a formulação sapiencial sem ampliar a afirmação.
- issue: Sentido de πνεῦμα
  choice: espírito
  alternative: íntimo
  rationale: Conserva o equivalente formal e a ambiguidade do termo grego, sem impor uma leitura psicológica ou teológica mais específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção clara e paralelismo discreto. A tradução segue o grego como fonte primária e usa a camada inglesa apenas como consulta.
