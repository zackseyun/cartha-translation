  text: Ἀλλ' οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι³², ὅτι *πόλεμον Κυρίου πολεμήσει³³ καὶ νικήσει ⌜πᾶσαν⌝³⁴ παρεμβολὴν³⁵ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/005.yaml
  text: But they will not be able to stand against Levi, because he will wage the Lord’s war and will defeat your whole camp.
translation:
  language: pt
  text: Mas eles não poderão resistir a Levi, porque ele travará a guerra do Senhor e derrotará todo o acampamento de vocês.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra grega traduzida por “todo” é de leitura incerta.
    reason: A edição fornecida assinala πᾶσαν como textualmente incerto; a nota explicita a incerteza sem a resolver no texto principal.
  - marker: b
    text: 'Ou: “todo o exército de vocês”.'
    reason: παρεμβολή pode referir-se ao acampamento ou, por extensão, às forças nele reunidas.
lexical_decisions:
- source_word: ἀντιστῆναι
  choice: resistir
  rationale: Expressa naturalmente a ideia de opor-se e manter posição contra alguém, sem acrescentar uma imagem ausente do contexto.
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: travará a guerra do Senhor
  rationale: Reproduz o objeto cognato grego em português idiomático e mantém a guerra caracterizada como pertencente ao Senhor.
- source_word: νικήσει
  choice: derrotará
  rationale: É a equivalência natural no contexto militar e preserva o sentido de obter vitória sobre o adversário.
- source_word: παρεμβολὴν
  choice: acampamento
  rationale: Mantém o sentido concreto primário do termo grego, embora neste contexto ele também possa designar coletivamente as forças acampadas.
theological_decisions:
- issue: Relação de Levi com a guerra do Senhor
  choice: “travará a guerra do Senhor”
  alternative: “lutará na guerra do Senhor”
  rationale: A formulação escolhida conserva a expressão enfática do grego sem explicar se Levi atua por mandato, em favor ou como instrumento do Senhor, deixando intacta essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Vocês” comunica o plural de ὑμῶν sem arcaísmo; “resistir”, “travará” e “derrotará” mantêm o tom militar do original.
