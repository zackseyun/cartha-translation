  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/002.yaml
  text: And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will find favor before the Lord and men.
translation:
  language: pt
  text: E agora, meus filhos, tornem bons os seus corações diante do Senhor, e endireitem os seus caminhos diante das pessoas, e encontrarão favor diante do Senhor e das pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: tornem bom o coração de vocês
  rationale: Conserva a imagem e o imperativo do grego, usando uma construção clara em português sem reduzir a expressão apenas a sentimentos ou intenções.
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: endireitem os seus caminhos
  rationale: Mantém a metáfora bíblica de tornar retos os caminhos, com linguagem natural e reconhecível.
- source_word: ἀνθρώπων
  choice: pessoas
  rationale: O plural grego é genérico e se refere aos seres humanos em geral; “pessoas” comunica isso com clareza no português atual.
- source_word: χάριν
  choice: favor
  rationale: Reproduz o sentido de acolhimento ou boa aceitação no contexto, sem acrescentar uma interpretação teológica mais específica.
theological_decisions:
- issue: Relação entre conduta humana e o favor encontrado diante de Deus e das pessoas
  choice: Preservar a sequência exortação–resultado sem explicá-la como mérito ou causa salvífica
  alternative: Explicitar que a boa conduta conquista ou merece o favor divino
  rationale: O grego afirma que eles encontrarão favor, mas não define uma doutrina de mérito; a tradução mantém essa tensão sem ampliá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para concordar naturalmente com os imperativos plurais e mantém as metáforas centrais do original.
