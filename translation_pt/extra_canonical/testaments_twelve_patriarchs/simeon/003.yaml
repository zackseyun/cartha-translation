  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003.yaml
  text: And now[a], my children, hear me, and guard yourselves from the spirit of deceit and envy. For envy masters a man's whole mind, and does not allow him either to eat or to drink or to do anything good. But it is always urging him to kill the one envied; and while the one envied is always flourishing, the one who envies wastes away[b]. For two years, then, in the fear of the Lord I afflicted my soul with fasting, and I learned that release from envy comes through the fear of God. For if anyone flees for refuge to the Lord, the evil spirit runs away from him, and his mind becomes light. And from then on he has compassion on the one envied, and forgives those who love him[c], and so he ceases from envy.
translation:
  language: pt
  text: '**Testamento de Simeão 3**


    **1** E agora, meus filhos, escutem-me e guardem-se do espírito do engano[a] e da inveja. **2** Pois a inveja domina toda a mente do ser humano e não lhe permite comer, beber nem fazer coisa alguma de bom. **3** Ao contrário, ela está sempre instigando-o a matar aquele que é invejado; e, enquanto o invejado sempre floresce, quem inveja definha[b]. **4** Durante dois anos, portanto, no temor do Senhor, afligi minha alma com jejum, e compreendi que a libertação da inveja acontece por meio do temor de Deus. **5** Pois, se alguém busca refúgio no Senhor, o espírito maligno foge dele, e sua mente se torna leve. **6** Daí em diante, ele se compadece do invejado e perdoa os que o amam[c]; assim, deixa de invejar.


    [a] Ou “espírito do erro” ou “espírito da ilusão”. O termo grego *plánē* pode indicar tanto engano como desvio para o erro.


    [b] Literalmente, “o que é invejado… o que inveja”. O grego acentua o contraste entre o alvo da inveja e a pessoa invejosa.


    [c] “Os que o amam” pode referir-se tanto à pessoa antes invejada como à pessoa que está sendo curada da inveja; o pronome grego é breve, e o contexto não elimina essa ambiguidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espírito do erro” ou “espírito da ilusão”. O termo grego *plánē* pode indicar tanto engano como desvio para o erro.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “o que é invejado… o que inveja”. O grego acentua o contraste entre o alvo da inveja e a pessoa invejosa.
    reason: lexical_alternative
  - marker: c
    text: “Os que o amam” pode referir-se tanto à pessoa antes invejada como à pessoa que está sendo curada da inveja; o pronome grego é breve, e o contexto não elimina essa ambiguidade.
    reason: alternative_reading
lexical_decisions:
- source_word: φυλάξασθε
  choice: guardem-se
  rationale: O imperativo médio tem força reflexiva e expressa vigilância moral; “guardem-se” conserva a exortação paterna e é natural em português.
- source_word: πνεῦμα τῆς πλάνης
  choice: espírito do engano
  rationale: πλάνη pode significar erro, ilusão ou engano. “Engano” comunica aqui uma força moral que desvia, enquanto a nota preserva as alternativas legítimas.
- source_word: φθόνος
  choice: inveja
  rationale: O termo designa ressentimento hostil diante do bem alheio. “Inveja” é mais preciso que “ciúme” e mantém uniforme o tema do capítulo.
- source_word: κυριεύει πάσης τῆς διανοίας
  choice: domina toda a mente
  rationale: κυριεύει expressa domínio, e διάνοια designa a faculdade de pensar e querer. A formulação preserva a intensidade sem soar artificial.
- source_word: ὑποβάλλει
  choice: está sempre instigando-o
  rationale: O verbo descreve sugestão ou incitação interior. “Instigando” conserva a pressão contínua indicada por πάντοτε.
- source_word: ἀνθεῖ / μαραίνεται
  choice: floresce / definha
  rationale: O par mantém a imagem vegetal e o contraste enfático entre a prosperidade do invejado e a deterioração de quem inveja.
- source_word: ἐκάκωσα τὴν ψυχήν μου
  choice: afligi minha alma
  rationale: A expressão é deliberadamente severa e ascética; esta tradução preserva o idioma e sua ligação explícita com o jejum.
- source_word: λύσις τοῦ φθόνου
  choice: libertação da inveja
  rationale: λύσις é soltura ou libertação. A expressão comunica ser liberto do poder vinculante da inveja.
- source_word: καταφύγῃ
  choice: busca refúgio
  rationale: O verbo indica fugir para um lugar ou pessoa em busca de proteção; a formulação conserva a imagem sem impor uma leitura adicional.
- source_word: κούφη
  choice: leve
  rationale: A tradução retém a metáfora grega de uma mente aliviada de seu peso, sem explicá-la excessivamente.
- source_word: συγγινώσκει
  choice: perdoa
  rationale: No contexto relacional, o verbo pode significar compreender, relevar ou perdoar. “Perdoa” expressa de modo corrente a cessação da hostilidade, sem alterar a ambiguidade do pronome seguinte.
theological_decisions:
- issue: Tradução de κύριος e θεός no contexto exortativo judaico
  choice: Senhor / Deus
  alternative: SENHOR / Deus
  rationale: O grego emprega κύριος e θεός em sucessão, sem apresentar aqui uma citação direta que represente explicitamente o nome divino hebraico. “Senhor” e “Deus” seguem a forma do texto grego.
- issue: Agência espiritual em τὸ πονηρὸν πνεῦμα
  choice: o espírito maligno
  alternative: um espírito maligno; o impulso maligno
  rationale: O artigo grego favorece a expressão definida, e o texto retrata o vício como poder espiritual. A tradução preserva essa tensão e não reduz a expressão a mera psicologia.
- issue: Referente do pronome em τοῖς ἀγαπῶσιν αὐτόν
  choice: os que o amam
  alternative: os que amam o invejado; os que amam aquele que está sendo curado
  rationale: O pronome grego admite mais de um referente contextual. A tradução mantém a forma ambígua, e a nota explicita as possibilidades sem decidir entre elas.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantiveram-se as imagens fortes do grego (“floresce”, “definha”, “mente… leve”) e a terminologia uniforme de “inveja”. Os pronomes foram formulados sem eliminar ambiguidades reais do original.
