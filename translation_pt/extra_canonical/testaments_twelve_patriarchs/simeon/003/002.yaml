  text: Καὶ γὰρ ὁ φθόνος κυριεύει *πάσης τῆς διανοίας τοῦ ἀνθρώπου⁶ καὶ οὐκ ἀφίησιν⁷ αὐτὸν Γοὔτε φαγεῖν, οὔτε πιεῖν, οὔτε¹ ποιῆσαί τι⁸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/002.yaml
  text: For envy masters the whole mind of a person, and does not allow him either to eat or to drink or to do anything good.
translation:
  language: pt
  text: Pois a inveja domina toda a mente da pessoa e não lhe permite nem comer, nem beber, nem fazer coisa alguma de bom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  choice: inveja
  rationale: Equivalente direto e corrente, adequado ao vício personificado como força dominadora.
- source_word: κυριεύει
  choice: domina
  rationale: Conserva a ideia de exercer senhorio ou controle, com naturalidade no português moderno.
- source_word: πάσης τῆς διανοίας τοῦ ἀνθρώπου
  choice: toda a mente da pessoa
  rationale: Reproduz a abrangência de πάσης e traduz ἄνθρωπος de modo inclusivo e natural, sem restringir o sentido ao sexo masculino.
- source_word: οὐκ ἀφίησιν
  choice: não lhe permite
  rationale: No contexto, expressa claramente a ideia de não deixar ou impedir alguém de agir.
- source_word: ποιῆσαί τι ἀγαθόν
  choice: fazer coisa alguma de bom
  rationale: Mantém o alcance indefinido da expressão grega e soa idiomático em português.
