  text: Καὶ νῦν, τέκνα¹ μου² Γἀκούσατέ μου καὶ¹³ φυλάξασθε⁴ ἀπὸ *τοῦ πνεύματος⁵ τῆς πλάνης καὶ τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/001.yaml
  text: And now, my children, hear me and guard yourselves against the spirit of deceit and envy.
translation:
  language: pt
  text: E agora, meus filhos, escutem-me e guardem-se do espírito do engano e da inveja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: escutem-me
  rationale: Reproduz de modo natural o imperativo de ouvir com atenção, preservando o pronome expresso pelo genitivo μου.
- source_word: φυλάξασθε ἀπό
  choice: guardem-se de
  rationale: Expressa em português corrente a ideia de manter-se protegido e afastado de uma influência nociva.
- source_word: πνεύματος τῆς πλάνης
  choice: espírito do engano
  rationale: Mantém a formulação concreta e a possível personificação do grego, sem decidir se πνεῦμα designa um ser espiritual, uma influência ou uma disposição.
- source_word: φθόνου
  choice: inveja
  rationale: É o equivalente português direto e natural para o vício ou impulso designado por φθόνος.
theological_decisions:
- issue: Sentido de πνεῦμα em “espírito do engano e da inveja”
  choice: Preservar “espírito” sem explicação no texto
  alternative: Traduzir como “influência”, “atitude” ou “disposição”
  rationale: O grego permite mais de uma compreensão; conservar “espírito” preserva a ambiguidade e evita impor uma interpretação ontológica ou psicológica.
- issue: Relação dos genitivos τῆς πλάνης καὶ τοῦ φθόνου com πνεύματος
  choice: “do engano e da inveja”
  alternative: “que engana e causa inveja”
  rationale: A construção nominal reflete a forma grega e não explicita além da fonte a relação entre o espírito e esses dois males.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos no padrão brasileiro de tratamento por “vocês”. A coordenação foi mantida simples e oral, adequada a uma exortação paterna.
