source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν γάρ²¹ τις ἐπὶ Κύριον καταφύγῃ, *ἀποτρέχει τὸ πονηρὸν πνεῦμα ἀπʼ αὐτοῦ²², καὶ γίνεται ἡ διάνοια²³ κούφη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/005.yaml
  text: For if anyone takes refuge in the Lord, the evil spirit runs away from him, and the mind becomes light.
translation:
  language: pt
  text: Pois, se alguém se refugia no Senhor, o espírito maligno foge dele, e a mente fica leve.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fica aliviada”.'
    reason: O adjetivo grego κούφη significa literalmente “leve” e pode sugerir que a mente fica livre de um peso ou de uma opressão.
lexical_decisions:
- source_word: καταφύγῃ
  choice: se refugia
  rationale: Expressa de modo natural o ato de buscar proteção no Senhor, preservando a imagem de refúgio do verbo grego.
- source_word: ἀποτρέχει
  choice: foge
  rationale: Comunica diretamente o movimento de afastar-se correndo; em português, “foge” é mais idiomático do que uma reprodução literal como “corre para longe”.
- source_word: διάνοια
  choice: mente
  rationale: Abrange aqui a faculdade interior do pensamento e da disposição mental, sem restringi-la apenas ao intelecto.
- source_word: κούφη
  choice: leve
  rationale: Preserva a imagem grega de leveza em contraste com peso ou opressão, sem explicitar além do texto o modo exato dessa condição.
theological_decisions:
- issue: Relação entre refugiar-se no Senhor e a fuga do espírito maligno
  choice: Mantida como afirmação condicional direta
  alternative: Explicitar como promessa de libertação espiritual automática ou como mera metáfora psicológica
  rationale: O grego apresenta a sequência sem definir seu mecanismo; a tradução preserva essa tensão e evita impor uma interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Se refugia no Senhor” mantém a imagem central; “a mente fica leve” conserva a formulação concisa e sugestiva do grego.
