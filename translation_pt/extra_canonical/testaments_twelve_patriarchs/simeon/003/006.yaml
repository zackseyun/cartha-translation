  text: And from then on he has compassion for the one envied, and forgives those who love him, and so he ceases from envy.
translation:
  language: pt
  text: E, daí em diante, ele se compadece de quem é alvo da inveja e perdoa os que o amam; assim, deixa de sentir inveja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιπόν
  choice: daí em diante
  rationale: Expressa naturalmente a progressão temporal ou lógica indicada no contexto.
- source_word: συμπαθεῖ τῷ φθονουμένῳ
  choice: se compadece de quem é alvo da inveja
  rationale: Transmite a compaixão para com a pessoa invejada sem sugerir que ela própria sente inveja.
- source_word: συγγινώσκει
  choice: perdoa
  rationale: Neste uso com dativo, o verbo pode significar mostrar compreensão, relevar ou perdoar; “perdoa” preserva o sentido adotado pela camada auditada e é claro no contexto.
- source_word: παύεται τοῦ φθόνου
  choice: deixa de sentir inveja
  rationale: Formulação portuguesa natural que explicita o fim da disposição invejosa, sem alterar o conteúdo.
theological_decisions:
- issue: Referente de αὐτόν em τοῖς ἀγαπῶσιν αὐτόν
  choice: “o” em “os que o amam”
  alternative: Explicitar “os que amam a pessoa invejada” ou “os que amam o invejoso”
  rationale: O pronome grego masculino singular não identifica de modo inequívoco o referente. A tradução mantém a mesma abertura referencial, sem impor uma interpretação.
translation_notes:
  register: Português atual, digno e acessível, com construção de ampla compreensão no Brasil e em outros contextos lusófonos. “Quem é alvo da inveja” evita o possível estranhamento ou a leitura equivocada de “o invejado”.
