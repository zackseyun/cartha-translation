base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/004.yaml
  text: For two years, then, in fear of the Lord I afflicted my soul with fasting, and I learned that the release from envy comes through fear of God.
translation:
  language: pt
  text: Durante dois anos, portanto, no temor do Senhor, afligi a minha alma com jejum e aprendi que a libertação da inveja acontece por meio do temor de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάκωσα τὴν ψυχήν μου
  choice: afligi a minha alma
  rationale: Reproduz de modo natural e digno a expressão grega, que descreve a autodisciplina ascética sem especificar além do texto.
- source_word: ἐν νηστείᾳ
  choice: com jejum
  rationale: Expressa o meio pelo qual a alma foi afligida; é mais idiomático em português do que uma reprodução rígida de ἐν.
- source_word: ἡ λύσις τοῦ φθόνου
  choice: a libertação da inveja
  rationale: Preserva a imagem de λύσις como soltura ou libertação e mantém φθόνος como 'inveja', sem reduzir a expressão a mero controle emocional.
- source_word: διὰ φόβου θεοῦ
  choice: por meio do temor de Deus
  rationale: Mantém o valor instrumental de διά com genitivo e traduz φόβος pela expressão religiosa tradicional e ainda corrente 'temor'.
theological_decisions:
- issue: Relação entre o temor de Deus e a libertação da inveja
  choice: acontece por meio do temor de Deus
  alternative: vem do temor de Deus
  rationale: A formulação escolhida preserva explicitamente o caráter instrumental de διά, sem afirmar uma relação causal mais abrangente do que a indicada pelo grego.
translation_notes:
  register: Português moderno, claro e digno, com cadência próxima do texto grego. 'Temor' foi mantido por sua precisão no contexto religioso; 'portanto' representa οὖν e liga esta afirmação ao argumento precedente.
