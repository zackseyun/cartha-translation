base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/003.yaml
  text: But it always urges him to kill the one envied; and the one envied always flourishes, while the one who envies wastes away.
translation:
  language: pt
  text: Mas sempre o instiga a matar aquele que é alvo de inveja; e aquele que é alvo de inveja sempre floresce, enquanto o invejoso definha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποβάλλει
  choice: instiga
  rationale: Expressa naturalmente a ideia de incitar ou induzir alguém a uma ação, preservando a força negativa do contexto.
- source_word: ἀνελεῖν
  choice: a matar
  rationale: Neste contexto, o infinitivo indica eliminar mediante morte; “matar” é direto, claro e fiel.
- source_word: τὸν φθονούμενον
  choice: aquele que é alvo de inveja
  rationale: Preserva o sentido passivo do particípio grego sem recorrer ao pouco natural “o invejado”.
- source_word: ἀνθεῖ
  choice: floresce
  rationale: Mantém a metáfora vegetal do grego para prosperar ou vicejar.
- source_word: ὁ φθονῶν
  choice: o invejoso
  rationale: Forma portuguesa concisa e natural para aquele que nutre inveja.
- source_word: μαραίνεται
  choice: definha
  rationale: Conserva o contraste metafórico com “floresce”, comunicando murchar ou consumir-se progressivamente.
theological_decisions:
- issue: Referente do sujeito implícito de ὑποβάλλει
  choice: Manter o sujeito implícito em “sempre o instiga”
  alternative: Explicitar como “a inveja sempre o instiga”
  rationale: O fragmento grego pressupõe um referente no contexto anterior; explicitá-lo aqui resolveria uma referência que o próprio versículo deixa gramaticalmente implícita.
- issue: Gênero do pronome objeto em ὑποβάλλει
  choice: “o instiga”
  alternative: “instiga a pessoa”
  rationale: O contexto e a tradução de consulta entendem como objeto o homem dominado pela inveja; a formulação conserva essa leitura sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A construção mantém o paralelismo antitético e a imagem de florescer versus definhar. Não há notas de rodapé necessárias.
