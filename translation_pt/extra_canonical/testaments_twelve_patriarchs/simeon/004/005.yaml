  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/005.yaml
  text: Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you grace and glory and blessing upon your heads, just as you saw in Joseph.
translation:
  language: pt
  text: Portanto, protejam-se, meus filhos, de todo ciúme e inveja e andem em simplicidade de coração, para que Deus também lhes dê graça, glória e bênção sobre as cabeças de vocês, assim como vocês viram em José.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: protejam-se
  rationale: Expressa naturalmente a exortação reflexiva de manter-se em guarda contra disposições nocivas.
- source_word: ζήλου καὶ φθόνου
  choice: ciúme e inveja
  rationale: Mantém distintos os dois termos gregos, sem fundi-los; neste contexto, ζῆλος tem sentido negativo.
- source_word: ἁπλότητι καρδίας
  choice: simplicidade de coração
  rationale: Preserva a formulação antropológica e moral do grego, com linguagem clara e digna.
- source_word: χάριν
  choice: graça
  rationale: É a correspondência teológica e lexical mais direta para χάρις neste contexto.
- source_word: ἐπὶ τὰς κεφαλὰς ὑμῶν
  choice: sobre a cabeça
  rationale: Conserva a imagem concreta do original; o singular distributivo em português soa mais natural com o referente plural.
theological_decisions:
- issue: Relação entre a conduta exortada e os dons de Deus
  choice: para que Deus também lhes dê
  alternative: a fim de que Deus também lhes conceda
  rationale: Mantém a oração final do grego sem explicar se ela indica condição, propósito ou consequência, preservando a tensão do texto.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira. Mantém o tom paterno e exortativo, bem como as imagens e a sequência de bênçãos do grego.
