base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/003.yaml
  text: And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not grieved.
translation:
  language: pt
  text: E, quando descemos ao Egito e ele me prendeu como espião, reconheci que sofria com justiça e não me entristeci.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβημεν
  choice: descemos
  rationale: Preserva a expressão geográfica convencional de descer ao Egito e o aspecto pontual do aoristo.
- source_word: ἔδησέ με
  choice: ele me prendeu
  rationale: No contexto de detenção, «prendeu» comunica naturalmente o ato de restringir ou manter sob custódia, sem exigir que o texto especifique o tipo de amarra.
- source_word: ὡς κατάσκοπον
  choice: como espião
  rationale: Equivalência direta e corrente para a acusação ou condição sob a qual Simeão foi preso.
- source_word: ἔγνων
  choice: reconheci
  rationale: Expressa que Simeão chegou a compreender e admitir o caráter justo do próprio sofrimento.
- source_word: δικαίως πάσχω
  choice: sofria com justiça
  rationale: Mantém o presente πάσχω dentro do discurso indireto mental e conserva a noção de sofrimento merecido sem explicitar uma causa não declarada.
- source_word: οὐκ ἐλυπούμην
  choice: não me entristeci
  rationale: Verte o sentido de pesar ou tristeza de λυπέομαι de modo natural, sem intensificá-lo para angústia ou desespero.
theological_decisions:
- issue: Caráter justo do sofrimento
  choice: «sofria com justiça»
  alternative: «sofria merecidamente»
  rationale: A formulação escolhida preserva a relação explícita com δικαίως e não define além do texto se a justiça é retributiva, providencial ou apenas reconhecida pela personagem.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem rigidez. O sujeito de «ele» permanece implícito quanto à identidade, como no contexto imediato do original fornecido.
