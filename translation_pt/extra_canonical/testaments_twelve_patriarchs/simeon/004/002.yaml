  text: Ἐπένθουν γὰρ *παρὰ πάντας⁷ ὅτι ἐγὼ ἤμην⁸ αἴτιος *τῆς πράσεως⁹ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/002.yaml
  text: For I was grieving more than all the others, because I was responsible for the sale of Joseph.
translation:
  language: pt
  text: Pois eu lamentava mais do que todos os outros, porque era responsável pela venda de José.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπένθουν
  choice: lamentava
  rationale: Expressa o pesar profundo e continuado indicado pelo imperfeito, em linguagem natural e digna.
- source_word: παρὰ πάντας
  choice: mais do que todos os outros
  rationale: Traduz o valor comparativo da expressão e explicita, sem alterar o sentido, que a comparação é com as demais pessoas envolvidas.
- source_word: αἴτιος
  choice: responsável
  rationale: Preserva a atribuição de responsabilidade causal sem intensificá-la para uma formulação jurídica ou doutrinária.
- source_word: τῆς πράσεως Ἰωσήφ
  choice: pela venda de José
  rationale: Neste contexto, πρᾶσις designa a venda; a formulação portuguesa é clara e mantém José como a pessoa vendida.
theological_decisions:
- issue: Grau de responsabilidade de Simeão
  choice: era responsável
  alternative: era o responsável
  rationale: A ausência do artigo em português evita afirmar exclusividade absoluta de responsabilidade, preservando a tensão entre a participação de Simeão e a ação coletiva dos irmãos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperfeito foi mantido para comunicar pesar contínuo, e a relação causal introduzida por γάρ foi vertida por “Pois”.
