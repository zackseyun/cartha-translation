revisions:
- from: Durante todos os seus dias, ele não nos censurou por esse assunto, mas nos amou como à própria alma, honrou-nos mais do que a seus próprios filhos e nos concedeu riquezas, rebanhos e colheitas.
  to: Durante toda a sua vida, ele não nos censurou por esse assunto, mas amou-nos como à sua própria alma, honrou-nos mais do que a seus próprios filhos e nos concedeu bens, animais de criação e colheitas.
  rationale: A revisão preserva o sentido e a estrutura do grego, tornando explícita a posse em «sua própria alma» e evitando restringir κτήνη a uma espécie ou tipo específico de gado. «Bens» oferece uma equivalência direta e natural para πλοῦτον no elenco de dádivas materiais.
