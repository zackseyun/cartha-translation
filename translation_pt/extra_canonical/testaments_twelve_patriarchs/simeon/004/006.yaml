base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/006.yaml
  text: All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us wealth and livestock and produce.
translation:
  language: pt
  text: Durante toda a sua vida, ele não nos censurou por esse assunto, mas amou-nos como à sua própria alma, honrou-nos mais do que a seus próprios filhos e nos concedeu bens, animais de criação e colheitas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠνείδισεν
  choice: censurou
  rationale: Expressa uma repreensão marcada por reprovação, em português corrente e digno.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: como à própria alma
  rationale: Preserva a imagem antropológica do grego, sem reduzi-la interpretativamente a “como a si mesmo”.
- source_word: ἐδόξασεν
  choice: honrou
  rationale: No contexto relacional, indica conferir honra ou distinção, não necessariamente glorificação em sentido cultual.
- source_word: πλοῦτον
  choice: riquezas
  rationale: Representa naturalmente bens materiais concedidos e combina com os itens concretos seguintes.
- source_word: κτήνη
  choice: rebanhos
  rationale: Neste contexto patrimonial, refere-se coletivamente aos animais domésticos possuídos.
- source_word: καρπὸν
  choice: colheitas
  rationale: O singular coletivo designa a produção da terra; “colheitas” comunica isso com clareza em português moderno.
