base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/001.yaml
  text: My father kept asking about me, because he had seen me gloomy, and I said to him, “My liver is swollen.”
translation:
  language: pt
  text: 'Meu pai continuava fazendo perguntas a meu respeito, porque tinha me visto com o semblante sombrio, e eu lhe dizia: “Meu fígado está inchado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐρωτῶν
  choice: continuava fazendo perguntas
  rationale: A construção perifrástica com particípio presente expressa ação contínua ou repetida; a formulação portuguesa comunica essa duração com naturalidade.
- source_word: περὶ ἐμοῦ
  choice: a meu respeito
  rationale: Reproduz o sentido amplo de ‘acerca de mim’ sem especificar indevidamente a quem as perguntas eram dirigidas.
- source_word: σκυθρωπόν
  choice: com o semblante sombrio
  rationale: O adjetivo descreve uma aparência triste, fechada ou abatida; a expressão mantém o componente visual sugerido por ἑώρακέ.
- source_word: ἔλεγον αὐτῷ
  choice: eu lhe dizia
  rationale: O imperfeito é mantido para representar uma fala repetida ou contínua, em paralelo com as perguntas do pai.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: Meu fígado está inchado
  rationale: Expressa em português corrente a alegação de inchaço do fígado, evitando uma reprodução artificial do plural grego e da construção verbal incomum.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição indicada pelos imperfeitos gregos foi preservada por ‘continuava fazendo’ e ‘dizia’.
