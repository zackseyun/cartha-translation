  source_fidelity: A tradução representa com precisão a perífrase imperfeita ἦν ... ἐρωτῶν como ação continuada, preserva περὶ ἐμοῦ sem acrescentar destinatários das perguntas, e verte adequadamente o perfeito ἑώρακέ por «tinha me visto». «Com o semblante sombrio» comunica de modo fiel o aspecto abatido/fechado de σκυθρωπόν. «Eu lhe dizia» mantém o valor imperfeito de ἔλεγον. «Meu fígado está inchado» é uma forma portuguesa natural para a alegação expressa por τὰ ἤπατά μου ὀγκοῦμαι; o plural grego do órgão não requer plural em português.
