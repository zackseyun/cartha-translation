id: T12P.SIM.4.7
reference: Testament of Simeon 4:7
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὑμεῖς⁵², τέκνα μου⁵³, ἀγαπήσατε⁵⁴ ἕκαστος τὸν ἀδελφὸν⁵⁵ αὐτοῦ⁵⁶ ἐν ἀγαθῇ καρδίᾳ, καὶ *ἀποστήσεται ἀφ᾽ ὑμῶν τὸ πνεῦμα τοῦ φθόνου⁵⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/007.yaml
  text: And you also, my children, let each one love his brother with a good heart, and the spirit of envy will depart from you.
translation:
  language: pt
  text: E vocês também, meus filhos, cada um ame seu irmão de coração bondoso, e o espírito da inveja se afastará de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: ame
  rationale: O imperativo aoristo pede uma exortação direta; em português, o singular concorda naturalmente com «cada um».
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: seu irmão
  rationale: Preserva a relação fraterna explícita do grego sem ampliar o referente para uma formulação abstrata.
- source_word: ἐν ἀγαθῇ καρδίᾳ
  choice: de coração bondoso
  rationale: Expressa com naturalidade a disposição interior moralmente boa indicada por ἀγαθῇ, mantendo a imagem do coração.
- source_word: τὸ πνεῦμα τοῦ φθόνου
  choice: o espírito da inveja
  rationale: Mantém a formulação concreta e a possível dimensão espiritual ou personificada do original, sem reduzi-la a mero sentimento.
- source_word: ἀποστήσεται ἀφ᾽ ὑμῶν
  choice: se afastará de vocês
  rationale: Reproduz o futuro e a ideia de afastamento ou retirada, em linguagem corrente e dignificada.
theological_decisions:
- issue: Sentido de «espírito da inveja»
  choice: Preservar literalmente «o espírito da inveja»
  alternative: Traduzir como «a atitude invejosa» ou simplesmente «a inveja»
  rationale: O grego πνεῦμα admite uma leitura espiritual, personificada ou disposicional; a tradução não deve resolver essa ambiguidade.
- issue: Relação entre a exortação e o afastamento da inveja
  choice: 'Manter a coordenação com futuro: «e ... se afastará»'
  alternative: 'Explicitar causalidade: «para que ... se afaste»'
  rationale: O texto apresenta uma sequência afirmativa, não uma oração final explícita; a tradução conserva essa tensão sem acrescentar uma relação causal gramaticalmente marcada.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A construção é direta e exortativa, com vocabulário simples, mas digno. «Vocês» representa o plural ὑμεῖς de modo natural; «cada um ame» evita formas regionais ou excessivamente solenes.
