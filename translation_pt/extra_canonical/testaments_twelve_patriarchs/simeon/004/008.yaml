id: T12P.SIM.4.8
reference: Testament of Simeon 4:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὅτι⁵⁸ ἀγριοῖ τοῦτο⁵⁹ τὴν ψυχήν⁶⁰, καὶ φθείρει *τὸ σῶμα⁶¹, *ὀργὴν καὶ πόλεμον παρέχει τῷ διαβουλίῳ⁶², καὶ εἰς⁶³ αἵματα⁶⁴ παροξύνει, καὶ εἰς ἔκστασιν ἄγει⁶⁵ *τὴν διάνοιαν⁶⁶, καὶ κλόνον⁶⁹ παρέχει τῇ ψυχῇ⁷⁰ καὶ τρόμον τῷ σώματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/008.yaml
  text: For this makes the soul savage, and destroys the body; it brings anger and war into one’s plans, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling.
translation:
  language: pt
  text: Pois isso torna a alma selvagem e arruína o corpo; traz ira e guerra aos propósitos, incita ao derramamento de sangue, leva a mente ao desvario, causa perturbação à alma e tremor ao corpo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγριοῖ
  choice: torna ... selvagem
  rationale: Reproduz diretamente a ideia de tornar feroz ou indomável, mantendo a imagem forte do grego.
- source_word: φθείρει
  choice: arruína
  rationale: Expressa dano destrutivo ou corrupção sem exigir que o verbo signifique necessariamente morte física.
- source_word: διαβουλίῳ
  choice: propósitos
  rationale: O termo se refere à deliberação, intenção ou plano; “propósitos” é natural em português e preserva a dimensão volitiva.
- source_word: εἰς αἵματα παροξύνει
  choice: incita ao derramamento de sangue
  rationale: Traduz idiomaticamente o plural semítico “sangues” como violência sanguinária ou derramamento de sangue.
- source_word: εἰς ἔκστασιν ἄγει τὴν διάνοιαν
  choice: leva a mente ao desvario
  rationale: Aqui ἔκστασις indica perda de equilíbrio ou perturbação mental, não êxtase religioso; “desvario” conserva a intensidade.
- source_word: κλόνον
  choice: perturbação
  rationale: Comunica agitação ou tumulto interior sem repetir o tremor corporal da oração seguinte.
- source_word: τρόμον
  choice: tremor
  rationale: Equivalente direto e natural para a reação física descrita.
theological_decisions:
- issue: Referente implícito de τοῦτο (“isso”)
  choice: Manter “isso” sem explicitar o antecedente
  alternative: Nomear a paixão ou vício discutido no contexto anterior
  rationale: O versículo isolado não identifica lexicalmente o referente; explicitá-lo resolveria uma dependência contextual que o grego preserva.
- issue: Sentido de ἔκστασις
  choice: Desvario mental
  alternative: Êxtase espiritual
  rationale: O paralelismo com ira, conflito, sangue, perturbação e tremor favorece um estado de descontrole, não uma experiência religiosa positiva.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura paralela preservada. “Conflito” evita a possível impressão de guerra militar literal, enquanto continua refletindo πόλεμον no âmbito dos propósitos ou deliberações.
