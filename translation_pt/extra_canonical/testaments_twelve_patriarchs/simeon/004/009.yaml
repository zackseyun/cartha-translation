source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ὅτι καὶ⁷¹ ἐν ὕπνῳ *τις ζῆλος⁷² κακίας αὐτὸν⁷³ φαντάζουσα⁷⁴ κατεσθίει⁷⁵ καὶ⁷⁶ πνεύμασι πονηροῖς⁷⁷ διαταράσσει⁷⁸ τὴν ψυχὴν αὐτοῦ, καὶ ἐκθροεῖσθαι τὸ σῶμα ποιεῖ, καὶ ἐν ταραχῇ διυπνίζει⁷⁹ τὸν νοῦν, καὶ ὡς⁸⁰ πνεῦμα πονηρὸν *καὶ ἰοβόλον⁸¹, *οὕτως φαίνεται⁸² τοῖς ἀνθρώποις⁸³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/009.yaml
  text: For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body shudder, and wakes the mind in turmoil; and like an evil and venomous spirit, so he appears to people.
translation:
  language: pt
  text: Pois, mesmo durante o sono, a inveja, apresentando-lhe imagens de maldade, o devora, perturba sua alma com espíritos malignos, faz seu corpo estremecer e desperta sua mente em agitação; e, como um espírito maligno e venenoso, assim ele aparece às pessoas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: inveja
  rationale: No contexto do Testamento de Simeão, o termo designa o ciúme invejoso que corrói a pessoa; “inveja” comunica esse sentido com clareza em português.
- source_word: φαντάζουσα κακίας
  choice: fazendo-o imaginar maldades
  rationale: Expressa a produção de imagens ou representações mentais do mal sem acrescentar a ideia mais específica de visões sobrenaturais.
- source_word: κατεσθίει
  choice: devora
  rationale: Preserva a imagem forte e progressiva do verbo grego, em vez de suavizá-la como “consome”.
- source_word: ἐκθροεῖσθαι τὸ σῶμα ποιεῖ
  choice: faz seu corpo estremecer
  rationale: Reproduz o efeito físico de sobressalto ou tremor sem acrescentar uma causa, como medo, que o grego não explicita.
- source_word: ἐν ταραχῇ διυπνίζει τὸν νοῦν
  choice: desperta sua mente em agitação
  rationale: Mantém tanto a ideia de despertar quanto o estado de perturbação mental.
- source_word: ἰοβόλον
  choice: venenoso
  rationale: Equivalente natural para aquilo que lança ou inocula veneno, preservando a imagem nociva do original.
theological_decisions:
- issue: Relação entre a inveja e os espíritos malignos
  choice: Manter os espíritos malignos como agentes ou meios que perturbam a alma
  alternative: Entender “espíritos malignos” apenas como estados psicológicos ou disposições interiores
  rationale: O texto os nomeia diretamente e não esclarece se devem ser entendidos de modo pessoal, metafórico ou psicológico; a tradução preserva essa tensão.
- issue: Comparação final da pessoa invejosa com um espírito maligno
  choice: “assim ele aparece às pessoas, como um espírito maligno e venenoso”
  alternative: “ele se torna um espírito maligno e venenoso”
  rationale: φαίνεται indica aparência ou modo como é percebido, não transformação ontológica; a tradução evita afirmar mais do que o original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A sequência intensa de ações foi preservada, assim como a comparação final, sem importar terminologia confessional.
