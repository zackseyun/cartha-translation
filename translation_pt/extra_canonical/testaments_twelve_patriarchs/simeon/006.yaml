base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006.yaml
  text: '1 Behold, I have told you everything, so that I may be cleared from your sin. 2 But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.


    3 Then the seed of Canaan will perish, and no remnant will remain for Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed. 4 Then the land of Ham will fail, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.


    5 Then a great sign will be glorified for Israel, because the Lord God, appearing on the earth, will come and save Adam in him. 6 Then all the spirits of deceit will be given over to be trampled down, and men will rule over the evil spirits. 7 Then I also will arise in gladness, and I will bless the Most High for his wonders.'
translation:
  language: pt
  text: '1 Vejam, eu lhes disse tudo, para que eu seja absolvido do pecado de vocês. 2 Mas, se vocês removerem do meio de si a inveja e toda dureza de coração, meus ossos florescerão como uma rosa em Israel, e minha carne, como um lírio em Jacó. Meu aroma será como o aroma do Líbano; de mim se multiplicarão santos para todo o sempre, e os ramos deles se estenderão para longe.


    3 Então a descendência de Canaã perecerá, e não restará sobrevivente algum em Amaleque. Todos os capadócios perecerão, e todos os hititas serão exterminados. 4 Então a terra de Cam desaparecerá, e todo povo perecerá. Então toda a terra cessará da agitação, e tudo o que há debaixo dos céus cessará da guerra.


    5 Então um grande sinal será glorificado para Israel.[a] 6 Então todos os espíritos do engano serão entregues para serem pisados, e os seres humanos dominarão os espíritos malignos. 7 Então eu também me levantarei com alegria e bendirei o Altíssimo por suas maravilhas, [pois Deus tomou um corpo, comeu com os seres humanos e salvou os seres humanos].[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego desta frase é incerto. Literalmente: “Então um grande sinal será glorificado para Israel”.'
    reason: O sinal de crítica textual (†) na edição marca dificuldade ou corrupção do texto; a redação foi mantida de modo próximo ao grego.
  - marker: b
    text: A cláusula entre colchetes — “pois Deus tomou um corpo, comeu com os seres humanos e salvou os seres humanos” — é assinalada como textualmente duvidosa na edição grega.
    reason: Os colchetes editoriais do texto-fonte devem ser comunicados ao leitor, pois afetam uma afirmação cristológica relevante.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Vejam
  rationale: Mantém a função de chamar solenemente a atenção, em português corrente e compreensível.
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: seja isento da culpa pelo pecado de vocês
  rationale: O verbo pode significar ser declarado justo ou absolvido; com ἀπό e este contexto, a formulação expressa a exoneração de responsabilidade sem introduzir uma doutrina específica de justificação.
- source_word: φθόνον
  choice: inveja
  rationale: Equivalente direto do sentimento de ciúme ou ressentimento diante do bem alheio.
- source_word: σκληροκαρδίαν
  choice: dureza de coração
  rationale: Preserva a metáfora antropológica e moral do grego.
- source_word: ἅγιοι
  choice: santos
  rationale: Mantém o substantivo substantivado e sua abertura referencial, sem especificar um grupo não explicitado no texto.
- source_word: σπέρμα
  choice: descendência
  rationale: No contexto étnico, comunica naturalmente o sentido coletivo de linhagem ou posteridade.
- source_word: ἐγκατάλειμμα
  choice: sobrevivente algum
  rationale: Exprime o remanescente deixado após a destruição; a construção negativa exige formulação idiomática.
- source_word: ἐκλείψει
  choice: desaparecerá
  rationale: Reproduz a ideia de cessar, faltar ou chegar ao fim sem definir além do grego o modo da ruína.
- source_word: καταπαύσει
  choice: descansará
  rationale: Preserva a imagem de cessação da agitação e da guerra, com regência natural em português.
- source_word: βασιλεύσουσιν τῶν πονηρῶν πνευμάτων
  choice: dominarão os espíritos malignos
  rationale: A construção indica exercício de domínio sobre eles; 'dominar' é natural e evita sugerir que os espíritos constituam um reino político.
- source_word: ἀναστησόμαι
  choice: me levantarei
  rationale: Preserva a possível ressonância de levantar-se ou ressurgir, sem resolver a ambiguidade em favor de 'ressuscitar'.
- source_word: θαυμασίοις
  choice: maravilhas
  rationale: Designa os feitos admiráveis de Deus em registro bíblico corrente e digno.
theological_decisions:
- issue: Sentido de δικαιωθῶ no versículo 1
  choice: seja isento da culpa pelo pecado de vocês
  alternative: seja justificado do pecado de vocês
  rationale: A opção escolhida comunica absolvição de responsabilidade pelo pecado dos ouvintes sem importar uma formulação confessional de justificação.
- issue: Identidade dos ἅγιοι no versículo 2
  choice: santos
  alternative: os santos / pessoas santas
  rationale: O grego não identifica mais precisamente o grupo; a tradução mantém essa abertura.
- issue: Possível referência à ressurreição em ἀναστησόμαι
  choice: me levantarei
  alternative: ressuscitarei
  rationale: A forma grega admite a leitura de levantar-se e, no contexto escatológico, de ressuscitar. A tradução conserva a tensão sem a resolver silenciosamente.
- issue: Cláusula cristológica entre colchetes no versículo 7
  choice: incluir entre colchetes e assinalar em nota
  alternative: omitir do texto principal
  rationale: A cláusula consta do texto grego fornecido, mas já aparece delimitada editorialmente por colchetes, indicando dúvida textual; sua inclusão sinalizada respeita tanto a evidência apresentada quanto a incerteza.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira, com tratamento por “vocês”. Mantiveram-se o paralelismo poético, as imagens corporais e botânicas e a sequência escatológica. Formulações deliberadamente próximas do grego foram usadas onde o texto é difícil, especialmente no versículo 5; ambiguidades com peso teológico foram preservadas e, quando necessário, explicitadas em notas.
