    issue: «Quando Simeão adoeceu»
    rationale: O grego Ἀρρωστοῦντος significa literalmente «estando doente» e situa a visita durante a enfermidade; não afirma que ela ocorreu no momento em que Simeão ficou doente.
  - severity: low
    issue: «cobriu-os de beijos»
    rationale: Embora seja uma maneira possível de transmitir a força de κατεφίλησεν, explicita na tradução uma repetição que o verbo intensivo pode sugerir, mas não exige. Uma tradução direta, com a nuance em nota, preserva melhor a margem semântica.
