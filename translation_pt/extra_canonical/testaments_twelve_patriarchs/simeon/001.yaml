base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001.yaml
  text: 'A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died. And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up and kissed them[b], and said:'
translation:
  language: pt
  text: 'Testamento de Simeão, o segundo filho de Jacó e Lia


    1 Cópia[a] das palavras de Simeão, que ele dirigiu a seus filhos antes de morrer, no centésimo vigésimo ano de sua vida, na época em que morreu seu irmão José. 2 Quando Simeão estava doente, seus filhos foram visitá-lo. Reunindo forças, ele se sentou, beijou-os[b] e disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Registro das palavras de Simeão”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo grego é intensivo e pode indicar que ele os beijou repetidamente ou com grande afeto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Cópia
  rationale: Mantém o caráter documental da introdução sem definir em excesso se se trata de transcrição, reprodução ou registro.
- source_word: λόγων
  choice: das palavras
  rationale: Equivalente direto e digno, apropriado à introdução de um discurso testamentário.
- source_word: πρὸ τοῦ ἀποθανεῖν
  choice: antes de morrer
  rationale: Expressa naturalmente em português a relação temporal do infinitivo grego.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει
  choice: no centésimo vigésimo ano
  rationale: Preserva a forma cronológica solene do grego, em vez de convertê-la simplesmente em idade.
- source_word: ἐν ᾧ χρόνῳ
  choice: na época em que
  rationale: Conserva a ligação temporal explícita entre o discurso final de Simeão e a morte de José.
- source_word: Ἀρρωστοῦντος
  choice: Quando Simeão adoeceu
  rationale: Converte o genitivo absoluto em oração temporal idiomática. A formulação mantém a doença como circunstância da visita.
- source_word: ἐπισκέψασθαι
  choice: foram visitá-lo
  rationale: Tradução natural que permite ao contexto comunicar a ideia de cuidado e preocupação.
- source_word: ἐνισχύσας
  choice: Reunindo forças
  rationale: Comunica o esforço físico de Simeão enfermo antes de se sentar e falar.
- source_word: ἐκάθισε
  choice: ele se sentou
  rationale: Evita acrescentar a direção corporal específica de 'sentou-se na cama', não explicitada no verbo grego, embora o contexto seja de enfermidade.
- source_word: κατεφίλησεν
  choice: cobriu-os de beijos
  rationale: Representa em português natural a força intensiva do verbo composto, que pode indicar beijos repetidos ou afetuosos.
theological_decisions:
- issue: Nota cronológica que liga as palavras finais de Simeão à morte de José
  choice: Manter ambas as informações cronológicas como parte da moldura narrativa
  alternative: Tratar a referência à morte de José como glosa editorial ou suavizar a cronologia por paráfrase
  rationale: O texto grego apresentado inclui a referência sem indicação de que deva ser removida. A tradução conserva a possível tensão cronológica em vez de harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O título fornecido pelo testemunho grego foi incluído. A numeração preserva as duas unidades do capítulo, e todas as alternativas relevantes são apresentadas sem impor harmonização.
