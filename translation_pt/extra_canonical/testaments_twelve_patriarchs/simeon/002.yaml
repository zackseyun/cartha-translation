base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002.yaml
  text: '1. Hear, my children, Simeon your father, and I will declare to you what I have in my heart.

    2. I was born from Jacob as the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.

    3. For I became very strong; I did not shrink from any deed, nor was I afraid in any matter.

    4. For my heart was hard, and my liver unmoved, and my inward parts without compassion.

    5. For courage also is given by the Most High to men in soul and in body.

    6. But in the time of my youth I was very jealous of Joseph, because my father loved him above all.

    7. And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.

    8. But his God and the God of our fathers sent his angel and rescued him from my hands.

    9. For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.

    10. And when Reuben heard these things, he was grieved, for he wanted to bring him back safely to our father.

    11. But when I heard this, I was very angry with Judah, because he had let him go alive;

    12. and for five months I was sick in my liver. And the Lord struck me, and my hand was withered for seven days.

    13. And I knew, my children, that this happened to me because of Joseph. And after changing my mind I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.

    14. For I knew that I had devised an evil thing before the Lord and against Jacob my father concerning Joseph my brother, by envying him.'
translation:
  language: pt
  text: '1. Ouçam-me, meus filhos; eu, Simeão, seu pai, lhes declararei o que trago no coração.


    2. Eu nasci de Jacó, como o segundo filho de meu pai, e Lia, minha mãe, deu-me o nome de Simeão, porque o Senhor ouviu a súplica dela.


    3. Pois tornei-me muito forte; não recuei diante de nenhum ato, nem tive medo de coisa alguma.


    4. Meu coração era duro, meu fígado, impassível, e minhas entranhas não tinham compaixão.[a]


    5. Pois também a coragem é dada pelo Altíssimo aos seres humanos, na alma e no corpo.


    6. No tempo da minha juventude, tive muito ciúme de José, porque meu pai o amava mais do que a todos os outros.


    7. E decidi, em meu íntimo, matá-lo,[a] porque o governante do engano e o espírito do ciúme cegaram minha mente, de modo que eu não o considerasse irmão nem poupasse Jacó, meu pai.


    8. Mas o Deus dele e o Deus de nossos pais enviou seu anjo e o livrou de minhas mãos.


    9. Pois, quando fui a Siquém levar unguento para nossos rebanhos, e Rúben foi a Dotã, onde estavam as coisas de que precisávamos e todas as nossas provisões, Judá, meu irmão, vendeu José aos ismaelitas.[b]


    10. Quando Rúben soube disso, ficou triste, pois queria levá-lo de volta a nosso pai.


    11. Eu, porém, ao saber disso, fiquei muito irado com Judá, porque ele o havia deixado partir com vida; e passei cinco meses irado com ele.[c]


    12. O Senhor me abateu e impediu minha ação, pois minha mão direita ficou meio ressequida por sete dias.[d]


    13. Então compreendi, meus filhos, que isso me aconteceu por causa de José. Mudei de atitude, chorei e orei ao Senhor Deus para que minha mão fosse restaurada e para que eu me afastasse de toda contaminação, inveja e insensatez.


    14. Pois compreendi que, por invejar José, meu irmão, havia concebido uma coisa má diante do Senhor e contra Jacó, meu pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No modo antigo de falar sobre a pessoa, o fígado e as entranhas podiam representar a sede das emoções e disposições interiores. No versículo 7, o grego diz literalmente que Simeão “firmou seu fígado” contra José; a tradução expressa o sentido de sua resolução hostil.
    reason: A imagem corporal é significativa e está preservada explicitamente em 2.4; em 2.7, a nota explica a expressão literal enquanto o texto principal usa uma formulação portuguesa natural.
  - marker: b
    text: O termo grego traduzido por “unguento” é incomum neste contexto; o texto também apresenta uma construção abreviada ao descrever as viagens de Simeão e Rúben.
    reason: Sinaliza uma dificuldade textual e contextual genuína sem corrigi-la por conjectura.
  - marker: c
    text: O texto grego diz que Simeão passou cinco meses irado com Judá. Uma forma divergente refletida em algumas traduções entende que ele ficou doente no fígado durante cinco meses.
    reason: A camada inglesa fornecida diverge do texto grego principal neste ponto; a tradução segue a leitura grega citada.
  - marker: d
    text: Literalmente, “minha mão direita ficou meio ressequida”.
    reason: A expressão é rara e pode indicar perda parcial de vigor ou função; a nota preserva a forma exata sem diagnosticar a condição.
lexical_decisions:
- source_word: τὰ ἤπατά / τὰ ἤπατά μου
  choice: meu fígado / firmei meu fígado
  rationale: Mantém a imagem antropológica antiga, na qual o fígado é sede de disposições e paixões, sem substituí-la silenciosamente por “coração” ou “sentimentos”.
- source_word: ἀσυμπαθῆ
  choice: não tinham compaixão
  rationale: Expressa com naturalidade a ausência de compaixão atribuída às entranhas, preservando a metáfora visceral.
- source_word: ἀνδρεία
  choice: coragem
  rationale: Neste contexto, denota valentia ou coragem, não necessariamente masculinidade; “coragem” é amplo e idiomático.
- source_word: ζήλου / φθόνου
  choice: ciúme / inveja
  rationale: Distingue ζῆλος, o ciúme hostil contra José, de φθόνος, a inveja confessada no arrependimento, embora os campos semânticos se sobreponham.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: o governante do engano
  rationale: Tradução formal que preserva a personificação e não identifica a figura além do que o texto declara.
- source_word: ἄλειμμα
  choice: unguento
  rationale: É o sentido lexical direto, embora o contexto da provisão para rebanhos seja incomum; a dificuldade é indicada em nota.
- source_word: ἀπέλυσεν
  choice: havia deixado partir
  rationale: Preserva a ideia de soltar ou deixar ir José vivo, sem transformar o verbo em simples “vender”.
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: impediu minha ação
  rationale: Segue o grego transmitido, que fala em impedir a ação, em vez da leitura da camada inglesa “minha mão ficou atrofiada”.
- source_word: ἡμίξηρος
  choice: meio ressequida
  rationale: Reproduz o composto grego de modo inteligível, sem ampliar para paralisia total.
- source_word: μετανοήσας
  choice: mudei de atitude
  rationale: Comunica mudança interior e prática sem impor terminologia confessional; no contexto inclui reconhecimento, choro, oração e abandono do mal.
- source_word: μολυσμοῦ
  choice: contaminação
  rationale: Preserva o caráter moral e cultual potencial do termo, sem restringi-lo a “impureza” ritual.
theological_decisions:
- issue: Agência espiritual no ciúme de Simeão
  choice: “o governante do engano e o espírito do ciúme cegaram minha mente”
  alternative: Identificar explicitamente o governante como Satanás ou tratar tudo como mera psicologia
  rationale: O texto personifica agentes espirituais, mas não nomeia o governante; a tradução conserva tanto a agência quanto a indefinição.
- issue: Relação entre força humana e dádiva divina
  choice: “a coragem é dada pelo Altíssimo... na alma e no corpo”
  alternative: Interpretar a coragem como virtude espiritual apenas ou como força física apenas
  rationale: Mantém a afirmação dupla do original sem harmonizar a coragem pecaminosamente usada por Simeão com a origem divina da capacidade.
- issue: A aflição física como ação do Senhor
  choice: “O Senhor me abateu... minha mão direita ficou meio ressequida”
  alternative: Atenuar para doença natural ou explicar como punição retributiva completa
  rationale: O narrador atribui o acontecimento ao Senhor e o relaciona a José, mas o texto não oferece uma doutrina geral da retribuição.
- issue: μετανοήσας e arrependimento
  choice: “Mudei de atitude”
  alternative: “arrependi-me”
  rationale: Preserva o sentido básico de mudança de mente e orientação; o contexto deixa evidente sua dimensão moral sem depender de fórmula teológica.
translation_notes:
  register: 'Português moderno, digno e acessível, com preferência por construções naturais de ampla compreensão no Brasil e no espaço lusófono. Mantiveram-se imagens corporais antigas quando exegeticamente relevantes, acompanhadas de notas. Os nomes foram vertidos nas formas portuguesas usuais: Simeão, Jacó, Lia, José, Rúben, Judá, Siquém e Dotã.'
