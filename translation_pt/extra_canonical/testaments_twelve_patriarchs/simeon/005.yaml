base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005.yaml
  text: 'Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.


    And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will be finding favor before the Lord and men.


    Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.


    For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and will defeat your whole host.


    And they will be few in number, being divided in Levi and in Judah, and none from among you will be for leadership, just as our father also prophesied in his blessings.'
translation:
  language: pt
  text: '5 Portanto, José tinha bela forma e boa aparência, porque nada de mau habitava nele; pois o rosto revela a perturbação do espírito.


    2 E agora, meus filhos, tornem bons os seus corações diante do Senhor e endireitem os seus caminhos diante das pessoas; assim, vocês encontrarão favor diante do Senhor e das pessoas.


    3 Portanto, guardem-se da imoralidade sexual, porque a imoralidade sexual é mãe dos males: ela afasta de Deus e aproxima de Beliar.


    4 Pois vi, no escrito de Enoque, que os filhos de vocês se corromperão na imoralidade sexual e farão injustiça à espada contra os filhos de Levi.


    5 Mas não poderão resistir a Levi, porque ele travará a guerra do Senhor e vencerá todo[a] o exército de vocês.


    6 E serão poucos, repartidos entre Levi e Judá; e ninguém dentre vocês chegará à liderança, assim como nosso pai também profetizou em suas bênçãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Todo” traduz uma palavra incluída editorialmente no texto grego desta edição; alguns testemunhos podem não a ter.
    reason: Assinalar a incerteza textual indicada pelos sinais editoriais em torno de πᾶσαν, sem alterar o sentido da leitura adotada.
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει, καὶ καλὸς τῇ ὄψει
  choice: tinha bela forma e boa aparência
  rationale: Mantém os dois aspectos paralelos — forma e aparência — em português natural, sem reduzi-los a um único adjetivo.
- source_word: ταραχῆς τοῦ πνεύματος
  choice: perturbação do espírito
  rationale: Preserva a amplitude de πνεῦμα e a ideia de agitação ou desordem interior expressa por ταραχή.
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: tornem bons os seus corações
  rationale: Reproduz a formulação ativa e incomum do grego, em vez de substituí-la por uma interpretação mais específica.
- source_word: ἔσεσθε εὑρίσκοντες χάριν
  choice: assim, vocês encontrarão favor
  rationale: Expressa naturalmente em português a construção perifrástica futura do grego, cujo sentido é prospectivo, sem forçar uma progressividade artificial.
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Termo moderno e abrangente que comunica conduta sexual ilícita sem restringir o referente a prostituição.
- source_word: προσεγγίζουσα τῷ Βελίαρ
  choice: aproxima de Beliar
  rationale: Preserva o contraste espacial e relacional com χωρίζουσα ἀπὸ τοῦ θεοῦ.
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: no escrito de Enoque
  rationale: Formulação legível que mantém a referência a um registro escrito associado a Enoque; o grego é textualmente áspero.
- source_word: ἀδικήσουσιν
  choice: atacarão
  rationale: No contexto instrumental de ἐν ῥομφαίᾳ, comunica uma agressão praticada à espada, sem especificar indevidamente morte ou derrota.
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: combaterá a guerra do Senhor
  rationale: Conserva a expressão enfática e a possível ideia de guerra empreendida em favor ou por incumbência do Senhor.
- source_word: παρεμβολὴν
  choice: exército
  rationale: No contexto bélico, o termo designa naturalmente hoste ou força acampada; 'exército' é claro e digno.
- source_word: ὀλιγοστοί
  choice: poucos
  rationale: Equivalente direto que preserva a redução numérica anunciada.
- source_word: τις εἰς ἡγεμονίαν
  choice: ninguém dentre vocês chegará à liderança
  rationale: Expressa a construção elíptica do grego sem determinar uma função política ou monárquica mais específica do que o texto permite.
theological_decisions:
- issue: Relação entre estado interior e aparência de José
  choice: “o rosto revela a perturbação do espírito”
  alternative: “o rosto revela o que se passa no espírito”
  rationale: Mantém a afirmação forte e algo tensa do texto, sem transformá-la numa máxima psicológica mais geral.
- issue: Agente e sentido de “guerra do Senhor”
  choice: “ele combaterá a guerra do Senhor”
  alternative: “ele lutará pelo Senhor”
  rationale: Preserva a ambiguidade do genitivo Κυρίου, que pode indicar posse, comissão ou causa, sem impor uma leitura denominacional.
- issue: Identidade de Beliar
  choice: transliteração “Beliar”
  alternative: “o Maligno”
  rationale: Mantém o nome próprio presente no texto e evita identificar explicitamente a figura com outro título teológico.
- issue: Destino tribal e liderança
  choice: “ninguém dentre vocês chegará à liderança”
  alternative: “nenhum de vocês será governante”
  rationale: Mantém ἡγεμονία em sentido amplo e não conclui se a profecia trata especificamente de realeza, governo civil ou primazia tribal.
- issue: Distribuição entre Levi e Judá
  choice: “repartidos entre Levi e Judá”
  alternative: “designados a Levi e a Judá”
  rationale: Preserva o sentido distributivo de ἐπιμεριζόμενοι sem explicar de modo conjectural se se trata de absorção tribal, subordinação ou dispersão.
translation_notes:
  register: Português moderno, digno e acessível, com formas brasileiras amplamente compreensíveis. Mantiveram-se os paralelismos, as imagens espaciais e bélicas e as ambiguidades teológicas relevantes. A numeração inicia em 5 para identificar o capítulo e segue com os versículos 2–6.
