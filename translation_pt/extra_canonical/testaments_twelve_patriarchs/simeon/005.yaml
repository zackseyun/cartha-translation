review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem a sequência argumentativa, os paralelismos e os principais termos do grego. Contudo, “atacarão” estreita ἀδικήσουσιν (“farão injustiça/causarão dano”) a uma ação militar, embora a expressão “à espada” indique o meio. A redação revista preserva melhor o verbo e o contexto. A palavra “toda” em “todo o exército” representa πᾶσαν, que está assinalado como texto editorialmente incerto na edição fornecida; por isso recebe nota.
  naturalness: O português é moderno, claro e de registro adequado. “Travar a guerra do Senhor” é mais idiomático que “combater a guerra do Senhor”, sem resolver o valor do genitivo.
  terminology: “Imoralidade sexual”, “Beliar”, “Levi”, “Judá” e “liderança” são escolhas adequadas. “Fazer injustiça ... à espada” conserva a amplitude de ἀδικέω e a imagem bélica.
  issues:
  - severity: medium
    issue: “atacarão à espada” traduz ἀδικήσουσιν de modo excessivamente específico.
    rationale: ἀδικέω significa praticar injustiça, lesar ou tratar injustamente. O complemento ἐν ῥομφαίᾳ situa essa injustiça no contexto de violência armada, mas não exige reduzi-la a “atacar”.
  - severity: low
    issue: “todo” traduz uma palavra marcada como editorialmente incerta na edição grega.
    rationale: πᾶσαν aparece entre sinais de inclusão editorial. A tradução pode adotá-la, mas uma nota deve informar o leitor.
