base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/006.yaml
  text: For in the time of my youth I was very jealous of Joseph, because my father loved him above all.
translation:
  language: pt
  text: Pois, no tempo da minha juventude, tive muito ciúme de José, porque meu pai o amava mais do que a todos os outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου
  choice: Pois, no tempo da minha juventude
  rationale: “Pois” preserva o valor explicativo de γάρ, e a expressão temporal segue de perto o grego em português natural.
- source_word: πολλὰ ἐζήλωσα τὸν Ἰωσήφ
  choice: tive muito ciúme de José
  rationale: No contexto, ζηλόω expressa ciúme ou inveja dirigida contra José; “tive muito ciúme de” é claro, corrente e mantém a intensidade de πολλά.
- source_word: ἠγάπα αὐτὸν ὁ πατήρ μου
  choice: meu pai o amava
  rationale: Reproduz diretamente o imperfeito ἠγάπα, apresentando o amor paterno como situação contínua no passado.
- source_word: παρὰ πάντας
  choice: mais do que a todos os outros
  rationale: A construção comparativa indica preferência em relação a todos os demais; “os outros” explicita naturalmente em português que José é excluído do grupo comparado.
theological_decisions:
- issue: Natureza da atitude de Simeão para com José
  choice: ciúme
  alternative: inveja
  rationale: “Ciúme” corresponde bem ao ressentimento provocado pelo amor preferencial do pai, sem acrescentar uma formulação doutrinária ou psicológica além do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução conserva a relação explicativa introduzida por γάρ e evita o possível equívoco de “acima de todos”, que em português pode soar espacial ou absoluto.
