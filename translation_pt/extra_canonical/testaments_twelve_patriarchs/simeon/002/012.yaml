id: T12P.SIM.2.12
reference: Testament of Simeon 2:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καίγε συνετρίβει με *ὁ Κύριος⁷⁸ καὶ ἐκώλυσεν δράσιν⁷⁹ *ἀπʼ ἐμοῦ⁸⁰. *ὅτι ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν ἐπὶ ἡμέρας ἑπτά⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/012.yaml
  text: And the Lord crushed me and held back action from me, for my right hand became half-withered for seven days.
translation:
  language: pt
  text: De fato, o Senhor me esmagava e me impediu de agir, pois minha mão direita ficou meio ressequida durante sete dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: De fato
  rationale: Expressa a força confirmatória e enfática da partícula composta, ligando a afirmação ao contexto.
- source_word: συνετρίβει
  choice: me esmagou
  rationale: Preserva a imagem forte de συντρίβω. Embora a forma grega seja imperfeita, em português o pretérito perfeito apresenta naturalmente o ato punitivo nesse relato.
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: me impediu de agir
  rationale: Tradução idiomática da construção que literalmente indica impedir ou reter a ação da parte do narrador, sem acrescentar referência a violência ou às mãos que não consta desta forma do texto grego.
- source_word: ἡμίξηρος
  choice: parcialmente paralisada
  rationale: Comunica em linguagem corrente a condição figurada por 'meio ressequida', evitando a expressão pouco natural 'meio seca' para uma mão, sem afirmar necrose.
- source_word: ἐπὶ ἡμέρας ἑπτά
  choice: durante sete dias
  rationale: Representa com clareza a duração indicada por ἐπί com acusativo.
theological_decisions:
- issue: Agente da aflição física
  choice: O Senhor é mantido explicitamente como sujeito de 'me esmagou' e 'me impediu de agir'.
  alternative: Atenuar para 'o Senhor me disciplinou' ou atribuir a condição apenas a uma causa indireta.
  rationale: O grego nomeia ὁ Κύριος como agente e emprega linguagem forte; a tradução não deve suavizar essa tensão teológica.
- issue: Natureza da incapacidade da mão
  choice: A condição é descrita como paralisia parcial e temporária.
  alternative: “Meio ressequida”, “semimorta” ou “meio seca”.
  rationale: ἡμίξηρος descreve literalmente algo meio seco ou ressequido; no contexto corporal, 'parcialmente paralisada' comunica o efeito provável sem importar a ideia mais forte de morte do membro.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. A formulação conserva a severidade do grego e evita incorporar material da revisão anterior que pertence a outra forma textual ou a contexto mais amplo.
