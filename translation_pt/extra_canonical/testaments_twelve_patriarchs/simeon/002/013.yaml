source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
translation:
  language: pt
  text: E compreendi, meus filhos, que isso me aconteceu por causa de José. Depois de me arrepender, chorei e orei ao Senhor Deus para que minha mão fosse restaurada e para que eu me abstivesse de toda contaminação e inveja, e de toda insensatez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: compreendi
  rationale: Expressa o reconhecimento adquirido por Simeão de modo natural e digno em português.
- source_word: τέκνα
  choice: meus filhos
  rationale: O possessivo, embora implícito no vocativo grego, é natural no discurso direto em português e corresponde ao contexto.
- source_word: περὶ Ἰωσήφ
  choice: por causa de José
  rationale: No contexto, περί indica a relação causal entre a conduta de Simeão para com José e o que lhe aconteceu.
- source_word: μετανοήσας
  choice: me arrependi
  rationale: Traduz a mudança moral de atitude implicada pelo particípio, sem reduzi-la a mera mudança de opinião.
- source_word: ἀποκατασταθῇ
  choice: fosse restaurada
  rationale: Preserva a ideia de restituição da mão ao seu estado ou funcionamento anterior.
- source_word: ἀποσχῶ
  choice: eu me abstivesse
  rationale: Mantém o sentido de afastar-se deliberadamente de determinadas disposições e condutas.
- source_word: μολυσμοῦ
  choice: contaminação
  rationale: Termo abrangente que conserva a dimensão moral de impureza sem especificá-la além do grego.
- source_word: ἀφροσύνης
  choice: insensatez
  rationale: Equivalente corrente e digno para falta de entendimento ou conduta tola.
theological_decisions:
- issue: Relação entre o pecado contra José e a aflição de Simeão
  choice: por causa de José
  alternative: a respeito de José
  rationale: O contexto favorece causalidade, mas a formulação não define o mecanismo teológico da retribuição.
- issue: Sentido de μετανοήσας
  choice: me arrependi
  alternative: mudei de atitude
  rationale: Neste contexto de choro, oração e abandono de vícios, arrependimento comunica adequadamente a dimensão moral do termo.
translation_notes:
  register: 'Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A coordenação final foi levemente compactada sem alterar os três elementos do grego: contaminação, inveja e insensatez.'
