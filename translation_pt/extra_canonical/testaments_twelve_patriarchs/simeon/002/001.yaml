lexical_decisions:
- source_word: Ἀκούσατε
  choice: Ouçam
  rationale: Imperativo plural direto e natural em português moderno, preservando o apelo solene aos filhos.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Equivalente idiomático de τέκνα no contexto de um pai dirigindo suas últimas palavras aos descendentes.
- source_word: ἀναγγελῶ
  choice: anunciarei
  rationale: Conserva o sentido de dar a conhecer ou declarar de modo solene, sem acrescentar conotação técnica de profecia.
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου
  choice: tudo o que tenho no coração
  rationale: Reproduz de perto a expressão grega e permanece clara e natural em português.
