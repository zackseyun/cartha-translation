    issue: O particípio ἐλθών foi traduzido por «quando chegou ali».
    rationale: «Ali» não tem antecedente espacial definido e deixa de explicitar que Judá foi até os ismaelitas, informação presente no grego.
  - severity: low
    issue: «Mantimentos» restringe τὰ ἐγχρῄζοντα.
    rationale: O grego designa de modo amplo as coisas necessárias; o contexto de armazenamento não exige uma limitação a comida.
  revised_text: Pois, quando fui a Siquém levar unguento para os nossos rebanhos, e Rúben foi a Dotã, onde estavam as coisas de que precisávamos e tudo o que tínhamos guardado, Judá, meu irmão, ao ir até os ismaelitas, vendeu-o a eles.
