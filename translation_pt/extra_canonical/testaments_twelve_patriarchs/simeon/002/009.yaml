  source_fidelity: 'A estrutura narrativa e os referentes principais estão corretos. Contudo, «quando chegou ali» torna impreciso o particípio ἐλθών: o texto grego o associa a Judá e explicita os ismaelitas como o destino/contato de sua ida. «Mantimentos» também restringe τὰ ἐγχρῄζοντα («as coisas de que precisávamos») a alimentos, embora o termo seja mais amplo.'
  naturalness: A redação é clara e fluente. A revisão conserva o registro narrativo moderno e torna mais explícita, sem excesso, a relação de Judá com os ismaelitas.
  terminology: «Unguento», «rebanhos», «Siquém», «Rúben», «Dotã» e «ismaelitas» são escolhas adequadas. «Tudo o que tínhamos guardado» traduz naturalmente πᾶσα ἡ ἀπόθεσις sem impor que se trate exclusivamente de gêneros alimentícios.
  issues:
