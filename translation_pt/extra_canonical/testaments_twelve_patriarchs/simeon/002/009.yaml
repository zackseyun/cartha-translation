base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/009.yaml
  text: For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.
translation:
  language: pt
  text: Pois, quando fui a Siquém levar unguento para os nossos rebanhos, e Rúben foi a Dotã, onde estavam as coisas de que precisávamos e tudo o que tínhamos guardado, Judá, meu irmão, ao ir até os ismaelitas, vendeu-o a eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλειμμα
  choice: unguento
  rationale: Mantém o sentido concreto de uma substância oleosa ou preparada para untar, sem especificar uma finalidade não expressa no grego.
- source_word: τοῖς ποιμνίοις
  choice: para os nossos rebanhos
  rationale: O substantivo refere-se aos rebanhos; o possessivo é natural no contexto familiar e acompanha a leitura da camada inglesa auditada.
- source_word: τὰ ἐγχρῄζοντα ἡμῖν
  choice: os mantimentos de que precisávamos
  rationale: Expressa aquilo de que o grupo necessitava; 'mantimentos' se ajusta ao contexto de provisões armazenadas, embora o grego seja relativamente amplo.
- source_word: πᾶσα ἡ ἀπόθεσις
  choice: todas as nossas provisões
  rationale: Traduz o conjunto do que estava guardado ou armazenado em português corrente, preservando a distinção em relação aos itens necessários.
- source_word: ἐλθών
  choice: quando chegou ali
  rationale: Conserva o particípio circunstancial ligado a Judá e evita deixá-lo sem representação, como ocorre na formulação inglesa.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe narrativa natural. Os topônimos seguem as formas bíblicas correntes em português: Siquém e Dotã. A repetição de ''provisões'' após ''mantimentos'' reflete os dois termos gregos, sem forçar uma distinção excessivamente técnica.'
