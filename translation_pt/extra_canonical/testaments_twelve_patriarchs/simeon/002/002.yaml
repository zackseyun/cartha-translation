base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/002.yaml
  text: I was born from Jacob, the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.
translation:
  language: pt
  text: Eu nasci de Jacó, o segundo filho de meu pai, e Lia, minha mãe, deu-me o nome de Simeão, porque o Senhor ouviu a súplica dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἐξ Ἰακώβ
  choice: nasci de Jacó
  rationale: Reproduz de modo natural a origem paterna expressa por ἐξ, sem acrescentar «como», ausente do texto grego.
- source_word: υἱὸς δεύτερος τῷ πατρὶ μου
  choice: o segundo filho de meu pai
  rationale: Mantém a construção apositiva e comunica claramente a ordem de nascimento em português corrente.
- source_word: ἐκάλεσέ με Συμεῶνα
  choice: deu-me o nome de Simeão
  rationale: Expressa idiomaticamente o ato de dar nome indicado por καλέω nesse contexto.
- source_word: δεήσεως
  choice: súplica
  rationale: Preserva o sentido de pedido insistente ou oração, sem restringi-lo desnecessariamente a uma formulação litúrgica.
theological_decisions:
- issue: Referência divina em Κύριος sem artigo
  choice: o Senhor
  alternative: Senhor
  rationale: Em português, «o Senhor» é a forma natural de referência ao Deus de Israel neste contexto e não acrescenta uma identificação denominacional.
- issue: Natureza da δεήσεως de Lia
  choice: súplica
  alternative: oração
  rationale: «Súplica» conserva a força lexical do pedido dirigido a Deus e evita resolver além do necessário a forma específica desse apelo.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e inteligibilidade internacional. A aposição «o segundo filho de meu pai» preserva a estrutura e a nuance do grego.
