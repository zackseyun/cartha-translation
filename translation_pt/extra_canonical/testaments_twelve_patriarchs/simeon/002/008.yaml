  text: But his God and the God of our fathers sent his angel and rescued him from my hands.
translation:
  language: pt
  text: Mas o Deus dele — e o Deus dos nossos antepassados — enviou seu anjo e o livrou das minhas mãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν πατέρων ἡμῶν
  choice: dos nossos antepassados
  rationale: Expressa naturalmente a referência aos ancestrais do povo, evitando que «pais» seja entendido apenas como genitores imediatos.
- source_word: ἐρρύσατο
  choice: livrou
  rationale: Preserva a ideia de resgate de um perigo concreto e soa natural no registro bíblico moderno.
- source_word: ἐκ τῶν χειρῶν μου
  choice: das minhas mãos
  rationale: Mantém a imagem idiomática grega de poder ou domínio pessoal, clara também em português.
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: o seu anjo
  rationale: Tradução direta que conserva o referente possessivo e a identidade do mensageiro celestial.
theological_decisions:
- issue: Distinção aparente entre «o Deus dele» e «o Deus dos nossos antepassados»
  choice: Manter as duas expressões coordenadas
  alternative: Fundir como «o Deus dele, o Deus dos nossos antepassados»
  rationale: O καί do texto grego coordena as expressões; a tradução não deve decidir silenciosamente se são apenas aposicionais ou retoricamente distintas.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. «Antepassados» esclarece o sentido coletivo de πατέρων; a metáfora «das minhas mãos» foi preservada.
