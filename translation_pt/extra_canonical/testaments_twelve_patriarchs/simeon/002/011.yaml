  text: But when I heard this, I was very angry with Judah, because he had let him go alive; and for five months I remained angry with him.
translation:
  language: pt
  text: Mas eu, ao ouvir isso, fiquei muito irado com Judá, porque ele o deixou ir com vida; e passei cinco meses irado com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθην ... σφόδρα
  choice: fiquei muito irado
  rationale: Reproduz a intensidade de σφόδρα e o sentido forte de ira expresso pelo verbo, em linguagem digna e natural.
- source_word: ζῶντα αὐτὸν ἀπέλυσεν
  choice: ele o havia deixado escapar com vida
  rationale: Expressa que Judá soltou ou permitiu que o indivíduo partisse ainda vivo; «escapar» se ajusta ao contexto de hostilidade sem acrescentar que tenha fugido por conta própria.
- source_word: ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ
  choice: passei cinco meses irado com ele
  rationale: Converte a construção idiomática grega em português corrente, preservando tanto a duração quanto a continuidade da ira.
