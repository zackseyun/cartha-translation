  text: Ἡ γὰρ καρδία μου ἦν σκληρά, καὶ *τὰ ἤπατά¹⁵ μου ἀκίνητα καὶ τὰ σπλάγχνα μου ἀσυμπαθῆ¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/004.yaml
  text: For my heart was hard, and my liver unmoved, and my inward parts without compassion.
translation:
  language: pt
  text: Pois meu coração era duro, meu fígado permanecia insensível, e minhas entranhas não tinham compaixão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  choice: coração
  rationale: Preserva a imagem antropológica e moral do grego em linguagem natural portuguesa.
- source_word: τὰ ἤπατά
  choice: meu fígado
  rationale: Mantém a referência corporal incomum do original, sem substituí-la por uma interpretação moderna; o plural grego pode funcionar idiomaticamente para o órgão.
- source_word: ἀκίνητα
  choice: permanecia insensível
  rationale: O sentido literal é 'imóvel'; neste contexto afetivo, 'permanecia insensível' comunica a falta de comoção sem produzir uma expressão portuguesa opaca.
- source_word: τὰ σπλάγχνα
  choice: minhas entranhas
  rationale: Conserva a imagem antiga das partes interiores como sede dos afetos.
- source_word: ἀσυμπαθῆ
  choice: não tinham compaixão
  rationale: Expressa diretamente a ausência de compaixão indicada pelo adjetivo grego.
theological_decisions:
- issue: Linguagem antropológica das sedes interiores da emoção
  choice: Preservar 'coração', 'fígado' e 'entranhas' como imagens distintas
  alternative: Harmonizar todas as expressões como 'meu íntimo' ou 'meus sentimentos'
  rationale: A distinção pertence à forma e à força retórica do texto grego; harmonizá-la apagaria sua concretude e sua antropologia antiga.
translation_notes:
  register: Português moderno, digno e acessível. A formulação mantém o paralelismo triplo e a imagem incomum do fígado, mas verte ἀκίνητα de modo contextualmente inteligível.
