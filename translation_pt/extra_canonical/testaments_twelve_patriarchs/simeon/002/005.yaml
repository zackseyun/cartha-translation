  text: For courage also is given by the Most High to men in soul and body.
translation:
  language: pt
  text: Pois também a coragem é dada pelo Altíssimo aos seres humanos, na alma e no corpo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνδρεία
  choice: coragem
  rationale: Expressa de modo natural a ideia de bravura ou valentia, sem restringi-la ao sexo masculino.
- source_word: ὑψίστου
  choice: Altíssimo
  rationale: Título divino tradicional e direto, correspondente ao superlativo grego.
- source_word: τοῖς ἀνθρώποις
  choice: aos seres humanos
  rationale: Representa o sentido genérico de ἄνθρωπος com clareza no português atual.
- source_word: ἐν ψυχαῖς καὶ σώμασιν
  choice: na alma e no corpo
  rationale: Mantém os dois âmbitos da expressão grega, com formulação idiomática em português.
theological_decisions:
- issue: Origem divina da coragem
  choice: é dada pelo Altíssimo
  alternative: vem do Altíssimo
  rationale: A voz passiva reproduz mais de perto δίδοται e conserva a afirmação de que a coragem é concedida por Deus.
- issue: Relação entre alma e corpo
  choice: na alma e no corpo
  alternative: às almas e aos corpos
  rationale: O contexto e a versão de consulta favorecem uma referência aos âmbitos espiritual e corporal de cada pessoa, sem desenvolver uma antropologia mais específica do que o grego exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A conjunção explicativa «Pois» e o advérbio «também» preservam Ἐπειδὴ καὶ; «seres humanos» evita que «homens» seja entendido apenas como pessoas do sexo masculino.
