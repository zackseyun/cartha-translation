source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ *ὁ Ῥουβὶμ ἀκούσας ταῦτα⁶⁴ ἐλυπήθη⁶⁵. ἤθελε⁶⁶ γὰρ αὐτὸν⁶⁷ ἀπαγαγεῖν⁶⁸ πρὸς τὸν πατέρα⁶⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/010.yaml
  text: And Reuben, hearing these things, was grieved, for he wanted to bring him safely back to his father.
translation:
  language: pt
  text: E Rúben, ao ouvir essas coisas, ficou triste, pois queria levá-lo de volta ao pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: ao ouvir
  rationale: Expressa de modo natural em português o particípio aoristo circunstancial, sem acrescentar uma relação temporal mais específica do que a presente no grego.
- source_word: ἐλυπήθη
  choice: ficou triste
  rationale: Reproduz o sentido passivo de ser tomado pela tristeza em linguagem corrente e digna.
- source_word: ἀπαγαγεῖν
  choice: levá-lo de volta
  rationale: No contexto, o verbo indica conduzir José para longe daquela situação e de volta ao pai; a expressão portuguesa comunica esse movimento sem acrescentar explicitamente a ideia de segurança.
- source_word: πρὸς τὸν πατέρα
  choice: ao pai
  rationale: Mantém o artigo definido do grego e evita inserir um possessivo ausente no texto-fonte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez artificial. A conjunção inicial foi preservada, e não se acrescentou “em segurança”, pois essa noção é contextual, mas não está lexicalmente explícita no texto grego.
