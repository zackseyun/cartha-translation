revisions:
- from: E voltei minhas entranhas contra ele, decidido a matá-lo, porque o governante do engano e o espírito do ciúme cegaram minha mente, para que eu não o considerasse irmão nem poupasse meu pai Jacó.[a]
  to: E dirigi contra ele as minhas entranhas, a ponto de matá-lo, pois o governante do engano e o espírito do ciúme cegaram a minha mente, de modo que eu não o tratasse como irmão nem poupasse o meu pai, Jacó.[a]
  rationale: A revisão corrige o valor de ἐστήριξα e o efeito resultativo de ὥστε, preserva a linguagem visceral do original em português legível e mantém sem identificação adicional o governante do engano e o espírito do ciúme. A nota foi reduzida à informação filológica pertinente.
