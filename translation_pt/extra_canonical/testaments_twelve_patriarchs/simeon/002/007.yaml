base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/007.yaml
  text: And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.
translation:
  language: pt
  text: E dirigi contra ele as minhas entranhas, a ponto de matá-lo, pois o governante do engano e o espírito do ciúme cegaram a minha mente, de modo que eu não o tratasse como irmão nem poupasse o meu pai, Jacó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “firmei contra ele o meu fígado”. Na linguagem antropológica antiga, o fígado pode representar as disposições ou emoções interiores.'
    reason: Explica a imagem corporal incomum que foi traduzida por “as minhas entranhas”, sem introduzir alegações textuais não especificadas.
lexical_decisions:
- source_word: ἐστήριξα ἐπʼ αὐτὸν τὰ ἤπατά μου
  choice: voltei minhas entranhas contra ele, decidido a matá-lo
  rationale: A expressão grega é visceral e literalmente menciona o fígado/entranhas como sede das disposições interiores. “Voltei minhas entranhas contra ele” conserva a imagem antiga, enquanto “decidido a matá-lo” expressa naturalmente o valor resultativo de ὥστε ἀνελεῖν αὐτόν.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: o governante do engano
  rationale: Mantém ἄρχων como autoridade pessoal e πλάνη como engano/desvio, sem identificar além do que o texto declara.
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: o espírito do ciúme
  rationale: Neste contexto de hostilidade contra um irmão, ζῆλος tem sentido negativo de ciúme ou inveja; “ciúme” preserva o vínculo mais direto com a rivalidade fraterna.
- source_word: ἐτύφλωσέ μου τὸν νοῦν
  choice: cegaram minha mente
  rationale: Conserva a metáfora cognitiva do grego. O verbo foi posto no plural em português porque os dois sujeitos coordenados — o governante e o espírito — praticam a ação.
- source_word: μὴ προσέχειν αὐτῷ ὡς ἀδελφῷ
  choice: para que eu não o considerasse irmão
  rationale: Expressa o sentido contextual de não dar a ele a devida consideração como irmão, em português corrente e digno.
- source_word: μηδὲ φείσασθαι τῷ πατρί μου Ἰακώβ
  choice: nem poupasse meu pai Jacó
  rationale: Segue a construção grega e mantém Jacó como aposto identificador de “meu pai”.
theological_decisions:
- issue: Identidade do governante do engano e do espírito do ciúme
  choice: Manter as duas designações sem identificação adicional
  alternative: Identificá-los explicitamente com Satanás ou tratá-los como uma única entidade
  rationale: O grego apresenta duas expressões coordenadas, mas não explicita sua relação ontológica nem fornece aqui um nome próprio; a tradução preserva essa tensão.
- issue: Leitura conflitante apresentada na revisão mais recente
  choice: Traduzir o texto grego fornecido, que afirma que o governante do engano e o espírito do ciúme cegaram a mente de Simeão
  alternative: Adotar “eram o deus dele” e a referência ao anjo que o resgatou
  rationale: A revisão registrada não corresponde ao original grego citado para esta unidade. Essas cláusulas não estão no texto fornecido e, portanto, não foram importadas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece digno e narrativo. Conservou-se a imagem visceral de “entranhas”, mas o propósito homicida foi formulado de modo idiomático. O marcador [a] aparece no texto principal.
