- from: Pois reconheci que havia concebido uma ação má diante do Senhor e de Jacó, meu pai, a respeito de José, meu irmão, por ter inveja dele.
  to: Pois eu sabia que tinha concebido uma ação má diante do Senhor e de Jacó, meu pai, por causa de José, meu irmão, a quem invejei.
  rationale: A revisão substitui a relação temática de «a respeito de» pelo valor causal de διά com acusativo, conserva a ambiguidade sintática de «diante do Senhor e de Jacó» sem acrescentar «contra», e torna Ἔγνων mais idiomático no contexto. «A quem invejei» traduz o particípio aoristo φθονήσας sem apresentar a inveja como mero estado atual.
