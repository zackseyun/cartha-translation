base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/014.yaml
  text: For I knew that I had conceived an evil deed before the Lord and Jacob my father concerning Joseph my brother, being envious of him.
translation:
  language: pt
  text: Pois eu sabia que tinha concebido uma ação má diante do Senhor e de Jacó, meu pai, por causa de José, meu irmão, a quem invejei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: reconheci
  rationale: Expressa a percepção ou tomada de consciência indicada pelo aoristo de γινώσκω, com naturalidade em português.
- source_word: πονηρὸν πρᾶγμα
  choice: uma ação má
  rationale: πρᾶγμα pode designar coisa, assunto ou ato; no contexto moral, «ação má» comunica melhor a ideia sem ampliar para um crime consumado.
- source_word: ἐνεθυμήθην
  choice: havia concebido
  rationale: Preserva o sentido de formar ou nutrir interiormente um pensamento ou propósito, anterior ao reconhecimento expresso por ἔγνων.
- source_word: ἐνώπιον κυρίου
  choice: diante do Senhor
  rationale: Equivalência formal e idiomática da expressão de avaliação na presença divina.
- source_word: διὰ Ἰωσὴφ τὸν ἀδελφόν μου
  choice: a respeito de José, meu irmão
  rationale: Neste contexto, διά com acusativo indica que José era o motivo ou objeto da ação concebida; «a respeito de» evita impor uma relação causal mais específica.
- source_word: φθονήσας αὐτῷ
  choice: por ter inveja dele
  rationale: Forma natural de exprimir o particípio aoristo e o complemento dativo de φθονέω, indicando a inveja que motivou o pensamento.
theological_decisions:
- issue: Relação de ἐνώπιον com «o Senhor e Jacó, meu pai»
  choice: diante do Senhor e de Jacó, meu pai
  alternative: diante do Senhor e contra Jacó, meu pai
  rationale: O grego não contém uma preposição equivalente a «contra». A tradução mantém a coordenação sintática, embora a formulação seja incomum, sem transformar Jacó explicitamente em alvo da ação.
- issue: Estado interior ou ato executado
  choice: havia concebido uma ação má
  alternative: havia praticado uma ação má
  rationale: ἐνεθυμήθην aponta para algo pensado ou concebido interiormente. A tradução não apresenta o ato como já executado.
translation_notes:
  register: Português moderno, digno e acessível, com construção próxima do grego sem rigidez excessiva. A repetição dos vínculos familiares («meu pai», «meu irmão») foi preservada por sua força narrativa e moral.
