  text: For I became very strong; I did not shrink from any deed, nor was I afraid of anything.
translation:
  language: pt
  text: Pois eu me tornei muito forte; não recuei diante de nenhum feito, nem tive medo de coisa alguma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνατὸς ... ἐγενόμην σφόδρα
  choice: eu me tornei muito forte
  rationale: Reproduz o sentido ingressivo de ἐγενόμην e a intensidade de σφόδρα em português natural.
- source_word: οὐκ ἐδειλίασα πρᾶξιν
  choice: não recuei diante de nenhum feito
  rationale: δειλιάω expressa falta de coragem ou recuo por temor; com πρᾶξιν, a formulação preserva a referência a um ato ou feito sem sugerir simplesmente que ele deixou de praticá-lo.
- source_word: οὐδὲ ἐφοβήθην ἀπὸ παντὸς πράγματος
  choice: nem tive medo de coisa alguma
  rationale: Expressa idiomaticamente a negação abrangente do grego, sem a artificialidade de uma tradução literal da preposição ἀπό.
