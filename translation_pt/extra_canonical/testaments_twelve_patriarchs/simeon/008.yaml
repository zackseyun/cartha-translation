  to: '8 Quando Simeão terminou de dar instruções a seus filhos, adormeceu com seus antepassados, aos cento e vinte anos de idade.


    2 Eles o colocaram num caixão de madeira, a fim de levar seus ossos para Hebrom. E os levaram em segredo, durante uma guerra dos egípcios.[a]


    3 Pois os egípcios mantinham os ossos de José nos túmulos dos reis.[b] 4 Os encantadores lhes diziam que, quando os ossos de José saíssem, haveria em toda a terra escuridão, trevas e uma grande praga sobre os egípcios,[c] de modo que, mesmo com uma lamparina, ninguém reconheceria o próprio irmão.'
