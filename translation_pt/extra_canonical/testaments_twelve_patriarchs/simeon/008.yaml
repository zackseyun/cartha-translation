base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008.yaml
  text: 'And when Simeon had finished commanding his sons[a], he fell asleep with his fathers, being one hundred and twenty years old.


    And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly during a war of the Egyptians.


    For the Egyptians were keeping the bones of Joseph in the tombs of the kings, so as to bring him up. For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague for the Egyptians[c][b], so that even with a lamp each man would not recognize his brother.'
translation:
  language: pt
  text: '8 Quando Simeão terminou de dar instruções a seus filhos, adormeceu com seus antepassados, aos cento e vinte anos de idade.


    2 Eles o colocaram num caixão de madeira, a fim de levar seus ossos para Hebrom. E os levaram em segredo, durante uma guerra dos egípcios.[a]


    3 Pois os egípcios mantinham os ossos de José nos túmulos dos reis.[b] 4 Os encantadores lhes diziam que, quando os ossos de José saíssem, haveria em toda a terra escuridão, trevas e uma grande praga sobre os egípcios,[c] de modo que, mesmo com uma lamparina, ninguém reconheceria o próprio irmão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é condensada e também pode ser entendida como “em segredo, durante uma guerra egípcia” ou “durante uma guerra entre os egípcios”.
    reason: alternative_reading
  - marker: b
    text: 'O texto deste versículo é difícil. Alguns testemunhos trazem “depósitos” em vez de “túmulos”, resultando em: “os egípcios mantinham os ossos de José nos depósitos dos reis”.'
    reason: textual_variant
  - marker: c
    text: Compare Gênesis 50:25 e Êxodo 13:19 a respeito de levar os ossos de José.
    reason: cross_reference
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: terminou de dar instruções
  rationale: Expressa a conclusão das recomendações finais de Simeão e conserva sua autoridade paterna sem a dureza excessiva que “dar ordens” teria neste contexto.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva o eufemismo tradicional para a morte e o tom bíblico do relato.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: com seus pais
  rationale: Mantém a fórmula tradicional referente à união de Simeão com seus antepassados na morte.
- source_word: θήκῃ ξυλίνῃ
  choice: caixão de madeira
  rationale: No contexto funerário, é a expressão portuguesa mais clara para o recipiente de madeira no qual o corpo foi colocado.
- source_word: τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ
  choice: a fim de levar seus ossos para Hebrom
  rationale: Comunica a finalidade da transferência dos restos mortais e torna explícito o destino já indicado pelo grego, sem acrescentar uma reconstrução histórica.
- source_word: ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  choice: em segredo, durante uma guerra dos egípcios
  rationale: Conserva a formulação comprimida e seus dois elementos — segredo e guerra — sem decidir se se tratava de uma guerra egípcia externa ou de conflito entre egípcios.
- source_word: ἐφύλαττον
  choice: mantinham
  rationale: Preserva o aspecto contínuo do imperfeito e permite tanto a ideia de retenção quanto a de custódia.
- source_word: μνήμασι τῶν βασιλέων
  choice: túmulos dos reis
  rationale: Segue o sentido funerário direto do texto fornecido; a variante “depósitos” é registrada em nota.
- source_word: ἐπαοιδοί
  choice: encantadores
  rationale: Designa praticantes de encantamentos ou fórmulas mágicas e se ajusta ao cenário antigo sem modernizá-lo indevidamente.
- source_word: σκότος καὶ γνόφος
  choice: escuridão, trevas
  rationale: Mantém a duplicação enfática de termos próximos e produz uma expressão natural e solene em português.
- source_word: πληγὴ μεγάλη
  choice: uma grande praga
  rationale: No contexto de calamidade contra o Egito, “praga” comunica adequadamente o juízo coletivo e evoca a linguagem bíblica sem identificar esta ocorrência com uma praga específica.
- source_word: μετὰ λύχνου μὴ ἐπιγινώσκειν ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: mesmo com uma lamparina, ninguém reconheceria o próprio irmão
  rationale: Reproduz de modo natural a consequência extrema da escuridão, conservando a referência individual e familiar.
theological_decisions:
- issue: Fórmula de morte ἐκοιμήθη
  choice: adormeceu
  alternative: morreu; descansou
  rationale: A tradução preserva o eufemismo convencional do texto sem transformá-lo numa afirmação doutrinária mais específica sobre o estado dos mortos.
- issue: Destino dos ossos de José
  choice: os egípcios mantinham os ossos de José nos túmulos dos reis
  alternative: os egípcios mantinham os ossos de José nos depósitos dos reis
  rationale: A leitura principal acompanha μνήμασι no texto grego fornecido, enquanto a dificuldade textual é explicitada em nota, sem harmonização silenciosa.
- issue: Predição dos encantadores
  choice: apresentada como aquilo que os encantadores diziam
  alternative: apresentá-la diretamente como profecia verdadeira do narrador
  rationale: A sintaxe atribui a declaração aos encantadores. A tradução mantém essa mediação e não endossa nem rejeita sua alegação por inferência teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantiveram-se as fórmulas bíblicas “adormeceu com seus pais” e “ossos de José”, ao passo que construções gregas comprimidas foram vertidas em sintaxe portuguesa corrente. Todos os marcadores de nota aparecem no texto principal.
