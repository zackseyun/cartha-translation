  source_fidelity: 'A tradução acompanha de perto o grego: preserva a conclusão das instruções, o eufemismo de morte, o caixão de madeira, a transferência secreta em contexto de guerra, a custódia dos ossos de José e a calamidade descrita pelos encantadores. A única correção necessária é a fórmula «com seus pais»: no português moderno, ela tende a significar literalmente os progenitores, enquanto μετὰ τῶν πατέρων αὐτοῦ é uma fórmula de morte referente aos antepassados.'
