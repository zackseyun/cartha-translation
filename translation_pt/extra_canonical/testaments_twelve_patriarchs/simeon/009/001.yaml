source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔκλαυσαν¹ οἱ² *υἱοὶ Συμεὼν³ τὸν πατέρα αὐτῶν⁴. Καὶ ἦσαν *εἰς Αἴγυπτον⁵ ἕως ἡμέρας ἐξόδου αὐτῶν⁶ *ἐν χειρὶ Μωϋσῆ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009/001.yaml
  text: And the sons of Simeon wept for their father. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: pt
  text: E os filhos de Simeão choraram por seu pai. E estiveram no Egito até o dia de sua saída, pela mão de Moisés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσαν ... τὸν πατέρα αὐτῶν
  choice: choraram por seu pai
  rationale: Expressa em português natural o lamento pelo pai, preservando o sentido da construção grega.
- source_word: ἦσαν εἰς Αἴγυπτον
  choice: estiveram no Egito
  rationale: Traduz diretamente ἦσαν sem acrescentar a ideia explícita de que 'permaneceram'; 'no Egito' é a formulação idiomática em português.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: até o dia de sua saída
  rationale: Mantém a referência temporal e o substantivo ἔξοδος de modo claro, sem impor aqui uma alusão técnica adicional ao Êxodo.
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: pela mão de Moisés
  rationale: Conserva a imagem semítica presente no grego e indica a atuação de Moisés como instrumento ou liderança, sem resolver além do texto.
theological_decisions:
- issue: Agência expressa em ἐν χειρὶ Μωϋσῆ
  choice: pela mão de Moisés
  alternative: sob a liderança de Moisés
  rationale: A tradução literal preserva a imagem e a possível amplitude da agência instrumental; a alternativa interpretaria a expressão de modo mais específico.
translation_notes:
  register: Português moderno, claro e digno, com estrutura coordenada próxima à do grego. A repetição de 'E' foi mantida para refletir o encadeamento narrativo do original.
