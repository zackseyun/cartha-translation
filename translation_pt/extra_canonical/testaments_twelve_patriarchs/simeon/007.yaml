base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007.yaml
  text: And now[[God and man]], my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will arise for us. For the Lord will raise up from Levi as a high priest, and from Judah as a king, [God and man]; he will save [all the nations and] the race of Israel[[all the nations and]]. Therefore I command these things to you, so that you also may command your children[the race of Israel], that they may keep them throughout their generations.
translation:
  language: pt
  text: '**7** ¹ E agora, meus filhos, escutem Levi e Judá e não se elevem acima destas duas tribos, pois delas surgirá para nós a salvação de Deus. ² Pois o Senhor levantará de Levi, como sumo sacerdote, e de Judá, como rei — [Deus e homem][a]. Ele salvará [todas as nações e][b] a linhagem de Israel[c]. ³ Por isso lhes ordeno estas coisas, para que vocês também as ordenem aos seus filhos, a fim de que eles as guardem por todas as suas gerações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “Deus e homem” aparece entre colchetes no testemunho grego fornecido, o que indica incerteza textual ou possível expansão posterior. Foi mantida para tornar a variante visível.
    reason: textual_variant
  - marker: b
    text: A expressão “todas as nações e” também aparece entre colchetes no testemunho grego e pode ser uma expansão textual. Ela foi mantida entre colchetes para sinalizar a incerteza.
    reason: textual_variant
  - marker: c
    text: Ou “o povo de Israel”. O grego γένος ressalta descendência, origem comum ou grupo de parentesco.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούσατε
  choice: escutem
  rationale: O imperativo denota ouvir com atenção e disposição para atender. “Escutem” mantém a exortação direta sem restringir o sentido à obediência absoluta.
- source_word: μὴ ἐπαίρεσθε
  choice: não se elevem acima
  rationale: A forma verbal expressa autoexaltação, e a construção conserva a ideia comparativa em relação às duas tribos.
- source_word: γενεὰς
  choice: tribos
  rationale: Embora γενεά possa significar “geração”, aqui Levi e Judá são grupos de descendência dentro de Israel; “tribos” torna o referente claro.
- source_word: τὸ σωτήριον τοῦ Θεοῦ
  choice: a salvação de Deus
  rationale: A formulação elevada preserva a ligação com a linguagem profética e deixa em aberto se se refere à ação salvadora ou a uma figura salvífica.
- source_word: ἀναστήσει
  choice: levantará
  rationale: Mantém o idioma profético de Deus fazer surgir ou instituir um líder, sem reduzi-lo a mera nomeação administrativa.
- source_word: ἀρχιερέα
  choice: sumo sacerdote
  rationale: É a designação portuguesa consagrada e preserva a especificidade cultual do cargo.
- source_word: βασιλέα
  choice: rei
  rationale: Conserva o título régio concreto do texto.
- source_word: σώσει
  choice: salvará
  rationale: Preserva a ligação lexical e temática com “salvação” no versículo anterior.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: a linhagem de Israel
  rationale: γένος destaca descendência, origem comum ou grupo de parentesco. “Linhagem” conserva essa nuance sem as associações modernas problemáticas de “raça”.
- source_word: φυλάξωσιν
  choice: guardem
  rationale: No contexto de mandamentos transmitidos entre gerações, significa conservar e observar o que foi ordenado.
theological_decisions:
- issue: Expressão entre colchetes Θεὸν καὶ ἄνθρωπον
  choice: Mantida no texto como “[Deus e homem]”, com nota de incerteza textual.
  alternative: Omitir a expressão como interpolação secundária ou vertê-la interpretativamente como “divino e humano”.
  rationale: O testemunho grego fornecido põe a expressão entre colchetes. A tradução literal preserva a tensão teológica e torna a possível expansão visível, sem impor uma formulação doutrinária posterior.
- issue: Expressão entre colchetes πάντα τὰ ἔθνη
  choice: Mantida no texto como “[todas as nações e]”, com nota de incerteza textual.
  alternative: Omitir a expressão como expansão secundária ou traduzir ἔθνη por “gentios”.
  rationale: Os colchetes no testemunho fornecido indicam incerteza. “Nações” preserva o possível alcance universal sem decidir que a expressão estabelece necessariamente um contraste técnico entre gentios e Israel.
- issue: Relação entre as figuras sacerdotal e régia e o pronome οὗτος
  choice: A tradução mantém a sequência e o singular “ele” sem explicar qual antecedente ou configuração de figuras está em vista.
  alternative: Identificar explicitamente o salvador apenas com o rei de Judá ou fundir sem ressalvas as figuras sacerdotal e régia.
  rationale: A sintaxe e a história textual permitem tensão quanto à relação entre as figuras. A tradução evita resolver silenciosamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantiveram-se o tom testamentário de exortação, a repetição de “ordenar” e os termos tradicionais “sumo sacerdote” e “rei”. Os colchetes internos reproduzem as incertezas assinaladas no testemunho grego; as notas usam marcadores alfabéticos no texto principal.
