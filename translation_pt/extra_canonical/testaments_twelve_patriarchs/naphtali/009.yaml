  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009.yaml
  text: 'And after commanding them many such things[[Here begins ...]], he urged them to carry his bones to Hebron and bury him with his fathers.


    2. And after eating and drinking with gladness of soul, he covered his face and died.


    3. And his sons did in every respect all that Naphtali their father had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.]'
translation:
  language: pt
  text: '9 Depois de lhes dar muitas ordens semelhantes, Naftali insistiu que levassem seus ossos para Hebrom e o sepultassem junto de seus antepassados.


    2 Depois de comer e beber com alegria de alma, cobriu o rosto e morreu.


    3 Seus filhos fizeram, em todos os aspectos, tudo o que Naftali, pai deles, lhes havia ordenado.


    [Aqui começa o Testamento de Gade, o nono filho de Jacó e Zilpa.][a]


    [a] O testemunho grego usado para esta edição encerra o capítulo com a abertura da obra seguinte: “Testamento de Gade, o nono filho de Jacó e Zilpa”. A frase foi mantida entre colchetes como transição paratextual, e não como parte das palavras finais de Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho grego usado para esta edição encerra o capítulo com a abertura da obra seguinte: “Testamento de Gade, o nono filho de Jacó e Zilpa”. A frase foi mantida entre colchetes como transição paratextual, e não como parte das palavras finais de Naftali.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: depois de lhes dar muitas ordens
  rationale: O particípio indica instruções de caráter obrigatório. “Dar ordens” conserva essa força sem tornar a frase excessivamente rígida.
- source_word: παρεκάλεσεν
  choice: insistiu
  rationale: O verbo expressa um apelo enfático. “Insistiu” comunica com naturalidade a urgência do pedido final de Naftali.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: levassem seus ossos
  rationale: Mantém o termo concreto “ossos” e expressa de modo idiomático o traslado dos restos mortais.
- source_word: ἐν Χεβρών
  choice: para Hebrom
  rationale: Embora ἐν costume significar “em”, o verbo de deslocamento favorece aqui o sentido de destino.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: junto de seus pais
  rationale: Preserva a linguagem familiar e patriarcal de sepultamento, deixando claro que se trata de ser sepultado no mesmo lugar que os antepassados.
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: com alegria de alma
  rationale: Conserva o caráter interior e elevado da expressão grega e a serenidade da cena de morte.
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: cobriu o rosto
  rationale: Tradução direta e digna, sem acrescentar uma interpretação sobre o gesto.
- source_word: κατὰ πάντα ὅσα ἐνετείλατο
  choice: fizeram, em todos os aspectos, tudo o que ... lhes havia ordenado
  rationale: Reproduz tanto a abrangência de κατὰ πάντα quanto a força obrigatória de ἐνετείλατο.
theological_decisions:
- issue: Inclusão da linha que introduz o testamento seguinte
  choice: Mantida entre colchetes como transição paratextual, com nota explicativa
  alternative: Omiti-la por não fazer parte da narrativa de Naftali, ou imprimi-la sem colchetes como texto corrido
  rationale: A linha pertence à transmissão do testemunho consultado, mas não às palavras finais de Naftali. Os colchetes e a nota preservam o dado textual sem confundir transição editorial com narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se expressões de tom testamentário, como “alegria de alma” e “junto de seus pais”, sem arcaísmo excessivo.
