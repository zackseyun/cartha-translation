  terminology: «Senhor» traduz adequadamente ὁ Κύριος. «Espírito» mantém a terminologia do original sem introduzir qualificações confessionais. «Oleiro» para κεραμεύς e «vaso» para σκεῦος são apropriados no contexto figurativo.
