id: T12P.NAP.2.2
reference: Testament of Naphtali 2:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καθὼς⁹ γὰρ *οἶδεν ὁ κεραμεὺς¹⁰ τὸ σκεῦος πόσον χωρεῖ, καὶ πρὸς αὐτὸ¹¹ φέρει τὸν¹² πηλόν, οὕτω¹³ καὶ ὁ Κύριος πρὸς ὁμοίωσιν τοῦ πνεύματος¹⁴ ποιεῖ¹⁵ τὸ σῶμα, καὶ πρὸς τὴν δύναμιν τοῦ σώματος¹⁶ *τὸ πνεῦμα ἐπιτίθησιν¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/002.yaml
  text: For just as the potter knows how much the vessel can hold, and according to that brings the clay for it, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body's capacity places the spirit in it.
translation:
  language: pt
  text: Pois, assim como o oleiro sabe quanto o vaso pode conter e, de acordo com isso, traz o barro para ele, assim também o Senhor faz o corpo segundo a semelhança do espírito e, de acordo com a capacidade do corpo, coloca nele o espírito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεραμεύς
  choice: oleiro
  rationale: Equivalente direto e natural para o artesão que trabalha com barro.
- source_word: σκεῦος
  choice: vaso
  rationale: No contexto do oleiro, “vaso” expressa naturalmente o recipiente moldado, sem ampliar o sentido para um objeto genérico.
- source_word: πόσον χωρεῖ
  choice: quanto ... pode conter
  rationale: Reproduz a ideia de capacidade do vaso em português claro e corrente.
- source_word: πρὸς αὐτό
  choice: de acordo com isso
  rationale: Mantém a relação de medida ou correspondência com a capacidade mencionada, reconhecendo que o pronome grego pode ser entendido de mais de uma maneira.
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: segundo a semelhança do espírito
  rationale: Preserva a formulação incomum e a relação explícita entre corpo e espírito, sem explicar ou harmonizar a antropologia do texto.
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος
  choice: de acordo com a capacidade do corpo
  rationale: Neste paralelismo, δύναμις indica a medida ou capacidade correspondente do corpo, mais naturalmente do que “poder” ou “força”.
- source_word: ἐπιτίθησιν
  choice: coloca nele
  rationale: Traduz o ato de pôr ou colocar; “nele” torna explícito em português o corpo como referente contextual, sem acrescentar uma noção de infusão.
theological_decisions:
- issue: Relação entre corpo e espírito
  choice: 'Manter as duas correspondências: o corpo é feito segundo a semelhança do espírito, e o espírito é colocado de acordo com a capacidade do corpo.'
  alternative: Reformular a passagem para apresentar uma sequência antropológica mais coerente ou explicar qual dos dois determina o outro.
  rationale: O grego conserva uma tensão recíproca entre corpo e espírito. A tradução não deve resolvê-la por meio de uma interpretação teológica externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe paralela do grego foi preservada, mas com pontuação e ordem naturais em português.
