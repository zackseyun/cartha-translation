  source_fidelity: 'A tradução reproduz com precisão o paralelismo do grego: a medida/capacidade do vaso orienta o barro, a semelhança do espírito orienta a formação do corpo, e a capacidade do corpo corresponde à colocação do espírito. «Quanto o vaso pode conter», «de acordo com isso», «segundo a semelhança do espírito» e «capacidade do corpo» são escolhas defensáveis e não resolvem indevidamente a antropologia do texto. «Nele» explicita de modo natural o referente contextual de «corpo», em consonância com o sentido da construção grega.'
