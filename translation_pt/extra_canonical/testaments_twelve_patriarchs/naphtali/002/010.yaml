  text: 10. *Ὅτι ἐὰν εἴπῃς τῷ ὀφθαλμῷ, Ἄκουε, οὐ δυνήσεται⁸²· οὕτως οὐδὲ *ἐν σκότει⁸³ *ὄντες δύνασθε ποιεῖν⁸⁴ ἔργα⁸⁵ φωτός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/010.yaml
  text: For if you say to the eye, “Hear,” it cannot; so neither, being in darkness, can you do the works of light.
translation:
  language: pt
  text: 'Pois, se você disser ao olho: “Ouça”, ele não poderá; assim também vocês, estando nas trevas, não podem fazer as obras da luz.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμῷ
  choice: olho
  rationale: Equivalente direto e natural, preservando a imagem do órgão da visão em contraste com a ordem de ouvir.
- source_word: Ἄκουε
  choice: Ouça
  rationale: Imperativo singular que reproduz a ordem impossível dirigida ao olho.
- source_word: ἐν σκότει ὄντες
  choice: enquanto estão nas trevas
  rationale: Expressa naturalmente a circunstância participial sem reduzir a formulação a uma identidade permanente.
- source_word: ποιεῖν ἔργα φωτός
  choice: praticar as obras da luz
  rationale: “Praticar” é idiomático para ações morais, enquanto “obras da luz” preserva a expressão e o contraste simbólico do grego.
theological_decisions:
- issue: Relação entre estar nas trevas e realizar obras da luz
  choice: 'Preservar a afirmação de incapacidade circunstancial: “enquanto estão nas trevas... não podem”'
  alternative: Interpretar como impossibilidade ontológica ou como simples impropriedade moral
  rationale: O grego liga a incapacidade à condição expressa por ἐν σκότει ὄντες, sem explicar sua natureza teológica; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para o plural e paralelismo preservado entre a incapacidade do olho de ouvir e a de quem está nas trevas praticar obras da luz.
