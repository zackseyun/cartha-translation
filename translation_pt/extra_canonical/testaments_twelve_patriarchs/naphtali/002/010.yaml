    issue: «Enquanto estão nas trevas» temporaliza a expressão participial.
    rationale: O grego ἐν σκότει ὄντες significa literalmente «estando/sendo nas trevas»; a forma circunstancial «estando nas trevas» é mais próxima e preserva melhor a relação não explicitada pelo texto.
  - severity: low
    issue: «Praticar as obras» é menos literal que o verbo grego.
    rationale: ποιεῖν significa «fazer». Embora «praticar» seja inteligível em contexto moral, «fazer as obras da luz» preserva a formulação e o paralelismo do original.
