  source_fidelity: A imagem central e o contraste moral são preservados. Contudo, ἐν σκότει ὄντες é mais diretamente «estando nas trevas» do que «enquanto estão nas trevas», e ποιεῖν ἔργα corresponde mais estritamente a «fazer as obras» do que a «praticar as obras». A alternância do singular inicial com o plural final reflete o grego (εἴπῃς / δύνασθε).
  naturalness: A redação revista conserva português moderno e claro, com «você» no exemplo individual e «vocês» na aplicação plural. «Estando nas trevas» mantém a construção circunstancial sem tornar a frase pesada.
  terminology: «Olho», «trevas», «obras» e «luz» são equivalentes diretos e preservam o vocabulário figurado do original. «Fazer as obras da luz» reproduz a expressão grega sem especificar indevidamente sua interpretação.
  issues:
