revisions:
- from: '8 Pois Deus fez boas todas as coisas, cada uma em sua ordem: pôs os cinco sentidos na cabeça e uniu o pescoço à cabeça; acrescentou-lhe também os cabelos, para beleza e honra; depois, o coração para o entendimento, o ventre para a separação[a], o estômago para a trituração, a traqueia para a saúde[b], o fígado para a ira, a bílis para a amargura, o baço para o riso, os rins para a astúcia, os músculos lombares para a força, o lado para dormir[c], a cintura para o vigor, e assim por diante.'
  to: '8 Pois Deus fez boas todas as coisas, em sua ordem: pôs os cinco sentidos na cabeça e uniu o pescoço à cabeça; acrescentou também à cabeça os cabelos, para beleza e glória; depois, o coração para o entendimento, o ventre para a separação[a], o estômago para a trituração, o tubo para a saúde[b], o fígado para a ira, a bílis para a amargura, o baço para o riso, os rins para a astúcia, os músculos lombares para a força, o lado para dormir[c], os lombos para o vigor, e assim por diante.'
  rationale: A revisão conserva a estrutura, a fisiologia antiga e as ambiguidades textuais. Ela substitui a identificação interpretativa «traqueia» por «tubo», explicita que os cabelos são acrescentados à cabeça, emprega «glória» para δόξα e usa «lombos» para ὀσφύς, distinguindo-o dos músculos lombares mencionados imediatamente antes.
