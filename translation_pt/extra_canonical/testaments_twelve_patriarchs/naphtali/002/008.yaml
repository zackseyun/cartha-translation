source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. *Πάντα ⌜γὰρ⌝⁶⁰ ἐν τάξει ἐποίησεν ὁ Θεὸς καλά· τὰς πέντε αἰσθήσεις ἐν τῇ κεφαλῇ *καὶ τὸν τράχηλον συνάψας τῇ κεφαλῇ⁶¹, *προσθεὶς αὐτῇ καὶ τρίχας εἰς εὐπρέπειαν καὶ δόξαν⁶², εἶτα⁶³ καρδίαν *εἰς φρόνησιν⁶⁴, κοιλίαν εἰς †διάκρισιν⁶⁵, *στόμαχον εἰς †ἀλεσμόν⁶⁶, †κάλαμον⁶⁷ πρὸς †ὑγείαν⁶⁸, ἧπαρ⁶⁹ πρὸς θυμόν, χολὴν πρὸς πικρίαν, ⌜καὶ⌝⁷⁰ *σπλῆνα πρὸς γέλωτα⁷¹, νεφροὺς ⌜εἰς πανουργίαν⁷², ψύας⁷³⌝ εἰς δύναμιν, *†πλευρὰν εἰς τὸ καθεύδειν†⁷⁴, ὀσφὺν⁷⁵ εἰς ἰσχύν, καὶ τὰ ἑξῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/008.yaml
  text: 'For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.'
translation:
  language: pt
  text: '8 Pois Deus fez boas todas as coisas, em sua ordem: pôs os cinco sentidos na cabeça e uniu o pescoço à cabeça; acrescentou também à cabeça os cabelos, para beleza e glória; depois, o coração para o entendimento, o ventre para a separação[a], o estômago para a trituração, o tubo para a saúde[b], o fígado para a ira, a bílis para a amargura, o baço para o riso, os rins para a astúcia, os músculos lombares para a força, o lado para dormir[c], os lombos para o vigor, e assim por diante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego traz literalmente «para a separação» ou «para o discernimento», mas a expressão está assinalada como textualmente incerta; talvez se refira à função de separar e eliminar resíduos.
    reason: Preserva a leitura transmitida e informa sua dificuldade sem introduzir no texto uma reconstrução fisiológica.
  - marker: b
    text: Literalmente, «o tubo para a saúde». «Tubo» pode designar a traqueia, mas tanto o órgão quanto a função pretendida são incertos no texto grego.
    reason: Mantém no texto principal a ambiguidade de κάλαμος e da expressão assinalada como duvidosa.
  - marker: c
    text: A expressão «o lado para dormir» está assinalada como textualmente incerta.
    reason: Registra a incerteza da edição sem substituir a leitura transmitida por uma reconstrução.
lexical_decisions:
- source_word: καλά
  choice: boas
  rationale: O adjetivo pode significar tanto «boas» como «belas». «Boas» expressa naturalmente a avaliação positiva da ordem da criação, sem excluir a ideia de beleza retomada adiante.
- source_word: εἰς φρόνησιν
  choice: para o entendimento
  rationale: φρόνησις indica compreensão, prudência ou discernimento; «entendimento» preserva aqui a associação antiga entre coração e faculdade mental sem estreitá-la à prudência moral.
- source_word: κοιλίαν εἰς διάκρισιν
  choice: o ventre para a separação
  rationale: Tradução deliberadamente próxima do grego transmitido. διάκρισις significa distinção ou separação, embora o contexto fisiológico e a corrupção assinalada tornem incerto o sentido pretendido.
- source_word: στόμαχον εἰς ἀλεσμόν
  choice: o estômago para a trituração
  rationale: ἀλεσμός é moagem ou trituração; a formulação comunica a imagem digestiva em português atual.
- source_word: κάλαμον πρὸς ὑγείαν
  choice: a traqueia para a saúde
  rationale: κάλαμος significa literalmente «cana» ou «tubo» e pode designar a traqueia. ὑγεία é mantido como «saúde», embora a expressão esteja textualmente assinalada como incerta.
- source_word: χολὴν πρὸς πικρίαν
  choice: a bílis para a amargura
  rationale: Mantém a correspondência literal e a antiga associação corporal e afetiva do enunciado.
- source_word: νεφροὺς εἰς πανουργίαν
  choice: os rins para a astúcia
  rationale: πανουργία pode ser habilidade, astúcia ou malícia. «Astúcia» conserva a ambivalência, evitando torná-la necessariamente perversa.
- source_word: ψύας εἰς δύναμιν
  choice: os músculos lombares para a força
  rationale: ψόαι/ψύαι designa os músculos da região lombar, não simplesmente os «lombos»; a escolha diferencia esta expressão de ὀσφύν, que aparece depois.
- source_word: πλευρὰν εἰς τὸ καθεύδειν
  choice: o lado para dormir
  rationale: πλευρά pode significar lado ou costela. «Lado» torna compreensível a associação com dormir e preserva o singular do texto.
- source_word: ὀσφὺν εἰς ἰσχύν
  choice: a cintura para o vigor
  rationale: ὀσφύς designa a cintura ou região lombar, enquanto ἰσχύς expressa vigor ou força física. «Cintura» evita repetir «músculos lombares».
theological_decisions:
- issue: Bondade e ordenação da criação
  choice: «Deus fez boas todas as coisas, cada uma em sua ordem»
  alternative: «Deus fez belas todas as coisas em ordem»
  rationale: A tradução conserva tanto a ação criadora de Deus quanto a distribuição ordenada das partes. «Boas» é a leitura mais natural de καλά neste enunciado, mas não transforma a frase numa fórmula denominacional nem elimina a nuance estética do termo.
- issue: Antropologia fisiológica antiga
  choice: Manter as associações entre órgãos, afetos e faculdades exatamente como afirma o texto
  alternative: Modernizar ou explicar essas associações segundo a medicina contemporânea
  rationale: As correspondências pertencem à visão antropológica do documento e devem ser traduzidas, não corrigidas. Notas são usadas apenas onde o próprio texto grego é incerto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura enumerativa preservada. Empregaram-se termos anatômicos compreensíveis e atuais, sem apagar a fisiologia antiga do documento. As três notas sinalizam apenas dificuldades reais do grego transmitido; todos os marcadores aparecem no texto principal.
