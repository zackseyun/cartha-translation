  source_fidelity: A enumeração e as associações fisiológicas foram em geral preservadas. Contudo, «traqueia» resolve no texto principal um termo transmitido como κάλαμον («tubo/cana») e uma função («para a saúde») que a própria edição assinala como incertas. Convém manter essa indeterminação na tradução e indicar a possível identificação em nota. Também é preferível explicitar que os cabelos são acrescentados à cabeça, pois o pronome grego se refere a ela, não ao pescoço.
  naturalness: O português é claro e mantém adequadamente o ritmo enumerativo. As pequenas alterações propostas evitam a referência pronominal ambígua em «acrescentou-lhe» e tornam a tradução mais fiel sem sacrificar a legibilidade.
  terminology: «Glória» corresponde mais diretamente a δόξα do que «honra». «Tubo» preserva o valor de κάλαμος; «traqueia» deve ficar como possibilidade na nota. «Músculos lombares» e «lombos» distinguem de modo útil ψύας e ὀσφύν.
