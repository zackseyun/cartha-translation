    issue: «a traqueia para a saúde» fixa uma identificação anatômica incerta.
    rationale: κάλαμος significa literalmente «cana» ou «tubo», e tanto ele como a função πρὸς ὑγείαν estão assinalados como textualmente duvidosos. A nota não elimina a interpretação já imposta pelo texto principal.
  - severity: low
    issue: O pronome em «acrescentou-lhe também os cabelos» pode retomar «pescoço».
    rationale: No grego, αὐτῇ retoma a cabeça; a tradução deve tornar o antecedente explícito.
  - severity: low
    issue: «honra» enfraquece a correspondência lexical de δόξαν.
    rationale: «Glória» é o equivalente direto e permanece natural no contexto.
