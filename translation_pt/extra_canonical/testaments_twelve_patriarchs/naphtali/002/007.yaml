source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
translation:
  language: pt
  text: 7 E, assim como há distinção entre a luz e as trevas, e entre a ação[a] e a audição, também há distinção entre um homem e outro, e entre uma mulher e outra; e não se pode dizer que, quanto à aparência, um seja inferior ao outro.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente «ação». Algumas traduções entendem «visão», que forma um paralelo mais natural com «audição», mas essa leitura não aparece no texto grego aqui adotado.
    reason: Sinaliza uma provável dificuldade textual ou leitura inesperada sem corrigir silenciosamente o texto-fonte.
  - marker: b
    text: A redação grega da última oração é difícil e possivelmente corrompida; a tradução apresenta seu sentido provável. «Aparência» também pode ser traduzido por «rosto» ou «pessoa».
    reason: Preserva a incerteza textual e a amplitude semântica de πρόσωπον.
lexical_decisions:
- source_word: κεχώρισται / ἀνάμεσον
  choice: há distinção entre / de ... para outro
  rationale: Expressa a separação ou diferenciação indicada pelo perfeito passivo e por ἀνάμεσον, evitando a formulação pouco natural «está separado entre».
- source_word: δράσεως
  choice: ação
  rationale: É o sentido lexical do texto grego fornecido. Embora «visão» forme um par mais esperado com «audição» e apareça na camada inglesa, isso exigiria pressupor uma leitura ou correção não presente no texto-base citado.
- source_word: ἀκοῆς
  choice: audição
  rationale: Mantém o substantivo abstrato e corresponde diretamente ao sentido de ouvir ou à faculdade auditiva.
- source_word: ἀνδρὸς καὶ ἀνδρός / γυναικὸς καὶ γυναικός
  choice: de um homem para outro / de uma mulher para outra
  rationale: Reproduz de modo natural em português a diferenciação entre indivíduos do mesmo sexo expressa pela repetição dos substantivos.
- source_word: προσώποις
  choice: aparência
  rationale: πρόσωπον pode designar rosto, aspecto, aparência ou pessoa. Neste contexto, «aparência» produz uma leitura coerente sem impor uma referência estrita apenas ao rosto.
- source_word: ἡττόμενον
  choice: inferior
  rationale: Reflete o sentido comparativo de ser menor, pior ou inferior.
theological_decisions:
- issue: Diversidade entre seres humanos e avaliação de inferioridade
  choice: Preservar tanto a afirmação de distinção individual quanto a negação de inferioridade quanto à aparência.
  alternative: Interpretar a distinção como hierarquia natural entre pessoas.
  rationale: O texto distingue indivíduos, mas sua cláusula final, apesar de textualmente difícil, parece rejeitar a conclusão de que um seja inferior ao outro quanto à aparência; não se deve introduzir uma hierarquia ausente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição retórica foi mantida, mas a construção «de um ... para outro» evita rigidez excessiva. As notas tornam explícitas as duas principais dificuldades do grego.
