  text: 9. Ἡ δὲ⁵⁰ μήτηρ μου *Βάλλα ὑπῆρχε⁵¹ θυγάτηρ Ῥουθαίου⁵², ἀδελφοῦ Δεβόρρας⁵³, τῆς τροφοῦ Ῥεβέκκας⁵⁴, ἥτις⁵⁵ ἐν μιᾷ ἡμέρᾳ ἐτέχθη⁵⁶ ἐν ᾗ καὶ Ῥαχιήλ⁵⁷. 10. Ὁ δὲ Ῥουθαῖος⁵⁸ ἐκ τοῦ γένους ἦν⁵⁹ Ἀβραάμ, Χαλδαῖος, θεοσεβής, ἐλεύθερος καὶ εὐγενής. 11. *Καὶ αἰχμαλωτισθεὶς⁶⁰ ἠγοράσθη ὑπὸ Λαβάν· καὶ ἔδωκεν αὐτῷ Εὐνὰν⁶¹ τὴν παιδίσκην αὐτοῦ⁶² εἰς⁶³ γυναῖκα, ἥτις⁶⁴ ἔτεκε θυγατέρα, καὶ ἐκάλεσεν *τὸ ὄνομα αὐτῆς⁶⁵ Ζέλφαν⁶⁶, *ἐπʼ ὀνόματι⁶⁷ τῆς πόλεως⁶⁸ ἐν ᾗ αἰχμαλωτίσθη⁶⁹. 12. *Καὶ μετὰ τοῦτο ἔτεκεν τὴν Βάλλαν⁷⁰, λέγων· †Καινοποιός μου ἡ θυγάτηρ. II. *Ἐγὼ ἤμην κοῦφος¹ Γτοῖς ποσίν¹² *ὡς ἡ³ ἔλαφος Γκαὶ¹⁴ ἔταξέ με ὁ πατήρ μου ΓἸακὼβ¹⁵ εἰς πᾶσαν ἀγγελίαν⁶, *καίγε ὡσεὶ⁷ ἔλαφόν με ηὐλόγησεν⁸.
