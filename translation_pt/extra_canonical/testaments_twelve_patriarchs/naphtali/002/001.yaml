  text: My mother Bilhah was the daughter of Rotheus, the brother of Deborah, the nurse of Rebecca; she was born on the same day as Rachel. 10 And Rotheus was of the lineage of Abraham, a Chaldean, God-fearing, freeborn and noble. 11 And having been taken captive, he was bought by Laban; and Laban gave him his maidservant Eunan as a wife, and she bore a daughter, and he called her name Zelpha, after the name of the city in which he had been taken captive. 12 And after this she bore Bilhah, saying, ‘My daughter is one who renews.’ II. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he indeed blessed me as a deer.
translation:
  language: pt
  text: Eu era ligeiro de pés como uma corça, e meu pai Jacó me designou para levar toda espécie de mensagem; e foi como uma corça que ele me abençoou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν
  choice: ligeiro de pés
  rationale: Expressa de modo natural e digno a agilidade física indicada literalmente por ‘leve nos pés’.
- source_word: ἔλαφος
  choice: corça
  rationale: O substantivo grego está no feminino neste contexto e remete à imagem tradicional de Naftali como corça.
- source_word: εἰς πᾶσαν ἀγγελίαν
  choice: para levar toda espécie de mensagem
  rationale: ἀγγελία designa mensagem ou incumbência de mensageiro; a formulação explicita a função sem reduzi-la ao sentido moderno e genérico de ‘recado’.
- source_word: καίγε
  choice: e foi ... que
  rationale: A construção enfática portuguesa comunica que Jacó de fato o abençoou mediante a mesma imagem da corça, sem acrescentar uma ideia temporal ausente do grego.
