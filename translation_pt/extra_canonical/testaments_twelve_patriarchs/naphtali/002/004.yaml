source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ καθὼς²⁵ οἶδεν²⁶ ὁ κεραμεὺς ἑνὸς ἑκάστου τὴν χρῆσιν †ὡς²⁷ ἱκανή²⁸, οὕτω²⁹ καὶ ὁ Κύριος οἶδε τὸ σῶμα, ἕως τίνος διαρκέσει ἐν *τῷ ἀγαθῷ³⁰, καὶ πότε ἔρχεται³¹ *ἐν κακῷ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/004.yaml
  text: And just as the potter knows the use of each one, as it is fit, so also the Lord knows the body, how long it will endure in good, and when it comes into evil.
translation:
  language: pt
  text: 'E, assim como o oleiro conhece a utilidade de cada um, conforme é adequada[a], assim também o Senhor conhece o corpo: por quanto tempo permanecerá no bem e quando entrará no mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta expressão é difícil e possivelmente sofreu corrupção na transmissão; também pode ser entendido como “segundo a capacidade de cada um”.
    reason: Sinaliza a incerteza textual em †ὡς ἱκανή e preserva uma alternativa plausível sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: κεραμεύς
  choice: oleiro
  rationale: Equivalente direto e natural para o artesão que trabalha com barro.
- source_word: ἑνὸς ἑκάστου τὴν χρῆσιν
  choice: a utilidade de cada um
  rationale: Preserva a ausência de um substantivo explícito no grego; o contexto do oleiro permite entender que se trata de cada objeto ou peça.
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: permanecerá no bem
  rationale: Expressa a ideia de durar ou perseverar no âmbito do bem sem tornar a frase excessivamente literal.
- source_word: ἔρχεται ἐν κακῷ
  choice: entrará no mal
  rationale: Mantém a imagem verbal de vir ou entrar no mal, sem interpretá-la mais especificamente como queda moral.
theological_decisions:
- issue: Conhecimento do Senhor acerca do corpo e de sua trajetória moral
  choice: O Senhor conhece por quanto tempo o corpo permanecerá no bem e quando entrará no mal.
  alternative: O Senhor determina por quanto tempo o corpo ficará no bem e quando cairá no mal.
  rationale: O verbo οἶδε significa 'conhece/sabe', não 'determina'; a tradução evita introduzir uma afirmação sobre predestinação causal que o texto não explicita.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura comparativa próxima do grego. Emprega “cada um” para não acrescentar “vaso” ou “peça”, substantivos ausentes no texto-fonte, e mantém “corpo”, “bem” e “mal” sem explicações doutrinárias.
source_grounding:
  english_pob_role: consult_only
