  text: 9. Οὕτως⁷⁶ ⌜οὖν⌝ *ἔστωσαν, τέκνα μου, πάντα τὰ ἔργα ὑμῶν ἐν τάξει εἰς ἀγαθόν⁷⁷ ἐν φόβῳ Θεοῦ, καὶ μηδὲν ἄτακτον ποιήσητε⁷⁸ ἐν καταφρονήσει, μηδὲ⁷⁹ ἔξω⁸⁰ *καιροῦ αὐτοῦ⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/009.yaml
  text: So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.
translation:
  language: pt
  text: Portanto, meus filhos, que todas as suas obras estejam em boa ordem para o bem, no temor de Deus. Não façam nada desordenadamente, com desprezo, nem fora do tempo que lhe é próprio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τάξει
  choice: de modo ordenado
  rationale: Expressa a ideia de ordem e boa disposição de maneira natural em português, sem ampliar o sentido.
- source_word: εἰς ἀγαθόν
  choice: visando ao bem
  rationale: Preserva a orientação ou finalidade indicada por εἰς, em vez de reduzir a expressão a uma mera qualidade moral.
- source_word: ἐν φόβῳ Θεοῦ
  choice: no temor de Deus
  rationale: Mantém a formulação religiosa tradicional e a amplitude semântica de φόβος, que pode incluir reverência e temor.
- source_word: ἐν καταφρονήσει
  choice: com desprezo
  rationale: Reproduz o sentido de atitude desdenhosa ou negligente sem especificar um objeto não expresso no grego.
- source_word: ἔξω καιροῦ αὐτοῦ
  choice: fora do tempo que lhe é próprio
  rationale: Comunica que cada obra ou ação possui uma ocasião apropriada, preservando o referente gramaticalmente aberto de αὐτοῦ.
theological_decisions:
- issue: Sentido de φόβος diante de Deus
  choice: temor de Deus
  alternative: reverência a Deus
  rationale: A tradução escolhida conserva tanto a dimensão reverente quanto a possibilidade de temor, sem resolver a tensão lexical.
- issue: Referente de αὐτοῦ em «seu tempo»
  choice: o tempo que lhe é próprio
  alternative: o tempo próprio de Deus
  rationale: O contexto imediato favorece a ocasião apropriada de cada ato; a tradução evita introduzir a ideia não explícita de um tempo pertencente a Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A divisão em duas frases reduz o peso sintático sem alterar a progressão do texto grego.
