base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/006.yaml
  text: As a person's strength is, so also is his word, whether in the law of the Lord or in the works of Beliar.
translation:
  language: pt
  text: Pois, assim como é a sua força, assim também é a sua palavra, seja na lei do Senhor, seja na lei de Beliar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Há uma leitura variante: “nas obras de Beliar”. “Beliar” é uma forma do nome também conhecido como “Belial”.'
    reason: Registra a variante ἔργοις refletida na camada inglesa auditada e esclarece a forma do nome sem abandonar a leitura da fonte grega apresentada.
lexical_decisions:
- source_word: ἰσχύς
  choice: força
  rationale: Equivalente direto e natural, preservando a relação entre a capacidade da pessoa e sua fala.
- source_word: λόγος
  choice: palavra
  rationale: O texto grego apresentado traz λόγος, não ἔργον; “palavra” mantém o sentido básico e o paralelismo da frase.
- source_word: νόμος
  choice: lei
  rationale: Reproduz a repetição presente no texto grego fornecido, sem harmonizar a segunda ocorrência com a leitura variante refletida na versão inglesa.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega do nome e evita substituir silenciosamente a forma textual por “Belial”.
theological_decisions:
- issue: Contraste entre a lei do Senhor e a lei de Beliar
  choice: Manter “lei” nos dois membros
  alternative: “lei do Senhor” e “obras de Beliar”
  rationale: A fonte grega citada lê νόμῳ em ambos os membros. A leitura alternativa deve ser registrada em nota, não inserida no texto principal como se fosse inequívoca.
translation_notes:
  register: Português moderno, claro e digno. A construção correlativa “assim como... assim também” conserva o paralelismo grego; “seja... seja” expressa naturalmente as duas possibilidades introduzidas por ἤ... ἤ.
