source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 5. Ὅτι οὐκ ἔστι πλάσμα³³ καὶ πᾶσα ἔννοια ἣν Γοὐκ¹ ἔγνω Κύριος· *πάντα γὰρ³⁴ *ὁ ἄνθρωπον³⁵ ἔκτισεν κατʼ εἰκόνα ἑαυτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/005.yaml
  text: For there is no creation and no thought that the Lord does not know; for he created all things, and he created man in his own image.
translation:
  language: pt
  text: Pois não há coisa criada nem pensamento algum que o Senhor não conheça; pois ele criou todas as coisas e criou o ser humano à sua própria imagem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλάσμα
  choice: criatura
  rationale: O termo designa aquilo que foi formado ou criado. “Criatura” conserva aqui o sentido concreto e evita a possível leitura abstrata de “criação” como ato criador.
- source_word: πᾶσα ἔννοια
  choice: pensamento algum
  rationale: Com a negação precedente, esta formulação portuguesa exprime naturalmente “nenhum pensamento”, preservando o alcance total de πᾶσα e o sentido mental de ἔννοια.
- source_word: πάντα
  choice: todas as coisas
  rationale: Embora a transmissão grega da oração seja irregular, πάντα sustenta o sentido abrangente de “todas as coisas”, conforme a leitura adotada no texto auditado.
- source_word: ὁ ἄνθρωπον
  choice: o ser humano
  rationale: A forma transmitida é gramaticalmente irregular, mas aponta para ἄνθρωπος em sentido genérico. “O ser humano” preserva o singular coletivo sem restringir a referência ao sexo masculino.
- source_word: κατʼ εἰκόνα ἑαυτοῦ
  choice: à sua própria imagem
  rationale: Reproduz a relação de conformidade expressa por κατά e explicita naturalmente o reflexivo ἑαυτοῦ.
theological_decisions:
- issue: Extensão do conhecimento do Senhor
  choice: “não há criatura nem pensamento algum que o Senhor não conheça”
  alternative: “não há criação nem pensamento que o Senhor não conheça”
  rationale: A tradução mantém lado a lado o domínio criado e o mental, sem reduzir a afirmação a propósitos divinos nem resolver a tensão entre criatura e pensamento.
- issue: Referente de “sua própria imagem”
  choice: Mantido como referência ao sujeito divino da oração
  alternative: Reformular como “à imagem de Deus”
  rationale: O reflexivo grego liga a imagem ao criador mencionado no contexto; conservar o pronome evita acrescentar uma identificação nominal não expressa nesta oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A coordenação foi mantida clara, e “ser humano” foi preferido como genérico contemporâneo.
