revisions:
- from: E nós, açoitados pela tempestade em alto-mar, éramos levados à deriva; o navio se encheu de água e era golpeado de todos os lados em meio às tempestades, a ponto de começar a se despedaçar.
  to: E nós, açoitados pela tempestade no mar, éramos levados; e o navio se encheu de água e, sacudido pelas ondas revoltas, estava a ponto de se despedaçar.
  rationale: A correção substitui a segunda ocorrência de «tempestades» por uma expressão que representa o sentido marítimo de τρικυμίαις e remove a inferência adicional de início em «começar a». A redação conserva os eventos centrais, a passividade e o perigo iminente presentes no grego e no registro de auditoria em inglês.
  reviewer_model: gpt-5.6-terra
