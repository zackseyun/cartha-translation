review_pass:
  verdict: revise
  source_fidelity: A revisão proposta aproxima τρικυμίαις de «ondas revoltas»/vagas, em vez de repetir «tempestades», e evita acrescentar «começar», que não é expresso pelo infinitivo συντρίβεσθαι. Mantém o aspecto passivo e a consequência iminente da cena.
  naturalness: O texto revisto é fluente em português moderno e conserva uma cadência narrativa clara, sem explicitar além do necessário a direção ou o agente do movimento do navio.
  terminology: «Açoitados pela tempestade», «éramos levados», «se encheu de água» e «sacudido pelas ondas revoltas» são escolhas naturais e adequadas ao vocabulário marítimo, sem impor interpretação doutrinária ou histórica.
  issues:
  - severity: medium
    issue: «em meio às tempestades» para ἐν τρικυμίαις
    rationale: τρικυμίαις designa ondas ou vagas violentas, não meramente tempestades; além disso, a formulação repete desnecessariamente a tempestade já expressa por χειμαζόμενοι.
  - severity: low
    issue: «começar a se despedaçar» para συντρίβεσθαι
    rationale: «Começar» introduz uma noção aspectual que o grego não explicita. «A ponto de se despedaçar» preserva melhor a consequência ameaçadora expressa por ὥστε com o infinitivo.
