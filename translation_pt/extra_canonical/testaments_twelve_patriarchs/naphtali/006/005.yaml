base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/005.yaml
  text: And we, being storm-tossed on the sea, were being driven over the waters, and the ship was filled and battered in the storms, so that it was in danger of breaking apart.
translation:
  language: pt
  text: E nós, açoitados pela tempestade no mar, éramos levados; e o navio se encheu de água e, sacudido pelas ondas revoltas, estava a ponto de se despedaçar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμαζόμενοι
  choice: açoitados pela tempestade
  rationale: Expressa de modo natural o particípio passivo, indicando que os tripulantes sofriam a ação da tempestade.
- source_word: ἐπὶ τὸ πέλαγος
  choice: em alto-mar
  rationale: πέλαγος designa o mar aberto; a expressão portuguesa transmite o cenário marítimo com clareza.
- source_word: ἐφερόμεθα
  choice: éramos levados à deriva
  rationale: Preserva o aspecto passivo e durativo do imperfeito, bem como a falta de controle sobre o movimento.
- source_word: ἐπληρώθη τὸ πλοῖον ὑδάτων
  choice: o navio se encheu de água
  rationale: Tradução direta e idiomática da construção grega; o plural ὑδάτων não exige plural lexical em português.
- source_word: περιρησσόμενον
  choice: era golpeado de todos os lados
  rationale: Reproduz a ideia do particípio de impacto violento ao redor, sem limitar indevidamente o agente a ondas, que não aparecem explicitamente no texto.
- source_word: ὥστε καὶ συντρίβεσθαι αὐτό
  choice: a ponto de começar a se despedaçar
  rationale: Mantém a consequência introduzida por ὥστε e representa o infinitivo presente passivo sem transformar a afirmação em mera possibilidade.
