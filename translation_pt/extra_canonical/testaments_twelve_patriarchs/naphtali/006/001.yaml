source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VI. *Καὶ πάλιν¹ μετὰ ἡμέρας² ἑπτὰ εἶδον *ὅτι ὁ πατὴρ μου Ἰακὼβ ἴστατο³ ἐν τῇ θαλάσσῃ Ἀμνείας⁴, καὶ ἡμεῖς⁵ σὺν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/001.yaml
  text: And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him.
translation:
  language: pt
  text: E novamente, depois de sete dias, vi que meu pai Jacó estava em pé junto ao mar de Amneia[a], e nós estávamos com ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação do nome de lugar “Amneia” é incerta; a tradução preserva a forma grega, em vez de propor uma localização conjectural.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: novamente
  rationale: Reproduz de modo natural a ideia de repetição.
- source_word: μετὰ ἡμέρας ἑπτά
  choice: depois de sete dias
  rationale: Tradução direta e idiomática da expressão temporal.
- source_word: ἴστατο
  choice: estava em pé
  rationale: Preserva explicitamente a postura indicada pelo verbo grego, sem reduzi-lo apenas a 'estava'.
- source_word: ἐν τῇ θαλάσσῃ Ἀμνείας
  choice: junto ao mar de Amneia
  rationale: Entende ἐν em sentido locativo contextual, como presença à margem ou junto do mar, evitando a leitura improvável de estar dentro da água; conserva o topônimo grego sem identificação conjectural.
- source_word: σὺν αὐτῷ
  choice: com ele
  rationale: Equivalente corrente e claro da expressão grega de companhia.
