- source_word: περιβαλλόμενος σάκκον
  choice: vestido de pano de saco
  rationale: Expressa de modo natural o uso do pano de saco como veste, preservando a imagem penitencial do grego.
- source_word: ἐδέετο
  choice: suplicava
  rationale: O verbo indica pedido insistente ou súplica; o imperfeito sugere ação em curso.
- source_word: τοῦ Κυρίου
  choice: ao Senhor
  rationale: Na construção com δέομαι, o genitivo indica a pessoa a quem se dirige a súplica; a forma tradicional e clara em português é «ao Senhor».
