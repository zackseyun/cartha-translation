source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἰδοὺ πλοῖον ἤρχετο⁷ ἁρμενίζον⁸ *ἐκτὸς ναυτῶν⁹ καὶ κυβερνητῶν¹⁰· ἐπεγέγραπτο *δὲ τῷ πλοίῳ¹¹ *ὅτι πλοῖον¹² Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/002.yaml
  text: 'And behold, a ship was coming, sailing beside us, with sailors and pilots. And on the ship was written this: “Jacob’s ship.”'
translation:
  language: pt
  text: 'E eis que vinha um navio, navegando sem marinheiros nem pilotos. No navio estava escrito: “Navio de Jacó”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρχετο
  choice: vinha
  rationale: O imperfeito indica uma ação em curso, preservando a ideia de que o navio se aproximava ou vinha chegando.
- source_word: ἁρμενίζον
  choice: navegando
  rationale: Expressa de modo natural o movimento do navio a vela, sem acrescentar uma direção não explicitada pelo grego.
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: sem marinheiros nem pilotos
  rationale: ἐκτός com o genitivo significa aqui ausência ou exclusão. Esta tradução segue o texto grego fornecido, em contraste com a camada inglesa, que traz “with sailors and pilots”.
- source_word: ἐπεγέγραπτο
  choice: estava escrito
  rationale: O mais-que-perfeito passivo descreve uma inscrição já feita e visível no navio.
- source_word: πλοῖον Ἰακώβ
  choice: Navio de Jacó
  rationale: Reproduz de modo conciso o teor nominal da inscrição, sem inserir artigo definido ausente do grego.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve cadência narrativa em “E eis que”. A tradução prioriza o grego fornecido quando ele diverge da versão inglesa de consulta.
