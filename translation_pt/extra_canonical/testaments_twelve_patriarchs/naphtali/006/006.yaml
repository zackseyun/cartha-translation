base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/006.yaml
  text: But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together.
translation:
  language: pt
  text: Mas José partiu num pequeno barco, e nós ficamos separados sobre nove tábuas; Levi e Judá, porém, ficaram juntos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Levi e Judá, porém, estavam no mesmo lugar”.'
    reason: Registra de modo mais literal a expressão grega ἐπὶ τὸ αὐτό, cuja ideia contextual é que ambos estavam juntos.
lexical_decisions:
- source_word: ἀκάτιον
  choice: pequeno barco
  rationale: Expressa de modo natural o diminutivo grego, que indica uma embarcação pequena.
- source_word: ἐπορεύθη
  choice: partiu
  rationale: No contexto da dispersão sobre as águas, comunica com clareza que José seguiu caminho na pequena embarcação.
- source_word: διεχωρίσθημεν
  choice: fomos separados
  rationale: Preserva a forma passiva e a ideia de dispersão do grupo.
- source_word: ἐπὶ σανίδων ἐννέα
  choice: cada um em uma das nove tábuas
  rationale: Torna explícita em português a distribuição sugerida pelo contexto, sem tratar as nove tábuas como uma única plataforma.
- source_word: ἐπὶ τὸ αὐτό
  choice: ficaram juntos
  rationale: Equivalente idiomático da expressão grega que indica estarem no mesmo lugar ou reunidos.
theological_decisions:
- issue: Natureza da união de Levi e Judá
  choice: ficaram juntos
  alternative: estavam no mesmo lugar
  rationale: A expressão é espacial e narrativa; a tradução evita atribuir-lhe uma união teológica ou institucional não declarada no texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A conjunção adversativa foi variada entre “mas”, “enquanto” e “porém” para evitar repetição pesada sem perder os contrastes do grego.
