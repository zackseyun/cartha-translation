  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/007.yaml
  text: And we were scattered, all of us, to the ends of the earth[c].
translation:
  language: pt
  text: E todos nós fomos dispersos até os confins da terra[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: A dispersão “até os confins da terra” provavelmente tem força simbólica, embora o texto a apresente como parte do sonho de Naftali.
    reason: cross_reference
lexical_decisions:
- source_word: διεσπάρημεν
  choice: fomos dispersos
  rationale: Reproduz o aoristo passivo e a ideia de um grupo espalhado ou dispersado, sem explicitar um agente que o grego não nomeia.
- source_word: πάντες
  choice: todos nós
  rationale: Torna natural em português a totalidade dos que estão incluídos na primeira pessoa do plural.
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: até os confins da terra
  rationale: Expressão portuguesa digna e corrente que preserva a imagem espacial ampla do grego e sua possível força simbólica.
theological_decisions:
- issue: Caráter da dispersão no relato do sonho
  choice: Manter a afirmação imagética sem definir se ela é literal, profética ou simbólica.
  alternative: Traduzir ou explicar no texto principal como diáspora histórica.
  rationale: O grego apenas relata a dispersão até os confins da terra; a nota pode indicar a provável força simbólica sem eliminar a ambiguidade narrativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A ordem foi levemente ajustada para evitar a construção marcada “fomos dispersos, todos nós”, preservando integralmente o sentido.
