base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/004.yaml
  text: And when we had entered, a violent storm arose, and a whirlwind of wind; and our father withdrew from us, holding the rudders[b].
translation:
  language: pt
  text: Quando entramos, levantou-se uma tempestade violenta e um grande vendaval; e nosso pai afastou-se de nós, segurando os lemes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida como «os lemes» é textualmente difícil. A palavra subjacente normalmente significa «pescoços», mas o contexto parece ser náutico.
    reason: textual_variant
lexical_decisions:
- source_word: χειμὼν σφοδρός
  choice: tempestade violenta
  rationale: No contexto náutico, χειμών designa uma tempestade, e σφοδρός intensifica sua violência.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: um grande vendaval
  rationale: Expressa de modo natural a ideia de uma forte rajada ou tormenta de vento, sem a redundância pouco idiomática de «redemoinho de vento».
- source_word: ἀφίσταται
  choice: afastou-se
  rationale: Preserva o sentido de retirar-se ou separar-se do grupo sem sugerir necessariamente uma ação involuntária.
- source_word: τοὺς αὐχένας
  choice: os lemes
  rationale: Embora αὐχένες normalmente signifique «pescoços», o cenário é náutico e a tradição textual consultada entende a expressão como referência aos lemes; a dificuldade é explicitada em nota.
