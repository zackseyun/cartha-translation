lexical_decisions:
- source_word: χειμών
  choice: inverno
  rationale: Mantém o sentido lexical direto do grego e a imagem temporal do texto, sem substituí-lo interpretativamente por “tempestade”.
- source_word: σκάφος
  choice: embarcação
  rationale: Termo natural e suficientemente amplo para uma embarcação, sem especificar um tipo que o grego não define.
- source_word: ἔφθασε ἐπὶ τῆς γῆς
  choice: chegou à terra
  rationale: Expressa de modo idiomático em português a chegada da embarcação à terra, acompanhando de perto a construção grega.
- source_word: ὥσπερ ἐν εἰρήνῃ
  choice: como que em paz
  rationale: Preserva a comparação um tanto incomum e sua ambiguidade, sem explicá-la como segurança, calmaria ou ausência de conflito.
