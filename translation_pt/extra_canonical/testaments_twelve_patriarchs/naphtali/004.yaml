base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004.yaml
  text: These things I say to you[a], my children, because I learned from the writing of Enoch that you also will surely depart from the Lord, walking in every lawlessness of the nations and doing all the wickedness of Sodom. And the Lord will bring captivity upon you, and there you will serve your enemies and the land will be laid waste and your holy places will be desolate. And you will be scattered to the four corners of the earth, and you will be as something despised among the nations, a curse and a dispersion, until the Most High visits the earth. He himself will come, saving Israel and all the nations, God speaking in the person of man. And after he has entered, unrighteousness will again increase upon the earth, and all the nations will be gathered against him. But whoever believes in him shall not be condemned in his name. And you, my children, shall rise up from your tribes with Levi and Judah; and there shall be war among you. And the Lord will be seen among men, and he will save
    Israel and all the nations. Therefore do not be divided into two heads, because every division among brothers is evil in the sight of the Lord. For the Lord loves singleness of purpose. And if you also walk in singleness of purpose according to his law[b], my children, no evil spirit will have power over you. For he knows that the God of heaven is one, and he will not accept a divided mind. Love the Lord through all your life[c], and one another with a true heart.
translation:
  language: pt
  text: 4 Estas coisas lhes digo, meus filhos, porque soube, pelo escrito de Enoque[a], que também vocês se afastarão do Senhor, seguindo toda a iniquidade das nações e praticando toda a perversidade de Sodoma. 2 Então o Senhor trará sobre vocês o cativeiro; ali[b], vocês servirão aos seus inimigos e estarão sujeitos a toda espécie de maus-tratos e aflições, até que o Senhor destrua todos vocês[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O escrito de Enoque” pode designar uma obra ou tradição escrita associada a Enoque; a expressão, por si só, não define seu estatuto canônico nem assegura a identificação com um livro específico hoje conhecido.
    reason: cultural_note
  - marker: b
    text: A palavra traduzida por “ali” aparece entre sinais de incerteza editorial no texto grego consultado.
    reason: textual_variant
  - marker: c
    text: A forma verbal traduzida por “estarão sujeitos” é assinalada como problemática na edição grega. Ela pode ser entendida no sentido de viver ou conviver em meio a maus-tratos e aflições. A ameaça final, porém, diz literalmente que o Senhor consumirá ou destruirá “todos vocês”.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: soube
  rationale: No contexto de ἐν τῇ γραφῇ Ἐνώχ, indica conhecimento obtido de uma fonte escrita. “Soube, pelo escrito” é natural em português e não acrescenta a ideia específica de leitura direta.
- source_word: γραφή
  choice: escrito
  rationale: Identifica uma obra ou tradição escrita ligada a Enoque sem afirmar, por meio de “Escritura”, seu estatuto canônico.
- source_word: ἀποστήσεσθε
  choice: se afastarão
  rationale: Expressa abandono do Senhor em linguagem clara, preservando a dimensão de ruptura religiosa sem recorrer ao termo técnico “apostatarão”.
- source_word: ἀνομία
  choice: transgressão
  rationale: Comunica violação da ordem ou lei divina em português corrente. “Ilegalidade” seria excessivamente jurídico, e “iniquidade” menos acessível.
- source_word: πονηρία
  choice: perversidade
  rationale: Mantém o peso moral da associação com Sodoma e distingue o termo da transgressão mencionada anteriormente.
- source_word: αἰχμαλωσία
  choice: cativeiro
  rationale: Preserva o sentido de derrota, deportação e sujeição aos inimigos, próprio do contexto de juízo nacional.
- source_word: κακώσει
  choice: maus-tratos
  rationale: O substantivo denota aflição ou tratamento cruel. “Maus-tratos” torna concreto o sofrimento imposto no cativeiro.
- source_word: συναναστραφήσεσθε
  choice: viverão em meio a
  rationale: A forma, assinalada como textualmente problemática na edição, sugere conviver, estar envolvido ou passar a vida em determinadas condições. A tradução preserva essa imagem sem emendar o texto.
- source_word: ἀναλώσει
  choice: destrua
  rationale: O verbo pode significar consumir ou destruir. “Destrua” transmite com clareza a severidade da declaração, sem suavizá-la.
theological_decisions:
- issue: Autoridade do escrito de Enoque
  choice: “o escrito de Enoque”
  alternative: “a Escritura de Enoque” ou “o livro de Enoque”
  rationale: γραφή permite mais de uma nuance. A opção adotada reconhece a fonte profética alegada pelo texto, mas não decide por tradução seu estatuto canônico nem identifica com certeza uma obra específica.
- issue: Alcance da ameaça final
  choice: “até que o Senhor destrua todos vocês”
  alternative: “até que o Senhor os consuma por completo”
  rationale: A frase grega é abrangente e severa. Ela foi mantida sem harmonização ou atenuação teológica; “todos vocês” reproduz πάντας ὑμᾶς.
- issue: Relação entre juízo divino e sofrimento no cativeiro
  choice: O Senhor traz o cativeiro, seguido de servidão, maus-tratos e aflições.
  alternative: Reformular o sofrimento apenas como consequência política indireta.
  rationale: A construção grega atribui explicitamente ao Senhor a vinda do cativeiro. A tradução conserva essa tensão teológica em vez de enfraquecê-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. A tradução se limita ao grego fornecido para o capítulo 4, que contém apenas as duas primeiras unidades do texto apresentado; não incorpora o material adicional da camada inglesa sem correspondente no trecho-fonte. Mantém-se o tom testamentário e profético, bem como a dureza do anúncio de juízo.
