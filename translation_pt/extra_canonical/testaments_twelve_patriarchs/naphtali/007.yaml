base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007.yaml
  text: '1[a]. I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”


    2. Then my father said to me[b], “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”


    3. And weeping he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, the one who fathered you.”


    4. So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold[c], yet I was afraid of my brothers.'
translation:
  language: pt
  text: '1. Contei estes dois sonhos a meu pai, e ele me disse: “Estas coisas devem se cumprir nos tempos determinados[a], depois que Israel tiver suportado muito.”


    2. Então meu pai me disse: “Creio em Deus: José está vivo, pois sempre vejo que o Senhor o conta entre nós[b].”


    3. E, chorando, dizia: “Ai de mim, meu filho José! Você está vivo, e eu não o vejo; e você não vê Jacó, aquele que o gerou.”


    4. Assim, com essas palavras, ele também me fez chorar. Eu, porém, ardia por dentro[c] para contar que José tinha sido vendido, mas temia meus irmãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em suas épocas”. O grego καιροί pode indicar tempos próprios, oportunos ou determinados.'
    reason: lexical_alternative
  - marker: b
    text: A expressão também pode ser traduzida como “o inclui entre nós” ou “o considera conosco”. O grego mantém aberta a nuance exata.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “ardia nas minhas entranhas”, expressão grega visceral para intensa angústia interior.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνύπνια
  choice: sonhos
  rationale: É o sentido comum do termo e corresponde diretamente ao contexto, sem elevar desnecessariamente a experiência a “visões”.
- source_word: δεῖ ... πληρωθῆναι
  choice: devem se cumprir
  rationale: Preserva tanto a necessidade expressa por δεῖ quanto a linguagem de cumprimento de πληρωθῆναι.
- source_word: καιροὺς
  choice: tempos determinados
  rationale: Expressa tempos próprios ou assinalados, e não apenas uma sucessão cronológica neutra.
- source_word: πολλὰ ... ὑπομείναντος
  choice: depois que Israel tiver suportado muitas aflições
  rationale: O neutro plural πολλά é elíptico e indica muitas coisas adversas; “aflições” explicita naturalmente o sentido contextual sem especificar sofrimentos não mencionados.
- source_word: πιστεύω τῷ θεῷ
  choice: Creio em Deus que
  rationale: A construção com dativo comunica confiança em Deus quanto à afirmação seguinte; esta formulação portuguesa preserva a relação sem reduzi-la a mera crença na existência de Deus.
- source_word: ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: o conta como estando conosco
  rationale: Mantém a metáfora de contar ou computar e a forma incomum da expressão grega, sem decidir se significa presença, pertencimento familiar ou inclusão entre os vivos.
- source_word: Οἴμοι
  choice: Ai de mim
  rationale: Conserva o tom explícito de lamento em português corrente e digno.
- source_word: γεννήσαντά σε
  choice: aquele que o gerou
  rationale: Traduz de perto o particípio e deixa clara a paternidade de Jacó, preservando o registro solene.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις
  choice: ardia por dentro
  rationale: Reproduz de modo natural a imagem visceral de queimar nas entranhas, indicando intensa angústia interior.
- source_word: πέπραται
  choice: tinha sido vendido
  rationale: O perfeito passivo refere-se à venda já realizada de José; o mais-que-perfeito composto se ajusta à retrospectiva narrativa em português.
theological_decisions:
- issue: Necessidade profética na resposta de Jacó
  choice: Essas coisas devem se cumprir nos tempos determinados
  alternative: Essas coisas devem acontecer em suas épocas
  rationale: A tradução conserva a necessidade e o cumprimento profético sem definir de modo sistemático a natureza da providência envolvida.
- issue: Sentido de ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: o Senhor o conta como estando conosco
  alternative: o Senhor o inclui entre nós
  rationale: A expressão escolhida preserva a metáfora e a ambiguidade entre presença, pertencimento ao grupo familiar e condição de vivo.
- issue: Objeto da confiança em πιστεύω τῷ θεῷ
  choice: Creio em Deus que José está vivo
  alternative: 'Confio em Deus: José está vivo'
  rationale: A formulação liga a confiança em Deus à convicção de Jacó sobre José, sem transformar a frase em uma declaração abstrata sobre a existência divina.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso mantém dignidade testamentária sem arcaísmos excessivos. “Você” foi usado na fala familiar direta; “aquele que o gerou” conserva solenidade. As notas registram alternativas reais e a imagem idiomática sem sobrecarregar o texto principal.
