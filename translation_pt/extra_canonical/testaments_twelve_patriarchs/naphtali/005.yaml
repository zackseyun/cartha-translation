  text: '1[a]. For in the fortieth year of my life I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still.


    2. And behold, Isaac, the father of my father, said to us, “Run up and let each of you seize them according to his strength; and the one who takes hold of them, his shall be the sun and the moon.”


    3. And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.


    4. And while Levi was like the sun, behold, a certain young man was giving him twelve palm branches[b]; and Judah became bright like the moon, and beneath their feet were twelve rays.


    5. And the two, Levi and Judah, ran up and held them fast.


    6. And behold, there was a bull on the earth, having two great horns and eagle’s wings on its back; and though we wanted to seize it, we were not able.


    7. But Joseph came and took hold of it, and went up with it to the height.


    8. And I saw that I was there, and behold, a holy writing appeared to us, saying: “Assyrians, Medes, Persians,”'
translation:
  language: pt
  text: '**Testamento de Naftali 5**


    **1.** Pois, no quadragésimo ano de minha vida, tive uma visão no monte das Oliveiras, a leste de Jerusalém, na qual o sol e a lua estavam imóveis.


    **2.** E eis que Isaque, pai de meu pai, nos dizia: “Corram até eles, e cada um os agarre conforme a sua força; o sol e a lua serão daquele que os agarrar”.


    **3.** Então corremos todos juntos. Levi agarrou o sol, e Judá, chegando primeiro, agarrou a lua; e ambos foram elevados com eles.


    **4.** Enquanto Levi estava como o sol, eis que certo jovem lhe entregava doze ramos de palmeira; e Judá tornou-se brilhante como a lua, e debaixo dos pés deles havia doze raios.


    **5.** Os dois, Levi e Judá, correram até eles e os seguraram firmemente.[a]


    **6.** E eis que havia sobre a terra um touro com dois grandes chifres e asas de águia nas costas. Embora quiséssemos agarrá-lo, não conseguimos.


    **7.** José, porém, veio, apoderou-se dele e subiu com ele ao alto.


    **8.** Vi que eu estava ali, e eis que nos apareceu um escrito sagrado, que dizia: “Assírios, medos, persas, caldeus e sírios herdarão como cativeiro os doze cetros de Israel”.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase é sintaticamente difícil no grego transmitido e aparece entre colchetes na edição. Parece retomar, talvez secundariamente, a ação de Levi e Judá nos versículos anteriores.
    reason: textual_variant
  - marker: b
    text: 'O grego tem uma construção incomum, literalmente próxima de: “herdarão cativeiro, os doze cetros de Israel”. A tradução conserva a formulação difícil; o sentido exato da relação entre “cativeiro” e os “doze cetros” permanece incerto.'
    reason: translation_difficulty
lexical_decisions:
- source_word: ὄραμα
  choice: visão
  rationale: É o termo português corrente para uma experiência revelatória e se ajusta ao contexto visionário.
- source_word: ἕστηκαν
  choice: estavam imóveis
  rationale: O perfeito indica uma condição fixa; a formulação comunica que os astros permaneciam parados, não apenas que estavam em pé.
- source_word: Προσδραμόντες
  choice: Corram até eles
  rationale: Preserva o movimento rápido em direção aos astros e a força da ordem.
- source_word: κρατήσατε / ἐκράτησε
  choice: agarre / agarrou
  rationale: Mantém a imagem concreta e vigorosa de segurar os astros, com linguagem natural em português.
- source_word: κατὰ δύναμιν
  choice: conforme a sua força
  rationale: 'Preserva a distribuição individual: cada irmão deveria agir segundo a própria capacidade.'
- source_word: φθάσας
  choice: chegando primeiro
  rationale: Expressa a precedência de Judá sem acrescentar uma interpretação à sequência visionária.
- source_word: ὑψώθησαν
  choice: foram elevados
  rationale: Conserva em primeiro plano o movimento espacial, deixando abertas possíveis conotações simbólicas.
- source_word: βαΐα φοινίκων
  choice: ramos de palmeira
  rationale: Equivalente concreto, claro e tradicional, sem impor simbolismo ao objeto.
- source_word: ἀκτῖνες
  choice: raios
  rationale: É o equivalente natural no contexto da simbologia solar e lunar.
- source_word: κατέλαβεν
  choice: apoderou-se dele
  rationale: Comunica que José conseguiu dominar e tomar posse do touro, sem exigir a violência sugerida por alternativas como 'capturou'.
- source_word: γραφὴ ἁγία
  choice: um escrito sagrado
  rationale: Preserva a construção indefinida e visionária; 'Escritura' sugeriria mais diretamente um texto canônico estabelecido.
- source_word: τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ
  choice: os doze cetros de Israel
  rationale: Mantém a metáfora política e tribal do grego, sem substituí-la interpretativamente por 'tribos'.
theological_decisions:
- issue: Sentido simbólico de Levi, Judá e José
  choice: Traduzir diretamente as imagens, sem identificar no texto Levi com supremacia sacerdotal, Judá com supremacia régia ou José com uma entidade histórica específica.
  alternative: Explicitar no texto uma interpretação sacerdotal, régia, messiânica ou histórico-política.
  rationale: A passagem apresenta símbolos sem oferecer aqui sua interpretação. Preservar as imagens evita introduzir uma doutrina denominacional ou uma leitura posterior.
- issue: Status de γραφὴ ἁγία
  choice: um escrito sagrado
  alternative: a Escritura
  rationale: O grego é indefinido e descreve algo que aparece dentro da visão; a tradução escolhida não presume um conceito canônico mais específico.
- issue: Destino dos doze cetros em 5:8
  choice: receberão como cativos os doze cetros de Israel
  alternative: herdarão o cativeiro dos doze cetros de Israel
  rationale: A sintaxe transmitida é difícil. A opção adotada expressa a conquista e o cativeiro sem eliminar a metáfora dos cetros; a nota registra a literalidade e a incerteza.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o tom visionário, a repetição de “e eis que” quando retoricamente relevante e as metáforas de sol, lua, raios, touro e cetros. A tradução segue todo o texto grego fornecido, inclusive “caldeus e sírios” e a conclusão do versículo 8, que não aparecem na camada inglesa truncada.
