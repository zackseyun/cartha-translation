base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/001.yaml
  text: These things I say to you, my children, because I have learned in the writing of Enoch that you too will depart from the Lord, walking in all the lawlessness of the nations and doing all the wickedness of Sodom.
translation:
  language: pt
  text: Digo-lhes estas coisas, meus filhos, porque aprendi no escrito de Enoque que vocês também se afastarão do Senhor, andando segundo toda a iniquidade das nações e praticando toda a perversidade de Sodoma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ γραφῇ Ἐνώχ
  choice: pelo escrito de Enoque
  rationale: Expressa de modo natural que a informação foi obtida no escrito atribuído a Enoque, sem tratar γραφή necessariamente como Escritura canônica.
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: vocês também se afastarão do Senhor
  rationale: Preserva o sentido de abandono ou afastamento, sem acrescentar intensidade ausente no grego.
- source_word: πορευόμενοι κατὰ πᾶσαν ἀνομίαν ἐθνῶν
  choice: andando segundo toda a transgressão das nações
  rationale: Mantém a metáfora de conduta de πορεύομαι e traduz ἀνομία por um termo corrente que comunica violação da lei, evitando o menos natural 'ilegalidade'.
- source_word: ποιήσετε πᾶσαν πονηρίαν Σοδόμων
  choice: praticando toda a perversidade de Sodoma
  rationale: Em português, 'praticar perversidade' comunica naturalmente conduta moralmente má; 'Sodoma' foi mantido no singular conforme o referente tradicional e o texto de consulta.
theological_decisions:
- issue: Estatuto do escrito de Enoque
  choice: escrito de Enoque
  alternative: Escritura de Enoque
  rationale: A tradução não atribui implicitamente estatuto canônico ao documento; γραφή aqui pode designar simplesmente um escrito.
- issue: Natureza da futura apostasia
  choice: se afastarão do Senhor
  alternative: apostatarão do Senhor
  rationale: A formulação conserva o teor de ἀφίστημι em linguagem acessível e não restringe o sentido a uma categoria teológica técnica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de leitura natural no Brasil. A construção paralela do grego foi preservada por meio de 'andando... e praticando...'.
