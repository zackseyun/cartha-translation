revisions:
- from: Digo-lhes estas coisas, meus filhos, porque soube pelo escrito de Enoque que vocês também se afastarão do Senhor, andando segundo toda a transgressão das nações e praticando toda a perversidade de Sodoma.
  to: Digo-lhes estas coisas, meus filhos, porque aprendi no escrito de Enoque que vocês também se afastarão do Senhor, andando segundo toda a iniquidade das nações e praticando toda a perversidade de Sodoma.
  rationale: A revisão aproxima «no escrito de Enoque» da construção ἐν τῇ γραφῇ Ἐνώχ e usa «iniquidade» para ἀνομία, preservando a abrangência moral da advertência. Não são necessárias notas, pois não há marcador nem ambiguidade textual que exija explicação nesta tradução.
