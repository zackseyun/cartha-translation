review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a advertência, o afastamento do Senhor e os dois particípios de conduta. Contudo, «soube pelo escrito» muda levemente a relação expressa por ἐν τῇ γραφῇ (“no escrito”); «aprendi no escrito» a preserva melhor. «Iniquidade» representa ἀνομία com mais precisão no registro moral-religioso do contexto do que «transgressão».
  naturalness: O texto é claro e tem registro apropriado. A coordenação «andando ... e praticando» reproduz bem a estrutura participial. A revisão proposta mantém leitura fluente em português brasileiro e internacional.
  terminology: «Senhor», «escrito de Enoque», «afastar-se» e «perversidade de Sodoma» são escolhas adequadas e não impõem interpretação confessional. «Iniquidade» é preferível para ἀνομία neste paralelo com a maldade de Sodoma.
  issues:
  - severity: low
    issue: Relação com o escrito de Enoque
    rationale: ἐν τῇ γραφῇ indica que o conhecimento foi obtido “no” escrito; «pelo escrito» é possível em português, mas explicita uma mediação que não corresponde tão estreitamente à preposição grega.
  - severity: low
    issue: Tradução de ἀνομία
    rationale: «Transgressão» pode designar um ato específico; ἀνομία, modificada por πᾶσαν, descreve mais naturalmente a iniquidade/conduta sem lei abrangente das nações.
  revised_text: Digo-lhes estas coisas, meus filhos, porque aprendi no escrito de Enoque que vocês também se afastarão do Senhor, andando segundo toda a iniquidade das nações e praticando toda a perversidade de Sodoma.
