source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἐπάξει Κύριος ὑμῖν αἰχμαλωσίαν, καὶ δουλεύσετε ⌈ἐκεῖ⌉¹³ *τοῖς ἐχθροῖς¹⁴ ὑμῶν, καὶ πάσῃ κακώσει¹⁵ καὶ θλίψει †συναναστραφήσεσθε¹⁶, ἕως ἀναλώσει¹⁷ Κύριος πάντας ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/002.yaml
  text: And the Lord will bring captivity upon you, and there you will serve your enemies, and you will be afflicted with every kind of evil and tribulation, until the Lord has consumed you all.
translation:
  language: pt
  text: E o Senhor trará sobre vocês o cativeiro; ali vocês servirão aos seus inimigos e conviverão com toda espécie de sofrimento e tribulação, até que o Senhor acabe com todos vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωσίαν
  choice: o cativeiro
  rationale: Preserva o sentido de captura e condição coletiva de sujeição, em linguagem bíblica ainda clara no português moderno.
- source_word: δουλεύσετε
  choice: servirão
  rationale: Expressa o serviço imposto aos inimigos sem ampliar o texto para uma formulação interpretativa como “serão escravizados”.
- source_word: πάσῃ κακώσει
  choice: toda espécie de sofrimento
  rationale: κακώσις indica maus-tratos, aflição ou sofrimento; a formulação natural comunica a abrangência de πάσῃ sem reduzir o termo à ideia moral de “mal”.
- source_word: συναναστραφήσεσθε
  choice: conviverão com
  rationale: Embora a forma esteja textualmente assinalada e possa significar associar-se ou viver em meio a algo, “conviverão com” preserva sua imagem relacional, em vez de substituí-la simplesmente por “serão afligidos”.
- source_word: ἀναλώσει
  choice: acabe com
  rationale: Reproduz com clareza a força de consumir, destruir ou eliminar, preservando o tom severo do anúncio.
theological_decisions:
- issue: Alcance da destruição anunciada em ἕως ἀναλώσει Κύριος πάντας ὑμᾶς
  choice: até que o Senhor acabe com todos vocês
  alternative: até que o Senhor tenha consumido todos vocês
  rationale: A tradução mantém o agente divino, a totalidade expressa por πάντας e a severidade de ἀναλίσκω, sem suavizar o juízo nem especificar além do grego como ele ocorrerá.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa plural em “vocês”. O ponto e vírgula organiza naturalmente a longa coordenação grega. Não foram criadas notas, pois as marcas críticas e números da edição não constituem, por si sós, notas destinadas ao leitor nesta unidade.
