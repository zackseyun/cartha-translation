base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003.yaml
  text: '1. So then, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls. For if, in purity of heart, you keep silence, you will understand how to hold fast the will of God and to cast away the will of Beliar.


    2. The sun and the moon and the stars do not alter their appointed order; so you also must not alter the law of God through the disorder of your deeds.


    3. The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.


    4. But you, my children, must not be so. Rather, know in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.


    5. In the same way also the Watchers changed the order of their nature, and the Lord cursed them at the time of the flood; because of them he made the earth desolate and without fruit.'
translation:
  language: pt
  text: '1. Portanto, não se empenhem, movidos pela ganância, em corromper suas ações, nem enganem suas próprias almas com palavras vazias. Pois, permanecendo em silêncio na pureza de coração, compreenderão como se apegar à vontade de Deus e rejeitar a vontade de Belial.


    2. O sol, a lua e as estrelas não alteram a ordem que lhes foi estabelecida; assim também vocês não devem alterar a lei de Deus pela desordem de suas ações.


    3. As nações, tendo-se desviado e abandonado o Senhor, alteraram sua ordem e deram ouvidos à madeira e à pedra, a espíritos de engano.


    4. Vocês, porém, meus filhos, não sejam assim. Reconheçam, no firmamento, na terra, no mar e em todas as coisas criadas, o Senhor que fez todas as coisas, para que não venham a tornar-se como Sodoma, que mudou a ordem de sua natureza.


    5. Do mesmo modo, também os Vigilantes[a] mudaram a ordem de sua natureza, e o Senhor os amaldiçoou por ocasião do dilúvio; por causa deles, tornou a terra desolada e estéril.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os «Vigilantes» são seres celestiais conhecidos na antiga tradição judaica, especialmente nos relatos associados aos acontecimentos anteriores ao dilúvio.
    reason: O título pode não ser familiar ao leitor moderno e não designa vigilantes humanos comuns.
  - marker: b
    text: O texto grego no fim do versículo é difícil e apresenta sinais de corrupção textual; a tradução segue o sentido provável de que o Senhor tornou a terra desolada e estéril por causa deles.
    reason: Sinaliza honestamente a incerteza textual de ἀπὸ κατοικησίας ... [ἀοίκητον] sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: ganância
  rationale: Expressa de modo natural o desejo egoísta de obter mais, preservando a força moral do termo grego.
- source_word: σιωπῶντες
  choice: permanecerem em silêncio
  rationale: Mantém a ação circunstancial do particípio e, com «se», preserva a leitura condicional refletida pela tradição textual consultada.
- source_word: κρατεῖν
  choice: se apegar
  rationale: Comunica a ideia de sustentar firmemente ou manter-se ligado à vontade de Deus em português corrente.
- source_word: Βελίαρ
  choice: Belial
  rationale: Emprega a forma tradicional e reconhecível em português para o nome Βελίαρ.
- source_word: τάξιν
  choice: ordem
  rationale: Preserva o tema recorrente da ordem estabelecida nos vv. 2–5 sem explicitar além do grego.
- source_word: στερεώματι
  choice: firmamento
  rationale: Conserva o termo cosmológico tradicional e a distinção entre céu, terra e mar.
- source_word: Ἐγρήγοροι
  choice: Vigilantes
  rationale: Traduz o título tradicional dos seres que vigiam, em vez de apenas transliterá-lo.
- source_word: ἄκαρπον
  choice: estéril
  rationale: Transmite literalmente a ausência de fruto e soa natural como descrição da terra.
theological_decisions:
- issue: Relação entre silêncio, pureza de coração e compreensão da vontade de Deus
  choice: «se permanecerem em silêncio com pureza de coração, compreenderão»
  alternative: «permanecendo em silêncio com pureza de coração, compreenderão»
  rationale: A construção grega é participial e pode ser circunstancial; a formulação condicional preserva uma possibilidade legítima sem transformar o silêncio em doutrina autônoma.
- issue: Identidade de Belial
  choice: Manter «Belial» como nome próprio
  alternative: Traduzir como «Maligno» ou «perversidade»
  rationale: O grego apresenta Βελίαρ como vontade contraposta à de Deus; manter o nome evita resolver se a referência é pessoal ou personificada.
- issue: «ordem de sua natureza» em Sodoma e nos Vigilantes
  choice: Preservar literalmente a expressão
  alternative: Explicar como uma transgressão sexual específica
  rationale: O texto não explicita aqui a natureza exata da alteração; a tradução conserva a tensão e evita importar uma interpretação denominacional.
- issue: Causalidade da devastação da terra no v. 5
  choice: «por causa deles, tornou a terra...»
  alternative: «por meio deles, tornou a terra...»
  rationale: διʼ οὓς indica naturalmente causa; o sujeito implícito continua sendo o Senhor, sem acrescentar detalhes não presentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pronomes de segunda pessoa no padrão brasileiro («vocês») e vocabulário bíblico reconhecível. A repetição de «ordem» e «todas as coisas» foi mantida por sua função temática. Evitaram-se explicações interpretativas no corpo do texto.
