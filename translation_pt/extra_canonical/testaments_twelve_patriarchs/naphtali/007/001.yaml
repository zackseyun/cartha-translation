  text: VII. Ταῦτα¹ τὰ δύο ἐνύπνια εἶπον² τῷ πατρί μου³ καὶ⁴ εἶπέ μοι· Δεῖ *ταῦτα πληρωθῆναι⁵ κατὰ *τοὺς καιροὺς⁶ αὐτῶν, *πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/001.yaml
  text: I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”
translation:
  language: pt
  text: 'Contei esses dois sonhos a meu pai, e ele me disse: “É necessário que essas coisas se cumpram em seus tempos determinados, depois que Israel tiver suportado muitas coisas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνύπνια
  choice: sonhos
  rationale: Equivalente natural e claro em português para sonhos vistos durante o sono.
- source_word: Δεῖ
  choice: É necessário
  rationale: Preserva a ideia de necessidade expressa pela construção grega, sem especificar indevidamente sua causa.
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  choice: nos tempos determinados para elas
  rationale: Mantém a relação dos tempos com “essas coisas” e comunica que cada acontecimento tem seu tempo próprio ou apropriado.
- source_word: πολλὰ ... ὑπομείναντος
  choice: depois que Israel tiver suportado muitas coisas
  rationale: Reproduz a construção temporal circunstancial e conserva a formulação ampla do neutro plural πολλά, sem restringi-la explicitamente a sofrimentos.
theological_decisions:
- issue: Natureza da necessidade em Δεῖ
  choice: É necessário que essas coisas se cumpram
  alternative: Essas coisas devem se cumprir
  rationale: A formulação escolhida preserva a necessidade do cumprimento sem declarar se ela decorre de decreto divino, profecia ou inevitabilidade histórica.
- issue: Relação temporal do genitivo absoluto πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος
  choice: depois que Israel tiver suportado muitas coisas
  alternative: enquanto Israel suporta muitas coisas
  rationale: O particípio aoristo favorece uma ação anterior ao cumprimento, embora a construção admita alguma elasticidade contextual; a tradução evita acrescentar detalhes sobre a natureza das provações.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. A ordem e a tensão temporal do grego foram preservadas sem tornar a frase excessivamente literal.
