base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/004.yaml
  text: So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold, yet I was afraid of my brothers.
translation:
  language: pt
  text: Então, com essas palavras, ele também me fez chorar. Eu, porém, ardia por dentro de vontade de lhe contar que José tinha sido vendido, mas tinha medo dos meus irmãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς λόγοις τούτοις
  choice: com essas palavras
  rationale: Expressa naturalmente em português o meio pelo qual ele o fez chorar.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις μου
  choice: ardia por dentro
  rationale: Preserva a metáfora de intensa agitação interior sem recorrer ao pouco natural 'nas minhas entranhas'.
- source_word: ἀναγγεῖλαι
  choice: de vontade de lhe contar
  rationale: No contexto, comunica o impulso intenso de revelar a informação ao interlocutor; o pronome 'lhe' explicita o destinatário já indicado pelo contexto imediato.
- source_word: πέπραται Ἰωσήφ
  choice: José tinha sido vendido
  rationale: Reproduz o perfeito passivo grego com uma forma anterior ao momento narrado e natural em português.
- source_word: ἐφοβούμην τοὺς ἀδελφούς μου
  choice: tinha medo dos meus irmãos
  rationale: Equivalente direto e corrente para o temor dirigido aos irmãos.
