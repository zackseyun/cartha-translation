  text: 4. *Ἐποίησε οὖν καὶ ἐμὲ δακρῦσαι¹⁹ ἐν²⁰ τοῖς λόγοις τούτοις²¹. *Ἐγὼ δὲ²² *ἐκαιόμην τοῖς σπλάγχνοις²³ μου²⁴ ἀναγγεῖλαι²⁵ ὅτι πέπραται²⁶ ⌜Ἰωσήφ⌝²⁷· *ἀλλʼ ἐφοβούμην²⁸ τοὺς ἀδελφούς μου²⁹.
