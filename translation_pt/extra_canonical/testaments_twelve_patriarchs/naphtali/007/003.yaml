base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/003.yaml
  text: And weeping, he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, who fathered you.”
translation:
  language: pt
  text: 'E, chorando, ele dizia: “Ai de mim, meu filho José! Você está vivo, e eu não o vejo; e você não vê Jacó, que o gerou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλαίων
  choice: chorando
  rationale: Reproduz diretamente o particípio circunstancial grego e preserva a carga emotiva da cena.
- source_word: ἔλεγε
  choice: dizia
  rationale: O imperfeito grego favorece uma ação em curso; “dizia” conserva esse aspecto melhor que o pontual “disse”.
- source_word: Οἴμοι
  choice: Ai de mim
  rationale: Expressa de modo natural e digno o lamento pessoal enfático do grego.
- source_word: τέκνον μου
  choice: meu filho
  rationale: Embora τέκνον possa significar literalmente “criança”, no apelo de um pai a José adulto “meu filho” é a forma portuguesa natural.
- source_word: ζῇς
  choice: Você está vivo
  rationale: Mantém a afirmação direta do presente grego, com linguagem corrente e clara.
- source_word: τὸν γεννήσαντά σε
  choice: que o gerou
  rationale: Preserva o sentido biológico e parental de γεννάω e a referência explícita a Jacó, sem acrescentar interpretação.
theological_decisions:
- issue: Descrição de Jacó como aquele que gerou José
  choice: que o gerou
  alternative: seu pai
  rationale: A tradução mantém a formulação concreta do grego, em vez de substituí-la por uma relação familiar mais genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para legibilidade brasileira. A repetição coordenada de “e” foi preservada por refletir a estrutura emotiva do original.
