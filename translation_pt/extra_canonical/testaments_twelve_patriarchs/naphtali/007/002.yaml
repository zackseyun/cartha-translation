  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/002.yaml
  text: Then my father said to me, “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”
translation:
  language: pt
  text: 'Então meu pai me disse: “Creio em Deus que José está vivo, pois vejo sempre que o Senhor o conta entre nós.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιστεύω τῷ θεῷ
  choice: Creio em Deus
  rationale: Preserva a construção grega com dativo e seu sentido de confiar ou dar crédito a Deus, sem acrescentar uma formulação explicativa ausente do texto.
- source_word: ζῇ Ἰωσήφ
  choice: José está vivo
  rationale: Expressa de modo natural em português o presente grego ζῇ.
- source_word: ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: o conta entre nós
  rationale: Mantém a imagem de enumerar ou incluir José no grupo, com formulação clara e próxima do grego.
theological_decisions:
- issue: Sentido da visão contínua do pai
  choice: vejo sempre que o Senhor o conta entre nós
  alternative: sempre percebo que o Senhor o considera como estando conosco
  rationale: A opção escolhida conserva a linguagem visual de ὁρῶ e a metáfora de ἀριθμεῖ, sem explicar se se trata de visão, percepção ou convicção espiritual.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. A formulação preserva a tensão entre a crença em que José vive e a afirmação de que o Senhor o inclui entre os presentes.
