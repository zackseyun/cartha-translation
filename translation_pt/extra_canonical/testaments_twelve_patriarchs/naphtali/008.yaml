  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008.yaml
  text: '1[a]. And behold, my children, I have shown you the times, that all these things will happen in Israel.

    2. And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.

    3. Through his scepter God will appear on the earth, dwelling among men[b], to save the race of Israel, and he will gather the righteous from among the nations.

    4. Therefore, if you also do what is good, men and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.

    5. As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.

    6. But the one who does not do what is good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.

    7. For the commandments of the law are twofold, and they are fulfilled with skill.

    8. For there is a time for a man''s coming together with a woman, and a time for restraint for his prayer.

    9. And both are from God, and if they do not take place in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.

    10. Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter[d][c], so that the Lord may love you.'
translation:
  language: pt
  text: '**Testamento de Naftali 8**


    **1.** E eis, meus filhos: eu lhes mostrei os tempos finais; tudo isso acontecerá em Israel.


    **2.** Portanto, vocês também ordenem a seus filhos que se unam a Levi e a Judá. Pois, por meio de Judá, a salvação surgirá para Israel, e nele Jacó será abençoado.[a]


    **3.** Por meio do cetro dele, Deus aparecerá na terra, habitando entre os seres humanos,[b] para salvar a descendência de Israel; e reunirá os justos dentre as nações.


    **4.** Portanto, se vocês também fizerem o que é bom, os seres humanos e os anjos os abençoarão; Deus será glorificado entre as nações por meio de vocês; o diabo fugirá de vocês; as feras terão medo de vocês; o Senhor os amará; e os anjos estarão ao lado de vocês.


    **5.** Assim como quem cria bem um filho guarda uma boa lembrança dele, também uma boa obra deixa uma boa lembrança diante de Deus.


    **6.** Mas aquele que não faz o que é bom será amaldiçoado pelos anjos e pelos seres humanos; Deus será desonrado entre as nações por causa dele; o diabo o tomará para si como vaso que lhe pertence; toda fera o dominará; e o Senhor o odiará.


    **7.** Pois os mandamentos da Lei têm dois aspectos e são cumpridos com discernimento.


    **8.** Há tempo para a união com uma mulher[c] e tempo para a abstinência,[d] para a oração.


    **9.** Ambas as coisas procedem de Deus; mas, se não acontecerem na ordem que lhes é própria, trazem pecado gravíssimo aos seres humanos. O mesmo se aplica aos demais mandamentos.


    **10.** Portanto, meus filhos, tornem-se sábios em Deus e sejam prudentes, reconhecendo a ordem dos seus mandamentos e as normas de cada situação, para que o Senhor os ame.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As expressões “por meio de Judá” e “por meio do cetro dele” apresentam imagens régias e salvíficas. A passagem admite uma leitura messiânica, mas o grego não restringe por si só sua aplicação a uma identificação doutrinária específica.
    reason: cross_reference
  - marker: b
    text: A expressão “habitando entre os seres humanos” aparece entre colchetes na edição grega, indicando incerteza ou variação textual. A tradução conserva a redação mais ampla do testemunho fornecido. A construção grega também pode ser entendida mais literalmente como “habitando nos seres humanos”.
    reason: textual_variant
  - marker: c
    text: “União com uma mulher” é uma forma decorosa de traduzir a referência grega à relação sexual.
    reason: cultural_note
  - marker: d
    text: Ou “autocontrole”. Neste contexto, o sentido é abster-se da união sexual no tempo apropriado para a oração.
    reason: lexical_alternative
lexical_decisions:
- source_word: καιροὺς ἐσχάτους
  choice: os tempos finais
  rationale: Traduz tanto καιρούς, no sentido de períodos significativos ou determinados, quanto ἐσχάτους, que explicita seu caráter final ou derradeiro.
- source_word: ἑνοῦνται
  choice: se unam
  rationale: Expressa de modo natural a exortação à união ou solidariedade com Levi e Judá, sem especificar uma forma institucional não indicada pelo grego.
- source_word: σωτηρία
  choice: salvação
  rationale: Preserva o peso teológico do termo e também permite seu sentido mais amplo de livramento.
- source_word: σκήπτρου
  choice: cetro
  rationale: Mantém explícita a imagem régia e dinástica do substantivo concreto grego.
- source_word: ὀφθήσεται
  choice: aparecerá
  rationale: Comunica a manifestação visível de Deus sem acrescentar formulação doutrinária posterior.
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: habitando entre os seres humanos
  rationale: Representa naturalmente a presença de Deus no meio da humanidade; o possível sentido literal de 'em seres humanos' permanece registrado pela nota textual.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: a descendência de Israel
  rationale: Neste contexto, γένος designa o povo ou linhagem proveniente de Israel; 'descendência' evita a conotação moderna problemática de 'raça'.
- source_word: τὸ καλόν
  choice: o que é bom
  rationale: Formulação idiomática que conserva o sentido moral da construção grega com artigo e adjetivo.
- source_word: ἀνθέξονται ὑμῶν
  choice: estarão ao lado de vocês
  rationale: O verbo pode indicar apegar-se, sustentar ou apoiar; a expressão escolhida preserva o sentido de apoio protetor sem o tornar excessivamente específico.
- source_word: οἰκειοῦται αὐτὸν ὡς ἴδιον σκεῦος
  choice: se apoderará dele como de um instrumento que lhe pertence
  rationale: Conserva a ideia de o diabo reivindicar a pessoa como sua propriedade e seu instrumento; 'instrumento' comunica aqui o valor figurado de σκεῦος.
- source_word: διπλαῖ
  choice: têm dois aspectos
  rationale: No contexto do exemplo seguinte, o termo indica uma estrutura dupla ou dois lados complementares, não dois conjuntos separados de mandamentos.
- source_word: μετὰ τέχνης
  choice: com discernimento
  rationale: τέχνη denota habilidade ou entendimento prático; 'discernimento' comunica que os mandamentos exigem aplicação adequada à ordem e ao momento.
- source_word: συνουσίας γυναικός
  choice: união com uma mulher
  rationale: Tradução digna e decorosa da referência concreta à relação sexual, sem generalizá-la nem torná-la gráfica.
- source_word: ἐγκρατείας
  choice: abstinência
  rationale: No contraste com a união sexual e em vista da oração, refere-se a abster-se no tempo apropriado; a palavra mantém a especificidade contextual.
- source_word: τάξιν
  choice: ordem
  rationale: Preserva o tema central da disposição, sequência ou ocasião apropriada das ações.
- source_word: θεσμοὺς παντὸς πράγματος
  choice: as normas próprias de cada situação
  rationale: Expressa em português natural os preceitos ou disposições que regem cada assunto, sem transformar a frase em legislação técnica.
theological_decisions:
- issue: A linguagem régia e salvífica ligada a Judá nos versículos 2–3
  choice: Traduzir diretamente a salvação que surge por meio de Judá, seu cetro, a aparição de Deus na terra e a reunião dos justos dentre as nações.
  alternative: Reduzir a passagem a uma esperança exclusivamente político-dinástica ou explicitar no texto uma identificação messiânica específica.
  rationale: O texto grego contém forte linguagem régia e salvífica, mas não identifica explicitamente uma figura posterior. A tradução conserva a força e a abertura teológica do texto.
- issue: A expressão κατοικῶν ἐν ἀνθρώποις no versículo 3
  choice: Manter no texto principal 'habitando entre os seres humanos' e assinalar a complexidade textual em nota.
  alternative: Omitir a expressão como expansão secundária ou traduzi-la obrigatoriamente como 'habitando nos seres humanos'.
  rationale: A expressão está presente no testemunho grego fornecido, embora entre colchetes editoriais. Seu sentido contextual mais natural é presença entre a humanidade, mas a nota reconhece tanto a variação textual quanto a possibilidade formal de outra leitura.
- issue: A ética da união conjugal e da oração nos versículos 7–9
  choice: Apresentar tanto a união sexual quanto a abstinência para a oração como realidades procedentes de Deus e sujeitas à ordem apropriada.
  alternative: Tratar a união sexual como intrinsecamente inferior ou reduzir a passagem a uma declaração genérica sobre moderação.
  rationale: O grego afirma que ambas as coisas são de Deus e localiza o pecado em sua desordem. A tradução preserva essa tensão sem introduzir ascetismo absoluto nem uma doutrina ritual não expressa.
- issue: O amor e o ódio do Senhor nos versículos 4, 6 e 10
  choice: Conservar os verbos fortes 'amar' e 'odiar' conforme o texto.
  alternative: Abrandar 'odiar' para 'desaprovar' ou explicar o amor divino segundo um sistema doutrinário particular.
  rationale: A linguagem parenética do original é deliberadamente contrastante. Atenuá-la resolveria uma tensão que deve permanecer visível ao leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” para o plural de segunda pessoa, mantendo consistência nas formas oblíquas. Termos tradicionais de peso teológico, como “salvação”, “Lei”, “cetro”, “diabo” e “Senhor”, foram preservados; construções excessivamente literais foram ajustadas apenas quando prejudicariam a clareza. A numeração segue os dez versículos da fonte.
