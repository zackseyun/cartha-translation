base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001.yaml
  text: 'A copy of the testament of Naphtali, the eighth son of Jacob, which he set in order at the time of his departure, in the hundred and thirtieth year of his life.


    2 When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them. 3 And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him. 4 And while blessing and glorifying the Lord, he grew strong and said, “After the feast yesterday, my flesh failed and died.”


    5 Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father. 6 I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me upon Rachel’s knees, and for this reason she called my name Naphtali. 7 For Rachel loved me greatly, because I was born upon her knees; and when I was still a tender child she kissed me, saying, ‘May I be given a brother from my own womb, like you.’ 8 Therefore Joseph also was like me in every way, according to the prayers of Rachel.”'
translation:
  language: pt
  text: '**Testamento de Naftali, oitavo filho de Jacó e Bila**


    **1** Cópia do testamento de Naftali, que ele dispôs por ocasião de sua partida, aos cento e trinta anos de vida.


    **2** Quando seus filhos se reuniram, no primeiro dia do sétimo mês, ele lhes ofereceu um banquete. **3** Pela manhã, depois de despertar, disse-lhes: “Estou morrendo”; mas eles não acreditaram nele. **4** Então, enquanto glorificava o Senhor, ele recobrou as forças e disse: “Depois do banquete de ontem, minha carne morreu”.


    **5** E começou a falar: “Escutem, meus filhos, filhos de Naftali; escutem as palavras de seu pai. **6** Eu nasci de Bila, porque Raquel agiu com astúcia e deu Bila a Jacó em seu lugar. Bila concebeu e me deu à luz sobre os joelhos de Raquel; por isso, Raquel me deu o nome de Naftali. **7** Raquel me amava muito, porque nasci sobre os joelhos dela. Quando eu ainda era uma criança pequena, ela me beijava e dizia: ‘Que me seja dado, de meu próprio ventre, um irmão seu semelhante a você’. **8** Por isso, José também era semelhante a mim em tudo, conforme as bênçãos de Raquel.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz “bênçãos de Raquel”; a relação exata dessas bênçãos com a semelhança entre José e Naftali não é clara.
    reason: Sinalizar uma expressão textualmente transmitida, mas semanticamente difícil, sem substituí-la por uma interpretação mais fácil.
lexical_decisions:
- source_word: διαθήκη
  choice: testamento
  rationale: No contexto de uma despedida patriarcal, designa uma declaração final ou disposição solene; “testamento” também preserva o título tradicional da obra.
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: por ocasião de sua partida
  rationale: Mantém o eufemismo grego para a morte sem restringir “ἔξοδος” a uma saída meramente física.
- source_word: ἐποίησε δεῖπνον
  choice: ofereceu um banquete
  rationale: “Banquete” comunica uma refeição formal preparada para todos; o verbo foi expresso de modo idiomático em português.
- source_word: ἐκραταιώθη
  choice: recobrou as forças
  rationale: O passivo indica que Naftali foi fortalecido; a formulação portuguesa se ajusta ao contexto de sua fraqueza diante da morte.
- source_word: ἀπέθανεν ἡ σάρξ μου
  choice: minha carne morreu
  rationale: Reproduz a expressão forte e incomum do grego, sem acrescentar a ideia de que a carne primeiro “falhou”.
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: agiu com astúcia
  rationale: Expressa a ação habilidosa ou ardilosa atribuída a Raquel sem impor uma avaliação moral mais específica do que a do grego.
- source_word: ἐπὶ τῶν γονάτων
  choice: sobre os joelhos
  rationale: Preserva a imagem antiga ligada ao reconhecimento da criança e à maternidade representativa.
- source_word: κατὰ τὰς εὐλογίας Ῥαχιήλ
  choice: conforme as bênçãos de Raquel
  rationale: Traduz diretamente o texto grego transmitido, embora a relação precisa entre as bênçãos e a semelhança permaneça pouco clara.
theological_decisions:
- issue: O sentido de “minha carne morreu” em 1.4
  choice: Manter literalmente “minha carne morreu”
  alternative: “Minha carne desfaleceu e morreu” ou “meu corpo morreu”
  rationale: A formulação grega é deliberadamente tensa, pois o falante ainda está vivo. A tradução não resolve essa tensão nem acrescenta um verbo ausente no texto apresentado.
- issue: Agente implícito no desejo de Raquel em 1.7
  choice: Usar a construção impessoal “Que me seja dado”
  alternative: “Que Deus me dê”
  rationale: O optativo grego não nomeia explicitamente Deus. A construção impessoal conserva a possibilidade de um passivo divino sem inserir o agente no texto principal.
- issue: Natureza das εὐλογίας de Raquel em 1.8
  choice: Traduzir “bênçãos”
  alternative: “orações”
  rationale: O substantivo grego fornecido significa “bênçãos”. A tradução mantém essa leitura, ainda que “orações” produza uma ligação contextual mais imediata com o desejo expresso no versículo anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas correntes no Brasil. Empregou-se “vocês” de maneira implícita nos imperativos e possessivos de terceira pessoa, evitando tanto arcaísmos quanto coloquialismos. As imagens culturais e as tensões do grego foram preservadas quando inteligíveis.
