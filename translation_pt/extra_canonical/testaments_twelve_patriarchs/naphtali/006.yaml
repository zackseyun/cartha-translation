    issue: “como se navegasse em plena calma”
    rationale: O grego ὥσπερ ἐν εἰρήνῃ significa mais diretamente “como em paz”/“como se tudo estivesse em paz”; não afirma que a embarcação navegava nem especifica “plena calma”.
  - severity: low
    issue: “em perfeita união”
    rationale: ὁμοθυμαδόν expressa ação conjunta ou unanimidade, mas “perfeita” é uma intensificação não presente no texto.
  - severity: low
    issue: “ficamos separados sobre nove tábuas”
    rationale: A formulação pode sugerir que todos estavam sobre as mesmas nove tábuas. “Dispersos em nove tábuas” comunica melhor a imagem de sobreviventes separados em pedaços de madeira.
