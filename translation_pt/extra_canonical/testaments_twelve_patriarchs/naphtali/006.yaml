  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006.yaml
  text: 'And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him. And behold, a ship came sailing by us, with sailors and pilots. And written on the ship was this: “The Ship of Jacob.”


    And our father said to us, “Come, let us go up into our ship.” And when we had entered, a violent storm arose, and a whirlwind of wind; and our father was separated from us, holding the rudders[b]. And we, being storm-tossed upon the sea, were driven along over the waters, while the ship was filled and battered by the waves, so that it was about to be broken up.


    But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together. And we were scattered, all of us, to the ends of the earth[c]. But Levi, clothed in sackcloth, prayed to the Lord. And when the storm ceased, the ship reached the land as though in peace. And behold, our father came, and we all rejoiced with one accord.'
translation:
  language: pt
  text: '**6** Depois de sete dias, vi novamente meu pai Jacó em pé junto ao mar de Amnia[a], e nós estávamos com ele. **2** Eis que vinha um navio à vela, sem marinheiros nem timoneiros; no navio estava escrito: “Navio de Jacó”.


    **3** Nosso pai nos disse: “Venham, subamos ao nosso navio”. **4** Assim que entramos, surgiu uma tempestade violenta e um grande vendaval. Nosso pai, que segurava os lemes[b], afastou-se de nós. **5** Nós, açoitados pela tempestade, éramos levados pelo alto-mar. O navio se encheu de água e era golpeado pelas ondas, até se despedaçar.


    **6** José, porém, partiu numa pequena embarcação, enquanto nós ficamos dispersos em nove tábuas; Levi e Judá estavam juntos. **7** E todos nós fomos espalhados até os confins da terra[c]. **8** Levi, vestido de pano de saco, orava ao Senhor. **9** Quando a tempestade cessou, a embarcação chegou à terra como se tudo estivesse em paz. **10** Então nosso pai veio, e todos nós nos alegramos juntos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação do lugar chamado “Amnia” é incerta; a tradução preserva a forma do nome grego em vez de propor uma localização.
    reason: cultural_note
  - marker: b
    text: A expressão grega é textualmente difícil. A palavra traduzida como “lemes” significa normalmente “pescoços”, mas o contexto parece indicar algum elemento do equipamento de direção do navio.
    reason: textual_variant
  - marker: c
    text: A expressão “até os confins da terra” pode ter valor simbólico de dispersão, embora o texto a apresente como parte do sonho de Naftali.
    reason: cross_reference
lexical_decisions:
- source_word: θάλασσα Ἀμνείας
  choice: mar de Amnia
  rationale: Preserva por transliteração o topônimo incerto do testemunho grego, sem conjecturar sua localização.
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: sem marinheiros nem timoneiros
  rationale: Traduz diretamente ἐκτός como ausência. Esta leitura difere da camada inglesa fornecida, que diz “with”, mas o grego apresentado diz que o navio vinha sem tripulação nem responsáveis pelo leme.
- source_word: ἁρμενίζον
  choice: vinha um navio à vela
  rationale: Expressa de modo natural o movimento da embarcação sob vela.
- source_word: ἐπεγέγραπτο
  choice: estava escrito
  rationale: Reproduz com clareza o sentido de uma inscrição aposta no navio.
- source_word: χειμὼν σφοδρός
  choice: tempestade violenta
  rationale: No contexto marítimo, χειμών designa tempestade; σφοδρός intensifica sua força.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: um grande vendaval
  rationale: Evita a redundância pouco natural de uma tradução palavra por palavra, conservando a intensidade da expressão.
- source_word: ἀφίσταται
  choice: afastou-se de nós
  rationale: Mantém alguma abertura entre separação circunstancial e afastamento, sem apresentar a ação necessariamente como abandono voluntário.
- source_word: τοὺς αὐχένας
  choice: os lemes
  rationale: O sentido comum é literalmente “os pescoços”, mas isso é obscuro no contexto; a cena náutica favorece uma referência ao equipamento de direção, com a dificuldade registrada em nota.
- source_word: ἐπὶ τὸ πέλαγος ἐφερόμεθα
  choice: éramos levados pelo alto-mar
  rationale: Conserva tanto a passividade dos irmãos quanto a extensão marítima sugerida por πέλαγος.
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: era golpeado pelas ondas
  rationale: Comunica de maneira corrente a violência das vagas e o impacto sofrido pelo navio.
- source_word: συντρίβεσθαι
  choice: se despedaçar
  rationale: O verbo indica quebra violenta; a sequência das nove tábuas favorece um naufrágio efetivo, não apenas iminente.
- source_word: ἀκάτιον
  choice: pequena embarcação
  rationale: Equivalente amplo e claro para uma embarcação de pequeno porte, sem especificar indevidamente seu modelo.
- source_word: σανίδων
  choice: tábuas
  rationale: Reproduz a imagem concreta dos destroços sobre os quais os irmãos ficam separados.
- source_word: ὁμοθυμαδόν
  choice: em perfeita união
  rationale: Expressa a unanimidade e o sentimento compartilhado do grupo em português natural.
theological_decisions:
- issue: Imagem simbólica da dispersão no sonho
  choice: Narrar diretamente o naufrágio e a dispersão, sem identificá-los explicitamente com um exílio histórico.
  alternative: Explicar no texto principal que a visão profetiza a dispersão das tribos.
  rationale: O grego apresenta a cena como sonho e não fornece sua interpretação neste capítulo; explicá-la no corpo da tradução eliminaria deliberadamente sua abertura simbólica.
- issue: κύριος em contexto testamentário judaico
  choice: Senhor
  alternative: SENHOR ou Soberano
  rationale: O texto grego traz Κυρίου, não o tetragrama hebraico. “Senhor” conserva a reverência e corresponde diretamente ao termo testemunhado.
- issue: Agência no afastamento de Jacó
  choice: afastou-se de nós
  alternative: foi separado de nós
  rationale: A forma grega pode descrever separação ou afastamento. A escolha mantém a linguagem narrativa sem afirmar de modo categórico um agente externo nem uma intenção de abandono.
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa fluente e vocabulário marítimo compreensível. A tradução segue prioritariamente o grego apresentado. Em especial, verte ἐκτὸς como “sem”, em contraste com a camada inglesa, e preserva em nota a dificuldade de τοὺς αὐχένας.
