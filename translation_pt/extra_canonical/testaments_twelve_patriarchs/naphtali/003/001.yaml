source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: III. Μὴ οὖν σπουδάζετε¹ *ἐν πλεονεξίᾳ² *διαφθεῖραι τὰς πράξεις ὑμῶν³, ἢ ἐν *λόγοις κενοῖς ἀπατᾶν⁴ τὰς ψυχὰς ὑμῶν, ὅτι⁵ σιωπῶντες⁶ ἐν *καθαρότητι καρδίας⁷ συνήσετε⁸ τὸ θέλημα τοῦ Θεοῦ⁹ κρατεῖν¹⁰, καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/001.yaml
  text: Therefore, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls, because by keeping silent in purity of heart you will understand to hold fast the will of God and to cast away the will of Beliar.
translation:
  language: pt
  text: Portanto, não se empenhem, por ganância, em corromper as suas ações, nem em enganar as suas almas com palavras vazias, pois, guardando silêncio com pureza de coração, vocês compreenderão como se apegar à vontade de Deus[a] e rejeitar a vontade de Beliar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “compreenderão que devem apegar-se à vontade de Deus”.'
    reason: Registra uma tradução possível da relação sintática entre “compreenderão” e os infinitivos seguintes.
  - marker: b
    text: 'Beliar: forma grega do nome também conhecido como Belial.'
    reason: Ajuda o leitor a reconhecer o nome sem alterar a forma encontrada no texto-fonte.
lexical_decisions:
- source_word: σπουδάζετε
  choice: se empenhem
  rationale: Expressa esforço zeloso ou dedicação, sem acrescentar a ideia específica de pressa.
- source_word: πλεονεξίᾳ
  choice: ganância
  rationale: Termo corrente que comunica o desejo ávido de obter mais e preserva a força moral negativa do grego.
- source_word: διαφθεῖραι τὰς πράξεις ὑμῶν
  choice: corromper as suas ações
  rationale: Mantém tanto o verbo forte, que indica deteriorar ou perverter, quanto o sentido amplo de πράξεις como atos ou conduta.
- source_word: λόγοις κενοῖς
  choice: palavras vazias
  rationale: Equivalência direta e natural para discurso sem conteúdo ou valor.
- source_word: σιωπῶντες ἐν καθαρότητι καρδίας
  choice: guardando silêncio com pureza de coração
  rationale: Preserva a construção participial como meio ou circunstância, sem introduzir a condição inexistente no grego.
- source_word: κρατεῖν
  choice: se apegar
  rationale: Comunica a ideia de segurar firmemente ou manter-se ligado à vontade de Deus em português atual.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega apresentada pelo texto-fonte, em vez de substituí-la silenciosamente pela variante mais conhecida Belial.
theological_decisions:
- issue: Relação entre συνήσετε e os infinitivos κρατεῖν e ἀπορρίπτειν
  choice: compreenderão como se apegar ... e rejeitar
  alternative: compreenderão que devem apegar-se ... e rejeitar
  rationale: A construção grega é compacta e admite mais de uma explicitação em português. A formulação com “como” mantém a orientação prática sem transformar o texto numa ordem indireta explícita.
- issue: Identidade e grafia de Βελίαρ
  choice: Beliar
  alternative: Belial
  rationale: A tradução conserva a forma nominal da testemunha grega e registra em nota a variante tradicional, sem impor uma harmonização.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de “vocês” para ampla legibilidade brasileira. A repetição de “vontade” foi mantida para preservar o contraste retórico entre Deus e Beliar; evitou-se introduzir uma oração condicional ausente do grego.
