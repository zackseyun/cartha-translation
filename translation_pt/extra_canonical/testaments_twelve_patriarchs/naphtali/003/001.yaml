  source_fidelity: O texto traduz com precisão a exortação negativa dupla e a consequência introduzida por ὅτι. «Não se empenhem» reproduz adequadamente σπουδάζετε; «ganância», «corromper as suas ações», «palavras vazias» e «enganar as suas almas» refletem bem os termos gregos. «Guardando silêncio com pureza de coração» preserva o particípio σιωπῶντες e não introduz uma condição ausente do original. A formulação «compreenderão como se apegar ... e rejeitar» é uma resolução defensável da relação entre συνήσετε e os infinitivos, devidamente assinalada em nota.
  naturalness: O português é moderno, claro e de registro apropriado. O emprego de «vocês» e das formas correspondentes favorece a legibilidade brasileira sem prejudicar a compreensão internacional. A repetição de «vontade» preserva o contraste deliberado do texto.
  terminology: «Beliar» conserva corretamente a forma da fonte grega, e a nota identifica de modo sóbrio a variante conhecida «Belial». Os termos morais e teológicos permanecem sem carga confessional acrescentada.
