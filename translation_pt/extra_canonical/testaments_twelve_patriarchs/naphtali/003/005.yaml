base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/005.yaml
  text: In the same way also the Watchers changed the order of their nature, whom the Lord cursed at the time of the flood, because of whom he made the earth uninhabited and fruitless.
translation:
  language: pt
  text: 5 Do mesmo modo, também os Vigilantes alteraram a ordem de sua própria natureza. O Senhor os amaldiçoou no tempo do dilúvio e, por causa deles, tornou a terra inabitada e estéril.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta última oração é sintaticamente e textualmente incerto; seus elementos incluem referências à habitação, à esterilidade e, em leitura assinalada entre colchetes, ao caráter inabitado da terra.
    reason: Sinalizar honestamente a dificuldade do texto-fonte e a presença de uma leitura editorial entre colchetes, sem sobrecarregar o corpo da tradução.
lexical_decisions:
- source_word: οἱ Ἐγρήγοροι
  choice: os Vigilantes
  rationale: O termo designa os seres conhecidos na literatura judaica antiga como “Vigilantes”; a forma com inicial maiúscula preserva seu uso como designação de um grupo específico.
- source_word: ἐνήλλαξαν τάξιν φύσεως αὐτῶν
  choice: alteraram a ordem de sua própria natureza
  rationale: Mantém os elementos centrais de ἐναλλάσσω, τάξις e φύσις sem explicar em que consistiu a alteração, preservando a tensão e a falta de especificação do original.
- source_word: κατηράσατο Κύριος
  choice: O Senhor os amaldiçoou
  rationale: Traduz diretamente o verbo forte καταράομαι e o título Κύριος em linguagem natural e digna.
- source_word: ἐπὶ τοῦ κατακλυσμοῦ
  choice: no tempo do dilúvio
  rationale: Expressa o valor temporal da locução e conserva a referência tradicional ao dilúvio.
- source_word: ἀοίκητον … ἄκαρπον
  choice: inabitada e estéril
  rationale: “Inabitada” comunica a ausência de habitação, enquanto “estéril” exprime a incapacidade de produzir fruto; a formulação acompanha a evidência textual apesar da construção grega problemática.
theological_decisions:
- issue: Natureza da transgressão dos Vigilantes
  choice: alteraram a ordem de sua própria natureza
  alternative: abandonaram sua condição natural
  rationale: A tradução não identifica nem interpreta a transgressão além do que o grego afirma; conserva “ordem” e “natureza” e evita importar uma explicação doutrinária.
- issue: Agente da devastação da terra
  choice: o Senhor … tornou a terra inabitada e estéril
  alternative: a terra se tornou inabitada e estéril por causa deles
  rationale: A leitura adotada segue a compreensão sintática refletida no texto de consulta, segundo a qual o Senhor é o agente, sem apagar a responsabilidade causal atribuída aos Vigilantes.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. “Vigilantes” é mantido como designação técnica inteligível; a sintaxe foi levemente dividida em duas frases para evitar uma cadeia pesada de orações relativas, sem alterar as relações de sentido.
