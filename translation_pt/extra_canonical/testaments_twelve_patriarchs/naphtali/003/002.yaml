  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/002.yaml
  text: The sun and the moon and the stars do not alter their order; so you also must not alter the law of God through the disorder of your deeds.
translation:
  language: pt
  text: O sol, a lua e as estrelas não alteram a sua ordem; assim também vocês não devem alterar a lei de Deus pela desordem dos seus atos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάξιν
  choice: ordem
  rationale: Reproduz de modo direto o sentido de disposição ou ordem, sem acrescentar a ideia não explícita de que ela foi previamente determinada.
- source_word: ἀλλοιώσητε
  choice: alterar
  rationale: Mantém o mesmo verbo conceitual nos dois membros da comparação e expressa mudança ou modificação.
- source_word: ἀταξίᾳ
  choice: desordem
  rationale: Preserva o contraste lexical com τάξιν, isto é, entre ordem e desordem.
- source_word: πράξεων
  choice: atos
  rationale: Termo natural e digno para ações ou feitos concretos, adequado ao teor moral da exortação.
theological_decisions:
- issue: Relação entre a conduta humana e a lei de Deus
  choice: “não devem alterar a lei de Deus pela desordem dos seus atos”
  alternative: “não transgridam a lei de Deus com seus atos desordenados”
  rationale: A formulação escolhida conserva o verbo ἀλλοιόω, “alterar”, e a construção do grego, sem substituir a imagem por uma interpretação teológica mais específica como “transgredir”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A sequência “o sol, a lua e as estrelas” evita a repetição pesada dos artigos do grego sem perda de sentido; “vocês” comunica naturalmente o plural de ὑμεῖς.
