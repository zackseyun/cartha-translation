source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Ἔθνη πλανηθέντα *καὶ ἀφέντα Κύριον²⁰ ἠλλοίωσαν²¹ τὴν²² τάξιν αὐτῶν, καὶ *ὑπήκουσαν ξύλοις καὶ λίθοις²³, πνεύμασι²⁴ πλάνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/003.yaml
  text: The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.
translation:
  language: pt
  text: As nações, tendo-se desviado e abandonado o Senhor, alteraram a sua ordem e deram ouvidos à madeira e à pedra, a espíritos de engano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔθνη
  choice: As nações
  rationale: Equivalente natural e abrangente para os povos não especificados no plural.
- source_word: πλανηθέντα
  choice: tendo-se desviado
  rationale: Preserva a ideia de afastamento do caminho correto sem limitar o sentido a erro intelectual.
- source_word: ἀφέντα Κύριον
  choice: abandonado o Senhor
  rationale: Expressa com clareza o afastamento deliberado indicado por ἀφίημι neste contexto.
- source_word: ἠλλοίωσαν τὴν τάξιν αὐτῶν
  choice: alteraram a ordem que lhes cabia
  rationale: Mantém τάξις como 'ordem' e torna explícito, de modo natural, que αὐτῶν se refere à ordem própria delas, sem definir em que consistia essa ordem.
- source_word: ὑπήκουσαν
  choice: deram ouvidos
  rationale: Reproduz a noção de escutar com adesão ou submissão, adequada ao contexto de idolatria.
- source_word: ξύλοις καὶ λίθοις
  choice: à madeira e à pedra
  rationale: Conserva as imagens concretas e coletivas do grego, sem substituir por uma interpretação explícita como 'ídolos'.
- source_word: πνεύμασι πλάνης
  choice: a espíritos de engano
  rationale: Tradução formal que preserva a construção genitiva e sua possível nuance de espíritos enganadores ou ligados ao erro.
theological_decisions:
- issue: Relação entre 'madeira e pedra' e 'espíritos de engano'
  choice: Manter ambos como complementos coordenados de 'deram ouvidos'
  alternative: Entender 'espíritos de engano' como explicação ou identificação dos objetos de madeira e pedra
  rationale: A sintaxe permite associação estreita, mas não exige que os espíritos sejam identificados diretamente com a madeira e a pedra; a tradução conserva essa tensão.
- issue: Sentido de 'ordem'
  choice: Não especificar se é ordem criada, moral, natural ou social
  alternative: Traduzir interpretativamente como 'ordem natural' ou 'condição estabelecida'
  rationale: O substantivo τάξις é amplo neste verso, e a fonte não resolve por si só a natureza exata da ordem alterada.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação e o paralelismo do grego foram preservados sem rigidez excessiva.
