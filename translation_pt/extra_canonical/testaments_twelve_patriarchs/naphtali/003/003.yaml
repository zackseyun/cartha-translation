  source_fidelity: 'A tradução acompanha a estrutura e o sentido do grego: as nações se desviaram, abandonaram o Senhor, alteraram sua própria τάξις e obedeceram/daram ouvidos a madeira, pedra e espíritos de engano. A coordenação dos três dativos após ὑπήκουσαν é preservada adequadamente.'
  naturalness: O português é claro, moderno e de registro apropriado. «Deram ouvidos» comunica bem a ideia de prestar atenção obediente, embora seja menos explícito que «obedeceram».
