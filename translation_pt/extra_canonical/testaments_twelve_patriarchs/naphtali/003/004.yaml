base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/004.yaml
  text: But you, my children, must not be so, knowing in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.
translation:
  language: pt
  text: Vocês, porém, meus filhos, não sejam assim. Reconheçam, no firmamento, na terra, no mar e em todas as coisas criadas, o Senhor que fez todas as coisas, para que não se tornem como Sodoma, que alterou a ordem de sua natureza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερέωμα
  choice: firmamento
  rationale: Preserva a imagem cosmológica do texto grego e mantém um termo bíblico reconhecível em português.
- source_word: δημιουργήμασι
  choice: coisas criadas
  rationale: Expressa de modo natural e abrangente as obras ou criaturas produzidas pelo Criador.
- source_word: ἐνήλλαξε
  choice: alterou
  rationale: Reproduz a ideia de mudança ou troca sem especificar além do que o grego afirma.
- source_word: τάξιν φύσεως αὐτῆς
  choice: a ordem de sua própria natureza
  rationale: Mantém tanto a noção de ordem quanto a referência reflexiva à natureza de Sodoma, sem resolver a tensão interpretativa.
theological_decisions:
- issue: Natureza exata da transgressão de Sodoma
  choice: Preservar a formulação geral “alterou a ordem de sua própria natureza”
  alternative: Explicitar uma prática sexual ou uma violação social específica
  rationale: O versículo não identifica diretamente a conduta; uma explicitação importaria uma interpretação teológica não expressa nesta frase.
- issue: Relação sintática do particípio γινώσκοντες
  choice: Traduzir por “reconhecendo” e manter a construção participial
  alternative: Converter em imperativo independente, como “reconheçam”
  rationale: A forma grega é participial. A tradução preserva sua relação potencialmente circunstancial com a exortação anterior, sem acrescentar um novo mandamento explícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência brasileira. “Vocês” oferece leitura natural; “firmamento” conserva a imagem antiga do original. A repetição “coisas criadas… todas as coisas” foi mantida por corresponder à repetição e ao alcance retórico do grego.
