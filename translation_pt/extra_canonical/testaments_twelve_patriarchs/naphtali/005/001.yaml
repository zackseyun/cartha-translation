base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/001.yaml
  text: And being brought low, you will turn back and acknowledge the Lord your God, and he will bring you back into your land according to his great mercy. 4 And it shall come to pass, when they go out into the land of their fathers, again they will forget the Lord and act impiously. 5 And the Lord will scatter them upon the face of all the earth, until the compassion of the Lord shall come, a man working righteousness and showing mercy to all who are far off and to those who are near.
translation:
  language: pt
  text: '3 Depois de serem humilhados, vocês voltarão, reconhecerão o Senhor, seu Deus, e ele os fará voltar à sua terra, segundo a sua grande misericórdia. 4 E acontecerá que, quando saírem para a terra de seus antepassados, novamente se esquecerão do Senhor e agirão de modo ímpio. 5 Então o Senhor os espalhará por toda a face da terra, até que venha a compaixão do Senhor[a]: um homem que pratica a justiça e exerce misericórdia para com todos, tanto os que estão longe como os que estão perto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as entranhas do Senhor”, expressão que indica profunda compaixão. A construção também pode ser entendida como “aquele que procede da compaixão do Senhor”.
    reason: O grego τὸ σπλάγχνον Κυρίου é uma expressão incomum, seguida pela aposição “um homem”; a nota informa o sentido literal e uma possibilidade sintática sem substituir a leitura principal.
lexical_decisions:
- source_word: σμικρυνθέντες
  choice: Depois de serem humilhados
  rationale: O particípio passivo significa literalmente serem diminuídos ou rebaixados; “humilhados” comunica com naturalidade a condição de abatimento sem especificar indevidamente seu agente.
- source_word: ἐπιγνώσεσθε
  choice: reconhecerão
  rationale: Expressa reconhecimento pleno do Senhor, mais precisamente do que um simples “conhecerão” neste contexto de retorno.
- source_word: ἐπιστρέψει ὑμᾶς
  choice: ele os fará voltar
  rationale: 'Preserva o uso transitivo do verbo: Deus não apenas volta, mas restaura o povo à sua terra.'
- source_word: ἀσεβήσουσιν
  choice: agirão de modo ímpio
  rationale: Mantém o sentido religioso e moral de impiedade em linguagem portuguesa clara.
- source_word: τὸ σπλάγχνον Κυρίου
  choice: a compaixão do Senhor
  rationale: O substantivo visceral funciona idiomaticamente como afeição profunda ou compaixão; a nota registra sua forma literal e a construção incomum.
- source_word: ποιῶν δικαιοσύνην
  choice: pratica a justiça
  rationale: Reproduz a expressão ativa sem transformar “justiça” em mera qualidade abstrata.
- source_word: τοὺς μακρὰν καὶ τοὺς ἐγγύς
  choice: os que estão longe como os que estão perto
  rationale: Conserva o contraste espacial figurável do grego sem identificar de forma não explícita os grupos referidos.
theological_decisions:
- issue: Relação entre “a compaixão do Senhor” e “um homem”
  choice: Manter os dois elementos em aposição, separados por dois-pontos
  alternative: Interpretar diretamente o homem como enviado, encarnação ou agente da compaixão divina
  rationale: O grego apresenta “um homem” após “a compaixão do Senhor” numa construção teologicamente sugestiva, mas não explica a relação. A tradução preserva essa tensão sem impor uma identificação doutrinária.
- issue: Identidade dos que estão longe e dos que estão perto
  choice: Não explicitar sua identidade
  alternative: Traduzir como gentios e judeus, dispersos e habitantes da terra, ou outros grupos definidos
  rationale: O texto grego apenas contrapõe distantes e próximos; nomear os grupos resolveria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas brasileiras naturais (“vocês”, “os fará voltar”). A numeração 3–5 foi mantida porque o trecho-fonte fornecido abrange esses versículos. Evitaram-se arcaísmos e explicitações confessionais; a formulação incomum do versículo 5 foi preservada com apoio de nota.
