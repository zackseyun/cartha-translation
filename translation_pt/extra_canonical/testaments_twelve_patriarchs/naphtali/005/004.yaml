base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/004.yaml
  text: And while Levi was like the sun, behold, a certain young man gives him twelve palm branches; and Judah became bright like the moon, and beneath their feet were twelve rays.
translation:
  language: pt
  text: E, enquanto Levi era como o sol, eis que certo jovem lhe entrega doze ramos de palmeira; e Judá tornou-se brilhante como a lua, e debaixo dos pés deles havia doze raios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος τοῦ Λευὶ ὡς ὁ ἥλιος
  choice: enquanto Levi estava como o sol
  rationale: Preserva a construção circunstancial e a comparação direta do grego, sem explicitar se a semelhança diz respeito ao brilho, à aparência ou à posição.
- source_word: ἰδοὺ νέος τις
  choice: eis que certo jovem
  rationale: “Eis que” conserva a função vívida de ἰδού, e “certo jovem” reproduz a indefinição de τις.
- source_word: ἐπιδίδωσιν
  choice: lhe entrega
  rationale: O presente verbal grego é mantido para reproduzir a vivacidade da narração, em contraste intencional com os verbos passados ao redor.
- source_word: βαΐα φοινίκων δώδεκα
  choice: doze ramos de palmeira
  rationale: Expressão clara e corrente que representa os ramos ou frondes de palmeira mencionados no grego.
- source_word: ἐγένετο λαμπρὸς ὡς ἡ σελήνη
  choice: tornou-se brilhante como a lua
  rationale: Mantém o valor ingressivo de ἐγένετο e a comparação explícita com a lua.
- source_word: δώδεκα ἀκτῖνες
  choice: doze raios
  rationale: “Raios” conserva a imagem luminosa de ἀκτῖνες e sua possível relação simbólica com o sol e a lua.
theological_decisions:
- issue: Identidade e possível função simbólica do jovem
  choice: certo jovem
  alternative: um anjo / o Messias
  rationale: O texto grego apenas diz νέος τις e não identifica a figura; a tradução preserva essa indefinição sem impor interpretação teológica.
- issue: Referente do pronome αὐτῶν em “debaixo dos pés deles”
  choice: deles
  alternative: de Levi e Judá
  rationale: O pronome plural pode remeter naturalmente a Levi e Judá, mas o texto não os repete; manter o pronome preserva a formulação e qualquer leve ambiguidade referencial do original.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego sem artificialidade excessiva. A alternância entre “estava”, o presente vívido “entrega” e os passados seguintes foi preservada deliberadamente.
