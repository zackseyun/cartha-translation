source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καὶ εἶδον *ὅτι ἤμην παρεκεῖ⁴¹, καὶ ἰδοὺ γραφὴ *ἁγία ὤφθη ἡμῖν⁴², λέγουσα⁴³· Ἀσσύριοι⁴⁴, Μῆδοι⁴⁵, Πέρσαι⁴⁶, Χαλδαῖοι⁴⁷, Σύροι⁴⁸, κληρονομήσουσιν αἰχμαλωσίαν⁴⁹ τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/008.yaml
  text: And I saw that I was there, and behold, a holy writing appeared to us, saying, “Assyrians, Medes, Persians, Chaldeans, Syrians shall inherit in captivity the twelve sceptres of Israel.”
translation:
  language: pt
  text: 'E vi que estava ali; e eis que nos apareceu um escrito sagrado, que dizia: “Assírios, medos, persas, caldeus e sírios herdarão, em cativeiro, os doze cetros de Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκεῖ
  choice: ali
  rationale: O termo, embora textualmente incomum, indica presença naquele lugar; “ali” preserva o sentido espacial de modo natural.
- source_word: γραφὴ ἁγία
  choice: uma escritura sagrada
  rationale: Mantém a referência a um escrito santo sem pressupor que se trate de um livro canônico específico.
- source_word: κληρονομήσουσιν
  choice: tomarão como herança
  rationale: Conserva a imagem de herdar ou receber como posse, em vez de reduzi-la simplesmente a “conquistar”.
- source_word: αἰχμαλωσίαν
  choice: no cativeiro
  rationale: Expressa a condição ou esfera em que os cetros passam ao domínio das nações, preservando a construção difícil do grego.
- source_word: σκῆπτρα
  choice: cetros
  rationale: Retém a metáfora régia e tribal do original, que representa autoridade e domínio.
theological_decisions:
- issue: Relação sintática entre “herdar”, “cativeiro” e “os doze cetros”
  choice: “tomarão como herança, no cativeiro, os doze cetros”
  alternative: “herdarão o cativeiro dos doze cetros”
  rationale: A sintaxe grega é tensa e permite mais de uma relação entre os elementos. A escolha segue a leitura contextual de que as nações receberão domínio sobre as tribos no exílio, sem eliminar totalmente a estranheza por meio de uma paráfrase interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com ordem levemente solene em “Então, eis que”. Os nomes dos povos seguem as formas portuguesas correntes; a repetição de “eis que” não foi duplicada literalmente, evitando peso desnecessário sem perder o caráter visionário.
