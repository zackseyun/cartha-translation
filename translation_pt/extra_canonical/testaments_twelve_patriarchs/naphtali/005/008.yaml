revisions:
- from: 'E vi que eu estava ali. Então, eis que nos apareceu uma escritura sagrada, que dizia: “Assírios, medos, persas, caldeus e sírios tomarão como herança, no cativeiro, os doze cetros de Israel.”'
  to: 'E vi que estava ali; e eis que nos apareceu um escrito sagrado, que dizia: “Assírios, medos, persas, caldeus e sírios herdarão, em cativeiro, os doze cetros de Israel.”'
  rationale: A revisão elimina a paráfrase “tomarão como herança” e conserva “herdarão”, correspondente direto de κληρονομήσουσιν. Mantém-se “em cativeiro”, como no rastro inglês, mas com pontuação que não pretende definir de modo excessivo sua relação com os “doze cetros”. “Um escrito sagrado” traduz γραφὴ ἁγία sem pressupor identificação canônica.
