review_pass:
  verdict: revise
  source_fidelity: A sequência visionária e os etnônimos estão corretamente representados. Contudo, “tomarão como herança, no cativeiro” explicita e suaviza uma construção grega sintaticamente difícil (κληρονομήσουσιν αἰχμαλωσίαν τὰ δώδεκα σκῆπτρα) além do que o texto permite com segurança. “Herdarão, em cativeiro” conserva melhor o verbo e mantém a relação disputada sem a resolver interpretativamente.
  naturalness: A redação é clara e de registro adequado. “Eis que” reproduz bem ἰδού; “Então” é dispensável, pois não corresponde a um conectivo distinto no grego. “Um escrito sagrado” é mais natural e menos potencialmente canonizante que “uma escritura sagrada”, preservando γραφὴ como um escrito que aparece na visão.
  terminology: Assírios, medos, persas, caldeus, sírios e cetros estão bem escolhidos. “Cetros” preserva a imagem política/tribal de σκῆπτρα. Não há questão doutrinária a impor.
  issues:
  - severity: medium
    issue: Resolução interpretativa da construção com αἰχμαλωσίαν
    rationale: “Tomarão como herança, no cativeiro” converte o verbo κληρονομήσουσιν em uma perífrase mais interpretativa e apresenta “no cativeiro” como relação já decidida. O original é tenso; a tradução deve conservar o verbo “herdar” e a ambiguidade relacional tanto quanto o português permita.
  - severity: low
    issue: “Então” não tem correspondente necessário no original
    rationale: O grego coordena com καί e introduz a visão com ἰδού. “E eis que” é mais direto e fiel ao andamento do texto.
  - severity: low
    issue: “Escritura sagrada” pode sugerir uma Escritura canônica específica
    rationale: γραφὴ ἁγία designa literalmente um escrito santo/sagrado. “Um escrito sagrado” mantém a indefinição do original e soa natural em português contemporâneo.
  revised_text: 'E vi que estava ali; e eis que nos apareceu um escrito sagrado, que dizia: “Assírios, medos, persas, caldeus e sírios herdarão, em cativeiro, os doze cetros de Israel.”'
