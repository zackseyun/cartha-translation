  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/002.yaml
  text: V. For in the fortieth year of my life, I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still. 2 And behold, Isaac, the father of my father, said to us, “Run up, and let each of you seize according to his strength; and the one who takes hold shall have the sun and the moon.”
translation:
  language: pt
  text: 'V. Pois, no quadragésimo ano da minha vida, tive uma visão no Monte das Oliveiras, a leste de Jerusalém: o sol e a lua estavam parados. 2 E eis que Isaque, pai de meu pai, nos dizia: “Corram, e cada um agarre segundo a sua força; e aquele que conseguir agarrar terá o sol e a lua.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον ὄραμα
  choice: tive uma visão
  rationale: Expressão natural em português para a experiência visionária, sem alterar o conteúdo do grego, literalmente ‘vi uma visão’.
- source_word: ἕστηκαν
  choice: estavam parados
  rationale: Preserva o sentido de o sol e a lua permanecerem imóveis no cenário da visão.
- source_word: Προσδραμόντες
  choice: Corram até lá
  rationale: Comunica o movimento rápido de aproximação expresso pelo particípio aoristo, de modo idiomático em português.
- source_word: κρατήσατε ἕκαστος κατὰ δύναμιν
  choice: cada um agarre segundo a sua força
  rationale: Mantém a ausência de objeto explícito no grego e conserva a relação entre a ação individual e a capacidade de cada um.
- source_word: τοῦ πιάσαντος
  choice: aquele que conseguir agarrar
  rationale: Reproduz a ideia de alcançar ou obter domínio mediante o ato de agarrar, sem acrescentar um pronome-objeto ausente no texto.
- source_word: ἔσται ὁ ἥλιος καὶ ἡ σελήνη
  choice: terá o sol e a lua
  rationale: Solução portuguesa natural para a construção possessiva contextual, em consonância com a relação predicativa do grego.
theological_decisions:
- issue: Objeto implícito dos verbos κρατήσατε e πιάσαντος
  choice: Não inserir ‘os’ ou ‘neles’
  alternative: ‘agarre-os’ / ‘aquele que os agarrar’
  rationale: O grego não apresenta objeto expresso; manter a formulação sem objeto preserva a abertura e a estranheza própria da visão.
- issue: Natureza da imobilidade do sol e da lua
  choice: Descrever apenas que ‘estavam parados’ dentro da visão
  alternative: Interpretar como milagre astronômico histórico ou símbolo específico
  rationale: O trecho relata uma visão e não explica o significado da cena; a tradução não deve impor uma leitura cosmológica ou teológica.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. Conservou-se o marcador de seção ‘V.’ da edição fornecida e a numeração do versículo 2. ‘Isaque’ segue a forma bíblica corrente, e ‘pai de meu pai’ preserva a formulação enfática do original em vez de substituí-la por ‘avô’.
