base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/003.yaml
  text: And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.
translation:
  language: pt
  text: E todos nós corremos juntos, e Levi agarrou o sol, e Judá, chegando primeiro, segurou a lua; e ambos foram elevados com eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδράμομεν πάντες ὁμοῦ
  choice: todos nós corremos juntos
  rationale: Reproduz diretamente a ação conjunta e mantém a ordem natural em português.
- source_word: ἐκράτησε τὸν ἥλιον
  choice: agarrou o sol
  rationale: “Agarrou” expressa de modo vivo e natural o ato de apoderar-se ou segurar firmemente.
- source_word: φθάσας
  choice: chegando primeiro
  rationale: Preserva o valor contextual de chegar antes dos demais, sem acrescentar uma ideia de vitória.
- source_word: ἔπιασε τὴν σελήνην
  choice: segurou a lua
  rationale: Verte o ato de tomar e manter presa a lua em linguagem corrente, evitando repetição estilística de “agarrou”.
- source_word: ὑψώθησαν
  choice: foram elevados
  rationale: Mantém a voz passiva e a imagem de serem erguidos, sem identificar um agente não expresso.
- source_word: σὺν αὐτοῖς
  choice: com eles
  rationale: Conserva a ambiguidade referencial do pronome masculino plural grego, que pode remeter aos astros ou ao conjunto envolvido na visão.
theological_decisions:
- issue: Referente de σὺν αὐτοῖς (“com eles”)
  choice: manter “com eles” sem explicitação
  alternative: “com o sol e a lua”
  rationale: O texto grego deixa o referente pronominal implícito; explicitá-lo resolveria uma ambiguidade que deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa. A formulação conserva o caráter visionário da passagem e sua ambiguidade final.
