base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/006.yaml
  text: And behold, a bull was on the earth, having two great horns and the wings of an eagle on its back; and though we wanted to seize it, we were not able.
translation:
  language: pt
  text: E eis que havia um touro sobre a terra, com dois grandes chifres e asas de águia no dorso; e, embora quiséssemos agarrá-lo, não conseguimos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: E eis que
  rationale: Preserva o marcador vívido de introdução da visão, em registro bíblico ainda compreensível.
- source_word: ταῦρος
  choice: touro
  rationale: Equivalente direto e natural do substantivo grego.
- source_word: κέρατα μεγάλα
  choice: grandes chifres
  rationale: Mantém o sentido e a ênfase descritiva do grego em ordem natural no português.
- source_word: πτέρυγας ἀετοῦ
  choice: asas de águia
  rationale: Reproduz naturalmente a construção genitiva, sem especificar além do texto se pertenciam a uma águia determinada.
- source_word: πιάσαι
  choice: agarrá-lo
  rationale: Expressa a tentativa de apanhar ou dominar fisicamente o touro; é mais corrente que 'capturá-lo' e preserva a força concreta do verbo.
- source_word: οὐκ ἠδυνήθημεν
  choice: não conseguimos
  rationale: Forma idiomática moderna que comunica diretamente a incapacidade expressa pelo grego.
