  text: 6. Καὶ ἰδοὺ ταῦρος ἐπὶ τῆς γῆς, ἔχων δύο³³ κέρατα μεγάλα, καὶ πτέρυγας³⁴ ἀετοῦ ἐπὶ³⁵ νώτου αὐτοῦ· καὶ θέλοντες ἡμεῖς³⁶ πιάσαι³⁷ αὐτόν, οὐκ ἠδυνήθημεν.
