lexical_decisions:
- source_word: ἐλθὼν
  choice: chegou
  rationale: O particípio aoristo indica a chegada de José antes das ações seguintes; «chegou» soa mais natural aqui do que o literal «tendo vindo».
- source_word: κατέλαβεν
  choice: agarrou-o
  rationale: O verbo pode significar alcançar, apanhar ou apoderar-se; no contexto de uma ação física, «agarrou-o» preserva sua força sem especificar além do grego.
- source_word: συνανῆλθεν
  choice: subiu com ele
  rationale: Expressa de modo direto a subida conjunta indicada pelo verbo composto e pelo dativo αὐτῷ.
- source_word: εἰς τὸ ὕψος
  choice: até o alto
  rationale: Reproduz a direção para um lugar elevado, sem transformar a expressão abstrata do grego em um local mais específico.
