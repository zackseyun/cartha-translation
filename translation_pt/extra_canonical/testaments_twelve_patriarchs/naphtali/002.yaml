  revised_text: '## Testamento de Naftali 2


    **1.** Eu era ágil de pés como a corça, e meu pai Jacó me designou para levar todo tipo de mensagem; ele me abençoou como se eu fosse uma corça.[a]


    **2.** Pois, assim como o oleiro sabe quanto o vaso pode conter e, de acordo com isso, emprega o barro, assim também o Senhor faz o corpo de modo correspondente ao espírito e, de acordo com a capacidade do corpo, coloca nele o espírito.


    **3.** E nada lhe falta, nem sequer um terço de fio de cabelo, pois toda a criação foi feita por peso, medida e regra.


    **4.** E, assim como o oleiro sabe para que serve cada vaso e até que ponto ele é adequado, assim também o Senhor conhece o corpo: até quando perseverará no bem e quando entrará no mal.


    **5.** Pois não há criatura nem pensamento que o Senhor não conheça; porque ele criou todo ser humano à sua própria imagem.


    **6.** Tal como é a força de uma pessoa, assim também é a sua palavra, quer esteja na lei do Senhor, quer na lei de Beliar.[b][c]


    **7.** E, assim como há separação entre a luz e as trevas, e entre a ação e a audição, assim também há diferença entre um homem e outro e entre uma mulher e outra; não se pode dizer que, em todos os aspectos, um rosto seja igual a outro.[d]


    **8.** Pois Deus fez boas todas as coisas, cada qual em sua ordem: pôs os cinco sentidos na cabeça e ligou o pescoço à cabeça; acrescentou-lhe também os cabelos, para beleza e glória; depois, o coração para o entendimento, o ventre para o discernimento, o estômago para a trituração, a traqueia para a saúde, o fígado para a ira, a bile para a amargura, o baço para o riso, os rins para a astúcia, os flancos para a força, o lado para dormir, os lombos para o vigor, e assim por diante.[e]


    **9.** Portanto, meus filhos, que todas as obras de vocês sejam ordenadas para o bem, no temor de Deus. Não façam nada de modo desordenado, por desprezo, nem fora do tempo apropriado.


    **10.** Pois, se você disser ao olho: “Ouça”, ele não poderá. Do mesmo modo, enquanto estiverem nas trevas, vocês não poderão praticar as obras da luz.'
