  text: '1[a]. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he blessed me as though I were a deer.


    2. For just as the potter knows how much the vessel can hold, and according to that brings the clay for the work, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body''s capacity places the spirit within it.


    3. And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.


    4. And just as the potter knows the use of each vessel, how much it is fit for, so also the Lord knows the body: how long it will endure in good, and when it comes into evil.


    5. For there is no purpose of his creation that the Lord does not know; for he created every human being in his own image.


    6[b]. As a person''s strength is, so also is his work, whether in the law of the Lord or in the law of Beliar.


    7. And just as there is a division between light and darkness, between seeing and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in all things one face is the same as another.


    8. For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.


    9. So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.


    10. For if you say to the eye, “Hear,” it cannot; or to the ear, “See,” it cannot.


    11. In the same way, neither can you do the works of heaven on earth, nor the works of earth in heaven.


    12. For God made all things beautiful in their time. He gave the sun to rule the day, and the moon and stars to rule the night.


    13. Therefore, my children, recognize in your heart that as the sun is not the moon, so also the righteous are not the sinners, nor the sinners the righteous.


    14. But there is a difference in conduct and in understanding and in purpose.


    15. For the righteous man has understanding in all things, but the sinner walks in darkness and does not know what he does.


    16. Therefore be wise in God, my children, and understand the order of all things, each in its season, so that you may not transgress the law of the Lord or the law of Beliar by confusion.


    17. But rather choose the law of the Lord, and walk in simplicity and in the fear of God, doing what is good before him.


    18. If you do these things, my children, you will prosper in every work and in every counsel[d][c], and the Lord will bless you forever.'
translation:
  language: pt
  text: '## Testamento de Naftali 2


    **1.** Eu era ágil de pés como a corça, e meu pai Jacó me designou para levar todo tipo de mensagem; ele me abençoou como se eu fosse uma corça.[a]


    **2.** Pois, assim como o oleiro sabe quanto o vaso pode conter e, de acordo com isso, emprega o barro, assim também o Senhor faz o corpo de modo correspondente ao espírito e, de acordo com a capacidade do corpo, coloca nele o espírito.


    **3.** E nada lhe falta, nem sequer um terço de fio de cabelo, pois toda a criação foi feita por peso, medida e regra.


    **4.** E, assim como o oleiro sabe para que serve cada vaso e até que ponto ele é adequado, assim também o Senhor conhece o corpo: até quando perseverará no bem e quando entrará no mal.


    **5.** Pois não há criatura nem pensamento que o Senhor não conheça; porque ele criou todo ser humano à sua própria imagem.


    **6.** Tal como é a força de uma pessoa, assim também é a sua palavra, quer esteja na lei do Senhor, quer na lei de Beliar.[b][c]


    **7.** E, assim como há separação entre a luz e as trevas, e entre a ação e a audição, assim também há diferença entre um homem e outro e entre uma mulher e outra; não se pode dizer que, em todos os aspectos, um rosto seja igual a outro.[d]


    **8.** Pois Deus fez boas todas as coisas, cada qual em sua ordem: pôs os cinco sentidos na cabeça e ligou o pescoço à cabeça; acrescentou-lhe também os cabelos, para beleza e glória; depois, o coração para o entendimento, o ventre para o discernimento, o estômago para a trituração, a traqueia para a saúde, o fígado para a ira, a bile para a amargura, o baço para o riso, os rins para a astúcia, os flancos para a força, o lado para dormir, os lombos para o vigor, e assim por diante.[e]


    **9.** Portanto, meus filhos, que todas as obras de vocês sejam ordenadas para o bem, no temor de Deus. Não façam nada de modo desordenado, por desprezo, nem fora do tempo apropriado.


    **10.** Pois, se você disser ao olho: “Ouça”, ele não poderá. Do mesmo modo, enquanto estiverem nas trevas, vocês não poderão praticar as obras da luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início do capítulo apresenta variações e dificuldades de transmissão. O sentido geral é que Naftali era ágil como uma corça e, por isso, Jacó o encarregava de levar mensagens.
    reason: textual_variant
  - marker: b
    text: O texto grego deste versículo está difícil e possivelmente corrompido. A tradução conserva “palavra”, o sentido mais direto de λόγος, embora algumas reconstruções entendam “obra” ou “conduta”.
    reason: textual_variant
  - marker: c
    text: Beliar é um nome tradicional, na literatura testamentária judaica, para o poder que se opõe a Deus e à sua lei.
    reason: cultural_note
  - marker: d
    text: A redação grega do versículo está instável, sobretudo no contraste entre “ação” e “audição” e na frase final. A tradução segue a leitura grega transmitida, sem resolver a dificuldade por uma reconstrução de faculdades sensoriais.
    reason: textual_variant
  - marker: e
    text: A lista de partes do corpo e suas funções foi transmitida com várias dificuldades textuais. Algumas associações refletem concepções fisiológicas e morais antigas; a tradução mantém as funções indicadas no texto sem tratá-las como descrição científica moderna.
    reason: textual_variant
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν ὡς ἡ ἔλαφος
  choice: ágil de pés como a corça
  rationale: κοῦφος indica leveza e agilidade; “ágil de pés” comunica naturalmente a rapidez, e “corça” preserva a forma feminina da comparação grega.
- source_word: ἀγγελία
  choice: levar todo tipo de mensagem
  rationale: No contexto, trata-se da função prática de mensageiro confiada por Jacó. A formulação verbal é mais natural em português do que “para toda mensagem”.
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: de modo correspondente ao espírito
  rationale: A expressão descreve correspondência entre corpo e espírito sem definir uma antropologia sistemática posterior.
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος τὸ πνεῦμα ἐπιτίθησιν
  choice: de acordo com a capacidade do corpo, coloca nele o espírito
  rationale: δύναμις tem aqui o sentido contextual de capacidade, e ἐπιτίθησιν indica colocação ou atribuição; “nele” produz português claro sem eliminar a tensão antropológica.
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: por peso, medida e regra
  rationale: Mantém a tríade retórica que apresenta a criação como proporcionada e ordenada.
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ ... ἔρχεται ἐν κακῷ
  choice: perseverará no bem ... entrará no mal
  rationale: A formulação conserva a amplitude moral e existencial das expressões, sem reduzi-las a prosperidade e infortúnio.
- source_word: πλάσμα καὶ πᾶσα ἔννοια
  choice: criatura nem pensamento
  rationale: πλάσμα é aquilo que foi formado ou criado, e ἔννοια é pensamento, concepção ou intenção. A tradução segue a sintaxe transmitida sem convertê-la silenciosamente em “propósito da criação”.
- source_word: λόγος
  choice: palavra
  rationale: λόγος não significa normalmente “obra”. Apesar da dificuldade contextual do versículo, “palavra” preserva a evidência lexical do texto grego.
- source_word: νόμῳ Κυρίου ... νόμῳ τοῦ Βελίαρ
  choice: lei do Senhor ... lei de Beliar
  rationale: Mantém diretamente as duas esferas morais opostas e conserva Beliar como nome próprio tradicional.
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: entre a visão e a audição
  rationale: O primeiro termo está textualmente instável; “visão” se ajusta ao contraste entre faculdades sensoriais desenvolvido no contexto imediato.
- source_word: καιρός
  choice: tempo apropriado
  rationale: καιρός denota o momento oportuno ou devido, não simplesmente tempo cronológico.
theological_decisions:
- issue: Correspondência entre corpo e espírito nos versículos 2–4
  choice: Expressar a proporção e a ordenação divina entre corpo e espírito sem explicar sua relação por categorias dogmáticas posteriores.
  alternative: Ler o trecho como dualismo rígido entre corpo e alma, ou como simples observação fisiológica.
  rationale: A analogia do oleiro enfatiza capacidade, correspondência e desígnio divino, mas não fornece uma antropologia sistemática.
- issue: Conhecimento criador de Deus no versículo 5
  choice: Traduzir a afirmação como conhecimento divino de toda criatura e pensamento.
  alternative: Reformular como “não há propósito de sua criação que o Senhor desconheça”.
  rationale: A alternativa produz uma ideia coerente, mas vai além da formulação grega transmitida. A tradução mantém a abrangência e a dificuldade da frase.
- issue: Lei do Senhor e lei de Beliar
  choice: Manter as duas expressões como esferas opostas de lealdade moral, com Beliar como nome próprio.
  alternative: Desmitologizar Beliar como “maldade” ou “indignidade”.
  rationale: A literatura testamentária apresenta Beliar como poder nomeado oposto a Deus; substituir o nome por uma abstração apagaria essa característica.
- issue: Obras da luz praticadas a partir das trevas no versículo 10
  choice: Conservar o contraste moral e metafórico entre trevas e luz.
  alternative: Explicitar as trevas como pecado e a luz como justiça.
  rationale: O próprio texto deixa a metáfora aberta; a tradução não deve reduzir sua força por meio de uma interpretação inserida no corpo do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por frases claras e vocabulário corrente. Empregou-se “vocês” nas exortações familiares, natural para leitores brasileiros e compreensível internacionalmente. A tradução limita-se aos versículos efetivamente presentes no testemunho grego fornecido (2.1–10); não incorpora os versículos 11–18 da camada inglesa, pois eles não constam do excerto original apresentado.
