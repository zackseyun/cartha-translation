translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem temporal do particípio foi explicitada por “depois de”, e “com insistência” conserva a intensidade de παρεκάλεσεν. Não são necessárias notas de rodapé.
