  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/001.yaml
  text: And after instructing them in many such things, he urged them to carry his bones to Hebron and bury him with his fathers.
translation:
  language: pt
  text: E, depois de lhes ordenar muitas coisas desse tipo, pediu-lhes com insistência que levassem seus ossos para Hebrom e o sepultassem com seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: depois de lhes dar ... instruções
  rationale: Expressa naturalmente o particípio aoristo e o sentido de transmitir orientações ou mandamentos, sem tornar o contexto mais legal do que o grego exige.
- source_word: παρεκάλεσεν
  choice: pediu-lhes com insistência
  rationale: Preserva a força de exortação ou apelo do verbo, mais intensa que um simples pedido.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: levassem seus ossos
  rationale: Verte de modo claro e natural o transporte posterior dos restos mortais, sem acrescentar uma direção não explicitada além do destino indicado.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: junto de seus pais
  rationale: Mantém a expressão genealógica tradicional e sua referência aos antepassados sepultados.
