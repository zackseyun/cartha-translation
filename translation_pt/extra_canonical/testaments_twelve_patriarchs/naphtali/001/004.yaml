base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/004.yaml
  text: And while blessing and glorifying the Lord, he grew strong and said, “After yesterday’s meal, my flesh died.”
translation:
  language: pt
  text: 'E, glorificando o Senhor, ele foi fortalecido e disse: “Após a refeição de ontem, minha carne morreu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: glorificando
  rationale: Traduz diretamente o particípio como ação simultânea; o texto grego apresentado não contém um verbo distinto para “bendizer”.
- source_word: ἐκραταιώθη
  choice: se fortaleceu
  rationale: Preserva o sentido passivo/intransitivo de tornar-se forte ou receber forças, em português natural.
- source_word: δεῖπνον
  choice: refeição
  rationale: Expressa uma refeição, frequentemente a principal refeição do dia, sem acrescentar a ideia específica de festa ou banquete.
- source_word: σάρξ
  choice: carne
  rationale: Mantém o termo concreto e sua possível carga antropológica, sem interpretá-lo simplesmente como “corpo”.
- source_word: ἀπέθανεν
  choice: morreu
  rationale: Equivalente direto, sem ampliar o verbo com ideias como falhar ou definhar.
theological_decisions:
- issue: Sentido de “minha carne morreu”
  choice: Manter a formulação literal “minha carne morreu”
  alternative: Interpretar como “meu corpo perdeu as forças” ou “eu estava à beira da morte”
  rationale: A expressão pode ser física, figurada ou ascética; a tradução preserva essa tensão sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção foi mantida concisa e próxima do grego. Não se reproduziu “bendizendo” da consulta inglesa, pois não há termo correspondente no texto grego fornecido.
