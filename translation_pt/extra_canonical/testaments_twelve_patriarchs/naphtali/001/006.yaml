base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/006.yaml
  text: I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me on Rachel’s knees, and for this reason she called my name Naphtali.
translation:
  language: pt
  text: Eu nasci de Bila, porque Raquel agiu com astúcia e deu Bila a Jacó em seu lugar; Bila concebeu e me deu à luz sobre os joelhos de Raquel, e por isso ela me deu o nome de Naftali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: agiu com astúcia
  rationale: Reproduz de modo natural a ideia de agir com esperteza ou ardil, sem intensificar o texto com uma acusação mais forte como “enganou”.
- source_word: ἀντʼ αὐτῆς
  choice: em seu lugar
  rationale: Expressa claramente a substituição de Raquel por Bila na relação com Jacó.
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  choice: sobre os joelhos de Raquel
  rationale: Mantém a imagem concreta e a formulação tradicional do costume representado no texto, sem explicá-lo dentro da tradução.
- source_word: ἐκάλεσε τὸ ὄνομά μου
  choice: me deu o nome de
  rationale: Equivalente idiomático corrente em português para a fórmula semítica preservada em grego.
theological_decisions:
- issue: Agente do ato de dar à luz e da nomeação
  choice: Bila é explicitada como sujeito de “concebeu e me deu à luz”; “ela” na nomeação permanece sem identificação adicional.
  alternative: Repetir “Bila” também como sujeito da nomeação ou interpretar o pronome como referência a Raquel.
  rationale: O particípio feminino συλλαβοῦσα retoma naturalmente Bila. Já o sujeito de ἐκάλεσε não é nomeado de forma explícita; conservar “ela” evita resolver silenciosamente a possível ambiguidade entre Bila e Raquel.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha de perto o encadeamento do grego, mas evita construções artificiais.
