  rationale: Preserva a repetição retórica entre τέκνα e υἱοί, bem como o nome ancestral.
- source_word: λόγους πατρὸς ὑμῶν
  choice: as palavras de seu pai
  rationale: Traduz λόγους no plural e conserva a relação paterna explicitada no grego.
