  text: Therefore Joseph also was like me in every way, according to the prayers of Rachel.
translation:
  language: pt
  text: Por isso, José também era semelhante a mim em tudo, conforme as orações[a] de Raquel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura: “bênçãos”.'
