lexical_decisions:
- source_word: Ὅθεν
  choice: Por isso
  rationale: Expressa de modo natural a inferência ou consequência indicada pelo conector grego.
- source_word: ὅμοιός μου
  choice: semelhante a mim
  rationale: Preserva diretamente a comparação com o narrador sem acrescentar uma interpretação específica.
- source_word: κατὰ πάντα
  choice: em tudo
  rationale: Equivalência idiomática e abrangente para a expressão grega.
- source_word: εὐχάς / †εὐλογίας
  choice: orações
  rationale: Segue a leitura εὐχάς indicada no aparato e adotada pela camada inglesa auditada; a leitura impressa ou variante εὐλογίας é registrada em nota.
theological_decisions:
- issue: Relação entre a semelhança de José com o narrador e as palavras de Raquel
  choice: conforme as orações de Raquel
  alternative: conforme as bênçãos de Raquel
  rationale: A tradução mantém a relação expressa por κατά sem explicar de que modo as orações produziram ou predisseram essa semelhança; a alternativa decorre da variante textual.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe simples. “Semelhante a mim” conserva o tom formal do testemunho; “em tudo” evita uma formulação artificial.
