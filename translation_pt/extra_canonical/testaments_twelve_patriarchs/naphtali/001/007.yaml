  text: 7. *Ἠγάπησε γάρ³⁹ με Ῥαχιὴλ⁴⁰ πάνυ⁴¹, ὅτι ἐπὶ *τῶν γονάτων⁴² αὐτῆς ἐγεννήθην, καὶ ἔτι⁴³ ἁπαλὸν ὄντα *με κατεφίλει⁴⁴ λέγουσα· *Δοίη μοι ἀδελφόν⁴⁵ σου ἐκ τῆς κοιλίας μου κατά σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/007.yaml
  text: For Rachel loved me greatly, because I was born upon her knees; and while I was still tender she kept kissing me, saying, ‘May I be given from my own womb a brother like you.’
translation:
  language: pt
  text: 'Pois Raquel me amava muito, porque nasci sobre os joelhos dela; e, quando eu ainda era bem pequeno, ela me cobria de beijos, dizendo: “Que eu receba do meu próprio ventre um irmão seu, semelhante a você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῶν γονάτων αὐτῆς
  choice: sobre os joelhos dela
  rationale: Mantém a imagem concreta do grego sem explicar no corpo do texto o possível costume familiar ou jurídico envolvido.
- source_word: ἁπαλὸν ὄντα
  choice: quando eu ainda era bem pequeno
  rationale: Expressa em português natural a ideia de tenra idade; o contexto indica que se refere a uma criança pequena.
- source_word: με κατεφίλει
  choice: ela me cobria de beijos
  rationale: O imperfeito e o verbo intensivo sugerem uma ação afetuosa repetida, mais bem representada assim do que pelo simples 'beijava'.
- source_word: Δοίη μοι
  choice: Que eu receba
  rationale: Reproduz o desejo expresso pelo optativo sem introduzir explicitamente um agente que o grego deixa subentendido.
- source_word: ἀδελφόν σου ... κατά σε
  choice: um irmão seu, semelhante a você
  rationale: Preserva tanto a relação com Naftali ('seu irmão') quanto a semelhança desejada ('semelhante a você').
- source_word: ἐκ τῆς κοιλίας μου
  choice: do meu próprio ventre
  rationale: Conserva a referência enfática a um filho gerado pela própria Raquel.
theological_decisions:
- issue: Agente implícito em Δοίη μοι
  choice: Não identificar quem concede o filho
  alternative: “Que Deus me dê”
  rationale: Embora Deus possa ser entendido como agente no contexto religioso, o nome divino não aparece nesta oração grega; a tradução preserva essa indeterminação.
translation_notes:
  register: Português moderno, digno e acessível, com construção fluente e preservação das imagens corporais do original. A cláusula mencionada na revisão inglesa mais recente, 'e Raquel me deu à luz', não foi incluída porque não consta no texto grego fornecido e entraria em tensão com a afirmação de que Raquel desejava gerar do próprio ventre um irmão semelhante a Naftali.
