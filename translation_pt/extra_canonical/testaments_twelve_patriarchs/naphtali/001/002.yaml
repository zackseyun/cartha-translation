  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/002.yaml
  text: When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them.
translation:
  language: pt
  text: Quando seus filhos se reuniram no sétimo mês, no primeiro dia do mês, ele preparou uma refeição para eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνελθόντων
  choice: Quando ... se reuniram
  rationale: O particípio aoristo em genitivo absoluto indica a circunstância temporal anterior à ação principal; a oração temporal é natural e clara em português.
- source_word: μιᾷ τοῦ μηνός
  choice: no primeiro dia do mês
  rationale: A expressão grega usa o numeral feminino substantivado em concordância implícita com “dia”; a tradução explicita o sentido idiomático.
- source_word: ἐποίησε δεῖπνον
  choice: ofereceu um banquete
  rationale: Embora literalmente seja “fez uma refeição”, a construção significa preparar ou oferecer uma refeição festiva; “banquete” preserva o caráter especial sem sugerir necessariamente uma cerimônia religiosa.
- source_word: αὐτοῖς
  choice: lhes
  rationale: Mantém o beneficiário da refeição de modo idiomático e conciso.
