base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/001.yaml
  text: A copy of the testament of Naphtali, the eighth son of Jacob, which he ordained at the time of his departure, in the hundred and thirtieth year of his life.
translation:
  language: pt
  text: Cópia do testamento de Naftali, o oitavo filho de Jacó e de Bila, que ele estabeleceu por ocasião de sua partida, no centésimo trigésimo ano de sua vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: Cópia
  rationale: Reproduz diretamente a ideia de uma cópia ou transcrição de um documento.
- source_word: διαθήκης
  choice: do testamento
  rationale: No contexto da despedida patriarcal, refere-se às disposições finais atribuídas a Naftali.
- source_word: διέθετο
  choice: estabeleceu
  rationale: Expressa de modo natural e formal o ato de dispor ou formular um testamento, sem a conotação eclesiástica que «ordenou» poderia assumir em português.
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: por ocasião de sua partida
  rationale: Mantém o eufemismo do grego, que pode aludir à morte sem explicitá-la.
- source_word: ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ τῆς ζωῆς αὐτοῦ
  choice: no centésimo trigésimo ano de sua vida
  rationale: Preserva a forma ordinal e a contagem de anos do texto grego.
theological_decisions:
- issue: Sentido de «partida»
  choice: Manter «partida» sem explicitar morte
  alternative: «por ocasião de sua morte»
  rationale: O grego ἔξοδος permite uma referência eufemística à morte, mas a formulação escolhida preserva a ambiguidade e a imagem do original.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe documental adequada ao gênero testamentário. A expressão «estabeleceu» evita tanto o arcaísmo quanto possíveis associações indevidas de «ordenou» com ordenação religiosa.
