base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/002.yaml
  text: And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.
translation:
  language: pt
  text: Portanto, vocês também ordenem a seus filhos que se unam a Levi e a Judá. Pois, por meio de Judá[a], a salvação despontará para Israel, e nele[b] Jacó será abençoado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “por meio de Judá” está assinalada como textualmente incerta na edição utilizada.
    reason: O texto-fonte põe τοῦ Ἰούδα entre sinais críticos; a nota informa a incerteza sem omitir a leitura impressa.
  - marker: b
    text: “Nele” provavelmente se refere a Judá; essa expressão também está assinalada como textualmente incerta na edição utilizada.
    reason: O texto-fonte marca αὐτῷ com sinal crítico; o pronome é mantido sem expandir interpretativamente o referente no texto principal.
lexical_decisions:
- source_word: Καὶ ὑμεῖς Γοὖν
  choice: Portanto, vocês também
  rationale: Expressa a transição inferencial e inclui explicitamente os destinatários, sem reproduzir o “behold” da camada inglesa, que não tem apoio claro no texto grego apresentado.
- source_word: ἑνοῦνται
  choice: permaneçam unidos
  rationale: Traduz a ideia de união ou coesão com Levi e Judá em português natural; “permaneçam” comunica a orientação duradoura sugerida pelo presente verbal.
- source_word: ἀνατελεῖ
  choice: despontará
  rationale: Preserva a imagem de algo que nasce, surge ou raía, em vez de reduzi-la ao sentido genérico de “virá”.
- source_word: ἡ σωτηρία
  choice: a salvação
  rationale: Mantém o substantivo teologicamente significativo sem especificar indevidamente se a libertação é política, nacional, espiritual ou escatológica.
- source_word: εὐλογηθήσεται
  choice: será abençoado
  rationale: Reproduz a voz passiva do grego e evita identificar explicitamente o agente da bênção, que não é declarado.
theological_decisions:
- issue: Origem da salvação para Israel
  choice: por meio de Judá
  alternative: por causa de Judá / mediante o descendente de Judá
  rationale: Mantém a formulação instrumental do texto transmitido sem introduzir uma identificação messiânica mais específica do que o grego declara.
- issue: Referente de ἐν αὐτῷ
  choice: nele
  alternative: em Judá
  rationale: Preserva a forma pronominal e a possível tensão quanto ao referente, embora Judá seja o antecedente mais próximo.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A tradução mantém a imagem verbal de “despontar” e sinaliza em notas as duas incertezas textuais indicadas pela edição grega.
