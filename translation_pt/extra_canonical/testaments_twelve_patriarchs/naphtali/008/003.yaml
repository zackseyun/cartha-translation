source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Διὰ¹⁵ †τοῦ σκήπτρου αὐτοῦ¹⁶ ὀφθήσεται ὁ¹⁷ Θεὸς [κατοικῶν ἐν ἀνθρώποις¹⁸] ἐπὶ τῆς γῆς, τοῦ¹⁹ σῶσαι *τὸ γένος τοῦ²⁰ Ἰσραήλ, *καὶ ἐπισυνάξει²¹ δικαίους ἐκ τῶν²² ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/003.yaml
  text: Through his scepter God will appear on the earth, dwelling among men, to save the people of Israel, and he will gather the righteous from among the nations.
translation:
  language: pt
  text: Por meio do seu cetro[a], Deus aparecerá na terra, habitando entre os seres humanos[b], para salvar o povo de Israel; e reunirá os justos dentre as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida por “por meio do seu cetro” apresenta incerteza textual na edição de referência; o referente de “seu” também não é explicitado neste versículo.
    reason: A edição assinala o trecho com marca de dificuldade textual, e a tradução deve preservar a incerteza sem emendar silenciosamente o texto.
  - marker: b
    text: As palavras “habitando entre os seres humanos” aparecem entre colchetes na edição grega, indicando dúvida quanto à sua presença no texto.
    reason: Registra a incerteza textual indicada pelo editor para a oração κατοικῶν ἐν ἀνθρώποις.
lexical_decisions:
- source_word: σκήπτρου
  choice: cetro
  rationale: Mantém a imagem régia concreta do grego e sua possível dimensão messiânica sem explicá-la no corpo do texto.
- source_word: ὀφθήσεται
  choice: aparecerá
  rationale: Expressa naturalmente o futuro passivo de ὁράω com sentido de tornar-se visível ou manifestar-se.
- source_word: γένος
  choice: povo
  rationale: No sintagma γένος τοῦ Ἰσραήλ, “povo de Israel” é português atual e evita as conotações biológicas modernas de “raça”, embora o termo grego também possa indicar linhagem ou descendência.
- source_word: ἐπισυνάξει
  choice: reunirá
  rationale: Conserva a ideia de ajuntar pessoas dispersas sem acrescentar uma interpretação específica sobre o modo ou o lugar dessa reunião.
- source_word: ἐθνῶν
  choice: nações
  rationale: Equivalente tradicional e amplo de ἔθνη neste contexto, preservando a possível referência aos povos não israelitas.
theological_decisions:
- issue: Referente do possessivo em “seu cetro”
  choice: Manter “seu” sem identificar explicitamente o possuidor
  alternative: “o cetro de Deus” ou identificação messiânica explícita
  rationale: O texto grego traz apenas αὐτοῦ, cujo referente depende do contexto anterior; explicitar Deus ou outra figura resolveria uma ambiguidade não resolvida neste versículo.
- issue: Relação entre Deus e sua habitação entre os humanos
  choice: Conservar a afirmação direta “Deus aparecerá... habitando entre os seres humanos”
  alternative: Parafrasear como presença simbólica ou identificar uma doutrina específica de encarnação
  rationale: A tradução mantém a força teológica do texto sem impor uma interpretação denominacional ou cristológica mais específica que o grego.
- issue: Identidade dos “justos dentre as nações”
  choice: Traduzir literalmente, sem equipará-los explicitamente a gentios convertidos ou a outro grupo
  alternative: “os gentios justos” ou “os convertidos das nações”
  rationale: O grego não define aqui a identidade, o status religioso nem o processo pelo qual são considerados justos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Seres humanos” evita que “homens” seja entendido apenas como referência ao sexo masculino. O ponto e vírgula distingue a finalidade de salvar Israel da afirmação coordenada sobre reunir os justos, sem romper a unidade do período.
