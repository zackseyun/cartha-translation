  source_fidelity: 'A tradução segue de perto o grego: Διὰ τοῦ σκήπτρου αὐτοῦ é adequadamente vertido por “Por meio do seu cetro”; ὀφθήσεται por “aparecerá”; κατοικῶν ἐν ἀνθρώποις por “habitando entre os seres humanos”; e os dois desenvolvimentos finais preservam tanto “salvar o povo de Israel” quanto “reunirá os justos dentre as nações”. O possessivo permanece corretamente não identificado. A nota [b] registra de modo apropriado o material entre colchetes, e a nota [a] não oculta a dificuldade editorial assinalada no início da expressão.'
  naturalness: O português é moderno, claro e solene sem ser arcaizante. “Seres humanos” é uma formulação natural e inclusiva para ἀνθρώποις. O ponto e vírgula torna legível a coordenação final e não altera o sentido.
  terminology: “Cetro”, “Deus”, “povo de Israel”, “justos” e “nações” são escolhas fiéis e idiomáticas. “Povo”, em lugar de “raça”, comunica γένος de forma natural no português atual sem introduzir uma conotação biológica indevida.
