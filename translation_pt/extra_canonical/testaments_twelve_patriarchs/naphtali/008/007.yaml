source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ γὰρ⁴⁷ αἱ ἐντολαὶ τοῦ νόμου⁴⁸ διπλαῖ εἰσιν Γκαὶ¹⁴⁹ μετὰ τέχνης πληροῦνται⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/007.yaml
  text: For the commandments of the law are twofold, and they are fulfilled with skill.
translation:
  language: pt
  text: Pois também os mandamentos da Lei são duplos e se cumprem com habilidade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Pois também
  rationale: Conserva tanto o valor explicativo de γάρ quanto a força aditiva de καί, ligando a afirmação ao contexto anterior.
- source_word: αἱ ἐντολαὶ τοῦ νόμου
  choice: os mandamentos da Lei
  rationale: Tradução direta e natural; a inicial maiúscula em «Lei» indica o corpo legal referido, sem acrescentar uma identificação denominacional.
- source_word: διπλαῖ
  choice: duplos
  rationale: Mantém a formulação compacta e a possível ambiguidade do grego entre caráter duplo, divisão em dois e dupla dimensão.
- source_word: μετὰ τέχνης
  choice: com habilidade
  rationale: Expressa o sentido de realização hábil, criteriosa ou dotada de arte, sem sugerir artificialidade ou engano.
- source_word: πληροῦνται
  choice: se cumprem
  rationale: Preserva a voz passiva e o campo semântico de cumprir ou levar à plena realização.
theological_decisions:
- issue: Sentido da natureza dupla dos mandamentos
  choice: são duplos
  alternative: têm dois aspectos
  rationale: O texto não explica em que consiste a duplicidade; a tradução conserva essa tensão em vez de impor uma interpretação.
- issue: Agente do cumprimento
  choice: se cumprem
  alternative: nós os cumprimos
  rationale: A forma grega é passiva e não identifica explicitamente o agente; evitou-se introduzir um sujeito humano ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem rigidez artificial. «Habilidade» é corrente e preserva a ideia de τέχνη neste contexto.
