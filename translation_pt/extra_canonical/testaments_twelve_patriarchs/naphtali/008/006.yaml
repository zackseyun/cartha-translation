review_pass:
  verdict: revise
  source_fidelity: A sequência e o sentido geral são bem preservados. Contudo, διʼ αὐτοῦ é mais precisamente «por meio dele» do que «por causa dele». Além disso, o grego atribui explicitamente a maldição aos anjos e aos seres humanos; a forma ativa conserva melhor essa estrutura. «Vaso» reproduz σκεῦος sem especificar antecipadamente a função metafórica como «instrumento».
  naturalness: O português proposto é claro e de registro apropriado. A coordenação com ponto e vírgula mantém adequadamente a solenidade e a progressão das consequências.
  terminology: «Pratica o bem», «seres humanos», «nações», «Diabo» e «Senhor» são escolhas adequadas. «Vaso» é preferível a «instrumento» neste ponto por ser mais lexicalmente próximo de σκεῦος e por preservar a imagem aberta do original.
  issues:
  - severity: medium
    issue: «por causa dele» para διʼ αὐτοῦ
    rationale: A preposição διά com genitivo indica mediação («por meio dele»), não meramente causalidade. A formulação revista preserva essa relação.
  - severity: low
    issue: Construção passiva em «será amaldiçoado»
    rationale: Não é incorreta, mas «os anjos e os seres humanos o amaldiçoarão» mantém explícitos os agentes, como no grego.
  - severity: low
    issue: «instrumento» para σκεῦος
    rationale: «Instrumento» explicita uma função possível da metáfora; «vaso» conserva a imagem e a ambiguidade do termo grego.
  revised_text: Mas aquele que não pratica o bem, os anjos e os seres humanos o amaldiçoarão; Deus será desonrado entre as nações por meio dele; o Diabo o toma para si como seu próprio vaso; toda fera o dominará; e o Senhor o odiará.
