- from: Mas aquele que não pratica o bem será amaldiçoado tanto pelos anjos como pelos seres humanos; Deus será desonrado entre as nações por causa dele; o Diabo se apropria dele como seu próprio instrumento; todo animal selvagem o dominará; e o Senhor o odiará.
  to: Mas aquele que não pratica o bem, os anjos e os seres humanos o amaldiçoarão; Deus será desonrado entre as nações por meio dele; o Diabo o toma para si como seu próprio vaso; toda fera o dominará; e o Senhor o odiará.
