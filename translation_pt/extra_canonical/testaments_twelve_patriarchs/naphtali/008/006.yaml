source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴², *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/006.yaml
  text: But the one who does not do good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.
translation:
  language: pt
  text: Mas aquele que não pratica o bem, os anjos e os seres humanos o amaldiçoarão; Deus será desonrado entre as nações por meio dele; o Diabo o toma para si como seu próprio vaso; toda fera o dominará; e o Senhor o odiará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιοῦντα τὸ καλόν
  choice: pratica o bem
  rationale: Expressa de modo natural e conciso a ideia grega de fazer o que é bom, mantendo o caráter habitual sugerido pelo particípio presente.
- source_word: οἱ ἄνθρωποι
  choice: os seres humanos
  rationale: Traduz ἄνθρωποι de forma inclusiva e semanticamente precisa, sem restringir a referência aos homens do sexo masculino.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: Conserva a formulação coletiva do grego e sua possível referência aos povos não judeus sem explicitar além do texto.
- source_word: οἰκειοῦται
  choice: se apropria dele
  rationale: Comunica a ideia de tomar alguém para si ou reivindicá-lo como pertencente à própria esfera.
- source_word: σκεῦος
  choice: instrumento
  rationale: Neste contexto, o termo designa algo colocado a serviço de um agente; 'instrumento' transmite a função da metáfora em português atual com mais naturalidade do que 'vaso'.
- source_word: πᾶν θηρίον κατακυριεύσει αὐτῷ
  choice: todo animal selvagem o dominará
  rationale: Reproduz a ideia de cada fera exercer domínio sobre ele, em construção portuguesa clara e direta.
theological_decisions:
- issue: Deus ser desonrado por meio da conduta humana
  choice: Deus será desonrado entre as nações por causa dele
  alternative: Deus perderá a glória entre as nações por meio dele
  rationale: A escolha preserva o sentido passivo/contextual de ἀδοξήσει e deixa claro que a pessoa é a causa da desonra pública, sem sugerir que a glória intrínseca de Deus diminui.
- issue: A afirmação de que o Senhor odiará o malfeitor
  choice: o Senhor o odiará
  alternative: o Senhor o rejeitará
  rationale: Mantém sem atenuação a linguagem forte de μισήσει e não resolve a tensão teológica mediante uma paráfrase interpretativa.
- issue: A relação do Diabo com o malfeitor
  choice: o Diabo se apropria dele como seu próprio instrumento
  alternative: o Diabo o reivindica como seu próprio vaso
  rationale: Preserva a ideia de posse e utilização expressa no grego, sem acrescentar uma doutrina específica sobre o modo ou a permanência dessa relação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência solene de consequências foi preservada por meio de orações coordenadas separadas por ponto e vírgula. Empregou-se 'Diabo' como título pessoal e 'Senhor' conforme o uso religioso corrente.
