  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/004.yaml
  text: Therefore, if you also do what is good, people and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.
translation:
  language: pt
  text: Portanto, se vocês também praticarem o bem, as pessoas e os anjos abençoarão vocês; Deus será glorificado entre as nações por meio de vocês, o diabo fugirá de vocês, as feras terão medo de vocês, o Senhor amará vocês, e os anjos ampararão vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase final, “e os anjos ampararão vocês”, aparece entre colchetes na edição grega, indicando incerteza textual. A expressão também pode ser traduzida como “e os anjos ficarão ao lado de vocês”.
    reason: Sinaliza a incerteza editorial da cláusula entre colchetes e informa uma alternativa semântica viável para ἀνθέξονται ὑμῶν.
lexical_decisions:
- source_word: ἐργάσησθε τὸ καλόν
  choice: praticarem o bem
  rationale: Expressa de modo natural a ação contínua de fazer aquilo que é bom, sem reduzir a frase a uma obra específica.
- source_word: οἱ ἄνθρωποι
  choice: as pessoas
  rationale: Traduz o plural genérico com linguagem atual e inclusiva.
- source_word: τὰ θηρία
  choice: os animais selvagens
  rationale: Comunica claramente o sentido de feras ou animais não domesticados em português corrente.
- source_word: ἀνθέξονται ὑμῶν
  choice: os ampararão
  rationale: O verbo com genitivo pode indicar apegar-se a alguém, sustentá-lo ou ficar ao seu lado; “ampararão” preserva a ideia de apoio ativo em português natural.
theological_decisions:
- issue: Relação entre a boa conduta, a glorificação de Deus e as bênçãos descritas
  choice: Preservar a sequência condicional do grego sem explicar sua natureza teológica
  alternative: Interpretar explicitamente as consequências como recompensa meritória, promessa absoluta ou simples resultado provável
  rationale: O texto apresenta essas consequências de forma direta, mas não define aqui a relação doutrinária precisa entre conduta, mérito e favor divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural e mantém paralelismo claro entre as consequências da prática do bem.
