  source_fidelity: A tradução transmite com precisão o imperativo Γίνεσθε, a dupla exortação σοφοὶ... καὶ φρόνιμοι, a expressão deliberadamente aberta «em Deus», e a finalidade expressa por ὅπως. «Discernindo» comunica adequadamente o valor cognitivo de ἰδόντες, sem introduzir conteúdo alheio.
