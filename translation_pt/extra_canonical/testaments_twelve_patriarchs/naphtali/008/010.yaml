  terminology: «Mandamentos» para ἐντολῶν e «preceitos» para θεσμούς preservam uma distinção lexical útil. «Prudentes» é equivalente apropriado de φρόνιμοι. A expressão «para que o Senhor os ame» mantém a voz ativa e a tensão textual sem interpretação doutrinária.
