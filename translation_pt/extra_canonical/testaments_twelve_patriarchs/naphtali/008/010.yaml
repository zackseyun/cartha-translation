source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. Γίνεσθε οὖν *σοφοὶ ἐν θεῷ, τέκνα μου⁶¹, καὶ φρόνιμοι, ἰδόντες⁶² τάξιν ἐντολῶν⁶³ αὐτοῦ⁶⁴ καὶ θεσμοὺς παντὸς πράγματος⁶⁵, ὅπως *ἀγαπήσει ὑμᾶς ὁ Κύριος⁶⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/010.yaml
  text: Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter, so that the Lord may love you.
translation:
  language: pt
  text: Portanto, tornem-se sábios em Deus, meus filhos, e prudentes, discernindo a ordem dos seus mandamentos e os preceitos de cada assunto, para que o Senhor os ame.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γίνεσθε
  choice: tornem-se
  rationale: Preserva o imperativo presente e a ideia de passar a ser ou crescer nessa condição.
- source_word: σοφοὶ ἐν θεῷ
  choice: sábios em Deus
  rationale: Mantém a formulação incomum e teologicamente aberta do grego, sem reduzi-la a 'segundo Deus' ou 'diante de Deus'.
- source_word: φρόνιμοι
  choice: prudentes
  rationale: Expressa sensatez e discernimento prático, em paralelo com 'sábios'.
- source_word: ἰδόντες
  choice: discernindo
  rationale: O particípio de ὁράω tem aqui sentido cognitivo de perceber ou reconhecer; 'discernindo' liga naturalmente essa percepção à prudência.
- source_word: τάξιν
  choice: ordem
  rationale: Conserva a noção de arranjo, ordenação ou estrutura presente no termo grego.
- source_word: θεσμοὺς
  choice: preceitos
  rationale: Comunica normas estabelecidas sem confundi-las lexicalmente com os 'mandamentos' mencionados imediatamente antes.
- source_word: παντὸς πράγματος
  choice: de cada assunto
  rationale: Representa a abrangência distributiva da expressão e produz português natural, sem definir de modo excessivo se πράγμα se refere a ação, questão ou realidade.
- source_word: ὅπως ἀγαπήσει ὑμᾶς ὁ Κύριος
  choice: para que o Senhor os ame
  rationale: Preserva a construção final e o valor prospectivo do verbo, sem reformular a relação teológica expressa pelo texto.
theological_decisions:
- issue: Sabedoria 'em Deus'
  choice: sábios em Deus
  alternative: sábios segundo Deus
  rationale: A opção escolhida preserva diretamente ἐν θεῷ e sua possível densidade relacional, sem resolver a expressão como simples conformidade com um padrão divino.
- issue: Finalidade expressa em 'para que o Senhor os ame'
  choice: para que o Senhor os ame
  alternative: para que vocês sejam amados pelo Senhor
  rationale: Mantém a voz ativa e a ligação explícita entre a exortação e o amor do Senhor, sem atenuar uma tensão teológica genuína do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de terceira pessoa do plural usuais no Brasil. A redação permanece próxima da sintaxe e das imagens conceituais gregas, mas evita rigidez desnecessária.
