  text: 5. *Ὡς ἄν τις³¹ τέκνου³² †ἐκθρέψῃ³³ καλῶς³⁴ μνείαν ἔχει καλήν³⁵, οὕτως³⁶ καὶ *ἐπὶ τοῦ καλοῦ ἔργου μνήμη παρὰ Θεοῦ ἀγαθή³⁷.
