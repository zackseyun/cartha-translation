  terminology: «Criar bem um filho» é adequado para ἐκθρέψῃ καλῶς. Convém conservar «boa lembrança» nos dois membros, refletindo o paralelismo μνεία/μνήμη e o adjetivo καλός/ἀγαθή, sem explicitar uma noção técnica de recompensa.
