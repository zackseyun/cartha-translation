base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/005.yaml
  text: As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.
translation:
  language: pt
  text: Assim como quem cria bem um filho guarda uma boa lembrança dele, também há, da parte de Deus, boa lembrança de uma boa obra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκθρέψῃ καλῶς
  choice: cria bem
  rationale: Expressa de modo natural o ato de nutrir e educar uma criança até que cresça, preservando o valor do verbo grego e do advérbio.
- source_word: μνείαν ἔχει καλήν
  choice: guarda uma boa lembrança dele
  rationale: Mantém a imagem da lembrança positiva ligada ao filho; o pronome «dele» explicita em português o referente implícito no contexto.
- source_word: ἐπὶ τοῦ καλοῦ ἔργου
  choice: uma boa obra
  rationale: Reproduz de forma clara e corrente a referência ao ato moralmente bom.
- source_word: μνήμη παρὰ Θεοῦ ἀγαθή
  choice: recebe de Deus uma lembrança favorável
  rationale: «De Deus» traduz παρὰ Θεοῦ sem impor a leitura espacial de «diante de Deus»; «favorável» comunica que essa memória implica aprovação.
theological_decisions:
- issue: Sentido de παρὰ Θεοῦ
  choice: de Deus
  alternative: diante de Deus
  rationale: A preposição pode indicar procedência ou esfera junto a Deus. «De Deus» acompanha mais diretamente a construção grega e conserva a ideia de reconhecimento divino, sem desenvolver uma doutrina específica de mérito.
- issue: Relação entre a boa obra e a memória divina
  choice: recebe de Deus uma lembrança favorável
  alternative: há uma boa lembrança diante de Deus
  rationale: A formulação naturaliza a frase em português, mas não define em que consiste a lembrança nem transforma o dito em uma afirmação técnica sobre recompensa ou salvação.
translation_notes:
  register: Português atual, digno e acessível, com construção proverbial paralela. Evitou-se «criar um filho corretamente», mais rígido, e «memorial», que teria tom técnico ou cultual ausente no contexto.
