source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/009.yaml
  text: And both are from God, and if they do not occur in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.
translation:
  language: pt
  text: 9 E ambas são de Deus; se não ocorrem na ordem que lhes é própria, acarretam aos seres humanos um pecado gravíssimo. O mesmo se aplica também aos demais mandamentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο τοῦ Θεοῦ εἰσι
  choice: ambas são de Deus
  rationale: Mantém a formulação concisa e a possível amplitude do genitivo grego, sem decidir desnecessariamente entre origem, pertença ou aprovação divina.
- source_word: ἐν τῇ τάξει αὐτῶν
  choice: na ordem que lhes é própria
  rationale: Expressa com naturalidade a ideia de cada uma ocupar ou ocorrer na ordem que lhe corresponde.
- source_word: ἁμαρτίαν μεγίστην παρεῖχον
  choice: acarretam aos seres humanos um pecado gravíssimo
  rationale: Reproduz a força superlativa de μεγίστην e o sentido causativo de παρεῖχον em português atual e digno.
- source_word: ἐπὶ τῶν λοιπῶν ἐντολῶν
  choice: aos demais mandamentos
  rationale: Na expressão 'o mesmo se aplica', a preposição portuguesa 'a' comunica naturalmente a extensão do princípio às outras prescrições.
theological_decisions:
- issue: Relação das duas realidades mencionadas com Deus
  choice: são de Deus
  alternative: procedem de Deus
  rationale: A opção escolhida preserva a ambiguidade do genitivo τοῦ Θεοῦ e evita afirmar exclusivamente uma relação de origem.
- issue: Causalidade do pecado
  choice: acarretam aos seres humanos um pecado gravíssimo
  alternative: fazem os seres humanos cometer um pecado gravíssimo
  rationale: A tradução não transforma a frase em uma afirmação explícita de coerção moral; conserva a formulação mais ampla do grego sobre a produção ou ocasionamento do pecado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação e a repetição conceitual do grego foram preservadas sem rigidez excessiva.
