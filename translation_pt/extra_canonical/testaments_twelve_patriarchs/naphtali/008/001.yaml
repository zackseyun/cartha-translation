source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VIII. Καὶ¹ ἰδού², τέκνα μου³, ὑπέδειξα ὑμῖν καιροὺς ἐσχάτους †ὅτι⁴ πάντα γενήσεται ἐν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/001.yaml
  text: And behold, my children, I have shown you the times, that all will happen in Israel.
translation:
  language: pt
  text: 'E vejam, meus filhos, eu lhes mostrei os tempos finais[a]: tudo acontecerá em Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego é incerto na ligação entre “os tempos finais” e a oração seguinte; também pode ser entendido como “pois tudo acontecerá em Israel” ou “que tudo acontecerá em Israel”.
    reason: A edição marca ὅτι como ponto textual problemático, e sua função sintática admite mais de uma leitura.
lexical_decisions:
- source_word: ἰδού
  choice: vejam
  rationale: Equivalente natural e atual da fórmula de chamada de atenção, preservando sua força sem o arcaísmo de “eis”.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Reproduz diretamente a forma de tratamento familiar.
- source_word: ὑπέδειξα
  choice: mostrei
  rationale: Expressa de modo claro o sentido de indicar ou dar a conhecer.
- source_word: καιροὺς ἐσχάτους
  choice: os tempos finais
  rationale: Preserva o qualificativo escatológico ἐσχάτους, ausente na redação inglesa de consulta.
- source_word: πάντα γενήσεται
  choice: tudo acontecerá
  rationale: Mantém πάντα sem acrescentar “estas coisas” e traduz naturalmente o futuro de γίνομαι neste contexto.
- source_word: ἐν Ἰσραήλ
  choice: em Israel
  rationale: Mantém a formulação abrangente do grego sem especificar se Israel designa povo, território ou comunidade.
theological_decisions:
- issue: Relação sintática introduzida por ὅτι
  choice: Dois-pontos antes de “tudo acontecerá em Israel”
  alternative: “pois tudo acontecerá em Israel” ou “que tudo acontecerá em Israel”
  rationale: O texto assinala incerteza nesse ponto, e ὅτι pode ser entendido como explicativo, causal ou introdutor de conteúdo. Os dois-pontos preservam a ligação explicativa sem impor uma dessas análises.
- issue: Sentido de “Israel”
  choice: Manter simplesmente “Israel”
  alternative: Explicitar “o povo de Israel” ou “a terra de Israel”
  rationale: O grego não resolve essa referência; a tradução conserva a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Vejam” evita o tom arcaico de “eis”; “tempos finais” conserva explicitamente o elemento escatológico do original.
