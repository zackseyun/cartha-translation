source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/008.yaml
  text: For there is a time for a man to come together with a woman, and a time for self-control for his prayer.
translation:
  language: pt
  text: Pois há tempo para um homem ter relações com uma mulher e tempo para exercer domínio próprio para a sua oração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνουσίας γυναικός
  choice: unir-se a uma mulher
  rationale: A expressão grega indica união ou relações íntimas com uma mulher. A formulação verbal é natural em português e mantém o caráter discreto do original.
- source_word: ἐγκρατείας
  choice: exercer domínio próprio
  rationale: Traduz a ideia de autocontrole ou continência sem restringi-la explicitamente à abstinência sexual, embora o contraste contextual permita essa compreensão.
- source_word: εἰς προσευχὴν αὐτοῦ
  choice: para a sua oração
  rationale: Conserva tanto a orientação para a oração expressa por εἰς quanto o pronome αὐτοῦ, sem acrescentar uma explicação ausente no grego.
theological_decisions:
- issue: Relação entre domínio próprio e oração
  choice: 'Manter a formulação concisa do grego: “exercer domínio próprio para a sua oração”.'
  alternative: Explicitar “abster-se de relações para dedicar-se à oração”.
  rationale: A alternativa esclareceria o contraste, mas resolveria de modo excessivo o alcance de ἐγκράτεια e acrescentaria ideias não expressas diretamente no texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A construção “unir-se a uma mulher” preserva o eufemismo sexual do original; “domínio próprio” mantém a amplitude lexical de ἐγκράτεια.
