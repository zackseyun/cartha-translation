  naturalness: 'O português é moderno, claro e de registro apropriado. Pequenos ajustes tornam a formulação mais fiel e igualmente natural: "foram criados", "obscurecendo a própria mente, afastando-a da verdade" e uma pontuação mais direta na autodesignação de Rúben.'
  terminology: '"Espírito", "erro", "imoralidade sexual", "feitiçaria", "injustiça" e "fantasia" são escolhas adequadas e não impõem uma leitura confessional. "Atos de ganância" para o termo difícil γρηπίσματα é uma solução prudente, desde que a nota preserve a incerteza contextual relevante.'
