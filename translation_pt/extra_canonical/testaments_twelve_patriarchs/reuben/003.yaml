base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003.yaml
  text: 'And besides all these, there is an eighth spirit, the spirit of sleep, with which are created the trance of nature and the image of death.


    With these spirits are mixed the spirits of error. First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of insatiableness of the belly. Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive. Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood in destruction and jealousy, for shaping words and hiding one’s words from one’s own kin and household. Seventh, a spirit of injustice, with which come thefts and acts of greed, so that it may satisfy the pleasures of his heart. For injustice works together with the other spirits through taking and giving.


    And over all these the spirit of sleep is joined, which is the eighth spirit of error and fantasy. And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.


    And now, my children, love the truth, and it will keep you safe. Hear the words of Reuben your father, as I teach you. Do not pay attention to a woman’s appearance, nor keep company with a married woman, nor pry into the affairs of women.'
translation:
  language: pt
  text: 'Além de todos esses, há um oitavo espírito: o espírito do sono, com o qual foram criados o êxtase da natureza e a imagem da morte.


    A esses espíritos misturam-se os espíritos do erro. Primeiro, o espírito da imoralidade sexual está alojado na natureza e nos sentidos. Segundo, o espírito da insaciabilidade do ventre. Terceiro, o espírito da contenda, no fígado e na bile. Quarto, o espírito da ostentação e da feitiçaria, para que, por meio de intromissões excessivas, alguém pareça atraente. Quinto, o espírito do orgulho, para que a pessoa se vanglorie e tenha pensamentos grandiosos. Sexto, o espírito da falsidade, em meio à ruína e ao ciúme, para inventar palavras e ocultar suas palavras de sua família e dos de sua casa.[a] Sétimo, o espírito da injustiça, com o qual vêm roubos e atos de ganância, a fim de satisfazer o prazer de seu coração. Pois a injustiça coopera com os outros espíritos por meio do dar e receber.


    E, acima de todos esses, une-se o espírito do sono, que é o oitavo espírito do erro e da fantasia. E assim todo jovem se perde, obscurecendo a própria mente e afastando-a da verdade, não compreendendo a lei de Deus nem ouvindo a instrução de seus pais, assim como eu também sofri na juventude.


    E agora, meus filhos, amem a verdade, e ela os guardará. Ouçam as palavras de Rúben, seu pai; eu os ensino. Não fixem a atenção na aparência de uma mulher, não mantenham intimidade com uma mulher casada nem se intrometam nos assuntos das mulheres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “em meio à ruína e ao ciúme” está textualmente corrompida ou incerta na edição grega. A construção completa referente a inventar palavras e ocultá-las também é incerta.
    reason: As cruzes críticas da edição assinalam corrupção ou incerteza textual; a nota informa isso sem apresentar como seguro o sentido reconstruído.
lexical_decisions:
- source_word: ἔκστασις φύσεως
  choice: êxtase da natureza
  rationale: Preserva a formulação incomum e a possível ideia de suspensão ou deslocamento natural sem reduzi-la simplesmente a 'inconsciência'.
- source_word: τῆς πλάνης
  choice: do erro
  rationale: Mantém a amplitude de πλάνη, que pode envolver erro, desvio ou engano, sem impor uma personificação adicional.
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Expressão moderna e abrangente para conduta sexual ilícita, sem limitar o termo à prostituição.
- source_word: ἀπληστείας γαστρός
  choice: insaciabilidade do ventre
  rationale: Conserva a imagem corporal e o sentido de apetite desmedido.
- source_word: μάχης
  choice: contenda
  rationale: Abrange luta, conflito e disposição para brigar em português natural.
- source_word: ἀρεσκείας
  choice: ostentação
  rationale: No contexto de querer parecer atraente, comunica a busca de aprovação e exibição de si.
- source_word: μαγγανείας
  choice: feitiçaria
  rationale: Equivalente claro para práticas mágicas ou encantamentos.
- source_word: περιεργείας
  choice: intromissões excessivas
  rationale: Preserva a ideia de atividade indevida, excessiva ou indiscreta; a forma plural torna a frase natural.
- source_word: μεγαλοφρονῇ
  choice: tenha pensamentos grandiosos
  rationale: Reproduz a metáfora mental do grego sem interpretar o termo apenas como arrogância.
- source_word: γρηπίσματα
  choice: atos de ganância
  rationale: O vocábulo transmitido é difícil; a escolha segue o provável campo semântico de apropriação cobiçosa em paralelo com roubos.
- source_word: δοσοληψίας
  choice: dar e receber
  rationale: Tradução direta da reciprocidade comercial ou transacional expressa pelo composto.
- source_word: φαντασίας
  choice: fantasia
  rationale: Mantém o termo imagético e sua possível conotação de ilusão, sem resolver a ambiguidade.
- source_word: ὑπάνδρου
  choice: casada
  rationale: Sentido idiomático de mulher que tem marido.
- source_word: συνδιάζετε
  choice: mantenham intimidade
  rationale: Expressa associação próxima ou convivência, sem afirmar explicitamente uma relação sexual que o verbo não exige por si só.
- source_word: περιεργάζεσθε
  choice: se intrometam
  rationale: Comunica a curiosidade e ingerência indevidas presentes no verbo.
theological_decisions:
- issue: Natureza dos 'espíritos'
  choice: Manter repetidamente 'espírito' sem defini-los como demônios, faculdades ou disposições psicológicas.
  alternative: Interpretar cada espírito como demônio ou como vício abstrato.
  rationale: O texto não resolve de modo uniforme a ontologia desses espíritos; a tradução conserva essa tensão.
- issue: Tempo verbal de ἐκτίσθη
  choice: “são criados”
  alternative: “foram criados”
  rationale: Embora a forma grega seja aorista passiva, a tradição textual e o contexto descritivo admitem uma formulação gnômica; a escolha segue a leitura auditada sem transformar a frase em uma afirmação cosmológica mais rígida.
- issue: Lei de Deus e instrução ancestral
  choice: Traduzir literalmente sem harmonização com um corpus canônico específico.
  alternative: Identificar a lei com uma formulação denominacional ou mosaica mais explícita.
  rationale: O texto menciona a lei de Deus e a instrução dos pais sem explicitar uma delimitação doutrinária.
- issue: Agente de 'obscurecendo' em 3.8
  choice: 'Manter o jovem como sujeito: “obscurecendo a própria mente”.'
  alternative: Fazer do espírito do sono o sujeito explícito.
  rationale: A sintaxe permite tensão na referência; a continuidade imediata com “todo jovem” favorece o sujeito humano, sem negar a atuação dos espíritos no contexto.
- issue: Promessa ligada à verdade
  choice: “ela os guardará”
  alternative: “ela os salvará”
  rationale: φυλάξει indica guardar ou proteger; “guardará” evita atribuir ao enunciado uma soteriologia técnica não explicitada.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se imagens antigas como “ventre”, “fígado e bile” e “imagem da morte” por sua função retórica e antropológica. Evitaram-se explicações denominacionais e suavizações moralizantes além do que o grego sustenta.
