  text: And the one whom they are not able to enchant by appearance, him they overcome through deceit.
translation:
  language: pt
  text: E aquele a quem não conseguem enfeitiçar pela aparência, vencem por meio do engano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχήματος
  choice: aparência
  rationale: Neste contexto, designa o aspecto exterior ou a forma visível usada como meio de sedução; “aparência” é natural e preserva o sentido amplo do grego.
- source_word: οὐκ ἰσχύουσιν
  choice: não conseguem
  rationale: Expressa de modo corrente a falta de capacidade indicada pelo verbo, sem introduzir uma ênfase desnecessária em força física.
- source_word: καταγοητεῦσασθαι
  choice: enfeitiçar
  rationale: Mantém a imagem forte de exercer fascínio ou encantamento sobre alguém, presente no verbo grego.
- source_word: ἀπάτης
  choice: engano
  rationale: Reproduz diretamente a ideia de fraude ou ardil, sem especificar um tipo de engano não indicado no texto.
- source_word: καταγωνίζονται
  choice: vencem
  rationale: Transmite o sentido de subjugar ou superar alguém em confronto, com linguagem clara e digna.
