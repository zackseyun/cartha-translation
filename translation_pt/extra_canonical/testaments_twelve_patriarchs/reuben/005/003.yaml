  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/003.yaml
  text: For an angel of God also told me and taught me concerning them that women are overcome by the spirit of sexual immorality more than men, and in their hearts they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive.
translation:
  language: pt
  text: Pois um anjo de Deus também me falou a respeito delas e me ensinou que as mulheres são vencidas pelo espírito da imoralidade sexual mais do que os homens. Em seu coração, elas tramam contra os homens; por meio dos adornos, desencaminham-lhes as mentes; pelo olhar, primeiro semeiam o veneno e, depois, pelo ato, fazem deles prisioneiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ πνεύματι τῆς πορνείας
  choice: pelo espírito da imoralidade sexual
  rationale: Mantém a personificação ou força espiritual expressa por πνεῦμα e traduz πορνεία de modo atual e abrangente, sem restringi-la indevidamente.
- source_word: ὑπὲρ τὸν ἄνδρα
  choice: mais do que os homens
  rationale: O singular grego tem valor genérico na comparação; o plural é mais natural em português e conserva o contraste entre mulheres e homens.
- source_word: διὰ τῆς κοσμήσεως
  choice: por meio dos adornos
  rationale: κοσμήσεως refere-se ao ato ou meio de adornar-se; “adornos” comunica isso com clareza sem introduzir uma avaliação além do texto.
- source_word: τὸν ἰὸν
  choice: o veneno
  rationale: ἰός significa “veneno” ou “peçonha”; “veneno” preserva a metáfora e soa natural no contexto.
- source_word: τῷ ἔργῳ
  choice: por seus atos
  rationale: O singular coletivo ἔργον contrasta o olhar inicial com a ação efetiva; o plural idiomático evita a expressão pouco natural “pelo ato”.
- source_word: αἰχμαλωτίζουσιν
  choice: fazem deles prisioneiros
  rationale: Reproduz a imagem forte de capturar ou levar cativo, em vez de reduzi-la simplesmente a “seduzem”.
theological_decisions:
- issue: Natureza do “espírito da imoralidade sexual”
  choice: Conservar a expressão literalmente personificada
  alternative: Traduzir como mera inclinação ou desejo sexual
  rationale: O texto pode aludir a uma entidade espiritual ou a uma força moral personificada; a tradução não deve resolver essa ambiguidade.
- issue: Sequência entre olhar, veneno e ação
  choice: “pelo olhar, primeiro semeiam o veneno e, depois, por seus atos...”
  alternative: “primeiro em pensamento e depois pelo ato”
  rationale: O grego fornecido liga πρῶτον naturalmente ao semear pelo olhar e não contém um termo explícito para “pensamento”; a formulação escolhida segue a evidência grega direta.
translation_notes:
  register: Português moderno, digno e legível, com estrutura um pouco solene adequada a um testamento antigo. “Desencaminham-lhes a mente” mantém claro que o alvo são os homens, conforme o contexto, e evita uma formulação excessivamente coloquial.
