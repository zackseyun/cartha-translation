  text: For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him.
translation:
  language: pt
  text: Pois uma mulher não é capaz de forçar um homem abertamente; em vez disso, ela o engana astutamente por meio de artifícios de prostituta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πρόσωπον
  choice: abertamente
  rationale: A expressão significa literalmente «diante do rosto», mas, neste contexto, indica ação direta ou às claras; «abertamente» comunica isso com naturalidade.
- source_word: ἐν σχήματι πορνικοῖς
  choice: com modos de prostituta
  rationale: Apesar da forma textual irregular, o sentido é um comportamento ou aparência de caráter sexualmente imoral. A formulação preserva a imagem social forte do grego sem a tornar mais explícita.
- source_word: πανουργεύεται
  choice: age com astúcia contra ele
  rationale: O verbo denota agir ardilosamente ou recorrer a artifícios. «Contra ele» representa o objeto τοῦτον e mantém a orientação adversativa da ação.
