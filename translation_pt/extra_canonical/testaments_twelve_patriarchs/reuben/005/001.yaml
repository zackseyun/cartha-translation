  source_fidelity: O texto mantém corretamente a generalização dura de Πονηραί, a relação causal introduzida por γάρ, a distinção entre «autoridade» e «poder» e o artigo em «o homem». Contudo, «agem com astúcia» enfraquece δολιεύονται, que descreve uma ação de tramar/agir de modo enganoso; além disso, o plural ἐν σχήμασιν é mais bem refletido por «suas aparências».
  naturalness: A redação é clara e de registro apropriado. «Tramam por meio de suas aparências» preserva melhor o verbo e o instrumental do grego, permanecendo natural em português moderno.
