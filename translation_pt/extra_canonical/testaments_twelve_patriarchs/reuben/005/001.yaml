base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/001.yaml
  text: For women are evil, my children; and because they have no authority or power over the man, they scheme by their appearance how they may draw him to themselves.
translation:
  language: pt
  text: Pois as mulheres são más, meus filhos; e, por não terem autoridade nem poder sobre o homem, tramam por meio de suas aparências, a fim de atraí-lo para si.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πονηραί
  choice: más
  rationale: Mantém de forma direta o juízo moral forte do grego, sem atenuá-lo nem ampliá-lo.
- source_word: ἐξουσίαν ἢ δύναμιν
  choice: autoridade nem poder
  rationale: Preserva os dois substantivos distintos; em português, a coordenação negativa natural exige «nem» depois de «não terem».
- source_word: ἐπὶ τὸν ἄνδρα
  choice: sobre o homem
  rationale: Conserva o artigo definido do grego e a relação expressa por ἐπί, sem substituir por uma generalização indefinida.
- source_word: δολιεύονται
  choice: agem com astúcia
  rationale: Expressa a ação ardilosa ou enganosa do verbo de modo idiomático, sem acrescentar um plano específico não declarado no texto.
- source_word: ἐν σχήμασιν
  choice: por meio de sua aparência
  rationale: No contexto, σχήματα aponta para formas exteriores ou aparência; a expressão preserva o sentido instrumental e soa natural em português.
- source_word: πρὸς ἑαυτὰς ἐπισπάσωνται
  choice: atraí-lo para si
  rationale: Reproduz o movimento em direção às próprias mulheres e mantém a referência reflexiva coletiva em formulação portuguesa corrente.
theological_decisions:
- issue: Caráter absoluto da afirmação sobre as mulheres
  choice: Traduzir literalmente «as mulheres são más»
  alternative: Atenuar para «as mulheres podem ser más» ou restringir explicitamente a certas mulheres
  rationale: O texto grego apresenta uma afirmação geral e forte. Embora seja moralmente tensa para leitores modernos, a tradução não deve corrigir nem suavizar silenciosamente a perspectiva do autor.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ordem foi levemente naturalizada, mas a força retórica, a generalização e os pares lexicais do original foram preservados.
