    rationale: Embora o singular genérico seja possível em português, «suas aparências» conserva a pluralidade das formas/aparências empregadas no grego e se alinha ao sentido instrumental.
  revised_text: Pois as mulheres são más, meus filhos; e, por não terem autoridade nem poder sobre o homem, tramam por meio de suas aparências, a fim de atraí-lo para si.
