base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/006.yaml
  text: For in this way they also enticed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were transforming themselves into the form of men and appearing to them while their husbands were with them.
translation:
  language: pt
  text: 'Pois foi assim que elas seduziram os Vigilantes[a] antes do dilúvio: eles as contemplavam continuamente, passaram também a desejá-las e conceberam o ato em sua mente. Pois se transformavam em homens e apareciam a elas durante a união delas com seus maridos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vigilantes” é um título dado a seres celestes em antigas tradições judaicas relacionadas ao período anterior ao dilúvio.
    reason: Esclarece um termo técnico pouco conhecido sem inserir a identificação mais específica no texto principal.
lexical_decisions:
- source_word: ἔθελξαν
  choice: seduziram
  rationale: Expressa atração persuasiva e moralmente carregada sem recorrer ao sentido mais mágico de “enfeitiçaram”.
- source_word: Ἐγρηγόρους
  choice: Vigilantes
  rationale: Mantém o título tradicional dos seres celestes conhecidos na literatura enoquita, em vez de reduzi-lo simplesmente a “anjos”.
- source_word: συνεχῶς ὁρῶντες
  choice: contemplavam continuamente
  rationale: Preserva tanto a ação visual prolongada quanto o aspecto contínuo do grego.
- source_word: ἐν ἐπιθυμίᾳ αὐτῶν
  choice: a desejá-las
  rationale: Transmite de modo natural o desejo dirigido às mulheres; no contexto, a conotação sexual permanece clara.
- source_word: συνέλαβον τῇ διανοίᾳ τὴν πρᾶξιν
  choice: conceberam o ato em sua mente
  rationale: Conserva a imagem de conceber mentalmente a ação, sem especificar além do texto qual ato foi planejado.
- source_word: μετεσχηματίζοντο εἰς ἄνδρα
  choice: se transformavam em homens
  rationale: Comunica a mudança de forma indicada pelo verbo e verte idiomaticamente o singular distributivo ἄνδρα.
- source_word: ἐν τῇ συνουσίᾳ τῶν ἀνδρῶν αὐτῶν
  choice: durante a união delas com seus maridos
  rationale: Representa συνουσία como união sexual no contexto, sem o enfraquecimento de uma formulação como “enquanto seus maridos estavam com elas”.
theological_decisions:
- issue: Identidade dos Ἐγρήγοροι
  choice: Manter o título “Vigilantes” e explicá-lo em nota
  alternative: Traduzir como “anjos”
  rationale: O grego emprega um título técnico, e identificá-los diretamente como anjos resolveria uma questão interpretativa que o versículo não explicita.
- issue: Natureza da aparição durante a relação conjugal
  choice: Preservar a afirmação de que os Vigilantes apareciam às mulheres durante a união com seus maridos
  alternative: Interpretar que assumiam a aparência dos maridos ou que substituíam os maridos
  rationale: O texto afirma transformação em homens e aparição às mulheres, mas não define de forma inequívoca a mecânica ou a identidade da forma assumida.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe levemente solene adequada ao texto testamentário. A segunda frase foi dividida de modo a evitar um período excessivamente longo. “União” conserva decoro literário, enquanto o complemento “com seus maridos” deixa perceptível o sentido sexual de συνουσία.
