  source_fidelity: 'O texto preserva adequadamente a sequência e as relações de referência do grego: as mulheres seduzem os Vigilantes; estes as observam continuamente, passam a desejá-las e concebem o ato; em seguida, eles se transformam em homens e aparecem às mulheres durante a união destas com seus maridos. “Seduziram” é uma opção apropriada para ἔθελξαν, e “se transformavam” traduz com precisão suficiente o aspecto verbal de μετεσχηματίζοντο sem explicar a mecânica da transformação.'
  naturalness: O português é moderno, claro e mantém registro sóbrio. “Contemplavam continuamente” e “conceberam o ato em sua mente” são um pouco mais literários, mas adequados ao gênero testamentário e plenamente compreensíveis. A divisão em duas frases não prejudica a progressão argumentativa.
  terminology: “Vigilantes” conserva o título técnico Ἐγρήγοροι e a nota o esclarece sem reduzi-lo interpretativamente a “anjos”. “União ... com seus maridos” mantém o sentido sexual contextual de συνουσία com formulação discreta. A nota descreve o uso tradicional do título e não força uma identificação doutrinária no texto.
