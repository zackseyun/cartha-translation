source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Κἀκεῖναι γὰρ⁷⁰ ἐπιθυμοῦσαι * τῇ διανοίᾳ τῆς φαντασίας⁷¹ αὐτῶν ἔτεκον⁷² γίγαντας. Ἐφαίνοντο γὰρ αὐταῖς⁷³ * οἱ Ἐγρήγοροι⁷⁴ * ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες⁷⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/007.yaml
  text: And those women also, desiring in their minds their appearance, gave birth to giants. For the Watchers appeared to them as reaching to heaven.
translation:
  language: pt
  text: E também aquelas mulheres, desejando, em sua mente, a aparência deles, deram à luz gigantes. Pois os Vigilantes lhes apareciam alcançando o céu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “chegando até o céu”. “Apareciam” indica como os Vigilantes eram percebidos pelas mulheres.'
    reason: Preserva o valor de ἐφαίνοντο e oferece uma alternativa natural para φθάνοντες, sem acrescentar uma comparação hipotética.
lexical_decisions:
- source_word: Κἀκεῖναι γὰρ
  choice: E também aquelas mulheres
  rationale: Κἀκεῖναι combina καί com o demonstrativo feminino plural, retomando mulheres já mencionadas; γάρ aqui sustenta a explicação em curso e pode ser expresso pela fluidez da conexão, sem um segundo “pois” pesado.
- source_word: τῇ διανοίᾳ
  choice: mentalmente
  rationale: Expressa o âmbito interior da mente ou imaginação de modo natural, sem sugerir necessariamente uma ação física.
- source_word: τῆς φαντασίας αὐτῶν
  choice: a aparência deles
  rationale: φαντασία pode indicar aparência, visão ou imagem apresentada à mente. “A aparência deles” preserva a leitura adotada pelo texto de consulta e a referência de αὐτῶν aos Vigilantes.
- source_word: ἔτεκον γίγαντας
  choice: deram à luz gigantes
  rationale: Mantém o sentido concreto de gerar ou dar à luz e o substantivo tradicional “gigantes”.
- source_word: οἱ Ἐγρήγοροι
  choice: os Vigilantes
  rationale: Emprega a designação tradicional para os seres conhecidos como Watchers, preservando sua função como título coletivo.
- source_word: ἕως ... τοῦ οὐρανοῦ φθάνοντες
  choice: como se alcançassem o céu
  rationale: Transmite a aparência de chegarem até o céu e, com “como se”, preserva que se trata do modo como apareciam às mulheres.
theological_decisions:
- issue: Natureza da concepção e do desejo
  choice: Manter a formulação como desejo mental da aparência dos Vigilantes, seguido do nascimento de gigantes
  alternative: Explicitar uma união sexual física ou uma concepção puramente imaginária
  rationale: O grego associa o desejo à mente e à aparência, mas não explica de modo inequívoco o mecanismo da concepção; a tradução não deve resolver essa tensão.
- issue: Estatura ou manifestação dos Vigilantes
  choice: “como se alcançassem o céu”
  alternative: Afirmar literalmente que eram fisicamente altos até o céu
  rationale: O verbo ἐφαίνοντο enquadra a descrição como aquilo que parecia às mulheres, não necessariamente como uma medida objetiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva “Vigilantes” como título tradicional e mantém a ambiguidade entre aparência, imaginação e realidade física.
