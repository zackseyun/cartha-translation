source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην διανοίας⁵⁰, ὅτι πᾶσα γυνὴ⁵¹ δολιευομένη ἐν τούτοις εἰς κόλασιν⁵² αἰώνιον⁵³ τετήρηται⁵⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/005.yaml
  text: Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and faces for the deception of the mind; for every woman who deceives by these things is reserved for eternal punishment.
translation:
  language: pt
  text: Portanto, fujam da imoralidade sexual, meus filhos, e ordenem às suas esposas e filhas que não enfeitem a cabeça e o rosto com o propósito de enganar a mente; pois toda mulher que engana por meio dessas coisas está reservada para o castigo eterno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείαν
  choice: imoralidade sexual
  rationale: Expressa de modo claro e abrangente o sentido de conduta sexual ilícita, sem restringi-lo a um único ato.
- source_word: κοσμῶσι
  choice: enfeitem
  rationale: Verbo corrente que comunica adornar ou ornamentar a aparência.
- source_word: πρὸς ἀπάτην διανοίας
  choice: para seduzir a mente
  rationale: Preserva a finalidade expressa por πρός e traduz ἀπάτη como engano sedutor dirigido à mente, mantendo a formulação algo aberta do grego.
- source_word: δολιευομένη ἐν τούτοις
  choice: que engana por meio dessas coisas
  rationale: Representa diretamente o particípio ligado ao dolo e entende ἐν instrumentalmente, em referência aos adornos mencionados.
- source_word: εἰς κόλασιν αἰώνιον τετήρηται
  choice: está reservada para o castigo eterno
  rationale: Conserva o perfeito passivo e a linguagem escatológica explícita do texto.
theological_decisions:
- issue: Natureza e duração do castigo
  choice: castigo eterno
  alternative: punição da era vindoura
  rationale: A expressão grega κόλασιν αἰώνιον é vertida por seu sentido direto e tradicional, sem acrescentar explicações doutrinárias.
- issue: Relação entre adorno e engano
  choice: para seduzir a mente
  alternative: com a intenção de enganar
  rationale: Mantém a referência singular e não especificada de διανοίας, sem decidir de quem é a mente nem expandir a censura além da finalidade declarada.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural de ampla legibilidade brasileira. A formulação conserva o tom patriarcal e admonitório do documento antigo sem o suavizar nem o ampliar.
