  naturalness: O português é geralmente moderno, claro e adequado. A revisão reduz a redundância inicial e preserva uma construção compreensível no trecho difícil sobre olfato, sem disfarçar sua obscuridade textual. “Inspirar ar e respirar” é mais natural do que “aspirarem o ar e o fôlego”, sem pretender resolver a dificuldade do original.
  terminology: “Espíritos do engano”, “arrependimento”, “constituição”, “visão”, “audição”, “olfato”, “fala”, “paladar”, “procriação” e “base da força” são adequados. “Obras da impetuosidade juvenil” comunica melhor o valor moral-contextual de νεωτερισμός do que a expressão mais ampla “obras próprias da juventude”, e a nota conserva a estrutura literal.
