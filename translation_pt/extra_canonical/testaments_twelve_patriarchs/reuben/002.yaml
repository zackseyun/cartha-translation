base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002.yaml
  text: 'And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance. There were given, then, seven spirits set against man, and these are the heads of the works of youthfulness[b].


    And seven other spirits were given to him at creation, so that every work of man might be in them. The first is the spirit of life, by which a person’s constitution is formed. The second is the spirit of sight, by which desire comes to be. The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are produced for the drawing in of air and breath[c]. The fifth is the spirit of speech, by which knowledge comes to be. The sixth is the spirit of taste, by which the eating of foods and drinks comes to be, and strength is formed by it, because in foods is the basis of strength. The seventh is the spirit of procreation and intercourse, by which sins come together through the love of pleasure. Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the young man like a blind man into a pit, and like an animal over a cliff.'
translation:
  language: pt
  text: 'E agora, meus filhos, ouçam o que vi, em meu arrependimento, a respeito dos sete espíritos do engano[a]. Foram dados, pois, sete espíritos contra o ser humano, e estes são as principais fontes das obras da impetuosidade juvenil[b].


    E outros sete espíritos lhe foram dados na criação, para que toda obra humana estivesse neles. O primeiro é o espírito da vida, pelo qual a constituição da pessoa é formada. O segundo é o espírito da visão, pelo qual surge o desejo. O terceiro é o espírito da audição, pelo qual se recebe instrução. O quarto é o espírito do olfato, pelo qual se produzem sabores para inspirar ar e respirar[c]. O quinto é o espírito da fala, pelo qual surge o conhecimento. O sexto é o espírito do paladar, pelo qual se dá a ingestão de alimentos e bebidas, e nele se forma a força, porque nos alimentos está a base da força. O sétimo é o espírito da procriação e da união sexual, pelo qual os pecados se ajuntam mediante o amor ao prazer. Por isso, esse espírito é o último na criação e o primeiro na juventude, porque está cheio de ignorância; ele conduz o jovem como um cego para uma cova e como um animal para um precipício.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido como “espíritos do erro” ou “espíritos da ilusão”.
    reason: lexical_alternative
  - marker: b
    text: 'Em estrutura mais literal: “as cabeças das obras da impetuosidade juvenil”. A expressão provavelmente indica as fontes principais ou os princípios dominantes dos atos impulsivos da juventude.'
    reason: lexical_alternative
  - marker: c
    text: A formulação grega que relaciona olfato, sabores e a inspiração de ar e respiração é difícil e talvez reflita um texto condensado ou instável.
    reason: textual_variant
lexical_decisions:
- source_word: πνευμάτων τῆς πλάνης
  choice: espíritos do engano
  rationale: πλάνη pode indicar erro, extravio ou engano. Aqui, o contexto de forças que desencaminham favorece “engano”, sem eliminar inteiramente as ideias de erro e sedução.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: durante o meu arrependimento
  rationale: No contexto confessional de Rúben, μετάνοια designa arrependimento moral, não apenas mudança intelectual. “Durante” preserva a ideia de que a percepção ocorreu no âmbito desse processo.
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: contra o ser humano
  rationale: κατά com genitivo exprime oposição. “Ser humano” conserva o sentido genérico de ἄνθρωπος em português atual.
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: as fontes principais das obras próprias da juventude
  rationale: κεφαλαί é metafórico e aponta para origens ou princípios dominantes. A formulação naturaliza a metáfora, enquanto a nota registra a estrutura literal e a dificuldade de νεωτερισμός.
- source_word: ἐπὶ τῆς κτίσεως
  choice: na criação
  rationale: A expressão situa a concessão desses espíritos no momento ou âmbito da criação.
- source_word: σύστασις
  choice: constituição
  rationale: O termo indica a composição ou estrutura formada da pessoa; “constituição” mantém essa amplitude sem reduzi-la apenas ao corpo.
- source_word: ὁράσεως / ἀκοῆς / ὀσφρήσεως / γεύσεως
  choice: visão / audição / olfato / paladar
  rationale: Termos correntes e paralelos para as faculdades sensoriais enumeradas.
- source_word: ἐπιθυμία
  choice: desejo
  rationale: O vocábulo pode ser neutro ou negativo. “Desejo” preserva essa amplitude, sem antecipar indevidamente o sentido específico de luxúria.
- source_word: διδασκαλία
  choice: instrução
  rationale: No vínculo com a audição, indica aquilo que é recebido por ouvir. A locução “se recebe instrução” explicita naturalmente esse valor.
- source_word: γίνονται γεύσεις δεδομέναι εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: se produzem sensações de gosto ao se aspirarem o ar e o fôlego
  rationale: O grego é difícil e possivelmente instável. “Sensações de gosto” evita atribuir ao olfato o paladar de modo excessivamente rígido, e “ao se aspirarem” comunica a ligação com a entrada de ar, mantendo a dificuldade em nota.
- source_word: λαλιᾶς
  choice: fala
  rationale: Equivalente simples, digno e apropriado para uma lista de faculdades humanas.
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: a base da força
  rationale: Neste contexto fisiológico e parenético, ὑπόστασις indica fundamento ou sustentação. “Base” evita a coloração teológica posterior de “substância”.
- source_word: σπορᾶς καὶ συνουσίας
  choice: procriação e união sexual
  rationale: σπορά refere-se à geração ou procriação, enquanto συνουσία aqui designa relação sexual. A expressão é clara sem ser vulgar.
- source_word: διὰ τῆς φιληδονίας
  choice: mediante o amor ao prazer
  rationale: Tradução transparente de φιληδονία, preservando a avaliação moral do autor sem estreitá-la a um prazer específico.
theological_decisions:
- issue: Sentido de μετάνοια no testemunho penitencial de Rúben
  choice: arrependimento
  alternative: mudança de mente
  rationale: A fala decorre da confissão e reflexão moral de Rúben sobre seu pecado; “arrependimento” corresponde ao contexto sem impor uma formulação denominacional.
- issue: Status da seção sobre os sete espíritos criados
  choice: incluir no texto principal
  alternative: omitir ou relegar a uma nota como expansão secundária
  rationale: A seção está presente no testemunho grego fornecido. A dificuldade de algumas formulações deve ser preservada e anotada, não resolvida por excisão conjectural.
- issue: Possível tecnicização teológica de ὑπόστασις
  choice: base
  alternative: substância
  rationale: O contexto trata da força derivada dos alimentos, e não de ontologia trinitária ou cristológica. “Base” traduz o sentido contextual sem importar terminologia doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” de modo implícito nas formas verbais (“escutem”), evitou-se linguagem excessivamente técnica e conservaram-se as repetições estruturais da enumeração. As ambiguidades lexicais e a dificuldade textual foram assinaladas em notas.
