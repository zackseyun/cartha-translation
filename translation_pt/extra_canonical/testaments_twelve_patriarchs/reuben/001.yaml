base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001.yaml
  text: 'A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.


    2 Two years after the death of Joseph his brother, when Reuben had fallen sick, the sons of Joseph and the sons of his sons were gathered to visit him. 3 And he said to them, “My children, behold, I am dying, and I am going the way of my fathers.” 4 Then, seeing there Judah and Gad and Asher, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am failing.” 5 And rising up, he kissed them and said to them, “Hear, my brothers and my sons; pay attention to Reuben your father in the things that I command you.


    6 “And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was poured out and defiled the bed of my father Jacob. 7 And I tell you that he struck me with a severe blow in my loins for seven months; and if my father Jacob had not prayed for me to the Lord, the Lord would have been willing to destroy me. 8 For I was thirty years old when I did the evil thing before the Lord, and for seven months I was weakened to the point of death. 9 And after this, with the resolve of my soul, I repented before the Lord for seven years. 10 And I drank no wine or strong drink, and meat did not enter my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great—such a thing had not happened in Israel.”'
translation:
  language: pt
  text: 'Cópia do testamento de Rúben: o que ele ordenou a seus filhos antes de morrer, no centésimo vigésimo quinto ano de sua vida.


    2 Dois anos depois da morte de José, seu irmão, quando Rúben adoeceu, os filhos de José e os filhos de seus filhos reuniram-se para visitá-lo. 3 Ele lhes disse: “Meus filhos, eis que estou morrendo e seguindo o caminho de meus pais”. 4 Ao ver ali Judá, Gade e Aser, seus irmãos, disse-lhes: “Levantem-me, para que eu conte a meus irmãos e a meus filhos as coisas ocultas em meu coração, pois eis que já estou desfalecendo”. 5 Depois de se levantar, beijou-os afetuosamente e lhes disse: “Escutem, meus irmãos e meus filhos; prestem atenção ao que eu, Rúben, pai de vocês, lhes ordeno.


    6 Eis que hoje tomo o Deus do céu como testemunha contra vocês, para que não andem na ignorância da juventude e na imoralidade sexual, na qual fui derramado e profanei o leito de meu pai Jacó. 7 Digo-lhes que ele me feriu com um duro golpe no quadril durante sete meses; e, se meu pai Jacó não tivesse orado por mim ao Senhor, o Senhor teria querido tirar-me a vida. 8 Pois eu tinha trinta anos quando pratiquei esse mal diante do Senhor e, durante sete meses, fiquei debilitado a ponto de morrer. 9 Depois disso, com a determinação de minha alma, arrependi-me diante do Senhor por sete anos. 10 Não bebi vinho nem bebida forte, carne alguma entrou em minha boca e não comi nenhum pão de desejo[a]; antes, fiquei de luto por meu pecado, pois era grande — algo assim jamais havia acontecido em Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pão desejável” ou “alimento que eu desejasse”. O sentido exato da expressão grega é incerto.'
    reason: A expressão ἄρτον ἐπιθυμίας é incomum e admite mais de uma compreensão plausível.
lexical_decisions:
- source_word: διαθήκης
  choice: testamento
  rationale: No contexto de despedida e últimas instruções de um patriarca, “testamento” comunica adequadamente o gênero literário sem impor o sentido mais específico de “aliança”.
- source_word: ὁδὸν τῶν πατέρων μου
  choice: o caminho de meus pais
  rationale: Mantém a expressão idiomática do grego, compreensível em português como referência à morte e à reunião com os antepassados.
- source_word: κατεφίλησεν
  choice: beijou-os afetuosamente
  rationale: O verbo intensivo sugere beijos calorosos ou afetuosos, não apenas um beijo simples.
- source_word: πορνείᾳ
  choice: imoralidade sexual
  rationale: Expressão ampla e atual que preserva o campo semântico de conduta sexual ilícita sem estreitá-lo indevidamente.
- source_word: ἐξεχύθην
  choice: me derramei
  rationale: Conserva a imagem forte e incomum do verbo passivo no texto grego, sem resolver sua possível conotação sexual por paráfrase interpretativa.
- source_word: κοίτην
  choice: leito
  rationale: “Leito” preserva o registro solene e o sentido sexual/familiar da expressão referente ao leito do pai.
- source_word: ἐμαλακίσθην
  choice: fiquei debilitado
  rationale: Transmite o enfraquecimento físico causado pela enfermidade, explicitado pela frase “a ponto de morrer”.
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: com toda a determinação de minha alma
  rationale: Expressa decisão interior deliberada; “toda” torna natural a locução portuguesa sem alterar seu núcleo semântico.
- source_word: σίκερα
  choice: bebida forte
  rationale: Designa bebida alcoólica diferente do vinho; a formulação é clara e tradicional em português bíblico.
- source_word: ἄρτον ἐπιθυμίας
  choice: pão de desejo
  rationale: Mantém a construção ambígua do grego, que pode indicar alimento desejável ou pão associado ao apetite, sem escolher silenciosamente uma interpretação.
theological_decisions:
- issue: Agente do golpe em 1:7
  choice: “ele me feriu”
  alternative: “o Senhor me feriu” ou “Deus me feriu”
  rationale: O grego traz apenas o sujeito implícito na terceira pessoa. Mantém-se o pronome para não explicitar além do texto, embora o contexto seguinte aponte provavelmente para o Senhor.
- issue: Intenção divina em 1:7
  choice: “o Senhor teria querido tirar-me a vida”
  alternative: “o Senhor teria me destruído”
  rationale: Preserva o valor volitivo de ἤθελε e o sentido letal de ἀνελεῖν, evitando transformar a afirmação em resultado inevitável.
- issue: Natureza da penitência de Rúben
  choice: relato de arrependimento acompanhado de abstinência e luto
  alternative: prática ascética normativa ou meio meritório de expiação
  rationale: O texto narra as ações de Rúben, mas não afirma que constituam norma universal nem que obtenham perdão por mérito.
- issue: “Israel” em 1:10
  choice: Israel
  alternative: Jacó ou povo de Israel
  rationale: A referência permanece genuinamente aberta entre o âmbito familiar ligado ao patriarca e a comunidade de Israel; a tradução não a resolve.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais (“vocês”, “lhes”) e preservação de imagens semíticas e gregas relevantes. A numeração segue o capítulo fornecido; evitou-se vocabulário confessional específico.
