    issue: «Em vez disso» para ἀλλά
    rationale: A conjunção grega introduz contraste simples. «Mas» é mais direto e não sugere uma substituição ou explicação adicional.
  - severity: low
    issue: Ordem em «não comi nenhum pão desejável»
    rationale: «Não comi pão desejável algum» soa mais idiomático em português e preserva a negação total.
