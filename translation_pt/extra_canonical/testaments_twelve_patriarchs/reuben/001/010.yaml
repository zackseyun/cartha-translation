base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/010.yaml
  text: And I drank no wine or strong drink, and no meat entered my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great, such as had not happened in Israel.
translation:
  language: pt
  text: Não bebi vinho nem bebida forte; nenhuma carne entrou em minha boca, e não comi pão desejável algum. Mas fiquei de luto por causa do meu pecado, pois ele era grave, como nunca havia acontecido em Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σίκερα
  choice: bebida forte
  rationale: Expressa uma bebida alcoólica distinta do vinho sem restringir indevidamente o termo a uma preparação específica.
- source_word: κρέας
  choice: carne
  rationale: Equivalente direto e natural no contexto de abstinência alimentar.
- source_word: ἄρτον ἐπιθυμίας
  choice: pão desejável
  rationale: Preserva a construção incomum do grego e sua possível referência a alimento apetecível, sem explicitar além do texto.
- source_word: πενθῶν
  choice: de luto
  rationale: Mantém a força de pesar profundo e prolongado, mais intensa do que simples tristeza.
- source_word: μεγάλη
  choice: grave
  rationale: Em referência ao pecado, 'grave' comunica naturalmente a ideia de grande magnitude moral.
theological_decisions:
- issue: Alcance da comparação final
  choice: como nunca havia acontecido em Israel
  alternative: tal como não havia acontecido em Israel
  rationale: A formulação conserva a alegação enfática do texto sem acrescentar uma identificação teológica do pecado nem resolver possíveis tensões históricas.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluente. A formulação 'pão desejável' foi mantida deliberadamente mais formal para preservar a expressão concreta e algo ambígua do original.
