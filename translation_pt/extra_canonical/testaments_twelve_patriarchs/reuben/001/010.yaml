revisions:
- from: Não bebi vinho nem bebida forte; nenhuma carne entrou em minha boca, e não comi nenhum pão desejável. Em vez disso, fiquei de luto por causa do meu pecado, pois ele era grave, como nunca havia acontecido em Israel.
  to: Não bebi vinho nem bebida forte; nenhuma carne entrou em minha boca, e não comi pão desejável algum. Mas fiquei de luto por causa do meu pecado, pois ele era grave, como nunca havia acontecido em Israel.
  rationale: A revisão limita-se a tornar o contraste e a negação mais diretamente correspondentes ao grego e mais naturais em português. Mantêm-se a ambiguidade de «pão desejável» e a formulação geral da comparação final, sem identificar ou ampliar o pecado referido.
