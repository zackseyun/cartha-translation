  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/009.yaml
  text: And after this, with the resolve of my soul, I repented before the Lord for seven years.
translation:
  language: pt
  text: E, depois disso, com a firme decisão da minha alma, arrependi-me diante do Senhor durante sete anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: depois disso
  rationale: Reproduz naturalmente a sequência temporal do grego.
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: com a firme decisão da minha alma
  rationale: Expressa a disposição deliberada e resoluta indicada por προαίρεσις, sem reduzir a frase a mero sentimento.
- source_word: ἑπτὰ ἔτη
  choice: durante sete anos
  rationale: Torna explícita, em português natural, a duração ligada ao arrependimento.
- source_word: μετενόησα
  choice: arrependi-me
  rationale: Equivalente direto de μετανοέω neste contexto de mudança interior e penitência.
- source_word: ἐνώπιον Κυρίου
  choice: diante do Senhor
  rationale: Mantém a imagem relacional e judicial de estar perante o Senhor.
theological_decisions:
- issue: Natureza do arrependimento prolongado
  choice: arrependi-me diante do Senhor durante sete anos
  alternative: fiz penitência diante do Senhor durante sete anos
  rationale: O verbo grego μετενόησα denota primariamente arrependimento ou mudança de mente; “fiz penitência” acrescentaria uma especificação ritual ou ascética não exigida pelo texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e preservação da linguagem antropológica do original (“minha alma”).
