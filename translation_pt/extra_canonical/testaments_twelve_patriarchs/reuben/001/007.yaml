base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/007.yaml
  text: And I tell you that he struck me with a severe blow on my loins for seven months; and if my father Jacob had not prayed to the Lord for me, the Lord would have destroyed me.
translation:
  language: pt
  text: E digo a vocês que ele me feriu com um golpe severo nos lombos durante sete meses; e, se meu pai Jacó não tivesse orado ao Senhor por mim, o Senhor teria tirado minha vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπληξέ με πληγῇ μεγάλῃ
  choice: me feriu com um golpe severo
  rationale: Reproduz a construção enfática do verbo e do substantivo cognato sem soar artificial em português; «severo» comunica a gravidade de μεγάλη neste contexto punitivo.
- source_word: ἐπὶ τῆς λαγόνος μου
  choice: nos lombos
  rationale: λαγών pode designar o flanco ou a região lombar; «lombos» preserva a referência corporal ampla e o registro bíblico sem especificar indevidamente um órgão.
- source_word: ἕως μῆνας ἑπτά
  choice: durante sete meses
  rationale: Embora ἕως costume indicar limite, aqui com uma duração em acusativo exprime a extensão temporal; a formulação portuguesa é natural.
- source_word: ἀνελεῖν με
  choice: me destruído
  rationale: ἀναιρέω pode significar tirar, eliminar ou matar. «Destruído» mantém a força da ameaça e acompanha adequadamente o valor contextual sem acrescentar detalhes.
theological_decisions:
- issue: Referente implícito de ἔπληξέ
  choice: ele
  alternative: o Senhor
  rationale: O grego deixa o sujeito implícito, mas o contexto e a oração subsequente ao Senhor indicam que se trata do Senhor. Mantém-se o pronome do texto, sem inserir o nome onde o original não o repete.
- issue: Valor contrafactual de ἤθελε Κύριος ἀνελεῖν με
  choice: o Senhor teria me destruído
  alternative: o Senhor teria querido me destruir
  rationale: A construção com ἤθελε seguido de infinitivo funciona idiomaticamente como resultado contrafactual iminente; a tradução evita atribuir uma distinção teológica entre vontade e ação que o contexto não exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem «orado ao Senhor por mim» é idiomática e preserva tanto o destinatário da oração quanto o beneficiário. Não há necessidade de notas textuais neste versículo.
