  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/003.yaml
  text: And he said to them, “My children, behold, I am dying and going the way of my fathers.”
translation:
  language: pt
  text: 'E ele lhes disse: “Meus filhos, eis que estou morrendo e vou pelo caminho de meus antepassados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: Meus filhos
  rationale: Expressa de modo natural a fala paterna; embora τέκνα possa abranger ‘filhos’ no sentido de descendentes ou crianças, o contexto favorece a forma familiar ‘meus filhos’.
- source_word: ἰδοὺ
  choice: eis que
  rationale: Preserva o marcador enfático e solene do grego em linguagem bíblica ainda compreensível no português moderno.
- source_word: ἀποθνήσκω
  choice: estou morrendo
  rationale: Mantém o aspecto presente e a declaração de morte iminente, sem convertê-la simplesmente em futuro.
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: seguindo o caminho de meus pais
  rationale: Conserva a metáfora tradicional da morte como ida pelo caminho dos antepassados, com formulação natural em português.
theological_decisions:
- issue: Sentido de ‘o caminho de meus pais’
  choice: Preservar literalmente a metáfora
  alternative: Explicitar como ‘morrer como meus antepassados’
  rationale: O original emprega uma expressão figurada e não explica além disso o estado após a morte; a tradução evita resolver essa abertura teológica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve solenidade em ‘eis que’. ‘Pais’ foi mantido em vez de ‘antepassados’ para preservar a imagem e a proximidade lexical do grego.
