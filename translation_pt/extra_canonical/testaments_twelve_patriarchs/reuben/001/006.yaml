  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/006.yaml
  text: And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was swept away and defiled the bed of my father Jacob.
translation:
  language: pt
  text: E eis que hoje invoco o Deus do céu como testemunha diante de vocês, para que não vivam na ignorância própria da juventude nem na imoralidade sexual, na qual fui arrastado e profanei o leito de meu pai Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν
  choice: invoco o Deus [...] como testemunha diante de vocês
  rationale: Expressa naturalmente a fórmula solene de apelo a Deus como testemunha, sem acrescentar a ideia mais específica de testemunho “contra” os destinatários, que o grego não exige.
- source_word: πορευθῆτε
  choice: vivam
  rationale: O sentido idiomático de “andar” aqui é conduzir a vida; “vivam” comunica isso com clareza em português atual.
- source_word: ἀγνοίᾳ νεότητος
  choice: ignorância própria da juventude
  rationale: Preserva a relação genitiva e indica a inexperiência ou falta de discernimento associada à juventude, sem restringir indevidamente o sentido.
- source_word: πορνείᾳ
  choice: imoralidade sexual
  rationale: Termo amplo e corrente que corresponde ao campo semântico de πορνεία neste contexto.
- source_word: ἐν ᾗ ἐξεχύθην
  choice: pela qual fui arrastado
  rationale: Conserva a voz passiva e transmite de modo natural a imagem contextual de ter sido levado impetuosamente à imoralidade, evitando o literalismo obscuro “fui derramado”.
- source_word: ἐμίανα κοίτην
  choice: profanei o leito
  rationale: “Profanei” comunica a contaminação moral expressa por μιαίνω, enquanto “leito” mantém a referência sexual e familiar de κοίτη em registro digno.
theological_decisions:
- issue: Força jurídica ou acusatória do apelo a Deus como testemunha
  choice: como testemunha diante de vocês
  alternative: como testemunha contra vocês
  rationale: O verbo descreve um testemunho ou apelo solene, mas o dativo ὑμῖν não obriga a entender uma acusação formal contra os ouvintes; a formulação escolhida preserva essa abertura.
translation_notes:
  register: Português moderno, solene e acessível, com leitura natural no Brasil e compreensão internacional. Mantém “e eis que” como sinal discursivo enfático e “leito” para conservar o tom bíblico sem arcaísmo excessivo.
