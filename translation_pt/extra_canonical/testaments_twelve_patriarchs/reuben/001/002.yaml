  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/002.yaml
  text: Two years after the death of Joseph his brother, when Reuben had fallen sick, his sons and the sons of his sons gathered to visit him.
translation:
  language: pt
  text: Dois anos depois da morte de seu irmão José, quando Rúben adoeceu, seus filhos e os filhos de seus filhos se reuniram para visitá-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς
  choice: Dois anos depois da morte
  rationale: Expressa com naturalidade em português a relação temporal e traduz τελευτή como “morte” neste contexto.
- source_word: ἀρρωστήσαντος Ῥουβήμ
  choice: quando Rúben adoeceu
  rationale: A construção temporal com “quando” reproduz de modo claro o genitivo absoluto grego sem tornar a frase artificial.
- source_word: συνήχθησαν ἐπισκέψασθαι αὐτόν
  choice: se reuniram para visitá-lo
  rationale: Mantém o sentido de reunião deliberada e a finalidade expressa pelo infinitivo; “visitar” é adequado para uma visita a um enfermo.
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: seus filhos e os filhos de seus filhos
  rationale: Preserva a repetição e a formulação genealógica do texto grego, sem substituir a segunda expressão por “netos”.
