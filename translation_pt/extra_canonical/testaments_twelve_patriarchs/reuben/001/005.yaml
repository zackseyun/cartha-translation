  text: And rising up, he kissed them and said to them, “Hear, my brothers and my sons; listen to Reuben your father in what I command you.”
translation:
  language: pt
  text: 'E, levantando-se, ele os beijou e lhes disse: “Ouçam, meus irmãos e meus filhos; escutem Rúben, o pai de vocês, no que lhes ordeno.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάς
  choice: levantando-se
  rationale: Preserva de modo natural o particípio aoristo que introduz a ação seguinte.
- source_word: κατεφίλησεν
  choice: beijou
  rationale: O verbo pode sugerir um beijo afetuoso ou intenso, mas o português simples “beijou” evita acrescentar uma intensidade que o contexto não exige.
- source_word: ἀδελφοί μου καὶ υἱοί μου
  choice: meus irmãos e meus filhos
  rationale: Mantém literalmente as duas formas de tratamento e sua tensão familiar, sem tentar harmonizá-las.
- source_word: ἀκούσατε
  choice: Ouçam
  rationale: Imperativo plural direto e corrente, adequado ao discurso de exortação.
- source_word: Ῥουβὴμ τοῦ πατρὸς ὑμῶν
  choice: Rúben, pai de vocês
  rationale: Conserva a autodesignação em terceira pessoa presente no grego, com formulação clara e natural em português.
- source_word: ὅσα ἐγὼ ἐντέλλομαι ὑμῖν
  choice: no que lhes ordeno
  rationale: Expressa de forma idiomática o alcance das instruções dadas por Rúben, preservando a força de ἐντέλλομαι.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A repetição semântica entre “Ouçam” e “escutem” foi mantida para refletir a estrutura enfática atestada pelo texto consultado, e a combinação incomum “meus irmãos e meus filhos” foi preservada sem explicação harmonizadora.
