  text: Then, seeing Judah and Gad and Asher there, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am passing away.”
translation:
  language: pt
  text: 'Então, vendo ali Judá, Gade e Aser, seus irmãos, disse-lhes: “Levantem-me, para que eu diga a meus irmãos e a meus filhos as coisas ocultas em meu coração; pois eis que agora estou morrendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: vendo
  rationale: Mantém de modo natural o particípio circunstancial grego e liga a presença dos irmãos à fala de Rúben.
- source_word: ᾿Αναστήσατέ με
  choice: Levantem-me
  rationale: Reproduz o imperativo plural e o pronome, adequado à cena em que o moribundo pede auxílio para se erguer.
- source_word: κρυπτά
  choice: ocultas
  rationale: Expressa aquilo que estava escondido ou guardado no coração, sem acrescentar a ideia específica de segredo.
- source_word: ἐκλείπω
  choice: estou morrendo
  rationale: No contexto de despedida no leito de morte, comunica claramente o sentido de chegar ao fim ou expirar, em português corrente e digno.
theological_decisions:
- issue: Sentido de ἐκλείπω na declaração final
  choice: estou morrendo
  alternative: estou desfalecendo / estou partindo
  rationale: O contexto testamentário indica morte iminente. A tradução evita tanto a obscuridade de “estou falhando” quanto uma formulação eufemística que poderia enfraquecer o sentido.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A ordem dos nomes e o parentesco permanecem próximos do grego, enquanto a sintaxe foi ajustada para soar natural.
