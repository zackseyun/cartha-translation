  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/008.yaml
  text: For I was thirty years old when I did evil before the Lord, and for seven months I was weakened to the point of death.
translation:
  language: pt
  text: Pois eu tinha trinta anos quando fiz o mal diante do Senhor; e, durante sete meses, fiquei debilitado a ponto de morrer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπραξα τὸ πονηρόν
  choice: fiz o mal
  rationale: Reproduz de modo natural e direto a expressão grega, sem acrescentar a ideia de uma 'coisa' específica.
- source_word: ἐνώπιον Κυρίου
  choice: diante do Senhor
  rationale: Mantém a imagem relacional e judicial de agir na presença do Senhor.
- source_word: ἐμαλακίσθην
  choice: fiquei debilitado
  rationale: O passivo indica que o narrador ficou enfraquecido ou enfermo; 'debilitado' preserva o sentido sem especificar uma causa não expressa.
- source_word: ἕως θανάτου
  choice: a ponto de morrer
  rationale: Expressa em português corrente o alcance extremo da debilidade, sem afirmar que a morte de fato ocorreu.
