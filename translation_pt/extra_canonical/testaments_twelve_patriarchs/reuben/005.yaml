base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005.yaml
  text: 1[a]. For women are evil, my children; and because they do not have authority or power over a man, they scheme by their appearance how they may draw him to themselves. 2. And the one whom they are not able to enchant by appearance, him they overcome through deceit. 3[b]. For an angel of God also told me concerning them and taught me that women are overcome by the spirit of sexual immorality more than a man, and in their heart they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive. 4. For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him. 5. Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and their faces for the deception of the mind; for every woman who uses deceit in these things is reserved for eternal punishment. 6. For in this way they also
    charmed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were changing themselves into the form of men and appearing to them while they were with their husbands. 7. And they also, desiring in their minds their appearance, gave birth to giants[d][c]. For the Watchers appeared to them as reaching up to heaven.
translation:
  language: pt
  text: 1. Pois as mulheres são más, meus filhos; e, por não terem autoridade nem poder sobre o homem, tramam maneiras de atraí-lo para si por meio de sua aparência[a]. 2. E aquele a quem não conseguem enfeitiçar pela aparência vencem por meio do engano. 3. Pois um anjo de Deus também me falou a respeito delas e me ensinou que as mulheres são dominadas pelo espírito da imoralidade sexual mais do que o homem; no coração, elas maquinam coisas contra os homens; por meio dos adornos, desviam a mente deles; pelo olhar, semeiam o veneno; e, primeiro no pensamento e depois pelo ato, fazem deles prisioneiros. 4. Pois uma mulher não pode forçar abertamente um homem, mas age astutamente contra ele com modos de prostituta. 5. Portanto, meus filhos, fujam da imoralidade sexual e ordenem às suas mulheres e às suas filhas que não enfeitem a cabeça nem o rosto para enganar a mente; pois toda mulher que age com engano nessas coisas está reservada para o castigo eterno. 6. Foi assim que elas também enfeitiçaram
    os Vigilantes[b] antes do dilúvio. Estes, por contemplá-las continuamente, passaram também a desejá-las e conceberam o ato em sua mente; pois se transformavam em homens e apareciam a elas durante a união delas com seus maridos. 7. E elas também, desejando em sua mente a aparência deles, deram à luz gigantes[c]. Pois os Vigilantes lhes pareciam alcançar até o céu[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “por meio de sua forma exterior”, aqui e no versículo 2; o termo grego pode indicar aparência, figura ou modo de apresentação.
    reason: lexical_alternative
  - marker: b
    text: “Vigilantes” é o nome dado a seres celestiais em tradições judaicas a respeito do período anterior ao dilúvio; compare Gênesis 6 e sua interpretação posterior, especialmente em 1 Enoque.
    reason: cross_reference
  - marker: c
    text: A linguagem dos versículos 6–7 reflete uma tradição interpretativa desenvolvida acerca dos Vigilantes, do desejo deles e do nascimento dos gigantes.
    reason: cultural_note
  - marker: d
    text: 'A frase final pode ser entendida como hipérbole: os Vigilantes pareciam às mulheres tão altos que alcançavam o céu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηραί
  choice: más
  rationale: Conserva a afirmação moral forte e generalizante da fala de Rúben, sem atenuá-la para uma referência apenas a determinadas mulheres.
- source_word: δολιεύονται
  choice: tramam
  rationale: Expressa a ação deliberada e ardilosa em linguagem portuguesa corrente, preservando a força verbal do contexto.
- source_word: σχήμασιν / τοῦ σχήματος
  choice: aparência
  rationale: No contexto, designa a forma ou apresentação exterior usada para atrair; a nota registra a amplitude lexical.
- source_word: ἐπισπάσωνται
  choice: atraí-lo para si
  rationale: Mantém a imagem direcional de puxar ou trazer o homem para junto delas com formulação natural em português.
- source_word: καταγοητεῦσασθαι
  choice: enfeitiçar
  rationale: Preserva o sentido forte de fascinar ou subjugar como por encantamento, em vez de reduzi-lo simplesmente a seduzir.
- source_word: ἡττῶνται τῷ πνεύματι τῆς πορνείας
  choice: são dominadas pelo espírito da imoralidade sexual
  rationale: Mantém tanto a passividade de quem é vencido quanto a linguagem espiritual ou personificada do grego.
- source_word: ἐν καρδίᾳ μηχανῶνται
  choice: no coração, elas maquinam coisas
  rationale: Preserva a deliberação interior e evita fundir este verbo com δολιεύονται; 'coisas' mantém o objeto não especificado do texto.
- source_word: διὰ τῆς κοσμήσεως
  choice: por meio dos adornos
  rationale: Retém o meio concreto mencionado no grego, sem ampliar para uma condenação genérica da beleza.
- source_word: πλανῶσι ... τὰς διανοίας
  choice: desviam a mente deles
  rationale: Comunica a ação de desencaminhar a mente; o pronome retoma os homens no contexto imediato.
- source_word: διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  choice: pelo olhar, semeiam o veneno
  rationale: Conserva a metáfora vívida do veneno semeado por meio do olhar.
- source_word: Ἐγρηγόρους
  choice: Vigilantes
  rationale: Emprega o termo tradicional para esses seres celestiais na literatura judaica do período, sem reinterpretá-los como seres humanos.
- source_word: γίγαντας
  choice: gigantes
  rationale: Tradução direta que preserva a ligação do texto com a tradição interpretativa antediluviana.
theological_decisions:
- issue: Generalizações severas sobre as mulheres numa exortação testamentária
  choice: Traduzir diretamente a fala de Rúben, mantendo seu caráter generalizante e sua retórica moral.
  alternative: Restringir as afirmações a mulheres imorais ou reformulá-las para reduzir a generalização.
  rationale: A fidelidade ao testemunho grego exige tornar visível a retórica difícil do autor, sem corrigi-la silenciosamente nem apresentá-la como comentário editorial da tradução.
- issue: πνεῦμα τῆς πορνείας
  choice: o espírito da imoralidade sexual
  alternative: o impulso da luxúria
  rationale: A opção conserva a possível dimensão espiritual ou personificada da expressão, sem resolvê-la como mera psicologia.
- issue: Tradição dos Vigilantes e dos gigantes
  choice: Manter 'Vigilantes' e 'gigantes' no texto principal.
  alternative: Interpretá-los como homens poderosos ou substituir os termos por paráfrases.
  rationale: Essas figuras pertencem à tradição judaica refletida pelo texto e devem permanecer identificáveis, sem redução racionalizante.
- issue: Aparição dos Vigilantes durante a união das mulheres com seus maridos
  choice: Traduzir 'apareciam a elas durante a união delas com seus maridos'.
  alternative: Explicitar que os Vigilantes mantinham relações com as mulheres ou que apenas assumiam a aparência dos maridos.
  rationale: A construção grega é difícil e não determina com segurança essas explicações; a redação conserva a estranheza e evita resolver a cena além do que o texto permite.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais de ampla legibilidade brasileira. A tradução preserva a aspereza da voz exortativa, a terminologia espiritual e a estranheza da tradição dos Vigilantes. Emprega 'imoralidade sexual' para πορνεία, 'mulheres' em 5.5 no sentido contextual de esposas e 'Vigilantes' como termo técnico explicado em nota.
