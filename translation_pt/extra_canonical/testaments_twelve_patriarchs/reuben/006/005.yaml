  text: Διὰ τοῦτο Γοὖν λέγω ὑμῖν128 ζηλώσετε29 Γτοὺς υἱοὺς β-d,A,S¹ τοῦ30 Λευὶ1 καὶ ζητήσετε31 ὑψωθῆναι ὑπὲρ αὐτούς32, ἀλλ᾿33 διὰ τοῦτο. οὐ ἰσχύσετε34.
