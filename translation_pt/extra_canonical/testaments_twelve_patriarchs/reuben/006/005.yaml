base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/005.yaml
  text: 'Therefore I say to you: you will envy the sons of Levi and seek to be exalted above them, but because of this you will not prevail.'
translation:
  language: pt
  text: 'Por isso, digo a vocês: vocês terão inveja dos filhos de Levi e procurarão ser exaltados acima deles; mas, por causa disso, não prevalecerão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλώσετε
  choice: terão inveja
  rationale: No contexto de rivalidade e desejo de superioridade, expressa com naturalidade o sentido negativo de invejar, sem recorrer ao menos preciso «ter ciúmes».
- source_word: ζητήσετε
  choice: procurarão
  rationale: Representa diretamente a ideia de buscar ou esforçar-se por alcançar algo.
- source_word: ὑψωθῆναι ὑπὲρ αὐτούς
  choice: ser exaltados acima deles
  rationale: Preserva a forma passiva do infinitivo grego e a comparação explícita com os filhos de Levi.
- source_word: οὐ ἰσχύσετε
  choice: não prevalecerão
  rationale: Comunica a ideia contextual de não ter força ou êxito contra eles, mantendo o tom solene da advertência.
theological_decisions:
- issue: Agente da exaltação
  choice: ser exaltados
  alternative: exaltar-se
  rationale: A tradução conserva a voz passiva e não identifica quem realizaria a exaltação, preservando a ambiguidade do grego.
- issue: Relação causal de διὰ τοῦτο
  choice: por causa disso
  alternative: apesar disso
  rationale: 'Mantém o nexo causal explícito do texto: a própria inveja e busca de superioridade estão ligadas ao fracasso anunciado.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «A vocês» evita regionalismo excessivo, e o futuro mantém a força profética da advertência.
