  text: For God will execute vengeance on them, but you will die an evil death.
translation:
  language: pt
  text: Pois Deus executará a vingança contra eles, mas vocês morrerão de uma morte terrível.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: executará a vingança contra eles
  rationale: A expressão idiomática comunica que Deus aplicará retribuição contra eles. Embora αὐτῶν isoladamente possa parecer genitivo, a evidência textual e o contexto apoiam o sentido objetivo, sem sugerir que Deus realizará uma vingança pertencente a eles.
- source_word: θανάτῳ πονηρῷ
  choice: de uma morte terrível
  rationale: O dativo cognato com ἀποθανεῖτε é expresso naturalmente em português por «morrer de uma morte». Aqui πονηρός qualifica a morte como funesta ou terrível, e não como moralmente má.
theological_decisions:
- issue: Agente e alvo da vingança
  choice: Deus executará a vingança contra eles
  alternative: Deus executará a vingança deles
  rationale: A tradução explicita a leitura contextual em que Deus é o agente da retribuição e «eles» são seu alvo, conforme também reconhecido na revisão auditada, evitando a leitura enganosa de uma vingança possuída ou praticada por eles.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com «vocês» para o plural ὑμεῖς. «Executará a vingança» preserva a solenidade judicial da formulação grega; «morte terrível» soa natural sem atribuir maldade moral à própria morte.
