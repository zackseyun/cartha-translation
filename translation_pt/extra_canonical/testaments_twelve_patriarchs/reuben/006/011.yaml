source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Αὐτὸς γὰρ⁷⁰ εὐλογήσει τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν· * ὅτι ἐν αὐτῷ⁷¹ ἐξελέξατο Κύριος⁷² βασιλεύειν⁷³ ἐνώπιον⁷⁴ * παντὸς τοῦ λαοῦ⁷⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/011.yaml
  text: For he will bless Israel and Judah, because in him the Lord chose to reign before all the people.
translation:
  language: pt
  text: Pois ele abençoará Israel e Judá, porque nele o Senhor escolheu reinar diante de todo o povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς
  choice: ele
  rationale: Mantém o pronome enfático do grego sem acrescentar uma identificação ausente neste versículo.
- source_word: εὐλογήσει
  choice: abençoará
  rationale: Reproduz de modo direto o futuro do verbo εὐλογέω.
- source_word: ἐν αὐτῷ
  choice: nele
  rationale: Preserva a formulação e a possível ambiguidade do referente masculino, sem explicá-lo no corpo do texto.
- source_word: ἐξελέξατο
  choice: escolheu
  rationale: Expressa o aoristo médio de ἐκλέγομαι naturalmente em português, sem introduzir finalidade ou agente adicional.
- source_word: βασιλεύειν
  choice: reinar
  rationale: Mantém o infinitivo e a formulação teologicamente tensa segundo a qual o Senhor escolheu reinar nele.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: diante de todo o povo
  rationale: Equivalência formal e idiomática para a expressão de presença pública perante o povo inteiro.
theological_decisions:
- issue: Relação entre o Senhor e o referente de «nele»
  choice: «nele o Senhor escolheu reinar»
  alternative: «o Senhor o escolheu para reinar»
  rationale: A sintaxe grega liga ἐν αὐτῷ a βασιλεύειν e apresenta Κύριος como sujeito de «escolheu»; a alternativa transforma o referente humano em sujeito implícito de «reinar» e resolve uma tensão que o texto conserva.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. A repetição de «Israel e Judá» e a expressão «todo o povo» foram preservadas sem expansão interpretativa.
