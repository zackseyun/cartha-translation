source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/003.yaml
  text: For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a destructive disgrace of Beliar and an everlasting reproach.
translation:
  language: pt
  text: Pois os encontros constantes, ainda que o ato ímpio não seja praticado, são, mesmo assim, para elas uma doença incurável e, para nós, uma desonra destrutiva de Beliar e uma vergonha eterna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεχεῖς συντυχίαι
  choice: encontros constantes
  rationale: Expressa de modo natural a ideia de encontros ou contatos repetidos e contínuos, sem especificar além do que o grego afirma.
- source_word: τὸ ἀσέβημα
  choice: o ato ímpio
  rationale: Mantém o caráter concreto de ἀσέβημα como ação contrária à piedade, sem identificar uma transgressão específica.
- source_word: νόσος ἀνίατος
  choice: uma doença incurável
  rationale: Tradução direta da metáfora patológica do texto.
- source_word: εἰς ὄλεθρον ὄνειδος
  choice: uma desonra destrutiva
  rationale: Reproduz de forma concisa a relação entre desonra e destruição indicada por εἰς ὄλεθρον, sem reduzir ὄλεθρος apenas a dano leve.
- source_word: ὄνειδος αἰώνιον
  choice: uma vergonha eterna
  rationale: Usa uma expressão corrente e digna para o opróbrio permanente; a variação entre “desonra” e “vergonha” evita repetição pesada sem apagar o paralelismo.
theological_decisions:
- issue: Relação de Beliar com a desonra
  choice: desonra destrutiva de Beliar
  alternative: desonra de Beliar que leva à destruição
  rationale: Preserva a construção compacta e sua possível ambiguidade quanto a Beliar ser a origem, o agente ou a esfera dessa desonra, sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Os pronomes “elas” e “nós” preservam explicitamente a distinção do grego αὐταῖς/ἡμῖν. Mantém-se a forma “Beliar” adotada pelo texto grego, sem normalizá-la para “Belial”.
