base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/009.yaml
  text: I adjure you by the God of heaven, that each of you do truth toward his neighbor and that each have love toward his brother.
translation:
  language: pt
  text: 'Eu os conjuro pelo Deus do céu: que cada um aja com verdade para com o seu próximo e tenha amor pelo seu irmão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρκῶ ὑμᾶς
  choice: Eu os conjuro
  rationale: Preserva a força solene de uma exortação feita sob juramento, sem reduzir a expressão a um simples pedido.
- source_word: ποιεῖν ἀλήθειαν
  choice: aja com verdade
  rationale: Reproduz em português natural o sentido da expressão grega literalmente equivalente a “fazer a verdade”, indicando conduta verdadeira e íntegra.
- source_word: πλησίον
  choice: próximo
  rationale: Mantém o termo relacional tradicional e amplo, sem restringi-lo a um vizinho residencial.
- source_word: ἀγάπην ἔχειν
  choice: tenha amor
  rationale: Segue de perto a construção grega e preserva o amor como disposição contínua para com o irmão.
theological_decisions:
- issue: Relação entre “próximo” e “irmão”
  choice: Manter os dois termos distintos
  alternative: Uniformizar ambos como “semelhante” ou “irmão”
  rationale: O grego emprega πλησίον e ἀδελφός em cláusulas paralelas, e a tradução preserva essa diferença sem definir de modo sectário o alcance de cada relação.
translation_notes:
  register: Português moderno, solene e legível. “Conjuro” conserva o tom formal do juramento; “aja com verdade” evita o decalque pouco natural “faça a verdade” sem enfraquecer a exigência ética do original.
