  text: until the completion of the times [of the high priest Messiah, of whom the Lord spoke].
translation:
  language: pt
  text: até a consumação dos tempos [do sumo sacerdote Messias, de quem o Senhor falou].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως τελειώσεως χρόνων
  choice: até a consumação dos tempos
  rationale: Reproduz de perto a ideia de chegada dos tempos ao seu cumprimento ou termo, em linguagem portuguesa digna e natural.
- source_word: ἀρχιερέως
  choice: sumo sacerdote
  rationale: Equivalente consagrado e preciso para o título sacerdotal.
- source_word: χριστοῦ
  choice: Messias
  rationale: Neste contexto titular, verte o grego christos por “Messias”, preservando sua força escatológica em vez de tratá-lo apenas como adjetivo.
- source_word: ὃν εἶπε Κύριος
  choice: de quem o Senhor falou
  rationale: Mantém a referência pessoal do pronome relativo e o sentido direto do verbo εἶπε.
theological_decisions:
- issue: Relação da expressão entre colchetes com “os tempos”
  choice: Manter literalmente “dos tempos [do sumo sacerdote Messias...]”
  alternative: Reformular como “até se completarem os tempos, quando vier o sumo sacerdote Messias...”
  rationale: A reformulação resolveria uma construção textual difícil e acrescentaria uma relação temporal não explicitada no grego. A tradução conserva tanto a sintaxe recebida quanto sua tensão.
- issue: Identidade de χριστός
  choice: Messias
  alternative: ungido ou Cristo
  rationale: “Messias” comunica aqui um título pessoal esperado e corresponde à camada inglesa auditada, sem impor uma identificação denominacional além do texto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. Os colchetes do texto-fonte foram preservados por sinalizarem incerteza ou condição editorial da cláusula.
