id: T12P.REU.6.12
reference: Testament of Reuben 6:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/012.yaml
  text: And bow down to his offspring, because for your sake it will die in visible and invisible wars, and among you there will be an eternal king.
translation:
  language: pt
  text: E prostrem-se diante de seu descendente,[a] pois ele morrerá por vocês em guerras visíveis e invisíveis; e, entre vocês, haverá um rei eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “diante de sua descendência”. A palavra grega pode designar tanto a descendência coletivamente quanto um descendente.'
    reason: Preservar a ambiguidade real de σπέρμα, enquanto o texto principal oferece uma formulação natural compatível com o verbo no singular.
lexical_decisions:
- source_word: προσκυνήσατε
  choice: prostrem-se diante de
  rationale: Expressa o gesto de reverência ou homenagem sem decidir além do que o contexto permite se se trata especificamente de adoração.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: seu descendente
  rationale: σπέρμα pode ter sentido coletivo ou singular. O singular natural em português se harmoniza com ἀποθανεῖται e preserva a possível referência a um descendente representativo.
- source_word: ὑπὲρ ὑμῶν
  choice: por vocês
  rationale: Reproduz de modo natural a ideia de agir ou morrer em favor dos destinatários, sem especificar uma teoria sobre o caráter dessa morte.
- source_word: ἐν πολέμοις ὁρατοῖς καὶ ἀοράτοις
  choice: em guerras visíveis e invisíveis
  rationale: Mantém a oposição explícita do grego e sua tensão entre conflitos perceptíveis e não perceptíveis.
- source_word: βασιλεὺς αἰώνιος
  choice: rei eterno
  rationale: Equivalência direta e idiomática para a expressão grega, sem restringir αἰώνιος a uma duração meramente temporal ou a uma era específica.
theological_decisions:
- issue: Natureza da reverência indicada por προσκυνήσατε
  choice: prostrem-se diante de
  alternative: adorem
  rationale: O verbo pode denotar adoração ou homenagem mediante prostração. A formulação escolhida preserva essa amplitude sem impor antecipadamente uma identificação divina do descendente.
- issue: Número e referência de σπέρμα
  choice: descendente, com nota sobre a possível coletividade
  alternative: descendência
  rationale: Embora σπέρμα possa ser coletivo, o verbo singular ἀποθανεῖται favorece aqui a leitura de um referente singular ou personificado. A nota mantém aberta a ambiguidade lexical.
- issue: Relação entre o descendente que morre e o rei eterno
  choice: não explicitar se são a mesma figura
  alternative: formular a frase de modo a identificá-los
  rationale: O texto grego os apresenta em orações sucessivas, mas não declara expressamente sua identidade; a tradução conserva essa tensão.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com pronomes de terceira pessoa para boa legibilidade brasileira. “Prostrem-se” mantém a força concreta e solene do imperativo; o ponto e vírgula separa com clareza a morte nas guerras da afirmação sobre o rei eterno.
