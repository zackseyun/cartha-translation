  source_fidelity: 'A tradução acompanha com precisão a estrutura e os sentidos centrais do grego: o imperativo plural προσκυνήσατε, o σπέρμα singular com potencial coletivo, ὑπὲρ ὑμῶν, os conflitos “visíveis e invisíveis” e a afirmação de que haverá entre os destinatários “um rei eterno”. A nota trata adequadamente da ambiguidade semântica de σπέρμα.'
