id: T12P.REU.6.1
reference: Testament of Reuben 6:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Φυλάξατε¹ οὖν² ἀπὸ τῆς³ πορνείας, καὶ * ἔστε καθαρεύοντες⁴ τῇ διανοίᾳ. * φυλάξατε καὶ⁵ * τὰς αἰσθήσεις ὑμῶν⁶ ἀπὸ πάσης γυναικῶν⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/001.yaml
  text: Guard yourselves, therefore, from sexual immorality, and keep your mind pure. Guard also your senses from every woman.
translation:
  language: pt
  text: Guardem-se, portanto, da imoralidade sexual e sejam puros de mente. Resguardem também os seus sentidos de toda mulher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega neste ponto é gramaticalmente irregular; literalmente, traz algo como “de toda... de mulheres”. O sentido provável é “de toda mulher”.
    reason: Preserva para o leitor a incerteza real do texto grego em vez de ocultá-la numa formulação inteiramente resolvida.
lexical_decisions:
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Expressa de modo claro e atual o amplo campo semântico de πορνεία, sem restringi-lo a uma única forma de conduta sexual ilícita.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: sejam puros de mente
  rationale: Preserva a construção com ἔστε e o particípio, apresentando a pureza como condição ou prática contínua no âmbito da mente.
- source_word: αἰσθήσεις
  choice: sentidos
  rationale: Mantém o sentido básico de faculdades sensoriais ou percepções, sem reduzi-lo apenas à visão ou aos pensamentos.
- source_word: φυλάξατε
  choice: Guardem-se / Resguardem
  rationale: Reproduz a ideia de vigilância e proteção; a variação evita repetição pesada em português sem alterar a força exortativa.
theological_decisions:
- issue: Alcance de πορνεία
  choice: imoralidade sexual
  alternative: prostituição; fornicação
  rationale: A opção escolhida conserva a abrangência do termo grego e evita impor uma definição denominacional mais estreita.
- issue: Referência final às mulheres
  choice: de toda mulher, com nota textual
  alternative: de tudo o que diz respeito às mulheres
  rationale: Segue a compreensão refletida na versão inglesa de consulta, mas sinaliza que a forma grega transmitida é gramaticalmente irregular e não permite eliminar toda incerteza.
translation_notes:
  register: Português moderno, digno e direto, com formas verbais no plural adequadas à exortação. “Sejam puros de mente” soa natural no uso brasileiro e permanece amplamente compreensível no português internacional.
