  source_fidelity: A tradução reproduz adequadamente as duas exortações imperativas de φυλάξατε, o valor inferencial de οὖν («portanto»), o sentido amplo de πορνεία («imoralidade sexual»), a pureza relativa à mente (τῇ διανοίᾳ) e a referência final aos sentidos. A nota registra de modo apropriado a anomalia de concordância em πάσης γυναικῶν, sem resolver a incerteza além do que o texto permite.
