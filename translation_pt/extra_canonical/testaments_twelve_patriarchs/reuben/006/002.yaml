  text: And command those women likewise not to associate with men, so that they too may be pure in mind.
translation:
  language: pt
  text: E ordenem também àquelas mulheres que não convivam com homens, para que elas também mantenham a mente pura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκείνας
  choice: também àquelas mulheres
  rationale: O pronome feminino plural remete a mulheres já mencionadas no contexto; «àquelas mulheres» preserva essa referência, e καί é expresso por «também».
- source_word: ἐντέλλεσθε
  choice: ordenem
  rationale: Reproduz o valor imperativo plural do verbo, em linguagem moderna e direta.
- source_word: συνδιάζειν
  choice: convivam
  rationale: Expressa a ideia de manter convívio ou associação com alguém sem acrescentar a noção de intimidade, que não está explícita no verbo.
- source_word: καθαρεύωσι τῇ διανοίᾳ
  choice: mantenham a mente pura
  rationale: Formulação natural em português que conserva a pureza mental expressa pelo grego; «mantenham» comunica o sentido durativo de permanecer em estado de pureza.
theological_decisions:
- issue: Natureza da convivência proibida
  choice: não convivam com homens
  alternative: não tenham relações com homens
  rationale: A tradução evita interpretar a expressão como necessariamente sexual, pois o grego permite um sentido mais amplo de associação ou convívio.
translation_notes:
  register: Português moderno, claro e digno, com imperativos no plural e construção natural para leitores brasileiros e internacionais.
