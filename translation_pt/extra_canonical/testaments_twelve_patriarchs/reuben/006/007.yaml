- source_word: βασιλεία (leitura pressuposta pela tradição textual consultada)
  choice: reino
  rationale: Preserva o paralelo entre a autoridade sacerdotal de Levi e a autoridade régia de Judá.
theological_decisions:
- issue: Relação entre Levi e Judá na expressão equivalente a “com ele”
  choice: junto com ele
  alternative: em associação com ele
  rationale: A formulação mantém aberta a relação exata entre as duas atribuições e não subordina silenciosamente uma à outra.
