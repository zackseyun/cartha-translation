  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/004.yaml
  text: For sexual immorality has within itself neither understanding nor godliness, and every jealousy dwells in its desire.
translation:
  language: pt
  text: Pois a imoralidade sexual não tem em si nem entendimento nem piedade, e todo ciúme habita em seu desejo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Expressa de modo natural e abrangente a conduta sexual ilícita indicada pelo termo grego.
- source_word: σύνεσιν
  choice: entendimento
  rationale: Preserva o sentido de compreensão, discernimento ou inteligência sem estreitá-lo indevidamente.
- source_word: εὐσέβειαν
  choice: devoção a Deus
  rationale: Comunica em português corrente a piedade ou devoção religiosa denotada pelo termo, tornando explícita sua orientação teológica sem introduzir uma doutrina denominacional.
- source_word: ζῆλος
  choice: ciúme
  rationale: No contexto da paixão sexual, traduz o valor negativo provável de zelo possessivo ou ciúme, preservando a formulação abrangente do grego.
- source_word: ἐπιθυμίᾳ
  choice: desejo
  rationale: Mantém a amplitude lexical do termo, enquanto o contexto deixa claro seu caráter sexual e desordenado.
theological_decisions:
- issue: Sentido religioso de εὐσέβεια
  choice: devoção a Deus
  alternative: piedade
  rationale: A escolha é mais transparente para leitores modernos e conserva a referência à conduta reverente diante de Deus, sem associar o texto a uma tradição confessional específica.
- issue: Referente do pronome αὐτῆς em ἐν τῇ ἐπιθυμίᾳ αὐτῆς
  choice: em seu desejo
  alternative: no desejo por ela
  rationale: O genitivo feminino retoma naturalmente πορνεία; a redação conserva a ambiguidade entre o desejo próprio da imoralidade sexual e o desejo dirigido a ela, em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima à estrutura grega. A personificação da imoralidade sexual e a imagem de o ciúme habitar em seu desejo foram preservadas.
