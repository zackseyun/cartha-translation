source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ πρὸς τὸν⁶⁵ Λευὶ ἐγγίσατε⁶⁶ ἐν ταπεινώσει καρδίας Γὑμῶν⌉⁶⁷, ἵνα * δέξησθε εὐλογίαν⁶⁸ ἐκ τοῦ⁶⁹ στόματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/010.yaml
  text: And draw near to Levi in humility of your heart, so that you may receive a blessing from his mouth.
translation:
  language: pt
  text: E aproximem-se de Levi com humildade no coração de vocês, para que recebam uma bênção da boca dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσατε
  choice: aproximem-se
  rationale: Imperativo plural que expressa a ideia direta de chegar perto ou achegar-se; a forma escolhida é natural e clara em português contemporâneo.
- source_word: ἐν ταπεινώσει καρδίας ὑμῶν
  choice: com humildade de coração
  rationale: Reproduz a atitude interior indicada pelo grego. Em português, a construção idiomática mantém o valor de ὑμῶν no contexto da exortação plural, sem a rigidez de 'do coração de vocês'.
- source_word: δέξησθε
  choice: recebam
  rationale: O subjuntivo aoristo após ἵνα indica a finalidade da aproximação; 'para que recebam' expressa essa relação naturalmente.
- source_word: εὐλογίαν ἐκ τοῦ στόματος αὐτοῦ
  choice: uma bênção da boca dele
  rationale: Mantém a imagem concreta da bênção procedente da boca de Levi, sem substituir a expressão por uma interpretação como 'pronunciada por ele'.
theological_decisions:
- issue: A função de Levi como fonte de uma bênção pronunciada
  choice: preservar literalmente 'uma bênção da boca dele'
  alternative: uma bênção pronunciada por ele
  rationale: O texto associa a bênção à boca de Levi, mas não explicita aqui sua função sacerdotal nem a natureza exata da bênção; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com imperativo plural de ampla legibilidade brasileira. A formulação conserva a imagem semítica 'da boca dele' e evita explicitação teológica ausente do verso.
