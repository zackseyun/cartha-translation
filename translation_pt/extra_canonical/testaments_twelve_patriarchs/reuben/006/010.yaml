  source_fidelity: A tradução reproduz adequadamente o imperativo plural, a relação de finalidade e a imagem de uma bênção que procede da boca de Levi. Contudo, «de coração» não expressa de modo suficiente o pronome explícito ὑμῶν («de vocês/de vocês mesmos»), ligado a «coração» no grego.
  naturalness: «Aproximem-se de Levi» e «para que recebam» são naturais, claras e adequadas ao registro exortativo. «Com humildade no coração de vocês» explicita o possessivo sem sacrificar a legibilidade brasileira ou internacional.
  terminology: «Levi» deve ser preservado. «Bênção» traduz εὐλογίαν com precisão. «Da boca dele» conserva deliberadamente a imagem concreta ἐκ τοῦ στόματος αὐτοῦ, sem introduzir explicações sacerdotais ou doutrinárias.
