    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: deem atenção
  rationale: Expressa naturalmente a advertência contra dirigir a atenção à beleza sedutora, preservando a força do imperativo.
- source_word: ἐννοεῖσθε
  choice: fiquem pensando
  rationale: Indica ocupação mental persistente, não apenas percepção momentânea.
- source_word: ἁπλότητι καρδίας
  choice: com simplicidade de coração
  rationale: Mantém a expressão ética característica do texto e o contraste com desejos divididos.
- source_word: φόβῳ κυρίου
  choice: no temor do Senhor
  rationale: Preserva a linguagem bíblica reconhecível sem atenuar seu sentido moral e religioso.
- source_word: μοχθοῦντες
  choice: trabalhando arduamente
  rationale: Comunica o esforço intenso do particípio de modo claro no português atual.
- source_word: γράμμασι
  choice: nos estudos
  rationale: Embora signifique literalmente 'letras' ou 'escritos', neste contexto provavelmente se refere à instrução ou ao aprendizado.
- source_word: σύζυγον
  choice: esposa
  rationale: Na exortação de um pai a seus filhos homens, é a opção direta e contextualmente adequada.
- source_word: παρρησίαν
  choice: coragem
  rationale: No contexto, designa a confiança ou liberdade interior necessária para encarar o pai depois do pecado.
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: É uma formulação contemporânea e suficientemente ampla para o termo moral grego, sem restringi-lo indevidamente.
- source_word: βόθρος
  choice: cova
  rationale: Conserva a metáfora concreta de um lugar profundo e perigoso para a alma.
- source_word: ᾅδην
  choice: Hades
  rationale: Translitera o termo grego e evita identificá-lo automaticamente com 'inferno', preservando a cosmologia do texto.
- source_word: φάρμακα
  choice: poções
  rationale: O termo pode indicar drogas, preparados ou poções; a menção a magos favorece aqui preparados de caráter mágico.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Preserva a forma nominal encontrada no texto em vez de substituí-la por uma interpretação teológica.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: sepultura; mundo dos mortos; inferno
  rationale: O texto usa especificamente ᾅδης. 'Hades' preserva a imagem do mundo da fonte e evita a carga doutrinária mais específica de 'inferno'.
- issue: Relação entre imoralidade sexual e idolatria
  choice: a aproxima dos ídolos
  alternative: leva-a à idolatria; faz com que sirva aos ídolos
  rationale: O grego exprime aproximação. A tradução conserva a ligação teológica sem transformá-la numa equivalência doutrinária mais forte.
- issue: Expressão difícil πρόσκομμα τῷ Βελίαρ
  choice: pedra de tropeço para Beliar
  alternative: motivo de tropeço por meio de Beliar; ofensa diante de Beliar
  rationale: A expressão é semanticamente difícil. A tradução mantém de perto sua forma, em vez de resolver silenciosamente a ambiguidade.
- issue: Aconselhamento interior no versículo 9
  choice: o conselho de sua própria alma que o impelia à cobiça perversa
  alternative: a deliberação de sua alma para um desejo mau
  rationale: A formulação procura tornar compreensível a sintaxe difícil sem eliminar a representação da própria alma como fonte de conselho ou impulso.
translation_notes:
  register: Português moderno, digno e acessível, com construções de boa legibilidade brasileira e compreensão internacional. Emprega-se tratamento plural com “vocês”, evitando arcaísmos, mas preservando expressões bíblicas centrais como “temor do Senhor”, “simplicidade de coração” e “favor diante de Deus”. As lacunas dos versículos 2–4 foram tratadas cautelosamente à luz da evidência transmitida indicada na camada inglesa auditada.
