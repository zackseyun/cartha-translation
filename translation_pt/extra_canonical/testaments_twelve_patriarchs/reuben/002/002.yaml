  text: Then seven spirits were given against man, and these are the heads of the works of youthfulness[b].
translation:
  language: pt
  text: Assim, sete espíritos foram dados contra o ser humano, e estes são as cabeças das obras da juventude[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “as cabeças das obras da juventude” segue de perto a estrutura do grego; provavelmente indica as principais fontes ou os princípios dirigentes das transgressões próprias da juventude.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Assim
  rationale: Expressa a conexão inferencial ou continuativa do grego de modo natural em português.
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: contra o ser humano
  rationale: Preserva o sentido adversativo de κατά com genitivo e traduz ἄνθρωπος de forma inclusiva e corrente.
- source_word: αἱ κεφαλαὶ
  choice: as cabeças
  rationale: Mantém a metáfora concreta do original, cuja interpretação como fontes principais ou princípios dirigentes é explicada em nota.
- source_word: τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: das obras da juventude
  rationale: Conserva a construção genitiva e a referência à condição ou conduta juvenil sem especificar no texto que se trata de pecados.
theological_decisions:
- issue: Natureza dos sete espíritos e sua relação com o ser humano
  choice: sete espíritos foram dados contra o ser humano
  alternative: sete espíritos foram colocados em oposição ao ser humano
  rationale: A formulação mantém tanto o passivo ἐδόθη quanto a força adversativa de κατά, sem identificar quem os deu nem definir além do texto a natureza desses espíritos.
- issue: Sentido de “cabeças”
  choice: preservar a metáfora no texto
  alternative: traduzir interpretativamente como “fontes principais” ou “princípios dirigentes”
  rationale: O grego admite uma noção de chefia, origem ou princípio; manter “cabeças” preserva a ambiguidade e evita resolver a imagem no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A frase conserva deliberadamente as imagens incomuns “contra o ser humano” e “as cabeças”, esclarecendo esta última em nota sem diluir a tensão do original.
