base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/005.yaml
  text: The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are given for the drawing in of air and breath[c].
translation:
  language: pt
  text: O terceiro é o espírito da audição, por meio da qual surge o ensino. O quarto é o espírito do olfato, por meio do qual são dados os sabores para a inspiração do ar e a respiração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação grega que relaciona olfato, sabores, inspiração do ar e respiração é difícil e pode refletir uma redação condensada ou uma transmissão textual instável.
    reason: textual_variant
lexical_decisions:
- source_word: πνεῦμα ἀκοῆς
  choice: espírito da audição
  rationale: Mantém a estrutura da enumeração grega e traduz ἀκοή de modo natural e preciso.
- source_word: μεθ’ ἧς γίνεται διδασκαλία
  choice: por meio da qual surge o ensino
  rationale: Conserva o valor mediador de μετά e a formulação aberta de γίνεται, sem restringir διδασκαλία a uma modalidade específica.
- source_word: πνεῦμα ὀσφρήσεως
  choice: espírito do olfato
  rationale: Expressa o sentido fisiológico de ὄσφρησις em português corrente.
- source_word: γεύσεις δεδομέναι
  choice: são dados os sabores
  rationale: Reflete diretamente o particípio passivo δεδομέναι e evita substituí-lo por 'produzidos'.
- source_word: εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: para aspirar o ar e respirar
  rationale: Torna inteligível a finalidade da expressão, mantendo tanto a entrada do ar quanto a respiração, embora a construção grega seja difícil.
