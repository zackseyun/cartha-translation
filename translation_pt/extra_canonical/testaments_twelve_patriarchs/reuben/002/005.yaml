  source_fidelity: O primeiro enunciado reproduz adequadamente Τρίτον πνεῦμα ἀκοῆς ... γίνεται διδασκαλία. No segundo, «sabores» corresponde a γεύσεις e «são dados» preserva o particípio passivo δεδομέναι. Contudo, «para aspirar o ar e respirar» transforma a construção nominal difícil εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς em duas ações verbais e torna a redundância menos controlada. Uma formulação nominal preserva melhor a compressão do grego sem pretender resolvê-la.
