  terminology: «Espírito da audição» e «espírito do olfato» mantêm a enumeração e o registro do texto. «Ensino» é uma boa equivalência para διδασκαλία. «Sabores» é aceitável para γεύσεις neste contexto, sobretudo com a nota que assinala a dificuldade textual.
