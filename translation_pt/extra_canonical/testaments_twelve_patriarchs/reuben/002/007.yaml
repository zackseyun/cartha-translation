base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/007.yaml
  text: The sixth is the spirit of taste, by which eating of foods and drinks comes to be, and strength is built up in it, because in foods is the basis of strength.
translation:
  language: pt
  text: O sexto é o espírito do paladar, por meio do qual ocorre a ingestão de alimentos e bebidas, e nele se forma a força, pois nos alimentos está a base da força.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα γεύσεως
  choice: espírito do paladar
  rationale: Mantém a terminologia da enumeração e traduz γεύσεως pelo sentido natural da faculdade de saborear.
- source_word: γίνεται βρῶσις βρωμάτων τε καὶ πομάτων
  choice: se consomem alimentos e bebidas
  rationale: Expressa em português corrente a ideia de que, por meio do paladar, ocorre a ingestão de comida e bebida, evitando a formulação pouco natural «comer de alimentos e bebidas».
- source_word: ἰσχὺς ἐν αὐτῷ κτίζεται
  choice: nele se desenvolve a força
  rationale: κτίζεται tem literalmente a ideia de ser construída ou formada; «se desenvolve» comunica naturalmente o fortalecimento progressivo, preservando ἐν αὐτῷ como «nele».
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: base da força
  rationale: Neste contexto fisiológico, ὑπόστασις indica fundamento, base ou aquilo que dá sustentação; «base» é claro sem introduzir conotação técnica posterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e paralelismo compatível com uma enumeração didática. Conserva «espírito» e o referente potencialmente ambíguo de «nele», sem acrescentar interpretação teológica.
