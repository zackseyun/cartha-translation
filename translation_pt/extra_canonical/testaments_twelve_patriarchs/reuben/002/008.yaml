source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ἕβδομον πνεῦμα σπορᾶς καὶ συνουσίας²⁷, μεθ’ ἧς συνέρχονται²⁸ διὰ τῆς φιληδονίας²⁹ ἁμαρτίαι³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/008.yaml
  text: The seventh is the spirit of procreation and union, through which sins come together through love of pleasure.
translation:
  language: pt
  text: O sétimo é o espírito da procriação e da união, com a qual os pecados se juntam por meio do amor ao prazer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπορᾶς
  choice: procriação
  rationale: Expressa o sentido de geração ou reprodução neste catálogo de impulsos corporais, sem restringi-lo ao ato de semear.
- source_word: συνουσίας
  choice: união
  rationale: Preserva a formulação relativamente neutra do grego, embora, no contexto, possa incluir união sexual.
- source_word: συνέρχονται
  choice: se juntam
  rationale: Reproduz o verbo de reunião e mantém o jogo lexical com συνουσίας sem acrescentar uma interpretação mais específica.
- source_word: φιληδονίας
  choice: amor ao prazer
  rationale: Traduz diretamente a ideia de afeição ou apego ao prazer, com linguagem natural e digna.
theological_decisions:
- issue: Relação do espírito com os pecados
  choice: com o qual os pecados se juntam
  alternative: por meio do qual surgem pecados
  rationale: A construção μεθ’ ἧς e o verbo συνέρχονται descrevem associação ou reunião; evita-se transformar a frase numa afirmação causal mais definida do que o grego.
- issue: Valor de συνουσίας
  choice: união
  alternative: relação sexual
  rationale: Mantém a amplitude e a relativa neutralidade do termo, sem ocultar sua possível conotação sexual no contexto da procriação.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. A expressão “amor ao prazer” preserva a tensão moral do original sem recorrer a jargão teológico.
