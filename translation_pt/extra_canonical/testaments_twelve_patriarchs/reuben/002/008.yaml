    issue: «com o qual» retoma «espírito» em vez de «união».
    rationale: O relativo grego ἧς está no feminino e se refere mais naturalmente a συνουσίας («união»), também feminino em português.
  - severity: medium
    issue: «por causa do amor ao prazer» reforça uma causalidade que não é necessária.
    rationale: διὰ τῆς φιληδονίας pode expressar o meio pelo qual ocorre a reunião dos pecados; «por meio do amor ao prazer» conserva essa relação sem a estreitar.
  revised_text: O sétimo é o espírito da procriação e da união, com a qual os pecados se juntam por meio do amor ao prazer.
