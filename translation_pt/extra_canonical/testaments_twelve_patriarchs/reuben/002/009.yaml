base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/009.yaml
  text: Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the younger man like a blind man into a pit and like an animal over a cliff.
translation:
  language: pt
  text: Por isso, esse espírito é o último na criação e o primeiro na juventude, pois está cheio de ignorância; e conduz o mais jovem tal como se conduz um cego a uma cova e um animal a um precipício.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατόν ... τῆς κτίσεως
  choice: o último na criação
  rationale: Mantém a formulação comparativa e a referência abrangente à criação, sem substituir κτίσις por uma interpretação mais específica como “formação”.
- source_word: πρῶτον τῆς νεότητος
  choice: o primeiro na juventude
  rationale: Reproduz o contraste deliberado entre “último” e “primeiro” e conserva νεότης como a fase da juventude.
- source_word: ἀγνοίας πεπλήρωται
  choice: está cheio de ignorância
  rationale: Expressa de modo direto o perfeito passivo e preserva a caracterização forte de ἀγνοία.
- source_word: τὸν νεώτερον
  choice: o mais jovem
  rationale: Conserva o valor comparativo substantivado de νεώτερος, sem restringi-lo explicitamente a “homem” quando o grego não traz ἀνήρ.
- source_word: ὥσπερ τυφλὸν ἐπὶ βόθρον καὶ ὡς κτῆνος ἐπὶ κρημνόν
  choice: como quem conduz um cego a uma cova e um animal a um precipício
  rationale: Torna clara em português a dupla comparação ligada ao ato de conduzir, preservando as imagens paralelas de perigo e queda.
theological_decisions:
- issue: Sujeito implícito de ἔσχατόν ἐστι e dos verbos seguintes
  choice: esse espírito
  alternative: isso/ele
  rationale: O sujeito é recuperado do contexto imediato da enumeração dos espíritos, como também reconhece a camada inglesa auditada; “esse” retoma naturalmente o espírito em discussão sem acrescentar identidade doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A estrutura antitética “último na criação / primeiro na juventude” foi mantida, e a comparação final foi levemente explicitada sintaticamente para evitar ambiguidade involuntária em português.
