source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ νῦν¹ ἀκούσατέ μου, τέκνα μου², ἃ³ εἶδον περὶ τῶν ἑπτὰ⁴ πνευμάτων τῆς πλάνης ἐν τῇ μετανοίᾳ μου⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/001.yaml
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance.
translation:
  language: pt
  text: E agora, meus filhos, escutem-me sobre o que vi a respeito dos sete espíritos do engano[a], em meu arrependimento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “espíritos do erro” ou “espíritos da ilusão”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: escutem-me
  rationale: Reproduz de modo natural o imperativo aoristo com o pronome no genitivo, preservando o apelo direto aos filhos.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Equivalente corrente e afetuoso para a forma de tratamento τέκνα μου.
- source_word: περὶ
  choice: acerca de / sobre
  rationale: A construção foi vertida como “acerca do que vi sobre...”, distinguindo naturalmente o assunto da fala do objeto da visão.
- source_word: τῶν ἑπτὰ πνευμάτων τῆς πλάνης
  choice: os sete espíritos do engano
  rationale: Mantém a estrutura genitiva e a personificação potencial do grego sem decidir se πλάνη significa engano ativo, erro ou ilusão.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: durante o meu arrependimento
  rationale: O valor temporal de ἐν é natural neste contexto; “arrependimento” preserva o sentido moral e religioso de μετάνοια.
theological_decisions:
- issue: Natureza dos “espíritos” e sentido do genitivo τῆς πλάνης
  choice: espíritos do engano
  alternative: espíritos do erro / espíritos da ilusão
  rationale: A tradução conserva a ambiguidade entre agentes que enganam e espíritos caracterizados pelo erro, sem definir sua ontologia ou impor uma leitura doutrinária.
- issue: Relação temporal de ἐν τῇ μετανοίᾳ μου
  choice: durante o meu arrependimento
  alternative: em meu arrependimento
  rationale: “Durante” comunica com clareza que a visão ocorreu no período ou processo de arrependimento, sem afirmar que o arrependimento foi o meio causal da visão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. “Escutem-me” mantém o caráter oral e exortativo; a nota preserva a amplitude semântica de πλάνη.
