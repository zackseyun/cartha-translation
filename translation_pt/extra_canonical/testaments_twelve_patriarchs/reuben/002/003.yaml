  text: And seven other spirits were given to him at creation, so that every work of man might be in them.
translation:
  language: pt
  text: E outros sete espíritos lhe foram dados[a] na criação, para que toda obra humana estivesse neles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos apresentam variações nesta frase, inclusive no verbo e nos pronomes; o sentido geral é que sete outros espíritos foram concedidos ao ser humano na criação.
    reason: O aparato indicado pelos sobrescritos na edição sinaliza variantes textuais relevantes, embora os dados fornecidos não permitam enumerar com segurança todas as leituras.
lexical_decisions:
- source_word: ἕτερα ἑπτὰ πνεύματα
  choice: outros sete espíritos
  rationale: Mantém a distinção expressa por ἕτερα e reproduz diretamente o número e o substantivo do grego.
- source_word: ἐδόθη αὐτῷ
  choice: lhe foram dados
  rationale: Preserva a voz passiva e o referente pronominal masculino sem identificar explicitamente o agente.
- source_word: ἐπὶ τῆς κτίσεως
  choice: na criação
  rationale: Expressa de modo natural o valor temporal/contextual da locução, de acordo com o texto de consulta, sem especificar se se trata da criação do ser humano ou da criação em sentido mais amplo.
- source_word: πᾶν ἔργον ἀνθρώπου
  choice: toda obra humana
  rationale: Formulação corrente e dignificada que conserva a abrangência de πᾶν e entende ἀνθρώπου genericamente.
theological_decisions:
- issue: Agente da concessão dos sete espíritos
  choice: manter a voz passiva sem nomear o agente
  alternative: explicitar que Deus os deu
  rationale: O grego usa ἐδόθη sem agente expresso; acrescentar 'Deus' resolveria uma informação deixada implícita pela fonte.
- issue: Relação entre as obras humanas e os espíritos
  choice: para que neles estivesse toda obra humana
  alternative: para que toda ação humana fosse realizada por meio deles
  rationale: A tradução conserva a formulação espacial/metafórica ἐν αὐτοῖς e evita converter a relação em instrumentalidade explícita.
translation_notes:
  register: Português moderno, claro e solene, com construção próxima ao grego. 'Obra humana' foi preferido a 'obra do homem' para leitura amplamente internacional e inclusiva sem perder o sentido genérico.
