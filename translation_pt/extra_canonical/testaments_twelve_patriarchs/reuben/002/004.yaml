id: T12P.REU.2.4
reference: Testament of Reuben 2:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πρῶτον πνεῦμα ζωῆς, μεθ’ ἧς ἡ σύστασις¹⁶ κτίζεται. Δεύτερον πνεῦμα ὁράσεως, μεθ’ ἧς γίνεται ἐπιθυμία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/004.yaml
  text: The first is the spirit of life, with which the constitution is formed. The second is the spirit of sight, with which desire arises.
translation:
  language: pt
  text: O primeiro é o espírito da vida, com a qual é criada a constituição[a]. O segundo é o espírito da visão, com a qual surge o desejo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estrutura” ou “composição”.'
    reason: O grego σύστασις tem sentido amplo e pode designar aquilo que é constituído ou a organização de suas partes.
lexical_decisions:
- source_word: πνεῦμα ζωῆς
  choice: espírito da vida
  rationale: Mantém de perto a expressão grega e sua relação genitiva, sem interpretar “espírito” como simples faculdade ou função.
- source_word: σύστασις
  choice: constituição
  rationale: Preserva a amplitude do termo grego, que pode indicar constituição, composição ou estrutura, sem acrescentar explicitamente “do ser humano”, ausente nesta frase.
- source_word: πνεῦμα ὁράσεως
  choice: espírito da visão
  rationale: Reproduz a construção paralela do original e evita restringir ὅρασις ao órgão físico da vista.
- source_word: ἐπιθυμία
  choice: desejo
  rationale: Equivalente amplo e natural, capaz de conservar a possível neutralidade ou conotação negativa do termo conforme o contexto.
theological_decisions:
- issue: Natureza dos “espíritos” enumerados
  choice: Manter literalmente “espírito da vida” e “espírito da visão”
  alternative: Interpretá-los como “faculdade vital” e “sentido da visão”
  rationale: O texto os denomina πνεῦμα; uma paráfrase funcional resolveria uma questão antropológica que o original deixa aberta.
- issue: Referente de “constituição”
  choice: Não explicitar de quem ou de que é a constituição
  alternative: “a constituição do ser humano” ou “a pessoa é formada”
  rationale: O substantivo aparece sem complemento explícito; a tradução preserva essa concisão e ambiguidade.
translation_notes:
  register: Português atual, digno e de leitura natural. A repetição paralela de “com o qual” acompanha a estrutura das duas orações gregas; “constituição” é esclarecida em nota para evitar que seja entendida apenas em sentido jurídico.
