base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006.yaml
  text: '1. Guard yourselves, therefore, from sexual immorality, and be keeping your mind pure. Guard also your senses from every woman. 2. And command the women likewise not to associate closely with men, so that they too may keep their minds pure. 3. For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a ruinous disgrace of Beliar and an everlasting reproach. 4. For sexual immorality has within itself neither understanding nor reverence for God, and every jealousy dwells in its desire. 5. Therefore I say to you: you will be jealous of the sons of Levi, and you will seek to exalt yourselves above them, but you will not prevail because of this. 6. For God will execute their vengeance, but you will die an evil death. 7. For to Levi God gave the priesthood, and to Judah with him the kingdom. 8. And do not be lifted up against these two, from whom the Lord will bring to completion what is to be spoken. 9. I adjure you
    by the God of heaven, that each of you practice truth toward his neighbor and that each have love toward his brother. 10. And draw near to Levi in humility of heart, so that you may receive a blessing from his mouth. 11. For he will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. And bow down to his seed, because for your sake it will die in visible and invisible wars, and among you there will be an everlasting king.'
translation:
  language: pt
  text: '1. Portanto, guardem-se da imoralidade sexual e mantenham pura a mente. Guardem também os seus sentidos de toda mulher. 2. Ordenem igualmente às mulheres que não convivam intimamente com homens, para que elas também mantenham pura a mente. 3. Pois os encontros constantes, ainda que o ato ímpio não seja cometido, são para elas uma doença incurável e, para nós, uma desonra de Beliar[a] que leva à ruína e uma vergonha eterna. 4. Pois a imoralidade sexual não tem em si nem entendimento nem reverência a Deus, e todo ciúme habita no desejo dela. 5. Por isso lhes digo: vocês terão ciúme dos filhos de Levi e procurarão elevar-se acima deles, mas por isso não prevalecerão. 6. Pois Deus executará a vingança em favor deles, mas vocês morrerão de uma morte terrível. 7. Porque Deus deu a Levi o sacerdócio e, com ele, a Judá o reino.[b] 8. Não se exaltem contra esses dois, dos quais o Senhor levará a cumprimento aquilo que há de ser anunciado. 9. Eu os conjuro pelo Deus do céu: que cada um pratique
    a verdade para com o seu próximo[c] e tenha amor pelo seu irmão. 10. Aproximem-se de Levi com humildade de coração, para que recebam uma bênção da boca dele. 11. Pois ele abençoará Israel e Judá, porque nele o Senhor escolheu reinar diante de todo o povo. 12. Curvem-se diante da descendência dele[d], porque, por causa de vocês, ela morrerá em guerras visíveis e invisíveis; e entre vocês haverá um rei eterno.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Beliar” reproduz a forma grega do nome; alguns leitores conhecem a forma “Belial”.
    reason: lexical_alternative
  - marker: b
    text: 'Os versículos 7–8 são textualmente difíceis no testemunho grego preservado. A tradução apresenta o sentido provável: Levi recebe o sacerdócio e Judá, o reino, e ambos não devem ser desafiados.'
    reason: textual_variant
  - marker: c
    text: Literalmente, “faça a verdade” para com o próximo — expressão que significa agir com veracidade e fidelidade, e não apenas dizer coisas verdadeiras.
    reason: lexical_alternative
  - marker: d
    text: “Curvem-se diante da descendência dele” pode indicar homenagem ou submissão a uma linhagem descendente, sem significar necessariamente adoração divina. O referente de “dele” permanece ambíguo no contexto de Levi e Judá.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξατε
  choice: guardem-se / guardem
  rationale: Preserva a força imperativa e a ideia de vigilância moral, em português natural.
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Expressão ampla que abrange conduta sexual ilícita sem restringir indevidamente o sentido.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: mantenham pura a mente
  rationale: Comunica de modo claro a pureza contínua da faculdade interior do pensamento.
- source_word: αἰσθήσεις
  choice: sentidos
  rationale: Mantém a referência às faculdades perceptivas como vias pelas quais o desejo pode ser despertado.
- source_word: συνδιάζειν
  choice: conviver intimamente com
  rationale: Indica associação próxima e continuada sem afirmar que o próprio verbo denote relação sexual.
- source_word: συνεχεῖς συντυχίαι
  choice: encontros constantes
  rationale: Conserva a ênfase na repetição dos contatos.
- source_word: ἀσέβημα
  choice: ato ímpio
  rationale: Retém a qualificação religiosa e moral do ato.
- source_word: νόσος ἀνίατος
  choice: doença incurável
  rationale: Preserva diretamente a metáfora patológica do texto.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega sem harmonizá-la com a forma mais conhecida, Belial.
- source_word: σύνεσιν
  choice: entendimento
  rationale: Mantém a dimensão intelectual e moral do termo.
- source_word: εὐσέβειαν
  choice: reverência a Deus
  rationale: Explicita de modo natural a orientação religiosa da palavra no contexto.
- source_word: ζῆλος / ζηλώσετε
  choice: ciúme / terão ciúme
  rationale: O contexto indica rivalidade negativa contra os filhos de Levi, não zelo virtuoso.
- source_word: ποιεῖν ἀλήθειαν
  choice: pratique a verdade
  rationale: Preserva o idiomatismo concreto, entendido como agir com veracidade e fidelidade.
- source_word: προσκυνήσατε
  choice: inclinem-se diante de
  rationale: Expressa homenagem ou submissão sem determinar que se trate necessariamente de adoração divina.
- source_word: σπέρμα
  choice: descendência
  rationale: Representa naturalmente uma linhagem ou descendente coletivo e preserva a ambiguidade do referente.
theological_decisions:
- issue: Reconstrução dos versículos 7–8 em testemunho grego textual e sintaticamente difícil
  choice: Levi recebe o sacerdócio e Judá, associado a ele, recebe o reino; segue-se a advertência para não se exaltarem contra ambos.
  alternative: Manter uma formulação fragmentária ou não nomear explicitamente sacerdócio e reino.
  rationale: Os vestígios textuais e o contexto apoiam essa leitura tradicional, mas a dificuldade é assinalada em nota para não apresentar a reconstrução como indiscutível.
- issue: Referente de ἐν αὐτῷ em 6.11
  choice: 'Manter o pronome ambíguo: “nele”.'
  alternative: Identificar explicitamente Levi, Judá ou a descendência de um deles.
  rationale: O contexto justapõe Levi e Judá, e o texto não permite eliminar com segurança a tensão entre as linhagens sacerdotal e régia.
- issue: Força messiânica e régia de 6.12
  choice: Traduzir literalmente a homenagem à descendência, sua morte em guerras visíveis e invisíveis e a presença de um rei eterno, sem identificar explicitamente a figura.
  alternative: Interpretar a descendência exclusivamente como levítica ou o rei eterno explicitamente como messias davídico.
  rationale: A redação preserva a expectativa régia e sua possível dimensão messiânica sem impor uma harmonização confessional posterior.
- issue: Número gramatical da descendência em 6.12
  choice: Usar o coletivo feminino “descendência” e o pronome “ela”.
  alternative: Usar “descendente” no singular masculino ou “descendentes” no plural.
  rationale: A solução mantém o caráter coletivo e a ambiguidade de σπέρμα, embora o verbo grego esteja no singular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento no plural (“vocês”) adequadas à legibilidade brasileira. A tradução segue equivalência ótima, conservando imagens fortes, ambiguidades pronominais e tensões entre sacerdócio, realeza e descendência. Todos os marcadores de nota aparecem no texto principal.
