base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/010.yaml
  text: Do not look at a woman's appearance, nor associate with a married woman, nor pry into the affairs of women.
translation:
  language: pt
  text: Não dê atenção à aparência de uma mulher, nem se associe a uma mulher casada, nem se intrometa nos assuntos das mulheres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε ... ὄψιν
  choice: fixe o olhar na aparência
  rationale: Reproduz a ideia de dirigir ou prender a atenção ao aspecto visível, em português natural, sem reduzir a expressão a um simples olhar casual.
- source_word: συνδιάζετε
  choice: mantenha convivência
  rationale: O verbo indica associar-se ou manter contato próximo; esta formulação preserva a advertência sem acrescentar uma conotação sexual não expressa diretamente.
- source_word: θηλείας ὑπάνδρου
  choice: uma mulher casada
  rationale: ὕπανδρος designa uma mulher que está sob vínculo conjugal; 'mulher casada' é a equivalência moderna e clara.
- source_word: περιεργάζεσθε
  choice: procure saber
  rationale: Expressa intromissão ou curiosidade indevida de modo corrente e digno.
- source_word: πρᾶξιν γυναικῶν
  choice: dos assuntos das mulheres
  rationale: πρᾶξις pode indicar ação, conduta ou assunto; a escolha conserva a amplitude contextual sem especificação indevida.
theological_decisions:
- issue: Natureza da advertência sobre a mulher casada
  choice: mantenha convivência com
  alternative: relacione-se intimamente com
  rationale: O grego não exige que se explicite intimidade sexual; a tradução mantém a amplitude e a tensão ética do texto.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na segunda pessoa formal/impessoal de valor exortativo. Evitou-se linguagem arcaica e também uma explicitação sexual além do que o grego afirma.
