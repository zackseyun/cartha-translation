source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 8. Καὶ οὕτως ἀπόλλυται πᾶς νεώτερος⁵⁴, πνεῦμα. σκοτίζων⁵⁵ τὸν νοῦν ⌜αὐτοῦ⌝⁵⁶ ἀπὸ τῆς ἀληθείας, καὶ μὴ α, αe, *συνιὼν ἐν⁵⁷ τῷ νόμῳ τοῦ θεοῦ⁵⁸, μήτε⁵⁹ ἀκούων⁶⁰ νουθεσίας⁶¹ πλάνη καὶ φαν- πατέρων αὐτοῦ⁶² ὡς⁶³ κἀγὼ ἔπαθον⁶⁴ ἐν τῷ νεωτερισμῷ τασία. μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/008.yaml
  text: And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.
translation:
  language: pt
  text: 'E assim se perde todo jovem: obscurece a própria mente, afastando-a da verdade, não compreende a lei de Deus nem dá ouvidos à instrução de seus pais, assim como eu também sofri em minha juventude.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλλυται
  choice: se perde
  rationale: O médio/passivo pode indicar perecer, perder-se ou ser arruinado. “Se perde” conserva o alcance moral e destrutivo do verbo sem impor uma destruição física.
- source_word: σκοτίζων τὸν νοῦν αὐτοῦ ἀπὸ τῆς ἀληθείας
  choice: obscurece a própria mente, afastando-a da verdade
  rationale: Expressa tanto o escurecimento do entendimento quanto a ideia de afastamento contida em ἀπό, em português natural.
- source_word: συνιὼν ἐν τῷ νόμῳ τοῦ θεοῦ
  choice: compreende a lei de Deus
  rationale: Traduz de modo idiomático a construção grega com συνίημι e ἐν, cujo sentido é entender ou discernir no âmbito da lei de Deus.
- source_word: ἀκούων νουθεσίας πατέρων αὐτοῦ
  choice: dá ouvidos à instrução de seus pais
  rationale: “Dar ouvidos” comunica que não se trata apenas de ouvir sons, mas de acolher a admoestação ou orientação recebida.
- source_word: ἐν τῷ νεωτερισμῷ μου
  choice: em minha juventude
  rationale: No contexto, a expressão aponta para o período juvenil de Rúben; esta formulação é clara e digna em português atual.
theological_decisions:
- issue: Natureza da perdição do jovem
  choice: se perde
  alternative: é destruído
  rationale: O texto não define aqui se a ruína é física, moral ou escatológica. A escolha preserva essa abertura sem ampliar a afirmação teológica.
- issue: Referente de “pais”
  choice: seus pais
  alternative: seus antepassados
  rationale: πατέρων pode designar pais ou ancestrais. O contexto imediato de instrução familiar favorece “pais”, em consonância com a leitura da fonte de consulta, sem introduzir uma tradição interpretativa específica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sequência participial grega foi convertida em orações coordenadas para evitar uma frase artificial, mantendo a relação entre perdição, obscurecimento da mente, falta de compreensão e recusa da instrução.
