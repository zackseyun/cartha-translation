source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '[7. Ἐπὶ⁴⁷ πᾶσι δὲ⁴⁸ τούτοις *τὸ νου, τὸ πνεῦμα⁴⁹ τοῦ ὕπνου⁵⁰ συνάπτεται⁵¹ *ὃ ἐστι⁵² *πλάνης καὶ ὄγδοον φαντασίας⁵³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/007.yaml
  text: And over all these, the spirit of sleep is joined, which is error and the eighth of fantasy.
translation:
  language: pt
  text: E, além de todos estes, associa-se o espírito do sono, que é de engano e o oitavo da fantasia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego desta frase é difícil e parece textualmente irregular. A expressão traduzida por “o oitavo da fantasia” também pode ser entendida, mediante uma reorganização do texto, como “o oitavo espírito, ligado ao engano e à fantasia”. A sequência τὸ νου, presente na fonte antes de “o espírito”, não oferece sentido gramatical seguro e não foi representada no texto principal.
    reason: Preservar a incerteza textual e sintática sem impor uma reconstrução conjectural ao leitor.
lexical_decisions:
- source_word: Ἐπὶ πᾶσι ... τούτοις
  choice: além de todos estes
  rationale: Neste contexto enumerativo, a expressão acrescenta outro espírito aos já mencionados; “além de” comunica isso com naturalidade.
- source_word: τὸ πνεῦμα τοῦ ὕπνου
  choice: o espírito do sono
  rationale: Tradução formal e direta, preservando a linguagem antropológica do texto.
- source_word: συνάπτεται
  choice: associa-se
  rationale: O verbo indica ligação ou junção; a forma pronominal conserva a voz média/passiva sem explicitar um agente.
- source_word: πλάνης
  choice: de engano
  rationale: O genitivo pode indicar qualidade ou pertencimento; “engano” preserva o campo semântico de erro, extravio ou ilusão.
- source_word: φαντασίας
  choice: da fantasia
  rationale: Mantém a correspondência lexical e a ambiguidade entre imaginação, aparência ilusória e fantasia.
theological_decisions:
- issue: Relação sintática entre engano, oitavo e fantasia
  choice: que é de engano e o oitavo da fantasia
  alternative: que é o oitavo espírito, ligado ao engano e à fantasia
  rationale: A alternativa produz uma enumeração mais clara, mas resolve a construção grega difícil e redistribui suas relações sintáticas. O texto principal conserva a tensão e a estranheza do testemunho fornecido, com nota explicativa.
- issue: Expressão textual difícil τὸ νου
  choice: não incorporada ao corpo da tradução
  alternative: incluir uma referência ao entendimento/mente
  rationale: A sequência, tal como transmitida na fonte citada, é gramaticalmente problemática e não oferece sentido seguro no período. Traduzir “mente” criaria uma relação sintática especulativa; a dificuldade é registrada na nota.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe deliberadamente próxima do grego onde a construção é incerta. “Fantasia” foi mantida para não estreitar o sentido a “imaginação” nem ampliá-lo para uma interpretação psicológica moderna.
