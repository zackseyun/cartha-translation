base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/001.yaml
  text: And besides all these, there is an eighth spirit, the spirit of sleep, with which trance and the image of death were created.
translation:
  language: pt
  text: Além de todas essas coisas, há um oitavo espírito, o espírito do sono, com o qual foram criados o transe da natureza[a] e a imagem da morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o êxtase da natureza”. A expressão grega é incomum; “transe” procura conservar a ideia de um estado alterado ou suspenso, sem definir seu sentido exato.
    reason: Esclarece a tradução de ἔκστασις φύσεως e preserva a formulação incomum e ambígua do original.
lexical_decisions:
- source_word: Ἐπὶ πᾶσιν δὲ τούτοις
  choice: Além de todos esses
  rationale: Expressa naturalmente a ideia aditiva do grego sem perder a referência aos espíritos mencionados anteriormente.
- source_word: ὄγδοον πνεῦμα τοῦ ὕπνου
  choice: um oitavo espírito, o espírito do sono
  rationale: Mantém a numeração e explicita a relação genitiva de modo claro e natural em português.
- source_word: ἔκστασις φύσεως
  choice: o êxtase da natureza
  rationale: Conserva a formulação incomum e semanticamente aberta do grego, em vez de restringi-la sem necessidade a inconsciência, transe ou suspensão dos sentidos.
- source_word: εἰκὼν τοῦ θανάτου
  choice: a imagem da morte
  rationale: Tradução direta da metáfora grega que apresenta o sono como semelhante à morte.
theological_decisions:
- issue: Agência expressa em μεθ’ οὗ ἐκτίσθη
  choice: com o qual foram criados
  alternative: junto com o qual foram criados
  rationale: A construção grega pode indicar associação ou concomitância. A opção escolhida preserva a correspondência formal e a ambiguidade sem afirmar que o espírito do sono seja propriamente o criador.
translation_notes:
  register: Português atual, claro e digno, com estrutura próxima do grego. A repetição de “espírito” foi mantida para evitar uma referência pronominal menos clara. A expressão incomum “êxtase da natureza” foi preservada e explicada em nota.
