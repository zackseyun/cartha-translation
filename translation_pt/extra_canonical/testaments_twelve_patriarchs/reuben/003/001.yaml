  source_fidelity: 'A estrutura e os elementos do grego são preservados: há um oitavo espírito, identificado como o do sono, e a criação do transe/êxtase da natureza e da imagem da morte é associada a ele. «Todas essas coisas» reflete melhor o neutro τούτοις do que «todos esses».'
