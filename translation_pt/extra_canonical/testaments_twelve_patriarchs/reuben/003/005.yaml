source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 5. Πέμ- πτον πνεῦμα ὑπερηφανείας³⁰ ἵνα καυχᾶται³¹ καὶ μεγαλοφρονῇ³². *Ἕκτον πνεῦμα³³ ψεύδους³⁴ †ἐν ἀπωλείᾳ καὶ ζήλῳ†³⁵ τοῦ *πλάττειν λόγους καὶ κρύπτειν λόγους³⁶ Γαὐτοῦ†³⁷ *ἀπὸ γένους³⁸ καὶ οἰκείων³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/005.yaml
  text: Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood, in destruction and jealousy, to forge words and hide words from his own family and household.
translation:
  language: pt
  text: Quinto, um espírito de orgulho, para que a pessoa se vanglorie e tenha pensamentos grandiosos. Sexto, um espírito de falsidade, em destruição e ciúme,[a] para inventar palavras e esconder palavras de sua própria família e dos de sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego da expressão “em destruição e ciúme” é incerto; também não está clara sua ligação exata com o restante da frase.
    reason: A edição assinala †ἐν ἀπωλείᾳ καὶ ζήλῳ† como passagem textual problemática, e a construção resultante é semanticamente obscura.
lexical_decisions:
- source_word: ὑπερηφανείας
  choice: orgulho
  rationale: Equivalente natural e direto para a soberba ou arrogância expressa pelo termo.
- source_word: καυχᾶται
  choice: se vanglorie
  rationale: Preserva o sentido de gloriar-se ou jactar-se em linguagem portuguesa atual.
- source_word: μεγαλοφρονῇ
  choice: tenha pensamentos grandiosos
  rationale: Mantém a imagem de pensar grande ou elevadamente sem resolver se isso indica presunção, embora o contexto de orgulho lhe dê conotação negativa.
- source_word: ψεύδους
  choice: falsidade
  rationale: Abrange mentira e engano, ajustando-se à descrição subsequente de inventar e ocultar palavras.
- source_word: πλάττειν λόγους
  choice: inventar palavras
  rationale: πλάττειν significa moldar ou fabricar; no contexto da falsidade, 'inventar' comunica a fabricação de declarações sem exigir o sentido moderno mais específico de falsificação documental.
- source_word: κρύπτειν λόγους
  choice: esconder palavras
  rationale: Tradução deliberadamente próxima do grego, preservando a repetição de λόγους e a possível referência a declarações, assuntos ou informações.
- source_word: γένους καὶ οἰκείων
  choice: família e os de sua casa
  rationale: Distingue o grupo de parentes ou linhagem (γένος) das pessoas do círculo doméstico (οἰκεῖοι), sem fundi-los numa única categoria.
theological_decisions:
- issue: Agente das ações verbais após 'espírito de orgulho'
  choice: para que a pessoa se vanglorie e tenha pensamentos grandiosos
  alternative: para que ele se vanglorie e pense grandiosamente
  rationale: O sujeito implícito pode ser entendido como a pessoa influenciada pelo espírito; 'a pessoa' evita que o leitor atribua necessariamente a vanglória ao próprio espírito, sem impor distinção teológica adicional.
- issue: Relação de 'em destruição e ciúme' com o espírito de falsidade
  choice: manter a expressão junto de 'espírito de falsidade' e assinalar a incerteza textual
  alternative: interpretá-la como resultado, modo ou motivação da falsidade
  rationale: O texto grego está marcado como corrompido ou duvidoso na edição; a tradução não deve definir silenciosamente a relação sintática ou teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração e a repetição retórica do original foram preservadas; a passagem textualmente incerta foi mantida no corpo e explicada em nota.
