base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/006.yaml
  text: Seventh, a spirit of injustice, with thefts and acts of greed, so that it may fill the pleasures of the heart. For injustice works together with the other spirits through buying and selling.
translation:
  language: pt
  text: 6 O sétimo é o espírito de injustiça, acompanhado de furtos e atos de ganância, a fim de satisfazer a inclinação do coração para o prazer. Pois a injustiça coopera com os outros espíritos por meio das transações comerciais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδικίας
  choice: injustiça
  rationale: Equivalente direto que preserva o sentido moral amplo do termo grego.
- source_word: κλοπαὶ
  choice: furtos
  rationale: Traduz o plural grego com linguagem corrente e distingue o ato de subtrair do conceito mais amplo de injustiça.
- source_word: γρηπίσματα
  choice: atos de ganância
  rationale: O termo raro aponta para ações motivadas pela avidez; a expressão evita reduzir o sentido a um sentimento interior.
- source_word: φιληδονίαν καρδίας
  choice: desejo de prazer do coração
  rationale: Expressa a inclinação ou o amor ao prazer, em vez de tratar φιληδονία como uma pluralidade de prazeres.
- source_word: δοσοληψίας
  choice: transações comerciais
  rationale: O composto denota literalmente dar e receber e, neste contexto, refere-se às trocas ou negócios pelos quais a injustiça atua.
theological_decisions:
- issue: Relação entre a injustiça e os demais espíritos
  choice: coopera com os outros espíritos
  alternative: atua junto aos demais espíritos
  rationale: Mantém a personificação e a ideia explícita de ação conjunta em συνεργεῖ, sem explicar além do texto.
- issue: Finalidade da ação do espírito
  choice: a fim de satisfazer o desejo de prazer do coração
  alternative: a fim de encher o coração de desejo de prazer
  rationale: A transmissão grega da oração está textualmente difícil; a formulação segue o sentido mais provável e a camada inglesa auditada, sem introduzir um possuidor específico para o coração.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A enumeração foi explicitada com «O sétimo é», e a linguagem moral permanece concreta sem terminologia denominacional.
