    issue: Formulação da finalidade ligada a φιληδονίαν καρδίας
    rationale: «Desejo de prazer do coração» é pouco idiomático em português e pode sugerir uma abstração singular excessivamente definida. O trecho grego é textualmente difícil; «inclinação do coração para o prazer» conserva a ambiguidade e a ideia de amor ao prazer sem impor um possuidor ou uma leitura doutrinária.
