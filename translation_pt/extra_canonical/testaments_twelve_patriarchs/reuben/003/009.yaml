  text: And now, my children, love the truth, and it will guard you. Hear the words of Reuben, your father, as I teach you.
translation:
  language: pt
  text: E agora, meus filhos, amem a verdade, e ela os guardará. Ouçam as palavras de Rúben, seu pai, enquanto os ensino.
