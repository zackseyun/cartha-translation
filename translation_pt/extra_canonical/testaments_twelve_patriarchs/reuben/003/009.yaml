lexical_decisions:
- source_word: τὴν ἀλήθειαν ἀγαπᾶτε
  choice: amem a verdade
  rationale: Reproduz diretamente o imperativo e seu objeto, em português atual e digno.
- source_word: φυλάξει ὑμᾶς
  choice: os guardará
  rationale: Mantém a imagem de proteção expressa por φυλάσσω sem ampliá-la para uma promessa mais específica de segurança.
- source_word: Ἀκούσατε λόγους Ῥουβὴμ
  choice: Ouçam as palavras de Rúben
  rationale: Expressa naturalmente o imperativo plural e entende λόγους como o conteúdo verbal de Rúben.
- source_word: διδάσκω ὑμᾶς
  choice: enquanto os ensino
  rationale: Preserva a forma verbal em primeira pessoa e a relação circunstancial adotada na camada inglesa auditada.
