base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/003.yaml
  text: First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of greediness of the belly.
translation:
  language: pt
  text: Primeiro, o espírito da imoralidade sexual está alojado na natureza e nos sentidos. Segundo, o espírito da voracidade do ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Expressa de modo claro e atual a conduta sexual ilícita indicada pelo termo, sem restringi-la a uma única forma.
- source_word: ἐν τῇ φύσει
  choice: na natureza
  rationale: Preserva a formulação ampla e a possível ambiguidade de φύσις, sem explicá-la como se designasse inequivocamente a natureza humana ou corporal.
- source_word: ταῖς αἰσθήσεσιν
  choice: nos sentidos
  rationale: Equivalente natural que conserva a referência às faculdades sensoriais ou percepções.
- source_word: ἔγκειται
  choice: está alojado
  rationale: Comunica a ideia de algo situado ou arraigado no interior, mantendo a força da imagem grega.
- source_word: ἀπληστείας γαστρός
  choice: voracidade do ventre
  rationale: Traduz a cobiça ou insaciabilidade ligada ao ventre de forma concisa, digna e compreensível.
theological_decisions:
- issue: Relação do espírito da imoralidade sexual com a natureza e os sentidos
  choice: Manter a afirmação literal de que ele está alojado na natureza e nos sentidos
  alternative: Interpretar φύσις como natureza humana caída, corpo ou constituição física
  rationale: O grego não especifica qual sentido de φύσις se pretende; a tradução preserva essa tensão sem impor uma antropologia denominacional.
- issue: Elipse verbal na segunda enumeração
  choice: 'Conservar a frase nominal: “Segundo, o espírito...”'
  alternative: Suprir “é” ou repetir “está alojado”
  rationale: O original apresenta uma construção elíptica. A formulação portuguesa continua inteligível e preserva a concisão da lista.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece sóbrio e sentencioso, adequado a uma enumeração moral antiga; evitou-se tanto vocabulário excessivamente técnico quanto paráfrase interpretativa.
