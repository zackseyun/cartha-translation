  source_fidelity: 'A tradução acompanha de perto a enumeração grega: mantém o terceiro e o quarto espíritos, a localização corporal «no fígado e na bílis», e a finalidade de parecer atraente. «Conflito» é uma representação aceitável de μάχης, e «feitiçaria» traduz adequadamente μαγγανείας. «Intromissões excessivas» comunica de modo defensável a nuance de περιεργεία como ocupação ou interferência indevida/excessiva.'
  naturalness: O português é moderno, claro e conserva o registro enumerativo do texto. «Para que, por meio de intromissões excessivas, a pessoa pareça atraente» é uma solução natural para o subjuntivo passivo grego sem impor gênero.
  terminology: «Fígado», «bílis», «espírito» e «feitiçaria» são escolhas precisas e consistentes com o caráter antigo do texto. «Exibicionismo» é uma contextualização interpretativa, mas aceitável para ἀρεσκείας neste paralelismo com o propósito de parecer atraente e em consonância com o registro de auditoria ინგლისês («self-display»).
