source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 4. Τρίτον πνεῦμα²¹ μάχης ἐν τῷ ἥπατι καὶ ἐν²² τῇ χόλῃ. Τέταρτον²³ πνεῦμα ἀρεσκείας²⁴ καὶ μαγ- γανείας²⁵, ἵνα διὰ²⁶ περιεργείας²⁷ ὡραῖος²⁸ ὀφθῇ²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/004.yaml
  text: Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive.
translation:
  language: pt
  text: Terceiro, um espírito de conflito no fígado e na bílis. Quarto, um espírito de exibicionismo e feitiçaria, para que, por meio de intromissões excessivas, a pessoa pareça atraente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάχης
  choice: conflito
  rationale: Expressa a ideia de luta, contenda ou disposição combativa de modo natural, sem restringi-la necessariamente ao combate físico.
- source_word: ἥπατι
  choice: fígado
  rationale: Correspondência anatômica direta do termo grego.
- source_word: χόλῃ
  choice: bílis
  rationale: Preserva a referência corporal literal e sua associação antiga com disposições passionais.
- source_word: ἀρεσκείας
  choice: exibicionismo
  rationale: No contexto, indica o desejo de agradar ou chamar atenção pela aparência; “exibicionismo” comunica essa autopromoção de modo conciso.
- source_word: μαγγανείας
  choice: feitiçaria
  rationale: O termo designa práticas mágicas, encantamentos ou artifícios de feiticeiro; “feitiçaria” é claro e mantém a carga negativa.
- source_word: περιεργείας
  choice: intromissões excessivas
  rationale: Preserva a noção de ocupação indevida, curiosidade invasiva ou atividade excessivamente elaborada, sem reduzi-la simplesmente a curiosidade.
- source_word: ὡραῖος ὀφθῇ
  choice: pareça atraente
  rationale: Traduz a ideia de ser visto como belo ou atraente, mantendo o foco na aparência percebida.
theological_decisions:
- issue: Sentido de πνεῦμα na enumeração
  choice: espírito
  alternative: disposição / impulso
  rationale: Mantém a linguagem cosmológica e antropológica explícita do texto, sem decidir se se trata de um ser pessoal ou de uma disposição interior.
- issue: Relação entre órgãos e paixões
  choice: manter literalmente “no fígado e na bílis”
  alternative: explicitar uma associação simbólica com ira ou combatividade
  rationale: O original formula uma localização corporal segundo concepções antigas; a tradução não deve substituir essa imagem por uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima da enumeração grega. Evitou-se linguagem denominacional. “A pessoa” torna natural o sujeito indeterminado de ὀφθῇ sem introduzir distinção de gênero.
