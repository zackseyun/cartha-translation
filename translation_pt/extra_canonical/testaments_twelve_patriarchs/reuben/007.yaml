base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/007.yaml
  text: And Reuben died[a], after commanding these things to his sons. And they placed him in a coffin until he was brought up from Egypt and buried in Hebron[b], in the cave where his fathers were.
translation:
  language: pt
  text: E Rúben morreu[a], depois de ordenar essas coisas a seus filhos. Eles o puseram num caixão até que fosse levado do Egito e sepultado em Hebrom[b], na caverna onde estavam seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho grego fornecido para este capítulo é muito breve e se interrompe depois de «até que». O restante da notícia do sepultamento foi traduzido com uma complementação mínima baseada no contexto narrativo do testamento, e não em um texto grego completo reconstruído.
    reason: textual_variant
  - marker: b
    text: Hebrom e a caverna dos antepassados retomam a tradição do sepultamento patriarcal em Gênesis.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέθανε
  choice: morreu
  rationale: É o equivalente direto e comum do verbo grego, sem introduzir um eufemismo ausente do texto.
- source_word: ἐντειλάμενος
  choice: depois de ordenar
  rationale: O particípio indica uma ação anterior à morte e, no contexto de um testamento patriarcal, conserva a força de uma ordem solene.
- source_word: υἱοῖς
  choice: filhos
  rationale: O grego especifica filhos, e não crianças ou descendentes em sentido genérico.
- source_word: ἔθεντο
  choice: puseram
  rationale: Expressa de modo simples e natural a ação de colocar o corpo no recipiente funerário.
- source_word: σορῷ
  choice: caixão
  rationale: O termo designa um caixão ou receptáculo funerário; «caixão» é claro em português e evita a especificidade excessiva de «sarcófago».
- source_word: ἕως
  choice: até que
  rationale: Preserva o sentido temporal aberto do grego, embora o testemunho fornecido se interrompa imediatamente depois dessa palavra.
theological_decisions:
- issue: Como tratar o testemunho grego extremamente breve e truncado deste capítulo
  choice: Traduzir diretamente o trecho preservado e completar a notícia do sepultamento apenas no mínimo exigido pelo contexto narrativo conhecido.
  alternative: Deixar a frase interrompida depois de «até que» ou reconstruir um final mais extenso com base em outros testemunhos e edições.
  rationale: A frase fragmentária, sozinha, seria pouco útil como texto de capítulo, enquanto uma reconstrução extensa ultrapassaria a evidência grega fornecida. A conclusão adotada é explicitamente identificada em nota e conserva a tensão textual sem apresentá-la como se estivesse integralmente preservada no testemunho citado.
- issue: Designação dos patriarcas sepultados na caverna
  choice: antepassados
  alternative: pais
  rationale: No contexto da tradição funerária patriarcal, «antepassados» comunica naturalmente a referência genealógica em português e evita a leitura restrita de pais imediatos, sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A redação mantém a simplicidade narrativa do grego; «essas coisas» retoma naturalmente as instruções anteriores, e a nota textual torna transparente a complementação posterior ao ponto em que o testemunho grego se interrompe.
