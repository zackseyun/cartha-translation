base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/005.yaml
  text: Therefore, my children, I tell you, keep all that I command you, and you will certainly not sin.
translation:
  language: pt
  text: 'Por isso, meus filhos, eu lhes digo: guardem tudo o que lhes ordeno, e de modo nenhum pecarão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa naturalmente a relação conclusiva ou causal do grego sem torná-la mais específica.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Equivalente direto e natural, preservando o tom paternal da exortação.
- source_word: φυλάξατε
  choice: guardem
  rationale: Mantém a ideia de observar e cumprir cuidadosamente as ordens, com dicção bíblica clara em português.
- source_word: πάντα ὅσα ἐντέλλομαι ὑμῖν
  choice: tudo o que lhes ordeno
  rationale: Reproduz o alcance abrangente de πάντα ὅσα e o sentido de autoridade de ἐντέλλομαι.
- source_word: οὐ μὴ ἁμάρτητε
  choice: de modo nenhum pecarão
  rationale: A construção οὐ μή com o subjuntivo aoristo exprime uma negação futura enfática; esta formulação preserva sua força sem acrescentar uma ideia de impecabilidade permanente.
theological_decisions:
- issue: Força e alcance de οὐ μὴ ἁμάρτητε
  choice: de modo nenhum pecarão
  alternative: certamente não pecarão
  rationale: A opção escolhida conserva a negação enfática do grego. O contexto liga a declaração à observância das ordens dadas, sem exigir que se resolva aqui a tensão teológica como uma afirmação absoluta de impecabilidade.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis e legibilidade brasileira. Os dois imperativos plurais são vertidos por formas de terceira pessoa do plural, evitando regionalismo excessivo; os dois-pontos tornam clara a introdução da exortação.
