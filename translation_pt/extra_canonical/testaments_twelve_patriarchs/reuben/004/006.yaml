id: T12P.REU.4.6
reference: Testament of Reuben 4:6
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Βόθρος γάρ ἐστι ψυχῆς ἡ ἁμαρτία τῆς πορνείας⁵², χωρίζουσα ἀπὸ⁵³ θεοῦ καὶ προσεγγίζουσα *τοῖς εἰδώλοις⁵⁴, ὅτι αὕτη *ἐστὶν ἡ⁵⁵ πλανῶσα τὸν νοῦν *καὶ τὴν διάνοιαν⁵⁶, καὶ κατάγει⁵⁷ νεανί- σκους εἰς ᾅδην, οὐκ ἐν καιρῷ αὐτῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/006.yaml
  text: For the sin of sexual immorality is a pit for the soul, separating it from God and drawing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.
translation:
  language: pt
  text: Pois o pecado da imoralidade sexual é um fosso para a alma, separando-a de Deus e aproximando-a dos ídolos; pois essa imoralidade desvia a mente e o entendimento e leva jovens ao Hades antes do seu tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βόθρος
  choice: abismo
  rationale: Expressa uma cavidade profunda e perigosa em linguagem natural e digna; preserva a metáfora de ruína para a alma.
- source_word: ἡ ἁμαρτία τῆς πορνείας
  choice: o pecado da imoralidade sexual
  rationale: Mantém explicitamente ἁμαρτία e traduz πορνεία por uma expressão abrangente e corrente, sem restringi-la a um ato específico.
- source_word: προσεγγίζουσα τοῖς εἰδώλοις
  choice: a aproxima dos ídolos
  rationale: Reproduz o movimento de aproximação indicado pelo particípio, tendo 'a alma' como referente do pronome.
- source_word: τὸν νοῦν καὶ τὴν διάνοιαν
  choice: a mente e o entendimento
  rationale: Preserva os dois termos cognitivos distintos, sem fundi-los nem impor uma diferenciação técnica excessiva.
- source_word: εἰς ᾅδην
  choice: ao Hades
  rationale: Translitera o nome grego do domínio dos mortos, evitando equipará-lo sem ressalvas a conceitos posteriores de inferno.
- source_word: οὐκ ἐν καιρῷ αὐτῶν
  choice: antes do tempo
  rationale: Verte idiomaticamente a ideia de uma morte ou descida prematura, conforme o contexto.
theological_decisions:
- issue: Relação da imoralidade sexual com os ídolos
  choice: Manter que o pecado aproxima a alma dos ídolos
  alternative: Explicitar idolatria como consequência espiritual ou culto literal
  rationale: O grego afirma a aproximação, mas não define seu mecanismo; a tradução conserva essa tensão sem comentário doutrinário.
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: inferno; mundo dos mortos
  rationale: A transliteração preserva a referência grega e evita resolver a natureza ou o estado desse domínio além do que o texto diz.
- issue: Agente dos verbos finais
  choice: Retomar 'o pecado' com 'é ele'
  alternative: Retomar 'a imoralidade sexual' com pronome feminino
  rationale: O antecedente gramatical principal é ἡ ἁμαρτία, 'o pecado'; a formulação portuguesa explicita a retomada e evita ambiguidade acidental.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Registro digno e direto; mantém a metáfora, o paralelismo cognitivo e a terminologia histórica 'Hades'.
