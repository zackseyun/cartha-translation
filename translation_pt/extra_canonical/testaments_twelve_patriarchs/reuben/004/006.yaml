revisions:
- from: 'Pois o pecado da imoralidade sexual é um abismo para a alma: separa-a de Deus e a aproxima dos ídolos, porque é ele que desvia a mente e o entendimento e faz jovens descerem ao Hades antes do tempo.'
  to: Pois o pecado da imoralidade sexual é um fosso para a alma, separando-a de Deus e aproximando-a dos ídolos; pois essa imoralidade desvia a mente e o entendimento e leva jovens ao Hades antes do seu tempo.
  rationale: A revisão ajusta a metáfora de Βόθρος para «fosso» e torna explícita a retomada feminina de αὕτη por «essa imoralidade». Conserva a amplitude de πορνεία, o paralelismo entre νοῦς e διάνοια, a referência não doutrinariamente definida a ᾅδης e a ideia de uma descida prematura.
