source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ γὰρ πολλοὺς ἀπώλεσεν ἡ πορνεία· ὅτι κἂν *γέρων ᾖ τις⁵⁸, κἂν⁵⁹ εὐγενής, Γκἂν πλούσιος, κἂν πένης⁶⁰, *ὀνειδισμὸν ἑαυτῷ φέρει παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων καὶ †πρόσκομμα τῷ Βελίαρ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/007.yaml
  text: For sexual immorality has destroyed many; for whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.
translation:
  language: pt
  text: Pois a imoralidade sexual destruiu muitos; pois, seja alguém velho, seja de família nobre, rico ou pobre, traz desonra sobre si diante dos filhos dos homens e uma pedra de tropeço para Beliar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego de “uma pedra de tropeço para Beliar” é difícil e possivelmente sofreu alteração na transmissão; também pode sugerir um tropeço ligado a Beliar ou usado por ele.
    reason: Sinaliza uma dificuldade textual e semântica genuína sem resolvê-la indevidamente no corpo da tradução.
lexical_decisions:
- source_word: πορνεία
  choice: imoralidade sexual
  rationale: Expressa de modo amplo e atual a conduta sexual ilícita indicada pelo termo grego, sem restringi-la a um único ato.
- source_word: ἀπώλεσεν
  choice: levou ... à perdição
  rationale: Preserva a força de ruína ou destruição do verbo, com formulação natural em português.
- source_word: εὐγενής
  choice: de família nobre
  rationale: Comunica o sentido social de nascimento ou linhagem nobre, mais precisamente do que uma qualidade moral como “nobre” poderia sugerir isoladamente.
- source_word: ὀνειδισμὸν ἑαυτῷ φέρει
  choice: traz desonra sobre si
  rationale: Reproduz a construção reflexiva e o sentido de opróbrio ou vergonha pública.
- source_word: υἱοὺς τῶν ἀνθρώπων
  choice: filhos dos homens
  rationale: Mantém a expressão semítica formal presente no grego e sua coloração antiga.
- source_word: πρόσκομμα
  choice: pedra de tropeço
  rationale: Conserva a metáfora concreta e sua possível dimensão moral, sem explicar além do texto.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega do nome, em vez de harmonizá-la silenciosamente com a variante mais conhecida “Belial”.
theological_decisions:
- issue: Relação de Beliar com o “tropeço”
  choice: “uma pedra de tropeço para Beliar”
  alternative: “uma ocasião de tropeço causada por Beliar” ou “um motivo de queda diante de Beliar”
  rationale: A construção dativa τῷ Βελίαρ é difícil e o texto transmitido traz sinal de possível corrupção. A tradução preserva a relação gramatical mais direta sem decidir se Beliar tropeça, usa o tropeço ou é sua causa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A cadência correlativa foi mantida de forma natural; “filhos dos homens” conserva deliberadamente o registro antigo da expressão grega.
