base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/009.yaml
  text: For the Egyptian woman did many things to him, and called in magicians and brought him potions; for Joseph guarded himself from every evil desire and did not accept the counsel of his soul for wicked desire.
translation:
  language: pt
  text: Pois a egípcia lhe fez muitas coisas, chamou magos e lhe ofereceu poções; porque José se guardou de todo desejo mau e não aceitou o conselho de sua alma em favor de um desejo mau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ ἐποίησεν αὐτῷ
  choice: fez muitas coisas contra ele
  rationale: Embora αὐτῷ isoladamente possa significar «a ele», o contexto hostil — magos e poções destinados a vencer a resistência de José — favorece em português a relação adversativa «contra ele».
- source_word: ἡ Αἰγυπτία
  choice: a egípcia
  rationale: Mantém a designação substantivada e concisa do grego, sem acrescentar um nome ou identificação ausente no texto.
- source_word: μάγους προσεκάλεσεν
  choice: chamou magos
  rationale: Reproduz de modo direto o ato de convocar ou chamar pessoas caracterizadas como μάγοι.
- source_word: φάρμακα αὐτῷ προσήνεγκε
  choice: lhe ofereceu poções
  rationale: φάρμακα pode designar drogas, preparados, filtros ou poções; «poções» preserva o contexto mágico sem especificar indevidamente veneno. «Ofereceu» expressa o movimento de trazer/apresentar a José.
- source_word: ἐφύλαξεν ἑαυτὸν
  choice: se guardou
  rationale: Conserva a imagem reflexiva de vigilância e autocontrole, em linguagem bíblica ainda clara no português atual.
- source_word: ἐπιθυμίαν πονηράν
  choice: uma paixão perversa
  rationale: ἐπιθυμία pode ser desejo, cobiça ou paixão. «Paixão» distingue esta expressão do provável complemento anterior «todo desejo mau», evitando repetição pesada sem eliminar seu caráter moralmente negativo.
- source_word: οὐκ ἐδέξατο τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ
  choice: não acolheu o conselho de sua alma
  rationale: Mantém a personificação e a antropologia expressiva do original, em vez de explicá-las como simples pensamento ou impulso.
theological_decisions:
- issue: Relação entre autocontrole e a inclinação interior de José
  choice: Preservar «se guardou» e «não acolheu o conselho de sua alma» como duas afirmações complementares.
  alternative: Parafrasear tudo como «resistiu aos seus maus impulsos».
  rationale: A formulação grega mantém tanto a ação deliberada de José quanto a voz interior da ψυχή; condensá-las resolveria a tensão antropológica do texto.
- issue: Valor causal do conector ἐπειδὴ γὰρ
  choice: Traduzir por «porque».
  alternative: Introduzir contraste com «mas».
  rationale: O texto transmitido apresenta uma explicação causal, não uma conjunção adversativa explícita; por isso não se acrescenta «mas».
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência bíblica. A sintaxe conserva a cadeia narrativa do grego, mas evita um literalismo pouco natural. Não há marcadores de nota, pois nenhuma nota editorial foi necessária.
