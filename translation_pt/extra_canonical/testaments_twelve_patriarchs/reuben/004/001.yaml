  text: Μὴ οὖν προσέχετε, Γτέκνα μου1, κάλλος2 γυναικῶν3, μηδὲ ἐννοεῖσθε4 τὰς πράξεις αὐτῶν· ἀλλὰ πορεύεσθε ἐν5 ἁπλότητι καρδίας, ἐν φόβῳ κυρίου6, καὶ μοχθοῦντες7 ἐν ἔργοις *καλοῖς, καὶ8 *ἐν γράμμασι, καὶ ἐν τοῖς ποιμνίοις9 ὑμῶν, ἕως οὗ10 *ὁ κύριος δώῃ ὑμῖν11 *σύζυγον, ἣν αὐτὸς θέλει12, ἵνα μὴ πάθητε13, ὡς κἀγώ14.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/001.yaml
  text: Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.
translation:
  language: pt
  text: Portanto, meus filhos, não deem atenção à beleza das mulheres, nem fiquem pensando no que elas fazem. Em vez disso, vivam com simplicidade de coração e no temor do Senhor, dedicando-se às boas obras, aos estudos e aos seus rebanhos, até que o Senhor lhes dê a esposa que ele próprio quiser, para que vocês não sofram como eu sofri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: deem atenção
  rationale: Reproduz a exortação a não fixar a atenção, sem ampliar o verbo para ideias como desejo ou cobiça que não estão expressas.
- source_word: ἐννοεῖσθε τὰς πράξεις αὐτῶν
  choice: fiquem pensando no que elas fazem
  rationale: Expressa em português natural a ideia de ocupar a mente com os atos delas; mantém o sentido amplo de πράξεις.
- source_word: ἁπλότητι καρδίας
  choice: simplicidade de coração
  rationale: Preserva a imagem e a abertura semântica do grego, que pode envolver singeleza, integridade e ausência de duplicidade.
- source_word: ἐν γράμμασι
  choice: aos estudos
  rationale: Neste contexto de atividades às quais alguém se dedica, γράμματα indica letras, instrução ou aprendizado; 'estudos' é claro e idiomático.
- source_word: σύζυγον
  choice: uma esposa
  rationale: No contexto da exortação dirigida aos filhos acerca das mulheres, o substantivo designa naturalmente uma esposa, embora seu sentido básico seja cônjuge ou companheira.
- source_word: ἣν αὐτὸς θέλει
  choice: que ele próprio escolher
  rationale: Comunica idiomaticamente que a esposa será aquela desejada ou determinada pelo Senhor, preservando a ênfase de αὐτός.
theological_decisions:
- issue: Ação do Senhor na concessão da esposa
  choice: até que o Senhor lhes dê uma esposa que ele próprio escolher
  alternative: até que o Senhor lhes dê a esposa que ele próprio quiser
  rationale: A formulação mantém explícita a iniciativa divina de δώῃ e a ênfase de αὐτός, sem desenvolver uma doutrina mais ampla de predestinação matrimonial.
- issue: Sentido de 'temor do Senhor'
  choice: no temor do Senhor
  alternative: com reverência pelo Senhor
  rationale: Mantém a expressão religiosa tradicional e a tensão semântica de φόβος entre temor e reverência, sem reduzi-la a apenas um desses aspectos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais ('vocês', 'deem'). A estrutura longa do grego foi levemente segmentada para clareza, sem alterar a sequência argumentativa. 'Boas obras', 'simplicidade de coração' e 'temor do Senhor' foram mantidos por sua precisão e ressonância bíblica.
