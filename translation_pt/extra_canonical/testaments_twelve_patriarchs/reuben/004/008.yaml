source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Ἠκούσατε γὰρ περὶ Ἰωσὴφ πῶς ἐφύλαξεν ἑαυ- τὸν ἀπὸ⁶² γυναικός, καὶ τὰς ἐννοίας ἐκαθάρισεν⁶³ ἀπὸ πάσης⁶⁴ πορνείας, Γκαὶ⁶⁵ εὗρεν χάριν ἐνώπιον θεοῦ⁶⁶ καὶ ἀνθρώ- πων.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/008.yaml
  text: For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from all sexual immorality, and found favor before God and men.
translation:
  language: pt
  text: Pois vocês ouviram a respeito de José, como ele se guardou de uma mulher, purificou seus pensamentos de toda imoralidade sexual e encontrou favor diante de Deus e dos seres humanos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαξεν ἑαυτόν
  choice: se guardou
  rationale: Mantém a ideia reflexiva de proteger ou preservar a si mesmo, em formulação natural e digna.
- source_word: γυναικός
  choice: de uma mulher
  rationale: O grego não traz artigo e, neste contexto, indica a mulher de cuja sedução José se resguardou.
- source_word: τὰς ἐννοίας
  choice: seus pensamentos
  rationale: Expressa de modo corrente as disposições ou pensamentos interiores indicados pelo substantivo grego.
- source_word: πάσης πορνείας
  choice: toda imoralidade sexual
  rationale: Reproduz de forma direta e abrangente o sentido sexual de πορνεία sem acrescentar a noção interpretativa de 'todo tipo de'.
- source_word: χάριν
  choice: favor
  rationale: Preserva o sentido de aceitação ou boa disposição recebida, além da ressonância bíblica usual do termo.
- source_word: ἀνθρώπων
  choice: dos seres humanos
  rationale: Representa o plural genérico inclusivo, evitando que 'homens' seja entendido apenas como pessoas do sexo masculino.
theological_decisions:
- issue: Relação entre pureza interior e favor recebido
  choice: Manter a sequência narrativa sem explicitar causalidade
  alternative: Traduzir de modo que o favor pareça recompensa direta pela pureza
  rationale: O texto coordena as ações e o resultado, mas não formula explicitamente uma doutrina causal; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento plural 'vocês' comunica com clareza ἠκούσατε; a sintaxe permanece próxima do grego sem soar artificial.
