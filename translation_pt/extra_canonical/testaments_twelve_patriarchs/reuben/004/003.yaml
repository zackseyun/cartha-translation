  source_fidelity: A tradução preserva corretamente συνείδησις como «consciência» e τύπτει com a imagem concreta de «golpeia». Contudo, «por causa do meu pecado» explicita uma relação causal que não é a formulação mais direta de περί, cujo sentido aqui é «a respeito de / quanto a».
