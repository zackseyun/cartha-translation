  text: And even now my conscience strikes me concerning my sin.
translation:
  language: pt
  text: E até agora a minha consciência me golpeia a respeito do meu pecado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνείδησίς
  choice: consciência
  rationale: Equivalente direto e natural em português, preservando o sentido de consciência moral.
- source_word: τύπτει
  choice: golpeia
  rationale: Mantém a imagem concreta de bater ou ferir presente no verbo grego, sem suavizá-la para ‘atormenta’.
- source_word: περὶ τῆς ἁμαρτίας μου
  choice: por causa do meu pecado
  rationale: Neste contexto, περί indica o motivo pelo qual a consciência o golpeia; a formulação é clara e idiomática em português.
theological_decisions:
- issue: Intensidade da atuação da consciência
  choice: me golpeia
  alternative: me atormenta / me acusa
  rationale: ‘Golpeia’ preserva a metáfora do grego τύπτει e evita substituir a imagem original por uma interpretação psicológica ou jurídica.
translation_notes:
  register: Português moderno, digno e acessível. A ordem com ‘até agora’ conserva a ênfase temporal do grego, e a metáfora física foi mantida de modo inteligível.
