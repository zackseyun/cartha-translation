  text: Διὰ τοῦτο⁷³ ὁ θεὸς τῶν πατέρων ὑμῶν⁷⁴ ἐρρύσατο αὐτὸν ἀπὸ παντὸς πονηροῦ⁷⁵ κεκρυμμένου θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/010.yaml
  text: Therefore the God of your fathers delivered him from every hidden evil death.
translation:
  language: pt
  text: Por isso, o Deus dos seus pais o livrou de toda morte má e oculta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Por isso
  rationale: Expressa de modo natural a relação conclusiva ou causal do grego.
- source_word: ὁ θεὸς τῶν πατέρων ὑμῶν
  choice: o Deus dos seus pais
  rationale: Preserva a referência ancestral e o plural de segunda pessoa, que em português corrente é expresso naturalmente por “seus”.
- source_word: ἐρρύσατο
  choice: livrou
  rationale: Traduz o aoristo de ῥύομαι como ação efetiva de resgate ou libertação.
- source_word: ἀπὸ παντὸς πονηροῦ κεκρυμμένου θανάτου
  choice: de toda morte má e oculta
  rationale: Mantém πονηροῦ e κεκρυμμένου ligados a θανάτου, sem dividir a expressão em dois objetos distintos.
theological_decisions:
- issue: Relação dos qualificativos πονηροῦ e κεκρυμμένου com θανάτου
  choice: 'Ambos qualificam “morte”: “morte má e oculta”.'
  alternative: “todo mal oculto e da morte”
  rationale: A concordância no genitivo singular favorece a leitura em que πονηροῦ e κεκρυμμένου modificam θανάτου. A tradução evita criar dois livramentos separados.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. “Má” preserva a força moral de πονηρός sem tornar a frase excessivamente interpretativa.
