  text: '1[a]. Then an angel of the Lord appeared to Jacob and said, “Rachel will bear two children, because she despised intercourse with a husband and chose self-control.” 2. And Leah took mandrakes, and for them hired me for one night. 3. Because of the mandrakes, therefore, Jacob went in to Rachel rather than to me. 4. But the Lord gave heed to my prayer, and I conceived. 5. For I envied Rachel because she was bearing children, while I was childless. 6. And the Lord heard me, and he gave me this fruit. 7. Because I had offered the mandrakes to the Lord through the priest of the Most High, therefore he gave me Issachar as wages. 8. So then, my children, hear Issachar your father. 9. I was born as wages because of the mandrakes, and I became to my father a reward of hire. 10. Therefore I was called Issachar, which means “hire.” 11. And now, children, hear me: walk in simplicity of heart, because I have seen that all who are guileless in heart prevail over every evil. 12. For if a man does
    not desire gold[b], he does not wrong his neighbor; he does not crave many delicacies; he does not delight in varied clothing. 13. He does not long to live many days; only he waits for the will of God. 14. And the spirits of deceit have no power against him, for he does not look on the beauty of women, lest he pollute his mind with corruption. 15. There is no envy in his thoughts, no malicious person darkens his soul, and no greed distresses his life. 16. He walks in uprightness of life, and he sees all things in sincerity, shunning excess in the desire for worldly gain, so that he may not see the corruption of the commandments of the Lord. 17. Therefore, my children, keep the law of God, and gain singleness of heart, and walk without guile, not busying yourselves with meddling in the affairs of your neighbor, 18. but love the Lord and your neighbor; have compassion on the poor and the weak. 19. Bow your back to farming, and labor in all kinds of fieldwork, offering thanksgiving to the
    Lord. 20. For from the firstfruits of the earth the Lord will bless you, just as he blessed all the saints from Abel until now. 21. For no other portion is given to you than the fatness of the earth, whose fruits are raised by toil. 22. For our father Jacob blessed me with blessings of the earth and of firstfruits. 23. Levi and Judah were glorified by the Lord among the sons of Jacob; to them he gave an inheritance, and to me he gave the things of the earth, with firstfruits of fruits. 24. Therefore be not eager for adornment, nor for luxury in food, 25. but cultivate the land in singleness of heart, and take from it the firstfruits for the Lord. 26. For if you do these things, every spirit of Beliar will flee from you, and no deed of wickedness will rule over you. 27. And you will eat every good thing of the earth, and your sons after you. 28. But know that in the last times your sons will abandon singleness of heart, and will cling to insatiable desire; 29. they will forsake innocence
    and draw near to malice; they will leave the commandments of the Lord and cling to Beliar; 30. they will abandon farming and follow after their own evil schemes; and they will be scattered among the nations and serve their enemies. 31. Therefore tell these things to your children, so that if they sin, they may quickly return to the Lord. 32. For he is merciful[c], and he will deliver them and bring them back into their land.'
translation:
  language: pt
  text: '## Testamento de Issacar 2


    **1.** Então, um anjo do Senhor apareceu a Jacó e lhe disse: “Raquel dará à luz filhos, porque desprezou a união sexual com o marido[a] e escolheu o domínio próprio.”


    **2.** E, se Lia, minha mãe, não tivesse dado os dois frutos[b] em troca da união sexual, ainda teria dado à luz oito filhos; por isso, deu à luz seis, e Raquel deu à luz os outros dois, porque, por causa das mandrágoras[c], o Senhor a visitou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as relações conjugais”. O grego emprega uma formulação forte, que também pode ser vertida como “desprezou a relação com um homem”.'
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “os dois frutos” ou “as duas maçãs”. Pelo contexto, trata-se dos frutos da mandrágora mencionados em seguida; compare Gênesis 30.14–18.
    reason: lexical_alternative
  - marker: c
    text: A passagem interpreta o episódio das mandrágoras de Gênesis 30.14–18, mas sua formulação e sua explicação teológica não coincidem em todos os detalhes com a narrativa de Gênesis.
    reason: cross_reference
lexical_decisions:
- source_word: κατέπτυσεν
  choice: desprezou
  rationale: O verbo expressa rejeição com forte carga de desdém. “Desprezou” conserva a formulação incisiva do testemunho grego, sem suavizá-la.
- source_word: συνουσία
  choice: relações conjugais
  rationale: No contexto, o termo designa união sexual com o marido. A expressão é clara e digna em português, sem perder a referência sexual.
- source_word: ἐγκράτεια
  choice: domínio próprio
  rationale: Termo ético que denota autocontrole ou continência. “Domínio próprio” é corrente no português bíblico moderno e mantém a dimensão moral.
- source_word: τὰ δύο μῆλα
  choice: os dois frutos
  rationale: μῆλα pode designar maçãs ou frutos de modo mais amplo. Como a frase seguinte identifica as mandrágoras, “frutos” preserva a relação sem introduzir a imagem potencialmente enganosa de maçãs comuns.
- source_word: ἀντὶ συνουσίας ἀπέδοτο
  choice: dado ... em troca de relações conjugais
  rationale: A construção indica que Lia cedeu os frutos como contrapartida pela relação conjugal; a tradução mantém explicitamente a lógica de troca do relato.
- source_word: ἐπεσκέψατο
  choice: visitou
  rationale: “Visitar” conserva o idioma bíblico de intervenção favorável do Senhor, sem especificar além do que o grego afirma.
- source_word: μανδραγόροις
  choice: mandrágoras
  rationale: É a identificação convencional da planta ligada ao episódio de Gênesis 30. A forma portuguesa é precisa e reconhecível.
theological_decisions:
- issue: A afirmação de que Raquel desprezou as relações conjugais
  choice: Traduzir diretamente a linguagem forte do grego e apresentar o domínio próprio como motivo da promessa.
  alternative: Suavizar para “absteve-se temporariamente” ou harmonizar a afirmação com a narrativa de Gênesis.
  rationale: O texto grego associa explicitamente a futura maternidade de Raquel ao desprezo pela συνουσία e à escolha da ἐγκράτεια. A tensão com Gênesis e com expectativas acerca do matrimônio deve permanecer visível.
- issue: A distribuição de oito filhos entre Lia e Raquel
  choice: 'Manter a lógica contrafactual: Lia teria tido oito, mas teve seis; Raquel teve os outros dois.'
  alternative: Reformular a passagem para ajustá-la mais diretamente à sequência narrativa de Gênesis.
  rationale: Essa é a explicação etiológica oferecida pelo testemunho grego. A tradução não deve corrigir nem harmonizar sua interpretação particular.
- issue: A visita do Senhor “por meio das mandrágoras”
  choice: Preservar a relação causal ou instrumental expressa pela passagem.
  alternative: Tratar as mandrágoras apenas como circunstância temporal ou negar qualquer conexão entre elas e a visita divina.
  rationale: A redação grega liga a visita do Senhor às mandrágoras. “Por meio de” mantém essa ligação incomum sem explicar seu mecanismo.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e compreensão internacional. A sintaxe foi moderadamente ajustada para clareza, mas conservaram-se a linguagem incisiva acerca de Raquel, o contrafactual sobre os oito filhos e a ligação teológica incomum entre as mandrágoras e a visita do Senhor. O rascunho traduz somente o material grego fornecido para o capítulo 2, que contém dois versículos; não incorpora o conteúdo adicional da camada inglesa, pois ele não corresponde ao trecho-fonte apresentado.
