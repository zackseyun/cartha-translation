  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/006.yaml
  text: But he walks in simplicity of soul; he sees all things with uprightness of heart, not accepting evil eyes from the world’s error, so that he may not see the commandments of the Lord as distorted.
translation:
  language: pt
  text: Mas ele anda com simplicidade de alma; vê todas as coisas com retidão de coração, sem acolher olhos maus provenientes do engano do mundo, para não ver os mandamentos do Senhor como distorcidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότητι ψυχῆς
  choice: com simplicidade de alma
  rationale: Preserva a expressão antropológica e a ideia de singeleza, sinceridade e ausência de duplicidade.
- source_word: πάντα ὁρᾷ
  choice: vê todas as coisas
  rationale: Traduz diretamente o grego sem restringir indevidamente o alcance de πάντα.
- source_word: ἐν εὐθύτητι καρδίας
  choice: com retidão de coração
  rationale: Expressão natural e dignificada em português, mantendo o sentido moral de εὐθύτης.
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηρούς
  choice: sem acolher um olhar maligno
  rationale: ἐπιδέχομαι sugere receber ou acolher; o singular coletivo em português comunica de modo natural a perspectiva moral expressa literalmente por “olhos malignos”.
- source_word: ἀπὸ τῆς πλάνης τοῦ κόσμου
  choice: proveniente do engano do mundo
  rationale: Mantém a relação de origem marcada por ἀπό e traduz πλάνη sem decidir entre engano objetivo e erro moral.
- source_word: ἵνα μὴ ἴδῃ διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  choice: para não ver como distorcidos os mandamentos do Senhor
  rationale: 'Preserva a construção perceptiva: não são necessariamente os mandamentos que se tornam distorcidos, mas são vistos dessa maneira.'
theological_decisions:
- issue: Natureza da distorção dos mandamentos
  choice: “ver como distorcidos os mandamentos”
  alternative: “ver os mandamentos distorcidos”
  rationale: A formulação escolhida conserva a tensão do grego e evita afirmar que os próprios mandamentos do Senhor sejam objetivamente deformados.
- issue: Sentido de “olhos malignos”
  choice: “um olhar maligno”
  alternative: “olhos malignos”
  rationale: A expressão foi vertida idiomaticamente como uma maneira moralmente corrompida de olhar, sem impor uma interpretação demonológica ou denominacional.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira e alcance internacional. Conserva o paralelismo entre alma e coração e mantém a ambiguidade moral de πλάνη.
