base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/005.yaml
  text: He does not envy in deliberations, nor does malicious envy consume his soul, nor is there distraction in greed in his mind.
translation:
  language: pt
  text: Ele não sente inveja nas deliberações, nem a inveja maliciosa consome a sua alma,[a] nem há em sua mente distração por ganância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração “nem a inveja maliciosa consome a sua alma” aparece entre colchetes na edição grega consultada, o que indica incerteza em sua transmissão textual.
    reason: Sinalizar ao leitor a incerteza textual indicada pela própria edição-fonte, sem omitir a oração do texto principal.
lexical_decisions:
- source_word: ζηλοῖ
  choice: sente inveja
  rationale: Neste contexto negativo, o verbo exprime inveja ou ciúme; a locução é natural em português e evita o sentido positivo de “zelar”.
- source_word: διαβουλίοις
  choice: deliberações
  rationale: Conserva a ideia de discussões ou processos de reflexão voltados para uma decisão, sem acrescentar o possessivo ausente no grego.
- source_word: βάσκανος
  choice: inveja maliciosa
  rationale: O termo pode caracterizar algo invejoso, maligno ou pernicioso; a formulação mantém tanto a inveja quanto seu caráter nocivo.
- source_word: ἐκτήκει
  choice: consome
  rationale: Traduz a imagem de definhar ou ser consumido gradualmente, com expressão idiomática em português.
- source_word: περισπασμός
  choice: distrai
  rationale: O substantivo denota distração ou desvio da atenção; a construção verbal produz português claro sem perder o sentido central.
- source_word: ἀπληστείᾳ
  choice: ganância
  rationale: Expressa o desejo insaciável de possuir mais, adequado ao sentido moral de ἀπληστία.
- source_word: νοΐ
  choice: mente
  rationale: Equivalente direto para a faculdade de pensar e discernir.
theological_decisions:
- issue: Relação entre ganância, distração e mente
  choice: “a ganância distrai a sua mente”
  alternative: “não há distração, por ganância, em sua mente”
  rationale: A sintaxe grega é compacta e pouco natural se reproduzida literalmente. A formulação escolhida conserva a ganância como causa ou esfera da distração, sem introduzir uma interpretação doutrinária.
- issue: Valor moral de βάσκανος
  choice: “inveja maliciosa”
  alternative: “malícia” ou “mau-olhado”
  rationale: O contexto já trata da inveja, e a tradução escolhida preserva a intensificação negativa sem importar a ideia específica de mau-olhado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “nem” preserva a estrutura cumulativa do grego; não se acrescentou “suas” a “deliberações”, pois o original não traz possessivo.
