base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/003.yaml
  text: Therefore you also tell these things to your children, so that, if they sin, they may turn back more quickly to the Lord[c],
translation:
  language: pt
  text: Portanto, vocês também digam estas coisas a seus filhos, para que, se pecarem, voltem mais depressa para o Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Voltar para o Senhor” inclui a ideia de arrependimento, bem como a de restauração.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: Portanto, vocês também
  rationale: Reproduz a conclusão expressa por οὖν e a ênfase inclusiva de καὶ ὑμεῖς em português natural.
- source_word: εἴπατε
  choice: devem dizer
  rationale: Comunica a força exortativa do imperativo aoristo sem recorrer ao pouco natural «dizei».
- source_word: τοῖς τέκνοις ὑμῶν
  choice: a seus filhos
  rationale: Equivalente direto e corrente para a referência aos descendentes imediatos.
- source_word: ἐὰν ἁμάρτωσι
  choice: se pecarem
  rationale: Mantém a condição eventual do subjuntivo grego e o sentido moral-religioso de ἁμαρτάνω.
- source_word: τάχιον
  choice: mais depressa
  rationale: Preserva explicitamente o valor comparativo do advérbio.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: voltem ... para o Senhor
  rationale: Conserva a imagem de retorno ou reorientação para Deus, com sua implicação contextual de arrependimento, sem explicitá-la no corpo do texto.
theological_decisions:
- issue: Sentido de ἐπιστρέφω em relação ao Senhor
  choice: voltem ... para o Senhor
  alternative: se arrependam e retornem ao Senhor
  rationale: A formulação escolhida preserva a imagem verbal e sua amplitude, que pode abranger arrependimento e restauração, evitando inserir dois atos onde o grego emprega um só verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural de segunda pessoa. A colocação do marcador após a frase evita interromper a leitura, e a nota preserva a riqueza semântica de ἐπιστρέφω.
