base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/002.yaml
  text: And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will slave for their enemies.
translation:
  language: pt
  text: E, abandonando o cultivo da terra, seguirão seus maus desígnios; serão dispersos entre as nações e servirão como escravos aos seus inimigos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεωργεῖν
  choice: o cultivo da terra
  rationale: Expressa de modo natural e claro a atividade agrícola indicada pelo infinitivo grego, sem restringi-la indevidamente a uma forma específica de trabalho rural.
- source_word: ἐξακολουθήσουσι
  choice: seguirão
  rationale: Preserva o sentido de acompanhar ou seguir uma orientação, aqui tendo por objeto os desígnios maus.
- source_word: πονηροῖς διαβουλίοις
  choice: maus desígnios
  rationale: Mantém a ideia de planos, deliberações ou intentos moralmente maus. “Desígnios” é digno e compreensível no registro do texto.
- source_word: διασπαρήσονται
  choice: serão dispersos
  rationale: Reproduz a voz passiva e a imagem de espalhamento entre diferentes povos.
- source_word: τοῖς ἔθνεσιν
  choice: entre as nações
  rationale: Equivalente corrente para ἔθνη neste contexto coletivo e internacional.
- source_word: δουλεύσουσιν
  choice: servirão como escravos
  rationale: Torna explícita a condição servil forte do verbo δουλεύω, evitando que o simples “servirão” soe como serviço voluntário.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação profética foi preservada, e não se acrescentou agente à forma passiva “serão dispersos”.
