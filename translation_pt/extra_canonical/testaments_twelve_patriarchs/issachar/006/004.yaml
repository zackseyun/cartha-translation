source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 4. Ὅτι ἐλεήμων ἐστὶ καὶ ἐξελεῖται²⁰ αὐτοὺς *τοῦ ἐπιστρέψαι αὐτοὺς²¹ εἰς τὴν γῆν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/004.yaml
  text: because he is merciful and will deliver them, to turn them back to their land[d].
translation:
  language: pt
  text: porque ele é misericordioso e os livrará, para fazê-los voltar à sua terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A oração final também pode ser entendida como: “e restaurá-los à sua terra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεήμων
  choice: misericordioso
  rationale: Expressa de modo natural e digno a compaixão ativa indicada pelo adjetivo grego.
- source_word: ἐξελεῖται
  choice: os livrará
  rationale: Preserva o sentido futuro de resgatar ou libertar, sem especificar um meio não declarado no texto.
- source_word: ἐπιστρέψαι
  choice: fazê-los voltar
  rationale: Mantém o valor causativo sugerido pelo acusativo αὐτούς e a ideia de retorno, sem decidir além do necessário se o sentido é apenas espacial ou também restaurador.
- source_word: εἰς τὴν γῆν αὐτῶν
  choice: à sua terra
  rationale: Tradução corrente do movimento em direção à terra que lhes pertence; em português, a contração «à» transmite naturalmente εἰς neste contexto.
theological_decisions:
- issue: Agente da misericórdia e do livramento
  choice: manter o pronome «ele» sem explicitar sua identidade
  alternative: substituir por «Deus» ou outro referente nominal
  rationale: O versículo grego usa apenas a forma verbal de terceira pessoa e o predicativo; explicitar o referente importaria informação do contexto e reduziria a abertura formal do trecho.
- issue: Relação da oração final com o livramento
  choice: «para fazê-los voltar»
  alternative: «e restaurá-los»
  rationale: A construção com τοῦ e infinitivo pode indicar finalidade ou resultado; a tradução principal conserva a ligação final, enquanto a nota registra a leitura restaurativa possível.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva a sequência do grego e sua possível tensão entre retorno físico e restauração, evitando linguagem denominacional.
