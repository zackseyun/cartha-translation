base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/001.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b].
translation:
  language: pt
  text: 6:1 Portanto, saibam, meus filhos, que, nos últimos tempos, os filhos de vocês abandonarão a simplicidade e se apegarão à ganância; deixando a inocência[a], eles se aproximarão da astúcia; e, abandonando os mandamentos do Senhor, se apegarão a Beliar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ausência de malícia” ou “ausência de dolo”. O termo grego (ἀκακία) destaca a condição de quem está livre de maldade e engano.
    reason: lexical_alternative
  - marker: b
    text: Beliar é a forma grega empregada aqui; muitos leitores conhecem esse nome como “Belial”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότης
  choice: sinceridade
  rationale: Neste contraste moral com ganância, expressa a disposição simples, íntegra e sem duplicidade; evita que “simplicidade” seja entendida apenas como falta de sofisticação.
- source_word: ἀπληστία
  choice: ganância
  rationale: Comunica de modo natural o desejo insaciável de possuir mais, em oposição à integridade desinteressada.
- source_word: ἀκακία
  choice: ausência de malícia
  rationale: Preserva o sentido etimológico e moral de estar livre de maldade ou dolo, sem reduzir o termo a mera inculpabilidade.
- source_word: πανουργία
  choice: astúcia
  rationale: Mantém a conotação negativa de esperteza ardilosa exigida pelo contraste com ἀκακία.
- source_word: κολλάω
  choice: apegar-se
  rationale: Reproduz a imagem reiterada de ligação estreita, tanto à ganância quanto a Beliar.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega atestada no texto, enquanto a nota registra a forma alternativa mais conhecida.
theological_decisions:
- issue: Identidade e grafia de Βελίαρ
  choice: Beliar
  alternative: Belial
  rationale: Mantém a forma específica do testemunho grego sem definir além do texto a natureza da figura; a variante familiar é informada em nota.
- issue: Sentido moral de ἀκακία
  choice: ausência de malícia
  alternative: inocência; ausência de dolo
  rationale: Preserva a tensão entre pureza moral e liberdade de engano, sem impor uma leitura estritamente jurídica de inculpabilidade.
translation_notes:
  register: Português moderno, digno e acessível, com construção direta. Emprega-se “vocês” para o plural de segunda pessoa, adequado à ampla legibilidade brasileira, e preserva-se a repetição de “abandonar” e “apegar-se” que estrutura os contrastes do original.
