  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003.yaml
  text: 'For if Leah my mother had not given up marital union in exchange for the two apples[a], she would still have been destined to bear eight sons. Therefore she bore six, and Rachel bore the two, because through the mandrakes the Lord visited her. For he saw that Leah desired to be with Jacob for the sake of children, and not for the sake of pleasure. For on the next day also she again gave Jacob over. Therefore through the mandrakes the Lord listened to Rachel. For although she longed for these, she did not eat them, but dedicated them in the house of the Lord, after bringing them to the priest.


    When therefore I grew to manhood, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers. And my father blessed me, seeing that I walked before him in simplicity. And I was not meddlesome in my actions, nor envious and malicious toward my neighbor. I never slandered anyone, nor did I criticize a man''s way of life. At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman''s pleasure; rather, because of my toil, sleep came over me. And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father. And the Lord multiplied my good things ten thousandfold[d][c][b], and my father likewise increased the good things for me twofold.'
translation:
  language: pt
  text: '## Testamento de Issacar 3


    **1** Quando, pois, cheguei à maturidade, meus filhos, conduzi-me com retidão de coração. Tornei-me agricultor para meu pai e para meus irmãos e trouxe dos campos os frutos na estação própria.[a]


    **2** Meu pai me abençoava, pois via que eu me conduzia diante dele com simplicidade.


    **3** Eu não me intrometia em assuntos alheios ao realizar minhas tarefas, nem era invejoso e maldoso para com o meu próximo.[b]


    **4** Nunca falei mal de ninguém, nem critiquei o modo de viver de pessoa alguma.


    **5** Aos trinta e cinco anos, tomei uma mulher por esposa, pois o trabalho árduo consumia minhas forças. Eu não pensava no prazer de uma mulher; pelo contrário, por causa da fadiga, o sono me dominava.


    **6** Meu pai sempre se alegrava com a minha simplicidade, porque eu oferecia ao Senhor, por intermédio do sacerdote, tudo o que nascia primeiro,[c] e depois também a meu pai.


    **7** E o Senhor multiplicou dez mil vezes os bens em minhas mãos. Jacó, meu pai, sabia que Deus cooperava com a minha simplicidade.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “na estação própria” apresenta variação na tradição textual.
    reason: textual_variant
  - marker: b
    text: O termo traduzido por “maldoso” também pode significar “de mau-olhado” ou “ressentido”.
    reason: lexical_alternative
  - marker: c
    text: “Tudo o que nascia primeiro” pode referir-se amplamente ao primeiro produto ou aos primeiros frutos, e não apenas à primeira cria de animais.
    reason: lexical_alternative
  - marker: d
    text: A frase final apresenta variação na tradição textual; aqui se traduz a forma do texto grego fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: ἡδρύνθην
  choice: cheguei à maturidade
  rationale: O verbo descreve o crescimento até a maturidade. A formulação comunica amadurecimento físico e social sem restringi-lo a uma idade específica.
- source_word: εὐθύτητι καρδίας
  choice: retidão de coração
  rationale: Preserva a imagem moral e interior da expressão grega em linguagem bíblica natural e clara.
- source_word: γεωργός
  choice: agricultor
  rationale: É o sentido direto no contexto dos campos e de seus frutos; evita o regionalismo potencial de 'lavrador'.
- source_word: ἁπλότης
  choice: simplicidade
  rationale: 'Mantém de forma consistente a virtude central do capítulo: uma disposição sem duplicidade, descomplicada e sincera.'
- source_word: περίεργος
  choice: me intrometia em assuntos alheios
  rationale: O termo indica ingerência indevida, não mera curiosidade. A expressão verbal é mais clara em português corrente do que 'indiscreto' ou 'intrometido' isoladamente.
- source_word: φθονερὸς καὶ βάσκανος
  choice: invejoso ou mal-intencionado
  rationale: Distingue a inveja da hostilidade sugerida por βάσκανος, ao mesmo tempo que reserva em nota a possível imagem idiomática do mau-olhado.
- source_word: κατελάλησα
  choice: falei mal
  rationale: Expressa de modo natural o ato de falar contra ou difamar alguém, sem exigir que toda ocorrência envolva acusação juridicamente falsa.
- source_word: ἔψεξα βίον ἀνθρώπου
  choice: critiquei o modo de viver de pessoa alguma
  rationale: βίος aqui se refere à vida ou conduta de uma pessoa; 'modo de viver' comunica esse alcance ético.
- source_word: ἡδονὴν γυναικός
  choice: prazer com uma mulher
  rationale: Preserva a concisão e a possível amplitude da construção genitiva, sem tornar a frase mais explícita do que o grego.
- source_word: ὁ ὕπνος μοι περιεγένετο
  choice: o sono me dominava
  rationale: Comunica idiomaticamente que, em razão da fadiga, o sono prevalecia sobre ele.
- source_word: πᾶν πρῶτον γέννημα
  choice: toda primeira cria
  rationale: A tradução conserva a noção primária de primeiro produto gerado. Uma nota registra que o contexto agrícola pode permitir referência mais ampla aos primeiros produtos.
- source_word: ἐμυριοπλασίασε
  choice: multiplicou dez mil vezes
  rationale: Reproduz a força hiperbólica e concreta do verbo, em vez de reduzi-lo simplesmente a 'multiplicou muito'.
- source_word: συνεργεῖ τῇ ἁπλότητί μου
  choice: cooperava com a minha simplicidade
  rationale: Mantém a construção incomum do grego e sua tensão teológica, sem reformulá-la como simples recompensa divina.
theological_decisions:
- issue: Oferta por intermédio de um sacerdote no período patriarcal
  choice: Manter no texto a referência explícita ao sacerdote
  alternative: Harmonizar com Gênesis, omitindo ou suavizando a referência cultual
  rationale: O testemunho grego fornecido menciona expressamente o sacerdote. A tradução deve preservar essa apresentação do texto, mesmo que pareça refletir uma moldura cultual posterior.
- issue: Relação entre a ação de Deus e a simplicidade de Issacar
  choice: Traduzir literalmente que Deus 'cooperava com' sua simplicidade
  alternative: Explicar que Deus o recompensava ou fazia prosperar por causa de sua simplicidade
  rationale: A formulação grega é teologicamente sugestiva e não especifica de modo inequívoco recompensa, causa ou mérito. A tradução preserva essa abertura.
- issue: Sentido ético de ἁπλότης
  choice: Usar 'simplicidade' em todas as ocorrências
  alternative: Alternar entre sinceridade, integridade e singeleza
  rationale: A repetição é deliberada e estrutura o retrato moral de Issacar; a consistência mantém o fio temático.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva o tom testamentário sem arcaísmos desnecessários. O texto traduz somente o capítulo 3 do testemunho grego fornecido; material anterior presente na camada inglesa de consulta não foi incorporado por pertencer ao contexto precedente.
