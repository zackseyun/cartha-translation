lexical_decisions:
- source_word: πρὸς αὐτήν
  choice: lhe
  rationale: Expressa naturalmente em português o destinatário feminino já identificado pelo contexto, sem acrescentar um nome ausente deste versículo.
- source_word: ἐμός ἐστιν ὁ Ἰακώβ
  choice: Jacó é meu
  rationale: Preserva a construção enfática de posse e sua contundência no diálogo.
- source_word: ὅτι
  choice: porque
  rationale: Mantém explicitamente a relação causal apresentada por Lia.
- source_word: γυνὴ νεότητος αὐτοῦ
  choice: a mulher da juventude dele
  rationale: Reproduz de perto a expressão grega e preserva sua possível ressonância tradicional, sem reduzi-la interpretativamente a uma formulação como “primeira esposa”.
