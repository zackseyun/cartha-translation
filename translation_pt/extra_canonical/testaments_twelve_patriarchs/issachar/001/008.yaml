lexical_decisions:
- source_word: Ἔστω σοι ὁ Ἰακώβ
  choice: Que Jacó fique com você
  rationale: A construção imperativa com ἔστω e dativo indica que Jacó deve estar ou permanecer com Lia; “fique com você” é natural em português e preserva a referência contextual sem explicitar além do grego.
- source_word: τῇ νυκτὶ ταύτῃ
  choice: esta noite
  rationale: Equivalência direta e idiomática do demonstrativo temporal.
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: em troca das mandrágoras
  rationale: ἀντί expressa troca ou compensação; “em troca de” comunica claramente a relação.
- source_word: τοῦ υἱοῦ σου
  choice: do seu filho
  rationale: Mantém o genitivo e a referência pessoal do texto grego sem identificar o filho pelo nome.
