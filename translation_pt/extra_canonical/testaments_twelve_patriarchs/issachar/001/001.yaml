base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/001.yaml
  text: A copy of the words of Issachar. For he called his sons and said to them, "Listen, children, to Issachar your father; give ear to the words of one beloved by the Lord.
translation:
  language: pt
  text: 'Cópia das palavras de Issacar. Pois ele chamou seus filhos e lhes disse: “Escutem, filhos, Issacar, seu pai; deem ouvidos às palavras daquele que é amado pelo Senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Cópia
  rationale: Reproduz diretamente a ideia de uma transcrição ou cópia escrita, sem ampliar para ‘testamento’ ou ‘discurso’.
- source_word: λόγων
  choice: das palavras
  rationale: Mantém o sentido amplo de λόγοι e corresponde ao uso de ῥήματα na continuação sem impor uma distinção artificial.
- source_word: ἀκούσατε
  choice: Escutem
  rationale: Imperativo plural corrente e natural em português, preservando a convocação direta.
- source_word: τέκνα
  choice: filhos
  rationale: No contexto da fala de Issacar aos próprios descendentes imediatos, ‘filhos’ é mais natural que ‘crianças’.
- source_word: ἐνωτίσασθε
  choice: deem ouvidos
  rationale: Conserva a imagem idiomática de prestar atenção e o paralelismo com ‘Escutem’.
- source_word: ἠγαπημένου
  choice: daquele que é amado
  rationale: Preserva o particípio passivo e evita transformá-lo em uma declaração de mérito ou favor de sentido mais específico.
- source_word: Κυρίου
  choice: Senhor
  rationale: Equivalente tradicional, claro e não sectário para Κύριος neste contexto religioso.
theological_decisions:
- issue: Identidade de ‘aquele que é amado pelo Senhor’
  choice: daquele que é amado pelo Senhor
  alternative: de mim, que sou amado pelo Senhor
  rationale: O grego usa um particípio substantivado sem pronome explícito. A formulação escolhida mantém a referência contextual a Issacar sem acrescentar um ‘mim’ ausente do texto.
- issue: Relação sintática entre ‘filhos’ e ‘Issacar, seu pai’
  choice: “Escutem, filhos, Issacar, seu pai”
  alternative: “Escutem, filhos de Issacar, seu pai”
  rationale: A pontuação trata τέκνα como vocativo e Ἰσαχὰρ τοῦ πατρὸς ὑμῶν como objeto de ‘escutem’, leitura gramaticalmente direta que evita a construção incoerente ‘filhos de Issacar seu pai’.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais brasileiras de terceira pessoa do plural. A repetição semântica entre ‘Escutem’ e ‘deem ouvidos’ foi mantida por refletir o paralelismo retórico do grego. A ordem ‘Issacar, seu pai’ é um pouco marcada, mas conserva com clareza a construção e a ênfase do original.
