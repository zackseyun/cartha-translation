  text: I. ¹᾿Αντίγραφον λόγων Ἰσαχάρ. *Καλέσας γὰρ τοὺς υἱοὺς αὐτοῦ εἶπεν αὐτοῖς²· ἀκούσατε³ τέκνα⁴ Ἰσαχὰρ τοῦ πατρὸς ὑμῶν⁵, ἐνωτίσασθε ῥήματα ἠγαπημένου⁶ ὑπὸ Κυρίου.
