    issue: A segunda ocorrência de ταῦτα foi traduzida por «elas».
    rationale: Embora o referente permaneça compreensível, o grego repete expressamente o demonstrativo («estas coisas») nas duas ocorrências; preservá-lo mantém a ênfase e a coesão verbal do enunciado.
  - severity: medium
    issue: «Eu não dei filhos a Jacó» atenua o sentido de ἐγέννησα.
    rationale: O verbo significa «gerei» ou «dei à luz», isto é, o ato de ter filhos. «Dar filhos» é possível como paráfrase, mas desloca a formulação para a ideia de concessão e fica menos próximo do original.
