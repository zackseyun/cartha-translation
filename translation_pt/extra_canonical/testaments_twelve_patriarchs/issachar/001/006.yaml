- from: 'E Raquel disse: “Não darei estas coisas a você; ficarei com elas em lugar de filhos, pois o Senhor não atentou para mim, e eu não dei filhos a Jacó.”'
  to: 'E Raquel disse: “Não lhe darei estas coisas, mas ficarei com estas coisas em lugar de filhos, pois o Senhor não atentou para mim, e não gerei filhos para Jacó.”'
  rationale: A revisão restaura a repetição de ταῦτα e traduz ἐγέννησα com um verbo que expressa diretamente gerar filhos. Mantém-se «não atentou para mim» para παρεῖδε, pois a queixa subsequente de esterilidade favorece o sentido de ter sido negligenciada ou passada por alto, não o de uma simples atenção favorável.
