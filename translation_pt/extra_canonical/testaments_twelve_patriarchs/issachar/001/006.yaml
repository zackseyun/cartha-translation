  verdict: revise
  source_fidelity: A tradução capta a recusa, a conservação dos objetos como substituto de filhos e a queixa pela ausência de filhos. Contudo, o segundo ταῦτα deve ser preservado como demonstrativo explícito, e ἐγέννησα é mais precisamente «gerei»/«dei à luz» do que «dei filhos». «O Senhor não atentou para mim» representa adequadamente παρεῖδε no contexto.
  naturalness: O texto é claro e de registro apropriado. «Não lhe darei» e «gerei filhos para Jacó» soam naturais em português moderno e mantêm melhor as relações do grego.
  terminology: «Senhor», «filhos» e os nomes próprios estão adequados. «Em lugar de filhos» conserva a força substitutiva de ἀντὶ τέκνων sem interpretação adicional.
  issues:
