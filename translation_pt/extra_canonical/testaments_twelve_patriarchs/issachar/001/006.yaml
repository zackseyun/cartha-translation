base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/006.yaml
  text: And Rachel said, "I will not give these to you, but I will keep them in exchange for children; for the Lord has overlooked me, and I have borne no children to Jacob."
translation:
  language: pt
  text: 'E Raquel disse: “Não lhe darei estas coisas, mas ficarei com estas coisas em lugar de filhos, pois o Senhor não atentou para mim, e não gerei filhos para Jacó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: estas coisas / elas
  rationale: Mantém o demonstrativo concreto do grego sem presumir, neste versículo isolado, um antecedente que não aparece no trecho fornecido.
- source_word: σχῶ
  choice: ficarei com
  rationale: Expressa de modo natural o sentido de ter ou conservar para si no contexto da recusa de entregar os objetos.
- source_word: ἀντὶ τέκνων
  choice: em lugar de filhos
  rationale: Reproduz a ideia de substituição expressa por ἀντί, sem explicar além do texto.
- source_word: παρεῖδε
  choice: não atentou para mim
  rationale: Aqui παροράω comunica não levar em conta, desconsiderar ou deixar de olhar com favor; a oração seguinte, sobre não ter dado filhos, favorece esse sentido em vez de 'olhou para mim'.
- source_word: τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ
  choice: eu não dei filhos a Jacó
  rationale: Formulação portuguesa natural que conserva a relação dativa com Jacó e o sentido de gerar filhos para ele.
theological_decisions:
- issue: Sentido da ação do Senhor em παρεῖδε
  choice: o Senhor não atentou para mim
  alternative: o Senhor olhou para mim
  rationale: O verbo pode envolver olhar além de alguém, ignorar ou desconsiderar. A queixa de Raquel — não ter dado filhos a Jacó — exige uma formulação negativa ou privativa; traduzir simplesmente como 'olhou para mim' inverteria a lógica da frase.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com discurso direto natural. A repetição exata de ταῦτα foi suavizada por 'elas' na segunda ocorrência para evitar rigidez, sem alterar o referente.
