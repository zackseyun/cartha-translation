lexical_decisions:
- source_word: Ἔκλαιε
  choice: chorava
  rationale: O imperfeito indica uma ação em andamento; «chorava» reproduz naturalmente esse aspecto.
- source_word: ἐπὶ τῇ φωνῇ αὐτοῦ
  choice: ao ouvir seu clamor
  rationale: A expressão indica que Lia saiu em reação à voz de Rúben. «Clamor» preserva o contexto de choro sem recorrer ao menos natural «à sua voz».
- source_word: ἐξῆλθεν
  choice: saiu
  rationale: Equivalente direto e natural do aoristo de ἐξέρχομαι.
- source_word: Λεία ἡ μήτηρ μου
  choice: minha mãe Lia
  rationale: Mantém a identificação pessoal e a perspectiva em primeira pessoa com ordem natural em português.
