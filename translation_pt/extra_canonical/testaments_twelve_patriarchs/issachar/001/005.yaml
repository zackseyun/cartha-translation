  text: These were fragrant fruits, which grow in the land of Haran below a watercourse.
translation:
  language: pt
  text: 5 Esses eram frutos[a] perfumados, que crescem na terra de Harã, abaixo de um vale de águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: maçãs.'
    reason: Registra o sentido mais específico possível de μῆλα sem resolver silenciosamente sua amplitude lexical.
lexical_decisions:
- source_word: μῆλα
  choice: frutos
  rationale: Embora μῆλα possa designar especificamente maçãs, também pode ser empregado de modo mais amplo para certos frutos. “Frutos” preserva a identificação menos específica adotada pelo contexto e pela evidência de consulta; a alternativa literal é registrada em nota.
- source_word: εὔοσμα
  choice: perfumados
  rationale: Expressa de modo natural em português a ideia de frutos de cheiro agradável, sem acrescentar a noção de sabor doce.
- source_word: γίνονται
  choice: crescem
  rationale: No contexto de frutos e de seu lugar de origem, o sentido idiomático é “crescem”, em vez do genérico “tornam-se” ou “surgem”.
- source_word: ὑποκάτω φάραγγος ὑδάτων
  choice: abaixo de um curso de água
  rationale: Mantém a relação espacial de ὑποκάτω e traduz a expressão geográfica de modo claro e natural, sem especificar indevidamente a forma do canal ou vale.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O conectivo δέ não foi vertido por uma conjunção forte, pois aqui funciona como transição discursiva leve.
