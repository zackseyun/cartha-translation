source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 15. *⁶²Ἔγνω δὲ Ἰακὼβ τῇ Λείᾳ⁶², καὶ Γσυλλαβοῦσα¹ *ἔτεκεν ἐμέ⁶³, καὶ διὰ Γτούτου⁶⁴ τὸν μισθὸν ἐκλήθην⁶⁵ Ἰσαχάρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/015.yaml
  text: And Jacob knew Leah, and she conceived and bore me; and because of this — the wages — I was called Issachar.
translation:
  language: pt
  text: Jacó conheceu Lia[a]; ela concebeu e me deu à luz. E, por causa disso — o salário[b] —, fui chamado Issacar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “conheceu” é um modo bíblico de dizer que Jacó teve relações sexuais com Lia.
    reason: O eufemismo literal pode não ser imediatamente claro em português moderno.
  - marker: b
    text: 'Ou: “a recompensa”. O texto associa esse termo ao nome Issacar.'
    reason: O grego μισθός pode indicar salário, pagamento ou recompensa, e a construção ressalta sua ligação com o nome.
lexical_decisions:
- source_word: ἔγνω
  choice: conheceu
  rationale: Preserva o eufemismo bíblico para relações sexuais, com esclarecimento em nota para leitores modernos.
- source_word: συλλαβοῦσα
  choice: concebeu
  rationale: Expressa diretamente o sentido do particípio grego e mantém a sequência concepção-nascimento.
- source_word: τὸν μισθὸν
  choice: o salário
  rationale: Mantém a imagem lexical de pagamento ou recompensa associada ao nome Issacar, sem substituir a formulação por uma etimologia interpretativa.
- source_word: ἐκλήθην Ἰσαχάρ
  choice: fui chamado Issacar
  rationale: Reproduz a construção passiva e conserva a forma tradicional e reconhecível do nome em português.
theological_decisions:
- issue: Relação entre «por causa disso», «o salário» e o nome Issacar
  choice: Preservar «o salário» como expressão explicativa destacada por travessões
  alternative: 'Integrar interpretativamente: «por causa desse salário, fui chamado Issacar»'
  rationale: A sintaxe grega é condensada e algo irregular. A formulação escolhida conserva sua tensão e a associação entre as circunstâncias, o salário e o nome, sem definir com excessiva precisão a relação etimológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com o eufemismo bíblico preservado e explicado. Os travessões mantêm a aposição abrupta do grego sem tornar a frase artificialmente técnica.
