  text: 2. *Ἐγὼ ἐτέχθην ⁷πέμπτος υἱὸς τῷ Ἰακώβ⁷ ἐν μισθῷ τῶν μανδραγόρων⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/002.yaml
  text: I was born as the fifth son to Jacob, as the wages for the mandrakes.
translation:
  language: pt
  text: Nasci como o quinto filho de Jacó, como paga pelas mandrágoras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέχθην
  choice: Nasci
  rationale: Expressa de modo natural e fiel o aoristo passivo de τίκτω, que aqui indica o nascimento do próprio narrador.
- source_word: πέμπτος υἱὸς τῷ Ἰακώβ
  choice: como o quinto filho de Jacó
  rationale: Conserva a posição ordinal e verte o dativo de relação/posse em português corrente, sem sugerir que Jacó seja objeto da ação.
- source_word: ἐν μισθῷ
  choice: como paga
  rationale: O substantivo μισθός denota salário, recompensa ou compensação; «como paga» mantém a ligação causal e a formulação econômica da narrativa.
- source_word: τῶν μανδραγόρων
  choice: pelas mandrágoras
  rationale: Traduz literalmente o referente botânico e entende o genitivo como aquilo em troca do qual a paga foi recebida, em consonância com o episódio de Gênesis 30.
theological_decisions:
- issue: Relação entre o nascimento de Issacar e a transação das mandrágoras
  choice: como paga pelas mandrágoras
  alternative: como recompensa das mandrágoras
  rationale: Mantém a interpretação narrativa explícita no grego sem ampliar seu significado teológico nem suavizar a imagem de compensação.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa. «Mandrágoras» preserva o termo tradicional e botanicamente reconhecível; não foram necessárias notas.
