  text: And Rachel said, “Do not boast, nor glorify yourself, for he was joined to me before you, and because of me he served our father fourteen years.”
translation:
  language: pt
  text: 'E Raquel disse: “Não se gabe nem se glorifique, pois ele foi unido a mim antes de você e, por minha causa, serviu ao nosso pai durante catorze anos.”'
