lexical_decisions:
- source_word: καυχῶ
  choice: se gabe
  rationale: Expressa de modo natural a ideia de vangloriar-se, preservando a proibição direta.
- source_word: δόξαζε σεαυτήν
  choice: se glorifique
  rationale: Mantém a distinção lexical em relação a καυχῶ e reproduz a ideia reflexiva do grego.
- source_word: ἡρμόσατο
  choice: foi unido
  rationale: Conserva a formulação relacional e sua relativa abertura, sem especificar além do grego a natureza da união.
- source_word: δι᾽ ἐμὲ
  choice: por minha causa
  rationale: Traduz com clareza o valor causal da preposição neste contexto.
- source_word: ἐδούλευσε
  choice: serviu
  rationale: É o equivalente contextual direto e natural para o período de serviço prestado ao pai.
