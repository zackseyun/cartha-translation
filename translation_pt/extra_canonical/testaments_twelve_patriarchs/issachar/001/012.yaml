base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/012.yaml
  text: But Laban deceived me with guile, and removed me that night, and did not allow Jacob to see me; for if I had been there, this would not have happened to him.
translation:
  language: pt
  text: Mas Labão me enganou com astúcia e afastou-me naquela noite; não permitiu que Jacó me visse, pois, se eu estivesse lá, isso não teria acontecido com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δόλῳ
  choice: com astúcia
  rationale: Expressa o meio enganoso ou ardiloso empregado por Labão, em linguagem natural e digna.
- source_word: ἠπάτησέ με
  choice: me enganou
  rationale: Equivalente direto e corrente para o ato de enganar.
- source_word: μετέστησέ με
  choice: tirou-me dali
  rationale: O verbo indica remover ou transferir; a formulação conserva a ideia de afastamento sem especificar um destino ausente do grego.
- source_word: οὐκ εἴασε ... ἰδεῖν με
  choice: não permitiu que Jacó me visse
  rationale: Reproduz com clareza a construção causativa do grego.
- source_word: τοῦτο αὐτῷ οὐκ ἐγένετο
  choice: isso não teria acontecido com ele
  rationale: Preserva a referência vaga de τοῦτο e o valor contrafactual da oração.
theological_decisions:
- issue: Referente não explicitado de τοῦτο ('isso')
  choice: 'Manter o demonstrativo indefinido: “isso”'
  alternative: Explicitar qual acontecimento teria sido impedido
  rationale: O texto grego não identifica aqui o acontecimento; explicitá-lo resolveria indevidamente uma ambiguidade contextual.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; tom narrativo digno. A próclise em “me enganou” favorece a naturalidade, enquanto “tirou-me” evita repetição excessiva e mantém registro literário acessível.
