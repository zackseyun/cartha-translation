source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 13. *Ἀλλ᾽ οὖν ἀντὶ τῶν μανδραγόρων ἐκμισθῶ σοι μίαν νύκτα τῷ Ἰακώβ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/013.yaml
  text: But still, in exchange for the mandrakes I hire out to you one night with Jacob.
translation:
  language: pt
  text: Mas, ainda assim, em troca das mandrágoras, cedo a você uma noite com Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλ᾽ οὖν
  choice: Mas, ainda assim
  rationale: Preserva tanto a força adversativa de ἀλλά quanto a nuance conclusiva ou enfática de οὖν, em português natural.
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: em troca das mandrágoras
  rationale: Expressa diretamente a relação de troca indicada por ἀντί com o genitivo.
- source_word: ἐκμισθῶ σοι
  choice: cedo a você
  rationale: O verbo pertence ao campo de alugar ou ceder mediante compensação; neste contexto, 'cedo a você' evita a impressão pouco natural de que a interlocutora é alugada, sem apagar o caráter de transação.
- source_word: μίαν νύκτα τῷ Ἰακώβ
  choice: uma noite com Jacó
  rationale: Segue o sentido contextual da construção, isto é, a cessão de uma noite de convivência conjugal com Jacó, mantendo a formulação concisa do grego.
theological_decisions:
- issue: Natureza da transação entre as mulheres
  choice: Manter a linguagem de troca e cessão
  alternative: Parafrasear como permissão para Jacó passar a noite com a interlocutora
  rationale: O grego emprega linguagem comercial explícita; a tradução não deve moralizar nem suavizar completamente a tensão narrativa.
translation_notes:
  register: Português moderno, digno e acessível, com leve formalidade narrativa. A fala permanece em primeira pessoa conforme o texto grego fornecido; não se incorporou a revisão inglesa citada, pois ela parece corresponder a outra forma textual ou a outro segmento do relato.
