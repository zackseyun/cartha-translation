  text: 7. Δύο οὖν ἦσαν τὰ μῆλα³⁰. Καὶ εἶπεν ἡ³¹ Λία ⌜πρὸς Ῥαχήλ⌝³². *Ἱκανούσθω σοι³³ ὅτι ἔλαβες τὸν ἄνδρα³⁴ μου· μὴ καὶ ταῦτα³⁵ λήψῃ³⁶ ⌈ἀπ᾿ ἐμοῦ⌉³⁷;
