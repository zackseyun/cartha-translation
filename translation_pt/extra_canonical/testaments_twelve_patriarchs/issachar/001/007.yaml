base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/007.yaml
  text: So there were two fruits. And Leah said to Rachel, “Let it be enough for you that you have taken my husband; will you also take these from me?”
translation:
  language: pt
  text: 'Assim, havia dois frutos. E Lia disse a Raquel: “Que lhe baste ter tomado o meu marido; você também vai tirar de mim estes frutos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ μῆλα
  choice: dois frutos
  rationale: Embora μῆλα possa designar maçãs em outros contextos, aqui o referente são os frutos trazidos no relato; 'frutos' preserva a formulação da fonte de consulta e evita uma identificação botânica indevida.
- source_word: Ἱκανούσθω σοι
  choice: Que lhe baste
  rationale: Reproduz o imperativo de terceira pessoa, em vez de convertê-lo numa pergunta retórica.
- source_word: ἔλαβες τὸν ἄνδρα μου
  choice: ter tomado o meu marido
  rationale: Mantém de modo natural a acusação direta expressa por ἔλαβες, sem amenizá-la.
- source_word: μὴ καὶ ταῦτα λήψῃ ἀπ᾿ ἐμοῦ
  choice: você também vai tirar de mim estes frutos?
  rationale: Expressa a pergunta que espera resposta negativa; repete 'frutos' para tornar claro em português o referente do pronome demonstrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por 'você' para clareza amplamente brasileira. A fala de Lia conserva o tom incisivo e a progressão do imperativo para a pergunta retórica.
