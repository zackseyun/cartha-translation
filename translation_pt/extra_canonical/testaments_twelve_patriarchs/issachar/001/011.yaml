id: T12P.ISS.1.11
reference: Testament of Issachar 1:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 11. *Καὶ εἰ μὴ ὁ δόλος ἐπλήθυνεν ἐπὶ τῆς γῆς καὶ ἡ πονηρία τῶν ἀνθρώπων ἐχώρησεν, οὐκ ἂν εἶ σὺ ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ⁵³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/011.yaml
  text: And had guile not multiplied upon the earth and the wickedness of men advanced, you would not be looking on the face of Jacob.
translation:
  language: pt
  text: E, se o engano não tivesse se multiplicado sobre a terra e a maldade dos humanos não tivesse avançado, você não estaria vendo o rosto de Jacó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “ver o rosto de Jacó” pode indicar estar em sua presença. O texto não explica de que modo a multiplicação do engano e o avanço da maldade levaram a essa situação.
    reason: Preserva a possível conotação idiomática da expressão sem identificá-la de modo exclusivo com presença física nem explicar a relação causal deixada implícita no grego.
lexical_decisions:
- source_word: δόλος
  choice: engano
  rationale: Expressa fraude ou dolo em linguagem natural e ampla, sem restringir o termo a uma forma específica de astúcia.
- source_word: ἐπλήθυνεν ἐπὶ τῆς γῆς
  choice: tivesse se multiplicado sobre a terra
  rationale: Preserva a imagem e a construção contrafactual do grego.
- source_word: ἡ πονηρία τῶν ἀνθρώπων
  choice: a maldade dos seres humanos
  rationale: Mantém o sentido moral de πονηρία; 'seres humanos' comunica o valor genérico de ἀνθρώπων em português moderno.
- source_word: ἐχώρησεν
  choice: tivesse avançado
  rationale: Reflete o sentido contextual de progredir ou ganhar terreno e acompanha a versão inglesa auditada sem tornar a formulação excessivamente interpretativa.
- source_word: ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ
  choice: contemplando o rosto de Jacó
  rationale: Conserva a forma participial feminina e a expressão concreta 'rosto de Jacó'; 'contemplando' soa dignificado e natural no contexto.
theological_decisions:
- issue: Relação contrafactual entre o mal humano e a existência ou presença da interlocutora diante de Jacó
  choice: 'Preservar literalmente a afirmação: ''você não estaria contemplando o rosto de Jacó'''
  alternative: Explicitar que a interlocutora não teria nascido ou não teria se casado com Jacó
  rationale: O grego não explicita a consequência precisa; a tradução mantém a tensão e evita acrescentar uma interpretação narrativa ou teológica.
translation_notes:
  register: Português moderno, claro e dignificado, com legibilidade brasileira. A sintaxe contrafactual foi ajustada ao uso idiomático do português, preservando a sequência e a ambiguidade do original.
