source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 14. ⌈Καὶ προσέθηκε Ῥαχὴλ λαλεῖν καὶ εἶπεν. Ἕνα τῶν μανδραγόρων λήψομαι, καὶ ἀντὶ τοῦ ἑνὸς ἐκμισθώσω σοι ἐν τῇ νυκτί⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/014.yaml
  text: And Rachel went on speaking and said, "I will take one of the mandrakes, and in exchange for the one I will hire him out to you for the night."
translation:
  language: pt
  text: 'E Raquel continuou a falar e disse: “Ficarei com uma das mandrágoras e, em troca dela, alugarei Jacó a você por esta noite.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “alugarei a você”, sem nomear o objeto; pelo contexto, trata-se de Jacó.
    reason: Assinalar que “Jacó” foi explicitado com base no contexto e preservar a forma elíptica do texto-fonte.
lexical_decisions:
- source_word: προσέθηκε ... λαλεῖν
  choice: continuou a falar
  rationale: A construção semítica significa literalmente “acrescentou falar”; em português atual, “continuou a falar” conserva naturalmente a ideia de prosseguimento.
- source_word: μανδραγόρων
  choice: mandrágoras
  rationale: Equivalente botânico tradicional e direto do termo grego.
- source_word: ἐκμισθώσω
  choice: alugarei
  rationale: Preserva a linguagem explícita de contratação ou cessão mediante pagamento presente no verbo grego, sem suavizá-la para “deixarei” ou “cederei”.
- source_word: ἐν τῇ νυκτί
  choice: por esta noite
  rationale: No contexto da negociação, a expressão indica o período noturno em questão; esta formulação é idiomática em português.
theological_decisions:
- issue: Objeto não expresso de ἐκμισθώσω
  choice: Explicitar “Jacó” no texto e registrar a elipse em nota
  alternative: Usar apenas o pronome “o” ou reproduzir a ausência do objeto
  rationale: O grego não declara o objeto, mas o contexto narrativo identifica Jacó como a pessoa negociada. Nomeá-lo torna a frase compreensível em português sem esconder a elipse do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém a imagem comercial deliberadamente forte do grego e usa travessão apenas dentro da fala quando necessário; aqui, as aspas bastam.
