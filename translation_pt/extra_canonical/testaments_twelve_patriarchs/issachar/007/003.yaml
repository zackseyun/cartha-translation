  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/003.yaml
  text: I did not drink wine for deception, and I did not desire anything that belonged to my neighbor.
translation:
  language: pt
  text: Não bebi vinho para enganar; não cobicei coisa alguma do meu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἀποπλάνησιν
  choice: para me deixar desencaminhar
  rationale: A expressão indica finalidade ou resultado ligado a desvio/engano. A formulação preserva essa amplitude melhor do que restringi-la a uma espécie específica de fraude.
- source_word: ἐπιθύμημα
  choice: coisa alguma
  rationale: No contexto de πᾶν e do verbo cognato ἐπεθύμησα, uma tradução idiomática evita a repetição pouco natural de substantivos como “objeto de desejo”, enquanto comunica a abrangência daquilo que pertence ao próximo.
- source_word: τοῦ πλησίου
  choice: do meu próximo
  rationale: “Próximo” é natural no registro bíblico e mantém o sentido relacional de πλησίος sem o limitar ao vizinho residencial.
- source_word: ἐπεθύμησα
  choice: cobicei
  rationale: “Cobiçar” expressa desejo dirigido ao que pertence a outra pessoa e reproduz adequadamente a tensão ética da frase.
theological_decisions:
- issue: Natureza do desvio associado ao vinho
  choice: Não especificar se o desvio é moral, mental ou social
  alternative: “Não bebi vinho para enganar”
  rationale: ἀποπλάνησις pode designar desvio ou engano, e o texto não identifica de modo inequívoco quem engana quem. A tradução mantém a ambiguidade básica sem impor uma leitura doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com leve ressonância bíblica em “meu próximo”. O ponto e vírgula reflete a coordenação de duas declarações éticas estreitamente relacionadas.
