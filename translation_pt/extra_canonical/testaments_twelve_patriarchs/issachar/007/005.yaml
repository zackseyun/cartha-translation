source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. ⌈Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα καὶ πτωχῷ μετέδωκα ἄρτον¹² μου⁷. Εὐσέβειαν ἐποίησα¹⁴ ἐν πάσαις ταῖς¹⁵ ἡμέραις μου, *᾿Αλήθειαν ἐφύλαξα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/005.yaml
  text: I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth.
translation:
  language: pt
  text: Gemi com toda pessoa que sofria e reparti o meu pão com o pobre. Pratiquei a piedade em todos os meus dias; guardei a verdade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδυνομένῳ
  choice: que sofria
  rationale: Exprime de modo natural a pessoa afligida ou em dor, sem limitar o sofrimento ao aspecto físico.
- source_word: συνεστέναξα
  choice: gemi junto
  rationale: Preserva a imagem concreta de compartilhar o gemido e a aflição de outra pessoa.
- source_word: μετέδωκα
  choice: reparti
  rationale: Comunica a ação de dar uma parte do próprio pão, mantendo a ideia de partilha.
- source_word: Εὐσέβειαν ἐποίησα
  choice: Pratiquei a piedade
  rationale: Formulação portuguesa corrente que conserva o sentido de exercer uma conduta reverente e devota.
- source_word: ᾿Αλήθειαν ἐφύλαξα
  choice: guardei a verdade
  rationale: Mantém a expressão concisa e sua possível abrangência entre veracidade, fidelidade e compromisso com a verdade.
theological_decisions:
- issue: Sentido de εὐσέβεια
  choice: piedade
  alternative: devoção a Deus
  rationale: “Piedade” preserva a amplitude do termo grego e evita explicitar um objeto que não aparece na frase.
- issue: Amplitude de ἀλήθεια
  choice: verdade
  alternative: fidelidade
  rationale: A tradução formal conserva a ambiguidade entre verdade como realidade/veracidade e conduta fiel.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo conciso. “Gemi junto” foi mantido para conservar a força imagética do verbo grego, ainda que seja menos idiomático que “compadeci-me”.
