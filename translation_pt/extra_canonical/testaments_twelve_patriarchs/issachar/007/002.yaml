base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/002.yaml
  text: Except for my wife, I have not known another. I did not commit sexual immorality with wandering eyes.
translation:
  language: pt
  text: Exceto minha esposa, não conheci outra. Não cometi imoralidade sexual com olhos errantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πλὴν τῆς συμβίου μου
  choice: Além da minha esposa
  rationale: A expressão indica exceção, e σύμβιος designa aqui a esposa ou companheira conjugal; “esposa” é natural e inequívoco no contexto.
- source_word: οὐκ ἔγνων ἄλλην
  choice: não conheci outra
  rationale: Preserva o eufemismo sexual de γινώσκω e mantém o adjetivo substantivado ἄλλην sem acrescentar “mulher”, que não está expresso no grego.
- source_word: Οὐκ ἐπόρνευσα
  choice: Não cometi imoralidade sexual
  rationale: Expressa o sentido sexual de πορνεύω em linguagem moderna e ampla, sem restringi-lo indevidamente a um ato específico.
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: com olhos errantes
  rationale: Reproduz de modo conciso a imagem de olhos que vagueiam ou se desviam, preservando sua ligação com o desejo sexual.
theological_decisions:
- issue: Alcance da afirmação de pureza sexual
  choice: imoralidade sexual
  alternative: prostituição; adultério
  rationale: O verbo πορνεύω tem alcance mais amplo que “prostituir-se” ou “cometer adultério”; a tradução evita impor uma categoria moral mais estreita que o original.
- issue: Objeto implícito de “conheci”
  choice: outra
  alternative: outra mulher
  rationale: Embora o referente feminino seja gramaticalmente implícito e claro pelo contexto, não se acrescenta o substantivo para preservar a forma elíptica do grego.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formulação concisa. “Conheci” conserva o eufemismo bíblico, enquanto “olhos errantes” mantém a imagem do original sem explicá-la excessivamente.
