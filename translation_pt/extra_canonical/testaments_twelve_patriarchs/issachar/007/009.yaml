lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: estendendo os pés
  rationale: Reproduz de modo natural o gesto corporal expresso pelo particípio grego; em português, o possessivo é dispensável porque o sujeito já deixa claro de quem são os pés.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva a metáfora do sono para a morte, sem substituí-la diretamente por “morreu”.
- source_word: ἐν γήρει καλῷ
  choice: em boa velhice
  rationale: Mantém de perto a expressão grega e seu sentido positivo de uma velhice plena ou favorável.
- source_word: ὕπνον αἰώνιον
  choice: num sono eterno
  rationale: Expressa com naturalidade em português o objeto cognato grego, preservando a imagem de um sono sem fim.
theological_decisions:
- issue: A metáfora da morte como sono
  choice: adormeceu [...] num sono eterno
  alternative: morreu em boa velhice
  rationale: A tradução mantém a formulação metafórica do grego e não resolve além do texto possíveis questões sobre o estado após a morte.
translation_notes:
  register: Português atual, claro e digno, com estrutura próxima do grego. A repetição conceitual entre “adormeceu” e “sono” foi mantida por refletir o objeto cognato do original.
