  text: And stretching out his feet, he fell asleep in a good old age the eternal sleep.
translation:
  language: pt
  text: E, estendendo os pés[a], adormeceu em boa velhice, num sono eterno.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
