- from: 7 Assim, como vocês veem, tenho cento e vinte e seis anos e não conheci em mim pecado algum que leve à morte.[a]
  to: '7 Eis, pois, como vocês veem: tenho cento e vinte e seis anos e não conheci em mim pecado algum que leve à morte.[a]'
  rationale: A revisão restaura no texto principal o valor enfático de ἰδού por «Eis», conserva οὖν em «pois» e mantém sem alteração as escolhas que refletem de perto οὐκ ἔγνων ἐν ἐμοὶ ἁμαρτίαν e εἰς θάνατον. Não há base contextual para especificar que tipo de morte está em vista.
