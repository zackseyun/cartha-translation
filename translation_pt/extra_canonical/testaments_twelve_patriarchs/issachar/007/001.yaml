source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VII. *Ἰδοὺ οὖν ὡς ὁρᾶτε, ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω¹, καὶ οὐκ *ἔγνων †ἐν ἐμοὶ ἁμαρτίαν Γεἰς θάνατον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/001.yaml
  text: 'See then, as you see: I am one hundred and twenty-six years old, and I have not known any sin in me leading to death.'
translation:
  language: pt
  text: '7 Eis, pois, como vocês veem: tenho cento e vinte e seis anos e não conheci em mim pecado algum que leve à morte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pecado algum para a morte”.'
    reason: Registra uma tradução mais formal de εἰς θάνατον e preserva a possível ressonância técnica da expressão sem fixá-la no texto principal.
lexical_decisions:
- source_word: Ἰδοὺ οὖν
  choice: Assim
  rationale: Introduz a conclusão enfática de modo natural em português; o valor de ἰδού permanece perceptível no tom declarativo, sem o arcaísmo de “eis”.
- source_word: ὡς ὁρᾶτε
  choice: como vocês veem
  rationale: Tradução direta do verbo ὁράω, preservando o apelo de Issacar à observação dos ouvintes.
- source_word: ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω
  choice: tenho cento e vinte e seis anos
  rationale: Expressão idiomática portuguesa para a declaração de idade, sem perda de conteúdo.
- source_word: οὐκ ἔγνων ἐν ἐμοὶ ἁμαρτίαν
  choice: não conheci em mim pecado algum
  rationale: Mantém tanto o valor experiencial/cognitivo de ἔγνων quanto a expressão ἐν ἐμοί, evitando expandir o texto para “não cometi” ou reduzir seu sentido a mera consciência subjetiva.
- source_word: εἰς θάνατον
  choice: que leve à morte
  rationale: Expressa a direção ou resultado indicado por εἰς sem decidir se a morte é física, espiritual ou escatológica.
theological_decisions:
- issue: Relação entre o pecado e a morte
  choice: pecado algum que leve à morte
  alternative: pecado para a morte / pecado mortal
  rationale: A formulação preserva a força direcional de εἰς θάνατον e a ambiguidade teológica do texto, sem importar a categoria técnica posterior de “pecado mortal”.
- issue: Alcance da afirmação de inocência
  choice: não conheci em mim pecado algum
  alternative: não tive consciência de cometer pecado algum
  rationale: A tradução não transforma a afirmação em impecabilidade absoluta nem a restringe explicitamente à consciência moral; conserva a construção grega e sua tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A sintaxe acompanha de perto o grego, mas a declaração da idade foi vertida de forma idiomática. O marcador [a] aparece no texto principal.
