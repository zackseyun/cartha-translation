  text: And he stretched out his feet and died in a good old age, having every limb sound, and being strong he slept the eternal sleep.
translation:
  language: pt
  text: E ele estendeu os pés e morreu em boa velhice, com todos os membros sadios; e, ainda forte, adormeceu no sono eterno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινε τοὺς πόδας αὐτοῦ
  choice: estendeu os pés
  rationale: Reprodução direta e natural do gesto narrado pelo grego, sem acrescentar uma interpretação funerária.
- source_word: ἐν γήρει καλῷ
  choice: em boa velhice
  rationale: Preserva a expressão idiomática bíblica e o sentido de uma velhice favorável ou plena.
- source_word: πᾶν μέλος ἔχων ὑγιές
  choice: com todos os membros sadios
  rationale: Expressa de modo claro que cada parte do corpo permanecia saudável.
- source_word: ἰσχύων
  choice: ainda forte
  rationale: O particípio indica que ele conservava vigor ao morrer; “ainda” torna essa relação natural em português sem alterar o conteúdo.
- source_word: ὕπνωσεν ὕπνον αἰώνιον
  choice: adormeceu no sono eterno
  rationale: Mantém a figura etimológica e a metáfora da morte presentes no grego.
theological_decisions:
- issue: Sentido de “sono eterno”
  choice: Manter literalmente “sono eterno” como metáfora da morte
  alternative: Interpretar como declaração explícita sobre um estado pós-morte definitivo
  rationale: O texto usa linguagem metafórica e não explica aqui suas implicações escatológicas; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve cadência bíblica. O ponto e vírgula organiza os particípios gregos sem transformar a frase em linguagem excessivamente rebuscada.
