  text: 7. *Ταῦτα καὶ ὑμεῖς, τέκνα μου, ποιεῖτε²², καὶ²³ πᾶν πνεῦμα τοῦ Βελίαρ φεύξεται ἀφ᾽ ὑμῶν καὶ πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν²⁴ καὶ¹¹ πᾶν ἄγριον θηρίον²⁵ καταδουλώσετε²⁶ ἔχοντες μεθ᾽ ὑμῶν²⁷ τὸν θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς²⁸ *συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας²⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/007.yaml
  text: You also, my children, do these things, and every spirit of Beliar will flee from you, and every deed of wicked people will not rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who goes with people in simplicity of heart.
translation:
  language: pt
  text: Façam também vocês estas coisas, meus filhos, e todo espírito de Beliar fugirá de vocês. Toda ação de pessoas perversas não terá domínio sobre vocês, e vocês subjugarão todo animal selvagem, tendo com vocês o Deus do céu e da terra, que acompanha as pessoas na simplicidade de coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βελίαρ
  choice: Beliar
  rationale: Mantém a forma do nome próprio presente no texto grego, sem substituí-la pela forma variante mais conhecida, “Belial”.
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν
  choice: Toda ação de pessoas perversas será incapaz de dominá-los
  rationale: Preserva o alcance distributivo de πᾶσα e a ideia de domínio de κυριεύσει, evitando a formulação pouco natural “toda ação não dominará”.
- source_word: καταδουλώσετε
  choice: subjugarão
  rationale: Expressa o sentido forte de pôr sob domínio ou sujeição.
- source_word: συμπορευόμενον
  choice: acompanha
  rationale: Comunica naturalmente a ideia de ir junto ou caminhar com alguém, sem impor ao verbo um sentido técnico.
- source_word: ἐν ἁπλότητι καρδίας
  choice: na simplicidade de coração
  rationale: Conserva a expressão antropológica e ética do grego, incluindo sua possível amplitude entre sinceridade, integridade e singeleza.
theological_decisions:
- issue: Relação entre a presença de Deus e a simplicidade de coração
  choice: que acompanha as pessoas na simplicidade de coração
  alternative: que acompanha as pessoas de coração sincero
  rationale: A tradução mantém a construção abstrata do grego e não reduz ἁπλότης apenas a sinceridade nem determina de modo mais estrito como a expressão se relaciona com o acompanhamento divino.
- issue: Identidade de Beliar
  choice: Beliar
  alternative: Belial
  rationale: A transliteração da forma grega evita harmonização automática com tradições textuais ou nomenclaturas confessionais externas ao trecho.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A pontuação divide o período grego longo para maior clareza sem alterar sua progressão argumentativa.
