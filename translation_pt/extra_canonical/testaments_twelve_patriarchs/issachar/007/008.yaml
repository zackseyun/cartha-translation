lexical_decisions:
- source_word: ἀναγάγωσιν
  choice: levassem para
  rationale: Expressa de modo natural o movimento indicado pelo verbo grego, sem impor em português uma referência topográfica explícita que o contexto imediato não desenvolve.
- source_word: θάψωσιν
  choice: sepultassem
  rationale: Equivalente corrente e digno para o ato de enterrar, apropriado ao registro testamentário.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: com seus pais
  rationale: Preserva a expressão ancestral do grego e sua possível referência ao sepultamento junto aos antepassados, sem acrescentar a menção a uma caverna, ausente do texto-fonte fornecido.
