base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/006.yaml
  text: I loved the Lord and every person with all my heart, more than my children.
translation:
  language: pt
  text: Amei o Senhor e todas as pessoas de todo o coração, mais do que meus filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν Κύριον
  choice: o Senhor
  rationale: Equivalência direta e tradicional para o título grego, preservando seu valor religioso.
- source_word: πάντα ἄνθρωπον
  choice: todas as pessoas
  rationale: O singular distributivo grego significa cada ser humano; esta formulação é natural, abrangente e evita restringir o sentido a homens do sexo masculino.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: de todo o coração
  rationale: Expressão idiomática corrente em português que conserva a ideia de devoção integral; o possessivo fica naturalmente implícito.
- source_word: ὑπὲρ τὰ τέκνα μου
  choice: mais do que meus filhos
  rationale: Neste contexto comparativo, ὑπέρ com acusativo indica superioridade de medida ou preferência, conforme também reconhece a camada inglesa auditada.
theological_decisions:
- issue: Alcance do amor por πάντα ἄνθρωπον
  choice: todas as pessoas
  alternative: cada ser humano
  rationale: Preserva a universalidade distributiva sem introduzir uma delimitação teológica ou de gênero ausente no grego.
- issue: Comparação entre o amor universal e o amor pelos filhos
  choice: mais do que meus filhos
  alternative: acima de meus filhos
  rationale: Mantém a afirmação forte e sua tensão ética, sem suavizá-la nem reinterpretá-la como mera prioridade abstrata.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A coordenação do grego foi mantida, e a formulação não acrescenta explicações confessionais.
