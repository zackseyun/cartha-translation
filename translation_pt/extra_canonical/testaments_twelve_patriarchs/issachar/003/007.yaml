source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. Καὶ ὁ⁴⁵ Κύριος ἐμυριοπλασίασε⁴⁶ τὰ ἀγαθὰ ⌜ἐν ταῖς χερσί⁴⁷ μου· ᾔδει δὲ καὶ Ἰακὼβ *ὁ πατήρ μου⁴⁸, ὅτι ὁ Θεὸς συνεργεῖ⁴⁸ τῇ ἁπλότητί μου⌝. *Πάντα γὰρ πένησι καὶ θλιβομένοις⁴⁹ παρεῖχον *ἐκ τῶν ἀγαθῶν τῆς γῆς⁵⁰ ἐν ἁπλότητι καρδίας μου⁵¹˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/007.yaml
  text: And the Lord multiplied the good things ten thousandfold in my hands; and Jacob my father also knew that God was working together with my simplicity. For I provided to all the poor and afflicted from the good things of the earth, in the simplicity of my heart.
translation:
  language: pt
  text: E o Senhor multiplicou dez mil vezes os bens em minhas mãos; e Jacó, meu pai, também sabia que Deus cooperava com a minha simplicidade. Pois eu fornecia tudo aos pobres e aflitos, a partir dos bens da terra, com a simplicidade do meu coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυριοπλασίασε
  choice: multiplicou dez mil vezes
  rationale: Reproduz a força intensiva e a imagem numérica do verbo grego, sem reduzi-lo ao sentido genérico de «multiplicou muito».
- source_word: τὰ ἀγαθὰ
  choice: os bens
  rationale: Neste contexto, designa os recursos ou produtos recebidos e distribuídos, não apenas coisas moralmente boas.
- source_word: συνεργεῖ
  choice: cooperava com
  rationale: Mantém a construção relacional do grego, segundo a qual Deus atuava juntamente com a simplicidade de Issacar, sem explicar além do texto como se dava essa ação.
- source_word: ἁπλότης
  choice: simplicidade
  rationale: Preserva o termo recorrente e sua amplitude sem restringi-lo a «sinceridade», «generosidade» ou «integridade».
- source_word: πένησι καὶ θλιβομένοις
  choice: aos pobres e aflitos
  rationale: Distingue a carência material expressa por πένησι do sofrimento ou da opressão expressos por θλιβομένοις.
- source_word: Πάντα ... παρεῖχον
  choice: eu fornecia tudo
  rationale: Trata πάντα como objeto neutro de παρεῖχον, conforme a forma do texto grego, em vez de entendê-lo como referência a todas as pessoas.
- source_word: ἐκ τῶν ἀγαθῶν τῆς γῆς
  choice: tirando dos bens da terra
  rationale: Expressa a origem daquilo que era fornecido e conserva a referência concreta à produção ou aos recursos da terra.
theological_decisions:
- issue: Relação entre a ação de Deus e a simplicidade de Issacar
  choice: Deus cooperava com a minha simplicidade
  alternative: Deus favorecia a minha sinceridade
  rationale: A tradução escolhida mantém a formulação incomum e a tensão do verbo συνεργεῖ, sem transformar a declaração em uma explicação teológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível no Brasil e em outras comunidades lusófonas. Conservou-se a repetição de «simplicidade», importante para a coesão do versículo, e a hipérbole «dez mil vezes».
