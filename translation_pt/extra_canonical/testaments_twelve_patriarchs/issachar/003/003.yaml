  text: And I am not meddlesome in my actions, nor envious and malicious toward my neighbor.
translation:
  language: pt
  text: E não sou dado a intrometer-me em meus afazeres, nem invejoso e mal-intencionado para com o meu próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος
  choice: intrometido
  rationale: Expressa a ideia de quem se ocupa indevidamente dos assuntos alheios; é natural em português e se ajusta ao contexto ético.
- source_word: ἐν ταῖς πράξεσίν μου
  choice: em minhas ações
  rationale: Mantém de perto a construção grega e o sentido amplo de conduta ou atos.
- source_word: φθονερός
  choice: invejoso
  rationale: Equivalente direto e corrente para a disposição marcada pela inveja.
- source_word: βάσκανος
  choice: mal-intencionado
  rationale: Neste contexto, indica uma atitude malevolente ou nociva; evita a leitura mais específica de 'feiticeiro' ou 'mau-olhado', que não é exigida aqui.
- source_word: τῷ πλησίον μου
  choice: para com o meu próximo
  rationale: Conserva o sentido relacional do dativo e a formulação ética tradicional de πλησίον em linguagem compreensível.
theological_decisions:
- issue: Relação entre φθονερός e βάσκανος sob οὐδέ
  choice: nem invejoso e mal-intencionado
  alternative: nem invejoso nem mal-intencionado
  rationale: A redação conserva o καί do texto grego e mantém os dois qualificativos distintos sob uma única negação, sem fundi-los em uma só ideia.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego. O presente 'não sou' segue εἰμί no texto fornecido, em vez de adotar o passado da camada inglesa anterior.
