  verdict: revise
  source_fidelity: 'O texto grego traz duas negações coordenadas: «não sou περίεργος em minhas πράξεις, nem φθονερός e βάσκανος para com meu próximo». A tradução preserva adequadamente o presente de εἰμί, o campo de inveja de φθονερός e a malevolência de βάσκανος. Contudo, «intrometido em minhas ações» soa como se o autor se intrometesse em seus próprios atos e não comunica com clareza o valor de περίεργος no âmbito da conduta/ocupações.'
  naturalness: «Não sou dado a intrometer-me em meus afazeres» é mais idiomático em português moderno e conserva a referência às πράξεις como afazeres, atividades ou conduta. «Para com o meu próximo» é natural em registro ético-literário.
  terminology: «Invejoso» e «mal-intencionado» distinguem satisfatoriamente φθονερός e βάσκανος sem introduzir o sentido específico de feitiçaria ou mau-olhado. «Próximo» conserva o termo ético relacional sem impor uma leitura doutrinária.
