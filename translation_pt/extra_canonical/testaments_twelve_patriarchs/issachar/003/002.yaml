source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. Γ*Καὶ ηὐλόγει με ὁ πατήρ μου βλέπων με¹² *ὅτι ἐν ἁπλότητι πορεύομαι¹³ *ἔμπροσθεν αὐτοῦ¹⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/002.yaml
  text: And my father blessed me, seeing that I walked in simplicity before him.
translation:
  language: pt
  text: E meu pai me abençoava, vendo que eu andava com sinceridade diante dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ηὐλόγει
  choice: abençoava
  rationale: O imperfeito grego sugere ação passada em curso ou habitual; por isso, “abençoava” preserva melhor o aspecto do que o pontual “abençoou”.
- source_word: ἐν ἁπλότητι
  choice: com sinceridade
  rationale: ἁπλότης pode indicar simplicidade, singeleza, integridade ou sinceridade. Neste contexto moral, “com sinceridade” é natural em português e evita a possível ideia moderna de ingenuidade ou pouca inteligência associada a “simplicidade”.
- source_word: πορεύομαι
  choice: eu andava
  rationale: Embora a forma preservada seja presente, ela depende de βλέπων με e descreve a conduta observada pelo pai no quadro narrativo passado. “Andava” transmite conduta contínua sem criar uma frase independente artificial.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: diante dele
  rationale: Equivalência direta e idiomática que conserva a ideia de viver sob a observação e na presença do pai.
theological_decisions:
- issue: Sentido ético de ἁπλότης
  choice: sinceridade
  alternative: simplicidade / integridade
  rationale: A tradução conserva o foco numa conduta sem duplicidade, sem converter o termo numa formulação doutrinária mais específica.
- issue: Relação sintática de πορεύομαι com βλέπων με
  choice: 'oração dependente: “vendo que eu andava”'
  alternative: 'declaração independente: “Eu ando diante dele”'
  rationale: O texto grego apresentado lê βλέπων με ὅτι ἐν ἁπλότητι πορεύομαι, que favorece entender ὅτι como introdução do conteúdo percebido. A revisão inglesa mais recente parece pressupor uma leitura textual diferente, com ἥμην, ausente da fonte grega fornecida.
translation_notes:
  register: Português moderno, digno e claro, com boa legibilidade brasileira. A ordem foi ajustada para soar natural, mantendo a progressão do grego e o tom testamentário.
