base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/001.yaml
  text: When therefore I grew up, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers, and I brought in fruits from the fields in their season.
translation:
  language: pt
  text: Quando, pois, cheguei à maturidade, meus filhos, andei com retidão de coração, tornei-me agricultor para meu pai e meus irmãos e trouxe dos campos os frutos no tempo deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: cheguei à maturidade
  rationale: Expressa o sentido de crescer até a condição adulta ou madura, de modo mais preciso e natural do que simplesmente “cresci”.
- source_word: ἐν εὐθύτητι καρδίας
  choice: com retidão de coração
  rationale: Preserva a imagem semítica do coração como centro moral da pessoa e o sentido de integridade ou retidão.
- source_word: γεωργός
  choice: agricultor
  rationale: Termo atual, claro e digno para quem trabalha no cultivo da terra.
- source_word: ἔφερον
  choice: trazia
  rationale: A forma pode ser lida como imperfeito, e o contexto descreve uma atividade habitual ligada ao trabalho nos campos.
- source_word: κατὰ καιρὸν αὐτῶν
  choice: na estação própria
  rationale: Comunica de modo natural que os frutos eram recolhidos no tempo adequado a eles, sem acrescentar uma especificação ausente do grego.
