revisions:
- from: Aos trinta e cinco anos, tomei para mim uma mulher, pois o trabalho consumia minhas forças. Eu não pensava no prazer com uma mulher; pelo contrário, por causa da labuta, o sono me dominava.
  to: Aos trinta e cinco anos, tomei uma esposa, pois o trabalho consumia minhas forças, e eu não pensava no prazer de uma mulher; pelo contrário, por causa da labuta, o sono acabava por prevalecer sobre mim.
  rationale: A revisão mantém a estrutura do versículo e sua ambiguidade sexual, corrige a formulação matrimonial para o sentido contextual de γυναῖκα e torna mais explícita, sem amplificação interpretativa, a ideia de que o sono prevalecia em razão do trabalho.
