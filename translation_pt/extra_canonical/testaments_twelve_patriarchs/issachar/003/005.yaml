  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/005.yaml
  text: At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman's pleasure; rather, because of my toil, sleep came over me.
translation:
  language: pt
  text: Aos trinta e cinco anos, tomei uma esposa, pois o trabalho consumia minhas forças, e eu não pensava no prazer de uma mulher; pelo contrário, por causa da labuta, o sono acabava por prevalecer sobre mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβον ἐμαυτῷ γυναῖκα
  choice: tomei para mim uma mulher
  rationale: Preserva de modo natural e relativamente formal a expressão grega para contrair casamento, sem acrescentar elementos ausentes no texto.
- source_word: ὁ κάματος
  choice: o trabalho
  rationale: Expressa o esforço fatigante indicado pelo substantivo no contexto; a frase seguinte usa “labuta” para representar a variação lexical do grego.
- source_word: κατήσθιε τὴν ἰσχύν μου
  choice: consumia minhas forças
  rationale: Mantém a imagem verbal intensa de algo que devora ou consome o vigor, em português idiomático.
- source_word: ἡδονὴν γυναικός
  choice: o prazer com uma mulher
  rationale: Conserva a concisão e certa ambiguidade do genitivo grego, que pode indicar o prazer ligado à mulher, sem explicitar além da fonte “prazer sexual” ou “dar prazer”.
- source_word: διὰ τοῦ κόπου
  choice: por causa da labuta
  rationale: Distingue κόπος de κάματος e comunica esforço extenuante em linguagem corrente e digna.
- source_word: ὁ ὕπνος μοι περιεγένετο
  choice: o sono me dominava
  rationale: Reproduz o sentido de o sono prevalecer sobre a pessoa, de forma clara e natural.
theological_decisions:
- issue: Natureza do “prazer com uma mulher”
  choice: Não especificar se se trata de desejo, relação sexual ou prazer conjugal.
  alternative: “não pensava no prazer sexual” ou “não desejava o prazer de uma mulher”
  rationale: O sintagma grego ἡδονὴν γυναικός admite mais de uma nuance; a tradução evita resolver indevidamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O paralelismo foi preservado, e “pelo contrário” explicita a oposição marcada por ἀλλά sem alterar o conteúdo.
