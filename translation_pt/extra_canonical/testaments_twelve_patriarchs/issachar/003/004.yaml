  text: I never spoke ill of anyone, nor did I criticize a person's life.
translation:
  language: pt
  text: Nunca falei mal de ninguém, nem critiquei a vida de pessoa alguma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάλησα
  choice: falei mal
  rationale: Expressa de modo natural e abrangente o ato de falar contra ou difamar alguém, sem restringir o sentido à acusação falsa implícita em «caluniar».
- source_word: ἔψεξα
  choice: critiquei
  rationale: Equivalente corrente para censurar ou repreender, adequado ao paralelismo da frase.
- source_word: βίον ἀνθρώπου
  choice: a vida de pessoa alguma
  rationale: Conserva o sentido geral de «vida de um ser humano» e evita uma marcação de gênero desnecessária; «pessoa alguma» harmoniza naturalmente com a negação inicial.
