base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/006.yaml
  text: And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father.
translation:
  language: pt
  text: E meu pai sempre se alegrava com a minha simplicidade, porque eu oferecia todo primogênito ao Senhor por meio do sacerdote e, depois, também a meu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego diz literalmente: “e depois também a meu pai”, sem repetir o verbo nem indicar expressamente o que era oferecido a ele.'
    reason: Preserva a elipse e a ambiguidade do texto-fonte, sem acrescentar que se tratava de uma parte.
lexical_decisions:
- source_word: ἁπλότητί
  choice: sinceridade
  rationale: No contexto, denota singeleza ou integridade de intenção, não falta de inteligência; “sinceridade” comunica isso em português corrente e digno.
- source_word: πᾶν πρῶτον γέννημα
  choice: todo primogênito
  rationale: Expressão cultual para a primeira cria de cada animal; “primogênito” preserva a formulação tradicional e a relação com a oferta ao Senhor.
- source_word: διὰ τοῦ ἱερέως
  choice: por meio do sacerdote
  rationale: Mantém explicitamente a mediação indicada por διά com genitivo.
- source_word: προσέφερον
  choice: eu oferecia ... e ... dava uma parte
  rationale: O verbo rege tanto o que se entrega ao Senhor como o que se destina ao pai. Na segunda ocorrência elíptica, “dava uma parte” produz português natural sem sugerir que o pai recebia um primogênito inteiro.
theological_decisions:
- issue: Natureza da simplicidade de Issacar
  choice: sinceridade
  alternative: simplicidade
  rationale: “Sinceridade” evita que ἁπλότης seja entendida como ingenuidade intelectual, embora “simplicidade” seja uma tradução mais formal e possível.
- issue: Objeto da entrega posterior ao pai
  choice: explicitar de modo prudente “uma parte” e registrar a elipse em nota
  alternative: “e depois também a meu pai”, deixando o objeto inteiramente implícito
  rationale: O grego omite o objeto após τῷ πατρί μου. O contexto sugere uma porção destinada ao pai, mas a nota preserva a ambiguidade sintática e evita afirmar que o mesmo primogênito inteiro era oferecido duas vezes.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi ajustada para fluência, mantendo a alegria habitual do pai, a qualidade moral de Issacar, a oferta de todo primogênito ao Senhor e a mediação sacerdotal.
