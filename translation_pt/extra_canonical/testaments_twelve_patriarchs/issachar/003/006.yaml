  source_fidelity: A redação introduz “dava uma parte”, que não está expresso no grego. Embora procure resolver uma elipse provável, isso determina o objeto e a natureza da entrega posterior ao pai, enquanto o texto apenas coordena “e depois também a meu pai” sob o único verbo προσέφερον. “Simplicidade” reproduz ἁπλότης mais diretamente e conserva sua amplitude semântica (singeleza, integridade, simplicidade).
  naturalness: A frase é clara e fluente em português moderno. A elipse final, embora ligeiramente mais literária, é natural no registro da obra e é adequadamente explicada em nota.
  terminology: “Primogênito”, “Senhor” e “por meio do sacerdote” correspondem bem a πρῶτον γέννημα, Κυρίῳ e διὰ τοῦ ἱερέως. “Simplicidade” é preferível a “sinceridade” por não estreitar o termo-fonte.
