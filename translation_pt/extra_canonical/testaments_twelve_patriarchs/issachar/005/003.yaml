id: T12P.ISS.5.3
reference: Testament of Issachar 5:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. ᶜὙποτίθετε¹⁰ τὸν νῶτον¹¹ ὑμῶν εἰς τὸ γεωργεῖν καὶ ἐργάζεσθε ἐν ἔργοις¹² ⌜καθ᾽ ἑκάστην γεωργίαν, δῶρα μετ᾽ εὐχαριστείας¹³ Κυρίῳ προσφέροντες¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/003.yaml
  text: Bend your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving.
translation:
  language: pt
  text: Curvem as costas para cultivar a terra e trabalhem em toda atividade agrícola, oferecendo dádivas ao Senhor com ações de graças.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: Curvem as costas
  rationale: Preserva a imagem concreta de submeter as costas ao trabalho, em formulação natural no português moderno.
- source_word: εἰς τὸ γεωργεῖν
  choice: para cultivar a terra
  rationale: Expressa claramente a atividade agrícola indicada pelo infinitivo γεωργεῖν.
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  choice: trabalhem em toda tarefa do campo
  rationale: Reproduz a amplitude de καθ᾽ ἑκάστην e evita a repetição pouco natural de 'trabalhar em trabalhos', mantendo o âmbito agrícola.
- source_word: δῶρα
  choice: dádivas
  rationale: Mantém o sentido amplo de presentes ou ofertas sem restringir indevidamente a um tipo ritual específico.
- source_word: μετ᾽ εὐχαριστείας
  choice: com ações de graças
  rationale: Verte a ideia de gratidão expressa e conserva o tom religioso da frase.
- source_word: Κυρίῳ προσφέροντες
  choice: oferecendo ... ao Senhor
  rationale: Mantém a construção participial e o destinatário explícito da oferta.
theological_decisions:
- issue: Natureza das dádivas oferecidas ao Senhor
  choice: dádivas
  alternative: ofertas
  rationale: O grego δῶρα não especifica se se trata de ofertas cultuais, frutos do trabalho ou presentes em sentido mais amplo; 'dádivas' preserva essa abertura.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural. A imagem física do labor agrícola foi preservada sem rigidez excessiva.
source_grounding:
  english_pob_role: consult_only
