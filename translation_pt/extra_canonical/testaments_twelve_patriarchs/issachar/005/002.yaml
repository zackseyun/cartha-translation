  source_fidelity: A tradução transmite com precisão os dois imperativos aoristos plurais (ἀγαπήσατε; ἐλεήσατε), seus objetos e a sequência exortativa. «Mas» corresponde adequadamente a ἀλλά no encadeamento discursivo; «o Senhor», «o próximo», «os pobres» e «os fracos» preservam o sentido e a amplitude do grego, em especial ἀσθενῆ sem reduzi-lo a doença.
  naturalness: O português é moderno, claro e de registro digno. «Amem o Senhor e o próximo. Tenham misericórdia dos pobres e dos fracos.» é idiomático, legível no uso brasileiro e compreensível internacionalmente. A divisão em duas frases acompanha a edição fornecida.
  terminology: «Senhor» mantém o título reverente sem identificação teológica adicional. «Próximo» é o equivalente estabelecido para πλησίον. «Ter misericórdia» reproduz naturalmente ἐλεέω, e «fracos» conserva a ambiguidade de ἀσθενής.
