  text: 2. Ἀλλὰ ἀγαπήσατε⁵ τὸν⁶ Κύριον καὶ τὸν πλησίον⁷· πένητα καὶ ἀσθενῆ⁸ ἐλεήσατε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/002.yaml
  text: But love the Lord and your neighbor. Show mercy to the poor and the weak.
translation:
  language: pt
  text: Mas amem o Senhor e o próximo. Tenham misericórdia dos pobres e dos fracos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: amem
  rationale: Imperativo aoristo plural de ἀγαπάω; “amem” expressa de modo natural e direto a exortação dirigida a mais de uma pessoa.
- source_word: τὸν πλησίον
  choice: o próximo
  rationale: Equivalente consagrado e semanticamente adequado para a pessoa que está em relação de proximidade com alguém.
- source_word: πένητα
  choice: dos pobres
  rationale: πένης designa quem tem poucos recursos e precisa trabalhar para viver; “pobres” é a forma clara e corrente no contexto.
- source_word: ἀσθενῆ
  choice: dos fracos
  rationale: O termo pode indicar fraqueza, debilidade ou enfermidade. “Fracos” preserva a abrangência sem restringir o sentido apenas aos doentes.
- source_word: ἐλεήσατε
  choice: tenham misericórdia
  rationale: Reproduz o imperativo plural e conserva a linguagem moral e afetiva de ἐλεέω de maneira digna e compreensível.
theological_decisions:
- issue: Referente de Κύριον
  choice: o Senhor
  alternative: ao Senhor
  rationale: Mantém a designação reverente e a coordenação direta dos dois objetos de “amem”, sem acrescentar uma identificação não explicitada no versículo.
- issue: Alcance de ἀσθενῆ
  choice: fracos
  alternative: doentes
  rationale: O grego admite fraqueza física ou condição debilitada mais ampla; “fracos” preserva essa ambiguidade em vez de limitá-la à enfermidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com imperativos no plural. A divisão em duas frases acompanha a pontuação da edição grega e favorece clareza. Não há marcadores de nota, pois nenhuma nota de rodapé foi necessária.
