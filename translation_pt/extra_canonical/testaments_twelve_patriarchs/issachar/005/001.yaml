    issue: «andem com integridade» para ἐν ἀκακίᾳ
    rationale: ἀκακία denota inocência, ausência de malícia ou de maldade; «integridade» é uma virtude mais ampla e pode sugerir sobretudo honestidade ou inteireza moral.
  - severity: low
    issue: «sem se intrometerem» para μὴ περιαργαζόμενοι
    rationale: O verbo pode incluir intromissão, mas seu alcance básico é ocupar-se indevidamente ou preocupar-se com os assuntos/atos de outra pessoa. «Sem se ocuparem» preserva melhor essa amplitude.
