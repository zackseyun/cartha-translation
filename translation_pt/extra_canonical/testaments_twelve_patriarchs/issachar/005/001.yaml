source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: V. Φυλάξατε οὖν *τέκνα μου νόμον Θεοῦ¹, καὶ *τὴν ἁπλότητα κτήσασθε², ⌜καὶ ἐν ἀκακίᾳ πορεύεσθε, μὴ περιαργαζόμενοι τοῦ³ πλησίον⁴ τὰς πράξεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/001.yaml
  text: Therefore, my children, keep the law of God, and acquire simplicity, and walk in innocence, not concerning yourselves with the deeds of your neighbor.
translation:
  language: pt
  text: Portanto, meus filhos, guardem a lei de Deus e adquiram a simplicidade; andem em inocência, sem se ocuparem das ações do próximo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: guardem
  rationale: Preserva o sentido de observar e cumprir fielmente, em formulação bíblica natural.
- source_word: τὴν ἁπλότητα
  choice: a simplicidade
  rationale: Mantém a amplitude de ἁπλότης, que pode envolver singeleza, sinceridade e ausência de duplicidade, sem reduzir o termo a uma interpretação única.
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  choice: andem com integridade
  rationale: Expressa de modo corrente a conduta sem malícia ou maldade indicada por ἀκακία, evitando o possível sentido moderno de ingenuidade associado a 'inocência'.
- source_word: μὴ περιαργαζόμενοι
  choice: sem se intrometerem
  rationale: Comunica a ideia de ocupar-se indevidamente ou interferir nos assuntos alheios, mais precisamente do que uma referência genérica a estar ocupado.
- source_word: τοῦ πλησίον τὰς πράξεις
  choice: nas ações do próximo
  rationale: Conserva tanto o termo relacional πλησίον quanto a referência ampla aos atos ou assuntos dessa pessoa.
theological_decisions:
- issue: Alcance moral de ἁπλότης e ἀκακία
  choice: Traduzir por 'simplicidade' e 'integridade'
  alternative: '''singeleza'' e ''inocência'''
  rationale: A opção mantém distintos os dois conceitos e evita transformar ἀκακία em ingenuidade, sem impor uma definição teológica denominacional.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com imperativos no plural. A pontuação organiza as exortações sem alterar sua sequência.
