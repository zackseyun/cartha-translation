lexical_decisions:
- source_word: εὐλογίαις
  choice: bênçãos
  rationale: Mantém o substantivo cognato e a repetição com o verbo “abençoou”, preservando a formulação enfática do grego.
- source_word: γῆς
  choice: terra
  rationale: Equivalente direto e natural, sem restringir indevidamente o sentido a solo ou território.
- source_word: ἀπαρχῶν
  choice: primícias
  rationale: Termo corrente no registro bíblico para os primeiros produtos ou frutos apresentados, preservando sua possível dimensão cultual.
- source_word: καρπῶν
  choice: frutos
  rationale: Reproduz de perto o sentido lexical e mantém a expressão genitiva “primícias dos frutos”.
