  text: For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now.
translation:
  language: pt
  text: Pois, nas primícias dos frutos da terra, o Senhor abençoará vocês, assim como abençoou todos os santos, desde Abel até agora.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: nas primícias dos frutos da terra
  rationale: Expressa a oferta inicial da produção agrícola em linguagem bíblica corrente, preservando a formulação concreta do grego.
- source_word: εὐλογήσει ὑμᾶς
  choice: abençoará vocês
  rationale: Mantém o futuro e o plural explícitos, com forma amplamente compreensível no português moderno.
- source_word: τοὺς ἁγίους
  choice: os santos
  rationale: Conserva a designação religiosa substantivada do grego sem restringi-la interpretativamente a 'justos' ou 'fiéis'.
- source_word: ἀπὸ Ἀβὲλ ἕως τοῦ νῦν
  choice: desde Abel até agora
  rationale: Reproduz diretamente o intervalo temporal indicado no texto.
theological_decisions:
- issue: Identidade de πάντας τοὺς ἁγίους
  choice: todos os santos
  alternative: todos os fiéis / todos os justos
  rationale: A tradução mantém a categoria ampla e potencialmente ambígua do original, sem definir por conta própria quem está incluído.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário bíblico amplamente reconhecido. A estrutura foi levemente ajustada por vírgulas para dar clareza sem alterar a relação causal e comparativa do original.
