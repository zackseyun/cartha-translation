  text: 5. Οὐ γὰρ δέδοται ὑμῖν²⁴ ἄλλη μερὶς Γ*εἰ μὴ²⁵ *τῆς πιότητος²⁶ τῆς γῆς *ἐν πόνοις καρπῶν²⁷¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/005.yaml
  text: For no other portion has been given to you except the richness of the earth by the labor of fruits.
translation:
  language: pt
  text: Pois nenhuma outra porção lhes foi dada, a não ser a riqueza da terra, em trabalhos ligados aos frutos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega traduzida como “em trabalhos ligados aos frutos” é incomum e também pode ser entendida como “em trabalhos de colheita” ou “mediante o trabalho que produz frutos”.
    reason: A construção ἐν πόνοις καρπῶν é semanticamente difícil; a nota preserva alternativas plausíveis sem resolver a ambiguidade no texto principal.
lexical_decisions:
- source_word: μερὶς
  choice: porção
  rationale: Preserva o sentido de parte, quinhão ou parcela concedida, sem especificar indevidamente se se trata de herança.
- source_word: πιότητος τῆς γῆς
  choice: riqueza da terra
  rationale: Traduz a ideia de fertilidade ou abundância produtiva do solo em português natural, mantendo o teor positivo da expressão.
- source_word: ἐν πόνοις καρπῶν
  choice: mediante o trabalho dos frutos
  rationale: Mantém de perto a construção grega difícil e sua ambiguidade, sem acrescentar o possessivo 'seus' nem identificar explicitamente quem trabalha.
theological_decisions:
- issue: Natureza da porção concedida
  choice: porção
  alternative: herança
  rationale: O grego μερίς permite a ideia de quinhão, mas não exige a noção jurídica ou teológica mais específica de herança.
translation_notes:
  register: Português moderno, digno e de leitura ampla. Emprega “lhes” para ὑμῖν e conserva a formulação compacta e um tanto enigmática do original, esclarecida apenas em nota.
