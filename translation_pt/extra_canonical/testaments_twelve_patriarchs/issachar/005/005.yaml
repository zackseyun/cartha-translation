revisions:
- from: Pois nenhuma outra porção lhes foi dada, a não ser a riqueza da terra, mediante o trabalho dos frutos.[a]
  to: Pois nenhuma outra porção lhes foi dada, a não ser a riqueza da terra, em trabalhos ligados aos frutos.[a]
  rationale: A revisão substitui uma formulação portuguesa que pode atribuir instrumentalidade excessiva ao trabalho e soar como se os frutos fossem os agentes do trabalho. A nova redação mantém a conexão deliberadamente ampla entre os trabalhos e os frutos, correspondente à construção grega difícil, e preserva a explicitação das leituras possíveis na nota.
