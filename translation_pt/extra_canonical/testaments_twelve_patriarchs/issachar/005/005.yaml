review_pass:
  verdict: revise
  source_fidelity: O texto preserva corretamente «nenhuma outra porção» (μερὶς), a concessão passiva dirigida ao plural «lhes» (ὑμῖν) e «a riqueza da terra» (τῆς πιότητος τῆς γῆς). Contudo, «mediante o trabalho dos frutos» tende a apresentar o trabalho como meio instrumental e, em português, pode sugerir de modo estranho que os próprios frutos trabalham. A construção grega ἐν πόνοις καρπῶν é difícil e deve continuar assinalada como tal, mas «em trabalhos ligados aos frutos» reflete melhor o valor amplo de ἐν e a relação não especificada do genitivo καρπῶν.
  naturalness: A revisão mantém um registro sóbrio e moderno. «Trabalhos ligados aos frutos» é mais compreensível para leitores lusófonos internacionais do que «trabalho dos frutos», sem transformar a formulação em uma explicação excessivamente específica.
  terminology: «Porção» é uma boa tradução de μερίς e evita impor «herança». «Riqueza da terra» comunica adequadamente a fertilidade/abundância de πιότης. A nota conserva alternativas para a expressão sintaticamente e semanticamente incerta, sem fixar uma interpretação doutrinária ou agrícola única.
  issues:
  - severity: medium
    issue: A expressão principal «mediante o trabalho dos frutos» é pouco idiomática e estreita a relação expressa por ἐν.
    rationale: «Mediante» introduz com força uma ideia de meio; o grego ἐν pode indicar o âmbito ou as circunstâncias dos labores. Além disso, «trabalho dos frutos» é ambíguo em português de uma forma que não reproduz produtivamente a dificuldade grega.
  revised_text: Pois nenhuma outra porção lhes foi dada, a não ser a riqueza da terra, em trabalhos ligados aos frutos.[a]
