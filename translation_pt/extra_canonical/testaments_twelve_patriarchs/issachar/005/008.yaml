review_pass:
  verdict: revise
  source_fidelity: A primeira oração é fiel em geral. Contudo, ἐπερχόμενα é particípio presente, «que vinham/sobrevinham», e não pede o imperfeito «avançavam». A construção τῷ δὲ Γὰδ ἐδόθη é reproduzida de modo mais direto por «a Gade foi dado».
  naturalness: «Obedeçam a eles» e «andem na simplicidade» são naturais e conservam o registro exortativo. «Do pai de vocês» evita a ambiguidade frequente de «seu pai» no português brasileiro, sem perder a segunda pessoa plural.
  terminology: «Simplicidade» preserva adequadamente ἁπλότης. «Bandos de saqueadores» é uma solução natural para πειρατήρια e condiz com o registro do trecho assinalado entre colchetes.
  issues:
  - severity: medium
    issue: Tempo/aspecto de ἐπερχόμενα
    rationale: «Que avançavam» introduz um valor imperfectivo passado que não está expresso no particípio presente grego. «Que vinham contra Israel» conserva melhor a ação em curso de grupos que se aproximam/irrompem contra Israel.
  - severity: low
    issue: Ambiguidade de «seu pai»
    rationale: Em português moderno de leitura brasileira, «seu» pode remeter a «eles». «Do pai de vocês» torna claro o possessivo de segunda pessoa plural de ὑμῶν.
  - severity: low
    issue: Formulação de ἐδόθη
    rationale: «Foi concedido» é possível, mas «foi dado» é mais próximo da passiva impessoal grega e não acrescenta a nuance administrativa de concessão.
  revised_text: Portanto, obedeçam a eles e andem na simplicidade do pai de vocês. [Mas a Gade foi dado destruir os bandos de saqueadores que vinham contra Israel.]
  revised_footnotes: []
