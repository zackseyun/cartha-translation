base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/008.yaml
  text: Therefore obey them, and walk in the simplicity of your father. [But to Gad it was given to destroy the marauding bands coming upon Israel.]
translation:
  language: pt
  text: Portanto, obedeçam a eles e andem na simplicidade do pai de vocês. [Mas a Gade foi dado destruir os bandos de saqueadores que vinham contra Israel.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακούετε
  choice: obedeçam
  rationale: Expressa diretamente a ordem de ouvir e acatar, em português corrente e digno.
- source_word: ἁπλότητι
  choice: simplicidade
  rationale: Preserva a amplitude do termo grego, que pode envolver singeleza, sinceridade e integridade, sem reduzir o sentido a uma única virtude.
- source_word: περιπατεῖτε
  choice: andem
  rationale: Mantém a metáfora bíblica de caminhar como modo de viver.
- source_word: πειρατήρια
  choice: bandos de saqueadores
  rationale: O termo designa grupos dedicados à pilhagem; esta formulação é natural em português e evita a expressão menos precisa 'ataques saqueadores'.
- source_word: ἐπερχόμενα ... τῷ Ἰσραήλ
  choice: que avançavam contra Israel
  rationale: Reproduz a ideia de grupos que vêm ou investem contra Israel.
theological_decisions:
- issue: Referente de αὐτοῖς ('a eles')
  choice: Manter o pronome sem explicitar o referente
  alternative: Substituir por um grupo nominal inferido do contexto anterior
  rationale: O versículo isolado não identifica o referente, e explicitá-lo resolveria indevidamente uma dependência contextual do original.
- issue: Natureza da concessão feita a Gade
  choice: foi concedido
  alternative: foi dado
  rationale: Ambas são possíveis; 'foi concedido' comunica a construção passiva ἐδόθη sem identificar explicitamente o agente e sem acrescentar uma interpretação teológica.
- issue: Trecho entre colchetes
  choice: Preservar os colchetes
  alternative: Integrar o trecho sem marcação
  rationale: A fonte apresenta a oração como segmento textualmente assinalado; os colchetes conservam essa distinção sem decidir sua condição textual.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais brasileiras de ampla compreensão. Conserva a metáfora 'andar na simplicidade' e a ambiguidade contextual de 'a eles'. Os colchetes reproduzem a sinalização textual da edição-fonte.
