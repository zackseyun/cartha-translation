review_pass:
  verdict: revise
  source_fidelity: A primeira frase traduz adequadamente Καὶ ὁ Λευὶ καὶ ὁ Ἰούδας ἐδοξάσθησαν παρὰ Κυρίου καὶ ἐν υἱοῖς Ἰακώβ. Na segunda, ἐκληροδότησεν expressa a atribuição ou repartição de uma herança/porção; a enumeração explicativa do sacerdócio e do reino é preservada.
  naturalness: O texto é claro e de registro apropriado. Contudo, em «lhes atribuiu a sua herança», o possessivo «sua» pode, em português, remeter ao Senhor, produzindo uma ambiguidade que não é pretendida pela formulação inglesa nem é conveniente no contexto. A forma sem possessivo é mais direta e idiomática.
  terminology: «Senhor», «sacerdócio» e «reino» são equivalentes estáveis e adequados para Κύριος, ἱερατεία e βασιλεία. «Foram glorificados» conserva bem a passiva de ἐδοξάσθησαν.
  issues:
  - severity: low
    issue: Possessivo potencialmente ambíguo em «a sua herança».
    rationale: Em português, «sua» pode ser entendido como «a herança do Senhor», enquanto o sentido é que o Senhor atribuiu uma herança/porção a Levi e Judá. A omissão do possessivo elimina essa ambiguidade sem perda de conteúdo.
  revised_text: 'E Levi e Judá foram glorificados pelo Senhor entre os filhos de Jacó. E o Senhor lhes atribuiu a herança: a Levi, o sacerdócio; e a Judá, o reino.'
  revised_footnotes: []
