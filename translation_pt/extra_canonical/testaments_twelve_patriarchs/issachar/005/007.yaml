base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/007.yaml
  text: 'And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord allotted to them their inheritance: to Levi, the priesthood; and to Judah, the kingdom.'
translation:
  language: pt
  text: 'E Levi e Judá foram glorificados pelo Senhor entre os filhos de Jacó. E o Senhor lhes atribuiu a herança: a Levi, o sacerdócio; e a Judá, o reino.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: foram glorificados
  rationale: Preserva a voz passiva e o sentido de receber glória ou honra, sem reduzi-lo apenas a reconhecimento humano.
- source_word: παρὰ Κυρίου
  choice: pelo Senhor
  rationale: Neste contexto, expressa naturalmente o agente da forma passiva ἐδοξάσθησαν.
- source_word: ἐν υἱοῖς Ἰακώβ
  choice: entre os filhos de Jacó
  rationale: Traduz o valor relacional de ἐν de modo idiomático em português.
- source_word: ἐκληροδότησεν αὐτούς
  choice: lhes atribuiu a sua herança
  rationale: Comunica a concessão ou designação de uma herança, em consonância com a explicitação subsequente do sacerdócio e do reino.
- source_word: τὴν ἱερατείαν
  choice: o sacerdócio
  rationale: Equivalente direto e tradicional para o ofício sacerdotal destinado a Levi.
- source_word: τὴν βασιλείαν
  choice: o reino
  rationale: Mantém o substantivo abstrato/institucional grego, que pode abranger realeza, governo régio ou reino, sem estreitá-lo para 'monarquia'.
theological_decisions:
- issue: Origem da honra de Levi e Judá
  choice: foram glorificados pelo Senhor
  alternative: receberam honra da parte do Senhor
  rationale: A opção principal conserva mais de perto a forma passiva e o léxico de δοξάζω, sem explicar além do texto.
- issue: Natureza da porção concedida
  choice: a Levi, o sacerdócio; e a Judá, o reino
  alternative: a Levi, o ofício sacerdotal; e a Judá, a realeza
  rationale: A formulação escolhida preserva o paralelismo conciso e a amplitude dos substantivos gregos, sem importar uma construção denominacional específica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Mantém o paralelismo do grego e evita explicações interpretativas dentro do texto.
