  to: 'E Levi e Judá foram glorificados pelo Senhor entre os filhos de Jacó. E o Senhor lhes atribuiu a herança: a Levi, o sacerdócio; e a Judá, o reino.'
  rationale: Remove-se apenas o possessivo ambíguo na segunda frase. A revisão preserva a concisão, o paralelismo e a amplitude semântica do grego, bem como a divisão da herança explicitada pelos dois membros finais.
