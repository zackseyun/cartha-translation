source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: II. Τότε Γοὖν¹ ὤφθη τῷ² Ἰακώβ³ Γἄγγελος Κυρίου καὶ εἶπε λέγων⁴, *ὅτι τέκνα τέξει Ῥαχήλ⁵, *ἐπειδὴ κατέπτυσεν⁶ συνουσίαν⁷ ἀνδρὸς καὶ ἐξελέξατο τὴν⁸ ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/001.yaml
  text: Then an angel of the Lord appeared to Jacob, saying, “Rachel will bear children, because she despised intercourse with a husband and chose self-control.”
translation:
  language: pt
  text: 'Então um anjo do Senhor apareceu a Jacó, dizendo: “Raquel dará à luz filhos, porque desprezou as relações com um homem e escolheu o domínio próprio.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα τέξει
  choice: terá filhos
  rationale: Expressa naturalmente a ideia de dar à luz filhos, sem acrescentar um número que não está seguro no texto apresentado.
- source_word: κατέπτυσεν
  choice: desprezou
  rationale: Preserva a força do verbo grego, literalmente associado a tratar algo com desprezo, sem suavizá-lo para mera recusa.
- source_word: συνουσίαν ἀνδρός
  choice: as relações com o marido
  rationale: Neste contexto, συνουσία indica relações sexuais, e ἀνήρ pode significar marido; a formulação é clara e digna em português moderno.
- source_word: ἐγκράτειαν
  choice: domínio próprio
  rationale: Termo corrente que comunica autocontrole ou continência e preserva a dimensão moral do vocábulo grego.
theological_decisions:
- issue: A razão atribuída à fecundidade de Raquel
  choice: Manter explicitamente a relação causal introduzida por ἐπειδή.
  alternative: Atenuar para uma simples sequência ou circunstância.
  rationale: O texto grego afirma a causalidade de modo direto; embora ela gere tensão com outras tradições sobre Raquel, a tradução não deve resolvê-la nem corrigi-la.
- issue: Número de filhos
  choice: Não especificar quantidade.
  alternative: “dois filhos”
  rationale: O texto-fonte fornecido traz τέκνα sem numeral seguro nesta oração, em consonância com a revisão crítica indicada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. A construção “dizendo” acompanha λέγων sem produzir uma frase artificial; “relações com o marido” evita tanto o tecnicismo quanto a vulgaridade.
