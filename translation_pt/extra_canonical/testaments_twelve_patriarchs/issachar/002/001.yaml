    rationale: ἀνήρ pode significar “homem” ou “marido”, mas o texto não traz artigo, possessivo nem outro elemento que permita verter “o marido”. A tradução deve manter a referência não especificada.
  - severity: low
    issue: “terá filhos” é menos específico que τέξει.
    rationale: O futuro de τίκτω significa “dará à luz” ou “gerará”; essa formulação conserva melhor a ação expressa pelo verbo sem introduzir número de filhos.
