  text: 2. Καὶ⁹ εἰ μὴ Λεία¹⁰ ἡ μήτηρ μου ἀντὶ συνουσίας ἀπέδοτο¹¹ τὰ δύο μῆλα, [ἔτι]¹² ὀκτὼ υἱοὺς ἔμελλε¹³ τεκεῖν· διὰ τοῦτο ἓξ ἔτεκε, *καὶ Ῥαχιὴλ τέτοκε τοὺς δύο¹⁴ ὅτι ἐν *τοῖς μανδραγόροις¹⁵ ἐπεσκέψατο αὐτὴν¹⁶ ὁ¹⁷ Κύριος.
