  to: E, se minha mãe Lia não tivesse dado os dois frutos em troca de relações conjugais, ela teria chegado a dar à luz oito filhos; por isso, deu à luz seis, e Raquel deu à luz os dois, pois, por causa das mandrágoras, o Senhor a visitou.
