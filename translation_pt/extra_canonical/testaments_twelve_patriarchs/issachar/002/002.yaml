base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/002.yaml
  text: And had Leah my mother not given over the two fruits in exchange for intercourse, she would have been about to bear eight sons; for this reason she bore six, and Rachel bore the two — because in the mandrakes the Lord visited her.
translation:
  language: pt
  text: E, se minha mãe Lia não tivesse dado os dois frutos em troca de relações conjugais, ela teria chegado a dar à luz oito filhos; por isso, deu à luz seis, e Raquel deu à luz os dois, pois, por causa das mandrágoras, o Senhor a visitou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνουσίας
  choice: relações conjugais
  rationale: Expressa de modo natural e digno a relação sexual no contexto matrimonial de Gênesis 30, sem recorrer a um eufemismo obscuro.
- source_word: ἀπέδοτο
  choice: tivesse dado ... em troca de
  rationale: Preserva o sentido de ceder ou negociar algo como contrapartida.
- source_word: τὰ δύο μῆλα
  choice: os dois frutos
  rationale: Traduz literalmente μῆλα como frutos; a identificação contextual com mandrágoras aparece ao fim do versículo.
- source_word: ἔμελλε τεκεῖν
  choice: teria chegado a dar à luz
  rationale: Comunica a expectativa contrafactual de que Lia estava destinada ou prestes a gerar oito filhos, sem impor uma noção técnica de predestinação.
- source_word: ἐν τοῖς μανδραγόροις
  choice: por meio das mandrágoras
  rationale: A preposição ἐν pode indicar esfera ou meio; esta formulação conserva a associação causal ou instrumental sugerida pelo texto sem atribuir poder autônomo às plantas.
- source_word: ἐπεσκέψατο
  choice: visitou
  rationale: Mantém a linguagem bíblica tradicional da intervenção favorável de Deus, preservando sua densidade teológica.
theological_decisions:
- issue: A relação entre as mandrágoras e a concepção de Raquel
  choice: foi por meio das mandrágoras que o Senhor a visitou
  alternative: o Senhor a visitou no episódio das mandrágoras
  rationale: A tradução conserva a afirmação difícil e potencialmente instrumental do grego ἐν τοῖς μανδραγόροις, em vez de atenuá-la por harmonização com Gênesis 30:22.
- issue: A distribuição dos oito filhos
  choice: Raquel deu à luz os outros dois
  alternative: Raquel deu à luz os dois
  rationale: “Os outros” torna clara em português a lógica interna de seis mais dois, sem alterar a alegação do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A expressão “relações conjugais” evita tanto crueza desnecessária quanto ambiguidade. A sintaxe mantém o encadeamento causal e a tensão teológica do original.
