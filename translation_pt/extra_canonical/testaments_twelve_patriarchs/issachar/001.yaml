review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha os quinze segmentos do testemunho grego, inclusive os vv. 11 e 14, que a camada inglesa renumera ou trata de modo diferente. Contudo, o v. 13 precisava deixar claro que Lia fala de alugar-se a Raquel por uma noite com Jacó; a redação anterior fazia parecer que ela alugava uma noite. No v. 12, "me retirou" era pouco preciso para a ação de Labão, que afastou Raquel naquela noite.
  naturalness: O texto é claro e de registro digno. Foram feitos pequenos ajustes para tornar a abertura idiomática e para evitar construções portuguesas ambíguas nos vv. 12–14.
  terminology: Foram preservados "mandrágoras", "frutos perfumados", "pagamento" e o eufemismo bíblico "conheceu". "Prometido" para ἡρμόσατο mantém adequadamente o vínculo matrimonial anterior sem antecipar uma interpretação mais específica.
  issues:
  - severity: medium
    issue: O v. 13 torna "uma noite" o objeto de "alugarei".
    rationale: ἐκμισθῶ σοι μίαν νύκτα τῷ Ἰακώβ expressa que Lia se aluga/é cedida a Raquel por uma noite com Jacó, não que uma noite seja alugada.
  - severity: low
    issue: '"Me retirou" no v. 12 é impreciso e pouco natural no contexto narrativo.'
    rationale: μετέστησέ με indica que Labão afastou ou deslocou Raquel naquela noite; "me afastou" comunica isso sem harmonizar além do texto.
  - severity: low
    issue: A fórmula de abertura estava sintaticamente pouco natural em português.
    rationale: A construção foi reorganizada para conservar o apelo a ouvir Issacar como pai dos destinatários.
  revised_text: '**Testamento de Issacar, quinto filho de Jacó e Lia**


    **1.** Cópia das palavras de Issacar. Ele chamou seus filhos e lhes disse:


    — Escutem Issacar, seu pai, meus filhos; deem ouvidos às palavras daquele que é amado pelo Senhor.


    **2.** Eu nasci como o quinto filho de Jacó, como pagamento pelas mandrágoras.


    **3.** Meu irmão Rúben trouxe mandrágoras do campo. Raquel foi ao encontro dele e as tomou.


    **4.** Rúben, porém, chorava; ao ouvir sua voz, Lia, minha mãe, saiu.


    **5.** Eram frutos perfumados,[a] que crescem na terra de Harã, abaixo de uma ravina por onde corre água.


    **6.** Raquel disse:


    — Não darei esses frutos a você; ficarei com eles em lugar de filhos, pois o Senhor não olhou para mim, e eu não dei filhos a Jacó.


    **7.** Os frutos eram dois. Lia disse a Raquel:


    — Não basta você ter tomado meu marido? Tomará de mim também estes frutos?


    **8.** Raquel lhe respondeu:


    — Então Jacó ficará com você esta noite em troca das mandrágoras de seu filho.


    **9.** Lia lhe disse:


    — Jacó é meu, pois eu sou a mulher da juventude dele.


    **10.** Raquel respondeu:


    — Não se vanglorie nem se exalte, pois ele foi prometido a mim antes de você e, por minha causa, serviu ao nosso pai durante catorze anos.


    **11.** Se o engano não tivesse se multiplicado sobre a terra e a maldade humana não tivesse se espalhado, você não estaria vendo o rosto de Jacó.


    **12.** Labão me enganou traiçoeiramente e me afastou naquela noite. Não permitiu que Jacó me visse, pois, se eu estivesse ali, isso não teria acontecido com ele.[b]


    **13.** Mesmo assim, em troca das mandrágoras, alugarei a mim mesma a você por uma noite com Jacó.


    **14.** Raquel continuou:


    — Ficarei com uma das mandrágoras e, em troca de uma delas, alugarei a você uma noite.[c]


    **15.** Jacó conheceu Lia, e ela concebeu e me deu à luz. Por causa desse pagamento, recebi o nome Issacar.[d]'
