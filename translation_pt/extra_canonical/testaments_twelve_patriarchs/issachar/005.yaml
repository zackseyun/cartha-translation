base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005.yaml
  text: '1 Therefore[a], my children, keep the law of God, and acquire simplicity, and walk in innocence, not meddling in the deeds of your neighbor. 2 But love the Lord and your neighbor; show mercy to the poor and the weak. 3 Set your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving. 4 For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now[b]. 5 For no other portion has been given to you except the richness of the earth in the toils of its fruits. 6 For my father Jacob also blessed me with blessings of the earth and of firstfruits of produce. 7 And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord gave them their inheritance: to Levi, the priesthood; and to Judah, the kingdom. 8 Therefore obey them, and walk in the simplicity of your father[c]. [But to Gad it was given to destroy the marauding raids coming upon Israel.]'
translation:
  language: pt
  text: '1 Portanto, meus filhos, guardem a lei de Deus, cultivem a simplicidade e andem em inocência, sem se intrometerem nas ações do próximo. 2 Amem, porém, o Senhor e o próximo; tenham misericórdia do pobre e do fraco. 3 Curvem as costas para cultivar a terra e trabalhem em todo trabalho de cultivo, oferecendo dádivas ao Senhor com ações de graças. 4 Pois, nas primícias dos frutos da terra, o Senhor os abençoará, assim como abençoou todos os santos desde Abel até agora.[a] 5 Porque nenhuma outra porção lhes foi dada, a não ser a fertilidade da terra, nos trabalhos penosos de seus frutos.[b] 6 Pois também meu pai Jacó me abençoou com bênçãos da terra e das primícias dos frutos. 7 Levi e Judá foram glorificados pelo Senhor entre os filhos de Jacó. E o Senhor lhes deu sua herança: a Levi, o sacerdócio; e a Judá, o reino. 8 Portanto, obedeçam a eles e andem na simplicidade de seu pai. [Mas a Gade foi dado destruir as incursões de saqueadores que vinham contra Israel.][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Todos os santos desde Abel até agora” provavelmente se refere à sucessão de adoradores aceitos que começa com Abel, em conexão com o tema das primícias.
    reason: cross_reference
  - marker: b
    text: Mais literalmente, “a gordura da terra, nos trabalhos penosos de seus frutos”. A expressão “gordura da terra” é uma imagem agrícola para sua riqueza ou fertilidade; a construção grega é compacta e pouco clara.
    reason: lexical_alternative
  - marker: c
    text: A oração final sobre Gade é textualmente estranha neste contexto e pode ser uma glosa posterior ou uma linha deslocada. Ela é traduzida porque aparece no testemunho grego.
    reason: textual_variant
lexical_decisions:
- source_word: νόμον Θεοῦ
  choice: a lei de Deus
  rationale: Conserva o genitivo objetivo e o tom solene da exortação testamentária.
- source_word: ἁπλότητα
  choice: simplicidade
  rationale: Preserva o tema recorrente de uma vida sem duplicidade nem artifício, sem restringi-lo interpretativamente a mera sinceridade.
- source_word: ἀκακίᾳ
  choice: inocência
  rationale: Expressa a ausência de malícia e forma um par natural, mas não redundante, com “simplicidade”.
- source_word: μὴ περιαργαζόμενοι τοῦ πλησίον τὰς πράξεις
  choice: sem se intrometerem nas ações do próximo
  rationale: Comunica a interferência indevida ou curiosidade importuna acerca do que o outro faz.
- source_word: ἐλεήσατε
  choice: tenham misericórdia
  rationale: Mantém a força ética do imperativo e é uma formulação bíblica clara em português moderno.
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: Curvem as costas
  rationale: Preserva a imagem corporal de submeter-se ao esforço agrícola de modo natural em português.
- source_word: γεωργεῖν / γεωργίαν
  choice: cultivar a terra / tarefa do campo
  rationale: Mantém o cenário agrário, evitando uma repetição rígida e pouco natural.
- source_word: δῶρα μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  choice: oferecendo dádivas ao Senhor com ações de graças
  rationale: Preserva tanto a apresentação cultual das dádivas quanto o tom devocional de εὐχαριστία.
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: nas primícias dos frutos da terra
  rationale: Mantém explicitamente a linguagem das primícias e a construção agrícola do grego.
- source_word: ἁγίους
  choice: santos
  rationale: É o equivalente direto e inteligível de ἁγίους; a nota esclarece o provável referente sem substituir o termo por “justos”.
- source_word: πιότητος τῆς γῆς
  choice: fertilidade da terra
  rationale: Transmite naturalmente o sentido agrícola literal de “gordura da terra”; a alternativa mais formal é preservada em nota.
- source_word: πειρατήρια
  choice: incursões de saqueadores
  rationale: No contexto terrestre de ataques contra Israel, evita a associação moderna exclusiva de “piratas” com o mar e conserva a ideia de bandos saqueadores.
theological_decisions:
- issue: Referente de “todos os santos desde Abel até agora”
  choice: Mantido genericamente como “todos os santos”, com explicação em nota.
  alternative: “todos os justos” ou “todos os adoradores fiéis”
  rationale: O texto traz ἁγίους, não um termo específico para “justos”. A provável alusão à linhagem de adoradores aceitos não deve substituir a escolha lexical do testemunho grego.
- issue: Condição textual da oração final sobre Gade
  choice: Traduzida entre colchetes e acompanhada de nota textual.
  alternative: Omiti-la como glosa posterior ou incorporá-la sem marcação ao texto corrido.
  rationale: A oração consta no testemunho grego, mas rompe a sequência sobre Levi e Judá e pode ser glosa ou linha deslocada. A marcação preserva simultaneamente o testemunho e sua dificuldade textual.
- issue: Sentido da porção de Issacar no versículo 5
  choice: A porção é a fertilidade da terra associada ao trabalho penoso de seus frutos.
  alternative: Entender “gordura” de maneira estritamente literal ou tornar “frutos” objeto direto do labor.
  rationale: A sintaxe transmitida é compacta e algo áspera. A tradução conserva a conexão entre dádiva da terra, labor e produção sem formular uma promessa teológica mais específica que o grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se termos bíblicos correntes como “lei de Deus”, “primícias”, “santos”, “sacerdócio” e “reino”. O tratamento plural usa “vocês” de modo implícito nas formas verbais e pronominais, evitando regionalismos e arcaísmos. Os colchetes fazem parte da apresentação textual da cláusula possivelmente secundária.
