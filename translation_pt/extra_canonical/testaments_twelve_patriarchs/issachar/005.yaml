revisions:
- from: '1 Portanto, meus filhos, guardem a lei de Deus, cultivem a simplicidade e andem em inocência, sem se intrometerem nas ações do próximo. 2 Amem, porém, o Senhor e o próximo; tenham misericórdia do pobre e do fraco. 3 Curvem as costas para cultivar a terra e trabalhem em toda tarefa do campo, oferecendo dádivas ao Senhor com ações de graças. 4 Pois, nas primícias dos frutos da terra, o Senhor os abençoará, assim como abençoou todos os santos desde Abel até agora.[a] 5 Porque nenhuma outra porção lhes foi dada, a não ser a fertilidade da terra, obtida com o penoso trabalho de seus frutos.[b] 6 Pois também meu pai Jacó me abençoou com bênçãos da terra e das primícias dos frutos. 7 Levi e Judá foram glorificados pelo Senhor entre os filhos de Jacó. E o Senhor lhes deu sua herança: a Levi, o sacerdócio; e a Judá, o reino. 8 Portanto, obedeçam a eles e andem na simplicidade de seu pai. [Mas a Gade foi dado destruir as incursões de saqueadores que vinham contra Israel.][c]'
  to: '1 Portanto, meus filhos, guardem a lei de Deus, cultivem a simplicidade e andem em inocência, sem se intrometerem nas ações do próximo. 2 Amem, porém, o Senhor e o próximo; tenham misericórdia do pobre e do fraco. 3 Curvem as costas para cultivar a terra e trabalhem em todo trabalho de cultivo, oferecendo dádivas ao Senhor com ações de graças. 4 Pois, nas primícias dos frutos da terra, o Senhor os abençoará, assim como abençoou todos os santos desde Abel até agora.[a] 5 Porque nenhuma outra porção lhes foi dada, a não ser a fertilidade da terra, nos trabalhos penosos de seus frutos.[b] 6 Pois também meu pai Jacó me abençoou com bênçãos da terra e das primícias dos frutos. 7 Levi e Judá foram glorificados pelo Senhor entre os filhos de Jacó. E o Senhor lhes deu sua herança: a Levi, o sacerdócio; e a Judá, o reino. 8 Portanto, obedeçam a eles e andem na simplicidade de seu pai. [Mas a Gade foi dado destruir as incursões de saqueadores que vinham contra Israel.][c]'
  rationale: A revisão é limitada a dois pontos. Em 3, «todo trabalho de cultivo» reflete com maior precisão a repetição agrária do grego. Em 5, remove-se «obtida com», que interpretava a conexão entre fertilidade, frutos e labor como causal; «nos trabalhos penosos de seus frutos» conserva a aspereza e a ambiguidade sintática do testemunho. As âncoras e o conteúdo das notas permanecem corretamente associados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:18:39Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o grego e preserva adequadamente a cláusula entre colchetes sobre Gade. Contudo, em 5, «obtida com o penoso trabalho» acrescenta uma relação causal/instrumental que não está explicitamente formulada por ἐν πόνοις καρπῶν; convém manter a formulação locativa e compacta do texto.
  naturalness: O português é claro, moderno e de registro apropriado. A pequena revisão em 3 torna «toda tarefa do campo» mais diretamente correspondente ao vocabulário de cultivo, e a de 5 evita uma explicitação interpretativa desnecessária.
  terminology: «Lei de Deus», «simplicidade», «inocência», «primícias», «santos», «sacerdócio» e «reino» são escolhas adequadas. «Incursões de saqueadores» comunica bem πειρατήρια no contexto de ataques terrestres, sem impor o sentido marítimo moderno de «piratas».
  issues:
  - severity: medium
    issue: 'Versículo 5: «obtida com o penoso trabalho de seus frutos»'
    rationale: O grego diz literalmente que a porção consiste na riqueza/fertilidade da terra «em trabalhos [penosos] de frutos». «Obtida com» torna o labor um meio causal de aquisição da fertilidade, relação mais definida do que a construção grega áspera permite.
  - severity: low
    issue: 'Versículo 3: «em toda tarefa do campo»'
    rationale: É natural, mas «em todo trabalho de cultivo» reproduz mais diretamente ἐν ἔργοις ... καθ᾽ ἑκάστην γεωργίαν e mantém o vínculo lexical com «cultivar».
