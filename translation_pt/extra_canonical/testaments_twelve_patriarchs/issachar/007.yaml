base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007.yaml
  text: '1[a]. See then, as you see: I am one hundred and twenty-six years old, and I am not conscious of committing any sin unto death. 2. Except for my wife, I have not known another woman. I did not commit sexual immorality with wandering eyes. 3. I did not drink wine for deception[b], and I did not desire anything of my neighbor. 4. No deceit came to be in my heart, and no lie went up through my lips. 5. I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth. 6. I loved the Lord with all my strength, and likewise I loved every person with all my heart, more than my children. 7. You also, my children, do these things, and every spirit of Beliar will flee from you, and no deed of wicked people will rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who walks with people in simplicity of heart. 8. And after saying these things he commanded his sons to carry him up
    to Hebron and bury him there with his fathers in the cave. 9. And stretching out his feet, he fell asleep in a good old age, sound in every limb and strong[d][c], and slept the eternal sleep.'
translation:
  language: pt
  text: '**Testamento de Issacar 7**


    1. Vejam, pois, como vocês mesmos veem: tenho cento e vinte e seis anos e não reconheço em mim pecado que leve à morte.[a] 2. Além de minha esposa, não conheci outra mulher. Não pratiquei imoralidade sexual com olhos errantes. 3. Não bebi vinho para o engano,[b] nem cobicei coisa alguma do meu próximo. 4. Nenhum engano surgiu em meu coração, e nenhuma mentira saiu de meus lábios. 5. Gemi junto com toda pessoa que sofria e reparti meu pão com o pobre. Pratiquei a piedade todos os meus dias; guardei a verdade. 6. Amei o Senhor e cada ser humano de todo o coração, mais do que meus filhos. 7. Meus filhos, façam também estas coisas, e todo espírito de Beliar[c] fugirá de vocês. Nenhuma ação de pessoas perversas os dominará, e vocês subjugarão todo animal selvagem, tendo consigo o Deus do céu e da terra, que caminha com os seres humanos em simplicidade de coração.[d]


    8. Depois de dizer essas coisas, ordenou a seus filhos que o levassem a Hebrom e ali o sepultassem com seus pais.[e] 9. Então estendeu os pés e adormeceu em boa velhice, no sono eterno.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “não tenho consciência de haver cometido pecado que leve à morte”. O verbo grego expressa conhecimento ou consciência moral de si mesmo.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega pode significar vinho bebido para o desvio, a desorientação ou o autoengano; o sentido exato é incerto.
    reason: lexical_alternative
  - marker: c
    text: “Beliar” reproduz a forma grega deste texto; outras tradições usam a forma “Belial”.
    reason: alternative_reading
  - marker: d
    text: “Em simplicidade de coração” pode indicar a maneira como Deus acompanha as pessoas ou caracterizar as pessoas de coração íntegro com quem ele caminha.
    reason: alternative_reading
  - marker: e
    text: Algumas formas textuais acrescentam que o sepultamento seria “na caverna”; essa expressão não aparece no texto grego adotado aqui.
    reason: textual_variant
  - marker: f
    text: 'Há variação textual no encerramento: algumas formas trazem “morreu em boa velhice” ou acrescentam que ele estava são em todos os membros e forte. O texto grego adotado diz que ele “adormeceu em boa velhice, no sono eterno”.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον
  choice: não reconheço em mim pecado que leve à morte
  rationale: Preserva o caráter de autoavaliação moral de ἔγνων, mantém ἐν ἐμοί sem transformar a frase numa afirmação absoluta de impecabilidade e traduz εἰς θάνατον sem importar a categoria doutrinária posterior de “pecado mortal”.
- source_word: τῆς συμβίου μου ... οὐκ ἔγνων ἄλλην
  choice: Além de minha esposa, não conheci outra mulher
  rationale: “Conhecer” conserva o conhecido sentido sexual do verbo, enquanto “esposa” comunica naturalmente o valor contextual de σύμβιος.
- source_word: ἐπόρνευσα ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: Não pratiquei imoralidade sexual com olhos errantes
  rationale: “Imoralidade sexual” representa a amplitude de πορνεύω; “olhos errantes” comunica o olhar inquieto e movido pelo desejo sem sobre-explicar a imagem.
- source_word: οἶνον εἰς ἀποπλάνησιν
  choice: vinho para me deixar desencaminhar
  rationale: A formulação expressa a ideia de ser desviado ou levado ao erro, deixando em aberto se o texto aponta especialmente para excesso, desorientação ou autoengano.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου οὐκ ἐπεθύμησα
  choice: nem cobicei coisa alguma do meu próximo
  rationale: A repetição etimológica grega remete à linguagem da cobiça; a formulação portuguesa é clara e preserva o eco moral sem restringir o objeto a uma classe específica de bens.
- source_word: συνεστέναξα
  choice: Gemi junto com
  rationale: Conserva a força corporal e solidária do verbo composto, mais intensa que uma paráfrase genérica como “tive compaixão”.
- source_word: Εὐσέβειαν ἐποίησα
  choice: Pratiquei a piedade
  rationale: Traduz a expressão idiomática como conduta reverente habitual, em registro digno e compreensível.
- source_word: Ἀλήθειαν ἐφύλαξα
  choice: guardei a verdade
  rationale: Mantém a formulação breve e elevada, sem reduzir ἀλήθεια apenas à exatidão factual.
- source_word: συμπορευόμενον
  choice: que caminha com
  rationale: O particípio descreve companhia no caminho e concorda gramaticalmente com “o Deus do céu e da terra”.
- source_word: ἐκοιμήθη ... ὕπνον αἰώνιον
  choice: adormeceu ... no sono eterno
  rationale: Preserva a metáfora repetida de dormir usada para a morte, sem substituí-la diretamente por “morreu”.
theological_decisions:
- issue: Intensidade da alegação de Issacar sobre o pecado
  choice: 'Apresentar a frase como autoavaliação qualificada: ele não reconhece em si pecado que leve à morte.'
  alternative: “Nunca cometi pecado mortal” ou “não há pecado em mim”.
  rationale: O grego combina linguagem de conhecimento ou consciência pessoal com a qualificação εἰς θάνατον. A tradução evita tanto uma declaração irrestrita de impecabilidade quanto a importação de uma classificação doutrinária posterior.
- issue: Referente de “que caminha com os seres humanos”
  choice: Fazer o pronome relativo retomar “o Deus do céu e da terra”.
  alternative: Entender a expressão como descrição dos filhos que caminham com Deus ou como máxima independente.
  rationale: O antecedente gramatical mais próximo e a concordância do particípio favorecem a referência a Deus, embora a relação de “simplicidade de coração” permaneça semanticamente aberta.
- issue: Amor ao Senhor, às pessoas e comparação com os filhos
  choice: 'Preservar em uma só construção: “Amei o Senhor e cada ser humano de todo o coração, mais do que meus filhos.”'
  alternative: Distribuir “de todo o coração” ou “mais do que meus filhos” apenas a um dos objetos.
  rationale: A sintaxe grega não marca inequivocamente uma distribuição diferente; a tradução conserva a tensão e a abrangência da construção.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com preferência por construções naturais no Brasil sem regionalismos marcados. O tratamento plural usa “vocês”; imagens testamentárias importantes, como “guardar a verdade”, “olhos errantes” e “sono eterno”, foram preservadas. A tradução segue o texto grego fornecido, razão pela qual não incorpora ao corpo principal as expansões sobre a caverna, a integridade dos membros ou a força física presentes em outras formas textuais.
