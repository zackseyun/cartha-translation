base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004.yaml
  text: He does not envy in his deliberations[a], nor does malicious envy consume his soul, nor is there distraction in greed in his mind. But he walks in simplicity of soul; he sees everything with uprightness of heart, not accepting evil eyes from the world’s error[b], so that he may not see the commandments of the Lord as distorted.
translation:
  language: pt
  text: 5. Ele não sente inveja em suas deliberações; tampouco a inveja maliciosa consome sua alma[a], nem há em sua mente distração em meio à ganância. 6. Mas ele anda com simplicidade de alma e vê todas as coisas com retidão de coração, não acolhendo os olhos maus provenientes do engano do mundo[b], para não ver como distorcidos os mandamentos do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração “tampouco a inveja maliciosa consome sua alma” aparece entre colchetes na camada grega impressa, indicando uma expansão textual; aqui ela é traduzida como parte do testemunho preservado.
    reason: textual_variant
  - marker: b
    text: A expressão “olhos maus” também pode evocar o idioma do “mau-olhado”, isto é, uma maneira hostil ou invejosa de olhar.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῖ ἐν διαβουλίοις
  choice: sente inveja em suas deliberações
  rationale: No catálogo de vícios, ζηλοῖ tem sentido negativo de invejar; διαβουλίοις indica a esfera das reflexões ou deliberações interiores.
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  choice: a inveja maliciosa consome sua alma
  rationale: βάσκανος comunica inveja hostil, enquanto ἐκτήκει descreve desgaste ou consumo interior. A formulação preserva a intensidade da imagem.
- source_word: περισπασμὸς ἐν ἀπληστείᾳ ἐν νοΐ
  choice: a ganância lhe causa inquietação na mente
  rationale: περισπασμός sugere a mente puxada ou agitada em diferentes direções. 'Inquietação' produz uma frase natural em português sem reduzir o termo à mera distração; ἀπληστία é traduzido pelo termo corrente 'ganância'.
- source_word: ἁπλότητι ψυχῆς
  choice: com simplicidade de alma
  rationale: Mantém a linguagem temática da obra e o sentido de inteireza moral, sem restringi-lo apenas a sinceridade.
- source_word: εὐθύτητι καρδίας
  choice: com retidão de coração
  rationale: Expressa a qualidade moral interior mediante linguagem bíblica digna e imediatamente compreensível.
- source_word: μὴ ἐπιδεχόμενος
  choice: não acolhe
  rationale: O particípio indica não receber ou não dar entrada a algo; 'não acolhe' é natural e conserva essa ação deliberada.
- source_word: ὀφθαλμοὺς πονηροὺς
  choice: os olhos maus
  rationale: Preserva o plural e a imagem concreta do grego, inclusive sua possível evocação do idioma do 'mau-olhado' ou de uma maneira invejosa de olhar.
- source_word: πλάνης τοῦ κόσμου
  choice: do engano do mundo
  rationale: πλάνη pode denotar erro, desvio ou engano. 'Engano' conserva a possível força ativa da influência mundana sem eliminar a ambiguidade moral e intelectual.
- source_word: διεστραμμένας
  choice: como distorcidos
  rationale: Preserva a metáfora de torção aplicada à maneira de perceber os mandamentos e evita sugerir que os próprios mandamentos sejam de fato defeituosos.
theological_decisions:
- issue: Sujeito implícito das máximas éticas
  choice: 'Terceira pessoa singular masculina: ''ele'''
  alternative: Formulação impessoal com 'a pessoa' ou 'quem'
  rationale: O grego apresenta uma descrição gnômica na terceira pessoa. Mantê-la preserva o retrato testamentário da pessoa simples e justa.
- issue: Relação entre διεστραμμένας e os mandamentos do Senhor
  choice: 'A distorção pertence à percepção do observador: ''ver como distorcidos'''
  alternative: Dizer que os mandamentos foram distorcidos
  rationale: A construção com ἴδῃ favorece a ideia de enxergar ou considerar os mandamentos de maneira deformada, sem atribuir defeito real aos mandamentos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Preservam-se as imagens antropológicas de 'alma', 'mente', 'coração' e 'olhos', bem como o tom proverbial da terceira pessoa. A numeração dos versículos foi mantida. Os marcadores foram vinculados ao conteúdo correspondente, corrigindo a aparente inversão entre os marcadores e as notas na camada inglesa fornecida.
