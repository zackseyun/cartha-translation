  naturalness: O português é claro e de registro adequado. «Mas», em vez de «Pelo contrário», reproduz δέ sem impor uma oposição mais forte do que a do grego. A formulação revista para περισπασμός permanece fluente e mais precisa.
  terminology: '«Simplicidade de alma», «retidão de coração», «olhos maus», «engano do mundo» e «mandamentos do Senhor» são escolhas fiéis e compreensíveis. As notas estão corretamente ancoradas: [a] na expansão textual e [b] em «olhos maus».'
