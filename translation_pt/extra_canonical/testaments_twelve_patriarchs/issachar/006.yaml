base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b]. And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will serve their enemies. Therefore you also tell these things to your children, so that, if they sin, they may return more quickly to the Lord[c], because he is merciful and will deliver them, to bring them back into their land[d].
translation:
  language: pt
  text: 6 Portanto, saibam, meus filhos, que, nos últimos tempos, os filhos de vocês abandonarão a simplicidade e se apegarão à ganância; deixando a inocência[a], se aproximarão da astúcia; e, abandonando os mandamentos do Senhor, se apegarão a Beliar[b]. 2 Deixarão o cultivo da terra, seguirão seus próprios planos perversos, serão dispersos entre as nações e servirão aos seus inimigos. 3 Portanto, vocês também digam essas coisas aos seus filhos, para que, se pecarem, retornem mais depressa ao Senhor[c], 4 pois ele é misericordioso e os livrará, trazendo-os de volta à terra deles[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “ausência de malícia” ou “sinceridade sem dolo”. O termo grego ἀκακία destaca a condição de quem não age com maldade ou engano.
    reason: lexical_alternative
  - marker: b
    text: Beliar é a forma encontrada no texto grego; muitos leitores conhecem esse nome como “Belial”.
    reason: lexical_alternative
  - marker: c
    text: “Retornar ao Senhor” inclui a ideia de arrependimento, além da de restauração.
    reason: cross_reference
  - marker: d
    text: A oração final também pode ser entendida como “e os restaurará à terra deles”.
    reason: alternative_reading
lexical_decisions:
- source_word: ἁπλότης
  choice: simplicidade
  rationale: Preserva a virtude temática de uma vida moralmente íntegra, singela e não dividida, sem reduzi-la à falta de instrução.
- source_word: ἀπληστία
  choice: ganância
  rationale: Expressa de modo atual e moralmente forte o desejo ávido e insaciável contrastado com a simplicidade.
- source_word: ἀκακία
  choice: inocência
  rationale: É natural no contraste com a astúcia; a nota registra a nuance mais específica de ausência de malícia ou dolo.
- source_word: πανουργία
  choice: astúcia
  rationale: Comunica inteligência ardilosa e moralmente inescrupulosa sem recorrer a linguagem arcaica.
- source_word: κολληθήσονται
  choice: se apegarão
  rationale: Mantém a repetição retórica do verbo para a adesão tanto à ganância quanto a Beliar.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma do testemunho grego, sem normalizá-la silenciosamente para Belial.
- source_word: γεωργεῖν
  choice: o cultivo da terra
  rationale: Torna explícito o trabalho agrícola que integra o ideal de vida de Issacar e soa natural em português.
- source_word: πονηροῖς διαβουλίοις αὐτῶν
  choice: seus próprios planos perversos
  rationale: Representa os desígnios moralmente maus e mantém o pronome grego, que pode indicar os planos dos próprios descendentes.
- source_word: διασπαρήσονται
  choice: serão dispersos
  rationale: Preserva a voz passiva e a força exílica da dispersão entre as nações.
- source_word: δουλεύσουσιν
  choice: servirão
  rationale: Conserva a formulação do grego, permitindo que o contexto comunique sujeição aos inimigos sem impor explicitamente 'serão escravizados'.
- source_word: τάχιον
  choice: mais depressa
  rationale: Reflete a forma comparativa e ressalta a prontidão esperada no retorno após o pecado.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: retornem ao Senhor
  rationale: Preserva simultaneamente os sentidos de arrependimento, mudança de direção e restauração da relação com o Senhor.
theological_decisions:
- issue: Força de ἐν ἐσχάτοις καιροῖς
  choice: nos últimos tempos
  alternative: em tempos posteriores; no fim dos tempos
  rationale: Mantém o registro profético e a possível dimensão escatológica sem definir um cronograma apocalíptico específico.
- issue: Relação de τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν com ἐξελεῖται
  choice: trazendo-os de volta à terra deles
  alternative: e os restaurará à terra deles; para trazê-los de volta à terra deles
  rationale: Entende a oração infinitiva comprimida como propósito ou resultado do livramento, mas registra em nota a possibilidade coordenada para não eliminar a ambiguidade.
- issue: Dimensão religiosa de retornar ao Senhor
  choice: retornem ao Senhor
  alternative: voltem-se novamente para o Senhor
  rationale: A formulação conserva tanto o arrependimento quanto a restauração, sem restringir o verbo a apenas um desses aspectos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “abandonar/deixar” e “se apegar” foi preservada por seu valor retórico. “Os filhos de vocês” mantém a mudança do vocativo “meus filhos” para a descendência dos ouvintes. A numeração dos versículos foi conservada.
