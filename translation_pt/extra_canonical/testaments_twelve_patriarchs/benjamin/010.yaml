review_pass:
  verdict: revise
  source_fidelity: A estrutura da fonte exige que a injunção de 5 termine na cláusula entre colchetes sobre a revelação da salvação, e que a visão de Enoque, Sete e os patriarcas comece no v. 6; o rascunho respeita essa divisão. Contudo, em 4, ταῦτα é plural, de modo que «transmiti-lo» deve ser plural. A redação de 10 pode conservar melhor a sintaxe e os referentes difíceis sem atribuir de modo demasiado definido o afastamento de Deus aos irmãos enganados.
  naturalness: O texto é geralmente claro e mantém um registro testamentário solene. «Exatamente com toda a sua aparência» é pouco idiomático; «exatamente tal como era toda a sua aparência» é mais natural sem reduzir a acumulação grega. A revisão também ajusta a concordância plural em 4.
  terminology: «Praticai a verdade», «próximo», «lei», «mandamentos», «Rei dos céus», «glória» e «desonra» são escolhas adequadas. Mantêm-se os colchetes e a nota textual para não apresentar como indiscutível o material explicitamente delimitado no testemunho.
  issues:
  - severity: medium
    issue: Discordância de número em 10.4
    rationale: Ταῦτα («essas coisas») é plural; «Vós também deveis transmiti-lo» singular não corresponde ao antecedente. Deve ser «transmiti-las».
  - severity: low
    issue: Formulação pouco natural em 10.1
    rationale: «Exatamente com toda a sua aparência» soa calcado. «Exatamente tal como era toda a sua aparência» preserva o sentido de καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ.
  - severity: low
    issue: Referentes excessivamente resolvidos em 10.10
    rationale: A sintaxe de ἀπατήσασιν ... γενέσθαι ... γενόμενοι é difícil. A redação deve evitar tornar inequívoco que os irmãos, e não os midianitas, são os que se afastam de Deus ou se tornam filhos na porção dos que temem o Senhor.
