lexical_decisions:
- source_word: εἰδέα / μόρφωσις / ὄψις
  choice: aparência / traços / rosto
  rationale: Mantém a acumulação de termos próximos sem produzir uma sequência artificial em português; “traços do rosto” comunica a forma visível da face.
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: de dia, enquanto estava acordado
  rationale: Preserva o contraste com sonho ou sono sem impor a categoria técnica de visão.
- source_word: ποιήσατε ... ἀλήθειαν
  choice: praticai ... a verdade
  rationale: A expressão grega é concreta e ética. “Praticar a verdade” é natural em português e retém mais da força idiomática do que apenas “ser verdadeiro”.
- source_word: πλησίον
  choice: próximo
  rationale: Conserva o registro moral e bíblico e não restringe o referente a um irmão de sangue.
- source_word: νόμος ... ἐντολαί
  choice: lei ... mandamentos
  rationale: São equivalentes reconhecíveis dos termos pactuais gregos e preservam sua distinção.
- source_word: ἀντὶ πάσης κληρονομίας
  choice: em lugar de toda herança
  rationale: 'Mantém a força contrastiva de ἀντί: a instrução ética é apresentada como o legado de Benjamim.'
- source_word: κατάσχεσιν αἰώνιον
  choice: posse eterna
  rationale: Expressa algo conservado e transmitido permanentemente entre gerações.
- source_word: ἀνασταμένους ἐκ δεξιῶν αὐτοῦ
  choice: ressuscitados à sua direita
  rationale: O contexto favorece a ressurreição, enquanto o pronome permanece sem antecedente explicitado, como no grego.
- source_word: ἐν ἀγαλλιάσει
  choice: em grande alegria
  rationale: Comunica o júbilo elevado da cena escatológica em português corrente e digno.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: cada um com o nosso cetro
  rationale: Oferece uma formulação portuguesa legível, sem identificar o cetro com trono, tribo ou reino; a dificuldade é registrada em nota.
- source_word: βασιλέα τῶν οὐρανῶν
  choice: Rei dos céus
  rationale: Preserva o plural do grego e o registro apocalíptico elevado.
- source_word: ἀτιμία
  choice: desonra
  rationale: Forma uma antítese direta e formal com “glória”.
- source_word: ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: em mim com confiança
  rationale: Mantém a ligação difícil com “em mim” e comunica a segurança esperançosa sugerida por ἐλπίς; a tradução literal é registrada em nota.
theological_decisions:
- issue: Material cristológico entre colchetes nos vv. 5 e 7–9
  choice: Traduzir os trechos no corpo do capítulo e conservar os colchetes da fonte, com nota textual.
  alternative: Omiti-los como interpolações posteriores ou integrá-los sem qualquer marcação.
  rationale: O testemunho grego fornecido contém essas palavras, mas sua delimitação e a linguagem cristológica explícita exigem transparência quanto à complexidade textual.
- issue: Identidade do referente em “à sua direita” no v. 6
  choice: Manter o pronome “sua” sem identificar o referente.
  alternative: Explicitar “à direita de Deus” ou “à direita do Senhor”.
  rationale: O grego não repete um antecedente explícito; acrescentá-lo resolveria uma ambiguidade genuína.
- issue: Ressurreição e julgamento nos vv. 6–10
  choice: Traduzir a linguagem como ressurreição de todos, com resultados distintos e julgamento de Israel e das nações.
  alternative: Interpretar a ressurreição apenas como restauração metafórica ou restringi-la a Israel.
  rationale: A repetição dos verbos de levantar-se, seguida do contraste entre glória e desonra e do julgamento de Israel e das nações, favorece uma cena escatológica abrangente.
- issue: Sentido de ἐπὶ σκήπτρον ἡμῶν no v. 6
  choice: “cada um com o nosso cetro”, acompanhado de nota sobre a dificuldade.
  alternative: “cada um segundo sua tribo” ou “cada um sobre seu trono”.
  rationale: As alternativas explicativas eliminariam indevidamente a incerteza da imagem grega.
- issue: Sujeitos e relações no relato dos midianitas no v. 10
  choice: Conservar a sequência pronominal de modo relativamente próximo ao grego.
  alternative: Reformular identificando de maneira categórica quem se afastou de Deus e quem se tornou parte dos que o temem.
  rationale: A sintaxe grega é difícil e permite incerteza sobre os referentes; uma explicitação dogmática ou histórica excederia a evidência do texto.
translation_notes:
  register: Português moderno, solene e acessível, com formas de segunda pessoa do plural para preservar o tom testamentário e coletivo. A sintaxe foi moderadamente atualizada, mas ambiguidades textuais e teológicas reais foram mantidas. Os colchetes pertencem à apresentação crítica do testemunho fornecido.
