    **2.** Depois de dizer essas coisas, ele lhes disse: “Sabei, portanto, meus filhos, que estou morrendo. **3.** Praticai, pois, a verdade[b], cada um para com o seu próximo, e guardai a lei do Senhor e os seus mandamentos. **4.** Pois são essas coisas que vos deixo em lugar de toda herança. Vós também deveis transmiti-las a vossos filhos como posse eterna, pois assim fizeram Abraão, Isaque e Jacó. **5.** Eles nos deram todas essas coisas como herança, dizendo: ‘Guardai os mandamentos de Deus até que [o Senhor revele a sua salvação a todas as nações].[a]’


    **6.** Então vereis Enoque, Sete, Abraão, Isaque e Jacó ressuscitados à sua direita, em grande alegria. Então nós também ressuscitaremos, cada um com o nosso cetro[d], e adoraremos o Rei dos céus, **7.** [aquele que apareceu na terra em forma humana, com humildade; e todos os que nele crerem na terra se alegrarão com ele].


    **8.** Todos ressuscitarão: uns para a glória, outros para a desonra. E o Senhor julgará primeiro Israel por sua injustiça, [porque não creram nele quando Deus veio em carne]. **9.** Então ele julgará todas as nações [que não creram nele quando apareceu na terra]. **10.** E, por meio dos escolhidos dentre as nações, ele repreenderá Israel, assim como repreendeu Esaú por meio dos midianitas, os quais enganaram seus irmãos [para se tornarem, por meio da imoralidade sexual e da idolatria, estranhos a Deus] e, assim, tornaram-se filhos na porção dos que temem o Senhor.


    **11.** Portanto, meus filhos, se andardes em santidade, nos mandamentos do Senhor, voltareis a habitar em mim com confiança[c], e todo o Israel será reunido ao Senhor.”


    **Notas**


    [a] As palavras entre colchetes reproduzem trechos assim delimitados no texto grego fornecido. Em especial, as orações dos versículos 7–9 que falam de Deus aparecendo em carne e da fé nele na terra são amplamente consideradas ampliações cristãs posteriores.


    [b] Ou: “praticai a verdade”. A expressão grega, literalmente “fazei a verdade”, descreve uma conduta concreta e ética.


    [c] “Com confiança” traduz uma expressão difícil que, literalmente, significa “em esperança”. A relação sintática com “em mim” também é incomum no grego.


    [d] A expressão grega traduzida por “cada um com o nosso cetro” é textualmente difícil; pode evocar dignidade restaurada ou autoridade tribal na ressurreição.'
