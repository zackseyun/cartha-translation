  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/002.yaml
  text: And in the last times a beloved one of the Lord shall arise [from the seed of Judah and Levi], doing good pleasure with his mouth, [enlightening all the nations with new knowledge], a light of knowledge, coming upon Israel in salvation, and snatching from them like a wolf, and giving to the assembly of the nations.
translation:
  language: pt
  text: E, nos tempos derradeiros, surgirá um amado do Senhor [da descendência de Judá e Levi][a], fazendo o que é agradável com a sua boca, [iluminando todas as nações com um novo conhecimento][a], luz de conhecimento, avançando sobre Israel em salvação[b], arrebatando deles como um lobo e dando à assembleia das nações.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes têm transmissão textual incerta e não aparecem de modo uniforme nas testemunhas gregas.
    reason: Sinaliza as duas unidades que a edição-fonte apresenta entre colchetes.
  - marker: b
    text: A expressão grega é difícil e também pode ser entendida como “vindo sobre Israel com salvação” ou, de modo mais interpretativo, “trazendo salvação a Israel”.
    reason: Preserva a incerteza lexical e sintática de ἐπεμβαίνων com acusativo e ἐν σωτηρίᾳ.
  - marker: c
    text: O texto não diz expressamente o que ele dá à assembleia das nações.
    reason: Evita preencher a elipse com um objeto conjectural.
lexical_decisions:
- source_word: ἐν ὑστέροις
  choice: nos tempos derradeiros
  rationale: Expressa naturalmente a referência escatológica ou futura do grego sem acrescentar o substantivo ausente no original.
- source_word: ἀγαπητὸς Κυρίου
  choice: um amado do Senhor
  rationale: Preserva a construção concisa e a possibilidade de se tratar de alguém amado pelo Senhor, sem especificar uma identidade.
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: fazendo com a boca o que é agradável
  rationale: Mantém a imagem incomum da boca e traduz εὐδοκία sem inserir no texto um possuidor não expresso, como 'a vontade dele'.
- source_word: φῶς γνώσεως
  choice: luz de conhecimento
  rationale: Conserva a frase nominal do grego e sua relação sintática não inteiramente explícita com o amado que surgirá.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: vindo sobre Israel com salvação
  rationale: Mantém a metáfora e a sintaxe difíceis de ἐπεμβαίνω, além da associação de ἐν σωτηρίᾳ com a ação, sem suavizá-las para 'levando salvação'.
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: arrebatando deles como um lobo
  rationale: Preserva tanto a comparação com o lobo quanto a referência pronominal ambígua de ἀπ᾽ αὐτῶν.
- source_word: συναγωγῇ τῶν ἐθνῶν
  choice: assembleia das nações
  rationale: Traduz συναγωγή em sentido comum de reunião ou comunidade e evita importar a instituição religiosa moderna sugerida por 'sinagoga'.
theological_decisions:
- issue: Identidade do 'amado do Senhor'
  choice: Não identificar explicitamente a figura
  alternative: Traduzir ou explicar a figura como o Messias
  rationale: O verso descreve a personagem sem lhe dar diretamente esse título; a tradução preserva essa abertura interpretativa.
- issue: Ação dirigida a Israel
  choice: vindo sobre Israel com salvação
  alternative: trazendo salvação a Israel
  rationale: A alternativa é mais fluente, mas resolve a construção grega difícil e reduz a possível tensão da imagem de vir ou avançar sobre Israel.
- issue: Objeto de 'dando'
  choice: Manter o objeto não expresso
  alternative: Acrescentar 'o que arrebatou' ou 'salvação'
  rationale: O grego não declara o que é dado à assembleia das nações; suprir um objeto imporia uma interpretação teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação conserva deliberadamente as imagens e elipses incomuns do grego; os colchetes no texto principal reproduzem a incerteza assinalada pela edição-fonte.
