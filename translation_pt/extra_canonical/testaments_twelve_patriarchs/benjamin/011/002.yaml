  source_fidelity: A tradução preserva adequadamente a figura não identificada, as duas cláusulas entre colchetes, a elipse do objeto de «dando» e a ambiguidade básica de ἀπ᾽ αὐτῶν. Contudo, a colocação das âncoras da nota a cria pontuação inadequada e obscurece que a nota se aplica às cláusulas delimitadas pelos colchetes. «Vindo sobre Israel» é possível, mas «avançando sobre Israel» representa mais diretamente a força difícil de ἐπεμβαίνων e é mais idiomático em português.
  naturalness: O registro é adequado e só requer pequenos ajustes de fluência e pontuação. «Fazendo com a boca o que é agradável» soa truncado; «fazendo o que é agradável com a sua boca» conserva a imagem e melhora a ordem portuguesa.
  terminology: «Amado do Senhor», «descendência», «luz de conhecimento» e «assembleia das nações» são escolhas sóbrias e fiéis. Não há identificação teológica indevida da personagem nem preenchimento da elipse final.
