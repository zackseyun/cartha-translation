  - severity: low
    issue: Ordem pouco natural em «fazendo com a boca o que é agradável»
    rationale: A construção pode sugerir que «com a boca» modifica apenas «fazendo». A reorganização conserva o valor de ἐν στόματι αὐτοῦ sem explicá-lo.
  - severity: low
