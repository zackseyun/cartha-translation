source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XI. Καὶ οὐκέτι κληθήσομαι λύκος ἅρπαξ διὰ τὰς ἁρπαγὰς ὑμῶν ἀλλὰ [ἐργάτης Κυρίου διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/001.yaml
  text: No longer shall I be called a ravening wolf because of your acts of plunder, but [a worker of the Lord, distributing food to those who do what is good].
translation:
  language: pt
  text: E já não serei chamado lobo voraz por causa dos saques de vocês, mas [um trabalhador do Senhor, distribuindo alimento aos que praticam o bem].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: lobo voraz
  rationale: Preserva a imagem tradicional e expressa de modo natural o sentido de um lobo que rapina.
- source_word: τὰς ἁρπαγὰς ὑμῶν
  choice: os atos de saque de vocês
  rationale: Ἁρπαγή denota apropriação violenta ou pilhagem; “atos de saque” evita a repetição pouco natural de “voraz/devorações” e mantém o plural e o pronome de segunda pessoa.
- source_word: ἐργάτης Κυρίου
  choice: trabalhador do Senhor
  rationale: Tradução direta que conserva a metáfora de serviço ou trabalho sem especificar uma função religiosa.
- source_word: διαδιδὼν τροφὴν
  choice: distribuindo alimento
  rationale: Reproduz o particípio presente e o sentido concreto de repartir ou distribuir sustento.
- source_word: τοῖς ἐργαζομένοις τὸ ἀγαθόν
  choice: aos que praticam o bem
  rationale: Expressa naturalmente a construção grega, literalmente referente aos que operam ou fazem o bem, sem tornar “bem” o local ou campo do trabalho.
theological_decisions:
- issue: Identidade e função futura do falante
  choice: “trabalhador do Senhor” sem explicitação adicional
  alternative: “servo do Senhor” ou identificação messiânica explícita
  rationale: O grego emprega ἐργάτης, “trabalhador”, e não identifica expressamente a figura; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os colchetes editoriais foram preservados para refletir que a cláusula final está marcada como interpolação na edição grega fornecida.
