  verdict: revise
  source_fidelity: 'A tradução preserva corretamente δι᾽ αὐτῶν («por meio deles»), ἀναπληρώσει τὰ ὑστερήματα («completará o que falta») e φυλῆς («tribo»). Contudo, «como disse Jacó» altera a construção grega: λέγων é particípio masculino singular e se liga mais naturalmente ao sujeito de φοιτήσει («ele ... dizendo»), não a Jacó como sujeito de «disse». Além disso, «visitará» representa φοιτήσει mais precisamente que o genérico «virá», sem exigir uma interpretação teológica específica.'
  naturalness: A redação proposta é clara, mas a emenda necessária produz uma construção deliberadamente próxima da sintaxe concisa e algo difícil do grego. «Visitará» é natural em registro bíblico-literário; «dizendo» preserva a ligação sintática do original.
  terminology: «Por meio deles», «completará o que falta» e «tribo» são escolhas adequadas. «Visitará» mantém o campo semântico de φοιτάω e corresponde ao registro da passagem.
  issues:
