base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/005.yaml
  text: And through them he will visit as Jacob my father, saying, “He will fill up what is lacking in your tribe.”
translation:
  language: pt
  text: 'E, por meio deles, ele visitará como Jacó, meu pai, dizendo: “Ele completará o que falta à sua tribo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ αὐτῶν
  choice: por meio deles
  rationale: Mantém o plural masculino ou genérico do grego e a ideia de mediação expressa por διά com genitivo.
- source_word: φοιτήσει
  choice: virá
  rationale: O verbo φοιτάω pode indicar ir, vir, frequentar ou visitar. Aqui, “virá” preserva o movimento sem impor a interpretação mais específica de uma visitação divina.
- source_word: ἀναπληρώσει τὰ ὑστερήματα
  choice: completará o que falta
  rationale: Expressa de modo natural a ideia de suprir ou preencher deficiências, mantendo a formulação abrangente do grego.
- source_word: φυλῆς
  choice: tribo
  rationale: Equivalente normal de φυλή no contexto das tribos de Israel.
theological_decisions:
- issue: Relação de ὡς Ἰακὼβ ὁ πατήρ μου, λέγων com a oração
  choice: como disse Jacó, meu pai
  alternative: como Jacó, meu pai, dizendo
  rationale: A pontuação editorial e a sintaxe transmitida são difíceis. A tradução entende Jacó como quem profere a declaração seguinte, produzindo português inteligível sem acrescentar conteúdo teológico; a alternativa mais literal permanece possível, mas é obscura.
- issue: Sentido de φοιτήσει
  choice: virá
  alternative: visitará
  rationale: “Virá” conserva a amplitude semântica do verbo e evita decidir que se trata necessariamente de visitação salvífica ou judicial.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe suavizada apenas onde a construção grega é obscura. O pronome plural “deles” e a referência à “sua tribo” foram preservados sem identificar os referentes além do que o versículo declara.
