id: T12P.BEN.11.3
reference: Testament of Benjamin 11:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/003.yaml
  text: Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.
translation:
  language: pt
  text: Até a consumação da era, ele estará nas assembleias das nações e entre os seus governantes, como uma melodia na boca de todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως συντελείας τοῦ αἰῶνος
  choice: Até a consumação da era
  rationale: Mantém a formulação escatológica e a abrangência temporal do grego, sem identificar αἰών de modo mais específico do que o texto permite.
- source_word: συναγωγαῖς ἐθνῶν
  choice: assembleias das nações
  rationale: Aqui συναγωγή tem o sentido geral de reunião ou assembleia; “assembleias” evita restringir indevidamente a referência a sinagogas judaicas. ἐθνῶν é vertido por “nações”, preservando sua possível amplitude étnica e política.
- source_word: ἐν τοῖς ἄρχουσιν αὐτῶν
  choice: entre os seus governantes
  rationale: A preposição ἐν, com referência a pessoas, é expressa naturalmente por “entre”; ἄρχοντες designa autoridades ou governantes.
- source_word: ὡς μουσικὸν μέλος
  choice: como uma melodia
  rationale: μέλος, qualificado por μουσικόν, indica canto, frase musical ou melodia. A tradução concisa comunica a imagem com naturalidade.
- source_word: ἐν στόματι πάντων
  choice: na boca de todos
  rationale: Preserva a imagem corporal e idiomática do grego, sugerindo algo repetido, cantado ou mencionado por todos sem explicitar apenas uma dessas possibilidades.
theological_decisions:
- issue: Referente do pronome implícito em ἔσται
  choice: ele
  alternative: isso / seu nome
  rationale: O verbo grego não traz sujeito expresso neste versículo. O contexto presumido e a camada inglesa apontam para um referente masculino; mantém-se “ele” sem acrescentar uma identificação teológica ausente do trecho fornecido.
- issue: Sentido de συντέλεια τοῦ αἰῶνος
  choice: consumação da era
  alternative: fim do mundo / fim dos tempos
  rationale: “Consumação da era” conserva a tensão entre conclusão, cumprimento e término, evitando transformar αἰών em “mundo” ou impor uma formulação escatológica mais interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o paralelismo do original e sua imagem poética, sem expansão interpretativa.
