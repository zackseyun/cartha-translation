    issue: «tanto por sua obra como por sua palavra»
    rationale: Em português, «por» normalmente introduz meio, causa ou critério. O grego καὶ τὸ ἔργον καὶ ὁ λόγος αὐτοῦ acrescenta a obra e a palavra dele ao que será registrado; não diz que ele será registrado por meio delas.
