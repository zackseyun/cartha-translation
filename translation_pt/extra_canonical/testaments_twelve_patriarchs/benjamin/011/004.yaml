source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐν βίβλοις ἁγίαις ἔσται ἀναγραφόμενος, καὶ τὸ ἔργον καὶ ὁ λόγος αὐτοῦ· καὶ ἔσται ἐκλεκτὸς Θεοῦ²³ *ἕως τοῦ²⁴ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/004.yaml
  text: And in holy books he shall be recorded, both his work and his word; and he shall be God's chosen one forever.
translation:
  language: pt
  text: E ele será registrado nos livros santos, juntamente com sua obra e sua palavra; e será o escolhido de Deus para sempre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “até a era”. A expressão pode indicar duração perpétua.
    reason: Registra a formulação grega e preserva sua nuance sem sacrificar a naturalidade do texto principal.
lexical_decisions:
- source_word: ἀναγραφόμενος
  choice: registrado
  rationale: Expressa de modo natural a ideia de ter o nome e os feitos consignados por escrito.
- source_word: τὸ ἔργον καὶ ὁ λόγος αὐτοῦ
  choice: sua obra e sua palavra
  rationale: Preserva os substantivos no singular e a distinção grega entre aquilo que ele faz e aquilo que diz.
- source_word: ἐκλεκτὸς Θεοῦ
  choice: o escolhido de Deus
  rationale: Mantém a relação genitiva e o caráter definido da expressão no contexto, sem acrescentar uma identificação teológica não explicitada.
- source_word: ἕως τοῦ αἰῶνος
  choice: para sempre
  rationale: É a forma idiomática mais clara em português para a duração indefinida ou perpétua indicada pela expressão.
theological_decisions:
- issue: Identidade do «escolhido de Deus»
  choice: Não identificar explicitamente a personagem além do que diz o texto.
  alternative: Acrescentar um título ou nome messiânico específico.
  rationale: O versículo emprega apenas a expressão «escolhido de Deus»; explicitar uma identificação importaria uma interpretação para a tradução.
- issue: Valor temporal de ἕως τοῦ αἰῶνος
  choice: Traduzir idiomaticamente como «para sempre», com nota sobre a forma literal.
  alternative: Traduzir «até a era» ou «até o século».
  rationale: A expressão grega é idiomática, mas a nota conserva sua forma e possível nuance temporal sem tornar o texto principal artificial.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do grego. «Livros santos» foi mantido em vez de «Escrituras Sagradas» para não tornar a referência mais técnica ou canônica do que o original.
