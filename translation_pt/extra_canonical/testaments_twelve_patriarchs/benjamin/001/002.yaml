  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/002.yaml
  text: 'And after kissing them, he said: “Just as Isaac was born to Abraham in his old age, so I also was born to Jacob.”'
translation:
  language: pt
  text: 'Depois de beijá-los, ele disse: “Assim como Isaque nasceu para Abraão em sua velhice, também eu nasci para Jacó.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταφιλήσας
  choice: Depois de beijá-los
  rationale: O particípio aoristo indica uma ação anterior à fala; a formulação natural em português preserva essa sequência.
- source_word: ἐτέχθη τῷ Ἀβραὰμ
  choice: nasceu a Abraão
  rationale: Preserva a construção relacional do grego, em registro bíblico digno e ainda compreensível.
- source_word: ἐν γήρει αὐτοῦ
  choice: em sua velhice
  rationale: Reproduz diretamente a referência à idade avançada de Abraão.
- source_word: οὕτως κἀγὼ τῷ Ἰακώβ
  choice: também eu nasci a Jacó
  rationale: Explicita naturalmente o verbo subentendido na segunda parte da comparação e preserva a ênfase de κἀγώ em “também eu”.
