  text: The Testament of Benjamin, the twelfth son of Jacob and Rachel. The Copy of the Words of Benjamin, which he set in order for his sons, after he had lived one hundred and twenty-five years.
translation:
  language: pt
  text: 'O Testamento de Benjamim, décimo segundo filho de Jacó e Raquel.


    1. Cópia das palavras de Benjamim, que ele deixou aos seus filhos depois de viver cento e vinte e cinco anos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testamento
  rationale: No título da obra, designa as últimas disposições e exortações atribuídas ao patriarca; “Testamento” preserva o gênero literário tradicional e é natural em português.
- source_word: Ἀντίγραφον λόγων
  choice: Cópia das palavras
  rationale: Tradução direta da expressão grega, preservando a apresentação do texto como reprodução escrita das palavras de Benjamim.
- source_word: διέθετο
  choice: deixou
  rationale: O verbo, em contexto testamentário e com destinatários no dativo, comunica que Benjamim transmitiu ou legou essas palavras aos filhos. “Deixou” é idiomático e conserva a associação com disposições finais sem inserir terminologia jurídica excessiva.
- source_word: ζήσας ἔτη ἑκατὸν εἴκοσι πέντε
  choice: depois de viver cento e vinte e cinco anos
  rationale: Explicita naturalmente em português a relação temporal do particípio aoristo ζήσας com o ato principal.
