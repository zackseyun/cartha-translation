  source_fidelity: 'O texto reproduz com fidelidade a sequência grega: a esterilidade de Raquel por doze anos após o nascimento de José, sua oração ao Senhor com jejum e, depois de conceber, o nascimento do narrador. «Com jejum» está adequadamente ligado a «orou», como permite e favorece a construção μετὰ νηστείας junto de προσηύξατο. Não há base lexical para repetir ou deslocar explicitamente o jejum para a concepção.'
