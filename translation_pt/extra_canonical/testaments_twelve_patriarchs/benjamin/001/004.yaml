  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/004.yaml
  text: For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and having conceived, she bore me.
translation:
  language: pt
  text: Pois Raquel ficou estéril durante doze anos depois de dar à luz José; então orou ao Senhor com jejum e, tendo concebido, deu-me à luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστείρευσεν
  choice: ficou estéril
  rationale: Expressa de modo natural o estado de esterilidade indicado pelo verbo grego, sem acrescentar uma causa.
- source_word: μετὰ νηστείας
  choice: com jejum
  rationale: Mantém a associação gramatical mais direta com a oração, sem transferir o jejum para o ato de conceber.
- source_word: συλλαβοῦσα τέτοκέ με
  choice: tendo concebido, deu-me à luz
  rationale: Preserva a sequência expressa pelos verbos gregos e a fala em primeira pessoa.
theological_decisions:
- issue: Relação do jejum com a oração ou com a concepção
  choice: ligar «com jejum» a «orou ao Senhor»
  alternative: «tendo concebido em jejum»
  rationale: A pontuação e a sintaxe apresentadas favorecem a leitura de μετὰ νηστείας como complemento de προσηύξατο; a tradução evita importar a interpretação da revisão inglesa mais recente, que repete o jejum junto à concepção sem correspondência lexical adicional no grego.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção temporal clara e sem arcaísmos desnecessários.
