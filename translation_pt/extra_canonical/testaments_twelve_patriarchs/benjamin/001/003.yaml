source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ ἐπειδὴ¹⁶ Ῥαχὴλ *ἡ μήτηρ μου¹⁷ τέθνηκε¹⁸ γεννῶσά με, *γάλα οὐκ ἔσχον· Βαλλὰν οὖν τὴν παιδίσκην αὐτῆς ἐθήλασα¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/003.yaml
  text: And since Rachel, my mother, died while giving birth to me, I had no milk; so I was nursed by Bilhah, her slave-girl.
translation:
  language: pt
  text: E, visto que Raquel, minha mãe, morreu ao me dar à luz, não tive leite; por isso, fui amamentado por Bila, a escrava dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεννῶσά με
  choice: ao me dar à luz
  rationale: Expressa naturalmente em português a ação simultânea ao falecimento de Raquel.
- source_word: γάλα οὐκ ἔσχον
  choice: não tive leite
  rationale: Preserva a formulação concreta e concisa do grego, entendida no contexto como falta de leite materno para o recém-nascido.
- source_word: Βαλλὰν
  choice: Bila
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome bíblico Bilhah.
- source_word: τὴν παιδίσκην αὐτῆς
  choice: a escrava dela
  rationale: Representa com clareza a condição servil indicada por παιδίσκη, sem suavizá-la para 'serva' ou 'criada'.
- source_word: ἐθήλασα
  choice: fui amamentado
  rationale: Embora a forma grega seja ativa, o sentido contextual é que Bila o amamentou; a construção passiva é natural e inequívoca em português.
theological_decisions: []
