id: T12P.BEN.8.2
reference: Testament of Benjamin 8:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ καθαρὸς νοῦς οὐκ ἔχει μιασμὸν ἐπὶ¹⁷ κόπρου¹⁸ καὶ¹⁹ βόρβορον²⁰, Γ*ἀλλὰ μᾶλλον²¹ ἀμφότερα ψύγει²² καὶ ἀπελαύνει τὴν δυσωδίαν⁷, οὕτω καὶ ὁ καθαρὸς²³ νοῦς ἐν τοῖς μιασμοῖς²⁴ τῆς¹⁷ γῆς συνεχόμενος μᾶλλον †οἰκοδομεῖ²⁶, αὐτὸς δὲ οὐ μιαίνεται⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/002.yaml
  text: For the pure mind has no defilement from dung or filth, but rather repels both and drives away the stench; thus also the pure mind, when held among the defilements of the earth, rather †builds up†, and is itself not defiled.
translation:
  language: pt
  text: Pois a mente pura não tem contaminação por esterco nem lodo; pelo contrário, esfria ambos e afasta o mau cheiro. Assim também a mente pura, embora se veja retida entre as impurezas da terra, antes †edifica†[a], e ela própria não se contamina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto grego traz uma leitura assinalada como incerta: literalmente, «edifica». O sentido pretendido neste contexto não é claro.'
    reason: O sinal crítico em †οἰκοδομεῖ† indica dificuldade ou possível corrupção textual; a nota preserva essa incerteza para o leitor.
lexical_decisions:
- source_word: καθαρὸς νοῦς
  choice: mente pura
  rationale: Equivalência direta e natural, preservando a dimensão moral do adjetivo sem acrescentar uma interpretação denominacional.
- source_word: μιασμόν / μιασμοῖς / μιαίνεται
  choice: se contamina / impurezas / se contamina
  rationale: Mantém em português a recorrência da mesma família semântica grega ligada à contaminação e impureza.
- source_word: κόπρου καὶ βόρβορον
  choice: esterco nem lama
  rationale: Traduz os referentes concretos com linguagem corrente; βόρβορος pode indicar lama, lodo ou sujeira imunda.
- source_word: ψύγει
  choice: esfria
  rationale: Retém o sentido lexical do texto grego transmitido, embora a imagem seja incomum e a versão inglesa consultiva prefira uma solução contextual diferente.
- source_word: ἀπελαύνει τὴν δυσωδίαν
  choice: afasta o mau cheiro
  rationale: Expressão portuguesa clara que corresponde ao ato de expulsar ou repelir o fedor.
- source_word: συνεχόμενος
  choice: embora cercada
  rationale: Comunica a ideia de estar presa, envolvida ou comprimida entre impurezas e torna explícito, sem resolver em excesso, o contraste com a ausência de contaminação.
- source_word: †οἰκοδομεῖ
  choice: †edifica†
  rationale: Reproduz literalmente a leitura textual assinalada como incerta, sem substituir a dificuldade por uma conjectura silenciosa.
theological_decisions:
- issue: Pureza da mente em contato com a impureza terrena
  choice: A mente pura permanece não contaminada mesmo cercada de impurezas.
  alternative: Entender a frase como promessa de impecabilidade absoluta ou como ensino ascético específico.
  rationale: O texto apresenta uma comparação moral, mas não define uma doutrina sistemática; a tradução conserva a afirmação sem ampliar seu alcance.
- issue: Sentido da leitura textual †οἰκοδομεῖ†
  choice: Manter †edifica† e indicar a incerteza em nota.
  alternative: Emendar para uma ideia como ‘resiste’, ‘permanece firme’ ou ‘purifica’.
  rationale: A forma transmitida é semanticamente difícil neste contexto, e não há base suficiente no material fornecido para impor uma conjectura.
translation_notes:
  register: Português moderno, digno e acessível, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição de ‘mente pura’ e do campo semântico de contaminação foi preservada. A imagem incomum de ‘esfriar’ foi mantida por fidelidade ao grego, e a leitura textual duvidosa foi marcada no corpo e explicada em nota.
