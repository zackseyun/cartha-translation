  to: Pois a mente pura não tem contaminação por esterco nem lodo; pelo contrário, esfria ambos e afasta o mau cheiro. Assim também a mente pura, embora se veja retida entre as impurezas da terra, antes †edifica†[a], e ela própria não se contamina.
