source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VIII. *Ὑμεῖς δέ¹, *τέκνα μου², ἀπόδρατε³ τὴν κακίαν, Γ*τὸν φθόνον⁴ καὶ τὴν⁵ μισαδελφίαν⁶, καὶ προσκολλᾶσθε⁶ τῇ ἀγαθότητι Γκαὶ τῇ ἀγάπῃ⁷⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/001.yaml
  text: But you, my children, flee evil — envy and hatred of brothers — and cling to goodness and love.
translation:
  language: pt
  text: Mas vocês, meus filhos, fujam da maldade — da inveja e do ódio aos irmãos — e apeguem-se à bondade e ao amor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδρατε
  choice: fujam
  rationale: Preserva a força do imperativo, que exige afastamento decidido da maldade.
- source_word: κακίαν
  choice: maldade
  rationale: Termo amplo e natural que corresponde ao sentido moral negativo do grego.
- source_word: φθόνον
  choice: inveja
  rationale: Equivalente direto e corrente para o sentimento de ressentimento diante do bem alheio.
- source_word: μισαδελφίαν
  choice: ódio aos irmãos
  rationale: Expressa de modo claro o composto grego, sem restringir indevidamente 'irmãos' a parentes biológicos.
- source_word: προσκολλᾶσθε
  choice: apeguem-se
  rationale: Comunica adesão firme e contínua, além de simples preferência.
- source_word: ἀγαθότητι
  choice: bondade
  rationale: Equivalente natural para a qualidade moral positiva indicada pelo substantivo.
- source_word: ἀγάπῃ
  choice: amor
  rationale: Mantém o termo amplo do original sem acrescentar uma qualificação teológica ausente do texto.
theological_decisions:
- issue: Alcance de μισαδελφία ('ódio aos irmãos')
  choice: ódio aos irmãos
  alternative: ódio fraternal
  rationale: A formulação escolhida preserva o objeto pessoal expresso no composto grego e deixa aberto se a referência é à família, à comunidade ou ao próximo tratado como irmão.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos naturais no plural brasileiro. Os travessões apresentam 'inveja e ódio aos irmãos' como especificação da maldade, refletindo a estrutura do texto.
