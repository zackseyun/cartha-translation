source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διακοσίων ἐτῶν πάσχει, καὶ ἐννακοσιοστῷ²⁶ ἔτει ἐρημοῦται²⁷· διὰ γὰρ Ἄβελ τὸν ἀδελφὸν αὐτοῦ * ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο, ὁ δὲ Λαμὲχ ἐν ἑβδομηκοντάκις ἑπτά. Ὅτι³⁶ *ἕως τοῦ αἰῶνος³⁷ οἱ ὁμοιούμενοι *τῷ Καὶν³⁸ Γ*ἐπὶ φθόνῳ καὶ μισαδελφίᾳ τοιαύτῃ⁷ κολασθήσονται Γκρίσει⁷³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/004.yaml
  text: For two hundred years he suffers, and in the nine-hundredth year he was made desolate; for because of Abel his brother he was judged in all evils, but Lamech in seventy times seven. Because to the end of the age, those who become like Cain in envy and hatred of brothers will be punished with similar judgment.
translation:
  language: pt
  text: Durante duzentos anos ele sofre e, no ano novecentos, fica desolado; pois, por causa de Abel, seu irmão, foi julgado em meio a todos os males, mas Lameque, setenta vezes sete. Pois, até o fim da era, os que se tornam semelhantes a Caim na inveja e no ódio aos irmãos serão punidos com juízo semelhante.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάσχει
  choice: sofre
  rationale: Preserva o presente do grego e sua formulação direta.
- source_word: ἐννακοσιοστῷ ἔτει
  choice: no noningentésimo ano
  rationale: Mantém o ordinal preciso do texto grego, apesar da cronologia incomum.
- source_word: ἐρημοῦται
  choice: é deixado desolado
  rationale: Expressa o valor passivo e a ideia de devastação sem especificar um agente ausente do texto.
- source_word: ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο
  choice: foi julgado em meio a todos os males
  rationale: Conserva a relação deliberadamente pouco definida entre o julgamento e os males, sem convertê-la em uma punição mais específica.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: setenta vezes sete
  rationale: Reproduz literalmente a expressão numérica tradicional.
- source_word: ἕως τοῦ αἰῶνος
  choice: até o fim da era
  rationale: Comunica o horizonte temporal escatológico possível sem impor a tradução 'eternamente'.
- source_word: μισαδελφίᾳ
  choice: ódio aos irmãos
  rationale: Traduz de modo claro o composto grego que denota aversão ou ódio fraterno.
- source_word: τοιαύτῃ κολασθήσονται κρίσει
  choice: serão punidos com juízo semelhante
  rationale: Mantém tanto a punição quanto sua correspondência com o caso de Caim.
theological_decisions:
- issue: Duração expressa por ἕως τοῦ αἰῶνος
  choice: até o fim da era
  alternative: para sempre
  rationale: A expressão pode apontar para o limite da era; a tradução escolhida preserva essa possibilidade e evita afirmar duração eterna onde o grego não a exige inequivocamente.
- issue: Natureza do julgamento de Caim
  choice: julgado em meio a todos os males
  alternative: condenado a todos os males
  rationale: A alternativa definiria os males como conteúdo exato da sentença; o texto permite uma relação mais aberta.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do grego. A brusca contraposição referente a Lameque foi mantida, pois o próprio texto é elíptico. Não se acrescentou sujeito nominal para o pronome inicial, já que o contexto fornecido não o identifica explicitamente.
