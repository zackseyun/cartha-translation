id: T12P.BEN.7.2
reference: Testament of Benjamin 7:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/002.yaml
  text: 'And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.'
translation:
  language: pt
  text: 'E a espada é mãe de sete males. Primeiro, a mente os concebe por meio de Belial. São eles: primeiro, a inveja; segundo, a destruição; terceiro, a aflição; quarto, o castigo divino[a]; quinto, a carência; sexto, a agitação; sétimo, a desolação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego é raro e pode indicar uma calamidade ou um castigo atribuído à ação divina. Algumas traduções trazem “cativeiro”.
    reason: Registra uma dificuldade lexical e textual real no quarto item da lista.
lexical_decisions:
- source_word: μάχαιρα
  choice: espada
  rationale: Mantém a imagem concreta do grego, sem ampliá-la interpretativamente para “violência”.
- source_word: διάνοια
  choice: mente
  rationale: Equivalente corrente e abrangente para a faculdade do pensamento e da intenção.
- source_word: Βελίαρ
  choice: Belial
  rationale: Forma tradicional e reconhecível em português para o nome próprio, sem explicar no corpo do texto sua função teológica.
- source_word: φθόνος
  choice: inveja
  rationale: Sentido direto e usual do termo.
- source_word: ἀπώλεια
  choice: destruição
  rationale: Preserva o sentido de ruína ou perdição e o distingue de ἐρήμωσις, traduzido por “desolação”.
- source_word: θλῖψις
  choice: aflição
  rationale: Expressa sofrimento e pressão sem restringir o termo a perseguição ou opressão.
- source_word: θεηλασία
  choice: castigo divino
  rationale: O termo raro aponta literalmente para uma calamidade ou visitação atribuída à ação divina; a nota registra a tradução tradicional divergente.
- source_word: ἔνδεια
  choice: carência
  rationale: Comunica falta e privação em português natural, sem limitar o sentido à pobreza econômica.
- source_word: ταραχή
  choice: agitação
  rationale: Preserva a ideia ampla de perturbação, tumulto ou desordem.
- source_word: ἐρήμωσις
  choice: desolação
  rationale: Mantém a imagem de devastação e abandono no último item da série.
theological_decisions:
- issue: A agência de Belial na concepção dos males
  choice: “por meio de Belial”
  alternative: “sob a influência de Belial”
  rationale: A tradução conserva a expressão instrumental διὰ τοῦ Βελίαρ sem definir de modo mais específico como se relacionam a mente humana e Belial.
- issue: Sentido de θεηλασία no quarto mal
  choice: “castigo divino” no texto, com nota
  alternative: “cativeiro”
  rationale: A escolha segue mais diretamente a forma grega transmitida, mas a tradição textual e tradutória torna necessário preservar a alternativa sem resolver silenciosamente a dificuldade.
translation_notes:
  register: Português moderno, claro e digno, com enumeração ritmada. O pronome “os” retoma explicitamente os “sete males” para tornar inteligível a sintaxe grega abrupta, sem adotar a metáfora adicional de “nascimentos” presente na camada inglesa.
