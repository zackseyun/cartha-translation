base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/001.yaml
  text: Therefore, my children, I tell you, flee the evil of Beliar, because he gives a sword to those who obey him.
translation:
  language: pt
  text: '7 Portanto, meus filhos, eu lhes digo: fujam da maldade de Beliar, pois ele dá uma espada aos que lhe obedecem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Portanto
  rationale: Expressa naturalmente a inferência ou conclusão indicada pela locução grega.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Mantém a forma de tratamento familiar e exortativa do texto.
- source_word: φεύγετε
  choice: fujam
  rationale: O imperativo presente exige afastamento ativo; “fujam” é direto e idiomático.
- source_word: τὴν κακίαν
  choice: da maldade
  rationale: Traduz κακία como qualidade moral nociva, sem restringi-la a um ato específico.
- source_word: τοῦ Βελίαρ
  choice: de Belial
  rationale: Preserva o nome tradicional da figura personificada, em forma corrente em português bíblico.
- source_word: μάχαιραν
  choice: uma espada
  rationale: Equivalente concreto e direto do substantivo grego, mantendo a imagem de violência.
- source_word: τοῖς πειθομένοις αὐτόν
  choice: aos que lhe obedecem
  rationale: No contexto de submissão a Belial, πείθομαι com objeto pessoal comunica dar ouvidos e obedecer.
theological_decisions:
- issue: Relação genitiva em “a maldade de Belial”
  choice: de Belial
  alternative: a maldade que vem de Belial
  rationale: Mantém a concisão e a possível amplitude do genitivo grego, sem definir se indica origem, posse ou associação.
- issue: Função da espada dada por Belial
  choice: Manter apenas “dá uma espada”
  alternative: Explicitar que a espada leva à violência ou à destruição
  rationale: O texto não explica aqui a função ou o efeito da espada; a tradução preserva a imagem e sua tensão sem interpretação adicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A ordem foi levemente ajustada à sintaxe natural do português, sem eliminar ambiguidades relevantes.
