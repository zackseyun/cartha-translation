base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/003.yaml
  text: Because of this also, Cain was handed over by God to seven acts of vengeance. For every hundredth year the Lord brought one plague upon him.
translation:
  language: pt
  text: Por isso também Caim foi entregue por Deus a sete atos de vingança. Pois a cada centésimo ano o Senhor trouxe sobre ele uma praga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: também
  rationale: Preserva o valor aditivo explícito do grego.
- source_word: ἑπτὰ ἐκδικίαις
  choice: a sete atos de vingança
  rationale: Mantém o plural concreto e a noção de retribuição, sem transformar a expressão em simples castigos.
- source_word: παρεδόθη ὑπὸ τοῦ Θεοῦ
  choice: foi entregue por Deus
  rationale: Reproduz a voz passiva e conserva Deus como agente explícito.
- source_word: κατὰ ... ἑκατοστὸν ἔτος
  choice: a cada centésimo ano
  rationale: Expressa a distribuição temporal indicada por κατά com o ordinal, sem reduzir a frase a um único período de cem anos.
- source_word: μίαν πληγὴν ἐπήγαγεν ἐπʼ αὐτόν
  choice: fazia vir sobre ele uma praga
  rationale: Comunica de modo natural a imposição recorrente de uma única praga em cada ocasião; o imperfeito se harmoniza com a expressão distributiva.
theological_decisions:
- issue: Relação de Deus com a punição de Caim
  choice: foi entregue por Deus
  alternative: foi submetido a sete vinganças
  rationale: O texto nomeia explicitamente Deus como agente; omiti-lo atenuaria uma afirmação teológica presente na fonte.
- issue: Natureza das sete ἐκδικίαι
  choice: atos de vingança
  alternative: castigos
  rationale: A tradução conserva a linguagem forte de vingança/retribuição e não resolve a tensão interpretativa convertendo-a em termo mais genérico.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem coloquialismo. A formulação preserva a repetição temporal e a agência divina explícita do grego.
