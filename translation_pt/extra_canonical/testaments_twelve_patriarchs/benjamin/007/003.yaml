- from: Por isso, também Caim foi entregue por Deus a sete atos de vingança. Pois, a cada centésimo ano, o Senhor fazia vir sobre ele uma praga.
  to: Por isso também Caim foi entregue por Deus a sete atos de vingança. Pois a cada centésimo ano o Senhor trouxe sobre ele uma praga.
