base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009.yaml
  text: '1. And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again[b], and the kingdom of the Lord will not be among you. 2. Nevertheless, in your allotted portion there will be the temple of God, and the last will be more glorious than the first; and there the twelve tribes will be gathered, and all the nations, until the Most High sends his salvation in the visitation of an only-begotten prophet.


    3. And he will enter into the first temple, and there the Lord will be treated with outrage, and he will be lifted up on wood. 4. And the curtain-spread of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out. 5. And when he has gone up from Hades, he will pass from earth to heaven. And I know how lowly he will be on earth[e][d][c], and how glorious in heaven.'
translation:
  language: pt
  text: '**Testamento de Benjamim 9**


    1 Também vos digo, com base nas palavras de Enoque, o justo: cometereis a prostituição de Sodoma e perecereis por pouco tempo. Então sereis renovados novamente, e o reino do Senhor não estará entre vós. 2 Contudo, na porção que vos foi atribuída haverá um templo de Deus, e o último será mais glorioso que o primeiro. Ali se reunirão as doze tribos e todas as nações, até que o Altíssimo envie a sua salvação na visitação de um profeta unigênito.[b]


    3[a] Ele entrará no primeiro templo, e ali o Senhor será ultrajado e levantado num madeiro.[c] 4 A cortina estendida do templo se rasgará,[d] e o Espírito de Deus passará para as nações, como fogo derramado. 5 Depois de subir do Hades,[e] ele passará da terra para o céu. E eu soube quão humilde ele será na terra e quão glorioso no céu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os versículos 3–5 têm situação incerta na tradição textual e são muitas vezes considerados uma expansão posterior. Foram traduzidos aqui porque constam do texto grego fornecido.
    reason: textual_variant
  - marker: b
    text: 'Ou: “de um profeta único”.'
    reason: lexical_alternative
  - marker: c
    text: “Levantado num madeiro” traduz literalmente a expressão grega, que também pode evocar alguém erguido numa árvore ou estrutura de madeira.
    reason: lexical_alternative
  - marker: d
    text: A expressão grega é incomum e designa algo estendido ou uma cortina do templo; muitos leitores a entenderão como o véu do templo.
    reason: lexical_alternative
  - marker: e
    text: Hades é o domínio dos mortos, não necessariamente o lugar final de castigo.
    reason: cultural_note
lexical_decisions:
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: cometereis a prostituição de Sodoma
  rationale: Mantém a construção enfática de verbo e substantivo cognatos e preserva a alusão compacta a Sodoma sem especificar além do grego a natureza exata do pecado.
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: perecereis por pouco tempo
  rationale: Conserva a aparente duração limitada da perdição antes da renovação, sem transformar a expressão em simples iminência.
- source_word: ἀνανεωθήσεσθε
  choice: sereis renovados
  rationale: Reproduz o futuro passivo e a ideia de renovação, evitando introduzir um termo teológico mais técnico.
- source_word: ἐν μερίδι ὑμῶν
  choice: na porção que vos foi atribuída
  rationale: Explicita de modo natural o sentido de quinhão territorial ou hereditário, provavelmente ligado à porção tribal de Benjamim.
- source_word: ὁ ἔσχατος ἔνδοξος ὑπὲρ τὸν πρῶτον
  choice: o último será mais glorioso que o primeiro
  rationale: Preserva a comparação e a referência implícita do grego sem acrescentar novamente o substantivo 'templo'.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: a sua salvação
  rationale: Mantém a formulação profética compacta e permite tanto a ideia de salvação quanto a de auxílio salvador.
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  choice: na visitação de um profeta unigênito
  rationale: Preserva tanto o idioma formal de visitação divina quanto a força teologicamente carregada e incomum de μονογενής, sem resolver a relação entre as duas expressões.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: levantado num madeiro
  rationale: Traduz ξύλον concretamente e conserva a formulação ambígua de ser erguido sobre madeira, sem inserir explicitamente 'cruz'.
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: a cortina estendida do templo
  rationale: Procura conservar o caráter incomum de ἅπλωμα, algo estendido ou desdobrado, sem o substituir silenciosamente pelo termo grego habitual para 'véu'.
- source_word: ἐκ τοῦ ᾅδου
  choice: do Hades
  rationale: Translitera o nome do domínio dos mortos para não o identificar automaticamente com o lugar de castigo final.
- source_word: Ἔγνων
  choice: eu soube
  rationale: Reproduz o aoristo grego como uma percepção recebida, embora o sentido contextual também possa aproximar-se de 'sei'.
theological_decisions:
- issue: Inclusão dos versículos 3–5, colocados entre colchetes na edição grega
  choice: Incluídos no texto principal com nota de incerteza textual
  alternative: Omiti-los como expansão posterior ou imprimi-los apenas em nota
  rationale: A fonte grega fornecida contém o material, mas sua apresentação entre colchetes e a tradição testemunhal exigem transparência sobre sua situação textual.
- issue: Sentido de μονογενοῦς προφήτου
  choice: de um profeta unigênito
  alternative: de um profeta único
  rationale: A tradução retém a força lexical e a tensão teológica da expressão incomum, enquanto a nota apresenta a alternativa sem a impor ao texto.
- issue: Referente de Κύριος no versículo 3
  choice: o Senhor será ultrajado
  alternative: o profeta será ultrajado ou o ungido do Senhor será ultrajado
  rationale: O texto grego diz explicitamente 'Senhor'; substituir o referente resolveria uma tensão que o original deixa no texto.
- issue: Destino do Espírito de Deus no versículo 4
  choice: passará para as nações
  alternative: virá sobre as nações
  rationale: A escolha preserva o movimento expresso por μεταβήσεται e sua possível tensão histórico-teológica, sem suavizá-lo para uma fórmula mais habitual.
translation_notes:
  register: Português atual, solene e acessível, com formas de segunda pessoa do plural para corresponder ao discurso dirigido aos descendentes de Benjamim. Mantiveram-se construções deliberadamente incomuns onde o grego é lexical ou teologicamente tenso; notas esclarecem sem harmonizar.
