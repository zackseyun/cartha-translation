    3[a] Ele entrará no primeiro templo, e ali o Senhor será ultrajado e levantado num madeiro.[c] 4 A cortina estendida do templo se rasgará,[d] e o Espírito de Deus passará para as nações, como fogo derramado. 5 Depois de subir do Hades,[e] ele passará da terra para o céu. E eu soube quão humilde ele será na terra e quão glorioso no céu.'
