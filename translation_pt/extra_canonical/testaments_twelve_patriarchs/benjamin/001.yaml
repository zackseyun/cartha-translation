base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001.yaml
  text: 'The Copy of the Words of Benjamin[a], the twelfth son of Jacob, which he set in order for his sons, having lived one hundred and twenty-five years.


    And after kissing them, he said:


    Just as Isaac was born to Abraham in his old age, so I also was born to Jacob. And since Rachel my mother died while giving birth to me, I had no milk; so I was nursed by Bilhah, her maidservant. For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and after conceiving she bore me. For my father loved Rachel exceedingly, and he prayed to see two sons from her. Because of this I was called Benjamin[b], which means son of days.'
translation:
  language: pt
  text: 'Testamento de Benjamim, o décimo segundo filho de Jacó e Raquel


    1 Cópia das palavras de Benjamim, que ele deixou ordenadas para seus filhos, tendo vivido cento e vinte e cinco anos.


    2 Depois de beijá-los com carinho, disse:


    — Assim como Isaque nasceu a Abraão em sua velhice, também eu nasci a Jacó. 3 E, visto que minha mãe Raquel morreu ao me dar à luz, não tive leite materno; por isso, fui amamentado por Bila, sua serva. 4 Pois Raquel permaneceu estéril por doze anos depois de dar à luz José; e orou ao Senhor com jejum e, depois de conceber, deu-me à luz. 5 Meu pai amava profundamente Raquel e orava para ver dois filhos dela. 6 Por isso, fui chamado Benjamim[a], que significa “filho de dias”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gênesis apresenta uma explicação diferente, mais conhecida, para o nome Benjamim; aqui, porém, o testamento grego traz a etimologia “filho de dias”.
    reason: cross_reference
lexical_decisions:
- source_word: διέθετο
  choice: deixou ordenadas
  rationale: No contexto testamentário, expressa uma disposição final deliberada dirigida aos filhos, sem impor uma formulação jurídica excessiva.
- source_word: Καταφιλήσας
  choice: depois de beijá-los com carinho
  rationale: O verbo composto sugere beijos afetuosos; a formulação conserva esse matiz em português natural.
- source_word: ἐν γήρει αὐτοῦ
  choice: em sua velhice
  rationale: É a expressão idiomática adequada para a comparação entre o nascimento de Isaque e o de Benjamim.
- source_word: τέθνηκε γεννῶσά με
  choice: morreu ao me dar à luz
  rationale: Transmite de modo claro e idiomático que a morte de Raquel ocorreu no parto de Benjamim.
- source_word: γάλα οὐκ ἔσχον
  choice: não tive leite materno
  rationale: 'Explicita apenas o referente naturalmente implícito no contexto: a impossibilidade de ser amamentado pela mãe falecida.'
- source_word: ἐθήλασα
  choice: fui amamentado
  rationale: 'O sentido contextual é passivo: Bila forneceu o leite e amamentou Benjamim.'
- source_word: ἐστείρευσεν
  choice: ficou estéril
  rationale: Preserva a afirmação de infertilidade durante o intervalo posterior ao nascimento de José.
- source_word: πρὸς Κύριον
  choice: ao Senhor
  rationale: Mantém a direção explícita da oração e a forma portuguesa corrente para Κύριος.
- source_word: μετὰ νηστείας
  choice: com jejum
  rationale: Conserva de maneira concisa a associação entre a oração e o jejum.
- source_word: Σφόδρα ἠγάπα
  choice: amava profundamente
  rationale: Expressa a intensidade de σφόδρα em linguagem atual e digna.
- source_word: υἱὸς ἡμερῶν
  choice: filho de dias
  rationale: Traduz diretamente a etimologia explícita oferecida pelo testemunho grego, sem harmonizá-la com Gênesis.
theological_decisions:
- issue: Significado do nome Benjamim no testemunho grego
  choice: “filho de dias”
  alternative: “filho da mão direita” ou, interpretativamente, “filho da velhice”
  rationale: O texto grego explica expressamente o nome por υἱὸς ἡμερῶν. A tradução preserva essa leitura peculiar e a tensão com a explicação mais conhecida em Gênesis.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A numeração segue as unidades do texto grego. O título incorpora a identificação de Benjamim como filho de Jacó e Raquel, enquanto o corpo preserva a abertura “Cópia das palavras”. O discurso direto foi marcado para facilitar a leitura.
