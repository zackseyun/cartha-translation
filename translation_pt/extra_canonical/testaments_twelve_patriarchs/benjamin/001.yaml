  naturalness: O português é claro, moderno e de registro apropriado. “Permaneceu estéril” e “dois filhos dela” soam naturais e evitam acréscimos interpretativos.
  terminology: Os nomes, “Senhor”, “jejum”, “serva” e “filho de dias” estão adequados. A nota preserva corretamente a divergência em relação à explicação mais difundida em Gênesis, sem harmonizar o testemunho grego.
