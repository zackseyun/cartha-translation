  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004.yaml
  text: '1[a]. See then, my children, the outcome of the good man. Imitate the good, because of his compassion, so that you also may wear crowns of glory.


    2. For the good man does not have a darkened eye, for he shows mercy to all, even if they are sinners.


    3[b]. And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.


    4. If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.


    5. He defends the one who has the fear of the Lord; he helps the one who loves God; by admonishing, he turns back the one who rejects the Most High; and he loves, as his own soul[c], the one who has the grace of a good spirit.'
translation:
  language: pt
  text: '**Testamento de Benjamim 4**


    **1.[a]** Vejam, portanto, meus filhos, o desfecho do homem bom. Imitem o homem bom, por causa de sua compaixão, para que vocês também usem coroas de glória.


    **2.[b]** Pois o homem bom não tem o olhar escuro, porque trata todos com misericórdia, ainda que sejam pecadores.


    **3.** Ainda que não tenham boas intenções para com ele, fazendo o bem ele vence o mal, pois é protegido por Deus. Ama os que o tratam injustamente como à sua própria alma.


    **4.** Se alguém é honrado, não o inveja; se alguém enriquece, não sente ciúme; se alguém é valente, ele o elogia. Ama quem tem domínio próprio, trata o pobre com misericórdia, sofre com o fraco e teme a Deus.


    **5.[c]** E ama como à sua própria alma aquele que possui a graça de um espírito bom.


    **Notas**


    **[a]** A camada de OCR contém antes deste versículo algumas linhas sobre “o Cordeiro de Deus” e sobre o inocente que morre pelos ímpios. Essas linhas apresentam dificuldades textuais e parecem estar deslocadas em relação ao início coerente deste capítulo; por isso, não foram incluídas no texto principal.


    **[b]** “Olhar escuro” também pode ser entendido como “olhar mau”, expressão que indica uma atitude invejosa ou ressentida.


    **[c]** Alguns testemunhos apresentam aqui uma forma mais breve, como o texto grego fornecido, enquanto outros ampliam a lista de virtudes. A tradução segue a forma breve do texto-fonte fornecido.'
  philosophy: optimal-equivalence
