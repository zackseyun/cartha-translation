lexical_decisions:
- source_word: τέλος
  choice: desfecho
  rationale: No contexto exortativo, indica o resultado ou fim observável da vida do homem bom. “Desfecho” mantém a possível ideia de fim sem reduzir o termo a morte ou finalidade.
- source_word: μιμήσασθε
  choice: imitem-no
  rationale: Mantém a força direta do imperativo de imitação moral; o pronome retoma naturalmente “o homem bom” em português.
- source_word: εὐσπλαγχνία
  choice: compaixão
  rationale: Expressa misericórdia profunda e afetuosa em linguagem atual e digna.
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: olhar obscurecido
  rationale: Preserva a imagem grega sem a interpretar diretamente como inveja ou ressentimento; a alternativa idiomática é indicada em nota.
- source_word: ἐλεεῖ
  choice: trata ... com misericórdia
  rationale: Comunica uma atitude ativa de misericórdia e funciona naturalmente tanto com “todos” quanto com “o pobre”.
- source_word: νικᾷ τὸ κακόν
  choice: vence o mal
  rationale: Reproduz de modo direto e idiomático o contraste moral do grego.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: pois é protegido por Deus
  rationale: O particípio descreve abrigo ou proteção divina. A formulação preserva o sentido sem forçar a metáfora de cobertura.
- source_word: ἀδικοῦντας
  choice: os que o tratam injustamente
  rationale: Mantém o sentido de praticar injustiça contra alguém sem limitar a expressão a uma modalidade específica de dano.
- source_word: δοξάζηται
  choice: é honrado
  rationale: Neste catálogo social de virtudes, o verbo se refere mais naturalmente a receber honra ou reconhecimento do que à glorificação divina.
- source_word: φθονεῖ / ζηλοῖ
  choice: inveja / sente ciúme
  rationale: Conserva a distinção entre os dois termos próximos empregados no catálogo de vícios.
- source_word: σώφρονα
  choice: quem tem domínio próprio
  rationale: Destaca a moderação moral indicada no contexto e evita restringir o referente ao sexo masculino.
- source_word: συμπάσχει
  choice: sofre com
  rationale: Preserva de maneira concisa a ideia forte de participar do sofrimento alheio.
- source_word: χάριν ἀγαθοῦ πνεύματος
  choice: a graça de um espírito bom
  rationale: Mantém a estrutura e a ambiguidade do grego quanto a “espírito”, sem decidir se se trata de disposição humana ou referência espiritual específica.
theological_decisions:
- issue: Material cristológico anterior ao versículo 1 na camada de OCR
  choice: Não incluído no texto principal e documentado em nota
  alternative: Incluir as linhas sobre o Cordeiro de Deus e a morte do inocente pelos ímpios como parte do capítulo 4
  rationale: A unidade exortativa fornecida começa coerentemente em Ἴδετε οὖν, τέκνα μου, enquanto as linhas anteriores parecem deslocadas ou pertencentes a outra corrente textual. A nota registra a questão sem harmonização silenciosa.
- issue: Sentido de σκοτεινὸν ὀφθαλμόν
  choice: Manter a imagem como “olhar obscurecido”
  alternative: Traduzir interpretativamente como “olhar mau” ou “olhar invejoso”
  rationale: A imagem pode conotar inveja ou má vontade, mas o grego não explicita uma única interpretação. A tradução conserva a tensão lexical e a nota apresenta a principal alternativa.
- issue: Extensão do versículo 5
  choice: Traduzir somente a frase atestada no texto grego fornecido
  alternative: Incluir a sequência ampliada sobre defender quem teme o Senhor, ajudar quem ama a Deus e corrigir quem rejeita o Altíssimo
  rationale: A sequência ampliada presente na camada inglesa de consulta não consta do texto grego fornecido para este versículo. Seguir a evidência-fonte exige adotar a forma breve e registrar a variação em nota.
- issue: Referente de ἀγαθοῦ πνεύματος
  choice: “um espírito bom”, sem identificação adicional
  alternative: Entender como o Espírito Santo ou apenas como bom caráter humano
  rationale: A expressão grega não determina inequivocamente o referente. A tradução evita impor uma identificação doutrinária.
translation_notes:
  register: Português moderno de alcance internacional, com leitura natural no Brasil. Empregam-se “vocês” e imperativos correspondentes para clareza contemporânea, mantendo tom exortativo e digno. Formulações excessivamente eclesiásticas foram evitadas; imagens e ambiguidades relevantes do grego foram preservadas.
