  - severity: low
    issue: «Olhar obscurecido» tende a introduzir uma nuance causal
    rationale: O adjetivo grego σκοτεινόν descreve o «olho/olhar» como escuro. «Olhar escuro» conserva a imagem de modo mais direto e deixa aberta a conotação moral indicada na nota.
