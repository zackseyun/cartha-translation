    **1.** Depois de dizer essas coisas, ele estendeu os pés e adormeceu num bom sono[a].


    **2.** Seus filhos fizeram conforme ele lhes havia ordenado; levaram seu corpo e o sepultaram em Hebrom, com seus pais.


    **2.** O número dos anos de sua vida foi cento e vinte e cinco[b]. E, quando terminou suas palavras, disse: “Eu lhes ordeno, meus filhos: levem meus ossos para fora do Egito e sepultem-me em Hebrom, perto de meus pais”.


    **2.** Benjamim morreu aos cento e vinte e cinco anos, numa boa velhice, e eles o colocaram num caixão.


    **3.** No nonagésimo primeiro ano depois da saída dos filhos de Israel do Egito, eles e seus irmãos levaram secretamente os ossos de seus pais, durante a guerra em Canaã, e os sepultaram em Hebrom, junto aos pés de seus pais[c].


    **4.** Depois, voltaram da terra de Canaã e habitaram no Egito até o dia em que saíram da terra do Egito.


    [a] Alguns testemunhos gregos acrescentam “e agradável” depois de “num bom sono”.


    [b] O capítulo preserva relatos finais sobrepostos acerca da morte e do sepultamento de Benjamim e da posterior transferência dos ossos dos patriarcas. A repetição provavelmente reflete uma história de transmissão complexa, mas é traduzida aqui tal como aparece no testemunho grego.


    [c] A expressão “junto aos pés de seus pais” traduz literalmente o grego e pode indicar o local do sepultamento perto dos túmulos ancestrais, não necessariamente junto aos pés dos próprios pais.'
