  text: '1. And after saying these things, he stretched out his feet and fell asleep in a good sleep[a].

    2. And his sons did as he had commanded them, and they carried up his body and buried him in Hebron with his fathers.


    2. The number of his life was one hundred and twenty-five years[b]. And when he had finished his words, he said, “I command you, my children, carry up my bones out of Egypt, and bury me in Hebron near my fathers.”

    2. And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.

    3. And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly during the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].

    4. And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.'
translation:
  language: pt
  text: '**Testamento de Benjamim 12**


    **1.** Depois de dizer essas coisas, ele estendeu os pés e adormeceu num bom sono[a]. Seus filhos fizeram como lhes havia ordenado; levaram o corpo dele e o sepultaram em Hebrom, junto de seus antepassados. E, depois de terminar suas palavras, disse: “Eu lhes ordeno, meus filhos: levem meus ossos do Egito e sepultem-me em Hebrom, perto de meus antepassados”.


    **2.** Benjamim morreu aos cento e vinte e cinco anos, numa boa velhice; e o colocaram num caixão.


    **3.** No nonagésimo primeiro ano depois da saída dos filhos de Israel do Egito, eles e seus irmãos levaram secretamente os ossos de seus antepassados, durante a guerra em Canaã, e os sepultaram em Hebrom, junto aos pés de seus antepassados[c].


    **4.** Eles voltaram da terra de Canaã e habitaram no Egito até o dia de sua saída da terra do Egito.


    [a] Alguns testemunhos gregos acrescentam “e bom” depois de “num bom sono”.


    [b] O capítulo preserva relatos finais sobrepostos acerca da morte e do sepultamento de Benjamim e da posterior transferência dos ossos dos patriarcas. A repetição provavelmente reflete uma história de transmissão complexa, mas é traduzida aqui tal como aparece no testemunho grego.


    [c] A expressão “junto aos pés de seus antepassados” traduz literalmente o grego e pode indicar o local do sepultamento perto dos túmulos ancestrais, não necessariamente junto aos pés dos próprios antepassados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns testemunhos gregos acrescentam “e bom” depois de “num bom sono”.
    reason: textual_variant
  - marker: b
    text: O capítulo preserva relatos finais sobrepostos acerca da morte e do sepultamento de Benjamim e da posterior transferência dos ossos dos patriarcas. A repetição provavelmente reflete uma história de transmissão complexa, mas é traduzida aqui tal como aparece no testemunho grego.
    reason: textual_variant
  - marker: c
    text: A expressão “junto aos pés de seus antepassados” traduz literalmente o grego e pode indicar o local do sepultamento perto dos túmulos ancestrais, não necessariamente junto aos pés dos próprios antepassados.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: adormeceu num bom sono
  rationale: Preserva tanto o eufemismo testamentário da morte como a repetição de palavras relacionadas ao sono, sem reduzi-la à paráfrase interpretativa “morreu em paz”.
- source_word: ἄραντες
  choice: levaram
  rationale: No contexto, expressa o ato de levantar e transportar o corpo. O português natural não exige a explicitação de movimento ascendente.
- source_word: ἐντέλλομαι
  choice: Eu lhes ordeno
  rationale: Mantém a força da incumbência paterna final e reproduz o objeto indireto plural de maneira clara em português.
- source_word: ἀνενέγκατε
  choice: levem ... para fora do Egito
  rationale: Comunica o transporte dos ossos desde o Egito até Canaã em português idiomático, sem transformar o movimento geográfico em uma direção vertical rígida.
- source_word: ὀστᾶ
  choice: ossos
  rationale: Conserva a concretude do grego e o motivo tradicional do traslado dos ossos dos patriarcas.
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: perto de meus pais
  rationale: Mantém a linguagem de parentesco e a proximidade espacial sem determinar indevidamente a disposição exata do sepultamento.
- source_word: ἐν γήρει καλῷ
  choice: numa boa velhice
  rationale: Preserva o conhecido idioma bíblico e o registro elevado do texto.
- source_word: ἐν παραθήκῃ
  choice: num caixão
  rationale: Embora o termo possa indicar depósito ou custódia, o contexto funerário aponta para um recipiente em que o corpo foi conservado.
- source_word: ἐν κρυφῇ
  choice: secretamente
  rationale: Reproduz de modo direto e natural o valor adverbial da expressão grega.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: junto aos pés de seus pais
  rationale: Mantém a imagem corporal incomum e específica do grego; uma nota esclarece que ela pode descrever a localização nos túmulos ancestrais.
theological_decisions:
- issue: Encerramentos sobrepostos e notícias repetidas da morte e do sepultamento
  choice: Traduzir integralmente os relatos repetidos e manter a numeração sobreposta recebida
  alternative: Fundir as notícias num único encerramento contínuo ou omitir linhas como secundárias
  rationale: A transmissão preserva fórmulas conclusivas sobrepostas. Mantê-las torna visível a complexidade textual em vez de harmonizá-la silenciosamente.
- issue: Indicação cronológica do nonagésimo primeiro ano depois da saída do Egito
  choice: Preservar literalmente a afirmação cronológica no texto principal
  alternative: Emendar a cronologia ou reformulá-la de modo vago
  rationale: O testemunho grego apresenta uma data específica; a tradução conserva a tensão histórica sem resolvê-la por conjectura.
- issue: Sono como linguagem para a morte
  choice: Manter a imagem “adormeceu num bom sono”
  alternative: Explicitar “morreu em paz”
  rationale: A formulação conserva a metáfora do texto sem impor uma explicação doutrinária sobre o estado dos mortos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantêm-se alguns hebraísmos e expressões testamentárias deliberadamente incomuns, como “bom sono”, “boa velhice”, “filhos de Israel” e “pais”, para conservar o perfil antigo do texto sem recorrer a linguagem excessivamente arcaica.
