source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔσται τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον²⁴ καὶ μεταβήσεται²⁵ τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη, ὥσπερ²⁶ πῦρ ἐκχυνόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/004.yaml
  text: And the veil of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out.
translation:
  language: pt
  text: E a cortina do templo será rasgada, e o Espírito de Deus passará para as nações, como fogo derramado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: a cortina do templo
  rationale: No contexto do templo, ἅπλωμα designa algo estendido, isto é, uma cortina ou véu. “Cortina” é natural e inteligível em português, sem perder a referência cultual.
- source_word: σχιζόμενον
  choice: será rasgada
  rationale: O particípio presente em construção perifrástica tem sentido futuro e passivo; “será rasgada” preserva diretamente a imagem de ruptura.
- source_word: μεταβήσεται
  choice: passará para
  rationale: Expressa movimento ou transferência de um âmbito a outro. “Passará para” conserva esse sentido sem explicitar além do grego a natureza dessa passagem.
- source_word: τὰ ἔθνη
  choice: as nações
  rationale: Mantém o valor plural e a possível referência aos povos não judeus, sem reduzir o termo a uma interpretação mais específica.
- source_word: ὥσπερ πῦρ ἐκχυνόμενον
  choice: como fogo derramado
  rationale: Preserva a comparação e a metáfora do fogo vertido; a formulação é concisa, digna e natural em português.
theological_decisions:
- issue: Destino do Espírito de Deus
  choice: passará para as nações
  alternative: passará aos gentios
  rationale: “Nações” reproduz a amplitude semântica de ἔθνη e preserva a tensão entre o sentido geral de povos e o uso religioso de gentios.
- issue: Relação entre o Espírito e a imagem do fogo
  choice: como fogo derramado
  alternative: e será derramado como fogo
  rationale: A sintaxe grega compara a passagem do Espírito a fogo sendo derramado, mas não declara de forma independente que o Espírito “será derramado”. A tradução mantém a comparação sem a transformar em uma segunda afirmação explícita.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A ordem da frase e as imagens proféticas do grego foram preservadas sem rigidez artificial.
