source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '[3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/003.yaml
  text: And he will enter into the first temple, and there the Lord will be insulted and will be lifted up on wood.[a]
translation:
  language: pt
  text: '[3. Ele entrará no primeiro templo, e ali o Senhor será insultado e será levantado sobre um madeiro.[a]]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os versículos 3–5 apresentam incerteza textual na tradição dos manuscritos e muitas vezes são considerados uma expansão posterior; são traduzidos aqui porque constam do texto grego fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: τὸν πρῶτον ναόν
  choice: o primeiro templo
  rationale: Mantém de forma direta o sentido e a possível ambiguidade da expressão grega, sem identificar qual templo é referido.
- source_word: ὑβρισθήσεται
  choice: será insultado
  rationale: Expressa naturalmente o ultraje ou tratamento injurioso indicado pelo verbo, sem ampliar o sentido além do necessário.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: será levantado num madeiro
  rationale: Preserva a formulação concreta e alusiva do grego. “Madeiro” é corrente no registro bíblico português e evita explicitar “cruz”, termo que não aparece no texto-fonte.
theological_decisions:
- issue: Referente do sujeito de εἰσελεύσεται e relação com Κύριος
  choice: “Ele” entra; depois, “o Senhor” é insultado e levantado
  alternative: Entender ou explicitar que “ele” e “o Senhor” são necessariamente o mesmo referente
  rationale: O grego passa de um sujeito implícito para o substantivo explícito Κύριος. A tradução conserva essa forma sem resolver além do texto a identidade exata dos referentes.
- issue: Possível alusão à crucificação
  choice: “num madeiro”
  alternative: “na cruz”
  rationale: Embora a frase possa aludir à crucificação, ξύλον significa literalmente madeira ou madeiro; não se deve tornar explícita uma identificação teológica que o verso deixa alusiva.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se “madeiro” por seu valor concreto e bíblico, e mantêm-se os colchetes do texto-fonte para sinalizar a condição textual da passagem.
