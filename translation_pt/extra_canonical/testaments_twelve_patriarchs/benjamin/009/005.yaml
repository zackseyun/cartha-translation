base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/005.yaml
  text: And having gone up from Hades, he will pass from earth to heaven. And I knew how lowly he would be on earth, and how glorious in heaven.
translation:
  language: pt
  text: E, tendo subido do Hades, ele passará da terra para o céu. E eu soube quão humilde ele seria na terra e quão glorioso seria no céu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνελθὼν ἐκ τοῦ ᾅδου
  choice: tendo subido do Hades
  rationale: Preserva a relação temporal e circunstancial do particípio aoristo e mantém “Hades” como designação do mundo dos mortos, sem substituí-lo por “inferno”, termo teologicamente mais específico.
- source_word: μεταβαίνων ἀπὸ τῆς γῆς πρὸς οὐρανόν
  choice: passará da terra para o céu
  rationale: Expressa em português natural o movimento indicado por μεταβαίνων e pelas preposições ἀπό e πρός.
- source_word: Ἔγνων
  choice: eu soube
  rationale: Reproduz o aoristo de γινώσκω como aquisição ou constatação de conhecimento no passado, em vez do presente “sei”.
- source_word: ταπεινὸς
  choice: humilde
  rationale: Mantém o sentido de condição baixa, modesta ou humilhada sem explicitar além do que o grego permite.
- source_word: ἔνδοξος
  choice: glorioso
  rationale: Equivalente direto e natural para a condição revestida de glória ou honra.
theological_decisions:
- issue: Sentido de ᾅδης
  choice: Hades
  alternative: inferno / morada dos mortos
  rationale: “Hades” conserva a referência grega ao domínio dos mortos sem identificá-lo automaticamente com o lugar de punição final; evita resolver uma questão teológica que o texto não explicita.
- issue: Contraste entre a condição terrena e a celestial
  choice: quão humilde ele seria na terra e quão glorioso seria no céu
  alternative: como seria humilhado na terra e glorificado no céu
  rationale: Mantém os adjetivos predicativos do original e não os transforma em ações passivas, preservando a formulação e sua tensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe próxima do grego sem rigidez excessiva. A repetição de “E” foi mantida para refletir a coordenação do original; “céu” leva artigo em português por naturalidade, embora οὐρανόν esteja sem artigo.
