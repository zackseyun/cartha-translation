id: T12P.BEN.9.1
reference: Testament of Benjamin 9:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IX. Λέγω δὲ ὑμῖν καὶ πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου, *ὅτι πορνεύ(σ)ετε¹ πορνείαν Σοδόμων καὶ ἀπολε(ῖ)σθε ἕως βραχύ. Καὶ πάλιν ἀνανεωθήσεσθε καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/001.yaml
  text: And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again, and the kingdom of the Lord will not be among you.
translation:
  language: pt
  text: Também lhes digo, com base nos oráculos de Enoque, o justo, acerca do que vocês farão:[a] vocês praticarão a imoralidade sexual de Sodoma e perecerão por pouco tempo. E novamente serão renovados, e o reino do Senhor não estará entre vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O grego traz literalmente algo como: “Também lhes digo atos a partir dos oráculos...”. A palavra traduzida aqui como “acerca do que vocês farão” é difícil neste contexto; a tradução a entende como referência às ações futuras dos destinatários.'
    reason: Sinaliza a construção incomum em torno de πράξεις e explicita que a formulação do texto principal é uma interpretação para torná-la inteligível.
lexical_decisions:
- source_word: πράξεις
  choice: o que vocês farão
  rationale: 'A forma grega é difícil neste contexto: pode ser o substantivo “atos” ou, formalmente, um futuro singular, embora o discurso se dirija a várias pessoas. A formulação escolhida conserva a ideia de ações futuras e produz uma frase natural sem ocultar a dificuldade textual.'
- source_word: λογίων
  choice: oráculos
  rationale: “Oráculos” preserva o sentido de pronunciamentos recebidos ou transmitidos com autoridade, em vez do termo genérico “palavras”.
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: vocês praticarão a imoralidade sexual de Sodoma
  rationale: A construção cognata intensifica a conduta sexual ilícita. “Imoralidade sexual” é atual e suficientemente ampla; “de Sodoma” mantém a associação do texto sem especificar além do grego a natureza exata da transgressão.
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: perecerão por um pouco de tempo
  rationale: Mantém tanto o verbo forte “perecer” como a delimitação temporal, sem reinterpretá-la como referência ao número de sobreviventes.
- source_word: πάλιν ἀνανεωθήσεσθε
  choice: serão renovados outra vez
  rationale: Conserva a voz passiva e a ideia explícita de renovação repetida, sem indicar quem efetua a renovação.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: No contexto coletivo, “entre vocês” expressa naturalmente a presença do reino no meio do grupo, embora “em vocês” também seja possível.
theological_decisions:
- issue: A natureza da “imoralidade sexual de Sodoma”
  choice: Não definir a expressão além do que o texto afirma
  alternative: Identificá-la com uma prática sexual específica ou com uma lista mais ampla de pecados
  rationale: O grego associa a conduta à πορνεία de Sodoma, mas não explica aqui em que ela consiste; uma especificação importaria uma interpretação externa.
- issue: A renovação seguida da ausência do reino
  choice: Manter as duas afirmações ligadas por “e”
  alternative: Introduzir contraste, condição ou sequência teológica explicativa
  rationale: O texto conserva uma tensão entre serem renovados e o reino do Senhor não estar entre eles. A tradução não a resolve nem altera a conjunção.
- issue: Agente da renovação
  choice: Preservar a voz passiva sem nomear o agente
  alternative: Explicitar Deus ou o Senhor como agente
  rationale: O grego não identifica expressamente quem os renovará.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural. Evitou-se “fornicação”, hoje mais arcaico e potencialmente mais estreito, e preservaram-se a ambiguidade coletiva de “entre vocês” e a tensão teológica da última oração.
