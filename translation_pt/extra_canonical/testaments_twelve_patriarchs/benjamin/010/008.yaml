source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ οἱ⁴³ πάντες ἀναστήσονται, οἱ μὲν εἰς δόξαν, οἱ δὲ εἰς ἀτιμίαν, καὶ κρινεῖ Κύριος⁴⁴ ἐν πρώτοις τὸν Ἰσραὴλ⁴⁵ περὶ τῆς *ἀδικίας αὐτῶν⁴⁶ [ὅτι παραγενόμενον⁴⁷ Θεὸν⁴⁴ ἐν σαρκί⁴⁸, οὐκ ἐπίστευσαν αὐτῷ⁴⁹].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/008.yaml
  text: And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first concerning their unrighteousness, [because when God came to them in flesh, they did not believe him].
translation:
  language: pt
  text: 'E todos ressuscitarão: uns para a glória e outros para a desonra. E o Senhor julgará primeiro Israel a respeito da injustiça deles [porque, quando Deus veio em carne, não creram nele][a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase entre colchetes é apresentada dessa forma na edição grega, indicando dúvida quanto à sua presença no texto.
    reason: Torna visível ao leitor o estatuto editorial da cláusula sem removê-la nem tratá-la como indiscutível.
lexical_decisions:
- source_word: ἀναστήσονται
  choice: ressuscitarão
  rationale: No contexto de destinos após o levantar-se, o verbo indica ressurreição, e não apenas o ato genérico de se levantar.
- source_word: εἰς δόξαν / εἰς ἀτιμίαν
  choice: para a glória / para a desonra
  rationale: Mantém o paralelismo e a direção para destinos contrastantes expressa por εἰς.
- source_word: ἐν πρώτοις
  choice: primeiro
  rationale: Reproduz de modo natural a prioridade do julgamento de Israel sem acrescentar uma identificação para o grupo implícito.
- source_word: περὶ τῆς ἀδικίας αὐτῶν
  choice: por causa da injustiça deles
  rationale: Expressa a matéria e a razão do julgamento; 'deles' preserva a referência plural do grego.
- source_word: παραγενόμενον Θεὸν ἐν σαρκί
  choice: quando Deus veio em carne
  rationale: Verte a construção participial em português corrente, mantendo tanto a identificação como Deus quanto a formulação concreta 'em carne'.
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: não creram nele
  rationale: Preserva o complemento pessoal no dativo e evita explicitar além do que o texto afirma.
theological_decisions:
- issue: Identidade daquele que veio em carne
  choice: Deus veio em carne
  alternative: ele veio como ser humano
  rationale: O texto grego traz explicitamente Θεόν e ἐν σαρκί; a tradução conserva essa formulação sem atenuá-la nem desenvolver uma interpretação cristológica adicional.
- issue: Extensão do julgamento
  choice: o Senhor julgará primeiro Israel
  alternative: o Senhor julgará Israel entre os primeiros
  rationale: ἐν πρώτοις pode admitir nuance distributiva, mas aqui funciona naturalmente como prioridade temporal. A formulação evita especificar quem seria julgado depois.
- issue: Cláusula entre colchetes na edição-fonte
  choice: manter a cláusula entre colchetes
  alternative: incorporá-la sem indicação ou omiti-la
  rationale: Os colchetes editoriais assinalam incerteza ou condição textual na fonte; preservá-los mantém transparente essa tensão textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. O paralelismo foi mantido, e a cláusula textualmente assinalada permanece entre colchetes.
