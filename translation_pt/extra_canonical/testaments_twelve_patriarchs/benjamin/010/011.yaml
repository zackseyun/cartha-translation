source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⌜Ὑμεῖς οὖν, τέκνα μου⁶⁷, ἐὰν⁶⁸ πορευθῆτε⁶⁹ ἐν ἁγιασμῷ ⌜*ἐν ταῖς ἐντολαῖς⁷⁰ Κυρίου⌝, πάλιν κατοικήσετε⁷¹ ⌜ἐπʼ ἐλπίδι⌝ *ἐν ἐμοί⁷², καὶ συναχθήσεται⁷³ *πρὸς Κύριον⁷⁴ πᾶς Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/011.yaml
  text: You therefore, my children, if you walk in holiness in the commandments of the Lord, you will again dwell in hope with me, and all Israel will be gathered to the Lord.
translation:
  language: pt
  text: Portanto, meus filhos, se vocês andarem em santidade, seguindo os mandamentos do Senhor, voltarão a habitar, na esperança, comigo[a], e todo o Israel será reunido ao Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “em mim”.
    reason: O grego ἐν ἐμοί diz formalmente “em mim”. “Comigo” é uma formulação idiomática portuguesa no contexto de habitar; a nota preserva a expressão e sua possível nuance.
lexical_decisions:
- source_word: ἐν ἁγιασμῷ
  choice: em santidade
  rationale: Preserva o sentido de uma vida caracterizada pela consagração e pela santidade, sem reduzir a expressão a mera conduta moral.
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  choice: nos mandamentos do Senhor
  rationale: Mantém a construção grega com ἐν, aqui entendida como a esfera em que se deve andar.
- source_word: πάλιν κατοικήσετε
  choice: voltarão a habitar
  rationale: Expressa naturalmente tanto o valor de πάλιν, “novamente”, quanto o sentido durativo de κατοικέω, “habitar”.
- source_word: ἐπʼ ἐλπίδι
  choice: na esperança
  rationale: Conserva a referência explícita à esperança, sem convertê-la em certeza ou confiança e assim eliminar uma possível nuance do original.
- source_word: συναχθήσεται πρὸς Κύριον
  choice: será reunido ao Senhor
  rationale: Reproduz a voz passiva e o movimento ou orientação para o Senhor indicados por πρός.
theological_decisions:
- issue: Alcance de πᾶς Ἰσραήλ
  choice: todo o Israel
  alternative: Israel inteiro / todos os israelitas
  rationale: A tradução literal preserva a amplitude e a possível tensão escatológica da expressão, sem decidir se ela designa coletivamente o povo, cada israelita ou outra concepção teológica.
- issue: Relação expressa por ἐν ἐμοί
  choice: comigo, com nota sobre o literal “em mim”
  alternative: em mim
  rationale: “Comigo” produz português inteligível no contexto de habitar, mas a nota conserva a formulação incomum do grego e evita ocultar uma possível nuance de união ou localização.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “vocês” para clareza internacional e boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, mantendo as relações centrais do grego e sua ambiguidade relevante em nota.
