    issue: Ordem e pontuação de “comigo[a], na esperança”
    rationale: O grego apresenta ἐπʼ ἐλπίδι antes de ἐν ἐμοί. Em português, a sequência do rascunho fica pouco fluida e torna menos clara a função de “na esperança” como qualificação de “habitar”.
  - severity: low
    issue: Construção “andarem em santidade, nos mandamentos do Senhor”
    rationale: A vírgula separa de maneira pouco natural duas expressões preposicionais ligadas ao mesmo verbo. “Seguindo os mandamentos” transmite idiomaticamente o sentido de caminhar em conformidade com eles.
