  source_fidelity: 'A tradução preserva todos os elementos do grego: a inferência de οὖν («Portanto»), a exortação ética de ποιήσατε ἀλήθειαν («pratique a verdade»), a aplicação distributiva a cada pessoa em relação ao seu próximo e a dupla referência a «a lei do Senhor» e «os seus mandamentos». O singular português, regido por «cada um», comunica naturalmente a exortação cujo imperativo está no plural no grego.'
  naturalness: «Portanto, cada um pratique a verdade para com o seu próximo e guarde a lei do Senhor e os seus mandamentos» é claro, idiomático e de registro bíblico moderadamente elevado, mas ainda acessível para leitores brasileiros e internacionais. «Para com» é uma formulação natural e apropriada neste registro.
  terminology: «Pratique a verdade» traduz bem a expressão ética ποιεῖν ἀλήθειαν sem a tornar excessivamente literal. «Guardar» é termo estabelecido e compreensível para observar lei e mandamentos. «Senhor», «lei», «mandamentos» e «próximo» são escolhas consistentes e não introduzem interpretações doutrinárias.
