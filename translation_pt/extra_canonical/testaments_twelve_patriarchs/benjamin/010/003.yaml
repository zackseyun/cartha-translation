  text: '*Ποιήσατε οὖν¹¹ ἀλήθειαν *ἕκαστος πρὸς τὸν πλησίον αὐτοῦ¹², Γκαὶ τὸν νόμον Κυρίου, καὶ τὰς ἐντολὰς αὐτοῦ¹³ φυλάξατε˥.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/003.yaml
  text: Therefore, each one should practice truth toward his neighbor, and keep the law of the Lord and his commandments.
translation:
  language: pt
  text: Portanto, cada um pratique a verdade para com o seu próximo e guarde a lei do Senhor e os seus mandamentos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσατε ... ἀλήθειαν
  choice: pratique a verdade
  rationale: A expressão grega significa literalmente “fazei a verdade”; “pratique a verdade” preserva seu sentido ético em português natural.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: cada um ... para com o seu próximo
  rationale: Mantém a referência distributiva de ἕκαστος e a relação expressa por πρός, com formulação clara e digna.
- source_word: φυλάξατε
  choice: guarde
  rationale: No contexto de lei e mandamentos, “guardar” comunica observar e cumprir, além de conservar a linguagem bíblica corrente.
theological_decisions:
- issue: Relação entre “a lei do Senhor” e “os seus mandamentos”
  choice: Manter ambas as expressões coordenadas
  alternative: Fundir as expressões como se fossem equivalentes
  rationale: O grego menciona distintamente τὸν νόμον Κυρίου e τὰς ἐντολὰς αὐτοῦ; a tradução não deve eliminar essa distinção nem definir sua relação teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O imperativo grego foi mantido em português como exortação direta; a concordância no singular segue “cada um”.
