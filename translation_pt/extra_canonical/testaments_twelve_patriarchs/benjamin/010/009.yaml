  text: Καὶ τότε κρινεῖ πάντα τὰ ἔθνη [ὅσα οὐκ ἐπίστευσαν αὐτῷ ἐπὶ τῆς⁵⁰ γῆς φανέντι⁵⁷].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/009.yaml
  text: And then he will judge all the nations, [as many as did not believe him when he appeared on earth].
translation:
  language: pt
  text: E então ele julgará todas as nações [que não acreditaram nele quando ele apareceu na terra].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes também aparecem entre colchetes na edição grega consultada, indicando incerteza textual quanto à sua presença no texto.
    reason: Sinalizar ao leitor a condição textual do trecho sem omiti-lo nem tratá-lo silenciosamente como indiscutível.
lexical_decisions:
- source_word: κρινεῖ
  choice: julgará
  rationale: Mantém o sentido judicial do futuro grego e sua formulação direta.
- source_word: πάντα τὰ ἔθνη
  choice: todas as nações
  rationale: Correspondência natural e precisa para a expressão grega, sem restringir antecipadamente seu alcance.
- source_word: ὅσα οὐκ ἐπίστευσαν αὐτῷ
  choice: todas aquelas que não creram nele
  rationale: Reproduz a retomada explicativa de ὅσα e traduz πιστεύω com dativo de modo claro e idiomático em português.
- source_word: ἐπὶ τῆς γῆς φανέντι
  choice: quando ele apareceu na terra
  rationale: Expressa naturalmente a circunstância temporal ligada ao particípio aoristo e preserva a referência à manifestação terrena.
theological_decisions:
- issue: Alcance do julgamento das nações
  choice: Preservar a formulação que primeiro menciona todas as nações e depois identifica, no trecho entre colchetes, as que não creram.
  alternative: Traduzir diretamente como “julgará todas as nações que não creram”, fundindo as duas partes.
  rationale: A redação escolhida mantém a estrutura e a tensão do grego, sem decidir se a oração entre colchetes restringe ou explica “todas as nações”.
- issue: Referente de αὐτῷ e φανέντι
  choice: Usar “nele” e “ele” sem identificar nominalmente o referente.
  alternative: Explicitar um título ou nome cristológico.
  rationale: O versículo isolado emprega apenas pronomes e particípio; explicitar a identidade importaria uma interpretação não expressa nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O travessão dentro dos colchetes marca a retomada explicativa sem apagar a possível leitura restritiva.
