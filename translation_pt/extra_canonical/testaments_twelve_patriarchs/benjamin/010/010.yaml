review_pass:
  verdict: revise
  source_fidelity: 'A tradução conserva adequadamente o sujeito implícito, a relação comparativa e a ambiguidade de «os eleitos das nações». Contudo, o segmento entre colchetes suaviza e altera o grego: «se entregassem à imoralidade sexual» não traduz o infinitivo γενέσθαι («tornar-se») e «se afastassem» enfraquece o passivo ἀπηλλοτριώθησαν («foram alienados»). Como a própria tradição textual desse trecho é problemática, a tradução deve conservar sua construção incompleta, com nota explicativa, em vez de fornecer uma relação causal mais fluente do que o texto permite.'
  naturalness: Fora o trecho deliberadamente irregular entre colchetes, o português é moderno, claro e de registro apropriado. «Repreenderá» é uma opção defensável para ἐλέγξει; «na porção dos que temem o Senhor» preserva a imagem do original, ainda que seja uma formulação mais literal.
  terminology: «Esaú», «midianitas», «Israel», «Senhor», «idolatria» e «imoralidade sexual» estão adequados. «Foram alienados de Deus» recupera melhor a voz passiva e a força de ἀπηλλοτριώθησαν do que «se afastassem de Deus».
  issues:
  - severity: medium
    issue: O trecho entre colchetes é interpretado em excesso.
    rationale: «Para que se entregassem à imoralidade sexual» substitui o problemático e elíptico γενέσθαι («tornar-se») por uma ação explicitada que o grego não diz. A tradução deve manter a elipse assinalada, pois o texto-fonte é sintaticamente difícil.
  - severity: medium
    issue: A voz de ἀπηλλοτριώθησαν não foi preservada.
    rationale: O aoristo passivo significa «foram alienados de Deus», não simplesmente «se afastassem de Deus». A revisão conserva a formulação passiva sem decidir além do necessário quem é o referente dentro da construção textual instável.
  revised_text: E ele repreenderá Israel entre os eleitos das nações, assim como repreendeu Esaú entre os midianitas, os quais enganaram seus irmãos [a se tornarem, por meio da imoralidade sexual e da idolatria, e foram alienados de Deus][a], tornando-se, assim, filhos na porção dos que temem o Senhor.
  revised_footnotes:
  - marker: a
    text: 'O trecho entre colchetes é textualmente incerto e sua sintaxe parece incompleta: literalmente, traz «a se tornarem por meio da imoralidade sexual e da idolatria, e foram alienados de Deus». A ligação desse segmento com as expressões ao redor, bem como o referente preciso de «foram alienados», não é totalmente clara.'
    reason: A edição assinala esse segmento como problemático ou secundário. A nota explica a construção elíptica sem suprir seu sentido nem definir um referente que o texto não determina com segurança.
  revision_rationale: 'A revisão corrige duas explicitações sem base segura no original: substitui «se entregassem» pela representação cautelosa do infinitivo «tornar-se» e restaura o passivo «foram alienados». A estranheza limitada do texto entre colchetes é intencional e é esclarecida pela nota, pois reflete uma dificuldade textual e sintática efetiva.'
