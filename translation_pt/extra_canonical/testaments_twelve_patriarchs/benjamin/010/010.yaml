source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐλέγξει ἐν τοῖς ἐκλεκτοῖς *τῶν ἐθνῶν⁵⁸ τὸν Ἰσραήλ, ὥσπερ ἤλεγξεν τὸν Ἡσαῦ ἐν τοῖς Μαδιωαίοις τοῖς †ἀπατήσασιν⁵⁹ *ἀδελφοὺς αὐτῶν⁶⁰ [γενέσθαι διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας, καὶ⁶¹ ἀπηλλοτριώθησαν Θεοῦ]⁶², γενόμενοι⁶³ οὖν⁶⁴ τέκνα ἐν μερίδι φοβουμένων⁶⁵ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/010.yaml
  text: And he will convict Israel among the chosen of the nations, just as he convicted Esau among the Midianites, who deceived their brothers [to become through fornication and idolatry, and they were alienated from God], thus becoming children in the portion of those who fear the Lord.
translation:
  language: pt
  text: E ele repreenderá Israel entre os eleitos das nações, assim como repreendeu Esaú entre os midianitas, os quais enganaram seus irmãos [a se tornarem, por meio da imoralidade sexual e da idolatria, e foram alienados de Deus][a], tornando-se, assim, filhos na porção dos que temem o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O trecho entre colchetes é textualmente incerto e sua sintaxe parece incompleta: literalmente, traz «a se tornarem por meio da imoralidade sexual e da idolatria, e foram alienados de Deus». A ligação desse segmento com as expressões ao redor, bem como o referente preciso de «foram alienados», não é totalmente clara.'
    reason: A edição assinala esse segmento como problemático ou secundário. A nota explica a construção elíptica sem suprir seu sentido nem definir um referente que o texto não determina com segurança.
lexical_decisions:
- source_word: ἐλέγξει / ἤλεγξεν
  choice: repreenderá / repreendeu
  rationale: O verbo ἐλέγχω pode expressar repreensão, exposição da culpa ou convencimento. “Repreender” conserva o caráter judicial e moral sem intensificá-lo para “condenar”.
- source_word: ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν
  choice: entre os eleitos das nações
  rationale: 'Mantém a construção e a ambiguidade do genitivo: os escolhidos provenientes das nações ou pertencentes a elas.'
- source_word: πορνείας
  choice: imoralidade sexual
  rationale: Expressão atual e abrangente para πορνεία, mais clara no português contemporâneo do que “fornicação”.
- source_word: ἐν μερίδι
  choice: na porção
  rationale: Preserva a imagem de parte, lote ou grupo atribuído, sem reduzir o sentido a uma única interpretação.
theological_decisions:
- issue: Identidade do sujeito de ἐλέγξει
  choice: “ele”, sem identificação adicional
  alternative: Explicitar “Deus” ou outra figura mencionada no contexto
  rationale: O verso grego traz o sujeito apenas de modo implícito; explicitá-lo resolveria uma referência que esta unidade textual não determina por si só.
- issue: Relação entre eleição e as nações
  choice: “os eleitos das nações”
  alternative: “os escolhidos dentre os gentios”
  rationale: A formulação escolhida conserva a ambiguidade de τῶν ἐθνῶν e evita definir se se trata especificamente de gentios ou de pessoas escolhidas dentre todas as nações.
- issue: Referente de “tornando-se”
  choice: Manter o particípio sem explicitar seu sujeito
  alternative: Identificar expressamente os irmãos enganados ou os midianitas como aqueles que se tornaram filhos
  rationale: A sintaxe e a transmissão textual permitem incerteza quanto ao referente; a tradução não deve resolver silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por “imoralidade sexual” em vez do mais arcaico “fornicação”. A estrutura foi mantida relativamente próxima do grego para preservar as ambiguidades de referente e a imagem de “porção”.
