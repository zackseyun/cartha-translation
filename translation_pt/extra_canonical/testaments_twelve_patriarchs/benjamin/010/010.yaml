review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha adequadamente a estrutura principal e preserva o sujeito implícito de ἐλέγξει. Contudo, no segmento entre colchetes, ela torna demasiado coerente um texto grego cuja construção é manifestamente defeituosa ou incompleta: γενέσθαι (“tornar-se”) não traz o complemento esperado. Convém sinalizar essa lacuna no próprio tratamento da nota, sem introduzir a ideia específica de “entregarem-se” como se estivesse expressa no grego.'
  naturalness: O português é claro, moderno e de registro apropriado. “Na porção dos que temem o Senhor” conserva uma formulação deliberadamente próxima do original. A redação revista mantém a legibilidade, mas assinala na nota que a fluência do trecho entre colchetes não elimina sua dificuldade textual.
  terminology: “Repreenderá”, “eleitos das nações”, “imoralidade sexual”, “idolatria” e “Senhor” são escolhas adequadas. “Foram separados de Deus” traduz de modo natural o passivo ἀπηλλοτριώθησαν sem sugerir indevidamente um afastamento voluntário.
  issues:
  - severity: medium
    issue: O trecho textual incerto foi harmonizado em excesso.
    rationale: “Para que se entregassem à imoralidade sexual” fornece um sentido específico que não está expresso no grego preservado, onde o infinitivo γενέσθαι parece carecer de complemento. A nota deve mencionar a provável lacuna/corrupção, e a tradução não deve apresentar essa reconstrução como segura.
  - severity: low
    issue: A tradução de ἀπηλλοτριώθησαν como “se afastassem de Deus” muda a voz passiva.
    rationale: O grego diz literalmente que “foram alienados/separados de Deus”. “Foram separados de Deus” conserva melhor essa forma, sem exigir a interpretação de que se afastaram por iniciativa própria.
  revised_text: E ele repreenderá Israel entre os eleitos das nações, assim como repreendeu Esaú entre os midianitas, os quais enganaram seus irmãos [para que se tornassem, por meio da imoralidade sexual e da idolatria, e fossem separados de Deus][a], tornando-se, assim, filhos na porção dos que temem o Senhor.
  revised_footnotes:
  - marker: a
    text: 'O texto grego entre colchetes é incerto e provavelmente está incompleto ou corrompido: depois de “para que se tornassem”, falta aparentemente um complemento. A relação sintática de “fossem separados de Deus” com o restante também não é totalmente clara.'
    reason: A edição delimita o segmento como problemático. A nota preserva a incerteza textual e sintática sem suprir um complemento ausente ou decidir com segurança o referente dos verbos no plural.
  revision_rationale: A revisão conserva a tradução do restante do versículo, mas deixa de transformar a construção textual defeituosa em uma afirmação interpretativamente definida. “Para que se tornassem” representa o infinitivo γενέσθαι, enquanto a nota informa a aparente lacuna; “fossem separados de Deus” mantém a voz passiva do grego.
