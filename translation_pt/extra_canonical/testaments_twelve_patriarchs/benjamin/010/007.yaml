base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/007.yaml
  text: Then we also will rise, each on our scepter, worshiping the king of the heavens, [the one who appeared on earth in the form of a man in humility; and as many as believed in him on the earth will rejoice with him].
translation:
  language: pt
  text: Então também nós ressuscitaremos, cada um sobre o nosso cetro[a], adorando o Rei dos céus — [aquele que apareceu na terra em forma humana, em humildade; e todos quantos crerem nele na terra se alegrarão com ele].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega é incomum e significa literalmente “cada um sobre o nosso cetro”. Talvez represente cada patriarca em sua dignidade régia, mas o texto não explicita essa interpretação.
    reason: Preservar a dificuldade genuína da construção sem deixar o leitor sem orientação.
  - marker: b
    text: As palavras entre colchetes também aparecem entre colchetes na edição grega consultada, indicando incerteza quanto à sua condição textual.
    reason: Sinalizar de modo transparente a delimitação editorial do trecho no texto-fonte.
lexical_decisions:
- source_word: ἀναστησόμεθα
  choice: ressuscitaremos
  rationale: No contexto escatológico, o futuro de ἀνίστημι indica levantar-se dentre os mortos, não apenas pôr-se de pé.
- source_word: ἕκαστος ἐπὶ σκήπτρον ἡμῶν
  choice: cada um sobre o nosso cetro
  rationale: Mantém a construção incomum e a imagem régia do grego sem substituí-la por uma interpretação como 'cada um governando sua tribo'.
- source_word: τὸν βασιλέα τῶν οὐρανῶν
  choice: o Rei dos céus
  rationale: Reproduz o título régio e o plural grego οὐρανῶν em português natural.
- source_word: ἐν μορφῇ ἀνθρώπου
  choice: em forma humana
  rationale: Comunica naturalmente a ideia de aparência ou condição humana sem acrescentar uma formulação dogmática posterior.
- source_word: ἐν ταπεινώσει
  choice: em humildade
  rationale: Preserva o substantivo abstrato e a possível tensão entre humildade voluntária e condição humilde.
- source_word: ὅσοι πιστεύσωσιν αὐτῷ
  choice: todos quantos crerem nele
  rationale: O subjuntivo aoristo em contexto futuro admite referência aos que vierem a crer; 'crer nele' é a formulação portuguesa natural para a relação expressa pelo dativo.
- source_word: χαρίσονται σὺν αὐτῷ
  choice: se alegrarão com ele
  rationale: Segue o sentido contextual e a tradição textual refletida na camada inglesa auditada; a forma transmitida χαρίσονται é incomum nesse sentido e pode refletir variação gráfica em relação a uma forma de χαίρω.
theological_decisions:
- issue: Identidade do 'Rei dos céus' e daquele que apareceu na terra
  choice: Conservar a aposição do texto sem inserir explicitamente um nome ou título cristológico.
  alternative: Identificá-lo expressamente como Jesus ou Cristo.
  rationale: O texto associa as duas descrições, mas não fornece aqui o nome; explicitá-lo eliminaria uma característica do testemunho textual.
- issue: Tempo da fé dos que se alegrarão com ele
  choice: Usar 'crerem', mantendo a orientação futura e geral do subjuntivo.
  alternative: Usar 'creram', como evento passado já concluído.
  rationale: O grego πιστεύσωσιν, em uma frase de futuro, favorece uma formulação prospectiva sem restringir o grupo a crentes de um período passado.
- issue: Revisão mais recente incompatível com o texto-fonte fornecido
  choice: Traduzir o grego apresentado, que fala da ressurreição, adoração e alegria dos que creem.
  alternative: Adotar a revisão que fala do julgamento das nações incrédulas.
  rationale: A revisão citada corresponde a outro conteúdo grego e contradiz tanto o texto-fonte desta unidade quanto a camada inglesa auditada; a prioridade editorial é a evidência na língua original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a imagem estranha do cetro e a humildade do personagem sem harmonização doutrinária. O travessão ajuda a marcar a aposição longa; os colchetes reproduzem os da edição-fonte.
