  text: Καὶ τότε²⁶ ὄψεσθε²⁷ Ἐνὼχ *καὶ Σήθ²⁸, καὶ²⁹ ᾿Αβραάμ, καὶ²⁹ Ἰσαὰκ καὶ Ἰακὼβ ἀνασταμένους³⁰ ἐκ δεξιῶν Γαὐτοῦ˥³¹ *ἐν ἀγαλλιάσει³².
