base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/006.yaml
  text: And then you will see Enoch and Seth and Abraham and Isaac and Jacob raised up at his right hand in rejoicing.
translation:
  language: pt
  text: E então vocês verão Enoque, Sete, Abraão, Isaque e Jacó ressuscitados à direita dele, em grande alegria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψεσθε
  choice: vocês verão
  rationale: Reproduz diretamente o futuro médio de ὁράω em português corrente e amplamente compreensível.
- source_word: ἀνασταμένους
  choice: ressuscitados
  rationale: No contexto escatológico e aplicado aos patriarcas, o particípio de ἀνίστημι indica que foram levantados dentre os mortos; “ressuscitados” comunica isso naturalmente.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: à direita dele
  rationale: Expressa a posição de honra indicada pela locução grega, sem explicitar uma identificação que o pronome não fornece neste versículo.
- source_word: ἐν ἀγαλλιάσει
  choice: em grande alegria
  rationale: ἀγαλλίασις denota alegria intensa ou exultação; “grande alegria” mantém a força do termo em linguagem natural.
theological_decisions:
- issue: Referente de αὐτοῦ (“dele”)
  choice: Manter o pronome “dele”
  alternative: Explicitar “à direita de Deus” ou “à direita do Senhor”
  rationale: O versículo isolado traz apenas o pronome; manter essa forma preserva a referência contextual e evita inserir uma identificação não expressa na linha grega.
- issue: Sentido de ἀνασταμένους
  choice: Traduzir como “ressuscitados”
  alternative: “levantados” ou “de pé”
  rationale: A leitura escatológica favorece ressurreição, conforme também reconhece a camada inglesa auditada, embora o verbo possa ter o sentido mais geral de levantar-se em outros contextos.
translation_notes:
  register: Português moderno, digno e acessível, com formas nominais bíblicas correntes no Brasil. A enumeração foi pontuada naturalmente, sem repetir todas as conjunções do grego. Não há marcadores de nota porque nenhuma nota foi necessária.
