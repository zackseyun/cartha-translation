source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: X. Ὅτε¹ δὲ *ἦν Ἰωσὴφ ἐν Αἰγύπτῳ², ἐπεθύμουν ἰδεῖν τὴν εἰδέαν³ αὐτοῦ Γκαὶ τὴν μόρφωσιν⁴ τῆς ὄψεως αὐτοῦ⁵. καὶ δι᾽ εὐχῶν Ἰακὼβ τοῦ πατρός μου⁶ εἶδον Γαὐτόν, ἐν ἡμέρᾳ γρηγορῶν, *καθ᾽ ὃ ἦν⁶ πᾶσα⁷ ἡ εἰδέα⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/001.yaml
  text: When Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, just as his whole appearance was.
translation:
  language: pt
  text: Quando José estava no Egito, eu desejava ver sua aparência e a forma de seu rosto. E, por meio das orações de Jacó, meu pai, eu o vi, acordado e em pleno dia, tal como ele era, em toda a sua aparência.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδέαν
  choice: aparência
  rationale: Expressa o aspecto visível de José sem restringir o termo a “imagem” ou “visão”.
- source_word: μόρφωσιν τῆς ὄψεως
  choice: a forma de seu rosto
  rationale: Reproduz a referência à configuração ou forma do semblante em português natural.
- source_word: δι᾽ εὐχῶν
  choice: por meio das orações
  rationale: Mantém o plural grego e a ideia de que as orações de Jacó foram o meio pelo qual a experiência ocorreu.
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: acordado e em pleno dia
  rationale: Deixa claro que o narrador não dormia e que a experiência aconteceu durante o dia.
- source_word: καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ
  choice: tal como ele era em toda a sua aparência
  rationale: Preserva a ideia de correspondência integral com a aparência de José, evitando a rigidez pouco natural de uma reprodução sintática literal.
theological_decisions:
- issue: Natureza da experiência de ver José à distância
  choice: eu o vi, acordado e em pleno dia
  alternative: eu o vi em uma visão
  rationale: O texto afirma que Benjamin viu José enquanto estava acordado, mas não emprega aqui um substantivo explícito para “visão”; a tradução preserva essa abertura sem definir o mecanismo da experiência.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente e sem acrescentar uma explicação sobrenatural que o grego não explicita.
