id: T12P.BEN.10.5
reference: Testament of Benjamin 10:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ πάντα δέδωκαν ἡμῖν εἰς κληρονομίαν¹⁹ *εἰπόντες· Φυλάξατε τὰς ἐντολὰς τοῦ Θεοῦ²⁰ ἕως ὅτου²¹ ἀποκαλύψει [Κύριος τὸ σωτήριον αὐτοῦ πᾶσι τοῖς ἔθνεσι].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/005.yaml
  text: For they gave us all these things as an inheritance, saying, ‘Keep the commandments of God until the time when [the Lord reveals his salvation to all the nations].’
translation:
  language: pt
  text: 'Pois eles nos deram todas essas coisas como herança, dizendo: “Guardem os mandamentos de Deus até que [o Senhor revele a sua salvação a todas as nações]”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκαν ἡμῖν εἰς κληρονομίαν
  choice: nos deram ... como herança
  rationale: Expressa naturalmente em português a ideia de transmitir algo como patrimônio herdado, preservando o perfeito grego pelo resultado vigente da dádiva.
- source_word: Φυλάξατε
  choice: Guardem
  rationale: Imperativo plural corrente e claro, mantendo o sentido de observar e cumprir os mandamentos.
- source_word: ἕως ὅτου
  choice: até que
  rationale: Correspondência idiomática direta, sem acrescentar a expressão temporal explicativa presente na consulta inglesa.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: a sua salvação
  rationale: Neste contexto, σωτήριον designa a salvação ou ação salvadora do Senhor; a formulação mantém o referente pronominal.
- source_word: πᾶσι τοῖς ἔθνεσι
  choice: a todas as nações
  rationale: Preserva a abrangência universal de πᾶσι e verte ἔθνεσι pela expressão bíblica portuguesa amplamente compreensível.
theological_decisions:
- issue: Agente da revelação e alcance da salvação no trecho entre colchetes
  choice: “o Senhor revele a sua salvação a todas as nações”
  alternative: “seja revelada a salvação dele a todos os povos”
  rationale: O texto fornecido traz Κύριος como sujeito explícito e σωτήριον αὐτοῦ como objeto; a tradução conserva tanto a ação do Senhor quanto o alcance universal, sem definir como cada nação participa dessa salvação.
- issue: Valor de ἕως ὅτου com ἀποκαλύψει
  choice: “até que ... revele”
  alternative: “até o tempo em que ... revelará”
  rationale: O subjuntivo português após “até que” transmite naturalmente a referência futura, sem transformar a frase em previsão mais enfática nem resolver além do grego a duração da obrigação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativo plural de uso brasileiro (“guardem”). Os colchetes foram preservados porque fazem parte do texto-fonte apresentado e sinalizam sua condição editorial. A revisão inglesa citada nos metadados pertence aparentemente a outra forma textual e não corresponde ao grego fornecido; por isso, a tradução segue diretamente o texto grego.
