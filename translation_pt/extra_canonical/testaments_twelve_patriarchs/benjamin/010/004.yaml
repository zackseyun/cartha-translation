source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ ὑμῖν ἀντὶ πάσης κληρονομίας καταλειμπάνω¹⁴. καὶ ὑμεῖς Γοὖν δότε αὐτὰ¹⁵ τοῖς τέκνοις ὑμῶν *εἰς κατάσχεσιν¹⁶ αἰώνιον· οὕτω¹⁷ Γγὰρ˥ ἐποίησεν¹⁸ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/004.yaml
  text: For these things I leave to you instead of every inheritance. And you, therefore, give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did.
translation:
  language: pt
  text: Pois deixo estas coisas a vocês em lugar de toda herança. E vocês, portanto, deem-nas a seus filhos como posse eterna; pois foi assim que Abraão, Isaque e Jacó fizeram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ πάσης κληρονομίας
  choice: em lugar de toda e qualquer herança
  rationale: Preserva o sentido substitutivo de ἀντί e expressa naturalmente a abrangência de πάσης em português.
- source_word: δότε αὐτά
  choice: transmiti-las
  rationale: Embora δίδωμι signifique literalmente “dar”, neste contexto de ensino legado aos descendentes, “transmitir” comunica com mais clareza a ação pretendida sem alterar o objeto.
- source_word: εἰς κατάσχεσιν αἰώνιον
  choice: como posse eterna
  rationale: Κατάσχεσις designa posse ou propriedade assegurada; a formulação concisa mantém a força duradoura de αἰώνιον.
- source_word: οὕτω ... ἐποίησεν
  choice: foi assim que fizeram
  rationale: Reproduz o valor modal de οὕτω e ajusta naturalmente o verbo ao sujeito composto em português.
theological_decisions:
- issue: Natureza da herança deixada aos filhos
  choice: Manter “estas coisas” e “posse eterna” sem explicitar se se trata de ensinamentos, virtudes ou mandamentos.
  alternative: Interpretar explicitamente como “estes ensinamentos” ou como uma herança espiritual.
  rationale: O grego usa os demonstrativos neutros ταῦτα e αὐτά sem nomear seu referente neste versículo; explicá-lo no texto eliminaria uma referência contextual legítima e poderia introduzir uma leitura teológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para legibilidade brasileira e ampla compreensão. A repetição causal de γάρ foi preservada por meio de “pois” no início e antes da frase final; “devem transmitir” torna idiomática a força imperativa no contexto de uma exortação testamentária.
