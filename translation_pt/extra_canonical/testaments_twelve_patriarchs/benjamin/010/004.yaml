    issue: «vocês também devem transmiti-las» acrescenta «também», modaliza o imperativo e substitui «dar» por «transmitir».
    rationale: O grego tem καὶ ὑμεῖς οὖν δότε αὐτά, isto é, «e vocês, portanto, deem-nas». Não há base segura para o aditivo «também»; «devem» transforma a ordem direta em obrigação enunciada, e «transmitir» é interpretativo, embora plausível no contexto.
  revised_text: Pois deixo estas coisas a vocês em lugar de toda herança. E vocês, portanto, deem-nas a seus filhos como posse eterna; pois foi assim que Abraão, Isaque e Jacó fizeram.
