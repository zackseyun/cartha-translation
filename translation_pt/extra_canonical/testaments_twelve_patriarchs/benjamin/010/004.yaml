revisions:
- from: Pois são estas coisas que deixo a vocês em lugar de toda e qualquer herança. Portanto, vocês também devem transmiti-las a seus filhos como posse eterna, pois foi assim que fizeram Abraão, Isaque e Jacó.
  to: Pois deixo estas coisas a vocês em lugar de toda herança. E vocês, portanto, deem-nas a seus filhos como posse eterna; pois foi assim que Abraão, Isaque e Jacó fizeram.
  rationale: A revisão restaura a força do imperativo δότε com «deem-nas», traduz οὖν por «portanto» sem acrescentar «também» e conserva o demonstrativo não especificado, a substituição de ἀντί, a «posse eterna» e a formulação modal final.
  reviewer_model: gpt-5.6-terra
