- source_word: Γινώσκετε
  choice: Saibam
  rationale: Imperativo presente com sentido de tomar conhecimento ou reconhecer; “saibam” é natural e preserva a força exortativa.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Correspondência direta e idiomática para a forma afetuosa de tratamento.
- source_word: ἀποθνῄσκω
  choice: estou morrendo
  rationale: Preserva o aspecto presente do grego e a declaração de morte iminente, sem convertê-la simplesmente em futuro.
