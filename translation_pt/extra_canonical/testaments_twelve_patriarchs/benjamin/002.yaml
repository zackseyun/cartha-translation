lexical_decisions:
- source_word: ἐγνώρισέν με
  choice: me reconheceu
  rationale: No contexto do reencontro no Egito, o verbo indica identificação pessoal. “Reconheceu” é natural e não acrescenta a ideia reflexiva de “deu-se a conhecer”.
- source_word: ἔφυραν τὸν χιτῶνά σου αἵματι
  choice: mancharam tua túnica de sangue
  rationale: Embora φύρω possa significar misturar ou besuntar, aplicado a sangue sobre uma peça de roupa comunica que ela foi marcada ou impregnada. “Mancharam” é vívido e corrente.
- source_word: χιτών
  choice: túnica
  rationale: Designa uma peça concreta de vestuário e corresponde ao termo tradicional sem sugerir um casaco moderno.
- source_word: περίζωμα
  choice: tanga
  rationale: Refere-se a um pano usado ao redor dos quadris. “Tanga” é claro em português moderno e adequado ao objeto descrito.
- source_word: φραγγελλώσαντες
  choice: depois de me açoitarem
  rationale: O particípio descreve um espancamento físico. “Açoitar” preserva a violência do ato e mantém um registro bíblico ainda compreensível.
- source_word: τρέχειν
  choice: que eu corresse
  rationale: O infinitivo dependente do verbo de fala expressa uma ordem; em português, a oração com subjuntivo é a forma mais natural.
- source_word: ῥάβδῳ μαστίζων με
  choice: me açoitava com uma vara
  rationale: A tradução conserva tanto o instrumento quanto a ação continuada do particípio.
- source_word: ὑπήντησεν αὐτῷ λέων
  choice: um leão veio ao encontro dele
  rationale: Mantém a simplicidade e a vivacidade da construção narrativa grega.
- source_word: ἀνεῖλεν αὐτόν
  choice: o matou
  rationale: Expressa de modo direto e atual o sentido do verbo, sem arcaísmo.
- source_word: μέτοχοι
  choice: companheiros
  rationale: No contexto, são os outros integrantes do grupo ao qual pertencia o agressor.
- source_word: ἐν ἀνέσει με κατέσχεν
  choice: passaram a me manter sob custódia com menos rigor
  rationale: A construção transmitida é irregular, mas ἄνεσις sugere alívio ou relaxamento de severidade, e κατέχω, retenção ou custódia. A nota registra as leituras divergentes.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: o que nossos irmãos haviam feito
  rationale: Transmite os atos concretos e seu peso moral em português natural, sem tornar a frase excessivamente solene.
- source_word: ἐξηγησάμην
  choice: expliquei
  rationale: O verbo indica que José relatou ou expôs a Benjamim a versão que os irmãos deveriam repetir.
- source_word: αἱ ἔννοιαι γένωνται ἐν ὑμῖν τοιαῦται
  choice: tenham vocês também essa mesma disposição
  rationale: ἔννοιαι pode indicar pensamentos, intenção ou disposição interior. “Disposição” comunica aqui uma atitude deliberada sem reduzir a expressão a ideias passageiras.
theological_decisions:
- issue: Ocultação da culpa dos irmãos por José
  choice: José procura esconder de Benjamim o que os irmãos fizeram e pede que eles não levem o assunto ao coração do pai.
  alternative: Entender a passagem apenas como relato factual dos mercadores, sem destacar a intenção de José.
  rationale: A oração ἤθελεν γὰρ κρύπτειν ἀπ’ ἐμοῦ τὰ ἔργα τῶν ἀδελφῶν ἡμῶν declara expressamente a intenção de ocultar os atos dos irmãos. A tradução mantém essa tensão moral sem qualificá-la como aprovação ou condenação.
- issue: Mudança do plural para o singular em 2:5
  choice: Identificar o sujeito singular como José no texto principal e registrar a irregularidade em nota.
  alternative: Reproduzir literalmente “eles não mentiram... ele queria”, deixando a mudança abrupta sem explicação.
  rationale: O contexto subsequente nomeia a intenção daquele que chama os irmãos e lhes dá instruções. A identificação torna o português inteligível, enquanto a nota preserva a incerteza do texto transmitido.
- issue: Estado do final do capítulo
  choice: 'Traduzir a frase final completa conforme o grego fornecido: “e que essas palavras não cheguem ao coração de meu pai”.'
  alternative: Encerrar de modo suspenso, como em testemunhos ou reconstruções nos quais a frase aparece truncada.
  rationale: O texto grego apresentado contém a oração final completa. A primazia da evidência original fornecida exige traduzi-la, em vez de seguir o encerramento incompleto da camada inglesa.
- issue: Destino de José após a morte do agressor
  choice: Seguir a leitura grega apresentada, entendendo que os companheiros o mantiveram sob custódia com menos rigor.
  alternative: Dizer que o venderam a outros comerciantes do grupo ou novamente aos ismaelitas.
  rationale: A leitura principal procura representar ἐν ἀνέσει με κατέσχεν, embora sua gramática esteja corrompida. As tradições divergentes sobre uma venda são apresentadas em nota, sem serem incorporadas silenciosamente ao texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” na fala dirigida ao grupo, evitando formas excessivamente arcaicas. Termos narrativos concretos como “túnica”, “tanga”, “vara” e “leão” foram mantidos. Onde o grego transmitido é irregular, o texto principal oferece uma leitura inteligível, e as notas preservam as alternativas e a incerteza.
