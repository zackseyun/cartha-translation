  text: '1 And when we went down into Egypt[a], Joseph my brother recognized me and said to me, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”

    2 And he said to me, “Yes, brother. For when the Ishmaelites took me, one of them stripped me of my tunic and gave me a loincloth; and after flogging me, he told me to run.

    3 And while he was going away to hide my garment, a lion met him and killed him.

    4 So his companions, being afraid, sold me to others of their company.

    5 Thus Joseph did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.

    6 And he called his brothers to himself and said,

    7 ‘Do not tell my father what you did to me, but speak in this way, just as I explained it to Benjamin.

    8 And let such thoughts be in you[b][c][d], and let not the words come…’'
translation:
  language: pt
  text: '## Testamento de Benjamim 2


    **1** Quando cheguei ao Egito, meu irmão me reconheceu e me disse: “Eles mancharam tua túnica de sangue e disseram: ‘Vejam se esta é a túnica.’”[a]


    **2** E ele me disse: “Sim, meu irmão. Quando me tiraram a túnica, entregaram-me aos ismaelitas. Deram-me uma faixa para a cintura e, depois de me açoitarem, mandaram que eu corresse.


    **3** Um deles me açoitava com uma vara, quando um leão veio ao encontro dele e o matou.[b]


    **4** Então os companheiros dele, tomados de medo, passaram a me manter sob custódia com menos rigor.[c]


    **5** Eles não mentiram ao me contar essas coisas, pois ele queria esconder de mim o que nossos irmãos haviam feito.[d]


    **6** Depois, chamou seus irmãos e lhes disse:


    **7** “Não contem a meu pai o que vocês fizeram comigo, mas digam assim, como expliquei a Benjamim.


    **8** Que vocês tenham tais pensamentos, e que essas palavras não cheguem ao coração de meu pai.”


    ### Notas


    [a] Alguns testemunhos trazem uma formulação mais explícita: “Eles a enviaram e disseram: ‘Vê se esta é a túnica de teu filho.’”


    [b] Outros testemunhos formulam o episódio de maneira diferente, mas relatam que um homem envolvido no tratamento dado a José foi morto por um animal selvagem, geralmente identificado como um leão.


    [c] O texto grego desta frase é gramaticalmente irregular e sua transmissão é incerta. Outros testemunhos dizem que os companheiros venderam José a outros mercadores do grupo ou aos ismaelitas.


    [d] O texto grego preservado começa a frase no plural — “eles não mentiram” — e depois passa ao singular — “ele queria esconder”. O contexto torna provável que o singular se refira a José, mas a tradução mantém a mudança de sujeito do texto transmitido.'
  philosophy: optimal-equivalence
