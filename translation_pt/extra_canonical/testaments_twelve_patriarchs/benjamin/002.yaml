review_pass:
  verdict: revise
  source_fidelity: A revisão é necessária sobretudo em 2:5 e 2:7. Em 2:5, o grego transmitido apresenta deliberadamente ou por corrupção uma passagem do plural (“eles não mentiram”) ao singular (“ele queria”); atribuir ambos diretamente a José elimina essa irregularidade e excede a evidência. Em 2:7, “apenas” não tem correspondente no grego, e “digam assim” deve ser preservado. O restante representa bem o texto-base, inclusive a leitura incerta de 2:4 e o desfecho completo de 2:8.
  naturalness: 'O português é claro, moderno e apropriado. Foram feitos pequenos ajustes para maior precisão sem perda de fluência: “Vejam se” soa mais idiomático no discurso citado; “uma faixa para a cintura” evita a conotação contemporânea marcante de “tanga”; e “Que vocês tenham tais pensamentos” expressa naturalmente a exortação de 2:8.'
  terminology: “Túnica”, “ismaelitas”, “açoitar”, “vara”, “leão” e “companheiros” são adequados. “Faixa para a cintura” traduz περίζωμα de modo concreto e internacionalmente compreensível. A referência a José em 2:5 é mantida como provável apenas na nota, não imposta na redação principal.
  issues:
  - severity: high
    issue: 2:5 substitui o plural inicial do grego por “José não mentiu”.
    rationale: O texto fornecido lê οὐκ ἐψεύσαντο (“eles não mentiram”) e só então passa a ἤθελεν (“ele queria”). A tradução deve conservar a mudança de sujeito, com nota explicativa, em vez de harmonizá-la no texto principal.
  - severity: medium
    issue: 2:7 acrescenta “apenas” e enfraquece “digam assim”.
    rationale: μη... ἀλλʼ οὕτως λέξατε significa “não digam..., mas digam assim”. “Apenas” introduz uma restrição que não está expressa no texto.
  - severity: low
    issue: A nota [b] afirma que todos os testemunhos conservam uma circunstância específica ligada à túnica.
    rationale: A formulação inglesa de controle apenas indica que há versões diferentes do evento. A nota deve descrever a variação sem afirmar um detalhe comum além do que a evidência apresentada permite.
