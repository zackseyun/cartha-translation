  text: '7[a]. And he purifies his mind so as not to be condemned by men, and likewise by God. In the same way, the works of Beliar also are twofold, and they have no simplicity in them.


    Therefore, my children[b], I tell you: flee the evil of Beliar, because he gives a sword to those who obey him. And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.


    Because of this, Cain was handed over to seven acts of vengeance. For in one hundred years the Lord brought one plague upon him after another[c], and in the nine-hundredth year he was made desolate.'
translation:
  language: pt
  text: '1. Por isso, meus filhos, eu lhes digo: fujam da maldade de Beliar[a], pois ele dá uma espada aos que lhe obedecem. 2. A espada é mãe de sete males. Primeiro, a mente concebe por meio de Beliar; e estes são os males: o primeiro é a inveja; o segundo, a destruição; o terceiro, a aflição; o quarto, o cativeiro[b]; o quinto, a privação; o sexto, a agitação; o sétimo, a desolação.


    3. Por isso, também Caim foi entregue por Deus a sete atos de vingança. Pois, a cada cem anos, o Senhor lhe infligia um golpe. 4. Ele sofre por duzentos anos e, no noningentésimo ano, é deixado em desolação[c]. Por causa de Abel, seu irmão, Caim era punido com todos esses males; Lameque, porém, setenta vezes sete[d]. 5. Pois, até o fim desta era, os que se assemelham a Caim em inveja e em semelhante ódio contra o irmão serão punidos por juízo[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar é a forma do nome neste testemunho grego; muitos leitores conhecem a forma Belial.
    reason: lexical_alternative
  - marker: b
    text: A palavra grega correspondente ao quarto mal é textualmente incerta. Alguns testemunhos apoiam “cativeiro”; a forma da linha impressa pode indicar “saque” ou estar corrompida.
    reason: textual_variant
  - marker: c
    text: 'A cronologia é difícil: o texto menciona um golpe a cada cem anos, sofrimento por duzentos anos e desolação no noningentésimo ano. Os números foram mantidos sem harmonização.'
    reason: textual_difficulty
  - marker: d
    text: 'A cláusula grega sobre Lameque é elíptica: literalmente, “mas Lameque, setenta vezes sete”. O verbo “era punido” é retomado da cláusula anterior.'
    reason: translation_clarity
  - marker: e
    text: A expressão traduzida por “até o fim desta era” também pode ser entendida como “para sempre” ou “ao longo da era”.
    reason: semantic_ambiguity
lexical_decisions:
- source_word: κακία
  choice: maldade
  rationale: Expressa o mal moral do qual os filhos devem fugir, em linguagem corrente e digna.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Mantém a forma nominal do testemunho grego, sem normalizá-la para a forma bíblica mais conhecida, Belial.
- source_word: μάχαιρα
  choice: espada
  rationale: Preserva a imagem grave de uma arma que dá origem à sequência de males.
- source_word: πειθομένοις
  choice: aos que lhe obedecem
  rationale: No contexto exortativo, o particípio indica adesão prática à influência de Beliar, embora também possa significar os que se deixam persuadir por ele.
- source_word: διάνοια
  choice: mente
  rationale: Designa a faculdade interior em que se formam as intenções morais.
- source_word: συλλαμβάνει
  choice: concebe
  rationale: Conserva a metáfora de geração introduzida pela espada como mãe dos sete males.
- source_word: φθόνος
  choice: inveja
  rationale: É o equivalente moral mais direto para o primeiro vício da lista.
- source_word: ἀπώλεια
  choice: destruição
  rationale: Comunica ruína sem impor o sentido teológico técnico de perdição eterna.
- source_word: θλῖψις
  choice: aflição
  rationale: Mantém o sentido de sofrimento opressivo e o registro solene da enumeração.
- source_word: αἰχμαλωσία / θεηλασία
  choice: cativeiro
  rationale: A quarta palavra está textualmente instável; 'cativeiro' segue a leitura paralela αἰχμαλωσία e se ajusta à série de calamidades.
- source_word: ἔνδεια
  choice: privação
  rationale: Abrange falta e necessidade, sendo mais natural na lista do que uma formulação abstrata como indigência.
- source_word: ταραχή
  choice: agitação
  rationale: Preserva a ideia de perturbação e tumulto sem especificar se são interiores ou exteriores.
- source_word: ἐρήμωσις
  choice: desolação
  rationale: Mantém a correspondência com o verbo ἐρημοῦται no versículo 4 e a força devastadora do termo.
- source_word: μισαδελφία
  choice: ódio contra o irmão
  rationale: Explicita em português natural o composto grego que designa hostilidade fraterna.
- source_word: ἕως τοῦ αἰῶνος
  choice: até o fim desta era
  rationale: Preserva a referência temporal escatológica sem transformar automaticamente a expressão em 'para sempre'.
theological_decisions:
- issue: Agência de Beliar e responsabilidade de seus seguidores
  choice: Beliar dá a espada 'aos que lhe obedecem'
  alternative: Beliar dá a espada 'aos que são persuadidos por ele'
  rationale: A tradução conserva tanto a influência do agente maligno quanto a adesão moral humana, sem formular uma teoria adicional sobre compulsão ou livre-arbítrio.
- issue: Cronologia e punições de Caim
  choice: Manter os períodos de cem, duzentos e novecentos anos exatamente como aparecem
  alternative: Harmonizar a cronologia com Gênesis ou generalizar os números
  rationale: O testemunho apresenta uma cronologia áspera e difícil; os detalhes numéricos são preservados, em vez de corrigidos segundo outra fonte.
- issue: Comparação entre Caim e Lameque
  choice: Traduzir a fórmula elíptica como ambos sendo julgados, Caim 'com todos esses males' e Lameque 'setenta vezes sete'
  alternative: Suprimir o verbo subentendido na cláusula sobre Lameque
  rationale: A repetição de 'foi julgado' torna inteligível a construção elíptica sem decidir a natureza exata ou a duração do juízo.
- issue: Duração do castigo dos imitadores de Caim
  choice: '''até o fim desta era'''
  alternative: '''para sempre'' ou ''ao longo da era'''
  rationale: A expressão grega admite mais de uma nuance temporal; a redação escolhida conserva uma leitura delimitada pela era sem afirmar categoricamente eternidade ou mera duração histórica.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A enumeração foi mantida ritmada, e as construções difíceis foram esclarecidas apenas onde a sintaxe portuguesa exigia, com notas para as incertezas textuais e temporais.
