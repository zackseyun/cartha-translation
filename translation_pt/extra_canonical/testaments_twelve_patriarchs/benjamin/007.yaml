  source_fidelity: A tradução preserva bem a exortação, a lista dos sete males, a forma Beliar e os números difíceis. Contudo, a numeração inicial não corresponde ao texto grego, que começa em 7.1, e alguns pontos da sequência punitiva de Caim e da cláusula final podem refletir mais diretamente o grego.
  naturalness: O português é geralmente claro e de registro apropriado. Ajustes como “um golpe” e “por juízo” deixam o texto mais idiomático e próximo da formulação fonte.
  terminology: “Beliar”, “espada”, “mente”, “inveja”, “cativeiro” e “desolação” são escolhas adequadas. “Juízo” traduz κρίσις de modo mais direto que “julgamento”, e “golpe” preserva melhor πληγή no contexto.
  issues:
