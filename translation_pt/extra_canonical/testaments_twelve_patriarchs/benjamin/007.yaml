  - severity: medium
    issue: Em 7.3, “uma praga” não explicita o numeral μίαν de “um golpe”, e o verbo pode conservar melhor a ideia de ação repetida do Senhor.
    rationale: “A cada cem anos, o Senhor lhe infligia um golpe” mantém tanto a unidade do castigo quanto a periodicidade expressa no grego.
  - severity: medium
    issue: A expressão final “serão castigados mediante julgamento” é pouco natural e não representa da forma mais direta o dativo κρίσει.
    rationale: “Serão punidos por juízo” é natural, conserva a ambiguidade sobre o agente e traduz diretamente a construção.
