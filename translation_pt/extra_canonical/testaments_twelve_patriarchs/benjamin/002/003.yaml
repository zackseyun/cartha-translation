  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/003.yaml
  text: And one of them, while he was striking me with a rod, was met by a lion, and the lion killed him.
translation:
  language: pt
  text: E, enquanto um deles me açoitava com uma vara, um leão veio ao encontro dele e o matou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδῳ μαστίζων
  choice: me açoitava com uma vara
  rationale: Expressa tanto o instrumento (ῥάβδῳ) como a ação repetida ou em curso do particípio presente μαστίζων, em português natural e digno.
- source_word: ὑπήντησεν αὐτῷ λέων
  choice: deparou-se com um leão
  rationale: Reproduz o encontro inesperado indicado pelo verbo e mantém o leão como o agente que surge diante do homem.
- source_word: ἀνεῖλεν αὐτόν
  choice: que o matou
  rationale: Traduz diretamente o sentido de eliminar ou matar; o pronome retoma sem ambiguidade o agressor.
