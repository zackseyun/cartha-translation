base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/001.yaml
  text: And when I went into Egypt, my brother recognized me and said to me, “They smeared your tunic with blood,” they said. “See whether this is the tunic.”
translation:
  language: pt
  text: 'Quando cheguei ao Egito, meu irmão me reconheceu e me disse: “Eles mancharam sua túnica com sangue”, disseram.[a] “Verifique se esta é a túnica.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma grega traduzida como “disseram” também pode significar “eu disse”.
    reason: Preserva uma ambiguidade real da forma verbal εἶπον, em vez de ocultá-la.
lexical_decisions:
- source_word: ἦλθον εἰς Αἴγυπτον
  choice: cheguei ao Egito
  rationale: O verbo está na primeira pessoa do singular; “cheguei” expressa naturalmente em português o movimento de ir e entrar no Egito, sem acrescentar a ideia de “descer”.
- source_word: ἐγνώρισέν με
  choice: me reconheceu
  rationale: Mantém o sentido direto de identificar ou reconhecer uma pessoa já conhecida.
- source_word: ὁ ἀδελφός μου
  choice: meu irmão
  rationale: Preserva o texto grego sem inserir o nome José.
- source_word: ἔφυραν
  choice: mancharam
  rationale: No contexto de uma túnica e sangue, comunica o ato de impregnar ou sujar; evita sugerir apenas uma aplicação superficial.
- source_word: χιτών
  choice: túnica
  rationale: Equivalente corrente e historicamente apropriado para a peça de roupa mencionada.
- source_word: Ἐπίγνωθι
  choice: Verifique
  rationale: O imperativo pede identificação ou confirmação, não apenas o ato visual de olhar.
theological_decisions:
- issue: Identidade do irmão
  choice: meu irmão
  alternative: José, meu irmão
  rationale: O grego não nomeia o irmão; a identificação contextual não deve ser inserida no texto.
- issue: Identificação da túnica
  choice: esta é a túnica
  alternative: esta é a túnica de seu filho
  rationale: O grego traz apenas “a túnica”; “de seu filho” seria uma expansão derivada do relato de Gênesis.
- issue: Sujeito de εἶπον
  choice: disseram
  alternative: eu disse
  rationale: A forma εἶπον pode ser primeira pessoa do singular ou terceira do plural. “Disseram” produz a leitura contextual refletida pela camada inglesa auditada, mas a ambiguidade morfológica é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “disse/disseram” foi mantida porque reflete a estrutura difícil do texto grego, e a ambiguidade verbal foi explicitada em nota.
