source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ λέγει μοι· Ναί, ἀδελφέ¹⁶. καὶ ὅτε¹⁷ ἐξέδυσάν με τὸν χιτῶνά μου δέδωκάν με τοῖς Ἰσμαηλίταις· καὶ δέδωκάν μοι περίζωμα, καὶ φραγγελλώσαντες εἰπόν μοι τρέχειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/002.yaml
  text: And he said to me, “Yes, brother. And when they stripped me of my tunic they gave me to the Ishmaelites; and they gave me a loincloth, and after flogging me they told me to run.”
translation:
  language: pt
  text: 'E ele me disse: “Sim, irmão. E, quando me despiram da minha túnica, entregaram-me aos ismaelitas; deram-me um pano para cobrir a cintura e, depois de me açoitarem, mandaram-me correr.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: túnica
  rationale: Equivalente corrente e historicamente adequado para a peça de roupa mencionada.
- source_word: περίζωμα
  choice: tanga
  rationale: Designa de modo claro uma peça simples que cobre a cintura e as partes íntimas; evita o termo menos corrente “cendal”.
- source_word: φραγγελλώσαντες
  choice: depois de me açoitarem
  rationale: Expressa naturalmente o particípio aoristo e preserva a ação de flagelar antes da ordem para correr.
- source_word: τρέχειν
  choice: correr
  rationale: Tradução direta do infinitivo, dependente de “mandaram-me”.
theological_decisions: []
translation_notes:
  register: 'Português moderno, digno e acessível, com sintaxe natural e preservação do sujeito plural indeterminado do grego. A sequência e a agência foram mantidas: primeiro o narrador é despido, depois entregue aos ismaelitas, recebe uma peça para a cintura, é açoitado e recebe ordem de correr.'
