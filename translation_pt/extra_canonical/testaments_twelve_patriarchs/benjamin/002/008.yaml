lexical_decisions:
- source_word: ἔννοιαι
  choice: pensamentos
  rationale: Equivalente natural e direto para ideias ou disposições concebidas interiormente, preservando a formulação ampla do grego.
- source_word: γένωνται ἐν ὑμῖν
  choice: estejam em vocês
  rationale: Reproduz de modo claro o sentido de surgirem ou se encontrarem no interior dos destinatários, sem tornar a expressão excessivamente técnica.
- source_word: οἱ λόγοι οὗτοι
  choice: estas palavras
  rationale: Neste contexto, λόγοι se refere ao conteúdo verbal anteriormente expresso; “palavras” mantém a correspondência formal e o sentido natural.
- source_word: εἰς καρδίαν
  choice: no coração
  rationale: Preserva a imagem antropológica do grego, na qual o coração é o centro interior da percepção e reflexão.
