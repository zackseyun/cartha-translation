  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/007.yaml
  text: Do not tell my father what you did to me, but speak in this way, just as I explained to Benjamin.
translation:
  language: pt
  text: Não contem ao meu pai o que vocês fizeram comigo; mas digam assim, conforme expliquei a Benjamim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ λέγετε
  choice: Não contem
  rationale: O presente imperativo negado é vertido como uma proibição natural em português, dirigida a mais de uma pessoa.
- source_word: ἃ ἐποιήσατέ μοι
  choice: o que vocês fizeram comigo
  rationale: Reproduz diretamente a oração relativa e expressa μοι de modo idiomático, sem suavizar a ação.
- source_word: ἀλλʼ οὕτως λέξατε
  choice: digam apenas isto
  rationale: Mantém o contraste introduzido por ἀλλά e comunica οὕτως como a maneira ou formulação que deve ser dita; “apenas” explicita naturalmente a restrição contrastiva, sem acrescentar conteúdo narrativo.
- source_word: καθὼς ἐξηγησάμην τῷ Βενιαμίν
  choice: conforme expliquei a Benjamim
  rationale: Preserva a ausência de objeto expresso em grego e evita acrescentar “isso” ou “a situação”.
