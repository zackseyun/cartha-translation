source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ οὐκ ἐψεύσαντο αὐτοὶ ταῦτα λέγοντες· ἤθελεν γὰρ κρύπτειν ἀπʼ ἐμοῦ *τὰ ἔργα τῶν ἀδελφῶν ἡμῶν³¹
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/005.yaml
  text: And they themselves did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.
translation:
  language: pt
  text: E eles mesmos não mentiram ao dizer essas coisas, pois ele queria esconder de mim os atos de nossos irmãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐψεύσαντο
  choice: não mentiram
  rationale: Reproduz diretamente o aoristo médio de ψεύδομαι e mantém o sujeito plural indicado pelo verbo.
- source_word: αὐτοὶ
  choice: eles mesmos
  rationale: Preserva a ênfase explícita do pronome grego e evita atribuir a ação a José, como ocorria numa redação inglesa anterior.
- source_word: τὰ ἔργα
  choice: os atos
  rationale: Expressa de modo natural o sentido amplo de feitos ou ações neste contexto.
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: de nossos irmãos
  rationale: Mantém o vínculo familiar e a primeira pessoa do plural do original.
theological_decisions:
- issue: Identidade dos sujeitos de “não mentiram” e “queria esconder”
  choice: Manter, respectivamente, o plural “eles mesmos” e o singular “ele”, sem identificar os referentes no próprio versículo.
  alternative: Explicitar nomes ou harmonizar os dois verbos sob um único sujeito.
  rationale: A morfologia grega distingue claramente o sujeito plural de ἐψεύσαντο do sujeito singular implícito de ἤθελεν; explicitar referentes resolveria uma ambiguidade contextual que o texto preserva.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do grego sem artificialidade. A conjunção inicial foi vertida por “E”, e γάρ por “pois”, preservando a relação explicativa.
