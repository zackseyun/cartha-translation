  text: E assim, os companheiros dele, com medo, †mantiveram-me à vontade†.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega assinalada parece estar corrompida, e seu sentido é incerto. Alguns testemunhos da tradição textual trazem aqui uma referência à venda aos ismaelitas.
    reason: A cruz crítica da edição exige que a incerteza seja mantida no texto e explicada em nota; a leitura tradicional alternativa é informada sem ser introduzida silenciosamente na tradução.
lexical_decisions:
- source_word: οἱ μέτοχοι αὐτοῦ
  choice: os companheiros dele
  rationale: Traduz naturalmente a ideia de pessoas associadas a ele, sem especificar uma relação que o grego não explicita.
- source_word: φοβηθέντες
  choice: tomados de medo
  rationale: Reproduz o particípio aoristo com uma formulação corrente e digna, preservando a relação circunstancial.
- source_word: ἐν ἀνέσει με κατέσχεν
  choice: mantiveram-me em descanso
  rationale: Tradução deliberadamente literal de uma sequência textual assinalada como corrompida; evita substituir o texto transmitido por uma conjectura não indicada no grego fornecido.
