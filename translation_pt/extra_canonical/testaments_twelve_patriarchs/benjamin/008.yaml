revisions:
- from: '**Testamento de Benjamim 8**


    **1.** Vocês, porém, meus filhos, fujam da maldade, da inveja e do ódio entre irmãos; apeguem-se à bondade e ao amor.


    **2.** Pois a mente pura não se contamina em meio ao esterco e à lama; antes, esfria ambos e afasta o mau cheiro.[a] Assim também a mente pura, embora cercada pelas impurezas da terra, antes edifica,[b] mas ela mesma não se contamina.'
  to: '**Testamento de Benjamim 8**


    **1.** Vocês, porém, meus filhos, fujam da maldade, da inveja e do ódio entre irmãos; apeguem-se à bondade e ao amor.


    **2.** Pois a mente pura não fica contaminada por esterco e lama; antes, esfria ambos e afasta o mau cheiro.[a] Assim também a mente pura, embora cercada pelas impurezas da terra, antes edifica,[b] mas ela mesma não se contamina.'
  rationale: 'A revisão é mínima: substitui «não se contamina em meio ao» por «não fica contaminada por», para maior naturalidade e uma correspondência lexical mais clara. Mantêm-se integralmente a ambiguidade e a estranheza da comparação, a nota sobre ψύγει, a leitura crítica «edifica» e sua nota. Não se importa conteúdo do texto inglês, pois ele não corresponde aos versículos gregos apresentados.'
