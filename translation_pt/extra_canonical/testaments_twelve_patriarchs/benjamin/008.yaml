base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008.yaml
  text: '1[a]. Therefore, if you also walk in holiness according to the Lord’s commands, you will dwell with me in safety, and all Israel will be gathered to the Lord.


    2. And I will no longer be called a ravening wolf because of your ravaging, but a worker of the Lord, distributing food to those who do what is good.


    3. And there will arise in the latter times one beloved of the Lord, from the tribe of Judah and Levi, who will accomplish the good pleasure of God with a new understanding for all the nations.


    4. His presence is in the mouth of all, and he will be chosen forever by the Lord, and through him the knowledge of the Lord will be given on the earth in portions of joy; and through him Israel will be enlightened.


    5. Then he will enter into the first temple, and there the Lord will be abused, and he will be lifted up upon a tree.


    6[b]. And the veil of the temple will be torn, and the Spirit of God will pass on to the nations like fire poured out.


    7. And he will ascend from Hades and will pass from earth into heaven.


    8. And I know how lowly he will be on earth, and how glorious in heaven.


    9. Now when Joseph was in Egypt, I longed to see his figure and appearance; and through the prayers of Jacob my father I saw him, while awake, that a spotless and holy virgin was giving birth to a lamb,


    10. and on its left side there was as it were a lion; and all the beasts rushed against him, and the lamb overcame them and destroyed them, and trampled them underfoot.


    11. And because of him the angels and men rejoiced, and all the land.


    12. These things will happen in their proper times. Therefore, my children, when you see that all these things have happened in Israel, know that the kingdom of the Lord is near.


    13. Then flee from every lawless deed and from the works of Beliar, and cling to what is good and to the law of the Lord.


    14. And bury me near my fathers.


    15. And he finished his commands, and said, “I am going to sleep with my fathers.”


    16. And he stretched out his feet and died in a beautiful and good old age.


    17. And each of his sons did as he had commanded them, and they put him in a coffin and kept him in Egypt until the day of the exodus.


    18. And when the sons of Israel went up from Egypt, they carried up the bones of Benjamin also[c], and buried them in Hebron at the right side of Abraham and Isaac and Jacob.'
translation:
  language: pt
  text: '**Testamento de Benjamim 8**


    **1.** Vocês, porém, meus filhos, fujam da maldade, da inveja e do ódio entre irmãos; apeguem-se à bondade e ao amor.


    **2.** Pois a mente pura não fica contaminada por esterco e lama; antes, esfria ambos e afasta o mau cheiro.[a] Assim também a mente pura, embora cercada pelas impurezas da terra, antes edifica,[b] mas ela mesma não se contamina.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação grega desta comparação é obscura. O verbo traduzido por “esfria” significa literalmente “torna frio” ou “refresca”; pode haver corrupção textual.
    reason: textual_variant
  - marker: b
    text: “Edifica” traduz a leitura grega da edição, mas a própria edição marca essa palavra como textualmente duvidosa; o sentido original da frase é incerto.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπόδρατε
  choice: fujam
  rationale: Preserva a força do imperativo, que exige afastamento decidido, em português natural.
- source_word: μισαδελφία
  choice: ódio entre irmãos
  rationale: Expressa diretamente o composto grego, sem limitar indevidamente a referência apenas a irmãos biológicos.
- source_word: προσκολλᾶσθε
  choice: apeguem-se
  rationale: Mantém a imagem de adesão firme e contínua à bondade e ao amor.
- source_word: καθαρὸς νοῦς
  choice: mente pura
  rationale: Conserva tanto a dimensão moral de καθαρός quanto o sentido abrangente de νοῦς como mente ou disposição interior.
- source_word: μιασμός / μιαίνεται
  choice: impurezas / se contamina
  rationale: Reproduz em português a relação lexical entre o substantivo e o verbo, com linguagem clara e digna.
- source_word: κόπρος καὶ βόρβορος
  choice: esterco e lama
  rationale: Mantém as imagens concretas e desagradáveis do grego; 'lama' comunica βόρβορος com naturalidade, embora o termo também possa indicar lodo ou imundície.
- source_word: ψύγει
  choice: esfria
  rationale: É a equivalência lexical direta, embora a lógica da imagem no contexto seja obscura; a incerteza é explicitada em nota.
- source_word: οἰκοδομεῖ
  choice: edifica
  rationale: Traduz literalmente a leitura impressa, marcada como textualmente duvidosa na edição, sem emendar silenciosamente o texto.
theological_decisions:
- issue: Pureza da mente em contato com as impurezas do mundo
  choice: A mente pura permanece não contaminada mesmo quando cercada pelas impurezas da terra.
  alternative: Interpretar o texto como promessa de imunidade moral absoluta ou como ordem de isolamento do mundo.
  rationale: O grego ressalta a não contaminação da mente pura, mas não desenvolve uma doutrina de impecabilidade nem exige afastamento físico; a tradução preserva a afirmação ética sem ampliá-la.
- issue: Sentido de οἰκοδομεῖ no final do versículo 2
  choice: Manter 'edifica' e assinalar a corrupção ou incerteza textual.
  alternative: Emendar o verbo para produzir uma ideia como 'purifica', 'resiste' ou 'permanece firme'.
  rationale: A edição marca a palavra com uma cruz crítica. Manter a leitura atestada com nota evita resolver por conjectura uma passagem genuinamente incerta.
translation_notes:
  register: Português moderno, corrente e digno, com imperativos naturais para leitores brasileiros e compreensão ampla no espaço lusófono. A tradução segue o trecho grego fornecido, que contém apenas os versículos 1–2 e não corresponde ao texto inglês de consulta apresentado; por isso, não incorpora o conteúdo divergente do inglês.
