source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Τὸ¹⁶ ἀγαθὸν διαβούλιον *οὐ δέχεται δόξης ⌈οὐκ ἀτιμίας⌉¹⁷ ἀνθρώπων, *καὶ πάντα δόλον¹⁸ ἢ¹⁹ ψεῦδος ἢ²⁰ μάχην *ἢ λοιδωρίαν²¹ *οὐκ οἶδε²². *Κύριος γὰρ²³ ἐν αὐτῷ κατοικεῖ²⁴, καὶ φωτίζει τὴν²⁵ ψυχὴν αὐτοῦ, καὶ χαίρει²⁶ πρὸς πάντας²⁷ ἐν παντὶ καιρῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/004.yaml
  text: A good purpose does not accept glory or dishonor from people, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him, and he lights up his soul, and he rejoices toward all at every time.
translation:
  language: pt
  text: O bom propósito não acolhe nem a glória nem a desonra vindas das pessoas e não conhece engano, falsidade, contenda ou insulto. Pois o Senhor habita nele, ilumina a sua alma, e ele se alegra com todos em todo tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ἀγαθὸν διαβούλιον
  choice: O bom propósito
  rationale: Traduz a ideia de uma disposição ou intenção deliberada para o bem, mantendo a formulação concisa do grego.
- source_word: οὐ δέχεται δόξης οὐκ ἀτιμίας ἀνθρώπων
  choice: não acolhe nem a glória nem a desonra vindas das pessoas
  rationale: Preserva o par contrastante e entende o genitivo ἀνθρώπων como a origem da honra ou desonra; 'pessoas' expressa ἀνθρώπων de modo inclusivo e natural.
- source_word: δόλον ... ψεῦδος ... μάχην ... λοιδωρίαν
  choice: engano, falsidade, discórdia ou insulto
  rationale: '''Engano'' e ''falsidade'' distinguem dolo de mentira; ''discórdia'' se ajusta melhor ao contexto moral do que a ideia mais física de combate; ''insulto'' comunica λοιδωρία em português corrente.'
- source_word: φωτίζει τὴν ψυχὴν αὐτοῦ
  choice: ilumina a sua alma
  rationale: Reproduz diretamente a imagem do verbo φωτίζει sem acrescentar uma explicação interpretativa.
- source_word: χαίρει πρὸς πάντας ἐν παντὶ καιρῷ
  choice: ele se alegra com todos em todo tempo
  rationale: Mantém a orientação relacional de πρὸς πάντας e a expressão temporal distributiva do original em linguagem natural.
theological_decisions:
- issue: Referente dos pronomes masculinos em 'nele', 'sua alma' e 'ele se alegra'
  choice: Manter a sequência pronominal do texto grego, referindo-a à pessoa caracterizada pelo bom propósito.
  alternative: Fazer do próprio 'bom propósito' o referente gramatical explícito em toda a frase.
  rationale: Embora διαβούλιον seja neutro, os pronomes masculinos apontam naturalmente para a pessoa que possui essa disposição. A tradução conserva essa passagem implícita sem inserir uma identificação teológica adicional.
- issue: Agente de φωτίζει
  choice: Entender 'o Senhor' como sujeito de 'ilumina'.
  alternative: Traduzir de maneira impessoal, como 'sua alma é iluminada'.
  rationale: O sujeito expresso mais próximo é κύριος, e o encadeamento 'habita... e ilumina' sustenta essa leitura direta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela e a tensão entre aprovação e desonra humanas foram preservadas sem linguagem confessional adicional.
