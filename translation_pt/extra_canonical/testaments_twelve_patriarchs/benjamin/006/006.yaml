source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Οὐκ ἔχει *ὅρασιν οὔτε ἀκοὴν³⁶ διπλῆν· *πᾶν γὰρ ὃ³⁷ ποιεῖ, Γἢ³⁸ λαλεῖ, *ἢ ὁρᾷ³⁸, οἶδεν ὅτι³⁹ Κύριος ἐπισκέπτει⁴⁰ τὴν⁴¹ ψυχὴν αὐτοῦ. Καὶ καθαίρει τὴν διάνοιαν αὐτοῦ πρὸς⁴² τὸ μὴ καταγνωσθῆναι ὑπὸ *τῶν ἀνθρώπων, ὁμοίως καὶ ὑπὸ Θεοῦ. Ὁμοίως δὲ καὶ τοῦ Βελίαρ τὰ ἔργα διπλᾶ ἐστιν, καὶ ἀπλότητα ἐν αὐτοῖς οὐκ ἔχουσιν⁴³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/006.yaml
  text: It has neither double sight nor double hearing; for in everything it does, or speaks, or sees, it knows that the Lord watches over his soul. And he cleanses his mind so as not to be condemned by men, likewise also by God. And in the same way the works of Beliar are twofold, and they have no singleness in them.
translation:
  language: pt
  text: Não tem visão dupla nem audição dupla, pois, em tudo o que faz, diz ou vê, sabe que o Senhor observa[a] a sua alma. E purifica a sua mente para não ser condenado pelos seres humanos e, igualmente, por Deus. Do mesmo modo, as obras de Beliar são duplas e não há nelas simplicidade[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “volta a sua atenção para”, “visita”, “vela por” ou “examina”. O verbo grego pode indicar tanto cuidado quanto inspeção.'
    reason: Preservar a amplitude semântica de ἐπισκέπτει sem fazer de «examina» o sentido exclusivo do texto.
  - marker: b
    text: Aqui, “simplicidade” significa inteireza e ausência de duplicidade, não ingenuidade.
    reason: Evitar que o sentido ético de ἀπλότητα seja entendido como falta de discernimento.
lexical_decisions:
- source_word: ὅρασιν οὔτε ἀκοὴν διπλῆν
  choice: visão dupla nem audição dupla
  rationale: Conserva a imagem grega e o contraste entre duplicidade e simplicidade que estrutura o versículo.
- source_word: ἐπισκέπτει
  choice: examina
  rationale: No contexto de possível condenação, comunica a ideia de inspeção ou consideração divina sem excluir o sentido mais amplo de voltar a atenção para alguém.
- source_word: καθαίρει τὴν διάνοιαν
  choice: purifica a sua mente
  rationale: Reproduz o sentido moral de καθαίρει e emprega uma expressão portuguesa clara e digna.
- source_word: ἀπλότητα
  choice: simplicidade
  rationale: Mantém o contraste lexical com 'duplas'; aqui denota inteireza, ausência de duplicidade, e não ingenuidade.
theological_decisions:
- issue: A ação do Senhor expressa por ἐπισκέπτει
  choice: examina a sua alma
  alternative: vela pela sua alma / visita a sua alma
  rationale: A proximidade da linguagem de condenação favorece 'examina', mas a nota preserva a amplitude semântica do verbo.
- issue: Mudança aparente entre sujeito neutro e sujeito pessoal
  choice: Omitir o pronome inicial e usar formas verbais de sujeito implícito
  alternative: Ela não tem... ela sabe...
  rationale: O antecedente não está incluído no versículo fornecido. O português permite manter sua referência implícita sem determinar indevidamente gênero ou identidade.
- issue: Contraste entre obras 'duplas' e ἀπλότης
  choice: Manter 'duplas' e 'simplicidade'
  alternative: obras dúplices e sinceridade
  rationale: Preserva a tensão e o jogo conceitual do grego, sem reduzir o contraste apenas à sinceridade psicológica.
translation_notes:
  register: Português moderno, claro e digno, com construção de ampla legibilidade brasileira. A repetição de “dupla/duplas” foi mantida por ser central ao contraste retórico do original. “Seres humanos” traduz o plural genérico ἀνθρώπων sem restringi-lo ao sexo masculino.
