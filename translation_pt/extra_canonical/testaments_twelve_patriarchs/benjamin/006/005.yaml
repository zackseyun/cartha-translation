source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ ἀγαθὴ διάνοια²⁸ οὐκ ἔχει δύο γλώσσας²⁹ εὐλογίας καὶ κατάρας³⁰, ὕβρεως καὶ ⌈τιμῆς⌉³¹, ἡσυχίας καὶ ταραχῆς, ὑποκρίσεως καὶ ἀληθείας, [πενίας καὶ πλούτου]³², ἀλλὰ *μίαν ἔχει περὶ πάντας³³ εἰλικρινῆ³⁴ καὶ³⁵ καθαρὰν ⌈διάθεσιν⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/005.yaml
  text: The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, [of poverty and wealth], but rather has one sincere and pure disposition toward all.
translation:
  language: pt
  text: 'A mente voltada para o bem não tem duas línguas: de bênção e maldição, de insulto e honra[b], de quietude e perturbação, de hipocrisia e verdade, [de pobreza e riqueza][a]. Pelo contrário, tem para com todos uma única atitude[c], sincera e pura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “de pobreza e riqueza” aparecem entre colchetes na edição grega consultada, indicando dúvida quanto ao texto.
    reason: Preservar de forma visível a incerteza textual assinalada na fonte.
  - marker: b
    text: “Honra” é uma restauração editorial do texto grego.
    reason: Registrar o sinal crítico que acompanha τιμῆς na edição-fonte.
  - marker: c
    text: “Atitude” traduz uma palavra restaurada editorialmente no texto grego.
    reason: Registrar o sinal crítico que acompanha διάθεσιν na edição-fonte.
lexical_decisions:
- source_word: ἡ ἀγαθὴ διάνοια
  choice: a mente voltada para o bem
  rationale: Expressa em português natural a qualidade moral de διάνοια sem confundi-la com a διάθεσις da oração final.
- source_word: δύο γλώσσας
  choice: duas línguas
  rationale: Conserva a imagem concreta e retórica do grego, esclarecida pela sequência de pares opostos.
- source_word: ἡσυχίας καὶ ταραχῆς
  choice: quietude e perturbação
  rationale: Mantém o contraste entre serenidade ou sossego e agitação ou desordem, sem restringi-lo apenas ao silêncio externo.
- source_word: εἰλικρινῆ καὶ καθαρὰν διάθεσιν
  choice: uma única atitude, sincera e pura
  rationale: Atitude é corrente e digna para a orientação interior de διάθεσις; a pontuação deixa claro que os dois adjetivos a qualificam.
- source_word: περὶ πάντας
  choice: para com todos
  rationale: Reproduz de modo idiomático a orientação dessa atitude em relação a todas as pessoas.
theological_decisions:
- issue: Alcance ético da expressão ἀγαθὴ διάνοια
  choice: mente voltada para o bem
  alternative: boa mente; boa intenção
  rationale: Evita transformar o termo em uma faculdade naturalmente boa ou reduzi-lo a uma intenção isolada; preserva seu sentido de orientação moral.
- issue: Metáfora das duas línguas
  choice: preservar literalmente a imagem
  alternative: não fala de duas maneiras; não é ambígua no falar
  rationale: A metáfora é central à formulação ética do texto e sua tensão não deve ser resolvida por paráfrase.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura paralela e a metáfora das “duas línguas” foram mantidas; “pelo contrário” torna natural a oposição marcada por ἀλλά.
