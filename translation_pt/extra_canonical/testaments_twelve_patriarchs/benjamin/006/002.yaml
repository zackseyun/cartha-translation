base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/002.yaml
  text: He does not look upon perishable things with passion, nor does he gather wealth for pleasure.
translation:
  language: pt
  text: Ele não olha para as coisas perecíveis com paixão, nem acumula riqueza para o prazer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμπαθῶς
  choice: com desejo apaixonado
  rationale: Expressa o sentido de olhar movido por uma paixão ou desejo dominante, de modo mais claro em português atual do que o simples advérbio “apaixonadamente”.
- source_word: τὰ φθαρτά
  choice: as coisas perecíveis
  rationale: Mantém a referência ampla do neutro plural grego àquilo que é sujeito à corrupção ou ao perecimento.
- source_word: συνάγει πλοῦτον
  choice: acumula riqueza
  rationale: Reproduz naturalmente a ideia de ajuntar ou amealhar riqueza.
- source_word: εἰς φιληδονίαν
  choice: para o prazer
  rationale: Preserva a finalidade indicada pela preposição e a ideia de busca ou amor do prazer, sem acrescentar uma qualificação moral ausente da formulação.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela entre as duas negações. A tradução conserva o alcance genérico de “coisas perecíveis” e evita tornar a expressão uma condenação denominacional específica da riqueza ou do prazer.
