source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VI. Τὸ διαβούλιον τοῦ ἀγαθοῦ ἀνδρὸς οὐκ ἔστιν ἐν χειρὶ πλάνης¹ πνεύματος² Βελίαρ· ὁ γὰρ ἄγγελος τῆς εἰρήνης ὁδηγεῖ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/001.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar's error, for the angel of peace guides his soul.
translation:
  language: pt
  text: 6 O propósito do homem bom não está na mão do espírito do erro de Belial, pois o anjo da paz guia a sua alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβούλιον
  choice: propósito
  rationale: Expressa a intenção ou deliberação interior do homem bom de modo natural em português, sem restringir o termo a mero conselho.
- source_word: ἐν χειρὶ
  choice: nas mãos de
  rationale: Preserva a metáfora semítica de domínio ou poder, com formulação idiomática em português.
- source_word: πλάνης
  choice: engano
  rationale: O termo pode indicar erro, desvio ou engano; aqui, ligado a um espírito e ao domínio de Belial, “engano” comunica naturalmente a força ativa da expressão sem impor a ideia mais específica de fraude deliberada.
- source_word: Βελίαρ
  choice: Belial
  rationale: Emprega a forma tradicional e amplamente reconhecida em português para o nome próprio.
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: o anjo da paz
  rationale: Tradução formal e clara da construção genitiva grega.
- source_word: ὁδηγεῖ
  choice: guia
  rationale: Reproduz diretamente a ação contínua de conduzir ou orientar.
theological_decisions:
- issue: Relação sintática entre “espírito”, “engano” e “Belial”
  choice: o espírito de engano de Belial
  alternative: o espírito do erro de Belial / o espírito do engano, Belial
  rationale: Mantém a cadeia genitiva do grego e a ambiguidade quanto a “de Belial” qualificar o engano ou o espírito, sem identificar explicitamente Belial com o espírito.
- issue: Contraste entre os agentes espirituais
  choice: Preservar “espírito de engano de Belial” e “anjo da paz” sem explicação adicional
  alternative: Explicitar uma oposição entre anjo mau e anjo bom
  rationale: O texto apresenta o contraste, mas não define aqui a ontologia nem a identidade exata desses agentes; a tradução não deve acrescentar uma sistematização teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora “nas mãos de” foi preservada por ser natural e por comunicar domínio. O possessivo em “a sua alma” tem referente claro no homem bom.
