    rationale: Embora possível em alguns contextos, «engano» pode denotar ato deliberado de ludibriar. «Erro» reproduz mais precisamente o valor de πλάνης e acompanha a decisão lexical do texto inglês auditado.
  - severity: low
    issue: Plural em «nas mãos»
    rationale: O grego traz ἐν χειρί, singular. O plural é idiomático em português, mas o singular preserva mais estritamente a imagem textual sem prejudicar a fluência.
