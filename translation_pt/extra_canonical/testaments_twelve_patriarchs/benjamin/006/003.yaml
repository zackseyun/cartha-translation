  text: He does not delight in pleasure, [does not grieve his neighbor, does not fill himself with luxury, does not go astray by the wanderings of the eyes]. For the Lord is his portion.
translation:
  language: pt
  text: Ele não se deleita no prazer, [não entristece o próximo, não se farta de luxo, não se deixa desviar pelas divagações dos olhos].[a] Pois o Senhor é a sua porção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência entre colchetes apresenta incerteza textual na tradição manuscrita.
    reason: Explica por que parte do versículo aparece entre colchetes, sem ocultar a situação do texto grego.
lexical_decisions:
- source_word: τέρπεται ἐν ἡδονῇ
  choice: encontra prazer nos prazeres
  rationale: Mantém o jogo semântico do grego entre o verbo “deleitar-se” e o substantivo “prazer”, em formulação natural e clara.
- source_word: λυπεῖ τὸν πλησίον
  choice: entristece o próximo
  rationale: Traduz diretamente o sentido de causar tristeza ou aflição ao próximo, sem restringi-lo a uma forma específica de dano.
- source_word: ἐμπίπλαται τρυφῇ
  choice: se farta de luxo
  rationale: Expressa a ideia de encher-se ou saciar-se com vida luxuosa e indulgente.
- source_word: πλανᾶται μετεωρισμοῖς ὀφθαλμῶν
  choice: se deixa desviar pelas divagações dos olhos
  rationale: Preserva a imagem incomum e algo ambígua de movimentos, distrações ou desejos errantes dos olhos, sem explicá-la excessivamente.
- source_word: μερὶς αὐτοῦ
  choice: a sua porção
  rationale: Conserva a expressão bíblica tradicional de Deus como aquilo que cabe a alguém por porção ou herança.
theological_decisions:
- issue: O Senhor como “porção” do justo
  choice: Pois o Senhor é a sua porção
  alternative: Pois o Senhor é a sua herança
  rationale: “Porção” mantém a metáfora original e suas ressonâncias bíblicas sem reduzi-la apenas à noção jurídica de herança.
- issue: Status textual da sequência central
  choice: Manter a sequência entre colchetes
  alternative: Integrá-la ao texto sem marcação
  rationale: Os colchetes da edição-fonte indicam incerteza ou condição textual da passagem; preservá-los torna essa tensão visível ao leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição “prazer nos prazeres” foi mantida por refletir a ênfase lexical do grego; “divagações dos olhos” conserva deliberadamente a imagem ambígua do original.
