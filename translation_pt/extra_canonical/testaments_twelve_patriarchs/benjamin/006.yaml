base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar’s deceit[a], for the angel of peace guides his soul. He does not look with passion on perishable things, nor does he gather wealth for pleasure. He does not delight in pleasure, nor grieve his neighbor; he is not filled with luxury, nor led astray by the wanderings of the eyes. For the Lord is his portion. A good purpose does not accept the glory or the dishonor that comes from men, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him and gives light to his soul, and he rejoices toward all people at all times. The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, of poverty and wealth; rather, it has one sincere and pure disposition toward all. It does not have double sight or hearing; for in everything that it does, or speaks, or sees, it knows that the Lord is looking on his soul. And it cleanses
    the mind, so as not to be condemned by men and by God. But the disposition of Beliar is twofold, and it has no singleness. Flee, therefore, evil-mindedness, my children, and love the good mind, which the law of God knows, so that you may rest in hope, because the good-minded man does not have a darkened eye. He shows mercy to all, even if they are sinners; even if they devise evil against him, by doing good he overcomes evil, being shielded by what is good. And he loves the righteous as his own soul. If anyone is glorified, he does not envy him; if anyone is enriched, he is not jealous; if anyone is valiant, he praises him; the virtuous man he commends; on the poor man he has mercy; with the weak he has compassion; to God he sings praise[d][c][b]. The one who has the grace of a good spirit he loves as his own soul.
translation:
  language: pt
  text: '**Testamento de Benjamim 6**


    **1** O propósito[a] do homem bom não está na mão do espírito do engano de Beliar[b], pois o anjo da paz guia a sua alma. **2** Ele não contempla com desejo as coisas perecíveis, nem acumula riqueza para o prazer. **3** Não se deleita no prazer, não entristece o próximo, não se entrega ao luxo nem se deixa desviar pelos olhares errantes. Pois o Senhor é a sua porção. **4** O bom propósito não acolhe nem a glória nem a desonra que vêm das pessoas e não conhece engano, falsidade, conflito ou insulto. Pois o Senhor habita nele, ilumina a sua alma, e ele se alegra com todos em todo o tempo. **5** A boa mente não tem duas línguas — uma de bênção e outra de maldição, uma de insulto e outra de honra, uma de tranquilidade e outra de perturbação, uma de hipocrisia e outra de verdade, uma de pobreza e outra de riqueza —, mas mantém para com todos uma única disposição, sincera e pura. **6** Não tem visão nem audição duplas[c], pois, em tudo o que faz, diz ou vê, sabe que o Senhor examina a sua
    alma. **7** E ele purifica a sua mente, para não ser condenado pelas pessoas e, igualmente, por Deus. Do mesmo modo, as obras de Beliar são duplas e não há nelas simplicidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “resolução”, “intenção deliberada” ou “conselho” (διαβούλιον).
    reason: lexical_alternative
  - marker: b
    text: “Beliar” reproduz a forma do nome neste testemunho grego; muitos leitores conhecem a forma “Belial”.
    reason: lexical_alternative
  - marker: c
    text: “Visão nem audição duplas” conserva a imagem do texto, que contrapõe duplicidade e simplicidade, em vez de a substituir simplesmente por “hipocrisia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβούλιον
  choice: propósito
  rationale: No contexto exortativo, designa a intenção moral deliberada ou resolução interior. “Propósito” é natural em português e preserva o componente volitivo; a nota registra alternativas possíveis.
- source_word: πλάνης πνεύματος Βελίαρ
  choice: espírito enganador de Beliar
  rationale: πλάνη pode indicar erro, extravio ou engano. A formulação adjetival comunica com naturalidade a atuação moralmente desviadora do espírito sem limitar o sentido a um erro involuntário.
- source_word: ἐμπαθῶς
  choice: com desejo
  rationale: O advérbio indica desejo desordenado ou paixão dirigida às coisas perecíveis, sem exigir uma conotação exclusivamente sexual.
- source_word: τὰ φθαρτά
  choice: as coisas perecíveis
  rationale: Preserva o contraste entre bens transitórios e o Senhor como porção permanente.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: vagueios dos olhos
  rationale: Mantém a imagem concreta de olhares instáveis e movidos pelo desejo, em vez de reduzi-la a uma abstração moral.
- source_word: μερὶς
  choice: porção
  rationale: Conserva a ressonância bíblica de quinhão ou herança própria sem explicitar além do texto.
- source_word: δόξης ... ἀτιμίας ἀνθρώπων
  choice: a glória nem a desonra que vêm das pessoas
  rationale: Explicita de modo natural o genitivo de origem e conserva os dois polos da avaliação humana.
- source_word: δύο γλώσσας
  choice: duas línguas
  rationale: Preserva a metáfora retórica da duplicidade, desenvolvida pelos pares contrastantes que seguem.
- source_word: ἐπισκέπτει
  choice: examina
  rationale: No contexto, o verbo expressa a atenção ou inspeção divina sobre a alma. “Examina” evita tanto a ideia meramente visual quanto a paráfrase excessiva.
- source_word: ἀπλότητα
  choice: simplicidade
  rationale: O termo contrapõe integridade e singeleza à duplicidade das obras de Beliar. “Simplicidade” mantém essa oposição sem reduzi-la apenas a sinceridade.
theological_decisions:
- issue: Agência do espírito de Beliar
  choice: “não está nas mãos do espírito enganador de Beliar”
  alternative: “não está sob o poder do espírito do engano de Beliar”
  rationale: A tradução mantém a metáfora de estar “nas mãos” e a agência espiritual do texto, sem formular uma doutrina mais ampla sobre possessão ou determinismo.
- issue: Exame e condenação por seres humanos e por Deus
  choice: Preservar ambos como agentes distintos no versículo 7
  alternative: Entender a referência às pessoas como mera reputação pública
  rationale: O grego afirma paralelamente a possibilidade de condenação por pessoas e por Deus. A tradução conserva a tensão sem equiparar a autoridade dos dois julgamentos nem eliminar um deles.
- issue: Contraste entre duplicidade e simplicidade
  choice: Manter as imagens de duas línguas, sentidos duplos e obras duplas
  alternative: Parafrasear todas as imagens como hipocrisia
  rationale: O capítulo desenvolve uma oposição moral mais ampla entre duplicidade e integridade. Reduzi-la a hipocrisia apagaria a variedade e a força das imagens gregas.
- issue: Extensão textual do capítulo fornecido
  choice: Traduzir somente o texto grego apresentado, que termina na afirmação sobre as obras de Beliar
  alternative: Acrescentar a continuação presente na camada inglesa de consulta
  rationale: A continuação inglesa não aparece no campo de fonte grega fornecido. Para manter a publicação auditável e fundada na evidência original apresentada, ela não foi retrovertida nem acrescentada como se estivesse documentada nesta fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construções naturais para leitores brasileiros e compreensão internacional. Mantiveram-se as imagens éticas centrais e o paralelismo do grego. A numeração em sete versículos acompanha a unidade fornecida; não se incorporou material disponível apenas na camada inglesa.
