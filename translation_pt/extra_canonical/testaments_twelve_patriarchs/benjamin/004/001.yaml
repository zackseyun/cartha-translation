  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/001.yaml
  text: See then, my children, the end of the good man. Imitate [in goodness] because of his compassion, so that you also may wear crowns of glory.
translation:
  language: pt
  text: 4:1 Vejam, portanto, meus filhos, o fim do homem bom. Imitem [na bondade], por causa da compaixão dele, para que vocês também usem coroas de glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδετε
  choice: Vejam
  rationale: Imperativo plural direto e natural em português moderno.
- source_word: τὸ τέλος
  choice: o fim
  rationale: Preserva a correspondência lexical e a possível referência tanto ao desfecho quanto à morte do homem bom, sem resolver a ambiguidade.
- source_word: τοῦ ἀγαθοῦ ἀνδρός
  choice: do homem bom
  rationale: Tradução clara e próxima da construção grega.
- source_word: μιμήσασθε
  choice: Imitem-no
  rationale: O imperativo pede que os destinatários tomem o homem bom como modelo; o pronome explicita em português o referente naturalmente recuperado do contexto.
- source_word: ἐν ἀγαθῇ
  choice: '[na bondade]'
  rationale: Mantém entre colchetes a expressão textualmente assinalada na fonte e reproduz seu sentido provável sem convertê-la em 'a bondade dele'.
- source_word: διὰ τὴν εὐσπλαγχνίαν αὐτοῦ
  choice: por causa da compaixão dele
  rationale: Conserva o valor causal de διά com acusativo e evita que 'sua' tenha referente ambíguo.
- source_word: στεφάνους δόξης φορέσητε
  choice: usem coroas de glória
  rationale: Expressa de modo natural o ato de portar coroas, preservando a imagem honorífica do grego.
theological_decisions:
- issue: Relação entre imitação, compaixão e coroas de glória
  choice: 'Preservar a sequência causal/final do grego: imitação por causa da compaixão, visando portar coroas de glória.'
  alternative: Reformular a compaixão como qualidade específica a ser imitada ou apresentar as coroas como recompensa explicitamente concedida por Deus.
  rationale: O texto não explicita essas relações adicionais; a tradução mantém a tensão e evita importar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento de boa legibilidade brasileira. Os colchetes no texto refletem a condição editorial da expressão grega, não uma nota de rodapé.
