source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἐάν¹⁹ τις δοξάζηται²⁰, οὐ²¹ φθονεῖ αὐτόν²²· ἐάν τις πλουτεῖ²³, οὐ ζηλοῖ²⁴· *ἐάν τις ἀνδρεῖος²⁵, ἐπαινεῖ²⁶ αὐτόν²⁷· τὸν σώφρονα ἀγαπῶν²⁸· ⸀τὸν πένητα ἐλεεῖ²⁹· *τῷ ἀσθενοῦντι³⁰ συμπάσχει³¹· τὸν Θεὸν φοβεῖται³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/004.yaml
  text: If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.
translation:
  language: pt
  text: Se alguém recebe honra, ele não o inveja; se alguém enriquece, não sente ciúme; se alguém é corajoso, ele o elogia; ama quem tem domínio próprio; tem compaixão do pobre; sofre com quem está fraco; teme a Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζηται
  choice: recebe honra
  rationale: O passivo pode indicar ser honrado ou glorificado. “Recebe honra” soa natural em português e evita a conotação exclusivamente cultual de “é glorificado”.
- source_word: ζηλοῖ
  choice: sente ciúme
  rationale: No contexto paralelo a φθονεῖ, expressa ciúme ou rivalidade diante da prosperidade alheia; a formulação distingue-o de “inveja” sem exagerar a diferença.
- source_word: ἀνδρεῖος
  choice: corajoso
  rationale: Expressa valentia ou coragem, sem restringir a qualidade ao sexo masculino.
- source_word: σώφρονα
  choice: quem tem domínio próprio
  rationale: σώφρων abrange sensatez, moderação e autocontrole; “tem domínio próprio” preserva aqui a ênfase ética de modo claro.
- source_word: ἐλεεῖ
  choice: tem compaixão
  rationale: Transmite misericórdia ativa em linguagem corrente e digna.
- source_word: τῷ ἀσθενοῦντι
  choice: quem está fraco
  rationale: Mantém a amplitude do particípio, que pode se referir a fraqueza, enfermidade ou debilidade, sem limitar o sentido a doença física.
- source_word: συμπάσχει
  choice: sofre com
  rationale: Reproduz diretamente a ideia de compartilhar o sofrimento de outra pessoa.
- source_word: τὸν Θεὸν φοβεῖται
  choice: teme a Deus
  rationale: Traduz literalmente o temor reverente a Deus e corrige qualquer influência de uma leitura variante ligada a louvor.
theological_decisions:
- issue: Sentido de φοβεῖται em relação a Deus
  choice: teme a Deus
  alternative: reverencia a Deus
  rationale: “Teme” preserva a força e a tensão da expressão grega, sem interpretá-la de antemão apenas como reverência.
- issue: Amplitude moral de σώφρων
  choice: quem tem domínio próprio
  alternative: a pessoa sensata
  rationale: A escolha comunica a virtude ética com clareza, embora o termo também possa incluir prudência e sensatez; não se introduz uma doutrina específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sequência de orações paralelas e o sujeito implícito do retrato moral foram preservados. Empregou-se “ele” apenas onde ajuda a clareza referencial; nas demais orações, a elipse evita repetição pesada.
