source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ¹⁰ ἀγαθὸς ⁹ἄνθρωπος⁹ οὐκ ἔχει σκοτεινὸν ὀφθαλμόν¹¹, ἐλεεῖ¹² γὰρ πάντας, κἂν *ἁμαρτωλοὶ ὦσιν¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/002.yaml
  text: For the good man does not have a dark eye, for he has mercy on all, even if they are sinners.
translation:
  language: pt
  text: Pois o homem bom não tem o olhar sombrio, porque tem misericórdia de todos, mesmo que sejam pecadores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: olhar sombrio
  rationale: A expressão grega significa literalmente “olho sombrio/escuro”, mas aqui descreve a disposição com que a pessoa vê os outros. “Olhar sombrio” preserva a imagem corporal e soa natural em português, sem definir além do texto se se trata de hostilidade, inveja ou falta de compaixão.
- source_word: ἐλεεῖ
  choice: tem misericórdia
  rationale: Reproduz diretamente a ideia de exercer ou demonstrar misericórdia e mantém o vínculo semântico com a tradição bíblica em linguagem atual.
- source_word: πάντας
  choice: todos
  rationale: Mantém o alcance universal explícito do termo grego.
- source_word: κἂν ἁμαρτωλοὶ ὦσιν
  choice: mesmo que sejam pecadores
  rationale: Expressa naturalmente em português a concessão presente em κἄν com o subjuntivo, sem enfraquecer a caracterização moral.
theological_decisions:
- issue: Alcance da misericórdia para com pecadores
  choice: “tem misericórdia de todos, mesmo que sejam pecadores”
  alternative: “tem misericórdia de todos, ainda que sejam pecadores”
  rationale: A tradução conserva a afirmação abrangente e sua tensão moral, sem acrescentar condições, exceções ou implicações doutrinárias ausentes do grego.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção preserva a metáfora do olho por meio de “olhar sombrio”, evitando tanto o literalismo pouco idiomático de “olho escuro” quanto uma interpretação excessivamente específica.
