source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⸢Κἂν *μὴ βούλωνται περὶ αὐτοῦ εἰς καλά¹⁴, *οὗτος τὸ ἀγαθὸν ποιῶν¹⁵ νικᾷ τὸ κακόν, σκεπόμενος¹⁶ ὑπὸ τοῦ Θεοῦ¹⁷⸣. τοὺς †ἀδικοῦντας¹⁸ ἀγαπᾷ ὡς τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/003.yaml
  text: And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.
translation:
  language: pt
  text: E, mesmo que não lhe desejem o bem, este, praticando o bem, vence o mal, protegido por Deus. Ele ama os que lhe fazem injustiça como à sua própria vida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ βούλωνται περὶ αὐτοῦ εἰς καλά
  choice: não tenham boas intenções para com ele
  rationale: Expressa de modo natural a ideia de não querer ou não pretender o bem a respeito dele, sem acrescentar um objeto ausente no grego.
- source_word: τὸ ἀγαθὸν ποιῶν
  choice: praticando o bem
  rationale: 'Preserva o sentido ativo e habitual do particípio: fazer ou praticar aquilo que é bom.'
- source_word: νικᾷ τὸ κακόν
  choice: vence o mal
  rationale: Tradução direta e idiomática do verbo νικάω e do substantivo τὸ κακόν.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: protegido por Deus
  rationale: Comunica a imagem de estar coberto, abrigado ou protegido por Deus em português corrente e digno.
- source_word: τοὺς ἀδικοῦντας
  choice: os que o tratam injustamente
  rationale: Mantém o sentido amplo de cometer injustiça ou agir de modo errado contra alguém, sem restringi-lo a uma forma específica de dano.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: como à própria vida
  rationale: ψυχή pode significar alma, vida ou o próprio ser; aqui, a comparação idiomática de amor favorece 'a própria vida', preservando a intensidade sem impor uma antropologia técnica.
theological_decisions:
- issue: Relação entre a prática do bem, a vitória sobre o mal e a proteção divina
  choice: Manter as três ideias em sequência, sem explicitar causalidade além da construção grega
  alternative: Traduzir como se ele vencesse o mal porque Deus o protege
  rationale: O particípio σκεπόμενος permite uma relação circunstancial, mas não exige que a tradução determine uma causalidade exclusiva.
- issue: Sentido de ψυχή
  choice: vida
  alternative: alma
  rationale: Neste contexto, 'amar como à própria vida' é natural e representa o valor reflexivo e integral de ψυχή, sem transformar a frase em afirmação doutrinária sobre a alma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a progressão do grego e evita tanto literalismo áspero quanto paráfrase teológica.
