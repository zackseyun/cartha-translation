  text: For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him.
translation:
  language: pt
  text: Pois José também suplicou ao nosso pai que orasse por seus irmãos, para que o Senhor não lhes imputasse pecado, porque fizeram o mal contra ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: suplicou
  rationale: Expressa o pedido insistente ou fervoroso indicado pelo verbo, em linguagem digna e natural.
- source_word: ὑπὲρ τῶν ἀδελφῶν αὐτοῦ
  choice: por seus irmãos
  rationale: Reproduz naturalmente a ideia de oração em favor dos irmãos.
- source_word: λογίσηται ... ἁμαρτίαν
  choice: imputasse pecado
  rationale: Preserva a metáfora de levar algo em conta ou atribuí-lo a alguém, sem reduzir a expressão a simples punição ou perdão.
- source_word: ἐποίησαν πονηρὸν εἰς αὐτόν
  choice: haviam praticado o mal contra ele
  rationale: Mantém tanto o caráter moral do ato quanto sua direção contra José; o mais-que-perfeito esclarece que o mal antecedeu o pedido.
theological_decisions:
- issue: O sentido de λογίσηται na petição dirigida ao Senhor
  choice: não lhes imputasse pecado
  alternative: não levasse em conta o pecado deles
  rationale: A escolha conserva a linguagem de atribuição ou contabilização presente no grego, sem definir um mecanismo teológico específico.
