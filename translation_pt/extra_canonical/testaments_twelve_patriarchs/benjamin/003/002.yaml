id: T12P.BEN.3.2
reference: Testament of Benjamin 3:2
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/002.yaml
  text: And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly.
translation:
  language: pt
  text: E que a mente de vocês esteja voltada para o bem, como sabem que está a minha. Pois quem tem a mente reta vê tudo corretamente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάνοια
  choice: mente
  rationale: Expressa de modo natural a faculdade de pensar e a disposição interior, cabendo às duas ocorrências do termo.
- source_word: εἰς τὸ ἀγαθόν
  choice: voltada para o bem
  rationale: Reproduz a orientação indicada por εἰς e preserva o sentido substantivado de ἀγαθόν.
- source_word: ὀρθὴν / ὀρθῶς
  choice: reta / corretamente
  rationale: Mantém a relação lexical e retórica entre a disposição correta da mente e a maneira correta de perceber.
- source_word: βλέπει
  choice: vê
  rationale: Conserva a imagem visual direta do grego, sem reduzi-la a mera compreensão intelectual.
theological_decisions:
- issue: Relação entre retidão interior e percepção
  choice: 'Preservar a afirmação direta: “quem tem a mente reta vê tudo corretamente”'
  alternative: Explicitar como discernimento moral ou espiritual
  rationale: O grego não especifica o domínio da percepção; a tradução mantém a amplitude e a tensão da máxima.
- issue: Sentido de κἀμὲ οἴδατε
  choice: “como sabem que está a minha”
  alternative: “como vocês me conhecem”
  rationale: A formulação retoma naturalmente “mente” em português e expressa o sentido presente, sem introduzir a ideia temporal de “tem estado”.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O plural “vocês” torna explícito o destinatário plural de ὑμῶν; “mente reta” preserva a concisão e o paralelismo do original.
