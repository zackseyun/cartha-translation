base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/001.yaml
  text: Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph.
translation:
  language: pt
  text: Agora, portanto, meus filhos, amem também vocês o Senhor, o Deus do céu e da terra, guardem os seus mandamentos e imitem José, homem bom e santo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: amem
  rationale: Imperativo aoristo dirigido aos filhos; “amem” é natural, direto e preserva a força exortativa.
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: guardem os seus mandamentos
  rationale: “Guardar” conserva o sentido de observar fielmente, além de corresponder à imagem do verbo grego φυλάσσω.
- source_word: μιμούμενοι
  choice: imitem
  rationale: O particípio circunstancial acompanha os imperativos anteriores; vertê-lo como imperativo coordenado produz português claro sem alterar a exortação.
- source_word: ἀγαθὸν καὶ ὅσιον
  choice: bom e santo
  rationale: “Bom” traduz ἀγαθός, e “santo” expressa aqui ὅσιος como piedoso e moralmente íntegro, em registro bíblico corrente.
theological_decisions:
- issue: Identidade e alcance do título divino
  choice: o Senhor, o Deus do céu e da terra
  alternative: o Senhor Deus do céu e da terra
  rationale: A aposição com artigo em τὸν Θεὸν esclarece que “o Deus do céu e da terra” identifica o Senhor; a vírgula preserva essa estrutura.
- issue: José como modelo de imitação
  choice: imitem José, homem bom e santo
  alternative: seguindo o exemplo do bom e santo José
  rationale: A tradução direta mantém a linguagem explícita de imitação sem ampliar nem reduzir o papel exemplar atribuído a José.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos na terceira pessoa do plural adequados à legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mantendo o encadeamento exortativo do grego.
