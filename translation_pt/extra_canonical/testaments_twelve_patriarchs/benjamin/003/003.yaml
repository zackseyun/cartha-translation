id: T12P.BEN.3.3
reference: Testament of Benjamin 3:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/003.yaml
  text: Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every evil affliction, they will certainly not rule over you, just as they did not over Joseph my brother.
translation:
  language: pt
  text: Temam o Senhor e amem o próximo; e, se os espíritos de Beliar[a] arrastarem vocês para toda aflição maligna, de modo nenhum terão domínio sobre vocês, assim como não tiveram sobre José, meu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar é uma forma do nome também conhecido como Belial.
    reason: Ajuda o leitor a reconhecer o nome sem substituir a forma encontrada no texto grego.
lexical_decisions:
- source_word: Φοβεῖσθε
  choice: Temam
  rationale: Expressa a exortação no plural e conserva o sentido reverencial de φοβέομαι diante do Senhor.
- source_word: τὸν πλησίον
  choice: o próximo
  rationale: Equivalente português tradicional e corrente para a pessoa próxima ou semelhante, sem restringir indevidamente o referente.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: os espíritos de Beliar
  rationale: Mantém o plural do grego e translitera Βελίαρ como Beliar, forma própria desta tradição textual.
- source_word: ἐκστήσωσι ὑμᾶς
  choice: arrastem vocês
  rationale: Comunica de modo natural a ação coerciva de deslocar ou impelir os destinatários, de acordo com o sentido contextual e sem reduzir a expressão a mera persuasão.
- source_word: εἰς πᾶσαν πονηρίαν θλίψεως
  choice: para toda aflição maligna
  rationale: A construção grega é compacta e pouco comum; a formulação conserva juntos os conceitos de mal e aflição, seguindo a leitura contextual mais natural em português.
- source_word: οὐ μὴ κατακυριεύσωσιν ὑμῶν
  choice: de modo nenhum terão domínio sobre vocês
  rationale: A locução enfática οὐ μή exige negação forte; 'ter domínio sobre' reproduz a ideia de subjugar ou assenhorear-se expressa por κατακυριεύω.
theological_decisions:
- issue: Identidade e grafia de Βελίαρ
  choice: Beliar
  alternative: Belial
  rationale: A tradução preserva a forma grega desta obra sem identificar ou harmonizar silenciosamente o nome com uma forma bíblica mais conhecida.
- issue: Relação entre a ação dos espíritos e seu domínio
  choice: Ainda que arrastem os destinatários para a aflição, não terão domínio sobre eles
  alternative: Os espíritos não conseguirão nem afligi-los
  rationale: O período admite a ocorrência da aflição, mas nega enfaticamente o domínio final; essa tensão foi mantida, sem transformar a promessa em imunidade ao sofrimento.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural e uso de “vocês” para ampla legibilidade brasileira. A sintaxe foi suavizada sem eliminar a tensão entre sofrer aflição e não ficar sob o domínio de Beliar.
