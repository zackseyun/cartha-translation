base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/007.yaml
  text: And thus Jacob cried out, “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, he kept kissing him for two hours, saying,
translation:
  language: pt
  text: 'E assim Jacó exclamou: “Ó bom filho, conquistaste o íntimo de Jacó, teu pai!” E, abraçando-o, ficou beijando-o durante duas horas, dizendo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόα
  choice: exclamou
  rationale: Expressa um brado ou fala em voz alta com naturalidade e dignidade em português.
- source_word: τέκνον χρηστόν
  choice: bom filho
  rationale: τέκνον é um termo de parentesco afetuoso, e χρηστόν significa aqui ‘bom’ ou ‘bondoso’.
- source_word: ἐνίκησας
  choice: venceu
  rationale: Preserva o sentido direto de ‘vencer, prevalecer sobre’, sem seguir a interpretação mais explicativa da camada inglesa.
- source_word: τὰ σπλάγχνα
  choice: as entranhas
  rationale: Mantém a imagem visceral grega, que figuradamente designa o íntimo e os afetos profundos, preservando a tensão da expressão.
- source_word: κατεφίλει
  choice: ficou beijando-o
  rationale: O imperfeito intensivo/continuativo indica beijos repetidos ou prolongados.
- source_word: ἐπὶ δύο ὥρας
  choice: durante duas horas
  rationale: Indica a extensão temporal da ação de beijar.
theological_decisions:
- issue: Sentido de ‘venceu as entranhas’
  choice: Preservar a metáfora literal e ambígua
  alternative: ‘comoveu o íntimo’ ou ‘despertou o profundo afeto’
  rationale: O grego combina ἐνίκησας com τὰ σπλάγχνα de modo marcante. Uma paráfrase afetiva resolveria a imagem e reduziria sua força; a formulação literal permite entender que o filho prevaleceu sobre ou conquistou os afetos profundos do pai.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A fala usa ‘você’ por naturalidade amplamente compreensível; a metáfora ‘venceu as entranhas’ foi deliberadamente mantida por fidelidade ao grego.
