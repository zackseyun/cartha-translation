id: T12P.BEN.3.8
reference: Testament of Benjamin 3:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/008.yaml
  text: “The heavenly prophecy concerning you will be fulfilled, [concerning the lamb of God and savior of the world,] for the blameless one will be handed over by lawless men, and the sinless one will die for the ungodly [in the blood of the covenant, for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants].”
translation:
  language: pt
  text: “Cumprir-se-á a seu respeito uma profecia celestial [a respeito do Cordeiro de Deus e Salvador do mundo]a, pois aquele que é sem mancha será entregue por homens sem lei, e aquele que não tem pecado morrerá pelos ímpios [no sangue da aliança, para a salvação das nações e de Israel e para a destruição de Beliar c e de seus servos]b.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πληρωθήσεται
  choice: Cumprir-se-á
  rationale: Mantém o futuro passivo e a linguagem profética natural em português.
- source_word: ἄμωμος
  choice: aquele que é sem mancha
  rationale: Preserva o sentido de irrepreensibilidade e a possível ressonância sacrificial no contexto do cordeiro.
- source_word: ἀνόμων
  choice: homens sem lei
  rationale: Expressa literalmente a ideia de pessoas que agem à margem ou em violação da lei, sem reduzir o termo apenas a ‘maus’.
- source_word: ἀναμάρτητος
  choice: aquele que não tem pecado
  rationale: Distingue este termo de ἄμωμος e comunica de modo claro a ausência de pecado.
- source_word: ὑπὲρ ἀσεβῶν
  choice: pelos ímpios
  rationale: Conserva a concisão e a amplitude de ὑπέρ, que pode indicar benefício, representação ou substituição, sem explicitar uma teoria teológica.
- source_word: ἐν αἵματι διαθήκης
  choice: no sangue da aliança
  rationale: Segue de perto a construção grega e preserva sua formulação teológica densa.
- source_word: ἐθνῶν
  choice: nações
  rationale: É o equivalente contextual mais amplo, sem limitar o referente exclusivamente a um sentido étnico ou religioso.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega presente nesta edição, em vez de normalizá-la silenciosamente para ‘Belial’.
theological_decisions:
- issue: Sentido da morte ὑπὲρ ἀσεβῶν
  choice: morrerá pelos ímpios
  alternative: morrerá em favor dos ímpios / morrerá no lugar dos ímpios
  rationale: A tradução escolhida conserva a ambiguidade legítima de ὑπέρ e não impõe uma formulação específica da expiação.
- issue: Relação entre o sangue e a aliança
  choice: no sangue da aliança
  alternative: por meio do sangue da aliança
  rationale: A preposição ἐν foi mantida sem converter a expressão em uma explicação instrumental não explicitada pelo texto.
- issue: Identidade de Beliar
  choice: manter o nome próprio sem explicação doutrinária no corpo do texto
  alternative: substituir por Satanás ou pelo Diabo
  rationale: O original usa Βελίαρ; identificar a figura por outro título resolveria uma questão interpretativa além do que o texto declara.
- issue: Passagens entre colchetes na edição-fonte
  choice: preservar os colchetes e explicar seu caráter editorial em notas
  alternative: incorporar as palavras sem marcação ou omiti-las
  rationale: Assim se mantém visível a incerteza textual assinalada pela edição crítica, sem decidir silenciosamente a favor ou contra sua originalidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe profética foi mantida sem arcaísmos excessivos. As repetições paralelas (‘aquele que é sem mancha’ / ‘aquele que não tem pecado’) reproduzem a distinção e o equilíbrio do grego. Os colchetes da edição-fonte foram preservados, e todas as notas têm marcadores explícitos no texto.
