base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/005.yaml
  text: And he cannot be mastered by the plots of men or of beasts, being helped †to live from it† by the love which he has toward his neighbor.
translation:
  language: pt
  text: E ele não pode ser dominado pelas tramas de homens ou de feras, sendo ajudado †a viver dela†[a] pelo amor que tem pelo próximo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego de “a viver dela” é obscuro e provavelmente está corrompido; a tradução reproduz cautelosamente as palavras preservadas.
    reason: Sinaliza uma dificuldade textual genuína, marcada por cruzes críticas na edição-fonte, sem atribuir ao pronome uma referência ou relação mais específica do que o texto permite.
lexical_decisions:
- source_word: ἐπιβουλῆς
  choice: tramas
  rationale: Expressa uma ação maliciosamente planejada ou uma cilada, em linguagem natural e sem restringir o sentido a um complô formal.
- source_word: κυριευθῆναι
  choice: ser dominado
  rationale: Preserva a ideia passiva de alguém cair sob o poder ou domínio de outro.
- source_word: θηρίων
  choice: feras
  rationale: Mantém o sentido de animais selvagens ou perigosos e a dignidade do registro.
- source_word: ἀγάπης
  choice: amor
  rationale: Equivalente corrente e direto para ἀγάπη neste contexto.
- source_word: πλησίον
  choice: próximo
  rationale: Termo bíblico natural em português para a pessoa com quem se mantém uma relação ética de amor.
theological_decisions:
- issue: Agente da ajuda em βοηθούμενος ... ὑπὸ τῆς ἀγάπης
  choice: pelo amor
  alternative: pelo Senhor, por meio do amor
  rationale: O texto grego fornecido traz explicitamente ὑπὸ τῆς ἀγάπης, e não uma referência ao Senhor. A tradução evita introduzir um agente divino ausente desta forma textual.
- issue: Trecho textual obscuro ζῆν ἀπ᾽ αὐτῆς
  choice: †a viver por meio dela†
  alternative: omitir o trecho ou emendá-lo conjecturalmente
  rationale: As cruzes críticas indicam corrupção ou incerteza textual. A redação mantém uma representação cautelosamente literal e assinala a dificuldade, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe relativamente formal para acompanhar a estrutura grega. A construção deliberadamente incomum entre cruzes é mantida por causa da incerteza do texto-fonte.
