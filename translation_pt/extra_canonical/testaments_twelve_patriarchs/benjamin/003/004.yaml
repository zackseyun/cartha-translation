source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/004.yaml
  text: How many men wanted to kill him, and God sheltered him; for the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God.
translation:
  language: pt
  text: Quantos homens queriam matá-lo, e Deus o protegeu! Pois aquele que teme a Deus e ama o próximo não pode ser atingido pelo espírito de Beliar, pois está protegido pelo temor de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πόσοι τῶν ἀνθρώπων
  choice: Quantos homens
  rationale: Reproduz a exclamação quantitativa do grego de maneira natural e direta em português.
- source_word: ἀνελεῖν
  choice: matá-lo
  rationale: Neste contexto, o infinitivo significa tirar a vida, e não apenas remover ou eliminar.
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: protegeu / está protegido
  rationale: O verbo grego evoca cobrir como forma de abrigo e proteção; 'proteger' comunica com clareza a imagem funcional e mantém a repetição lexical.
- source_word: πλησίον
  choice: o próximo
  rationale: Expressão consagrada e inteligível para a pessoa com quem se mantém uma relação ética de amor.
- source_word: τοῦ πνεύματος τοῦ Βελίαρ
  choice: pelo espírito de Beliar
  rationale: Mantém a construção explícita do grego e translitera o nome próprio sem identificá-lo interpretativamente com outra figura.
- source_word: πληγῆναι
  choice: ser atingido
  rationale: Preserva a amplitude do verbo, que pode indicar receber um golpe ou sofrer dano, sem especificar além do texto.
- source_word: φόβου τοῦ Θεοῦ
  choice: temor de Deus
  rationale: Mantém o sentido religioso de reverência e medo diante de Deus, preservando a tensão sem reduzi-lo apenas a respeito.
theological_decisions:
- issue: A impossibilidade de ser atingido pelo espírito de Beliar
  choice: não pode ser atingido
  alternative: não pode ser ferido
  rationale: A formulação conserva a afirmação categórica do grego, sem enfraquecê-la nem explicar a natureza exata do golpe.
- issue: O temor de Deus como proteção
  choice: protegido pelo temor de Deus
  alternative: abrigado pelo temor de Deus
  rationale: Conserva o temor como agente ou meio de proteção, sem resolver a possível dimensão metafórica ou espiritual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e repetição deliberada de 'proteger/protegido' para refletir ἐσκέπασεν/σκεπαζόμενος. A pontuação realça a força exclamativa de Πόσοι e mantém a ligação explicativa introduzida por γάρ.
