  terminology: «Lobo voraz», «trabalhador do Senhor», «nações», «assembleias», «consumação da era» e «o escolhido de Deus» são escolhas adequadas. «Reunião das nações» preserva apropriadamente a abertura de συναγωγή neste ponto; «assembleias das nações» em v. 3 é igualmente defensável no plural.
