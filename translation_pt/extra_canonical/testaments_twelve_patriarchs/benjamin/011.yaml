    issue: «desta era» em 3
    rationale: O grego tem o artigo definido em «da era» (τοῦ αἰῶνος), sem demonstrativo. «Desta» especifica o referente além do texto-fonte.
  - severity: low
    issue: «juntamente com sua obra e sua palavra» em 4
    rationale: A expressão καὶ τὸ ἔργον καὶ ὁ λόγος αὐτοῦ apresenta ambos os elementos em paralelismo enfático. «Tanto a sua obra como a sua palavra» o reproduz melhor.
  - severity: low
    issue: «realizando em sua boca» em 2
    rationale: A construção grega é obscura, mas «por sua boca» fornece uma leitura portuguesa mais inteligível, sem suprir uma vontade, voz ou possuidor que o texto não explicita.
