base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011.yaml
  text: '1 No longer shall I be called a ravening wolf because of your ravaging[a], but a worker of the Lord, distributing food to those who do what is good.

    2 And in the last times there shall arise from my seed one beloved of the Lord, hearing his voice and doing the good pleasure of his will, enlightening all the nations with new knowledge, entering upon Israel in salvation, and snatching away from them as a wolf, and giving to the gathering of the nations.

    3 Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.

    4 And in holy books he shall be recorded, both his work and his word; and he shall be God''s chosen one forever.

    5 And through him he shall pass through again as Jacob my father, saying[e][d][c][b], “He will fill up what is lacking in your tribe.”'
translation:
  language: pt
  text: '1 Já não serei chamado de lobo voraz por causa dos saques de vocês,[a] mas trabalhador do Senhor, distribuindo alimento aos que praticam o bem.


    2 E, nos últimos tempos, se levantará um amado do Senhor, da descendência de Judá e de Levi,[b] realizando por sua boca o que é agradável, iluminando todas as nações com um novo conhecimento, uma luz de conhecimento. Ele virá sobre Israel com salvação,[c] arrebatará deles como um lobo e dará à reunião das nações.


    3 Até a consumação da era,[d] ele estará nas assembleias das nações e entre os governantes delas, como uma melodia na boca de todos.


    4 E será registrado nos livros santos, tanto a sua obra como a sua palavra; e será o escolhido de Deus para sempre.


    5 E, por meio deles, ele visitará, como Jacó, meu pai, dizendo: “Ele suprirá o que falta à sua tribo”.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego deste capítulo é difícil e parece conter expansões ou duplicações, sobretudo no versículo 2. A tradução acompanha o testemunho grego apresentado e conserva suas ambiguidades.
    reason: textual_variant
  - marker: b
    text: O grego apresentado diz “da descendência de Judá e de Levi”. Outra forma textual, refletida em algumas traduções, traz “da minha descendência”. A frase seguinte, literalmente próxima de “realizando o bom prazer em sua boca”, também é obscura.
    reason: textual_variant
  - marker: c
    text: 'Ou: “intervirá em Israel com salvação”. A construção grega é incomum e não deixa totalmente clara a relação entre o verbo, Israel e a salvação.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou: “até o fim da era”.'
    reason: lexical_alternative
  - marker: e
    text: A frase final é obscura. “Deles” não tem antecedente inequívoco, e o verbo traduzido por “visitará” também pode sugerir ir, comparecer ou tornar a passar. A comparação com Jacó igualmente admite mais de uma ligação sintática.
    reason: textual_variant
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: lobo voraz
  rationale: Mantém a imagem vívida e predatória; “voraz” é natural em português e expressa a força de ἅρπαξ.
- source_word: ἁρπαγάς
  choice: saques
  rationale: Expressa atos concretos de tomada violenta. Embora não reproduza integralmente o jogo sonoro grego, liga-se naturalmente à imagem do lobo que arrebata.
- source_word: ἐργάτης Κυρίου
  choice: trabalhador do Senhor
  rationale: Preserva o sentido concreto de alguém que trabalha, em contraste com o lobo predador, sem transformar o termo em um título eclesiástico.
- source_word: ἐργαζομένοις τὸ ἀγαθόν
  choice: aos que praticam o bem
  rationale: Reproduz o objeto substantivado τὸ ἀγαθόν e soa corrente e digno em português.
- source_word: ἀγαπητὸς Κυρίου
  choice: um amado do Senhor
  rationale: Conserva a forma substantivada e o tom profético, sem identificar explicitamente a figura com um personagem posterior.
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: realizando em sua boca o que é agradável
  rationale: Mantém a estranheza da construção preservada no testemunho grego, sem acrescentar “vontade”, “voz” ou um possuidor não expresso.
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη · φῶς γνώσεως
  choice: iluminando todas as nações com um novo conhecimento, uma luz de conhecimento
  rationale: Conserva tanto a metáfora de iluminação como a expressão aparentemente repetida do texto grego, em vez de eliminar uma possível duplicação.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: virá sobre Israel com salvação
  rationale: Representa a ideia de aproximação ou intervenção de ἐπεμβαίνω e preserva a relação sintaticamente aberta entre Israel e salvação.
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: arrebatará deles como um lobo
  rationale: Preserva o verbo forte, a retomada da imagem do lobo e o objeto implícito do grego.
- source_word: συναγωγῇ τῶν ἐθνῶν
  choice: reunião das nações
  rationale: Comunica o sentido coletivo sem impor a leitura institucional de “sinagoga” ou “igreja”.
- source_word: συντελείας τοῦ αἰῶνος
  choice: consumação desta era
  rationale: Mantém a força escatológica de συντέλεια e verte αἰών como “era”, evitando a ambiguidade moderna de “mundo”.
- source_word: δι᾽ αὐτῶν φοιτήσει
  choice: por meio deles, ele visitará
  rationale: Mantém o pronome plural do texto apresentado e usa “visitará” para o movimento ou comparecimento sugerido por φοιτάω, sem definir os antecedentes obscuros.
theological_decisions:
- issue: Identidade e ascendência da figura futura
  choice: Traduzir o testemunho grego apresentado como “da descendência de Judá e de Levi”.
  alternative: “Da minha descendência”, isto é, de Benjamim, conforme outra forma textual refletida na camada inglesa.
  rationale: O texto grego fornecido traz explicitamente ἐκ σπέρματος Ἰούδα καὶ Λευί. A tradução representa essa leitura sem harmonizá-la com o contexto tribal nem identificar dogmaticamente a figura.
- issue: Retrato exaltado da figura futura
  choice: Conservar as afirmações sobre salvação, iluminação das nações, livros santos e eleição divina.
  alternative: Reduzi-las à descrição de um simples dirigente tribal ou explicitá-las como uma profecia cristológica.
  rationale: O testemunho existente tem linguagem messiânica ou profética elevada, mas não nomeia a figura. A tradução preserva essa tensão.
- issue: Sentido de ἔθνη
  choice: nações
  alternative: gentios
  rationale: “Nações” preserva o alcance coletivo do termo no contexto judaico e não antecipa uma distinção confessional posterior.
- issue: Referentes pronominais no versículo 5
  choice: Manter “por meio deles, ele visitará”.
  alternative: “Por meio dele, ele voltará a passar” ou explicitar quem visita e por meio de quem.
  rationale: O grego apresentado tem o plural αὐτῶν e deixa obscuros tanto seu antecedente quanto o sujeito de φοιτήσει; a tradução não resolve silenciosamente essa dificuldade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. Conservam-se deliberadamente construções um pouco incomuns onde o grego é textual ou sintaticamente obscuro. Emprega-se “vocês” apenas onde o plural de segunda pessoa precisa ser explícito e “sua” na fala final, cujo referente singular decorre do grego.
