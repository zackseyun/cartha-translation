base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005.yaml
  text: '1[a]. If, then, you also have a good mind, even wicked people will be at peace with you, and the lawless[b], being put to shame before you, will turn back to what is good; and those who are greedy will not only withdraw from their passion, but will also give to those in distress the things of greed that they had possessed.


    2. If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.


    3. For where there is the fear of good works and light in the mind, darkness flees away from it.


    4. For if anyone does violence to a holy man, he changes his mind; for the holy one has mercy on those who revile him and keeps silent.


    5. And if anyone betrays a righteous soul and insults a righteous soul, the righteous man prays; and even if for a little while he is brought low, before long he appears far more radiant[e][d][c], as Joseph my brother also became.'
translation:
  language: pt
  text: '**Testamento de Benjamim 5**


    1. Portanto, se vocês também tiverem boa disposição, até as pessoas perversas viverão em paz com vocês; e os dissolutos[a], envergonhados diante de vocês, voltarão para o bem. Os gananciosos não somente abandonarão sua paixão, mas também darão aos aflitos as coisas da ganância que possuíam[b].


    2. Se vocês praticarem o bem, até os espíritos impuros fugirão de vocês, e os animais selvagens terão medo de vocês.


    3. Pois, onde há temor das boas obras[c] e luz na mente, as trevas fogem dali.


    4. Pois, se alguém ultraja um homem santo, muda de atitude[d], porque o santo tem misericórdia dos que o insultam e permanece calado.


    5. E, se alguém trair um justo, o justo ora. Ainda que por pouco tempo seja humilhado, pouco depois aparece mais radiante, assim como aconteceu com José, meu irmão[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os desregrados”, “os irresponsáveis” ou “os pródigos”. O termo grego ἄσωτοι pode descrever conduta dissoluta, imprudente ou perdulária.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “as coisas da ganância”. Pode referir-se aos ganhos da ganância ou ao que haviam adquirido por ganância.
    reason: lexical_alternative
  - marker: c
    text: A expressão “temor das boas obras” é difícil. Pode indicar reverência associada às boas obras ou temor produzido por uma vida de bondade.
    reason: alternative_reading
  - marker: d
    text: “Muda de atitude” traduz μετανοεῖ; outra tradução possível é “se arrepende”.
    reason: lexical_alternative
  - marker: e
    text: 'A história de José serve de modelo: depois de ser humilhado por algum tempo, ele foi honrado e vindicado. Ver Gênesis 37; 39–45.'
    reason: cross_reference
lexical_decisions:
- source_word: διάνοιαν
  choice: boa disposição
  rationale: No contexto, designa a orientação moral interior, não apenas a capacidade intelectual. “Boa disposição” é natural em português e conserva essa dimensão ética.
- source_word: εἰρηνεύσουσιν μεθʼ ὑμῶν
  choice: viverão em paz com vocês
  rationale: Expressa de modo idiomático a relação pacífica indicada pelo verbo e por μετά, mantendo boa legibilidade brasileira e internacional.
- source_word: ἄσωτοι
  choice: os dissolutos
  rationale: O termo descreve pessoas de conduta desregrada ou moralmente irresponsável. “Dissolutos” mantém o contraste com o retorno ao bem sem introduzir a ideia específica de transgressão da lei.
- source_word: αἰδεσθέντες
  choice: envergonhados diante de vocês
  rationale: Preserva tanto a reação interior de vergonha quanto sua dimensão social perante a boa conduta dos destinatários.
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: voltarão para o bem
  rationale: Mantém o sentido de retorno de ἐπιστρέφω e representa τὸ ἀγαθόν como o bem em sentido ético.
- source_word: πλεονεκτοῦντες
  choice: os gananciosos
  rationale: Designa os caracterizados pelo desejo ávido de possuir mais; “gananciosos” é atual e claro.
- source_word: τοῦ πάθους
  choice: essa paixão
  rationale: Refere-se ao impulso moralmente desordenado da ganância. O demonstrativo explicita a conexão sem transformar πάθος em uma doutrina técnica.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: as coisas da ganância que possuíam
  rationale: Conserva deliberadamente a formulação grega comprimida e sua possível ambiguidade quanto a serem bens obtidos pela ganância.
- source_word: θλιβομένοις
  choice: aos aflitos
  rationale: Abrange os que se encontram sob sofrimento ou pressão, sem restringir o sentido a perseguição ou pobreza.
- source_word: ἀκάθαρτα πνεύματα
  choice: espíritos impuros
  rationale: É uma expressão portuguesa corrente para seres espirituais caracterizados por impureza, preservando o sentido religioso do grego.
- source_word: φόβος ἀγαθῶν ἔργων
  choice: temor das boas obras
  rationale: A construção é difícil e permite mais de uma relação do genitivo. A tradução próxima ao grego mantém a ambiguidade, esclarecida em nota.
- source_word: ὑβρίσει
  choice: ultraja
  rationale: O verbo pode indicar tratamento insolente, ofensivo ou violento. “Ultraja” retém sua gravidade sem limitar o ato à violência física.
- source_word: μετανοεῖ
  choice: muda de atitude
  rationale: No fluxo da frase, indica a reversão do agressor diante da resposta misericordiosa e silenciosa do santo. A nota registra a tradução tradicional “se arrepende”.
- source_word: φαιδρότερος
  choice: muito mais radiante
  rationale: Preserva a imagem de brilho, alegria e honra manifesta após a humilhação temporária.
theological_decisions:
- issue: Sentido de μετανοεῖ no versículo 4
  choice: muda de atitude
  alternative: se arrepende
  rationale: A expressão principal preserva a mudança interior e prática sugerida pelo contexto sem impor uma formulação doutrinária específica; a alternativa tradicional é registrada em nota.
- issue: Relação do genitivo em φόβος ἀγαθῶν ἔργων
  choice: temor das boas obras
  alternative: reverência associada às boas obras; temor produzido pelas boas obras
  rationale: A sintaxe grega é ambígua. A tradução não decide se as boas obras são objeto, origem ou contexto do temor.
- issue: Promessa de efeitos da boa conduta
  choice: manter as afirmações em sua força proverbial e exortativa
  alternative: qualificá-las como garantias condicionais ou exclusivamente escatológicas
  rationale: O texto apresenta diretamente os efeitos da boa disposição e da prática do bem. Não foram acrescentadas limitações teológicas ausentes do original.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para ampla legibilidade brasileira. A sintaxe foi tornada natural sem eliminar expressões difíceis do grego. No versículo 5, segue-se o texto grego fornecido, que diz apenas que alguém trai um justo e que o justo ora; não se incorporou a repetição sobre insultar uma alma justa presente na camada inglesa.
