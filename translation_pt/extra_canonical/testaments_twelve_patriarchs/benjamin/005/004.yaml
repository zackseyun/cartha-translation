source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ἐὰν γὰρ˥²⁶ ὑβρίσει²⁷ *ἄνδρα ὅσιον²⁸ μετανοεῖ²⁹, ἐλεεῖ γὰρ ⌈ὁ ὅσιος⌉ τῶν λοιδορούν³⁰ καὶ σιωπᾷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/004.yaml
  text: For if anyone insults a holy man, he repents; for the holy one has mercy on those who revile him and keeps silent.
translation:
  language: pt
  text: Pois, se alguém ultraja um homem santo, arrepende-se; porque o santo tem misericórdia dos que o insultam e permanece calado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβρίσει
  choice: ultraja
  rationale: Expressa ofensa grave ou tratamento insolente sem acrescentar a ideia de violência física, que o contexto não exige.
- source_word: ἄνδρα ὅσιον / ὁ ὅσιος
  choice: um homem santo / o santo
  rationale: Mantém a correspondência lexical de ὅσιος e a retomada da mesma pessoa na segunda oração.
- source_word: μετανοεῖ
  choice: arrepende-se
  rationale: Representa o sentido moral de mudar de atitude ou mente, adequado ao contexto.
- source_word: ἐλεεῖ
  choice: tem misericórdia
  rationale: Preserva o sentido de compaixão ativa e o registro religioso do verbo grego.
- source_word: τῶν λοιδορούν
  choice: dos que o insultam
  rationale: Traduz a referência aos que dirigem injúrias ao santo; o objeto pronominal é explicitado naturalmente em português a partir do contexto.
- source_word: σιωπᾷ
  choice: permanece calado
  rationale: Comunica não apenas ausência de fala, mas a atitude contínua de não responder às injúrias.
theological_decisions:
- issue: Sujeito implícito de μετανοεῖ
  choice: A pessoa que ultraja é quem se arrepende.
  alternative: O homem santo é quem muda de atitude.
  rationale: O sujeito naturalmente retomado é o indefinido implícito em ἐὰν ... ὑβρίσει; ἄνδρα ὅσιον está no acusativo como objeto e não pode ser o sujeito gramatical de μετανοεῖ.
- issue: Identidade de ὁ ὅσιος na segunda oração
  choice: Refere-se ao homem santo anteriormente ultrajado.
  alternative: Referência genérica a outra pessoa santa.
  rationale: O artigo definido e a repetição de ὅσιος indicam retomada natural do homem santo mencionado na primeira oração.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do grego. “Pois” e “porque” preservam as duas conexões explicativas marcadas por γάρ. A repetição entre “ultraja” e “insultam” mantém a relação sem tornar a frase artificial.
