source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: V. Ἐὰν ⸀οὖν καὶ ὑμεῖς¹· ἔχετε² ἀγαθὴν³ ⸀διάνοιαν⁴, καὶ⸃ οἱ πονηροὶ ἄνθρωποι⁵ *εἰρηνεύσουσιν μεθʼ ὑμῶν⁶, καὶ οἱ ἄσωτοι αἰδεσθέντες⁷ ὑμᾶς⁸ ⸀ἐπιστρέψουσιν⁹ εἰς *τὸ ἀγαθόν¹⁰, καὶ οἱ πλεονεκτοῦντες¹¹ οὐ μόνον ἀποστήσονται *τοῦ πάθους¹² ἀλλὰ καὶ *τὰ τῆς¹³ πλεονεξίας *ἃ εἶχον¹⁴ δώσουσιν¹⁵ τοῖς θλιβομένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/001.yaml
  text: If, then, you also have a good mind, even wicked people will be at peace with you, and the profligate, being put to shame by you, will turn to what is good; and those who are greedy will not only turn away from their passion, but will also give to those in distress the things of greed that they had.
translation:
  language: pt
  text: Se, portanto, vocês também tiverem uma boa disposição, até as pessoas perversas viverão em paz com vocês; e as pessoas de vida dissoluta, envergonhadas diante de vocês, se voltarão para o bem; e os gananciosos não somente se afastarão dessa paixão, mas também darão aos aflitos os bens ligados à ganância que possuíam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as coisas da ganância que tinham”. A expressão grega é condensada e pode referir-se a bens possuídos de modo ganancioso ou, mais amplamente, a bens associados à ganância; não afirma necessariamente como foram adquiridos.'
    reason: Preserva a ambiguidade sintática e semântica de τὰ τῆς πλεονεξίας ἃ εἶχον e evita traduzir εἶχον como “obtiveram”.
lexical_decisions:
- source_word: ἀγαθὴν διάνοιαν
  choice: uma boa disposição
  rationale: Expressa uma orientação interior boa, não apenas capacidade intelectual; é natural em português e preserva a dimensão moral da frase.
- source_word: οἱ πονηροὶ ἄνθρωποι
  choice: as pessoas perversas
  rationale: Traduz diretamente o sentido moral de πονηροί sem restringi-lo a criminalidade ou irreligiosidade.
- source_word: οἱ ἄσωτοι
  choice: os devassos
  rationale: O termo designa pessoas de conduta dissoluta ou desenfreada; “devassos” é conciso e adequado ao registro sapiencial.
- source_word: αἰδεσθέντες ὑμᾶς
  choice: envergonhados por causa de vocês
  rationale: Preserva a ideia de vergonha ou constrangimento moral provocado pelo exemplo dos destinatários, sem tornar “diante de vocês” a única leitura possível.
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: se voltarão para o bem
  rationale: Reproduz o movimento moral expresso por ἐπιστρέφω e o substantivado τὸ ἀγαθόν.
- source_word: οἱ πλεονεκτοῦντες
  choice: os gananciosos
  rationale: Comunica de modo corrente aqueles que procuram obter mais, sobretudo à custa de outros.
- source_word: τοῦ πάθους
  choice: essa paixão
  rationale: Mantém o termo forte πάθος e, com “essa”, torna explícita sua referência contextual à ganância sem substituir a imagem por uma paráfrase.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: aquilo que obtiveram por ganância
  rationale: Representa a construção difícil como bens ligados à ganância e entende εἶχον no sentido resultativo de ter/obter; a nota registra a alternativa mais formal.
- source_word: τοῖς θλιβομένοις
  choice: aos aflitos
  rationale: Preserva o sentido amplo de pessoas oprimidas, atribuladas ou em sofrimento, sem limitá-lo aos pobres.
theological_decisions:
- issue: Efeito da boa disposição sobre pessoas más
  choice: manter as formas futuras afirmativas do grego
  alternative: traduzir como possibilidade ou promessa condicional enfraquecida (“poderão viver em paz”)
  rationale: O texto apresenta os resultados de maneira categórica dentro da condição; a tradução não deve suavizar essa tensão sapiencial.
- issue: Referente de πάθος
  choice: “essa paixão”, referindo-se contextualmente à ganância
  alternative: “seu vício” ou simplesmente “a ganância”
  rationale: A opção preserva a linguagem de paixão dominante e evita introduzir uma categoria moral ou ascética mais específica que a do original.
- issue: Natureza do retorno εἰς τὸ ἀγαθόν
  choice: “se voltarão para o bem”
  alternative: “se converterão”
  rationale: “Converter-se” poderia importar uma formulação religiosa técnica não exigida pelo texto, que fala amplamente de mudança moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” para o plural. A pontuação divide o longo período grego sem romper sua progressão lógica. “Devassos” e “aflitos” mantêm um registro sapiencial elevado, mas ainda corrente.
