revisions:
- from: Se, portanto, vocês também tiverem uma boa disposição, até as pessoas perversas viverão em paz com vocês; e os devassos, envergonhados por causa de vocês, se voltarão para o bem. Os gananciosos não somente abandonarão essa paixão, mas também darão aos aflitos aquilo que obtiveram por ganância.[a]
  to: Se, portanto, vocês também tiverem uma boa disposição, até as pessoas perversas viverão em paz com vocês; e as pessoas de vida dissoluta, envergonhadas diante de vocês, se voltarão para o bem; e os gananciosos não somente se afastarão dessa paixão, mas também darão aos aflitos os bens ligados à ganância que possuíam.[a]
