  text: If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.
translation:
  language: pt
  text: Se vocês praticarem o bem, os espíritos impuros fugirão de vocês, e os animais selvagens terão medo de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοποιοῦντες
  choice: praticarem o bem
  rationale: Expressa de modo natural a ação contínua ou habitual de fazer o bem, preservando a condição introduzida por ἐάν.
- source_word: τὰ ἀκάθαρτα πνεύματα
  choice: os espíritos impuros
  rationale: Equivalente direto e corrente para a expressão grega, sem acrescentar uma identificação teológica mais específica.
- source_word: φεύξονται ἀφʼ ὑμῶν
  choice: fugirão de vocês
  rationale: Mantém o sentido direto de afastamento motivado por fuga e usa uma forma amplamente compreensível em português.
- source_word: τὰ θηρία
  choice: os animais selvagens
  rationale: Comunica o sentido de animais não domesticados ou feras em linguagem moderna, evitando a possível conotação figurada de «bestas».
- source_word: φοβηθήσονται ὑμᾶς
  choice: terão medo de vocês
  rationale: Reproduz o valor transitivo da construção grega de forma idiomática e clara.
theological_decisions:
- issue: Força de καί antes de «os espíritos impuros»
  choice: até
  alternative: e
  rationale: No contexto condicional, «até» comunica naturalmente a provável força enfática de καί refletida pela evidência de consulta, sem alterar a afirmação central.
translation_notes:
  register: Português moderno, digno e acessível, com «vocês» para a segunda pessoa do plural por sua ampla legibilidade brasileira e compreensão internacional. A ordem das duas consequências foi preservada.
