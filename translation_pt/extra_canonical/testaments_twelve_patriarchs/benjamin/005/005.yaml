base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/005.yaml
  text: And if anyone betrays a righteous man, the righteous man prays; and even if for a little while he is brought low, before long he reappears far more radiant, as Joseph my brother became.
translation:
  language: pt
  text: E, se alguém trair um justo, o justo ora; e, mesmo que seja humilhado por pouco tempo, pouco depois volta a aparecer mais radiante, como se tornou José, meu irmão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιον / ὁ δίκαιος
  choice: um justo / o justo
  rationale: Mantém a repetição e o sentido moral de alguém caracterizado pela justiça, sem acrescentar “homem” ou “alma”.
- source_word: προδώσει
  choice: traia
  rationale: Expressa de modo direto o ato de entregar ou trair alguém.
- source_word: ταπεινωθῇ
  choice: seja humilhado
  rationale: Preserva a forma passiva e a ideia de ser rebaixado ou abatido.
- source_word: μετʼ οὐ πολύ
  choice: não demora a
  rationale: Formulação portuguesa natural para “não muito depois”, mantendo a brevidade do intervalo.
- source_word: φαιδρότερος ἀναφαίνεται
  choice: reaparecer mais radiante
  rationale: Conserva tanto a manifestação renovada indicada por ἀναφαίνεται quanto o comparativo de brilho, alegria ou esplendor em φαιδρότερος.
- source_word: οἷος γέγονεν Ἰωσὴφ ὁ ἀδελφός μου
  choice: como aconteceu com José, meu irmão
  rationale: Comunica naturalmente que José exemplifica o justo que, depois de humilhado, volta a manifestar-se em condição mais radiante.
theological_decisions:
- issue: A reação do justo à traição
  choice: “o justo ora” sem objeto explicitado
  alternative: “o justo ora por ele” ou “ora pelo traidor”
  rationale: O grego não declara por quem ou com que finalidade o justo ora; a tradução preserva essa abertura.
- issue: Intensidade de φαιδρότερος
  choice: “mais radiante”
  alternative: “muito mais radiante”
  rationale: O texto grego traz um comparativo, mas não contém um intensificador inequívoco equivalente a “muito”; evita-se ampliar a afirmação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “justo” foi mantida por ser retoricamente relevante no grego; não foram criadas notas para variantes, pois o material fornecido não inclui o conteúdo do aparato indicado pelos números editoriais.
