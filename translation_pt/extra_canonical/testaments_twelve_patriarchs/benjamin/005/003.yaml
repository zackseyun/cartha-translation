base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/003.yaml
  text: For where there is fear of good works and light in the mind, darkness flees from it.
translation:
  language: pt
  text: Pois, onde há temor das boas obras[a] e luz no entendimento, as trevas fogem dele.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode indicar temor relacionado às boas obras ou produzido por elas; a relação exata não é especificada.
    reason: Preservar a ambiguidade do genitivo grego.
  - marker: b
    text: Literalmente, “fogem dele” ou “fogem disso”; o referente do pronome não é explícito no grego.
    reason: Sinalizar a indefinição do antecedente de αὐτοῦ.
lexical_decisions:
- source_word: φόβος ἀγαθῶν ἔργων
  choice: temor das boas obras
  rationale: Mantém a construção genitiva e sua concisão sem decidir se o temor é relacionado às boas obras, inspirado por elas ou dirigido a elas.
- source_word: φῶς εἰς διάνοιαν
  choice: luz no entendimento
  rationale: Expressa em português natural a imagem de luz que chega ao âmbito interior da compreensão, sem reduzir διάνοια apenas ao intelecto abstrato.
- source_word: τὸ σκότος ἀποδιδράσκει
  choice: as trevas fogem
  rationale: Preserva a personificação e a força do verbo grego, que indica fugir ou escapar.
theological_decisions:
- issue: Sentido de “temor das boas obras”
  choice: Preservar a relação genitiva ambígua
  alternative: Interpretar como “reverência produzida pelas boas obras” ou “medo de praticar boas obras”
  rationale: O grego não explicita a direção ou a origem do temor, e resolver a expressão poderia introduzir uma leitura moral ou teológica não assegurada pelo texto.
- issue: Referente de αὐτοῦ
  choice: Traduzir por “dele” e explicar a indefinição em nota
  alternative: “dali”, “do entendimento” ou “da pessoa”
  rationale: O pronome grego é masculino ou neutro e seu referente não está expresso de modo inequívoco; a tradução mantém essa tensão em vez de fixar um antecedente.
translation_notes:
  register: Português moderno, claro e digno. “Entendimento” comunica διάνοια com naturalidade e mantém o tom sapiencial; a formulação deliberadamente conserva as ambiguidades sintáticas do grego.
