lexical_decisions:
- source_word: ἐπέστρεψαν
  choice: voltaram
  rationale: Expressa de modo direto o retorno indicado pelo verbo grego, sem acrescentar destino não explicitado.
- source_word: ᾤκησαν
  choice: habitaram
  rationale: Preserva o sentido de residir ou estabelecer morada, em registro digno e corrente.
- source_word: ἐξόδου
  choice: saída
  rationale: Traduz o sentido comum de partida ou saída sem transformar o termo, por si só, em nome próprio ou impor uma alusão técnica ao Êxodo.
theological_decisions:
- issue: Possível alusão ao Êxodo de Israel
  choice: “saída” em minúscula
  alternative: “Êxodo” ou “partida”
  rationale: O contexto evoca o êxodo do Egito, mas o substantivo grego mantém aqui seu sentido lexical de saída; a tradução não converte a alusão em título formal.
