  text: XII. ¹Καὶ ταῦτα εἰπὼν ἐκτείνας τοὺς πόδας αὐτοῦ ἐκοιμήθη †ὕπνῳ² καλῷ [καὶ ἀγαθῷ]³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/001.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good [and good] sleep.
translation:
  language: pt
  text: E, depois de dizer essas coisas, estendeu os pés e adormeceu num sono tranquilo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns testemunhos acrescentam: “e bom”.'
    reason: Registra a expressão grega καὶ ἀγαθῷ, apresentada entre colchetes na edição-fonte, sem produzir uma repetição artificial no texto corrido.
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: estendeu os pés
  rationale: Reproduz de modo natural e próximo a ação descrita pelo grego, sem acrescentar a ideia não expressa de deitar-se.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Mantém o sentido direto de entrar no sono, embora o contexto de morte possa produzir um sentido secundário sem que a tradução o imponha.
- source_word: ὕπνῳ καλῷ
  choice: num sono tranquilo
  rationale: Em português, “sono bom” seria pouco idiomático; “sono tranquilo” comunica naturalmente a avaliação positiva de καλῷ sem explicitar além do texto.
theological_decisions:
- issue: Possível eufemismo de morte em ἐκοιμήθη
  choice: adormeceu
  alternative: morreu
  rationale: O grego emprega linguagem de sono. A tradução preserva essa imagem e sua possível tensão teológica, em vez de substituí-la pela interpretação explícita “morreu”.
- issue: Expressão secundária καὶ ἀγαθῷ entre colchetes editoriais
  choice: não incorporada como repetição no corpo do versículo; registrada em nota
  alternative: “num sono tranquilo [e bom]”
  rationale: A expressão é assinalada como textual/editorialmente incerta e, em português, sua reprodução literal criaria uma redundância opaca. A nota preserva integralmente a variante.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa simples. A formulação preserva a imagem do sono e evita interpretar explicitamente a cena como morte.
