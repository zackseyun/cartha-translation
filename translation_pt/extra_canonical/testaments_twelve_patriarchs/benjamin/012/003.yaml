  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/003.yaml
  text: And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly in the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].
translation:
  language: pt
  text: E no nonagésimo primeiro ano depois da saída dos filhos de Israel do Egito, eles e seus irmãos levaram secretamente os ossos de seus pais, na guerra em Canaã, e os sepultaram em Hebrom, junto aos pés de seus pais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «junto aos pés de seus pais» traduz literalmente o grego e pode indicar o lugar do sepultamento perto dos túmulos ancestrais, não necessariamente junto aos pés dos corpos de seus pais.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνενηκοστῷ πρώτῳ ἔτει
  choice: no nonagésimo primeiro ano
  rationale: Reproduz com precisão o ordinal grego em português natural.
- source_word: τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου
  choice: depois da saída dos filhos de Israel do Egito
  rationale: O enquadramento cronológico exige em português a expressão idiomática «depois da saída»; «filhos de Israel» preserva a forma tradicional e literal.
- source_word: ἀνήγαγον τὰ ὀστᾶ
  choice: levaram ... os ossos
  rationale: «Levaram» comunica o transporte dos restos mortais sem impor uma direção geográfica que o contexto transmitido não esclarece plenamente.
- source_word: ἐν κρυφῇ
  choice: secretamente
  rationale: Equivalente direto e natural do modo clandestino indicado pelo grego.
- source_word: ἐν τῷ πολέμῳ Χαναάν
  choice: em meio à guerra em Canaã
  rationale: Mantém a ligação da guerra com Canaã e expressa naturalmente a circunstância temporal, sem transformar a frase em uma identificação excessivamente específica.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: junto aos pés de seus pais
  rationale: Preserva a imagem literal e incomum do grego; a nota registra a possível referência à posição nos túmulos ancestrais.
