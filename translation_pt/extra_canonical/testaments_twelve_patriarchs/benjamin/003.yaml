  text: 1[a]. Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph. 2. And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly. 3. Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every wickedness of affliction, they will certainly not rule over you, just as they did not over Joseph my brother. 4. How many men wanted to kill him, yet God sheltered him[b]. For the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God. 5. And he cannot be mastered by the plots of men or of beasts, since the Lord helps him through the love that he has toward his neighbor. 6. For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him. 7. And thus Jacob cried out,
    “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, for two hours he kept kissing him, saying, 8. “The heavenly prophecy will be fulfilled upon you.”
translation:
  language: pt
  text: '1. Agora, portanto, meus filhos, amem também vocês o Senhor, o Deus do céu e da terra, e guardem os seus mandamentos, imitando José, homem bom e santo. 2. Que a mente de vocês esteja voltada para o bem, como sabem que está a minha. Pois quem tem a mente reta vê tudo retamente. 3. Temam o Senhor e amem o próximo. E, se os espíritos de Beliar os lançarem em toda maldade de aflição, de modo nenhum os dominarão, assim como também não dominaram José, meu irmão. 4. Quantos homens quiseram matá-lo! Deus, porém, o abrigou. Pois quem teme a Deus e ama o próximo não pode ser ferido pelo espírito de Beliar, porque está abrigado pelo temor de Deus. 5. Também não pode ser dominado pelas ciladas de homens ou de animais, pois é ajudado pelo amor que tem pelo próximo.[a] 6. Pois José também suplicou a nosso pai que orasse por seus irmãos, para que o Senhor não lhes atribuísse pecado, porque haviam praticado o mal contra ele. 7. Então Jacó exclamou: “Ó filho bondoso, você conquistou o coração de
    Jacó, seu pai!” E, abraçando-o, ficou beijando-o durante duas horas, enquanto dizia: 8. “A profecia celestial se cumprirá a respeito de você”.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação grega deste versículo é corrompida e instável. Depois de «é ajudado», o texto traz uma sequência difícil, literalmente relacionada a «viver dela/por ela», antes de «pelo amor que tem pelo próximo». Algumas testemunhas apresentam formulações ampliadas sobre animais ou um «espírito aéreo».
    reason: textual_variant
  - marker: b
    text: 'Outra tradução possível: “A profecia vinda do céu se cumprirá sobre você”. A preposição varia ligeiramente entre as testemunhas.'
    reason: alternative_reading
  - marker: c
    text: 'Algumas testemunhas acrescentam aqui uma profecia “acerca do Cordeiro de Deus e Salvador do mundo”: o inocente seria entregue por transgressores, o sem pecado morreria pelos ímpios “no sangue da aliança”, para a salvação das nações e de Israel e para a destruição de Beliar e de seus servos. A edição assinala essas expansões com colchetes.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: amem
  rationale: Imperativo corrente e direto, preservando a força ética e pactual do verbo.
- source_word: φυλάξατε ἐντολὰς
  choice: guardem os seus mandamentos
  rationale: Expressão bíblica natural em português que transmite observar e conservar fielmente os mandamentos.
- source_word: μιμούμενοι
  choice: imitando
  rationale: Mantém a forma participial e a exortação à imitação moral.
- source_word: διάνοια
  choice: mente
  rationale: Preserva o fio temático da orientação moral e intelectual ao longo do versículo.
- source_word: εἰς τὸ ἀγαθόν
  choice: voltada para o bem
  rationale: Reproduz de maneira idiomática a direção da mente para aquilo que é bom.
- source_word: ὀρθὴν ... ὀρθῶς
  choice: mente reta ... retamente
  rationale: Conserva a repetição retórica entre o adjetivo e o advérbio, embora 'retamente' tenha registro um pouco elevado.
- source_word: πλησίον
  choice: próximo
  rationale: Termo ético consagrado e inteligível, com a ressonância escritural apropriada.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: os espíritos de Beliar
  rationale: Translitera a forma grega do nome próprio e mantém o idioma apocalíptico do texto.
- source_word: ἐκστήσωσι
  choice: procurem arrastá-los
  rationale: Expressa a pressão coercitiva dos poderes hostis sem reduzir o verbo a uma alteração meramente psicológica.
- source_word: κατακυριεύσωσιν
  choice: dominarão
  rationale: Comunica senhorio hostil e combina naturalmente com a negação enfática οὐ μή.
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: abrigou / está abrigado
  rationale: Preserva a imagem protetora repetida no trecho.
- source_word: πληγῆναι
  choice: ser ferido
  rationale: Mantém a voz passiva e o sentido de sofrer um golpe de poder hostil.
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: conquistou o coração
  rationale: Equivalência idiomática que retém a ideia de vencer ou conquistar a afeição íntima, evitando a literalidade obscura de 'entranhas'.
- source_word: περὶ σοῦ
  choice: a respeito de você
  rationale: Representa naturalmente o valor de περί com genitivo sem decidir em favor da variante com sentido de 'sobre você'.
theological_decisions:
- issue: Agência protetora no versículo 4
  choice: O temor de Deus abriga quem teme a Deus e ama o próximo contra o espírito de Beliar.
  alternative: Entender o temor de Deus somente como estado psicológico subjetivo.
  rationale: A redação grega apresenta o temor de Deus como aquilo pelo qual a pessoa é abrigada; a tradução conserva essa tensão teológica.
- issue: Intercessão de José no versículo 6
  choice: José pede ao pai que ore para que o Senhor não atribua pecado aos irmãos.
  alternative: Apresentar José apenas como alguém que perdoa diretamente, sem referência ao juízo divino.
  rationale: O grego formula explicitamente a misericórdia de José como intercessão relativa à imputação do pecado.
- issue: Expansões cristológicas do versículo 8
  choice: Manter no texto principal a forma mais breve e registrar as expansões entre colchetes da edição em nota.
  alternative: Incorpororar ao texto principal as referências ao Cordeiro de Deus, à morte pelos ímpios, ao sangue da aliança e à destruição de Beliar.
  rationale: Os colchetes editoriais e a tradição textual indicam material secundário ou textualmente instável; registrá-lo em nota preserva a evidência sem tratá-lo silenciosamente como texto seguro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se expressões bíblicas correntes como “guardar os mandamentos”, “temer o Senhor” e “amar o próximo”. A formulação incomum “maldade da aflição” conserva deliberadamente a dificuldade do grego, sem resolver de forma silenciosa sua relação sintática.
