revisions:
- from: '**Testamento de José 14**


    1. Mênfis[a] me viu sendo espancado pelas aberturas das janelas[b] — pois a casa dela ficava perto — e mandou dizer a ele: “Seu julgamento é injusto, pois você castiga como malfeitor um homem livre que foi raptado.” 2. Como eu não mudei meu depoimento, nem mesmo enquanto era espancado, ele ordenou que eu ficasse sob custódia até que chegassem os senhores do rapaz. 3. A mulher dizia ao marido: “Por que você mantém preso e acorrentado esse jovem cativo e de origem nobre, quando ele deveria, em vez disso, estar livre e ser servido?” 4. Ela queria me ver porque estava dominada por um desejo pecaminoso; eu, porém, nada percebia em tudo isso. 5. Ele lhe respondeu: “Entre os egípcios, não se tiram os bens de outra pessoa antes que haja provas.” 6. Portanto, ele disse isso a respeito do mercador.[c] “Quanto ao rapaz, ele deve permanecer confinado.”'
