  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014.yaml
  text: 1[a]. And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust[b], because you punish as a wrongdoer a free man who has been kidnapped.” 2. But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come. 3. And the woman kept saying to her husband[c],
translation:
  language: pt
  text: '**Testamento de José 14**


    1. Mênfis[a] viu-me sendo espancado pelas janelas[b] — pois a casa dela ficava perto — e mandou dizer a ele: “Seu julgamento é injusto, pois você castiga como malfeitor um homem livre que foi raptado.” 2. Como eu não mudei meu depoimento, nem mesmo enquanto era espancado, ele ordenou que eu ficasse sob custódia até que chegassem os senhores do rapaz. 3. A mulher dizia ao marido: “Por que você mantém em correntes esse jovem cativo e de origem nobre, que deveria, antes, estar solto e ser servido?” 4. Pois ela queria ver-me com desejo pecaminoso; eu, porém, nada percebia em tudo isso. 5. Ele lhe respondeu: “Não é próprio dos egípcios tirar os bens de outra pessoa antes que haja provas.” 6. Portanto, ele disse isso a respeito do intermediário.[c] “Quanto ao rapaz, ele deve permanecer confinado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mênfis é aqui o nome de uma mulher, não uma referência direta à cidade egípcia de mesmo nome.
    reason: cultural_note
  - marker: b
    text: O grego pode indicar pequenos vãos ou janelas abertas, e não necessariamente janelas com vidro no sentido moderno.
    reason: lexical_alternative
  - marker: c
    text: O termo grego é raro e de sentido incerto; pode referir-se a um negociante, intermediário ou traficante, conforme o contexto.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεμφίς
  choice: Mênfis
  rationale: Nome próprio transliterado segundo a forma corrente em português; o contexto identifica uma mulher, embora o nome também seja conhecido como topônimo.
- source_word: θυρίδων
  choice: aberturas das janelas
  rationale: O termo designa pequenas janelas ou vãos; a formulação evita sugerir necessariamente janelas modernas com vidro.
- source_word: τυπτόμενόν με
  choice: me viu sendo espancado
  rationale: Preserva o aspecto contínuo do particípio passivo e não especifica um instrumento que o grego não menciona.
- source_word: κλαπέντα ἐλεύθερον
  choice: um homem livre que foi raptado
  rationale: κλαπέντα significa literalmente alguém 'roubado'; aplicado a uma pessoa livre tomada à força, 'raptado' comunica com naturalidade o sentido jurídico e moral.
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: não mudei meu depoimento
  rationale: No contexto de interrogatório e punição, λόγος é o relato ou declaração de José; 'depoimento' torna clara essa função.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: os senhores do rapaz
  rationale: κύριοι indica aqueles que reivindicavam autoridade ou posse sobre ele; 'senhores' conserva a linguagem social da escravidão sem transformar παῖς explicitamente em 'escravo'.
- source_word: αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: esse jovem cativo e de origem nobre
  rationale: Mantém a tensão entre a condição presente de cativo e a origem ou posição nobre expressa por εὐγενῆ.
- source_word: ἄνετον εἶναι καὶ ὑπηρετεῖσθαι
  choice: estar livre e ser servido
  rationale: ἄνετος contrasta com estar em correntes e pode significar solto ou livre; o passivo ὑπηρετεῖσθαι indica receber serviço.
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: dominada por um desejo pecaminoso
  rationale: Expressa o desejo orientado para o pecado sem identificar além do texto a forma exata do ato pretendido.
- source_word: τὰ ἀλλότρια
  choice: os bens de outra pessoa
  rationale: A expressão significa literalmente 'as coisas alheias'; no argumento jurídico, refere-se a propriedade reivindicada por outro.
- source_word: μεταβόλου
  choice: mercador
  rationale: O substantivo raro pode designar negociante, traficante ou intermediário comercial; 'mercador' é abrangente e se ajusta ao comércio humano pressuposto pelo contexto.
- source_word: ἐγκατάκλειστος
  choice: confinado
  rationale: Indica alguém mantido fechado ou detido; 'confinado' conserva essa força sem acrescentar detalhes sobre o local.
theological_decisions:
- issue: Contraste entre liberdade pessoal e posse escravista
  choice: Conservar 'homem livre', 'senhores' e 'bens de outra pessoa'
  alternative: Substituir por 'homem inocente', 'donos' e uma paráfrase que condene explicitamente a escravidão
  rationale: O grego cria deliberadamente uma tensão entre a liberdade legítima de José e as reivindicações de posse feitas sobre ele. A tradução mantém essa linguagem social e jurídica sem suavizá-la nem acrescentar uma avaliação doutrinária externa.
- issue: Natureza do desejo da mulher
  choice: “desejo pecaminoso”
  alternative: “desejo sexual” ou “luxúria”
  rationale: A expressão grega qualifica o desejo pelo pecado, mas não explicita aqui todos os seus contornos; a opção preserva essa relativa abertura, apesar do contexto sugestivo.
translation_notes:
  register: Português moderno, digno e narrativamente fluido, com legibilidade brasileira e vocabulário internacional. A fala judicial foi tornada natural sem apagar a linguagem de status social. A passagem difícil dos versículos 5–6 foi pontuada de modo a distinguir a explicação narrativa sobre o mercador da declaração de que José deveria continuar detido.
