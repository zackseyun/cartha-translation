  source_fidelity: 'O texto traduz todos os elementos do grego: a ligação narrativa (καί), a ação anterior/concomitante de dizer «essas coisas», o gesto de estender os próprios pés e a metáfora de adormecer. «Num sono sereno» preserva adequadamente a qualificação positiva de ὕπνῳ καλῷ, sem acrescentar a noção de eternidade, que não está no grego.'
  naturalness: A redação é fluente, moderna e digna em português de ampla compreensão. «E, depois de dizer essas coisas» é uma resolução natural do particípio aoristo εἰπών, e a repetição intencional de «adormeceu» e «sono» conserva a imagem do original sem soar excessivamente artificial.
  terminology: «Estendeu os pés» é próximo e natural para ἐκτείνας τοὺς πόδας αὐτοῦ. «Adormeceu» mantém o eufemismo/metáfora do grego, sem impor uma interpretação doutrinária. «Sereno» é uma expressão portuguesa idiomática e contextualmente adequada para a qualidade favorável indicada por καλός.
