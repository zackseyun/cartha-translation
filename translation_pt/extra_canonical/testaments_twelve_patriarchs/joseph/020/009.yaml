  text: Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/009.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: pt
  text: E, depois de dizer essas coisas, ele estendeu os pés e adormeceu num sono sereno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: estendeu os pés
  rationale: Reproduz de modo natural e próximo ao grego o gesto de estender os pés, associado ao momento da morte.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Mantém a metáfora do sono presente no verbo grego, sem explicitar 'morreu' e assim sem eliminar sua nuance.
- source_word: ὕπνῳ καλῷ
  choice: num sono sereno
  rationale: καλός pode indicar algo bom, belo ou aprazível; 'sono sereno' comunica em português corrente a qualidade positiva e pacífica da expressão sem introduzir a ideia de eternidade, ausente do texto grego.
theological_decisions:
- issue: O sono como linguagem para a morte
  choice: adormeceu num sono sereno
  alternative: morreu em paz
  rationale: A tradução conserva a imagem deliberada do original e sua possível carga escatológica, sem a resolver numa paráfrase direta.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A construção participial grega foi vertida por oração temporal natural; evitou-se 'belo sono', que seria literal, mas menos idiomático neste contexto.
