  text: And in the exodus of the sons of Israel from Egypt they gathered up the bones of Joseph, and buried him in Hebron with his fathers; and the years of his life were one hundred and ten years.
translation:
  language: pt
  text: E, quando os filhos de Israel saíram do Egito, recolheram os ossos de José e o sepultaram em Hebrom, com seus antepassados. Os anos de sua vida foram cento e dez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἐξόδῳ
  choice: quando ... saíram
  rationale: Expressa de modo natural em português a circunstância temporal da saída, sem depender do termo técnico «êxodo».
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: os filhos de Israel
  rationale: Preserva a expressão genealógica tradicional do grego e sua referência coletiva.
- source_word: συνήγαγον τὰ ὀστᾶ
  choice: recolheram os ossos
  rationale: Reproduz o sentido de reunir e levar consigo os restos mortais de José.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: junto de seus pais
  rationale: Mantém a linguagem ancestral do original, referindo-se à sepultura junto aos antepassados.
- source_word: ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ
  choice: Os anos de sua vida foram
  rationale: Tradução clara e digna da fórmula que declara a duração total da vida.
