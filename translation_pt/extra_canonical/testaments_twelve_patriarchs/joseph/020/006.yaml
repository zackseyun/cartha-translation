source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/006.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: pt
  text: E, depois de dizer essas coisas, estendeu os pés e adormeceu num sono tranquilo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: estendeu os pés
  rationale: Reproduz de modo natural e próximo a ação descrita pelo grego, possivelmente o gesto de quem se deita para morrer, sem explicitá-lo além do texto.
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Preserva o eufemismo e a imagem do sono, sem substituir diretamente por “morreu”.
- source_word: ὕπνῳ καλῷ
  choice: num sono tranquilo
  rationale: καλός significa literalmente “belo/bom”; em português, “sono tranquilo” comunica de modo idiomático a qualidade serena e favorável do sono, sem a formulação pouco natural “belo sono”.
theological_decisions:
- issue: O sono como possível eufemismo para a morte
  choice: adormeceu num sono tranquilo
  alternative: morreu serenamente
  rationale: Mantém a linguagem figurada do original e sua possível tensão entre sono e morte, evitando resolver implicitamente a metáfora.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura narrativa fluente. Conserva a repetição semântica entre “adormeceu” e “sono”, presente no grego, de maneira aceitável em português.
