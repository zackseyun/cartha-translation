base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/002.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: pt
  text: E vocês levarão os meus ossos com vocês. Pois, quando os meus ossos forem levados para lá, o Senhor estará com vocês na luz, e Belial estará com os egípcios nas trevas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: levarão ... com vocês
  rationale: Expressa o movimento de levar para cima ou para fora juntamente com o grupo, em português natural, sem sobrecarregar a frase.
- source_word: τὰ ὀστᾶ μου
  choice: os meus ossos
  rationale: Tradução direta, preservando a referência aos restos mortais de José.
- source_word: ἀναγομένων
  choice: forem levados
  rationale: Mantém a forma passiva do grego e o sentido de transporte para o destino mencionado.
- source_word: ἐν φωτί
  choice: na luz
  rationale: Preserva a imagem simbólica e a oposição explícita a «nas trevas».
- source_word: Βελίαρ
  choice: Belial
  rationale: Adota a forma portuguesa tradicional do nome, sem interpretar sua identidade ou função.
- source_word: ἐν σκότει
  choice: nas trevas
  rationale: Mantém o contraste metafórico com a luz em linguagem bíblica corrente e inteligível.
theological_decisions:
- issue: Natureza da presença do Senhor e de Belial
  choice: «o Senhor estará com vocês na luz, e Belial estará com os egípcios nas trevas»
  alternative: Explicitar luz como salvação e trevas como condenação
  rationale: O texto formula a oposição por imagens e não define seu alcance teológico; a tradução preserva essa tensão sem acrescentar interpretação denominacional.
- issue: Referente espacial de ἐκεῖ
  choice: «para lá»
  alternative: Nomear Canaã ou a terra prometida
  rationale: O advérbio grego é deixado sem referente explícito neste versículo; mantém-se a referência contextual sem especificação indevida.
translation_notes:
  register: Português moderno, digno e de leitura natural, com construções amplamente compreensíveis no Brasil e em outras comunidades lusófonas. A coordenação e o paralelismo luz/trevas foram preservados.
