  text: '*Ὑμεῖς δὲ¹⁰ συνανοίσετε¹¹ τὰ ὀστᾶ μου¹² μεθ᾽ ὑμῶν¹³, ⌜ὅτι, ἀναγομένων¹⁴ τῶν ὀστέων ἐκεῖ¹⁵, Κύριος ἐν φωτὶ ἔσται μεθ᾽ ὑμῶν¹⁶, καὶ ὁ¹⁷ Βελίαρ *ἐν σκότει ἔσται¹⁸ μετὰ τῶν Αἰγυπτίων⌉.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/005.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: pt
  text: Mas vocês levarão consigo os meus ossos, pois, quando os ossos forem levados para lá, o Senhor estará com vocês na luz, e Beliar[a] estará com os egípcios nas trevas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também conhecido pela forma “Belial”.
    reason: Ajuda o leitor a reconhecer o nome sem apagar a forma Βελίαρ usada no texto grego.
lexical_decisions:
- source_word: συνανοίσετε
  choice: levarão consigo
  rationale: Expressa o sentido de transportar juntamente consigo, preservando o movimento indicado pelo verbo composto sem tornar a frase artificial.
- source_word: ἀναγομένων
  choice: forem levados para lá
  rationale: Mantém a forma passiva e a ideia de levar para cima ou para outro lugar; em português, o destino é expresso naturalmente por “para lá”, correspondente a ἐκεῖ.
- source_word: ἐν φωτί / ἐν σκότει
  choice: na luz / nas trevas
  rationale: Conserva o contraste simbólico e teológico direto do grego, sem explicar ou reduzir sua ambiguidade.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma grega presente nesta obra, em vez de substituí-la silenciosamente pela forma bíblica portuguesa mais conhecida, “Belial”.
theological_decisions:
- issue: Natureza da presença do Senhor “na luz” e de Beliar “nas trevas”
  choice: 'Preservar literalmente o paralelismo: “o Senhor estará com vocês na luz” e “Beliar estará com os egípcios nas trevas”.'
  alternative: Interpretar a luz como proteção divina e as trevas como condenação ou ignorância espiritual.
  rationale: O texto emprega imagens teologicamente carregadas sem explicá-las; a tradução mantém essa tensão e evita impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no mundo lusófono. O contraste poético entre luz e trevas foi preservado.
