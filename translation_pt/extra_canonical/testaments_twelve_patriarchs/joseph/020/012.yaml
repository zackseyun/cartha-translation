source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/012.yaml
  text: For his kingdom will be an everlasting kingdom that will not pass away. But my kingdom among you is brought to completion, like a watchman’s hut in an orchard, which disappears after the summer.”
translation:
  language: pt
  text: Pois o reino dele será um reino eterno, que não passará. Mas o meu reino entre vocês é levado a termo, como uma cabana de vigia em um pomar, que desaparece depois do verão.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία αὐτοῦ
  choice: o reino dele
  rationale: Mantém a referência pronominal do grego sem identificar explicitamente o referente, preservando a continuidade e a ambiguidade do contexto.
- source_word: βασιλεία ἔσται αἰώνιος
  choice: será um reino eterno
  rationale: Reproduz de modo natural a predicação grega e conserva o contraste entre o reino eterno dele e o reino transitório de José.
- source_word: οὐ παρελεύσεται
  choice: não passará
  rationale: Equivalência direta e idiomática, adequada à linguagem bíblica corrente.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: No contexto coletivo, expressa naturalmente a presença ou vigência do reino no meio dos destinatários, sem sugerir necessariamente interioridade individual.
- source_word: ἐπιτελεῖται
  choice: chega ao fim
  rationale: O presente passivo/médio pode indicar que algo é completado ou levado ao seu termo. Aqui, a imagem da cabana que desaparece favorece a ideia de término, sem acrescentar uma causa externa não expressa.
- source_word: ὀπωροφυλάκιον
  choice: cabana de vigia num pomar
  rationale: Designa uma estrutura temporária usada por quem guardava frutos; a formulação explicita sua função em português corrente.
- source_word: μετὰ τὸ θέρος
  choice: depois do verão
  rationale: θέρος pode designar o verão ou a época da colheita. A escolha conserva o sentido sazonal primário e corresponde bem à transitoriedade da cabana.
- source_word: ἐξαφανίζεται
  choice: desaparece
  rationale: Traduz diretamente a ideia de deixar de ser visível ou desaparecer.
theological_decisions:
- issue: Contraste entre “o reino dele” e “o meu reino”
  choice: Preservar os dois referentes distintos sem identificá-los no texto
  alternative: Explicitar a identidade daquele a quem “dele” se refere
  rationale: O versículo grego usa apenas o pronome αὐτοῦ. Nomear o referente resolveria no texto uma questão que depende do contexto e poderia importar uma interpretação específica.
- issue: Sentido de ἐπιτελεῖται aplicado ao reino de José
  choice: “chega ao fim”
  alternative: “é levado à consumação” ou “é completado”
  rationale: A comparação com uma cabana sazonal que desaparece aponta para o encerramento do reino. “Chega ao fim” comunica essa tensão claramente sem atribuir-lhe uma consumação escatológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o paralelismo e o contraste do grego. Não foram criadas notas, pois os números e sinais da edição fornecida são marcas crítico-editoriais sem conteúdo de aparato disponível para tradução segura.
