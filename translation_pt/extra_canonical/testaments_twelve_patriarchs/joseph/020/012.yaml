review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração é bem traduzida: «Pois o reino dele será um reino eterno, que não passará» preserva o futuro, a duração eterna e o pronome não identificado. Porém, «chega ao fim» para ἐπιτελεῖται torna o verbo mais explicitamente terminal do que «é completado/levado a termo». Embora a imagem final seja de desaparecimento sazonal, o grego emprega ἐπιτελεῖται, não um verbo de cessar; convém manter a noção de cumprimento ou completamento e deixar que a comparação expresse a transitoriedade.'
  naturalness: «É levado a termo entre vocês» é compreensível, formal sem ser arcaico, e preserva a voz e o aspecto presentes do grego melhor que «chega ao fim». «Em um pomar» evita a contração regionalmente marcada «num», mantendo leitura natural em português internacional.
  terminology: «Reino», «eterno», «não passará», «pomar» e «cabana de vigia» são escolhas adequadas. Mantém-se «dele» e «meu» sem identificar os referentes, como faz o texto-fonte. Não há termos teológicos que exijam padronização adicional neste versículo.
  issues:
  - severity: medium
    issue: «chega ao fim» para ἐπιτελεῖται
    rationale: A expressão interpreta o verbo como cessação. Ἐπιτελεῖται significa primariamente ser completado, cumprido ou levado a termo; a ideia de desaparecimento pertence à cabana na comparação subsequente. Uma formulação de completamento preserva melhor a distinção.
  - severity: low
    issue: «num pomar»
    rationale: É natural no português brasileiro, mas «em um pomar» é mais neutro para o alvo internacional e não altera o sentido.
  revised_text: Pois o reino dele será um reino eterno, que não passará. Mas o meu reino entre vocês é levado a termo, como uma cabana de vigia em um pomar, que desaparece depois do verão.”
