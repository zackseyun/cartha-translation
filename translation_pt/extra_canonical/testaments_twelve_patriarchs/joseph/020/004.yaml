  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/004.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good sleep.
translation:
  language: pt
  text: E, depois de dizer essas coisas, estendeu os pés e adormeceu num sono tranquilo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: adormeceu
  rationale: Traduz diretamente o aoristo passivo de κοιμάω em seu sentido idiomático de entrar no sono, preservando também a possível conotação eufemística de morte no contexto.
- source_word: ὕπνῳ καλῷ
  choice: num sono tranquilo
  rationale: καλός qualifica positivamente o sono; em português, “sono tranquilo” é natural e digno, sem introduzir a ideia não expressa de “boa velhice”.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: estendeu os pés
  rationale: Mantém de perto a imagem corporal do grego, em construção natural no português.
theological_decisions:
- issue: Possível eufemismo de morte em ἐκοιμήθη
  choice: adormeceu
  alternative: morreu
  rationale: O grego formula o acontecimento como sono. Traduzir por “morreu” resolveria explicitamente uma figura cuja ambiguidade deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e sem expansão interpretativa.
