id: T12P.JOS.20.1
reference: Testament of Joseph 20:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/001.yaml
  text: For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.
translation:
  language: pt
  text: Pois sei que, depois da minha morte, os egípcios oprimirão vocês; mas Deus fará justiça por vocês e os conduzirá às promessas feitas aos seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψουσιν
  choice: oprimirão
  rationale: Expressa de modo natural a ideia de afligir, pressionar ou sujeitar a sofrimento no contexto da futura opressão no Egito.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: fará justiça por vocês
  rationale: Preserva o sentido de ação divina em resposta ao mal sofrido, sem sugerir que os destinatários executam vingança pessoal. A construção com ὑμῶν admite a ideia de vindicação em favor deles.
- source_word: ἐπάξει
  choice: os conduzirá
  rationale: Traduz o movimento causativo de levar ou conduzir, sem acrescentar a noção de retorno, ausente do grego.
- source_word: τὰς ἐπαγγελίας
  choice: às promessas feitas
  rationale: Mantém o plural explícito do texto grego; 'feitas' torna idiomática em português a relação entre as promessas e os antepassados.
- source_word: τῶν πατέρων ὑμῶν
  choice: aos seus antepassados
  rationale: No contexto ancestral, 'antepassados' comunica com clareza o sentido de πατέρων e evita a possível leitura limitada aos pais imediatos.
theological_decisions:
- issue: Sentido de ἐκδίκησιν ὑμῶν
  choice: fará justiça por vocês
  alternative: executará a vingança de vocês
  rationale: A opção escolhida preserva a vindicação divina e a ambiguidade do genitivo quanto ao interesse dos destinatários, evitando em português a impressão de uma vingança pertencente ou delegada a eles.
- issue: Relação dos destinatários com as promessas
  choice: os conduzirá às promessas
  alternative: os reconduzirá às promessas
  rationale: Não se acrescenta 'de volta', pois o verbo grego não explicita retorno. A formulação conserva a imagem incomum de entrar no cumprimento ou âmbito das promessas sem substituí-la por uma interpretação teológica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega 'vocês' para o plural e evita arcaísmos. A tradução mantém 'promessas' no plural e não acrescenta a ideia de retorno.
