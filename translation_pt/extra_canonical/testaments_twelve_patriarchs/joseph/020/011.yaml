id: T12P.JOS.20.11
reference: Testament of Joseph 20:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/011.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman’s hut in an orchard, which vanishes after the summer.
translation:
  language: pt
  text: Pois o reino dele será um reino eterno, que não passará. Mas o meu reino entre vocês chegará ao fim, como uma cabana de vigia num pomar[a], que desaparece depois do verão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “numa plantação de frutas”.'
    reason: ὀπωροφυλάκιον pode referir-se à cabana de um vigia em pomar, vinha ou plantação de frutos; a nota preserva a amplitude da imagem agrícola.
lexical_decisions:
- source_word: βασιλεία
  choice: reino
  rationale: Equivalente natural e tradicional que preserva tanto a ideia de domínio quanto a realidade do reino no contexto.
- source_word: αἰώνιος
  choice: eterno
  rationale: Expressa de modo claro a duração ilimitada do reino, em contraste com o reino passageiro de José.
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: Neste contexto coletivo, indica a presença ou continuidade do reino de José no meio de seus descendentes, sem sugerir necessariamente interioridade.
- source_word: ἐπιτελεῖται
  choice: chegará ao fim
  rationale: O contraste com o reino eterno e a comparação com a cabana que desaparece favorecem o sentido de término ou cessação, embora o verbo também possa significar ser completado.
- source_word: ὀπωροφυλάκιον
  choice: cabana de vigia num pomar
  rationale: Designa uma construção temporária usada por um guarda para vigiar frutos ou plantações; a formulação é compreensível em português atual.
- source_word: θέρος
  choice: verão
  rationale: Mantém o sentido sazonal básico do grego e corresponde à imagem de uma estrutura temporária removida após a estação.
theological_decisions:
- issue: Contraste entre o reino eterno de “dele” e o reino de José
  choice: Manter os referentes pronominais sem identificar explicitamente quem é “ele”
  alternative: Explicitar um referente messiânico ou divino
  rationale: O versículo grego usa apenas o pronome αὐτοῦ; explicitar uma identidade importaria uma interpretação não declarada no texto.
- issue: Sentido de ἐπιτελεῖται aplicado ao reino de José
  choice: “chegará ao fim”
  alternative: “será levado à conclusão”
  rationale: A metáfora seguinte enfatiza desaparecimento e transitoriedade, tornando “chegará ao fim” a leitura contextual mais natural, sem transformar o fim em destruição violenta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural. A sintaxe conserva o contraste enfático entre os dois reinos e a imagem rural temporária.
