  text: And all Israel and all Egypt mourned him with great mourning.
translation:
  language: pt
  text: E todo o Israel e todo o Egito prantearam-no com grande lamento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπένθησεν
  choice: prantearam-no
  rationale: Expressa o luto manifestado pela morte de alguém e preserva o referente pronominal de αὐτόν. O plural é natural em português diante do sujeito composto, embora o grego empregue o singular com dois coletivos.
- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  choice: todo o Israel e todo o Egito
  rationale: Mantém a abrangência enfática de πᾶς/πᾶσα e os nomes coletivos do texto grego.
- source_word: πένθος μέγα
  choice: com grande lamento
  rationale: Conserva a intensificação e, junto de “prantearam”, reflete a repetição etimológica do grego sem produzir uma construção excessivamente artificial em português.
theological_decisions: []
translation_notes:
  register: Português moderno, solene e acessível. A formulação preserva a ênfase coletiva e a figura de repetição entre o verbo de prantear e o substantivo “lamento”. O sobrescrito 31 da edição parece ser um sinal de aparato crítico, não uma nota integrante do texto; como seu conteúdo não foi fornecido, não foi transformado em nota da tradução.
