  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002.yaml
  text: And this man[a], Pharaoh’s chief cook, entrusted his house to me. And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame. I was imprisoned, I was beaten, I was mocked; and the Lord gave me compassion in the sight of the jailer. For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress[b]. For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, does he become weak or terrified. But in all these things he takes the lead[c], and in various ways he gives comfort.
translation:
  language: pt
  text: '## Testamento de José 2


    1 E este homem[a], o cozinheiro-chefe do faraó, confiou-me a sua casa. 2 Lutei contra uma mulher sem vergonha, que insistia para que eu transgredisse com ela; mas o Deus de meu pai me livrou de uma chama ardente.[b] 3 Fui preso, espancado e ridicularizado; e o Senhor fez com que eu encontrasse compaixão diante do carcereiro. 4 Pois o Senhor não abandona os que o temem, nem nas trevas, nem nas correntes, nem nas aflições, nem nas angústias. 5 Porque Deus não sente vergonha como um homem, não se acovarda como um filho de homem, nem, como um ser nascido da terra, enfraquece ou fica aterrorizado.[c] 6 Em todas essas coisas, porém, ele está à frente[d] e traz consolo de diversas maneiras. Por pouco tempo ele se afasta, a fim de pôr à prova o propósito da alma. 7 Em dez provações ele demonstrou que eu era aprovado, e em todas elas mantive-me paciente. Pois a paciência é um poderoso remédio, e a perseverança concede muitos bens.


    [a] O termo grego traduzido como “cozinheiro-chefe” pode também ser entendido como um título de alto funcionário da corte, à luz do relato de José no Egito em Gênesis.


    [b] A “chama ardente” provavelmente representa o perigo abrasador da tentação sexual, mas o grego preserva a imagem sem explicá-la.


    [c] Alguns testemunhos apresentam variação quanto às palavras “enfraquece ou”; a ideia de ficar aterrorizado permanece segura no texto.


    [d] O verbo grego pode significar “estar à frente”, “presidir”, “amparar” ou “cuidar”. A tradução conserva tanto a ideia de liderança quanto a de cuidado protetor.'
  philosophy: optimal-equivalence
  footnotes:
