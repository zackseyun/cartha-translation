lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: cozinheiro-chefe
  rationale: O composto grego está lexicalmente ligado à cozinha. A tradução mantém essa transparência, enquanto a nota registra que pode tratar-se de um título cortesão mais amplo.
- source_word: ἠγωνισάμην
  choice: lutei
  rationale: Expressa um conflito moral ativo contra a sedução, sem especificar combate físico.
- source_word: γυναῖκα ἀναιδῆ
  choice: uma mulher sem vergonha
  rationale: ἀναιδής indica ausência de vergonha ou de contenção moral; a expressão é direta e corrente em português.
- source_word: ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς
  choice: que insistia para que eu transgredisse com ela
  rationale: O particípio sugere pressão continuada, e παρανομεῖν conserva um sentido moral e legal mais amplo que “cometer adultério”.
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  choice: me livrou de uma chama ardente
  rationale: Mantém intacta a metáfora vívida do grego, sem substituí-la por uma explicação sobre desejo ou adultério.
- source_word: ἔδωκέ με ... εἰς οἰκτιρμούς
  choice: fez com que eu encontrasse compaixão
  rationale: Expressa em português natural o resultado da construção grega, preservando οἰκτιρμοί como compaixão, em vez de reduzi-lo genericamente a favor.
- source_word: τοὺς φοβουμένους αὐτόν
  choice: os que o temem
  rationale: Preserva a linguagem tradicional do temor de Deus e sua dimensão ética e reverente.
- source_word: προΐσταται
  choice: se põe à frente
  rationale: Mantém a imagem de estar à frente, com possíveis sentidos de liderança, proteção e cuidado, sem acrescentar um objeto ausente do grego.
- source_word: τὸ διαβούλιον
  choice: o propósito
  rationale: No contexto de prova interior, designa a resolução, intenção ou deliberação da alma; “propósito” é claro sem eliminar essa amplitude.
- source_word: μακροθυμία / ὑπομονή
  choice: paciência / perseverança
  rationale: Distingue a disposição paciente e longânime da firmeza que suporta e permanece, usando termos atuais e inteligíveis.
theological_decisions:
- issue: Referência em τοῦ πατρός μου
  choice: o Deus de meu pai
  alternative: o Deus de meus pais
  rationale: O grego está no singular e, no testemunho autobiográfico de José, aponta naturalmente para seu pai, Jacó.
- issue: Sentido da chama ardente
  choice: Preservar a metáfora
  alternative: Explicitar como fogo da paixão ou tentação sexual
  rationale: O contexto sugere a referência sexual, mas o texto não desfaz a imagem; a nota informa a provável força sem inseri-la no corpo.
- issue: Modo da presença divina em προΐσταται
  choice: ele se põe à frente
  alternative: ele preside; ele ampara; ele cuida
  rationale: A formulação conserva a tensão entre liderança, supervisão e auxílio protetor.
- issue: Afastamento temporário de Deus
  choice: Por pouco tempo ele se afasta
  alternative: Por pouco tempo parece afastar-se
  rationale: O grego afirma o afastamento sem incluir “parece”; acrescentar essa ressalva resolveria uma tensão teológica que o texto preserva.
- issue: Resultado das dez provações
  choice: ele demonstrou que eu era aprovado
  alternative: ele me tornou aprovado; ele comprovou minha fidelidade
  rationale: A tradução mantém Deus como sujeito e José como alguém cuja qualidade é revelada pela prova, sem afirmar de modo indevido que a provação produziu sua fidelidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O período retórico foi preservado sem arcaísmos excessivos. Mantiveram-se as imagens de fogo, trevas e correntes, bem como a tensão da afirmação de que Deus se afasta por pouco tempo para provar o propósito da alma.
