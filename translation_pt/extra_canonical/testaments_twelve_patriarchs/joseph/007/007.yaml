  source_fidelity: A tradução preserva bem a interpelação, a imagem de autocegamento no pecado, a ameaça aos filhos e, corretamente, a mudança de sujeito entre «espancará» (Astho) e «ἀπολέσεις» (a mulher interpelada). Contudo, «você perderá ... toda lembrança de si» enfraquece o valor ativo de ἀπολέσεις («destruirás/farás desaparecer») e soa pouco idiomático em português.
  naturalness: O texto é claro e de registro adequado. A formulação final pode ser mais natural e precisa com «você fará desaparecer da terra toda lembrança de você».
  terminology: «Concubina», «rival» e «espancará» são escolhas adequadas. «Infeliz» traduz de modo natural o vocativo ἄθλια sem acrescentar «mulher», ausente do grego.
  issues:
