base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/007.yaml
  text: “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband’s concubine, your rival, will beat your children and wipe out your memory from the earth.”
translation:
  language: pt
  text: “Por que, infeliz, você está inquieta e agitada, cegando a si mesma com pecados? Lembre-se de que, se tirar a própria vida, Astho, a concubina de seu marido, sua rival, espancará seus filhos, e você fará desaparecer da terra toda lembrança de você.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄθλια
  choice: infeliz
  rationale: Mantém o vocativo de censura e compaixão sem recorrer ao pouco natural «miserável mulher».
- source_word: τάρασσον καὶ θορυβῇ
  choice: está inquieta e agitada
  rationale: Reproduz os dois termos próximos que descrevem perturbação interior e tumulto.
- source_word: ἐν ἁμαρτίαις τυφλώττουσα
  choice: cegando a si mesma com pecados
  rationale: Preserva a imagem reflexiva de cegueira e a relação instrumental ou circunstancial dos pecados, sem explicar além do grego.
- source_word: ἀνέλῃς σεαυτήν
  choice: tirar a própria vida
  rationale: Expressão portuguesa natural e inequívoca para matar a si mesma.
- source_word: παλλακὴ
  choice: concubina
  rationale: Equivalente histórico e relacional direto do substantivo grego.
- source_word: ἀντίζηλός
  choice: rival
  rationale: Expressa a rivalidade entre mulheres vinculadas ao mesmo homem.
- source_word: κονδυλίσει
  choice: espancará
  rationale: Transmite violência física reiterada ou severa; é mais adequado ao contexto do que o mais brando «baterá».
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  choice: você perderá da terra toda lembrança de si
  rationale: Conserva o sujeito da forma verbal grega («você perderá»), evitando transformá-lo em ação de Astho, como faz a camada inglesa.
theological_decisions:
- issue: Agência na perda da memória
  choice: A mulher «perderá» sua lembrança da terra como consequência de sua morte.
  alternative: Astho apagará a memória da mulher da terra.
  rationale: O grego muda de κονδυλίσει, terceira pessoa singular, para ἀπολέσεις, segunda pessoa singular; a tradução preserva essa mudança em vez de harmonizar os dois verbos sob o mesmo agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por «você» para refletir com clareza as formas de segunda pessoa. A coordenação final conserva a mudança de sujeito presente no grego.
