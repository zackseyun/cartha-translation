    issue: O verbo final é traduzido como perda passiva.
    rationale: 'ἀπολέσεις é futuro ativo de segunda pessoa: a mulher é apresentada como quem destruirá/fará desaparecer sua própria memória da terra por meio do suicídio. «Você perderá» comunica a consequência, mas não a agência expressa pelo grego.'
