revisions:
- from: 'Então, aproveitando uma oportunidade, ela entrou correndo até onde eu estava, enquanto o marido ainda estava fora, e me disse: “Estou sufocando! Vou me jogar de um precipício se você não se deitar comigo.”'
  to: 'Então, aproveitando uma oportunidade, ela irrompeu até onde eu estava, enquanto o marido ainda estava fora, e me disse: “Estou sufocando, ou vou me jogar de um precipício, se você não se deitar comigo.”'
  rationale: A revisão restaura a disjunção expressa no grego e ajusta o verbo de movimento para refletir melhor seu ímpeto. Mantêm-se o tom coercitivo, a ambiguidade dramática de «Estou sufocando» e o eufemismo sexual do original.
