  text: Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking, or I will throw myself down a cliff, if you do not lie with me.”
translation:
  language: pt
  text: 'Então, aproveitando uma oportunidade, ela irrompeu até onde eu estava, enquanto o marido ainda estava fora, e me disse: “Estou sufocando, ou vou me jogar de um precipício, se você não se deitar comigo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκαιρίαν λαβοῦσα
  choice: aproveitando uma oportunidade
  rationale: Expressa de modo natural a ideia de encontrar ou obter uma ocasião favorável.
- source_word: εἰσεπήδησε πρός με
  choice: entrou correndo até onde eu estava
  rationale: Preserva tanto o movimento impetuoso indicado pelo verbo quanto a direção em relação a José.
- source_word: Ἄγχομαι
  choice: Estou sufocando
  rationale: Mantém o sentido concreto e dramático do presente grego sem tentar explicar se a fala descreve angústia, falta de ar ou ameaça de enforcamento.
- source_word: εἰς κρημνὸν ῥίπτω ἐμαυτήν
  choice: Vou me jogar de um precipício
  rationale: Formulação idiomática em português que comunica claramente a ameaça de lançar a si mesma de um lugar escarpado.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: se deitar comigo
  rationale: Traduz diretamente o eufemismo sexual do contexto sem recorrer a uma expressão clínica ou excessivamente explícita.
