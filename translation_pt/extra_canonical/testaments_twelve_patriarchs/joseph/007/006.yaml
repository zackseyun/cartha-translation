  text: But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,
translation:
  language: pt
  text: 'Mas eu, percebendo que o espírito de Beliar a perturbava, orei ao Senhor e lhe disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: percebendo
  rationale: Expressa compreensão ou discernimento da situação em português natural, sem sugerir conhecimento meramente intelectual.
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: o espírito de Beliar
  rationale: Mantém a construção genitiva e translitera o nome próprio conforme a forma tradicional presente na fonte de consulta.
- source_word: ἐνοχλεῖ αὐτήν
  choice: a atormentava
  rationale: No contexto, o verbo indica aflição ou perturbação intensa; “atormentava” comunica isso com clareza e dignidade.
- source_word: προσευξάμενος τῷ Κυρίῳ
  choice: orei ao Senhor
  rationale: 'Converte naturalmente o particípio aoristo em verbo coordenado, preservando a sequência: discerniu, orou e falou.'
- source_word: εἶπον πρὸς αὐτήν
  choice: lhe disse
  rationale: Forma idiomática e concisa em português para dirigir palavras a uma pessoa feminina já identificada.
theological_decisions:
- issue: Natureza da ação do espírito de Beliar
  choice: a atormentava
  alternative: a incomodava
  rationale: “Atormentava” representa melhor a força contextual de ἐνοχλεῖ sem definir se a ação era possessão, influência ou opressão; assim, não se resolve uma questão que o texto deixa aberta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção participial grega foi vertida como sequência verbal natural. Os dois complementos pronominais femininos referem-se à mesma mulher, sem necessidade de repetição.
