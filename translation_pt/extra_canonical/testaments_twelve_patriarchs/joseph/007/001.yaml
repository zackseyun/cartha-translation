source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἵνα δὲ⁴⁵ μάθῃς⁴⁶, ὅτι⁴⁷ τῶν⁴⁸ ἐν σωφροσύνῃ θεοσεβούντων⁴⁹ οὐ κατισχύσει⁵⁰ κακία⁵¹ *τῶν ἀσεβούντων⁵². ⌈Ἰδοὺ⌉⁵³ λαβὼν⁵⁴ *ἐξ αὐτοῦ ἐνώπιόν σου ἐσθίων. Καὶ τοῦτο εἰπὼν εἶπον οὕτως⁵⁵. Ὁ Θεὸς τῶν πατέρων μου καὶ ὁ ἄγγελος Ἀβραὰμ⁵⁶ *ἔσται μετ᾽ ἐμοῦ⁵⁷. ⌈Ἔφαγον⌉⁵⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/001.yaml
  text: 'So that you may learn that the wickedness of the ungodly will not prevail over those who fear God with self-control, look: taking some of it in your presence, I will eat. And after saying this, I said thus, “The God of my fathers and the angel of Abraham will be with me.” And I ate.'
translation:
  language: pt
  text: 'Mas, para que você saiba que a maldade dos ímpios não prevalecerá contra os que reverenciam a Deus com domínio próprio, veja: tomarei um pouco disso e comerei diante de você.[a] Depois de dizer isso, falei assim: “O Deus dos meus pais e o anjo de Abraão estará comigo”.[b] E comi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego desta oração é abrupto e traz literalmente formas equivalentes a “tomando um pouco disso, comendo diante de você”; o sentido futuro expresso no texto é inferido pelo contexto.
    reason: Sinalizar a construção incompleta ou elíptica do texto grego sem reproduzir uma frase ininteligível em português.
  - marker: b
    text: O grego usa o verbo no singular, literalmente “estará comigo”, apesar de mencionar “o Deus dos meus pais e o anjo de Abraão”. A construção também pode ser entendida como irregular ou como possível aposição.
    reason: Preservar a ambiguidade gramatical e teológica em vez de resolvê-la silenciosamente.
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: com domínio próprio
  rationale: O termo designa sensatez, autocontrole ou castidade; “domínio próprio” preserva sua amplitude, embora o contexto de José inclua pureza sexual.
- source_word: θεοσεβούντων
  choice: os que reverenciam a Deus
  rationale: Expressa devoção e temor respeitoso diante de Deus sem limitar o sentido apenas a culto ritual.
- source_word: κατισχύσει
  choice: prevalecerá contra
  rationale: Reproduz a ideia de ganhar força sobre alguém, dominá-lo ou vencê-lo.
- source_word: ὁ ἄγγελος Ἀβραάμ
  choice: o anjo de Abraão
  rationale: Mantém a relação genitiva do grego sem decidir se significa o anjo protetor, acompanhante ou associado a Abraão.
theological_decisions:
- issue: Relação entre “o Deus dos meus pais” e “o anjo de Abraão”
  choice: Mantê-los como duas expressões coordenadas, sem identificar uma com a outra
  alternative: Entender “o anjo de Abraão” como uma aposição ou manifestação do Deus dos pais
  rationale: O grego coordena as expressões com καί, mas usa verbo no singular; essa irregularidade não basta para impor uma identificação teológica.
- issue: Sentido ético de σωφροσύνη
  choice: Usar “domínio próprio” no texto e registrar a possibilidade de “castidade”
  alternative: Traduzir diretamente por “castidade” ou “pureza sexual”
  rationale: O contexto favorece a dimensão sexual, mas o campo semântico do termo é mais amplo e inclui autocontrole e sensatez.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a repetição “Depois de dizer isso, falei assim” por corresponder à formulação enfática do original.
