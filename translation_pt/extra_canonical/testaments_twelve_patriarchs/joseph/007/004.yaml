base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/004.yaml
  text: And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he healed her with words.
translation:
  language: pt
  text: 'Quando o marido dela a viu, perguntou-lhe: “Por que o seu rosto está abatido?[a]” Ela lhe respondeu: “Sofro uma dor no coração, e os gemidos do meu espírito me oprimem.” Então ele a curou com palavras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “Por que o seu rosto caiu?”'
    reason: Registra a forma concreta da expressão grega, enquanto o texto principal apresenta seu sentido idiomático em português natural.
lexical_decisions:
- source_word: συνέπεσε τὸ πρόσωπόν σου
  choice: o seu rosto está abatido
  rationale: Reproduz em português natural o sentido da expressão grega, literalmente ligada a um rosto que ‘caiu’, isto é, que revela tristeza ou aflição.
- source_word: πόνον καρδίας ἐγὼ ἀλγῶ
  choice: Sofro uma dor no coração
  rationale: Mantém tanto a ideia explícita de sofrimento quanto a localização figurada da dor no coração, sem reduzir a frase apenas a ‘estou angustiada’.
- source_word: οἱ τοῦ πνεύματος στεναγμοί
  choice: os gemidos do meu espírito
  rationale: Preserva a linguagem interior e pessoal do grego; o possessivo decorre do contexto e corresponde ao sentido expresso na fala.
- source_word: συνέχουσί με
  choice: me oprimem
  rationale: Comunica a força constrangedora ou sufocante do verbo sem recorrer à formulação pouco natural ‘me mantêm presa’.
- source_word: ἐθεράπευσεν αὐτὴν ἐν λόγοις
  choice: ele a curou com palavras
  rationale: Traduz diretamente o valor de ‘curar’ e o meio empregado, sem acrescentar que ele apenas tentou fazê-lo nem substituir a cura por mero consolo.
theological_decisions:
- issue: Sentido de πνεύματος
  choice: meu espírito
  alternative: Espírito
  rationale: O contexto descreve os gemidos interiores da mulher e não fornece indicação de referência ao Espírito divino; a minúscula preserva esse sentido contextual sem introduzir uma identificação teológica.
- issue: Força de ἐθεράπευσεν
  choice: a curou
  alternative: a consolou / tentou curá-la
  rationale: O verbo afirma a cura de modo direto. Formulações como ‘tentou curá-la’ acrescentariam incerteza ausente do texto, enquanto ‘consolou’ enfraqueceria a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O diálogo usa formas correntes sem coloquialismo excessivo; o tempo presente histórico do grego foi vertido no passado para manter uma narrativa natural em português.
