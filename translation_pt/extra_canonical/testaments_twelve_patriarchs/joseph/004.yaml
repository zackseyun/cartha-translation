  text: '9[a]. And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I recognized her deceit and her delusion.

    10. And I spoke to her words of the Most High, to see whether perhaps she might turn back from her evil desire.

    11. So then, many times[b], as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.

    12. For she openly extolled me as chaste with respect to the bed, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded concerning your purity, and even if someone should tell him about us, he will not believe it.”

    13. In all these things I, lying low on the ground, kept begging the God of my fathers that he would rescue me from her deceit.

    14. Since she accomplished nothing in this way, again she began to come to me with words of instruction, wanting to learn the word of God.

    15. And she says to me, “If you want me to leave behind the idols, I will persuade my husband to withdraw from them, and we will go before your Lord, walking in the law of your Lord.”

    16. But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”

    17. But she kept contending, wanting to fulfill her desire.

    18. And I added fasting and prayer[d][c], so that the Lord might rescue me from her.'
translation:
  language: pt
  text: '9. Quando compreendi, fiquei angustiado até a morte. Mas, depois que ela saiu, voltei a mim e lamentei por ela durante muitos dias, pois reconheci seu ardil e seu engano.


    10. E eu lhe dizia palavras do Altíssimo, para ver se porventura ela se afastaria de seu desejo perverso.


    11. Muitas vezes, portanto, ela me lisonjeava com palavras, como se eu fosse um homem santo; e, com ardil, elogiava meu domínio próprio diante do marido, querendo fazer-me tropeçar quando estivéssemos a sós.


    12. Pois em público ela me exaltava como homem casto, mas em segredo me dizia: “Não tenha medo do meu marido, porque ele está convencido de sua castidade. Mesmo que alguém lhe fale a nosso respeito, ele não acreditará”.


    13. Em tudo isso, eu, dormindo no chão[a], suplicava continuamente a Deus que me livrasse do ardil dela.


    14. Como nada conseguiu dessa maneira, ela voltou a vir a mim, sob pretexto de instrução, para aprender a palavra de Deus.


    15. E ela me disse: “Se você quer que eu abandone os ídolos, una-se a mim, e eu convencerei meu marido a afastar-se deles; então iremos à presença de seu Senhor”[b].


    16. Mas eu lhe disse: “O Senhor não quer que os que o reverenciam estejam na impureza, nem se agrada dos que cometem adultério, mas dos que se aproximam dele com coração puro e lábios sem mancha”.


    17. Ela, porém, continuava a contestar, querendo satisfazer seu desejo.


    18. E eu acrescentava jejum e oração, para que o Senhor me livrasse dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo grego é raro e pode também ser entendido como “deitado no chão” ou “permanecendo prostrado”.
    reason: lexical_alternative
  - marker: b
    text: O texto grego está assinalado como problemático neste ponto e termina com “à presença de seu Senhor”. Alguns testemunhos ou formas ampliadas da tradição acrescentam uma referência a andar na lei do Senhor.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  choice: fiquei angustiado até a morte
  rationale: Conserva a intensidade idiomática e o tom solene sem sugerir necessariamente uma doença física.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: voltei a mim
  rationale: Reproduz de modo natural a imagem do idioma grego, sem resolver se se trata de recuperar a compostura ou a lucidez.
- source_word: δόλος / πλάνη
  choice: dolo / engano
  rationale: 'Mantém distintos os dois termos: δόλος indica intenção ardilosa, enquanto πλάνη aponta para engano ou extravio.'
- source_word: ῥήματα ὑψίστου
  choice: palavras do Altíssimo
  rationale: Preserva o genitivo, que apresenta as palavras como procedentes do Altíssimo ou pertencentes a ele.
- source_word: σωφροσύνη / σώφρονα
  choice: domínio próprio / casto
  rationale: No primeiro caso, mantém a amplitude da virtude; no segundo, o contexto sexual permite a expressão natural 'homem casto', sem acrescentar a imagem de 'leito', ausente no texto grego fornecido.
- source_word: ὑποσκελίσαι
  choice: fazer-me tropeçar
  rationale: Conserva a metáfora de provocar uma queda moral.
- source_word: χαμοκοιτῶν
  choice: me deitava no chão
  rationale: Expressa o sentido corporal do termo raro, relacionado a deitar-se ou dormir rente ao chão, sem especificar postura mais precisa.
- source_word: λόγῳ κατηχήσεως
  choice: com palavras de quem buscava instrução
  rationale: Representa o pretexto didático da abordagem sem recorrer ao termo eclesiástico posterior 'catequese'.
- source_word: συγγενοῦς μου
  choice: una-se a mim
  rationale: O imperativo, neste contexto, é um convite eufemístico a uma união sexual. A formulação preserva o eufemismo sem omitir a proposta.
- source_word: προσετιθέμην νηστείαν καὶ προσευχήν
  choice: intensificava o jejum e a oração
  rationale: Comunica a ideia iterativa ou cumulativa do imperfeito e de προστίθημι em português natural, mantendo ambos os exercícios coordenados.
theological_decisions:
- issue: Referência divina na oração do versículo 13
  choice: Deus
  alternative: o Deus de meus pais
  rationale: O texto grego fornecido lê τοῦ Θεοῦ e não contém 'de meus pais'. Por primazia da fonte original apresentada, não se incorpora a expansão da camada inglesa.
- issue: Convite da mulher em συγγενοῦς μου
  choice: una-se a mim
  alternative: omitir a oração, como na camada inglesa
  rationale: A oração está presente na fonte grega e é essencial para a tensão moral do episódio; omiti-la enfraqueceria o sentido e ocultaria a estratégia da mulher.
- issue: Segunda pessoa em Κυρίου σου
  choice: seu Senhor
  alternative: o Senhor
  rationale: Mantém o possessivo explícito do grego e a perspectiva da fala da mulher, sem assimilá-la a uma fórmula teológica mais habitual.
- issue: Prazer divino e adultério no versículo 16
  choice: nem se agrada dos que cometem adultério
  alternative: nem aprova o adultério
  rationale: Preserva a referência pessoal de τοῖς μοιχεύουσιν, sem transformar a frase numa máxima abstrata.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. O discurso direto conserva solenidade moderada. A tradução segue prioritariamente o grego fornecido, inclusive onde a camada inglesa contém expansões, omissões ou notas desalinhadas.
