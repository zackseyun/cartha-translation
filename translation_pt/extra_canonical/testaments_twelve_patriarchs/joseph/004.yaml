review_pass:
  verdict: revise
  source_fidelity: 'A tradução segue em geral o grego fornecido e corrige adequadamente expansões presentes na trilha inglesa, sobretudo ao conservar o convite de 4.5 (συγγενοῦς μου) e ao não acrescentar «na lei de seu Senhor». Contudo, 4.4 inverte parcialmente a construção: ela vai a José para aprender a palavra de Deus, não se aproxima com «palavras de quem buscava instrução». Em 4.7, «insistir» atenua o sentido adversativo de ἀντεφιλονείκει, «contestava/argumentava em resposta».'
  naturalness: O português é claro, atual e de registro apropriado. Substituir «dolo» por «ardil» melhora a legibilidade internacional sem perder a distinção em relação a πλάνη («engano»). «Iremos à presença de seu Senhor» é mais natural que «iremos para diante de seu Senhor».
  terminology: «Domínio próprio», «casto», «Altíssimo», «impureza», «adultério» e «lábios sem mancha» são escolhas adequadas. «Una-se a mim» mantém o eufemismo do imperativo grego no convite sexual. A expressão rara χαμοκοιτῶν deve permanecer assinalada; «dormindo no chão» representa melhor o particípio do que «me deitava no chão».
  issues:
  - severity: medium
    issue: '4.4: a formulação sobre «palavras de quem buscava instrução» não representa claramente a finalidade expressa pelo infinitivo τοῦ μαθεῖν.'
    rationale: O grego afirma que ela voltou a ir a José, com/instrução como pretexto ou assunto, para aprender a palavra de Deus. A revisão explicita essa finalidade.
  - severity: low
    issue: '4.7: «continuava a insistir» enfraquece ἀντεφιλονείκει.'
    rationale: O verbo denota contestar ou argumentar em oposição; «continuava a contestar» preserva esse aspecto.
  - severity: low
    issue: «Dolo» é pouco natural no português geral contemporâneo fora do registro jurídico.
    rationale: «Ardil» comunica o sentido de δόλος com naturalidade e conserva a distinção perante πλάνη, «engano».
