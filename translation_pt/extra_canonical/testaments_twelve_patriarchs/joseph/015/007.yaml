base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/007.yaml
  text: And they came near and asked me, saying, “Say that you were bought by us with silver, and he will release us.”
translation:
  language: pt
  text: 'Eles, porém, aproximaram-se e me pediram: “Diga que você foi comprado por nós com prata, e ele nos soltará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: aproximaram-se
  rationale: Reproduz de modo natural o particípio aoristo de προσέρχομαι, indicando que eles chegaram perto antes de fazer o pedido.
- source_word: ᾔτουν με λέγοντες
  choice: me pediram
  rationale: Converte a construção grega com particípio de fala em formulação portuguesa corrente, sem perder o sentido de pedido dirigido a José.
- source_word: ἐν ἀργυρίῳ
  choice: com prata
  rationale: 'Mantém o valor instrumental da expressão: a prata foi o meio de pagamento.'
- source_word: ἠγοράσθης ἡμῖν
  choice: você foi comprado por nós
  rationale: Conserva a voz passiva do grego e entende o dativo ἡμῖν como indicação dos agentes da compra, em consonância com o contexto e com a camada inglesa auditada.
- source_word: κἀκεῖνος ἀπολῦσαι ἡμᾶς ἔχει
  choice: e ele nos soltará
  rationale: Expressa em português natural o valor prospectivo da perífrase ἔχει com infinitivo, isto é, a ação esperada como consequência da declaração.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. O pronome “você” foi usado dentro da fala por sua clareza e ampla inteligibilidade brasileira; “soltará” preserva o sentido concreto de libertar ou deixar ir, sem acrescentar interpretação.
