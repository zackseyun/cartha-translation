- source_word: ἐβουλεύσαντο
  choice: decidiram
  rationale: Expressa naturalmente a deliberação que chegou a uma decisão; evita o pouco corrente 'tomaram conselho'.
- source_word: πωλῆσαί με
  choice: me vender
  rationale: Equivalência direta e idiomática do infinitivo com objeto.
- source_word: ἵνα μὴ εὑρεθῶ
  choice: para que eu não fosse encontrado
  rationale: Mantém a oração final e a voz passiva do grego.
- source_word: ἐν ταῖς χερσὶν αὐτῶν
  choice: nas mãos deles
  rationale: Conserva a imagem concreta e a possível implicação de posse ou responsabilidade presente no original.
