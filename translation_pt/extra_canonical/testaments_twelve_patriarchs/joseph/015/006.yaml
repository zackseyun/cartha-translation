lexical_decisions:
- source_word: ὁ μετάβολος
  choice: o mercador
  rationale: No contexto, o substantivo designa aquele que negocia ou revende; “mercador” é natural em português e concorda com a evidência contextual refletida na camada de consulta.
- source_word: Λύσατέ με
  choice: Livrem-me
  rationale: O imperativo de λύω pede libertação de uma situação adversa; “livrem-me” expressa isso de modo idiomático sem sugerir necessariamente soltura física.
- source_word: ἀπὸ τῆς κρίσεως
  choice: do julgamento
  rationale: Mantém o sentido judicial de κρίσις e preserva a possibilidade de se referir tanto ao processo quanto à sentença.
- source_word: Πεντεφρί
  choice: Potifar
  rationale: Adota a forma portuguesa tradicional e amplamente reconhecida do nome bíblico correspondente.
