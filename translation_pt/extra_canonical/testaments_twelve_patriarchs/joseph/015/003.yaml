  text: '*Ταῦτα ἀκούσας ἐγὼ διελύθη τὰ σπλάγχνα μου, καὶ ἡ καρδία μου ἐτάκη, καὶ ἤθελον δακρῦσαι πάνυ¹⁶, ἀλλ''¹⁷ ἐπέσχον ἐμαυτόν¹⁸, ἵνα μὴ αἰσχύνω¹⁹ τοὺς ἀδελφούς μου, ⌜*καὶ εἶπον αὐτοῖς²⁰ Ἐγὼ οὐκ οἶδα·²¹ δοῦλός εἰμι⌉.'
