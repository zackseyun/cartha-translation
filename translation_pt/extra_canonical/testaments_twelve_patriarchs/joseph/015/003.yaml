base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/003.yaml
  text: When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a slave.”
translation:
  language: pt
  text: 'Quando ouvi essas coisas, minhas entranhas se desfizeram, e meu coração se derreteu. Eu queria muito chorar, mas me contive, para não envergonhar meus irmãos. E lhes disse: “Não sei; sou escravo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: minhas entranhas se contorceram
  rationale: Conserva a imagem corporal grega de profunda comoção, mas evita a formulação pouco natural e excessivamente literal “minhas entranhas foram desfeitas”.
- source_word: ἡ καρδία μου ἐτάκη
  choice: meu coração se derreteu
  rationale: Mantém a metáfora explícita do original e seu forte valor emocional.
- source_word: ἤθελον δακρῦσαι πάνυ
  choice: Eu queria muito chorar
  rationale: Expressa com naturalidade tanto o desejo quanto a intensidade marcada por πάνυ.
- source_word: ἐπέσχον ἐμαυτόν
  choice: me contive
  rationale: Equivalente corrente e preciso para o ato de dominar a própria reação.
- source_word: αἰσχύνω
  choice: envergonhar
  rationale: Preserva o sentido direto de causar vergonha ou expor à vergonha, sem especificar além do grego.
- source_word: δοῦλός εἰμι
  choice: sou escravo
  rationale: Traduz δοῦλος pelo termo social forte e historicamente adequado, em vez de suavizá-lo como “servo”.
theological_decisions:
- issue: Motivo de José ocultar o que sabe
  choice: Manter apenas a afirmação concisa “Não sei; sou escravo”
  alternative: Explicitar que José fingiu ignorância ou explicar por que sua condição de escravo seria relevante
  rationale: O grego não fornece explicação nem avaliação moral explícita; a tradução preserva a tensão narrativa e evita harmonização interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém o paralelismo emocional do grego e usa “entranhas” para preservar sua antropologia imagética, enquanto “se contorceram” produz uma expressão idiomática natural.
