revisions:
- from: “Por que você disse que era escravo? Pois eis que soubemos que você é filho de um homem importante na terra de Canaã e que seu pai ainda chora por você, vestido de pano de saco e coberto de cinzas.”
  to: “Por que você disse que era escravo? Pois eis que soubemos que você é filho de um homem importante na terra de Canaã e que seu pai ainda está de luto por você, em pano de saco e cinzas.”
  rationale: A revisão substitui «chora» por «está de luto», que reproduz melhor πενθεῖ, e restitui a expressão idiomática «em pano de saco e cinzas», mais fiel a ἐν σάκκῳ καὶ σποδῷ e menos interpretativa. Não são necessárias notas, pois não há variante textual ou ambiguidade relevante a assinalar neste versículo.
