  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/002.yaml
  text: “Why did you say that you were a slave? For behold, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”
translation:
  language: pt
  text: “Por que você disse que era escravo? Pois eis que soubemos que você é filho de um homem importante na terra de Canaã e que seu pai ainda está de luto por você, em pano de saco e cinzas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον
  choice: escravo
  rationale: Reproduz diretamente a condição social indicada pelo grego, sem atenuá-la para ‘servo’.
- source_word: ἀνδρὸς μεγάλου
  choice: um homem importante
  rationale: Expressa naturalmente a ideia de elevada posição ou prestígio; ‘grande homem’ seria possível, mas menos idiomático neste contexto.
- source_word: πενθεῖ
  choice: chora
  rationale: Comunica o luto contínuo do pai em português corrente e digno.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: vestido de pano de saco e coberto de cinzas
  rationale: Torna explícita e natural a imagem tradicional de luto expressa literalmente por ‘em pano de saco e cinzas’.
