  to: 'Pois ela queria olhar para mim com desejo pecaminoso, mas eu não estava ciente de nada disso. Então ele lhe disse: “Não é próprio dos egípcios apoderar-se do que pertence a outros antes que haja prova.” Foi isso, portanto, o que ele disse a respeito do comerciante. Mas o jovem[a] deve permanecer confinado.'
  rationale: 'Foram feitos apenas ajustes estilísticos seguros para maior naturalidade e precisão contextual: «olhar para mim» traduz mais diretamente ὁρᾶν, e «não estava ciente» explicita o valor de desconhecimento de ἠγνόουν. A construção «antes que haja prova» conserva o singular ἀποδείξεως e soa natural em português. Mantêm-se o pronome masculino da fonte, «comerciante» para μεταβόλου e a nota de ambiguidade para παῖς.'
