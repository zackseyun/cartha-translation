base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/001.yaml
  text: For she wanted to see me in sinful desire, but I was unaware of all these things. And he said to her, “This is not the custom among the Egyptians, to take what belongs to others before proof is given.” So he said this concerning the merchant. But the boy ought to be kept confined.
translation:
  language: pt
  text: 'Pois ela queria olhar para mim com desejo pecaminoso, mas eu não estava ciente de nada disso. Então ele lhe disse: “Não é próprio dos egípcios apoderar-se do que pertence a outros antes que haja prova.” Foi isso, portanto, o que ele disse a respeito do comerciante. Mas o jovem[a] deve permanecer confinado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “servo”; o termo grego pode ter ambos os sentidos.
    reason: Preserva a ambiguidade lexical de παῖς, relevante à idade e à condição social de José.
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: com desejo pecaminoso
  rationale: Expressa de modo natural o desejo orientado para o pecado, sem tornar a frase mais específica do que o grego.
- source_word: ἠγνόουν
  choice: eu não percebia
  rationale: No contexto, indica que José não estava ciente do que acontecia ou das intenções envolvidas; evita o sentido moderno potencialmente inadequado de “ignorava” como desprezo deliberado.
- source_word: ἀφαιρεῖσθαι τὰ ἀλλότρια
  choice: apoderar-se do que pertence a outros
  rationale: Preserva a ideia de tomar para si bens alheios e reflete o plural substantivado τὰ ἀλλότρια.
- source_word: πρὸ ἀποδείξεως
  choice: antes que se apresentem provas
  rationale: Comunica idiomaticamente que a apropriação não deve ocorrer antes de haver demonstração ou prova.
- source_word: μεταβόλου
  choice: comerciante
  rationale: O termo pode designar alguém envolvido em troca ou comércio; “comerciante” se ajusta ao contexto narrativo e à camada inglesa auditada.
- source_word: παῖς
  choice: jovem
  rationale: O termo grego pode designar menino, jovem ou servo; “jovem” é adequado para José sem decidir que sua condição de servo seja o ponto principal.
- source_word: ἐγκατάκλειστος εἶναι
  choice: permanecer confinado
  rationale: Mantém a noção de ser conservado sob reclusão, com linguagem atual e digna.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. Os pronomes masculinos de terceira pessoa foram mantidos como no texto grego, sem identificar silenciosamente o falante. A formulação evita harmonizar a passagem com versões que trazem “eu disse”.
