base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/005.yaml
  text: For they feared my father, lest he come among them and take vengeance for the danger; for they had heard that he was great before God and men.
translation:
  language: pt
  text: Pois eles temiam meu pai, receando que ele viesse para o meio deles e se vingasse pelo perigo; porque tinham ouvido que ele era grande diante de Deus e dos seres humanos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μὴ
  choice: receando que
  rationale: No contexto de um verbo de temor, introduz naturalmente em português aquilo que se receava, sem transformar a construção em finalidade.
- source_word: ἐλθὼν ἐν αὐτοῖς
  choice: viesse para o meio deles
  rationale: Preserva a ideia espacial de chegar e estar entre eles, refletida por ἐν αὐτοῖς.
- source_word: ποιήσῃ ἐκδίκησιν κινδύνου
  choice: se vingasse pelo perigo
  rationale: Mantém a construção incomum e um tanto ambígua do grego, na qual κινδύνου especifica a causa ou matéria da vingança, sem substituí-la por 'vingar-se deles'.
- source_word: παρὰ Θεῷ καὶ ἀνθρώποις
  choice: diante de Deus e dos seres humanos
  rationale: Expressa reputação ou posição perante Deus e a humanidade; 'seres humanos' comunica o plural genérico sem restringi-lo ao sexo masculino.
theological_decisions:
- issue: Sentido de 'grande' perante Deus e os seres humanos
  choice: era grande diante de Deus e dos seres humanos
  alternative: era muito estimado por Deus e pelos homens
  rationale: A formulação escolhida conserva a linguagem ampla e potencialmente honorífica do original, sem interpretar 'grande' apenas como estima ou favor.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe fluente e retenção deliberada da expressão difícil 'vingasse pelo perigo' para não resolver silenciosamente a ambiguidade do texto grego.
