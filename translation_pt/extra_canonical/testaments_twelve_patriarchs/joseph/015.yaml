  text: '4. For she wanted to see me in the desire of sin, but I was ignorant in all these things.


    5. And I said to her, “This is not the custom among the Egyptians, to take what belongs to another before proof is given.”


    6. So I said this concerning the exchange. But the boy ought to be kept shut up.


    1. And after twenty-four days the Ishmaelites came, for they had heard that Jacob my father was mourning greatly for me. And when they came they said to me,


    2. “Why did you say that you were a slave? For look, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”


    3. When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a slave.”


    4. Then they took counsel to sell me, so that I might not be found in their hands.


    5. For they feared my father, lest he come against them and execute dangerous vengeance on them; for they had heard that he was great before God and men.


    6. Then the trader said to them, “Release me from the judgment of Potiphar.”


    7. So they came near and asked me, saying, “Say that you were bought by us for silver, and he will release us.”'
translation:
  language: pt
  text: '14:4 Pois ela queria ver-me tomado pelo desejo do pecado, mas eu nada entendia de todas essas coisas.


    5 Eu lhe disse: “Entre os egípcios, não é permitido tomar o que pertence a outro antes que se apresentem provas.”


    6 Isso, pois, ele disse a respeito do comerciante. Quanto ao rapaz, deveria permanecer detido.


    15:1 Depois de vinte e quatro dias, chegaram os ismaelitas, pois tinham ouvido que Jacó, meu pai, estava profundamente aflito por minha causa. Ao chegarem, disseram-me:


    2 “Por que você disse que era escravo? Pois ficamos sabendo que você é filho de um homem importante na terra de Canaã e que seu pai ainda está de luto por você, vestido de pano de saco e coberto de cinzas.”


    3 Quando ouvi isso, minhas entranhas se dilaceraram e meu coração se derreteu. Eu queria muito chorar, mas me contive para não envergonhar meus irmãos. E lhes disse: “Não sei; sou escravo.”


    4 Então decidiram vender-me, para que eu não fosse encontrado nas mãos deles.


    5 Eles temiam que meu pai viesse contra eles e executasse uma vingança perigosa[a], pois tinham ouvido que ele era grande diante de Deus e dos seres humanos.


    6 Então o comerciante lhes disse: “Livrem-me do julgamento de Potifar.”[b]


    7 Eles se aproximaram de mim e pediram: “Diga que nós compramos você por prata, e ele nos soltará.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grego: “vingança de perigo”, expressão incomum que também pode ser entendida como “vingança perigosa” ou “vingança pelo perigo sofrido”.'
    reason: A construção genitiva é semanticamente incerta e não deve ser silenciosamente reduzida a uma única interpretação.
  - marker: b
    text: Isto é, o processo ou a decisão judicial de Potifar; o grego também pode ser traduzido como “livrem-me da sentença de Potifar”.
    reason: κρίσις pode indicar julgamento, processo judicial ou sentença, e o contexto não determina com plena certeza qual nuance predomina.
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: tomado pelo desejo do pecado
  rationale: Expressa de modo natural a ideia de ser visto no âmbito ou sob o domínio de um desejo pecaminoso, sem especificar além do grego a natureza do pecado.
- source_word: πρὸ ἀποδείξεως
  choice: antes que se apresentem provas
  rationale: ἀπόδειξις indica demonstração ou prova; a formulação preserva o contexto de averiguação legal.
- source_word: μεταβόλου
  choice: comerciante
  rationale: O substantivo designa aqui um negociante ou intermediário comercial, como confirma a mesma personagem em 15:6; evita o inadequado sentido abstrato de “troca”.
- source_word: ἐγκατάκλειστος
  choice: detido
  rationale: Comunica que o rapaz deveria permanecer fechado sob custódia, em português atual, sem acrescentar que se tratava necessariamente de prisão formal.
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: minhas entranhas se dilaceraram
  rationale: Conserva a imagem somática forte do grego, compreensível como expressão de profunda angústia.
- source_word: ἐκδίκησιν κινδύνου
  choice: vingança devastadora
  rationale: A expressão grega é incomum; “devastadora” transmite o perigo ou dano associado à vingança sem convertê-lo em uma categoria jurídica precisa.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: vestido de pano de saco e coberto de cinzas
  rationale: Torna explícito em português o gesto tradicional de luto preservando ambos os elementos concretos.
- source_word: ἐν ἀργυρίῳ ἠγοράσθης
  choice: compramos você por prata
  rationale: Mantém o valor concreto de ἀργύριον como prata usada no pagamento, em vez de generalizá-lo para dinheiro.
theological_decisions:
- issue: Ignorância de José diante da intenção pecaminosa da mulher
  choice: “eu nada entendia de todas essas coisas”
  alternative: “eu era inocente em todas essas coisas”
  rationale: ἠγνόουν exprime não saber ou não compreender. A tradução não transforma automaticamente essa afirmação em uma declaração teológica abrangente de impecabilidade.
- issue: Grandeza de Jacó
  choice: “grande diante de Deus e dos seres humanos”
  alternative: “muito estimado por Deus e pelos homens”
  rationale: 'Preserva a afirmação concisa e sua tensão: o texto fala de grandeza perante ambas as esferas, sem explicar se se trata de favor, reputação, poder ou autoridade.'
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. Emprega “você” nas falas diretas por naturalidade contemporânea, mantendo narração formal. As imagens corporais e os sinais antigos de luto foram preservados; construções obscuras receberam notas em vez de harmonização silenciosa.
