  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011.yaml
  text: 'And so[a], my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.


    And when I was coming with the Ishmaelites, they kept asking me, saying[b], “Are you a slave?” And I said that I was a household slave, so that I might not put my brothers to shame.'
translation:
  language: pt
  text: '**Testamento de José 11**


    **1** Portanto, vocês também, meus filhos, mantenham o temor de Deus diante dos olhos em tudo o que fizerem e honrem seus irmãos, pois todo aquele que pratica a lei do Senhor será amado por ele.


    **2** Quando eu vinha com os ismaelitas, eles ficavam me perguntando[a]: “Você é escravo?” Eu respondia que era escravo doméstico[b], para não envergonhar meus irmãos.


    **3** Mas o principal deles me disse: “Você não é escravo, pois até a sua aparência revela isso”. Eu, porém, lhes disse: “Sou escravo deles”[c].


    **4** Quando chegamos ao Egito, eles discutiram a meu respeito para decidir quem pagaria ouro e ficaria comigo.


    **5** Então todos decidiram que eu permanecesse no Egito com o agente dos negócios comerciais deles[d], até que voltassem trazendo mercadorias.


    **6** O Senhor, porém, concedeu-me favor aos olhos desse agente, e ele confiou sua casa aos meus cuidados.


    **7** Deus o abençoou por meio de mim e o fez prosperar em ouro, prata e trabalho[e].


    **8** Fiquei com ele durante três meses.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O tempo verbal grego sugere perguntas repetidas ou contínuas: “eles me perguntavam repetidamente”.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega também pode significar “escravo de uma casa” ou, possivelmente, “escravo nascido na casa”.
    reason: lexical_alternative
  - marker: c
    text: O pronome grego traduzido por “deles” não retoma um antecedente nominal expresso na frase. No contexto imediato, provavelmente se refere aos ismaelitas.
    reason: referential_ambiguity
  - marker: d
    text: O termo grego pode designar um intermediário, agente, negociante ou cambista encarregado do comércio deles.
    reason: lexical_alternative
  - marker: e
    text: Literalmente, “multiplicou-o em ouro, prata e trabalho”. A expressão final, “e trabalho”, apresenta incerteza na transmissão do texto e pode se referir às atividades ou aos empreendimentos dele.
    reason: textual_uncertainty
lexical_decisions:
- source_word: φόβον
  choice: temor
  rationale: “Temor de Deus” preserva o peso moral e religioso da expressão grega sem reduzi-la apenas a medo ou suavizá-la como mera reverência.
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: diante dos olhos
  rationale: Mantém a imagem concreta do grego e exprime vigilância moral de modo natural em português.
- source_word: τιμᾶτε
  choice: honrem
  rationale: Reproduz diretamente a força ética do imperativo no contexto familiar.
- source_word: ποιῶν νόμον Κυρίου
  choice: pratica a lei do Senhor
  rationale: O grego fala literalmente em “fazer” a lei; “pratica” conserva esse sentido ativo com maior naturalidade em português.
- source_word: δοῦλος
  choice: escravo
  rationale: O contexto é o da venda e da condição jurídica de José, de modo que “escravo” comunica a sujeição implicada pelo termo.
- source_word: ἐξ οἴκου
  choice: escravo doméstico
  rationale: A expressão provavelmente qualifica José como escravo ligado a uma casa, embora também possa sugerir um escravo nascido nela.
- source_word: αἰσχύνω
  choice: envergonhar
  rationale: Expressa de forma concisa a ideia de causar vergonha ou desonra aos irmãos.
- source_word: ὁ μείζων αὐτῶν
  choice: o mais velho deles
  rationale: No grupo dos ismaelitas, o comparativo substantivado provavelmente designa o mais velho ou principal; a opção mantém a leitura familiar sem impor a noção de autoridade.
- source_word: μετάβολον τῆς ἐμπορίας
  choice: agente dos negócios comerciais
  rationale: A expressão aponta para um intermediário ou agente ligado ao comércio dos ismaelitas; a tradução evita identificá-lo de modo excessivamente específico como cambista ou mercador.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: confiou sua casa aos meus cuidados
  rationale: Explicita naturalmente em português que a casa e sua administração foram entregues à responsabilidade de José.
- source_word: ἐν χειρί μου
  choice: por meio de mim
  rationale: O idiomatismo indica que a bênção veio mediante a atuação de José, não apenas que estava fisicamente em sua mão.
theological_decisions:
- issue: O sentido do “temor de Deus” na exortação
  choice: temor de Deus
  alternative: reverência a Deus
  rationale: A formulação tradicional preserva tanto a reverência quanto a seriedade moral da expressão, sem eliminar sua tensão semântica.
- issue: A condição declarada por José
  choice: escravo / escravo doméstico
  alternative: servo / criado da casa
  rationale: A narrativa trata da venda de José e de sua posse por outros; “escravo” representa com maior precisão essa realidade social.
- issue: A razão de José ocultar sua origem
  choice: para não envergonhar seus irmãos
  alternative: para não desonrar genericamente a casa de seu pai
  rationale: O objeto explícito no grego são “meus irmãos”; a tradução não acrescenta uma explicação sobre como eles seriam envergonhados.
- issue: A bênção recebida pelo agente comercial
  choice: Deus o abençoou por meio de José
  alternative: Deus abençoou diretamente o trabalho de José
  rationale: O pronome grego aponta para o agente como beneficiário, enquanto “por meio de mim” preserva José como instrumento da bênção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais como “vocês” e “ficavam me perguntando”. A tradução mantém imagens centrais do grego, mas prefere construções idiomáticas quando uma reprodução literal seria obscura. As ambiguidades referentes a ἐξ οἴκου, αὐτῶν e μετάβολον foram preservadas ou registradas em notas.
