base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019.yaml
  text: 'And he gave me beauty beyond the handsome men of Israel[a], and preserved me until old age in strength and in beauty; for I was like Jacob in all things.


    Now listen, my children, also concerning the dream that I saw.


    2. Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also. So hear the dream that I saw. 3. And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord led them out into a flourishing and well-watered place, and brought them from darkness into light. 4. And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks. 5. And after these things I saw, and behold, twelve bulls suckling one heifer, and from her there came a sea of milk, and the twelve flocks and innumerable flocks drank from it. 6. And from the fourth bull the horns went up as far as heaven and became like a wall for the flocks, and between the two horns another horn sprang up. 7. And I saw a calf that encircled them twelve times, and it became for the bulls wholly a help.


    8. And I saw that a virgin was born, and from her was born a lamb, and on his left there rushed forth something like a lion; and all the beasts rushed against him, but the lamb overcame them and destroyed them and trampled them down. 9. And the angels and men and all the earth rejoiced over him. 10. And these things will happen in their season in the last days.


    11. Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you the salvation of Israel. 12. For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will come to an end, like a watchman''s hut after the summer[d][c][b], vanishing away.'
translation:
  language: pt
  text: 'E ele me deu beleza maior que a dos homens mais belos de Israel e me preservou até a velhice, com força e beleza, pois em tudo eu era semelhante a Jacó.


    19 Ouçam também, meus filhos, a respeito do sonho que tive.


    2 Doze cervos pastavam num só lugar. Nove se dispersaram por toda a terra, e os três fizeram o mesmo. 3 Então vi que os três cervos se transformaram em três cordeiros. Eles clamaram ao Senhor, e o Senhor os conduziu a um lugar verdejante e bem regado e os levou das trevas para a luz. 4 Ali clamaram ao Senhor até que os nove cervos se reuniram a eles. Todos se tornaram como doze ovelhas e, pouco tempo depois, multiplicaram-se e formaram muitos rebanhos.


    5 Depois disso, vi doze touros mamando em uma novilha. Dela saía um mar de leite, do qual bebiam os doze rebanhos e inúmeros outros rebanhos. 6 Os chifres do quarto touro subiram até o céu e se tornaram como uma muralha para os rebanhos; entre os dois chifres brotou outro chifre. 7 Vi também um bezerro que os rodeava doze vezes e veio a ser pleno auxílio para os touros.


    8 Vi então que nasceu uma virgem[a] e que dela nasceu um cordeiro[b]. À esquerda dele havia algo semelhante a um leão[c]. Todos os animais selvagens avançaram contra ele, mas o cordeiro os venceu, destruiu-os e os pisoteou. 9 Os anjos, os seres humanos e toda a terra se alegraram por causa dele. 10 Essas coisas acontecerão no tempo delas, nos últimos dias.


    11 Portanto, meus filhos, guardem os mandamentos do Senhor e honrem Levi e Judá, pois da descendência deles surgirá para vocês, salvando Israel. 12 O reino dele será um reino eterno, que não passará. O meu reino entre vocês, porém, chegará ao fim e desaparecerá como uma cabana de vigia depois da colheita[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns testemunhos gregos dizem de modo mais explícito: “de Judá nasceu uma virgem”; outra forma do texto diz: “vi entre os chifres certa virgem”.'
    reason: textual_variant
  - marker: b
    text: Alguns testemunhos acrescentam que o cordeiro era “sem defeito”. No versículo 11, uma leitura de caráter mais tardio acrescenta palavras semelhantes a “o Cordeiro de Deus, que tira o pecado do mundo” e amplia a salvação para “todas as nações e Israel”.
    reason: textual_variant
  - marker: c
    text: A frase sobre o que estava à esquerda do cordeiro é textualmente difícil. Outra testemunha formula a cena de maneira diferente, embora também retrate animais hostis investindo contra o cordeiro.
    reason: alternative_reading
  - marker: d
    text: A “cabana de vigia depois da colheita” era um abrigo temporário no campo, abandonado e deixado desolado quando terminava a época da colheita.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραιότητα
  choice: beleza
  rationale: Expressa de modo natural a beleza física atribuída a José, sem arcaísmo nem especificação indevida.
- source_word: ἐφύλαξέ
  choice: preservou
  rationale: Comunica proteção sustentada até a velhice, e não apenas vigilância momentânea.
- source_word: ἐνυπνίων
  choice: sonhos
  rationale: É a designação direta e corrente para as visões simbólicas narradas no capítulo; o plural acompanha a forma grega transmitida.
- source_word: ἔλαφοι
  choice: cervos
  rationale: Mantém a espécie animal da imagem sem determinar sexo ou idade além do que o grego exige.
- source_word: τόπον εὐθαλῆ καὶ ἔνυδρον
  choice: um lugar verdejante e bem regado
  rationale: 'Preserva os dois aspectos da expressão: vegetação florescente e abundância de água.'
- source_word: ἐκ σκότους εἰς φῶς
  choice: das trevas para a luz
  rationale: Conserva literalmente a metáfora transparente de libertação.
- source_word: πρόβατα / ποίμνια
  choice: ovelhas / rebanhos
  rationale: Mantém a progressão entre os animais reunidos e sua multiplicação em muitos grupos.
- source_word: βόες
  choice: touros
  rationale: A forma masculina e a atenção posterior aos chifres favorecem esta opção vívida, em vez do genérico 'gado'.
- source_word: θηλάζοντες
  choice: mamando
  rationale: Reproduz com linguagem corrente a imagem incomum dos touros recebendo leite da novilha.
- source_word: δάμαλιν
  choice: novilha
  rationale: É o equivalente pecuário usual para a fêmea bovina jovem mencionada no sonho.
- source_word: εἰς καταπάτημα
  choice: os pisoteou
  rationale: Torna idiomática a imagem de redução dos adversários à condição de serem calcados aos pés.
- source_word: ὀπωροφυλάκιον
  choice: cabana de vigia
  rationale: Designa o abrigo temporário usado por quem guardava uma plantação; 'cabana' é claro ao leitor moderno.
theological_decisions:
- issue: Material messiânico textualmente ampliado nos versículos 8 e 11
  choice: 'O texto principal segue a forma mais breve: conserva a virgem e o cordeiro, mas não inclui os acréscimos mais explicitamente cristológicos.'
  alternative: “de Judá nasceu uma virgem... dela nasceu um cordeiro sem defeito” e “o Cordeiro de Deus, que tira o pecado do mundo”.
  rationale: Os colchetes e as variantes da edição indicam expansão textual considerável. As formulações extensas são registradas em nota, sem serem promovidas silenciosamente ao texto principal.
- issue: Identidade da figura salvadora procedente de Levi e Judá
  choice: “aquele que salvará Israel”, seguido de “o reino dele”.
  alternative: “a salvação de Israel” como realidade impessoal ou uma identificação expressa da figura com um título cristológico posterior.
  rationale: O particípio σώζων é pessoal e concorda naturalmente com a figura simbolizada pelo cordeiro, mas o texto mais breve não fornece uma identificação doutrinária explícita. A tradução mantém tanto a pessoalidade quanto a ambiguidade da identidade.
- issue: Relação da figura leonina com o cordeiro no versículo 8
  choice: “À esquerda dele havia algo semelhante a um leão”.
  alternative: “à esquerda dele avançou algo semelhante a um leão” ou uma reformulação em que a cena de ataque é construída de outro modo.
  rationale: A passagem é textualmente difícil. A redação evita decidir se o leão é aliado, aspecto do cordeiro ou agressor, preservando a tensão antes do ataque inequívoco dos animais selvagens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros sem regionalismos marcados. O discurso paterno usa “vocês” e imperativos correntes. A numeração explicita o início do capítulo 19, enquanto a frase inicial é mantida como continuação de 18:4, conforme a fonte. Imagens simbólicas e ambiguidades textuais foram preservadas, com variantes relevantes em notas.
