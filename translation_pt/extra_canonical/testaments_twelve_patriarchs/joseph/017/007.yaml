base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/007.yaml
  text: And their sons were my sons, and my sons were as slaves to them, and their souls were my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose.
translation:
  language: pt
  text: E os filhos deles eram meus filhos, e meus filhos eram como escravos deles; a alma deles era minha alma, toda dor deles era minha dor, toda fraqueza deles era minha enfermidade, e o propósito deles era meu propósito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: escravos
  rationale: Expressa diretamente a condição servil indicada pelo substantivo grego, sem suavizá-la para “servos”.
- source_word: ψυχή
  choice: alma
  rationale: Preserva o singular coletivo do texto grego e a identificação enfática entre a vida interior deles e a de José.
- source_word: ἄλγημα
  choice: dor
  rationale: Termo corrente e digno que comunica sofrimento ou aflição dolorosa.
- source_word: μαλακία / ἀσθένεια
  choice: fraqueza / enfermidade
  rationale: Mantém a variação lexical e o movimento do estado de debilidade deles para a enfermidade assumida por José.
- source_word: βουλή
  choice: propósito
  rationale: Neste paralelismo, comunica uma intenção ou desígnio compartilhado; evita limitar o termo ao sentido de “conselho”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com paralelismo repetitivo preservado. O singular “a alma deles” segue ψυχή no grego, apesar do referente plural. Os verbos no pretérito foram supridos naturalmente a partir do contexto narrativo, pois as orações gregas são nominais.
