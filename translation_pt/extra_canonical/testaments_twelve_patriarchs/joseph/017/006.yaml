  text: And I did not allow them to be distressed even in the smallest matter; indeed, everything that was in my hand I gave to them.
translation:
  language: pt
  text: E não permiti que eles fossem afligidos em coisa alguma, nem mesmo na menor; de fato, dei-lhes tudo o que estava em minha mão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβῆναι
  choice: fossem afligidos
  rationale: Mantém o sentido passivo de sofrer aflição, pressão ou dificuldade, sem especificar uma causa ausente do grego.
- source_word: ἕως μικροῦ πράγματος
  choice: nem sequer na menor questão
  rationale: Expressa de modo natural a ideia idiomática de não permitir aflição nem mesmo quanto a algo mínimo.
- source_word: καίγε
  choice: de fato
  rationale: Reproduz a força enfática e confirmatória da partícula, sem introduzir contraste indevido.
- source_word: πᾶν ὃ ἦν ἐν τῇ χειρί μου
  choice: tudo o que estava em minhas mãos
  rationale: Preserva a imagem semítica de posse ou disponibilidade, empregando uma formulação compreensível em português.
