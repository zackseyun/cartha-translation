  text: You also, therefore, love one another, and with patience conceal one another’s shortcomings.
translation:
  language: pt
  text: Portanto, vocês também amem uns aos outros e, com paciência, escondam as falhas uns dos outros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: Portanto
  rationale: Preserva a conexão inferencial com o contexto anterior.
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: amem uns aos outros
  rationale: Tradução natural e direta do imperativo recíproco.
- source_word: ἐν μακροθυμίᾳ
  choice: com paciência
  rationale: Expressa aqui a disposição paciente e tolerante de suportar as limitações alheias.
- source_word: συγκρύπτετε
  choice: encubram
  rationale: Mantém a imagem de cobrir ou não expor as falhas do outro, sem substituí-la por uma interpretação mais ampla como perdoar.
- source_word: τὰ ἐλαττώματα
  choice: as falhas
  rationale: Termo corrente que abrange deficiências e imperfeições pessoais sem exagerar sua gravidade.
theological_decisions:
- issue: Sentido ético de συγκρύπτετε
  choice: encubram as falhas uns dos outros
  alternative: sejam tolerantes com as falhas uns dos outros
  rationale: A escolha preserva a metáfora explícita de ocultar ou cobrir e evita resolver o texto como mera tolerância. No contexto, não implica necessariamente acobertar injustiça, mas não expor as imperfeições alheias.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal brasileira de ampla inteligibilidade. A ordem foi levemente ajustada para fluência, preservando o nexo lógico, a reciprocidade e a imagem do grego.
