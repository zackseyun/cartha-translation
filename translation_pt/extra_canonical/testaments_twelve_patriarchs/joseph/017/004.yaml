  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/004.yaml
  text: And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them.
translation:
  language: pt
  text: E quando meus irmãos vieram ao Egito, eles mesmos sabem que lhes devolvi o dinheiro, não os repreendi e os encorajei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψα τὸ ἀργύριον αὐτοῖς
  choice: lhes devolvi o dinheiro
  rationale: Expressa naturalmente o ato de restituir a prata ou quantia recebida; neste contexto, “dinheiro” é a formulação corrente e coincide com o sentido contextual.
- source_word: οὐκ ὠνείδισα αὐτούς
  choice: não os repreendi
  rationale: Mantém o sentido de não censurar nem lançar em rosto a culpa deles, em linguagem clara e digna.
- source_word: παρεκάλεσα αὐτούς
  choice: os encorajei
  rationale: O verbo pode significar exortar, consolar, animar ou encorajar. Aqui, após a negativa de censura, “encorajei” oferece uma leitura contextual natural sem acrescentar conteúdo.
