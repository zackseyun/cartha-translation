source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Τέρπεται γὰρ⁸ ὁ θεὸς⁷ ⌜ἐπὶ⌉ *ὁμονοίᾳ ἀδελφῶν⁸ καὶ⁷ ἐπὶ προαιρέσει καρδίας⁹ ⌜ἀγαθῆς⌉¹⁰ †εὐδοκοῦσιν¹¹ εἰς ἀγαθόν¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/003.yaml
  text: For God delights in the harmony of brothers and in the good intention of the heart; these are well-pleasing for good.
translation:
  language: pt
  text: Pois Deus se alegra com a harmonia entre irmãos e com a boa intenção do coração; essas coisas são agradáveis com vistas ao bem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação grega da última oração é incerta; também pode ser entendida no sentido de que essas coisas «conduzem ao bem».
    reason: O texto assinala εὐδοκοῦσιν como problemático, e a construção εὐδοκοῦσιν εἰς ἀγαθόν admite mais de uma interpretação.
lexical_decisions:
- source_word: Τέρπεται
  choice: se alegra
  rationale: Expressa de modo natural e digno o prazer ou deleite atribuído a Deus, sem intensificação indevida.
- source_word: ὁμονοίᾳ ἀδελφῶν
  choice: harmonia entre irmãos
  rationale: Ὁμόνοια indica concórdia, unidade de espírito ou harmonia; «entre irmãos» comunica naturalmente a relação expressa pelo genitivo.
- source_word: προαιρέσει καρδίας ἀγαθῆς
  choice: boa intenção do coração
  rationale: Προαίρεσις denota intenção ou disposição deliberada. A formulação conserva a associação de «boa» com a intenção/disposição do coração sem expandir seu sentido.
- source_word: εἰς ἀγαθόν
  choice: com vistas ao bem
  rationale: Mantém a orientação indicada por εἰς e evita transformar explicitamente a frase em uma afirmação causal como «produzem o bem».
theological_decisions:
- issue: Referente do verbo plural εὐδοκοῦσιν
  choice: «essas coisas» retoma a harmonia e a boa intenção do coração
  alternative: 'Entender Deus como sujeito implícito ou reformular a oração como resultado: «elas conduzem ao bem»'
  rationale: O plural favorece a retomada dos dois elementos anteriores, como também reconhece a camada inglesa auditada; a redação evita introduzir uma doutrina ou causalidade não explícita.
- issue: Sentido da cláusula final textualmente difícil
  choice: «são agradáveis com vistas ao bem»
  alternative: «conduzem ao bem» ou «agradam a Deus para o bem»
  rationale: A escolha preserva tanto a ideia de agrado de εὐδοκοῦσιν quanto a orientação de εἰς ἀγαθόν, sem resolver silenciosamente a dificuldade sintática e textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. «Harmonia entre irmãos» e «boa intenção do coração» conservam o paralelismo do grego; a nota registra, sem ocultá-la, a dificuldade da cláusula final.
