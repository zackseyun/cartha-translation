- source_word: τέκνα μου
  choice: meus filhos
  rationale: Reproduz de modo claro e digno a forma afetiva de tratamento.
- source_word: πόσα ὑπέμεινα
  choice: quanto suportei
  rationale: Expressa a extensão dos sofrimentos que José perseverou em suportar, sem acrescentar detalhes ausentes do grego.
- source_word: ἵνα μὴ αἰσχύνω
  choice: para não envergonhar
  rationale: Preserva a construção de finalidade e o sentido de causar vergonha ou desonra.
- source_word: τοὺς ἀδελφούς μου
  choice: meus irmãos
  rationale: Equivalência direta e contextual para os irmãos de José.
