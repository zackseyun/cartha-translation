base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007.yaml
  text: '7. So that you may learn that the wickedness of the ungodly will not prevail over those who fear God in self-control, look: taking some of it before him, I ate it in your presence. And after saying this, I tasted it and said, “The God of my fathers and the angel of Abraham will be with me.” And I ate.


    8. But when she saw this, she fell on her face at my feet, weeping; and raising her up, I admonished her.


    9. And she agreed with me not to commit this impiety any longer. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would collapse suddenly, though she was not sick.


    10. And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he tried to heal her with words.


    11. Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking; or I will throw myself down a cliff, if you do not join yourself with me.”


    12. But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,


    13. “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband''s concubine, your rival, will beat your children and wipe out your memory from the earth.”'
translation:
  language: pt
  text: '7. Assim você aprenderá que a maldade dos ímpios não prevalecerá contra os que temem a Deus e vivem com domínio próprio. Veja: peguei um pouco daquilo e comi diante de você. Depois de dizer isso, falei assim: “O Deus de meus pais e o anjo de Abraão estarão comigo”. Então comi.


    8. Quando ela viu isso, caiu com o rosto em terra aos meus pés, chorando. Eu a levantei e a adverti.


    9. Ela concordou comigo em não voltar a cometer essa impiedade. Contudo, seu coração ainda estava voltado para o mal, e ela procurava um modo de me apanhar numa armadilha. Gemendo, caía de repente, embora não estivesse doente.


    10. Quando o marido dela a viu, perguntou-lhe: “O que aconteceu com seu rosto?” Ela lhe respondeu: “Sofro com uma dor no coração, e os gemidos do meu espírito me oprimem”. Então ele procurou tratá-la com palavras.


    11. Depois, aproveitando uma oportunidade, ela irrompeu onde eu estava, enquanto seu marido ainda se encontrava fora, e me disse: “Estou sufocando! Ou vou me atirar de um precipício, se você não se unir a mim”.


    12. Eu, porém, percebendo que o espírito de Beliar a atormentava, orei ao Senhor e lhe disse:


    13. “Por que, infeliz, você se perturba e se agita, cegando a si mesma em pecados? Lembre-se de que, se tirar a própria vida, Astho, a concubina de seu marido e sua rival, espancará seus filhos, e você fará desaparecer da terra a sua própria memória”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: domínio próprio
  rationale: Expressa a autodisciplina e castidade moral exigidas pelo contexto sem reduzir o termo exclusivamente à esfera sexual.
- source_word: θεοσεβούντων
  choice: os que temem a Deus
  rationale: Tradução idiomática e reconhecível para os que reverenciam e cultuam a Deus.
- source_word: ἐνουθέτησα
  choice: repreendi
  rationale: No contexto, José não apenas aconselha, mas adverte a mulher contra sua conduta ímpia.
- source_word: παγιδεύσῃ
  choice: me apanhar numa armadilha
  rationale: Preserva a imagem explícita de preparar uma cilada, em linguagem natural.
- source_word: ἐθεράπευσεν ... ἐν λόγοις
  choice: procurou consolá-la com palavras
  rationale: O verbo tem sentido literal de tratar ou curar; aqui, a ação verbal do marido visa aliviar o sofrimento alegado por ela.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: se unir a mim
  rationale: Mantém o eufemismo sexual do grego e sua tensão sem acrescentar formulação mais explícita.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Transliteração tradicional do nome próprio nesta obra, sem identificar ou interpretar além do texto.
- source_word: κονδυλίσει
  choice: espancará
  rationale: Comunica golpes físicos fortes; o verbo se refere propriamente a golpear com o punho.
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου
  choice: você fará desaparecer ... a sua própria memória
  rationale: Mantém a segunda pessoa singular do grego, pela qual a consequência é atribuída ao suicídio da própria mulher, e não à rival.
theological_decisions:
- issue: Relação entre temor de Deus e domínio próprio
  choice: os que temem a Deus e vivem com domínio próprio
  alternative: os que adoram a Deus no domínio próprio
  rationale: A formulação conserva a ligação entre piedade e autocontrole sem sugerir que o domínio próprio seja o meio ritual pelo qual Deus é adorado.
- issue: O anjo de Abraão
  choice: o anjo de Abraão
  alternative: o anjo que apareceu a Abraão
  rationale: Preserva o genitivo ambíguo do grego e evita impor uma identificação ou explicação não explicitada no texto.
- issue: Agência espiritual na tentação
  choice: o espírito de Beliar a atormentava
  alternative: ela estava possuída pelo espírito de Beliar
  rationale: O verbo indica perturbação ou assédio; não exige a noção teológica mais específica de possessão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A numeração segue a sequência editorial fornecida (7–13), embora o trecho atravesse a divisão entre VI.7–9 e VII.1–5 no grego. Preservaram-se os eufemismos e as ambiguidades genuínas, enquanto a construção provavelmente corrompida de VII.1 foi vertida com cautela como uma queda súbita fingida.
