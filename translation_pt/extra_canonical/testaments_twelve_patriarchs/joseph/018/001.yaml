source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Ἐὰν⌉¹ οὖν καὶ ὑμεῖς² πορευθῆτε ἐν ταῖς³ ἐντολαῖς Κυρίου⁴, ὑψώσει ὑμᾶς⁵ *ὁ θεὸς⁶ ⌜ἐν ἀγαθοῖς⁷ εἰς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/001.yaml
  text: If, then, you also walk in the commandments of the Lord, God will exalt you with good things forever.
translation:
  language: pt
  text: Se, pois, vocês também andarem de acordo com os mandamentos do Senhor, Deus os exaltará com coisas boas para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: andarem segundo os mandamentos
  rationale: A expressão grega significa conduzir a vida em conformidade com os mandamentos; “andar segundo” preserva a metáfora e soa natural em português bíblico atual.
- source_word: ὑψώσει
  choice: exaltará
  rationale: Reproduz diretamente a ideia de elevar ou conferir honra, sem especificar de que modo ocorrerá essa elevação.
- source_word: ἐν ἀγαθοῖς
  choice: com bens
  rationale: O plural substantivado ἀγαθοῖς pode indicar coisas boas, benefícios ou prosperidade. “Com bens” mantém a formulação ampla e associa esses bens ao ato de Deus exaltar.
- source_word: εἰς αἰῶνας
  choice: para sempre
  rationale: Expressão portuguesa natural para a duração indefinida e permanente indicada pelo grego.
theological_decisions:
- issue: Relação condicional entre obediência e exaltação divina
  choice: 'Preservar explicitamente a condição: “se... andarem..., Deus os exaltará”'
  alternative: Suavizar a relação como promessa geral de bênção
  rationale: A construção ἐὰν com o subjuntivo seguida do futuro estabelece uma condição clara; a tradução não deve enfraquecê-la nem explicar sua relação com outras doutrinas.
- issue: Natureza dos ἀγαθά associados à exaltação
  choice: Manter o sentido amplo em “bens”
  alternative: Interpretar como “prosperidade”, “bênçãos” ou “boas obras”
  rationale: O texto não define se os bens são materiais, espirituais ou ambos; a escolha evita resolver essa ambiguidade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural ὑμεῖς. A colocação “Deus os exaltará” é clara no português brasileiro e preserva a referência plural.
