base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/004.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things.
translation:
  language: pt
  text: E, de fato, ele me deu beleza superior à dos homens formosos de Israel e me preservou até a velhice, com força e beleza; pois, em tudo, eu era semelhante a Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα
  choice: beleza
  rationale: Expressa de modo natural a beleza ou formosura física indicada pelo substantivo grego.
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: superior à dos homens formosos de Israel
  rationale: Preserva a comparação intensiva de ὑπέρ e explicita que a beleza de José excedia a dos homens formosos de Israel.
- source_word: ἐφύλαξέ με
  choice: me conservou
  rationale: No contexto de força e beleza mantidas até a velhice, 'conservou' comunica melhor a preservação continuada do que 'guardou'.
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: com força e beleza
  rationale: Formulação portuguesa natural que mantém os dois atributos do texto grego.
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: em tudo eu era semelhante a Jacó
  rationale: Mantém a abrangência de ἐν πᾶσι sem especificar em quais aspectos se dava a semelhança.
theological_decisions:
- issue: Referente do sujeito implícito em 'deu' e 'conservou'
  choice: ele
  alternative: Deus
  rationale: O grego traz verbos na terceira pessoa sem nomear o sujeito neste versículo; manter o pronome evita acrescentar uma identificação explícita, embora o contexto possa indicar Deus.
- issue: Alcance da semelhança com Jacó
  choice: em tudo
  alternative: em todos os aspectos
  rationale: A tradução conserva a afirmação ampla e potencialmente tensa do original sem restringi-la à aparência, ao caráter ou à experiência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi suavemente ajustada à ordem natural do português, preservando a comparação, a duração até a velhice e a amplitude da semelhança com Jacó.
