base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/003.yaml
  text: For see, you know that through my humility and my long-suffering I took for myself as wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.
translation:
  language: pt
  text: Pois vejam que, por causa da minha humildade e da minha paciência perseverante, tomei para mim por esposa a filha do sacerdote de Heliópolis. Com ela, foram-me dados cem talentos de ouro, e o meu Senhor os sujeitou a mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ γὰρ ὁρᾶτε
  choice: Pois vejam
  rationale: Preserva o chamado enfático à atenção e a ligação explicativa de γάρ, em português natural.
- source_word: ταπείνωσιν
  choice: humildade
  rationale: Mantém o valor moral de atitude humilde no contexto, sem estreitá-lo a mera humilhação sofrida.
- source_word: μακροθυμίαν
  choice: paciência perseverante
  rationale: Expressa tanto a paciência prolongada quanto a constância diante da adversidade.
- source_word: ἔλαβον ἐμαυτῷ εἰς γυναῖκα
  choice: tomei para mim por esposa
  rationale: Conserva explicitamente o reflexivo ἐμαυτῷ e o sentido matrimonial da construção.
- source_word: ἱερέως ἡλιουπόλεως
  choice: sacerdote de Heliópolis
  rationale: Tradução direta do título e do topônimo.
- source_word: κατεδούλωσεν
  choice: sujeitou
  rationale: Comunica domínio ou submissão sem a formulação portuguesa potencialmente enganosa de que o ouro foi literalmente escravizado.
theological_decisions:
- issue: Identidade de «meu Senhor»
  choice: meu Senhor
  alternative: o Senhor
  rationale: Mantém o possessivo explícito μου e não decide se a referência deve ser entendida de modo exclusivamente divino ou senhorial.
- issue: Referente do pronome αὐτούς
  choice: os
  alternative: isso / todas essas coisas
  rationale: Preserva o pronome masculino plural e sua ambiguidade referencial em vez de identificar silenciosamente os talentos, o ouro ou pessoas como único antecedente possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A divisão em duas frases reduz o peso sintático sem alterar a progressão do grego; não foram necessárias notas de rodapé.
