source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ *ἐάν τις θέλει⁷ κακοποιῆσαι ὑμᾶς, ὑμεῖς τῇ ἀγαθοεργείᾳ⁸ εὔχεσθε ὑπὲρ αὐτοῦ, καὶ ἀπὸ παντὸς κακοῦ λυτρωθήσεσθε ὑπὸ⁹ Κυρίου¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/002.yaml
  text: And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.
translation:
  language: pt
  text: E, se alguém quiser fazer mal a vocês, vocês, fazendo o bem, orem por essa pessoa, e serão livrados de todo mal pelo Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοποιῆσαι
  choice: fazer mal
  rationale: Expressa de modo natural e abrangente a ideia de praticar o mal contra alguém, sem restringi-la a dano físico.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: fazendo o bem
  rationale: Reproduz o valor instrumental ou modal do dativo e mantém a ligação entre a prática do bem e a oração pelo agressor.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: orem por essa pessoa
  rationale: Traduz diretamente a oração em favor daquele que pretende fazer o mal, usando formulação inclusiva e natural em português.
- source_word: λυτρωθήσεσθε ὑπὸ Κυρίου
  choice: serão livrados de todo mal pelo Senhor
  rationale: Preserva a voz passiva e explicita o Senhor como agente do livramento, conforme a construção grega.
theological_decisions:
- issue: Relação entre fazer o bem e orar pelo agressor
  choice: Manter “fazendo o bem” como circunstância associada ao mandamento de orar
  alternative: 'Separar em dois imperativos: “façam o bem e orem”'
  rationale: O grego apresenta ἀγαθοεργείᾳ em forma dativa junto de εὔχεσθε, não como um segundo imperativo; a tradução preserva essa relação sem definir de maneira rígida se é instrumental ou modal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural e “essa pessoa” para retomar o referente sem recorrer ao masculino genérico. A ordem da frase acompanha de perto o grego, mas permanece natural em português.
