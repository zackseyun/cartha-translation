  text: '3[a]. And the chief of them said to me, “You are not a slave, for your appearance also makes it plain.” But I told them plainly that I was their slave. 4. And when we had come into Egypt, they disputed concerning me, as to who would deceive the merchant and receive money for me. 5. So it seemed good to all of them to leave me in Egypt with the merchant of their trade until they should return bringing merchandise[b]. 6. But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me. 7. And God blessed him in my hands, and increased him on my account in gold and silver and work. 8. And I was with him three months.


    1. Now at that time the wife of Pentephri came down to Memphis with great display, because she had heard about me from her eunuchs. 2. And she said to her husband, “The merchant has grown rich by the hands of a certain young Hebrew; and they say that he was stolen away by theft from the land of Canaan. 3. Now therefore execute judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you[c], because grace from heaven is upon him.”'
translation:
  language: pt
  text: '3.[a] O chefe deles me disse: “Você não é escravo, pois até a sua aparência deixa isso claro.” Eu, porém, lhes disse que era escravo deles. 4. Quando chegamos ao Egito, discutiram a meu respeito sobre quem enganaria o mercador e receberia dinheiro por mim. 5. Então todos concordaram em me deixar no Egito com o mercador de seu comércio, até que voltassem trazendo mercadorias. 6. Mas o Senhor me concedeu favor aos olhos do mercador, e ele confiou sua casa aos meus cuidados. 7. Deus o abençoou por minhas mãos e o fez prosperar em ouro, prata e atividade.[b] 8. Fiquei com ele durante três meses.


    1. Naquele tempo, a mulher de Pentephri[c] desceu a Mênfis com grande ostentação, pois tinha ouvido falar de mim por meio dos eunucos dela. 2. Ela disse ao marido: “O mercador enriqueceu pelas mãos de certo jovem hebreu; e dizem que ele foi roubado e tirado da terra de Canaã. 3. Portanto, agora julgue o caso dele e leve o jovem para a nossa casa. O Deus dos hebreus abençoará você, pois o favor do céu está sobre ele.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego desta parte é áspero e talvez esteja corrompido ou comprimido. A frase “quem enganaria o mercador e receberia dinheiro por mim” pode preservar de modo obscuro um relato da venda de José.
    reason: textual_variant
  - marker: b
    text: 'Ou: “e o fez prosperar em ouro, prata e trabalho/produção/negócios”. O último termo grego é difícil neste testemunho.'
    reason: lexical_alternative
  - marker: c
    text: Pentephri é a forma grega de um nome egípcio tradicionalmente relacionado a Potifar e à casa de Potifar nas tradições de Gênesis.
    reason: cross_reference
lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: O contexto é de venda e propriedade humana; “escravo” preserva essa realidade social sem suavizá-la como “servo” faria.
- source_word: ἡ ὄψις σου δηλοῖ
  choice: a sua aparência deixa isso claro
  rationale: Expressa naturalmente a inferência baseada na aparência ou no porte de José.
- source_word: μετάβολος
  choice: mercador
  rationale: No contexto, designa um comerciante que negocia pessoas e mercadorias; “mercador” mantém o tom narrativo digno.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: confiou sua casa aos meus cuidados
  rationale: Torna explícito o sentido idiomático de administração da casa, sem sugerir mera entrega de um edifício.
- source_word: ἐν χειρί μου
  choice: por minhas mãos
  rationale: Preserva o idioma bíblico de agência, com uma formulação natural em português.
- source_word: ἔργῳ
  choice: trabalho
  rationale: Mantém a amplitude do termo difícil, que pode abranger produção, atividade ou negócio, sem especificação indevida.
- source_word: μετὰ δόξης πολλῆς
  choice: com grande ostentação
  rationale: Aqui δόξα indica pompa ou exibição exterior, não glória em sentido teológico.
- source_word: εὐνοῦχοι
  choice: eunucos
  rationale: Conserva o sentido literal do termo grego, embora ele também possa designar oficiais da corte.
- source_word: κρίσιν
  choice: julgue o caso dele
  rationale: Comunica a ação judicial solicitada em português atual e claro.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: o favor do céu está sobre ele
  rationale: Neste contexto, χάρις é favor divino; “está sobre ele” preserva a imagem direcional sem impor terminologia doutrinária.
theological_decisions:
- issue: Distinção entre κύριος e θεός nos versículos 6–7
  choice: “o Senhor” no v. 6 e “Deus” no v. 7
  alternative: Uniformizar ambos como “Deus” ou “Senhor Deus”
  rationale: O grego emprega títulos diferentes em versículos consecutivos; a tradução preserva essa variação.
- issue: Mudança abrupta de cena após o v. 8
  choice: Manter a transição tal como sobrevive no texto grego
  alternative: Reconstruir uma ligação narrativa ou harmonizar com Gênesis 39
  rationale: A fonte é textualmente áspera; não se deve importar material ausente nem ocultar a descontinuidade.
- issue: Favor divino sobre José
  choice: “o favor do céu está sobre ele”
  alternative: “a graça do céu está sobre ele”
  rationale: “Favor” comunica o valor contextual de χάρις sem transformar necessariamente a frase em uma formulação técnica posterior.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Empregou-se “você” na fala direta por naturalidade internacional com boa recepção no Brasil; conservaram-se alguns ecos do idioma bíblico, como “por minhas mãos” e “favor aos olhos”, sem rigidez excessiva. A numeração começa em 3 porque o material fornecido continua a unidade anterior antes de iniciar o capítulo XII.
