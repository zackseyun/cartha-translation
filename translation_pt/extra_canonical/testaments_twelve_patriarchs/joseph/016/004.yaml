  text: Then she sent another eunuch, saying, “Even if they ask two minas, pay them. Do not spare the gold. Only buy the boy and bring him to me.”
translation:
  language: pt
  text: 'Então ela enviou outro eunuco, dizendo: “Mesmo que peçam duas minas, paguem. Não poupem o ouro. Apenas comprem o rapaz e tragam o rapaz para mim.”'
