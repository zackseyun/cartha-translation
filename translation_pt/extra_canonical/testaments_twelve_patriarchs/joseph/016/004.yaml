lexical_decisions:
- source_word: εὐνοῦχον ἕτερον
  choice: outro eunuco
  rationale: Reproduz diretamente o sentido e a ordem natural da expressão grega.
- source_word: δύο μνᾶς
  choice: duas minas
  rationale: Mantém a unidade monetária antiga, sem substituí-la por um valor moderno impreciso.
- source_word: παρέχετε
  choice: paguem
  rationale: No contexto de uma quantia pedida na compra, expressa naturalmente a ordem de entregar o valor solicitado.
- source_word: τὸν παῖδα
  choice: o rapaz
  rationale: Neste contexto, designa José como jovem ou servo; “rapaz” preserva a referência etária sem impor aqui o sentido de “escravo”.
- source_word: ἄγαγε πρός με
  choice: o tragam para mim
  rationale: Verte o movimento em direção à mulher em português corrente e digno.
