  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/001.yaml
  text: But Memphis said to her husband, “Buy the young man, for I hear,” she says, “that they are selling him.”
translation:
  language: pt
  text: 'Mas Mênfis disse ao marido: “Compre o jovem, pois ouço”, ela diz, “que o estão vendendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  choice: Mênfis
  rationale: Transliteração portuguesa natural do nome próprio grego, com acento para indicar a pronúncia.
- source_word: Ἀγόρασον
  choice: Compre
  rationale: Imperativo singular dirigido ao marido; a forma de tratamento implícita é natural no português moderno.
- source_word: νεανίαν
  choice: jovem
  rationale: Expressa um homem jovem sem acrescentar uma faixa etária mais específica do que o grego.
- source_word: ἀκούω
  choice: ouvi dizer
  rationale: Neste contexto, o verbo indica informação recebida por relato, não apenas percepção auditiva direta.
- source_word: πωλοῦσιν αὐτόν
  choice: estão vendendo-o
  rationale: Preserva o aspecto presente e traduz αὐτόν por pronome, mantendo claro o referente.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção parentética φησίν foi incorporada idiomaticamente em “ouvi dizer”, evitando o pouco natural “ouço, diz ela”, sem alterar o conteúdo da fala.
