  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/005.yaml
  text: So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”
translation:
  language: pt
  text: 'Então o eunuco veio, deu-lhes oitenta moedas de ouro e me levou consigo; mas disse à egípcia: “Dei cem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: eunuco
  rationale: Equivalente direto e historicamente apropriado para o termo grego.
- source_word: ὀγδοήκοντα χρυσοῦς
  choice: oitenta moedas de ouro
  rationale: O substantivo implícito após o numeral e o adjetivo monetário é expresso em português para dar clareza natural sem especificar uma denominação ausente do grego.
- source_word: ἀνελάβετό με
  choice: me levou consigo
  rationale: Reproduz o sentido contextual de tomar José e levá-lo, evitando o pouco natural e potencialmente ambíguo “tomou-me”.
- source_word: δέδωκα ἑκατόν
  choice: Paguei cem
  rationale: No contexto de uma compra, “paguei” comunica naturalmente o valor de δέδωκα; “cem” preserva a elipse do objeto monetário, facilmente recuperável pelo contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. A conjunção adversativa δέ foi vertida por “mas”, preservando o contraste entre o valor efetivamente entregue e o valor declarado à egípcia.
