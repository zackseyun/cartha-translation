  text: So she immediately sent a eunuch among the Ishmaelites, asking for me to be sold.
translation:
  language: pt
  text: Então ela enviou imediatamente um eunuco entre os ismaelitas, pedindo que me vendessem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐθέως
  choice: imediatamente
  rationale: Expressa de modo natural o sentido temporal de ação sem demora.
- source_word: ἀπέστειλεν
  choice: enviou
  rationale: Equivalente direto e idiomático do verbo grego no contexto.
- source_word: εὐνοῦχον
  choice: um eunuco
  rationale: Preserva a designação explícita da pessoa enviada.
- source_word: ἐν τοῖς Ἰσμαϊλίταις
  choice: entre os ismaelitas
  rationale: Mantém o valor locativo de ἐν e evita transformar a expressão em simples destino, como seria 'aos ismaelitas'.
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: pedindo que me vendessem
  rationale: Comunica em português corrente o pedido para que José fosse objeto de uma venda, sem acrescentar que seria vendido especificamente a ela.
