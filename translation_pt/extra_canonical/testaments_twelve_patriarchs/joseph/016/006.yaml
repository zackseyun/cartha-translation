  rationale: Expressa de modo natural e direto o silêncio deliberado indicado pelo aoristo grego.
- source_word: αἰσχυνθῇ
  choice: fosse envergonhado
  rationale: Preserva a forma passiva e a ideia de ser exposto à vergonha, sem decidir se o sentido predominante é vergonha interior ou humilhação pública.
- source_word: ὁ εὐνοῦχος
  choice: o eunuco
  rationale: Equivalência lexical direta, preservando a designação explícita da personagem no texto grego.
