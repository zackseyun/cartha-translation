source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὁ δὲ εὐνοῦχος *μὴ θελήσας ἀγοράσαι με⁴ ἀνεχώρησεν πειράσας αὐτούς, καὶ δηλοῖ τῇ δεσποίνῃ αὐτοῦ, ὅτι πολλὴν τιμὴν αἰτοῦσιν τοῦ παιδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/003.yaml
  text: But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.
translation:
  language: pt
  text: Mas o eunuco, não querendo me comprar, retirou-se depois de pô-los à prova e informou à sua senhora que eles estavam pedindo um preço muito alto pelo rapaz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: eunuco
  rationale: Equivalente direto e historicamente adequado ao substantivo grego.
- source_word: πειράσας αὐτούς
  choice: depois de pô-los à prova
  rationale: Preserva a ideia de testar ou sondar os vendedores, sem especificar um método que o texto não informa.
- source_word: δεσποίνῃ
  choice: senhora
  rationale: Expressa a mulher que detinha autoridade sobre o eunuco; evita o sentido moderno mais estreito de “patroa”.
- source_word: πολλὴν τιμὴν
  choice: um preço muito alto
  rationale: No contexto de compra, τιμή designa o preço pedido; “muito alto” comunica naturalmente πολλήν.
- source_word: παιδός
  choice: rapaz
  rationale: No contexto, refere-se a José como jovem; “rapaz” preserva isso sem sugerir necessariamente uma criança pequena.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. O presente histórico δηλοῖ foi vertido no passado (“informou”) para manter a sequência narrativa em português.
