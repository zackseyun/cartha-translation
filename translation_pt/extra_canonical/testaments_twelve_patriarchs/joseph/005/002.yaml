source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐγὼ οὖν, ὡς ἤκουσα τοῦτο, διέρρηξα *τὰ ἱμάτιά⁷ μου, καὶ εἶπον ⌜αὐτῇ⌝⁸· Γύναι, αἰδέσθητι τὸν Θεόν⁹, καὶ¹⁰ μὴ ποιήσῃς τὴν *πρᾶξιν ταύτην τὴν πονηράν¹¹, ἵνα μὴ¹² ἐξολοθρευθῇς· *ἐπεὶ καίγε γίνωσκε ὅτι ἐγὼ¹³ ἐξαγγελῶ¹⁴ *πᾶσιν τὴν ἐπίνοιάν σου ταύτην¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/002.yaml
  text: 'So when I heard this, I tore my garments and said to her, “Woman, have reverence for God, and do not do this evil deed, lest you be destroyed. For know this also: I will tell everyone of this scheme of yours.”'
translation:
  language: pt
  text: 'Assim, quando ouvi isso, rasguei minhas vestes e lhe disse: “Mulher, tenha reverência por Deus e não cometa esta ação perversa, para que você não seja destruída. Pois saiba também que eu revelarei a todos esse seu plano.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξα τὰ ἱμάτιά μου
  choice: rasguei minhas vestes
  rationale: Preserva a expressão concreta e solene do grego, bem como o gesto antigo de profunda aflição.
- source_word: αἰδέσθητι τὸν Θεόν
  choice: tenha reverência por Deus
  rationale: αἰδέομαι aqui comunica respeito reverente acompanhado de vergonha ou escrúpulo moral; esta formulação evita reduzir o sentido apenas a medo ou vergonha.
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: esta ação perversa
  rationale: Representa πρᾶξις e πονηράν de modo direto, sem acrescentar a ideia de transgressão da lei, ausente no texto grego apresentado.
- source_word: ἐξολοθρευθῇς
  choice: você não seja destruída
  rationale: Mantém a força do verbo passivo e não especifica o agente da destruição, que permanece implícito no original.
- source_word: ἐξαγγελῶ πᾶσιν
  choice: contarei a todos
  rationale: Expressa naturalmente a ideia de divulgar ou dar a conhecer publicamente.
- source_word: τὴν ἐπίνοιάν σου ταύτην
  choice: este seu plano
  rationale: ἐπίνοια designa aqui um propósito ou desígnio concebido; 'plano' é natural e preserva o caráter intencional sem intensificá-lo indevidamente.
theological_decisions:
- issue: Sentido de αἰδέσθητι diante de Deus
  choice: tenha reverência por Deus
  alternative: tema a Deus / envergonhe-se diante de Deus
  rationale: A escolha conserva a combinação de respeito, pudor e contenção moral possível em αἰδέομαι, sem impor exclusivamente a linguagem do temor religioso nem da vergonha.
- issue: Agente da possível destruição
  choice: 'passiva sem agente: “seja destruída”'
  alternative: “Deus a destrua”
  rationale: O grego usa o passivo ἐξολοθρευθῇς sem nomear quem destruiria; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se “vestes” pelo tom narrativo solene; “lhe disse” e “você” dão naturalidade sem coloquialismo excessivo. Nenhum marcador de nota é necessário.
