  rationale: No contexto, ἀξιόω com pessoa e oração de conteúdo transmite um pedido insistente; «implorou-me» preserva essa força em português corrente.
- source_word: ἐξαγγελῶ
  choice: revelasse
  rationale: O verbo indica dar a conhecer ou divulgar algo; «revelasse» é idiomático e adequado ao segredo do plano.
- source_word: ἐπίνοιαν
  choice: plano
  rationale: Aqui o termo denota uma intenção ou desígnio concebido; «plano» preserva o sentido contextual sem acrescentar necessariamente uma avaliação moral.
