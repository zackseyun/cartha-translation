  text: And she went away, enticing me with gifts and every kind of pleasure.
translation:
  language: pt
  text: E ela se retirou, seduzindo-me com presentes e toda espécie de prazeres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: se retirou
  rationale: Expressa naturalmente o afastamento indicado pelo verbo grego, sem acrescentar destino ou motivo.
- source_word: ἐπιθάλπουσά
  choice: procurando me seduzir
  rationale: No contexto, o particípio descreve uma tentativa de atrair ou conquistar José mediante incentivos; “seduzir” preserva a dimensão moral e sexual da cena, enquanto “procurando” evita apresentar a tentativa como bem-sucedida.
- source_word: δώροις
  choice: com presentes
  rationale: Equivalente direto e corrente para o instrumental dativo grego.
- source_word: ἀπολαύσεσι πάσαις
  choice: toda espécie de prazeres
  rationale: Forma idiomática que comunica a abrangência de πᾶς sem sugerir literalmente que cada prazer possível foi oferecido.
theological_decisions:
- issue: Natureza da tentativa da mulher
  choice: procurando me seduzir
  alternative: procurando me conquistar
  rationale: A escolha mantém a força moral e sexual do contexto sem introduzir uma interpretação denominacional nem afirmar que José cedeu.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a coordenação simples do grego e explicita apenas o valor circunstancial natural do particípio.
