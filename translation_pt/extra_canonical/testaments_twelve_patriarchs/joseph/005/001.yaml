  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/001.yaml
  text: And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as a husband.”
translation:
  language: pt
  text: 'E novamente, em outra ocasião, ela me disse: “Se você não quer cometer adultério, matarei meu marido com veneno e tomarei você como marido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: cometer adultério
  rationale: Expressa de modo direto e natural o infinitivo grego, preservando a natureza sexual e conjugal da proposta.
- source_word: ἀνελῶ
  choice: matarei
  rationale: Traduz claramente o futuro de ἀναιρέω no sentido de tirar a vida.
- source_word: φαρμάκῳ
  choice: com veneno
  rationale: Neste contexto, o dativo indica o meio pelo qual ela pretende matar o marido.
- source_word: λήψομαί σε εἰς ἄνδρα
  choice: tomarei você como marido
  rationale: Preserva a construção grega sem acrescentar o possessivo “meu”; em português, “tomar alguém como marido” é compreensível e mantém o tom solene.
