base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/010.yaml
  text: And she said to her husband, “The merchant has grown rich through the hands of a certain young Hebrew; and they say that he also was stolen by theft from the land of Canaan.”
translation:
  language: pt
  text: 'E ela disse ao marido: “O mercador enriqueceu por meio de certo jovem hebreu; e dizem que ele também foi roubado da terra de Canaã.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: mercador
  rationale: No contexto, designa aquele que negocia ou comercializa; “mercador” é natural e preserva a função indicada pelo termo.
- source_word: ἐπλούτησεν ... ἐν χερσίν
  choice: enriqueceu por meio de
  rationale: A expressão indica que o mercador prosperou mediante a atuação do jovem; a formulação portuguesa mantém a ideia instrumental sem reproduzir um idioma grego pouco natural.
- source_word: τινος νέου Ἑβραίου
  choice: certo jovem hebreu
  rationale: Preserva a indefinição de τινος e traduz diretamente a identificação étnica.
- source_word: κλοπῇ ἔκλεψαν αὐτόν
  choice: foi roubado
  rationale: O cognato enfático grego, literalmente “roubaram-no com roubo”, não admite repetição natural equivalente em português; a voz passiva mantém o foco em José como vítima de rapto ou furto.
- source_word: ἐκ γῆς Χαναάν
  choice: da terra de Canaã
  rationale: Tradução direta e idiomática da procedência.
