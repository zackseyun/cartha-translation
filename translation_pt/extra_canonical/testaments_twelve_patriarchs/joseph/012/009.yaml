base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/009.yaml
  text: At that time the wife of Pentephri came down to Memphis in a litter, with great splendor, because she had heard about me from her eunuchs.
translation:
  language: pt
  text: Naquele tempo, a mulher de Pentefri desceu a Mênfis numa liteira[a], com grande esplendor, porque tinha ouvido falar de mim por meio dos seus eunucos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego correspondente a “numa liteira” está assinalado como incerto na edição.
    reason: A edição coloca ἐν λαμπήνῃ entre cruzes, indicando dificuldade ou incerteza textual que não deve ser ocultada.
lexical_decisions:
- source_word: κατῆει Μέμφις
  choice: desceu a Mênfis
  rationale: Preserva o sentido direcional de κατῆει e apresenta o destino de modo natural em português.
- source_word: ἐν λαμπήνῃ
  choice: numa liteira
  rationale: Λαμπήνη designa um veículo de transporte, provavelmente uma liteira ou carruagem coberta; “liteira” acompanha a evidência adotada pelo texto de consulta, sem ocultar a incerteza textual indicada em nota.
- source_word: μετὰ δόξης πολλῆς
  choice: com grande pompa
  rationale: No contexto de uma chegada pública e luxuosa, “pompa” expressa com naturalidade a ostentação e magnificência de δόξα.
- source_word: παρὰ τῶν εὐνούχων αὐτῆς
  choice: por meio dos seus eunucos
  rationale: Torna explícita a função deles como fonte da informação, preservando o substantivo εὐνούχων.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. “Mênfis” e “Pentefri” seguem formas portuguesas transparentes dos nomes; “com grande pompa” evita uma formulação excessivamente literal e comunica o cenário de magnificência.
