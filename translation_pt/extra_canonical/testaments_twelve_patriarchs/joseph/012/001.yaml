base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/001.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a slave?” And I said that I was a household slave, so that I might not put my brothers to shame.
translation:
  language: pt
  text: 'Quando eu ia com os ismaelitas, eles ficavam me perguntando: “Você é escravo?” Eu respondi que era escravo pertencente a uma casa, para não envergonhar meus irmãos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: Quando eu ia com os ismaelitas
  rationale: Expressa naturalmente a circunstância temporal e o deslocamento conjunto indicados pelo particípio e por μετά.
- source_word: ἐπηρώτων
  choice: ficavam me perguntando
  rationale: O imperfeito sugere pergunta repetida ou insistente, nuance preservada pela perífrase.
- source_word: δοῦλος
  choice: escravo
  rationale: Mantém o sentido social forte e direto do termo grego, sem suavizá-lo para “servo”.
- source_word: δοῦλος ... ἐξ οἴκου
  choice: escravo de uma casa
  rationale: Reproduz de perto a formulação grega, que parece apresentar José como escravo pertencente a uma casa, sem especificar além do que o texto permite.
- source_word: αἰσχύνω
  choice: envergonhar
  rationale: Transmite a ideia de causar vergonha ou desonra aos irmãos em português claro e digno.
theological_decisions:
- issue: Natureza da alegação de José sobre sua condição
  choice: era escravo de uma casa
  alternative: era escravo doméstico / era escravo por nascimento
  rationale: A expressão ἐξ οἴκου é concisa e potencialmente ambígua. A tradução conserva sua referência à casa sem decidir que José fazia trabalho doméstico nem que nascera escravo.
translation_notes:
  register: Português moderno, claro e narrativo, com legibilidade brasileira. Emprega “você” na fala direta por naturalidade contemporânea e preserva a repetição verbal do imperfeito grego.
