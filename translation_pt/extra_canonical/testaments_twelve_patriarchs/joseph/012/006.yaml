lexical_decisions:
- source_word: χάριν ἐν ὀφθαλμοῖς
  choice: favor aos olhos
  rationale: Preserva a expressão idiomática semítica refletida no grego e permanece clara em português.
- source_word: τοῦ μεταβόλου
  choice: do mercador
  rationale: No contexto narrativo, designa o comerciante que havia adquirido José; “mercador” é natural e preciso.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: ele me confiou sua casa
  rationale: Expressa diretamente a ideia de colocar a casa e sua administração sob a responsabilidade de José, sem explicitação além do texto.
theological_decisions:
- issue: Agência divina e humana
  choice: O Senhor concede favor; o mercador confia a casa a José.
  alternative: Entender que o próprio Senhor confiou a casa a José.
  rationale: 'A mudança de sujeito é indicada pelo contexto e pela construção: Deus concede favor diante do mercador, e este, em consequência, confia sua casa a José.'
