  text: And God blessed him in my hand, and increased him on my account in gold and silver and goods.
translation:
  language: pt
  text: E Deus o abençoou sob os meus cuidados e o fez prosperar em ouro, prata e bens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χειρί μου
  choice: por meio de mim
  rationale: A expressão grega é literalmente «em minha mão», mas aqui indica a atuação ou administração de José; a formulação natural em português conserva esse sentido instrumental sem sugerir posse física.
- source_word: ἐπλήθυνεν αὐτόν
  choice: aumentou-lhe
  rationale: O verbo significa multiplicar ou fazer aumentar. Com os itens materiais que seguem, a construção portuguesa comunica que Deus aumentou os recursos daquele homem.
- source_word: ἐν χρυσίῳ καὶ ἀργυρίῳ καὶ ἔργῳ
  choice: o ouro, a prata e os bens
  rationale: Ouro e prata são mantidos diretamente. Embora ἔργον costume significar «obra» ou «trabalho», neste contexto de prosperidade material «bens» expressa melhor o provável valor contextual, sem tornar a frase artificial.
theological_decisions:
- issue: Agente da bênção e mediação de José
  choice: 'Deus é explicitamente o agente, e José é apresentado como o meio humano: «Deus o abençoou por meio de mim».'
  alternative: «Deus o abençoou em minha mão» ou «sob os meus cuidados».
  rationale: A tradução mantém a afirmação teológica do texto de que a prosperidade procede de Deus, sem transformar José na fonte da bênção.
- issue: Sentido causal de ἐν χειρί μου e da relação de José com o aumento
  choice: «por meio de mim» na primeira oração e «por minha causa» na segunda.
  alternative: Repetir «por meio de mim» ou traduzir ambas de modo literal com «em minha mão».
  rationale: A distinção oferece português natural e segue a compreensão contextual refletida na tradição de tradução, sem apagar que a sintaxe grega da segunda oração é condensada.
translation_notes:
  register: Português moderno, digno e acessível, com ordem sintática natural. Evitou-se o literalismo opaco «em minha mão» e preservou-se a atribuição inequívoca da bênção a Deus.
