  naturalness: A redação é fluente, mas a duplicação de «por meio de mim» e «por minha causa» torna a frase mais interpretativa do que o original. «O fez prosperar em ouro, prata e bens» é natural em português moderno e reproduz adequadamente a construção de aumento material.
