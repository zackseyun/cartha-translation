base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/005.yaml
  text: So it seemed good to all of them for me to remain in Egypt with the merchant of their trade until they should return bringing merchandise.
translation:
  language: pt
  text: Por isso, todos acharam melhor que eu permanecesse no Egito com o negociante do comércio deles, até que voltassem trazendo mercadorias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξεν
  choice: acharam melhor
  rationale: Expressa de modo natural a decisão conjunta indicada por ‘pareceu bem’, sem alterar seu sentido.
- source_word: τοῦ εἶναι με
  choice: que eu permanecesse
  rationale: No contexto, εἶναι descreve a permanência de José no Egito enquanto os demais partiam, não o ato de o deixarem ali.
- source_word: μετάβολον τῆς ἐμπορίας αὐτῶν
  choice: o negociante do comércio deles
  rationale: Mantém a referência a um agente mercantil ligado às atividades comerciais do grupo, sem especificar uma função técnica que o grego não torna inequívoca.
- source_word: ἐμπορίαν
  choice: mercadorias
  rationale: Neste contexto, o termo designa os bens comerciais que eles trariam ao retornar.
