base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/003.yaml
  text: And the chief of them said to me, “You are not a slave, for your appearance also makes it plain.” But I told them plainly that I was their slave.
translation:
  language: pt
  text: 'E o chefe deles me disse: “Você não é escravo, pois a sua aparência também deixa isso claro.” Mas eu lhes disse que era escravo deles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: o chefe deles
  rationale: Embora μείζων signifique literalmente “o maior”, no contexto de um grupo indica naturalmente aquele que ocupa posição superior ou de liderança.
- source_word: δοῦλος
  choice: escravo
  rationale: Preserva o sentido social e jurídico mais forte do grego, sem o atenuar para “servo”.
- source_word: ἡ ὄψις σου
  choice: a sua aparência
  rationale: ὄψις se refere ao aspecto visível ou aparência da pessoa.
- source_word: δηλοῖ
  choice: deixa isso claro
  rationale: Expressa de modo natural o valor de “tornar manifesto, evidenciar”.
- source_word: λέγω αὐτοῖς
  choice: eu lhes declarei
  rationale: A formulação comunica uma resposta afirmativa e explícita; evita a estranheza de “disse-lhes claramente” sem acrescentar conteúdo.
- source_word: ὑπάρχω
  choice: era
  rationale: No discurso indireto em português, “era” transmite naturalmente o estado afirmado por José; não é necessário reproduzir de modo rígido o verbo grego de existência.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” na fala direta e preserva a distinção entre a avaliação do chefe e a insistência de José em sua condição de escravo.
