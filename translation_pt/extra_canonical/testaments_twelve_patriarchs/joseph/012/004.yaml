  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/004.yaml
  text: And when we had come into Egypt, they disputed concerning me, as to who, after betraying me, would receive the gold.
translation:
  language: pt
  text: 'E, quando chegamos ao Egito, eles disputavam a meu respeito: quem, depois de me trair, receberia o ouro.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφθάσαμεν
  choice: chegamos
  rationale: No contexto, o verbo expressa a chegada ao Egito; o pretérito perfeito soa natural e preserva o sentido.
- source_word: ἐμάχοντο
  choice: discutiam
  rationale: O verbo pode indicar luta ou contenda; aqui, a disputa verbal sobre quem receberia o ouro é adequadamente expressa por “discutiam”.
- source_word: προδοὺς
  choice: depois de me trair
  rationale: O particípio de προδίδωμι significa entregar ou trair. A formulação mantém a ideia de traição e explicita naturalmente a relação temporal do particípio.
- source_word: χρυσίον
  choice: o ouro
  rationale: Traduz diretamente o termo grego para ouro, sem generalizá-lo como dinheiro.
