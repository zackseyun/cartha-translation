  text: And the chief of them said to me, “You are not a slave, for your appearance also makes it plain.” But I told them plainly that I was their slave.
translation:
  language: pt
  text: 'E o principal deles me disse: “Você não é escravo, pois até a sua aparência deixa isso claro.” Mas eu lhes disse que era escravo deles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: o principal deles
  rationale: Expressa a posição superior ou de liderança sem restringir indevidamente o sentido a idade ou tamanho físico.
- source_word: δοῦλος
  choice: escravo
  rationale: Mantém o sentido social forte do termo grego, em vez do mais brando e ambíguo “servo”.
- source_word: ἡ ὄψις σου
  choice: a sua aparência
  rationale: Reproduz naturalmente a referência ao aspecto visível de José.
- source_word: δηλοῖ
  choice: deixa isso claro
  rationale: Transmite de modo corrente e digno a ideia de tornar manifesto ou evidente.
- source_word: ὑπάρχω
  choice: sou
  rationale: O verbo indica o estado ou condição de José; em português natural, a cópula simples preserva adequadamente o sentido.
