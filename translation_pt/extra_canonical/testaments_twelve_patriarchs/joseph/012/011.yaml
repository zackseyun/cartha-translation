  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/011.yaml
  text: Now therefore render judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you, because grace from heaven is upon him.
translation:
  language: pt
  text: Agora, portanto, julga o caso dele, leva o jovem para a nossa casa, e o Deus dos hebreus abençoará você, porque a graça do céu está sobre ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: julga o caso dele
  rationale: Expressa de modo natural em português a ideia de proferir ou exercer juízo a respeito dele, sem sugerir execução de pena.
- source_word: ἀφελοῦ τὸν νεανίαν εἰς τὸν οἶκον ἡμῶν
  choice: leva o jovem para a nossa casa
  rationale: No contexto, ἀφελοῦ indica tomar ou retirar o jovem e conduzi-lo à casa; a formulação evita rigidez desnecessária.
- source_word: εὐλογῆσαί σε ἔχει
  choice: abençoará você
  rationale: A construção perifrástica grega comunica uma ação futura; o futuro simples é claro e natural.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: a graça do céu está sobre ele
  rationale: Preserva a imagem de favor celeste dirigido ao jovem e acompanha a leitura contextual refletida na tradição textual consultada.
theological_decisions:
- issue: Identidade divina na expressão ὁ Θεὸς τῶν Ἑβραίων
  choice: o Deus dos hebreus
  alternative: Deus dos hebreus
  rationale: Mantém a designação histórica e teológica explícita do texto grego sem ampliação confessional.
- issue: Sentido de χάρις
  choice: graça
  alternative: favor
  rationale: “Graça” conserva a densidade religiosa do termo, embora “favor” também seja lexicalmente possível; o complemento “do céu” esclarece sua procedência.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “você” para o singular de segunda pessoa, evitando tanto arcaísmo quanto regionalismo marcado.
