  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020.yaml
  text: '1[[to the Hippodrome]]. For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.


    2. But you shall carry up my bones with you[3a], for when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.


    3. And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.


    3a. But another reading says: “And bring up Zelpha your mother, and place her near Bilhah [by the Hippodrome], close to Rachel.”


    12. For my kingdom among you will be brought to completion like a watchman’s hut in an orchard[12b][12], which does not appear after the summer.”'
translation:
  language: pt
  text: '**Testamento de José 20**


    **1.** Pois sei que, depois da minha morte, os egípcios oprimirão vocês. Deus, porém, executará vingança em favor de vocês e os levará às promessas de seus pais.


    **2.** Mas vocês levarão consigo os meus ossos, pois, quando os meus ossos forem levados para lá, o Senhor estará com vocês na luz, e Beliar estará com os egípcios nas trevas.


    **3.** Levem também Asenate, mãe de vocês, ao Hipódromo[a] e sepultem-na perto de Raquel, minha mãe.[b]


    **4.** Depois de dizer isso, José estendeu os pés e adormeceu num sono sereno.


    **5.** Todo o Israel e todo o Egito guardaram grande luto por ele.


    **6.** Quando os filhos de Israel saíram do Egito, recolheram os ossos de José e o sepultaram em Hebrom, junto de seus pais. Os anos de sua vida foram cento e dez.


    **12.**[c] Pois o reino dele será um reino eterno, que não passará; o meu reino, porém, será levado a cumprimento entre vocês, como uma cabana de vigia num pomar[d], que desaparece depois do verão.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “ao Hipódromo” está entre colchetes no testemunho grego fornecido e é textualmente incerta.
    reason: textual_variant
  - marker: b
    text: 'Alguns testemunhos trazem, em lugar desta instrução: “Façam subir Zelfa, mãe de vocês, e coloquem-na perto de Bila, junto ao Hipódromo, próximo de Raquel.”'
    reason: alternative_reading
  - marker: c
    text: O material fornecido passa do versículo 6 para um trecho identificado como eco de 19.12 e associado ao versículo 12. A sequência parece abreviada, deslocada ou preservada de forma fragmentária.
    reason: textual_variant
  - marker: d
    text: A cabana de vigia era um abrigo temporário deixado no campo depois da estação da colheita; a imagem ressalta algo passageiro. Compare Isaías 1.8.
    reason: cross_reference
lexical_decisions:
- source_word: τελευτή
  choice: morte
  rationale: No contexto testamentário, designa diretamente a morte de José; “fim” seria menos específico.
- source_word: θλίψουσιν
  choice: oprimirão
  rationale: Expressa tratamento duro e prolongado, adequado ao contexto da opressão no Egito.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: executará vingança em favor de vocês
  rationale: Preserva a força ativa de ἐκδίκησις e deixa claro que Deus age em favor do povo, sem reduzir o termo a cuidado providencial genérico.
- source_word: ἐπάξει ... εἰς τὰς ἐπαγγελίας
  choice: os levará às promessas
  rationale: Mantém a construção incomum do grego e sua ressonância pactual, sem acrescentar explicitamente a ideia de retorno.
- source_word: συνανοίσετε
  choice: levarão consigo
  rationale: Comunica de modo natural o transporte dos ossos juntamente com o povo; a direção ascendente está implícita no movimento para fora do Egito.
- source_word: ἐν φωτί / ἐν σκότει
  choice: na luz / nas trevas
  rationale: Conserva o paralelismo simbólico e apocalíptico das duas expressões.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Translitera a forma do testemunho grego, sem harmonizá-la com “Belial” ou interpretá-la como “Satanás”.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: adormeceu num sono sereno
  rationale: Mantém o eufemismo de morte e verte καλῷ em português digno e natural, evitando o pouco idiomático “bom sono”.
- source_word: ὀπωροφυλάκιον
  choice: cabana de vigia num pomar
  rationale: Representa uma estrutura temporária usada para vigiar uma plantação ou pomar e preserva a imagem sazonal.
- source_word: ἐπιτελεῖται
  choice: chega ao fim
  rationale: No contraste com o reino eterno que não passará e com a cabana que desaparece, a expressão indica a consumação ou término do reino de José.
theological_decisions:
- issue: Força da vingança divina em ἐκδίκησις
  choice: Deus executa vingança em favor do povo oprimido.
  alternative: Deus apenas cuida do povo ou realiza justiça abstrata.
  rationale: O substantivo grego admite vindicação e vingança ativa. A formulação preserva essa tensão sem suavizá-la.
- issue: Contraste entre o Senhor e Beliar
  choice: Manter Beliar como figura pessoal, com o Senhor na luz e Beliar nas trevas.
  alternative: Substituir Beliar por “maldade”, “Belial” ou “Satanás”.
  rationale: O testemunho personifica Beliar; traduzir diretamente evita harmonização ou desmitologização.
- issue: Antecedente de αὐτοῦ em “o reino dele”
  choice: Preservar o pronome sem identificar seu referente.
  alternative: Explicitar “o reino de Deus”, “do Messias” ou outra identificação.
  rationale: O excerto fornecido não contém antecedente inequívoco, e acrescentar um nome resolveria indevidamente a ambiguidade.
- issue: Instabilidade da instrução de sepultamento
  choice: Seguir no texto principal a leitura com Asenate e Raquel e registrar a leitura com Zelfa e Bila em nota.
  alternative: Preferir a variante de Zelfa ou fundir as duas tradições.
  rationale: Assim se mantém legível a leitura principal do grego fornecido, sem ocultar a variante testemunhada pela camada crítica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”), nomes bíblicos correntes em português e sintaxe clara. Preservaram-se a aspereza teológica de “vingança”, a personificação de Beliar, a ambiguidade de “o reino dele” e a descontinuidade textual do trecho final.
