source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἑώρων ὅτι τρεῖς¹⁴ ἔλαφοι τρεῖς ἀμνοὶ ἐγίνοντο καὶ ἐβόησαν πρὸς Κύριον καὶ ἐξήγαγε αὐτοὺς Κύριος¹⁵ εἰς τόπον εὐθαλῆ καὶ ἔνυδρον, καὶ ἤγαγε¹⁶ αὐτοὺς ἐκ σκότους εἰς φῶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/003.yaml
  text: And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord brought them out to a flourishing and well-watered place, and brought them from darkness into light.
translation:
  language: pt
  text: E eu vi que os três cervos se transformaram em três cordeiros. Eles clamaram ao Senhor, e o Senhor os tirou para um lugar verdejante e bem irrigado e os conduziu das trevas para a luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: cervos
  rationale: Equivalente natural e abrangente para o plural grego, sem especificar sexo.
- source_word: ἀμνοὶ
  choice: cordeiros
  rationale: Reproduz diretamente a imagem de animais jovens presente no grego.
- source_word: ἐξήγαγε
  choice: fez sair
  rationale: Preserva o valor causativo e o movimento para fora, distinguindo-o de ἤγαγε na oração seguinte.
- source_word: εὐθαλῆ καὶ ἔνυδρον
  choice: verdejante e bem irrigado
  rationale: Expressa tanto a vegetação florescente quanto a abundância de água em português corrente.
- source_word: ἤγαγε
  choice: conduziu
  rationale: Traduz o verbo de movimento sem repetir artificialmente a formulação escolhida para ἐξήγαγε.
theological_decisions:
- issue: Identificação simbólica dos cervos e cordeiros
  choice: Manter as imagens sem explicá-las
  alternative: Identificar explicitamente as figuras representadas pelos animais
  rationale: O versículo apresenta uma visão simbólica, mas não fornece aqui sua interpretação; explicitá-la importaria uma leitura externa.
- issue: Título divino Κύριος
  choice: Senhor
  alternative: o SENHOR
  rationale: O grego traz o título Κύριος, sem evidência textual neste trecho que exija uma representação tipográfica do nome divino.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A coordenação do grego foi levemente pontuada em duas frases para facilitar a leitura, sem alterar a progressão da visão.
