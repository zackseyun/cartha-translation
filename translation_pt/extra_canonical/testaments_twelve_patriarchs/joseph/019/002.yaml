  text: Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also.
translation:
  language: pt
  text: Doze cervos pastavam em um lugar; nove deles foram dispersos por toda a terra, e os três, do mesmo modo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: cervos
  rationale: Equivalente natural e preciso para o plural grego, preservando a imagem animal da visão.
- source_word: ἐνέμοντο
  choice: pastavam
  rationale: Expressa o sentido médio de alimentar-se ou estar pastando.
- source_word: ἐν τόπῳ
  choice: num só lugar
  rationale: O grego diz literalmente «em um lugar»; «num só lugar» torna clara a ideia de reunião inicial sem alterar o sentido.
- source_word: διεσπάρησαν
  choice: foram dispersos
  rationale: Mantém a forma passiva e a noção de espalhamento amplo.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: por toda a terra
  rationale: Formulação corrente que preserva a possível amplitude de γῆ, sem restringi-la a uma região específica.
- source_word: ὁμοίως δὲ καὶ
  choice: e do mesmo modo também
  rationale: Conserva a comparação enfática entre o destino dos nove e o dos três.
theological_decisions:
- issue: Identidade simbólica dos doze cervos
  choice: Não explicitar no corpo do texto
  alternative: Identificá-los interpretativamente com as doze tribos ou com pessoas específicas
  rationale: O versículo apresenta a imagem sem fornecer aqui sua interpretação; explicá-la na tradução eliminaria a abertura simbólica do texto.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe levemente ajustada para evitar ambiguidade quanto aos grupos de nove e três. Não são necessárias notas de rodapé.
