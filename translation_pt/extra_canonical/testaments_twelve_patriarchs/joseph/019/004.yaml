source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐκεῖ ἐβόησαν πρὸς Κύριον μέχρι οὐ συνήχθησαν *πρὸς αὐτοὺς¹⁷ οἱ ἐννέα ἔλαφοι καὶ ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα, καὶ μετ’ ὀλίγον χρόνον ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/004.yaml
  text: And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks.
translation:
  language: pt
  text: E ali clamaram ao Senhor, até que os nove cervos se reuniram a eles; e eles mesmos se tornaram como doze ovelhas. Pouco tempo depois, multiplicaram-se e tornaram-se muitos rebanhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησαν
  choice: clamaram
  rationale: Expressa um grito intenso dirigido ao Senhor e mantém o tom religioso natural em português.
- source_word: ἔλαφοι
  choice: cervos
  rationale: Equivalente corrente e abrangente para os animais designados pelo plural grego.
- source_word: πρόβατα
  choice: ovelhas
  rationale: No contexto da imagem de um rebanho, é a forma mais natural de representar o termo grego, que também pode designar ovinos em geral.
- source_word: ηὐξάνοντο
  choice: multiplicaram-se
  rationale: No contexto de animais que passam a formar muitos rebanhos, comunica melhor o aumento numérico do que uma tradução meramente física como 'cresceram'.
- source_word: ποίμνια πολλά
  choice: muitos rebanhos
  rationale: Reproduz diretamente a pluralidade e a expansão da imagem pastoril.
theological_decisions:
- issue: Identidade dos que se tornam doze ovelhas
  choice: eles mesmos se tornaram como doze ovelhas
  alternative: todos se tornaram como doze ovelhas
  rationale: Mantém o pronome enfático αὐτοὶ e a possível tensão quanto ao referente, sem explicar além do que o texto grego afirma.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e imagens preservadas. A formulação evita esclarecer de modo indevido o referente de 'eles mesmos'.
source_grounding:
  english_pob_role: consult_only
