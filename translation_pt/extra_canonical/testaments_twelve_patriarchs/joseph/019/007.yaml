  source_fidelity: 'O rascunho preserva os referentes e o número: μόσχον é adequadamente «bezerro», αὐτούς é mantido como «os», δωδεκάκις como «doze vezes», e o benefício é destinado aos «touros». Contudo, «rodeou» neutraliza desnecessariamente o aspecto imperfeito de περιέβαλλε; «dava doze voltas ao redor deles» expressa de modo claro a ação reiterada de circundar. A posição e o alcance de ὁλοκλήρως são textualmente incertos na edição, como indica (?).'
  naturalness: «Tornou-se, por inteiro, uma ajuda» é compreensível, mas pouco idiomático em português moderno. «Tornou-se um auxílio completo para os touros» é natural, conserva a ideia de totalidade e não acrescenta interpretação simbólica.
  terminology: «Bezerro» e «touros» preservam de forma apropriada a distinção lexical entre μόσχον e βουσὶ. «Auxílio» é um equivalente digno e natural de βοήθεια no registro visionário do texto.
