revisions:
- from: E vi um bezerro que os rodeou doze vezes e se tornou, por inteiro, uma ajuda para os touros.
  to: E vi um bezerro que dava doze voltas ao redor deles e se tornou um auxílio completo para os touros.[a]
  rationale: A revisão mantém a imagem e a ambiguidade simbólica do original. Substitui-se «rodeou» por uma formulação que reflete melhor a ação repetida expressa pelo imperfeito com «doze vezes», e ajusta-se a expressão final para português natural. Uma nota ancorada registra a incerteza editorial explicitamente presente no texto-fonte.
  reviewer_model: gpt-5.6-terra
