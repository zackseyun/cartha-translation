  text: And I saw a calf that encircled them twelve times, and it became wholly a help to the bulls.
translation:
  language: pt
  text: E vi um bezerro que dava doze voltas ao redor deles e se tornou um auxílio completo para os touros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «tornou-se inteiramente um auxílio para os touros». O termo grego traduzido por «completo» é assinalado como incerto na edição de base.'
    reason: O ponto de interrogação editorial após ὁλοκλήρως indica incerteza textual ou de leitura; a nota a preserva sem escolher uma interpretação além do texto.
lexical_decisions:
- source_word: μόσχον
  choice: bezerro
  rationale: Equivalente direto e natural para o animal jovem visto na visão, preservando a distinção em relação a βουσὶ, “touros”.
- source_word: δωδεκάκις
  choice: doze vezes
  rationale: Reproduz diretamente o valor adverbial e mantém o simbolismo numérico sem interpretação adicional.
- source_word: περιέβαλλε
  choice: rodeou
  rationale: Expressa com naturalidade a ação de circundar ou cercar, sem especificar um sentido hostil ou protetor que o grego não explicita.
- source_word: τοῖς βουσὶ
  choice: para os touros
  rationale: Mantém o referente bovino distinto do “bezerro” e reproduz a relação de benefício indicada pelo dativo.
- source_word: ὁλοκλήρως
  choice: por inteiro
  rationale: Preserva o advérbio textual, embora sua forma e posição sejam assinaladas como incertas na edição; evita ampliar o sentido para além de totalidade ou plenitude.
- source_word: εἰς βοήθειαν
  choice: uma ajuda
  rationale: Tradução idiomática da expressão que indica que o bezerro veio a servir de auxílio aos touros.
theological_decisions:
- issue: Identidade simbólica do bezerro e dos touros
  choice: Manter apenas as imagens animais do texto
  alternative: Identificar explicitamente as figuras históricas ou tribais simbolizadas
  rationale: O versículo não fornece a identificação dentro de sua própria formulação; explicitá-la no corpo da tradução resolveria interpretativamente a visão.
- issue: Natureza da ação de rodear
  choice: Usar o termo neutro “rodeou”
  alternative: Traduzir como “protegeu”, “cercou” ou “envolveu”
  rationale: O verbo permite a ideia espacial de circundar, mas o propósito preciso da ação não deve ser inferido apenas da ajuda mencionada depois.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego. “Por inteiro” foi mantido em posição destacada para refletir ὁλοκλήρως sem produzir a construção menos natural “tornou-se inteiramente uma ajuda”. Não se acrescentou nota, pois a incerteza editorial indicada por (?) não oferece, nos dados fornecidos, uma variante concreta que possa ser explicada ao leitor.
