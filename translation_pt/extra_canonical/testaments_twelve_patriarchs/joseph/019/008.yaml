  text: '*Καὶ εἶδον²⁶ *ὅτι [ἐκ τοῦ Ἰούδα ἐγεννήθη] †παρθένος, [ἔχουσα στολὴν βυσσίνην, καὶ ἐξ αὐτῆς] ἐγεννήθη ἀμνὸς [ἄμωμος]²⁷ *καὶ ἦν²⁸ ἐξ ἀριστερῶν αὐτοῦ ὡς λέων· καὶ πάντα τὰ θηρία ὥρμων³⁰ *κατ᾽ αὐτοῦ³¹ καὶ ἐνίκησεν αὐτὰ ὁ ἀμνός, καὶ ἀπώλεσεν *αὐτὰ εἰς καταπάτημα³².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/008.yaml
  text: And I saw that [from Judah was born] a virgin, [wearing a robe of fine linen, and from her] a [blameless] lamb was born; and on his left there was, as it were, a lion; and all the beasts were rushing against him, and the lamb overcame them and destroyed them for trampling.
translation:
  language: pt
  text: E vi que [de Judá nasceu] uma virgem[a], [vestida com uma túnica de linho fino, e dela] nasceu um cordeiro [sem defeito]; e à esquerda dele havia como que um leão. Todos os animais selvagens avançavam contra ele, e o cordeiro os venceu e os destruiu para serem pisoteados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes reproduzem os colchetes da edição grega indicada e assinalam palavras cuja situação textual é incerta.
    reason: Informar o leitor sobre a incerteza textual sem eliminar nem incorporar silenciosamente as expressões entre colchetes.
lexical_decisions:
- source_word: παρθένος
  choice: virgem
  rationale: Equivalente direto e corrente, preservando o sentido do grego sem explicitação interpretativa.
- source_word: στολὴν βυσσίνην
  choice: uma túnica de linho fino
  rationale: Traduz o tipo geral de veste e o tecido valioso de modo natural e inteligível em português.
- source_word: ἀμνὸς [ἄμωμος]
  choice: cordeiro [sem defeito]
  rationale: “Cordeiro” é a equivalência normal de ἀμνός; “sem defeito” preserva o sentido cultual e moralmente não resolvido de ἄμωμος.
- source_word: θηρία
  choice: animais selvagens
  rationale: Expressa o sentido de feras ou animais não domesticados sem sugerir necessariamente criaturas fantásticas.
- source_word: ὥρμων κατ᾽ αὐτοῦ
  choice: avançavam contra ele
  rationale: Comunica o movimento hostil continuado do imperfeito sem transferir a ação ao leão.
- source_word: εἰς καταπάτημα
  choice: entregando-os ao pisoteio
  rationale: Mantém a construção de resultado ou destino ligada ao pisoteio, sem transformá-la simplesmente em outro verbo coordenado.
theological_decisions:
- issue: Possível leitura messiânica do cordeiro, do leão e da virgem
  choice: Manter as imagens e os pronomes sem identificar explicitamente suas figuras
  alternative: Explicitar que o cordeiro representa o Messias e que a virgem é uma personagem específica
  rationale: O texto oferece imagens visionárias, mas não fornece aqui essas identificações de maneira explícita; a tradução não deve resolver a interpretação teológica.
- issue: Sentido de ἄμωμος
  choice: “sem defeito”
  alternative: “irrepreensível” ou “imaculado”
  rationale: “Sem defeito” preserva melhor a possível ressonância sacrificial aplicada ao cordeiro, sem excluir a dimensão moral nem importar terminologia confessional.
- issue: Referente de “dele/ele”
  choice: Preservar os pronomes do texto sem substituir por “do cordeiro”
  alternative: Explicitar o cordeiro como referente
  rationale: Embora o cordeiro seja o referente mais próximo, a formulação grega é pronominal; manter essa forma preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação repetida do grego foi mantida de modo natural. “Como que um leão” conserva o caráter aproximativo da visão, e “à esquerda dele” preserva a formulação e a possível ambiguidade do original.
