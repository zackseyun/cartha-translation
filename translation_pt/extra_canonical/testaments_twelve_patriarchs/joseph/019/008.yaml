review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente as cláusulas entre colchetes, o valor aproximativo de ὡς e o imperfeito hostil de ὥρμων. Contudo, «entregando-os ao pisoteio» acrescenta uma relação de entrega que o grego não expressa. A construção ἀπώλεσεν αὐτὰ εἰς καταπάτημα diz que o cordeiro os destruiu para/como objeto de pisoteio, e a forma portuguesa deve conservar esse resultado sem introduzir um agente implícito de entrega.
  naturalness: O português é claro, moderno e adequado ao registro visionário. «Para serem pisoteados» é mais idiomático e mais próximo da construção final/resultativa grega do que «entregando-os ao pisoteio».
  terminology: «Virgem», «túnica de linho fino», «cordeiro», «sem defeito» e «animais selvagens» são escolhas apropriadas. A nota explica corretamente a função editorial dos colchetes e o respectivo marcador está bem ancorado.
  issues:
  - severity: medium
    issue: «entregando-os ao pisoteio» para εἰς καταπάτημα
    rationale: «Entregando» introduz uma noção de transferência ou entrega não presente em ἀπώλεσεν ... εἰς καταπάτημα. «Para serem pisoteados» representa de modo mais direto o destino/resultado indicado por εἰς.
