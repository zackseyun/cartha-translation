  text: Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you [the lamb of God, who takes away the sin of the world,] saving [all the nations and] Israel.
translation:
  language: pt
  text: Portanto, vocês, meus filhos, guardem os mandamentos do Senhor e honrem Levi e Judá, pois da descendência deles surgirá para vocês [o Cordeiro de Deus, que tira o pecado do mundo][a], salvando [todas as nações e][b] Israel.
