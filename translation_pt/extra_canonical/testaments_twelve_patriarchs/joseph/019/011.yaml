lexical_decisions:
- source_word: φυλάξατε
  choice: guardem
  rationale: Expressa a ideia de observar e cumprir fielmente os mandamentos, em linguagem natural e digna.
- source_word: τιμᾶτε
  choice: honrem
  rationale: Preserva diretamente o sentido de prestar honra ou consideração.
- source_word: σπέρματος
  choice: descendência
  rationale: O singular grego pode ter sentido coletivo; “descendência” mantém essa amplitude sem sugerir apenas um descendente individual.
- source_word: ἀνατελεῖ
  choice: surgirá
  rationale: Reproduz a imagem de algo ou alguém que se levanta ou desponta, sem impor uma interpretação adicional.
- source_word: αἴρων
  choice: tira
  rationale: Tradução corrente que preserva o sentido de remover ou levar embora o pecado.
- source_word: σώζων
  choice: salvando
  rationale: Mantém a forma participial e sua ligação aberta com a figura que surge.
theological_decisions:
- issue: Identidade da figura proveniente da descendência de Levi e Judá
  choice: Manter a designação textual “o Cordeiro de Deus” sem explicação identificadora no corpo do texto
  alternative: Identificar explicitamente a figura como Jesus ou o Messias
  rationale: O texto deve conservar sua própria formulação e não acrescentar uma identificação interpretativa ausente do grego fornecido.
- issue: Extensão da salvação a Israel e às nações
  choice: Preservar “todas as nações e” entre colchetes
  alternative: Integrar a expressão sem indicação textual ou omiti-la
  rationale: Os colchetes da edição sinalizam incerteza ou caráter secundário da expressão; mantê-los conserva a tensão da evidência textual.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de uso corrente no Brasil e compreensão ampla no espaço lusófono. A construção participial final foi preservada para não resolver além do texto a relação sintática e teológica.
