id: T12P.JOS.19.12
reference: Testament of Joseph 19:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/012.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman's hut after the summer, vanishing away.
translation:
  language: pt
  text: Pois o reino dele será um reino eterno, que não passará. Mas o meu reino entre vocês chegará ao fim, como uma cabana de vigia que desaparece depois do verão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: reino
  rationale: Mantém o sentido de domínio ou reinado e corresponde naturalmente à repetição enfática do grego.
- source_word: αἰώνιος
  choice: eterno
  rationale: Expressa a duração sem fim atribuída ao reino, em paralelo com «não passará».
- source_word: ἐν ὑμῖν
  choice: entre vocês
  rationale: No contexto do reino de José presente no meio de seus descendentes, «entre vocês» é mais natural, sem excluir por completo a força locativa da expressão.
- source_word: ἐπιτελεῖται
  choice: será levado ao seu fim
  rationale: Preserva tanto a ideia de levar algo à consumação quanto, neste contraste, a de seu término, evitando reduzir o verbo simplesmente a «desaparecer».
- source_word: ὀπωροφυλάκιον
  choice: cabana de um vigia
  rationale: Designa um abrigo temporário usado por quem guardava uma plantação ou seus frutos; a formulação é clara e mantém a imagem agrícola.
- source_word: μετὰ τὸ θέρος ἐξαφανίζεται
  choice: depois do verão, desaparece
  rationale: Reproduz diretamente a comparação temporal e a extinção do abrigo sazonal.
theological_decisions:
- issue: Contraste entre «o reino dele» e «o meu reino»
  choice: Preservar os pronomes sem identificar explicitamente seus referentes
  alternative: Explicitar «o reino do Messias» e «o reino de José»
  rationale: O versículo pressupõe os referentes no contexto, mas não os nomeia; explicitá-los no corpo do texto resolveria uma referência que o grego deixa pronominal.
- issue: Valor de ἐπιτελεῖται
  choice: «será levado ao seu fim»
  alternative: «será levado à perfeição» ou «chegará ao fim»
  rationale: A escolha conserva a tensão entre consumação e término, ao passo que a imagem subsequente destaca o desaparecimento do reino de José.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural de segunda pessoa. A sintaxe mantém o paralelismo e o contraste do original sem soar excessivamente literal.
