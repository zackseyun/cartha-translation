  text: But these things will happen in their time, in the last days.
translation:
  language: pt
  text: Mas estas coisas acontecerão em seu tempo, nos últimos dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα δὲ
  choice: Mas estas coisas
  rationale: “Estas coisas” representa diretamente Ταῦτα; “mas” expressa o valor adversativo ou transicional de δὲ no contexto.
- source_word: γενήσεται
  choice: acontecerão
  rationale: O verbo está no futuro e, com sujeito neutro plural, descreve eventos que ocorrerão; o plural é natural em português.
- source_word: ἐν καιρῷ αὐτῶν
  choice: no tempo delas
  rationale: Mantém a referência plural de αὐτῶν às coisas mencionadas e preserva a ideia de um tempo próprio ou determinado, sem acrescentar a noção de necessidade.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: nos últimos dias
  rationale: Tradução direta e tradicional da expressão temporal, preservando sua dimensão escatológica sem explicá-la além do grego.
theological_decisions:
- issue: Sentido escatológico de ἐν ἐσχάταις ἡμέραις
  choice: nos últimos dias
  alternative: nos dias finais
  rationale: “Nos últimos dias” conserva a formulação bíblica reconhecível e a possível tensão escatológica do texto, sem definir a duração ou a referência histórica desses dias.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A formulação permanece próxima do grego e não introduz a ideia de obrigação (“devem acontecer”), ausente no texto-fonte fornecido.
