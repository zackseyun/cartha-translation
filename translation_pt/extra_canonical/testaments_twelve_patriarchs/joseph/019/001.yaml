base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/001.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things. Now listen, my children, also concerning the dreams that I know about.
translation:
  language: pt
  text: De fato, ele me deu uma beleza maior que a dos homens formosos de Israel e me preservou até a velhice, com força e beleza, pois em tudo eu era semelhante a Jacó. Ouçam agora, meus filhos, também a respeito dos sonhos de que tenho conhecimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα ... ὑπὲρ ὡραίους Ἰσραήλ
  choice: uma beleza maior que a dos homens formosos de Israel
  rationale: Mantém a comparação explícita do grego e entende o adjetivo plural substantivado ὡραίους como referência aos homens formosos de Israel, em português natural.
- source_word: ἕως γήρους ἐν δυνάμει καὶ ἐν κάλλει
  choice: até a velhice, com força e beleza
  rationale: Reproduz os dois aspectos preservados até a velhice sem tornar a frase artificial em português.
- source_word: ὅμοιος ... ἐν πᾶσι τῷ Ἰακώβ
  choice: em tudo eu era semelhante a Jacó
  rationale: Segue de perto a abrangência de ἐν πᾶσι e conserva a comparação direta com Jacó.
- source_word: περὶ ὧν οἶδα ἐνυπνίων
  choice: a respeito dos sonhos de que tenho conhecimento
  rationale: Preserva o plural ἐνυπνίων e o sentido de conhecimento expresso por οἶδα, sem substituí-lo por uma afirmação de que José viu um único sonho.
theological_decisions:
- issue: Natureza do conhecimento dos sonhos
  choice: sonhos de que tenho conhecimento
  alternative: sonhos que vi
  rationale: O texto grego usa οἶδα, “sei/conheço”, e não um verbo de ver; a tradução evita resolver a expressão como uma visão específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para fluência, preservando as comparações, o plural “sonhos” e a tensão da expressão final.
