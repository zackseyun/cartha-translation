base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/006.yaml
  text: And from the fourth bull its horns went up as far as heaven and became like a wall of the flocks, and in the midst of the two horns another horn sprouted.
translation:
  language: pt
  text: E os chifres do quarto touro subiram até o céu e se tornaram como uma muralha dos rebanhos; e, no meio dos dois chifres, brotou outro chifre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βοὸς
  choice: touro
  rationale: Mantém a imagem bovina masculina do grego e a continuidade com o contexto visionário.
- source_word: ἀνέβησαν ... μέχρι τοῦ οὐρανοῦ
  choice: subiram até o céu
  rationale: Reproduz de modo natural e próximo a extensão vertical expressa no original.
- source_word: τεῖχος τῶν ποιμνῶν
  choice: uma muralha dos rebanhos
  rationale: Preserva a relação genitiva deliberadamente ambígua do grego, sem especificar se a muralha pertence aos rebanhos ou os protege.
- source_word: ἐν μέσῳ τῶν δύο κεράτων
  choice: no meio dos dois chifres
  rationale: Segue diretamente a expressão espacial grega, em vez de reduzi-la simplesmente a 'entre'.
- source_word: ἐξεβλάστησε
  choice: brotou
  rationale: Conserva a metáfora botânica do verbo grego e soa natural em português.
theological_decisions:
- issue: Identificação simbólica dos touros, chifres e rebanhos
  choice: Manter as imagens sem interpretação explícita
  alternative: Identificar no texto as figuras históricas ou messiânicas simbolizadas
  rationale: O versículo apresenta uma visão simbólica, mas não fornece aqui a identificação de seus referentes; explicitá-los resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pontuação que torna clara a sequência da visão. A formulação conserva as repetições imagéticas do grego e evita acrescentar explicações interpretativas.
