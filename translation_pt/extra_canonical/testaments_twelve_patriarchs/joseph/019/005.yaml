  text: Καὶ¹⁸ μετὰ ταῦτα ἑώρων *καὶ ἰδοὺ¹⁵ δώδεκα βόες θηλάζοντες¹⁹ μίαν δάμαλιν, ἢ ἐκ²⁰ . . . γάλακτος θάλασσαν ἐποίει καὶ ἔπινον ἐξ αὐτοῦ²¹ αἱ δώδεκα ποίμναι καὶ ἀνηρίθμητα ποίμνια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/005.yaml
  text: And after these things I saw, and behold, twelve bulls suckling one heifer, and it made a sea of milk, and the twelve flocks and innumerable flocks drank from it.
translation:
  language: pt
  text: Depois dessas coisas, vi, e eis que doze touros mamavam de uma só novilha, e formava-se um mar de leite; dele bebiam os doze rebanhos e rebanhos incontáveis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego apresenta uma lacuna antes de “um mar de leite”; por isso, a construção exata da frase e o sujeito de “formava-se” são incertos.
    reason: A lacuna indicada pela edição segue ἐκ (“de, desde”) e impede determinar com segurança a sintaxe e o agente da produção do mar de leite.
lexical_decisions:
- source_word: ἑώρων
  choice: tive uma visão
  rationale: O imperfeito de ὁράω, no contexto de uma sequência visionária, é expresso de modo natural em português sem perder o sentido de percepção visual.
- source_word: δώδεκα βόες
  choice: doze touros
  rationale: βόες pode designar bovinos em geral, mas o particípio masculino plural θηλάζοντες favorece aqui animais machos; “touros” também acompanha a leitura inglesa auditada.
- source_word: μίαν δάμαλιν
  choice: uma só novilha
  rationale: δάμαλις designa uma fêmea bovina jovem; “uma só” preserva a ênfase numérica de μίαν diante dos doze touros.
- source_word: θηλάζοντες
  choice: mamavam de
  rationale: Mantém a imagem incomum e concreta do grego, sem tentar interpretá-la alegoricamente.
- source_word: γάλακτος θάλασσαν ἐποίει
  choice: ela produzia um mar de leite
  rationale: Reproduz a construção causativa de ποιέω em português idiomático. O sujeito está textualmente incerto devido à lacuna, mas a novilha é o referente contextual mais plausível.
- source_word: αἱ δώδεκα ποίμναι καὶ ἀνηρίθμητα ποίμνια
  choice: os doze rebanhos e outros rebanhos incontáveis
  rationale: Preserva a repetição de termos cognatos no grego; “outros” torna clara a adição do segundo grupo sem atribuir-lhe identidade específica.
theological_decisions:
- issue: Identidade simbólica dos touros, da novilha e dos rebanhos
  choice: Manter as imagens sem explicação interpretativa
  alternative: Identificar explicitamente as figuras com personagens ou comunidades religiosas
  rationale: O versículo apresenta uma visão simbólica, mas não fornece aqui sua interpretação; traduzi-la no corpo do texto importaria uma conclusão teológica não expressa.
- issue: Sujeito da produção do mar de leite
  choice: “ela”, referindo-se contextualmente à novilha, com nota sobre a incerteza textual
  alternative: 'Construção impessoal: “formava-se um mar de leite”'
  rationale: A leitura contextual é natural e próxima da evidência preservada, mas a lacuna do texto grego exige que a incerteza seja reconhecida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o caráter visionário e as imagens deliberadamente extraordinárias do original, evitando explicações confessionais.
