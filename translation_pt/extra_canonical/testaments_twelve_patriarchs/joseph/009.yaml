base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009.yaml
  text: '1[a]. But when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and with a cheerful voice, rejoicing, I glorified my God because by a pretext I had been delivered from the Egyptian woman. Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.”


    2[b]. But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.


    3. But if one lives in self-control, and the Most High knows that glory also is fitting for him, he grants that too to him, as also to me.


    4. How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.


    5. For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned for my deception[c]. But the Lord guarded me from her schemes.'
translation:
  language: pt
  text: '1[a]. Mas, quando ela vinha, ficava escutando às escondidas como eu dava graças ao Senhor e cantava hinos na casa das trevas, e como, alegre e com voz jubilosa, glorificava o meu Deus, porque, por meio de um pretexto, eu havia sido livrado da egípcia. Muitas vezes ela mandou dizer-me: “Concorde em satisfazer o meu desejo, e eu o soltarei das correntes e o libertarei das trevas.”


    2[b]. Eu, porém, nem sequer em pensamento me inclinei para ela; pois Deus ama mais aquele que permanece fiel no domínio próprio em um poço de trevas do que aquele que, como rei em câmaras, vive no luxo e na devassidão.


    3. Mas, se alguém vive com domínio próprio e o Altíssimo sabe que a glória também lhe convém, ele também a concede a essa pessoa, assim como a concedeu a mim.


    4. Quantas vezes, embora estivesse doente, ela desceu até mim em hora imprópria e ouviu a minha voz enquanto eu orava! E eu, percebendo os gemidos dela, permanecia calado.


    5. Pois, quando eu estava na casa dela, ela descobria os braços e as pernas, para que eu caísse sobre ela. Ela era muito bonita e se enfeitava especialmente para me enganar[c]. Mas o Senhor me guardou das suas artimanhas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “casa das trevas” provavelmente se refere ao lugar onde José estava preso; o grego preserva a imagem das trevas em vez de mencionar diretamente uma prisão.
    reason: cultural_note
  - marker: b
    text: O contraste no grego é difícil; literalmente, aproxima-se de “o fiel em domínio próprio num poço de trevas” em oposição ao “rei em câmaras que vive no luxo com devassidão”.
    reason: textual_variant
  - marker: c
    text: “Pernas” traduz um termo que designa mais especificamente a parte inferior das pernas ou as canelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηκροᾶτό
  choice: ficava escutando às escondidas
  rationale: Preserva tanto o aspecto repetido do imperfeito quanto a ideia de escuta lateral ou secreta, sem usar um termo excessivamente coloquial.
- source_word: ἐν οἴκῳ τοῦ σκότους / ἐκ τοῦ σκότους
  choice: na casa das trevas / das trevas
  rationale: Mantém a imagem do grego, que sugere o lugar de confinamento sem empregar diretamente a palavra 'prisão'.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: com voz jubilosa
  rationale: Comunica alegria audível em contraste com o confinamento, em registro digno e corrente.
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: por meio de um pretexto, eu havia sido livrado
  rationale: Conserva o sentido de πρόφασις como pretexto e a forma passiva de libertação, sem explicitar além do texto quem produziu a ocasião.
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: Concorde em satisfazer o meu desejo
  rationale: Expressa o pedido de consentimento e torna natural em português a linguagem de sedução.
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα
  choice: nem sequer em pensamento me inclinei para ela
  rationale: Preserva a ênfase na recusa interior, além da resistência exterior.
- source_word: πιστὸν ἐν σωφροσύνῃ
  choice: permanece fiel no domínio próprio
  rationale: σωφροσύνη abrange autodisciplina e, neste contexto, inclui claramente a pureza sexual; 'domínio próprio' mantém essa amplitude.
- source_word: ἐν λάκκῳ σκότους
  choice: em um poço de trevas
  rationale: Mantém a imagem concreta de λάκκος e sua ligação retórica com as trevas.
- source_word: ἐν ταμείοις βασιλέα τρυφῶντα μετ’ ἀκολασίας
  choice: como rei em câmaras, vive no luxo e na devassidão
  rationale: O texto é difícil; 'câmaras' representa naturalmente ταμεῖα sem restringi-lo a depósitos, e 'devassidão' comunica a falta de contenção moral de ἀκολασία neste contexto sexual.
- source_word: διάγων ἐν σωφροσύνῃ
  choice: vive com domínio próprio
  rationale: Mantém coerência lexical com o versículo anterior e linguagem portuguesa natural.
- source_word: συμφέρει
  choice: lhe convém
  rationale: Expressa adequação ou benefício segundo o juízo providencial do Altíssimo, sem reduzir o termo a vantagem material.
- source_word: ἐν ἀωρίᾳ
  choice: em hora imprópria
  rationale: Indica um horário inconveniente ou indevido e preserva o caráter clandestino da visita.
- source_word: τοὺς στεναγμούς
  choice: os gemidos
  rationale: Preserva a força e a ambiguidade de στεναγμοί entre sofrimento e desejo, em vez de suavizá-lo para simples suspiros.
- source_word: τὰς κνήμας
  choice: as pernas
  rationale: Usa a forma comum no texto principal; a nota registra que o grego designa mais precisamente a parte inferior das pernas ou as canelas.
- source_word: ἵνα συμπέσω εἰς αὐτήν
  choice: para que eu caísse sobre ela
  rationale: Mantém a imagem física e sexualmente sugestiva do grego sem explicar ou suavizar a expressão difícil.
- source_word: τῶν ἐγχειρημάτων αὐτῆς
  choice: das suas artimanhas
  rationale: Comunica tentativas ou maquinações deliberadas de modo claro e natural.
theological_decisions:
- issue: Agência divina no livramento e na preservação de José
  choice: Manter explícitas as afirmações de que Deus ama e o Senhor guarda, além da concessão de glória pelo Altíssimo.
  alternative: Apresentar a resistência apenas como autodisciplina humana ou usar linguagem providencial genérica.
  rationale: O grego atribui diretamente a Deus o favor, a concessão e a proteção, sem opor essa ação ao domínio próprio de José.
- issue: Amplitude de σωφροσύνη no contexto da sedução
  choice: Traduzir por 'domínio próprio', deixando que o contexto evidencie sua dimensão de pureza sexual.
  alternative: Traduzir por 'castidade' ou 'temperança'.
  rationale: '''Domínio próprio'' preserva a amplitude da virtude grega, enquanto ''castidade'' a restringiria e ''temperança'' pode soar arcaica ou associada apenas à moderação.'
- issue: Sentido da concessão de glória no versículo 3
  choice: Conservar a condição de que o Altíssimo sabe se a glória convém à pessoa.
  alternative: Transformar a frase em promessa universal de prosperidade para quem exerce domínio próprio.
  rationale: O texto não promete glória automaticamente; subordina sua concessão ao conhecimento e juízo do Altíssimo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se as imagens incomuns de “casa das trevas”, “poço de trevas” e “cair sobre ela”, apoiadas por notas quando necessário. Empregou-se “você” apenas de forma implícita nos imperativos e pronomes de objeto, evitando regionalismos marcados.
