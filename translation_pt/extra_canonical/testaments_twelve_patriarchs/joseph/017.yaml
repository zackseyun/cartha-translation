  - severity: low
    issue: “Vivi entre eles” em 17.8
    rationale: O imperfeito ἤμην significa diretamente “eu estava/era entre eles”. “Vivi” acrescenta uma nuance durativa não necessária. “Estava entre eles” é mais fiel.
  - severity: low
    issue: “Glória neste mundo” em 17.8
    rationale: κοσμικήν qualifica diretamente a glória como mundana. “Minha glória mundana” mantém essa relação lexical sem alterar o sentido.
