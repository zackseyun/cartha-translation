base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017.yaml
  text: 1[a]. See then, my children, how much I endured so that I might not put my brothers to shame. 2. You also, therefore, love one another, and with patience conceal one another’s shortcomings. 3. For God delights in the harmony of brothers and in the purpose of a good heart that intends what is good. 4[b]. And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them. 5. And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure. 6. And I did not allow them to be distressed even in the smallest matter; rather, everything that was in my hand I gave to them. 7. And their sons were my sons, and my sons were as slaves to them, and their soul was my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose. 8. And I did not exalt myself among them in arrogance because of my worldly glory[c],
    but I was among them as one of the least.
translation:
  language: pt
  text: 1. Vejam, portanto, meus filhos, quanto suportei para não envergonhar meus irmãos. 2. Portanto, vocês também amem uns aos outros e, com paciência, cubram as falhas uns dos outros.[a] 3. Pois Deus se alegra com a harmonia entre irmãos e com a intenção de um coração bom, voltado para o bem.[b] 4. Quando meus irmãos vieram ao Egito, eles mesmos sabem que lhes devolvi o dinheiro; não os repreendi, mas os encorajei. 5. E, depois da morte de Jacó, meu pai, eu os amei ainda mais e fazia por eles, muito além da medida, tudo o que desejavam. 6. Não permiti que fossem afligidos nem sequer na menor questão; pelo contrário, dei-lhes tudo o que estava em minhas mãos. 7. Os filhos deles eram meus filhos, e meus filhos eram como escravos deles; a alma deles era a minha alma, toda dor deles era a minha dor, toda fraqueza deles era a minha enfermidade, e o propósito deles era o meu propósito.[c] 8. Não me exaltei com arrogância entre eles por causa da minha glória mundana; antes, estava entre eles
    como um dos menores.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “encubram as falhas uns dos outros”. O verbo grego sugere não expor duramente as falhas de um irmão.'
    reason: lexical_alternative
  - marker: b
    text: A expressão grega sobre a intenção de um coração bom é textualmente difícil. A tradução segue o provável sentido ético de um coração disposto para o bem.
    reason: textual_variant
  - marker: c
    text: “Escravos” traduz o grego douloi. A formulação é intencionalmente forte e expressa a humildade de José e a subordinação de sua própria casa aos irmãos.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχύνω
  choice: envergonhar
  rationale: Expressa causar vergonha ou humilhação, preservando o destaque dado à contenção de José em relação aos irmãos.
- source_word: μακροθυμία
  choice: paciência
  rationale: Em exortação relacional, indica tolerância perseverante e domínio próprio; é corrente e clara em português moderno.
- source_word: συγκρύπτετε
  choice: encubram
  rationale: Preserva a imagem de cobrir ou não expor duramente as falhas alheias, sem sugerir que elas sejam negadas.
- source_word: ἐλαττώματα
  choice: falhas
  rationale: Termo natural para insuficiências ou faltas no contexto de uma exortação moral, sem tom clínico.
- source_word: ὁμονοία
  choice: harmonia
  rationale: Comunica concórdia e unidade de disposição, mantendo a imagem relacional entre irmãos.
- source_word: προαίρεσις καρδίας
  choice: intenção de um coração bom
  rationale: Mantém a ênfase na disposição moral interior e deliberada.
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: voltado para o bem
  rationale: A cláusula transmitida é difícil; esta formulação preserva com cautela a orientação ética para o bem sem impor uma reconstrução precisa.
- source_word: ὠνείδισα
  choice: repreendi
  rationale: No contexto, comunica que José não censurou nem lançou em rosto a culpa dos irmãos, em registro digno e natural.
- source_word: παρεκάλεσα
  choice: encorajei
  rationale: O verbo admite consolar, exortar ou animar; aqui, o tratamento reconciliador favorece 'encorajei'.
- source_word: ὑπερεκπερισσοῦ
  choice: muito além da medida
  rationale: Conserva a força intensiva do advérbio e enfatiza a generosidade extraordinária de José.
- source_word: θλιβῆναι
  choice: fossem afligidos
  rationale: Mantém o sentido amplo de sofrer pressão, angústia ou dificuldade.
- source_word: ἕως μικροῦ πράγματος
  choice: nem sequer na menor questão
  rationale: Torna claro o cuidado abrangente de José, inclusive em assuntos mínimos.
- source_word: δοῦλοι
  choice: escravos
  rationale: Preserva a força deliberadamente intensa da subordinação mencionada no texto, em vez de suavizá-la para 'servos'.
- source_word: κοσμικήν μου δόξαν
  choice: minha glória neste mundo
  rationale: Expressa de forma natural a glória ou posição pertencente à esfera mundana, evitando a possível conotação moderna de 'glória mundana' como vaidade.
theological_decisions:
- issue: Exortação a encobrir as falhas dos irmãos
  choice: encubram as falhas uns dos outros
  alternative: cubram as faltas uns dos outros; ocultem os defeitos uns dos outros
  rationale: A formulação preserva a ética de paciência e não exposição misericordiosa, sem afirmar que o pecado deva ser negado ou protegido de toda responsabilização.
- issue: Sentido de δοῦλοι no versículo 7
  choice: escravos
  alternative: servos; subordinados
  rationale: A expressão forte retrata a humildade de José e a subordinação de sua própria casa aos irmãos; suavizá-la apagaria a tensão retórica.
- issue: Cláusula textualmente difícil no versículo 3
  choice: com a intenção de um coração bom, voltado para o bem
  alternative: com a decisão de um coração bom que se agrada do bem
  rationale: A redação grega é instável ou áspera. A tradução conserva o sentido ético provável — uma disposição interior orientada ao bem — e sinaliza a dificuldade em nota, sem reconstrução dogmática.
- issue: Relação entre a alma, as dores e o propósito de José e os de seus irmãos
  choice: manter as identificações fortes e paralelas
  alternative: parafrasear como empatia e solidariedade
  rationale: A linguagem deliberadamente enfática expressa solidariedade familiar profunda; uma paráfrase psicológica reduziria sua força e sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se 'vocês' na exortação e sintaxe direta, preservando paralelismos e repetições retóricas. As ambiguidades do versículo 3 foram mantidas com formulação cautelosa e nota textual.
