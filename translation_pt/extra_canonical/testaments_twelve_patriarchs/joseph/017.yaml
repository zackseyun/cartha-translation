  naturalness: O registro é moderno, digno e muito legível. “Cubram as falhas uns dos outros” é mais idiomático para leitores brasileiros e internacionais do que “encubram”. A alteração de “vivi entre eles” para “estava entre eles” também preserva a simplicidade paralela do original.
  terminology: “Envergonhar”, “paciência”, “harmonia”, “escravos” e “enfermidade” são escolhas adequadas. “Escravos” mantém corretamente a força de δοῦλοι. A nota sobre a cláusula difícil de 17.3 é apropriada e não resolve além do que o texto permite.
