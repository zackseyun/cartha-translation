base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/002.yaml
  text: But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me a sword with the dish; and I understood that it was a scheme to lead me astray.
translation:
  language: pt
  text: Mas, quando veio o eunuco que o trazia, levantei os olhos e vi um homem terrível entregando-me uma espada junto com o prato; e entendi que aquilo era uma artimanha para me desviar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβλεψα
  choice: levantei os olhos
  rationale: Expressa naturalmente o ato de olhar para cima ou erguer o olhar, conforme o contexto.
- source_word: φοβερὸν ἄνδρα
  choice: um homem assustador
  rationale: Preserva a descrição de alguém que causa temor, sem especificar além do grego se era terrível em aparência ou caráter.
- source_word: μετὰ τοῦ τρυβλίου
  choice: junto com o prato
  rationale: Mantém a associação instrumental ou concomitante entre a entrega da espada e a do recipiente, sem impor uma disposição física específica.
- source_word: περιέργεια
  choice: artimanha
  rationale: Neste contexto, o substantivo indica uma ação ardilosa ou maquinação, não mera curiosidade ou intromissão.
- source_word: εἰς ἀποπλάνησίν μου
  choice: para me desviar
  rationale: Reproduz a finalidade de desencaminhar José, preservando a amplitude moral do verbo.
theological_decisions:
- issue: Natureza do homem visto por José
  choice: um homem assustador
  alternative: um homem terrível
  rationale: O texto não identifica explicitamente a figura como anjo, demônio ou visão; a tradução conserva essa ambiguidade.
- issue: Natureza da περιέργεια
  choice: artimanha
  alternative: feitiçaria
  rationale: Embora o termo possa assumir associações mágicas em certos contextos, aqui não há base suficiente para tornar explícita uma prática de feitiçaria.
translation_notes:
  register: Português moderno, digno e claro, com leitura natural no Brasil e compreensão internacional. A construção conserva a sequência narrativa e evita explicitar elementos que o grego deixa implícitos.
