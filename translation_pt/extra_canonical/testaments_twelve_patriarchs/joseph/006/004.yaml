base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/004.yaml
  text: Then after one day she came to me, and when she noticed the food, she said to me, “Why is it that you did not eat the food?”
translation:
  language: pt
  text: 'Então, passado um dia, ela veio até mim e, ao notar a comida, perguntou-me: “Por que você não comeu a comida?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ μίαν ἡμέραν
  choice: Então, passado um dia
  rationale: Expressa com naturalidade a progressão narrativa e o intervalo de um dia, sem tornar a sequência temporal excessivamente literal.
- source_word: ἐλθοῦσα πρός με
  choice: ela veio até mim
  rationale: Reproduz de modo direto o movimento em direção ao narrador.
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: ao notar a comida
  rationale: Neste contexto, ἐπιγινώσκω indica perceber ou constatar que a comida permanecia ali, não necessariamente reconhecê-la por identificação.
- source_word: λέγει μοι
  choice: perguntou-me
  rationale: Embora o grego diga literalmente “diz-me”, a fala introduzida é uma pergunta; “perguntou-me” é idiomático em português e preserva a função discursiva.
- source_word: Τί τοῦτο ὅτι οὐκ ἔφαγες τοῦ βρώματος;
  choice: Por que você não comeu a comida?
  rationale: Verte a construção idiomática grega como uma pergunta causal natural em português. O segundo βρῶμα foi mantido como “a comida” para preservar a repetição do original.
