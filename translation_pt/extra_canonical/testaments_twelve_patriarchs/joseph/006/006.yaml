  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
translation:
  language: pt
  text: “Saiba agora, portanto, que o Deus de meu pai, por meio do seu anjo, me revelou a sua maldade; e, com isso, guardei isso como prova contra você, na esperança de que talvez, ao ver isso, você se arrependesse.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνῶθι
  choice: Saiba
  rationale: Imperativo direto e natural, que preserva a força de uma revelação agora declarada à interlocutora.
- source_word: κακίαν
  choice: maldade
  rationale: Expressa a conduta moralmente perversa da interlocutora sem restringir o termo a um delito específico.
- source_word: ἐφύλαξα
  choice: guardei
  rationale: Mantém o sentido básico de conservar ou preservar algo, sem especificar além do que o grego afirma.
- source_word: ἔλεγχον
  choice: desmascará-la
  rationale: No contexto, indica levar a culpa à luz e expor a interlocutora; a nota registra outras nuances legítimas.
- source_word: μετανοήσεις
  choice: você se arrependesse
  rationale: Verte o verbo de mudança moral e arrependimento em linguagem portuguesa corrente.
theological_decisions:
- issue: Mediação da revelação divina
  choice: “o Deus de meu pai, por meio do seu anjo, me revelou”
  alternative: “o Deus de meu pai me revelou, por meio de um anjo”
  rationale: Preserva tanto a iniciativa de Deus quanto a mediação do anjo e mantém o possessivo αὐτοῦ, sem desenvolver uma doutrina sobre a identidade do anjo.
- issue: Finalidade da preservação
  choice: “na esperança de que talvez [...] você se arrependesse”
  alternative: “para que [...] você se arrependesse”
  rationale: Conserva a incerteza enfática de εἴπως ἄρα, evitando apresentar o arrependimento como resultado certo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” adequado à interlocutora feminina. A formulação mantém a sequência argumentativa do grego, mas evita uma reprodução mecânica. “Isso” conserva a referência neutra de αὐτό, embora seu antecedente exato permaneça pouco explícito no recorte.
