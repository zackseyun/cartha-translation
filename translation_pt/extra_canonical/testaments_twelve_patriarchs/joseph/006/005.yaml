  text: And I said to her, “You have filled it with the sorcery of death. And how could you say, ‘I do not draw near to idols, but to the Lord alone’?”
translation:
  language: pt
  text: 'E eu lhe disse: “Você o encheu com a feitiçaria da morte. Como pôde dizer: ‘Não me aproximo dos ídolos, mas somente do Senhor’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γοητείας θανάτου
  choice: a feitiçaria da morte
  rationale: Mantém a construção genitiva e a força sombria da expressão grega, sem reduzi-la a um adjetivo mais interpretativo como “feitiçaria mortal”.
- source_word: προσεγγίζω
  choice: me aproximo
  rationale: Traduz de modo claro e natural a ideia de aproximar-se ou achegar-se, preservando a mesma regência em relação aos ídolos e ao Senhor.
- source_word: μόνῳ
  choice: somente
  rationale: 'Preserva a exclusividade expressa no grego: a aproximação alegada é dirigida apenas ao Senhor.'
theological_decisions:
- issue: Exclusividade da devoção ao Senhor em contraste com os ídolos
  choice: “Não me aproximo dos ídolos, mas somente do Senhor”
  alternative: “Não adoro os ídolos, mas somente o Senhor”
  rationale: A tradução conserva o verbo concreto “aproximar-se” e não o interpreta especificamente como “adorar”, preservando a amplitude e a possível tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “o” preserva o referente implícito do grego sem tentar identificá-lo. “Como pôde dizer” comunica naturalmente o tom de contestação presente no contexto.
