lexical_decisions:
- source_word: ἀποστέλλει
  choice: enviou
  rationale: O presente histórico grego é vertido pelo pretérito para manter naturalidade narrativa em português, sem alterar a sequência dos acontecimentos.
- source_word: βρῶμα
  choice: comida
  rationale: Termo comum e abrangente, adequado ao sentido de alimento destinado a ser consumido.
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: misturada com feitiçaria
  rationale: Preserva a imagem de alimento impregnado ou misturado com uma prática mágica; “feitiçaria” comunica de modo claro o sentido de γοητεία sem especificar um mecanismo não expresso no texto.
theological_decisions:
- issue: Natureza da feitiçaria associada à comida
  choice: Manter a formulação geral “misturada com feitiçaria”
  alternative: “misturada com uma poção mágica” ou “enfeitiçada”
  rationale: O grego associa a comida à γοητεία, mas não identifica uma substância, poção ou rito específico; a tradução evita resolver essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ordem narrativa natural. O pronome “ela” conserva a referência feminina do contexto imediato, e a vírgula após a expressão temporal favorece a leitura.
