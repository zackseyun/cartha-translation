  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/003.yaml
  text: And after he had gone out, I ate neither that food nor any of her other foods, but wept, not having tasted them.
translation:
  language: pt
  text: E, depois que ele saiu, chorei, sem ter provado nem daquele alimento nem de qualquer outro dos alimentos dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: depois que ele saiu
  rationale: Reproduz com naturalidade a circunstância temporal do genitivo absoluto, sem tornar explícita uma relação causal não marcada no grego.
- source_word: ἔκλαιον
  choice: chorei
  rationale: Verte diretamente o imperfeito no contexto narrativo como ação ocorrida naquele momento; em português, o pretérito perfeito é a forma mais natural aqui.
- source_word: ἐκείνου
  choice: daquele alimento
  rationale: O pronome substantivado retoma um item alimentar específico; acrescentar “alimento” torna a referência clara em português sem identificar além do que o texto permite.
- source_word: ἄλλου τῶν ἐδεσμάτων αὐτῆς
  choice: de nenhum dos outros pratos dela
  rationale: A construção, sob o alcance de μήτε, comunica que José não provou qualquer outro dos alimentos preparados ou oferecidos por ela; “pratos” é corrente e preserva a referência culinária.
- source_word: μὴ γευσάμενος
  choice: sem provar
  rationale: Mantém a ideia circunstancial do particípio aoristo e a negação, ligando o choro ao fato de não ter provado os alimentos, sem impor uma nuance causal.
theological_decisions: []
translation_notes:
  register: 'Português moderno, claro e digno, com sintaxe narrativa natural. A ordem do grego foi preservada: saída do homem, choro de José e esclarecimento de que ele não provou alimento algum dela. Não há marcadores de nota no texto porque nenhuma nota é necessária.'
