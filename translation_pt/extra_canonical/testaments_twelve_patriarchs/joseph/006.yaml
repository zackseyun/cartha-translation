  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006.yaml
  text: 1 And after this she sent me food mixed with sorcery[a]. 2 But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me, together with the dish, a sword; and I understood that it was a scheme to lead me astray. 3 So after he had gone out, I ate neither that food nor any of her other foods, but wept without tasting them. 4 Then after one day she came to me, and when she recognized the food, she said to me, “Why is it that you did not eat the food?” 5 And I said to her, “Because you filled it with deadly sorcery. And how did you say, ‘I do not draw near to idols, but to the Lord alone’? 6 Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and for this reason I kept it as evidence against you, to expose you, in hope that perhaps, when you saw it[b][a], you might repent.”
translation:
  language: pt
  text: '**Testamento de José 6**


    **1** Depois disso, ela me enviou comida misturada com feitiçaria. **2** Quando chegou o eunuco que a trazia, levantei os olhos e vi um homem aterrador que, junto com o prato, me entregava uma espada.[a] Então compreendi que aquilo era um artifício[b] para me desviar. **3** Depois que ele saiu, chorei e não provei nem daquela comida nem de nenhum dos outros alimentos dela.


    **4** Depois de um dia, ela veio até mim e, ao reconhecer a comida, perguntou-me:


    — Por que você não comeu a comida?


    **5** Eu lhe respondi:


    — Porque você a encheu de feitiçaria mortal. Como, então, pôde dizer: “Não me aproximo dos ídolos, mas somente do Senhor”? **6** Saiba, pois, que o Deus de meu pai, por meio de seu anjo, revelou-me a sua maldade. Por isso, guardei a comida como prova da sua culpa,[c] na esperança de que, ao vê-la, talvez se arrependa.


    **7** E, para que você saiba que a maldade dos ímpios não prevalecerá contra os que adoram a Deus com domínio próprio, veja: tomando desta comida, comerei diante de você.


    Depois de dizer isso, declarei:


    — O Deus de meus pais e o anjo de Abraão estarão comigo.[d]


    Então comi. **8** Ao ver isso, ela caiu de rosto aos meus pés, chorando. Eu a levantei e a repreendi. **9** E ela concordou comigo em não voltar a praticar essa impiedade.


    [a] O texto grego não identifica o “homem aterrador”. A figura pode ser uma visão, um símbolo ou estar ligada à tentativa de feitiçaria.


    [b] Ou “uma prática mágica”. O termo grego pode designar uma atividade incomum ou mágica usada aqui para desencaminhar José.


    [c] Ou “para repreender você” ou “para convencer você de sua culpa”.


    [d] O texto grego passa do singular (“o Deus de meu pai”, no v. 6) ao plural (“o Deus de meus pais”, no v. 7).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego não identifica o “homem aterrador”. A figura pode ser uma visão, um símbolo ou estar ligada à tentativa de feitiçaria.
    reason: Preserva a ambiguidade narrativa e teológica da figura vista por José.
  - marker: b
    text: Ou “uma prática mágica”. O termo grego pode designar uma atividade incomum ou mágica usada aqui para desencaminhar José.
    reason: Registra a amplitude lexical de περιέργεια no contexto.
  - marker: c
    text: Ou “para repreender você” ou “para convencer você de sua culpa”.
    reason: Preserva as nuances de repreensão, exposição e demonstração de culpa de ἔλεγχος.
  - marker: d
    text: O texto grego passa do singular (“o Deus de meu pai”, no v. 6) ao plural (“o Deus de meus pais”, no v. 7).
    reason: Conserva e torna visível a variação interna do texto-fonte.
lexical_decisions:
- source_word: βρῶμα / ἐδέσματα
  choice: comida / alimentos
  rationale: “Comida” traduz de modo amplo βρῶμα; “alimentos” evita repetição excessiva no plural e não especifica um prato além do texto.
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: misturada com feitiçaria
  rationale: Preserva tanto o sentido mágico de γοητεία quanto a imagem concreta de algo misturado à comida.
- source_word: φοβερὸν ἄνδρα
  choice: um homem aterrador
  rationale: Comunica a força ameaçadora de φοβερός sem identificar a natureza da figura.
- source_word: τρύβλιον
  choice: prato
  rationale: Designa naturalmente um recipiente de comida sem determinar de modo indevido se era tigela ou travessa.
- source_word: μάχαιρα
  choice: espada
  rationale: O termo também pode indicar faca ou punhal, mas “espada” preserva a ameaça da cena visionária e é um equivalente comum no grego koiné.
- source_word: περιέργεια
  choice: artifício
  rationale: No contexto, indica uma manobra ou prática manipuladora destinada a desviar José; a nota conserva a possível nuance mágica.
- source_word: εἰς ἀποπλάνησίν μου
  choice: para me desviar
  rationale: Mantém a ideia de desencaminhamento moral ou espiritual sem reduzi-la apenas a engano intelectual.
- source_word: γοητείας θανάτου
  choice: feitiçaria mortal
  rationale: Entende o genitivo como qualidade ou efeito, em português natural, sem excluir a ideia literal de “feitiçaria de morte”.
- source_word: ἐν σωφροσύνῃ θεοσεβούντων
  choice: os que adoram a Deus com domínio próprio
  rationale: σωφροσύνη inclui sensatez, autocontrole e castidade; “domínio próprio” se ajusta ao contexto da resistência de José sem limitar o termo exclusivamente à castidade.
- source_word: ἐνουθέτησα
  choice: repreendi
  rationale: Expressa a admoestação corretiva dada por José após levantá-la, em linguagem corrente e digna.
theological_decisions:
- issue: Identidade do homem aterrador com a espada
  choice: Não identificar a figura e descrever apenas o que José viu
  alternative: Interpretá-la como anjo, demônio ou símbolo interior
  rationale: O grego relata a visão, mas não define a identidade nem a natureza da figura; a tradução e a nota preservam essa ambiguidade.
- issue: Sentido de μετανοήσεις
  choice: se arrependa
  alternative: mude de ideia
  rationale: A fala confronta uma maldade concreta e busca o abandono do pecado; “arrepender-se” comunica adequadamente essa força moral.
- issue: Referência ao “anjo de Abraão”
  choice: manter literalmente “o anjo de Abraão”
  alternative: explicar como anjo protetor ou anjo do Deus de Abraão
  rationale: A expressão é incomum, mas o texto não esclarece a relação. Explicá-la no corpo da tradução resolveria indevidamente uma tensão textual e teológica.
- issue: Afirmação sobre os ímpios e os que adoram a Deus
  choice: “a maldade dos ímpios não prevalecerá contra os que adoram a Deus com domínio próprio”
  alternative: “a maldade dos ímpios não dominará os que temem a Deus em castidade”
  rationale: A formulação conserva a declaração moral do texto e a amplitude de σωφροσύνη, sem convertê-la em promessa denominacional nem restringi-la a uma única virtude.
translation_notes:
  register: Português moderno, internacional e dignificado, com legibilidade brasileira. O discurso direto usa formas correntes (“você”) sem coloquialismo excessivo. A sintaxe fragmentária do v. 7 foi organizada em fala contínua, mas sua sequência de ações e as expressões teologicamente incomuns foram preservadas.
