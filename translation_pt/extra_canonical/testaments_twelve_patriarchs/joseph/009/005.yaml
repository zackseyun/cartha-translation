  naturalness: O texto é claro e acessível. «Sobretudo bem adornada» é uma formulação mais natural e mais próxima da construção grega do que «especialmente quando se enfeitava».
  terminology: «O Senhor» e «me protegeu» são apropriados. Mantém-se «caísse sobre ela», com nota para o valor figurado e sexualmente sugestivo da expressão, sem torná-la mais explícita que o grego.
