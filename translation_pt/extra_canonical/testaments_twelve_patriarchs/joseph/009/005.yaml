base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/005.yaml
  text: For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned to deceive me. But the Lord guarded me from her schemes.
translation:
  language: pt
  text: Pois, quando eu estava na casa dela, ela descobria os braços e as pernas, para que eu caísse sobre ela.[a] Pois ela era muito bonita, sobretudo bem adornada para me enganar. Mas o Senhor me protegeu das tentativas dela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «para que eu cedesse a ela». A expressão grega significa literalmente «cair sobre» ou «contra ela» e, neste contexto, sugere ceder à sua sedução.'
    reason: Esclarece o sentido contextual sem eliminar a imagem física nem resolver além do necessário a ambiguidade da expressão grega.
lexical_decisions:
- source_word: ἐγύμνου
  choice: descobria
  rationale: O imperfeito indica ação habitual ou repetida, e «descobria» comunica com naturalidade que ela deixava braços e pernas à mostra sem sugerir nudez total.
- source_word: τοὺς βραχίονας ... καὶ τὰς κνήμας
  choice: os braços e as pernas
  rationale: «Braços» é direto; κνήμας designa mais precisamente a parte inferior das pernas, mas «pernas» é a expressão corrente e mantém o sentido do gesto sedutor.
- source_word: συμπέσω εἰς αὐτήν
  choice: caísse sobre ela
  rationale: Mantém a imagem física e a ambiguidade da construção grega, que no contexto também sugere ceder sexualmente, sem substituir a imagem por uma interpretação explícita.
- source_word: μάλιστα κοσμουμένη
  choice: especialmente quando se enfeitava
  rationale: Expressa o particípio e a intensificação de modo natural, indicando que sua beleza era realçada pelos adornos.
- source_word: πρὸς ἀπάτην μου
  choice: para me enganar
  rationale: Reproduz a finalidade hostil da expressão grega em português claro e idiomático.
- source_word: ἐγχειρημάτων
  choice: armações
  rationale: No contexto, refere-se às tentativas ou tramas que ela empreendia contra José; «armações» é corrente e conserva a ideia de ações planejadas.
theological_decisions:
- issue: A ação protetora do Senhor diante da sedução
  choice: o Senhor me protegeu
  alternative: o Senhor me guardou
  rationale: «Protegeu» comunica claramente ἐφύλαξέ sem ampliar o modo pelo qual a proteção ocorreu; preserva a atribuição direta da libertação ao Senhor.
- issue: Sentido de συμπέσω εἰς αὐτήν
  choice: imagem preservada no texto, com explicação em nota
  alternative: para que eu cedesse a ela
  rationale: O contexto favorece a ideia de ceder à sedução, mas a formulação grega mantém uma imagem física. A tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. O imperfeito foi mantido para retratar conduta repetida. «Armações» é deliberadamente mais corrente que «maquinações», enquanto «Senhor» preserva o registro religioso do original.
