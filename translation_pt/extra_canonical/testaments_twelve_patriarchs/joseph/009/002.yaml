source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις δὲ¹ ἔπεμψε πρός με λέγουσα². Εὐδόκησον³ ⸀πληρῶσαι τὴν ἐπιθυμίαν⸀ μου, καὶ λύω⁴ σε ἐκ⁵ τῶν δεσμῶν, ⸀καὶ ἀπαλλάξω σε ἐκ⁶ τοῦ σκότους⸀. *Ἐγὼ δὲ οὐδὲ⁷ ἕως⁸ ἐννοίας⁹ ἐξέκλινα¹⁰ πρὸς αὐτήν· *ὁ γὰρ θεὸς ἀγαπᾷ¹¹ μᾶλλον τὸν¹² ἐν¹³ λάκκῳ σκότους †πιστὸν¹⁴ ἐν σωφροσύνῃ¹⁵, ἢ τὸν ἐν ταμείοις †βασιλέα¹⁶ τρυφῶντα μετ’ ἀκολασίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/002.yaml
  text: Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.” But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.
translation:
  language: pt
  text: 'Muitas vezes ela mandou dizer-me: “Concorde em satisfazer o meu desejo, e eu o libertarei das suas correntes e o livrarei da escuridão.” Mas eu não me inclinei para ela, nem em pensamento; pois Deus ama mais aquele que é fiel em autocontrole numa cova de escuridão do que aquele que, como rei em câmaras, vive no luxo e na devassidão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego apresenta sinais de incerteza textual nas palavras traduzidas por “fiel” e “rei”.
    reason: Informa os dois vocábulos assinalados por cruzes críticas na edição de Charles, sem afirmar uma solução textual que a edição não fornece.
lexical_decisions:
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: Concorde em satisfazer o meu desejo
  rationale: Mantém o sentido de dar consentimento ou aquiescer ao cumprimento do desejo, em português natural, sem explicitar além do grego a natureza sexual do pedido.
- source_word: ἀπαλλάξω σε ἐκ τοῦ σκότους
  choice: o livrarei da escuridão
  rationale: Preserva a imagem concreta da escuridão do cárcere e seu possível valor figurado.
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα πρὸς αὐτήν
  choice: nem sequer em pensamento me desviei para ela
  rationale: Reproduz a ênfase de que José não cedeu nem no âmbito interior, mantendo a metáfora de desviar-se ou inclinar-se.
- source_word: πιστὸν ἐν σωφροσύνῃ
  choice: permanece fiel e domina a si mesmo
  rationale: Expressa tanto a fidelidade quanto a ideia de autocontrole, castidade ou sensatez contida em σωφροσύνη, sem reduzir o termo a uma única nuance.
- source_word: ἐν ταμείοις
  choice: em seus aposentos
  rationale: No contexto de um rei vivendo em luxo, 'aposentos' é mais idiomático que 'depósitos' e corresponde ao possível sentido de câmaras interiores.
- source_word: τρυφῶντα μετ’ ἀκολασίας
  choice: vive no luxo e na devassidão
  rationale: Traduz o contraste entre vida suntuosa e conduta sem freios morais; 'devassidão' preserva a forte censura de ἀκολασία.
theological_decisions:
- issue: O sentido moral de σωφροσύνη
  choice: domina a si mesmo
  alternative: vive em castidade
  rationale: O contexto é sexual, mas o vocábulo também abrange autocontrole, moderação e sensatez. A formulação escolhida preserva essa amplitude.
- issue: A construção comparativa sobre o amor de Deus
  choice: Deus ama mais aquele que... do que aquele que...
  alternative: Deus prefere aquele que... àquele que...
  rationale: Segue de perto ἀγαπᾷ μᾶλλον e mantém a tensão teológica da afirmação comparativa, sem reformulá-la como simples aprovação moral.
- issue: Leituras textualmente assinaladas como incertas
  choice: fiel; como rei
  alternative: outras reconstruções possíveis nos pontos marcados por crux
  rationale: O texto impresso apresenta πιστόν e βασιλέα como leituras problemáticas. Foram vertidas no corpo por produzirem a sequência coerente atestada, com transparência em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A fala direta mantém tom persuasivo; a resposta de José conserva o paralelismo retórico entre a cova escura e os aposentos luxuosos.
