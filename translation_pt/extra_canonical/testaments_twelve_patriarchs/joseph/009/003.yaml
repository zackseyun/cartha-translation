source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Εἰ δὲ¹⁷ ἐν σωφροσύνῃ διάγων *θέλει καὶ¹⁸ δόξαν, καὶ¹⁹ οἶδεν ὁ ὕψιστος ὅτι συμφέρει, παρέχει²⁰ καὶ αὐτῷ καὶ ταῦτα²¹ ὡς κἀμοί.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/003.yaml
  text: But if one lives in self-control and also desires glory, and the Most High knows that it is beneficial, he grants these things also to him, as also to me.
translation:
  language: pt
  text: Mas, se alguém vive com autocontrole e também deseja glória, e o Altíssimo sabe que isso lhe convém, também lhe concede essas coisas, como a mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: autocontrole
  rationale: Expressa de modo natural e atual a ideia de domínio próprio, moderação e castidade presente no contexto, sem restringir indevidamente o termo a apenas um desses aspectos.
- source_word: διάγων
  choice: vive
  rationale: Verbo corrente que traduz o sentido de conduzir a vida ou viver de determinada maneira.
- source_word: δόξαν
  choice: glória
  rationale: Mantém o equivalente tradicional e abrangente de δόξα, que pode envolver honra, prestígio ou reconhecimento.
- source_word: συμφέρει
  choice: lhe convém
  rationale: Preserva a noção de ser proveitoso, benéfico ou apropriado para a pessoa, com formulação idiomática em português.
- source_word: παρέχει
  choice: concede
  rationale: Comunica que o Altíssimo dá ou proporciona aquilo que foi mencionado.
- source_word: ταῦτα
  choice: essas coisas
  rationale: Mantém o plural demonstrativo do grego, sem reduzi-lo somente à glória.
theological_decisions:
- issue: Relação entre desejo humano, benefício e concessão divina
  choice: 'Mantida a sequência: a pessoa deseja glória, o Altíssimo avalia se isso lhe convém e então concede essas coisas.'
  alternative: Reformular como se o Altíssimo soubesse que a própria glória é adequada à pessoa, omitindo o desejo.
  rationale: O texto grego recebido inclui θέλει καὶ δόξαν, e a tradução preserva tanto o desejo humano quanto o discernimento e a concessão do Altíssimo.
- issue: Referente plural de ταῦτα
  choice: “essas coisas”
  alternative: “isso” ou “a glória”
  rationale: O plural grego é preservado para não encerrar uma ambiguidade referencial genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “também” reflete os vários καί do grego sem tornar a frase excessivamente artificial; no fecho, “assim como concedeu a mim” explicita naturalmente o verbo elíptico em português.
