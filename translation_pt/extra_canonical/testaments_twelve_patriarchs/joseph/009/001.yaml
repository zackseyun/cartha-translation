base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/001.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: pt
  text: E, enquanto eu estava acorrentado, a egípcia definhava de tristeza. Quando vinha, ficava escutando como eu dava graças ao Senhor e cantava hinos na casa das trevas, e como me alegrava com voz jubilosa, glorificando o meu Deus, porque, por meio de um pretexto, eu havia sido liberto da egípcia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: acorrentado
  rationale: Expressa de modo natural o estado de prisão e conserva a imagem concreta de vínculos ou correntes.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: definhava de tristeza
  rationale: Comunica que a mulher estava dominada ou consumida pela tristeza, evitando o literalismo pouco natural de “era mantida unida”.
- source_word: ἐπηκροᾶτό μου
  choice: ficava escutando
  rationale: O aspecto verbal sugere ação repetida ou continuada; a formulação não força a ideia de escuta clandestina.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: na casa das trevas
  rationale: Preserva a metáfora solene e incomum do grego, provavelmente alusiva ao cárcere.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: com voz jubilosa
  rationale: Reproduz a alegria audível e viva indicada por ἱλαρός em registro digno.
- source_word: διὰ προφάσεως
  choice: por meio de um pretexto
  rationale: Mantém a ambiguidade do substantivo, que pode indicar pretexto, motivo alegado ou ocasião, sem explicar além do texto.
- source_word: ἀπηλλάγην
  choice: eu havia sido liberto
  rationale: Verte o passivo como libertação ou afastamento de alguém e preserva a anterioridade contextual.
theological_decisions:
- issue: Agência na libertação de José
  choice: “eu havia sido liberto”, sem agente expresso
  alternative: “Deus me havia libertado”
  rationale: O passivo grego não identifica explicitamente o agente; a tradução evita acrescentar uma afirmação teológica, ainda que o contexto de louvor possa sugerir ação divina.
- issue: Sentido do pretexto
  choice: preservar “pretexto” sem identificar sua natureza
  alternative: explicá-lo como a falsa acusação ou como a ocasião providencial da prisão
  rationale: O texto é conciso e permite tensão entre a acusação usada contra José e o meio pelo qual ele escapou da mulher.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com fluidez brasileira. A construção foi dividida em duas frases para clareza, preservando a progressão do grego e sua linguagem figurada.
