base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/004.yaml
  text: How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.
translation:
  language: pt
  text: Quantas vezes, embora estivesse doente, ela desceu até mim em hora imprópria e ouviu minha voz enquanto eu orava; e eu, compreendendo seus gemidos, permanecia calado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποσάκις
  choice: Quantas vezes
  rationale: Preserva a força exclamativa e a ideia de repetição do advérbio interrogativo.
- source_word: καίπερ ἀσθενοῦσα
  choice: embora estivesse doente
  rationale: Expressa naturalmente a concessão marcada por καίπερ com o particípio presente.
- source_word: κατῄει πρὸς με
  choice: desceu até mim
  rationale: Mantém o sentido direcional de κατῄει e o movimento em direção ao narrador.
- source_word: ἐν ἀωρίᾳ
  choice: em hora imprópria
  rationale: Comunica um horário inadequado ou fora de hora sem especificar algo que o grego deixa aberto.
- source_word: τῆς φωνῆς μου προσευχομένου
  choice: minha voz enquanto eu orava
  rationale: Torna explícita em português a relação entre a voz do narrador e sua oração, conforme o genitivo grego.
- source_word: συνίων τοὺς στεναγμούς
  choice: percebendo os gemidos dela
  rationale: Συνίων indica compreensão ou percepção; o possessivo é suprido pelo contexto, no qual os gemidos são da mulher.
- source_word: ἐσιώπων
  choice: fiquei calado
  rationale: Reproduz o silêncio deliberado do imperfeito de σιωπάω em português natural.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do grego sem rigidez artificial. A ambiguidade de ἐν ἀωρίᾳ foi preservada como “em hora imprópria”, sem restringi-la necessariamente à noite.
