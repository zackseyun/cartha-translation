base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005.yaml
  text: 'And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as my husband.”


    2 So when I heard this, I tore my garments and said to her, “Woman, be ashamed before God, and do not do this lawless and evil deed, lest you be destroyed. For know this also: I will report your scheme to everyone.”


    3 Then she, being afraid, begged me not to report this scheme.


    4 And she went away, trying to win me over with gifts and every kind of pleasure.'
translation:
  language: pt
  text: '5 E novamente, em outra ocasião, ela me disse: “Se você não quer cometer adultério, matarei meu marido com veneno e tomarei você como marido.”


    2 Quando ouvi isso, rasguei minhas vestes e lhe disse: “Mulher, envergonhe-se diante de Deus e não pratique essa ação perversa, para que você não seja destruída. E saiba também que contarei a todos esse seu plano.”


    3 Então ela, com medo, suplicou-me que não revelasse esse plano.


    4 Depois se afastou, procurando conquistar-me com presentes e todo tipo de prazeres.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: cometer adultério
  rationale: Expressa diretamente o sentido sexual e conjugal do verbo, em linguagem atual e inequívoca.
- source_word: αἰδέσθητι τὸν Θεόν
  choice: envergonhe-se diante de Deus
  rationale: Preserva o valor de αἰδέομαι, ligado à vergonha e ao recato reverente, sem substituí-lo pelo verbo mais comum para “temer”.
- source_word: πρᾶξιν ... πονηράν
  choice: ação perversa
  rationale: Mantém o substantivo genérico “ação/ato” e traduz πονηράν como perversidade moral; evita acrescentar “ilícita”, que não aparece claramente no texto grego fornecido.
- source_word: ἐπίνοιαν
  choice: plano
  rationale: No contexto, designa o intento concebido de matar o marido; “plano” é natural e preserva a ideia de propósito deliberado.
- source_word: ἐπιθάλπουσά με
  choice: procurando conquistar-me
  rationale: O particípio indica tentativa de cativar, amolecer ou atrair José; a formulação comunica esse movimento sem sugerir que ela teve êxito.
- source_word: ἀπολαύσεσι πάσαις
  choice: todo tipo de prazeres
  rationale: Reproduz a amplitude de πᾶσαι e o sentido de deleites ou prazeres oferecidos como sedução.
theological_decisions:
- issue: Sentido de αἰδέσθητι em relação a Deus
  choice: envergonhe-se diante de Deus
  alternative: tema a Deus
  rationale: O verbo grego aponta primariamente para vergonha, respeito ou reverência. A escolha mantém a formulação específica da fonte e não a harmoniza com expressões bíblicas usuais sobre temer a Deus.
- issue: Consequência expressa por ἵνα μὴ ἐξολοθρευθῇς
  choice: para que você não seja destruída
  alternative: para não ser exterminada
  rationale: Mantém a voz passiva e não identifica explicitamente o agente da destruição, preservando a abertura do texto quanto a juízo divino ou outra consequência.
- issue: Descrição moral da ação
  choice: essa ação perversa
  alternative: esse ato ilícito e perverso
  rationale: A tradução segue πονηράν sem importar uma qualificação jurídica adicional que não está inequivocamente presente no texto grego apresentado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. Mantiveram-se a numeração do capítulo e dos versículos, o discurso direto e a progressão narrativa concisa. Não há notas de rodapé, portanto não foram inseridos marcadores.
