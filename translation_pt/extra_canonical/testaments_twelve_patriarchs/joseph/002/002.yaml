source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἠγωνισάμην πρὸς γυναῖκα ἀναιδῆ ἐπείγουσάν² με παρανομεῖν μετʼ αὐτῆς, ἀλλʼ ὁ Θεὸς *τοῦ πατρός μου³ ἐρρύσατό⁴ με ἐκ⁵ φλογὸς καιομένης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/002.yaml
  text: And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame.
translation:
  language: pt
  text: E lutei contra uma mulher sem pudor, que insistia para que eu transgredisse com ela; mas o Deus de meu pai me livrou de uma chama ardente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγωνισάμην
  choice: lutei
  rationale: Expressa o esforço e o confronto persistente indicados pelo verbo grego, em linguagem natural e digna.
- source_word: γυναῖκα ἀναιδῆ
  choice: uma mulher sem pudor
  rationale: Traduz a falta de vergonha ou recato de ἀναιδής sem recorrer a uma formulação excessivamente arcaica.
- source_word: ἐπείγουσάν με
  choice: que insistia para que eu
  rationale: O particípio indica pressão continuada ou insistente exercida sobre José.
- source_word: παρανομεῖν μετʼ αὐτῆς
  choice: transgredisse com ela
  rationale: Preserva a linguagem ampla de violação da lei presente em παρανομέω e mantém a discrição do original quanto ao ato pretendido.
- source_word: ἐρρύσατό με
  choice: me livrou
  rationale: Comunica resgate de um perigo de maneira corrente e adequada ao registro bíblico.
- source_word: ἐκ φλογὸς καιομένης
  choice: de uma chama ardente
  rationale: Mantém a imagem metafórica do original sem explicá-la ou identificar indevidamente seu referente.
theological_decisions:
- issue: Identificação da chama ardente
  choice: Preservar a imagem sem explicação
  alternative: Interpretá-la explicitamente como paixão, tentação ou a própria mulher
  rationale: O grego deixa o referente da metáfora em aberto; explicá-lo no texto eliminaria uma ambiguidade genuína.
- issue: Expressão τοῦ πατρός μου
  choice: o Deus de meu pai
  alternative: Deus, meu Pai
  rationale: O genitivo indica o Deus associado ao pai de José, não uma invocação de Deus como Pai. O artigo em português é necessário para uma construção natural.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação conserva a imagem e a tensão moral do grego sem explicitação denominacional ou interpretativa.
