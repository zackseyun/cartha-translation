  text: But in all these things he takes the lead, and in various ways he encourages. For a short time he withdraws, in order to test the inner intent of the soul.
translation:
  language: pt
  text: Mas, em todas essas coisas, ele toma a dianteira e encoraja de diversas maneiras. Por pouco tempo, afasta-se, a fim de pôr à prova a intenção íntima da alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προΐσταται
  choice: toma a dianteira
  rationale: Expressa naturalmente a ideia de estar à frente ou assumir a liderança, sem especificar além do que o verbo grego permite.
- source_word: παρακαλεῖ
  choice: encoraja
  rationale: No contexto, comunica exortação e fortalecimento; evita restringir o sentido a simples consolo.
- source_word: ἐν βραχεῖ
  choice: por pouco tempo
  rationale: Entende a expressão em sentido temporal, em acordo com a ação subsequente de afastar-se.
- source_word: ἀφίσταται
  choice: afasta-se
  rationale: Reproduz de modo direto e natural a ideia de retirar-se ou manter distância.
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: a intenção íntima da alma
  rationale: Traduz διαβούλιον como propósito ou deliberação interior, preservando ψυχή como 'alma' e tornando clara a interioridade da expressão.
theological_decisions:
- issue: Referente implícito do sujeito de προΐσταται, παρακαλεῖ e ἀφίσταται
  choice: manter o pronome masculino 'ele' sem identificar o referente
  alternative: explicitar uma figura específica, como Deus ou um espírito
  rationale: O trecho fornecido não nomeia o sujeito; identificá-lo acrescentaria uma interpretação não expressa no grego.
- issue: Natureza da prova da alma
  choice: pôr à prova a intenção íntima da alma
  alternative: provar a decisão da alma ou testar o conselho interior da alma
  rationale: A formulação mantém a prova voltada à disposição deliberativa interior, sem resolver em termos doutrinários a relação entre alma, intenção e vontade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A tradução conserva a progressão do grego e a ambiguidade do sujeito, sem importar identificação teológica externa.
