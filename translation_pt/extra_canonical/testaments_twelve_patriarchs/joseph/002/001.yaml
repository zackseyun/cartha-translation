  text: And this man, the captain of Pharaoh's guard, entrusted his house to me.
translation:
  language: pt
  text: E este homem, o chefe dos cozinheiros do faraó,[1] confiou-me a sua casa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: O grego diz literalmente «chefe dos cozinheiros». Em contextos ligados ao Egito, este título às vezes é entendido como um cargo equivalente ao de chefe da guarda.
    reason: Preserva no texto o sentido lexical de ἀρχιμάγειρος e registra, sem resolver de forma excessiva, a interpretação tradicional refletida na tradução inglesa.
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: chefe da guarda
  rationale: Embora o termo possa designar literalmente um chefe de cozinheiros, neste contexto funciona como título do oficial do faraó tradicionalmente entendido como comandante ou chefe da guarda.
- source_word: ἐπίστευσέ μοι
  choice: confiou-me
  rationale: Reproduz de modo natural a ideia de confiar algo aos cuidados de alguém.
- source_word: τὸν οἶκον αὐτοῦ
  choice: a sua casa
  rationale: Preserva a formulação grega, que pode abranger tanto a residência quanto a administração doméstica.
