  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/004.yaml
  text: For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress.
translation:
  language: pt
  text: Pois o Senhor não abandona os que o temem, nem nas trevas, nem em cadeias, nem em aflições, nem em angústias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκαταλείπει
  choice: abandona
  rationale: Reproduz diretamente a ideia de deixar desamparado, com linguagem natural e digna.
- source_word: τοὺς φοβουμένους αὐτόν
  choice: os que o temem
  rationale: Preserva a expressão religiosa tradicional e o sentido participial do grego.
- source_word: σκότει
  choice: trevas
  rationale: Mantém a imagem concreta e seu possível alcance figurado, sem resolver a ambiguidade.
- source_word: δεσμοῖς
  choice: correntes
  rationale: No contexto de provações e possível aprisionamento, comunica de modo claro os vínculos físicos indicados pelo termo.
- source_word: θλίψεσιν
  choice: aflições
  rationale: Conserva o sentido amplo de sofrimento, pressão e tribulação.
- source_word: ἀνάγκαις
  choice: situações angustiosas
  rationale: Expressa circunstâncias de aperto, necessidade ou coação sem restringir o termo a uma única espécie de dificuldade.
theological_decisions:
- issue: Alcance da negação na sequência de provações
  choice: Repetir “nem” diante de cada elemento
  alternative: “não nas trevas, ou em correntes, ou em aflições, ou em angústias”
  rationale: Em português, a repetição deixa claro que o Senhor não abandona os que o temem em nenhuma dessas circunstâncias, refletindo a força da construção grega sem acrescentar uma conclusão teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A formulação preserva o paralelismo enumerativo e o tom sapiencial/devocional do original.
