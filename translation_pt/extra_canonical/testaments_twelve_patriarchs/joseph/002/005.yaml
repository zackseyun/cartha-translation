id: T12P.JOS.2.5
reference: Testament of Joseph 2:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός, Οὔτε¹⁶ ὡς υἱὸς ἀνθρώπου δειλιᾷ, Οὔτε¹⁷ ὡς γηγενὴς [ἀσθενεῖ ἢ]¹⁸ πτοεῖται¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/005.yaml
  text: For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, [does he become weak or] is he terrified.
translation:
  language: pt
  text: Pois Deus não se envergonha como um homem, nem se acovarda como um filho de homem, nem, como alguém nascido da terra, [enfraquece ou] fica apavorado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “enfraquece ou” têm transmissão textual incerta e aparecem entre colchetes na edição grega utilizada.
    reason: Explicar ao leitor por que a expressão foi preservada entre colchetes.
lexical_decisions:
- source_word: ἐπαισχύνεται
  choice: se envergonha
  rationale: Equivalente direto e natural que preserva o sentido de sentir vergonha.
- source_word: δειλιᾷ
  choice: se acovarda
  rationale: Expressa medo com perda de coragem, distinguindo este verbo do terror indicado por πτοεῖται.
- source_word: γηγενής
  choice: alguém nascido da terra
  rationale: Mantém a imagem etimológica e antropológica do grego sem a reduzir simplesmente a 'mortal' ou 'ser humano'.
- source_word: ἀσθενεῖ
  choice: enfraquece
  rationale: Preserva o valor verbal de tornar-se ou mostrar-se fraco e mantém a expressão entre colchetes por sua condição textual.
- source_word: πτοεῖται
  choice: fica apavorado
  rationale: Comunica forte perturbação ou terror e conserva a distinção em relação a δειλιᾷ.
theological_decisions:
- issue: Contraste entre Deus e a fragilidade humana
  choice: Preservar as três comparações negativas em paralelo
  alternative: Condensar em uma afirmação geral de que Deus não possui fraquezas humanas
  rationale: A estrutura tríplice faz parte do argumento e mantém a tensão retórica do texto sem acrescentar formulações doutrinárias.
- issue: Leitura textualmente incerta ἀσθενεῖ ἢ
  choice: Incluir '[enfraquece ou]' no texto e explicar em nota
  alternative: Omitir a expressão ou integrá-la sem sinalização
  rationale: Os colchetes da edição indicam incerteza textual; a tradução deve torná-la visível em vez de ocultá-la.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo retórico preservado. 'Filho de homem' foi mantido sem artigo para reproduzir a comparação genérica do grego; 'alguém nascido da terra' conserva a imagem de γηγενής. A nota está vinculada pelo marcador [a] no texto principal.
