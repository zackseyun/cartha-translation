base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/003.yaml
  text: I was imprisoned, I was beaten, I was mocked, and the Lord gave me compassion in the sight of the jailer.
translation:
  language: pt
  text: Fui preso, fui espancado, fui ridicularizado, e o Senhor fez com que o carcereiro tivesse compaixão de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφυλακίσθην
  choice: Fui preso
  rationale: Expressa de modo natural e direto o aoristo passivo, que indica o encarceramento de José.
- source_word: ἐτύφθην
  choice: fui espancado
  rationale: O verbo τύπτω denota ser golpeado; “espancado” comunica em português corrente a violência física sofrida.
- source_word: ἐξεμυκτηρίσθην
  choice: fui ridicularizado
  rationale: Preserva o sentido de zombaria ou escárnio público do verbo ἐκμυκτηρίζω em linguagem moderna.
- source_word: δεσμοφύλακος
  choice: carcereiro
  rationale: Equivalente português claro para o responsável pela guarda dos presos.
- source_word: ἔδωκέ με ὁ Κύριος εἰς οἰκτιρμοὺς ἐνώπιον
  choice: o Senhor fez com que ... tivesse compaixão de mim
  rationale: Reproduz idiomaticamente a construção semítica de ser dado ou colocado para compaixão diante de alguém, evitando a impressão pouco natural de que a compaixão foi dada ao próprio José.
theological_decisions:
- issue: Agência divina na compaixão do carcereiro
  choice: o Senhor fez com que o carcereiro tivesse compaixão de mim
  alternative: o Senhor me concedeu compaixão diante do carcereiro
  rationale: A formulação escolhida mantém o Senhor como agente e esclarece, sem acréscimo doutrinário, que a compaixão se manifesta na atitude do carcereiro para com José.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo mantido pela repetição de “fui”. A coordenação final segue o fluxo cumulativo do grego.
