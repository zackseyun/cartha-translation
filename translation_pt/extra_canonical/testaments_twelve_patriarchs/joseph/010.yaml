base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010.yaml
  text: '1[a]. See, then, my children, how much endurance accomplishes, and prayer with fasting.


    2. So you also, if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.


    3[b]. And where the Most High dwells, even if envy should befall someone, or slavery, or slander, the Lord dwelling in him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.


    4. For every person, whether in deed or in word or in thought, comes together.


    5. My brothers knew how my father loved me, yet I was not exalted in my mind; but though I was a child, I had the fear of God in my heart, for I knew that all things will surely pass away.


    6. And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent, when I was being sold, so as not to tell the Ishmaelites that I was a son of Jacob[c], a great and mighty man.'
translation:
  language: pt
  text: '**Testamento de José 10**


    **1.** Vejam, portanto, meus filhos, quanto a perseverança e a oração acompanhada de jejum realizam.


    **2.** Assim também vocês, se buscarem o domínio próprio e a pureza com perseverança e oração acompanhada de jejum, em humildade de coração, o Senhor habitará em vocês, porque ele ama o domínio próprio.


    **3.** Onde habita o Altíssimo, ainda que alguém seja atingido pela inveja, pela escravidão ou pela calúnia[a], o Senhor, que habita nele por causa de seu domínio próprio, não apenas o livra dos males, mas também o exalta e glorifica, como fez comigo.


    **4.** Pois toda pessoa, seja em ação, seja em palavra, seja em pensamento, se reúne.[b]


    **5.** Meus irmãos sabiam quanto meu pai me amava, mas eu não me exaltava em meus pensamentos. Embora ainda fosse criança, tinha no coração o temor de Deus, pois sabia que todas as coisas passariam.


    **6.** Não me ensoberbeci no mal; pelo contrário, honrei meus irmãos e, por medo deles, permaneci calado quando estava sendo vendido: não disse aos ismaelitas que eu era filho de Jacó[c], homem importante e justo.


    **Notas**


    [a] Ou “falsa acusação”. O termo grego pode indicar acusações maliciosas ou forjadas, o que corresponde à experiência de José no Egito.


    [b] O texto grego desta frase é difícil. Sua redação preservada diz literalmente algo próximo de “toda pessoa [...] se reúne”; uma interpretação possível é que uma pessoa se manifesta ou alcança destaque em todas as esferas: ação, palavra e pensamento.


    [c] Alguns testemunhos apresentam diferenças nesta oração, mas o sentido geral é que José, enquanto era vendido, permaneceu calado sobre sua identidade familiar.'
  philosophy: optimal-equivalence
