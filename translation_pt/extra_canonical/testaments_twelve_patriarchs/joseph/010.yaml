lexical_decisions:
- source_word: ὑπομονή
  choice: perseverança
  rationale: Expressa constância paciente diante de provações e soa natural no registro exortativo em português.
- source_word: προσευχή μετὰ νηστείας
  choice: oração acompanhada de jejum
  rationale: Preserva o valor de acompanhamento de μετά e evita transformar necessariamente a expressão em duas práticas sintaticamente independentes.
- source_word: σωφροσύνη
  choice: domínio próprio
  rationale: Mantém o alcance amplo da virtude — disciplina moral e controle de si — sem restringi-la à castidade, embora o contexto inclua a pureza sexual.
- source_word: ἁγνεία
  choice: pureza
  rationale: Abrange pureza moral e sexual sem estreitar indevidamente o termo.
- source_word: ταπείνωσις καρδίας
  choice: humildade de coração
  rationale: Conserva a formulação ética de tom bíblico e seu foco na disposição interior.
- source_word: κατοικέω
  choice: habitar
  rationale: Preserva diretamente a linguagem da presença divina e é corrente no português bíblico moderno.
- source_word: ὁ ὕψιστος
  choice: o Altíssimo
  rationale: É a forma portuguesa tradicional, clara e reverente desse título divino.
- source_word: φθόνος
  choice: inveja
  rationale: Corresponde ao vício que motiva a hostilidade dos irmãos contra José.
- source_word: δουλεία
  choice: escravidão
  rationale: Refere-se à condição concreta de José e não deve ser suavizado como mera servidão.
- source_word: συκοφαντία
  choice: calúnia
  rationale: É conciso e natural; a possibilidade contextual de falsa acusação é indicada em nota.
- source_word: ῥύεται
  choice: livra
  rationale: Expressa libertação do perigo em registro bíblico claro, sem exigir uma leitura soteriológica técnica.
- source_word: ὑψοῖ καὶ δοξάζει
  choice: exalta e glorifica
  rationale: Mantém distintos os dois verbos e preserva a elevação retórica ligada à trajetória de José.
- source_word: συνέρχεται
  choice: se reúne
  rationale: Reproduz de modo cauteloso o verbo preservado no texto difícil, sem inserir no corpo uma reconstrução interpretativa não segura.
- source_word: δίκαιος
  choice: justo
  rationale: Segue o adjetivo efetivamente presente no texto grego, em vez de adotar a redação inglesa “mighty”.
theological_decisions:
- issue: Linguagem da habitação divina em um testamento judaico
  choice: Traduzir κατοικήσει e κατοικεῖ diretamente como o Senhor ou o Altíssimo que habita na pessoa fiel.
  alternative: Reduzir a expressão a favor, proteção ou aprovação divina em sentido apenas metafórico.
  rationale: O grego apresenta a presença divina como associada à pureza, à perseverança e ao domínio próprio. A tradução preserva essa tensão sem lhe impor uma formulação doutrinária posterior.
- issue: Alcance moral de σωφροσύνη
  choice: Usar “domínio próprio”.
  alternative: Usar “castidade” ou “temperança”.
  rationale: O contexto de José inclui claramente a continência sexual, mas o termo designa uma disciplina moral mais ampla; sua associação com “pureza” conserva ambas as dimensões.
- issue: Relação entre conduta humana e livramento divino
  choice: Manter a afirmação de que o Senhor livra, exalta e glorifica a pessoa “por causa de seu domínio próprio”.
  alternative: Reformular para evitar qualquer relação causal entre virtude e ação divina.
  rationale: A relação causal está expressa no texto e deve ser preservada, sem ser harmonizada com um sistema teológico externo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se formas bíblicas correntes como “Altíssimo”, “temor de Deus” e “habitar”, evitando arcaísmos. A dificuldade textual do versículo 4 foi preservada no corpo e explicada em nota, em vez de ser resolvida silenciosamente.
