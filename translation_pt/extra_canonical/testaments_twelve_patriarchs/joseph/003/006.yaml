  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/006.yaml
  text: And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.
translation:
  language: pt
  text: E eu me levantava de madrugada para buscar o Senhor e chorava por Mênfis, a egípcia, pois ela me importunava muito, sem cessar; porque, mesmo à noite, entrava onde eu estava, sob o pretexto de uma visita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὤρθριζον πρὸς Κύριον
  choice: me levantava de madrugada para orar ao Senhor
  rationale: ὀρθρίζω indica levantar-se ou agir bem cedo; a construção com πρὸς Κύριον expressa orientação devocional ao Senhor. A explicitação de «orar» torna natural em português o sentido contextual sem alterar o ato descrito.
- source_word: ἔκλαιον περὶ Μεμφίας τῆς Αἰγυπτίας
  choice: chorava por causa de Mênfis, a egípcia
  rationale: περί com o genitivo pode indicar aquilo a respeito do qual ou por causa do qual se chora. «Por causa de» preserva aqui a ligação com o assédio narrado, sem afirmar que José chorava em favor dela.
- source_word: σφόδρα ἀδιαλείπτως ἠνόχλει μοι
  choice: ela me importunava muito, sem cessar
  rationale: ἠνόχλει descreve perturbação ou importunação reiterada; σφόδρα e ἀδιαλείπτως são mantidos distintamente por «muito» e «sem cessar».
- source_word: εἰσήιει πρός με
  choice: entrava onde eu estava
  rationale: A expressão indica que ela entrava e se aproximava de José. Esta formulação evita o português pouco natural «entrava para mim» e não acrescenta um aposento específico.
- source_word: λόγῳ ἐπισκέψεως
  choice: sob o pretexto de fazer uma visita
  rationale: λόγῳ pode indicar motivo alegado, e o contexto sugere uma visita usada como pretexto; ἐπίσκεψις é vertido naturalmente por «visita».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O aspecto habitual dos imperfeitos gregos foi preservado por «me levantava», «chorava», «importunava» e «entrava». O nome Μεμφία foi transliterado como «Mênfis», distinguindo a mulher egípcia sem substituir o nome por uma designação genérica.
