revisions:
- from: E eu me levantava de madrugada para orar ao Senhor e chorava por causa de Mênfis, a egípcia, pois ela me importunava muito, sem cessar; porque até de noite entrava onde eu estava, sob o pretexto de fazer uma visita.
  to: E eu me levantava de madrugada para buscar o Senhor e chorava por Mênfis, a egípcia, pois ela me importunava muito, sem cessar; porque, mesmo à noite, entrava onde eu estava, sob o pretexto de uma visita.
  rationale: A revisão retém o aspecto repetido dos verbos e o sentido de importunação contínua. «Buscar o Senhor» expressa naturalmente em português a orientação devocional de πρὸς Κύριον sem especificar o ato como oração, enquanto «chorava por Mênfis» evita fixar como causal uma relação que o grego deixa mais ampla. Ajustaram-se também a fluência de «mesmo à noite» e a concisão de «pretexto de uma visita».
