base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/004.yaml
  text: And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; because those who fast for God receive favor in their appearance.
translation:
  language: pt
  text: 4. Jejuei durante aqueles sete anos e, ao egípcio, parecia viver em abundância, porque os que jejuam por Deus recebem graça no semblante.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «recebem favor no rosto» ou «recebem um semblante agradável».'
    reason: A expressão grega τοῦ προσώπου τὴν χάριν liga χάρις («graça», «favor», «encanto») a πρόσωπον («rosto», «semblante»). As alternativas registram sua amplitude sem fixar uma única nuance.
lexical_decisions:
- source_word: ἐνήστευον
  choice: jejuei
  rationale: Expressa diretamente o jejum continuado ao longo do período indicado, sem acrescentar motivo ascético não explicitado.
- source_word: ἐν τοῖς ἑπτὰ ἔτεσιν ἐκείνοις
  choice: durante aqueles sete anos
  rationale: Reproduz com naturalidade o valor temporal da expressão grega.
- source_word: τῷ Αἰγυπτίῳ
  choice: aos olhos do egípcio
  rationale: 'Torna idiomático em português o dativo de percepção: ele parecia assim ao egípcio.'
- source_word: ὡς ἐν τρυφῇ διάγων
  choice: parecia viver em abundância
  rationale: τρυφή sugere conforto, fartura ou luxo; 'em abundância' preserva a ideia de condição próspera sem insinuar necessariamente ostentação.
- source_word: διὰ τὸν θεόν
  choice: por Deus
  rationale: 'Mantém a formulação concisa e a possível amplitude do grego: jejuar por causa de Deus, em consideração a ele ou em devoção a ele.'
- source_word: τοῦ προσώπου τὴν χάριν λαμβάνουσιν
  choice: recebem uma aparência favorecida
  rationale: Preserva a ligação explícita de χάρις com πρόσωπον, indicando graça, favor ou encanto perceptível no rosto ou na aparência.
theological_decisions:
- issue: Relação entre o jejum e Deus em διὰ τὸν θεόν
  choice: por Deus
  alternative: por amor a Deus; por causa de Deus
  rationale: A opção escolhida não restringe a expressão a uma única motivação teológica e conserva a concisão e a ambiguidade do original.
- issue: Efeito atribuído ao jejum em τοῦ προσώπου τὴν χάριν
  choice: aparência favorecida
  alternative: graça no rosto; semblante agradável
  rationale: Evita transformar a frase numa promessa doutrinária mais específica do que o texto, mantendo a noção de favor ou graça manifestada na aparência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. O contraste entre jejuar e parecer viver com fartura foi mantido; a nota registra a dificuldade da expressão final sem resolver indevidamente sua amplitude semântica.
