  revision_rationale: A revisão remove a adversativa não expressa no original, conserva o egípcio no singular e substitui uma formulação portuguesa artificial por «graça no semblante», que é natural e mais próxima de τοῦ προσώπου τὴν χάριν. A nota foi ajustada para explicar as alternativas semânticas de modo consistente com o texto revisto.
