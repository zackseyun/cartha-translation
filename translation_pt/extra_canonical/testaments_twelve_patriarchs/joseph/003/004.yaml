revisions:
- from: 4 E jejuei durante aqueles sete anos, mas, aos olhos do egípcio, eu parecia viver em abundância, porque os que jejuam por Deus recebem uma aparência favorecida.[a]
  to: 4. Jejuei durante aqueles sete anos e, ao egípcio, parecia viver em abundância, porque os que jejuam por Deus recebem graça no semblante.[a]
  rationale: A revisão remove a adversativa não expressa no original, conserva o egípcio no singular e substitui uma formulação portuguesa artificial por «graça no semblante», que é natural e mais próxima de τοῦ προσώπου τὴν χάριν. A nota foi ajustada para explicar as alternativas semânticas de modo consistente com o texto revisto.
