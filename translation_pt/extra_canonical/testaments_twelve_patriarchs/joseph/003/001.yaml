base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/001.yaml
  text: In ten temptations he proved me approved, and in them all I was patient; for patience is a great remedy, and endurance gives many good things.
translation:
  language: pt
  text: Em dez provações, ela demonstrou que eu era aprovado; e, em todas elas, fui paciente. Pois a paciência é um grande remédio, e a perseverança dá muitos bens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πειρασμοῖς
  choice: provações
  rationale: O termo pode indicar tentações ou provas. “Provações” preserva o sentido de situações que põem o caráter à prova sem pressupor que Deus induza ao mal.
- source_word: δόκιμον ἀπέδειξέ με
  choice: ele demonstrou que eu era aprovado
  rationale: 'Reproduz a linguagem de comprovação após teste: José foi mostrado como alguém aprovado, sem reduzir a expressão a mera resistência.'
- source_word: ἐμακροθύμησα / ἡ μακροθυμία
  choice: fui paciente / a paciência
  rationale: Expressa a longanimidade e o domínio perseverante diante da provocação em português corrente.
- source_word: ἡ ὑπομονή
  choice: a perseverança
  rationale: Distingue ὑπομονή de μακροθυμία e ressalta a constância sob dificuldades.
- source_word: πολλὰ ἀγαθὰ δίδωσιν
  choice: proporciona muitos bens
  rationale: Mantém a amplitude de ἀγαθά, que pode abranger benefícios ou coisas boas, em formulação digna e natural.
theological_decisions:
- issue: Referente do sujeito implícito em ἀπέδειξέ
  choice: “ele”, preservando o sujeito masculino implícito do grego
  alternative: “ela”, tomando como sujeito a mulher mencionada no contexto anterior
  rationale: A forma verbal não explicita o sujeito, e o excerto isolado permite mais de um referente contextual. O texto grego fornecido e a camada inglesa apresentam “he”; a tradução mantém essa leitura sem identificar expressamente o agente como Deus.
translation_notes:
  register: Português moderno, claro e digno, com distinção lexical entre paciência e perseverança. A pontuação divide o dito sapiencial em duas frases para facilitar a leitura.
