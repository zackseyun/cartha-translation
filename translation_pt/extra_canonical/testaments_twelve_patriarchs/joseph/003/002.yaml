source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ποσάκις ἡ Αἰγυπτία¹ ἠπείλησέ² μοι³ θάνατον; ποσάκις⁴ τιμωρίαις⁵ ⸀με⸀⁶ παραδοῦσα⁷ ἀνεκαλέσατο⁸ [καὶ ἠπείλησέ μοι⁹] *καὶ μὴ θέλοντός μου¹⁰ συνελθεῖν αὐτῇ ἔλεγέ¹¹ μοι· Κυριεύσεις¹² *κἀμοὶ καὶ πάντων τῶν ἐν τῷ οἴκῳ μου¹³, *ἐὰν ἐπιδῷς ἑαυτὸν¹⁴ εἰς ἐμέ, καὶ ἔσῃ ὡς δεσπότης ἡμῶν¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/002.yaml
  text: How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments, she called me back, and threatened me; and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”
translation:
  language: pt
  text: 'Quantas vezes a egípcia me ameaçou de morte! Quantas vezes, depois de me entregar a castigos, mandou me chamar de volta e tornou a me ameaçar! E, como eu não queria unir-me a ela, dizia-me: “Você terá autoridade sobre mim e sobre todos os que estão em minha casa, se se entregar a mim, e será como nosso senhor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: a egípcia
  rationale: Mantém a designação substantivada do grego, sem acrescentar uma identificação ausente neste versículo.
- source_word: τιμωρίαις
  choice: a castigos
  rationale: Expressa naturalmente medidas punitivas, preservando o plural do texto grego.
- source_word: ἀνεκαλέσατο
  choice: mandou me chamar de volta
  rationale: Reproduz o sentido de convocar ou chamar novamente, de modo claro em português.
- source_word: συνελθεῖν αὐτῇ
  choice: unir-me a ela
  rationale: Preserva o eufemismo relacional e sexual do grego sem torná-lo indevidamente explícito.
- source_word: Κυριεύσεις
  choice: Você terá autoridade
  rationale: Comunica o exercício prometido de domínio ou poder de maneira idiomática.
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: se se entregar a mim
  rationale: Mantém a ideia de dar-se ou entregar-se à mulher, inclusive sua sugestão sexual, sem explicitação interpretativa excessiva.
- source_word: δεσπότης ἡμῶν
  choice: nosso senhor
  rationale: Conserva a linguagem de autoridade doméstica do original; aqui “senhor” indica chefe ou amo, não um título divino.
theological_decisions:
- issue: Sentido de συνελθεῖν αὐτῇ
  choice: unir-me a ela
  alternative: ter relações com ela
  rationale: A opção escolhida preserva o eufemismo e a amplitude formal do grego, deixando o contexto transmitir a dimensão sexual.
- issue: Força de δεσπότης
  choice: nosso senhor
  alternative: nosso amo
  rationale: “Senhor” mantém a dignidade e a relação de autoridade do termo, sem inserir conotação teológica; “amo” seria possível, mas soa mais marcado e menos natural neste discurso.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira. A repetição retórica de “Quantas vezes” e a progressão das ameaças foram mantidas. “Você” foi usado na fala direta por sua ampla naturalidade no português brasileiro, enquanto a sintaxe geral permanece adequada a leitores de outras variedades.
