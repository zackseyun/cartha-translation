  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/003.yaml
  text: But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.
translation:
  language: pt
  text: Eu, porém, me lembrava das palavras de meu pai e, entrando em meu quarto, chorava e orava ao Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Eu, porém
  rationale: Preserva a ênfase explícita no pronome e o contraste marcado por δέ, com formulação natural e digna em português.
- source_word: ἐμνημόνευον
  choice: me lembrava
  rationale: O imperfeito indica ação contínua ou reiterada no contexto; por isso, conserva-se o aspecto durativo em vez do pontual «lembrei-me».
- source_word: λόγους πατρός μου
  choice: das palavras de meu pai
  rationale: Tradução direta e idiomática de λόγους e do genitivo πατρός μου.
- source_word: ταμεῖον
  choice: quarto
  rationale: Designa um aposento interior ou privado; «quarto» comunica com clareza o lugar de recolhimento sem restringi-lo indevidamente a depósito ou despensa.
- source_word: κλαίων προσηυχόμην
  choice: chorava e orava
  rationale: Mantém a simultaneidade e o aspecto contínuo do particípio presente e do verbo no imperfeito, evitando subordinação pesada em português.
- source_word: Κυρίῳ
  choice: ao Senhor
  rationale: Equivalente tradicional, claro e não sectário do título divino no dativo.
