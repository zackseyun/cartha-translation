  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/007.yaml
  text: And because she had no male child, she pretended.
translation:
  language: pt
  text: E, como ela não tinha filho homem, fingia... [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego disponível termina aqui, deixando incompleto aquilo que ela fingia.
    reason: Explica ao leitor por que o enunciado termina de maneira abrupta, sem suprir conteúdo ausente.
lexical_decisions:
- source_word: τέκνον ἄρρεν
  choice: filho homem
  rationale: Expressa de modo claro e natural que ela não tinha um descendente do sexo masculino, preservando a especificação do grego.
- source_word: προσεποιεῖτο
  choice: fingia
  rationale: Corresponde ao sentido de simular ou fazer de conta. O imperfeito sugere ação continuada ou repetida, daí “fingia”.
theological_decisions:
- issue: Cláusula interrompida no texto grego disponível
  choice: Manter a frase incompleta, sinalizada por reticências e nota
  alternative: Completar com a ideia de que José agiria como filho dela
  rationale: O complemento não consta do texto grego fornecido; preservá-lo em aberto evita introduzir uma interpretação sem apoio textual.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil. A forma “filho homem” é amplamente compreensível e evita o tom mais técnico de “filho do sexo masculino”. As reticências marcam a interrupção material do enunciado, não uma hesitação da personagem.
