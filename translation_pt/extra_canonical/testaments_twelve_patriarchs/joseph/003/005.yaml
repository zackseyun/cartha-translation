  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/005.yaml
  text: And if my master was away, I drank no wine; and for three days I would take my food and give it to the poor and the sick.
translation:
  language: pt
  text: E, quando meu senhor estava ausente, eu não bebia vinho; e, de três em três dias, tomava a minha comida e a dava aos pobres e aos doentes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεδήμει
  choice: estava ausente
  rationale: Expressa naturalmente a ideia de estar fora ou em viagem, sem acrescentar destino ou motivo.
- source_word: ὁ κύριός μου
  choice: meu senhor
  rationale: Mantém a relação social indicada por κύριος no contexto, sem modernizá-la indevidamente para um termo profissional.
- source_word: τριημερίζων
  choice: durante três dias
  rationale: Preserva a referência temporal do particípio grego sem explicitar como jejum aquilo que o texto não declara diretamente.
- source_word: πένησιν καὶ ἀσθενοῦσιν
  choice: aos pobres e aos doentes
  rationale: Equivalentes correntes e claros para os necessitados economicamente e os enfermos.
theological_decisions:
- issue: Possível referência implícita a jejum em τριημερίζων
  choice: Não inserir “jejuava” no texto principal
  alternative: “passava três dias em jejum”
  rationale: O grego menciona o período de três dias, mas não contém um verbo explícito para jejuar. A tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O paralelismo verbal em “pegava... e a dava” reproduz o caráter habitual das ações narradas.
