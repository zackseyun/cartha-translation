  text: Ἐὰν δὲ ἀπεδήμει²⁷ *ὁ κύριός μου²⁸ οἶνον²⁹ οὐκ ἔπινον, *καὶ τριημερίζων³⁰ ἐλάμβανον³¹ ⸀μου⸀ τὴν τροφήν³², καὶ ἐδίδουν³³ αὐτὴν ⸀τοῖς⸀³⁴ πένησιν καὶ ⸀τοῖς⸀³¹ ἀσθενοῦσιν.
