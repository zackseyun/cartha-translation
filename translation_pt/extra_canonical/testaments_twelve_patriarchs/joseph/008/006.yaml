source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ λέγει³⁷ πρὸς με· *Ἰδοὺ οὖν³⁸ ἀγαπᾷς με· *τοῦτό μοι ἀρκεῖτω· μόνον ἀντιποιῆσαι³⁹ *τῆς ζωῆς μου⁴⁰ ⌜καὶ *τῶν τέκνων⁴¹ μου, *καὶ ἔχω⁴² προσδοκίαν ἀπολαῦσαι⁴³ ⌜καὶ⁴⁴ τῆς ἐπιθυμίας μου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/006.yaml
  text: 'And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.”'
translation:
  language: pt
  text: 'E ela me disse[a]: “Veja, então: você me ama. Que isso me baste. Apenas cuide da minha vida e dos meus filhos, e tenho esperança de também alcançar o que desejo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego diz literalmente “e diz para mim”, sem indicar o gênero do sujeito; o contexto identifica a mulher como quem fala.
    reason: Esclarece uma ambiguidade formal relevante do texto grego e a razão para o pronome feminino na tradução.
lexical_decisions:
- source_word: τοῦτό μοι ἀρκεῖτω
  choice: Que isso me baste
  rationale: Preserva a força imperativa da expressão grega e soa natural e digna em português.
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: cuide da minha vida e dos meus filhos
  rationale: No contexto, o infinitivo pede que José zele pela vida dela e pelos filhos; “cuide de” comunica isso claramente sem ampliar a ideia.
- source_word: προσδοκίαν ἔχω ἀπολαῦσαι
  choice: tenho esperança de ... alcançar
  rationale: Reproduz a expectativa expressa por προσδοκίαν ἔχω e verte ἀπολαῦσαι de modo idiomático, sem garantir o resultado.
- source_word: τῆς ἐπιθυμίας μου
  choice: o que desejo
  rationale: Mantém a referência deliberadamente ampla ao desejo dela, sem explicitar além do grego.
theological_decisions:
- issue: Identidade gramatical do interlocutor
  choice: ela
  alternative: ele; ou omitir o pronome
  rationale: λέγει não marca gênero, mas o contexto narrativo identifica a mulher como falante. A nota registra a forma literal para não atribuir ao verbo grego uma distinção inexistente.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. O discurso direto mantém tom sóbrio e a ambiguidade de “desejo”, sem explicitação interpretativa.
