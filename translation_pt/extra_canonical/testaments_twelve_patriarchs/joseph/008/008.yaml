  source_fidelity: 'A tradução conserva adequadamente a sequência e as relações do grego: cair sob uma paixão de desejo, ser escravizado por ela, o paralelo com «aquela mulher», ouvir algo bom e compreendê-lo sob a influência da paixão em direção ao desejo perverso. «Paixão do desejo» preserva a distinção entre πάθος e ἐπιθυμία, sem restringir indevidamente o enunciado à sexualidade.'
  naturalness: O português é moderno, claro e de registro apropriado. «Interpreta isso em função daquela paixão» comunica naturalmente o valor contextual de ἐκλαμβάνει. «Voltando-o» tem antecedente recuperável em «algo bom/isso» e expressa de modo aceitável a orientação indicada por πρός.
