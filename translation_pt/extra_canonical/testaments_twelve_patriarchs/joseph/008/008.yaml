id: T12P.JOS.8.8
reference: Testament of Joseph 8:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν γάρ τις *ὑποπέσῃ πάθει⁵⁰ ἐπιθυμίας⁵¹ καὶ *δουλωθῇ αὐτῷ⁵² ὡς κἀκείνη, κἂν ἀγαθόν⁵³ τι ἀκούσῃ⁵⁴ εἰς *ἐκεῖνο τὸ⁵⁵ πάθος⁵⁶ *ἐκλαμβάνει αὐτὸ⁵⁷ πρὸς *τὴν πονηρὰν ἐπιθυμίαν⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/008.yaml
  text: For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he takes it in relation to that passion, toward his evil desire.
translation:
  language: pt
  text: Pois, se alguém cair sob o domínio da paixão do desejo e se tornar escravo dela, como também aconteceu com aquela mulher, mesmo que ouça algo bom, interpreta isso em função daquela paixão, voltando-o para o seu desejo perverso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας
  choice: cair sob o domínio da paixão do desejo
  rationale: Reproduz a ideia de cair sob o poder de um impulso dominador, preservando tanto πάθος como ἐπιθυμία sem reduzi-los a um único conceito.
- source_word: δουλωθῇ αὐτῷ
  choice: se tornar escravo dela
  rationale: Mantém a metáfora forte de escravidão expressa pelo verbo δουλόω.
- source_word: κἀκείνη
  choice: como também aconteceu com aquela mulher
  rationale: Explicita em português o referente feminino do pronome grego sem acrescentar uma identificação ausente neste versículo.
- source_word: ἀγαθόν τι ἀκούσῃ
  choice: ouça algo bom
  rationale: Tradução direta e natural que preserva a amplitude de ἀγαθόν τι.
- source_word: εἰς ἐκεῖνο τὸ πάθος ἐκλαμβάνει αὐτό
  choice: interpreta isso em função daquela paixão
  rationale: ἐκλαμβάνει indica tomar ou entender o que foi ouvido segundo a paixão já mencionada; 'interpreta' comunica esse sentido contextual.
- source_word: πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: voltando-o para o seu desejo perverso
  rationale: Preserva a orientação para o desejo mau indicada por πρός e mantém a avaliação moral de πονηρά.
theological_decisions:
- issue: Relação entre paixão e desejo
  choice: manter 'paixão do desejo' e depois 'desejo perverso'
  alternative: fundir ambos em 'desejo maligno' ou 'luxúria'
  rationale: O grego distingue πάθος de ἐπιθυμία. A formulação escolhida conserva essa tensão e evita restringir necessariamente o sentido a uma categoria sexual.
- issue: Natureza do ato de ἐκλαμβάνει
  choice: interpreta o que ouve segundo a paixão
  alternative: apropria-se disso para satisfazer a paixão
  rationale: O contexto favorece uma distorção interpretativa, mas a frase também contém direção para o desejo perverso; a tradução preserva ambos os elementos sem afirmar uma ação específica não expressa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi levemente desdobrada para clareza, sem eliminar a repetição deliberada de 'paixão' e 'desejo' do original.
