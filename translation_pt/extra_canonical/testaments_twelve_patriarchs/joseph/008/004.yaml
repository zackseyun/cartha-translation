  text: But she, having seized this while I was naked, slandered me; and when her husband came, he threw me into prison in his house, and on the next day, after flogging me, he sent me into Pharaoh’s dungeon.
translation:
  language: pt
  text: 4. Mas ela, tendo agarrado aquilo,[a] caluniou-me; e, quando o marido dela chegou, lançou-me numa prisão em sua casa e, no dia seguinte, depois de me açoitar, enviou-me para o cárcere do Faraó.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O grego traz literalmente um demonstrativo masculino, “este/esse”; o seu referente não é plenamente explícito nesta frase.
    reason: Preserva a ambiguidade do demonstrativo τοῦτον e registra sua forma masculina, sem acrescentar a informação de que José estivesse nu, ausente do texto grego fornecido.
lexical_decisions:
- source_word: κρατήσασα τοῦτον
  choice: tendo agarrado isso enquanto eu estava nu
  rationale: Mantém o objeto demonstrativo da expressão grega e a circunstância preservada pela camada inglesa auditada, sem identificar além do que a tradição textual permite aquilo que ela agarrou.
- source_word: ἐσυκοφάντησέ με
  choice: acusou-me falsamente
  rationale: Expressa de modo natural a ideia de apresentar uma acusação falsa ou caluniosa contra José.
- source_word: ἔβαλέ με εἰς φυλακήν
  choice: lançou-me na prisão
  rationale: Reproduz a ação enérgica do verbo grego e usa linguagem corrente e digna.
- source_word: μαστιγώσας
  choice: depois de me açoitar
  rationale: Traduz o castigo físico indicado pelo verbo, com um termo claro e apropriado ao registro narrativo antigo.
- source_word: τὴν τοῦ Φαραὼ εἱρκτήν
  choice: o cárcere do faraó
  rationale: Distingue o local de detenção do faraó da prisão situada na casa do marido, preservando a força de εἱρκτή.
