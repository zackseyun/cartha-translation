base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/001.yaml
  text: So I say to you, my children, that it was about the sixth hour when she left me. And after bending my knee to the Lord all day and all night, toward dawn I rose, weeping and asking for deliverance from her.
translation:
  language: pt
  text: 1 Portanto, digo-lhes, meus filhos, que era por volta da sexta hora quando ela se afastou de mim. E, tendo me ajoelhado diante do Senhor durante todo o dia e toda a noite, levantei-me ao amanhecer, chorando e pedindo libertação dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥρα ἦν ὡσεὶ ἕκτη
  choice: era por volta da sexta hora
  rationale: Preserva o modo antigo de contar as horas e a aproximação expressa por ὡσεὶ, sem converter interpretativamente para o meio-dia.
- source_word: ἐξῆλθεν ἀπ᾽ ἐμοῦ
  choice: ela saiu de junto de mim
  rationale: Reproduz o afastamento da mulher em relação a José com formulação natural, sem sugerir que ela tenha saído de dentro dele.
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: depois de passar ... de joelhos diante do Senhor
  rationale: Expressa idiomaticamente a postura contínua de oração indicada pelo contexto e evita o pouco natural singular literal 'dobrar o joelho'.
- source_word: πρὸς ὄρθρον
  choice: ao amanhecer
  rationale: Equivalente corrente e preciso para o período próximo da alvorada.
- source_word: αἰτῶν λύτρωσιν ἐξ αὐτῆς
  choice: pedindo que ele me livrasse dela
  rationale: Comunica em português natural o pedido de libertação em relação à mulher; explicita apenas o agente naturalmente subentendido, o Senhor.
theological_decisions:
- issue: Agente da libertação pedida
  choice: que ele me livrasse dela
  alternative: pedindo libertação dela
  rationale: O pedido é dirigido ao Senhor na oração mencionada imediatamente antes. A explicitação pronominal torna a frase natural sem introduzir uma doutrina adicional.
- issue: Referente feminino de αὐτῆς
  choice: dela
  alternative: disso
  rationale: O feminino grego remete à mulher que acaba de deixar José, e não de modo abstrato à tentação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. Conserva 'sexta hora' por fidelidade ao sistema temporal antigo; a postura prolongada de oração é vertida idiomaticamente como 'passar ... de joelhos diante do Senhor'.
