base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/005.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: pt
  text: E, enquanto eu estava em correntes, a egípcia estava tomada pela tristeza. Quando veio, escutava-me, enquanto eu dava graças ao Senhor, cantava hinos na casa das trevas e me alegrava com voz alegre, glorificando o meu Deus, porque, por meio de um pretexto, fui libertado da egípcia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: acorrentado
  rationale: Expressa naturalmente a condição de estar preso em grilhões ou correntes, sem acrescentar detalhes não presentes no grego.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: estava consumida pela tristeza
  rationale: συνέχω pode indicar estar dominado, oprimido ou tomado por algo; a formulação portuguesa transmite o efeito intenso da tristeza com naturalidade, sem o sentido pouco claro de 'mantida unida'.
- source_word: ἐπηκροᾶτό μου
  choice: ficou escutando
  rationale: O verbo sugere ouvir atentamente, possivelmente às escondidas; 'ficou escutando' preserva o foco no ato continuado sem afirmar de modo excessivo que espionava.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: na casa das trevas
  rationale: Mantém de perto a expressão imagética do grego e sua possível referência à prisão.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: com voz jubilosa
  rationale: ἱλαρός indica alegria, contentamento ou vivacidade; 'jubilosa' combina com o contexto de louvor e conserva um registro digno.
- source_word: διὰ προφάσεως
  choice: por meio de um pretexto
  rationale: 'Preserva a formulação ambígua: a acusação serviu de pretexto ou ocasião para José ser afastado da mulher, sem identificar explicitamente quem o produziu.'
- source_word: ἀπηλλάγην
  choice: eu havia sido libertado
  rationale: O aoristo passivo indica que José foi livrado ou afastado da mulher; o mais-que-perfeito ajusta a anterioridade ao ato de dar graças.
theological_decisions:
- issue: Agente do livramento implícito na voz passiva
  choice: eu havia sido libertado
  alternative: Deus me havia libertado
  rationale: Embora o contexto atribua a providência a Deus, o grego não nomeia o agente; a tradução conserva essa abertura.
- issue: Valor de πρόφασις no livramento de José
  choice: por meio de um pretexto
  alternative: por causa da falsa acusação
  rationale: A alternativa interpreta o pretexto como a acusação da egípcia. O texto grego é mais compacto e permite tensão entre injustiça humana e livramento providencial.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada em duas frases para evitar um período excessivamente longo, preservando a sequência narrativa e as imagens do grego.
