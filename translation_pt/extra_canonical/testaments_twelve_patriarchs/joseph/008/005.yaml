revisions:
- from: E, enquanto eu estava acorrentado, a egípcia estava consumida pela tristeza. Quando veio, ficou escutando como eu dava graças ao Senhor e cantava hinos na casa das trevas, e como me alegrava com voz jubilosa, glorificando o meu Deus, porque, por meio de um pretexto, eu havia sido libertado da egípcia.
  to: E, enquanto eu estava em correntes, a egípcia estava tomada pela tristeza. Quando veio, escutava-me, enquanto eu dava graças ao Senhor, cantava hinos na casa das trevas e me alegrava com voz alegre, glorificando o meu Deus, porque, por meio de um pretexto, fui libertado da egípcia.
  rationale: A revisão conserva a ambiguidade do agente passivo em «fui libertado» e do «pretexto», explicita a relação de escuta indicada por μου e adota equivalentes portugueses mais próximos das nuances de συνείχετο e ἱλαρά. Não são necessárias notas adicionais, pois os números da edição grega não correspondem, no material fornecido, a notas textuais a reproduzir.
