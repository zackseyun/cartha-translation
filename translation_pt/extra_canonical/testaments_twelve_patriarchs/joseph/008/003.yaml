base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/003.yaml
  text: Therefore, when I saw that she, in her frenzy, was seizing my tunic, leaving it [and shaking it off], I fled naked.
translation:
  language: pt
  text: 3 Portanto, quando vi que ela, em seu desvario, agarrava minha túnica, deixando-a [e sacudindo-a], fugi nu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαινομένη
  choice: em seu desvario
  rationale: Expressa o estado de comportamento frenético ou fora de controle indicado pelo particípio, sem introduzir diagnóstico clínico.
- source_word: κρατεῖ
  choice: agarrava
  rationale: Reproduz a ação contínua de segurar firmemente a túnica no contexto.
- source_word: χιτῶνα
  choice: túnica
  rationale: Equivalente corrente e historicamente adequado para a peça de roupa designada por χιτών.
- source_word: καταλείψας αὐτόν
  choice: deixei-a
  rationale: O pronome retoma a túnica; a formulação concisa preserva a ideia de abandoná-la nas mãos da mulher.
- source_word: ἐκτιναξάμενος
  choice: me desvencilhei dela
  rationale: No contexto, transmite o movimento de livrar-se da túnica ou sacudi-la para longe, conservando a expressão entre colchetes por sua condição textual.
- source_word: γυμνός
  choice: nu
  rationale: Mantém a formulação direta do grego e sua possível amplitude contextual, sem suavizá-la para 'seminu' ou 'sem a túnica'.
theological_decisions:
- issue: Grau de nudez indicado por γυμνός
  choice: nu
  alternative: seminu / sem a túnica
  rationale: A tradução preserva a força e a ambiguidade do termo grego, evitando restringir seu sentido com uma explicação não presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. Os colchetes do trecho grego foram preservados no corpo do texto para sinalizar sua condição textual; não há marcadores de nota de rodapé.
