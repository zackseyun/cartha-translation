source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὐκ ἔγνω δὲ αὐτὴ⁴⁵ ὅτι διὰ τὸν⁴⁶ Κύριόν⁴⁷ μου εἶπον οὕτως ἐγώ⁴⁸, καὶ οὐχὶ⁴⁹ δι᾽ αὐτήν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/007.yaml
  text: But she did not know that I spoke thus because of my Lord, and not because of her.
translation:
  language: pt
  text: Mas ela não sabia que eu tinha falado assim por causa do meu Senhor, e não por causa dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνω
  choice: sabia
  rationale: No contexto, o aoristo de γινώσκω exprime que ela não tinha conhecimento da verdadeira motivação de José; «sabia» é natural e fiel em português.
- source_word: διὰ τὸν Κύριόν μου
  choice: por causa do meu Senhor
  rationale: Mantém o valor causal de διά com acusativo e preserva «meu Senhor» como referência teológica sem explicitação adicional.
- source_word: εἶπον οὕτως
  choice: eu tinha falado assim
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da fala em relação ao desconhecimento narrado; «assim» reproduz οὕτως.
- source_word: οὐχὶ δι᾽ αὐτήν
  choice: e não por causa dela
  rationale: Conserva o contraste enfático e a repetição da relação causal presente no grego.
theological_decisions:
- issue: Identidade e grafia de Κύριόν
  choice: meu Senhor
  alternative: meu senhor
  rationale: A maiúscula da edição e o contexto apresentam o Senhor como a motivação religiosa de José; a tradução preserva essa sinalização sem definir mais precisamente o referente.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A formulação mantém explicitamente o contraste entre a lealdade ao Senhor e qualquer consideração pela mulher.
