base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/002.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a slave?” And I said that I was a household slave, so that I might not put my brothers to shame.
translation:
  language: pt
  text: 'Enquanto eu viajava com os ismaelitas, eles me perguntavam repetidamente: “Você é escravo?” E eu disse que era escravo da casa,[a] para não envergonhar meus irmãos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “escravo nascido na casa”.'
    reason: ἐξ οἴκου pode designar um escravo ligado à casa; em contexto de condição servil, também pode ser entendido como alguém nascido na casa. A nota preserva essa possibilidade sem restringir o texto principal.
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: Quando eu ia com os ismaelitas
  rationale: Expressa naturalmente a ação em curso do particípio grego no contexto da viagem com os ismaelitas.
- source_word: ἐπηρώτων με
  choice: eles me perguntavam insistentemente
  rationale: O imperfeito indica ação repetida ou continuada; “insistentemente” comunica essa força sem tornar a frase artificial.
- source_word: δοῦλος
  choice: escravo
  rationale: Mantém o sentido direto do termo grego, em vez do mais brando “servo”.
- source_word: δοῦλος ... ἐξ οἴκου
  choice: escravo nascido em casa
  rationale: A expressão provavelmente designa um escravo pertencente à casa desde o nascimento; uma nota preserva a possibilidade mais ampla de “escravo da casa”.
- source_word: ἵνα μὴ αἰσχύνω
  choice: para não envergonhar
  rationale: Reproduz com clareza a finalidade declarada e o sentido causativo de expor alguém à vergonha.
theological_decisions:
- issue: A declaração de José sobre sua condição
  choice: Traduzir literalmente sua alegação de ser escravo, sem qualificá-la moralmente como mentira ou estratégia legítima.
  alternative: Explicitar que José fingiu ser escravo para proteger os irmãos.
  rationale: O texto informa a resposta e sua finalidade, mas não oferece aqui um juízo teológico ou moral explícito.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas naturais para leitores brasileiros. O tratamento “você” torna a pergunta direta corrente, enquanto “ismaelitas” e “escravo” preservam a precisão histórica e lexical.
