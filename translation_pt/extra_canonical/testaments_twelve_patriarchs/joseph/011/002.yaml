review_pass:
  verdict: revise
  source_fidelity: A tradução transmite corretamente a viagem com os ismaelitas, a pergunta sobre a condição servil, a resposta de José e sua finalidade de não expor os irmãos à vergonha. Contudo, «nascido em casa» restringe ἐξ οἴκου a uma origem natal que a expressão grega, tomada por si só, não exige; o sentido mais seguro no texto é vínculo com a casa/doméstico.
  naturalness: O texto é claro e moderno. «Enquanto eu viajava com os ismaelitas» e «me perguntavam repetidamente» exprimem o aspecto durativo/reiterativo sem acrescentar a conotação mais forte de pressão em «insistentemente».
  terminology: «Escravo» traduz adequadamente δοῦλος. «Escravo da casa» preserva a formulação doméstica de ἐξ οἴκου sem decidir no texto principal entre escravo doméstico e escravo nascido na casa. «Ismaelitas» está correto.
  issues:
  - severity: medium
    issue: «Escravo nascido em casa» é excessivamente específico para ἐξ οἴκου.
    rationale: A expressão pode indicar alguém da casa ou ligado ao âmbito doméstico; embora possa incluir a noção de nascimento na casa em certos usos e interpretações, o grego citado não a torna inequívoca. A possibilidade deve ficar em nota, não ser imposta no texto.
  - severity: low
    issue: «Insistentemente» intensifica a pergunta além do que o imperfeito ἐπηρώτων exige.
    rationale: O imperfeito sustenta perguntas repetidas ou continuadas, mas não determina que fossem insistentes no sentido de pressão.
  revised_text: 'Enquanto eu viajava com os ismaelitas, eles me perguntavam repetidamente: “Você é escravo?” E eu disse que era escravo da casa,[a] para não envergonhar meus irmãos.'
