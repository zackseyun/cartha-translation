base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/001.yaml
  text: And so, my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.
translation:
  language: pt
  text: Portanto, vocês também, meus filhos, mantenham o temor de Deus diante de seus olhos em todas as suas ações e honrem seus irmãos; pois todo aquele que pratica a lei do Senhor será amado por ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: Portanto, vocês também
  rationale: Preserva tanto a conclusão expressa por οὖν como a ênfase inclusiva de καὶ ὑμεῖς, em português natural.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Equivalente direto e digno para a exortação paterna.
- source_word: ἐν πάσῃ πράξει ὑμῶν
  choice: em tudo o que fizerem
  rationale: Comunica de modo natural a abrangência de 'em toda ação de vocês', sem alterar o sentido.
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: diante dos olhos
  rationale: Mantém a imagem concreta do grego e é idiomático em português.
- source_word: τὸν τοῦ θεοῦ φόβον
  choice: o temor de Deus
  rationale: Conserva o termo teológico tradicional e sua amplitude sem reduzi-lo apenas a medo ou reverência.
- source_word: τιμᾶτε
  choice: honrem
  rationale: Representa diretamente o imperativo de tratar com honra.
- source_word: τοὺς ἀδελφοὺς ὑμῶν
  choice: seus irmãos
  rationale: Preserva o vínculo fraterno expresso no texto, sem especificar se é biológico ou comunitário.
- source_word: ποιῶν νόμον Κυρίου
  choice: pratica a lei do Senhor
  rationale: O verbo 'praticar' expressa cumprir ou pôr em ação a lei, evitando a formulação pouco natural 'fazer a lei'.
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  choice: será amado por ele
  rationale: Mantém a voz passiva, o futuro e o referente pronominal do original, sem explicitação interpretativa.
theological_decisions:
- issue: Sentido de 'temor de Deus'
  choice: temor de Deus
  alternative: medo de Deus / reverência a Deus
  rationale: A expressão preserva a tensão semântica do grego φόβος, que pode abranger medo, respeito reverente e orientação piedosa.
- issue: Relação entre praticar a lei e ser amado
  choice: pois todo aquele que pratica a lei do Senhor será amado por ele
  alternative: pois o Senhor amará todo aquele que obedece à sua lei
  rationale: A redação conserva a relação causal, a voz passiva e o futuro do texto, sem harmonização doutrinária nem reformulação do amor divino.
- issue: Referente de 'ele'
  choice: ele
  alternative: o Senhor / Deus
  rationale: Preserva a forma pronominal do original e sua referência contextual, sem substituir o pronome por uma identificação explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e compreensão internacional. A construção imperativa foi tornada natural sem perder as imagens e relações do grego.
