base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/001.yaml
  text: And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust, because you punish as a wrongdoer a free man who has been kidnapped.”
translation:
  language: pt
  text: 'E Mênfis me viu sendo espancado pelas janelas — pois a casa dela ficava perto — e mandou dizer a ele: “A sua sentença é injusta, pois você castiga como se fosse um malfeitor um homem livre que foi sequestrado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  choice: Mênfis
  rationale: Transliteração portuguesa corrente do nome próprio grego.
- source_word: τυπτόμενόν με
  choice: me viu sendo espancado
  rationale: Expressa naturalmente a ação passiva e continuada de bater com violência.
- source_word: ἀπέστειλε πρὸς αὐτόν
  choice: mandou dizer a ele
  rationale: O contexto indica o envio de uma mensagem, sem especificar o mensageiro.
- source_word: κρίσις
  choice: sentença
  rationale: No contexto judicial, refere-se à decisão ou julgamento proferido.
- source_word: τὸν κλαπέντα
  choice: um homem [...] que foi sequestrado
  rationale: Embora o particípio derive de 'roubar', aplicado a uma pessoa indica que ela foi levada à força ou raptada; 'sequestrado' é português natural e preserva o sentido passivo.
- source_word: τιμωρεῖς
  choice: você castiga
  rationale: Traduz diretamente a ideia de impor punição.
- source_word: ὡς ἀδικήσαντα
  choice: como malfeitor
  rationale: Forma concisa e natural de indicar alguém tratado como quem praticou injustiça ou delito.
