- from: 'E Mênfis me viu sendo espancado pelas janelas — pois a casa dela ficava perto — e mandou dizer a ele: “A sua sentença é injusta, pois você castiga como malfeitor um homem livre que foi sequestrado.”'
  to: 'E Mênfis me viu sendo espancado pelas janelas — pois a casa dela ficava perto — e mandou dizer a ele: “A sua sentença é injusta, pois você castiga como se fosse um malfeitor um homem livre que foi sequestrado.”'
  rationale: 'A única alteração torna explícita, em português moderno, a relação semântica de “como malfeitor”: o homem livre sequestrado é punido como se tivesse cometido um delito. Não há alteração de sentido, nem é necessária nota textual com base nos dados fornecidos.'
