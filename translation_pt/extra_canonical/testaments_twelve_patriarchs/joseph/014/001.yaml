    issue: Ambiguidade sintática em “você castiga como malfeitor um homem livre”.
    rationale: A locução pode modificar “castiga” em vez de indicar que o homem é punido sob a acusação de ser malfeitor. O grego ὡς ἀδικήσαντα qualifica o homem como alguém tratado por praticante de injustiça.
