base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/003.yaml
  text: And the woman kept saying to her husband, “Why do you keep this captive and noble boy in chains, when he ought rather to be set free and waited upon?”
translation:
  language: pt
  text: 'E a mulher dizia repetidamente ao marido: “Por que você mantém acorrentado este jovem cativo e de origem nobre, quando ele deveria, em vez disso, estar livre e ser servido?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγε
  choice: dizia repetidamente
  rationale: O imperfeito indica ação reiterada ou contínua; a formulação torna essa nuance clara em português natural.
- source_word: παῖδα
  choice: jovem
  rationale: No contexto, refere-se a José como rapaz ou jovem, não necessariamente a uma criança; “jovem” evita especificidade indevida.
- source_word: εὐγενῆ
  choice: de origem nobre
  rationale: Expressa com clareza o sentido de boa linhagem ou nascimento nobre, sem sugerir apenas nobreza moral.
- source_word: ἐν δεσμοῖς
  choice: acorrentado
  rationale: Representa idiomaticamente a condição de estar em grilhões ou sob cadeias.
- source_word: ἄνετον εἶναι
  choice: estar livre
  rationale: Comunica o contraste direto com a condição de preso, preservando o sentido de estar solto ou sem restrição.
- source_word: ὑπηρετεῖσθαι
  choice: ser servido
  rationale: Mantém a voz passiva e o sentido de receber serviço ou assistência de outros.
