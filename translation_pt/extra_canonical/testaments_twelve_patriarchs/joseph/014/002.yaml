base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/002.yaml
  text: But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come.
translation:
  language: pt
  text: Mas, como eu não mudei meu depoimento, mesmo enquanto era espancado, ele ordenou que eu ficasse sob custódia até que chegassem os senhores do rapaz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: não mudei meu depoimento
  rationale: No contexto de acusação e interrogatório, λόγος designa o relato ou declaração de José; “depoimento” comunica naturalmente esse sentido jurídico sem sugerir apenas uma frase isolada.
- source_word: τυπτόμενος
  choice: enquanto era espancado
  rationale: O particípio presente passivo indica ação simultânea e repetida ou continuada; “era espancado” preserva a força física do verbo.
- source_word: φυλαχθῆναί με
  choice: que eu ficasse sob custódia
  rationale: A construção passiva exprime ser mantido vigiado ou detido; “sob custódia” é claro e adequado ao contexto.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: os senhores do rapaz
  rationale: Mantém o plural κύριοι e a relação de autoridade ou posse expressa pelo genitivo, sem decidir além do texto a condição exata do rapaz.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com formulação natural para um contexto de depoimento, violência e detenção. Conserva o plural “senhores” e não acrescenta identificação ou interpretação ausente do grego.
