lexical_decisions:
- source_word: δοῦλος
  choice: escravo
  rationale: Traduz diretamente a condição jurídica e social expressa pelo grego, sem atenuá-la como ‘servo’.
- source_word: ἐγένου
  choice: se tornou
  rationale: Reproduz de modo natural o sentido de mudança de condição presente no aoristo médio de γίνομαι.
- source_word: ἐκ γῆς Χαναὰν
  choice: da terra de Canaã
  rationale: Mantém a expressão de origem geográfica e sua possível nuance de procedência, sem reformulá-la como local exato da compra.
- source_word: ἐπριάσαντό με
  choice: me compraram
  rationale: Verte o aoristo médio de πρίαμαι com a expressão portuguesa direta e idiomática.
