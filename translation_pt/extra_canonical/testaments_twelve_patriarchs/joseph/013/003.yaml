  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/003.yaml
  text: And Pentephris said to him, “From where, then, is this Hebrew boy?” And he said, “The Ishmaelites entrusted him to me until they return.”
translation:
  language: pt
  text: 'E Pentephris lhe perguntou: “De onde é, então, esse jovem hebreu?” Ele respondeu: “Os ismaelitas o confiaram a mim até que voltem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παῖς
  choice: jovem
  rationale: O termo pode designar menino, jovem ou servo conforme o contexto. Aqui, a pergunta sobre a origem de José favorece uma tradução etária neutra, sem acrescentar explicitamente a condição de escravo.
- source_word: παρέθεντό μοι
  choice: o confiaram a mim
  rationale: Reproduz a ideia de entregar alguém aos cuidados de outra pessoa, sem tornar a expressão mais técnica do que o grego.
- source_word: ἕως ὅτου ἐπιστρέψωσιν
  choice: até que voltem
  rationale: Expressa naturalmente a ação futura dos ismaelitas e preserva o sentido temporal.
- source_word: Πεντεφρής
  choice: Pentephris
  rationale: Transliteração tradicional próxima da forma grega presente nesta edição.
