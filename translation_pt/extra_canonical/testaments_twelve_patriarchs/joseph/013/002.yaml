  text: But the broker fell at his feet and begged, saying, “I beg you, lord, I do not know what you are saying.”
translation:
  language: pt
  text: 'Mas o intermediário caiu aos pés dele e suplicou, dizendo: “Eu lhe suplico, senhor, não sei o que você está dizendo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: intermediário
  rationale: No contexto, designa alguém que atua como intermediário ou agente de uma transação; “intermediário” é claro e natural em português sem restringir indevidamente a função.
- source_word: πεσὼν εἰς τοὺς πόδας αὐτοῦ
  choice: caiu aos pés dele
  rationale: Reproduz de modo idiomático o gesto de submissão expresso pelo grego.
- source_word: ἐδέετο λέγων / Δέομαί σου
  choice: 'suplicou, dizendo: “Eu lhe suplico”'
  rationale: Preserva a repetição enfática entre o verbo narrativo e a fala direta.
- source_word: κύριε
  choice: senhor
  rationale: Forma respeitosa de tratamento, em minúscula, pois o referente aqui é humano.
- source_word: οὐκ οἶδα ὃ λέγεις
  choice: não sei do que você está falando
  rationale: Expressão portuguesa natural que comunica fielmente o sentido da construção grega.
