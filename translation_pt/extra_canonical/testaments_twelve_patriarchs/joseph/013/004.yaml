source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὁ δὲ οὐκ²⁷ ἐπίστευσεν αὐτῷ²⁸, ἀλλ’ ἐκέλευσεν γυμνὸν τύπτεσθαι²⁹. Ἐπιμένοντος δὲ αὐτοῦ *τούτοις τοῖς λόγοις³⁰, λέγει³¹ *ὁ Πεντεφρής³²· Ἐναχθήτω³³ οὖν³⁴ ὁ νεανίσκος.'
