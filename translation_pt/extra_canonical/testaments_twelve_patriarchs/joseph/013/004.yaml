base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/004.yaml
  text: But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”
translation:
  language: pt
  text: 'Mas ele não acreditou nele; pelo contrário, mandou que o espancassem nu. E, como ele persistia nessas palavras, Pentephres disse: “Então tragam o jovem.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίστευσεν αὐτῷ
  choice: acreditou nele
  rationale: Expressa naturalmente em português a recusa em dar crédito ao que ele dizia, preservando o complemento pessoal do grego.
- source_word: γυμνὸν τύπτεσθαι
  choice: que o espancassem nu
  rationale: Mantém tanto a nudez quanto a violência reiterada sugerida por τύπτεσθαι, em formulação portuguesa direta.
- source_word: Ἐπιμένοντος ... αὐτοῦ τούτοις τοῖς λόγοις
  choice: como ele persistia nessas palavras
  rationale: Conserva a construção circunstancial e a referência ao conteúdo verbal, sem explicar além do que o grego afirma.
- source_word: Ἐναχθήτω
  choice: tragam
  rationale: Imperativo idiomático que comunica a ordem de fazer o jovem comparecer; a voz passiva grega seria pouco natural se reproduzida literalmente.
- source_word: ὁ νεανίσκος
  choice: o jovem
  rationale: Equivalente atual e digno para νεανίσκος, sem especificar uma idade que o texto não define.
- source_word: ὁ Πεντεφρής
  choice: Pentephres
  rationale: Transliteração portuguesa próxima da forma grega apresentada, sem substituir automaticamente pelo nome bíblico Potifar.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural e sem explicitações interpretativas. A oposição marcada por ἀλλά foi vertida por “pelo contrário”; οὖν, por “então”.
