review_pass:
  verdict: revise
  source_fidelity: 'A tradução comunica adequadamente a acusação de tirar seres humanos da terra de Canaã e vendê-los para a escravidão. Contudo, “como escravas” introduz uma restrição feminina que o grego não estabelece: ψυχάς é feminino gramatical, mas παῖδας pode designar pessoas escravizadas de modo genérico. “Mandou chamar” é possível, mas “ordenou que ... viesse” reflete mais diretamente o infinitivo ἐλθεῖν (“vir”).'
  naturalness: O português é moderno, claro e apropriado ao registro narrativo. A formulação revista preserva essa fluidez e torna mais natural a relação entre a ordem e a chegada do negociante.
  terminology: “Pentephris”, “negociante”, “pessoas” e “revende” são escolhas defensáveis. “Para a escravidão” evita marcar indevidamente o sexo das vítimas e expressa naturalmente εἰς παῖδας no contexto de tráfico humano.
  issues:
  - severity: medium
    issue: “como escravas” especifica vítimas do sexo feminino.
    rationale: O texto grego não identifica o sexo das pessoas roubadas. A concordância feminina decorre de “pessoas”, mas pode ser entendida como uma afirmação semântica de que eram mulheres. “Para a escravidão” mantém o sentido sem essa especificação.
  - severity: low
    issue: “mandou chamar” é menos direto que ἐκέλευσεν ... ἐλθεῖν.
    rationale: A expressão portuguesa é idiomática, mas pode sugerir que alguém o trouxesse. “Ordenou que o negociante viesse” preserva de modo mais próximo a ordem para que ele viesse.
  revised_text: 'Mas Pentephris, convencido pelas palavras dela, ordenou que o negociante viesse e lhe disse: “Que é isso que ouço a seu respeito, que você rouba pessoas da terra de Canaã e as revende para a escravidão?”'
  revised_footnotes: []
