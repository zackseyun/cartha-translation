  text: But Pentephris, persuaded by her words, ordered the broker to come, and said to him, “What is this that I hear concerning you, that you steal souls from the land of Canaan and sell them as slaves?”
translation:
  language: pt
  text: 'Mas Pentephris, convencido pelas palavras dela, ordenou que o negociante viesse e lhe disse: “Que é isso que ouço a seu respeito, que você rouba pessoas da terra de Canaã e as revende para a escravidão?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρὶς
  choice: Pentephris
  rationale: Transliteração do nome próprio grego, mantendo a forma atestada nesta obra.
- source_word: μετάβολον
  choice: negociante
  rationale: O termo designa aqui um intermediário comercial; “negociante” é natural em português e se ajusta ao contexto da revenda de pessoas.
- source_word: ψυχὰς
  choice: pessoas
  rationale: Embora o sentido literal seja “almas”, neste contexto o termo grego se refere a seres humanos; “pessoas” comunica esse sentido sem sugerir que apenas almas incorpóreas foram roubadas.
- source_word: μεταπωλεῖς
  choice: as revende
  rationale: Expressa a ideia de vender posteriormente ou vender adiante, preservando o valor comercial do verbo composto sem acrescentar um advérbio desnecessário.
- source_word: εἰς παῖδας
  choice: como escravas
  rationale: παῖδας pode indicar servos ou escravos; o contexto de tráfico e revenda favorece “como escravas”, com concordância com “pessoas”.
