  text: And after separating me from him, he said to me, “Are you a slave or free?” And I said, “A slave.”
translation:
  language: pt
  text: 'E, depois de me separar dele, disse-me: “Você é escravo ou livre?” Eu disse: “Escravo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρίσας
  choice: depois de me separar
  rationale: Reproduz o particípio aoristo com uma construção temporal natural em português, preservando a ideia de afastar José da outra pessoa.
- source_word: Δοῦλος
  choice: escravo
  rationale: Traduz diretamente o termo grego para uma pessoa em condição de escravidão; “servo” enfraqueceria o contraste jurídico e social com “livre”.
- source_word: ἐλεύθερος
  choice: livre
  rationale: Mantém o contraste explícito entre escravidão e liberdade presente no grego.
- source_word: λέγει ... εἶπον
  choice: perguntou-me ... respondi
  rationale: O conteúdo interrogativo e a resposta tornam estes verbos contextualmente naturais em português, sem alterar o sentido do diálogo.
