  text: In all these things I, lying on the ground, kept begging God that he would rescue me from her deceit.
translation:
  language: pt
  text: Em meio a tudo isso, eu, deitado no chão, suplicava continuamente a Deus que me livrasse do engano dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τούτοις πᾶσιν
  choice: Em meio a tudo isso
  rationale: Expressa naturalmente a circunstância abrangente indicada pelo grego, sem reduzir a frase a uma sequência temporal.
- source_word: χαμοκοιτῶν
  choice: deitado no chão
  rationale: Reproduz de modo claro o sentido concreto de estar deitado ou dormir rente ao chão.
- source_word: ἐδεόμην
  choice: suplicava continuamente
  rationale: O imperfeito indica uma súplica persistente ou reiterada; o verbo «suplicar» preserva a intensidade do pedido.
- source_word: ῥύσεταί με
  choice: me livrasse
  rationale: Transmite o pedido de resgate ou libertação em português natural, no contexto da oração introduzida por ὅπως.
- source_word: τῆς δολιότητος αὐτῆς
  choice: do engano dela
  rationale: Mantém tanto a ideia de dolo ou ardil quanto a referência feminina explícita, sem especificar além do grego.
