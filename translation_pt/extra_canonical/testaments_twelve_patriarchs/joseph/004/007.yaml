  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/007.yaml
  text: And she says to me, “If you want me to leave the idols, my kinsman, I will persuade my husband to withdraw from the idols, and we will walk before your Lord.”
translation:
  language: pt
  text: 'E ela me diz: “Se queres que eu abandone os ídolos, parente meu, eu também convencerei meu marido a afastar-se dos ídolos, e andaremos diante do teu Senhor.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego apresenta dificuldades de transmissão nas expressões traduzidas por “parente meu” e “diante do teu Senhor”.
    reason: A forma συγγενοῦς e o sinal crítico junto de ἐνώπιον Κυρίου σου indicam incerteza textual que não deve ser ocultada.
lexical_decisions:
- source_word: καταλείψω τὰ εἴδωλα
  choice: abandone os ídolos
  rationale: Expressa de modo natural a ideia de deixar para trás ou renunciar aos ídolos, sem acrescentar uma conversão já consumada.
- source_word: συγγενοῦς μου
  choice: parente meu
  rationale: O texto parece empregar uma forma problemática, mas o sentido contextual mais provável é um tratamento dirigido a José como parente; a tradução conserva esse tratamento sem especificar o grau de parentesco.
- source_word: κἀγὼ πείθω
  choice: eu também convencerei
  rationale: Preserva o valor aditivo de κἀγώ e traduz o presente com sentido prospectivo adequado à condição iniciada por “Se queres”.
- source_word: ἀποστῆναι ἀπὸ τῶν εἰδώλων
  choice: a afastar-se dos ídolos
  rationale: Mantém a noção de separação ou abandono expressa por ἀφίστημι com ἀπό.
- source_word: πορευσόμεθα ἐνώπιον Κυρίου σου
  choice: andaremos diante do teu Senhor
  rationale: Reproduz a imagem bíblica de conduzir a vida diante de Deus e mantém “teu Senhor”, sem substituir o referente por uma formulação confessional mais explícita.
theological_decisions:
- issue: Sentido de “andar diante do teu Senhor”
  choice: andaremos diante do teu Senhor
  alternative: iremos à presença do teu Senhor
  rationale: A formulação escolhida preserva a possível dimensão ética e religiosa da expressão, sem introduzir a referência à “lei do Senhor”, ausente do texto grego fornecido.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “tu” para refletir as formas gregas de segunda pessoa do singular. A repetição de “ídolos” foi mantida por corresponder ao original.
