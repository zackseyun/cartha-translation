source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ πρὸς αὐτὴν ἔλεγον³⁸ *ὅτι οὐχ³⁹ ἐν ἀκαθαρσίᾳ θέλει⁴⁰ Κύριος τοὺς σεβομένους αὐτόν, οὔτε⁴¹ *τοῖς μοιχεύουσιν εὐδοκεῖ⁴², ⌈ἀλλὰ τοῖς ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις αὐτῷ προσερχομένοις⁴³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/008.yaml
  text: But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”
translation:
  language: pt
  text: 'Mas eu lhe dizia: “O Senhor não quer que os que o reverenciam vivam em impureza, nem se agrada dos adúlteros, mas daqueles que se aproximam dele com o coração puro e os lábios sem mancha.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: dizia
  rationale: O imperfeito indica ação passada continuada ou repetida; “dizia” preserva esse aspecto sem tornar a frase artificial.
- source_word: ἐν ἀκαθαρσίᾳ
  choice: vivam em impureza
  rationale: A expressão com ἐν indica estado ou modo de vida; o acréscimo natural de “vivam” explicita em português o sentido exigido pela construção.
- source_word: τοὺς σεβομένους αὐτόν
  choice: os que o reverenciam
  rationale: “Reverenciam” comunica respeito religioso e devoção sem restringir o verbo a uma formulação denominacional.
- source_word: εὐδοκεῖ
  choice: se agrada
  rationale: Equivalente idiomático que preserva a ideia de aprovação ou prazer favorável.
- source_word: προσερχομένοις
  choice: daqueles que se aproximam dele
  rationale: Mantém a imagem cultual e relacional de achegar-se ao Senhor, sem explicá-la além do texto.
- source_word: στόμασιν ἀμίαντοις
  choice: os lábios sem mancha
  rationale: “Lábios” é uma metonímia natural em português para στόματα neste paralelismo moral; “sem mancha” conserva a ideia de não contaminação.
theological_decisions:
- issue: Objeto do agrado divino na construção οὔτε... ἀλλὰ...
  choice: “nem se agrada dos adúlteros, mas daqueles...”
  alternative: “nem aprova os que adulteram, mas os que...”
  rationale: A tradução mantém o contraste explícito entre pessoas caracterizadas pelo adultério e pessoas que se aproximam de Deus em pureza, sem reduzir εὐδοκεῖ a mera aprovação intelectual.
- issue: Relação entre pureza interior e expressão exterior
  choice: “com o coração puro e os lábios sem mancha”
  alternative: “com coração limpo e boca incontaminada”
  rationale: Preserva os dois elementos coordenados do grego — coração e boca/lábios — e a tensão entre pureza interior e exterior, sem fundi-los numa noção genérica de sinceridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A ordem e o contraste do grego foram preservados, enquanto construções pouco naturais foram ajustadas de modo mínimo.
