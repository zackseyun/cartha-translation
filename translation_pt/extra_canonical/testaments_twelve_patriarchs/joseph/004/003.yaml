source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις οὖν¹ *ὡς ἁγίῳ ἀνδρὶ ἐν λόγοις² ἐκολάκευέ³ με⁴ καὶ⁵ μετὰ δόλου διὰ⁶ ῥημάτων ἐπαίνει⁷ *τὴν σωφροσύνην⁸ μου ἐνώπιον τοῦ ἀνδρὸς αὐτῆς⁹, βουλομένη *κατὰ μόνας¹⁰ ὑποσκελίσαι με.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/003.yaml
  text: So then, many times, as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.
translation:
  language: pt
  text: Assim, muitas vezes, ela me lisonjeava com palavras, como se eu fosse um homem santo; e, com engano, elogiava o meu domínio próprio diante do marido dela, querendo fazer-me tropeçar quando estivéssemos a sós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκολάκευέ
  choice: lisonjeava
  rationale: Expressa diretamente a bajulação interessada e repetida indicada pelo imperfeito grego.
- source_word: σωφροσύνην
  choice: domínio próprio
  rationale: Neste contexto de resistência à sedução, comunica a ideia de autocontrole e castidade sem restringir o termo a uma formulação denominacional.
- source_word: ὑποσκελίσαι
  choice: fazer-me tropeçar
  rationale: Preserva a imagem metafórica de derrubar ou levar à queda, adequada à intenção de fazê-lo ceder.
- source_word: κατὰ μόνας
  choice: quando estivéssemos a sós
  rationale: Formulação natural em português que conserva a circunstância de isolamento pretendida pela mulher.
theological_decisions:
- issue: Sentido moral de σωφροσύνη
  choice: domínio próprio
  alternative: castidade
  rationale: O contexto inclui pureza sexual, mas o termo grego é mais amplo; a tradução mantém essa amplitude.
- issue: Força metafórica de ὑποσκελίσαι
  choice: fazer-me tropeçar
  alternative: fazer-me cair
  rationale: A opção escolhida conserva a metáfora sem determinar de modo excessivo se a queda seria moral, sexual ou estratégica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. O valor iterativo de πολλάκις e dos imperfeitos foi preservado por “muitas vezes” e pelo pretérito imperfeito. A construção “como se eu fosse um homem santo” explicita de modo natural o valor comparativo de ὡς ἁγίῳ ἀνδρί sem afirmar necessariamente que essa era a avaliação sincera da mulher.
