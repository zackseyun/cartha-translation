  text: '*᾿Εδόξαζε ⌜γάρ⌝¹¹ με ὡς σώφρονα *φανερῶς, καὶ ἐν κρυφῇ¹² ἔλεγέ μοι· Μὴ φοβηθῇς τὸν ἄνδρα μου· καὶ γὰρ πέπεισται¹⁴ περὶ τῆς σωφροσύνης σου¹⁵· ὅτι κἂν *τις αὐτῷ εἴπῃ¹⁶ περὶ ἡμῶν, *οὐ πιστεύσει¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/004.yaml
  text: For she openly extolled me as self-controlled, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded about your purity, and even if someone should tell him about us, he will not believe it.”
translation:
  language: pt
  text: 'Pois ela me elogiava publicamente como um homem casto, mas em segredo me dizia: “Não tenha medo do meu marido, pois ele está convencido da sua castidade. Mesmo que alguém lhe fale sobre nós, ele não acreditará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρονα / σωφροσύνης
  choice: casto / castidade
  rationale: No contexto de assédio sexual e fidelidade moral, os termos indicam domínio próprio especificamente expresso como castidade. A repetição da mesma raiz em português preserva a ligação lexical do grego.
- source_word: ἐδόξαζε
  choice: elogiava
  rationale: Aqui o verbo significa exaltar ou falar bem de alguém; “elogiava” comunica isso de modo natural sem sugerir que ela prestava culto a José.
- source_word: φανερῶς / ἐν κρυφῇ
  choice: publicamente / em segredo
  rationale: Mantém o contraste explícito entre a conduta pública e a fala privada da mulher.
- source_word: πέπεισται
  choice: está convencido
  rationale: 'Reproduz o estado resultante expresso pelo perfeito grego: o marido passou a confiar na castidade de José e continua convencido disso.'
- source_word: περὶ ἡμῶν
  choice: sobre nós
  rationale: Preserva a formulação deliberadamente ampla do grego, sem explicitar uma relação ou acusação que o texto não nomeia.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com tratamento por “você” implícito nas formas “tenha”, “seu” e “sua”, de leitura natural no Brasil. A tradução mantém o contraste moral e a insinuação ambígua de “sobre nós” sem acrescentar interpretação denominacional.
