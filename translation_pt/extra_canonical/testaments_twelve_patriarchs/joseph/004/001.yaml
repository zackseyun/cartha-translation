source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ νοήσας ἐγὼ⁵⁵ ἐλυπήθην ἕως θανάτου⁵⁶· *ἐξελθούσης δὲ⁵⁷ αὐτῆς ἦλθον εἰς ἐμαυτόν, καὶ ἐπένθησα⁵⁸ περὶ αὐτῆς⁵⁹ ἡμέρας πολλάς, *ὅτι ἔγνων τὸν δόλον αὐτῆς καὶ τὴν πλάνην⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/001.yaml
  text: And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I knew her deceit and her delusion.
translation:
  language: pt
  text: E, quando compreendi, fiquei triste até a morte. Mas, depois que ela saiu, voltei a mim e lamentei por ela durante muitos dias, porque percebi seu engano e sua ilusão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: quando compreendi
  rationale: Expressa a percepção ou compreensão alcançada por José, preservando a relação temporal do particípio.
- source_word: ἐλυπήθην ἕως θανάτου
  choice: fiquei triste até a morte
  rationale: Mantém a formulação intensa e semitizante do grego, sem enfraquecê-la para uma paráfrase psicológica.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: voltei a mim
  rationale: Equivalente idiomático natural que conserva a ideia de recobrar-se ou recuperar o domínio de si.
- source_word: ἐπένθησα περὶ αὐτῆς
  choice: lamentei por ela
  rationale: Preserva tanto o sentido de pesar de ἐπένθησα quanto a referência pessoal introduzida por περὶ αὐτῆς.
- source_word: τὸν δόλον αὐτῆς
  choice: seu engano
  rationale: δόλος indica dolo, ardil ou engano; 'engano' é claro e mantém aberta a nuance entre ato enganoso e intenção fraudulenta.
- source_word: τὴν πλάνην
  choice: sua ilusão
  rationale: πλάνη pode indicar erro, extravio ou ilusão; 'ilusão' preserva a distinção em relação a δόλος sem determinar indevidamente se ela enganava ou estava enganada.
theological_decisions:
- issue: Natureza da πλάνη da mulher
  choice: sua ilusão
  alternative: seu erro / sua sedução
  rationale: A expressão grega admite mais de uma nuance. 'Ilusão' conserva a ambiguidade entre estado de engano e comportamento que desvia, evitando impor uma leitura moral ou doutrinária mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do grego. Conservou-se 'até a morte' por sua força retórica e 'voltei a mim' como expressão corrente. Não foram necessárias notas de rodapé.
