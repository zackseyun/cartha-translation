  source_fidelity: 'A tradução reproduz adequadamente a progressão do grego e seus elementos principais: a compreensão de José, a aflição extrema, a saída da mulher, o retorno a si e o lamento prolongado. Contudo, «conhecia» tende a apresentar conhecimento durativo prévio, enquanto o aoristo ἔγνων, neste contexto causal e narrativo, indica a percepção ou descoberta então alcançada.'
  naturalness: O português é moderno, claro e de registro apropriado. «Voltei a mim» é um equivalente idiomático feliz para ἦλθον εἰς ἐμαυτόν, e «até a morte» preserva a intensidade da formulação semitizante. A troca de «conhecia» por «percebi» torna a frase final mais natural no encadeamento narrativo.
  terminology: «Engano» traduz bem δόλος e mantém sua abrangência entre ardil e fraude. «Ilusão» é uma opção defensável para πλάνη e preserva a distinção em relação a δόλος, sem especificar se se trata de erro, autoengano ou ação desviadora. Não há questão teológica nem nomes próprios neste versículo.
