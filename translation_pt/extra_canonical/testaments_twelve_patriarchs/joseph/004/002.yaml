  text: Καὶ ἔλεγον *πρὸς αὐτὴν⁶¹ ῥήματα ὑψίστου, εἰ ἄρα ἐπιστρέψει⁶² ἀπὸ τῆς ἐπιθυμίας⁶³ τῆς πονηρᾶς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/002.yaml
  text: And I would speak to her words of the Most High, whether perhaps she might turn back from the evil desire.
translation:
  language: pt
  text: E eu lhe falava palavras do Altíssimo[a], na esperança de que talvez ela se afastasse do desejo perverso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: E eles lhe falavam palavras do Altíssimo. O grego ἔλεγον pode ser 1ª pessoa do singular («eu falava») ou 3ª pessoa do plural («eles falavam»).'
    reason: Preserva a ambiguidade morfológica de ἔλεγον, enquanto o texto principal segue a leitura singular, coerente com o contexto autobiográfico.
lexical_decisions:
- source_word: ῥήματα ὑψίστου
  choice: palavras do Altíssimo
  rationale: Mantém o plural ῥήματα e o título divino ὕψιστος de modo direto, digno e natural em português.
- source_word: ἐπιστρέψει ἀπὸ
  choice: se afastasse de
  rationale: No contexto, expressa a ideia de voltar atrás e abandonar uma inclinação, sem sugerir necessariamente uma conversão em sentido técnico.
- source_word: ἐπιθυμίας τῆς πονηρᾶς
  choice: desejo perverso
  rationale: Traduz a qualificação moral de πονηρός com clareza e preserva o artigo grego sem acrescentar o possessivo «seu».
- source_word: εἰ ἄρα
  choice: para ver se talvez
  rationale: Reproduz a expectativa incerta da construção grega em português corrente; «para ver» explicita naturalmente a função contextual da fala sem eliminar o valor de possibilidade de ἄρα.
theological_decisions:
- issue: Identidade do sujeito de ἔλεγον
  choice: eu lhe falava
  alternative: eles lhe falavam
  rationale: A forma ἔλεγον pode ser primeira pessoa do singular ou terceira do plural. O discurso autobiográfico de José favorece a primeira pessoa, mas a ambiguidade morfológica genuína é registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O imperfeito «falava» representa a ação continuada ou repetida; evitou-se linguagem confessional técnica e preservou-se em nota a ambiguidade do sujeito verbal.
