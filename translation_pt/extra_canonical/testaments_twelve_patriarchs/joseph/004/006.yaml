  text: Since she accomplished nothing in this, she again began to come to me with words of instruction, wanting to learn the word of God.
translation:
  language: pt
  text: Como não conseguiu nada com isso, ela novamente começou a vir até mim com palavras de instrução, querendo aprender a palavra de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν ἴσχυσεν ἐν τούτῳ
  choice: não conseguiu nada com isso
  rationale: Expressa de modo natural o fracasso da tentativa anterior, preservando a referência anafórica de ἐν τούτῳ sem acrescentar “desse modo”.
- source_word: λόγῳ κατηχήσεως
  choice: com palavras de instrução
  rationale: κατήχησις aqui indica instrução ou ensino; o plural idiomático em português comunica naturalmente o λόγῳ instrumental.
- source_word: ἤρχετο πρὸς με
  choice: começou a vir até mim
  rationale: Mantém tanto o aspecto incoativo de ἤρχετο quanto o movimento em direção ao narrador expresso por πρὸς με.
- source_word: μαθεῖν λόγον Θεοῦ
  choice: aprender a palavra de Deus
  rationale: Tradução direta e inteligível, sem determinar além do texto se ela desejava sinceramente aprender ou apenas usava isso como pretexto.
theological_decisions:
- issue: Intenção da mulher ao querer aprender a palavra de Deus
  choice: querendo aprender
  alternative: sob o pretexto de aprender
  rationale: O grego expressa propósito, mas não explicita nesta frase que se tratava de pretexto; a tradução preserva essa tensão narrativa sem inserir uma avaliação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível a leitores brasileiros e amplamente compreensível no espaço lusófono. Conserva a repetição narrativa de “novamente começou” por corresponder a πάλιν ἔτι ... ἤρχετο.
