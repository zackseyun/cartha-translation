  text: But she kept contending, wanting to fulfill her desire.
translation:
  language: pt
  text: Mas ela continuava insistindo, querendo satisfazer o seu desejo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “realizar o seu desejo”.'
    reason: Preserva a possibilidade de traduzir πληρῶσαι de modo mais literal como “cumprir” ou “realizar”.
lexical_decisions:
- source_word: ἀντεφιλονείκει
  choice: continuava insistindo
  rationale: O imperfeito indica ação persistente ou reiterada; “insistindo” comunica naturalmente a ideia de contender ou persistir em oposição, sem tornar a frase desnecessariamente técnica.
- source_word: πληρῶσαι
  choice: satisfazer
  rationale: No contexto de ἐπιθυμία, expressa com naturalidade a ideia de levar o desejo à realização.
- source_word: ἐπιθυμίαν
  choice: desejo
  rationale: Mantém o sentido amplo do grego e evita explicitar como sexual aquilo que o contexto já pode indicar.
