base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/010.yaml
  text: And I added fasting and prayer, so that the Lord might rescue me from her.
translation:
  language: pt
  text: E eu acrescentava jejum e oração, para que o Senhor me livrasse dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσετιθέμην
  choice: acrescentei
  rationale: Expressa de modo natural a ideia de adicionar jejum e oração às práticas já adotadas, preservando o aspecto continuado possível do imperfeito sem tornar a frase pesada.
- source_word: νηστείαν καὶ προσευχήν
  choice: jejum e oração
  rationale: Equivalentes diretos, correntes e dignos em português.
- source_word: ῥύσεταί με
  choice: me livrasse
  rationale: Transmite a ideia de resgate ou libertação diante de uma ameaça; o subjuntivo se ajusta naturalmente à oração final introduzida por «para que».
- source_word: ἀπ᾽ αὐτῆς
  choice: dela
  rationale: Mantém a referência feminina explícita do grego sem acrescentar identificação ausente neste versículo.
theological_decisions:
- issue: Relação entre as práticas de José e a libertação divina
  choice: Preservar a formulação final «para que o Senhor me livrasse dela»
  alternative: Reformular como garantia causal de que jejum e oração produziriam a libertação
  rationale: O grego apresenta propósito ou esperança, não uma afirmação doutrinária de mérito ou causalidade automática.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A coordenação inicial «E eu» conserva a continuidade narrativa e a ênfase do pronome grego.
