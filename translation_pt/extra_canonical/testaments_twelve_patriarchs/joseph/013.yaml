  text: '1. But Pentephris, persuaded by her words, ordered the broker to be brought, and said to him, “What is this that I hear concerning you—that you steal souls from the land of Canaan and sell them again as slaves?”


    2. But the broker fell at his feet and begged him, saying, “I beg you, lord, I do not know what you are saying.”


    3. And Pentephris fell upon him and said to him, “From where, then, is this Hebrew slave before me?” And he said, “The Ishmaelites entrusted him to me until they return.”


    4. But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”


    5. And when I was brought in, I bowed down to Pentephris, for he was, he said, third in rank among Pharaoh’s rulers.


    6. And after separating me from him, he said to me, “Are you a slave or free?” And I said, “A slave.”


    7. And he said, “Whose?” And I said, “The Ishmaelites’.”


    8. But he said, “How did you become their slave?” And I said, “They bought me from the land of Canaan.”


    9. But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked...'
translation:
  language: pt
  text: '**Testamento de José 13**


    **1.** Pentefris, convencido pelas palavras dela, mandou trazer o negociante e lhe disse: “O que é isso que ouço a seu respeito? Você sequestra pessoas da terra de Canaã e as revende para a escravidão?”


    **2.** O negociante caiu aos pés dele e suplicou: “Eu lhe peço, senhor, não sei do que o senhor está falando.”


    **3.** Pentefris lhe disse: “Então, de onde veio este jovem hebreu?” Ele respondeu: “Os ismaelitas o confiaram a mim até que voltem.”


    **4.** Pentefris, porém, não acreditou nele, mas mandou que o despissem e o espancassem. Como o homem insistia nessas palavras, Pentefris disse: “Tragam, então, o rapaz.”


    **5.** Quando fui levado à presença dele, prostrei-me diante de Pentefris, pois ele era o terceiro em dignidade entre os governantes do faraó.


    **6.** Depois de me separar do negociante, ele me perguntou: “Você é escravo ou livre?” Respondi: “Escravo.”


    **7.** Ele perguntou: “De quem?” Respondi: “Dos ismaelitas.”


    **8.** Então ele perguntou: “Como você se tornou escravo deles?” Respondi: “Eles me compraram na terra de Canaã.”


    **9.** Ele, porém, me disse: “Você certamente está mentindo.” E imediatamente mandou que também me despissem e me espancassem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: negociante
  rationale: No contexto, designa o intermediário que recebe José dos ismaelitas e o negocia; “negociante” é natural e evita a conotação financeira moderna de “corretor”.
- source_word: κλέπτεις ψυχὰς
  choice: sequestra pessoas
  rationale: O idiomatismo significa roubar seres humanos; “sequestra pessoas” comunica a acusação de tráfico humano, enquanto “roubar almas” seria enganoso em português.
- source_word: εἰς παῖδας μεταπωλεῖς
  choice: as revende como escravas
  rationale: μεταπωλεῖς expressa revenda, e εἰς παῖδας indica a condição servil resultante. O feminino concorda com “pessoas”, sem restringir o sexo das vítimas.
- source_word: παῖς ὁ Ἑβραῖος
  choice: este jovem hebreu
  rationale: παῖς pode significar menino, jovem, servo ou escravo. Como a pergunta posterior investiga se José é escravo ou livre, “jovem” evita decidir antecipadamente essa questão.
- source_word: γυμνὸν τύπτεσθαι
  choice: que o despissem e o espancassem
  rationale: γυμνόν indica que a vítima fica nua, e τύπτεσθαι que é golpeada; a formulação portuguesa explicita naturalmente ambos os elementos.
- source_word: προσεκύνησα
  choice: prostrei-me diante de
  rationale: Expressa o gesto corporal de reverência prestado a uma autoridade humana, sem importar necessariamente culto religioso.
- source_word: ἐν ἀξιώματι
  choice: em autoridade
  rationale: Refere-se à posição ou dignidade oficial de Pentefris na hierarquia do faraó.
- source_word: Ὄντως ψεύδῃ
  choice: Você está mesmo mentindo
  rationale: ὄντως intensifica a acusação; “mesmo” soa natural no diálogo e preserva a força sem sugerir uma conclusão teológica.
theological_decisions:
- issue: Sentido de ψυχαί na acusação de tráfico humano
  choice: pessoas
  alternative: almas
  rationale: Aqui ψυχαί se refere concretamente a seres humanos capturados e vendidos, não à parte imaterial da pessoa.
- issue: Prostração de José diante de Pentefris
  choice: gesto de reverência diante de uma autoridade
  alternative: adoração
  rationale: O objeto é um oficial egípcio e o contexto é uma audiência judicial; o verbo descreve aqui submissão ou homenagem social, não necessariamente culto.
- issue: Condição de José em 13.3
  choice: jovem hebreu
  alternative: escravo hebreu
  rationale: O grego παῖς é ambíguo e a sequência ainda apura se ele é escravo ou livre. Traduzir desde já por “escravo” resolveria antecipadamente a tensão narrativa.
translation_notes:
  register: 'Português contemporâneo, digno e amplamente compreensível, com construções naturais para leitores brasileiros. Mantém-se o nome grego “Pentefris” em vez de harmonizá-lo silenciosamente com “Potifar”. A tradução segue o texto grego fornecido: em 13.3, λέγει é traduzido como “disse”, não como “caiu sobre”; em 13.5, não se acrescenta “ele disse”, ausente do grego. Em 13.9, τύπτεσθαι é incluído como “espancassem”, evitando encerrar a frase apenas em “despissem”.'
