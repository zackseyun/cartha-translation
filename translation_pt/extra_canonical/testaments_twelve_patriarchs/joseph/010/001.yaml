  text: Ὁρᾶτε οὖν, τέκνα μου, πόσα κατεργάζεται¹ ἡ² ὑπομονὴ καὶ ἡ³ προσευχὴ μετὰ νηστείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/001.yaml
  text: See, then, my children, how much endurance and prayer with fasting accomplish.
translation:
  language: pt
  text: Vejam, portanto, meus filhos, quanto realizam a perseverança e a oração acompanhada de jejum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Vejam
  rationale: Imperativo plural direto e natural em português contemporâneo; neste contexto, convida os filhos a reconhecerem a lição apresentada.
- source_word: τέκνα μου
  choice: meus filhos
  rationale: Reproduz de modo natural a forma afetiva de tratamento paterno.
- source_word: πόσα κατεργάζεται
  choice: quanto realizam
  rationale: Expressa a grande eficácia ou os muitos resultados produzidos; o verbo no singular pode concordar com os elementos coordenados entendidos conjuntamente, mas o português pede naturalmente o plural.
- source_word: ἡ ὑπομονὴ
  choice: a perseverança
  rationale: No contexto de provações, designa constância paciente e firme, mais claramente comunicada por “perseverança” do que apenas por “paciência”.
- source_word: ἡ προσευχὴ μετὰ νηστείας
  choice: a oração acompanhada de jejum
  rationale: Mantém a oração como núcleo e o jejum como prática associada, conforme μετὰ νηστείας.
theological_decisions:
- issue: Relação entre perseverança, oração e jejum
  choice: A perseverança e a oração acompanhada de jejum são apresentadas conjuntamente como agentes eficazes.
  alternative: Associar o jejum tanto à perseverança quanto à oração, ou tratar somente a oração com jejum como uma unidade separada.
  rationale: A sintaxe grega coordena ἡ ὑπομονὴ e ἡ προσευχὴ, enquanto μετὰ νηστείας se liga mais naturalmente à oração; a tradução preserva essa estrutura sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Vejam” evita o tom arcaico de “vede”; “portanto” mantém a conexão inferencial de οὖν.
