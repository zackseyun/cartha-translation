id: T12P.JOS.10.3
reference: Testament of Joseph 10:3
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅπου δὲ κατοικεῖ ὁ ὕψιστος¹⁰, κἂν *φθόνος τις περιπέσῃ, κἂν δουλία, κἂν συκοφαντία¹¹, *ὁ Κύριος κατοικῶν ἐπ᾽ αὐτὸν¹² διὰ τὴν σωφροσύνην οὐ μόνον⁷ ἐκ τῶν κακῶν ῥύεται¹³ αὐτόν¹⁴, ⸀ἀλλὰ καὶ ὑψοῖ¹⁵ καὶ δοξάζει αὐτὸν ὡς κἀμέ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/003.yaml
  text: But where the Most High dwells, even if envy should fall upon someone, or slavery, or slander, the Lord who dwells with him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.
translation:
  language: pt
  text: Mas, onde habita o Altíssimo, ainda que alguém seja atingido por inveja, escravidão ou calúnia, o Senhor, que habita com ele[a], por causa de seu domínio próprio[b], não só o livra dos males, mas também o exalta e o glorifica, como fez comigo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nele”. O grego diz literalmente “sobre ele”; a construção também pode expressar que o Senhor está com ele.'
    reason: Preserva a ambiguidade de κατοικῶν ἐπ᾽ αὐτόν, enquanto a tradução principal emprega uma formulação idiomática em português.
  - marker: b
    text: No contexto de José, “domínio próprio” pode incluir especialmente pureza sexual ou castidade.
    reason: Indica a relevância contextual de σωφροσύνη sem reduzir seu sentido a uma única dimensão moral.
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: o Altíssimo
  rationale: Mantém o título divino tradicional e corresponde diretamente ao grego.
- source_word: περιπέσῃ
  choice: sobrevenham
  rationale: Expressa de modo natural a ideia de circunstâncias adversas que recaem sobre alguém.
- source_word: δουλία
  choice: escravidão
  rationale: Preserva o sentido forte de condição servil, pertinente à experiência de José.
- source_word: συκοφαντία
  choice: calúnia
  rationale: Representa a acusação falsa e maliciosa indicada pelo termo no contexto.
- source_word: σωφροσύνη
  choice: domínio próprio
  rationale: Mantém a amplitude ética do termo — autocontrole, sensatez e pureza sexual — sem limitá-lo silenciosamente apenas à castidade.
- source_word: ῥύεται
  choice: livra
  rationale: Verbo português corrente e digno para resgate ou libertação do perigo.
- source_word: ὑψοῖ ... δοξάζει
  choice: exalta ... glorifica
  rationale: Preserva o paralelismo e a força teológica dos dois verbos gregos.
theological_decisions:
- issue: Relação entre a presença do Senhor e a pessoa fiel em κατοικῶν ἐπ᾽ αὐτόν
  choice: que habita sobre ele
  alternative: que habita nele / com ele
  rationale: A tradução principal conserva a preposição grega ἐπί e não identifica sem explicação essa formulação com habitação interior ou simples companhia; a nota registra as possibilidades idiomáticas.
- issue: Sentido moral de σωφροσύνη no exemplo de José
  choice: domínio próprio
  alternative: castidade / pureza
  rationale: O contexto de José favorece fortemente a dimensão sexual, mas o substantivo grego tem campo semântico mais amplo; a redação mantém essa tensão e a nota esclarece a aplicação contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no mundo lusófono. A ordem retórica e o contraste do grego foram mantidos, evitando linguagem denominacional.
