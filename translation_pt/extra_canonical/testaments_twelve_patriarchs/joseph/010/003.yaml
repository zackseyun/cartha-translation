    issue: Formulação literal pouco idiomática de κατοικῶν ἐπ᾽ αὐτόν
    rationale: “Habita sobre ele” não é uma expressão natural em português para a presença protetora ou acompanhante do Senhor e pode sugerir localização física. “Habita com ele” é uma tradução principal natural; a nota preserva o dado formal e as alternativas interpretativas.
  - severity: low
    issue: Construção redundante “sobre alguém sobrevenham”
    rationale: A repetição de “sobre” é gramatical, mas estilisticamente áspera. “Se alguém for atingido por” transmite naturalmente a ideia de adversidades que recaem sobre uma pessoa.
