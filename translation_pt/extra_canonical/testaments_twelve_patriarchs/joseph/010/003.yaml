review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente o contraste de δέ, a lista de adversidades, a relação causal com σωφροσύνη e o duplo resultado de ῥύεται / ὑψοῖ / δοξάζει. Contudo, “habita sobre ele” é uma reprodução excessivamente literal de ἐπ᾽ αὐτόν e soa pouco idiomática em português; uma formulação principal natural, acompanhada de nota que registre a expressão grega e suas possibilidades, comunica melhor o sentido sem eliminar a ambiguidade.
  naturalness: “Sobre alguém sobrevenham” e, sobretudo, “que habita sobre ele” tornam a frase pesada e pouco natural. “Se alguém for atingido por” e “habita com ele” mantêm registro digno e claro para leitores lusófonos, inclusive brasileiros.
  terminology: “Altíssimo”, “escravidão”, “calúnia”, “domínio próprio”, “livra”, “exalta” e “glorifica” são escolhas adequadas. A nota sobre domínio próprio deve apresentar a relevância de pureza sexual como possibilidade contextual, sem estreitar indevidamente o sentido de σωφροσύνη.
  issues:
