source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὕτως καὶ ὑμεῖς⁴, ⌜ἐὰν τὴν σωφροσύνην καὶ τὴν ἁγνείαν μεταδιώκητε⁵ ἐν ὑπομονῇ καὶ *προσευχῇ μετὰ νηστείας ἐν ταπεινώσει⁶ καρδίας, ὁ⁷ Κύριος κατοικήσει⁸ ἐν ὑμῖν, ὅτι ἀγαπᾷ⁹ τὴν σωφροσύνην.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/002.yaml
  text: So you also, if you pursue self-control and purity with endurance and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.
translation:
  language: pt
  text: Assim também vocês, se buscarem o domínio próprio e a pureza com perseverança e oração acompanhada de jejum, em humildade de coração, o Senhor habitará em vocês, porque ele ama o domínio próprio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: domínio próprio
  rationale: No contexto de exortação à castidade e à disciplina interior, «domínio próprio» comunica de modo natural o controle moral dos desejos, sem limitar o termo apenas à prudência ou à sobriedade.
- source_word: ἁγνείαν
  choice: pureza
  rationale: Preserva o sentido de pureza moral e sexual do termo, com linguagem clara e digna.
- source_word: μεταδιώκητε
  choice: buscarem
  rationale: Expressa a ideia de empenhar-se em alcançar ou seguir algo; «buscarem» é corrente em português e mantém a força exortativa sem exagerá-la.
- source_word: ὑπομονῇ
  choice: perseverança
  rationale: Neste contexto, indica constância paciente na prática das virtudes, mais bem comunicada por «perseverança» do que por mera espera passiva.
- source_word: κατοικήσει ἐν ὑμῖν
  choice: habitará em vocês
  rationale: Traduz diretamente a imagem de residência divina e preserva a possível dimensão individual ou coletiva do plural grego.
theological_decisions:
- issue: Sentido de ἐν ὑμῖν
  choice: em vocês
  alternative: entre vocês
  rationale: A preposição ἐν favorece «em», e a expressão pode referir-se ao interior dos destinatários coletivamente sem excluir a dimensão comunitária; não se resolveu a ambiguidade por uma formulação exclusivamente espacial.
- issue: Relação entre práticas humanas e habitação do Senhor
  choice: se buscarem... o Senhor habitará
  alternative: ao buscarem... o Senhor habitará
  rationale: Mantém-se a construção condicional explícita do grego, sem acrescentar explicação doutrinária sobre mérito, causa ou graça.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sequência «com perseverança, oração e jejum» evita uma construção pesada, embora o grego possa associar mais estreitamente oração e jejum. O tom permanece exortativo e digno.
