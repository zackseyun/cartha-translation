  terminology: «Domínio próprio» para σωφροσύνη e «pureza» para ἁγνεία são escolhas adequadas neste contexto exortativo. «Habitará em vocês» preserva corretamente ἐν ὑμῖν e sua abertura entre leitura pessoal e coletiva.
