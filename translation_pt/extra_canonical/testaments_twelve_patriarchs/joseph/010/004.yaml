  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/004.yaml
  text: For it comes upon all people either in deed or in word or in mind.
translation:
  language: pt
  text: Pois isso sobrevém a todas as pessoas, seja em ação, seja em palavra, seja em pensamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo grego transmitido é de sentido ou construção incertos neste trecho; literalmente, costuma significar “reúne-se” ou “encontra-se”.
    reason: O sinal crítico da edição e a construção anômala justificam informar o leitor sobre a genuína incerteza textual e semântica.
lexical_decisions:
- source_word: Πάντας ... ἀνθρώπους
  choice: a todas as pessoas
  rationale: Reproduz o acusativo plural inclusivo sem restringir o sentido a homens do sexo masculino.
- source_word: ἐν ἔργῳ ... ἐν λόγῳ ... ἐν διανοίᾳ
  choice: em ação ... em palavra ... em pensamento
  rationale: Mantém os três âmbitos paralelos da conduta humana em linguagem portuguesa clara e natural.
- source_word: συνέρχεται
  choice: sobrevém
  rationale: Embora a forma transmitida normalmente signifique algo como “reúne-se” ou “encontra-se”, sua construção com o acusativo “todas as pessoas” é anômala. “Sobrevém” segue o sentido contextual adotado pela camada inglesa auditada sem disfarçar a dificuldade textual, registrada em nota.
theological_decisions:
- issue: Sujeito implícito do verbo
  choice: isso
  alternative: ele/ela, com referente explicitado
  rationale: O fragmento grego não nomeia aqui o sujeito. “Isso” conserva a referência implícita e evita identificar indevidamente o agente ou conceito mencionado no contexto anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo retórico preservado. “Em ação”, “em palavra” e “em pensamento” oferecem leitura natural no português brasileiro e permanecem acessíveis internacionalmente.
