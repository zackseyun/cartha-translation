base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/005.yaml
  text: My brothers knew how my father loved me, yet I was not exalted in my mind; though I was a child, I had the fear of God in my heart, for I knew that surely all things will pass away.
translation:
  language: pt
  text: Meus irmãos sabem como meu pai me amava, mas eu não me exaltava em meus pensamentos. Embora ainda fosse criança, eu tinha o temor de Deus no coração, pois sabia que tudo passará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσιν
  choice: sabem
  rationale: O presente grego pede naturalmente o presente em português, ainda que o testemunho relembre acontecimentos passados.
- source_word: ὑψούμην ἐν τῇ διανοίᾳ μου
  choice: eu não me exaltava em meus pensamentos
  rationale: Preserva a imagem de elevar-se interiormente e o valor mental de διάνοια, sem reduzir a expressão apenas a orgulho genérico.
- source_word: νήπιος
  choice: criança
  rationale: No contexto, indica pouca idade, não imaturidade moral.
- source_word: φόβον τοῦ θεοῦ
  choice: temor de Deus
  rationale: Expressão bíblica consagrada que preserva reverência e responsabilidade diante de Deus, sem reduzi-la a mero medo.
- source_word: πάντα παρελεύσεται
  choice: tudo passaria
  rationale: Comunica de modo natural, no discurso retrospectivo português, que todas as coisas são transitórias; πάντα permanece abrangente.
theological_decisions:
- issue: Sentido do temor de Deus
  choice: temor de Deus
  alternative: medo de Deus
  rationale: A formulação mantém a amplitude teológica da expressão grega, que pode incluir reverência, obediência e receio do juízo, sem impor uma interpretação estreita.
- issue: Abrangência de πάντα
  choice: tudo
  alternative: todas as coisas
  rationale: A forma concisa preserva a afirmação universal e sua tensão, sem especificar indevidamente quais realidades passarão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A divisão em duas frases evita um período excessivamente longo e mantém clara a progressão entre o amor paterno, a humildade e a consciência da transitoriedade.
