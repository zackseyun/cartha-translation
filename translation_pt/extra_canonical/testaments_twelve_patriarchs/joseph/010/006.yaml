base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/006.yaml
  text: And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent when I was being sold, not telling the Ishmaelites that I was a son of Jacob, a great and righteous man.
translation:
  language: pt
  text: E não me exaltei no mal[a]; pelo contrário, honrei meus irmãos e, por medo deles[b], fiquei calado enquanto era vendido, sem dizer aos ismaelitas que eu era filho de Jacó, um homem grande e justo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação grega desta expressão é textualmente incerta; literalmente, «não fui elevado no mal».
    reason: Os sinais críticos da edição indicam possível corrupção textual, e a expressão preservada é incomum.
  - marker: b
    text: 'Ou, conforme outra maneira de entender a construção grega: «por causa do medo deles».'
    reason: O genitivo pode indicar medo dos irmãos ou medo associado a eles; a tradução principal segue a leitura contextual mais provável.
lexical_decisions:
- source_word: οὐκ ἐπήρθην ἐν κακῷ
  choice: não me exaltei no mal
  rationale: Mantém a imagem de ser elevado ou ensoberbecido e a ligação incomum com «no mal», sem explicar além do que o texto grego permite.
- source_word: ἐτίμουν τοὺς ἀδελφούς μου
  choice: honrei meus irmãos
  rationale: Tradução direta e natural do imperfeito, que no contexto descreve a atitude contínua de José.
- source_word: διὰ τὸν φόβον αὐτῶν
  choice: por medo deles
  rationale: Preserva a construção do genitivo, entendida mais naturalmente como medo que José tinha dos irmãos, sem tornar explícito o que o grego deixa implícito.
- source_word: ἐσιώπουν πιπρασκόμενος
  choice: fiquei calado enquanto era vendido
  rationale: Expressa com clareza a simultaneidade do particípio passivo e evita uma repetição pouco natural em português.
- source_word: ἀνδρὸς μεγάλου καὶ δικαίου
  choice: homem grande e justo
  rationale: Verte μέγας por «grande» e δικαῖος por «justo», preservando tanto a estatura social de Jacó quanto sua qualidade moral.
theological_decisions:
- issue: A descrição de Jacó como δικαίου
  choice: justo
  alternative: reto
  rationale: «Justo» é a equivalência mais direta e mantém a linguagem moral e religiosa do original sem importar uma definição doutrinária específica.
- issue: Motivo do silêncio de José
  choice: por medo deles
  alternative: por causa do medo que eles sentiam
  rationale: O genitivo αὐτῶν pode admitir mais de uma relação, mas o contexto e a leitura de consulta favorecem que José temia os irmãos; a nota registra a ambiguidade gramatical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluente e vocabulário próximo do grego. «Ismaelitas» segue a forma bíblica corrente. As notas preservam a incerteza textual e a ambiguidade sintática sem sobrecarregar o corpo do versículo.
