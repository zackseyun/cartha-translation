  source_fidelity: A tradução acompanha de perto o grego fornecido. Mantém a fala de Mênfis, o pedido de compra, a ida do eunuco aos ismaelitas, a sondagem dos vendedores, as duas minas, os oitenta “ouros” e a declaração de cem. A oração final do v. 6 está completa no texto português e corresponde a ἵνα μὴ αἰσχυνθῇ ὁ εὐνοῦχος.
  naturalness: O português é moderno, claro e narrativo, com boa legibilidade ampla. As escolhas “sondá-los”, “preço muito alto”, “não poupe o ouro” e “fiquei calado” soam naturais sem se afastar do registro do texto.
  terminology: “Eunuco”, “senhora”, “minas” e “peças de ouro” preservam adequadamente os termos e relações do grego. A nota sobre a mina e a nota sobre a denominação monetária são pertinentes e estão corretamente ancoradas pelos marcadores [a] e [b].
