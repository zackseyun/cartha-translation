  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016.yaml
  text: 'But Memphis said to her husband[a], “I hear that they are selling the young man.”


    2 So she immediately sent a eunuch to the Ishmaelites, asking that I be sold to her.

    3 But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.

    4 Then she sent another eunuch, saying, “Even if they ask two minas, pay it. Do not spare the gold. Only buy the boy and bring him to me.”

    5 So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”

    6 But I, knowing it, kept silent[b][c], so that'
translation:
  language: pt
  text: '**Testamento de José 16**


    **1** Mênfis disse ao marido: “Compre esse jovem, pois ouvi dizer que estão vendendo-o.”


    **2** Imediatamente, ela enviou um eunuco aos ismaelitas, pedindo que me vendessem a ela.


    **3** Mas o eunuco, não querendo comprar-me, retirou-se depois de sondá-los e informou à sua senhora que eles estavam pedindo um preço muito alto pelo rapaz.


    **4** Então ela enviou outro eunuco, dizendo: “Ainda que peçam duas minas[a], pague. Não poupe o ouro. Apenas compre o rapaz e traga-o para mim.”


    **5** O eunuco foi, deu-lhes oitenta peças de ouro[b] e levou-me consigo. À egípcia, porém, disse: “Paguei cem.”


    **6** Eu sabia o que havia acontecido, mas fiquei calado, para que o eunuco não passasse vergonha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A mina era uma antiga unidade de peso e de valor monetário. O grego conserva o termo específico, sem indicar um equivalente moderno exato.
    reason: cultural_note
  - marker: b
    text: O grego diz literalmente “oitenta ouros” e depois “cem”; como a denominação exata não é especificada, a tradução usa “peças de ouro”.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεμφὶς
  choice: Mênfis
  rationale: Transliteração portuguesa natural do nome próprio feminino apresentado pelo testemunho grego; o contexto não o trata como referência à cidade.
- source_word: νεανίαν / παιδός / παῖδα
  choice: jovem / rapaz
  rationale: Mantém a juventude de José e reproduz de modo natural a alternância vocabular grega, sem infantilizá-lo indevidamente.
- source_word: εὐνοῦχος
  choice: eunuco
  rationale: Preserva o sentido explícito do termo grego, em vez de generalizá-lo como mero funcionário.
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: pedindo que me vendessem a ela
  rationale: Expressa com clareza o arranjo comercial indicado pela frase no contexto da venda de José.
- source_word: πειράσας αὐτούς
  choice: depois de sondá-los
  rationale: Aqui o verbo descreve a averiguação das condições impostas pelos vendedores, não tentação moral.
- source_word: δεσποίνῃ
  choice: sua senhora
  rationale: Comunica a autoridade doméstica da mulher sobre o eunuco em português corrente e digno.
- source_word: πολλὴν τιμὴν
  choice: um preço muito alto
  rationale: Equivalente idiomático do sentido comercial de τιμή neste contexto.
- source_word: μνᾶς
  choice: minas
  rationale: Conserva a antiga unidade de peso e valor sem impor uma conversão moderna especulativa.
- source_word: μὴ φείσασθε χρυσίου
  choice: Não poupe o ouro
  rationale: Preserva a força imperativa e a referência econômica concreta do grego.
- source_word: χρυσοῦς
  choice: peças de ouro
  rationale: Evita especificar uma denominação monetária que o testemunho normalizado não identifica.
- source_word: ἀνελάβετό με
  choice: levou-me consigo
  rationale: No contexto da compra, indica naturalmente que o eunuco tomou José sob sua custódia.
- source_word: ἐσιώπησα
  choice: fiquei calado
  rationale: Expressa a decisão consciente de José de nada dizer, em linguagem natural e sóbria.
- source_word: ἵνα μὴ αἰσχυνθῇ
  choice: para que ... não passasse vergonha
  rationale: Traduz o propósito declarado de evitar que o eunuco fosse envergonhado ou constrangido.
theological_decisions:
- issue: Linguagem relativa à condição de José em sua venda
  choice: Preservar diretamente a linguagem de compra, venda, preço e transferência de custódia
  alternative: Suavizar a passagem como contratação para serviço doméstico
  rationale: O grego descreve explicitamente uma transação humana. A tradução não ameniza a condição de José nem acrescenta uma interpretação confessional.
translation_notes:
  register: Português moderno de ampla compreensão, com legibilidade brasileira e tom narrativo digno. A tradução segue o trecho grego fornecido até o fim do versículo 6, inclusive a oração final de propósito, e mantém sem suavização a linguagem comercial da venda de José.
