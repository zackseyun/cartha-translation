base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018.yaml
  text: '1. If, then, you also walk in the commandments of the Lord, God will exalt you in good things forever.

    2. And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.

    3. For see, you yourselves know that through my humility and my long-suffering I took as my wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.

    4. Even so'
translation:
  language: pt
  text: '1. Portanto, se vocês também andarem nos mandamentos do Senhor, Deus os exaltará com bens para sempre.[a]


    2. E, se alguém quiser fazer-lhes mal, pratiquem o bem e orem por ele; e vocês serão libertos de todo mal pelo Senhor.


    3. Pois vejam: vocês sabem que, por meio da minha humildade e da minha paciência, tomei para mim como esposa a filha do sacerdote de Heliópolis. E, com ela, foram-me dados cem talentos de ouro, e o meu Senhor os submeteu a mim.[b]


    4. E também me deu uma beleza maior que a dos homens mais belos de Israel e me preservou até a velhice com força e beleza; pois eu era semelhante a Jacó em tudo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão grega também pode ser entendida como «entre os bons» ou «em coisas boas».
    reason: ἐν ἀγαθοῖς admite mais de uma análise, e o contexto não elimina completamente a ambiguidade.
  - marker: b
    text: O referente de «os» não é explicitado no trecho grego e não é claro. O pronome é masculino plural e, portanto, não se refere gramaticalmente ao «ouro», que é neutro singular.
    reason: O pronome αὐτούς não possui antecedente masculino plural expresso na frase preservada; identificá-lo exigiria acrescentar uma interpretação.
lexical_decisions:
- source_word: ἐν ἀγαθοῖς
  choice: em meio a coisas boas
  rationale: Mantém o sentido amplo do plural substantivado — bens, benefícios ou circunstâncias boas — sem reduzi-lo especificamente a riquezas ou bênçãos.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: retribuam com o bem
  rationale: Expressa em português corrente o contraste entre a intenção maligna do agressor e a prática do bem pelos destinatários.
- source_word: ταπείνωσιν
  choice: humildade
  rationale: Conserva o valor moral de ταπείνωσις neste contexto autobiográfico, sem optar por 'humilhação', que sugeriria sobretudo uma condição imposta.
- source_word: μακροθυμίαν
  choice: perseverança
  rationale: Comunica a resistência paciente e prolongada de José; 'longanimidade' seria mais formal e menos acessível.
- source_word: κατεδούλωσεν
  choice: submeteu
  rationale: Preserva a ideia forte de colocar sob domínio, evitando a formulação excessivamente literal 'escravizou', cujo objeto ou referente não está claro.
- source_word: ὡραιότητα
  choice: beleza
  rationale: Equivalente natural para a formosura física mencionada em paralelo com κάλλος.
theological_decisions:
- issue: Relação entre obediência e exaltação em 18.1
  choice: Manter a construção condicional direta
  alternative: Acrescentar linguagem explicativa sobre mérito, graça ou recompensa
  rationale: O grego liga o andar nos mandamentos à exaltação divina, mas não define um sistema teológico; a tradução não deve resolver essa tensão.
- issue: Agente do livramento em 18.2
  choice: O Senhor como agente explícito do livramento
  alternative: 'Voz passiva: ''vocês serão livrados pelo Senhor'''
  rationale: A formulação ativa é natural em português e preserva o conteúdo do agente expresso por ὑπὸ Κυρίου.
- issue: Domínio concedido a José em 18.3
  choice: Conservar o pronome com referente ambíguo
  alternative: Identificar explicitamente os egípcios, os talentos ou a família da esposa
  rationale: O antecedente de αὐτούς é incerto no texto disponível; especificá-lo importaria uma interpretação não demonstrada.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “vocês”. Preferiu-se sintaxe fluente sem apagar ambiguidades reais do grego. “Heliópolis” segue a forma portuguesa corrente do topônimo; “talentos” mantém a antiga unidade de peso e valor.
