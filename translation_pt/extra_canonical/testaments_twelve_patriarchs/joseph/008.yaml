- from: '**Testamento de José 7:6–8; 8:1–5**


    **7:6** E ela me disse: “Então está claro que você me ama. Que isto me baste: apenas tome a seu cargo a minha vida e a de meus filhos, e tenho esperança de também alcançar o que desejo.” **7** Ela, porém, não sabia que eu falava assim por causa do meu Senhor[a], e não por causa dela. **8** Pois, se alguém cai sob o domínio da paixão do desejo e se torna escravo dela, como também aconteceu com aquela mulher, ainda que ouça algo bom, interpreta isso segundo essa paixão, orientando-o para seu desejo perverso.


