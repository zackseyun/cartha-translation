  text: '6[a]. And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.” 7. But she did not know that I spoke thus because of my Lord, and not because of her. 8. For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he interprets it in terms of that passion, toward his evil desire[b].


    1. So I say, my children, that it was about the sixth hour when she left me. And bending my knee to the Lord all that day and all that night, toward dawn I rose, weeping and asking for deliverance from her. 2. At last, with evil intent, she seized my garments by force, dragging me violently toward intercourse. 3. Therefore, when I saw that in her frenzy she had hold of my tunic, I left it behind and fled naked. 4. But she, taking hold of it, slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me, he sent me into Pharaoh’s dungeon. 5. And while I was in chains[c], the Egyptian woman was constrained by grief.'
translation:
  language: pt
  text: '**Testamento de José 7:6–8; 8:1–5**


    **7:6** E ela me disse: “Veja, então: você me ama. Que isto me baste: apenas tome a seu cargo a minha vida e a de meus filhos, e tenho esperança de também alcançar o que desejo.” **7** Ela, porém, não sabia que eu falava assim por causa do meu Senhor[a], e não por causa dela. **8** Pois, se alguém cai sob o domínio da paixão do desejo e se torna escravo dela, como ela também se tornou, ainda que ouça algo bom, interpreta-o segundo essa paixão, voltando-o para seu desejo perverso.


    **8:1** Digo, portanto, meus filhos, que era por volta da hora sexta quando ela saiu de junto de mim. Então dobrei os joelhos diante do Senhor durante todo aquele dia e toda aquela noite. Ao amanhecer, levantei-me, chorando e pedindo que ele me livrasse dela. **2** Por fim, ela agarrou à força minhas roupas e me puxou violentamente para ter relações sexuais[b]. **3** Quando vi que, em seu frenesi, ela segurava minha túnica, deixei-a para trás e fugi nu[c]. **4** Ela, porém, ficou com a túnica e me acusou falsamente. Quando o marido dela chegou, lançou-me na prisão que havia em sua casa; no dia seguinte, depois de me açoitar, mandou-me para o cárcere do faraó. **5** Enquanto eu estava acorrentado, a egípcia ficou dominada pela tristeza. Ela vinha e escutava como eu dava graças ao Senhor e cantava louvores na casa das trevas; e como, com voz alegre, eu glorificava o meu Deus, porque, por meio desse pretexto, havia sido liberto da egípcia[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meu Senhor” provavelmente se refere a Deus, como sugere a oração ao Senhor em 8:1; gramaticalmente, porém, a expressão também poderia ser entendida como referência ao senhor terreno de José.
    reason: referential_ambiguity
  - marker: b
    text: 'Ou: “para a união sexual”. O termo grego é explícito e se refere a relações sexuais.'
    reason: lexical_alternative
  - marker: c
    text: 'Alguns testemunhos acrescentam: “e, desvencilhando-me”. A cena corresponde a Gênesis 39:12, em que José deixa sua roupa e foge da mulher de Potifar.'
    reason: textual_variant_and_cross_reference
  - marker: d
    text: 'Ou: “porque, por meio daquele pretexto, eu havia escapado da egípcia”. O termo grego pode designar um pretexto ou uma alegação; no contexto, refere-se à circunstância da falsa acusação que levou José a afastar-se dela.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: tome a seu cargo a minha vida e a de meus filhos
  rationale: O verbo expressa assumir como responsabilidade ou interesse próprio. A formulação preserva o apelo manipulador da mulher sem tornar a frase excessivamente técnica.
- source_word: προσδοκίαν ἀπολαῦσαι καὶ τῆς ἐπιθυμίας μου
  choice: tenho esperança de também alcançar o que desejo
  rationale: ἀπολαύω pode indicar obter ou desfrutar. No contexto, trata-se da expectativa de conseguir a satisfação de seu desejo sexual; a tradução é clara sem acrescentar detalhes.
- source_word: διὰ τὸν Κύριόν μου
  choice: por causa do meu Senhor
  rationale: Mantém a formulação causal e a ambiguidade possível do título, embora o contexto seguinte favoreça uma referência a Deus.
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας καὶ δουλωθῇ αὐτῷ
  choice: cai sob o domínio da paixão do desejo e se torna escravo dela
  rationale: Preserva tanto a imagem de sujeição em ὑποπίπτω quanto a linguagem explícita de escravidão em δουλόω.
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: interpreta isso segundo essa paixão, orientando-o para seu desejo perverso
  rationale: 'ἐκλαμβάνω descreve aqui uma compreensão distorcida: até uma palavra boa é interpretada pela ótica da paixão e direcionada ao desejo mau.'
- source_word: κλίνας γόνυ
  choice: dobrei os joelhos
  rationale: Expressa naturalmente em português o gesto corporal de oração, preservando o tom solene.
- source_word: λύτρωσιν ἐξ αὐτῆς
  choice: que ele me livrasse dela
  rationale: Neste contexto, λύτρωσις designa resgate prático da perseguição da mulher, não uma formulação técnica de expiação.
- source_word: μετὰ βίας ἐφελκομένη με εἰς συνουσίαν
  choice: me puxou violentamente para ter relações sexuais
  rationale: συνουσία é explícito para relação sexual; a tradução evita tanto o eufemismo obscuro quanto uma crueza desnecessária.
- source_word: μαινομένη
  choice: em seu frenesi
  rationale: O particípio retrata um estado de paixão descontrolada; “frenesi” comunica essa força sem diagnosticar insanidade.
- source_word: χίτων
  choice: túnica
  rationale: É a designação mais específica para a peça de roupa mencionada e mantém a ligação narrativa com Gênesis 39.
- source_word: ἐσυκοφάντησέ με
  choice: me acusou falsamente
  rationale: O verbo envolve denúncia maliciosa e falsa. A expressão torna explícito o elemento de falsidade, central à narrativa.
- source_word: οἴκῳ τοῦ σκότους
  choice: casa das trevas
  rationale: A tradução formal conserva a imagem sombria e poética aplicada à prisão.
- source_word: διὰ προφάσεως ἀπηλλάγην τῆς Αἰγυπτίας
  choice: por meio daquela acusação, havia sido liberto da egípcia
  rationale: πρόφασις pode indicar pretexto ou alegação. “Acusação” liga naturalmente a frase ao ato narrado no versículo anterior, enquanto a nota preserva a alternativa mais formal.
theological_decisions:
- issue: Referente de “meu Senhor” em 7:7
  choice: Manter “meu Senhor” no texto e indicar em nota que Deus é o referente provável
  alternative: Entender diretamente a expressão como referência a Potifar, senhor terreno de José
  rationale: A oração ao Senhor em 8:1 e o motivo religioso da resistência favorecem Deus, mas κύριος também pode designar o senhor humano de José. A tradução não elimina essa tensão.
- issue: Efeito moral da paixão em 7:8
  choice: Apresentar a paixão como poder escravizador que distorce a interpretação até do que é bom
  alternative: Limitar a afirmação ao simples mal-entendido daquela mulher
  rationale: A construção grega parte do caso da egípcia, mas o formula como máxima geral dirigida aos filhos de José.
- issue: Providência implícita na prisão em 8:5
  choice: Preservar a afirmação paradoxal de que a acusação se tornou o meio de José ser liberto da mulher
  alternative: Explicitar que Deus transformou diretamente o mal em bem
  rationale: O texto glorifica Deus, mas não formula uma explicação sistemática da providência. A tradução mantém a relação narrativa sem acrescentar uma conclusão doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O discurso testamentário conserva solenidade moderada, sem arcaísmos. A tradução segue todo o trecho grego fornecido, inclusive a parte final de 8:5 ausente na camada inglesa de consulta. As referências à mulher alternam entre pronome e “a egípcia” conforme o original; a linguagem sexual é direta, porém sóbria.
