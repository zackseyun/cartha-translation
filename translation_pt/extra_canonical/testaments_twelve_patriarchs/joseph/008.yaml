  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o grego e inclui corretamente a continuação de 8:5, ausente do trecho inglês de auditoria. Há, porém, duas pequenas imprecisões interpretativas: em 7:8, «como também aconteceu com aquela mulher» não expressa bem a comparação com alguém igualmente escravizada pela paixão; e, em 8:5, «daquela acusação» torna mais específico o grego πρόφασις («pretexto», «alegação»).'
  naturalness: O português é claro, moderno e adequado a leitores brasileiros e internacionais. Ajustei levemente 7:6 e 7:8 para tornar a progressão mais idiomática sem perder o registro solene.
  terminology: «Senhor», «escravo», «túnica», «cárcere» e «relações sexuais» são escolhas apropriadas. «Casa das trevas» preserva a imagem do original. A nota sobre «meu Senhor» mantém corretamente a ambiguidade referencial.
  issues:
  - severity: low
    issue: A comparação em 7:8 é imprecisa.
    rationale: O grego καὶ δουλωθῇ αὐτῷ ὡς κἀκείνη compara a pessoa em questão à mulher como alguém igualmente escravizada ao desejo, e não diz meramente que isso «aconteceu» com ela.
  - severity: low
    issue: «Daquela acusação» em 8:5 restringe πρόφασις.
    rationale: Embora o pretexto seja narrativamente a falsa acusação, πρόφασις é mais amplo. «Desse pretexto» preserva a formulação paradoxal sem fixar além do necessário o referente.
