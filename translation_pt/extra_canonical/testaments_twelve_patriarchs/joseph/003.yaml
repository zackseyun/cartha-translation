  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003.yaml
  text: '1[a]. In a short time she would withdraw, to test the purpose of my soul. In ten temptations she proved me approved, and in them all I was patient; for patience is a great remedy.


    2. How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments[b], she called me back, and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”


    3. But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.


    4. And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; for those who fast for God''s sake receive grace of face.


    5. And if my master was away, I drank no wine; and every third day I would take my food, and I would give it to the poor and the sick.


    6. And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.


    7. And because she had no male child[d][c], she pretended'
translation:
  language: pt
  text: '1. Em dez provações, ela demonstrou que eu era aprovado, e em todas elas tive paciência; pois a paciência é um grande remédio, e a perseverança concede muitos bens.


    2. Quantas vezes a egípcia me ameaçou de morte! Quantas vezes, depois de me entregar a castigos, tornou a chamar-me[a]! E, como eu não queria unir-me a ela, dizia-me: “Você terá domínio sobre mim e sobre todos os que estão em minha casa, se se entregar a mim, e será como nosso senhor”.


    3. Eu, porém, lembrava-me das palavras de meu pai e, entrando no quarto interior, chorava e orava ao Senhor.


    4. Durante aqueles sete anos, jejuei e parecia ao egípcio[b] viver no luxo, pois os que jejuam por Deus recebem graça no rosto.


    5. Quando meu senhor estava ausente, eu não bebia vinho; a cada três dias[c], recebia minha comida e a dava aos pobres e aos doentes.


    6. Eu madrugava para o Senhor e chorava por causa de Mênfis, a egípcia[d], porque ela me importunava muito e sem cessar; pois até de noite vinha ter comigo, sob o pretexto de uma visita.


    7. E, por não ter filho homem, ela fingia...[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns testemunhos acrescentam aqui uma repetição: “e me ameaçou”.'
    reason: textual_variant
  - marker: b
    text: “Ao egípcio” provavelmente se refere ao senhor egípcio de José, embora a expressão grega não o identifique explicitamente.
    reason: alternative_reading
  - marker: c
    text: O termo grego também pode ser entendido como “depois de um intervalo de três dias”; a referência exata do ciclo de jejum é incerta.
    reason: lexical_alternative
  - marker: d
    text: Mênfis é o nome dado à egípcia neste testemunho grego.
    reason: cultural_note
  - marker: e
    text: O texto fornecido termina neste ponto, deixando a frase incompleta.
    reason: source_boundary
lexical_decisions:
- source_word: δόκιμον ἀπέδειξέ με
  choice: demonstrou que eu era aprovado
  rationale: Preserva a relação entre ser submetido a provas e mostrar-se aprovado, sem transformar a expressão em mera vitória pessoal.
- source_word: μακροθυμία / ἐμακροθύμησα
  choice: paciência / fui paciente
  rationale: Comunica a perseverança paciente diante de provocação prolongada em português atual e digno.
- source_word: ὑπομονή
  choice: perseverança
  rationale: Distingue esta virtude de μακροθυμία e preserva a ideia de resistência firme sob provação.
- source_word: φάρμακον
  choice: remédio
  rationale: Mantém a metáfora terapêutica direta do grego.
- source_word: συνελθεῖν αὐτῇ
  choice: unir-me a ela
  rationale: Conserva o eufemismo sexual do original sem obscurecer completamente seu sentido.
- source_word: κυριεύσεις
  choice: terá domínio
  rationale: Expressa autoridade e controle no contexto da oferta manipuladora da mulher.
- source_word: ἐπιδῷς ἑαυτὸν
  choice: se se entregar a mim
  rationale: Representa a entrega sexual pretendida, em linguagem natural e não excessivamente explícita.
- source_word: ταμεῖον
  choice: quarto interior
  rationale: Indica um espaço privado da casa, apropriado ao contexto de choro e oração.
- source_word: ἐν τρυφῇ διάγων
  choice: alguém que vivia no luxo
  rationale: Preserva o contraste irônico entre o jejum de José e sua aparência exterior.
- source_word: τοῦ προσώπου τὴν χάριν
  choice: graça no rosto
  rationale: Mantém a imagem concreta e a formulação teológica do texto, sem reduzi-la apenas a beleza física.
- source_word: τριημερίζων
  choice: a cada três dias
  rationale: É uma leitura natural do padrão ascético indicado pelo verbo, com a alternativa registrada em nota.
- source_word: λόγῳ ἐπισκέψεως
  choice: sob o pretexto de fazer-me uma visita
  rationale: Expressa que a visita alegada servia de justificativa para sua entrada noturna.
theological_decisions:
- issue: Referência divina de Κύριος na oração
  choice: Senhor
  alternative: Soberano / Mestre
  rationale: No contexto da oração, o referente é Deus; “Senhor” é a forma portuguesa natural e tradicional, sem acrescentar especificação ausente.
- issue: Afirmação sobre jejum e aparência
  choice: os que jejuam por Deus recebem graça no rosto
  alternative: os que jejuam por causa de Deus recebem beleza no semblante
  rationale: Preserva a lógica teológica e a imagem física do grego sem explicar ou suavizar a afirmação ascética.
- issue: Distinção entre μακροθυμία e ὑπομονή
  choice: paciência ... perseverança
  alternative: longanimidade ... resistência
  rationale: A distinção lexical conserva duas virtudes próximas, mas não idênticas, de modo legível para o público moderno.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe narrativa conserva o tom testamentário sem arcaísmos excessivos. As ambiguidades sobre “o egípcio”, o ciclo de três dias e a frase final incompleta foram preservadas ou explicitadas em notas.
