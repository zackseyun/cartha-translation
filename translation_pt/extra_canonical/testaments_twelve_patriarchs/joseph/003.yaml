- from: '1. Em pouco tempo, ela se retirava para pôr à prova o propósito da minha alma. Em dez provações, demonstrou que eu era aprovado, e em todas elas fui paciente, pois a paciência é um grande remédio, e a perseverança concede muitos bens.


    2. Quantas vezes a egípcia me ameaçou de morte! Quantas vezes, depois de me entregar a castigos, tornou a chamar-me[a]! E, como eu não queria unir-me a ela, dizia-me: “Você terá domínio sobre mim e sobre todos os que estão em minha casa, se se entregar a mim, e será como nosso senhor”.


    3. Eu, porém, lembrava-me das palavras de meu pai e, entrando no quarto interior, chorava e orava ao Senhor.


    4. Durante aqueles sete anos, jejuei, mas parecia ao egípcio[b] alguém que vivia no luxo, pois os que jejuam por Deus recebem graça no rosto.


    5. Quando meu senhor estava ausente, eu não bebia vinho; a cada três dias[c], pegava minha comida e a dava aos pobres e aos doentes.


    6. Eu me levantava cedo para buscar o Senhor e chorava por causa de Mênfis, a egípcia[d], porque ela me importunava muito e sem cessar; pois até de noite entrava onde eu estava, sob o pretexto de fazer-me uma visita.


    7. E, por não ter filho homem, ela fingia...[e]


    [a] Alguns testemunhos acrescentam aqui uma repetição: “e me ameaçou”.


    [b] “Ao egípcio” provavelmente se refere ao senhor egípcio de José, embora a expressão grega não o identifique explicitamente.


    [c] O termo grego também pode ser entendido como “depois de um intervalo de três dias”; a referência exata do ciclo de jejum é incerta.


    [d] Mênfis é o nome dado à egípcia neste testemunho grego.


    [e] O texto fornecido termina neste ponto, deixando a frase incompleta.'
