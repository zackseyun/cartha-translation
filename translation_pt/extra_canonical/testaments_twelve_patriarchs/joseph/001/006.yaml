lexical_decisions:
- source_word: παρεκάλεσέ
  choice: me consolou
  rationale: Neste contexto de aflição, o verbo indica consolo e encorajamento; “consolou” é natural e preserva o sentido principal.
- source_word: ἐν ἀσθενείᾳ
  choice: estava fraco
  rationale: Expressa a condição de fraqueza em português corrente, sem especificar indevidamente doença física.
- source_word: ἐπεσκέψατό
  choice: veio cuidar de mim
  rationale: O verbo pode significar visitar com atenção e cuidado; esta formulação evita a leitura moderna de uma visita meramente social.
- source_word: ἐχαρίτωσέ
  choice: me concedeu favor
  rationale: Mantém a ideia de agraciar ou tratar favoravelmente, sem impor um sentido técnico posterior.
- source_word: ἐν δεσμοῖς ... ἔλυσέ με
  choice: estava acorrentado, e ele me libertou
  rationale: Traduz de modo natural a imagem concreta de estar em grilhões e ser solto, preservando também sua força libertadora.
theological_decisions:
- issue: Relação entre “Deus”, “Senhor” e “Salvador”
  choice: Preservar os três títulos distintos e o pronome “ele” na oração final
  alternative: Uniformizar os títulos ou explicitar a identidade do agente final
  rationale: O grego alterna deliberadamente os títulos e deixa o sujeito final implícito; a tradução não deve resolver além do texto sua relação teológica.
- issue: Sentido de ἐπεσκέψατό με
  choice: “veio cuidar de mim”
  alternative: “me visitou”
  rationale: A escolha comunica a visita providencial e atenta sugerida pelo verbo, sem reduzir a ação divina a uma visita comum.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo repetitivo preservado. “Salvador” permanece como título, e os colchetes refletem a incerteza textual da última oração.
