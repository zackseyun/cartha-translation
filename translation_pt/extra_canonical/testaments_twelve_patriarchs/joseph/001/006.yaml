  text: I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]
translation:
  language: pt
  text: Eu estava sozinho, e Deus me consolou. Eu estava fraco, e o Senhor me visitou. Eu estava na prisão, e o Salvador me favoreceu. [Eu estava acorrentado, e ele me libertou.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
