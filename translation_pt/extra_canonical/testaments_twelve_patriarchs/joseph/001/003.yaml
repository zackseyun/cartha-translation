    issue: A tradução de οὐκ ἐπλανήθην como 'não me desviei' não conserva a voz passiva do grego.
    rationale: πλανάω na forma passiva descreve primariamente alguém que não foi desencaminhado ou levado ao erro. Embora 'não me desviei' seja idiomático, ele pode sugerir uma decisão ou movimento autônomo e reduz a nuance passiva.
  revised_text: Em minha vida, vi a inveja e a morte, e não fui desencaminhado, mas permaneci na verdade do Senhor.
