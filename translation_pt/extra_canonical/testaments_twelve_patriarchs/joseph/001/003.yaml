  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/003.yaml
  text: In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.
translation:
  language: pt
  text: Em minha vida, vi a inveja e a morte, e não fui desencaminhado, mas permaneci na verdade do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: a inveja
  rationale: Equivalente direto e natural para o substantivo grego, preservando sua força moral.
- source_word: θάνατον
  choice: a morte
  rationale: Tradução formal do termo grego, sem explicar ou restringir seu possível sentido no contexto.
- source_word: οὐκ ἐπλανήθην
  choice: não me desviei
  rationale: A forma passiva pode expressar ser desencaminhado ou cair em erro; a construção pronominal portuguesa preserva essa amplitude com naturalidade.
- source_word: ἔμενα
  choice: permaneci
  rationale: Reproduz a ideia de continuar firme ou permanecer, em contraste com desviar-se.
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  choice: na verdade do Senhor
  rationale: Mantém de perto a construção grega e sua possível amplitude teológica, sem substituir 'verdade' por fidelidade, ensino ou caminho.
theological_decisions:
- issue: Sentido de 'a verdade do Senhor'
  choice: Preservar a expressão literalmente como 'a verdade do Senhor'.
  alternative: Explicitar como 'a fidelidade ao Senhor' ou 'o caminho verdadeiro do Senhor'.
  rationale: O grego não resolve se a expressão aponta sobretudo para a verdade pertencente ao Senhor, revelada por ele ou vivida diante dele; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. O ponto e vírgula torna explícito o contraste marcado por ἀλλά sem sobrecarregar a frase.
