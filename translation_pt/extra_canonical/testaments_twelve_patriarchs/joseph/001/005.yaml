  text: I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was confined by famine, and the Lord himself nourished me.
translation:
  language: pt
  text: Fui vendido como escravo, e o Senhor de todos me libertou. Fui levado para o cativeiro, e sua mão poderosa me ajudou. Fui oprimido pela fome, e o próprio Senhor me alimentou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθην εἰς δουλείαν
  choice: Fui vendido como escravo
  rationale: Expressa de modo natural em português tanto a venda quanto a condição de escravidão indicada por εἰς δουλείαν.
- source_word: ὁ πάντων δεσπότης
  choice: o Senhor de todos
  rationale: Preserva a ideia de autoridade soberana de δεσπότης e evita a conotação moderna inadequada de “déspota”.
- source_word: εἰς αἰχμαλωσίαν ἐλήφθην
  choice: Fui levado para o cativeiro
  rationale: Reproduz o movimento para uma condição de cativeiro sem especificar além do grego.
- source_word: ἡ κραταιὰ αὐτοῦ χείρ
  choice: sua mão poderosa
  rationale: Equivalente corrente e digno para a imagem bíblica de força e intervenção.
- source_word: ἐν λιμῷ συνεσχέθην
  choice: Fui acossado pela fome
  rationale: Συνέχω indica ser apertado, afligido ou dominado por algo; “acossado” conserva essa pressão sem sugerir literalmente encarceramento pela fome.
- source_word: διέθρεψέ με
  choice: me alimentou
  rationale: Verbo português claro que comunica sustentar mediante alimento; neste contexto, é mais natural que “nutriu”.
theological_decisions:
- issue: Título divino δεσπότης em contraste com κύριος
  choice: Traduzir ambos por “Senhor”, mantendo em δεσπότης o complemento “de todos”
  alternative: “Soberano de todos” para δεσπότης e “Senhor” para κύριος
  rationale: “Senhor de todos” é natural, preserva a soberania universal e mantém a repetição retórica de títulos divinos, sem introduzir linguagem denominacional.
- issue: Valor adversativo de καί nas duas primeiras linhas e conexão assindética na terceira
  choice: Usar “mas” nas três antíteses
  alternative: Usar “e” nas duas primeiras e apenas justapor a terceira
  rationale: O contraste entre aflição e livramento é estruturalmente claro; “mas” torna essa relação natural em português sem alterar o conteúdo teológico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo preservado nas três frases. Emprega “como escravo” por naturalidade brasileira e compreensão internacional; evita arcaísmos e tecnicismos.
