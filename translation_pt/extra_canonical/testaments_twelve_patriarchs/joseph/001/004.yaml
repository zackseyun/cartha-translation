  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/004.yaml
  text: My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers preserved me. They lowered me into a pit, and the Most High brought me up.
translation:
  language: pt
  text: Meus irmãos me odiaram, mas o Senhor me amou. Eles quiseram me matar, mas o Deus dos meus pais me guardou. Fizeram-me descer a uma cisterna, e o Altíssimo me fez subir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμίσησάν με
  choice: me odiaram
  rationale: Correspondência direta e natural ao verbo μισέω no aoristo.
- source_word: ἀνελεῖν
  choice: me matar
  rationale: No contexto, o infinitivo de ἀναιρέω expressa a intenção de tirar a vida; “matar” é claro e idiomático.
- source_word: ἐφύλαξέν με
  choice: me guardou
  rationale: Preserva o sentido de proteção de φυλάσσω em linguagem bíblica corrente, sem acrescentar circunstâncias não expressas.
- source_word: λάκκον
  choice: cisterna
  rationale: No relato de José, λάκκος designa a cavidade ou reservatório em que ele foi lançado; “cisterna” comunica o referente melhor que o genérico “poço” ou “cova”.
- source_word: ἐχάλασάν
  choice: fizeram-me descer
  rationale: Representa o movimento descendente de χαλάω sem afirmar, além do texto, o meio exato empregado.
- source_word: ἀνήγαγέν
  choice: me fez subir
  rationale: Mantém o paralelismo espacial com “fizeram-me descer” e traduz o causativo contextual de ἀνάγω.
theological_decisions:
- issue: Contraste entre a hostilidade dos irmãos e o cuidado divino
  choice: Preservar os títulos distintos “Senhor”, “Deus dos meus pais” e “Altíssimo”
  alternative: Uniformizar as três referências como “Deus”
  rationale: O grego emprega Κύριος, Θεὸς τῶν πατέρων μου e ὕψιστος; conservar a variação respeita a retórica e a teologia do texto.
- issue: Ação protetora de Deus
  choice: “me guardou”
  alternative: “me preservou”
  rationale: “Guardou” mantém o valor protetivo de φυλάσσω e soa mais natural no português atual, sem resolver de modo excessivamente específico como ocorreu a preservação.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A colocação pronominal combina fluidez corrente (“me odiaram”, “me amou”) com formas que evitam ambiguidade e sustentam o paralelismo (“fizeram-me descer”, “me fez subir”). Não há marcadores de nota porque nenhuma nota foi necessária.
