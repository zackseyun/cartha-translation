source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἀδελφοί μου καὶ τέκνα μου⁵, Ἀκούσατε Ἰωσὴφ⁶ τοῦ ἠγαπημένου ὑπὸ⁷ Ἰσραήλ⁸, Ἐνωτίσασθε *ῥήματα τοῦ στόματός μου.⁹'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/002.yaml
  text: My brothers and children, listen to Joseph, the beloved of Israel. Pay attention, my children, to your father.
translation:
  language: pt
  text: Meus irmãos e meus filhos, escutem José, o amado por Israel; deem ouvidos às palavras da minha boca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί μου καὶ τέκνα μου
  choice: Meus irmãos e meus filhos
  rationale: Reproduz diretamente os dois vocativos gregos, sem eliminar a possível amplitude retórica de «irmãos».
- source_word: Ἀκούσατε
  choice: escutem
  rationale: Imperativo plural natural em português moderno, preservando o apelo direto.
- source_word: τοῦ ἠγαπημένου ὑπὸ Ἰσραήλ
  choice: o amado por Israel
  rationale: Mantém a construção passiva e a referência a Israel como agente, sem substituir por uma formulação interpretativa como «filho predileto».
- source_word: Ἐνωτίσασθε
  choice: deem ouvidos
  rationale: Expressão idiomática digna que comunica atenção cuidadosa e conserva a imagem auditiva do verbo grego.
- source_word: ῥήματα τοῦ στόματός μου
  choice: às palavras da minha boca
  rationale: Preserva a formulação concreta e semítica do texto grego, em vez da paráfrase presente na camada inglesa.
theological_decisions:
- issue: Identidade de «Israel»
  choice: Israel
  alternative: meu pai Israel / Jacó
  rationale: O grego traz apenas Ἰσραήλ; a tradução conserva o nome e não explicita uma identificação que o texto deixa implícita.
- issue: Objeto da segunda exortação
  choice: às palavras da minha boca
  alternative: meus filhos, ao seu pai
  rationale: Segue a evidência grega apresentada. A redação inglesa diverge ao introduzir «meus filhos» e «seu pai», elementos ausentes desta linha do original.
translation_notes:
  register: Português moderno, claro e solene, com imperativos na terceira pessoa do plural, de ampla legibilidade brasileira. O ponto e vírgula liga as duas exortações paralelas sem acrescentar conteúdo.
