  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/007.yaml
  text: Amid slanders he also spoke in my defense. By the bitter words of dreams he rescued me. A slave, he exalted me.
translation:
  language: pt
  text: Em meio a calúnias, ele também falou em minha defesa. Em meio a palavras amargas de sonhos, também me livrou. Sendo eu escravo, ele me exaltou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβολαῖς
  choice: calúnias
  rationale: Expressa acusações difamatórias ou maledicências, preservando o sentido do plural grego.
- source_word: συνηγόρησέ μοι
  choice: falou em minha defesa
  rationale: Reproduz de modo natural a ideia forense de atuar ou falar em favor de alguém.
- source_word: λόγοις ἐνυπνίων πικροῖς
  choice: palavras amargas de sonhos
  rationale: Mantém a construção compacta e a relação genitiva do grego sem decidir se os sonhos são a fonte, o conteúdo ou o meio dessas palavras.
- source_word: ἐρρύσατό με
  choice: ele me livrou
  rationale: Traduz o verbo de resgate ou libertação sem acrescentar um perigo específico não expresso.
- source_word: Δοῦλος καὶ ὕψωσέ με
  choice: Sendo eu escravo, ele me exaltou
  rationale: 'Torna explícita em português a relação elíptica: José se encontrava na condição de escravo e foi elevado.'
theological_decisions:
- issue: Sujeito implícito dos verbos
  choice: Manter o pronome “ele” sem identificar nominalmente o agente
  alternative: Explicitar “Deus”
  rationale: O trecho grego não nomeia o sujeito; mantê-lo implícito em termos referenciais evita acrescentar uma identificação ausente deste versículo.
- issue: Função das palavras amargas de sonhos
  choice: Preservar a formulação compacta “por meio das palavras amargas de sonhos”
  alternative: Interpretar que Deus livrou José das palavras amargas proferidas a respeito de seus sonhos
  rationale: A sintaxe transmitida é difícil e admite mais de uma relação; a tradução conserva essa tensão em vez de escolher silenciosamente uma reconstrução.
translation_notes:
  register: Português atual, digno e acessível, com cadência breve e paralela. A última frase explicita apenas o sujeito lógico de “escravo” para evitar que o português faça parecer que o agente exaltador era o escravo.
