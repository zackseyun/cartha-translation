  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/001.yaml
  text: 'The testament of Joseph, the eleventh son of Jacob and Rachel. A copy of the testament of Joseph. When he was about to die, he called his sons and his brothers and said to them:'
translation:
  language: pt
  text: 'Testamento de José, o décimo primeiro filho de Jacó e Raquel. Cópia do testamento de José. Quando estava prestes a morrer, chamou seus filhos e seus irmãos e lhes disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη / διαθήκης
  choice: Testamento / testamento
  rationale: No gênero literário desta obra, refere-se às últimas palavras e disposições atribuídas ao patriarca; “testamento” é natural e preserva o título tradicional.
- source_word: τοῦ ἑνδεκάτου υἱοῦ
  choice: o décimo primeiro filho
  rationale: Reproduz diretamente a identificação ordinal do texto grego.
- source_word: Ἀντίγραφον
  choice: Cópia
  rationale: Equivalente direto e claro para uma reprodução ou transcrição do testamento.
- source_word: Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν
  choice: Quando estava prestes a morrer
  rationale: Expressa de modo idiomático a construção temporal e a iminência indicada por μέλλειν.
- source_word: καλέσας
  choice: chamou
  rationale: A forma portuguesa finita mantém com naturalidade a sequência circunstancial do particípio grego.
- source_word: εἶπεν αὐτοῖς
  choice: lhes disse
  rationale: Transmite explicitamente o objeto indireto plural αὐτοῖς em português corrente.
