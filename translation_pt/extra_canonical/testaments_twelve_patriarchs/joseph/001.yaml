    issue: “Estava enfermo” em 1.6
    rationale: ἐν ἀσθενείᾳ significa “em fraqueza” e pode abranger debilidade sem referir necessariamente uma enfermidade. “Estava fraco” preserva melhor a amplitude do termo.
