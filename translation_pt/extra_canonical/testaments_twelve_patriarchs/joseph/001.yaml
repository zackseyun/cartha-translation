base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001.yaml
  text: '3. In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.

    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, and the Most High brought me up.

    5. I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was gripped by famine, and the Lord himself nourished me.

    6. I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]

    7. Amid slanders he spoke in my defense. In the bitter talk of dreams he rescued me.'
translation:
  language: pt
  text: 'Testamento de José, décimo primeiro filho de Jacó e Raquel


    1. Cópia do testamento de José. Quando estava para morrer, ele chamou seus filhos e seus irmãos e lhes disse:


    2. — Meus irmãos e meus filhos, escutem José, o amado por Israel; deem ouvidos às palavras da minha boca.


    3. Durante a minha vida, vi a inveja e a morte, mas não me desviei; permaneci na verdade do Senhor.


    4. Meus irmãos me odiaram, mas o Senhor me amou. Eles quiseram me matar, mas o Deus dos meus pais me guardou. Fizeram-me descer a uma cisterna, mas o Altíssimo me tirou de lá.


    5. Fui vendido como escravo, mas o Soberano de todos me libertou. Fui levado para o cativeiro, mas sua mão poderosa me ajudou. A fome me cercou, mas o próprio Senhor me alimentou.


    6. Eu estava sozinho, e Deus me consolou. Estava fraco, e o Senhor me visitou. Estava na prisão, e o Salvador me concedeu favor. [Estava acorrentado, e ele me soltou.][a]


    7. Quando fui caluniado, ele me defendeu. Em meio às amargas palavras dos sonhos, ele me livrou.[b] Eu era escravo, e ele me exaltou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase entre colchetes tem transmissão textual incerta e pode não ter pertencido à forma mais antiga do texto.
    reason: O trecho aparece entre colchetes na edição grega fornecida e deve ser sinalizado como variante ou acréscimo textual possível.
  - marker: b
    text: 'O grego é compacto e de sentido incerto: literalmente, algo como “em palavras amargas de sonhos”.'
    reason: A sintaxe elíptica e a relação entre “palavras”, “amargas” e “sonhos” são obscuras; a nota preserva essa ambiguidade.
lexical_decisions:
- source_word: φθόνον
  choice: inveja
  rationale: Equivalente direto e natural que preserva o vício ou a hostilidade experimentada por José.
- source_word: ἀληθείᾳ Κυρίου
  choice: verdade do Senhor
  rationale: Mantém o genitivo grego sem decidir se indica verdade pertencente ao Senhor, fidelidade a ele ou seu caminho verdadeiro.
- source_word: λάκκον
  choice: cisterna
  rationale: No contexto da história de José, designa naturalmente o reservatório ou poço em que ele foi lançado, sem sugerir apenas um buraco raso.
- source_word: ὁ πάντων δεσπότης
  choice: o Soberano de todos
  rationale: Expressa domínio universal e evita a conotação moderna predominantemente social de 'senhor de escravos', embora o contraste com a escravidão permaneça.
- source_word: συνεσχέθην
  choice: a fome me cercou
  rationale: Conserva a ideia de ser apertado, detido ou dominado pela fome em português corrente, sem reduzir a expressão simplesmente a 'passei fome'.
- source_word: ἐπεσκέψατό με
  choice: me visitou
  rationale: Preserva a formulação bíblica de visitação providencial, que pode incluir cuidado sem explicitar além do grego.
- source_word: ἐχαρίτωσέ με
  choice: me concedeu favor
  rationale: Representa a ação graciosa do Salvador sem impor um sentido técnico posterior ao verbo.
- source_word: συνηγόρησέ μοι
  choice: ele me defendeu
  rationale: Transmite a imagem forense de falar em favor de alguém de modo claro e idiomático.
- source_word: ὕψωσέ με
  choice: ele me exaltou
  rationale: Mantém o contraste deliberado entre a condição de escravo e a elevação concedida por Deus.
theological_decisions:
- issue: Títulos divinos variados
  choice: Senhor, Deus dos meus pais, Altíssimo, Soberano de todos e Salvador
  alternative: Uniformizar todos como 'Deus' ou 'Senhor'
  rationale: A alternância pertence ao texto grego e contribui para sua teologia; a tradução não a harmoniza.
- issue: Sentido de 'verdade do Senhor'
  choice: Preservar a construção genitiva
  alternative: Explicitar como 'fidelidade ao Senhor'
  rationale: O grego permite mais de uma relação semântica, e a tradução evita resolver silenciosamente essa tensão.
- issue: Ação do Salvador na prisão
  choice: me concedeu favor
  alternative: teve misericórdia de mim ou me encheu de graça
  rationale: A escolha mantém a linguagem de favor divino sem importar uma formulação soteriológica ou sacramental específica.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais correntes no plural ('escutem', 'deem ouvidos'). A cadência paralela das provações e dos livramentos foi preservada. O título e os versículos 1–2 e a cláusula final do versículo 7 foram traduzidos diretamente do grego, embora não apareçam na camada inglesa de consulta.
