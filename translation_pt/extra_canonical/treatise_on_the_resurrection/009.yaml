base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: pt
  text: 'Mas o que estou lhes dizendo? Que os vivos morrerão? Como vivem numa ilusão? Os ricos se tornaram pobres, e os reis foram derrubados. Tudo está sujeito à mudança. O mundo é uma ilusão, se é que não estou exagerando a situação.


    A ressurreição, porém, não tem essa natureza ilusória e passageira, pois é a realidade que permanece firme. É a revelação daquilo que existe, a própria transfiguração das coisas e uma transformação no que é novo. Pois a incorruptibilidade [...] [descerá] sobre o perecível.[a] A luz fluirá sobre as trevas e as engolirá. Então a Plenitude preencherá a Deficiência. Estes são símbolos e imagens da ressurreição. É isso que produz o bem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A testemunha fornecida indica uma lacuna antes de «descerá» e apresenta esse verbo como restauração editorial. A redação deverá ser revista diretamente à luz do manuscrito copta.
    reason: Preservar os sinais de dano textual e de restauração presentes na fonte, deixando clara a natureza provisória desta passagem.
lexical_decisions:
- source_word: illusion
  choice: ilusão
  rationale: Preserva a formulação contundente e a linguagem conceitual da testemunha, sem reinterpretá-la como mera aparência, engano moral ou inexistência material.
- source_word: resurrection
  choice: ressurreição
  rationale: Emprega o termo português corrente e teologicamente não sectário.
- source_word: imperishability
  choice: incorruptibilidade
  rationale: Mantém o contraste abstrato com «o perecível» e evita reduzir o sentido a simples longevidade ou imortalidade pessoal.
- source_word: Fullness
  choice: Plenitude
  rationale: A inicial maiúscula sinaliza o provável uso técnico do conceito no tratado, sem inserir uma explicação doutrinária no corpo do texto.
- source_word: Deficiency
  choice: Deficiência
  rationale: Conserva o paralelismo conceitual com «Plenitude» e a personificação sugerida pela testemunha.
- source_word: swallowing it up
  choice: as engolirá
  rationale: Preserva a imagem vigorosa de a luz consumir as trevas, com referente plural natural em português.
theological_decisions:
- issue: Natureza da afirmação de que o mundo é uma ilusão
  choice: «O mundo é uma ilusão»
  alternative: «O mundo é irreal» ou «o mundo é enganoso»
  rationale: A tradução não resolve a tensão metafísica do texto nem afirma mais do que a testemunha permite.
- issue: Relação entre ressurreição e realidade permanente
  choice: «é a realidade que permanece firme»
  alternative: «é a verdade estabelecida»
  rationale: Mantém a oposição entre a mutabilidade ilusória do mundo e a permanência da ressurreição, sem converter «realidade» em uma categoria apenas proposicional.
- issue: Sentido técnico de Plenitude e Deficiência
  choice: Manter ambos como substantivos abstratos com inicial maiúscula
  alternative: Explicá-los como entidades, eras ou estados cosmológicos específicos
  rationale: Preserva a possível terminologia técnica e evita importar uma reconstrução doutrinária não explicitada pela testemunha fornecida.
- issue: Restauração textual em «descerá»
  choice: Preservar colchetes e indicar a lacuna
  alternative: Integrar «descerá» ao texto sem sinal editorial
  rationale: Torna visível que a formulação depende de restauração e que há dano ou ausência textual na base fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação segue provisoriamente a testemunha inglesa de domínio público, pois a revisão direta do copta ainda está pendente. Mantiveram-se a linguagem imagética, as perguntas iniciais e a tensão entre ilusão, mudança e realidade permanente.
