review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto a testemunha inglesa fornecida e preserva adequadamente a tensão entre a instabilidade do mundo e a permanência da ressurreição. Contudo, «[...] [descerá]» altera a convenção editorial da base, que assinala uma lacuna vazia seguida de uma restauração separada: «[] [will descend]». Além disso, «fluirá sobre» não comunica explicitamente o movimento descendente de «will flow down upon».'
  naturalness: O português é moderno, claro e de registro apropriado. «Os que estão vivos morrerão?» é uma formulação interrogativa mais direta e natural do que introduzir a pergunta com «Que». «Descerá sobre» reproduz naturalmente a imagem de movimento vertical.
  terminology: «Ilusão», «ressurreição», «incorruptibilidade», «perecível», «Plenitude» e «Deficiência» são escolhas adequadas. As maiúsculas em «Plenitude» e «Deficiência» preservam a possível função técnica sem impor uma interpretação doutrinária.
  issues:
  - severity: medium
    issue: A lacuna textual foi representada como reticências entre colchetes.
    rationale: 'A testemunha registra «[] [will descend]»: um segmento lacunar não especificado e, separadamente, uma restauração editorial. «[...]» sugere um comprimento ou uma forma de lacuna que a base não fornece. Deve-se conservar «[] [descerá]».'
  - severity: low
    issue: «A luz fluirá sobre as trevas» omite a ideia de movimento descendente.
    rationale: A testemunha diz «will flow down upon». «A luz descerá sobre as trevas» preserva a direção imagética e mantém paralelismo com a descida da incorruptibilidade.
  revised_text: 'Mas o que estou lhes dizendo? Os que estão vivos morrerão? Como vivem numa ilusão? Os ricos se tornaram pobres, e os reis foram derrubados. Tudo está sujeito à mudança. O mundo é uma ilusão, se é que não estou exagerando a situação.


    A ressurreição, porém, não tem essa natureza ilusória e passageira, pois é a realidade que permanece firme. É a revelação daquilo que existe, a própria transfiguração das coisas e uma transformação no que é novo. Pois a incorruptibilidade [] [descerá] sobre o perecível.[a] A luz descerá sobre as trevas e as engolirá. Então a Plenitude preencherá a Deficiência. Estes são símbolos e imagens da ressurreição. É isso que produz o bem.'
  revised_footnotes:
  - marker: a
    text: A testemunha fornecida indica uma lacuna antes de «descerá» e apresenta esse verbo como restauração editorial. A redação deverá ser revista diretamente à luz do manuscrito copta.
    reason: Preservar os sinais distintos de dano textual («[]») e de restauração editorial («[descerá]») presentes na fonte, deixando clara a natureza provisória desta passagem.
