review_pass:
  verdict: revise
  source_fidelity: A versão acompanha de perto o testemunho inglês fornecido e preserva adequadamente as lacunas editoriais. Contudo, «é realidade» omite o artigo presente em «it is a reality», e «se vocês se lembram» introduz uma oscilação de pessoa que não é necessária; a formulação impessoal preserva melhor o alcance do original.
  naturalness: O português é em geral claro e de registro apropriado. «Pelo contrário, é realidade» soa menos natural que «pelo contrário, é uma realidade», e a construção impessoal «se vocês se lembram» pode ser simplificada para melhor fluência internacional.
  terminology: Os termos «salvo», «ressurreição», «ilusão» e «realidade» são adequados e conservam as repetições relevantes. «Revelação contínua» deve permanecer assinalada como provisória, pois a verificação direta do copta está pendente.
  issues:
  - severity: low
    issue: Ausência do artigo em «é realidade».
    rationale: O testemunho diz «it is a reality»; «é uma realidade» é a correspondência portuguesa natural e preserva a ênfase de que não se trata de ilusão.
  - severity: low
    issue: Mudança desnecessária para segunda pessoa do plural em «se vocês se lembram».
    rationale: O inglês emprega uma construção genérica («if you remember»). «Se você se lembra» manteria um destinatário singular, mas uma redação impessoal evita uma mudança de interlocução e é mais amplamente natural neste contexto.
  revised_text: 'Há alguns, contudo, que, no decorrer de sua investigação, querem compreender se aquele que é salvo, ao se desfazer do corpo, será salvo imediatamente. Que ninguém tenha dúvida quanto a isso. [...][a]. De fato, os membros visíveis que estão mortos [][b] não serão salvos, pois, nesse caso, os membros vivos que existem neles ressuscitariam.



    Então, o que é a ressurreição? É a revelação contínua daqueles que ressuscitaram.[c] Pois, se alguém se lembra de ter lido no evangelho que Elias apareceu, e Moisés com ele, não pense que a ressurreição seja uma ilusão. Não é ilusão; pelo contrário, é uma realidade! De fato, seria mais correto dizer que o mundo é uma ilusão do que dizer que é ilusão a ressurreição que aconteceu por meio de nosso Senhor, o Salvador, Jesus Cristo.'
