base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: pt
  text: 'Há alguns, contudo, que, no decorrer de sua investigação, querem compreender se aquele que é salvo, ao se desfazer do corpo, será salvo imediatamente. Que ninguém tenha dúvida quanto a isso. [...][a]. De fato, os membros visíveis que estão mortos [][b] não serão salvos, pois, nesse caso, os membros vivos que existem neles ressuscitariam.


    Então, o que é a ressurreição? É a revelação contínua daqueles que ressuscitaram.[c] Pois, se vocês se lembram de ter lido no evangelho que Elias apareceu, e Moisés com ele, não pensem que a ressurreição seja uma ilusão. Não é ilusão; pelo contrário, é realidade! De fato, seria mais correto dizer que o mundo é uma ilusão do que dizer que é ilusão a ressurreição que aconteceu por meio de nosso Senhor, o Salvador, Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As reticências entre colchetes assinalam uma lacuna ou porção ausente no testemunho utilizado.
    reason: Preservar de modo visível o sinal de dano ou omissão transmitido pela edição de base.
