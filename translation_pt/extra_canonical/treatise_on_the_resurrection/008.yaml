    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: pt
  text: 'Há alguns, contudo, que, no decorrer de sua investigação, querem compreender se aquele que é salvo, ao se desfazer do corpo, será salvo imediatamente. Que ninguém tenha dúvida quanto a isso. [...][a]. De fato, os membros visíveis que estão mortos [][b] não serão salvos, pois, nesse caso, os membros vivos que existem neles ressuscitariam.


    Então, o que é a ressurreição? É a revelação contínua daqueles que ressuscitaram.[c] Pois, se vocês se lembram de ter lido no evangelho que Elias apareceu, e Moisés com ele, não pensem que a ressurreição seja uma ilusão. Não é ilusão; pelo contrário, é realidade! De fato, seria mais correto dizer que o mundo é uma ilusão do que dizer que é ilusão a ressurreição que aconteceu por meio de nosso Senhor, o Salvador, Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As reticências entre colchetes assinalam uma lacuna ou porção ausente no testemunho utilizado.
    reason: Preservar de modo visível o sinal de dano ou omissão transmitido pela edição de base.
  - marker: b
    text: Os colchetes vazios assinalam um ponto danificado ou incerto do texto; nenhuma reconstrução foi acrescentada.
    reason: Evitar completar conjecturalmente uma passagem cuja leitura pode afetar o sentido antropológico e escatológico.
  - marker: c
    text: A expressão “revelação contínua” reproduz uma formulação incomum do testemunho inglês; também poderia sugerir “manifestação contínua”. A confirmação depende de revisão direta do copta.
    reason: Registrar uma incerteza lexical relevante sem resolvê-la silenciosamente no texto principal.
lexical_decisions:
- source_word: discarding the body
  choice: ao se desfazer do corpo
  rationale: Expressa o abandono do corpo sem especificar além do testemunho se isso significa morte, separação da alma ou outra concepção antropológica.
- source_word: saved
  choice: salvo / salvos
  rationale: Mantém o vocabulário soteriológico e a repetição do testemunho, sem substituir por termos interpretativos como “liberto”.
- source_word: resurrection / rise
  choice: ressurreição / ressuscitaram / ressuscitariam
  rationale: Preserva em português a ligação verbal entre o substantivo e o ato de ressuscitar, embora a correspondência exata com o copta ainda dependa de revisão direta.
- source_word: continuing revelation
  choice: revelação contínua
  rationale: Tradução formal que conserva a formulação incomum e evita decidir se o sentido pretendido é manifestação, desvelamento ou processo revelador.
- source_word: illusion / reality
  choice: ilusão / realidade
  rationale: Mantém o contraste enfático central do trecho em linguagem corrente e digna.
- source_word: through our Lord
  choice: por meio de nosso Senhor
  rationale: Conserva a ideia de mediação ou agência sem reduzir a expressão a uma simples referência temporal ou causal.
theological_decisions:
- issue: Momento da salvação após o abandono do corpo
  choice: Conservar a afirmação interrogativa e a resposta breve sem explicar o mecanismo da salvação
  alternative: Interpretar explicitamente como salvação imediata da alma depois da morte
  rationale: O testemunho não define “corpo”, “imediatamente” nem a antropologia pressuposta; explicitar uma doutrina resolveria indevidamente essa tensão.
- issue: Destino dos membros visíveis mortos e dos membros vivos neles
  choice: Manter literalmente a distinção entre membros visíveis mortos e membros vivos
  alternative: Reformular como oposição entre corpo físico e corpo espiritual
  rationale: A passagem está danificada e sua linguagem é obscura; uma harmonização importaria categorias teológicas não expressas no testemunho disponível.
- issue: Natureza da ressurreição
  choice: Traduzir como “revelação contínua daqueles que ressuscitaram”
  alternative: Interpretar como visão, aparição presente ou experiência exclusivamente espiritual
  rationale: A formulação preserva a ambiguidade do testemunho e seu vínculo com a aparição de Elias e Moisés.
- issue: Relação entre a ressurreição e a ilusão do mundo
  choice: Preservar a comparação retórica sem afirmar diretamente que o mundo é ilusório
  alternative: Declarar categoricamente que o mundo é uma ilusão
  rationale: O texto formula uma comparação de maior exatidão, não necessariamente uma definição metafísica direta do mundo.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A redação preserva repetições, contrastes e sinais editoriais do testemunho. Trata-se de versão provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta do Códice de Nag Hammadi I,4 ainda está pendente.
