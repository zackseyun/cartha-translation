translation:
  language: pt
  text: '[…][a] Meu filho Reginos, alguns desejam aprender muitas coisas. Esse é o objetivo deles quando se ocupam de perguntas para as quais não têm respostas. Se conseguem encontrá-las, tendem a considerar-se muito importantes. Eu, porém, não creio que tenham alcançado a palavra da verdade. Em vez disso, procuram a própria satisfação, ao passo que nós recebemos a verdadeira satisfação por meio de nosso Salvador, nosso Senhor Cristo. […][b] Nós a recebemos quando conhecemos a verdade e nela encontramos nosso repouso.


    Contudo, visto que você pergunta com cortesia qual é a compreensão correta da ressurreição, escrevo-lhe o que é essencial. Muitos, certamente, não depositam fé nela. Poucos, porém, a encontram.[c] Tratemos, então, desse assunto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho começa depois de uma lacuna no manuscrito.
    reason: Sinalizar de forma legível a perda textual indicada pelos colchetes do testemunho.
  - marker: b
    text: Há outra lacuna no manuscrito neste ponto.
    reason: Preservar o sinal de dano ou perda textual presente no testemunho fornecido.
  - marker: c
    text: “A encontram” provavelmente se refere à ressurreição, mas também pode se referir à sua compreensão correta.
    reason: Preservar a ambiguidade referencial do testemunho em vez de resolvê-la no texto principal.
lexical_decisions:
- source_word: word of truth
  choice: palavra da verdade
  rationale: Preserva a formulação conceitual do testemunho sem reduzi-la a mera informação verdadeira.
- source_word: satisfaction
  choice: satisfação / verdadeira satisfação
  rationale: Mantém o contraste do testemunho entre a satisfação procurada por alguns e aquela recebida por meio de Cristo; a qualificação explicativa é conservada sem impor uma doutrina adicional.
- source_word: repose
  choice: repouso
  rationale: Conserva o possível peso espiritual e escatológico do termo, que seria atenuado por opções mais cotidianas como 'alívio'.
- source_word: correct (interpretation)
  choice: compreensão correta
  rationale: Expressa em português natural a ideia interpretativa indicada pelo testemunho, sem sugerir uma exegese denominacional específica.
- source_word: put no faith in it
  choice: não depositam fé nela
  rationale: Mantém a linguagem de fé e seu referente provável, a ressurreição, em vez de simplificar para 'não acreditam'.
theological_decisions:
- issue: Natureza da satisfação recebida por meio de Cristo
  choice: a verdadeira satisfação
  alternative: satisfação plena
  rationale: Preserva a explicação parentética do testemunho e o contraste retórico, sem definir em que consiste essa satisfação.
- issue: Possível sentido técnico de 'repouso'
  choice: repouso
  alternative: descanso
  rationale: A opção escolhida retém a possível dimensão teológica do conceito e evita banalizá-lo.
- issue: Referente de 'a encontram'
  choice: Poucos, porém, a encontram, com nota de ambiguidade
  alternative: Poucos, porém, encontram a ressurreição
  rationale: O contexto favorece 'ressurreição', mas a formulação pode também apontar para sua compreensão correta; a tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Esta é uma tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta ainda está pendente. As lacunas manuscritas foram representadas por reticências entre colchetes.
