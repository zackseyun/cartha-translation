review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho ინგლისês fornecido e preserva as imagens centrais de vestimenta, raios, ocaso e atração celeste. Contudo, «absorve» atenua indevidamente o sentido mais forte de «swallowing up»; «engole» o preserva melhor. A revisão direta do copta permanece pendente, de modo que a lacuna não deve ser reconstruída.
  naturalness: O português é claro e de registro apropriado. Explicitar o verbo na comparação («como os raios são atraídos pelo sol») elimina uma elipse algo áspera em português sem acrescentar conteúdo.
  terminology: «Revestimo-nos deste mundo», «raios luminosos», «ocaso» e «ressurreição espiritual» são escolhas adequadas. «Engole» mantém a força imagética e a simetria verbal da frase final, sem interpretação teológica adicional.
  issues:
  - severity: medium
    issue: «absorve» para «swallowing up»
    rationale: «Absorver» pode sugerir incorporação neutra ou gradual, enquanto o testemunho emprega a imagem mais enérgica de engolir. «Engole» preserva melhor a metáfora e não resolve seu sentido teológico.
  - severity: low
    issue: Comparação elíptica «como os raios pelo sol»
    rationale: Embora compreensível, a omissão do verbo soa truncada. «Como os raios são atraídos pelo sol» torna explícita a relação já implicada pelo original.
  revised_text: 'Então, como de fato disse o apóstolo: “Sofremos com ele, ressuscitamos com ele e subimos ao céu com ele”. Ora, se vivemos de modo visível neste mundo, revestimo-nos deste mundo. Somos seus raios luminosos e permanecemos com ele até o nosso ocaso, isto é, até a nossa morte nesta vida. Por meio dele somos atraídos para o céu, como os raios são atraídos pelo sol, sem que nada nos detenha. Esta é a ressurreição espiritual, […] [a] que engole a alma assim como engole a carne.'
  revised_footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito neste ponto; não se sabe quanto texto se perdeu nem como a frase se ligava originalmente ao que segue.
    reason: O testemunho assinala dano ou trecho não restaurado com colchetes vazios; a edição portuguesa torna essa incerteza visível no texto e a explica.
  revision_rationale: A revisão substitui «absorve» por «engole», preservando a imagem e a intensidade de «swallowing up», e torna natural em português a comparação dos raios com o sol. Mantêm-se a lacuna sem tentativa de restauração, a referência à morte como «ocaso» e a ambiguidade do enunciado final.
