source:
  text: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/004.yaml
  text: Then, as the apostle truly said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” If we live visibly in this world, we wear this world. We are his radiant beams, and we remain with him until our setting—that is, our death in this life. Through him we are drawn to heaven, like rays drawn by the sun, with nothing holding us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
translation:
  language: pt
  text: 'Então, como de fato disse o apóstolo: “Sofremos com ele, ressuscitamos com ele e subimos ao céu com ele”. Ora, se vivemos de modo visível neste mundo, revestimo-nos deste mundo. Somos seus raios luminosos e permanecemos com ele até o nosso ocaso, isto é, até a nossa morte nesta vida. Por meio dele somos atraídos para o céu, como os raios pelo sol, sem que nada nos detenha. Esta é a ressurreição espiritual, […] [a] que absorve a alma assim como absorve a carne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito neste ponto; não se sabe quanto texto se perdeu nem como a frase se ligava originalmente ao que segue.
    reason: O testemunho assinala dano ou trecho não restaurado com colchetes vazios; a edição portuguesa torna essa incerteza visível no texto e a explica.
lexical_decisions:
- source_word: we wear this world
  choice: revestimo-nos deste mundo
  rationale: Preserva a metáfora do mundo como vestimenta em português natural e dignificado, sem reduzi-la a simplesmente viver ou pertencer ao mundo.
- source_word: radiant beams
  choice: raios luminosos
  rationale: Mantém a imagem de emanação luminosa e prepara a comparação posterior com os raios e o sol.
- source_word: our setting
  choice: nosso ocaso
  rationale: Conserva a metáfora solar, explicitada no próprio texto como a morte nesta vida.
- source_word: drawn to heaven
  choice: atraídos para o céu
  rationale: Retém a voz passiva e a imagem de atração, sem especificar um mecanismo ausente no testemunho.
- source_word: swallowing up
  choice: absorve
  rationale: Expressa a ideia de incorporação ou consumação com clareza; evita a possível conotação grotesca de 'engole', embora esta permaneça uma alternativa formal.
theological_decisions:
- issue: Relação entre ressurreição espiritual, alma e carne
  choice: que absorve a alma assim como absorve a carne
  alternative: que engole a alma assim como engole a carne
  rationale: Mantém a afirmação difícil e sua simetria entre alma e carne, sem explicar se 'absorver' significa transformar, incorporar ou vencer.
- issue: Participação conjunta nos sofrimentos, ressurreição e ascensão de Cristo
  choice: Sofremos com ele, ressuscitamos com ele e subimos ao céu com ele
  alternative: Padecemos com ele, fomos ressuscitados com ele e ascendemos com ele
  rationale: Preserva as três ações coordenadas e a participação com ele, sem acrescentar uma cronologia ou doutrina específica; o tempo verbal segue o testemunho disponível.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira, com tom digno. Tradução provisória baseada no testemunho inglês de domínio público, pois a revisão direta do copta ainda está pendente. As metáforas de vestimenta, raios e ocaso foram preservadas, bem como a tensão da frase final.
