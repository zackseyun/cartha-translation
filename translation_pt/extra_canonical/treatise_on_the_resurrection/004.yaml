review_pass:
  verdict: revise
  source_fidelity: O texto segue de perto o testemunho inglês provisório. Contudo, «swallowing up» é uma imagem mais forte e concreta do que «absorve»; «engolindo» a preserva melhor. A lacuna deve permanecer claramente assinalada sem introduzir, como se fosse texto preservado, uma ligação sintática («que») cuja presença no original não pode ser confirmada enquanto a revisão direta do copta estiver pendente.
  naturalness: O português é claro, moderno e de registro apropriado. «Revestimo-nos deste mundo», «raios luminosos» e «nosso ocaso» são naturais dentro do tom metafórico do tratado. A construção interrompida depois da lacuna é inevitavelmente áspera, mas reflete honestamente o dano textual; a nota esclarece isso.
  terminology: «Ressurreição espiritual», «revestimo-nos», «raios» e «ocaso» preservam adequadamente as imagens e os termos fundamentais do testemunho. «Engolindo» conserva a metáfora verbal de devorar/engolir sem lhe impor uma interpretação teológica.
  issues:
  - severity: medium
    issue: «absorve» atenua a imagem de «swallowing up».
    rationale: Embora «absorver» possa comunicar incorporação, não reproduz de modo suficiente a metáfora forte do testemunho. «Engolindo» é mais fiel e continua compreensível em português.
  - severity: low
    issue: A formulação «[…] [a] que absorve» apresenta uma ligação relativa após a lacuna que não está atestada no testemunho fornecido.
    rationale: O «que» torna a frase portuguesa mais fluida, mas pode aparentar reconstruir a sintaxe perdida. É mais seguro conservar a lacuna seguida de uma forma participial, correspondente ao inglês «swallowing up», e vincular a nota diretamente ao sinal de lacuna.
  revised_text: 'Então, como de fato disse o apóstolo: “Sofremos com ele, ressuscitamos com ele e subimos ao céu com ele.” Ora, se vivemos de modo visível neste mundo, revestimo-nos deste mundo. Somos seus raios luminosos e permanecemos com ele até o nosso ocaso, isto é, até a nossa morte nesta vida. Por meio dele somos atraídos para o céu, como os raios pelo sol, sem que nada nos detenha. Esta é a ressurreição espiritual, […]ᵃ engolindo a alma, assim como a carne.'
  revised_footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito neste ponto; não se sabe quanto texto se perdeu nem como a frase se ligava originalmente ao que segue.
    reason: O testemunho assinala dano ou trecho não restaurado com colchetes vazios. A nota explica o sinal de lacuna sem reconstruir o texto ausente.
  revision_rationale: 'A revisão conserva a tradução já sólida e altera apenas o necessário: substitui «absorve» por «engolindo», para manter a força imagética de «swallowing up», e elimina o relativo «que», que poderia funcionar como uma reconstrução sintática não assegurada através da lacuna. A pontuação das citações foi ajustada ao uso português.'
