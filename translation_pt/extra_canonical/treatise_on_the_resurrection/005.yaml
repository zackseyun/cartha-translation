  terminology: “Filho do Homem”, “ressuscitar”, “dentre os mortos” e “aniquilação da morte” são escolhas adequadas. “Crença” na conclusão preserva melhor o vocabulário distinto do testemunho, sem impor uma leitura teológica adicional.
