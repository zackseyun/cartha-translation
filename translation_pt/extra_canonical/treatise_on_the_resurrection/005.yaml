  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: pt
  text: 'Se alguns, porém, não creem, é porque não podem ser convencidos. Pois, meu filho, que os mortos ressuscitarão é questão de fé, e não de argumentação.


    Entre os filósofos deste mundo, há alguns que creem, para que ao menos eles ressuscitem. E o filósofo que está neste mundo não se considere justificado por crer que, por si mesmo, faz a si próprio voltar da morte à vida.[a] Pois, por causa da nossa fé, conhecemos o Filho do Homem e cremos que ele ressuscitou dentre os mortos. A respeito dele declaramos: “Ele se tornou a aniquilação da morte”.[b] Pois grande é a fé, e <grandes> são os que creem.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção do testemunho é difícil e enfática: literalmente, aproxima-se de “ele faz a si mesmo retornar por si mesmo”.'
    reason: Sinaliza incerteza sintática real sem resolvê-la silenciosamente.
  - marker: b
    text: 'Ou: “a eliminação da morte”.'
    reason: Registra uma alternativa lexical para a imagem forte traduzida por “aniquilação”.
  - marker: c
    text: Os sinais < > indicam uma palavra restaurada no testemunho usado como base; a revisão direta do copta ainda está pendente.
    reason: Preserva de modo transparente a marca editorial da fonte fornecida e a condição provisória da base textual.
lexical_decisions:
- source_word: believe / belief
  choice: crer / fé
  rationale: Usa “crer” para o ato pessoal e “fé” para o substantivo nos contextos em que o testemunho contrasta fé e argumentação; mantém linguagem natural e teologicamente não sectária.
- source_word: argumentation
  choice: argumentação
  rationale: Preserva o contraste explícito com a fé sem ampliar o sentido para “razão” em geral.
- source_word: rise / rose
  choice: ressuscitar / ressuscitou
  rationale: É a formulação portuguesa corrente para a volta dos mortos à vida e para a ressurreição do Filho do Homem.
- source_word: obliteration
  choice: aniquilação
  rationale: 'Mantém a força da imagem: a morte é suprimida ou reduzida a nada, em vez de apenas derrotada.'
- source_word: Son of Man
  choice: Filho do Homem
  rationale: Preserva o título tradicional e sua possível carga cristológica.
theological_decisions:
- issue: Relação entre fé e argumentação
  choice: “é questão de fé, e não de argumentação”
  alternative: “pertence à fé, e não ao raciocínio”
  rationale: Mantém o contraste do testemunho sem afirmar que fé e razão sejam universalmente incompatíveis.
- issue: Ação do filósofo em sua própria volta à vida
  choice: “por si mesmo, faz a si próprio voltar da morte à vida”
  alternative: “ressuscita a si mesmo”
  rationale: Preserva a construção reflexiva e enfática do testemunho, embora sua sintaxe seja difícil, sem decidir além dela como a crença, a justificação e a autoressurreição se relacionam.
- issue: Referente de “of whom”
  choice: “A respeito dele declaramos” referindo-se ao Filho do Homem
  alternative: Manter uma ligação pronominal mais ambígua
  rationale: A referência masculina singular mais próxima e semanticamente coerente é o Filho do Homem; a formulação portuguesa evita uma frase artificial.
- issue: Grandeza da fé e dos crentes
  choice: “grande é a fé, e <grandes> são os que creem”
  alternative: “grande é a crença, e <grandes> os crentes”
  rationale: Conserva o paralelismo e a restauração assinalada no testemunho, sem transformar a frase em uma classificação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta do Códice de Nag Hammadi I,4 permanece pendente.
