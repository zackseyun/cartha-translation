  naturalness: O registro é claro e moderno. Contudo, “As pessoas não consideram que você desconheça” é pouco idiomático e pode dificultar a compreensão da afirmação de que o destinatário sabe do fato subsequente. “As pessoas não pensam que você não saiba” é mais natural e conserva o sentido do testemunho de base.
  terminology: “Éon”, “emanação”, “escolhidos”, “Salvador”, “tragou” e “imortalidade” são escolhas apropriadas e semanticamente cautelosas. “Pôs fim ao mundo perecível” é uma equivalência interpretativamente sóbria para “dispensed with”.
