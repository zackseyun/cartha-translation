id: TRES.003
reference: Treatise on the Resurrection — The Savior Swallowed Up Death
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/003.yaml
  text: 'I realize that I am giving [] the answer in complex language. Yet there is nothing difficult to understand about the word of truth. The answer appeared so that nothing would remain hidden, but so that everything about existence would be revealed. The result was, on the one hand, the obliteration of evil and, on the other, the revelation of the chosen ones. All this is the emanation of truth and spirit, with grace coming from truth.


    People do not think that you are unaware that the Savior swallowed up death, because he did away with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible and thus preparing the way for us to our immortality.'
translation:
  language: pt
  text: 'Percebo que estou dando [] a resposta em linguagem complexa.[a] No entanto, não há nada difícil de entender na palavra da verdade. Pois a resposta apareceu para que nada permanecesse oculto, mas para tornar manifesto tudo o que diz respeito à existência. O resultado foi, por um lado, a eliminação do mal e, por outro, a revelação dos escolhidos. Tudo isso é a emanação da verdade e do espírito, sendo a graça proveniente da verdade.


    As pessoas não consideram que você desconheça que o Salvador tragou a morte, pois pôs fim ao mundo perecível. Ele o transformou[b] em um éon imperecível e se levantou, tragando o visível por meio do invisível e, assim, abrindo para nós o caminho rumo à nossa imortalidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito depois de “dando”; não se sabe o que falta.
    reason: Sinalizar dano textual indicado por colchetes no testemunho de base.
  - marker: b
    text: O objeto de “transformou” é uma restauração editorial; pelo contexto, provavelmente se refere ao mundo perecível.
    reason: Preservar a incerteza textual representada por [it] no testemunho.
lexical_decisions:
- source_word: word of truth
  choice: palavra da verdade
  rationale: Mantém a formulação conceitual do testemunho sem reduzi-la a mera 'mensagem'.
- source_word: obliteration
  choice: eliminação
  rationale: Expressa o desaparecimento efetivo do mal em português natural, sem acrescentar uma teoria específica sobre seu modo de destruição.
- source_word: emanation
  choice: emanação
  rationale: Preserva o vocabulário cosmológico e sua possível carga técnica, evitando paráfrase interpretativa.
- source_word: aeon
  choice: éon
  rationale: Retém o termo técnico e sua amplitude semântica, que pode abranger era, domínio ou realidade transcendente.
- source_word: swallowed up
  choice: tragou
  rationale: Conserva a imagem forte e concreta de engolir ou absorver a morte e o visível.
- source_word: dispensed with
  choice: pôs fim a
  rationale: Oferece uma expressão portuguesa clara para a remoção do mundo perecível, sem especificar um mecanismo não presente no testemunho.
- source_word: raised himself up
  choice: se levantou
  rationale: Preserva a forma reflexiva e a possível alusão à ressurreição sem explicitá-la além do texto.
theological_decisions:
- issue: Relação entre o Salvador e o mundo perecível
  choice: pôs fim ao mundo perecível
  alternative: descartou o mundo perecível
  rationale: A escolha evita um tom coloquial ou depreciativo e mantém em aberto se a frase descreve abolição, superação ou transformação.
- issue: Agência na elevação do Salvador
  choice: se levantou
  alternative: ressuscitou a si mesmo
  rationale: A tradução conserva a reflexividade do testemunho sem transformar uma expressão ambígua em afirmação dogmática explícita.
- issue: Natureza do 'éon imperecível'
  choice: éon imperecível
  alternative: era imperecível
  rationale: O termo transliterado preserva a tensão entre sentido temporal, cosmológico e ontológico.
- issue: Identidade do objeto transformado
  choice: Ele o transformou, com nota de incerteza
  alternative: Ele transformou o mundo
  rationale: O pronome é uma restauração editorial no testemunho; a nota registra a incerteza sem ocultá-la.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe foi simplificada onde o testemunho inglês é muito truncado, mas a progressão argumentativa, as imagens e as ambiguidades teológicas foram preservadas. Tradução provisória baseada no testemunho público em inglês; a revisão direta do copta ainda está pendente.
