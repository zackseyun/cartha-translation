translation:
  language: pt
  text: 'Foi pela benevolência do meu [] Senhor, Jesus Cristo, que obtive tudo isso.[a] A respeito dessas coisas, instruí vocês e seus irmãos e irmãs, meus filhos, sem deixar de lado nada que pudesse fortalecê-los. Contudo, se em minha explicação da palavra escrevi algo obscuro, eu o explicarei a vocês, se me perguntarem.


    Agora, porém, não fiquem apreensivos em compartilhar isto com qualquer pessoa entre vocês, pois pode ser útil.[b]


    Muitos estão examinando as questões sobre as quais escrevi a vocês. A esses eu digo: Paz e graça estejam com eles.


    Envio saudações a vocês e àqueles que os amam com amor fraternal.


    O Tratado sobre a Ressurreição'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes vazios assinalam uma lacuna ou trecho não preservado no testemunho manuscrito. Esta tradução é provisória e se baseia no testemunho inglês fornecido; ainda é necessária a revisão direta do copta.
    reason: Preservar com transparência o sinal de dano textual e declarar a limitação da base de tradução.
  - marker: b
    text: A formulação desta frase é incerta. O testemunho inglês diz literalmente para não ficar apreensivo ao compartilhar o texto, porque ele pode ser útil; outras compreensões do texto subjacente podem ser possíveis.
    reason: Evitar eliminar a tensão semântica de uma frase potencialmente problemática antes da revisão do copta.
lexical_decisions:
- source_word: graciousness
  choice: benevolência
  rationale: Expressa favor generoso de modo natural e digno, sem restringir o sentido à formulação teológica mais técnica de “graça”.
- source_word: brothers and sisters
  choice: irmãos e irmãs
  rationale: Torna explícito o sentido comunitário inclusivo indicado pela restauração do testemunho.
- source_word: my children
  choice: meus filhos
  rationale: Preserva a linguagem familiar e pastoral do autor; em português, o masculino plural pode abranger o grupo misto.
- source_word: the word
  choice: a palavra
  rationale: Mantém a amplitude do termo, que pode designar a mensagem, o discurso ou a exposição, sem decidir entre essas possibilidades.
- source_word: looking into
  choice: examinando
  rationale: Comunica investigação atenta sem sugerir necessariamente aceitação ou contestação.
- source_word: love of brothers and sisters
  choice: amor fraternal
  rationale: É uma expressão corrente e digna em português para o afeto próprio de irmãos e irmãs, sem impor uma leitura institucional.
theological_decisions:
- issue: Relação entre a benevolência do Senhor e a obtenção do ensino
  choice: “Foi pela benevolência [...] que obtive tudo isso”
  alternative: “Recebi tudo isso da graça [...]”
  rationale: Preserva a causalidade do testemunho e evita converter “graciousness” automaticamente no termo teológico técnico “graça”.
- issue: Possível alcance de “a palavra”
  choice: Manter “a palavra”
  alternative: “a mensagem” ou “o ensinamento”
  rationale: O testemunho permite mais de um referente; a tradução não resolve silenciosamente essa ambiguidade.
- issue: Exortação sobre compartilhar o escrito
  choice: “não fiquem apreensivos em compartilhar”
  alternative: “não tenham pressa de compartilhar” ou “não hesitem em compartilhar”
  rationale: Segue de perto o testemunho inglês disponível, embora a lógica da frase e o texto subjacente admitam incerteza; a nota registra a dificuldade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantiveram-se a forma epistolar, a linguagem familiar e os sinais de incerteza textual. Materiais editoriais do site posteriores ao título — perguntas frequentes, contato telefônico, e-mail e publicidade — foram excluídos por não integrarem a obra antiga.
