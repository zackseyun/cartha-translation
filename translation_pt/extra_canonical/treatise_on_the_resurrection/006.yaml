review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente as distinções entre «o que» foi pensado, «a mente», a Plenitude e o Todo. Contudo, ela elimina os parênteses de incerteza/suprimento em «(the) world», presentes tanto no testemunho quanto na trilha inglesa POB; esse sinal deve ser mantido. A lacuna antes de «veio a existir» também deve ser representada de modo mais neutro como «[ ]», sem converter a lacuna em reticências interpretativas.
  naturalness: O português é claro, moderno e de registro apropriado. «Forte é» e «Fraco é» conservam com êxito o paralelismo enfático. «O que os salvos pensaram» é mais direto e idiomático que «Aquilo que os salvos pensaram», sem alterar o sentido.
  terminology: «salvação», «redenção», «insensatez», «Plenitude» e «Todo» são escolhas consistentes e não impõem uma leitura doutrinária. «(o) mundo» preserva no português a marca editorial do testemunho, ainda que a construção seja deliberadamente marcada por refletir a incerteza textual.
  issues:
  - severity: medium
    issue: O parêntese em «(the) world» foi omitido.
    rationale: O testemunho de base e o English POB registram «(the) world». Omiti-lo apresenta «o mundo» como texto inequívoco e perde uma incerteza ou suplemento editorial relevante.
  - severity: low
    issue: A lacuna «[]» foi convertida em «[...]».
    rationale: Reticências podem sugerir palavras elididas ou suspensão, enquanto o testemunho indica uma lacuna/restauração não especificada. «[ ]» reflete mais precisamente o sinal fornecido.
  revised_text: O que os salvos pensaram não perecerá. A mente dos que conheceram (a salvação) não perecerá. Portanto, fomos escolhidos para a salvação e a redenção, porque desde o princípio estava predeterminado que não cairíamos na insensatez dos ignorantes, mas entraríamos na sabedoria dos que conhecem a verdade. A verdade que eles preservam, de fato, não pode nem poderá perder-se. Forte é o sistema da Plenitude. Fraco é aquilo que se desprendeu e se tornou (o) mundo. O Todo, porém, é o que se preserva. Ele não [ ] veio a existir; já existia.[a]
  revised_footnotes:
  - marker: a
    text: Os colchetes assinalam uma lacuna ou incerteza de restauração no testemunho disponível. Os parênteses em «(a salvação)» e «(o) mundo» preservam elementos assinalados de modo editorial no testemunho de base. A revisão direta do copta ainda está pendente.
    reason: Sinalizar transparentemente a lacuna e preservar as marcações parentéticas do testemunho, sem lhes atribuir uma interpretação mais definida.
  revision_rationale: 'A revisão preserva todas as marcações editoriais relevantes do testemunho de base: a lacuna em «não [ ] veio a existir» e o elemento parentético em «(o) mundo». Também torna a abertura ligeiramente mais direta em português, mantendo o escopo de «What ... have thought».'
