review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês disponível e preserva adequadamente os termos técnicos «Plenitude» e «Todo», bem como a construção impessoal da predeterminação. Contudo, ela elimina a incerteza assinalada em «(the) world» e substitui a lacuna vazia do testemunho («[]») por reticências, alterações que não devem resolver ou caracterizar mais precisamente as marcas textuais.
  naturalness: O português é claro, digno e amplamente legível. «O que os salvos pensaram» é mais natural que «Aquilo que os salvos pensaram», sem reduzir a estranheza conceitual do enunciado.
  terminology: «salvação», «redenção», «insensatez», «Plenitude» e «Todo» são escolhas adequadas. A manutenção de «(a salvação)» e de «(o) mundo» conserva explicitamente as incertezas/suplementos do testemunho de base.
  issues:
  - severity: medium
    issue: A incerteza parentética em «becoming (the) world» foi omitida.
    rationale: '«tornou-se o mundo» apresenta o artigo como seguro, enquanto o testemunho fornecido o põe entre parênteses. A tradução deve preservar essa ambiguidade: «tornando-se (o) mundo».'
  - severity: low
    issue: A lacuna «[]» foi convertida em «[...]».
    rationale: O testemunho disponível assinala uma lacuna sem conteúdo visível entre colchetes. Retê-la como «[ ]» evita sugerir extensão, elipse ou restauração específica não fornecida.
  - severity: low
    issue: A formulação inicial é um pouco pesada em português.
    rationale: «O que os salvos pensaram» exprime o mesmo conteúdo com maior naturalidade que «Aquilo que os salvos pensaram».
  revised_text: O que os salvos pensaram não perecerá. A mente dos que conheceram (a salvação) não perecerá. Portanto, fomos escolhidos para a salvação e a redenção, porque desde o princípio estava predeterminado que não cairíamos na insensatez dos ignorantes, mas entraríamos na sabedoria dos que conhecem a verdade. A verdade que eles preservam, de fato, não pode nem poderá perder-se. Forte é o sistema da Plenitude. Fraco é aquilo que se desprendeu, tornando-se (o) mundo. O Todo, porém, é o que se preserva. Ele não [ ] veio a existir; já existia.[a]
  revised_footnotes:
  - marker: a
    text: Os colchetes assinalam uma lacuna ou incerteza de restauração no testemunho disponível. Os parênteses em «(a salvação)» e «(o) mundo» preservam elementos parentéticos desse testemunho. A revisão direta do copta ainda está pendente.
    reason: Explicar de modo transparente as marcas textuais preservadas e o limite da base de tradução.
  revision_rationale: 'A revisão conserva a estrutura, o registro e a terminologia da proposta, mas restaura as duas marcas de incerteza presentes no testemunho inglês: o artigo parentético antes de «mundo» e a lacuna vazia antes de «veio a existir». Também faz um ajuste idiomático mínimo na abertura.'
