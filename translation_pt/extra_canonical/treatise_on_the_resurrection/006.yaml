id: TRES.006
reference: Treatise on the Resurrection — Chosen for Salvation
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: pt
  text: Aquilo que os salvos pensaram não perecerá. A mente dos que conheceram (a salvação) não perecerá. Portanto, fomos escolhidos para a salvação e a redenção, porque desde o princípio estava predeterminado que não cairíamos na insensatez dos ignorantes, mas entraríamos na sabedoria dos que conhecem a verdade. A verdade que eles preservam, de fato, não pode nem poderá perder-se. Forte é o sistema da Plenitude. Fraco é aquilo que se desprendeu e se tornou o mundo. O Todo, porém, é o que se preserva. Ele não [...] veio a existir; já existia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes com reticências assinalam uma lacuna ou incerteza de restauração no testemunho disponível. A revisão direta do copta ainda está pendente.
    reason: Sinalizar de modo transparente o dano ou a incerteza textual e os limites da base de tradução.
lexical_decisions:
- source_word: thought
  choice: pensaram
  rationale: Mantém a referência ao conteúdo do pensamento dos salvos sem transformá-lo em doutrina, intenção ou fé.
- source_word: mind
  choice: mente
  rationale: Preserva a distinção do testemunho entre aquilo que foi pensado e a mente dos que conheceram.
- source_word: foolishness
  choice: insensatez
  rationale: Expressa falta de discernimento de maneira natural e digna, sem o tom meramente insultuoso de «estupidez».
- source_word: system of the Fullness
  choice: sistema da Plenitude
  rationale: Conserva o vocabulário técnico e a estrutura do testemunho; «Plenitude» recebe inicial maiúscula por funcionar como realidade cosmológica designada.
- source_word: broke loose
  choice: se desprendeu
  rationale: Mantém a imagem de separação sem especificar indevidamente se houve queda, ruptura voluntária ou emanação.
- source_word: the All
  choice: o Todo
  rationale: Preserva a designação abrangente e possivelmente técnica, diferenciando-a de uma simples referência a «tudo».
- source_word: already existed
  choice: já existia
  rationale: Reproduz o contraste entre vir a existir e existência anterior sem acrescentar uma teoria sobre eternidade ou criação.
theological_decisions:
- issue: Conhecimento e salvação
  choice: «os que conheceram (a salvação)»
  alternative: «os que conheceram a salvação»
  rationale: Mantém os parênteses do testemunho, que indicam que «a salvação» é explicitação ou suplemento incerto, evitando apresentá-la como leitura textual segura.
- issue: Predeterminação da escolha
  choice: «desde o princípio estava predeterminado»
  alternative: «desde o princípio Deus havia predestinado»
  rationale: Preserva a construção impessoal e não introduz um agente divino que o testemunho fornecido não nomeia.
- issue: Relação entre a Plenitude, o mundo e o Todo
  choice: Manter «Plenitude», «mundo» e «Todo» como termos distintos
  alternative: Identificar explicitamente o Todo com a Plenitude ou opô-lo ao mundo
  rationale: Evita resolver uma relação cosmológica que a passagem deixa condensada e potencialmente ambígua.
- issue: Estado do Todo
  choice: «é o que se preserva»
  alternative: «foi salvo» ou «permanece intacto»
  rationale: Mantém a linguagem de preservação e sua tensão temporal, sem importar uma leitura soteriológica ou ontológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem marcada em «Forte é...» e «Fraco é...» conserva o paralelismo retórico. A redação é provisória, pois foi preparada a partir do testemunho público em inglês; requer posterior conferência direta com o copta do Códice de Nag Hammadi I,4.
