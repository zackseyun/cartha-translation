translation:
  language: pt
  text: 'Portanto, nunca duvide da ressurreição, meu filho Reginos! Pois, se antes você não vivia na carne, revestiu-se de carne quando entrou neste mundo.


    Por que não se revestiria de carne quando (retornar e) subir ao éon?[a] O que é superior à carne é aquilo que dá vida. Aquilo que veio a existir por sua causa não lhe pertence? E aquilo que lhe pertence não existe com você? Contudo, enquanto está neste mundo, o que lhe falta? É isso que você tanto tem se esforçado para descobrir.


    O que o corpo dá à luz é a velhice,[b] e você se encontra sujeito à mortalidade. Aquilo que lhe falta é um ganho, pois, se partir, você não perderá o que é melhor. O que é pior se desfaz, mas há graça para isso.[c]


    Assim, nada pode nos resgatar deste mundo. Nós, porém, somos o Todo; por isso, somos salvos.[d] Obtivemos a salvação do princípio ao fim. Pensemos dessa maneira. Compreendamos dessa maneira.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éon” translitera um termo técnico que pode indicar uma era, a eternidade ou uma realidade do mundo transcendente. Os parênteses em “(retornar e)” refletem o testemunho inglês utilizado como base provisória.
    reason: Preservar a terminologia e a incerteza editorial do testemunho enquanto a revisão direta do copta permanece pendente.
  - marker: b
    text: 'Lit. no testemunho de base: “o pós-parto do corpo é a velhice”. A imagem é incomum e seu sentido exato é incerto.'
    reason: A formulação “o que o corpo dá à luz” torna a metáfora compreensível, mas a nota registra a expressão mais estranha do testemunho.
  - marker: c
    text: 'Ou: “o que é pior entra em declínio, mas há graça para ele”. O referente pode ser a carne, o corpo ou aquilo que foi chamado de “pior”.'
    reason: Preservar a ambiguidade referencial e semântica.
  - marker: d
    text: 'O testemunho traz uma conexão inferida: “Nós, porém, somos o Todo, (por isso) somos salvos”. “O Todo” pode funcionar como termo técnico neste tratado.'
    reason: Sinalizar que a relação lógica e o sentido técnico não devem ser tratados como plenamente seguros sem consulta direta ao copta.
lexical_decisions:
- source_word: flesh
  choice: carne / revestir-se de carne
  rationale: Mantém o vocabulário antropológico do testemunho e expressa de modo natural a ideia de assumir a carne, sem reduzir o termo a “corpo”.
- source_word: aeon
  choice: éon
  rationale: Preserva o termo técnico e sua possível dimensão cosmológica ou escatológica, em vez de decidir entre “era”, “eternidade” ou um domínio transcendente.
- source_word: the All
  choice: o Todo
  rationale: Conserva a designação totalizante e possivelmente técnica do tratado, sem substituí-la por uma interpretação teológica específica.
- source_word: redeem
  choice: resgatar
  rationale: Reproduz o sentido amplo de libertar ou redimir, evitando restringi-lo de antemão a uma formulação soteriológica denominacional.
- source_word: decline
  choice: se desfaz
  rationale: Comunica deterioração e perecimento em português corrente, preservando o contraste com aquilo que é melhor.
theological_decisions:
- issue: Natureza da ressurreição e relação com a carne
  choice: Preservar tanto “revestiu-se de carne” como a pergunta sobre revestir-se de carne ao subir ao éon.
  alternative: Interpretar explicitamente a passagem como ressurreição corporal ou, ao contrário, puramente espiritual.
  rationale: O trecho mantém uma tensão entre carne, aquilo que lhe é superior e a ascensão; a tradução não deve resolver essa tensão.
- issue: Afirmação “somos o Todo” e conclusão salvífica
  choice: Traduzir literalmente “somos o Todo; por isso, somos salvos”, assinalando a conexão editorialmente suprida.
  alternative: Parafrasear como união com Deus, plenitude eclesial ou identidade metafísica absoluta.
  rationale: Essas paráfrases importariam interpretações não explicitadas pelo testemunho disponível.
- issue: “Nada pode nos resgatar deste mundo”
  choice: Manter a formulação aparentemente paradoxal em relação à frase seguinte.
  alternative: Emendar para “nada deste mundo pode nos resgatar”.
  rationale: Sem revisão direta do copta, não há base segura para eliminar a tensão textual.
- issue: Graça concedida ao que é pior
  choice: Manter o referente aberto em “há graça para isso”.
  alternative: Especificar que a graça é para o corpo, para a carne ou para a pessoa.
  rationale: O antecedente e a força teológica da afirmação permanecem ambíguos no testemunho de base.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas de tratamento brasileiras (“você”) e sintaxe internacionalmente acessível. A redação é provisória porque a base fornecida é um testemunho inglês de domínio público e a revisão direta do copta do Códice de Nag Hammadi I,4 ainda está pendente. Termos técnicos, paradoxos e ambiguidades foram mantidos ou anotados.
