base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: pt
  text: De que modo o Senhor pregou enquanto vivia na carne e depois de se revelar Filho de Deus? Ele habitou neste lugar onde vocês habitam, discorrendo sobre a lei das coisas naturais, à qual eu, porém, chamo “morte”. Reginos, o Filho de Deus era o Filho do Homem. Ele assumiu ambas em si, possuindo humanidade e divindade. Assim, por um lado, como Filho de Deus, podia banir a morte; por outro, como Filho do Homem, trouxe a restauração da Plenitude[a]. Isso ocorreu porque sua origem era do alto, como uma semente da verdade, antes que sua estrutura inferior[b] viesse a existir. Nessa estrutura inferior surgiram muitos domínios e divindades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Plenitude” parece funcionar aqui como termo cosmológico técnico. A revisão direta do copta ainda está pendente.
    reason: Sinaliza ao leitor o provável sentido especializado e a natureza provisória da redação.
  - marker: b
    text: O testemunho inglês fornecido explicita “inferior” entre parênteses; essa explicitação deve ser conferida diretamente no copta.
    reason: Distingue uma provável explicação editorial da evidência textual já confirmada.
lexical_decisions:
- source_word: lived in the flesh
  choice: vivia na carne
  rationale: Mantém a linguagem antropológica e teológica concreta do testemunho, sem reduzi-la a uma simples referência à vida física.
- source_word: law of natural things
  choice: lei das coisas naturais
  rationale: Preserva a formulação incomum e sua possível carga técnica, em vez de normalizá-la sem apoio do copta.
- source_word: took both to himself
  choice: assumiu ambas em si
  rationale: Liga claramente “ambas” à humanidade e à divindade, conservando a afirmação de que as duas pertencem ao Senhor.
- source_word: Fullness
  choice: Plenitude
  rationale: Usa o equivalente português tradicional para um provável termo técnico cosmológico e conserva a inicial maiúscula.
- source_word: dominions
  choice: domínios
  rationale: Mantém a categoria cosmológica abstrata do testemunho inglês sem identificá-la automaticamente com autoridades políticas ou uma ordem angélica específica.
theological_decisions:
- issue: Relação entre “Filho de Deus” e “Filho do Homem”
  choice: “o Filho de Deus era o Filho do Homem”
  alternative: “o Filho de Deus tornou-se o Filho do Homem”
  rationale: O testemunho fornecido afirma identidade com “was”; não se introduz uma mudança temporal ou ontológica ausente na evidência disponível.
- issue: Humanidade e divindade do Senhor
  choice: “assumiu ambas em si, possuindo humanidade e divindade”
  alternative: “reuniu as duas naturezas”
  rationale: Evita importar a terminologia dogmática posterior de “duas naturezas”, ao mesmo tempo que preserva integralmente a dupla atribuição do texto.
- issue: Ações atribuídas aos dois títulos
  choice: Preservar separadamente o banimento da morte como Filho de Deus e a restauração da Plenitude como Filho do Homem
  alternative: Fundir as duas ações numa única declaração cristológica
  rationale: Conserva a tensão e o paralelismo do testemunho sem harmonização teológica.
translation_notes:
  register: Português moderno, digno e legível, com preferência por construções amplamente compreensíveis no Brasil e no espaço lusófono. A redação é provisória porque foi preparada a partir do testemunho inglês de domínio público; a revisão direta do manuscrito copta permanece pendente. Termos cosmológicos incomuns foram preservados em vez de simplificados.
