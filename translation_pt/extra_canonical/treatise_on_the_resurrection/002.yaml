review_pass:
  verdict: revise
  source_fidelity: 'A revisão é necessariamente provisória: o texto de partida disponível é um testemunho inglês público, e a revisão direta do copta permanece pendente. Em relação a esse testemunho, a versão preserva a sequência argumentativa, a identidade entre os títulos, o paralelismo das ações e a terminologia cosmológica. Convém, porém, conservar no corpo do texto os parênteses que assinalam a qualificação editorial «inferior», presente duas vezes no testemunho.'
  naturalness: O registro é claro e digno. «Assumiu ambas em si» soa pouco idiomático em português moderno; «assumiu ambas — humanidade e divindade —» é mais natural e torna explícito o antecedente sem introduzir terminologia dogmática. «Revelar-se Filho de Deus» também fica mais natural como «revelar ser o Filho de Deus».
  terminology: «Carne», «Filho de Deus», «Filho do Homem», «Plenitude», «humanidade», «divindade» e «domínios» são escolhas adequadas e cautelosas. «Plenitude» deve manter maiúscula e nota, pois provavelmente representa termo cosmológico técnico. A descrição «inferior» deve continuar marcada como explicitação do testemunho inglês, não como dado já confirmado pelo copta.
  issues:
  - severity: medium
    issue: Os parênteses em torno de «inferior» foram eliminados no texto traduzido.
    rationale: O testemunho inglês marca «(his lower) structure» e «(lower structure)» como qualificação parentética. Suprimi-los transforma uma explicitação possivelmente editorial em afirmação não marcada do texto.
  - severity: low
    issue: «Ele assumiu ambas em si» é construção pouco natural e deixa o referente de «ambas» menos transparente.
    rationale: A revisão pode explicitar, por aposição, que se trata de humanidade e divindade, mantendo o sentido do testemunho e evitando o vocabulário teológico posterior de «naturezas».
  - severity: low
    issue: «Depois de se revelar Filho de Deus» omite a construção verbal expressa no testemunho.
    rationale: «Depois de revelar ser o Filho de Deus» representa com maior clareza «after he revealed himself to be the Son of God».
  revised_text: De que modo o Senhor pregou enquanto vivia na carne e depois de revelar ser o Filho de Deus? Ele viveu neste lugar onde vocês vivem, discorrendo sobre a lei das coisas naturais, à qual eu, porém, chamo “morte”. Reginos, o Filho de Deus era o Filho do Homem. Ele assumiu ambas — humanidade e divindade. Assim, por um lado, como Filho de Deus, podia banir a morte; por outro, como Filho do Homem, trouxe a restauração da Plenitude[a]. Isso ocorreu porque sua origem era do alto, como uma semente da verdade, antes que sua estrutura (inferior)[b] viesse a existir. Nessa estrutura (inferior), vieram a existir muitos domínios e divindades.
  revised_footnotes:
  - marker: a
    text: “Plenitude” parece funcionar aqui como termo cosmológico técnico. A revisão direta do copta ainda está pendente.
    reason: Sinaliza ao leitor o provável sentido especializado e a natureza provisória da redação.
  - marker: b
    text: O testemunho inglês fornecido coloca “inferior” entre parênteses nas duas ocorrências de “estrutura”; essa explicitação deve ser conferida diretamente no copta.
    reason: Distingue uma provável explicação editorial da evidência textual já confirmada.
  revision_rationale: A revisão preserva as ambiguidades e a estrutura do testemunho inglês, melhora três construções portuguesas e restitui os parênteses que qualificam «inferior». Não resolve por conjectura questões que dependem do copta, especialmente o estatuto textual dessa qualificação e o valor técnico de «Plenitude».
