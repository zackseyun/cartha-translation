review_pass:
  verdict: revise
  source_fidelity: 'A tradução segue de perto o testemunho inglês fornecido e preserva adequadamente suas tensões: a ressurreição como realidade presente, a morte já ocorrida e o referente indeterminado de “este elemento”. Contudo, “já chegado” é elíptico e pouco natural em português, e a relação introduzida por “assim” não está expressa no testemunho.'
  naturalness: O registro é em geral moderno e claro. “Cativeiros” comunica melhor, no plural, a ideia de sujeições do que “servidões”, e “já tendo chegado” torna inteligível a construção sem especificar o destino.
  terminology: “Ressurreição”, “carne”, “mortal”, “erro”, “princípio” e “elemento” são escolhas adequadas. A nota de “elemento” preserva corretamente a ambiguidade do testemunho provisório.
  issues:
  - severity: medium
    issue: “já chegado” é uma construção elíptica e pouco idiomática.
    rationale: O inglês “having arrived” requer em português uma forma participial mais clara. “Já tendo chegado” preserva a elipse quanto ao destino, sem acrescentar um referente interpretativo.
  - severity: low
    issue: “Assim” introduz uma inferência não explicitada.
    rationale: O testemunho apenas coordena o treinamento com a libertação subsequente; retirar “assim” evita reforçar uma relação causal.
  - severity: low
    issue: “Servidões” é menos preciso e menos natural neste contexto.
    rationale: “Cativeiros” transmite com maior clareza a ideia plural de vínculos de sujeição expressa por “bondages”, sem impor leitura doutrinária.
  revised_text: 'Portanto, ó Regino, não pense em verdades parciais nem viva segundo esta carne apenas para concordar com os outros. Em vez disso, fuja das divisões e dos cativeiros, e você experimentará a ressurreição agora. Pois, se aquilo que é mortal sabe que morrerá, ainda que passe muitos anos nesta vida, chega a isto: por que não considerar a si mesmo ressuscitado e já tendo chegado?


    Se você possui a ressurreição, por que continua agindo como se ainda fosse morrer? Saiba que você já está morto. Você não percebe isso por falta de preparo. Convém que todos se exercitem de diversas maneiras, e serão libertos deste elemento[a], para que não caiam no erro, mas recebam novamente aquilo que existia desde o princípio.'
  revised_footnotes:
  - marker: a
    text: '“Deste elemento”: expressão ambígua no testemunho disponível; pode indicar um domínio, condição ou componente, mas o referente exato não é especificado.'
    reason: A revisão direta do copta ainda está pendente, e o próprio testemunho inglês preserva a ambiguidade.
  revision_rationale: Foram feitas apenas correções seguras de idiomaticidade e de conexão lógica. A revisão continua provisória, pois a base disponibilizada é um testemunho inglês público e a revisão direta do copta ainda está pendente.
