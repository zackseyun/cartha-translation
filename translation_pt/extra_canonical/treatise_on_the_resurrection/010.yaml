review_pass:
  verdict: revise
  source_fidelity: A versão segue de perto o testemunho inglês público fornecido. Mantém adequadamente a linguagem paradoxal sobre a ressurreição presente, a morte já ocorrida e o referente não especificado de “este elemento”. A revisão direta do copta permanece pendente; portanto, esta avaliação de fidelidade é necessariamente provisória.
  naturalness: O texto é claro e de registro apropriado, mas “considerar a si mesmo ressuscitado e já chegado” não é idiomático em português moderno. “Considere-se ressuscitado e como quem já chegou” conserva a formulação elíptica e melhora a fluência.
  terminology: “Ressurreição”, “carne”, “servidões” e “elemento” são defensáveis e preservam as escolhas e ambiguidades do testemunho. O nome deve ser mantido como “Rheginos”, em consonância com a forma do testemunho e com o caráter de nome próprio antigo, sem uma aportuguesação não documentada no material fornecido.
  issues:
  - severity: medium
    issue: Forma do nome próprio
    rationale: “Regino” é uma adaptação não apoiada pelo testemunho fornecido, que traz “Rheginos”. Manter a forma testemunhada evita uma normalização onomástica sem confirmação do copta ou de uma convenção editorial portuguesa estabelecida.
  - severity: low
    issue: Construção pouco natural em “já chegado”
    rationale: Embora reflita literalmente “having arrived”, “já chegado” soa truncado em português. “Como quem já chegou” preserva a ideia de chegada já realizada, sem especificar a que destino se chegou.
  revised_text: 'Portanto, ó Rheginos, não pense em verdades parciais nem viva segundo esta carne apenas para concordar com os outros. Em vez disso, fuja das divisões e das servidões, e você experimentará a ressurreição agora. Pois, se aquilo que é mortal sabe que morrerá, ainda que passe muitos anos nesta vida, chega a isto: por que não se considerar ressuscitado e como quem já chegou?



    Se você possui a ressurreição, por que continua agindo como se ainda fosse morrer? Saiba que você já está morto. Você não percebe isso por falta de preparo. Convém que todos se exercitem de diversas maneiras; assim, serão libertos deste elemento[a], para que não caiam no erro, mas recebam novamente aquilo que existia desde o princípio.'
  revised_footnotes:
  - marker: a
    text: '“Deste elemento”: expressão ambígua no testemunho disponível; pode indicar um domínio, condição ou componente, mas o referente exato não é especificado.'
    reason: A revisão direta do copta ainda está pendente, e o próprio testemunho inglês preserva a ambiguidade.
  revision_rationale: 'A revisão limita-se a duas correções seguras: restaura “Rheginos”, a forma do nome no testemunho de controle, e substitui a expressão não idiomática “já chegado” por “como quem já chegou”. Conservam-se as ambiguidades teológicas e referenciais, inclusive “deste elemento”, com sua nota ancorada.'
