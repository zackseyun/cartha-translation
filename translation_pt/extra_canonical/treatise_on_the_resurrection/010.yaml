translation:
  language: pt
  text: 'Portanto, ó Regino, não pense em verdades parciais nem viva segundo esta carne apenas para concordar com os outros. Em vez disso, fuja das divisões e das servidões, e você experimentará a ressurreição agora. Pois, se aquilo que é mortal sabe que morrerá, ainda que passe muitos anos nesta vida, chega a isto: por que não considerar a si mesmo ressuscitado e já chegado?


    Se você possui a ressurreição, por que continua agindo como se ainda fosse morrer? Saiba que você já está morto. Você não percebe isso por falta de preparo. Convém que todos se exercitem de diversas maneiras; assim, serão libertos deste elemento[a], para que não caiam no erro, mas recebam novamente aquilo que existia desde o princípio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Deste elemento”: expressão ambígua no testemunho disponível; pode indicar um domínio, condição ou componente, mas o referente exato não é especificado.'
    reason: A revisão direta do copta ainda está pendente, e o próprio testemunho inglês preserva a ambiguidade.
lexical_decisions:
- source_word: partial (truths)
  choice: verdades parciais
  rationale: Preserva a interpretação explicitada no testemunho inglês, mas sem tornar a frase excessivamente técnica.
- source_word: bondages
  choice: servidões
  rationale: Expressa condições de sujeição ou escravidão e mantém o plural do testemunho.
- source_word: experience the resurrection now
  choice: experimentará a ressurreição agora
  rationale: Mantém a afirmação enfática de uma experiência presente da ressurreição, sem reduzi-la a mera compreensão intelectual.
- source_word: training / train
  choice: preparo / se exercitem
  rationale: Usa termos naturais em português para a ideia de disciplina ou formação, evitando a conotação predominantemente profissional de 'treinamento'.
- source_word: this element
  choice: deste elemento
  rationale: Conserva a expressão ambígua do testemunho em vez de identificar seu referente sem apoio textual suficiente.
- source_word: what was from the beginning
  choice: aquilo que existia desde o princípio
  rationale: Mantém indeterminado o objeto a ser novamente recebido e preserva a referência às origens.
theological_decisions:
- issue: Ressurreição como realidade presente
  choice: experimentará a ressurreição agora / possui a ressurreição
  alternative: compreenderá agora a ressurreição
  rationale: O testemunho apresenta a ressurreição como experiência ou posse atual; a tradução preserva essa tensão com a mortalidade futura.
- issue: Declaração de morte já ocorrida
  choice: você já está morto
  alternative: você já morreu
  rationale: A formulação com estado presente reproduz a tensão do texto sem explicar se a morte é espiritual, simbólica ou de outra natureza.
- issue: Referente de 'este elemento'
  choice: deste elemento
  alternative: deste mundo / deste corpo
  rationale: O referente permanece incerto no testemunho fornecido; não se deve impor uma interpretação cosmológica ou antropológica específica.
- issue: Restauração do que era desde o princípio
  choice: recebam novamente aquilo que existia desde o princípio
  alternative: recuperem sua condição original
  rationale: Evita definir o conteúdo da restauração e conserva a indeterminação teológica do texto.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para reproduzir a interpelação direta. O nome Rheginos foi vertido na forma portuguesa “Regino”. Esta versão é provisória, baseada no testemunho inglês público fornecido; requer revisão direta do copta do Códice de Nag Hammadi I,4.
