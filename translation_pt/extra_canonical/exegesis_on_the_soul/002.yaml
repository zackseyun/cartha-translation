lexical_decisions:
- source_word: prostitution / harlotry
  choice: prostituição / prostituir-se
  rationale: Mantém o campo metafórico sexual que estrutura toda a passagem e sua aplicação tanto corporal quanto espiritual, sem suavizá-lo com termos abstratos.
- source_word: shepherds
  choice: pastores
  rationale: Preserva a imagem e a possível ambiguidade da testemunha, sem substituí-la por “amantes” ou “governantes”.
- source_word: perceptible realm
  choice: domínio perceptível
  rationale: Expressa a esfera acessível aos sentidos em português corrente, sem impor terminologia filosófica mais específica do que a testemunha permite.
- source_word: men great of flesh
  choice: homens de muita carne
  rationale: Conserva a formulação corporal incomum e sua ligação com a interpretação subsequente sobre o reino da carne.
- source_word: senseless external things
  choice: coisas exteriores e insensíveis
  rationale: Mantém a possibilidade de “sem sensação” ou “não senciente”, evitando interpretar automaticamente como “coisas sem sentido”.
- source_word: world rulers
  choice: governantes mundiais
  rationale: Reproduz o valor literal da expressão citada sem harmonizá-la com traduções bíblicas confessionais tradicionais.
- source_word: having sex
  choice: tendo relações sexuais
  rationale: Emprega linguagem moderna, clara e digna, preservando a explicitude da imagem da fonte.
theological_decisions:
- issue: Prostituição como metáfora espiritual
  choice: Preservar explicitamente tanto a dimensão corporal quanto a da alma
  alternative: Traduzir a ocorrência espiritual como “infidelidade” ou “idolatria”
  rationale: O autor desenvolve deliberadamente a tensão entre prostituição sexual e espiritual; resolver a metáfora eliminaria uma parte central do argumento.
- issue: Interpretação dos “filhos do Egito”
  choice: Manter a explicação do autor como pergunta retórica
  alternative: Reformular como afirmação doutrinária direta sobre matéria ou pecado
  rationale: Preserva a forma argumentativa e não amplia a cosmologia além do testemunho disponível.
- issue: Origem da prostituição corporal
  choice: Afirmar, conforme o texto, que ela se origina da prostituição da alma
  alternative: Suavizar para mera associação entre ambas
  rationale: A relação causal é teologicamente relevante no tratado e deve permanecer, ainda que possa gerar tensão para leitores modernos.
- issue: Leitura espiritual de 1 Coríntios e Efésios
  choice: Atribuir a leitura espiritual ao autor com “Nesse caso, ele está falando espiritualmente”
  alternative: Apresentá-la como sentido indiscutível das epístolas
  rationale: Distingue a interpretação do tratado da própria citação bíblica e evita impor sua exegese como consenso.
- issue: Juízo sobre o sofrimento da alma
  choice: “ela sofrerá o que merece”
  alternative: Atenuar para “sofrerá as consequências”
  rationale: A testemunha expressa merecimento ou retribuição; a formulação mais branda reduziria a força teológica do encerramento.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom digno e direto. A tradução é provisória porque a revisão direta do copta está pendente e a base disponível é uma testemunha inglesa de domínio público. As citações bíblicas seguem a forma particular preservada no tratado, sem harmonização com versões canônicas modernas; restaurações e lacunas foram assinaladas por notas.
