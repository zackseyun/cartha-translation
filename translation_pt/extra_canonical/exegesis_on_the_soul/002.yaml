  text: 'Now, concerning the prostitution of the soul, the Holy Spirit prophesies in many places, saying through the prophet Jeremiah:


    “If a husband divorces his wife, and she goes and takes another man, can she return to him again? Has that woman not completely defiled herself? ‘And you prostituted yourself to many shepherds, and you returned to me,’ said the Lord. ‘Look carefully and see where you prostituted yourself. Were you not sitting in the streets, polluting the land with your prostitution and wickedness? And you took many shepherds as a stumbling block for yourself. You were shameless with everyone. You did not call on me as a relative, or as a father, or as the guardian of your virginity.’” (Jeremiah 3:1–4)


    Again, it is written in the prophet Hosea:


    “Come, bring charges against your mother, for she will not be a wife to me, and I will not be a husband to her. I will remove her prostitution from before me, and I will remove her adultery from between her breasts. I will strip her naked as on the day she was born, and I will make her a wilderness, like a land without water, and I will make her [yearn in childlessness]. I will not have compassion on her children, for they are children of prostitution, because their mother prostituted herself and [acted shamefully toward her children]. [] For she said, ‘I will prostitute myself to my lovers. They gave me my bread and my water, my clothing and my garments, my wine and my oil, and everything I needed.’ Therefore, look: I will close them in so that she cannot run after her lovers. When she seeks them but does not find them, she will say, ‘I will return to my former husband; I was better off then than I am now.’” (Hosea 2:2–7)


    Again, he says in Ezekiel:


    “‘After much wickedness,’ said the Lord, ‘you built a brothel and made a place for your beauty in the streets. You built brothels on every street, squandered your beauty, spread your legs in every alley, and multiplied your acts of prostitution. You prostituted yourself to the sons of Egypt, your neighbors, men great in flesh.’” (Ezekiel 16:23–26)


    What, then, does “the sons of Egypt, men great in flesh” mean, except the kingdom of the flesh, the perceptible realm, and earthly affairs? These defile the soul here, as she obtains from them bread, as well as wine, oil, garments, and other senseless external things surrounding the body—things she believes are necessary for her.


    Concerning this prostitution, however, the Savior’s apostles insisted, “Guard yourselves from it; purify yourselves from it.” This applies not only to bodily prostitution, but especially to the prostitution of the soul. For this reason, the apostles write [to the churches] of God, so that [this kind (of prostitution)] might not happen among us.


    Nevertheless, the most difficult [challenge] concerns the prostitution [] of the soul. Bodily prostitution also originates from it. Therefore Paul, writing to the Corinthians, said, “I wrote to you in the letter, ‘Do not associate with prostitutes’—not at all referring to the prostitutes of this world, or the greedy, or robbers, or idolaters, because then you would need to leave the world.” (1 Corinthians 5:9–10) In this case he is speaking spiritually: “For our struggle is not against flesh and blood,” as he said, “but against the world rulers of this darkness and the spirits of wickedness.” (Ephesians 6:12)


    For as long as the soul continues running everywhere, having sex with everyone she meets and defiling herself, she suffers what she deserves.'
translation:
  language: pt
  text: 'Agora, quanto à prostituição da alma, o Espírito Santo profetiza em muitos lugares, dizendo por meio do profeta Jeremias:


    “Se um marido se divorcia de sua mulher, e ela vai e toma outro homem, poderá ela voltar novamente para ele? Essa mulher não se contaminou por completo? ‘E você se prostituiu com muitos pastores e voltou para mim’, disse o Senhor. ‘Olhe atentamente e veja onde você se prostituiu. Não estava sentada nas ruas, contaminando a terra com suas prostituições e sua maldade? E você tomou muitos pastores como pedra de tropeço para si. Com todos agiu sem vergonha. Não me invocou como parente, nem como pai, nem como guardião de sua virgindade.’” (Jeremias 3:1–4)


    Novamente, está escrito no profeta Oseias:


    “Venham, apresentem acusação contra sua mãe, pois ela não será minha esposa, e eu não serei seu marido. Tirarei de diante de mim a prostituição dela e tirarei de entre seus seios o seu adultério. Eu a deixarei nua como no dia em que nasceu; farei dela um deserto, como uma terra sem água, e a farei [ansiar em sua esterilidade].[a] Não terei compaixão de seus filhos, pois são filhos de prostituição, porque sua mãe se prostituiu e [agiu vergonhosamente para com seus filhos].[b] [c] Pois ela disse: ‘Vou me prostituir com meus amantes. Eles me deram meu pão e minha água, minhas vestes e minhas roupas, meu vinho e meu azeite e tudo aquilo de que eu precisava.’ Portanto, vejam: eu os cercarei, para que ela não possa correr atrás de seus amantes. Quando os procurar e não os encontrar, dirá: ‘Voltarei para meu primeiro marido, pois eu estava melhor naquele tempo do que agora.’” (Oseias 2:2–7)


    Novamente, ele diz em Ezequiel:


    “‘Depois de muita maldade’, disse o Senhor, ‘você construiu um prostíbulo e fez nas ruas um lugar para sua beleza. Construiu prostíbulos em todas as ruas, desperdiçou sua beleza, abriu as pernas em todos os becos e multiplicou seus atos de prostituição. Você se prostituiu com os filhos do Egito, seus vizinhos, homens de muita carne.’” (Ezequiel 16:23–26)


    O que, então, significa “os filhos do Egito, homens de muita carne”, senão o reino da carne, o domínio perceptível e os afazeres terrenos? Essas coisas contaminam a alma aqui, enquanto ela obtém delas pão, além de vinho, azeite, roupas e outras coisas exteriores e insensíveis que cercam o corpo — coisas que ela acredita serem necessárias.


    Quanto a essa prostituição, porém, os apóstolos do Salvador insistiram: “Guardem-se dela; purifiquem-se dela”. Isso se refere não somente à prostituição do corpo, mas sobretudo à prostituição da alma. Por essa razão, os apóstolos escrevem [às igrejas][d] de Deus, para que [esse tipo de prostituição][e] não aconteça entre nós.


    No entanto, o [desafio][f] mais difícil diz respeito à prostituição [g] da alma. Dela também se origina a prostituição do corpo. Por isso Paulo, escrevendo aos coríntios, disse: “Eu lhes escrevi na carta: ‘Não se associem com pessoas que se prostituem’ — não me referia de modo algum às pessoas deste mundo que se prostituem, nem aos gananciosos, ladrões ou idólatras, pois nesse caso vocês teriam de sair do mundo”. (1 Coríntios 5:9–10) Nesse caso, ele está falando espiritualmente: “Pois nossa luta não é contra carne e sangue”, como disse, “mas contra os governantes mundiais destas trevas e contra os espíritos da maldade”. (Efésios 6:12)


    Pois, enquanto a alma continuar correndo por toda parte, tendo relações sexuais com todos os que encontra e contaminando a si mesma, ela sofrerá o que merece.


    [a] O texto preservado ou sua reconstrução é incerto; a expressão entre colchetes segue provisoriamente a testemunha inglesa fornecida.

    [b] A redação é incerta e pode refletir texto danificado ou restauração editorial.

    [c] Os colchetes vazios na testemunha indicam uma lacuna no manuscrito, cujo conteúdo não pode ser recuperado com segurança.

    [d] Expressão restaurada editorialmente na testemunha utilizada.

    [e] Expressão explicativa restaurada editorialmente na testemunha utilizada.

    [f] Palavra suprida para completar o sentido de uma passagem danificada.

    [g] Há uma lacuna ou palavra ilegível depois de “prostituição” na testemunha utilizada.'
