base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/005.yaml
  text: 'And so it is right to pray to the Father and call on him with our whole soul, sighing not outwardly with our lips, but with the inward spirit that comes from the depths. We must repent of the former life we lived, confess our sins, recognize the empty lie in which we lived and our hollow zealotry, wail because of the darkness and the wave that engulfed us, and weep for ourselves so that he may have compassion on us, hating ourselves because of what we are now.


    The Savior said again:


    “Blessed are those who mourn, for they will be shown pity.

    Blessed are those who are hungry, for they will be filled.” (Matthew 5:4,6; Luke 6:21)


    He also said, “If someone does not hate his soul, he cannot follow me.” (Luke 14:26)


    This is because repentance is the beginning of salvation. And so, “Before Christ appeared, John came, preaching the baptism of repentance.” (Acts 13:24)


    Repentance takes place in pain and sorrow. The Father, however, is good and loves humanity. He listens to the soul that calls on him and sends it the light of salvation. Therefore, through the Spirit he said to the prophet:


    Say to the children of my people:

    “[If] your sins reach [from earth to] heaven,

    and if they are [red] as scarlet,

    and blacker than sackcloth,

    [and if] [] you return to me with your whole soul,

    and say to me, ‘My Father!’

    I will listen to you as a holy people.” (1 Clement 8:3)


    Yet another passage says, “Thus says the Lord, the Holy One of Israel: ‘If you return and weep, then you will be saved, and you will know where you were when you put your hope in what is empty.’” (Isaiah 30:15)


    And in another passage he said:


    Jerusalem wept greatly, saying, “Have pity on me.” He will be gracious to you at the sound of your weeping. When he saw, he answered you. The Lord will give you bread of adversity and water of affliction. From now on, those who lie to you will no longer approach you. Your eyes will see those who lie to you. (Isaiah 30:19-20)


    And so it is right to pray to God both night and day, stretching out our hands to him like those sailing in the middle of the sea. They pray to God with their whole heart and without duplicity, because those who pray with duplicity only lie to themselves. Indeed, so that he may know who deserves salvation, God examines the inward parts and searches the depths of the heart. For no one who is still in love with the place of lies deserves salvation.'
translation:
  language: pt
  text: 'Por isso, é apropriado orar ao Pai e invocá-lo com toda a nossa alma, suspirando não exteriormente, com os lábios, mas com o espírito interior que vem das profundezas. Devemos nos arrepender da vida que levávamos antes, confessar nossos pecados, reconhecer a mentira vazia em que vivíamos e nosso zelo sem fundamento, lamentar por causa da escuridão e da onda que nos engoliu e chorar por nós mesmos, para que ele tenha compaixão de nós, odiando a nós mesmos por aquilo que somos agora.


    O Salvador disse também:


    “Felizes os que choram, pois receberão compaixão.

    Felizes os que têm fome, pois serão saciados.” (Mateus 5:4,6; Lucas 6:21)


    Ele disse ainda: “Se alguém não odeia a própria alma, não pode me seguir.”[a] (Lucas 14:26)


    Isso porque o arrependimento é o começo da salvação. Por isso, “Antes de Cristo aparecer, João veio pregando o batismo de arrependimento”. (Atos 13:24)


    O arrependimento acontece em meio à dor e à tristeza. O Pai, porém, é bom e ama a humanidade. Ele ouve a alma que o invoca e lhe envia a luz da salvação. Por isso, mediante o Espírito, disse ao profeta:


    Digam aos filhos do meu povo:


    “[Se] os seus pecados chegarem [da terra até] o céu,

    e se forem [vermelhos] como escarlate

    e mais negros que o pano de saco,

    [e se] […] vocês voltarem para mim com toda a sua alma

    e me disserem: ‘Meu Pai!’,

    eu os ouvirei como um povo santo.”[b] (1 Clemente 8:3)


    Outra passagem diz: “Assim diz o Senhor, o Santo de Israel: ‘Se vocês voltarem e chorarem, serão salvos e saberão onde estavam quando depositavam a esperança no que é vazio’”.[c] (Isaías 30:15)


    E, em outra passagem, ele disse:


    Jerusalém chorou muito, dizendo: “Tenha compaixão de mim”. Ele terá misericórdia de você ao ouvir o som do seu choro. Quando viu, respondeu a você. O Senhor lhes dará pão de adversidade e água de aflição. De agora em diante, os que mentem para vocês não voltarão a se aproximar. Seus olhos verão os que mentem para vocês.[d] (Isaías 30:19-20)


    Por isso, é apropriado orar a Deus tanto de noite como de dia, estendendo as mãos para ele como fazem os que navegam em alto-mar. Eles oram a Deus de todo o coração e sem duplicidade, pois os que oram com duplicidade apenas mentem para si mesmos. De fato, para saber quem é digno da salvação, Deus examina o íntimo e sonda as profundezas do coração. Pois ninguém que ainda ame o lugar da mentira é digno da salvação.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Odiar a própria alma” reproduz a formulação do tratado. No contexto da referência a Lucas 14:26, “alma” também pode envolver a própria vida ou o próprio ser; a tradução mantém a tensão da expressão.
    reason: Esclarecer uma expressão antropológica e teológica forte sem suavizá-la no corpo do texto.
  - marker: b
    text: A citação é atribuída a 1 Clemente 8:3 e combina linguagem associada a diferentes passagens proféticas. Os colchetes indicam palavras restauradas ou lacunas no testemunho fornecido; […] assinala uma lacuna sem conteúdo preservado.
    reason: Preservar os sinais de dano ou restauração e evitar que o leitor tome a citação como reprodução exata de um único texto bíblico.
  - marker: c
    text: Esta forma de Isaías 30:15 difere das redações bíblicas mais conhecidas. Ela foi traduzida conforme aparece no tratado, sem harmonização.
    reason: Sinalizar uma importante divergência textual da citação.
  - marker: d
    text: A redação atribuída a Isaías 30:19-20 difere consideravelmente do texto bíblico corrente e alterna entre singular e plural. Essas características foram preservadas tanto quanto o português permite.
    reason: Explicar a forma incomum e as mudanças de número presentes no testemunho.
lexical_decisions:
- source_word: soul
  choice: alma
  rationale: Preserva a terminologia antropológica recorrente do tratado sem reduzi-la a “vida” ou “ser”, especialmente onde a alma é tratada como sujeito que invoca o Pai.
- source_word: repentance
  choice: arrependimento
  rationale: É a forma portuguesa mais natural e reconhecível para a mudança penitencial descrita no texto e para a expressão bíblica “batismo de arrependimento”.
- source_word: hollow zealotry
  choice: zelo sem fundamento
  rationale: Comunica um fervor vazio ou infundado sem importar a conotação política moderna que “fanatismo” poderia trazer.
- source_word: duplicity
  choice: duplicidade
  rationale: Mantém a ideia de coração dividido ou insincero e sua oposição à oração feita “de todo o coração”.
- source_word: inward parts
  choice: o íntimo
  rationale: Produz português corrente e digno, preservando a imagem de exame da interioridade humana.
- source_word: place of lies
  choice: lugar da mentira
  rationale: Mantém a formulação espacial e possivelmente simbólica do tratado, sem identificar de modo interpretativo qual seria esse lugar.
theological_decisions:
- issue: “odiar a própria alma”
  choice: Manter literalmente “odeia a própria alma”
  alternative: “não renuncia à própria vida” ou “não aborrece a si mesmo”
  rationale: A redação do tratado emprega “alma” e apresenta uma afirmação teologicamente tensa. Uma paráfrase resolveria indevidamente a ambiguidade.
- issue: Dignidade para receber salvação
  choice: Traduzir como “quem é digno da salvação”
  alternative: “quem merece a salvação”
  rationale: “Digno” preserva a linguagem avaliativa do testemunho sem enfatizar uma teoria específica de mérito salvífico.
- issue: Relação entre arrependimento e salvação
  choice: Preservar “o arrependimento é o começo da salvação”
  alternative: Explicar o arrependimento como causa, condição ou simples evidência da salvação
  rationale: O texto afirma uma relação inicial, mas não define seu mecanismo; a tradução não deve acrescentar uma sistematização doutrinária.
- issue: Citações bíblicas divergentes
  choice: Traduzir a forma citada pelo tratado
  alternative: Substituir pelo texto de uma Bíblia portuguesa moderna
  rationale: As citações são parte da argumentação e da forma textual deste escrito; harmonizá-las apagaria diferenças reais do testemunho antigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução segue provisoriamente o testemunho público em inglês, pois a revisão direta do copta ainda está pendente. Mantêm-se imagens e tensões do tratado, bem como as referências fornecidas. Colchetes sinalizam restaurações; a lacuna vazia foi representada por […].
