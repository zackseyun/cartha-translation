translation:
  language: pt
  text: 'Israel certamente não teria sido visitado no princípio, para ser resgatado da terra do Egito, da casa da escravidão, se não tivesse gemido diante de Deus e lamentado sob a tirania de sua servidão.


    Também nos Salmos está escrito:


    Fiquei extremamente exausto de tanto gemer.

    Todas as noites inundarei de lágrimas

    minha cama e meu leito.

    Envelheci em meio a todos os meus inimigos.

    Afastem-se de mim, todos vocês que praticam o mal,

    pois eis que o Senhor ouviu a voz do meu pranto,

    e o Senhor acolheu a minha oração. (Salmo 6:6–9)


    Se nos arrependermos, Deus certamente nos ouvirá — ele, que é paciente e riquíssimo em misericórdia. A ele seja a glória para todo o sempre. Amém!


    A Exegese da Alma'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visited
  choice: visitado
  rationale: Preserva a linguagem bíblica de visitação divina, que pode envolver atenção, intervenção e socorro, sem reduzir o sentido apenas a 'ajudado'.
- source_word: house of bondage
  choice: casa da escravidão
  rationale: Mantém a expressão bíblica tradicional e sua imagem concreta, em português moderno e inteligível.
- source_word: moaned over the tyranny of its slavery
  choice: lamentado sob a tirania de sua servidão
  rationale: Expressa sofrimento sob opressão e evita a formulação pouco natural de 'lamentar sobre' em português.
- source_word: cry of my weeping
  choice: voz do meu pranto
  rationale: Conserva a imagem semítica de um pranto que chega aos ouvidos de Deus.
- source_word: richly merciful
  choice: riquíssimo em misericórdia
  rationale: Reproduz a intensidade do testemunho e mantém o registro devocional solene.
- source_word: The Exegesis on the Soul
  choice: A Exegese da Alma
  rationale: Título claro e natural em português, correspondente ao nome consagrado da obra.
theological_decisions:
- issue: Sentido da visitação de Israel
  choice: visitado
  alternative: socorrido
  rationale: A opção escolhida preserva a amplitude teológica da visitação divina e não identifica antecipadamente a visita apenas com uma modalidade de auxílio.
- issue: Relação entre arrependimento e escuta divina
  choice: Se nos arrependermos, Deus certamente nos ouvirá
  alternative: Quando nos arrependemos, Deus nos ouve
  rationale: Mantém a construção condicional e a certeza enfática do testemunho, sem formular uma regra teológica mais abrangente do que o texto.
- issue: Doxologia final
  choice: A ele seja a glória para todo o sempre
  alternative: A quem seja a glória pelos séculos dos séculos
  rationale: Preserva a referência a Deus e o sentido eterno em linguagem digna e amplamente compreensível.
translation_notes:
  register: Português moderno, solene e acessível, com cadência bíblica moderada. A citação do Salmo foi traduzida conforme o testemunho inglês fornecido, sem harmonização silenciosa com versões bíblicas portuguesas. Material de navegação do site, contato e divulgação comercial foi corretamente excluído. Trata-se de versão provisória baseada no testemunho inglês de domínio público; a revisão direta do copta do Códice de Nag Hammadi II,6 continua pendente.
