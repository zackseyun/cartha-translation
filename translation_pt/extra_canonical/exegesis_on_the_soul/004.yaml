  verdict: revise
  source_fidelity: 'A revisão é necessariamente provisória: o copta não foi fornecido e a base disponível é o testemunho inglês. A redação proposta preserva a argumentação, as ambiguidades relacionais e teológicas, as citações na forma do testemunho e, sobretudo, distingue restaurações entre colchetes de lacunas assinaladas por colchetes vazios ([]).'
  naturalness: O português é moderno, legível e mantém um registro elevado sem arcaísmo excessivo. Foram ajustados alguns pontos de fluência e precisão, como “Convém” para “It is appropriate”, “senhor primordial” para “original master” e a expressão da sequência ascensional.
  terminology: “Casamento”, “alma”, “Pai”, “Senhor”, “Espírito”, “natureza divina”, “ressurreição” e “redenção” foram mantidos sem harmonização confessional. “Pai” no último membro da sequência foi conservado em minúscula (“pai”), acompanhando a distinção gráfica do testemunho inglês.
  issues:
  - severity: medium
    issue: Lacunas vazias do testemunho foram transformadas em reticências entre colchetes.
    rationale: O testemunho apresenta [] em três posições. Substituí-las por [...] altera o sinal editorial transmitido e conflita com a nota que distingue lacunas de palavras restauradas.
  - severity: low
    issue: “É necessário” intensifica “It is appropriate”.
    rationale: “É necessário” comunica obrigação; “Convém” conserva melhor o valor de conveniência/adequação do testemunho.
  - severity: low
    issue: A nota de rodapé a descreve lacunas como “reticências entre colchetes”.
    rationale: Como o texto-base usa colchetes vazios, a explicação deve corresponder exatamente ao sinal preservado.
  revised_text: '**A união matrimonial da alma**[a]


    Como esse casamento é diferente do casamento carnal, os que terão relações sexuais um com o outro se contentarão com esse tipo de relação sexual. E, como se fosse um peso, deixam para trás o incômodo do desejo do corpo, [afastando o rosto] um do outro. Este casamento, porém, [é diferente]. Quando, porém, se unem [um ao outro], tornam-se uma só vida.


