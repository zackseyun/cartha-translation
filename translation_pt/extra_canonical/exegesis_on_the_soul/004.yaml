    Pois, inicialmente, estavam unidos um ao outro quando habitavam com o Pai, antes que a mulher desviasse o homem que é seu irmão. Este casamento os uniu novamente, e a alma se uniu ao seu verdadeiro amor, seu senhor primordial, como está escrito: “Pois o senhor da mulher é seu marido.” (Gênesis 3:16; Efésios 5:23)


