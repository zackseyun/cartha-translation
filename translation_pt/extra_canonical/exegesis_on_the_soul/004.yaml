translation:
  language: pt
  text: '**A união matrimonial da alma**[a]


    Como esse casamento é diferente do casamento carnal, os que mantêm relações sexuais entre si se contentam com esse tipo de união. E, como se fosse um peso, deixam para trás o incômodo do desejo do corpo, [afastando o rosto] um do outro. Este casamento, porém, [é diferente]. Quando, enfim, eles se unem [um ao outro], tornam-se uma só vida.


    [...] Por isso, o profeta disse a respeito do primeiro homem e da primeira mulher: “Os dois se tornarão uma só carne”. (Gênesis 2:24)


    Pois, no princípio, eles estavam unidos um ao outro quando habitavam com o Pai, antes que a mulher desviasse o homem que é seu irmão. Este casamento tornou a uni-los, e a alma se uniu ao seu verdadeiro amor, seu senhor original, como está escrito: “Pois o senhor da mulher é seu marido”. (Gênesis 3:16; Efésios 5:23)


    Então, pouco a pouco, ela o reconheceu e voltou a se alegrar, chorando diante dele ao se lembrar da vergonha que antes sofrera como viúva. E embelezou-se ainda mais, para que ele tivesse prazer em habitar com ela.


    E o profeta disse nos Salmos:


    “Escute, minha filha, olhe e incline o ouvido;

    esqueça o seu povo e a casa de seu pai,

    e o rei desejará a sua beleza,

    pois ele é o seu senhor.” (Salmo 45:10–11)


    Pois ele lhe ordena que desvie o olhar de seu povo e da multidão de seus amantes adúlteros, entre os quais antes habitava, para se dedicar somente ao seu rei, seu verdadeiro Senhor. Ordena-lhe também que se esqueça da casa de seu pai terreno, onde sua situação era terrível, e que, em vez disso, se lembre de seu Pai que está no céu.


    Do mesmo modo, também foi dito a Abraão: “Saia da sua terra, do meio de seus parentes e da casa de seu pai”. (Gênesis 12:1)


    Assim, depois que a alma [se embelezou] novamente com seu esplendor, [desejou] adorar seu amado, e [ele também] a amou. Quando se uniu a ele, recebeu [...] dele a semente do espírito que dá vida. Por meio dela, a alma dá à luz filhos íntegros e os cria, pois esse é o grande e perfeito milagre do nascimento. E assim esse casamento se completa pela vontade do Pai.


    É necessário que a alma regenere a si mesma e volte a ser o que era antes. Então, a alma se move por sua própria vontade e recebe do Pai a natureza divina para sua renovação, a fim de ser restaurada ao lugar onde estava no princípio:


    Esta é a ressurreição dentre os mortos.

    Esta é a redenção da escravidão.

    Esta é a jornada ascendente ao céu.

    Este é o caminho de subida ao Pai.[b]


    Por isso, o profeta disse:


    “Louve o Senhor, ó minha alma,

    e tudo o que há dentro de mim louve seu santo nome.

    Minha alma, louve a Deus,

    que perdoa todas as suas iniquidades,

    que cura todas as suas enfermidades,

    que resgata da morte a sua vida,

    que a coroa de misericórdia,

    que satisfaz com coisas boas o seu desejo.

    Sua juventude será renovada como a da águia.” (Salmo 103:1–5)


    Depois de voltar a ser jovem, ela subirá, louvando o Pai e seu irmão, que a salvou. Desse modo, a alma é salva ao nascer de novo. Isso não acontece pela repetição de fórmulas, nem pela perícia dos instruídos, nem pelo aprendizado adquirido em livros. Acontece, antes, pela graça do [Espírito]; é dádiva do [Deus] compassivo. Esse é o caminho dessa realidade celestial.


    Por isso, o Salvador clama: [...] “Ninguém pode vir a mim se meu Pai não o atrair e o trouxer a mim; e eu o ressuscitarei no último dia”. (João 6:44)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta do manuscrito copta do Códice II,6 de Nag Hammadi ainda está pendente. Colchetes no texto indicam palavras restauradas; reticências entre colchetes indicam lacunas.
    reason: Torna transparentes a base documental secundária e os sinais de dano ou restauração do manuscrito.
  - marker: b
    text: A sequência emprega várias imagens paralelas para a restauração da alma — ressurreição, redenção, jornada e subida — sem reduzi-las a uma única formulação doutrinária.
    reason: Preserva a acumulação retórica e a tensão teológica do testemunho.
lexical_decisions:
- source_word: marriage
  choice: casamento / união matrimonial
  rationale: “Casamento” mantém a metáfora central em linguagem corrente; no título, “união matrimonial” evita uma formulação portuguesa artificial sem enfraquecer a imagem.
- source_word: carnal marriage
  choice: casamento carnal
  rationale: Preserva o contraste explícito do testemunho entre a união corporal e a união espiritual, sem interpretá-lo além do texto.
- source_word: bodily lust
  choice: desejo do corpo
  rationale: Expressa a dimensão corporal sem acrescentar a conotação moral mais forte que “luxúria” poderia impor.
- source_word: original master
  choice: senhor original
  rationale: Mantém tanto a prioridade temporal quanto a linguagem de senhorio do testemunho, embora a expressão permaneça deliberadamente incomum.
- source_word: upright children
  choice: filhos íntegros
  rationale: “Íntegros” comunica caráter reto e completo; evita restringir o sentido a uma justiça técnica.
- source_word: life-giving spirit
  choice: espírito que dá vida
  rationale: Formulação clara e natural que conserva a função vivificadora sem decidir se o referente deve ser entendido aqui como título próprio.
- source_word: educated expertise
  choice: perícia dos instruídos
  rationale: Preserva a crítica à competência erudita como meio de salvação, distinguindo-a do aprendizado livresco mencionado em seguida.
- source_word: draws him and brings him
  choice: o atrair e o trouxer
  rationale: Mantém os dois verbos presentes no testemunho fornecido, sem harmonizar a citação com versões bíblicas que trazem apenas um deles.
theological_decisions:
- issue: Relação entre a alma, o amado, o irmão e o Salvador
  choice: Preservar as designações distintas conforme aparecem
  alternative: Identificar explicitamente todas elas com Cristo
  rationale: O trecho sugere conexões, mas não as explicita em todos os pontos; a tradução não deve resolver essa tensão por via interpretativa.
- issue: Agência da alma na regeneração
  choice: “a alma regenere a si mesma” e “por sua própria vontade”
  alternative: Reformular em voz passiva para atribuir exclusivamente a ação a Deus
  rationale: A redação preserva a afirmação forte do testemunho e sua tensão posterior com a graça do Espírito e a atração do Pai.
- issue: “natureza divina” recebida do Pai
  choice: Manter literalmente “natureza divina”
  alternative: Atenuar para “vida divina” ou “qualidade divina”
  rationale: A linguagem ontológica pertence ao argumento do texto e não deve ser reduzida por pressupostos confessionais.
- issue: Gênero de “espírito” na expressão restaurada
  choice: Minúscula no corpo da frase, preservando [Espírito] maiúsculo na restauração posterior
  alternative: Uniformizar todas as ocorrências como referência ao Espírito Santo
  rationale: O testemunho distingue graficamente as expressões, e a revisão direta do copta ainda está pendente.
- issue: Citações bíblicas
  choice: Traduzir a forma citada pelo testemunho e conservar suas referências
  alternative: Harmonizar integralmente com uma versão bíblica portuguesa existente
  rationale: Isso preserva as particularidades exegéticas do documento e evita corrigir silenciosamente seu uso das Escrituras.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se a personificação feminina da alma, as repetições retóricas, a linguagem matrimonial explícita e as ambiguidades teológicas. As citações foram vertidas a partir da forma presente no testemunho fornecido, sem harmonização confessional.
