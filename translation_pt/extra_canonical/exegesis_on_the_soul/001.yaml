review_pass:
  verdict: revise
  source_fidelity: A tradução preserva de modo geral a sequência narrativa, a alegoria sexual explícita, os contrastes teológicos e todos os colchetes — inclusive os vazios — do testemunho inglês fornecido. Como a revisão direta do copta está pendente, a avaliação de fidelidade se limita necessariamente a esse testemunho. Há um ajuste pontual necessário na construção que descreve cada pessoa que a alma estava disposta a abraçar como marido.
  naturalness: O registro é moderno, sóbrio e legível em português internacional com boa fluência brasileira. Alguns pequenos ajustes tornam a formulação mais idiomática e evitam uma nuance aspectual não exigida pelo testemunho.
  terminology: “Alma”, “andrógina”, “Pai”, “ladrões”, “adúlteros”, “misericórdia” e a manutenção de “violentavam” são escolhas adequadas. “Aposentos onde vivia como donzela” conserva prudentemente o sentido de maiden’s quarters sem interpretação indevida.
  issues:
  - severity: low
    issue: Construção pouco natural em “considerando marido cada um que estava disposta a abraçar”.
    rationale: 'A redação atual deixa ambígua a relação entre “cada um” e “estava disposta”. “considerando como marido todo aquele que estava pronta para abraçar” exprime com clareza o sentido do testemunho: ela considerava marido cada homem que se dispunha a abraçar.'
  - severity: low
    issue: “Passou a gemer profundamente” introduz uma nuance incoativa desnecessária.
    rationale: O testemunho diz que ela gemeu profundamente e se arrependeu; “gemeu profundamente e arrependeu-se” é mais direto e não sugere uma duração ou início de ação que o texto-base não especifica.
  revised_text: '[] Há muito tempo, os sábios deram à alma um nome feminino. De fato, ela também é feminina por natureza. Ela tem até mesmo um ventre.



    Enquanto habitava a sós com o Pai, ela era virgem e, quanto à forma, era andrógina. Quando, porém, caiu em um corpo e entrou nesta vida, caiu então nas mãos de muitos ladrões. E aquelas criaturas cruéis a passavam de um para outro e a [violentavam]. Alguns a usavam à força, enquanto outros a seduziam com um presente. Em resumo, eles a profanaram, e ela [perdeu] sua [] virgindade.



    E, em seu corpo, ela se prostituiu e se entregou a todos, sem exceção, considerando como marido todo aquele que estava pronta para abraçar. Depois de se entregar a adúlteros cruéis e infiéis para que abusassem dela, ela gemeu profundamente e arrependeu-se.



    Contudo, mesmo quando desviava o rosto daqueles adúlteros, corria para outros; e estes a obrigavam a viver com eles e a servi-los em seu leito, como se fossem seus senhores. Envergonhada, ela já não ousava deixá-los. Eles, por sua vez, enganaram-na por muito tempo, fazendo-se passar por maridos fiéis e verdadeiros, como se a reverenciassem profundamente. Depois de tudo isso, abandonaram-na e foram embora.



    Então ela se tornou uma viúva desamparada, pobre e desolada. No tempo de sua aflição, não lhe restou sequer um pedaço de pão. Tudo o que recebeu deles foi a impureza proveniente das relações sexuais. E os filhos que teve dos adúlteros são mudos, cegos, enfermos e de entendimento fraco.



    Quando, porém, o Pai exaltado a visitou, olhou para ela e a viu gemendo em suas dores e em sua vergonha, arrependida da prostituição que havia praticado; e quando ela começou a invocar o nome dele para que a ajudasse, [ela gemeu] de todo o coração e disse: “Salva-me, meu Pai. Olha para mim, pois eu [te prestarei contas], porque abandonei minha casa e [] fugi dos aposentos onde vivia como donzela. Restaura-me novamente a ti.”



    Quando ele a contemplar nessa condição, então a considerará digna de receber sua misericórdia, pois muitos são os sofrimentos que lhe sobrevieram por ter abandonado sua casa.[a]'
