    reason: Documenta a base textual indireta e explica os sinais editoriais preservados, sem apresentá-los como palavras seguras do manuscrito.
lexical_decisions:
- source_word: soul / feminine pronouns
  choice: alma / ela
  rationale: Em português, “alma” é gramaticalmente feminina, o que preserva naturalmente a personificação feminina central à passagem.
- source_word: androgynous
  choice: andrógina
  rationale: Mantém o termo conceitualmente específico sem explicar ou harmonizar a tensão entre virgindade, feminilidade e forma andrógina.
- source_word: robbers
  choice: ladrões
  rationale: Preserva a imagem concreta do testemunho, sem identificar alegoricamente quem seriam os ladrões.
- source_word: violated
  choice: violentavam
  rationale: Expressa violência sexual e preserva os colchetes que assinalam restauração editorial no testemunho.
- source_word: practiced prostitution
  choice: se prostituiu
  rationale: Formulação natural e direta em português, adequada à metáfora explícita do texto.
- source_word: weak-minded
  choice: de entendimento fraco
  rationale: Evita um rótulo moderno potencialmente pejorativo e conserva a ideia de debilidade intelectual do testemunho.
- source_word: maiden’s quarters
  choice: aposentos onde vivia como donzela
  rationale: Torna compreensível a expressão espacial e social sem reduzi-la simplesmente a “quarto”.
- source_word: Restore me to yourself
  choice: Restaura-me novamente a ti
  rationale: Preserva o movimento relacional de retorno ao Pai, sem acrescentar linguagem doutrinária posterior.
theological_decisions:
- issue: Natureza e queda da alma
  choice: Conservar a linguagem narrativa de queda em um corpo
  alternative: Interpretar explicitamente o corpo como mau ou como prisão
  rationale: O trecho afirma a queda da alma em um corpo, mas a tradução não deve acrescentar uma sistematização ontológica além do que está expresso.
- issue: Pai exaltado
  choice: Traduzir literalmente como “Pai exaltado”
  alternative: Identificá-lo explicitamente com uma formulação trinitária ou gnóstica específica
  rationale: Mantém a designação do texto e evita importar uma identificação confessional ou histórica não explicitada no excerto.
- issue: Misericórdia e dignidade
  choice: “a considerará digna de receber sua misericórdia”
  alternative: Reformular como misericórdia estritamente incondicional ou mérito salvífico
  rationale: Preserva a tensão textual entre arrependimento, sofrimento, dignidade e misericórdia, sem resolvê-la segundo um sistema teológico posterior.
- issue: Filhos dos adúlteros
  choice: Manter a descrição como parte da alegoria sem explicá-la
  alternative: Identificar os filhos com pecados, paixões, poderes ou doutrinas específicas
  rationale: O excerto não fornece a interpretação, e a ambiguidade deve permanecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi moderadamente naturalizada, mas as imagens corporais, sexuais e familiares, bem como as mudanças de tempo verbal e as ambiguidades teológicas do testemunho, foram preservadas. Evitaram-se eufemismos que enfraquecessem a violência do trecho e interpretações confessionais acrescentadas.
