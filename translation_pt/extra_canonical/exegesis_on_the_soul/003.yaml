  text: 'However, when she realizes the trouble she is in, cries out before the Father, and repents, the Father will show mercy to her. He will cause her womb to turn away from the outward kingdom and return inward, making the soul reclaim her good character. For such is not the way of a woman, since the bodily womb is inward, like the other internal organs of the body.


    The womb of the soul, however, surrounds outwardly, like the male’s outward genitals. Therefore, when the womb of the soul turns inward by the will of the Father, it is baptized and immediately purified from the outward pollution which was forced on it, like filthy [garments] soaked [in water and] moved around until the dirt is gone and they are clean. Thus, the purification of the soul is a reclaiming of the renovation of [] her former nature, and a return to herself. That is her baptism.


    Then she will become mad at herself, acting like a woman during labor, writhing and raging in the hour of birth. However, because she is a female, on her own she is unable to conceive a child. From heaven the Father sent her a man—her brother, the firstborn. The bridegroom then went down to the bride. She stopped her earlier prostitution and purified herself from the pollutions of the adulterers. She was even renewed to become a bride. She purified herself in the bridal chamber, filling it with perfume, sitting there awaiting her true bridegroom. She no longer ran around the marketplace, having sex with everyone she wanted. Instead, she kept waiting for him: “When will he arrive?” And she continued to fear him, because she knew not what he looked like. She no more remembered the time she fell from her Father’s house. By the will of the Father, however, [. . .] And she dreamed of him like a woman who loves a man.


    Then, however, the bridegroom, agreeing with the Father’s will, went down to her, into the bridal chamber, which had been prepared, and he adorned the bridal chamber.'
translation:
  language: pt
  text: 'No entanto, quando ela reconhece a aflição em que se encontra, clama diante do Pai e se arrepende, o Pai terá misericórdia dela. Ele fará com que o ventre dela se afaste do reino exterior e volte para dentro, levando a alma a recuperar seu bom caráter. Pois essa não é a condição própria de uma mulher, já que o ventre do corpo fica no interior, como os demais órgãos internos.


    O ventre da alma, porém, envolve-a por fora, como os órgãos genitais externos do homem. Portanto, quando o ventre da alma se volta para dentro pela vontade do Pai, ele é batizado e imediatamente purificado da contaminação exterior que lhe foi imposta, como [roupas] sujas, mergulhadas [em água e] agitadas até que a sujeira desapareça e elas fiquem limpas. Assim, a purificação da alma consiste em recuperar a renovação de [] sua natureza anterior e em retornar a si mesma. Esse é o seu batismo.


    Então ela ficará furiosa consigo mesma, agindo como uma mulher em trabalho de parto, contorcendo-se e enfurecendo-se na hora de dar à luz. Contudo, por ser mulher, não consegue conceber um filho por si mesma. Do céu, o Pai lhe enviou um homem — seu irmão, o primogênito. Então o noivo desceu até a noiva. Ela abandonou sua prostituição anterior e se purificou das contaminações dos adúlteros. Foi até mesmo renovada para se tornar noiva. Purificou-se na câmara nupcial, encheu-a de perfume e ficou ali sentada, esperando seu verdadeiro noivo. Já não corria pela praça, mantendo relações sexuais com quem quisesse. Em vez disso, continuava à espera dele: “Quando ele chegará?” E continuava a temê-lo, pois não sabia qual era sua aparência. Já não se lembrava do tempo em que caíra da casa de seu Pai. Pela vontade do Pai, porém, [...] E sonhava com ele como uma mulher que ama um homem.


    Então o noivo, em conformidade com a vontade do Pai, desceu até ela, entrou na câmara nupcial que havia sido preparada e a adornou.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta ainda está pendente. Os colchetes e as reticências reproduzem indicações de restauração editorial ou lacuna do manuscrito. Os colchetes vazios em “renovação de [] sua natureza anterior” foram conservados tal como aparecem no testemunho.
    reason: Informa com transparência a base indireta da tradução e preserva os sinais de dano ou reconstrução textual.
lexical_decisions:
- source_word: trouble
  choice: aflição
  rationale: Transmite uma condição grave de sofrimento sem reduzir o sentido a mero problema cotidiano.
- source_word: womb
  choice: ventre
  rationale: Preserva a imagem anatômica e simbólica; em português, «ventre» funciona com maior dignidade literária do que alternativas excessivamente clínicas.
- source_word: outward kingdom
  choice: reino exterior
  rationale: Mantém a linguagem espacial e cosmológica do testemunho sem interpretá-la.
- source_word: good character
  choice: bom caráter
  rationale: Conserva a amplitude moral da expressão, sem substituí-la por uma reconstrução doutrinária.
- source_word: pollution
  choice: contaminação
  rationale: Expressa impureza ou aviltamento sem restringir o termo a uma categoria ritual específica.
- source_word: firstborn
  choice: primogênito
  rationale: Equivalente tradicional e preciso, preservando possíveis ressonâncias teológicas sem identificá-lo explicitamente.
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Mantém o motivo técnico e simbólico do texto em registro digno e compreensível.
- source_word: marketplace
  choice: praça
  rationale: Representa o espaço público urbano de modo natural em português, sem modernizá-lo como mercado comercial fechado.
theological_decisions:
- issue: Identidade do irmão primogênito e noivo
  choice: Não identificar explicitamente a figura
  alternative: Nomeá-la como Cristo ou Salvador
  rationale: O trecho fornecido não apresenta essa identificação nominal; mantê-la implícita preserva a tensão e evita importar uma interpretação.
- issue: Sentido do batismo
  choice: Conservar a definição metafórica do próprio texto
  alternative: Explicá-lo como rito sacramental ou apenas como purificação espiritual
  rationale: O texto associa batismo, purificação e retorno da alma sem resolver a relação entre metáfora e rito.
- issue: Gênero personificado da alma
  choice: Manter a alma no feminino e desenvolver a imagem como noiva
  alternative: Neutralizar a personificação
  rationale: O gênero e as imagens sexuais e nupciais estruturam o argumento do trecho.
- issue: Reversão do ventre da alma
  choice: Preservar literalmente a topografia interior/exterior
  alternative: Parafraseá-la como conversão moral
  rationale: A imagem cosmológica e corporal é deliberadamente estranha e não deve ser silenciosamente racionalizada.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom digno. A sintaxe foi moderadamente ajustada para clareza, mas as imagens corporais, sexuais, nupciais e cosmológicas foram preservadas sem eufemismo nem explicação denominacional.
