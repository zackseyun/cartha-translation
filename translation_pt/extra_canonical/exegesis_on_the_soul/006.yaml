  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: pt
  text: 'Assim, está escrito no poeta:


    > Odisseu estava sentado na ilha, sofrendo e lamentando,

    > desviando o rosto das palavras e dos encantos de Calipso,

    > ansiando por ver novamente sua aldeia e a fumaça que dela subia.

    > E, se não tivesse [recebido] ajuda do Céu,[a]

    > [não poderia ter voltado] para sua aldeia. (Homero, Odisseia 1.48–1.59)


    E também [Helena] diz:


    > Meu coração mudou dentro de mim;

    > […] é para minha casa que eu desejava voltar.[b] (Homero, Odisseia 4.260–261)


    Pois ela se lamentava, dizendo:


    > Foi Afrodite quem me desviou

    > e me levou para longe de minha aldeia.

    > Abandonei minha própria filha

    > e meu marido, bom, inteligente e belo. (Homero, Odisseia 4.261–4.264)


    Pois, quando a alma abandona seu marido perfeito por causa da infidelidade de Afrodite, que aqui passa a existir por meio do ato de gerar, ela sofrerá dano. Mas, se ela se lamentar e se arrepender, será reconduzida à sua casa.'
