lexical_decisions:
- source_word: village
  choice: aldeia
  rationale: Preserva a imagem concreta e repetida do testemunho disponível, sem substituí-la interpretativamente por “pátria” ou “terra natal”.
- source_word: Heaven
  choice: Céu
  rationale: Mantém a personificação ou referência transcendente sugerida pela inicial maiúscula no testemunho, sem especificar quem presta a ajuda.
- source_word: charms
  choice: encantos
  rationale: Abrange tanto a sedução pessoal quanto possíveis artes sedutoras, preservando a amplitude do termo.
- source_word: disloyalty
  choice: infidelidade
  rationale: Expressa a quebra de lealdade no contexto conjugal e alegórico sem impor uma formulação doutrinária.
- source_word: act of begetting
  choice: ato de gerar
  rationale: Mantém a linguagem reprodutiva explícita e a estranheza conceitual do original testemunhado, sem reduzi-la simplesmente a “nascimento”.
- source_word: come to harm
  choice: sofrerá dano
  rationale: Transmite consequência lesiva de maneira natural e conserva a generalidade do tipo de dano.
- source_word: returned to her house
  choice: será reconduzida à sua casa
  rationale: Preserva a forma passiva e, portanto, não identifica quem efetua o retorno da alma.
theological_decisions:
- issue: Agente da ajuda celeste
  choice: “ajuda do Céu”
  alternative: “ajuda de Deus”
  rationale: O testemunho diz “Heaven”; a tradução não identifica explicitamente o Céu com Deus nem elimina a abertura da expressão.
- issue: Gênero figurado da alma
  choice: Referências femininas a “alma” e “seu marido”
  alternative: Neutralizar a personificação conjugal
  rationale: A alegoria depende da alma como esposa que abandona e retorna ao marido; a concordância feminina é também natural em português.
- issue: Agente do retorno da alma
  choice: “será reconduzida”
  alternative: “voltará” ou “Deus a reconduzirá”
  rationale: A voz passiva preserva tanto a ação recebida quanto a ausência de um agente explicitamente nomeado.
- issue: Relação entre Afrodite e a geração
  choice: Manter “Afrodite, que aqui passa a existir por meio do ato de gerar”
  alternative: Explicar Afrodite como desejo sexual, carne ou mundo material
  rationale: A construção é teologicamente densa e potencialmente ambígua; não se acrescenta uma identificação doutrinária ausente do testemunho.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. A disposição em versos conserva a função das citações poéticas. Esta versão é provisória, pois foi elaborada a partir do testemunho inglês de domínio público fornecido; ainda requer cotejo direto com o copta do Códice II,6 de Nag Hammadi.
