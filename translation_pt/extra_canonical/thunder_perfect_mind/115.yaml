  text: I am the name cried out among those who are dead; and I am the one who is present—alone and in unity. The one who will judge me by the law—
translation:
  language: pt
  text: Eu sou o nome proclamado entre os que estão mortos[a], e sou aquele que está presente — só e em unidade[b]. Aquele que me julgará segundo a lei[c] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito digitalizado traz ⲡⲓⲛⲁ, mas a leitura provável é ⲡⲓⲣⲁⲛ, “o nome”. A expressão traduzida por “proclamado” também pode significar “lançado para fora” ou “gritado”.
    reason: Incerteza textual e alternativa lexical.
  - marker: b
    text: A leitura “unidade” pressupõe ⲙⲛⲧⲟⲩⲁⲁⲧ; o OCR parece ter omitido letras. Outra tradução possível é “só e em unicidade”.
    reason: Reconstrução do OCR e preservação da ambiguidade lexical.
  - marker: c
    text: “Lei” traduz uma provável reconstrução de ⲛⲟⲙⲟⲥ; o OCR traz ⲛⲉⲗⲟⲥ. Como o trecho termina aqui, a frase permanece incompleta.
    reason: Incerteza textual e limite do excerto.
