  choice: o nome
  rationale: A leitura do OCR parece ter omitido ⲣ; ⲣⲁⲛ significa “nome”. O artigo definido preserva a força formal da autodeclaração.
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: proclamado
  rationale: A expressão sugere exteriorização vocal ou expulsão. “Proclamado” conserva o motivo da voz sem impor a intensidade específica de “gritado”.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: entre os que estão mortos
  rationale: ϩⲛ diante do relativo plural admite sentido locativo ou associativo; “entre” é natural em português e mantém explícito o grupo dos mortos.
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: aquele que está presente
  rationale: ϣⲟⲟⲡ pode expressar existência ou presença; “está presente” preserva a nuance de manifestação no contexto.
- source_word: 'ⲟⲩⲁⲁⲧ ... ⲙⲛⲧⲟⲩⲁⲁⲧ (OCR: ⲙⲛⲧⲁⲓ)'
  choice: só e em unidade
  rationale: A formulação mantém o contraste entre estar só e a unidade abstrata, sem explicar nem eliminar o paradoxo.
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: Aquele que me julgará
  rationale: O marcador ⲛⲁ- indica futuro, e a oração relativa substantivada mantém o tom jurídico.
- source_word: 'ϩⲁ ⲡⲓ ⲛⲟⲙⲟⲥ (OCR: ⲛⲉⲗⲟⲥ)'
  choice: segundo a lei
  rationale: Se a reconstrução ⲛⲟⲙⲟⲥ estiver correta, “segundo a lei” expressa com naturalidade o critério jurídico indicado por ϩⲁ.
theological_decisions:
- issue: Paradoxo entre solidão e unidade
  choice: só e em unidade
  alternative: solitário e como unidade
  rationale: A opção escolhida preserva a tensão do original em linguagem portuguesa natural, sem lhe atribuir uma explicação metafísica específica.
