  source_fidelity: 'A tradução inicial de ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ como “que todos acolhem” não corresponde ao copta: ϣⲏⲡ significa “primeiro/primeira”, e a expressão indica “primeira entre todos os seres” (ou “entre todos os que existem”). A formulação “Creiam neles” é defensável para ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ, embora o antecedente permaneça pouco claro no excerto. A forma ⲧⲉⲕⲱ e a sequência relativa anterior continuam incertas e devem manter sinalização editorial e notas. O fim deve refletir que ⲛⲧⲉ introduz uma construção genitiva inacabada, sem acrescentar um substantivo não atestado.'
  naturalness: A revisão conserva dicção moderna e poética. “A primeira entre todos os seres” é clara em português internacional e evita a interpretação errônea de aceitação universal. “Creiam neles” é mais natural e semanticamente preciso do que “Creiam-lhes” neste contexto. A pontuação final é simplificada para não sugerir uma oração completa onde o manuscrito-excerto se interrompe.
  terminology: “Audição”, “palavra” e “silêncio da palavra” preservam o paralelismo e o paradoxo do texto. “Chamado” permanece uma solução provisória explicitamente marcada, não uma identificação segura do vocábulo corrompido. “Ira” traduz adequadamente ϭⲱⲛ neste contexto, e não “voz alta”.
  issues:
  - severity: high
    issue: “que todos acolhem” traduz incorretamente ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ.
