    rationale: A nota deve ser removida ou substituída por uma explicação da expressão “todos os seres/tudo o que existe”; como a tradução revisada é suficientemente clara, não é necessária nota.
  - severity: medium
    issue: “e o [...] de” introduz o artigo “o” sem base no trecho copta disponível.
    rationale: O excerto atesta apenas o início de uma construção com ⲛⲧⲉ (“de”), cuja continuação falta. “e de [...]” preserva a interrupção sem antecipar um substantivo.
