base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/087.yaml
  text: 'I am the hearing that is acceptable to everyone[a],

    and I am the speech that is [to be spoken][b].

    Believe them: I am your [call][c] for speaking, and great is

    the silence of speech—listen to me in anger[a][d][c][b], and of [...] [d]'
translation:
  language: pt
  text: 'Eu sou a audição que todos acolhem[a],


    e sou a palavra que [deve ser pronunciada][b].


    Creiam neles: eu sou o seu [chamado][c] para falar, e grande é


    o silêncio da palavra. Escutem-me com ira; e o [...] de[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a audição que é recebida/aceita por todos”. “Todos” também pode ser entendido como “todos os seres” ou “tudo o que existe”.
    reason: lexical_alternative
  - marker: b
    text: A sequência copta reconhecida pelo OCR é incerta. Se nela estiver o verbo “pedir”, o sentido poderá ser “a palavra que é solicitada”.
    reason: alignment_note
  - marker: c
    text: A forma copta ⲧⲉⲕⲱ parece corrompida ou mal reconhecida. Entre as possibilidades propostas estão “seu ouvido” e algum termo relacionado a “voz”; “chamado” é uma tradução temática provisória.
    reason: alignment_note
  - marker: d
    text: O excerto termina com uma partícula que introduz uma construção com “de”; sua continuação não está presente. Por isso, o final permanece incompleto.
    reason: alignment_note
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: a audição / Escutem
  rationale: O substantivo e a forma verbal retomam a mesma raiz, “ouvir, escutar”. “Audição” preserva o paralelismo abstrato com “palavra”, enquanto “Escutem” expressa naturalmente o imperativo posterior.
- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: que todos acolhem
  rationale: A forma ϣⲏⲡ pode indicar aquilo que é recebido ou aceito; ⲟⲩⲟⲛ ⲛⲓⲙ tem sentido abrangente, “todos, todo ser”. A formulação portuguesa evita o artificial “aceitável a todos”.
- source_word: ⲡϣⲁϫⲉ
  choice: a palavra
  rationale: Pode significar “palavra, fala, discurso”. “Palavra” sustenta a repetição poética e a expressão paradoxal posterior “o silêncio da palavra”.
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: '[deve ser pronunciada]'
  rationale: A leitura do OCR é insegura e não permite estabelecer o verbo com confiança. Os colchetes assinalam que esta reconstrução contextual é provisória.
- source_word: ⲛⲁϩⲧⲉ ⲙⲙⲟⲩ
  choice: neles
  rationale: O trecho foi vertido conforme a segmentação recebida (“creiam neles”), embora a sequência também possa envolver uma expressão de posição ou presença; a base OCR não permite certeza plena.
- source_word: ⲧⲉⲕⲱ
  choice: seu [chamado]
  rationale: A forma transmitida pelo OCR é opaca e provavelmente está corrompida ou foi mal reconhecida. “Chamado” acompanha cautelosamente o motivo do título, sem apresentar a identificação como certa.
- source_word: ⲉⲙⲁϣⲁϫⲉ
  choice: para falar
  rationale: A construção expressa finalidade ligada ao verbo “falar”.
- source_word: ⲛⲁϣⲉ
  choice: grande é
  rationale: A forma pertence ao campo de “ser numeroso, abundante, grande”, e não significa “orelhas”.
- source_word: ⲧⲙⲛⲧϩⲁⲗⲏ ⲛϣⲁϫⲉ
  choice: o silêncio da palavra
  rationale: Mantém a construção genitiva e o paradoxo deliberado do original.
- source_word: ϩⲛ ⲟⲩϭⲱⲛ
  choice: com ira
  rationale: ϭⲱⲛ representa aqui “ira, cólera”, não “voz alta”. A preposição foi vertida por “com” para conservar aberta a relação entre a ira e o ato de escutar.
- source_word: ⲛⲧⲉ
  choice: de
  rationale: Marca o começo de uma construção genitiva que continua além do excerto disponível.
theological_decisions:
- issue: Identidade da voz poética
  choice: Preservar as autodeclarações sem identificar a falante com uma figura teológica específica
  alternative: Explicitar uma identificação com Sabedoria, uma emanação ou outra entidade
  rationale: O fragmento não fornece base suficiente para fixar tal identificação, e sua ambiguidade faz parte da força literária e teológica da obra.
- issue: Paradoxo entre palavra e silêncio
  choice: Manter literalmente “o silêncio da palavra”
  alternative: Explicar como “a palavra silenciosa” ou “o silêncio no discurso”
  rationale: A tensão paradoxal é genuína e não deve ser resolvida interpretativamente na tradução.
