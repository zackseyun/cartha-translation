base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/085.yaml
  text: 'Vision and self-control

    of the heart[a], existing within me—

    I am the hearing that is attainable to everyone[d][c][b],

    and the speech that cannot be grasped.'
translation:
  language: pt
  text: 'Visão e domínio próprio


    do coração,[a] que existem dentro de mim[d] —


    eu sou o ouvir acessível a todos,[b]


    e a fala que não pode ser apreendida.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Alguns traduzem o início como “uma lâmpada do coração”; contudo, o texto OCR aqui apresenta os empréstimos gregos ϩⲟⲣⲁⲥⲓⲥ (“visão”) e ⲧⲉⲅⲕⲣⲁⲧⲓⲁ (“domínio próprio”).
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida como “acessível” (ⲉⲧϣⲏⲡ) também pode significar “disponível” ou “que chega a”, indicando facilidade de acesso, e não necessariamente realização ou conquista.
    reason: lexical_alternative
  - marker: c
    text: “Não pode ser apreendida” também pode ser traduzido como “não pode ser compreendida”; o verbo admite nuances físicas e cognitivas.
    reason: lexical_alternative
  - marker: d
    text: Outra segmentação poderia sugerir “do coração que está dentro de mim”; porém, a forma relativa copta é feminina e, por isso, liga-se mais naturalmente a “visão” ou “domínio próprio”, não a “coração”, que é masculino.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ϩⲟⲣⲁⲥⲓⲥ
  choice: visão
  rationale: Empréstimo do grego ὅρασις; “visão” preserva tanto a percepção quanto a possível dimensão interior do termo.
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ
  choice: domínio próprio
  rationale: Empréstimo do grego ἐγκράτεια. “Domínio próprio” é corrente e digno, sem a conotação mais estreita que “temperança” pode ter.
- source_word: ⲙⲫⲏⲧ
  choice: do coração
  rationale: Interpreta ⲙ- como genitivo, mantendo a ligação estreita de visão e domínio próprio com o coração.
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ ⲁⲛⲟⲕ
  choice: existindo dentro de mim
  rationale: O gerúndio mantém a referência poética um pouco aberta entre os substantivos femininos precedentes, sem ligá-la gramaticalmente a “coração”, que é masculino no copta.
- source_word: ⲡⲥⲱⲧⲙ
  choice: o ouvir
  rationale: Conserva a nominalização concreta do verbo e sustenta o paradoxo com “a fala”, evitando deslocar o sentido para “obediência”.
- source_word: ⲉⲧϣⲏⲡ
  choice: acessível
  rationale: Exprime disponibilidade ou possibilidade de acesso, sem sugerir necessariamente uma conquista humana.
- source_word: ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: a todos
  rationale: Reproduz de modo natural o alcance universal da expressão copta.
- source_word: ⲡϣⲁϫⲉ
  choice: a fala
  rationale: Forma um par natural com “o ouvir” e evita limitar o termo a uma única palavra.
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: que não pode ser apreendida
  rationale: “Apreendida” conserva a tensão entre captar, alcançar e compreender, adequada ao paradoxo do poema.
theological_decisions:
- issue: Relação entre a audição universalmente acessível e a fala inapreensível
  choice: Manter o contraste sem explicá-lo
  alternative: Interpretar a fala como revelação esotérica ou como palavra divina
  rationale: O texto formula deliberadamente um paradoxo e não identifica de maneira explícita a fala nem o tipo de acesso em questão.
translation_notes:
  register: Português moderno, poético e solene, com sintaxe breve e paralela. “O ouvir” mantém a concretude incomum do original; “domínio próprio” favorece legibilidade ampla, e “apreendida” preserva a dupla nuance física e intelectual.
