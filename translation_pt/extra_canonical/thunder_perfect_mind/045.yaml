translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético. “Aquela” preserva a voz feminina e soa mais natural em português do que uma reprodução rígida da fórmula copular. “Bárbaros” é mantido como termo histórico da oposição grega, sem modernizá-lo para “estrangeiros” ou “não gregos”.
