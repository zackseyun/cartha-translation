base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/045.yaml
  text: 'Greeks and barbarians[a],

    I am the one whose image is great in Egypt,

    and the one who has no image among the barbarians.

    I am she whom they hated in every place[d][c][b],

    and she whom they loved.'
translation:
  language: pt
  text: '**10.** Gregos e bárbaros,


    Eu sou aquela cuja imagem é grande no Egito[a]

    e aquela que não tem imagem entre os bárbaros.


    Eu sou aquela a quem odiaram em todo lugar[b]

    e aquela a quem amaram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta também pode ser entendida como “cuja imagem é múltipla” ou “cujas imagens são numerosas”.
    reason: lexical_alternative
  - marker: b
    text: A leitura “odiaram” é favorecida pelo contraste com “amaram”. A grafia copta, porém, é incomum; “desprezaram” também é possível. O texto do manuscrito provavelmente separa ϩⲛ ⲙⲁ ⲛⲓⲙ, “em todo lugar”.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲉⲗⲗⲏⲛ ⲙⲛ ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: Gregos e bárbaros
  rationale: Mantém a oposição etnocultural convencional expressa pelos empréstimos gregos no copta. O fragmento inicial é preservado sem acrescentar uma relação sintática não explicitada no excerto.
- source_word: ⲧⲉⲧⲛⲁϣⲉ ⲡⲉⲥⲉⲓⲛⲉ
  choice: aquela cuja imagem é grande
  rationale: Lê ⲉⲓⲛⲉ como “imagem/semelhança”, não como ⲥⲉⲓⲛⲉ, “silêncio”. ⲛⲁϣⲉ indica grandeza, abundância ou multiplicidade; “é grande” produz português natural sem eliminar a alternativa lexical.
- source_word: ϩⲛ ⲕⲏⲙⲉ
  choice: no Egito
  rationale: Traduz diretamente o topônimo copta ⲕⲏⲙⲉ por sua forma portuguesa corrente.
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ
  choice: aquela que não tem imagem
  rationale: Entende ⲙⲛⲧⲉⲥ como construção possessiva negativa, “ela não tem”, seguida de ⲉⲓⲛⲉ, “imagem”. Isso preserva o contraste com a imagem grande no Egito.
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ
  choice: a quem odiaram
  rationale: A leitura “odiaram” forma a antítese imediata com ⲙⲉⲣⲓⲧⲥ, “amaram”, embora a grafia do vocábulo seja incerta.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: em todo lugar
  rationale: A segmentação provável do OCR fornece a expressão locativa “em todo lugar”; ela modifica “odiaram”.
- source_word: ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: a quem amaram
  rationale: Expressa o polo positivo da antítese odiar/amar e mantém o paralelismo poético.
