translation:
  language: pt
  text: '**11.** Eu sou aquela que não celebra festa[a],

    e sou aquela cujas festas são muitas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Festa” também pode ser traduzida como “festival”; o termo subjacente é provavelmente um empréstimo do grego ἑορτή.
    reason: lexical_alternative
  - marker: b
    text: “São muitas” também pode ser entendido como “são abundantes” ou “são numerosas”; a leitura de ⲕⲁϩ é provisória.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧ(ⲉⲟⲣⲧⲏ)
  choice: não celebra festa
  rationale: A formação privativa ⲙⲛⲧⲁⲧ-, provavelmente ligada ao empréstimo grego para “festa”, exprime a ausência da observância festiva. “Não celebra festa” comunica esse sentido cultual em português natural.
- source_word: ϩⲛ ⲟⲩ ⲕⲁϩ
  choice: são muitas
  rationale: A leitura provisória aponta para multidão ou abundância. No paralelismo antitético, “são muitas” preserva de modo claro e conciso o paradoxo entre não celebrar festa e possuir muitas festas.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Conjunção coordenativa simples que liga as duas metades paradoxais.
- source_word: ⲡⲁⲓ … (construção relativa)
  choice: Eu sou aquela que
  rationale: Preserva a voz feminina, a fórmula declarativa recorrente e o paralelismo poético do texto.
