translation_notes:
  register: Português moderno, digno e acessível, com repetição deliberada de “Eu sou” para conservar o ritmo paradoxal. O gênero feminino acompanha a voz personificada do texto. A frase final permanece aberta porque o copta termina com “e” e continua no segmento seguinte.
