translation:
  language: pt
  text: 'Que os sábios sejam sábios.[a]


    Pois eu sou o conhecimento e a ignorância.


    Eu sou a vergonha e a ousadia.[b]


    Eu sou desavergonhada; eu sou acanhada.[c]


    Eu sou a força, e'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase também pode ser entendida como: “Sábios, sejam sábios”.'
    reason: A construção inicial admite uma leitura vocativa além da formulação jussiva adotada no texto.
  - marker: b
    text: A palavra traduzida por “ousadia” também pode significar franqueza, liberdade de falar ou confiança ao falar em público.
    reason: Explicita a extensão semântica de ⲡⲁⲣⲣⲏⲥⲓⲁ.
  - marker: c
    text: A palavra traduzida por “acanhada” é distinta da usada antes para “vergonha” e pode indicar acanhamento, recato ou modéstia.
    reason: Preserva a distinção lexical entre ϫⲓⲡⲏⲧ e ϣⲓⲡⲉ.
lexical_decisions:
- source_word: ⲥⲟⲩⲱⲛⲧ ⲙⲁⲣⲟⲩ ⲥⲟⲩⲱⲛⲧ
  choice: Que os sábios sejam sábios
  rationale: Lê ⲙⲁⲣⲟⲩ como jussivo de terceira pessoa e ⲥⲟⲩⲱⲛⲧ como referência aos sábios, preservando a cadência reiterativa e a ambiguidade em nota.
- source_word: ⲡⲥⲟⲟⲩⲛ / ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: o conhecimento / a ignorância
  rationale: Mantém o par abstrato e paradoxal do copta em português natural.
- source_word: ⲡϣⲓⲡⲉ
  choice: a vergonha
  rationale: É o sentido básico e forma contraste direto com a ousadia.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: a ousadia
  rationale: O empréstimo grego παρρησία denota franqueza, liberdade de fala e confiança pública; “ousadia” preserva a força retórica sem restringi-la apenas à fala.
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ / ⲟⲩϫⲓⲡⲏⲧ
  choice: desavergonhada / envergonhada
  rationale: Adjetivos substantivados em construção paralela preservam a forma identitária. A segunda palavra pode também sugerir acanhamento ou modéstia, indicado em nota.
- source_word: ⲛⲁϣⲧⲉ
  choice: a força
  rationale: Significa força, firmeza ou dureza, não medo; a conjunção final mostra que a frase continua no segmento seguinte.
