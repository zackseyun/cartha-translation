  text: I am the one on whom you have set your mind,[a] and you have rejected me.[b]
translation:
  language: pt
  text: '**13.** Eu sou aquela em quem vocês fixaram o pensamento,[a] e vocês me rejeitaram.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “puseram no coração sobre mim”; também pode ser traduzido por “meditaram em mim” ou “me consideraram”.
    reason: lexical_alternative
  - marker: b
    text: Ou “e vocês me lançaram fora” ou “me expulsaram”. A expressão ⲧⲱⲡ ⲉⲃⲟⲗ frequentemente tem o sentido de expulsar.
    reason: lexical_alternative
  - marker: c
    text: As linhas do OCR também mostram expressões como “para fora do conhecimento” e “nos lugares debaixo do céu”, talvez ainda uma referência a “julgamento”. Elas não foram incorporadas ao texto porque o alinhamento tem confiança média e provavelmente pertencem a unidades adjacentes.
    reason: alignment_note
lexical_decisions:
- source_word: ⲕⲁϩ ⲛϩⲏⲧ … ϣⲟⲡ
  choice: fixaram o pensamento em
  rationale: A construção exprime reflexão interior deliberada. “Fixaram o pensamento em” conserva essa força e soa natural em português moderno, sem reduzir a expressão a um simples “pensaram em”.
- source_word: ϩⲏⲧ
  choice: pensamento
  rationale: O termo designa o centro do pensamento e da intenção. “Pensamento” comunica aqui a nuance cognitiva; o sentido literal ligado ao “coração” é preservado na nota.
- source_word: ⲧⲱⲡ ⲉⲃⲟⲗ
  choice: rejeitaram
  rationale: A locução pode indicar lançar fora ou expulsar. No paralelismo com a reflexão interior, “rejeitaram” expressa com clareza a recusa ativa, enquanto a alternativa mais concreta fica registrada em nota.
theological_decisions:
- issue: Gênero da pessoa que fala
  choice: aquela
  alternative: aquele ser / a pessoa
  rationale: A voz literária de Trovão, Mente Perfeita apresenta-se no feminino, e o português exige uma escolha de gênero nessa formulação. “Aquela” mantém essa caracterização sem acrescentar uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. A formulação conserva o contraste entre contemplação interior e rejeição ativa. A nota de alinhamento recebe marcador no texto principal para que nenhuma nota fique sem remissão.
