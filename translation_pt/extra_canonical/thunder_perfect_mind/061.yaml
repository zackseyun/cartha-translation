translation:
  language: pt
  text: '**16.** Eu sou aquela de quem vocês se esconderam[b][a], e vocês se mostram a mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome-objeto visível parece ser ⲉⲣⲱⲧⲛ (“a vocês”), o que favoreceria a leitura “eu apareço a vocês”. Esta tradução acompanha o par tradicional do bloco — “esconder-se/mostrar-se a mim” —, mas a direção permanece incerta.
    reason: alternative_reading
  - marker: b
    text: O texto próximo contém ⲛⲛⲁⲙⲉⲗⲟⲥ ϩⲛ ⲧⲏⲩⲧⲛ (“os membros dentro de vocês”), o que sugere que material adjacente pode ter sido incluído neste segmento; o elemento “esconder” talvez pertença à linha anterior ou seguinte.
    reason: alignment_note
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: se mostram
  rationale: O verbo pode significar “aparecer” ou “tornar-se visível”. A forma reflexiva preserva o contraste paradoxal com “se esconderam” e soa natural em português.
- source_word: ϩⲟⲩⲛ
  choice: a / na direção de
  rationale: Com o verbo de aparecimento, o termo contribui para a orientação da ação. Na tradução corrente, essa relação é expressa simplesmente por “a” em “a mim”.
- source_word: ⲉⲣⲟⲓ / ⲉⲣⲱⲧⲛ
  choice: a mim / a vocês
  rationale: A forma visível no OCR parece ser ⲉⲣⲱⲧⲛ (“a vocês”), embora a divisão tradicional do trecho espere “a mim”. Mantém-se “a mim” no texto, mas a possível inversão é registrada em nota.
- source_word: '[motivo de ocultação; lexema não claramente legível no excerto]'
  choice: se esconderam
  rationale: O verbo copta específico para “esconder” não está claramente preservado neste recorte de OCR. A tradução segue o par paradoxal tradicional “esconder/aparecer”, assinalando a incerteza de alinhamento.
- source_word: '[voz feminina da obra]'
  choice: aquela
  rationale: A locutora de Trovão, Mente Perfeita apresenta-se como figura feminina; “aquela” torna isso explícito de modo natural sem acrescentar uma identificação teológica.
