  yaml_path: translation/extra_canonical/thunder_perfect_mind/007.yaml
  text: 'Do not be ignorant of me.

    For I am the first and the last;

    I am the honored and the scorned[a];

    I am the whore and the holy one[d];

    I am the wife[b] and the virgin[c][e].'
translation:
  language: pt
  text: 'Não sejam ignorantes a meu respeito.


    Pois eu sou a primeira e a última;


    eu sou a honrada e a desprezada[a];


    eu sou a prostituta e a santa[b];


    eu sou a esposa[c] e a virgem[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O OCR traz ϣⲏϣ, forma que normalmente pode significar “grande” ou “muitos” e não estabelece oposição clara a “honrada”. Muitos editores leem ou corrigem o termo como uma forma com o sentido de “desprezada”. A tradução é, portanto, provável, mas incerta.
    reason: textual_uncertainty
  - marker: b
    text: O copta ⲥⲉⲙⲛⲏ pode significar “santa”, “pura”, “casta” ou “venerável”.
    reason: lexical_alternative
  - marker: c
    text: O copta ⲥϩⲓⲙⲉ também pode ser traduzido simplesmente como “mulher”. Aqui, “esposa” realça o contraste com “virgem”.
    reason: lexical_alternative
  - marker: d
    text: ⲡⲁⲣ é uma abreviação, comum nos manuscritos de Nag Hammadi, do grego παρθένος, “virgem”.
    reason: scribal_abbreviation
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: Não me desconheçam
  rationale: Mantém a força cognitiva da proibição copta de modo conciso, sem reduzir a frase à ideia de simplesmente desprezar ou deixar de dar atenção.
- source_word: ⲧϣⲟⲣⲡ / ⲑⲁⲉ
  choice: a primeira / a última
  rationale: Reproduz diretamente o par antitético e concorda com a voz feminina do poema.
- source_word: ⲧⲁⲉⲓⲏⲩ
  choice: a honrada
  rationale: Expressa honra ou estima e preserva o paralelismo substantivado da sequência.
- source_word: ϣⲏϣ (segundo o OCR)
  choice: a desprezada
  rationale: Segue a leitura contextual adotada por muitos editores, que produz a antítese esperada com “honrada”; a incerteza do testemunho OCR é explicitada em nota.
- source_word: ⲡⲟⲣⲛⲏ
  choice: a prostituta
  rationale: Traduz claramente o empréstimo grego e conserva o impacto do contraste, em registro moderno e amplamente compreensível.
- source_word: ⲥⲉⲙⲛⲏ
  choice: a santa
  rationale: Conserva a ressonância de santidade e pureza do termo e cria um contraste direto com “prostituta”, sem limitar o sentido apenas à castidade.
- source_word: ⲥϩⲓⲙⲉ
  choice: a esposa
  rationale: O termo pode significar “mulher” ou “esposa”; “esposa” torna perceptível a tensão com “virgem”, enquanto a extensão lexical é preservada em nota.
- source_word: ⲡⲁⲣ
  choice: a virgem
  rationale: É uma abreviação escribal de παρθένος, cujo sentido aqui é “virgem”.
theological_decisions:
- issue: Identificação da voz com pares social e religiosamente contraditórios
  choice: Preservar cada paradoxo sem explicar como as afirmações se conciliam
  alternative: Interpretar os pares como alegoria moral, eclesial ou cosmológica
  rationale: O trecho apresenta deliberadamente identidades opostas; resolvê-las na tradução importaria uma interpretação não expressa pelo texto.
translation_notes:
  register: Português moderno, claro e solene, com cadência oracular marcada pela repetição de “eu sou”. Emprega-se “prostituta”, em vez de uma opção mais insultuosa, para conservar a contundência sem introduzir vulgaridade desnecessária. A concordância feminina é mantida em todos os títulos.
