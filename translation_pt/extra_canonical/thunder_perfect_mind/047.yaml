base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/047.yaml
  text: 'Among the peoples[a], they have named me “Death.”

    I am she whom they call “Law,” and you have called me “Lawlessness.”

    I am she whom you pursued, and I am she whom you seized.'
translation:
  language: pt
  text: 'Entre os povos[a], eu sou aquela a quem chamam “Morte”.


    Eu sou aquela a quem chamam “Lei”, e vocês me chamaram de “Ilegalidade”.


    Eu sou aquela que vocês perseguiram, e sou aquela que vocês agarraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Em muitos lugares”. A segmentação do texto copta nesta expressão é incerta.'
    reason: A leitura de ϩⲛⲙⲁⲛⲓⲙ no OCR permite uma interpretação social (“entre os povos”) ou locativa (“em muitos lugares”).
lexical_decisions:
- source_word: ϩⲛⲙⲁⲛⲓⲙ
  choice: Entre os povos
  rationale: Preserva a força locativa e plural da expressão, sem impor precisão indevida a uma segmentação incerta do OCR; a alternativa locativa é registrada em nota.
- source_word: ⲙⲟⲩⲧⲉ
  choice: dar o nome de / chamar de
  rationale: O verbo copta designa nomeação. A variação portuguesa mantém tanto o perfeito da primeira frase quanto a construção relativa e habitual da segunda.
- source_word: ⲡⲙⲟⲩ
  choice: Morte
  rationale: O artigo definido copta integra a designação citada; em português, a forma sem artigo funciona naturalmente como nome ou título.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: Lei
  rationale: Traduz diretamente o empréstimo grego νόμος e preserva sua função de designação em contraste com ἀνομία.
- source_word: ⲧⲁⲛⲟⲙⲓⲁ
  choice: Ilegalidade
  rationale: Expressa a negação ou violação da lei em linguagem portuguesa corrente e mantém o contraste lexical com “Lei”, sem recorrer ao termo técnico “anomia”.
- source_word: ⲁⲛⲟⲕ ⲧⲉ …
  choice: Eu sou aquela …
  rationale: Mantém a fórmula copular, o gênero feminino da voz e o paralelismo anafórico do texto.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: perseguiram
  rationale: Traduz idiomaticamente “correr atrás de” e conserva o paralelismo de ações dirigidas contra a locutora.
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: agarraram
  rationale: Preserva o sentido físico de apoderar-se ou segurar, sem acrescentar a conotação jurídica específica de “prenderam”.
theological_decisions:
- issue: Antítese entre νόμος e ἀνομία
  choice: “Lei” e “Ilegalidade”
  alternative: “Lei” e “Anomia”
  rationale: A tradução conserva a tensão paradoxal do original em linguagem compreensível, sem interpretar a oposição segundo uma tradição teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com cadência paralela. As designações paradoxais recebem iniciais maiúsculas. O presente habitual em “chamam” contrasta com o perfeito em “me chamaram”, conforme as formas coptas.
