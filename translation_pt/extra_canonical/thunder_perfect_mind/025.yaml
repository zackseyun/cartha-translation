    text: “Ousadia” traduz o empréstimo grego *parrēsía*, que pode indicar coragem ou liberdade para falar, fala franca ou franqueza.
    reason: lexical_alternative
  - marker: b
    text: O OCR traz uma forma incerta na segunda oração. O contexto e a leitura textual provável indicam “eu me envergonho”, em contraste com “eu sou sem vergonha”.
    reason: textual_uncertainty
  - marker: c
    text: O OCR parece corromper o segundo termo. A leitura textual provável produz o par “força” e “medo”; “dureza” e “tremor” são possibilidades lexicais relacionadas, mas menos adequadas ao paralelismo restaurado.
    reason: textual_uncertainty
  - marker: d
    text: A expressão copta provável significa literalmente “deem o coração de vocês a mim”, isto é, “prestem atenção em mim”. A segmentação do OCR obscurece parte das palavras.
    reason: textual_uncertainty
  - marker: e
