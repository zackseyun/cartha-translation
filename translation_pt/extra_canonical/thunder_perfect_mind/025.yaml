base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/025.yaml
  text: 'The shame and the boldness[a].

    I am shameless; I am ashamed.

    I am hard, and I am trembling.

    I am the war and the peace; within me they are.

    I am she[g][f][e][d][c][b]; heed me.'
translation:
  language: pt
  text: '**3.** A vergonha e a franqueza.[a]


    Eu sou sem vergonha; eu me envergonho.[b]


    Eu sou a força e o temor.[c]


    Eu sou a guerra e a paz.


    Prestem atenção em mim.[d]


    Eu sou aquela que é desonrada.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Franqueza” traduz o empréstimo grego *parrēsía*, que também pode significar “ousadia ao falar”, “fala franca” ou “liberdade de expressão”.
    reason: lexical_alternative
  - marker: b
    text: O OCR traz uma forma incerta na segunda oração. O contexto e a leitura textual provável indicam “eu me envergonho”, em contraste com “eu sou sem vergonha”.
    reason: textual_uncertainty
  - marker: c
    text: 'Também seria possível traduzir: “Eu sou dura e estou tremendo”. Aqui, os termos são entendidos como substantivos antitéticos: “força” e “temor”.'
    reason: lexical_alternative
  - marker: d
    text: Literalmente, a expressão copta provável é “deem o coração de vocês a mim”, isto é, “prestem atenção em mim”. O OCR juntou e deformou parte das palavras.
    reason: textual_uncertainty
  - marker: e
    text: O excerto termina nesta expressão. Algumas edições dão continuidade à frase no texto seguinte; nenhuma continuação foi acrescentada aqui.
    reason: scope_note
lexical_decisions:
- source_word: ⲡϣⲓⲡⲉ
  choice: vergonha
  rationale: O substantivo sahídico significa “vergonha”, não “silêncio”; a acepção é confirmada pelo contraste subsequente entre estar sem vergonha e envergonhar-se.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: franqueza
  rationale: O empréstimo grego παρρησία denota fala franca, abertura ou ousadia ao falar. “Franqueza” conserva o componente verbal melhor que a opção genérica “ousadia”.
- source_word: ⲁⲧϣⲓⲡⲉ
  choice: sem vergonha
  rationale: A formação privativa ⲁⲧ- + ϣⲓⲡⲉ significa literalmente “sem vergonha”; a locução preserva a relação lexical com “vergonha” e “me envergonho”.
- source_word: ϫⲓⲡⲏⲧ (OCR; provavelmente ϫⲓϣⲓⲡⲉ)
  choice: eu me envergonho
  rationale: A leitura do OCR é defeituosa. A restauração contextual ϫⲓϣⲓⲡⲉ, “sentir vergonha/envergonhar-se”, forma o paradoxo esperado com ⲁⲧϣⲓⲡⲉ.
- source_word: ⲛⲁϣⲧⲉ
  choice: força
  rationale: O termo pode exprimir dureza, vigor ou força. Como predicado substantivado introduzido por ⲟⲩ- e emparelhado com temor, “força” produz o contraste mais natural sem reduzir o termo a uma qualidade física.
- source_word: ⲣⲙⲧⲉ (OCR; provavelmente ⲥⲧⲱⲧⲉ)
  choice: temor
  rationale: A forma transmitida pelo OCR parece corrompida. A leitura ⲥⲧⲱⲧⲉ, atestada para temor, medo ou tremor, corresponde ao par antitético com “força”.
- source_word: ⲡⲟⲗⲉⲙⲟⲥ / ϯⲣⲏⲛⲏ
  choice: a guerra / a paz
  rationale: São empréstimos gregos transparentes, πόλεμος e εἰρήνη, e constituem uma antítese direta.
- source_word: ⲧⲓϩⲧⲏⲧⲛ ⲉⲣⲟⲉⲓ
  choice: Prestem atenção em mim
  rationale: O provável texto, obscurecido pela segmentação do OCR, emprega a expressão idiomática “dar o coração/atenção a”. A tradução comunica o imperativo plural em português atual.
- source_word: ⲧⲣⲁⲉⲓⲏⲟⲩ
  choice: aquela que é desonrada
  rationale: A forma é entendida como uma designação feminina relativa ligada a desonra ou desprezo; a tradução mantém a voz feminina e evita completar com material que não aparece no excerto fornecido.
theological_decisions:
- issue: Identidade paradoxal da locutora
  choice: 'Manter sem harmonização as autodeclarações opostas: sem vergonha/envergonhada, força/temor e guerra/paz.'
  alternative: Interpretar cada par como estados sucessivos, metáforas morais ou atributos de pessoas diferentes.
  rationale: O poema formula deliberadamente identidades simultâneas e tensas. Explicá-las no corpo do texto imporia uma interpretação teológica não exigida pelo copta.
- issue: Gênero da locutora na cláusula final
  choice: Usar “aquela que é desonrada”.
  alternative: Neutralizar como “quem é desonrado” ou usar uma forma masculina.
  rationale: A construção copta assinala uma locutora feminina; preservá-la é textual, não uma decisão doutrinária.
translation_notes:
  register: Português moderno, poético e digno, com paralelismo breve. Preferiu-se “franqueza” por preservar a dimensão de fala de *parrēsía* e “sem vergonha” por manter o jogo lexical com “vergonha”. O imperativo plural foi vertido em forma brasileira corrente, compreensível internacionalmente. As correções necessárias ao OCR foram sinalizadas em notas, e a sequência do copta foi respeitada, colocando o chamado à atenção antes da última autodeclaração.
