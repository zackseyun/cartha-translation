base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/076.yaml
  text: and the one they despise in scorn[a]. I am peace[c][b], and because of me war has come to be.
translation:
  language: pt
  text: e aquela que eles desprezam com escárnio.[a] Eu sou a paz, e por minha causa a guerra veio a existir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho começa no meio de uma sequência anterior; por isso, o “e” inicial liga esta frase ao contexto precedente.
    reason: alignment_note
  - marker: b
    text: “Veio a existir” também pode ser traduzido como “surgiu”, “aconteceu” ou “veio a ser”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: aquela que eles desprezam
  rationale: Preserva a oração relativa feminina e o sentido direto do verbo de origem grega, sem omitir a autodesignação implícita.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: com escárnio
  rationale: Expressa a maneira ou atitude do desprezo e mantém a intensificação presente no copta.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ϯⲣⲏⲛⲏ
  choice: Eu sou a paz
  rationale: Mantém a fórmula reiterada de autoidentificação e o contraste paradoxal explícito com a guerra.
- source_word: ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: a guerra
  rationale: Equivalente comum do empréstimo grego πόλεμος; o artigo é natural em português e acompanha a forma determinada copta.
- source_word: ϣⲱⲡⲉ
  choice: veio a existir
  rationale: Conserva a ideia de surgimento ou passagem à existência, em vez de reduzi-la simplesmente a um acontecimento.
- source_word: ⲉⲧⲃⲏⲏⲧ
  choice: por minha causa
  rationale: Reproduz a causalidade explícita e pessoal que sustenta o paradoxo da frase.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Traduz a conjunção copta de modo simples, sem introduzir um contraste adversativo que o texto não marca.
theological_decisions:
- issue: Relação entre a paz personificada e a origem da guerra
  choice: 'Preservar a afirmação causal: “por minha causa a guerra veio a existir”'
  alternative: Suavizar para “em torno de mim surgiu a guerra” ou “por causa da oposição a mim”
  rationale: O copta afirma causalidade de modo direto; explicar quem causa a guerra ou como ela surge resolveria indevidamente a tensão teológica e poética.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A construção feminina “aquela” acompanha a forma copta e a voz feminina do discurso. Mantiveram-se a coordenação simples e o paradoxo entre paz e guerra, sem explicação doutrinária.
