base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/015.yaml
  text: My father[a], and the sister of my husband—and he is my offspring. I am the servant of my husband[e][d][c][b], and I am the Lady.
translation:
  language: pt
  text: '**10.** Meu pai[a] e a irmã de meu marido — e ele é meu descendente. Sou a serva[b] de meu marido e sou a Senhora[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O excerto copta alinhado começa com “meu pai” e provavelmente se inicia no meio de uma frase; por isso, a tradução não completa por conjectura as palavras anteriores.
    reason: textual_scope
  - marker: b
    text: Também pode ser traduzido por “a escrava”. O copta significa “serva” ou “escrava”, não “noiva”.
    reason: lexical_alternative
  - marker: c
    text: “Senhora” é aqui o feminino de “Senhor”, no sentido de alguém que exerce autoridade; “ama” seria outra possibilidade.
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: meu pai
  rationale: O substantivo ⲉⲓⲱⲧ com o possessivo de primeira pessoa significa literalmente “meu pai”. Como o excerto alinhado parece começar no meio de uma construção, não se acrescentou ao texto principal material ausente.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁϩⲁⲓ
  choice: a irmã de meu marido
  rationale: Mantém o substantivo feminino “irmã” e a relação genitiva com “meu marido”, sem transformar a expressão em “minha irmã”.
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: e ele é meu descendente
  rationale: ϫⲡⲟ designa prole ou descendência; com o pronome masculino singular ⲛⲧⲟϥ, “meu descendente” é natural em português e preserva o paradoxo relacional sem especificar indevidamente “filho”.
- source_word: ⲧϩⲙϩⲁⲗ
  choice: a serva
  rationale: ϩⲙϩⲁⲗ significa servo ou escravo, não “noiva”. “Serva” conserva a oposição direta com o título feminino de autoridade que vem a seguir, evitando tornar a formulação desnecessariamente mais dura do que o contexto permite.
- source_word: ⲛⲧⲉ ⲡⲁϩⲁⲓ
  choice: de meu marido
  rationale: Reproduz de modo compacto e natural a construção genitiva copta.
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: a Senhora
  rationale: É a forma feminina correspondente a “senhor” e expressa autoridade. A inicial maiúscula indica o uso titular e ajuda a preservar o contraste com “serva”; “senhora” é preferível a “ama”, que pode ser ambíguo em português.
theological_decisions:
- issue: Paradoxo entre sujeição e autoridade
  choice: “a serva” / “a Senhora”
  alternative: “a escrava” / “a senhora”
  rationale: A tradução mantém a antítese explícita do copta sem convertê-la em um paradoxo nupcial inexistente neste trecho. “Serva” é semanticamente legítimo, enquanto a nota registra a alternativa mais forte.
- issue: Relação entre o marido e a voz feminina
  choice: “ele é meu descendente”
  alternative: “ele é minha prole”
  rationale: A construção conserva a inversão paradoxal das relações familiares e o referente masculino de ⲛⲧⲟϥ, sem resolver a imagem como uma relação biológica ou teológica específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência reiterativa de “Sou...” foi preservada. O início abrupto permanece visível porque o material fornecido é um excerto de OCR alinhado e não autoriza a restauração silenciosa da parte anterior.
