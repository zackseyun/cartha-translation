translation:
  language: pt
  text: '**3.** E vocês me honram[a]. Vocês me desprezaram e me viram. Não espalhem as primeiras coisas[b] [...] Não ponderem [...] seus membros[c] [...].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta traz “honram”. A tradução “abraçam” deriva de um texto de consulta que não corresponde com segurança a estas linhas.
    reason: source_alignment
  - marker: b
    text: Ou “os primeiros”, “os começos” ou “os princípios”. O manuscrito torna-se fragmentário logo depois desta expressão.
    reason: lexical_alternative
  - marker: c
