lexical_decisions:
- source_word: ⲧⲁⲉⲓⲟ
  choice: honram
  rationale: Neste contexto, o verbo copta significa primariamente “honrar”. A tradução “abraçar” pertence ao texto de consulta desalinhado e não é sustentada por este trecho do original.
- source_word: ϣⲱϥ
  choice: desprezaram
  rationale: Com o prefixo verbal ⲁⲧⲉⲧⲛ-, a forma indica uma ação da segunda pessoa do plural, não o privativo “sem vergonha”. “Desprezaram” preserva o contraste com “honram”.
- source_word: ⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: dispersem
  rationale: A construção expressa lançar, derramar ou espalhar para fora. “Dispersem” oferece uma formulação natural sem definir excessivamente o modo da ação.
- source_word: ⲛϣⲟⲣⲡ
  choice: as primeiras coisas
  rationale: Tradução formal que conserva a indefinição do substantivado; “os princípios” ou “os começos” também são possíveis.
- source_word: ⲙⲉⲗⲉⲧⲁ
  choice: ponderem
  rationale: O empréstimo grego pode significar meditar, considerar ou praticar. No contexto fragmentário, “ponderem” evita impor um objeto ou sentido técnico.
- source_word: ⲗⲁⲁⲧⲉ
  choice: membros
  rationale: “Membros” mantém a referência corporal e é mais adequado que uma reconstrução específica como “braços” ou “pernas”.
theological_decisions:
- issue: Contraste entre honra e desprezo
  choice: Preservar as duas afirmações sem harmonizá-las
  alternative: Interpretar uma delas como referência a vergonha ou ausência de vergonha
  rationale: A leitura baseada no copta apresenta ações contrastantes dirigidas à voz poética; o paradoxo deve permanecer, sem ser convertido numa formulação ética oriunda do texto de consulta desalinhado.
translation_notes:
  register: Português moderno, digno e direto, com tratamento plural por “vocês”, de ampla legibilidade brasileira. As lacunas são mantidas explicitamente porque o trecho copta está danificado e o alinhamento do texto de consulta é pouco confiável.
