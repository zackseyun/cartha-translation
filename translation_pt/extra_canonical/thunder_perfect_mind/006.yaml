translation:
  language: pt
  text: Pois eu sou a primeira e a última[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Veja Isaías 44:6 e Apocalipse 22:13, onde aparecem fórmulas semelhantes: «Eu sou o primeiro e eu sou o último».'
    reason: cross_reference
  - marker: b
    text: ⲑⲁⲉ também pode ser entendido como «o fim». Aqui se adotou a formulação equilibrada «a última».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲅⲁⲣ
  choice: pois
  rationale: Preserva o valor causal da partícula, que apresenta a razão da exortação anterior.
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: eu sou
  rationale: Expressa naturalmente em português a identificação copular e mantém a cadência enfática das declarações em primeira pessoa.
- source_word: ⲧϣⲟⲣⲡ
  choice: a primeira
  rationale: O termo pode designar o primeiro ou o princípio; aqui, como predicado de identidade e em paralelo com ⲑⲁⲉ, «a primeira» preserva melhor a simetria. O feminino reproduz a marca gramatical explícita do copta.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Conjunção coordenativa simples que une o par contrastante.
- source_word: ⲑⲁⲉ
  choice: a última
  rationale: Pode significar «fim» ou «última»; neste paralelismo titular, «a última» conserva o equilíbrio com «a primeira» e a forma feminina do original.
theological_decisions:
- issue: Gênero gramatical da voz que fala
  choice: a primeira e a última
  alternative: o primeiro e o último
  rationale: Os artigos e a cópula no copta são femininos. A tradução mantém esse dado textual sem identificar além do que o trecho declara a natureza da pessoa que fala.
translation_notes:
  register: Português moderno, claro e solene. «Pois» mantém a ligação argumentativa com o contexto anterior; a estrutura breve conserva o ritmo aforístico e paradoxal do original. As formas femininas refletem diretamente a gramática copta.
