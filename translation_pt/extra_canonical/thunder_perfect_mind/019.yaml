base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/019.yaml
  text: I am the voice whose sound is manifold[a], and the word whose appearance is manifold. I am the utterance of my name. Why, you who hate me, do you love me[g][f][e][d][c][b], and hate those who love me?
translation:
  language: pt
  text: '**14.** Eu sou a voz cujo som é múltiplo[a] e a palavra cuja aparência é múltipla. Eu sou a fala do meu nome. Por que vocês, que me odeiam, me amam e odeiam os que me amam?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “variado” ou “multiforme”. A expressão copta indica multiplicidade ou abundância tanto do som quanto, na frase seguinte, da aparência.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲥⲙⲏ
  choice: a voz
  rationale: ⲥⲙⲏ significa “voz”; o artigo definido foi preservado, e a leitura evita a antiga interpretação equivocada como “bastão”.
- source_word: ⲉⲧⲉⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: cujo som é múltiplo
  rationale: A expressão descreve uma voz de som abundante ou multiforme; “múltiplo” conserva a amplitude sem especificar indevidamente se se trata de volume, variedade ou muitas vozes.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: a palavra
  rationale: O empréstimo grego logos pode significar palavra, discurso ou enunciado. “Palavra” é natural em português e mantém o paralelismo com “voz”, sem impor aqui um título teológico técnico.
- source_word: ⲉⲧⲉ ⲛⲁϣⲉ ⲡⲉϥⲉⲓⲛⲉ
  choice: cuja aparência é múltipla
  rationale: A construção atribui multiplicidade à aparência ou forma do logos; esta leitura segue a análise contextual corrigida e não a antiga segmentação como expressão de vontade.
- source_word: ⲡϣⲁϫⲉ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: a expressão do meu nome
  rationale: ⲡϣⲁϫⲉ denota palavra, fala ou enunciado. “Expressão” evita repetição imediata de “palavra” e preserva o caráter vocal do trecho.
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Por que
  rationale: É a locução interrogativa copta “por quê?”, introduzindo diretamente a pergunta paradoxal.
- source_word: ⲙⲟⲥⲧⲉ / ⲙⲉ
  choice: odiar / amar
  rationale: Os verbos formam uma antítese explícita que deve permanecer incisiva em português.
theological_decisions:
- issue: Possível ressonância teológica de ⲡⲗⲟⲅⲟⲥ
  choice: Traduzir como “a palavra”
  alternative: “o Logos”
  rationale: O contexto apresenta uma série poética de autodeclarações, mas não exige que o termo seja tratado como título técnico. A tradução comum preserva o sentido lexical e evita importar uma identificação doutrinária não explicitada.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e compreensão internacional. Mantém-se a repetição de “múltiplo” para reproduzir o paralelismo deliberado do copta. O fragmento inicial do OCR, pertencente provavelmente à linha anterior e textualmente corrompido, não foi incorporado.
