base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/049.yaml
  text: And I am she whom you seized[a]. I am she whom you scattered, and you gathered me in. I am she before whom you were ashamed[b][c][d], and you were shameless toward me.
translation:
  language: pt
  text: '**4.** E eu sou aquela que vocês agarraram. Sou aquela que vocês dispersaram[a] e recolheram. Sou aquela de quem vocês se envergonharam e diante de mim agiram sem vergonha.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mandaram para fora”. O verbo copta admite essa leitura; “dispersaram” destaca o contraste com “recolheram”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲟⲉⲓ
  choice: agarraram
  rationale: O verbo significa tomar, agarrar ou apoderar-se; “agarraram” expressa de modo direto a ação exercida sobre a locutora.
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: dispersaram
  rationale: A construção pode significar mandar para fora ou dispersar. “Dispersaram” forma o contraste mais natural com o ato seguinte de recolher, sem eliminar a alternativa lexical.
- source_word: ⲥⲟⲟⲩϩ ⲛⲧⲉϩⲟⲩⲛ
  choice: recolheram
  rationale: O texto parece conter, apesar da corrupção do OCR, a ideia de reunir ou recolher para dentro; “recolheram” preserva a oposição poética a “dispersaram”.
- source_word: ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: de quem vocês se envergonharam
  rationale: A expressão descreve vergonha em relação à locutora. A formulação portuguesa é natural sem fixar em excesso a nuance da preposição copta.
- source_word: ⲣⲁⲧϣⲓⲡⲉ
  choice: agiram sem vergonha
  rationale: A expressão privativa significa ser ou tornar-se desavergonhado. “Agiram sem vergonha” comunica a oposição direta ao verbo anterior em português corrente e digno.
theological_decisions:
- issue: Contraste paradoxal entre vergonha e falta de vergonha diante da mesma locutora
  choice: Manter as duas afirmações em tensão, ligadas por “mas”
  alternative: Explicar a mudança como arrependimento, hostilidade ou libertinagem
  rationale: O texto não identifica a causa nem o sentido moral preciso da contradição; explicá-la importaria uma interpretação não presente na fonte.
translation_notes:
  register: Português moderno, claro e solene, com repetição de “Sou aquela” para preservar a cadência anafórica. O feminino da locutora foi mantido. A tradução segue o trecho copta efetivamente alinhado, não a antiga leitura sobre Egito e estrangeiros, que pertencia a outras linhas.
