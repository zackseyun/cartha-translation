lexical_decisions:
- source_word: ⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟⲓ
  choice: Vocês olham para mim
  rationale: Reproduz diretamente a construção copta de ver ou olhar para alguém, em linguagem portuguesa natural.
- source_word: ⲙⲡⲉⲧⲛⲥⲁⲛϩⲟⲩ ⲛⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: expulsa do meio de vocês
  rationale: Segue a leitura contextual adotada pela camada de consulta mais recente; a forma transmitida pelo OCR e a segmentação permanecem incertas, por isso a dificuldade é indicada em nota.
- source_word: ⲧⲉⲧⲛⲣⲥⲱⲧⲉ
  choice: são derrotados
  rationale: Lê corretamente o conjunto como ⲣ-ⲥⲱⲧⲉ, ‘ser derrotado’ ou ‘fracassar’, em vez de separar erroneamente ⲣⲥⲱ como ‘gritar’.
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: Escutem-me, ouvintes
  rationale: Mantém o apelo direto e o vocativo; ‘ouvintes’ traduz com naturalidade o empréstimo grego ἀκροατής.
- source_word: ⲛⲧⲉⲧⲛϫⲓⲥⲃⲱ ⲉⲛⲁϣⲁϫⲉ
  choice: e aprendam minhas palavras
  rationale: 'Adota a correção paleográfica do OCR: ϫⲓ-ⲥⲃⲱ significa ‘receber instrução/aprender’, e ⲛⲁϣⲁϫⲉ, ‘minhas palavras’.'
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: vocês que me conhecem
  rationale: Trata a expressão como vocativo paralelo a ‘ouvintes’, conforme a sintaxe do trecho.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Eu sou...
  rationale: Preserva o começo interrompido da frase seguinte e não acrescenta o complemento interpretativo ‘aquela’ ou ‘a única’.
theological_decisions:
- issue: Referência feminina implícita em ‘expulsa’
  choice: expulsa
  alternative: expulso(a) / lançada para fora
  rationale: A voz discursiva da obra se apresenta no feminino; a concordância portuguesa torna isso explícito sem acrescentar uma identificação teológica.
- issue: Fórmula copular final incompleta
  choice: Eu sou...
  alternative: Eu sou aquela
  rationale: Mantém a quebra do excerto e evita transformar uma abertura sintática na afirmação teológica completa ‘Eu sou aquela’.
