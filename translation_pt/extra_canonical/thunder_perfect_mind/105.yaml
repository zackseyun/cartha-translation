base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/105.yaml
  text: 'You look on me[a], cast out from yourselves,

    and you are defeated.

    Listen to me, you hearers,

    and learn my words,

    you who know me[g][f][e][d][c][b].

    I am...'
translation:
  language: pt
  text: 'Vocês olham para mim, expulsa do meio de vocês,[a]

    e são derrotados.

    Escutem-me, ouvintes,

    e aprendam minhas palavras,

    vocês que me conhecem.

    Eu sou...'
