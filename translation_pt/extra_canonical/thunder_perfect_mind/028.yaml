  terminology: «Os que vêm» preserva a forma relativa de «vir», sem confundi-la com «os que veem». «Monte de esterco» para κοπρία, seguido de «esterco» para ⲕⲱⲕ, mantém a duplicação enfática do copta. As notas sobre a provável deformação OCR e sobre o desencontro do texto de consulta são apropriadas.
