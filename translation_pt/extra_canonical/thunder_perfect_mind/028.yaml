  text: Look out upon the earth, and you will find me among those who see; and do not look upon the dung-heap of dung.
translation:
  language: pt
  text: '**6.** Olhem ao redor, sobre a terra[a], e vocês me encontrarão entre os que vêm[b]; não olhem para o monte de esterco de esterco.[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura inicial parece ser ⲛⲁⲩ ⲉⲃⲟⲗ, «olhem para fora/ao redor». O OCR juntou ou deformou as palavras como ⲛⲁⲉⲃⲟⲗ.
    reason: textual_note
  - marker: b
    text: ⲉⲧⲛⲏⲟⲩ significa «os que vêm» ou «os que estão vindo». A leitura «os que veem» exigiria uma forma do verbo ⲛⲁⲩ, «ver».
    reason: lexical_alternative
  - marker: c
    text: O copta combina o empréstimo grego κοπρία, «monte de esterco», com ⲕⲱⲕ, «esterco/excremento». «Monte de esterco de esterco» mantém essa repetição enfática e degradante.
    reason: cultural_note
  - marker: d
    text: 'O texto de consulta atribuído a este bloco diz: «Não tenho vergonha; estou envergonhada». Ele não corresponde ao trecho copta aqui apresentado, provavelmente por causa do alinhamento heurístico das linhas.'
    reason: alignment_note
lexical_decisions:
- source_word: ⲛⲁⲉⲃⲟⲗ ϩⲓ ⲡⲕⲁϩ
  choice: Olhem ao redor pela terra
  rationale: O texto parece representar ⲛⲁⲩ ⲉⲃⲟⲗ, uma ordem para olhar para fora ou ao redor, seguido de ϩⲓ ⲡⲕⲁϩ, «sobre/pela terra». A formulação portuguesa preserva o movimento do olhar sem sugerir incorretamente que a locutora sairá.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: vocês me encontrarão
  rationale: Forma de futuro na segunda pessoa do plural, seguida do objeto de primeira pessoa singular. «Vocês» oferece leitura natural no português brasileiro e continua compreensível internacionalmente.
- source_word: ϩⲛ ⲛⲉⲧⲛⲏⲟⲩ
  choice: entre os que vêm
  rationale: ϩⲛ diante de um grupo admite «entre». ⲛⲏⲟⲩ é a forma qualitativa de ⲉⲓ, «vir», portanto indica os que vêm ou estão vindo, e não os que veem.
- source_word: ⲙⲡⲣⲛⲁⲩ
  choice: não olhem
  rationale: Imperativo negativo plural de ⲛⲁⲩ, «ver/olhar». O português corrente dispensa o mais solene «não contemplem».
- source_word: ⲉⲡⲓⲧⲕⲟⲩⲡⲣⲓⲁ ⲛⲧⲉ ⲡⲓⲕⲱⲕ
  choice: para a esterqueira de esterco
  rationale: O empréstimo grego κοπρία designa uma esterqueira ou monte de esterco, enquanto ⲕⲱⲕ designa esterco/excremento. A repetição deliberadamente áspera conserva a duplicação do copta.
