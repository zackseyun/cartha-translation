- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: … do que vocês ouvem
  rationale: O trecho preservado parece concluir uma construção anterior e contém a forma de segunda pessoa do plural ligada a ⲥⲱⲧⲙ, “ouvir”. A lacuna anterior impede determinar com segurança a sintaxe completa.
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: minha defesa
  rationale: O possessivo ⲧⲁ- indica “minha”, e o empréstimo grego ἀπολογία tem aqui seu sentido direto de “defesa” ou “resposta em defesa”. O fragmento não oferece base suficiente para generalizá-lo como “fala”.
- source_word: ⲉⲩϣⲁⲛ-
  choice: se eles
  rationale: A sequência introduz uma oração condicional com sujeito de terceira pessoa do plural; o verbo seguinte está truncado, por isso não é reconstruído no texto.
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: a injustiça
  rationale: O substantivo nominalizado designa injustiça, violência ou opressão. “Injustiça” preserva o sentido ético amplo sem impor a falsa ideia de algo que não pode ser “agarrado”.
