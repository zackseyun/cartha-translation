base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/036.yaml
  text: It is the utterance according to prudence of my seeking[a], and it is the knowledge of my searching[d][c][b]. But I am she who exists in all fears and in courage.
translation:
  language: pt
  text: '**1.** É a enunciação[a] segundo a prudência da minha busca, e é o conhecimento da minha procura. Mas eu sou aquela que existe em todos os medos e na coragem[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra copta inicial é incerta por causa da leitura do manuscrito/OCR. “Enunciação” é uma tradução provisória; também seria possível “dito”.
    reason: textual_uncertainty
  - marker: b
    text: O termo traduzido por “coragem” também pode ter o sentido de “virilidade” ou “bravura”. Aqui, “coragem” preserva melhor o contraste com “medos” sem acrescentar uma nuance masculina.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲕⲉⲟⲩⲁⲩ
  choice: enunciação
  rationale: A leitura do OCR é incerta. “Enunciação” mantém um sentido nominal amplo e um registro filosófico, sem especificar além do que o contexto permite.
- source_word: ⲧⲁⲣⲕⲁⲧⲁ ⲫⲣⲟⲛⲓ
  choice: segundo a prudência
  rationale: Reflete o provável empréstimo grego κατά e o termo filosófico φρόνησις, preservando a construção e o registro abstrato.
- source_word: ⲣⲓⲧⲉ
  choice: busca
  rationale: Conserva o valor de substantivo verbal e forma paralelo natural com “procura” na oração seguinte.
- source_word: ⲥⲁϩⲟⲩ
  choice: conhecimento
  rationale: Expressa diretamente o conteúdo cognitivo do substantivo copta, sem ampliar para “sabedoria”.
- source_word: ϣⲟⲩϣⲟⲩ
  choice: procura
  rationale: Preserva o paralelismo com “busca”, ao mesmo tempo evitando repetição artificial em português.
- source_word: ⲧⲉⲧϣⲟⲟⲡ
  choice: aquela que existe
  rationale: Representa a forma relativa feminina e mantém a autoidentificação feminina, gramatical e literariamente significativa.
- source_word: ⲛ̄ⲛ̄ⲫⲟⲃⲟⲥ ⲧⲏⲣⲟⲩ
  choice: em todos os medos
  rationale: ⲧⲏⲣⲟⲩ funciona como quantificador “todos”, e não como possessivo; o plural “medos” preserva a forma do texto.
- source_word: ⲡⲛⲏϣⲁⲧ
  choice: coragem
  rationale: Transmite o sentido de valor ou bravura e mantém a oposição ao medo sem introduzir a conotação de gênero de “virilidade”.
theological_decisions:
- issue: Presença da voz feminina em realidades contrárias
  choice: “aquela que existe em todos os medos e na coragem”
  alternative: “estou em todos os medos e na coragem”
  rationale: A tradução retém tanto a forma relativa feminina quanto a tensão deliberada entre medo e coragem, sem harmonizá-la ou explicá-la teologicamente.
translation_notes:
  register: Português moderno, digno e acessível, com leve registro filosófico. Mantiveram-se o paralelismo entre “busca” e “procura”, a autoidentificação feminina e a oposição paradoxal entre todos os medos e a coragem.
