base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/082.yaml
  text: 'I am the union and the dissolution[a];

    I am the abiding[d][c][b],

    and I am the dissolution.'
translation:
  language: pt
  text: '**7.** Eu sou a união e a dissolução[a];


    eu sou a permanência[b],


    e eu sou a dissolução.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser traduzido por “desligamento” ou “ato de desfazer”.
    reason: lexical_alternative
  - marker: b
    text: O termo também pode significar “morada” ou “repouso”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲡⲱⲧⲣ
  choice: a união
  rationale: O substantivo copta indica união ou junção. “União” conserva a contraposição direta com a dissolução sem introduzir a leitura etimológica incorreta “o Primeiro”.
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: a dissolução
  rationale: A expressão formada com ⲕⲱⲗ e ⲉⲃⲟⲗ comunica soltar, desfazer ou dissolver. “Dissolução” exprime o substantivo abstrato e mantém o paradoxo com “união”.
- source_word: ⲧⲙⲟⲛⲏ
  choice: a permanência
  rationale: O empréstimo grego monē pode designar permanência, morada ou repouso. Aqui, “permanência” preserva o sentido abstrato e o contraste com “dissolução”.
- source_word: ⲡⲕⲱⲗ
  choice: a dissolução
  rationale: Neste contexto, o termo retoma a ideia de soltar ou dissolver; a repetição foi mantida, em vez de se interpretar indevidamente a palavra como “o Todo”.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Conjunção coordenativa simples, reproduzindo a estrutura paratática do copta.
theological_decisions:
- issue: Repetição paradoxal de “dissolução”
  choice: Manter “dissolução” nas duas ocorrências
  alternative: Variar entre “dissolução”, “desligamento” ou “desfazer”
  rationale: A repetição pertence à forma retórica da autoproclamação e não deve ser harmonizada nem convertida em títulos cosmológicos distintos.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. Preferiu-se “permanência” a “habitação” para manter a sequência de substantivos abstratos e tornar nítido o contraste com “dissolução”.
