base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/068.yaml
  text: Why do you despise me among those who are small? I am the Mind[a], and my Rest[f][e][d][c][b]. You are the knowledge of my kind
translation:
  language: pt
  text: '**5.** Vocês, então, me desprezam entre os pequenos.[a] Eu sou a Mente[b] e o meu Descanso. Vocês são o conhecimento da minha espécie.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pequenos” também pode significar os jovens ou os que estão na infância. O trecho chegou por meio de um OCR incerto; a leitura adotada segue a reconstrução copta corrigida.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “Intelecto”; em forma técnica, “Nous”. O copta ⲡⲛⲟⲩⲥ é um empréstimo do grego νοῦς.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “da minha linhagem” ou “do meu gênero”. A leitura “espécie” depende da reconstrução ⲅⲉⲛⲟⲥ, “espécie, gênero, linhagem”, em lugar da forma corrompida no OCR.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲧⲱⲃⲡ … ⲙⲙⲟⲓ
  choice: vocês … me desprezam
  rationale: A leitura corrigida do OCR indica uma forma verbal na segunda pessoa do plural e o objeto de primeira pessoa. A formulação declarativa segue mais diretamente a sintaxe copta do que a pergunta presente na camada inglesa.
- source_word: ⲟⲩⲛ
  choice: então
  rationale: Aqui funciona como partícula discursiva ou inferencial, não como verbo existencial.
- source_word: ⲛⲉⲧⲛⲉⲣⲙⲛⲥⲁⲛⲁⲓ
  choice: entre os pequenos
  rationale: Mantém o campo semântico de pequenez sem restringi-lo indevidamente à infância ou juventude.
- source_word: ⲡⲛⲟⲩⲥ
  choice: a Mente
  rationale: Empréstimo do grego νοῦς, referente à faculdade intelectual. “Mente” é compreensível em português e conserva o peso filosófico; a alternativa técnica é registrada em nota.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: o meu Descanso
  rationale: O possessivo de primeira pessoa acompanha o empréstimo grego ἀνάπαυσις. “Descanso” preserva tanto o sentido comum quanto sua possível densidade religiosa, sem explicá-la.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: o conhecimento
  rationale: Equivalente direto do substantivo copta para conhecimento ou compreensão.
- source_word: ⲙⲡⲁⲅⲉⲛⲟⲥ (reconstruído)
  choice: da minha espécie
  rationale: A leitura corrigida identifica o empréstimo grego γένος, “espécie, gênero, linhagem”. “Espécie” conserva a amplitude da relação de pertencimento sem impor uma genealogia biológica.
theological_decisions:
- issue: Personificação de Mente e Descanso
  choice: Uso de iniciais maiúsculas em “Mente” e “Descanso”
  alternative: mente e descanso
  rationale: As maiúsculas sinalizam predicados personificados da voz que fala, sem defini-los como nomes divinos nem resolver sua relação metafísica.
- issue: Relação expressa por γένος
  choice: minha espécie
  alternative: minha linhagem
  rationale: A escolha mantém aberta a natureza exata do vínculo entre a voz e seus ouvintes; “linhagem” poderia sugerir descendência de modo mais específico do que a fonte exige.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A sintaxe deliberadamente enigmática das autodeclarações foi preservada, sem harmonização doutrinária. As maiúsculas em “Mente” e “Descanso” indicam personificação literária.
