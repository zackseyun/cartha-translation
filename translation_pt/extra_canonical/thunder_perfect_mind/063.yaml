translation:
  language: pt
  text: '**18.** Mas, sempre que vocês aparecerem[c][b][a], eu me ocultarei de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sempre que vocês se revelarem, eu me afastarei de vocês”.'
    reason: lexical_alternative
  - marker: b
    text: 'Esta linha constitui uma das metades de um par paradoxal geralmente transmitido em conjunto: “quando vocês se ocultarem, eu aparecerei” / “quando vocês aparecerem, eu me ocultarei”.'
    reason: parallelism_note
  - marker: c
    text: 'Também se pode traduzir: “Mas, quando vocês aparecerem, eu me ocultarei de vocês”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: aparecerem
  rationale: A expressão indica tornar-se visível ou manifestar-se. “Aparecerem” é direta, natural e mantém nítida a inversão paradoxal entre aparecer e ocultar-se.
- source_word: ϩⲱⲡ
  choice: me ocultarei
  rationale: O verbo significa esconder ou ocultar. A forma reflexiva combina com o sujeito em primeira pessoa e preserva o contraste poético com “aparecerem”.
- source_word: ⲇⲉ
  choice: mas
  rationale: A partícula pode ser continuativa ou adversativa; neste par antitético, “mas” expressa com clareza o contraste com a linha precedente, sem acrescentar uma relação causal.
- source_word: ⲉⲧⲉⲧⲛϣⲁⲛ-
  choice: sempre que vocês
  rationale: A construção condicional-temporal admite “quando” ou “sempre que”. A segunda opção transmite o valor recorrente e conserva a formulação concisa.
theological_decisions:
- issue: Relação paradoxal entre manifestação e ocultamento
  choice: Manter sem explicação no texto a inversão entre o aparecimento dos interlocutores e o ocultamento da voz.
  alternative: Interpretar a fala como afastamento espiritual, juízo ou incapacidade humana de perceber a revelação.
  rationale: O enunciado poético não especifica a causa nem desenvolve uma doutrina. A tradução preserva sua tensão genuína sem impor uma leitura confessional.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com “vocês” como plural não marcado para leitores brasileiros e inteligível internacionalmente. “Ocultarei” conserva o tom poético sem soar arcaico. A ordem dos marcadores acompanha o texto de consulta auditado.
