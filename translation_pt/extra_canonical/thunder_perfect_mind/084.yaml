    reason: alignment_note
  - marker: b
    text: A forma copta é incerta neste OCR. Também pode admitir uma leitura proibitiva, como «não saia», em vez da declaração «não saí».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁⲩ ⲉⲧⲛⲏⲟⲩ ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: aquele que vê o que vem diante de mim
  rationale: Mantém a construção relativa e o movimento espacial sem completar além do que permite o trecho truncado; a leitura continua incerta por causa do OCR e do início ausente.
- source_word: ⲫⲱⲧ
  choice: luz
  rationale: Segue a leitura contextual adotada na camada auditada, adequada ao contraste imediato com a escuridão, embora a forma transmitida pelo OCR seja problemática.
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: não saí
  rationale: A leitura declarativa acompanha a série de afirmações na primeira pessoa; a possibilidade de outra análise, inclusive proibitiva, é registrada em nota.
- source_word: ⲟⲩⲁⲧⲛⲟⲕⲉ
  choice: sem escuridão
  rationale: Expressa em português natural a formação privativa copta, preservando o contraste paradoxal com a raiz da escuridão.
- source_word: ⲧⲛⲟⲩⲛⲉ ⲙⲡⲛⲟⲕⲉ
  choice: a raiz da escuridão
  rationale: Analisa ⲧⲛⲟⲩⲛⲉ como «a raiz» e o sintagma seguinte como seu complemento genitivo, conforme a revisão filológica mais recente.
- source_word: ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧ ⲧⲉ
  choice: vem de dentro de mim
  rationale: Representa a origem interior indicada pela construção prepositiva, sem convertê-la numa oposição independente entre fora e dentro.
- source_word: ⲧⲉⲡⲓⲑⲩⲙⲓⲁ ⲛⲟⲩϩⲟⲣⲁⲥⲓⲥ
  choice: o desejo de uma visão
  rationale: Lê ⲛ- com o artigo indefinido ⲟⲩ- antes de ϩⲟⲣⲁⲥⲓⲥ, e não como o empréstimo grego para «mente».
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ ⲙⲫⲏⲧ
  choice: o domínio próprio do coração
  rationale: «Domínio próprio» comunica a virtude de ἐγκράτεια em linguagem moderna e mantém «do coração» ligado ao termo correto.
- source_word: ⲡⲥⲱⲧⲙ ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ
  choice: a escuta que todos acolhem
  rationale: Traduz o substantivo verbal como «escuta» e verte a qualidade de ser recebido/aceito por todos mediante uma oração ativa idiomática.
theological_decisions:
- issue: A voz declara que a raiz da escuridão procede de seu interior.
  choice: Preservar literalmente o paradoxo.
  alternative: Explicar «escuridão» como mal moral ou suavizar a afirmação.
  rationale: O texto não identifica explicitamente escuridão com mal nem resolve a tensão; interpretá-la doutrinariamente excederia a evidência da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência poética e frases breves. «Domínio próprio» foi preferido a «temperança» por ser mais transparente. A fragmentação inicial e as tensões internas do texto foram mantidas, sem harmonização doutrinária.
