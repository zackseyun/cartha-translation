base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/101.yaml
  text: Release yourselves.[a] Or if you release yourselves from him, who will be able to seize you? For your inside is your outside,[b] and the one who fashions the outside is the one who fashions the inside.
translation:
  language: pt
  text: Libertem-se.[a] Ou, se vocês se libertarem dele, quem poderá agarrá-los? Pois o interior de vocês é o exterior de vocês,[b] e aquele que dá forma ao exterior é quem dá forma ao interior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também seria possível traduzir: “Soltem-se” ou “Deixem-se ir”.'
    reason: A expressão copta pode indicar soltar, liberar ou deixar partir; “libertem-se” expressa o sentido reflexivo no contexto.
  - marker: b
    text: 'Ou: “o que está dentro de vocês é o que está fora de vocês”.'
    reason: A alternativa torna explícito o valor espacial das expressões coptas, enquanto o texto principal preserva o paralelismo conciso entre “interior” e “exterior”.
lexical_decisions:
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: Libertem-se
  rationale: A construção usa ⲕⲁ ... ⲉⲃⲟⲗ no sentido de soltar ou deixar livre, com pronome reflexivo plural; o imperativo português comunica isso de modo direto.
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: agarrar
  rationale: O verbo expressa apoderar-se, prender ou agarrar. “Agarrar” conserva a imagem concreta e contrasta naturalmente com “libertar-se”.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ
  choice: o interior de vocês
  rationale: Aqui ⲥⲁϩⲟⲩⲛ integra a expressão espacial “o que está dentro/interior”, e não o verbo “entender”; a forma com “de vocês” preserva a referência plural.
- source_word: ⲡⲉⲧⲛⲥⲁⲃⲃⲟⲗ
  choice: o exterior de vocês
  rationale: A expressão paralela designa o lado de fora ou exterior, mantendo a oposição deliberada entre interior e exterior.
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: dá forma
  rationale: O empréstimo de πλάσσειν significa formar ou modelar. “Dá forma” é natural em português e preserva a ação criadora sem especificar matéria ou método.
theological_decisions:
- issue: Identidade paradoxal entre interior e exterior
  choice: “o interior de vocês é o exterior de vocês”
  alternative: “o que está dentro de vocês é o que está fora de vocês”
  rationale: A formulação nominal conserva a simetria e a tensão do texto sem explicar ou harmonizar a afirmação.
- issue: Referente masculino singular em “dele”
  choice: Manter “dele” sem identificar o referente
  alternative: Explicitar uma pessoa ou poder mencionado no contexto mais amplo
  rationale: O excerto contém um referente pronominal, mas não fornece aqui uma identificação segura; explicitá-lo resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e formas compreensíveis internacionalmente. Emprega “vocês” para o plural e mantém o paralelismo poético e a ambiguidade do referente pronominal.
