base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/013.yaml
  text: 'I am the midwife and the mother.[1]

    I am the virgin[2] and the woman.[1]

    I am the mother of my father[3][2], and the virgin of my—[3]'
translation:
  language: pt
  text: '**8.** Eu sou a parteira e a mãe.[a]


    Eu sou a virgem[b] e a mulher.


    Eu sou a mãe de meu pai e a virgem[b] de meu—[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Diversas edições traduzem: “Eu sou a parteira e aquela que não dá à luz”. Neste excerto, porém, o copta traz ⲧⲙⲁⲁⲩ, “a mãe”. Como o alinhamento do excerto tem confiança média, seguimos o vocábulo preservado e mantemos o paradoxo “parteira/mãe”.'
    reason: Nota de alinhamento e variante editorial.
  - marker: b
    text: O copta ⲥⲱⲛⲉ também pode ser traduzido por “donzela”. Aqui, “virgem” torna mais nítido o contraste com “mulher”.
    reason: Alternativa lexical genuína.
  - marker: c
    text: O excerto termina depois de ⲙⲡⲁ, “de meu…”. O travessão marca a lacuna; não se conjectura o termo que falta.
    reason: Texto fragmentário.
lexical_decisions:
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: a parteira
  rationale: É o termo saídico usual para a mulher que auxilia no parto e preserva o paradoxo obstétrico da passagem.
- source_word: ⲧⲙⲁⲁⲩ
  choice: a mãe
  rationale: O substantivo copta significa normalmente “mãe”; esta opção segue o léxico efetivamente presente no excerto, em vez da leitura tradicional “a que não dá à luz”.
- source_word: ⲧⲥⲱⲛⲉ
  choice: a virgem
  rationale: Pode designar “virgem” ou “donzela”; “virgem” exprime com clareza o contraste paradoxal com ⲧⲥϩⲓⲙⲉ, sem eliminar a alternativa lexical.
- source_word: ⲧⲥϩⲓⲙⲉ
  choice: a mulher
  rationale: É o sentido genérico mais natural no contexto; evita restringir o termo a “esposa”.
- source_word: ⲧⲉ … ⲁⲛⲟⲕ
  choice: Eu sou…
  rationale: A construção clivada copta apresenta uma identificação enfática; a fórmula portuguesa conserva a voz em primeira pessoa e a cadência repetitiva.
- source_word: ⲧⲙⲁⲁⲩ ⲛⲧⲉ ⲡⲁⲉⲓⲱⲧ
  choice: a mãe de meu pai
  rationale: Reproduz diretamente a construção genitiva e mantém intacto o paradoxo familiar.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁ—
  choice: a virgem de meu—
  rationale: Traduz somente o que está preservado no excerto; o travessão assinala a interrupção depois de “meu”, sem conjecturar o complemento perdido.
theological_decisions:
- issue: Identidade simbólica da voz feminina
  choice: Preservar as autoidentificações paradoxais sem explicá-las no corpo do texto
  alternative: Harmonizar os títulos como descrições de uma figura teológica específica
  rationale: O trecho não identifica de modo inequívoco a personagem nem resolve suas tensões; a tradução não deve introduzir uma interpretação doutrinária externa.
translation_notes:
  register: Português moderno, claro e solene, com repetição explícita de “Eu sou” para conservar a ênfase e a cadência do copta. Empregou-se “de meu pai”, forma natural e amplamente compreensível, e manteve-se a formulação abrupta no final para representar o estado fragmentário do testemunho.
