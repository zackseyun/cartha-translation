  language: pt
  text: '**6.** Eu sou os membros de minha mãe.[a][b]


    E eu sou a estéril — muitos são os filhos dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Membros” também pode ser traduzido por “membros do corpo” ou “partes do corpo”, tornando mais explícita a imagem anatômica.
    reason: lexical_alternative
  - marker: b
    text: A leitura da expressão possessiva “de minha mãe” é incerta neste trecho do OCR e deve ser conferida em uma transcrição crítica melhor.
    reason: alignment_note
lexical_decisions:
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: membros
  rationale: Preserva a imagem coletiva das partes do corpo e sua ressonância mais ampla; “membros do corpo” seria mais explícito, enquanto “membros” mantém a concisão poética.
- source_word: ⲛⲁϣⲉ
  choice: a estéril
  rationale: Expressa de modo direto a mulher que não pode gerar, mantendo a identificação feminina indicada pela forma copular e pelo contexto.
- source_word: ⲛⲉⲥϣⲏⲣⲉ
  choice: os filhos dela
  rationale: Traduz o plural com possuidor feminino sem restringi-lo necessariamente a descendentes masculinos; em português corrente, “filhos” pode abranger filhos e filhas.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Eu sou
  rationale: Mantém as declarações copulares repetidas em primeira pessoa e a cadência característica do discurso.
- source_word: ⲁⲩⲱ
  choice: E
  rationale: Conserva a ligação paratática e não explica nem suaviza o paradoxo.
- source_word: (expressão genitiva traduzida como “de minha mãe”)
  choice: de minha mãe
  rationale: Apresenta de forma natural a relação possessiva entendida no contexto, deixando a incerteza documental para a nota.
theological_decisions:
- issue: Paradoxo entre esterilidade e muitos filhos
  choice: 'Manter literalmente a tensão: “a estéril — muitos são os filhos dela”'
  alternative: Explicar metaforicamente como alguém antes estéril ou espiritualmente fecunda
  rationale: O texto formula uma autoidentificação paradoxal e não fornece uma resolução; explicá-la importaria uma interpretação teológica ausente da fonte.
translation_notes:
  register: Português moderno, claro e solene, com cadência poética. Conserva-se a repetição de “Eu sou” e o paradoxo sem harmonização interpretativa. Os marcadores seguem a ordem natural [a][b] no texto.
