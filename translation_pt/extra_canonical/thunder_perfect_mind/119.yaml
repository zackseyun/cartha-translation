translation:
  language: pt
  text: Um tempo em que acreditarão neles, até que recuperem a sobriedade e fujam para o seu lugar de repouso. Ali me encontrarão, viverão e não morrerão mais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O fim do trecho está corrompido no OCR. A tradução segue a leitura provável «não morrerão mais» (ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ), em vez da sequência defeituosa preservada pelo OCR. O pronome em «acreditarão neles» corresponde à leitura ⲙⲙⲟⲟⲩ, dividida entre linhas no excerto.
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
  choice: até que recobrem a sobriedade
  rationale: A forma verbal ⲛⲏⲫⲉ expressa ficar sóbrio ou despertar da embriaguez; “recobrar a sobriedade” preserva a imagem e soa natural em português.
- source_word: ⲛⲥⲉⲡⲱⲧ ⲉϩⲣⲁⲓ
  choice: e fujam para
  rationale: ⲡⲱⲧ significa primariamente correr ou fugir; neste contexto, “fujam para” conserva o movimento urgente em direção ao destino indicado.
- source_word: ⲉⲡⲟⲩⲕⲏⲛⲏⲧⲏⲣⲓⲟⲛ
  choice: para o seu lugar de repouso
  rationale: A forma parece representar um empréstimo grego relacionado a κοιμητήριον, literalmente lugar de repouso ou dormitório; a tradução evita impor o sentido posterior e mais específico de “cemitério”.
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: Ali me encontrarão
  rationale: Tradução direta e idiomática de “eles me encontrarão naquele lugar”, com “ali” retomando naturalmente o lugar mencionado.
- source_word: ⲛⲥⲉⲱⲛϩ
  choice: viverão
  rationale: ⲱⲛϩ significa viver ou estar vivo; o futuro é exigido pela construção verbal do contexto.
- source_word: ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ (reconstrução provável do OCR ⲛⲥⲉⲧⲙⲥⲱⲧ)
  choice: e não morrerão novamente
  rationale: A leitura reconstruída significa literalmente “e não morrerão de novo”; ela explica de modo plausível a forma defeituosa produzida pelo OCR e concorda com a revisão do fac-símile.
theological_decisions:
- issue: Sentido de “lugar de repouso”
  choice: Manter a expressão espacial e metafórica sem identificá-la teologicamente.
  alternative: Traduzir como “cemitério”, “morada celestial” ou “salvação”.
  rationale: O empréstimo pode designar um lugar de repouso, mas o trecho não determina por si só sua natureza física ou transcendente.
- issue: Relação entre viver e não morrer novamente
  choice: Preservar as duas afirmações coordenadas.
  alternative: Fundir em “viverão para sempre”.
  rationale: A fusão explicaria teologicamente a frase, mas eliminaria a repetição e a tensão próprias do texto.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A tradução parte do copta visível e não do texto de consulta desalinhado. Mantém a imagem de sobriedade e a ambiguidade de “lugar de repouso”, sem acrescentar uma interpretação denominacional.
