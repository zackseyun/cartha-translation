review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha corretamente a porção final claramente legível: «encontrarão-me naquele lugar», «viverão» e a reconstrução plausível «não morrerão novamente». Também reconhece adequadamente o início truncado e a provável correção de ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ. Contudo, o excerto visível inclui antes de ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ uma cláusula adicional (ⲟⲩⲉⲓϣ ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲩ, com leitura e segmentação incertas no OCR), que a elipse atual encobre por completo. É mais fiel assinalar explicitamente que o início permanece incerto, em vez de apresentar a tradução como se começasse precisamente em «até que». «Correrão» traduz ⲡⲱⲧ de modo mais direto que «fujam», sem acrescentar a noção de escapar.'
  naturalness: «Até que recuperem a sobriedade, correrão para o seu lugar de repouso» é claro, moderno e de registro apropriado. «Recuperem a sobriedade» é ligeiramente mais idiomático que «recobrem a sobriedade». A coordenação futura «encontrarão-me, viverão e não morrerão novamente» é natural e preserva a cadência do copta.
  terminology: «Lugar de repouso» é uma solução prudente para o provável empréstimo ligado a κοιμητήριον e evita impor «cemitério» ou uma identificação escatológica. «Não morrerão novamente» preserva o advérbio ⲟⲛ e não deve ser reduzido a «viverão para sempre».
  issues:
  - severity: medium
    issue: A elipse não informa que uma cláusula visível, mas textualmente incerta, foi omitida.
    rationale: O texto copta fornecido começa com material anterior a «até que recuperem a sobriedade». Como OCR e segmentação são incertos, não é seguro traduzi-lo assertivamente, mas a nota deve declarar que a elipse abrange também essa cláusula incerta.
  - severity: low
    issue: «Fujam» é mais interpretativo que o verbo copta ⲡⲱⲧ.
    rationale: O sentido nuclear é «correr»; «fugir» pode ser possível em contexto, mas introduz uma motivação de evasão não expressa.
  revised_text: '[… trecho inicial incerto …] até que recuperem a sobriedade e corram para o seu lugar de repouso. Ali me encontrarão, viverão e não morrerão novamente.[a]'
  revised_footnotes:
  - marker: a
    text: O OCR começa no meio de uma frase e inclui, antes de «até que recuperem a sobriedade», uma cláusula cuja leitura e segmentação são incertas; por isso ela é indicada por reticências. O fim do trecho também está corrompido no OCR. A tradução segue a leitura provável «não morrerão novamente» (ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ), em vez da sequência sem sentido produzida pelo OCR.
    reason: textual_and_alignment_note
  revision_rationale: A revisão conserva a leitura provável do final e a ambiguidade de «lugar de repouso», mas torna transparente a lacuna inicial efetivamente presente no excerto e usa «correr» para o valor lexical primário de ⲡⲱⲧ. Não adota o texto inglês de consulta, que está desalinhado em relação ao copta exibido.
