review_pass:
  verdict: revise
  source_fidelity: 'O rascunho traduz corretamente a porção final mais segura do excerto, incluindo «Ali me encontrarão, viverão e não morrerão mais». Contudo, omite sem necessidade o início copta legível: ⲟⲩⲉⲓϣ ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲟⲩ, «um tempo em que acreditarão neles». A divisão OCR entre ⲙⲙⲟ / ⲟⲩ deve ser reunida como ⲙⲙⲟⲟⲩ («neles»), não tratada como lacuna. A reconstrução final «não morrerão mais» é prudente e bem sustentada pelo contexto e pela provável leitura ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ.'
  naturalness: A redação é clara e natural. «Recuperem a sobriedade» e «lugar de repouso» são adequados ao registro. «Não morrerão mais» é mais idiomático em português do que «não morrerão novamente», sem perda de sentido.
  terminology: «Lugar de repouso» preserva adequadamente a ambiguidade do empréstimo ligado a κοιμητήριον e evita a especificação interpretativa de «cemitério». «Acreditarão neles» conserva o pronome plural visível no copta; não se deve substituí-lo por um referente teologicamente inferido.
  issues:
  - severity: medium
    issue: Omissão do início legível do excerto.
    rationale: O texto começa com ⲟⲩⲉⲓϣ ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲟⲩ, que pode ser traduzido de modo seguro como «Um tempo em que acreditarão neles». As reticências sugerem uma lacuna que o OCR apresentado não exige.
  - severity: low
    issue: «Novamente» é menos natural no desfecho.
    rationale: «Não morrerão mais» expressa naturalmente o copta provável «não morrerão de novo/mais» e mantém a mesma ambiguidade.
  revised_text: Um tempo em que acreditarão neles, até que recuperem a sobriedade e fujam para o seu lugar de repouso. Ali me encontrarão, viverão e não morrerão mais.[a]
  revised_footnotes:
  - marker: a
    text: O fim do trecho está corrompido no OCR. A tradução segue a leitura provável «não morrerão mais» (ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ), em vez da sequência defeituosa preservada pelo OCR. O pronome em «acreditarão neles» corresponde à leitura ⲙⲙⲟⲟⲩ, dividida entre linhas no excerto.
    reason: textual_and_alignment_note
