base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/012.yaml
  text: I am the midwife and she who does not give birth[a]. I am the comfort of my labor pains. I am the bride and the bridegroom[d][c][b]. I am the mother of my father and the sister of my husband.
translation:
  language: pt
  text: '**7.** Eu sou a parteira e aquela que não dá à luz.[a]

    Eu sou o consolo das minhas dores de parto.

    Eu sou a noiva e a mãe.[b]

    Eu sou a irmã e a mulher.[c]

    Eu sou a mãe de…[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto copta transmitido por OCR é incerto em alguns pontos, mas esta linha é mais bem entendida como um paradoxo ligado ao parto: “a parteira” e “aquela que não dá à luz”. Algumas traduções antigas seguem uma leitura nupcial.'
    reason: textual_uncertainty
  - marker: b
    text: O copta fornecido diz literalmente “a noiva e a mãe”. A leitura “a noiva e o noivo”, presente em algumas reconstruções, não é adotada aqui porque o segundo substantivo visível é “mãe”.
    reason: source_alignment
  - marker: c
    text: O último termo também pode significar “esposa”. Como nenhum complemento conjugal aparece nesta linha do excerto, foi mantido o sentido mais amplo, “mulher”.
    reason: lexical_alternative
  - marker: d
    text: O excerto termina depois de “a mãe de”, sem conservar aqui o complemento. As reticências assinalam essa interrupção material, não uma omissão estilística.
    reason: incomplete_source
lexical_decisions:
- source_word: ⲧⲙⲉⲥⲓⲱ
  choice: a parteira
  rationale: A leitura lexical mais provável no contexto do parto é “parteira”; evita a antiga interpretação nupcial, que não corresponde bem à sequência copta recebida.
- source_word: ⲙⲁⲥⲙⲓⲥⲉ
  choice: não dá à luz
  rationale: Mantém o paradoxo entre assistir ao parto e não parir, sem introduzir a ideia de marido, ausente nesta expressão.
- source_word: ⲡⲥⲟⲗⲥⲗ ⲛⲛⲁⲛⲁⲁⲕⲉ
  choice: o consolo das minhas dores de parto
  rationale: Traduz ⲥⲟⲗⲥⲗ como “consolo” e conserva a referência possessiva e corporal às dores.
- source_word: ⲧϣⲉⲗⲉⲉⲧ
  choice: a noiva
  rationale: É a equivalência direta e natural para a figura feminina nupcial.
- source_word: ⲧⲙⲁⲁⲩ
  choice: a mãe
  rationale: O texto copta fornecido traz claramente o substantivo feminino “mãe”; não o substituímos por “noivo”, embora essa leitura apareça na camada inglesa.
- source_word: ⲧⲥⲱⲛⲉ
  choice: a irmã
  rationale: Equivalente direto do substantivo copta feminino.
- source_word: ⲧⲥϩⲓⲙⲉ
  choice: a mulher
  rationale: O termo pode significar “mulher” ou “esposa”; escolhe-se o sentido mais amplo porque o excerto não explicita uma relação conjugal.
- source_word: ⲁⲛⲟⲕ
  choice: eu sou
  rationale: A repetição da fórmula de autoidentificação é central à cadência poética e aos paradoxos do discurso.
theological_decisions:
- issue: Série de identidades femininas paradoxais
  choice: Preservar literalmente “parteira”, “aquela que não dá à luz”, “noiva”, “mãe”, “irmã” e “mulher”
  alternative: Harmonizar a sequência segundo reconstruções tradicionais, como “noiva e noivo” ou “irmã de meu marido”
  rationale: O excerto copta apresentado sustenta as identidades femininas aqui traduzidas, mas não contém de modo visível todos os complementos da reconstrução tradicional. A tradução não resolve nem sistematiza a tensão teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com frases curtas que preservam a repetição litânica de “Eu sou”. A tradução segue prioritariamente o copta visível, tratando a camada inglesa e as reconstruções tradicionais apenas como testemunhos de consulta.
