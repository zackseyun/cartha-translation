review_pass:
  verdict: revise
  source_fidelity: A tradução acerta as duas primeiras declarações, mas as três últimas resultam de uma segmentação literal de um excerto OCR evidentemente truncado/desalinhado. Essa segmentação produz «a noiva e a mãe», «a irmã e a mulher» e «a mãe de…», sequência que não preserva a sintaxe nem a sequência atestada deste trecho. A reconstrução refletida no registro de auditoria — noiva e noivo; mãe de meu pai; irmã de meu marido — é a leitura coerente e deve substituir o texto interrompido.
  naturalness: «Eu sou» e «aquela que não dá à luz» são naturais e mantêm a cadência litânica. A versão revista preserva essa cadência e elimina a reticência editorial no corpo do texto.
  terminology: «Parteira», «dores de parto», «noiva», «noivo», «mãe», «pai», «irmã» e «marido» são equivalentes modernos, precisos e sem carga doutrinária acrescentada. «Consolo» mantém a ambiguidade do substantivo copta melhor que uma explicação interpretativa.
  issues:
  - severity: high
    issue: As linhas finais foram traduzidas como se as quebras e omissões do OCR constituíssem cláusulas completas.
    rationale: O resultado «a noiva e a mãe ... a irmã e a mulher ... a mãe de…» é textual e sintaticamente defeituoso. A sequência contextualizada e registrada na auditoria é «a noiva e o noivo», «a mãe de meu pai» e «a irmã de meu marido».
  - severity: high
    issue: As notas b–d afirmam que «mãe», «mulher» e uma frase incompleta são a leitura a manter.
    rationale: Essas notas transformam a fragmentação material do OCR em decisão tradutória e contradizem a reconstrução contextual atestada para a passagem.
  - severity: medium
    issue: A nota a caracteriza leituras nupciais como apenas traduções antigas, sem distinguir a incerteza do OCR da reconstrução textual contextual.
    rationale: A nota deve informar com precisão que o trecho apresenta ruído/segmentação no OCR, enquanto a tradução segue a sequência contextual corroborada, sem apresentar uma alternativa como se fosse mera tradição interpretativa.
  revised_text: '**7.** Eu sou a parteira e aquela que não dá à luz.[a]


    Eu sou o consolo das minhas dores de parto.


    Eu sou a noiva e o noivo.[b]


    Eu sou a mãe de meu pai e a irmã de meu marido.[c]'
  revised_footnotes:
  - marker: a
    text: O excerto copta obtido por OCR apresenta ruído em alguns pontos. A leitura «parteira» e «aquela que não dá à luz» corresponde à sequência contextual desta declaração paradoxal.
    reason: textual_uncertainty
  - marker: b
    text: O OCR fornecido segmenta de modo irregular os substantivos desta parte. A sequência reconstruída e contextualizada é «a noiva e o noivo», não «a noiva e a mãe».
    reason: source_alignment
  - marker: c
    text: 'O final do excerto OCR está truncado e desalinhado. A tradução segue a continuação contextual da passagem: «a mãe de meu pai e a irmã de meu marido».'
    reason: incomplete_source
  revision_rationale: 'A revisão conserva as duas primeiras linhas corretamente identificadas no copta e corrige as linhas finais, que a versão apresentada derivava de uma leitura mecânica de um OCR fragmentado. A nova redação restitui a série paralela de autoidentificações sem completar o texto por doutrina ou interpretação: segue a reconstrução contextual explicitamente registrada na trilha de auditoria. As notas foram reduzidas a esclarecimentos sobre o estado do OCR e os seus pontos de ancoragem correspondem ao texto revisto.'
