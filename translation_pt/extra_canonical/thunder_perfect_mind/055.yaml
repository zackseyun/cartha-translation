lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲁⲓ (restaurado pelo contexto textual)
  choice: Eu sou aquela
  rationale: Preserva a fórmula recorrente de autoidentificação e a identidade feminina da voz, sem neutralizá-la como “aquele que” ou “a pessoa”.
- source_word: ϩⲱⲱⲧ / expressão de presença diante de alguém
  choice: diante de cujo rosto
  rationale: Mantém a imagem concreta de “rosto” e a ideia idiomática de estar na presença de alguém.
- source_word: ⲁⲩⲉⲓ … ⲃⲟⲗ (segmentação incerta)
  choice: vocês se envergonharam
  rationale: O paralelismo antitético com “sem vergonha” favorece a leitura ligada à vergonha, embora o OCR e a segmentação do trecho sejam incertos.
- source_word: ⲙⲛⲧⲁⲧ…
  choice: ficaram sem vergonha
  rationale: Conserva a forma nominal e a oposição verbalmente incisiva entre ter vergonha e estar sem vergonha; “agiram descaradamente” seria mais interpretativo.
- source_word: ⲙⲙⲟⲉⲓ
  choice: diante de mim
  rationale: Exprime a orientação relacional à falante de modo natural em português; “para comigo” também seria possível.
theological_decisions:
- issue: Gênero da falante
  choice: aquela
  alternative: a pessoa / aquela que
  rationale: A voz feminina é relevante para a identidade literária da falante e deve permanecer explícita, sem impor interpretação doutrinária adicional.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural. A construção deliberadamente paralela conserva a tensão entre vergonha e falta de vergonha. A tradução leva em conta a baixa nitidez morfológica do excerto OCR e o contexto antitético do discurso.
