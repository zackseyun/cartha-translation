translation:
  language: pt
  text: '**10.** Eu sou aquela diante de quem vocês se envergonharam[a], e agiram sem vergonha diante de mim[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “diante de cuja face”; também: “em cuja presença”.'
