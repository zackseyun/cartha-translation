  verdict: revise
  source_fidelity: A autoidentificação feminina («Eu sou aquela») preserva adequadamente a forma feminina que é decisiva neste discurso. A oposição entre envergonhar-se e agir/estar sem vergonha também é mantida. Contudo, «diante de cujo rosto» é um decalque pouco idiomático em português; a construção normal «diante de quem» transmite a locução de presença sem perda material de sentido, e a imagem lexical de «rosto/face» pode permanecer assinalada em nota.
  naturalness: «Diante de cujo rosto» soa artificial no português moderno, e «ficaram sem vergonha» pode sugerir uma mudança de estado que não é necessária no enunciado. «Agiram sem vergonha diante de mim» é claro, natural e conserva o valor adverbial da segunda expressão.
  terminology: «Aquela» mantém explicitamente o gênero feminino da falante. «Vergonha» e «sem vergonha» preservam a antítese do texto, sem introduzir leitura teológica ou moralizante além do original.
