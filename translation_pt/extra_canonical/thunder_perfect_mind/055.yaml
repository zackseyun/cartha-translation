  - severity: low
    issue: «Ficaram sem vergonha»
    rationale: A forma pode sugerir que os interlocutores passaram a um estado de ausência de vergonha. O paralelismo pode ser expresso com maior fluência por «agiram sem vergonha», sem alterar o contraste ou imputar um sentido adicional.
