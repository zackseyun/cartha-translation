  text: You hear me in your calling of me[a], in a [...] that you utter. You did not hear[e][d][c][b]. I am the defense.
translation:
  language: pt
  text: '**10.** Vocês me ouvem em seus chamados a mim,[a] em um [...] que vocês proferem. Vocês não ouviram.[b] Eu sou minha defesa.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta é uma construção nominalizada, aproximadamente «em seus chamados a mim». ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ pode significar «chamar-me», «chamar por mim» ou «invocar-me».
    reason: lexical_alternative
  - marker: b
    text: 'O copta traz uma afirmação no passado: «Vocês não ouviram», não a condição «se vocês não ouviram».'
    reason: alignment_note
  - marker: c
    text: '«Minha defesa» traduz ⲧⲁⲡⲟⲗⲟⲅⲓⲁ: ⲧⲁ significa «minha», e ⲁⲡⲟⲗⲟⲅⲓⲁ é empréstimo do grego ἀπολογία. O termo também pode significar «resposta» ou «alegação em defesa».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: Vocês me ouvem
  rationale: A forma é Presente I, não imperativo. “Ouvem” conserva o alcance de ⲥⲱⲧⲙ sem impor a ideia mais volitiva de “escutam”.
- source_word: ⲛⲉⲧⲛ ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: ao me chamarem
  rationale: O trecho representa provavelmente uma construção nominalizada, “seu ato de me chamar”. A formulação portuguesa preserva a relação circunstancial sem decidir entre chamar, chamar por ou invocar.
- source_word: ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: que vocês proferem
  rationale: Trata-se de oração relativa ligada ao elemento lacunar anterior. “Proferem” traduz naturalmente a ação de fazer sair ou enunciar palavras.
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: Vocês não ouviram
  rationale: A construção é um perfeito negativo, e não uma condição. O pretérito perfeito português reproduz essa afirmação passada.
- source_word: ⲁⲛⲟⲕ ⲡ[ⲉ] ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: Eu sou a defesa
  rationale: Preserva a fórmula identificadora “Eu sou” e traduz o empréstimo grego ἀπολογία por seu sentido forense mais direto e inteligível.
theological_decisions:
- issue: Identidade da voz com ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: Eu sou a defesa
  alternative: Eu sou a resposta / Eu sou a apologia
  rationale: “Defesa” mantém a possível nuance forense sem transformar a voz em conceito denominacional. “Resposta” é possível, mas menos específica; “apologia” seria opaca para muitos leitores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural. A lacuna material é mantida explicitamente, sem conjectura. A repetição de “ouvem/ouviram” preserva a tensão e a cadência do copta.
