base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/114.yaml
  text: '… with those who were sent[a];

    I am the one cast out;

    among the dead — but I am the one who exists alone[g][f][e][d][c][b], and the everlasting.'
translation:
  language: pt
  text: '**5.** … com os que foram enviados[a];


    Eu sou aquela que foi expulsa[b];


    entre os mortos[c] — mas eu sou aquela que existe sozinha[d], e a eterna[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início está incompleto. A expressão copta significa literalmente “com os que eles enviaram”, podendo também ser entendida como “com os que foram enviados”.
    reason: textual_and_grammatical_note
  - marker: b
    text: Ou “afastada à força” ou “lançada para fora”.
    reason: lexical_alternative
  - marker: c
    text: O copta indica os que estão mortos; por isso, “os mortos”, e não “os que morrem”.
    reason: grammar_note
  - marker: d
    text: “Sozinha” também pode ter o sentido de “única”, mas o texto não esclarece qual nuance predomina.
    reason: lexical_ambiguity
  - marker: e
    text: O manuscrito fornecido termina no meio da forma ⲙⲛⲧⲁⲓ(ⲱⲛ), provavelmente relacionada a “eternidade”. Por isso, “a eterna” permanece uma reconstrução provável; outra possibilidade é “a perene”.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛ̄ ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: com os que foram enviados
  rationale: ⲙⲛ̄ tem sentido comitativo, e ⲧⲛ̄ⲛⲟⲟⲩ é o verbo “enviar”. A formulação portuguesa conserva a leitura passiva natural, enquanto a nota registra a construção literalmente ativa.
- source_word: ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: expulsa
  rationale: A locução expressa ser lançado, afastado ou expulso. “Expulsa” é direta, digna e preserva a força do enunciado.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: entre os mortos
  rationale: ⲙⲟⲟⲩⲧ é forma estativa, “estar morto”, e não o processo “morrer”; diante de um grupo de pessoas, ϩⲛ é naturalmente vertido por “entre”.
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: aquela que existe
  rationale: ϣⲟⲟⲡ pode indicar ser, existir ou estar presente. “Existe” mantém a força existencial sem ampliar o sentido.
- source_word: ⲟⲩⲁⲁⲧ
  choice: sozinha
  rationale: O termo denota estar só ou ser único. “Sozinha” preserva o contraste abrupto com a presença entre os mortos.
- source_word: ⲙⲛⲧⲁⲓ(ⲱⲛ)
  choice: a eterna
  rationale: O trecho parece interromper a palavra que provavelmente continua como ⲙⲛⲧⲁⲓⲱⲛ, relacionada a eternidade ou duração perene. “A eterna” conserva a força nominal e o paralelismo.
theological_decisions:
- issue: Paradoxo entre estar entre os mortos e existir sozinha e eternamente
  choice: Manter o paradoxo sem harmonização
  alternative: Explicar “sozinha” como independência ontológica ou transformar “entre os mortos” em mera metáfora
  rationale: O texto justapõe deliberadamente afirmações tensas sobre a voz que fala. A tradução não define uma doutrina nem elimina essa tensão.
- issue: Gênero da voz que fala
  choice: 'Usar formas femininas: “aquela”, “expulsa”, “sozinha”, “a eterna”'
  alternative: Empregar construções sem marca de gênero ou formas masculinas
  rationale: A obra apresenta a voz discursiva como feminina; o português exige concordância em vários pontos. A escolha mantém a identidade literária da voz sem acrescentar uma identificação teológica específica.
translation_notes:
  register: Português moderno, claro e solene, com cadência oracular. Mantiveram-se as linhas breves e a tensão paradoxal. O feminino acompanha a voz literária da obra, e as incertezas do fragmento e da forma final foram explicitadas em notas.
