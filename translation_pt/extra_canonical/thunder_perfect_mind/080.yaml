translation:
  language: pt
  text: 'Eu sou a paz,

    e a guerra veio por minha causa[a];

    e sou estrangeira[b] e cidadã.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a guerra surgiu por minha causa”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “forasteira”. “Estrangeira” ressalta o contraste cívico com “cidadã”. O trecho de OCR fornecido parece estar desalinhado: contém outros empréstimos gregos — “castigo”, “naturezas”, “criação” e “almas” — que não correspondem a estas linhas.'
    reason: lexical_and_alignment_note
lexical_decisions:
- source_word: ϩⲓⲣⲏⲛⲏ (empréstimo do grego εἰρήνη)
  choice: paz
  rationale: Mantém o sentido direto e a oposição paradoxal máxima com “guerra”.
- source_word: ⲡⲟⲗⲉⲙⲟⲥ (empréstimo do grego πόλεμος)
  choice: guerra
  rationale: Preserva a antítese forte com “paz”; “conflito” enfraqueceria o paradoxo.
- source_word: ⲉⲧⲃⲉ ⲁⲛⲟⲕ
  choice: por minha causa
  rationale: Expressa de modo natural a causalidade sem sugerir finalidade ou benefício, como poderia ocorrer com “por mim”.
- source_word: ⲝⲉⲛⲟⲥ (empréstimo do grego ξένος)
  choice: estrangeira
  rationale: Forma a oposição cívica mais nítida com “cidadã”, embora “forasteira” também seja possível.
- source_word: ⲡⲟⲗⲓⲧⲏⲥ (empréstimo do grego πολίτης)
  choice: cidadã
  rationale: É o termo cívico corrente e mantém o contraste preciso com “estrangeira”.
- source_word: ⲉⲓ (perfeito/aoristo de “vir”)
  choice: veio
  rationale: O pretérito perfeito é natural em português e conserva o evento consumado; “surgiu” também é possível.
