    issue: Relação sintática de «modelo» com «dentro de vocês»
    rationale: A redação «um modelo do que está dentro de vocês» acrescenta uma relação genitiva/explicativa que não está expressa. O texto disponível lê «fez dele um modelo dentro de vocês».
  - severity: low
    issue: Vocativo excessivamente marcado por «ó»
    rationale: O vocativo pode ser expresso naturalmente por «ouvintes», sem perda do tom solene ou do sentido de ⲁⲕⲣⲟⲁⲧⲏⲥ.
