base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/104.yaml
  text: '...you[a], he made him a pattern within you. And what you see outside you, you see me within you. It is visible, and it is your garment. Listen to me[d][c][b], you hearers.'
translation:
  language: pt
  text: '... de vocês[a], ele fez dele um modelo do que está dentro de vocês. E aquilo que vocês veem fora de vocês, vocês veem a mim dentro de vocês.[b] Isso está manifesto e é a veste de vocês.[c] Escutem-me, ó ouvintes.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho começa no meio de uma frase; o antecedente de “dele” não foi preservado nesta unidade.
    reason: textual_fragment
  - marker: b
    text: O copta contrapõe aquilo que está “fora” ao que está “dentro” dos ouvintes. Uma leitura anterior como chamado aos que estão “perto” e “longe” não corresponde bem à sintaxe deste trecho.
    reason: lexical_alternative
  - marker: c
    text: A leitura “é a veste de vocês” pressupõe a correção de uma sequência provavelmente corrompida pelo OCR para ⲧⲉⲧⲛϩⲃⲥⲱ ⲧⲉ. Sem conferir diretamente o manuscrito, a forma transmitida pelo OCR permanece incerta.
    reason: ocr_emendation
  - marker: d
    text: O bloco associado ao título “Eu sou a justiça” não contém, no excerto copta fornecido, essa declaração. É possível que o mapeamento do segmento esteja deslocado.
    reason: alignment_note
lexical_decisions:
- source_word: ⲣⲧⲩⲡⲟⲥ
  choice: fez dele um modelo
  rationale: O empréstimo grego τύπος indica modelo, padrão ou figura. “Modelo” conserva a ideia sem impor uma interpretação teológica específica; “dele” mantém o referente pronominal masculino, embora o antecedente esteja fora do trecho preservado.
- source_word: ⲥⲁϩⲟⲩⲛ
  choice: dentro
  rationale: Neste contexto, a expressão indica o interior e forma contraste espacial com ⲥⲁⲛⲃⲟⲗ, “fora”; não foi tomada como verbo de aproximação.
- source_word: ⲥⲁⲛⲃⲟⲗ
  choice: fora
  rationale: A leitura espacial “fora” preserva o paralelismo entre exterior e interior e corresponde melhor à sintaxe de “aquilo que vocês veem”.
- source_word: ⲛⲁⲩ ⲉⲣⲟϥ / ⲛⲁⲩ ⲉⲣⲟⲓ
  choice: veem aquilo / veem a mim
  rationale: As formas são indicativas com sujeito plural, não imperativos. A repetição de “veem” mantém o paralelismo retórico do copta.
- source_word: ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: está manifesto
  rationale: A construção expressa manifestação ou visibilidade. “Está manifesto” conserva a linguagem solene e evita confundi-la com ⲱⲛϩ, “viver”.
- source_word: ⲥⲱⲧⲙ
  choice: escutem
  rationale: O imperativo plural introduz uma convocação direta; “escutem” é natural em português atual e se liga ao vocativo seguinte.
- source_word: ⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: ouvintes
  rationale: O empréstimo grego ἀκροατής significa “ouvinte”. A forma portuguesa preserva a relação sonora e semântica com “escutem”.
theological_decisions:
- issue: Referente do modelo e da manifestação
  choice: Manter os pronomes sem identificar seus referentes
  alternative: Explicitar que o modelo, a figura interior ou a própria voz feminina é o referente
  rationale: O início está truncado e a sintaxe não permite identificar os referentes com segurança. Explicitá-los resolveria uma ambiguidade que o testemunho preservado não resolve.
- issue: Relação entre o exterior, o interior e a voz que fala
  choice: Traduzir literalmente o paradoxo “veem a mim dentro de vocês”
  alternative: Parafrasear como autoconhecimento, presença divina interior ou imagem espiritual
  rationale: O texto sustenta uma tensão deliberada entre o que se vê fora e a presença da locutora dentro dos ouvintes; nenhuma interpretação doutrinária foi acrescentada.
translation_notes:
  register: Português contemporâneo, claro e digno, com “vocês” para a segunda pessoa plural. O paralelismo interior/exterior e a repetição de “veem” foram preservados. O vocativo “ó ouvintes” mantém o tom poético e proclamativo sem arcaísmo excessivo.
