  verdict: revise
  source_fidelity: 'A oposição espacial entre «dentro de vocês» (ⲙⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ) e «fora de vocês» (ⲙⲡⲉⲧⲛⲥⲁⲛⲃⲟⲗ), bem como a repetição de «veem», está bem captada. Contudo, «fez dele um modelo do que está dentro de vocês» altera a construção: o copta situa o modelo dentro dos ouvintes, não o apresenta como modelo “do que” está dentro deles. A cláusula sobre a veste depende de emenda ao OCR e deve permanecer assinalada como tal.'
  naturalness: O português é claro e de registro adequado. «Escutem-me, ouvintes» é direto e preserva a força vocativa sem o «ó», que é dispensável. «Isso é visível» soa mais idiomático e corresponde de perto à afirmação de visibilidade/manifestaçao.
  terminology: «Modelo» é uma boa solução para o empréstimo τύπος; «dentro», «fora», «visível», «veste» e «ouvintes» preservam o paralelismo e não introduzem leitura teológica. Mantém-se «dele», pois o antecedente não está no excerto.
  issues:
