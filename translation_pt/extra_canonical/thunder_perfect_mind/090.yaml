base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/090.yaml
  text: 'Give heed to me in gentleness.[a]

    I am the one who remains upon the face of the earth,[b]

    and I am the one who is cast off the face of the earth.[c]

    I am the preparation of every person.[d][e][f][g]'
translation:
  language: pt
  text: '**6.** Ouçam-me com mansidão.[a]


    Eu sou aquela que permanece sobre a face da terra,[b]


    e sou aquela que é lançada para fora da face da terra.[c]


    Eu sou a preparação de toda pessoa.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Recebam instrução de mim, com brandura”. A expressão copta combina “receber/tomar” com “instrução”, mas também funciona como um chamado a dar atenção.'
    reason: lexical_alternative
  - marker: b
    text: 'A tradução segue a leitura estabelecida: “aquela que permanece”. O excerto fornecido por OCR apresenta formas corrompidas que poderiam sugerir, indevidamente, “a firme” ou “aquela que habita”.'
    reason: textual_emendation
  - marker: c
    text: 'Ou: “que é expulsa da face da terra”. O verbo significa lançar ou atirar; aqui, a construção pode ser expressa em português com valor passivo.'
    reason: lexical_alternative
  - marker: d
    text: 'Também se pode traduzir “o preparo de toda pessoa”. A relação entre “preparação” e “toda pessoa” permanece aberta: o texto não diz explicitamente quem prepara quem, nem para quê.'
    reason: ambiguity
lexical_decisions:
- source_word: ⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: Ouçam-me
  rationale: A construção imperativa plural com ϫⲓ e ⲥⲃⲱ pede que os ouvintes recebam instrução ou deem atenção à voz. “Ouçam-me” expressa isso em português atual, com clareza e sem impor um registro escolar.
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ
  choice: com mansidão
  rationale: ⲙⲏϣⲉ indica mansidão ou brandura. “Com mansidão” conserva o valor moral e a solenidade da expressão.
- source_word: ⲧⲉⲧϭⲱ ⲉⲃⲟⲗ (leitura corrigida do trecho OCR ⲧⲁϣϭⲏⲗ ⲉⲕⲟⲗ)
  choice: aquela que permanece
  rationale: A leitura corrigida contém ϭⲱ ⲉⲃⲟⲗ, “permanecer, continuar”. O feminino “aquela” acompanha a forma copta e a voz feminina do poema.
- source_word: ϩⲓϫⲙ ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: sobre a face da terra
  rationale: Mantém a imagem corporal e poética de ⲡϩⲟ, “face/superfície”, em vez de reduzi-la ao sentido prosaico de “na terra”.
- source_word: ⲉⲧⲛⲟⲩϫⲉ ⲙⲙⲟⲥ ⲉⲃⲟⲗ
  choice: que é lançada para fora
  rationale: Nesse contexto, ⲛⲟⲩϫⲉ tem o sentido de lançar ou expulsar, e a construção refere a ação à própria locutora. A formulação passiva preserva o contraste com “permanece”.
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: a preparação
  rationale: ⲥⲟⲃⲧⲉ significa preparação ou preparo. O substantivo abstrato preserva a formulação enigmática e não a interpreta como medo.
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: de toda pessoa
  rationale: ⲣⲱⲙⲉ designa o ser humano, e ⲛⲓⲙ tem força distributiva, “cada/toda”. A tradução é inclusiva e mantém a construção genitiva aberta.
theological_decisions:
- issue: Paradoxo entre permanecer na terra e ser lançada para fora dela
  choice: Manter as duas afirmações em paralelo, sem harmonizá-las
  alternative: Interpretar uma afirmação como estabilidade espiritual e a outra como rejeição social
  rationale: O poema constrói sua teologia por meio de predicações opostas. Explicitar referentes ou esferas diferentes eliminaria uma tensão genuína do texto.
- issue: Sentido de “a preparação de toda pessoa”
  choice: Conservar a expressão nominal e o genitivo ambíguo
  alternative: Explicitar como “aquela que prepara todas as pessoas” ou “aquilo para que toda pessoa se prepara”
  rationale: A sintaxe não determina com segurança se a locutora prepara cada pessoa, constitui sua preparação ou é o objeto para o qual ela se prepara.
translation_notes:
  register: Português moderno, solene e acessível, com imperativo plural brasileiro legível (“Ouçam”) e imagens poéticas preservadas. O feminino da voz foi mantido em “aquela”. Evitaram-se tanto arcaísmos como explicações doutrinárias inseridas no corpo do texto.
