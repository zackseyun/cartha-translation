translation:
  language: pt
  text: '**5.** ... por fora, e vocês me conheceram por dentro.[a] Eu sou aquela diante de quem vocês sentiram vergonha, e vocês agiram sem vergonha. Eu sou aquela que não celebra festa, e sou aquela cujas festas são muitas.[b] Eu, eu sou sem Deus, e sou aquela cujo Deus é grande.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O recorte começa no meio de uma frase, e suas primeiras letras estão truncadas ou corrompidas no OCR. Por isso, a tradução conserva as reticências; a oposição «por fora / por dentro» é legível, mas o começo da oração anterior não pode ser recuperado com segurança deste recorte.
    reason: textual_uncertainty
  - marker: b
    text: 'O OCR desta linha está especialmente corrompido. A tradução segue a leitura contextual atestada da antítese: «aquela que não celebra festa» e «aquela cujas festas são muitas».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲁⲧⲉⲧⲛⲥⲟⲟⲩⲛ ϩⲧⲉϩⲟⲩⲛ
  choice: vocês me conheceram por dentro
  rationale: O perfeito de ⲥⲟⲟⲩⲛ indica que os destinatários conheceram; ϩⲧⲉϩⲟⲩⲛ expressa interioridade. O objeto “me” é exigido pelo sentido e é atestado no texto contínuo, embora pareça ter sido omitido ou corrompido neste recorte de OCR.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Eu sou aquela
  rationale: Preserva a fórmula feminina de autoidentificação que estrutura o poema, com português natural e solene.
- source_word: ⲁⲧⲉⲧⲛϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: diante de quem vocês sentiram vergonha
  rationale: A construção indica vergonha em relação à voz feminina; “diante de quem” comunica essa relação sem transformar a afirmação em mera descrição psicológica.
- source_word: ⲁⲧⲉⲧⲛⲣⲁⲧϣⲓ
  choice: agiram sem vergonha
  rationale: Mantém o contraste com “sentiram vergonha” e traduz o valor privativo de falta de vergonha de modo idiomático.
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: sem Deus
  rationale: O composto privativo ⲁⲧ- + ⲛⲟⲩⲧⲉ significa literalmente “sem deus/Deus” ou “ímpia”. “Sem Deus” preserva o paradoxo direto com a oração seguinte e evita acrescentar uma avaliação moral não explícita.
- source_word: ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ
  choice: aquela cujo Deus é grande
  rationale: A leitura contextual e a divisão lexical favorecem uma oração relativa possessiva, “cujo Deus é grande”, em antítese com “sem Deus”; não há no recorte base segura para “virgem”.
theological_decisions:
- issue: Capitalização de ⲛⲟⲩⲧⲉ
  choice: Deus
  alternative: deus
  rationale: A antítese pessoal “sem Deus / cujo Deus é grande” é mais legível em português com maiúscula. A escrita copta não decide a capitalização; portanto, isto é uma convenção editorial, não uma identificação dogmática da divindade.
- issue: Paradoxo entre ausência de Deus e posse de um Deus grande
  choice: Preservar literalmente as duas afirmações
  alternative: Harmonizá-las como impiedade seguida de devoção
  rationale: O poema constrói deliberadamente identidades contraditórias. Explicar ou conciliar o contraste no corpo do texto eliminaria sua tensão teológica e retórica.
- issue: Linha das festas em OCR incerto
  choice: 'Traduzir segundo a leitura contextual atestada: “não celebra festa / cujas festas são muitas”'
  alternative: Omitir a linha ou seguir a leitura inglesa “virgem”
  rationale: A sequência do OCR está degradada, mas comporta a conhecida antítese sobre festas; “virgem” não corresponde de forma convincente aos sinais visíveis nem ao paralelismo da passagem.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” para a segunda pessoa plural, mantém a cadência anafórica de “Eu sou” e preserva os paradoxos sem explicá-los no corpo do texto. “Agiram sem vergonha” evita o possível sentido contemporâneo de nudez associado a “ficaram despidos de vergonha” e conserva o contraste moral-retórico.
