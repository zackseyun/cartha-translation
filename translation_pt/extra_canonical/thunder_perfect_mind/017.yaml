base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/017.yaml
  text: I am the servant of the one who prepared me[a]. I am the ruler of my offspring[d][c][b]. But he is the one who begot me before the day of my birth.
translation:
  language: pt
  text: '**12.** Eu sou a serva daquele que me preparou. Eu sou a senhora da minha descendência. Mas foi ele quem me gerou[a] antes do dia do meu nascimento.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Me gerou” traduz uma restauração do manuscrito, que apresenta uma lacuna nesse ponto; o contexto sustenta o sentido de gerar ou dar à luz.
    reason: textual_restoration
lexical_decisions:
- source_word: ⲧϩⲙϩⲁⲗ
  choice: serva
  rationale: O substantivo, acompanhado do artigo feminino, designa alguém em condição de serviço. “Serva” mantém o gênero da voz que fala sem especificar além do texto uma condição jurídica de escravidão.
- source_word: ⲡⲉⲛⲧⲁϥⲥⲃⲧⲱⲧ
  choice: daquele que me preparou
  rationale: A forma relativa identifica aquele que realizou a preparação; “preparou” reproduz diretamente o sentido de ⲥⲃⲧⲱⲧ e evita a leitura incorreta “comandou”, proveniente do trecho de OCR desalinhado.
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: senhora
  rationale: O título feminino significa “senhora” ou “governante” e expressa autoridade. “Senhora” conserva a forma feminina e a relação nominal com a descendência.
- source_word: ⲙⲛⲧϣⲏⲣⲉ
  choice: descendência
  rationale: A formação com ⲙⲛⲧ- e ϣⲏⲣⲉ tem valor abstrato ou coletivo. “Descendência” comunica naturalmente esse conjunto em português e preserva o paradoxo de parentesco.
- source_word: '[ϫⲡⲟⲉⲓ]'
  choice: me gerou
  rationale: A restauração contextual indica geração ou nascimento. “Me gerou” mantém o paradoxo de a senhora da própria descendência ter sido gerada por aquele que a preparou.
- source_word: ϩⲁⲧⲉϩⲏ ⲙⲡⲉϩⲟⲟⲩ ⲙⲡⲁϫⲡⲟ
  choice: antes do dia do meu nascimento
  rationale: A expressão temporal é traduzida de modo direto e conserva a formulação paradoxal do original.
theological_decisions:
- issue: Identidade daquele que preparou e gerou a voz feminina
  choice: Manter o referente apenas como “ele/aquele”, sem identificá-lo teologicamente
  alternative: Identificá-lo como uma figura divina, criador, pai ou descendente específico
  rationale: O trecho não nomeia o referente. A tradução preserva essa indeterminação e a tensão entre autoridade, descendência e geração.
translation_notes:
  register: Português atual, digno e acessível, com concordância feminina explícita para a voz do poema. “Senhora da minha descendência” preserva o título de autoridade sem recorrer a terminologia confessional. O texto-base adotado é o trecho corrigido de NHC VI,2 14.4–8 citado na revisão mais recente, pois o excerto de OCR fornecido está desalinhado e pertence a linhas posteriores.
