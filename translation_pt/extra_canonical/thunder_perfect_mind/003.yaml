base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/003.yaml
  text: 'And you hearers, listen to me.

    You who wait for me, take me to yourselves,

    and do not cast me from your sight,

    and do not let your voice hate me, nor your hearing.'
translation:
  language: pt
  text: '**3.** E vocês que ouvem, escutem-me.


    Vocês que esperam por mim[a], acolham-me entre vocês.


    Não me lancem para fora da vista de vocês[b]


    e não deixem que a voz de vocês me odeie, nem a audição de vocês.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo copta pode significar «esperar por», «aguardar com expectativa» e também «ansiar por».
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «não me lancem para fora de sua face». O texto manuscrito sustenta esta leitura; o trecho de OCR fornecido está corrompido neste ponto e parece trazer, por engano, palavras correspondentes a «correr de mim».
    reason: source_text_correction
  - marker: c
    text: A formulação personifica a voz e a audição. A última expressão é sintaticamente difícil e pode refletir um trecho danificado; foi preservada sem completar o sentido por conjectura.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ / ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: vocês que ouvem / escutem-me
  rationale: O particípio nominal plural designa os destinatários como ouvintes, e o imperativo pede atenção ativa. A combinação mantém a repetição do radical sem recorrer ao pouco natural «ouvintes, ouvi-me».
- source_word: ⲧⲟϣⲧ
  choice: esperam por
  rationale: O verbo pode indicar esperar, aguardar com expectativa ou desejar. «Esperam por» conserva o sentido antecipatório sem excluir a nuance de anseio.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: acolham-me entre vocês
  rationale: A expressão pede que os destinatários recebam a falante para junto de si. «Acolham-me entre vocês» é natural em português e preserva a dimensão relacional.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  choice: não me lancem para longe de sua presença
  rationale: A leitura manuscrita significa literalmente não lançar a falante para fora da face dos destinatários. «Presença» comunica o valor idiomático de «face/vista», enquanto «lancem» retém a força do verbo.
- source_word: ⲙⲡⲣⲧⲣⲉⲡⲉⲧⲛϩⲣⲟⲟⲩ ⲙⲥⲧⲱⲉⲓ
  choice: não deixem que sua voz me odeie
  rationale: A construção causativa negativa e a personificação da voz são mantidas, embora incomuns, para não suavizar a formulação paradoxal do texto.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: sua audição
  rationale: «Audição» mantém o paralelismo abstrato com «voz» e evita acrescentar um verbo ou uma explicação ausentes na sequência transmitida.
theological_decisions:
- issue: Personificação da voz e da audição
  choice: 'Manter a linguagem paradoxal: «sua voz me odeie, nem sua audição»'
  alternative: Explicitar como «não falem de mim com ódio nem deixem de me ouvir»
  rationale: A alternativa explicativa resolveria uma tensão deliberada e acrescentaria relações semânticas não expressas com clareza no texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais («vocês», «escutem-me»). A cadência em linhas curtas conserva o caráter de proclamação. As imagens incomuns e a dificuldade da cláusula final foram mantidas em vez de normalizadas.
