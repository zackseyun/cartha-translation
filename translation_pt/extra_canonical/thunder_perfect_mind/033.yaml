  to: '**11.** Venham a mim, vocês que saem dentre os que são honrados;


    e nos lugares mais baixos vocês me encontrarão.


    E não me lancem fora entre os que são carentes, na inutilidade[a];


    pois eu — eu sou compassiva[b].'
  rationale: A revisão corrige a inversão de pessoa e de ação na abertura, preserva a direção “a mim” e entende a forma de movimento como dirigida aos ouvintes. Também substitui uma interpretação sintática excessivamente definida por uma formulação que mantém a dificuldade do copta, e emprega “mais baixos” para conservar a amplitude espacial e social do original.
