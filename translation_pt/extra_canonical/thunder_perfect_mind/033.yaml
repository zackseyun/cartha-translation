base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/033.yaml
  text: 'Look at me as I come forth among those who are honored[1];

    and in the least places you will find me.

    And do not cast me out among those who are destitute in worthlessness[d][c][b][a][5][4][3][2];

    for I—I am compassionate.'
translation:
  language: pt
  text: '**11.** Venham a mim, vocês que saem dentre os que são honrados;


    e nos lugares mais baixos vocês me encontrarão.


    E não me lancem fora entre os que são carentes, na inutilidade[a];


    pois eu — eu sou compassiva[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção copta é difícil. Mais literalmente, pode ser entendida como “entre os que são carentes, na inutilidade” ou “entre os destituídos de valor”.
    reason: lexical_alternative
  - marker: b
    text: Ou “misericordiosa”. O termo copta descreve alguém que demonstra compaixão.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: os que são honrados
  rationale: O particípio passivo expressa pessoas que recebem honra; a formulação mantém o contraste poético com os lugares mais humildes.
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: os lugares mais humildes
  rationale: Os empréstimos gregos indicam os lugares mínimos, inferiores ou de menor condição. “Mais humildes” comunica tanto a dimensão espacial quanto a social sem tornar o verso artificial.
- source_word: ⲛ̄ⲧⲉⲧⲛϭⲓⲛⲉ ⲙ̄ⲙⲟⲓ (reconstruído a partir do OCR corrompido)
  choice: vocês me encontrarão
  rationale: A revisão do testemunho manuscrito identifica a expressão copta corrente para “encontrar”, em vez da leitura produzida pelo OCR que sugeria “casa” e “ver”.
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: não me lancem fora
  rationale: A construção reúne o verbo “lançar” com o objeto pronominal feminino singular e o elemento direcional “para fora”; não significa “não se exaltem”.
- source_word: ⲛⲉⲧϣⲁⲁⲧ
  choice: os que são carentes
  rationale: A forma se relaciona a estar em falta ou destituído, não ao verbo “pisar” ou “calcar”.
- source_word: ⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: como inútil
  rationale: O substantivo derivado do grego ἀχρήστ- denota inutilidade ou ausência de valor. A formulação portuguesa evita a expressão pouco natural “carentes na inutilidade”, mas a relação sintática permanece incerta e é registrada em nota.
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: compassiva
  rationale: Trata-se do termo copta para alguém compassivo ou misericordioso, e não de uma construção futura que significaria “alguém a ser humilhado”. O feminino concorda com a voz feminina do poema.
theological_decisions:
- issue: Qualidade declarada pela voz feminina
  choice: compassiva
  alternative: misericordiosa
  rationale: Ambas são lexicalmente possíveis. “Compassiva” preserva o sentido afetivo sem acrescentar uma conotação religiosa mais específica; não se identifica dogmaticamente a personagem.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com imperativos no plural em “vocês”. O paralelismo e a repetição enfática “eu — eu” foram preservados. A tradução segue as correções manuscritas indicadas nas revisões mais recentes, em vez de tratar como palavras reais algumas sequências produzidas pelo OCR.
