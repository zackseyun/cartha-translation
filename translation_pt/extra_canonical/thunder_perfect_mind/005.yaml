base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/005.yaml
  text: Be watchful,[1] and as for your hearing, do not be deaf to me in any place or in any other thought[2]; and do not be ignorant of me. For I am the first[a][2], and I am the last.
translation:
  language: pt
  text: '**5.** Fiquem atentos,[a] e, quanto ao ouvir de vocês, não sejam surdos a mim em lugar algum nem em qualquer outro pensamento[b]; e não sejam ignorantes a meu respeito. Pois eu sou a primeira[c][b], e eu sou a última.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Fiquem de sobreaviso”; “Estejam vigilantes”.'
    reason: lexical_alternative
  - marker: b
    text: A posição desta oração nas linhas mapeadas é incerta; algumas edições podem ligá-la à exortação seguinte ou à anterior.
    reason: alignment_note
  - marker: c
    text: 'Leitura anterior não adotada: “e vocês que ouvem — ouçam-me, não segundo um lugar nem segundo outro pensamento”. Essa leitura depende de uma análise gramatical diferente da seguida aqui.'
    reason: previous_rendering
lexical_decisions:
- source_word: ⲧⲱⲉⲓ
  choice: Fiquem atentos
  rationale: O imperativo exorta à vigilância; a formulação é natural em português e mantém o tom de advertência.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: quanto ao ouvir de vocês
  rationale: Reflete a leitura nominal com possessivo, “o ouvir de vocês”, sem reinterpretá-la como “vocês que ouvem”.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ
  choice: não sejam surdos a mim
  rationale: Reproduz a proibição de ser “não ouvinte” ou surdo em relação à voz da locutora.
- source_word: ⲕⲁⲧⲁ ⲙⲁ
  choice: em lugar algum
  rationale: Expressa o valor idiomático espacial de ocorrência irrestrita, em vez do literal pouco natural “segundo um lugar”.
- source_word: ⲛⲕⲉⲟⲩⲙⲉⲩⲉ
  choice: qualquer outro pensamento
  rationale: Mantém o sentido de pensamento, ideia ou concepção e preserva a estranheza poética da expressão.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: não sejam ignorantes a meu respeito
  rationale: Conserva a advertência forte baseada no verbo “conhecer”, sem reduzi-la ao sentido volitivo de “não me ignorem”.
- source_word: ⲧϣⲟⲣⲡ
  choice: a primeira
  rationale: Mantém o feminino gramatical da autodeclaração da locutora e o paralelo com “a última”.
- source_word: ⲑⲁⲉ
  choice: a última
  rationale: Preserva literalmente o segundo termo da autodeclaração paradoxal.
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: eu sou
  rationale: A repetição explícita sustenta o paralelismo enfático do copta.
theological_decisions:
- issue: Gênero da voz que declara ser a primeira e a última
  choice: a primeira / a última
  alternative: o primeiro / o último
  rationale: As formas predicativas coptas são femininas e concordam com a identidade discursiva da locutora; neutralizá-las apagaria evidência gramatical do texto.
- issue: Natureza de “outro pensamento”
  choice: preservar a expressão sem explicação doutrinária
  alternative: interpretá-la como outra opinião, entendimento ou doutrina específica
  rationale: O contexto imediato não determina com segurança um referente teológico particular; a tradução mantém a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com plural inclusivo de leitura ampla (“vocês”). A sintaxe deliberadamente incomum de “quanto ao ouvir de vocês” e “em qualquer outro pensamento” foi preservada por refletir construções difíceis do copta, enquanto “em lugar algum” comunica o provável valor idiomático de ⲕⲁⲧⲁ ⲙⲁ. O feminino da voz foi mantido.
