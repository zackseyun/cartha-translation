base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/078.yaml
  text: 'Those who exist outside my association are ignorant of me[a],

    and those who exist in my substance are the ones who know me.

    Those who are close to me have been ignorant of me,

    and those who are far away from me are the ones who have known me.

    On the day when I am close to you, you are far away from me,

    and on the day when you are close to me, I am far away from you.'
translation:
  language: pt
  text: 'Os que existem fora da minha convivência não me conhecem[a],


    e os que existem na minha substância são os que me conhecem.


    Os que estão perto de mim não me conheceram,


    e os que estão longe de mim são os que me conheceram.


    No dia em que estou perto de vocês, vocês estão longe de mim;


    e, no dia em que vocês estão perto de mim, estou longe de vocês.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra traduzida por “convivência” também pode significar “associação”, “companhia” ou “estar junto”.
    reason: lexical_alternative
  - marker: b
    text: 'O OCR fornecido se interrompe no começo da última oração. A cláusula é completada conforme a sequência paralela preservada no texto conhecido: “quando vocês estão perto de mim, estou longe de vocês”.'
    reason: textual_completion
lexical_decisions:
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲧⲁⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: fora da minha convivência
  rationale: ⲥⲩⲛⲟⲩⲥⲓⲁ, empréstimo do grego συνουσία, indica estar junto, associação ou companhia. “Convivência” conserva a ideia relacional sem impor o sentido mais específico de “conselho”.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: não me conhecem
  rationale: A construção negativa com ⲥⲟⲟⲩⲛ expressa desconhecimento; o presente português acompanha o aspecto da primeira afirmação.
- source_word: ⲟⲩⲥⲓⲁ (forma parcialmente corrompida no OCR)
  choice: substância
  rationale: Preserva o contraste verbal entre συνουσία, associação ou convivência, e οὐσία, ser ou substância, sem dissolver a tensão metafísica do texto.
- source_word: ⲛⲉⲧⲟⲩⲏⲏⲩ ⲛⲥⲁⲛⲃⲟⲗ ⲙⲙⲟⲉⲓ
  choice: os que estão longe de mim
  rationale: Tradução natural da expressão espacial, mantida em paralelo antitético com os que estão perto.
- source_word: ⲛⲉⲛⲧⲁⲩⲥⲟⲩⲱⲛⲧ
  choice: os que me conheceram
  rationale: A forma perfectiva pede “conheceram”, em contraste deliberado com o presente das linhas iniciais.
theological_decisions:
- issue: Contraste entre proximidade e conhecimento
  choice: 'Manter literalmente o paradoxo: os próximos não conheceram, enquanto os distantes conheceram.'
  alternative: Explicar proximidade como intimidade espiritual ou distância como transcendência.
  rationale: O texto formula uma tensão intencional e não identifica seu sentido doutrinário; a tradução não deve resolvê-la.
- issue: “Minha substância”
  choice: Conservar a linguagem ontológica.
  alternative: Traduzir de modo relacional, como “os que estão em mim”.
  rationale: “Substância” mantém o provável jogo entre οὐσία e συνουσία e evita apagar uma ambiguidade significativa.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo poético preservado. Usa “vocês” para tornar explícito o destinatário plural sem marca regional excessiva; mantém “substância” por precisão e “convivência” por naturalidade relacional.
