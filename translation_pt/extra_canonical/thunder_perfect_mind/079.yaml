lexical_decisions:
- source_word: ⲧⲏⲥ ⲛⲥⲁⲙⲟⲩ
  choice: … de louvor
  rationale: O início está truncado e a leitura de ⲧⲏⲥ é incerta, mas ⲥⲁⲙⲟⲩ expressa louvor. A tradução conserva apenas o elemento razoavelmente recuperável e marca a lacuna, sem importar a frase conhecida de outra página.
- source_word: ϩⲙⲡⲉϩⲟⲟⲩ ⲉⲛⲕⲟⲗⲁⲥⲓⲥ
  choice: No dia do castigo
  rationale: Tradução direta da locução temporal; ⲕⲟⲗⲁⲥⲓⲥ, empréstimo grego, significa aqui ‘castigo’ ou ‘punição’.
- source_word: ⲛⲉⲣⲱⲧⲛ
  choice: a vocês
  rationale: Mantém a referência à segunda pessoa do plural visível no sufixo ⲧⲛ, embora a relação sintática esteja prejudicada pelo caráter fragmentário do trecho.
- source_word: ⲁⲕⲥⲱⲧⲙ
  choice: você ouviu
  rationale: A forma verbal indica perfeito de segunda pessoa masculina singular. ‘Você’ oferece leitura natural e amplamente compreensível em português, sem apagar a mudança do plural para o singular.
theological_decisions:
- issue: Possível identificação do trecho como uma declaração antitética de ‘Eu sou’
  choice: Não reconstruir a declaração conhecida de outra parte do poema
  alternative: ‘Eu sou a honrada e louvada, e aquela desprezada com desdém.’
  rationale: O recorte copta fornecido contém claramente ‘no dia do castigo’, ‘a vocês’ e ‘você ouviu’. Inserir a declaração antitética dependeria do texto de consulta desalinhado, não da evidência deste segmento.
- issue: Sentido de ⲕⲟⲗⲁⲥⲓⲥ
  choice: castigo
  alternative: punição
  rationale: Ambas são possíveis; ‘castigo’ é natural e preserva o sentido judicial ou retributivo sem especificar agente, duração ou doutrina.
translation_notes:
  register: Português moderno, digno e acessível, com reticências para representar perdas ou descontinuidades reais do fragmento. Evita-se completar a sintaxe a partir do texto de consulta desalinhado. A alternância entre segunda pessoa plural e singular é preservada.
