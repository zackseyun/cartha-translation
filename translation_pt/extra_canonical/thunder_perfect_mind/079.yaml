  text: … de louvor.[a] No dia do castigo… a vocês… você ouviu…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O começo do trecho está incompleto e a primeira palavra do OCR é incerta. A expressão traduzida como “de louvor” representa apenas a parte recuperável; não se inclui aqui a conhecida declaração “Eu sou a honrada…”, pois ela pertence a outro ponto do manuscrito.
    reason: textual_alignment
  - marker: b
    text: O copta passa de “vocês” (plural) para “você” (masculino singular). Como as palavras intermediárias estão perdidas ou ilegíveis, a tradução mantém essa mudança sem tentar harmonizá-la.
