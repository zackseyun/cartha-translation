  text: 'greatness in parts from smallness[a].

    For they know smallness from greatness.

    Why do you curse me and honor me?

    You have wounded, and you have shown mercy.

    Do not cast out the first things[c][b],'
translation:
  language: pt
  text: 'Grandeza, em partes, a partir da pequenez.[a]


    Pois eles conhecem a pequenez a partir da grandeza.


    Por que vocês me amaldiçoam e me honram?


    Vocês feriram e mostraram misericórdia.


    Não expulsem as primeiras coisas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma copta transmitida pelo OCR é incerta, mas provavelmente representa “pequenez”, em antítese com “grandeza”. Algumas leituras anteriores entenderam aqui “entendimento”.
    reason: Incerteza textual e alternativa lexical.
  - marker: b
    text: O verbo pode ter o sentido de “lançar para fora” ou “derramar”; também se propôs uma correção textual com o sentido de “separar”. “As primeiras coisas” também pode ser traduzido por “os princípios” ou “as origens”.
    reason: Forma verbal incerta e ambiguidade do substantivo plural.
lexical_decisions:
- source_word: ⲙⲛⲧⲛⲟϭ
  choice: grandeza
  rationale: O abstrato formado de ⲛⲟϭ, “grande”, contrapõe-se diretamente a ⲙⲛⲧⲕⲟⲩⲓ, “pequenez”.
- source_word: ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ ⲉⲃⲟⲗ ϩⲛ
  choice: em partes, a partir de
  rationale: Distingue ϩⲛ, “em”, de ⲉⲃⲟⲗ ϩⲛ, “a partir de”, evitando a leitura espacial anterior “em lugares afastados”.
- source_word: ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: a pequenez
  rationale: Provável forma OCR de ⲧⲙⲛⲧⲕⲟⲩⲓ; a antítese com “grandeza” sustenta “pequenez”, embora a leitura material não seja inteiramente segura.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: pois conhecem
  rationale: Analisa ⲉϣⲁⲩ- como construção habitual com ⲥⲟⲩⲱⲛ, e não ϣⲁⲩ como verbo independente, “envelhecer”.
- source_word: ⲉⲧⲕⲉ ⲟⲩ
  choice: por que
  rationale: Entendido como erro de OCR por ⲉⲧⲃⲉ ⲟⲩ, expressão interrogativa “por que”.
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: vocês me amaldiçoam
  rationale: O verbo significa “amaldiçoar”; o presente da segunda pessoa do plural é vertido naturalmente com “vocês”.
- source_word: ⲧⲉⲧⲛⲧⲁⲉⲓⲟ
  choice: me honram
  rationale: ⲧⲁⲉⲓⲟ significa “honrar”, formando o paradoxo intencional com “amaldiçoam”.
- source_word: ⲁⲧⲉⲧⲛϣⲱϥ
  choice: vocês feriram
  rationale: A forma contém o marcador de perfeito ⲁ-; ϣⲱϥ é entendido no campo de ferir ou devastar, não como “olhar”.
- source_word: ⲁⲧⲉⲧⲛⲛⲁ
  choice: tiveram misericórdia
  rationale: A construção perfeita com ⲛⲁ expressa demonstrar misericórdia e preserva o contraste com “feriram”.
- source_word: ⲙⲡⲣⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: não expulsem
  rationale: O imperativo negativo é entendido como proibição de lançar ou pôr para fora; a forma verbal permanece textualmente incerta.
- source_word: ⲛⲛϣⲟⲣⲡ
  choice: as primeiras coisas
  rationale: Mantém o plural substantivado e a indeterminação do referente, sem convertê-lo em uma abstração temporal como “os começos”.
theological_decisions:
- issue: Os referentes de “grandeza”, “pequenez” e “as primeiras coisas”
  choice: manter os termos abstratos e o referente indefinido
  alternative: interpretá-los como categorias cosmológicas, seres primordiais ou origens
  rationale: O trecho não identifica explicitamente os referentes; uma especificação cosmológica resolveria indevidamente sua ambiguidade poética e teológica.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A disposição em linhas preserva o paralelismo antitético e a voz paradoxal do poema. O fragmento inicial permanece sintaticamente incompleto porque o excerto começa no meio de uma unidade.
