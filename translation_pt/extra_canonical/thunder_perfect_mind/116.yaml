review_pass:
  verdict: revise
  source_fidelity: A redação atual traduz plausivelmente ϣⲟⲟⲡ ⲟⲩⲁⲁⲧ como uma exortação à condição solitária, mas «por causa da lei» não corresponde de modo seguro a ϩⲁ ⲡⲓ ⲛⲉⲗⲟⲥ (provavelmente ϩⲁ ⲡⲓⲛⲟⲙⲟⲥ, «sob/segundo a lei»). Além disso, o segmento está manifestamente truncado e o verbo entre «lei» e «os que estão em muitos pecados» permanece ilegível. A tradução precisa não apresentar uma relação causal que a fonte não afirma.
  naturalness: «Fica só» é português moderno e inteligível, embora possa ser lido coloquialmente como «fique apenas». «Fica solitário» preserva melhor o valor predicativo de ⲟⲩⲁⲁⲧ e mantém concisão adequada ao tom oracular. A frase final deve ser assumidamente fragmentária, pois o excerto copta e seu alinhamento não permitem restaurar uma oração portuguesa contínua.
  terminology: «Lei» é uma leitura possível, mas dependente de OCR, para o provável empréstimo ⲛⲟⲙⲟⲥ. «Solitário» é uma opção lexical direta para ⲟⲩⲁⲁⲧ; a alternativa «obediente» deve permanecer em nota, sem ser tratada como menos direta. «Pecados» traduz normalmente ⲛⲟⲃⲉ.
  issues:
  - severity: high
    issue: «por causa da lei» introduz causalidade sem apoio seguro no copta.
    rationale: A preposição ϩⲁ, no contexto de julgamento e da provável leitura «a lei», é mais naturalmente «sob» ou «segundo», não «por causa de».
  - severity: medium
    issue: A tradução apresenta o fim do bloco como se sua ligação sintática estivesse suficientemente determinada.
    rationale: O verbo ϩⲁⲭⲉⲓⲛ é incerto no OCR, e o próprio alinhamento é de baixa confiança; é necessário marcar uma lacuna também após «lei».
  - severity: low
    issue: A nota sobre ⲟⲩⲁⲁⲧ hierarquiza indevidamente as leituras possíveis.
    rationale: No material fornecido, tanto «solitário/único» quanto a leitura contextual «obediente» são registradas como possíveis; a nota deve preservar a ambiguidade sem declarar uma delas menos direta.
  revised_text: '**7.** Fica solitário[a], e não há quem me julgue segundo a lei […] os que estão em muitos pecados.[b]'
  revised_footnotes:
  - marker: a
    text: O copta ⲟⲩⲁⲁⲧ pode significar «só/solitário» ou, em outra análise lexical, «obediente». A leitura «solitário» foi adotada por ser possível diretamente neste breve excerto; a alternativa permanece incerta.
    reason: lexical_alternative
