lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲟⲩⲁⲁⲧ
  choice: Fique só
  rationale: ϣⲟⲟⲡ funciona aqui naturalmente como imperativo, e ⲟⲩⲁⲁⲧ tem como sentido direto “só/solitário”. A leitura “obediente” é possível por associação lexical, mas não é suficientemente segura para substituir o sentido mais transparente.
- source_word: ⲙⲛⲧⲁⲓ
  choice: não tenho
  rationale: A construção negativa existencial com sufixo de primeira pessoa exprime “não tenho”.
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: quem me julgue
  rationale: A construção relativa futura significa literalmente “aquele que me julgará”; em português, após “não tenho”, a formulação idiomática “quem me julgue” preserva o sentido.
- source_word: ⲛⲟⲙⲟⲥ (leitura conjectural do OCR ⲛⲉⲗⲟⲥ)
  choice: lei
  rationale: Provável empréstimo do grego νόμος, embora o reconhecimento óptico seja incerto.
- source_word: ϩⲛ ϩⲉⲛⲛⲟⲃⲉ ⲉⲛⲁϣⲱ
  choice: em muitos pecados
  rationale: ϩⲛ indica esfera ou condição, ⲛⲟⲃⲉ significa “pecados”, e ⲉⲛⲁϣⲱ intensifica a quantidade.
theological_decisions:
- issue: Leitura de ⲟⲩⲁⲁⲧ como “obediente” ou “só”
  choice: só
  alternative: obediente
  rationale: A ambiguidade foi mantida em nota. O contexto consultivo favorece o tema da obediência, mas a forma isolada e a sintaxe do trecho favorecem “só/solitário”; não se deve resolver a tensão apenas pelo título ou pela tradução inglesa.
- issue: Relação entre “lei” e “pecados”
  choice: não reconstruir a relação sintática perdida
  alternative: formular uma afirmação contínua sobre julgamento segundo a lei e pessoas em pecado
  rationale: O verbo intermediário ϩⲁⲭⲉⲓⲛ está corrompido ou mal reconhecido, e a baixa confiança do alinhamento impede uma reconstrução teológica segura.
