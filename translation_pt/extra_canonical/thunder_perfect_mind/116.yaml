    reason: textual_and_alignment_uncertainty
  revision_rationale: A revisão remove a causalidade indevida de «por causa da lei», conserva a provável referência à lei com a relação menos interpretativa «segundo», e sinaliza a ruptura sintática que o OCR e o alinhamento não permitem resolver. Mantém-se a alternativa lexical para ⲟⲩⲁⲁⲧ em nota, sem depender da reconstrução inglesa de um bloco possivelmente adjacente.
