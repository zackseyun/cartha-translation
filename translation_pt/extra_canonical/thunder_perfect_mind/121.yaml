review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a estrutura causal e as duas proibições causativas, bem como a leitura cautelosa de ⲕⲣⲓⲙⲁ e o sentido de ⲟⲉⲓϣ. Contudo, o imperativo negativo copta ⲙⲡⲣ é singular; «não deixem» introduz um destinatário plural não expresso. A coordenação disjuntiva ⲏ é mais diretamente reproduzida por «ou» do que por «nem».
  naturalness: O texto é claro, digno e natural em português moderno. «Não permitas que eu seja...» é idiomático e conserva o singular do original, embora tenha um tom levemente elevado compatível com a peça. «Por meio de julgamento» expressa com mais clareza o valor instrumental de ⲛ- do que «por julgamento».
  terminology: «Julgamento» é uma tradução adequada, mantida com nota de incerteza por depender de reconstrução do OCR. «Poder» para ⲟⲉⲓϣ é apropriado, e a nota informa de modo suficiente a alternativa «força». O feminino em «ouvida» e «conhecida» é coerente com a voz discursiva feminina da obra.
  issues:
  - severity: medium
    issue: O destinatário foi vertido no plural («não deixem»), embora ⲙⲡⲣ seja imperativo negativo singular.
    rationale: A alteração para «não permitas» evita acrescentar pluralidade não indicada pelo copta e mantém a força proibitiva/causativa.
  - severity: low
    issue: «Nem» substitui a disjunção ⲏ («ou»).
    rationale: Embora seja aceitável após negação em português, «ou» espelha mais diretamente a alternativa expressa pelo original e pelo audit trail inglês.
  - severity: low
    issue: A formulação da nota a, «leitura copta preservada pelo OCR», sugere indevidamente que o OCR preserva uma leitura textual segura.
    rationale: O testemunho é um excerto de OCR de baixa confiança; «sequência registrada pelo OCR» descreve a evidência com maior precisão.
  revised_text: '**5.** Por isso[a], não permitas que eu seja ouvida;


    e não permitas que eu seja conhecida por meio de julgamento ou por qualquer outro poder[b].'
  revised_footnotes:
  - marker: a
    text: A sequência copta registrada pelo OCR, ⲕⲉⲙⲁ, provavelmente representa o empréstimo grego ⲕⲣⲓⲙⲁ, «julgamento»; o reconhecimento pode ter omitido ⲣⲓ. Se essa reconstrução não estiver correta, o sentido permanece incerto e pode referir-se a outro substantivo.
    reason: textual_variant
  - marker: b
    text: A palavra copta ⲟⲉⲓϣ pode significar «força» ou «poder»; aqui foi traduzida como «poder».
    reason: cultural_note
  revision_rationale: 'A revisão corrige o número do imperativo para o singular indicado por ⲙⲡⲣ, conserva o paralelismo das duas proibições e torna explícita a disjunção do original. Também ajusta a nota textual para refletir a natureza incerta da leitura baseada em OCR, sem apresentar a reconstrução de ⲕⲣⲓⲙⲁ como segura. Os marcadores foram reposicionados: a nota textual acompanha «Por isso», como no audit trail inglês, e a nota lexical acompanha «poder».'
