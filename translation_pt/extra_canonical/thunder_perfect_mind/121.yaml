base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/121.yaml
  text: 'Because of this[a], do not let me be heard[b];

    and do not let me be known by judgment or by any other power.'
translation:
  language: pt
  text: '**5.** Por isso, não deixem que eu seja ouvida;


    e não deixem que eu seja conhecida por julgamento[a] nem por qualquer outro poder[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura copta preservada pelo OCR, ⲕⲉⲙⲁ, provavelmente representa o empréstimo grego ⲕⲣⲓⲙⲁ, “julgamento”, com perda de letras no reconhecimento do texto. Se essa reconstrução não estiver correta, o sentido permanece incerto e pode apontar para outro substantivo.
    reason: textual_variant
  - marker: b
    text: A palavra copta ⲟⲉⲓϣ pode significar “força” ou “poder”; aqui foi traduzida como “poder”.
    reason: cultural_note
