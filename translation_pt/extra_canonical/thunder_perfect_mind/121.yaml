review_pass:
  verdict: revise
  source_fidelity: A tradução de ⲉⲧⲃⲉ ⲡⲁⲓ e das duas proibições causativas é adequada. No entanto, ⲛ ⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ lê-se naturalmente como “em outro lugar ou em outro tempo”, não como “por julgamento nem por qualquer outro poder”. A baixa confiança do alinhamento não justifica substituir essa sequência copta legível por uma reconstrução conjectural incompatível com ela.
  naturalness: “Não deixem que eu seja ouvida/conhecida” é português moderno, claro e mantém o paralelismo do original. “Em outro lugar ou em outro tempo” é idiomático e preserva a alternativa expressa por ⲏ.
  terminology: Não há termo teológico especializado neste trecho. “Julgamento” e “poder” devem ser retirados, pois dependem de uma reconstrução indevida de ⲕⲉⲙⲁ como ⲕⲣⲓⲙⲁ e ignoram a leitura transparente ⲕⲉⲙⲁ (“outro lugar”) em paralelo com ⲕⲉⲟⲩⲟⲉⲓϣ (“outro tempo”).
  issues:
  - severity: high
    issue: A locução final foi traduzida como “por julgamento nem por qualquer outro poder”.
    rationale: 'O texto copta apresentado traz ⲛ ⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ: ⲕⲉⲙⲁ é “outro lugar”, e ⲕⲉⲟⲩⲟⲉⲓϣ é “outro tempo”. A leitura “julgamento” exige alterar indevidamente a palavra visível e destrói o paralelismo espacial-temporal.'
  - severity: medium
    issue: As notas a e b sustentam sentidos que o excerto copta não apoia.
    rationale: A nota a trata ⲕⲉⲙⲁ como OCR defeituoso para ⲕⲣⲓⲙⲁ; porém ⲕⲉⲙⲁ é uma leitura copta coerente no contexto. A nota b sobre ⲟⲉⲓϣ como “poder” omite que, com ⲕⲉ-, a expressão é “outro tempo”.
  revised_text: '**5.** Por isso, não deixem que eu seja ouvida;


    e não deixem que eu seja conhecida em outro lugar ou em outro tempo.'
  revised_footnotes: []
  revision_rationale: 'A revisão segue a sequência copta efetivamente preservada: as duas formas ⲙⲡⲣ ⲣⲁⲧ introduzem proibições paralelas, e ⲛ ⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ especifica “em outro lugar ou em outro tempo”. O trecho OCR termina em seguida no início de uma nova proibição (ⲙⲡⲣ ⲣⲁⲧ), que não é necessário completar conjecturalmente nesta unidade. As notas anteriores são removidas porque promovem uma hipótese textual que contradiz a leitura mais direta do texto fornecido.'
