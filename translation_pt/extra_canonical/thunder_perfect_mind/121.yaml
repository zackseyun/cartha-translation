- source_word: ⲛ ⲕⲉⲙⲁ ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ
  choice: por julgamento nem por qualquer outro poder
  rationale: Lê-se provavelmente ⲕⲣⲓⲙⲁ, empréstimo grego para “julgamento”; ⲟⲉⲓϣ indica força ou poder. “Por” conserva a possível função instrumental da preposição sem especificá-la em excesso.
