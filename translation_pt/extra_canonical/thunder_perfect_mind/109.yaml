lexical_decisions:
- source_word: ⲛⲁⲩ
  choice: veem
  rationale: É o verbo copta comum para a percepção visual. “Veem” mantém a linguagem direta e a repetição do motivo de ver.
- source_word: ⲉⲃⲟⲗ
  choice: fora
  rationale: Em oposição a ⲉϩⲟⲩⲛ, expressa exterioridade. “Fora” preserva de modo natural o paralelismo antitético.
- source_word: ⲉϩⲟⲩⲛ
  choice: dentro
  rationale: Denota interioridade e forma com “fora” uma oposição clara, sem converter a imagem em interpretação abstrata.
- source_word: ⲟⲣⲁⲧⲟⲛ (empréstimo do grego ὁρατόν)
  choice: o que é visível
  rationale: O adjetivo grego é usado substantivamente; esta formulação conserva sua força nominal e a ligação com o verbo “ver”.
- source_word: ⲓⲙⲁⲧⲓⲟⲛ (empréstimo do grego ἱμάτιον)
  choice: veste
  rationale: “Veste” comunica uma peça de roupa em registro poético e digno, preservando a metáfora sem especificar indevidamente “manto” ou generalizar como “roupa”.
theological_decisions:
- issue: Relação entre o exterior, o interior e a veste
  choice: Preservar as identificações em sua forma paradoxal, sem explicar seu sentido metafísico ou antropológico.
  alternative: Interpretar o exterior como corpo e o interior como alma, ou explicar a veste como corpo material.
  rationale: O texto poético afirma a relação, mas não define explicitamente seus referentes; uma explicação acrescentaria uma doutrina não expressa no segmento.
translation_notes:
  register: Português atual, claro e solene, com legibilidade brasileira e alcance internacional. Mantiveram-se a segunda pessoa do plural por meio de “vocês”, o paralelismo “fora/dentro”, a repetição de “veem” e a imagem concisa da “veste”. A nota explicita a limitação documental sem tentar reconstruir o copta a partir de um OCR aparentemente desalinhado.
