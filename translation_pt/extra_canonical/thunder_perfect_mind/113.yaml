base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/113.yaml
  text: 'You yourselves also[1]—the angels and those who have been sent[2]—

    I am the sign[3] that points out[4] among the dead[b][a][5][4][3][2][1]; yet I am the one who—[5]'
translation:
  language: pt
  text: '**4.** Vocês mesmos também — os anjos[a] e os que foram enviados[b] —


    eu sou o sinal que aponta entre os mortos[c]; contudo, sou aquele que…[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os mensageiros”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo é “enviar”, não “ver”. A construção pode ser entendida como “os que foram enviados”; conforme a análise sintática, também se admite “os que enviaram”.
    reason: lexical_alternative
  - marker: c
    text: A expressão traduzida por “que aponta” é incerta; também pode ter o sentido de “que faz aparecer”, “que distingue” ou “que divide”. “Sinal” também pode ser traduzido por “marca”.
    reason: textual_variant
  - marker: d
    text: O trecho fornecido termina depois de “aquele que”; a oração continua além deste recorte. A partícula anterior, aqui traduzida por “contudo”, também pode ser entendida como “e” ou “de fato”.
    reason: textual_variant
lexical_decisions:
- source_word: ⲧⲱⲧⲛ̄ ϩⲱⲧ ⲧⲏⲩⲧⲛ̄
  choice: Vocês mesmos também
  rationale: A combinação é enfática e inclui o enclítico com o sentido de “também”, não “somente”. A formulação mantém o plural e a ênfase sem tornar o português excessivamente arcaico.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: os anjos
  rationale: O empréstimo grego pode significar “mensageiros”, mas, neste discurso de alcance cósmico, “anjos” é a leitura contextual mais provável; a alternativa é registrada em nota.
- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: os que foram enviados
  rationale: A forma contém o verbo copta “enviar”, não o verbo “ver”. O plural impessoal pode expressar sentido passivo, embora a construção também admita a tradução mais literal “os que eles enviaram”.
- source_word: ⲡⲓⲛⲁ
  choice: o sinal
  rationale: “Sinal” exprime o valor semântico amplo do termo; “marca” continua possível.
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: que aponta
  rationale: A expressão é lexicalmente incerta. “Aponta” preserva a ideia provável de indicar ou tornar manifesto sem adotar como certa a interpretação contextual “divide”.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: entre os mortos
  rationale: A preposição indica esfera ou localização; diante de um coletivo plural, “entre” é natural e mantém a estrutura do copta.
- source_word: ⲭⲉ
  choice: contudo
  rationale: Adota-se o possível valor adversativo na transição para uma nova autoafirmação, sem esconder em nota que a partícula e até sua leitura no OCR são incertas.
- source_word: ⲁⲛⲟⲕ ⲡⲉⲧ
  choice: sou aquele que…
  rationale: Mantém a cadência enfática da autoidentificação e deixa a oração deliberadamente incompleta, pois o excerto termina após o relativo.
theological_decisions:
- issue: Identidade dos ⲁⲅⲅⲉⲗⲟⲥ
  choice: anjos
  alternative: mensageiros
  rationale: A tradução principal segue o sentido cósmico mais provável, mas a nota preserva a amplitude não necessariamente técnica do empréstimo grego.
- issue: Função do sinal entre os mortos
  choice: que aponta
  alternative: que distingue/divide ou faz aparecer
  rationale: O verbo do OCR é incerto, e não há base suficiente neste pequeno recorte para transformar a frase em uma afirmação teológica específica sobre juízo, ressurreição ou separação dos mortos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural direto. Os travessões preservam a estrutura fragmentária e parentética do copta; as reticências indicam interrupção material do excerto, não uma conclusão interpretativa.
