translation:
  language: pt
  text: '**3.** Eu sou o nome da voz e a voz do nome[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Voz” também pode ser traduzida por “som”. Ambos os sentidos correspondem ao copta ⲫⲱⲛⲏ; “voz” preserva uma nuance pessoal, enquanto “som” tem sentido acústico mais amplo.
    reason: lexical_alternative
  - marker: b
    text: A região do OCR contém vocativos próximos, como “ouvintes” e “anjos”. Algumas letras podem ter sido lidas incorretamente (ⲥ em lugar de ⲫ e omissão de ⲣ); por isso, ⲡⲓⲛⲁ é entendido como ⲡⲣⲁⲛ (“o nome”), e ⲧⲥⲙⲏ como ⲧⲫⲱⲛⲏ (“a voz”).
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  choice: Eu sou
  rationale: A identificação equativa enfática na primeira pessoa é vertida com a cópula para preservar a cadência e a força declarativa recorrentes no texto.
- source_word: ⲡⲣⲁⲛ (o OCR traz ⲡⲓⲛⲁ)
  choice: o nome
  rationale: A leitura reconstruída preserva o termo central de identidade e o artigo definido mantém a simetria entre as duas metades.
- source_word: ⲫⲱⲛⲏ (provavelmente lido pelo OCR como ⲥⲙⲏ)
  choice: voz
  rationale: O empréstimo do grego φωνή pode indicar voz ou som; “voz” conserva a nuance pessoal e audível sem desfazer o paradoxo.
- source_word: ⲛ̄ⲧⲉ (genitivo)
  choice: da/do
  rationale: A contração portuguesa da preposição com o artigo reproduz a relação genitiva nos dois membros espelhados.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: A coordenação simples mantém o quiasmo conciso, sem acrescentar ênfase ausente da fonte.
