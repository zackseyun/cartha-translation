  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: o conhecimento
  rationale: O substantivo articulado deriva de ⲥⲟⲟⲩⲛ, “conhecer”, e aqui designa “conhecimento”, não o adjetivo “sábia”.
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ (leitura reconstruída sob o OCR ⲧⲛⲛⲁⲥⲓⲉ)
  choice: a ignorância
  rationale: A reconstrução morfológica forma o abstrato privativo “não conhecimento/ignorância” e sustenta o contraste com “conhecimento”; o OCR fornecido está corrompido neste ponto.
- source_word: ϩⲁⲡ (no OCR ⲫⲁⲡ)
  choice: o julgamento
  rationale: A sequência pode ser analisada como artigo definido seguido de ϩⲁⲡ, “julgamento, juízo”, preservando a segunda autodeclaração do trecho.
- source_word: ⲛⲉⲗⲗⲏⲛ
  choice: dos gregos
  rationale: O prefixo plural e o contexto favorecem o coletivo plural “os gregos”, em vez do singular genérico.
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: dos bárbaros
  rationale: Mantém a oposição cultural greco-romana expressa pelo empréstimo grego, sem suavizá-la para “estrangeiros” ou “não gregos”.
theological_decisions:
- issue: Identidade paradoxal da voz como conhecimento e ignorância
  choice: Preservar as duas predicações em tensão, sem explicar como podem coexistir.
  alternative: Harmonizar o texto como “sem entendimento e sábia”.
  rationale: A leitura morfológica reconstruída aponta para dois substantivos abstratos; resolver o paradoxo introduziria uma interpretação não exigida pelo testemunho.
translation_notes:
  register: Português atual, digno e direto, com boa legibilidade brasileira. “Gregos” e “bárbaros” preservam a oposição histórica do texto; “a seu respeito” mantém o referente pronominal sem decidir além do que a construção permite.
