  text: the finding of those who seek me[a], and the command of those who ask me, and the voice of the voices of the place of God, of the angels[d][c][b], which they utter
translation:
  language: pt
  text: '**7.** a descoberta dos que me procuram,


    e o mandamento dos que me pedem,


    e a voz das vozes do lugar da divindade, dos anjos, que eles proferem.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A cadeia final de genitivos no copta é compacta e sua ligação exata é ambígua: “dos anjos” pode relacionar-se de modos diferentes com “as vozes” e “o lugar da divindade”. O excerto termina sem conclusão sintática completa.'
    reason: textual_syntax_note
lexical_decisions:
- source_word: ⲡⲅⲓⲛⲉ
  choice: a descoberta
  rationale: Preserva o substantivo definido e o sentido de encontrar/descobrir, sem transformá-lo numa pergunta inexistente no copta.
- source_word: ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: daqueles que me procuram
  rationale: A construção com ϣⲓⲛⲉ ⲛⲥⲱ= significa procurar ou buscar alguém; aqui não tem o sentido de insultar ou amaldiçoar.
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: a ordem
  rationale: Traduz o substantivo como ordem ou mandamento, mantendo a estrutura nominal paralela do trecho.
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: daqueles que me pedem
  rationale: O verbo de origem grega ⲁⲓⲧⲉⲓ significa pedir ou solicitar; o complemento de primeira pessoa foi preservado sem acrescentar objeto implícito.
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: a voz das vozes
  rationale: Mantém a expressão superlativa ou enfática do copta em vez de reduzi-la simplesmente a 'a voz'.
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: divindade
  rationale: A forma grega admite o sentido de divindade ou condição divina. 'Divindade' preserva melhor o substantivo abstrato do que substituir diretamente por 'Deus'.
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ
  choice: que eles proferem
  rationale: Traduz o verbo como fazer sair/proferir, com os anjos como antecedente provável do sujeito plural.
theological_decisions:
- issue: Relação entre 'lugar da divindade' e 'anjos'
  choice: Manter ambos, com travessão e repetição esclarecedora de 'a voz'
  alternative: no lugar de Deus, dos anjos, que eles proferem
  rationale: A cadeia de genitivos é sintaticamente difícil e o excerto pode terminar no meio da construção. A redação escolhida conserva os elementos do copta sem afirmar que os anjos sejam Deus nem apagar a possível ligação entre o lugar divino e a voz angélica.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético. O início em minúscula e a falta de encerramento sintático refletem que este bloco é um fragmento contínuo do poema, não uma frase independente. A tradução segue o copta fornecido, e não o texto de consulta desalinhado.
