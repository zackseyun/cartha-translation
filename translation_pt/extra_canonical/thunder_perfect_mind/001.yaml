translation:
  language: pt
  text: 'O Trovão, a Mente Perfeita


    Fui enviada da Potência[a]


    e vim[b] aos que meditam sobre mim,


    e fui encontrada[c] entre os que me procuram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Potência» provavelmente representa o grego δύναμις, usado como empréstimo no copta. O artigo não está visível neste recorte do OCR; a tradução «da Potência» segue a leitura comum das testemunhas e edições.
    reason: Nota de alinhamento e incerteza textual.
  - marker: b
    text: 'O OCR traz ⲛⲧⲁⲓⲥⲱⲧⲙ, «fui ouvida». Muitas edições leem ⲛⲧⲁⲓⲉⲓ, «vim». Se a forma com ⲥⲱⲧⲙ for confirmada, a linha poderá ser traduzida: «e fui ouvida pelos que meditam sobre mim».'
    reason: Leitura alternativa relevante no testemunho fornecido.
  - marker: c
    text: A expressão copta pode ser entendida como «encontrei a mim mesma», «fui encontrada» ou «encontraram-me». Adota-se «fui encontrada» pelo paralelismo e pela cadência, sem excluir as outras construções.
    reason: Ambiguidade sintática e de voz.
lexical_decisions:
- source_word: ⲧⲃⲣⲟⲛⲧⲏ
  choice: O Trovão
  rationale: Em português, o artigo torna o título natural e preserva o substantivo que traduz o empréstimo grego βροντή.
- source_word: ⲛⲟⲩⲥ
  choice: Mente
  rationale: Traduz o grego νοῦς de modo breve e reconhecível, preservando a estranheza do epíteto; «Intelecto» seria mais técnico.
- source_word: ⲛⲧⲉⲗⲉⲓⲟⲥ
  choice: Perfeita
  rationale: Equivalente tradicional e direto de τέλειος; a flexão feminina concorda com «Mente».
- source_word: ⲧⲁⲛⲧⲁⲟⲩⲟⲉⲓ ... ⲉⲃⲟⲗ
  choice: Fui enviada
  rationale: Conserva a voz passiva e a ação iniciada por outro; «para fora» seria pesado e desnecessário em português.
- source_word: (implied) ⲛⲧⲉ ⲧⲉ ⲇⲩⲛⲁⲙⲓⲥ
  choice: da Potência
  rationale: «Potência» preserva melhor que «Poder» o possível valor titular e a relação com o empréstimo grego δύναμις, sem eliminar a ambiguidade semântica.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: meditam em mim
  rationale: Mantém o tom contemplativo do verbo copta e constitui expressão natural em português.
- source_word: ⲛⲧⲁⲓⲥⲱⲧⲙ (OCR) / ⲛⲧⲁⲓⲉⲓ (expected)
  choice: vim
  rationale: Segue a leitura adotada pela maioria das edições, mas a leitura efetivamente exibida pelo OCR é preservada em nota.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: fui encontrada entre os que me procuram
  rationale: Conserva o paralelismo passivo da abertura e expressa com naturalidade uma das construções possíveis da forma copta; as demais são registradas em nota.
theological_decisions:
- issue: Gênero da voz que fala
  choice: Formas femininas («enviada», «encontrada»)
  alternative: Formas masculinas ou reformulação sem marca de gênero
  rationale: O título «Mente Perfeita» é feminino em português e a tradição literária identifica a voz por esse título; a concordância gramatical não pretende definir a ontologia ou o sexo da figura.
- issue: Caráter titular de δύναμις
  choice: «Potência» com inicial maiúscula
  alternative: «poder» ou «força» em sentido comum
  rationale: A maiúscula preserva a possibilidade de designação hipostática sem afirmar uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética em três linhas. Preferiu-se «procuram» a «buscam» por ampla naturalidade internacional, e manteve-se a concisão enigmática do original. O título foi apresentado sem ponto final, como cabeçalho.
