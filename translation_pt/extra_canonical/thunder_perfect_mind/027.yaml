  text: I am the un-shut and the rich[a]. The exaltation of seeking[b],
translation:
  language: pt
  text: '**5.** Eu sou a que não ouve e a rica.[a] A exaltação da busca,[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «a não ouvinte» ou «a que não ouve». A construção é paradoxal e a relação exata entre as duas designações permanece concisa no copta.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, «a altura/elevação do buscar». A expressão continua no trecho seguinte.
    reason: source_fragment
lexical_decisions:
- source_word: ⲁⲧⲱⲧⲙ
  choice: a não fechada
  rationale: Mantém a forma privativa e a expressão paradoxal do copta sem converter a imagem em uma interpretação mais fluente. Como a leitura do vocábulo é incerta, a possível acepção ligada a não ouvir é registrada em nota.
- source_word: ⲧⲣⲙⲙⲁⲟ
  choice: a rica
  rationale: ⲣⲙⲙⲁⲟ designa uma pessoa rica; o artigo e o gênero em português acompanham a voz feminina que fala ao longo da obra.
- source_word: ⲡϫⲓⲥⲉ
  choice: a exaltação
  rationale: ϫⲓⲥⲉ pertence ao campo de altura, elevação ou exaltação, não ao de vergonha. “Exaltação” preserva tanto a imagem vertical quanto sua força abstrata.
- source_word: ⲛⲍⲏⲧⲉ
  choice: da busca
  rationale: Entendido como construção genitiva ligada ao buscar, provavelmente refletindo o grego ζητεῖν. “Da busca” é natural em português e conserva a relação sintática.
theological_decisions:
- issue: Identidade e gênero da voz enunciadora
  choice: 'Formas femininas: “a não fechada” e “a rica”'
  alternative: Formas masculinas genéricas ou uma paráfrase sem gênero
  rationale: A obra apresenta uma voz feminina, e nada neste trecho exige neutralizar esse traço. A opção não associa a voz a uma figura teológica denominacional específica.
- issue: Caráter fragmentário da frase final
  choice: Manter a vírgula depois de “busca”
  alternative: Encerrar a expressão como frase completa
  rationale: O texto prossegue no excerto e a expressão parece introduzir ou governar material subsequente; encerrá-la resolveria indevidamente uma sintaxe incompleta.
translation_notes:
  register: Português atual, poético e solene, com a estranheza deliberada da autodeclaração preservada. Evitou-se a antiga leitura “vergonha e orgulho”, que não corresponde aos vocábulos visíveis neste excerto.
