translation:
  language: pt
  text: Ouçam-me na ira e aprendam de mim na mansidão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲉⲣⲟⲉⲓ ϩⲛ ⲟⲩϭⲱⲛ
  choice: me na ira
  rationale: A expressão preserva o objeto de primeira pessoa e o substantivo forte ⲟⲩϭⲱⲛ, “ira/cólera”. O imperativo “Ouçam” depende do verbo truncado imediatamente antes do excerto, recuperável pelo contexto sintático e pela tradição textual.
- source_word: ⲛⲧⲉⲧⲛϫⲓ ⲥⲃⲱ ⲉⲣⲟⲉⲓ
  choice: e aprendam de mim
  rationale: A locução ϫⲓ ⲥⲃⲱ significa receber instrução ou aprender; “de mim” expressa naturalmente em português a regência de ⲉⲣⲟⲉⲓ.
- source_word: ϩⲛ ⲟⲩⲙⲏϣⲉ (OCR; provável leitura corrompida)
  choice: na mansidão
  rationale: A leitura do OCR é defeituosa, mas a reconstrução contextual e textual indica uma qualidade como mansidão/gentileza, em antítese deliberada com “ira”. “Mansidão” mantém o substantivo abstrato e o contraste solene.
theological_decisions:
- issue: Contraste paradoxal entre ira e mansidão
  choice: 'Preservar literalmente a tensão: “na ira” / “na mansidão”'
  alternative: Suavizar para “quando estiverem irados” / “com delicadeza”
  rationale: A voz do poema reúne predicações e circunstâncias contrastantes. Resolver a tensão por paráfrase imporia uma interpretação não exigida pelo copta.
translation_notes:
  register: Português moderno, digno e direto, com imperativos no plural inclusivos e de ampla compreensão. Evitou-se o texto consultivo desalinhado “Eu sou união e dissolução”, que não corresponde a este segmento. A quebra em duas orações coordenadas acompanha a estrutura copta.
