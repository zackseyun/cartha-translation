    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲱϣ(ⲥ) ⲙ̄ⲡⲁⲣⲁⲛ
  choice: o chamado do meu nome
  rationale: O contexto e a revisão textual favorecem a derivação de ⲱϣ, «chamar, clamar», em vez do sentido genérico «som». A formulação preserva a associação entre o ato de chamar e o nome.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: sou eu
  rationale: Reproduz de modo natural e enfático a identificação copular da voz feminina.
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: o clamor
  rationale: A forma remete ao ato de clamar ou gritar, não a «imaculada». O substantivo «clamor» conserva a nominalização poética sem tornar a frase excessivamente áspera.
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: a escuta
  rationale: O infinitivo substantivado expressa o próprio ato de ouvir. «A escuta» mantém o paralelismo paradoxal com «o clamor», em vez de resolver a expressão como «aquela que é ouvida».
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: vocês me ouvem
  rationale: Representa diretamente a segunda pessoa do plural e o verbo «ouvir».
- source_word: ⲛⲉⲧⲛⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: quando me chamam
  rationale: Expressa em português corrente a circunstância em que os destinatários chamam a locutora, sem perder a repetição temática de «chamado».
- source_word: ϩⲛ ⲟⲩⲡ… ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: por meio de um… que proferem
  rationale: A palavra iniciada por ⲟⲩⲡ está incompleta na evidência fornecida. A tradução conserva explicitamente a lacuna e traduz ⲧⲁⲩⲟ por «proferir», sem adivinhar o substantivo perdido.
theological_decisions:
- issue: Possível leitura moral ou ritual de ⲧⲁϣⲕⲁⲕ
  choice: o clamor
  alternative: imaculada / sem pecado
  rationale: A análise contextual e a revisão da fonte identificam o verbo «clamar» e uma forma nominal, não um adjetivo de pureza. Evita-se assim introduzir uma afirmação teológica de impecabilidade que o trecho não sustenta.
- issue: Valor de ⲥⲱⲧⲙ̄ no paralelismo
  choice: a escuta
  alternative: aquela que é ouvida
  rationale: A leitura nominal ativa preserva a tensão poética entre emitir o clamor e realizar a escuta, sem converter silenciosamente a locutora em mero objeto passivo da audição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «vocês» para a segunda pessoa do plural. O paralelismo curto e solene foi preservado. A lacuna material foi sinalizada no texto, sem reconstruir conjecturalmente «som» ou «voz».
