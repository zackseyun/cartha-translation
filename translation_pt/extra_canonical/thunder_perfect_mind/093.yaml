translation:
  language: pt
  text: '**9.** O chamado do meu nome — sou eu.


    Eu sou o clamor, e sou a escuta.


    Vocês me ouvem em seu chamado a mim, com um… que vocês proferem.[a]'
  philosophy: optimal-equivalence
  footnotes:
