base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/052.yaml
  text: 'I am the one you have thought about[a],

    and you have mocked me.

    I am unlearned, and from me they learn.

    I am she whom you have scorned[g][f][e][d][c][b],

    and you think about me.'
translation:
  language: pt
  text: 'Eu sou quem vocês tiveram em mente,


    e vocês zombaram de mim.



    Eu sou sem instrução[a],


    e aprendem de mim.



    Eu sou aquela que vocês desprezaram,


    e vocês pensam em mim.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “não instruída” ou “ignorante”. A última opção costuma ter tom mais depreciativo em português.'
    reason: lexical_alternative
  - marker: b
    text: O trecho copta fornecido prossegue com outra fórmula “Eu sou...”, mas termina truncado nesse ponto. Além disso, a leitura de consulta “lei / sem lei” não corresponde a estas linhas coptas e provavelmente pertence a outro trecho.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ
  choice: Eu sou
  rationale: Preserva a cadência declarativa e enfática das fórmulas repetidas da voz em primeira pessoa.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: tiveram em mente / pensam em mim
  rationale: O verbo com ⲉⲣⲟ- indica que a falante é o objeto do pensamento. O primeiro caso está no perfeito, enquanto o último é presente; a variação verbal em português preserva essa diferença temporal.
- source_word: ⲁⲧⲉⲧⲛϣⲟⲥⲧ
  choice: vocês zombaram de mim
  rationale: A forma é uma oração principal no perfeito, com sujeito na segunda pessoa do plural e objeto na primeira pessoa; ϣⲱⲥ significa zombar, escarnecer ou tratar com desprezo, não esconder.
- source_word: ⲁⲧⲥⲃⲱ
  choice: não tenho instrução
  rationale: Expressa a negação de instrução ou aprendizado de modo natural e digno, sem a carga pejorativa mais forte de “sou ignorante”.
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ ⲛ̄ⲧⲟⲟⲧ
  choice: aprendem de mim
  rationale: Reproduz o sentido idiomático de adquirir instrução “a partir de mim” e mantém o paradoxo com a afirmação anterior.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: desprezaram
  rationale: O empréstimo grego καταφρονέω comunica desprezo ou desdém; “desprezaram” é claro, forte e corrente em português.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲛⲧⲁⲧⲉⲧⲛ̄...
  choice: Eu sou aquela que vocês...
  rationale: O copulativo e o relativo femininos são preservados explicitamente por “aquela”, em conformidade com a voz feminina do discurso.
theological_decisions:
- issue: Gênero da voz e das construções copulares
  choice: Usar “quem” na primeira declaração e “aquela” onde o copta marca explicitamente o feminino
  alternative: Uniformizar todas as declarações como “Eu sou aquela”
  rationale: A primeira construção traz forma masculina no copta, ao passo que a segunda marca claramente o feminino. “Quem” conserva a neutralidade natural em português sem apagar o feminino explícito da segunda construção.
- issue: Paradoxo entre falta de instrução e função docente
  choice: Manter “não tenho instrução” em tensão direta com “aprendem de mim”
  alternative: Explicar a falante como aparentemente não instruída
  rationale: O texto apresenta o paradoxo sem resolvê-lo; inserir “aparentemente” acrescentaria uma interpretação ausente da fonte.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para a segunda pessoa do plural. A disposição em linhas preserva o ritmo oracular e os contrastes. Evitou-se linguagem técnica e não se harmonizou a tensão deliberada do texto.
