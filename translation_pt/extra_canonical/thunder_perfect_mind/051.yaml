base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/051.yaml
  text: 'And I am she whose festivals are many[a]. I, I am a godless one,

    and I am she whose God is great.

    I am the one you have pondered,

    and you have scorned me.

    I am an unlearned one[f][e][d][c][b],

    and they learn.'
translation:
  language: pt
  text: '**6.** E eu sou aquela cujas festas são numerosas[a].


    Eu, eu sou aquela sem Deus,

    e sou aquela cujo Deus é grande.


    Eu sou aquela em quem vocês pensaram,

    e vocês me desprezaram.


    Eu sou aquela sem instrução,

    e eles aprendem[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto copta deste trecho está preservado aqui por um OCR difícil. A leitura provável é “aquela cujas festas são numerosas”; outras segmentações das letras devem ser consideradas possíveis.
    reason: textual_uncertainty
  - marker: b
    text: A expressão copta significa literalmente algo como “recebem instrução”; aqui foi traduzida pelo sentido idiomático “aprendem”. O texto não diz explicitamente que aprendem dela.
    reason: lexical_and_ambiguity_note
lexical_decisions:
- source_word: ⲧⲉ ⲛⲁϣⲉ ⲛⲉⲥϣⲁ (leitura provável do OCR ⲧⲉⲛϣⲉⲛⲉⲥⲱⲥ)
  choice: aquela cujas festas são numerosas
  rationale: A segmentação provável lê a construção relativa feminina com ⲛⲁϣⲉ, “ser numeroso”, e ⲛⲉⲥϣⲁ, “suas festas”. A nota registra que o OCR não é seguro.
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: aquela sem Deus
  rationale: O prefixo privativo ⲁⲧ- unido a ⲛⲟⲩⲧⲉ, “deus”, exprime “sem Deus”. A formulação evita as conotações filosóficas modernas de “ateia” e conserva o paradoxo com a linha seguinte.
- source_word: ⲧⲉ ⲛⲁϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ (leitura corrigida do OCR ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ)
  choice: aquela cujo Deus é grande
  rationale: A segmentação relativa, apoiada pela revisão do testemunho, entende ⲛⲁϣⲉ como “ser grande” e ⲡⲉⲥⲛⲟⲩⲧⲉ como “seu Deus”, formando um contraste deliberado com “sem Deus”.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: em quem vocês pensaram
  rationale: ⲙⲉⲉⲩⲉ significa “pensar, considerar”; a preposição com pronome retomado é vertida naturalmente pela construção relativa portuguesa “em quem”.
- source_word: ϣⲟⲥⲧ
  choice: desprezaram
  rationale: O verbo significa “desprezar, rejeitar, tratar com desdém”. A forma precedente é o perfeito da segunda pessoa do plural, não uma negação.
- source_word: ⲁⲧⲥⲃⲱ
  choice: sem instrução
  rationale: O privativo ⲁⲧ- com ⲥⲃⲱ, “ensino, instrução”, indica alguém não instruído. “Sem instrução” mantém o contraste lexical com o aprender da linha seguinte sem a carga depreciativa de “ignorante”.
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ
  choice: aprendem
  rationale: A expressão, literalmente ligada a “receber/tomar instrução”, funciona idiomaticamente como “aprender”; ⲉⲃⲟⲗ não exige equivalente separado em português.
theological_decisions:
- issue: O paradoxo entre ausência de Deus e posse de um Deus grande
  choice: “aquela sem Deus” / “aquela cujo Deus é grande”
  alternative: “ateia” / “aquela cujo deus é grande”
  rationale: A tradução conserva a tensão explícita sem explicá-la como contradição, título ou doutrina. “Deus” foi grafado com inicial maiúscula em ambas as linhas para manter a referência paralela, sem definir sua identidade.
- issue: Agente ou fonte do aprendizado na última linha
  choice: “e eles aprendem”
  alternative: “e eles aprendem comigo/de mim”
  rationale: O texto fornecido não explicita que os outros aprendem da locutora; acrescentar “comigo” ou “de mim” resolveria indevidamente uma relação deixada implícita.
translation_notes:
  register: Português moderno, solene e acessível, com “vocês” para a segunda pessoa do plural. A repetição enfática “Eu, eu” e o paralelismo das autodeclarações foram mantidos. Evitaram-se “ateia” e “ignorante” por suas associações modernas e por reduzirem o jogo verbal do copta.
