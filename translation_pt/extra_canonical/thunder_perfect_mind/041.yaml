translation:
  language: pt
  text: '**6.** Eu sou aquela[a] que é encontrada entre os que têm medo,[b]

    e sou força[c] em meio ao tremor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aquela” reflete a voz feminina estabelecida da personagem Trovão ao longo do tratado; o copta ⲁⲛⲟⲕ, por si só, não marca gênero.
    reason: cultural_note
  - marker: b
    text: 'A morfologia copta favorece “os que têm medo”, isto é, pessoas; alguns entendem a expressão de modo abstrato: “em todos os medos”.'
    reason: lexical_alternative
  - marker: c
    text: O termo traduzido por “força” é esperado pelo paralelismo e por outros testemunhos, mas não está claramente visível neste recorte de OCR; a leitura é, portanto, adotada com cautela.
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲛ
  choice: entre / em meio a
  rationale: A preposição locativa pode significar “em”, “dentro de” ou “entre”. “Entre” combina naturalmente com pessoas na primeira linha; “em meio ao” preserva a ideia locativa diante do abstrato “tremor”.
- source_word: ⲛⲉⲧⲛϣⲟϫⲛⲉ
  choice: os que têm medo
  rationale: A construção relativa aponta mais naturalmente para pessoas que estão com medo, embora a leitura abstrata “todos os medos” também apareça em traduções.
- source_word: ϯⲛⲁⲕⲣⲣⲱ
  choice: é encontrada
  rationale: Embora ϯⲛⲁ- tenha forma futura, a formulação funciona aqui como autodeclaração geral. O presente preserva esse valor gnômico e a cadência poética; “será encontrada” continua sendo uma possibilidade formal.
- source_word: ⲁⲛⲟⲕ
  choice: Eu sou
  rationale: A repetição explícita sustenta a anáfora e a estrutura paradoxal do poema.
- source_word: ⲛⲉⲧⲕⲗⲏϣ
  choice: tremor
  rationale: A forma admite relação com “os que tremem”, mas o substantivo abstrato produz o paralelismo conciso “força em meio ao tremor” sem eliminar a tensão do original.
- source_word: ⲟⲩϩⲟⲟⲩ (reconstruído/esperado)
  choice: força
  rationale: “Força” expressa vigor ou poder e forma o paradoxo esperado com “tremor”. O termo, porém, não está claramente legível neste recorte de OCR e é adotado com base no paralelismo e na tradição textual consultada.
theological_decisions:
- issue: Voz feminina da personagem
  choice: aquela
  alternative: formulação sem marca de gênero
  rationale: O pronome copta ⲁⲛⲟⲕ não marca gênero, mas a voz feminina é estabelecida ao longo do tratado. A tradução mantém essa identidade literária sem lhe atribuir uma identificação teológica adicional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência poética. A repetição de “sou” preserva a anáfora, e “em meio ao tremor” conserva o paradoxo sem tornar a frase artificial.
