base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/046.yaml
  text: 'and she who has no image among the barbarians[1].

    I am the one they have hated in many places,

    and I am the one they have loved in many places[b][a][3][2].

    I am the one they call “Death,”

    and I am the one they call “the Law.”'
translation:
  language: pt
  text: 'e aquela que não tem imagem entre os bárbaros.[a]


    Eu sou aquela a quem odiaram em todo lugar,

    e aquela a quem amaram em todo lugar.[b]


    Eu sou aquela a quem chamam de “Morte”,

    e sou aquela a quem costumam chamar de “Lei”.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Imagem” também pode ser entendida como “forma” ou “semelhança”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “em todo/cada lugar”; também se tem proposto entender a expressão como referência a povos ou, de modo menos definido, a lugares.
    reason: lexical_alternative
  - marker: c
    text: 'A forma copta tem sentido habitual: “costumam chamar” ou simplesmente “chamam”, e não “chamarão”.'
    reason: grammar_clarification
lexical_decisions:
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ ⲙⲙⲁⲩ
  choice: aquela que não tem imagem
  rationale: Traduz diretamente a construção negativa e mantém a possível ideia de imagem, forma ou semelhante, sem substituir o trecho por uma conjectura oriunda do texto de consulta.
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: entre os bárbaros
  rationale: Preserva o empréstimo grego e sua tensão cultural; “estrangeiros” seria mais fluente, mas eliminaria parte da força histórica do termo.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Eu sou aquela
  rationale: Mantém a cadência anafórica de autoidentificação e torna explícito o gênero feminino indicado pela cópula copta.
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ / ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: a quem odiaram / a quem amaram
  rationale: Conserva o paralelismo antitético e o aspecto anterior das formas relativas.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: em todo lugar
  rationale: Lê ⲙⲁ como “lugar” e ⲛⲓⲙ como distributivo “todo/cada”, opção mais diretamente apoiada pela expressão copta do que “em muitos lugares”.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ
  choice: chamam de
  rationale: Expressa naturalmente em português a fórmula de nomeação, sem acrescentar uma interpretação sobre a natureza dos títulos.
- source_word: ⲡⲙⲟⲩ
  choice: Morte
  rationale: A maiúscula apresenta o termo como título ou nome na autoidentificação poética, preservando também sua força personificada.
- source_word: ϣⲁⲩⲙⲟⲩⲧⲉ
  choice: costumam chamar
  rationale: O prefixo ϣⲁ- tem valor aorístico ou habitual, não futuro; “costumam chamar” explicita esse valor.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: Lei
  rationale: Traduz o empréstimo grego νόμος pelo equivalente jurídico e religioso mais amplo, sem decidir qual esfera específica está em vista.
theological_decisions:
- issue: Sentido de “Lei” (ⲡⲛⲟⲙⲟⲥ)
  choice: Manter “Lei” sem qualificação
  alternative: “a Lei” entendida especificamente como Lei mosaica, ou “costume/norma”
  rationale: O contexto não identifica de modo inequívoco uma tradição legal específica; a tradução preserva a amplitude e a tensão do título.
- issue: Relação entre “Morte” e “Lei”
  choice: Conservar as duas autoidentificações em paralelo, sem explicação doutrinária
  alternative: Interpretá-las como condenação teológica da Lei ou como identidades metafóricas específicas
  rationale: O texto poético justapõe os títulos, mas não explica sua relação; qualquer harmonização doutrinária iria além da evidência deste segmento.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo poético preservado. Emprega “aquela” para refletir a voz gramaticalmente feminina e evita vocabulário confessional. A pontuação e as quebras de linha destacam as antíteses do original.
