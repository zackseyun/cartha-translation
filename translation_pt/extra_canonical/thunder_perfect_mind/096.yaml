    reason: textual_and_syntactic_uncertainty
  revision_rationale: 'A revisão limita-se a uma correção segura de número e idiomaticidade: “abrir-lhes a boca” preserva a possível ação atribuída à injustiça e a referência plural, sem resolver a sintaxe fragmentária em favor da alternativa interpretativa “vocês deixam que eles abram”.'
