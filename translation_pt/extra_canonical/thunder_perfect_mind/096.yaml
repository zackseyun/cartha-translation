review_pass:
  verdict: revise
  source_fidelity: O rascunho segue o excerto copta, e não o texto de consulta desalinhado. Identifica corretamente ⲡϫⲓⲛϭⲟⲛⲥ como “injustiça” e preserva, de modo prudente, o cenário de defesa e julgamento. Contudo, o trecho é lacunoso e a construção que liga “injustiça” a “abrir ... para me julgar” permanece sintaticamente incerta.
  naturalness: O português é em geral claro, mas “abrir a boca deles” soa pouco natural e não reproduz bem o plural sugerido por ⲧⲉⲣⲟⲟⲩ. “Abrir-lhes a boca” permite preservar a possível personificação sem a formulação possessiva pesada.
  terminology: “Defesa”, “injustiça”, “consideraram” e “julgar” são escolhas adequadas e de registro moderno. “Chamar” conserva a indeterminação do objeto omitido pela lacuna.
  issues:
  - severity: medium
    issue: “a boca deles” está no singular e torna a relação sintática mais opaca.
    rationale: O excerto preserva ⲧⲉⲣⲟⲟⲩ, entendido no registro de auditoria como referência a “suas bocas”. “Abrir-lhes a boca” mantém a construção ambígua e evita introduzir um singular não atestado.
  - severity: low
    issue: A nota pode explicar também que o objeto de “chamam” não está preservado.
    rationale: Isso ajuda o leitor a não inferir indevidamente quem é chamado, sem sobrecarregar o texto principal.
  revised_text: Não é a minha defesa quando chamam; e a injustiça que vocês consideraram, vocês a deixam abrir-lhes a boca para me julgar.[a]
