base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/096.yaml
  text: It is not my defense when they call[a], and the injustice you have considered[d][c][b], you leave it to open their mouths to judge me.
translation:
  language: pt
  text: Não é a minha defesa quando chamam; e a injustiça que vocês consideraram, vocês a deixam abrir a boca deles para me julgar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto copta está fragmentário neste ponto. A relação sintática entre “a injustiça”, “vocês a deixam” e “abrir a boca deles” é incerta; também é possível entender: “vocês permitem que eles abram a boca para me julgar”.'
    reason: textual_and_syntactic_uncertainty
lexical_decisions:
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: a minha defesa
  rationale: O empréstimo grego ⲁⲡⲟⲗⲟⲅⲓⲁ designa uma defesa ou discurso de defesa; o possessivo ⲧⲁ- favorece “minha defesa”.
- source_word: ⲉⲩϣⲁⲛⲙⲟⲩⲧⲉ
  choice: quando chamam
  rationale: A forma preservada aponta para o verbo “chamar/nomear”; “quando chamam” conserva o valor condicional-temporal sem especificar um objeto ausente na lacuna.
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: a injustiça
  rationale: A unidade lexical significa injustiça, violência ou opressão; não é o substantivo “número”. “Injustiça” se ajusta ao contexto judicial.
- source_word: ⲡⲉⲧⲛⲧⲁⲉⲓⲙⲟⲉⲓⲛ
  choice: que vocês consideraram
  rationale: ⲉⲓⲙⲟⲉⲓⲛ pode significar pensar ou considerar; “consideraram” preserva o tom deliberativo do contexto.
- source_word: ⲭⲣⲟⲉⲓ
  choice: abrir
  rationale: O verbo exprime abrir, possivelmente abrir bem; a forma simples evita intensificação não segura.
- source_word: ⲕⲣⲓⲛⲉ
  choice: julgar
  rationale: O empréstimo grego κρίνειν tem aqui sentido judicial; “julgar” mantém a ambiguidade entre avaliar e proferir juízo, sem impor “condenar”.
theological_decisions:
- issue: Agente e referente em “vocês a deixam abrir a boca deles”
  choice: Preservar a construção e seus referentes pouco claros
  alternative: Explicitar que “vocês permitem que eles abram a boca”
  rationale: O trecho está lacunoso e a sintaxe reconstruída não permite identificar com segurança se “a injustiça” é personificada como agente ou se há uma construção causativa. A tradução não resolve silenciosamente essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural de segunda pessoa. A formulação mantém a aspereza do original fragmentário e o cenário judicial, sem harmonizá-lo com o texto de consulta, que pertence a outro trecho.
