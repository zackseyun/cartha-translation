review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente os itens lexicais principais do catálogo. No entanto, ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ é uma forma verbal, e a sua conversão em «uma lucidez» altera a sintaxe e deixa «eles correrão» sem ligação clara. Uma tradução verbal, com «até que eles se tornem lúcidos», representa melhor a sequência copta. A direção ⲉϩⲣⲁⲓ ⲉ- é mais bem representada por «para o alto, para dentro do/em direção ao vazio deles» do que por «rumo ao», que enfraquece a entrada/direção final. A confiança de alinhamento é baixa, e o texto de consulta fornecido não corresponde ao excerto copta; por isso a revisão permanece cautelosa e requer conferência do manuscrito/edição.
  naturalness: O português do rascunho é em geral natural e acessível. «Prazeres voltados para vocês» é compreensível, mas «prazeres em relação a vocês» evita sugerir uma orientação intencional que não está explicitamente marcada. A oração verbal revista torna a transição final mais fluida e inteligível.
  terminology: «Ignorâncias», «paixões», «prazeres», «poder» e «lúcidos» são escolhas adequadas e não impõem leitura doutrinária. «Lúcidos» conserva, com menos conotações moralizantes do que «sóbrios», a faixa semântica de νήφω; a nota registra «sóbrios» como alternativa.
  issues:
  - severity: high
    issue: Nominalização de uma forma verbal em ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
    rationale: O rascunho verte uma forma verbal como «uma lucidez» para manter um catálogo nominal. Isso modifica a estrutura da fonte e produz uma mudança abrupta e pouco ancorada para «eles correrão». A tradução deve manter a oração verbal, sem apresentar a nominalização como texto principal.
  - severity: medium
    issue: Direção final suavizada em «rumo ao vazio»
    rationale: A sequência ⲉϩⲣⲁⲓ ⲉⲡⲟⲩⲕⲏⲛⲏ contém movimento ascendente seguido de direção para o vazio deles. «Para o alto, para o vazio deles» conserva melhor a construção.
  - severity: medium
    issue: Alinhamento editorial incerto
    rationale: O próprio contexto classifica o alinhamento como baixo, e o consult_text em inglês é materialmente diferente do excerto copta apresentado. A leitura deve ser verificada contra uma edição/facsímile antes da publicação definitiva.
