  yaml_path: translation/extra_canonical/thunder_perfect_mind/118.yaml
  text: 'And there are ignorances,

    and passions that are about to come,

    and pleasures toward you[a],

    and a power that you will take[b],

    a clear‑mindedness[c]—

    they will run up into their emptiness[d].'
translation:
  language: pt
  text: '**2.** E há ignorâncias,

    e paixões que estão para vir,

    e prazeres voltados para vocês[a],

    e um poder que vocês tomarão[b],

    uma lucidez[c] —

    eles correrão para o alto, rumo ao vazio deles[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta ⲡⲣⲟⲥ ⲡⲉ não traz objeto explícito; “para vocês” é inferido do contexto de exortação.
    reason: alignment_note
  - marker: b
    text: A expressão ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟ é entendida como “que vocês tomarão”; o verbo também pode ter a nuance de “receber” ou “agarrar”, e o sujeito talvez seja “eles”.
    reason: alternative_reading
  - marker: c
    text: 'A forma ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ é verbal: “para que eles fiquem lúcidos/sóbrios”. Foi vertida como substantivo para manter o paralelismo do catálogo, mas também pode ser entendida como oração infinitiva ou relativa.'
    reason: alignment_note
  - marker: d
    text: ⲡⲟⲩⲕⲏⲛⲏ é entendido como “o vazio deles”; “a pobreza deles” também é possível.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲉⲛⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: ignorâncias
  rationale: O prefixo nominalizador ⲙⲛⲧ‑ unido à negação de “conhecer/aprender” produz “não saber; ignorância”; o artigo plural ϩⲉⲛ favorece o plural concreto “ignorâncias”.
- source_word: ϩⲉⲛⲡⲁⲑⲟⲥ
  choice: paixões
  rationale: O empréstimo grego πάθος, em catálogos éticos de textos de Nag Hammadi, costuma designar impulsos ou afeições dominantes; “paixões” preserva esse sentido, embora “sofrimentos” seja lexicalmente possível.
- source_word: ⲉⲧϣⲁⲉⲓⲏⲧ
  choice: que estão para vir
  rationale: A construção relativa com valor futuro indica algo iminente ou por vir.
- source_word: ϩⲉⲛⲏⲇⲟⲛⲏ
  choice: prazeres
  rationale: O empréstimo do grego ἡδονή tem aqui seu sentido ético comum de “prazeres”.
- source_word: ⲡⲣⲟⲥ
  choice: voltados para
  rationale: Mantém o valor direcional básico de πρός em português natural. Como não há objeto explícito no trecho copta, “vocês” é inferido e assinalado em nota.
- source_word: ⲟⲩⲉⲓϣ
  choice: um poder
  rationale: O termo denota força ou capacidade; “poder” se ajusta ao registro do escrito sem excluir totalmente essas nuances.
- source_word: ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟ
  choice: que vocês tomarão
  rationale: A frase é entendida como relativa com futuro na segunda pessoa do plural e objeto pronominal. “Tomar” é menos específico que “agarrar”, mas “receber” também é possível.
- source_word: ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
  choice: uma lucidez
  rationale: Embora a forma seja verbal, ligada ao grego νήφω, “estar sóbrio/lúcido”, a nominalização mantém o paralelismo do catálogo. A alteração sintática é explicitada em nota.
- source_word: ⲛⲥⲉ ⲡⲱⲧ
  choice: eles correrão
  rationale: A construção traz marca de terceira pessoa do plural com ⲡⲱⲧ, “correr/fugir”; “correrão” evita decidir que se trata de fuga.
- source_word: ⲉϩⲣⲁⲓ
  choice: para o alto
  rationale: Reproduz a direção ascendente expressa pelo advérbio.
- source_word: ⲡⲟⲩⲕⲏⲛⲏ
  choice: o vazio deles
  rationale: A forma é entendida em relação com o grego κενή/κένωμα, “vazio”; a leitura “pobreza deles” continua possível e é registrada em nota.
