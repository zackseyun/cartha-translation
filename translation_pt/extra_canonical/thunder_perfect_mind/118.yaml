translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Conservou-se a repetição de “e”, característica da enumeração, bem como a mudança abrupta do catálogo para “eles correrão”. “Lucidez” evita o sentido predominantemente ligado à abstinência que “sobriedade” pode assumir em português, enquanto a nota preserva a forma verbal e suas alternativas.
