base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/032.yaml
  text: And you will find me in greatness; and do not look at me going out among those who are honored, and in the least places look for me.
translation:
  language: pt
  text: '**10.** E vocês me encontrarão na grandeza[a]. Não olhem para mim ao sair dentre os que são honrados[b]; procurem-me nos lugares menos importantes[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “na riqueza”. O termo copta denota literalmente “grandeza”, mas pode abranger elevação social e, conforme o contexto, riqueza.
    reason: lexical_alternative
  - marker: b
    text: A expressão traduzida como “ao sair” também pode ser entendida como “vir para fora” ou “surgir”.
    reason: lexical_alternative
  - marker: c
    text: O final do trecho está danificado ou foi reproduzido de modo imperfeito no OCR. A tradução segue a provável leitura “procurem-me nos lugares menos importantes”.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: vocês me encontrarão
  rationale: O futuro da segunda pessoa do plural com ϭⲓⲛⲉ, normalmente “encontrar/descobrir”, é vertido diretamente, mantendo explícito o plural.
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: na grandeza
  rationale: A formação abstrata com ⲙⲛⲧ- favorece “grandeza”; “riqueza” é uma possibilidade semântica contextual, mas é menos direta lexicalmente.
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: Não olhem para mim
  rationale: O proibitivo plural com o verbo “ver/olhar” e o complemento “para mim” pede uma proibição direta e natural em português.
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: quando eu estiver saindo do meio
  rationale: A expressão indica movimento para fora. A construção temporal portuguesa integra naturalmente o particípio ao imperativo, sem decidir de modo rígido entre “sair” e “vir para fora”.
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: os que são honrados
  rationale: A forma é entendida como relativo plural ligado ao estativo de ⲧⲁⲉⲓⲟ, “honrar”, e não como referência genérica aos “grandes”.
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: os lugares mais insignificantes
  rationale: O empréstimo grego ἐλάχιστος qualifica “lugares”. “Mais insignificantes” comunica aqui a ideia de menor importância ou posição, evitando a leitura meramente espacial de “menores”.
- source_word: ⲛ̄ⲧⲉ ⲧⲏⲥ ⲱⲕ ⲉⲛⲥⲱⲉⲓ
  choice: procurem-me
  rationale: O OCR parece corromper uma sequência correspondente a ⲛⲧⲉⲧⲛϭⲱϣⲧ ⲛⲥⲱⲉⲓ, “vocês procuram/olham por mim”; a reconstrução também produz o paralelismo esperado com a proibição anterior.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de compreensão ampla, com “vocês” para tornar visível a segunda pessoa do plural. Conserva-se o contraste paradoxal entre grandeza, honra e lugares de pouca importância, sem harmonizá-lo com a apresentação tradicional “pobreza e riqueza”.
