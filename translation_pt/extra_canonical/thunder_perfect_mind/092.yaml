base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/092.yaml
  text: 'I am the understanding of every person, my mind within.

    I am the knowledge of my name.

    I am the cry that goes out,

    and I am the one who hears.'
translation:
  language: pt
  text: '**8.** Eu sou a preparação de cada pessoa,[a]

    minha mente no íntimo.[b]


    Eu sou a articulação do meu nome.[c]


    Eu sou o clamor que se lança para fora,

    e sou aquela que ouve.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta ⲧⲥⲟⲃⲧⲉ também pode ser traduzido por “aparelhamento” ou “equipamento”.
    reason: lexical_alternative
  - marker: b
    text: 'A ligação sintática é incerta. Também seria possível entender: “a preparação de cada pessoa dentro da minha mente”.'
    reason: syntactic_ambiguity
  - marker: c
    text: Literalmente, o termo pode indicar “divisão” ou “distinção”; no contexto do nome, também admite “pronúncia” ou “enunciação”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲥⲟⲃⲧⲉ
  choice: a preparação
  rationale: O substantivo indica preparação, aparelhamento ou equipamento. “Preparação” é a opção portuguesa mais direta e natural, sem lhe impor o sentido cognitivo de “entendimento”.
- source_word: ⲙⲡⲣⲱⲙⲉ ⲛⲓⲙ
  choice: de cada pessoa
  rationale: ⲣⲱⲙⲉ designa o ser humano ou a pessoa, e ⲛⲓⲙ tem valor distributivo de “cada/todo”; a formulação é inclusiva e corrente.
- source_word: ⲡⲁⲛⲟⲩⲥ
  choice: minha mente
  rationale: O empréstimo grego νοῦς é precedido pelo possessivo masculino singular ⲡⲁ-, portanto “minha mente”, e não simplesmente “a mente”.
- source_word: ⲉϩⲟⲩⲛ
  choice: no íntimo
  rationale: O termo expressa movimento ou localização para dentro. “No íntimo” conserva a interioridade e funciona naturalmente no verso português.
- source_word: ⲧⲡⲱϣⲥ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: a articulação do meu nome
  rationale: ⲡⲱϣⲥ pertence ao campo de divisão ou distinção e, em contexto vocal, pode indicar articulação ou pronúncia. “Articulação” mantém parte dessa amplitude melhor que “conhecimento”.
- source_word: ⲧⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: o clamor que se lança para fora
  rationale: ϣⲕⲁⲕ denota grito ou clamor, enquanto ⲉⲃⲟⲗ marca exteriorização. A tradução preserva tanto a força vocal quanto o movimento para fora.
- source_word: ⲉⲧⲥⲱⲧⲙ̄
  choice: aquela que ouve
  rationale: O particípio relativo significa “a que ouve”. O feminino de “aquela” acompanha a forma copta ⲧⲉ e a voz feminina do poema.
theological_decisions:
- issue: Identidade feminina da voz poética
  choice: aquela que ouve
  alternative: quem ouve
  rationale: A cópula feminina ⲧⲉ torna explícito o gênero gramatical da voz; mantê-lo evita apagar uma característica recorrente e literariamente relevante do texto.
- issue: Relação sintática de ⲡⲁⲛⲟⲩⲥ ⲉϩⲟⲩⲛ com o primeiro enunciado
  choice: 'verso aposicional: “minha mente no íntimo”'
  alternative: integrar como “a preparação de cada pessoa, dentro da minha mente”
  rationale: O excerto admite mais de uma ligação sintática. A disposição em verso conserva a justaposição e evita resolver de modo excessivo se “minha mente” explica a preparação ou inicia uma qualificação distinta.
translation_notes:
  register: Português moderno, digno e poético, com linhas breves para preservar o paralelismo da proclamação. Emprega “pessoa” em sentido inclusivo e mantém o feminino explícito da voz. As escolhas mais incertas são assinaladas sem recorrer a harmonizações doutrinárias.
