    reason: fragment_boundary
lexical_decisions:
- source_word: ⲉⲣⲁⲧϥ ⲡⲉⲛⲧⲁϥⲧⲁⲙⲓⲟⲓ
  choice: diante daquele que me criou
  rationale: A expressão inicial pertence sintaticamente ao contexto anterior e indica posição ou presença diante daquele que criou a voz. A formulação portuguesa conserva o caráter fragmentário sem inventar o verbo regente ausente.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Eu sou aquela que
  rationale: É uma fórmula copular enfática de autoidentificação. O feminino concorda com a voz personificada de Trovão neste escrito.
- source_word: ⲧⲛⲁⲭⲱ ⲙ̄ⲡⲉϥⲣⲁⲛ ⲉⲃⲟⲗ
  choice: proclamará o nome dele
  rationale: O contexto sustenta uma declaração pública ou clamor do nome. “Proclamará” preserva a força vocal sem exigir em português a expressão menos natural “gritará o nome”.
- source_word: ϣⲁϫⲉ
  choice: palavras
  rationale: Neste contexto, o substantivo se refere ao que foi dito por uma pessoa determinada; “palavras” é mais natural que “discurso” e mantém o plural indicado pela reconstrução contextual.
- source_word: ⲛⲉⲥϩⲁⲓ (reconstruído sob o OCR ⲛⲉⲥⲙⲏ)
  choice: escritos
  rationale: A leitura contextual e manuscrita esperada é “escritos”, apesar da forma corrompida no OCR; ela se combina naturalmente com “todos” e com o verbo “foram concluídos”.
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: vocês que ouvem
  rationale: O empréstimo grego designa ouvintes. A construção verbal soa mais corrente e direta em português internacional que o substantivo “ouvintes”, preservando o chamado ao público.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉ...
  choice: os anjos...
  rationale: O OCR e o excerto terminam no início da palavra para “anjos”. As reticências deixam explícito que a frase prossegue além do trecho fornecido.
theological_decisions:
- issue: Gênero da voz que fala
  choice: aquela que proclamará
  alternative: aquele que proclamará
  rationale: A personagem discursiva é a figura feminina personificada de Trovão/Mente Perfeita. O português exige marcação de gênero onde o copta não a explicita da mesma maneira.
- issue: Relação com “aquele que me criou”
  choice: manter a referência sem identificar o criador
  alternative: explicitar uma identidade divina específica
  rationale: O fragmento não nomeia nem define o referente. A tradução preserva essa abertura e não introduz uma identificação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural dirigidos diretamente ao público. A tradução segue a leitura corrigida do trecho manuscrito, e não o texto de consulta desalinhado que repetia indevidamente o contraste anterior entre audição e fala.
