  text: 'to him who created me[a].

    I am the one who will cry out his name.

    Look then at his words,

    and all the writings that have been completed.

    Listen therefore, you hearers,

    and you yourselves also[c][b], the angels'
translation:
  language: pt
  text: '**2.** diante daquele que me criou.[a]


    Eu sou aquela que proclamará o nome dele.


    Vejam, portanto, as palavras dele


    e todos os escritos que foram concluídos.


    Escutem, portanto, vocês que ouvem,


    e vocês também, todos os anjos...[b]'
  philosophy: optimal-equivalence
  footnotes:
