translation:
  language: pt
  text: '**4.** Eu sou a esposa e a virgem[a][b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲥϩⲓⲙⲉ pode significar “mulher” ou “esposa”. Diante do contraste com ⲡⲁⲣⲑⲉⲛⲟⲥ (“virgem”), “esposa” acentua o paradoxo; “mulher” continua sendo uma tradução possível e mais neutra.
    reason: lexical_alternative
  - marker: b
    text: ⲡⲁⲣⲑⲉⲛⲟⲥ é um empréstimo do grego, geralmente traduzido por “virgem”; “donzela” é uma alternativa de tom poético.
    reason: lexical_alternative
  - marker: c
    text: No OCR, a palavra ⲡⲁⲣⲑⲉⲛⲟⲥ está dividida pela mudança de linha (ⲡⲁⲣ | ⲑⲉⲛⲟⲥ), o que reduz a certeza quanto aos limites deste segmento.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Eu sou
  rationale: Preserva a cadência copulativa recorrente em primeira pessoa, central à voz do poema, sem suavizar a repetição.
- source_word: ⲧⲉⲥϩⲓⲙⲉ
  choice: a esposa
  rationale: ⲥϩⲓⲙⲉ pode significar “mulher” ou “esposa”; em contraste com ⲡⲁⲣⲑⲉⲛⲟⲥ, o sentido conjugal intensifica o paradoxo.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Conjunção coordenativa comum que conserva o paralelismo conciso do par.
- source_word: ⲧⲡⲁⲣⲑⲉⲛⲟⲥ
  choice: a virgem
  rationale: Empréstimo do grego πάρθενος; “virgem” é o sentido mais comum e mantém a antítese com “esposa”.
theological_decisions:
- issue: Tensão paradoxal entre condição conjugal e virgindade
  choice: Manter literalmente “a esposa e a virgem”
  alternative: Explicar ou harmonizar as duas designações no texto principal
  rationale: O original apresenta deliberadamente as duas identidades lado a lado; a tradução preserva essa tensão sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e direto, com cadência poética. O artigo definido foi mantido em ambas as designações para refletir a construção copta e o paralelismo. “Esposa” oferece leitura natural no português internacional com boa legibilidade brasileira.
