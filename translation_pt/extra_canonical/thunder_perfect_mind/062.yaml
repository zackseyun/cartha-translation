translation:
  language: pt
  text: 'E quando vocês se ocultarem[c][b][a],

    eu sou aquela que será vista.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O termo copta ⲥⲙⲓⲛⲉ também pode ter o sentido de “tornar-se pequeno” ou “diminuir”. Uma tradução alternativa seria: “E quando vocês se tornarem pequenos, eu sou aquela que será vista”.'
    reason: lexical_alternative
  - marker: b
    text: O trecho fornecido também contém expressões como “no princípio da criação” e “uma aparência visível de uma criança pequena”, provavelmente pertencentes a linhas adjacentes. Conforme o mapeamento deste bloco, traduz-se aqui apenas a oração sobre ocultar-se e ser vista.
    reason: alignment_note
  - marker: c
    text: 'Se o ⲙⲡⲣⲙⲉⲥⲧⲱⲥ final pertencer a esta unidade poética, uma leitura possível será: “E não se ocultem; eu sou aquela que será vista”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲥⲙⲓⲛⲉ
  choice: se ocultarem
  rationale: Mantém a leitura contextual adotada na camada de consulta, preservando o paradoxo entre ocultar-se e ser vista. A possibilidade lexical de ‘tornar-se pequeno/diminuir’ é registrada em nota.
- source_word: ⲙⲓⲉ
  choice: será vista
  rationale: Expressa o sentido de tornar-se visível ou manifesto e conserva a formulação passiva/resultante, bem como o contraste poético com ‘se ocultarem’.
- source_word: ⲁⲩⲱ
  choice: E
  rationale: Reproduz a conjunção aditiva simples e a cadência cumulativa do poema, sem introduzir uma oposição que o copta não explicita.
theological_decisions:
- issue: Gênero da voz que fala na fórmula de autoidentificação
  choice: eu sou aquela que será vista
  alternative: eu é que serei vista
  rationale: O feminino explicita em português a identidade literária feminina da voz de Trovão; não acrescenta uma definição doutrinária à figura.
- issue: Relação entre ocultação e manifestação
  choice: preservar o paradoxo sem explicá-lo
  alternative: interpretar a manifestação como revelação espiritual
  rationale: O texto contrapõe ocultar-se e ser vista, mas não determina aqui a natureza teológica dessa manifestação.
translation_notes:
  register: Português moderno, digno e direto, com ‘vocês’ para ampla legibilidade brasileira. ‘Ocultar-se’ foi preferido a ‘esconder-se’ por combinar naturalidade com o registro poético. Os marcadores seguem no texto na ordem associada à expressão discutida, conforme a camada inglesa auditada.
