translation:
  language: pt
  text: '**5.** Por que vocês odeiam o meu temor[a] e amaldiçoam o meu orgulho?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O meu temor” também pode significar “o temor que inspiro”; o possessivo copta deixa aberta essa relação.
    reason: lexical_ambiguity
  - marker: b
    text: O termo traduzido por “orgulho” também pode ter os sentidos de “glória”, “exaltação” ou “jactância”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Por que
  rationale: Expressa diretamente a pergunta causal do copta em português natural.
- source_word: ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: vocês odeiam
  rationale: Mantém a segunda pessoa do plural e o sentido forte de aversão do verbo.
- source_word: ⲧⲁϩⲟⲧⲉ
  choice: o meu temor
  rationale: 'Preserva a construção possessiva e sua ambiguidade: pode indicar o temor pertencente à voz que fala ou o temor que ela inspira.'
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: amaldiçoam
  rationale: Reproduz o sentido direto do verbo e mantém o paralelismo com “odeiam”.
- source_word: ⲙⲡⲁϣⲟⲩϣⲟⲩ
  choice: o meu orgulho
  rationale: “Orgulho” conserva a tensão entre exaltação, glória e jactância sem tornar o termo automaticamente positivo ou negativo.
theological_decisions:
- issue: Sentido de “meu temor”
  choice: Manter “o meu temor” no texto
  alternative: “o temor que inspiro” ou “meu medo”
  rationale: A forma possessiva copta não determina de modo inequívoco se a voz sente temor ou o inspira; a tradução evita resolver essa tensão.
- issue: Valor de ϣⲟⲩϣⲟⲩ
  choice: “orgulho”
  alternative: “glória”, “exaltação” ou “jactância”
  rationale: O contexto paradoxal da obra permite mais de uma valoração; “orgulho” preserva a formulação incisiva sem impor uma leitura doutrinária.
