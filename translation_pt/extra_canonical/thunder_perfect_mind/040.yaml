  register: Português atual, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. O texto segue o copta corrigido de NHC VI,2 15:28–30 indicado pela revisão crítica, pois o excerto OCR fornecido está desalinhado e pertence a outra passagem.
