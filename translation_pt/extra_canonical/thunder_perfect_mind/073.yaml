base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/073.yaml
  text: And in the spirit of every man who exists with me[a], and the women who are in me— I am the honored one[f][e][d][c][b], and the one who is praised.
translation:
  language: pt
  text: '**10.** E no espírito de todo homem que está comigo, e nas mulheres que estão em mim, eu sou aquela que é honrada[a] e aquela que é louvada[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto copta diz literalmente “aquela que é honrada”. A leitura antiga “minha forma” resulta de uma identificação lexical menos provável.
    reason: lexical_alternative
  - marker: b
    text: Também pode ser traduzido por “aquela que é abençoada”; o verbo copta ⲥⲙⲟⲩ abrange os sentidos de louvar e abençoar, e a construção pode sugerir “aquela a quem eles louvam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲛⲁ
  choice: no espírito
  rationale: ⲡⲛⲁ pode designar espírito, sopro ou vento; neste contexto interior e antropológico, “espírito” é a opção mais natural.
- source_word: ⲣⲱⲙⲉ ⲛⲓⲙ ⲉⲧϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: todo homem que está comigo
  rationale: A sequência é entendida como ⲣⲱⲙⲉ ⲛⲓⲙ, “todo homem”, seguida da oração relativa “que está/existe comigo”. “Homem” conserva o contraste explícito com “mulheres” na oração seguinte.
- source_word: ⲛⲓϩⲓⲟⲙⲉ ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: as mulheres que estão em mim
  rationale: ⲛ̄ϩⲏⲧ é aqui a preposição “em” com sufixo de primeira pessoa, isto é, “em mim”, e não o substantivo “coração”.
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: aquela que é honrada
  rationale: A forma deriva do verbo “honrar” e apresenta a locutora feminina como objeto de honra; evita-se a antiga leitura lexical “minha forma”.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  choice: aquela que é louvada
  rationale: ⲥⲙⲟⲩ é o verbo “louvar/abençoar”; a construção pode ser expressa naturalmente em português pela passiva “é louvada”.
theological_decisions:
- issue: Relação entre a locutora, os homens e as mulheres
  choice: Manter literalmente “no espírito de todo homem” e “as mulheres que estão em mim”.
  alternative: Generalizar como presença da locutora em toda a humanidade.
  rationale: O texto estabelece uma assimetria deliberada e teologicamente sugestiva; a tradução não a harmoniza nem explica.
translation_notes:
  register: Português moderno, digno e claro, com concordância feminina para a voz da locutora. Conservou-se o paralelismo e a tensão do original, sem transformar “homem” em termo genérico porque ele aparece em contraste direto com “mulheres”.
