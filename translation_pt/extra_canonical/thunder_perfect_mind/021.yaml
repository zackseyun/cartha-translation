base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/021.yaml
  text: 'Those who deny me confess me[a],

    and those who confess me deny me.

    Those who speak truth about me lie about me[b],

    and those who lie about me speak truth about me.'
translation:
  language: pt
  text: 'Os que me negam me confessam[a],

    e os que me confessam me negam.


    Os que dizem a verdade sobre mim mentem sobre mim,

    e os que mentem sobre mim dizem a verdade sobre mim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto inglês de consulta associado ao segmento 16 começa com “Eu sou a voz cujo som é múltiplo...”, mas o copta fornecido contém os dísticos sobre negar/confessar e verdade/mentira. Isso provavelmente indica um deslocamento no alinhamento nessa parte da página; a tradução segue o copta apresentado.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲣⲛⲁ
  choice: negar
  rationale: O empréstimo grego ἀρνεῖσθαι tem aqui o sentido de negar ou repudiar; “negar” preserva com naturalidade o contraste confessional com ⲣ̄ϩⲟⲙⲟⲗⲟⲅⲉⲓ.
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: confessar
  rationale: O empréstimo grego ὁμολογεῖν pode significar confessar, reconhecer ou professar. “Confessar” mantém o registro religioso e jurídico e a antítese direta com “negar”.
- source_word: ⲛⲉⲧ–
  choice: os que
  rationale: O determinante relativo substantivado é vertido de modo corrente e inclusivo no contexto por “os que”, sem acrescentar uma condição mais ampla como “quem” ou “todo aquele que”.
- source_word: ⲙ̄ⲙⲟⲉⲓ
  choice: me / mim
  rationale: 'A forma pronominal de primeira pessoa singular é traduzida conforme a regência idiomática portuguesa: objeto direto “me” e, após preposição, “mim”.'
- source_word: ϫⲉ ⲙⲉ ⲉⲣⲟⲓ
  choice: dizem a verdade sobre mim
  rationale: A expressão combina o verbo “dizer” com “verdade” e a relação “a respeito de mim”; a formulação portuguesa conserva o sentido e o paralelismo.
- source_word: ϫⲓϭⲟⲗ ⲉⲣⲟⲉⲓ
  choice: mentem sobre mim
  rationale: A expressão significa dizer falsidade ou mentir a respeito de alguém; “mentem sobre mim” oferece o contraponto natural a “dizem a verdade sobre mim”.
theological_decisions:
- issue: Paradoxo entre negar e confessar, verdade e mentira
  choice: Preservar literalmente as inversões paradoxais, sem explicá-las no corpo do texto.
  alternative: Interpretar as linhas como referência a grupos, perspectivas ou níveis distintos de conhecimento.
  rationale: O copta formula deliberadamente afirmações tensas e antitéticas. Resolver a tensão por paráfrase acrescentaria uma interpretação teológica não expressa no trecho.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo compacto. Mantiveram-se “negar/confessar” pelo teor confessional do original e “dizer a verdade/mentir” para reproduzir a segunda antítese. A porção final do OCR está corrompida, mas a reconstrução contextual e paleográfica indicada pelos dados sustenta com boa segurança o segundo dístico.
