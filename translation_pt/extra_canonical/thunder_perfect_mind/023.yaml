base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/023.yaml
  text: 'Those who lie about me tell the truth about me.[a]

    Those who know me[a], let them be ignorant of me,

    and those who have not known me—let them know me.

    For I am knowledge and ignorance[b].

    I am—'
translation:
  language: pt
  text: 'Os que mentem a meu respeito dizem a verdade a meu respeito.[a]


    Os que me conhecem, que sejam ignorantes a meu respeito;

    e os que não me conheceram, que me conheçam.


    Pois eu sou o conhecimento e a ignorância.


    Eu sou—'
  philosophy: optimal-equivalence
  footnotes:
