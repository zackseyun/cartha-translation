  rationale: Preserva o valor jussivo, o elemento privativo e o paradoxo deliberado em contraste com “que me conheçam”.
- source_word: ⲙⲁⲣⲟⲩⲥⲟⲟⲩⲛ
  choice: que me conheçam
  rationale: O jussivo é expresso naturalmente pelo presente do subjuntivo em português.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: o conhecimento
