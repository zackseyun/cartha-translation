  choice: Os que mentem a meu respeito dizem a verdade a meu respeito
  rationale: A reconstrução adjudicada explica a sequência OCR e restaura o paralelismo antitético característico da obra. A repetição de “a meu respeito” conserva a simetria do copta.
- source_word: ⲥⲟⲟⲩⲛ
  choice: conhecer
  rationale: É o equivalente corrente para conhecimento cognitivo ou relacional e permite repetir em português o campo lexical do original.
- source_word: ⲙⲁⲣⲟⲩⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ (texto corrigido sob o OCR)
