theological_decisions:
- issue: Paradoxo entre conhecer e ser ignorante acerca da voz que fala
  choice: Conservar literalmente a tensão entre conhecimento e ignorância
  alternative: Explicitar como esquecimento, incompreensão ou humildade intelectual
  rationale: O texto apresenta deliberadamente predicações antitéticas; especificar uma interpretação resolveria uma ambiguidade teológica que o original mantém.
- issue: Identidade da voz em “eu sou”
  choice: Não identificar nem explicar a personagem
  alternative: Nomeá-la como Sabedoria, divindade ou figura reveladora específica
  rationale: Este trecho não determina por si só uma identificação doutrinária, e a tradução não deve importar uma leitura denominacional ou privada.
