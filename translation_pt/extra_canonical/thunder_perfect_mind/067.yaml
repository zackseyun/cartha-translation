    text: A forma preservada provavelmente significa ‘estabelecer’, ‘firmar’ ou ‘pôr de pé’. As lacunas tornam incertos o sujeito e a construção completa.
    reason: lexical_alternative
  - marker: d
    text: O restante da frase não está preservado com segurança. A leitura ‘eles serão elevados’ e a expressão ‘primeiras criaturas’, encontradas em reconstruções ou tradições de consulta, não são adotadas porque não aparecem de modo seguro neste excerto.
