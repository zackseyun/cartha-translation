theological_decisions:
- issue: Relação da voz que fala com ‘os pequenos’
  choice: Manter apenas ‘eu estou entre os que são pequenos’
  alternative: Completar a antítese com ‘os grandes’ ou afirmar que os pequenos serão exaltados
  rationale: O excerto permite reconhecer a associação da voz com os pequenos, mas suas lacunas não sustentam com segurança uma antítese ou uma promessa de exaltação; acrescentá-las resolveria indevidamente o texto fragmentário.
