lexical_decisions:
- source_word: ⲙⲡⲣⲙⲉⲗⲉⲧⲁ
  choice: Não se preocupe
  rationale: Lê ⲙⲡⲣ- como imperativo negativo e ⲙⲉⲗⲉⲧⲁ como empréstimo verbal do grego μελετάω, aqui no sentido de ‘preocupar-se/ocupar-se’, em vez de entender a sequência como referência a ‘membros’.
- source_word: ⲗⲁⲁⲧⲉ ⲉⲃⲟⲗ
  choice: partes lançadas fora
  rationale: No trecho fragmentário, a expressão parece designar partes ou porções postas para fora; a tradução evita a leitura ‘aproximem-se’, ligada ao texto de consulta desalinhado.
- source_word: ⲧⲱⲃ︤ⲡ︥
  choice: estabeleça
  rationale: A forma de OCR provavelmente representa ⲧⲱⲃⲥ/ⲧⲟⲃⲥ, ‘pôr de pé, firmar, estabelecer’. O sujeito e o número não são plenamente seguros por causa das lacunas.
- source_word: ⲟⲩⲛ ⲁⲛⲟⲕ ⲛⲛⲉⲧⲛⲉⲣⲙⲛⲥⲁⲛⲁⲓ
  choice: pois eu estou entre os que são pequenos
  rationale: Conserva a autolocalização enfática da voz (‘eu’) e verte ⲥⲁⲛⲁⲓ como ‘pequenos’, sem acrescentar os ‘grandes’ do texto de consulta não alinhado.
theological_decisions:
- issue: Relação da voz que fala com ‘os pequenos’
  choice: Manter apenas ‘eu estou entre os que são pequenos’
  alternative: Completar a antítese com ‘os grandes’ ou afirmar que os pequenos serão exaltados
  rationale: O excerto permite reconhecer a associação da voz com os pequenos, mas suas lacunas não sustentam com segurança uma antítese ou uma promessa de exaltação; acrescentá-las resolveria indevidamente o texto fragmentário.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por ‘você’ implícito em ‘não se preocupe’. As lacunas do manuscrito/OCR são preservadas visivelmente, e não se usa o texto de consulta desalinhado para completar o sentido.
