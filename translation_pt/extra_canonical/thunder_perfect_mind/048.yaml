  yaml_path: translation/extra_canonical/thunder_perfect_mind/048.yaml
  text: And you have called me “Lawlessness.” I am she whom you pursued[a]; and I am the one you have seized; I am she whom you scattered[g][f][e][d][c][b], and you have known.
translation:
  language: pt
  text: 'E vocês me chamaram de “transgressão da lei”.[a]


    Eu sou aquela que vocês perseguiram;

    e sou aquela que vocês capturaram.

    Eu sou aquela que vocês dispersaram e conheceram.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Transgressão da lei” traduz anomia; também poderia ser vertido por “ausência de lei” ou “violação da lei”.
    reason: lexical_alternative
  - marker: b
    text: 'A transcrição copta fornecida lê “conheceram”. É possível, mas não certo, que se leia “reuniram”, formando o contraste: “vocês me dispersaram e me reuniram”. Em qualquer das leituras, a forma é afirmativa.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲙⲟⲩⲧⲉ
  choice: chamaram
  rationale: O verbo significa chamar ou dar um nome; o perfeito afirmativo do trecho foi mantido, sem importar a leitura imperativa registrada numa decisão inglesa anterior.
- source_word: ⲁⲛⲟⲙⲓⲁ
  choice: Transgressão da Lei
  rationale: Representa o empréstimo grego anomia como um título acusatório claro em português, evitando tanto o tom jurídico moderno de “ilegalidade” quanto a carga teológica tradicional de “iniquidade”.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: perseguiram
  rationale: A construção expressa correr atrás ou perseguir; o pronome resumptivo feminino remete naturalmente a “aquela”, não constitui objeto de primeira pessoa independente.
- source_word: ⲙⲁϩⲧⲉ ⲙⲙⲟⲉⲓ
  choice: capturaram
  rationale: Mantém a força de agarrar, apoderar-se ou tomar, com objeto explícito em português pela oração relativa.
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: dispersaram
  rationale: O verbo é “enviar para fora, espalhar, dispersar”, não o verbo semelhante que significa clamar ou proclamar.
- source_word: ⲥⲟⲟⲩⲛ
  choice: conheceram
  rationale: Traduz a forma visível no testemunho OCR fornecido como o verbo “conhecer”; a possibilidade de leitura “reuniram” é preservada em nota.
theological_decisions:
- issue: Possível contraste entre dispersar e reunir no último verso
  choice: 'Texto principal: “conheceram”'
  alternative: “reuniram”
  rationale: A transcrição fornecida apresenta ⲥⲟⲟⲩⲛ, “conhecer”, em perfeito afirmativo. Embora ⲥⲱⲟⲩϩ, “reunir”, produza um paralelismo provável com “dispersaram”, não se emendou silenciosamente o texto.
translation_notes:
  register: Português moderno, claro e digno, com repetição anafórica de “Eu sou aquela” para conservar a cadência do discurso. O plural “vocês” favorece legibilidade brasileira sem regionalismo marcado; a ordem e a tensão paradoxal do copta foram preservadas.
