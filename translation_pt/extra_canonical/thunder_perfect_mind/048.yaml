  source_fidelity: O texto principal preserva corretamente os perfeitos afirmativos, a sequência anafórica e os sentidos de perseguir, capturar/apoderar-se e dispersar. A leitura final “conheceram” corresponde à transcrição copta fornecida; a alternativa “reuniram” deve permanecer apenas em nota, por ser conjectural neste testemunho OCR.
  naturalness: “E vocês conheceram” como oração independente fica incompleto em português, pois “conhecer” normalmente pede objeto. No copta, o objeto pode ser recuperado da relativa anterior; em português, a solução mais natural é coordenar “conheceram” dentro da oração relativa, retomando “aquela”. A minúscula em “transgressão da lei” também é mais idiomática para um epíteto, não um nome próprio.
  terminology: “Transgressão da lei” é uma tradução compreensível de anomia e conserva a referência à lei, sem recorrer ao termo teológico mais carregado “iniquidade”. “Capturaram” é aceitável para o sentido de tomar/apoderar-se.
