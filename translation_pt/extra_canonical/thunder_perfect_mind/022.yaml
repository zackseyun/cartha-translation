base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/022.yaml
  text: 'Those who speak the truth about me[a], lie about me,

    and those who have lied about me, speak the truth about me.

    Those who know me, be ignorant of me,

    and those who have not known me[b], let them know me.'
translation:
  language: pt
  text: '**17.** Os que dizem a verdade a meu respeito mentem a meu respeito,


    e os que mentiram a meu respeito dizem a verdade a meu respeito.


    Os que me conhecem, que não me conheçam;


    e os que não me conheceram, que me conheçam.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O excerto de OCR fornecido termina no início de “os que não...”; o restante da oração é preservado pela continuação textual da passagem.
    reason: textual_scope
lexical_decisions:
- source_word: ⲙⲉ
  choice: verdade
  rationale: O substantivo copta expressa aqui “verdade” e participa do contraste deliberado com ϫⲓ ϭⲟⲗ, “mentir”.
- source_word: ϫⲓ ϭⲟⲗ
  choice: mentem / mentiram
  rationale: 'Neste contexto, a locução significa “dizer falsidade, mentir”, não “enunciação”. A variação verbal acompanha o contraste aspectual refletido no texto: presente na primeira ocorrência e ação anterior na segunda.'
- source_word: ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: me conhecem / me conheçam
  rationale: Traduz diretamente o verbo “conhecer” com objeto de primeira pessoa e mantém a repetição paradoxal.
- source_word: ⲁⲧϭⲉ- / ⲁⲧⲥⲟⲟⲩⲛ
  choice: ignorem-me
  rationale: A formulação imperativa preserva a ordem paradoxal dirigida aos que conhecem a voz; “ignorem-me” é mais natural em português do que “sejam ignorantes de mim”.
theological_decisions:
- issue: Ordens paradoxais sobre conhecer e ignorar
  choice: 'Manter os imperativos: “ignorem-me” e “que me conheçam”'
  alternative: Transformá-los em afirmações indicativas, como “não me conhecem” ou “virão a me conhecer”
  rationale: A forma imperativa sustenta a tensão retórica do original e evita explicar teologicamente o paradoxo.
translation_notes:
  register: Português moderno, claro e digno, com repetição deliberada de “a meu respeito” para conservar o paralelismo. O ponto e vírgula distingue os dois pares paradoxais sem enfraquecer sua unidade.
