base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/020.yaml
  text: Why[a], you who hate me, do you love me, and hate those who love me? You who deny me, confess me[b], and you who confess me, deny me[e][d][c]. You who say—
translation:
  language: pt
  text: '**15.** Por que vocês, que me odeiam, me amam e odeiam os que me amam? Vocês que me negam, confessem-me[a]; e vocês que me confessam, neguem-me[b]. Vocês que dizem—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Confessem” traduz ϩⲟⲙⲟⲗⲟⲅⲉⲓ, empréstimo do grego ὁμολογέω; também se poderia traduzir por “reconheçam” ou “professem”.
    reason: lexical_alternative
  - marker: b
    text: “Neguem” traduz ⲁⲣⲛⲁ; “reneguem” é outra possibilidade.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: Por que
  rationale: A locução interrogativa significa “por quê?”, e não introduz apenas um tópico.
- source_word: ⲙⲟⲥⲧⲉ
  choice: odiar
  rationale: Equivalente direto e natural do verbo básico que expressa ódio.
- source_word: ⲙⲉ
  choice: amar
  rationale: Neste contexto, o verbo significa “amar”; preserva-se o paradoxo com “odiar”.
- source_word: ⲁⲣⲛⲁ
  choice: negar
  rationale: É o equivalente corrente; “renegar” seria possível, mas acrescentaria intensidade.
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: confessar
  rationale: Mantém o sentido tradicional do empréstimo grego ὁμολογέω; “reconhecer” ou “professar” também seriam possíveis.
- source_word: ⲉⲣϩⲟⲙⲟⲗⲟⲅⲉⲓ / ⲉⲣⲁⲣⲛⲁ
  choice: confessem-me / neguem-me
  rationale: As formas são entendidas como imperativos dirigidos aos grupos designados pelas construções relativas vocativas.
- source_word: ⲛⲉⲧϫⲉ
  choice: Vocês que dizem—
  rationale: Reproduz a construção vocativa e deixa a frase incompleta, como no excerto.
theological_decisions: []
