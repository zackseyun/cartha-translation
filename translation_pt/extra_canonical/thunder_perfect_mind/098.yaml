translation:
  language: pt
  text: '**14.** Fechem-lhes a boca![a] Julguem-nos antes que eles agarrem vocês, pois o juiz da injustiça está entre vocês. Se vocês forem libertados na vinda daquele que os libertará, ou se libertarem a si mesmos...[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O começo está deformado no OCR. A leitura contextual e filológica provável é “Fechem-lhes a boca!”, não “Eu sou aquela que clama”.
    reason: textual_uncertainty
  - marker: b
    text: O manuscrito continua além do trecho fornecido; a frase fica incompleta neste excerto.
    reason: excerpt_boundary
lexical_decisions:
- source_word: ⲭⲣⲟⲉⲓ ⲧⲉⲣⲟⲟⲩ (OCR; provavelmente ⲭⲣⲱ ⲛⲧⲉⲣⲟⲟⲩ)
  choice: Fechem-lhes a boca
  rationale: A leitura corrigida entende ⲣⲱ como “boca” e a construção como uma ordem dirigida a um grupo. Isso corresponde ao contexto sintático, ao contrário da leitura OCR que foi anteriormente associada, de modo indevido, a “clamar”.
- source_word: ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ
  choice: Julguem-nos
  rationale: O verbo de origem grega ⲕⲣⲓⲛⲉ significa “julgar”, e ⲙⲙⲟⲟⲩ retoma “eles”. O imperativo plural é mantido.
- source_word: ⲧⲁϩⲉ ⲉⲣⲱⲧⲛ
  choice: agarrem vocês
  rationale: ⲧⲁϩⲉ pode expressar alcançar, apanhar ou agarrar. “Agarrar” conserva aqui o sentido ameaçador sem especificar indevidamente prisão ou condenação.
- source_word: ⲡⲉⲕⲣⲓⲧⲏⲥ ⲙⲡϫⲓ ⲛϭⲟⲛⲥ
  choice: o juiz da injustiça
  rationale: 'A tradução preserva a relação genitiva e sua possível tensão: pode designar um juiz caracterizado pela injustiça ou associado ao julgamento dela.'
- source_word: ⲕⲁ ... ⲉⲃⲟⲗ
  choice: libertados / libertará / libertarem
  rationale: Neste contexto, a locução significa soltar ou libertar, não expulsar. As formas portuguesas acompanham as mudanças de voz e de agente sugeridas pela passagem.
- source_word: ϩⲙ ⲡϫⲓⲛⲓ
  choice: na vinda
  rationale: ϫⲓⲛⲓ designa a vinda ou chegada. “Na vinda” mantém a formulação temporal ou circunstancial sem explicá-la além do texto.
theological_decisions:
- issue: Identidade e caráter do “juiz da injustiça”
  choice: Manter “o juiz da injustiça” sem identificar a figura nem resolver o genitivo
  alternative: “o juiz injusto” ou “o juiz que julga a injustiça”
  rationale: O copta permite uma relação genitiva cuja força exata não deve ser decidida por pressupostos teológicos.
- issue: Agência na libertação
  choice: Preservar a sequência entre serem libertados por aquele que virá e libertarem a si mesmos
  alternative: Harmonizar ambas as orações como libertação exclusivamente externa
  rationale: A alternância paradoxal entre agente externo e ação reflexiva faz parte da tensão do texto e não deve ser eliminada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para explicitar a segunda pessoa do plural do copta. A redação segue o excerto copta efetivamente fornecido e a correção filológica registrada, não o texto de consulta inglês, que está desalinhado com estas linhas.
