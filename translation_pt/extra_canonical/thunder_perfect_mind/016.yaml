- source_word: ⲁⲩⲱ ⲁⲛⲟⲕ ⲧⲉ ⲧϫⲟⲉⲓⲥ ⲙⲡⲁϫⲡⲟ (OCR; leitura recebida correspondente a “irmã de meu marido”)
