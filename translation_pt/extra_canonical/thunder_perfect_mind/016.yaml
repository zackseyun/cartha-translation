- source_word: 'ⲛⲧⲟϥ ⲇⲉ ⲡⲉ … (esperado: termo para filho/criança)'
  choice: e ele é meu descendente
  rationale: “Descendente” conserva o sentido genealógico e evita restringir indevidamente o termo a “filho”, embora essa seja uma tradução possível.
