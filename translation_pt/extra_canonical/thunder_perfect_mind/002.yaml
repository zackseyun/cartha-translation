review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de modo geral o copta: mantém a sequência de apelos, o pronome enfático, o vocativo «ouvintes», «coração perturbado», o imperativo de receber e a proibição de fugir. A forma ⲁⲓϭⲓⲛⲉ transmitida pelo OCR é devidamente preservada como primeira pessoa e assinalada como textual e contextualmente problemática. «Velam por mim», porém, pode sugerir vigília fúnebre em português e não comunica com clareza o sentido de estar vigilante/à espera de alguém.'
  naturalness: 'Há pequenas asperezas evitáveis: o ponto e vírgula antes de «e», a vírgula isolada após o inciso «vocês mesmos» e «acolham-me junto de vocês» soam menos naturais. «Esperam por mim» e «recebam-me entre vocês» são idiomáticos, preservam o tom oracular e representam adequadamente o sentido contextual.'
  terminology: Não há terminologia teológica fixa a impor. «Pensem em mim», «ouvintes», «coração perturbado» e «não fujam de mim» são escolhas sóbrias e fiéis. A nota sobre a variante/irregularidade de ⲁⲓϭⲓⲛⲉ deve permanecer, sem resolver a ambiguidade por emenda no corpo do texto.
  issues:
  - severity: low
    issue: «Velam por mim» é semanticamente ambíguo em português contemporâneo.
    rationale: Além de «estar de vigília», «velar por» pode significar cuidar de alguém ou velar um morto. No contexto, o verbo copta indica os que permanecem alertas/esperam pela voz; «esperam por mim» é mais claro e natural.
  - severity: low
    issue: Pontuação e formulação de «acolham-me junto de vocês».
    rationale: A pontuação atual interrompe desnecessariamente a série de vocativos, e «junto de vocês» repete uma ideia já expressa por «acolham-me». «Recebam-me entre vocês» conserva o objeto e a direção do original de forma mais fluente.
  revised_text: '**2.** Pensem em mim, e eu me encontrei entre os que me procuram.[a]


    Vocês que esperam por mim — vocês mesmos —;


    vocês, ouvintes, escutem-me.


    Vocês que têm o coração perturbado, recebam-me entre vocês


    e não fujam de mim.[b]'
  revised_footnotes:
  - marker: a
    text: 'O texto apresentado traz literalmente uma forma indicativa: «eu me encontrei». Como o trecho é cercado de imperativos, também se propõe a leitura «e encontrem-me entre os que me procuram». Outra possibilidade interpretativa é: «e sou encontrada entre os que me procuram».'
    reason: textual_ambiguity
  - marker: b
    text: Literalmente, «não corram/fujam de mim»; «não se afastem de mim» expressaria o possível sentido relacional.
    reason: lexical_alternative
  revision_rationale: A revisão melhora a legibilidade e elimina ambiguidades portuguesas desnecessárias, sem alterar a estrutura apelativa nem resolver no texto a dificuldade de ⲁⲓϭⲓⲛⲉ. A nota a conserva explicitamente as leituras alternativas; a nota b continua ancorada à expressão final.
