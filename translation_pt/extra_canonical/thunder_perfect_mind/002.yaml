base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/002.yaml
  text: 'Consider me[1], and I found myself among those who seek me,

    you who watch for me—you yourselves;[3]

    and you hearers, listen to me.

    You who are troubled in heart, receive me to yourselves[d][c][b][a][4][3][2],

    and do not turn away from me.[4]'
translation:
  language: pt
  text: '**2.** Pensem em mim; e eu me encontrei entre os que me procuram.[a]


    Vocês que velam por mim — vocês mesmos —,

    e vocês, ouvintes, escutem-me.


    Vocês que têm o coração perturbado, acolham-me junto de vocês

    e não fujam de mim.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto apresentado traz literalmente uma forma indicativa: “eu me encontrei”. Como o trecho é cercado de imperativos, também se propõe a leitura “e encontrem-me entre os que me procuram”. Outra possibilidade interpretativa é: “e sou encontrada entre os que me procuram”.'
    reason: textual_ambiguity
  - marker: b
    text: Literalmente, “não corram/fujam de mim”; “não se afastem de mim” expressaria o possível sentido relacional.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: Pensem em mim
  rationale: O imperativo de ⲙⲉⲉⲩⲉ pode indicar pensar, considerar ou meditar. “Pensem em mim” é direto, natural e não acrescenta conotação devocional ausente do termo.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: eu me encontrei entre os que me procuram
  rationale: Traduz a forma indicativa de primeira pessoa preservada no OCR, sem emendá-la silenciosamente para um imperativo. A leitura alternativa é registrada em nota por causa da sequência de exortações.
- source_word: ⲧⲉⲧⲛⲉⲣⲟⲉⲓⲥ ⲉⲣⲟⲓ
  choice: Vocês que velam por mim
  rationale: ⲣⲟⲉⲓⲥ significa vigiar, manter-se desperto ou velar; “velam por mim” conserva a imagem de atenção vigilante.
- source_word: ⲉⲧⲏⲩⲧⲛ
  choice: vocês mesmos
  rationale: O pronome independente é enfático. Sua expressão explícita preserva a força retórica incomum do original.
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ
  choice: vocês, ouvintes
  rationale: Trata-se de um substantivo agente no plural, “os ouvintes”, empregado como vocativo, e não de uma oração relativa futura.
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: escutem-me
  rationale: O imperativo pede atenção e resposta, não apenas percepção auditiva.
- source_word: ⲛⲉⲧⲧⲟϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ
  choice: Vocês que têm o coração perturbado
  rationale: Mantém tanto o estado de perturbação ou temor quanto a referência explícita ao coração, em português natural.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: acolham-me junto de vocês
  rationale: ϣⲟⲡⲧ é o imperativo de “receber/tomar” com objeto de primeira pessoa, seguido de “para/junto de vocês”. “Acolham-me” comunica recepção pessoal sem confundir a forma com um termo para força.
- source_word: ⲙⲡⲣⲡⲱⲧ ⲛⲥⲱⲓ
  choice: não fujam de mim
  rationale: Preserva literalmente a imagem verbal de correr ou fugir sob a proibição ⲙⲡⲣ-, além do sentido relacional contextual.
theological_decisions:
- issue: Relação entre a voz que fala e os que a procuram
  choice: Preservar a formulação de que a voz se encontrou entre os que a procuram
  alternative: “encontrem-me entre os que me procuram” ou “sou encontrada entre os que me procuram”
  rationale: A forma transmitida no excerto é gramatical e teologicamente tensa; não se deve convertê-la sem aviso em afirmação de presença, passividade ou mandamento.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento por “vocês” evita formas excessivamente arcaicas, enquanto a sintaxe paralela, os vocativos e os imperativos mantêm o tom solene e oracular. A pontuação organiza a sequência de destinatários sem eliminar sua aspereza retórica.
