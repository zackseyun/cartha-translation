translation:
  language: pt
  text: '**8.** Não me deixem lançada fora[a], e vocês me encontrarão na riqueza.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “posta de lado” ou “rejeitada”.'
    reason: lexical_alternative
  - marker: b
    text: 'As palavras coptas seguintes começam outra advertência: “Nem olhem...”; por isso não foram incorporadas a esta frase.'
    reason: segment_boundary
lexical_decisions:
- source_word: ⲙⲡⲣⲕⲁⲁⲧ ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ
  choice: Não me deixem rejeitada
  rationale: 'A sequência corrigida exprime uma proibição seguida do estado da voz que fala: não a deixar lançada fora ou rejeitada. “Rejeitada” comunica isso em português natural sem reduzir a frase a mero afastamento físico.'
- source_word: ⲁⲩⲱ ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: e vocês me encontrarão
  rationale: Preserva a coordenação, a referência explícita aos destinatários no plural e o valor prospectivo da forma verbal.
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: na riqueza
  rationale: O substantivo abstrato copta denota riqueza ou condição abastada. “Na riqueza” mantém a formulação paradoxal e evita transformar o abstrato, sem necessidade, em “entre os ricos”.
theological_decisions:
- issue: Identidade e gênero da voz em primeira pessoa
  choice: Empregar “rejeitada”, em concordância feminina com a voz literária da obra
  alternative: Empregar uma construção sem marca de gênero, como “não me deixem de lado”
  rationale: O contexto amplo apresenta uma voz feminina. A concordância feminina é natural em português, mas não define sua identidade teológica nem resolve as tensões da obra.
- issue: Suposto enunciado “Eu sou a guerra e a paz”
  choice: Não incluí-lo neste segmento
  alternative: Traduzir “Eu sou a guerra e a paz” conforme o texto de consulta desalinhado
  rationale: As linhas coptas fornecidas correspondem à advertência para não deixar a voz rejeitada e à promessa de encontrá-la na riqueza. O par “guerra e paz” pertence a outro ponto da obra.
translation_notes:
  register: Português moderno, digno e diretamente compreensível, com tratamento plural por “vocês”. A formulação conserva a tensão entre rejeição e riqueza e segue as linhas coptas do segmento, não o texto de consulta desalinhado.
