    issue: A cláusula final foi parafraseada como «é quem lhe deu forma».
    rationale: ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ significa literalmente fazer «dele/isso um τύπος», isto é, um padrão/modelo (com possíveis nuances de marca ou impressão). «Dar forma» apaga o substantivo predicativo e confunde esta ação com ⲣⲡⲗⲁⲥⲥⲉ («moldar/formar») da linha anterior.
  - severity: low
    issue: A nota a propõe «Dominem a si mesmos».
    rationale: Essa alternativa introduz uma leitura de autocontrole que não é exigida pelo imperativo de agarrar/tomar posse. Convém limitar a nota a alternativas lexicalmente próximas.
