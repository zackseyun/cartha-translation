  verdict: revise
  source_fidelity: A tradução reconhece corretamente os contrastes ⲥⲁϩⲟⲩⲛ («interior») e ⲥⲁⲃⲟⲗ («exterior») e o imperativo inicial. Contudo, «lhe deu forma» não traduz adequadamente ⲛⲧⲁϥⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ, que preserva a ideia de fazer alguém/algo «um padrão» (τύπος), não simplesmente de lhe dar forma.
  naturalness: «Tomem posse de si mesmos» é compreensível e tem registro apropriado, embora «de vocês mesmos» seja mais idiomático para muitos leitores brasileiros. A reformulação final proposta é concisa, natural e mantém a estranheza intencional do texto.
  terminology: «Interior», «exterior» e «molda» são escolhas adequadas. «Padrão» representa de maneira direta τύπος; a nota pode registrar «marca», «impressão», «modelo» e «forma» como extensões semânticas, sem substituir no texto a construção copta.
  issues:
