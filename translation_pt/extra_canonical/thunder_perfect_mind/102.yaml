translation:
  language: pt
  text: '**18.** Tomem posse de vocês mesmos[a],


    pois o interior de vocês é o exterior de vocês[b],


    e aquele que molda o exterior de vocês


    é quem o fez um padrão[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Agarrem-se a vocês mesmos”. O imperativo ⲁⲙⲁϩⲧⲉ expressa agarrar ou tomar posse.'
    reason: lexical_alternative
  - marker: b
    text: O texto copta contrapõe literalmente “o interior de vocês” e “o exterior de vocês”. A repetição gráfica próxima de ⲡⲉⲧⲛ no OCR parece ser dittografia e não altera essa oração nominal.
    reason: textual_note
  - marker: c
    text: 'A expressão contém o empréstimo grego τύπος, que pode indicar padrão, modelo, marca, impressão ou forma. Mais literalmente: “é quem o fez um padrão”. O referente do pronome copta masculino singular não é totalmente claro neste recorte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ
  choice: Tomem posse de si mesmos
  rationale: O verbo ⲁⲙⲁϩⲧⲉ exprime agarrar, apoderar-se ou tomar posse; com o pronome plural, a construção é reflexiva. A formulação portuguesa conserva a força do imperativo sem sugerir mera aparição.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ
  choice: o interior de vocês
  rationale: ⲥⲁϩⲟⲩⲛ significa o lado de dentro ou interior. O possessivo plural é expresso de modo natural e inequívoco.
- source_word: ⲡⲉⲧⲛⲥⲁⲃⲟⲗ
  choice: o exterior de vocês
  rationale: ⲥⲁⲃⲟⲗ designa o lado de fora ou exterior, formando uma antítese deliberada com ⲥⲁϩⲟⲩⲛ.
- source_word: ⲡⲉⲧⲣⲡⲗⲁⲥⲥⲉ
  choice: aquele que molda
  rationale: O empréstimo de πλάσσω evoca formar ou modelar como um artesão; “molda” preserva essa imagem.
- source_word: ⲛⲧⲁϥⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  choice: é quem lhe deu forma
  rationale: A construção com τύπος pertence ao campo semântico de forma, impressão e modelo. “Deu forma” produz uma frase portuguesa inteligível, enquanto a nota registra as alternativas mais literais e a incerteza do referente pronominal.
theological_decisions:
- issue: Relação entre o interior e o exterior
  choice: é
  alternative: torna-se / corresponde a
  rationale: A oração nominal identifica paradoxalmente o interior com o exterior. A tradução mantém essa tensão sem explicar a afirmação em termos psicológicos, cosmológicos ou sacramentais.
- issue: Referente de ⲙⲙⲟϥ
  choice: lhe
  alternative: o / a ele
  rationale: O pronome copta é formalmente masculino singular, mas seu referente exato não é seguro no recorte transmitido. “Lhe” evita fixar em português se o referente é uma pessoa, o exterior ou algo mencionado no contexto mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros e internacionais. Conserva-se o paralelismo conciso, o paradoxo entre interior e exterior e a ambiguidade do pronome final; as notas tratam das variantes lexicais e da provável duplicação no OCR.
