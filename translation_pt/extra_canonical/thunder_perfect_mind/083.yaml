  yaml_path: translation/extra_canonical/thunder_perfect_mind/083.yaml
  text: 'I am the division and the stripping[a].

    I am the dwelling[c].

    And I am the robbery; I am

    the one who sees what comes

    down to me.

    I am the flight of the release[d][b][a][d][c][b].

    I am I.'
translation:
  language: pt
  text: '**8.** Eu sou a divisão e o despojamento[a].


    Eu sou a morada.


    E eu sou o roubo[b]; eu sou


    quem vê o que vem


    descer até mim[c].


    Eu sou a fuga da libertação[d].


    Eu sou eu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os dois termos são difíceis. Também se propôs entender o primeiro como “interior” e o segundo como “exterior”; aqui são lidos como “divisão” e “despojamento”.
    reason: lexical_alternative
  - marker: b
    text: O termo copta pode designar o ato de roubar ou aquilo que foi roubado; por isso, também seria possível traduzir “aquilo que foi roubado”.
    reason: lexical_alternative
  - marker: c
    text: Literalmente, “quem vê o que vem para baixo até mim”. A direção ou a origem do que vem não é especificada.
    reason: semantic_ambiguity
  - marker: d
    text: “Libertação” também pode significar “soltura”, “dispensa”, “perdão” ou “abandono”. A relação entre “fuga” e esse substantivo permanece ambígua.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Eu sou
  rationale: A construção copulativa saídica, repetida ao longo do trecho, pede a cadência enfática e natural de “Eu sou”.
- source_word: ⲡⲡⲱⲧⲣ
  choice: a divisão
  rationale: O substantivo é entendido aqui no sentido de separação ou divisão; a leitura espacial “interior” é possível em outras análises, mas não é imposta ao texto.
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: o despojamento
  rationale: A forma composta é tomada como ação de despir ou despojar, em paralelo tenso com “divisão”; “despojamento” conserva tanto o caráter concreto quanto a possível extensão abstrata.
- source_word: ⲧⲙⲟⲛⲏ
  choice: a morada
  rationale: Empréstimo do grego μονή, com o sentido de morada, habitação ou permanência; “morada” é conciso e preserva a imagem espacial.
- source_word: ⲡⲕⲱⲗ
  choice: o roubo
  rationale: O termo é relacionado ao verbo copta “roubar”, e não ao vocábulo anterior como se significasse “exterior”.
- source_word: ⲡⲉⲧⲛⲁⲩ
  choice: aquela que vê
  rationale: A forma relativa significa literalmente “a que vê”. O feminino acompanha a voz personificada do poema, sem alterar a forma copta semanticamente não marcada por gênero nesta expressão predicativa.
- source_word: ⲉⲧⲛⲏⲟⲩ
  choice: o que vem
  rationale: ⲛⲏⲟⲩ é analisado como qualitativo de ⲉⲓ, “vir”, não como “visível”.
- source_word: ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: descer até mim
  rationale: A expressão indica movimento para baixo em direção à falante; a formulação portuguesa explicita esse movimento sem acrescentar sua origem.
- source_word: ⲫⲱⲧ
  choice: a fuga
  rationale: Trata-se do vocábulo copta para fuga ou ato de fugir, não do empréstimo grego ⲫⲱⲥ, “luz”.
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: da libertação
  rationale: É lido como a preposição genitiva ⲙ- seguida do sintagma nominal “a libertação/soltura”, e não como uma forma verbal negativa.
theological_decisions:
- issue: Identidade da voz poética e gênero gramatical
  choice: “aquela que vê”
  alternative: “aquele que vê” ou “quem vê”
  rationale: A obra apresenta uma voz feminina personificada. O feminino preserva essa caracterização literária sem transformar o enunciado em afirmação doutrinária adicional.
- issue: Relação paradoxal entre fuga e libertação
  choice: “a fuga da libertação”
  alternative: “a fuga do abandono” ou “a fuga que liberta”
  rationale: O genitivo foi mantido sem decidir se a libertação é origem, objeto ou caracterização da fuga; assim se preservam a ambiguidade e a tensão do original.
translation_notes:
  register: Português moderno, solene e acessível, com repetição deliberada de “Eu sou” para conservar a cadência litânica. As linhas breves refletem o movimento poético do trecho. Evitaram-se leituras antigas baseadas em confundir ⲫⲱⲧ (“fuga”) com ⲫⲱⲥ (“luz”) e ⲛⲏⲟⲩ (“vem”) com “visível”.
