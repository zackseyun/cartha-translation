base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/117.yaml
  text: The one who will judge me at the end—judge him! You who are in many sins, and intemperances, and empty passions, and temporary pleasures!
translation:
  language: pt
  text: '**1.** Aquele que vai me julgar no fim[a] — julguem-no, vocês que vivem em muitos pecados, em desregramentos, em paixões vazias e em prazeres passageiros![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto do OCR está corrompido neste ponto. A tradução lê provavelmente ⲧⲉⲗⲟⲥ, “fim”; outra reconstrução possível é ⲛⲟⲙⲟⲥ, dando: “segundo a lei”.'
    reason: textual_alternative
  - marker: b
    text: As formas preservadas pelo OCR no fim da frase são incertas. “Paixões vazias” e “prazeres passageiros” refletem reconstruções prováveis; também já se propôs “paixões que aumentam” e uma expressão aditiva equivalente a “também”.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ⲕⲣⲓⲛⲉ
  choice: julgar / julguem
  rationale: O empréstimo do grego κρίνω tem sentido judicial ou avaliativo. A repetição mantém o efeito retórico da provável passagem do futuro para o imperativo.
- source_word: ϩⲁ ⲡⲓⲛⲉⲗⲟⲥ
  choice: no fim
  rationale: O OCR traz uma forma defeituosa, ⲛⲉⲗⲟⲥ. A leitura contextual ⲧⲉⲗⲟⲥ, do grego τέλος, permite o sentido temporal, mas a incerteza textual é explicitada em nota.
- source_word: ⲉⲛⲁϣⲱⲟⲩ
  choice: muitos
  rationale: A expressão quantifica os pecados e deve ser representada, em vez de omitida.
- source_word: ⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: desregramentos
  rationale: A formação indica falta de domínio ou controle. “Desregramentos” é natural em português e preserva o caráter plural do catálogo de vícios.
- source_word: ⲡⲁⲑⲟⲥ ⲉⲧϣⲟⲩⲉⲓⲧ (reconstrução provável do OCR ⲉⲧϣⲁⲉⲓⲏⲧ)
  choice: paixões vazias
  rationale: A correção provável do OCR dá o sentido de “vazias”, adequado ao catálogo ético e preferível à leitura incerta “que aumentam”.
- source_word: ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥⲕⲁⲓⲣⲟⲥ (reconstrução provável do fragmento ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥ ⲡⲉ)
  choice: prazeres passageiros
  rationale: O fragmento provavelmente preserva parte do adjetivo grego πρόσκαιρος, “temporário, passageiro”, que modifica “prazeres”.
theological_decisions:
- issue: 'Base do julgamento: fim ou lei'
  choice: no fim
  alternative: segundo a lei
  rationale: A forma do OCR não decide a questão com segurança. A leitura “fim” segue a reconstrução τέλος e preserva a tradição textual fornecida; “lei”, baseada numa possível reconstrução νόμος e no contexto anterior, permanece em nota para não ocultar a tensão textual.
- issue: Mudança retórica entre o juiz futuro e a ordem dirigida aos ouvintes
  choice: — julguem-no, vocês que vivem...
  alternative: julgará os que vivem...
  rationale: A redação mantém a provável mudança dramática para o imperativo, em vez de nivelar toda a frase como declaração futura. O plural português harmoniza naturalmente a ordem com o vocativo plural subsequente.
translation_notes:
  register: Português moderno, digno e acessível, com cadência de proclamação. “Desregramentos” evita o tecnicismo “intemperanças” sem perder a ideia de falta de domínio. A pontuação conserva a brusca força retórica da provável ordem no meio da frase.
