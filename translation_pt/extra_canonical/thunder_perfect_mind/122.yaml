  text: 'And do not make me known in another place or in another time. Do not make me known. Do not make me known in another place or in another time.

    For I am the one who has come to be, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance[f][e][d][c][b], and the one who will come to be.'
translation:
  language: pt
  text: '**6.** E não sejam ignorantes a meu respeito em outro lugar ou em outro tempo.[a] Não sejam ignorantes a meu respeito. Não sejam ignorantes a meu respeito em outro lugar ou em outro tempo.


    Pois eu sou quem veio a existir e quem virá a existir.[b]


    Eu sou a Clemência, e quem virá a existir.


    Eu sou a Clemência, e quem virá a existir.


    Eu sou a Clemência,[c] e quem virá a existir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “não estejam sem conhecimento de mim”. Também se pode traduzir: “não deixem de me conhecer”. Aqui, ⲟⲩⲟⲉⲓϣ significa “tempo” ou “ocasião”, não “multidão”.'
    reason: lexical_alternative
  - marker: b
    text: O verbo ϣⲱⲡⲉ também pode ser traduzido por “acontecer” ou “tornar-se”; “vir a existir” preserva sua amplitude neste contexto.
    reason: lexical_alternative
  - marker: c
    text: O termo ⲥⲩⲛⲅⲛⲱⲙⲏ também pode significar “indulgência”, “perdão”, “compreensão” ou “anuência”. A repetição tripla pode decorrer do OCR; o texto de consulta em inglês não corresponde a estas linhas coptas, e o alinhamento fornecido é de baixa confiança.
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: não sejam ignorantes a meu respeito
  rationale: ⲙⲡⲣ- introduz a proibição, enquanto ⲣ-ⲁⲧ-ⲥⲟⲟⲩⲛ significa literalmente ‘estar sem conhecimento, ser ignorante’. A construção com ⲙⲙⲟⲓ indica aquilo a respeito de que não se deve ser ignorante. Evita-se a leitura causativa ‘não me deem a conhecer’, que não corresponde à morfologia.
- source_word: ⲕⲉⲙⲁ
  choice: outro lugar
  rationale: Composto transparente de ⲕⲉ, ‘outro’, e ⲙⲁ, ‘lugar’.
- source_word: ⲕⲉⲟⲩⲟⲉⲓϣ
  choice: outro tempo
  rationale: ⲟⲩⲟⲉⲓϣ significa ‘tempo, ocasião, estação’; neste paralelismo com ‘lugar’, ‘tempo’ é a opção mais direta.
- source_word: ϣⲱⲡⲉ
  choice: vir a existir
  rationale: O verbo pode significar ‘acontecer, tornar-se, vir a existir’. Esta formulação preserva tanto o sentido de surgimento quanto a possível força ontológica da autodeclaração.
- source_word: ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: Clemência
  rationale: O empréstimo grego συγγνώμη abrange clemência, indulgência, perdão, compreensão e anuência. ‘Clemência’ conserva o sentido de tolerância ou perdão como qualidade personificada, sem reduzi-lo a mera cognição.
theological_decisions:
- issue: Identidade e gênero da voz que fala
  choice: quem veio a existir / quem virá a existir
  alternative: aquele ou aquela que veio/virá a existir
  rationale: A construção portuguesa com ‘quem’ evita impor gênero à identidade enigmática da voz e não transforma a forma copular copta em uma definição teológica mais específica.
- issue: Repetição de ‘Eu sou a Clemência’
  choice: preservar as três ocorrências do excerto
  alternative: reduzir a uma ocorrência como possível duplicação de OCR
  rationale: Embora a repetição possa refletir problema de OCR ou sobreposição textual, ela está presente três vezes no testemunho fornecido. Sem confirmação fac-similar suficiente, é mais prudente não apagá-la silenciosamente.
translation_notes:
  register: Português moderno, claro e solene, com formas plurais não marcadas por gênero. A sintaxe estranha das autodeclarações e a repetição foram mantidas por fidelidade ao excerto copta, em vez de serem harmonizadas. ‘Clemência’ recebe inicial maiúscula por funcionar como autodesignação personificada.
