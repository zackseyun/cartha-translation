base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/054.yaml
  text: 'I am she from whom you hide,[a]

    and you reveal me.

    But whenever you hide yourselves,[c][b]

    I myself will appear.'
translation:
  language: pt
  text: '**9.** Eu sou aquela de quem vocês se escondem,[a]

    e vocês me revelam.


    Mas, sempre que vocês se esconderem,[b]

    eu mesma aparecerei.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquela de quem vocês se ocultam”. O verbo ϩⲱⲡ significa “esconder”, não “dispersar”.'
    reason: lexical_alternative
  - marker: b
    text: O trecho copta aqui traz literalmente a ideia de “quando/se vocês esconderem a si mesmos”; “sempre que” expressa o valor temporal-condicional da construção.
    reason: source_syntax
  - marker: c
    text: 'Também se pode traduzir: “eu mesma me manifestarei”. O verbo pertence à mesma família lexical de “revelam” na oração anterior.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲱⲡ
  choice: esconder-se
  rationale: O verbo significa “esconder”. Na primeira oração, com ⲉⲣⲟⲉⲓ, exprime esconder-se da falante; na segunda, com o objeto reflexivo ⲙⲙⲱⲧⲛ, significa “esconder-se”. A tradução preserva a repetição que estrutura o paradoxo.
- source_word: ⲟⲩⲟⲛϩ
  choice: revelar
  rationale: Na construção transitiva ⲧⲉⲧⲛⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ, o sentido contextual é “vocês me revelam”, em contraste com “vocês se escondem de mim”.
- source_word: ⲟⲩⲟⲛϩⲧ
  choice: aparecer
  rationale: Nesta forma, a falante se torna manifesta; “eu mesma aparecerei” reproduz a ênfase de ⲁⲛⲟⲕ ϩⲱⲱⲧ e mantém em português natural a relação lexical com a revelação da oração anterior.
- source_word: ⲉⲧⲉⲧⲛϣⲁⲛ
  choice: sempre que vocês
  rationale: A construção condicional/temporal generalizante é bem representada por “sempre que”, sem restringi-la a uma única ocasião futura.
theological_decisions:
- issue: Identidade feminina da voz que fala
  choice: “aquela” e “eu mesma”
  alternative: Formulações sem marcação de gênero
  rationale: A forma copta ⲧⲁ é feminina, e a concordância feminina deve permanecer visível sem identificar a falante com uma figura teológica específica.
- issue: Relação entre revelar e aparecer
  choice: 'Manter agentes distintos: “vocês me revelam” / “eu mesma aparecerei”'
  alternative: Uniformizar ambas as orações como “manifestar”
  rationale: O texto cria tensão entre a ação dos interlocutores e a automanifestação enfática da falante; a tradução não resolve essa tensão em uma doutrina de revelação específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para a segunda pessoa do plural. A disposição em versos conserva o paralelismo e o paradoxo. O excerto OCR prossegue com palavras fragmentárias que provavelmente pertencem às linhas adjacentes; elas não foram incorporadas a este bloco de baixa confiança de alinhamento.
