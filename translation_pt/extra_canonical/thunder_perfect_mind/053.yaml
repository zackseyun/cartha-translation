  rationale: A revisão corrige a última oração, cujo objeto explícito é a falante, e restabelece o paralelismo das relativas femininas. Mantém-se «pensaram em mim», que não força o sentido hostil de «tramaram», e «de quem vocês se esconderam», que preserva a ambiguidade limitada da construção sem introduzir um objeto ausente. A nota sobre o fragmento inicial foi dispensada porque ele não integra o texto traduzido; a informação relevante sobre a continuação fragmentária foi mantida em nota na última oração.
