    rationale: 'O pronome ⲙⲙⲟⲉⲓ («me/mim») funciona como objeto do verbo: a oração diz que os interlocutores revelaram ou tornaram manifesta a falante, não que se manifestaram perante ela.'
  - severity: medium
    issue: A forma do rascunho omite a segunda relativa feminina antes de «vocês pensam em mim» e antes da última oração.
    rationale: O texto contém ⲧⲉ antes dessas orações, sustentando a repetição paralela «aquela em quem... / aquela que...». Explicitá-la é mais fiel e mais inteligível.
  - severity: low
