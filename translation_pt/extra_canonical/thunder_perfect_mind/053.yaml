  source_fidelity: 'O rascunho acerta «desprezaram» para ⲕⲁⲧⲁⲫⲣⲟⲛⲓ e, corretamente, não incorpora ⲛ̄ⲧⲟⲟⲧ, que parece encerrar a oração precedente. Contudo, «vocês se manifestam diante de mim» não corresponde à construção ⲧⲉⲧⲛⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ: ⲙⲙⲟⲉⲓ é objeto de «revelar/tornar manifesto», isto é, «vocês me revelaram». A tradução deve também conservar a construção relativa paralela marcada por ⲧⲉ.'
  naturalness: A versão revista mantém um paralelismo poético claro e natural em português moderno. A repetição de «aquela» torna explícita a estrutura copta e evita transformar as duas orações finais em simples coordenadas independentes.
  terminology: «Desprezaram», «pensaram em mim», «se esconderam de mim» e «me revelaram» refletem os sentidos visíveis sem importar a leitura inglesa de «seized/made alive». «Aquela» preserva a marca feminina predicativa da voz.
