base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/053.yaml
  text: 'I am she whom you have despised,

    and I am she upon whom you have deliberated.

    I am she whom you have seized,

    and I am she whom you have made alive.'
translation:
  language: pt
  text: '**8.** Eu sou aquela que vocês desprezaram,


    e aquela em quem vocês pensaram.


    Eu sou aquela de quem vocês se esconderam


    e aquela que vocês revelaram.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tornaram manifesta». O verbo significa revelar ou tornar manifesto, e «me» é seu objeto. Depois desta oração, o OCR conserva o início fragmentário da frase seguinte, que não é traduzido aqui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙ̄ⲙⲟⲉⲓ
  choice: vocês desprezaram
  rationale: O empréstimo do grego καταφρονέω significa desprezar ou tratar com desdém; não significa propriamente perseguir.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: vocês pensam em mim
  rationale: A construção indica dirigir o pensamento à falante. A formulação simples preserva a amplitude entre pensar, considerar e refletir, sem acrescentar a ideia hostil de tramar.
- source_word: ϩⲱⲡ ⲉⲣⲟⲉⲓ
  choice: de quem vocês se esconderam
  rationale: ϩⲱⲡ tem o sentido de esconder-se ou ocultar, e a construção com ⲉⲣⲟⲉⲓ favorece aqui ‘esconder-se de mim’. Isso evita a leitura ‘agarrar’, que não corresponde adequadamente ao verbo visível.
- source_word: ⲟⲩⲟⲛϩ ⲙ̄ⲙⲟⲉⲓ
  choice: vocês se manifestam diante de mim
  rationale: O verbo pertence ao campo de aparecer, revelar-se ou tornar-se manifesto. No paralelismo com ‘esconder-se de mim’, a leitura intransitiva ‘manifestar-se diante de mim’ é natural, embora a construção admita discussão.
- source_word: ⲧⲉ em ⲁⲛⲟⲕ ⲧⲉ
  choice: aquela
  rationale: 'O artigo predicativo feminino preserva em português a voz feminina da falante: ‘Eu sou aquela’.'
theological_decisions:
- issue: Identidade feminina da voz que fala
  choice: Preservar a marca feminina em ‘aquela’
  alternative: Neutralizar como ‘a pessoa’ ou usar apenas ‘sou eu’
  rationale: A forma copta é gramaticalmente feminina, e sua retenção pertence ao texto, não a uma interpretação denominacional.
- issue: Relação entre ocultação e manifestação
  choice: Manter o contraste sem explicar quem causa a manifestação
  alternative: Traduzir ‘vocês me revelam’ ou ‘vocês me dão vida’
  rationale: O contexto e o campo lexical favorecem o contraste esconder-se/manifestar-se; uma formulação reflexiva conserva melhor a tensão sem introduzir causalidade ou linguagem de vivificação.
translation_notes:
  register: Português moderno, claro e digno, com ‘vocês’ para a segunda pessoa do plural. O paralelismo poético foi mantido sem repetir ‘Eu sou aquela’ onde o copta passa diretamente a uma oração coordenada. ‘Manifestam-se’ conserva o registro elevado do texto sem soar arcaico.
