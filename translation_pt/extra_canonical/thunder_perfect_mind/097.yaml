lexical_decisions:
- source_word: ⲥⲱⲧⲙ (inferido)
  choice: Escutem
  rationale: O imperativo esperado na primeira oração é “ouvir/escutar”. “Escutem-me” expressa naturalmente em português a atenção solicitada e mantém o paralelismo com “aprendam”.
- source_word: ⲭⲣⲟⲉⲓ
  choice: mansidão
  rationale: “Mansidão” é um termo corrente e digno para a qualidade de ser manso ou brando, preservando o contraste direto com “aspereza”.
- source_word: ⲕⲁⲁⲥ
  choice: aprendam
  rationale: O verbo admite “aprender” ou “ser ensinado”; o imperativo ativo se ajusta à estrutura paralela das duas exortações.
- source_word: ⲉⲣⲟⲓ
  choice: de mim
  rationale: Com “aprender”, a construção portuguesa idiomática é “aprender de mim”, sem especificar além do que permite a relação indicada pela preposição copta.
- source_word: ⲧⲉⲣⲟⲟⲩ
  choice: aspereza
  rationale: “Aspereza” conserva o campo semântico de dureza, severidade ou rudeza e forma uma antítese clara e natural com “mansidão”.
