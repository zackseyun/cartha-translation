base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/018.yaml
  text: '[...] and the one who boasts brings these to me[a]. I am the silence that is incomprehensible, and the thought whose remembrance is great. I am the voice whose sound is manifold[f][e][d][c][b], and the word that is multiple.'
translation:
  language: pt
  text: '**13.** [...] e aquele que se vangloria traz estas coisas a mim.[a] Eu sou o silêncio que não se pode compreender e o pensamento cuja lembrança é grande. Eu sou a voz cujo som é múltiplo e a palavra que é múltipla.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho preservado começa no meio de uma frase; por isso, a tradução assinala a lacuna com reticências entre colchetes.
    reason: textual_note
  - marker: b
    text: “Múltiplo” procura conservar a repetição do copta, que descreve tanto o som quanto a palavra em termos de grande número ou multiplicidade.
    reason: lexical_note
lexical_decisions:
- source_word: ⲡⲉⲧϣⲟⲩⲟⲩϣⲟⲩ ⲙⲙⲟϥ
  choice: aquele que se vangloria
  rationale: A construção reflexiva com a forma intensiva é mais bem entendida aqui como vangloriar-se; evita a antiga leitura não sustentada de ‘aquele que grita’.
- source_word: ⲡⲕⲁⲣⲱϥ
  choice: o silêncio
  rationale: A forma corresponde à expressão copta ligada a ‘calar a boca/guardar silêncio’, não a ‘descendência’.
- source_word: ⲉⲧⲉⲙⲁⲩⲧⲁϩⲟϥ
  choice: que não se pode compreender
  rationale: O verbo ⲧⲁϩⲟ pode exprimir alcançar ou apreender; a formulação portuguesa conserva a ideia de algo inalcançável ao entendimento.
- source_word: ⲧⲉⲡⲓⲛⲟⲓⲁ
  choice: o pensamento
  rationale: Emenda-se a divisão do OCR para reconhecer o empréstimo grego ἐπίνοια, ‘pensamento, concepção’.
- source_word: ⲉⲧⲉⲛⲁϣⲉ ⲡⲉⲥⲣⲡⲙⲉⲉⲩⲉ
  choice: cuja lembrança é grande
  rationale: ⲛⲁϣⲉ indica grandeza ou abundância, e ⲣ-ⲡ-ⲙⲉⲉⲩⲉ se refere a lembrar/fazer memória.
- source_word: ⲧⲉⲥⲙⲏ
  choice: a voz
  rationale: ⲥⲙⲏ significa ‘voz’ ou ‘som’; ‘voz’ produz o paralelismo natural com o som que ela emite.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: a palavra
  rationale: O empréstimo grego λόγος é vertido sem maiúscula para não impor uma identificação teológica que o contexto imediato não exige.
theological_decisions:
- issue: Possível personificação teológica de λόγος
  choice: palavra, em minúscula
  alternative: Palavra ou Verbo, com maiúscula
  rationale: O texto apresenta uma série de autodeclarações paradoxais, mas não identifica explicitamente o λόγος com uma figura teológica específica; a minúscula preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo deliberado nas três declarações iniciadas por “Eu sou”. A repetição de “múltiplo/múltipla” foi mantida para refletir a forma do original, em vez de ser estilisticamente variada.
