  source_fidelity: A tradução acompanha a leitura corrigida do trecho copta, em especial «silêncio», «pensamento», «voz» e «palavra», e não repete as identificações lexicais descartadas no histórico. «Que não se pode compreender» transmite adequadamente o silêncio inalcançável/incompreensível; a sequência «cuja lembrança é grande» preserva a formulação paradoxal sem explicá-la em excesso. «Múltiplo/múltipla» mantém o paralelismo e a repetição finais.
  naturalness: O português é moderno, claro e mantém o registro solene e aforístico da fala em primeira pessoa. «Traz estas coisas a mim» é um pouco mais formal que «traz-me estas coisas», mas é plenamente natural e conserva ênfase no destinatário.
