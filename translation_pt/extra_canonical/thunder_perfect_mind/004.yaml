  rationale: O verbo significa “ouvir” ou “escutar”; sua presença no excerto OCR sustenta a nota sobre uma possível segmentação alternativa, mas não foi inserida no texto principal por causa do alinhamento incerto.
- source_word: ⲙⲁ
