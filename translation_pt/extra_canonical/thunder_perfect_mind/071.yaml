base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
translation:
  language: pt
  text: '**8.** Sou o decreto dos que me pedem,

    e a voz das vozes no lugar da divinização[a]

    dos anjos que eles enviaram por meio da Palavra[b],

    e dos deuses dos deuses, enviados por meio do conselho.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Divinização” traduz o empréstimo grego ⲑⲉⲱⲥⲓⲥ (theōsis), também vertido como “deificação”. A sintaxe desta passagem é difícil.
    reason: lexical_alternative
  - marker: b
    text: “Palavra” traduz ⲗⲟⲅⲟⲥ; também se poderia usar “Logos” ou, em sentido não personificado, “palavra/discurso”.
    reason: lexical_alternative
  - marker: c
    text: A relação sintática entre “anjos”, “deuses dos deuses” e “enviados” é incerta no trecho preservado. “Conselho” traduz ϣⲟϫⲛⲉ, que também pode significar “deliberação” ou “plano”.
    reason: textual_syntax_note
lexical_decisions:
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: o decreto
  rationale: O composto ⲟⲩⲁϩⲥⲁϩⲛⲉ significa “ordem”, “mandamento” ou “decreto”; não deve ser dividido em palavras que significariam “unidade” e “vestimenta”. “Decreto” conserva o caráter autoritativo do substantivo.
- source_word: ⲥⲙⲏ
  choice: voz
  rationale: É o sentido corrente do termo e preserva a repetição poética “voz das vozes”.
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: divinização
  rationale: O empréstimo grego θέωσις designa tornar-se divino ou deificação. “Divinização” mantém o termo abstrato sem o substituir interpretativamente por “lugar dos deuses”.
- source_word: ⲁⲅⲅⲉⲗⲟⲥ
  choice: anjos
  rationale: Neste contexto mítico-celestial, “anjos” é a tradução natural do empréstimo grego, embora “mensageiros” seja lexicalmente possível.
- source_word: ⲧⲁⲟⲩⲟ
  choice: enviaram
  rationale: O verbo pode significar “fazer sair”, “enviar” ou, em certos contextos, “proferir”. Com objeto plural referido aos anjos, “enviaram” oferece a construção mais coerente.
- source_word: ⲗⲟⲅⲟⲥ
  choice: Palavra
  rationale: “Palavra” preserva o sentido básico e a possível densidade técnica do empréstimo grego sem impor a transliteração “Logos” no corpo do texto.
- source_word: ⲛⲟⲩⲧⲉ ⲛ̄ⲛⲟⲩⲧⲉ
  choice: deuses dos deuses
  rationale: Mantém a forma plural e a construção genitiva incomum do copta, sem normalizá-la como singular nem resolver sua possível função superlativa.
- source_word: ϣⲟϫⲛⲉ
  choice: conselho
  rationale: O substantivo significa “conselho”, “deliberação” ou “plano”; traduzi-lo como “grito” confundiria este vocábulo com termos de clamor ou voz.
theological_decisions:
- issue: O sentido de ⲑⲉⲱⲥⲓⲥ
  choice: divinização
  alternative: divindade; lugar dos deuses
  rationale: A tradução conserva a linguagem de deificação presente no empréstimo grego, sem explicá-la segundo uma tradição teológica posterior.
- issue: Possível valor técnico de ⲗⲟⲅⲟⲥ
  choice: Palavra
  alternative: Logos; palavra; discurso
  rationale: A inicial maiúscula sinaliza a possível carga técnica no contexto, mas a nota mantém aberta a leitura não personificada.
- issue: Plural ⲛⲟⲩⲧⲉ ⲛ̄ⲛⲟⲩⲧⲉ
  choice: deuses dos deuses
  alternative: deuses entre os deuses; Deus dos deuses
  rationale: O plural morfológico foi preservado para não converter a expressão em uma afirmação monoteísta nem apagar sua estranheza.
translation_notes:
  register: Português moderno, digno e poético, com sintaxe acessível ao leitor brasileiro e compreensão internacional. A repetição “voz das vozes” e a expressão incomum “deuses dos deuses” foram mantidas para preservar a textura do original. As quebras de linha acompanham as unidades poéticas, não as quebras físicas do manuscrito.
