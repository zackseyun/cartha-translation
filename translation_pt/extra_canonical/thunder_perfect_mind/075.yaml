base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
translation:
  language: pt
  text: '**12.** Eu sou a honrada, aquela que eles abençoam e aquela que desprezam com desdém. Eu sou a Paz, e por minha causa há Guerra.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura possível: “e eu sou a Guerra”.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲏⲟⲩ
  choice: a honrada
  rationale: Lido como forma qualitativa de ⲧⲁⲉⲓⲟ, “honrar”; a construção identifica a locutora como aquela que é honrada. O feminino preserva a voz gramatical da personagem.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: aquela que eles abençoam
  rationale: ⲥⲙⲟⲩ significa “abençoar”, e ⲉⲣⲟⲥ retoma o referente feminino; a divisão de linhas do OCR ocultou a leitura contínua da expressão.
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: aquela que desprezam
  rationale: O empréstimo grego καταφρονεῖν significa “desprezar”, e ⲙⲙⲟⲥ marca o objeto feminino.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: com desdém
  rationale: A expressão indica a maneira ou atitude com que a locutora é desprezada; “com desdém” reproduz naturalmente o reforço antitético em português.
- source_word: ϯⲣⲏⲛⲏ
  choice: a Paz
  rationale: Empréstimo do grego εἰρήνη, “paz”; a inicial maiúscula conserva o caráter titular da autodeclaração.
- source_word: ⲛⲧⲁ ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: por minha causa há Guerra
  rationale: A leitura causal de ⲛⲧⲁ- mantém o paradoxo entre Paz e Guerra e corresponde à fórmula paralela atestada na obra; a forma transmitida, porém, permite discussão, registrada em nota.
theological_decisions:
- issue: Relação paradoxal entre Paz e Guerra
  choice: “por minha causa há Guerra”
  alternative: “e eu sou a Guerra”
  rationale: A tradução conserva a leitura causal mais provável sem apagar a alternativa que intensificaria a identificação paradoxal da locutora com ambos os polos.
translation_notes:
  register: Português atual, digno e de leitura ampla. O paralelismo “aquela que... aquela que...” e as maiúsculas em “Paz” e “Guerra” preservam o tom solene e paradoxal. A redação segue o copta do trecho, corrigindo a segmentação enganosa produzida pelas quebras de linha do OCR.
