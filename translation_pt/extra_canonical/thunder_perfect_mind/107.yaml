base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/107.yaml
  text: 'I am the hearing that is attainable to all[a];

    I am the speech that cannot be grasped;

    the name of the sound and the sound of the name;

    I am the sign of this[g][f][e][d][c][b], and the manifestation.'
translation:
  language: pt
  text: '**5.** Eu sou o ouvir que está ao alcance de todos[a];


    eu sou a fala que não se pode apreender;


    o nome do som e o som do nome[b];


    eu sou o sinal disto e a manifestação[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra copta ⲉⲧϣⲏⲡ também pode ser entendida como “grande”; aqui, a leitura “ao alcance” preserva o provável contraste com a fala que não se pode apreender.
    reason: lexical_alternative
  - marker: b
    text: O termo copta ⲥⲙⲏ pode significar “som”, “voz” ou “relato”. “Som” conserva o paralelismo abstrato com “nome”.
    reason: lexical_alternative
  - marker: c
    text: 'Ou: “a revelação”. A expressão copta designa aquilo que se torna manifesto ou é revelado.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: o ouvir
  rationale: Preserva a substantivação do ato de ouvir e o motivo auditivo do poema, sem introduzir o sentido moralizante de “obediência”.
- source_word: ⲉⲧϣⲏⲡ ⲛϩⲱⲃ ⲛⲓⲙ
  choice: que está ao alcance de todos
  rationale: Expressa em português corrente a leitura de acessibilidade e a universalidade da construção, mantendo o contraste paradoxal com a fala inapreensível.
- source_word: ⲡϣⲁϫⲉ
  choice: a fala
  rationale: Reflete uma enunciação ou discurso vivo e evita a possível carga teológica importada por “a Palavra”.
- source_word: ⲉⲧⲉ ⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ
  choice: que não se pode apreender
  rationale: 'Lê corretamente a sequência através da quebra de linha como uma oração relativa negativa: aquilo que não conseguem agarrar ou apreender. A construção impessoal preserva o sujeito humano não especificado.'
- source_word: ⲡⲣⲁⲛ
  choice: o nome
  rationale: Equivalente direto que conserva o paralelismo quiástico com “som”.
- source_word: ⲧⲥⲙⲏ
  choice: o som
  rationale: Mantém o campo auditivo abstrato e forma naturalmente o par “nome do som / som do nome”; “voz” também é possível.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ ⲙⲡⲁⲓ
  choice: o sinal disto
  rationale: Reconhece ⲥⲏⲙⲉⲓⲟⲛ como uma única palavra, apesar da quebra de linha, e conserva o demonstrativo genitivo ⲙⲡⲁⲓ.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: a manifestação
  rationale: Traduz o ato ou resultado de tornar manifesto, sem confundi-lo com “luz”; “revelação” é uma alternativa legítima.
