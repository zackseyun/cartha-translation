  source_fidelity: O texto traduz adequadamente as unidades coptas, inclusive através das quebras gráficas do OCR. «O ouvir que está ao alcance de todos» conserva a leitura adotada para ⲡⲥⲱⲧⲙ ⲉⲧϣⲏⲡ ⲛϩⲱⲃ ⲛⲓⲙ; «a fala que não se pode apreender» reproduz corretamente a oração relativa negativa ⲉⲧⲉ ⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ. A sequência «o nome do som e o som do nome» preserva o paralelismo, e «o sinal disto e a manifestação» reconhece corretamente ⲥⲏⲙⲉⲓⲟⲛ como uma só palavra e ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ como manifestação/revelação, não “luz”.
