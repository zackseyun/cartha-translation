translation:
  language: pt
  text: '**3.** Eu sou a prostituta e a santa[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲡⲟⲣⲛⲏ (pornē) designa uma mulher que vende serviços sexuais. “Prostituta” é o equivalente neutro; uma tradução depreciativa como “puta” ressaltaria o estigma e o choque do paradoxo.
    reason: lexical_alternative
  - marker: b
    text: 'ⲥⲉⲙⲛⲏ (semnē) significa literalmente “venerável” ou “augusta” e, neste contexto, pode ser entendida como “santa”. Alternativas: “a venerável”, “a augusta” ou “a sagrada”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: Eu sou
  rationale: A construção copulativa de identificação na primeira pessoa sustenta a sequência poética de autodeclarações e preserva sua forma enfática.
- source_word: ⲡⲟⲣⲛⲏ
  choice: prostituta
  rationale: O empréstimo grego designa uma mulher que vende serviços sexuais. “Prostituta” é claro e atual em português, sem acrescentar ao texto a agressividade específica de um insulto moderno.
- source_word: ⲥⲉⲙⲛⲏ
  choice: santa
  rationale: O adjetivo substantivado pode significar “venerável”, “augusta” ou “santa”. “A santa” conserva o paralelismo nominal com “a prostituta” e o contraste religioso deliberadamente chocante.
- source_word: ⲁⲩⲱ
  choice: e
  rationale: Conjunção coordenativa simples, reproduzida naturalmente por “e”.
theological_decisions:
- issue: Sentido de ⲥⲉⲙⲛⲏ e possível associação de “santa” a canonização
  choice: a santa
  alternative: a venerável; a augusta; a sagrada
  rationale: Aqui “santa” descreve a própria figura, sem afirmar canonização nem uma categoria eclesiástica posterior. A escolha mantém a tensão entre desonra social e santidade, enquanto a nota registra o campo semântico mais amplo.
translation_notes:
  register: Português moderno, claro e solene, com estrutura curta e paralela. O artigo em “a santa” substantiva o adjetivo e espelha “a prostituta”, preservando a colisão retórica do original.
