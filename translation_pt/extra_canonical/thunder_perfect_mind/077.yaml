base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/077.yaml
  text: 'I am the silence within a voice[a].

    I am peace, and because of me war came to be.

    And I am a foreigner and a citizen.

    I am the substance, and the one who has no substance[g][f][e][d][c][b]; those who exist outside my association are ignorant of me.'
translation:
  language: pt
  text: 'Eu sou o silêncio no interior de uma voz[a].


    Eu sou a paz, e por minha causa a guerra veio a existir.


    Eu sou estrangeira[b] e cidadã.


    Eu sou a essência[c] e aquela que não tem essência; os que existem fora da minha companhia[d] não me conhecem; e os que existem em minha …[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura “silêncio” pressupõe ⲥⲙⲙⲟⲥ; o OCR preserva apenas ⲙⲙⲟⲥ. “Voz” também pode ser traduzido por “som”.
    reason: Incerteza textual e alternativa lexical.
  - marker: b
    text: Ou “forasteira” ou “estranha”; a leitura do termo copta é incerta, mas seu contraste com “cidadã” favorece este sentido.
    reason: Alternativa lexical decorrente do estado do texto.
  - marker: c
    text: “Essência” traduz o empréstimo grego οὐσία (ousia), que também pode significar “substância” ou “ser”.
    reason: Preservação da amplitude filosófica do termo.
  - marker: d
    text: O empréstimo grego συνουσία (synousia) pode indicar companhia, convivência, associação ou união íntima.
    reason: Ambiguidade lexical e possível conotação relacional ou sexual.
  - marker: e
    text: O excerto copta fornecido continua com «e os que existem em minha...», mas é interrompido nesse ponto. A elipse assinala o limite do excerto; não se completa a frase com base em reconstrução externa.
    reason: Limite material do excerto-fonte.
lexical_decisions:
- source_word: '(ⲥ)ⲙⲙⲟⲥ (OCR: ⲙⲙⲟⲥ)'
  choice: silêncio
  rationale: A leitura com ⲥ inicial, provavelmente omitido no OCR, produz o paradoxo coerente entre silêncio e voz.
- source_word: ϣⲱⲥ
  choice: voz
  rationale: Equivalente natural que preserva o contraste poético com “silêncio”; “som” também seria possível.
- source_word: ϯⲣⲏⲛⲏ / ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: a paz / a guerra
  rationale: Os empréstimos gregos eirēnē e polemos formam uma antítese direta; os artigos são naturais em português.
- source_word: ϣⲱⲡⲉ ⲉⲧⲃⲏⲏⲧ
  choice: por minha causa ... veio a existir
  rationale: Mantém tanto o valor causal de ⲉⲧⲃⲏⲏⲧ quanto a nuance de surgimento de ϣⲱⲡⲉ.
- source_word: ⲟⲩϣⲙⲙⲱ / ⲟⲩⲣⲙⲛⲡⲟⲗⲓⲥ
  choice: estrangeira / cidadã
  rationale: Reproduz a oposição social entre quem é de fora e quem pertence à cidade, usando o feminino coerente com a voz do discurso.
- source_word: ⲟⲩⲥⲓⲁ
  choice: essência
  rationale: Conserva a densidade filosófica do empréstimo grego ousia; “substância” e “ser” continuam possíveis.
- source_word: ⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: companhia
  rationale: Oferece uma formulação portuguesa natural para associação ou convivência sem excluir inteiramente a possível conotação íntima do termo grego.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: não me conhecem
  rationale: Interpreta ⲁⲧ- como elemento privativo, expressando ignorância, e não como causativo de “tornar conhecido”.
theological_decisions:
- issue: Identidade paradoxal da voz como essência e como alguém sem essência
  choice: Manter literalmente os dois polos da afirmação
  alternative: Explicar “sem essência” como pobreza, inexistência ou ausência de bens
  rationale: O texto constrói deliberadamente uma tensão ontológica e não fornece base suficiente para restringi-la a uma interpretação doutrinária específica.
- issue: Gênero da voz que fala
  choice: 'Usar formas femininas: “estrangeira”, “cidadã” e “aquela”'
  alternative: Empregar masculinos genéricos ou reformular para evitar gênero
  rationale: As formas coptas do contexto identificam a voz em feminino, e a tradução portuguesa deve tornar visível essa característica gramatical e literária.
translation_notes:
  register: Português moderno, internacional e legível no Brasil, com cadência oracular simples. A repetição de “Eu sou” e as antíteses foram preservadas. Os artigos em “a paz” e “a guerra” soam naturais em português e refletem os artigos do copta. Evitaram-se explicações confessionais e a ambiguidade filosófica foi mantida.
