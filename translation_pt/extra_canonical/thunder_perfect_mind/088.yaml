lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Eu sou
  rationale: Preserva a predicação explícita em primeira pessoa. Embora ⲧⲉ marque gramaticalmente uma voz feminina, isso não precisa ser expresso à parte em português.
- source_word: ⲧⲁϣϭⲏⲗ
  choice: o autocontrole
  rationale: Expressa de modo atual e claro a ideia de domínio ou contenção de si e mantém o contraste direto com o termo oposto.
- source_word: ⲉⲕⲟⲗ
  choice: a falta de autocontrole
  rationale: Mantém a antítese lexical sem restringir o sentido à licenciosidade sexual, que seria uma interpretação mais estreita.
- source_word: ϩⲓϫⲙ
  choice: '[não traduzido neste trecho]'
  rationale: A preposição final, «sobre/por cima de», parece depender de um complemento na linha seguinte; traduzi-la isoladamente criaria uma frase incompleta ou uma precisão falsa.
