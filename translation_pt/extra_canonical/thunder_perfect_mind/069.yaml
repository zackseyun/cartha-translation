base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/069.yaml
  text: 'I am the mind[1],

    and my rest.

    I am the knowledge of my seeking for myself,

    and the seeking of those who seek me,

    and the command of those who ask of me[c][b][a][5][4][3][2],

    and the voice of the voices of the place of the gods.'
translation:
  language: pt
  text: 'Eu sou a mente[a]

    e o meu descanso.

    Eu sou o conhecimento da minha busca por mim,

    e a busca daqueles que me buscam,

    e a ordem daqueles que me fazem pedidos[b],

    e a voz das vozes do lugar dos deuses[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mente” também pode ser traduzido por “intelecto”; o termo copta translitera o grego νοῦς.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “a ordem dos que me pedem”. A relação entre a ordem e os que pedem permanece deliberadamente aberta.
    reason: ambiguity_note
  - marker: c
    text: “Dos deuses” pressupõe que a forma final abreviada ou truncada represente o plural copta; também se poderia ler “de Deus”, “do deus” ou “do divino”.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲛⲟⲩⲥ
  choice: mente
  rationale: O empréstimo grego νοῦς designa mente ou intelecto; “mente” é claro, natural e preserva a amplitude do termo.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: o meu descanso
  rationale: O artigo possessivo feminino da primeira pessoa ⲧⲁ- exige “meu”; ἀνάπαυσις pode indicar descanso, repouso ou cessação.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: o conhecimento
  rationale: O substantivo expressa conhecimento ou ato de conhecer; “conhecimento” conserva a construção paralela e o tom solene.
- source_word: ⲡⲁϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: minha busca por mim
  rationale: A leitura corrigida reconhece ϣⲓⲛⲉ, “buscar”, seguido da expressão preposicional “por/atrás de mim”, e não γένος, “espécie”.
- source_word: ⲡϣⲓⲛⲉ ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: a busca daqueles que me buscam
  rationale: A repetição de ϣⲓⲛⲉ foi mantida para reproduzir a cadência e o jogo verbal do copta.
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: a ordem
  rationale: O termo copta é o substantivo corrente para ordem, comando ou mandamento; “ordem” preserva a concisão e a tensão da afirmação.
- source_word: ⲛⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ
  choice: daqueles que me fazem pedidos
  rationale: O verbo de origem grega αἰτεῖν significa pedir ou solicitar; a formulação evita confundir esse ato com a “ordem” da oração principal.
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: a voz das vozes
  rationale: ⲥⲙⲏ significa “voz”, não “nome”; a repetição literal conserva a expressão enfática.
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  choice: do lugar dos deuses
  rationale: A leitura contextual entende ⲛⲑⲉⲱ como forma truncada de ⲛⲑⲉⲱⲛ, “dos deuses”; a nota registra a incerteza textual.
theological_decisions:
- issue: Identidade da voz que fala como “mente”
  choice: Manter a declaração direta “Eu sou a mente” sem explicação ontológica.
  alternative: Interpretar “mente” como título de uma entidade divina específica ou como mera faculdade humana.
  rationale: O texto formula uma autoidentificação deliberadamente densa; explicitá-la segundo um sistema teológico resolveria indevidamente sua ambiguidade.
- issue: “A ordem” pertencente aos que fazem pedidos
  choice: 'Preservar o genitivo paradoxal: “a ordem daqueles que me fazem pedidos”.'
  alternative: Reformular como “a resposta” ou “o que ordeno aos que me pedem”.
  rationale: Essas alternativas tornariam a relação lógica mais fácil, mas não são exigidas pelo copta e eliminariam a tensão do original.
- issue: Singular ou plural em “deus/deuses”
  choice: Usar “deuses” no texto e assinalar a reconstrução em nota.
  alternative: “Deus”, “o deus” ou “o divino”.
  rationale: A provável restauração plural se ajusta ao vestígio textual e à leitura revisada, mas a forma transmitida está truncada e não permite ocultar a incerteza.
translation_notes:
  register: Português moderno, internacional e legível no Brasil, com paralelismo solene e frases simples. Conservam-se as repetições de “busca/buscam” e “voz/vozes”, bem como as relações genitivas incomuns, sem impor uma interpretação denominacional.
