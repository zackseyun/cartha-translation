translation:
  language: pt
  text: '**1.** Ouçam-me, vocês que ouvem;[a] e aprendam minhas palavras, vocês que me conhecem.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O recorte de OCR e seu alinhamento são incertos. A tradição textual subjacente a esta linha permite “Ouçam-me, vocês que ouvem”. No recorte fornecido, porém, aparece ⲧⲟⲛ, “obedecer/estar sujeito”, e ⲛ̄ϭⲟⲙ pode ser lido literalmente como “fortes/poderosos” ou ser um erro de OCR. Assim, também se propõe: “Obedeçam-me, vocês que obedecem”.'
    reason: textual_and_lexical_uncertainty
  - marker: b
    text: O fim do recorte OCR parece trazer “palavras e nomes” (… ϣⲁϫⲉ ⲙⲛ̄ ⲛⲉⲥⲙⲏ), mas não é seguro que “nomes” pertença a esta mesma frase. Por isso, a tradução principal se limita a “aprendam minhas palavras”.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲱⲧⲙ (reconstruído pela tradição textual; não aparece com clareza no recorte OCR)
  choice: escutem / escutam
  rationale: Preserva o paralelismo enfático do texto (“escutem-me, vocês que escutam”) e o motivo da audição. “Escutar” expressa aqui atenção receptiva sem transformar implicitamente o verbo em “obedecer”.
- source_word: ⲧⲟⲛ
  choice: obedecer (registrado em nota como leitura possível do recorte)
  rationale: No OCR fornecido, ⲧⲟⲛ pode ter o sentido de “obedecer” ou “estar sujeito”. Como o alinhamento do recorte é de baixa confiança e a forma esperada relacionada a “ouvir” não está nítida, a incerteza deve ser explicitada, não incorporada silenciosamente ao texto principal.
- source_word: ϣⲁϫⲉ
  choice: palavras
  rationale: “Palavras” é natural com “aprender” e mantém o foco no conteúdo do ensinamento, em paralelo com “vocês que me conhecem”.
- source_word: ⲥⲙⲏ (em ⲛⲉⲥⲙⲏ)
  choice: nomes (somente na nota)
  rationale: O final do OCR parece conter “palavras e nomes”, mas a segmentação das linhas é insegura; por isso, “nomes” não é incluído no corpo do versículo.
theological_decisions:
- issue: Relação entre ouvir e obedecer
  choice: Manter no texto principal o motivo de escutar, com a alternativa “obedeçam-me” em nota
  alternative: “Obedeçam-me, vocês que obedecem” ou, se ⲛ̄ϭⲟⲙ for literal, “vocês, os fortes”
  rationale: “Ouvir” e “obedecer” podem se aproximar semanticamente, mas não são equivalentes. A tradução evita impor a obediência como interpretação teológica quando a tradição textual consultada sustenta o paralelismo de audição, ao mesmo tempo que registra a leitura do OCR.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural tanto no Brasil quanto em outros contextos lusófonos. Emprega-se “vocês” para tornar explícito o plural do chamado e “escutar” para realçar a atenção receptiva. A repetição “Escutem-me, vocês que escutam” é deliberada e conserva o paralelismo retórico do original reconstruído.
