    reason: textual_alignment
  revision_rationale: Substitui-se somente o pronome sem antecedente por «da letra», conforme o elemento lexical atestado na trilha de auditoria e exigido pela sintaxe portuguesa. Mantêm-se a formulação cautelosa para αἵρεσις, a elipse e a nota de incerteza do trecho final, pois o alinhamento do OCR é declarado baixo e não permite reconstrução segura.
