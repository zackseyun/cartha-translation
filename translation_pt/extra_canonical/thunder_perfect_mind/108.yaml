    issue: «o sinal desta»
    rationale: «Desta» não possui referente expresso e não representa adequadamente a construção que a trilha de auditoria identifica como «the sign of the letter». A omissão de «letra» prejudica tanto a fidelidade quanto a inteligibilidade.
