  terminology: “Voz”, “sinal”, “manifestação” e “divisão” são escolhas adequadas. “Divisão” mantém para αἵρεσις/ⲁϩⲉⲣⲉⲥⲓⲥ um sentido não confessionalmente carregado; a nota registra alternativas legítimas.
