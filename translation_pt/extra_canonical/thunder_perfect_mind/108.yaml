translation:
  language: pt
  text: '**6.** o nome da voz e a voz do nome. Eu sou o sinal desta e a manifestação da divisão[a]. E eu [...][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a manifestação da escolha” ou “da heresia”. O termo copta transcreve o grego *hairesis*, que pode significar escolha, partido, divisão ou heresia.
    reason: lexical_ambiguity
  - marker: b
    text: O texto torna-se incerto neste ponto. O fim do trecho de OCR talvez contenha uma forma relacionada a “escutar”, possivelmente “Escutem!”, mas o alinhamento entre páginas não permite incluí-la com segurança no texto principal.
    reason: textual_alignment
lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  choice: o nome
  rationale: O substantivo copta significa “nome” e integra o paralelismo invertido “nome da voz / voz do nome” claramente preservado no trecho.
- source_word: ⲧⲥⲙⲏ
  choice: a voz
  rationale: Neste contexto, ⲥⲙⲏ corresponde a “voz”, não a “interior”; a repetição cria uma construção quiástica com ⲡⲣⲁⲛ.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  choice: o sinal
  rationale: O OCR separa o empréstimo grego entre linhas, mas a leitura natural é σημεῖον, “sinal”.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: a manifestação
  rationale: A expressão copta designa aparecimento, revelação ou manifestação; “manifestação” preserva o substantivo abstrato e o tom solene.
- source_word: ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: da divisão
  rationale: O empréstimo grego αἵρεσις pode indicar escolha, partido, divisão ou heresia. “Divisão” evita impor o sentido doutrinário posterior de “heresia” e mantém a ambiguidade conceitual.
- source_word: ⲁⲕⲣⲟⲁⲧ
  choice: não representado no texto principal
  rationale: Pode refletir um empréstimo grego relacionado a ouvir, talvez um imperativo como “Escutem!”, mas sua posição no segmento é insegura por causa do OCR e do mapeamento na borda da página.
theological_decisions:
- issue: Sentido de ⲁϩⲉⲣⲉⲥⲓⲥ
  choice: divisão
  alternative: heresia
  rationale: “Heresia” poderia introduzir uma categoria doutrinária posterior e mais estreita. “Divisão” expressa um sentido possível do termo grego sem eliminar sua tensão semântica.
translation_notes:
  register: Português atual, claro e solene, com preservação do paralelismo poético “nome da voz / voz do nome”. A elipse assinala a lacuna ou corrupção textual sem reconstrução especulativa.
