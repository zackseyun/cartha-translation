base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/014.yaml
  text: 'I am the daughter and the woman[a].

    I am the mother of my father

    and the daughter of my husband[d][c][b],

    and he is my offspring.'
translation:
  language: pt
  text: 'Eu sou a filha e a mulher[a].


    Eu sou a mãe de meu pai


    e a filha de meu marido[b],


    e ele é meu descendente[c].[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O copta ⲥϩⲓⲙⲉ também pode significar “esposa”; adotou-se “mulher” para conservar o sentido mais amplo e o contraste marcante com “filha”.
    reason: lexical_alternative
  - marker: b
    text: Algumas edições ou leituras trazem aqui “irmã de meu marido”, em vez de “filha de meu marido”. O OCR fornecido lê ⲧⲥⲱⲛⲉ, “filha”, mas pode haver confusão entre formas de letras.
    reason: textual_variant
  - marker: c
    text: '“Ele é meu descendente” acompanha a leitura tradicional desta passagem e é compatível com o OCR ⲡⲁϫⲡⲟ. Se a palavra danificada fosse ⲡⲁϫⲟⲉⲓⲥ, a frase seria: “ele é meu senhor”.'
    reason: alternative_reading
  - marker: d
    text: 'A meia-linha seguinte, incompleta, começa: “Eu sou a humilhação de meu...” (ⲁⲛⲟⲕ ⲧⲉ ⲧϩⲙϩⲁⲗ ⲛⲧⲉ ⲡⲁ—). Ela não foi traduzida no corpo do texto para evitar uma conclusão conjectural.'
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲱⲛⲉ
  choice: filha
  rationale: Em contexto de parentesco, o sentido saídico normal é “filha”; a escolha preserva o paradoxo genealógico central.
- source_word: ⲥϩⲓⲙⲉ
  choice: mulher
  rationale: O termo pode designar “mulher” ou, conforme o contexto, “esposa”. “Mulher” conserva a amplitude semântica e o contraste direto com “filha”.
- source_word: ⲙⲁⲁⲩ
  choice: mãe
  rationale: Termo básico e inequívoco de parentesco, necessário para preservar a formulação paradoxal “mãe de meu pai”.
- source_word: ⲉⲓⲱⲧ
  choice: pai
  rationale: Equivalente comum do termo de parentesco e leitura natural em “meu pai”.
- source_word: ϩⲁⲓ (ⲡⲁϩⲁⲓ)
  choice: marido
  rationale: ⲡϩⲁⲓ é a designação costumeira de “marido”; a divisão de linha sustenta a leitura ⲙⲡⲁϩⲁⲓ, “de meu marido”.
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: ele é meu descendente
  rationale: “Descendente” expressa o vínculo genealógico sem limitar sexo ou geração e completa o paradoxo. A leitura é incerta devido ao estado textual e ao OCR.
- source_word: ϩⲙϩⲁⲗ
  choice: humilhação (não incluído no texto principal)
  rationale: O termo pode indicar humilhação, vergonha, humildade ou fraqueza, mas a construção seguinte está truncada; por isso, a meia-linha não é completada por conjectura.
theological_decisions:
- issue: Paradoxos de parentesco da voz poética
  choice: Manter literalmente “mãe de meu pai”, “filha de meu marido” e “meu descendente”
  alternative: Explicar ou harmonizar as relações familiares
  rationale: A tensão é deliberada na composição e não deve ser resolvida por uma interpretação teológica importada.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo preservado. Preferiu-se “descendente” a “prole” por ser mais corrente e igualmente adequado ao paradoxo genealógico. Os marcadores foram dispostos junto às afirmações pertinentes, em ordem alfabética.
