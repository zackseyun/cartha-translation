translation:
  language: pt
  text: '**1.** Pois ela é sábia e é uma pequena[a];



    nem afaste da pequenez as coisas grandes, em partes —



    pois conhecem[c] a pequenez.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “uma pequena”. Também se poderia entender “uma pessoa pequena” ou, por interpretação, “uma simples”; “tola” e “ignorante” acentuariam o contraste, mas iriam além do sentido mais direto.
    reason: lexical_alternative
  - marker: b
    text: “Pequenez” mantém a repetição da raiz de “pequena”. “Insignificância” é possível em sentido contextual, enquanto “ignorância” é uma interpretação menos literal.
    reason: lexical_alternative
  - marker: c
    text: A forma ⲥⲟⲩⲱⲛ foi entendida como “conhecem”. Se a leitura manuscrita representar outro verbo, a oração poderá exigir revisão; além disso, o sujeito plural não é identificado neste pequeno trecho.
    reason: textual_and_referential_ambiguity
lexical_decisions:
- source_word: ⲥⲥⲁⲃⲉ(ⲕ)
  choice: ela é sábia
  rationale: O prefixo feminino singular ⲥ- favorece uma afirmação na terceira pessoa, não um imperativo. O aparente ⲕ final pode refletir OCR ou dificuldade textual; não foi transformado silenciosamente em objeto pronominal.
- source_word: ⲟⲩⲕⲟⲩⲉⲓ ⲧⲉ
  choice: é uma pequena
  rationale: A cópula feminina ⲧⲉ confirma a terceira pessoa feminina. A tradução conserva o sentido básico de ⲕⲟⲩⲉⲓ, “pequeno”, e o paradoxo com “sábia”, sem substituí-lo interpretativamente por “tola” ou “ignorante”.
- source_word: ⲟⲩⲧⲉ ⲙⲡⲣⲧⲥⲧⲟ
  choice: nem afaste
  rationale: ⲙⲡⲣ- expressa proibição; em conjunto com ⲉⲃⲟⲗ ϩⲛ, o verbo tem aqui o sentido de afastar ou separar de algo.
- source_word: ϩⲉⲛⲙⲛⲧⲛⲟϭ
  choice: as coisas grandes
  rationale: Embora ⲙⲛⲧ- frequentemente forme abstratos, o artigo plural indefinido ϩⲉⲛ favorece “coisas grandes”; “grandezas” continua possível.
- source_word: ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ
  choice: em partes
  rationale: ⲙⲉⲣⲟⲥ, empréstimo do grego μέρος, significa “parte” ou “porção”. A formulação preserva a relação sintática algo aberta com o ato de afastar.
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: da pequenez
  rationale: ⲉⲃⲟⲗ ϩⲛ marca afastamento “de”, e ⲙⲛⲧⲕⲟⲩⲉⲓ é mantido literalmente como o abstrato “pequenez”, em contraste com as coisas grandes.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: pois conhecem
  rationale: A construção foi entendida como aorística/habitual, não como limitativa (“até que”). ⲥⲟⲩⲱⲛ é tomado como variante gráfica ou leitura OCR de ⲥⲟⲟⲩⲛ, “conhecer”.
- source_word: ⲅⲁⲣ
  choice: pois
  rationale: A partícula grega emprestada introduz a explicação final.
theological_decisions:
- issue: Paradoxo entre sabedoria e pequenez
  choice: Conservar “sábia” e “uma pequena”
  alternative: “sábia” e “tola/ignorante”
  rationale: O texto constrói uma tensão de identidade. Traduzir ⲕⲟⲩⲉⲓ como “tola” resolveria o paradoxo por interpretação e romperia a repetição com ⲙⲛⲧⲕⲟⲩⲉⲓ, “pequenez”.
translation_notes:
  register: Português moderno, digno e legível, com estrutura poética em linhas. Empregou-se “uma pequena”, apesar de sua leve estranheza em português, para preservar a forma nominal feminina e o paradoxo do copta. “As coisas grandes” evita a abstração excessiva de “grandezas” e acompanha o plural do texto.
