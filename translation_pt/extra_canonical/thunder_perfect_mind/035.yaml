    issue: Omissão de «para com vocês» / elemento relacional após «meu domínio próprio».
    rationale: O copta contém ⲛ̄ⲧⲉⲧⲛ̄, e o trilho inglês o registra como construção ambígua, traduzida preferencialmente «toward you». A tradução deve representá-lo, com nota que preserve as alternativas.
  - severity: medium
    issue: «Fraqueza» para ⲙⲛ̄ⲧϭⲱⲃ.
    rationale: O apoio lexical e o trilho inglês indicam «pobreza» como sentido principal; «fraqueza» desloca o campo semântico e a nota atual o apresenta indevidamente como leitura principal.
  - severity: low
    issue: «Meu desvio» é menos imediato que «minha falta».
    rationale: Embora «desvio» possa refletir uma extensão metafórica, «falta» corresponde melhor à leitura corrigida e mantém a ambiguidade ética sem sugerir uma trajetória física.
