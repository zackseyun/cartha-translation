base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
translation:
  language: pt
  text: '**13.** Não desprezem minha pequenez;


    e meu domínio próprio para com vocês — amem-no em minha pobreza[a].


    Não riam demais de mim;


    não desprezem minha falta[b],


    nem amaldiçoem minha jactância[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta ligada a «vocês» também pode ser entendida como «de vocês» ou «sobre vocês»; «para com vocês» explicita uma relação sem resolver a ambiguidade.
    reason: alignment_note
  - marker: b
    text: 'Ou: «meu erro» ou «meu desvio».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou: «minha vanglória», «minha ostentação» ou «meu gloriar-se».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲙⲉⲥⲧⲉ
  choice: não desprezem
  rationale: O imperativo negativo com ⲙ̄ⲡⲣ̄ e ⲙⲉⲥⲧⲉ expressa rejeição ou desdém; “desprezar” se ajusta ao tom de apelo e evita a intensidade excessiva de “odiar”.
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: minha pequenez
  rationale: O substantivo abstrato indica condição de pouca importância ou baixeza. “Pequenez” conserva essa amplitude sem transformar necessariamente a condição em virtude moral, como faria “humildade”.
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: meu domínio próprio
  rationale: O empréstimo grego ἐγκράτεια denota autocontrole ou continência. “Domínio próprio” é claro, digno e mantém o sentido ético.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: amem
  rationale: A sequência é entendida como forma verbal de segunda pessoa do plural seguida do objeto pronominal feminino, que retoma ⲉⲅⲕⲣⲁⲧⲉⲓⲁ. Em português, o objeto nominal é repetido naturalmente na mesma oração.
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: minha fraqueza
  rationale: O abstrato formado sobre ϭⲱⲃ aponta primariamente para fraqueza, embora possa incluir pobreza, carência ou impotência.
- source_word: ⲕⲱ ⲧⲏⲛⲉ ⲉⲣⲟⲉⲓ
  choice: riam demais de mim
  rationale: ⲧⲏⲛⲉ intensifica a ação; “demais” preserva a força escalar em português corrente sem acrescentar uma imagem ausente do texto.
- source_word: ⲛ̄ⲧⲁⲣⲓⲕⲉ
  choice: meu desvio
  rationale: ⲣⲓⲕⲉ envolve voltar-se, inclinar-se ou desviar-se e, por extensão, erro ou falta. “Desvio” preserva melhor o campo metafórico e a ambiguidade.
- source_word: ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: minha jactância
  rationale: ϣⲟⲩϣⲟⲩ pode indicar gloriar-se, vanglória ou ostentação. “Jactância” mantém o sentido de exaltação verbal sem converter o termo simplesmente em “violência” ou “matança”.
theological_decisions:
- issue: Tensão paradoxal entre domínio próprio e fraqueza
  choice: manter “meu domínio próprio em minha fraqueza” sem explicação harmonizadora
  alternative: interpretar a fraqueza como pobreza material ou tornar a frase causal
  rationale: A justaposição é característica do discurso paradoxal da obra; o copta não exige que a tensão seja resolvida.
- issue: Valor moral de “desvio” e “jactância”
  choice: preservar os termos negativos na voz da oradora
  alternative: atenuá-los para “inclinação” e “glória”
  rationale: O texto pede que nem mesmo esses aspectos sejam desprezados ou amaldiçoados. Suavizá-los eliminaria parte da provocação teológica e retórica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Mantém-se a segunda pessoa do plural por meio de formas verbais sem pronome explícito. O paralelismo foi disposto em linhas curtas, com vocabulário digno, mas não arcaizante.
