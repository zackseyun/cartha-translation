  naturalness: A dicção é em geral clara e poética. «Amem meu domínio próprio» é possível, mas «amem-no» após a expressão anteposta deixa mais nítida a relação com o referente feminino copta sem tornar o português pesado. «Pobreza» é mais direto e natural que «fraqueza» neste contexto lexical.
  terminology: «Pequenez», «domínio próprio», «falta» e «jactância» preservam o registro paradoxal e não impõem interpretação doutrinária. A nota deve tratar da ambiguidade sintática de ⲛ̄ⲧⲉⲧⲛ̄, e não atribuir sentidos não primários a «pobreza».
  issues:
