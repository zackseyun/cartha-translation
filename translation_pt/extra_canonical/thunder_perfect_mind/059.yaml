translation:
  language: pt
  text: '**14.** Eu sou aquela que não foi instruída[b][a],


    e vocês aprenderão de mim.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho de OCR também contém ⲟⲩϣⲓⲡⲉ / ⲙⲛⲧⲁⲧϣⲓⲡⲉ (“conhecimento/ignorância”) e ⲙⲛⲧϭⲁ (“pequenez”), termos que provavelmente pertencem a uma linha adjacente. Como a confiança do alinhamento é média, eles não foram incorporados a este dístico.
    reason: alignment_note
  - marker: b
    text: “Aquela que não foi instruída” também pode ser traduzido como “a não instruída”, “a não ensinada” ou “a inculta”. A opção adotada evita conotações modernas de escolaridade formal e preserva o paradoxo.
    reason: lexical_alternative
  - marker: c
    text: A forma copta pode ter valor futuro ou intencional. “Vocês aprenderão de mim” preserva esse valor; o presente também seria possível numa leitura sentenciosa.
    reason: grammatical_alternative
lexical_decisions:
- source_word: ⲉⲧϩⲁⲉⲓⲏⲟⲩ
  choice: aquela que não recebeu instrução
  rationale: A construção relativa descreve a voz que fala como alguém não instruído ou não ensinado. A formulação evita reduzir o sentido à escolaridade formal moderna, mantém o paradoxo e, em português, concorda com a voz feminina que se apresenta ao longo da obra.
- source_word: ⲛⲧⲉⲧⲛⲧⲱⲡ
  choice: vocês aprendem
  rationale: O prefixo indica a segunda pessoa do plural e pode ter valor futuro ou intencional; no contexto sentencioso, o presente português expressa com naturalidade a afirmação paradoxal, sem perder o sujeito plural.
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: de mim
  rationale: Com o verbo de aprender, a locução introduz a origem do aprendizado. “De mim” é a forma idiomática e clara em português.
theological_decisions:
- issue: Gênero da voz que fala
  choice: aquela que não recebeu instrução
  alternative: quem não recebeu instrução
  rationale: A obra apresenta deliberadamente uma voz feminina, e a forma feminina conserva esse aspecto literário sem acrescentar uma identificação teológica à personagem.
translation_notes:
  register: Português atual, claro e digno, com “vocês” para a segunda pessoa do plural. A ordem concisa conserva a forma paradoxal do enunciado; “não recebeu instrução” evita o tom depreciativo que “inculta” poderia assumir.
