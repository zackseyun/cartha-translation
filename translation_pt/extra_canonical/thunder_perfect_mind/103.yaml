translation:
  language: pt
  text: '**1.** Pois o que está dentro de vocês é o que está fora de vocês; e aquele que molda vocês por fora deu forma ao que está dentro de vocês. E aquilo que vocês veem fora de vocês…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O excerto copta fornecido começa e termina no meio de uma unidade textual. Ele fala do que está “dentro” e “fora” de vocês e não traz, nesta seção visível, as afirmações “Eu sou a Justiça” e “eu sou a defensora”. A frase final permanece incompleta porque o restante não consta do recorte.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲁϩⲟⲩⲛ
  choice: dentro / o que está dentro
  rationale: O termo indica o interior ou o lado de dentro. A formulação substantivada em português preserva o contraste repetido com ⲥⲁⲃⲟⲗ.
- source_word: ⲥⲁⲃⲟⲗ
  choice: fora / por fora
  rationale: Neste trecho, o termo integra a oposição espacial entre interior e exterior; por isso, não deve ser entendido como “justiça”, sentido que não é sustentado por este contexto.
- source_word: ⲣⲡⲗⲁⲥⲥⲉ (πλάσσειν)
  choice: moldar
  rationale: O empréstimo grego expressa formar ou modelar. “Moldar” mantém a imagem concreta e funciona naturalmente com a pessoa como objeto.
- source_word: ⲣⲧⲩⲡⲟⲥ (τύπος)
  choice: dar forma
  rationale: A construção baseada em τύπος pode indicar fazer segundo um molde, configurar ou imprimir uma forma. “Deu forma” comunica a ação sem impor uma interpretação técnica de “tipo” ou “arquétipo”.
theological_decisions:
- issue: Divergência entre o excerto copta e a consulta inglesa
  choice: Traduzir a oposição entre o interior e o exterior atestada no copta
  alternative: “Eu sou a Justiça; eu sou a defensora.”
  rationale: O excerto fornecido contém vocabulário de interior/exterior, moldar e forma, mas não contém uma declaração “Eu sou” nem um termo identificável para “defensora”. A prioridade dada à evidência na língua-fonte impede a importação da leitura jurídica proposta pela camada de consulta.
- issue: Relação entre quem molda e o interior
  choice: Manter a ação de dar forma ao interior sem identificar metafisicamente o agente
  alternative: Explicitar o agente como criador divino, demiurgo ou outra figura
  rationale: O texto fala apenas de “aquele que molda”; nomear ou caracterizar esse agente acrescentaria uma conclusão teológica não expressa no excerto.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural copta. A repetição de “dentro” e “fora” foi mantida por ser estrutural ao contraste do original. As reticências assinalam uma interrupção material do excerto, não uma hesitação estilística.
