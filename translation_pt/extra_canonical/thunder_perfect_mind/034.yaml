base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/034.yaml
  text: And do not cast me out among those who are lacking in worthlessness[a]; for I—I am merciful, and I am hard‑hearted. Do not hate my obedience; and my self-control[h][g][f][e][d][c][b], love it in my weakness.
translation:
  language: pt
  text: '**12.** E não me expulsem para o meio dos que carecem de inutilidade[a], pois eu — eu sou misericordiosa e sou dura de coração[b]. Não odeiem a minha obediência[c]; e, quanto ao meu domínio próprio, amem-no em minha fraqueza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta é deliberadamente difícil e pode ser traduzida de modo literal como “os que têm falta de inutilidade” ou “os que carecem de ausência de valor”. Não há neste trecho palavra para “monturo”.
    reason: lexical_alternative
  - marker: b
    text: Literalmente, “sem coração”; também se pode traduzir por “insensível” ou “sem compaixão”. A formulação escolhida preserva o contraste com “misericordiosa”.
    reason: lexical_alternative
  - marker: c
    text: Também se pode entender “minha disposição de ouvir”. O substantivo deriva do verbo “ouvir”, que também assume o sentido de “obedecer”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: não me expulsem
  rationale: A construção proibitiva com ⲙ̄ⲡⲣ̄ e o verbo composto expressa lançar para fora ou expulsar. O objeto, implícito no recorte, é explicitado pelo contexto da fala em primeira pessoa.
- source_word: ⲛⲉⲧ ϣⲁⲁⲧ ϩⲛ̄ ⲟⲩⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: os que carecem de inutilidade
  rationale: 'Traduz diretamente a formulação paradoxal: ϣⲁⲁⲧ indica falta ou carência, e o substantivo derivado do grego remete a inutilidade ou ausência de valor. Não se introduz a imagem de um monturo, ausente neste trecho.'
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: misericordiosa
  rationale: A expressão descreve alguém de coração brando ou compassivo; “misericordiosa” é natural e conserva o contraste ético com a afirmação seguinte.
- source_word: ⲟⲩⲁⲧϩⲏⲧ
  choice: dura de coração
  rationale: A expressão significa literalmente alguém sem coração e funciona aqui como antítese de “misericordiosa”; a forma idiomática portuguesa mantém o paradoxo.
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: minha obediência
  rationale: O abstrato deriva de ⲥⲱⲧⲙ, “ouvir/obedecer”, e indica obediência, não humilhação.
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: meu domínio próprio
  rationale: O empréstimo grego ἐγκράτεια designa autocontrole ou domínio próprio; esta última opção tem registro ético claro e corrente em português.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: amem-no
  rationale: A forma verbal vem de “amar” e retoma o substantivo precedente; não significa “vocês o encontrarão”.
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: minha fraqueza
  rationale: O termo deriva de ϭⲱⲃ, “ser fraco”, e denota fraqueza, não reino ou domínio.
theological_decisions:
- issue: Paradoxos na autodescrição da voz feminina
  choice: Preservar “misericordiosa” ao lado de “dura de coração” e “domínio próprio” dentro da “fraqueza”
  alternative: Harmonizar os pares como qualidades apenas positivas ou explicar um membro pelo outro
  rationale: A justaposição de opostos é estrutural ao poema e não deve ser resolvida por uma interpretação teológica importada.
translation_notes:
  register: Português moderno, digno e acessível, com concordância feminina para a voz do poema. A ordem enfática “eu — eu” reproduz a repetição copta. Os paradoxos foram mantidos sem harmonização, e a pontuação foi ajustada para leitura oral clara.
