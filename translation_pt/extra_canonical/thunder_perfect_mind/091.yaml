lexical_decisions:
- source_word: ⲡϩⲟ ⲙⲡⲕⲁϩ
  choice: sob a terra
  rationale: Mantém o sentido locativo adotado pela camada de consulta, em português natural, sem introduzir as conotações míticas mais específicas de “mundo inferior” ou “submundo”.
- source_word: ⲉⲧⲛⲟⲩϫⲉ
  choice: eles sobem
  rationale: Expressa de modo direto o movimento ascendente indicado na leitura adotada, preservando o contraste espacial com “sob a terra”.
- source_word: ⲙⲙⲟⲥ
  choice: até mim
  rationale: Representa a primeira pessoa singular como alvo do movimento e soa mais natural em português do que uma tradução estritamente objetiva.
- source_word: ⲉⲃⲟⲗ ϩⲓϫⲙ
  choice: vindos de
  rationale: Torna explícita a ideia de procedência do agrupamento preposicional sem reproduzir de forma artificial todos os seus componentes literais.
- source_word: ⲕⲁϩ
  choice: terra
  rationale: O contexto espacial e cosmológico favorece “terra”, em vez de “solo” ou “território”.
- source_word: ⲡϩⲟ ⲙⲡⲕⲁϩ (segunda ocorrência)
  choice: as profundezas da terra
  rationale: Variação idiomática que comunica a região inferior da terra sem usar “submundo”; evita a expressão pouco natural “a parte inferior da terra”.
