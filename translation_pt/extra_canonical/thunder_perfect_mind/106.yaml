    Eu sou...[d]'
  rationale: A revisão substitui somente a expressão portuguesa semanticamente anômala «acessível a tudo» por «ao alcance de todos». Mantêm-se o plural textual «minhas almas», a linguagem paradoxal das autodeclarações, a ambiguidade de «apreender» e a indicação de que o «Eu sou» final está incompleto no excerto.
