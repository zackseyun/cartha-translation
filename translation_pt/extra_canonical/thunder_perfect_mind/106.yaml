translation:
  language: pt
  text: '**4.** E aprendam com minhas almas.[a]


    Aqueles que me conhecem — eu sou


    a escuta ao alcance de todos;[b]


    eu sou a fala que ninguém pode apreender.[c]


    Eu sou...[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto transmitido pelo OCR traz ⲭⲓⲥⲃⲱ, provavelmente por engano no lugar de ϫⲓⲥⲃⲱ, “receber instrução, aprender”. A expressão seguinte diz explicitamente “minhas almas”, no plural.
    reason: textual_and_alignment_note
  - marker: b
    text: A palavra copta ϣⲏⲡ também pode significar “comum”, “disponível” ou “apropriada”; “ao alcance de todos” ressalta aqui a ideia de disponibilidade ou alcance.
    reason: lexical_alternative
  - marker: c
    text: “Apreender” também pode ser entendido como “agarrar”, “dominar” ou “compreender”; o original permite sentidos físicos e cognitivos.
    reason: lexical_alternative
  - marker: d
