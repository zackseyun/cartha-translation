    reason: alignment_note
lexical_decisions:
- source_word: ⲭⲓⲥⲃⲱ (provável OCR de ϫⲓⲥⲃⲱ)
  choice: aprendam
  rationale: A leitura corrigida ϫⲓⲥⲃⲱ significa receber instrução ou aprender. O imperativo plural moderno “aprendam” comunica o sentido sem manter a leitura judicial produzida pelo OCR.
- source_word: ⲉⲛⲁⲯⲩⲭⲏ
  choice: com minhas almas
  rationale: A sequência contém o possessivo explícito da primeira pessoa no plural, ⲛⲁ-, “minhas”; a preposição é expressa naturalmente como “com” após “aprender” em português.
- source_word: ⲥⲟⲟⲩⲛ
  choice: conhecem
  rationale: Mantém o sentido cognitivo básico e a fórmula poética de autodeclaração.
- source_word: ⲡⲥⲱⲧⲙ
  choice: a escuta
  rationale: O substantivo verbal é preservado como substantivo, em paralelo com “a fala”; “escuta” soa mais natural em português atual do que “a audição” neste contexto.
- source_word: ϣⲏⲡ
  choice: acessível
  rationale: No contexto, exprime disponibilidade ou alcance; a nota conserva as alternativas “comum” e “apropriada”.
- source_word: ⲛϩⲱⲃ ⲛⲓⲙ
  choice: a tudo
  rationale: A expressão de totalidade pode referir-se a todas as coisas; “a tudo” evita restringi-la silenciosamente a pessoas.
- source_word: ⲡϣⲁϫⲉ
  choice: a fala
  rationale: Preserva a atividade expressiva e o paralelismo poético com “a escuta” em linguagem portuguesa corrente.
- source_word: ⲙⲁϩⲧⲉ
  choice: apreender
  rationale: “Apreender” retém tanto a ideia de tomar quanto a de compreender, conservando a ambivalência do verbo copta.
theological_decisions:
- issue: Identificação da voz poética com “escuta” e “fala”
  choice: manter as autodeclarações literalmente paradoxais
  alternative: explicá-las como metáforas de revelação ou conhecimento
  rationale: O texto não resolve o paradoxo nem fornece uma interpretação doutrinária; explicitá-la importaria uma leitura teológica alheia ao trecho.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com imperativo plural brasileiro (“aprendam”). A disposição em versos preserva o paralelismo das autodeclarações. Mantiveram-se o plural incomum “minhas almas”, a abrangência não especificada de “tudo” e a ambiguidade de “apreender”.
