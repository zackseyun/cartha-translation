base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/026.yaml
  text: 'You who know me[a], be ignorant of me;

    and those who have not known me, let them know me[b],

    for I am knowledge and ignorance.'
translation:
  language: pt
  text: '**4.** Vocês que me conhecem[a], não me conheçam;


    e vocês que não me conheceram, conheçam-me[b],


    pois eu sou o conhecimento e a ignorância.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo copta é um empréstimo do grego ἀγνοεῖν, no campo semântico de «não conhecer» ou «não reconhecer».
    reason: lexical_alternative
  - marker: b
    text: As linhas de OCR fornecidas contêm frases sobre uma voz que sai pela terra, provavelmente pertencentes a outra passagem próxima. Esta tradução segue a localização usual da estrofe sobre conhecimento e ignorância em Trovão 4.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (verbo)
  choice: conhecer
  rationale: É o verbo copta básico para o conhecimento cognitivo; mantém de modo simples e claro a antítese entre conhecer e desconhecer.
- source_word: ⲁⲅⲛⲟⲉⲓ (verbo; empréstimo do grego ἀγνοεῖν)
  choice: desconhecer
  rationale: Preserva a força imperativa e o paradoxo com «conhecer», mas soa mais natural em português do que «ser ignorante de».
- source_word: ⲅⲛⲱⲥⲓⲥ (substantivo)
  choice: conhecimento
  rationale: Equivalente corrente do empréstimo grego γνῶσις e correspondente natural do termo oposto no paralelismo.
- source_word: ⲁⲅⲛⲱⲥⲓⲁ (substantivo)
  choice: ignorância
  rationale: Mantém a oposição conceitual incisiva com «conhecimento» sem explicar ou amenizar o paradoxo.
