  yaml_path: translation/extra_canonical/thunder_perfect_mind/031.yaml
  text: …leave me as I come forth[a]. And you will seek me in riches[c][b]. And do not look at me as I come forth among those who are honored…
translation:
  language: pt
  text: …vocês me deixam quando saio[a]. E me encontrarão nas riquezas. E não olhem para mim quando saio entre os que são honrados[b]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “quando/ao sair” (ou, mais explicitamente, “enquanto venho para fora”). A construção é circunstancial e está na primeira pessoa do singular.
    reason: esclarecimento_sintático
  - marker: b
    text: O excerto fornecido termina no meio da palavra ⲛⲉⲧⲧⲁ[ⲉⲓⲏⲩ], entendida pela continuação da linha como “os que são honrados”.
    reason: lacuna_no_excerto_ocr
lexical_decisions:
- source_word: ⲉⲧⲛⲕⲁⲁⲧ
  choice: vocês me deixam
  rationale: A forma contém o verbo ⲕⲱ, «deixar», com objeto de primeira pessoa; o início truncado do excerto recomenda manter as reticências, sem criar uma ordem como «prestem atenção».
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: enquanto venho para fora
  rationale: Lê-se como construção circunstancial de primeira pessoa do singular, «enquanto/ao vir para fora», e não como imperativo plural.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: me encontrarão
  rationale: O futuro com ϭⲓⲛⲉ expressa aqui «encontrar/achar»; distingue-se do verbo «procurar».
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: em meio às riquezas
  rationale: O substantivo abstrato deriva de ⲣⲙⲁⲟ, «rico», e designa riqueza ou riquezas; «em meio às» soa natural sem eliminar o valor locativo de ϩⲛ.
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: E não olhem para mim
  rationale: ⲙⲡⲣ- marca proibição, e ⲛⲁⲩ ⲉ- significa «olhar para»; a coordenação simples preserva ⲟⲩⲇⲉ.
- source_word: ⲛⲉⲧⲧⲁ[ⲉⲓⲏⲩ]
  choice: os que são honrados
  rationale: A palavra está cortada no fim do excerto OCR, mas sua continuação na linha é entendida como ⲛⲉⲧⲧⲁⲉⲓⲏⲩ, «os que são honrados», não «os humildes».
theological_decisions:
- issue: Valor paradoxal da presença da locutora
  choice: Conservar o contraste entre ser encontrada nas riquezas e não ser olhada entre os honrados
  alternative: Harmonizar «riquezas» e «honrados» como referências equivalentes à grandeza
  rationale: O texto mantém uma tensão deliberada entre encontrar e olhar, bem como entre os ambientes mencionados; a tradução não a resolve teologicamente.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas brasileiras naturais. Mantiveram-se as reticências porque o recorte começa e termina no meio do contexto. «Venho para fora» foi preservado, embora menos idiomático que «saio», para conservar o movimento expresso por ⲉⲓ + ⲉⲃⲟⲗ e a repetição do original.
