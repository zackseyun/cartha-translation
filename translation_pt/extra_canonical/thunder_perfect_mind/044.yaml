  text: I am she — the Greek and the barbarian[a][c][d]; I am she who will be manifest[b] in Egypt.
translation:
  language: pt
  text: '**9.** Eu sou ela — os gregos e os bárbaros[a]; eu sou ela, a que se manifestará[b] no Egito.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Os gregos e os bárbaros” formam uma oposição cultural greco-romana: os gregos eram contrapostos a todos os que não falavam grego. Aqui, a oradora se identifica com os dois lados do par.'
    reason: cultural_note
  - marker: b
    text: 'Ou: “aparecerá”. “Se manifestará” preserva o possível tom de revelação.'
    reason: lexical_alternative
  - marker: c
    text: O OCR deste trecho contém segmentos pouco claros antes das expressões aqui traduzidas, e o texto inglês de consulta não corresponde a estas linhas. Por isso, a tradução se limita às expressões que podem ser lidas com maior segurança.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Eu sou ela
  rationale: A cópula é feminina e integra a cadência recorrente de autoidentificação da oradora; “ela” torna esse dado gramatical perceptível em português.
- source_word: ⲛⲉⲗⲗⲏⲛ ⲙⲛ ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: os gregos e os bárbaros
  rationale: Os artigos coptas são plurais. A tradução conserva tanto o número quanto a oposição cultural greco-romana entre gregos e não gregos.
- source_word: ⲥⲉⲓⲛⲉ
  choice: se manifestará
  rationale: A forma verbal admite a ideia de aparecer ou tornar-se visível; “manifestar-se” preserva o tom revelatório sem excluir o sentido concreto de aparecer.
- source_word: ⲕⲏⲙⲉ
  choice: Egito
  rationale: Emprega-se o nome corrente do país em português, em vez da transliteração especializada “Kemet”.
