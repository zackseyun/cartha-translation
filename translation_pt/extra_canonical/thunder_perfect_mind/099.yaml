lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛⲧⲏⲏⲧⲉ
  choice: Estou entre vocês
  rationale: A construção expressa presença no meio dos destinatários. “Estou entre vocês” é direta, natural e preserva a primeira pessoa da voz discursiva.
- source_word: ⲧⲏⲛⲉ
  choice: vocês / os
  rationale: Trata-se do pronome objeto da segunda pessoa do plural, não de um substantivo com o sentido de “pão”. Na primeira oração, a forma reflexiva exigida pelo contexto é vertida por “a si mesmos”; depois, por “os”.
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: os libertará
  rationale: Neste contexto, ⲕⲁ ... ⲉⲃⲟⲗ tem o sentido idiomático de soltar, deixar sair ou libertar. “Libertar” reproduz com clareza a pergunta sem introduzir uma imagem ausente no copta.
- source_word: ⲛϩⲏⲧϥ
  choice: disso
  rationale: A expressão indica afastamento ou libertação de um referente masculino singular anterior. Como esse referente está perdido na lacuna, “disso” evita atribuir-lhe uma identidade não preservada.
- source_word: ⲛⲓⲙ ⲡⲉⲧⲛⲁϣ
  choice: quem poderá
  rationale: A sequência inicia uma pergunta com “quem” e uma forma modal de capacidade, mas o verbo seguinte está truncado. “Quem poderá [...]?” conserva a incompletude.
theological_decisions:
- issue: Identidade da pessoa que liberta e do referente de ⲛϩⲏⲧϥ
  choice: Manter “ele” e o referente neutro “disso”, sem identificação
  alternative: Identificar “ele” ou “isso” com uma figura, poder ou lugar específico
  rationale: O trecho não fornece contexto preservado suficiente para uma identificação teológica segura. A tradução mantém a tensão e a indeterminação do fragmento.
