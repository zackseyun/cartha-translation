base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/057.yaml
  text: 'This is mine:

    I came forth in an earth[a],

    and you came to be manifest in knowledge;

    an earth is in your heart—you receive those outside[c][b], in places.'
translation:
  language: pt
  text: '**12.** Isto é meu[b]:



    Eu saí de uma terra[a],



    e vocês vieram a existir a partir do conhecimento;



    uma terra está no coração de vocês — vocês recebem os que estão fora, em lugares.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Muitas traduções publicadas trazem neste ponto: “Eu sou sem Deus, e sou aquela cujo Deus é grande”. O excerto copta fornecido contém, porém, palavras referentes a “terra”, “conhecimento” e “lugares”, o que pode indicar desalinhamento entre o trecho e a divisão tradicional.'
    reason: alignment_note
  - marker: b
    text: A leitura desta frase é incerta por causa do OCR; talvez se pretendesse “Esta é a minha voz” ou “Esta é a minha declaração”.
    reason: lexical_alternative
  - marker: c
    text: A construção final é difícil. O texto parece dizer literalmente que vocês “recebem os que estão fora, em lugares”; “os que estão fora” também pode significar “as coisas de fora”.
    reason: textual_difficulty
lexical_decisions:
- source_word: ⲧⲉ ⲡⲁⲓ ⲙⲙⲟⲉⲓ
  choice: Isto é meu
  rationale: A leitura do OCR e sua segmentação são incertas. A formulação conserva o valor demonstrativo e possessivo aparente sem introduzir um substantivo não claramente atestado.
- source_word: ⲉⲓⲉⲃⲟⲗ ϩⲛⲟⲩ ⲕⲁϩ
  choice: Eu saí de uma terra
  rationale: ⲉⲓ ... ⲉⲃⲟⲗ indica sair/vir para fora, e ϩⲛ com esse movimento pode marcar a origem. ⲕⲁϩ significa terra ou solo, não escuridão.
- source_word: ⲛⲧⲉⲧⲛϣⲟⲟⲡ ⲉⲃⲟⲗ
  choice: vocês vieram a se manifestar
  rationale: ϣⲟⲟⲡ exprime ser ou vir a ser, enquanto ⲉⲃⲟⲗ acrescenta a ideia de exteriorização ou manifestação. O plural de segunda pessoa é preservado.
- source_word: ⲉⲡⲓⲥⲧⲏⲙ
  choice: no conhecimento
  rationale: Empréstimo grego de ἐπιστήμη; “conhecimento” mantém o sentido principal e a linguagem conceitual do texto.
- source_word: ⲕⲁϩ ⲛϩⲏⲧ
  choice: uma terra está no coração de vocês
  rationale: Mantém a repetição concreta de ⲕⲁϩ e verte a expressão de interioridade por “no coração”, sem dissolvê-la em uma paráfrase abstrata.
- source_word: ⲛⲧⲉⲧⲛϣⲟⲡ
  choice: vocês recebem
  rationale: A forma, dividida pelo fim da linha no OCR, corresponde a ϣⲱⲡ, “receber/tomar/adquirir”, e não ao verbo “buscar”.
- source_word: ⲛⲉⲃⲟⲗ
  choice: os que estão fora
  rationale: Aqui a forma funciona como expressão nominal plural, em contraste com aquilo que está no coração, e não apenas como advérbio “fora”.
- source_word: ϩⲛϩⲉⲛⲧⲟⲡⲟⲥ
  choice: em lugares
  rationale: O empréstimo grego τόπος está no plural; “lugares” preserva seu sentido espacial simples.
theological_decisions:
- issue: Possível substituição pelo dito “Eu sou sem Deus, e sou aquela cujo Deus é grande”
  choice: Traduzir o trecho copta fornecido, que fala de terra, conhecimento, coração e lugares
  alternative: Inserir aqui o dito sobre ser “sem Deus”
  rationale: O dito alternativo ocorre neste ponto em traduções publicadas, mas não corresponde às palavras visíveis no excerto de OCR alinhado. Não se deve importar uma formulação teológica ausente da evidência fornecida.
- issue: Sentido simbólico de “terra”
  choice: Manter o substantivo concreto “terra”
  alternative: Interpretá-lo como mundo, matéria, corpo ou condição espiritual
  rationale: O contexto pode sugerir simbolismo, mas o excerto não determina qual interpretação seria correta; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para explicitar a segunda pessoa do plural. Conservam-se a repetição incomum de “terra”, o contraste entre interior e exterior e a sintaxe algo enigmática do original, sem impor uma leitura cosmológica ou denominacional.
