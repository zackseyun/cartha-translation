translation:
  language: pt
  text: '**3.** Não odeiem minha obediência[a][c] nem ponham seu amor no meu domínio próprio[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “submissão”. O copta ϭⲟⲟⲃ pode indicar obediência ou a condição de estar sujeito.
    reason: lexical_alternative
  - marker: b
    text: Ou “castidade”. Em contextos éticos, ⲥⲧⲱⲧ muitas vezes expressa contenção ou enkrateia, por vezes especificamente contenção sexual.
    reason: lexical_alternative
  - marker: c
    text: O OCR deste bloco também apresenta ⲫⲟⲃⲟⲥ (“temor”) e ⲧⲟⲡⲟⲥ (“lugar”), que talvez pertençam a linhas adjacentes, e não a este par de afirmações. As proibições são supridas com base no padrão recorrente desta seção.
    reason: alignment_note
lexical_decisions:
- source_word: ϭⲟⲟⲃ
  choice: obediência
  rationale: O termo copta pode indicar a condição de estar sujeito ou ser obediente. “Obediência” é natural neste contexto possessivo, enquanto “submissão” permanece uma alternativa legítima.
- source_word: ⲥⲧⲱⲧ
  choice: domínio próprio
  rationale: Em contexto ético, o termo pode designar contenção ou enkrateia. “Domínio próprio” comunica o sentido amplo sem restringi-lo automaticamente à esfera sexual.
- source_word: ⲫⲟⲃⲟⲥ
  choice: temor
  rationale: Empréstimo grego presente no trecho de OCR, provavelmente pertencente a material adjacente; por isso não foi incorporado ao texto principal.
- source_word: ⲧⲟⲡⲟⲥ
