base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/042.yaml
  text: For why do you hate me[a], O Greeks? Because I am a barbarian? And I am the knowledge of the Greek and the barbarian[d][c][b]. I am the judgment.
translation:
  language: pt
  text: '**7.** Por que vocês me odeiam, ó gregos? Porque sou bárbara? Eu sou o conhecimento do grego e do bárbaro.[a] Eu sou o julgamento.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “o conhecimento do grego e do bárbaro” também pode ser entendida como conhecimento acerca deles ou como conhecimento que lhes pertence; a construção copta não resolve por si só essa relação.
    reason: ambiguity_note
  - marker: b
    text: O trecho transmitido no OCR está bastante corrompido. A leitura aqui segue a reconstrução do texto copta como “gregos”, “bárbara”, “conhecimento”, “grego e bárbaro” e “julgamento”; as antigas leituras “doente” e “médico” resultam de segmentações equivocadas do OCR.
    reason: textual_note
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ ⲅⲁⲣ
  choice: Pois por que
  rationale: Reproduz a pergunta causal enfática do copta em português natural, mantendo o valor de ⲅⲁⲣ.
- source_word: 'ⲛⲉⲓⲉⲗⲗⲏⲛ (texto restaurado; OCR: ⲡⲉⲓⲛⲗⲏⲛ)'
  choice: ó gregos
  rationale: A restauração reconhece o vocativo plural referente aos gregos; o chamamento direto é preservado.
- source_word: 'ⲧⲃⲁⲣⲃⲁⲣⲟⲥ (texto restaurado; OCR: ⲧⲉⲙⲁⲩⲉⲣⲟⲥ)'
  choice: bárbara
  rationale: O predicativo concorda com a voz feminina da obra. O termo mantém a oposição cultural e retórica entre grego e bárbaro, sem paráfrase depreciativa adicional.
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: o conhecimento
  rationale: Tradução direta do substantivo copta, preservando a afirmação paradoxal da voz discursiva.
- source_word: 'ⲡϩⲁⲡ (OCR: ⲫⲁⲡ)'
  choice: o julgamento
  rationale: A leitura corresponde ao termo copta para juízo ou julgamento; evita a antiga interpretação infundada como “médico”.
theological_decisions:
- issue: Relação expressa pelo genitivo em “o conhecimento do grego e do bárbaro”
  choice: do grego e do bárbaro
  alternative: o conhecimento acerca do grego e do bárbaro / o conhecimento pertencente ao grego e ao bárbaro
  rationale: A construção genitiva pode admitir mais de uma relação semântica. A formulação portuguesa conserva essa abertura em vez de decidir se o conhecimento é acerca desses grupos ou possuído por eles.
- issue: Sentido de ⲡϩⲁⲡ
  choice: julgamento
  alternative: juízo
  rationale: “Julgamento” preserva tanto o ato quanto a realidade judicativa sem introduzir uma identificação denominacional ou escatológica mais específica do que o texto exige.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para o plural e vocativo “ó gregos” para conservar a força retórica. A sequência curta de perguntas e declarações mantém a cadência antitética do original.
