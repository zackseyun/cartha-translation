base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/072.yaml
  text: 'The voice of the angels who were sent forth in the word[a], and of the gods,

    the gods that go out by means of the counsel;

    and the spirits of humans who exist with me,

    and the women who exist within[m][l][k][j][i][h][g][f][e][d][c][b].

    I am she — you [pl.] ...'
translation:
  language: pt
  text: '**9.** O silêncio[a] dos anjos que foram enviados na Palavra[b],

    e dos deuses —

    os deuses que saem por meio do conselho[c];

    e os espíritos dos seres humanos que existem comigo[d],

    e as mulheres que existem no íntimo[e].

    Eu sou ela — vocês…[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A leitura de ⲥⲓⲥ é incerta. Pode significar “silêncio” ou “quietude”; também já foi entendida como uma ordem: “calem-se”.'
    reason: alternative_reading
  - marker: b
    text: “Palavra” traduz o empréstimo grego λόγος. Também seria possível dizer “palavra” ou “Logos”. A sequência referente aos anjos está dividida entre linhas e pode ser analisada de outras maneiras.
    reason: lexical_and_alignment_note
  - marker: c
    text: O termo copta significa “conselho”, “plano” ou “desígnio”. “Por meio do conselho” segue de perto a construção do texto.
    reason: lexical_alternative
  - marker: d
    text: O manuscrito abrevia aqui πνεῦμα, “espírito”. A sequência seguinte é mais bem lida como “os que existem comigo”, e não como o substantivo “seres”.
    reason: scribal_abbreviation_and_ocr_note
  - marker: e
    text: Literalmente, “que existem dentro” ou “no coração”. O referente desse interior não é expresso no recorte.
    reason: lexical_alternative
  - marker: f
    text: A forma copta começa uma expressão de segunda pessoa do plural, mas o recorte termina antes que a frase se complete.
    reason: fragment_note
lexical_decisions:
- source_word: ⲥⲓⲥ
  choice: silêncio
  rationale: A forma no início do recorte é incerta e pode designar silêncio ou quietude; o substantivo mantém a estrutura enumerativa sem transformar a frase em ordem.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: dos anjos
  rationale: O empréstimo grego ἄγγελος, no contexto de seres celestes, é vertido pelo termo português corrente; “mensageiros” continua lexicalmente possível.
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟⲟⲩ
  choice: que foram enviados
  rationale: A sequência, dividida entre linhas no OCR, é entendida como relativa passiva referente aos anjos; evita-se a análise menos provável como “os primeiros”.
- source_word: ϩⲙ̄ ⲡⲗⲟⲅⲟⲥ
  choice: na Palavra
  rationale: ϩⲙ̄ indica localização ou esfera, e o empréstimo λόγος pode ter valor técnico; “Palavra” é acessível e preserva essa possibilidade.
- source_word: ⲛ̄ⲛⲟⲩⲧⲉ
  choice: dos deuses / os deuses
  rationale: A repetição e o paralelismo favorecem o plural, embora ⲛⲟⲩⲧⲉ também possa designar Deus no singular em outras construções.
- source_word: ⲉⲃⲟⲗ ϩⲓⲧⲙ̄ ⲡϣⲟϫⲛⲉ
  choice: saem por meio do conselho
  rationale: ⲡϣⲟϫⲛⲉ significa conselho, plano ou desígnio; a tradução conserva o movimento expresso por ⲉⲃⲟⲗ e a mediação de ϩⲓⲧⲙ̄.
- source_word: ⲙ̄ⲡⲛⲁ ⲛ̄ⲣⲱⲙⲉ
  choice: os espíritos dos seres humanos
  rationale: ⲡⲛⲁ é a abreviação de ⲡⲛⲉⲩⲙⲁ, “espírito”; “seres humanos” comunica o sentido genérico de ⲣⲱⲙⲉ.
- source_word: ⲛⲉⲧϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: que existem comigo
  rationale: A leitura corrigida ⲛⲉⲧϣⲟⲟⲡ forma uma relativa, “os que existem”, e ⲛ̄ⲙⲙⲁⲉⲓ indica companhia.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: as mulheres
  rationale: É a forma plural de “mulher”, não um termo para “sábios”.
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: que existem no íntimo
  rationale: A expressão indica existência no interior ou no coração; “no íntimo” conserva a imagem interior sem especificar um referente ausente no fragmento.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ-
  choice: Eu sou ela — vocês…
  rationale: ⲁⲛⲟⲕ ⲧⲉ é uma identificação feminina, enquanto ⲧⲉⲧ- inicia uma forma de segunda pessoa do plural interrompida pelo limite do recorte.
theological_decisions:
- issue: Número de ⲛⲟⲩⲧⲉ
  choice: plural, “deuses”
  alternative: singular, “Deus”
  rationale: O paralelismo e a repetição no trecho favorecem o plural. A alternativa é registrada para não ocultar a flexibilidade do termo copta.
- issue: Valor de λόγος
  choice: “Palavra” com inicial maiúscula
  alternative: “palavra” ou “Logos”
  rationale: A maiúscula preserva um possível valor personificado ou técnico sem identificar explicitamente a Palavra com uma formulação doutrinária posterior.
- issue: Identificação feminina da voz
  choice: “Eu sou ela”
  alternative: “Sou eu”
  rationale: A forma copta traz cópula feminina; a tradução a torna visível em vez de neutralizá-la.
translation_notes:
  register: Português moderno, digno e legível, com cadência poética preservada por paralelismo e quebras de linha. Mantiveram-se a repetição de “deuses”, a interioridade da última oração e a interrupção final. As notas distinguem incerteza textual de ambiguidade lexical sem harmonização doutrinária.
