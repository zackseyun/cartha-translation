lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: eles me encontrarão
  rationale: A sequência contém o futuro ⲥⲉⲛⲁ- com ϭⲓⲛⲉ, aqui no sentido comum de “encontrar”, seguido do objeto pronominal “me”; evita a leitura anterior, não sustentada, de “obedecer”.
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: no lugar que está ali
  rationale: Preserva a força dêitica de ⲉⲧⲙⲙⲁⲩ sem tornar a expressão artificial em português.
- source_word: ⲱⲛϩ
  choice: viverão
  rationale: É a equivalência direta e natural do verbo copta para viver/estar vivo, mantendo o paralelismo verbal no futuro.
- source_word: ⲛⲥⲉⲧⲙⲥⲱⲧ ⲉⲃⲟⲗ
  choice: não perecerão
  rationale: Segue a leitura textual adjudicada da expressão negativa, adequada ao contraste com “viverão”, embora o OCR isolado seja imperfeito.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: não sejam desobedientes a mim
  rationale: Reproduz a leitura contextual adjudicada como proibição de desobediência e usa uma construção clara e digna em português.
