base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/060.yaml
  text: 'But out of shame, receive me to yourselves in shamelessness;

    and out of shamelessness and shame, reprove my members among yourselves;

    and approach yourselves.'
translation:
  language: pt
  text: '**15.** Então, da vergonha, acolham-me junto de vocês na ausência de vergonha[a];


    e, da ausência de vergonha e da vergonha, repreendam os meus membros entre vocês[b];


    e aproximem-se de vocês mesmos[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “na não-vergonha” ou “na falta de vergonha”. A expressão também pode sugerir ausência de constrangimento ou pudor; “desvergonha” seria possível, mas em português pode implicar indecência moral de modo mais forte que o original.
    reason: Esclarecer o paradoxo lexical e evitar uma conotação moral excessivamente estreita.
  - marker: b
    text: “Meus membros” também pode ser entendido como “minhas partes”. O referente exato e a relação de “entre vocês” com a frase são incertos.
    reason: Preservar a ambiguidade sintática e referencial do trecho.
  - marker: c
    text: A formulação copta emprega uma expressão de aproximação com referência reflexiva, produzindo o sentido incomum “aproximem-se de vocês mesmos”. Também se pode compreender a frase como um movimento para dentro de si, mas isso já é interpretação.
    reason: Explicar o caráter incomum da cláusula sem substituir o texto por uma paráfrase interpretativa.
lexical_decisions:
- source_word: ϭⲉ
  choice: Então
  rationale: Representa a partícula discursiva de continuação ou consequência sem lhe atribuir uma força lógica excessivamente precisa.
- source_word: ϣⲓⲡⲉ
  choice: vergonha
  rationale: O substantivo designa vergonha, constrangimento ou pudor; “vergonha” conserva o paradoxo explícito com a forma privativa.
- source_word: ⲙⲛⲧⲁⲧϣⲓⲡⲉ
  choice: ausência de vergonha
  rationale: Tradução transparente da nominalização privativa, evitando que “desvergonha” seja entendida apenas como indecência moral.
- source_word: ϣⲟⲡⲧ
  choice: acolham-me
  rationale: Lê-se como imperativo de ϣⲱⲡ com objeto de primeira pessoa, e não como descrição de como a locutora é tratada.
- source_word: ϫⲡⲓⲟ
  choice: repreendam
  rationale: Imperativo com o sentido de censurar, reprovar ou repreender; “repreendam” é claro e preserva a força verbal.
- source_word: ⲙⲉⲗⲟⲥ
  choice: membros
  rationale: Empréstimo grego que pode designar membros ou partes; mantém-se a formulação corporal e possivelmente coletiva sem explicá-la em excesso.
- source_word: ⲧⲓ ⲟⲩⲟⲉⲓ ⲉ-
  choice: aproximem-se de
  rationale: O conjunto forma uma expressão idiomática de aproximação; a tradução conserva o objeto reflexivo incomum do texto.
theological_decisions:
- issue: Paradoxo entre vergonha e ausência de vergonha
  choice: Preservar literalmente os dois polos
  alternative: Interpretar como “honra e desprezo” ou suavizar para “com/sem constrangimento”
  rationale: A leitura morfológica mais direta sustenta “vergonha/ausência de vergonha”, e a tensão retórica não deve ser resolvida por interpretação teológica.
- issue: Identidade dos “membros”
  choice: Traduzir “meus membros” sem identificar quem ou o que são
  alternative: Entender como os membros dos destinatários, discípulos ou partes de uma comunidade
  rationale: A construção e o referente permanecem difíceis; explicitar uma identidade importaria uma interpretação não exigida pelo texto.
- issue: Aproximação reflexiva
  choice: Manter “aproximem-se de vocês mesmos”
  alternative: Normalizar como “aproximem-se de mim”, “voltem-se para dentro” ou “aproximem-se uns dos outros”
  rationale: O objeto reflexivo é estranho, mas constitui uma tensão genuína do texto transmitido; a nota registra a dificuldade sem a eliminar.
translation_notes:
  register: Português moderno, digno e acessível, com formas de tratamento no plural (“vocês”) de boa legibilidade brasileira. A sintaxe paralela e os imperativos foram mantidos; as estranhezas semânticas relevantes permanecem no texto e são explicadas em notas.
