lexical_decisions:
- source_word: ⲧⲛ̄ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: Tenham cautela com a minha fraqueza
  rationale: O imperativo plural de ⲥⲁϩⲟⲩ expressa prudência ou cautela, e ϣⲟⲩϣⲟⲩ denota fraqueza ou debilidade. A formulação mantém a exortação e a estranheza do original sem introduzir a ideia não sustentada de amaldiçoar ou vangloriar-se.
- source_word: ⲁⲛⲟⲕ ⲇⲉ ⲧⲉⲧϣⲟⲟⲡ
  choice: Mas eu sou aquela que existe
  rationale: A construção identifica a voz feminina como “aquela que existe”. “Mas” representa ⲇⲉ, enquanto “existe” preserva o sentido de ser ou estar presente de ϣⲟⲟⲡ.
- source_word: ⲛ̄ⲛ̄ⲫⲟⲃⲟⲥ ⲧⲏⲣⲟⲩ
  choice: em todo medo
  rationale: O empréstimo grego ⲫⲟⲃⲟⲥ significa “medo”, e ⲧⲏⲣⲟⲩ comunica totalidade. “Todo medo” conserva a leitura distributiva e o ritmo poético.
- source_word: ⲡⲛⲏϣⲁⲧ ⲛ̄ⲟⲩⲥⲧⲱⲧ
  choice: a força no tremor
  rationale: A leitura contextual e a revisão do OCR apontam para ⲡⲛⲁϣⲧ, “a força”, enquanto ⲥⲧⲱⲧ significa “tremor”. A tradução preserva o paradoxo sem explicá-lo.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ
  choice: Eu sou aquela que...
  rationale: A cópula e a forma relativa femininas retomam a identidade da locutora; o trecho termina no início da oração relativa, que deve permanecer incompleta.
