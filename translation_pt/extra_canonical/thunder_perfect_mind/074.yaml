base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/074.yaml
  text: 'those who exist with me[a], and the poor.

    What is within, in the heart—I am she.

    I am the honored one,

    and the one whom they praise,

    and the one whom they despise in scorn[e][d][c][b].

    I am'
translation:
  language: pt
  text: 'os que estão comigo,

    e as mulheres que estão no íntimo.[a]


    Eu sou a honrada,

    e aquela a quem louvam,[b]

    e aquela a quem desprezam com desdém.[c]


    Eu sou...'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “as mulheres que estão dentro/no interior”. O referente de “no interior” não aparece com clareza neste recorte.
    reason: ambiguity_note
  - marker: b
    text: O verbo copta também pode ser traduzido por “bendizem”. Aqui, “louvam” ressalta o contraste com “desprezam”.
    reason: lexical_alternative
  - marker: c
    text: A expressão copta significa “com desdém”, “com desprezo” ou “com escárnio”.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: os que estão comigo
  rationale: O verbo existencial/locativo com a preposição pronominal expressa estar com alguém. Como o excerto parece começar no meio de uma construção, mantém-se a forma fragmentária sem acrescentar um verbo imperativo.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: as mulheres
  rationale: ϩⲓⲟⲙⲉ é o plural de ‘mulher’; não deve ser confundido com o vocábulo copta para ‘pobres’.
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: que estão no íntimo
  rationale: A oração relativa significa literalmente ‘que estão dentro/no interior’. ‘No íntimo’ conserva a referência espacial sem determinar um referente que o recorte não explicita.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: Eu sou a honrada
  rationale: A construção copular feminina identifica a voz como ‘a honrada’, e não como ‘minha aparência’.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲉⲣⲟⲥ
  choice: aquela a quem louvam
  rationale: A forma relativa feminina seguida do objeto pronominal significa ‘aquela a quem eles louvam/bendizem’. ‘Louvam’ estabelece naturalmente o contraste com ‘desprezam’.
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙ̄ⲙⲟⲥ
  choice: aquela a quem desprezam
  rationale: O empréstimo grego καταφρονεῖν significa desprezar ou tratar com desdém; a forma relativa e o pronome objeto retomam a locutora feminina.
- source_word: ϩⲛ ⲟⲩϣⲱϣ
  choice: com desdém
  rationale: Neste contexto, o substantivo indica desprezo ou escárnio e intensifica o verbo anterior; não significa ‘com uma voz’.
- source_word: ⲁⲛⲟⲕ
  choice: Eu sou...
  rationale: A palavra inicia a fórmula recorrente ‘Eu sou’, mas o predicado pertence ao segmento seguinte; as reticências assinalam o corte do excerto.
theological_decisions:
- issue: Identidade feminina da locutora
  choice: 'Manter todas as formas femininas: ‘a honrada’, ‘aquela’.'
  alternative: Neutralizar como ‘a pessoa honrada’ ou usar formas masculinas genéricas.
  rationale: A gramática copta marca explicitamente o feminino, elemento literário e teológico essencial ao discurso.
- issue: Paradoxo entre honra, louvor e desprezo
  choice: Preservar as afirmações paralelas sem conciliá-las.
  alternative: Explicar que diferentes grupos honram ou desprezam a locutora.
  rationale: O texto não identifica sujeitos distintos nem resolve a tensão; explicá-la na tradução importaria uma interpretação ausente do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo poético preservado. O começo e o fim permanecem fragmentários porque o excerto alinhado começa no meio de uma construção e termina no início da afirmação seguinte. Evitou-se a leitura secundária ‘os pobres’, incompatível com ⲛⲓϩⲓⲟⲙⲉ (‘as mulheres’), bem como as segmentações errôneas ‘minha aparência’, ‘rosto’ e ‘com uma voz’.
