base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/086.yaml
  text: '...of the nature that exists within me[a]. I am the hearing that is attainable to everyone, and the speech that cannot be grasped[f][e][d][c][b]. I am the call.'
translation:
  language: pt
  text: '**2.** ...do coração que existe dentro de mim.[a] Eu sou o ouvir que está ao alcance de todos e a palavra que não pode ser apreendida.[b] Eu sou o chamado.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura da OCR ⲙⲫⲏⲧ parece representar de forma defeituosa ⲙ̄ⲡϩⲏⲧ, “do coração”. O trecho também continua uma oração iniciada antes deste segmento.
    reason: textual_note
  - marker: b
    text: Esta parte da OCR está gravemente corrompida. A tradução segue a reconstrução textual que exprime uma palavra que não pode ser alcançada ou agarrada; “apreendida” também pode sugerir “compreendida”.
    reason: textual_note
  - marker: c
    text: 'Ou: “o clamor” ou “o grito”. “Chamado” ressalta a ideia de convocação.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲫⲏⲧ (provavelmente ⲙ̄ⲡϩⲏⲧ)
  choice: do coração
  rationale: O trecho começa no meio de uma oração, e a leitura provável do manuscrito é ⲙ̄ⲡϩⲏⲧ, “do coração”, não um substantivo que signifique “natureza”. As reticências preservam a lacuna ou continuação anterior sem acrescentar “eu sou”.
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ
  choice: que existe dentro de mim
  rationale: ⲥϣⲟⲟⲡ expressa existência ou presença; aqui ⲛϩⲏⲧ tem valor interior e inclui a referência à primeira pessoa.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Eu sou
  rationale: Forma copular enfática padrão, repetida para conservar o ritmo declarativo do texto.
- source_word: ⲡⲥⲱⲧⲙ
  choice: o ouvir
  rationale: Mantém o substantivo abstrato ligado ao ato ou faculdade de ouvir e preserva o paralelismo com “a palavra”.
- source_word: ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: que está ao alcance de todos
  rationale: ϣⲏⲡ pode indicar aquilo que é acessível ou está ao alcance; a formulação portuguesa é natural e conserva a distribuição universal de ⲟⲩⲟⲛ ⲛⲓⲙ.
- source_word: ⲡϣⲁϫⲉ
  choice: a palavra
  rationale: Pode significar “palavra”, “fala” ou “discurso”. “Palavra” mantém a personificação abstrata sem restringi-la ao ato oral.
- source_word: passagem corrompida após ⲡϣⲁϫⲉ
  choice: que não pode ser apreendida
  rationale: A OCR está severamente corrompida; a reconstrução manuscrita indicada pela revisão textual sustenta a ideia de algo que não pode ser alcançado ou agarrado. “Apreendida” preserva tanto a imagem de captar quanto a possível ressonância intelectual.
- source_word: ⲧⲉⲕⲱ
  choice: o chamado
  rationale: O termo pode designar chamado, clamor ou grito. “Chamado” favorece a ideia de convocação, sem eliminar totalmente a força vocal do termo.
theological_decisions:
- issue: Identidade da voz com realidades paradoxais
  choice: Preservar literalmente as declarações “Eu sou”
  alternative: Explicá-las como metáforas ou atributos da voz
  rationale: O texto apresenta identificações deliberadamente enigmáticas; explicá-las resolveria uma tensão que o original deixa aberta.
- issue: Sentido de “apreendida”
  choice: Manter a ambiguidade entre agarrar e compreender
  alternative: Traduzir exclusivamente como “compreendida” ou “agarrada”
  rationale: A formulação pode operar simultaneamente nos planos físico e cognitivo; a tradução não deve impor apenas um deles.
translation_notes:
  register: Português moderno, solene e acessível, com cadência paralela. “O ouvir” foi preferido a “a audição” por soar menos técnico; “apreendida” conserva a polissemia do trecho reconstruído. As reticências iniciais assinalam que o segmento começa no meio de uma oração.
