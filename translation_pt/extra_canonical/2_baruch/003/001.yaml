  text: And I said, “O Lord, my Lord, have I come into the world for this, that I should see the evil of my mother? No, my Lord.
translation:
  language: pt
  text: '1 E eu disse: “Ó Senhor, meu Senhor, foi para isto que vim ao mundo: para ver a desgraça de minha mãe?[a] Não, meu Senhor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Minha mãe” é Jerusalém, também chamada Sião.
    reason: A nota identifica o referente da metáfora sem desfazê-la no texto principal.
lexical_decisions:
- source_word: ܐܬܝܬ ܠܥܠܡܐ
  choice: vim ao mundo
  rationale: A formulação traduz o texto siríaco corrigido à luz do controle da edição, em vez da leitura defeituosa produzida por OCR.
- source_word: ܒܝܫܬܗ̇
  choice: a desgraça
  rationale: Neste lamento, o termo designa o mal ou a calamidade que sobrevém à cidade. “Desgraça” comunica esse sentido em português natural sem antecipar o termo mais específico “destruição” do versículo seguinte.
- source_word: ܐܡܝ
  choice: minha mãe
  rationale: Mantém a personificação materna de Jerusalém/Sião e preserva a força poética e afetiva do lamento, em vez de substituí-la interpretativamente por “minha cidade”.
theological_decisions:
- issue: Identidade de “minha mãe”
  choice: Conservar a metáfora “minha mãe” no texto e esclarecer em nota que se refere a Jerusalém/Sião.
  alternative: Traduzir diretamente como “minha cidade” ou “Jerusalém”.
  rationale: A metáfora materna é deliberada e expressa a relação íntima de Baruque com a cidade; explicitá-la no corpo do texto apagaria uma imagem teologicamente significativa.
- issue: Natureza da pergunta de Baruque
  choice: Apresentá-la como lamento retórico sobre ter vindo ao mundo para testemunhar a calamidade de Jerusalém.
  alternative: Entendê-la como referência a um pedido anterior de Baruque.
  rationale: O texto siríaco controlado sustenta “vim ao mundo”; a leitura referente a “pedir” decorre de corrupção de OCR.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com sintaxe retórica clara. “Ó Senhor, meu Senhor” preserva a invocação enfática; os dois-pontos tornam natural em português a finalidade expressa na segunda oração.
