review_pass:
  verdict: revise
  source_fidelity: O siríaco exibido sustenta a leitura em que Baruque declara não poder morrer com a sua assembleia/comunidade e não poder ver a calamidade de sua mãe. A expressão inicial aponta para aflições/sofrimentos numerosos, não simplesmente para aflições “muito grandes”.
  naturalness: A redação é compreensível e de registro adequado, mas “estas minhas aflições são muito grandes” é menos fiel ao valor de multiplicidade do siríaco. “Assembleia” reproduz mais precisamente o referente de ܟܢܘܫܬܝ, permanecendo natural em português moderno.
  terminology: “Calamidade” transmite bem o mal/desastre que recai sobre a cidade personificada como mãe. Mantém-se “minha mãe”, sem identificar interpretativamente a cidade no texto.
  issues:
  - severity: medium
    issue: A expressão inicial traduz multiplicidade como grandeza.
    rationale: O segmento siríaco referente às aflições/sofrimentos está associado a “muitos”; “muito grandes” desloca esse aspecto para intensidade.
  - severity: low
    issue: “Comunidade” é possível, mas “assembleia” é mais próximo do termo siríaco.
    rationale: ܟܢܘܫܬܝ designa diretamente uma assembleia/congregação; “assembleia” preserva isso sem criar dificuldade de leitura.
  revised_text: 'Pois minhas aflições são numerosas demais: não posso morrer com a minha assembleia,[a] nem a minha alma é capaz de ver a calamidade de minha mãe.'
  revised_footnotes:
  - marker: a
    text: 'Outra leitura, refletida em uma tradição de tradução: “não posso abandonar metade do teu povo”.'
    reason: A leitura principal segue o siríaco fornecido, que traz “morrer com a minha assembleia”; a alternativa registrada no histórico inglês é mantida em nota, sem substituir o texto-base.
  revision_rationale: A revisão preserva a leitura diretamente atestada no siríaco e ajusta “muito grandes” para “numerosas demais”, conservando o elemento de multiplicidade. “Assembleia” é preferível a “comunidade” por maior proximidade lexical. A alternativa inglesa permanece exclusivamente em nota.
