  text: 'For these two things are too much for me: I cannot forsake half of your people, nor can my soul bear to see the destruction of my mother.'
translation:
  language: pt
  text: 'Pois minhas aflições são numerosas demais: não posso morrer com a minha assembleia,[a] nem a minha alma é capaz de ver a calamidade de minha mãe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura, refletida em uma tradição de tradução: “não posso abandonar metade do teu povo”.'
    reason: A leitura principal segue o siríaco fornecido, que traz “morrer com a minha assembleia”; a alternativa registrada no histórico inglês é mantida em nota, sem substituir o texto-base.
lexical_decisions:
- source_word: ܐ̈ܡܘܬܝ
  choice: minhas aflições
  rationale: O termo, no contexto e na construção com ܐܠܝܢ ܥܡ ܣܓܝܐ, é mais naturalmente entendido como referência aos grandes sofrimentos ou aflições de Baruque, e não como o numeral “duas”.
- source_word: ܟܢܘܫܬܝ
  choice: minha comunidade
  rationale: Designa a assembleia ou comunidade à qual Baruque pertence; “comunidade” é natural em português e evita restringir o sentido a uma reunião formal.
- source_word: ܒܒܝܫܬܗ̇
  choice: a desgraça
  rationale: O substantivo pode denotar mal, calamidade ou desventura. Aqui se refere à calamidade que atingirá a cidade personificada como mãe.
- source_word: ܕܐܡܝ
  choice: de minha mãe
  rationale: Mantém literalmente a personificação materna da cidade, sem explicitar “Jerusalém” no corpo do texto.
theological_decisions:
- issue: Leitura da primeira impossibilidade expressa por Baruque
  choice: “não posso morrer com a minha comunidade”
  alternative: “não posso abandonar metade do teu povo”
  rationale: O siríaco apresentado lê ܕܐܡܘܬ ܥܡ ܟܢܘܫܬܝ, literalmente “que eu morra com a minha assembleia/comunidade”. A alternativa da camada inglesa não corresponde de modo transparente à evidência textual exibida e, por isso, é registrada em nota, não adotada no texto principal.
- issue: Identidade da “mãe”
  choice: preservar “minha mãe”
  alternative: explicitar “Jerusalém”
  rationale: A metáfora é clara no contexto, mas o original conserva a linguagem afetiva e personificada; explicitá-la eliminaria uma característica literária relevante.
translation_notes:
  register: Português moderno, digno e acessível, com coordenação natural. Conservou-se a personificação da cidade como mãe e a leitura diretamente atestada pelo siríaco; a variante da camada inglesa foi remetida à nota.
