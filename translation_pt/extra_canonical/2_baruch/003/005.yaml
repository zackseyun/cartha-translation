  text: If indeed you destroy your city and give over your sanctuary for a time and scatter your people among the nations so that they may be no more,
translation:
  language: pt
  text: Se de fato destruíres a tua cidade, entregares o teu santuário por certo tempo e dispersares o teu povo entre as nações, para que deixem de existir,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܒܕ
  choice: destruíres
  rationale: O verbo na forma causativa expressa fazer perecer ou destruir; no contexto, “destruir” é a formulação portuguesa mais direta.
- source_word: ܡܕܝܢܬܟ
  choice: a tua cidade
  rationale: Preserva o substantivo “cidade” e o sufixo possessivo de segunda pessoa singular.
- source_word: ܬܫܠܡ
  choice: entregares
  rationale: Neste contexto de juízo, o verbo comunica a entrega do santuário ao poder de outros, sem especificar além do texto a quem ele é entregue.
- source_word: ܠܙܒܢܐ
  choice: por algum tempo
  rationale: Mantém a duração temporária e indefinida indicada pela expressão siríaca.
- source_word: ܒܥܡܡ̈ܐ
  choice: entre as nações
  rationale: “Nações” conserva o sentido coletivo de povos gentios e “entre” expressa naturalmente a dispersão em seu meio.
theological_decisions:
- issue: A cidade e o santuário pertencem a Deus
  choice: “a tua cidade” e “o teu santuário”
  alternative: “a cidade” e “o santuário”
  rationale: Os possessivos fazem parte da argumentação dirigida ao Senhor e devem ser preservados, sem identificar explicitamente os lugares no próprio versículo.
- issue: Resultado final da dispersão
  choice: “para que deixem de existir”
  alternative: “até que já não existam”
  rationale: A formulação mantém a finalidade ou consequência expressa no texto de consulta e evita transformar a oração em uma indicação temporal.
translation_notes:
  register: Português atual, digno e acessível, com segunda pessoa singular solene coerente com a oração dirigida ao Senhor. A frase permanece aberta com vírgula final porque o raciocínio continua no versículo seguinte.
