  text: Or how will one speak of your praise? Or to whom will what is in your law be explained?
translation:
  language: pt
  text: Ou como se falará do teu louvor? Ou a quem será explicado o que está na tua lei?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܚܬܟ (teshbḥātāk)
  choice: teu louvor
  rationale: O substantivo siríaco está no singular e denota louvor ou exaltação; o singular português preserva essa forma sem restringi-la a um cântico específico.
- source_word: ܢܬܦܫܩ (netpashaq)
  choice: será explicado
  rationale: A forma passiva expressa a ideia de algo ser interpretado ou explicado; esta opção mantém a voz passiva e é natural em português.
- source_word: ܢܡܘܣܟ (nāmōsāk)
  choice: tua lei
  rationale: Traduz diretamente o termo para lei, preservando o possessivo e sem acrescentar uma interpretação denominacional.
theological_decisions:
- issue: Objeto e destinatário da revelação contida na lei
  choice: preservar as duas perguntas retóricas sem identificar quem poderia explicar ou receber a explicação
  alternative: explicitar um intérprete, um povo ou um grupo religioso
  rationale: O texto mantém essas identidades em aberto; especificá-las resolveria indevidamente a tensão retórica.
translation_notes:
  register: Português moderno, claro e digno. A construção impessoal «se falará» reproduz naturalmente o sentido genérico de «alguém falará», e as duas orações interrogativas coordenadas são mantidas integralmente.
