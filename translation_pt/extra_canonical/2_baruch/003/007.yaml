base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/007.yaml
  text: And that they may see concerning this city, because of the evil of her deeds, that this city is like a bitter widow, and that her humiliation is like sweet spoil?”
translation:
  language: pt
  text: E para que vejam a respeito desta cidade[a], por causa da maldade de suas ações[b], que esta cidade é como uma viúva amargurada e que sua humilhação é como um doce despojo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vejam a partir desta cidade”.'
    reason: A preposição siríaca ܡܢ significa literalmente “de, desde, a partir de”, embora o contexto favoreça “a respeito de”.
  - marker: b
    text: 'Outra divisão possível da frase: “vejam a respeito desta cidade, por causa da maldade de suas ações, esta cidade como uma viúva amargurada”.'
    reason: A construção siríaca é compacta e não contém uma cópula explícita correspondente a “é”, deixando ambígua a ligação entre as orações.
lexical_decisions:
- source_word: ܡܢ ܗܕܐ ܡܕܝܢܬܐ
  choice: a respeito desta cidade
  rationale: Embora ܡܢ normalmente expresse origem (‘de, desde’), aqui a construção parece introduzir aquilo que será observado acerca da cidade; a nota preserva a leitura mais literal.
- source_word: ܒ̈ܝܫܬܗ̇ ܕܐܝܕܝܗ̇
  choice: a maldade das obras de suas mãos
  rationale: A expressão semítica atribui à cidade, personificada no feminino, a maldade praticada por suas mãos; ‘obras’ é explicitado para produzir português natural sem perder a imagem.
- source_word: ܥܡܗܕܐ ܡܪܝܪܐ
  choice: uma viúva amargurada
  rationale: Mantém a figura feminina aplicada à cidade; ‘amargurada’ comunica em português corrente a condição dolorosa indicada pelo adjetivo ‘amarga’.
- source_word: ܫܘܕܐ ܚܠܝܬܐ
  choice: um doce despojo
  rationale: Preserva a combinação incomum de ‘despojo/saque’ com ‘doce’, sem normalizar a tensão da imagem.
theological_decisions:
- issue: Relação sintática entre a maldade das obras e a comparação da cidade
  choice: A maldade é apresentada como a razão pela qual se vê a cidade como viúva amargurada.
  alternative: Ler ‘por causa da maldade das obras de suas mãos’ como parte do conteúdo observado, em coordenação mais solta com a comparação.
  rationale: A sintaxe siríaca é comprimida e permite mais de um agrupamento; o texto principal oferece uma frase portuguesa inteligível, enquanto a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com personificação feminina da cidade. A formulação conserva as imagens deliberadamente incomuns ‘viúva amargurada’ e ‘doce despojo’, bem como a ambiguidade sintática por meio de notas.
