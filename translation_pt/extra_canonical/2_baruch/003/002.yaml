base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/002.yaml
  text: If I have found grace in your sight, let your mercies quickly take my spirit to yourself, that I may go to my fathers and not see the destruction of my mother.
translation:
  language: pt
  text: Se encontrei graça aos teus olhos, que tuas misericórdias levem depressa meu espírito para junto de ti, para que eu vá para junto de meus pais e não veja a destruição de minha mãe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Minha mãe” é uma personificação de Jerusalém.
    reason: Esclarece o referente metafórico sem eliminar a imagem do texto principal.
lexical_decisions:
- source_word: ܪ̈ܚܡܝܟ
  choice: tuas misericórdias
  rationale: Preserva o plural concreto do siríaco e sua linguagem de súplica.
- source_word: ܪܘܚܝ
  choice: meu espírito
  rationale: Equivalente direto de 'meu espírito', sem substituir interpretativamente por 'minha vida' ou 'minha alma'.
- source_word: ܐܒ̈ܗܝ
  choice: meus pais
  rationale: Mantém a expressão ancestral do texto; neste contexto, refere-se aos antepassados falecidos.
- source_word: ܒܚܪܒܗ̇ ܕܐܡܝ
  choice: a destruição de minha mãe
  rationale: Reproduz a personificação materna da cidade sem explicá-la dentro do corpo do versículo.
theological_decisions:
- issue: Pedido para que Deus tome o espírito de Baruque
  choice: que tuas misericórdias levem depressa meu espírito para junto de ti
  alternative: que eu morra depressa
  rationale: Mantém a formulação teológica e antropológica do siríaco, sem reduzi-la a uma paráfrase interpretativa.
- issue: Cláusula condicional inicial
  choice: Se encontrei graça aos teus olhos
  alternative: omitir a cláusula e iniciar diretamente com o pedido
  rationale: A cláusula é atestada pela evidência siríaca indicada e deve ser preservada.
translation_notes:
  register: Português moderno, claro e solene, com tratamento em segunda pessoa do singular. A repetição de “para junto de” foi mantida para distinguir o movimento do espírito para Deus e o encontro com os antepassados.
