  text: 'But I will speak before you: What more have those who knew you and did not walk in vanity like the rest of the nations gained?'
translation:
  language: pt
  text: 'Mas falarei diante de ti: Que vantagem adicional tiveram os que te conheceram e não andaram na futilidade, como as demais nações[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como os demais”.'
    reason: Registra a leitura mais curta da comparação final sem eliminar da tradução principal a referência às nações.
lexical_decisions:
- source_word: ܡܠܠ ܩܕܡܝܟ
  choice: falarei diante de ti
  rationale: Preserva a expressão semítica de falar na presença de Deus, com formulação clara e digna em português.
- source_word: ܝܬܝܪ
  choice: vantagem a mais
  rationale: Expressa o valor comparativo da pergunta — que benefício adicional obtiveram — sem tornar explícita uma resposta apenas implícita.
- source_word: ܗܒܠܐ
  choice: futilidade
  rationale: Comunica a ideia de vazio e falta de substância moral ou existencial em linguagem atual; evita restringir o termo à mera vaidade pessoal.
- source_word: ܐܢܛܪܘ / construção de conduta no contexto
  choice: andaram
  rationale: Mantém a metáfora bíblica da conduta como caminhada, também natural e reconhecível em português bíblico.
- source_word: ܫܪܟܐ ܕܥܡܡܐ (leitura contextual refletida na tradição textual)
  choice: o restante das nações
  rationale: Conserva o contraste específico com as demais nações, nuance confirmada pela camada de consulta auditada.
theological_decisions:
- issue: Valor espiritual do conhecimento de Deus em contraste com as nações
  choice: 'Formular como pergunta aberta: “Que vantagem a mais obtiveram...?”'
  alternative: Converter em afirmação de que não obtiveram vantagem alguma
  rationale: O texto apresenta uma interrogação retórica; a tradução não deve resolver explicitamente sua tensão teológica.
- issue: Alcance da comparação final
  choice: Ligar “como o restante das nações” a “andaram na futilidade”
  alternative: Ler apenas “como os demais”, sem explicitar “das nações”
  rationale: A leitura principal preserva o contraste étnico-coletivo atestado, enquanto a forma mais curta é registrada em nota por causa da variação ou ambiguidade textual.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. Mantém-se um tom reverente e bíblico, com a metáfora “andar” e sem arcaísmos desnecessários.
