translation:
  language: pt
  text: e para quem foram procuradas boas obras[a], e para quem foram dados os profetas[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o labor do bem”.'
    reason: A expressão siríaca pode ser entendida de modo mais literal como trabalho, esforço ou labor relacionado ao bem.
  - marker: b
    text: 'Literalmente: “foram encontrados”.'
    reason: Registra o sentido lexical mais direto do verbo siríaco, enquanto o texto principal emprega o valor contextual “foram dados”.
lexical_decisions:
- source_word: ܥܡܠܐ ܕܛܒܬܐ
  choice: boas obras
  rationale: Expressa em português corrente a ideia de esforço ou labor voltado ao bem, sem excluir a leitura mais literal registrada em nota.
- source_word: ܢܫܬܟܚ
  choice: foram dados
  rationale: Embora o verbo signifique literalmente “foram encontrados”, neste contexto pode indicar que os profetas foram postos à disposição ou concedidos; “foram dados” é natural e acompanha o paralelismo da pergunta.
theological_decisions:
- issue: Relação entre boas obras, profetas e seus destinatários
  choice: Manter duas perguntas paralelas introduzidas por “para quem”
  alternative: Reformular como afirmação sobre a finalidade das boas obras e dos profetas
  rationale: O texto apresenta uma interrogação retórica e não explicita a resposta; a tradução preserva essa tensão sem determinar quem são os destinatários.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com a estrutura interrogativa e o paralelismo preservados. Os marcadores [a] e [b] aparecem junto às expressões correspondentes.
