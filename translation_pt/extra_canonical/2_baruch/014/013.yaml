  text: Therefore they leave this world without fear, and with trust and gladness they wait to receive the world that you promised them …
translation:
  language: pt
  text: Por isso, eles deixam este mundo sem medo e, com confiança e alegria,[a] esperam receber o mundo que lhes prometeste…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “confiantes, esperam com alegria”.'
    reason: A construção siríaca permite pequena variação na maneira de ligar a confiança e a alegria ao verbo “esperam”.
lexical_decisions:
- source_word: ܥܠܡܐ (ʿālmā; reflected in the verse’s established Syriac reading)
  choice: mundo
  rationale: Preserva a correspondência entre o mundo presente, que eles deixam, e o mundo prometido, que esperam receber.
- source_word: ܕܠܐ ܕܚܠܬܐ (dalā deḥltā; established reading)
  choice: sem medo
  rationale: Expressa de modo direto e natural a ausência de temor ao deixar o mundo presente.
- source_word: ܬܟܝܠܐܝܬ / forma adverbial correlata (established reading)
  choice: com confiança
  rationale: Comunica a atitude confiante sem sugerir que a alegria seja o objeto da confiança.
- source_word: ܒܚܕܘܬܐ (bəḥādūṯā; established reading)
  choice: com alegria
  rationale: Mantém a alegria como circunstância da espera, em paralelo com a confiança.
theological_decisions:
- issue: Natureza do que é prometido
  choice: “o mundo que lhes prometeste”
  alternative: “a era que lhes prometeste”
  rationale: “Mundo” conserva o contraste retórico entre o mundo deixado e o mundo futuro prometido, sem definir mais precisamente sua natureza escatológica.
- issue: Relação entre confiança, alegria e espera
  choice: “com confiança e alegria, esperam”
  alternative: “confiantes, esperam com alegria”
  rationale: A formulação principal mantém juntas as duas disposições adverbiais e preserva a possível diferença de ligação sintática na nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento divino na segunda pessoa do singular (“prometeste”). As reticências preservam a indicação de continuidade ou lacuna presente na camada de consulta.
