  choice: Manter “fomos feitos”, sem nomear o agente
  alternative: “Deus nos fez”
  rationale: Embora o contexto seja uma oração dirigida a Deus, o verso não explicita o agente; nomeá-lo resolveria além do que o texto afirma.
