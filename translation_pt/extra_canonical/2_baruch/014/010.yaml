lexical_decisions:
- source_word: ܗܒܠܐ
  choice: sopro
  rationale: O termo designa algo breve, fugaz e insubstancial, como o ar exalado; “sopro” preserva a imagem concreta e soa natural em português.
- source_word: ܐܬܡܢܢ
