base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/014/011.yaml
  text: 'For as a breath rises without intention and vanishes, so is the nature of men: they do not go by their own will, and they do not know what will happen to them in the end.'
translation:
  language: pt
  text: 'Pois, assim como um sopro surge sem intenção e desaparece, assim é a natureza dos seres humanos: eles não seguem a própria vontade e não sabem o que lhes acontecerá no fim.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܒܠܐ
  choice: sopro
  rationale: O termo pode designar sopro, vapor ou algo fugaz; “sopro” preserva a imagem de algo que surge e logo desaparece.
- source_word: ܒܢ̈ܝܢܫܐ
  choice: seres humanos
  rationale: Forma inclusiva e natural para a referência coletiva à humanidade.
- source_word: ܫܘܠܡܐ
  choice: fim
  rationale: Expressa o desfecho ou termo da vida sem acrescentar uma interpretação além do texto.
theological_decisions:
- issue: Liberdade humana diante da mortalidade
  choice: “não partem por vontade própria”
  alternative: “não seguem por vontade própria”
  rationale: No contexto da transitoriedade humana, “partem” comunica naturalmente a saída desta vida, mantendo a tensão do texto entre vontade humana e mortalidade sem formular uma doutrina determinista.
translation_notes:
  register: Português moderno, claro e digno, com construção proverbial. “Condição” foi preferido a “natureza” por soar mais natural neste contraste sobre a existência transitória, sem alterar o alcance antropológico da frase.
