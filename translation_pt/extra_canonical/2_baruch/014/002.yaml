  text: And now I know that many have sinned and lived, and only a few will remain in those times to whom these words may be spoken.
translation:
  language: pt
  text: E agora sei que muitos pecaram e viveram, e que apenas poucos restarão naqueles tempos, e estas palavras lhes poderão ser ditas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܛܘ
  choice: pecaram
  rationale: Reproduz diretamente o verbo siríaco para cometer pecado, sem explicitação doutrinária.
- source_word: ܚܝܘ
  choice: viveram
  rationale: Mantém o sentido simples de “viver”, preservando a tensão de que muitos pecaram e, ainda assim, viveram.
- source_word: ܡܫܬܚܪܝܢ
  choice: restarão
  rationale: No contexto escatológico, expressa com naturalidade a ideia de permanecer ou ser deixado em pequeno número.
- source_word: ܡ̇ܠܐ ܐܝܠܝܢ ܕܐܡܝܪ̈ܢ
  choice: estas palavras poderão ser ditas
  rationale: Conserva a referência às palavras pronunciadas e a modalidade potencial refletida pela tradição textual.
theological_decisions:
- issue: A coexistência entre pecado e vida
  choice: “muitos pecaram e viveram”
  alternative: “muitos pecaram e continuaram vivos”
  rationale: A formulação escolhida não explica se “viveram” significa longevidade, prosperidade ou simples sobrevivência; assim, preserva a tensão do texto.
- issue: Identidade dos poucos que restarão
  choice: Não identificar o grupo além do que o versículo declara
  alternative: Explicitar “poucos povos” ou “poucos justos”
  rationale: A evidência fornecida e a divisão do versículo não justificam resolver a referência de modo denominacional ou interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A coordenação “e que” deixa clara a relação entre as duas afirmações sem alterar seu conteúdo. Não foram mantidas as antigas notas inglesas, pois registravam leituras posteriormente corrigidas e já não representam alternativas sustentadas para este versículo.
