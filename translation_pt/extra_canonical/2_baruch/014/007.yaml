translation:
  language: pt
  text: Ou quem, ó Senhor, conhece o teu juízo? Ou quem pode sondar a profundidade do teu caminho?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܟ
  choice: o teu juízo
  rationale: O substantivo corresponde a “juízo” ou “julgamento”; “juízo” preserva a concisão e o sentido judicial do texto.
- source_word: ܠܡܒܥܐ ܥܘܡܩܐ ܕܐܘܪܚܟ
  choice: sondar a profundidade do teu caminho
  rationale: “Sondar” expressa a investigação profunda, e “a profundidade” conserva um elemento explícito do siríaco que não deve ser omitido.
theological_decisions:
- issue: Possibilidade humana de compreender o juízo e o caminho de Deus
  choice: Manter as perguntas retóricas sem explicitar uma resposta
  alternative: Parafrasear como uma afirmação direta de que ninguém os compreende
  rationale: A forma interrogativa preserva a tensão e a ênfase do original, sem acrescentar uma conclusão interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “Ou quem” conserva o paralelismo retórico do siríaco. Não se manteve a antiga alternativa “o que não te é conhecido”, pois ela decorre de leitura inadequada da fonte.
