  text: Or who among mortals can find the beginning and the end of your wisdom?
translation:
  language: pt
  text: Ou quem, entre os mortais, pode encontrar[a] o princípio e o fim da tua sabedoria?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “descobrir” ou “rastrear”.
    reason: O verbo significa primariamente encontrar ou descobrir; neste contexto, também pode transmitir a ideia de determinar ou rastrear os limites da sabedoria.
lexical_decisions:
- source_word: ܡܫܟܚ
  choice: pode encontrar
  rationale: O verbo siríaco tem o sentido básico de encontrar ou descobrir; com o auxiliar, expressa capacidade.
- source_word: ܒܢ̈ܝ ܐܢܫܐ
  choice: entre os mortais
  rationale: A expressão literalmente ligada aos seres humanos é vertida de modo natural e digno, destacando a limitação humana no contraste com a sabedoria divina.
- source_word: ܪܝܫܐ ... ܫܘܠܡܐ
  choice: o princípio e o fim
  rationale: Preserva o par abrangente da fonte, que se refere aos extremos ou à extensão total da sabedoria.
- source_word: ܚܟܡܬܟ
  choice: da tua sabedoria
  rationale: Mantém a referência direta, em segunda pessoa, à sabedoria de Deus.
theological_decisions:
- issue: Possibilidade humana de compreender a sabedoria divina
  choice: Manter a pergunta retórica sem explicação adicional
  alternative: Explicitar que ninguém pode compreender plenamente a sabedoria de Deus
  rationale: A fonte comunica a incompreensibilidade por meio de uma pergunta; convertê-la em afirmação explicativa eliminaria sua forma e acrescentaria interpretação.
translation_notes:
  register: Português atual, claro e solene, com ampla legibilidade brasileira. A construção “entre os mortais” é idiomática e preserva o contraste entre a limitação humana e a sabedoria divina.
