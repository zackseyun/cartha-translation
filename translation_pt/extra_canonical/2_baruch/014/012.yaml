review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha de perto o sentido atestado pela trilha inglesa: os justos têm esperança diante do fim, deixam a morada sem temor e possuem junto de Deus uma reserva de obras preservada em tesouros. Contudo, «celestiais» explicita um স্থান/qualificador que não está expresso na formulação fornecida («junto de ti ... em tesouros») e deve ser retirado. O excerto siríaco disponibilizado é um recorte de capítulo cuja delimitação do v. 12 é incerta, de modo que não sustenta com segurança esse acréscimo.'
  naturalness: «Esperar com razão o fim» pode ser entendido principalmente como aguardar o fim, não como ter esperança a seu respeito. «Ter justa esperança quanto ao fim» comunica melhor a modalidade de esperança. «Reserva de obras guardada em tesouros» é natural e conserva a metáfora sem duplicar desnecessariamente «tesouro/depósitos».
  terminology: «Justos», «fim», «morada» e «obras» são adequados e mantêm o registro bíblico. «Junto de ti» preserva a referência direta a Deus e a imagem relacional do texto.
  issues:
  - severity: medium
    issue: Acréscimo de «celestiais» a «depósitos».
    rationale: O qualificativo interpreta os tesouros como celestiais, mas não é expresso na tradução inglesa de controle nem é verificável no recorte siríaco de delimitação incerta. A imagem de tesouros sob a guarda de Deus já é preservada por «junto de ti».
  - severity: low
    issue: «Esperar com razão o fim» enfraquece a noção de esperança.
    rationale: Em português, a expressão pode significar apenas aguardar o fim. «Ter justa esperança quanto ao fim» torna explícito o valor esperançoso sem especificar se o fim é morte ou consumação escatológica.
  revised_text: Mas os justos podem ter justa esperança quanto ao fim e deixam esta morada sem medo, porque têm, junto de ti, uma reserva de obras guardada em tesouros.
