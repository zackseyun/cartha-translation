  text: But the righteous may rightly hope for the end, and they depart from this dwelling without fear, because they have with you a store of works kept in treasuries.
translation:
  language: pt
  text: Mas os justos podem ter justa esperança quanto ao fim e deixam esta morada sem medo, porque têm, junto de ti, uma reserva de obras guardada em tesouros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܕܝ̈ܩܐ (sentido contextual reconstruído)
  choice: os justos
  rationale: Mantém a designação ética tradicional e corresponde ao contraste contextual com os pecadores.
- source_word: ܣܟܐ / ܣܒܪ (sentido contextual)
  choice: esperar
  rationale: Expressa esperança confiante sem transformar a frase em certeza absoluta.
- source_word: ܫܘܠܡܐ
  choice: o fim
  rationale: Preserva a possível referência tanto ao fim da vida como ao desfecho escatológico.
- source_word: ܥܘܡܪܐ / ܡܫܪܝܐ (sentido contextual)
  choice: esta morada
  rationale: Conserva a metáfora da vida presente como habitação temporária.
- source_word: ܣܝܡܬܐ ... ܒܐܘܨܪ̈ܐ (sentido contextual)
  choice: um tesouro de obras guardado em depósitos celestiais
  rationale: Reproduz a imagem de boas obras acumuladas e preservadas diante de Deus; “celestiais” explicita o referente implícito do contexto.
theological_decisions:
- issue: Relação entre obras e esperança no fim
  choice: manter a linguagem de um tesouro de obras junto de Deus
  alternative: parafrasear como recompensa obtida por mérito
  rationale: O texto usa uma metáfora de obras armazenadas, mas não define um sistema de mérito nem explica o mecanismo da recompensa.
- issue: Sentido de “o fim”
  choice: preservar a expressão ampla
  alternative: traduzir especificamente por “a morte” ou “o fim dos tempos”
  rationale: A formulação pode abranger o término da vida e o desfecho escatológico; a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário bíblico amplamente compreensível. A redação segue a evidência contextual disponível, pois o recorte siríaco fornecido é um balde de capítulo com ordenação e delimitação do versículo incertas.
