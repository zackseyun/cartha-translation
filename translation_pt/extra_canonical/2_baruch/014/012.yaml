revisions:
- from: Mas os justos podem esperar com razão o fim e deixam esta morada sem medo, porque têm junto de ti um tesouro de obras guardado em depósitos celestiais.[a]
  to: Mas os justos podem ter justa esperança quanto ao fim e deixam esta morada sem medo, porque têm, junto de ti, uma reserva de obras guardada em tesouros.
  rationale: A revisão elimina a especificação não atestada «celestiais» e ajusta a primeira oração para transmitir de modo idiomático a esperança dos justos em relação ao fim. A metáfora deliberadamente ampla de uma reserva de obras guardada em tesouros é mantida; não é necessário acrescentar nota variante.
