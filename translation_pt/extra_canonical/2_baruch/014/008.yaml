  text: Or who can learn your judgment, or search out the depth of your way, or calculate the weight of your path, or comprehend your counsel which cannot be grasped?
translation:
  language: pt
  text: Ou quem pode conhecer o teu juízo? Ou sondar a profundidade do teu caminho? Ou calcular o peso da tua vereda? Ou compreender o teu conselho, que não pode ser compreendido?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra formulação, registrada em tradução anterior: “Ou quem pode conhecer o teu juízo ou compreender o teu conselho, que não pode ser compreendido?”'
    reason: Registra a formulação anterior sem sugerir que as cláusulas sobre a profundidade do caminho e o peso da vereda possam ser omitidas da tradução principal.
lexical_decisions:
- source_word: ܝܘܠܦܢܘ / ܕܡܠܟܟ (texto transmitido de leitura difícil)
  choice: conhecer o teu juízo
  rationale: Segue o sentido atestado pela tradição textual e pela camada inglesa auditada; “conhecer” é mais natural em português do que “aprender” neste contexto retórico.
- source_word: ܥܘܡܩܐ ܕܐܘܪܚܟ (reconstrução subjacente à revisão auditada)
  choice: sondar a profundidade do teu caminho
  rationale: Preserva a imagem espacial e a ideia de investigar algo insondável.
- source_word: ܬܘܩܠܐ ܕܫܒܝܠܟ (reconstrução subjacente à revisão auditada)
  choice: calcular o peso da tua vereda
  rationale: Mantém a metáfora incomum de peso e evita normalizá-la indevidamente.
- source_word: ܬܪܥܝܬܟ ܕܠܐ ܡܬܕܪܟܐ
  choice: o teu conselho, que não se pode alcançar
  rationale: “Conselho” comunica propósito ou desígnio; a oração relativa preserva explicitamente sua inacessibilidade.
theological_decisions:
- issue: Insondabilidade do juízo e do propósito divinos
  choice: Manter as quatro perguntas/imagens em uma única pergunta retórica, sem explicar como se relacionam.
  alternative: Resumir tudo como “quem pode compreender os teus desígnios?”
  rationale: A formulação mais extensa conserva a tensão poética e teológica do texto, bem como as duas cláusulas antes omitidas.
- issue: Possível divisão textual da cláusula final
  choice: Incluir neste versículo a cláusula sobre o conselho incompreensível.
  alternative: Transferi-la para o início do versículo 9.
  rationale: Segue a versificação fornecida e a revisão auditada, embora a delimitação possa variar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “tu” em continuidade com a invocação direta a Deus e preserva as metáforas pouco comuns do original.
