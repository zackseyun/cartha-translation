  yaml_path: translation/extra_canonical/2_baruch/014/001.yaml
  text: Then I answered and said, “Behold, you have shown me the course of the times, and what is to happen after these things, and you have told me that the retribution which was spoken of by you will come upon the nations.
translation:
  language: pt
  text: 'Então respondi: “Eis que me mostraste o curso dos tempos e o que acontecerá depois destas coisas; e me disseste que a retribuição que anunciaste virá sobre as nações.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Formulação alternativa anterior: “e me falaste da retribuição que há de vir”.'
    reason: Registra a formulação mais compacta do histórico editorial, sem apresentá-la como equivalente plena da leitura principal, que conserva os elementos explícitos do anúncio divino e das nações.
lexical_decisions:
- source_word: ܐܘܪܚܐ
  choice: curso
  rationale: No contexto apocalíptico, o termo descreve o desenrolar ordenado dos tempos, não apenas um caminho literal.
- source_word: ܦܘܪܥܢܐ
  choice: retribuição
  rationale: Preserva a ideia judicial de justa paga ou resposta divina, sem restringi-la à noção mais estreita de castigo.
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: depois destas coisas
  rationale: Mantém de modo natural a sequência temporal expressa pelo siríaco.
theological_decisions:
- issue: Caráter judicial do anúncio
  choice: retribuição
  alternative: castigo
  rationale: A formulação conserva a dimensão de justiça e paga divina sem determinar além do texto a forma específica do juízo.
- issue: Alcance da retribuição anunciada
  choice: virá sobre as nações
  alternative: está para vir
  rationale: A leitura principal conserva explicitamente o objeto do juízo atestado pelo controle textual, sem generalizá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. “Eis que” preserva o tom solene da visão, enquanto “curso dos tempos” comunica naturalmente a ordem apocalíptica dos acontecimentos.
