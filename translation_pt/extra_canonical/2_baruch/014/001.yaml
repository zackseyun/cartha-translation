revisions:
- from: 'Então respondi: “Eis que me mostraste o curso dos tempos e o que acontecerá depois destas coisas; e me disseste que a retribuição da qual falaste virá sobre as nações.[a]”'
  to: 'Então respondi: “Eis que me mostraste o curso dos tempos e o que acontecerá depois destas coisas; e me disseste que a retribuição que anunciaste virá sobre as nações.[a]”'
  rationale: A revisão explicita que Deus é o agente que anunciou a retribuição e ajusta a nota para que sua forma abreviada não pareça omitir sem ressalva elementos do texto. O sentido, a ambiguidade textual e o registro da passagem são preservados.
  reviewer_model: gpt-5.6-terra
