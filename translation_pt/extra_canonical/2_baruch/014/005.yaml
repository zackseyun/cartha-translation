lexical_decisions:
- source_word: ܣܪܝܩܘܬܗܘܢ ܕܡܝ̈ܬܐ (reconstructed from the chapter context and control evidence)
  choice: a vaidade dos mortos
  rationale: Preserva o substantivo siríaco com o sentido de vazio, vaidade ou futilidade, evitando reduzi-lo a simplesmente «os mortos».
- source_word: ܨܒܝܢܝ
  choice: desejaram a ti
  rationale: Mantém o objeto divino e o sentido volitivo forte do verbo; a formulação elevada é natural no registro bíblico.
- source_word: ܙܥܘܪܘ ... ܥܒܪ
  choice: aquilo que é pequeno e passageiro
  rationale: Expressa os dois aspectos coordenados — insignificância e transitoriedade — sem resolver sua referência de modo mais específico que o texto.
theological_decisions:
- issue: Referência de «a vaidade dos mortos»
  choice: Manter a expressão genitiva ambígua
  alternative: «as vaidades procuradas pelos mortos» ou «buscar os mortos»
  rationale: O genitivo pode indicar a vaidade associada aos mortos sem especificar exatamente a relação; a tradução não deve impor uma interpretação necromântica nem eliminá-la por completo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência bíblica. O pronome tônico «a ti» preserva a referência direta a Deus. O marcador [a] aparece no texto junto à expressão pertinente.
