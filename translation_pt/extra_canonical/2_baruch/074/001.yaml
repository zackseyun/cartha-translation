revisions:
- from: '1. E acontecerá naqueles dias: os ceifeiros não se cansarão, e os construtores não labutarão; pois as obras avançarão por si mesmas com aqueles que as realizam, em grande tranquilidade.'
  to: '1. E será naqueles dias: os ceifeiros não se cansarão, e os construtores não labutarão; pois as obras prosseguirão por si mesmas, juntamente com os que as realizam, em grande tranquilidade.'
  rationale: A revisão restringe-se à idiomaticidade portuguesa. “Prosseguirão” expressa o avanço continuado das obras, e “juntamente com os que as realizam” torna inteligível a associação, deliberadamente extraordinária, entre as obras e seus realizadores. Nenhuma interpretação doutrinária foi acrescentada.
