base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/074/001.yaml
  text: '1. And it shall be in those days: the reapers will not grow weary, and the builders will not labor; for the works will move forward of themselves with those who do them, in much tranquility.'
translation:
  language: pt
  text: '1. E será naqueles dias: os ceifeiros não se cansarão, e os construtores não labutarão; pois as obras prosseguirão por si mesmas, juntamente com os que as realizam, em grande tranquilidade.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܨܘܕ̈ܐ / termo siríaco provável para ceifeiros, preservado pelo testemunho de controle na fronteira do capítulo
  choice: os ceifeiros
  rationale: Mantém a imagem agrária concreta do cenário de abundância escatológica, sem generalizá-la para trabalhadores rurais em sentido amplo.
- source_word: ܒܢܝ̈ܐ / termo siríaco provável para construtores, preservado pelo testemunho de controle
  choice: os construtores
  rationale: Reproduz diretamente a imagem paralela à dos ceifeiros e evita o termo genérico “trabalhadores”.
- source_word: ܠܐ ܢܠܐܘܢ ... ܠܐ ܢܥܡܠܘܢ / non fatigabuntur ... neque laborabunt
  choice: não se cansarão ... não labutarão
  rationale: Conserva a distinção e o equilíbrio rítmico entre o cansaço dos ceifeiros e o labor penoso dos construtores.
- source_word: sponte erunt currentia opera / expressão correspondente no testemunho de controle
  choice: as obras avançarão por si mesmas
  rationale: Preserva a imagem extraordinária de execução espontânea sem sugerir mecanização literal.
- source_word: tranquillitate multa / expressão correspondente no testemunho de controle
  choice: em grande tranquilidade
  rationale: Comunica a atmosfera de calma e ordem restaurada, em harmonia com o contexto imediato.
theological_decisions:
- issue: Intensidade do caráter espontâneo do trabalho na era messiânica
  choice: as obras avançarão por si mesmas
  alternative: as obras prosperarão; o trabalho será fácil
  rationale: O testemunho de controle descreve mais que simples êxito ou facilidade. A formulação conserva a imagem apocalíptica de uma criação restaurada, sem transformá-la em afirmação técnica sobre automação.
- issue: Sentido da expressão atmosférica final
  choice: em grande tranquilidade
  alternative: em grande paz; em profundo descanso
  rationale: “Tranquilidade” preserva tanto a ausência de esforço penoso quanto a calma abrangente do cenário, sem reduzir a passagem à mera produtividade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Labutarão” mantém o contraste verbal e o tom literário sem arcaísmo excessivo. A construção menos habitual “com aqueles que as realizam” foi conservada para não eliminar a tensão da formulação testemunhal.
