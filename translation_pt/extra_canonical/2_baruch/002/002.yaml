  language: pt
  text: Pois as tuas obras são para esta cidade como uma coluna firme, e a tua oração, como uma muralha forte.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒ̈ܕܝܟ (leitura contextual; o texto fornecido está graficamente corrompido neste ponto)
  choice: tuas obras
  rationale: A leitura se harmoniza com o paralelismo da frase e com a tradição textual controlada; “obras” preserva o sentido amplo de atos ou feitos.
- source_word: ܨܠܘܬܟ (leitura contextual; forma corrompida na transcrição fornecida)
  choice: a tua oração
  rationale: Mantém o singular atestado pela leitura revisada e o paralelismo com “tuas obras”.
- source_word: ܥܡܘܕܐ ...
  choice: uma coluna firme
  rationale: Expressa de modo natural a imagem de sustentação e estabilidade associada à cidade.
- source_word: ܫܘܪܐ ܚܠܝܬܐ (leitura contextual)
  choice: uma muralha forte
  rationale: “Muralha” é mais apropriado do que “parede” no contexto defensivo de uma cidade; “forte” comunica solidez.
theological_decisions:
- issue: Função protetora das obras e da oração de Baruque
  choice: Preservar as duas comparações sem explicar seu mecanismo teológico
  alternative: Interpretá-las explicitamente como mérito vicário ou intercessão eficaz
  rationale: O verso emprega imagens de sustentação e defesa, mas não define uma doutrina técnica de mérito ou intercessão; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa do singular adequadas ao discurso direto dirigido a Baruque. A elipse de “é” na segunda comparação produz paralelismo natural sem alterar o sentido.
