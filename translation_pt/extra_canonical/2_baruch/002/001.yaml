lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ
  choice: todos os que são como vocês
  rationale: Conserva a comparação pessoal e concreta do siríaco, usando o plural «vocês» porque o texto passa do destinatário individual para Baruc, Jeremias e os que se assemelham a eles.
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ
  choice: saiam
  rationale: Traduz de modo natural o idiomatismo siríaco que ordena ao grupo afastar-se da cidade, sem reproduzir literalmente uma construção obscura em português.
