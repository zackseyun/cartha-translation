base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/017/001.yaml
  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
translation:
  language: pt
  text: 'E o Senhor respondeu e me disse[a]: “Para o Altíssimo, não há contagem de muitos ou poucos anos. Pois que proveito teve Adão de viver novecentos e trinta anos, se transgrediu o que lhe havia sido ordenado? Assim, a longa duração de sua vida não lhe trouxe benefício; ao contrário, trouxe a morte e abreviou os anos dos que nasceram dele. E que faltou a Moisés por ter vivido apenas cento e vinte anos? Por estar sujeito àquele que o formou, ele aproximou a Lei dos descendentes de Jacó e acendeu uma lâmpada para o povo de Israel.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E o Senhor me disse”.'
    reason: Há uma tradição de tradução mais breve, embora o texto siríaco aqui apresentado inclua o verbo “respondeu”.
lexical_decisions:
- source_word: ܡܢܝܗܝ
  choice: não se faz conta
  rationale: Expressa de modo natural a ideia de contagem ou consideração dos anos diante do Altíssimo, conservando a possível nuance de avaliação.
- source_word: ܙܒܘ̈ܢܝ / ܫ̈ܢܝܗܝ
  choice: muitos ou poucos anos
  rationale: Mantém o contraste temporal indicado pelo texto, apesar da transmissão gráfica pouco nítida neste ponto.
- source_word: ܡܘܬܪܐ
  choice: proveito / benefício
  rationale: O contexto pergunta pela vantagem real de uma vida longa; estes termos comunicam o sentido moral sem impor uma conotação comercial.
- source_word: ܡܒܣܪܝܢ
  choice: acendeu
  rationale: Em combinação com “uma lâmpada”, preserva de forma clara e vívida a imagem de iluminação.
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  choice: povo de Israel
  rationale: O referente final é coletivo; esta formulação é natural em português e mantém a dimensão comunitária e nacional.
- source_word: ܩܪܒ ܢܡܘܣܐ
  choice: aproximou a Lei
  rationale: Conserva a metáfora espacial do siríaco, segundo a qual Moisés tornou a Lei próxima ou acessível aos descendentes de Jacó.
theological_decisions:
- issue: Valor moral da duração da vida
  choice: A extensão da vida, por si só, não traz benefício quando há transgressão; a fidelidade dá valor ao tempo vivido.
  alternative: Entender o texto apenas como comparação biográfica entre Adão e Moisés, sem formular um princípio mais amplo.
  rationale: As perguntas retóricas e o contraste entre a longevidade de Adão e a vida mais curta de Moisés sustentam o princípio, sem atribuir valor salvífico à duração da vida.
- issue: Relação da morte com Adão e seus descendentes
  choice: Manter que a transgressão de Adão trouxe a morte e abreviou os anos dos que nasceram dele.
  alternative: Explicitar uma doutrina posterior sobre culpa herdada ou mortalidade universal.
  rationale: A tradução conserva a afirmação causal do texto, mas não acrescenta uma formulação dogmática que o verso não enuncia diretamente.
- issue: Moisés como portador de luz
  choice: A lâmpada representa a orientação reveladora levada por Moisés a Israel, em paralelo com a aproximação da Lei.
  alternative: Interpretar a lâmpada exclusivamente como a pessoa e o exemplo moral de Moisés.
  rationale: A justaposição da Lei e da lâmpada favorece a ideia de revelação e orientação, mas a imagem permanece metafórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregaram-se “Diante do Altíssimo”, “ao contrário” e perguntas retóricas naturais; preservaram-se as imagens de aproximar a Lei e acender uma lâmpada.
