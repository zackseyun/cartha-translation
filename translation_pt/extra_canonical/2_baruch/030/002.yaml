base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030/002.yaml
  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: pt
  text: E acontecerá, naquele tempo, que serão abertos os depósitos onde está guardado o número das almas dos justos[a], e elas sairão. As multidões de almas serão vistas juntas, numa só reunião e com um só pensamento. A primeira se alegrará, e a última não se entristecerá[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “o número das almas dos justos” também pode comunicar a ideia do total determinado delas.
    reason: Explica uma possível força semântica de “número” sem incorporá-la como interpretação obrigatória.
  - marker: b
    text: O texto diz literalmente “a primeira” e “a última”; o referente dessas formas femininas não é totalmente claro, podendo apontar para a primeira e a última alma ou para grupos mencionados de maneira coletiva.
    reason: Preserva e documenta uma ambiguidade gramatical e referencial real do texto.
lexical_decisions:
- source_word: ܙܒܢܐ (zabnā)
  choice: tempo
  rationale: Equivalente natural e amplo para o período escatológico indicado pelo contexto.
- source_word: ܢܦ̈ܫܬܐ / ܢܦܫ̈ܬܐ (napšātā)
  choice: almas
  rationale: Mantém a referência às pessoas justas em seu estado incorpóreo, sem substituir o termo por uma interpretação teológica mais específica.
- source_word: ܡܢܝܢܐ (menyānā)
  choice: número
  rationale: Preserva a formulação concreta da tradição siríaca, que pode indicar tanto a contagem quanto o total determinado.
- source_word: ܟܢܘܫܝܐ / ܟܢܫܐ (kenušyā/kenšā)
  choice: reunidas num só lugar
  rationale: Expressa de modo natural a ideia de uma única reunião ou assembleia, sem sugerir uma instituição formal.
- source_word: ܚܕ ܪܥܝܢܐ (ḥad reʿyānā), conforme a leitura textual subjacente
  choice: com um só pensamento
  rationale: Conserva a imagem de unidade mental ou de propósito, em vez de a reduzir simplesmente a harmonia.
theological_decisions:
- issue: O sentido de “o número das almas dos justos”
  choice: Manter literalmente “o número”
  alternative: Traduzir como “a totalidade” ou “o número completo”
  rationale: O texto admite a noção de um total fixado, mas não é necessário explicitar essa interpretação no corpo da tradução.
- issue: A identidade de “a primeira” e “a última”
  choice: Preservar as formas femininas singulares sem acrescentar um referente
  alternative: Interpretar como “os primeiros” e “os últimos” ou “as primeiras e as últimas almas”
  rationale: O siríaco apresenta formas femininas singulares, mas o referente preciso não é inequívoco; a tradução mantém essa tensão e a nota informa a dificuldade.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Depósitos” foi preferido a “tesouros” para designar lugares de guarda, evitando a impressão de riquezas materiais. A repetição de “almas” foi mantida por clareza e fidelidade ao caráter visionário da passagem.
