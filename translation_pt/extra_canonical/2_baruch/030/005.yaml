  text: For they know that their torment has come, and that their destruction has arrived.
translation:
  language: pt
  text: Pois elas sabem que chegou o seu tormento e que veio a sua destruição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܢܩܗܘܢ (šūnāqhon)
  choice: seu tormento
  rationale: Expressa sofrimento ou suplício imposto, preservando a força judicial e escatológica do termo.
- source_word: ܐܒܕܢܗܘܢ (ʾabdānhon)
  choice: sua destruição
  rationale: Transmite a ideia de ruína ou perdição sem definir além do que o termo permite a natureza final desse destino.
- source_word: ܡܛܐ / ܐܕܪܟ (verbos de chegada)
  choice: chegou / veio
  rationale: Mantém o paralelismo com verbos distintos e apresenta os acontecimentos como já iminentes ou realizados do ponto de vista das almas mencionadas.
theological_decisions:
- issue: Natureza do destino dos ímpios
  choice: destruição
  alternative: perdição
  rationale: “Destruição” preserva a noção de ruína do texto sem resolver se ela implica aniquilação, condenação contínua ou outro entendimento escatológico.
- issue: Referente do pronome feminino plural
  choice: elas
  alternative: omitir o pronome
  rationale: O contexto identifica como referente as almas dos ímpios; o pronome explícito torna a frase natural em português sem acrescentar uma interpretação nova.
translation_notes:
  register: Português moderno, claro e digno. A repetição paralela “chegou... veio” conserva a cadência solene do enunciado e evita harmonizar os dois membros.
