base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030/001.yaml
  text: And it will happen after these things, when the time of the coming of the Messiah is completed and he returns with glory, then all those who sleep in hope of him will rise.
translation:
  language: pt
  text: 1 Depois dessas coisas, quando se completar o tempo da vinda do Messias e ele voltar com glória, todos os que dormem na esperança nele se levantarão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܐܬܝܬܗ ܕܡܫܝܚܐ
  choice: a vinda do Messias
  rationale: Reproduz diretamente a expressão siríaca para a chegada ou vinda do Messias, em linguagem portuguesa corrente e solene.
- source_word: ܢܬܦܣܩ
  choice: se completar
  rationale: No contexto temporal, comunica a ideia de o período chegar ao seu termo, sem sugerir simplesmente que foi interrompido.
- source_word: ܕܡܟܝܢ / tradição textual correspondente aos que dormem
  choice: os que dormem
  rationale: Preserva a metáfora antiga do sono para a morte, em vez de explicá-la no corpo do texto.
- source_word: ܢܩܘܡܘܢ / tradição textual correspondente
  choice: se levantarão
  rationale: Mantém o sentido concreto de levantar-se, com sua implicação de ressurreição, sem tornar a formulação mais interpretativa do que a fonte.
theological_decisions:
- issue: Relação entre a conclusão do tempo messiânico e o retorno glorioso
  choice: quando se completar o tempo da vinda do Messias e ele voltar com glória
  alternative: quando se cumprir o tempo da vinda do Messias, ele retornará em glória
  rationale: A redação escolhida mantém as ações coordenadas e segue a versificação fornecida, sem definir de modo adicional a duração ou as etapas da atuação messiânica.
- issue: Esperança dos mortos
  choice: dormem na esperança nele
  alternative: morreram esperando por ele
  rationale: Preserva tanto a imagem do sono quanto a formulação teologicamente aberta da esperança dirigida ao Messias.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase conserva a cadência apocalíptica e a metáfora do sono, evitando explicações confessionais.
