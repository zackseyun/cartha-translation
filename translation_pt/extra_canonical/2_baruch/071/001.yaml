  text: And the holy land shall have mercy on its own, and at that time it shall protect its inhabitants.
translation:
  language: pt
  text: 1. E a terra santa terá misericórdia dos seus e, naquele tempo, protegerá os seus habitantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: a terra santa
  rationale: Mantém a personificação apocalíptica da terra e seu peso pactual, em formulação consagrada e natural em português.
- source_word: ܬܪܚܡ
  choice: terá misericórdia de
  rationale: Expressa compaixão ativa e preserva o tom solene, sem reduzir o verbo a mero sentimento.
- source_word: ܕܝܠܗ̇
  choice: dos seus
  rationale: Reproduz de modo conciso o sentido idiomático de pertencimento, sem explicitar além do que o texto permite quem são esses pertencentes.
- source_word: ܬܢܛܪ
  choice: protegerá
  rationale: Comunica com clareza a ideia de guardar e manter em segurança, adequando-se à promessa de preservação.
theological_decisions:
- issue: Manter a terra como sujeito agente
  choice: a terra santa terá misericórdia dos seus
  alternative: Deus terá misericórdia dos seus por meio da terra
  rationale: A leitura preserva a personificação apocalíptica atestada pela tradição siríaca, sem substituir o sujeito nem explicar teologicamente a imagem.
- issue: Identidade daqueles que pertencem à terra
  choice: dos seus
  alternative: do seu povo
  rationale: A forma concisa conserva a ambiguidade do idioma de pertencimento e evita identificar de modo mais específico um referente que o verso não nomeia.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “seus/os seus” foi mantida por refletir duas relações distintas no texto: os que pertencem à terra e os que nela habitam. O trecho siríaco reproduzido no pacote está desalinhado e corresponde a material anterior; por isso, a redação segue a evidência lexical da tradição siríaca de 2 Baruque 71:1 registrada nos controles fornecidos, em concordância com a revisão crítica mais recente.'
