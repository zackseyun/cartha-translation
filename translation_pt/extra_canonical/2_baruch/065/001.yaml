  yaml_path: translation/extra_canonical/2_baruch/065/001.yaml
  text: And after Manasseh, Amon arose, and in his own time he thought that the Mighty One would not call these things to account.
translation:
  language: pt
  text: Depois de Manassés, surgiu Amom, que, em seu tempo, pensava que o Poderoso não pediria contas dessas coisas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘܐ ܐܡܘܢ
  choice: surgiu Amom
  rationale: A expressão indica que Amom veio depois de Manassés; “surgiu” preserva essa sucessão sem acrescentar a ideia, não sustentada pelo siríaco, de que ele “agiu impiamente”.
- source_word: ܘܡܬܚܫܒ
  choice: pensava
  rationale: O verbo descreve a avaliação ou suposição interior de Amom, e não uma declaração pública.
- source_word: ܒܙܒܢܗ
  choice: em seu tempo
  rationale: Mantém a referência ao período próprio de Amom em linguagem portuguesa natural.
- source_word: ܚܝܒܘܬܐ
  choice: pediria contas
  rationale: A formulação conserva o sentido judicial da passagem sem restringi-lo indevidamente a uma punição já executada.
theological_decisions:
- issue: Título divino expresso na camada de consulta como “the Mighty One”
  choice: o Poderoso
  alternative: o Todo-Poderoso
  rationale: “O Poderoso” preserva o título sem importar a forma mais específica “Todo-Poderoso”, que poderia sugerir uma equivalência lexical mais estreita do que a evidência disponível permite.
translation_notes:
  register: Português moderno, digno e de leitura fluente. A redação evita a antiga alternativa “Amom agiu impiamente”, pois ela não tem apoio no texto siríaco apresentado. Não se acrescentou nota de rodapé, já que essa alternativa é uma correção descartada, não uma ambiguidade genuína a preservar.
