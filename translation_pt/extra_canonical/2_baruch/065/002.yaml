base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/065/002.yaml
  text: For he committed much impiety, and he killed the righteous, and he perverted the law, and he shed innocent blood, and he polluted the sanctuary, and he caused the people to sin.
translation:
  language: pt
  text: Pois ele cometeu muita impiedade, matou os justos, perverteu a justiça, derramou sangue inocente, profanou o santuário e levou o povo a pecar muito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܛܝܬܐ / campo semântico de impiedade no trecho corrompido
  choice: impiedades
  rationale: Preserva o caráter amplo e reiterado da maldade atribuída a Manassés, sem restringi-la a um único delito.
- source_word: ܙܕܝ̈ܩܐ
  choice: os justos
  rationale: Equivalente direto e tradicional para os que são caracterizados como justos.
- source_word: ܢܡܘܣܐ / conceito de lei na tradição textual do versículo
  choice: a Lei
  rationale: A inicial maiúscula indica a Lei religiosa de Israel, e não legislação em sentido genérico.
- source_word: ܕܡܐ ... ܕܠܐ [culpa]
  choice: sangue inocente
  rationale: Expressão portuguesa natural para a fórmula semítica referente ao sangue de pessoas sem culpa.
- source_word: conceito de profanação do santuário
  choice: profanou o santuário
  rationale: Comunica violação da santidade cultual com clareza e dignidade.
- source_word: conceito causativo de fazer o povo pecar
  choice: levou o povo a pecar
  rationale: Mantém a responsabilidade causativa de Manassés sem sugerir que o povo tenha sido coagido de modo irresistível.
theological_decisions:
- issue: Referência da palavra traduzida por “Lei”
  choice: a Lei
  alternative: a lei
  rationale: O contexto da impiedade de Manassés favorece a referência à Lei de Israel, mas a formulação não acrescenta uma identificação denominacional.
- issue: Causalidade no pecado do povo
  choice: levou o povo a pecar
  alternative: fez o povo pecar
  rationale: A opção escolhida conserva a influência causativa do rei e, ao mesmo tempo, evita resolver além do texto a questão da agência moral do povo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A sequência coordenada reproduz o efeito cumulativo da acusação. Não foram mantidas as notas inglesas anteriores, pois documentavam uma leitura desalinhada de 65:1, não uma ambiguidade textual genuína de 65:2.
