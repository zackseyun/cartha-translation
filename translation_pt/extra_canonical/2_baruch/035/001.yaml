  yaml_path: translation/extra_canonical/2_baruch/035/001.yaml
  text: 'And I, Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and eyelids of water, a fountain of tears.

    For how can I find rest over Zion?

    And how can I weep for Jerusalem?

    For the people whom I nourished

    and who were formerly greater than I in vision

    have been shaken with trembling.”'
translation:
  language: pt
  text: 'E eu, Baruque, fui até o portão santo. Sentei-me humildemente, chorei e disse:


    “Ó meus olhos, tornem-se nascentes;


    e minhas pálpebras, fontes de água,


    mananciais de lágrimas.


    Pois como poderei encontrar descanso por Sião?


    E como poderei chorar por Jerusalém?[a]


    Pois o povo que eu sustentei,


    e que antes era maior do que eu em visão,


    foi sacudido com tremor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E como poderei chorar pelo luto e encontrar descanso?” O texto siríaco desta linha é incerto.'
    reason: A leitura do texto transmitido pode apontar para “luto” em vez de “Jerusalém”; a nota registra a alternativa sem perder no texto principal o provável paralelismo com Sião.
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  choice: o portão santo
  rationale: O substantivo siríaco designa concretamente um portão ou uma porta. “Portão santo” preserva a imagem do acesso ao recinto sagrado sem generalizá-la como “lugar santo”.
- source_word: ܡ̈ܟܝܟܐܝܬ
  choice: humildemente
  rationale: O advérbio expressa humildade, abatimento ou condição rebaixada. “Humildemente” é natural em português e conserva a postura de lamento.
- source_word: ܡܒܘ̈ܥܐ
  choice: nascentes
  rationale: O plural descreve fontes de onde a água brota. “Nascentes” mantém a imagem viva e o paralelismo poético.
- source_word: ܐܡܘ̈ܬܐ
  choice: pálpebras
  rationale: A tradição de controle favorece a leitura de uma parte do corpo. “Pálpebras” forma uma imagem compreensível das lágrimas que fluem dos olhos, embora a construção siríaca seja incomum.
- source_word: ܐܬܬܢܝܚ
  choice: encontrar descanso
  rationale: O verbo pode indicar repouso, alívio ou consolo. “Encontrar descanso” preserva a tensão do lamento sem limitar o sentido apenas a consolo emocional.
- source_word: ܐܒܠܐ
  choice: Jerusalém
  rationale: O texto visível pode ser lido como “luto”, mas parece textualmente instável. “Jerusalém” foi adotado para preservar o provável paralelismo Sião/Jerusalém, com a incerteza registrada em nota.
- source_word: ܐܢܫܐ
  choice: o povo
  rationale: Aqui o termo coletivo se refere às pessoas ligadas a Baruque. “O povo” permite manter em português a referência coletiva e a sequência verbal no singular.
- source_word: ܒܙܘܥܐ ܐܬܬܙܝܥ
  choice: foi sacudido com tremor
  rationale: A repetição da raiz de agitação intensifica a imagem. A formulação portuguesa conserva tanto o abalo quanto o tremor sem suavizar a expressão.
theological_decisions:
- issue: Identificação de ܐܒܠܐ na segunda pergunta poética
  choice: Jerusalém
  alternative: o luto / o pranto
  rationale: A leitura “Jerusalém” produz o esperado paralelismo com Sião, mas não é apresentada como indiscutível; a nota preserva a leitura formalmente refletida no texto siríaco transmitido.
- issue: Relação de Baruque com o povo
  choice: “o povo que eu sustentei”
  alternative: “as pessoas que eram sustentadas”
  rationale: A redação de consulta entende a expressão como uma declaração de cuidado de Baruque pelo povo. A tradução mantém essa relação sem lhe atribuir uma função doutrinária ou sacerdotal não explicitada no verso.
- issue: Comparação “maior do que eu em visão”
  choice: preservar a formulação ambígua
  alternative: interpretar “visão” como autoridade profética ou aparência física
  rationale: O siríaco é difícil, e o texto não define em que sentido o povo era “maior” em visão. A tradução evita resolver essa tensão por meio de uma interpretação teológica específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência poética no lamento. Empregou-se “Baruque”, forma tradicional em português, e “portão santo” para conservar a concretude do siríaco. A sintaxe das imagens dos olhos e das pálpebras foi levemente completada em português para ser inteligível, sem eliminar sua estranheza poética. O marcador [a] aparece no texto principal.
