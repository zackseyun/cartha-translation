  terminology: “Baruque”, “portão santo”, “Sião”, “Jerusalém”, “nascentes”, “pálpebras” e “encontrar descanso” são escolhas adequadas e consistentes com as decisões lexicais. “Por Sião” é mais conciso e idiomático no lamento do que “por causa de Sião”, sem definir excessivamente a relação expressa pelo siríaco.
