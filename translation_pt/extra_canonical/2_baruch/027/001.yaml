  - severity: medium
    issue: Nota da oitava parte não esclarece a ambiguidade
    rationale: A nota proposta (“espíritos e demônios de aparições”) não torna clara uma alternativa de agrupamento para os genitivos. A dificuldade pode ser exposta de forma útil com a alternativa “espíritos, demônios e aparições”, assinalando que ela depende de outra análise sintática.
