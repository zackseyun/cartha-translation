base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/027/001.yaml
  text: 'And I answered and said to him, “After this, that time is divided into twelve parts, and each one of them is known for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending forth of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and of demons of apparitions. In the ninth part: the fall of fire. In the tenth part: plundering and much oppression.”'
translation:
  language: pt
  text: 'E respondi e lhe disse: “Depois disso, aquele tempo está dividido em doze partes, e cada uma delas é identificada pelo que nela foi estabelecido. Na primeira parte: o início das convulsões. Na segunda parte: a matança dos grandes. Na terceira parte: a queda de muitos. Na quarta parte: o envio da espada. Na quinta parte: fome. Na sexta parte: terremotos. Na sétima parte: terrores e pragas. Na oitava parte: investidas de espíritos e de demônios de aparições.[a] Na nona parte: a queda de fogo. Na décima parte: pilhagem e muita opressão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sequência siríaca é difícil; também pode ser entendida como: “investidas de espíritos, de demônios e de aparições”.'
    reason: A construção admite mais de um agrupamento dos termos genitivos. O texto principal preserva de perto a sequência do siríaco, enquanto a nota registra a alternativa sem decidir além do que o texto permite.
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  choice: está dividido em doze partes
  rationale: Embora o numeral esteja instável no testemunho visível, a sequência ordenada e a tradição de controle sustentam o esquema de doze partes.
- source_word: ܡܬܬܝܕܥܐ
  choice: é conhecida
  rationale: Mantém a formulação passiva e a tensão entre reconhecimento e destinação, esclarecida pela oração seguinte.
- source_word: ܙ̈ܘܥܐ
  choice: convulsões
  rationale: Indica perturbações amplas e não confunde esta primeira calamidade com os terremotos explicitamente nomeados na sexta parte.
- source_word: ܪ̈ܘܪܒܢܐ
  choice: os grandes
  rationale: Preserva a referência ampla a pessoas de destaque social ou político, sem especificar indevidamente nobres ou poderosos.
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  choice: o envio da espada
  rationale: Conserva a imagem ativa da espada enviada, em vez de reduzi-la genericamente à guerra.
- source_word: ܬܗܪ̈ܐ
  choice: terrores
  rationale: Expressa o caráter pavoroso do termo no catálogo apocalíptico.
- source_word: ܡܚܘ̈ܬܐ
  choice: pragas
  rationale: Transmite o sentido coletivo de golpes ou flagelos calamitosos em linguagem natural.
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ
  choice: ataques de espíritos
  rationale: A frase é difícil, mas o contexto favorece atividade espiritual hostil; 'ataques' preserva essa força sem naturalizar a imagem.
- source_word: ܫ̈ܐܕܐ
  choice: demônios
  rationale: Equivalente português transparente para os seres demoníacos explicitamente nomeados.
- source_word: ܦܪ̈ܨܘܦܐ
  choice: aparições
  rationale: Embora possa significar rostos ou formas, 'aparições' comunica melhor as manifestações visíveis e inquietantes neste contexto.
- source_word: ܚܛܘܦܝܐ
  choice: pilhagem
  rationale: Expressa a tomada violenta de bens de modo claro e corrente.
- source_word: ܐܢܘܣܝܐ
  choice: opressão
  rationale: Representa o sofrimento coercitivo e combina naturalmente com 'pilhagem' no registro profético.
theological_decisions:
- issue: Esquema numérico das calamidades
  choice: doze partes
  alternative: trinta tempos ou períodos, segundo a aparência do texto instável do corpus
  rationale: A enumeração subsequente e a tradição textual de controle apoiam fortemente o esquema de doze partes.
- issue: Seres sobrenaturais na oitava parte
  choice: manter espíritos, demônios e aparições como entidades da retórica apocalíptica
  alternative: interpretá-los como terrores psicológicos ou calamidades inteiramente naturais
  rationale: O siríaco nomeia explicitamente seres demoníacos e manifestações relacionadas; a tradução não deve eliminar essa dimensão sobrenatural.
- issue: Relação sintática entre demônios e aparições
  choice: “demônios de aparições”, com nota sobre a construção ambígua
  alternative: “demônios e aparições”
  rationale: A construção do texto permite mais de um agrupamento semântico; o texto principal segue de perto os genitivos, e a nota preserva a alternativa idiomática.
translation_notes:
  register: Português moderno, digno e acessível, com léxico apocalíptico preservado. Empregaram-se “convulsões” para distinguir a primeira série de perturbações dos “terremotos” da sexta parte, e “os grandes” para evitar especificação social excessiva.
