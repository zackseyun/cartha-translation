  text: But when he transgressed the commandment, it was taken away from him, just as Paradise also was.
translation:
  language: pt
  text: Mas, quando ele transgrediu o mandamento, ela lhe foi tirada, assim como o Paraíso também lhe foi tirado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܕ ܐܫܬܕ ܦܘܩܕܢܐ
  choice: quando ele transgrediu o mandamento
  rationale: A sequência, embora o texto transmitido pareça apresentar dificuldade gráfica, é entendida pelo contexto e pela tradição textual como a transgressão do mandamento por Adão.
- source_word: ܐܬܢܣܒܬ ܡܢܗ
  choice: ela lhe foi tirada
  rationale: Preserva a forma passiva e o pronome feminino, cujo referente natural no contexto é a visão da cidade mencionada anteriormente.
- source_word: ܐܝܟ ܕܐܦ ܦܪܕܝܣܐ
  choice: assim como também o Paraíso
  rationale: Mantém a comparação concisa do siríaco e translitera o conceito tradicional de ܦܪܕܝܣܐ como “Paraíso”.
theological_decisions:
- issue: Referente feminino daquilo que foi tirado de Adão
  choice: “ela”, sem explicitar o referente no corpo do versículo
  alternative: “a visão da cidade” ou “a cidade”
  rationale: O siríaco usa uma forma feminina retomando o contexto anterior, mas não repete o substantivo. Preservar o pronome conserva a coesão e uma pequena medida de ambiguidade genuína.
- issue: Agente da retirada
  choice: 'voz passiva: “foi tirada”'
  alternative: “Deus a tirou dele”
  rationale: O original não nomeia explicitamente o agente; a tradução evita acrescentá-lo, embora o contexto permita inferi-lo.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe próxima do original. “Paraíso” recebe maiúscula por designar o lugar primordial específico no contexto.
