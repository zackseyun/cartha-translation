translation:
  language: pt
  text: 'Ou você pensa que esta é a cidade a respeito da qual eu disse: “Eu gravei você nas palmas das minhas mãos”?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝܢܬܐ
  choice: cidade
  rationale: Equivalente direto e natural para o substantivo siríaco, preservando a referência a Jerusalém sem explicitá-la no texto.
- source_word: ܓܠܝܦ
  choice: gravei
  rationale: Reproduz a imagem de inscrição ou entalhe permanente evocada pelo verbo e sua relação intertextual com Isaías 49:16.
- source_word: ܐܝܕܝܐ
  choice: mãos
  rationale: Mantém a imagem corporal do texto; a formulação completa emprega “palmas das minhas mãos” conforme a expressão preservada pela tradição textual.
theological_decisions:
- issue: Identidade da cidade
  choice: Manter apenas “esta é a cidade”
  alternative: Explicitar “esta é Jerusalém”
  rationale: O texto formula uma pergunta sobre a identidade da cidade e não nomeia Jerusalém neste versículo; explicitá-la eliminaria parte da tensão entre a cidade terrena e a cidade revelada.
- issue: Alusão a Isaías 49:16
  choice: 'Preservar a imagem na primeira pessoa: “Eu gravei você nas palmas das minhas mãos”'
  alternative: Parafrasear como “eu nunca me esquecerei de você”
  rationale: A imagem concreta é teologicamente significativa e deve permanecer sem ser reduzida à sua interpretação.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” dentro da citação para conservar o singular dirigido à cidade personificada. A ordem foi ajustada ao português natural sem resolver a pergunta retórica.
