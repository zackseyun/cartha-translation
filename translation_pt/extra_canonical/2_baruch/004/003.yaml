base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/004/003.yaml
  text: For it is not that which is by the hands of men; it is that which will be revealed, which was prepared beforehand from the time I resolved to make Paradise, and I showed it to Adam before he sinned.
translation:
  language: pt
  text: Pois não é aquela que é obra de mãos humanas; é aquela que será revelada, a qual foi preparada de antemão desde o momento em que decidi fazer o Paraíso e a mostrei a Adão antes que ele pecasse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܕ ܒܢܝܢܫܐ
  choice: feita por mãos humanas
  rationale: A expressão siríaca significa literalmente «pelas mãos dos seres humanos»; «feita» explicita naturalmente a construção elíptica no contexto da cidade.
- source_word: ܡܬܓܠܐ
  choice: será revelada
  rationale: Preserva o sentido passivo de manifestação futura e a distinção entre a cidade humana e a cidade preparada por Deus.
- source_word: ܐܬܟܢ ܡܢܩܕܡ
  choice: foi preparada de antemão
  rationale: Reproduz tanto a preparação quanto sua anterioridade, sem acrescentar uma definição teológica.
- source_word: ܦܪܕܝܣܐ
  choice: o Paraíso
  rationale: O empréstimo siríaco designa o Paraíso; a inicial maiúscula sinaliza o lugar primordial específico no relato.
- source_word: ܚܘܝܬܗ
  choice: a mostrei
  rationale: O sufixo feminino retoma a cidade mencionada no contexto, não o Paraíso, que é masculino em siríaco.
- source_word: ܢܚܛܐ
  choice: pecasse
  rationale: Equivalente direto e corrente do verbo siríaco «pecar», em construção temporal após «antes que».
theological_decisions:
- issue: Referente de «a mostrei»
  choice: a cidade celestial preparada de antemão
  alternative: o Paraíso
  rationale: O objeto pronominal siríaco é feminino e retoma naturalmente «cidade», substantivo feminino; «Paraíso» é masculino. A tradução mantém essa referência gramatical sem inserir «cidade» novamente.
- issue: Natureza da cidade futura
  choice: contraste entre obra humana e realidade que será revelada
  alternative: identificá-la explicitamente como cidade celestial ou escatológica
  rationale: O texto afirma sua origem não humana e sua futura revelação, mas a tradução evita acrescentar rótulos interpretativos ausentes no verso.
- issue: Momento da preparação
  choice: desde quando decidi fazer o Paraíso
  alternative: antes da criação do Paraíso
  rationale: A expressão temporal vincula a preparação ao momento da decisão divina de fazer o Paraíso; não exige que se imponha uma cronologia mais específica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do siríaco sem rigidez. O demonstrativo «aquela» conserva a ligação com a cidade do contexto anterior; a repetição é moderada para favorecer legibilidade.
