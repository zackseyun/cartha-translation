  yaml_path: translation/extra_canonical/2_baruch/004/001.yaml
  text: And the Lord said to me, “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.
translation:
  language: pt
  text: '1 E o Senhor me disse: “Esta cidade será entregue por algum tempo, e o povo será levado para o cativeiro, mas o mundo não será esquecido.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܐ (maryā)
  choice: o Senhor
  rationale: Forma portuguesa tradicional e clara para o título divino siríaco, sem introduzir uma vocalização específica do nome divino.
- source_word: ܒܙܒܢܐ (b-zabnā)
  choice: por algum tempo
  rationale: Preserva o sentido temporal e limitado da expressão sem especificar uma duração ausente no texto.
- source_word: ܡܫܬܠܡܐ (meštalmā)
  choice: será entregue
  rationale: Expressa o passivo de entregar ou colocar em poder de outrem, adequado ao destino anunciado para a cidade.
- source_word: ܡܬܕܒܪ ܫܒܝܐ (metdabbar šabyā)
  choice: será levado para o cativeiro
  rationale: Reproduz a ideia de o povo ser conduzido como cativo, em português natural.
- source_word: ܥܠܡܐ (ʿālmā)
  choice: o mundo
  rationale: Mantém a amplitude e a possível ambiguidade do termo siríaco, que pode designar mundo ou era, sem a restringir silenciosamente.
- source_word: ܠܐ ܡܬܬܢܫܐ (lā mettnaššā)
  choice: não será esquecido
  rationale: Tradução direta da construção passiva, preservando a promessa sem explicitar um agente.
theological_decisions:
- issue: Alcance de ܥܠܡܐ
  choice: o mundo
  alternative: a era
  rationale: O termo admite mais de um alcance, mas o contexto contrasta a ruína temporária da cidade com algo mais abrangente que Deus não esquece. “O mundo” conserva a leitura tradicional e a tensão do texto sem acrescentar explicação doutrinária.
- issue: Agente de “não será esquecido”
  choice: manter a voz passiva
  alternative: Deus não se esquecerá do mundo
  rationale: O siríaco não explicita o agente nesta oração; mantê-la passiva evita inserir uma identificação interpretativa, ainda que naturalmente se entenda Deus como agente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe simples. Conservou-se a repetição coordenada do siríaco e o contraste entre a entrega temporária da cidade, o exílio do povo e a não rejeição do mundo.
