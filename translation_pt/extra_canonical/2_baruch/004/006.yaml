  text: And again I also showed it to Moses on Mount Sinai, when I showed him the pattern of the tabernacle and all its vessels.”
translation:
  language: pt
  text: Também a mostrei de novo a Moisés, no monte Sinai, quando lhe mostrei o modelo do tabernáculo e todos os seus utensílios.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܝܬܗ
  choice: a mostrei
  rationale: O verbo significa “mostrar”, e o sufixo pronominal retoma a cidade mencionada no contexto; o feminino em português torna essa referência explícita sem substituir o pronome por uma interpretação.
- source_word: ܠܡܘܫܐ
  choice: a Moisés
  rationale: Forma portuguesa consagrada do nome próprio, com regência natural do verbo “mostrar”.
- source_word: ܛܘܪܐ ܕܣܝܢܝ
  choice: monte Sinai
  rationale: Designação geográfica tradicional e clara em português.
- source_word: ܕܡܘܬܐ
  choice: modelo
  rationale: Preserva a ideia de representação, padrão ou configuração mostrada a Moisés, sem afirmar mais do que o termo permite.
- source_word: ܡܫܟܢܐ
  choice: tabernáculo
  rationale: Equivalente bíblico corrente para a habitação sagrada móvel.
- source_word: ܡܐܢ̈ܘܗܝ
  choice: seus utensílios
  rationale: “Utensílios” comunica naturalmente os objetos e apetrechos pertencentes ao tabernáculo.
theological_decisions:
- issue: Referente do pronome feminino
  choice: “a mostrei”, retomando “a cidade” do contexto
  alternative: “mostrei isso” ou repetir “a cidade”
  rationale: O contexto imediato identifica a cidade preexistente como aquilo que foi mostrado; manter o pronome preserva a coesão e evita explicitação excessiva.
- issue: Natureza do que foi revelado a Moisés
  choice: “modelo do tabernáculo”
  alternative: “semelhança do tabernáculo” ou “planta do tabernáculo”
  rationale: “Modelo” conserva a amplitude do termo e não decide se se trata de arquétipo celeste, aparência visual ou projeto arquitetônico.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe bíblica natural. “Também” e “novamente” preservam a combinação enfática do texto; “utensílios” é acessível sem perder o registro religioso.
