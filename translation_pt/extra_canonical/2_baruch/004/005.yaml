- source_word: ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ
  choice: entre os pedaços do sacrifício
  rationale: Mantém a imagem concreta e a alusão ao sacrifício dividido, sem explicitação interpretativa.
theological_decisions:
- issue: Referente feminino de ܚܘܝܬܗ
  choice: a cidade celestial mencionada no contexto, expressa apenas por “a”
  alternative: explicitar “a cidade” ou entender o referente como “o paraíso”
  rationale: A concordância feminina favorece “cidade”; contudo, para não tornar explícito além do siríaco imediato, conserva-se o pronome.
- issue: Natureza da revelação a Abraão
  choice: “mostrei-a”
  alternative: “revelei-a” ou “fiz com que a visse”
  rationale: O verbo indica mostrar; a formulação evita definir o modo exato da experiência revelatória.
