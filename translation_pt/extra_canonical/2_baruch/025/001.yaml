base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/025/001.yaml
  text: 'Then he answered me and said, “You too shall be spared until that time, until the sign that the Mighty One will perform for the inhabitants of the earth at the end of the days. And this will be the sign: bewilderment will seize the inhabitants of the earth, and they will fall into many afflictions; then again into great anguish. And when, because of the abundance of their distress, they say in their thoughts, ‘The Mighty One no longer remembers the earth,’ and they have given up hope, then the time will awaken.”'
translation:
  language: pt
  text: 'Então ele me respondeu: “Você também será preservado até aquele tempo, até o sinal[a] que o Poderoso realizará para os habitantes da terra no fim dos dias. E este será o sinal: a perplexidade tomará conta dos habitantes da terra, e eles cairão em muitas aflições e, depois, em grande angústia. Quando, por causa de sua imensa aflição, disserem em seus pensamentos: ‘O Poderoso já não se lembra da terra’, e tiverem perdido a esperança, então o tempo despertará.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a disposição determinada” ou “o sinal estabelecido”.
    reason: O siríaco ܬܘܩܢܐ pode indicar tanto um sinal identificador quanto uma ordem ou disposição previamente estabelecida.
lexical_decisions:
- source_word: ܬܘܩܢܐ
  choice: sinal
  rationale: No contexto apocalíptico, designa o acontecimento identificador estabelecido pelo Poderoso; “sinal” comunica essa função com clareza, sem excluir o sentido subjacente de disposição determinada.
- source_word: ܡܪܝܡܢܐ
  choice: o Poderoso
  rationale: Mantém o título divino solene e evita acrescentar “Deus”, que não está expresso no título siríaco.
- source_word: ܙܘ̈ܥܐ / linguagem contextual de desorientação
  choice: perplexidade
  rationale: Expressa o estado avassalador de desorientação que domina os habitantes da terra, sem reduzi-lo apenas a medo.
- source_word: ܐܘܠܨܢܐ
  choice: aflição / aflições
  rationale: Preserva a ideia concreta de sofrimento e pressão intensa em linguagem portuguesa atual e digna.
- source_word: ܡܬܕܟܪ
  choice: se lembra
  rationale: Conserva o idioma bíblico da lembrança divina e a força da queixa proferida em desespero.
- source_word: imagem de despertar na cláusula final
  choice: o tempo despertará
  rationale: Mantém a personificação apocalíptica do tempo determinado, sem explicá-la ou suavizá-la.
theological_decisions:
- issue: A afirmação desesperada de que o Poderoso já não se lembra da terra
  choice: Mantida como fala interior dos habitantes da terra.
  alternative: “O Poderoso já não cuida da terra” ou “já não visita a terra”.
  rationale: O texto apresenta a percepção humana em meio à aflição, não uma declaração do narrador sobre abandono divino; preservar a formulação mantém a tensão teológica.
- issue: Referente da cláusula final
  choice: “o tempo despertará”
  alternative: “a esperança despertará”.
  rationale: A leitura contextual e a tradição textual controlada favorecem o tempo determinado como sujeito da imagem final; “esperança” decorre de uma leitura corrompida ou de segmentação defeituosa do testemunho apresentado.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com tratamento por “você” para legibilidade brasileira. A formulação conserva as imagens apocalípticas (“o tempo despertará”) e distingue aflições sucessivas sem impor terminologia confessional.
