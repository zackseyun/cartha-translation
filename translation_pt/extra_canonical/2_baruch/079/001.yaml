lexical_decisions:
- source_word: mourn / sigh (a redação siríaca de 79:1 não está visível no recorte fornecido)
  choice: lamentem / suspirem
  rationale: A tradução conserva os dois imperativos paralelos e distingue o lamento público da expressão profunda de tristeza, em português atual e digno.
- source_word: Zion / Jerusalem
  choice: Sião / Jerusalém
  rationale: Mantêm-se os dois nomes no paralelismo, sem tratá-los como simples sinônimos nem explicitar uma relação teológica que o verso deixa implícita.
theological_decisions:
- issue: Relação entre Sião e Jerusalém
  choice: Preservar os dois referentes em membros paralelos
  alternative: Fundir ambos em uma única referência à cidade
  rationale: O paralelismo poético associa Sião e Jerusalém, mas não exige que a tradução elimine a distinção entre os nomes.
