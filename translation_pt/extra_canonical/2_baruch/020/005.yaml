- source_word: ܠܫܒܥܐ ܝܘܡܝܢ (reconstructed from the verse’s attested tradition)
  choice: durante sete dias
  rationale: Expressa em português natural a duração do período.
- source_word: ܠܐ ... ܠܐ ... ܘܥܡ ܐܢܫ ܠܐ (reconstructed prohibitions reflected by the consultation layer)
  choice: não comas pão, não bebas água e não fales com ninguém
  rationale: Mantém as três proibições em sequência, com paralelismo claro e sem suavizar o jejum absoluto descrito.
theological_decisions:
- issue: Natureza da preparação ordenada
  choice: santificar-te
  alternative: consagrar-te / purificar-te
  rationale: “Santificar-te” conserva a amplitude ritual e religiosa do verbo sem especificar um rito de purificação não declarado no texto.
