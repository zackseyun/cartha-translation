base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/020/001.yaml
  text: Therefore, behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.
translation:
  language: pt
  text: Por isso, eis que vêm dias em que os tempos se apressarão mais do que os anteriores, as estações passarão mais depressa do que as que já passaram, e os anos transcorrerão mais rapidamente do que os anos de agora.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒ̈ܢܐ
  choice: tempos
  rationale: Mantém o campo temporal amplo do siríaco e a repetição conceitual do versículo, sem restringi-lo a datas ou acontecimentos específicos.
- source_word: ܫܢܝ̈ܐ
  choice: anos
  rationale: Equivalente direto e natural, preservando o contraste entre os anos futuros e os atuais.
- source_word: ܢܩܘܡܘܢ / ܢܥܒܪܘܢ (texto de controle parcialmente corrompido)
  choice: passarão / transcorrerão
  rationale: O contexto e a tradição textual indicam movimento acelerado do tempo; verbos diferentes em português evitam uma repetição pesada sem alterar a imagem.
theological_decisions:
- issue: A aceleração escatológica do tempo
  choice: Preservar a linguagem concreta de tempos, estações e anos que se apressam
  alternative: Explicitar que os acontecimentos finais ocorrerão em rápida sucessão
  rationale: O texto descreve poeticamente a aceleração temporal sem explicar seu mecanismo; a tradução não deve resolver essa imagem em uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e solene. Conserva a fórmula enfática «eis que» e o paralelismo triplo do siríaco. «Estações» foi mantido em sentido amplo de períodos determinados, não necessariamente estações climáticas.
