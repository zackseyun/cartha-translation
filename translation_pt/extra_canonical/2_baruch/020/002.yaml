  text: Therefore I have now taken Zion away, so that I may visit the world more swiftly in its appointed time.
translation:
  language: pt
  text: Por isso, agora removi Sião, para visitar o mundo mais depressa, no tempo que lhe foi determinado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܢܣܒܬ (sentido refletido pela tradição textual: “tomei/retirei”)'
  choice: removi
  rationale: No contexto da retirada de Sião, “removi” comunica de modo natural a ação sem especificar além do texto se ela significa destruição, abandono ou transferência.
- source_word: ܐܦܩܕ / raiz de “visitar” (sentido refletido pela tradição textual)
  choice: visitar
  rationale: Preserva a amplitude bíblica do verbo, que pode envolver inspeção, intervenção, juízo ou cuidado, sem resolver a tensão.
- source_word: ܒܙܒܢܗ (no seu tempo)
  choice: no tempo que lhe foi determinado
  rationale: Expressa o tempo próprio ou designado para a visitação, em consonância com a camada de consulta inglesa, com português claro.
theological_decisions:
- issue: Natureza da visita divina ao mundo
  choice: visitar o mundo
  alternative: julgar o mundo
  rationale: “Julgar” restringiria a ação exclusivamente ao juízo; “visitar” conserva a ambiguidade teológica do verbo.
- issue: Sentido da remoção de Sião
  choice: removi Sião
  alternative: destruí Sião
  rationale: O texto não exige que a retirada seja interpretada apenas como destruição; a formulação escolhida evita acrescentar essa conclusão.
translation_notes:
  register: Português moderno, digno e de leitura ampla; sintaxe direta, com manutenção deliberada da ambiguidade da “visita” divina.
