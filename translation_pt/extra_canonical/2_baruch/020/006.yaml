  yaml_path: translation/extra_canonical/2_baruch/020/006.yaml
  text: Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.
translation:
  language: pt
  text: Depois, venha a este lugar, e ali aparecerei a você e lhe direi coisas verdadeiras; eu o instruirei sobre a ordem dos tempos, pois eles vêm e não tardarão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܫܪܝܪ̈ܬܐ (sentido refletido pela tradição textual: “coisas verdadeiras”)'
  choice: coisas verdadeiras
  rationale: Preserva a formulação substantivada e solene, sem restringi-la a “a verdade” em sentido abstrato.
- source_word: ܛܟܣܐ / expressão equivalente relativa aos tempos
  choice: ordem dos tempos
  rationale: Mantém a ideia de sequência ou disposição estabelecida dos períodos, sem especificar indevidamente uma cronologia detalhada.
- source_word: expressão verbal de demora
  choice: não tardarão
  rationale: É português natural e conserva o contraste entre a chegada iminente dos tempos e a ausência de demora.
theological_decisions:
- issue: Identidade dos “tempos” e natureza de sua ordem
  choice: Manter “a ordem dos tempos” sem explicação adicional
  alternative: Interpretar como “a sequência dos acontecimentos do fim”
  rationale: O texto fala de tempos vindouros, mas não exige neste versículo uma identificação exclusivamente escatológica nem uma paráfrase dos acontecimentos.
- issue: Manifestação do interlocutor divino
  choice: “aparecerei a você”
  alternative: “me revelarei a você”
  rationale: A formulação preserva a linguagem de aparição sem definir a modalidade dessa manifestação.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A repetição de “e” foi moderada para dar fluidez sem apagar a progressão das ações. Como o recorte siríaco fornecido é um agrupamento de páginas com sobreposição e o versículo não está isolado com segurança, a redação segue cautelosamente o sentido atestado pela camada inglesa auditada, evitando reconstruções lexicais excessivamente específicas.
