  yaml_path: translation/extra_canonical/2_baruch/020/003.yaml
  text: And now, hold fast in your heart all that I command you, and seal it in the inner chambers of your mind.
translation:
  language: pt
  text: E agora, guarda firmemente no coração tudo o que te ordeno e sela tudo isso nas câmaras interiores da tua mente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܒܐ (coração)
  choice: coração
  rationale: Preserva a imagem antropológica sem reduzi-la a mero sentimento; aqui, o coração é o centro interior da retenção e da decisão.
- source_word: ܚܬܡ (selar)
  choice: sela
  rationale: Mantém a metáfora concreta de autenticar, proteger e conservar, em vez de substituí-la por uma explicação como “memoriza”.
- source_word: ܐܘܢ̈ܐ (câmaras, recessos)
  choice: câmaras interiores
  rationale: Conserva a imagem espacial do interior da mente e evita a expressão pouco natural “aposentos da mente”.
- source_word: ܡܕܥܐ (mente, entendimento)
  choice: mente
  rationale: É claro em português atual e mantém a distinção poética entre coração e mente.
theological_decisions:
- issue: Relação entre coração e mente
  choice: Manter os dois termos como imagens paralelas, mas distintas
  alternative: Fundir ambos em “interior” ou “consciência”
  rationale: A formulação dupla intensifica a interiorização do mandamento; fundi-la eliminaria uma tensão antropológica presente no texto.
- issue: Força da metáfora do selo
  choice: Traduzir literalmente por “sela”
  alternative: Explicitar como “grava profundamente” ou “não esqueças”
  rationale: A metáfora não deve ser resolvida em uma única interpretação, pois pode envolver preservação, confirmação e ocultação segura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento singular por “te/teu”. A repetição “tudo isso” torna natural o objeto de “sela” e evita um pronome masculino que poderia parecer referir-se apenas a um mandamento específico. Como o material siríaco fornecido é um recorte amplo e sobreposto do capítulo, a redação também foi controlada pela camada inglesa auditada.
