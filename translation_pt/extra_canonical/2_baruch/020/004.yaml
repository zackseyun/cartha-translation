translation:
  language: pt
  text: Então lhe mostrarei o juízo do meu poder e os meus caminhos, que não podem ser sondados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ (reconstruído pelo testemunho de controle)
  choice: juízo
  rationale: Preserva o sentido judicial do termo e corresponde à formulação atestada para o versículo.
- source_word: ܚܝܠܝ (reconstruído pelo testemunho de controle)
  choice: meu poder
  rationale: Mantém a relação genitiva e evita transformar a expressão em um adjetivo interpretativo como “meu poderoso juízo”.
- source_word: ܐܘܪ̈ܚܬܝ (reconstruído pelo testemunho de controle)
  choice: meus caminhos
  rationale: Conserva a metáfora bíblica tradicional para os modos de agir de Deus.
- source_word: expressão correspondente a “past searching out”
  choice: não podem ser sondados
  rationale: Expressa de modo natural e digno a impossibilidade de investigar ou compreender plenamente esses caminhos.
theological_decisions:
- issue: Relação entre juízo e poder divino
  choice: “o juízo do meu poder”
  alternative: “meu poderoso juízo”
  rationale: A opção escolhida preserva a construção genitiva e não decide se o foco recai na intensidade do juízo ou em sua procedência do poder divino.
- issue: Caráter inescrutável dos caminhos divinos
  choice: “não podem ser sondados”
  alternative: “são insondáveis”
  rationale: A forma verbal mantém a imagem de uma busca que não consegue alcançar seu objeto, sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. O pronome “lhe” representa o destinatário singular sem tornar explícito um gênero que a frase portuguesa não precisa reiterar. Como o recorte siríaco fornecido é um agrupamento de páginas com interpolação provisória e OCR desordenado, as correspondências lexicais são indicadas com cautela e controladas pela leitura auditada do versículo.
