  terminology: “Altíssimo”, “mandamentos”, “arrependimento”, “descanso”, “condenação”, “justos” e “esperança” são escolhas adequadas. “Antepassados” comunica naturalmente o referente coletivo de ‘pais/patriarcas’ na primeira ocorrência, enquanto “pais” na última conserva a relação familiar imediata.
