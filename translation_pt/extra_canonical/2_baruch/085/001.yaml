  yaml_path: translation/extra_canonical/2_baruch/085/001.yaml
  text: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


    So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


    For when the Most High brings these things to pass, there will no longer be room for repentance, or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


    For each of us will then be judged by himself alone.


    And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
translation:
  language: pt
  text: '… os tempos estão próximos e já são iminentes. O cântaro está perto do poço; o navio, do porto; a viagem, da cidade; e a vida, de seu fim.


    Portanto, recebam os seus mandamentos, para que não sejam excluídos da grandeza de sua misericórdia, mas encontrem descanso, e não condenação.


    Pois, quando o Altíssimo fizer acontecer essas coisas, já não haverá oportunidade para arrependimento, nem limite para os tempos, nem prolongamento das épocas, nem retorno ao descanso. Ninguém será ajudado pela oração, nem pela mediação dos antepassados, nem pela súplica dos profetas, nem pelo auxílio dos justos, nem pelo choro das mulheres, nem pela ternura das criancinhas, nem pelo pranto dos bebês, nem pela inocência dos recém-nascidos, nem pela justiça de seus pais. Nenhuma das coisas antes consideradas e reconhecidas como meios de auxílio poderá ajudar.


    Pois cada um de nós será então julgado sozinho, por si mesmo.[a]


    E ele preservará para a sua era aqueles que nele têm esperança, mas destruirá de uma só vez os que estão contaminados de pecados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ficará de pé sozinho, por si mesmo”.'
    reason: 'Registra a alternativa de tradução tradicional para a imagem de estar de pé sozinho, sem alegar uma variante textual e sem substituir a tradução direta do verbo siríaco: “será julgado”.'
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  choice: os seus mandamentos
  rationale: Preserva o sentido de ordens divinas autorizadas e a força pactual da exortação.
- source_word: ܬܐܢܝܚܘܢ
  choice: encontrem descanso
  rationale: Mantém tanto a ideia de alívio como a de repouso escatológico, em contraste com a condenação.
- source_word: ܐܬܪܐ ܠܬܝܒܘܬܐ (leitura controlada por trás do texto corrompido)
  choice: oportunidade para arrependimento
  rationale: Expressa naturalmente a ausência futura de espaço ou ocasião para arrependimento, sem seguir a forma corrompida do testemunho apresentado isoladamente.
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  choice: pelo choro das mulheres
  rationale: Conserva a imagem concreta de lamentação na enumeração cumulativa.
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  choice: pela ternura das criancinhas
  rationale: Comunica a qualidade cativante e compassiva sugerida pelo substantivo no contexto de apelos ineficazes.
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  choice: pela inocência dos recém-nascidos
  rationale: Traduz a pureza atribuída aos recém-nascidos em português natural.
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  choice: contaminados de pecados
  rationale: Representa idiomaticamente a condição moral indicada pela expressão, cuja imagem literal é menos clara em português.
- source_word: ܠܥܠܡܘܗܝ
  choice: para a sua era
  rationale: Mantém o valor temporal amplo de ܥܠܡܐ sem o reduzir necessariamente a 'mundo' ou 'eternidade'.
theological_decisions:
- issue: A longa enumeração de formas de intercessão e auxílio que serão ineficazes no juízo
  choice: Manter cada elemento da enumeração separadamente.
  alternative: Resumir tudo como 'nenhuma intercessão poderá ajudar'.
  rationale: A acumulação retórica do siríaco enfatiza a finalidade do juízo e a responsabilidade individual; condensá-la apagaria essa força.
- issue: O modo de expressar a responsabilidade individual
  choice: “cada um de nós será então julgado sozinho, por si mesmo”
  alternative: “cada um de nós ficará sozinho, por si mesmo”
  rationale: A leitura verbal controlada favorece diretamente 'ser julgado'; a formulação evita acrescentar uma explicação doutrinária sobre o mecanismo desse juízo.
- issue: A relação da esperança no último período
  choice: “aqueles que nele têm esperança”
  alternative: “aqueles em quem há esperança”
  rationale: A construção é entendida como esperança dirigida a Deus, leitura coerente com a sintaxe e com a exortação, sem introduzir um critério meritório.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância no plural em “recebam”. A pontuação com ponto e vírgula preserva o paralelismo das imagens iniciais. “Antepassados” foi usado na primeira ocorrência para tornar natural a ideia de mediação ancestral; “pais” foi mantido na última, onde a relação familiar é mais imediata. A abertura retém as reticências porque o trecho começa em continuidade com o contexto anterior.
