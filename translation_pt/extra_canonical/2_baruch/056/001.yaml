base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/056/001.yaml
  text: 'That great cloud which you saw ascending from the sea and going to cover the earth—understand this: it is the ordering of the world which the Mighty One made when he resolved to create it.[1][2] And it came to pass that, when the word went forth from before him, the establishment of the world arose—fair, small—and it was prepared as it was fitting to be.[3]


    And as for the first black waters which you saw descending from that cloud, this is the sin and transgression which the first Adam committed first. For when he transgressed, death was aroused before its time, and mourning became known, and afflictions were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which appeared in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.[4][5]


    Therefore, because Adam—when he heard from God something of what was to be, and understood that the release of the dead had been given, and had been commanded by God—considered, and he thought five thoughts: for he was condemning himself; he was also condemning the angels; and even at the time when he was created in it, there was for him a seen vision, and the fierce living creatures, and the elements with fire.[6][7]


    And thus God gathered in time, in the likeness in which they had been created.'
translation:
  language: pt
  text: 'Aquela grande nuvem que você viu subir do mar e ir cobrir a terra — entenda isto: ela é a ordenação do mundo que o Poderoso realizou quando decidiu criá-lo.[a][b] E aconteceu que, quando a palavra saiu de diante dele, o estabelecimento do mundo se ergueu — belo, pequeno — e foi preparado como convinha.[c]


    Quanto às primeiras águas negras que você viu descer daquela nuvem, elas são o pecado e a transgressão que Adão, o primeiro, cometeu primeiro.[d] Pois, quando ele transgrediu, a morte foi despertada antes do seu tempo; o luto tornou-se conhecido, aflições foram preparadas, dores foram criadas, o trabalho penoso foi completado, e a grandeza começou a diminuir.


    E o último dia, que apareceu sob uma forma e assumiu uma semelhança — você saberá que o tempo será requerido, a aparência da humanidade será apagada e sua força será posta à prova.[e]


    Portanto, visto que Adão, quando ouviu de Deus algo do que haveria de acontecer, compreendeu que o perdão dos mortos fora concedido e que isso lhe fora ordenado por Deus, refletiu e pensou cinco pensamentos:[f] pois condenava a si mesmo e também condenava os anjos. E, no tempo em que foi criado, havia para ele uma visão, os seres vivos ferozes e os elementos com fogo.[g]


    E assim Deus reuniu, no tempo, conforme a semelhança em que haviam sido criados.[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há duas formas verbais nos testemunhos, ambas com o sentido de “cobrir”; a diferença não altera o sentido da frase.
    reason: textual_variant
  - marker: b
    text: O siríaco transmitido nesta frase é difícil. A leitura de controle sustenta “ordenação do mundo”; outra forma textual pode ser entendida como “seu poder”.
    reason: textual_variant
  - marker: c
    text: “Belo, pequeno” é uma expressão incomum. Pode descrever o mundo em seu estado inicial, ainda incipiente, mas os dois adjetivos foram mantidos sem explicação no texto.
    reason: lexical_alternative
  - marker: d
    text: 'Também é possível traduzir: “esta é a transgressão que Adão, o primeiro, transgrediu primeiro”.'
    reason: lexical_alternative
  - marker: e
    text: A passagem é sintaticamente condensada. O termo para “aparência” ou “semelhança” da humanidade é raro, e o verbo indica que ela será apagada/removida; a tradução evita definir o alcance dessa imagem.
    reason: lexical_alternative
  - marker: f
    text: '“Perdão dos mortos” traduz uma construção que pode significar perdão referente aos mortos; não afirma que Adão perdoou outros. Literalmente, a frase seguinte diz: “cinco pensamentos foram pensados”. As cláusulas que parecem enumerá-los são obscuras e não formam uma lista inequívoca no siríaco.'
    reason: textual_difficulty
  - marker: g
    text: 'O trecho final preserva uma sequência muito comprimida: a visão, os seres vivos ferozes, os elementos com fogo e o ato de Deus reunir “no tempo”. A relação sintática entre essas expressões, bem como o referente do plural final, é incerta.'
    reason: textual_difficulty
