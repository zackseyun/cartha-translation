  rationale: As duas formas atestadas significam cobrir; a escolha é neutra e natural em português.
- source_word: ܢܘܓܪܗ ܕܥܠܡܐ
  choice: ordenação do mundo
  rationale: Expressa a organização ou estruturação cósmica no contexto da criação e segue a leitura de controle.
- source_word: ܚܝܠܬܢܐ
  choice: o Poderoso
  rationale: Conserva o epíteto divino substantivado, recorrente em 2 Baruque.
- source_word: ܡܠܬܐ
  choice: palavra
  rationale: É formalmente preciso e mantém a ressonância da ordem criadora.
- source_word: ܩܘܝܡܐ
  choice: estabelecimento
  rationale: O termo designa o ato ou estado de firmar e estabelecer a ordem criada.
- source_word: ܫܦܝܪ ܙܥܘܪ
  choice: belo, pequeno
  rationale: Mantém a justaposição surpreendente e não explica silenciosamente o adjetivo 'pequeno'.
- source_word: ܡܝ̈ܐ ܐܘܟܡ̈ܐ
  choice: águas negras
  rationale: Preserva diretamente o simbolismo cromático da visão.
- source_word: ܐܬܬܙܝܥ
  choice: foi despertada
  rationale: Comunica que a morte foi posta em atividade, mantendo a imagem do verbo siríaco.
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: seres vivos ferozes
  rationale: Interpreta ḥaywātā como criaturas ou seres vivos, não como 'vida', e mantém a força do qualificativo.
- source_word: ܐܣܛܘܟܣܐ
  choice: elementos
  rationale: O empréstimo grego normalmente indica os elementos cósmicos; a tradução evita identificá-los como espíritos ou letras.
theological_decisions:
- issue: Significado da grande nuvem
  choice: A nuvem representa a ordenação do mundo pelo Criador.
  alternative: A nuvem representa um império ou apenas a propagação do juízo.
  rationale: A explicação imediata associa a imagem à decisão de criar e à palavra que procede de Deus.
- issue: A morte despertada antes do tempo
  choice: A transgressão de Adão ativa prematuramente a morte e seus efeitos.
  alternative: A frase se refere apenas ao encurtamento da vida pessoal de Adão.
  rationale: O texto apresenta uma ruptura ampla da ordem, seguida de luto, aflições, dores e trabalho penoso.
- issue: A libertação dos mortos
  choice: A libertação é uma dádiva divina referente aos mortos.
  alternative: Adão é quem liberta ou perdoa os mortos.
  rationale: A construção passiva indica algo concedido, sem fazer de Adão o agente da libertação.
- issue: Adão condenava os anjos
  choice: A formulação comprimida é mantida sem explicar como os anjos se relacionam com a culpa de Adão.
  alternative: Adão fez os anjos pecarem ou ficou sujeito à jurisdição deles.
  rationale: O siríaco é obscuro; uma explicitação doutrinária resolveria indevidamente a tensão textual.
- issue: Os elementos com fogo
  choice: A expressão é mantida como referência a elementos cósmicos associados ao fogo.
  alternative: Letras da linguagem ou espíritos elementais.
  rationale: O empréstimo grego favorece o sentido cosmológico, mas o texto não permite uma definição mais estreita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções correntes no Brasil sem regionalismos marcados. A tradução mantém imagens, repetições e ambiguidades do siríaco, mas divide períodos excessivamente comprimidos quando isso melhora a legibilidade. Os trechos de sintaxe especialmente incerta são sinalizados em notas, sem harmonização doutrinária.
