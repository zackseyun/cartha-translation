base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/008/002.yaml
  text: '"Pull down its walls and overturn them to their foundations, lest the enemies boast and say, ''We ourselves have pulled down the wall of Zion, and we have burned the dwelling place of the mighty God.''"'
translation:
  language: pt
  text: '“Derrubem suas muralhas e arrasem-nas até os alicerces, para que os inimigos não se vangloriem, dizendo: ‘Nós mesmos derrubamos a muralha de Sião e incendiamos a morada do Deus poderoso.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܪ̈ܝܗ
  choice: suas muralhas
  rationale: A forma no comando é entendida como plural com sufixo possessivo; “muralhas” é natural em português para as fortificações de Sião.
- source_word: ܣܡܝܟܘܬ ... ܥܘܪ̈ܩܘ
  choice: arrasem-nas até os alicerces
  rationale: Expressa a destruição completa das muralhas até sua base, preservando o sentido concreto sem a formulação pouco natural “desenraizar muralhas”.
- source_word: ܢܫܬܒܗܪܘܢ
  choice: se vangloriem
  rationale: Mantém a ideia de os inimigos atribuírem orgulhosamente a si mesmos a destruição.
- source_word: ܕܘܟܬܐ
  choice: morada
  rationale: No contexto do templo, “morada” comunica melhor que o simples “lugar” a habitação sagrada de Deus.
- source_word: ܐܠܗܐ ...
  choice: Deus poderoso
  rationale: Segue a leitura contextual preservada pela tradição textual e pelo texto de consulta, com linguagem clara e digna.
theological_decisions:
- issue: Agência na destruição de Sião
  choice: A ordem é dada para que a destruição ocorra antes que os inimigos possam reivindicá-la.
  alternative: Explicitar que o próprio Deus destruiu Sião.
  rationale: O versículo contrasta a ação ordenada com a pretensão dos inimigos, mas não requer uma explicação teológica adicional sobre causalidade.
- issue: Designação de Deus
  choice: Deus poderoso
  alternative: Deus vivo / lugar culpado de Deus
  rationale: “Deus poderoso” corresponde à leitura tradicional contextual e evita uma formulação corrompida ou teologicamente incoerente resultante da condição difícil do testemunho apresentado.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural. O texto foi limitado ao conteúdo de 2 Baruque 8:2, sem incorporar material dos versículos adjacentes presente no recorte da página.
