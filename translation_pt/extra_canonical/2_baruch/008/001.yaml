revisions:
- from: '1 E vi que ele entrou no Santo dos Santos e tirou de lá os véus, o éfode, o altar, o propiciatório[a], as duas tábuas[b], as vestes sagradas dos sacerdotes, o incensário[c], as quarenta e oito pedras preciosas e todos os utensílios sagrados do tabernáculo. Então disse à terra em alta voz: “Terra, terra, terra, ouça a palavra do Deus poderoso. Receba o que confio a você e guarde tudo até os últimos tempos, para que, quando receber a ordem, você o restitua, e assim os estrangeiros não se vangloriem por causa dessas coisas. Pois está próximo o tempo em que também Jerusalém será entregue por algum tempo, até que se diga que ela será restaurada novamente para sempre.”'
  to: '1 E vi que ele entrou no Santo dos Santos e tirou de lá os véus, o éfode, o altar, o propiciatório[a], as duas tábuas[b], as vestes sagradas dos sacerdotes, o incensário[c], as quarenta e oito pedras preciosas e todos os utensílios sagrados do tabernáculo. Então disse à terra em alta voz: “Terra, terra, terra, ouça a palavra do Deus poderoso. Receba o que confio a você e guarde-os até os últimos tempos, para que, quando receber a ordem, você os restitua, e assim os estrangeiros não se vangloriem deles. Pois está próximo o tempo em que também Jerusalém será entregue por algum tempo, até que se diga que ela será restaurada novamente para sempre.”'
  rationale: A revisão limita-se a harmonizar os pronomes com o conjunto plural de objetos confiados à terra («guarde-os ... os restitua») e a substituir «por causa dessas coisas» por «deles», retomada mais direta do antecedente. Mantêm-se a sintaxe temporal, as passivas sem agente expresso, a terminologia cultual e todas as notas de incerteza.
