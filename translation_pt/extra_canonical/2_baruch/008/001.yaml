  verdict: revise
  source_fidelity: 'A tradução acompanha bem a sequência, o inventário cultual, a tríplice invocação da terra e as passivas que deixam abertos os agentes da entrega e da restauração de Jerusalém. As notas preservam adequadamente as incertezas de ܚܘܣܝܐ, das «duas tábuas» e de ܦܝܪܡܐ. Há, porém, uma inconsistência de número na custódia e restituição dos objetos: depois de «todos os utensílios», «guarde tudo» e especialmente «você o restitua» obscurecem que o depósito é plural/coletivo e que os objetos devem ser devolvidos.'
  naturalness: O registro é claro, moderno e suficientemente solene. «Santo dos Santos», «éfode», «propiciatório» e «incensário» são adequados ao contexto. A substituição dos pronomes por formas plurais diretas torna a fala à terra mais fluida e elimina uma ambiguidade gramatical desnecessária.
  terminology: A terminologia do santuário é consistente com o uso bíblico em português. «Propiciatório» é defensável com a nota qualificadora; «tábuas» e «incensário» devem conservar suas notas de incerteza. «Estrangeiros» traduz de modo apropriado o contraste com os não pertencentes ao povo/santuário, sem acrescentar interpretação.
