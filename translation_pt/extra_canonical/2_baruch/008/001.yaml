base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/008/001.yaml
  text: And I saw that he went into the Holy of Holies, and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."
translation:
  language: pt
  text: '1 E vi que ele entrou no Santo dos Santos e tirou de lá os véus, o éfode, o altar, o propiciatório[a], as duas tábuas[b], as vestes sagradas dos sacerdotes, o incensário[c], as quarenta e oito pedras preciosas e todos os utensílios sagrados do tabernáculo. Então disse à terra em alta voz: “Terra, terra, terra, ouça a palavra do Deus poderoso. Receba o que confio a você e guarde-os até os últimos tempos, para que, quando receber a ordem, você os restitua, e assim os estrangeiros não se vangloriem deles. Pois está próximo o tempo em que também Jerusalém será entregue por algum tempo, até que se diga que ela será restaurada novamente para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a cobertura sagrada”. A identificação exata do objeto é incerta nesta lista.'
    reason: O termo siríaco e o estado da testemunha permitem alguma incerteza quanto ao objeto cultual.
  - marker: b
    text: A leitura “as duas tábuas” é provável, mas o texto siríaco preservado neste ponto é instável.
    reason: A forma da testemunha é difícil; a tradição do inventário favorece as tábuas da aliança sem eliminar toda dúvida.
  - marker: c
    text: A identificação como “incensário” é incerta; o termo pode designar outro objeto ou ornamento sagrado.
    reason: Evita falsa precisão diante de um item lexicalmente e textualmente difícil.
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  choice: Santo dos Santos
  rationale: Expressão cultual consagrada e natural em português para o recinto mais sagrado do santuário; preserva a forma superlativa sem explicá-la em excesso.
- source_word: ܦܪ̈ܘܟܬܐ
  choice: véus
  rationale: Designa as cortinas sagradas do santuário; “véus” conserva a associação com o espaço interior.
- source_word: ܚܘܣܝܐ
  choice: propiciatório
  rationale: É o equivalente cultual tradicional para a cobertura sagrada associada à arca, embora a identificação do objeto nesta lista textual seja incerta.
- source_word: ܘܬܪ̈ܬܝܢ ܟܘܪ̈ܣܘ
  choice: as duas tábuas
  rationale: A leitura material é instável, mas o inventário tradicional favorece as tábuas da aliança; a nota registra a incerteza.
- source_word: ܦܝܪܡܐ
  choice: incensário
  rationale: É uma identificação cultual plausível e inteligível, mas o termo nesta testemunha admite dúvida; por isso recebe nota.
- source_word: ܐܪܥܐ ܐܪܥܐ ܐܪܥܐ
  choice: Terra, terra, terra
  rationale: Mantém a tríplice invocação enfática e a personificação da terra como depositária dos objetos.
- source_word: ܡܢ ܩܕܝܡ / ܥܕܡܐ (contexto temporal reconstruído)
  choice: até os últimos tempos
  rationale: Segue o sentido contextual da ordem de conservar os objetos até o momento determinado de sua restituição.
theological_decisions:
- issue: Ocultação dos objetos do santuário na terra
  choice: A terra recebe, guarda e depois restitui os objetos por ordem divina.
  alternative: Tratar a cena apenas como sepultamento ou ocultação comum.
  rationale: A fala atribui à terra uma função ativa de custódia até o tempo determinado, sem reduzir a cena a simples enterro.
- issue: Sentido de “propiciatório”
  choice: Manter o termo cultual tradicional com nota de incerteza textual.
  alternative: Traduzir genericamente como “cobertura”.
  rationale: “Propiciatório” preserva a provável referência ao mobiliário sagrado, enquanto a nota evita apresentar a identificação como indiscutível.
- issue: Restauração de Jerusalém
  choice: 'Preservar a sequência temporal e a formulação passiva: Jerusalém será entregue por algum tempo e depois restaurada para sempre.'
  alternative: Explicitar quem a entrega ou quem a restaura.
  rationale: O texto não identifica expressamente os agentes nessas formas passivas; explicitá-los resolveria uma tensão que deve permanecer.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Empregou-se “você” na fala dirigida à terra para evitar a rigidez de “tu” em variedades que não o usam correntemente, mantendo a solenidade por meio do vocabulário e da cadência. A repetição “Terra, terra, terra” e as passivas teologicamente abertas foram preservadas.
