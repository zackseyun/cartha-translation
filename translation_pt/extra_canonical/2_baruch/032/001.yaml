  yaml_path: translation/extra_canonical/2_baruch/032/001.yaml
  text: 'But you, if you prepare your hearts so as to sow in them the fruits of the law, it will protect you in that time when the Mighty One shakes the whole creation.


    For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever.


    Therefore we should not grieve so greatly over the evil that has come now, as over that which is to come.'
translation:
  language: pt
  text: 'Mas vocês, se prepararem os corações para neles semear os frutos da Lei, esses frutos os protegerão no tempo em que o Poderoso abalar toda a criação.


    [a]Pois, dentro de pouco tempo, a construção de Sião será abalada para ser reconstruída novamente. Contudo, essa mesma construção não permanecerá; depois de algum tempo, será novamente arrancada e ficará desolada até o tempo determinado. Depois disso, deverá ser renovada em glória e ficará estabelecida para sempre.[a]


    Portanto, não devemos nos entristecer tanto pelo mal que veio agora quanto por aquele que ainda virá.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A posição exata deste trecho nos limites do capítulo é incerta no material manuscrito de controle; ele preserva, contudo, a sequência da reconstrução de Sião, de sua nova desolação e de sua renovação final em glória.
    reason: Incerteza na delimitação do texto-fonte e na atribuição do bloco ao versículo.
lexical_decisions:
- source_word: ܦܐܪ̈ܐ / seminetis in eis fructus legis
  choice: semear os frutos da Lei
  rationale: Mantém a metáfora agrícola e o plural atestado pelo siríaco, sem reduzir a expressão a uma paráfrase como “obedecer” ou “praticar boas obras”.
- source_word: ܢܓܢ / proteget vos
  choice: esses frutos os protegerão
  rationale: A formulação ativa explicita o antecedente plural, “os frutos da Lei”, e evita a ambiguidade de sujeito que surgiria em português com apenas “eles os protegerão”.
- source_word: Fortis
  choice: o Poderoso
  rationale: Conserva o epíteto divino com dignidade e naturalidade em português, sem acrescentar um nome divino ausente.
- source_word: concutiat omnem creaturam
  choice: abalar toda a criação
  rationale: “Abalar” preserva a imagem de convulsão apocalíptica sem intensificá-la para destruição; “toda a criação” comunica o alcance cósmico.
- source_word: aedificatio Sion
  choice: a construção de Sião
  rationale: Conserva a referência concreta à forma edificada de Sião sem restringi-la indevidamente ao templo ou à cidade inteira.
- source_word: renovari in gloria
  choice: renovada em glória
  rationale: Preserva tanto a restauração quanto a glória futura, sem converter a frase em mera reconstrução física.
- source_word: perficietur in perpetuum
  choice: ficará estabelecida para sempre
  rationale: Expressa conclusão duradoura em português corrente e solene, embora o verbo também possa sugerir aperfeiçoamento ou consumação.
- source_word: contristari tantopere
  choice: nos entristecer tanto
  rationale: Reproduz o tom de pesar e a comparação de intensidade em linguagem moderna e clara.
theological_decisions:
- issue: Agente da proteção
  choice: Os frutos da Lei são apresentados gramaticalmente como aquilo que protegerá o povo.
  alternative: “vocês serão protegidos” ou “ele os protegerá”
  rationale: A construção ativa e a revisão baseada no siríaco favorecem a ligação com o antecedente “frutos da Lei”; uma forma passiva apagaria essa relação textual.
- issue: Título divino no abalo da criação
  choice: “o Poderoso”
  alternative: “o Forte”
  rationale: A forma substantivada mantém o caráter reverencial do título e identifica o agente divino sem explicação doutrinária adicional.
- issue: Sequência de destruição e restauração de Sião
  choice: Manter a sequência completa, mas delimitá-la com marcadores de nota textual.
  alternative: Omitir o bloco ou imprimi-lo sem qualquer indicação de incerteza
  rationale: O material de controle preserva a construção, o novo desenraizamento e a renovação final; porém, o recorte e os limites do corpus fornecido são instáveis. A nota comunica essa incerteza sem suprimir conteúdo teologicamente relevante.
- issue: Imagem da Lei
  choice: Conservar “os frutos da Lei”.
  alternative: “os frutos da obediência” ou “as obras de justiça”
  rationale: A referência explícita à Lei e a metáfora orgânica pertencem ao texto e não devem ser substituídas por uma interpretação confessional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega “vocês” para o plural, “Lei” com inicial maiúscula por referência à Lei divina e paralelismo temporal simples. A repetição de “construção” foi mantida para preservar a retomada enfática do texto, em vez de variar estilisticamente o referente.
