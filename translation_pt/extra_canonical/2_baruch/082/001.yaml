  text: 'For now we see the abundance of the prosperity of the nations while they act wickedly, but they are compared to a drop. We look on the force of their power, but they will be reckoned as spittle. We consider the glory of their greatness, though they do not keep the commandments of the Mighty One, but have treated them with contempt. And we consider the beauty that is seen, though it is shaken in afflictions; but they will be sought out like flesh in pain. We think on the confidence in which they trust, though before our eyes it is shaken; but they will be crushed like a wave. And we seek only the hope of their strength, though it flourishes in the good things God gave them; but it will be laid away, and lamentation will come upon it.


    For the Most High is indeed hastening his times and bringing near his hours. He will judge those who oppress, and the heraldings of the age will go forth. The hidden things of all their sins will be revealed, and the quiet thoughts of what is right will spring forth. Those who now think they can escape will not be able to save themselves, nor will anyone make a covenant with famine by abundance of food. The humble will not place their hope in prosperity; rather, their heart rejoices in those things that endure. Instead, they will hope all the more because that fearsome end has arrived. They will not look on the delights of the present age, and they will know only that they are being brought to the end. But the consummation of the world will show the great strength of his governance, when everything enters what is inward and returns to what from the beginning had been appointed. Then it will be seen that what has been found was not established by men, but has truly reached its completion.


    For whatever stood, or was made, or came in conflict and passed away, shows this: evil is not forever evil, and good is not forever good. Every health is turned into sickness, every strength into weakness, every beauty into deformity, and all the bloom of youth into burdened old age. All the beauty you saw turns into darkness and corruption, and every ruin you made turns into peace and pleasantness. Every darkness that had been given turns into the light of truth. Every error and weakness turns into the lowliness of stillness. Every vengeance and wrath turns into rest and strength. And every voice of the wakeful turns into dust-born silence.


    And no possession will again be a return to death for those who seek it. Those who snatch wages will no longer bring forth death before its time, and the death that is the wage of sufferings will be taken away. There will no longer be any occasion of joy merely for delight. The realm of change will be turned into accomplished conflict, and the sound of sinners in Sheol will no longer be heard.


    So when all these things happen, do you think they will not be required from the inhabitants of the earth on one day? If then their own disclosures show that they live, their guilt itself teaches the falsehood that is in them. I have set down its full measure, because they were begotten from falsehood before I die. And I said that they were putting their trust in evil.'
translation:
  language: pt
  text: 'Pois agora vemos a abundância da prosperidade das nações enquanto praticam o mal; mas elas são comparadas a uma gota. Contemplamos a força do seu poder; mas elas serão consideradas como saliva. Levamos em conta a glória da sua grandeza, embora não guardem os mandamentos do Poderoso, mas os tenham tratado com desprezo. Também levamos em conta a beleza que se vê, embora seja abalada pelas aflições; mas elas serão procuradas como carne em sofrimento. Pensamos na confiança em que se apoiam, embora diante dos nossos olhos ela seja abalada; mas elas serão esmagadas como uma onda. E buscamos apenas a esperança de sua força, embora ela floresça graças às coisas boas que Deus lhes deu; mas será guardada fora de vista, e sobre ela virá lamentação.


    Pois o Altíssimo certamente está apressando seus tempos e aproximando suas horas. Ele julgará os que oprimem, e as proclamações da era sairão.[a] As coisas ocultas de todos os pecados deles serão reveladas, e os pensamentos serenos acerca do que é correto brotarão. Os que agora pensam que podem escapar não conseguirão salvar a si mesmos, e ninguém fará aliança com a fome por meio da abundância de alimento. Os humildes não porão sua esperança na prosperidade; antes, seu coração se alegrará nas coisas que permanecem. Pelo contrário, terão ainda mais esperança porque chegou aquele fim temível. Não contemplarão os prazeres da era presente e saberão apenas que estão sendo conduzidos ao fim. Mas a consumação do mundo mostrará a grande força do seu governo, quando tudo entrar no que está no interior[b] e retornar àquilo que desde o princípio havia sido determinado. Então se verá que o que foi encontrado não foi estabelecido por seres humanos, mas verdadeiramente chegou ao seu cumprimento.


    Pois tudo o que permaneceu, ou foi feito, ou entrou em conflito e passou, demonstra isto: o mal não é mau para sempre, nem o bem é bom para sempre.[c] Toda saúde se transforma em doença, toda força em fraqueza, toda beleza em deformidade, e todo o vigor da juventude em velhice carregada de fardos. Toda a beleza que vocês viram se transforma em escuridão e corrupção, e toda ruína que causaram se transforma em paz e suavidade. Toda escuridão que havia sido dada se transforma na luz da verdade. Todo erro e fraqueza se transformam na humildade do sossego. Toda vingança e ira se transformam em descanso e força. E toda voz dos que estão despertos se transforma em silêncio nascido do pó.[d]


    E nenhum bem possuído voltará a ser morte para os que o buscam. Os que arrebatam o salário já não produzirão morte antes do tempo, e a morte que é o salário dos sofrimentos será retirada. Já não haverá ocasião de alegria destinada apenas ao prazer. O domínio da mudança será transformado em conflito levado a termo, e já não se ouvirá a voz dos pecadores no Sheol.[e]


    Portanto, quando todas essas coisas acontecerem, você pensa que não serão requeridas dos habitantes da terra num só dia? Se, então, as próprias revelações deles mostram que estão vivos, sua própria culpa ensina a falsidade que há neles. Registrei a medida completa dela, porque eles foram gerados da falsidade antes que eu morra. E eu disse que eles depositavam sua confiança no mal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir: “os arautos da era” ou “as proclamações do mundo”.'
    reason: A expressão apocalíptica ܟܘܪ̈ܙܐ ܕܥܠܡܐ admite tanto a referência aos anunciadores quanto aos anúncios, e ܥܠܡܐ pode significar “era” ou “mundo”.
  - marker: b
    text: A formulação siríaca deste trecho é difícil; também pode indicar que tudo “entrará no íntimo”.
    reason: Preserva a incerteza sintática e semântica do trecho sem substituí-la por uma explicação teológica.
  - marker: c
    text: A formulação é deliberadamente paradoxal e integra uma série de reversões.
    reason: Assinala a dificuldade sem acrescentar uma delimitação interpretativa não expressa no texto.
  - marker: d
    text: Tradução literal aproximada de uma expressão obscura; o sentido pode ser que toda voz dos vigilantes acaba no silêncio do pó.
    reason: A linha do texto é lexical e sintaticamente difícil, exigindo transparência quanto à incerteza.
  - marker: e
    text: 'Sheol: o domínio dos mortos.'
    reason: Esclarece um termo antigo preservado na tradução sem equipará-lo automaticamente a “inferno”.
lexical_decisions:
- source_word: ܡܣܪܗܒ
  choice: está apressando
  rationale: Mantém o valor ativo e intensificado do verbo no contexto do calendário escatológico.
- source_word: ܟܘܪ̈ܙܐ ܕܥܠܡܐ
  choice: as proclamações da era
  rationale: Preserva a imagem de anúncio público e o sentido apocalíptico de ܥܠܡܐ sem convertê-la interpretativamente em simples “sinais”.
- source_word: ܩܨܐ
  choice: fim
  rationale: Expressa o limite escatológico temível; “consumação” é usado no contexto cósmico próximo para conservar a variação contextual.
- source_word: ܚܘܠܡ̈ܢܐ
  choice: saúde
  rationale: 'Conserva a concretude da sequência de reversões: saúde em doença, força em fraqueza.'
- source_word: ܕܘ̈ܓܐ
  choice: deformidade
  rationale: Mantém o contraste forte com beleza e a ideia de algo desfigurado.
- source_word: ܢܗܝܪܘܬܐ ܕܫܪܪܐ
  choice: a luz da verdade
  rationale: Preserva tanto a imagem luminosa quanto o valor de verdade de ܫܪܪܐ.
- source_word: ܡܘܩܣܢ
  choice: ira
  rationale: Adequa-se ao par com vingança e mantém a intensidade judicial do termo.
- source_word: ܫܝܘܠ
  choice: Sheol
  rationale: Evita identificar o termo antigo com uma concepção posterior e mais específica de inferno.
- source_word: ܢܘܛܦܬܐ / ܪܘܩܩܐ
  choice: uma gota / saliva
  rationale: Mantém as duas imagens concretas e distintas do texto siríaco, sem trocá-las nem suavizá-las.
- source_word: ܚܕ̣ܐ
  choice: se alegrará
  rationale: Lê a forma a partir da raiz de alegrar-se, conforme o contexto, e não como o numeral “um”.
theological_decisions:
- issue: Títulos divinos
  choice: Distinguir “Altíssimo” de “Poderoso”
  alternative: Uniformizar ambos sob um único título divino
  rationale: O siríaco emprega títulos distintos; preservá-los conserva a textura retórica e teológica.
- issue: Catálogo de reversões
  choice: Apresentá-lo no horizonte da transformação apocalíptica final
  alternative: Lê-lo apenas como observação sapiencial sobre a instabilidade da vida
  rationale: O juízo, a consumação e o Sheol no contexto situam as reversões no acerto de contas final, embora a formulação paradoxal seja mantida.
- issue: ܫܝܘܠ
  choice: Manter “Sheol”
  alternative: Traduzir por “inferno” ou “sepultura”
  rationale: “Sheol” conserva a referência antiga ao domínio dos mortos sem impor precisão doutrinária posterior.
- issue: Afirmação de que o bem não é bom para sempre
  choice: Conservar a tensão literal
  alternative: Reformular como mera transitoriedade dos bens terrenos
  rationale: O texto integra a frase a uma série de reversões, mas não explicita a limitação interpretativa; a tradução não a acrescenta.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construções naturais para leitores brasileiros. Mantiveram-se o paralelismo apocalíptico, as imagens corporais ásperas e as tensões do texto. Evitaram-se arcaísmos desnecessários e explicitações denominacionais. O possível nome “Moisés” no limite final foi tratado como palavra de chamada ou início da seção seguinte, não como parte desta frase.
