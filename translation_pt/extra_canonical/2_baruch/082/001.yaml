- from: 'Pois agora vemos a abundância da prosperidade das nações enquanto praticam o mal; mas elas são comparadas a uma gota. Contemplamos a força do seu poder; mas elas serão consideradas como saliva. Levamos em conta a glória da sua grandeza, embora não guardem os mandamentos do Poderoso, mas os tenham tratado com desprezo. Também levamos em conta a beleza que se vê, embora seja abalada pelas aflições; mas elas serão procuradas como carne em sofrimento. Pensamos na confiança em que se apoiam, embora diante dos nossos olhos ela seja abalada; mas elas serão esmagadas como uma onda. E buscamos apenas a esperança que depositam na própria força, embora ela floresça graças às coisas boas que Deus lhes deu; mas será guardada fora de vista, e sobre ela virá lamentação.


    Pois o Altíssimo certamente está apressando seus tempos e aproximando suas horas. Ele julgará os que oprimem, e as proclamações da era sairão.[a] As coisas ocultas de todos os pecados deles serão reveladas, e os pensamentos serenos acerca do que é correto brotarão. Os que agora pensam que podem escapar não conseguirão salvar a si mesmos, e ninguém fará aliança com a fome por meio da abundância de alimento. Os humildes não porão sua esperança na prosperidade; antes, seu coração se alegrará nas coisas que permanecem. Pelo contrário, terão ainda mais esperança porque chegou aquele fim temível. Não contemplarão os prazeres da era presente e saberão apenas que estão sendo conduzidos ao fim. Mas a consumação do mundo mostrará a grande força do seu governo, quando tudo entrar no que está no interior[b] e retornar àquilo que desde o princípio havia sido determinado. Então se verá que o que foi encontrado não foi estabelecido por seres humanos, mas verdadeiramente chegou ao seu cumprimento.


    Pois tudo o que permaneceu, ou foi feito, ou entrou em conflito e passou, demonstra isto: o mal não é mau para sempre, nem o bem é bom para sempre.[c] Toda saúde se transforma em doença, toda força em fraqueza, toda beleza em deformidade, e todo o vigor da juventude em velhice carregada de fardos. Toda a beleza que vocês viram se transforma em escuridão e corrupção, e toda ruína que causaram se transforma em paz e suavidade. Toda escuridão que havia sido dada se transforma na luz da verdade. Todo erro e fraqueza se transformam na humildade do sossego. Toda vingança e ira se transformam em descanso e força. E toda voz dos que estão despertos se transforma em silêncio nascido do pó.[d]


    E nenhum bem possuído voltará a ser morte para os que o buscam. Os que arrebatam o salário já não produzirão morte antes do tempo, e a morte que é o salário dos sofrimentos será retirada. Já não haverá ocasião de alegria destinada apenas ao prazer. O domínio da mudança será transformado em conflito levado a termo, e já não se ouvirá a voz dos pecadores no Sheol.[e]


    Portanto, quando todas essas coisas acontecerem, você pensa que não serão requeridas dos habitantes da terra num só dia? Se, então, as próprias revelações deles mostram que estão vivos, sua própria culpa ensina a falsidade que há neles. Registrei a medida completa dela, porque eles foram gerados da falsidade antes que eu morra. E eu disse que eles depositavam sua confiança no mal.'
