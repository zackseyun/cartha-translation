  source_fidelity: O texto siríaco traz literalmente «se passarem por estas coisas», seguido de «a esperança repousará para/sobre vocês» e da expressão final «as coisas que antes lhes foram ditas». No contexto exortativo, «fizerem estas coisas» é uma interpretação tradicional defensável, mas a alternativa literal deve ser indicada sem sugerir que a ambiguidade do verbo seja meramente hipotética. A ligação da expressão final com «esperança» permanece sintaticamente áspera e admite mais de uma análise.
  naturalness: O texto principal é claro e de registro adequado. Contudo, «a esperança daquilo que antes lhes foi anunciado» torna mais explícita do que o siríaco a relação entre esperança e as coisas anteriormente ditas. A nota atual também deixa a alternativa final elíptica demais em português.
  terminology: «Esperança» e «repousará sobre vocês» são escolhas adequadas. «Ditas» reproduz melhor o verbo genérico «foram ditas» do que «anunciado», que acrescenta uma nuance proclamativa não exigida pelo siríaco.
  issues:
  - severity: medium
    issue: A relação «a esperança daquilo que antes lhes foi anunciado» é explicitada além do texto-fonte.
    rationale: A sequência siríaca conserva uma aposição ou ligação sintaticamente difícil entre «esperança» e «as coisas que antes lhes foram ditas». «Daquilo que» resolve a dificuldade mediante uma relação de conteúdo/fundamento que é plausível, mas não inequívoca.
  - severity: low
    issue: A nota alternativa usa «aquilo» e deixa a construção final pouco inteligível.
    rationale: O siríaco está no plural («estas/aquelas coisas») e a nota deve esclarecer, não apenas reproduzir, a dificuldade da ligação final.
  - severity: low
    issue: «Anunciado» é mais específico que o verbo-fonte.
    rationale: O particípio siríaco corresponde de modo mais direto a «dito»; nenhum agente ou modo formal de anúncio é expresso.
  revised_text: Pois, se vocês fizerem estas coisas, a esperança repousará sobre vocês — esperança ligada às coisas que antes lhes foram ditas.[a]
