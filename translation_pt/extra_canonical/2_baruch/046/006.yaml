translation:
  language: pt
  text: Pois, se vocês fizerem estas coisas, a esperança repousará sobre vocês — esperança ligada às coisas que antes lhes foram ditas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, quanto ao verbo inicial: «se vocês passarem por estas coisas». Literalmente, o final diz: «a esperança ... as coisas que antes lhes foram ditas»; a relação exata entre «esperança» e essas coisas é sintaticamente incerta no siríaco.'
    reason: Mantém no texto uma leitura contextual possível, mas registra tanto o sentido mais literal do verbo quanto a construção final difícil, sem impor uma relação única entre os termos.
lexical_decisions:
- source_word: ܬܥܒܪܘܢ ܗܠܝܢ
  choice: fizerem estas coisas
  rationale: No contexto, a expressão introduz a consequência de seguir as instruções anteriores. Embora a forma transmitida possa ser entendida mais literalmente como “passarem por estas coisas”, a leitura contextual “fizerem estas coisas” é apoiada pela tradição de tradução e produz sentido natural sem alterar a exortação.
- source_word: ܢܬܬܢܝܚ ܠܟܘܢ
  choice: repousará sobre vocês
  rationale: Preserva a imagem verbal de descanso/repouso e a relação beneficente expressa por ܠܟܘܢ, em português atual e digno.
- source_word: ܣܒܪܐ
  choice: a esperança
  rationale: O substantivo siríaco pode denotar esperança, expectativa ou boa notícia. “Esperança” se ajusta à construção com “repousar” e mantém a orientação futura do contexto.
- source_word: ܗܠܝܢ ܕܩܕܡܘ ܐܡܪܘ ܠܟܘܢ
  choice: daquilo que antes lhes foi anunciado
  rationale: A formulação liga a esperança às coisas previamente declaradas, sem especificar um agente que o siríaco não explicita.
theological_decisions:
- issue: Referente de “aquilo que antes lhes foi anunciado”
  choice: Vincular a frase à esperança por meio de “a esperança daquilo que...”
  alternative: 'Tratá-la como oração independente: “essas coisas lhes foram ditas antes”'
  rationale: A sintaxe e o sentido favorecem que as promessas anteriormente anunciadas sejam o conteúdo ou fundamento da esperança, mas a nota registra a possibilidade de outra pontuação.
translation_notes:
  register: Português moderno, amplamente internacional, com leitura natural no Brasil. Emprega “vocês” por clareza contemporânea e mantém a imagem solene de a esperança repousar sobre os ouvintes.
