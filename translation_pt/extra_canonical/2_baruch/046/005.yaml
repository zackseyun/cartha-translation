  text: But prepare your hearts so that you may listen to the law and hold fast to understanding.
translation:
  language: pt
  text: Mas preparem seus corações para ouvir a Lei e apeguem-se ao entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܨܒܘ ܠܒܟ̈ܝܟܘܢ
  choice: preparem o coração
  rationale: A expressão siríaca se refere à disposição intencional do coração. O singular coletivo soa natural em português e preserva o sentido dirigido à comunidade.
- source_word: ܕܬܫܡܥܘܢ ܠܢܡܘܣܐ
  choice: para ouvir a Lei
  rationale: O verbo semítico 'ouvir' pode implicar atenção e obediência; manter 'ouvir' preserva essa amplitude sem explicitar apenas um dos sentidos. 'Lei' recebe inicial maiúscula por designar a Lei dada a Israel.
- source_word: 'entendimento (cf. camada de consulta: “hold fast to understanding”)'
  choice: apeguem-se ao entendimento
  rationale: A formulação conserva a ideia de aderir firmemente à compreensão, em linguagem portuguesa clara e digna.
theological_decisions:
- issue: O sentido de 'ouvir' em relação à Lei
  choice: ouvir a Lei
  alternative: obedecer à Lei
  rationale: A opção mantém a ambiguidade semítica entre escutar atentamente e obedecer, evitando estreitar o sentido.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção é concisa e solene, sem arcaísmos nem expansão interpretativa.
