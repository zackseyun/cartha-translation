  yaml_path: translation/extra_canonical/2_baruch/046/004.yaml
  text: 'And I said to them,

    "I cannot stand against the will of the Mighty One.

    Yet Israel will not lack a wise man,

    nor the seed of Jacob a son of the law.'
translation:
  language: pt
  text: 'E eu lhes disse:


    “Não posso resistir ao Poderoso.


    Contudo, não faltará a Israel um sábio,


    nem faltará à descendência de Jacó um filho da Lei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܘܩܒܠܐ ... ܕܚܝܠܬܢܐ
  choice: resistir ao Poderoso
  rationale: A expressão indica colocar-se contra ou em oposição ao Poderoso. A formulação mantém o sentido do siríaco sem acrescentar explicitamente “vontade”, palavra que não aparece no texto.
- source_word: ܚܟܝܡܐ
  choice: um sábio
  rationale: Equivalente direto e natural para a designação de uma pessoa sábia.
- source_word: ܒܪ ܢܡܘܣܐ
  choice: um filho da Lei
  rationale: 'Preserva a expressão semítica literal e sua possível amplitude: alguém formado pela Lei, fiel a ela ou apto a ensiná-la.'
- source_word: ܓܢܣܗ ܕܝܥܩܘܒ
  choice: à linhagem de Jacó
  rationale: ܓܢܣܐ denota povo, raça, descendência ou linhagem; “linhagem” é natural em português e mantém a referência genealógica.
theological_decisions:
- issue: A relação de Baruque com a determinação divina
  choice: “Não posso resistir ao Poderoso”
  alternative: “Não posso me opor à vontade do Poderoso”
  rationale: O texto fala diretamente de estar contra o Poderoso, sem substantivo explícito para “vontade”. A tradução escolhida evita tornar explícita uma interpretação teológica apenas implícita.
- issue: Identidade do futuro “filho da Lei”
  choice: Manter a expressão indefinida e sem identificação
  alternative: Explicitar que se trata de mestre, escriba ou sucessor específico
  rationale: O siríaco não identifica essa pessoa nem define sua função com precisão; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Lei” recebe inicial maiúscula por se referir à Lei de Israel; “Poderoso” funciona como título divino.
