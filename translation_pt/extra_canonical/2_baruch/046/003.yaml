translation:
  language: pt
  text: 'Pois onde buscaremos novamente a Lei,

    ou quem nos guiará da casa da morte para a vida?"'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: a Lei
  rationale: O termo siríaco designa a Lei/Torá; a inicial maiúscula deixa claro que se trata da Lei divina, e não de uma lei qualquer.
- source_word: ܡܕܪܟܢ
  choice: nos guiará
  rationale: Reproduz naturalmente a ideia causativa de conduzir ou mostrar o caminho.
- source_word: ܒܝܬ ܡܘܬܐ
  choice: da casa da morte
  rationale: Mantém a imagem concreta e teologicamente expressiva do texto siríaco, sem reduzi-la a uma paráfrase abstrata.
- source_word: ܠܚܝ̈ܐ
  choice: para a vida
  rationale: Preserva o contraste direto entre morte e vida; em português, o singular coletivo é a formulação mais natural.
theological_decisions:
- issue: Referência de “a Lei”
  choice: Usar “Lei” com inicial maiúscula
  alternative: Usar “lei” em minúscula ou explicitar “Torá”
  rationale: A maiúscula sinaliza a Lei divina de Israel sem acrescentar uma identificação interpretativa ausente da formulação imediata.
- issue: Imagem escatológica de morte e vida
  choice: Conservar literalmente “da casa da morte para a vida”
  alternative: Parafrasear como “da morte à vida”
  rationale: A imagem espacial da “casa da morte” é genuína no siríaco e deve permanecer aberta em sua força poética e teológica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo poético preservado. “Voltaremos a buscar” expressa de modo natural a noção de procurar novamente presente na tradição textual consultada.
