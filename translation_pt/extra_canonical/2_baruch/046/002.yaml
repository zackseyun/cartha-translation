lexical_decisions:
- source_word: ܫܪܝܪܐܝܬ
  choice: De fato
  rationale: Expressa a força asseverativa do advérbio siríaco de modo natural e digno em português.
- source_word: ܒܚܫܘܟܐ
  choice: nas trevas
  rationale: Preserva a imagem metafórica do texto; o plural é idiomático em português bíblico contemporâneo.
- source_word: ܢܘܗܪܐ
  choice: luz
  rationale: Equivalente direto, mantendo o contraste literário com as trevas.
- source_word: ܠܥܡܐ ܕܐܫܬܚܪܘ
  choice: para o povo que restar
  rationale: Entende a forma verbal no sentido de permanecer ou ser deixado para trás; 'que restar' comunica naturalmente a ideia de sobreviventes sem explicitar além do texto.
theological_decisions:
- issue: Alcance da imagem de trevas e luz
  choice: Manter a linguagem figurada sem explicá-la
  alternative: Interpretar explicitamente como abandono, sofrimento ou ausência de orientação
  rationale: O versículo não define o referente da metáfora; preservá-la evita resolver indevidamente sua tensão teológica e literária.
