lexical_decisions:
- source_word: ܢܦܠܚ
  choice: cairão
  rationale: No contexto, a forma corresponde ao sentido de cair ou incorrer em uma condição adversa; o futuro concorda com a exortação e sua consequência.
- source_word: ܒܬܘܝܒܘܬܐ
  choice: no tormento
  rationale: O substantivo designa aqui aflição ou tormento; “tormento” preserva a gravidade do aviso sem acrescentar uma definição doutrinária.
- source_word: ܕܩܕܡܘ ܐܡܪܘܗ̇ ܠܟܘܢ
  choice: do qual lhes falaram de antemão
  rationale: Reproduz o elemento temporal de anterioridade e mantém o sujeito plural indicado pela forma siríaca, em vez de convertê-lo numa passiva sem agente.
theological_decisions:
- issue: Natureza do tormento anunciado
  choice: Não especificar sua natureza
  alternative: Identificá-lo explicitamente como castigo divino ou condenação
  rationale: O versículo apenas menciona o tormento previamente anunciado; defini-lo mais precisamente importaria uma interpretação não expressa nesta linha.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “vocês” para ampla legibilidade brasileira. A construção permanece próxima do siríaco sem soar artificial.
