  yaml_path: translation/extra_canonical/2_baruch/046/001.yaml
  text: 'And my son and the elders of the people answered and said to me,


    "Has the Mighty One humbled us so greatly as to take you from us so suddenly?'
translation:
  language: pt
  text: '1 Meu filho e os anciãos do povo responderam e me disseram:


    “Será que o Poderoso nos humilhou tanto assim, a ponto de levar você do nosso meio tão de repente?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: o Poderoso
  rationale: Preserva o título divino siríaco, em vez de substituí-lo por um nome divino ou por uma formulação denominacional.
- source_word: ܡܟܟܢ
  choice: nos humilhou
  rationale: Reproduz o sentido de rebaixar ou humilhar expresso pelo verbo no contexto da perda iminente de Baruque.
- source_word: ܕܢܣܒܟ
  choice: a ponto de levar você do nosso meio
  rationale: Traduz naturalmente a ideia de tomar Baruque dentre o povo, mantendo clara a separação temida pelos interlocutores.
theological_decisions:
- issue: Identidade do agente referido pelo título divino
  choice: o Poderoso
  alternative: Deus / o Todo-Poderoso
  rationale: Mantém o título característico do texto sem explicitar além do que o siríaco afirma nem confundi-lo com um título diferente.
- issue: Tom interrogativo da fala dos anciãos
  choice: “Será que...?”
  alternative: “O Poderoso nos humilhou...?”
  rationale: Conserva a pergunta aflita e sua nuance de espanto, sem convertê-la numa declaração teológica categórica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A fala direta usa formulação natural, evitando arcaísmos pronominais; a estrutura retórica e o título divino do siríaco foram preservados.
