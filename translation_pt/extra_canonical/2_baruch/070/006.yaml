  text: When those things that were foretold have come to pass, confusion will fall upon all people. Some will fall in war, some will perish in tribulations, and some will be destroyed by their own.
translation:
  language: pt
  text: Quando acontecerem as coisas que foram anunciadas, a confusão recairá sobre todos. Alguns cairão na guerra, outros perecerão em tribulações, e outros serão destruídos pelos seus.
