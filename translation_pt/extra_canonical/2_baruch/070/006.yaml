lexical_decisions:
- source_word: ܐܬܝܢ
  choice: acontecerem
  rationale: No contexto de acontecimentos anteriormente anunciados, o verbo indica que eles chegam ou se realizam; “acontecerem” é natural em português e mantém o sentido temporal.
- source_word: ܣ̈ܓܝܐܐ ܒܙܒܘܪ̈ܐ
  choice: alguns cairão na guerra
  rationale: A formulação portuguesa conserva a distribuição de destinos entre diferentes grupos e segue a leitura contextual de morte em conflitos.
- source_word: ܒܫܪܝܪܐ
  choice: em tribulações
  rationale: Escolha contextual que comunica aflições severas sem especificar uma modalidade não explicitada pelo texto.
- source_word: ܚܒܝܒ̈ܐ
  choice: pelos seus próprios
  rationale: A expressão é mantida aberta quanto a parentes, aliados ou membros do próprio grupo, evitando resolver uma referência que permanece sucinta no texto.
theological_decisions:
- issue: Agente da destruição no último membro
  choice: pelos seus próprios
  alternative: pelos seus próprios compatriotas
  rationale: A tradução preserva a referência aberta do original e não acrescenta uma identificação social ou nacional específica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo entre “alguns”, “outros” e “outros”. A formulação final mantém deliberadamente a ambiguidade do referente.
