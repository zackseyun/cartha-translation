revisions:
- from: Quando acontecerem as coisas que foram anunciadas, a confusão se apoderará de todos os povos. Alguns cairão na guerra, outros perecerão em tribulações, e outros serão destruídos pelos seus próprios.
  to: Quando acontecerem as coisas que foram anunciadas, a confusão recairá sobre todos. Alguns cairão na guerra, outros perecerão em tribulações, e outros serão destruídos pelos seus.
  rationale: A revisão corrige o alcance de “povos” para o referente humano genérico do original, aproxima a imagem de a confusão cair sobre alguém e torna o último sintagma idiomático sem resolver quem são “os seus”. A enumeração tripartida e o sentido de todos os membros foram preservados.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:17:13Z'
review_pass:
  verdict: revise
  source_fidelity: A estrutura ternária e os destinos (“cairão na guerra”, “perecerão em tribulações” e destruição pelos seus) correspondem ao texto-fonte e à trilha inglesa. Contudo, “todos os povos” desloca o referente coletivo para nações/povos distintos, onde o original se refere genericamente a pessoas; “todos” preserva melhor esse alcance.
  naturalness: A redação é clara e moderna. “A confusão recairá sobre todos” reproduz mais diretamente a imagem verbal do original do que “se apoderará de todos”. No último membro, “pelos seus” é idiomático em português e conserva a referência deliberadamente não especificada.
  terminology: “Tribulações” é apropriado para aflições severas. “Pelos seus” mantém aberta a possibilidade de pessoas do próprio círculo, grupo ou comunidade, sem introduzir “compatriotas” ou outro referente interpretativo.
  issues:
  - severity: medium
    issue: “Todos os povos”
    rationale: A expressão portuguesa normalmente designa povos ou nações. O referente do original é humano e genérico, conforme também o inglês auditado (“all people”), não uma coleção de entidades nacionais.
  - severity: low
    issue: “Pelos seus próprios”
    rationale: A expressão fica elíptica de modo pouco natural, pois “próprios” pede um substantivo recuperável. “Pelos seus” é uma construção idiomática e mantém a mesma ambiguidade do referente.
  revised_text: Quando acontecerem as coisas que foram anunciadas, a confusão recairá sobre todos. Alguns cairão na guerra, outros perecerão em tribulações, e outros serão destruídos pelos seus.
