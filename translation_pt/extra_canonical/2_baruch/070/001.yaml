lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ܐܚܪ̈ܝܐ
  choice: as últimas águas negras
  rationale: Preserva a imagem apocalíptica concreta e o sentido culminante de ܐܚܪ̈ܝܐ, sem transformar o símbolo em uma referência genérica à calamidade.
- source_word: ܦܘܫܩܐ
  choice: a interpretação
  rationale: Emprega o termo natural em português para a explicação do significado simbólico das águas.
- source_word: ܡܠܬܐ
  choice: a palavra
  rationale: Mantém a formulação solene e deliberadamente ampla da introdução, sem especificá-la como mensagem ou profecia.
theological_decisions:
- issue: Relação entre os dois conjuntos de águas negras
  choice: As últimas águas negras vêm depois das águas negras anteriormente mencionadas.
  alternative: Tratar toda a expressão como mera repetição ou como uma referência genérica à calamidade final.
  rationale: A tradução conserva a sequência interna do simbolismo apocalíptico e não antecipa sua interpretação teológica.
- issue: Força de “últimas”
  choice: últimas
  alternative: finais
  rationale: “Últimas” comunica naturalmente tanto a posição derradeira na série quanto a proximidade do desfecho, sem tornar explícita uma conclusão escatológica além do que a imagem afirma.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A repetição de “águas negras” foi mantida porque pertence à estrutura simbólica do texto, embora soe marcada em português.
