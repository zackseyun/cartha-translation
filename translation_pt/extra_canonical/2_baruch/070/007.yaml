  text: and some will be undone by their own. Then the Most High will reveal the peoples whom he prepared beforehand, and they will come and wage war against the rulers who remain at that time.
translation:
  language: pt
  text: E alguns serão destruídos pelos seus. Então o Altíssimo revelará os povos que havia preparado de antemão; eles virão e travarão guerra contra os governantes que restarem naquele tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܘܙܒܘܢ
  choice: serão destruídos
  rationale: No contexto de calamidade e violência, expressa a ruína ou destruição sofrida; a voz passiva foi preservada.
- source_word: ܡܪܝܡܢܐ
  choice: o Altíssimo
  rationale: Equivalente tradicional e claro do título divino siríaco, sem acrescentar identificação denominacional.
- source_word: ܓܠܝܘ
  choice: revelará
  rationale: Preserva o sentido de manifestar ou trazer à vista povos previamente preparados, importante no contexto apocalíptico; evita o menos exato «incitará».
- source_word: ܕܡܩܕ̈ܡܢ
  choice: de antemão
  rationale: Mantém explicitamente a anterioridade da preparação dos povos.
- source_word: ܐܬܝܢ
  choice: virão
  rationale: Conserva a ação de vir antes da ação militar, sem fundir os dois verbos.
theological_decisions:
- issue: Manifestação apocalíptica dos povos pelo Altíssimo
  choice: «o Altíssimo revelará os povos»
  alternative: «o Altíssimo incitará os povos»
  rationale: O verbo siríaco favorece revelação ou manifestação. A formulação preserva a ideia de povos mantidos em reserva e depois manifestados, sem explicar além do texto.
- issue: Identidade dos agentes em «pelos seus próprios»
  choice: manter a expressão aberta
  alternative: «por seus próprios parentes» ou «por gente do próprio povo»
  rationale: O referente está elíptico e pode abranger pessoas próximas ou integrantes do próprio grupo; especificá-lo resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe direta. «Pelos seus próprios» é deliberadamente elíptico para conservar a ambiguidade do original. «Guerrearão» mantém de modo conciso a ação militar distinta de «virão».
