  yaml_path: translation/extra_canonical/2_baruch/070/008.yaml
  text: And whoever escapes from the war will die in the earthquake, and whoever escapes from the earthquake will be burned by fire, and whoever escapes from the fire will perish by famine.
translation:
  language: pt
  text: E quem escapar da guerra morrerá no terremoto; quem escapar do terremoto será queimado pelo fogo; e quem escapar do fogo perecerá de fome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܘܙܒ (raiz šwzb)
  choice: escapar
  rationale: Expressa livrar-se ou sair a salvo de um perigo; «escapar» é natural e preserva a repetição encadeada.
- source_word: ܢܡܘܬ (raiz mwt)
  choice: morrerá
  rationale: Equivalente direto e corrente para a morte causada pelo terremoto.
- source_word: ܢܐܒܕ (raiz ʾbd)
  choice: perecerá
  rationale: Distingue o desfecho final do simples «morrerá» e conserva o tom solene da sequência de juízos.
- source_word: ܟܦܢܐ
  choice: fome
  rationale: Designa fome ou escassez extrema; «de fome» comunica de modo idiomático a causa da morte.
theological_decisions:
- issue: Caráter inevitável da sequência de calamidades
  choice: Preservar as três orações paralelas sem explicar sua finalidade teológica
  alternative: Interpretar explicitamente as calamidades como castigo divino
  rationale: O versículo descreve a sucessão de guerra, terremoto, fogo e fome, mas não explicita aqui a agência ou a finalidade; a tradução não deve acrescentá-las.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo repetitivo preservado. A paginação siríaca fornecida no recorte não exibe de modo inequívoco as linhas deste versículo; por isso, a redação foi controlada pela tradição textual siríaca indicada e pela camada inglesa auditada, sem introduzir conteúdo interpretativo adicional.
