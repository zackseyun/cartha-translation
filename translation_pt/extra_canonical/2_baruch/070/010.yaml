  text: Pois toda a terra devorará os seus habitantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ
  choice: terra
  rationale: Mantém o sentido amplo de “terra” e a imagem de alcance total expressa pelo contexto.
- source_word: ܬܐܟܘܠ / ideia verbal de devorar
  choice: devorará
  rationale: Preserva a personificação forte da terra como agente destruidor, sem enfraquecê-la para “consumirá” ou “matará”.
- source_word: ܥܡܘܪ̈ܝܗ / ideia de habitantes
  choice: os seus habitantes
  rationale: Expressão natural em português que conserva a relação entre a terra e aqueles que nela habitam.
theological_decisions:
- issue: A terra apresentada como agente que devora
  choice: 'Preservar literalmente a personificação: “a terra devorará”.'
  alternative: Explicitar um agente de juízo divino ou parafrasear como “os habitantes serão destruídos”.
  rationale: O enunciado poético atribui a ação à própria terra; explicitar outro agente resolveria uma imagem e uma tensão que o texto não resolve.
translation_notes:
  register: Português moderno, claro e solene, com formulação concisa. O conector “Pois” mantém o caráter explicativo do versículo, e “toda a terra” conserva sua abrangência sem especificar indevidamente se se trata do mundo inteiro ou de uma região.
