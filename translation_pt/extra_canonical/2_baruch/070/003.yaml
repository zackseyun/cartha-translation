- from: Eles odiarão uns aos outros e provocarão uns aos outros para a luta; os desprezíveis dominarão sobre os honrados, e os de condição humilde serão exaltados acima dos ilustres.
  to: Eles odiarão uns aos outros e provocarão uns aos outros a lutar; os desprezíveis governarão os honrados, e os ignóbeis serão exaltados acima dos ilustres.
