  source_fidelity: A estrutura em quatro membros e as relações de hostilidade, provocação para lutar, inversão de governo e exaltação correspondem à tradição textual refletida no inglês auditado. Contudo, «de condição humilde» normalmente designa posição social modesta e não preserva o valor pejorativo de «ignoble/base»; a inversão pretendida é entre os ignóbeis e os ilustres.
