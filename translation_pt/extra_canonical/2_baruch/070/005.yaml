base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/005.yaml
  text: The wise will be silent and the foolish will speak. Then the thought of men will not be fulfilled, nor the counsel of the strong, nor the hope of those who hope.
translation:
  language: pt
  text: Os sábios ficarão em silêncio, e os tolos falarão. Então não se realizará o pensamento dos seres humanos, nem o conselho dos poderosos, nem a esperança dos que esperam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܚܫܒܬܐ ܕܒܢܝ ܐܢܫܐ
  choice: o pensamento dos seres humanos
  rationale: Reproduz de modo natural a expressão siríaca literalmente ligada aos “filhos dos homens”, sem restringi-la aos homens do sexo masculino.
- source_word: ܬܪܥܝܬܐ
  choice: conselho
  rationale: O termo pode envolver desígnio, propósito ou deliberação; “conselho” preserva a formulação tradicional e a amplitude contextual.
- source_word: ܡܣܒܪܝܢ
  choice: os que esperam
  rationale: Mantém a repetição retórica entre “esperança” e “esperam”, em vez de variá-la estilisticamente.
- source_word: ܣܟܠܐ
  choice: tolos
  rationale: Expressa a oposição sapiencial aos sábios em linguagem portuguesa corrente e digna.
theological_decisions:
- issue: Alcance do fracasso dos planos humanos
  choice: não se realizará
  alternative: não subsistirá
  rationale: A formulação indica que pensamento, conselho e esperança não alcançarão seu resultado, sem acrescentar uma explicação teológica sobre a causa.
- issue: Identidade dos fortes/poderosos
  choice: dos poderosos
  alternative: dos fortes
  rationale: “Poderosos” comunica melhor pessoas influentes ou dominantes no contexto, mas não especifica governantes, guerreiros ou qualquer grupo doutrinariamente definido.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A estrutura paralela e a repetição final foram preservadas.
