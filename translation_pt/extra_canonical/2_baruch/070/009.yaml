  text: And it will happen that anyone who escapes and is delivered from all these aforementioned things—both those who conquered and those who were conquered—will be delivered into the hands of my servant, the Messiah.
translation:
  language: pt
  text: E acontecerá que todos os que escaparem e forem salvos de todas estas coisas anteriormente mencionadas — tanto os que venceram quanto os que foram vencidos — serão entregues nas mãos do meu servo, o Messias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܘܙܒ
  choice: escapar e for salvo
  rationale: Preserva o campo semântico de livramento e sobrevivência expresso no contexto, sem reduzir a ideia apenas a fuga física.
- source_word: ܐܝܠܝܢ ܕܡܩܕ̈ܡܢ ܐܡܝܪ̈ܢ
  choice: mencionadas anteriormente
  rationale: Traduz explicitamente a oração relativa que remete às coisas já anunciadas, evitando a omissão registrada na revisão.
- source_word: ܐܝܕ̈ܝܐ
  choice: nas mãos
  rationale: Mantém o idiomatismo semítico de ser colocado sob o poder ou domínio de alguém.
- source_word: ܡܫܝܚܐ
  choice: o Messias
  rationale: Conserva o título messiânico em vez de substituí-lo por uma interpretação denominacional.
theological_decisions:
- issue: Relação entre o servo e o Messias
  choice: meu servo, o Messias
  alternative: meu servo messiânico
  rationale: A aposição preserva a identificação apresentada pelo texto sem transformar o título em mero adjetivo.
- issue: Destino dos vencedores e dos vencidos
  choice: será entregue nas mãos do meu servo, o Messias
  alternative: será salvo pelas mãos do meu servo, o Messias
  rationale: 'Mantém a tensão do texto: sobreviver às calamidades não determina por si só se a entrega ao Messias será favorável ou judicial.'
