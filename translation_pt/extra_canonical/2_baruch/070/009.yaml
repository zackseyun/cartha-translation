  to: E acontecerá que todos os que escaparem e forem salvos de todas estas coisas anteriormente mencionadas — tanto os que venceram quanto os que foram vencidos — serão entregues nas mãos do meu servo, o Messias.
  rationale: A revisão torna a concordância mais idiomática em português e remove uma nota que apresenta, sem base textual indicada, uma leitura abreviada que omite a referência explícita às coisas anteriormente mencionadas. Mantêm-se a ambiguidade da entrega ao Messias e os termos teologicamente relevantes do texto.
