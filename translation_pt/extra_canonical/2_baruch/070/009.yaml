  naturalness: A construção singular “todo aquele que ... — tanto os que venceram...” cria uma mudança de número pouco fluida. “Todos os que escaparem e forem salvos” acomoda naturalmente os dois grupos subsequentes e permite a concordância plural de “serão entregues”.
