base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/002.yaml
  text: Behold, days are coming when the time of the world has ripened and the harvest of the seed of the evil and the good has come. Then the Mighty One will bring confusion of spirit and consternation of heart upon the earth, its inhabitants, and its rulers.
translation:
  language: pt
  text: Eis que vêm dias em que o tempo do mundo terá amadurecido e terá chegado a colheita da semente dos maus e dos bons. Então o Poderoso trará sobre a terra, seus habitantes e seus governantes confusão de espírito e consternação de coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܗ ܕܥܠܡܐ
  choice: o tempo do mundo
  rationale: Conserva a expressão cosmológica e temporal sem restringi-la a “era” ou “fim”.
- source_word: ܚܨܕܐ
  choice: a colheita
  rationale: Mantém a imagem agrícola e seu sentido de momento culminante.
- source_word: ܙܪܥܐ ܕܒܝ̈ܫܐ ܘܕܛܒ̈ܐ
  choice: a semente dos maus e dos bons
  rationale: Os termos “maus” e “bons” são substantivos plurais em relação genitiva com “semente”; a formulação evita tratá-los como qualidades morais de sementes distintas.
- source_word: ܚܝܠܬܢܐ
  choice: o Poderoso
  rationale: Preserva o título divino tradicional sem acrescentar um nome ou interpretação denominacional.
- source_word: ܫܓܘܫܝܐ ܕܪܘܚܐ
  choice: perturbação de espírito
  rationale: Expressa desordem ou agitação interior e conserva a construção paralela do original.
- source_word: ܬܗܪܐ ܕܠܒܐ
  choice: consternação de coração
  rationale: Mantém a linguagem somática sem reduzir o sentido a mero medo ou confusão intelectual.
theological_decisions:
- issue: Identidade dos “maus” e dos “bons” na metáfora da colheita
  choice: dos maus e dos bons
  alternative: de suas sementes más e boas
  rationale: A morfologia aponta para substantivos plurais — pessoas más e boas — que determinam “semente”, não para adjetivos que descrevam sementes.
- issue: Referência divina pelo título de poder
  choice: o Poderoso
  alternative: o Todo-Poderoso
  rationale: “O Poderoso” traduz o título sem ampliar sua força lexical para uma afirmação explícita de onipotência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo preservado. O futuro composto em “terá amadurecido” e “terá chegado” apresenta esses acontecimentos como já culminados no momento futuro anunciado.
