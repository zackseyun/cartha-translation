base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/004.yaml
  text: Many will be delivered into the hands of the few. Those who were nothing will rule over the strong, the poor will have more than the rich, and the impious will exalt themselves over the brave.
translation:
  language: pt
  text: Muitos serão entregues nas mãos de poucos. Os que nada eram[a] dominarão os fortes; os pobres terão mais do que os ricos, e os ímpios se exaltarão acima dos valentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os que não eram ninguém”.'
    reason: Registra uma alternativa idiomática para a expressão siríaca literalmente próxima de “os que nada eram”.
lexical_decisions:
- source_word: ܐܝܠܝܢ ... ܕܠܐ ... ܡܕܡ
  choice: os que nada eram
  rationale: Preserva a formulação concreta e solene do siríaco, evitando a coloquialidade de “os que não eram ninguém”.
- source_word: ܡܣܒܪܝܢ ... ܒܐܝܕ̈ܝܐ
  choice: serão entregues nas mãos
  rationale: Mantém o conhecido semitismo “nas mãos”, que comunica sujeição ao poder de outros.
- source_word: ܓܒܪ̈ܐ
  choice: valentes
  rationale: No paralelismo apocalíptico, designa homens de força ou bravura; “valentes” conserva esse sentido sem restringi-lo a uma função militar.
theological_decisions:
- issue: Reversão apocalíptica das relações sociais e de poder
  choice: Manter as afirmações diretas sobre poucos e muitos, pobres e ricos, ímpios e valentes
  alternative: Explicitar que se trata de juízo divino ou de uma aprovação moral dos pobres
  rationale: O versículo descreve uma inversão caótica, mas não explicita aqui sua causa nem transforma cada grupo social em categoria moral; a tradução não deve acrescentar essa interpretação.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. “Dominarão” e “se exaltarão” mantêm o tom forte da descrição apocalíptica.
