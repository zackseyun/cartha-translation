  text: And the Lord said to me, "My name and my glory endure forever, but my judgment maintains its right in its time."
translation:
  language: pt
  text: 'E o Senhor me disse: “Meu nome e minha glória permanecem para sempre, mas o meu juízo mantém o seu direito[a] no devido tempo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “conserva o seu próprio direito”.'
    reason: Registra uma tradução mais literal da construção siríaca e sua possível ênfase reflexiva.
lexical_decisions:
- source_word: ܫܡܝ ... ܘܐܝܩܪܝ (texto subjacente; a leitura do OCR está corrompida)
  choice: meu nome e minha glória
  rationale: Segue a leitura textual reconhecida para o versículo e conserva os dois elementos paralelos, sem reduzir “glória” a honra ou reputação.
- source_word: ܕܝܢܝ
  choice: o meu juízo
  rationale: Mantém o sentido judicial e a possível referência tanto ao ato quanto à decisão divina.
- source_word: ܢܛܪ ... ܙܕܩܗ
  choice: mantém o seu direito
  rationale: Reproduz a formulação jurídica do siríaco sem resolver “direito/justiça” como mera correção moral.
- source_word: ܒܙܒܢܗ
  choice: no devido tempo
  rationale: Expressa de modo natural o tempo próprio ou determinado para a manifestação do juízo.
theological_decisions:
- issue: Relação entre o juízo divino e “seu direito/justiça”
  choice: o meu juízo mantém o seu direito
  alternative: o meu juízo preserva a sua justiça
  rationale: A tradução escolhida conserva a tensão jurídica e evita explicar antecipadamente se o referente é o direito próprio do juízo, sua justeza ou sua reivindicação legítima.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “meu/minha” preserva o paralelismo e a voz divina; “no devido tempo” evita uma formulação excessivamente literal e pouco idiomática.
