  yaml_path: translation/extra_canonical/2_baruch/005/005.yaml
  text: And I went and took Jeremiah, Addo, Seraiah, Jabish, Gedaliah, and all the honorable men of the people, and I brought them down to the valley of Kidron, and I told them everything that had been said to me.
translation:
  language: pt
  text: Então fui buscar Jeremias, Ado, Seraías, Jabes, Gedalias e todos os homens ilustres do povo. Fiz que descessem[a] ao vale do Cedrom e lhes contei tudo o que me havia sido dito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «levei-os para baixo».'
    reason: Registra uma forma alternativa de expressar o valor causativo do verbo de descida.
lexical_decisions:
- source_word: ܐܚܬܬ (Aphel de ܢܚܬ; conforme a leitura controlada refletida pela tradição textual do versículo)
  choice: fiz que descessem
  rationale: Preserva o sentido causativo e direcional de fazer descer, apropriado ao movimento para o vale do Cedrom, sem o reduzir ao genérico «levei».
- source_word: expressão correspondente a «os homens honrados do povo»
  choice: todos os homens ilustres do povo
  rationale: «Ilustres» comunica posição e consideração pública em português atual e digno, sem introduzir um cargo específico ausente do texto.
- source_word: expressão correspondente a «tudo o que me havia sido dito»
  choice: tudo o que me havia sido dito
  rationale: Mantém a voz passiva e não explicita o agente, preservando a formulação do relato.
