  yaml_path: translation/extra_canonical/2_baruch/005/003.yaml
  text: And you will see with your eyes that it is not the enemies who overthrow Zion, nor those who burn Jerusalem, but that they are ministers of the Judge for a time.
translation:
  language: pt
  text: E você verá com seus próprios olhos que não são os inimigos que destroem Sião, nem os que incendeiam Jerusalém, mas que eles são ministros do Juiz por algum tempo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ministros do juízo por algum tempo”.'
    reason: A expressão siríaca admite uma leitura alternativa que se refere ao juízo executado, em vez de pessoalmente ao Juiz.
lexical_decisions:
- source_word: ܒܥܝܢܝ̈ܟ (b-ʿaynayk)
  choice: com os próprios olhos
  rationale: Reproduz com naturalidade a ênfase da expressão siríaca «com os teus olhos».
- source_word: ܡܒܕܩܢܐ
  choice: inimigos
  rationale: Segue o sentido contextual de agentes hostis, conforme a leitura controlada do texto; a construção nega que eles sejam a causa última da queda de Sião.
- source_word: ܡ̇ܫܡܫܝܢ (mšamšīn)
  choice: servem
  rationale: O verbo denota prestar serviço ou atuar como ministro; «servem» é claro e idiomático em português.
- source_word: ܒܙܒܢܐ (b-zabnā)
  choice: por algum tempo
  rationale: Exprime o caráter temporal e limitado do serviço desses agentes.
theological_decisions:
- issue: Agência humana e juízo divino
  choice: «não são os inimigos...; antes, eles servem ao Juiz»
  alternative: «os inimigos destroem Sião como instrumentos do Juiz»
  rationale: 'Mantém a tensão do original: os inimigos praticam a destruição, mas não constituem sua causa última; atuam temporariamente a serviço do Juiz, sem que o texto elimine sua agência.'
- issue: Leitura de ܠܕܝ̈ܢܐ
  choice: ao Juiz
  alternative: ao juízo
  rationale: A leitura pessoal «Juiz» se ajusta melhor à construção com «servem» e ao contexto de agentes que executam uma sentença; a alternativa abstrata é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com «você» para o singular e construções naturais. O ponto e vírgula torna explícito o contraste sem enfraquecer a relação entre a ação dos inimigos e a autoridade superior do Juiz.
