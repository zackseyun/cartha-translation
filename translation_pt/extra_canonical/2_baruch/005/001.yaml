  yaml_path: translation/extra_canonical/2_baruch/005/001.yaml
  text: And I said, “So then, I have hoped in vain, and in vain was Zion built. For if those who hate us have taken possession of her, what will you do for your great name?”
translation:
  language: pt
  text: 'E eu disse: “Então, esperei em vão, e em vão Sião foi construída. Pois, se os que nos odeiam tomaram posse dela, o que farás pelo teu grande nome?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܒܪܬܝ
  choice: esperei
  rationale: Preserva o sentido de esperar ou depositar esperança, adequado ao lamento do contexto.
- source_word: ܨܗܝܘܢ
  choice: Sião
  rationale: Forma bíblica portuguesa consagrada para o nome próprio.
- source_word: ܠܡܣܒ ܪܒܘ
  choice: pelo teu grande nome
  rationale: A redação transmitida neste trecho é textualmente difícil; a formulação contextual preservada pela tradição de tradução entende a pergunta como apelo à honra do grande nome de Deus, sem acrescentar uma resposta teológica.
theological_decisions:
- issue: A relação entre a queda de Sião e a honra do nome divino
  choice: 'Manter a pergunta aberta e lamentosa: “o que farás pelo teu grande nome?”'
  alternative: Explicitar que Deus necessariamente defenderá seu nome ou restaurará Sião
  rationale: O versículo formula uma tensão teológica em forma de pergunta; antecipar sua solução apagaria a força do lamento.
- issue: A posse de Sião pelos inimigos
  choice: Descrever a posse histórica sem apresentá-la como poder último sobre Sião
  alternative: Acrescentar que os inimigos são apenas instrumentos do juízo divino
  rationale: Essa explicação aparece no contexto subsequente, mas não deve ser importada para a fala deste versículo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluência brasileira. A repetição de “em vão” foi mantida por sua função retórica, e o condicional “se” conserva a forma argumentativa da leitura contextual adotada.
