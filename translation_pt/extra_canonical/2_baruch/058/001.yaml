base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/058/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and covering this earth: it is the world which his power made when he planned to make creation. And when the word went out from before him, the beginning of the world stood forth, very small, and it was set in order according to what it was intended to become.


    And the first black waters that you saw descending from the cloud—this is the sin, the transgression that the first Adam committed. For when he sinned, death was stirred up before its time, and mourning was made known, and pains were prepared, and anguish was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in the form that had taken likeness, know that the time will be searched out, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, when he heard from God something of what was to be, reflected on the release of the dead that had been given, and on what had been commanded him by God, he kept considering it and devised five thoughts. For he made himself liable, and through him the angels also were made liable. And at the time when he was created, a vision was shown to him: the bitter life, and the elements with fire. Thus God gathered these beforehand in the likeness of those who were created.'
translation:
  language: pt
  text: 'Ouça o que é a grande nuvem que você viu subir do mar e cobrir esta terra: ela é o mundo que o poder dele fez quando planejou fazer a criação. Quando a palavra saiu de diante dele, o princípio do mundo surgiu, ainda muito pequeno, e foi organizado conforme aquilo em que deveria se tornar.


    As primeiras águas negras que você viu descer da nuvem são o pecado, a transgressão cometida pelo primeiro Adão. Pois, quando ele pecou, a morte foi despertada antes do seu tempo; o luto se tornou conhecido, as dores foram preparadas, a angústia foi criada, o trabalho penoso se completou, e a grandeza começou a ser rebaixada.


    Quanto ao último dia, que foi mostrado na forma que tomou semelhança, saiba que o tempo será examinado, a medida da humanidade será medida e sua força será provada. Pois Adão, ao ouvir de Deus algo do que haveria de acontecer, refletiu sobre a libertação dos mortos que havia sido concedida[a] e sobre aquilo que Deus lhe havia ordenado. Ele continuou ponderando essas coisas e concebeu cinco pensamentos. Pois incorreu em culpa, e, por meio dele, também os anjos incorreram em culpa. Além disso, quando foi criado, foi-lhe mostrada uma visão: a vida amarga e os elementos, com fogo. Assim, Deus reuniu antecipadamente essas coisas na semelhança dos que foram criados.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “libertação dos mortos” é incerta; também pode ser entendida como uma remissão referente aos mortos, mas o texto não a identifica explicitamente com a ressurreição.
    reason: Preserva a ambiguidade lexical e teológica de ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ sem harmonização doutrinária.
  - marker: b
    text: A expressão traduzida por “antecipadamente” é difícil e também pode ser entendida como “no tempo devido”.
    reason: Registra a incerteza contextual de ܒܥܕܢ sem acrescentar uma interpretação geográfica especulativa.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: o princípio do mundo
  rationale: Expressa o surgimento primordial do mundo sem restringir a frase à sua fundação material ou à sua organização posterior.
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: o pecado, a transgressão
  rationale: Mantém os dois termos do siríaco e apresenta o ato de Adão como pecado e violação de um limite.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: a morte foi despertada
  rationale: O verbo indica que a morte foi posta em atividade, não simplesmente que passou a existir.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: a grandeza começou a ser rebaixada
  rationale: Preserva a imagem de declínio e a ideia de diminuição decorrente da transgressão.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: a medida da humanidade
  rationale: Conserva o paralelismo avaliativo com o tempo examinado e a força provada, sem transformar a expressão em uma norma jurídica.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: a libertação dos mortos
  rationale: Mantém a formulação difícil e marcante do texto sem identificá-la explicitamente com a ressurreição.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: tornou ... culpado
  rationale: Comunica a responsabilidade judicial ou culpabilidade contraída, em português corrente e digno.
- source_word: ܐܣܛܘܟܣܐ
  choice: os elementos
  rationale: O empréstimo grego se refere aos elementos cósmicos; esta é a opção mais clara e menos interpretativa.
theological_decisions:
- issue: O ato de Adão e a entrada da morte
  choice: A transgressão primordial de Adão desperta a morte antes do tempo e dá início à sequência de sofrimentos humanos.
  alternative: Ler a passagem apenas como descrição geral da condição humana, sem nexo causal direto.
  rationale: A sintaxe siríaca liga explicitamente o pecado de Adão à ativação da morte, ao luto, às dores, à angústia e ao trabalho penoso.
- issue: A libertação dos mortos
  choice: A expressão permanece relativamente literal e recebe nota sobre sua incerteza.
  alternative: Explicitar a expressão como ressurreição dos mortos ou como sentença de mortalidade.
  rationale: O texto é sintaticamente difícil e não permite definir com segurança qual doutrina específica está em vista.
- issue: A culpabilidade dos anjos por meio de Adão
  choice: Preserva-se a afirmação incomum de que, por meio de Adão, também os anjos foram tornados culpados.
  alternative: Reformular a frase para atribuir a culpa somente a Adão ou a seres humanos.
  rationale: A leitura mais direta do siríaco associa os anjos à responsabilidade, e a tradução não deve eliminar essa tensão teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. A tradução mantém repetições retóricas relevantes, como “a medida ... será medida”, e conserva as dificuldades teológicas do siríaco em vez de harmonizá-las.
