lexical_decisions:
- source_word: ܡܪܝܡܐ (marymā)
  choice: o Altíssimo
  rationale: Título divino tradicional e natural em português, sem substituir o título por um nome próprio.
- source_word: ܙܒ̈ܢܘܗܝ (zabnaw[hy])
  choice: os seus tempos
  rationale: Preserva a referência a períodos determinados por Deus e a relação possessiva do texto.
- source_word: ܥܕ̈ܢܘܗܝ (ʿeddānaw[hy])
  choice: as suas horas
  rationale: Mantém o paralelismo com “tempos” e expressa momentos fixados, sem fundir os dois termos.
- source_word: ܡܣܪܗܒܘ / ܢܣܪܗܒ (raiz srhb)
  choice: certamente apressará
  rationale: Reproduz tanto a ideia de acelerar a chegada quanto a força enfática da construção siríaca.
- source_word: ܡܥܝܘ / ܢܡܥܐ (raiz mṭy/mʿy, conforme a tradição textual)
  choice: fará chegar
  rationale: Comunica de modo idiomático que os momentos determinados serão trazidos ao seu cumprimento.
theological_decisions:
- issue: Agência divina sobre os tempos escatológicos
  choice: Manter “seus tempos” e “suas horas” sob a ação explícita do Altíssimo
  alternative: Generalizar como “o fim chegará depressa”
  rationale: O texto atribui diretamente ao Altíssimo o governo dos períodos e momentos; a tradução não reduz isso a uma afirmação cronológica genérica.
- issue: Valor de “horas”
  choice: Conservar o plural concreto “horas”
  alternative: Traduzir interpretativamente como “momentos determinados”
  rationale: “Horas” preserva o paralelismo poético e deixa aberta a extensão exata desses períodos.
translation_notes:
  register: Português moderno, digno e de leitura ampla. O paralelismo semítico foi preservado, mas a segunda ocorrência de “certamente” ficou implícita na coordenação para evitar peso artificial em português; a certeza abrange os dois verbos.
