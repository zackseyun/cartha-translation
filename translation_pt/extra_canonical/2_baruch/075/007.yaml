  yaml_path: translation/extra_canonical/2_baruch/075/007.yaml
  text: But we who live—if we know why we came, and submit ourselves to him who brought us out from Egypt—we shall come again, and we shall remember what has passed, and rejoice over what was.
translation:
  language: pt
  text: Mas nós, os que vivemos — se soubermos por que viemos e nos sujeitarmos àquele que nos tirou do Egito —, voltaremos, recordaremos o que passou e nos alegraremos com o que foi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܝܢ (ḥayyīn, conforme a leitura controlada do versículo)
  choice: os que vivemos
  rationale: O verbo siríaco significa “viver”. A tradução evita “os que permanecemos”, que introduziria um sentido menos preciso.
- source_word: ܡܫܥܒܕܝܢܢ (mešaʿbdīnan, conforme a leitura controlada do versículo)
  choice: nos sujeitarmos
  rationale: O particípio expressa uma condição presente e contínua, paralela a “soubermos”, não apenas uma ação concluída no passado.
- source_word: ܐܦܩܢ (appeqan, conforme a leitura controlada do versículo)
  choice: nos tirou
  rationale: A forma derivada de n-p-q denota fazer sair ou tirar; no contexto do êxodo do Egito, “nos tirou” é preciso e natural.
- source_word: ܢܐܬܐ / forma verbal correspondente na leitura controlada
  choice: voltaremos
  rationale: Reproduz de modo natural a ideia de vir novamente, sem especificar além do texto o destino ou a natureza desse retorno.
theological_decisions:
- issue: Identidade daquele que tirou o povo do Egito
  choice: àquele que nos tirou do Egito
  alternative: a Deus, que nos tirou do Egito
  rationale: Mantém a referência pronominal do texto sem inserir explicitamente um nome que, embora claro no contexto, não aparece nesta formulação.
- issue: Natureza do retorno
  choice: voltaremos
  alternative: ressuscitaremos / retornaremos à vida
  rationale: Preserva a formulação aberta do texto e não define o retorno como ressurreição ou outro evento escatológico específico.
- issue: Objeto da alegria final
  choice: nos alegraremos com o que existiu
  alternative: nos alegraremos com o que aconteceu
  rationale: A redação conserva a amplitude de “o que foi/era” e evita restringi-la apenas a acontecimentos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção condicional clara. Os travessões preservam a tensão entre a identidade dos vivos, seu conhecimento e sua sujeição. Não foram mantidas notas alternativas herdadas quando elas representavam leituras lexicalmente menos precisas (“permanecemos”, “nos fez subir”) ou uma mudança aspectual desnecessária.
