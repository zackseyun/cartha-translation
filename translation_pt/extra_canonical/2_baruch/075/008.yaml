base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/075/008.yaml
  text: But if we do not now know why we came, and do not recognize what has been, neither shall the immeasurable be seen, nor shall the preeminence of him who established it from the beginning be made known; and not a few living creatures would be astonished.”
translation:
  language: pt
  text: Mas, se agora não soubermos por que viemos e não reconhecermos o que houve, nem o incomensurável será visto, nem será conhecida a preeminência daquele que o estabeleceu desde o princípio; e não poucos seres vivos ficarão admirados.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܡܣܬܝܟܝܢ (contextual concept; cf. supplied Syriac bucket)
  choice: o incomensurável
  rationale: Mantém a ideia de algo sem limites ou impossível de delimitar, sem explicitar indevidamente se o referente é Deus, sua obra ou outra realidade.
- source_word: 'English consultation: preeminence'
  choice: preeminência
  rationale: Preserva a noção abstrata de superioridade ou grandeza distintiva sem introduzir um título teológico não explícito.
- source_word: 'English consultation: living creatures'
  choice: criaturas vivas
  rationale: Formulação ampla e natural que não restringe o referente a seres humanos ou animais.
- source_word: 'English consultation: established'
  choice: estabeleceu
  rationale: Conserva o sentido de fundar, ordenar ou fixar desde o princípio, sem escolher uma interpretação mais específica como criar.
theological_decisions:
- issue: Referente de “o incomensurável”
  choice: Mantido sem identificação explícita
  alternative: “a grandeza incomensurável de Deus”
  rationale: O referente permanece ambíguo no material de consulta; explicitá-lo importaria uma interpretação teológica.
- issue: Referente pronominal em “o estabeleceu”
  choice: Mantido pelo pronome “o”
  alternative: Nomear “o mundo”, “todas as coisas” ou “o incomensurável”
  rationale: A tradução conserva a tensão referencial em vez de resolver silenciosamente o objeto do verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção correlativa “nem... nem...” preserva o encadeamento argumentativo, e “não poucas” mantém a litotes do texto de consulta. A alternância entre futuro (“será”) e condicional (“ficariam”) foi conservada por refletir a tensão modal da formulação transmitida.
