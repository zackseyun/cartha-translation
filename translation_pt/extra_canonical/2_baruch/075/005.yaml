  text: Or who among those born can hope to come to these things, unless it is one to whom you show mercy and are gracious?
translation:
  language: pt
  text: Ou quem, entre os que nasceram, pode esperar alcançar essas coisas, a não ser aquele de quem tens misericórdia e a quem concedes tua graça?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܠܝܕܐ / conceito subjacente preservado na tradição textual (“os nascidos”)
  choice: os que nasceram
  rationale: Mantém a referência abrangente aos seres humanos nascidos, em português natural, sem restringi-la a um grupo específico.
- source_word: conceito de chegar/vir a estas coisas
  choice: alcançar essas coisas
  rationale: Expressa a ideia de chegar a participar ou obter as realidades mencionadas, sem definir além do texto em que elas consistem.
- source_word: raízes de misericórdia e graça/favor
  choice: tens misericórdia e ... concedes tua graça
  rationale: Preserva os dois aspectos paralelos — compaixão e favor concedido — em linguagem teológica clara e corrente.
theological_decisions:
- issue: A possibilidade humana de alcançar as realidades esperadas
  choice: pode esperar alcançar ... a não ser aquele de quem tens misericórdia
  alternative: pode alcançar por seu próprio mérito
  rationale: 'A formulação conserva a tensão do texto: há esperança, mas ela depende da misericórdia e da graça divinas, sem desenvolver uma doutrina denominacional específica.'
- issue: Relação entre misericórdia e graça
  choice: tratadas como expressões paralelas, mas distintas
  alternative: fundidas em uma única ideia de bondade
  rationale: Manter ambas evita apagar a duplicidade enfática do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega tratamento direto a Deus na segunda pessoa do singular, coerente com o tom de oração. O material siríaco fornecido é um recorte amplo e textualmente irregular do capítulo; por isso, a redação segue com cautela o sentido controlado da unidade versicular atestada, sem introduzir pormenores não recuperáveis com segurança do recorte.
