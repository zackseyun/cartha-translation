lexical_decisions:
- source_word: ܪ̈ܚܡܝܟ
  choice: tuas misericórdias
  rationale: Mantém o sentido de compaixão e favor divinos expresso pelo termo siríaco, em linguagem bíblica clara e corrente.
- source_word: ܢܒܨܐ
  choice: pode sondar
  rationale: “Sondar” comunica a ideia de investigar profundamente ou perscrutar, sem sugerir que as misericórdias possam ser plenamente compreendidas.
- source_word: ܕܠܐ ܡܣܬܝܟܝܢ
  choice: que não têm fim
  rationale: Expressa de modo natural a ausência de limite ou término, preservando a afirmação enfática do texto.
theological_decisions:
- issue: Caráter ilimitado das misericórdias divinas
  choice: que não têm fim
  alternative: que são insondáveis
  rationale: A tradução preserva a infinitude afirmada na oração relativa, enquanto “sondar” já transmite, na pergunta retórica, a impossibilidade humana de compreendê-las plenamente.
