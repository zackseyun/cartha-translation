lexical_decisions:
- source_word: ܣܘܟܠܐ
  choice: entendimento
  rationale: O substantivo siríaco pode designar entendimento, inteligência ou compreensão; “entendimento” preserva o sentido cognitivo e corresponde à formulação interrogativa do contexto.
- source_word: ܡܬܕܪܟܐ
  choice: compreender
  rationale: O campo semântico envolve alcançar, apreender ou compreender; “compreender” expressa com naturalidade a incapacidade humana diante do entendimento divino.
theological_decisions:
- issue: Incompreensibilidade do entendimento divino
  choice: Manter a pergunta retórica sem explicar seus limites ou alcance
  alternative: Explicitar que nenhum ser humano pode compreender plenamente a mente de Deus
  rationale: O texto afirma a transcendência por meio de uma pergunta e não especifica aqui “ser humano”, “plenamente” nem uma doutrina sistemática da incompreensibilidade.
translation_notes:
  register: Português moderno, claro e reverente. A repetição conceitual entre “compreender” e “entendimento” foi mantida para refletir a formulação concisa e deliberadamente abstrata do texto.
