base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/075/006.yaml
  text: For unless, in compassion, you have mercy on human beings, those who are under your right hand cannot come to these things, except those who are called in the excellent number.
translation:
  language: pt
  text: Pois, a menos que, em tua compaixão, tenhas misericórdia dos seres humanos, os que estão sob tua mão direita não poderão alcançar essas coisas, exceto os que são chamados no número excelente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme outra compreensão da expressão: “entre os de número distinto”. O texto siríaco neste ponto é difícil.'
    reason: A expressão final tem transmissão e sintaxe incertas; a nota preserva uma alternativa plausível sem substituir a leitura principal.
lexical_decisions:
- source_word: ܒܥܘܩܒܪܗ / expressão correspondente no testemunho de leitura difícil
  choice: em tua misericórdia
  rationale: Mantém a linguagem de compaixão/misericórdia atestada pela tradição textual e refletida na camada inglesa, sem reduzir a frase a uma ideia abstrata de bondade.
- source_word: ܒܢܝܢܫ̈ܐ
  choice: seres humanos
  rationale: Tradução inclusiva e natural de ‘filhos dos homens/humanidade’, sem restringir a referência a homens adultos.
- source_word: ܬܚܝܬ ܝܡܝܢܟ / expressão refletida na tradição
  choice: sob tua mão direita
  rationale: Preserva a imagem espacial e teológica da mão direita, em vez de explicá-la como proteção, autoridade ou favor.
- source_word: ܡܢܝܢܐ ... / leitura textual incerta refletida como excellent number
  choice: número excelente
  rationale: Conserva a formulação incomum e a ambiguidade do testemunho, evitando identificar por interpretação quem compõe esse grupo.
theological_decisions:
- issue: Alcance da misericórdia divina e exceção final
  choice: Manter a tensão entre a necessidade da misericórdia e o grupo excepcionalmente chamado
  alternative: Reformular como se apenas um grupo predestinado recebesse misericórdia ou como se todos a recebessem indistintamente
  rationale: O texto apresenta uma relação difícil entre misericórdia, os que estão sob a mão direita e os chamados; a tradução não resolve essa tensão por meio de uma doutrina externa.
- issue: Sentido de ‘mão direita’
  choice: Preservar a metáfora literalmente
  alternative: Traduzir como ‘sob tua proteção’ ou ‘sob teu favor’
  rationale: A metáfora pode envolver poder, favor, proteção ou pertencimento; explicitar apenas um desses sentidos eliminaria sua amplitude.
translation_notes:
  register: Português moderno, claro e solene, com tratamento na segunda pessoa do singular dirigido a Deus. A construção mantém as imagens do original e evita linguagem denominacional.
