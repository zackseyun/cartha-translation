  text: And I answered and said, “Who can comprehend your goodness, Lord? For it is beyond comprehension.”
translation:
  language: pt
  text: 'Então respondi e disse: “Quem pode compreender a tua bondade, Senhor? Pois ela está além de toda compreensão[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois ela é incompreensível.”'
    reason: Registra uma tradução adjetival mais direta do predicado, sem alterar o sentido básico.
lexical_decisions:
- source_word: ܛܒܬܐ
  choice: bondade
  rationale: Preserva a amplitude do atributo divino, sem restringi-lo a mera gentileza ou generosidade.
- source_word: ܡܬܬܚܡܐ
  choice: está além de toda compreensão
  rationale: Expressa em português corrente e digno a ideia de algo que não pode ser delimitado ou plenamente apreendido.
theological_decisions:
- issue: Se a impossibilidade de compreender se refere à bondade divina ou ao próprio Senhor
  choice: Mantém como referente imediato “a tua bondade”
  alternative: “Pois tu és incompreensível”
  rationale: A formulação preserva o referente apresentado na pergunta e evita deslocar silenciosamente a afirmação para uma definição mais ampla da incompreensibilidade divina.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa coerentes na oração dirigida ao Senhor. Conserva a fórmula narrativa semítica “respondi e disse” por sua função literária e mantém uma alternativa genuína em nota.
