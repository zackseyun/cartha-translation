translation:
  language: pt
  text: 1 Quanto às outras águas que você viu, mais negras do que todas as anteriores — estas são...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto siríaco fornecido interrompe a frase neste ponto; literalmente, “estas são elas...”.
    reason: Sinaliza que a construção incompleta decorre da interrupção do testemunho apresentado, sem completar conjecturalmente a identificação das águas.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܚܪ̈ܢܐ
  choice: últimas águas
  rationale: No contexto da sequência visionária que se aproxima do fim, o adjetivo aponta melhor para as águas finais ou últimas, embora isoladamente também possa ser entendido como “outras”.
- source_word: ܕܐܘܟܡܝܢ ܗܘܘ ܡܢ ܟܠܗܘܢ ܗܢܘܢ ܕܩܕܡܝܗܘܢ
  choice: mais negras do que todas as anteriores
  rationale: Preserva a força comparativa do siríaco e a imagem recorrente das águas negras.
- source_word: ܗܢܘܢ ܗܘ
  choice: estas são...
  rationale: Reproduz a identificação iniciada no siríaco sem completar por conjectura a frase interrompida no testemunho fornecido.
theological_decisions:
- issue: Completar ou não a identificação das últimas águas
  choice: manter a frase interrompida com reticências
  alternative: acrescentar que elas pertencem ao mundo inteiro ou antecipar sua interpretação
  rationale: O texto siríaco disponibilizado termina abruptamente nesta oração. Não se acrescenta conteúdo conjectural nem uma interpretação teológica ausente do testemunho apresentado.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural para leitores brasileiros e compreensão ampla no mundo lusófono. A abertura “Quanto às” introduz com fluidez a explicação da visão; as reticências preservam a interrupção textual.
