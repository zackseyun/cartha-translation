translation:
  language: pt
  text: Pois os males e os bens que estão por vir estão diante dele como uma única recordação estabelecida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝ̈ܫܬܐ ... ܘ̈ܛܒܬܐ (bīšātā ... w-ṭābātā)
  choice: os males e os bens
  rationale: Mantém o contraste substantivado do siríaco em linguagem portuguesa natural, sem restringi-lo apenas a acontecimentos.
- source_word: ܕܥܬܝܕܝܢ ... ܕܢܗܘܘܢ (d-ʿtīdīn ... d-nehwōn)
  choice: que estão por vir
  rationale: Expressa a construção de expectativa ou destinação futura de modo corrente e dignificado; a presença de ܗܘܘ permite também uma leitura com perspectiva passada, registrada em nota.
- source_word: ܩܕܡܘܗܝ ܩܿܝܡܢ (qḏāmōhy qāymān)
  choice: permanecem diante dele
  rationale: Conserva a imagem de coisas postadas ou presentes diante dele; 'permanecem' combina naturalmente com a ideia subsequente de uma lembrança fixa.
- source_word: ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ (ḥdā dukrānhōn šrā)
  choice: como uma única lembrança fixa
  rationale: Segue o sentido contextual de que todos esses males e bens estão conjuntamente presentes à memória divina; 'fixa' comunica algo estabelecido e permanente sem explicar além do texto.
theological_decisions:
- issue: Conhecimento divino dos acontecimentos futuros
  choice: Os males e os bens futuros permanecem diante dele como uma única lembrança fixa.
  alternative: Os males e os bens foram predeterminados por ele.
  rationale: O texto descreve sua presença diante de Deus, mas não declara aqui que Deus os causou ou decretou; a tradução evita importar uma conclusão determinista.
- issue: Perspectiva temporal da construção futura
  choice: que estão por vir
  alternative: que estavam destinados a acontecer
  rationale: O valor principal é prospectivo, mas a forma auxiliar passada do siríaco permite uma perspectiva narrativa passada; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, amplo e legível no Brasil. A formulação mantém a concisão solene do original e preserva a imagem de todos os males e bens futuros simultaneamente presentes diante de Deus.
