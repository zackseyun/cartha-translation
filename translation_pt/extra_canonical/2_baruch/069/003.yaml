review_pass:
  verdict: revise
  source_fidelity: O siríaco diz que os males e os bens futuros «estão/postam-se diante dele» como uma só recordação estabelecida. «Permanecem» é interpretativo, pois o particípio qāymān expressa прежде de tudo estar de pé, estar presente ou posto diante dele. A nota proposta introduz uma alternativa passada que o próprio histórico inglês mais recente rejeita para esta construção prospectiva.
  naturalness: A redação é fluente, mas «estão diante dele» é mais direta e fiel do que «permanecem diante dele». «Recordação» é ligeiramente mais natural neste contexto solene do que «lembrança», sem alterar a imagem.
  terminology: «Males e bens» reproduz adequadamente o contraste siríaco. «Uma única recordação fixa» comunica a unidade e estabilidade da recordação; «estabelecida» se aproxima mais do sentido de algo firmemente posto/assentado.
  issues:
  - severity: medium
    issue: Nota com alternativa temporal passada e modalizada
    rationale: «Que estavam destinados a acontecer» transforma a principal referência futura da construção em passado e acrescenta a nuance de destinação. O audit trail inglês registra especificamente que a leitura passada produz conflito temporal e foi substituída por «are to be». Não é uma variante segura a preservar em nota.
  - severity: low
    issue: «Permanecem» para qāymān
    rationale: O termo descreve os eventos como estando ou postos diante de Deus. «Permanecem» pode sugerir duração como informação lexical principal; «estão» preserva melhor a imagem sem perder a estabilidade explicitada na recordação.
  revised_text: Pois os males e os bens que estão por vir estão diante dele como uma única recordação estabelecida.
  revised_footnotes: []
  revision_rationale: A revisão conserva a referência prospectiva inequívoca dos males e bens e traduz de modo mais imediato a imagem de eles estarem diante de Deus. Remove-se a nota cuja alternativa passada e determinista não é sustentada com segurança pelo contexto nem pelo audit trail fornecido.
