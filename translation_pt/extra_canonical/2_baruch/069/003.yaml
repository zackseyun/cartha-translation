revisions:
- from: Pois os males e os bens que estão por vir[a] permanecem diante dele como uma única lembrança fixa.
  to: Pois os males e os bens que estão por vir estão diante dele como uma única recordação estabelecida.
  rationale: A revisão conserva a referência prospectiva inequívoca dos males e bens e traduz de modo mais imediato a imagem de eles estarem diante de Deus. Remove-se a nota cuja alternativa passada e determinista não é sustentada com segurança pelo contexto nem pelo audit trail fornecido.
