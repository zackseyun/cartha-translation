translation:
  language: pt
  text: E os fins dos tempos dos justos, que iriam cumprir-se diante dele, permanecem como uma só lembrança fixa, além das coisas que ele fará na consumação da era.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na consumação do mundo”.'
    reason: O siríaco ܥܠܡܐ pode significar tanto “era” quanto “mundo” neste contexto.
lexical_decisions:
- source_word: ܫܘܠܡܗ ܕܥܠܡܐ (šūllāmeh d-ʿālmā)
  choice: consumação da era
  rationale: ܫܘܠܡܐ indica conclusão, cumprimento ou consumação, e ܥܠܡܐ pode designar mundo ou era. A formulação escolhida conserva o tom escatológico sem reduzir a expressão à mera destruição do mundo.
- source_word: ܩܿܝܡ ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ
  choice: permanecem como uma única memória estabelecida
  rationale: A sequência textual é difícil e parece refletir a ideia de que esses acontecimentos estão conjuntamente presentes ou firmados na memória divina. A tradução mantém a imagem incomum do original, sem explicá-la em excesso.
- source_word: ܩܕܡܘܗܝ
  choice: diante dele
  rationale: Mantém a referência pronominal e a linguagem espacial do siríaco, sem identificar explicitamente o referente como Deus quando o versículo não o nomeia.
theological_decisions:
- issue: Referente de “dele”
  choice: manter o pronome sem explicitação
  alternative: traduzir “diante de Deus”
  rationale: O contexto provavelmente aponta para Deus, mas o siríaco emprega apenas o pronome; explicitar o nome resolveria uma referência que o texto preserva implicitamente.
- issue: Sentido escatológico de ܥܠܡܐ
  choice: era
  alternative: mundo
  rationale: “Era” expressa bem a dimensão temporal da consumação, enquanto a nota registra a possibilidade lexical de “mundo”.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura suficientemente formal para preservar a linguagem visionária e a sintaxe teologicamente tensa do texto siríaco.
