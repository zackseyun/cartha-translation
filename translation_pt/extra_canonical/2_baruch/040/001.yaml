base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/040/001.yaml
  text: The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties, and will set before him all the wicked deeds of his hosts.
translation:
  language: pt
  text: O último governante daquele tempo será deixado com vida quando a multidão de suas tropas tiver sido abatida à espada. Ele será amarrado, e o levarão ao monte Sião. Então, o meu Messias o declarará culpado de todas as suas impiedades e porá diante dele todas as obras perversas de suas tropas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܘܬܗ
  choice: suas impiedades
  rationale: Mantém a dimensão de perversidade contra Deus no cenário de julgamento messiânico, sem reduzir a acusação a mera transgressão política.
- source_word: ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ
  choice: todas as obras perversas de suas tropas
  rationale: Conserva tanto a referência explícita às obras quanto seu caráter moralmente perverso e o alcance coletivo da acusação.
- source_word: ܛܘܪ ܨܗܝܘܢ
  choice: monte Sião
  rationale: É a forma própria, corrente e natural em português para o local do julgamento messiânico.
- source_word: Messiah title (ܡܫܝܚܝ)
  choice: o meu Messias
  rationale: Preserva o possessivo e a identidade messiânica pessoal expressa no texto, sem converter o título em uma descrição genérica.
theological_decisions:
- issue: O papel do Messias no julgamento do governante final
  choice: O Messias declara pessoalmente culpado o último governante no monte Sião.
  alternative: Entender a cena apenas como símbolo de uma era messiânica ou de um agente ungido genérico.
  rationale: A expressão “meu Messias” e sua ação judicial direta exigem que permaneçam visíveis tanto sua identidade pessoal quanto sua função de juiz.
- issue: Força judicial do verbo traduzido por “convict” na camada inglesa auditada
  choice: declarará culpado
  alternative: convencerá; repreenderá
  rationale: “Declarará culpado” comunica com clareza o sentido forense da cena e evita o sentido moderno de persuadir que “convencerá” poderia sugerir.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tropas” foi empregado para o coletivo militar, “abatida à espada” preserva a imagem bélica e a voz passiva, e a divisão em três períodos evita uma frase excessivamente pesada sem alterar a progressão do texto.
