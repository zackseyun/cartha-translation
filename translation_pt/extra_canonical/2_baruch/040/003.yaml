  yaml_path: translation/extra_canonical/2_baruch/040/003.yaml
  text: And his dominion will stand forever, until the world of corruption comes to its end, and until the times spoken of before are fulfilled.
translation:
  language: pt
  text: E o seu domínio permanecerá para sempre, até que o mundo da corrupção chegue ao fim e se cumpram os tempos mencionados anteriormente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܛܢܗ (forma reconstruída pelo contexto da continuação)
  choice: o seu domínio
  rationale: Expressa autoridade soberana ou governo; “domínio” mantém o sentido político e escatológico sem especificar indevidamente reino ou poder.
- source_word: ܥܠܡܐ ܕܚܒܠܐ (formulação provável na continuação)
  choice: o mundo da corrupção
  rationale: Preserva a construção genitiva e a possível amplitude de “corrupção”, que pode envolver deterioração, ruína ou condição corruptível.
- source_word: ܢܫܬܠܡܘܢ (forma provável na continuação)
  choice: se cumpram
  rationale: Em referência a tempos previamente anunciados, “cumprir-se” comunica conclusão e realização, não apenas passagem cronológica.
theological_decisions:
- issue: A tensão entre “para sempre” e “até que”
  choice: para sempre, até que
  alternative: continuamente, até que
  rationale: A redação conserva a tensão escatológica da formulação recebida em vez de harmonizá-la ou explicar “para sempre” como mera duração limitada.
- issue: Natureza do “mundo da corrupção”
  choice: mundo da corrupção
  alternative: mundo corruptível
  rationale: A opção escolhida não decide se a expressão descreve a corrupção moral, a decadência cósmica ou ambas.
translation_notes:
  register: Português moderno, claro e solene. “Permanecerá” soa natural com “domínio” e representa a ideia de estabilidade duradoura. O trecho siríaco fornecido termina antes da redação integral do versículo 40:3; por isso, as formas lexicais indicadas são reconstruções contextuais controladas pela camada inglesa auditada e pela sequência do capítulo.
