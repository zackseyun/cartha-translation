  text: For surely wrath will be aroused against you at its appointed time; for now it is restrained by longsuffering, as by a bridle.
translation:
  language: pt
  text: Pois certamente a ira se levantará contra você no tempo determinado; por enquanto, porém, ela é contida pela longanimidade, como por um freio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ (conceito refletido na tradição textual consultada)
  choice: ira
  rationale: Mantém a força judicial e emocional do termo sem especificar além do texto se a ira é divina.
- source_word: ܒܙܒܢܐ
  choice: no tempo determinado
  rationale: Expressa um momento estabelecido ou apropriado, em vez de um período meramente genérico.
- source_word: ܡܓܪܬ ܪܘܚܐ (expressão semítica subjacente à leitura consultada)
  choice: longanimidade
  rationale: Preserva o sentido de contenção paciente e prolongada; é mais preciso aqui do que a simples ideia de espera.
- source_word: ܐܚܝܕܐ / ideia de contenção
  choice: é contida
  rationale: Conserva a imagem de uma força já presente, mas mantida sob controle.
- source_word: imagem do freio
  choice: como por um freio
  rationale: Mantém a comparação concreta de algo vigoroso que é refreado.
theological_decisions:
- issue: Identidade de quem contém a ira
  choice: 'Construção passiva: “ela é contida”'
  alternative: “Deus contém a ira”
  rationale: O texto não identifica explicitamente o agente nesta formulação; a voz passiva preserva essa abertura.
- issue: Natureza da longanimidade
  choice: “longanimidade” sem possuidor expresso
  alternative: “a longanimidade de Deus”
  rationale: Evita acrescentar uma identificação teológica que, embora plausível, não está explicitada na frase.
- issue: Referente de “você”
  choice: Singular não marcado em gênero
  alternative: “ti” ou “vocês”
  rationale: A forma “você” mantém o destinatário singular indicado pela camada de consulta e oferece ampla legibilidade brasileira sem determinar gênero.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Por enquanto, porém” reproduz o contraste temporal com naturalidade; “longanimidade” foi mantida por sua precisão teológica e semântica, apesar de ser menos coloquial.
