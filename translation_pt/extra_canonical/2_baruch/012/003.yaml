  text: Do not expect or hope that you will always have prosperity and joy. Do not exalt yourselves too highly, and do not oppress.
translation:
  language: pt
  text: Não esperem nem tenham esperança de que terão sempre prosperidade e alegria. Não se exaltem demais e não oprimam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Syriac second-person plural forms (as established by the chapter corpus and audit trail)
  choice: esperem / tenham / desfrutarão / se exaltem / oprimam
  rationale: Mantém de modo inequívoco o destinatário coletivo, com formas naturais no português moderno.
- source_word: prosperity and joy
  choice: prosperidade e alegria
  rationale: Preserva os dois aspectos distintos — condição favorável e contentamento — sem ampliar nem restringir o sentido.
- source_word: exalt yourselves too highly
  choice: se exaltem demais
  rationale: Reproduz a ideia de autoexaltação excessiva em linguagem digna e corrente.
- source_word: oppress (object unstated)
  choice: oprimam
  rationale: Conserva o verbo sem objeto expresso, evitando especificar indevidamente quem é oprimido.
theological_decisions:
- issue: Alcance do aviso
  choice: Não explicitar que a prosperidade é bênção divina nem que a opressão recai sobre um grupo específico.
  alternative: Acrescentar referências a Deus, aos pobres ou aos súditos.
  rationale: O enunciado fornecido não explicita esses elementos; a tradução preserva sua abertura e tensão moral.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O plural de segunda pessoa foi vertido por formas associadas a “vocês”, sem inserir o pronome quando desnecessário.
