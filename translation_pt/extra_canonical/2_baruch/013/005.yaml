  yaml_path: translation/extra_canonical/2_baruch/013/005.yaml
  text: You shall say to them, and to those like them, ‘You who have seen this calamity and this retribution that has come upon you and upon your city at its appointed time—
translation:
  language: pt
  text: 'Você dirá a eles e aos que são como eles: “Vocês que viram esta calamidade e esta retribuição[a] que sobreveio a vocês e à sua cidade[b] no tempo que lhe foi determinado —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a punição”.'
    reason: «Retribuição» traduz o sentido judicial de purʿānā; «punição» é uma alternativa portuguesa possível, embora menos precisa quanto à ideia de retribuição.
  - marker: b
    text: 'Ou: “ao seu povo”.'
    reason: Registra a alternativa de referente coletivo preservada no histórico de tradução, sem alterar a leitura principal «cidade».
lexical_decisions:
- source_word: ܦܘܪܥܢܐ (purʿānā)
  choice: retribuição
  rationale: Expressa a ideia de paga ou consequência judicial, preservando o teor de juízo do termo siríaco sem especificar além do texto.
- source_word: ܡܕܝܢܬܐ / referente urbano no contexto
  choice: cidade
  rationale: Segue a leitura contextual de Jerusalém refletida na camada inglesa auditada; a possível leitura coletiva como “povo” é registrada em nota.
- source_word: ܒܙܒܢܗ (b-zabneh)
  choice: no tempo determinado para ela
  rationale: Mantém o singular do sufixo siríaco e comunica naturalmente a noção de tempo próprio ou designado.
theological_decisions:
- issue: Natureza da calamidade como juízo
  choice: “calamidade” e “retribuição” permanecem distintas, mas relacionadas
  alternative: Fundir ambas em uma única expressão, como “castigo calamitoso”
  rationale: O texto apresenta dois substantivos e não deve ter sua tensão judicial reduzida nem ampliada por harmonização.
- issue: Referente do possessivo temporal singular
  choice: Relacioná-lo à “retribuição” singular
  alternative: Relacioná-lo conjuntamente à calamidade e à retribuição, no plural
  rationale: A forma siríaca indicada é singular; a nota conserva a variante de compreensão plural.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. A construção mantém a frase aberta com travessão, pois o versículo continua no contexto seguinte. Todos os marcadores de nota aparecem no texto principal.
