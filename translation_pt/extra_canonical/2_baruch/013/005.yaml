  naturalness: A redação é clara, mas «a outros semelhantes a eles» é um pouco pesada. «Aos que são como eles» é mais idiomático e mantém o sentido. «Você dirá» é compatível com o destinatário singular da fala, enquanto a citação se dirige naturalmente ao grupo no plural.
