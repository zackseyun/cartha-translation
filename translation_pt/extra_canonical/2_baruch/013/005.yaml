    rationale: O sufixo em b-zabneh é singular. A nota introduz uma leitura plural que o texto-fonte não apoia e que a auditoria inglesa já corrigiu.
  - severity: low
    issue: «a outros semelhantes a eles» é pouco fluente.
    rationale: «aos que são como eles» é mais natural em português moderno, sem alteração semântica.
