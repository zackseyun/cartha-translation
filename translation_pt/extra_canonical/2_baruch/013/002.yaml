  text: And a voice came from on high and said to me, “Stand on your feet, Baruch, and hear the word of the Mighty One.”
translation:
  language: pt
  text: 'Então uma voz veio do alto e me disse: “Ponha-se de pé, Baruque, e ouça a palavra do Deus Poderoso.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܡܪܘܡܐ (men merawma)
  choice: do alto
  rationale: Expressa de modo natural a procedência elevada ou celestial da voz, sem acrescentar uma identificação não explicitada no verso.
- source_word: ܩܘܡ ܥܠ ܪ̈ܓܠܝܟ (qum ʿal reglayk)
  choice: Ponha-se de pé
  rationale: Preserva a imagem concreta do siríaco, literalmente ‘levante-se sobre seus pés’, em português corrente e digno.
- source_word: ܡܠܬܐ (melta)
  choice: a palavra
  rationale: Mantém o singular e a formulação solene do texto, podendo denotar a mensagem ou declaração divina sem restringir antecipadamente o sentido.
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ (Alaha hayltana)
  choice: Deus Poderoso
  rationale: O siríaco traz explicitamente ‘Deus’ seguido do adjetivo ‘poderoso’; esta tradução conserva ambos os elementos e evita substituir a expressão por um título menos lexicalmente direto.
theological_decisions:
- issue: Representação do título divino ܐܠܗܐ ܚܝܠܬܢܐ
  choice: Deus Poderoso
  alternative: o Poderoso
  rationale: Embora ‘o Poderoso’ seja possível como título teológico em contextos correlatos, o texto siríaco disponível contém explicitamente ܐܠܗܐ, ‘Deus’. A redação escolhida segue prioritariamente a evidência da língua original.
translation_notes:
  register: Português moderno, claro e solene, com formas pronominais de ampla compreensão no Brasil e no restante do mundo lusófono. A ordem foi levemente naturalizada (‘me disse’), sem alterar o conteúdo.
