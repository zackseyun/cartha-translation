  yaml_path: translation/extra_canonical/2_baruch/013/001.yaml
  text: 'And it happened after these things that I, Baruch, was standing on the bank of the river, and a voice came from the height and said to me:'
translation:
  language: pt
  text: 'E aconteceu, depois dessas coisas, que eu, Baruque, estava de pé à margem do rio,[a] e uma voz veio do alto e me disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Outra tradição textual traz “no monte Sião”.
    reason: Registra a divergência relevante da tradição de controle sem substituir a leitura do siríaco primário.
lexical_decisions:
- source_word: ܨܝܕܐ ܕܢܗܪܐ
  choice: à margem do rio
  rationale: O siríaco primário indica literalmente o lado ou a margem do rio. A formulação é natural em português e mantém a leitura de Ceriani, sem harmonizá-la com a tradição de controle.
- source_word: ܡܢ ܡܪܘܡܐ
  choice: do alto
  rationale: Preserva de modo conciso a origem elevada da voz sem especificar além do que o texto siríaco afirma.
- source_word: ܘܗܘܐ ܩܠܐ ܐܙܐ
  choice: quando uma voz veio
  rationale: A construção siríaca descreve o surgimento ou a vinda de uma voz. Em português, a oração com «quando» liga naturalmente o acontecimento à posição de Baruque junto ao rio.
theological_decisions:
- issue: Local da revelação de Baruque
  choice: à margem do rio
  alternative: no monte Sião
  rationale: A edição siríaca primária de Ceriani traz ܨܝܕܐ ܕܢܗܪܐ, «margem do rio». A variante «monte Sião», refletida pela tradição de controle, é registrada em nota, não introduzida no texto principal.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. «Baruque» segue a forma portuguesa tradicional do nome. A sequência completa do versículo foi preservada, inclusive a voz que vem do alto.
