  text: Because you were shaken by what has happened to Zion, therefore you will surely be preserved until the consummation of the times, that you may be a testimony.
translation:
  language: pt
  text: Porque você ficou abalado com o que aconteceu a Sião, certamente será preservado até a consumação dos tempos, para que sirva de testemunho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܬܙܝܥ
  choice: ficou abalado
  rationale: Expressa de modo natural o impacto profundo indicado pelo verbo siríaco, sem restringi-lo apenas a medo ou tristeza.
- source_word: ܨܗܝܘܢ
  choice: Sião
  rationale: Mantém o nome bíblico tradicional do lugar, aqui referente a Jerusalém em sua dimensão histórica e teológica.
- source_word: consummation of the times
  choice: consumação dos tempos
  rationale: Conserva a formulação escatológica e sua amplitude, sem explicá-la como simples fim da vida ou de uma época.
- source_word: testimony
  choice: testemunho
  rationale: Preserva a ideia de que Baruque será mantido vivo para desempenhar uma função testemunhal.
theological_decisions:
- issue: Natureza da consumação
  choice: consumação dos tempos
  alternative: fim dos tempos
  rationale: A opção escolhida mantém a noção de cumprimento ou culminação, sem reduzir a expressão apenas a término cronológico.
- issue: Função futura de Baruque
  choice: para que sirva de testemunho
  alternative: para que seja uma testemunha
  rationale: “Testemunho” preserva a possível ênfase no papel ou na evidência oferecida por Baruque, sem especificar indevidamente o modo desse testemunho.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. O pronome singular “você” deixa claro que a fala se dirige a Baruque; “certamente” comunica a ênfase da promessa sem tornar a frase excessivamente solene.
