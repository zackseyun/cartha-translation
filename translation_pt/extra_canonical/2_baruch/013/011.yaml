lexical_decisions:
- source_word: ܥܡ̈ܡܐ / ܐܡ̈ܘܬܐ
  choice: nações e povos
  rationale: Mantém o par coletivo do texto, dirigido às comunidades não israelitas, sem reduzir os dois termos a uma única categoria.
- source_word: ܚܝܒܝܢ
  choice: são culpados
  rationale: Expressa diretamente a condição de culpa ou responsabilidade, preservando o teor judicial da afirmação.
- source_word: ܒܟܠ ܙܒܢ
  choice: em todo o tempo
  rationale: Preserva a extensão temporal ampla do siríaco, sem restringi-la a uma ocasião específica.
- source_word: pisar a terra (conforme a leitura controlada do trecho)
  choice: pisaram a terra
  rationale: Conserva a imagem concreta de pôr os pés sobre a terra, sem interpretá-la automaticamente como conquista ou opressão.
- source_word: agir para com a criação sem retidão (conforme a leitura controlada do trecho)
  choice: trataram a criação sem justiça
  rationale: Reproduz a dimensão ética do uso ou trato da criação em linguagem portuguesa natural e mantém 'criação' como o conjunto criado.
theological_decisions:
- issue: Alcance moral da acusação contra as nações e os povos
  choice: Manter a acusação geral de culpa pelo modo de tratar a terra e a criação
  alternative: Especificar a culpa como exploração ambiental, idolatria ou opressão política
  rationale: O versículo formula uma acusação abrangente; identificar uma transgressão denominacional ou moderna específica resolveria indevidamente sua amplitude.
translation_notes:
  register: Português moderno, claro e digno, com 'vocês' para legibilidade brasileira e ampla compreensão. A ordem vocativa foi naturalizada, e as imagens de 'pisar a terra' e 'tratar a criação sem justiça' foram preservadas sem expansão interpretativa.
