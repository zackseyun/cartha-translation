translation:
  language: pt
  text: Por isso, naquele tempo eles foram disciplinados, para que fossem perdoados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que fossem poupados”.'
    reason: O verbo siríaco pode significar “ser perdoado”, “ser poupado” ou “ser deixado”; a nota preserva a ambiguidade lexical relevante.
lexical_decisions:
- source_word: ܐܬܪܕܝܘ
  choice: foram disciplinados
  rationale: O perfeito passivo indica uma ação sofrida no passado; “disciplinados” preserva tanto a correção quanto o caráter punitivo do contexto.
- source_word: ܗܝܕܝܢ
  choice: naquele tempo
  rationale: Expressa a referência temporal de modo natural em português, sem reduzir o termo a uma simples sequência lógica.
- source_word: ܢܫܬܒܩܘܢ
  choice: fossem perdoados
  rationale: No contexto de disciplina seguida de clemência, o sentido de perdão é adequado, embora o verbo também possa significar ser poupado ou deixado.
theological_decisions:
- issue: Finalidade da disciplina
  choice: para que fossem perdoados
  alternative: para que fossem poupados
  rationale: A tradução mantém a relação entre disciplina e misericórdia sem determinar além do necessário de que modo se dá o perdão; a alternativa lexical genuína é registrada em nota.
- issue: Sujeito do verbo
  choice: eles
  alternative: as nações
  rationale: O siríaco não traz “as nações” neste versículo; o pronome retoma o grupo mencionado no contexto anterior, por isso não se explicita uma identificação ausente do texto.
translation_notes:
  register: Português moderno, claro e digno, com construção passiva preservada. “Naquele tempo” soa natural para leitores brasileiros e mantém a referência temporal do siríaco.
