    ܒܢܘܪܐ. ܕܬܘܒܠܐ ܐܢܘܢ

    ܠܘܬ ܗܘ̇ ܕܒ̣ܥܕ ܐܢܘܢ.

    ܘܝܛܪܘܗܝ ܐܢܬܘܢ ܐܢܘܢ.

    ܠܘܬ ܗܘ̇ ܕܒ̣ܪܐ ܐܢܘܢ.

