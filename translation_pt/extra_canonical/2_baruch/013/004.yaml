    ܚܢܢ ܓܝܪ ܗܐ ܐܫܟܚܢ

    ܪ̈ܒܝ ܒ̈ܬܐ ܕܓ̈ܠܐ. ܘܐܬܚܙܝ

    ܒܬܘ̈ܠܬܐ ܕܥ̈ܙܠܢ ܒܘܨܐ.

    ܘܢܚ̈ܬܐ ܥܡ ܕܗܒܐ

    ܕܐܘܦܝܪ. ܐܣܬܪܗܒܝܢ

