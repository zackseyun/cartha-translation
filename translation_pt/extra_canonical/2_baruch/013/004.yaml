    ܗܠܝܢ. ܐܘ ܠܡܢܘ ܢܫܟܘܚ

    ܟܠ ܡܕܡ ܕܕ̈ܝܩܢ. ܐܘ

    ܡܢܘ ܐܡܪ ܣܓܝܐܘ

    ܚܟܡܗ ܐܟܡܐ ܕܠܐ

    ܡܐ̈ܙܐ ܘܕ̈ܢܦܐ ܗܘܐ

    ܕܡܢܝܢ ܟܐܢܐ ܟܢܝܫܘ.

    ܠܐ ܓܝܪ ܝܕܥܘܗ̇ ܠܥܡܬܐ

