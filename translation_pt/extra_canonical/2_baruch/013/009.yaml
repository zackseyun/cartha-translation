  text: Therefore, he formerly did not spare even his own sons, but afflicted them like his enemies because they sinned.
translation:
  language: pt
  text: Por isso, outrora ele não poupou nem mesmo seus próprios filhos, mas os afligiu como seus inimigos porque pecaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܣ / ḥas (ideia de poupar, conforme preservada na tradição textual do versículo)
  choice: poupou
  rationale: Expressa de modo direto a ideia de reter o castigo ou mostrar clemência, sem acrescentar uma interpretação denominacional.
- source_word: ܒܢܘ̈ܗܝ / bnawhy
  choice: seus próprios filhos
  rationale: Mantém o sufixo possessivo e usa “próprios” para preservar a força enfática de que nem os que lhe pertenciam foram isentos.
- source_word: ܐܝܟ ܒܥܠܕܒܒܘ̈ܗܝ / ʾayk bʿeldbābawhy
  choice: como seus inimigos
  rationale: Conserva tanto a comparação quanto o sufixo possessivo “seus”, sem suavizar a tensão da imagem.
- source_word: ܡܛܠ ܕܚܛܘ / meṭṭul da-ḥṭaw
  choice: porque pecaram
  rationale: Preserva explicitamente a relação causal entre o pecado e a aflição.
- source_word: marcador temporal com sentido anterior
  choice: outrora
  rationale: Forma portuguesa natural e digna que comunica a referência ao passado de maneira concisa.
theological_decisions:
- issue: Identidade do sujeito e dos “filhos”
  choice: Manter “ele” e “seus próprios filhos” sem explicitar os referentes.
  alternative: Substituir o sujeito por “Deus” e identificar os filhos como Israel.
  rationale: A explicitação resolveria referências que o versículo apresenta por meio de pronomes e poderia importar uma interpretação contextual para dentro do texto.
- issue: Força da comparação com inimigos
  choice: “como seus inimigos”
  alternative: “como se fossem inimigos” ou “como inimigos”
  rationale: A opção escolhida preserva a relação possessiva presente no siríaco e não enfraquece a formulação teologicamente severa.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Outrora” mantém um tom digno sem tornar a frase arcaica; a ordem dos elementos favorece fluidez e preserva a causalidade e a tensão do texto.
