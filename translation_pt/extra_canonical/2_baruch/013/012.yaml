lexical_decisions:
- source_word: ܒܟܠ ܙܒܢ
  choice: em todo o tempo
  rationale: Preserva a repetição enfática da expressão temporal siríaca, em linguagem portuguesa clara e digna.
- source_word: ܛܒܬܐ / sentido contextual de fazer o bem
  choice: eu lhes fiz o bem
  rationale: Expressa de modo natural a ação benéfica contínua atribuída ao falante, sem acrescentar uma interpretação doutrinária.
- source_word: ܛܝܒܘܬܝ / sentido contextual de benevolência
  choice: minha bondade
  rationale: “Bondade” comunica de modo amplo a benevolência demonstrada, preservando a relação com o bem feito na primeira oração.
theological_decisions:
- issue: Natureza da bondade divina rejeitada
  choice: minha bondade
  alternative: minha graça / minha benevolência
  rationale: “Bondade” mantém o sentido abrangente e evita restringir o termo a uma formulação teológica denominacional; “benevolência” seria possível, mas menos corrente.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A repetição “em todo o tempo” foi mantida por seu valor retórico; “vocês” torna explícito o destinatário plural indicado pelo contexto.
