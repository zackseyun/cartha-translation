  text: I say to you, ‘You who have drunk strained wine shall also drink its dregs. For the judgment of the Most High shows no partiality.’
translation:
  language: pt
  text: 'Digo a vocês: “Vocês que beberam vinho coado também beberão a sua borra, pois o juízo do Altíssimo não faz acepção de pessoas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܡܪܐ ܡܕܝܠܢܐ
  choice: o vinho coado
  rationale: A expressão contrapõe o vinho filtrado, de melhor qualidade, à borra que resta; “coado” comunica essa imagem de modo claro e direto.
- source_word: ܕܠܡܐ
  choice: a borra dele
  rationale: No contraste com o vinho coado, refere-se ao sedimento ou resíduo do vinho. “Borra” preserva a metáfora sem explicá-la indevidamente.
- source_word: ܕܝܢܐ ... ܕܠܐ ܡܣܒܪ ܒܐܦ̈ܐ
  choice: o julgamento do Altíssimo não mostra parcialidade
  rationale: A locução semítica expressa ausência de favoritismo no juízo. A formulação portuguesa mantém tanto o caráter judicial quanto a afirmação teológica.
theological_decisions:
- issue: Imparcialidade do juízo divino
  choice: o julgamento do Altíssimo não mostra parcialidade
  alternative: o Altíssimo não faz acepção de pessoas ao julgar
  rationale: A opção escolhida mantém o foco gramatical no julgamento e evita linguagem eclesiástica menos transparente, sem suavizar a afirmação de que o juízo divino é imparcial.
- issue: Força verbal da consequência anunciada
  choice: também beberão
  alternative: bebam também
  rationale: O futuro apresenta a ingestão da borra como consequência certa do juízo, em concordância com a leitura adotada pela camada inglesa auditada; a forma pode ser entendida de modo imperatival em algumas reconstruções do contexto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A metáfora do vinho e da borra foi preservada, assim como a referência reverente ao “Altíssimo”. O marcador [a] aparece junto à oração a que se refere.
