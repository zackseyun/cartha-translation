  text: 'And when I had said these things, I slept there, and I saw a vision by night. And behold, I saw a cloud ascending from the great sea, and it was full of white and black waters, and there were many colors in those waters, and at its head there appeared the likeness of a great lightning. And I looked, and that cloud passed swiftly in a violent rush and covered the whole earth. And after this, waters began to descend from it upon the earth, and I saw that the appearance of those waters was not one and the same. And after these things again I saw black, and after these things again bright, again black, and again bright. And this happened up to twelve times, but in all of them the black were more than the bright.


    And it came to pass, at the end of the cloud, that black waters, darker than all the former waters, descended, and there was a mingling in them, and wherever those waters descended they produced devastation and destruction. And after these things I saw the lightning that I had seen at the head of the cloud, and it seized the cloud and dragged it down to the earth. And after this I saw, and behold, twelve rivers[a] were ascending from the sea, and they surrounded that lightning and became subject to it, and they rejoiced over that proclamation and praised it. And I awoke because of my fear.'
translation:
  language: pt
  text: 'Quando eu disse essas coisas, adormeci ali e tive uma visão durante a noite. Eis que vi uma nuvem subir do grande mar. Ela estava cheia de águas brancas e negras, e havia muitas cores naquelas águas. No alto da nuvem aparecia algo semelhante a um grande relâmpago. Observei aquela nuvem passar velozmente, numa corrida violenta, e cobrir toda a terra. Depois disso, águas começaram a descer dela sobre a terra, e vi que a aparência daquelas águas não era sempre a mesma. Em seguida, vi novamente águas negras; depois, águas claras; de novo negras e de novo claras. Isso aconteceu até completar doze vezes, mas, em todas elas, as negras eram mais numerosas que as claras.


    No fim da nuvem, desceram águas negras e escuras, mais escuras do que todas as águas anteriores. Elas se misturavam e, por onde quer que descessem, causavam devastação e destruição. Depois disso, vi o relâmpago que havia visto no alto da nuvem; ele agarrou a nuvem e a arrastou para baixo, até a terra. Em seguida, vi doze rios[a] subindo do mar. Eles cercaram aquele relâmpago e se sujeitaram a ele; alegraram-se por aquela proclamação e a louvaram.[b] Então acordei por causa do meu medo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “doze luzes”.
    reason: Variante decorrente de formas siríacas graficamente próximas; a leitura exibida pelo manuscrito e testemunhos de controle não são uniformes.
  - marker: b
    text: 'Ou: “alegraram-se por ele e o louvaram”. O texto siríaco desta frase é ambíguo.'
    reason: A construção e o referente dos pronomes permitem uma tradução alternativa mais pronominal.
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: nuvem
  rationale: É o sentido comum do termo siríaco e corresponde ao elemento da visão que sobe, atravessa o céu e derrama águas.
- source_word: ܩ̈ܝܐ / ܡ̈ܝܐ
  choice: águas
  rationale: Embora ܩ̈ܝܐ possa sugerir chuvas ou aguaceiros, a passagem alterna com ܡ̈ܝܐ e descreve cores e descida; “águas” preserva a imagem recorrente sem tornar o texto pesado.
- source_word: ܐܘܟܡܐ
  choice: negras
  rationale: Mantém o contraste cromático direto com as águas claras e evita interpretar antecipadamente o simbolismo.
- source_word: ܢܗܝܪܐ
  choice: claras
  rationale: Expressa luminosidade em contraste natural com “negras”; “claras” é corrente em português e adequado a águas.
- source_word: ܒܪܩܐ
  choice: relâmpago
  rationale: É a equivalência direta do termo e preserva a figura concreta da visão.
- source_word: ܒܪܗܛܐ ܩܫܝܐ
  choice: numa corrida violenta
  rationale: Conserva tanto a ideia de movimento rápido quanto a força severa da expressão siríaca.
- source_word: ܡܣܬܝܟܐ
  choice: cobrir
  rationale: Comunica de modo natural que a nuvem se estendeu sobre toda a terra.
- source_word: ܚܫܘܟܝܢ
  choice: escuras
  rationale: Reforça a negrura das águas finais sem recorrer a vocabulário raro.
- source_word: ܚܒܠܐ ܘܐܒܕܢܐ
  choice: devastação e destruição
  rationale: Preserva os dois substantivos de ruína e a intensidade cumulativa do original.
- source_word: ܐܚܕ ... ܘܐܬܚ
  choice: agarrou ... e arrastou para baixo
  rationale: Mantém a ação dupla e vigorosa do relâmpago sobre a nuvem, inclusive o movimento descendente indicado pelo contexto e pelo texto controlado.
- source_word: ܢܗ̈ܪܐ / ܢܘܗ̈ܪܐ
  choice: rios
  rationale: A leitura “rios” oferece coerência com a subida desde o mar e conta com apoio do testemunho de controle; a forma transmitida também permite ou atesta “luzes”, registrada em nota.
- source_word: ܟܪܘܙ
  choice: proclamação
  rationale: Preserva o substantivo enigmático da passagem sem substituí-lo por um pronome nem identificar indevidamente o seu referente.
theological_decisions:
- issue: Identificação das águas negras e claras com épocas ou personagens históricos
  choice: Manter as imagens sem interpretação dentro do relato da visão
  alternative: Inserir no texto suas identificações históricas apresentadas posteriormente no livro
  rationale: Este versículo narra a visão; antecipar sua explicação eliminaria a progressão literária e resolveria simbolismos que aqui permanecem abertos.
- issue: Doze rios ou doze luzes
  choice: Adotar “doze rios” no texto e registrar “doze luzes” em nota
  alternative: Adotar “doze luzes” no texto principal
  rationale: “Rios” harmoniza-se com a origem no mar e com o testemunho de controle, mas a evidência siríaca exibida e a proximidade gráfica das formas exigem transparência sobre a variante.
- issue: Referente e sentido de ܟܪܘܙ
  choice: Traduzir literalmente como “aquela proclamação”, preservando a formulação difícil
  alternative: Entender o termo como “arauto” ou reduzir a frase a “alegraram-se por ele e o louvaram”
  rationale: A redação é ambígua; não se deve identificar o relâmpago, a proclamação ou um proclamador por decisão teológica não exigida pelo texto.
