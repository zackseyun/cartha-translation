    No fim da nuvem, desceram águas negras e escuras, mais que todas as águas anteriores. Elas se misturavam, e, por onde quer que descessem, causavam devastação e destruição. Depois disso, vi o relâmpago que havia visto no alto da nuvem; ele agarrou a nuvem e a arrastou para baixo, até a terra. Em seguida, vi doze rios[a] subindo do mar. Eles cercaram aquele relâmpago e se sujeitaram a ele; alegraram-se por aquela proclamação e a louvaram.[b] Então acordei por causa do meu medo.'
  to: 'Quando eu disse essas coisas, adormeci ali e tive uma visão durante a noite. Eis que vi uma nuvem subir do grande mar. Ela estava cheia de águas brancas e negras, e havia muitas cores naquelas águas. No alto da nuvem aparecia algo semelhante a um grande relâmpago. Observei aquela nuvem passar velozmente, numa corrida violenta, e cobrir toda a terra. Depois disso, águas começaram a descer dela sobre a terra, e vi que a aparência daquelas águas não era sempre a mesma. Em seguida, vi novamente águas negras; depois, águas claras; de novo negras e de novo claras. Isso aconteceu até completar doze vezes, mas, em todas elas, as negras eram mais numerosas que as claras.


    No fim da nuvem, desceram águas negras e escuras, mais escuras do que todas as águas anteriores. Elas se misturavam e, por onde quer que descessem, causavam devastação e destruição. Depois disso, vi o relâmpago que havia visto no alto da nuvem; ele agarrou a nuvem e a arrastou para baixo, até a terra. Em seguida, vi doze rios[a] subindo do mar. Eles cercaram aquele relâmpago e se sujeitaram a ele; alegraram-se por aquela proclamação e a louvaram.[b] Então acordei por causa do meu medo.'
