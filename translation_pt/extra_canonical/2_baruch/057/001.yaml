base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/057/001.yaml
  text: 'For you saw a great cloud that ascended from the sea and went and covered this earth, hear this: that it is the world that the Mighty One made when he planned to make creation. And it happened that, when the word went out from before him, the beginning of the world stood, small and beautiful, and was established as it was destined to be.


    And the black waters that you saw first, which descended upon it from the cloud—this is the transgression that the first Adam committed at first. For when he sinned, death was stirred up, though it was not its time, and grief was made known, and pains were prepared, and suffering was created, and toil was accomplished, and greatness began to be brought low.


    And the last day, which was shown in the form and took the likeness, know that the time will be inquired into, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, while he was, heard from God something of what was to be, and understood the release of the dead that was to be given, and what had been commanded him by God, he considered it, and he devised five thoughts. For he made himself liable, and he also made the angels liable. And also at that time when he was created, there was shown to him a vision of the bitter life and of the elements with fire. Thus God gathered in Eden, in the likeness of those that were created.'
translation:
  language: pt
  text: 'Pois você viu uma grande nuvem que subiu do mar, avançou e cobriu esta terra. Ouça isto: isto é o mundo que o Poderoso fez quando planejou fazer a criação.[a] E aconteceu que, quando a palavra saiu de diante dele, o princípio do mundo se ergueu, pequeno e belo, e foi estabelecido como devia ser.


    E as águas negras que você viu primeiro, as quais desceram da nuvem sobre ele — isto é a transgressão que o primeiro Adão cometeu no princípio. Pois, quando ele pecou, a morte foi posta em movimento, embora ainda não fosse o tempo dela; o luto tornou-se conhecido, as dores foram preparadas, o sofrimento foi criado, o trabalho penoso chegou à plenitude, e a grandeza começou a ser rebaixada.


    Quanto ao último dia, que foi mostrado na figura e assumiu a semelhança, saiba que o tempo será examinado, a medida da humanidade será medida e sua força será provada. Portanto, visto que Adão, enquanto vivia, ouviu de Deus algo do que haveria de acontecer, compreendeu a libertação dos mortos que seria concedida e aquilo que lhe fora ordenado por Deus, ele refletiu e concebeu cinco pensamentos. Pois ele se fez responsável e também tornou responsáveis os anjos.[b] E, naquele tempo em que foi criado, foi-lhe mostrada uma visão da vida amarga e dos elementos com fogo. E assim Deus reuniu no Éden, segundo a semelhança daqueles que foram criados.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A relação sintática também pode ser entendida assim: “cobriu esta terra. Ouça isto: este é o mundo”.'
    reason: O siríaco permite mais de uma delimitação da oração e deixa incerto o referente exato de “isto é o mundo”.
  - marker: b
    text: 'Ou: “fez-se passível de condenação e também tornou os anjos passíveis de condenação”.'
    reason: O verbo tem força judicial e pode expressar responsabilidade, culpa ou sujeição a condenação; a nota preserva a intensidade possível sem fixá-la no texto principal.
  - marker: c
    text: 'A frase final é obscura no siríaco: o objeto de “reuniu” não está expresso claramente.'
    reason: A tradução mantém a dificuldade do texto em vez de suprir uma identificação especulativa para aquilo que Deus reuniu.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: o princípio do mundo
  rationale: O controle textual favorece a ideia da origem primordial do mundo. “Princípio” preserva esse sentido sem restringi-lo à fundação material nem ao curso posterior da história.
- source_word: ܚܛܗܐ ܡܬܒܪܝܢܘܬܐ
  choice: a transgressão
  rationale: O contexto descreve o ato primordial de Adão como uma violação com consequências cósmicas e humanas; “transgressão” é mais específico que o termo genérico “pecado”.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: a morte foi posta em movimento
  rationale: A expressão indica que a morte foi ativada ou entrou em operação. A formulação mantém a imagem dinâmica e se ajusta à observação de que ainda não era o tempo dela.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: a grandeza começou a ser rebaixada
  rationale: Preserva tanto o início do processo quanto o movimento descendente da expressão siríaca, sem especificar indevidamente se a grandeza é humana, régia ou cósmica.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: a medida da humanidade
  rationale: “Medida” corresponde ao paralelismo judicial e avaliativo com o tempo examinado e a força provada.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: tornou ... responsável
  rationale: A formulação conserva a ideia de responsabilidade ou sujeição judicial contraída, sem reduzi-la a um mero sentimento subjetivo de culpa.
- source_word: ܐܣܛܘܟܣܐ
  choice: os elementos
  rationale: O empréstimo do grego stoicheia tem aqui ressonância cosmológica; “elementos” é a correspondência portuguesa mais transparente e mantém aberta sua extensão exata.
theological_decisions:
- issue: O papel de Adão nas primeiras águas negras
  choice: A transgressão de Adão põe a morte em movimento e introduz uma série de consequências para a condição criada.
  alternative: Tratar Adão apenas como exemplo representativo do pecado humano em geral.
  rationale: A sequência do texto liga diretamente o ato primordial de Adão à morte, ao luto, às dores, ao sofrimento, ao trabalho penoso e ao rebaixamento da grandeza.
- issue: A responsabilidade de Adão e dos anjos
  choice: Manter a afirmação forte de que Adão tornou responsável a si mesmo e também os anjos.
  alternative: Suavizar a referência aos anjos ou eliminá-la por ser obscura.
  rationale: A afirmação siríaca é teologicamente difícil, mas explícita; a tradução deve conservar essa tensão em vez de explicá-la segundo uma doutrina externa.
- issue: A libertação dos mortos
  choice: Traduzir literalmente como uma libertação futura que seria concedida.
  alternative: Identificá-la explicitamente com ressurreição, absolvição ou saída do mundo dos mortos.
  rationale: O texto não define aqui a natureza precisa dessa libertação, portanto a tradução preserva a abertura semântica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos. Repetições significativas do original, como “a medida ... será medida”, foram preservadas. As imagens apocalípticas e as formulações teologicamente difíceis não foram harmonizadas nem explicadas dentro do corpo do texto.
