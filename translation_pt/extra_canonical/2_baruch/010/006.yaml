lexical_decisions:
- source_word: ܛܘܒܘܗܝ
  choice: Feliz
  rationale: Expressa a fórmula de bem-aventurança de modo natural e claro no português moderno, sem perder seu tom solene.
- source_word: ܠܗܘ ܕܠܐ ܐܬܝܠܕ
  choice: aquele que não nasceu
  rationale: Reproduz diretamente a construção relativa e o passivo siríaco, sem acrescentar explicações.
- source_word: ܐܘ ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ
  choice: ou aquele que nasceu e morreu
  rationale: Mantém a alternativa e a sequência concisa dos dois verbos do texto-fonte.
theological_decisions:
- issue: Caráter da declaração sobre não nascer ou morrer
  choice: Preservar literalmente a formulação do lamento
  alternative: Amenizar como uma preferência pela morte diante do sofrimento
  rationale: O siríaco apresenta uma bem-aventurança paradoxal em contexto de lamento; explicá-la ou suavizá-la no corpo do texto eliminaria sua força e tensão.
translation_notes:
  register: Português moderno, claro e digno. A concisão e o paralelismo poético do siríaco foram preservados; não há necessidade de nota textual.
