  text: 'E vocês, céus, retenham o seu orvalho

    e não abram os tesouros da chuva.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܝܐ (pressuposto pelo contexto textual de 2 Baruque 10:11)
  choice: céus
  rationale: Preserva o vocativo plural tradicional e a personificação cósmica do lamento.
- source_word: ܛܠܐ (orvalho)
  choice: orvalho
  rationale: Equivalente direto e natural, mantendo a imagem agrícola.
- source_word: ܐܘܨܪ̈ܐ (tesouros/depósitos)
  choice: tesouros
  rationale: Conserva a metáfora antiga dos reservatórios celestes da chuva, sem reduzi-la a uma explicação meteorológica.
- source_word: ܡܛܪܐ (chuva)
  choice: chuva
  rationale: Tradução direta e idiomática.
theological_decisions:
- issue: Personificação dos céus
  choice: Manter a interpelação direta aos céus com imperativos
  alternative: Reformular como pedido indireto a Deus para impedir o orvalho e a chuva
  rationale: O lamento convoca poeticamente a criação; uma reformulação teológica apagaria a figura retórica do texto.
translation_notes:
  register: Português moderno, digno e acessível. O paralelismo poético foi mantido em duas linhas; “vocês” explicita de modo natural no português brasileiro que os imperativos se dirigem ao plural “céus”.
