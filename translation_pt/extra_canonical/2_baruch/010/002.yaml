  text: “Tell Jeremiah to go and accompany the captivity of the people as far as Babylon.
translation:
  language: pt
  text: “Diga a Jeremias que vá acompanhar o povo levado ao cativeiro até a Babilônia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܪܡܝܐ
  choice: a Jeremias
  rationale: Reproduz diretamente o nome próprio e a relação verbal exigida pelo contexto.
- source_word: ܥܡ ܥܡܐ
  choice: acompanhar o povo
  rationale: A expressão siríaca significa literalmente ‘com o povo’; ‘acompanhar’ comunica naturalmente o movimento conjunto no contexto da deportação.
- source_word: captivity (consulta inglesa, refletindo a tradição textual do versículo)
  choice: o povo levado ao cativeiro
  rationale: Em português, explicita de modo natural que ‘cativeiro’ designa aqui a deportação do povo, sem tratá-lo como lugar abstrato.
- source_word: Babylon (consulta inglesa, refletindo a tradição textual do versículo)
  choice: a Babilônia
  rationale: Forma geográfica consagrada e clara em português.
theological_decisions:
- issue: Natureza da ordem dada a Jeremias
  choice: Preservar a ordem simples para acompanhar os deportados
  alternative: Interpretar a missão como ministério profético específico entre os exilados
  rationale: O versículo afirma o deslocamento e a companhia, mas não define aqui a finalidade teológica ou pastoral da missão.
translation_notes:
  register: Português moderno, claro e digno. A formulação segue a delimitação fornecida pela consulta inglesa, enquanto a expressão ‘acompanhar o povo’ é confirmada pelo siríaco preservado (ܥܡ ܥܡܐ, ‘com o povo’).
