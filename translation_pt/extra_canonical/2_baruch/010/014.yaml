base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/014.yaml
  text: 'Rather, let the barren rejoice,

    and let those who have no children be glad;

    but let those who have children grieve.'
translation:
  language: pt
  text: 'Antes, alegrem-se as estéreis,

    e regozijem-se as que não têm filhos;

    mas lamentem-se as que têm filhos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܩܪ̈ܬܐ (sentido contextual; leitura subjacente à linha corrompida)
  choice: as estéreis
  rationale: O contraste com as mulheres que têm filhos exige a referência a mulheres estéreis; a formulação portuguesa é direta, digna e coerente com o lamento.
- source_word: expressão siríaca para ‘as que não têm filhos’ (texto transmitido/OCR parcialmente corrompido)
  choice: as que não têm filhos
  rationale: Preserva a distinção paralela entre esterilidade e ausência de filhos sem acrescentar uma causa não expressa.
- source_word: ܢܚܕ̈ܝܢ / campo semântico de alegrar-se
  choice: alegrem-se / regozijem-se
  rationale: Mantém o paralelismo poético com dois verbos naturais em português, sem reduzir os dois membros a uma única formulação.
- source_word: campo semântico de sofrer/lamentar-se
  choice: lamentem-se
  rationale: No contexto da queda de Sião e do cativeiro de seus filhos, indica dor e luto, não mera preocupação.
theological_decisions:
- issue: A inversão das expectativas ligadas à maternidade
  choice: Preservar sem explicação a ordem para que as estéreis e as sem filhos se alegrem, enquanto as mães se lamentam
  alternative: Explicitar que isso ocorre por causa do cativeiro ou da morte dos filhos
  rationale: O contexto fornece a causa, mas o verso a apresenta de modo poético e tenso; acrescentá-la no corpo do texto resolveria uma força retórica que o original deixa implícita.
translation_notes:
  register: Português atual, solene e acessível, com paralelismo poético. Emprega-se o feminino plural porque o contraste é explicitamente materno. ‘Antes’ marca a reversão em relação às expectativas descritas no contexto.
