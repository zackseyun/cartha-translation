base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/008.yaml
  text: 'I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.'
translation:
  language: pt
  text: 'Chamarei as sereias do mar,

    e vocês, lilites,[a] venham do deserto;

    e vocês, demônios e dragões das florestas:

    despertem, cinjam os lombos para o luto,

    entoem comigo uma lamentação

    e chorem comigo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Lilites”: seres femininos associados ao deserto e à noite na antiga imaginação do Oriente Próximo.'
    reason: O termo não é comum em português e convém esclarecê-lo sem eliminá-lo do texto.
lexical_decisions:
- source_word: ܣܝܪ̈ܝܢܘܣ
  choice: sereias
  rationale: Translitera o termo siríaco de origem grega em sua forma portuguesa corrente, preservando a figura mítica evocada.
- source_word: ܠܝ̈ܠܝܬܐ
  choice: lilites
  rationale: Mantém como nome de uma classe de seres do deserto, sem substituir o termo por uma identificação interpretativa como “corujas” ou “demônios noturnos”.
- source_word: ܫܐ̈ܕܐ
  choice: demônios
  rationale: Equivalente português direto para seres espirituais nocivos no contexto.
- source_word: ܝܕܘܥܐ
  choice: dragões
  rationale: Segue a identificação preservada pela tradição textual consultada; o referente zoológico ou mítico exato do vocábulo é incerto.
- source_word: ܡܘܡܬܐ
  choice: luto
  rationale: Expressa o contexto de pranto ritual e lamentação, em linguagem portuguesa natural.
- source_word: ܐܪ̈ܒܥܬܐ
  choice: lamentação
  rationale: O trecho transmitido apresenta dificuldade textual; a tradução verte o sentido contextual de iniciar ou assumir o canto fúnebre, em acordo com a sequência poética.
theological_decisions:
- issue: Natureza das sereias, lilites, demônios e dragões
  choice: Preservar as designações míticas ou espirituais do texto
  alternative: Naturalizá-las como diferentes animais selvagens
  rationale: A linguagem poética convoca seres associados ao mar, deserto e florestas. A tradução não decide se o autor os concebe literalmente, simbolicamente ou como personificações.
translation_notes:
  register: Verso poético em português moderno, solene e acessível. O paralelismo das convocações e a progressão para o luto foram preservados; “cinjam os lombos” conserva a imagem corporal antiga, ainda inteligível em registro bíblico.
