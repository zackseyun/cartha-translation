  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ
  choice: depois de sete dias
  rationale: A leitura contínua do versículo, apoiada pela tradição textual de controle, indica a fórmula temporal “depois de sete dias”; a transcrição da página está fragmentária nesta passagem.
- source_word: ܨܒܘܬ ܕܐܠܗܐ
  choice: a palavra de Deus
  rationale: No contexto de uma comunicação revelatória, “palavra de Deus” expressa naturalmente o sentido da mensagem ou declaração divina, em vez do sentido mais amplo de “coisa” ou “assunto”.
- source_word: ܐܡ̣ܪ ܠܝ
  choice: me disse
  rationale: Tradução direta e corrente da construção siríaca “disse a mim”, evitando a repetição menos natural “disse para mim”.
theological_decisions:
- issue: Natureza da comunicação divina
  choice: a palavra de Deus veio a mim
  alternative: uma mensagem de Deus veio a mim
  rationale: Mantém a fórmula revelatória tradicional e a personificação presente no texto, sem especificar um mecanismo de revelação que a fonte não explicita.
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa bíblica natural. Preserva-se a abertura formulaica “E aconteceu que” e os dois-pontos finais, que introduzem a fala seguinte.
