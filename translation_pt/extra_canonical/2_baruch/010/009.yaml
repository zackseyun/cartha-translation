  terminology: '"Agricultores", "terra", "frutos", "doçura" e "sustento" são escolhas claras e adequadas. "Sustento" comunica naturalmente o valor de ܡܙܘ̈ܢܝܟܝ como provisão/nutrição, sem interpretação teológica adicional.'
