  source_fidelity: A tradução conserva adequadamente os imperativos do lamento, a personificação da terra e as imagens de semear, fruto e sustento. A revisão proposta mantém o sentido do siríaco e o alinhamento com o texto inglês de auditoria, com uma forma de segunda pessoa mais coerente dentro da apóstrofe poética.
