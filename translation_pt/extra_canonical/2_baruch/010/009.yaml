base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/009.yaml
  text: 'You farmers, do not sow again;

    and you, O earth, why do you still give the fruit of your produce?

    Keep within you the sweetness of your nourishment.'
translation:
  language: pt
  text: 'Agricultores, não voltem a semear;


    e tu, ó terra, por que ainda dás os frutos da tua produção?


    Guarda em ti a doçura do teu sustento.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ
  choice: terra
  rationale: Mantém o vocativo personificado dirigido à terra.
- source_word: ܦܐܪ̈ܐ
  choice: frutos
  rationale: Traduz diretamente o plural concreto, adequado ao contexto agrícola.
- source_word: ܚܠܝܡܘܬܐ
  choice: doçura
  rationale: Preserva a imagem sensorial do siríaco, em vez de reduzi-la genericamente a 'bondade' ou 'benefício'.
- source_word: ܡܙܘ̈ܢܝܟܝ
  choice: seu alimento
  rationale: Expressa a ideia de sustento ou provisão nutritiva produzida pela terra, com linguagem corrente.
theological_decisions:
- issue: Imperativos dirigidos à criação no lamento
  choice: Conservar as ordens literais aos agricultores e à terra personificada
  alternative: Reformular como simples desejo de esterilidade
  rationale: O texto emprega linguagem poética de lamento e convoca diretamente pessoas e criação; a tradução não deve explicar nem atenuar essa tensão.
translation_notes:
  register: Português moderno, claro e solene, com formas de tratamento naturais para leitores brasileiros. O paralelismo poético e a personificação da terra foram preservados.
