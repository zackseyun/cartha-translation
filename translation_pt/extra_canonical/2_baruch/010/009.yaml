    ܡܥܝܢ̈ܐ ܐܝܟܘ ܠܒܟܘܢ.

    ܘܠܐ ܬܦܩܘܢ ܐܪ̈ܙܐ

    ܕܡܣܝܪܐ. ܘܐܢܬ ܝܡܡܐ

    ܐܝܟܘ ܢܘܗܪܟܘܢ ܕܠܚܫܟܘܢ.

    ܘܐܢܬ ܫܡܫܐ ܐܢܒܝ

    ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ.

    ܠܡܢܐ ܓܝܪ ܗܘܝ ܠܝܠܝ

    ܢܘܗܪܐ ܐܢܘܢ ܕܡܘܬܐ

    ܕܐܝܟ ܗܟܢܐ. ܘܬܘܒ

    ܚܫܟܐ ܠܐ ܬܥܒܕܘܢ.

    ܘܒܬܪܘܬ ܟܘܟܒܐ ܠܐ

    ܢܨܡܚܘܢ ܘܠܝܡܐ ܢܗܪ

    ܠܐ ܬܪܟܢܘܢ ܕܬܒܘܢ. ܥܡܗܘܢ

