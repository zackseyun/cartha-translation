base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/016.yaml
  text: 'Or why should people again have children,

    or why should the seed of their nature again be named,

    when this mother lies desolate

    and her children have gone away into captivity?'
translation:
  language: pt
  text: 'Ou por que as pessoas ainda haveriam de ter filhos,

    ou por que a descendência de sua natureza ainda haveria de ser mencionada,

    quando esta mãe jaz desolada

    e seus filhos foram levados para o cativeiro?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܘܠܕܝܢ
  choice: ter filhos
  rationale: O verbo pertence ao campo de gerar ou dar à luz; a expressão portuguesa é natural e inclusiva no contexto do lamento.
- source_word: ܒܢܝ̈ܗ
  choice: seus filhos
  rationale: O substantivo significa literalmente “filhos”; mantém-se a imagem de Jerusalém ou Sião como mãe.
- source_word: ܐܬܬܒܝܘ
  choice: foram levados para o cativeiro
  rationale: A forma passiva exprime terem sido capturados ou conduzidos ao cativeiro, não uma partida voluntária.
- source_word: ܐܡܐ
  choice: mãe
  rationale: Preserva a personificação materna de Sião/Jerusalém sem explicá-la dentro do versículo.
theological_decisions:
- issue: Identidade da “mãe”
  choice: Manter apenas “esta mãe” no texto
  alternative: Explicitar “Sião” ou “Jerusalém”
  rationale: O contexto identifica a figura, mas o original conserva a personificação; explicitá-la eliminaria seu efeito poético.
- issue: Formulação sobre descendência e natureza
  choice: “a descendência de sua natureza ainda haveria de ser mencionada”
  alternative: “as mulheres ainda esperariam o fruto do ventre”
  rationale: A tradição textual e a camada inglesa auditada refletem uma formulação difícil acerca da semente ou descendência natural. A tradução preserva essa tensão sem impor uma leitura reprodutiva mais específica.
translation_notes:
  register: Português atual, solene e inteligível, com paralelismo poético. “Jaz desolada” conserva o tom de lamentação; “cativeiro” mantém a linguagem histórica do exílio.
