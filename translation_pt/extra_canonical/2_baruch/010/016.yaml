    ܠܡܢܐ ܓܝܪ ܗܘܝ ܠܝܠܝ

    ܢܘܗܪܐ ܐܢܘܢ ܕܡܘܬܐ

    ܕܐܝܟ ܗܟܢܐ. ܘܬܘܒ

    ܚܫܟܐ ܠܐ ܬܥܒܕܘܢ.

