lexical_decisions:
- source_word: ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ
  choice: Mas, quanto a nós, os que estamos vivos
  rationale: Reproduz o contraste marcado por ܕܝܢ e mantém a referência enfática aos sobreviventes.
- source_word: ܚܝ ܠܢ
  choice: ai de nós!
  rationale: Expressa naturalmente em português a exclamação de lamento do siríaco.
- source_word: ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ
  choice: as aflições de Sião
  rationale: No contexto da lamentação, designa os sofrimentos ou calamidades suportados por Sião; “aflições” preserva a amplitude do termo.
- source_word: ܘܡܕܡ ܕܓܕܫܗ ܠܐܘܪܫܠܡ
  choice: e o que aconteceu a Jerusalém
  rationale: Tradução direta que não especifica além do texto a natureza da calamidade ocorrida.
