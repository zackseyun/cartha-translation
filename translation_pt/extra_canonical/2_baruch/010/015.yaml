translation:
  language: pt
  text: 'Pois por que dariam à luz em meio à dor

    e sepultariam entre gemidos?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܘܠܕܝܢ
  choice: dariam à luz
  rationale: O verbo siríaco no contexto imediato se refere a gerar ou dar à luz; a expressão portuguesa é natural e preserva a imagem do nascimento.
- source_word: ܟܐܒܐ
  choice: dor
  rationale: O substantivo denota dor ou sofrimento; “dor” mantém a concisão e o paralelismo do lamento.
- source_word: '[expressão siríaca correspondente a sepultar, conforme a segmentação versicular controlada]'
  choice: sepultariam
  rationale: Mantém o contraste entre nascimento e sepultamento presente na leitura versicular atestada pela camada de consulta, sem suavizar a imagem.
- source_word: '[expressão siríaca correspondente a gemidos, conforme a segmentação versicular controlada]'
  choice: entre gemidos
  rationale: Reproduz o modo ou ambiente de lamentação com português idiomático e digno.
theological_decisions:
- issue: Sentido retórico da pergunta no lamento por Sião
  choice: Manter a pergunta sem explicitar sua conclusão implícita
  alternative: Acrescentar que nascer seria inútil diante da calamidade
  rationale: O texto lamenta a inversão de nascimento e morte, mas não formula aqui uma explicação doutrinária; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, sóbrio e poético. O paralelismo foi mantido em duas linhas. “Dariam à luz” explicita o sentido obstétrico de “bear”, evitando a leitura genérica de apenas suportar sofrimento.
