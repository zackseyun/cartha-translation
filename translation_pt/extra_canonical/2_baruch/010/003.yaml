  text: Mas você, permaneça aqui na desolação de Sião; depois destes dias, eu lhe mostrarei o que acontecerá nos últimos tempos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܬ ܕܝܢ
  choice: Mas você
  rationale: Reproduz o contraste enfático dirigido a Baruque em português corrente e digno.
- source_word: ܩܘܡ
  choice: permaneça
  rationale: Neste contexto, o verbo tem o sentido contextual de ficar ou permanecer, não simplesmente de se levantar.
- source_word: ܒܚܘܫܒܝܟ ܕܢܗܘܘܢ (leitura textual contextual)
  choice: aqui na desolação de Sião
  rationale: A linha siríaca transmitida/extraída está corrompida ou pouco legível; a leitura é sustentada pelo contexto da lamentação em Sião e pelo controle textual da tradição.
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ
  choice: depois destes dias
  rationale: Mantém diretamente a sequência temporal do siríaco.
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܓܕܫ
  choice: o que acontecerá
  rationale: Expressa naturalmente a construção de futuridade e ocorrência.
- source_word: ܒܙܒܢܐ ܝܘܡ̈ܝܐ
  choice: nos últimos tempos
  rationale: Conserva a referência temporal escatológica sem especificar um esquema doutrinário.
theological_decisions:
- issue: Alcance escatológico da expressão temporal final
  choice: nos últimos tempos
  alternative: no fim dos dias
  rationale: A formulação escolhida preserva a orientação para um período futuro derradeiro, sem decidir se se trata de um único momento final ou de uma era conclusiva.
