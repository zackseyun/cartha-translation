    ܡܒܥܕܝ̈ܒܘܗܝ ܘܐܘ ܣܢ̈ܝܐ

    ܐܦܝܩ ܓܝܪ ܗܘ̣ ܕܢܛܪ

    ܒܝܬ̣ܐ ܘܐܬܒܥ ܒܝܬ ܐܢ

