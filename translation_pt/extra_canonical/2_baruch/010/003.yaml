    ܨܗܝܘܢ ܘܐܡܪܬ܆ ܛܘܒܘܗܝ

    ܠܗܘ ܕܠܐ ܐܬܝܠܕ܂ ܐܘ

    ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ܂

    ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ ܚܙ

    ܠܢ܂ ܕܚ̈ܙܝܢܢ ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ܂

