base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/012.yaml
  text: 'And you, sun, hold back the light of your rays;

    and you, moon, extinguish the abundance of your light.

    For why should light rise again,

    where the light of Zion has been darkened?'
translation:
  language: pt
  text: 'E tu, ó sol, retém os raios da tua luz;

    e tu, ó lua, extingue a profusão da tua luz.


    Pois por que a luz voltaria a nascer,

    onde a luz de Sião se escureceu?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܫܐ
  choice: sol
  rationale: Equivalente direto, preservando a apóstrofe poética ao astro.
- source_word: ܐܢܒܝ
  choice: retenha
  rationale: O verbo, no contexto, exprime impedir ou conter a emissão dos raios; “retenha” mantém a imagem sem explicá-la em excesso.
- source_word: ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ
  choice: os raios da sua luz
  rationale: Reproduz de modo natural a referência aos raios luminosos, sem reduzir a expressão simplesmente a “brilho”.
- source_word: ܢܘܗܪܐ
  choice: luz
  rationale: Mantém a repetição temática de “luz”, central ao contraste entre os astros e Sião.
- source_word: ܨܗܝܘܢ
  choice: Sião
  rationale: Forma tradicional e amplamente inteligível do topônimo em português.
theological_decisions:
- issue: Sentido da escuridão da luz de Sião
  choice: onde a luz de Sião se escureceu
  alternative: porque a luz de Sião foi apagada
  rationale: A formulação escolhida conserva a metáfora e evita identificar ou explicar teologicamente a “luz de Sião” além do que o texto declara.
- issue: Retorno da luz
  choice: tornaria a nascer
  alternative: voltaria a brilhar
  rationale: “Nascer” preserva a imagem do surgimento da luz e a formulação interrogativa, sem decidir se a referência é ao amanhecer ou ao brilho dos astros em geral.
translation_notes:
  register: Português moderno, poético e solene, com sintaxe acessível ao leitor brasileiro e inteligível internacionalmente. O tratamento por “você” evita flexões regionais de “tu” e mantém clara a personificação dos astros.
