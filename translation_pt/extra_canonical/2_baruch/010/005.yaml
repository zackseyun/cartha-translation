  text: 'And he went with the people, but I, Baruch, returned and sat before the gates of the temple, and I lifted up this lament over Zion and said:'
translation:
  language: pt
  text: 'Ele foi com o povo. Eu, porém, Baruque, os fiz sair[a] e me sentei diante dos portões do templo. Então entoei esta lamentação sobre Sião, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «voltei». O siríaco diz literalmente: «os fiz sair» (ou «os conduzi para fora»); algumas traduções entendem o trecho como «voltei».'
    reason: Assinala, no ponto da expressão transitiva siríaca, a leitura alternativa seguida pela camada inglesa, enquanto o texto principal conserva o sentido direto do original.
lexical_decisions:
- source_word: ܐܙܠ ܥܡ ܥܡܐ
  choice: foi com o povo
  rationale: Reproduz diretamente o movimento e a companhia expressos no siríaco.
- source_word: ܐܦܩܬ ܐܢܘܢ
  choice: os despedi
  rationale: A forma siríaca é transitiva e, em sentido direto, indica que Baruque fez com que eles partissem; a escolha evita importar a leitura «voltei», que não está explicitamente expressa nessa forma.
- source_word: ܝܬܒܬ ܩܕܡ ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ
  choice: me sentei diante dos portões do templo
  rationale: Mantém a posição espacial e o plural «portões» do texto siríaco.
- source_word: ܐܠܝܬ ܐܠܝܬܐ ܗܕܐ ܥܠ ܨܗܝܘܢ
  choice: entoei esta lamentação por Sião
  rationale: Traduz a construção enfática com verbo e substantivo cognatos por uma formulação portuguesa natural e solene; «por Sião» comunica o objeto do lamento.
