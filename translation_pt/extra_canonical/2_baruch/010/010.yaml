  yaml_path: translation/extra_canonical/2_baruch/010/010.yaml
  text: 'And you, vine, why do you still give your wine?

    For no offering from you will again be received in Zion,

    and no firstfruits will again be accepted.'
translation:
  language: pt
  text: 'E você, videira, por que ainda produz o seu vinho?


    Pois nenhuma oferta vinda de você voltará a ser recebida em Sião,


    nem voltarão a ser aceitas as primícias.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܒܐ
  choice: videira
  rationale: O contexto da lamentação e a referência ao vinho indicam a videira personificada, tratada diretamente no feminino em português.
- source_word: ܩܘܪܒܢܐ / ideia contextual de oferta
  choice: oferta
  rationale: Termo amplo e natural, apropriado ao culto em Sião sem especificar uma modalidade sacrificial que o texto não explicita.
- source_word: ܦܐܪ̈ܐ / primícias no contexto cultual
  choice: primícias
  rationale: Preserva o sentido cultual dos primeiros frutos apresentados a Deus, em vez do sentido genérico de frutos.
theological_decisions:
- issue: Relação entre o vinho e a oferta cultual
  choice: “dele já não se receberá oferta alguma”
  alternative: “nenhuma oferta sua voltará a ser recebida”
  rationale: Mantém explícita a ligação referencial com o vinho produzido pela videira, sem definir além do texto a natureza exata da oferta.
- issue: Cessação do culto em Sião
  choice: “já não... nem voltarão”
  alternative: “nunca mais”
  rationale: Expressa a perspectiva temporal da lamentação sem transformar a formulação em uma afirmação teológica absoluta sobre toda restauração futura.
translation_notes:
  register: Português atual, digno e acessível, com paralelismo poético preservado. A personificação da videira foi mantida, assim como o vocabulário cultual de “oferta”, “Sião” e “primícias”.
