    ܠܗܘ ܕܠܐ ܐܬܝܠܕ܂ ܐܘ

    ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ܂

    ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ ܚܙ

