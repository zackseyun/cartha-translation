translation:
  language: pt
  text: E falei com Jeremias, meu irmão, conforme o Senhor me havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪܬ
  choice: E falei
  rationale: Reproduz o verbo siríaco de dizer/falar e mantém a ligação narrativa marcada pela conjunção.
- source_word: ܠܐܪܡܝܐ
  choice: com Jeremias
  rationale: O prefixoܠ marca aqui o destinatário da fala; em português natural, a construção pede “falar com”.
- source_word: ܐܚܝ
  choice: meu irmão
  rationale: Tradução direta do substantivo com sufixo possessivo de primeira pessoa.
- source_word: ܕܦܩܕܢܝ ܡܪܝܐ
  choice: conforme o Senhor me havia ordenado
  rationale: Expressa a relação modal/contextual da oração relativa e usa o mais-que-perfeito composto para indicar que a ordem precedeu a fala.
theological_decisions:
- issue: Título divino ܡܪܝܐ
  choice: o Senhor
  alternative: meu Senhor
  rationale: Neste contexto, ܡܪܝܐ funciona como designação divina tradicional; “o Senhor” é a forma portuguesa mais clara e evita interpretar o elemento morfológico como posse pessoal explícita.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. Não há necessidade de nota textual neste versículo.
