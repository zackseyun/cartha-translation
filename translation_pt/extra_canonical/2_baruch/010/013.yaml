  text: 'And you, bridegrooms, do not enter;

    and let not the virgins adorn themselves.

    And you, women, do not pray to bear children.'
translation:
  language: pt
  text: 'E vocês, noivos, não entrem;

    e que as virgens não se enfeitem.

    E vocês, mulheres, não orem para ter filhos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܬ̈ܢܐ
  choice: noivos
  rationale: Mantém a referência aos homens prestes a se casar, com vocativo natural em português.
- source_word: ܒܬܘܠ̈ܬܐ
  choice: virgens
  rationale: Equivalente direto e adequado ao paralelismo ligado às celebrações nupciais.
- source_word: ܢܫ̈ܐ
  choice: mulheres
  rationale: Termo amplo e não interpretativamente restrito a esposas ou mães.
- source_word: ܠܐ ܬܙܥܘܢ / formulação imperativa no contexto
  choice: não entrem
  rationale: Preserva a ordem abrupta e sua elipse, sem acrescentar um destino ou recinto que o texto não explicita.
- source_word: ideia de oração/pedido para conceber
  choice: não orem para ter filhos
  rationale: Expressa em português corrente o pedido de gerar ou conceber, sem reduzir o sentido a mero desejo.
theological_decisions:
- issue: Imperativos negativos no contexto do lamento por Sião
  choice: Mantê-los como ordens diretas
  alternative: Abrandá-los como desejos ou conselhos
  rationale: O tom retórico do lamento exige proibições fortes; suavizá-las eliminaria a tensão do texto.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. A formulação elíptica “não entrem” foi mantida sem complemento para não resolver indevidamente a ambiguidade do texto.
