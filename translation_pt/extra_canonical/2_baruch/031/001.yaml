  text: 'And it happened after these things, that I went to the people and said to them, “Gather to me your elders and your children, and I will speak my words with them."”


    And they all assembled in the valley of Kidron.


    And I asked and said to them,'
translation:
  language: pt
  text: '**2 Baruque 31:1** Depois dessas coisas, fui até o povo e lhes disse: “Reúnam para mim os seus anciãos e os seus filhos, e falarei com eles as minhas palavras.[a]”


    Então todos se reuniram no vale do Cedrom. E perguntei-lhes e disse-lhes:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A linha correspondente está textualmente instável na página siríaca fornecida. A tradução segue a leitura reconstruída “falarei com eles as minhas palavras”; a forma impressa tal como transmitida também pode ser entendida como “e eu disse: ‘Busquem as minhas palavras’”.'
    reason: Registra a provável corrupção ou instabilidade do testemunho apresentado e conserva a leitura alternativa sem a incorporar silenciosamente ao texto principal.
lexical_decisions:
- source_word: ܗܘܘ ܡܢ ܒܬܪ ܗܠܝܢ
  choice: Depois dessas coisas
  rationale: Reproduz de modo natural a fórmula narrativa siríaca, sem acrescentar uma ligação causal.
- source_word: ܟܢܫܘ ܠܝ
  choice: Reúnam diante de mim
  rationale: O imperativo exige que o grupo seja congregado junto ao narrador; “diante de mim” é corrente e evita a construção pouco natural “reúnam para mim”.
- source_word: ܣܒܝܟܘܢ ܘܒܢܝ̈ܟܘܢ
  choice: os seus anciãos e os seus filhos
  rationale: Mantém os dois grupos expressos no siríaco, incluindo “filhos”, que não deve ser omitido.
- source_word: ܡܠܝ
  choice: as minhas palavras
  rationale: 'Preserva o sufixo de primeira pessoa: não são apenas “palavras”, mas “minhas palavras”.'
- source_word: ܒܚܠܬܐ ܕܩܕܪܘܢ
  choice: no vale do Cedrom
  rationale: Identifica o conhecido vale junto a Jerusalém. “Cedrom” é a forma tradicional e amplamente reconhecível em português.
- source_word: ܘܒܥܝܬ ܘܐܡܪܬ ܠܗܘܢ
  choice: E eu lhes roguei, dizendo
  rationale: ܒܥܐ pode indicar pedir ou rogar. “Roguei” conserva o caráter solene do apelo e “dizendo” verte naturalmente a construção semítica.
theological_decisions:
- issue: Identidade dos destinatários do discurso
  choice: “seus anciãos e seus filhos” ... “falarei com eles”
  alternative: “falarei com vocês”
  rationale: Mantém a mudança de referência entre o povo diretamente interpelado e os anciãos e filhos que devem ser reunidos, sem harmonizá-la silenciosamente.
- issue: Caráter do apelo final
  choice: “lhes roguei”
  alternative: “lhes perguntei”
  rationale: O contexto introduz um discurso solene, e o campo semântico do verbo permite pedido ou súplica; a tradução não o transforma em uma pergunta explícita inexistente neste versículo.
translation_notes:
  register: Português atual, solene e acessível, com imperativos na forma brasileira de terceira pessoa. Conservou-se a cadência narrativa do siríaco sem reproduzir mecanicamente todas as coordenações com “e”.
