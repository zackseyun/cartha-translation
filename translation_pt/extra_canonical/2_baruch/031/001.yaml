    issue: “E eu lhes roguei, dizendo” traduz ܘܒܥܝܬ ܘܐܡܪܬ ܠܗܘܢ de modo interpretativo.
    rationale: O verbo ܒܥܐ pode ter sentidos como pedir, buscar ou perguntar, mas a sequência preservada e a auditoria inglesa adotam “perguntei e disse”. “Roguei” introduz indevidamente o tom de súplica e não deve substituir uma ambiguidade verbal por uma leitura contextual mais carregada.
  - severity: low
    issue: “Diante de mim” em “Reúnam diante de mim” especifica localização.
    rationale: ܟܢܫܘ ܠܝ expressa a reunião para/a Baruc; “para mim” mantém essa relação sem acrescentar explicitamente a ideia espacial de estar diante dele.
