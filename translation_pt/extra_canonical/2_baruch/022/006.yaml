  text: Ou será que quem planta uma vinha não espera colher dela frutos para se alimentar?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܨܒ ܟܪܡܐ
  choice: planta uma vinha
  rationale: Reproduz diretamente a imagem agrícola do siríaco em português corrente.
- source_word: ܢܣܒ ܡܢܗ ܦܐܪ̈ܐ
  choice: colher dela frutos
  rationale: O verbo significa literalmente tomar ou receber; no contexto de uma vinha, «colher» expressa naturalmente a ação sem alterar o sentido.
- source_word: ܕܢܬܪܣܐ
  choice: para se alimentar
  rationale: Mantém a finalidade expressa pelo verbo siríaco, que indica ser sustentado ou nutrido.
- source_word: ܡܣܒܪ
  choice: espera
  rationale: Traduz a expectativa confiante do plantador e se ajusta à pergunta retórica.
theological_decisions:
- issue: Forma e força da analogia retórica
  choice: 'Uma única pergunta retórica: «não espera colher dela frutos para se alimentar?»'
  alternative: 'Tradução mais repetitiva: «a menos que tire dela frutos para se alimentar, não espera aquele que a plantou tirar dela frutos?»'
  rationale: A redação conserva todos os elementos semânticos essenciais e a força argumentativa do siríaco, evitando uma repetição pesada que resulta da sintaxe do texto transmitido.
