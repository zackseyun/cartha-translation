  source_fidelity: A redação transmite adequadamente a voz e o poder/força percebido por Baruque, mas omite o marcador enfático «eis» (ܗܐ), presente no siríaco. «Então» introduz uma sequência temporal mais marcada do que a simples coordenação do original.
