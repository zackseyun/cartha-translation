  text: 'And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:'
translation:
  language: pt
  text: '1 Depois dessas coisas, eis que ouvi uma voz e vi um poder estabelecido sobre mim. E uma voz foi ouvida do alto e me disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܐ (ḥaylā)
  choice: poder
  rationale: O termo pode indicar força, poder ou potência. “Poder” preserva a amplitude do siríaco e soa natural neste contexto visionário.
- source_word: ܕܐܬܩܒܥ ܠܝ (d-etqbaʿ lī)
  choice: que se estabeleceu sobre mim
  rationale: A forma verbal sugere algo fixado, estabelecido ou assentado em relação ao narrador. A tradução evita definir além do texto a natureza dessa experiência.
- source_word: ܡܢ ܡܪܘܡܐ (men merawmā)
  choice: vinda do alto
  rationale: Expressa de modo natural a origem elevada ou celestial da voz sem inserir explicitamente “céu”, que não aparece nessa expressão.
theological_decisions:
- issue: Natureza do poder visto por Baruque
  choice: “um poder que se estabeleceu sobre mim”
  alternative: “uma força que foi posta diante de mim”
  rationale: O texto não identifica o poder como anjo, Espírito ou manifestação divina específica; a tradução mantém essa indeterminação.
translation_notes:
  register: Português moderno, digno e narrativamente fluido, com legibilidade brasileira. O demonstrativo enfático equivalente a “eis” foi representado pela progressão direta “ouvi... e vi”, evitando uma fórmula artificial sem perda substancial de sentido.
