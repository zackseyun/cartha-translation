  terminology: «Poder» é uma escolha adequada para ܚܝܠܐ e mantém a indeterminação do texto. «Do alto» traduz naturalmente ܡܢ ܡܪܘܡܐ, sem especificar indevidamente «do céu».
  issues:
  - severity: low
    issue: Omissão de «eis»
    rationale: O siríaco contém o marcador discursivo ܗܐ («eis»), também preservado no registro inglês; ele deve ser mantido.
  - severity: low
    issue: «Então» acrescenta uma progressão temporal explícita
    rationale: A segunda ocorrência é coordenada por «e» no siríaco. A coordenação simples reproduz melhor o encadeamento narrativo.
