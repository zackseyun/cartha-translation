  language: pt
  text: Ou, se alguém recebe um tesouro, não ganha confiança por causa dele, de modo que já não fica abalado?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܙܐ (gazzā)
  choice: tesouro
  rationale: Equivalente direto que preserva a imagem concreta de riqueza ou bem valioso recebido.
- source_word: ܡܣܬܒܪ (mestbar)
  choice: ganha confiança
  rationale: Neste contexto, o verbo expressa confiança ou segurança fundada na posse do tesouro; a formulação evita reduzir o sentido a mera expectativa.
- source_word: ܡܬܬܙܝܥ (metteziʿ)
  choice: fica abalado
  rationale: Reproduz a ideia de ser sacudido, perturbado ou desestabilizado, mantendo a metáfora do siríaco em português natural.
theological_decisions:
- issue: Natureza da confiança proporcionada pelo tesouro
  choice: Manter a afirmação como analogia humana, sem qualificá-la moral ou teologicamente
  alternative: Explicitar que se trata de falsa segurança nas riquezas
  rationale: O versículo integra uma série de comparações e não condena aqui a riqueza nem define essa confiança como espiritualmente válida; acrescentar tal avaliação resolveria algo que o texto não declara.
translation_notes:
  register: Português moderno, claro e digno, com estrutura interrogativa preservada. A construção passiva do siríaco foi mantida em forma natural, e a relação de resultado foi explicitada por “de modo que” sem alterar o argumento.
