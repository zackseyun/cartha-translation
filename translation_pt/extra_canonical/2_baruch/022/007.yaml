  text: Or does a woman who is pregnant, if she gives birth without pains, expect a dead child in her womb?
translation:
  language: pt
  text: Ou uma mulher grávida, se dá à luz sem dores, não espera que haja uma criança morta em seu ventre?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto siríaco diz literalmente “um morto” e formula a pergunta com a negação “não espera”; o sentido exato da comparação é incerto.
    reason: Sinalizar tanto a elipse lexical quanto a dificuldade da pergunta retórica, sem corrigir conjecturalmente o texto.
lexical_decisions:
- source_word: ܟܐܒ̈ܐ (kēḇē)
  choice: dores
  rationale: O plural siríaco designa as dores, no contexto as dores do parto; a forma simples e natural preserva a imagem.
- source_word: ܡܣܒܪܐ (msabbrā)
  choice: espera
  rationale: O verbo pode expressar expectativa ou suposição. “Espera” conserva a formulação do texto sem transformar a ideia em temor ou certeza.
- source_word: ܩܛܝܠܐ (qṭīlā)
  choice: criança morta
  rationale: Literalmente, “morto” ou “morto violentamente”. O referente infantil está implícito na gravidez; “criança morta” o explicita de maneira natural sem afirmar a causa da morte.
- source_word: ܥܘܒܗ̇ (ʿūbbāh)
  choice: seu ventre
  rationale: Equivalente direto e digno para o útero ou ventre da mulher no contexto.
theological_decisions:
- issue: Forma negativa da pergunta retórica
  choice: não espera
  alternative: espera
  rationale: O siríaco contém explicitamente ܠܐ, “não”. Embora a lógica da comparação seja difícil e a versão inglesa omita a negação, a tradução conserva a tensão textual em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com estrutura interrogativa preservada. A redação mantém a estranheza da imagem e a negação presentes no siríaco; “criança” explicita apenas o referente exigido pelo contexto da gravidez.
