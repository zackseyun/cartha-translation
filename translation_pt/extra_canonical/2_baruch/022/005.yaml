translation:
  language: pt
  text: Ou quem semeia a terra, a menos que perca em vez de seus frutos,[a] a fome não volta a destruí-lo?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siríaco diz literalmente algo como “a menos que perca em vez de seus frutos”. O objeto de “perca” não é expresso; a frase pode refletir uma elipse ou uma dificuldade textual.
    reason: Preserva a formulação elíptica e informa o leitor sem identificar indevidamente o que se perde, por exemplo, como semente.
