- source_word: ܙܪܥ ܐܪܥܐ
  choice: semeia a terra
  rationale: Reproduz diretamente a imagem agrícola e a construção do siríaco.
- source_word: ܡܘܒܕ
  choice: perca algo
  rationale: O verbo expressa fazer perecer ou perder; o objeto não aparece claramente no texto, por isso foi mantido indefinido em vez de identificado como semente.
- source_word: ܚܠܦ ܦܐܪ̈ܘܗܝ
  choice: em troca de seus frutos
  rationale: Preserva a relação de troca ou compensação indicada por ܚܠܦ, sem normalizar silenciosamente a frase difícil.
- source_word: ܠܐ ܬܘܒ ܡܚܒܠ ܠܗ ܟܦܢܐ
  choice: não fica depois livre da ruína causada pela fome?
  rationale: Expressa em português natural a ideia de que a fome já não o destrói, mantendo a forma retórica interrogativa do contexto.
