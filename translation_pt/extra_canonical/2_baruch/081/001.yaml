  yaml_path: translation/extra_canonical/2_baruch/081/001.yaml
  text: 'But also hear a word of consolation. For I was mourning over Zion, and I sought mercy from the Most High, and I said, “Will these things remain for us until the end? And will these afflictions come upon us at every time?” And the Mighty One acted according to the abundance of his mercies, and he spared according to the greatness of his grace. And he revealed a word to me, that I might be strengthened, and he gave me visions, that I might not again be shaken; and he made known to me the mysteries of the times, and showed me the coming of the ages.


    Therefore, my brothers, I have written to you so that you may be comforted because of the multitude of your tribulations. For know that our Maker will require vengeance from all our enemies for all the evil things they have done against us, and that the consummation which the Most High has prepared is near, and his mercy is coming, and the completion of his judgment is not far away.


    For now we see the abundance of the prosperity of the nations while they act wickedly, but they will be reckoned like a drop. And we look at the strength of their power, but it will be accounted as spittle. We think on the glory of their greatness, while they do not keep the commandments of the Mighty One, but have treated them with contempt. And we think on the beauty that is seen, though it is shaken in afflictions, and they will be sought out like flesh in pain. And we reckon only the confidence in which they trust, though it is shaken before our eyes; but they will be crushed like a wave. And we seek only the hope of their strength, when it flourishes in the good things that God gave them; but it will be laid away, and lamentation will overtake it.'
translation:
  language: pt
  text: 'Mas ouçam também uma palavra de consolação. Pois eu lamentava por Sião, busquei misericórdia junto ao Altíssimo e disse: “Estas coisas permanecerão conosco até o fim? E estas aflições virão sobre nós em todos os tempos?” Então o Poderoso agiu conforme a abundância de suas misericórdias e nos poupou conforme a grandeza de sua graça. Ele me revelou uma palavra para que eu fosse fortalecido e me deu visões para que eu não voltasse a ser abalado; também me deu a conhecer os mistérios dos tempos e me mostrou a vinda das eras.


    Por isso, meus irmãos, escrevi a vocês, para que sejam consolados por causa da multidão de suas tribulações. Saibam que nosso Criador exigirá vingança de todos os nossos inimigos por todo o mal que fizeram contra nós; que a consumação preparada pelo Altíssimo está próxima; que sua misericórdia está chegando; e que a conclusão de seu juízo não está distante.


    Agora vemos a grande prosperidade das nações enquanto praticam o mal, mas elas serão consideradas como uma gota. Contemplamos a força de seu poder, mas ela será considerada como cuspe. Pensamos na glória da grandeza delas, embora não guardem os mandamentos do Poderoso e os tenham tratado com desprezo. Pensamos na beleza que se vê, embora seja abalada em meio às aflições; mas elas serão procuradas como carne atormentada pela dor. Levamos em conta apenas a confiança na qual elas depositam sua esperança, embora seja abalada diante de nossos olhos; mas elas serão esmagadas como uma onda. Buscamos apenas a esperança da força delas quando floresce por causa das coisas boas que Deus lhes deu; mas essa esperança será posta de lado, e o lamento a alcançará.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܡܐ
  choice: o Altíssimo
  rationale: Título divino bíblico e apocalíptico consagrado em português, distinto de ܚܝܠܬܐ.
- source_word: ܚܝܠܬܐ
  choice: o Poderoso
  rationale: Preserva a distinção em relação a “o Altíssimo” e mantém o registro elevado sem soar artificial.
- source_word: ܪ̈ܚܡܘܗܝ / ܚܢܢܗ
  choice: suas misericórdias / sua graça
  rationale: Mantém diferenciados os dois termos siríacos paralelos, sem fundi-los numa só ideia.
- source_word: ܚܘ̈ܘܝ
  choice: visões
  rationale: Corresponde ao contexto apocalíptico e ao paralelismo com a palavra revelada.
- source_word: ܫܘܠܡܐ / linguagem de conclusão
  choice: consumação / conclusão
  rationale: Conserva a força escatológica e a diferenciação verbal, em vez de reduzir ambas as expressões a “fim”.
- source_word: ܢܘܛܦܬܐ / comparação com cuspe
  choice: considerada como cuspe
  rationale: Retém a imagem deliberadamente humilhante, embora áspera em português.
- source_word: ܩܝ̈ܡܘܗܝ / ܦܘܩܕܢܐ
  choice: mandamentos
  rationale: É claro e natural em português e preserva a obrigação da aliança.
theological_decisions:
- issue: Linguagem de vingança divina
  choice: nosso Criador exigirá vingança de todos os nossos inimigos
  alternative: nosso Criador nos vingará de todos os nossos inimigos
  rationale: Preserva o tom judicial e severo da expectativa apocalíptica sem convertê-lo em mera retaliação humana.
- issue: Temporalidade escatológica
  choice: a consumação preparada pelo Altíssimo está próxima; sua misericórdia está chegando
  alternative: o fim está próximo
  rationale: Mantém juntas a proximidade do juízo e a chegada da misericórdia, sem apagar a tensão teológica do texto.
- issue: Referentes pronominais no parágrafo final
  choice: mantém a referência às nações no plural e à força/confiança no singular onde o português o exige
  alternative: uniformizar todos os referentes no plural
  rationale: Busca preservar as mudanças de referente do texto recebido, ainda que a transmissão e a delimitação da fonte apresentem dificuldades.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Foram mantidas imagens ásperas como “cuspe”, títulos divinos distintos e a tensão entre vingança judicial, misericórdia e juízo. A unidade de fonte apresenta sinais de sobreposição e delimitação incerta; por isso, o texto segue a reconstrução auditada fornecida, sem ocultar ambiguidades relevantes.
