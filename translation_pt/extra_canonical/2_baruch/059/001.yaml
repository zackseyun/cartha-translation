base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/059/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and going forth and covering this earth: it is the world which his power made when he considered making creation. And when the word went out from before him, the structure of the world stood forth, very small, and it was established according to what was sought for it to become.


    And as for the first black waters that you saw descending upon it from the cloud, this is the first sin, the transgression that the first Adam committed. For when he sinned, death was stirred up, though it was not in its time; and mourning was made known, and sorrows were prepared, and pain was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in a form and took on a likeness, know that the time will be examined, and the law of humanity will be measured, and its strength will be tested. Therefore Adam, while he was one who heard from God something of what was to be, considered the release of the dead that had been given, and what had been commanded him from God. He kept considering, and he devised five thoughts. For he made himself liable; he also made the angels liable. And even at that time when he was created, a vision was shown to him: the fierce beasts, and the elements with fire. Thus God gathered in Eden, in the likeness of those who were created.'
translation:
  language: pt
  text: 'Ouça o que é a grande nuvem que você viu subir do mar, avançar e cobrir esta terra: ela é o mundo que o poder dele fez quando ele decidiu criar a criação. Quando a palavra saiu de diante dele, a estrutura do mundo se ergueu, ainda muito pequena, e foi estabelecida conforme aquilo que deveria vir a ser.


    Quanto às primeiras águas negras que você viu descer da nuvem sobre ela, elas são o primeiro pecado, a transgressão que o primeiro Adão cometeu. Pois, quando ele pecou, a morte foi posta em movimento, embora ainda não fosse o tempo dela; o luto se tornou conhecido, as aflições foram preparadas, a dor foi criada, o trabalho foi completado, e a grandeza começou a ser rebaixada.


    Quanto ao último dia, que foi mostrado numa forma e assumiu uma semelhança, saiba que o tempo será examinado, a lei da humanidade[a] será medida, e sua força será provada. Portanto, Adão, tendo ouvido de Deus algo do que haveria de acontecer, compreendeu a libertação dos mortos que havia sido concedida e aquilo que Deus lhe havia ordenado. Continuou refletindo e formulou cinco pensamentos. Pois tornou a si mesmo culpado; tornou também os anjos culpados. E, já no tempo em que foi criado, foi-lhe mostrada uma visão: os animais ferozes e os elementos com fogo. Assim, Deus reuniu em Éden[b], à semelhança dos que foram criados.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a norma da humanidade” ou “a medida da humanidade”.'
    reason: ܢܘܡܫܐ significa primariamente “lei”, mas pode ter a nuance de norma ou medida; o verbo “será medida” torna as alternativas relevantes.
  - marker: b
    text: 'A frase final é obscura; também se poderia entender: “Assim Deus os reuniu em Éden, conforme a semelhança em que foram criados”.'
    reason: A referência do objeto implícito de “reuniu” e a relação da oração final permanecem incertas no siríaco.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: a estrutura do mundo
  rationale: Preserva a imagem concreta do mundo que passa a existir e é estabelecido, sem reduzir a expressão a mero começo cronológico.
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: o primeiro pecado, a transgressão
  rationale: Mantém os dois termos e a ênfase dada à ofensa primordial de Adão.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: a morte foi posta em movimento
  rationale: O verbo indica ativação ou desencadeamento; esta formulação é natural em português e preserva a causalidade do texto.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: a grandeza começou a ser rebaixada
  rationale: Retém tanto o início do processo quanto seu movimento descendente.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: a norma da humanidade
  rationale: O termo pode indicar norma, regra ou medida. 'Norma' preserva o caráter avaliativo da passagem, enquanto a alternativa é registrada em nota.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: a libertação dos mortos
  rationale: Tradução deliberadamente não específica, que mantém aberta a relação exata com ressurreição, remissão ou soltura.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: tornou ... culpado
  rationale: Expressa com clareza a força judicial do verbo em português corrente, sem explicar a natureza exata dessa culpabilidade.
- source_word: ܐܣܛܘܟܣܐ
  choice: os elementos
  rationale: O empréstimo grego designa mais naturalmente os elementos cósmicos; a tradução evita especificar poderes elementares.
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: os animais ferozes
  rationale: ܚܝܘܬܐ refere-se a animais ou feras, e o adjetivo admite aqui o sentido contextual de ferozes.
- source_word: ܒܥܕܢ
  choice: em Éden
  rationale: A leitura geográfica se ajusta ao contexto de Adão e ao texto consonantal.
theological_decisions:
- issue: O pecado de Adão e o início da morte
  choice: O pecado de Adão põe a morte em movimento antes do tempo dela.
  alternative: Entender que a morte apenas se tornou conhecida, sem nexo causal forte.
  rationale: A sintaxe siríaca liga diretamente o pecado à ativação da morte, do luto, da aflição, da dor e do trabalho.
- issue: A culpabilidade dos anjos
  choice: Manter que Adão também tornou os anjos culpados.
  alternative: Atenuar a frase como referência apenas à participação dos anjos como testemunhas ou considerar o texto corrompido.
  rationale: Embora difícil, o texto transmitido atribui aos anjos alguma forma de culpabilidade ligada a Adão; a tradução não elimina essa tensão.
- issue: A libertação dos mortos
  choice: Usar 'libertação dos mortos'.
  alternative: Traduzir especificamente como 'ressurreição dos mortos' ou 'remissão referente aos mortos'.
  rationale: O termo siríaco não determina com segurança uma dessas interpretações doutrinárias mais específicas.
- issue: O último dia
  choice: Traduzir ܝܘܡܐ ܐܚܪܝܐ como 'o último dia'.
  alternative: Traduzir como 'o último tempo'.
  rationale: ܝܘܡܐ significa 'dia', enquanto o próprio período usa ܙܒܢܐ para 'tempo'; a distinção e a nuance escatológica devem ser preservadas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se 'você' no discurso direto, períodos moderados e vocabulário corrente. As construções obscuras do siríaco foram mantidas sem harmonização doutrinária; as ambiguidades relevantes aparecem em nota.
