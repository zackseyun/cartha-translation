base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/037/001.yaml
  text: And after these things I saw that the cedar was burning, and the forest that was around it, and the vine was growing, and the plain around it was full of unfading flowers. And I awoke and arose.
translation:
  language: pt
  text: Depois dessas coisas, vi que o cedro ardia, bem como a floresta ao seu redor; a videira crescia, e a planície ao redor dela estava cheia de flores que não murchavam. Então despertei e me levantei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ
  choice: o cedro
  rationale: Mantém a espécie simbólica específica e a força régia da imagem, sem acrescentar explicação interpretativa.
- source_word: ܓܦܬܐ
  choice: a videira
  rationale: Preserva a figura vegetal da visão e evita identificá-la antecipadamente com uma personagem teológica explicada apenas depois.
- source_word: flores descritas como permanentes ou não murcháveis
  choice: flores que não murchavam
  rationale: Expressa em português natural a qualidade duradoura das flores, sem recorrer ao termo menos corrente «imurcháveis».
- source_word: ܐܬܬܥܝܪܬ / verbo de despertar
  choice: despertei
  rationale: O registro ligeiramente solene combina com a narrativa visionária e distingue claramente o despertar da ação seguinte de levantar-se.
theological_decisions:
- issue: Identificação da videira com o Messias
  choice: Manter apenas «a videira» no texto principal.
  alternative: Identificar ou grafar a figura como «o Messias» já neste versículo.
  rationale: A interpretação da visão pertence à sequência posterior. Antecipá-la eliminaria a progressão narrativa e resolveria no texto aquilo que aqui permanece simbólico.
- issue: Relação do fogo com o cedro e a floresta
  choice: Dizer que o cedro ardia, bem como a floresta ao redor dele.
  alternative: Fazer somente o cedro arder ou reformular a floresta como mero cenário sem participação no incêndio.
  rationale: A construção preserva o alcance coordenado indicado pela tradição textual consultada, sem fundir o cedro e a floresta numa única imagem.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A ordem das imagens foi preservada, e «Então» marca com clareza a passagem da visão ao despertar. Não se manteve a antiga nota com o discurso da videira, pois ela pertence ao texto anteriormente atribuído por engano a este versículo.
