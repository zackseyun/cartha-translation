  yaml_path: translation/extra_canonical/2_baruch/076/001.yaml
  text: And he answered and said to me, “Because you have prayed that I show you what will happen to you after these things, for this reason I have shown you this vision, that you may see what will happen to you after these things. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going. And this shall be after forty days. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”
translation:
  language: pt
  text: 'Ele me respondeu: “Visto que você me pediu que lhe mostrasse o que aconteceu e como foi feito, foi-lhe dado um ensino mais elevado de entendimento sobre o que está para acontecer depois destas coisas.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto siríaco deste trecho apresenta dificuldades de transmissão e de delimitação. Outra reconstrução entende: “Visto que você orou para que eu lhe mostrasse o que lhe acontecerá depois destas coisas, por isso lhe mostrei esta visão”.'
    reason: Registra uma reconstrução amplamente atestada na tradição editorial sem substituir a leitura favorecida pelas palavras legíveis no testemunho siríaco fornecido.
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: Ele me respondeu
  rationale: Reproduz naturalmente a fórmula semítica “respondeu e disse-me”, sem perda de conteúdo em português corrente.
- source_word: ܕܐܦܝܣܬ ܠܝ ܕܐܚܘܝܟ
  choice: você me pediu que lhe mostrasse
  rationale: ܐܦܝܣ pode expressar persuadir, instar ou pedir; no contexto de uma solicitação dirigida ao revelador, “pediu” é natural e não exagera a força do verbo.
- source_word: ܕܐܘ ܗܘܐ ܐܝܟ ܕܥܒܝܕ
  choice: o que aconteceu e como foi feito
  rationale: 'Mantém os dois aspectos discerníveis no texto transmitido: o acontecimento e o modo de sua realização, sem substituí-los pela leitura secundária sobre uma visão.'
- source_word: ܝܘܠܦܢܐ ܡܥܠܝܬ
  choice: um ensino mais elevado
  rationale: ܝܘܠܦܢܐ denota ensino ou instrução, e ܡܥܠܝܐ indica algo elevado ou excelente; a formulação conserva o registro sapiencial.
- source_word: ܕܥܬܝܕ ܠܡܗܘܐ ... ܡܢ ܒܬܪ ܗܠܝܢ
  choice: o que está para acontecer depois destas coisas
  rationale: Expressa diretamente a construção prospectiva do siríaco e preserva sua orientação escatológica sem acrescentar detalhes ausentes.
theological_decisions:
- issue: Objeto da revelação solicitada por Baruque
  choice: O pedido abrange o que aconteceu, como foi feito e o que ainda acontecerá.
  alternative: O pedido diz respeito ao que acontecerá ao próprio Baruque depois destas coisas.
  rationale: As palavras legíveis no trecho fornecido favorecem uma referência ao acontecido, à sua realização e ao futuro. A alternativa reflete outra reconstrução textual, mas introduz o pronome referente a Baruque e elementos que não aparecem claramente neste recorte.
- issue: Natureza do conteúdo concedido
  choice: “um ensino mais elevado de entendimento”
  alternative: “esta visão” ou “a interpretação da visão”
  rationale: A leitura adotada conserva ܝܘܠܦܢܐ, “ensino/instrução”, no texto apresentado e evita transformar silenciosamente o conteúdo em uma visão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “você” por clareza internacional e boa legibilidade brasileira. A fórmula semítica duplicada foi vertida idiomaticamente, enquanto a terminologia sapiencial e a ambiguidade textual foram preservadas.
