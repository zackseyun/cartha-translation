  language: en
  yaml_path: translation/extra_canonical/2_baruch/007/001.yaml
  text: And after these things I heard that angel say to those angels who were holding the torches, “Now pull down the supports of its walls and overthrow them, lest the enemies boast and say, ‘We ourselves have cast down the wall of Zion, and we have burned the place of the mighty God.’ And stand there in the place where I had been standing before.”
translation:
  language: pt
  text: 'Depois dessas coisas, ouvi aquele anjo dizer aos anjos que seguravam as tochas: “Agora, derrubem os sustentáculos das muralhas dela e lancem-nos por terra, para que os inimigos não se vangloriem, dizendo: ‘Nós mesmos derrubamos a muralha de Sião e incendiamos o lugar do Deus Poderoso’. E fiquem no lugar onde eu estava antes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܥܬܗ (correção do corrompido ܫܒܩܬܗ)
  choice: ouvi
  rationale: A leitura contextual e textualmente corrigida introduz o que Baruque ouviu o anjo dizer; evita seguir a forma corrompida do texto impresso, que sugeriria ‘deixei-o’.
- source_word: ܠܡܦܐܕ̈ܐ / ܠܡܦܝܕܐ
  choice: tochas
  rationale: No cenário de destruição pelo fogo, ‘tochas’ comunica melhor os instrumentos flamejantes do que ‘lâmpadas’.
- source_word: ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  choice: os sustentáculos das muralhas dela
  rationale: A expressão designa as partes que dão sustentação às muralhas, sem impor a precisão arquitetônica de ‘fundações’ ou ‘contrafortes’.
- source_word: ܣܚܦܢܝܗܝ
  choice: derrubamos
  rationale: Expressa demolição violenta em português natural e mantém a alegação enfática dos inimigos.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  choice: o lugar do Deus Poderoso
  rationale: Preserva o título divino e o peso sacrílego da destruição, sem ampliar ‘lugar’ para ‘morada’.
- source_word: ܘܐܬܩܝܡܘ (leitura corrigida)
  choice: E fiquem
  rationale: A forma é entendida como imperativo plural dirigido aos anjos, não como declaração narrativa de Baruque.
theological_decisions:
- issue: Agência na queda de Jerusalém
  choice: A muralha é derrubada por anjos sob ordem celestial, impedindo que os inimigos reivindiquem para si o feito.
  alternative: A muralha simplesmente caiu, ou foi derrubada somente pelos invasores humanos.
  rationale: A ordem explícita aos anjos apresenta a destruição como juízo executado do alto e nega aos inimigos o crédito último.
translation_notes:
  register: Português atual, digno e acessível, com ritmo narrativo claro. ‘Sustentáculos’ conserva a imagem estrutural e o plural ‘muralhas’ acompanha a expressão siríaca; ‘dela’ retoma a cidade. As falas foram pontuadas para deixar claro que a ordem final continua sendo pronunciada pelo anjo.
