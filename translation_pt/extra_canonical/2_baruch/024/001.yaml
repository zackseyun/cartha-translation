  language: en
  yaml_path: translation/extra_canonical/2_baruch/024/001.yaml
  text: For look, days are coming when the books will be opened, in which the sins of all who have sinned are written, and also the storehouses in which the righteousness of all who were righteous in creation is gathered.
translation:
  language: pt
  text: 1 Pois eis que vêm dias em que serão abertos os livros nos quais estão escritos os pecados de todos os que pecaram, e também os depósitos nos quais está reunida a justiça de todos os que foram justos na criação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܘܡ̈ܬܐ
  choice: dias
  rationale: Equivalente direto e natural para o plural siríaco, preservando a fórmula escatológica de dias vindouros.
- source_word: ܚܛܝ̈ܐ / ܚܛܘ
  choice: pecados / pecaram
  rationale: Mantém em português a repetição lexical entre os atos registrados e aqueles que os cometeram.
- source_word: ܙܕܝ̈ܩܐ / ܐܙܕܩ
  choice: justiça / foram justos
  rationale: Preserva a relação lexical com a raiz de justiça sem introduzir a ideia mais específica de mérito.
- source_word: ܒ̣ܪܝܬܐ ܕܐܬܒܪܝܬ
  choice: na criação
  rationale: Conserva a referência abrangente à ordem criada e evita restringi-la a uma época ou comunidade.
- source_word: ܓܙ̈ܐ
  choice: depósitos
  rationale: Expressa lugares de armazenamento ou tesouros reservados; 'depósitos' é claro e não sugere necessariamente riqueza material.
theological_decisions:
- issue: Natureza da justiça reunida
  choice: a justiça de todos os que foram justos
  alternative: os méritos de todos os justos
  rationale: A formulação escolhida preserva a linguagem de justiça do texto e não impõe uma doutrina de mérito acumulado.
- issue: Alcance de 'na criação'
  choice: foram justos na criação
  alternative: praticaram a justiça desde a criação
  rationale: Mantém a ambiguidade quanto a 'criação' indicar a esfera criada ou uma referência temporal, sem acrescentar 'desde'.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A abertura 'Pois vejam' transmite a partícula de atenção sem arcaísmo excessivo. A sintaxe paralela de livros, pecados, depósitos e justiça foi preservada.
