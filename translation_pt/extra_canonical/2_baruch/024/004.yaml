  text: For I know what has happened to us, but what will happen to our enemies I do not know, nor when you will visit your works.”
translation:
  language: pt
  text: Pois eu sei o que nos aconteceu, mas não sei o que acontecerá aos nossos inimigos, nem quando visitarás as tuas obras.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܕܫܢܝ / contexto reconstruído no plural
  choice: o que nos aconteceu
  rationale: O trecho siríaco visível traz a ideia de ‘o que me/nos sobreveio’; a forma portuguesa segue o sentido contextual atestado pela camada de consulta e mantém linguagem natural.
- source_word: ܬܣܥܘܪ (sentido contextual de visita/intervenção)
  choice: visitarás
  rationale: Preserva o modo bíblico de falar da intervenção divina sem especificar se a visita resulta em juízo, cuidado ou restauração.
- source_word: ܥܒ̈ܕܝܟ
  choice: as tuas obras
  rationale: Mantém o referente amplo do termo siríaco, que pode indicar aquilo que Deus fez ou criou, sem restringi-lo a ‘criaturas’.
- source_word: ܒܥܠܕܒܒ̈ܝܢ (conforme a leitura contextual da tradição)
  choice: nossos inimigos
  rationale: Expressa diretamente o grupo contrastado com ‘nós’, em registro corrente e digno.
theological_decisions:
- issue: Sentido da visita divina
  choice: visitarás as tuas obras
  alternative: intervirás em favor das tuas obras / julgarás as tuas obras
  rationale: A formulação literal conserva a ambiguidade teológica da ‘visita’ divina e evita decidir antecipadamente entre salvação e juízo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A coordenação adversativa e a repetição de ‘não sei’ preservam o contraste e a limitação de conhecimento presentes no versículo.
