  text: 'Então respondi: “Mas veja, Senhor, ninguém conhece o número das coisas que já passaram, nem das que ainda estão por vir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒܥܪܝܢ
  choice: que já passaram
  rationale: O contexto contrapõe acontecimentos passados aos futuros; a forma transmitida parece refletir uma leitura textual ou gráfica difícil, mas o sentido temporal é claro no paralelismo.
- source_word: ܕܥ̈ܬܝܕܢ
