- issue: Limitação do conhecimento humano sobre o passado e o futuro
  choice: ninguém conhece o número
  alternative: ninguém sabe quantas são
  rationale: A formulação conserva a linguagem de número do contexto e não amplia a afirmação para uma doutrina geral sobre a incapacidade humana.
- issue: Vocativo divino
  choice: Senhor
  alternative: omitir o vocativo
  rationale: Segue a leitura contextual atestada pela camada de consulta inglesa; a sequência siríaca fornecida está graficamente difícil neste ponto, e o vocativo se ajusta ao diálogo sem acrescentar especificação denominacional.
