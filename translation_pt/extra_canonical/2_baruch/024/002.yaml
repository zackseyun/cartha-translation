base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/024/002.yaml
  text: And at that time you will see—and the many who are with you—the forbearance of the Most High that has been through all generations, how he has been patient with all who are born, both those who sin and those who are righteous.
translation:
  language: pt
  text: 'E, naquele tempo, verás — tu e os muitos que estão contigo — a longanimidade do Altíssimo através de todas as gerações: como ele tem sido paciente com todos os que nascem, tanto os que pecam como os justos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܓܪܬ ܪܘܚܗ (sentido refletido pela tradição textual; a leitura do recorte está corrompida)
  choice: a paciência
  rationale: Expressa de modo natural a ideia semítica de longanimidade ou tolerância paciente, preservando a repetição verbal subsequente.
- source_word: ܥܠܝܐ / equivalente contextual
  choice: Altíssimo
  rationale: Mantém o título divino tradicional atestado pela tradição de 2 Baruque, sem substituí-lo por uma interpretação denominacional.
- source_word: ܐܙܕܕܩܘ / forma cognata no trecho
  choice: praticam a justiça
  rationale: Evita sugerir apenas um estado abstrato; representa o contraste ético com os que pecam, embora a forma também possa ser vertida como “são justos”.
theological_decisions:
- issue: Natureza da paciência divina para com pecadores e justos
  choice: Manter que Deus é paciente com ambos os grupos
  alternative: Explicar a paciência como misericórdia somente para os pecadores e espera somente para os justos
  rationale: O texto apresenta os dois grupos em paralelo e não explica de maneiras distintas a paciência divina em relação a cada um.
- issue: Descrição do segundo grupo
  choice: os que praticam a justiça
  alternative: os justos
  rationale: A formulação verbal preserva o paralelismo com “os que pecam” e deixa aberta a relação entre conduta e condição de justo.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção parentética conserva a inclusão de Baruque e de seus muitos companheiros; os dois-pontos tornam explícita, sem ampliar o conteúdo, a explicação de como a paciência do Altíssimo se manifesta ao longo das gerações.
