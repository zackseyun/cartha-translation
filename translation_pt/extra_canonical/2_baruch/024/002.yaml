revisions:
- from: 'E naquele tempo você verá — você e os muitos que estarão com você — a paciência do Altíssimo ao longo de todas as gerações: como ele tem sido paciente com todos os que nascem, tanto os que pecam como os que praticam a justiça.'
  to: 'E, naquele tempo, verás — tu e os muitos que estão contigo — a longanimidade do Altíssimo através de todas as gerações: como ele tem sido paciente com todos os que nascem, tanto os que pecam como os justos.'
  rationale: A revisão corrige o futuro não atestado para o presente, preserva a inclusão de Baruque e de seus companheiros, e traduz o contraste final de modo direto. «Longanimidade» exprime a paciência perseverante atribuída ao Altíssimo, enquanto a oração seguinte mantém a formulação explícita «tem sido paciente».
  reviewer_model: gpt-5.6-terra
