base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/063/003.yaml
  text: and when Hezekiah the king heard what the king of Assyria was devising—to come, seize him, destroy his people, the two and a half tribes that remained, and even overthrow Zion—then Hezekiah trusted in his works, hoped in his righteousness, and spoke with the Mighty One.
translation:
  language: pt
  text: Quando o rei Ezequias soube do que o rei da Assíria planejava — vir, capturá-lo, destruir seu povo, as duas tribos e meia que restavam, e até derrubar Sião —, confiou em suas obras, pôs sua esperança em sua justiça e falou com o Poderoso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ ܡ̇ܠܟܐ
  choice: o rei Ezequias
  rationale: Representa o nome e o título régio em forma portuguesa corrente.
- source_word: ܡ̇ܠܟܐ ܕܐܬܘܪ
  choice: o rei da Assíria
  rationale: Traduz literalmente o título e o nome geográfico.
- source_word: ܬܪ̈ܝܗܘܢ ... ܦܠܓܘܬܐ (sentido contextual controlado pela tradição textual)
  choice: as duas tribos e meia
  rationale: Mantém a referência histórica tradicional às tribos remanescentes, conforme o texto versicular controlado e a camada inglesa auditada.
- source_word: ܚܝܠܘܗܝ ܕܐܠܗܐ
  choice: o Poderoso
  rationale: Preserva o título divino característico sem substituí-lo simplesmente por “Deus” nem introduzir terminologia denominacional.
- source_word: ܥܒ̈ܕܐ / ܥܒܕܘܗܝ
  choice: suas obras
  rationale: Mantém a formulação concreta e sua possível tensão teológica, em vez de suavizá-la como “seus méritos” ou “suas ações justas”.
theological_decisions:
- issue: Base da confiança de Ezequias
  choice: confiou em suas obras, esperou em sua justiça
  alternative: confiou em Deus por causa de suas boas obras e de sua justiça
  rationale: A tradução conserva a formulação e a tensão do texto, sem acrescentar uma explicação teológica ausente.
- issue: Título divino
  choice: o Poderoso
  alternative: Deus Todo-Poderoso
  rationale: “O Poderoso” reproduz o título de maneira sóbria e evita ampliar seu sentido com “Todo-Poderoso”.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil e em âmbito internacional. A longa enumeração foi preservada com travessões para clareza; não foram necessárias notas de rodapé.
