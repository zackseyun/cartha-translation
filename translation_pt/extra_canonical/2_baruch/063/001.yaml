  text: And the eighth bright waters that you saw—these are the integrity and uprightness of Hezekiah king of Judah, and the gracious favor that came upon him.
translation:
  language: pt
  text: E as oitavas águas luminosas que você viu representam a integridade e a retidão de Ezequias, rei de Judá, e o favor benevolente que veio sobre ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܘܗܪ̈ܐ
  choice: águas luminosas
  rationale: Preserva com clareza a imagem simbólica das águas favoráveis, em contraste com as águas escuras, sem ampliar seu sentido de modo interpretativo.
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ
  choice: integridade e retidão
  rationale: Mantém a dupla ênfase ética do siríaco em português natural e digno.
- source_word: ܛܝܒܘܬܐ
  choice: favor bondoso
  rationale: Expressa um benefício concedido a Ezequias, preservando tanto a benevolência quanto o caráter de favor recebido.
- source_word: ܚܙܝܬ
  choice: que você viu
  rationale: Emprega tratamento moderno e amplamente compreensível, mantendo a referência direta ao destinatário da visão.
theological_decisions:
- issue: Se o elogio a Ezequias descreve apenas sua excelência moral ou também o favor divino que lhe foi concedido
  choice: Distinguir a integridade e a retidão de Ezequias do favor bondoso que veio sobre ele.
  alternative: Entender toda a frase somente como descrição da virtude pessoal de Ezequias, ou somente como referência abstrata à bondade divina.
  rationale: 'A estrutura textual apresenta dois elementos relacionados, mas distintos: as qualidades de Ezequias e um favor benéfico que veio sobre ele. A tradução conserva ambos sem definir além do texto a origem desse favor.'
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, sem regionalismos marcados. “Luminosas” preserva o simbolismo visual; “favor bondoso” evita restringir ܛܝܒܘܬܐ a um sentido doutrinário posterior.
