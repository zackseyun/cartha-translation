  naturalness: O texto é fluente em português moderno. «Cada um deles tinha o mesmo número» é natural e preserva melhor a concisão e a estranheza deliberada da formulação original.
  terminology: «Chefes» é uma designação apropriada e não especifica indevidamente uma patente militar. O pronome «ele» preserva a referência contextual sem identificar explicitamente o agente como anjo.
