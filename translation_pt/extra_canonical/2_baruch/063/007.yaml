  text: And he went out and destroyed their multitude; the number of the chiefs alone was one hundred and eighty-five thousand, and each one of them had the like number.
translation:
  language: pt
  text: E ele saiu e destruiu a multidão deles; somente o número dos chefes era de cento e oitenta e cinco mil, e cada um deles tinha o mesmo número.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, possivelmente: «e cada um deles tinha número igual». A formulação numérica do texto é incomum.'
    reason: Preserva a dificuldade e a ambiguidade da expressão sem acrescentar que os números se referem a tropas sob o comando dos chefes.
lexical_decisions:
- source_word: ܘܢܦܩ
  choice: E ele saiu
  rationale: A forma verbal é de terceira pessoa do masculino singular e retoma o agente enviado por Deus no contexto, não Baruque como narrador.
- source_word: ܐܘܒܕ / forma textual correspondente no trecho
  choice: destruiu
  rationale: Expressa a eliminação da multidão no relato da derrota do exército, em linguagem direta e natural.
- source_word: ܪ̈ܘܪܒܢܐ / termo correspondente a chefes
  choice: chefes
  rationale: Mantém a referência aos líderes ou oficiais do exército sem especificar uma patente que o texto não define.
- source_word: ܐܝܟ ܡܢܝܢܗܘܢ / expressão correspondente
  choice: um número igual
  rationale: Preserva a afirmação numérica incomum do siríaco; “sob seu comando” explicita a relação implícita entre cada chefe e seus homens sem alterar o total declarado.
theological_decisions:
- issue: Identidade do sujeito que destrói a multidão
  choice: “ele saiu e destruiu”
  alternative: “eu saí e destruí”
  rationale: O verbo siríaco está na terceira pessoa masculina singular e o contexto fala do agente enviado pelo Poderoso; a primeira pessoa faria de Baruque o agente do episódio e não é sustentada pela forma verbal.
- issue: Natureza do agente
  choice: manter apenas o pronome “ele”
  alternative: identificá-lo explicitamente como “o anjo”
  rationale: Embora o contexto sugira um mensageiro ou agente celestial, o versículo emprega referência pronominal; conservar o pronome evita inserir no texto uma identificação mais explícita do que a fonte.
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa direta. A formulação numérica incomum foi preservada, e a expressão “sob seu comando” torna inteligível a relação implícita sem resolver silenciosamente a dificuldade textual.
