base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/063/008.yaml
  text: And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.
translation:
  language: pt
  text: Naquele tempo, queimei por dentro o corpo deles, mas preservei por fora suas roupas e suas armas, para que fossem vistos prodígios ainda maiores do Poderoso e para que seu nome fosse proclamado por toda a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܒܘ / contexto do relato
  choice: prodígios ainda maiores
  rationale: O contexto descreve a manifestação extraordinária do poder divino; “prodígios” comunica de modo natural e digno o sentido de feitos maravilhosos.
- source_word: ܚܝܠܘܗܝ ܕܐܠܗܐ / título divino no contexto
  choice: o Poderoso
  rationale: Preserva o título divino tradicional do livro e evita substituir a designação por uma interpretação mais específica.
- source_word: expressão de interioridade
  choice: por dentro
  rationale: Mantém o contraste deliberado entre a destruição interna dos corpos e a preservação externa de roupas e armas.
- source_word: expressão de exterioridade
  choice: por fora
  rationale: Reproduz paralelamente o contraste espacial do texto e esclarece que os objetos visíveis permaneceram intactos.
theological_decisions:
- issue: Agente da destruição
  choice: 'primeira pessoa: “queimei” e “preservei”'
  alternative: formulação passiva, sem agente expresso
  rationale: A fala atribui diretamente a ação ao agente celestial/divino que narra o feito; conservar a primeira pessoa evita apagar essa atribuição.
- issue: Designação de Deus
  choice: “o Poderoso”
  alternative: “Deus” ou “o Todo-Poderoso”
  rationale: Mantém o título característico sem intensificá-lo para “Todo-Poderoso”, forma que poderia acrescentar uma nuance não exigida.
- issue: Finalidade do sinal
  choice: “para que seu nome fosse proclamado”
  alternative: “para que se falasse de seu nome”
  rationale: “Proclamado” exprime naturalmente a divulgação pública e universal do nome, sem definir o conteúdo dessa proclamação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e alcance internacional. A estrutura conserva o contraste entre interior e exterior e as duas orações finais coordenadas.
