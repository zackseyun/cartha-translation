translation:
  language: pt
  text: E o Poderoso o ouviu, porque Ezequias era sábio, e deu atenção à sua oração, porque ele era justo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (provável leitura subjacente; o recorte apresenta transmissão/OCR irregular)
  choice: o Poderoso
  rationale: Preserva o título divino refletido pela tradição textual e pela camada inglesa auditada, sem ampliá-lo para «Todo-Poderoso».
- source_word: ܒܥܘܬܗ
  choice: sua oração
  rationale: O substantivo siríaco denota súplica ou oração; «oração» é natural no contexto e mantém a referência a Ezequias.
- source_word: ܙܕܝܩܐ / equivalente contextual
  choice: justo
  rationale: Verte o qualificativo moral e religioso tradicional sem acrescentar uma interpretação denominacional.
theological_decisions:
- issue: Identidade do sujeito divino
  choice: o Poderoso
  alternative: Deus / o Todo-Poderoso
  rationale: Mantém o título e evita substituir ou intensificar a designação presente na evidência textual.
- issue: Relação entre sabedoria, justiça e resposta divina
  choice: manter as duas orações causais como no texto
  alternative: fundir as razões numa única explicação
  rationale: 'Preserva a tensão e a estrutura: Ezequias é ouvido em associação com sua sabedoria, e sua oração é acolhida em associação com sua justiça.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. «Atendeu à sua oração» comunica naturalmente a ideia de considerar favoravelmente a súplica, sem sugerir apenas percepção auditiva.
