translation:
  language: pt
  text: “Eis que Senaqueribe está preparado para nos destruir, e será exaltado e se engrandecerá quando destruir Sião.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ
  choice: Senaqueribe
  rationale: O contexto identifica o rei assírio Senaqueribe; a forma do corpus está afetada pela transmissão/OCR do trecho.
- source_word: ܡܛܠ ܕܐܦ ...
  choice: quando destruir
  rationale: A construção subjacente é temporal, não meramente condicional; expressa a expectativa arrogante de Senaqueribe de destruir Sião.
- source_word: ܡܬܬܪܝܡ ... ܪܡܐ
  choice: será exaltado e se engrandecerá
  rationale: Mantém o paralelismo de elevação e arrogância sem reduzir os dois termos a uma única ideia.
- source_word: ܨܗܝܘܢ
  choice: Sião
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo bíblico.
theological_decisions:
- issue: Certeza ou condição na ameaça contra Sião
  choice: quando destruir Sião
  alternative: se destruir Sião
  rationale: A evidência siríaca favorece uma relação temporal. A frase apresenta a presunção de Senaqueribe, não uma afirmação do narrador de que a destruição efetivamente ocorrerá.
- issue: Introdução da fala
  choice: iniciar com “Eis que”
  alternative: '“E ele disse: ‘Eis que’”'
  rationale: A fórmula de elocução pertence mais naturalmente ao fim do versículo anterior na divisão corrente; omiti-la aqui evita duplicação.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário bíblico internacional. A sintaxe preserva o paralelismo e a tensão entre a ameaça de Senaqueribe e sua presunção.
