  yaml_path: translation/extra_canonical/2_baruch/086/001.yaml
  text: So then, when you receive the letter, read it in your assemblies with care. And consider its words more carefully on the days of the weeks, so that you may remember and be set right.
translation:
  language: pt
  text: Portanto, quando receberem esta carta, leiam-na com atenção em suas assembleias. Prestem ainda mais atenção às palavras dela nos dias das semanas[a], para que se lembrem e sejam corrigidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão siríaca é incomum; possivelmente, “nos dias de semana”.
    reason: Preservar a incerteza lexical e textual da expressão ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ sem introduzir no texto principal uma interpretação litúrgica.
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  choice: com atenção
  rationale: O termo pode indicar sossego, disponibilidade ou cuidado atento. No contexto da leitura pública, “com atenção” comunica uma escuta deliberada sem impor a ideia mais forte de diligência laboriosa.
- source_word: ܬܬܗܪܘܢ ... ܝܬܝܪܐܝܬ
  choice: Prestem ainda mais atenção
  rationale: O verbo exorta a considerar ou observar atentamente, e o advérbio acrescenta a noção de maior intensidade. A formulação é natural em português e conserva a força exortativa.
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  choice: nos dias das semanas
  rationale: A redação siríaca fala literalmente de “dias” e “semanas” e permanece incomum ou textualmente instável. A tradução mantém essa estranheza em vez de introduzir uma referência litúrgica não explícita.
- source_word: ܬܬܥܗܕܘܢ
  choice: se lembrem
  rationale: O verbo significa lembrar ou trazer à mente. A forma reflexiva é clara, corrente e adequada à exortação.
- source_word: ܬܬܪܨܘܢ
  choice: sejam corrigidos
  rationale: O verbo expressa ser endireitado, ajustado ou corrigido. “Sejam corrigidos” preserva a voz passiva e a dimensão de retificação moral sem especificar indevidamente o agente.
theological_decisions:
- issue: Se a exortação deve ser reformulada em linguagem devocional ou litúrgica familiar
  choice: Manter uma exortação sóbria à leitura comunitária, à lembrança e à correção
  alternative: Parafrasear a passagem como meditação em dias de jejum ou como devoção particular
  rationale: O siríaco apresenta uma orientação prática e comunitária, sem identificar explicitamente dias de jejum nem desenvolver uma doutrina específica.
- issue: Força da correção final
  choice: “sejam corrigidos”
  alternative: “sejam postos no caminho certo” ou “se endireitem”
  rationale: A opção escolhida conserva a passividade e o sentido reformador do verbo, evitando tanto uma metáfora ampliada quanto uma formulação que sugeriria apenas autocorreção.
translation_notes:
  register: Português moderno, digno e acessível, com formas plurais inclusivas do grupo destinatário. “Assembleias” mantém o caráter comunitário sem importar terminologia eclesiástica posterior; a ordem das frases acompanha de perto a progressão do siríaco.
