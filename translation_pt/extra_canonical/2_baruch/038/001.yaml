base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/038/001.yaml
  text: And I prayed and said, “Lord, my Lord, you continually give light to those who are guided in understanding. Your law is life, and your wisdom is uprightness. Therefore show me the interpretation of this vision. For you know that my soul has walked in your law, and from my earliest days I have not been cut off from your wisdom.”
translation:
  language: pt
  text: 'E orei, dizendo: “Senhor, meu Senhor, tu sempre iluminas os que são guiados pelo entendimento. Tua lei é vida, e tua sabedoria é retidão. Portanto, mostra-me a interpretação desta visão, pois sabes que minha alma tem andado em tua lei e que, desde os meus primeiros dias, não fui separado de tua sabedoria.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  choice: os que são guiados pelo entendimento
  rationale: Preserva tanto a ideia de serem conduzidos quanto o sentido intelectual e moral de entendimento, sem transformar a expressão em mera capacidade intelectual.
- source_word: ܢܡܘܣܟ ܚ̈ܝܐ ܗܘ
  choice: Tua lei é vida
  rationale: Mantém a identificação enfática da oração nominal, em vez de enfraquecê-la para “dá vida”.
- source_word: ܚܟܡܬܟ ܬܪܝܨܘܬܐ ܗܝ
  choice: tua sabedoria é retidão
  rationale: “Retidão” comunica a ideia de correção e integridade moral sem impor um sentido forense mais específico.
- source_word: ܦܘܫܩܗ ܕܚܙܘܐ ܗܢܐ
  choice: a interpretação desta visão
  rationale: No contexto apocalíptico, “interpretação” expressa adequadamente a explicação do significado simbólico da visão.
- source_word: ܠܐ ܐܬܢܣܝܬ
  choice: não fui separado
  rationale: Conserva a força relacional e possivelmente passiva do verbo, evitando reduzi-lo apenas a um afastamento voluntário.
theological_decisions:
- issue: Relação entre lei, sabedoria e revelação divina
  choice: Apresentar a lei como vida e a sabedoria como retidão em duas afirmações paralelas e fortes.
  alternative: Entender “retidão” em sentido especificamente forense ou tratar as expressões apenas como títulos devocionais.
  rationale: A formulação preserva a teologia sapiencial e pactual do texto sem acrescentar categorias doutrinárias posteriores.
- issue: Sujeito e pronomes do discurso
  choice: Seguir a leitura controlada do texto, na qual Baruque ora ao Senhor e fala de “tua lei” e “tua sabedoria”.
  alternative: 'Seguir literalmente as formas aparentes do corpus OCR: “ele respondeu”, “minha lei” e “minha sabedoria”.'
  rationale: As formas alternativas resultam de corrupção de OCR reconhecida no material de controle e produzem uma sequência incoerente com o texto manuscrito e com a tradição textual auditada.
translation_notes:
  register: Português atual, digno e de leitura ampla, com cadência oracional simples. Empregou-se “tu” para manter coerência com a invocação direta e evitar a mistura pronominal. “Tem andado” preserva a ideia de conduta contínua da alma, enquanto “desde os meus primeiros dias” soa natural sem perder a referência temporal.
