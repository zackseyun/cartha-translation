  yaml_path: translation/extra_canonical/2_baruch/061/006.yaml
  text: And the judgments of the rulers were then seen to be without deceit, and the righteousness of the commandments of the Mighty One was accomplished in truth.
translation:
  language: pt
  text: E então os julgamentos dos governantes foram vistos como isentos de engano[a], e a justiça dos mandamentos do Poderoso foi cumprida em verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o julgamento dos governantes foi visto como isento de engano”.'
    reason: Registra a leitura anterior no singular, embora a evidência siríaca favoreça substantivo e verbo no plural.
lexical_decisions:
- source_word: ܕܝ̈ܢܐ (dīnē)
  choice: julgamentos
  rationale: O substantivo está no plural, concordando com a forma verbal plural; “julgamentos” preserva tanto o sentido judicial quanto a revisão gramatical mais recente.
- source_word: ܫܠܝ̈ܛܢܐ (šallīṭānē)
  choice: governantes
  rationale: Termo amplo e natural para autoridades que exercem domínio, sem especificar indevidamente reis, juízes ou magistrados.
- source_word: ܚܟܠܐ / ideia de ausência de dolo conforme a leitura auditada
  choice: isentos de engano
  rationale: Expressa de modo idiomático que os julgamentos não continham fraude ou falsidade, sem transformar a frase numa afirmação mais ampla sobre impecabilidade.
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: Poderoso
  rationale: Mantém o título divino tradicional e a referência à força/poder, sem substituir o título pelo nome “Deus”.
- source_word: ܒܩܘܫܬܐ (ba-qūštā)
  choice: em verdade
  rationale: Preserva a formulação solene e a possível nuance de veracidade/fidelidade, em vez de reduzi-la a mero advérbio de intensidade.
theological_decisions:
- issue: Título divino
  choice: o Poderoso
  alternative: Deus / o Todo-Poderoso
  rationale: “Poderoso” reproduz o título da tradição textual sem identificar mais especificamente sua extensão teológica.
- issue: Relação entre justiça e mandamentos
  choice: a justiça dos mandamentos ... se cumpriu
  alternative: os mandamentos justos ... foram cumpridos
  rationale: Mantém “justiça” como substantivo e preserva a tensão do texto sobre aquilo que é realizado em verdade, sem convertê-la apenas em adjetivo dos mandamentos.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe solene moderada. O marcador [a] foi colocado no texto principal junto à expressão cuja variação ele documenta.
