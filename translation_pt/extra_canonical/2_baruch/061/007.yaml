base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/061/007.yaml
  text: And the land, because it then received mercy, and because its inhabitants did not sin, was glorified above all lands; and the city Zion then ruled over all lands and regions.
translation:
  language: pt
  text: 'E a terra, porque naquele tempo recebeu misericórdia e porque seus habitantes não pecaram, foi glorificada acima de todas as terras; e a cidade de Sião dominou então sobre todas as terras e regiões.[a]


    [a] Ou: “dominou então sobre todas as terras”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dominou então sobre todas as terras”.'
    reason: Registra a alternativa mais breve para a extensão do domínio de Sião, sem introduzir uma diferença aspectual além da omissão de «e regiões».
lexical_decisions:
- source_word: ܐܪܥܐ (ʾarʿā)
  choice: terra
  rationale: Mantém a repetição e o alcance geográfico do termo sem restringi-lo a “país”.
- source_word: ܐܬܪܚܡܬ (forma verbal passiva, ‘recebeu misericórdia’)
  choice: recebeu misericórdia
  rationale: Preserva a linguagem teológica e a construção passiva, sem explicitar quem concede a misericórdia.
- source_word: ܐܫܬܒܚܬ (forma verbal passiva, ‘foi glorificada’)
  choice: foi glorificada
  rationale: Conserva a voz passiva e evita reduzir o sentido a mera fama ou prosperidade.
- source_word: ܫܠܛܬ (šellaṭat, ‘governou/dominou’)
  choice: dominava
  rationale: Expressa autoridade política ou supremacia; o imperfeito português se ajusta ao quadro histórico descrito.
- source_word: ܗܝܕܝܢ (hāydēn)
  choice: então
  rationale: Retém o advérbio temporal enfatizado pela evidência textual e o associa ao domínio de Sião.
theological_decisions:
- issue: Relação entre misericórdia, ausência de pecado e glorificação da terra
  choice: Manter as duas causas coordenadas literalmente
  alternative: Reformular a ausência de pecado como resultado da misericórdia
  rationale: O texto apresenta ambas com valor causal paralelo; a tradução não deve impor uma relação teológica adicional.
- issue: Agente da misericórdia e da glorificação
  choice: Conservar as formas sem agente expresso
  alternative: Acrescentar “por Deus”
  rationale: Embora o agente divino possa estar implícito, ele não deve ser inserido no texto principal sem expressão explícita.
- issue: Extensão do domínio de Sião
  choice: “sobre todas as terras e regiões” no texto principal
  alternative: “sobre todas as terras”
  rationale: A formulação mais ampla segue a leitura adotada pela camada de consulta auditada, enquanto a variante mais breve é preservada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla. “Naquele tempo” evita ambiguidade temporal na primeira oração, enquanto “então” preserva a ênfase temporal específica do segundo membro. A nota [a] aparece no texto principal e ao pé da tradução.
