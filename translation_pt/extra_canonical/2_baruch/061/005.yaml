translation:
  language: pt
  text: 'E as festas santas foram celebradas[a] com bondade e muita alegria.


    [a] Ou: “foram cumpridas”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram cumpridas”.'
    reason: Preserva a alternativa mais formal do verbo subjacente, conforme registrada na tradição de tradução consultada.
lexical_decisions:
- source_word: (trecho siríaco do v. 5 não isolável com segurança no recorte fornecido)
  choice: festas santas
  rationale: Mantém a expressão atestada pela camada de consulta sem introduzir uma especificação litúrgica ausente.
- source_word: (verbo subjacente refletido como “were celebrated / were fulfilled”)
  choice: foram celebradas
  rationale: Em português, “celebrar festas” é a colocação natural; a possibilidade mais literal “foram cumpridas” é preservada em nota.
- source_word: (substantivo refletido como “goodness”)
  choice: bondade
  rationale: Preserva o sentido moral positivo sem o reinterpretar como mera correção ritual.
theological_decisions:
- issue: Possível sentido de cumprimento das festas
  choice: foram celebradas
  alternative: foram cumpridas
  rationale: O texto principal privilegia português natural no contexto festivo, enquanto a nota conserva a possibilidade de um sentido de cumprimento, evitando resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. O recorte siríaco fornecido abrange um bloco capitular interpolado e não permite localizar com segurança as palavras exatas do versículo; por isso, a formulação segue cautelosamente a leitura auditada da camada inglesa e explicita a principal ambiguidade em nota.
