  text: And the sixth bright waters that you saw—this is the time in which David and Solomon were born.a
translation:
  language: pt
  text: E as sextas águas luminosas que você viu — este é o tempo em que nasceram Davi e Salomão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estas correspondem ao tempo”.'
    reason: O símbolo está no plural (“águas”), enquanto “tempo” está no singular; a construção pode conservar a concordância com as águas ou apresentar o símbolo como uma unidade temporal.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: águas luminosas
  rationale: Mantém a imagem de águas radiantes e favoráveis, em contraste com as águas escuras, sem reduzi-la à mera transparência.
- source_word: ܙܒܢܐ
  choice: tempo
  rationale: É o equivalente natural no contexto da sucessão de períodos históricos simbolizados pelas águas.
- source_word: ܐܬܝܠܕܘ
  choice: nasceram
  rationale: Reproduz diretamente o sentido do verbo e se ajusta aos dois personagens, Davi e Salomão.
theological_decisions:
- issue: Se o período de Davi e Salomão deve ser apresentado como domínio escatológico ou como etapa histórica da visão.
  choice: Período histórico-tipológico de Davi e Salomão.
  alternative: Referência direta a um reinado messiânico futuro.
  rationale: O versículo identifica explicitamente as sextas águas luminosas com o tempo em que Davi e Salomão nasceram; por isso, não se antecipa aqui a revelação messiânica posterior.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Luminosas” preserva a qualidade radiante da imagem; o travessão marca a interpretação do símbolo sem acrescentar explicação ao texto.
