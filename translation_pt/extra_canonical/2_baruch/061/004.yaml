translation:
  language: pt
  text: E a sabedoria foi ouvida na assembleia, e as riquezas do entendimento foram engrandecidas nas congregações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܟܡܬܐ (ḥekmtā)
  choice: sabedoria
  rationale: Equivalente direto e natural, preservando o conceito sapiencial do texto.
- source_word: ܣܘܟܠܬܢܘܬܐ (sukkaltānūtā)
  choice: entendimento
  rationale: Expressa a capacidade de compreender e mantém o paralelismo com “sabedoria” sem recorrer ao termo mais técnico “intelecto”.
- source_word: ܥܘܬܪܐ (ʿūtrā)
  choice: riquezas
  rationale: Mantém a metáfora de abundância e valor; o plural em português soa natural nesta construção.
- source_word: ܟܢܘܫܬܐ / forma congregacional pressuposta pelo texto versificado
  choice: assembleia / congregações
  rationale: Reproduz a variação coletiva do paralelismo e usa vocabulário claro e digno em português atual.
theological_decisions:
- issue: Personificação da sabedoria e do entendimento
  choice: Manter as formas passivas “foi ouvida” e “foram exaltadas”
  alternative: Explicitar que pessoas sábias falaram ou foram honradas
  rationale: A formulação preserva a personificação e a tensão poética do texto, sem introduzir uma interpretação ausente da evidência textual.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. A tradução segue a delimitação versificada atestada pela camada inglesa auditada, pois o recorte siríaco fornecido é um bloco de capítulo com paginação sobreposta e leitura local parcialmente corrompida.
