    ܕܡܬܒܥܝܐ ܒܕܡܘܬܐ

    ܕܥܝܪ ܡܩܕܫܐ ܕܗܘܐ.

    ܐܠܐ ܐܦ ܗܢܝܢ ܚܘܝܬ

    ܗܘܐ ܡܘܫܚ̈ܬܗ̇ ܕܢܘܪܐ.

    ܐܦ ܒܘ̈ܩܘܗܝ ܕܬܗܘܡܐ.

    ܘܡܫܪ̈ܘܝ ܕܪ̈ܘܚܐ. ܘܡܢܝܢܐ

    ܕܢܛ̈ܦܐ ܡܛܪܐ. ܘܐܚܝܕܘܬ

    ܕܪ̈ܘܓܙܐ. ܘܣܓܝܘ̈ܬܐ

    ܕܓܝܓ̈ܠܐ ܪܘܚܐ. ܘܫܪܪܗ

    ܕܕܝܢܐ. ܘܥܘܪܒܐ ܕܚܟܡܬܐ.

    ܘܥܘܬܪܐ ܕܣܘܟܠܬܢܘܬܐ.

    ܕܒܥ̈ܠܕܒܒܐ܂ ܘܪܢܝܐ ܝܘܡܢܐ

    ܕܕܝ̈ܢܐ܂ ܘܡܥܒܕܐ ܕܡܘ̈ܬܒܐ܂

    ܘܐܬܒܥܝܐ ܕܥܕܟܝܠ ܠܐ

    ܐܬܝ̈ܝ܂ ܘܦܘܡܟܢܐ ܕܐܓܘܢܐ܂

    ܘܚ'
