base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/061/002.yaml
  text: And at that time there came the building of Zion, and the dedication of the sanctuary, and much blood of the nations who sinned then was shed, and many offerings were offered then at the dedication of the sanctuary.
translation:
  language: pt
  text: Naquele tempo, realizaram-se[a] a edificação de Sião e a dedicação do santuário. Muito sangue das nações que então pecaram foi derramado, e muitas ofertas foram apresentadas naquela ocasião, durante a dedicação do santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: houve.'
    reason: Registra de modo idiomático a alternativa existencial-eventiva para «realizaram-se».
lexical_decisions:
- source_word: ܨܗܝܘܢ (pressuposto pelo texto consultivo; “Zion”)
  choice: Sião
  rationale: Forma bíblica portuguesa consagrada para o topônimo, clara e natural.
- source_word: ܩܘܕܫܐ / termo correspondente a “sanctuary”
  choice: santuário
  rationale: Preserva a referência ao espaço sagrado sem especificar indevidamente “templo”.
- source_word: ܩܘܪܒܢ̈ܐ / termo correspondente a “offerings”
  choice: ofertas
  rationale: Termo abrangente que não restringe as ofertas a sacrifícios de uma categoria específica.
- source_word: ܗܘܐ / expressão existencial-eventiva refletida por “there came”
  choice: realizaram-se
  rationale: Transmite em português natural a ocorrência dos dois acontecimentos, sem acrescentar a ideia de conclusão.
theological_decisions:
- issue: Relação entre o pecado das nações e o derramamento de sangue
  choice: “o sangue das nações que então pecaram foi derramado”
  alternative: “as nações pecaram ao derramar muito sangue”
  rationale: Mantém as nações como aquelas cujo sangue foi derramado e cujo pecado é mencionado, sem transformar o derramamento de sangue no conteúdo explícito do pecado.
- issue: Natureza das ofertas na dedicação
  choice: “muitas ofertas”
  alternative: “muitos sacrifícios”
  rationale: Evita limitar o termo a sacrifícios sangrentos quando a formulação disponível é mais ampla.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe ligeiramente solene adequada ao gênero. “Naquela ocasião” evita a repetição pouco natural de “então”, e “durante” explicita apenas a relação temporal já presente no texto.
