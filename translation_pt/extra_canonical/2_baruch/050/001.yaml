  text: He answered and said to me, “Hear then the word.”
translation:
  language: pt
  text: 'Ele me respondeu: “Ouça, então, a palavra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  choice: Ele me respondeu
  rationale: A fórmula siríaca significa literalmente “respondeu e disse-me”; em português atual, “respondeu-me” ou “me respondeu” transmite naturalmente a mesma função narrativa sem redundância desnecessária.
- source_word: ܫܡܥ
  choice: Ouça
  rationale: O imperativo singular dirige-se a Baruque. “Ouça” é claro, digno e amplamente compreensível, preservando o chamado direto à atenção.
- source_word: ܒܪܡ
  choice: então
  rationale: Neste contexto, a partícula funciona como elemento de transição ou ênfase. “Então” conserva o encadeamento discursivo sem impor um contraste forte.
- source_word: ܡܠܬܐ
  choice: a palavra
  rationale: O substantivo pode significar palavra, declaração ou assunto. “A palavra” preserva a formulação concisa e sua possível amplitude sem especificar indevidamente o conteúdo.
theological_decisions:
- issue: Extensão do versículo
  choice: Traduzir somente a frase correspondente a 50:1
  alternative: Acrescentar a explicação sobre a terra devolver e ressuscitar os mortos
  rationale: O recorte do testemunho siríaco fornecido termina, para este versículo, em “Ouça, então, a palavra”. O material sobre a devolução dos mortos pertence aos versículos seguintes e não deve ser antecipado aqui.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira. A fórmula semítica dupla “respondeu e disse” foi vertida idiomaticamente por “me respondeu”; manteve-se “a palavra” para não reduzir a ambiguidade lexical do siríaco.
