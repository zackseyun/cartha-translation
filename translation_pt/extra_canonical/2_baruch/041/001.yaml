base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/041/001.yaml
  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
translation:
  language: pt
  text: 'E eu disse: “Para quem e para quantos serão estas coisas? E quem será considerado digno de ver aquele tempo?[a]


    Mas falarei contigo sobre tudo o que penso e te perguntarei a respeito daqueles do teu povo que vi em grande número, os quais se afastaram da tua aliança e lançaram para longe de si o jugo da tua lei.


    Vi também outros que abandonaram a sua vaidade[b] e fugiram para debaixo das tuas asas.


    Que acontecerá, então, com eles? Ou como aquele tempo final os receberá?


    Ou será que o tempo deles será pesado e, conforme a balança se inclinar, assim serão julgados?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O conjunto de páginas de Ceriani usado para este capítulo se sobrepõe ao fim do capítulo 40 e ao início do capítulo 42. O sentido desta pergunta é claro, mas seu limite textual exato é esclarecido pela página 576 de Kmosko.
    reason: textual_variant
  - marker: b
    text: A linha siríaca neste ponto é localmente incerta no texto de Ceriani; “sua vaidade” conta com o apoio do testemunho latino de controle de Kmosko.
    reason: lexical_alternative
lexical_decisions:
- source_word: ܩܝܡܐ / ܩܝܡ̈ܐ (forma corrompida no OCR)
  choice: tua aliança
  rationale: Embora o termo possa envolver a nuance de compromisso ou promessa, “aliança” comunica melhor o sentido pactual no contexto apocalíptico judaico.
- source_word: ܢܡܘܣܐ
  choice: lei
  rationale: A expressão “jugo da tua lei” preserva o idioma pactual e a força normativa do termo.
- source_word: ܡܘܒܠܐ / expressão localmente incerta
  choice: sua vaidade
  rationale: A leitura é apoiada pelo testemunho latino de controle; “vaidade” mantém a ideia de vazio moral e espiritual sem especificá-la em excesso.
- source_word: ܓܢܦ̈ܐ / expressão preservada pelo testemunho de controle
  choice: debaixo das tuas asas
  rationale: Mantém literalmente a metáfora bíblica de refúgio e proteção divina.
- source_word: ܡܬܬܚܒܘ / expressão de pesagem (texto incerto no OCR)
  choice: será pesado
  rationale: A menção subsequente da balança indica uma metáfora específica de pesagem judicial, não apenas de avaliação geral.
theological_decisions:
- issue: O destino daqueles que abandonaram a aliança e daqueles que retornaram
  choice: Manter a questão em aberto diante de Deus
  alternative: Antecipar uma sentença categórica antes da resposta do capítulo seguinte
  rationale: Baruque pergunta como o tempo final receberá esses grupos; preservar a forma interrogativa mantém a tensão e a sequência do texto.
- issue: Sentido da imagem “debaixo das tuas asas”
  choice: Preservar a metáfora literal do refúgio divino
  alternative: Substituí-la por “sob a tua proteção”
  rationale: A imagem retrata o retorno não apenas como mudança moral, mas como busca de abrigo em Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Foram mantidos o tratamento singular reverente em segunda pessoa, a metáfora das asas, o idioma do jugo da lei e a ambiguidade judicial da balança.
