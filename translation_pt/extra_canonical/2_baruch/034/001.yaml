    issue: Sintaxe pouco natural e relação sintática imprecisa em “Mas vocês, somente até a casa funerária... clamem”.
    rationale: O texto-fonte contém uma construção difícil, mas o português pode explicitar o movimento subentendido (“vão”) e manter o imperativo de lamentar separado, sem nivelar a ambiguidade textual posterior.
  - severity: low
    issue: “Longe de mim ficar calado” soa algo truncado em português moderno.
    rationale: “Longe de mim que eu me cale” é uma forma mais natural de expressar uma recusa enfática, sem alterar o valor de ܚܣ ܠܝ.
