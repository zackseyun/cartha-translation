review_pass:
  verdict: revise
  source_fidelity: A tradução acerta o idiomatismo de ܚܣ ܠܝ como rejeição enfática (“Longe de mim”) e conserva o imperativo plural de lamentar, bem como os termos de aflição e angústia. Contudo, a construção portuguesa “Mas vocês, somente até...” é elíptica de modo pouco claro e pode sugerir que “até a casa funerária” modifica o clamor, em vez de delimitar o deslocamento dos destinatários. Uma formulação que explicite o verbo subentendido torna a sintaxe inteligível sem acrescentar conteúdo relevante. A sequência final permanece textualmente difícil; a nota deve preservar essa incerteza.
  naturalness: “Longe de mim ficar calado” é compreensível, mas “Longe de mim que eu me cale” é mais idiomático em português atual e reproduz melhor a construção prospectiva. “Vão somente até...” organiza naturalmente a ordem do imperativo e do destino funerário. “Diante de vocês, nem depois” continua deliberadamente abrupto, pois a nota informa a dificuldade sintática.
  terminology: “Casa funerária” e “túmulos de meus pais” mantêm, com português legível, a redundância funerária do siríaco. “Aflição”, “angústia” e “lamentação” preservam o acúmulo retórico sem impor interpretação teológica.
  issues:
