base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/034/001.yaml
  text: Then I lifted up my eyes and wept, and I said at that time, “Far be it from me that I should be silent toward you or forget you. But only as far as the house of the tombs of my fathers, in affliction and in the distress of lamentation cry aloud, so that I may not be forgotten before you and afterward. And these things I have declared to you for your remembrance.”
translation:
  language: pt
  text: 'Então levantei os olhos, chorei e disse naquela ocasião: “Longe de mim que eu me cale diante de vocês ou me esqueça de vocês. Mas vocês, vão somente até a casa funerária, aos túmulos de meus pais; em meio à aflição e à angústia da lamentação, clamem, para que eu não seja esquecido diante de vocês, nem depois.[a] Estas coisas lhes declarei para que se lembrem delas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O sentido e a divisão das frases neste trecho são incertos no texto siríaco; outra possibilidade é: “para que eu não seja esquecido por vocês; e, depois, lembrem-se destas coisas que lhes declarei”.'
    reason: A sequência siríaca em torno de “diante de vocês”, “depois” e “estas coisas” é sintaticamente difícil, e a pontuação editorial pode alterar as relações entre as orações.
lexical_decisions:
- source_word: ܚܣ ܠܝ
  choice: Longe de mim
  rationale: A expressão idiomática comunica forte rejeição da possibilidade mencionada, e não um pedido de compaixão.
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  choice: ficar calado diante de vocês
  rationale: Preserva o sentido do verbo ‘calar-se’ e sua orientação interpessoal, sem ampliá-lo para a ideia de abandono.
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  choice: até a casa funerária, aos túmulos de meus pais
  rationale: Mantém a repetição concreta da linguagem sepulcral, embora com pontuação que torna a frase compreensível em português.
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  choice: clamem em meio à aflição e à angústia da lamentação
  rationale: Conserva o acúmulo de termos de sofrimento e o imperativo plural de clamar.
- source_word: ܥܘܗܕܢܘܢ
  choice: para que se lembrem delas
  rationale: Expressa de modo natural o campo semântico de lembrança ou memorial, tomando ‘estas coisas’ como antecedente imediato.
