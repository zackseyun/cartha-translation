base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/009/001.yaml
  text: And I, Baruch, came with Jeremiah, whose heart had been found pure from sins, and who had not been taken in the capture of the city. And we rent our garments, wept, mourned, and fasted seven days.
translation:
  language: pt
  text: E eu, Baruque, fui com Jeremias, cujo coração havia sido considerado puro de pecados e que não havia sido levado quando a cidade foi capturada. Então rasgamos as nossas roupas, choramos, lamentamos e jejuamos durante sete dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܒܥ
  choice: fui com
  rationale: O início do capítulo está textualmente frágil, mas o contexto e a tradição de controle favorecem um verbo simples de movimento. “Fui com” é natural em português e evita especificar, sem segurança, se houve retorno ou partida.
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  choice: cujo coração havia sido considerado puro de pecados
  rationale: A expressão atribui a Jeremias integridade moral no contexto da culpa e da queda da cidade. “Puro de pecados” preserva a força do siríaco sem transformar a frase numa afirmação sistemática de impecabilidade absoluta.
- source_word: ܐܬܚܙܝ
  choice: havia sido considerado
  rationale: Neste contexto, o verbo expressa uma avaliação reconhecida do caráter de Jeremias, e não apenas percepção visual. A formulação passiva também conserva a abertura quanto a quem fez essa avaliação.
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  choice: quando a cidade foi capturada
  rationale: A expressão se refere à tomada violenta da cidade. Esta formulação mantém o sentido militar e soa clara em português corrente.
- source_word: ܘܒܩ̈ܝ
  choice: choramos, lamentamos
  rationale: Os verbos de luto são mantidos separadamente para preservar a intensidade e a progressão da cena.
theological_decisions:
- issue: Jeremias é descrito como “puro de pecados”
  choice: Manter a expressão como uma avaliação de Jeremias no contexto da culpa e da queda de Jerusalém.
  alternative: Entender a frase como declaração de que Jeremias era absolutamente impecável, ou como pureza sobretudo ritual.
  rationale: O contexto imediato relaciona a pureza de Jeremias à captura da cidade e ao fato de ele não ter sido levado. A tradução conserva a linguagem forte do texto, mas não amplia seu alcance para resolver uma questão teológica que o verso não explicita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Rasgamos as nossas roupas” comunica naturalmente o gesto antigo de luto; “durante sete dias” expressa com clareza a duração do jejum. Não se acrescentou nota, pois a variante inglesa fornecida repete apenas a primeira parte do texto e decorre de uma versão anterior incompleta, não de uma ambiguidade textual útil ao leitor.
