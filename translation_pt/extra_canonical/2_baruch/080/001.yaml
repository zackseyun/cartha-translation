  source_fidelity: A tradução acompanha de perto o texto inglês auditado e preserva de modo responsável a lacuna/ruptura da abertura, sem inserir no texto principal a interpolação tradicional. Os termos principais — “anjos”, “muralhas”, “utensílios sagrados”, “entregaram” e “humilhação” — são adequados ao contexto e às decisões lexicais fornecidas. A nota explica corretamente que a expansão tradicional não é segura para o texto principal.
  naturalness: O português é claro, moderno e de registro apropriado. Contudo, a construção inicial “... havia posto isso no coração...[a] —, nós sabíamos” une de forma sintaticamente defeituosa uma frase interrompida a uma nova oração. Separar as orações preserva a incerteza textual e torna a leitura natural.
  terminology: 'A terminologia é consistente e apropriada: “Nabucodonosor”, “Babilônia”, “Altíssimo”, “Sião”, “anjos” e “utensílios sagrados” são escolhas estáveis e compreensíveis. “Reforços de ferro” comunica interpretativamente os elementos de ferro da muralha, sem exceder de modo indevido o sentido da tradução-base.'
  issues:
  - severity: low
    issue: Pontuação e ligação sintática na abertura interrompida
    rationale: Após as reticências e a nota, o travessão seguido de vírgula antes de “nós sabíamos” produz uma ligação gramaticalmente irregular. Um ponto após a lacuna mantém a frase textual incompleta, mas deixa explícito que “Sabíamos que...” inicia uma nova declaração.
  revised_text: 'Sabíamos de antemão o que haveria de acontecer: Nabucodonosor, rei da Babilônia, havia posto isso no coração...[a] Sabíamos que nenhuma ordem de sua boca sairia em vão, nem de modo diferente do que ele havia determinado previamente. Pois aquilo que fora decidido de antemão foi mostrado abertamente. Também me foi revelado que anjos agiam contra a cidade: eles abalaram suas muralhas e as arrancaram, e derrubaram a poderosa muralha com seus sólidos reforços de ferro. Naquele tempo, porém, esconderam os utensílios sagrados, para que não fossem vistos pelos inimigos.


    Depois de fazerem essas coisas, entregaram aos inimigos a muralha destruída, a casa saqueada, o templo incendiado e o povo que havia sido vencido e estava sendo levado embora. Assim, os inimigos não poderiam se vangloriar, dizendo: “Cercamos até mesmo a casa do Altíssimo e a derrubamos em combate.”


    Eles também prenderam seus irmãos, levaram-nos para a Babilônia e os fizeram morar ali. Nós, porém, e nossos descendentes fomos deixados aqui, poucos e pequenos. Essa é a aflição do povo sobre a qual escrevi a vocês. Pois vocês certamente sabem que a humilhação de Sião tem pesado muito sobre vocês, porque o conhecimento que tinham dela era maior que o do povo, visto que eram vocês os que serviam ali, enquanto nós prestávamos auxílio.'
  revised_footnotes:
