  yaml_path: translation/extra_canonical/2_baruch/080/001.yaml
  text: 'Knowing first what was to happen, that Nebuchadnezzar king of Babylon set it in his heart... But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.


    And when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’


    They also bound your brothers and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.'
translation:
  language: pt
  text: 'Sabíamos de antemão o que haveria de acontecer: Nabucodonosor, rei da Babilônia, havia posto isso no coração...[a] Sabíamos que nenhuma ordem de sua boca sairia em vão, nem de modo diferente do que ele havia determinado previamente. Pois aquilo que fora decidido de antemão foi mostrado abertamente. Também me foi revelado que anjos agiam contra a cidade: eles abalaram suas muralhas e as arrancaram, e derrubaram a poderosa muralha com seus sólidos reforços de ferro. Naquele tempo, porém, esconderam os utensílios sagrados, para que não fossem vistos pelos inimigos.


    Depois de fazerem essas coisas, entregaram aos inimigos a muralha destruída, a casa saqueada, o templo incendiado e o povo que havia sido vencido e estava sendo levado embora. Assim, os inimigos não poderiam se vangloriar, dizendo: “Cercamos até mesmo a casa do Altíssimo e a derrubamos em combate.”


    Eles também prenderam seus irmãos, levaram-nos para a Babilônia e os fizeram morar ali. Nós, porém, e nossos descendentes fomos deixados aqui, poucos e pequenos. Essa é a aflição do povo sobre a qual escrevi a vocês. Pois vocês certamente sabem que a humilhação de Sião tem pesado muito sobre vocês, porque o conhecimento que tinham dela era maior que o do povo, visto que eram vocês os que serviam ali, enquanto nós prestávamos auxílio.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto siríaco está incompleto ou corrompido neste ponto. Outra tradução, baseada em uma reconstrução tradicional, é: “Agora, meus irmãos, saibam primeiro o que haveria de acontecer. Nabucodonosor, rei da Babilônia, havia decidido subir contra a cidade.”'
    reason: Registra a dificuldade textual da abertura e a leitura tradicional sem inserir no texto principal palavras não atestadas com segurança na fonte fornecida.
lexical_decisions:
- source_word: ܡܠܐܟ̈ܐ
  choice: anjos
  rationale: No contexto apocalíptico, os agentes que desmantelam as defesas da cidade são seres celestiais; “anjos” preserva essa força teológica sem reduzir o termo a mensageiros humanos.
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ
  choice: suas muralhas … a poderosa muralha
  rationale: “Muralhas” expressa naturalmente as estruturas defensivas urbanas, e “poderosa muralha” conserva a intensificação da segunda referência.
- source_word: ܡܐ ܛܒܝ̈ܢ
  choice: os utensílios sagrados
  rationale: Embora a expressão possa significar literalmente “as coisas boas/preciosas”, o contexto imediato do templo favorece os objetos do santuário; “utensílios” é claro e corrente em português bíblico.
- source_word: ܐܫܠܡܘ
  choice: entregaram
  rationale: O verbo indica dar algo ao poder de outro. “Entregaram” preserva tanto o movimento narrativo quanto a ideia de a cidade ser entregue ao inimigo.
- source_word: ܚܘܪܐ
  choice: a casa saqueada
  rationale: A linha siríaca está textualmente difícil, mas a sequência descreve muralha arruinada, casa despojada e templo queimado; “saqueada” comunica essa progressão com naturalidade.
- source_word: ܡܟܝܟ
  choice: humilhação
  rationale: O contexto apresenta Sião publicamente rebaixada. “Humilhação” conserva tanto o abatimento quanto a vergonha sofrida.
theological_decisions:
- issue: Quem realmente derrubou as defesas da cidade
  choice: A cidade só é entregue depois da atuação explícita de agentes celestiais.
  alternative: Os babilônios destruíram sozinhos a cidade, ou a ação angelical é apenas metafórica.
  rationale: O siríaco atribui aos anjos a ação anterior à entrega aos inimigos, enquadrando a queda de Sião como juízo e permissão divinos, e não como vitória autônoma da Babilônia.
- issue: Por que os utensílios do templo foram escondidos
  choice: Os objetos sagrados são ocultados para não ficarem expostos aos inimigos e para limitar sua pretensão de triunfo sobre o Altíssimo.
  alternative: A ocultação foi apenas uma medida comum para impedir o saque, ou a expressão designa genericamente bens valiosos.
  rationale: A sequência liga a ocultação à proibição da vanglória inimiga; ainda assim, a tradução não explicita além do texto a finalidade teológica e mantém apenas “para que não fossem vistos”.
- issue: Fragmentação da frase inicial
  choice: Preservar a abertura incompleta com reticências e marcar a dificuldade textual em nota.
  alternative: Completar a frase com “subir contra a cidade” e acrescentar uma interpelação aos irmãos, conforme reconstruções ou versões tradicionais.
  rationale: O texto siríaco fornecido é degradado nessa passagem e não contém com segurança os elementos suplementares. A tradução evita introduzi-los no corpo do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” para o plural e vocabulário bíblico corrente sem arcaísmos desnecessários. A sintaxe fragmentária da abertura foi mantida deliberadamente, pois reflete uma dificuldade real do testemunho siríaco.
