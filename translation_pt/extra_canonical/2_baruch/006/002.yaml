base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/006/002.yaml
  text: And behold, suddenly a spirit of strength lifted me up and carried me above the wall of Jerusalem; and I saw four angels standing at the four corners of the city, each one holding a flaming torch in his hands.
translation:
  language: pt
  text: E eis que, de repente, um espírito de poder me ergueu e me levou acima da muralha de Jerusalém. Vi quatro anjos em pé nos quatro cantos da cidade, cada um segurando nas mãos uma tocha em chamas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “cada um segurando uma lâmpada de fogo nas mãos”.'
    reason: O termo siríaco admite a imagem de lâmpada ou tocha; a alternativa conserva uma formulação mais literal da qualificação ígnea.
lexical_decisions:
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: um espírito de poder
  rationale: Reproduz a ideia de força ou poder do sintagma siríaco sem identificar indevidamente o espírito nem acrescentar uma interpretação teológica.
- source_word: ܠܡܦܝܕܐ
  choice: uma tocha em chamas
  rationale: O substantivo pode designar lâmpada ou tocha; no contexto da cena de juízo e à luz da qualificação ígnea preservada na tradição textual, “tocha em chamas” comunica naturalmente a imagem em português.
- source_word: ܥܠ ܐܪܒܥܬܝܗܝܢ ܙܘܝ̈ܬܗ̇ ܕܡܕܝ̣ܢܬܐ
  choice: nos quatro cantos da cidade
  rationale: Tradução direta e idiomática da localização dos quatro anjos.
theological_decisions:
- issue: Identidade do “espírito de poder”
  choice: 'Manter a expressão indefinida: “um espírito de poder”'
  alternative: “o Espírito de poder” ou “o Espírito Santo”
  rationale: O texto não identifica explicitamente o espírito; empregar artigo definido ou nomeá-lo como Espírito Santo resolveria uma ambiguidade que deve permanecer.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. “E eis que” preserva a marca enfática da visão; “em pé” evita uma leitura meramente posicional de “estavam”.
