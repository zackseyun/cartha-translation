base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/006/001.yaml
  text: And it happened on the next day that, behold, the forces of the Chaldeans surrounded the city. And at evening time I, Baruch, left the people, and I went out and stood by the oak, and I was grieving over Zion and lamenting over the captivity that had come upon the people. And I was filled with a spirit of strength, and I was lifted up on high above the square of Jerusalem. And I saw, behold, four angels standing at the four corners of the city, each of them holding a torch.
translation:
  language: pt
  text: No dia seguinte, as forças dos caldeus cercaram a cidade. Ao entardecer, eu, Baruque, afastei-me do povo, saí e pus-me em pé junto ao carvalho, entristecido por Sião e lamentando o cativeiro que havia sobrevindo ao povo. Então fui cheio de um espírito de força e elevado às alturas, acima da praça de Jerusalém. E vi quatro anjos em pé nos quatro cantos da cidade, cada um segurando uma tocha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܐ ܕܡܚܪ
  choice: No dia seguinte
  rationale: Expressa de modo natural o marcador temporal siríaco e preserva a sequência narrativa.
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  choice: as forças dos caldeus
  rationale: O texto da página está corrompido, mas o testemunho de controle sustenta o sentido militar e a identificação dos caldeus; “forças” evita impor a ideia de uma única unidade militar.
- source_word: ܘܐܬܬܙܝܥܝ ... ܒܟܝܐ
  choice: entristecido ... e lamentando
  rationale: Mantém o paralelismo entre a aflição interior e sua expressão em lamento.
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: um espírito de força
  rationale: Segue de perto a expressão siríaca sem transformá-la em uma fórmula teológica posterior.
- source_word: ܫܘܩܐ ܕܐܘܪܫܠܡ
  choice: a praça de Jerusalém
  rationale: O termo pode indicar rua ou espaço de mercado; “praça” é adequado à visão panorâmica sem restringir o local a um mercado.
- source_word: ܠܡܦܝܕܐ
  choice: uma tocha
  rationale: A imagem do instrumento de fogo nas mãos dos anjos é comunicada com mais precisão por “tocha” do que por “lâmpada”.
