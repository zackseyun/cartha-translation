translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O marcador demonstrativo enfático equivalente a “eis” não foi reproduzido mecanicamente nas duas ocorrências, para evitar artificialidade, mas a vividez da visão foi preservada por “E vi”. O nome foi grafado “Baruque”, forma portuguesa corrente.
