base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/004.yaml
  text: And it shall be that, after that appointed day has passed, afterward the forms of those who are condemned will be changed, and also the glory of those who are justified.
translation:
  language: pt
  text: E acontecerá que, depois de passar aquele dia determinado, serão então transformadas as formas dos que foram condenados, bem como a glória dos que foram declarados justos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܘ ܝܘܡܐ
  choice: aquele dia determinado
  rationale: O demonstrativo definido aponta para o dia já mencionado no contexto; “determinado” expressa seu caráter designado sem acrescentar uma data ou agente não explícitos.
- source_word: ܕܡܘ̈ܬܐ
  choice: as formas
  rationale: O termo pode indicar formas, aparências ou configurações visíveis. “Formas” preserva a linguagem da transformação corporal e evita restringi-la apenas ao rosto ou semblante.
- source_word: ܕܐܙܕܩܘ
  choice: dos que foram declarados justos
  rationale: O passivo do radical ligado à justiça admite a ideia de serem considerados ou reconhecidos como justos. A formulação mantém o caráter passivo sem impor uma leitura confessional específica.
theological_decisions:
- issue: Sentido de serem ‘justificados’ ou ‘declarados justos’
  choice: foram declarados justos
  alternative: foram justificados
  rationale: “Declarados justos” comunica com clareza o valor passivo e judicial possível do siríaco, mas não especifica o fundamento nem o mecanismo dessa declaração.
- issue: Alcance do verbo ‘ser transformado’
  choice: aplica-se tanto às formas dos condenados quanto à glória dos declarados justos
  alternative: aplica-se expressamente apenas às formas dos condenados
  rationale: A coordenação elíptica do texto faz da glória o segundo sujeito do mesmo predicado, como também entende a camada inglesa auditada.
translation_notes:
  register: Português moderno, corrente e digno, com construção clara para leitores brasileiros e compreensão internacional. Conservou-se a solenidade escatológica sem arcaísmos desnecessários.
