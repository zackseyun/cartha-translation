base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/018.yaml
  text: For they chose for themselves this present time, which cannot pass apart from anguish, and they chose for themselves that time whose outcomes are full of groanings and evils; and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they might not come to the honor of which I told you before.
translation:
  language: pt
  text: Pois escolheram para si este tempo presente, que não pode passar sem angústia, e escolheram para si aquele tempo cujos desfechos estão cheios de gemidos e males. Rejeitaram o mundo que não envelhece os que entram nele[a] e rejeitaram o tempo da glória, para não chegarem à honra da qual já falei a você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não faz envelhecer os que chegam a ele”.'
    reason: Explicita numa formulação portuguesa alternativa o valor transitivo do verbo e preserva a possibilidade de traduzir o movimento como “chegar” em vez de “entrar”.
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: mundo
  rationale: Preserva o sentido de era ou ordem de existência no contexto escatológico, mantendo a formulação tradicional e inteligível em português.
- source_word: forma verbal causativa/transitiva ligada a envelhecer
  choice: não envelhece os que entram nele
  rationale: 'Mantém a transitividade do siríaco: esse mundo não causa o envelhecimento de seus habitantes. Evita a leitura intransitiva segundo a qual seria o próprio mundo que não envelhece.'
- source_word: ܐܘܠܨܢܐ
  choice: angústia
  rationale: Expressa aflição ou tribulação de maneira natural e digna, sem restringir o termo a sofrimento físico.
- source_word: ܫܘܒܚܐ
  choice: glória
  rationale: Equivalente corrente para esplendor, glória ou honra no contexto escatológico; distingue-se da honra mencionada na oração final.
theological_decisions:
- issue: Natureza imperecível do mundo futuro
  choice: o mundo que não envelhece os que entram nele
  alternative: o mundo que não envelhece para os que entram nele
  rationale: A construção foi mantida como transitiva, refletindo a ideia de que o mundo futuro preserva do envelhecimento aqueles que nele entram, sem transformar a frase numa afirmação apenas sobre a duração do próprio mundo.
- issue: Relação entre escolha humana e destino escatológico
  choice: escolheram para si... rejeitaram
  alternative: foi-lhes escolhido... foram rejeitados
  rationale: Conserva a agência humana expressa no texto de consulta e a tensão entre a escolha presente e suas consequências futuras, sem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “escolheram para si” e “rejeitaram” foi preservada por seu efeito retórico. O marcador [a] aparece no texto principal.
