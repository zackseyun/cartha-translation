  text: For the first will receive the last, whom they were expecting, and the last those they had heard had passed away.
translation:
  language: pt
  text: Pois os primeiros receberão os últimos, por quem esperavam, e os últimos receberão aqueles de quem tinham ouvido que haviam partido.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aqueles que, segundo tinham ouvido, haviam partido”.'
    reason: Registra uma possível reprodução mais próxima da construção relativa siríaca, embora menos natural em português.
lexical_decisions:
- source_word: ܢܩܒܠܘܢ
  choice: receberão
  rationale: Preserva o sentido direto do verbo siríaco e o paralelismo entre os dois grupos.
- source_word: ܩܕܡܝܐ / ܠܐܚܪ̈ܝܐ
  choice: os primeiros / os últimos
  rationale: Mantém a oposição temporal ou ordinal do texto sem identificar além do que a fonte permite.
- source_word: ܕܡܣܟܝܢ ܗܘܘ ܠܗܘܢ
  choice: por quem esperavam
  rationale: Expressa naturalmente em português a expectativa dirigida às pessoas mencionadas.
- source_word: ܐܬܦܨܝܘ
  choice: haviam partido
  rationale: Neste contexto, o verbo indica que essas pessoas haviam deixado o mundo de aflição; “partido” preserva a referência respeitosa à morte sem torná-la mais explícita que o texto.
theological_decisions:
- issue: Identidade dos “primeiros” e dos “últimos”
  choice: Manter os termos sem explicação interpretativa
  alternative: Identificá-los explicitamente como gerações anteriores e posteriores dos justos
  rationale: O versículo não fornece sozinho uma identificação inequívoca, e a tradução não deve resolver silenciosamente essa tensão.
- issue: Destino daqueles que “haviam partido”
  choice: Usar “haviam partido”
  alternative: Usar “haviam morrido” ou “tinham sido libertos”
  rationale: A formulação conserva a ligação contextual com a saída deste mundo sem impor uma leitura doutrinária específica do estado dos mortos.
