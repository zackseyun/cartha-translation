base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/007.yaml
  text: then their splendor will be glorified in transformations, and the form of their faces will be changed into the light of their beauty, so that they may acquire and receive the world that does not die, which is promised to them.
translation:
  language: pt
  text: Então eles despertarão em esplendores, e a forma de seus rostos será iluminada pela luz de sua honra, para que sejam glorificados, tomem posse e recebam o mundo que não morre. Essas coisas lhes estão prometidas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܥܝܪ ... ܒܫܘܒ̈ܚܐ
  choice: despertarão em glória
  rationale: A leitura direta do siríaco fornecido aponta para o verbo “despertar” e para “glória/esplendor”. O singular coletivo “glória” evita o pouco natural “em glórias” sem apagar a imagem.
- source_word: ܬܬܢܗܪ
  choice: resplandecerá
  rationale: O verbo expressa iluminação ou brilho; “resplandecerá” comunica isso em português digno e corrente.
- source_word: ܨܘܪܬܗܘܢ ܕܐܦܝ̈ܗܘܢ
  choice: a forma de seus rostos
  rationale: Mantém a formulação antropomórfica do texto e a referência plural aos rostos.
- source_word: ܢܘܗܪܐ ܕܐܝܩܪܗܘܢ
  choice: a luz de sua honra
  rationale: Traduz de modo distinto os campos semânticos de luz e honra/glória, evitando repetir automaticamente “glória” para ambos.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ
  choice: o mundo que não morre
  rationale: Preserva a personificação e a formulação concreta do original, em vez de substituir por uma abstração como “mundo eterno”.
- source_word: ܗ̇ܢܝܢ ܡܠܝܢ ܠܗܘܢ
  choice: Essas coisas lhes estão prometidas
  rationale: Conserva o demonstrativo plural como uma frase independente, abrangendo as bênçãos mencionadas, em vez de restringir a promessa apenas ao “mundo”.
theological_decisions:
- issue: Natureza da transformação dos justos
  choice: Preservar as imagens de despertar, resplandecer e receber o mundo imortal sem explicá-las como uma doutrina sistemática específica.
  alternative: Interpretar explicitamente a passagem como descrição técnica de um corpo glorificado ou angelical.
  rationale: O versículo usa linguagem visionária e metafórica; a tradução não deve impor uma construção confessional mais precisa do que o texto.
- issue: Valor de ܕܢܫܒܚܘܢ
  choice: “para que sejam glorificados”
  alternative: “para que glorifiquem” ou omitir a expressão, como na camada inglesa.
  rationale: No contexto, a glorificação dos justos se harmoniza com a sequência de brilho, honra e recepção do mundo imperecível; a formulação mantém a tensão verbal sem introduzir um objeto não expresso para “glorifiquem”.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. “Tomem posse e recebam” preserva a duplicação verbal do siríaco. A nota [a] está marcada no texto principal.
