review_pass:
  verdict: revise
  source_fidelity: O siríaco apresentado traz explicitamente a imagem de despertar (ܢܬܬܥܝܪ) «em esplendores/glórias» e, em seguida, diz que a forma/aparência dos rostos será iluminada (ܬܬܢܗܪ) pela luz de sua honra. Portanto, «despertarão» é apropriado, mas a nota trata como mera alternativa uma leitura que não corresponde ao texto siríaco fornecido e introduz «será glorificado em transformações», formulação da trilha inglesa que não é a redação deste trecho-fonte. «Resplandecerá com» é possível, porém menos próximo do passivo de iluminação.
  naturalness: A revisão conserva um português moderno e solene. «Será iluminada pela luz» reproduz a imagem com clareza; embora haja repetição de «luz», ela pertence à formulação visionária do original. «Em esplendores» preserva o plural sem produzir uma construção excessivamente opaca.
  terminology: «Honra» é uma boa tradução de ܐܝܩܪܐ neste contexto e deve permanecer distinta de «esplendores». «Mundo que não morre» preserva a expressão concreta para o mundo imperecível. A voz passiva em «sejam glorificados» mantém a ambiguidade verbal sem acrescentar agente ou interpretação doutrinária.
  issues:
  - severity: medium
    issue: A nota [a] apresenta «seu esplendor será glorificado em transformações» como leitura possível.
    rationale: Essa formulação não é uma variante justificável a partir da unidade siríaca fornecida, que contém «despertarão em esplendores» e «será iluminada». A nota cria uma alternativa textual indevida e conflita com a própria fundamentação lexical do rascunho.
  - severity: low
    issue: «A forma de seus rostos resplandecerá com a luz» suaviza duas escolhas sintáticas do siríaco.
    rationale: O texto diz mais precisamente que a forma/aparência dos rostos «será iluminada pela luz». A revisão torna essa relação passiva e instrumental explícita.
  revised_text: Então eles despertarão em esplendores, e a forma de seus rostos será iluminada pela luz de sua honra, para que sejam glorificados, tomem posse e recebam o mundo que não morre. Essas coisas lhes estão prometidas.
  revised_footnotes: []
  revision_rationale: Remove-se a nota não sustentada pelo siríaco apresentado. Ajustam-se «em glória» para «em esplendores» e «resplandecerá com» para «será iluminada pela luz», a fim de refletir o plural de ܫܘܒ̈ܚܐ e o verbo passivo de iluminação, sem alterar a ambiguidade da sequência sobre glorificação e recepção do mundo imperecível.
