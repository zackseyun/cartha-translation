review_pass:
  verdict: revise
  source_fidelity: A redação principal preserva vários elementos do siríaco apresentado (despertar, luz, honra, o mundo que não morre e a promessa), mas a nota [a] eleva uma formulação divergente a «outra leitura possível» sem base suficiente no texto-fonte fornecido. Além disso, «Então eles despertarão» deixa sem expressão o sujeito/imagem plural «seus esplendores», e «para que sejam glorificados» é uma interpretação passiva menos direta da construção verbal preservada no contexto.
  naturalness: O português é claro e solene. «Seus esplendores despertarão em glória» é um pouco incomum, mas conserva deliberadamente a imagética visionária; «em esplendores» reflete melhor o plural do original. «Será iluminada» traduz com maior proximidade o verbo de iluminação do que «resplandecerá com».
  terminology: «Honra» para o termo de dignidade/glória é defensável; «a luz de sua honra» mantém a distinção entre luz e honra. «O mundo que não morre» preserva adequadamente a expressão concreta e não deve ser substituído por «vida eterna».
  issues:
  - severity: medium
    issue: A nota [a] apresenta «seu esplendor será glorificado em transformações» como leitura possível.
    rationale: O siríaco exibido traz a imagem de despertar e iluminação; a formulação da nota reflete a trilha inglesa divergente, cuja revisão automática declara basear-se em outra identificação textual. Sem testemunho ou variante especificada, a nota não deve criar uma alternativa textual.
  - severity: medium
    issue: O sujeito «eles» não explicita «seus esplendores».
    rationale: O texto-fonte contém a imagem plural de esplendores/glórias despertando; explicitá-la evita a perda dessa imagem e torna o antecedente menos vago.
  - severity: low
    issue: «Resplandecerá com a luz» é menos próximo da construção de iluminação.
    rationale: O verbo siríaco exprime ser iluminado/brilhar; «será iluminada pela luz» mantém a relação verbal e instrumental com mais clareza.
  revised_text: Então seus esplendores despertarão em esplendores, e a forma de seus rostos será iluminada pela luz de sua honra, para que sejam glorificados e adquiram e recebam o mundo que não morre. Essas coisas lhes são prometidas.
  revised_footnotes: []
  revision_rationale: A revisão segue prioritariamente o siríaco fornecido, preservando a linguagem visionária de esplendores que despertam, a iluminação da forma dos rostos, a honra, a dupla ação de adquirir e receber, e o mundo imperecível. Remove-se a nota que introduzia, sem apoio textual documentado no material apresentado, uma formulação alternativa derivada de uma trilha inglesa divergente. A expressão «sejam glorificados» conserva, sem especificação doutrinária adicional, o valor contextual da cláusula verbal antes de «adquiram e recebam».
