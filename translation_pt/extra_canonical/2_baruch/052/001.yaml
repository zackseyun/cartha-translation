base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/001.yaml
  text: For the earth will then certainly give back the dead whom it now receives in order to preserve them, changing nothing in their form; but as it received them, so it will restore them, and as I delivered them to it, so it will raise them.
translation:
  language: pt
  text: Pois então a terra certamente devolverá os mortos que agora recebe para guardá-los, sem mudar em nada a forma deles; mas, assim como os recebeu, assim os restituirá; e, assim como eu os entreguei a ela, assim também os ressuscitará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܦܩܢܗ
  choice: devolverá
  rationale: O verbo descreve a terra fazendo sair e devolvendo os mortos que havia recebido; “devolverá” ressalta a restituição sem apagar a imagem concreta.
- source_word: ܒܨܘܪܬܗܘܢ
  choice: a forma deles
  rationale: “Forma” preserva a amplitude do termo e a ênfase na continuidade reconhecível, sem especificar indevidamente os mecanismos da ressurreição.
- source_word: ܡܩܝܡܐ
  choice: ressuscitará
  rationale: No contexto explícito dos mortos devolvidos pela terra, o verbo “levantar” tem sentido de ressurreição; “ressuscitará” o comunica com naturalidade e precisão em português.
- source_word: ܕܬܢܛܪ ܐܢܘܢ
  choice: para guardá-los
  rationale: 'A oração expressa finalidade: a terra recebe os mortos para conservá-los sob sua guarda até devolvê-los.'
- source_word: ܡܦܩܐ ܠܗܘܢ
  choice: os restituirá
  rationale: A escolha mantém a ideia de fazer sair e devolver no mesmo estado em que foram recebidos, ao mesmo tempo que evita repetição excessiva de “devolver”.
theological_decisions:
- issue: Continuidade entre os mortos recebidos pela terra e as pessoas ressuscitadas
  choice: Manter a repetição de receber, restituir e ressuscitar, junto com a afirmação de que a forma não é mudada.
  alternative: Interpretar a passagem como ressurreição puramente espiritual ou definir em detalhes a composição do corpo ressuscitado.
  rationale: O texto enfatiza continuidade de identidade e forma reconhecível, mas não explica os mecanismos da ressurreição; a tradução conserva essa tensão sem impor uma formulação doutrinária posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção paralela “assim como... assim...” foi mantida para reproduzir a cadência enfática do siríaco.
