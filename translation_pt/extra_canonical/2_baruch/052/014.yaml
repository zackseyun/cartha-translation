translation:
  language: pt
  text: Então, os justos aparecerão numa forma superior à dos anjos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aparecerão numa semelhança maior que a dos anjos”. O termo siríaco também pode significar “aspecto” ou “aparência”.'
    reason: Preserva a amplitude semântica de ܕܡܘܬܐ e a concisão incomum da comparação no original.
lexical_decisions:
- source_word: ܡܬܚܙܝܐ
  choice: aparecerão
  rationale: O verbo siríaco exprime aquilo que se torna visível ou aparece; a forma portuguesa mantém esse sentido sem reduzi-lo a uma qualidade abstrata.
- source_word: ܒܕܡܘܬܐ
  choice: numa forma
  rationale: ܕܡܘܬܐ pode indicar semelhança, aspecto ou forma. “Numa forma” é natural no contexto da transformação dos justos e preserva a amplitude do termo.
- source_word: ܝܬܝܪ ܡܢ ܕܡܠܐܟ̈ܐ
  choice: superior à dos anjos
  rationale: A construção comparativa significa literalmente “mais que a dos anjos”; “superior” fornece em português o complemento qualitativo implícito sem especificar indevidamente em que consiste essa superioridade.
theological_decisions:
- issue: Natureza da superioridade dos justos em relação aos anjos
  choice: superior à dos anjos
  alternative: mais gloriosa que a dos anjos
  rationale: O siríaco afirma a comparação, mas não contém aqui um termo explícito para “gloriosa”. A tradução evita definir a superioridade como glória, natureza ou posição.
- issue: Sujeito implícito da oração
  choice: os justos
  alternative: eles
  rationale: O contexto anterior trata dos que foram justificados e salvos. Explicitar “os justos” elimina uma referência pronominal obscura sem acrescentar uma doutrina ausente do contexto.
translation_notes:
  register: Português moderno, claro e digno. A formulação conserva a imagem concreta de uma forma ou aparência transformada, em vez de seguir a abstração “excelência” da camada inglesa.
