  yaml_path: translation/extra_canonical/2_baruch/052/008.yaml
  text: But they will especially be confounded—those who rejected the law and stopped their ears so as not to hear wisdom and not to receive understanding—
translation:
  language: pt
  text: Mas ficarão especialmente consternados aqueles que rejeitaram minhas leis e taparam os ouvidos para não ouvir a sabedoria nem acolher o entendimento —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܙܝܥܘܢ
  choice: ficarão consternados
  rationale: O verbo exprime forte abalo ou perturbação; “ficarão consternados” preserva a intensidade sem restringir o sentido a mera confusão intelectual.
- source_word: ܢܡܘܣܝ̈
  choice: minha Lei
  rationale: O substantivo significa “lei”; o sufixo de primeira pessoa singular requer “minha”. A inicial maiúscula sinaliza a referência à Lei divina no contexto.
- source_word: ܐܣܠܝܘ
  choice: rejeitaram
  rationale: Representa o sentido de desprezar, repudiar ou considerar vil, em português claro e natural.
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: taparam os ouvidos
  rationale: Mantém a imagem corporal do siríaco e soa idiomático em português.
- source_word: ܚܟܡܬܐ
  choice: sabedoria
  rationale: Equivalente direto e tradicional, sem estreitamento interpretativo.
- source_word: ܣܘܟܠܐ
  choice: entendimento
  rationale: Abrange compreensão e discernimento; “entendimento” conserva bem a formulação paralela com “sabedoria”.
theological_decisions:
- issue: Posse divina da Lei
  choice: minha Lei
  alternative: a Lei
  rationale: O texto siríaco apresenta sufixo possessivo de primeira pessoa; omiti-lo apagaria uma informação textual e enfraqueceria a voz divina no contexto.
- issue: Natureza da reação futura
  choice: consternados
  alternative: confundidos
  rationale: O termo pode indicar agitação, perturbação ou assombro. “Consternados” conserva a dimensão afetiva e judicial sem definir indevidamente a causa ou a forma desse abalo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi ajustada para fluidez, mas o paralelismo “não ouvir... nem acolher...” e o travessão final, que indica continuação sintática no versículo seguinte, foram preservados.
