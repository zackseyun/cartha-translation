  text: 'For this is required: that it may be shown to the living that the dead have come to life, and that those who had departed have returned.'
translation:
  language: pt
  text: Pois é necessário mostrar aos vivos que os mortos voltaram à vida e que os que haviam partido retornaram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܒܥܐ
  choice: é necessário
  rationale: Expressa de modo natural a ideia de necessidade ou exigência presente no siríaco.
- source_word: ܠܡܚܘܝܘ
  choice: mostrar
  rationale: Correspondência direta e corrente para o infinitivo siríaco ‘mostrar, fazer ver’.
- source_word: ܕܚܝܘ ܡ̈ܝܬܐ
  choice: que os mortos voltaram à vida
  rationale: Traduz o sentido de ‘os mortos viveram’ em português idiomático, deixando claro o retorno da morte à vida.
- source_word: ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ ܗܘܘ
  choice: e que os que haviam partido retornaram
  rationale: 'Preserva a sequência temporal: primeiro haviam partido e depois vieram de volta; ‘retornaram’ comunica naturalmente essa relação.'
theological_decisions:
- issue: Natureza do retorno dos mortos
  choice: voltaram à vida
  alternative: reviveram / ressuscitaram
  rationale: ‘Voltaram à vida’ preserva a afirmação do texto sem introduzir terminologia teológica mais específica do que o verbo siríaco exige.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A repetição demonstrativa do contexto siríaco foi condensada sem alterar o conteúdo do versículo.
