  yaml_path: translation/extra_canonical/2_baruch/052/003.yaml
  text: And it shall be, when they recognize one another—those who now know one another—that then the appearance of those who are now condemned will become more dreadful.
translation:
  language: pt
  text: E acontecerá que, quando se reconhecerem uns aos outros — aqueles que agora se conhecem —, então a aparência dos que agora estão condenados se tornará mais terrível.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܝܕܥܘ ܚܕ ܠܚܕ
  choice: se reconhecerem uns aos outros
  rationale: Reproduz a reciprocidade da expressão siríaca e distingue o reconhecimento futuro do conhecimento presente mencionado em seguida.
- source_word: ܚܙܘܗ
  choice: a aparência
  rationale: O termo pode indicar aspecto ou aparência visível; “aparência” preserva esse sentido sem acrescentar uma transformação corporal não explicitada.
- source_word: ܐܡܝܢ
  choice: se tornará mais terrível
  rationale: A redação segue o sentido contextual preservado pela camada inglesa auditada, descrevendo o agravamento da aparência dos condenados.
theological_decisions:
- issue: Identidade e reconhecimento após a ressurreição
  choice: Manter explicitamente o reconhecimento mútuo entre os que já se conhecem
  alternative: Generalizar como simples identificação das pessoas
  rationale: O texto afirma continuidade relacional entre o conhecimento presente e o reconhecimento futuro, sem explicar sua natureza.
- issue: Condição dos condenados
  choice: “os que agora estão condenados”
  alternative: “os que foram condenados anteriormente”
  rationale: Mantém a referência temporal e judicial da leitura textual adotada sem especificar quem proferiu a condenação nem desenvolver sua doutrina.
translation_notes:
  register: Português moderno, claro e digno, com estrutura temporal próxima do siríaco. Os travessões isolam a explicação “aqueles que agora se conhecem” e evitam ambiguidade sintática.
