  yaml_path: translation/extra_canonical/2_baruch/052/010.yaml
  text: while they themselves are reckoned among the heaps of sins, and the evil of their forms wastes away still more. For first they see, and afterward they go away to be tormented.
translation:
  language: pt
  text: enquanto eles próprios são contados entre o amontoado de pecados, e a fealdade de suas formas se desfaz ainda mais. Pois primeiro veem e, depois, partem para ser atormentados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܘܡܥܐ ܕܚ̈ܛܗܐ
  choice: o ajuntamento dos pecadores
  rationale: ܓܘܡܥܐ indica reunião, conjunto ou amontoado; o contexto contrasta grupos humanos no juízo. A vocalização não marcada de ܚ̈ܛܗܐ pode permitir uma leitura ligada a “pecados”, mas “pecadores” produz a referência pessoal exigida pelo contexto sem recorrer à imagem pouco natural de “montes de pecados”.
- source_word: ܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
  choice: a fealdade de suas formas
  rationale: ܒܝܫܬܐ pode expressar maldade, condição ruim ou fealdade; aqui descreve a aparência degradada dos ímpios. ܕܡ̈ܘܬܐ, “formas/figuras”, integra o tema das formas corporais transformadas no capítulo.
- source_word: ܢܫܘܚܘܢ
  choice: se desfaz ainda mais
  rationale: O verbo comunica definhamento, dissolução ou desgaste. “Se desfaz” conserva a ideia de deterioração progressiva e soa natural em português.
- source_word: ܕܢܫܬܢܩܘܢ
  choice: para ser atormentados
  rationale: O verbo denota sofrer tormento ou suplício; a formulação passiva preserva a construção e não explicita quem executa o castigo.
theological_decisions:
- issue: Natureza da deterioração dos ímpios
  choice: Manter a referência às “formas” e à sua dissolução
  alternative: Interpretar como destruição definitiva da pessoa ou apenas como sofrimento moral
  rationale: O siríaco fala concretamente da condição ruim/fealdade das formas, mas não define aqui a ontologia nem a duração do processo; a tradução evita resolver essa tensão.
- issue: Agente do tormento
  choice: Usar a voz passiva sem identificar o agente
  alternative: Acrescentar que Deus, anjos ou outro agente os atormenta
  rationale: O texto fonte não nomeia o agente nesta frase.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e preservação do encadeamento temporal “primeiro… depois”. A tradução prioriza o siríaco e consulta a redação inglesa apenas como camada de controle.
