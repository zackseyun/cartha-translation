    reason: Preserva a ambiguidade pronominal do texto-fonte, ao mesmo tempo que torna a imagem inteligível.
  - marker: c
    text: A expressão siríaca final é obscura e pode ser entendida mais literalmente como “até que venha a sua ocasião designada”.
    reason: Sinaliza a dificuldade semântica e textual da cláusula final sem comprometer a fluência do texto principal.
  revision_rationale: A revisão torna explícita a ideia de restrição angélica expressa pelo siríaco, melhora a formulação do primeiro membro e retira da nota publicada uma referência ao processo interno de comparação com o inglês. Mantêm-se a inferência contextual de «trono», devidamente assinalada, e a cautela quanto à cláusula final obscura.
