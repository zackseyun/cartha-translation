revisions:
- from: E esse tempo já não lhes causará aflição.[a] Pois, diante deles, serão abertas as vastidões do Paraíso, e lhes será mostrada a beleza da majestade dos seres viventes que estão debaixo do trono.[b] Também lhes serão mostradas todas as hostes de anjos, que agora são mantidas sob autoridade para que não apareçam e, por ordem, permanecem em seus lugares até que chegue o tempo que lhes foi designado.[c]
  to: E o tempo já não os angustiará.[a] Pois diante deles se abrirão as vastidões do Paraíso, e lhes será mostrada a beleza da majestade dos seres viventes que estão debaixo do trono.[b] Também lhes serão mostradas todas as hostes angelicais, agora restritas para que não sejam vistas e retidas por ordem em seus lugares, até que chegue o tempo que lhes foi designado.[c]
  rationale: A revisão torna explícita a ideia de restrição angélica expressa pelo siríaco, melhora a formulação do primeiro membro e retira da nota publicada uma referência ao processo interno de comparação com o inglês. Mantêm-se a inferência contextual de «trono», devidamente assinalada, e a cautela quanto à cláusula final obscura.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:33:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem a sequência e as imagens do siríaco: o tempo deixa de afligir os justos, as extensões do Paraíso se abrem, e lhes são revelados os seres viventes e os anjos. Contudo, «mantidas sob autoridade» enfraquece ܚܒܝ̈ܫܐ/ܐܚܝܕܝܢ, que expressam mais diretamente retenção ou restrição. A formulação proposta conserva a dificuldade da cláusula final sem afirmar além do que o texto permite.'
  naturalness: O português é claro e adequado ao registro visionário. «O tempo já não os angustiará» é mais direto e idiomático do que «esse tempo já não lhes causará aflição». «Hostes angelicais» evita a concordância potencialmente ambígua de «hostes de anjos ... mantidas».
  terminology: «Paraíso», «seres viventes», «majestade» e «hostes angelicais» são escolhas apropriadas para o registro apocalíptico. «Restritas» representa melhor o vocabulário de retenção do siríaco, sem introduzir o possessivo «minha» ou «palavra» da camada inglesa.
  issues:
  - severity: medium
    issue: A retenção dos anjos é atenuada em «são mantidas sob autoridade».
    rationale: O siríaco descreve os anjos como retidos/restringidos e mantidos por ordem para não serem vistos. «Sob autoridade» pode indicar mera sujeição hierárquica e não comunica a restrição explicitada no texto.
  - severity: low
    issue: A nota a menciona a «camada inglesa» como parte do texto de rodapé.
    rationale: A nota destinada ao leitor deve explicar a variante ou dificuldade textual em si, não o processo editorial de auditoria. Isso pode ser removido sem perda de informação.
  revised_text: E o tempo já não os angustiará.[a] Pois diante deles se abrirão as vastidões do Paraíso, e lhes será mostrada a beleza da majestade dos seres viventes que estão debaixo do trono.[b] Também lhes serão mostradas todas as hostes angelicais, agora restritas para que não sejam vistas e retidas por ordem em seus lugares, até que chegue o tempo que lhes foi designado.[c]
