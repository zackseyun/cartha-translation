base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/013.yaml
  text: And that time will no longer grow old for them. For the expanses of Paradise will be spread out before them, and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the companies of the angels, who are now restrained by my word so that they are not seen, and are kept by command to stand in their places until their appointed coming.
translation:
  language: pt
  text: E o tempo já não os angustiará.[a] Pois diante deles se abrirão as vastidões do Paraíso, e lhes será mostrada a beleza da majestade dos seres viventes que estão debaixo do trono.[b] Também lhes serão mostradas todas as hostes angelicais, agora restritas para que não sejam vistas e retidas por ordem em seus lugares, até que chegue o tempo que lhes foi designado.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o tempo já não os oprimirá”.'
    reason: O verbo siríaco pode denotar apertar, oprimir ou afligir.
  - marker: b
    text: O siríaco diz literalmente “debaixo dele”; “do trono” explicita o referente entendido pelo contexto.
    reason: Preserva a ambiguidade pronominal do texto-fonte, ao mesmo tempo que torna a imagem inteligível.
  - marker: c
    text: A expressão siríaca final é obscura e pode ser entendida mais literalmente como “até que venha a sua ocasião designada”.
    reason: Sinaliza a dificuldade semântica e textual da cláusula final sem comprometer a fluência do texto principal.
lexical_decisions:
- source_word: ܠܐ ܢܥܘܩ ܐܢܘܢ ܙܒܢܐ
  choice: esse tempo já não lhes causará aflição
  rationale: O verbo siríaco expressa apertar, oprimir ou afligir. A formulação segue diretamente o texto siríaco, em vez de adotar sem ressalva a leitura interpretativa inglesa “grow old”.
- source_word: ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ
  choice: as vastidões do Paraíso
  rationale: Preserva a imagem espacial ampla do substantivo siríaco; “vastidões” é corrente e solene sem ser excessivamente técnico.
- source_word: ܫܘܦܪܐ ܕܪܒܘܬܐ ܕܚܝ̈ܐ
  choice: a beleza da majestade dos seres viventes
  rationale: Mantém a cadeia nominal e o termo apocalíptico “seres viventes”, sem reduzir ܚܝ̈ܐ simplesmente a animais ou criaturas.
- source_word: ܚܒܝ̈ܫܐ ܕܡܠܐܟ̈ܐ
  choice: hostes de anjos
  rationale: O contexto descreve coletividades angelicais mantidas fora da visão. “Hostes” conserva o registro apocalíptico e a dimensão coletiva refletida pela consulta inglesa.
- source_word: ܒܦܘܩܕܢܐ
  choice: por ordem
  rationale: Traduz o sentido direto de mandamento, ordem ou determinação, sem especificar além do texto quem profere a ordem.
- source_word: ܥܕܡܐ ܕܬܐܬܐ ܡܕܝܢܬܗܘܢ
  choice: até que chegue o tempo que lhes foi designado
  rationale: A expressão final é difícil no testemunho apresentado. Esta redação comunica a ideia contextual de uma ocasião determinada para sua manifestação, preservando-a em nota.
theological_decisions:
- issue: Identidade dos ܚܝ̈ܐ
  choice: seres viventes
  alternative: criaturas vivas
  rationale: “Seres viventes” conserva a possível referência a figuras celestiais do trono sem impor uma identificação dogmática específica.
- issue: Agente que restringe os anjos
  choice: mantidas sob autoridade
  alternative: restringidas pela minha palavra
  rationale: O siríaco fornecido não sustenta claramente o possessivo “minha” nem exige “palavra”. A tradução evita introduzir uma fala divina em primeira pessoa que o texto-fonte apresentado não explicita.
- issue: Referente de “debaixo dele”
  choice: debaixo do trono
  alternative: debaixo dele
  rationale: O pronome siríaco é contextual. “Trono” torna inteligível a imagem apocalíptica e coincide com a camada inglesa auditada, mas a inferência é assinalada em nota.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com leitura natural no Brasil. O período foi dividido para clareza, mantendo o tom visionário e as imagens apocalípticas. Evitou-se importar a formulação inglesa “pela minha palavra” onde o siríaco apresentado aponta antes para autoridade ou domínio.
