  text: By what, then, did people lose their life, and for what did those who were on the earth exchange their soul?
translation:
  language: pt
  text: Com que, então, as pessoas perderam a vida? E por que os que estavam na terra trocaram a sua alma?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܡܢܐ
  choice: Por que
  rationale: No contexto da pergunta retórica, a expressão literalmente instrumental («por meio de quê?») é traduzida de modo natural como «por que?».
- source_word: ܐܘܒܕܘ
  choice: perderam
  rationale: O verbo pode significar «fizeram perecer», «destruíram» ou «perderam»; «perderam» preserva o sentido reflexivo contextual sem tornar a frase artificial.
- source_word: ܚܝܝ̈ܗܘܢ
  choice: a vida
  rationale: O substantivo siríaco tem forma morfologicamente plural, mas pode designar a vida como realidade unitária; o singular coletivo é idiomático em português.
- source_word: ܚܠܦ
  choice: em troca de que
  rationale: A formulação conserva a imagem de troca presente na oração paralela, conforme a evidência da tradição textual refletida na camada de consulta.
- source_word: ܢܦܫܗܘܢ
  choice: a sua alma
  rationale: «Alma» mantém o paralelo intencional com «vida» e não reduz o termo a mera existência física.
theological_decisions:
- issue: Relação entre «vida» e «alma»
  choice: Manter os dois termos distintos
  alternative: Uniformizar ambos como «vida»
  rationale: A distinção preserva a tensão antropológica e o paralelismo da pergunta, sem impor que os termos sejam plenamente sinônimos nem entidades separáveis em sentido técnico.
- issue: Agência na perda da vida
  choice: «perderam a vida»
  alternative: «destruíram a própria vida»
  rationale: A opção escolhida comunica responsabilidade sem intensificar o texto com uma formulação explicitamente causativa ou suicida.
translation_notes:
  register: Português moderno, claro e digno, com formulação interrogativa natural. «Os que estavam na terra» preserva a referência histórica e coletiva sem acrescentar identificação denominacional.
