  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: pt
  text: Pois foram libertados deste mundo de aflição e depuseram o fardo das angústias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: foram libertados
  rationale: O verbo siríaco expressa ser resgatado, salvo ou liberto; “foram libertados” preserva o sentido passivo e se ajusta naturalmente à libertação deste mundo aflitivo.
- source_word: ܥܠܡܐ ܕܐܘܠܨܢܐ
  choice: mundo de aflição
  rationale: Mantém a construção nominal do siríaco e o caráter abrangente de ܐܘܠܨܢܐ, que pode denotar aflição, opressão ou tribulação.
- source_word: ܐܢܝܚܘ ܡܢܗܘܢ
  choice: depuseram
  rationale: A expressão indica fazer repousar ou retirar de si algo; “depuseram” comunica de modo digno e claro o ato de deixar o fardo.
- source_word: ܛܘܥܢܐ ܕܥܩ̈ܬܐ
  choice: o fardo das angústias
  rationale: “Fardo” conserva a metáfora de uma carga, enquanto “angústias” representa o plural de sofrimentos ou apertos.
