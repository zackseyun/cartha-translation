base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/011.yaml
  text: But for those who were delivered by their works, and for whom the law was hope, and understanding expectation, and wisdom confidence, and purity a crown,
translation:
  language: pt
  text: Mas, quanto aos que foram libertos por suas obras e aos que tinham a Lei como esperança, o entendimento como confiança e expectativa, e a sabedoria como força[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siríaco impresso repete «Lei» e apresenta uma disposição irregular dos termos seguintes. A tradução segue o paralelismo mais provável; a sequência preservada inclui «entendimento, confiança, expectativa; sabedoria, força».
    reason: Registra a duplicação e a ordem irregular do texto-fonte sem omitir termos nem introduzir uma leitura não atestada no siríaco fornecido.
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: foram libertos
  rationale: O verbo passivo denota ser salvo, livrado ou libertado; “foram libertos” preserva a ação recebida sem explicitar um agente.
- source_word: ܒܥ̈ܒܕܝܗܘܢ
  choice: por suas obras
  rationale: Reproduz diretamente o valor instrumental da preposição e mantém a tensão teológica do texto, sem paráfrase doutrinária.
- source_word: ܢܡܘܣܐ
  choice: a Lei
  rationale: No contexto judaico da obra, refere-se à Lei; a inicial maiúscula comunica essa referência sem acrescentar uma identificação mais específica.
- source_word: ܣܒܪܐ
  choice: esperança
  rationale: Equivalente natural e direto do substantivo siríaco.
- source_word: ܣܘܟܠܐ
  choice: o entendimento
  rationale: Mantém o sentido cognitivo do termo e o paralelismo nominal.
- source_word: ܚܟܡܬܐ
  choice: a sabedoria
  rationale: Tradução formal e corrente, preservando a sequência retórica.
- source_word: ܡܚܡܣܢܘܬܐ
  choice: perseverança
  rationale: O termo exprime constância, resistência ou perseverança; esta opção é clara e digna em português.
theological_decisions:
- issue: Relação entre libertação e obras
  choice: “libertos por suas obras”
  alternative: “salvos por suas obras”
  rationale: A formulação conserva a afirmação explícita e sua tensão teológica, sem atenuá-la nem harmonizá-la com um sistema doutrinário.
- issue: Cláusula final divergente na camada inglesa
  choice: 'seguir o siríaco visível: “a sabedoria, perseverança”'
  alternative: “a pureza, uma coroa”
  rationale: A leitura alternativa não aparece no texto siríaco fornecido, que contém ܘܚܟܡܬܐ ܡܚܡܣܢܘܬܐ (“e a sabedoria, perseverança/constância”). A tradução prioriza a evidência original apresentada.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo nominal preservado. A vírgula final indica que a frase prossegue no versículo seguinte. Evitou-se a leitura “e a pureza, uma coroa”, pois ela não está atestada no trecho siríaco apresentado.
