review_pass:
  verdict: revise
  source_fidelity: O texto principal preserva corretamente «foram libertos por suas obras» e a referência à Lei. Contudo, o siríaco fornecido inclui, após «entendimento», os termos «confiança» e «expectativa», e conclui com «sabedoria, força/fortaleza»; o rascunho omite «confiança» e substitui «força» por «perseverança». A leitura inglesa «pureza, uma coroa» não é sustentada pelo trecho siríaco apresentado.
  naturalness: A redação é compreensível, mas «o entendimento, expectativa» fica sintaticamente truncado e a enumeração requer paralelismo explícito. A revisão mantém a frase em suspensão, pois ela continua no versículo seguinte.
  terminology: «Lei», «esperança», «entendimento» e «sabedoria» são adequados. «Força» traduz de modo mais direto ܡܚܡܣܢܘܬܐ neste contexto; a nota registra a disposição textual irregular sem introduzir a leitura não atestada de «pureza, uma coroa».
  issues:
  - severity: high
    issue: Omissão de «confiança» e tradução imprecisa do termo final.
    rationale: O siríaco visível traz ܣܘܟܠܐ ܬܘܟܠܢܐ ܣܘܩܒܝܐ («entendimento, confiança, expectativa») e ܘܚܟܡܬܐ ܡܚܡܣܢܘܬܐ («e sabedoria, força/fortaleza»).
  - severity: medium
    issue: A nota propõe «sabedoria, confiança» como alternativa, mas isso não corresponde à posição do termo «confiança» no siríaco fornecido.
    rationale: A nota deve descrever a irregularidade da sequência sem deslocar lexicalmente «confiança» nem sugerir «pureza, uma coroa», ausente do excerto-fonte.
  revised_text: Mas, quanto aos que foram libertos por suas obras e aos que tinham a Lei como esperança, o entendimento como confiança e expectativa, e a sabedoria como força[a],
  revised_footnotes:
  - marker: a
    text: O siríaco impresso repete «Lei» e apresenta uma disposição irregular dos termos seguintes. A tradução segue o paralelismo mais provável; a sequência preservada inclui «entendimento, confiança, expectativa; sabedoria, força».
    reason: Registra a duplicação e a ordem irregular do texto-fonte sem omitir termos nem introduzir uma leitura não atestada no siríaco fornecido.
  revision_rationale: A revisão recupera os termos «confiança» e «expectativa», traduz ܡܚܡܣܢܘܬܐ por «força» e melhora o paralelismo português. A duplicação de «Lei» no impresso é tratada em nota, em vez de ser reproduzida de forma ininteligível no texto. A vírgula final é mantida porque a construção prossegue no versículo subsequente.
