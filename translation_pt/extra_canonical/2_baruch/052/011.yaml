review_pass:
  verdict: revise
  source_fidelity: O siríaco fornecido lê ܘܚܟܡܬܐ ܡܚܡܣܢܘܬܐ, isto é, “e a sabedoria, força/fortaleza”, após “o entendimento, confiança”. Não sustenta neste ponto a leitura inglesa “e a pureza, uma coroa”. A tradução deve seguir a fonte siríaca apresentada.
  naturalness: A enumeração do rascunho é compreensível, mas a elipse de cópulas e a vírgula final tornam a relação dos pares menos clara em português. A repetição discreta de “era” preserva o paralelismo e melhora a leitura.
  terminology: “Libertos”, “obras”, “Lei”, “esperança”, “entendimento”, “confiança” e “sabedoria” são adequados. Para ܡܚܡܣܢܘܬܐ, “força” é mais direto e lexicalmente seguro do que “perseverança”; “fortaleza” também seria possível, mas é menos corrente.
  issues:
  - severity: high
    issue: A nota associa o final a “a sabedoria, confiança”, mas a confiança já corresponde ao termo precedente, ܬܘܟܠܢܐ; o último termo siríaco é ܡܚܡܣܢܘܬܐ.
    rationale: A nota desloca indevidamente a correspondência lexical e cria uma incerteza que a sequência siríaca visível não exige.
  - severity: medium
    issue: “Perseverança” estreita o sentido de ܡܚܡܣܢܘܬܐ.
    rationale: O termo denota primariamente força, vigor ou fortaleza. “Força” conserva melhor sua amplitude.
  - severity: low
    issue: A cadeia nominal sem cópulas explícitas fica pouco fluida em português.
    rationale: A explicitação de “era” mantém o paralelismo sem acrescentar conteúdo.
  revised_text: Mas aqueles que foram libertos por suas obras, e para quem a Lei era esperança, o entendimento era confiança e a sabedoria era força,
  revised_footnotes: []
  revision_rationale: 'A revisão segue a sequência lexical da fonte siríaca fornecida: Lei—esperança; entendimento—confiança; sabedoria—força. Remove-se a nota, pois sua alternativa não corresponde ao último membro da sequência e a divergência da trilha inglesa não deve prevalecer sobre a fonte original apresentada. A vírgula final é mantida porque a construção prossegue no versículo seguinte no texto-fonte.'
