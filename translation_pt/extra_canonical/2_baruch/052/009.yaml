lexical_decisions:
- source_word: ܡܬܬܢܝܚܝܢ
  choice: estão em repouso
  rationale: Expressa o estado de descanso ou alívio atribuído aos justos, em linguagem natural e digna.
- source_word: ܡܫܬܒܚܝܢ
  choice: são glorificados
  rationale: Preserva a voz passiva e o sentido de receber glória, sem especificar um agente que o siríaco não explicita.
- source_word: ܥܡ ܡܢܝܘܗܝ
  choice: com os anjos
  rationale: O contexto e a tradição textual identificam o grupo acompanhante como os anjos; a formulação portuguesa mantém essa associação de modo direto.
- source_word: ܐܝܠܝܢ ܕܗܫܐ ... ܒܘܕܐ
  choice: aqueles que agora consideram como nada
  rationale: Reproduz a ideia de pessoas atualmente tidas por sem valor, sem enfraquecê-la para mera irrelevância social.
theological_decisions:
- issue: Natureza da glorificação dos justos
  choice: são glorificados com os anjos
  alternative: recebem glória entre os anjos
  rationale: A tradução conserva a associação dos justos com os anjos sem afirmar identidade de natureza entre eles.
- issue: Sentido do repouso escatológico
  choice: estão em repouso
  alternative: descansam
  rationale: A forma escolhida apresenta o repouso como estado observado, sem definir se é provisório ou definitivo.
