base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/012.yaml
  text: Wonders will appear to them in their time. For they will see that world which is now invisible to them, and that time which is now hidden from them.
translation:
  language: pt
  text: Maravilhas lhes aparecerão[a] a seu tempo, pois verão aquele mundo que agora lhes é invisível e aquele tempo que agora lhes está oculto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Maravilhas lhes serão mostradas”.'
    reason: O verbo siríaco passivo pode ser expresso como “aparecerão” ou “serão mostradas”; a nota preserva essa alternativa sem alterar o sentido.
lexical_decisions:
- source_word: ܢܬܚܙܝܢ ܠܗܘܢ ܬܡܝ̈ܗܬܐ
  choice: Coisas maravilhosas lhes serão mostradas
  rationale: O passivo de ܚܙܐ permite tanto a ideia de serem vistas/mostradas quanto a de aparecerem. A formulação escolhida é natural em português e mantém os beneficiários expressos por ܠܗܘܢ.
- source_word: ܒܙܒܢܗܝܢ
  choice: no devido tempo
  rationale: A expressão significa literalmente “em seu tempo”; “no devido tempo” comunica de modo natural a ocasião própria dessas manifestações sem impor uma cronologia mais específica.
- source_word: ܗ̇ܘ ܥܠܡܐ ܕܠܐ ܡܬܚܙܐ ܠܗܘܢ
  choice: aquele mundo que agora lhes é invisível
  rationale: Preserva o contraste escatológico entre o mundo presente e o mundo ainda não visível. “Agora” é mantido conforme a leitura contextual e a tradição textual auditada.
- source_word: ܗ̇ܘ ܙܒܢܐ ... ܕܗܘܐ ܟܣܝ ܡܢܗܘܢ
  choice: aquele tempo que agora lhes está oculto
  rationale: Expressa a leitura contextual “oculto deles”, refletida na camada inglesa auditada; o texto fornecido parece conter corrupção ou leitura gráfica incerta nessa frase.
theological_decisions:
- issue: Natureza das realidades futuras
  choice: Manter “mundo” e “tempo” como realidades que serão vistas, sem defini-las mais precisamente
  alternative: Interpretá-las explicitamente como céu, era messiânica ou estado eterno
  rationale: O siríaco conserva linguagem escatológica ampla; especificar a identidade dessas realidades importaria uma interpretação teológica não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “aquele mundo” e “aquele tempo” preserva o paralelismo do siríaco. A nota registra a ambiguidade verbal genuína sem sobrecarregar o texto principal.
