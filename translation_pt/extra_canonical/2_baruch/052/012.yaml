  verdict: revise
  source_fidelity: O siríaco diz literalmente que “maravilhas” serão vistas/aparecerão “para eles”, seguido da visão daquele mundo atualmente invisível e daquele tempo atualmente oculto. “Maravilhas lhes aparecerão” reproduz melhor a construção e evita tornar “mostrar” a leitura principal. “A seu tempo” preserva a expressão temporal sem acrescentar a nuance de conveniência ou finalidade de “no devido tempo”.
  naturalness: A redação revista é fluente em português moderno e mantém o paralelismo solene entre “aquele mundo” e “aquele tempo”.
  terminology: “Maravilhas” é mais direto e preciso que “coisas maravilhosas” para o substantivo siríaco. “Mundo”, “invisível” e “oculto” são adequados e não especificam indevidamente as realidades escatológicas.
  issues:
  - severity: medium
    issue: “Coisas maravilhosas lhes serão mostradas” põe “ser mostradas” como sentido principal.
    rationale: O passivo siríaco de “ver” admite a formulação idiomática “aparecerão”; esta representa de modo mais direto o surgimento ou a manifestação das maravilhas, enquanto “serão mostradas” introduz mais fortemente um agente mostrador não expresso.
  - severity: low
    issue: “No devido tempo” interpreta a locução temporal.
    rationale: A expressão significa “em seu tempo”/“a seu tempo”. “Devido” pode sugerir uma noção de momento determinado ou merecido que não está explicitada.
  revised_text: Maravilhas lhes aparecerão[a] a seu tempo, pois verão aquele mundo que agora lhes é invisível e aquele tempo que agora lhes está oculto.
