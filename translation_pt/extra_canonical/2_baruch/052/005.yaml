translation:
  language: pt
  text: Pois a aparência dos que agora praticam o mal se tornará pior do que é, enquanto sofrerem tormento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: a aparência deles
  rationale: O termo pode indicar forma, aspecto ou aparência; neste contexto de transformação visível, “aparência” comunica o sentido com naturalidade.
- source_word: ܒܝܫ
  choice: pior
  rationale: Preserva o valor comparativo explícito do siríaco, em vez de traduzir apenas como “má”.
- source_word: ܬܫܢܝܩܐ
  choice: tormento
  rationale: Equivalente direto e digno para sofrimento aflitivo ou punição dolorosa no contexto escatológico.
theological_decisions:
- issue: Natureza e duração do tormento
  choice: “enquanto sofrerem tormento”
  alternative: “ao sofrerem tormento”
  rationale: Mantém a relação temporal do texto sem definir a duração do tormento nem acrescentar uma doutrina específica sobre ele.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural e sem expansão interpretativa. A expressão “praticam o mal” descreve conduta habitual sem importar terminologia denominacional.
