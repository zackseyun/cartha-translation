  text: But the glory of those who were justified in their time, and those who had understanding in their life, and those who planted in their heart the root of wisdom—
translation:
  language: pt
  text: Mas a glória dos que foram justificados em seu tempo, dos que tiveram um caminho em sua vida[a] e dos que plantaram no coração a raiz da sabedoria—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tiveram um curso”, “tiveram uma direção” ou “tiveram conduta em sua vida”.'
    reason: O siríaco ܫܘܒܠܐ pode designar caminho, curso, direção ou conduta. A nota conserva essa amplitude sem acrescentar uma qualificação avaliativa ausente do texto.
lexical_decisions:
- source_word: ܬܫܒܘܚܬܗܘܢ (tešbuḥtehōn)
  choice: a glória dos
  rationale: Preserva o substantivo e sua relação genitiva com o grupo descrito, além da continuidade sintática com o versículo seguinte.
- source_word: ܐܙܕܩܘ (ʾezdaqqaw)
  choice: foram justificados
  rationale: Mantém a forma passiva/reflexiva do verbo siríaco e evita reduzi-la a uma simples qualidade moral, como «foram justos».
- source_word: ܫܘܒܠܐ (šubbālā)
  choice: seguiram um bom caminho
  rationale: O termo pode indicar caminho, curso, direção ou conduta. A formulação portuguesa comunica o sentido existencial e ético no contexto sem impor «entendimento», que não é o valor lexical mais direto.
- source_word: ܢܨܒܘ (neṣṣab/naṣṣebū)
  choice: plantaram
  rationale: Reproduz a metáfora agrícola explícita ligada à «raiz da sabedoria».
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ (ʿeqqārā d-ḥekmtā)
  choice: a raiz da sabedoria
  rationale: Equivalência direta que conserva a imagem e sua força sapiencial.
theological_decisions:
- issue: Sentido de «foram justificados»
  choice: Conservar a voz passiva
  alternative: «foram justos» ou «viveram com justiça»
  rationale: O siríaco permite uma leitura de declaração ou reconhecimento de justiça; a tradução não identifica silenciosamente o agente nem transforma o verbo em mera descrição de caráter.
- issue: Continuidade da frase
  choice: Encerrar com travessão
  alternative: Completar a oração com material do versículo seguinte
  rationale: O versículo termina como parte de uma construção que prossegue no contexto. O travessão sinaliza a suspensão sem importar palavras de outro versículo.
translation_notes:
  register: Português atual, digno e acessível, com construção paralela. «Durante a vida» evita a rigidez de «em sua vida», enquanto «no coração» preserva a imagem sem exigir o possessivo repetido.
