    rationale: A expressão pode sugerir que a ação de consolar dura para sempre. O siríaco qualifica a consolação como permanente/eterna; «consolação eterna» mantém isso de modo mais claro.
  - severity: low
    issue: Colocação «firme o coração no que lhe foi dito»
    rationale: Embora inteligível, é menos natural que «prepare o coração para o que lhe foi dito», que também corresponde bem ao imperativo siríaco de dispor/estabelecer o coração para a mensagem recebida.
  revised_text: Mas você, Baruque, prepare o coração para o que lhe foi dito e compreenda o que lhe foi mostrado, pois você tem grande consolação eterna.
