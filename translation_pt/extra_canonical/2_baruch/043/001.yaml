base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/043/001.yaml
  text: 'But you, Baruch, fix your heart on what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will not again see the evil things that are now happening.

    Therefore go and command my people, and do not stir them up, because after these things, in the times to come, many days of affection will come. And I will make known to you and speak in your understanding.'
translation:
  language: pt
  text: Mas você, Baruque, prepare o coração para o que lhe foi dito e compreenda o que lhe foi mostrado, pois você tem grande consolação eterna.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܩܢ ܠܒܟ
  choice: firme o coração
  rationale: Conserva a imagem concreta do idioma siríaco e expressa estabilidade e disposição interior em português natural.
- source_word: ܐܣܬܟܠ
  choice: compreenda
  rationale: O verbo pede entendimento atento, não apenas percepção visual.
- source_word: ܐܝܠܝܢ ܕܐܬܚܘܝ ܠܟ
  choice: o que lhe foi mostrado
  rationale: Mantém a forma passiva e a referência às revelações apresentadas a Baruque.
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ
  choice: grande consolação
  rationale: O substantivo denota consolo ou encorajamento; o singular coletivo em português comunica naturalmente sua abundância.
- source_word: ܕܒܠܥܕܡ
  choice: para sempre
  rationale: Representa a duração permanente indicada pela expressão siríaca sem transformar o consolo em uma qualidade abstrata.
theological_decisions:
- issue: Natureza da promessa feita a Baruque
  choice: Uma consolação abundante e duradoura
  alternative: Conforto apenas presente ou esperança abstrata
  rationale: A formulação siríaca combina consolação com permanência, mas este versículo não define mais precisamente sua forma ou seu cumprimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução preserva a metáfora do coração e evita incorporar ao versículo 1 as frases subsequentes do capítulo.
