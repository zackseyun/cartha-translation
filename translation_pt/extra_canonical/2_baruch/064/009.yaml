theological_decisions:
- issue: Identidade do agente da punição
  choice: por quem seria finalmente punido
  alternative: quem finalmente o puniria
  rationale: A construção passiva preserva a ênfase e a ambiguidade do agente, sem identificá-lo por inferência teológica.
- issue: Relação entre conduta, dignidade e propósito
  choice: Não porque… pois… mas para que…
  alternative: Não por ter vivido… e sim para aprender…
  rationale: Conserva explicitamente o contraste causal e final do texto, sem transformar o conhecimento futuro em arrependimento ou salvação.
