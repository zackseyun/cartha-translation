  text: Not because he had lived blamelessly, for he was not worthy, but so that from then on he might know by whom he would finally be punished.
translation:
  language: pt
  text: Não porque tivesse vivido de modo irrepreensível, pois não era digno, mas para que, daquele momento em diante, soubesse por quem seria finalmente punido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܠܐ … / blamelessly (consultation layer)
  choice: de modo irrepreensível
  rationale: Expressa uma vida sem culpa de maneira natural e digna, sem sugerir perfeição metafísica.
- source_word: worthy (consultation layer)
  choice: digno
  rationale: Preserva o juízo de merecimento presente na frase.
- source_word: punished (consultation layer)
  choice: punido
