base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/008.yaml
  text: For although his prayer was heard by the Most High, yet at last, when he was cast into the bronze horse and the bronze horse melted, it became a sign for him for the moment.
translation:
  language: pt
  text: Pois, embora sua oração tivesse sido ouvida pelo Altíssimo, por fim, quando ele foi lançado no cavalo de bronze e o cavalo de bronze se derreteu, isso se tornou para ele um sinal naquele momento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por algum tempo”.'
    reason: A expressão siríaca pode referir-se àquele momento específico ou ter um matiz de duração temporária.
lexical_decisions:
- source_word: ܐܫܬܡܥܬ ܒܥܘܬܗ
  choice: sua oração tivesse sido ouvida
  rationale: Reproduz naturalmente a construção passiva siríaca e mantém a oração como objeto da escuta divina.
- source_word: ܡܪܝܡܐ
  choice: Altíssimo
  rationale: Equivalente tradicional, claro e não sectário para o título divino siríaco.
- source_word: ܠܫܥܬܐ
  choice: apenas naquele momento
  rationale: Expressa o valor idiomático temporal — momentâneo ou temporário — em vez da leitura excessivamente literal “acerca da hora”.
- source_word: ܢܚܫܐ
  choice: bronze
  rationale: É a equivalência contextual mais provável para o metal do instrumento descrito; evita a formulação menos precisa “cobre”.
theological_decisions:
- issue: Relação entre a oração atendida e o destino posterior de Manassés
  choice: “embora ... tivesse sido ouvida ... no fim”
  alternative: “porque sua oração foi ouvida” sem contraste
  rationale: Preserva a tensão do texto entre a resposta divina à oração e o desfecho final, sem transformar a libertação momentânea em garantia de salvação definitiva.
- issue: Caráter do sinal
  choice: “apenas naquele momento”
  alternative: “acerca da hora”
  rationale: Mantém o sentido temporal e limitado da expressão siríaca sem impor uma interpretação doutrinária específica ao sinal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe fluida e repetição de “cavalo de bronze” preservada para clareza referencial. O advérbio “apenas” explicita o caráter limitado já implicado pelo idioma temporal siríaco.
