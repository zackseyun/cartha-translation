base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/002.yaml
  text: 'For he committed much impiety: he killed the righteous, twisted judgment, shed innocent blood, violated married women by force, overturned altars, abolished their offerings, and drove out the priests so that they could not minister in the sanctuary.'
translation:
  language: pt
  text: 'Pois ele cometeu muita impiedade: matou os justos, perverteu a justiça, derramou sangue inocente, violentou mulheres casadas, derrubou altares, suprimiu as ofertas e expulsou os sacerdotes, para que não servissem no santuário.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܫܥܐ / conceito siríaco de impiedade
  choice: impiedade
  rationale: Conserva o caráter moral e religioso da acusação sem restringi-la a mera ilegalidade.
- source_word: conceito siríaco de torcer o juízo
  choice: perverteu a justiça
  rationale: Expressa em português natural a corrupção deliberada do julgamento e da ordem justa.
- source_word: conceito siríaco de violação pela força
  choice: violentou mulheres casadas
  rationale: Torna explícita a violência sexual sem empregar formulação eufemística ou excessivamente gráfica.
- source_word: conceito siríaco de ministrar no santuário
  choice: servissem no santuário
  rationale: É linguagem clara e digna para o serviço sacerdotal, sem acrescentar uma especificação ritual ausente.
theological_decisions:
- issue: Natureza das acusações contra o governante
  choice: Manter em sequência tanto crimes sociais quanto profanações cultuais
  alternative: Generalizar tudo como infidelidade religiosa
  rationale: A enumeração responsabiliza o agente por injustiça, violência e ataque ao culto; condensá-la apagaria a amplitude da denúncia.
