lexical_decisions:
- source_word: ܬܪܝܢ ܫܒ̈ܛܝܢ ܘܦܠܓܗ
  choice: as duas tribos e meia
  rationale: Reproduz diretamente a expressão numérica e tribal do siríaco, de maneira natural em português.
- source_word: ܠܡܘܒܕܘ
  choice: fossem levadas para o exílio
  rationale: No contexto das tribos deportadas, expressa o sentido de remoção e perda da terra sem recorrer à formulação menos natural «levadas cativas».
- source_word: ܐܝܟ ܕܚܙܝܬ ܗܫܐ
  choice: como você acaba de ver
  rationale: Preserva a segunda pessoa singular e o valor temporal imediato de ܗܫܐ.
theological_decisions:
- issue: Identidade das duas tribos e meia
  choice: Manter apenas «as duas tribos e meia»
  alternative: Identificá-las como as tribos transjordânicas
  rationale: O versículo não as nomeia; explicitar a identificação no texto importaria informação interpretativa.
- issue: Agente do decreto e da deportação
  choice: Usar construções passivas sem identificar o agente
  alternative: Atribuir o decreto ou a deportação explicitamente a Deus ou a um rei
  rationale: O recorte textual não torna o agente inequívoco, por isso a tradução conserva essa indeterminação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A formulação conserva a referência histórica, a passiva e a ambiguidade quanto ao agente.
