  text: And the impiety of Manasseh grew so great that it removed the glory of the Most High from the sanctuary.
translation:
  language: pt
  text: E a impiedade de Manassés cresceu tanto que retirou do santuário a glória do Altíssimo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a glória do Altíssimo foi retirada do santuário”.'
    reason: Registra a alternativa passiva presente na tradição de tradução, embora a construção siríaca favoreça a leitura ativa adotada no texto.
lexical_decisions:
- source_word: ܪܘܫܥܗ ܕܡܢܫܐ
  choice: a impiedade de Manassés
  rationale: “Impiedade” expressa de modo natural e digno a maldade religiosa atribuída a Manassés, sem restringi-la a uma denominação específica.
- source_word: ܐܝܩܪܗ ܕܡܪܝܡܐ
  choice: a glória do Altíssimo
  rationale: Preserva a linguagem teológica tradicional e traduz o título divino de forma clara em português atual.
- source_word: ܒܝܬ ܡܩܕܫܐ
  choice: do santuário
  rationale: “Santuário” é a equivalência portuguesa direta e adequada ao contexto do lugar santo.
theological_decisions:
- issue: Agência na retirada da glória divina
  choice: 'A impiedade é o sujeito ativo: “retirou ... a glória”.'
  alternative: “A glória do Altíssimo foi retirada do santuário.”
  rationale: A forma verbal siríaca é ativa e concorda com o substantivo feminino que designa a impiedade; a tradução principal preserva, portanto, a forte relação causal apresentada pelo texto. A nota registra a formulação passiva tradicional sem adotá-la no corpo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. A colocação “retirou do santuário a glória” evita uma sequência pesada de complementos e mantém em destaque tanto o lugar quanto a glória divina.
