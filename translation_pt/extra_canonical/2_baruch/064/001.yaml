  text: And the ninth black waters that you saw—this is all the wickedness that was in the days of Manasseh son of Hezekiah.
translation:
  language: pt
  text: E as nonas águas negras que você viu — isto é toda a maldade que houve nos dias de Manassés, filho de Ezequias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ (leitura contextual da expressão transmitida no ciclo da visão)
  choice: águas negras
  rationale: Mantém a cor simbólica explícita e o contraste recorrente da visão entre águas claras e negras, sem reduzi-la ao sentido genérico de “escuras”.
- source_word: ܚܒܠܐ
  choice: maldade
  rationale: Neste contexto explicativo, o termo designa sobretudo o mal moral praticado no tempo de Manassés; “maldade” é natural em português e prepara a enumeração de pecados que se segue.
- source_word: ܟܠܗ
  choice: toda
  rationale: Traduz o quantificador expresso no siríaco, evitando omitir a ideia de totalidade.
- source_word: ܡܢܫܐ ܒܪ ܚܙܩܝܐ
  choice: Manassés, filho de Ezequias
  rationale: Emprega as formas portuguesas tradicionais dos nomes e explicita naturalmente a relação filial presente no texto.
theological_decisions:
- issue: Concordância do demonstrativo com a maldade simbolizada pelas águas
  choice: isto é toda a maldade
  alternative: estas são toda a maldade
  rationale: O singular apresenta as águas vistas como símbolo coletivo da maldade, concorda naturalmente com o predicativo singular e acompanha a leitura singular indicada pela tradição textual; a nota preserva a possibilidade de construção plural.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem foi levemente ajustada para soar natural sem perder a estrutura explicativa nem a linguagem simbólica do original.
