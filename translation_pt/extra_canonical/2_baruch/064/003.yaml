base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/003.yaml
  text: 'And he made an image with five faces: four looked toward the four winds, and the fifth was on top of the image, as a rival to the zeal of the Mighty One.'
translation:
  language: pt
  text: 'E ele fez uma imagem com cinco faces: quatro estavam voltadas para os quatro ventos, e a quinta ficava no alto da imagem[a], como rival do zelo do Poderoso[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “acima da imagem”.'
    reason: A expressão espacial pode indicar tanto o topo da imagem quanto uma posição acima dela.
  - marker: b
    text: 'Ou: “como se estivesse em oposição ao zelo do Poderoso”.'
    reason: Registra uma formulação alternativa que torna explícita a relação de hostilidade, embora o siríaco favoreça o substantivo “rival”.
lexical_decisions:
- source_word: ܨܠܡܐ (ṣalmā)
  choice: imagem
  rationale: Termo natural e abrangente para uma representação cultual ou estátua, sem acrescentar uma especificação ausente do texto.
- source_word: ܚܡܫܐ ܐܦ̈ܝܢ (ḥamšā appīn)
  choice: cinco faces
  rationale: Preserva diretamente a descrição numérica e física da imagem.
- source_word: ܐܪܒܥ ܪ̈ܘܚܐ (arbaʿ rūḥē)
  choice: quatro ventos
  rationale: Mantém a expressão cosmológica tradicional, que também indica as quatro direções.
- source_word: ܠܥܠ ܡܢ ܨܠܡܐ (leʿel men ṣalmā)
  choice: no alto da imagem
  rationale: No contexto de uma quinta face pertencente à mesma figura, comunica uma posição no topo sem sugerir necessariamente que estivesse separada ou pairando acima dela; a alternativa literal é registrada em nota.
- source_word: ܚܪܘܝܐ (ḥarwāyā)
  choice: rival
  rationale: Reproduz o valor nominal de rival ou adversário e expressa diretamente a afronta idólatra.
- source_word: ܛܢܢܐ ܕܚܝܠܬܢܐ (ṭnānā d-ḥayltānā)
  choice: zelo do Poderoso
  rationale: Preserva tanto a noção teológica de zelo quanto o título divino, sem substituí-lo por uma interpretação denominacional.
theological_decisions:
- issue: Natureza da oposição ao zelo divino
  choice: como rival do zelo do Poderoso
  alternative: como se estivesse em oposição ao zelo do Poderoso
  rationale: A formulação escolhida conserva a força pessoal e direta do substantivo siríaco, sem explicar além do que o texto afirma.
- issue: Título divino
  choice: o Poderoso
  alternative: o Todo-Poderoso
  rationale: “O Poderoso” corresponde mais estritamente ao título da fonte; “Todo-Poderoso” acrescentaria a ideia explícita de onipotência total.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa simples. “Ficava no alto” evita a possível impressão de que a quinta face pairava separada da imagem, enquanto as notas preservam as ambiguidades espacial e relacional.
