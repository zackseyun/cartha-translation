  text: But all those who have ruled over you, or have known you, all these shall be delivered to the sword.
translation:
  language: pt
  text: Mas todos os que governaram sobre vocês ou os conheceram — todos eles serão entregues à espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܠܛ (campo semântico presumido no trecho correspondente)
  choice: dominaram
  rationale: Preserva a ideia de exercer poder sobre alguém sem restringi-la necessariamente a um governo formal; o recorte siríaco fornecido está corrompido e não permite isolar com segurança a forma exata do versículo.
- source_word: ܝܕܥ (campo semântico)
  choice: conheceram
  rationale: Mantém a formulação ampla e potencialmente tensa do original, sem explicar se se trata de conhecimento pessoal, reconhecimento ou convivência.
- source_word: ܣܝܦܐ (equivalente lexical esperado)
  choice: espada
  rationale: Conserva a imagem tradicional e concreta de morte ou juízo pela espada.
- source_word: ܐܫܬܠܡ (equivalente verbal esperado)
  choice: serão entregues
  rationale: Reproduz a voz passiva e evita especificar quem os entrega, preservando a agência implícita.
theological_decisions:
- issue: Agente da entrega à espada
  choice: Manter a construção passiva sem nomear o agente
  alternative: Explicitar que Deus os entregará
  rationale: O texto não identifica expressamente o agente nesta frase; explicitá-lo resolveria uma ambiguidade teológica que deve ser preservada.
- issue: Sentido de “conheceram vocês”
  choice: Traduzir literalmente como “os conheceram”
  alternative: Interpretar como “os reconheceram”, “conviveram com vocês” ou “souberam de vocês”
  rationale: O alcance da expressão permanece aberto e não deve ser estreitado sem evidência textual suficiente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O plural “vocês” comunica naturalmente o destinatário coletivo; “dominaram” evita o tom excessivamente administrativo de “governaram”. Como o corpus siríaco fornecido apresenta sobreposição, corrupção e alinhamento incerto para 72:6, a redação foi mantida conservadora e próxima da evidência semântica preservada na camada inglesa auditada.
