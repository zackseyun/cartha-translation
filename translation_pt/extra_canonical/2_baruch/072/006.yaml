  verdict: revise
  source_fidelity: 'A redação segue adequadamente a camada de auditoria inglesa: preserva a coordenação alternativa (“governaram sobre vocês ou os conheceram”), o alcance coletivo (“todos eles”) e a passiva não especificada de “serão entregues à espada”. Dado o alinhamento siríaco incerto no recorte fornecido, não é seguro introduzir uma interpretação mais específica.'
  naturalness: “Dominaram vocês” é menos natural em português moderno e pode sugerir subjugação direta, em vez de governo sobre o destinatário. “Governaram sobre vocês” expressa com clareza a relação de autoridade. A repetição enfática “todos eles” torna explícito o demonstrativo coletivo atestado pela auditoria inglesa.
  terminology: “Espada” e a passiva “serão entregues” são escolhas adequadas e preservam a imagem e a agência implícita. O pronome átono “os” mantém a referência a “vocês” com registro escrito internacionalmente compreensível.
