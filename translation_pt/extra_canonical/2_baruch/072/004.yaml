translation:
  language: pt
  text: Todo povo que não conheceu Israel nem pisoteou a descendência de Jacó — esses são os que viverão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܡ̈ܐ / conceito contextual de povo ou nação
  choice: povo
  rationale: Mantém o sentido coletivo e corresponde naturalmente à referência a cada grupo humano.
- source_word: ܙܪܥܗ ܕܝܥܩܘܒ / expressão reconstruída pelo testemunho contextual
  choice: descendência de Jacó
  rationale: Transmite o valor coletivo de “semente” em português atual sem perder a referência genealógica.
- source_word: verbo com sentido de calcar ou pisar
  choice: pisoteou
  rationale: Preserva a imagem concreta de opressão violenta presente em “trampled”, sem a enfraquecer.
- source_word: verbo viver, em forma futura
  choice: viverão
  rationale: Conserva o caráter prospectivo da declaração.
theological_decisions:
- issue: Identidade dos sobreviventes
  choice: 'Manter a formulação inclusiva e condicional: povos que não conheceram Israel e não oprimiram a descendência de Jacó.'
  alternative: Restringir os sobreviventes a um grupo religioso ou étnico definido por tradição interpretativa posterior.
  rationale: O texto descreve os grupos por sua relação histórica com Israel e Jacó; não explicita uma filiação confessional adicional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção “esses são os que viverão” preserva a retomada enfática do grupo descrito. O excerto siríaco fornecido é um bloco de capítulo com segmentação incerta; por isso, a redação segue a evidência contextual disponível e a camada inglesa auditada, sem acrescentar especificações ausentes.
