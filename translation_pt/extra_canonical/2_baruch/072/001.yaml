translation:
  language: pt
  text: Mas ouça também a respeito das águas luminosas que virão no fim, depois destas águas escuras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: águas luminosas
  rationale: Preserva o contraste simbólico com as águas escuras e comunica luz, não apenas transparência.
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ
  choice: águas escuras
  rationale: Mantém a imagem cromática e apocalíptica em oposição às águas luminosas.
- source_word: ܗܠܝܢ
  choice: estas
  rationale: O demonstrativo aponta para as águas escuras imediatamente anteriores na sequência da visão.
theological_decisions:
- issue: Caráter escatológico das águas luminosas
  choice: que virão no fim
  alternative: que virão por último
  rationale: A formulação conserva a referência temporal e escatológica sem explicar além do que o versículo afirma.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros. O imperativo singular “ouça” mantém a interpelação direta; “a respeito de” preserva o tom expositivo. Não se acrescentou nota com “aquelas”, pois o demonstrativo siríaco favorece claramente “estas”.
