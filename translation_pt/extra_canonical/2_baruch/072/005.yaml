translation:
  language: pt
  text: E isso acontecerá porque, dentre todas as nações, eles serão submetidos ao teu povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܥܒܕܘܢ (sentido refletido na tradição textual)
  choice: serão submetidos
  rationale: Mantém a voz passiva e a ideia de sujeição, sem especificar além do texto quem executa a ação.
- source_word: ܡܢ ܟܠܗܘܢ ܥܡ̈ܡܐ (sentido refletido na tradição textual)
  choice: dentre todas as nações
  rationale: Expressa seleção ou distinção no interior do conjunto das nações, em vez de simples procedência.
- source_word: ܠܥܡܟ (sentido refletido na tradição textual)
  choice: ao seu povo
  rationale: Preserva o destinatário singular da fala e traduz a relação de sujeição com regência natural em português.
theological_decisions:
- issue: Agente da sujeição
  choice: Manter a construção passiva sem identificar o agente
  alternative: Explicitar que Deus os submeterá
  rationale: O enunciado não exige que o agente seja nomeado; explicitá-lo resolveria uma implicação teológica que o texto deixa gramaticalmente aberta.
- issue: Referente de “eles”
  choice: Preservar o pronome sem acrescentar um substantivo explicativo
  alternative: Substituir por “as nações” ou por outro grupo explicitado pelo contexto
  rationale: O recorte fornecido depende do contexto precedente; manter o pronome evita impor uma identificação não expressa neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A formulação conserva a relação causal, a abrangência de “todas as nações” e a passiva do enunciado.
