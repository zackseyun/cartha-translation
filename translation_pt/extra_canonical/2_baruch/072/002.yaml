base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/072/002.yaml
  text: 'This is the word: after the signs have come that were told to you before, the nations will be thrown into confusion, and the time of my Messiah will come. He will summon all the nations, and some of them he will keep alive, but others of them he will put to death.'
translation:
  language: pt
  text: 'Esta é a palavra: depois que vierem os sinais que antes te foram anunciados, as nações serão lançadas em confusão, e chegará o tempo do meu Messias. Ele convocará todas as nações; a algumas manterá vivas, mas a outras matará.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: palavra
  rationale: Preserva o sentido amplo do siríaco, aqui introduzindo a declaração profética.
- source_word: ܡܫܝܚܝ
  choice: meu Messias
  rationale: Mantém o título messiânico e o possessivo do texto, sem acrescentar identificação interpretativa.
- source_word: ܢܩܪܐ
  choice: convocará
  rationale: Expressa de modo natural o ato de chamar todas as nações para comparecerem.
theological_decisions:
- issue: Identidade do Messias
  choice: meu Messias
  alternative: meu Ungido
  rationale: “Messias” é claro ao leitor comum e conserva o título tradicional, sem especificar além do que o texto afirma.
- issue: Destino contrastante das nações
  choice: a algumas conservará com vida, mas a outras matará
  alternative: a algumas poupará, mas destruirá outras
  rationale: Preserva explicitamente o contraste entre manter vivas e causar a morte, evitando suavização ou ampliação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com construção profética fluente. O pronome “te” preserva o destinatário singular; o futuro verbal mantém a sequência escatológica.
