lexical_decisions:
- source_word: ܗܠܝܢ
  choice: estas coisas
  rationale: Mantém o demonstrativo plural e sua referência ao que acaba de ser anunciado.
- source_word: ܥܡܡ̈ܐ
  choice: nações
  rationale: Equivalente natural para o plural siríaco, adequado ao contexto coletivo e político.
- source_word: ܢܫܬܒܩܘܢ
  choice: serão poupadas
  rationale: O passivo pode significar ser deixado ou preservado; neste contexto, “ser poupado” expressa com clareza a sobrevivência das nações sem acrescentar uma ideia alheia.
theological_decisions:
- issue: Agente de quem poupa as nações
  choice: por ele
  alternative: sem explicitar o agente
  rationale: A formulação conserva o agente pronominal masculino transmitido pelo sentido contextual, sem identificar além do que o texto permite.
translation_notes:
  register: Português moderno, claro e digno. “Então” preserva a conexão conclusiva do enunciado, e a construção passiva mantém o foco do siríaco nas nações poupadas.
