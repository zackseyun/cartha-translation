  rationale: Retoma naturalmente, sem explicitação indevida, os atos perversos descritos no contexto anterior.
theological_decisions:
- issue: Referente de “o nome dele”
  choice: Manter o pronome sem substituir por “o nome de Deus”
  alternative: “o nome de Deus”
  rationale: O referente divino é claro pelo contexto, mas a forma pronominal preserva a coesão e evita explicitação interpretativa desnecessária.
- issue: Natureza da pergunta
  choice: Manter como pergunta retórica sem acrescentar negação
  alternative: “Certamente o Altíssimo não se alegra...”
  rationale: A forma interrogativa preserva a força retórica e não resolve explicitamente aquilo que o texto deixa para o leitor inferir.
