base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/067/002.yaml
  text: Or do you think there is no grief, even for the angels before the Mighty One, because Zion was handed over in this way, and because, look, the nations boast in their hearts, and they gather before their idols and say, “She who long trampled others is trampled down; she who brought others into subjection has herself been subjected”?
translation:
  language: pt
  text: 'Ou vocês pensam que não há tristeza, nem mesmo para os anjos diante do Poderoso, porque Sião foi entregue dessa maneira e porque, eis que, as nações se vangloriam em seus corações, reúnem-se diante de seus ídolos e dizem[a]: “Aquela que por muito tempo pisoteou os outros agora é pisoteada; aquela que subjugou os outros agora foi subjugada”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e as multidões diante de seus ídolos dizem”.'
    reason: A forma consonantal admite uma análise nominal alternativa, embora a leitura verbal «reúnem-se» se ajuste melhor à sequência de particípios.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: o Poderoso
  rationale: Reproduz o título divino siríaco de modo claro e digno, sem substituí-lo por um título teologicamente mais específico.
- source_word: ܡܫܬܒܗܪܝܢ (meštabhrīn)
  choice: se vangloriam
  rationale: Mantém o sentido de orgulho jactancioso atribuído às nações.
- source_word: ܡܩ̈ܢܫܐ / ܟܢܫܝܢ (leitura contextual)
  choice: reúnem-se
  rationale: A leitura verbal ativa forma uma cadeia paralela com “se vangloriam” e “dizem”; evita transformar o termo em um substantivo sem necessidade.
- source_word: ܐܫܬܠܡܘܬ / raiz šlm em contexto passivo
  choice: foi entregue
  rationale: Expressa a entrega de Sião ao poder inimigo, preservando o passivo e sem explicitar o agente.
theological_decisions:
- issue: A tristeza dos anjos diante de Deus
  choice: “não há tristeza nem mesmo entre os anjos diante do Poderoso”
  alternative: “os anjos diante do Poderoso não sofrem”
  rationale: Conserva a afirmação interrogativa e a tensão de seres celestes experimentarem tristeza, sem reinterpretá-la como mera figura de linguagem.
- issue: Agente da entrega de Sião
  choice: 'passiva sem agente: “Sião foi entregue”'
  alternative: “Deus entregou Sião”
  rationale: O texto não nomeia o agente nesta oração; explicitá-lo resolveria uma ambiguidade teológica que deve permanecer.
- issue: Correspondência retórica entre os atos de Sião e sua queda
  choice: “pisoteou... é pisoteada; sujeitou... foi sujeitada”
  alternative: variar os verbos para maior fluidez
  rationale: A repetição antitética é deliberada e deve ser preservada.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas brasileiras naturais. O plural “vocês” torna explícita a interpelação ao público no contexto, enquanto “vejam” mantém o chamado enfático à atenção. A pontuação conserva a pergunta retórica e o paralelismo solene da fala das nações.
