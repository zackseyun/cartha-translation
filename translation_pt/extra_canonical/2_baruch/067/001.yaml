  text: And the eleventh black waters that you saw—this is the calamity that has now come upon Zion.[a]
translation:
  language: pt
  text: E as décimas primeiras águas negras que você viu — esta é a calamidade que agora se abateu sobre Sião.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  choice: águas negras
  rationale: Preserva o rótulo simbólico recorrente da visão e mantém nítido o contraste estrutural entre as águas negras e as águas luminosas.
- source_word: ܫܘܚܬܐ
  choice: calamidade
  rationale: Expressa uma desgraça devastadora em registro digno e natural, sem especificar além do que o termo permite.
- source_word: ܡܛܬ ܥܠ
  choice: se abateu sobre
  rationale: Reproduz de modo idiomático a ideia de uma calamidade que veio sobre Sião, mantendo seu caráter repentino e opressivo.
theological_decisions:
- issue: Relação entre as águas simbólicas e a calamidade histórica
  choice: 'Mantida a identificação singular: “esta é a calamidade”.'
  alternative: “estas são a calamidade” ou “estas são as calamidades”.
  rationale: O demonstrativo e a cópula siríacos estão no singular e concordam com “calamidade”; as águas plurais constituem o sinal visionário, enquanto seu referente é apresentado como uma calamidade singular.
translation_notes:
  register: Português moderno, claro e solene, com “você” para o destinatário singular. A ordem “décimas primeiras águas negras” conserva a numeração da sequência visionária, e o travessão separa com clareza o símbolo de sua interpretação.
