  text: Yet after these things they will be seized by tribulation in the dispersion among the nations, and they will dwell in shame in every place.
translation:
  language: pt
  text: Mas, depois dessas coisas, eles serão tomados pela tribulação na dispersão entre as nações e viverão envergonhados em toda parte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܚܙܝܬ
  choice: serão tomados
  rationale: No contexto textual transmitido, exprime que eles serão alcançados ou dominados pela aflição; evita a antiga leitura inadequada «entenderão».
- source_word: ܒܡ̈ܢܘܬܐ
  choice: na dispersão entre as nações
  rationale: Reproduz a situação de espalhamento no meio dos povos, em linguagem portuguesa clara.
- source_word: ܒܚܣܝܪܘ
  choice: envergonhados
  rationale: Comunica a condição de desonra ou humilhação indicada pelo contexto.
- source_word: ܒܟܠ ܐܬܪ
  choice: em toda parte
  rationale: Equivalente natural e abrangente de «em todo lugar».
theological_decisions:
- issue: Agente da tribulação não explicitado
  choice: 'Construção passiva: «serão tomados pela tribulação»'
  alternative: Explicitar Deus ou as nações como agentes
  rationale: O texto não identifica expressamente um agente pessoal; a passiva preserva essa abertura.
