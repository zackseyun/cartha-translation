base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/003.yaml
  text: For the former tribes were compelled by their kings to sin, but these two tribes themselves desired to sin and compelled their kings to sin.
translation:
  language: pt
  text: Pois as primeiras tribos foram forçadas por seus reis a pecar; estas duas tribos, porém, foram as que incitaram[a] seus reis e os forçaram a pecar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “pressionaram”.'
    reason: O verbo siríaco ܚܨܘ admite a ideia de impelir ou exercer pressão; a alternativa registra essa nuance lexical.
lexical_decisions:
- source_word: ܫܪ̈ܒܬܐ ܩܕ̈ܡܝܬܐ
  choice: as primeiras tribos
  rationale: Reproduz diretamente a referência às tribos anteriores, em contraste com as duas tribos mencionadas na segunda oração.
- source_word: ܐܬܐܠܨܘ
  choice: foram forçadas
  rationale: O verbo passivo expressa coação exercida pelos reis sobre as primeiras tribos.
- source_word: ܕܚܨܘ
  choice: incitaram
  rationale: No texto siríaco fornecido, o verbo indica impelir, instigar ou pressionar, não simplesmente desejar; “incitaram” preserva o contraste entre as tribos coagidas por seus reis e as tribos que impeliram seus reis.
- source_word: ܘܐܠܨܘ ܠܡܠܟܝ̈ܗܘܢ ܕܢܚܛܘܢ
  choice: seus reis e os forçaram a pecar
  rationale: Explicita em português o objeto compartilhado e o complemento final, evitando a leitura equivocada de que as próprias tribos seriam o sujeito de “pecar” nesta oração.
theological_decisions:
- issue: Responsabilidade relativa das tribos e dos reis
  choice: Manter o contraste entre as primeiras tribos, coagidas pelos reis, e as duas tribos, que incitaram e coagiram seus reis.
  alternative: Suavizar a segunda oração como mero desejo das duas tribos de pecar.
  rationale: A redação siríaca apresentada atribui às duas tribos uma atuação direta sobre seus reis; essa tensão moral deve permanecer sem harmonização.
translation_notes:
  register: Português atual, claro e digno, com sintaxe contrastiva natural. A repetição de “seus reis” foi mantida para deixar inequívoca a inversão de responsabilidade entre as duas metades do versículo.
