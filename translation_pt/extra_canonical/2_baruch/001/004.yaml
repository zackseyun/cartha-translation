  verdict: revise
  source_fidelity: 'A tradução principal corresponde bem ao siríaco: Deus traz calamidade sobre a cidade e seus habitantes, a cidade é removida de diante dele por um tempo, e o povo é disperso entre as nações para lhes servir. A nota, porém, introduz como alternativa uma leitura de “permanecer entre as nações” que não é sustentada pela forma siríaca transmitida nem pelo controle inglês mais recente, que identifica explicitamente “servos às nações” como o sentido da oração final.'
  naturalness: O português é claro, moderno e de registro adequadamente solene. “Por algum tempo” é natural e preserva a indefinição temporal do texto.
  terminology: “Calamidade” transmite adequadamente o sentido judicial de ܒܝܫܬܐ sem implicar maldade moral. “Sirva às nações” comunica a sujeição/serviço expressa no final do versículo.
  issues:
