base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/004.yaml
  text: Therefore behold, I am bringing evil upon this city and upon its inhabitants, and it will be removed from before me for a time, and I will scatter this people among the nations, that they may be servants to the nations.
translation:
  language: pt
  text: Por isso, eis que trarei calamidade sobre esta cidade e seus habitantes. Ela será retirada da minha presença por algum tempo, e espalharei este povo entre as nações, para que sirva às nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܬܐ (bīštā)
  choice: calamidade
  rationale: No contexto de juízo, o termo denota o mal que sobrevém como desgraça ou calamidade, não maldade moral praticada por Deus.
- source_word: ܘܬܬܬܪܝܡ ܡܢ ܩܕܡܝ (w-tettrīm men qdamay)
  choice: Ela será retirada da minha presença
  rationale: Preserva a imagem passiva de a cidade ser removida de diante de Deus, sem explicitar além do texto se isso significa rejeição, destruição ou abandono.
- source_word: ܡܒܕܪ (mbaddar)
  choice: espalharei
  rationale: Expressa diretamente a dispersão do povo entre outras nações.
- source_word: ܕܠܥܡܡ̈ܐ ܢܘܬܪ (d-l-ʿammē newtar)
  choice: para que sirva às nações
  rationale: Segue a leitura contextual e a tradição textual que entende a oração como submissão ou serviço às nações; a redação siríaca transmitida também motivou uma leitura alternativa, registrada em nota.
theological_decisions:
- issue: Deus traz o ‘mal’ sobre a cidade
  choice: trarei calamidade
  alternative: trarei o mal
  rationale: ‘Calamidade’ comunica juízo desastroso sem sugerir que Deus pratique maldade moral, distinção sustentada pelo uso contextual do termo siríaco.
- issue: Destino do povo entre as nações
  choice: para que sirva às nações
  alternative: para que permaneça entre as nações
  rationale: A tradução principal mantém a ideia de sujeição indicada pela leitura contextual adotada, enquanto a variante lexical possível é preservada em nota, sem eliminar a tensão textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Eis que” conserva a ênfase profética do original; “por algum tempo” mantém a limitação temporal sem especificá-la.
