    issue: A nota de rodapé apresenta “permaneça entre as nações” como leitura possível.
    rationale: A oração siríaca final é entendida como “para que sejam servos às nações”. O histórico de auditoria inglesa registra que “permaneçam entre as nações” é uma tradução incorreta de ʿabdīn (“servos”) e da construção com l- (“às/para as nações”). A nota deve ser removida para não criar uma ambiguidade sem base no texto transmitido.
  revised_text: Por isso, eis que trarei calamidade sobre esta cidade e seus habitantes. Ela será retirada da minha presença por algum tempo, e espalharei este povo entre as nações, para que sirva às nações.
