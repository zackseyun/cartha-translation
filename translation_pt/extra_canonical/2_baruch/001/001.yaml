- from: 1 No vigésimo quinto ano de Jeconias, rei de Judá, a palavra do Senhor veio sobre Baruque, filho de Nerias, e ele lhe disse:[a]
  to: 1 No vigésimo quinto ano de Jeconias, rei de Judá, a palavra do Senhor veio a Baruque, filho de Nerias, dizendo:[a]
