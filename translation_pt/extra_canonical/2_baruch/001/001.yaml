base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/001.yaml
  text: In the twenty-fifth year of Jeconiah king of Judah, the word of the Lord came to Baruch son of Neriah, saying, / and He said to him,
translation:
  language: pt
  text: 1 No vigésimo quinto ano de Jeconias, rei de Judá, a palavra do Senhor veio a Baruque, filho de Nerias, dizendo:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e ele lhe disse:”.'
    reason: A oração coordenada siríaca pode ser traduzida de modo mais literal como uma nova oração; «dizendo» exprime naturalmente em português a mesma introdução da fala seguinte sem identificar de maneira explícita o sujeito do verbo.
lexical_decisions:
- source_word: ܗܘܐ ܒܫܢܬ
  choice: No ... ano
  rationale: A fórmula temporal siríaca significa literalmente “aconteceu no ano”, mas em português a abertura direta é mais natural e conserva integralmente a datação.
- source_word: ܝܘܟܢܝܐ
  choice: Jeconias
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome do rei.
- source_word: ܗܘܐ ܦܬܓܡܗ ܕܡܪܝܐ ܥܠ
  choice: a palavra do Senhor veio sobre
  rationale: Preserva a fórmula profética e o valor espacial de ܥܠ (“sobre”), sem reduzir a expressão a uma simples comunicação humana.
- source_word: ܒܪܘܟ ܒܪ ܢܪܝܐ
  choice: Baruque, filho de Nerias
  rationale: Usa formas portuguesas correntes para os nomes e traduz explicitamente a relação filial.
- source_word: ܘܐܡܪ ܠܗ
  choice: e ele lhe disse
  rationale: Reproduz a coordenação do siríaco e mantém a referência pronominal implícita, sem inserir à força um sujeito nominal ausente do texto.
theological_decisions:
- issue: Referente do sujeito implícito em “e ele lhe disse”
  choice: Manter o pronome “ele” sem explicitar o referente
  alternative: “e o Senhor lhe disse” ou “dizendo-lhe”
  rationale: O siríaco traz um verbo masculino singular sem repetir o sujeito. Explicitar “o Senhor” resolveria uma ambiguidade que o texto não resolve formalmente; “dizendo-lhe” é uma alternativa idiomática possível.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe profética reconhecível. Conservou-se “veio sobre” para refletir ܥܠ e evitou-se identificar expressamente o sujeito do último verbo.
