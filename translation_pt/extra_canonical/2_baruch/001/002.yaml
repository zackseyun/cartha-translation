base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/002.yaml
  text: “You have seen all that this people has done to me; the evil that these two tribes that remain have done is greater than that of the ten tribes that were taken captive.”
translation:
  language: pt
  text: '“Você viu tudo o que este povo fez contra mim: o mal que estas duas tribos que restaram fizeram foi maior do que o das dez tribos que foram levadas para o cativeiro.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܕ ܠܝ
  choice: fez contra mim
  rationale: Embora a construção seja literalmente ‘fez a mim’, o contexto negativo pede em português a formulação natural ‘fez contra mim’.
- source_word: ܒܝ̈ܫܬܐ
  choice: o mal
  rationale: O plural siríaco pode designar coletivamente as más ações; ‘o mal’ mantém o sentido e produz uma comparação clara e natural em português.
- source_word: ܬܪ̈ܬܝܢ ܫܪ̈ܒܢ
  choice: estas duas tribos
  rationale: Traduz diretamente a expressão demonstrativa referente às duas tribos remanescentes.
- source_word: ܕܐܫܬܚܪܝ
  choice: que restaram
  rationale: 'Expressa o valor passivo/resultativo do verbo siríaco: as tribos que permaneceram ou foram deixadas.'
- source_word: ܕܐܫܬܒܝܘ
  choice: que foram levadas para o cativeiro
  rationale: Comunica de modo claro o passivo ‘foram capturadas/levadas cativas’ no contexto do exílio das dez tribos.
theological_decisions:
- issue: Comparação moral entre as duas tribos remanescentes e as dez tribos exiladas
  choice: foi maior do que o das dez tribos
  alternative: mais do que as dez tribos
  rationale: O siríaco apresenta uma comparação elíptica. A tradução explicita apenas o elemento gramatical necessário em português, entendendo que ‘o mal’ das duas tribos é comparado ao das dez, sem acrescentar explicação teológica.
translation_notes:
  register: Português atual, digno e acessível, com tratamento direto por ‘você’. Os dois-pontos preservam a relação explicativa entre a acusação geral e sua especificação, e a comparação elíptica do siríaco é completada apenas o suficiente para soar natural.
