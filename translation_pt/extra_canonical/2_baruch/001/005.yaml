  text: And my people will be chastened, and the time will come when they will seek the prosperity of their times.”
translation:
  language: pt
  text: E o meu povo será disciplinado; então chegará o tempo em que buscarão a prosperidade de seus tempos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܬܪܕܐ
  choice: será disciplinado
  rationale: A forma passiva expressa correção ou castigo educativo; “será disciplinado” preserva essa amplitude sem sugerir apenas punição retributiva.
- source_word: ܡܘܨܠܚܘܬܗܘܢ
  choice: a prosperidade
  rationale: O substantivo denota prosperidade, êxito ou condição favorável; “prosperidade” é claro e mantém a formulação ampla.
- source_word: ܕܙܒܢܝ̈ܗܘܢ
  choice: de seus tempos
  rationale: Tradução formal da construção genitiva, preservando a expressão incomum e sua possível amplitude sem a explicar indevidamente.
theological_decisions:
- issue: Natureza da ação sofrida pelo povo
  choice: será disciplinado
  alternative: será castigado
  rationale: O siríaco permite a ideia de correção mediante sofrimento; “disciplinado” conserva a tensão entre juízo e correção, sem reduzir o sentido a punição estritamente retributiva.
- issue: Relação entre a chegada do tempo e a busca
  choice: então chegará o tempo em que buscarão
  alternative: e chegará o tempo, e buscarão
  rationale: A coordenação siríaca admite leitura temporal natural em português. A redação escolhida melhora a fluidez sem alterar a sequência dos acontecimentos.
translation_notes:
  register: Português moderno, digno e acessível, com leve formalidade bíblica. Mantém-se a expressão deliberadamente incomum “a prosperidade de seus tempos” por fidelidade à formulação siríaca.
