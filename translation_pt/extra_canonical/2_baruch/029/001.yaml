  text: And he answered and said to me, “Whatever is destined to happen at that time will happen upon the whole earth; therefore, all who live will experience[a] it.”
translation:
  language: pt
  text: 'E ele respondeu e me disse: “Tudo o que está destinado a acontecer naquele tempo acontecerá em toda a terra; por isso, todos os que vivem passarão por isso[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o perceberão” ou “o sentirão”.
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܥܬܝܕ
  choice: está destinado
  rationale: Preserva a ideia de algo que está por vir e possivelmente determinado ou preparado, sem reduzir a expressão a um simples futuro.
- source_word: ܢܪܓܫܘܢ
  choice: passarão por isso
  rationale: Neste contexto apocalíptico, o verbo indica que todos os viventes perceberão ou sentirão os acontecimentos ao serem alcançados por eles. A formulação comunica essa experiência em português natural, enquanto a nota preserva o sentido lexical mais direto.
theological_decisions:
- issue: Alcance de “toda a terra”
  choice: em toda a terra
  alternative: sobre toda a terra / em todo o país
  rationale: A expressão foi mantida sem decidir se ܐܪܥܐ designa o mundo inteiro ou uma terra específica; o contexto imediato dá alcance amplo, mas a tradução conserva a formulação tradicionalmente ambígua.
translation_notes:
  register: Português moderno, corrente e digno, com sintaxe clara e legível no Brasil. A repetição de “acontecer” reflete a estrutura enfática do siríaco, e a nota registra a amplitude semântica de ܪܓܫ.
