  text: O You who created the earth, hear me—You who established the firmament by the word, and made firm the height of heaven by the spirit[a].
translation:
  language: pt
  text: Ó tu que criaste a terra, ouve-me — tu que estabeleceste o firmamento pela palavra e firmaste as alturas do céu pelo espírito[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siríaco ruḥa pode significar “espírito” ou “sopro”; o paralelismo com “palavra” evoca o Salmo 33:6.
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܒܪܐ
  choice: que criaste
  rationale: O verbo ܒܪܐ expressa a criação da terra; a segunda pessoa preserva a invocação direta.
- source_word: ܬܩܢܬ
  choice: estabeleceste
  rationale: O Pael de ܬܩܢ comunica estabelecer, ordenar ou fixar com firmeza; “estabeleceste” conserva tanto a ideia de ordenação quanto a de estabilidade.
- source_word: ܪܩܝܥܐ
  choice: firmamento
  rationale: Termo tradicional e preciso para a expansão celeste no imaginário cosmológico bíblico, além de manter a provável ressonância do Salmo 33:6.
- source_word: ܒܡܠܬܐ
  choice: pela palavra
  rationale: ܡܠܬܐ significa “palavra” neste paralelismo sobre a ação criadora divina.
- source_word: ܫܪܪܬ
  choice: firmaste
  rationale: O verbo indica tornar firme, confirmar ou consolidar; “firmaste” reproduz diretamente a ideia e combina naturalmente com “as alturas do céu”.
- source_word: ܪܘܚܐ
  choice: espírito
  rationale: ܪܘܚܐ pode significar “espírito”, “sopro” ou “vento”. “Espírito” é adequado como referência à ação criadora divina, enquanto a nota preserva a alternativa lexical relevante.
theological_decisions:
- issue: Sentido de ܪܘܚܐ na ação criadora
  choice: espírito
  alternative: sopro
  rationale: O contexto permite ambos os sentidos. “Espírito” mantém a leitura pessoal ou teológica possível, sem excluir “sopro”, explicitado em nota; assim, não se resolve indevidamente a ambiguidade do siríaco.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com cadência de oração. A repetição de “tu” após o travessão evita ambiguidade sintática e preserva a continuidade da invocação. “As alturas do céu” traduz a construção siríaca de modo natural sem eliminar sua imagem espacial.
