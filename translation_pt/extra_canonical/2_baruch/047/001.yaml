  text: 'Depois que saí e os despedi, fui embora dali e lhes disse: “Vejam, vou para minha morada em Hebrom.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫ̇ܪܝܘ ܐܢܘܢ
  choice: os despedi
  rationale: O verbo expressa soltar ou deixar partir; no contexto de uma reunião pública, “os despedi” comunica com naturalidade o encerramento formal do encontro.
- source_word: ܠܕܝܪܝ ܠܚܒܪܘܢ
  choice: para minha morada em Hebrom
  rationale: A expressão preserva o substantivo referente a morada ou alojamento antes do topônimo, sem reduzi-la simplesmente a “para Hebrom”.
- source_word: ܗܐ
  choice: Vejam
  rationale: A partícula de apresentação chama a atenção dos ouvintes; o plural “Vejam” corresponde ao grupo a quem Baruque se dirige e soa natural em português atual.
