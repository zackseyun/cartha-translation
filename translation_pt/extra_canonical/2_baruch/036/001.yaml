  yaml_path: translation/extra_canonical/2_baruch/036/001.yaml
  text: 'When I had said these things, I fell asleep there, and in the night I saw a vision. And behold, a forest of trees planted on the plain, and high, rugged mountains surrounded it; and that forest covered a great expanse. And behold, opposite it a vine arose, and from beneath it a fountain came forth peacefully. Then that fountain came to the forest and swelled into mighty waves, and those waves submerged that forest, and suddenly uprooted the greater part of it and threw down all the mountains around it. And the height of the forest was brought low, and the tops of the mountains were lowered, and that fountain prevailed greatly, so that nothing was left of that great forest except one cedar alone. And when it had cast down and destroyed and uprooted the greater part of that forest, so that nothing remained of it and its place could no longer be recognized, then that vine came with the fountain in peace and great stillness, and it came to a place not far from that cedar, and they brought
    the cedar that had been thrown down to it. And I saw, and behold, the vine opened its mouth and said to the cedar: “Are you not that cedar which was left from the forest of wickedness, by whose means wickedness continued and was worked all those years, while goodness was not? And you kept taking what was not yours, and what was yours you never treated with compassion; and those far away you brought under your power, and those who came near you, you held fast in the snares of your evil; and you always lifted yourself up like one that could not be uprooted. But now your time has hastened, and your hour has come. So depart also, O cedar, after the forest which went before you, and become dust with it, and let your ashes be mixed together. And lie down in grief, and rest in torment until your last time comes, when you will return again and be tormented still more.”'
translation:
  language: pt
  text: 'Quando eu disse essas coisas, adormeci ali e, durante a noite, tive uma visão. E eis que havia uma floresta de árvores plantadas na planície, cercada por montanhas altas e escarpadas; e aquela floresta cobria uma vasta extensão. E eis que, diante dela, surgiu uma videira, e debaixo dela brotou uma fonte, correndo serenamente. Então a fonte foi até a floresta e avolumou-se em ondas poderosas. Essas ondas submergiram a floresta e, de repente, arrancaram pela raiz a maior parte dela e derrubaram todas as montanhas ao redor. A altura da floresta foi rebaixada, e os cumes das montanhas foram rebaixados. A fonte prevaleceu grandemente, de modo que nada restou daquela grande floresta, a não ser um único cedro. Depois de derrubar, destruir e arrancar pela raiz a maior parte daquela floresta, de modo que nada restasse dela e seu lugar já não pudesse ser reconhecido, a videira veio com a fonte, em paz e com grande quietude, até um lugar não muito distante daquele cedro; e trouxeram até ela
    o cedro que havia sido derrubado. Então vi, e eis que a videira abriu a boca e disse ao cedro: “Não é você aquele cedro que restou da floresta da maldade, por meio do qual a maldade continuou e foi praticada durante todos aqueles anos, enquanto não havia bem? Você continuava tomando o que não era seu, mas nunca tratou com compaixão aquilo que lhe pertencia. Submetia ao seu poder os que estavam longe e prendia nas armadilhas da sua maldade os que se aproximavam de você. Sempre se exaltava como quem não podia ser arrancado pela raiz. Mas agora o seu tempo se apressou, e a sua hora chegou. Portanto, vá também, ó cedro, atrás da floresta que foi antes de você. Torne-se pó com ela, e que as suas cinzas se misturem às dela. Deite-se na tristeza e repouse no tormento até que chegue o seu último tempo, quando você voltará e será atormentado ainda mais.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒ̈ܐ
  choice: floresta
  rationale: Preserva a escala ampla da massa simbólica de árvores e corresponde ao uso apocalíptico da imagem.
- source_word: ܓܦܢ
  choice: videira
  rationale: É o termo bíblico corrente e mantém a força simbólica sem antecipar a interpretação posterior da visão.
- source_word: ܡܒܘܥܐ
  choice: fonte
  rationale: Designa uma nascente de água corrente e se ajusta ao registro elevado da visão; a formulação verbal esclarece seu movimento.
- source_word: ܐܪܙܐ
  choice: cedro
  rationale: Mantém de modo direto a imagem arbórea tradicional no uso bíblico e siríaco.
- source_word: ܒܫܠܡܐ / peaceful-coming imagery
  choice: serenamente / em paz
  rationale: Conserva o contraste entre o surgimento calmo da fonte e sua força devastadora posterior, sem uniformizar artificialmente as duas ocorrências.
theological_decisions:
- issue: Antecipar ou não a interpretação posterior da videira e da fonte
  choice: Os símbolos permanecem sem identificação explícita nesta visão.
  alternative: Sinalizar a videira e a fonte como figuras messiânicas ou inserir explicações provenientes do capítulo 39.
  rationale: A estrutura narrativa reserva a interpretação para depois; explicá-la aqui eliminaria a tensão própria da visão.
- issue: Sentido escatológico de “seu último tempo” e do retorno ao tormento
  choice: Preservar a formulação temporal e o retorno sem explicar seu mecanismo.
  alternative: Especificar juízo final, ressurreição ou uma cronologia definida.
  rationale: O texto apresenta castigo presente, um tempo derradeiro e tormento posterior, mas não explicita aqui como esses elementos se relacionam; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A repetição visionária foi moderadamente preservada, sobretudo na sequência de destruição, sem tornar a sintaxe excessivamente pesada. Não se acrescentaram títulos teológicos nem marcas de personificação além das exigidas pelo próprio discurso da visão.
