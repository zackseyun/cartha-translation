  yaml_path: translation/extra_canonical/2_baruch/015/001.yaml
  text: 'And the Lord answered and said to me:

    “You are right to be astonished at man’s passing, but your judgment about the evils that befall sinners is not right.


    And as for what you said about the righteous who are taken away and the wicked who prosper,

    and as for what you said—that man does not know your judgment—

    because of this, listen now and I will speak to you; pay attention and I will make my words heard.


    Indeed, man would not have understood my judgment if he had not received the Law and if I had not instructed him in understanding.

    But now, because he has transgressed while understanding, he will surely be punished because of that understanding.

    And as for the righteous, concerning whom you said that the world came on their account: what is coming is likewise on their account.

    For to them this world is a struggle and a labor with much trouble, but what is to come is a crown with great glory.”'
translation:
  language: pt
  text: 'E o Senhor me respondeu:


    “É justo que te espantes com a partida do ser humano, mas não é correto o teu julgamento acerca dos males que sobrevêm aos pecadores.


    Quanto ao que disseste sobre os justos que são levados e os perversos que prosperam,


    e quanto ao que disseste — que o ser humano não conhece o teu julgamento —,


    por causa disso, escuta agora, e eu te falarei; presta atenção, e farei ouvir as minhas palavras.


    De fato, o ser humano não teria compreendido o meu julgamento se não tivesse recebido a Lei e se eu não lhe tivesse dado entendimento.


    Mas agora, visto que transgrediu mesmo tendo entendimento, certamente será punido por causa desse entendimento.


    E quanto aos justos, a respeito dos quais disseste que o mundo veio por causa deles: aquilo que está por vir também virá por causa deles.


    Pois, para eles, este mundo é luta e trabalho em meio a muitas aflições; mas aquilo que está por vir é uma coroa de grande glória.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܡܗܬ
  choice: te espantes
  rationale: Expressa forte assombro diante da partida humana, sem reduzir a reação a mera curiosidade nem acrescentar desespero ao texto.
- source_word: ܢܡܘܣܐ
  choice: a Lei
  rationale: O artigo e o contexto de instrução e responsabilidade moral favorecem a referência definida à Lei, preservada com inicial maiúscula.
- source_word: ܡܕܥܐ / ܚܟܡܬܐ
  choice: entendimento
  rationale: Mantém a ligação entre conhecimento moral, transgressão consciente e responsabilidade pelo juízo.
- source_word: ܐܬܡܗܬ … ܕܐܢܫ
  choice: te espantes com a partida do ser humano
  rationale: “Partida” conserva a referência à morte ou ao desaparecimento desta vida com dignidade e sem especificar além da evidência controlada.
theological_decisions:
- issue: Por que o maior conhecimento aumenta a responsabilidade no julgamento
  choice: A transgressão cometida com entendimento torna a pessoa responsável precisamente à luz desse entendimento.
  alternative: O entendimento apenas identifica o pecado, sem intensificar a responsabilidade.
  rationale: A argumentação contrasta a falta hipotética de Lei e instrução com a transgressão consciente e vincula explicitamente a punição ao entendimento recebido.
- issue: Relação dos justos com o mundo presente e com aquilo que está por vir
  choice: Os justos enfrentam luta e aflição no mundo presente, enquanto o futuro lhes traz vindicação e grande glória.
  alternative: A promessa se refere somente a uma recompensa dentro do mundo presente.
  rationale: O contraste entre “este mundo” e “aquilo que está por vir” mantém distintos o sofrimento presente e a recompensa futura.
- issue: Sentido de “aquilo que está por vir”
  choice: Manter a expressão aberta, sem substituí-la explicitamente por “mundo vindouro”.
  alternative: Traduzir interpretativamente como “o mundo vindouro”.
  rationale: A formulação preserva a amplitude e a tensão do texto, embora o contexto aponte para a realidade futura destinada aos justos.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se paralelismos e repetições argumentativas do discurso, evitando arcaísmos como “pasmar” e explicitações confessionais. “Ser humano” verte o uso genérico sem restringi-lo ao sexo masculino; “perversos” contrasta naturalmente com “justos”.
