lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܡܘܬܗ ܕܝܫܘܥ
  choice: depois da morte de Josué
  rationale: O siríaco nomeia explicitamente Josué; explicitar o nome em português evita a ambiguidade desnecessária de «depois da morte dele».
- source_word: ܐܢܝܢ ܡܢܟܘܢ
  choice: vocês as rejeitaram
  rationale: O pronome feminino plural é preservado como «as», sem inserir no texto um antecedente que não aparece dentro do versículo.
- source_word: ܓܕܫ
  choice: sobreveio
  rationale: Expressa de modo natural e digno a ideia de algo anunciado que veio a acontecer ou recaiu sobre o povo.
theological_decisions:
- issue: Identidade do referente do pronome feminino plural
  choice: Manter «as» no texto e explicar a incerteza em nota
  alternative: Substituir o pronome por «as palavras», «as leis» ou «as advertências»
  rationale: O referente depende do contexto anterior e a forma textual disponível não justifica resolver de maneira definitiva a ambiguidade.
translation_notes:
  register: Português moderno, corrente e digno, com «vocês» para ampla legibilidade brasileira. A construção «sobreveio a vocês» conserva o tom solene e a relação de consequência do original.
