  naturalness: A redação é clara e de registro apropriado. «Transmitam» soa natural neste contexto exortativo e combina melhor com «tradições». «Depois de vocês» preserva a delimitação temporal/geracional do texto sem especificar indevidamente «após a morte de vocês».
  terminology: «Carta», «tradições» e «Lei» são escolhas adequadas. A maiúscula em «Lei» é convencional no contexto e não impõe uma leitura denominacional. Mantém-se a relação «tradições da Lei», sem converter as tradições em mera legislação.
