base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/009.yaml
  text: Hand on this letter and the traditions of the law to your children after you, just as your fathers handed them on to you.
translation:
  language: pt
  text: Transmitam esta carta e as tradições da Lei aos seus filhos depois de vocês, assim como seus pais as transmitiram a vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ (cf. reconstructed verse wording)
  choice: carta
  rationale: Expressa de modo corrente o documento escrito que deve ser transmitido.
- source_word: ܡܫܠܡ / ܐܫܠܡ (tradição textual do versículo)
  choice: entreguem / entregaram
  rationale: Conserva a ideia concreta e intergeracional de confiar e transmitir algo recebido.
- source_word: ܢܡܘܣܐ
  choice: Lei
  rationale: No contexto judaico, designa a Lei como corpo normativo recebido; a inicial maiúscula sinaliza esse referente sem acrescentar especificação denominacional.
- source_word: ܡܫܠܡܢܘܬܐ / tradições
  choice: tradições
  rationale: Mantém o sentido de ensinamentos transmitidos, sem reduzi-los a costumes nem defini-los além do que o texto permite.
theological_decisions:
- issue: Relação entre a carta, as tradições e a Lei
  choice: “esta carta e as tradições da Lei”
  alternative: “esta carta e as tradições legais”
  rationale: A formulação preserva a distinção entre a carta e as tradições associadas à Lei, evitando tratar “tradições” como simples adjetivo de normas jurídicas.
- issue: Continuidade da transmissão entre gerações
  choice: Repetir “entreguem/entregaram”
  alternative: Variar com “transmitam/transmitiram”
  rationale: A repetição reproduz o paralelismo e ressalta que os destinatários devem fazer pelos filhos o que os pais fizeram por eles.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com pronomes de terceira pessoa para boa legibilidade brasileira. “Depois de vocês” conserva a referência temporal aberta do texto, provavelmente à geração seguinte após a morte dos destinatários, sem explicitação interpretativa.
