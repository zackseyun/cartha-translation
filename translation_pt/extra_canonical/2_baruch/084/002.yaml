base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/002.yaml
  text: Remember how Moses once called heaven and earth as witnesses against you and said, “If you transgress the law, you will be scattered; but if you keep it, you will be kept.”
translation:
  language: pt
  text: 'Lembrem-se de como Moisés, no passado, invocou o céu e a terra como testemunhas contra vocês e disse: “Se vocês transgredirem a Lei[a], serão dispersos; mas, se a guardarem, serão guardados.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “violarem a Lei”.'
    reason: Registra uma alternativa idiomática para a ideia de transgredir, preservada na camada de consulta inglesa.
lexical_decisions:
- source_word: ܡܘܫܐ
  choice: Moisés
  rationale: Forma portuguesa convencional do nome próprio.
- source_word: ܢܡܘܣܐ
  choice: a Lei
  rationale: O termo siríaco designa aqui a Lei dada a Israel; a inicial maiúscula torna claro esse referente sem acrescentar conteúdo denominacional.
- source_word: ܬܬܒܪܘ
  choice: serão dispersos
  rationale: No contexto da advertência mosaica, exprime a consequência de ruptura e dispersão do povo; acompanha o contraste com serem preservados.
- source_word: ܬܬܪܚܩܘܢ
  choice: serão guardados
  rationale: Mantém o paralelismo antitético da tradição textual consultada, com uma formulação passiva simples e solene.
theological_decisions:
- issue: Relação condicional entre obediência à Lei e destino do povo
  choice: “Se vocês transgredirem...; mas, se a guardarem...”
  alternative: Explicitar isso como salvação individual por obras ou como mera prosperidade nacional
  rationale: A tradução conserva a tensão do enunciado condicional e coletivo, sem impor uma sistematização teológica posterior.
- issue: Testemunho do céu e da terra
  choice: “invocou o céu e a terra como testemunhas contra vocês”
  alternative: “jurou pelo céu e pela terra”
  rationale: A linguagem remete ao papel forense de testemunhas, não necessariamente a uma fórmula de juramento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. “Lembrem-se” preserva a exortação coletiva; o paralelismo “serão dispersos/serão guardados” mantém a cadência sentenciosa do texto.
