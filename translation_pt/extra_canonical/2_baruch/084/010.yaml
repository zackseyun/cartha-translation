base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/010.yaml
  text: And at all times keep asking earnestly, and pray diligently with your whole heart, that the Mighty One may be reconciled to you and may not reckon the multitude of your sins, but remember the uprightness of your fathers.
translation:
  language: pt
  text: E, em todo tempo, continuem a pedir com fervor e orem diligentemente de todo o coração, para que o Poderoso se reconcilie com vocês[a], não leve em conta a multidão dos seus pecados, mas se lembre da retidão dos seus antepassados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tenha misericórdia de vocês”.'
    reason: Registra uma tradução alternativa plausível para a expressão de favor ou restauração relacional.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: o Poderoso
  rationale: Preserva o título divino característico do livro, em vez de substituí-lo diretamente por “Deus”.
- source_word: ܚ̈ܛܗܘܗܝ
  choice: seus pecados
  rationale: Emprega o termo corrente e teologicamente não restritivo para as transgressões mencionadas no contexto.
- source_word: ܐܒܗ̈ܝܗܘܢ
  choice: seus antepassados
  rationale: No contexto coletivo e histórico, “antepassados” comunica melhor do que o literal “pais” a referência às gerações ancestrais.
theological_decisions:
- issue: A disposição do Poderoso para com o povo
  choice: se reconcilie com vocês
  alternative: tenha misericórdia de vocês
  rationale: Mantém a dimensão relacional de restauração refletida pela revisão crítica, sem reduzir a expressão apenas à compaixão; a alternativa legítima é preservada em nota.
- issue: Memória da retidão ancestral
  choice: se lembre da retidão dos seus antepassados
  alternative: se lembre da justiça dos seus pais
  rationale: Conserva a tensão do texto entre a culpa presente e a retidão ancestral, sem explicar o mecanismo teológico nem afirmar transferência automática de mérito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A repetição coordenada de “pedir” e “orar” preserva a intensidade exortativa, e “de todo o coração” mantém a formulação bíblica natural.
