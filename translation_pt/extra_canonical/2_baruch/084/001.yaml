base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/001.yaml
  text: Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.
translation:
  language: pt
  text: 'Vejam: enquanto ainda estou vivo, dei a conhecer estas coisas a vocês, pois lhes disse que aprendessem o que é bom. O Poderoso me ordenou que os instruísse e, antes de morrer, porei diante de vocês algumas das determinações do seu juízo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: o Poderoso
  rationale: Preserva o título divino marcado e recorrente em 2 Baruque, sem o reduzir ao nome genérico “Deus”.
- source_word: ܫܦܝܪ̈ܬܐ
  choice: o que é bom
  rationale: Expressa em português corrente a ideia de coisas moralmente boas, dignas ou apropriadas, sem ornamentação excessiva.
- source_word: ܦܘܩ̈ܕܢܐ / ܦܘܩ̈ܕܢܘܗܝ
  choice: determinações
  rationale: No contexto imediato de juízo, comunica prescrições dotadas de autoridade e evita confundi-las automaticamente com uma referência técnica aos mandamentos mosaicos.
- source_word: ܡܕܐܢܘܬ
  choice: juízo
  rationale: Mantém o sentido judicial e teológico do termo, incluindo a possibilidade de julgamento ou decisão divina.
- source_word: ܚܝ̈ܐ
  choice: vivo
  rationale: A formulação idiomática “enquanto ainda estou vivo” preserva o contraste temporal com a morte iminente.
theological_decisions:
- issue: Título divino
  choice: O Poderoso
  alternative: Deus; o Senhor; o Forte
  rationale: O título próprio do discurso deve conservar sua força retórica e não ser harmonizado com títulos divinos mais usuais.
- issue: Relação entre instrução e juízo
  choice: “determinações do seu juízo”
  alternative: “mandamentos de seu julgamento”; “preceitos de sua justiça”
  rationale: A tradução mantém a tensão entre mandamento autoritativo e decisão judicial, sem converter “juízo” em “justiça” nem resolver a expressão como mera legislação.
- issue: Força da exortação
  choice: “que aprendessem o que é bom”
  alternative: “a aprender as coisas excelentes”; “a aprender o que é apropriado”
  rationale: Conserva o caráter moral da exortação em linguagem natural, sem lhe acrescentar conteúdo confessional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural e mantém uma cadência solene sem arcaísmos. A abertura “Vejam” representa o apelo enfático dirigido ao grupo; não foram acrescentadas notas porque nenhuma variante indispensável à compreensão exige marcação no texto.
