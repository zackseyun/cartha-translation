  text: Remember the law and Zion, and the holy land, and your brothers, and the covenant of your fathers; and do not forget the festivals and the sabbaths.
translation:
  language: pt
  text: Lembrem-se da Lei e de Sião, da terra santa, de seus irmãos e da aliança de seus pais; e não se esqueçam das festas e dos sábados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: Lei
  rationale: O termo siríaco designa aqui a Lei, em sentido definido e religioso; a inicial maiúscula torna clara essa referência sem acrescentar conteúdo denominacional.
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: terra santa
  rationale: Equivalência direta e natural para a expressão tradicional referente à terra consagrada.
- source_word: ܩܝܡܐ
  choice: aliança
  rationale: Termo corrente em português bíblico para o compromisso solene estabelecido com os pais.
- source_word: ܥܕ̈ܥܕܐ
  choice: festas
  rationale: Expressa as celebrações religiosas periódicas sem restringir indevidamente o referente.
- source_word: ܫܒ̈ܐ
  choice: sábados
  rationale: Mantém o plural do referente e a terminologia bíblica reconhecível em português.
theological_decisions:
- issue: Referência aos antepassados
  choice: seus pais
  alternative: seus antepassados
  rationale: “Pais” preserva a formulação bíblica tradicional e o vínculo com a aliança, permanecendo compreensível no contexto.
- issue: Valor de “Lei”
  choice: Lei, com inicial maiúscula
  alternative: lei, com inicial minúscula
  rationale: O contexto aponta para a Lei recebida e guardada pela comunidade, não para legislação em sentido genérico.
translation_notes:
  register: Português moderno, digno e direto, com formas amplamente compreensíveis no Brasil e em outras comunidades lusófonas. A repetição de “e” foi moderada para dar naturalidade, preservando a estrutura enumerativa e a exortação final do texto.
