  text: Let this letter also be a witness between me and you, so that you may remember the commandments of the Mighty One, and so that it may become a vindication for me before him who sent me.
translation:
  language: pt
  text: Que esta carta também sirva de testemunho entre mim e vocês, para que se lembrem dos mandamentos do Poderoso e para que ela sirva de defesa para mim diante daquele que me enviou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ
  choice: carta
  rationale: Equivalente natural para a carta ou epístola mencionada no contexto, sem elevar desnecessariamente o registro.
- source_word: ܣܗܕܘܬܐ
  choice: testemunho
  rationale: Preserva o valor formal e relacional de algo que atesta entre as duas partes.
- source_word: ܚܝܠܬܢܐ
  choice: o Poderoso
  rationale: Mantém o título divino característico da obra e sua referência à força ou poder, sem substituí-lo por um nome interpretativo.
- source_word: ܡܦܩ ܒܪܘܚܐ
  choice: defesa
  rationale: Expressa a ideia de vindicação ou argumento em favor de Baruc perante aquele que o enviou, em português claro e digno.
theological_decisions:
- issue: Função da carta perante Deus
  choice: defesa para mim
  alternative: justificação para mim
  rationale: “Defesa” conserva o sentido forense sem sugerir automaticamente a doutrina técnica da justificação.
- issue: Identidade daquele que enviou Baruc
  choice: daquele que me enviou
  alternative: de Deus, que me enviou
  rationale: Mantém a referência indireta e a formulação do texto, sem explicitar além do que a passagem declara.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com uso de “vocês” para o plural dirigido à comunidade. A repetição de “sirva” torna clara a dupla função da carta: testemunho para os destinatários e defesa para o remetente.'
