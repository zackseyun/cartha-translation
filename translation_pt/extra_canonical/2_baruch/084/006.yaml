base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/006.yaml
  text: 'So I also say to you after your suffering: if you listen to these words that have been spoken to you, you will receive from the Mighty One what has been kept ready and stored up for you.'
translation:
  language: pt
  text: 'Assim, também eu lhes digo: depois de sofrerem, se ouvirem estas palavras que lhes foram ditas, receberão do Poderoso aquilo que foi preparado e reservado para vocês.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: o Poderoso
  rationale: Preserva o título divino recorrente de 2 Baruque, em vez de reduzi-lo ao substantivo abstrato “poder”.
- source_word: ܢܫܡܥ
  choice: ouvirem
  rationale: Mantém o sentido básico de escutar, que no contexto também implica acolher e obedecer, sem explicitar apenas uma dessas nuances.
- source_word: ܡܠ̈ܐ / formulação correspondente no texto transmitido
  choice: estas palavras que lhes foram ditas
  rationale: Reproduz naturalmente a referência às declarações já dirigidas aos ouvintes.
- source_word: expressão dupla de preparação e reserva
  choice: aquilo que foi preparado e reservado
  rationale: 'Conserva os dois aspectos complementares: algo já disposto e guardado para os destinatários.'
theological_decisions:
- issue: Relação entre ouvir as palavras e receber o que vem do Poderoso
  choice: manter a construção condicional
  alternative: apresentar a recompensa como incondicional
  rationale: O texto vincula a recepção ao ouvir responsivamente, sem definir em termos sistemáticos a natureza meritória ou não dessa relação.
- issue: Identidade do agente divino
  choice: usar o título “o Poderoso”
  alternative: substituir por “Deus” ou “o Todo-Poderoso”
  rationale: O título específico preserva a linguagem própria da obra e evita ampliar o termo para uma formulação teológica mais forte.
translation_notes:
  register: Português moderno, claro e digno, com tratamento plural por “vocês”. A oração inicial foi pontuada para dar fluidez sem eliminar a sequência temporal e condicional do texto.
