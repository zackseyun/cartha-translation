  language: pt
  text: Pois, se ele não nos julgar segundo a abundância de suas misericórdias, ai de todos nós que nascemos!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ... ܐܝܟ (lā ... ʾak)
  choice: não ... segundo
  rationale: A construção indica o padrão ou critério pelo qual se julga; “segundo” expressa isso naturalmente em português e evita o sentido menos preciso de “à parte de”.
- source_word: 'ܣܘܓܐܐ ܕܪ̈ܚܡܘܗܝ (sentido textual: abundância de suas misericórdias)'
  choice: a abundância de suas misericórdias
  rationale: Mantém a imagem quantitativa do siríaco e o plural sem reduzir a expressão a uma formulação teológica mais abstrata.
- source_word: 'ܘܝ ... ܠܟܠܢ ܝܠܝ̈ܕܐ (sentido textual: ai ... de todos nós, os nascidos)'
  choice: ai de todos nós que nascemos
  rationale: Reproduz a lamentação e verte de modo idiomático a referência abrangente aos que nasceram.
theological_decisions:
- issue: Relação entre juízo e misericórdia
  choice: “julgar segundo a abundância de suas misericórdias”
  alternative: “julgar à parte de suas misericórdias”
  rationale: O texto apresenta as misericórdias como medida ou critério do juízo, sem explicar como justiça e misericórdia se relacionam; a tradução preserva essa tensão e não a resolve doutrinariamente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se “misericórdias” no plural e a exclamação solene “ai de todos nós”.
