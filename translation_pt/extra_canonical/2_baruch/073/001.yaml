base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073/001.yaml
  text: And it shall be, after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]
translation:
  language: pt
  text: 1 E acontecerá que, depois de ele humilhar tudo o que há no mundo e se assentar em paz para sempre no trono do seu reino, então a alegria será revelada, e o descanso se manifestará.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “para sempre” diz literalmente “para a era”; “se manifestará” também pode ser traduzido por “aparecerá”.
    reason: Registra duas nuances lexicais reais do siríaco sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ܢܡܟܟ
  choice: humilhar
  rationale: O verbo siríaco expressa rebaixar ou sujeitar; “humilhar” preserva a ação régia sobre tudo o que há no mundo sem explicitar indevidamente o modo dessa sujeição.
- source_word: ܠܥܠܡ
  choice: para sempre
  rationale: A expressão pode significar literalmente “para a era” e, neste contexto régio e escatológico, comunica duração permanente; a ambiguidade idiomática é registrada em nota.
- source_word: ܢܬܓܠܐ
  choice: será revelada
  rationale: Mantém a imagem de algo antes oculto que vem a ser manifesto, em vez de reduzi-la ao simples surgimento de uma emoção.
- source_word: ܢܬܚܙܐ
  choice: se manifestará
  rationale: Traduz o sentido de tornar-se visível ou aparecer, com linguagem natural e digna em português.
theological_decisions:
- issue: Identidade do sujeito masculino
  choice: manter apenas “ele”
  alternative: identificá-lo explicitamente como o Messias
  rationale: O contexto pode indicar o Messias, mas o versículo emprega referência pronominal; explicitar o título no texto resolveria uma referência que a fonte deixa dependente do contexto.
- issue: Duração do reinado pacífico
  choice: “para sempre” no texto, com nota sobre o idiomatismo
  alternative: “para a era”
  rationale: “Para sempre” é a formulação portuguesa natural neste contexto, enquanto a nota conserva a forma semítica e sua possível nuance de era futura.
translation_notes:
  register: Português moderno, claro e solene, com construção escatológica preservada. A referência pronominal foi mantida para não inserir no versículo uma identificação teológica apenas contextual.
