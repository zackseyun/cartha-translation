base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073/002.yaml
  text: And then healing will descend in dew,[b] and anxiety will be quieted, and misery and disease and groanings will flee from the sons of men; and gladness will be in all the earth.
translation:
  language: pt
  text: Então o orvalho descerá suavemente,[a] e a cura aparecerá. Os cansados voltarão a repousar em tranquilidade, e a inquietação cessará. O sofrimento, a doença e os gemidos fugirão de entre os seres humanos; e haverá alegria em toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o orvalho descerá em agradabilidade”. O termo siríaco pode evocar suavidade, deleite ou agradabilidade; a cláusula seguinte diz separadamente: “e a cura aparecerá”.'
    reason: Esclarece o matiz de ܒܒܘܣܡܐ sem fundir sintaticamente o orvalho e a cura.
lexical_decisions:
- source_word: ܢܚܐ
  choice: cura
  rationale: O substantivo designa cura ou restauração; “cura” mantém a imagem concreta e corresponde ao contexto de desaparecimento da doença.
- source_word: ܛܠܐ
  choice: orvalho
  rationale: Equivalente direto do termo siríaco, preservando a imagem de uma bênção que desce suavemente.
- source_word: ܡܘܪܢܐ
  choice: ansiedade
  rationale: Expressa perturbação ou inquietação interior; “ansiedade” é natural em português moderno e se harmoniza com o verbo “aquietar-se”.
- source_word: ܕܘܝܐ ܘܟܘܪܗܢܐ ܘܐܢܚ̈ܬܐ
  choice: o sofrimento, a doença e os gemidos
  rationale: Mantém a enumeração de aflição, enfermidade e expressão audível de dor sem condensá-la.
- source_word: ܒܢܝܢܫ̈ܐ
  choice: seres humanos
  rationale: Traduz idiomaticamente o semitismo literal “filhos dos homens”, com sentido coletivo e inclusivo.
- source_word: ܚܕܘܬܐ
  choice: alegria
  rationale: Equivalente claro e corrente para o estado de júbilo anunciado em toda a terra.
theological_decisions:
- issue: Relação sintática entre cura e orvalho
  choice: “a cura descerá como orvalho”
  alternative: “o orvalho descerá com suavidade, e a cura aparecerá”
  rationale: A tradição textual e a divisão das palavras permitem mais de uma compreensão da imagem. O texto principal segue a leitura coerente com a versão de consulta, enquanto a nota preserva a alternativa mais literal da sequência siríaca.
- issue: Alcance de “seres humanos”
  choice: Linguagem coletiva não delimitada
  alternative: “filhos dos homens”
  rationale: O siríaco se refere à humanidade em geral; a formulação não acrescenta uma restrição soteriológica nem resolve além do texto o alcance da promessa.
translation_notes:
  register: Português moderno, claro e digno, com ritmo profético. A enumeração foi preservada, e “do meio dos seres humanos” evita o semitismo pouco corrente “dos filhos dos homens” sem alterar seu sentido coletivo.
