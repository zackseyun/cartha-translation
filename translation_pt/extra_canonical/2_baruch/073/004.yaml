base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073/004.yaml
  text: And judgments, and accusations, and contentions, and retaliations, and bloodshed, and cravings, and envy, and hatred, and everything like these will pass away into condemnation when they are removed.
translation:
  language: pt
  text: E os julgamentos, as acusações, as contendas, as reivindicações, o derramamento de sangue, os desejos, a inveja, o ódio e tudo o que se assemelha a essas coisas passarão à condenação quando forem removidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕ̈ܝܢܐ
  choice: julgamentos
  rationale: Mantém o sentido jurídico e condenatório do plural siríaco sem restringi-lo a uma interpretação específica.
- source_word: ܡܕ̈ܝܢܝܘܬܐ
  choice: acusações
  rationale: No contexto da enumeração de conflitos sociais, expressa procedimentos ou alegações adversariais.
- source_word: ܚܪ̈ܝܢܐ
  choice: contendas
  rationale: Reproduz naturalmente a ideia de disputas e conflitos.
- source_word: ܬܒ̈ܥܬܐ
  choice: retaliações
  rationale: O termo pode indicar cobranças, perseguições ou atos de vingança; 'retaliações' preserva aqui o movimento de retribuição hostil.
- source_word: ܕܡܐ
  choice: derramamento de sangue
  rationale: Embora literalmente seja 'sangue', a enumeração trata de males humanos; a expressão idiomática comunica violência homicida.
- source_word: ܪ̈ܓܝܓܬܐ
  choice: desejos
  rationale: Preserva a amplitude do termo, que pode denotar desejos, anseios ou paixões, sem acrescentar uma qualificação moral ausente.
- source_word: ܚܣܡܐ
  choice: inveja
  rationale: Equivalente direto e natural no contexto.
- source_word: ܣܢܐܬܐ
  choice: ódio
  rationale: Equivalente direto do substantivo siríaco.
- source_word: ܠܚܘܝܒܐ ܢܬ̈ܪܝܡܢ
  choice: passarão à condenação
  rationale: Conserva a formulação incomum do texto, segundo a qual esses males são destinados à condenação, sem explicar além da evidência textual.
- source_word: ܟܕ ܢܫ̈ܬܩܠܢ
  choice: quando forem removidos
  rationale: Traduz a construção temporal e passiva de modo formal e inteligível.
theological_decisions:
- issue: Destino dos males enumerados
  choice: passarão à condenação quando forem removidos
  alternative: serão eliminados por estarem condenados
  rationale: A alternativa explicita uma relação causal que o siríaco não declara; a redação escolhida preserva a tensão e a sequência do original.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura enumerativa próxima do siríaco. Não foram necessárias notas de rodapé.
