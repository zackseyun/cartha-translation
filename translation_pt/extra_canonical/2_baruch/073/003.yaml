  text: And no one will again die before his time, nor will any sudden adversity come to pass.
translation:
  language: pt
  text: E ninguém mais morrerá antes de seu tempo, nem lhe sobrevirá qualquer adversidade repentina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܘܒ ܠܐ ܢܡܘܬ ܕܠܐ ܒܙܒܢܗ
  choice: ninguém mais morrerá antes do seu tempo
  rationale: A expressão siríaca diz literalmente que ninguém morrerá “fora de seu tempo”; “antes do seu tempo” comunica naturalmente o sentido contextual em português.
- source_word: ܠܐ ܡܕܡ ܡܥܝܩ ܢܓܕܫ
  choice: nem lhe sobrevirá adversidade alguma
  rationale: ܡܥܝܩ descreve algo aflitivo ou adverso, e ܢܓܕܫ indica acontecer ou sobrevir. O siríaco não exige o qualificativo “repentina” presente na camada inglesa.
theological_decisions:
- issue: Alcance da promessa de não morrer fora do tempo
  choice: Preservar a afirmação absoluta no horizonte narrativo do período descrito
  alternative: Qualificá-la como mera longevidade ou como promessa individual contemporânea
  rationale: O versículo formula uma condição escatológica de modo direto; a tradução não deve restringir nem ampliar sua aplicação teológica.
translation_notes:
  register: Português moderno, claro e solene, com coordenação simples. Evitou-se importar “repentina” da consulta inglesa porque esse elemento não está explicitamente marcado no texto siríaco.
