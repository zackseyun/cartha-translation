base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/004.yaml
  text: And the workers of magic he burned with fire; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.
translation:
  language: pt
  text: E queimou no fogo os praticantes de magia. Entregou também às chamas os falsos profetas que desencaminhavam o povo. E lançou no ribeiro o povo que lhes dera ouvidos enquanto eles ainda viviam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܥܝ̈ܒ̣ܝܐ ܕ̈ܕ̈ܠܐ
  choice: os praticantes de magia
  rationale: O texto da edição está graficamente difícil neste ponto, mas o contexto e a tradição textual sustentam a referência a pessoas que praticavam artes mágicas; a formulação portuguesa é clara e atual.
- source_word: ܠܢܒܝ̈ܐ ... ܕܓ̈ܠܐ
  choice: os falsos profetas
  rationale: Reproduz de modo natural a ideia de profetas mentirosos, sem acrescentar uma qualificação teológica além do texto.
- source_word: ܠܥܡܡܐ
  choice: o povo
  rationale: No contexto, designa coletivamente aqueles que deram ouvidos aos falsos profetas.
- source_word: ܒܢܚܠܐ
  choice: no ribeiro
  rationale: O substantivo siríaco pode indicar vale, torrente ou curso d’água; 'ribeiro' preserva o sentido locativo concreto adotado pela tradição de tradução sem especificar um nome não presente no texto.
theological_decisions:
- issue: Natureza dos agentes condenados
  choice: praticantes de magia e falsos profetas
  alternative: feiticeiros e profetas mentirosos
  rationale: A escolha mantém as duas categorias distintas e evita vocabulário excessivamente arcaico ou carregado.
- issue: Referente de 'enquanto estavam vivos'
  choice: os falsos profetas
  alternative: o povo
  rationale: A proximidade sintática e o sentido da frase favorecem que o povo os ouviu durante a vida deles; a redação preserva esse referente sem expandir o texto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A longa coordenação do siríaco foi repartida em três períodos para maior clareza, preservando a sequência e a força das ações. Não se reproduziu a nota inglesa, pois ela registra apenas uma duplicação acidental já corrigida, não uma variante textual genuína.
