base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/002.yaml
  text: And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and raised the horn of the holy ones, and exalted the righteous, and honored all who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and wizards from the land.
translation:
  language: pt
  text: E purificou a terra dos ídolos, consagrou os utensílios que haviam sido profanados e restabeleceu as ofertas sobre o altar. Ergueu o chifre dos santos[a], exaltou os justos e honrou todos os que eram sábios em entendimento. Também reconduziu os sacerdotes ao seu serviço e removeu da terra os magos, os adivinhos e os feiticeiros.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, elevou a força, a dignidade ou o poder dos santos.
    reason: Esclarece a metáfora semítica de “erguer o chifre” sem substituí-la no texto principal.
  - marker: b
    text: O último termo também pode ser traduzido como “necromantes” ou “médiuns”.
    reason: Registra a amplitude lexical do termo siríaco para uma categoria de praticantes ocultistas.
lexical_decisions:
- source_word: ܡܐܢ̈ܐ
  choice: utensílios
  rationale: No contexto do culto, designa os objetos ou utensílios sagrados; é mais natural e preciso em português moderno do que o literal e potencialmente ambíguo “vasos”.
- source_word: ܩܪܢܐ
  choice: chifre
  rationale: Preserva a metáfora semítica de força, dignidade ou poder elevado, sem reduzir sua amplitude a uma única interpretação.
- source_word: ܩܕܝ̈ܫܐ
  choice: santos
  rationale: Mantém o sentido de pessoas separadas ou consagradas a Deus, sem especificar indevidamente sua identidade.
- source_word: ܚܪ̈ܫܐ / ܙܟܘܪ̈ܐ / ܝܕܘ̈ܥܐ
  choice: magos, adivinhos e feiticeiros
  rationale: Conserva a enumeração de três categorias de praticantes de artes ocultas e evita a leitura incorreta de um dos termos como “pecadores”.
theological_decisions:
- issue: A metáfora de erguer o chifre dos santos
  choice: Ergueu o chifre dos santos
  alternative: Elevou o poder dos santos
  rationale: A formulação principal preserva a imagem do texto-fonte; a nota esclarece o valor idiomático sem eliminar a metáfora.
- issue: Identificação dos três grupos ligados a práticas ocultas
  choice: magos, adivinhos e feiticeiros
  alternative: feiticeiros, adivinhos e necromantes
  rationale: O texto apresenta três categorias específicas, mas a delimitação exata do último termo é incerta; a tradução usa termos amplamente compreensíveis e registra uma alternativa possível em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com vocabulário cultual claro. A metáfora original foi preservada e explicada em nota; a série de praticantes ocultistas foi mantida como enumeração de três grupos.
