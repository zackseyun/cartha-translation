  verdict: revise
  source_fidelity: O siríaco conserva, ao que parece, um singular em «matou» e plurais nas ações de retirar e queimar; essa alternância não deve ser harmonizada. A expressão referente aos exumados é suficientemente imprecisa para justificar «restos mortais», embora o inglês do audit trail opte por «bones». «Alguns» não é uma representação segura de ܐܢܫܝܢ, que é melhor vertido por «pessoas».
  naturalness: A alternância de sujeito torna a frase inevitavelmente marcada em português, mas um ponto e vírgula permite conservá-la sem sugerir que «ele» seja o sujeito dos verbos plurais. «Que ainda viviam» é natural e adequado.
  terminology: «Ímpios» é apropriado para o grupo moralmente qualificado no contexto. «Restos mortais» preserva a cautela exigida pelo texto siríaco apresentado; a nota deve registrar que «ossos» é uma possibilidade refletida na trilha inglesa.
