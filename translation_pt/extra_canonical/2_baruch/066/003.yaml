base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/003.yaml
  text: And not only did they kill the impious who were living, but they also brought the bones of the dead out from the graves and burned them with fire.
translation:
  language: pt
  text: Ele não só matou os ímpios que ainda viviam; também retiraram dos túmulos os restos mortais de pessoas que haviam morrido e os queimaram no fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siríaco passa do singular, «ele matou», ao plural, «retiraram» e «queimaram», talvez distinguindo o rei dos que executaram suas ordens. A expressão traduzida por «restos mortais» pode também ser entendida como «ossos».
    reason: Registra tanto a alternância de sujeito quanto a incerteza acerca do que exatamente foi retirado dos túmulos, sem introduzir no texto principal uma especificação discutível.
lexical_decisions:
- source_word: ܠܨ̈ܥܨܥܐ
  choice: os ímpios
  rationale: O contexto descreve os que eram considerados pecadores ou ímpios; esta formulação conserva o contraste moral sem acrescentar uma categoria denominacional.
- source_word: ܠܡܝ̈ܬܘܗܝ ܕܐܢܫܝܢ ܕܡܝܬܘ
  choice: os restos mortais de alguns que haviam morrido
  rationale: O siríaco disponível se refere literalmente aos mortos de certas pessoas que morreram, não apresentando com clareza o termo específico para “ossos”. “Restos mortais” comunica naturalmente a exumação sem especificar além da evidência preservada.
- source_word: ܡܢ ܩܒܪܐ
  choice: dos túmulos
  rationale: Tradução natural do complemento de retirada; o singular coletivo siríaco pode ser expresso idiomaticamente pelo plural em português.
- source_word: ܒܙܘܪܐ (provável leitura corrompida/OCR por ܒܢܘܪܐ)
  choice: no fogo
  rationale: A leitura contextual e a tradição textual subjacente indicam que os restos foram queimados; a forma fornecida parece refletir corrupção de leitura ou OCR.
theological_decisions:
- issue: Mudança de sujeito entre as duas ações
  choice: Preservar a passagem do singular (“Ele... matou”) ao plural (“retiraram... queimaram”)
  alternative: Harmonizar todas as ações no plural, como no texto inglês revisado, ou todas no singular
  rationale: O texto siríaco apresentado traz o verbo “matou” no singular e os verbos seguintes no plural. Preservar essa mudança evita apagar uma possível distinção entre o rei e seus agentes.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe deliberadamente fiel à mudança de sujeito do siríaco. “Restos mortais” é corrente e evita afirmar “ossos” onde o texto-fonte fornecido não o explicita de modo seguro.
