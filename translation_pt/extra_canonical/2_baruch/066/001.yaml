base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/001.yaml
  text: And the tenth bright waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the king (or change source word to ܚܝܠܬܢܐ) with the fullness of his heart and with all his soul.
translation:
  language: pt
  text: E as águas luminosas — as décimas — que você viu depois destas representam a pureza da geração de Josias, rei de Judá,[a] o único que, naquele tempo, se submeteu ao Poderoso com a plenitude de seu coração e com toda a sua alma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome está danificado no testemunho siríaco desta página; o contexto das reformas religiosas identifica o rei como Josias, e não Amom.
    reason: Registra com transparência a fragilidade textual da forma régia preservada.
lexical_decisions:
- source_word: ܘܒ̈ܬܪ ܒܣܝ̈ܡܐ ... ܕܥܣܝܪܐ
  choice: as águas luminosas ... as décimas
  rationale: Mantém explícito o rótulo estrutural da visão — a série alternada de águas escuras e luminosas — e expressa a posição ordinal em português natural.
- source_word: ܕܫܘܝܐ
  choice: a pureza
  rationale: No contexto das reformas de Josias, o termo abrange retidão moral e purificação cultual; “pureza” preserva ambas as dimensões.
- source_word: ܡܫܟܚ ܗܘܐ ܠܚܝܠܬܢܐ
  choice: se submeteu ao Poderoso
  rationale: A leitura controlada pelo contexto e pela tradição textual aponta para o título divino “o Poderoso”; “se submeteu” comunica a obediência voluntária indicada pela construção.
- source_word: ܡܢ ܡܠܝܘ ܠܒܗ ܘܡܢ ܟܠܗ̇ ܢܦܫܗ
  choice: com a plenitude do coração e com toda a sua alma
  rationale: Preserva a diferença lexical entre “plenitude” na primeira expressão e “toda” na segunda, sem reduzir ambas simplesmente a “todo”.
theological_decisions:
- issue: Nome régio danificado no início do capítulo
  choice: Josias, rei de Judá
  alternative: Amom, rei de Judá
  rationale: Embora a superfície do testemunho reproduzido esteja instável, a identificação como Josias é confirmada pela descrição subsequente da reforma religiosa e pela sequência histórica da visão. A nota registra a dificuldade textual sem introduzir Amom no texto principal.
- issue: Título divino em leitura textualmente instável
  choice: o Poderoso
  alternative: o rei
  rationale: “Rei” resulta de uma associação lexical equivocada com ܡܠܟܐ no título “rei de Judá”; a leitura contextual esperada é ܚܝܠܬܢܐ, título divino recorrente, vertido de modo reverente e não denominacional por “o Poderoso”.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. “Você” acompanha a interpelação visionária direta; “representam” torna idiomática a identificação simbólica sem explicá-la além do texto.
