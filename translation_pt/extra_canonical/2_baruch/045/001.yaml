  yaml_path: translation/extra_canonical/2_baruch/045/001.yaml
  text: …that belong to corruption and its ways, ways that cannot be searched out, whatever they may be. But if you endure and stand in his fear and do not go astray from his law, the times will be changed in their season for good, and you will see the consolation of Zion.
translation:
  language: pt
  text: 1 …que pertencem à corrupção e aos seus caminhos, caminhos insondáveis, sejam eles quais forem.[a] Mas, se vocês perseverarem, permanecerem no temor dele e não se desviarem de sua Lei, os tempos mudarão para o bem no tempo próprio, e vocês verão a consolação de Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão siríaca final é enfática e pouco comum; literalmente, “e eles são eles”, aqui entendida como “sejam eles quais forem”.
    reason: Preserva a nuance do idioma siríaco ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ e informa o leitor sobre sua forma incomum sem tornar o texto principal artificial.
lexical_decisions:
- source_word: ܕܝܠܗ ܕܚܒܠܬܐ
  choice: que pertencem à corrupção
  rationale: Mantém a relação explícita de pertencimento e o campo semântico de corrupção, ruína e perecimento presente no contexto.
- source_word: ܐܘܪ̈ܚܬܗ ܕܠܐ ܡܬܒ̈ܩܥܢ
  choice: seus caminhos, caminhos insondáveis
  rationale: “Insondáveis” expressa de modo natural a ideia de caminhos que não podem ser investigados ou perscrutados, sem explicar além do texto.
- source_word: ܬܣܝܒܪܘܢ
  choice: perseverarem
  rationale: O verbo indica suportar ou resistir; “perseverarem” comunica constância diante da aflição e se ajusta ao registro exortativo.
- source_word: ܬܩܘܡܘܢ ܒܕܚܠܬܗ
  choice: permanecerem no temor dele
  rationale: Preserva tanto a ideia de manter-se firme quanto o sentido reverente de “temor”, evitando reduzi-lo a medo ou respeito apenas.
- source_word: ܡܬܚܠܦܝܢ ܒܥܕܢܗܘܢ ܙܒ̈ܢܐ ܠܛܒܬܐ
  choice: os tempos mudarão para o bem na estação determinada
  rationale: Conserva a mudança dos tempos e sua ocorrência em uma estação própria, mantendo o horizonte apocalíptico sem transformar “bem” em uma bênção mais específica.
- source_word: ܒܘܝܐܐ ܕܨܝܘܢ
  choice: a consolação de Sião
  rationale: “Consolação” preserva o tom comunitário e escatológico da restauração de Sião melhor do que uma formulação meramente emocional.
theological_decisions:
- issue: Relação entre perseverança, obediência e a futura restauração
  choice: Manter a construção condicional do siríaco
  alternative: Reformular a perseverança como causa meritória da restauração
  rationale: O texto exorta à perseverança, ao temor e à fidelidade à Lei antes de anunciar a mudança dos tempos, mas não define sistematicamente a relação causal; a tradução conserva essa tensão.
- issue: Esperança escatológica centrada em Sião
  choice: a consolação de Sião
  alternative: a salvação futura em geral
  rationale: A referência explícita a Sião deve ser mantida, sem generalizar a promessa nem vinculá-la a uma interpretação denominacional.
- issue: Agente da mudança dos tempos
  choice: os tempos mudarão
  alternative: Deus mudará os tempos
  rationale: O siríaco emprega uma forma passiva ou médio-passiva e não nomeia diretamente o agente; a tradução não acrescenta um sujeito teológico implícito.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. O início fragmentário foi preservado pelas reticências porque o versículo continua uma frase anterior. “Lei” recebe inicial maiúscula por designar a Lei divina no contexto, sem acrescentar especificação confessional.
