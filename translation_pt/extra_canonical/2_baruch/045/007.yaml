  text: Therefore, let those who desire to see it beware of the time spoken of, and let them pass beyond the burden of the troubled time.
translation:
  language: pt
  text: Portanto, os que desejam vê-lo estejam atentos ao tempo de que se falou e passem além do fardo do tempo conturbado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siríaco deste trecho é difícil. A expressão traduzida por «desejam vê-lo» também pode ser entendida como «desejam aparecer» ou «desejam ser vistos»; «fardo» também pode significar «dívida», «obrigação» ou «culpa»; e «tempo conturbado» traduz uma expressão que pode sugerir um tempo que desperta, incita ou perturba.
    reason: Preserva ambiguidades lexicais e sintáticas relevantes do siríaco sem sobrecarregar o corpo do versículo.
lexical_decisions:
- source_word: ܕܢܬܙܗܪܘܢ
  choice: estejam atentos
  rationale: Expressa a ideia de manter-se alerta ou precaver-se, em português natural, sem acrescentar um perigo específico.
- source_word: ܙܒܢܐ ܕܐܡܝܪ
  choice: o tempo anunciado
  rationale: Traduz literalmente a noção de um tempo que foi dito ou anunciado, preservando seu caráter profético no contexto.
- source_word: ܚܘܒܐ
  choice: o peso
  rationale: No contexto, o termo indica algo oneroso que precisa ser atravessado; “peso” comunica isso com clareza, embora o vocábulo também possa significar dívida, obrigação ou culpa.
- source_word: ܙܒܢܐ ܕܡܥܝܪ
  choice: tempo de agitação
  rationale: Reproduz a imagem de um tempo que desperta, incita ou perturba, evitando especificar uma forma particular de sofrimento.
theological_decisions:
- issue: Objeto implícito de “ver”
  choice: vê-lo
  alternative: aparecer / ser vistos
  rationale: O contexto aponta para aquilo que está por vir como referente implícito. A forma siríaca transmitida, porém, pode ser entendida de modo passivo; a nota registra a ambiguidade sem construir uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível. A formulação mantém o encadeamento exortativo do siríaco e evita explicar além do que o texto permite.
