base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/005.yaml
  text: For when the time that does not pass away comes and its season arrives, it sets its deeds in order and examines its sins. Those who belong to it do not add anguish to destruction.
translation:
  language: pt
  text: Pois, quando vier o tempo que não passa e chegar a sua hora, ele porá em ordem as suas obras e examinará os seus pecados. Os que lhe pertencem não acrescentarão angústia à destruição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ ܕܠܐ ܥܒܕ
  choice: o tempo que não passa
  rationale: Reproduz diretamente a expressão temporal siríaca e preserva o contraste com tudo o que passa, desenvolvido no contexto.
- source_word: ܡܫܘܐ ܥܒܕܘܗܝ
  choice: porá em ordem as suas obras
  rationale: ܡܫܘܐ pode exprimir pôr em ordem, ajustar ou acertar; esta formulação conserva a ação sem especificar indevidamente se se trata de julgamento ou conclusão.
- source_word: ܡܒܩܪ ܚܛܗܝܗ
  choice: examinará os seus pecados
  rationale: Mantém a atribuição surpreendente do texto ao tempo e traduz ܡܒܩܪ como exame ou averiguação, sem reinterpretar o referente.
- source_word: ܥܘܩܢ ܥܚܒܠܐ
  choice: angústia à destruição
  rationale: Conserva os dois conceitos do siríaco e a relação de acréscimo indicada pelo verbo, embora a construção seja semanticamente tensa.
theological_decisions:
- issue: O tempo futuro é apresentado como agente que ordena obras e examina pecados.
  choice: Manter o tempo como sujeito explícito por meio de “ele”.
  alternative: Substituir o sujeito por Deus ou pelo juízo futuro.
  rationale: O siríaco atribui gramaticalmente essas ações ao tempo mencionado; identificar o agente como Deus eliminaria uma ambiguidade ou personificação genuína do texto.
- issue: Relação entre os que pertencem ao tempo e a destruição.
  choice: Traduzir literalmente que eles “não acrescentarão angústia à destruição”.
  alternative: Interpretar como “não sofrerão mais a angústia da destruição”.
  rationale: A alternativa produz sentido mais imediato, mas altera a sintaxe e resolve uma expressão obscura sem apoio suficiente.
translation_notes:
  register: Português atual, digno e de leitura ampla, com futuro verbal natural após “quando”. A personificação e a tensão semântica do siríaco foram preservadas, evitando explicações confessionais ou harmonizações.
