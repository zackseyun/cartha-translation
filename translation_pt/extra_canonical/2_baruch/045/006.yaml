  text: And if there are any who are appointed for it, it is not withheld from them; and for those who live in it, they will not be led to destruction.
translation:
  language: pt
  text: E, se houver alguns destinados a isso, isso não lhes será negado; e os que nele vivem não serão levados à destruição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e, para os que nele vivem, não há condução deles à destruição”.'
    reason: O siríaco também pode ser entendido como uma construção impessoal, em vez de tomar “os que nele vivem” como sujeito de uma passiva.
lexical_decisions:
- source_word: ܥܬܝܕܝܢ
  choice: destinados
  rationale: O particípio pode indicar aqueles que estão designados ou reservados para algo; “destinados” conserva essa ideia sem especificar quem os designou.
- source_word: ܡܬܚܣܟ
  choice: é negado
  rationale: O verbo passivo expressa que algo é retido ou privado de alguém; “não lhes é negado” comunica naturalmente o sentido contextual.
- source_word: ܡܘܒܠܐ ܠܐܒܕܢܐ
  choice: serão conduzidos à destruição
  rationale: A expressão combina a ideia de conduzir com o destino “destruição”; a forma passiva em português segue a leitura contextual adotada e mantém o tom escatológico.
theological_decisions:
- issue: Referente dos pronomes em “destinados a ele”, “ele não lhes é negado” e “nele vivem”
  choice: Manter o referente implícito por meio do pronome “ele”
  alternative: Explicitar como “o mundo vindouro”, “o tempo futuro” ou outra realidade escatológica
  rationale: O siríaco depende do contexto e não nomeia o referente neste versículo; explicitá-lo resolveria uma ambiguidade que o texto preserva.
- issue: Sintaxe da cláusula final
  choice: “os que nele vivem não serão conduzidos à destruição”
  alternative: “para os que nele vivem, não há condução à destruição”
  rationale: A leitura adotada é natural em português e corresponde à compreensão contextual registrada na camada de consulta, enquanto a nota preserva a construção mais impessoal possível no siríaco.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente para leitores brasileiros e compreensão ampla no mundo lusófono. Os pronomes foram mantidos sem explicitar seu referente, em respeito à ambiguidade do texto siríaco.
