base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/008.yaml
  text: But those who turned themselves toward darkness and received lies, and lost the settledness of hope, and sought out vanities, and did not show mercy, nor keep the path of discipline—
translation:
  language: pt
  text: Mas os que se voltaram para as trevas, acolheram mentiras, perderam o tesouro da esperança, buscaram coisas vãs[a], não demonstraram misericórdia nem guardaram o caminho da disciplina —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deixaram-se encontrar entre coisas vãs”.'
    reason: A forma verbal siríaca admite possível valor passivo ou médio/reflexivo.
lexical_decisions:
- source_word: ܚܫܘܟܐ
  choice: trevas
  rationale: O termo significa “escuridão/trevas”; “trevas” preserva o contraste moral do contexto e evita a leitura equivocada “angústia”.
- source_word: ܣܝܡܬܐ ܕܣܒܪܐ
  choice: tesouro da esperança
  rationale: ܣܝܡܬܐ denota algo depositado ou guardado, inclusive um tesouro; a expressão é mais concretamente metafórica do que “firmeza da esperança”.
- source_word: ܗܒܠܘܬܐ / forma textual correspondente
  choice: coisas vãs
  rationale: Expressa vacuidade, futilidade ou vaidade; “coisas vãs” é natural em português e mantém o alcance moral amplo.
- source_word: ܪ̈ܚܡܐ ... ܐܚܣܘ
  choice: demonstraram misericórdia
  rationale: A combinação pertence ao campo semântico de compaixão e misericórdia; esta formulação transmite de modo idiomático a falta de ação misericordiosa.
- source_word: ܡܘܣܪ
  choice: disciplina
  rationale: Pode abranger correção, instrução e disciplina; “disciplina” preserva a concisão e o tom sapiencial.
theological_decisions:
- issue: Imagem associada à esperança
  choice: tesouro da esperança
  alternative: firmeza da esperança
  rationale: A escolha conserva a metáfora lexical de algo guardado ou depositado, sem reinterpretá-la como uma abstração psicológica.
- issue: Valor da forma verbal em relação às vaidades
  choice: buscaram coisas vãs
  alternative: deixaram-se encontrar entre coisas vãs
  rationale: A forma pode admitir leitura média/reflexiva ou passiva. O texto principal usa uma construção ativa natural, enquanto a nota preserva a alternativa sem decidir além da evidência.
