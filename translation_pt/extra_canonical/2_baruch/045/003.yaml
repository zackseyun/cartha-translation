  text: For everything corruptible passes away and comes to nothing, and the time that has been is now forgotten; nor after this is it sought in remembrance.
translation:
  language: pt
  text: Pois tudo o que é corruptível passa e se reduz a nada, e o tempo que existiu é agora esquecido; depois disso, já não é buscado na memória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܒܠ
  choice: é corruptível
  rationale: Preserva a ideia de algo sujeito à corrupção, deterioração ou destruição, sem restringi-la a um único tipo de perecimento.
- source_word: ܐܙܠ ܠܐ ܡܢ ܕܡܢܐ
  choice: passa e se reduz a nada
  rationale: Expressa em português natural o movimento rumo à inexistência indicado pela construção siríaca.
- source_word: ܡܬܛܥܐ
  choice: cai então no esquecimento
  rationale: Traduz o sentido passivo ou resultativo de ser esquecido, com fluidez no contexto temporal.
- source_word: ܡܬܒܥܐ ܒܥܘܗܕܢܐ
  choice: é buscado na memória
  rationale: Mantém a imagem do original, que fala de procurar ou buscar algo na lembrança, em vez de simplificar para apenas “ser lembrado”.
theological_decisions:
- issue: Alcance da afirmação sobre o que perece
  choice: Tudo o que é corruptível
  alternative: Todas as coisas criadas
  rationale: O texto qualifica aquilo que se corrompe; não identifica explicitamente a categoria com toda a criação. A tradução evita ampliar teologicamente a afirmação.
