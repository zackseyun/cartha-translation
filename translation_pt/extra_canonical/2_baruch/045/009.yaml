  text: they desire to inquire into the hidden anguish of the people to come; but the visitation of that matter by which many were justified they will not see.
translation:
  language: pt
  text: Desejam investigar a angústia oculta do povo que há de vir; mas não verão a visitação daquilo pelo qual muitos foram justificados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O siríaco deste trecho é difícil. “Foram justificados” também pode ser traduzido por “foram considerados justos” ou “foram vindicados”.
    reason: Registra a incerteza textual e a amplitude semântica da forma passiva, sem resolver silenciosamente a ambiguidade.
lexical_decisions:
- source_word: ܥܘܩܢ
  choice: angústia
  rationale: O termo denota aflição, aperto ou sofrimento; “angústia” preserva a força do contexto sem especificar indevidamente sua natureza.
- source_word: ܡܬܚܣܟ
  choice: oculta
  rationale: A forma pode sugerir algo escondido ou retido; “oculta” corresponde ao sentido contextual adotado, embora o trecho siríaco seja textualmente difícil.
- source_word: ܥܡܐ ܕܐܬܐ
  choice: povo que há de vir
  rationale: Tradução formal da expressão tal como preservada no texto; evita emendá-la silenciosamente para “mundo vindouro”.
- source_word: ܡܒܩܪܐ
  choice: visitação
  rationale: Mantém a amplitude do termo, que pode indicar inspeção, averiguação ou visitação, inclusive com possíveis conotações judiciais.
- source_word: ܐܙܕܕܩܘ
  choice: foram justificados
  rationale: Reproduz a voz passiva e preserva a possível dimensão forense ou vindicatória sem substituí-la por uma interpretação específica.
theological_decisions:
- issue: Sentido de “justificados”
  choice: foram justificados
  alternative: foram considerados justos / foram vindicados
  rationale: A formulação literal preserva a tensão entre declaração de justiça e vindicação, sem impor uma leitura doutrinária particular.
- issue: Sentido de “visitação”
  choice: visitação
  alternative: exame / averiguação
  rationale: “Visitação” conserva a possível conotação de intervenção ou juízo divino, ao mesmo tempo que não elimina o sentido mais geral de inspeção.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura relativamente formal para acompanhar o caráter sentencioso do texto. A expressão incomum “povo que há de vir” foi mantida por fidelidade ao testemunho siríaco fornecido; a dificuldade do trecho é sinalizada em nota.
