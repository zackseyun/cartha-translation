lexical_decisions:
- source_word: ܡܕܡ ܕܗܘܐ ܗܫܐ
  choice: o que existe agora
  rationale: Expressa em português corrente a referência ao estado presente, mantendo o valor amplo de ܡܕܡ, “aquilo/o que”.
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܗܘܐ
  choice: o que há de vir
  rationale: Reproduz de modo natural a construção prospectiva siríaca, sem especificar indevidamente a natureza da realidade futura.
- source_word: ܪܒ ܣܓܝ
  choice: extraordinariamente grande
  rationale: Conserva a intensificação de “grande” por ܣܓܝ e comunica a forte contraposição entre o presente e o futuro.
theological_decisions:
- issue: Natureza do contraste entre o presente e o futuro
  choice: Manter a formulação abrangente “o que existe agora” e “o que há de vir”
  alternative: Explicitar “este mundo” e “o mundo futuro”
  rationale: O siríaco não nomeia explicitamente dois mundos; a tradução preserva a amplitude e a tensão escatológica sem acrescentar uma interpretação confessional.
