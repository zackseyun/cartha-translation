base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/004.yaml
  text: For what has passed away into corruption, and what is corrupted falls and is forgotten. But what is to come is what is sought; what has passed from the hand is no longer reckoned.
translation:
  language: pt
  text: Pois o que passou para a corrupção, e o que se corrompe cai e é esquecido. Mas o que há de vir é o que se busca; o que passou da mão já não é levado em conta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܠܦ
  choice: passou
  rationale: O verbo pode indicar passar, atravessar ou desaparecer. “Passou para a corrupção” conserva o movimento expresso pelo siríaco e soa natural em português, sem especificar além do texto como ocorreu esse desaparecimento.
- source_word: ܡܬܚܒܠ
  choice: se corrompe
  rationale: Mantém o campo semântico de corrupção, deterioração ou ruína e preserva a ligação lexical com “corrupção” na oração anterior.
- source_word: ܡܬܛܥܐ
  choice: é esquecido
  rationale: Tradução direta do sentido passivo/reflexivo de cair no esquecimento.
- source_word: ܡܬܒܥܐ
  choice: se busca
  rationale: Preserva a forma impessoal/passiva do siríaco sem definir quem realiza a busca.
- source_word: ܡܬܚܫܒ
  choice: é levado em conta
  rationale: Expressão portuguesa corrente para ser contado, considerado ou computado.
theological_decisions:
- issue: Contraste entre o transitório e o futuro
  choice: Manter o contraste temporal sem identificar “o que há de vir” com um evento ou doutrina específicos.
  alternative: Explicitar o referente como o mundo futuro, a ressurreição ou a recompensa.
  rationale: O versículo não nomeia explicitamente o referente; especificá-lo eliminaria uma abertura presente no texto.
- issue: Sentido de corrupção
  choice: Empregar “corrupção” em sentido amplo.
  alternative: Traduzir como morte, destruição ou decomposição.
  rationale: O termo siríaco comporta deterioração e ruína; uma formulação mais específica imporia uma interpretação.
translation_notes:
  register: Português moderno, digno e acessível, com cadência sentenciosa. Conserva a repetição lexical entre “corrupção” e “se corrompe” e evita resolver o referente escatológico de “o que há de vir”.
