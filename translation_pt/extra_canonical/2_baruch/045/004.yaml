  verdict: revise
  source_fidelity: 'A redação acompanha adequadamente o paralelismo e os principais termos do siríaco: corrupção/arruinar-se, cair, ser esquecido, ser buscado e ser levado em conta. Contudo, «o que existia passou» introduz um estado prévio («existia») que não corresponde tão diretamente à formulação verbal transmitida nem ao sentido estabelecido no rastro inglês («what has passed away into corruption»). «Da mão», no singular, reproduz também a imagem do texto-fonte.'
  naturalness: O período é claro e tem registro sentencioso apropriado. «O que passou para a corrupção» é mais conciso e natural do que «o que existia passou para a corrupção».
  terminology: «Corrupção», «se corrompe», «é esquecido», «se busca» e «é levado em conta» preservam bem tanto o campo semântico quanto as repetições do original. A nota proposta não é necessária e «atravessou» é uma alternativa potencialmente enganosa neste contexto.
