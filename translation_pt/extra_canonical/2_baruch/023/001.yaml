  yaml_path: translation/extra_canonical/2_baruch/023/001.yaml
  text: And I answered and said, “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near, and is not as far off as it was before.”
translation:
  language: pt
  text: 'E eu respondi: “Não, Senhor, meu Senhor.”


    Então ele me respondeu: “Por que você se aflige com o que não conhece e por que se inquieta com coisas que ignora? Assim como você não se esqueceu dos que agora existem nem dos que já morreram, também eu me lembro dos que ainda virão. Pois, quando Adão pecou e a morte foi decretada para os que haveriam de nascer, foi determinado o número dos que nasceriam; e, para esse número, preparou-se um lugar onde os vivos pudessem habitar e os mortos fossem guardados. Portanto, enquanto não se completar o número previamente estabelecido, a criação não voltará a viver. Pois o meu Espírito dá vida, e o Sheol recebe os mortos. Além disso, foi concedido a você ouvir o que acontecerá depois destes tempos. Pois a minha salvação verdadeiramente se aproximou e já não está tão distante como antes.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܝܪ
  choice: se aflige
  rationale: Expressa perturbação interior de maneira natural e digna, sem intensificar o sentido até pânico ou desespero.
- source_word: ܡܢܝܢܐ
  choice: número
  rationale: Preserva a ideia apocalíptica de um total previamente determinado, e não apenas o ato de contar.
- source_word: ܫܝܘܠ
  choice: Sheol
  rationale: Mantém o termo do imaginário judaico-apocalíptico para o domínio dos mortos, sem o reduzir a sepultura, inferno ou outra categoria posterior.
- source_word: ܦܘܪܩܢܐ
  choice: salvação
  rationale: Comunica de modo amplo e corrente a ação divina de salvar, sem restringi-la a uma modalidade específica de libertação.
- source_word: ܪܘܚܝ
  choice: meu Espírito
  rationale: Conserva a referência possessiva à agência divina que dá vida, sem definir além do texto sua relação teológica precisa.
theological_decisions:
- issue: O pecado de Adão e o decreto da morte para a humanidade futura
  choice: a morte foi decretada para os que haveriam de nascer
  alternative: a mortalidade foi estabelecida para os descendentes de Adão
  rationale: Mantém a formulação coletiva e apocalíptica, sem introduzir uma construção doutrinária posterior sobre a transmissão do pecado.
- issue: A agência divina que dá vida em contraste com o Sheol
  choice: o meu Espírito dá vida, e o Sheol recebe os mortos
  alternative: o meu sopro vivifica, e o mundo dos mortos guarda os mortos
  rationale: Preserva o contraste entre a ação vivificadora divina e a recepção dos mortos pelo Sheol, evitando precisão dogmática indevida.
- issue: O sujeito que voltará a viver quando o número estiver completo
  choice: a criação não voltará a viver
  alternative: a criatura não voltará a viver
  rationale: A formulação coletiva se ajusta ao horizonte escatológico da passagem e evita restringir a declaração a um único indivíduo, embora o termo também possa ser entendido como “a criatura”.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A repetição “Senhor, meu Senhor” e a sequência retórica foram preservadas. “Sheol” foi mantido como termo histórico-religioso, e a tensão entre determinação numérica, morte e renovação da vida não foi suavizada.
