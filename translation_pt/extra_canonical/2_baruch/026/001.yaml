base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/026/001.yaml
  text: And I answered and said, "Will that tribulation that is to come continue a long time, and will this necessity embrace many years?"
translation:
  language: pt
  text: '1 E respondi e lhe disse: “Aquela tribulação[a] que está por vir se prolongará por muito tempo, e essa necessidade abrangerá muitos anos?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Essa tribulação”; outra possibilidade é “Esta tribulação”.
    reason: O siríaco emprega um demonstrativo distal, mas a correspondência entre graus de distância em siríaco e português não é exata.
lexical_decisions:
- source_word: ܘܥ̣ܢܝܬ ܘܐܡ̣ܪܬ ܠܝܗ
  choice: E respondi e lhe disse
  rationale: Mantém a fórmula narrativa semítica e inclui o referente indireto expresso no siríaco.
- source_word: ܐܘܠܨܢܐ
  choice: tribulação
  rationale: O termo abrange pressão, aflição e angústia; “tribulação” preserva o registro apocalíptico e a amplitude semântica.
- source_word: ܗܘ̇ ܕܐܬܝ̇
  choice: aquela ... que está por vir
  rationale: O demonstrativo é distal, e o particípio/verbo de vinda aponta para uma tribulação futura. “Aquela” preserva essa deixis, embora “essa” ou “esta” possam soar mais naturais em certos contextos.
- source_word: ܡܐ ܣܓܝܐܐ ܡܣܘܟ
  choice: se prolongará por muito tempo
  rationale: Expressa em português corrente a pergunta sobre a extensão ou duração da tribulação, sem reforçar indevidamente sua intensidade.
