translation:
  language: pt
  text: E, depois disso, cheguei ao lugar onde falaste comigo[a] e sentei-me na caverna da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «onde falaste comigo ali».
    reason: O siríaco emprega um advérbio retomador, «ali», depois de «onde»; omiti-lo no texto principal evita redundância pouco natural em português, enquanto a nota conserva a forma da fonte.
lexical_decisions:
- source_word: ܐܬܝܬ
  choice: cheguei
  rationale: Expressa naturalmente em português a chegada ao lugar, preservando o sentido do verbo siríaco sem impor uma perspectiva dêitica rígida entre «vim» e «fui».
- source_word: ܐܬܪܐ
  choice: lugar
  rationale: Equivalente direto e corrente para o local anteriormente mencionado.
- source_word: ܡܥܪܬܐ
  choice: caverna
  rationale: Mantém a referência concreta à caverna e o tom sóbrio do texto-fonte.
- source_word: ܐܪܥܐ
  choice: terra
  rationale: Preserva a formulação genitiva tradicional «caverna da terra», sem explicar ou reinterpretar a imagem.
