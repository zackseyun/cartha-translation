  text: For the spirit of man is the ruler of the world, yet they do not know what belongs to it.
translation:
  language: pt
  text: Pois o espírito do ser humano governa o mundo,[a] mas eles não sabem o que lhe pertence.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “A multidão do mundo é o espírito do ser humano”.'
    reason: Registra a leitura alternativa anteriormente adotada e preserva a incerteza lexical e sintática da tradição textual.
lexical_decisions:
- source_word: ܪܘܚ
  choice: espírito
  rationale: Preserva o sentido básico do siríaco e a linguagem antropológica do contexto.
- source_word: ܡܕܒܪܢܘܬܐ / campo de ܡܕܒܪ
  choice: governa
  rationale: Expressa de modo natural a ideia de dirigir ou reger, evitando o tom burocrático de “administrar”.
- source_word: ܥܠܡܐ
  choice: mundo
  rationale: Equivalente corrente e contextual para o âmbito sobre o qual se exerce o governo.
- source_word: ܕܝܠܗܘܢ / expressão de pertença
  choice: o que lhe pertence
  rationale: Mantém a formulação ampla e não especifica aquilo que o texto deixa indefinido.
theological_decisions:
- issue: Alcance do governo atribuído ao espírito humano
  choice: “governa o mundo”
  alternative: “é o governante do mundo”
  rationale: A forma verbal soa mais natural em português e conserva a forte afirmação do texto sem explicar sua natureza ou importar uma doutrina antropológica específica.
- issue: Leitura alternativa da primeira oração
  choice: Texto principal com sentido de governo; variante em nota
  alternative: “A multidão do mundo é o espírito do ser humano”
  rationale: A evidência transmitida admite uma leitura anterior muito diferente; a nota preserva essa incerteza sem tornar obscuro o texto principal.
- issue: Referente de “eles” e de “lhe”
  choice: Manter os pronomes sem identificar explicitamente seus referentes
  alternative: Substituí-los por referentes interpretativos
  rationale: A passagem é contextualmente difícil, e explicitar os referentes resolveria uma ambiguidade que o material fornecido não permite solucionar com segurança.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. “Ser humano” evita que “homem” seja entendido apenas como masculino. A redação conserva a tensão e a ambiguidade pronominal do texto.
