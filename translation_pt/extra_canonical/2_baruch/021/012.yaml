  text: For even the former things that have passed away are not distant from you, with all their possessors and their remembrance.
translation:
  language: pt
  text: Pois até as coisas de outrora, que já passaram, não estão distantes de ti, com todos os seus possuidores[a] e a lembrança delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “seus senhores” ou “seus donos”.
    reason: O termo siríaco designa literalmente aqueles a quem algo pertence ou que exercem domínio sobre isso; conforme o contexto, também pode indicar seus responsáveis ou autores.
lexical_decisions:
- source_word: ܩܕܡܝܬܐ (qadmayāṯā)
  choice: as coisas de outrora
  rationale: O termo significa aquilo que é anterior ou antigo. O substantivo implícito é mantido de modo abrangente, sem restringi-lo a “ofensas”.
- source_word: ܡܪܝܗܝܢ (mārayhen)
  choice: seus possuidores
  rationale: O sentido básico é “seus senhores/donos”. “Possuidores” preserva a relação ampla com as coisas mencionadas e evita a conotação criminal indevida de “perpetradores”.
- source_word: ܕܘܟܪܢܐ (dukrānā)
  choice: a lembrança delas
  rationale: Traduz o campo semântico de memória, lembrança ou recordação e explicita naturalmente em português o referente feminino plural.
theological_decisions:
- issue: Alcance de “coisas de outrora”
  choice: Manter a expressão genérica
  alternative: “ofensas anteriores”
  rationale: O texto não exige uma referência específica a pecados ou delitos; restringi-lo dessa forma introduziria uma interpretação teológica não expressa no termo.
- issue: Identidade dos “possuidores”
  choice: Não identificar o grupo de maneira mais específica
  alternative: “autores” ou “perpetradores”
  rationale: O termo siríaco admite a ideia de senhores, donos ou, em certos contextos, responsáveis. O contexto disponível não justifica resolver essa amplitude em favor de agentes culpados.
translation_notes:
  register: Português moderno, digno e de leitura corrente. A formulação conserva a amplitude do original e a segunda pessoa singular usada na oração dirigida a Deus.
