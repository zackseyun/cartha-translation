base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/021/019.yaml
  text: Therefore, the one who lives is not gladdened in his life. And I considered the sons of men, and I saw that they were not many and were nothing but the vanity of Adam.
translation:
  language: pt
  text: Por isso, quem vive não se alegra em sua vida.[a] Considerei os filhos dos homens e vi que não eram muitos e não passavam da vaidade de Adão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quem vive, enquanto dura sua vida, não se alegra”.'
    reason: A construção pode ser entendida de modo locativo, “em sua vida”, ou temporal, “enquanto dura sua vida”.
  - marker: b
    text: “Vaidade” também pode ter o sentido de vazio, futilidade ou transitoriedade; “Adão” pode evocar tanto a pessoa de Adão como a humanidade.
    reason: A nota preserva a amplitude lexical e a ressonância coletiva do nome sem substituir a redação do texto.
lexical_decisions:
- source_word: ܚܝܐ / ܚܝ̈ܐ
  choice: quem vive / vida
  rationale: Mantém em português a repetição conceitual do siríaco e evita acrescentar uma interpretação sobre a duração ou a qualidade da vida.
- source_word: ܒܢ̈ܝ ܐܢܫܐ
  choice: filhos dos homens
  rationale: Reproduz a expressão semítica coletiva em registro bíblico claro, referindo-se à humanidade.
- source_word: ܣܪܝܩܘܬܐ (sentido refletido na tradição textual como ‘vaidade’)
  choice: vaidade
  rationale: Preserva o campo semântico de vazio, transitoriedade e inutilidade sem reduzi-lo a uma única nuance.
- source_word: ܐܕܡ
  choice: Adão
  rationale: Mantém o nome próprio e sua possível ressonância coletiva com a humanidade, sem decidir entre as duas leituras.
theological_decisions:
- issue: Relação entre Adão e a humanidade
  choice: vaidade de Adão
  alternative: futilidade da humanidade
  rationale: A formulação conserva a referência explícita a Adão e não dissolve sua possível dimensão representativa em uma paráfrase teológica.
- issue: Sentido da alegria na vida
  choice: não se alegra em sua vida
  alternative: não se alegra enquanto dura sua vida
  rationale: A tradução principal segue a construção mais direta, enquanto a nota registra a leitura temporal possível sem torná-la obrigatória.
translation_notes:
  register: Português moderno, digno e acessível, com leve tonalidade bíblica em “filhos dos homens”. A sintaxe foi mantida direta, e as ambiguidades relevantes foram registradas em notas.
