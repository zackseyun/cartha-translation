translation:
  language: pt
  text: E que ninguém que reina e se tornou rei se glorie nem se ensoberbe com o orgulho humano.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E que nada que reine, que tenha se tornado rei, se glorie nem se ensoberbe com o orgulho humano”.'
    reason: A tradição textual permite entender o sujeito de forma impessoal; a leitura é preservada em nota por ser menos natural no texto principal.
lexical_decisions:
- source_word: ܡܠܟܘ / ܡܠܟܐ
  choice: reina / se tornou rei
  rationale: Mantém a repetição régia refletida pela tradição textual e pela camada inglesa auditada, sem reduzi-la a uma única ideia.
- source_word: ܫܘܒܚܐ (contexto provável)
  choice: se glorie
  rationale: Expressa vanglória ou exaltação de si em português natural e digno.
- source_word: pride of man (retroversão da tradição)
  choice: orgulho humano
  rationale: Forma corrente que preserva o sentido genérico de orgulho próprio dos seres humanos.
theological_decisions:
- issue: Identidade do sujeito que reina
  choice: ninguém que reina e se tornou rei
  alternative: nada que reine e tenha se tornado rei
  rationale: O referente pessoal é mais coerente com 'rei' e evita uma formulação artificial, embora a transmissão admita leitura impessoal.
- issue: Relação entre gloriar-se e ensoberbecer-se
  choice: dois verbos coordenados
  alternative: um único predicado intensificado
  rationale: Preserva o paralelismo e não funde duas nuances morais distintas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; tom solene sem arcaísmos. O marcador [a] aparece no texto principal.
