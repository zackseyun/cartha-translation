review_pass:
  verdict: revise
  source_fidelity: O siríaco de 21:4 contém uma construção difícil em ܕܡܨܪ ܒܡܒܘܥܐ ܕܐܒܠܐ. A imagem de uma fonte e do subsequente fluir das lágrimas deve ser mantida, mas «se abre numa fonte» resolve de modo demasiado específico um verbo cuja leitura é incerta e que também pode evocar aperto ou aflição. «Se angustia diante da fonte do lamento» conserva o lamento e não apresenta a abertura como inequívoca.
  naturalness: A redação revista é idiomática em português atual, mantém um tom poético elevado e evita a construção um tanto opaca «as lágrimas dos meus olhos», sem perder a referência explícita aos olhos.
  terminology: «Lamento» traduz adequadamente ܐܒܠܐ no contexto de dor e pranto. «Fonte» preserva a metáfora hídrica. Não há termos teológicos ou nomes próprios a normalizar.
  issues:
  - severity: medium
    issue: A tradução principal fixa «se abre» para o verbo siríaco difícil ܡܨܪ.
    rationale: A nota reconhece que o termo também pode indicar aperto ou aflição; por isso, a leitura de abertura/ruptura não deve ser imposta no texto principal.
  - severity: low
    issue: A nota alternativa «é apertado junto à fonte» é pouco natural em português e não esclarece com precisão a alternativa.
    rationale: Uma nota que apresente diretamente a possibilidade de «se abre/rompe numa fonte» comunica melhor a ambiguidade relevante.
  revised_text: “Ai do meu coração, pois ele se angustia diante da fonte do lamento; de lá correm lágrimas dos meus olhos, e não me farto de chorar.”
