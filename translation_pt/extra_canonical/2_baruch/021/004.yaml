    reason: Preserva a ambiguidade lexical e sintática de ܡܨܪ sem impor como certa a imagem de abertura ou ruptura.
  revision_rationale: A revisão retém a sequência imagética — fonte de lamento, lágrimas que dela correm e choro insaciável —, mas escolhe para o texto principal uma formulação que não decide a difícil leitura do verbo siríaco. A alternativa imagética é devidamente registrada em nota.
