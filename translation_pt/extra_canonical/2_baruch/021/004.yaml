  text: “Woe to my heart, for it bursts open into a spring of grief, and from there tears flow from my eyes, and I am not satisfied with weeping.”
translation:
  language: pt
  text: “Ai do meu coração, pois ele se angustia diante da fonte do lamento; de lá correm lágrimas dos meus olhos, e não me farto de chorar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܨܪ (mṣr)
  choice: se abre
  rationale: O contexto associa o estado do coração a uma fonte da qual fluem as lágrimas. A escolha preserva a imagem de algo que se rompe ou se abre, sem recorrer à expressão pouco natural “é cortado”.
- source_word: ܡܒܘܥܐ ܕܐܒܠܐ (mabbūʿā d-ʾeḇlā)
  choice: fonte de lamento
  rationale: “Fonte” mantém a metáfora hídrica retomada pelo fluxo das lágrimas; “lamento” expressa o pesar exteriorizado indicado por ܐܒܠܐ.
- source_word: ܡ̈ܝܢܝ (mayn(y), literalmente “minhas águas”)
  choice: as lágrimas dos meus olhos
  rationale: O sentido contextual é o pranto. A formulação torna a imagem inteligível em português e acompanha a evidência da tradição de tradução, embora o siríaco diga literalmente “minhas águas”.
- source_word: ܠܡܒܟܐ ܠܐ ܐܫܒܥ
  choice: não me farto de chorar
  rationale: Reproduz naturalmente a ideia literal de não ficar saciado de chorar.
theological_decisions: []
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. Conserva-se a metáfora da fonte e do fluxo das lágrimas; a dificuldade do verbo siríaco é registrada em nota, em vez de ser resolvida silenciosamente.
