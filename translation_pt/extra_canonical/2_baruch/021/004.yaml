revisions:
- from: “Ai do meu coração, pois ele se abre numa fonte de lamento,[a] e de lá correm as lágrimas dos meus olhos; não me farto de chorar.”
  to: “Ai do meu coração, pois ele se angustia diante da fonte do lamento; de lá correm lágrimas dos meus olhos, e não me farto de chorar.”
  rationale: A revisão retém a sequência imagética — fonte de lamento, lágrimas que dela correm e choro insaciável —, mas escolhe para o texto principal uma formulação que não decide a difícil leitura do verbo siríaco. A alternativa imagética é devidamente registrada em nota.
