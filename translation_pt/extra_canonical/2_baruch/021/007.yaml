translation:
  language: pt
  text: E tu conheces o número dos que passam e dos que permanecem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܕܥ ܐܢܬ (yādaʿ ʾant)
  choice: tu conheces
  rationale: Reproduz a declaração direta na segunda pessoa, dirigida a Deus, sem transformá-la em oração relativa.
- source_word: ܡܢܝܢܐ (menyānā)
  choice: o número
  rationale: Mantém o substantivo concreto do siríaco, em vez de parafrasear como “quantos são”.
- source_word: ܕܥܒܪܢ (d-ʿābrān)
  choice: dos que passam
  rationale: Preserva a amplitude do verbo, que pode sugerir transitoriedade ou partida, sem restringi-lo explicitamente à morte.
- source_word: ܘܕܡܩܘܝܢ (w-d-maqwayn)
  choice: e dos que permanecem
  rationale: Conserva o paralelismo e o contraste com aqueles que passam.
theological_decisions:
- issue: Alcance do contraste entre os que passam e os que permanecem
  choice: Manter a formulação aberta “passam”/“permanecem”
  alternative: Explicitar como “morrem”/“continuam vivos” ou “perecem”/“subsistem”
  rationale: O siríaco expressa o contraste sem identificar de modo inequívoco se ele se refere à morte, à transitoriedade humana ou a outra forma de permanência; a tradução não deve resolver essa ambiguidade.
translation_notes:
  register: Português atual, digno e claro. O pronome “tu” preserva o tratamento direto próprio da oração e tem ampla inteligibilidade no português internacional, inclusive para leitores brasileiros.
