translation:
  language: pt
  text: Desde o princípio do mundo, tu chamas as coisas que não existem, e elas te escutam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܪܝܫ ܥܠܡܐ
  choice: Desde o princípio do mundo
  rationale: Reproduz naturalmente o valor temporal da expressão siríaca e mantém sua posição enfática.
- source_word: ܠܥܡ̣ܡܐ ܕܒ̣ܕܓܠܐ ܠܐ
  choice: os que não existem
  rationale: O texto transmitido parece apresentar corrupção ou leitura gráfica difícil neste ponto; a tradução segue o sentido sustentado pela tradição textual e pela camada de consulta, sem acrescentar a ideia temporal de “ainda”.
- source_word: ܡܫܬܡܥܝܢ ܠܝ
  choice: eles te obedecem
  rationale: O verbo pode significar ouvir, dar ouvidos ou obedecer. No contexto do chamado divino, “obedecem” expressa de modo natural que respondem eficazmente ao chamado.
theological_decisions:
- issue: O chamado divino dirigido aos inexistentes
  choice: tu chamas os que não existem
  alternative: tu chamas as coisas que não existem
  rationale: O plural retomado por “eles” permite uma formulação abrangente e personificada. Evitou-se “ainda não existem”, que explicitaria uma sequência temporal não expressa com segurança no texto.
- issue: Resposta ao chamado
  choice: eles te obedecem
  alternative: eles te escutam
  rationale: “Obedecem” comunica a força contextual do siríaco, mas sem desenvolver uma doutrina específica sobre criação ou predestinação.
translation_notes:
  register: Português moderno, claro e reverente, com tratamento divino na segunda pessoa singular. A frase preserva a tensão poética entre inexistência e resposta ao chamado.
