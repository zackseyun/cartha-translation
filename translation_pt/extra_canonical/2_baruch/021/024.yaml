lexical_decisions:
- source_word: ܡܬܝܕܥܐ
  choice: foi revelado
  rationale: No contexto, a forma passiva aponta para algo que se torna conhecido ou é dado a conhecer; “foi revelado” preserva o sentido apresentado pela camada inglesa auditada.
- source_word: ܡܢ ܒܬܪ
  choice: depois
  rationale: Expressa naturalmente a relação temporal posterior no português moderno.
- source_word: ܠܐ ... ܡܬܚܫܒܝܢ
  choice: não entendem
  rationale: O campo semântico inclui pensar, considerar ou compreender; “não entendem” se ajusta à pergunta sem especificar indevidamente a causa da incompreensão.
theological_decisions:
- issue: Referente de “isso” e sujeito de “eles”
  choice: Manter ambos sem explicitação
  alternative: Identificar no texto o que foi revelado e quem não entende
  rationale: O recorte e a tradição textual não oferecem segurança suficiente para resolver os referentes; a tradução preserva a ambiguidade.
translation_notes:
  register: Português atual, claro e digno, com estrutura interrogativa natural. A vírgula antes da oração condicional favorece a leitura em português sem alterar a relação lógica.
