  yaml_path: translation/extra_canonical/2_baruch/021/029.yaml
  text: And because the world was created for a time, and those in it are sustained with much trouble, command concerning evil.
translation:
  language: pt
  text: E, porque o mundo foi criado por um tempo[a], e os que nele estão são sustentados em meio a muita aflição[b], dá ordem a respeito do mal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o tempo”.'
    reason: A construção pode ser entendida como duração ou relação com o tempo.
  - marker: b
    text: 'Outra leitura possível: “são sustentados com muito sofrimento”.'
    reason: A formulação do testemunho é difícil; a alternativa preserva uma ligação mais direta entre sustento e sofrimento.
  - marker: c
    text: 'Ou: “ordena quanto ao mal”.'
    reason: A expressão é abrupta e seu alcance permanece ambíguo no contexto.
lexical_decisions:
- source_word: ܥܠܡܐ / ܙܒܢܐ
  choice: o mundo / por um tempo
  rationale: Mantém a distinção entre o mundo e o período limitado de sua existência, em português natural.
- source_word: ܡܣܟܝܢ (leitura contextual incerta no testemunho fornecido)
  choice: são sustentados
  rationale: Segue o sentido contextual preservado pela camada de consulta, sem especificar indevidamente o modo de sustento.
- source_word: ܒܝܫܬܐ (sentido reconstruído pelo contexto e pela tradição textual)
  choice: o mal
  rationale: Emprega o termo amplo e teologicamente não restritivo, sem decidir se se trata de mal moral, sofrimento ou calamidade.
theological_decisions:
- issue: Temporalidade do mundo criado
  choice: criado por um tempo
  alternative: criado para o tempo
  rationale: Expressa duração limitada sem transformar 'tempo' em finalidade da criação.
- issue: Referente de “mal”
  choice: o mal
  alternative: a calamidade
  rationale: Preserva a amplitude e a tensão da expressão, evitando restringi-la a pecado moral ou desastre.
- issue: Força do imperativo
  choice: dá ordem
  alternative: decreta
  rationale: Conserva o apelo direto a Deus sem introduzir linguagem técnica de decreto divino.
