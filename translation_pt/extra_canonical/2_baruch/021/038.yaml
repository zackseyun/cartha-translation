translation:
  language: pt
  text: E seja dado a conhecer aos que estão com eles, aos que são como eles, que este é o tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܕܥ (raiz semítica correspondente ao sentido preservado na tradição textual)
  choice: seja dado a conhecer
  rationale: Mantém a formulação impessoal e volitiva da oração, sem reduzir o sentido a uma simples constatação.
- source_word: ܙܒܢܐ
  choice: tempo
  rationale: É o equivalente amplo e natural para o termo siríaco, preservando sua possível referência tanto ao período presente quanto ao momento determinado.
theological_decisions:
- issue: Identidade dos dois grupos mencionados
  choice: “aos que estão com eles, aos que são como eles”
  alternative: “aos que, estando com eles, são semelhantes a eles”
  rationale: A redação conserva a justaposição e não decide se as duas expressões descrevem exatamente o mesmo grupo ou grupos estreitamente relacionados.
- issue: Sentido escatológico de “tempo”
  choice: tempo
  alternative: momento determinado
  rationale: Evita explicitar uma interpretação escatológica mais específica do que a redação permite.
translation_notes:
  register: Português atual, digno e de leitura ampla; a repetição de “aos que” foi mantida para tornar claras as relações da frase sem eliminar sua ambiguidade referencial.
