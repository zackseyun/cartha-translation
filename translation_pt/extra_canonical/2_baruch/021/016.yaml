translation:
  language: pt
  text: Somente tu conheces o curso dos tempos,[a] sem seres abalado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o ensinamento dos tempos”; o termo também pode transmitir a ideia de sua ordenação.
    reason: O substantivo siríaco ܝܘܠܦܢܐ significa literalmente “ensino” ou “instrução”, mas neste contexto pode referir-se ao padrão ou à ordem dos tempos.
lexical_decisions:
- source_word: ܝܘܠܦܢܘܗܝ ܕܙܒ̈ܢܐ
  choice: o curso dos tempos
  rationale: ܝܘܠܦܢܐ normalmente denota ensino ou instrução, mas, nesta oração sobre o conhecimento divino dos tempos, a expressão parece indicar o padrão ou curso que eles seguem. “Curso” comunica esse sentido em português natural sem impor a ideia mais específica de um decreto.
- source_word: ܟܕ ܠܐ ܢܬܬܙܝܥ
  choice: sem seres abalado
  rationale: Mantém a imagem verbal de não ser sacudido ou perturbado e concorda com a segunda pessoa singular dirigida a Deus.
- source_word: ܐܢܬ ܒܠܚܘܕܝܟ ܝ̣ܕܥܬ
  choice: Somente tu conheces
  rationale: Reproduz a ênfase exclusiva de ܒܠܚܘܕܝܟ em ordem idiomática no português moderno.
theological_decisions:
- issue: Sentido de ܝܘܠܦܢܐ aplicado aos tempos
  choice: curso dos tempos
  alternative: ensinamento dos tempos; ordenação dos tempos
  rationale: O contexto fala do conhecimento exclusivo de Deus acerca dos tempos. “Curso” preserva a noção contextual de padrão ou ordem sem transformar explicitamente o termo em “decreto”; a acepção lexical mais literal é registrada em nota.
- issue: Referente de “sem seres abalado”
  choice: A expressão qualifica o “tu” divino
  alternative: Tomá-la como descrição dos tempos, “sem que sejam abalados”
  rationale: A forma verbal está na segunda pessoa masculina singular, favorecendo a referência ao interlocutor divino, e não ao plural “tempos”.
translation_notes:
  register: Português moderno, claro e reverente, com tratamento divino na segunda pessoa do singular. A formulação conserva a ênfase em “somente tu” e evita vocabulário denominacional.
