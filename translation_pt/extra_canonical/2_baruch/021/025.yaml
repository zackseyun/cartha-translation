translation:
  language: pt
  text: Se aquilo que está reservado para o mundo[a] não estivesse neles,[b] eles seriam consolados por sua esperança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que foi guardado para o mundo”.'
    reason: Preserva a alternativa lexical de algo depositado ou guardado.
  - marker: b
    text: 'Ou: “Se não houvesse neles aquilo que está reservado para o mundo”.'
    reason: Registra a construção existencial alternativa e a possível diferença de foco sintático.
lexical_decisions:
- source_word: ܕܒ̣ܥܝܕܐ
  choice: aquilo que está reservado
  rationale: Expressa de modo natural a ideia de algo guardado ou destinado para o futuro, sem recorrer a uma formulação arcaica.
- source_word: ܣܒܪ / ܣܒܪܐ
  choice: esperança
  rationale: Neste contexto escatológico, o campo semântico aponta para expectativa confiante, adequadamente traduzida por “esperança”.
- source_word: ܒܘܝܐ / cognato contextual
  choice: encontrariam consolo
  rationale: Formulação portuguesa natural que preserva a ideia passiva ou resultativa de serem consolados.
theological_decisions:
- issue: Natureza do que está reservado para o mundo
  choice: aquilo que está reservado para o mundo
  alternative: aquilo que foi guardado para o mundo
  rationale: Mantém indefinido o conteúdo escatológico, sem identificá-lo com uma recompensa, juízo ou realidade específica.
- issue: Referente pronominal de “neles” e “eles”
  choice: preservar os pronomes sem explicitar o referente
  alternative: substituir os pronomes por um grupo nominal interpretativo
  rationale: O recorte e a tradição textual não tornam inequívoco o referente; explicitá-lo resolveria indevidamente uma ambiguidade genuína.
