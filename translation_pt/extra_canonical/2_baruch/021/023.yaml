translation:
  language: pt
  text: Pois, no seu reino, vê-se a morte dos filhos dos homens. E o que de fato existe[a] cujo fim não é conhecido?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que há que realmente seja”.'
    reason: Registra uma forma mais literal de representar a construção existencial, embora menos natural em português.
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: reino
  rationale: Mantém o sentido concreto de domínio ou reinado sem introduzir uma interpretação denominacional.
- source_word: ܡܘܬܐ
  choice: morte
  rationale: Equivalente direto e natural para o substantivo siríaco.
- source_word: ܒ̈ܢܝ ܐܢܫܐ
  choice: filhos dos homens
  rationale: Preserva a expressão semítica coletiva, aqui referente aos seres humanos, em vez de a reduzir silenciosamente a uma paráfrase.
- source_word: ܡܬܚܙܐ
  choice: vê-se
  rationale: Conserva a forma passiva e impessoal da afirmação, sem especificar um observador ausente do texto.
- source_word: ܐܝܬ
  choice: existe
  rationale: Expressa de modo atual e inteligível a linguagem existencial da pergunta.
theological_decisions:
- issue: Referente do possessivo em “seu reino”
  choice: Manter “seu” em minúscula, sem explicitar o referente
  alternative: “no reino de Deus” ou “em Seu reino”
  rationale: O verso isolado não exige que o referente seja inserido no corpo do texto; preserva-se a coesão com o contexto e evita-se acrescentar uma identificação interpretativa.
- issue: Alcance da pergunta final
  choice: “cujo fim não é conhecido” modifica aquilo que de fato existe
  alternative: Tratar “e cujo fim...” como uma oração coordenada ou independente
  rationale: Esta leitura produz a construção interrogativa mais coerente, mas a segmentação sintática continua registrada em nota por causa da ambiguidade textual.
- issue: Sentido existencial da segunda pergunta
  choice: “o que de fato existe”
  alternative: “o que há que realmente seja”
  rationale: A formulação escolhida é natural em português e conserva o peso ontológico da pergunta sem tentar resolvê-la teologicamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Vê-se” mantém a voz impessoal; “filhos dos homens” conserva o semitismo deliberadamente. A pergunta final foi formulada com fluidez, enquanto as duas ambiguidades relevantes foram mantidas nas notas.
