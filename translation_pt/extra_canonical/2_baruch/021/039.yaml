  text: Bring near those who are sought, and let what began in toil rejoice at the arrival of your glory.
translation:
  language: pt
  text: Aproxima os que são buscados, e que aquilo que começou em sofrimento se alegre com a chegada da tua glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܪܒ / ideia de fazer chegar perto (conforme a tradição textual consultada)
  choice: Aproxima
  rationale: Expressa de modo direto o movimento de trazer para perto, mantendo a forma de súplica dirigida a Deus.
- source_word: os que são procurados/buscados
  choice: os que são buscados
  rationale: Preserva a construção passiva e sua ambiguidade quanto a quem os busca, sem acrescentar uma identificação ausente do texto.
- source_word: toil / sofrimento penoso
  choice: sofrimento
  rationale: É natural em português e conserva a ideia de um começo marcado por aflição, sem restringi-la apenas a trabalho físico.
- source_word: arrival/coming of your glory
  choice: chegada da tua glória
  rationale: Mantém a imagem da glória que chega e a relação temporal que provoca alegria.
theological_decisions:
- issue: Identidade dos que são buscados
  choice: Não identificar explicitamente o grupo.
  alternative: Traduzir como “teus escolhidos”, “exilados” ou “os que te buscam”.
  rationale: O texto não explicita a identidade nem transforma a construção passiva em ação praticada por esse grupo.
- issue: Relação entre sofrimento e glória
  choice: Manter que aquilo que começou em sofrimento se alegra com a chegada da glória.
  alternative: Explicitar uma doutrina de recompensa, restauração ou era messiânica.
  rationale: A formulação conserva a tensão poética e escatológica sem acrescentar uma interpretação confessional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção “e que... se alegre” mantém o tom de petição e evita uma sequência imperativa pouco natural. Como o recorte siríaco fornecido é um agrupamento de páginas com sobreposição e localização versicular incerta, a redação foi controlada pela camada inglesa auditada e mantida deliberadamente próxima de suas ambiguidades.
