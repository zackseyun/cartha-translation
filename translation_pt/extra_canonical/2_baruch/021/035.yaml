lexical_decisions:
- source_word: ܫܘܒܚܐ
  choice: glória
  rationale: Equivalente natural e tradicional para o substantivo siríaco que denota glória, honra ou esplendor.
- source_word: ܪܒܘܬܐ
  choice: grandeza
  rationale: Preserva a ideia de magnitude sem intensificar ou explicar além do texto.
- source_word: ܛܝܒܘܬܐ
  choice: bondade
  rationale: Expressa de modo amplo a qualidade benévola atribuída a Deus, sem restringi-la a uma doutrina específica.
theological_decisions:
- issue: Modo de manifestação dos atributos divinos
  choice: 'Formulação passiva: “seja vista” e “seja conhecida”'
  alternative: “manifesta a tua glória” e “revela a grandeza da tua bondade”
  rationale: A forma passiva conserva o pedido para que os atributos divinos se tornem perceptíveis, sem acrescentar um agente ou modo de revelação não explicitado.
