  text: Therefore from now on show your greatness, and do not overlook what is brought to nothing under the kingdom of death.
translation:
  language: pt
  text: Portanto, de agora em diante, manifesta a tua grandeza e não ignores o que é reduzido a nada sob o reino da morte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܠ ܗܢܐ
  choice: Portanto
  rationale: Expressa de modo natural a conclusão ou consequência introduzida pela locução siríaca.
- source_word: grandeza (conforme a tradição textual do versículo)
  choice: a tua grandeza
  rationale: Mantém a formulação dirigida a Deus sem substituir “grandeza” por conceitos interpretativos como poder ou glória.
- source_word: overlook / deixar de considerar
  choice: não ignores
  rationale: Verbo corrente e direto que preserva a ideia de não desatender aquilo que está perecendo.
- source_word: reino da morte
  choice: reino da morte
  rationale: Conserva a personificação e a imagem régia da morte, sem atenuá-la para “poder da morte”.
theological_decisions:
- issue: A grandeza divina é invocada diante do domínio destrutivo da morte.
  choice: Preservar “manifesta a tua grandeza” e “reino da morte”.
  alternative: Explicitar como pedido para Deus exercer seu poder salvador sobre os mortais.
  rationale: A tradução mantém a tensão e as imagens do texto sem acrescentar uma interpretação soteriológica específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A redação é concisa e mantém a linguagem de oração dirigida a Deus.
