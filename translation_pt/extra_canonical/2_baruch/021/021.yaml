  text: For if this life alone were given to human beings, nothing would be more bitter than this.
translation:
  language: pt
  text: Pois, se aos seres humanos fosse dada apenas esta vida, nada seria mais amargo do que isto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: vida
  rationale: Representa de modo direto e natural o conceito de vida no contexto da existência humana presente.
- source_word: ܒܢܝ̈ܢܫܐ
  choice: seres humanos
  rationale: Expressa em português atual a referência coletiva à humanidade, sem restringi-la ao sexo masculino.
- source_word: ܡܪܝܪ
  choice: amargo
  rationale: Preserva a metáfora avaliativa de amargura para uma existência limitada somente à vida presente.
theological_decisions:
- issue: Escopo da exclusividade desta vida
  choice: esta vida fosse a única dada
  alternative: apenas esta vida fosse dada
  rationale: A formulação escolhida deixa claro que a exclusividade recai sobre “esta vida”, sem decidir além do texto qual seria precisamente a vida contrastante.
- issue: Força da afirmação condicional
  choice: nada seria mais amargo
  alternative: nada poderia ser mais amargo
  rationale: O condicional simples preserva a comparação enfática e corresponde naturalmente à construção hipotética, sem acrescentar uma ideia explícita de possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem foi ajustada para tornar inequívoco o alcance de “única”, preservando o caráter hipotético e a tensão escatológica do enunciado.
