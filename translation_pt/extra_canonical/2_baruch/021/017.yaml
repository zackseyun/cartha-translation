translation:
  language: pt
  text: Vê, pois somente tu és capaz de sustentar[c] todos os que são,[a] os que foram e os que serão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a súplica dos que estão diante de ti”.'
    reason: O siríaco também admite uma construção em que o objeto de “sustentar” é a petição dos que estão perante Deus.
  - marker: b
    text: 'Ou: “e dos que foram e dos que serão”.'
    reason: Nessa leitura alternativa, os dois grupos seguintes se ligam a “a súplica”, requerendo a preposição “dos”.
  - marker: c
    text: 'Ou: “suportar”.'
    reason: Registra a alternativa mais literal para o verbo; “sustentar” comunica com mais naturalidade o sentido contextual em português.
lexical_decisions:
- source_word: ܚܘܪ
  choice: Olha
  rationale: Preserva o imperativo que chama a atenção, em linguagem direta e natural.
- source_word: ܒܠܚܘܕܝܟ
  choice: somente tu
  rationale: Mantém a ênfase exclusiva do siríaco sem tornar a frase artificial.
- source_word: ܡܫܟܚ ܐܢܬ
  choice: és capaz
  rationale: Expressa naturalmente a ideia de capacidade no português contemporâneo.
- source_word: ܕܬܣܒܪ
  choice: sustentar
  rationale: Segue a leitura contextual adotada no texto auditado, comunicando a ação divina de amparar ou manter os seres, sem ocultar a possibilidade lexical indicada em nota.
- source_word: ܐܝܠܝܢ ܕܩܕܡ̈ܝܟ
  choice: todos os que existem
  rationale: Adota no texto principal a leitura contextual que abrange os seres presentes, preservando em nota a alternativa mais formal ligada aos que estão diante de Deus.
theological_decisions:
- issue: A extensão temporal da ação divina
  choice: todos os que existem, os que já passaram e os que ainda virão
  alternative: a súplica dos que estão diante de ti, e dos que passaram e dos que virão
  rationale: A redação principal conserva a tríade presente, passada e futura da camada auditada, mas a variante é registrada porque a sintaxe siríaca permite outra relação entre os termos.
- issue: Sentido do verbo aplicado à ação de Deus
  choice: sustentar
  alternative: suportar
  rationale: ‘Sustentar’ é idiomático e inclui amparo e manutenção, enquanto ‘suportar’ pode sugerir mera tolerância em português; a alternativa mais literal permanece em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem direta. A repetição de “os que” preserva o paralelismo temporal. Os marcadores foram posicionados junto aos segmentos a que cada variante se refere.
