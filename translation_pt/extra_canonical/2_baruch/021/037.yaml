  text: And let the treasuries of the souls restore those who are shut up in them, that there may be a gathering of the sons of men, as you commanded from of old.
translation:
  language: pt
  text: E que os depósitos das almas devolvam os que neles estão encerrados, para que haja uma reunião dos filhos dos homens, conforme ordenaste desde a antiguidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível: “que os que estão encerrados neles sejam devolvidos aos filhos dos homens, conforme ordenaste desde a antiguidade, e sejam reunidos na assembleia”.'
    reason: Registra uma divisão sintática alternativa anteriormente adotada, embora a leitura do texto principal corresponda melhor à sintaxe siríaca.
lexical_decisions:
- source_word: ܐܘܨܪ̈ܐ ܕܢܦܫ̈ܬܐ
  choice: os depósitos das almas
  rationale: “Depósitos” comunica lugares onde as almas são guardadas, preservando a imagem escatológica sem sugerir que as próprias almas sejam riquezas.
- source_word: ܢܦܩܘܢ / valor contextual de restituição
  choice: devolvam
  rationale: Expressa a libertação e entrega dos que estavam retidos, de acordo com a sintaxe atestada para o versículo e com o contexto da reunião final.
- source_word: ܟܢܘܫܝܐ
  choice: reunião
  rationale: Mantém o sentido de ajuntamento ou congregação sem acrescentar uma identificação eclesiológica específica.
- source_word: ܒܢܝܢܫܐ
  choice: filhos dos homens
  rationale: Preserva a expressão semítica coletiva e sua textura literária; no contexto, refere-se à humanidade.
- source_word: ܡܢ ܩܕܝܡ
  choice: desde a antiguidade
  rationale: Forma natural em português para uma ordem estabelecida desde tempos remotos.
theological_decisions:
- issue: Relação sintática entre os depósitos, os encerrados e a reunião
  choice: Os depósitos devolvem os que neles estão encerrados, com a finalidade de haver uma reunião dos filhos dos homens.
  alternative: Os que estão encerrados nos depósitos são devolvidos aos filhos dos homens e reunidos na assembleia.
  rationale: 'A primeira leitura corresponde melhor à construção siríaca indicada pela evidência de controle: o objeto de “devolvam” são os encerrados, e “dos filhos dos homens” depende de “reunião”.'
- issue: Natureza da reunião final
  choice: reunião
  alternative: assembleia
  rationale: “Reunião” conserva a referência geral ao ajuntamento escatológico e evita especificar uma instituição ou comunidade teológica não explicitada pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva as imagens de “depósitos das almas” e “filhos dos homens”, e mantém em nota a alternativa sintática genuína sem incorporá-la ao texto principal.
