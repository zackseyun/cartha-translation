  text: Let Sheol be sealed, so that from now on it may not receive the dead.
translation:
  language: pt
  text: Que o Sheol[a] seja selado, para que, de agora em diante, não receba os mortos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, o mundo dos mortos.
    reason: Esclarece ao leitor comum o referente de “Sheol” sem reduzir seu alcance no texto principal.
lexical_decisions:
- source_word: ܬܬܚܬܡ (tethkhtem)
  choice: seja selado
  rationale: O verbo indica ser fechado com um selo; evita a leitura anterior, não sustentada pelo siríaco, de que o Sheol seria “agitado”.
- source_word: ܬܩܒܠ (tqabbel)
  choice: receba
  rationale: Reproduz o sentido normal de receber ou acolher, em vez de introduzir a ideia distinta de reter.
- source_word: ܫܝܘܠ (Sheol)
  choice: Sheol
  rationale: Mantém o termo tradicional para o domínio dos mortos, sem o identificar automaticamente com inferno ou sepultura.
theological_decisions:
- issue: Identidade do Sheol
  choice: Manter “Sheol” com nota explicativa
  alternative: “mundo dos mortos” ou “inferno” no texto principal
  rationale: A transliteração preserva a amplitude conceitual do termo e evita impor uma identificação teológica mais específica.
translation_notes:
  register: Formulação breve, solene e natural em português moderno. A construção volitiva “Que ... seja” preserva a força do pedido, e “de agora em diante” expressa claramente a perspectiva temporal.
