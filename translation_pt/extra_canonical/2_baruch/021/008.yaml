translation:
  language: pt
  text: E os exércitos do céu sabem por meio do espírito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sopro”.'
    reason: O siríaco ܪܘܚܐ pode significar “espírito”, “sopro” ou “vento”; “sopro” é uma alternativa lexical possível neste contexto.
lexical_decisions:
- source_word: ܐܘܡܘܗܝ ܕܫܡܝܐ
  choice: os exércitos do céu
  rationale: Traduz a expressão coletiva celestial em linguagem clara e preserva a construção com “do céu”, sem identificar mais precisamente esses seres.
- source_word: ܒܪܘܚܐ
  choice: por meio do espírito
  rationale: Mantém o valor instrumental da preposição e traduz ܪܘܚܐ por “espírito”, em minúscula, sem impor uma identificação trinitária; a possível acepção “sopro” é registrada em nota.
theological_decisions:
- issue: Identidade do “espírito”
  choice: espírito, em minúscula
  alternative: Espírito, com maiúscula
  rationale: O siríaco não especifica que se trate do Espírito Santo. A minúscula preserva a ambiguidade do texto e evita importar uma definição teológica posterior.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. “Exércitos do céu” é mais imediatamente compreensível que “hostes celestes” e permanece próximo da forma do original.
