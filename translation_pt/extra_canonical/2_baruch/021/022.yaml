  text: For what is visible in them? Or what visible hope is there? Or what visible dwelling is not vanity?
translation:
  language: pt
  text: Pois o que há de visível neles? Ou que esperança visível existe? Ou que morada visível não é vaidade?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܙܐ / conceito recorrente de visibilidade
  choice: visível
  rationale: Mantém a repetição enfática refletida pela tradição textual consultada e evita alternar desnecessariamente entre “visto” e “visível”.
- source_word: ܣܒܪܐ / esperança
  choice: esperança
  rationale: É o equivalente português direto e preserva a abertura teológica do termo.
- source_word: ܡܥܡܪܐ / morada
  choice: morada
  rationale: Expressa um lugar de habitação em registro digno e corrente, sem restringi-lo a “casa”.
- source_word: ܣܪܝܩܘܬܐ / vaidade
  choice: vaidade
  rationale: Conserva a ideia ampla de vazio, futilidade ou transitoriedade, sem reduzir o sentido a mera inutilidade.
theological_decisions:
- issue: Relação entre o visível e a vaidade
  choice: Manter a pergunta retórica sem explicar em que sentido a morada visível é vaidade.
  alternative: Traduzir interpretativamente como “passageira”, “inútil” ou “vazia”.
  rationale: O texto formula uma tensão sobre a realidade visível; explicá-la na tradução imporia uma leitura teológica específica.
- issue: Referente de “neles”
  choice: Preservar o pronome plural “neles”.
  alternative: Substituí-lo por um referente explícito inferido do contexto.
  rationale: O recorte-fonte não permite identificar o antecedente com segurança, e a tradução não deve eliminar essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “visível” foi mantida deliberadamente para reproduzir a estrutura retórica do versículo; “vaidade” preserva a densidade tradicional e semântica do termo.
