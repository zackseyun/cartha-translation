  text: And I saw that, because of one man, those who live came to be, and also the dwelling place of those who are to come.
translation:
  language: pt
  text: E vi que, por causa de um só homem, vieram a existir os que vivem, bem como a morada dos que hão de vir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܕ / “um” (leitura refletida pela tradição textual consultada)
  choice: um só homem
  rationale: Expressa com naturalidade o valor numeral e enfático de “um homem”, sem identificar a pessoa mencionada.
- source_word: “vieram a ser/existir”
  choice: vieram a existir
  rationale: Preserva a ideia de passagem à existência, em vez de enfraquecê-la para “nasceram” ou “viveram”.
- source_word: “morada/lugar de habitação”
  choice: morada
  rationale: Termo corrente e digno que comunica um lugar de habitação sem acrescentar uma localização ou natureza não declarada.
- source_word: “os que estão para vir”
  choice: os que hão de vir
  rationale: Mantém a orientação futura da expressão em português claro e solene.
theological_decisions:
- issue: Identidade do “um só homem”
  choice: Não identificar o homem no texto.
  alternative: Explicitar Adão ou outra figura.
  rationale: O enunciado permanece alusivo; nomear a pessoa resolveria uma ambiguidade que o texto não resolve.
- issue: Sentido de “morada”
  choice: Manter o referente indefinido.
  alternative: Interpretar como mundo, céu, terra ou lugar escatológico.
  rationale: A tradução não deve impor uma leitura cosmológica ou escatológica específica onde o enunciado não a explicita.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A construção conserva o paralelismo entre “os que vivem” e “os que hão de vir”. O recorte siríaco fornecido é um agrupamento de páginas com sobreposição e alinhamento versicular incerto; por isso, a redação segue cautelosamente o sentido atestado pela camada inglesa auditada, sem acrescentar identificações interpretativas.
