- from: Mas, visto que ele foi criado da terra e do pó, tudo o que passa[a] deixa a terra e vai para o seu próprio lugar.
  to: Mas, porque ele foi criado da terra e do pó, tudo o que perece parte dela para o seu próprio lugar.[a]
  rationale: A revisão preserva o sujeito humano masculino e os dois termos de origem, torna explícito em português o valor de cessação/morte e conserva, com «dela», o referente feminino sem substituí-lo interpretativamente por «a terra».
