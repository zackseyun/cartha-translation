  yaml_path: translation/extra_canonical/2_baruch/021/026.yaml
  text: But because he was created from the earth and from dust, whatever passes away departs from it to its own place.
translation:
  language: pt
  text: Mas, porque ele foi criado da terra e do pó, tudo o que perece parte dela para o seu próprio lugar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tudo o que passa».'
    reason: A expressão pode referir-se de modo amplo ao que é transitório; no contexto, também pode ter o sentido mais específico de perecer.
lexical_decisions:
- source_word: ܐܬܒܪܝ
  choice: ele foi criado
  rationale: O verbo siríaco está no masculino singular; por isso, o sujeito implícito é o ser humano mencionado pelo contexto, não «a terra», substantivo feminino.
- source_word: ܡܢ ܐܪܥܐ ... ܡܢ ܥܦܪܐ
  choice: da terra e do pó
  rationale: Mantém os dois termos de origem material e a alusão à criação do ser humano do solo/pó.
- source_word: (expressão vertida na camada de consulta como “whatever passes away”)
  choice: tudo o que passa
  rationale: Conserva a amplitude e a ambiguidade da expressão relativa à transitoriedade; a nota registra a leitura mais explicitamente mortal.
- source_word: (expressão vertida na camada de consulta como “departs from it to its own place”)
  choice: deixa a terra e vai para o seu próprio lugar
  rationale: Explicita de modo natural em português o referente locativo sem alterar o movimento de partida e retorno ao lugar próprio.
theological_decisions:
- issue: Sujeito da criação
  choice: O ser humano implícito («ele») foi criado da terra e do pó.
  alternative: «A terra foi criada do pó.»
  rationale: A concordância masculina do verbo siríaco exclui a terra, que é feminina, como sujeito e sustenta a referência contextual ao ser humano.
- issue: Sentido de «passa»
  choice: Manter no texto a formulação ampla «tudo o que passa».
  alternative: «Tudo o que perece» ou «tudo o que passa desta vida».
  rationale: A formulação menos interpretativa preserva a possível tensão entre transitoriedade e morte; a nota oferece a explicitação provável.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. «Visto que» exprime causalidade sem peso excessivo; «seu próprio lugar» preserva a formulação do texto sem identificar além do necessário qual seja esse lugar.
