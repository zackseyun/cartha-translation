translation:
  language: pt
  text: Tu comandas o relâmpago ao teu sinal e viste as coisas que estão por vir como as que já passaram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como as coisas que fazes”.'
    reason: Registra a leitura alternativa da cláusula final sem substituir no texto principal o contraste temporal mais provável.
lexical_decisions:
- source_word: ܠܐܙܐ
  choice: o relâmpago
  rationale: O termo, no contexto do poder divino sobre os fenômenos celestes, designa o relâmpago.
- source_word: ܒܪܘܙܝܟ
  choice: ao teu sinal
  rationale: Expressa de modo natural a ideia de que o relâmpago obedece à indicação ou ordem divina.
- source_word: ܕܥܬܝ̈ܕܢ
  choice: as coisas que estão por vir
  rationale: Preserva a referência temporal ao futuro em linguagem portuguesa clara e digna.
- source_word: ܕܥܒܪ̈ܝ
  choice: as que já passaram
  rationale: Lê a forma como derivada de ܥܒܪ, “passar”, mantendo o contraste temporal entre o que virá e o que já passou.
theological_decisions:
- issue: Conhecimento divino do futuro
  choice: viste as coisas que estão por vir
  alternative: conheces as coisas que estão por vir
  rationale: Mantém a metáfora de visão presente no verbo siríaco sem expandi-la para uma formulação doutrinária mais abstrata.
- issue: Leitura da cláusula final
  choice: como as que já passaram
  alternative: como as coisas que fazes
  rationale: A leitura temporal forma um paralelismo coerente entre futuro e passado e corresponde à revisão textual adotada; a leitura alternativa é preservada em nota devido à proximidade gráfica e à forma transmitida na evidência apresentada.
translation_notes:
  register: Português moderno, claro e solene, com uso de segunda pessoa singular coerente com a oração dirigida a Deus. A construção “ao teu sinal” comunica prontidão e autoridade sem acrescentar explicação interpretativa.
