translation:
  language: pt
  text: Tu não decretas[a] chuva e dilúvio senão por causa[b] do ser humano pecador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: falas.'
    reason: O verbo siríaco significa literalmente “falar”, embora aqui possa expressar uma ordem ou determinação divina.
  - marker: b
    text: 'Ou: sobre.'
    reason: A relação sintática pode ser entendida como causa (“por causa de”) ou como referência ao alvo do juízo (“sobre”).
lexical_decisions:
- source_word: ܡܡܠܠ (mamallel)
  choice: decretas
  rationale: O verbo significa literalmente “falar”, mas, tendo chuva e dilúvio como objetos e Deus como sujeito, denota aqui uma palavra soberana que determina o acontecimento. “Decretas” comunica esse valor em português natural sem eliminar a alternativa literal, registrada em nota.
- source_word: ܛܘܦܢܐ ܡܛܪܐ (ṭūpānā, meṭrā)
  choice: chuva e dilúvio
  rationale: Os dois substantivos designam chuva e inundação/dilúvio. A coordenação é implícita no siríaco; em português, a conjunção é necessária para clareza.
- source_word: ܐܢܫܐ ܡܣܟܠܢܐ (nāšā masklānā)
  choice: ser humano pecador
  rationale: A expressão singular tem valor genérico. “Ser humano” preserva esse alcance, e “pecador” traduz o sentido moral de ܡܣܟܠܢܐ neste contexto de juízo.
theological_decisions:
- issue: Relação entre o juízo divino e o pecado humano
  choice: “senão por causa do ser humano pecador”
  alternative: “senão sobre o ser humano pecador”
  rationale: A construção pode ser entendida causalmente, apresentando o pecado humano como motivo da chuva e do dilúvio judiciais, ou como referência ao alvo sobre o qual recaem. O texto principal segue a leitura causal, mais coerente com o contexto, e conserva a alternativa em nota.
translation_notes:
  register: Português moderno, claro e solene, com tratamento direto a Deus na segunda pessoa do singular. A formulação “não... senão” preserva a estrutura enfática e restritiva do siríaco.
