translation:
  language: pt
  text: '[Atenta para]ᵃ o amor pelo teu nome, que está diante de ti acima de tudo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܟ (reconstruído no sintagma correspondente)
  choice: teu nome
  rationale: Mantém a referência direta ao nome divino, sem substituir por uma interpretação como “tua honra” ou “tua reputação”.
- source_word: ܚܘܒܐ / sintagma de amor (texto transmitido de leitura difícil)
  choice: amor pelo teu nome
  rationale: Em português, “amor pelo teu nome” expressa naturalmente o amor dirigido ao nome; “amor do teu nome” sugeriria, de modo enganoso, que o próprio nome ama.
- source_word: ܩܕܡܝܟ
  choice: diante de ti
  rationale: Preserva a imagem espacial e relacional do siríaco, em vez de reduzi-la a “conhecido por ti”.
- source_word: ܒܪܝܫܘܬܗ ܟܘܠܐ (leitura aproximada no manuscrito)
  choice: acima de tudo
  rationale: Reproduz a ideia superlativa atestada pela tradição textual sem especificar indevidamente se se trata de prioridade, posição ou valor.
theological_decisions:
- issue: Sentido de “amor pelo teu nome”
  choice: Manter a expressão sem identificar explicitamente quem ama o nome.
  alternative: “o nosso amor pelo teu nome” ou “o amor que tens pelo teu nome”
  rationale: O texto não explicita com segurança o possuidor ou agente desse amor; acrescentá-lo resolveria uma ambiguidade teológica genuína.
- issue: Imperativo não plenamente preservado no texto-fonte disponível
  choice: Suprir “Atenta para” entre colchetes.
  alternative: 'Apresentar apenas o fragmento nominal: “O amor pelo teu nome...”'
  rationale: O suplemento torna a petição inteligível e acompanha a reconstrução contextual, mas os colchetes deixam claro que a formulação verbal não está expressa de modo seguro no testemunho siríaco fornecido.
translation_notes:
  register: Português moderno, digno e acessível. Emprega “tu” em oração dirigida a Deus, em continuidade com a segunda pessoa singular do texto, e conserva a formulação concisa e reverente.
