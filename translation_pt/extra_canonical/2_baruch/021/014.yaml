  text: E somente a ti cabe investigar a origem de toda a ordem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘ
  choice: E
  rationale: Preserva a conjunção inicial, que liga a afirmação ao desenvolvimento anterior da oração.
- source_word: ܠܟ ܒܠܚܘܕܝܟ
  choice: somente a ti
  rationale: Expressa com naturalidade a atribuição exclusiva indicada pelo siríaco.
- source_word: ܙܕܩܐ ܕܬܒܥܝܟ
  choice: cabe investigar
  rationale: Comunica a ideia de que essa investigação pertence ou compete exclusivamente a Deus, sem tornar a frase excessivamente literal.
- source_word: ܒܪܝܫܘܬܗ ܟܘܠܐ ܕܒܝܬ
  choice: a origem de toda a ordem
  rationale: 'Mantém a leitura contextual adotada pelo texto de consulta: o princípio ou origem da totalidade ordenada, sem explicitar além do que a formulação permite.'
theological_decisions:
- issue: Exclusividade divina da investigação
  choice: somente a ti cabe
  alternative: somente tu és digno de
  rationale: A formulação escolhida preserva a exclusividade e a ideia de competência própria, sem introduzir uma categoria teológica adicional de dignidade.
- issue: Sentido de “origem” e “ordem”
  choice: a origem de toda a ordem
  alternative: o princípio de tudo o que existe
  rationale: A opção principal acompanha a compreensão contextual auditada, enquanto a nota registra a leitura mais diretamente existencial possível da construção siríaca.
