translation:
  language: pt
  text: Depois disso, vim ao lugar onde falaste comigo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܢ ܒܬܪܗܝܢ
  choice: Depois disso
  rationale: A expressão assinala sequência temporal e retoma os acontecimentos ou atos anteriores; esta formulação é natural em português e preserva o referente plural implícito.
- source_word: ܐܬܝܬ
  choice: fui
  rationale: Embora o verbo possa ser vertido literalmente por “vim”, o movimento narrado é até o lugar mencionado; em português corrente, “fui ao lugar” expressa naturalmente essa perspectiva.
- source_word: ܠܐܬܪܐ
  choice: ao lugar
  rationale: Equivalente direto e não interpretativo do substantivo siríaco “lugar”.
- source_word: ܗܘ ܕܡܠܠܬ ܥܡܝ ܬܡܢ
  choice: onde ele havia falado comigo
  rationale: A relativa identifica o lugar pela fala divina anterior. O mais-que-perfeito composto deixa clara a anterioridade sem tornar a frase artificial.
theological_decisions:
- issue: Identidade do sujeito implícito de “havia falado”
  choice: Manter o pronome “ele” sem identificação adicional
  alternative: Explicitar “Deus” ou “o Senhor”
  rationale: O contexto permite reconhecer o referente, mas o siríaco não insere aqui um título divino; explicitá-lo acrescentaria interpretação ao texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e próxima da forma concisa do siríaco.
