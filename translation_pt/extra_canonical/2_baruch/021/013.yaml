  text: For if the things that have been are not remembered, the things that stand before you are yours, and the things that are to come are remembered in their times.
translation:
  language: pt
  text: Pois, se as coisas que aconteceram não são lembradas, as coisas que estão diante de ti são tuas, e as que hão de vir são lembradas a seu tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܠܝܢ ܕܩܕ̈ܡܝ
  choice: as coisas que aconteceram
  rationale: Representa o primeiro grupo temporal, referente ao que já ocorreu; a construção do testemunho está textualmente difícil, mas o contraste passado–presente–futuro favorece este sentido.
- source_word: ܐܬܘܗܝ ܕܝܠܟ
  choice: são tuas
  rationale: Preserva a predicação direta de pertencimento, sem explicar além do que o siríaco afirma.
- source_word: ܒܙܒܢܘܬܐ ܡܕܟ̣ܪܐ
  choice: são lembradas a seu tempo
  rationale: Traduz a referência temporal idiomaticamente em português e mantém a ideia de cada realidade futura ser recordada no tempo próprio.
theological_decisions:
- issue: Objeto do conhecimento ou da lembrança divina ao longo do tempo
  choice: Manter as três cláusulas paralelas sobre passado, presente e futuro sem harmonização explicativa.
  alternative: Reformular como uma afirmação explícita da onisciência divina.
  rationale: O texto poético afirma lembrança e pertencimento, mas não formula sistematicamente uma doutrina; a tradução conserva sua tensão e seu paralelismo.
translation_notes:
  register: Português moderno, solene e acessível. Emprega-se «ti» por se tratar de oração dirigida a Deus; o paralelismo temporal foi preservado com sintaxe natural.
