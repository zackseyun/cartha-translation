  terminology: “Cedrom” é uma forma geográfica portuguesa tradicional e reconhecível. “Alma” preserva adequadamente ܢܦܫܐ, e “santifiquei a minha alma” mantém a expressão religiosa sem a reduzir a uma paráfrase interpretativa. Não são necessárias notas de rodapé para este versículo.
