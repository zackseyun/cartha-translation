  source_fidelity: 'O texto português transmite com fidelidade os elementos de 2 Baruc 21:1 atestados no texto siríaco e no trilho de auditoria inglês: a retirada de Baruque, o vale do Cedrom, a imagem deliberadamente concreta de uma “caverna da terra”, a santificação da alma, a ausência de fome e sede e a permanência até o sétimo dia conforme a ordem recebida. Não acrescenta explicação milagrosa ou ascética que o versículo não explicita.'
