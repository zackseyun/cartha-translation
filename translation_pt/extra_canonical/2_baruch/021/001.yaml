base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/021/001.yaml
  text: And I went away from there and sat in the valley of Kidron, in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.
translation:
  language: pt
  text: 1 Então parti dali e me sentei no vale do Cedrom, numa caverna da terra. Ali santifiquei a minha alma. Não comi pão, mas não tive fome; não bebi água, mas não tive sede. E permaneci ali até o sétimo dia, como ele me havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  choice: numa caverna da terra
  rationale: Preserva a imagem concreta e enfática do siríaco, sem reduzi-la simplesmente a “caverna” ou interpretá-la como sepulcro.
- source_word: ܢܦܫܐ
  choice: a minha alma
  rationale: Mantém o vocabulário antropológico e religioso do texto, no qual o retiro e o jejum são descritos como santificação da própria alma.
- source_word: ܩܕܪܘܢ
  choice: Cedrom
  rationale: Emprega a forma geográfica tradicional e amplamente reconhecível em português para o vale conhecido também como Kidron.
- source_word: ܥܕܡܐ ܠܝܘܡܐ ܕܫܒܥܐ
  choice: até o sétimo dia
  rationale: Reproduz de modo direto o limite temporal do retiro, sem decidir além do texto se o sétimo dia estava completo.
theological_decisions:
- issue: Santificação da alma por meio do retiro ascético
  choice: “santifiquei a minha alma”
  alternative: “preparei-me espiritualmente”
  rationale: A formulação literal conserva a força religiosa da ação de Baruque e evita explicar o ato segundo uma tradição ascética posterior.
- issue: Ausência de fome e sede durante o jejum
  choice: Apresentar as afirmações diretamente, sem explicação causal
  alternative: Explicitar que Deus o sustentou milagrosamente
  rationale: O versículo relata que Baruque não sentiu fome nem sede, mas não declara de modo explícito a causa; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Caverna da terra” foi mantido por sua imagem incomum e deliberadamente concreta; “Cedrom” favorece o reconhecimento bíblico em português.
