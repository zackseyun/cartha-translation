  text: And let what is preserved for its time continue.
translation:
  language: pt
  text: E que aquilo que está reservado para o seu tempo permaneça.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E aquilo que está reservado para o seu tempo permanece”.'
    reason: Registra a possível leitura indicativa da forma verbal, embora o contexto favoreça a força jussiva.
  - marker: b
    text: 'Ou: “para os seus tempos”.'
    reason: Registra a possibilidade de entender a expressão temporal no plural.
lexical_decisions:
- source_word: ܡܣܟܝܢ
  choice: reservado
  rationale: Expressa algo conservado ou mantido à espera do momento que lhe corresponde; em português corrente, “reservado para” comunica melhor essa destinação temporal do que o mais rígido “preservado para”.
- source_word: ܒܙܒܢܗ
  choice: para o seu tempo
  rationale: Mantém a referência singular ao tempo próprio ou determinado daquilo que está reservado, sem explicitar se esse tempo é apenas cronológico ou divinamente estabelecido.
- source_word: forma verbal final (imperfeito siríaco)
  choice: permaneça
  rationale: No contexto de oração e petição, o imperfeito tem força jussiva. “Permaneça” conserva essa força e também o sentido de continuar ou subsistir.
theological_decisions:
- issue: Força modal da forma verbal
  choice: 'Petição jussiva: “que ... permaneça”'
  alternative: 'Indicativo: “... permanece”'
  rationale: A sequência da oração favorece uma súplica, mas a forma siríaca também pode ser lida formalmente como indicativa; a alternativa é registrada em nota.
- issue: Número de “tempo”
  choice: 'Singular: “seu tempo”'
  alternative: 'Plural: “seus tempos”'
  rationale: A leitura singular é a mais provável e se ajusta à ideia de um momento próprio ou designado, embora uma vocalização plural seja possível.
translation_notes:
  register: Português moderno, claro e digno, com construção jussiva natural. “Aquilo que” evita ambiguidade sintática, e “reservado” comunica tanto conservação quanto destinação sem acrescentar uma interpretação teológica específica.
