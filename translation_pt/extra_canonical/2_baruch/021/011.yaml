  revision_rationale: A revisão elimina uma alternativa de nota que não é seguramente compatível com a voz passiva atestada e torna a predicação portuguesa mais idiomática. Mantêm-se o registro solene, o valor de prestação/julgamento de «grande acerto de contas» e a ambiguidade de «diante de ti».
