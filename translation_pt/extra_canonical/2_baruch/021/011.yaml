translation:
  language: pt
  text: No grande acerto de contas, as transgressões dos que estão diante de ti permanecem diante de ti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “dos que te precederam”.'
    reason: A expressão siríaca traduzida por “os que estão diante de ti” pode ter sentido temporal, sem que isso deva substituir a ambiguidade da tradução principal.
lexical_decisions:
- source_word: ܒܚܘܫܒܢܐ ܪܒܐ
  choice: No grande acerto de contas
  rationale: Expressa o sentido de uma grande prestação ou apuração de contas em linguagem portuguesa natural, preservando a dimensão judicial do contexto.
- source_word: ܚܝ̈ܒܘܬܐ
  choice: transgressões
  rationale: Termo amplo e digno para culpas ou delitos, sem restringir o referente a uma categoria jurídica ou doutrinária específica.
- source_word: ܡܕܟܪܐ
  choice: são mantidas
  rationale: Mantém a construção passiva indicada pelo contexto textual e comunica que as transgressões permanecem presentes perante Deus; a possível nuance de memória é registrada em nota.
theological_decisions:
- issue: Sentido de ܕܩܕܡܝܟ e da repetição de ܩܕܡܝܟ
  choice: dos que estão diante de ti ... diante de ti
  alternative: dos que te precederam ... perante ti
  rationale: A tradução principal conserva a repetição e a relação direta com o destinatário divino, sem transformar de modo definitivo a expressão em referência temporal aos antepassados.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “ti” adequado à oração. A repetição “diante de ti” foi preservada por corresponder à formulação enfática do siríaco.
