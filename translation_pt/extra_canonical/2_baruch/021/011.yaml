review_pass:
  verdict: revise
  source_fidelity: 'A construção passiva deve ser preservada: as transgressões são apresentadas como retidas/permanecendo perante o destinatário no grande acerto de contas. A formulação principal conserva também a duplicação de «diante de ti» e não resolve indevidamente se «os que estão diante de ti» tem valor espacial ou temporal.'
  naturalness: «São mantidas diante de ti» é compreensível, mas soa pouco idiomático em português. «Permanecem diante de ti» comunica naturalmente a permanência das transgressões perante Deus, sem introduzir uma interpretação ativa.
  terminology: «Grande acerto de contas» transmite adequadamente o sentido de grande apuração/julgamento. «Transgressões» é apropriado para as culpas ou ofensas em registro solene. A nota proposta no rascunho, porém, apresenta «são lembradas» como alternativa verbal, o que não deve ser promovido como leitura equivalente após a decisão textual que identifica uma construção passiva de retenção.
  issues:
  - severity: medium
    issue: A nota a apresenta «são lembradas diante de ti» como alternativa verbal.
    rationale: Isso desloca a frase para o campo de lembrança e pode sugerir uma construção ativa, enquanto a leitura-base adotada no histórico inglês e na análise gramatical requer que as transgressões sejam passivamente mantidas/permanecendo perante o destinatário.
  - severity: low
    issue: «São mantidas diante de ti» é pouco fluente.
    rationale: «Permanecem diante de ti» mantém o efeito passivo de retenção e a repetição enfática, em português mais natural.
  revised_text: No grande acerto de contas, as transgressões dos que estão diante de ti permanecem diante de ti.[a]
