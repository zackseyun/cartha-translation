translation:
  language: pt
  text: Tu, que ordenaste ao ar por um gesto e viste as coisas que hão de vir como as que fazes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܩܝܕܐ (pqīdā)
  choice: deste ordens
  rationale: Expressa de modo natural o verbo siríaco de ordenar ou comandar, mantendo a forma verbal dirigida a Deus.
- source_word: ܠܐܐܪ (l-āʾar)
  choice: ao ar
  rationale: Mantém o referente concreto do siríaco, sem o ampliar para céu, vento ou atmosfera.
- source_word: ܒܪܘܙܝܟ / b-rmzā
  choice: com um aceno
  rationale: Comunica a ideia de um sinal ou gesto mínimo de comando; evita acrescentar o possessivo não exigido na formulação portuguesa.
- source_word: ܕܥܬܝ̈ܕܢ (d-ʿtīdan)
  choice: que estão por vir
  rationale: Tradução idiomática de 'futuras/destinadas a acontecer', sem especificar eventos além do texto.
- source_word: ܐܝܟ ܐܝܠܝܢ ܕܥܒܕ ܐܢܬ (ʾayk ʾaylēn d-ʿābed ʾant)
  choice: como aquelas que realizas
  rationale: Conserva a comparação presente no siríaco e sua tensão temporal, em vez de omiti-la ou convertê-la sem indicação em uma afirmação de que os fatos já ocorreram.
theological_decisions:
- issue: Relação entre o conhecimento divino do futuro e a ação divina
  choice: viste as coisas que estão por vir como aquelas que realizas
  alternative: viste as coisas que estão por vir como se já as estivesses realizando
  rationale: A redação principal preserva mais diretamente a construção comparativa e o presente verbal do siríaco, sem resolver se a frase enfatiza presciência, certeza, agência divina ou uma combinação dessas ideias.
translation_notes:
  register: Oração em segunda pessoa do singular, com linguagem atual e reverente. “Deste ordens” e “com um aceno” são claros para leitores comuns, enquanto a oração final mantém deliberadamente a formulação densa do original.
