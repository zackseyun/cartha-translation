- from: Tu, que deste ordens ao ar com um aceno e viste as coisas que estão por vir como aquelas que realizas.[a]
  to: Tu, que ordenaste ao ar por um gesto e viste as coisas que hão de vir como as que fazes.
  rationale: 'A revisão elimina a nota que explicitava indevidamente uma nuance temporal e ajusta levemente a formulação para refletir de modo mais direto a comparação final do siríaco. Não se altera o sentido: Deus ordena ao ar mediante um gesto e vê as realidades futuras em relação com sua ação presente.'
