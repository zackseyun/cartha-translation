translation:
  language: pt
  text: para que a ruína do ser humano não volte a aparecer como se ele não tivesse sido criado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O siríaco é sintaticamente difícil. Outra tradução possível é: “para que a ruína do ser humano não volte a manifestar-se como se ele não tivesse sido criado”.'
    reason: Registra a incerteza quanto à construção verbal e à ligação exata da comparação sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ܡܬܚܒܠܘܬܐ / ܚܒܠܐ
  choice: ruína
  rationale: Expressa destruição ou perdição sem limitar o sentido à morte física nem acrescentar uma interpretação teológica específica.
- source_word: ܒܪܢܫܐ
  choice: ser humano
  rationale: Mantém o valor genérico de 'homem/humanidade' em português atual e evita que a referência seja entendida como exclusivamente masculina.
- source_word: ܐܬܒܪܝ
  choice: tivesse sido criado
  rationale: Preserva a voz passiva e a referência à criação, bem como o caráter contrafactual da comparação.
theological_decisions:
- issue: Alcance de 'ruína'
  choice: Não especificar se se trata de morte, condenação ou destruição histórica.
  alternative: Traduzir como 'perdição' ou 'morte'.
  rationale: O contexto fala da ruína humana de modo amplo; uma formulação mais específica resolveria indevidamente a tensão teológica.
- issue: Referente humano genérico
  choice: Repetir a ideia por meio do pronome 'ele', retomando 'o ser humano'.
  alternative: Dizer 'como se a humanidade não tivesse sido criada'.
  rationale: A repetição coletiva tornaria o texto mais interpretativo; o pronome conserva a estrutura comparativa e continua sendo entendido genericamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção mantém a oração subordinada do contexto e evita vocabulário confessional.
