  naturalness: «Mas Israel também se contaminou com pecados nos dias dos juízes, enquanto via muitos sinais realizados por aquele que o criou» é natural, claro e adequado ao registro bíblico moderno. O singular em «via» e «o criou» trata Israel como coletivo, de modo consistente.
