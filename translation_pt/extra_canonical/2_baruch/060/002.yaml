  yaml_path: translation/extra_canonical/2_baruch/060/002.yaml
  text: But Israel also was defiled with sins in the days of the judges, while they were seeing many signs that were done by him who made them.
translation:
  language: pt
  text: Mas Israel também se contaminou com pecados nos dias dos juízes, enquanto via muitos sinais realizados por aquele que o criou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Israel
  choice: Israel
  rationale: Mantém o referente coletivo; por isso, os pronomes e verbos relativos a Israel ficam no singular.
- source_word: defiled with sins
  choice: se contaminou com pecados
  rationale: Expressa de modo natural a ideia de impureza moral associada ao pecado, sem acrescentar uma categoria ritual não explicitada.
- source_word: in the days of the judges
  choice: nos dias dos juízes
  rationale: Preserva a referência histórica tradicional com linguagem clara e corrente.
- source_word: signs
  choice: sinais
  rationale: É o equivalente amplo e habitual para atos extraordinários que têm valor revelador, sem restringi-los a 'milagres'.
- source_word: him who made them
  choice: aquele que o criou
  rationale: Toma o pronome como referência ao Israel coletivo e explicita essa concordância em português, evitando que 'os criou' pareça referir-se aos sinais.
theological_decisions:
- issue: Identidade daquele que criou Israel
  choice: aquele que o criou
  alternative: aquele que os realizou
  rationale: A formulação mantém a referência indireta a Deus e entende o objeto da criação como Israel; não insere o nome divino onde a expressão de origem é perifrástica.
- issue: Relação entre os sinais vistos e o pecado de Israel
  choice: embora visse
  alternative: enquanto via
  rationale: 'A conjunção concessiva preserva a tensão moral indicada pelo contexto: Israel pecou apesar dos muitos sinais, sem sugerir que os sinais causaram sua contaminação.'
translation_notes:
  register: Português moderno, digno e de leitura ampla. A redação conserva Israel como sujeito coletivo singular. O material siríaco fornecido é um recorte de capítulo com sobreposição e não delimita claramente este versículo; por isso, evitou-se introduzir detalhes além da formulação atestada na camada de consulta.
