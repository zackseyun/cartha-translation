  yaml_path: translation/extra_canonical/2_baruch/060/001.yaml
  text: And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.
translation:
  language: pt
  text: E as quintas águas negras que você viu cair como chuva são os feitos dos amorreus, os feitiços de seus encantamentos, que eles praticavam, a perversidade de seus mistérios e a mistura de suas impurezas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ / expressão reconstruída pelo contexto da tradição textual
  choice: águas negras
  rationale: Mantém a imagem simbólica recorrente da visão e a distinção cromática do texto.
- source_word: Amorites / equivalente siríaco esperado
  choice: amorreus
  rationale: É a forma bíblica corrente e imediatamente reconhecível em português.
- source_word: spells … enchantments / equivalentes siríacos não visíveis no recorte fornecido
  choice: feitiços de seus encantamentos
  rationale: Preserva a acumulação semântica e a possível distinção entre fórmulas mágicas e práticas de encantamento, sem reduzir ambas a um único termo.
- source_word: mysteries / equivalente siríaco não visível no recorte fornecido
  choice: mistérios
  rationale: Conserva a linguagem de práticas ocultas, sem explicitar indevidamente seu conteúdo.
- source_word: uncleanness / equivalente siríaco não visível no recorte fornecido
  choice: impurezas
  rationale: O plural soa natural em português e mantém aberta a dimensão ritual, moral ou corporal da expressão.
theological_decisions:
- issue: Natureza da impureza dos amorreus
  choice: impurezas
  alternative: imundícia
  rationale: Evita restringir a referência à sujeira física ou defini-la exclusivamente como culpa moral; preserva a amplitude religiosa e ética do termo.
- issue: Relação entre as águas e os acontecimentos históricos
  choice: representam
  alternative: são
  rationale: Em português, explicita com naturalidade a função simbólica das águas na interpretação da visão, sem identificar materialmente água e feitos.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. O recorte siríaco fornecido parece abranger material adjacente e não exibe de modo identificável toda a redação deste versículo; por isso, a formulação foi controlada pela imagem e pelo vocabulário recorrentes no corpus, usando a POB inglesa auditada como camada de consulta. Evitou-se modernizar ou explicar em excesso a terminologia ligada à magia e à impureza.
