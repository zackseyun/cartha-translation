lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: E ele respondeu e me disse
  rationale: Preserva a fórmula narrativa siríaca de resposta e fala, sem condensá-la nem elevar seu tom.
- source_word: ܡܛܠ ܗܢܐ
  choice: Por causa disso
  rationale: Mantém explícita a relação causal com o que precede.
- source_word: ܒܗܘ ܙܒܢܐ
  choice: naquele tempo
  rationale: Reproduz a referência temporal definida e conserva o registro solene da narrativa.
- source_word: ܐܡܝܪ
  choice: foi dito
  rationale: Mantém a construção passiva visível no siríaco e não identifica indevidamente quem falou.
theological_decisions:
- issue: Identidade de quem proferiu a declaração
  choice: A tradução mantém o passivo “foi dito”, sem nomear o agente.
  alternative: Explicitar que se trata de um pronunciamento divino.
  rationale: O trecho preservado não identifica o agente da fala; explicitá-lo resolveria uma ambiguidade que o siríaco deixa aberta.
