  yaml_path: translation/extra_canonical/2_baruch/055/001.yaml
  text: 'And it happened, when I was praying, speaking the first words of this prayer, that I was disturbed and I trembled; and I was reflecting on the seed of humankind—how many are those who have gone, and how few are those who are kept. And as I was considering these things, I heard a voice that said to me:


    “Son of man, why are you troubled, and why are you alarmed? For before you were created, you were known to me, and before you came forth from your mother’s womb, you were promised to me. And for this reason these things that are to come were shown to you.”


    And I said to him, “Lord, you have shown me the multitude of the times, and what has happened in them; but you have not shown me how long it will be. Therefore I ask that I may hear concerning those who have borne witness for righteousness, what is the reward kept for them.” And a multitude of good things and of evil things that are coming was promised to me, and then I went up to the mountain.


    And it came to pass, after seven days, that I came to that place where there was a spring. And as I was sitting there, I was taken up on the chariot of a cloud—not in the body, and I did not know it. And a mystery was shown to me, and I heard a voice that said to me: “See and know how, in this world, their works and their labors are preserved, of those who have acted well and of those who have acted wickedly.”'
translation:
  language: pt
  text: 'Enquanto eu orava e pronunciava as primeiras palavras desta oração, aconteceu que fiquei perturbado e estremeci. Eu refletia sobre a descendência da humanidade: como são muitos os que já se foram e poucos os que são preservados. Enquanto pensava nessas coisas, ouvi uma voz que me disse:


    “Filho do homem, por que você está perturbado? Por que está com medo? Antes de você ser formado, já era conhecido por mim; e, antes de sair do ventre de sua mãe, já era conhecido por mim. Foi por isso que estas coisas que estão por vir lhe foram mostradas.”


    Eu lhe disse: “Senhor, tu me mostraste a vastidão dos tempos e o que aconteceu neles, mas não me mostraste quanto tempo isso durará.[a] Por isso, peço que me seja permitido ouvir a respeito dos que deram testemunho em favor da justiça: qual é a recompensa reservada para eles?” Então me foi prometida uma multidão de coisas boas e más que estão por vir, e depois subi ao monte.


    Passados sete dias, cheguei àquele lugar onde havia uma fonte. Enquanto eu estava sentado ali, fui levado para o alto numa carruagem de uma nuvem[b] — não no corpo, e eu não sabia disso. Um mistério me foi mostrado, e ouvi uma voz que me disse: “Veja e saiba como, neste mundo, são preservadas as obras e as fadigas tanto dos que agiram bem como dos que agiram mal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “de qual até qual”, isto é, de um ponto do tempo até outro.'
    reason: A expressão siríaca é elíptica e pergunta pelo alcance ou limite temporal.
  - marker: b
    text: 'Ou: “Enquanto eu estava ali sentado na carruagem de uma nuvem, fui levado para o alto.”'
    reason: A ligação sintática de «na carruagem de uma nuvem» pode ser feita com o ato de estar sentado ou com o de ser levado.
lexical_decisions:
- source_word: ܙܪܥܗ ܕܐܢܫܐ
  choice: descendência da humanidade
  rationale: Preserva o sentido coletivo de ܙܪܥ (‘semente, posteridade’) sem restringi-lo aos homens nem impor uma metáfora pouco natural em português.
- source_word: ܡܬܕܘܕ
  choice: perturbado
  rationale: Expressa agitação interior e mantém a distinção em relação ao verbo seguinte, ligado ao medo.
- source_word: ܡܬܪܗܒ
  choice: com medo
  rationale: Reproduz o sentido básico do verbo sem intensificá-lo para ‘aterrorizado’.
- source_word: ܬܬܒܪܐ
  choice: ser formado
  rationale: Reflete a ideia de formação anterior ao nascimento e evita acrescentar uma formulação metafísica não exigida pelo contexto.
- source_word: ܝܕܝܥ ܗܘܝܬ ܠܝ / ܐܬܝܕܥܬ ܠܝ
  choice: já era conhecido por mim
  rationale: As duas expressões afirmam conhecimento divino anterior à formação e ao nascimento; a repetição é mantida. A segunda não foi vertida como ‘prometido’, pois o texto siríaco traz a raiz de ‘conhecer’.
- source_word: ܪܘܒܐ ܕܙܒܢܐ
  choice: a grande extensão dos tempos
  rationale: Comunica amplitude ou vastidão temporal, preservando o plural e o tom apocalíptico.
- source_word: ܡܢ ܐܝܕܐ ܥܕܡܐ ܠܐܝܕܐ
  choice: quanto tempo isso durará
  rationale: Traduz idiomaticamente a pergunta pelo alcance temporal; a formulação mais literal é registrada em nota.
- source_word: ܬܘܪܨܐ
  choice: justiça
  rationale: No contexto dos que deram testemunho e da recompensa que lhes está reservada, ‘justiça’ oferece a leitura contextual mais coerente, embora o termo possa também indicar correção ou instrução.
- source_word: ܐܫܬܘܕܝܘ ܠܝ
  choice: me foi prometida
  rationale: O verbo, no contexto da revelação de acontecimentos futuros, admite o sentido de promessa; a concordância portuguesa segue ‘uma multidão’.
- source_word: ܡܪܟܒܬܐ ܕܥܢܢܐ
  choice: carruagem de nuvem
  rationale: Mantém de modo transparente a imagem apocalíptica do veículo celeste.
- source_word: ܐܬܢܣܒܬ
  choice: fui levado para o alto
  rationale: Expressa a ascensão visionária sem sugerir uma trasladação permanente.
- source_word: ܪܐܙܐ
  choice: mistério
  rationale: É o equivalente tradicional e apropriado para um segredo divino revelado em contexto apocalíptico.
- source_word: ܡܬܢܛܪܝܢ / ܢܬܢܛܪܘܢ
  choice: são preservados / são preservadas
  rationale: Mantém aberto se a preservação significa guarda, registro ou reserva para juízo.
theological_decisions:
- issue: Conhecimento divino do vidente antes de sua formação e nascimento
  choice: Traduzir diretamente como conhecimento pessoal anterior, sem transformar a frase numa fórmula doutrinária de predestinação.
  alternative: Ler como aplicação explícita de Jeremias 1:5 ou como mera linguagem figurada.
  rationale: A linguagem se aproxima de uma vocação profética, mas o texto não explicita a natureza ou as consequências teológicas desse conhecimento.
- issue: ‘Muitos já se foram, poucos são preservados’
  choice: Manter a linguagem aberta, no contexto da reflexão sobre a humanidade e sua transitoriedade.
  alternative: Interpretar como afirmação numérica sobre salvos e condenados.
  rationale: O texto não define aqui ‘preservados’ como categoria soteriológica; a tradução não deve importar essa conclusão.
- issue: Natureza da ascensão de Baruque
  choice: Apresentá-la como transporte visionário e conservar a negação de que tenha ocorrido no corpo.
  alternative: Entendê-la como arrebatamento físico ou reduzir toda a cena a um sonho interior.
  rationale: A ressalva do próprio texto exclui uma afirmação simples de transporte corporal, mas não explica o mecanismo da experiência.
- issue: Preservação das obras e fadigas
  choice: Conservar ‘preservadas’, sem explicar se são registradas, guardadas ou reservadas para julgamento.
  alternative: Explicitar recompensa imediata ou juízo escatológico.
  rationale: O verbo permite a ideia de guarda ou conservação, mas o momento e o modo da retribuição não são especificados.
- issue: Coisas boas e más prometidas ao vidente
  choice: Manter que a totalidade de acontecimentos futuros, bons e maus, lhe foi prometida.
  alternative: Substituir ‘prometida’ por ‘revelada’ ou entender apenas bens e males morais.
  rationale: O verbo favorece ‘prometer’, e o contexto aponta para acontecimentos futuros sem definir sua natureza com maior precisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais no Brasil. Empregou-se ‘você’ na voz divina dirigida a Baruque e ‘tu’ na fala de Baruque ao Senhor, refletindo o registro devocional corrente sem arcaísmos verbais excessivos. As imagens apocalípticas e as repetições semanticamente relevantes foram preservadas; ambiguidades sintáticas reais foram indicadas em notas.
