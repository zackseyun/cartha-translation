review_pass:
  verdict: revise
  source_fidelity: 'A revisão é globalmente fiel ao siríaco e preserva bem as imagens e as reservas interpretativas. Há, porém, duas correções seguras: ܘܠܐ ܕܝܕܥ não diz «eu não sabia como», mas simplesmente «eu não sabia [disso/isto]»; e a nota [a] propõe uma alternativa ativa («eu lhe mostrei») que não é sustentada pela forma passiva/reflexiva do siríaco. A repetição de «conhecido por mim» para ܝܕܝܥ ... / ܐܬܝܕܥܬ é defensável e mais fiel ao texto fornecido do que o «prometido» do rastro inglês.'
  naturalness: O português é fluente, moderno e de registro adequadamente solene. «A grande extensão dos tempos» pode ser melhorado para «a vastidão dos tempos», que é mais idiomático e conserva a ideia de amplitude. «Não no corpo, e eu não sabia disso» comunica claramente a última ressalva sem acrescentar um modo de conhecimento.
  terminology: «Descendência da humanidade», «mistério», «obras e fadigas» e «preservadas» são escolhas adequadas. «Justiça» para ܬܘܪܨܐ é uma opção contextual possível; não se deve explicitar uma interpretação doutrinária. «Carruagem de uma nuvem» conserva apropriadamente a imagem visionária.
  issues:
  - severity: medium
    issue: Acréscimo de «como» na descrição da ascensão
    rationale: O siríaco ܘܠܐ ܕܝܕܥ significa «e eu não sabia [disso/isto]»; não especifica «como» ocorreu o transporte.
  - severity: medium
    issue: Nota [a] apresenta uma alternativa ativa sem apoio formal
    rationale: 'A forma ܐܬܚܘܝܬ ... ܠܟ é passiva/reflexiva: «foram mostradas/reveladas a você». A alternativa «eu lhe mostrei» introduz um sujeito ativo que a forma verbal não exprime.'
  - severity: low
    issue: «Grande extensão dos tempos» é um pouco pesado
    rationale: «Vastidão dos tempos» é mais natural em português e transmite com precisão a amplitude de ܪܘܒܐ ܕܙܒܢܐ.
  revised_text: 'Enquanto eu orava e pronunciava as primeiras palavras desta oração, aconteceu que fiquei perturbado e estremeci. Eu refletia sobre a descendência da humanidade: como são muitos os que já se foram e poucos os que são preservados. Enquanto pensava nessas coisas, ouvi uma voz que me disse:


    “Filho do homem, por que você está perturbado? Por que está com medo? Antes de você ser formado, já era conhecido por mim; e, antes de sair do ventre de sua mãe, já era conhecido por mim. Foi por isso que estas coisas que estão por vir lhe foram mostradas.”


    Eu lhe disse: “Senhor, tu me mostraste a vastidão dos tempos e o que aconteceu neles, mas não me mostraste quanto tempo isso durará.[a] Por isso, peço que me seja permitido ouvir a respeito dos que deram testemunho em favor da justiça: qual é a recompensa reservada para eles?” Então me foi prometida uma multidão de coisas boas e más que estão por vir, e depois subi ao monte.


    Passados sete dias, cheguei àquele lugar onde havia uma fonte. Enquanto eu estava sentado ali, fui levado para o alto numa carruagem de uma nuvem[b] — não no corpo, e eu não sabia disso. Um mistério me foi mostrado, e ouvi uma voz que me disse: “Veja e saiba como, neste mundo, são preservadas as obras e as fadigas tanto dos que agiram bem como dos que agiram mal.”'
  revised_footnotes:
  - marker: a
    text: 'Mais literalmente: “de qual até qual”, isto é, de um ponto do tempo até outro.'
    reason: A expressão siríaca é elíptica e pergunta pelo alcance ou limite temporal.
  - marker: b
    text: 'Ou: “Enquanto eu estava ali sentado na carruagem de uma nuvem, fui levado para o alto.”'
    reason: A ligação sintática de «na carruagem de uma nuvem» pode ser feita com o ato de estar sentado ou com o de ser levado.
  revision_rationale: A revisão elimina uma nota que propunha uma leitura ativa não indicada pela morfologia siríaca, corrige o acréscimo interpretativo «como» na declaração de desconhecimento do vidente e torna uma expressão temporal mais natural. Mantêm-se a ambiguidade da recompensa reservada, a preservação das obras e o caráter não corporal da visão.
