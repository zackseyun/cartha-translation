  yaml_path: translation/extra_canonical/2_baruch/044/001.yaml
  text: And I, Baruch, went from there and came to the people. And I called my firstborn, its inhabitants, and the elders of its great ones, and the lowly from the elders of the people, and I said to them,
translation:
  language: pt
  text: '1 Então eu, Baruque, parti dali e fui até o povo. Chamei meu primogênito, os seus habitantes, os anciãos de seus grandes e o humilde dentre os anciãos do povo[a] e lhes disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A enumeração dos convocados é difícil no texto siríaco e pode refletir corrupção textual. Algumas reconstruções propõem uma lista mais simples, como “os poderosos do povo e os anciãos”.
    reason: Sinalizar ao leitor a incerteza textual sem substituir silenciosamente a leitura preservada.
lexical_decisions:
- source_word: ܒܘܟܪܝ
  choice: meu primogênito
  rationale: O substantivo com sufixo de primeira pessoa significa normalmente “meu primogênito”. Embora o contexto de uma convocação pública possa sugerir alguém de posição destacada, a tradução conserva a forma transmitida sem introduzir uma emenda conjectural.
- source_word: ܥܡܘܪܝܗ
  choice: os seus habitantes
  rationale: A expressão significa literalmente “seus habitantes”; o pronome retoma naturalmente “o povo”, ainda que a construção da lista seja incomum.
- source_word: ܩܫ̈ܝܫܝ ܪ̈ܘܪܒܢܘܗܝ
  choice: os anciãos de seus grandes
  rationale: Mantém a relação construta do siríaco, apesar da formulação difícil, em vez de simplificá-la para “os grandes” ou “os anciãos”.
- source_word: ܡܟܝܟܐ
  choice: o humilde
  rationale: A forma está no singular e designa alguém humilde ou de condição modesta. “O humilde” preserva tanto o número quanto o contraste social presente na enumeração.
theological_decisions:
- issue: Identidade dos convocados por Baruque
  choice: preservar a enumeração difícil do texto siríaco
  alternative: harmonizar a lista com outras convocações do livro, vertendo “os poderosos do povo e os anciãos”
  rationale: A passagem transmitida é textual e sintaticamente difícil. Harmonizá-la apagaria evidência genuína e introduziria pessoas ou categorias que não aparecem claramente no texto fornecido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A ordem narrativa foi naturalizada, mas a enumeração incomum foi mantida de modo deliberadamente próximo ao siríaco. O singular “o humilde” segue a forma da fonte.
