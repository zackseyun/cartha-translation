  text: But remember and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: pt
  text: Mas cuidem do povo que restar, para que não se afaste dos mandamentos de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢ̇ܛܪܘ
  choice: cuidem
  rationale: O verbo siríaco tem o sentido básico de guardar, vigiar ou zelar; no contexto da responsabilidade pelos sobreviventes, “cuidem” é natural e preserva essa ideia.
- source_word: ܥܡܐ ܕܐܫܬܚܪ
  choice: o povo que permanecer
  rationale: A expressão designa o povo que restar ou sobreviver; “permanecer” mantém a formulação ampla sem definir a natureza da sobrevivência.
- source_word: ܕܠܐ ܢܫܒܘܩ
  choice: para que não se afaste
  rationale: Embora o verbo possa ser vertido literalmente por “deixar” ou “abandonar”, a construção contextual descreve o afastamento dos mandamentos.
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ
  choice: os mandamentos de Deus
  rationale: Tradução direta da expressão siríaca, que emprega explicitamente ܐܠܗܐ, “Deus”.
theological_decisions:
- issue: Designação divina no fim do versículo
  choice: Deus
  alternative: o Poderoso
  rationale: O texto siríaco fornecido traz literalmente “Deus”. “O Poderoso” é uma designação tradicional recorrente em 2 Baruque e aparece na camada inglesa, mas não deve substituir silenciosamente a leitura desta fonte.
- issue: Força da exortação dirigida aos líderes
  choice: cuidem ... e o advirtam
  alternative: lembrem-se e admoestem
  rationale: “Cuidem” reflete melhor o verbo siríaco ܢܛܪ, enquanto “advirtam” explicita de modo moderado a responsabilidade para com o povo, em consonância com a consulta inglesa, sem introduzir conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. A coordenação foi formulada de modo natural, preservando tanto o cuidado pastoral quanto a advertência contra o abandono dos mandamentos.
