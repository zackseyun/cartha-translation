base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/044/002.yaml
  text: But you, do not withdraw from the way of the law, but guard and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: pt
  text: Mas vocês, não se afastem do caminho da Lei; antes, guardem e admoestem o povo que restou, para que não se afaste dos mandamentos de Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ ܕܢܡܘܣܐ (expressão atestada pela tradição textual do versículo)
  choice: caminho da Lei
  rationale: Preserva a metáfora do caminho e o sentido normativo de “Lei”, com linguagem clara e digna.
- source_word: ܢܛܪܘ
  choice: cuidem
  rationale: No contexto, o verbo tem o sentido de guardar, vigiar ou zelar pelo povo remanescente; “cuidem” soa natural em português sem perder essa ideia.
- source_word: ܐܫܬܚܪ
  choice: que restou
  rationale: Expressa diretamente a ideia do povo sobrevivente ou remanescente, sem introduzir terminologia teológica adicional.
- source_word: ܦܘܩ̈ܕܢܘܗܝ
  choice: mandamentos
  rationale: Equivalente corrente e preciso para preceitos ordenados por Deus.
- source_word: ܚܝܠܬܢܐ (título divino subjacente na tradição do versículo)
  choice: o Poderoso
  rationale: Mantém o título divino tradicional sem substituí-lo pelo nome “Deus” nem acrescentar uma interpretação denominacional.
theological_decisions:
- issue: Título divino “Mighty One”
  choice: o Poderoso
  alternative: Deus / o Todo-Poderoso
  rationale: “O Poderoso” conserva a forma distintiva do título e evita equipará-lo automaticamente a outro título divino.
- issue: Referente de quem pode afastar-se dos mandamentos
  choice: “para que não se afaste”, retomando coletivamente “o povo”
  alternative: “para que eles não se afastem”, retomando os integrantes do povo
  rationale: O singular coletivo é natural em português e preserva o povo remanescente como referente, sem alterar o sentido.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O plural “vocês” evita formas regionais ou arcaizantes; a construção mantém o contraste entre não abandonar a Lei e zelar pelo povo remanescente.
