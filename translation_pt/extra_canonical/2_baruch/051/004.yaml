  text: And above all, those who come after will be grieved, because they despised my law and stopped their ears so that they would not hear wisdom or receive understanding.
translation:
  language: pt
  text: Mas ainda mais ficarão profundamente abalados os que são como esses, os que desprezaram as minhas leis e taparam os ouvidos para não ouvir a sabedoria nem receber entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܘܕܐ ܓܝܪ ܝܬܝܪܐܝܬ
  choice: Pois, acima de tudo
  rationale: Expressa a combinação enfática e explicativa do siríaco sem tornar a frase pesada em português.
- source_word: ܢܬܬܙܝܥܘܢ
  choice: ficarão profundamente abalados
  rationale: O verbo indica agitação ou abalo intenso; esta formulação preserva essa força melhor do que uma referência mais específica à tristeza.
- source_word: ܐܝܠܝܢ ܕܐܝܟ ܗܢܝܢ
  choice: os que são como esses
  rationale: Traduz diretamente a expressão comparativa do texto preservado. A ideia de pessoas que “vierem depois” não está explícita nesta locução siríaca.
- source_word: ܕܐܣܠܝܘ ܢܡܘܣܝ̈
  choice: os que desprezaram a minha Lei
  rationale: ܐܣܠܝ expressa rejeição ou desprezo, e ܢܡܘܣܝ̈ refere-se à lei do locutor divino.
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: taparam os ouvidos
  rationale: Mantém a imagem corporal concreta do original em linguagem portuguesa corrente.
- source_word: ܢܩܒܠܘܢ ܣܘܟܠܐ
  choice: receber entendimento
  rationale: Preserva o paralelismo entre ouvir a sabedoria e acolher/receber entendimento.
theological_decisions:
- issue: Identificação dos condenados
  choice: os que são como esses
  alternative: os que vierem depois
  rationale: A tradução segue ܐܝܠܝܢ ܕܐܝܟ ܗܢܝܢ, evitando introduzir uma referência temporal ausente da expressão siríaca fornecida.
- issue: Natureza da reação futura
  choice: ficarão profundamente abalados
  alternative: ficarão entristecidos
  rationale: O original descreve de modo mais amplo um forte abalo ou agitação; não se restringiu o sentido a pesar emocional.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Conserva a metáfora dos ouvidos tapados e o paralelismo sapiencial do siríaco. A aposição “os que desprezaram” liga naturalmente o segundo grupo ao primeiro sem acrescentar uma distinção teológica não exigida pelo contexto.
