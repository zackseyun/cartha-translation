  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/007.yaml
  text: But for those who have been saved by their works, and for whom the law was hope, and understanding an expectation, and wisdom a confidence, wonders will appear in their time.
translation:
  language: pt
  text: Mas, para aqueles que foram salvos por suas obras, para quem a Lei era esperança, o entendimento era expectativa e a sabedoria era confiança, maravilhas aparecerão no tempo deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܕ̈ܐ / expressão correspondente no contexto
  choice: obras
  rationale: Preserva de modo direto a afirmação de que foram salvos por suas obras, sem atenuar sua tensão teológica.
- source_word: ܢܡܘܣܐ
  choice: Lei
  rationale: Traduz o termo siríaco para lei, com inicial maiúscula por se referir à Lei como referência religiosa definida.
- source_word: ܣܘܟܠܐ
  choice: entendimento
  rationale: Expressa compreensão ou discernimento em linguagem corrente e digna.
- source_word: ܚܟܡܬܐ
  choice: sabedoria
  rationale: Equivalente português direto e tradicional.
- source_word: ܬܕܡܪ̈ܬܐ / expressão correspondente
  choice: maravilhas
  rationale: Mantém o sentido de acontecimentos extraordinários ou prodígios sem especificar sua natureza.
theological_decisions:
- issue: Salvação por obras
  choice: foram salvos por suas obras
  alternative: foram justificados por suas obras
  rationale: Mantém a formulação forte atestada pela tradição textual consultada e não a harmoniza com sistemas teológicos posteriores.
- issue: Relação entre Lei, entendimento e sabedoria
  choice: três construções paralelas com o verbo “era” expresso
  alternative: sequência nominal sem repetição verbal
  rationale: 'Torna o paralelismo inteligível em português moderno sem alterar suas correspondências: Lei–esperança, entendimento–expectativa e sabedoria–confiança.'
- issue: Tempo da manifestação das maravilhas
  choice: no tempo deles
  alternative: em seu tempo
  rationale: Evita a possível ambiguidade pronominal de “seu” e conserva a referência ao tempo destinado àquelas pessoas.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo explícito para facilitar a leitura. A formulação sobre obras foi preservada sem explicação ou harmonização denominacional.
