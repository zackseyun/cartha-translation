base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/003.yaml
  text: But as for the glory of those who have now been vindicated by my law—those who had understanding in their life, and those who planted in their heart the root of wisdom—their splendor will then be glorified in transformations, and the form of their face will be turned into the light of their beauty, so that they may receive the world that does not die, which is promised to them.
translation:
  language: pt
  text: Quanto à glória dos que foram justificados em seu tempo — dos que tiveram entendimento em sua vida e plantaram no coração a raiz da sabedoria —, o esplendor deles será então glorificado em glórias[a], e a aparência de seu rosto será transformada na luz de sua beleza, para que recebam o mundo que não morre, que lhes é prometido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «será glorificado em esplendores». A expressão também pode evocar uma transformação gloriosa, mas o termo siríaco designa literalmente glórias ou esplendores.'
    reason: Preserva a ambiguidade interpretativa sem substituir o sentido lexical básico por «transformações» no texto principal.
lexical_decisions:
- source_word: ܐܙܕܩܘ
  choice: foram considerados justos
  rationale: Preserva o sentido passivo de serem declarados ou reconhecidos como justos, sem impor uma formulação confessional mais específica.
- source_word: ܢܡܘܣܝ
  choice: minha Lei
  rationale: Traduz o termo para lei com referência possessiva divina, usando maiúscula para indicar a Lei de Deus no contexto.
- source_word: ܫܘܒܠܐ
  choice: entendimento
  rationale: Comunica de modo natural a ideia contextual de discernimento ou compreensão possuída durante a vida.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: a raiz da sabedoria
  rationale: Mantém literalmente a metáfora agrícola do siríaco.
- source_word: ܙܝܘܗܘܢ
  choice: o esplendor deles
  rationale: Conserva o novo sujeito da oração principal após o tópico suspenso sobre a glória, evitando fundir os dois elementos.
- source_word: ܒܫܘܒ̈ܚܐ
  choice: por meio de transformações
  rationale: Segue a compreensão contextual adotada pela camada auditada, referente às mudanças escatológicas de aparência, embora a expressão admita outra análise.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ
  choice: o mundo que não morre
  rationale: Retém a personificação e a formulação concreta do original, em vez de substituí-la por 'vida eterna'.
theological_decisions:
- issue: Relação entre a glória inicial e o esplendor na oração principal
  choice: 'Construção de tópico suspenso: ''Quanto à glória... o esplendor deles...'''
  alternative: '''A glória daqueles... será então glorificada'''
  rationale: O siríaco introduz a glória como tópico e depois apresenta 'o esplendor deles' como sujeito da oração principal; a tradução conserva essa estrutura e sua tensão.
- issue: Sentido forense ou transformativo de ܐܙܕܩܘ
  choice: foram considerados justos
  alternative: foram justificados
  rationale: A opção escolhida mantém o valor passivo/declarativo sem carregar automaticamente toda a terminologia doutrinária posterior associada a 'justificação'.
- issue: Natureza da recompensa escatológica
  choice: recebam o mundo que não morre
  alternative: herdem a vida eterna
  rationale: Mantém a imagem cosmológica específica do texto, sem reinterpretá-la como uma fórmula teológica mais conhecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção 'Quanto à glória... o esplendor deles...' é deliberadamente marcada para reproduzir o tópico suspenso do siríaco. Travessões organizam a longa caracterização sem eliminar a sintaxe original.
