revisions:
- from: Quanto à glória daqueles que agora foram considerados justos pela minha Lei — os que tiveram entendimento durante a vida e plantaram no coração a raiz da sabedoria —, o esplendor deles será então glorificado por meio de transformações[a], e a forma do rosto deles será convertida na luz de sua beleza, para que recebam o mundo que não morre, o qual lhes foi prometido.
  to: Quanto à glória dos que foram justificados em seu tempo — dos que tiveram entendimento em sua vida e plantaram no coração a raiz da sabedoria —, o esplendor deles será então glorificado em glórias[a], e a aparência de seu rosto será transformada na luz de sua beleza, para que recebam o mundo que não morre, que lhes é prometido.
  rationale: A revisão elimina a referência não atestada a «minha Lei» e restitui «em seu tempo». Traduz ܒܫܘ̈ܒܚܐ por «em glórias», com nota para a nuance transformativa contextual. Mantém a estrutura de tópico suspenso e o sujeito subsequente «o esplendor deles», conforme o siríaco e a observação do audit trail inglês.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:37:10Z'
review_pass:
  verdict: revise
  source_fidelity: A draft acrescenta «pela minha Lei», mas o siríaco deste versículo diz «os que foram justificados/vindicados em seu tempo» (ܕܗܘܘ ܐܙܕܩܘ ܒܙܒܢܗܘܢ); «minha Lei» não está ligado a esse grupo. Também ܒܫܘ̈ܒܚܐ significa mais diretamente «em glórias/esplendores», não «por meio de transformações».
  naturalness: A construção de tópico («Quanto à glória...») é aceitável, mas «a forma do rosto deles» soa menos idiomático do que «a aparência de seu rosto». A revisão mantém o tom solene com sintaxe portuguesa fluente.
  terminology: «Foram justificados» traduz de modo direto o passivo de ܐܙܕܩܘ sem a paráfrase interpretativa «considerados justos». «Esplendor», «sabedoria» e «o mundo que não morre» preservam as imagens do texto. A nota registra a dificuldade de relacionar «glória» e «esplendor», sem trocar «glórias» por uma interpretação de transformações.
  issues:
  - severity: high
    issue: «pela minha Lei» não tem apoio no segmento siríaco de 51:3.
    rationale: O texto qualifica os justificados com «em seu tempo», e a referência a leis aparece no contraste imediatamente anterior acerca dos que as rejeitaram; transferi-la para os justificados altera a afirmação.
  - severity: medium
    issue: «por meio de transformações» para ܒܫܘ̈ܒܚܐ.
    rationale: O termo remete a glórias/esplendores. «Transformações» é uma explicação contextual possível, mas não a tradução lexical segura e deve, se mencionada, permanecer em nota.
  - severity: low
    issue: «agora» e «considerados justos» enfraquecem ou alteram a formulação temporal e passiva.
    rationale: «Em seu tempo» corresponde ao complemento explícito; «foram justificados» conserva de maneira mais próxima o predicado passivo.
  revised_text: Quanto à glória dos que foram justificados em seu tempo — dos que tiveram entendimento em sua vida e plantaram no coração a raiz da sabedoria —, o esplendor deles será então glorificado em glórias[a], e a aparência de seu rosto será transformada na luz de sua beleza, para que recebam o mundo que não morre, que lhes é prometido.
  revised_footnotes:
  - marker: a
    text: 'Ou: «será glorificado em esplendores». A expressão também pode evocar uma transformação gloriosa, mas o termo siríaco designa literalmente glórias ou esplendores.'
    reason: Preserva a ambiguidade interpretativa sem substituir o sentido lexical básico por «transformações» no texto principal.
  revision_rationale: A revisão elimina a referência não atestada a «minha Lei» e restitui «em seu tempo». Traduz ܒܫܘ̈ܒܚܐ por «em glórias», com nota para a nuance transformativa contextual. Mantém a estrutura de tópico suspenso e o sujeito subsequente «o esplendor deles», conforme o siríaco e a observação do audit trail inglês.
