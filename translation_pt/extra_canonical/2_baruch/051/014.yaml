  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: pt
  text: Pois eles foram libertos deste mundo de aflição e depuseram o fardo das angústias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: mundo
  rationale: Equivalente direto e natural para o âmbito presente do qual os justos são libertos.
- source_word: ܥܩܬܐ / ܐܘܠܨܢܐ
  choice: aflição / angústias
  rationale: 'A redação preserva os dois campos semânticos distintos refletidos pela tradição textual: sofrimento opressivo e tribulações penosas.'
- source_word: ܡܠܟܒܕܐ
  choice: fardo
  rationale: Expressa literalmente uma carga pesada e mantém a imagem concreta daquilo que é deposto.
theological_decisions:
- issue: Natureza da libertação do mundo presente
  choice: foram libertos deste mundo de aflição
  alternative: escaparam deste mundo de sofrimento
  rationale: “Foram libertos” mantém a voz passiva e não especifica o agente, preservando a formulação teológica do texto sem acrescentar interpretação.
- issue: Sentido da deposição do fardo
  choice: depuseram o fardo das angústias
  alternative: livraram-se do peso das tribulações
  rationale: A escolha conserva a metáfora corporal de colocar de lado uma carga, sem reduzir a frase a uma ideia abstrata de alívio.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A concisão e o paralelismo da sentença foram preservados.
