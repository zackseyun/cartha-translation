lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: a forma deles
  rationale: No contexto da transformação após a ressurreição, o termo designa a aparência ou configuração visível; “forma” preserva essa amplitude melhor do que uma expressão estritamente física.
- source_word: ܒܝܫ
  choice: pior
  rationale: O comparativo explícito no siríaco pede “pior”, em contraste com o estado presente.
- source_word: ܬܫܢܝܩܐ
  choice: tormento
  rationale: Traduz diretamente a ideia de suplício ou aflição punitiva, mantendo o tom escatológico do contexto.
- source_word: ܕܢܣܒܪܘܢ
  choice: para que suportem
  rationale: Expressa a finalidade e o sentido de padecer ou aguentar o tormento, sem acrescentar detalhes não presentes no texto.
theological_decisions:
- issue: Natureza da transformação dos perversos
  choice: “a forma ... se tornará pior”
  alternative: “o corpo ... será deformado”
  rationale: O texto fala da forma ou aparência e não define com precisão a natureza material da transformação; a tradução preserva essa abertura.
- issue: Finalidade do estado transformado
  choice: “para que suportem o tormento”
  alternative: “a fim de serem eternamente castigados”
  rationale: O verso menciona tormento, mas não explicita aqui sua duração; evita-se importar uma conclusão teológica além do enunciado.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. “Agem perversamente” comunica conduta moral contínua sem recorrer a vocabulário arcaico.
