  yaml_path: translation/extra_canonical/2_baruch/051/013.yaml
  text: For the first will receive the last, those for whom they were waiting; and the last, those of whom they had heard that they had passed away.
translation:
  language: pt
  text: Pois os primeiros receberão os últimos, por quem esperavam; e os últimos receberão aqueles de quem tinham ouvido que haviam falecido.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܕܡܝܢ
  choice: os primeiros
  rationale: Preserva o contraste temporal e retórico com “os últimos” no contexto da ressurreição.
- source_word: ܡܣܟܝ
  choice: esperavam
  rationale: Expressa a ideia de aguardar com expectativa, sem acrescentar uma conotação doutrinária específica.
- source_word: ܐܙܠܘ ܗܘܘ
  choice: haviam falecido
  rationale: A expressão literalmente ligada a “ter ido/passado” funciona aqui como referência eufemística aos mortos; “haviam falecido” é natural e digna em português.
- source_word: ܢܩܒܠܘܢ
  choice: receberão
  rationale: Mantém o verbo concreto de acolhimento/encontro e sua repetição implícita nas duas partes da frase.
theological_decisions:
- issue: Identidade dos “primeiros” e dos “últimos”
  choice: Manter as designações sem explicá-las no texto
  alternative: Explicitar grupos ou gerações específicos
  rationale: O versículo depende do contexto e não identifica de modo inequívoco os grupos; explicitá-los resolveria indevidamente a ambiguidade.
- issue: Natureza do reencontro após a ressurreição
  choice: Traduzir como recepção mútua, sem desenvolver sua natureza
  alternative: Empregar “reencontrarão” ou explicar reconhecimento pessoal
  rationale: “Receberão” preserva mais diretamente a formulação da fonte e evita acrescentar pormenores teológicos.
translation_notes:
  register: Português moderno, claro e solene, com construção paralela preservada. A repetição de “receberão” na segunda oração foi explicitada para evitar ambiguidade sintática em português.
