  rationale: É a designação bíblica natural para aqueles caracterizados pela justiça.
- source_word: ܡܠܐܟ̈ܐ / correspondente esperado
  choice: anjos
  rationale: Equivalente português direto e tradicional para os seres celestiais mencionados na comparação.
