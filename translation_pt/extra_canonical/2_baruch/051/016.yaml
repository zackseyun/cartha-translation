base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/016.yaml
  text: For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they should not come to the honor of which I told you before.
translation:
  language: pt
  text: Pois escolheram para si este tempo, que não pode passar sem angústia, e escolheram para si aquele tempo, cujo fim está cheio de lamentos e males. Rejeitaram o mundo que não faz envelhecer os que nele entram e rejeitaram o tempo da glória, para não chegarem à honra de que lhe falei antes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܣܝܒ (forma causativa de ܣܐܒ, conforme o contexto textual reconstruído do versículo)
  choice: envelhece
  rationale: A forma causativa/transitiva comunica que esse mundo não faz envelhecer os que entram nele, em vez de apenas afirmar que o próprio mundo não envelhece.
- source_word: ܥܠܡܐ
  choice: mundo
  rationale: Mantém o termo escatológico amplo, sem o restringir indevidamente a «era» ou «vida futura».
- source_word: ܐܝܩܪܐ
  choice: honra
  rationale: Preserva a distinção em relação ao «tempo da glória» e corresponde naturalmente ao campo semântico de dignidade e honra.
theological_decisions:
- issue: Agente e objeto do envelhecimento no mundo futuro
  choice: «o mundo que não envelhece os que nele entram»
  alternative: «o mundo que não envelhece para os que nele entram» / «o mundo que não envelhece»
  rationale: A leitura causativa faz dos que entram no mundo o objeto do verbo e preserva a afirmação de que esse mundo não os sujeita ao envelhecimento.
- issue: Relação entre escolha humana e perda escatológica
  choice: Manter a repetição «escolheram para si» e «rejeitaram»
  alternative: Suavizar como simples preferência ou afastamento
  rationale: A repetição atribui responsabilidade às pessoas sem acrescentar uma formulação doutrinária sobre predestinação, mérito ou mecanismo de juízo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe bíblica moderada. A repetição retórica do original foi preservada; «lhe falei antes» mantém a referência singular a Baruque sem regionalismo excessivo.
