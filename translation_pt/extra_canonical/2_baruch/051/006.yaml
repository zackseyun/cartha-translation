  text: Pois primeiro verão e, depois, partirão para ser atormentados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܚܙܘܢ (sentido preservado no trecho, apesar da segmentação difícil do texto fornecido)
  choice: verão
  rationale: Mantém o sentido simples de ver/contemplar, sem acrescentar um objeto que o versículo não explicita.
- source_word: ܢܐܙܠܘܢ / ideia verbal de partir no trecho
  choice: partirão
  rationale: Reproduz o movimento subsequente indicado pelo siríaco e preservado pela camada inglesa, em vez de paráfrases como “serão levados”.
- source_word: ܬܫܢܝܩܐ
  choice: ser atormentados
  rationale: Expressa finalidade e voz passiva com naturalidade, preservando o sentido de suplício ou tormento.
theological_decisions:
- issue: Agente do tormento
  choice: Não explicitado
  alternative: “para que Deus os atormente” ou “para serem atormentados por seus algozes”
  rationale: O texto não identifica o agente; explicitá-lo resolveria indevidamente uma ambiguidade do original.
- issue: Objeto do verbo “ver”
  choice: Não explicitado
  alternative: “verão a glória dos justos”
  rationale: Embora o contexto possa sugerir o que é visto, este versículo isoladamente não o declara; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. A vírgula em “e, depois,” destaca a sequência temporal sem tornar a frase artificial.
