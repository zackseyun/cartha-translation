  text: For what then did men lose their life, and for what did those on the earth exchange their soul?
translation:
  language: pt
  text: Pois, por que, então, os seres humanos perderam a vida? E em troca de que os que estavam na terra entregaram a sua alma?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܢܝܢܫܐ
  choice: os seres humanos
  rationale: Expressa de modo inclusivo e natural o sentido coletivo de “filhos do homem/humanidade”, sem restringi-lo a homens do sexo masculino.
- source_word: ܚܝ̈ܐ
  choice: a vida
  rationale: Preserva o campo semântico de vida e o singular coletivo refletido pela tradição textual do versículo.
- source_word: ܢܦܫܐ
  choice: a sua alma
  rationale: Mantém a distinção retórica entre vida e alma, sem reduzir esta última a mera existência física.
- source_word: ܚܠܦ
  choice: em troca de que ... entregaram
  rationale: Reproduz a ideia de troca ou substituição em português corrente, conservando a pergunta sobre aquilo pelo qual a alma foi cedida.
theological_decisions:
- issue: Relação entre “vida” e “alma”
  choice: Manter os dois termos distintos
  alternative: Tratar ambos como sinônimos de vida
  rationale: O paralelismo pode aproximar os conceitos, mas o texto emprega vocabulário diferente; preservar a distinção evita resolver uma possível tensão antropológica.
- issue: Valor interrogativo da primeira expressão
  choice: “por que”
  alternative: “para quê” ou “por qual coisa”
  rationale: A construção pode perguntar tanto pela causa quanto pelo objeto ou proveito da perda. Em português, “por que” mantém a pergunta aberta e natural, enquanto a segunda oração explicita a noção de troca.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. O paralelismo interrogativo foi preservado em duas perguntas, e “seres humanos” evita uma leitura exclusivamente masculina.
