translation:
  language: pt
  text: e verão o tempo que agora está oculto para eles; e o tempo já não os fará envelhecer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: tempo
  rationale: Preserva a amplitude do termo siríaco, que pode indicar tempo, época ou período, sem especificar além do contexto.
- source_word: ܟܣܝ / ܚܒܝ
  choice: oculto
  rationale: Expressa de modo natural a ideia de algo atualmente encoberto ou não manifesto.
- source_word: ܣܐܒ
  choice: fará envelhecer
  rationale: A construção causativa comunica que o tempo deixará de produzir neles o envelhecimento.
theological_decisions:
- issue: Condição futura e relação com o tempo
  choice: Manter a afirmação de que o tempo já não causará envelhecimento
  alternative: Interpretar como abolição absoluta do tempo
  rationale: O texto afirma o fim do efeito envelhecedor do tempo sobre eles, mas não exige concluir que o próprio tempo deixará de existir.
