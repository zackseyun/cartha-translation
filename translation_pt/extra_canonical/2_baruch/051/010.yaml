base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/010.yaml
  text: For they will dwell in the heights of that world, and they will be made like the angels, and be made equal to the stars; and they will be changed into every form they desire, from beauty into loveliness, and from light into the splendor of glory.
translation:
  language: pt
  text: Pois habitarão nas alturas daquele mundo; serão feitos semelhantes aos anjos e iguais às estrelas. Serão transformados em toda forma que desejarem, passando da beleza à formosura e da luz ao esplendor da glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “alturas” (correspondente à expressão da tradição siríaca do versículo)
  choice: nas alturas daquele mundo
  rationale: Mantém a imagem espacial e escatológica sem explicá-la como “céu”, interpretação que estreitaria o sentido.
- source_word: “semelhantes / iguais” (paralelismo da tradição textual)
  choice: semelhantes aos anjos e iguais às estrelas
  rationale: Preserva os dois termos e a progressão poética, sem fundi-los em uma única comparação.
- source_word: “forma”
  choice: toda forma que desejarem
  rationale: Conserva a amplitude e a possível ambiguidade do termo, sem reduzi-lo a mera aparência física.
- source_word: “beleza / formosura”
  choice: da beleza à formosura
  rationale: Emprega dois vocábulos próximos, mas distintos, para reproduzir o paralelismo intensificador sem eliminar sua tensão semântica.
- source_word: “luz / esplendor da glória”
  choice: da luz ao esplendor da glória
  rationale: Mantém a progressão imagética e o substantivo teológico “glória” em linguagem natural e digna.
theological_decisions:
- issue: Agente da transformação escatológica
  choice: serão feitos semelhantes; serão transformados
  alternative: se tornarão semelhantes; se transformarão
  rationale: As formas passivas preservam o agente não declarado e evitam afirmar que a transformação ocorre por poder próprio.
- issue: Sentido das “alturas daquele mundo”
  choice: manter a expressão figurada
  alternative: explicitar como “o céu” ou “o mundo vindouro celestial”
  rationale: A tradução não identifica além do texto a localização nem resolve a cosmologia da passagem.
- issue: Comparação com anjos e estrelas
  choice: preservar como semelhança e igualdade, sem comentário ontológico
  alternative: explicar que os justos se tornam anjos ou seres astrais
  rationale: O texto descreve correspondência, mas não exige uma doutrina específica sobre mudança de natureza.
translation_notes:
  register: Português moderno, corrente e solene, com boa legibilidade brasileira. O trecho siríaco fornecido termina antes das palavras de 51:10; por isso, o texto do versículo foi formulado de modo conservador a partir da redação tradicional refletida na camada inglesa auditada, sem alegar decisões paleográficas que o recorte apresentado não permite verificar.
