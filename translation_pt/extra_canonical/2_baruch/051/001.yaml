  yaml_path: translation/extra_canonical/2_baruch/051/001.yaml
  text: And it shall be, after that appointed day has passed, that then the form of those who are condemned will be changed, and also the glory of those who are vindicated.
translation:
  language: pt
  text: E acontecerá que, depois de passar aquele dia determinado, será então transformada a forma dos que foram condenados, bem como a glória dos que foram vindicados.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra possibilidade: “será então transformada, posteriormente, a forma dos que foram condenados”. A sequência temporal do siríaco admite pequena variação de ligação entre as expressões.'
    reason: Preservar a ambiguidade sintática e temporal da redação siríaca.
lexical_decisions:
- source_word: ܨܘܪܬܗܘܢ
  choice: a forma
  rationale: Preserva o termo concreto e o motivo apocalíptico da transformação, sem o limitar à mera aparência exterior.
- source_word: ܐܙܕܩܘ
  choice: foram vindicados
  rationale: Mantém o sentido judicial de terem sua justiça reconhecida, evitando impor ao texto uma formulação doutrinária posterior.
- source_word: ܗܘ ܝܘܡܐ
  choice: aquele dia determinado
  rationale: Expressa em português natural a referência ao dia previamente estabelecido no contexto escatológico.
- source_word: ܫܘܒܚܬܗܘܢ
  choice: a glória
  rationale: Conserva a linguagem de exaltação escatológica e o paralelismo com a transformação da forma dos condenados.
theological_decisions:
- issue: Sentido judicial da condição dos dois grupos
  choice: “condenados” e “vindicados”
  alternative: “ímpios” e “justificados”
  rationale: A formulação judicial do texto é preservada sem substituir as categorias do trecho por rótulos morais genéricos nem carregar “justificados” de associações teológicas posteriores.
- issue: Natureza da mudança escatológica
  choice: Manter distintos “forma” e “glória”
  alternative: Explicitar que ambos os grupos recebem novos corpos ou novas aparências
  rationale: O versículo contrasta os termos sem explicar plenamente a natureza da transformação; a tradução não resolve essa tensão além do que o texto afirma.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe solene sem arcaísmos. “Forma”, “glória” e “vindicados” preservam o vocabulário concreto e judicial do texto.
