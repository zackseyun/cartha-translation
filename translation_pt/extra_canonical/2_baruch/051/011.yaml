base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/011.yaml
  text: For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their arrival.
translation:
  language: pt
  text: Pois as extensões do Paraíso se estenderão diante deles; será revelada a beleza da majestade dos seres viventes que estão debaixo do trono, bem como todos os exércitos de anjos — tanto os que agora são contidos pela minha palavra, para que não apareçam, como os que, por minha ordem, são mantidos em seus lugares até a chegada deles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “até que chegue a vinda deles”.'
    reason: Preserva uma formulação mais literal da construção temporal subjacente, que pode exprimir a chegada das pessoas ou o momento em que sua vinda se concretiza.
lexical_decisions:
- source_word: ܦܪܕܝܣܐ (refletido na tradição textual do versículo)
  choice: Paraíso
  rationale: Preserva o referente escatológico tradicional e mantém a dignidade do texto.
- source_word: expressão correspondente a expanses
  choice: vastidões
  rationale: Comunica espaços amplos que se abrem diante dos justos, com linguagem natural em português.
- source_word: expressão correspondente a living beings
  choice: seres viventes
  rationale: Mantém a ligação com os seres celestes junto ao trono sem identificá-los mais precisamente do que o texto permite.
- source_word: expressão correspondente a armies of the angels
  choice: exércitos de anjos
  rationale: É claro ao leitor moderno e conserva a imagem de hostes celestes organizadas.
- source_word: expressão correspondente a held fast by my word
  choice: contidos pela minha palavra
  rationale: Preserva a ideia de restrição eficaz mediante a palavra divina, sem especificar o modo dessa contenção.
theological_decisions:
- issue: Identidade dos seres viventes sob o trono
  choice: seres viventes
  alternative: criaturas vivas
  rationale: Evita equipará-los explicitamente a querubins ou a outra classe angelical não nomeada no texto.
- issue: Referente do possessivo em “chegada deles”
  choice: manter o pronome plural sem explicitação
  alternative: até a chegada dos justos
  rationale: O referente pode ser inferido pelo contexto, mas explicitá-lo no corpo do texto eliminaria uma ambiguidade genuína.
- issue: Natureza da ordem divina sobre os anjos
  choice: por minha ordem, são mantidos em seus lugares
  alternative: receberam ordem de permanecer em seus lugares
  rationale: A formulação escolhida conserva tanto a autoridade da ordem quanto o estado contínuo de permanência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura paralela “tanto... como...” esclarece os dois grupos de anjos sem resolver indevidamente o referente final. O marcador [a] foi incluído no texto principal.
