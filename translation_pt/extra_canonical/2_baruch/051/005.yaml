base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/005.yaml
  text: 'When therefore they see that those over whom they are now exalted are then exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms.'
translation:
  language: pt
  text: 'Quando, portanto, virem que aqueles sobre os quais agora se exaltam são então exaltados[a] e glorificados mais do que eles, estes e aqueles serão transformados: aqueles, para o esplendor dos anjos; estes, porém, definharão ainda mais, consumidos de espanto diante das visões e da contemplação das formas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “virem aqueles sobre os quais agora se exaltam, que esses então são exaltados”.'
    reason: Preserva como alternativa a construção proléptica possível no siríaco, embora menos natural em português.
lexical_decisions:
- source_word: ܢܬܬܚܠܦܘܢ (sentido preservado na tradição textual do versículo)
  choice: serão transformados
  rationale: Mantém o sentido de mudança ou transformação sem especificar indevidamente sua natureza.
- source_word: ܫܘܒܚܐ / terminologia de glória e esplendor no contexto
  choice: esplendor dos anjos
  rationale: “Esplendor” comunica luminosidade e glória em português corrente e digno, sem reduzir a expressão a mera aparência.
- source_word: formas
  choice: aparência das formas
  rationale: Preserva a linguagem visual e a relativa indeterminação do referente, em vez de interpretar “formas” como corpos ou naturezas.
theological_decisions:
- issue: Natureza da transformação dos dois grupos
  choice: serão transformados
  alternative: mudarão de natureza
  rationale: A formulação escolhida não define ontologicamente a mudança além do que o texto afirma.
- issue: Relação dos justos com os anjos
  choice: no esplendor dos anjos
  alternative: em anjos esplêndidos
  rationale: O texto descreve participação ou passagem para o esplendor angelical, não necessariamente conversão dos seres humanos em anjos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Os últimos” refere-se aos que agora são oprimidos, e “os primeiros”, aos que agora se exaltam sobre eles; essa formulação conserva a contraposição do texto sem acrescentar identificação denominacional.
