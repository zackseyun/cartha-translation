  source_fidelity: 'A estrutura contrastiva e a sequência dos referentes são preservadas: os que agora se exaltam sobre outros serão consumidos de espanto, enquanto os que estavam sob eles receberão o esplendor dos anjos. «Serão transformados» mantém adequadamente a mudança sem defini-la além do texto. A revisão torna mais explícita a referência de «estes» e «aqueles» e traduz o sentido visual de «sight of the forms» sem acrescentar interpretação.'
  naturalness: «Assombrados com» pode sugerir temor ou assombração em vez de espanto reverente, e «a aparência das formas» é menos natural e menos próximo de «a visão/contemplação das formas». A redação revista preserva o tom elevado com português moderno e claro.
  terminology: «Esplendor dos anjos» é apropriado e não implica que os seres humanos se tornem anjos. «Formas» é mantido, pois o referente permanece indeterminado no texto.
