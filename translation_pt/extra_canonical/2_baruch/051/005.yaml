  to: 'Quando, portanto, virem que aqueles sobre os quais agora se exaltam são então exaltados[a] e glorificados mais do que eles, estes e aqueles serão transformados: aqueles, para o esplendor dos anjos; estes, porém, definharão ainda mais, consumidos de espanto diante das visões e da contemplação das formas.'
