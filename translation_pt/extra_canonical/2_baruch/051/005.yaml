    rationale: A expressão pode carregar em português a noção de medo ou de algo sobrenaturalmente assustador. «Consumidos de espanto diante das visões» comunica melhor o maravilhamento/intensificação indicado pelo texto.
  - severity: low
    issue: «A aparência das formas»
    rationale: A formulação é algo redundante e enfraquece o sentido de contemplação ou visão. «A contemplação das formas» é natural e conserva a indeterminação do referente.
  - severity: low
    issue: Alternância «os últimos/os primeiros»
    rationale: Embora defensável, a ordem exige que o leitor reconstrua os antecedentes. «Aqueles/estes», com os antecedentes imediatamente recuperáveis, deixa clara a inversão sem alterar o sentido.
