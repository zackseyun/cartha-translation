lexical_decisions:
- source_word: whoever understands (o siríaco correspondente não consta da página fornecida)
  choice: quem compreender
  rationale: Preserva a formulação abrangente e a ação de compreender sem transformar a frase em referência a um grupo específico.
- source_word: then (o siríaco correspondente não consta da página fornecida)
  choice: então
  rationale: Mantém a referência temporal ou consequencial genuinamente aberta, sem ampliá-la para “naquele tempo”.
- source_word: wise (o siríaco correspondente não consta da página fornecida)
  choice: sábio
  rationale: É o equivalente direto, natural e digno, preservando a relação entre compreensão e sabedoria.
theological_decisions:
- issue: Se a relação entre compreender e ser sábio deve ser explicada como causal, moral ou escatológica
  choice: 'Manter a afirmação breve e não explicada: “quem compreender será então sábio”.'
  alternative: “Quem compreender essas coisas alcançará a sabedoria naquele tempo.”
  rationale: O texto não identifica expressamente o objeto da compreensão nem define a natureza da sabedoria; explicitar esses elementos resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene. A página siríaca fornecida termina no conteúdo de 2 Baruque 27:10 e não contém o texto de 28:1; por isso, esta redação segue a leitura restaurada e auditada no material de controle, sem incorporar por engano o conteúdo do capítulo anterior.
