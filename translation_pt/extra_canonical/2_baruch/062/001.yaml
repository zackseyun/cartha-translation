base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/062/001.yaml
  text: And the seventh black waters that you saw—this is the perversion brought about by the counsel of Jeroboam, who took counsel to make two calves of gold.
translation:
  language: pt
  text: E as sétimas águas negras que você viu — esta é[a] a perversão provocada pela deliberação de Jeroboão, que decidiu fazer dois bezerros de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estas são a perversão”.'
    reason: Registra a alternativa de concordância com o antecedente plural “águas”, embora o siríaco favoreça o feminino singular em concordância com “perversão”.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܚܫ̈ܟܐ / ܐܘܟܡ̈ܐ
  choice: águas negras
  rationale: Mantém o contraste concreto e recorrente da visão apocalíptica entre águas adversas e favoráveis; “negras” é mais definido que “escuras”.
- source_word: ܚܒܠܬܐ
  choice: perversão
  rationale: Expressa a deformação moral, cultual e política associada à iniciativa de Jeroboão, sem reduzi-la apenas a dano ou ruína.
- source_word: expressão de deliberação/conselho associada a Jeroboão
  choice: pela deliberação de Jeroboão, que decidiu
  rationale: Preserva a dupla referência ao ato de deliberar sem a repetição pouco natural “pelo conselho... que tomou conselho”.
- source_word: bezerros de ouro
  choice: dois bezerros de ouro
  rationale: Conserva de modo direto o número e o objeto cultual mencionados no texto.
theological_decisions:
- issue: Concordância do demonstrativo e da cópula com “perversão” ou com “águas”
  choice: esta é a perversão
  alternative: estas são a perversão
  rationale: O siríaco emprega demonstrativo e cópula no feminino singular, em concordância com o substantivo predicativo “perversão”; a alternativa registra a possível atração pelo antecedente plural “águas”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. “Você” corresponde ao destinatário singular e evita a marca regional de “tu”.
