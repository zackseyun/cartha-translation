lexical_decisions:
- source_word: ܒܝܫܘܬܐ
  choice: maldade
  rationale: Expressa de modo claro e corrente a qualidade moral negativa indicada pelo termo siríaco.
- source_word: ܡ̈ܠܟܐ
  choice: reis
  rationale: Equivalente direto e natural do substantivo plural siríaco.
- source_word: ܥܒܕ
  choice: praticaram
  rationale: No contexto de maldade, «praticar» é mais idiomático em português do que o literal «fazer», sem alterar o sentido.
- source_word: ܒܥܘܠܐ / expressão correspondente no texto transmitido
  choice: na injustiça
  rationale: Mantém a formulação circunstancial do original e evita explicar além do que o texto afirma.
theological_decisions:
- issue: Relação entre a maldade e a injustiça
  choice: «praticaram na injustiça»
  alternative: «praticaram injustamente»
  rationale: A construção nominal preserva melhor a distinção e a tensão retórica entre «maldade» e «injustiça», em vez de reduzir a segunda a mero advérbio.
translation_notes:
  register: Português moderno, sóbrio e acessível, com estrutura próxima do siríaco e continuidade sintática marcada pelo «E» inicial.
