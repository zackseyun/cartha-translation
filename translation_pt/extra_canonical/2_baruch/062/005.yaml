  text: And the time of the captivity that came upon the nine and a half tribes, because of their many sins.
translation:
  language: pt
  text: E o tempo do cativeiro[a] que sobreveio às nove tribos e meia, por causa de seus muitos pecados.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o cativeiro delas, que sobreveio às nove tribos e meia”.'
    reason: Registra a possível leitura possessiva refletida na tradição de tradução.
  - marker: b
    text: 'Ou: “porque estavam em muitos pecados”.'
    reason: Preserva uma formulação mais literal do possível idioma semítico subjacente.
lexical_decisions:
- source_word: captivity (conforme a camada inglesa auditada; o segmento siríaco do versículo não está claramente isolado no recorte fornecido)
  choice: cativeiro
  rationale: Termo natural e historicamente adequado para a deportação ou condição de exílio das tribos.
- source_word: nine and a half tribes
  choice: nove tribos e meia
  rationale: Preserva com precisão a contagem incomum do texto e sua referência histórica.
- source_word: many sins
  choice: muitos pecados
  rationale: Expressão corrente em português que mantém o conteúdo moral e causal do original sem reproduzir um possível semitismo de modo artificial.
theological_decisions:
- issue: Relação causal entre os pecados e o cativeiro
  choice: por causa de seus muitos pecados
  alternative: porque estavam em muitos pecados
  rationale: A formulação escolhida comunica naturalmente a causalidade, sem acrescentar uma explicação teológica além do que o texto afirma.
- issue: Possível vínculo possessivo de “cativeiro” com as tribos
  choice: o cativeiro que sobreveio às nove tribos e meia
  alternative: o cativeiro das nove tribos e meia
  rationale: Mantém o cativeiro como acontecimento que lhes sobreveio e evita resolver de forma excessiva a nuance entre evento e estado.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e ampla inteligibilidade internacional. O recorte siríaco fornecido corresponde a um conjunto interpolado de páginas do capítulo e não permite identificar com segurança o segmento exato do versículo; por isso, a redação segue cautelosamente a camada inglesa auditada e explicita as variantes tradicionais em notas.
