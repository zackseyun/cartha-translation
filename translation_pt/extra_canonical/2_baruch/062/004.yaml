translation:
  language: pt
  text: E a retenção da chuva, e as fomes que sobrevieram, até que as mulheres comeram o fruto do próprio ventre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܥܝܘܬ ܕܡܛܪܐ
  choice: retenção da chuva
  rationale: Expressa a falta ou suspensão da chuva no contexto de calamidades, sem acrescentar uma causa não explicitada.
- source_word: ܟܦܢ̈ܐ
  choice: fomes
  rationale: O plural preserva a referência a episódios repetidos ou múltiplos de escassez extrema.
- source_word: ܦܐܪܐ ܕܟܪܣܗܝܢ
  choice: o fruto do próprio ventre
  rationale: Mantém a imagem semítica solene e compreensível, deixando claro que se trata dos filhos gerados pelas mulheres.
theological_decisions:
- issue: Agência divina na retenção da chuva e nas fomes
  choice: Não explicitar quem reteve a chuva ou causou as fomes
  alternative: “Deus reteve a chuva e enviou fomes”
  rationale: A formulação do versículo enumera as calamidades sem nomear diretamente o agente; explicitar Deus resolveria além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e direto. “Sobrevieram” preserva o tom narrativo solene; “fruto do próprio ventre” mantém a força da imagem original sem recorrer a formulação excessivamente clínica.
