  text: But concerning the nations, it would be too much to tell how they continually acted in impiety and wickedness and never showed themselves righteous.
translation:
  language: pt
  text: Mas, quanto às nações, seria demais contar como agiram continuamente com impiedade e perversidade, sem jamais se mostrarem justas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܥܡ̈ܡܐ (sentido refletido pela tradição textual: “nações”)'
  choice: nações
  rationale: Mantém o referente coletivo e o contraste do contexto, sem restringi-lo a um grupo étnico específico.
- source_word: conceito de ação contínua expresso na tradição textual
  choice: agiram continuamente
  rationale: Reproduz a persistência da conduta, em português natural, sem ampliar a afirmação para uma qualidade essencial dos povos.
- source_word: conceitos de impiedade e maldade na tradição textual
  choice: impiedade e perversidade
  rationale: 'Preserva os dois aspectos coordenados: irreverência moral-religiosa e conduta má; “perversidade” é corrente e digna no registro bíblico moderno.'
- source_word: conceito de justiça/retidão na tradição textual
  choice: se mostrarem justas
  rationale: Preserva a formulação sobre manifestação ou demonstração de justiça, em vez de declarar simplesmente que nunca eram justas.
theological_decisions:
- issue: Alcance da avaliação negativa das nações
  choice: “como agiram continuamente... sem jamais se mostrarem justas”
  alternative: “como eram sempre ímpias e perversas e nunca foram justas”
  rationale: A redação escolhida mantém o foco textual na conduta e em sua manifestação, evitando transformar a frase numa afirmação ontológica mais forte.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção “seria demais contar” conserva o caráter retórico da frase. O recorte siríaco fornecido é um agrupamento provisório de páginas, com sobreposição e segmentação incerta; por isso, as decisões lexicais específicas foram formuladas com cautela e controladas pela tradição textual refletida na camada inglesa auditada.
