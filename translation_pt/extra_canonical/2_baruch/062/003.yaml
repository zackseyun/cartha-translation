lexical_decisions:
- source_word: ܥܒܕܝܗ̇
  choice: os atos de Jezabel
  rationale: O termo siríaco denota os atos ou feitos dela; “atos” é natural em português e evita a leitura incorreta “maldição”.
- source_word: ܦܘܠܚܢܐ ܕܦܬܟܪ̈ܐ
  choice: o culto aos ídolos
  rationale: Expressa de modo claro e corrente a ideia de serviço ou culto prestado a ídolos.
- source_word: ܥܒܕ ܐܝܣܪܐܝܠ
  choice: que Israel praticava
  rationale: Neste contexto, o verbo “fazer” refere-se à prática do culto; “praticava” produz uma frase natural sem alterar o sentido.
theological_decisions:
- issue: Natureza da referência a Jezabel
  choice: atos
  alternative: maldição
  rationale: A evidência lexical favorece “atos/feitos”; não há base suficiente para introduzir “maldição”.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. “Naquele tempo” preserva a referência temporal do texto.
