- source_word: ܕܫܒܥ (sentido contextual da enumeração)
  choice: sétimas
  rationale: Conserva a posição ordinal das águas na série visionária e concorda naturalmente com o substantivo plural em português.
- source_word: ܕܚܙܝܬ
  choice: que você viu
  rationale: Traduz diretamente a oração relativa e usa uma forma moderna, clara e amplamente compreensível em português.
theological_decisions:
- issue: Valor simbólico das águas negras
  choice: Preservar a imagem sem explicá-la
