base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
translation:
  language: pt
  text: '¹ Mas, ainda assim, perguntarei a ti, ó Poderoso, e pedirei misericórdia àquele que fez todas as coisas: Em que forma viverão os que estiverem vivos em seus dias? E como será preservado o esplendor[a] dos que vierem depois daquele tempo? Assumirão então esta forma presente? Permanecerão essas semelhanças humanas e serão estabelecidas como seres vivos? Ou talvez transformarás essas coisas que existiram no mundo, assim como o próprio mundo?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A leitura siríaca neste ponto é incerta; outra possibilidade é “brilho”.
    reason: O termo preservado no texto fornecido é difícil ou possivelmente corrompido, enquanto a tradição de controle favorece um sentido ligado a brilho ou esplendor.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (leitura de controle; o texto fornecido apresenta ܚܒܝܒܝ)
  choice: ó Poderoso
  rationale: A leitura de controle sustenta um título divino, correspondente a “Poderoso”. A forma exibida no recorte parece resultar de transmissão ou leitura textual divergente e significaria “meu amado”, o que não se harmoniza com a sequência adotada.
- source_word: ܕܡܘܬܐ
  choice: forma / semelhanças
  rationale: O substantivo designa forma, aparência ou semelhança, não “morte”. A variação em português mantém o campo semântico e torna clara a pergunta sobre a condição humana futura.
- source_word: ܙܥܘܪܬܗ
  choice: esplendor
  rationale: A leitura siríaca transmitida neste ponto é difícil e possivelmente corrompida; a tradição de controle aponta para “esplendor” ou “brilho”. “Esplendor” preserva o sentido provável sem lhe acrescentar uma interpretação doutrinária.
- source_word: ܡܚܠܦ
  choice: transformarás
  rationale: O verbo expressa mudança ou alteração. “Transformarás” comunica naturalmente a possível mudança da forma humana e do mundo, sem definir sua extensão.
- source_word: ܡܩܝܡܝܢ ܚܝ̈ܐ
  choice: serão estabelecidas como seres vivos
  rationale: A construção pergunta se as semelhanças humanas permanecerão e serão constituídas ou restauradas como viventes; evita a leitura sintaticamente inadequada de que elas sustentam os vivos.
theological_decisions:
- issue: Continuidade ou transformação da forma humana futura
  choice: Manter a passagem como uma série de perguntas abertas sobre permanência e transformação.
  alternative: Fazer o texto afirmar explicitamente a identidade integral do corpo presente ou, no extremo oposto, sua substituição total.
  rationale: O versículo formula a tensão, mas não a resolve. A tradução não antecipa a resposta do contexto posterior nem impõe uma doutrina específica da ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. As perguntas sucessivas conservam o caráter especulativo e apocalíptico do original; “seres vivos” explicita apenas o necessário para reproduzir a sintaxe e o sentido provável.
