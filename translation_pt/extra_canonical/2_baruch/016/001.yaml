base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/016/001.yaml
  text: And I answered and said, "O Lord, my Lord, the years of this age are few and evil, and who can acquire, in so little time, that which is immeasurable?"
translation:
  language: pt
  text: 'E respondi: “Ó Senhor, meu Senhor, os anos desta era são poucos e maus. Quem pode, em tão pouco tempo, alcançar aquilo que não tem medida?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫ̈ܢܝܗܝ
  choice: os anos
  rationale: Conserva a referência concreta à curta duração da vida humana; embora ‘dias’ seja possível em sentido amplo, o substantivo siríaco favorece ‘anos’.
- source_word: ܙܒܘ̈ܢܝ
  choice: desta era
  rationale: No contexto apocalíptico, designa a ordem presente e mortal, não apenas um momento ou período indefinido.
- source_word: ܡܫܟܚ
  choice: pode ... alcançar
  rationale: Expressa capacidade de atingir ou obter o fim em vista sem sugerir aquisição comercial.
- source_word: ܡܟܝܠܐ
  choice: em tão pouco tempo
  rationale: Torna natural em português a ideia de uma extensão breve e limitada, em contraste com o que não pode ser medido.
- source_word: ܡܫܘܚܬܐ
  choice: aquilo que não tem medida
  rationale: Preserva a imagem de medida e o contraste retórico com a brevidade da vida, sem definir além do que o texto permite.
theological_decisions:
- issue: Se a pergunta contesta a justiça divina ou lamenta a incapacidade humana diante de um fim incomensurável
  choice: A tradução mantém a pergunta como lamento pela brevidade humana diante daquilo que não tem medida.
  alternative: Entendê-la como contestação direta da justiça da exigência divina.
  rationale: O contexto responde ressaltando que o desfecho não depende da duração da vida, sem eliminar a tensão presente na pergunta de Baruque.
translation_notes:
  register: Português moderno, digno e de leitura natural. ‘Ó Senhor, meu Senhor’ conserva a invocação enfática; ‘poucos e maus’ mantém a concisão e a força do paralelismo; ‘aquilo que não tem medida’ retém a ambiguidade do referente.
