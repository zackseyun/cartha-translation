base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/033/001.yaml
  text: “Are these the commands that your companion Jeremiah commanded you, saying, ‘Look after this people while I go and comfort the rest of our brothers in Babylon, those who have fallen into captivity’? And now, if you also leave us, it would be better for all of us to die before you than for you to depart from us.”
translation:
  language: pt
  text: '“São estas as ordens que seu companheiro Jeremias[a] lhe deu: ‘Cuide deste povo enquanto eu vou consolar o restante de nossos irmãos na Babilônia, os que foram levados ao cativeiro’? E agora, se você também nos deixar, seria melhor que todos nós morrêssemos diante de você do que que você se afastasse de nós.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra leitura: “Jeremias, o profeta”.'
    reason: Registra a variante herdada sem afastar do texto principal a leitura do siríaco de Ceriani.
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܐ
  choice: ordens
  rationale: Expressa instruções ou incumbências com força, em português corrente, sem a rigidez excessiva de uma formulação jurídica.
- source_word: ܚܒܪܟ
  choice: seu companheiro
  rationale: Preserva o vínculo próximo entre Jeremias e Baruque sem tornar a relação casual demais.
- source_word: ܐܦܝܣ
  choice: consolar
  rationale: O Aphel de ܦܝܣ pode significar persuadir, exortar ou consolar; no contexto dos irmãos cativos, “consolar” oferece o sentido mais natural, sem excluir a ideia de encorajamento.
- source_word: ܐܚ̈ܝ
  choice: irmãos nossos
  rationale: Mantém a linguagem familiar e comunitária do siríaco; a ordem marcada soa digna e ajuda a conservar a inclusão do falante.
- source_word: ܕܢܦܠܘ
  choice: os que foram levados ao cativeiro
  rationale: Comunica de modo natural a condição dos exilados. A margem da fonte é instável, por isso a formulação evita reconstruir pormenores jurídicos não totalmente seguros.
- source_word: ܫܪܘܟ
  choice: se afastar de nós
  rationale: Preserva a carga afetiva de retirada e abandono, distinguindo-a do anterior “nos deixar” sem alterar o sentido central.
theological_decisions:
- issue: Identidade de Jeremias em ܚܒܪܟ ܐܪܡܝܐ
  choice: seu companheiro Jeremias
  alternative: Jeremias, o profeta
  rationale: O texto siríaco apresentado traz literalmente “seu companheiro Jeremias”; a alternativa “o profeta” pode refletir outra leitura ou tradição, mas não deve substituir silenciosamente a evidência primária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento por “você” para naturalidade brasileira. A pergunta e a súplica preservam o tom emotivo do povo. O marcador [a] aparece junto ao nome correspondente.
