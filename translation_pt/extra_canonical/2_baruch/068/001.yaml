  text: '1 E as décimas segundas águas luminosas que você viu — esta é a palavra[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este é o significado”.'
    reason: A palavra siríaca pode designar tanto a palavra ou declaração quanto o sentido interpretativo apresentado a seguir.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: águas luminosas
  rationale: Preserva a imagem simbólica recorrente e o contraste com as águas escuras, em linguagem natural e digna.
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: esta é a palavra
  rationale: Mantém de perto a fórmula siríaca que introduz a interpretação, sem substituí-la por uma identificação plural.
theological_decisions:
- issue: Sentido da fórmula introdutória
  choice: esta é a palavra
  alternative: este é o significado
  rationale: A tradução conserva a formulação concreta do siríaco; a nota registra o valor interpretativo possível sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O ordinal foi mantido junto de “águas”, e o travessão introduz a fórmula explicativa.
