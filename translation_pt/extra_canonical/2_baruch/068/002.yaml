  yaml_path: translation/extra_canonical/2_baruch/068/002.yaml
  text: After these things a time will come when your people will fall into such distress that they will all be in danger of perishing together.
translation:
  language: pt
  text: Depois dessas coisas, virá um tempo em que teu povo cairá em tamanha aflição que todos estarão em perigo de perecer juntos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: Depois dessas coisas
  rationale: Preserva de forma natural a sequência temporal expressa pela locução siríaca.
- source_word: ܙܒܢܐ
  choice: um tempo
  rationale: Mantém a referência a um período futuro sem especificar duração.
- source_word: ܐܬܒܨܪܘ
  choice: cairá em tamanha aflição
  rationale: No contexto, comunica redução, abatimento ou condição extrema do povo; a formulação portuguesa preserva a ideia de grave adversidade sem definir sua causa.
- source_word: ܐܒܕܢ
  choice: perecer
  rationale: Expressa a ameaça de ruína ou morte coletiva com registro digno e corrente.
theological_decisions:
- issue: Natureza da aflição futura
  choice: Não especificar se a aflição é juízo divino, perseguição ou calamidade política
  alternative: Explicitar a aflição como castigo ou perseguição
  rationale: O versículo anuncia o perigo extremo, mas não identifica aqui sua causa; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. O intensificador “tamanha” comunica a gravidade necessária sem tornar a frase excessivamente explicativa.
