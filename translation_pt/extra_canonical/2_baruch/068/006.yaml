  text: The nations also will come to honor it, but not as fully as before.
translation:
  language: pt
  text: As nações também virão honrá-la, mas não tão plenamente como antes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܒ / ܐܝܩܪܐ
  choice: honrá-la
  rationale: O campo semântico expresso no testemunho siríaco envolve engrandecer ou conferir honra; “honrá-la” preserva o sentido e mantém naturalidade em português.
- source_word: ܡܕ̈ܝܢܬܐ / referência coletiva aos povos
  choice: as nações
  rationale: O contexto descreve coletividades gentílicas; “as nações” é a formulação bíblica corrente e corresponde à leitura auditada do versículo.
- source_word: expressão comparativa de diminuição
  choice: não tão plenamente como antes
  rationale: A formulação conserva a comparação temporal e a redução de grau sem especificar indevidamente em que consistia essa plenitude.
theological_decisions:
- issue: Referente do pronome feminino
  choice: manter “-la” sem explicitar o referente
  alternative: substituir o pronome pelo nome da cidade ou de Sião
  rationale: O versículo depende do contexto imediato, e explicitar o referente introduziria uma identificação que não está lexicalmente repetida nesta unidade.
- issue: Natureza da honra prestada pelas nações
  choice: usar “honrar”, sem linguagem de adoração
  alternative: usar “venerar” ou “adorar”
  rationale: “Honrar” preserva a amplitude semântica e evita atribuir ao ato uma conotação cultual não exigida pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. A redação mantém a concisão do versículo e sua dependência contextual. Como o trecho siríaco fornecido é um recorte amplo, com segmentação e alinhamento do versículo incertos, a formulação segue a evidência contextual disponível e a camada inglesa auditada, sem acrescentar especificações.
