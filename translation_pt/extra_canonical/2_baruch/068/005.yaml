  yaml_path: translation/extra_canonical/2_baruch/068/005.yaml
  text: And at that time, after a short interval, Zion will be rebuilt, its offerings restored, and the priests will return to their ministry.
translation:
  language: pt
  text: E naquele tempo[a], depois de um breve intervalo, Sião será reconstruída, suas ofertas serão restabelecidas, e os sacerdotes voltarão ao seu ministério.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E então”.'
    reason: Registra uma tradução possível da expressão temporal, embora “naquele tempo” reflita mais diretamente o demonstrativo siríaco.
lexical_decisions:
- source_word: ܘܒܗܘ ܙܒܢܐ (w-b-haw zabnā)
  choice: E naquele tempo
  rationale: Preserva a referência temporal específica da expressão siríaca, em vez de reduzi-la apenas a uma sequência narrativa.
- source_word: ܨܗܝܘܢ (Ṣehyon)
  choice: Sião
  rationale: Mantém o nome tradicional e amplamente reconhecido em português.
- source_word: ofertas (termo siríaco subjacente não isolável com segurança no recorte fornecido)
  choice: ofertas
  rationale: Expressa de modo natural os oferecimentos cultuais ligados à restauração de Sião, sem especificar indevidamente uma classe particular de sacrifícios.
- source_word: ministério/serviço sacerdotal (termo siríaco subjacente não isolável com segurança no recorte fornecido)
  choice: ministério
  rationale: No contexto dos sacerdotes, designa seu serviço cultual de maneira clara, digna e não denominacional.
theological_decisions:
- issue: Natureza da restauração de Sião e do culto
  choice: Manter as afirmações concretas sobre reconstrução, ofertas e serviço sacerdotal
  alternative: Interpretá-las explicitamente como símbolos de uma restauração espiritual
  rationale: O versículo descreve a restauração sem explicar se deve ser entendida literal ou simbolicamente; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de alcance internacional. A coordenação foi mantida para conservar o ritmo profético da frase.
