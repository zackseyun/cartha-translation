  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܙܒܢܐ ܗܘ (b-zabnā haw)
  choice: naquele tempo
  rationale: A preposição, o substantivo “tempo” e o demonstrativo formam uma referência definida a um período específico, não a um sentido vago como “com o tempo”.
- source_word: “muita/grande alegria”
  choice: grande alegria
  rationale: Em português corrente, “ter grande alegria” transmite com naturalidade a intensidade da alegria, sem acrescentar causa ou duração não expressas.
theological_decisions:
- issue: Referência temporal escatológica
  choice: naquele tempo
  alternative: com o tempo
  rationale: O demonstrativo aponta para o período específico descrito no contexto; a alternativa sugeriria apenas uma evolução gradual ou eventual e enfraqueceria essa referência.
translation_notes:
  register: Redação simples, digna e direta, com vocabulário amplamente compreensível em português moderno e boa legibilidade brasileira.
