base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/007.yaml
  text: And it will happen that, when the time of its completion draws near for it to fall, then the reign of my Messiah will be revealed, which is like the fountain and like the vine.
translation:
  language: pt
  text: E acontecerá que, quando se aproximar o tempo de sua consumação[a], para que ela caia, então será revelado o domínio do meu Messias, que é como a fonte e como a videira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de seu fim”.'
    reason: O substantivo siríaco pode designar tanto a consumação quanto o término.
lexical_decisions:
- source_word: ܫܘܠܡܗ̇ (šūlāmāh)
  choice: sua consumação
  rationale: O termo pode indicar conclusão, término ou consumação. “Consumação” preserva o sentido de um processo que chega ao fim e mantém a referência feminina ao reino mencionado no contexto.
- source_word: ܬܦܠ (teppel)
  choice: ela caia
  rationale: O verbo significa “cair” e se refere ao reino, de gênero feminino no contexto. A tradução retém a oração de queda explicitamente presente no siríaco.
- source_word: ܪܝܫܝܬܗ ܕܡܫܝܚܝ (rēšīteh d-mšīḥy)
  choice: o domínio do meu Messias
  rationale: Neste contexto, ܪܝܫܝܬܐ denota primazia, governo ou domínio. “Domínio” comunica o exercício soberano do Messias sem impor uma formulação denominacional.
- source_word: ܡܒܘܥܐ ... ܓܦܢ (mabbūʿā ... gpen)
  choice: a fonte ... a videira
  rationale: Mantém literalmente as duas imagens simbólicas do texto, sem explicar ou harmonizar seu significado.
theological_decisions:
- issue: Natureza do governo messiânico
  choice: domínio do meu Messias
  alternative: reino do meu Messias
  rationale: “Domínio” preserva a noção de autoridade governante do termo siríaco e evita identificá-lo automaticamente com o substantivo “reino” usado para o poder anterior.
- issue: Relação entre a consumação e a queda do reino
  choice: quando se aproximar o tempo de sua consumação, para que ela caia
  alternative: quando se aproximar o tempo de seu fim e de sua queda
  rationale: A escolha conserva as duas ideias e a relação sintática do siríaco, sem omitir a queda nem fundi-la silenciosamente com a consumação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém a solenidade profética, explicita o referente feminino “ela” (o reino do contexto) e preserva as imagens da fonte e da videira.
