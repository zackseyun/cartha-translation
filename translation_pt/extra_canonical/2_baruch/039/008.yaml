base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/008.yaml
  text: 'And when it is revealed, it will uproot the multitude of its host. And as for the tall cedar that you saw left from that forest, and the words that the vine spoke with it which you heard—this is the meaning:'
translation:
  language: pt
  text: 'Quando ele se revelar, arrancará pela raiz a multidão de suas forças. Quanto ao cedro alto que você viu restar daquela floresta e às palavras que a videira falou com ele, as quais você ouviu[a] — este é o significado:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as quais você ouviu —”.'
    reason: Registra a possibilidade tradicional de encerrar a formulação após «ouviu», embora o texto principal preserve a transição explicativa explícita.
lexical_decisions:
- source_word: ܐܬܓܠܝܬ
  choice: se revelar
  rationale: Preserva a linguagem de manifestação ou revelação do referente, sem reduzi-la a simples aparecimento.
- source_word: ܬܥܩܘܪ
  choice: arrancará pela raiz
  rationale: Expressa a força do verbo de desenraizar, importante na imagem da árvore e da floresta.
- source_word: ܚܝܘܬܐ ... ܡܢܗ̇
  choice: a multidão do exército dela
  rationale: Segue a leitura contextual refletida pela tradição textual e mantém o pronome feminino ligado à potência ou reino anteriormente descrito.
- source_word: ܐܪܙܐ ܕܪܡܐ
  choice: o cedro alto
  rationale: Tradução direta da imagem visionária, com adjetivo natural em português.
- source_word: ܐܫܬܚܪ
  choice: permanecer
  rationale: Comunica que o cedro foi deixado ou restou após a destruição da floresta.
- source_word: ܓܦܢܐ
  choice: a videira
  rationale: Mantém a imagem simbólica distinta do cedro.
- source_word: ܗܢܘ ܡܠܬܗ
  choice: este é o significado
  rationale: No contexto de interpretação da visão, 'significado' comunica naturalmente a fórmula explicativa sem apagar sua transição explícita.
theological_decisions:
- issue: Identidade do agente que se revela
  choice: Manter o pronome “ele” sem identificar nominalmente o referente neste versículo
  alternative: Explicitar “o meu Messias” ou outro antecedente
  rationale: O contexto fornece o referente, mas o versículo o retoma pronominalmente; a tradução preserva essa coesão e evita acrescentar uma identificação ao texto imediato.
- issue: Referente do possessivo feminino em “exército dela”
  choice: Preservar o pronome feminino
  alternative: Substituí-lo pelo nome interpretado do reino ou da potência
  rationale: Mantém a cadeia referencial e a tensão simbólica do texto, sem resolver além do que a formulação permite.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe brasileira amplamente compreensível. As imagens visionárias de revelação, desenraizamento, cedro e videira foram mantidas; evitou-se identificar de modo interpretativo os símbolos no corpo do versículo.
