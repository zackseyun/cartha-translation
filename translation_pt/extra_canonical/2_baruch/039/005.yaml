base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/005.yaml
  text: And after these a fourth kingdom will arise, whose power will be harsher and worse than those that were before it. It will rule for many times like the forests of the plain, and it will hold the times in its grasp and lift itself up more than the cedars of Lebanon.
translation:
  language: pt
  text: Depois desses, surgirá um quarto reino, que será mais severo e pior do que os reinos anteriores. Ele governará por muitos tempos, como as florestas da planície; terá os tempos em seu poder e se elevará mais do que os cedros do Líbano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: reino
  rationale: O substantivo siríaco designa aqui a potência ou domínio régio apresentado na sequência dos reinos.
- source_word: ܕܡܟܝ
  choice: cujo poder
  rationale: A leitura do trecho é textualmente difícil; no contexto comparativo, a formulação expressa a força ou caráter dominante do quarto reino. A opção mantém a fluência sem o confundir com uma pessoa.
- source_word: ܡܕܒܪܐ ܙܒܢܐ ܣܓܝ̈ܐܐ
  choice: dominará por muitos períodos
  rationale: O verbo tem o sentido de dirigir ou governar, e o plural temporal indica uma duração composta de muitos tempos ou períodos.
- source_word: ܐܝܟ ܥܒ̈ܐ ܕܦܩܥܬܐ
  choice: como as florestas da planície
  rationale: Preserva a comparação concreta e incomum do siríaco, sem tentar explicá-la ou substituí-la por uma metáfora mais convencional.
- source_word: ܘܬܚܙܐ ܙܒ̈ܢܐ
  choice: terá os tempos sob seu domínio
  rationale: A expressão transmitida é difícil; no contexto, indica controle ou alcance sobre os tempos. A tradução conserva essa ideia sem especificar indevidamente épocas históricas.
- source_word: ܐܪ̈ܙܐ ܕܠܒܢܢ
  choice: os cedros do Líbano
  rationale: Mantém a imagem tradicional de grandeza e elevação presente no texto siríaco.
theological_decisions:
- issue: Identidade histórica do quarto reino
  choice: Manter apenas “um quarto reino”
  alternative: Identificá-lo explicitamente com Roma ou outro império
  rationale: O versículo não nomeia o reino; identificá-lo importaria uma interpretação histórica específica.
- issue: Sentido dos “tempos”
  choice: Preservar a linguagem temporal ampla
  alternative: Traduzir como eras proféticas ou períodos predeterminados
  rationale: O siríaco não define aqui um esquema cronológico, e a tradução não deve resolver essa ambiguidade teológica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. A sintaxe foi levemente explicitada para tornar clara a sucessão dos reinos, preservando as imagens peculiares e as ambiguidades do siríaco.
