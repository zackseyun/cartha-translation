  text: 'As for the great forest that you saw, with the lofty and rugged mountains surrounding it, this is the interpretation:'
translation:
  language: pt
  text: Quanto à grande floresta que você viu, cercada por montanhas altas e escarpadas, esta é a interpretação:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “esta é a palavra”.
    reason: Registra o valor mais formal de ܡܠܬܐ sem sacrificar no texto principal o sentido contextual de explicação ou interpretação.
lexical_decisions:
- source_word: ܥܒܐ
  choice: floresta
  rationale: O substantivo siríaco designa mata ou bosque; “floresta” corresponde ao cenário da visão e mantém a imagem coletiva.
- source_word: ܪ̈ܒܐ ܘܩܫܝܐ
  choice: altas e escarpadas
  rationale: A expressão descreve as montanhas como grandes/elevadas e ásperas ou de difícil acesso; “altas e escarpadas” comunica naturalmente seus traços físicos em português.
- source_word: ܡܠܬܐ
  choice: interpretação
  rationale: Embora o sentido lexical básico seja “palavra”, no contexto imediato de uma explicação da visão a expressão introduz seu significado; “interpretação” preserva essa função discursiva.
theological_decisions:
- issue: Identificação da floresta com um reino
  choice: Não antecipar essa identificação neste versículo
  alternative: “Este é o reino que surgirá naqueles dias”
  rationale: A identificação desenvolvida nos versículos seguintes não deve ser importada para 39:2; aqui a frase apenas introduz a explicação da visão.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” conforme a interlocução direta. A construção “Quanto à...” introduz com naturalidade o elemento da visão que será explicado. O marcador [a] aparece no texto principal.
