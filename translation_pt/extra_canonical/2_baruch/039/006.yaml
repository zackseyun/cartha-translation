  text: And truth will hide itself in it, and all those who are stained with iniquity will flee to it, just as evil beasts flee and creep into the forest.
translation:
  language: pt
  text: E nela a verdade será estabelecida; e todos os que estão manchados de injustiça correrão para ela, assim como animais selvagens fogem e se arrastam para dentro da floresta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܪܐ (šrārā)
  choice: a verdade
  rationale: O substantivo significa normalmente “verdade”, “firmeza” ou “fidelidade”. “Verdade” preserva o contraste contextual com a injustiça.
- source_word: ܘܬܬܩܝܡ (w-tetqayyam)
  choice: será estabelecida
  rationale: A forma verbal apresentada na fonte siríaca significa “será estabelecida”, “se firmará” ou “permanecerá”.
- source_word: ܕܡܟܬܡܝܢ ܒܥܘܠܐ (d-mekkatmīn b-ʿawlā)
  choice: que estão manchados de injustiça
  rationale: Mantém a imagem concreta de contaminação moral expressa por “manchados” e traduz ʿawlā de modo natural como “injustiça”.
- source_word: ܚܝ̈ܘܬܐ ... ܘܚ̈ܠܒܝ ܒܥܒܐ
  choice: animais selvagens fogem e rastejam para dentro da floresta
  rationale: 'Segue a leitura verbal paralela registrada na revisão: os mesmos animais tanto fogem como rastejam, em vez de introduzir uma segunda classe de criaturas.'
theological_decisions:
- issue: A relação entre a verdade e o reino simbolizado
  choice: “a verdade será estabelecida”
  alternative: “a verdade se esconderá” ou “a segurança será estabelecida”
  rationale: A redação siríaca fornecida lê tetqayyam (“será estabelecida”) com šrārā (“verdade/firmeza”). A tradução evita identificar explicitamente esse reino ou resolver além do texto sua função escatológica.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe clara. “Para dentro da floresta” explicita naturalmente a direção do movimento sem alterar a imagem; as notas preservam as variantes relevantes.
