review_pass:
  verdict: revise
  source_fidelity: 'A oração siríaca disponível lê «w-tetqayyam bah šrārā»: «e a verdade se հաստատecerá/será estabelecida nela». Portanto, a redação principal do rascunho é fiel à fonte fornecida; a nota a, porém, inverte indevidamente essa evidência ao atribuir à fonte o sentido «a verdade se esconderá». A cláusula comparativa apresenta os animais como sujeitos de fugir e rastejar, conforme a leitura verbal indicada no audit trail.'
  naturalness: «Para ela fugirão» é compreensível, mas «todos os manchados de injustiça correrão para ela» é mais natural em português atual e conserva a direção expressa no siríaco. «Se arrastam para dentro da floresta» mantém a imagem sem uma construção pesada.
  terminology: «Verdade», «manchados de injustiça» e «animais selvagens» são escolhas adequadas. «Verdade» traduz šrārā de modo direto, sem converter o termo em «segurança» ou «firmeza»; «injustiça» traduz ʿawlā apropriadamente.
  issues:
  - severity: high
    issue: A nota a contradiz o texto siríaco fornecido.
    rationale: Ela afirma que o siríaco traz literalmente «a verdade será estabelecida nela», mas apresenta isso como alternativa à tradução principal e diz que a fonte inglesa auditada favorece «se esconderá». Para este texto, a forma verbal exibida é w-tetqayyam («será estabelecida/se firmará»), não «se esconderá». A nota cria uma variante sem apoio no testemunho apresentado e confunde a fidelidade da tradução.
  - severity: low
    issue: «Para ela fugirão» é menos idiomático que uma formulação com «correrão para ela».
    rationale: A revisão proposta expressa com maior fluência o movimento em direção ao referente feminino, sem alterar o sentido.
