  choice: Pois bem
  rationale: A partícula introduz enfaticamente a explicação da visão. “Pois bem” preserva a transição discursiva de modo mais natural em português do que um “mas” estritamente adversativo.
- source_word: ܦܘܫܩܗ
  choice: interpretação
  rationale: O termo designa a explicação ou interpretação do significado da visão; “interpretação” é claro e adequado ao contexto apocalíptico.
- source_word: ܚܙܘܐ
  choice: visão
  rationale: É o equivalente português corrente para uma revelação recebida em forma visionária e preserva o registro bíblico do texto.
