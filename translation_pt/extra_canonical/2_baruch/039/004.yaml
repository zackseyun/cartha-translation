base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/004.yaml
  text: And that one too, after a time, will be destroyed, and another will arise, a third; and it too will rule in its time and will be destroyed.
translation:
  language: pt
  text: Depois de algum tempo, essa também será destruída, e surgirá outra, uma terceira. Ela também governará durante o seu tempo e será destruída.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܚܒܠ
  choice: será destruída
  rationale: Preserva o sentido passivo de ruína ou destruição aplicado ao reino, sem especificar o agente.
- source_word: ܬܩܘܡ
  choice: surgirá
  rationale: No contexto da sucessão de reinos, expressa naturalmente a ideia de levantar-se ou aparecer em cena.
- source_word: ܙܒܢܗ̇
  choice: durante o seu tempo
  rationale: Mantém a referência ao período próprio e limitado de domínio desse reino.
theological_decisions:
- issue: Identidade dos reinos sucessivos
  choice: 'Manter apenas a numeração explícita: “uma terceira”'
  alternative: Identificar historicamente o terceiro reino
  rationale: O versículo não nomeia o reino; identificá-lo importaria uma interpretação histórica não expressa no texto.
translation_notes:
  register: Português atual, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A repetição de “também” foi preservada por marcar o padrão recorrente de ascensão, governo e destruição.
