translation:
  language: pt
  text: E este reino, que outrora destruiu Sião, será destruído e ficará sujeito àquele que vier depois dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ (malkūṯā)
  choice: reino
  rationale: Equivalente natural e direto para o substantivo siríaco, aqui referente a um poder imperial.
- source_word: ܕܡܟܝ (d-makkay)
  choice: outrora
  rationale: Expressa a referência temporal a uma ação anterior sem impor uma data específica.
- source_word: ܚܒܠܬ ܠܨܗܝܘܢ (ḥabblaṯ l-Ṣehyōn)
  choice: destruiu Sião
  rationale: Mantém o sentido forte do verbo e a referência explícita a Sião.
- source_word: ܬܫܬܥܒܕ (teštaʿbad)
  choice: ficará sujeito
  rationale: Reproduz o valor passivo de ser subjugado ou submetido, em português corrente e digno.
- source_word: ܠܗܘ ܕܐܬܐ ܒܬܪܗ (l-haw d-āṯē bāṯreh)
  choice: àquele que vier depois dele
  rationale: Preserva a formulação indefinida do siríaco e a sequência temporal, sem identificar o referente.
theological_decisions:
- issue: Identidade daquele que vem depois
  choice: àquele que vier depois dele
  alternative: ao reino que o suceder
  rationale: O texto não identifica expressamente a figura nem repete o termo “reino”; a tradução conserva essa abertura.
- issue: Voz da forma ܬܚܒܠ
  choice: será destruído
  alternative: destruirá
  rationale: A leitura passiva se ajusta à sequência em que o reino destruidor de Sião passa a sofrer derrota e sujeição; a possível leitura ativa é registrada em nota por causa da forma consonantal ambígua.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural tanto no Brasil quanto em outros contextos lusófonos. “Sião” preserva o nome tradicional, e a ambiguidade verbal genuína é explicitada sem sobrecarregar o texto principal.
