  text: And I, Baruch, went from there and came to the people, and I gathered them from the great to the small. 2 And I said to them, “Hear, children of Israel. See how few of you are left from the twelve tribes of Israel. 3 Yet to you and to your fathers the Lord gave the law more than to all the nations. 4 And because your brothers transgressed the commandments of the Most High, he brought upon them what you have seen. 5 But you also, if you do not do what is right, as your brothers did, 6 the righteous one will judge his works, because he is the Mighty One whom you seek, and he is the Mighty One in whom you hope. 7 And he sees to preserve, not to forsake. 8 Have you not seen what happened to Zion? 9 Or do you think that the place sinned, and for this it was overthrown? Or that the land did some wrong, and for this it was handed over? 10 And do you not know that because of you those things that did not sin were destroyed, and because of what you did, that which did no wrong was delivered
    up? 11 And all the people answered and said to me, “Because we remember the good testimonies that the Mighty One did with you, 12 as we have seen, and also those that we have not seen, the Anointed One will come. 13 But now, ask on our behalf from above, and write also to our brothers in Babylon a letter of instruction and a writing of hope, 14 that you may show them also that which has not departed from you. 15 For the counsels of Israel have perished, and the lamps that gave light are extinguished, and the springs from which we used to drink have ceased. 16 And we are left in darkness, and in the thicket of the forest, and in the thirst of the wilderness.”
translation:
  language: pt
  text: '1 Eu, Baruque, saí dali, fui até o povo e reuni todos, do maior ao menor. 2 Então lhes disse: “Escutem, filhos de Israel! Vejam quão poucos de vocês restaram das doze tribos de Israel. 3 A vocês e a seus antepassados o Senhor deu a Lei, mais do que a todas as nações. 4 E, porque seus irmãos transgrediram os mandamentos do Altíssimo, ele trouxe sobre eles aquilo que vocês viram. 5 Mas vocês também, se não fizerem o que é justo, como seus irmãos fizeram, 6 o Justo julgará sua iniquidade, pois ele é o Poderoso a quem vocês buscam e o Poderoso em quem depositam a esperança. 7 Ele cuida de preservar, não de abandonar. 8 Vocês não viram o que aconteceu com Sião? 9 Ou pensam que o lugar pecou e por isso foi arrasado? Ou que a terra cometeu alguma injustiça e por isso foi entregue? 10 Não sabem que, por causa de vocês, foram destruídas coisas que não pecaram e que, por causa do que vocês fizeram, aquilo que não cometeu injustiça foi entregue?”


    11 Todo o povo me respondeu: “Nós nos lembramos dos bons testemunhos que o Poderoso realizou entre vocês, 12 tanto dos que vimos como também dos que não vimos: o Ungido virá. 13 Mas agora interceda por nós junto ao Altíssimo e escreva também a nossos irmãos na Babilônia uma carta de instrução e um escrito de esperança, 14 para mostrar também a eles aquilo que não se afastou de nós. 15 Pois os conselhos de Israel pereceram, as lâmpadas que iluminavam se apagaram, e as fontes das quais costumávamos beber deixaram de correr. 16 Nós fomos deixados na escuridão, no emaranhado da floresta e na sede do deserto.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: a Lei
  rationale: Mantém o sentido pactual e escriturístico do termo, com inicial maiúscula para indicar a Lei dada por Deus a Israel.
- source_word: ܡܪܝܡܐ
  choice: o Altíssimo
  rationale: Título divino reverente, tradicional e natural em português, correspondente ao sentido de exaltação.
- source_word: ܡܚܣܢܢܐ
  choice: o Poderoso
  rationale: Segue o valor contextual adotado no texto de consulta, preservando a repetição enfática do título divino; a forma siríaca admite associação com força e capacidade de sustentar.
- source_word: ܐܓܪܬܐ ܕܝܘܠܦܢܐ
  choice: uma carta de instrução
  rationale: Conserva tanto a natureza epistolar quanto o propósito didático da expressão.
- source_word: ܡܕܡ ܕܣܒܪܬܐ
  choice: um escrito de esperança
  rationale: Mantém a formulação documental sem especificar indevidamente o gênero do escrito.
- source_word: ܪ̈ܥܘܬܐ
  choice: os conselhos
  rationale: A vocalização do controle de Kmosko favorece pensamentos ou conselhos, e não pastores; a escolha também se harmoniza com as imagens de lâmpadas e fontes.
- source_word: ܫܪ̈ܓܐ
  choice: as lâmpadas
  rationale: Preserva a metáfora concreta de iluminação.
- source_word: ܡܒܘ̈ܥܐ
  choice: as fontes
  rationale: Reproduz a imagem de uma nascente de água corrente e vivificante.
- source_word: ܟܪܝܣܛܘܣ
  choice: o Ungido
  rationale: Traduz o título em vez de apenas transliterá-lo, preservando sua força messiânica sem acrescentar identificação denominacional.
theological_decisions:
- issue: Se Sião ou a terra são culpadas pela destruição
  choice: As perguntas retóricas negam que o lugar ou a terra tenham pecado e atribuem a catástrofe às ações do povo.
  alternative: Entender as frases apenas como uma declaração geral de juízo, sem afirmar a inocência do lugar e da terra.
  rationale: O paralelismo siríaco contrasta explicitamente a culpa humana com aquilo que não pecou nem praticou injustiça.
- issue: A afirmação acerca do Ungido
  choice: “o Ungido virá”
  alternative: “ele é o Ungido”
  rationale: A forma verbal ܢܝܬ̣ܐ expressa a vinda futura; a alternativa registra uma tradução anterior, mas não representa tão diretamente o verbo presente no testemunho fornecido.
- issue: A referência pronominal em “o Justo julgará as obras deles”
  choice: Mantida com referência formalmente aberta, sem identificar além do que o texto permite.
  alternative: Explicitar que Deus julgará as obras dos irmãos ou as obras do próprio agente mencionado.
  rationale: O trecho siríaco é sintaticamente difícil e a evidência fornecida não justifica resolver silenciosamente a referência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregaram-se “vocês” e formas verbais correntes, evitando arcaísmos. O paralelismo, as perguntas retóricas e as metáforas concretas do siríaco foram preservados; construções obscuras não foram harmonizadas teologicamente.
