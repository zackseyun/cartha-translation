    11 Todo o povo me respondeu: “Nós nos lembramos dos bons testemunhos que o Poderoso realizou entre vocês, 12 tanto dos que vimos como também dos que não vimos: o Ungido virá.[a] 13 Mas agora peça por nós ao que está no alto e escreva também a nossos irmãos na Babilônia uma carta de instrução e um escrito de esperança, 14 para mostrar também a eles aquilo que não se afastou de você. 15 Pois os conselhos de Israel pereceram, as lâmpadas que iluminavam se apagaram, e as fontes das quais costumávamos beber deixaram de correr. 16 Nós fomos deixados na escuridão, no emaranhado da floresta e na sede do deserto.”'
  to: '1 Eu, Baruque, saí dali, fui até o povo e reuni todos, do maior ao menor. 2 Então lhes disse: “Escutem, filhos de Israel! Vejam quão poucos de vocês restaram das doze tribos de Israel. 3 A vocês e a seus antepassados o Senhor deu a Lei, mais do que a todas as nações. 4 E, porque seus irmãos transgrediram os mandamentos do Altíssimo, ele trouxe sobre eles aquilo que vocês viram. 5 Mas vocês também, se não fizerem o que é justo, como seus irmãos fizeram, 6 o Justo julgará sua iniquidade, pois ele é o Poderoso a quem vocês buscam e o Poderoso em quem depositam a esperança. 7 Ele cuida de preservar, não de abandonar. 8 Vocês não viram o que aconteceu com Sião? 9 Ou pensam que o lugar pecou e por isso foi arrasado? Ou que a terra cometeu alguma injustiça e por isso foi entregue? 10 Não sabem que, por causa de vocês, foram destruídas coisas que não pecaram e que, por causa do que vocês fizeram, aquilo que não cometeu injustiça foi entregue?”


    11 Todo o povo me respondeu: “Nós nos lembramos dos bons testemunhos que o Poderoso realizou entre vocês, 12 tanto dos que vimos como também dos que não vimos: o Ungido virá. 13 Mas agora interceda por nós junto ao Altíssimo e escreva também a nossos irmãos na Babilônia uma carta de instrução e um escrito de esperança, 14 para mostrar também a eles aquilo que não se afastou de nós. 15 Pois os conselhos de Israel pereceram, as lâmpadas que iluminavam se apagaram, e as fontes das quais costumávamos beber deixaram de correr. 16 Nós fomos deixados na escuridão, no emaranhado da floresta e na sede do deserto.”'
  rationale: A revisão corrige os dois desvios verificáveis em relação ao siríaco fornecido (singular em v. 6 e primeira pessoa plural em v. 14), melhora uma formulação portuguesa em v. 13 e remove uma nota de histórico editorial que não é necessária para a compreensão nem para a fidelidade textual. Em v. 5, «como seus irmãos fizeram» conserva a construção sintaticamente tensa do texto, sem introduzir uma negação adicional.
