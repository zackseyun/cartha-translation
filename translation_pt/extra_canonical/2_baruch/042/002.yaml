base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/002.yaml
  text: And as for what you said, ‘For whom and for how many will these things be?’ — for those who have believed, there will be the good things spoken beforehand; but for those who despise them, the opposite of these things.
translation:
  language: pt
  text: 'E, quanto ao que você disse: “Para quem e para quantos serão estas coisas?”, para os que creram haverá as coisas boas anunciadas de antemão; mas, para os que as desprezam, haverá o contrário dessas coisas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܣܒܪܝܢ
  choice: os que creram
  rationale: O verbo siríaco pode abranger crer, confiar ou esperar. “Creram” preserva aqui o contraste entre acolher o anúncio e desprezá-lo, sem explicitar indevidamente o objeto da fé.
- source_word: ܛܒ̈ܬܐ ܕܡܩܕܡܐ ܐܡܝܪܢ
  choice: as coisas boas anunciadas de antemão
  rationale: Reproduz tanto o caráter benéfico das promessas quanto sua declaração prévia.
- source_word: ܒܡܘܒܠܐ ܕܗܠܝܢ
  choice: os que as desprezam
  rationale: Traduz o sentido contextual de tratar com desprezo as coisas anteriormente anunciadas, mantendo o contraste direto com os que creram.
theological_decisions:
- issue: Natureza das recompensas e consequências
  choice: “as coisas boas” e “o contrário dessas coisas”
  alternative: Especificar bênçãos e castigos
  rationale: O texto permanece deliberadamente genérico; a tradução não identifica além da fonte quais seriam os bens prometidos nem o seu contrário.
- issue: Referente de “creram”
  choice: Não explicitar um objeto além do que o contexto fornece
  alternative: “creram nessas promessas”
  rationale: A forma absoluta preserva a concisão e a abertura do siríaco, enquanto a cláusula seguinte indica o conteúdo em vista.
translation_notes:
  register: Português moderno, claro e digno, com construção amplamente compreensível no Brasil e em outros contextos lusófonos. A repetição de “coisas” foi mantida para conservar a correspondência e o contraste do original.
