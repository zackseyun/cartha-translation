    ܬܘܒ ܚܙܝܬ

    ܗܘܘ ܠܗܘܢ ܠܗܠܝܢ. ܐܘ

    ܡܢܝ ܡܩܒܠܝܢ ܠܗܘܢ ܗܘܘ

    ܒܟܠ ܙܒܢ. ܐܘ

    ܠܡܘܢ ܡܬܬܚܒܘ ܡܬܬܚܒܝܢ

    ܠܗܘܢ ܕܗܠܝܢ. ܘܐܝܟ

    ܝܠܕܐ ܡܬܝܠܕ ܗܘܝ

    ܐܬܕܝܠܚ. ܀ ܝ ܀ ܘܥܒܕܬ

    ܘܐܡܪ ܠܝ. ܐܦ ܗܠܝܢ

