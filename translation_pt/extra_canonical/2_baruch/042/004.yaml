base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/004.yaml
  text: Those who were formerly under subjection and afterward withdrew and mingled themselves with the seed of the mixed peoples—their former time is reckoned as nothing.
translation:
  language: pt
  text: Os que antes estavam sob sujeição e depois se afastaram e se misturaram com a descendência dos povos misturados — o tempo anterior deles é considerado como nada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܩܕܝܡ
  choice: antes
  rationale: Expressa de modo natural o valor temporal de “anteriormente, desde antes”.
- source_word: ܐܬܢܣܒܘ
  choice: estavam sob sujeição
  rationale: Segue o sentido contextual adotado pela tradição textual consultada, em vez de traduzir mecanicamente o possível valor passivo de “foram tomados”.
- source_word: descendência (cf. o conceito de “semente” na leitura preservada)
  choice: descendência
  rationale: Mantém o sentido genealógico em português atual sem a estranheza desnecessária de “semente” neste contexto.
- source_word: povos misturados
  choice: povos misturados
  rationale: Preserva a caracterização ambígua dos grupos como povos de composição mista, sem especificar etnia ou condição religiosa.
- source_word: ܐܬܚܫܒܘ
  choice: é considerado
  rationale: Conserva a ideia de avaliação ou imputação expressa pelo verbo siríaco.
theological_decisions:
- issue: Valor da sujeição anterior após a deserção e mistura com outros povos
  choice: “o tempo anterior deles é considerado como nada”
  alternative: “sua condição anterior não lhes é levada em conta”
  rationale: A formulação escolhida preserva a tensão e a referência temporal do texto, sem explicar se o período anterior envolvia fidelidade, pertença à aliança ou mérito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção mantém deliberadamente a ambiguidade de “povos misturados” e a força judicial de “é considerado como nada”.
