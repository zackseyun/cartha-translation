    ܕܢܒܥܐ ܒܥܡܘܛ ܚܒܠܐ.

    ܘܒܕܡܘܬ ܕܐܬܝܠܕܬ ܙܒܢܐ

    ܕܡܫܕܪܝܢ ܐܢܘܢ. ܗܢܘ

