base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/005.yaml
  text: But those who formerly did not know life, and afterward came to know it, and mingled with the seed of the people which has separated itself—their former time is also reckoned as nothing.”
translation:
  language: pt
  text: Mas aqueles que antes não conheciam a vida e depois vieram a conhecê-la, misturando-se à descendência do povo que se separou, também terão o seu tempo anterior considerado como nada.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ / conceito de vida no contexto
  choice: a vida
  rationale: Mantém a formulação ampla e teologicamente aberta do texto, sem restringi-la a mera existência física ou explicá-la como salvação.
- source_word: ܐܬܦܪܫܘ / raiz ܦܪܫ
  choice: se separou
  rationale: Preserva o sentido básico de separação ou distinção e evita acrescentar uma identificação denominacional ao povo.
- source_word: ܙܪܥܐ / conceito de semente ou posteridade
  choice: descendência
  rationale: Em português corrente, comunica naturalmente a ideia coletiva de linhagem humana expressa por “semente”.
- source_word: ܐܬܚܫܒܘ
  choice: terão por nada
  rationale: Reproduz a ideia de considerar, computar ou reputar o período anterior como sem valor, de modo idiomático.
theological_decisions:
- issue: Sentido de “conhecer a vida”
  choice: manter a expressão sem explicação
  alternative: traduzir como “conhecer a salvação” ou “receber a vida eterna”
  rationale: O texto não resolve explicitamente a natureza da vida; explicá-la importaria uma interpretação teológica.
- issue: Identidade do “povo que se separou”
  choice: preservar a designação genérica
  alternative: identificá-lo expressamente como Israel, os justos ou a comunidade eleita
  rationale: A tradução deve conservar a referência tal como formulada, sem tornar explícita uma identificação apenas inferida do contexto.
- issue: Valor do tempo anterior
  choice: “terão por nada”
  alternative: “não lhes será contado”
  rationale: A opção escolhida mantém a força avaliativa da frase sem definir se se trata de absolvição jurídica, apagamento histórico ou simples irrelevância.
translation_notes:
  register: Português moderno, digno e de leitura natural. A construção foi levemente reorganizada para clareza, conservando a tensão entre o passado de ignorância, o conhecimento posterior da vida e a incorporação à descendência do povo separado.
