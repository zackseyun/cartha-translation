  verdict: revise
  source_fidelity: 'A sequência essencial é preservada: ignorância anterior da vida, conhecimento posterior, associação à descendência do povo separado e a avaliação do período anterior como nada. Contudo, «terão por nada» torna os próprios indivíduos os agentes da avaliação, ao passo que o passivo do texto-fonte, confirmado pela formulação inglesa «is reckoned», apresenta o tempo anterior como algo que lhes é considerado como nada. «que viveram» também não está explicitado no original.'
  naturalness: O português é claro e de registro adequado. A formulação passiva proposta é igualmente natural e torna mais nítida a relação sintática sem acrescentar conteúdo.
  terminology: «vida», «descendência» e «povo que se separou» são escolhas adequadas e conservam a abertura teológica e referencial do original. Não é necessária nota.
  issues:
  - severity: medium
    issue: Mudança de voz e de agente em «também terão por nada»
    rationale: O original emprega uma forma passiva para o cômputo/consideração do período anterior. Em português, «terão por nada» sugere que essas pessoas é que desprezarão ou avaliarão seu passado; «lhes será considerado como nada» conserva a construção e a ambiguidade de agente.
  - severity: low
    issue: Acréscimo em «o tempo que viveram anteriormente»
    rationale: O texto se refere ao tempo anterior, sem explicitar «que viveram». O acréscimo é inferível, mas dispensável e menos conciso.
  revised_text: Mas aqueles que antes não conheciam a vida e depois vieram a conhecê-la, misturando-se à descendência do povo que se separou, também terão o seu tempo anterior considerado como nada.”
