  text: 'And as for what you said concerning those who drew near and those who withdrew, this is the word:'
translation:
  language: pt
  text: 'Quanto ao que você disse a respeito dos que se aproximaram e dos que se afastaram, esta é a palavra:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܢܣܒܘ
  choice: se aproximaram
  rationale: Segue o sentido contextual adotado pela camada inglesa auditada para o primeiro grupo, em contraste com os que se afastaram; a forma siríaca transmitida é textualmente difícil neste trecho.
- source_word: ܐܬܦܪܫܘ
  choice: se afastaram
  rationale: Expressa com naturalidade o sentido de separar-se ou retirar-se, preservando o contraste entre os dois grupos.
- source_word: ܡܠܠ
  choice: palavra
  rationale: Mantém a formulação solene e aberta do texto, sem interpretar antecipadamente a declaração como mera resposta ou explicação.
theological_decisions:
- issue: Identidade e avaliação dos dois grupos
  choice: Manter apenas o contraste entre os que se aproximaram e os que se afastaram
  alternative: Identificar explicitamente um grupo como fiel ou justo e o outro como apóstata
  rationale: O versículo não fornece aqui uma avaliação teológica explícita; acrescentá-la eliminaria a abertura do enunciado.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. “Esta é a palavra” conserva o tom formulaico do original e prepara a declaração seguinte.
