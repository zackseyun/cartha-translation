  yaml_path: translation/extra_canonical/2_baruch/018/001.yaml
  text: And I answered and said, “He who took from the light is able to know it. But the many who exist took from Adam’s darkness, and did not rejoice in the light of Moses.”
translation:
  language: pt
  text: 'E respondi: “Quem recebeu da luz é capaz de conhecê-la. Mas muitos receberam das trevas de Adão e não se alegraram na luz de Moisés.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܒ / ܢܣܒܘ
  choice: recebeu / receberam
  rationale: Mantém amplo e concreto o verbo siríaco, preservando a imagem de receber algo da luz ou das trevas sem impor uma paráfrase explicativa.
- source_word: ܢܘܗܪܐ
  choice: luz
  rationale: Conserva de modo direto a imagem apocalíptica e revelatória.
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  choice: trevas de Adão
  rationale: Preserva a referência pessoal a Adão e evita reduzi-la a uma escuridão humana genérica.
- source_word: ܐܬܒܣܡܘ (leitura corrigida do OCR ܐܬܒܣܣܘ)
  choice: se alegraram
  rationale: Segue a leitura siríaca corrigida e tradicional, em vez do erro de OCR que poderia sugerir ‘foram estabelecidos’.
- source_word: ܢܘܗܪܐ ܕܡܘܫܐ
  choice: luz de Moisés
  rationale: Mantém a menção explícita a Moisés sem substituí-la por ‘lei’ nem explicitar além do texto o modo de mediação.
theological_decisions:
- issue: Contraste entre as trevas de Adão e a luz de Moisés
  choice: Preservar as figuras nomeadas e o contraste histórico-representativo entre elas.
  alternative: Interpretar genericamente como ignorância em contraste com instrução.
  rationale: O texto formula o contraste por meio de Adão e Moisés; a tradução não deve apagar nem ampliar essa tensão.
- issue: Papel de Moisés em relação à luz
  choice: Apresentá-lo associado à luz recebida, sem qualificá-lo como fonte independente.
  alternative: Explicitar ‘a luz mediada por Moisés’ ou enfatizar apenas seu conhecimento exemplar.
  rationale: A formulação literal conserva a ambiguidade quanto à natureza exata dessa associação.
- issue: Pessoa gramatical na primeira afirmação
  choice: 'Terceira pessoa genérica: ‘Quem recebeu da luz’.'
  alternative: 'Segunda pessoa: ‘Tu és aquele que recebeu da luz’.'
  rationale: A leitura controlada corrige formas corrompidas pelo OCR e, no contexto, aponta para uma declaração geral sobre seres humanos, não para uma interpelação a Deus.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e alcance internacional. ‘E respondi’ evita a redundância pouco natural de ‘respondi e disse’, sem perda funcional. ‘Trevas’ foi preferido a ‘escuridão’ para sustentar o contraste retórico com ‘luz’.
