base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/008.yaml
  text: '(1) The child Jesus laughed and said, “Now may the barren bear fruit, the blind see, and the foolish in heart understand that I am here from above, so that I may deliver those below and call them up, just as the one who sent me to you commanded me.”


    (2) Immediately, all who had fallen under his curse were saved. From then on, no one dared to provoke him.'
translation:
  language: pt
  text: '(1) O menino Jesus riu e disse: “Agora, que os estéreis deem fruto, que os cegos vejam e que os insensatos de coração alcancem entendimento: que estou aqui, vindo do alto, para que eu possa libertar os que estão embaixo e chamá-los para o alto, assim como aquele que me enviou a vocês me ordenou.”


    (2) Imediatamente, todos os que haviam caído sob a sua maldição foram salvos. E, daquele momento em diante, ninguém ousou provocá-lo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the barren
  choice: os estéreis
  rationale: Mantém a formulação coletiva e metafórica do testemunho, sem restringi-la indevidamente apenas a mulheres.
- source_word: foolish in heart
  choice: insensatos de coração
  rationale: Preserva o sentido antropológico antigo de “coração” como centro da compreensão, em linguagem portuguesa clara.
- source_word: find understanding
  choice: alcancem entendimento
  rationale: Expressa a aquisição de discernimento sem transformar a frase em mera compreensão de uma proposição específica.
- source_word: from above
  choice: do alto
  rationale: Conserva a oposição espacial e teológica com “os que estão embaixo” e “para o alto”.
- source_word: deliver
  choice: libertar
  rationale: É natural em português e mantém aberto se a libertação é física, espiritual ou ambas.
- source_word: call them up
  choice: chamá-los para o alto
  rationale: Preserva o movimento ascendente explícito, evitando reduzir o verbo a um simples chamado.
- source_word: under his curse
  choice: sob a sua maldição
  rationale: Reproduz diretamente a relação indicada no testemunho e mantém a tensão narrativa.
- source_word: provoke
  choice: provocá-lo
  rationale: Mantém a amplitude do termo, que pode envolver irritar, desafiar ou incitar.
theological_decisions:
- issue: Origem celeste de Jesus
  choice: “eu vim do alto”
  alternative: “eu estou aqui vindo do alto”
  rationale: A opção é idiomática em português e preserva a afirmação de procedência sem acrescentar uma formulação cristológica posterior.
- issue: Relação entre libertação e elevação
  choice: “libertar os que estão embaixo e chamá-los para o alto”
  alternative: “salvar os de baixo e convocá-los para cima”
  rationale: Mantém distintos os dois verbos e a oposição vertical do texto, sem identificar automaticamente a libertação com uma doutrina específica de salvação.
- issue: Efeito da maldição
  choice: “foram salvos”
  alternative: “foram restaurados”
  rationale: Segue o testemunho fornecido e conserva a possível amplitude teológica do verbo, embora o contexto também possa sugerir reversão dos males sofridos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A redação é provisória porque a revisão direta do grego ainda está pendente; por isso, preserva cuidadosamente as ambiguidades presentes no testemunho inglês público.
