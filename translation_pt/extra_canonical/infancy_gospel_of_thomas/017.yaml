translation:
  language: pt
  text: '(1) Depois dessas coisas, certo bebê da vizinhança de José adoeceu e morreu. Sua mãe chorava muito.


    Jesus, porém, ouviu que havia grande tristeza e agitação e correu depressa para lá. Encontrou a criança morta, tocou-lhe o peito e disse:


    — Eu digo a você, bebê: não morra, mas viva e fique com sua mãe.


    Imediatamente, o bebê abriu os olhos e riu. Então Jesus disse à mãe:


    — Pegue seu filho, dê-lhe leite e lembre-se de mim.


    (2) A multidão que estava ali ficou admirada e disse:


    — A verdade é que esta criança é um deus ou um anjo, pois cada palavra sua se torna um ato!


    Depois, Jesus foi embora e voltou a brincar com as crianças.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: baby
  choice: bebê
  rationale: Mantém a referência explícita a uma criança de colo e corresponde ao registro corrente do português, sem substituí-la pelo termo mais amplo “criança” nas falas em que a idade é relevante.
- source_word: great grief and commotion
  choice: grande tristeza e agitação
  rationale: 'Preserva os dois aspectos da cena: o sofrimento intenso e a movimentação ou tumulto ao redor da morte.'
- source_word: touched his chest
  choice: tocou-lhe o peito
  rationale: Formulação natural e digna em português, mantendo o gesto físico específico do testemunho fornecido.
- source_word: looked up
  choice: abriu os olhos
  rationale: No contexto de um bebê morto que volta à vida, exprime de modo idiomático o despertar indicado pelo testemunho inglês; permanece provisório até a revisão direta do grego.
- source_word: every word becomes a deed
  choice: cada palavra sua se torna um ato
  rationale: Conserva o contraste entre palavra e ação sem parafrasear como simples eficácia ou cumprimento.
- source_word: played with the children
  choice: voltou a brincar com as crianças
  rationale: “Voltou” comunica naturalmente o valor iterativo de “again” e preserva o contraste narrativo entre o milagre e a vida infantil de Jesus.
theological_decisions:
- issue: A aclamação da multidão identifica Jesus como “a god or an angel”.
  choice: “esta criança é um deus ou um anjo”
  alternative: “esta criança é Deus ou um anjo”
  rationale: Mantém a construção indefinida e a alternativa interna da fala da multidão, sem convertê-la em uma confissão cristológica posterior nem corrigir sua tensão teológica.
- issue: A ordem para que o bebê viva.
  choice: “não morra, mas viva”
  alternative: “deixe de estar morto e viva”
  rationale: Preserva a forma direta e paradoxal da fala testemunhada, sem explicá-la ou harmonizá-la.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom narrativo simples e digno. A tradução é provisória porque o material fornecido declara que a revisão direta da tradição manuscrita grega ainda está pendente; por isso, não se afirmam reconstruções lexicais gregas não verificadas.
