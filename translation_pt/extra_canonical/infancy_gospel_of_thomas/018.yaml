base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/018.yaml
  text: '(1) After some time, a building was being constructed. There was a great commotion, and Jesus got up and went there.


    When Jesus saw a man lying dead, he took the man’s hand and said, “I tell you, man, rise and do your work.” The man immediately rose and worshiped him.


    (2) The crowd saw this and was amazed. They said, “This child is from heaven, for he has saved many souls from death, and he will continue to save throughout all the days of his life.”'
translation:
  language: pt
  text: '(1) Algum tempo depois, um edifício estava sendo construído. Houve uma grande agitação, e Jesus se levantou e foi até lá.


    Ao ver um homem caído, morto, Jesus segurou a mão dele e disse: “Eu lhe digo, homem: levante-se e faça o seu trabalho.” Imediatamente, o homem se levantou e o adorou.[a]


    (2) Ao ver isso, a multidão ficou admirada e disse: “Este menino vem do céu, pois salvou muitas almas da morte[b] e continuará salvando durante todos os dias de sua vida.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a nuance do verbo grego a ser confirmada: “se prostrou diante dele” ou “lhe prestou homenagem”. Esta versão segue provisoriamente o testemunho inglês: “worshipped”.'
    reason: A revisão direta da tradição manuscrita grega ainda está pendente, e o gesto pode admitir diferentes graus de sentido religioso.
  - marker: b
    text: A expressão “almas da morte” foi preservada conforme o testemunho disponível; no contexto imediato, pode referir-se a pessoas ou vidas livradas da morte.
    reason: Preserva a formulação e sua possível amplitude antropológica sem impor uma interpretação exclusivamente física ou espiritual.
lexical_decisions:
- source_word: building
  choice: edifício
  rationale: No contexto, designa a estrutura em construção; “edifício” é natural e evita confundir a obra física com o processo de construção.
- source_word: great commotion
  choice: grande agitação
  rationale: Preserva a intensidade e a abertura semântica da comoção no local, sem especificar uma causa não declarada.
- source_word: seized/took his hand
  choice: segurou a mão dele
  rationale: Expressa com naturalidade o gesto firme indicado pelo testemunho, sem a possível conotação agressiva de “agarrou”.
- source_word: worshipped
  choice: adorou
  rationale: Mantém a força religiosa do verbo do testemunho, em vez de atenuá-lo para mera homenagem; a ambiguidade do gesto é registrada em nota.
- source_word: souls
  choice: almas
  rationale: Conserva a formulação antropológica e teológica do testemunho, sem substituí-la silenciosamente por “pessoas” ou “vidas”.
theological_decisions:
- issue: A ação do homem ressuscitado diante de Jesus
  choice: “o adorou”
  alternative: “se prostrou diante dele” ou “lhe prestou homenagem”
  rationale: O testemunho inglês fornecido usa “worshipped”. A tradução retém sua leitura teologicamente forte, enquanto a nota reconhece que uma futura revisão direta do grego poderá esclarecer a nuance.
- issue: “Salvar muitas almas da morte”
  choice: preservar literalmente a expressão
  alternative: “salvar muitas pessoas da morte” ou “salvar muitas vidas”
  rationale: A redação pode aludir tanto à preservação física quanto a uma afirmação mais ampla. Traduzir “almas” por “pessoas” resolveria antecipadamente essa tensão.
- issue: Origem celestial do menino
  choice: “Este menino vem do céu”
  alternative: “Este menino é do céu”
  rationale: “Vem do céu” comunica em português corrente a alegação de origem celestial sem acrescentar uma formulação ontológica mais técnica do que a testemunhada.
translation_notes:
  register: Português moderno, digno e acessível, com ampla legibilidade brasileira. A sintaxe narrativa foi levemente regularizada para fluidez, mas as afirmações teologicamente tensas foram mantidas. Rascunho provisório baseado no testemunho inglês de domínio público da tradição manuscrita grega; requer conferência direta com o texto grego.
