translation:
  language: pt
  text: '(1) Dali, ele ia com seu pai, José, quando alguém que vinha correndo bateu em seu ombro. Então Jesus lhe disse: “Maldito seja você por causa do seu líder!”[a]


    E ele morreu imediatamente.


    As pessoas que viram que ele havia morrido clamaram de imediato: “De onde nasceu esta criança, para que sua palavra se torne realidade?”


    (2) Quando os pais da criança morta viram o que havia acontecido, culparam José, o pai de Jesus, dizendo: “Seja de onde for que você tenha trazido esta criança, você não pode morar conosco nesta aldeia. Se quiser ficar aqui, ensine-a a abençoar, e não a amaldiçoar, pois nosso filho nos foi tirado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “por causa do seu líder” é incomum e seu sentido é incerto no testemunho disponível. Foi mantida sem harmonização; é necessária uma revisão direta da tradição manuscrita grega.
    reason: Sinalizar uma dificuldade textual ou tradutória genuína, já reconhecida no material de consulta, sem apresentar uma interpretação conjectural como certa.
lexical_decisions:
- source_word: struck his shoulder
  choice: bateu em seu ombro
  rationale: Mantém o sentido físico do testemunho disponível sem intensificar o choque como agressão deliberada.
- source_word: his word becomes deed
  choice: sua palavra se torne realidade
  rationale: Expressa em português natural a ideia de que o pronunciamento produz imediatamente o acontecimento.
- source_word: bless and not to curse
  choice: abençoar, e não a amaldiçoar
  rationale: Preserva o contraste explícito e o vocabulário religioso do testemunho.
- source_word: has been taken away from us
  choice: nos foi tirado
  rationale: Conserva a formulação passiva e a tensão sobre a agência da morte.
theological_decisions:
- issue: A causa ou sentido da maldição na expressão incomum “because of your leader”
  choice: “por causa do seu líder” com nota de incerteza
  alternative: Interpretar ou harmonizar a frase como referência à imprudência, ao caminho ou à autoridade da criança
  rationale: O testemunho fornecido contém uma expressão obscura, e a revisão direta do grego ainda está pendente; por isso, a tradução não resolve silenciosamente a dificuldade.
- issue: A eficácia da palavra de Jesus
  choice: “sua palavra se torne realidade”
  alternative: “sua palavra se transforme em ato”
  rationale: Mantém a ligação entre fala e acontecimento sem acrescentar uma explicação doutrinária sobre o poder de Jesus.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção foi tornada natural sem suavizar a morte súbita nem a acusação dos pais. Como a fonte fornecida é um testemunho inglês de domínio público e a revisão do grego está pendente, a redação permanece provisória sobretudo na frase marcada com [a].
