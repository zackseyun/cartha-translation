base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/019.yaml
  text: '(1) When Jesus was twelve years old, his parents went to Jerusalem for the Passover festival, according to custom. But as they were returning, Jesus stayed behind in Jerusalem, and his parents did not know it.


    (2) Assuming that he was with the traveling company, they went a day’s journey and looked for him among their relatives whom they knew. When they did not find him, they returned to Jerusalem and searched for him.


    After three days, they found him in the temple, sitting among the teachers, listening to them and questioning them. Those who heard him were amazed at how he questioned the elders and explained the main points of the law, the riddles, and the parables of the prophets.


    (3) His mother said to him, “Child, what have you done to us? Look, we have been searching for you in pain and grief.”


    Jesus said, “Why were you looking for me? Didn’t you know that I must be in the place of my Father?”


    (4) The scribes and the Pharisees said to Mary, “Are you the mother of this child?”


    She said, “I am.”


    They said to her, “Blessed are you, because the Lord God has blessed the fruit of your womb. We have never seen such wisdom of praise and glory of virtue.”


    (5) Jesus got up and followed his mother from there, and he was obedient to his parents. She treasured all these things, pondering them in her heart.


    Jesus advanced in wisdom, maturity, and grace before God and humans. To whom be the [glory …].'
translation:
  language: pt
  text: '(1) Quando Jesus tinha doze anos, seus pais foram a Jerusalém para a festa da Páscoa, conforme o costume. Mas, quando eles voltavam, Jesus ficou em Jerusalém, sem que seus pais soubessem.


    (2) Pensando que ele estivesse na caravana, caminharam durante um dia e o procuraram entre os parentes e conhecidos. Como não o encontraram, voltaram a Jerusalém à procura dele.


    Depois de três dias, encontraram-no no templo, sentado entre os mestres, ouvindo-os e fazendo-lhes perguntas. Os que o ouviam ficavam admirados com a maneira como ele interrogava os anciãos e explicava os pontos principais da Lei, os enigmas e as parábolas dos profetas.


    (3) Sua mãe lhe disse: “Filho, por que você fez isso conosco? Olhe, nós estávamos procurando você com dor e aflição”.


    Jesus respondeu: “Por que vocês estavam me procurando? Não sabiam que é necessário que eu esteja no lugar de meu Pai?”[a]


    (4) Os escribas e os fariseus perguntaram a Maria: “Você é a mãe deste menino?”


    Ela respondeu: “Sou”.


    Então lhe disseram: “Bendita é você, pois o Senhor Deus abençoou o fruto do seu ventre. Nunca vimos tamanha sabedoria de louvor e glória de virtude”.[b]


    (5) Jesus se levantou, saiu dali acompanhando sua mãe e era obediente a seus pais. Ela guardava todas essas coisas, refletindo sobre elas em seu coração.


    E Jesus avançava em sabedoria, maturidade e graça diante de Deus e dos seres humanos. A ele seja a [glória…].[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “na casa de meu Pai” ou “ocupado com as coisas de meu Pai”; a redação preserva o sentido espacial da testemunha fornecida.
    reason: Preservar uma ambiguidade antiga com possível relevância teológica.
  - marker: b
    text: A construção “sabedoria de louvor e glória de virtude” é incomum e foi mantida de modo próximo à testemunha disponível; a revisão direta do grego ainda está pendente.
    reason: Sinalizar uma formulação textualmente difícil sem corrigi-la por conjectura.
  - marker: c
    text: Os colchetes e as reticências indicam que o encerramento da doxologia está incompleto ou foi restaurado de forma incerta na testemunha utilizada.
    reason: Preservar o sinal de lacuna ou restauração textual presente na fonte fornecida.
lexical_decisions:
- source_word: traveling company
  choice: caravana
  rationale: Forma natural e historicamente apropriada para um grupo que viajava em conjunto, sem sugerir uma organização moderna.
- source_word: teachers
  choice: mestres
  rationale: Mantém o sentido de instrutores religiosos no templo e distingue o termo dos escribas mencionados depois.
- source_word: law
  choice: Lei
  rationale: A inicial maiúscula indica a Lei de Israel, e não uma lei genérica.
- source_word: maturity
  choice: maturidade
  rationale: Preserva a formulação da testemunha fornecida e evita restringir o crescimento apenas à estatura física.
- source_word: humans
  choice: seres humanos
  rationale: Expressão inclusiva e corrente que comunica o referente coletivo sem usar 'homens' em sentido genérico.
- source_word: treasured
  choice: guardava
  rationale: Expressa a conservação cuidadosa dessas coisas na memória e no íntimo, com a reflexão explicitada na oração seguinte.
theological_decisions:
- issue: A expressão sobre estar no lugar do Pai
  choice: “é necessário que eu esteja no lugar de meu Pai”
  alternative: “devo estar na casa de meu Pai” ou “devo ocupar-me das coisas de meu Pai”
  rationale: A testemunha fornecida traz 'in the place of my Father'. A tradução mantém essa referência espacial sem resolver a conhecida ambiguidade da expressão paralela.
- issue: Referente da doxologia final
  choice: “A ele seja a [glória…]”
  alternative: “Ao qual seja a [glória…]”
  rationale: O pronome português explicita gramaticalmente um referente masculino, mas não acrescenta um título ausente; a marca de texto incompleto é preservada.
- issue: Sabedoria, maturidade e graça
  choice: três aspectos coordenados
  alternative: tratar maturidade como mera estatura
  rationale: A redação fornecida apresenta os três substantivos em paralelo; a tradução não reduz o alcance do segundo por harmonização com outra tradição textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você/vocês” no diálogo e evita arcaísmos. Trata-se de uma versão provisória baseada na testemunha inglesa de domínio público fornecida; a revisão direta da tradição manuscrita grega permanece pendente.
