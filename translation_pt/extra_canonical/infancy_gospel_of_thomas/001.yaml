  text: 'I, Thomas the Israelite, considered it necessary to make known to all the Gentile brothers and sisters everything done by our Lord Jesus Christ in the village of Nazareth after he was born in our region of Bethlehem. This is the beginning:'
translation:
  language: pt
  text: 'Eu, Tomé, o israelita, considerei necessário dar a conhecer a todos os irmãos e irmãs dentre os gentios tudo o que nosso Senhor Jesus Cristo fez na aldeia de Nazaré, depois de ter nascido em nossa região de Belém. Este é o começo:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Thomas the Israelite
  choice: Tomé, o israelita
  rationale: Emprega a forma portuguesa tradicional do nome e conserva a identificação étnica do testemunho.
- source_word: Gentile brothers (and sisters)
  choice: irmãos e irmãs dentre os gentios
  rationale: Explicita a inclusão indicada pelo testemunho e mantém 'gentios', termo histórico-religioso amplamente reconhecível.
- source_word: make known
  choice: dar a conhecer
  rationale: Reproduz com dignidade e naturalidade a ideia de tornar algo conhecido publicamente.
- source_word: all the things done
  choice: tudo o que ... fez
  rationale: A formulação verbal é mais natural em português e preserva a abrangência da expressão.
- source_word: village of Nazareth
  choice: aldeia de Nazaré
  rationale: Mantém a caracterização do assentamento presente no testemunho, sem modernizá-lo para 'cidade'.
- source_word: our region of Bethlehem
  choice: nossa região de Belém
  rationale: Conserva a referência geográfica algo incomum e sua ambiguidade, sem tentar harmonizá-la.
- source_word: This is the beginning
  choice: Este é o começo
  rationale: Tradução direta e idiomática da fórmula que introduz a narrativa.
theological_decisions:
- issue: Referência ao nascimento em Belém e aos feitos em Nazaré
  choice: Preservar a sequência e a formulação do testemunho
  alternative: Reformular para harmonizar explicitamente a geografia com os evangelhos canônicos
  rationale: A tradução não deve resolver nem suavizar uma possível tensão geográfica do texto recebido.
- issue: Título cristológico 'our Lord Jesus Christ'
  choice: nosso Senhor Jesus Cristo
  alternative: o Senhor Jesus Cristo
  rationale: Mantém tanto o título cristológico quanto o pronome comunitário do testemunho.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário religioso de circulação internacional. Rascunho necessariamente provisório, pois a base fornecida é um testemunho inglês de domínio público e a revisão direta da tradição manuscrita grega ainda está pendente.
