translation:
  language: pt
  text: '(1) Mais uma vez, muitos dias depois, Jesus estava brincando com outras crianças no terraço de um aposento no andar de cima. Uma das crianças caiu e morreu. Quando as outras crianças viram isso, entraram em suas casas e deixaram Jesus sozinho.


    (2) Os pais da criança que havia morrido vieram e acusaram Jesus, dizendo:


    — Você empurrou nosso filho lá de cima!


    Mas Jesus respondeu:


    — Eu não o empurrei.


    (3) Eles estavam furiosos e gritavam. Jesus desceu do terraço, pôs-se ao lado do corpo e exclamou em alta voz:


    — Zenão, Zenão — pois esse era o nome dele —, levante-se e diga se eu empurrei você lá de cima.


    Ele se levantou e disse:


    — Não, senhor.


    Quando viram isso, ficaram maravilhados.


    Então Jesus lhe disse outra vez:


    — Adormeça!


    E os pais da criança louvaram a Deus e adoraram o menino Jesus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: roof of an upstairs room
  choice: terraço de um aposento no andar de cima
  rationale: Expressa de modo natural a superfície superior sobre a qual as crianças brincavam, sem transformar o local em um telhado inclinado.
- source_word: Zeno
  choice: Zenão
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome grego Zēnōn.
- source_word: Rise
  choice: levante-se
  rationale: Mantém a ordem direta e permite que o contexto indique a restauração da vida, sem acrescentar uma formulação teológica ausente do testemunho fornecido.
- source_word: Fall asleep
  choice: Adormeça
  rationale: Conserva literalmente o eufemismo do relato e sua tensão entre sono e morte, em vez de explicá-lo como 'morra novamente'.
- source_word: worshipped
  choice: adoraram
  rationale: Preserva a força religiosa explícita do testemunho inglês fornecido, distinguindo o ato do louvor dirigido a Deus na oração anterior.
theological_decisions:
- issue: A ordem final dirigida à criança ressuscitada
  choice: Adormeça!
  alternative: Morra novamente!
  rationale: O texto testemunhal emprega a linguagem de dormir; a tradução mantém essa imagem e não resolve silenciosamente a relação entre sono e morte.
- issue: A reação dos pais diante do menino Jesus
  choice: adoraram o menino Jesus
  alternative: prostraram-se diante do menino Jesus
  rationale: O testemunho disponível traduz o verbo como 'worshipped'. 'Adoraram' conserva essa leitura teologicamente forte; a alternativa poderia reduzir o sentido a um gesto de homenagem. A confirmação pelo grego ainda é necessária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. O diálogo foi pontuado com travessões para fluidez narrativa. Esta redação é provisória, pois se baseia no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega continua pendente.
