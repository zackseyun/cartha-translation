base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/013.yaml
  text: '(1) Now Jesus was about eight years old. His father was a carpenter who made plows and yokes. He took a bed from a certain rich man so that he could make it very large and suitable. But one of the beams, called the (…), was shorter; it was not the (right) length. Joseph was distressed and did not know what to do.


    The child came to his father and said, “Set down the two boards and line them up at your end.”


    (2) Joseph did just as Jesus told him. The child Jesus stood at the other end, took hold of the short board, and stretched it. He made it equal in length to the other board.


    Then he said to his father, “Do not be distressed, but make whatever you want to.”


    Joseph embraced and kissed him, saying, “Blessed am I that God gave this child to me.”'
translation:
  language: pt
  text: '**Evangelho da Infância de Tomé — Capítulo 13: O milagre da cama**


    (1) Jesus tinha então cerca de oito anos. Seu pai era carpinteiro e fazia arados e jugos. Ele recebeu de certo homem rico uma cama, para torná-la bem grande e adequada. Mas uma das vigas, chamada de (…)[a], era mais curta e não tinha o comprimento certo. José ficou aflito e não sabia o que fazer.


    O menino aproximou-se de seu pai e disse:


    — Ponha as duas tábuas no chão e alinhe-as pela ponta que está do seu lado.


    (2) José fez exatamente como ele lhe disse. O menino Jesus ficou na outra ponta, segurou a tábua mais curta e a esticou, tornando-a do mesmo comprimento que a outra.


    Então disse a seu pai:


    — Não fique aflito; faça agora o que quiser.


    José o abraçou e beijou, dizendo:


    — Feliz sou eu, porque Deus me deu este menino.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome desta parte da cama não está preservado ou permanece sem solução no testemunho disponível; as reticências reproduzem essa lacuna ou incerteza textual.
    reason: Sinalizar ao leitor que a ausência do termo pertence à evidência textual e não é uma omissão acidental da tradução.
lexical_decisions:
- source_word: bed
  choice: cama
  rationale: Termo corrente e concreto em português; mantém o objeto descrito pelo testemunho sem especificar uma forma antiga não confirmada.
- source_word: ploughs and yokes
  choice: arados e jugos
  rationale: Equivalentes tradicionais e inteligíveis dos utensílios agrícolas produzidos por José.
- source_word: took a bed from a certain rich man
  choice: recebeu de certo homem rico uma cama
  rationale: Em português, “recebeu” comunica com naturalidade que José tomou o móvel para trabalhar nele, sem sugerir apropriação indevida; a finalidade subsequente permanece explícita.
- source_word: beams / boards
  choice: vigas / tábuas
  rationale: 'Preserva a variação do testemunho fornecido: primeiro se identifica estruturalmente a peça, depois ela é chamada de tábua na ação narrada.'
- source_word: stretched it
  choice: a esticou
  rationale: Mantém de modo direto o caráter miraculoso da ação, sem racionalizá-la como simples ajuste ou deslocamento.
- source_word: Blessed am I
  choice: Feliz sou eu
  rationale: Expressa uma declaração pessoal de condição favorecida e conserva o tom solene sem impor uma fórmula litúrgica específica.
theological_decisions:
- issue: Natureza da ação de Jesus sobre a peça curta
  choice: “a esticou, tornando-a do mesmo comprimento”
  alternative: “alongou-a” ou uma explicação naturalizante do reparo
  rationale: O relato apresenta uma transformação extraordinária e imediata; a tradução conserva essa afirmação sem explicar seu mecanismo nem acrescentar interpretação teológica.
- issue: Declaração de José sobre Deus ter-lhe dado o menino
  choice: “Deus me deu este menino”
  alternative: “Deus me confiou este menino”
  rationale: “Deu” reproduz a formulação direta do testemunho e evita resolver se a frase se refere a dádiva, tutela ou relação familiar em algum sentido teológico mais específico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com pontuação de diálogo natural para leitores brasileiros. A redação é provisória porque o material fornecido se baseia em um testemunho inglês de domínio público e a revisão direta do grego ainda está pendente. Não se reconstruíram palavras ausentes nem se eliminaram tensões do relato.
