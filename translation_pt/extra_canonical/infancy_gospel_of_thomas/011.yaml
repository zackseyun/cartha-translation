base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/011.yaml
  text: '(1) The child Jesus was about seven years old, and his mother Mary sent him to fetch water. But there was a large crowd at the cistern, and the pitcher was struck and broke.


    (2) Jesus spread out the cloak he was wearing, filled it with water, and carried it to his mother. Mary saw the sign Jesus had performed. She kissed him and said, “Lord, my God, bless our child,” because they were afraid that someone might bewitch him.'
translation:
  language: pt
  text: '**Evangelho da Infância de Tomé — Capítulo 11: Jesus leva água em seu manto**


    (1) O menino Jesus tinha cerca de sete anos, e sua mãe, Maria, o mandou buscar água. Havia, porém, uma grande multidão junto à cisterna, e o cântaro levou uma pancada e se quebrou.


    (2) Então Jesus estendeu o manto que vestia, encheu-o de água e o levou à sua mãe. Maria viu o sinal que Jesus havia realizado. Ela o beijou e disse: “Senhor, meu Deus, abençoa nosso filho”, pois temiam que alguém o enfeitiçasse.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; ainda falta a revisão direta da tradição manuscrita grega.
    reason: A fonte disponibilizada declara que a revisão na língua original está pendente; a nota torna transparente a base textual limitada do rascunho.
lexical_decisions:
- source_word: child
  choice: menino
  rationale: Em português corrente, “menino Jesus” expressa naturalmente a idade infantil indicada pelo contexto, sem a rigidez de “criança Jesus”.
- source_word: fill up water / fetch water
  choice: buscar água
  rationale: Expressa de modo idiomático a tarefa de ir até a cisterna e trazer água, conforme o sentido contextual.
- source_word: water cistern
  choice: cisterna
  rationale: Mantém o recipiente ou reservatório comunitário indicado pelo testemunho, sem substituí-lo por “poço”.
- source_word: pitcher
  choice: cântaro
  rationale: Designa com dignidade e clareza um recipiente antigo usado para buscar água; evita o sentido moderno mais restrito de “jarra”.
- source_word: cloak
  choice: manto
  rationale: Termo natural e tradicional para uma peça exterior de roupa que poderia ser aberta e usada para carregar algo.
- source_word: sign
  choice: sinal
  rationale: Preserva a linguagem de “sinal” do testemunho, sem explicitar ou ampliar para “milagre”.
- source_word: bewitch
  choice: enfeitiçasse
  rationale: Reproduz diretamente o temor de ação mágica presente no testemunho, sem racionalizá-lo nem suavizá-lo.
theological_decisions:
- issue: A quem Maria se dirige em “Senhor, meu Deus, abençoa nosso filho”
  choice: Manter a pontuação como invocação dirigida ao Senhor Deus, seguida do pedido em favor de “nosso filho”.
  alternative: Pontuar ou reformular de modo que Maria chame Jesus diretamente de “Senhor” e “meu Deus”.
  rationale: A sintaxe do testemunho fornecido favorece uma oração a Deus em favor da criança, mas a tradução evita paráfrases interpretativas adicionais.
- issue: Referente plural de “temiam”
  choice: Preservar o plural sem identificar explicitamente quem, além de Maria, sentia medo.
  alternative: Substituir por “Maria temia” ou nomear Maria e José.
  rationale: O testemunho muda de Maria no singular para “eles” no plural sem esclarecer o referente; a tradução conserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A narrativa mantém cadência simples e antiga sem arcaísmos excessivos. “Cântaro”, “cisterna” e “manto” preservam o cenário histórico, enquanto “buscar água” e “levou uma pancada” mantêm naturalidade. O rascunho é necessariamente provisório porque não foi fornecido texto grego para conferência direta.
