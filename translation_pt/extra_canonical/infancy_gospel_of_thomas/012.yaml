base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/012.yaml
  text: '(1) At sowing time, Joseph sowed seed, and the child Jesus sowed one measure of wheat.


    (2) His father harvested a hundred large measures. He gave generously to the poor and the orphans. But Joseph took from Jesus’ seed.'
translation:
  language: pt
  text: '(1) No tempo da semeadura, José semeou, e o menino Jesus semeou uma medida de trigo.


    (2) Seu pai colheu cem grandes medidas. E as deu generosamente aos pobres e aos órfãos. Mas José tomou parte das sementes de Jesus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase final é obscura no testemunho utilizado e também pode ser entendida como: “Mas José recebeu da semente de Jesus”. A redação deverá ser revista diretamente à luz dos manuscritos gregos.'
    reason: Assinala uma ambiguidade textual relevante e o caráter provisório da tradução baseada no testemunho inglês.
lexical_decisions:
- source_word: at the time of the sowing
  choice: No tempo da semeadura
  rationale: Expressão natural e digna em português, preservando a referência temporal agrícola do testemunho.
- source_word: one measure of wheat
  choice: uma medida de trigo
  rationale: Mantém a unidade antiga indefinida, sem impor uma equivalência moderna não atestada.
- source_word: a hundred great measures
  choice: cem grandes medidas
  rationale: Preserva tanto o número quanto a qualificação incomum das medidas, sem normalizar o relato.
- source_word: gave graciously
  choice: deu generosamente
  rationale: Transmite a ideia de doação benevolente em linguagem corrente.
- source_word: the poor and the orphans
  choice: os pobres e os órfãos
  rationale: Correspondência direta, clara e inclusiva das duas categorias mencionadas.
- source_word: took from Jesus’ seeds
  choice: tomou parte das sementes de Jesus
  rationale: Reproduz de modo inteligível a formulação difícil do testemunho, evitando afirmar com certeza uma relação agrícola que o texto provisório não esclarece.
theological_decisions:
- issue: Identidade de “seu pai” no versículo 2
  choice: Seu pai
  alternative: José
  rationale: Mantém a forma do testemunho e a tensão narrativa entre a paternidade atribuída a José e a posterior nomeação dele.
- issue: Relação entre a colheita de José e a semente de Jesus
  choice: Mas José tomou parte das sementes de Jesus
  alternative: Mas José recebeu a colheita proveniente das sementes de Jesus
  rationale: A última frase do testemunho inglês é obscura. A tradução evita resolver como fato explícito se toda a colheita extraordinária procedeu da medida semeada por Jesus.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Conserva o tom simples da narrativa e evita converter as medidas antigas em unidades atuais. Tradução provisória baseada no testemunho inglês de domínio público; a revisão direta da tradição manuscrita grega ainda está pendente.
