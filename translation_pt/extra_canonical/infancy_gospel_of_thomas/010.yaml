translation:
  language: pt
  text: 'No manuscrito Hagios Saba 259, esta passagem aparece depois do capítulo 16.


    (1) Outra vez, certo jovem estava rachando lenha em partes iguais. O machado atingiu a sola do pé dele; ele perdeu muito sangue e morreu.[a]


    (2) Houve um tumulto, e Jesus correu até lá. Abrindo caminho por entre a multidão, segurou o pé ferido, e imediatamente o pé ficou curado. Então disse ao jovem: “Vá e continue rachando sua lenha.”


    (3) As multidões viram isso, ficaram maravilhadas e disseram: “Pois ele salvou muitas vidas da morte e continuará salvando durante todos os dias de sua vida.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradução mais literal da expressão atestada em inglês: “ele abriu/cortou a parte de baixo do pé”. O instrumento não é mencionado explicitamente nesse testemunho, embora o machado seja sugerido pelo ato de rachar lenha.'
    reason: Sinaliza que a explicitação de “machado” é contextual e que a consulta direta ao texto grego ainda está pendente.
  - marker: b
    text: 'Ou: “salvou muitas almas da morte”. Aqui, “vidas” traduz a expressão no sentido de pessoas livradas da morte.'
    reason: Preserva a alternativa formal e a possível amplitude semântica de “souls”.
lexical_decisions:
- source_word: splitting wood into equal parts
  choice: rachando lenha em partes iguais
  rationale: Mantém a ação e o detalhe de divisão uniforme em linguagem portuguesa natural.
- source_word: split the bottom of his foot
  choice: O machado atingiu a sola do pé dele
  rationale: Expressa de modo inteligível o acidente implícito no contexto; como a revisão direta do grego ainda está pendente, a nota registra a possível tradução mais literal.
- source_word: bled out
  choice: perdeu muito sangue
  rationale: Comunica em português corrente uma hemorragia fatal sem recorrer a formulação excessivamente técnica.
- source_word: stricken foot
  choice: pé ferido
  rationale: Solução clara e natural para o pé gravemente atingido.
- source_word: souls
  choice: vidas
  rationale: No contexto de livramento da morte física, 'vidas' preserva o sentido provável sem sugerir necessariamente uma distinção antropológica entre alma e corpo.
theological_decisions:
- issue: O sentido de “souls” no dito final
  choice: vidas
  alternative: almas
  rationale: A cena trata de pessoas salvas da morte física. A alternativa literal é preservada em nota para não eliminar a ambiguidade lexical antes da revisão do grego.
- issue: A extensão futura da atividade salvadora de Jesus
  choice: continuará salvando durante todos os dias de sua vida
  alternative: salvará por todos os dias da sua vida
  rationale: Mantém a afirmação temporal do testemunho sem ampliá-la para uma proposição teológica além do texto.
translation_notes:
  register: Português moderno, digno e narrativamente claro, com ampla legibilidade brasileira. Como o material fornecido é um testemunho inglês de domínio público e a revisão direta da tradição manuscrita grega está pendente, foram evitadas reconstruções gregas não verificáveis; explicitações contextuais e ambiguidades relevantes foram assinaladas em notas.
