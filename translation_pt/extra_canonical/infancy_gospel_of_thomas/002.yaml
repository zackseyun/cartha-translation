base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/002.yaml
  text: '(1) The child Jesus was five years old. After it rained, he was playing at the ford of a flowing stream. He stirred up the muddy water, gathered it into pools, and made it clean and excellent, commanding it by his word alone—and not by any action.


    (2) Then he took soft clay from the mud and shaped twelve sparrows from it. But it was the Sabbath when he did these things, and many children were with him.


    (3) A certain Jew saw the child Jesus doing these things with the other children. He went to Joseph, Jesus’ father, and slandered the child Jesus, saying, “He made clay on the Sabbath, which is not permitted, and shaped twelve sparrows.”


    (4) Joseph went and rebuked Jesus, saying, “Why are you doing these things on the Sabbath?”


    But Jesus clapped his hands and, with a shout in front of everyone, commanded the birds, saying, “Go, take flight like living beings!” The sparrows took flight and went away, squawking.


    (5) When the Pharisee saw this, he was amazed and reported it to all his friends.'
translation:
  language: pt
  text: '(1) O menino Jesus tinha cinco anos. Depois da chuva, ele brincava no vau de um riacho corrente. Revolveu as águas turvas, reuniu-as em pequenas poças e as tornou límpidas e excelentes, dando-lhes ordens somente por sua palavra — e não por alguma ação.


    (2) Então, tirou do lodo uma argila macia e com ela modelou doze pardais. Mas era sábado quando fez essas coisas, e muitas crianças estavam com ele.


    (3) Certo judeu viu o menino Jesus fazendo essas coisas com as outras crianças. Foi até José, pai de Jesus, e acusou o menino, dizendo: “Ele fez barro no sábado, o que não é permitido, e modelou doze pardais.”


    (4) José foi repreendê-lo e perguntou: “Por que você está fazendo essas coisas no sábado?”


    Jesus, porém, bateu palmas e, diante de todos, ordenou às aves com um grito: “Vão! Levantem voo como seres vivos!” Os pardais levantaram voo e partiram chilreando.


    (5) Ao ver isso, o fariseu ficou admirado e contou o ocorrido a todos os seus amigos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ford
  choice: vau
  rationale: Preserva com precisão o local raso de travessia do curso d’água; embora menos frequente, é termo português claro no contexto e evita substituir o cenário por uma margem genérica.
- source_word: flowing stream
  choice: riacho corrente
  rationale: Mantém tanto a pequena corrente de água quanto a ideia explícita de movimento.
- source_word: dirty waters
  choice: águas turvas
  rationale: No contexto de água revolvida após a chuva, “turvas” soa mais natural e indica água carregada de sedimentos sem acrescentar a noção moderna de contaminação.
- source_word: pools
  choice: pequenas poças
  rationale: Expressa os reservatórios de água formados pelo menino e distingue-os do riacho.
- source_word: clean and excellent
  choice: límpidas e excelentes
  rationale: Conserva os dois qualificativos incomuns do testemunho, sem reduzir “excellent” a mera limpeza.
- source_word: soft clay
  choice: argila macia
  rationale: “Argila” identifica o material moldável com naturalidade e “macia” preserva sua condição.
- source_word: slandered
  choice: acusou
  rationale: Evita afirmar tecnicamente que a denúncia era falsa; transmite a ação hostil de levar uma acusação a José, preservando a tensão narrativa.
- source_word: squawking
  choice: chilreando
  rationale: Oferece uma descrição portuguesa natural do som de pardais em voo, sem omitir o detalhe auditivo.
theological_decisions:
- issue: A ação de Jesus sobre a água ocorre apenas por palavra, não por ato
  choice: “dando-lhes ordens somente por sua palavra — e não por alguma ação”
  alternative: “ordenando apenas por uma palavra, e não por uma obra”
  rationale: Mantém o contraste explícito e teologicamente sugestivo entre palavra e ação sem explicar sua natureza ou associá-lo diretamente a uma doutrina específica.
- issue: Aves modeladas tornam-se animadas
  choice: “Levantem voo como seres vivos!”
  alternative: “Voem como aves vivas!”
  rationale: Preserva a formulação comparativa do testemunho (“como seres vivos”) e não explicita além do texto o momento ou mecanismo da vivificação.
- issue: Identidade do denunciante
  choice: “certo judeu” no v. 3 e “o fariseu” no v. 5
  alternative: uniformizar ambas as referências como “fariseu”
  rationale: Conserva a mudança interna do testemunho fornecido, sem harmonizá-la silenciosamente nem ampliar a acusação a um grupo.
- issue: José como pai de Jesus
  choice: “José, pai de Jesus”
  alternative: “José, seu pai”
  rationale: Reproduz a designação narrativa do testemunho sem inserir qualificações cristológicas ausentes, como “pai adotivo”.
translation_notes:
  register: Português moderno, digno e de leitura amplamente acessível, com legibilidade brasileira. Preservaram-se termos narrativos específicos como “vau” e a repetição característica de “sábado”. A tradução é necessariamente provisória, pois o material fornecido declara que a revisão direta do grego ainda está pendente; por isso, as decisões refletem com cautela o testemunho inglês público e a camada inglesa auditada, sem alegar resolução de variantes gregas.
