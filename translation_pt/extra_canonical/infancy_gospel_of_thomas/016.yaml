translation:
  language: pt
  text: '## 16. Jesus cura Tiago da picada de uma serpente[a]


    **(1)** Tiago foi ao bosque amarrar feixes de gravetos para que pudessem fazer pão. Jesus foi com ele. Enquanto juntavam os gravetos, uma serpente terrível mordeu a mão de Tiago.


    **(2)** Ele ficou estendido no chão, à beira da morte. O menino Jesus correu até Tiago e soprou sobre a picada. Imediatamente, a picada foi curada, o animal foi destruído, e Tiago foi salvo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito Hagios Saba 259 não contém os capítulos 17 e 18. Por isso, esses dois capítulos são apresentados com base em manuscritos gregos posteriores. A tradução deste capítulo é provisória, feita a partir de um testemunho inglês de domínio público; a revisão direta do grego ainda está pendente.
    reason: Registra a situação manuscrita fornecida e torna transparente que o texto-base disponível para esta etapa é uma tradução inglesa, não uma colação direta do grego.
lexical_decisions:
- source_word: James
  choice: Tiago
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome bíblico Ἰάκωβος/Jacobus.
- source_word: grove
  choice: bosque
  rationale: Equivalente natural que preserva a ideia de uma área arborizada sem especificar indevidamente seu tipo.
- source_word: tie up sticks
  choice: amarrar feixes de gravetos
  rationale: Explicita de maneira natural a ação de reunir e atar gravetos, sem acrescentar uma finalidade além da indicada no testemunho.
- source_word: make bread
  choice: fazer pão
  rationale: Mantém a expressão ampla do testemunho; evita substituir por “assar pão”, embora o contexto possa sugerir que os gravetos serviriam de combustível.
- source_word: terrible snake
  choice: serpente terrível
  rationale: Preserva tanto o referente quanto a intensidade da descrição.
- source_word: sprawled out and dying
  choice: estendido no chão, à beira da morte
  rationale: Formulação corrente e digna que comunica a prostração física e o estado mortal sem sugerir que Tiago já tivesse morrido.
- source_word: blew on the bite
  choice: soprou sobre a picada
  rationale: Reproduz diretamente a ação narrada, sem explicá-la em termos médicos ou rituais.
- source_word: the beast was destroyed
  choice: o animal foi destruído
  rationale: Mantém a força incomum do predicado e a referência à serpente, sem resolver se sua destruição foi direta ou consequência do ato de Jesus.
- source_word: was saved
  choice: foi salvo
  rationale: Preserva a amplitude do verbo, que no contexto inclui o livramento da morte, sem reduzi-lo a “sobreviveu”.
theological_decisions:
- issue: Natureza da cura realizada por Jesus
  choice: 'Manter a sequência narrativa simples: Jesus sopra sobre a picada, que é imediatamente curada.'
  alternative: Explicar o sopro como gesto milagroso, exorcístico ou medicinal.
  rationale: O testemunho relata a ação e o resultado, mas não define o mecanismo nem atribui ao gesto uma categoria teológica específica.
- issue: Sentido de “Tiago foi salvo”
  choice: Conservar “foi salvo”.
  alternative: Traduzir “sobreviveu” ou “foi curado”.
  rationale: “Salvo” preserva a formulação mais ampla e sua possível ressonância teológica, enquanto o contexto imediato deixa claro o livramento físico.
- issue: Destruição da serpente
  choice: Não indicar como nem por quem o animal foi destruído.
  alternative: Dizer que Jesus matou a serpente ou que ela morreu por causa do sopro.
  rationale: A construção passiva do testemunho não especifica o agente nem o modo; a tradução preserva essa indeterminação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário de circulação internacional. A sintaxe narrativa permanece simples, em harmonia com o estilo do relato. Evitaram-se explicações doutrinárias e harmonizações. O título foi formulado editorialmente a partir do conteúdo do capítulo.
