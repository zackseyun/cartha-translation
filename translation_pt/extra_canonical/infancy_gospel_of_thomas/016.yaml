review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês disponível: Tiago vai ao bosque, a serpente o morde na mão, Jesus sopra sobre a mordida, ocorre cura imediata, o animal é destruído e Tiago é salvo. A revisão direta do grego permanece pendente, como a nota informa. Ajusta-se apenas a formulação portuguesa de “the bite was healed”, pois “a picada foi curada” é pouco idiomática; “a ferida da mordida foi curada” exprime naturalmente o referente sem alterar o sentido.'
  naturalness: O registro é claro, moderno e apropriado. “A ferida da mordida foi curada” é mais natural em português do que atribuir diretamente a cura à “picada”.
  terminology: “Tiago”, “bosque”, “serpente”, “o menino Jesus” e “foi salvo” são escolhas adequadas. “Foi salvo” conserva a amplitude do enunciado, sem impor uma leitura exclusivamente física ou teológica. A voz passiva em “o animal foi destruído” preserva a ausência de agente explícito.
  issues:
  - severity: low
    issue: “a picada foi curada”
    rationale: 'Embora compreensível, a expressão é pouco natural em português: cura-se a ferida causada pela mordida/picada. A revisão melhora a idiomaticidade sem explicitar mecanismo, agente ou diagnóstico.'
  revised_text: '## 16. Jesus cura Tiago da picada de uma serpente[a]


