review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha fielmente o testemunho inglês disponível: Tiago vai ao bosque, Jesus o acompanha, uma serpente o morde na mão, Jesus sopra sobre a lesão, ela é curada, a criatura é destruída e Tiago é salvo. Como a revisão direta do grego está expressamente pendente, não se devem fazer afirmações além desse testemunho.'
  naturalness: O texto é claro e tem registro narrativo apropriado. Contudo, «a picada foi curada» soa pouco idiomático em português, pois normalmente se cura a ferida, a mordida ou o ferimento, não a picada em si. A substituição melhora a naturalidade sem alterar o sentido.
  terminology: «Tiago», «bosque», «gravetos», «serpente», «menino Jesus» e «foi salvo» são escolhas adequadas. «Criatura» preserva melhor a retomada algo marcada de «the beast» do que «animal», sem especificar o modo ou o agente de sua destruição.
  issues:
  - severity: low
    issue: «a picada foi curada»
    rationale: A expressão é compreensível, mas menos natural do que referir-se à ferida causada pela mordida. O testemunho diz que o «bite» foi curado; «a ferida da mordida» transmite isso com clareza.
  - severity: low
    issue: «o animal foi destruído»
    rationale: Embora possível, «animal» é uma retomada mais neutra do que «the beast». «A criatura foi destruída» conserva uma formulação narrativa marcada e não afirma que Jesus a matou.
  revised_text: '## 16. Jesus cura Tiago da picada de uma serpente[a]


    **(1)** Tiago foi ao bosque amarrar feixes de gravetos para que pudessem fazer pão. Jesus foi com ele. Enquanto juntavam os gravetos, uma serpente terrível mordeu Tiago na mão.


    **(2)** Ele ficou estendido no chão, à beira da morte. O menino Jesus correu até Tiago e soprou sobre a ferida da mordida. Imediatamente, a ferida foi curada, a criatura foi destruída, e Tiago foi salvo.'
  revised_footnotes:
  - marker: a
    text: O manuscrito Hagios Saba 259 não contém os capítulos 17 e 18. Por isso, esses dois capítulos são apresentados com base em manuscritos gregos posteriores. A tradução deste capítulo é provisória, feita a partir de um testemunho inglês de domínio público; a revisão direta do grego ainda está pendente.
    reason: Registra a situação manuscrita fornecida e torna transparente que o texto-base disponível para esta etapa é uma tradução inglesa, não uma colação direta do grego.
  revision_rationale: 'Foram feitas apenas duas correções de formulação: «ferida da mordida» substitui a expressão menos idiomática «picada» como objeto de «curar», e «criatura» preserva a retomada narrativa de «the beast». A ambiguidade sobre como a serpente foi destruída e o sentido amplo de «foi salvo» permanece intacta.'
