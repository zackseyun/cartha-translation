review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho fornecido, inclusive a sequência da ação e a metáfora vegetal. Contudo, «os ajuntamentos de água» resolve no corpo do texto uma expressão que o testemunho inglês e a própria nota identificam como ambígua. Além disso, «chamuscado por um vento impetuoso» altera a relação sintática da imagem: o vento não é apresentado como agente que chamusca o ramo.'
  naturalness: O texto é geralmente claro e atual. «Desfez as poças» e «definhou» funcionam bem no registro narrativo. «Seus ajuntamentos» é deliberadamente incomum, mas essa estranheza é preferível à eliminação de uma ambiguidade textual e é devidamente explicada em nota.
  terminology: «Sumo sacerdote», «sábado», «ramo de salgueiro», «fruto», «raiz» e «broto» são escolhas adequadas. A comparação final deve usar «num vento impetuoso» (ou equivalente), não «por um vento», para não atribuir ao vento a ação de chamuscar.
  issues:
  - severity: medium
    issue: A expressão ambígua «their gatherings» foi interpretada como «os ajuntamentos de água» no texto principal.
    rationale: O testemunho de base preserva a formulação ambígua, e a documentação do projeto declara a intenção de retê-la. A explicitação «de água» restringe o sentido; a nota deve oferecer essa possibilidade sem impô-la.
  - severity: medium
    issue: «Ramo chamuscado por um vento impetuoso» faz do vento o agente do chamuscamento.
    rationale: 'O testemunho diz «like a scorched branch in a violent wind»: o ramo já está chamuscado e se encontra em vento violento. A redação proposta muda a imagem.'
  revised_text: '(1) O filho de Anás, o sumo sacerdote, disse a Jesus: “Por que você está fazendo uma coisa dessas no sábado?” Então pegou um ramo de salgueiro, desfez as poças, deixou escoar a água que Jesus havia juntado e secou os seus ajuntamentos.[a]


    (2) Quando viu o que havia acontecido, Jesus lhe disse: “Seu fruto não terá raiz, e seu broto ficará ressequido como um ramo chamuscado num vento impetuoso!”


    (3) Imediatamente, aquele menino definhou.'
  revised_footnotes:
  - marker: a
    text: Expressão de sentido incerto no testemunho usado para esta tradução; literalmente, “os ajuntamentos deles”. Pode referir-se aos acúmulos de água.
    reason: Preserva no texto a ambiguidade da expressão do testemunho, apresentando na nota, sem a impor, a interpretação ligada à água.
  revision_rationale: A revisão elimina uma explicitação interpretativa indevida da expressão ambígua e restaura a relação da comparação final, sem alterar o conteúdo narrativo, o registro ou a cautela quanto ao desfecho do menino. A conferência direta com a tradição grega continua necessária.
