base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/003.yaml
  text: '(1) Annas the high priest’s son said to him, Jesus, “Why are you doing such a thing on the Sabbath?” Then he took a willow twig, destroyed the pools, drained the water Jesus had gathered, and dried up their gatherings.


    (2) But when Jesus saw what had happened, he said to him, “Your fruit will have no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) Immediately, that child withered away.'
translation:
  language: pt
  text: '(1) O filho de Anás, o sumo sacerdote, disse a Jesus: “Por que você está fazendo uma coisa dessas no sábado?” Então pegou um ramo de salgueiro, desfez as poças, deixou escoar a água que Jesus havia juntado e secou os ajuntamentos de água.[a]


    (2) Quando viu o que havia acontecido, Jesus lhe disse: “Seu fruto não terá raiz, e seu broto ficará ressequido como um ramo chamuscado por um vento impetuoso!”


    (3) Imediatamente, aquele menino definhou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Expressão de sentido incerto no testemunho usado para esta tradução; literalmente, “os ajuntamentos deles”. Pode referir-se aos acúmulos de água.
    reason: A revisão direta do grego ainda está pendente, e a formulação do testemunho inglês é ambígua.
lexical_decisions:
- source_word: willow twig
  choice: ramo de salgueiro
  rationale: Mantém a identificação da planta e usa uma expressão natural em português; “raminho” daria uma precisão de tamanho não garantida pelo testemunho fornecido.
- source_word: destroyed the pools
  choice: desfez as poças
  rationale: “Desfez” comunica que o menino rompeu as pequenas formações que continham a água, evitando o tom excessivamente grandioso de “destruiu” em português.
- source_word: their gatherings
  choice: os ajuntamentos de água
  rationale: Conserva a imagem incomum e a ambiguidade do testemunho, mas explicita que os ajuntamentos são de água para tornar a frase compreensível em português.
- source_word: shoot
  choice: broto
  rationale: Preserva a metáfora vegetal em paralelo com “fruto” e “raiz”.
- source_word: withered away
  choice: definhou
  rationale: Expressa de modo natural o ressecamento ou colapso aplicado a uma pessoa, sem acrescentar explicitamente que o menino morreu.
theological_decisions:
- issue: Relação entre a declaração de Jesus e o estado do menino
  choice: 'Manter a sequência direta: Jesus pronuncia as palavras e o menino imediatamente definha.'
  alternative: Explicitar que Jesus o amaldiçoou, matou ou causou diretamente sua morte.
  rationale: O título editorial fala em maldição, mas o texto fornecido apresenta as palavras e o resultado sem empregar aqui um verbo explícito para “amaldiçoar” nem declarar a morte; a tradução não deve intensificar essa afirmação.
- issue: Imagem de fruto, raiz e broto
  choice: Preservar a metáfora vegetal e sua tensão interna.
  alternative: Interpretá-la como referência explícita à descendência, à vida ou ao destino eterno do menino.
  rationale: O testemunho permite mais de uma leitura; explicá-la no corpo do texto importaria uma interpretação teológica não expressa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade no Brasil e vocabulário amplamente internacional. O uso de “você” acompanha a fala direta corrente sem introduzir solenidade ausente. Esta versão é provisória e foi preparada a partir do testemunho inglês de domínio público fornecido; requer conferência posterior com a tradição manuscrita grega.
