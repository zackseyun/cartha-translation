source:
  text: '(1) And the son of Annas the high priest said to him (Jesus), “Why are you doing such a thing on the Sabbath?” And having taken a willow twig, he destroyed the pools and drained the water which Jesus had gathered, and he dried up their gatherings.


    (2) But having seen what had happened, Jesus said to him, “Your fruit (will have) no root, and your shoot will be withered like a scorched branch in a violent wind!”


    (3) And immediately that child withered away.'
