    Then he said to Joseph, “When you were born, I already existed, standing beside you, so that you, as a father, might be taught by me a teaching that no one else knows or can teach. And you will bear the name of salvation.”


    (5) The Jews cried out and said to him, “Oh, what a new and incredible wonder! The child is perhaps five years old, and oh, what words he speaks! We have never known such words. No one—neither a lawyer nor a Pharisee—has spoken like this child.”


    (6) The child answered them, “Why are you amazed? Or rather, why do you not believe the things I have told you? The truth is that I, who was created before this world, know precisely when you were born, as well as your fathers and their fathers.”


    (7) All the people who heard this were speechless and could no longer speak to him. But he went up to them, skipped around, and said, “I was playing with you because I know that you are small-minded and amazed by small things.”


