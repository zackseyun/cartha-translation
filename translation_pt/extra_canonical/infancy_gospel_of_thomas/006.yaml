    The teacher became irritated and struck him on the head.


    The child became irritated and said to him, “I want to teach you rather than be taught by you, since I know the letters you are teaching more precisely. To me, these things are like a noisy gong or a clanging cymbal that produces neither the sound, nor the glory, nor the power of understanding.”


    (9) When the child’s anger had ceased, he recited all the letters by himself, from alpha to omega, with great skill. Looking directly at the teacher, he said, “If you do not know the nature of the alpha, how can you teach someone else the beta? Hypocrite! If you know, first teach me the alpha, and then I will trust you to speak about the beta.” Then he began to teach the teacher about the first element, and the teacher could say nothing to him.


    (10) While many people listened, he said to the teacher, “Listen, Teacher, and understand the arrangement of the first element. Notice how it has sharp lines and a middle stroke, which you see pointing, standing with its legs apart, coming together, going out, dragging behind, lifting up, dancing around, <…>, in triple rhythm, two-cornered, of the same form, of the same thickness, of the same family, raised, balanced, isometric, and of equal proportions. These are the lines of the alpha.”'
translation:
  language: pt
  text: '**Evangelho da Infância de Tomé — Capítulo 6: O primeiro mestre, Zaqueu**


    (1) Um mestre chamado Zaqueu estava ali. Ele ouviu Jesus dizer essas coisas a seu pai, José, e ficou muito admirado.


    (2) Então disse a José: “Venha, irmão, entregue-o a mim, para que aprenda as letras, conheça todo o saber, aprenda a amar os da sua idade, honre a velhice e respeite os mais velhos, a fim de adquirir afeição pelas crianças e, por sua vez, ensiná-las.”


    (3) José, porém, disse ao mestre: “Quem pode dominar este menino e ensiná-lo? Não pense nele como alguém pequeno, irmão.”


    Mas o mestre respondeu: “Entregue-o a mim, irmão, e não se preocupe com ele.”


    (4) O menino Jesus olhou para eles e dirigiu estas palavras ao mestre: “Ser mestre lhe vem por natureza, mas você é estranho ao nome pelo qual é chamado, porque estou fora de você e dentro de você, por causa da nobreza do meu nascimento na carne. Você, porém, que é mestre da Lei, não conhece a Lei.”[a]


    Depois disse a José: “Quando você nasceu, eu já existia e estava ao seu lado, para que você, como pai, receba de mim um ensinamento que ninguém mais conhece nem pode ensinar. E você levará o nome da salvação.”[b]


    (5) Então os judeus exclamaram e lhe disseram: “Oh, que maravilha nova e inacreditável! O menino talvez tenha cinco anos, e vejam que palavras ele diz! Nunca conhecemos palavras assim. Ninguém — nem mestre da Lei nem fariseu — falou como este menino.”


    (6) O menino lhes respondeu: “Por que vocês estão admirados? Ou melhor, por que não creem no que lhes disse? A verdade é que eu, que fui criado antes deste mundo, sei com exatidão quando vocês nasceram, bem como seus pais e os pais deles.”[c]


    (7) Todos os que ouviram isso ficaram sem palavras e já não conseguiam falar com ele. Mas ele se aproximou deles, pôs-se a saltitar e disse: “Eu estava brincando com vocês, porque sei que têm a mente estreita e se admiram com coisas pequenas.”


    (8) Quando pareceram reconfortados pelas palavras de encorajamento do menino, o mestre disse ao pai dele: “Venha, traga-o para a escola. Eu lhe ensinarei as letras.”


    José tomou-o pela mão e o conduziu à escola. O mestre o tratou com agrado e o levou para dentro. Zaqueu escreveu o alfabeto para ele e começou a ensiná-lo, repetindo muitas vezes a mesma letra. O menino, porém, não lhe respondeu.


    O mestre ficou irritado e bateu na cabeça dele.


    O menino também ficou irritado e lhe disse: “Quero ensinar você, em vez de ser ensinado por você, pois conheço com mais exatidão as letras que você ensina. Para mim, essas coisas são como um gongo ruidoso ou um címbalo estridente, que não produzem nem o som, nem a glória, nem o poder do entendimento.”[d]


    (9) Quando a ira do menino cessou, ele recitou sozinho todas as letras, do alfa ao ômega, com grande habilidade. Olhando diretamente para o mestre, disse: “Se você não conhece a natureza do alfa, como pode ensinar o beta a outra pessoa? Hipócrita! Se sabe, ensine-me primeiro o alfa; então confiarei em você para falar do beta.” Depois começou a ensinar ao mestre a respeito do primeiro elemento, e o mestre nada conseguiu lhe responder.


    (10) Enquanto muitos escutavam, ele disse ao mestre: “Escute, mestre, e compreenda a disposição do primeiro elemento. Observe como ele tem linhas agudas e um traço no meio, que você vê apontando, com as pernas afastadas, convergindo, saindo, arrastando-se atrás, erguendo-se, dançando ao redor, <…>, em ritmo triplo, com dois ângulos, da mesma forma, da mesma espessura, da mesma família, elevado, equilibrado, isométrico e de proporções iguais. Essas são as linhas do alfa.”[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase “estou fora de você e dentro de você” é obscura na testemunha disponível. “Mestre da Lei” traduz um termo que, literalmente em inglês, aparece como “jurista” ou “especialista na Lei”.
    reason: Preservar uma dificuldade textual e evitar o sentido moderno de “advogado”.
  - marker: b
    text: A expressão “o nome da salvação” tem referência incerta e foi mantida sem explicação interpretativa.
    reason: Sinalizar ambiguidade genuína.
  - marker: c
    text: A testemunha usada diz “fui criado antes deste mundo”. A redação foi mantida, embora produza tensão com formulações cristológicas de outros textos.
    reason: Não harmonizar silenciosamente uma afirmação teologicamente sensível.
  - marker: d
    text: A imagem do “gongo ruidoso” e do “címbalo estridente” lembra linguagem conhecida de 1Coríntios 13:1, mas aqui é aplicada ao ensino das letras. A sequência “som, glória e poder do entendimento” permanece incomum.
    reason: Esclarecer a imagem literária sem alegar dependência certa.
  - marker: e
    text: O sinal <…> indica texto ausente ou danificado na tradição manuscrita. A descrição gráfica e rítmica do alfa é difícil e foi traduzida de modo conservador.
    reason: Marcar explicitamente a lacuna e a incerteza textual.
lexical_decisions:
- source_word: letters
  choice: letras
  rationale: No contexto escolar antigo, refere-se simultaneamente aos caracteres do alfabeto e à instrução elementar; “letras” preserva essa amplitude.
- source_word: lawyer
  choice: mestre da Lei
  rationale: Evita o sentido moderno de advogado e comunica a função de especialista e instrutor da Lei.
- source_word: alpha / beta / omega
  choice: alfa / beta / ômega
  rationale: Mantém os nomes das letras gregas, essenciais ao argumento e à descrição gráfica.
- source_word: first element
  choice: primeiro elemento
  rationale: Preserva a formulação técnica e algo enigmática que designa a primeira letra, sem reduzi-la simplesmente a “primeira letra”.
- source_word: small-minded
  choice: têm a mente estreita
  rationale: Expressa a censura intelectual do texto em português natural, sem confundi-la com pequenez física.
- source_word: yearning for children
  choice: afeição pelas crianças
  rationale: Reproduz o provável sentido pedagógico positivo da passagem sem introduzir conotações impróprias em português moderno.
theological_decisions:
- issue: Preexistência de Jesus e linguagem de criação no v. 6
  choice: “eu, que fui criado antes deste mundo”
  alternative: “eu, que existia antes deste mundo”
  rationale: A testemunha fornecida contém explicitamente “was created”. A tradução preserva a tensão teológica do texto, sem harmonizá-la com formulações cristológicas posteriores.
- issue: Relação de Jesus com José no v. 4
  choice: “para que você, como pai, receba de mim um ensinamento”
  alternative: “para que, sendo pai, você fosse instruído por mim”
  rationale: Mantém a inversão paradoxal entre pai e mestre, sem definir além do texto a natureza da paternidade de José.
- issue: “Fora de você e dentro de você” no v. 4
  choice: tradução literal preservada
  alternative: explicação interpretativa da presença divina ou da superioridade de Jesus
  rationale: A frase é obscura e possivelmente textual ou retoricamente difícil; não se impôs uma interpretação teológica específica.
- issue: “Nome da salvação” no v. 4
  choice: “você levará o nome da salvação”
  alternative: identificar explicitamente o nome José ou Jesus com salvação
  rationale: A referência exata é ambígua na testemunha; a tradução conserva a formulação sem explicar a quem ou a que nome ela alude.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” para legibilidade ampla no Brasil e compreensão internacional. A sintaxe narrativa foi levemente naturalizada, mas as repetições, paradoxos e passagens obscuras foram preservados. Este rascunho é necessariamente provisório porque a revisão direta do grego ainda está pendente e a base fornecida é uma testemunha inglesa de domínio público.
