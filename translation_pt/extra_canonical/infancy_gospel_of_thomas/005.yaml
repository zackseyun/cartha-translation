translation:
  language: pt
  text: '(1) José disse a Jesus: “Por que você diz essas coisas, fazendo com que eles sofram e nos odeiem?”


    A criança respondeu a José: “Já que você conhece palavras sábias, não ignora de onde elas vieram; [a]foram ditas a respeito de uma criança de cinco anos.[b] E eles não serão levantados, e estes receberão seu castigo.”[c]


    Imediatamente, os que o acusavam ficaram cegos.


    (2) Então José pegou Jesus pela orelha e a puxou com força.


    (3) Jesus lhe disse: “Basta que você me procure e me encontre; não deve, além disso, me açoitar por ter assumido uma ignorância natural.[d] Você não viu claramente quem eu sou para você.[e] Veja! Eu me submeti diante de você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A ligação exata desta frase com o que vem antes é incerta no testemunho disponível.
    reason: Sinalizar dificuldade sintática preservada enquanto a revisão direta do grego está pendente.
  - marker: b
    text: 'O testemunho traz uma frase difícil: “foram ditas a respeito de uma criança de cinco anos”.'
    reason: Evitar corrigir silenciosamente uma leitura textual obscura.
  - marker: c
    text: Os referentes de “eles” e “estes” não são claros. “Serão levantados” também pode sugerir restauração ou ressurreição.
    reason: Preservar ambiguidades pronominais e semânticas genuínas.
  - marker: d
    text: “Por ter assumido uma ignorância natural” traduz provisoriamente uma expressão obscura.
    reason: A redação depende de um testemunho inglês e requer conferência no grego.
  - marker: e
    text: 'Outra tradução possível: “Você não percebeu claramente por que eu sou seu”.'
    reason: Registrar uma alternativa próxima para uma frase cuja sintaxe e sentido são incertos.
lexical_decisions:
- source_word: child
  choice: a criança
  rationale: Mantém a designação narrativa e evita especificar novamente o nome onde o testemunho usa um substantivo.
- source_word: raised
  choice: levantados
  rationale: Preserva a ambiguidade do testemunho entre levantar-se, ser restaurado e ser ressuscitado, sem decidir prematuramente.
- source_word: scourge
  choice: açoitar
  rationale: Reproduz a força punitiva do verbo, embora o ato narrado imediatamente antes seja puxar a orelha.
- source_word: subdued
  choice: me submeti
  rationale: Expressa sujeição voluntária ou aquiescência sem impor a ideia mais forte de derrota.
theological_decisions:
- issue: Possível referência a ressurreição em “não serão levantados”
  choice: Manter “levantados”
  alternative: “ressuscitados” ou “restabelecidos”
  rationale: Sem revisão direta do grego, não convém resolver o alcance teológico da expressão.
- issue: Relação de Jesus com José em “why I’m yours”
  choice: “quem eu sou para você”
  alternative: “por que pertenço a você”
  rationale: A formulação do testemunho é difícil; a tradução escolhida conserva a tensão relacional sem afirmar inequivocamente posse, filiação ou mera submissão.
- issue: Submissão de Jesus a José
  choice: “Eu me submeti diante de você”
  alternative: “Fui dominado por você”
  rationale: Mantém a ideia explícita de sujeição, evitando transformar a fala em derrota ontológica ou doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” coerente com fala familiar. Trata-se de uma versão provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega ainda está pendente. As obscuridades mais relevantes foram mantidas no texto e indicadas em notas, sem harmonização teológica.
