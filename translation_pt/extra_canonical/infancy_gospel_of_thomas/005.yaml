    Imediatamente, os que o acusavam ficaram cegos.


    (2) Então José pegou Jesus pela orelha e a puxou com força.


    (3) Jesus lhe disse: “Basta você me procurar e me encontrar; e não, além disso, me açoitar ao assumir uma ignorância natural.[d] Você não percebeu claramente por que sou seu.[e] Veja! Fui submetido diante de você.”'
