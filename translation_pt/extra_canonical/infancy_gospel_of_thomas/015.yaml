base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/015.yaml
  text: '(1) Some days later, another teacher again said to Joseph, Jesus’ father, “Come, brother, give him to me at the school, so that I can teach him letters with flattery.”


    Joseph said to him, “If you have courage, brother, take him with salvation.”


    The teacher took the child by the hand and led him away with great fear and concern. The child went gladly.


    (2) When Jesus entered the school, he found a book lying on the lectern. He picked it up, but he did not read what was written in it, because it was not from God’s law. Instead, he opened his mouth and uttered such impressive words that the teacher sitting opposite him listened with great delight and encouraged him to say more. The crowd standing there was amazed at his holy words.


    (3) Joseph quickly ran to the school, suspecting that this teacher was no longer inexperienced and had suffered. But the teacher said to Joseph, “So that you may know, brother, I did indeed take your child as a disciple, but he is full of great grace and wisdom. Therefore, brother, lead him away with salvation into your house.”


    (4) Jesus said to the teacher, “Since you have spoken correctly and testified correctly, the one struck down will also be saved because of you.” Immediately, that teacher also was saved. Joseph took the child and led him away into his house.'
translation:
  language: pt
  text: '(1) Alguns dias depois, outro mestre disse novamente a José, pai de Jesus:


    — Venha, irmão, entregue-o a mim na escola, para que eu lhe ensine as letras com palavras persuasivas.[a]


    José lhe respondeu:


    — Se você tem coragem, irmão, leve-o em segurança.[b]


    O mestre tomou o menino pela mão e o conduziu, com muito medo e apreensão. O menino foi de boa vontade.


    (2) Ao entrar na escola, Jesus encontrou um livro sobre a estante de leitura.[c] Pegou-o, mas não leu o que estava escrito nele, pois não provinha da Lei de Deus.[d] Em vez disso, abriu a boca e pronunciou palavras tão extraordinárias que o mestre, sentado diante dele, o ouvia com grande alegria e o incentivava a falar mais. A multidão que estava ali ficou admirada com suas palavras santas.


    (3) José correu depressa para a escola, suspeitando que aquele mestre já não permanecera ileso, mas sofrera algum mal.[e] O mestre, porém, disse a José:


    — Para que você saiba, irmão: de fato recebi seu filho como discípulo, mas ele está cheio de muita graça e sabedoria. Portanto, irmão, leve-o em segurança para sua casa.[b]


    (4) Jesus disse ao mestre:


    — Porque você falou corretamente e deu testemunho correto, aquele que foi abatido também será salvo por sua causa.[f]


    Imediatamente, aquele mestre também foi salvo. Então José tomou o menino e o levou para casa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com brandura” ou “com lisonjas”. A expressão descreve o modo pelo qual o mestre esperava ensinar, mas sua nuance exata é incerta.'
    reason: Registrar a amplitude semântica da expressão incomum “with flattery”.
  - marker: b
    text: 'Literalmente, segundo a testemunha utilizada: “com salvação”. A expressão pode significar “são e salvo” ou “em segurança”.'
    reason: Preservar transparência quanto a um idiomatismo antigo e repetido no capítulo.
  - marker: c
    text: Isto é, um suporte inclinado para sustentar um livro durante a leitura.
    reason: Esclarecer um objeto antigo potencialmente pouco familiar.
  - marker: d
    text: 'Também pode significar: “não fazia parte da Lei de Deus”.'
    reason: Manter a ambiguidade entre proveniência e pertença textual.
  - marker: e
    text: A redação da testemunha é difícil. O sentido parece ser que José temia que o mestre já tivesse sofrido algum mal, como os mestres anteriores.
    reason: Sinalizar incerteza textual e contextual sem corrigi-la silenciosamente.
  - marker: f
    text: A identidade de “aquele que foi abatido” não é explicitada aqui; provavelmente a expressão remete a alguém atingido anteriormente na narrativa.
    reason: Conservar a referência obscura e evitar harmonização interpretativa.
lexical_decisions:
- source_word: with flattery
  choice: com palavras persuasivas
  rationale: A testemunha inglesa traz uma expressão incomum. A formulação portuguesa comunica um ensino gentil e persuasivo sem sugerir necessariamente bajulação insincera.
- source_word: letters
  choice: as letras
  rationale: Preserva o sentido antigo de instrução elementar no alfabeto e na leitura.
- source_word: with salvation
  choice: em segurança
  rationale: Expressão idiomática estranha, provavelmente ligada a sair ou voltar são e salvo. A escolha mantém o motivo de preservação sem inserir uma interpretação teológica específica.
- source_word: lectern
  choice: estante de leitura
  rationale: Termo claro para o suporte em que o livro estava colocado, evitando a associação moderna exclusiva com púlpitos ou auditórios.
- source_word: God’s law
  choice: Lei de Deus
  rationale: A inicial maiúscula sinaliza a possível referência à Lei sagrada, sem identificar de modo mais estreito um corpus específico.
- source_word: the one struck down
  choice: aquele que foi abatido
  rationale: Mantém a referência enigmática e a ligação com um personagem anteriormente atingido, sem identificar silenciosamente quem seja.
theological_decisions:
- issue: Sentido de “não provinha da Lei de Deus”
  choice: pois não provinha da Lei de Deus
  alternative: pois não fazia parte da Lei de Deus
  rationale: A redação escolhida preserva a ambiguidade entre a origem divina do conteúdo e sua pertença material à Lei.
- issue: Salvação do abatido por causa do mestre
  choice: também será salvo por sua causa
  alternative: também será restaurado graças a você
  rationale: Conserva a linguagem de salvação da testemunha e sua relação causal obscura, sem reduzi-la apenas a cura ou ressurreição.
- issue: Salvação imediata do mestre
  choice: aquele mestre também foi salvo
  alternative: aquele mestre também ficou a salvo
  rationale: Mantém a repetição lexical e a possível tensão entre libertação física e salvação em sentido mais amplo.
translation_notes:
  register: Português moderno, digno e acessível, com diálogos naturais e legibilidade brasileira. Foram preservadas as repetições, a estranheza narrativa e as ambiguidades teológicas relevantes. Como a revisão direta do grego ainda está pendente, as notas identificam os pontos em que a testemunha inglesa não permite maior segurança.
