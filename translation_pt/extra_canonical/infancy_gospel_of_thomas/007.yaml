translation:
  language: pt
  text: '(1) Quando o mestre ouviu Jesus falar com tamanha familiaridade e expor tais traços da primeira letra,[a] ficou perplexo diante de semelhante ensinamento e da defesa que ele apresentou. Então o mestre disse: “Ai de mim! Ai de mim! Estou perplexo e arrasado. Envergonhei a mim mesmo ao aceitar esta criança.


    (2) “Leve-o para longe de mim, irmão, pois não consigo suportar seu olhar nem a clareza de suas palavras. Esta criança simplesmente não é deste mundo. Ela é capaz até de dominar o fogo! Talvez esta criança já existisse antes da criação do mundo. Que ventre a gerou? Que mãe a criou? Não sei. Ai de mim, irmão! Ele me deixa atônito. Minha mente não consegue acompanhá-lo. Enganei a mim mesmo — três vezes infeliz que sou! Pensei que ganharia um discípulo, mas descubro que tenho um mestre.


    (3) “Amigos, reflito sobre minha vergonha: velho como sou, fui vencido por uma criança. Eu deveria ser expulso e morrer, ou fugir deste povoado por causa desta criança. Já não posso aparecer diante de todos, especialmente daqueles que viram que fui vencido por uma criança tão pequena. Mas o que posso dizer ou contar a alguém sobre os traços do primeiro elemento?[b] A verdade, amigos, é que não sei, pois não compreendo nem o princípio nem o fim!


    (4) “Portanto, irmão José, leve-o em segurança para sua casa, pois esta criança é algo grandioso — seja um deus, um anjo ou qualquer outra coisa que eu possa dizer, não sei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e descrever dessa maneira os traços da primeira letra”. A construção do testemunho inglês é difícil, e a revisão direta do grego ainda está pendente.'
    reason: Sinalizar a incerteza sintática e lexical da base provisória sem tornar o texto principal ininteligível.
  - marker: b
    text: “Primeiro elemento” provavelmente se refere à primeira letra do alfabeto, mas a expressão foi mantida para preservar o possível jogo com “o princípio” e “o fim”.
    reason: Explicar a ligação literária sem eliminar a ambiguidade do texto.
lexical_decisions:
- source_word: good familiarity
  choice: com tamanha familiaridade
  rationale: Conserva a ideia incomum de domínio ou familiaridade demonstrada por Jesus sem tentar definir mais precisamente um grego ainda não revisto.
- source_word: lines of the first letter
  choice: traços da primeira letra
  rationale: ‘Traços’ comunica as linhas ou formas gráficas de uma letra; ‘primeira letra’ mantém a referência imediata ao ensino do alfabeto.
- source_word: clarity of his word
  choice: clareza de suas palavras
  rationale: Formulação natural em português que preserva a força e inteligibilidade da fala de Jesus.
- source_word: tame fire
  choice: dominar o fogo
  rationale: Mantém a imagem extraordinária sem introduzir uma explicação sobrenatural adicional.
- source_word: thrice-unhappy
  choice: três vezes infeliz
  rationale: Preserva literalmente a intensificação retórica incomum do testemunho.
- source_word: first element
  choice: primeiro elemento
  rationale: Mantém a terminologia ambígua do testemunho, que pode aludir ao primeiro elemento do alfabeto e também sustenta o jogo com ‘princípio’ e ‘fim’.
- source_word: with salvation
  choice: em segurança
  rationale: Neste contexto de conduzir a criança para casa, exprime naturalmente a ideia de chegada sã e salva, sem transformar a frase numa afirmação soteriológica.
- source_word: a great thing
  choice: algo grandioso
  rationale: Preserva a formulação neutra e estranha do texto, sem convertê-la em título cristológico.
theological_decisions:
- issue: Possível preexistência da criança
  choice: “Talvez esta criança já existisse antes da criação do mundo”
  alternative: Afirmar diretamente que Jesus preexistia à criação
  rationale: O mestre fala de modo especulativo; manter ‘talvez’ preserva a incerteza narrativa e evita transformar seu espanto em declaração doutrinária inequívoca.
- issue: Identidade divina ou angélica da criança
  choice: “seja um deus, um anjo ou qualquer outra coisa... não sei”
  alternative: “seja Deus, seja um anjo”
  rationale: O testemunho apresenta alternativas indefinidas na boca de um personagem confuso. O artigo indefinido e o encerramento ‘não sei’ conservam essa tensão, sem harmonização confessional.
- issue: Sentido de ‘with salvation’
  choice: “em segurança”
  alternative: “com salvação”
  rationale: A cena trata de José conduzir Jesus de volta para casa. A opção evita importar uma noção teológica de salvação onde o testemunho provavelmente indica segurança ou integridade.
translation_notes:
  register: Português moderno, digno e narrativamente expressivo, com ampla legibilidade brasileira. O discurso lamentoso conserva repetições e hipérboles. Esta é uma tradução provisória baseada no testemunho inglês de domínio público fornecido; permanece necessária a conferência direta com a tradição manuscrita grega.
