base_translation:
  language: en
  yaml_path: translation/extra_canonical/infancy_gospel_of_thomas/014.yaml
  text: '(1) Joseph saw Jesus’ wisdom and understanding. He did not want him to be unfamiliar with letters, so he entrusted him to another teacher.


    The teacher wrote out the alphabet for Jesus and said, “Say alpha.”


    (2) The child said, “First tell me what beta is, and I will tell you what alpha is.”


    The teacher became irritated and struck him. Jesus cursed him, and the teacher fell down and died.


    (3) The child went home to his parents. Joseph called Jesus’ mother and ordered her not to let him leave the house, so that those who provoke him might not die.'
translation:
  language: pt
  text: '(1) José viu a sabedoria e o entendimento de Jesus. Não queria que ele desconhecesse as letras, por isso o confiou a outro mestre.


    O mestre escreveu o alfabeto para Jesus e disse:


    — Diga alfa.


    (2) O menino respondeu:


    — Primeiro me diga o que é beta, e eu lhe direi o que é alfa.


    O mestre se irritou e bateu nele. Jesus o amaldiçoou, e o mestre caiu morto.


    (3) O menino voltou para a casa de seus pais. José chamou a mãe de Jesus e ordenou que ela não o deixasse sair de casa, para que não morressem aqueles que o provocassem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: letters
  choice: as letras
  rationale: Preserva a referência à aprendizagem das letras e do alfabeto, em vez de ampliar indevidamente para educação ou leitura em geral.
- source_word: teacher
  choice: mestre
  rationale: Termo natural e digno para um instrutor antigo, mantido de modo uniforme no episódio.
- source_word: alpha / beta
  choice: alfa / beta
  rationale: Mantém os nomes gregos das letras, essenciais ao diálogo e ao contexto pedagógico.
- source_word: struck him
  choice: bateu nele
  rationale: Expressa de modo claro a agressão física sem especificar instrumento, intensidade ou número de golpes ausentes no testemunho fornecido.
- source_word: cursed him
  choice: o amaldiçoou
  rationale: Conserva a força explícita da ação narrada, sem suavização teológica.
- source_word: fell and died
  choice: caiu morto
  rationale: Formulação portuguesa natural que comunica a queda e a morte imediata, sem acrescentar mecanismo causal.
- source_word: set him free from the house
  choice: o deixasse sair de casa
  rationale: Equivalência idiomática clara para a ordem de mantê-lo dentro de casa.
- source_word: provoke him
  choice: o provocassem
  rationale: 'Preserva a relativa amplitude do verbo: importunar, irritar ou desafiar, sem escolher uma motivação mais estreita.'
theological_decisions:
- issue: Retrato severo do menino Jesus
  choice: Manter sem atenuação a maldição e a morte do mestre
  alternative: Suavizar a ação ou sugerir que a morte teve causa independente
  rationale: O testemunho fornecido liga diretamente a maldição de Jesus à queda e morte do mestre; a tradução não deve harmonizar o relato com expectativas teológicas posteriores.
- issue: Finalidade da restrição imposta por José
  choice: “para que não morressem aqueles que o provocassem”
  alternative: “a fim de impedir que morressem” ou uma afirmação categórica de causalidade
  rationale: A construção final preserva o propósito ou prevenção expresso no testemunho sem desenvolver uma explicação teológica adicional.
