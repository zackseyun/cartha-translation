base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/007.yaml
  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: pt
  text: '“Felizes são vocês que conhecem de antemão o que pode fazê-los tropeçar e que fogem das coisas estranhas.


    Felizes são vocês que são insultados e desprezados por causa do amor que o Senhor deles lhes demonstra.[a]


    Felizes são vocês que choram e são perseguidos pelos que não têm esperança, porque serão libertos de todo cativeiro.


    “Vigiem e orem para que evitem viver na carne e, em vez disso, saiam do amargo cativeiro desta vida. Quando orarem, encontrarão descanso, porque abandonaram o sofrimento e a vergonha. Pois, quando deixarem para trás os sofrimentos e os desejos do corpo, receberão descanso da parte do Bom e reinarão com o Rei, vocês e ele unidos um ao outro, desde agora e para todo o sempre. Amém.”


    O Livro de Tomé


    O Contendor


    Escrito aos Maduros


    Lembrem-se também de mim, meus irmãos,


    [em] suas orações:


    Paz aos santos


    e aos que são do espírito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção pronominal desta frase é ambígua no testemunho disponível: literalmente, “por causa do amor que o Senhor deles lhes demonstra”. Também seria possível entender “por causa do amor que o Senhor de vocês demonstra a vocês”.'
    reason: Preservar e explicar a instabilidade dos referentes sem corrigi-la silenciosamente.
lexical_decisions:
- source_word: Blessed
  choice: Felizes
  rationale: Expressa a condição favorecida proclamada pelas bem-aventuranças em português corrente, sem reduzir o sentido a uma bênção ritual.
- source_word: strange things
  choice: coisas estranhas
  rationale: Mantém a formulação ampla e possivelmente técnica do testemunho, sem especificar indevidamente o referente.
- source_word: existing/living in the flesh
  choice: viver na carne
  rationale: Preserva a linguagem antropológica do texto e sua tensão teológica, em vez de parafraseá-la como mera imoralidade.
- source_word: repose/rest
  choice: descanso
  rationale: É natural e digno em português e conserva a repetição conceitual do trecho.
- source_word: the Good One
  choice: o Bom
  rationale: Mantém a designação substantivada e sua possível função de título, sem identificá-la explicitamente além do que o testemunho permite.
- source_word: Contender
  choice: Contendor
  rationale: Conserva o sentido de alguém que luta ou disputa e mantém o caráter titular da expressão.
- source_word: Mature
  choice: Maduros
  rationale: Preserva a possível categoria espiritual do título sem acrescentar uma interpretação denominacional.
theological_decisions:
- issue: Sentido de “carne” e afastamento dos desejos corporais
  choice: Manter literalmente “viver na carne” e “desejos do corpo”
  alternative: Interpretar como vida pecaminosa ou ascetismo absoluto
  rationale: O texto apresenta tensão ascética e antropológica genuína; a tradução não deve resolvê-la em favor de uma doutrina específica.
- issue: Identidade do “Bom” e do “Rei”
  choice: Conservar ambos como títulos distintos no nível gramatical
  alternative: Explicitar que ambos se referem a Deus ou a Cristo
  rationale: O testemunho fornecido não autoriza identificar ou distinguir definitivamente essas figuras.
- issue: União com o Rei
  choice: “vocês e ele unidos um ao outro”
  alternative: Parafrasear como comunhão moral ou absorção ontológica
  rationale: A formulação preserva a reciprocidade e evita definir a natureza teológica da união.
- issue: Referentes pronominais na segunda bem-aventurança
  choice: Preservar a mudança para “o Senhor deles lhes demonstra” e sinalizar a dificuldade
  alternative: Regularizar para “o amor que o Senhor de vocês demonstra a vocês”
  rationale: O testemunho contém uma assimetria pronominal significativa; regularizá-la apagaria uma ambiguidade textual real.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom digno e cadência sapiencial. Tradução provisória baseada no testemunho público em inglês; a revisão direta do copta do Códice de Nag Hammadi II,7 ainda está pendente. Elementos editoriais alheios à obra (contato, FAQ e aviso comercial) foram excluídos.
