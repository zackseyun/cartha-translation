review_pass:
  verdict: approve
  source_fidelity: A tradução acompanha com precisão o testemunho inglês público fornecido, que é a base provisória disponível enquanto a revisão direta do copta permanece pendente. Conserva a repetição de “descanso”, a linguagem ascética de “carne” e “desejos do corpo”, os títulos distintos “o Bom” e “o Rei”, e a reciprocidade da união. “De todo cativeiro” corresponde adequadamente a “from every captivity”.
  naturalness: O português é moderno, claro e de registro sapiencial digno. “Felizes são vocês” é uma solução corrente e inteligível para a fórmula de bem-aventurança; “viver na carne”, “o Bom” e “os que são do espírito” preservam deliberadamente a estranheza e a densidade do texto sem se tornarem ininteligíveis.
  terminology: As escolhas terminológicas são consistentes com o testemunho e evitam impor identificação doutrinária ao “Bom”, ao “Rei”, à “carne” ou à união com o Rei. “Contendor” e “Maduros” preservam o caráter titular e potencialmente técnico dos cabeçalhos.
  issues:
  - severity: low
    issue: Revisão direta do copta ainda pendente.
    rationale: A fidelidade só pode ser aferida provisoriamente contra o testemunho inglês público fornecido. A nota sobre o verbo com valência cognitiva não se aplica de modo identificável a uma expressão deste excerto e, portanto, não requer nota adicional.
