translation:
  language: pt
  text: 'Tomé respondeu: “Que podemos dizer depois dessas coisas? Que podemos dizer aos cegos? Que ensinamento devemos transmitir a esses pobres mortais que dizem: ‘Viemos aqui para [fazer] o bem, não para amaldiçoar’, e ainda [dizem]: ‘Se não tivéssemos sido gerados na carne, jamais teríamos conhecido o [pecado]’?”


    O Salvador disse: “Em verdade, quanto [a esses], não os considerem humanos, mas [como] animais, pois, assim como os animais devoram uns aos outros, também esse tipo de gente devora uns aos outros. É exatamente o contrário: por causa do seu amor, eles perderam [o Reino], o doce fogo, tornando-se escravos da morte e correndo para praticar obras de corrupção. Eles dão vazão ao desejo dos seus antepassados. Serão lançados no abismo para sofrer o tormento do mal amargo de sua natureza, pois serão açoitados e forçados a correr para trás, para onde não conseguem ver; e serão [separados] de seus membros, suportando isso não com coragem, mas [em] desespero. E se alegram porque […] loucura e irracionalidade […] [Eles] correm atrás dessa irracionalidade sem reconhecer [sua loucura, crendo] que [são] sábios. [Eles…] seu corpo […] []. A mente deles está voltada para si mesmos, pois seu pensamento está ocupado com suas ações; mas o fogo os queimará.”


    Tomé respondeu: “Senhor, o que fará a pessoa lançada entre eles? Estou muito preocupado com eles, pois muitos os atacam.”


    O Salvador respondeu: “O que você mesmo pensa?”


    Judas, chamado Tomé, disse: “Senhor, é justo que tu fales e eu escute.”


    O Salvador respondeu: “Preste atenção ao que vou lhe dizer e creia no que é verdadeiro. O que semeia e o que é semeado desaparecerão no fogo, em fogo e água, e eles se cobrirão em sepulturas escuras. Depois de muito tempo, manifestarão o fruto de árvores más, sendo repreendidos e mortos na boca de animais e seres humanos, impelidos pelas chuvas, pelos ventos, pelo ar e pela luz que brilha do alto.”


    Tomé respondeu: “Sem dúvida, tu nos convenceste, Senhor. Sabemos em nosso coração, e está claro que [é assim] e que tua palavra é suficiente. Contudo, essas palavras que nos dizes parecem ridículas e detestáveis ao mundo, porque são mal interpretadas. Então, como podemos ir pregá-las, já que [não] somos respeitados [no] mundo?”


    O Salvador respondeu: “Em verdade lhes digo: quem ouve [a palavra de vocês] e a rejeita, zomba dela ou ri dessas coisas — em verdade lhes digo — será entregue ao governante do alto, que reina sobre todo poder. Ele fará essa pessoa girar em círculos e a lançará do céu para o abismo, onde ficará presa num lugar estreito e sombrio. Além disso, não poderá se virar nem se mover, por causa da imensa profundidade do Tártaro[a] e da [pesada amargura] do Hades[b] imutável. […] a eles para isso […] não perdoarão […] perseguem vocês. Eles entregarão […] a […] anjo Tartaroucos[c] […] fogo perseguindo-os. [] […] açoites de fogo que lançam uma chuva de faíscas no rosto de quem é perseguido.


    Se ele correr para o oeste, encontrará o fogo.


    Se correr para o sul, também o encontrará ali.


    Se voltar para o norte, o perigo do fogo fervente o encontrará de novo.


    Tampouco poderá encontrar um caminho para o leste, a fim de fugir para lá e ser salvo.


    Pois, como não o encontrou no dia em que habitava no corpo, também não o encontrará no dia do julgamento.”'
