  footnotes:
  - marker: a
    text: 'Tártaro: termo grego para uma região profunda de confinamento ou punição no mundo inferior.'
    reason: O termo técnico pode não ser familiar ao leitor moderno e não equivale necessariamente a todas as ideias associadas a ‘inferno’.
  - marker: b
    text: 'Hades: nome grego do mundo dos mortos; aqui aparece ao lado do Tártaro como termo distinto.'
    reason: Evita uma identificação automática com o Tártaro ou com uma formulação teológica posterior.
  - marker: c
    text: 'Tartaroucos: transliteração de um termo raro que pode designar um ser angélico ligado ao Tártaro; o texto está danificado neste ponto.'
    reason: A raridade do termo e a lacuna manuscrita exigem cautela e explicação ao leitor.
lexical_decisions:
- source_word: Tartaros
  choice: Tártaro
  rationale: Mantém o nome cosmológico grego em forma portuguesa reconhecível, sem reduzi-lo genericamente a ‘inferno’.
- source_word: Hades
  choice: Hades
  rationale: Preserva o termo distinto do Tártaro e evita impor uma equivalência teológica com ‘inferno’.
- source_word: Tartarouchos
  choice: Tartaroucos
  rationale: Transliteração portuguesa cautelosa do título/nome raro, cuja função exata não deve ser resolvida silenciosamente.
- source_word: sweet fire
  choice: doce fogo
  rationale: Mantém a imagem paradoxal e sua ambiguidade, em vez de explicá-la ou normalizá-la.
- source_word: deeds of decay
  choice: obras de corrupção
  rationale: Expressa deterioração e ruína moral em português natural, preservando o campo semântico da decomposição.
- source_word: What sows and what is sown
  choice: O que semeia e o que é semeado
  rationale: Conserva a formulação enigmática e a relação ativa/passiva do testemunho.
theological_decisions:
- issue: Referência ao reino perdido
  choice: '[o Reino]'
  alternative: '[o reino] ou explicitação de um reino específico'
  rationale: Preserva a restauração editorial indicada pelos colchetes sem identificar além da evidência fornecida.
- issue: Destino após o julgamento
  choice: Manter Tártaro, Hades e abismo como termos distintos
  alternative: Uniformizar todos como ‘inferno’
  rationale: Evita apagar distinções cosmológicas presentes no testemunho e importar uma sistematização posterior.
- issue: ‘o dia em que habitava no corpo’
  choice: habitar no corpo
  alternative: viver na carne
  rationale: Mantém a possível tensão antropológica do texto sem pressupor uma doutrina específica sobre corpo e alma.
- issue: Identidade de Judas Tomé
  choice: Judas, chamado Tomé
  alternative: Judas Tomé ou Tomé, o Gêmeo
  rationale: Segue a forma explícita do testemunho sem acrescentar uma interpretação etimológica.
