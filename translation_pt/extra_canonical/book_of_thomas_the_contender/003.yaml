translation:
  language: pt
  text: 'Tomé disse ao Senhor: “Peço-te, então, que respondas ao que te pergunto antes de tua ascensão, para que, depois de ouvir de ti acerca das coisas ocultas, eu possa falar delas abertamente. E está claro para mim que é difícil praticar a verdade diante dos outros.”


    O Salvador respondeu: “Se as coisas visíveis estão ocultas para vocês, como poderão ouvir acerca das invisíveis? Se lhes é difícil realizar as obras da verdade que são visíveis neste mundo, como, de fato, realizarão as que dizem respeito à Altura invisível e à Plenitude?[a] E como serão chamados de ‘trabalhadores’? Quanto a isso, vocês são aprendizes e ainda não alcançaram o ápice da perfeição.”


    Tomé respondeu ao Salvador: “Explica-nos o que são essas coisas que chamas de invisíveis, [mas que] estão ocultas de nós.”


    O Salvador disse: “[Todos] os corpos [...] os animais são gerados [...] isso se manifesta como [...] também isto: os que estão acima [...] coisas visíveis, mas [eles são] visíveis [ ] em sua própria raiz, e seu fruto os nutre.[b] Estes corpos visíveis, porém, sobrevivem comendo animais semelhantes a eles, e, como resultado, os corpos mudam. O que muda se deteriorará e perecerá; a partir daí, perde toda esperança de vida, pois é um corpo animal. Portanto, assim como os corpos dos animais perecem, também estas formas [corporais] perecerão. Elas se originam da relação sexual, assim como as dos animais, não é? Se também se originam da relação sexual, como poderão gerar algo diferente dos animais? Por isso, vocês permanecerão crianças até se tornarem maduros.”


    Tomé respondeu: “Por isso te digo, Senhor: os que falam de coisas invisíveis e difíceis de interpretar se parecem com pessoas que, à noite, atiram flechas contra um alvo. Sem dúvida, disparam suas flechas como todos os outros que fazem isso, pois atiram na direção do alvo; contudo, ele não pode ser visto. Mas, quando a luz surgir e encobrir as trevas,[c] a obra de cada um se tornará visível. Ó Senhor, nossa luz, ilumina-nos.”


    Jesus disse: “A natureza da luz é luz.”[d]


    Tomé perguntou: “Senhor, por que esta luz visível, que brilha para os seres humanos, nasce e se põe?”


    O Salvador respondeu: “Ó bendito Tomé, esta luz visível certamente brilha para vocês, não para que permaneçam aqui, mas para que possam partir. E, quando todos os escolhidos abandonarem a condição animal,[e] esta luz subirá de volta à sua essência e saudará [a luz], pois é uma boa serva.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Altura” e “Plenitude” podem funcionar aqui como termos cosmológicos para realidades do âmbito invisível. Também seria possível traduzir de modo menos técnico: “a altura sublime e a plenitude”.'
    reason: Preservar o possível sentido técnico sem impor ao leitor uma reconstrução doutrinária.
  - marker: b
    text: Este trecho está muito danificado. Os colchetes indicam restaurações editoriais ou lacunas, e as reticências indicam texto perdido. Os colchetes vazios reproduzem uma lacuna não restaurada no testemunho usado.
    reason: Tornar transparente a incerteza textual e impedir que a tradução aparente maior segurança do que a fonte permite.
  - marker: c
    text: O testemunho traz literalmente a ideia de a luz “encobrir” ou “velar” as trevas. O sentido provável é que a luz as suplanta, mas a imagem incomum foi preservada.
    reason: Evitar substituir silenciosamente a formulação difícil por ‘dissipar’ ou ‘afastar’.
  - marker: d
    text: A frase também pode ser entendida como “a essência da luz é luz”. Sua formulação intencionalmente enigmática foi mantida.
    reason: Registrar a ambiguidade lexical de ‘natureza/essência’ sem expandir o dito.
  - marker: e
    text: “Condição animal” pode abranger a existência corpórea, mortal e gerada à maneira dos animais. O texto não define aqui com precisão todos os aspectos da expressão.
    reason: Preservar a amplitude antropológica e evitar uma interpretação denominacional.
lexical_decisions:
- source_word: concealed things
  choice: coisas ocultas
  rationale: Mantém a recorrência conceitual entre o que está oculto e o contraste entre visível e invisível, em linguagem portuguesa natural.
- source_word: do the truth / works of truth
  choice: praticar a verdade / realizar as obras da verdade
  rationale: ‘Praticar a verdade’ comunica o caráter ativo da expressão sem tornar a primeira frase artificial; na segunda ocorrência, ‘obras da verdade’ preserva a formulação substantiva do testemunho.
- source_word: lofty height
  choice: Altura
  rationale: Preserva a provável função cosmológica do termo e evita reduzi-lo a mera excelência moral. A nota registra a possibilidade de uma tradução mais descritiva.
- source_word: Fullness
  choice: Plenitude
  rationale: Conserva o termo técnico cosmológico sem impor a transliteração ‘Pleroma’, menos acessível ao leitor comum.
- source_word: workers
  choice: trabalhadores
  rationale: Reproduz a metáfora laboral e as aspas do testemunho, sem especificar uma função religiosa.
- source_word: students
  choice: aprendizes
  rationale: Soa mais natural no contexto de progresso rumo à maturidade e à perfeição do que ‘estudantes’, sem acrescentar uma relação institucional.
- source_word: animal body / animal state
  choice: corpo animal / condição animal
  rationale: Mantém a terminologia antropológica do testemunho e sua tensão própria, sem reinterpretá-la como simples pecaminosidade ou materialidade.
- source_word: intercourse
  choice: relação sexual
  rationale: Expressão moderna, clara e digna para a geração corpórea descrita no texto.
- source_word: infants
  choice: crianças
  rationale: Preserva o contraste com a maturidade sem exigir que se trate literalmente de bebês.
- source_word: rise and set
  choice: nasce e se põe
  rationale: Emprega a formulação portuguesa corrente para o movimento aparente da luz celeste.
- source_word: essence
  choice: essência
  rationale: Mantém a linguagem ontológica do testemunho e evita explicá-la além da evidência disponível.
theological_decisions:
- issue: Altura e Plenitude como linguagem cosmológica
  choice: Uso de iniciais maiúsculas em ‘Altura’ e ‘Plenitude’.
  alternative: ‘altura sublime e plenitude’, em minúsculas.
  rationale: O contexto associa os termos às realidades invisíveis e sugere categorias cosmológicas. As maiúsculas sinalizam possível uso técnico, sem definir um sistema doutrinário.
- issue: Destino dos corpos e das formas corporais
  choice: Conservar a afirmação direta de que se deterioram e perecem.
  alternative: Parafrasear como uma condenação moral da carne ou como negação explícita da ressurreição.
  rationale: A passagem deve manter sua tensão antropológica própria; explicações confessionais ou sistemáticas iriam além do testemunho fornecido.
- issue: ‘Condição animal’
  choice: Manter a expressão ampla e sem explicação doutrinária no corpo do texto.
  alternative: Traduzir como ‘natureza carnal’, ‘estado pecaminoso’ ou ‘existência física’.
  rationale: Essas alternativas resolveriam indevidamente a ambiguidade entre corporalidade, mortalidade, modo de geração e condição existencial.
- issue: Relação entre a luz visível, sua essência e ‘a luz’
  choice: 'Preservar a referência parcialmente ambígua: ‘subirá de volta à sua essência e saudará [a luz]’.'
  alternative: Identificar explicitamente a luz visível com uma luz divina ou celeste específica.
  rationale: O testemunho não permite determinar com segurança todos os referentes, e o trecho contém sinais editoriais e provável dano manuscrito.
- issue: ‘A natureza da luz é luz’
  choice: Tradução formal e concisa.
  alternative: ‘A luz procede da luz’ ou ‘a essência da luz é luminosa’.
  rationale: A sentença é enigmática; desenvolvê-la resolveria uma ambiguidade que deve permanecer.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formas amplamente compreensíveis internacionalmente. Empregou-se ‘vocês’ nos discursos dirigidos ao grupo e ‘tu’ quando Tomé se dirige diretamente ao Senhor, acompanhando a alternância de número. Os sinais de dano textual, restauração e lacuna foram preservados. Como a revisão direta do copta ainda está pendente, esta é uma tradução provisória fundamentada no testemunho inglês público fornecido, usado de modo transparente e conservador.
