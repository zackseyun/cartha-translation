translation:
  language: pt
  text: 'Então o Salvador continuou: “Ó insondável amor da luz! Ó amargura do fogo que arde nos corpos e na medula dos seres humanos, que neles se inflama noite e dia, que queima seus membros e [faz] sua mente ficar embriagada e sua alma enlouquecer [...] neles, tanto nos homens como nas mulheres [...] noite, e eles fazem movimentos [...] às escondidas e à vista de todos, pois os homens [fazem movimentos [...] sobre as mulheres], e as mulheres sobre [os homens]. [Por isso, está] [] escrito: ‘Todos os que buscam a verdade proveniente da verdadeira sabedoria criarão asas para voar, escapando do desejo que queima os espíritos humanos, e criarão asas para escapar de todo espírito (mau) que virem.’”[a]


    Tomé respondeu: “Senhor, é justamente sobre isso que lhe pergunto, pois compreendi que, como o senhor diz, é nosso benfeitor.”


    O Salvador respondeu novamente: “É por isso que devemos falar com você, pois este é o ensinamento para os maduros. Se agora você quiser tornar-se maduro, cumprirá estas coisas. Se não, seu nome será ‘Ignorante’, pois quem tem entendimento não pode viver com um insensato, visto que aquele que tem entendimento é maduro em toda sabedoria. De fato, quem é sábio será nutrido pela verdade e ‘será como uma árvore que cresce junto ao riacho sinuoso’ (Salmo 1:3).[b] Para o insensato, porém, o bem e o mal são a mesma coisa, pois, embora alguns tenham asas, ainda assim correm atrás das coisas visíveis, que estão distantes da verdade. Isso acontece porque o fogo que os guia cria para eles uma ilusão de verdade, [e] os ilumina com uma beleza [perecível], encerra-os numa doce escuridão e os encanta com um prazer aromático.


    “Ele os cegará com um desejo insaciável, queimará suas almas e se tornará para eles como uma estaca cravada no coração, que jamais conseguirão arrancar. E, conforme quer, conduz todos de um lado para outro como um freio na boca. Com a amargura do cativeiro do desejo pelas coisas visíveis — que por impulso se degeneram, mudam e se desviam —, ele os prendeu com suas correntes e acorrentou cada um de seus membros. Eles são continuamente arrastados para baixo. Quando são mortos, são devorados por todos os animais do domínio perecível.”


    Tomé respondeu: “Está claro, assim como foi dito: [‘Muitos são [...] os que não conhecem] [...] alma.’”[c]


    E [o Salvador] respondeu: “[Feliz é] aquele que é sábio, que [buscou a verdade e], ao encontrá-la, [] repousou nela para sempre e não teve medo dos que procuravam perturbá-lo.”


    Tomé respondeu: “É bom para nós, Senhor, repousar entre as coisas que nos pertencem?”


    O Salvador disse: “Sim, isso é proveitoso e bom para vocês, porque as coisas visíveis entre os seres humanos desaparecerão, pois seu recipiente carnal desaparecerá; e, quando for reduzido a nada, passará a existir entre as coisas visíveis, entre as coisas que podem ser vistas.[d] Então o fogo que veem lhes causará dor por causa de seu antigo amor pela fé.[e] Eles serão novamente reunidos ao que é visível. Além disso, aqueles que conseguem ver entre as coisas invisíveis, mas não possuem o maior amor, perecerão em sua preocupação com esta vida e no ardor do fogo. Depois de pouco tempo, o que é visível desaparecerá. Então surgirão sombras sem forma, e entre os túmulos elas permanecerão para sempre sobre os cadáveres, sofrendo, enquanto sua alma se decompõe.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes, as reticências e os parênteses nesta passagem reproduzem lacunas, restaurações propostas e qualificações da testemunha inglesa; o texto copta ainda requer revisão direta.
    reason: Distinguir material preservado, perdido ou editorialmente reconstruído.
  - marker: b
    text: Alusão a Salmo 1:3. A forma “riacho sinuoso” segue a testemunha fornecida e difere da redação comum do salmo nas Bíblias portuguesas.
    reason: Identificar a citação sem harmonizá-la silenciosamente com uma versão bíblica posterior.
  - marker: c
    text: A citação está gravemente fragmentada, e sua fonte não pode ser identificada com segurança a partir da testemunha fornecida.
    reason: Preservar a incerteza textual.
  - marker: d
    text: 'A sequência parece paradoxal: o recipiente carnal desaparece, mas passa a existir entre as coisas visíveis. A tradução conserva a formulação da testemunha sem tentar corrigi-la.'
    reason: Evitar uma emenda conjectural antes da revisão do copta.
  - marker: e
    text: “Amor pela fé” é a leitura da testemunha inglesa, embora o sentido no contexto seja incerto e possa depender do estado do manuscrito ou da tradução do copta.
    reason: Assinalar uma expressão semanticamente e teologicamente difícil sem resolvê-la por conjectura.
lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Mantém o título recorrente da testemunha e seu valor religioso sem acrescentar identificação não expressa.
- source_word: lust
  choice: desejo
  rationale: O contexto indica desejo abrasador e desordenado; “desejo” preserva maior amplitude sem impor exclusivamente uma leitura sexual em todas as ocorrências.
- source_word: mature
  choice: maduros
  rationale: Preserva a oposição conceitual entre maturidade sapiencial e insensatez.
- source_word: Ignoramus
  choice: Ignorante
  rationale: Reproduz o nome depreciativo de modo natural e inteligível em português atual.
- source_word: reposed
  choice: repousou
  rationale: Mantém a imagem de encontrar descanso ou estabilidade na verdade, sem convertê-la em mera compreensão intelectual.
- source_word: fleshly vessel
  choice: recipiente carnal
  rationale: Conserva a metáfora corporal e sua estranheza deliberada.
- source_word: perishable realm
  choice: domínio perecível
  rationale: Expressa uma esfera sujeita à corrupção sem introduzir terminologia cosmológica denominacional.
theological_decisions:
- issue: Identidade e função do fogo
  choice: Manter “fogo” como agente imagético sem explicar sua natureza
  alternative: Identificá-lo explicitamente com paixão sexual, punição ou poder demoníaco
  rationale: A passagem associa o fogo ao desejo, à ilusão e ao sofrimento, mas não resolve de maneira uniforme sua natureza.
- issue: Alcance de “desejo”
  choice: Usar termo amplo, deixando o contexto corporal e sexual orientar a leitura
  alternative: Traduzir sistematicamente por “luxúria”
  rationale: A primeira cena tem conteúdo sexual, mas as ocorrências posteriores abrangem apego às coisas visíveis.
- issue: “Amor pela fé” no trecho final
  choice: Preservar literalmente a leitura testemunhada e sinalizar sua dificuldade em nota
  alternative: Emendar para “amor anterior” ou “falta de fé”
  rationale: A formulação é teologicamente tensa e possivelmente textual; não deve ser harmonizada sem revisão copta.
- issue: Destino pós-morte e imagens cosmológicas
  choice: Conservar as imagens de descida, animais, sombras, túmulos e decomposição
  alternative: Parafraseá-las como inferno, condenação ou aniquilação
  rationale: Essas identificações excederiam a evidência da testemunha e eliminariam sua ambiguidade cosmológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação é provisória porque foi elaborada a partir da testemunha inglesa de domínio público; preserva colchetes, lacunas, imagens abruptas e tensões conceituais até que seja possível conferir diretamente o copta do Códice de Nag Hammadi II,7.
