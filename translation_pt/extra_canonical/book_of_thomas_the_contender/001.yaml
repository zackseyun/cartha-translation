    reason: Tornar explícito ao leitor o valor editorial do sinal inicial sem reconstruir palavras não preservadas.
  - marker: b
    text: O testemunho inglês fornecido traz “Mathaias”; “Matias” é a forma portuguesa adotada aqui. A grafia e a forma do nome deverão ser verificadas diretamente no copta.
    reason: Registrar a normalização provisória do nome próprio enquanto a revisão na língua-fonte está pendente.
  revision_rationale: A revisão substitui a coordenação «e os ouvia» por «ouvindo-os», para reproduzir de forma mais natural e próxima ao testemunho a circunstância de Mathaias ouvir a conversa enquanto caminhava e registrava os ditos. Não altera o conteúdo nem resolve questões onomásticas ou textuais pendentes.
