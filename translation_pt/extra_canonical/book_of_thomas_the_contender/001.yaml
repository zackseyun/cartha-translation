review_pass:
  verdict: revise
  source_fidelity: A versão preserva adequadamente a lacuna inicial, o título «o Salvador», o nome composto «Judas Tomé», a ênfase autobiográfica («eu — sim, eu») e o caráter recíproco da fala. Contudo, «os ouvia conversar» pode ter como antecedente gramatical imediato «ditos», produzindo em português a leitura imprópria de que os ditos conversavam. Além disso, diante da revisão copta ainda pendente, é mais fiel conservar no texto a forma atestada no testemunho de partida, «Mathaias», em vez de normalizá-la para «Matias».
  naturalness: '«Ditos secretos» e «enquanto caminhava» são naturais e adequados ao registro. A reformulação para «ouvindo os dois conversarem entre si» elimina a ambiguidade pronominal sem introduzir conteúdo: os dois referentes já apresentados são o Salvador e Judas Tomé.'
  terminology: «Salvador» e «ditos secretos» são escolhas diretas e apropriadas. «Mathaias» deve ser mantido provisoriamente como nome próprio transmitido pelo testemunho, sem equipará-lo antecipadamente a «Matias».
  issues:
  - severity: medium
    issue: Antecedente ambíguo em «os ouvia conversar entre si»
    rationale: O pronome «os» pode retomar gramaticalmente «ditos secretos», o que torna a frase semanticamente inadequada. «Os dois» identifica de modo natural os dois interlocutores já nomeados.
  - severity: low
    issue: Normalização prematura de «Mathaias» para «Matias»
    rationale: O testemunho-base traz «Mathaias» e a conferência direta do copta está pendente. Conservar a forma transmitida evita uma identificação onomástica que ainda não foi verificada.
  revised_text: '[…][a] Os ditos secretos que o Salvador falou a Judas Tomé e que eu — sim, eu, Mathaias[b] — pus por escrito enquanto caminhava, ouvindo os dois conversarem entre si.'
  revised_footnotes:
  - marker: a
    text: O sinal de reticência entre colchetes representa uma lacuna ou trecho ausente no início do testemunho fornecido.
    reason: Tornar explícito ao leitor o valor editorial do sinal inicial sem reconstruir palavras não preservadas.
  - marker: b
    text: O testemunho inglês fornecido traz “Mathaias”. A forma do nome deverá ser verificada diretamente no copta antes de qualquer normalização para uma forma portuguesa.
    reason: Preservar provisoriamente a forma onomástica do testemunho de partida, pois a revisão na língua-fonte está pendente.
  revision_rationale: A revisão elimina uma ambiguidade sintática em português, torna «wrote down» mais explicitamente escrito por «pus por escrito» e conserva provisoriamente a forma do nome dada pelo testemunho. A lacuna inicial e os respectivos apoios de nota permanecem preservados.
