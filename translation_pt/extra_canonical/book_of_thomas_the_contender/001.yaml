  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/001.yaml
  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: pt
  text: '[…][a] Os ditos secretos que o Salvador falou a Judas Tomé e que eu — sim, eu, Matias[b] — anotei enquanto caminhava e os ouvia conversar entre si.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sinal de reticência entre colchetes representa uma lacuna ou trecho ausente no início do testemunho fornecido.
    reason: Tornar explícito ao leitor o valor editorial do sinal inicial sem reconstruir palavras não preservadas.
  - marker: b
    text: O testemunho inglês fornecido traz “Mathaias”; “Matias” é a forma portuguesa adotada aqui. A grafia e a forma do nome deverão ser verificadas diretamente no copta.
    reason: Registrar a normalização provisória do nome próprio enquanto a revisão na língua-fonte está pendente.
lexical_decisions:
- source_word: secret sayings
  choice: ditos secretos
  rationale: “Ditos” expressa de modo natural uma coleção de pronunciamentos ou ensinamentos breves, sem ampliar o sentido para “palavras” em geral.
- source_word: Savior
  choice: Salvador
  rationale: Equivalente português direto, corrente e digno, preservando o título do testemunho.
- source_word: Judas Thomas
  choice: Judas Tomé
  rationale: Mantém os dois elementos do nome conforme o testemunho, usando a forma portuguesa tradicional de Thomas.
- source_word: wrote down
  choice: anotei
  rationale: Comunica o ato de registrar por escrito aquilo que foi ouvido, com naturalidade em português.
- source_word: speak with one another
  choice: conversar entre si
  rationale: Preserva a reciprocidade e indica diálogo sem especificar o conteúdo ou a forma da conversa.
theological_decisions:
- issue: Identidade e função de “Judas Tomé”
  choice: Manter “Judas Tomé” sem explicação no corpo do texto
  alternative: Traduzir ou explicar “Tomé” como “Gêmeo”
  rationale: O testemunho fornecido apresenta Thomas como parte do nome; explicitar “Gêmeo” exigiria confirmação direta do copta e poderia resolver indevidamente uma questão onomástica e interpretativa.
- issue: Identidade do Salvador
  choice: Conservar apenas o título “o Salvador”
  alternative: Identificá-lo explicitamente como Jesus
  rationale: O incipit fornecido usa o título sem nome próprio; a tradução não deve acrescentar uma identificação que o texto não formula neste ponto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A ênfase incomum do narrador foi preservada em “eu — sim, eu, Matias —”. A redação é provisória, baseada no testemunho inglês de domínio público fornecido; a conferência direta do copta do Códice II,7 de Nag Hammadi continua pendente.
