base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: pt
  text: 'O Salvador disse: “Irmão Tomé, escute-me enquanto ainda lhe resta tempo neste mundo, e eu lhe revelarei as coisas sobre as quais você tem refletido em sua mente.


    “Visto que se diz que você é meu gêmeo e verdadeiro amigo, examine a si mesmo e descubra quem você é, de que modo existe e como será no futuro. Uma vez que você será chamado ‘meu irmão’, não convém que ignore a si mesmo. Contudo, sei que você compreendeu a si mesmo, pois já compreendeu que eu sou o verdadeiro conhecimento. Assim, mesmo que você não compreenda, ao estar de acordo comigo,[a] já alcançou o conhecimento e, por isso, será chamado ‘aquele que conhece a si mesmo’. Pois quem não conhece a si mesmo nada sabe; mas quem conhece a si mesmo, juntamente com isso, já obteve profundo conhecimento de todas as coisas. Portanto, meu irmão Tomé, você contemplou aquilo que está oculto aos seres humanos, isto é, aquilo em que eles tropeçam por ignorarem a si mesmos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “ao estar de acordo comigo” também pode sugerir concordar, corresponder ou unir-se ao Salvador. A revisão direta do copta ainda está pendente.
    reason: A testemunha inglesa sinaliza aqui uma nota e emprega um verbo semanticamente amplo; a nota preserva a incerteza sem escolher uma leitura doutrinária.
lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Mantém o título cristológico tradicional em linguagem clara e corrente.
- source_word: Brother Thomas
  choice: Irmão Tomé
  rationale: Emprega a forma portuguesa tradicional do nome e preserva o tratamento relacional.
- source_word: heed me
  choice: escute-me
  rationale: Expressa atenção obediente de modo natural, sem tornar o tom excessivamente arcaico.
- source_word: study yourself
  choice: examine a si mesmo
  rationale: Preserva o sentido de investigação reflexiva, central à passagem, em português idiomático.
- source_word: the mode in which you are
  choice: de que modo existe
  rationale: Mantém a formulação ontológica incomum sem a reduzir simplesmente a como a pessoa vive ou se encontra.
- source_word: true knowledge
  choice: o verdadeiro conhecimento
  rationale: Conserva a identificação enfática do Salvador com o conhecimento, sem explicar sua natureza teológica.
- source_word: self-knowledge
  choice: conhece a si mesmo
  rationale: Prefere uma construção verbal natural no título e nas sentenças paralelas, preservando o tema do autoconhecimento.
- source_word: gazed on
  choice: contemplou
  rationale: Retém a ideia de percepção atenta ou visão profunda, mais forte que apenas ver.
theological_decisions:
- issue: Identificação do Salvador com o conhecimento
  choice: “eu sou o verdadeiro conhecimento”
  alternative: “eu possuo o verdadeiro conhecimento”
  rationale: A testemunha apresenta uma identificação direta, não mera posse; a tradução preserva essa tensão teológica.
- issue: Paradoxo entre não compreender e já alcançar conhecimento
  choice: preservar “mesmo que você não compreenda... já alcançou o conhecimento”
  alternative: harmonizar como compreensão parcial ou futura
  rationale: O texto contém uma tensão genuína, que não deve ser resolvida por interpretação acrescentada.
- issue: Alcance do conhecimento derivado do autoconhecimento
  choice: “profundo conhecimento de todas as coisas”
  alternative: “compreensão geral de tudo”
  rationale: Mantém a afirmação abrangente da testemunha, sem restringi-la segundo pressupostos doutrinários externos.
- issue: Sentido de “meu gêmeo”
  choice: tradução literal, sem explicação no corpo do texto
  alternative: interpretar como gêmeo espiritual ou título simbólico
  rationale: A natureza da relação permanece aberta na passagem e não deve ser determinada sem revisão copta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservam-se as formulações ontológicas e os paradoxos do texto. Esta versão é necessariamente provisória, pois foi elaborada a partir da testemunha inglesa pública fornecida; requer conferência direta com o copta do Códice II,7 de Nag Hammadi.
