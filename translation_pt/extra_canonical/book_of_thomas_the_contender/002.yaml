review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a progressão argumentativa, o paradoxo entre não compreender e já ter alcançado conhecimento, a autoidentificação do Salvador como “o verdadeiro conhecimento” e a linguagem de autoconhecimento. Contudo, “por ignorarem a si mesmos” interpreta e explicita além do que a testemunha inglesa mantém parentético em “in (self-)ignorance”; convém conservar essa ambiguidade no texto. “Visto que se diz” também atenua o perfeito passivo “it has been said”, que é melhor representado por “foi dito”.
  naturalness: 'O português é claro, digno e de leitura natural. Ajustes pontuais tornam a formulação mais direta: “se perguntou em seu íntimo” corresponde melhor a “wondered about in your mind”, e “de que modo você existe” evita elipse potencialmente áspera em “de que modo existe”.'
  terminology: “Salvador”, “Irmão Tomé”, “verdadeiro conhecimento”, “contemplo(u)” e a terminologia de conhecer a si mesmo são adequados. A designação “aquele que conhece a si mesmo” é uma solução natural para a expressão incomum “the one of self-knowledge”, sem impor interpretação técnica. A nota em [a] preserva adequadamente a incerteza do verbo assinalado pela testemunha inglesa.
  issues:
  - severity: medium
    issue: Explicitação interpretativa de “(self-)ignorance”
    rationale: “Por ignorarem a si mesmos” fixa como causal e plenamente explícita uma leitura que a testemunha marca como parentética e potencialmente ambígua. “Em sua ignorância (de si mesmos)” conserva a construção e a ressalva textual.
  - severity: low
    issue: Tempo/aspecto em “it has been said”
    rationale: “Foi dito que” reproduz mais proximamente a formulação passiva perfectiva da testemunha do que o presente impessoal “se diz”.
  - severity: low
    issue: Formulações levemente afastadas da testemunha
    rationale: “Se perguntou em seu íntimo” traduz mais precisamente o ato de indagar-se (“wondered about”) e sua localização mental; explicitar “você” em “de que modo você existe” melhora a clareza sem alterar o teor ontológico.
  revised_text: 'O Salvador disse: “Irmão Tomé, escute-me enquanto ainda lhe resta tempo neste mundo, e eu lhe revelarei as coisas sobre as quais você se perguntou em seu íntimo.


    “Visto que foi dito que você é meu gêmeo e verdadeiro amigo, examine a si mesmo e descubra quem você é, de que modo você existe e como será no futuro. Uma vez que você será chamado ‘meu irmão’, não convém que ignore a si mesmo. Contudo, sei que você compreendeu a si mesmo, pois já compreendeu que eu sou o verdadeiro conhecimento. Assim, mesmo que você não compreenda, ao estar de acordo comigo,[a] já alcançou o conhecimento e, por isso, será chamado ‘aquele que conhece a si mesmo’. Pois quem não conhece a si mesmo nada sabe; mas quem conhece a si mesmo, juntamente com isso, já obteve profundo conhecimento de todas as coisas. Portanto, meu irmão Tomé, você contemplou aquilo que está oculto aos seres humanos, isto é, aquilo em que eles tropeçam em sua ignorância (de si mesmos).”'
  revised_footnotes:
  - marker: a
    text: A expressão traduzida por “ao estar de acordo comigo” também pode sugerir concordar, corresponder ou unir-se ao Salvador. A revisão direta do copta ainda está pendente.
    reason: A testemunha inglesa sinaliza uma nota neste ponto e emprega um verbo semanticamente amplo; a nota preserva a incerteza sem escolher uma leitura doutrinária.
