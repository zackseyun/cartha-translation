review_pass:
  verdict: revise
  source_fidelity: 'A versão acompanha de perto a testemunha inglesa fornecida e preserva os temas de autoconhecimento, a identificação do Salvador com o «verdadeiro conhecimento» e o paradoxo entre não compreender e já ter alcançado conhecimento. Contudo, algumas explicitações eliminam marcas de incerteza da testemunha: os parênteses em «(a si mesmo)» e «(auto)ignorância» devem ser mantidos. A construção «de que modo existe» também perde o referente de segunda pessoa.'
  naturalness: 'O registro é claro e moderno. Ajustes pontuais melhoram a fluência e a precisão: «qual é seu modo de existir» é mais natural e gramaticalmente claro; «tem se perguntado» transmite melhor «have wondered about» do que «tem refletido»; e «concordar comigo» é uma formulação direta para a leitura principal, com a amplitude semântica resguardada em nota.'
  terminology: «Salvador», «Tomé», «verdadeiro conhecimento», «profundo conhecimento» e «contemplou» são escolhas adequadas. «Autoconhecimento» é usado na designação final para refletir concisamente «the one of self-knowledge», enquanto as frases explicativas mantêm «conhecer a si mesmo».
  issues:
  - severity: medium
    issue: As marcas parentéticas da testemunha foram suprimidas em dois pontos.
    rationale: «Compreendeu (a si mesmo)» e «(auto)ignorância» sinalizam material ou especificação incerta/explicativa na base inglesa. Sua omissão transforma uma formulação assinalada em afirmação sem ressalva.
  - severity: low
    issue: «de que modo existe» não explicita o sujeito e soa truncado após «você é».
    rationale: «Qual é seu modo de existir» preserva o teor ontológico incomum de «the mode in which you are» com maior clareza em português.
  - severity: low
    issue: «por ignorarem a si mesmos» interpreta e reformula «in (self-)ignorance».
    rationale: A formulação causal e verbal não preserva a ambiguidade nem a marca parentética da testemunha; «na (auto)ignorância deles» é mais próxima.
  revised_text: 'O Salvador disse: “Irmão Tomé, escute-me enquanto ainda lhe resta tempo neste mundo, e eu lhe revelarei as coisas sobre as quais você tem se perguntado em sua mente.


    “Visto que se diz que você é meu gêmeo e verdadeiro amigo, examine a si mesmo e descubra quem você é, qual é seu modo de existir e como será no futuro. Uma vez que você será chamado ‘meu irmão’, não convém que ignore a si mesmo. Contudo, sei que você compreendeu (a si mesmo), pois já compreendeu que eu sou o verdadeiro conhecimento. Assim, embora você não compreenda, ao concordar comigo,[a] já alcançou o conhecimento e, por isso, será chamado ‘aquele do autoconhecimento’. Pois quem não tem conhecimento de si mesmo nada sabe; mas quem conhece a si mesmo já obteve, juntamente com isso, profundo conhecimento de todas as coisas. Portanto, meu irmão Tomé, você contemplou aquilo que está oculto aos seres humanos, isto é, aquilo em que eles tropeçam na (auto)ignorância deles.”'
  revised_footnotes:
  - marker: a
    text: A expressão traduzida por “ao concordar comigo” também pode sugerir corresponder ou unir-se ao Salvador. A revisão direta do copta ainda está pendente.
    reason: A testemunha inglesa assinala uma nota neste ponto e emprega um verbo de alcance semântico amplo; a nota preserva a incerteza sem impor uma leitura doutrinária.
  revision_rationale: A revisão conserva o sentido e a tensão da testemunha inglesa, corrige a construção ontológica para português claro e restaura as marcas parentéticas que impedem explicitações indevidas. A revisão direta do copta permanece necessária para confirmar as nuances do texto subjacente e da nota assinalada.
