translation:
  language: pt
  text: 'O Salvador prosseguiu: “Ai de vocês, os ímpios, que não têm esperança e esperam aquilo que não acontecerá! Ai de vocês, cuja esperança está na carne, na prisão destinada a perecer! Até quando continuarão esquecidos? E até quando suporão que as coisas imperecíveis também perecerão? A esperança de vocês está posta no mundo, e o deus de vocês é esta vida! Vocês estão destruindo a si mesmos!


    Ai de vocês por causa do fogo que os queima por dentro, pois ele não pode ser apagado! Ai de vocês por causa da roda que gira na mente de vocês! Ai de vocês, presos nas garras do ardor que habita dentro de vocês, pois ele consumirá visivelmente a carne de vocês, dilacerará invisivelmente suas almas e os preparará para se juntarem aos seus amigos! Ai de vocês, prisioneiros, pois estão acorrentados em cavernas!


    “Vocês zombam e sorriem com um riso insano! Não percebem sua condenação, não refletem sobre sua condição e [não] compreenderam que vivem nas trevas e na [morte]! Em vez disso, estão embriagados de fogo e [cheios] de amargura. A mente de vocês enlouqueceu por causa do [ardor que está dentro] de vocês, e o veneno e os ataques de seus inimigos lhes parecem doces! A escuridão surgiu para vocês como se fosse luz, porque trocaram sua liberdade pela escravidão! Tornaram seus corações sombrios, entregaram seus pensamentos à insensatez e encheram seus pensamentos com a fumaça de fogo que há dentro de vocês! E sua luz [foi encoberta] pela nuvem [de…], e as roupas que os cobrem, vocês […]. E [vocês] foram capturados por uma [esperança] vazia. E em quem [vocês] acreditaram? [Não compreendem que] todos [vocês] vivem entre aqueles que […] vocês como se [vocês…].


    […] Vocês mergulharam nas águas da escuridão! Agiram segundo seus próprios impulsos! Ai de vocês, que vivem no erro e desprezam a luz do sol, que julga o mundo e olha para ele do alto, e que cercará todas as coisas a fim de escravizar os inimigos. Também não percebem a lua, que, de noite e de dia, olha do alto e contempla os cadáveres resultantes da matança de vocês! Ai de vocês, que gostam de estar próximos das mulheres e de manter relações impuras com elas! Ai de vocês, presos nas garras das forças do próprio corpo, pois elas os atormentarão! Ai de vocês, presos nas garras das forças dos demônios malignos! Ai de vocês, que atraem seus membros com fogo!


    “Quem fará cair sobre vocês uma chuva de orvalho fresco para apagar a nuvem de fogo que os envolve juntamente com o ardor de vocês? Quem fará o sol brilhar sobre vocês, para dissipar a escuridão que há dentro de vocês e ocultar a escuridão e a água impura? O sol e a lua, juntamente com o ar, o vento, a terra e a água, darão a vocês um aroma agradável, pois, se o sol não brilhar sobre esses corpos, eles murcharão e perecerão, exatamente como as ervas daninhas e a relva. Se o sol brilhar sobre elas, elas se espalharão e sufocarão a videira. Se, porém, a videira se espalhar, der sombra a todas as ervas daninhas e aos outros arbustos que crescem ao lado delas, [estender-se] e aumentar, somente ela receberá a terra onde cresce e dominará todo lugar que tiver coberto com sua sombra. Quando amadurecer, dominará toda a terra e produzirá com abundância para seu senhor. Ela lhe agradará ainda mais, porque ele terá evitado o grande trabalho de arrancar essas plantas. Em vez disso, a própria videira
    acabou com elas, chegando a sufocá-las; elas morreram e ficaram tão mortas quanto o solo.”


    Jesus prosseguiu: “Ai de vocês, porque não aceitaram o ensinamento, e aqueles que […] trabalharão na pregação […]. E [vocês] estão correndo para […] fará [com que eles] desçam […] durante o dia vocês os matam […] para que pudessem ressurgir da morte.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês público fornecido; a revisão direta do copta ainda está pendente. Colchetes e reticências indicam lacunas, danos ou restaurações editoriais. A sintaxe fragmentária do último parágrafo foi preservada sem reconstrução conjectural.
    reason: O testemunho-base declara que a revisão da língua-fonte está pendente, e o trecho final contém extensas lacunas manuscritas.
lexical_decisions:
- source_word: godless
  choice: ímpios
  rationale: Termo português natural e digno para a falta de reverência ou oposição a Deus; evita o sentido moderno mais estritamente filosófico de “ateus”.
- source_word: flesh
  choice: carne
  rationale: Preserva a linguagem antropológica e a tensão do testemunho, sem interpretar “carne” simplesmente como corpo ou pecado.
- source_word: imperishable things
  choice: coisas imperecíveis
  rationale: Mantém a oposição conceitual explícita entre o perecível e o imperecível.
- source_word: scorching
  choice: ardor
  rationale: Expressa calor intenso e abrasador com fluidez, distinguindo-o do “fogo” mencionado no mesmo contexto.
- source_word: gloom
  choice: escuridão
  rationale: Escolha corrente e compreensível que preserva a imagem de obscuridade espiritual e física.
- source_word: bodily powers
  choice: forças do próprio corpo
  rationale: Conserva a formulação incomum sem decidir se se trata de paixões, membros ou potências cosmológicas.
- source_word: grapevine
  choice: videira
  rationale: Equivalente tradicional e natural que preserva a imagem agrícola.
- source_word: master
  choice: senhor
  rationale: Mantém a relação entre a videira e seu proprietário, sem identificar explicitamente a figura com Deus.
theological_decisions:
- issue: Identidade do “deus” dos destinatários
  choice: “o deus de vocês é esta vida”
  alternative: “esta vida é o Deus de vocês”
  rationale: Preserva a acusação metafórica do testemunho sem transformar “deus” em nome próprio nem suavizar sua força.
- issue: Linguagem negativa sobre carne e corpo
  choice: manter “carne”, “prisão” e “forças do próprio corpo”
  alternative: reinterpretar como “natureza pecaminosa”, “corpo mortal” ou “desejos carnais”
  rationale: Evita impor uma antropologia denominacional ou harmonizar a tensão ascética do texto.
- issue: Sol e lua personificados
  choice: preservar ações de julgar, olhar e contemplar
  alternative: tratar tudo explicitamente como metáfora
  rationale: A personificação pertence à retórica do testemunho e sua natureza exata permanece ambígua.
- issue: Referência às mulheres e às relações impuras
  choice: traduzir diretamente sem ampliar nem justificar a condenação
  alternative: generalizar para toda imoralidade sexual ou restringir a uma prática específica
  rationale: Mantém o alcance do testemunho sem importar uma doutrina sexual mais abrangente.
- issue: “Amigos” aos quais os condenados se juntarão
  choice: manter “seus amigos”
  alternative: identificá-los como demônios, outros condenados ou paixões
  rationale: O referente não é definido no testemunho fornecido.
- issue: Ressurreição no trecho final danificado
  choice: “ressurgir da morte”
  alternative: “ressuscitar dentre os mortos”
  rationale: Preserva a formulação do testemunho e evita reconstruir uma sintaxe ou doutrina mais precisa onde o manuscrito está lacunoso.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Empregou-se “vocês” para o plural e paralelismo enfático nos oráculos de “Ai de vocês”. As imagens ásperas e a sintaxe incompleta nas passagens danificadas foram preservadas; não se tentou harmonizar a antropologia ascética nem esclarecer referentes incertos.
