base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: pt
  text: 'Assim, os intérpretes mais antigos das igrejas — refiro-me a Fílon, o filósofo e contemporâneo dos apóstolos, ao célebre Papias de Hierápolis, discípulo de João, o Evangelista... e aos seus companheiros — interpretavam espiritualmente as declarações acerca do Paraíso e as relacionavam com a Igreja de Cristo.[a]


    — ANASTÁSIO DO SINAI, Contempl. Anagog. in Hexaém. VII'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; ainda é necessária a revisão direta do texto na língua antiga. As reticências pertencem ao testemunho consultado.
    reason: A fonte fornecida informa que a revisão do grego/latim está pendente; a nota torna transparente a base textual e preserva a incerteza documental.
lexical_decisions:
- source_word: expositors
  choice: intérpretes
  rationale: Expressa de modo natural a função de explicar textos ou ensinamentos, sem restringi-la à atividade moderna de comentarista.
- source_word: sayings about Paradise
  choice: declarações acerca do Paraíso
  rationale: Mantém a referência ampla a enunciados sobre o Paraíso, sem especificar indevidamente se são palavras bíblicas, tradições ou interpretações.
- source_word: spiritually
  choice: espiritualmente
  rationale: Preserva a formulação e a possível amplitude hermenêutica do testemunho, sem substituí-la por termos mais específicos como «alegoricamente».
- source_word: referred them to
  choice: as relacionavam com
  rationale: Reproduz a ideia de fazer referência ou aplicar as declarações à Igreja, sem afirmar uma identificação completa que o testemunho inglês não exige.
- source_word: Church of Christ
  choice: Igreja de Cristo
  rationale: Tradução direta, tradicional e não denominacional da expressão.
theological_decisions:
- issue: Natureza da interpretação do Paraíso
  choice: «interpretavam espiritualmente» e «as relacionavam com a Igreja de Cristo»
  alternative: «interpretavam alegoricamente» e «as aplicavam à Igreja de Cristo»
  rationale: A redação escolhida conserva a distinção entre interpretação espiritual e referência eclesial, evitando definir com maior precisão um método hermenêutico que o testemunho não explicita.
- issue: Identificação de João
  choice: «João, o Evangelista»
  alternative: «o evangelista João» ou simplesmente «João»
  rationale: Mantém o título presente no testemunho e não tenta resolver questões históricas sobre a identidade do João associado a Papias.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi reorganizada com travessões para tornar clara a longa enumeração. O título bibliográfico latino foi mantido conforme o testemunho, e «VII» foi normalizado em maiúsculas. Não se corrigiram nem se harmonizaram as afirmações históricas do fragmento.
