review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a enumeração, a designação de Papias como discípulo de João, o Evangelista, a elipse documental e a dupla afirmação de interpretação espiritual e referência eclesial. Contudo, o imperfeito «interpretavam ... relacionavam» enfraquece o aoristo/narrativa pontual refletido pelo pretérito inglês «interpreted ... referred». «Aplicaram ... à Igreja de Cristo» transmite com mais precisão e naturalidade o sentido de «referred them to». Como a base disponibilizada é um testemunho inglês e a revisão direta do grego/latim está pendente, as formulações históricas devem permanecer sem harmonização ou inferências adicionais.
  naturalness: O português é claro e de registro adequado. A alteração para o pretérito perfeito torna a frase narrativa mais direta; «ditos acerca do Paraíso» é mais idiomático e mais próximo de «sayings» do que «declarações».
  terminology: «Fílon», «Papias de Hierápolis», «João, o Evangelista», «Paraíso» e «Igreja de Cristo» são apropriados. «Espiritualmente» preserva a amplitude do testemunho e não impõe «alegoricamente». O título latino da obra é mantido como referência bibliográfica.
  issues:
  - severity: low
    issue: Aspecto verbal narrativo
    rationale: «Interpretavam ... relacionavam» sugere atividade habitual ou em curso, enquanto o testemunho apresenta uma afirmação narrativa pontual. «Interpretaram ... aplicaram» é mais fiel sem alterar o conteúdo.
  - severity: low
    issue: Formulação de «sayings» e «referred them to»
    rationale: «Ditos acerca do Paraíso» corresponde mais diretamente a «sayings», e «aplicaram-nos à Igreja de Cristo» comunica de modo natural o direcionamento hermenêutico expresso por «referred them to».
  revised_text: 'Assim, os intérpretes mais antigos das igrejas — refiro-me a Fílon, o filósofo e contemporâneo dos apóstolos, ao célebre Papias de Hierápolis, discípulo de João, o Evangelista... e aos seus companheiros — interpretaram espiritualmente os ditos acerca do Paraíso e aplicaram-nos à Igreja de Cristo.[a]


    — ANASTÁSIO DO SINAI, Contempl. Anagog. in Hexaém. VII'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; ainda é necessária a revisão direta do texto na língua antiga. As reticências pertencem ao testemunho consultado.
    reason: A fonte fornecida informa que a revisão do grego/latim está pendente; a nota torna transparente a base textual e preserva a incerteza documental.
  revision_rationale: Foram feitas apenas correções seguras de aspecto verbal e de idiomaticidade para refletir mais de perto o testemunho inglês. Mantiveram-se a elipse, a atribuição histórica, a identificação de João e a ambiguidade do método espiritual, sem antecipar uma revisão direta das línguas antigas.
