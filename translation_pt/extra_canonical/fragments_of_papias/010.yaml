review_pass:
  verdict: revise
  source_fidelity: A redação acompanha de modo geral o testemunho inglês fornecido e preserva corretamente as reticências e a atribuição. Contudo, o imperfeito «interpretavam ... relacionavam» não reproduz o aoristo/narrativa concluída do testemunho («interpreted ... referred»). Além disso, «as relacionavam com» atenua a construção «referred them to», cujo sentido contextual é de aplicação ou referência à Igreja de Cristo.
  naturalness: O português é claro, atual e de registro adequado. A enumeração entre travessões funciona bem. «Dit os» é mais conciso e idiomático neste contexto do que «declarações», sem estreitar o referente. «Aplicaram-nos à Igreja» exprime naturalmente a relação interpretativa indicada.
  terminology: «Fílon», «Papias de Hierápolis», «João, o Evangelista», «Paraíso» e «Igreja de Cristo» são escolhas adequadas. Mantém-se «espiritualmente», sem impor «alegoricamente» ou outra classificação hermenêutica. O título latino e a referência bibliográfica são preservados como constam do testemunho.
  issues:
  - severity: medium
    issue: Tempo verbal não correspondente ao testemunho
    rationale: O testemunho fornecido usa verbos no passado pontual («interpreted», «referred»); «interpretavam» e «relacionavam» introduzem aspecto habitual/durativo não indicado.
  - severity: medium
    issue: «As relacionavam com» enfraquece «referred them to»
    rationale: No contexto de enunciados sobre o Paraíso interpretados espiritualmente, a expressão aponta para sua aplicação/referência à Igreja de Cristo, não apenas para uma associação genérica.
  revised_text: 'Assim, os intérpretes mais antigos das igrejas — refiro-me a Fílon, o filósofo e contemporâneo dos apóstolos, ao célebre Papias de Hierápolis, discípulo de João, o Evangelista... e aos seus companheiros — interpretaram espiritualmente os ditos acerca do Paraíso e aplicaram-nos à Igreja de Cristo.[a]


    — ANASTÁSIO DO SINAI, Contempl. Anagog. in Hexaém. VII'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; ainda é necessária a revisão direta do texto na língua antiga. As reticências pertencem ao testemunho consultado.
    reason: A fonte fornecida informa que a revisão do grego/latim está pendente; a nota torna transparente a base textual e preserva a incerteza documental.
  revision_rationale: A revisão limita-se a restaurar o aspecto passado do testemunho e a tornar explícita, em português idiomático, a aplicação dos ditos à Igreja. Não resolve questões sobre a identidade de João, nem especifica o método de interpretação espiritual. A nota de transparência e as reticências foram mantidas.
