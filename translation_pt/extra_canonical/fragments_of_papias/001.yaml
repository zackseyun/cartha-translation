base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/001.yaml
  text: 'Irenaeus and others record that John the Divine and Apostle survived until the time of Trajan. After that, Papias of Hierapolis and Polycarp, bishop of Smyrna, his hearers, became well known.


    —Eusebius, Chronicon (Syncellus 655, 14), for Olympiad 220.


    II


    At this time Polycarp flourished in Asia. He was a disciple of the Apostles who [corrupt/illegible text concerning the church in Smyrna and “... ministers of the Lord”]. At the same time Papias, who was also bishop of the diocese of Hierapolis, became distinguished.


    —Eusebius, History of the Church 3.36.1–2.'
translation:
  language: pt
  text: 'Irineu e outros registram que João, o Teólogo e Apóstolo, viveu até o tempo de Trajano. Depois disso, Papias de Hierápolis e Policarpo, bispo de Esmirna, que haviam sido seus ouvintes, tornaram-se conhecidos.


    — Eusébio, Crônica (Sincelo 655, 14), para a 220ª Olimpíada.


    II


    Nessa época, Policarpo floresceu na Ásia. Ele era discípulo dos apóstolos e [o texto está corrompido e ilegível neste ponto; há uma referência à igreja em Esmirna e aos “ministros do Senhor”].[a] Na mesma época, destacou-se Papias, que também era bispo da diocese de Hierápolis.


    — Eusébio, História Eclesiástica 3.36.1–2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho inglês fornecido está gravemente corrompido neste trecho, provavelmente por falhas tipográficas ou de OCR. Como a revisão direta do grego ou do latim ainda está pendente, não se tentou reconstruir a redação perdida.
    reason: Informa com transparência por que o texto interrompe a frase e evita apresentar uma conjectura como tradução.
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: João, o Teólogo e Apóstolo
  rationale: “O Teólogo” reproduz de modo digno o título tradicional associado a João e evita que “Divino” sugira que ele próprio possuía natureza divina.
- source_word: his hearers
  choice: que haviam sido seus ouvintes
  rationale: Mantém a relação indicada pelo testemunho inglês e conserva o referente contextual de “seus”, sem expandir “ouvintes” para uma categoria mais interpretativa, como “discípulos”.
- source_word: flourished
  choice: floresceu
  rationale: O uso historiográfico de “floresceu” preserva a ideia de atividade e projeção naquele período.
- source_word: became distinguished
  choice: destacou-se
  rationale: Expressão portuguesa natural que comunica notoriedade sem acrescentar juízo sobre autoridade ou santidade.
- source_word: diocese
  choice: diocese
  rationale: Mantém a terminologia do testemunho fornecido, embora possa refletir o vocabulário eclesiástico do transmissor ou tradutor.
theological_decisions:
- issue: Relação de Papias e Policarpo com João
  choice: “que haviam sido seus ouvintes”
  alternative: “seus discípulos” ou uma reformulação que associasse apenas Papias a João
  rationale: O testemunho fornecido chama ambos de ouvintes e apresenta ambiguidade sintática suficiente para desaconselhar uma harmonização histórica ou doutrinária.
- issue: Trecho corrompido sobre Policarpo e a igreja de Esmirna
  choice: Sinalizar explicitamente a lacuna e traduzir apenas os elementos ainda reconhecíveis
  alternative: Reconstruir uma frase contínua com base em tradições paralelas
  rationale: Uma reconstrução poderia importar conteúdo não comprovado pelo testemunho apresentado; a indicação da corrupção preserva os limites da evidência.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A redação é provisória porque se baseia no testemunho inglês de domínio público; a consulta direta às fontes gregas ou latinas ainda está pendente. As referências bibliográficas foram normalizadas em português, e o trecho corrompido foi mantido como lacuna explicitamente assinalada.
