base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: pt
  text: 'Aqueles que praticavam a sinceridade sem dolo para com Deus eram chamados de crianças, como também mostra Papias no primeiro livro das Exposições do Senhor, e Clemente de Alexandria no Pedagogo.[a]


    — Máximo, o Confessor, Escólios às obras de Dionísio, o Areopagita, Sobre a Hierarquia Eclesiástica, capítulo 2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de J. B. Lightfoot; a revisão direta do texto grego ou latino ainda está pendente.
    reason: A fonte fornecida declara que o testemunho na língua antiga ainda não foi revisto; a nota torna transparente essa limitação textual.
lexical_decisions:
- source_word: guilelessness
  choice: sinceridade sem dolo
  rationale: Preserva a ideia de ausência de engano ou duplicidade diante de Deus; a formulação é clara em português moderno sem reduzir o sentido apenas a inocência ou simplicidade.
- source_word: children
  choice: crianças
  rationale: Mantém o termo concreto e a possível dimensão figurada da designação, sem interpretá-lo como uma categoria espiritual específica.
- source_word: Expositions of the Lord
  choice: Exposições do Senhor
  rationale: Reproduz o título tradicional da obra atribuída a Papias sem decidir se o genitivo se refere a palavras ditas pelo Senhor ou a exposições a respeito dele.
- source_word: Paedagogue
  choice: Pedagogo
  rationale: Emprega a forma portuguesa consagrada do título da obra de Clemente de Alexandria.
- source_word: Scholia
  choice: Escólios
  rationale: Usa o termo técnico português para comentários ou anotações explicativas transmitidos sobre uma obra.
theological_decisions:
- issue: Sentido de “crianças”
  choice: Manter “crianças” sem explicação interpretativa no corpo do texto
  alternative: Traduzir como “filhos” ou explicitar “crianças na fé”
  rationale: O testemunho associa a designação à ausência de dolo diante de Deus, mas não define uma doutrina de filiação nem um estágio de maturidade espiritual.
- issue: Relação expressa em “do Senhor”
  choice: Preservar o genitivo ambíguo no título
  alternative: “Exposições dos Oráculos do Senhor” ou “Explicações sobre os ensinamentos do Senhor”
  rationale: A evidência fornecida traz apenas o testemunho inglês e informa que a revisão direta do grego/latim ainda está pendente; não convém especificar além dela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi naturalizada, e o marcador editorial de página do testemunho impresso foi omitido. O nome e os títulos bibliográficos foram vertidos em formas portuguesas usuais.
