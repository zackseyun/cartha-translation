lexical_decisions:
- source_word: lived on
  choice: continuou vivo
  rationale: Expressa naturalmente a sobrevivência de Judas depois de ter sido retirado, sem sugerir duração além do que o testemunho afirma.
- source_word: cut down
  choice: foi retirado
  rationale: No contexto de enforcamento, indica que ele foi tirado do lugar ou laço; evita a leitura moderna de ‘cortado’ fisicamente.
- source_word: falling headlong
  choice: ao cair de cabeça
  rationale: Preserva a ligação explícita com Atos e o sentido espacial do testemunho inglês.
- source_word: burst asunder in the midst
  choice: se rompeu ao meio
  rationale: Mantém a descrição corporal forte sem amplificação gráfica.
- source_word: Oracles of the Lord
  choice: Oráculos do Senhor
  rationale: Conserva o título tradicional da obra atribuída a Pápias.
- source_word: impiety
  choice: impiedade
  rationale: Equivalente formal e corrente, adequado ao registro moral e religioso antigo.
- source_word: waggon
  choice: carroça
  rationale: Termo moderno compreensível para um veículo largo de transporte; a corrupção textual adjacente é indicada em nota.
- source_word: sunk from the surface
  choice: profundamente retraídos que estavam em relação à superfície
  rationale: Reproduz a imagem anatômica sem decidir se a causa seria afundamento, inchaço circundante ou ambos.
theological_decisions:
- issue: Relação entre a morte de Judas por enforcamento e o relato de Atos
  choice: Preservar a tentativa de harmonização atribuída a Apolinário sem endossá-la editorialmente
  alternative: Reformular o trecho como contradição entre tradições ou apresentar a harmonização como fato bíblico estabelecido
  rationale: O fragmento afirma que Judas sobreviveu inicialmente ao enforcamento e depois sofreu a queda; a tradução deve representar essa voz histórica, não resolver a tensão em nome do leitor.
- issue: Identidade de ‘João’
  choice: Traduzir simplesmente ‘discípulo de João’
  alternative: Especificar ‘João, o apóstolo’ ou ‘João, o presbítero’
  rationale: O testemunho fornecido não identifica inequivocamente qual João está em vista; a ambiguidade histórica deve ser mantida.
- issue: Valor histórico do relato grotesco sobre Judas
  choice: Manter os marcadores discursivos ‘relatado’ e ‘Dizem’
  alternative: Apresentar todos os detalhes diretamente como fatos confirmados
  rationale: Esses marcadores preservam os diferentes níveis de atribuição e evitam aumentar a certeza do testemunho.
