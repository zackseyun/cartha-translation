review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a cadeia de atribuição (Apolinário atribuindo o relato a Pápias), a harmonização proposta entre o enforcamento e Atos, e os marcadores de incerteza no relato posterior (“Dizem”). Contudo, a formulação da passagem da carroça introduz uma leitura verbal sem a assinalar no próprio ponto reconstruído, e “ao cair de cabeça” é mais restritivo do que o inglês testemunhal “falling headlong”.
  naturalness: 'O português é em geral claro e de registro apropriado. Pequenos ajustes tornam a descrição mais idiomática: “cair precipitadamente” evita especificar a orientação física da queda; “rompeu-se pelo meio” é mais natural do que “se rompeu ao meio”; e “afundados sob a superfície” expressa com clareza a imagem final.'
  terminology: Os nomes, o título “Exposição dos Oráculos do Senhor”, “impiedade” e “entranhas” são adequados. “Carroça” é aceitável para “waggon”, desde que a reconstrução do trecho corrompido permaneça explicitamente sinalizada. “Descido” traduz de modo mais específico e natural “cut down” no contexto de enforcamento, sem afirmar quem realizou a ação.
  issues:
  - severity: medium
    issue: Reconstrução não assinalada na frase da carroça
    rationale: “por onde uma carroça [a] passava com facilidade” insere “passava” como se fosse texto seguro, embora a nota diga que o trecho está danificado. A palavra ou expressão suprida deve aparecer entre colchetes no texto.
  - severity: low
    issue: “Ao cair de cabeça” restringe “falling headlong”
    rationale: A expressão inglesa descreve uma queda precipitada/de cabeça para baixo, mas não exige a afirmação específica de que a cabeça foi a parte que atingiu primeiro. “Caindo precipitadamente” conserva melhor a amplitude do testemunho.
  - severity: low
    issue: Formulação anatômica final pouco natural
    rationale: “Profundamente retraídos ... em relação à superfície” é compreensível, mas artificial. “Tão profundamente afundados sob a superfície” reproduz de forma mais direta a imagem do testemunho.
