review_pass:
  verdict: revise
  source_fidelity: 'A versão acompanha com boa precisão o testemunho inglês público fornecido e conserva os trechos entre colchetes. Como não foi fornecido o texto grego/latino subjacente, a fidelidade direta às fontes antigas permanece necessariamente provisória. A revisão corrige duas pequenas expansões interpretativas: «começou a ensiná-los» atribui um início não expresso pelo testemunho, e «mulheres assim» especifica «mulheres» onde o inglês diz apenas «tais».'
  naturalness: O português é moderno, claro e de registro digno. Mantiveram-se «você/vocês» de forma coerente nos diálogos, substituindo-se o isolado «tu» por «você» para evitar alternância pronominal desnecessária.
  terminology: «escribas», «fariseus», «adultério», «Lei», «Mestre», «Senhor», «pecado» e «condenar» são escolhas adequadas. «Senhor» preserva a ambiguidade do tratamento sem impor leitura cristológica. O título editorial e as referências bibliográficas foram preservados.
  issues:
  - severity: low
    issue: Aspecto verbal acrescentado em «começou a ensiná-los».
    rationale: O testemunho diz simplesmente que Jesus «ensinou-os»; «começou a» introduz um aspecto incoativo que não está expresso.
  - severity: low
    issue: Especificação em «apedrejar mulheres assim».
    rationale: O testemunho inglês diz «to stone such». Embora o referente narrativo seja uma mulher, «pessoas assim» conserva melhor a formulação menos especificada do testemunho fornecido.
  - severity: low
    issue: Alternância entre «tu» e «você» no mesmo diálogo.
    rationale: A alternância não corresponde a uma distinção do testemunho e é menos uniforme para o registro moderno adotado.
