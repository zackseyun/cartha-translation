base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/003.yaml
  text: 'And each man went to his own house, but Jesus went to the Mount of Olives. Early in the morning he came again to the temple, [and all the people came to him; and he sat down and taught them]. The scribes and the Pharisees brought a woman caught in adultery, and after placing her in the middle, they said to him, “Teacher, this woman was caught in adultery, in the very act. Now in the law Moses commanded [us] to stone such. What then do you say?” [They said this to test him, so that they might have something with which to accuse him.] But Jesus stooped down and wrote on the ground with his finger. When they continued questioning [him], he straightened up and said [to them], “Let the one among you who is without sin be the first to throw a stone at her.” Again he stooped down and wrote on the ground. When they heard this, they went out one by one, beginning with the oldest. He was left alone, and the woman, where she was, in the middle. Jesus straightened up and said to her, “Woman,
    where are they? Did no one condemn you?” She said, “No one, Lord.” Jesus said, “Neither do I condemn you. Go on your way; from now on, sin no more.”


    PERICOPE ADULTERAE; see Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 sq., 91; Lightfoot, Essays on Supernatural Religion, p. 203 sq.'
translation:
  language: pt
  text: 'E cada um foi para a sua casa, mas Jesus foi para o monte das Oliveiras. De madrugada, ele voltou ao templo, [e todo o povo foi até ele; então ele se sentou e começou a ensiná-los]. Os escribas e os fariseus trouxeram uma mulher apanhada em adultério e, colocando-a no meio de todos, disseram-lhe: “Mestre, esta mulher foi apanhada em adultério, no próprio ato. Na Lei, Moisés nos ordenou apedrejar mulheres assim. E tu, o que dizes?” [Diziam isso para pô-lo à prova, a fim de terem do que acusá-lo.] Jesus, porém, inclinou-se e escreveu no chão com o dedo. Como continuavam a interrogá-lo, ele se endireitou e lhes disse: “Aquele de vocês que não tem pecado seja o primeiro a atirar uma pedra nela.” Então tornou a inclinar-se e a escrever no chão. Ao ouvirem isso, foram saindo um por um, começando pelos mais velhos. Jesus ficou sozinho com a mulher, que permanecia ali, no meio. Ele se endireitou e lhe perguntou: “Mulher, onde estão eles? Ninguém condenou você?” Ela respondeu: “Ninguém,
    Senhor.” Jesus disse: “Eu também não condeno você. Vá e, de agora em diante, não peque mais.”[a]


    PERÍCOPE DA ADÚLTERA; ver Westcott e Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 e seguintes, 91; Lightfoot, Essays on Supernatural Religion, p. 203 e seguintes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta tradução é provisória e se baseia no testemunho inglês fornecido; a revisão direta das fontes antigas grega e latina ainda está pendente. O trecho apresenta uma história textual complexa. Os colchetes do testemunho editorial foram preservados em sentido na tradução, mas não são uniformemente reproduzíveis sem consulta à edição-fonte.
    reason: É necessário tornar transparente a base indireta da tradução e a incerteza textual do material apresentado como fragmento.
lexical_decisions:
- source_word: Master
  choice: Mestre
  rationale: Forma natural e tradicional para o tratamento dirigido a Jesus, sem acrescentar uma interpretação cristológica.
- source_word: taken in adultery
  choice: apanhada em adultério
  rationale: Preserva a ideia de flagrante expressa pelo testemunho, reforçada em seguida por “no próprio ato”.
- source_word: without sin
  choice: não tem pecado
  rationale: Mantém a formulação ampla e a tensão do dito, sem restringi-la ao pecado específico do adultério.
- source_word: condemn
  choice: condenar
  rationale: Conserva o campo judicial do confronto e a repetição deliberada no diálogo final.
- source_word: Lord
  choice: Senhor
  rationale: Preserva a ambiguidade entre tratamento respeitoso e possível título de maior peso teológico.
theological_decisions:
- issue: Alcance de “sem pecado”
  choice: “não tem pecado”
  alternative: “nunca pecou” ou “não é culpado deste pecado”
  rationale: A opção escolhida não limita nem intensifica indevidamente a declaração de Jesus.
- issue: Sentido de “Senhor” na resposta da mulher
  choice: Manter “Senhor” sem explicação no corpo do texto
  alternative: “senhor” como simples tratamento ou explicitação cristológica
  rationale: O testemunho permite mais de uma nuance, que não deve ser resolvida silenciosamente.
- issue: Relação entre não condenar e a exortação final
  choice: Preservar as duas afirmações lado a lado
  alternative: Parafrasear como absolvição sacramental, perdão explícito ou mera tolerância
  rationale: Mantém a tensão narrativa entre misericórdia, juízo e chamado a abandonar o pecado.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira e compreensão internacional. Empregou-se “você/vocês” no diálogo, mas “tu” na pergunta adversarial (“E tu, o que dizes?”) para conservar a interpelação direta e solene sem tornar o conjunto arcaico. A citação bibliográfica editorial foi mantida e vertida apenas onde cabível. Como a fonte em língua antiga não foi fornecida e sua revisão está explicitamente pendente, esta é uma versão de publicação provisória baseada no testemunho inglês público.
