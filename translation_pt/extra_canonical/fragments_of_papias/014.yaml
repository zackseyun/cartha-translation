review_pass:
  verdict: revise
  source_fidelity: A redação preserva adequadamente o conteúdo do testemunho inglês disponível, incluindo a atribuição de «bispo e mártir» a Papias, o qualificativo «santo» para Irineu e a afirmação sobre alimentos materiais. Contudo, «Além disso» não reproduz com precisão o valor negativo continuativo de “Nor again”; «Tampouco» o faz melhor. A revisão direta do grego/latim permanece pendente, como indicado no contexto.
  naturalness: A frase é clara e de registro apropriado. «Tampouco Estêvão segue...» é mais idiomático e mantém a construção negativa sem introduzir colchetes editoriais desnecessários, pois o sujeito está expresso no testemunho inglês.
  terminology: «Reino dos céus», «desfrute» e «alimentos materiais» conservam de modo sóbrio os termos relevantes. «Hierápolis», «Irineu», «Lião» e «Estêvão Gobaro» são formas portuguesas adequadas. «Biblioteca» é uma normalização apropriada do título da obra citada.
  issues:
  - severity: low
    issue: «Além disso» para “Nor again”
    rationale: A expressão inglesa introduz mais um caso de não seguimento; «Tampouco» preserva tanto a adição quanto a negação.
  - severity: low
    issue: Sujeito posto entre colchetes
    rationale: O testemunho fornecido nomeia Stephanus na oração parentética. Em português, «Estêvão» pode figurar diretamente, sem sugerir uma suplementação editorial incerta.
  revised_text: 'Tampouco Estêvão segue Papias, bispo e mártir de Hierápolis, nem Irineu, o santo bispo de Lião, quando dizem que o reino dos céus consistirá no desfrute de certos alimentos materiais.


    — FÓCIO, *Biblioteca* 232, sobre Estêvão Gobaro.'
  revised_footnotes: []
  revision_rationale: A correção substitui uma conexão aditiva insuficiente por «Tampouco», que reproduz o nexo negativo do testemunho, e elimina colchetes que não são necessários no português. Não altera a ambiguidade nem acrescenta interpretação escatológica.
