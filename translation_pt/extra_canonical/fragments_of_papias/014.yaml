  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: pt
  text: 'Além disso, [Estêvão] não segue Papias, bispo e mártir de Hierápolis, nem Irineu, o santo bispo de Lião, quando eles dizem que o reino dos céus consistirá no desfrute de certos alimentos materiais.


    — FÓCIO, *Biblioteca* 232, sobre Estêvão Gobaro.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: kingdom of heaven
  choice: reino dos céus
  rationale: Mantém a formulação tradicional e a referência conceitual do testemunho, sem explicitar além do que ele afirma.
- source_word: enjoyment
  choice: desfrute
  rationale: Expressa a ideia de usufruir ou saborear os alimentos, em registro natural e digno.
- source_word: certain material foods
  choice: certos alimentos materiais
  rationale: Preserva a qualificação incomum e teologicamente relevante, sem substituí-la por uma interpretação como 'alimentos físicos' ou 'prazeres carnais'.
- source_word: does ... follow
  choice: não segue
  rationale: Reproduz a relação intelectual indicada pelo testemunho; o nome subentendido foi colocado entre colchetes para tornar a frase compreensível.
theological_decisions:
- issue: Natureza material do reino dos céus
  choice: Preservar literalmente a afirmação de que o reino consistirá no desfrute de certos alimentos materiais.
  alternative: Interpretar como referência específica a um banquete milenar ou a prazeres carnais.
  rationale: O testemunho disponível não especifica o esquema escatológico nem justifica uma paráfrase denominacional; convém manter a tensão da formulação.
- issue: Posição de Fócio/Estêvão diante de Papias e Irineu
  choice: Manter apenas que Estêvão não os segue.
  alternative: Dizer que Estêvão os condena, refuta ou considera heréticos.
  rationale: Essas formulações seriam mais fortes do que a evidência fornecida.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. Tradução provisória baseada no testemunho inglês de domínio público, pois a revisão direta do grego/latim ainda está pendente. Normalizaram-se os erros tipográficos do testemunho: “Irenzeus” como Irineu e “Aibliotheca” como Biblioteca. “Lião” e “Estêvão Gobaro” seguem formas portuguesas usuais; os colchetes em [Estêvão] assinalam o sujeito suprido pelo contexto editorial do testemunho.'
