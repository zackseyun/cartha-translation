review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura central do testemunho: Estêvão não acompanha Papias nem Irineu quanto à afirmação de que o reino dos céus consistirá no desfrute de certos alimentos materiais. A identificação editorial de «Stephanus» é justificável pelo parêntese do testemunho, mas a ordem da frase pode refletir mais diretamente a construção negativa inicial.'
  naturalness: «Além disso, [Estêvão] não segue...» é compreensível, mas «Além disso» enfraquece e desloca o valor negativo de “Nor again”. «Tampouco Estêvão segue...» é mais natural, claro e próximo da relação sintática do testemunho. Os colchetes deixam de ser necessários quando o nome é integrado à oração.
  terminology: «Reino dos céus», «desfrute», «alimentos materiais», «Hierápolis», «Irineu» e «Lião» são escolhas adequadas. «Santo bispo» conserva o qualificativo do testemunho sem lhe atribuir peso interpretativo adicional.
  issues:
  - severity: low
    issue: Conector inicial e ordem sintática
    rationale: «Além disso» não reproduz com precisão o valor de “Nor again”, que continua uma negação. «Tampouco Estêvão segue...» preserva melhor a negação e torna a frase idiomática em português.
  - severity: low
    issue: Colchetes em [Estêvão]
    rationale: O sujeito está editorialmente suprido no próprio testemunho inglês entre parênteses; em português, pode ser incorporado diretamente à frase, sem sugerir uma lacuna textual adicional por meio de colchetes.
  revised_text: 'Tampouco Estêvão segue Papias, bispo e mártir de Hierápolis, nem Irineu, o santo bispo de Lião, quando eles dizem que o reino dos céus consistirá no desfrute de certos alimentos materiais.


    — FÓCIO, *Biblioteca* 232, sobre Estêvão Gobaro.'
  revised_footnotes: []
  revision_rationale: A revisão limita-se a tornar explícita e natural em português a negação continuativa do testemunho, sem alterar sua ambiguidade histórica ou teológica. Mantêm-se as designações, os nomes e a formulação material do reino conforme a ponte inglesa disponível. A revisão direta do grego/latim continua pendente.
