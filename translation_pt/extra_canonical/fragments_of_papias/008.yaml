base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: pt
  text: '**Fragmento XI**[a]


    Mas assim diz Papias — cito-o palavra por palavra:


    “Ele também deu a alguns deles — evidentemente, aos anjos que no princípio eram santos — domínio sobre a ordenação do universo e os encarregou de exercer bem esse domínio.”


    E em seguida diz:


    “Mas aconteceu que a ordem deles se desfez; pois o grande dragão, a antiga serpente, que também é chamada Satanás e o Diabo, foi lançado para baixo — sim, foi lançado à terra —, ele e os seus anjos.”[b]


    — André de Cesareia, *Sobre o Apocalipse*, cap. 34, sermão 12.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradução deste fragmento é provisória e foi preparada a partir do testemunho inglês de J. B. Lightfoot; a revisão direta do texto grego preservado por André de Cesareia ainda está pendente.
    reason: Informa com transparência que o texto antigo em sua língua de transmissão não foi fornecido para verificação direta.
  - marker: b
    text: O exemplar digitalizado usado como testemunho apresenta falhas de leitura nesta frase; as formas “grande”, “Diabo” e “seus” seguem as restaurações evidentes registradas na edição consultada.
    reason: Documenta restaurações de corrupção mecânica/OCR que afetam palavras do texto citado.
lexical_decisions:
- source_word: arrangement of the universe
  choice: ordenação do universo
  rationale: Mantém a ideia de disposição ou organização do cosmos sem especificar indevidamente se se trata da criação, do governo cósmico ou de uma ordem hierárquica.
- source_word: dominion
  choice: domínio
  rationale: Reproduz a noção de autoridade delegada e permite conservar a repetição enfática do testemunho.
- source_word: their array came to nought
  choice: a ordem deles se desfez
  rationale: Preserva a possível ideia de arranjo, organização ou formação coletiva, evitando restringir a expressão a uma interpretação exclusivamente militar.
- source_word: was cast down
  choice: foi lançado para baixo / foi lançado à terra
  rationale: Conserva a repetição e o movimento descendente explícito, além da provável ressonância com Apocalipse 12.
- source_word: old serpent
  choice: antiga serpente
  rationale: Formulação natural em português e próxima da expressão tradicional de Apocalipse 12:9, sem acrescentar interpretação.
theological_decisions:
- issue: Identidade do sujeito que concede domínio
  choice: Manter o pronome “ele” sem nomear o sujeito
  alternative: Explicitar “Deus”
  rationale: O trecho apresentado pressupõe um antecedente ausente; explicitar “Deus” resolveria uma lacuna que o fragmento preservado não resolve no próprio contexto fornecido.
- issue: Natureza da autoridade dos anjos
  choice: Traduzir como domínio sobre a ordenação do universo
  alternative: Interpretar como governo da criação ou administração dos astros
  rationale: A formulação mais ampla conserva a tensão cosmológica sem importar um sistema angelológico específico.
- issue: Sentido de “array”
  choice: “ordem” que se desfez
  alternative: “exército”, “formação” ou “posição”
  rationale: “Ordem” mantém abertas tanto a leitura organizacional quanto a coletiva e não define além da evidência disponível a natureza da queda dos anjos.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. A repetição retórica do testemunho foi mantida. O título latino da obra citada foi vertido como “Sobre o Apocalipse”. Como não houve acesso direto ao texto grego neste pedido, as decisões são deliberadamente provisórias e evitam reconstruções teológicas além do testemunho inglês disponível.
