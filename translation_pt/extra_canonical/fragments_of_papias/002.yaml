review_pass:
  verdict: revise
  source_fidelity: 'O texto acompanha de perto o testemunho de Eusébio e, nos pontos decisivos preservados em grego, corrige adequadamente a leitura corrompida do testemunho inglês (“mil anos”, não “dez mil”). Contudo, algumas escolhas nivelam indevidamente matizes do texto: συνετάξατο, sobre Mateus, pede “compôs/organizou”, não “reuniu”; ἡρμήνευσεν é aoristo e pede “interpretou como pôde”, não o imperfeito “interpretava”; e a referência indefinida de Eusébio a possíveis outros defensores da opinião não deve tornar-se uma afirmação de que determinado conjunto de autores existiu ou é identificável.'
  naturalness: O português é claro, moderno e de registro adequado. As citações distinguem-se bem da narração de Eusébio. Pequenos ajustes melhoram a precisão sem prejudicar a fluidez, em especial “os que os tinham seguido” em vez de “os que haviam convivido com eles” e “mil anos” em vez de “cerca de mil anos”.
  terminology: “Oráculos”, “presbítero”, “intérprete” e “dialeto hebraico” são escolhas apropriadas e as notas preservam as ambiguidades históricas e linguísticas relevantes. “Forma material” reproduz satisfatoriamente a crítica atribuída a Eusébio. Mantém-se “Apocalipse” como designação portuguesa natural para Revelation.
  issues:
  - severity: medium
    issue: A formulação sobre Mateus altera dois valores verbais do testemunho.
    rationale: A tradição citada por Eusébio diz que Mateus συνέταξεν os λόγια e que cada pessoa ἡρμήνευσεν como pôde. “Reuniu” é menos preciso que “compôs”, e “interpretava” transforma o aoristo em ação habitual; “interpretou como pôde” preserva melhor a forma e o sentido.
  - severity: medium
    issue: A identificação dos que adotaram opinião semelhante é excessivamente determinada.
    rationale: Eusébio escreve exemplificativamente “como Irineu e quaisquer outros que declararam...” A redação “Entre eles estavam Irineu e todos os demais” sugere um grupo definido e conhecido que o texto não fornece.
  - severity: low
    issue: “Haviam convivido com eles” é mais estreito que “haviam seguido [os apóstolos]”.
    rationale: Seguir pode envolver adesão, transmissão e vínculo de discipulado, sem afirmar necessariamente convivência pessoal prolongada.
  - severity: low
    issue: “Cerca de mil anos” suaviza um número expresso.
    rationale: O texto grego de Eusébio traz χίλια ἔτη; a tradução deve dizer “mil anos”. A nota pode continuar a documentar a divergência do testemunho inglês digitalizado.
  revised_text: 'Cinco livros de Papias chegaram até nós com o título *Exposições dos Oráculos do Senhor*.[a] Irineu também os menciona como as únicas obras escritas por ele, nos seguintes termos: “Essas coisas são atestadas por escrito, no quarto de seus livros, por Papias, ouvinte de João, companheiro de Policarpo e homem dos tempos antigos. Pois ele compôs cinco livros.” Até aqui, Irineu.


    Contudo, no prefácio de suas exposições, o próprio Papias certamente não afirma ter sido ouvinte e testemunha ocular dos santos apóstolos. Ao contrário, pela linguagem que emprega, mostra que recebeu os ensinamentos da fé daqueles que os haviam seguido:


    “Não hesitarei em incluir para você, junto com minhas interpretações, tudo o que no passado aprendi cuidadosamente dos presbíteros e guardei cuidadosamente na memória, confirmando a sua verdade. Pois, ao contrário da maioria, eu não tinha prazer nos que falam muito, mas nos que ensinam a verdade; nem nos que transmitem mandamentos alheios, mas nos que transmitem os mandamentos dados pelo Senhor à fé e procedentes da própria Verdade. E, sempre que aparecia alguém que havia seguido os presbíteros, eu procurava saber o que eles haviam dito: o que André ou Pedro disseram, ou Filipe, ou Tomé, ou Tiago, ou João, ou Mateus, ou qualquer outro dos discípulos do Senhor; e o que dizem Aristião e o presbítero João, discípulos do Senhor. Pois eu não pensava que o conteúdo dos livros pudesse me trazer tanto proveito quanto as palavras de uma voz viva e permanente.”


    Aqui vale a pena observar que ele menciona duas vezes o nome de João. O primeiro é citado junto com Pedro, Tiago, Mateus e os demais apóstolos, referindo-se evidentemente ao evangelista. O outro João, porém, é mencionado depois de certo intervalo e colocado entre pessoas que não fazem parte do número dos apóstolos; Aristião vem antes dele, e Papias o chama expressamente de presbítero. Com isso, deixa bem claro que dizem a verdade os que afirmam ter havido na Ásia duas pessoas com esse nome e que existem em Éfeso dois túmulos, cada um dos quais ainda hoje é chamado túmulo de João. É importante observar isso, pois é provável que tenha sido o segundo — caso não se admita que foi o primeiro — quem viu o Apocalipse atribuído nominalmente a João. Papias, de quem agora falamos, reconhece ter recebido as palavras dos apóstolos daqueles que os haviam seguido, mas diz que ele próprio foi ouvinte de Aristião e do presbítero João. De fato, menciona-os muitas vezes pelo nome e também registra as
    tradições deles em seus escritos. Isso basta quanto a esses pontos, que, espero, não tenham sido apresentados inutilmente.


    Convém, porém, acrescentar às palavras de Papias citadas acima outras passagens suas, nas quais ele registra também alguns acontecimentos extraordinários que lhe chegaram por tradição. Já se afirmou que o apóstolo Filipe morou em Hierápolis com suas filhas; mas é preciso observar aqui que Papias, contemporâneo delas, relata ter ouvido das filhas de Filipe uma história extraordinária. Ele conta que, em seus dias, um homem ressuscitou dentre os mortos. Também narra outro fato extraordinário a respeito de Justo, chamado Barsabás: ele bebeu um veneno mortal e, pela graça do Senhor, não sofreu mal algum. Sobre esse Justo, o livro de Atos registra que, depois da ascensão do Salvador, os santos apóstolos o apresentaram juntamente com Matias e oraram para que fosse escolhido aquele que completaria o número deles no lugar do traidor Judas. A passagem diz mais ou menos o seguinte: “Então apresentaram dois: José, chamado Barsabás, cujo sobrenome era Justo, e Matias. E, orando, disseram...”


    O mesmo escritor registrou outras informações que lhe haviam chegado por tradição oral: certas parábolas incomuns do Salvador, alguns ensinamentos dele e outras declarações de caráter um tanto lendário. Entre elas, afirma que haverá um período de mil anos depois da ressurreição e que o reino de Cristo será estabelecido de forma material nesta terra.[b] Suponho que ele tenha chegado a essas ideias por compreender mal os relatos apostólicos, sem perceber que aquilo que os apóstolos haviam expressado em figuras devia ser entendido em sentido místico.


    Pois, a julgar por suas próprias declarações, ele evidentemente era um homem de entendimento muito limitado. Ainda assim, por causa dele, muitos autores eclesiásticos posteriores adotaram opinião semelhante, invocando em apoio próprio a antiguidade desse homem, como, por exemplo, Irineu e quaisquer outros que declararam sustentar ideias semelhantes. Em sua própria obra, Papias apresenta ainda outros relatos das palavras do Senhor com base na autoridade de Aristião, já mencionado, bem como tradições do presbítero João. A elas encaminhamos os interessados. Para o nosso propósito atual, acrescentaremos apenas às palavras já citadas uma tradição transmitida por essas fontes acerca de Marcos, o autor do Evangelho:


    “E o presbítero dizia também o seguinte: Marcos, tendo se tornado intérprete de Pedro,[c] escreveu com exatidão tudo aquilo de que se lembrava, embora não tenha registrado em ordem as coisas ditas ou feitas por Cristo. Pois ele não ouviu o Senhor nem o acompanhou; mais tarde, porém, como eu disse, acompanhou Pedro. Este adaptava seus ensinamentos às necessidades dos ouvintes, sem a intenção de compor uma exposição ordenada dos oráculos do Senhor. Assim, Marcos não cometeu erro ao escrever algumas coisas conforme se lembrava delas, pois teve o cuidado de não omitir nada do que havia ouvido nem registrar qualquer falsidade.”


    Esse é, portanto, o relato de Papias a respeito de Marcos. Quanto a Mateus, faz-se a seguinte declaração:


    “Mateus, portanto, compôs os oráculos no dialeto hebraico,[d] e cada um os interpretou como pôde.”


    O mesmo escritor utilizou testemunhos da Primeira Carta de João e também da de Pedro. Além disso, contou outra história a respeito de uma mulher acusada de muitos pecados diante do Senhor, história essa que o Evangelho segundo...[e]'
