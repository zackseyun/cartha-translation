  text: 'Five books by Papias are extant, bearing the title Expositions of the Oracles of the Lord. Irenaeus also mentions these as the only [works] written by him, in the following words: “These things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesses in writing in the fourth of his books. For there are five books composed by him.” So far Irenaeus.


    Yet Papias himself, in the preface to his discourses, certainly does not [claim] that he was a hearer and eyewitness of the holy Apostles. Rather, he shows by the language he uses that he received the matters of the faith from those who were their friends:


    “But I will not scruple also to give a place for you along with my interpretations to everything that I carefully learned and carefully remembered in time past from the elders, guaranteeing its truth. For, unlike the many, I did not take pleasure in those who have very much to say, but in those who teach the truth; nor in those who relate foreign commandments, but in those (who record) such as were given from the Lord to the Faith and are derived from the Truth itself. And again, whenever a person came (in my way) who had been a follower of the Elders, I would inquire about the discourses of the elders—what was said by Andrew, or by Peter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion and the Elder John, the disciples of the Lord, say. For I did not think that I could get so much profit from the contents of books as from the utterances of a living and abiding voice.”


    Here it is worth while to observe that he twice enumerates the name of John. The first he mentions in connection with Peter, James, Matthew, and the rest of the Apostles, evidently meaning the Evangelist; but the other John he mentions after an interval and classes with others outside the number of the Apostles, placing Aristion before him, and he distinctly calls him an Elder. Thus he makes it quite evident that their statement is true who say that there were two persons of that name in Asia, and that there are two tombs in Ephesus, each of which even now is called the tomb of John. It is important to notice this, for it is probable that it was the second, if one will not admit that it was the first, who saw the Revelation which is ascribed by name to John. Papias, of whom we are now speaking, confesses that he had received the words of the Apostles from those who had followed them, but says that he was himself a hearer of Aristion and the Elder John. At all events, he mentions them
    frequently by name and besides records their traditions in his writings. So much for these points, which I trust have not been uselessly adduced.


    It is worth while, however, to add to the words of Papias given above other passages from him, in which he records some other wonderful events likewise, as having come down to him by tradition. That Philip the Apostle resided in Hierapolis with his daughters has already been stated; but it must be noted here how Papias, their contemporary, relates that he had heard a marvellous tale from the daughters of Philip. For he relates that in his ti[me] a man rose from the dead, and again he gives another wonderful story about Justus, who was surnamed Barsabas: how he drank a deadly poison and yet, by the grace of the Lord, suffered no inconvenience. Of this Justus the Book of Acts records that, after the ascension of the Saviour, the holy Apostles put him forward with Matthias and prayed for the right choice, in place of the traitor Judas, to make their number complete. The passage is somewhat as follows: “And they put forward two, Joseph, called Barsabas, who was surnamed Justus, and Matthias;
    and they prayed, and said.”


    The same writer has recorded other notices as having come down to him from oral tradition: certain strange parables of the Saviour and teachings of his, and some other statements of a rather mythical character. Among these he says that there will be a period of some ten thousand years after the resurrection, and that the kingdom of Christ will be set up in material form on this earth. These ideas, I suppose, he got through a misunderstanding of the apostolic accounts, not perceiving that the things recorded there in figures were spoken by them mystically.


    For he evidently was a man of very limited capacity, as one may say, judging from his own statements. Yet it was owing to him that so many church fathers after him adopted a like opinion, urging in their own support the antiquity of the man, as, for instance, Irenaeus and whoever else they were who declared that they held like views. Papias also gives in his own work other accounts of the words of the Lord on the authority of Aristion, mentioned above, and traditions of the Elder John. To these we refer the curious; for our present purpose we will merely add to his words, which have been quoted above, a tradition which has been set forth through these sources concerning Mark, who wrote the Gospel:


    “And the Elder said this also: Mark, having become the interpreter of Peter, wrote down accurately everything that he remembered, without, however, recording in order what was either said or done by Christ. For neither did he hear the Lord nor did he follow him; but afterwards, as I said, (attended) Peter, who adapted his instructions to the needs of his hearers but had no design of giving a connected account of the Lord’s oracles. So then Mark made no mistake, while [he] thus wrote down some things as he remembered them; for [he] made it his one care not to omit anything that he heard, or [to] set down any false statement therein.”


    Such, then, is the account given by Papias concerning Mark. But concerning Matthew, the following statement is made [by him]:


    “So then Matthew composed the oracles in the Hebrew language, and each one interpreted them as he could.”


    The same writer employed testimonies from the First Epistle of John, and likewise from that of Peter. And he has related another story about a woman accused of many sins before the Lord, which the Gospel according'
translation:
  language: pt
  text: 'Cinco livros de Papias chegaram até nós com o título *Exposições dos Oráculos do Senhor*.[a] Irineu também os menciona como as únicas obras escritas por ele, nos seguintes termos: “Essas coisas são atestadas por escrito, no quarto de seus livros, por Papias, ouvinte de João, companheiro de Policarpo e homem dos tempos antigos. Pois ele compôs cinco livros.” Até aqui, Irineu.


    Contudo, no prefácio de suas exposições, o próprio Papias certamente não afirma ter sido ouvinte e testemunha ocular dos santos apóstolos. Ao contrário, pela linguagem que emprega, mostra que recebeu os ensinamentos da fé daqueles que haviam convivido com eles:


    “Não hesitarei em incluir para você, junto com minhas interpretações, tudo o que no passado aprendi cuidadosamente dos presbíteros e guardei cuidadosamente na memória, confirmando a sua verdade. Pois, ao contrário da maioria, eu não tinha prazer nos que falam muito, mas nos que ensinam a verdade; nem nos que transmitem mandamentos alheios, mas nos que transmitem os mandamentos dados pelo Senhor à fé e procedentes da própria Verdade. E, sempre que aparecia alguém que havia seguido os presbíteros, eu procurava saber o que eles haviam dito: o que André ou Pedro disseram, ou Filipe, ou Tomé, ou Tiago, ou João, ou Mateus, ou qualquer outro dos discípulos do Senhor; e o que dizem Aristião e o presbítero João, discípulos do Senhor. Pois eu não pensava que o conteúdo dos livros pudesse me trazer tanto proveito quanto as palavras de uma voz viva e permanente.”


    Aqui vale a pena observar que ele menciona duas vezes o nome de João. O primeiro é citado junto com Pedro, Tiago, Mateus e os demais apóstolos, referindo-se evidentemente ao evangelista. O outro João, porém, é mencionado depois de certo intervalo e colocado entre pessoas que não fazem parte do número dos apóstolos; Aristião vem antes dele, e Papias o chama expressamente de presbítero. Com isso, deixa bem claro que dizem a verdade os que afirmam ter havido na Ásia duas pessoas com esse nome e que existem em Éfeso dois túmulos, cada um dos quais ainda hoje é chamado túmulo de João. É importante observar isso, pois é provável que tenha sido o segundo — caso não se admita que foi o primeiro — quem viu o Apocalipse atribuído nominalmente a João. Papias, de quem agora falamos, reconhece ter recebido as palavras dos apóstolos daqueles que os haviam seguido, mas diz que ele próprio foi ouvinte de Aristião e do presbítero João. De fato, menciona-os muitas vezes pelo nome e também registra as
    tradições deles em seus escritos. Isso basta quanto a esses pontos, que, espero, não tenham sido apresentados inutilmente.


    Convém, porém, acrescentar às palavras de Papias citadas acima outras passagens suas, nas quais ele registra também alguns acontecimentos extraordinários que lhe chegaram por tradição. Já se afirmou que o apóstolo Filipe morou em Hierápolis com suas filhas; mas é preciso observar aqui que Papias, contemporâneo delas, relata ter ouvido das filhas de Filipe uma história extraordinária. Ele conta que, em seus dias, um homem ressuscitou dentre os mortos. Também narra outro fato extraordinário a respeito de Justo, chamado Barsabás: ele bebeu um veneno mortal e, pela graça do Senhor, não sofreu mal algum. Sobre esse Justo, o livro de Atos registra que, depois da ascensão do Salvador, os santos apóstolos o apresentaram juntamente com Matias e oraram para que fosse escolhido aquele que completaria o número deles no lugar do traidor Judas. A passagem diz mais ou menos o seguinte: “Então apresentaram dois: José, chamado Barsabás, cujo sobrenome era Justo, e Matias. E, orando, disseram...”


    O mesmo escritor registrou outras informações que lhe haviam chegado por tradição oral: certas parábolas incomuns do Salvador, alguns ensinamentos dele e outras declarações de caráter um tanto lendário. Entre elas, afirma que haverá um período de cerca de mil anos depois da ressurreição e que o reino de Cristo será estabelecido de forma material nesta terra.[b] Suponho que ele tenha chegado a essas ideias por compreender mal os relatos apostólicos, sem perceber que aquilo que os apóstolos haviam expressado em figuras devia ser entendido em sentido místico.


    Pois, a julgar por suas próprias declarações, ele evidentemente era um homem de entendimento muito limitado. Ainda assim, por causa dele, muitos autores eclesiásticos posteriores adotaram opinião semelhante, invocando em apoio próprio a antiguidade desse homem. Entre eles estavam Irineu e todos os demais que declararam sustentar ideias semelhantes. Em sua própria obra, Papias apresenta ainda outros relatos das palavras do Senhor com base na autoridade de Aristião, já mencionado, bem como tradições do presbítero João. A elas encaminhamos os interessados. Para o nosso propósito atual, acrescentaremos apenas às palavras já citadas uma tradição transmitida por essas fontes acerca de Marcos, o autor do Evangelho:


    “E o presbítero dizia também o seguinte: Marcos, tendo se tornado intérprete de Pedro,[c] escreveu com exatidão tudo aquilo de que se lembrava, embora não tenha registrado em ordem as coisas ditas ou feitas por Cristo. Pois ele não ouviu o Senhor nem o acompanhou; mais tarde, porém, como eu disse, acompanhou Pedro. Este adaptava seus ensinamentos às necessidades dos ouvintes, sem a intenção de compor uma exposição ordenada dos oráculos do Senhor. Assim, Marcos não cometeu erro ao escrever algumas coisas conforme se lembrava delas, pois teve o cuidado de não omitir nada do que havia ouvido nem registrar qualquer falsidade.”


    Esse é, portanto, o relato de Papias a respeito de Marcos. Quanto a Mateus, faz-se a seguinte declaração:


    “Mateus, portanto, reuniu os oráculos no dialeto hebraico,[d] e cada um os interpretava como podia.”


    O mesmo escritor utilizou testemunhos da Primeira Carta de João e também da de Pedro. Além disso, contou outra história a respeito de uma mulher acusada de muitos pecados diante do Senhor, história essa que o Evangelho segundo...[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Oráculos” traduz um termo que pode designar pronunciamentos, ditos ou ensinamentos autorizados; aqui não precisa significar apenas predições.
    reason: Esclarecer a amplitude semântica de um termo central do título e das citações.
  - marker: b
    text: O testemunho digitalizado fornecido apresenta, por corrupção de impressão ou OCR, “dez mil anos”; o texto grego conhecido de Eusébio traz “mil anos”.
    reason: Documentar uma correção textual relevante que altera substancialmente o número.
  - marker: c
    text: “Intérprete” pode indicar tradutor, intérprete oral ou alguém que transmitia e explicava a pregação de Pedro.
    reason: Preservar a ambiguidade histórica do termo, importante para compreender a relação entre Marcos e Pedro.
  - marker: d
    text: A expressão antiga “dialeto hebraico” não determina por si só se a referência é ao hebraico ou ao aramaico.
    reason: Evitar resolver uma questão linguística e histórica que o texto não esclarece.
  - marker: e
    text: O testemunho fornecido termina no meio da frase. A continuação não foi suprida nesta tradução.
    reason: Sinalizar com transparência a lacuna material do texto-base recebido.
lexical_decisions:
- source_word: λόγια (logia) / “oracles”
  choice: oráculos
  rationale: Preserva o termo tradicional e sua amplitude, que pode abranger ditos, pronunciamentos e ensinamentos do Senhor, sem reduzi-lo simplesmente a “palavras” ou a um gênero literário específico.
- source_word: πρεσβύτεροι / πρεσβύτερος (presbyteroi / presbyteros)
  choice: presbíteros / presbítero
  rationale: Mantém a designação histórica e evita decidir se, em cada ocorrência, o termo significa ocupante de um ofício eclesiástico ou simplesmente ancião pertencente a uma geração anterior.
- source_word: ἑρμηνευτής (hermēneutēs)
  choice: intérprete
  rationale: Conserva a ambiguidade entre intérprete oral, tradutor e mediador/expositor da pregação de Pedro.
- source_word: ζώσης φωνῆς καὶ μενούσης / “a living and abiding voice”
  choice: uma voz viva e permanente
  rationale: Reproduz a oposição entre livros e testemunho oral ainda vivo e duradouro, com formulação natural em português.
- source_word: Ἑβραΐδι διαλέκτῳ (Hebraidi dialektō)
  choice: no dialeto hebraico
  rationale: Preserva a formulação antiga sem identificar categoricamente a língua como hebraico clássico ou aramaico.
- source_word: χίλια ἔτη / “a thousand years”
  choice: cerca de mil anos
  rationale: O texto grego conhecido de Eusébio apresenta mil anos; a leitura “dez mil” do testemunho digitalizado resulta de corrupção tipográfica/OCR.
theological_decisions:
- issue: Natureza terrena do reino descrito por Papias
  choice: “o reino de Cristo será estabelecido de forma material nesta terra”
  alternative: “o reino de Cristo se realizará corporalmente sobre esta terra”
  rationale: Mantém tanto a posição atribuída a Papias quanto a avaliação crítica posterior de Eusébio, sem endossar nem suavizar a tensão milenarista.
- issue: Sentido místico das figuras apostólicas
  choice: “devia ser entendido em sentido místico”
  alternative: “foi dito de modo simbólico”
  rationale: Preserva a explicação hermenêutica dada pelo narrador, sem convertê-la em afirmação editorial da tradução.
- issue: Identidade dos dois Joões
  choice: Mantida como argumento do narrador, não como fato editorialmente confirmado
  alternative: Identificar diretamente o segundo João como autor do Apocalipse
