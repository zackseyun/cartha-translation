base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: pt
  text: 'Aqui começa o argumento do Evangelho segundo João.


    O Evangelho de João foi dado a conhecer e entregue às igrejas por João, enquanto ele ainda permanecia no corpo, conforme relatou certo homem chamado Papias, de Hierápolis, amado discípulo de João, em seus cinco livros exotéricos[a] — leia-se: exegéticos. E ele escreveu corretamente o Evangelho sob o ditado de João.[b]


    Manuscrito do Vaticano do século IX.


    XX


    Pois João, o último destes, cognominado Filho do Trovão, quando já era homem muito idoso — conforme Irineu, Eusébio e uma sucessão de historiadores dignos de confiança nos transmitiram —, por volta da época em que haviam surgido heresias terríveis, ditou o Evangelho a seu próprio discípulo, o virtuoso Papias de Hierápolis, a fim de completar o que faltava naqueles que, antes dele, haviam proclamado a palavra às nações por toda a terra.[c]


    Catena Patrum Graecorum sobre São João, publicada por B. Corder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito traz “exotéricos”; o editor propõe a correção “exegéticos”.
    reason: A leitura transmitida e a emenda editorial diferem de modo relevante.
  - marker: b
    text: A construção do testemunho atribui a Papias o registro escrito do Evangelho sob o ditado de João; a referência exata do pronome pode refletir a redação ou transmissão tardia do fragmento.
    reason: Evita ocultar uma possível dificuldade sintática e histórica do testemunho.
  - marker: c
    text: O material fornecido reúne aqui o texto numerado como Fragmento XX, embora a referência solicitada seja Fragmento XIX.
    reason: Esclarece o âmbito documental sem remover parte do texto fornecido.
lexical_decisions:
- source_word: argument
  choice: argumento
  rationale: Preserva o termo técnico do cabeçalho antigo, que pode designar um sumário ou prólogo, sem reduzir sua possível amplitude semântica.
- source_word: made known and given
  choice: dado a conhecer e entregue
  rationale: 'Mantém os dois movimentos distintos do testemunho: tornar público e transmitir às igrejas.'
- source_word: while he yet remained in the body
  choice: enquanto ele ainda permanecia no corpo
  rationale: Conserva o eufemismo antigo para estar vivo, em vez de o substituir silenciosamente por uma explicação.
- source_word: exoteric (read exegetical)
  choice: 'exotéricos — leia-se: exegéticos'
  rationale: Preserva tanto a leitura transmitida quanto a correção editorial indicada no testemunho.
- source_word: at the dictation of John
  choice: sob o ditado de João
  rationale: Expressa diretamente a alegação do fragmento de que Papias registrou por escrito aquilo que João ditava.
- source_word: Son of Thunder
  choice: Filho do Trovão
  rationale: Mantém a forma singular do testemunho fornecido, embora a expressão bíblica mais conhecida esteja no plural.
- source_word: fill up what was lacking
  choice: completar o que faltava
  rationale: Reproduz a ideia de suplementação dos relatos ou da proclamação anteriores sem especificar além do testemunho.
- source_word: the word
  choice: a palavra
  rationale: Mantém a formulação potencialmente teológica e sua ambiguidade, sem explicitar 'evangelho' ou 'mensagem'.
theological_decisions:
- issue: Identidade e relação de Papias com João
  choice: amado discípulo de João
  alternative: um discípulo amado por João
  rationale: Segue a construção do testemunho fornecido sem identificar Papias com o 'discípulo amado' do quarto Evangelho.
- issue: Autoria e produção do Evangelho de João
  choice: apresentar como alegação histórica do fragmento que João ditou e Papias escreveu
  alternative: harmonizar a alegação com teorias modernas de autoria ou redação
  rationale: A tradução deve preservar a afirmação do testemunho antigo, sem endossá-la nem corrigi-la teologicamente.
- issue: O que faltava nos predecessores
  choice: manter a referência aberta em 'naqueles que... haviam proclamado'
  alternative: especificar que faltava algo nos Evangelhos sinóticos
  rationale: O testemunho não identifica explicitamente os predecessores nem define com precisão a lacuna.
translation_notes:
  register: Português atual, digno e acessível, com leve preservação do tom documental antigo. Esta é uma tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego/latim permanece pendente. Nomes próprios seguem formas portuguesas correntes. O título latino da catena foi conservado por falta de dados bibliográficos seguros para uma forma expandida.
