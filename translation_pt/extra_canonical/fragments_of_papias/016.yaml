review_pass:
  verdict: revise
  source_fidelity: A tradução preserva de modo geral as alegações do testemunho tardio e a incerteza relativa a Papias, à ditação joanina e à enumeração dos fragmentos. Contudo, o conectivo adversativo de “But he wrote down...” deve ser mantido, e o título “argument” é mais bem vertido como “Introdução” no português atual, pois “argumento” sugere indevidamente uma linha de raciocínio, não o cabeçalho/sumário antigo.
  naturalness: O texto tem registro documental adequado e é amplamente legível. “Certo homem chamado Papias” é menos idiomático que “certo Papias”, e “Introdução ao Evangelho” comunica melhor a função do cabeçalho sem impor interpretação doutrinária.
  terminology: '“Evangelho”, “igrejas”, “Hierápolis”, “Irineu”, “Eusébio”, “Filho do Trovão”, “palavra” e a preservação de “exotéricos — leia-se: exegéticos” são adequados. Conserva-se “sob o ditado de João” como alegação do testemunho, com nota de cautela.'
  issues:
  - severity: medium
    issue: O adversativo “But” foi traduzido por “E”.
    rationale: A testemunha inglesa contrapõe a notícia de Papias em seus livros à alegação de que ele registrou o Evangelho sob ditado; “Mas” preserva essa relação textual.
  - severity: low
    issue: “Argumento do Evangelho” é um falso cognato funcional no cabeçalho.
    rationale: No uso português moderno, “argumento” normalmente designa raciocínio ou tese. “Introdução” transmite de forma natural a função de um argumentum/cabeçalho antigo, sem especificar excessivamente se se trata de prólogo ou sumário.
  - severity: low
    issue: “Certo homem chamado Papias” é desnecessariamente pesado.
    rationale: “Certo Papias” reproduz a indeterminação de “one Papias by name” com maior naturalidade.
