base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/013.yaml
  text: 'By this he speaks obscurely, referring, I suppose, to Papias of Hierapolis in Asia, who was a bishop at that time and flourished in the days of the holy Evangelist John. For this Papias, in the fourth book of his Dominical Expositions, mentioned foods among the sources of delights in the resurrection.... And Irenaeus of Lyons says the same thing in his fifth book Against Heresies and presents the aforementioned Papias in support of his statements.


    MAXIMUS THE CONFESSOR, Scholia on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
translation:
  language: pt
  text: 'Com isso, ele fala de maneira obscura, referindo-se, suponho, a Pápias de Hierápolis, na Ásia, que era bispo naquele tempo e viveu na época do santo evangelista João. Pois esse Pápias, no quarto livro de suas Exposições dos Oráculos do Senhor[a], mencionou alimentos entre as fontes de prazer na ressurreição....[b] E Irineu de Lião diz a mesma coisa no quinto livro de Contra as Heresias e apresenta o mencionado Pápias em apoio às suas afirmações.


    MÁXIMO, O CONFESSOR, Escólios sobre A Hierarquia Eclesiástica, de Dionísio, o Areopagita, capítulo 7.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título da obra de Pápias também pode ser vertido como «Exposições das Palavras do Senhor». A redação aqui depende do testemunho inglês fornecido; a revisão direta do grego ou do latim ainda está pendente.
    reason: Registra a incerteza lexical e documental em torno de «Dominical Expositions» sem sobrecarregar o texto principal.
  - marker: b
    text: As reticências pertencem ao testemunho disponível e indicam uma lacuna, omissão ou restauração editorial; não se sabe, com base no material fornecido, quanto texto falta.
    reason: Preserva e explica o sinal textual do testemunho, evitando que seja confundido com uma abreviação moderna desta tradução.
lexical_decisions:
- source_word: darkly indicating
  choice: fala de maneira obscura
  rationale: Mantém a ideia de uma referência indireta e difícil de discernir, sem explicitar além do testemunho disponível.
- source_word: flourished
  choice: viveu na época
  rationale: Neste contexto cronológico, a expressão indica que Pápias esteve ativo ou viveu no tempo de João; a formulação evita o lusismo menos transparente «floresceu».
- source_word: Dominical Expositions
  choice: Exposições dos Oráculos do Senhor
  rationale: Título tradicionalmente associado à obra de Pápias; «do Senhor» traduz o sentido de dominical, enquanto «oráculos» identifica de modo mais claro o conhecido título da obra, assinalando-se a incerteza em nota.
- source_word: viands
  choice: alimentos
  rationale: Equivalente moderno, amplo e natural para comidas ou mantimentos, sem o tom arcaico de «iguarias».
- source_word: delights
  choice: prazer
  rationale: Preserva o caráter concreto das delícias esperadas na ressurreição sem intensificar para «bem-aventuranças».
- source_word: produces in support
  choice: apresenta ... em apoio
  rationale: Expressa que Irineu cita ou invoca Pápias como testemunho favorável às suas afirmações.
theological_decisions:
- issue: Natureza dos prazeres na ressurreição
  choice: «alimentos entre as fontes de prazer na ressurreição»
  alternative: Espiritualizar a referência como símbolo de bênçãos celestiais
  rationale: O fragmento atribui a Pápias uma expectativa concreta relacionada a alimentos; a tradução conserva essa tensão escatológica sem aprová-la, rejeitá-la ou reinterpretá-la.
- issue: Relação cronológica de Pápias com João
  choice: «viveu na época do santo evangelista João»
  alternative: Afirmar que Pápias foi discípulo ou ouvinte direto de João
  rationale: O testemunho só afirma contemporaneidade; não se deve acrescentar uma relação discipular não declarada aqui.
- issue: Identidade de João
  choice: «santo evangelista João»
  alternative: «João, o presbítero»
  rationale: Mantém a identificação feita pelo próprio testemunho, sem resolver debates históricos externos sobre qual João estaria em vista.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Os nomes foram normalizados como Pápias, Hierápolis, Irineu de Lião, Máximo, Dionísio e Areopagita. Como o material de partida é um testemunho inglês de domínio público e a revisão das fontes grega/latina está pendente, a redação deve ser considerada provisória e evita alegações de precisão filológica direta.
