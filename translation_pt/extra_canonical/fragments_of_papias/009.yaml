review_pass:
  verdict: revise
  source_fidelity: 'O rascunho preserva adequadamente os elementos do testemunho inglês provisório: a lista de Pápias, Clemente, Panteno e Amônio; a qualificação de Pápias como discípulo do apóstolo reclinado junto ao peito de Cristo; e a interpretação da obra dos seis dias em referência a Cristo e à Igreja. Contudo, a construção «Partindo de ..., aqueles ... entendem» cria em português a impressão de que os próprios intérpretes partem de si mesmos. Uma reordenação segura torna explícita a enumeração sem acrescentar identificação ou doutrina. A conferência direta com o grego/latim continua pendente.'
  naturalness: A frase original é condensada e de sintaxe difícil. Em português moderno, é mais natural apresentar primeiro o grupo de «antigos e primeiros intérpretes» e então enumerar seus integrantes. «Ao entender» exprime a concordância interpretativa sem a construção pouco fluida «concordando entre si, entendem».
  terminology: «Intérpretes», «obra dos seis dias», «Cristo e sua Igreja» e os nomes aportuguesados são apropriados. Mantém-se «sacerdote dos alexandrinos», sem converter o título em cargo eclesiástico mais específico. A alusão ao apóstolo permanece sem identificação nominal.
  issues:
  - severity: medium
    issue: Construção sintática que altera a relação lógica da enumeração
    rationale: «Partindo de Pápias ... aqueles antigos e primeiros intérpretes» sugere que os intérpretes tomam Pápias, Clemente, Panteno e Amônio como ponto de partida, embora eles próprios sejam os intérpretes enumerados no testemunho. A reordenação elimina essa leitura indevida.
  revised_text: 'Entre esses antigos e primeiros intérpretes, que concordam entre si ao entender toda a obra dos seis dias como referente a Cristo e à sua Igreja,[a] estão Pápias, o Grande, de Hierápolis — discípulo do apóstolo que se reclinou junto ao peito de Cristo —, Clemente, Panteno, sacerdote dos alexandrinos, e Amônio, o grande erudito.


    ANASTÁSIO DO SINAI, Contempl. Anagog. in Hexaém. i.[b]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego ou do latim ainda está pendente. A construção do fragmento é sintaticamente condensada, e a pontuação e a delimitação da enumeração podem variar.
    reason: A fonte em língua antiga não foi disponibilizada para conferência, e o testemunho inglês preserva uma estrutura sintaticamente incerta.
  - marker: b
    text: 'A atribuição e o título abreviado foram preservados: Anastásio do Sinai, Contempl. Anagog. in Hexaém. i.'
    reason: Evita expandir ou normalizar conjecturalmente a referência bibliográfica antiga.
  revision_rationale: A revisão apenas reorganiza a frase para que Pápias, Clemente, Panteno e Amônio sejam entendidos como os «antigos e primeiros intérpretes» mencionados, em vez de serem apresentados como um ponto de partida externo para eles. Preservam-se a ambiguidade do testemunho, a alusão joanina não nomeada, o alcance de «toda a obra dos seis dias» e a referência bibliográfica abreviada.
