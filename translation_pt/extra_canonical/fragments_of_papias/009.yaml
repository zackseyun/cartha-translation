  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: pt
  text: 'Partindo de Pápias, o Grande, de Hierápolis, discípulo do apóstolo que se reclinou junto ao peito de Cristo, e também de Clemente, de Panteno, sacerdote dos alexandrinos, e de Amônio, o grande erudito, aqueles antigos e primeiros intérpretes, concordando entre si, entendem toda a obra dos seis dias como referente a Cristo e à sua Igreja.[a]


    ANASTÁSIO DO SINAI, Contempl. Anagog. in Hexaém. i.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego ou do latim ainda está pendente. A construção do fragmento é sintaticamente condensada, e a pontuação pode variar.
    reason: A fonte em língua antiga não foi disponibilizada para conferência, e o inglês preserva uma frase de estrutura incerta.
  - marker: b
    text: 'A atribuição e o título abreviado foram preservados: Anastásio do Sinai, Contempl. Anagog. in Hexaém. i.'
    reason: Evita expandir ou normalizar conjecturalmente a referência bibliográfica antiga.
lexical_decisions:
- source_word: Taking their start from
  choice: Partindo de
  rationale: Reproduz de modo natural a ideia de tomar esses autores como ponto de partida, sem especificar um sujeito ausente no fragmento.
- source_word: the disciple of the Apostle who leaned on Christ’s bosom
  choice: discípulo do apóstolo que se reclinou junto ao peito de Cristo
  rationale: Mantém a ligação sintática potencialmente ambígua do testemunho e conserva a alusão joanina sem identificar nominalmente o apóstolo.
- source_word: Pantanus the priest of the Alexandrians
  choice: Panteno, sacerdote dos alexandrinos
  rationale: Emprega a forma portuguesa corrente do nome e preserva o título e a relação com os alexandrinos sem ampliá-los para uma função eclesiástica mais específica.
- source_word: expositors
  choice: intérpretes
  rationale: Termo moderno e amplo para os antigos expositores das Escrituras.
- source_word: all the work of the six days
  choice: toda a obra dos seis dias
  rationale: Conserva a referência tradicional à criação em seis dias e o caráter abrangente de 'all'.
- source_word: as referring to
  choice: como referente a
  rationale: Expressa a leitura cristológica e eclesiológica sem afirmar que o próprio relato tenha apenas esse sentido.
theological_decisions:
- issue: Leitura dos seis dias em relação a Cristo e à Igreja
  choice: entendem toda a obra dos seis dias como referente a Cristo e à sua Igreja
  alternative: interpretam toda a obra dos seis dias exclusivamente como Cristo e a Igreja
  rationale: Preserva a afirmação tipológica do testemunho sem introduzir exclusividade nem apagar outros possíveis níveis de sentido.
- issue: Identidade do apóstolo reclinado junto a Cristo
  choice: o apóstolo que se reclinou junto ao peito de Cristo
  alternative: o apóstolo João
  rationale: O testemunho fornecido não dá o nome; a tradução mantém a alusão sem resolver explicitamente a identificação.
- issue: Vínculo de discipulado atribuído a Pápias
  choice: discípulo do apóstolo
  alternative: ouvinte do apóstolo
  rationale: Segue o testemunho inglês disponibilizado, mas sem harmonizá-lo com outros relatos antigos sobre Pápias.
translation_notes:
  register: Português moderno, digno e legível, com nomes próprios aportuguesados quando há forma corrente. A redação conserva o caráter fragmentário e erudito da citação. Por depender apenas de um testemunho inglês de domínio público, esta versão deve ser considerada provisória até a revisão na língua antiga.
