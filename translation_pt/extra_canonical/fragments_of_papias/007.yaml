  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: pt
  text: 'Quanto, porém, à inspiração do livro — isto é, do Apocalipse —, [há uma lacuna no texto] Gregório[a] (quero dizer, o Teólogo) e Cirilo, bem como homens de uma geração mais antiga — [Papias?][b], Irineu, Metódio e Hipólito — dão testemunho de sua autenticidade.


    ANDRÉ DE CESAREIA, prefácio ao Apocalipse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho fornecido está mutilado neste ponto. A identificação de Gregório e o epíteto «o Teólogo» refletem a leitura contextual provável, mas devem ser conferidos no texto grego.
    reason: Sinalizar de forma transparente a lacuna e o caráter provisório da reconstrução.
  - marker: b
    text: O testemunho impresso traz uma forma corrompida («Pz»); «Papias» é uma reconstrução provável, ainda dependente de conferência no original.
    reason: Preservar a incerteza textual ligada ao nome que dá relevância ao fragmento.
lexical_decisions:
- source_word: inspiration
  choice: inspiração
  rationale: Mantém o termo teológico do testemunho inglês sem especificar uma teoria particular de inspiração.
- source_word: the book (i.e. the Apocalypse)
  choice: o livro — isto é, o Apocalipse —
  rationale: Identifica de modo claro e natural o livro em questão, preservando a explicação parentética.
- source_word: the Divine / the Theologian
  choice: o Teólogo
  rationale: No contexto, trata-se de um epíteto de Gregório, não de uma afirmação de que ele seja divino; «o Teólogo» é a forma historicamente reconhecível e evita uma leitura teologicamente inadequada.
- source_word: genuineness
  choice: autenticidade
  rationale: Expressa a ideia de reconhecimento do livro como genuíno sem ampliar a afirmação para além do testemunho disponível.
- source_word: bear testimony
  choice: dão testemunho
  rationale: Conserva o caráter formal e histórico da declaração em português corrente.
theological_decisions:
- issue: Alcance de «inspiração» e «autenticidade»
  choice: Manter os dois conceitos distintos
  alternative: Traduzir ambos como uma afirmação geral de canonicidade
  rationale: O testemunho distingue a inspiração do livro da evidência oferecida por autores anteriores quanto à sua autenticidade; fundi-las resolveria indevidamente uma possível tensão histórica e teológica.
- issue: Epíteto atribuído a Gregório
  choice: «o Teólogo»
  alternative: «o Divino»
  rationale: A leitura contextual provável é o título tradicional de Gregório, o Teólogo. A forma evita sugerir que Gregório seja chamado de divino em sentido ontológico.
- issue: Identificação de Papias
  choice: Registrar «[Papias?]» como reconstrução incerta
  alternative: Imprimir «Papias» sem ressalva ou conservar a forma corrompida «Pz»
  rationale: A identificação é muito provável e explica a inclusão entre testemunhas antigas, mas o texto fornecido está corrompido e a revisão direta do original ainda está pendente.
translation_notes:
  register: Português moderno, digno e acessível, com nomes próprios normalizados segundo o uso corrente. Como o testemunho inglês fornecido apresenta grave corrupção e uma lacuna, a tradução não tenta ocultar a perda textual. A redação é necessariamente provisória até a revisão direta do grego/latim e de uma edição crítica.
