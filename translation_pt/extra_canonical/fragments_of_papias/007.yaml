review_pass:
  verdict: revise
  source_fidelity: 'O testemunho inglês fornecido está tipograficamente corrompido, mas o contexto preserva a sequência provável: o Apocalipse; Gregório, o Teólogo; Cirilo; e os autores mais antigos, incluindo possivelmente Papias. A tradução deve assinalar as reconstruções sem introduzir uma lacuna textual independente onde se propõe uma leitura contextual.'
  naturalness: O registro é em geral natural e adequado. Contudo, «[há uma lacuna no texto] Gregório» interrompe artificialmente a sintaxe e torna menos claro que «Gregório, o Teólogo» é uma reconstrução editorial contínua.
  terminology: «caráter inspirado», «o Teólogo», «atestam» e «autenticidade» reproduzem com clareza o teor histórico-teológico sem converter o testemunho numa afirmação doutrinária mais ampla. Os nomes são correntes em português.
  issues:
  - severity: medium
    issue: A indicação de lacuna foi inserida no corpo antes de «Gregório», embora a nota proponha precisamente uma reconstrução contextual para esse trecho.
    rationale: A fonte apresentada é defeituosa, mas a tradução não deve simultaneamente declarar uma lacuna naquele ponto e preencher a sequência como se a lacuna fosse um elemento textual separado. A incerteza é mais corretamente tratada em nota.
  - severity: low
    issue: «à inspiração do livro» é possível, mas «ao caráter inspirado do livro» explicita melhor a predicação sem ampliar seu alcance.
    rationale: A formulação evita sugerir uma teoria específica de inspiração e permanece próxima do sentido atribuído ao testemunho.
  revised_text: 'Quanto ao caráter inspirado do livro — isto é, o Apocalipse —, Gregório, o Teólogo[a], e Cirilo, bem como homens de uma geração mais antiga — [Papias?][b], Irineu, Metódio e Hipólito — atestam a sua autenticidade.


    ANDRÉ DE CESAREIA, prefácio ao Apocalipse.'
  revised_footnotes:
  - marker: a
    text: O testemunho inglês fornecido está corrompido neste ponto. «Gregório, o Teólogo» é uma reconstrução contextual provável, que deve ser conferida numa edição do texto grego.
    reason: Assinalar que o nome e o epíteto foram reconstruídos sem introduzir no texto uma lacuna editorial autônoma.
  - marker: b
    text: O testemunho impresso traz uma forma corrompida («Pz»); «Papias» é uma reconstrução provável, ainda dependente de conferência no original.
    reason: Preservar a incerteza textual ligada ao nome que dá relevância ao fragmento.
  revision_rationale: A revisão conserva o conteúdo e as incertezas do rascunho, mas remove a sinalização de uma lacuna no corpo do texto que conflita com a reconstrução imediatamente proposta. Também torna mais precisa a expressão referente à inspiração, sem impor interpretação confessional.
