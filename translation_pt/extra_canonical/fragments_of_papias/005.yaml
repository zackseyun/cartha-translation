review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a estrutura e as principais distinções do testemunho: os dois João, o contraste entre o que os apóstolos «haviam dito» e o que Aristião e João, o Ancião, «estavam dizendo», a atribuição histórica das epístolas posteriores e a expressão «na carne». Contudo, omite a qualificação parentética do testemunho quanto ao episcopado de Pápias e traduz de forma excessivamente determinada a expressão editorial incerta «in (the persons of) authors».'
  naturalness: O português é claro, moderno e de registro apropriado. Ajustes pontuais tornam mais idiomáticos «autoridades» e «a leitura de livros», e evitam que «na pessoa de seus autores» pareça afirmar sem ressalva que os interlocutores vivos eram os autores dos livros.
  terminology: «Ouvinte de João», «João, o Ancião», «voz viva», «um milênio» e «na carne» são escolhas adequadas. «Declarações sem critério» reproduz melhor o sentido não sexual de «promiscuous statements» do que «relatos indiscriminados». A nota sobre a voz viva deve indicar a incerteza textual sem converter a glosa editorial em sentido textual certo.
  issues:
  - severity: medium
    issue: A qualificação parentética referente ao episcopado de Pápias foi suprimida.
    rationale: O testemunho diz «a hearer of John, (and) bishop of Hierapolis». Como os parênteses sinalizam uma qualificação editorial ou textual, ela deve ser conservada, em vez de afirmar diretamente «e bispo».
  - severity: medium
    issue: «Na pessoa de seus autores» apresenta como sentido definido uma expansão editorial incerta.
    rationale: O próprio testemunho inglês põe «the persons of» entre parênteses, e «authors» é problemático no contexto da preferência por transmissão viva. A tradução deve preservar a imagem da voz viva e remeter a qualificação incerta à nota, sem identificar dogmaticamente os transmissores como autores.
  - severity: low
    issue: Algumas formulações podem aproximar-se mais do testemunho e do uso português corrente.
    rationale: «Declarações sem critério», «tem os apóstolos por autoridades» e «os livros não me aproveitam tanto» são mais diretos e mantêm o contraste do texto.
  revised_text: 'Pápias, ouvinte de João, (e) bispo de Hierápolis, na Ásia, escreveu apenas cinco livros, aos quais deu o título de Exposição dos discursos do Senhor. Neles, ao afirmar em seu prefácio que não segue declarações sem critério, mas tem os apóstolos por autoridades, diz:


    “Eu costumava investigar o que André, ou Pedro, ou Filipe, ou Tomé, ou Tiago, ou João, ou Mateus, ou qualquer outro dos discípulos do Senhor havia dito; e o que Aristião e João, o Ancião, discípulos do Senhor, estavam dizendo. Pois os livros não me aproveitam tanto quanto a voz viva, que ainda hoje ressoa claramente.”[a]


    Disso fica claro que, na própria lista de nomes, há um João contado entre os apóstolos e outro, João, o Ancião, que ele enumera depois de Aristião. Mencionamos esse fato por causa da declaração feita acima, que registramos com base na autoridade de muitos: as duas epístolas posteriores de João não são obra do apóstolo, mas do Ancião. Diz-se que esse Pápias propagou a tradição judaica de um milênio; ele foi seguido por Irineu, Apolinário e outros, os quais afirmam que, depois da ressurreição, o Senhor reinará na carne com os santos.[b]


