lexical_decisions:
- source_word: hearer of John
  choice: ouvinte de João
  rationale: Preserva a designação antiga e sua possível implicação de contato pessoal, sem ampliá-la para “discípulo”.
- source_word: An Exposition of Discourses of the Lord
  choice: Exposição dos discursos do Senhor
  rationale: Mantém o caráter de título e traduz “discourses” de modo amplo, sem restringi-lo a “ditos” isolados.
- source_word: promiscuous statements
  choice: relatos indiscriminados
  rationale: Expressa a ideia de informações recolhidas sem critério, evitando o sentido sexual moderno de “promíscuo”.
- source_word: the Elder John
  choice: João, o Ancião
  rationale: Conserva o título distintivo e a separação sugerida entre os dois personagens chamados João.
- source_word: living voice
  choice: voz viva
  rationale: Mantém a imagem tradicional e o contraste entre livros e testemunho oral presente.
- source_word: Millennium
  choice: um milênio
  rationale: Traduz o período de mil anos sem introduzir o rótulo doutrinário posterior “milenismo”.
- source_word: in the flesh
  choice: na carne
  rationale: Conserva a expressão concreta e teologicamente carregada, sem interpretá-la por paráfrase.
- source_word: render ... into another tongue
  choice: verter ... para outra língua
  rationale: Emprega linguagem portuguesa natural e digna para o ato de tradução literária.
theological_decisions:
- issue: Identidade dos dois personagens chamados João
  choice: Preservar a distinção feita pelo autor entre o João contado entre os apóstolos e João, o Ancião
  alternative: Identificar explicitamente o primeiro como João, filho de Zebedeu, ou fundir os dois personagens
  rationale: O testemunho argumenta pela distinção, mas não fornece no trecho uma identificação adicional que deva ser inserida na tradução.
- issue: Autoria das duas epístolas posteriores de João
  choice: Apresentar a atribuição ao Ancião como declaração relatada pelo autor
  alternative: Endossá-la como conclusão editorial da tradução ou rejeitá-la
  rationale: A tradução deve preservar o caráter histórico da alegação sem decidir a questão canônica.
- issue: Reinado milenar e reinado “na carne”
  choice: Manter literalmente “um milênio” e “na carne”
  alternative: Parafrasear como uma forma específica de milenismo ou espiritualizar o reinado
  rationale: A formulação é historicamente e teologicamente disputada; a tradução não deve harmonizá-la com sistemas posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os títulos históricos e a estrutura fragmentária. Corrigiram-se apenas falhas evidentes de digitalização do testemunho; por faltar revisão direta do grego/latim, o texto deve ser tratado como minuta provisória baseada no testemunho inglês público fornecido.
