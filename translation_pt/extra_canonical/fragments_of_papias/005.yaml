base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/005.yaml
  text: 'Papias, a hearer of John, (and) bishop of Hierapolis in Asia, wrote only five books, which he entitled An Exposition of Discourses of the Lord. Wherein, when he asserts in his preface that he is not following pro-[m]iscuous statements, but has the Apostles as his authorities, he says:


    “I used to inquire what had been said by Andrew, or by [Pe]ter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion [a]nd the Elder John, the disciples of the Lord, were saying. [F]or books to read do not profit me so much as the living [v]oice clearly sounding up to the present day in (the persons of) authors.”


    From which it is clear that in his list of names itself there is one John who is reckoned among the Apostles, and another, the Elder John, whom he enumerates after Aristion. We have mentioned this fact on account of the statement made above, which we have recorded on the authority of very — many, that the two later epistles of John are not (the work) of the Apostle, but of the Elder. This (Papias) is said to have promulgated the Jewish tradition of a Millennium, and he is followed by Irenaeus, Apollinarius, and the others, who say that after the resurrection the Lord will reign in the flesh with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    Further, a false rumour has reached me that the books of Josephus and the writings of Papias and Polycarp have been translated by me; but I have neither leisure nor strength to render such works as these with corresponding elegance into another tongue.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
translation:
  language: pt
  text: 'Pápias, ouvinte de João e bispo de Hierápolis, na Ásia, escreveu apenas cinco livros, aos quais deu o título de Exposição dos discursos do Senhor. Neles, ao afirmar no prefácio que não segue relatos indiscriminados, mas toma os apóstolos como suas autoridades, diz:


    “Eu costumava investigar o que André havia dito, ou Pedro, ou Filipe, ou Tomé, ou Tiago, ou João, ou Mateus, ou qualquer outro dos discípulos do Senhor; e o que Aristião e João, o Ancião, discípulos do Senhor, estavam dizendo. Pois a leitura de livros não me traz tanto proveito quanto a voz viva, que ainda hoje ressoa claramente na pessoa de seus autores.”[a]


    Disso fica claro que, na própria lista de nomes, há um João contado entre os apóstolos e outro, João, o Ancião, que ele enumera depois de Aristião. Mencionamos esse fato por causa da declaração feita acima, que registramos com base na autoridade de muitíssimos: as duas epístolas posteriores de João não são obra do apóstolo, mas do Ancião. Diz-se que esse Pápias difundiu a tradição judaica de um milênio; seguem-no Irineu, Apolinário e outros, os quais afirmam que, depois da ressurreição, o Senhor reinará na carne com os santos.[b]


    JERÔNIMO, Sobre os homens ilustres 18.


    VIII


    Além disso, chegou até mim o falso rumor de que eu teria traduzido os livros de Josefo e os escritos de Pápias e Policarpo. Não tenho, porém, nem tempo nem forças para verter obras como essas para outra língua com elegância correspondente.


    JERÔNIMO, A Lucínio, Carta 71 (28), capítulo 5.


    [a] A redação desta citação é preservada aqui por meio de um testemunho latino e foi traduzida provisoriamente a partir da antiga versão inglesa fornecida; a formulação grega/latina requer conferência direta. “Na pessoa de seus autores” explicita uma indicação editorial do testemunho inglês e pode também ser entendida de modo mais geral como referência aos transmissores vivos.


    [b] “Na carne” conserva a formulação teologicamente significativa do testemunho, sem decidir se ela descreve a condição do Senhor ressuscitado, a esfera concreta do reinado ou ambas.'
