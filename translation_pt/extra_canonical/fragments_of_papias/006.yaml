translation:
  language: pt
  text: 'Irineu, discípulo de Pápias, que foi ouvinte de João, o Eva[…], relata.


    — Jerônimo, A Teodora, Carta 75 (29), capítulo 3.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Irenzeus
  choice: Irineu
  rationale: Emprega-se a forma portuguesa consagrada do nome, correspondente a Irenaeus, corrigindo a grafia anômala do testemunho inglês.
- source_word: disciple
  choice: discípulo
  rationale: Equivalente direto e natural, sem especificar além do testemunho a natureza dessa relação.
- source_word: hearer
  choice: ouvinte
  rationale: Preserva a afirmação histórica de contato auditivo sem ampliá-la para uma relação formal de discipulado.
- source_word: relates
  choice: relata
  rationale: Mantém o presente e o sentido introdutório do testemunho.
- source_word: ad Theodoram
  choice: A Teodora
  rationale: Traduz o título latino da epístola em português claro e convencional.
theological_decisions:
- issue: Identidade de João e expressão truncada “John the Eva”
  choice: João, o Eva[…]
  alternative: João, o Evangelista
  rationale: Como a revisão direta do grego/latim está pendente e o testemunho fornecido termina de modo truncado, não se completa conjecturalmente o título nem se resolve a identidade de João.
translation_notes:
  register: Português atual, sóbrio e legível, com nomes próprios em suas formas portuguesas consagradas. Por exigência de correspondência entre nota e texto, o marcador [a] deve acompanhar a lacuna indicada.
