review_pass:
  verdict: revise
  source_fidelity: A relação de audição deve referir-se inequivocamente a Pápias, não a Irineu. O testemunho inglês recebido está truncado em “John the Eva”; portanto, não é seguro completar “Evangelista”.
  naturalness: A redação é em geral clara e sóbria, mas a oração relativa após “Pápias” pode ser lida como referente a Irineu. Uma reformulação mínima elimina essa ambiguidade sem suplementar o texto danificado.
  terminology: “Irineu”, “Pápias”, “discípulo” e “ouvinte” são formas adequadas. A sequência truncada “o Eva[…]” deve ser mantida, pois reproduz a interrupção do testemunho sem conjectura.
  issues:
  - severity: medium
    issue: Antecedente potencialmente ambíguo de “que foi ouvinte”.
    rationale: Em “Irineu, discípulo de Pápias, que foi ouvinte...”, a oração relativa pode ser entendida como qualificando Irineu. Pelo testemunho, Pápias é quem é descrito como ouvinte de João.
  revised_text: 'Irineu, discípulo de Pápias — ouvinte de João, o Eva[…] —, relata.


    —Jerônimo, A Teodora, Carta 75 (29), capítulo 3.'
  revised_footnotes: []
  revision_rationale: A aposição “ouvinte de João” fixa Pápias como o referente histórico e conserva a expressão interrompida “o Eva[…]”, sem completar conjecturalmente o título de João. A citação é mantida em português.
