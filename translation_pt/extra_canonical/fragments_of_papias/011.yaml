base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/011.yaml
  text: 'The blessing thus foretold belongs undoubtedly to the times of the Kingdom, when the righteous shall rise from the dead and reign, when too creation, renewed and freed from bondage, shall produce a wealth of food of all kinds from the dew of heaven and from the fatness of the earth; as the elders, who saw John the disciple of the Lord, relate that they had heard from him how the Lord used to teach concerning those times, and to say:


    “The days will come, in which vines shall grow, each having ten thousand shoots, and on each shoot ten thousand branches, and on each branch again ten thousand twigs, and on each twig ten thousand clusters, and on each cluster ten thousand grapes; and each grape, when pressed, shall yield five-and-twenty measures of wine. And when any of the saints shall have taken hold of [o]ne of their clusters, another shall cry, ‘I am a better cluster; take me, bless the Lord through me.’ Likewise also a grain of wheat shall produce ten thousand heads, and every head shall [h]ave ten thousand grains, and every grain ten pounds of fine [fl]our, bright and clean; and the other fruits, seeds, and grass shall produce in similar proportions. And all the animals, using these fruits which are products of the soil, shall become in their [t]urn peaceable and harmonious, obedient to man in all subjection.”


    “[These are the] things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesseth in writing in the fourth of his books, [for there] are five books composed by him.” And he added, saying:


    “But these things are credible to them that believe.”


    And when Judas the traitor did not believe, and asked, “How shall such growths be accomplished by the Lord?” he relates that the Lord said, “They shall see, who shall come to these (times).”


    Irenæus, Haer. v. 33. 3–4.'
translation:
  language: pt
  text: 'A bênção assim anunciada pertence, sem dúvida, aos tempos do Reino, quando os justos ressuscitarão dentre os mortos e reinarão. Então também a criação, renovada e liberta da escravidão, produzirá abundância de toda espécie de alimento, graças ao orvalho do céu e à fertilidade da terra. Assim relatam os anciãos que viram João, discípulo do Senhor: eles diziam ter ouvido dele como o Senhor costumava ensinar a respeito daqueles tempos, dizendo:


    “Virão dias em que crescerão videiras, cada uma com dez mil brotos; em cada broto haverá dez mil ramos; em cada ramo, por sua vez, dez mil rebentos; em cada rebento, dez mil cachos; e em cada cacho, dez mil uvas. Cada uva, quando espremida, produzirá vinte e cinco medidas de vinho.[a] Quando um dos santos pegar um desses cachos, outro clamará: ‘Eu sou um cacho melhor! Pegue-me e, por meio de mim, bendiga o Senhor.’ Do mesmo modo, um grão de trigo produzirá dez mil espigas; cada espiga terá dez mil grãos; e cada grão, dez libras de farinha fina, clara e pura.[b] Os demais frutos, as sementes e a erva produzirão em proporções semelhantes. E todos os animais, alimentando-se desses frutos produzidos pelo solo, se tornarão, por sua vez, pacíficos e harmoniosos, inteiramente submissos ao ser humano.”


    “Essas coisas são atestadas por escrito, no quarto de seus livros — pois ele compôs cinco livros —, por Papias, ouvinte de João, companheiro de Policarpo e homem digno dos tempos antigos.” E ele acrescentou:


    “Essas coisas, porém, são dignas de crédito para os que creem.”


    E, quando Judas, o traidor, não creu e perguntou: “Como o Senhor realizará tamanha produção?”, Papias relata que o Senhor respondeu: “Os que chegarem àqueles tempos verão.”


    — Irineu, Contra as Heresias 5.33.3–4.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A unidade chamada aqui de “medida” não é especificada no testemunho de base; por isso, não foi convertida em litros.
    reason: Preservar a indefinição quantitativa da fonte disponível.
  - marker: b
    text: “Libra” representa uma antiga unidade de peso. O valor exato pode variar conforme o sistema pressuposto, por isso não foi convertido.
    reason: Evitar precisão moderna indevida.
