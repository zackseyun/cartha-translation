    reason: Declarar com transparência a proveniência textual e a limitação da base de trabalho.
lexical_decisions:
- source_word: Kingdom
  choice: Reino
  rationale: Mantém o termo escatológico tradicional sem especificar além do testemunho preservado.
- source_word: fatness of the earth
  choice: fertilidade da terra
  rationale: Expressa naturalmente em português a ideia idiomática de riqueza ou fecundidade do solo, sem a tradução pouco clara “gordura da terra”.
- source_word: shoots / branches / twigs
  choice: brotos / ramos / rebentos
  rationale: Conserva os três níveis distintos da imagem hiperbólica da videira em linguagem compreensível.
- source_word: measures
  choice: medidas
  rationale: Preserva a indefinição da unidade no testemunho fornecido, evitando uma conversão quantitativa não sustentada.
- source_word: credible
  choice: dignas de crédito
  rationale: Reproduz o sentido epistêmico de algo crível, em registro digno e natural.
- source_word: growths
  choice: tamanha produção
  rationale: No contexto, refere-se à produção extraordinária da terra, não apenas ao crescimento biológico.
theological_decisions:
- issue: Natureza e cronologia dos “tempos do Reino”
  choice: Manter a afirmação concreta de ressurreição, reinado e renovação da criação
  alternative: Interpretar ou qualificar o trecho como literal, simbólico, milenar ou não milenar
  rationale: O fragmento apresenta a expectativa sem discutir esquemas escatológicos concorrentes; a tradução não deve resolver essa tensão denominacionalmente.
- issue: Identidade de João
  choice: Traduzir simplesmente “João, discípulo do Senhor”
  alternative: Identificá-lo explicitamente como o apóstolo João ou como João, o Presbítero
  rationale: A identificação histórica é debatida, e o testemunho fornecido não justifica resolver a ambiguidade.
- issue: Autoria da citação final sobre Judas
  choice: Usar “Papias relata” de acordo com a construção imediata do testemunho
  alternative: Atribuir diretamente todo o relato a Irineu ou declarar que a fala é historicamente autêntica
  rationale: A redação preservada transmite uma cadeia de relato; a tradução mantém essa mediação sem afirmar mais do que a fonte.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O registro é digno sem arcaísmos como “testemunha por escrito” ou “hão de”. Corrigiram-se silenciosamente falhas evidentes de OCR do testemunho inglês. Mantiveram-se a hipérbole acumulativa, as falas em discurso direto e a tensão escatológica do fragmento.
