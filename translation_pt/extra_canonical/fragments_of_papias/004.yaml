base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/004.yaml
  text: 'Papias, bishop of Hierapolis, who was a disciple of John the Divine [and] a companion of Polycarp, wrote five books of Oracles of the Lord, [and] when giving a list of the apostles, after Peter and John, Philip and Thoma[s], and Matthew, he included among the disciples of the Lord Aristion [and] a second John, whom also he called “the Elder.” [He says] that some [think] that this John is the author of the two short and catholic epistles, [which] are published in the name of John; and he gives as the reason that the primitive (fathers) only accept the first epistle. Some too have wrong[ly] considered the Apocalypse also to be his—that is, the Elder John’s—[work]. Papias too is in error about the Millennium, and from him Iren[aeus] also [erred].


    Papias in his second book says that John the Divine and James his broth[er] were killed by the Jews. The aforesaid Papias stated on the authority of the daughters of Philip that Barsabas, who is also called Justus, when challenged by the unbelievers drank serpent’s poison in the name of the Lord, and was shielded from all harm. He makes also other marvellous statements, and particularly about the mother of Manaim who was raised from the dead. As for those who were raised from the dead by Christ, [he states] that they survived till the time of Hadrian.


    PHILIPPUS OF SIDE (?) Afist. Christ.


    VI.


    After Domitian Nerva reigned one year, who recalled John from the [i]sland (i.e. Patmos), and allowed him to dwell in Ephesus. He was at that time the sole survivor of the twelve apostles, and after writing his Gospel received the honour of martyrdom. For Papias, bishop of Hierapolis, who was an eye-witness of him, in the second book of the Oracles of the Lord says that he was killed by the Jews, and thereby evidently fulfilled, together with his brother, Christ’s prophecy concerning them, and their own confession and undertaking on His behalf. For when the Lord said to them, “Are ye able to drink of the cup that I drink of?” and they readily assented and agreed, He said, “My cup shall ye drink, and with the baptism that I am [ba]ptized [with] shall ye be baptized.” And reasonably so, for it is impossible for God to lie. So too the learned Origen affirms in his interpretation of S. Matthew’s Gospel that John was martyred, declaring that he had learnt the fact from the successors of the
    apostles. And indeed the well-informed Eusebius also in his Ecclesiastical History says: “Thomas received by lot Parthia, but John [received] Asia, where also he made his residence and died at [E]phesus[?].”


    GEORGIUS HAMARTOLUS, Chronicon.'
translation:
  language: pt
  text: 'Pápias, bispo de Hierápolis, que foi discípulo de João, o Teólogo,[a] e companheiro de Policarpo, escreveu cinco livros dos Oráculos do Senhor. Ao apresentar uma lista dos apóstolos, depois de Pedro e João, Filipe, Tomé e Mateus, incluiu entre os discípulos do Senhor Aristião e um segundo João, a quem também chamou de “o Ancião”. [Ele diz] que alguns consideram esse João o autor das duas epístolas breves e católicas[b] publicadas em nome de João; e dá como razão o fato de que os antigos pais[c] aceitam somente a primeira epístola. Alguns também atribuíram erroneamente o Apocalipse a ele, isto é, a João, o Ancião. Pápias também erra a respeito do Milênio, e, seguindo-o, Irineu igualmente errou.


    Pápias diz em seu segundo livro que João, o Teólogo, e Tiago, seu irmão, foram mortos pelos judeus. O referido Pápias afirmou, com base no testemunho das filhas de Filipe, que Barsabás, também chamado Justo, desafiado pelos descrentes, bebeu veneno de serpente em nome do Senhor e ficou protegido de todo mal. Ele faz ainda outras afirmações maravilhosas, especialmente a respeito da mãe de Manaim, que foi ressuscitada dentre os mortos. Quanto aos que Cristo ressuscitou dentre os mortos, [ele afirma] que sobreviveram até o tempo de Adriano.


    FILIPE DE SIDE (?), História Cristã.[d]


    VI


    Depois de Domiciano, Nerva reinou por um ano. Ele chamou João de volta da ilha — isto é, Patmos — e permitiu que morasse em Éfeso. Naquele tempo, João era o único sobrevivente dos doze apóstolos e, depois de escrever seu Evangelho, recebeu a honra do martírio. Pois Pápias, bispo de Hierápolis, que foi testemunha ocular dele, diz no segundo livro dos Oráculos do Senhor que João foi morto pelos judeus. Assim, junto com seu irmão, cumpriu claramente a profecia de Cristo a respeito deles, bem como a confissão e o compromisso que eles próprios assumiram por causa dele. Pois, quando o Senhor lhes perguntou: “Vocês podem beber o cálice que eu bebo?”, eles prontamente responderam que sim e concordaram. Então ele disse: “Vocês beberão o meu cálice e serão batizados com o batismo com que eu sou batizado”. E isso é razoável, pois é impossível que Deus minta. Do mesmo modo, o erudito Orígenes afirma, em sua interpretação do Evangelho de São Mateus, que João foi martirizado, declarando ter aprendido
    esse fato com os sucessores dos apóstolos. E também o bem-informado Eusébio diz em sua História Eclesiástica: “Tomé recebeu por sorte a Pártia; João, porém, recebeu a Ásia, onde fixou residência e morreu em Éfeso”.[e]


    JORGE HAMÁRTOLO, Crônica.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “João, o Teólogo” traduz o título tradicional também vertido como “João, o Divino”.
    reason: Esclarecer um título antigo que pode soar ambíguo em português moderno.
  - marker: b
    text: Aqui, “católicas” significa “gerais” ou “universais”, não uma referência à denominação católica romana.
    reason: Evitar anacronismo denominacional.
  - marker: c
    text: A expressão “antigos pais” é uma restauração provável de um texto transmitido de forma imperfeita.
    reason: Sinalizar a incerteza do testemunho e da restauração inglesa fornecida.
  - marker: d
    text: A atribuição a Filipe de Side e o título da obra são incertos no testemunho fornecido.
    reason: O cabeçalho preservado traz ponto de interrogação e forma abreviada ou corrompida.
  - marker: e
    text: O testemunho impresso fornecido marca como incertas algumas letras de “Éfeso”; o nome, porém, é a restauração contextual esperada.
    reason: Registrar a corrupção material sem sobrecarregar o corpo do texto.
lexical_decisions:
- source_word: John the Divine
  choice: João, o Teólogo
  rationale: Título tradicional mais natural em português para o grego Theologos; evita o sentido moderno potencialmente equívoco de “o Divino”.
- source_word: Oracles of the Lord
  choice: Oráculos do Senhor
  rationale: Mantém o título tradicional da obra de Pápias sem reduzir logia a simples “palavras” ou “ditos”.
- source_word: the Elder
  choice: o Ancião
  rationale: Preserva a designação distintiva do segundo João e seu valor histórico, em vez de tratá-la automaticamente como um cargo eclesiástico.
- source_word: catholic epistles
  choice: epístolas breves e católicas
  rationale: Conserva o sentido antigo de cartas gerais ou universais; uma nota impede a leitura denominacional moderna.
- source_word: Millennium
  choice: Milênio
  rationale: Mantém o termo técnico da discussão escatológica presente no testemunho, sem explicar ou endossar a crítica do autor.
- source_word: received by lot
  choice: recebeu por sorte
  rationale: Preserva a ideia de distribuição por sorteio das regiões missionárias.
- source_word: Asia
  choice: Ásia
  rationale: Mantém o nome histórico da província romana; o contexto de Éfeso ajuda a distingui-la do continente moderno.
theological_decisions:
- issue: Identidade dos dois Joões
  choice: Manter “um segundo João” e “João, o Ancião” como formulações distintas
  alternative: Identificar o Ancião com o apóstolo João
  rationale: O fragmento distingue as figuras, mas relata opiniões de terceiros; a tradução não deve resolver uma questão histórica e teológica disputada.
- issue: Autoria das epístolas e do Apocalipse
  choice: Apresentar as atribuições como opiniões relatadas e, no caso do Apocalipse, como julgamento negativo do testemunho
  alternative: Afirmar ou negar diretamente a autoria joanina
  rationale: Preserva a distância enunciativa e não transforma o comentário tardio em decisão canônica.
- issue: Milênio
  choice: Traduzir explicitamente que o autor acusa Pápias e Irineu de erro
  alternative: Suavizar para “divergiu” ou endossar a acusação
  rationale: A avaliação pertence ao testemunho transmissor e deve permanecer identificável como tal, sem ser adotada pela tradução.
- issue: Martírio de João
  choice: Conservar a alegação de que João foi morto pelos judeus e a citação posterior de que morreu em Éfeso
  alternative: Harmonizar as tradições ou eliminar a tensão
  rationale: Os testemunhos apresentam dados potencialmente tensos; a tradução os conserva sem impor reconciliação.
- issue: Profecia do cálice e do batismo
  choice: Verter a formulação tal como citada pelo cronista
  alternative: Substituí-la exatamente pelo texto de uma tradução bíblica moderna
  rationale: A forma é uma citação patrística e pode refletir tradição textual ou adaptação própria; não deve ser normalizada silenciosamente.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com nomes tradicionais de uso brasileiro e sintaxe corrente. Como a revisão direta do grego/latim ainda está pendente, esta é uma tradução provisória baseada no testemunho inglês público fornecido; corrupções evidentes de OCR foram reparadas com cautela, e incertezas relevantes foram mantidas em colchetes ou notas.
