    VI


    Depois de Domiciano, Nerva reinou por um ano. Ele chamou João de volta da ilha — isto é, Patmos — e permitiu que morasse em Éfeso. Naquele tempo, João era o único sobrevivente dos doze apóstolos e, depois de escrever seu Evangelho, recebeu a honra do martírio. Pois Pápias, bispo de Hierápolis, que foi testemunha ocular dele, diz no segundo livro dos Oráculos do Senhor que João foi morto pelos judeus. Assim, junto com seu irmão, cumpriu claramente a profecia de Cristo a respeito deles, bem como a confissão e o compromisso que eles próprios assumiram em favor dele. Pois, quando o Senhor lhes perguntou: “Vocês podem beber o cálice que eu bebo?”, e eles prontamente assentiram e concordaram, ele disse: “Vocês beberão o meu cálice e serão batizados com o batismo com que eu sou batizado”. E com razão, pois é impossível que Deus minta. Do mesmo modo, o erudito Orígenes afirma, em sua interpretação do Evangelho de São Mateus, que João foi martirizado, declarando ter aprendido esse fato com os
    sucessores dos apóstolos. E Eusébio, que era bem informado, também diz em sua História Eclesiástica: “Tomé recebeu por sorte a Pártia; João, porém, recebeu a Ásia, onde fixou residência e morreu em Éfeso”.[e]


    JORGE HAMÁRTOLO, Crônica.'
