    Pápias diz em seu segundo livro que João, o Teólogo, e Tiago, seu irmão, foram mortos pelos judeus. O referido Pápias afirmou, com base no testemunho das filhas de Filipe, que Barsabás, também chamado Justo, desafiado pelos descrentes, bebeu veneno de serpente em nome do Senhor e ficou protegido de todo mal. Ele faz ainda outras afirmações maravilhosas, especialmente a respeito da mãe de Manaim, que foi ressuscitada dentre os mortos. Quanto aos que Cristo ressuscitou dentre os mortos, [ele afirma] que sobreviveram até o tempo de Adriano.


