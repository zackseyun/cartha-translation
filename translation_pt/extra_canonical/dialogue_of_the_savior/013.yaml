review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem o testemunho inglês provisório e conserva termos-chave e ambiguidades teológicas de modo geralmente adequado. Contudo, em vários pontos ela substitui colchetes vazios do testemunho por reticências entre colchetes, apagando a distinção editorial explicitamente indicada nas notas de base. Há também pequenas omissões de marcação restaurada e uma paráfrase evitável em "isso será sua riqueza".
  naturalness: O registro é claro, moderno e digno. Foram feitos pequenos ajustes para melhorar a fluência sem desfazer o caráter fragmentário do texto, especialmente em construções como "isso será sua riqueza" e "aceitaram-no fielmente".
  terminology: '"Governantes", com nota para "arcontes", é uma solução acessível e cautelosa. "Vestes", "condição perecível", "imortais" e "modo racional" preservam adequadamente a terminologia e a incerteza do testemunho. A nota sobre "modo racional" continua necessária.'
  issues:
  - severity: medium
    issue: Colchetes vazios foram convertidos em reticências entre colchetes.
    rationale: O testemunho distingue explicitamente "[]" de "[. . .]". Em "conheceu [] [fighting…]", "[with] [] tranquility" e "because [] [to lay aside…]", a versão proposta usa "[...]" onde a fonte traz "[]", perdendo informação editorial.
  - severity: medium
    issue: Uma restauração entre colchetes foi absorvida sem colchetes na fala de Maria.
    rationale: '"One thing only will I [say]" deve conservar a restauração editorial: "Uma só coisa [direi]".'
  - severity: low
    issue: Algumas formulações se afastam desnecessariamente da estrutura do testemunho.
    rationale: '"Terá nisso a sua riqueza" pode ser traduzido mais diretamente por "isso será sua riqueza"; "o acolheram com fidelidade" é menos preciso que "aceitaram-no fielmente" para "accepted it faithfully".'
  - severity: low
    issue: A formulação final deve conservar de modo mais explícito o possessivo singular do testemunho.
    rationale: '"your Father" é singular; "o teu Pai" evita que "seu Pai" fique excessivamente indeterminado em português, sem resolver a sintaxe fragmentária.'
