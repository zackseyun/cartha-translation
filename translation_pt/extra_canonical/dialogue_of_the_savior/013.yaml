translation:
  language: pt
  text: 'Maria disse: “Quero compreender tudo [exatamente como] é.”


    O Senhor disse: “Quem busca a vida terá nisso a sua riqueza, pois o [repouso] que o mundo oferece é falso, e seu ouro e sua prata são enganosos.”


    Seus discípulos lhe perguntaram: “O que devemos fazer para que nossa obra seja concluída?”


    O Senhor [lhes disse]: “Estejam preparados em qualquer circunstância. Feliz aquele que conheceu [...] [o combate e contemplou] a batalha com os próprios olhos. Não matou nem [foi] morto; em vez disso, saiu vitorioso.”


    Judas perguntou: “Senhor, diga-me: qual é o começo do caminho?”


    Ele disse: “O amor e a bondade. Se apenas um deles tivesse existido entre os governantes[a], o mal jamais teria vindo a existir.”


    Mateus disse: “Senhor, falaste sem dificuldade a respeito do fim de todas as coisas.”


    O Senhor disse: “Vocês compreenderam tudo o que lhes falei e o acolheram com fidelidade. Se o conhecem, ele lhes pertence; se não o conhecem, não lhes pertence.”


    Perguntaram-lhe: “Para que lugar estamos indo?”


    O Senhor disse: “Ocupem o lugar que puderem alcançar.”


    Maria perguntou: “É visível tudo o que está disposto dessa maneira?”


    O Senhor disse: “Eu lhes disse que aquele que pode ver é também quem revela.”


    Seus discípulos, os doze, lhe perguntaram: “Mestre, [com] [...] tranquilidade [...] ensina-nos [...].”


    O Senhor disse: “[Se vocês compreenderam] tudo o que [lhes disse], [tornar-se-ão imortais, porque] vocês [...] tudo.”


    Maria disse: “Direi apenas uma coisa ao Senhor a respeito do segredo da verdade: é nele que permanecemos firmes e é nele que somos transparentes para aquilo que diz respeito ao mundo.”


    Judas disse a Mateus: “Queremos compreender com que tipo de vestes seremos vestidos quando deixarmos a condição perecível da [carne].”


    O Senhor disse: “Os governantes e os administradores possuem vestes que lhes são dadas apenas por algum tempo e que não duram. Vocês, porém, como filhos da verdade, não devem vestir essas vestes que duram apenas por algum tempo. Em vez disso, eu lhes digo: vocês serão felizes quando tirarem suas vestes, porque [...] [deixar de lado o que é] exterior não é grande coisa.”


    [...] disse: “Sou eu quem fala e sou eu quem recebe [...]?”


    O Senhor disse: “Sim, [aquele que recebe] seu Pai de [modo racional][b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arcontes”. O termo pode referir-se simplesmente a governantes ou, neste contexto, a poderes que regem o mundo.
    reason: Preserva a carga cosmológica possível sem tornar obrigatório um vocabulário técnico pouco acessível.
  - marker: b
    text: A expressão traduzida “de modo racional” é incerta no testemunho disponível, e o trecho foi parcialmente restaurado.
    reason: Alerta o leitor para a obscuridade textual e para o caráter provisório da formulação.
lexical_decisions:
- source_word: life
  choice: vida
  rationale: Mantém o termo amplo do testemunho, sem restringi-lo a uma interpretação biológica, espiritual ou escatológica.
- source_word: rest
  choice: repouso
  rationale: Preserva a restauração editorial entre colchetes e a possível conotação religiosa do termo, evitando a paráfrase mais estreita “descanso”.
- source_word: archons
  choice: governantes
  rationale: Traduz o sentido básico do termo e acrescenta nota para indicar que pode designar poderes cósmicos no contexto da obra.
- source_word: path
  choice: caminho
  rationale: Conserva a metáfora de percurso e sua abertura ética, espiritual ou cosmológica.
- source_word: deathless
  choice: imortais
  rationale: Expressa naturalmente em português a ausência de morte, sem especificar o mecanismo ou a natureza dessa condição.
- source_word: destructibility
  choice: condição perecível
  rationale: Forma idiomática que preserva a ideia abstrata de sujeição à corrupção ou destruição.
- source_word: garments
  choice: vestes
  rationale: Mantém a imagem simbólica sem convertê-la em uma interpretação explícita de corpo, identidade ou estado espiritual.
- source_word: logical way
  choice: modo racional
  rationale: Reprodução provisória da formulação difícil do testemunho inglês; a nota sinaliza a incerteza sem normalizar o sentido.
theological_decisions:
- issue: Identidade e função dos archons
  choice: governantes, com nota explicativa
  alternative: arcontes
  rationale: “Governantes” é acessível e semanticamente básico; a nota preserva a possível dimensão cosmológica sem impor um sistema gnóstico específico.
- issue: Sentido das vestes perecíveis e de removê-las
  choice: manter literalmente a metáfora das vestes
  alternative: interpretar as vestes como corpo físico ou condição material
  rationale: O trecho é teologicamente carregado e ambíguo; explicitar uma identificação eliminaria uma tensão genuína do texto.
- issue: Aquele que vê e revela
  choice: “aquele que pode ver é também quem revela”
  alternative: “quem pode ver é aquilo que se revela”
  rationale: Segue a sintaxe do testemunho fornecido, mas evita ampliar a explicação além da evidência disponível.
- issue: Receber o Pai “de modo racional”
  choice: preservar a expressão em colchetes e acrescentar nota de incerteza
  alternative: harmonizar como “com entendimento” ou “espiritualmente”
  rationale: A formulação é obscura e restaurada; uma paráfrase fluente resolveria indevidamente sua ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros e internacionais. Os colchetes preservam restaurações editoriais; as reticências entre colchetes indicam lacunas ou texto perdido. Como a revisão direta do copta ainda está pendente, escolhas difíceis permanecem deliberadamente provisórias e não são harmonizadas teologicamente.
