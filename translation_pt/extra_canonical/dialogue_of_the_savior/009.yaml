review_pass:
  verdict: revise
  source_fidelity: 'A versão preserva bem a sequência argumentativa e as lacunas/restaurações do testemunho inglês provisório. Contudo, a terceira máxima desloca indevidamente os colchetes: o testemunho restaura “understands”, não a negação. A última máxima também fica mais fiel se conservar o futuro e a indicação parentética de consequência.'
  naturalness: O registro é claro e adequado. “Não lhe será estranho” é uma formulação mais idiomática e semanticamente próxima de “will be no stranger to it” do que “não será alheio a ela”; “não está nas trevas” traduz mais diretamente “stands not in the darkness”.
  terminology: “Obra da plenitude”, “Filho”, “[Pai]”, “raiz da injustiça” e a metáfora “o corpo que veste” são escolhas defensáveis e não impõem leitura doutrinária. “Plenitude” preserva a abstração potencialmente técnica de “completeness”.
  issues:
  - severity: medium
    issue: Colchetes deslocados em “[não entende]”
    rationale: 'O testemunho fornecido traz “One who [understands] not...”: a restauração assinalada é o verbo “understands”, enquanto “not” não está entre colchetes. Em português, a ordem natural requer “não [entende]”, preservando corretamente o escopo da restauração.'
  - severity: low
    issue: A formulação “não será alheio a ela” é menos natural e pode sugerir ‘não ser indiferente’, não ‘não ser estranho/familiar’.
    rationale: '“Não lhe será estranho” conserva melhor a ambiguidade relacional do testemunho: pode indicar familiaridade ou ausência de separação, sem explicitá-la.'
  - severity: low
    issue: O futuro e a consequência parentética da máxima final foram atenuados.
    rationale: “Aquele que [se exaltará] e (consequentemente) será humilhado” reproduz a restauração, o valor futuro e o parêntese do testemunho, sem harmonização interpretativa.
  revised_text: '“Quem [não] conhece a obra da plenitude nada conhece.[a]


    “Quem não está nas trevas não pode ver a [] luz.[b]


    “Quem não [entende] como o fogo veio a existir arderá dentro dele, sem conhecer a sua origem.[c]


    “Se alguém não compreender primeiro a água, nada conhece, pois de que lhe adianta ser batizado nela?


    “Quem não entende como o vento que sopra veio a existir será levado junto com ele.


    “Quem não entende como veio a existir o corpo que veste será destruído junto com ele.


    “E como alguém que não conhece o Filho conhecerá o [Pai]?


    “Tudo está oculto para quem não conhece a raiz de todas as coisas.


    “Quem não conhece a raiz da injustiça não lhe será estranho.[d]


    “Os que não entendem como vieram não entenderão como partirão.


    “E não é estranho a este mundo aquele que [se exaltará] e (consequentemente) será humilhado.”'
  revised_footnotes:
