translation:
  language: pt
  text: '“Quem [não] conhece a obra da plenitude nada conhece.[a]


    “Quem não permanece nas trevas não pode ver a [] luz.[b]


    “Quem [não entende] como o fogo veio a existir arderá dentro dele, sem conhecer sua origem.


    “Se alguém não compreender primeiro a água, nada conhece, pois de que lhe adianta ser batizado nela?


    “Quem não entende como o vento que sopra veio a existir será levado junto com ele.


    “Quem não entende como veio a existir o corpo que veste será destruído junto com ele.


    “E como alguém que não conhece o Filho conhecerá o [Pai]?


    “Tudo está oculto para quem não conhece a raiz de todas as coisas.


    “Quem não conhece a raiz da injustiça não será alheio a ela.[c]


    “Os que não entendem como vieram não entenderão como partirão.


    “E não é alheio a este mundo aquele que [se exaltar] e, por isso, for humilhado.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra “não” é uma restauração do texto danificado; “obra da plenitude” também admite outras nuanças, como “ato de completude”.
    reason: Sinalizar a incerteza textual e semântica da frase inicial.
  - marker: b
    text: Há uma lacuna antes de “luz”, e a formulação paradoxal sobre permanecer nas trevas foi conservada conforme o testemunho disponível.
    reason: Evitar corrigir silenciosamente um texto lacunoso e teologicamente tenso.
  - marker: c
    text: “Não será alheio a ela” pode indicar não estar separado da injustiça ou ter familiaridade com ela; o texto não resolve a nuance.
    reason: Preservar a ambiguidade da expressão.
lexical_decisions:
- source_word: deed of completeness
  choice: obra da plenitude
  rationale: Mantém a formulação abstrata e a possível densidade técnica de ‘completeness’, sem reduzi-la a perfeição moral.
- source_word: stands
  choice: permanece
  rationale: Expressa uma condição ou posição continuada de modo natural em português.
- source_word: blowing wind
  choice: vento que sopra
  rationale: Preserva a imagem dinâmica do testemunho sem tornar a frase artificial.
- source_word: body he wears
  choice: corpo que veste
  rationale: Conserva a metáfora do corpo como vestimenta, importante para o pensamento do texto.
- source_word: root of iniquity
  choice: raiz da injustiça
  rationale: ‘Injustiça’ é amplo e inteligível, sem impor uma interpretação estritamente jurídica ou denominacional.
- source_word: no stranger to
  choice: não será alheio a
  rationale: Retém a expressão relacional deliberadamente ambígua, em vez de explicá-la como participação, familiaridade ou sujeição.
theological_decisions:
- issue: Negação restaurada na primeira sentença
  choice: Quem [não] conhece
  alternative: Quem conhece
  rationale: Preserva a restauração assinalada pelo testemunho e a coerência com a série de máximas negativas, sem ocultar a incerteza manuscrita.
- issue: Relação entre trevas e luz
  choice: Quem não permanece nas trevas não pode ver a [] luz
  alternative: Reformular para quem permanece nas trevas não poder ver a luz
  rationale: Mantém a tensão paradoxal do testemunho em vez de corrigi-la segundo uma expectativa teológica convencional.
- issue: Conhecimento do Filho e do Pai
  choice: Filho e [Pai] com maiúsculas
  alternative: filho e [pai]
  rationale: O contexto apresenta títulos relacionais definidos; a restauração de Pai permanece visível.
- issue: Destino do corpo
  choice: será destruído junto com ele
  alternative: perecerá com ele
  rationale: Preserva a afirmação forte do testemunho sem explicar se a destruição é física, escatológica ou simbólica.
- issue: Exaltação e humilhação
  choice: aquele que [se exaltar] e, por isso, for humilhado
  alternative: aquele que [se exalta] será humilhado
  rationale: Mantém tanto a restauração quanto a relação consequencial indicada pelo testemunho, sem transformá-la em citação harmonizada de outro texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se entre colchetes todas as restaurações e lacunas transmitidas, enquanto o número de página manuscrita [15] foi omitido. Como a revisão direta do copta ainda está pendente, esta versão é provisória e se baseia no testemunho inglês público fornecido.
