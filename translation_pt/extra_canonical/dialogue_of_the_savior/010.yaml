translation:
  language: pt
  text: 'Ele [levou] Judas, Mateus e Maria [] [para lhes mostrar a extremidade] do céu e da terra.[a] Quando pôs a [mão] sobre eles, esperaram poder [vê-la].


    Judas olhou para cima e contemplou um lugar de grande altura; contemplou também, embaixo, o lugar do abismo.


    Judas disse a Mateus: “Irmão, quem é capaz de subir a tamanha altura ou de descer ao abismo lá embaixo, visto que ali há um grande inferno e um grande terror?”


    Naquele exato instante, uma palavra saiu da altura. Enquanto Judas permanecia ali, contemplou como a palavra desce[ndia].


    Ele perguntou à palavra: “Por que você desceu?”


    O Filho do Homem os saudou e lhes disse: “Uma semente proveniente de um poder era deficiente e desceu ao abismo da terra. A Majestade lembrou-se [dela] e enviou-lhe a [palavra]. A palavra elevou a semente à [presença] da Majestade, para que [] a primeira palavra não se perdesse.”[b]


    [Seus] discípulos ficaram admirados com tudo o que ele lhes disse e receberam tudo com fé, mesmo sabendo que é inútil considerar a injustiça.[c]


    Então ele disse aos discípulos: “Eu não lhes disse que o bem será elevado à luz como uma voz visível e um relâmpago?”[d]


    Todos os seus discípulos o louvaram, dizendo: “Senhor, antes de você aparecer aqui, quem o louvava, visto que todos os louvores são para você? Ou quem [o] bendizia, visto que todas as bênçãos <são para> você?”


    Enquanto permaneciam ali, ele contemplou dois espíritos que levavam consigo uma só alma. E houve um grande relâmpago. Uma palavra saiu do Filho do Homem, dizendo: “Deem-lhes suas vestes!”


    E o pequeno tornou-se igual ao grande. Eles eram [como] os que foram recebidos no alto. [] [Não havia diferença] entre eles. As [palavras] que ele [proferiu convenceram os] discípulos.[e]


    Maria [lhe disse: “Veja, eu] vejo o mal [que influencia] as pessoas desde o princípio, quando vivem umas com as outras.”


    O Senhor [lhe] disse: “Quando você os vê, [sabe] muito. Eles [não permanecerão ali juntos]. Mas, quando você vir Aquele que Existe Eternamente, essa será a grande visão.”[f]


    Todos lhe disseram: “Explique isso para nós.”


    Ele lhes disse: “De que modo vocês querem vê-lo: [numa] visão que passa ou numa visão que permanece para sempre?”


    E continuou: “Esforcem-se ao máximo para salvar o que permanecerá depois de [vocês]; procurem isso e falem de dentro disso, para que tudo o que vocês procuram esteja em harmonia com vocês mesmos, pois eu lhes [digo] a verdade: o Deus vivo [está] dentro de vocês, [] [assim como vocês estão] dentro de Deus.”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito está danificado neste trecho. Os colchetes marcam palavras restauradas ou lacunas; os colchetes vazios indicam texto perdido cuja redação não foi reconstruída com segurança.
    reason: Esclarecer ao leitor os sinais de reconstrução textual preservados na tradução.
  - marker: b
    text: A relação entre “semente”, “poder”, “palavra” e “primeira palavra” permanece obscura no testemunho conservado; a tradução não identifica essas figuras com entidades doutrinais específicas.
    reason: Preservar a ambiguidade cosmológica e teológica do texto.
  - marker: c
    text: A expressão traduzida por “considerar a injustiça” também pode sugerir ocupar-se dela ou levá-la em conta.
    reason: Indicar incerteza semântica relevante na formulação do testemunho inglês provisório.
  - marker: d
    text: “Voz visível” é uma imagem deliberadamente paradoxal no texto.
    reason: Evitar que o leitor suponha erro de tradução e preservar a imagem incomum.
  - marker: e
    text: O trecho está muito fragmentado; a relação entre o pequeno, o grande, as vestes e os recebidos no alto não pode ser determinada com segurança.
    reason: Sinalizar que a continuidade narrativa depende de restaurações.
  - marker: f
    text: “Aquele que Existe Eternamente” traduz um título e mantém aberta a identidade exata de seu referente.
    reason: Evitar identificação teológica não exigida pelo testemunho.
  - marker: g
    text: O final contém lacunas. A redação preserva a afirmação recíproca de que Deus está dentro dos discípulos e eles estão dentro de Deus.
    reason: Registrar dano textual e destacar uma tensão teológica que não deve ser suavizada.
lexical_decisions:
- source_word: word
  choice: palavra
  rationale: Mantém a ambiguidade do testemunho entre fala, mensagem e entidade personificada, sem impor o termo teológico “Verbo”.
- source_word: height
  choice: altura
  rationale: Preserva o paralelismo espacial com “abismo” e evita interpretar o lugar como um céu específico.
- source_word: abyss
  choice: abismo
  rationale: Equivalente direto, natural e adequado ao imaginário cosmológico do texto.
- source_word: power
  choice: poder
  rationale: Conserva a indeterminação do testemunho, que pode indicar força, potência ou entidade celeste.
- source_word: deficient
  choice: deficiente
  rationale: Retém a estranheza e a possível carga técnica do texto, em vez de resolver como “fraca”, “imperfeita” ou “incompleta”.
- source_word: Majesty
  choice: Majestade
  rationale: Mantém o título personificado e sua referência aberta.
- source_word: soul
  choice: alma
  rationale: Correspondência corrente, sem acrescentar uma antropologia sistemática.
- source_word: spirits
  choice: espíritos
  rationale: Preserva a designação genérica e não identifica os seres como anjos ou demônios.
- source_word: garments
  choice: vestes
  rationale: Mantém o possível sentido literal e simbólico com registro digno.
- source_word: Eternally Existent One
  choice: Aquele que Existe Eternamente
  rationale: Reproduz o título descritivo sem equipará-lo silenciosamente a uma fórmula doutrinal específica.
theological_decisions:
- issue: Personificação de “palavra”
  choice: Usar “uma palavra/a palavra” em minúscula
  alternative: “o Verbo” ou inicial maiúscula
  rationale: O testemunho apresenta a palavra como agente, mas não exige sua identificação com o Logos joanino.
- issue: A semente e o poder
  choice: Preservar “uma semente proveniente de um poder era deficiente”
  alternative: Explicitar quem ou o que era deficiente
  rationale: A sintaxe e a cosmologia são obscuras; uma explicação eliminaria uma ambiguidade genuína.
- issue: “o bem” elevado à luz
  choice: Manter o singular abstrato “o bem”
  alternative: “os bons”
  rationale: O testemunho permite uma qualidade ou realidade boa, não necessariamente um grupo de pessoas.
- issue: Presença divina interior
  choice: Traduzir simetricamente “Deus dentro de vocês” e “vocês dentro de Deus”
  alternative: Atenuar a formulação como presença espiritual ou comunhão
  rationale: Preserva a tensão teológica do texto sem harmonizá-la com uma doutrina posterior.
- issue: Igualdade entre pequeno e grande
  choice: Manter a afirmação sem explicar sua natureza
  alternative: Interpretá-la como igualdade escatológica, espiritual ou corporal
  rationale: O contexto não determina com segurança o referente nem o sentido da transformação.
- issue: Inferno no abismo
  choice: Conservar “inferno” como elemento localizado no abismo
  alternative: “fogo”, “Geena” ou “mundo inferior”
  rationale: Segue o testemunho disponível sem introduzir terminologia confessional mais específica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tratamento por “você/vocês”, sintaxe digna e vocabulário acessível. Mantiveram-se colchetes, colchetes vazios, sinais de palavra parcialmente restaurada e parênteses angulares do testemunho; retiraram-se apenas os números de página do manuscrito que interrompiam as frases. Como a revisão direta do copta ainda está pendente, esta é uma tradução provisória fundamentada no testemunho inglês público fornecido.
