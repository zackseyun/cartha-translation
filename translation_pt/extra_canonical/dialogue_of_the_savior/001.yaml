translation:
  language: pt
  text: 'O Salvador disse aos seus discípulos: “Irmãos, chegou agora o tempo de interrompermos nosso trabalho e permanecermos em repouso, pois quem permanece em repouso repousará para sempre. Eu digo a vocês: transcendam sempre [. . .] a temporalidade [. . .]. [Eu digo] a vocês: [. . .] não temam [aqueles que . . .] vocês. Eu [digo a vocês]: a ira é temível, [e quem] provoca a ira é uma [pessoa temível]. Contudo, porque vocês [foram capazes de sofrer], talvez ela saia de [vocês . . .].


    “աս pessoas acolheram com temor e tremor estas palavras a respeito da ira. A ira estabeleceu governantes[a] sobre elas, porque ninguém consegue escapar da ira. Quando vim, porém, abri um caminho e ensinei às pessoas sobre o caminho da travessia para os eleitos e os solitários[b], [] aqueles que conheceram o Pai e foram fiéis à verdade; e vocês ofereceram louvor.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “arcontes”. O termo pode designar governantes ou autoridades e, em certos textos antigos, poderes cósmicos.
    reason: Preserva a possível carga técnica de “archons” sem impô-la ao texto principal.
  - marker: b
    text: “Solitários” também pode ter o sentido de pessoas que estão sós, separadas ou unificadas interiormente; o contexto não determina uma única interpretação.
    reason: Registra a ambiguidade potencial do termo representado no testemunho por “solitary”.
lexical_decisions:
- source_word: stand at rest / rest
  choice: permanecer em repouso / repousar
  rationale: Mantém a repetição conceitual do testemunho e evita reduzir o repouso a uma simples pausa física.
- source_word: transcend
  choice: transcendam
  rationale: Preserva o movimento de ultrapassar ou ir além, sem explicar uma passagem danificada.
- source_word: temporality
  choice: temporalidade
  rationale: Conserva o termo abstrato do testemunho, embora o contexto lacunar impeça maior precisão.
- source_word: anger
  choice: ira
  rationale: A palavra sustenta o peso personificado e ameaçador da passagem melhor que opções mais coloquiais.
- source_word: archons
  choice: governantes
  rationale: Traduz o sentido básico do termo, com nota que registra a transliteração tradicional e sua possível carga cosmológica.
- source_word: crossing over
  choice: atravessar
  rationale: Preserva a imagem de passagem sem determinar indevidamente seu sentido espiritual ou cosmológico.
- source_word: solitary
  choice: solitários
  rationale: Mantém a ambiguidade entre pessoas sós, separadas ou pertencentes a uma categoria espiritual.
theological_decisions:
- issue: Natureza do “repouso”
  choice: Manter “repouso” sem paráfrase doutrinária
  alternative: Interpretar como salvação, morte, contemplação ou descanso escatológico
  rationale: O testemunho não resolve explicitamente a natureza desse repouso.
- issue: Personificação da ira
  choice: Preservar a ira como agente que estabelece governantes
  alternative: Reformular como pessoas iradas que instituem autoridades
  rationale: A construção incomum pode ser teologicamente significativa e não deve ser normalizada.
- issue: Identidade dos “eleitos e solitários”
  choice: Conservar ambos os qualificativos sem harmonização
  alternative: Entender “solitários” como monges, celibatários ou indivíduos espiritualmente unificados
  rationale: A evidência fornecida não permite escolher com segurança entre essas leituras.
- issue: Referente de “ela” em “talvez ela saia”
  choice: Usar pronome feminino, permitindo a referência à ira
  alternative: Explicitar “a ira” ou adotar um sujeito indefinido
  rationale: O trecho está danificado; o pronome preserva a conexão provável sem apresentá-la como certa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A tradução é necessariamente provisória, pois se baseia no testemunho inglês de domínio público e a revisão direta do copta ainda está pendente. Colchetes e reticências foram preservados como sinais de lacunas ou restaurações do manuscrito; os colchetes vazios também foram mantidos.
