translation:
  language: pt
  text: 'Judas [disse]: “Eu realmente quero [aprender tudo].”


    O [Senhor] lhe disse: “O [Deus vivo não] habita [em parte alguma de] todo o [lugar] desta deficiência.”


    Judas [perguntou]: “Quem [governará sobre nós]?”


    O Senhor respondeu: “[Vejam, aqui habita] tudo o que existe [entre] aquilo que permanecerá. Vocês [governarão] sobre eles.”


    Judas disse: “Vejam, os arcontes[a] estão acima de nós, de modo que governarão sobre nós.”


    O Senhor respondeu: “São vocês que governarão sobre eles. Quando removerem de si mesmos a inveja, vocês se revestirão da luz e entrarão na câmara nupcial[b].”


    Judas perguntou: “Como [nossas] vestes nos serão fornecidas?”


    O Senhor respondeu: “Alguns as fornecerão a vocês, e outros [as] receberão, [c] e são eles [que darão] a vocês as suas vestes. Pois quem pode chegar àquele lugar, sendo ele tão [atemorizante]? As vestes da vida, porém, serão dadas aos seres humanos, porque eles conhecem o caminho que percorrerão. De fato, até para mim é difícil chegar a ele.”


    Maria disse: “Assim, <basta> a cada dia o seu próprio sofrimento. Os trabalhadores são dignos de seu alimento. Os discípulos serão iguais aos seus mestres.”


    Ela disse isso como uma mulher que compreendia tudo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arcontes” significa literalmente “governantes” ou “autoridades”; neste escrito, o termo pode designar poderes cósmicos.
    reason: O empréstimo técnico precisa de uma explicação breve para leitores comuns.
  - marker: b
    text: A “câmara nupcial” é uma imagem simbólica ou ritual cuja referência exata não é explicada nesta passagem.
    reason: Evita impor uma interpretação sacramental ou cosmológica específica.
  - marker: c
    text: Há uma lacuna indicada no testemunho neste ponto; parte da frase está perdida ou ilegível.
    reason: Explica o espaço vazio preservado na evidência textual.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional para poderes ou governantes cósmicos, evitando reduzi-lo simplesmente a autoridades humanas.
- source_word: deficiency
  choice: deficiência
  rationale: Preserva a terminologia conceitual do testemunho e sua possível carga cosmológica sem interpretá-la como pecado, mundo ou imperfeição.
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Conserva a imagem ritual e simbólica, sem substituí-la por uma interpretação teológica específica.
- source_word: garments of life
  choice: vestes da vida
  rationale: Reproduz a metáfora concreta e sua ambiguidade soteriológica.
- source_word: students
  choice: discípulos
  rationale: No contexto de mestre e seguidores, 'discípulos' é natural e preserva a relação formativa expressa no dito.
- source_word: trouble
  choice: sofrimento
  rationale: Expressa de forma natural a aflição ou dificuldade cotidiana, embora o sentido exato dependa da futura revisão copta.
theological_decisions:
- issue: Afirmação de que os discípulos governarão sobre os arcontes
  choice: Preservar literalmente a inversão de domínio
  alternative: Interpretar como vitória espiritual ou libertação interior
  rationale: O texto apresenta uma tensão cosmológica explícita e não autoriza limitar seu sentido a uma leitura metafórica.
- issue: Entrada na câmara nupcial após abandonar a inveja
  choice: Manter a sequência sem explicar sua mecânica
  alternative: Explicá-la como rito sacramental, união celestial ou estado moral
  rationale: A passagem não define a câmara nupcial nem a natureza exata da relação entre purificação, luz e entrada.
- issue: Dificuldade do próprio Senhor em alcançar o lugar
  choice: Traduzir a afirmação diretamente
  alternative: Suavizar ou reinterpretar para harmonizá-la com uma cristologia posterior
  rationale: A frase constitui uma tensão teológica genuína do testemunho e não deve ser corrigida silenciosamente.
- issue: Identidade dos que fornecem, recebem e dão as vestes
  choice: Preservar os referentes pronominais ambíguos
  alternative: Identificar esses grupos como anjos, arcontes ou iniciados
  rationale: O testemunho fornecido não identifica com segurança os agentes.
