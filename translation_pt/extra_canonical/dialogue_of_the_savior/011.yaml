  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os colchetes preservam palavras restauradas ou incertas no testemunho; os sinais angulares preservam uma suplementação editorial. Como a revisão direta do copta ainda está pendente, a redação é provisória e segue de perto o testemunho inglês público fornecido, sem ocultar lacunas, ambiguidades ou tensões teológicas.
