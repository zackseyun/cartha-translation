translation:
  language: pt
  text: 'Maria perguntou a seus irmãos: “Onde vocês guardarão [estas] perguntas que fazem ao Filho do [Homem]?”


    O Senhor [lhe disse]: “Irmã, [ninguém] pode perguntar a respeito dessas coisas, [a não ser] quem possui no coração um lugar [] onde guardá-las. Tal pessoa pode partir [do mundo], entrar no lugar [da vida] e não ficará retida neste mundo de pobreza.”


    Mateus disse: “Senhor, quero [contemplar] esse lugar da vida, [onde] não há injustiça, mas somente [luz] pura.”


    O Senhor respondeu: “Irmão Mateus, você não pode vê-lo enquanto [estiver] revestido da carne.”


    Mateus disse: “Senhor, [se eu] não posso vê-lo, ao menos permite que eu o conheça.”


    O Senhor disse: “Todo aquele que conheceu a si mesmo o viu. Ele faz tudo o que lhe é dado fazer. Assim, alguém como ele veio a [tornar-se semelhante] àquele lugar em bondade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: store
  choice: guardar
  rationale: Preserva o elo verbal entre guardar as perguntas e ter no coração um lugar onde guardá-las, em linguagem natural.
- source_word: place of life
  choice: lugar da vida
  rationale: Mantém a expressão concreta e possivelmente técnica do testemunho, sem interpretá-la como céu, salvação ou vida eterna.
- source_word: world of poverty
  choice: mundo de pobreza
  rationale: Conserva a formulação incomum e sua possível carga simbólica, sem explicá-la no corpo do texto.
- source_word: wear the flesh
  choice: estar revestido da carne
  rationale: Retém a metáfora corporal do testemunho de maneira digna e compreensível, evitando reduzi-la a simplesmente estar vivo.
- source_word: known himself
  choice: conheceu a si mesmo
  rationale: Preserva o sentido reflexivo e a possível importância conceitual do autoconhecimento.
- source_word: iniquity
  choice: injustiça
  rationale: Expressa de modo corrente a ausência de mal moral ou retidão violada, sem introduzir terminologia confessional.
theological_decisions:
- issue: Identidade do “lugar da vida”
  choice: Manter “lugar da vida” sem explicação interpretativa
  alternative: Traduzir como “vida eterna”, “céu” ou “reino”
  rationale: O testemunho apresenta um lugar simbólico ou transcendente, mas não o identifica de modo inequívoco com essas categorias.
- issue: Relação entre autoconhecimento e visão do lugar
  choice: Preservar a afirmação direta de que quem conheceu a si mesmo viu o lugar
  alternative: Parafrasear como conhecimento de Deus, iluminação ou salvação
  rationale: A formulação tem tensão teológica própria, que não deve ser harmonizada com doutrinas externas.
- issue: Frase final textualmente restaurada
  choice: “veio a [tornar-se semelhante] àquele lugar em bondade”
  alternative: “passou a ser aquele lugar” ou “alcançou aquele lugar”
  rationale: Mantém a restauração indicada e a comparação presente no testemunho, embora a construção permaneça difícil.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e uso de “você/vocês” no diálogo. Todos os colchetes do testemunho foram preservados como sinais de lacuna ou restauração editorial, inclusive os colchetes vazios. Tradução provisória baseada no testemunho inglês de domínio público; a revisão direta do copta ainda está pendente.
