lexical_decisions:
- source_word: fullness
  choice: plenitude
  rationale: Mantém o possível sentido técnico e cosmológico do termo, sem o reduzir a ‘completude’.
- source_word: deficiency
  choice: deficiência
  rationale: Preserva o contraste lexical direto com ‘plenitude’ e sua possível carga conceitual.
- source_word: what animates a person
  choice: aquilo que dá vida a uma pessoa
  rationale: Expressa a função vital sem identificar de modo indevido o referente como alma, espírito ou sopro.
- source_word: wealth
  choice: riqueza
  rationale: Conserva a metáfora do testemunho, embora ‘riqueza’ também possa sugerir abundância.
- source_word: rest
  choice: descansar
  rationale: Preserva a linguagem de repouso, incluindo sua possível dimensão existencial ou escatológica, sem explicitá-la.
- source_word: burdens
  choice: fardos
  rationale: Termo natural e digno que mantém tanto o sentido concreto quanto o figurado.
theological_decisions:
- issue: Origem na plenitude e morada na deficiência
  choice: Formulação literal e não explicada
  alternative: Interpretar explicitamente como queda da alma ou exílio no mundo material
  rationale: O texto permite uma leitura cosmológica, mas não convém importar um sistema doutrinário específico.
- issue: Aquilo que dá vida à pessoa
  choice: Referente deixado indeterminado
  alternative: Traduzir como ‘alma’ ou ‘espírito’
  rationale: A testemunha inglesa não resolve a identidade do princípio vital, e a ambiguidade deve ser preservada.
- issue: ‘Tudo o que vem de mulher morrerá’
  choice: Imagem mantida sem paráfrase doutrinária
  alternative: Explicar como referência à carne, ao nascimento físico ou à humanidade caída
  rationale: Essas interpretações são possíveis, mas excedem a evidência fornecida.
- issue: Lugar abandonado pela verdade
  choice: A pergunta conserva duas possibilidades coordenadas
  alternative: Escolher apenas ‘abandonado pela verdade’ ou apenas ‘sem verdade’
  rationale: A testemunha apresenta ambiguidade sintática e semântica que não deve ser eliminada.
- issue: Temor e assombro
  choice: Ambos os aspectos mantidos
  alternative: Traduzir somente como ‘amedronta’ ou somente como ‘causa admiração’
  rationale: A fala de Maria une reação de medo e maravilhamento.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. Empregou-se ‘vocês’ no discurso plural e ‘você’ no singular, evitando arcaísmos. A tradução é provisória porque se baseia na testemunha inglesa pública fornecida; a revisão direta do copta ainda está pendente. Os números nus de páginas do manuscrito foram omitidos, conforme a camada de consulta.
