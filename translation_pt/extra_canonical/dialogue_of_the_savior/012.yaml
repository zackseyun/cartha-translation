translation:
  language: pt
  text: 'Os discípulos lhe perguntaram: “O que é a plenitude, e o que é a deficiência?”


    Ele lhes respondeu: “Vocês vieram da plenitude e habitam no lugar da deficiência.


    E vejam: a luz dele se derramou sobre mim.”


    Mateus perguntou: “Senhor, diga-me como morrem os que estão mortos e como vivem os que estão vivos.”


    O Senhor disse: “[Vocês me] perguntaram a respeito de uma palavra [verdadeira] que olho algum viu, e vocês são os únicos de quem a ouvi. Eu, porém, lhes digo: quando aquilo que dá vida a uma pessoa lhe é tirado, ela será chamada morta; e, quando aquilo que está vivo <entra> naquilo que está morto, isso será chamado vivo.”[a]


    Judas perguntou: “Falando com sinceridade, por que alguns <morrem> e outros vivem?”


    O Senhor disse: “Tudo o que vem da verdade não morrerá. Tudo o que vem de mulher morrerá.”


    Maria perguntou: “Diga-me, Senhor: por que vim a este lugar — para ganhar ou para perder?”


    O Senhor respondeu: “Você revela a riqueza daquele que revela.”[b]


    Maria lhe perguntou: “Senhor, existe então algum lugar abandonado pela verdade ou que careça dela?”[c]


    O Senhor disse: “O lugar onde eu não habito.”


    Maria disse: “Senhor, você inspira temor e assombro, até [como fogo consumidor] para os que não [o] conhecem.”[d]


    Mateus perguntou: “Por que não descansamos de uma vez?”


    O Senhor disse: “Quando deixarem para trás aquilo que não podem levar consigo, então descansarão.”


    Mateus perguntou: “Como o pequeno se harmoniza com o grande?”


    O Senhor disse: “Deixando para trás estes fardos.”'
