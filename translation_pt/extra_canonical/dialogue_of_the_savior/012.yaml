review_pass:
  verdict: revise
  source_fidelity: 'É necessária revisão pontual para corrigir uma inversão de sentido em “que olho algum viu”: em português, essa formulação afirma que algum olho viu, enquanto a testemunha diz “that eye has not seen”. A lacuna assinalada por “[]” na fala de Maria também deve ser preservada, assim como o parêntese editorial em “forsaken (by)”. As demais escolhas preservam adequadamente as ambiguidades conceituais e os sinais editoriais da testemunha inglesa provisória.'
  naturalness: O registro é moderno, claro e adequado. Ajustou-se “E vejam” para “E eis que”, mais próximo da função discursiva de “And behold”, e foram feitos pequenos ajustes de pontuação e de formulação para manter fluidez sem reduzir a densidade do texto.
  terminology: “Plenitude”, “deficiência”, “verdade”, “riqueza”, “descansar” e “fardos” são escolhas adequadas. “Aquilo que dá vida a uma pessoa” preserva corretamente a indeterminação do princípio vital. Mantém-se “fogo consumidor” como expressão estabelecida e fiel ao teor da reconstrução da testemunha.
  issues:
  - severity: high
    issue: Negação ausente em “que olho algum viu”.
    rationale: A testemunha inglesa diz “that eye has not seen”. Em português, “olho algum viu” tem sentido afirmativo (“algum olho viu”), invertendo o enunciado. Deve ser “que olho não viu”.
  - severity: medium
    issue: A lacuna “[]” antes de “even” foi omitida.
    rationale: A testemunha preserva uma lacuna textual independente das palavras restauradas entre colchetes. Ela deve aparecer como “[]” na tradução, sem tentar preenchê-la.
  - severity: low
    issue: O sinal editorial em “forsaken (by)” foi normalizado sem indicação.
    rationale: O parêntese na testemunha sinaliza incerteza ou suplementação editorial na relação entre o lugar e a verdade. “abandonado (pela verdade)” conserva esse sinal sem impor uma solução.
