translation:
  language: pt
  text: 'Seus discípulos [disseram: “Senhor], quem é aquele que busca e [quem] é aquele que revela?”


    [O Senhor] lhes [disse]: “Aquele que busca é [o mesmo] que revela.”


    Mateus [lhe disse outra vez: “Senhor], quando eu [te ouço] e quando falo, quem é que [fala e] quem é que ouve?”


    O [Senhor] disse: “Aquele que fala é o mesmo que [ouve], e aquele que pode ver é o mesmo que revela.”


    Maria disse: “Senhor, eis que, [enquanto] estou revestida de um corpo, de onde fluem minhas lágrimas e de onde vem meu riso?”


    O Senhor disse: “[É o corpo que] chora por causa de seus atos [e por causa dos] atos que ainda restam fazer. É a mente que ri [por causa dos [frutos do] espírito. Quem [não permanece] nas trevas será [in]capaz de ver [a luz].[a]


    Eu lhes digo: [tudo o que está sem] a luz são as trevas, [e quem não] permanece nas [trevas será in]capaz de ver a luz.[b] Contudo, [os filhos do] engano foram retirados [...]. Vocês se revestirão da luz e [assim viverão] para sempre [...]. [Se ...], então [todo] poder que está acima e abaixo os tratará cruelmente. Naquele lugar [haverá] choro e [ranger] de dentes por causa do fim de [todas as] coisas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase está muito danificada, e a restauração produz uma formulação difícil: “quem não permanece nas trevas será incapaz de ver a luz”.'
    reason: Alertar o leitor de que a aparente inversão lógica depende de texto restaurado e não deve ser harmonizada silenciosamente.
  - marker: b
    text: A repetição sobre trevas e luz também depende de extensas restaurações; o sentido exato permanece incerto.
    reason: Preservar a incerteza manuscrita e distinguir tradução de reconstrução editorial.
lexical_decisions:
- source_word: seeks
  choice: busca
  rationale: Mantém o sentido ativo e aberto da testemunha, sem especificar o objeto da busca.
- source_word: reveals
  choice: revela
  rationale: Preserva o paralelismo e a ambiguidade quanto ao que ou a quem é revelado.
- source_word: wearing a body
  choice: estou revestida de um corpo
  rationale: Retém a metáfora de vestir, importante no contexto, em português natural e digno.
- source_word: mind
  choice: mente
  rationale: Evita substituir o termo por 'alma' ou outra categoria teológica não explicitada na testemunha.
- source_word: spirit
  choice: espírito
  rationale: Mantém a amplitude semântica e não força a identificação com o Espírito Santo.
- source_word: sons of deceit
  choice: filhos do engano
  rationale: Conserva o idiomatismo semítico da testemunha e sua indefinição referencial.
- source_word: put on the light
  choice: se revestirão da luz
  rationale: Preserva a imagem vestimentária e sua ligação possível com a fala anterior sobre estar revestida de um corpo.
- source_word: powers
  choice: poder
  rationale: Traduz literalmente a categoria apresentada pela testemunha, sem identificá-la como autoridade humana, anjo ou entidade cósmica.
theological_decisions:
- issue: Identidade entre quem busca e quem revela
  choice: Preservar a afirmação paradoxal de que são 'o mesmo'
  alternative: Explicar a frase como referência à mesma pessoa, ao discípulo ou ao Senhor
  rationale: A testemunha não resolve o referente; explicitá-lo importaria uma interpretação teológica.
- issue: Corpo, mente e espírito
  choice: Manter os três termos distintos
  alternative: Harmonizá-los como corpo, alma e Espírito Santo
  rationale: A distinção da testemunha deve permanecer sem receber uma antropologia denominacional posterior.
- issue: Negação nas frases sobre trevas e luz
  choice: Conservar a leitura restaurada, embora difícil
  alternative: Emendar para 'quem permanece nas trevas não poderá ver a luz'
  rationale: O texto fornecido contém uma formulação paradoxal possivelmente afetada por lacunas; corrigi-la silenciosamente apagaria a tensão e ultrapassaria a evidência disponível.
- issue: Destino dos poderes acima e abaixo
  choice: Deixar a referência genérica
  alternative: Identificá-los como demônios, arcontes ou autoridades terrenas
  rationale: A testemunha não fornece identificação suficiente neste trecho.
translation_notes:
  register: Português moderno, amplamente internacional e legível no Brasil, com tom digno. Colchetes e reticências preservam os sinais de restauração e perda do manuscrito na testemunha fornecida. Esta versão é necessariamente provisória, pois foi elaborada a partir da tradução inglesa pública; a revisão direta do copta do Códice de Nag Hammadi III,5 ainda está pendente.
