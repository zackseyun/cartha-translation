translation:
  language: pt
  text: 'Judas respondeu:


    — Dize-me, Senhor: como o abalo de um [terremoto] faz a terra tremer?[a]


    O Senhor pegou uma pedra e a segurou na mão. [Ele lhe disse: “O que] tenho na mão?”[b]


    Ele respondeu:


    — [É] uma pedra.


    Ele lhes disse:


    — Aquilo que sustenta a [terra] é o mesmo que sustenta o céu. Quando uma palavra procede da Majestade, ela encontra aquilo que sustenta o céu e a terra. A terra não se moverá. Se ela se movesse, cairia; mas não se move, para que a primeira palavra não falhe. A palavra estabeleceu o mundo, viveu nele e sentiu sua fragrância. A todos vocês, Filhos do Homem, proclamo tudo o que é imóvel, pois vocês vêm daquele lugar.[c] Vocês vivem no coração dos que falam com alegria e verdade. Se a palavra procede do corpo do Pai entre os seres humanos e eles não a recebem, ela retorna ao seu lugar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes representam texto danificado ou uma restauração editorial no testemunho disponível.
    reason: Informa ao leitor por que certos termos aparecem entre colchetes e evita apresentar reconstruções como texto plenamente preservado.
  - marker: b
    text: O início desta frase está danificado; a formulação entre colchetes é uma reconstrução provável.
    reason: Assinala a incerteza mais extensa e sintaticamente relevante do trecho.
  - marker: c
    text: “Filhos do Homem” reproduz uma expressão plural incomum; ela pode designar o grupo de interlocutores sem esclarecer por si só sua relação com o título singular “Filho do Homem”.
    reason: Preserva uma ambiguidade antropológica e teológica genuína, sem impor uma interpretação.
lexical_decisions:
- source_word: earthquake / shaking
  choice: o abalo de um [terremoto] faz a terra tremer
  rationale: Mantém a repetição semântica do testemunho, mas em uma pergunta natural em português; os colchetes preservam a restauração editorial.
- source_word: Majesty
  choice: Majestade
  rationale: Preserva o título transcendente e sua possível função técnica, sem substituí-lo por uma interpretação como “Deus”.
- source_word: word
  choice: palavra
  rationale: Mantém a ambiguidade entre fala, enunciado e realidade personificada; a inicial minúscula evita impor uma identificação cristológica não explicitada pelo trecho.
- source_word: set up the world
  choice: estabeleceu o mundo
  rationale: Expressa fundação e ordenação sem limitar o sentido a uma criação material ex nihilo.
- source_word: Sons of Man
  choice: Filhos do Homem
  rationale: Tradução formal que conserva a expressão incomum e sua possível carga antropológica ou coletiva.
- source_word: Father’s body
  choice: corpo do Pai
  rationale: Preserva literalmente a imagem corporificada e sua tensão teológica, sem a suavizar como “presença” ou “seio”.
- source_word: humans
  choice: seres humanos
  rationale: Forma inclusiva e clara, adequada ao sentido genérico do testemunho.
theological_decisions:
- issue: Possível personificação da palavra
  choice: “palavra” em minúscula, mantendo pronomes comuns
  alternative: “Palavra” como título cristológico
  rationale: O trecho atribui ações à palavra, mas o testemunho fornecido não exige que ela seja identificada explicitamente com Cristo ou com um Logos pessoal.
- issue: Imobilidade da terra e sustentação do cosmos
  choice: Preservar a cosmologia e o raciocínio do texto sem harmonização
  alternative: Reformular como metáfora espiritual ou segundo a cosmologia moderna
  rationale: A tradução deve representar a concepção do documento, sem convertê-la em linguagem científica moderna nem decidir que seja apenas figurativa.
- issue: Identidade dos “Filhos do Homem”
  choice: Manter a forma plural e a referência aberta
  alternative: Interpretar como “filhos da humanidade”, “eleitos” ou discípulos unidos ao Filho do Homem
  rationale: A expressão admite mais de uma leitura e o contexto disponível não resolve sua função teológica.
- issue: Origem da palavra no “corpo do Pai”
  choice: Traduzir a imagem literalmente
  alternative: Explicar como emanação divina, encarnação ou revelação
  rationale: Essas explicações resolveriam uma imagem deliberadamente densa para além do que o testemunho permite.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com diálogo pontuado de modo natural. A tradução é provisória porque se baseia no testemunho inglês público fornecido; a revisão direta do copta do Códice de Nag Hammadi III,5 ainda está pendente. Foram omitidos os números de página manuscrita que interrompiam a frase, mas preservados os colchetes de restauração ou dano textual.
