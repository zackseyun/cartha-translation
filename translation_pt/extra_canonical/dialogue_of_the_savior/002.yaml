translation:
  language: pt
  text: '“Quando vocês oferecerem louvor, façam-no desta maneira:[a]


    Escuta-nos, Pai,

    assim como escutaste o teu Filho único,

    chegando até a recebê-lo junto de ti.

    [Tu] lhe concedeste descanso de muito [trabalho].

    Nosso poder [não pode ser vencido],

    [porque] tuas forças de batalha [não podem ser vencidas],

    [. . .] luz [. . .] viva [. . .] inacessível [. . . viva].

    A palavra [verdadeira] [concedeu] arrependimento para a vida,

    [e isso procedeu] de ti.

    Tu és o pensamento e a serenidade plena do solitário.

    Escuta-nos mais uma vez,

    assim como escutaste os teus eleitos.

    Por meio do teu sacrifício, os eleitos entrarão.

    Por suas boas obras, eles libertaram suas almas dos membros corporais cegos,

    para que possam existir [] para sempre.[b]


    Amém.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta do copta do Códice III,5 de Nag Hammadi ainda está pendente.
    reason: Declara com transparência a base documental limitada desta versão.
  - marker: b
    text: Colchetes e reticências reproduzem sinais de lacuna e de restauração editorial no testemunho. Os colchetes vazios antes de “para sempre” foram preservados porque o conteúdo ausente não é informado.
    reason: Evita apresentar reconstruções incertas como texto preservado e explica a forma incomum da passagem.
lexical_decisions:
- source_word: offer up praise
  choice: oferecerem louvor
  rationale: Mantém a imagem cultual de oferecer sem tornar a expressão excessivamente técnica.
- source_word: only Son
  choice: Filho único
  rationale: Preserva a formulação filial do testemunho e seu sentido natural em português, sem acrescentar uma interpretação cristológica mais específica.
- source_word: rest
  choice: descanso
  rationale: Retém tanto a ideia comum de repouso quanto possíveis ressonâncias religiosas, sem explicá-las no corpo do texto.
- source_word: battle forces
  choice: forças de batalha
  rationale: Conserva a imagem militar incomum do testemunho, evitando substituí-la por termos teologicamente carregados como “exércitos celestiais”.
- source_word: repentance for life
  choice: arrependimento para a vida
  rationale: Preserva a relação sintática e a possível ambiguidade entre arrependimento que conduz à vida e arrependimento em favor da vida.
- source_word: the solitary
  choice: o solitário
  rationale: Mantém o singular e a ambiguidade do testemunho; “solitário” pode designar uma pessoa isolada ou ter sentido espiritual mais específico.
- source_word: bodily limbs
  choice: membros corporais
  rationale: Reproduz a imagem antropológica concreta sem suavizá-la para “corpo” nem interpretá-la como paixões ou sentidos.
theological_decisions:
- issue: A relação entre o sacrifício do Pai e a entrada dos eleitos
  choice: “Por meio do teu sacrifício, os eleitos entrarão”
  alternative: “Por meio da tua oferta, os eleitos entrarão”
  rationale: “Sacrifício” segue diretamente o testemunho fornecido e não identifica a natureza ou o referente do sacrifício.
- issue: Libertação das almas por boas obras
  choice: Conservar a afirmação em sua forma direta
  alternative: Reformular para que as boas obras apenas evidenciem ou acompanhem a libertação
  rationale: O texto atribui instrumentalidade às boas obras; alterar essa relação importaria uma harmonização doutrinária ausente do testemunho.
- issue: A “palavra verdadeira” e o arrependimento
  choice: Manter as restaurações entre colchetes
  alternative: Integrar as palavras restauradas como texto seguro
  rationale: A condição lacunar impede tratar como certas as palavras supridas editorialmente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O paralelismo e as quebras de linha da oração foram preservados. Formas como “escutaste” e “tuas” mantêm o tratamento singular dirigido ao Pai; “vocês” torna natural a instrução inicial dirigida ao grupo. Não se corrigiram a sintaxe fragmentária nem as tensões antropológicas e soteriológicas do testemunho.
