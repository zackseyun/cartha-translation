    issue: O sinal editorial em “This [] [will] convey you” não é preservado de modo plenamente equivalente.
    rationale: Em “Isto [...] [os] levará”, os colchetes passam a incidir sobre o pronome-objeto, embora no testemunho a restauração incida sobre “will”. “Isto [] [irá] conduzi-los” conserva a lacuna vazia e marca como restauração o auxiliar correspondente a “will”.
  - severity: low
    issue: A abertura “quando chegará o tempo” é pouco natural em português neste enunciado indireto.
    rationale: “Quando virá o tempo da destruição” expressa o futuro esperado e mantém a mesma referência temporal do testemunho.
  - severity: low
    issue: Os parênteses editoriais de “inside (you)” foram omitidos.
    rationale: “Dentro (de vocês)” preserva a distinção editorial do testemunho entre a restauração em colchetes e o complemento apresentado entre parênteses.
