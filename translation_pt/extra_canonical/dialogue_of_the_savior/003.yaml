translation:
  language: pt
  text: '“Eu lhes ensinarei quando chegará o tempo da destruição.[a] O primeiro poder das trevas os alcançará; não tenham medo,[b] nem digam: ‘Eis que chegou o tempo.’[c] Quando, porém, virem um cajado solitário [...].[d] Saibam que [...] da obra [...] e os arcontes [...] os alcançarão [...]. O medo é o verdadeiro poder [das trevas]. Portanto, se temerem o que em breve os alcançará, isso os dominará, e nenhum deles os soltará nem terá compaixão de vocês. Em vez disso, olhem para [o que está] dentro de vocês,[e] pois vocês dominaram tudo o que é terreno. Isto [...] [os] levará para cima, a um [lugar] sem domínio [e sem] tirano. Quando vocês [...] verão aqueles [...] e também [os ouvirão. Eu] lhes digo: a razão [...]. A razão é [... onde] está a verdade. Eles, porém, [...] e vocês [...] a verdade. Isto [está [...] dentro] da mente viva. Por conseguinte, [...] e a alegria de vocês [...] para que [...] as suas almas [...], para que a palavra não [...] aquilo que levantaram [...] e não puderam
    [compreendê-la] [...]. Façam com que o que está [dentro] de vocês e o que está [fora] de vocês sejam a mesma coisa.[f]


    O [...] lugar de travessia é certamente assustador [aos seus] olhos; contudo, não hesitem em atravessá-lo. Grande é a sua profundidade, vasta [é a sua] altura! [Tenham uma só mente ...], e o fogo [...] gotas de orvalho [...] todos os poderes [...] vocês. Eles [...] e [todos] os poderes [...] eles [...] antes. Eu lhes digo: [...] a alma [...] se tornará [...] em todos eles [...] vocês são [...] e que [...] não durmam [...] os filhos [...] e vocês [...] vocês [...].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Destruição” traduz o testemunho inglês; o referente e a nuance exata dependem de futura revisão do texto copta.
    reason: Preservar a amplitude escatológica e histórica de uma expressão ainda não conferida diretamente no idioma antigo.
  - marker: b
    text: O inglês “you” não distingue singular e plural. O contexto favorece aqui o plural, adotado ao longo do trecho.
    reason: Explicitar uma decisão gramatical que só poderá ser confirmada pela revisão do copta.
  - marker: c
    text: “Eis” preserva a fórmula enfática do testemunho (“Behold”) sem determinar a que “o tempo” se refere.
    reason: Manter a ênfase e a indeterminação do original disponível.
  - marker: d
    text: A imagem do “cajado solitário” é obscura, e a lacuna impede reconstruir sua função na frase.
    reason: Evitar uma interpretação simbólica não sustentada pelo fragmento.
  - marker: e
    text: O testemunho apresenta “dentro (de vocês)” com sinal editorial de incerteza; a tradução conserva essa cautela por meio dos colchetes.
    reason: Registrar a incerteza textual sem eliminar uma palavra necessária à leitura provisória.
  - marker: f
    text: A frase é preservada em sua forma paradoxal. O trecho não explica em que sentido o interior e o exterior devem tornar-se “a mesma coisa”.
    reason: Não impor uma interpretação teológica ou psicológica ao dito.
lexical_decisions:
- source_word: destruction
  choice: destruição
  rationale: Mantém o sentido amplo do testemunho inglês sem decidir entre destruição histórica, ruína espiritual ou perdição escatológica.
- source_word: archons
  choice: arcontes
  rationale: Conserva o termo técnico associado a poderes governantes no contexto do códice, em vez de reduzi-lo a autoridades humanas.
- source_word: logic
  choice: razão
  rationale: Em português corrente, “razão” expressa melhor uma faculdade ou princípio racional; “lógica” sugeriria sobretudo uma disciplina formal. A leitura permanece provisória até a revisão do copta.
- source_word: living mind
  choice: mente viva
  rationale: Tradução formal que preserva a formulação incomum, sem interpretá-la como espírito, intelecto divino ou pessoa específica.
- source_word: crossing place
  choice: lugar de travessia
  rationale: Mantém a imagem espacial e o caráter indeterminado da passagem.
- source_word: a single mind
  choice: uma só mente
  rationale: Preserva a possível ideia de unidade interior sem ampliá-la para unanimidade comunitária.
theological_decisions:
- issue: Identidade dos “arcontes”
  choice: Manter “arcontes” sem explicação dogmática no corpo do texto.
  alternative: Traduzir como “governantes”, “potestades” ou “demônios”.
  rationale: O fragmento não permite determinar com segurança se são autoridades cósmicas, espirituais ou outra classe de poderes.
- issue: O medo como poder das trevas
  choice: 'Preservar a afirmação direta: “O medo é o verdadeiro poder [das trevas]”.'
  alternative: Parafrasear como se o medo apenas desse poder às trevas.
  rationale: A paráfrase resolveria uma tensão que o testemunho deixa aberta; os colchetes também assinalam que “das trevas” é restauração editorial.
- issue: Movimento para um lugar sem domínio nem tirano
  choice: Conservar a linguagem espacial e política sem identificar o lugar.
  alternative: Interpretá-lo explicitamente como céu, reino divino ou libertação interior.
  rationale: O texto fragmentário não sustenta uma identificação inequívoca.
- issue: Interior e exterior tornados a mesma coisa
  choice: Traduzir literalmente, sem associar a frase a uma doutrina sacramental, ascética ou metafísica específica.
  alternative: Explicá-la como integração psicológica, união mística ou abolição da diferença corporal.
  rationale: A formulação admite mais de uma leitura e deve permanecer aberta.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural. As lacunas são indicadas por “[...]”; palavras entre colchetes representam restaurações ou complementos editoriais do testemunho. A redação é necessariamente provisória, pois se baseia no testemunho inglês de domínio público fornecido, e a revisão direta do manuscrito copta do Códice de Nag Hammadi III,5 ainda está pendente.
