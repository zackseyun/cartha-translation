  naturalness: O registro é adequado e legível em português contemporâneo. Ajustam-se “quando chegará o tempo” para “quando virá o tempo” e “os soltará” para “os libertará”, que soam mais naturais neste contexto.
  terminology: “Arcontes”, “razão”, “mente viva”, “lugar de travessia” e “uma só mente” são escolhas prudentes e não interpretativas. “Cajado solitário” mantém a imagem obscura do testemunho e deve permanecer sem explicação adicional.
  issues:
