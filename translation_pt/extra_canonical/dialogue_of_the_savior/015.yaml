review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês disponível e preserva adequadamente colchetes, lacunas e a formulação ambígua sobre espíritos e almas. Contudo, os dois-pontos inseridos dentro de restaurações entre colchetes não são sustentados pelo testemunho, que assinala vírgulas; devem ser removidos para não introduzir uma articulação discursiva editorial.
  naturalness: O português é moderno, claro e de registro exortativo adequado. «Despojem-se», «ira», «obras» e «descanso» são escolhas naturais e proporcionais ao caráter do texto.
  terminology: «Obras», «verdadeira vida», «descanso», «espíritos» e «almas» preservam a terminologia e suas ambiguidades, sem impor leitura doutrinária. «Salvador» é a forma estabelecida para o título.
  issues:
  - severity: low
    issue: 'Pontuação editorial indevida em «[vocês: ...]» e «[vocês: guardem-se]».'
    rationale: O testemunho registra «[you, . . .]» e «[you, guard yourselves]». Os dois-pontos acrescentam uma relação explicativa ou citacional ausente no texto-base; vírgulas mantêm melhor a evidência fragmentária.
  revised_text: '“Quanto a vocês, empenhem-se com diligência para se libertarem da [ira] e do ciúme. Despojem-se de suas [obras] e não [...]. [] [...] censura [...], pois eu digo a [vocês, ...] vocês receberão [...] muito [...] aquele que buscou, tendo [descoberto a verdadeira vida]. Esse [alcançará o descanso e] viverá para sempre. Eu digo a [vocês, guardem-se], para que não conduzam [seus] espíritos e suas almas ao erro.”



    [O Diálogo] do Salvador'
