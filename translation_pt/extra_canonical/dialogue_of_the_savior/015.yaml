base_translation:
  language: en
  yaml_path: translation/extra_canonical/dialogue_of_the_savior/015.yaml
  text: 'As for you, strive diligently to free yourselves from [wrath] and jealousy. Strip yourselves of your [works], and do not [. . .]. [] [. . .] reproach [. . .], because I say to [you, . . .] you will receive [. . .] much [. . .] the one who searched and [discovered the true life]. This person will [attain rest and] live forever. I say to [you, guard yourselves], so that you do not lead [your] spirits and souls into error.


    [The Dialogue] of the Savior'
translation:
  language: pt
  text: '“Quanto a vocês, empenhem-se com diligência para se libertarem da [ira] e do ciúme. Despojem-se de suas [obras] e não [...]. [] [...] censura [...], pois eu digo a [vocês: ...] vocês receberão [...] muito [...] aquele que buscou, tendo [descoberto a verdadeira vida]. Esse [alcançará o descanso e] viverá para sempre. Eu digo a [vocês: guardem-se], para que não conduzam [seus] espíritos e suas almas ao erro.”


    [O Diálogo] do Salvador'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: strive diligently
  choice: empenhem-se com diligência
  rationale: Preserva a intensidade da exortação em português natural e digno.
- source_word: free yourselves
  choice: se libertarem
  rationale: Mantém a ação reflexiva de livrar a si mesmos, sem acrescentar agente ou mecanismo.
- source_word: wrath
  choice: ira
  rationale: Equivalente conciso e tradicional, mantido entre colchetes por ser restauração editorial.
- source_word: jealousy
  choice: ciúme
  rationale: Preserva o sentido afetivo e moral mais direto do testemunho, sem o restringir a 'inveja'.
- source_word: strip from yourselves
  choice: despojem-se de
  rationale: Reproduz a metáfora de retirar algo de si com linguagem corrente e solene.
- source_word: works
  choice: obras
  rationale: Mantém a amplitude semântica e a possível carga teológica, sem substituir por 'atos' ou 'ações'.
- source_word: searched
  choice: buscou
  rationale: Forma natural que preserva a ação de procurar, sem explicitar indevidamente o objeto perdido na lacuna.
- source_word: true life
  choice: verdadeira vida
  rationale: Mantém a formulação e sua possível força soteriológica sem interpretação adicional.
- source_word: achieve rest
  choice: alcançará o descanso
  rationale: Expressa obtenção do repouso escatológico ou espiritual, preservando sua ambiguidade.
- source_word: lead ... into error
  choice: conduzam ... ao erro
  rationale: Conserva a imagem causativa do testemunho, em vez de suavizá-la para apenas 'errar'.
- source_word: Savior
  choice: Salvador
  rationale: Título cristológico português consagrado e diretamente inteligível.
theological_decisions:
- issue: Sentido de 'obras'
  choice: Preservar 'obras' sem qualificação
  alternative: ações, más obras ou obras terrenas
  rationale: O texto danificado não permite definir a natureza das obras; uma qualificação resolveria indevidamente a tensão teológica.
- issue: Natureza do 'descanso'
  choice: Traduzir literalmente como 'descanso'
  alternative: repouso eterno, salvação ou paz
  rationale: A expressão pode ter dimensão espiritual ou escatológica; a tradução não deve escolher uma interpretação exclusiva.
- issue: Relação entre espírito e alma
  choice: Manter ambos os termos no plural conforme o testemunho
  alternative: fundir em 'ser interior' ou harmonizar os números
  rationale: A distinção antropológica do texto deve permanecer visível, inclusive onde a formulação é incomum.
- issue: Agência na entrada em erro
  choice: Manter 'não conduzam ... ao erro'
  alternative: não deixem que ... se desviem
  rationale: O testemunho atribui aos destinatários uma responsabilidade ativa; suavizá-la alteraria a exortação.
translation_notes:
  register: Português moderno, amplamente internacional e legível no Brasil, com tom exortativo e digno. Os colchetes e as reticências reproduzem restaurações editoriais e lacunas do manuscrito. A sequência fragmentária, inclusive o colchete vazio, foi preservada sem reconstrução conjectural. Rascunho necessariamente provisório, pois a evidência fornecida depende de um testemunho inglês de domínio público e a revisão direta do copta ainda está pendente.
