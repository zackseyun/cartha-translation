review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência fragmentária, os colchetes, as lacunas e a ambiguidade teológica do testemunho inglês fornecido. Contudo, «permanecerá» enfraquece a imagem explícita de sobrevivência em «will survive», e «o coração de vocês» altera indevidamente o plural «your hearts». A revisão direta do copta continua pendente.
  naturalness: O português é em geral claro, moderno e de registro digno. «Eis» reproduz «Behold» de forma mais direta e idiomática que «Vejam» neste contexto, sem introduzir um novo imperativo dirigido ao grupo.
  terminology: «Salvador», «mente», «alma», «espírito», «pequeninos» e «acolher» são escolhas adequadas e não impõem uma leitura doutrinária. «Feitos» corresponde mais de perto a «deeds» do que «obras», reservada no trecho anterior para «work».
  issues:
  - severity: low
    issue: «[a obra de vocês] permanecerá» para «[your work] will survive»
    rationale: «Sobreviverá» conserva a imagem verbal e o contraste mais forte entre a obra e as pessoas, sem interpretar seu sentido.
  - severity: medium
    issue: «Enquanto o coração de vocês estiver obscurecido» para «While your hearts are darkened»
    rationale: O singular não é sustentado pelo testemunho, que traz «hearts» no plural. Deve-se preservar o plural.
  - severity: low
    issue: «as obras das almas» para «the deeds of the souls»
    rationale: «Feitos» é equivalente mais específico para «deeds» e evita confusão lexical com «work», traduzido por «obra» no enunciado anterior.
  - severity: low
    issue: «Vejam» para «Behold»
    rationale: «Eis» reproduz a partícula apresentativa sem converter desnecessariamente a formulação em uma ordem explícita.
