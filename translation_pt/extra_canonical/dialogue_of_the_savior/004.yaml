review_pass:
  verdict: revise
  source_fidelity: A versão acompanha de perto o testemunho inglês fornecido e preserva adequadamente lacunas ([. . .]) e restaurações entre colchetes. Contudo, «o coração de vocês» reduz indevidamente o plural expresso em «your hearts»; a revisão restitui «seus corações».
  naturalness: O português é claro, moderno e mantém registro digno. «Eis que» soa mais natural e idiomático neste registro do que «Vejam» para a partícula apresentativa restaurada. A formulação fragmentária e por vezes incomum é mantida onde decorre do testemunho danificado.
  terminology: «Salvador», «Senhor», «mente», «alma», «pequeninos», «acolher» e «habitar» são escolhas adequadas e não impõem leitura doutrinária. «Obras» para «deeds» preserva aceitavelmente a amplitude do testemunho, embora permaneça dependente de futura consulta direta ao copta.
  issues:
  - severity: low
    issue: Plural de «hearts» foi neutralizado.
    rationale: 'O testemunho diz «While your hearts are darkened», mas o rascunho traz «Enquanto o coração de vocês estiver obscurecido». Deve-se conservar o plural: «Enquanto seus corações estiverem obscurecidos».'
  - severity: low
    issue: «Vejam» é uma apresentação menos fiel ao valor de «Behold».
    rationale: «Eis que» preserva melhor a função apresentativa solene do original inglês, sem converter a expressão em uma ordem dirigida aos ouvintes.
