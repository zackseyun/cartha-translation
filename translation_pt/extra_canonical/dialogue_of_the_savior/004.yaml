translation:
  language: pt
  text: 'Mateus disse: “Como [. . .]?”


    [] O Salvador disse: “[Se vocês não mantiverem em ordem] o que está dentro de vocês, [a obra de vocês] permanecerá, mas vocês [não].”


    Judas [disse]: “Senhor, [eu gostaria de conhecer todas] as obras das almas [que pertencem a] estes pequeninos. Quando [. . .], onde habitarão? [. . .] o espírito [. . .]?”


    O Senhor [disse: “. . . acolham] essas almas. Elas não morrem nem são destruídas, porque compreenderam [seus] companheiros e aquele que as acolherá, pois a verdade busca os sábios e os justos.”


    O Salvador [disse]: “A lâmpada [do] corpo é a mente. Enquanto [o que está dentro de] vocês for mantido em ordem, isto é, [a alma], seus corpos serão [iluminados]. Enquanto o coração de vocês estiver obscurecido, a luz que vocês [] esperam [permanecerá longe de vocês]. Eu [os chamei para junto de mim], porque logo partirei, para que [vocês acolham] minha palavra entre [vocês. Vejam], eu a envio a [vocês].”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Mantém o título do testemunho com linguagem bíblica corrente e digna.
- source_word: maintain in order
  choice: manter em ordem
  rationale: Preserva a imagem e a possível dimensão ética ou interior da expressão sem explicá-la além do testemunho disponível.
- source_word: work
  choice: obra
  rationale: Conserva a amplitude semântica entre ação, labor e resultado, evitando decidir entre sentidos possíveis.
- source_word: little ones
  choice: pequeninos
  rationale: Reproduz o caráter relacional e potencialmente simbólico do termo sem identificá-lo com crianças ou discípulos.
- source_word: mind
  choice: mente
  rationale: É a correspondência moderna mais direta; uma revisão do copta poderá determinar se 'intelecto' seria preferível.
- source_word: accept
  choice: acolher
  rationale: Expressa recepção pessoal de modo natural em português, embora o verbo deva ser revisto diretamente no copta.
- source_word: dwell
  choice: habitar
  rationale: Preserva o registro solene e a ideia de residência, sem acrescentar uma localização escatológica.
theological_decisions:
- issue: Identidade de 'o que está dentro de vocês'
  choice: Preservar a glosa restaurada 'isto é, [a alma]'
  alternative: Harmonizar livremente o interior com mente, espírito ou coração
  rationale: O trecho associa termos distintos e está danificado; a tradução não deve impor uma antropologia sistemática.
- issue: Destino das almas dos pequeninos
  choice: Manter a pergunta e a resposta fragmentárias
  alternative: Completar um cenário de pós-morte ou salvação
  rationale: O manuscrito não oferece base suficiente para definir onde habitam ou em que condição.
- issue: Sobrevivência da obra em contraste com a pessoa
  choice: Traduzir literalmente o contraste
  alternative: Interpretá-lo como recompensa, legado ou condenação
  rationale: A formulação é teologicamente tensa e ambígua, devendo permanecer assim.
- issue: A verdade busca os sábios e os justos
  choice: Conservar a personificação da verdade
  alternative: Parafrasear como Deus ou o Salvador buscando essas pessoas
  rationale: A personificação pertence ao testemunho e não deve receber uma identificação doutrinária não explicitada.
translation_notes:
  register: Tradução provisória em português moderno, de leitura brasileira ampla e registro digno. Os colchetes indicam restaurações editoriais ou lacunas, e “[. . .]” assinala texto perdido, seguindo o testemunho inglês fornecido. Como a revisão direta do copta ainda está pendente, foram evitadas reconstruções adicionais e harmonizações teológicas. Não há marcadores de nota no texto porque nenhuma nota de publicação foi acrescentada.
