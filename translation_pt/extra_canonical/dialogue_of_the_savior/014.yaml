translation:
  language: pt
  text: 'Maria perguntou: “De que tipo é a semente de mostarda? É do céu ou da terra?”


    O Senhor disse: “Depois que o Pai estabeleceu o mundo para si, deixou muitas coisas que restaram com a Mãe do Todo.[a] É por isso que ele semeia e trabalha.”


    Judas disse: “Tu nos disseste isso a partir da mente verdadeira. Quando orarmos, como devemos orar?”


    O Senhor disse: “Orem no lugar onde não há mulher.”[b]


    Mateus disse: “Ele nos diz: ‘Orem no lugar onde não há mulher’. Isso significa destruir as obras do feminino. Não é porque exista outro tipo de nascimento, mas para que cessem [de dar à luz].”[c]


    Maria disse: “Elas nunca serão destruídas?”


    O Senhor disse: “[Vocês] sabem que elas perecerão [mais uma vez], […], e [as obras] do [feminino que estão aqui] também serão [destruídas].”


    Judas disse [a Mateus]: “As obras do [feminino] de fato perecerão. Então os arcontes [invocarão seus éons], e estaremos preparados para eles.”[d]


    O Senhor disse: “Será que eles verão [vocês e] verão aqueles que os acolhem? Vejam: do Pai procede uma palavra verdadeira rumo ao abismo, em silêncio, com o clarão de um relâmpago; e ela gera.[e] Eles a veem ou a vencem? Certamente vocês conhecem melhor [o caminho] que [nem anjo] nem autoridade conhece. É o caminho do Pai e do Filho, pois os dois são um; e vocês seguirão pelo [caminho] que conheceram. Ainda que os arcontes se tornem enormes, não conseguirão alcançá-lo. Eu lhes digo a [verdade]: até para mim é difícil alcançá-lo.”


    […] [Maria] perguntou [ao Senhor]: “Se as obras [são destruídas, o que, de fato,] destrói uma obra?”


    [O Senhor disse]: “Vocês sabem que, [sempre que] eu [a] destruo, [ela] vai para o seu próprio lugar.”


    Judas disse: “Como o espírito se torna visível?”


    O Senhor disse: “Como a espada [se torna visível]?”


    Judas disse: “Como a luz se torna visível?”


    O Senhor disse: “[Ela se torna visível] eternamente por si mesma.”


    Judas perguntou: “Quem dissolve as obras de quem? As obras [dissolvem] o mundo, ou é o mundo que dissolve as obras?”[f]


    O Senhor [respondeu]: “Quem [compreende é quem dissolve as obras]. Isso é assim porque aquele que conheceu as obras deve realizar a [vontade] do Pai.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mãe do Todo” é um título cosmológico do escrito. A relação exata entre o Pai, o mundo e aquilo que permaneceu com ela não é explicada nesta passagem.
    reason: Evitar que leitores confundam o título com uma referência simples à maternidade humana ou com uma doutrina posterior específica.
  - marker: b
    text: A frase é deliberadamente difícil. O texto a relaciona em seguida às “obras do feminino”, mas não define com clareza se fala de procriação, condição corporal, prática ascética ou uma realidade cosmológica.
    reason: Preservar a ambiguidade e impedir uma interpretação misógina ou ascética automática.
  - marker: c
    text: As palavras entre colchetes representam restauração de texto danificado ou ausente no manuscrito; por isso, a formulação permanece incerta.
    reason: Sinalizar a condição textual da reconstrução.
  - marker: d
    text: “Arcontes” e “éons” são termos cosmológicos técnicos. Aqui, os arcontes parecem ser poderes governantes hostis; o conteúdo da invocação de seus éons foi restaurado em uma lacuna.
    reason: Auxiliar a compreensão sem impor um sistema cosmológico completo à passagem.
  - marker: e
    text: Também seria possível traduzir a última expressão como “ela é geradora” ou “é fecunda”. O referente é, ao que parece, a “palavra verdadeira”.
    reason: Registrar a ambiguidade gramatical e lexical da formulação.
  - marker: f
    text: O manuscrito alterna aqui a linguagem de “dissolver” com a de “destruir” usada anteriormente. A tradução conserva essa diferença.
    reason: Preservar uma possível distinção conceitual no texto.
lexical_decisions:
- source_word: Mother of the All
  choice: Mãe do Todo
  rationale: Preserva o título cosmológico do testemunho sem convertê-lo em uma designação denominacional ou explicá-lo dentro do texto.
- source_word: works
  choice: obras
  rationale: Mantém a amplitude e a repetição do termo, que pode indicar ações, produtos ou processos, sem resolver a ambiguidade.
- source_word: female
  choice: feminino
  rationale: Distingue a expressão abstrata das referências pessoais a 'mulher' e evita pressupor que o texto fale simplesmente de todas as mulheres.
- source_word: archons
  choice: arcontes
  rationale: Emprega a transliteração corrente para os poderes governantes da cosmologia do escrito, preservando sua especificidade técnica.
- source_word: aeons
  choice: éons
  rationale: Mantém o termo cosmológico técnico, sem reduzi-lo apenas a 'eras' ou identificá-lo dogmaticamente com seres específicos.
- source_word: generative
  choice: ela gera
  rationale: Expressa de modo natural a força produtiva ou geradora da palavra, preservando a conexão com o campo semântico do nascimento.
- source_word: dissolves
  choice: dissolve
  rationale: Conserva a distinção lexical em relação a 'destruir' usada anteriormente e deixa aberta a natureza dessa dissolução.
- source_word: true mind
  choice: mente verdadeira
  rationale: Tradução formal que preserva uma formulação conceitualmente difícil sem substituí-la por 'sabedoria' ou 'entendimento correto'.
theological_decisions:
- issue: Sentido de “onde não há mulher”
  choice: Preservar literalmente a fala e acrescentar nota de cautela
  alternative: Parafrasear como abstinência, celibato, interioridade espiritual ou ausência de desejo
  rationale: O próprio diálogo oferece uma interpretação enigmática ligada às 'obras do feminino', mas não elimina todas as possibilidades; a tradução não deve impor uma leitura sectária.
- issue: Identidade do sujeito em “ele semeia e trabalha”
  choice: Manter o pronome masculino sem identificar explicitamente seu referente
  alternative: Substituir por 'o Pai' ou por outro agente cosmológico
  rationale: O testemunho inglês deixa possível tensão referencial; explicitar o sujeito resolveria indevidamente a ambiguidade.
- issue: Unidade do Pai e do Filho
  choice: Traduzir “os dois são um”
  alternative: Expandir para unidade de essência, propósito ou pessoa
  rationale: A formulação deve permanecer aberta quanto à natureza exata da unidade afirmada.
- issue: Dificuldade do Senhor em alcançar o caminho
  choice: Preservar a declaração textual
  alternative: Emendar ou suavizar a frase por razões cristológicas
  rationale: A afirmação apresenta tensão teológica genuína no testemunho e não deve ser harmonizada silenciosamente.
- issue: Destruição e dissolução das obras
  choice: Manter os dois verbos distintos
  alternative: Uniformizar ambos como 'destruir'
  rationale: A distinção pode ser significativa para a lógica do diálogo e deve ser preservada, mesmo sem interpretação conclusiva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. Empregou-se “vocês” nas falas dirigidas ao grupo e “tu” quando Judas se dirige diretamente ao Senhor, acompanhando a distinção de número. Os colchetes foram preservados como sinais de lacunas ou restaurações, e os números de página do manuscrito foram omitidos. Esta é uma versão provisória baseada no testemunho inglês público fornecido; a revisão direta do copta ainda está pendente.
