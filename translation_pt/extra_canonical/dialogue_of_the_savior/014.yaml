review_pass:
  verdict: revise
  source_fidelity: A versão preserva muito bem a sequência dialogal, os termos cosmológicos técnicos, as lacunas e restaurações entre colchetes e as ambiguidades teológicas do testemunho inglês provisório. Há, porém, pequenos ajustes necessários para representar mais precisamente a sintaxe de “because they should cease [giving birth]” e para conservar o indicador de restauração em “[then]”.
  naturalness: O português é moderno, claro e de registro adequado. Ajustes pontuais tornam mais natural “muito do que restara” e evitam que uma construção de finalidade (“para que”) substitua a explicação causal do testemunho.
  terminology: “Mãe do Todo”, “obras”, “feminino”, “arcontes”, “éons”, “mente verdadeira” e “dissolver” foram mantidos de maneira consistente e não doutrinária. As notas explicam os termos e as incertezas sem resolver indevidamente as ambiguidades.
  issues:
  - severity: medium
    issue: A oração sobre cessar de dar à luz foi vertida como finalidade.
    rationale: '“Não é porque exista outro tipo de nascimento, mas para que cessem...” sugere um propósito. O testemunho diz “but because they should cease [giving birth]”, que estabelece a razão ou explicação: “mas porque devem cessar [de dar à luz]”.'
  - severity: low
    issue: O elemento restaurado “[then]” não foi mantido entre colchetes.
    rationale: Em “Então os arcontes [invocarão seus éons]”, “Então” corresponde ao “[then]” restaurado no testemunho. Deve permanecer entre colchetes para sinalizar a incerteza textual.
  - severity: low
    issue: “Deixou muitas coisas que restaram” é pouco idiomático em português.
    rationale: “Deixou com a Mãe do Todo muito do que restara” comunica o mesmo conteúdo e mantém mais claramente a relação entre o remanescente e a Mãe do Todo.
