lexical_decisions:
- source_word: spirit
  choice: espírito
  rationale: Mantém o campo semântico do testemunho e a ambiguidade entre uma realidade espiritual genérica e uma entidade específica; usa minúscula como no texto fornecido.
- source_word: secrecy
  choice: mistério
  rationale: Em português, “mistério” comunica com naturalidade algo oculto ou reservado do espírito; “segredo” seria possível, mas menos adequado ao registro cosmológico do trecho.
- source_word: mind
  choice: mente
  rationale: Preserva a distinção do texto entre mente e alma sem introduzir o termo teológico mais específico “intelecto”.
- source_word: set up
  choice: estabelecer / estar estabelecida
  rationale: Reproduz o mesmo núcleo verbal recorrente no testemunho, embora a formulação permaneça estranha devido ao estado fragmentário do texto.
- source_word: circumcision
  choice: circuncisão
  rationale: Mantém tanto o referente ritual quanto sua aplicação interior posterior, sem decidir antecipadamente se o autor rejeita ou reinterpreta a prática física.
- source_word: powers
  choice: poderes
  rationale: Conserva a possível referência cosmológica a potências supra e inframundanas sem explicá-las denominacionalmente.
- source_word: word
  choice: palavra
  rationale: Evita capitalizar ou transformar automaticamente o termo em título cristológico, pois o contexto e o testemunho não obrigam essa identificação.
- source_word: aeons
  choice: éons
  rationale: Transliteração corrente que preserva o termo cosmológico técnico e evita reduzi-lo simplesmente a “eras” neste contexto.
- source_word: inferno
  choice: fogo infernal
  rationale: Expressa um grande incêndio ou região ígnea sem identificar necessariamente o termo com o inferno escatológico de tradições posteriores.
- source_word: hang from
  choice: dependem de
  rationale: Oferece português natural e preserva a noção de sustentação ou dependência cosmológica; a frase seguinte reforça esse sentido.
theological_decisions:
- issue: Circuncisão ritual e circuncisão interior
  choice: Preservar a afirmação de que a circuncisão é proveitosa e, em seguida, a linguagem de circuncidar o coração.
  alternative: Interpretar o trecho como rejeição explícita da circuncisão física em favor apenas da espiritual.
  rationale: O texto fragmentário cria tensão entre as duas ideias e não autoriza resolver essa tensão silenciosamente.
- issue: Identidade da “palavra”
  choice: Traduzir com inicial minúscula.
  alternative: Usar “Palavra” ou “Verbo” como título pessoal ou cristológico.
  rationale: O testemunho fornecido não identifica de maneira inequívoca a palavra com Cristo ou outra hipóstase.
- issue: Natureza do “espírito”
  choice: Manter “espírito” em minúscula.
  alternative: Capitalizar como referência ao Espírito Santo.
  rationale: A cosmologia fragmentária permite mais de uma leitura, e a identificação trinitária seria interpretativa.
- issue: Poderes de cima e de baixo
  choice: Manter a formulação cosmológica sem explicação doutrinária.
  alternative: Identificá-los como anjos, demônios ou governantes cósmicos específicos.
  rationale: O trecho não fornece identificação suficiente.
- issue: Pronomes cosmológicos ambíguos
  choice: Conservar os pronomes e registrar a incerteza em notas.
  alternative: Substituir os pronomes por referentes definidos para tornar a narrativa mais clara.
  rationale: As lacunas e a sintaxe do testemunho não permitem determinar com segurança os referentes.
translation_notes:
  register: Português moderno, digno e legível, com construções brasileiras amplamente compreensíveis. Os colchetes preservam restaurações editoriais; […] marca lacunas; os sinais angulares indicam suplemento editorial. A tradução é necessariamente provisória porque se baseia no testemunho inglês público fornecido, com revisão direta do copta ainda pendente. Números de página intrusivos foram removidos do corpo e ambiguidades pronominais relevantes foram mantidas.
