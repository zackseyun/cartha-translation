translation:
  language: pt
  text: 'Judas perguntou: “Dize-nos, Senhor, o que [existia] antes que [o céu e] a terra viessem a existir?”


    O Senhor disse: “Havia trevas e água, e […] um espírito estava sobre a [água]. E eu lhes digo [a verdade]: Vejam, aquilo que vocês procuram e a respeito do que perguntam [está] dentro de vocês; e isso [possui] o poder e o mistério [do] espírito, porque [tem origem] [no espírito]. A injustiça entrou [para destruir] continuamente a mente. Vejam, […].”


    [Mateus] disse: “Senhor, dize-nos: onde [a alma] está estabelecida, e onde habita a verdadeira [mente]?”


    O Senhor [disse]: “O fogo do espírito veio a existir [entre] os dois; assim, [o espírito] passou a existir, e a verdadeira mente dentro deles. [Se] alguém estabelecer a alma no alto, então [ela será] exaltada.”


    Mateus lhe perguntou: […] “[A circuncisão não é necessária] quando é entendida [segundo a verdadeira interpretação]?”


    O Senhor [disse: “A circuncisão é] mais proveitosa do que a obra de vocês. [Retirem] de si mesmos [aquilo que pode] persegui-los,[a] sim, tudo [o que há] dentro do coração de vocês; pois, à medida que o coração de vocês [for circuncidado], assim também [vocês encontrarão] um modo de vencer os poderes de cima e de baixo. E eu lhes digo: aquele [que possui] poder renuncie [a ele] e se arrependa; e aquele que [entende] busque, encontre e se alegre.”


    Judas disse: “Vejam, [eu] percebo que tudo é [exatamente] como um sinal sobre [a terra], e é por isso que essas coisas vieram a existir dessa maneira.”


    O Senhor [disse]: “Quando o Pai estabeleceu o mundo, ele [reuniu] parte de suas águas, e a palavra saiu delas. […] Ela passou por muita [aflição, mas] estava acima da trajetória [das estrelas] que circunda toda a terra.”


    [Ele continuou]: “A água reunida [no alto] está além das estrelas; e, [além] da água, <há> um grande fogo infernal que as cerca como uma muralha. Assim que várias das entidades interiores se separaram das demais, os períodos de tempo [começaram a ser calculados].


    “Quando [o todo][b] foi estabelecido, ele[c] olhou [para baixo] — o Pai, que lhe disse: ‘Vai, [faz sair algo] de ti mesmo, para que [a terra] não tenha falta de coisa alguma, de geração em [geração e] de era em era.’


    “Então ele[d] fez sair de si mesmo fontes de leite, fontes de mel, de azeite e de vinho, além de bons frutos, sabores deliciosos e raízes saudáveis, [para que] a terra não tivesse falta de coisa alguma, de geração [em] geração e de era em era.


    “Ele está acima de […]; […] permaneceu de pé [e mostrou] sua beleza […]. E do lado de fora [havia uma grande luz], mais brilhante [do que] aquela que se assemelha a ela,[e] porque aquela governa sobre [todos] os éons acima e abaixo. [A luz foi] extraída do fogo e espalhada pelo [firmamento], acima e abaixo. Os que estão sobre o céu, acima, e sobre a terra, abaixo, dependem deles.[f] Tudo depende deles.”


    Quando Judas ouviu isso, prostrou-se, caiu de joelhos e louvou o Senhor.


    [a] O manuscrito é interrompido aqui por uma indicação de página; ela não faz parte da frase.

    [b] Reconstrução incerta; literalmente, o testemunho traduzido traz “a (coisa toda)”.

    [c] O referente deste pronome é incerto no texto preservado.

    [d] O referente deste pronome também é incerto; pode retomar o todo estabelecido ou outra entidade mencionada no trecho lacunoso.

    [e] As referências dos pronomes nesta frase são incertas por causa das lacunas.

    [f] O antecedente de “deles” é incerto no texto preservado.'
