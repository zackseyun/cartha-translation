translation:
  language: pt
  text: 'Tendo já planejado todas as coisas em sua mente com seu Filho, Deus permitiu que, no tempo anterior, fôssemos levados por impulsos desordenados conforme desejávamos, desviados por prazeres e paixões. Não porque se agradasse de nossos pecados, mas porque nos suportava; não porque aprovasse aquele tempo de injustiça, mas porque preparava o presente tempo de justiça. Assim, depois de nossas próprias obras terem demonstrado, no passado, que éramos indignos da vida, agora poderíamos ser feitos dignos pela bondade de Deus; e, depois de ficar evidente nossa incapacidade de entrar por nós mesmos no reino de Deus, poderíamos ser capacitados pelo poder de Deus.


    Quando nossa injustiça chegou à sua plena medida, e ficou inteiramente manifesto que sua retribuição esperada era castigo e morte, chegou o tempo determinado por Deus para manifestar, dali em diante, sua bondade e seu poder. Ó imensa benevolência e amor de Deus! Ele não nos odiou, nem nos rejeitou, nem guardou rancor contra nós; ao contrário, foi paciente e tolerante. Compadecendo-se de nós, tomou sobre si os nossos pecados e entregou seu próprio Filho como resgate por nós: o Santo pelos transgressores da lei, o Inocente pelos maus, o Justo pelos injustos, o Incorruptível pelos corruptíveis, o Imortal pelos mortais.


    Pois o que, senão a justiça dele, poderia ter coberto nossos pecados?


    Em quem nós, transgressores da lei e ímpios, poderíamos ter sido justificados, a não ser unicamente no Filho de Deus?


    Ó doce troca! Ó obra insondável! Ó benefícios inesperados! A injustiça de muitos foi encoberta em um só Justo, e a justiça de um só justificou muitos injustos!


    Portanto, depois de haver demonstrado, no tempo anterior, a incapacidade de nossa natureza para alcançar a vida, e de agora ter revelado um Salvador capaz de salvar até mesmo os que nada podem, Deus quis que, por ambas as razões, crêssemos em sua bondade e o considerássemos nosso cuidador, pai, mestre, conselheiro, médico, entendimento, luz, honra, glória, força e vida.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória feita a partir do testemunho inglês de domínio público fornecido. O Codex Argentoratensis se perdeu e é conhecido por meio de cópias; por isso, esta passagem ainda requer revisão direta à luz do texto grego e de sua tradição textual.
    reason: A base disponibilizada não inclui o texto grego, e várias escolhas lexicais — especialmente “obra insondável”, “cuidador” e “entendimento” — devem permanecer explicitamente provisórias.
lexical_decisions:
- source_word: disorderly impulses
  choice: impulsos desordenados
  rationale: Mantém a força moral do testemunho inglês sem especificar uma categoria psicológica ou teológica ausente.
- source_word: lusts
  choice: paixões
  rationale: Em português atual, evita restringir o termo ao desejo sexual, preservando seu campo mais amplo de desejos desordenados.
- source_word: was creating
  choice: preparava
  rationale: Expressa a instauração do novo tempo de justiça em português natural, sem sugerir necessariamente criação a partir do nada.
- source_word: made deserving
  choice: ser feitos dignos
  rationale: Preserva a formulação passiva e a atribuição da iniciativa à bondade de Deus, sem substituir a tensão do texto por terminologia confessional posterior.
- source_word: ability of God
  choice: poder de Deus
  rationale: Produz a antítese natural entre a incapacidade humana e o poder divino.
- source_word: parted with His own Son
  choice: entregou seu próprio Filho
  rationale: Comunica a entrega custosa do Filho sem introduzir uma descrição técnica não explicitada no testemunho.
- source_word: ransom
  choice: resgate
  rationale: Equivalente corrente que conserva a imagem de libertação mediante preço.
- source_word: guileless
  choice: Inocente
  rationale: Transmite ausência de dolo ou culpa em linguagem clara e digna; 'sem dolo' seria mais formal, porém menos natural.
- source_word: inscrutable creation
  choice: obra insondável
  rationale: O sentido exato depende de futura revisão grega; 'obra' preserva a ideia de realização divina sem a leitura potencialmente enganosa de criação material.
- source_word: nurse
  choice: cuidador
  rationale: Mantém o sentido de quem nutre e cuida, evitando em português moderno a leitura quase exclusiva de profissional de enfermagem.
- source_word: mind
  choice: entendimento
  rationale: Preserva a imagem de Deus como fonte de compreensão ou inteligência sem a estranheza excessiva de 'mente' nesta enumeração.
theological_decisions:
- issue: A relação entre indignidade humana e ser feito digno por Deus
  choice: “poderíamos ser feitos dignos pela bondade de Deus”
  alternative: “poderíamos ser considerados dignos” ou “merecedores”
  rationale: Mantém a tensão do texto e a voz passiva, sem decidir se se trata primariamente de transformação, declaração ou mérito.
- issue: Deus “tomou sobre si” os pecados
  choice: “tomou sobre si os nossos pecados”
  alternative: “assumiu nossos pecados”
  rationale: Conserva a formulação forte do testemunho sem desenvolver uma teoria específica da expiação.
- issue: A entrega do Filho como resgate
  choice: “entregou seu próprio Filho como resgate por nós”
  alternative: “deu seu próprio Filho em nosso lugar”
  rationale: Preserva tanto a imagem explícita de resgate quanto a sequência substitutiva, sem fundi-las em uma fórmula dogmática posterior.
- issue: Justificação no Filho de Deus
  choice: “poderíamos ter sido justificados... no Filho de Deus”
  alternative: “poderíamos ter sido declarados justos por meio do Filho de Deus”
  rationale: Retém a expressão locativa/instrumental e a ambiguidade teológica de 'justificados', em vez de impor uma única explicação.
- issue: A justiça de um só justificando muitos
  choice: “a justiça de um só justificou muitos injustos”
  alternative: “a retidão de um tornou justos muitos maus”
  rationale: Conserva o paralelismo e a terminologia jurídica e moral do testemunho, sem decidir o mecanismo dessa justificação.
- issue: Referente dos pronomes divinos
  choice: Uso de “Deus” em pontos estratégicos e de “ele/dele” nos demais
  alternative: Capitalizar todos os pronomes divinos
  rationale: Clarifica o referente em português, sobretudo após menção ao Filho, sem recorrer à capitalização devocional não exigida pelo texto.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom digno e ritmo retórico preservado. Mantiveram-se as exclamações, perguntas e antíteses do trecho. Evitaram-se arcaísmos como “concupiscências”, “iniquamente” e “ama”, bem como linguagem ligada a uma tradição denominacional específica. A tradução é necessariamente provisória porque a revisão direta da fonte grega está pendente.
