  english_witness: 'Since I see, most excellent Diognetus, that thou art exceedingly anxious to understand the religion of the Christians, and that thy enquiries respecting them are distinctly and carefully made, as to what God they trust and how they worship Him, that they all disregard the world and despise death, and take no account of those who are regarded as gods by the Greeks, neither observe the superstition of the Jews, and as to the nature of the affection which they entertain one to another, and of this new development or interest, which has entered into men''s lives now and not before: I gladly welcome this zeal in thee, and I ask of God, Who supplieth both the speaking and the hearing to us, that it may be granted to myself to speak in such a way that thou mayest be made better by the hearing, and to thee that thou mayest so listen that I the speaker may not be disappointed.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/001.yaml
  text: 'Most excellent Diognetus, I see that you are exceedingly anxious to understand the religion of the Christians, and that your enquiries concerning them are distinctly and carefully made: as to what God they trust and how they worship him; that they all disregard the world and despise death; that they take no account of those regarded as gods by the Greeks, neither observing the superstition of the Jews; as to the nature of the affection they have for one another; and as to this new development or interest, which has entered into human lives now and not before. I gladly welcome your zeal, and I ask God, who supplies both speaking and hearing to us, that it may be granted to me to speak in such a way that you may be made better by hearing, and to you to listen in such a way that I, the speaker, may not be disappointed.'
translation:
  language: pt
  text: 'Excelentíssimo Diogneto, vejo que você deseja intensamente compreender a religião dos cristãos e que faz perguntas claras e cuidadosas a respeito deles: em que Deus confiam e como o adoram; por que todos eles não dão valor ao mundo e desprezam a morte; por que não levam em conta aqueles que os gregos consideram deuses, nem observam a superstição dos judeus; que espécie de amor têm uns pelos outros; e por que esse novo modo de vida, ou interesse, surgiu na vida humana agora, e não antes. Recebo com alegria esse seu zelo e peço a Deus, que nos concede tanto o falar como o ouvir, que me seja dado falar de tal maneira que você se torne melhor ao ouvir, e que a você seja dado ouvir de tal maneira que eu, que falo, não fique decepcionado.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público de J. B. Lightfoot. A revisão direta do texto grego antigo ainda está pendente; por isso, expressões incertas, especialmente “novo modo de vida, ou interesse”, foram mantidas sem resolução definitiva.
    reason: A fonte fornecida informa que a revisão na língua original está pendente e que o manuscrito se perdeu, sendo conhecido por cópias.
lexical_decisions:
- source_word: religion
  choice: religião
  rationale: Mantém o termo amplo da testemunha inglesa, sem reduzi-lo a 'fé', 'doutrina' ou 'culto'.
- source_word: disregard the world
  choice: não dão valor ao mundo
  rationale: Expressa despreendimento ou desconsideração, evitando sugerir necessariamente ódio à criação material.
- source_word: despise death
  choice: desprezam a morte
  rationale: Preserva a formulação forte e retórica da testemunha.
- source_word: affection
  choice: amor
  rationale: Em português corrente, 'amor' comunica com naturalidade o vínculo mútuo em vista; 'afeição' seria possível, mas mais fraco e menos idiomático aqui.
- source_word: new development or interest
  choice: novo modo de vida, ou interesse
  rationale: Conserva a incerteza da testemunha inglesa, cuja formulação alternativa não permite fixar com segurança um único sentido sem revisão direta do grego.
theological_decisions:
- issue: Caracterização das práticas judaicas
  choice: superstição dos judeus
  alternative: práticas religiosas dos judeus
  rationale: A tradução preserva a linguagem polêmica da testemunha fornecida, sem suavizá-la nem ampliá-la; não se apresenta essa caracterização como avaliação editorial.
- issue: Relação dos cristãos com o mundo
  choice: não dão valor ao mundo
  alternative: desprezam o mundo
  rationale: Evita impor uma leitura de rejeição ontológica da criação, mantendo o sentido possível de desapego aos valores ou estruturas do mundo.
- issue: Efeito transformador da escuta
  choice: que você se torne melhor ao ouvir
  alternative: que você seja edificado ao ouvir
  rationale: Mantém a amplitude ética do testemunho e evita acrescentar terminologia eclesiástica ausente dele.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'você' para evitar o arcaísmo de 'tu' conjugado e mantém o tratamento honorífico 'Excelentíssimo'. A longa estrutura foi organizada por dois-pontos e ponto e vírgula para preservar a enumeração sem comprometer a clareza.
