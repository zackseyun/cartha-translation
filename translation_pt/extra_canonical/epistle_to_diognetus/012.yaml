review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem o encadeamento argumentativo, as repetições de «conhecimento» e «vida», os sinais de restauração entre colchetes e a formulação deliberadamente estranha acerca de Eva. Contudo, «cultivar essa árvore» interpreta e suaviza em excesso a expressão incomum «bear the tree». Além disso, a conclusão deve conservar mais claramente a distinção sintática entre a Palavra, por meio de quem o Pai é glorificado, e o destinatário da doxologia, o Pai.
  naturalness: O português é predominantemente moderno, claro e apropriado ao registro elevado do escrito. Pequenas alterações preservam a estranheza onde ela pertence ao texto antigo sem tornar a leitura desnecessariamente opaca.
  terminology: «Conhecimento», «vida», «amor», «mandamento», «Páscoa», «comunidades» e «Palavra» são escolhas adequadas. «Conhecimento sólido» é mais idiomático e semanticamente preciso que «conhecimento seguro» para «sound knowledge».
  issues:
  - severity: medium
    issue: «Se você cultivar essa árvore» substitui a imagem textual incomum por uma ação interpretativa.
    rationale: O testemunho diz literalmente algo como «se você levar/produzir a árvore e colher o fruto», não «cultivar». A tradução não deve resolver a mecânica da metáfora. «Carregar a árvore» mantém a formulação estranha, com nota explicativa.
  - severity: medium
    issue: A referência final da doxologia ficou excessivamente indeterminada em «A ele seja a glória».
    rationale: A sequência do testemunho distingue «a Palavra», por meio de quem o Pai é glorificado, de «a quem» pertence a glória. Em português, «por meio da qual o Pai é glorificado; a ele seja a glória» retém essa construção e torna explícito, pelo antecedente imediato, que a glória é dirigida ao Pai, sem alterar a cristologia implícita.
  - severity: low
    issue: «Conhecimento seguro» é pouco natural para «sound knowledge».
    rationale: «Conhecimento sólido» comunica melhor a ideia de conhecimento válido, íntegro ou correto, sem a conotação de garantia subjetiva que «seguro» pode ter.
