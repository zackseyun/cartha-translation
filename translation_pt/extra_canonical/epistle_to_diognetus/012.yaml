source:
  text: 'Confronted with these truths and listening to them with attention, ye shall know how much God bestoweth on those that love (Him) rightly, who become a Paradise of delight, a tree bearing all manner of fruits and flourishing, growing up in themselves and adorned with various fruits.


    For in this garden a tree of knowledge and a tree of life hath been planted; yet the tree of knowledge does not kill, but disobedience kills;


    for the scriptures state clearly how God from the beginning planted a tree [of knowledge and a tree] of life in the midst of Paradise, revealing life through knowledge; and because our first parents used it not genuinely they were made naked by the deceit of the serpent.


    For neither is there life without knowledge, nor sound knowledge without true life; therefore the one (tree) is planted near the other.


    Discerning the force of this and blaming the knowledge which is exercised apart from the truth of the injunction which leads to life, the apostle says, Knowledge puffeth up, but charity edifieth.


    For the man who supposes that he knows anything without the true knowledge which is testified by the life, is ignorant, he is deceived by the serpent, because he loved not life--whereas he who with fear recognizes and desires life plants in hope expecting fruit.


    Let your heart be knowledge, and your life true reason, duly comprehended.


    Whereof if thou bear the tree and pluck the fruit, thou shalt ever gather the harvest which God looks for, which serpent toucheth not, nor deceit infecteth, neither is Eve corrupted, but is believed on as a virgin,


    and salvation is set forth, and the apostles are filled with understanding, and the Passover of the Lord goes forward, and the congregations are gathered together, and [all things] are arranged in order, and as He teacheth the saints the Word is gladdened, through Whom the Father is glorified, to Whom be glory for ever and ever. Amen.'
