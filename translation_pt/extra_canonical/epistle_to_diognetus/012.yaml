  naturalness: O registro é moderno, claro e adequado. Ajustaram-se a construção excepcional referente à árvore e a frase sobre Eva para melhorar a legibilidade sem harmonização doutrinária. “Conhecimento seguro” foi mantido, pois comunica de forma aceitável o contraste com conhecimento verdadeiro.
  terminology: “Conhecimento”, “vida”, “mandamento”, “amor”, “Páscoa”, “comunidades” e “Palavra” são escolhas consistentes e adequadas. A referência à Palavra permanece pessoalmente sugestiva sem impor uma identificação além do texto.
  issues:
  - severity: medium
    issue: “Cultivar essa árvore” é interpretativo.
    rationale: O testemunho diz literalmente algo como “levar/ter a árvore e colher o fruto”; “cultivar” acrescenta uma atividade específica. Uma redação menos determinante, acompanhada de nota, preserva melhor a estranheza da imagem.
  - severity: low
    issue: “Eva ... é crida como virgem” é pouco natural em português atual.
    rationale: A formulação tenta reproduzir o passivo incomum do testemunho, mas soa artificial. “Crê-se em Eva como virgem” conserva a afirmação extraordinária e não a substitui por uma interpretação.
