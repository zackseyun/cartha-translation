base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/012.yaml
  text: 'Confronted with these truths and listening to them attentively, you will know how much God bestows on those who love him rightly. They become a paradise of delight, a flourishing tree that grows within them, bears every kind of fruit, and is adorned with various fruits.


    For in this garden a tree of knowledge and a tree of life have been planted. Yet the tree of knowledge does not kill; disobedience kills.


    For the Scriptures state clearly that from the beginning God planted a tree [of knowledge and a tree] of life in the midst of Paradise, revealing life through knowledge. Because our first parents did not use it genuinely, they were made naked through the serpent’s deceit.


    For there is neither life without knowledge nor sound knowledge without true life. Therefore, one tree is planted near the other.


    Discerning the force of this, and blaming the knowledge practiced apart from the truth of the injunction that leads to life, the apostle says, “Knowledge puffs up, but love builds up.”


    For the person who supposes that he knows anything without the true knowledge testified by life is ignorant. He is deceived by the serpent because he did not love life. But the one who recognizes and desires life with fear plants in hope, expecting fruit.


    Let your heart be knowledge, and your life true reason, properly understood.


    If you bear the tree and pluck its fruit, you will always gather the harvest God looks for—a harvest which the serpent does not touch and deceit does not infect. Eve is not corrupted but is believed on as a virgin,


    and salvation is set forth, and the apostles are filled with understanding, and the Passover of the Lord goes forward, and the congregations are gathered together, and [all things] are arranged in order. As He teaches the saints, the Word is gladdened, through whom the Father is glorified. To him be glory forever and ever. Amen.'
translation:
  language: pt
  text: 'Ao se depararem com essas verdades e as ouvirem com atenção, vocês saberão quanto Deus concede aos que o amam retamente. Eles se tornam um paraíso de delícias, uma árvore que floresce e produz toda espécie de fruto, crescendo dentro deles e adornada com frutos variados.


    Pois nesse jardim foram plantadas uma árvore do conhecimento e uma árvore da vida. Contudo, a árvore do conhecimento não mata; o que mata é a desobediência.


    De fato, as Escrituras declaram claramente que, desde o princípio, Deus plantou no meio do Paraíso uma árvore [do conhecimento e uma árvore] da vida,[a] revelando a vida por meio do conhecimento. E, porque nossos primeiros pais não fizeram uso dela de modo verdadeiro, ficaram nus pelo engano da serpente.


    Pois não há vida sem conhecimento, nem conhecimento seguro sem vida verdadeira. Por isso, uma árvore foi plantada perto da outra.


    Discernindo a força disso e censurando o conhecimento praticado à parte da verdade do mandamento que conduz à vida, o apóstolo diz: “O conhecimento enche de orgulho, mas o amor edifica”.


    Pois quem supõe saber alguma coisa sem o verdadeiro conhecimento, do qual a vida dá testemunho, é ignorante. Essa pessoa é enganada pela serpente, porque não amou a vida. Mas quem, com temor, reconhece e deseja a vida planta com esperança, aguardando fruto.


    Que seu coração seja conhecimento, e sua vida, verdadeira razão devidamente compreendida.[b]


    Se você cultivar essa árvore[c] e colher seu fruto, sempre recolherá a colheita que Deus procura — uma colheita que a serpente não toca nem o engano contamina. Eva não é corrompida, mas é crida como virgem;[d]


    a salvação é apresentada, os apóstolos são cheios de entendimento, a Páscoa do Senhor avança, as comunidades são reunidas e [todas as coisas][e] são postas em ordem. Enquanto ele ensina os santos, a Palavra se alegra; por meio dela o Pai é glorificado. A ele seja a glória para todo o sempre. Amém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Os colchetes assinalam palavras restauradas no testemunho textual fornecido: “[do conhecimento e uma árvore]”.'
    reason: Preservar de modo visível o sinal de restauração ou dano manuscrito presente na fonte de trabalho.
  - marker: b
    text: A frase “verdadeira razão devidamente compreendida” é difícil no testemunho e pode também sugerir uma palavra ou doutrina verdadeira corretamente acolhida.
    reason: Registrar uma ambiguidade lexical e sintática que não pode ser resolvida com segurança sem revisão direta do grego.
  - marker: c
    text: 'Literalmente, a construção é incomum: “se você levar/produzir a árvore e colher o fruto”. “Cultivar” procura expressar a imagem sem determinar exatamente sua mecânica.'
    reason: Sinalizar que a fluência portuguesa exige uma escolha provisória diante de uma expressão obscura.
  - marker: d
    text: A declaração sobre Eva é incomum e seu sentido exato é incerto. Ela foi mantida sem substituí-la por Maria nem harmonizá-la com outra tradição.
    reason: Preservar a tensão textual e teológica do testemunho.
  - marker: e
    text: “Todas as coisas” aparece entre colchetes no testemunho, indicando uma restauração textual.
    reason: Manter o estado textual indicado pela fonte.
lexical_decisions:
- source_word: knowledge
  choice: conhecimento
  rationale: Preserva o termo-chave reiterado no testemunho e sua ligação com a árvore, a vida e 1Coríntios 8:1.
- source_word: charity
  choice: amor
  rationale: Em português atual, “amor” comunica naturalmente o sentido de agapē na citação apostólica, sem o sentido moderno restrito de beneficência associado a “caridade”.
- source_word: injunction
  choice: mandamento
  rationale: Expressa uma determinação normativa que conduz à vida e se ajusta ao contexto da desobediência no Éden.
- source_word: sound knowledge
  choice: conhecimento seguro
  rationale: Evita a possível conotação clínica de “conhecimento sadio” e comunica conhecimento sólido ou válido sem ampliar demais o texto.
- source_word: congregations
  choice: comunidades
  rationale: Mantém a referência a assembleias reunidas em linguagem internacional e legível, sem impor uma estrutura eclesiástica denominacional específica.
- source_word: Passover
  choice: Páscoa
  rationale: É a designação portuguesa tradicional e abrangente; conserva a possível ressonância simultânea da Páscoa bíblica e da celebração cristã.
- source_word: the Word
  choice: a Palavra
  rationale: Mantém a personificação e a provável referência cristológica, sem explicitação interpretativa adicional.
theological_decisions:
- issue: Relação entre conhecimento, vida e desobediência
  choice: Preservar a afirmação de que a árvore do conhecimento não mata, mas a desobediência mata
  alternative: Explicar que o conhecimento era bom somente sob determinadas condições
  rationale: O texto formula deliberadamente essa tensão e a desenvolve ligando conhecimento verdadeiro e vida; uma explicação adicional resolveria o argumento em vez de traduzi-lo.
- issue: Referência à nudez dos primeiros pais
  choice: “não fizeram uso dela de modo verdadeiro”
  alternative: “comeram dela indevidamente”
  rationale: O testemunho fala em uso não genuíno, sem explicitar o ato de comer nem fixar com certeza o antecedente singular; a tradução evita acrescentar detalhes.
- issue: Eva crida como virgem
  choice: Reter literalmente a formulação incomum, com nota de incerteza
  alternative: Harmonizar com Maria ou reformular como restauração da virgindade de Eva
  rationale: O testemunho transmitido é obscuro e teologicamente tenso; não há base suficiente para substituir Eva por Maria ou impor uma interpretação.
- issue: Gênero e referente de Logos
  choice: “a Palavra se alegra; por meio dela”
  alternative: “o Verbo se alegra; por meio dele”
  rationale: “Palavra” é corrente e inteligível; o pronome feminino segue o gênero gramatical português sem negar a provável referência pessoal e cristológica.
- issue: Doxologia final
  choice: “A ele seja a glória” com referente não explicitado além do texto
  alternative: “Ao Pai seja a glória” ou “à Palavra seja a glória”
  rationale: A sequência pronominal do testemunho permite dificuldade de referência. A tradução preserva a proximidade formal sem decidir além da evidência fornecida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por formas correntes no Brasil e inteligíveis internacionalmente. O plural inicial foi vertido por “vocês”; a seção passa ao singular quando o testemunho também o faz. A tradução é necessariamente provisória, pois foi elaborada a partir do testemunho inglês de domínio público fornecido, com revisão direta do grego ainda pendente. As obscuridades mais relevantes foram preservadas e anotadas, não harmonizadas.
