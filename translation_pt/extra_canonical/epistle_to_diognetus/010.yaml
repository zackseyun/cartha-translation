lexical_decisions:
- source_word: full knowledge
  choice: pleno conhecimento
  rationale: Preserva a ideia de conhecimento completo sem recorrer a vocabulário técnico ou esotérico.
- source_word: only begotten Son
  choice: Filho unigênito
  rationale: Mantém a formulação cristológica tradicional e a especificidade do testemunho fornecido.
- source_word: imitator
  choice: imitador
  rationale: Conserva a linguagem explícita de imitação de Deus, central à argumentação do trecho.
- source_word: becomes a God
  choice: se torna um deus
  rationale: Preserva a expressão ousada e figurativa do testemunho, com minúscula para distingui-la de Deus.
- source_word: righteousness’ sake
  choice: por causa da justiça
  rationale: Mantém aberta a referência à justiça ou retidão, sem restringi-la a uma interpretação confessional.
theological_decisions:
- issue: Imitação de Deus pelo ser humano
  choice: Preservar a afirmação direta de que o ser humano pode imitar Deus, se Deus quiser
  alternative: Atenuar para 'refletir certas qualidades de Deus'
  rationale: O argumento do texto depende da possibilidade real de imitar a bondade divina; uma paráfrase enfraqueceria essa tensão.
- issue: A pessoa generosa como 'um deus' para quem recebe
  choice: Manter 'se torna um deus'
  alternative: Traduzir como 'torna-se semelhante a Deus' ou 'instrumento de Deus'
  rationale: As alternativas resolveriam ou domesticariam uma formulação teologicamente forte que o testemunho apresenta de modo explícito.
- issue: Fogo eterno que castiga 'até o fim'
  choice: Conservar lado a lado 'fogo eterno' e 'castigará até o fim'
  alternative: Harmonizar como 'castigará eternamente'
  rationale: Preserva a redação e sua possível tensão sem impor uma conclusão sobre duração ou finalidade do castigo.
translation_notes:
  register: Português contemporâneo, digno e acessível, com uso de “você” e construções de ampla legibilidade brasileira. A tradução é provisória porque o material fornecido é um testemunho inglês de domínio público e a revisão direta da fonte grega permanece pendente. Mantiveram-se paralelismos retóricos, repetições e tensões teológicas, evitando arcaísmos e harmonizações interpretativas.
