base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/011.yaml
  text: 'My teachings are not strange, nor are my questions perverse. Rather, having been a disciple of Apostles, I come forward as a teacher of the Gentiles, worthily presenting to those who offer themselves as disciples of the truth the lessons that have been handed down.


    For who, having been rightly taught and having entered into friendship with the Word, does not seek to learn clearly the lessons openly revealed by the Word to the disciples? The Word appeared to them and declared these lessons, speaking plainly. He was not perceived by the unbelieving, but related them to disciples who, being counted faithful by Him, were taught the mysteries of the Father.


    For this reason He sent forth the Word, so that He might appear to the world. Though He was dishonored by the people and preached by the Apostles, He was believed in by the Gentiles.


    This Word, who was from the beginning, who appeared as new and yet was shown to be old, and who is always engendered young in the hearts of saints,


    He, I say, is eternal. Today He was accounted a Son. Through Him the Church is enriched, and grace is unfolded and multiplied among the saints: grace that gives understanding, reveals mysteries, announces seasons, rejoices over the faithful, and is bestowed on those who seek her—those by whom the pledges of faith are not broken and the boundaries of the fathers are not overstepped.


    Therefore the fear of the law is sung, the grace of the prophets is recognized, the faith of the gospels is established, the tradition of the apostles is preserved, and the joy of the Church exults.


    If you do not grieve this grace, you will understand the teachings that the Word delivers through the mouths of those whom He desires, when He wishes.


    For in everything that, by the will of the commanding Word, we were moved to utter with great effort, we become sharers with you through love for the things revealed to us.'
translation:
  language: pt
  text: 'Meus ensinamentos não são estranhos, nem minhas indagações são perversas. Pelo contrário, tendo sido discípulo dos apóstolos, apresento-me como mestre dos gentios e transmito dignamente as lições recebidas aos que se apresentam como discípulos da verdade.


    Pois quem, depois de ser corretamente instruído e de entrar em amizade com o Verbo, não procura conhecer com clareza as lições que o Verbo revelou abertamente aos discípulos? O Verbo apareceu a eles e lhes expôs essas lições, falando com clareza. Não foi percebido pelos descrentes, mas comunicou-as aos discípulos, os quais, considerados fiéis por ele, foram instruídos nos mistérios do Pai.


    Por essa razão, ele enviou o Verbo para que este aparecesse ao mundo. Embora desonrado pelo povo, foi proclamado pelos apóstolos e recebeu a fé dos gentios.


    Esse Verbo, que existia desde o princípio, apareceu como novo e, ainda assim, mostrou ser antigo; ele nasce sempre jovem no coração dos santos.


    Ele, repito, é eterno; hoje foi considerado Filho.[a] Por meio dele, a Igreja é enriquecida, e a graça se desdobra e se multiplica entre os santos: graça que concede entendimento, revela mistérios, anuncia os tempos, alegra-se com os fiéis e é concedida aos que a buscam — aqueles que não rompem os compromissos da fé nem ultrapassam os limites estabelecidos pelos pais.


    Por isso, canta-se o temor da lei, reconhece-se a graça dos profetas, firma-se a fé dos evangelhos, preserva-se a tradição dos apóstolos e exulta a alegria da Igreja.


    Se você não entristecer essa graça, compreenderá os ensinamentos que o Verbo transmite pela boca daqueles que ele deseja, quando deseja.


    Pois, em tudo o que fomos movidos a declarar com grande esforço, segundo a vontade do Verbo que ordena, tornamo-nos participantes com vocês, por amor às coisas que nos foram reveladas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «hoje foi reconhecido como Filho». A formulação preservada pelo testemunho é incomum e admite mais de uma compreensão; a revisão direta do grego antigo ainda está pendente.'
    reason: Assinala uma ambiguidade cristológica e temporal genuína sem resolvê-la silenciosamente.
lexical_decisions:
- source_word: Word
  choice: Verbo
  rationale: Mantém o título cristológico tradicional de Logos em português e sua distinção pessoal no contexto.
- source_word: Gentiles
  choice: gentios
  rationale: Preserva a categoria histórico-religiosa do testemunho, em vez de generalizá-la como simples referência às nações.
- source_word: engendered always young
  choice: nasce sempre jovem
  rationale: Reproduz a imagem paradoxal de renovação contínua no coração dos santos com linguagem portuguesa natural.
- source_word: pledges of faith
  choice: compromissos da fé
  rationale: Expressa a ideia de garantias ou compromissos assumidos sem especificar indevidamente votos, sacramentos ou fórmulas confessionais.
- source_word: boundaries of the fathers
  choice: limites estabelecidos pelos pais
  rationale: Conserva a referência recebida aos antecessores na fé sem introduzir uma identificação denominacional mais precisa do que o testemunho permite.
theological_decisions:
- issue: Identidade e agência do Verbo
  choice: Empregar «Verbo» como título pessoal, com referências pronominais masculinas.
  alternative: Traduzir como «Palavra» ou tratar a expressão de forma impessoal.
  rationale: O trecho atribui ao Verbo preexistência, aparição, fala e ação; a formulação pessoal preserva essa cristologia sem ampliar suas definições.
- issue: Frase «today was accounted a Son»
  choice: «hoje foi considerado Filho», acompanhada de nota.
  alternative: «hoje foi reconhecido como Filho» ou «hoje é contado como Filho».
  rationale: A formulação mais formal conserva a tensão temporal e o verbo de atribuição do testemunho inglês, sem convertê-lo silenciosamente em linguagem de geração, adoção ou revelação.
- issue: Antecedente em «He sent forth the Word»
  choice: «ele enviou o Verbo para que este aparecesse ao mundo».
  alternative: Nomear explicitamente «o Pai» como sujeito.
  rationale: Evita inserir um antecedente não expresso no testemunho fornecido, ao mesmo tempo que distingue gramaticalmente quem envia daquele que aparece.
- issue: «faith of the gospels»
  choice: «fé dos evangelhos».
  alternative: «fé no evangelho» ou «fidelidade dos Evangelhos».
  rationale: Mantém o genitivo e o plural do testemunho, sem decidir se a expressão significa conteúdo proclamado, fé atestada ou confiança depositada.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o paralelismo retórico, as repetições de «Verbo» e «graça» e as tensões do testemunho. Este rascunho é necessariamente provisório: baseia-se no testemunho inglês de domínio público fornecido, pois a revisão direta do grego está pendente; o Codex Argentoratensis está perdido e é conhecido por meio de cópias.'
