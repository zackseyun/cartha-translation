base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/005.yaml
  text: 'Christians are not distinguished from the rest of humanity by where they live, by their language, or by their customs.


    They do not live in cities of their own, use a different language, or practice an unusual way of life.


    Nor do they possess an invention discovered through the intelligence or study of ingenious people, nor are they masters of any human doctrine, as some are.


    Instead, they live in Greek and barbarian cities, wherever each one’s lot has placed them, and follow the local customs in clothing, food, and the other arrangements of life. Yet the way of citizenship they display is marvelous and admittedly contrary to expectation.


    They live in their own countries, but only as temporary residents. They share in everything as citizens, yet endure every hardship as strangers. Every foreign country is a fatherland to them, and every fatherland is foreign.


    They marry like everyone else and have children, but they do not cast away their offspring.


    They share their meals, but not their wives.


    They are in the flesh, yet they do not live according to the flesh.


    They exist on earth, but their citizenship is in heaven.


    They obey the established laws, yet in their own lives they surpass the laws.


    They love everyone, and they are persecuted by everyone.


    They are unknown, yet they are condemned. They are put to death, yet they are endowed with life.


    They are poor, yet they make many rich. They lack everything, yet they abound in everything.


    They are dishonored, yet they are glorified in their dishonor. They are spoken of as evil, yet they are vindicated.


    They are reviled, and they bless; they are insulted, and they show respect.


    When they do good, they are punished as evildoers. When they are punished, they rejoice as though thereby brought to life.


    The Jews wage war against them as aliens, and the Greeks persecute them; yet those who hate them cannot explain the reason for their hostility.'
translation:
  language: pt
  text: 'Os cristãos não se distinguem do restante da humanidade nem pelo lugar onde vivem, nem pela língua, nem pelos costumes.


    Não moram em cidades próprias, não usam uma língua diferente, nem praticam um modo de vida fora do comum.


    Também não adotam alguma ideia descoberta pela inteligência ou pelo estudo de pessoas engenhosas, nem defendem algum ensinamento humano, como fazem alguns.


    Pelo contrário, vivem em cidades gregas e bárbaras,[a] conforme coube a cada um, e seguem os costumes locais quanto à roupa, à alimentação e aos demais aspectos da vida. Ainda assim, sua maneira de viver como cidadãos é admirável e, reconhecidamente, contrária ao que se esperaria.


    Vivem em sua própria pátria, mas como residentes temporários. Participam de tudo como cidadãos, mas suportam toda dificuldade como estrangeiros. Toda terra estrangeira é pátria para eles, e toda pátria lhes é estrangeira.


    Casam-se como todos os outros e têm filhos, mas não abandonam os recém-nascidos.[b]


    Compartilham a mesma mesa, mas não o mesmo leito.[c]


    Estão na carne, mas não vivem segundo a carne.[d]


    Vivem na terra, mas sua cidadania está no céu.


    Obedecem às leis estabelecidas, mas, por sua própria maneira de viver, vão além do que as leis exigem.


    Amam a todos e são perseguidos por todos.


    Não são conhecidos, mas são condenados. São mortos, mas recebem vida.


    São pobres, mas enriquecem a muitos. Carecem de tudo, mas têm tudo em abundância.


    São desonrados, mas, em sua desonra, são glorificados. Falam mal deles, mas sua justiça é reconhecida.


    São insultados e abençoam; são ultrajados e tratam os outros com respeito.


    Quando fazem o bem, são punidos como malfeitores; quando punidos, alegram-se como se, por meio disso, recebessem vida.


    Os judeus lhes fazem guerra como a estrangeiros, e os gregos os perseguem; contudo, os que os odeiam não conseguem explicar a razão de sua hostilidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “bárbaras” significa cidades de povos que não falavam grego; o termo reflete a classificação cultural do mundo greco-romano.
    reason: Evita que o leitor atribua ao termo apenas o sentido moderno de brutalidade ou incivilidade.
  - marker: b
    text: A expressão se refere à prática antiga de expor ou abandonar bebês indesejados, muitas vezes para morrer.
    reason: Explica uma prática histórica pressuposta pelo texto.
  - marker: c
    text: O original contrapõe uma mesa comum a um leito comum. A frase provavelmente alude à fidelidade e à exclusividade sexual no casamento, mas mantém a formulação concisa do texto.
    reason: Preserva o paralelismo e evita substituir «leito» por uma interpretação mais explícita, como «esposas».
  - marker: d
    text: “Carne” pode indicar a existência corporal humana e, na expressão “segundo a carne”, um modo de vida governado por impulsos meramente humanos. O contraste é mantido sem restringi-lo a um único sentido.
    reason: Preserva a amplitude teológica e retórica da expressão.
lexical_decisions:
- source_word: barbarians
  choice: bárbaras
  rationale: Mantém a categoria cultural greco-romana do testemunho, com nota para evitar o sentido moderno de pessoas necessariamente cruéis ou incivilizadas.
- source_word: constitution of their own citizenship
  choice: modo de cidadania
  rationale: Expressa a conduta pública e a condição cívica distintiva sem reduzir a frase a uma constituição política formal.
- source_word: sojourners
  choice: residentes temporários
  rationale: Comunica em português corrente a condição de quem reside num lugar sem nele ter sua pátria definitiva.
- source_word: cast away their offspring
  choice: abandonam os recém-nascidos
  rationale: Torna explícita a alusão antiga à exposição de bebês, sem inserir no corpo do texto pormenores além do necessário.
- source_word: in the flesh / according to the flesh
  choice: na carne / segundo a carne
  rationale: Preserva o contraste teológico e retórico tradicional, cuja amplitude não deve ser reduzida a mera corporeidade ou imoralidade sexual.
- source_word: vindicated
  choice: sua justiça é reconhecida
  rationale: Reproduz a ideia de serem demonstrados ou reconhecidos como justos diante das acusações, em linguagem natural.
theological_decisions:
- issue: Cidadania celeste
  choice: sua cidadania está no céu
  alternative: sua pátria está no céu
  rationale: Mantém a metáfora cívica e sua tensão com a participação dos cristãos nas sociedades terrenas.
- issue: Viver segundo a carne
  choice: não vivem segundo a carne
  alternative: não vivem conforme os desejos humanos
  rationale: Preserva a formulação teologicamente densa e sua ambiguidade genuína, sem impor uma interpretação específica.
- issue: Receber vida em meio à morte e à punição
  choice: recebem vida / como se [...] recebessem vida
  alternative: são vivificados
  rationale: Mantém o paradoxo do texto sem definir se a referência é à ressurreição, à vida espiritual ou a ambas.
- issue: Afirmações universais retóricas
  choice: Amam a todos e são perseguidos por todos
  alternative: Amam todas as pessoas e são perseguidos por toda parte
  rationale: Conserva o paralelismo e a hipérbole do testemunho, sem atenuá-los nem transformá-los em descrição estatística.
- issue: Hostilidade de judeus e gregos
  choice: Os judeus lhes fazem guerra [...] e os gregos os perseguem
  alternative: Alguns judeus [...] e alguns gregos
  rationale: Preserva a generalização retórica do testemunho antigo, sem acrescentar qualificadores ausentes; a formulação é apresentada como voz histórica do autor, não como autorização de hostilidade contra qualquer povo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por sintaxe direta e paralelismos que preservam o ritmo do capítulo. Tradução provisória fundamentada no testemunho inglês de domínio público e conferida com cautela à luz da terminologia grega conhecida do capítulo; o Codex Argentoratensis está perdido e é conhecido por cópias, de modo que uma revisão crítica direta do texto grego continua necessária.
