  verdict: revise
  source_fidelity: 'A revisão do grego tradicionalmente impresso para Diogn. 5 confirma o paralelismo geral e os contrastes do texto. Há, porém, uma correção necessária em «mesa/leito»: o original contrapõe uma mesa comum a um leito comum, não nomeia diretamente «esposas». A redação revista preserva a concisão e a possível alusão à partilha sexual sem transformar a inferência em texto explícito. Também ajusta «invenção» e «modo de cidadania» para formulações mais fiéis e idiomáticas.'
  naturalness: O texto é claro, moderno e conserva bem o ritmo antitético do capítulo. «Maneira de viver como cidadãos» é mais natural que «modo de cidadania», e «a mesma mesa ... o mesmo leito» é uma oposição portuguesa fluente e deliberadamente concisa.
  terminology: «Bárbaras», «carne», «cidadania» e «malfeitores» são escolhas adequadas, com notas úteis onde o leitor moderno poderia entender mal o vocabulário antigo. A nota sobre mesa/leito foi refeita para não afirmar uma incerteza lexical indevida nem introduzir «esposas» no texto.
  issues:
  - severity: medium
    issue: «Compartilham a mesa, mas não as esposas» traduz «leito» por «esposas».
    rationale: O contraste grego é entre mesa comum e leito comum. Embora a referência a relações conjugais/sexuais seja provável, «esposas» torna explícito um elemento que o original deixa implícito e altera o paralelismo retórico.
  - severity: low
    issue: «Não seguem alguma invenção» e «modo de cidadania» soam pouco naturais e imprecisos.
    rationale: A primeira construção pode sugerir apenas uma prática que eles não seguem, e a segunda é pouco idiomática. «Não adotam ... ideia» e «maneira de viver como cidadãos» comunicam melhor o sentido sem reduzir a metáfora cívica.
