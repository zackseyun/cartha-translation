base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/006.yaml
  text: 'In a word, what the soul is in a body, Christians are in the world.


    The soul is spread throughout all the members of the body, and Christians throughout the various cities of the world.


    The soul lives in the body, yet it is not of the body. In the same way, Christians live in the world, yet they are not of the world.


    The soul, which is invisible, is guarded within the visible body. In the same way, Christians are recognized as being in the world, yet their religion remains invisible.


    The flesh hates the soul and wages war against it, though it has suffered no wrong, because it is forbidden to indulge in pleasures. In the same way, the world hates Christians, though it has suffered no wrong from them, because they oppose its pleasures.


    The soul loves the flesh that hates it, and loves the body''s members. In the same way, Christians love those who hate them.


    The soul is enclosed in the body, yet it holds the body together. In the same way, Christians are kept in the world as in a prison, yet they themselves hold the world together.


    The soul, though itself immortal, lives in a mortal tent. In the same way, Christians live as strangers among perishable things while they await the imperishability that is in the heavens.


    The soul improves when treated harshly with respect to food and drink. In the same way, when Christians are punished, they increase more and more each day.


    So great is the role to which God has appointed them, and they are not permitted to refuse it.'
translation:
  language: pt
  text: 'Em suma, o que a alma é no corpo, os cristãos são no mundo.


    A alma está espalhada por todos os membros do corpo, e os cristãos, pelas diversas cidades do mundo.


    A alma habita no corpo, mas não é do corpo. Do mesmo modo, os cristãos habitam no mundo, mas não são do mundo.


    A alma, que é invisível, é guardada no corpo visível. Do mesmo modo, os cristãos são reconhecidos como estando no mundo, mas sua religião permanece invisível.[a]


    A carne odeia a alma e luta contra ela, embora não tenha sofrido injustiça alguma, porque é impedida de entregar-se aos prazeres. Do mesmo modo, o mundo odeia os cristãos, embora não tenha sofrido injustiça alguma da parte deles, porque eles se opõem aos seus prazeres.


    A alma ama a carne que a odeia e também os membros do corpo. Do mesmo modo, os cristãos amam os que os odeiam.


    A alma está encerrada no corpo, mas é ela que mantém o corpo unido. Do mesmo modo, os cristãos são mantidos no mundo como numa prisão, mas são eles que mantêm o mundo unido.[b]


    A alma, embora imortal, habita numa tenda mortal. Do mesmo modo, os cristãos vivem como estrangeiros entre coisas perecíveis, enquanto aguardam a incorruptibilidade que está nos céus.[c]


    A alma se torna melhor quando é tratada com rigor quanto à comida e à bebida. Do mesmo modo, quando são castigados, os cristãos crescem cada dia mais.[d]


    Tão grande é o lugar que Deus lhes atribuiu, e não lhes é permitido abandoná-lo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Religião» traduz θεοσέβεια, termo que também pode ser vertido por «piedade», «reverência a Deus» ou «devoção a Deus». Refere-se à prática reverente dos cristãos, não necessariamente a uma instituição visível.
    reason: Preservar no texto principal a amplitude do termo grego e esclarecer seu alcance sem impor uma leitura institucional.
  - marker: b
    text: «Mantêm o mundo unido» reproduz deliberadamente a mesma expressão usada para a alma em relação ao corpo; o autor não explica aqui como os cristãos exercem essa função.
    reason: Preservar a força e a ambiguidade da analogia sem acrescentar uma interpretação doutrinária.
  - marker: c
    text: «Tenda» traduz uma palavra que pode designar uma habitação temporária; a imagem ressalta a transitoriedade do corpo mortal.
    reason: Registrar a metáfora de σκήνωμα visível no texto principal.
  - marker: d
    text: «Crescem» também pode ser entendido como «aumentam» ou «se multiplicam»; o termo grego pode abranger crescimento numérico ou aumento mais geral.
    reason: Sinalizar a amplitude semântica de πλεονάζουσι sem decidir de forma absoluta entre crescimento numérico e fortalecimento geral.
lexical_decisions:
- source_word: θεοσέβεια (theosébeia)
  choice: devoção a Deus
  rationale: Expressa de modo transparente a reverência ou piedade dirigida a Deus, evitando que «religião» seja entendido principalmente como instituição visível.
- source_word: ἐκ (ek)
  choice: procede de
  rationale: Preserva o contraste entre habitar em um âmbito e ter nele a própria origem ou pertença essencial; «não é do» também seria possível, mas é menos explícito em português.
- source_word: συνέχει (synéchei)
  choice: mantém ... unido
  rationale: Conserva a imagem da alma como princípio de coesão do corpo e sua aplicação paradoxal aos cristãos no mundo.
- source_word: παροικοῦσιν (paroikoûsin)
  choice: vivem como estrangeiros
  rationale: Comunica residência temporária sem plena cidadania ou pertença, em vez de simples permanência física.
- source_word: ἀφθαρσία (aphtharsía)
  choice: incorruptibilidade
  rationale: Mantém o termo conceitual e o contraste formal com «coisas perecíveis».
- source_word: πλεονάζουσι (pleonázousin)
  choice: se multiplicam
  rationale: No contexto de perseguição e crescimento diário, indica aumento numérico; a formulação grega também pode ter sentido mais geral de crescer ou abundar.
- source_word: τάξις (táxis)
  choice: posição
  rationale: Preserva a ideia de lugar, ordem ou posto determinado por Deus sem impor uma noção eclesiástica específica de ofício.
theological_decisions:
- issue: Relação dos cristãos com o mundo
  choice: «habitam no mundo, mas não procedem do mundo»
  alternative: «vivem no mundo, mas não são do mundo»
  rationale: A escolha retém a oposição espacial e de origem do grego sem transformar a afirmação em rejeição absoluta da criação ou da sociedade.
- issue: Função cósmica dos cristãos
  choice: «mantêm o mundo unido»
  alternative: «sustentam o mundo»
  rationale: A tradução preserva a analogia direta com a alma e não explica de que maneira isso ocorre, mantendo a tensão retórica e teológica do texto.
- issue: Esperança celestial
  choice: «aguardam a incorruptibilidade que está nos céus»
  alternative: «esperam a imortalidade no céu»
  rationale: Mantém tanto o substantivo abstrato quanto o plural «céus», sem identificar indevidamente a esperança apenas com a sobrevivência da alma.
- issue: Designação divina
  choice: «posição em que Deus os colocou»
  alternative: «missão para a qual Deus os designou»
  rationale: Evita converter τάξις em uma comissão missionária explícita; o texto fala mais amplamente de uma condição, lugar ou posto estabelecido por Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição estrutural da comparação entre alma/corpo e cristãos/mundo foi mantida por ser o eixo retórico do capítulo. Evitaram-se arcaísmos como «tabernáculo» e «não lhes é permitido declinar», sem apagar conceitos antigos como «incorruptibilidade». O texto foi confrontado com a formulação grega tradicionalmente atestada para Diogn. 6, mas, dada a informação editorial de que a revisão direta da fonte antiga ainda está pendente e de que o códice-base se perdeu, as notas registram as principais incertezas lexicais.
