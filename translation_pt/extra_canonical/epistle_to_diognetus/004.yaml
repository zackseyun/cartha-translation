base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/004.yaml
  text: 'But again their scruples concerning food, and their superstition relating to the Sabbath, and the vanity of their circumcision, and the pretense of their fasting and new moons, I do [not] suppose you need to learn from me, are ridiculous and unworthy of any consideration.


    For to receive some of the things created by God for human use as created well, but to decline others as useless and superfluous, is not this impious?


    And again, to lie against God, as if he forbade us to do any good thing on the Sabbath day, is not this profane?


    Again, to boast of the mutilation of the flesh as a token of election, as though for this reason they were particularly beloved by God, is not this ridiculous?


    And to watch the stars and the moon and to keep the observance of months and days, and to distinguish the arrangements of God and the changes of the seasons according to their own impulses, making some into festivals and others into times of mourning, who would regard this as an exhibition of godliness and not much more of folly?


    That the Christians are right, therefore, in holding aloof from the common silliness and error of the Jews, and from their excessive fussiness and pride, I consider that you have been sufficiently instructed; but as regards the mystery of their own religion, do not expect that you can be instructed by man.'
translation:
  language: pt
  text: 'Mas também são ridículos e indignos de qualquer consideração os escrúpulos deles quanto aos alimentos, sua superstição a respeito do sábado, a inutilidade de sua circuncisão e a dissimulação de seus jejuns e luas novas — coisas que, suponho, você [não][a] precisa aprender de mim.


    Pois, entre as coisas criadas por Deus para uso humano, acolher algumas como bem-criadas, mas rejeitar outras como inúteis e supérfluas — isso não é irreverente?


    E ainda, mentir a respeito de Deus, como se ele nos proibisse de fazer qualquer coisa boa no dia de sábado — isso não é profano?


    Também, vangloriar-se da mutilação da carne como sinal de eleição, como se por essa razão fossem especialmente amados por Deus — isso não é ridículo?


    E observar os astros e a lua, guardar meses e dias e classificar as disposições de Deus e as mudanças das estações segundo seus próprios impulsos, transformando uns em festas e outros em tempos de luto — quem consideraria isso uma demonstração de devoção, e não muito mais de insensatez?


    Portanto, considero que você já foi suficientemente instruído de que os cristãos têm razão em se manter afastados da insensatez e do erro comuns dos judeus, bem como de seu excesso de minúcias e de seu orgulho. Quanto, porém, ao mistério da religião própria dos cristãos, não espere poder ser instruído por um ser humano.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo “não” é uma restauração textual assinalada no testemunho inglês fornecido; a revisão direta do grego ainda está pendente.
    reason: Preservar transparência quanto à incerteza textual indicada na base de redação.
lexical_decisions:
- source_word: meats
  choice: alimentos
  rationale: No contexto, refere-se a distinções alimentares; “alimentos” é atual e mais claro do que “carnes”.
- source_word: vanity
  choice: inutilidade
  rationale: Preserva a avaliação do autor de que a prática, entendida dessa maneira, é vazia ou sem proveito, sem usar o possível sentido moderno de presunção de “vaidade”.
- source_word: dissimulation
  choice: dissimulação
  rationale: Mantém a acusação de aparência ou fingimento presente no testemunho inglês, embora a revisão direta do grego ainda esteja pendente.
- source_word: token of election
  choice: sinal de eleição
  rationale: Conserva a linguagem teológica de escolha divina sem especificar uma doutrina posterior.
- source_word: godliness
  choice: devoção
  rationale: Expressa prática reverente ou piedosa em português natural, sem sugerir que o autor atribua verdadeira piedade às observâncias criticadas.
- source_word: religion
  choice: religião
  rationale: Mantém o sentido amplo de modo próprio de culto ou vida religiosa, sem reduzi-lo a “fé” ou “doutrina”.
theological_decisions:
- issue: Crítica às práticas judaicas
  choice: Preservar a crítica histórica do autor e sua força retórica, sem ampliá-la nem suavizá-la artificialmente.
  alternative: Generalizar as referências ou substituir “judeus” por uma descrição menos direta.
  rationale: A referência explícita pertence ao texto antigo; a tradução deve representá-la fielmente, embora não endosse sua aplicação indiscriminada a judeus de outras épocas.
- issue: Sábado e boas obras
  choice: Traduzir a alegação do autor como “como se ele nos proibisse de fazer qualquer coisa boa”.
  alternative: Harmonizar a frase com interpretações específicas da lei sabática.
  rationale: O texto apresenta uma acusação polêmica e não deve ser silenciosamente reconciliado com uma tradição denominacional.
- issue: Eleição e circuncisão
  choice: Manter “eleição” como afirmação reivindicada pelos criticados.
  alternative: Traduzir como “identidade do povo escolhido”.
  rationale: “Eleição” preserva a formulação teológica e sua tensão, sem acrescentar uma explicação interpretativa.
- issue: Origem do ensino sobre o mistério cristão
  choice: Manter “não espere poder ser instruído por um ser humano”.
  alternative: Explicitar que somente Deus pode ensinar.
  rationale: A alternativa tornaria explícita uma conclusão apenas sugerida neste trecho.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com tratamento por “você”. Mantiveram-se as perguntas retóricas e o tom fortemente polêmico do documento antigo. O rascunho é necessariamente provisório, pois foi elaborado a partir do testemunho inglês de domínio público e da camada inglesa auditada; a revisão direta da fonte grega está pendente.
