base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/008.yaml
  text: 'For what human being at all had any knowledge of what God was before he came?


    Or do you accept the empty and senseless statements of those pretentious philosophers: some of whom said that God was fire (they call that God, to which they themselves shall go), and others water, and others some other of the elements created by God?


    And yet, if any of these statements is worthy of acceptance, any other created thing might just as well be made out to be God.


    No, all this is the trickery and deceit of magicians;


    and no one has either seen or recognized him, but he revealed himself.


    And he revealed (himself) by faith, whereby alone it is given to see God.


    For God, the Master and Creator of the universe, who made all things and arranged them in order, was found to be not only friendly toward humanity, but also long-suffering.


    And such indeed he always was, and is, and will be, kind and good and dispassionate and true, and he alone is good.


    And having conceived a great and unutterable plan, he communicated it to his Son alone.


    For so long as he kept and guarded his wise design as a mystery, he seemed to neglect us and to be careless about us.


    But when he revealed it through his beloved Son, and manifested the purpose that he had prepared from the beginning, he gave us all these gifts at once: participation in his benefits, and sight and understanding of (mysteries) which none of us ever would have expected.'
translation:
  language: pt
  text: 'Pois que ser humano chegou a saber o que Deus é antes que ele viesse?[a]


    Ou você aceita as afirmações vazias e absurdas daqueles filósofos pretensiosos? Alguns disseram que Deus era fogo — chamam de Deus aquilo para onde eles mesmos irão —; outros, que era água; e outros, algum outro dos elementos criados por Deus.


    Ora, se alguma dessas afirmações merece ser aceita, qualquer outra coisa criada poderia igualmente ser apresentada como Deus.


    Não! Tudo isso é charlatanismo e engano de feiticeiros.


    Ninguém jamais o viu nem o reconheceu; foi ele quem se revelou.


    E revelou-se por meio da fé, pois somente por ela é concedido ver Deus.


    De fato, Deus, o Senhor e Criador do universo, que fez todas as coisas e as pôs em ordem, mostrou ser não apenas amigo da humanidade, mas também paciente.


    E assim ele sempre foi, é e será: bondoso, bom, sem ira e verdadeiro. Somente ele é bom.[b]


    Depois de conceber um plano grandioso e inexprimível, comunicou-o somente ao seu Filho.


    Enquanto manteve seu sábio propósito oculto e o guardou como mistério, parecia negligenciar-nos e não se importar conosco.


    Mas, quando o revelou por meio de seu Filho amado e manifestou o propósito que havia preparado desde o princípio, concedeu-nos de uma só vez todas estas dádivas: participar de seus benefícios e ver e compreender coisas que nenhum de nós jamais teria esperado.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente de “ele” não é explicitado na formulação preservada aqui; pode apontar para Deus no contexto da revelação, sem definir de que modo sua vinda deve ser entendida.
    reason: Preservar uma ambiguidade genuína da evidência textual fornecida e evitar identificar silenciosamente o referente.
  - marker: b
    text: “Sem ira” também pode ser vertido por “não irado”. A expressão não precisa significar, por si só, a doutrina filosófica mais ampla de que Deus seja “impassível”.
    reason: Esclarecer uma decisão lexical com possível peso teológico.
  - marker: c
    text: A antiga tradução inglesa supria “mistérios” neste ponto. Como o substantivo aparece entre parênteses nessa testemunha, a tradução usa o termo mais neutro “coisas”.
    reason: Sinalizar um suplemento editorial da testemunha usada como base provisória.
lexical_decisions:
- source_word: Master and Creator of the Universe
  choice: o Senhor e Criador do universo
  rationale: “Senhor” expressa autoridade soberana em português corrente e digno; “Criador do universo” mantém o âmbito abrangente da expressão.
- source_word: friendly to men
  choice: amigo da humanidade
  rationale: Preserva o sentido de benevolência voltada aos seres humanos sem restringi-lo aos homens do sexo masculino.
- source_word: long-suffering
  choice: paciente
  rationale: Comunica de modo natural a disposição duradoura de suportar e não agir precipitadamente.
- source_word: dispassionate
  choice: sem ira
  rationale: Evita importar a noção filosófico-teológica mais ampla de impassibilidade; no contexto, a expressão indica ausência de ira.
- source_word: scheme / design / purpose
  choice: plano / propósito / propósito
  rationale: Mantém a progressão do argumento em português natural e apresenta a mesma intenção divina concebida, guardada e depois manifestada.
- source_word: quackery
  choice: charlatanismo
  rationale: Reproduz a denúncia de fraude pretensamente sábia ou religiosa com força clara em português moderno.
theological_decisions:
- issue: Referente de “ele” em “antes que ele viesse”
  choice: Manter o pronome sem explicitar o referente no corpo do texto
  alternative: “antes que Deus viesse” ou “antes que o Filho viesse”
  rationale: A formulação recebida permite tensão quanto ao referente; explicitá-lo resolveria uma ambiguidade que a evidência fornecida não autoriza eliminar.
- issue: Revelação e fé
  choice: “revelou-se por meio da fé, pois somente por ela é concedido ver Deus”
  alternative: “é percebido pela fé”
  rationale: Conserva a afirmação forte de que a fé é o meio exclusivo concedido para ver Deus, sem reduzir “ver” a mera compreensão intelectual.
- issue: Ausência de ira divina
  choice: “sem ira”
  alternative: “impassível” ou “não sujeito a paixões”
  rationale: A opção mais estreita preserva a bondade e constância atribuídas a Deus sem inserir uma doutrina filosófica completa da impassibilidade.
- issue: Conteúdo final implicitamente suprido
  choice: “coisas”
  alternative: “mistérios”
  rationale: A testemunha inglesa sinaliza “mysteries” como suplemento editorial. “Coisas” produz uma frase portuguesa completa sem apresentar como explícito um substantivo cuja presença no texto antigo ainda requer revisão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O tratamento direto usa “você”, coerente com prosa corrente, enquanto a descrição de Deus mantém registro elevado sem arcaísmos. Draft provisório baseado na testemunha inglesa de domínio público fornecida; a revisão direta do grego continua necessária, sobretudo para confirmar referentes pronominais, nuances lexicais e o suplemento no período final.
