  revision_rationale: 'A revisão corrige duas perdas de fidelidade: restaura a amplitude de «dispassionate» por «impassível» e conserva o suplemento editorial final como «(mistérios)». Também melhora a naturalidade da pergunta inicial, usa «magos» para o grupo referido e preserva o restante das escolhas adequadas do rascunho.'
