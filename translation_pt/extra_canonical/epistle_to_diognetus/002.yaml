lexical_decisions:
- source_word: prepossessions
  choice: preconceitos
  rationale: Expressa ideias prévias que ocupam e condicionam a mente, em português corrente e digno.
- source_word: new story / account
  choice: relato novo
  rationale: Evita o tom ficcional que “história nova” poderia sugerir e preserva a ideia de uma exposição ainda não ouvida.
- source_word: substance
  choice: matéria
  rationale: No contexto da crítica à composição física dos ídolos, “matéria” é mais natural e preciso que “substância”.
- source_word: earthenware
  choice: barro
  rationale: Identifica claramente o material e produz paralelismo natural com pedra, bronze, madeira, prata e ferro.
- source_word: without souls, senseless, motionless
  choice: sem alma, sem percepção e imóveis
  rationale: Mantém a sequência cumulativa sem fazer “insensíveis” significar apenas falta de compaixão.
- source_word: victims
  choice: vítimas sacrificadas
  rationale: Explicita o sentido cultual do termo sem acrescentar uma interpretação denominacional.
- source_word: enslaved
  choice: servirem como escravos
  rationale: Preserva a força da metáfora de escravidão, recorrente no parágrafo, em vez de reduzi-la a mero serviço.
theological_decisions:
- issue: Estatuto dos objetos cultuais chamados deuses
  choice: Manter “deuses” sem qualificação editorial, enquanto a argumentação os apresenta como objetos materiais inertes.
  alternative: Inserir “falsos deuses” ou pôr “deuses” entre aspas.
  rationale: O autor constrói retoricamente a negação da divindade deles; qualificá-los de antemão resolveria a tensão e acrescentaria linguagem ausente do testemunho.
- issue: Frase final sobre a sensibilidade da pedra
  choice: Traduzir literalmente a conclusão paradoxal e acrescentar nota de incerteza textual ou de transmissão.
  alternative: Corrigir no texto para “vocês demonstram que ela é insensível”.
  rationale: O testemunho fornecido contém uma aparente contradição. Como a revisão direta do grego está pendente, não é seguro emendar silenciosamente.
- issue: Apaziguamento por sangue e gordura
  choice: Preservar a linguagem sacrificial e a lógica condicional do argumento.
  alternative: Generalizar como “oferendas religiosas”.
  rationale: Os elementos concretos são essenciais à crítica do autor e não devem ser suavizados nem reinterpretados teologicamente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento de Diogneto no singular (“você”) e referência coletiva aos adoradores no plural (“vocês”), seguindo a alternância do testemunho. As perguntas retóricas e as repetições foram preservadas como elementos centrais da argumentação. Esta é uma tradução provisória baseada no testemunho inglês de domínio público, pois a revisão direta da fonte grega está pendente.
