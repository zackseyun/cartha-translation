base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/003.yaml
  text: 'Next, I think you are especially eager to hear why they do not practice their religion in the same way as the Jews.


    The Jews, then, do well when they avoid the kind of worship described above and claim to reverence the one God of the universe and regard him as Master. But when they offer him worship by methods like those already mentioned, they are completely mistaken.


    For the Greeks display their foolishness by offering these things to senseless and deaf images. But the Jews, thinking that they are presenting them to God as though he needed them, should rightly consider this folly rather than religious worship.


    For he who made heaven and earth and everything in them, and who provides us all with what we need, cannot himself need any of the things that he supplies to those who imagine they are giving them to him.


    But those who think they can offer sacrifices to him with blood, fat, and whole burnt offerings, and honor him with such honors, seem to me no different from those who show the same respect toward deaf images. For the first group thinks it proper to make offerings to things unable to receive the honor, while the other makes offerings to one who needs nothing.'
translation:
  language: pt
  text: 'Em seguida, penso que você está especialmente desejoso de saber por que eles não praticam sua religião do mesmo modo que os judeus.


    Os judeus, portanto, agem bem quando rejeitam a forma de culto descrita acima e afirmam reverenciar o único Deus do universo, reconhecendo-o como Senhor. Mas, quando lhe prestam culto por meios semelhantes aos já mencionados, estão completamente enganados.


    Pois os gregos demonstram sua insensatez ao oferecer essas coisas a imagens insensíveis e surdas. Os judeus, porém, pensando que as apresentam a Deus como se ele necessitasse delas, deveriam, com toda a razão, considerar isso insensatez, e não culto religioso.


    Aquele que fez o céu, a terra e tudo o que neles existe, e que fornece a todos nós aquilo de que necessitamos, não pode ele mesmo necessitar de nenhuma das coisas que dá aos que imaginam estar dando algo a ele.


    Mas os que pensam oferecer-lhe sacrifícios com sangue, gordura e ofertas totalmente queimadas[a], e honrá-lo com tais honras, não me parecem em nada diferentes dos que demonstram a mesma reverência por imagens surdas. Pois uns consideram apropriado fazer ofertas a coisas incapazes de receber essa honra; os outros, àquele que de nada necessita.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, sacrifícios cuja oferta era inteiramente consumida pelo fogo; tradicionalmente, “holocaustos”.
    reason: Esclarece um termo sacrificial antigo e evita que o leitor associe imediatamente a palavra “holocausto” apenas ao genocídio do século XX.
lexical_decisions:
- source_word: practicing their religion / worship
  choice: praticam sua religião / culto
  rationale: Distingue naturalmente, em português, a prática religiosa em geral do ato específico de prestar culto, sem apagar a relação conceitual presente no testemunho.
- source_word: Master
  choice: Senhor
  rationale: Termo corrente, digno e inteligível para a soberania de Deus; evita o tom social mais restrito de “mestre” e o acréscimo interpretativo de “Soberano”.
- source_word: senseless and deaf images
  choice: imagens insensíveis e surdas
  rationale: 'Mantém o contraste retórico: as imagens não possuem percepção e tampouco podem ouvir.'
- source_word: whole burnt offerings
  choice: ofertas totalmente queimadas
  rationale: Expressa o sentido sacrificial de vítimas consumidas integralmente pelo fogo e evita a associação moderna predominante de “holocaustos”.
- source_word: participate in / receive the honor
  choice: receber essa honra
  rationale: Formulação idiomática que conserva a ideia de incapacidade das imagens para acolher ou participar da honra oferecida.
theological_decisions:
- issue: Alcance da crítica aos judeus
  choice: Preservar a distinção entre a reverência ao único Deus, considerada correta, e os meios sacrificiais, considerados errados pelo autor.
  alternative: Apresentar uma condenação geral da religião judaica.
  rationale: O argumento do capítulo elogia explicitamente o monoteísmo judaico antes de censurar determinada forma de culto; uma generalização apagaria essa tensão.
- issue: Necessidade divina
  choice: Traduzir diretamente que Deus “de nada necessita”.
  alternative: Explicar a frase por uma doutrina sistemática específica da autossuficiência divina.
  rationale: A formulação direta preserva o argumento do autor sem importar terminologia dogmática posterior.
- issue: Comparação entre sacrifícios judaicos e ofertas a imagens
  choice: Manter a comparação retórica do autor sem ampliá-la nem atenuá-la.
  alternative: Harmonizar a passagem com avaliações bíblicas ou confessionais posteriores do sistema sacrificial.
  rationale: A tarefa de tradução exige conservar a tensão histórica e teológica real do texto, não resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “você” para o destinatário singular, acompanhando o tom direto da epístola. Como o texto grego não foi fornecido e a revisão na língua antiga está indicada como pendente, esta versão é necessariamente fundamentada no testemunho inglês público apresentado, consultando também a camada POB inglesa sem tratá-la como base autônoma.
