review_pass:
  verdict: revise
  source_fidelity: É necessária correção por inversão sintática grave em «Foi a ele que Deus enviou aos seres humanos», que em português significa que Deus enviou os seres humanos ao Enviado. O testemunho diz, ao contrário, que Deus enviou o Enviado a eles. A revisão também evita acrescentar o movimento «fez descer» onde o testemunho emprega a metáfora de plantar, e torna mais direto o par «gentleness [and] meekness».
  naturalness: O texto é em geral claro, moderno e preserva bem a cadência retórica. A versão revista melhora a construção do período central e substitui formulações um pouco interpretativas ou menos naturais por alternativas mais próximas do testemunho.
  terminology: «Artífice e Criador», «Salvador», «mansidão», «abismo» e «mistérios» são adequados. «Brandura [e] mansidão» reproduz com maior precisão a dupla qualificadora do envio. Os colchetes permanecem em todos os suplementos ou incertezas sinalizados pelo testemunho.
  issues:
  - severity: high
    issue: Inversão do destinatário e do objeto do envio
    rationale: '«Foi a ele que Deus enviou aos seres humanos» comunica que os seres humanos foram enviados a ele. O original inglês afirma: «Him he sent unto them», isto é, Deus enviou-o a eles.'
  - severity: medium
    issue: «Fez descer do céu e estabeleceu» amplia a imagem verbal
    rationale: O testemunho diz que Deus «planted among men» a verdade e o ensino santo, qualificando a ação como vinda «from heaven». «Fez descer» introduz uma ação de descida não expressa, e «estabeleceu» substitui a metáfora de plantar.
  - severity: low
    issue: Nota de rodapé descreve os colchetes como se todos assinalassem a mesma lacuna
    rationale: Há também colchetes em [e] e [um ser humano]. A nota deve distinguir as reticências, que assinalam a lacuna, dos colchetes, que assinalam suplemento ou incerteza editorial.
