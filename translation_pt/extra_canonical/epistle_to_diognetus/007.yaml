lexical_decisions:
- source_word: earthly discovery / mortal invention
  choice: descoberta terrena / invenção mortal
  rationale: Mantém o contraste retórico entre a origem divina da mensagem e qualquer elaboração humana, sem modernizar excessivamente a linguagem.
- source_word: dispensation / administration
  choice: administração / encargos administrativos
  rationale: Comunica a ideia de gestão ou incumbência presente no testemunho, evitando o sentido teológico posterior que «dispensação» poderia sugerir.
- source_word: Artificer and Creator
  choice: Artífice e Criador
  rationale: 'Preserva os dois títulos e sua distinção retórica: aquele que forma e aquele que cria.'
- source_word: gentleness [and] meekness
  choice: bondade [e] mansidão
  rationale: «Mansidão» conserva o teor ético-teológico; «bondade» expressa aqui uma disposição branda e benigna de modo natural em português.
- source_word: summoning
  choice: chamar
  rationale: Reproduz o contraste com perseguir e deixa em aberto se o chamado é convite, convocação ou chamado salvífico.
- source_word: presence
  choice: presença
  rationale: Preserva a formulação do testemunho e sua possível ressonância escatológica, sem interpretá-la como termo técnico.
theological_decisions:
- issue: Identidade daquele que Deus enviou
  choice: Manter a alternância entre «Deus» e «ele/o», identificando o enviado por títulos e ações, sem inserir «Filho» ou «Cristo» fora da comparação régia.
  alternative: Nomear explicitamente o enviado como Jesus Cristo ou o Filho de Deus.
  rationale: O trecho apresenta elevada linguagem cristológica, mas o testemunho fornecido não nomeia explicitamente Jesus Cristo nesta unidade; a tradução não deve resolver além do texto.
- issue: «He sent Him, as sending God»
  choice: «Enviou-o como Deus»
  alternative: «Enviou Deus» ou «enviou-o, sendo ele Deus»
  rationale: A opção conserva a tensão sintática e teológica da formulação, sem definir de maneira mais estreita a relação entre aquele que envia e aquele que é enviado.
- issue: «as [a man] unto men»
  choice: «como [um ser humano] aos seres humanos»
  alternative: «como homem aos homens»
  rationale: Mantém o suplemento editorial entre colchetes e comunica a humanidade do enviado em português atual e inclusivo, sem apagar o sinal de restauração.
- issue: Primeira vinda e julgamento futuro
  choice: «Enviou-o com amor, não para julgar. Pois ele o enviará para julgar»
  alternative: Reformular como uma doutrina explícita das duas vindas.
  rationale: Preserva o contraste escatológico do texto sem importar uma sistematização doutrinária que ele não enuncia formalmente.
- issue: Força como atributo de Deus
  choice: «a força não é própria de Deus»
  alternative: «Deus não usa coerção»
  rationale: A formulação escolhida mantém a afirmação proverbial e sua tensão, enquanto a alternativa explicaria e restringiria o sentido.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. Mantiveram-se a cadência retórica, as repetições e os paralelismos do trecho. Evitaram-se arcaísmos desnecessários, mas «Artífice», «mansidão» e «abismo» foram conservados por sua precisão e solenidade. Como a revisão direta do grego está pendente e a base disponível é um testemunho inglês de domínio público, a redação permanece prudentemente próxima dele, preservando colchetes, lacuna e ambiguidades pronominais.
