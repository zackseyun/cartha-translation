base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_to_diognetus/007.yaml
  text: 'For it is no earthly discovery, as I said, that was entrusted to them. They are not concerned to guard any mortal invention so carefully, nor have they been entrusted with the administration of human mysteries.


    But truly, the Almighty Creator of the universe, the invisible God himself, planted among humanity from heaven the truth and the holy teaching that surpasses human understanding, and firmly fixed it in their hearts. He did this not, as anyone might imagine, by sending to humanity a subordinate, or an angel, or a ruler, or one of those who direct earthly affairs, or one of those entrusted with administration in heaven, but by sending the very Maker and Creator of the universe himself. Through him he made the heavens; through him he enclosed the sea within its proper boundaries; all the elements faithfully observe his mysteries; from him [the sun] has received even the measure of the day’s courses to keep; the moon obeys him when he commands her to shine by night; the stars obey him as they follow the course of the moon. Through him all things are ordered, bounded, and placed in subjection: the heavens and the things in the heavens, the earth and the things on the earth, the sea and the
    things in the sea, fire, air, the abyss, the things in the heights, the things in the depths, and the things between the two. Him he sent to them.


    Was he sent, do you think, as anyone might suppose, to establish a dominion and inspire fear and terror?


    Not so. But he sent him in gentleness [and] meekness, as a king might send his son who is a king. He sent him as God; he sent him as [a man] to humanity; he sent him as Savior, using persuasion, not force, for force is no attribute of God.


    He sent him to summon, not to persecute; he sent him in love, not in judgment.


    For he will send him in judgment, and who will endure his presence?


    ....[Do you not see] them thrown to wild beasts so that they may deny the Lord, and yet they are not overcome?


    Do you not see that the more of them are punished, the more others multiply?


    These do not look like the works of a human being; they are the power of God; they are proofs of his presence.'
translation:
  language: pt
  text: 'Pois, como eu disse, não foi nenhuma descoberta terrena que lhes foi confiada. Eles tampouco se empenham em guardar com tanto cuidado alguma invenção mortal, nem lhes foi confiada a administração de mistérios humanos.


    Mas, na verdade, o próprio Deus invisível, o Criador todo-poderoso do universo, fez descer do céu e estabeleceu entre os seres humanos a verdade e o ensinamento santo que ultrapassa a compreensão humana, fixando-os firmemente em seus corações. Não fez isso, como alguém poderia imaginar, enviando à humanidade algum subordinado, anjo ou governante, nem um dos que dirigem os assuntos da terra, nem um dos que receberam encargos administrativos no céu, mas o próprio Artífice e Criador do universo. Por meio dele fez os céus; por meio dele encerrou o mar dentro dos limites que lhe cabem; todos os elementos guardam fielmente seus mistérios; dele [o sol] recebeu a medida dos percursos do dia que deve observar; a ele a lua obedece quando ele lhe ordena que brilhe à noite; a ele obedecem as estrelas, que seguem o curso da lua. Por meio dele todas as coisas são ordenadas, delimitadas e submetidas: os céus e o que neles há, a terra e o que nela há, o mar e o que nele há, o fogo, o ar, o abismo, o
    que está nas alturas, o que está nas profundezas e o que fica entre ambos. Foi a ele que Deus enviou aos seres humanos.


    Acaso ele foi enviado, como alguém poderia supor, para estabelecer um domínio e causar medo e terror?


    De modo nenhum. Deus o enviou com bondade [e] mansidão, como um rei enviaria seu filho, que também é rei. Enviou-o como Deus; enviou-o como [um ser humano] aos seres humanos; enviou-o como Salvador, valendo-se da persuasão, não da força, pois a força não é própria de Deus.


    Enviou-o para chamar, não para perseguir; enviou-o com amor, não para julgar.


    Pois ele o enviará para julgar; e quem suportará sua presença?


    ...[Não vês] que eles são lançados às feras para que neguem o Senhor e, ainda assim, não são vencidos?[a]


    Não vês que, quanto mais deles são castigados, tanto mais outros se multiplicam?


    Isso não parece obra humana; é o poder de Deus; são provas de sua presença.


    [a] As reticências e os colchetes assinalam uma lacuna no testemunho manuscrito e uma restauração editorial.'
