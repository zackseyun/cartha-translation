  text: in the third part of the day. And they shall bring its blood to the base of the altar, and they shall place its fat on the fire that is upon the altar, and they shall eat its flesh roasted with fire in the court of the house
translation:
  language: pt
  text: no terceiro terço do dia. Levarão o seu sangue à base do altar, colocarão a sua gordura sobre o fogo que está no altar e comerão a sua carne assada ao fogo, no pátio da casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሣልስቲ፡ ለዕለት
  choice: na terça parte do dia
  rationale: Mantém a divisão temporal expressa no ge'ez, sem a converter numa hora moderna específica.
- source_word: ምካይዳ፡ ለምሥዋዕ
  choice: à base do altar
  rationale: O contexto sacrificial favorece a parte inferior ou base do altar; evita o pouco natural e provavelmente inexato «limiar do altar».
- source_word: ሥብሖ
  choice: a gordura dele
  rationale: Designa a gordura sacrificial do animal, preservando o referente pronominal.
- source_word: ዐጸደ፡ ቤት
  choice: no pátio da casa
  rationale: Traduz literalmente o recinto ou pátio associado à casa, sem acrescentar «templo» onde o texto diz apenas «casa».
theological_decisions:
- issue: Identidade da «casa»
  choice: casa
  alternative: templo
  rationale: Preserva a formulação do texto-fonte e evita explicitar uma identificação cultual que, embora provável no contexto, não está lexicalmente expressa aqui.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e terminologia sacrificial consistente. O fragmento inicial em minúscula preserva a continuidade sintática do versículo anterior.
