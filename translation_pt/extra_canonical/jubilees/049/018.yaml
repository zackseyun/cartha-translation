base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/018.yaml
  text: Thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land that they are to possess, in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD.
translation:
  language: pt
  text: 'Assim está escrito e estabelecido: devem comê-la no santuário do SENHOR. Quando os filhos de Israel entrarem na terra que hão de possuir, na terra de Canaã, e armarem a tenda do SENHOR no meio da terra, em uma de suas tribos, até que o santuário do SENHOR seja construído na terra, eles virão, celebrarão a Páscoa no meio da tenda do SENHOR e imolarão a vítima pascal[a] diante do SENHOR.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «e a imolarão»; no texto, «Páscoa» também designa a vítima oferecida na celebração.
    reason: Esclarece a passagem do nome da celebração para a oferta sacrificial e documenta a forma mais literal da fonte.
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: está escrito e estabelecido
  rationale: Reproduz os dois verbos, distinguindo o registro escrito da determinação normativa, em português natural e solene.
- source_word: ቤተ፡ መቅደሱ
  choice: santuário
  rationale: Expressa de modo corrente o lugar santo destinado ao culto, de acordo com o contexto ritual.
- source_word: ደብተራ፡ እግዚአብሔር
  choice: tenda do SENHOR
  rationale: Traduz o termo referente à tenda cultual sem antecipar a construção posterior do santuário permanente.
- source_word: ይገብሩ፡ ጳስካ
  choice: celebrarão a Páscoa
  rationale: A construção idiomática portuguesa comunica naturalmente a observância ritual indicada por 'fazer a Páscoa'.
- source_word: ይጠብኅዎ
  choice: imolarão a vítima pascal
  rationale: O verbo denota abate sacrificial. A explicitação mínima do objeto evita a impressão absurda, em português, de que a festa abstrata seria imolada.
theological_decisions:
- issue: Relação entre a tenda cultual e o santuário posteriormente construído
  choice: Manter 'tenda' e 'santuário' como designações distintas
  alternative: Uniformizar ambos como 'santuário'
  rationale: O texto contrasta a instalação provisória da tenda com a futura construção do santuário; essa progressão deve permanecer visível.
- issue: Objeto da imolação no encerramento do versículo
  choice: Explicitar 'a vítima pascal' no texto e registrar a forma literal em nota
  alternative: Traduzir literalmente 'e a imolarão'
  rationale: O pronome da fonte retoma 'Páscoa' em sentido concreto, isto é, a oferta pascal. Em português, o antecedente tende a ser entendido apenas como a festa, por isso a explicitação preserva o sentido ritual sem acrescentar uma identificação mais específica, como 'cordeiro'.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Usa-se “SENHOR” como representação convencional do título divino. A ordem de algumas expressões foi ajustada para fluência, sem eliminar a sequência temporal e cultual do original.
