    rationale: 'O texto geʽez e o audit trail inglês apresentam a ordem: “o mandamento que o SENHOR lhe ordenou”. “Dar” pode ser associado a entregar ou conceder um mandamento, mas não preserva aqui a reiteração deliberada de “mandamento/ordenou” nem a força de ordem do original.'
  revised_text: 'Lembre-se do mandamento que o SENHOR lhe ordenou acerca da Páscoa: celebre-a no tempo determinado, no décimo quarto dia do primeiro mês; sacrifique-a antes do anoitecer, e que eles a comam.'
