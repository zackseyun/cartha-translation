base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/001.yaml
  text: 'Remember the command that the LORD commanded you concerning the Passover: that you should observe it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.'
translation:
  language: pt
  text: 'Lembre-se do mandamento que o SENHOR lhe ordenou acerca da Páscoa: celebre-a no tempo determinado, no décimo quarto dia do primeiro mês; sacrifique-a antes do anoitecer, e que eles a comam.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር
  choice: Lembre-se
  rationale: Traduz diretamente o imperativo de recordar, em linguagem natural e digna.
- source_word: ፋሲካ
  choice: Páscoa
  rationale: É o termo português consagrado para a celebração pascal judaica neste contexto.
- source_word: ትግበር
  choice: celebre-a
  rationale: No contexto de uma festa ritual, comunica melhor a realização ou observância da Páscoa do que o genérico “faça-a”.
- source_word: በጊዜሁ
  choice: no tempo determinado
  rationale: Expressa o tempo próprio ou estabelecido para a observância.
- source_word: ትጥብቍ
  choice: sacrifique-a
  rationale: No contexto do cordeiro pascal, o verbo se refere ao abate ritual; “sacrificar” preserva essa dimensão cultual.
- source_word: ዘእንበለ፡ ይምሰይ
  choice: antes do anoitecer
  rationale: Representa naturalmente a indicação temporal de que o sacrifício deve ocorrer antes de chegar a tarde/noite.
- source_word: ይብልዕዎ
  choice: que eles a comam
  rationale: Preserva a mudança para a terceira pessoa do plural presente na fonte.
theological_decisions:
- issue: Referente feminino dos verbos ligados à Páscoa
  choice: celebre-a; sacrifique-a; a comam
  alternative: celebre a festa; sacrifique o cordeiro; comam o sacrifício
  rationale: A fonte mantém pronomes sem explicitar “festa” ou “cordeiro”. A tradução conserva essa concisão e evita acrescentar um referente interpretativo.
- issue: Mudança de pessoa na última oração
  choice: que eles a comam
  alternative: coma-a
  rationale: Foi preservada a passagem da segunda pessoa singular para a terceira pessoa plural, embora seu referente não esteja explicitado no versículo.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Emprega “SENHOR” como representação tradicional do nome divino e mantém a estrutura exortativa da fonte sem eliminar a mudança final de pessoa.
