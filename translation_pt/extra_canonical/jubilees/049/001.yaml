revisions:
- from: 'Lembre-se do mandamento que o SENHOR lhe deu a respeito da Páscoa: celebre-a no tempo determinado, no décimo quarto dia do primeiro mês; sacrifique-a antes do anoitecer, e que eles a comam.'
  to: 'Lembre-se do mandamento que o SENHOR lhe ordenou acerca da Páscoa: celebre-a no tempo determinado, no décimo quarto dia do primeiro mês; sacrifique-a antes do anoitecer, e que eles a comam.'
  rationale: Substituiu-se apenas “lhe deu” por “lhe ordenou”, para refletir fielmente o verbo do original e sua repetição com “mandamento”. Mantêm-se a metonímia ritual de “sacrifique-a” e a mudança final para “eles”, ambas sustentadas pela fonte.
