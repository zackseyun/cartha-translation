  source_fidelity: 'A tradução preserva a estrutura principal: imperativo de recordar, a Páscoa, o tempo fixado, o décimo quarto dia do primeiro mês, o sacrifício antes do anoitecer e a mudança final para a terceira pessoa do plural. Contudo, “o mandamento que o SENHOR lhe deu” atenua e altera a repetição verbal da fonte, que diz literalmente que o Senhor “ordenou” o mandamento ao destinatário.'
  naturalness: O português é claro e de registro adequadamente solene. “Sacrifique-a”, embora metonímico, é uso bíblico compreensível para sacrificar a Páscoa; “antes do anoitecer” reproduz naturalmente a indicação temporal.
  terminology: “Páscoa”, “SENHOR”, “tempo determinado” e “sacrifique-a” são escolhas adequadas. A formulação “lhe ordenou” restaura o caráter imperativo do verbo-fonte sem tornar a frase pouco natural.
  issues:
