base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/022.yaml
  text: And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and concerning the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing.
translation:
  language: pt
  text: 'E você, Moisés, ordene aos filhos de Israel que guardem a ordenança da Páscoa, conforme lhe foi ordenado. Diga-lhes, ano após ano e dia após dia, a respeito da Festa dos Pães sem Fermento: que comam pão sem fermento durante sete dias, celebrem a sua festa[a] e apresentem a sua oferta, dia após dia, nesses sete dias de alegria.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “celebrem a festa”.'
    reason: A forma possessiva pode ser vertida de modo mais idiomático com artigo definido, sem mudança substancial de referência.
lexical_decisions:
- source_word: ሥርዐተ፡ ጳስካ
  choice: a ordenança da Páscoa
  rationale: Mantém o sentido normativo de ሥርዐት e a designação tradicional e reconhecível de ጳስካ.
- source_word: በዓለ፡ ፍአት
  choice: Festa dos Pães sem Fermento
  rationale: Expressa em português corrente a festa ligada ao pão não fermentado, evitando o termo menos acessível “ázimos” no texto principal.
- source_word: ፍአተ
  choice: pão sem fermento
  rationale: Tradução clara e natural do alimento não levedado; o singular coletivo é adequado ao contexto.
- source_word: ቍርባኖ
  choice: a sua oferta
  rationale: Preserva tanto a ideia cultual de oferta quanto o sufixo possessivo da forma etíope.
- source_word: ፍሥሓ
  choice: alegria
  rationale: O termo significa alegria, regozijo ou júbilo; não é o vocábulo comum para “festa”. “Alegria” produz uma formulação natural sem apagar a distinção lexical.
theological_decisions:
- issue: Força normativa da observância da Páscoa
  choice: “ordene ... que guardem a ordenança”
  alternative: “instrua ... a observar o rito”
  rationale: A redação conserva a sequência de imperativo e obrigação ritual do texto-fonte, sem acrescentar uma interpretação confessional.
- issue: Referência possessiva em “sua festa” e “sua oferta”
  choice: Relacionar ambas à Festa dos Pães sem Fermento
  alternative: Empregar “a festa” e “a oferta” sem possessivo
  rationale: Os sufixos do texto sustentam a referência possessiva, embora em português ela possa soar ligeiramente ambígua; a nota registra a alternativa idiomática para “festa”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Preferiu-se “Pães sem Fermento” a “Ázimos”. A oração inicial fragmentária antes de “E você, Moisés” foi tratada como resíduo do versículo anterior na divisão do capítulo, em conformidade com a unidade textual de Jubileus 49:22.
