  text: before the LORD, upon the altar of your God. For you observed this feast in haste when you came out from Egypt until you entered the wilderness of Shur, because at the shore of the sea you completed it.
translation:
  language: pt
  text: diante do SENHOR, sobre o altar do seu Deus. Pois vocês celebraram esta festa às pressas quando saíram do Egito, até entrarem no deserto de Sur, porque a concluíram junto à margem do mar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅድመ፡ እግዚአብሔር
  choice: diante do SENHOR
  rationale: Reproduz a expressão espacial e cultual do ge’ez em português bíblico natural; o uso de SENHOR segue a convenção para o título divino.
- source_word: ዲበ፡ ምሥዋዐ፡ አምላክክሙ
  choice: sobre o altar do seu Deus
  rationale: Mantém a relação locativa explícita e o referente possessivo plural, expresso em português inclusivo pelo contexto de «vocês».
- source_word: በዓለ
  choice: festa
  rationale: Termo corrente e digno para uma celebração religiosa ou festividade prescrita.
- source_word: በውልዋሌ
  choice: às pressas
  rationale: Comunica o sentido adverbial de pressa ou precipitação com uma expressão portuguesa natural.
- source_word: ገዳመ፡ ሱር
  choice: deserto de Sur
  rationale: Emprega a forma bíblica portuguesa tradicional e amplamente reconhecível do topônimo.
- source_word: በኀበ፡ ድንጋገ፡ ባሕር
  choice: junto à margem do mar
  rationale: Conserva a localização à beira do mar sem impor uma identificação geográfica mais específica.
- source_word: ሰበጥክምዋ
  choice: a concluíram
  rationale: Mantém a ideia verbal de completar ou concluir a festa, apesar de a formulação poder parecer incomum no contexto.
theological_decisions:
- issue: Sentido cultual de «diante do SENHOR» e «sobre o altar»
  choice: Preservar as duas expressões sem explicá-las ou harmonizá-las
  alternative: Reformular como «ofereçam-na ao SENHOR no altar»
  rationale: O texto recebido apresenta relações espacial-cultuais, e convertê-las numa ordem sacrificial explícita acrescentaria conteúdo interpretativo.
- issue: Objeto de «concluíram»
  choice: Manter «a», retomando «esta festa»
  alternative: Entender que se refere à saída, jornada ou observância pascal
  rationale: A concordância do texto favorece a retomada da festa; a tradução preserva essa leitura sem desenvolver uma explicação teológica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. «Vocês» torna explícito o destinatário plural; «seu Deus» permanece natural em português, embora o possessivo corresponda a um referente plural. A sintaxe segue de perto o ge’ez, mas evita rigidez desnecessária.
