revisions:
- from: 'À noite, ao cair da tarde do décimo quinto dia, desde o pôr do sol. Pois nessa noite começou a festa e começou a alegria. Vocês estavam no Egito, comendo a Páscoa, enquanto todos os poderes de Mastema foram enviados para matar todos os primogênitos na terra do Egito, desde o primogênito do faraó até a primogênita da serva cativa que estava no moinho, bem como os primogênitos dos animais.


    Este foi o sinal que o SENHOR lhes deu: em toda casa em cujos batentes eles vissem o sangue de um cordeiro de um ano, não deveriam entrar para matar, mas passariam por cima dela, para que todos os que estivessem na casa fossem salvos, pois o sinal do sangue estava nos batentes. Os poderes do SENHOR fizeram tudo exatamente como o SENHOR lhes havia ordenado. Passaram por cima de todos os filhos de Israel, e nenhuma praga caiu sobre eles para eliminar dentre eles ser algum, desde os animais até os seres humanos, nem mesmo os cães.


    A praga no Egito foi muito grande. Não havia casa no Egito em que não houvesse um morto, além de luto e lamentação. Todo o Israel, porém, permanecia comendo a carne da Páscoa, bebendo vinho, louvando, bendizendo e dando graças ao SENHOR, o Deus de seus pais. E estavam prontos para sair de debaixo do jugo do Egito e da cruel escravidão.


    Quanto a você, lembre-se deste dia durante todos os dias da sua vida e celebre-o de ano em ano, durante todos os dias da sua vida, uma vez por ano, no dia próprio, segundo toda a sua lei. Não transfira o dia de um dia para outro, nem de um mês para outro. Pois este é um estatuto eterno, escrito e estabelecido nas tábuas celestiais para todos os filhos de Israel, a fim de que o celebrem todos os anos, ano após ano, no dia próprio, uma vez por ano, por todas as suas gerações. Não haverá fim para esses dias, pois isso está estabelecido para sempre.


    O homem que estiver puro e vier celebrá-la no dia próprio, para apresentar diante do SENHOR uma oferta aceitável e para comer e beber diante do SENHOR no dia da festa — esse homem, embora puro e estando perto, será eliminado por não ter apresentado a oferta do SENHOR no tempo determinado; esse homem levará sobre si o seu pecado.[a]


    Portanto, os filhos de Israel virão celebrar a Páscoa no tempo determinado, no décimo quarto dia do primeiro mês, entre as tardes, desde o meio do dia até a terça parte da noite;[b] pois duas partes do dia são dadas à luz, e uma terça parte pertence à tarde. Foi isso que o SENHOR lhe ordenou celebrar no meio da tarde.


    O animal não será abatido durante nenhuma parte do período de luz, mas somente ao cair da tarde. Eles o comerão durante a tarde, até a terça parte da noite. Tudo o que restar de sua carne depois da terça parte da noite será queimado no fogo. Não o comerão cru nem cozido em água, mas assado no fogo. Deverão assá-lo no fogo inteiro, com a cabeça, as partes internas e as pernas. Não quebrarão nenhum dos seus ossos, pois os filhos de Israel não devem quebrar osso algum.


    Por isso o SENHOR ordenou aos filhos de Israel que celebrassem a Páscoa no tempo determinado e que não quebrassem nenhum dos seus ossos, pois esse é um dia de festa e um dia ordenado. Não devem transferi-lo de um dia para outro, nem de um mês para outro; ele deve ser celebrado no dia de sua festa.


    E você, ordene aos filhos de Israel que celebrem a Páscoa no tempo devido, todos os anos, uma vez por ano, no tempo determinado. Ela será um memorial aceitável diante do SENHOR, e nenhuma praga virá sobre eles para matar ou ferir naquele ano em que celebrarem a Páscoa.'
