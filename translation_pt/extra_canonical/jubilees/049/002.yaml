  language: pt
  text: 'À noite, ao cair da tarde do décimo quinto dia, desde o pôr do sol. Pois nessa noite começou a festa e começou a alegria. Vocês estavam no Egito, comendo a Páscoa, enquanto todos os poderes de Mastema foram enviados para matar todos os primogênitos na terra do Egito, desde o primogênito do faraó até a primogênita da serva cativa que estava no moinho, e sobre os animais.


    Este foi o sinal que o SENHOR lhes deu: em toda casa em cujos batentes vissem o sangue de um cordeiro de um ano, não entrariam naquela casa para matar, mas passariam por cima dela, para que todos os que estivessem na casa fossem salvos, pois o sinal do sangue estava nos batentes. Os poderes do SENHOR fizeram tudo exatamente como o SENHOR lhes havia ordenado. Passaram por cima de todos os filhos de Israel, e nenhuma praga caiu sobre eles para eliminar dentre eles qualquer ser vivo, desde os animais até os seres humanos, inclusive os cães.


    A praga no Egito foi muito grande. Não havia casa no Egito em que não houvesse um morto, pranto e lamentação. Todo o Israel, porém, permanecia comendo a carne da Páscoa, bebendo vinho, louvando, bendizendo e dando graças ao SENHOR, o Deus de seus pais. E estavam prontos para sair de debaixo do jugo do Egito e da cruel escravidão.


    Quanto a você, lembre-se deste dia durante todos os dias da sua vida e celebre-o de ano em ano, durante todos os dias da sua vida, uma vez por ano, no dia próprio, segundo toda a sua lei. Não transfira o dia de um dia para outro, nem de um mês para outro. Pois este é um estatuto eterno, escrito e estabelecido nas tábuas celestiais para todos os filhos de Israel, a fim de que o celebrem todos os anos, ano após ano, no dia próprio, uma vez por ano, por todas as suas gerações. Não haverá fim para esses dias, pois isso está estabelecido para sempre.


    O homem que estiver puro e vier celebrá-la no dia próprio, para apresentar diante do SENHOR uma oferta aceitável e para comer e beber diante do SENHOR no dia da festa — esse homem, estando puro e próximo, será eliminado, por não ter apresentado a oferta do SENHOR no tempo determinado; esse homem levará sobre si o seu pecado.[a]


    Portanto, os filhos de Israel virão celebrar a Páscoa no tempo determinado, no décimo quarto dia do primeiro mês, entre as tardes, desde o meio do dia até a terça parte da noite;[b] pois duas partes do dia são dadas à luz, e uma terça parte pertence à tarde. Foi isso que o SENHOR lhe ordenou celebrar no meio da tarde.


    Ela não será abatida durante nenhuma parte do período de luz, mas somente no tempo da tarde. Eles a comerão durante a tarde, até a terça parte da noite. Tudo o que restar de sua carne depois da terça parte da noite será queimado no fogo. Não a comerão crua nem cozida em água, mas assada no fogo. Deverão assá-la no fogo inteira, com a cabeça, as partes internas e as pernas. Não quebrarão nenhum osso dela, pois nenhum osso deve ser quebrado entre os filhos de Israel.


    Por isso o SENHOR ordenou aos filhos de Israel que celebrassem a Páscoa no tempo determinado e que não quebrassem nenhum osso dela, pois esse é um dia de festa e um dia ordenado. Não devem transferi-lo de um dia para outro, nem de um mês para outro; ele deve ser celebrado no dia de sua festa.


    E você, ordene aos filhos de Israel que celebrem a Páscoa no tempo devido, todos os anos, uma vez por ano, no tempo determinado. Ela será um memorial aceitável diante do SENHOR, e nenhuma praga virá sobre eles para matar ou ferir naquele ano em que celebrarem a Páscoa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção da fonte é abrupta, mas o verbo indica a pena de ser eliminado ou extirpado. «Próximo» traduz literalmente um termo cujo referente não é especificado no contexto.
    reason: Esclarece a sintaxe difícil e o alcance da expressão temporal ou espacial sem atenuar a pena nem resolver interpretativamente o referente de «próximo».
  - marker: b
    text: A expressão da fonte também pode ser entendida como «desde o meio da hora». O contexto descreve a divisão do período entre a luz e a noite.
