lexical_decisions:
- source_word: በጊዜሁ
  choice: no tempo determinado
  rationale: Expressa o tempo próprio ou designado para a observância, em português natural.
- source_word: በከመ፡ ትእዛዙ
  choice: conforme o seu mandamento
  rationale: Mantém a relação explícita com a ordem prescrita, sem especificar além do que o texto diz.
- source_word: ወኢይከውን፡ ለበሊያቶ
  choice: Não será permitido comê-lo
  rationale: Reproduz o valor impessoal de licitude/permissão e conserva o referente masculino do contexto, o sacrifício pascal.
- source_word: በአፍአ፡ እምቤተ፡ መቅደሱ
  choice: fora do santuário
  rationale: Traduz diretamente a localização exterior em contraste com o lugar prescrito.
- source_word: በአንጻረ፡ ቤተ፡ መቅደሱ
  choice: diante do santuário
  rationale: Conserva o sentido espacial de estar perante ou em frente ao santuário, com formulação digna e corrente.
- source_word: ወኵሉ፡ ሕዝበ፡ ማኅበ
  choice: e todo o povo da assembleia
  rationale: Preserva a conjunção, o substantivo 'povo' e a construção que continua sintaticamente no versículo seguinte, sem convertê-la em complemento de companhia.
theological_decisions:
- issue: Designação divina እግዚአብሔር
  choice: SENHOR
  alternative: Senhor
  rationale: Usa a convenção portuguesa reconhecível para o nome divino neste contexto cultual, sem acrescentar interpretação denominacional.
- issue: Limite do versículo e sintaxe incompleta
  choice: encerrar com “e todo o povo da assembleia”
  alternative: ligar a expressão ao verbo anterior como “com todo o povo da assembleia”
  rationale: O segmento final funciona como sujeito da oração que prossegue no versículo 17. Mantê-lo coordenado evita alterar a sintaxe e omitir ሕዝበ, 'povo'.
translation_notes:
  register: Português moderno, solene e acessível, com proximidade formal ao texto ge’ez. A terminação aparentemente suspensa foi mantida de propósito porque a frase continua no versículo seguinte.
