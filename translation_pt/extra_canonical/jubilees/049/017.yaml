  text: All of Israel shall observe it at its appointed time. And every man who comes on that day shall eat it in the house of the sanctuary of your God before the LORD, from twenty years old and upward, because
translation:
  language: pt
  text: Todo o Israel o celebrará no tempo determinado. E todo homem que vier naquele dia o comerá na casa do santuário do seu Deus, diante do SENHOR, desde os vinte anos de idade para cima, porque
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሮሙ፡ ለእስራኤል
  choice: Todo o Israel
  rationale: O contexto e a evidência editorial sustentam uma referência abrangente a Israel; esta formulação é natural e preserva o sentido coletivo.
- source_word: ይገበርዎ
  choice: o celebrará
  rationale: No contexto da Páscoa, o verbo indica cumprir ou observar o rito; “celebrará” comunica esse valor de modo claro em português.
- source_word: በጊዜሁ
  choice: no tempo determinado
  rationale: Expressa o tempo próprio ou designado para a observância sem acrescentar precisão ausente no texto.
- source_word: ዘመጽአ፡ በዕለቱ
  choice: que vier naquele dia
  rationale: Mantém a formulação genérica e temporal do texto-fonte em português natural.
- source_word: ይብልዎ
  choice: o comerá
  rationale: O pronome retoma o elemento ritual, isto é, a Páscoa ou refeição pascal, sem explicitá-lo além do trecho preservado.
- source_word: በቤተ፡ መቅደሱ
  choice: na casa do santuário
  rationale: Preserva a expressão formalmente marcada “casa do santuário”, em vez de reduzi-la simplesmente a “santuário”.
- source_word: ለአምላክክሙ
  choice: do seu Deus
  rationale: A forma ge'ez é plural na referência aos destinatários; “seu” é amplamente inteligível, embora possa ser lido como singular em português.
- source_word: በቅድመ፡ እግዚአብሔር
  choice: diante do SENHOR
  rationale: Tradução tradicional e semanticamente direta da expressão de presença perante o nome divino.
- source_word: ዘእም፳ዓመት፡ ወላዕለ
  choice: desde os vinte anos de idade para cima
  rationale: Reproduz o limite etário inclusivo e a direção ascendente do original.
theological_decisions:
- issue: Referente do pronome em “o comerá”
  choice: Manter o pronome sem explicitar “a Páscoa” ou “o cordeiro pascal”
  alternative: Explicitar “comerá a Páscoa” ou “comerá o cordeiro pascal”
  rationale: O trecho fornecido contém um referente pronominal dependente do contexto; explicitá-lo resolveria uma elipse que o original mantém.
- issue: Título divino
  choice: SENHOR em versaletes tipográficas representadas por maiúsculas
  alternative: Senhor ou Iahweh
  rationale: Mantém uma convenção portuguesa reconhecível sem introduzir uma vocalização específica do nome divino.
- issue: Oração final incompleta
  choice: Encerrar com “porque”, preservando a suspensão
  alternative: Completar a justificativa com material do versículo seguinte
  rationale: A unidade textual fornecida termina em እስመ, “porque”; completar a frase importaria conteúdo fora do segmento solicitado.
translation_notes:
  register: Português moderno, digno e acessível, com leve formalidade bíblica. Conservou-se a estrutura incompleta no fim do versículo e a expressão incomum “casa do santuário” por fidelidade ao texto-fonte.
