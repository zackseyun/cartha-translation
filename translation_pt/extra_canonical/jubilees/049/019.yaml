  text: from year to year. And in the days when the house is built in the name of the LORD in the land of their inheritance, there they shall go and slaughter the Passover in the evening, at sunset,
translation:
  language: pt
  text: de ano em ano. E, nos dias em que a casa for construída em nome do SENHOR, na terra da herança deles, irão até lá e imolarão a Páscoa ao entardecer, ao pôr do sol,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምዓመት፡ በዓመት
  choice: de ano em ano
  rationale: Reproduz de modo natural a expressão distributiva temporal do ge’ez.
- source_word: ተሐንጸ፡ ቤት
  choice: a casa for construída
  rationale: Mantém a referência definida ao santuário sem explicitar no texto algo além de “casa”.
- source_word: ህየ፡ የሐሩ
  choice: irão até lá
  rationale: Preserva tanto o advérbio locativo “lá” quanto o verbo de movimento የሐሩ, ausente em uma revisão inglesa anterior.
- source_word: ወይጥብሑ፡ ጳስካ
  choice: e imolarão a Páscoa
  rationale: “Imolar” comunica o abate sacrificial expresso pelo verbo e conserva “Páscoa” como no texto, sem acrescentar “cordeiro”.
- source_word: ምሴተ፡ እንዘ፡ የዐርብ፡ ፀሐይ
  choice: ao entardecer, ao pôr do sol
  rationale: Expressa de forma corrente a indicação vespertina e a ação do sol se pôr.
theological_decisions:
- issue: Identidade da “casa”
  choice: a casa
  alternative: o templo
  rationale: O original diz literalmente “casa”; manter essa designação evita antecipar uma identificação interpretativa, embora o contexto seja cultual.
- issue: Objeto da imolação pascal
  choice: imolarão a Páscoa
  alternative: imolarão o cordeiro pascal
  rationale: O texto traz “Páscoa”, não “cordeiro”; a formulação preserva o idioma sacrificial bíblico sem introduzir um referente não expresso.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com cadência bíblica moderada. “SENHOR” representa o nome/título divino na forma editorial tradicional; “irão até lá” conserva explicitamente o movimento indicado pelo ge’ez.
