  text: that has been sanctified in the name of the LORD. And they shall not be able to observe the Passover in their cities, nor in any place except before the tent of the LORD, or before his house where he dwells.
translation:
  language: pt
  text: que foi santificado em nome do SENHOR. Eles não poderão celebrar a Páscoa em suas cidades, nem em lugar algum, a não ser diante da tenda do SENHOR ou[a] diante da sua casa, onde ele habita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “e, se não, diante da sua casa”; aqui, a expressão equivale a “ou”.
    reason: Registra a forma idiomática ge’ez subjacente à alternativa traduzida por “ou”.
lexical_decisions:
- source_word: ተቀደሰ
  choice: foi santificado
  rationale: Mantém o valor passivo do verbo e a ligação sintática com o contexto anterior.
- source_word: ገቢረ፡ ጳስካ
  choice: celebrar a Páscoa
  rationale: Embora a expressão seja literalmente ‘fazer a Páscoa’, ‘celebrar a Páscoa’ é a formulação natural em português para observar a festa e seus ritos.
- source_word: ደብተራ፡ እግዚአብሔር
  choice: tenda do SENHOR
  rationale: Traduz o local sagrado móvel sem introduzir a terminologia mais específica ‘tabernáculo’, mantendo linguagem clara e digna.
- source_word: ኀበ፡ ኀደረ
  choice: onde ele habita
  rationale: Reproduz diretamente a referência à morada divina, sem acrescentar ‘seu nome’, expressão ausente do texto apresentado.
theological_decisions:
- issue: Relação entre a tenda do SENHOR e sua casa
  choice: ou diante da sua casa
  alternative: e diante da sua casa
  rationale: A expressão ወአመ፡ አኮ፡, literalmente ‘e, se não’, funciona idiomaticamente como alternativa (‘ou’, ‘caso contrário’), não como simples coordenação cumulativa.
- issue: Sujeito de ‘habita’
  choice: ele, isto é, o SENHOR
  alternative: seu nome
  rationale: O texto diz apenas ‘onde ele habita’; inserir ‘seu nome’ acrescentaria uma formulação teológica não presente nesta testemunha textual.
translation_notes:
  register: Português contemporâneo, claro e reverente, com ‘SENHOR’ em versaletes convencionais. A construção inicial foi mantida como continuação do versículo ou período anterior. ‘Qualquer outro lugar’ evita a rigidez de uma tradução palavra por palavra, sem ampliar o sentido.
