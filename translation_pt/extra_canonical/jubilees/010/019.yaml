  yaml_path: translation/extra_canonical/jubilees/010/019.yaml
  text: For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us go up by it into heaven.”
translation:
  language: pt
  text: 'Pois eles partiram da terra de Ararate em direção ao leste, para Sinear, e, nos dias dele, construíram a cidade e a torre, dizendo: “Venham, subamos por ela até o céu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈለሱ
  choice: partiram
  rationale: Expressa o deslocamento para outra região de modo natural, sem acrescentar a ideia mais específica de migração permanente.
- source_word: መንገለ፡ ጽባሕ
  choice: em direção ao leste
  rationale: Reproduz literalmente a orientação para o nascente e mantém claro o sentido geográfico.
- source_word: ሰናአር
  choice: Sinear
  rationale: Emprega a forma bíblica portuguesa tradicional e reconhecível para o topônimo Shinar.
- source_word: ሐነጽዎ
  choice: construíram
  rationale: Verbo corrente e digno que comunica diretamente o ato de edificar.
- source_word: ማኅፈድ
  choice: torre
  rationale: Corresponde ao edifício elevado no relato e coincide com a identificação preservada pela tradição textual.
- source_word: ንዕርግ
  choice: subamos
  rationale: Preserva o convite coletivo e o movimento ascendente, com registro natural e solene.
- source_word: ቦቱ
  choice: por ela
  rationale: Mantém a referência instrumental ou espacial à torre, sem reformulá-la como mero propósito.
- source_word: ውስተ
  choice: até
  rationale: No contexto do movimento ascendente, comunica o destino visado de forma idiomática; a preposição também pode ser entendida mais literalmente como “para dentro de”.
theological_decisions:
- issue: Alcançar o céu por meio da torre
  choice: “subamos por ela até o céu”
  alternative: “subamos por ela para dentro do céu”
  rationale: Mantém a pretensão expressa pelos construtores sem decidir se “céu” significa a morada divina, o firmamento ou simplesmente as alturas.
- issue: Referente de “nos dias dele”
  choice: Preservar o pronome masculino singular sem identificar o referente
  alternative: Substituir pelo nome inferido do contexto anterior
  rationale: O trecho fornecido não explicita o antecedente; nomeá-lo resolveria uma referência que o texto deste versículo deixa dependente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A ordem foi levemente ajustada para fluência, mas a progressão do ge'ez foi preservada. Não foram necessárias notas de rodapé.
