  text: And the Lord our God said to us[22], “Look, they are one people, and this they have begun to do; and now nothing will be withheld from them. Come, let us go down and confuse their tongues, so that one will not hear another’s speech, and they will be scattered into cities and nations, and one purpose will no longer remain with them until the day of judgment.”
translation:
  language: pt
  text: 'E o Senhor, nosso Deus, nos disse[a]: “Vejam, eles são um só povo, e isto é o que começaram a fazer. Agora nada lhes será impedido. Venham, desçamos e confundamos as línguas deles, para que um não entenda a fala do outro. Então eles serão espalhados por cidades e nações, e não haverá mais entre eles um só propósito até o dia do julgamento.”'
  philosophy: optimal-equivalence
