lexical_decisions:
- source_word: ኢይኅልቅ፡ እምኔሆሙ
  choice: nada do que planejarem fazer lhes será impossível
  rationale: A expressão indica que nada lhes ficará fora de alcance ou será impedido. A formulação portuguesa preserva o sentido sem reproduzir literalmente uma construção ambígua e pouco natural.
- source_word: ንከዐው፡ ልሳናቲሆሙ
  choice: confundamos as línguas deles
  rationale: No contexto de Babel, “línguas” abrange tanto o idioma quanto a fala; “confundir” expressa o resultado narrativo de perda da compreensão mútua.
- source_word: ኢይስማዕ፡ እኍዋሁ፡ ካልኡ
  choice: para que ninguém entenda a fala do outro
  rationale: Embora o verbo corresponda literalmente a “ouvir”, neste contexto significa ouvir com compreensão; a tradução explicita esse valor idiomático.
- source_word: አሐቲ፡ ምክር
  choice: um só propósito
  rationale: O substantivo pode significar conselho, plano ou propósito. “Propósito” preserva a ideia de deliberação coletiva e unidade de intenção.
- source_word: ዕለተ፡ ይኴን
  choice: dia do julgamento
  rationale: A leitura contextual e a tradição textual do versículo apontam para o dia do juízo/julgamento; “julgamento” é linguagem moderna, clara e não confessional.
theological_decisions:
- issue: Plural divino em “desçamos”
  choice: manter “Venham, desçamos”
  alternative: 'normalizar para o singular: “Vou descer”'
  rationale: O texto apresenta Deus falando a uma corte celestial, dentro da moldura narrativa angélica de Jubileus. Manter o plural preserva essa tensão sem impor uma interpretação trinitária ou meramente retórica.
- issue: Relação com Gênesis 11
  choice: traduzir como discurso integrado à revelação angélica de Jubileus
  alternative: formatar ou ajustar como citação direta de Gênesis
  rationale: A passagem ecoa Babel, mas o enquadramento em primeira pessoa plural (“nos disse”) pertence à composição própria de Jubileus.
- issue: Alcance da capacidade humana
  choice: “nada do que planejarem fazer lhes será impossível”
  alternative: “nada lhes será impedido”
  rationale: A formulação mantém a declaração forte do texto, mas a vincula ao que eles planejam fazer, sem transformá-la numa tese abstrata de onipotência humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” de modo implícito em “Vejam” e “Venham”, evita arcaísmos e conserva o plural deliberativo/celestial do original.
