reference: Jubilees 10:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: charles_1895
  language: Geez
  text: '1. መካነ፡ ደይን። ወለአሐዱ፡ እምኔነ፡ ይቤ፡ ከመ፡ ንምሀር፡ ለኖኅ፡ ኵሎ፡ ፈውሶሙ፡ እስመ፡

    11. ያአምር፡ ከመ፡ አኮ፡ በርቱዕ፡ ዘየሐውሩ፡ ወአኮ፡ በጽድቅ፡ ዘይትባአሱ። ወገበርነ፡ በከመ፡ ኵሉ፡ ቃሉ፡ ኵሎ፡ እኩያነ፡ እለ፡ ይጸውጉ፡ አሰርነ፡ ውስተ፡ መካነ፡ ደይን፡ ወዓሥራተሙ፡

    12. አተርፍነ፡ ከመ፡ ይትኰነኑ፡ ቅድመ፡ ሰይጣን፡ ዲበ፡ ምድር። ወፈውሰ፡ ደዌሆሙ፡ ኵሎ፡

    13. ነገርናሁ፡ ለኖኅ፡ ምስለ፡ አስሕተትሙ፡ ከመ፡ ይፈውሱ፡ በዕፀወ፡ ምድር። ወጸሐፈ፡ ኖኅ፡ ኵሎ፡ ዘከመ፡ መሀርናሁ፡ በመጽሐፍ፡ በኵሉ፡ ትዝምደ፡ ፈውሳት፡ ወተዐጸዉ፡ መናፍስት፡

    14. እኩያን፡ እምድኅሬሆሙ፡ ለውሉደ፡ ኖኅ። ወወሀበ፡ ኵሎ፡ ዘጸሐፈ፡ ለሴም፡ ወልዱ፡ ዘይፈህቅ፡

    15. እስመ፡ ኪያሁ፡ ያፈቅር፡ ፈድፋደ፡ እምኵሉ፡ ውሉዱ። ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ፡

    16. ወተቀብረ፡ *ውስተ፡ ሉባር፡ ደብር፡ በምድረ፡ አራራት። ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ፡

    17. *፲ወ፱ *እዮቤልው፡ ወክልኤ፡ ሱባዔ፡ ወ፭ዓመተ። ዘአፈድፈደ፡ ሐዩዎ፡ *ዲበ፡ ምድር፡ እምውሉደ፡ ሰብእ፡ በእንተ፡ ጽድቅ፡ ዘባቲ፡ *ፍጹመ፡ ኮነ፡ ዘእንበለ፡ ሄኖክ። እስመ፡ ገብሩ፡ ለሄኖክ፡ ተፈጥሮተ፡ ለስምዕ፡ ለትዝምደ፡ ዓለም፡ ከመ፡ ይንገር፡ ኵሎ፡ ግብረ፡ ለትውልደ፡

    18. ትውልድ፡ ለዕለተ፡ ደይን። ወበሰላሳ፡ ወሰለስቱ፡ እዮቤልው፡ በዓመት፡ አሐዱ፡ በ፪ካልእ፡ ሱባዔ፡ ነሥአ፡ ሎቱ፡ ፋሌክ፡ ብእሲተ፡ እንተ፡ ስማ፡ *ሎምና፡ ወለተ፡ ሲናአር፡ ወወለደት፡ ሎቱ፡ ወልደ፡ በዓመት፡ ራብዕ፡ ዘሱባዔ፡ ዝንቱ። ወጸውዐ፡ ስሞ፡ ራገው፡ እስመ፡ ይቤ፡ ናሁ፡ ውሉደ፡ ሰብእ፡ ኮኑ፡ እኩያነ፡ በምክረ፡ ዐግ፡ ከመ፡ ይሕንፁ፡ ሎሙ፡ ሀገረ፡ ወማኅፈደ፡ ውስተ፡ ምድረ፡

    19. ሲናአር። እስመ፡ ፈለሱ፡ እምድረ፡ አራራት፡ መንገለ፡ ጽባሕ፡ ውስተ፡ ሰናአር፡ እስመ፡ በመዋዕሊሁ፡ ሐነጽዎ፡ ለሀገር፡ ወለማኅፈድ፡ እንዘ፡ ይብሉ፡ ንዑ፡ ንዕርግ፡ ቦቱ፡ ውስተ፡

    20. ሰማይ። ወአንዙ፡ ይሕንጹ፡ ወበሱባዔ፡ ራብዕ፡ ንንፈሱ፡ በእሳት፡ ወከኖሙ፡ ንንፋስ፡ ከመ፡ እብን፡ ወፀቡር፡ በዘይመርጉ፡ ሱቱ፡ አስፋሌጦስ፡ ዘይወፅእ፡ እምነ፡ ባሕር፡ ወእምአንቅዐተ፡

    21. ማያት፡ በምድረ፡ ሰናአር። ወሐነጽዎ፡ *አርብዓ፡ ዓመተ፡ ወሠለስተ፡ ዓመተ፡ ሀለዉ፡ የሐንጽዎ፡ ግንፋለ፡ ጽፍሑ፡ ፪፻ወ፬ ውስቴቱ፡ ወማእስቱ፡ አሐቲ፡ ኑኅ፡ *ሐምሳ፡ ምእት፡ ወአርባዐቱ፡ ምእት፡ ወሰላሳ፡ ወሰለስቱ፡ በአመት፡ ዐርገ፡ ኑኁ፡ *ወክልኤ፡ ስዝር፡ ወ፲ወ፪ ምዕራፍ። ወይቤለነ፡ እግዚአብሔር፡ አምላክነ፡ ለነ፡ ናሁ፡ ሕዝብ፡" አሐዱ፡ ወ"ወጠነ፡ ይግበር፡" ወይእዜኒ፡ ፳፪ ኢይኅልቅ፡" እምኔሆሙ፡ ኀበ፡ "ነረደ፡ ወ"ንከዐው፡" ልሳናቲሆሙ፡ ወኢይስማዕ፡ "እኍዋሁ፡ ካልኡ፡" ወይዘረዉ፡ ውስተ፡ አህጉር፡ ወውስተ፡ አሕዛብ፡ ወ"አትነብር፡ እንከ፡" አሐቲ፡ ምክር፡ ላዕሌሆሙ፡ እስከ፡ አመ፡ ዕለተ፡ ይኴን። ወወረደ፡ እግዚአብሔር፡ ወወረድነ፡ ምስሌሁ፡ ንርአይ፡ ፳፫ ሀገረ፡ ወማኅፈደ፡ ዘሐነጹ፡ ውሉደ፡ ሰብእ። ወሥጠ"፡" ልሳናቲሆሙ፡ ወአስምዐ፡ እንከ፡ ፳፬ አሐዱ፡" ቃለ፡ ካልኡ፡ ወአንተጉ፡ እንከ፡ ሐኒጸ፡ ሀገር፡ ወማኅፈድ።" በእንተዝ፡ ተሰምየት፡ ስማ፡ ፳፭ ምድረ፡ ሴናአር፡" ባቤል፡ እስመ፡ በህየ፡ ሰወጠ፡" እግዚአብሔር፡" ኵሎ፡" ልሳናቲሆሙ፡ ለውሉደ፡ ሰብአ፡ ወእምህየ፡ ተዘርዉ፡ ውስተ፡ አህጉሪሆሙ፡ በበ፡ ልሳናቲሆሙ፡ ወበበ፡ ሕዝቢሆሙ።

    26. ወፈነወ፡ እግዚአብሔር፡ ነፋሰ፡ ዐቢየ፡ ውስተ፡ ማኅፈድ፡ ወገፍታአ፡ ውስተ፡ ምድር፡ ወናሁ፡

    27. ውእቱ፡ ማእከለ፡ አሱር፡ ወባቢሎን፡ ውስተ፡ ምድረ፡ ሰናአር፡ ወጸውዐ፡ ስሞ፡ ደቀት፡ በሱባዔ፡ ራብዕ፡ በአሐዱ፡ ዓመት፡ በመቅደመ፡ ዚአሁ፡ በ፴ሳባ፡ ወአርባዕቱ፡ እዮቤልው፡ ተዘርዉ፡

    28. እምድረ፡ ሲናአር። ወሖሩ፡ ካም፡ ወውሉዱ፡ ውስተ፡ ምድር፡ እንተ፡ አሕዝት፡ ሎቱ፡ ዘረከበ፡

    29. በመክፈልቱ፡ ውስተ፡ ምድረ፡ ደቡብ። ወርእየ፡ ከናአን፡ ምድረ፡ ሊባኖስ፡ እስከ፡ መሐዘ፡ ግብጽ፡ *ከመ፡ ሠናይ፡ ይእቲ፡ ጥቀ፡ ወኢሖረ፡ ውስተ፡ ምድረ፡ ርስት፡ መንገለ፡ ዐረብ፡ ባሕር፡ ወኀደረ፡ ውስተ፡ ምድረ፡ ሊባኖስ፡ እምጽባሕ፡ ወእምዐረብ፡ እምእደ፡ ዮርዳኖስ፡ ውእምእደ፡

    30. ባሕር። ወይቤሎ፡ ካም፡ አቡሁ፡ ወኩስ፡ መውጽሬም፡ አኀዊሁ፡ እስመ፡ ኀደርከ፡ ውስተ፡ ምድር፡ እንተ፡ አኮነ፡ እንቲአከ፡ ወኢወፀአ፡ ለከ በዕፁ፡ ኢትግበር፡ ከመዝ፡ *እስመ፡ ለእመ፡ ከመዝ፡ ገበርከ፡ አንተሂ፡ ወደቂቅከሂ፡ ትወድቁ፡ ውስተ፡ ምድር፡ ወርጉማን፡ በሀከከ፡ *እስመ፡

    31. በሀከከ፡ ኀደርክሙ፡ ወበሀከከ፡ ይወድቁ፡ ደቂቅከ፡ ወትሴር፡ ለዓለም። ኢትኅደር፡

    32. ውስተ፡ ማኅደረ፡ ሴም፡ *እስመ፡ ለሴም፡ ወለውሉዱ፡ ወፀአ፡ በዕፆሙ። ርጉም፡ አንተ፡ ወርጉመ፡ ትከውን፡ እምኵሎሙ፡ ውሉደ፡ ኖኅ፡ በመርገም፡ እንተ፡ ተማራዕነ፡ በመሐላ፡

    33. በቅድሜሁ፡ ለመኰንን፡ ቅዱስ፡ ወበቅድመ፡ ኖኅ፡ አቡነ። ወኢሰምዖሙ፡ ወኀደረ፡ ምድረ፡

    34. ሊባኖስ፡ እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ፡ ውእቱ፡ ወውሉዱ፡ እስከ፡ ዛቲ፡ ዕለት። ወበእንተዝ፡

    35. ተሰምየት፡ ይእቲ፡ ምድር፡ ከናአን። ወደፌትሰ፡ ወውሉዱ፡ ሖሩ፡ መንገለ፡ ባሕር፡ ወኀደሩ፡ ውስተ፡ ምድረ፡ መክፈልቶሙ፡ ወርእየ፡ ማዳይ፡ ምድረ፡ ባሕር፡ ወኢአደመት፡ በቅድሜሁ፡ ወአስተብቍዓ፡ እምኀበ፡ ኤላም፡ ወአሱር፡ ወአርፋክስድ፡ እምኀበ፡ አኀወ፡ ብእሲቱ፡ ወኀደረ፡

    36. ውስተ፡ ምድረ፡ ሜድቂን፡ ቅሩበ፡ ኀበ፡ አኀወ፡ ብእሲቱ፡ እስከ፡ ዛቲ፡ ዕለት። ወሰመየ፡ ምገባሪሁ፡ ወምገባረ፡ ውሉዱ፡ ሜዲቂን፡ እስመ፡ ማዳይ፡ አቡሆሙ።'
