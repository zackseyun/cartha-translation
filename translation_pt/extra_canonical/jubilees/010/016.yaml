  text: E ele foi sepultado em Lubar, um monte na terra de Ararate. Ao todo, viveu novecentos e cinquenta anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተቀብረ
  choice: foi sepultado
  rationale: Reproduz de modo natural e digno o passivo do verbo ge'ez referente ao sepultamento.
- source_word: ሉባር፡ ደብር
  choice: Lubar, um monte
  rationale: Mantém Lubar como nome próprio e traduz ደብር como “monte”, sem identificar indevidamente Lubar com outro lugar.
- source_word: በምድረ፡ አራራት
  choice: na terra de Ararate
  rationale: Equivalência direta da expressão geográfica, com a forma portuguesa consagrada “Ararate”.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ
  choice: Ao todo, viveu novecentos e cinquenta anos
  rationale: Expressa em português corrente a construção idiomática “completou novecentos e cinquenta anos em sua vida”, preservando o total da duração da vida.
