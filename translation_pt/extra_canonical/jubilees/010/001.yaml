lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: lugar de julgamento
  rationale: Traduz literalmente a expressão nominal fragmentária, sem acrescentar um verbo ausente no texto ge'ez.
- source_word: ንምሀር፡ ለኖኅ
  choice: Ensinemos a Noé
  rationale: O cohortativo de primeira pessoa do plural é expresso naturalmente em português por “Ensinemos”.
- source_word: ኵሎ፡ ፈውሶሙ
  choice: todos os remédios deles
  rationale: Preserva tanto a ideia de meios de cura quanto o sufixo possessivo plural presente no ge'ez.
theological_decisions:
- issue: Identidade daquele que fala e referente de “deles”
  choice: um de nós; remédios deles
  alternative: identificar explicitamente seres ou enfermidades
  rationale: O trecho fornecido não explicita os referentes; a tradução conserva essa ambiguidade para que seja resolvida pelo contexto imediato.
translation_notes:
  register: Português moderno, claro e digno. Mantém-se deliberadamente o início fragmentário “lugar de julgamento”, pois o ge'ez não contém verbo nessa expressão. As reticências assinalam que a oração introduzida por “porque” continua no versículo seguinte.
