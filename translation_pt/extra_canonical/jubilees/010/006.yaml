base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/006.yaml
  text: And you know how your Watchers, the fathers of these spirits, acted in my days. As for these spirits that are living, imprison them and hold them fast in the place of judgment, and do not let them bring corruption upon the sons of your servant, O my God, for these are malignant and were created in order to destroy.
translation:
  language: pt
  text: E tu sabes como agiram, nos meus dias, os teus Vigilantes, os pais desses espíritos. Quanto aos espíritos que vivem, aprisiona-os e mantém-nos firmemente presos no lugar do julgamento. Não permitas que tragam corrupção sobre os filhos do teu servo, ó meu Deus,[a] pois eles são malignos e foram criados para destruir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os filhos do teu servo, meu Deus, pois”.'
    reason: Registra a possibilidade de pontuação sem o vocativo explicitado por “ó”, preservando a ambiguidade formal da sequência.
lexical_decisions:
