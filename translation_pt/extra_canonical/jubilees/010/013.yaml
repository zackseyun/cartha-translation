  yaml_path: translation/extra_canonical/jubilees/010/013.yaml
  text: And we told Noah all their medicines, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies, and the spirits were restrained.
translation:
  language: pt
  text: E contamos a Noé todos os remédios deles, para que fossem curados pelas plantas da terra. Noé escreveu num livro tudo o que lhe havíamos ensinado, todas as espécies de remédios para a cura, e os espíritos foram contidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዕፀወ፡ ምድር
  choice: pelas plantas da terra
  rationale: Reproduz de modo natural a referência aos vegetais ou plantas terrestres usados como meios de cura, sem restringi-la indevidamente a ervas.
- source_word: ፈውሳት
  choice: remédios para a cura
  rationale: Expressa o campo semântico de meios ou preparados curativos em português corrente e evita a formulação menos natural «curas».
- source_word: ወተዐጸዉ፡ መናፍስት
  choice: e os espíritos foram contidos
  rationale: Mantém a voz passiva e não acrescenta «maus» nem um complemento ausente no texto fornecido.
theological_decisions:
- issue: Identidade e ação dos espíritos
  choice: os espíritos foram contidos
  alternative: os espíritos malignos foram impedidos de seguir os filhos de Noé
  rationale: 'A tradução conserva somente o que aparece neste verso da fonte: «espíritos» e sua contenção. Não incorpora qualificações ou complementos provenientes do contexto ou de outra tradição textual.'
- issue: Referente de «deles» e de «fossem curados»
  choice: preservar os pronomes sem explicitar o referente
  alternative: explicitar como pessoas afligidas ou filhos de Noé
  rationale: O verso isolado depende do contexto anterior; explicitar o referente resolveria uma ambiguidade que a redação fornecida mantém.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe acompanha de perto a progressão do ge'ez sem soar excessivamente literal.
