lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ
  choice: um vento impetuoso
  rationale: A expressão significa literalmente um vento grande ou forte; «impetuoso» comunica naturalmente sua grande força no contexto.
- source_word: ማኅፈድ
  choice: a torre
  rationale: No contexto da narrativa de Babel, o substantivo designa a torre, não um armazém.
- source_word: ወገፍታአ
  choice: derrubou-a
  rationale: O verbo exprime a queda ou derrubada da torre, retomada pelo pronome feminino «a».
- source_word: ውስተ፡ ምድር
  choice: por terra
  rationale: Expressão portuguesa idiomática que preserva a ideia de fazer a torre cair ao chão.
- source_word: ወናሁ
  choice: e eis que
  rationale: Mantém a fórmula deíctica do texto e sua ligação sintática com a continuação da narrativa.
