  text: In rebellion you have dwelt, and in rebellion your children will fall, and you will be uprooted forever. Do not dwell.
translation:
  language: pt
  text: Vocês viveram em rebelião[a], e seus filhos cairão em rebelião; vocês serão desenraizados para sempre. Não habite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Em sua morada vocês habitarão, e em sua morada seus filhos cairão para sempre.»'
    reason: Preserva a leitura alternativa de «morada/habitar» registrada no audit trail inglês para a expressão repetida, sem substituí-la pela leitura principal de «rebelião».
lexical_decisions:
- source_word: በሀከከ
  choice: na rebelião
  rationale: O termo repetido é entendido aqui como “rebelião” ou “sedição”, conforme a revisão lexical mais recente, e não como “morada”.
- source_word: ኀደርክሙ
  choice: vocês viveram
  rationale: Preserva o valor perfectivo do verbo e o sujeito plural indicado pela forma ge'ez.
- source_word: ይወድቁ
  choice: cairão
  rationale: Verte diretamente a ideia de queda futura dos filhos.
- source_word: ወትሴር
  choice: e vocês serão arrancados
  rationale: Expressa a erradicação ou desenraizamento, sem omitir o verbo como ocorreu em uma redação anterior.
- source_word: ኢትኅደር
  choice: Não permaneçam
  rationale: Mantém a proibição final e o sujeito plural; “permanecer” é natural no contexto e conserva o campo semântico de habitar ou ficar.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e claro, com tratamento plural por “vocês”. A repetição de “na rebelião” foi preservada por corresponder à repetição enfática do original. O ponto e vírgula distingue a queda dos filhos da erradicação dos destinatários.
