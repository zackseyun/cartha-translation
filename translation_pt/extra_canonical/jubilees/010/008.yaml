  verdict: revise
  source_fidelity: A construção ge'ez subjacente e o contexto imediato distinguem a ordem dada pelo Senhor da execução pelos seres celestes. O sentido do rascunho é correto, mas «mandou amarrar» pode ser lido em português como uma ordem dirigida a agentes não identificados, sem explicitar o «nos» do texto.
  naturalness: «E o Senhor, nosso Deus, ordenou-nos que amarrássemos todos eles» é português moderno, claro e de registro apropriado. A forma verbal evita uma ambiguidade de agente presente em «nos mandou amarrar».
  terminology: «Senhor, nosso Deus» preserva adequadamente o título divino. «Amarrássemos» mantém a imagem concreta de vincular/restringir, sem introduzir interpretação sobre a natureza dos referentes.
