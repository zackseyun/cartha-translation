  text: And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.
translation:
  language: pt
  text: E eles começaram a construir. Na quarta semana, fizeram tijolos no fogo; os tijolos lhes serviram de pedra, e o barro com que os revestiam era asfalto, que sai do mar e das nascentes de água na terra de Sinar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሕንጹ
  choice: construir
  rationale: Verbo corrente e abrangente, adequado ao início da obra sem especificar além do texto.
- source_word: ንንፈሱ፡ በእሳት
  choice: fizeram tijolos no fogo
  rationale: Reproduz o processo de fabricação por queima indicado pelo ge'ez e evita a expressão menos natural 'queimaram tijolos'.
- source_word: ከመ፡ እብን
  choice: serviram de pedra
  rationale: Expressa naturalmente a função dos tijolos como substitutos da pedra.
- source_word: ፀቡር
  choice: argamassa
  rationale: No contexto construtivo, designa o material aplicado entre ou sobre os tijolos; 'argamassa' comunica melhor essa função do que o genérico 'barro'.
- source_word: አስፋሌጦስ
  choice: asfalto
  rationale: Correspondência direta do termo, aqui referente ao betume natural usado na construção.
- source_word: አንቅዐተ
  choice: nascentes de água
  rationale: Mantém o sentido de fontes ou nascentes presente no texto e esclarece em português atual.
- source_word: ሱባዔ፡ ራብዕ
  choice: quarta semana
  rationale: Preserva literalmente a unidade cronológica do texto de Jubileus.
- source_word: ሰናዖር (contexto preservado na tradição textual da cláusula final)
  choice: Sinar
  rationale: Forma portuguesa bíblica consagrada para a região; o complemento aparece na continuação textual atestada e na camada inglesa auditada.
