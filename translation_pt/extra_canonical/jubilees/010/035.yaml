  text: That land was named Canaan. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea[35], and it did not please him, and he asked from Elam and Asshur and Arpachshad, the brothers of his wife, a portion, and he dwelt there.
translation:
  language: pt
  text: Aquela terra recebeu o nome de Canaã. Jafé e seus filhos foram em direção ao mar e habitaram na terra que lhes coube. Madai viu a terra junto ao mar[a], mas ela não lhe agradou. Então pediu uma porção a Elão, Assur e Arfaxade, irmãos de sua esposa, e habitou ali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a terra do mar”. A construção ge’ez da frase seguinte é pouco fluente; o texto apresenta Elão, Assur e Arfaxade coletivamente como irmãos da esposa de Madai e como aqueles a quem ele pediu uma porção.
    reason: Esclarece a expressão geográfica literal e preserva a dificuldade sintática do texto-fonte sem reduzi-la ao singular.
lexical_decisions:
- source_word: ተሰምየት፡ ይእቲ፡ ምድር፡ ከናአን
  choice: Aquela terra recebeu o nome de Canaã
  rationale: Reproduz a construção passiva e o demonstrativo do ge’ez em português natural.
- source_word: ምድረ፡ መክፈልቶሙ
  choice: a terra que lhes coube
  rationale: Expressa de modo claro a terra pertencente à porção ou divisão atribuída a eles.
- source_word: ምድረ፡ ባሕር
  choice: a terra junto ao mar
  rationale: A expressão literalmente significa «terra do mar»; «junto ao mar» comunica naturalmente a localização sem impor uma identificação geográfica específica.
- source_word: ወኢአደመት፡ በቅድሜሁ
  choice: mas ela não lhe agradou
  rationale: Conserva o sentido idiomático de que a terra não foi agradável aos olhos de Madai.
- source_word: አኀወ፡ ብእሲቱ
  choice: irmãos de sua esposa
  rationale: አኀወ é plural e vincula coletivamente Elão, Assur e Arfaxade à esposa de Madai.
