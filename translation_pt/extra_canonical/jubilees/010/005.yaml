  yaml_path: translation/extra_canonical/jubilees/010/005.yaml
  text: But bless me and my sons, that we may increase and multiply and fill the earth.
translation:
  language: pt
  text: Mas abençoa-me e aos meus filhos, para que cresçamos, nos multipliquemos e enchamos a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: blessing petition (corresponding to “bless”)
  choice: abençoa
  rationale: Preserva a forma direta da súplica dirigida a Deus e o sentido religioso de conceder favor e fecundidade.
- source_word: increase
  choice: cresçamos
  rationale: Expressa de modo natural o aumento da família e de sua descendência.
- source_word: multiply
  choice: nos multipliquemos
  rationale: Mantém o verbo tradicional da linguagem de fecundidade e expansão humana.
- source_word: fill
  choice: enchamos
