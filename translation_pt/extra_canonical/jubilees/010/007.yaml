  text: And let them not rule over the spirits of the living, for you alone know their judgment; and do not let them have power over the sons of the righteous from now and forevermore.”
translation:
  language: pt
  text: E que eles não dominem os espíritos dos vivos, pois somente tu conheces o julgamento deles; e não permitas que tenham poder sobre os filhos dos justos, desde agora e para sempre.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናፍስት / “spirits” (atestação contextual)
  choice: espíritos
  rationale: Mantém a referência explícita a seres espirituais e evita identificar de modo mais específico aquilo que o texto deixa implícito.
- source_word: “rule over” (camada auditada; trecho etíope do versículo não está integralmente visível no recorte fornecido)
  choice: dominem sobre
  rationale: Expressa governo ou controle, preservando a força do pedido negativo.
