base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/011.yaml
  text: 'He knew that they were not walking in uprightness and were not striving in righteousness. And we acted according to all his word: all the evil ones that were cruel we bound in the place of judgment, and a tenth of them'
translation:
  language: pt
  text: 'Ele sabia[a] que eles não andavam com retidão nem lutavam pela justiça. E fizemos conforme tudo o que ele disse: prendemos no lugar do juízo todos os malignos que agiam com crueldade, e a décima parte deles'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início deste versículo em etíope é difícil. A primeira expressão também pode ser entendida em termos de força ou firmeza, e a segunda, como contender ou esforçar-se com justiça. A frase termina no meio da oração e continua no versículo seguinte.
    reason: Registra a incerteza lexical genuína nas expressões iniciais e a continuidade sintática, sem inserir no texto palavras pertencentes ao versículo anterior.
lexical_decisions:
- source_word: ያአምር
  choice: Ele sabia
  rationale: Representa diretamente o verbo na terceira pessoa masculina singular e não importa para este versículo a oração do versículo anterior.
- source_word: በርቱዕ
  choice: com retidão
  rationale: O termo é difícil neste contexto e pode envolver força, firmeza ou condição correta; 'com retidão' preserva o paralelismo ético com a oração seguinte sem o tornar excessivamente literal.
- source_word: በጽድቅ
  choice: pela justiça
  rationale: Traduz o campo semântico de justiça/retidão e mantém a distinção verbal em relação à primeira oração.
- source_word: ይትባአሱ
  choice: lutavam
  rationale: Expressa a ideia de contender ou esforçar-se, em português natural.
- source_word: እኩያነ
  choice: os malignos
  rationale: Designa os seres maus no contexto, sem especificar uma categoria demonológica além do texto.
- source_word: ይጸውጉ
  choice: agiam com crueldade
  rationale: Comunica o sentido de crueldade ou ferocidade atribuído aos seres maus.
- source_word: መካነ፡ ደይን
  choice: lugar do juízo
  rationale: Tradução formal e inteligível da expressão locativa judicial.
- source_word: ወዓሥራተሙ
  choice: e a décima parte deles
  rationale: Conserva a cláusula final incompleta, que continua no versículo seguinte, sem antecipar seu conteúdo.
theological_decisions:
- issue: Identidade dos seres malignos
  choice: os malignos
  alternative: os espíritos malignos
  rationale: O contexto trata de espíritos, mas o substantivo explícito deste trecho é mais geral; a tradução evita acrescentar uma identificação ausente da formulação local.
- issue: Sentido ético das duas orações iniciais
  choice: não andavam com retidão nem lutavam pela justiça
  alternative: não procediam com força nem contendiam com justiça
  rationale: A redação escolhida acompanha o sentido contextual provável, mas a nota reconhece a dificuldade e as alternativas lexicais legítimas.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário bíblico moderado. Mantém o paralelismo e a oração final incompleta do texto-fonte; o marcador de nota aparece no texto principal.
