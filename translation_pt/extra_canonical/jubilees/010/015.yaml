  text: For he loved him more than all his sons. And Noah slept with his fathers.
translation:
  language: pt
  text: Pois ele o amava mais do que todos os seus filhos. E Noé dormiu com seus antepassados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪያሁ
  choice: o
  rationale: Pronome acusativo masculino singular, literalmente “o/ele”; preserva a referência pronominal do texto ge'ez sem inserir um nome que não aparece no versículo.
- source_word: ያፈቅር
  choice: amava
  rationale: Expressa de modo natural em português a ação afetiva no contexto narrativo passado.
- source_word: ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  choice: mais do que todos os seus filhos
  rationale: Reproduz a comparação intensiva do ge'ez de forma clara e corrente.
- source_word: ኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  choice: Noé dormiu com seus pais
  rationale: Mantém o eufemismo tradicional de morte e a formulação coletiva do original, sem acrescentar informações ausentes.
theological_decisions:
- issue: Identidade do referente de ኪያሁ (“o”)
  choice: Manter o pronome “o”
  alternative: Explicitar “Sem” ou “Arfaxade”
  rationale: O versículo traz um pronome, não um nome. A tradução preserva a dependência do contexto e evita resolver silenciosamente uma referência que o texto desta unidade não explicita.
- issue: Eufemismo funerário
  choice: “dormiu com seus pais”
  alternative: “morreu”
  rationale: A expressão figurada é inteligível em português bíblico e conserva a forma e a tensão teológica do original.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve cadência bíblica. A referência pronominal foi deliberadamente preservada; não se adotou a nota inglesa anterior sobre Arfaxade, pois ela não corresponde à forma pronominal do ge'ez.
