base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/017.yaml
  text: nineteen jubilees and two weeks of years and five years. And during his life on the earth he surpassed the sons of men[17], except Enoch, because of the righteousness in which he was perfect. For Enoch was appointed as a testimony for the generations of the world, to recount all the deeds of generation after generation until the day of judgment.
translation:
  language: pt
  text: dezenove jubileus, duas semanas de anos e cinco anos. Durante sua vida na terra, ele superou os filhos dos homens[a], com exceção de Enoque, por causa da justiça na qual era perfeito. Pois Enoque foi constituído como testemunho para as gerações do mundo, a fim de relatar todos os feitos de geração em geração até o dia do juízo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase a respeito de Enoque é textualmente densa. Uma possível leitura é que Noé viveu mais do que todos os outros seres humanos, exceto Enoque; Enoque, por sua vez, recebeu a função singular de servir de testemunho às gerações até o dia do juízo.
    reason: alternative_reading
lexical_decisions:
- source_word: አፈድፈደ፡ ሐዩዎ
  choice: durante sua vida... superou
  rationale: Reproduz a ideia comparativa do texto ge'ez sem explicitar no corpo do versículo em que sentido houve superioridade; a possível referência à longevidade é indicada na nota.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Mantém a expressão semítica tradicional e inteligível, referente aos seres humanos.
- source_word: ስምዕ
  choice: testemunho
  rationale: O termo ge'ez designa testemunho ou testemunha; 'testemunho' preserva a formulação do texto e se harmoniza com a função de Enoque de relatar os feitos das gerações.
- source_word: ይንገር፡ ኵሎ፡ ግብረ
  choice: relatar todos os feitos
  rationale: Expressa naturalmente a ação de contar ou declarar as obras realizadas pelas sucessivas gerações.
- source_word: ጽድቅ
  choice: justiça
  rationale: Equivalente corrente e teologicamente não restritivo para a qualidade moral indicada pelo original.
theological_decisions:
- issue: Relação entre a superioridade do personagem, Enoque e a justiça perfeita
  choice: 'Manter a sequência sintática: ''superou... com exceção de Enoque, por causa da justiça na qual se tornou perfeito'''
  alternative: Explicitar que Noé superou os demais especificamente em longevidade e separar a justiça como motivo de sua distinção
  rationale: A passagem é textualmente densa, e a formulação escolhida preserva a tensão e a ambiguidade do original em vez de impor uma interpretação única.
- issue: Função de Enoque para as gerações
  choice: Enoque foi constituído como testemunho
  alternative: Enoque foi constituído como sinal
  rationale: O valor lexical de ስምዕ é 'testemunho/testemunha', não 'sinal'; a escolha evita importar uma categoria diferente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservam-se a expressão bíblica 'filhos dos homens' e a ambiguidade real da construção; a nota esclarece a principal leitura possível sem inseri-la como certeza no texto.
