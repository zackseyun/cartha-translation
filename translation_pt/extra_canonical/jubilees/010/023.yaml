  text: And the Lord went down, and we went down with him, to see the city and the tower that the sons of men had built. And he confused all their tongues, and they no longer heard one another’s speech, and they ceased building the city and the tower. Therefore the whole land of Shinar was called Babel, because there the Lord confused all the tongues of the sons of men, and from there they were scattered into their cities, each according to his tongue and according to his nation.
translation:
  language: pt
  text: E o Senhor desceu, e nós descemos com ele, para ver a cidade e a torre que os filhos dos homens haviam construído. Então ele confundiu todas as línguas deles, de modo que já não entendiam a fala uns dos outros; e assim deixaram de construir a cidade e a torre. Por isso, toda a terra de Sinar recebeu o nome de Babel, porque ali o Senhor confundiu todas as línguas dos filhos dos homens. E dali eles foram dispersos para as suas terras[a], cada qual segundo a sua língua e o seu povo.
  philosophy: optimal-equivalence
