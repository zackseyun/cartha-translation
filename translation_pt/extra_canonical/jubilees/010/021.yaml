base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/021.yaml
  text: And they built it for forty-three years. Its breadth was 204 cubits[21], and the height of a brick was one third of one cubit; and its height amounted to 5,433 cubits and 2 palms, and twelve stades.
translation:
  language: pt
  text: E eles a construíram durante quarenta e três anos. Sua largura era de 204 côvados,[a] e a altura de um tijolo era de um terço de côvado; sua altura chegou a 5.433 côvados e dois palmos, e doze estádios.
  philosophy: optimal-equivalence
