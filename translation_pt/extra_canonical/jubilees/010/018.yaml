base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/018.yaml
  text: And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the counsel of wickedness to build for themselves a city and a tower in the land of Shinar.”
translation:
  language: pt
  text: 'E, no trigésimo terceiro jubileu, no primeiro ano da segunda semana, Pelegue tomou para si uma mulher chamada Lomna, filha de Sinar. No quarto ano dessa semana, ela deu-lhe à luz um filho. E ele lhe deu o nome de Reú, pois disse: “Eis que os filhos dos homens se tornaram maus pelo perverso conselho de construir para si uma cidade e uma torre na terra de Sinar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፋሌክ
  choice: Pelegue
  rationale: Forma portuguesa consagrada do nome bíblico, reconhecível e adequada ao registro.
- source_word: ሎምና
  choice: Lomna
  rationale: Transliteração direta do nome ge'ez, sem forma portuguesa tradicional estabelecida.
- source_word: ሲናአር
  choice: Sinar
  rationale: Forma tradicional em português para o topônimo bíblico Shinar.
- source_word: ራገው
  choice: Reú
  rationale: Forma portuguesa bíblica corrente do nome Reu.
- source_word: ውሉደ፡ ሰብእ
  choice: os filhos dos homens
  rationale: Preserva a expressão coletiva e sua correspondência formal com o ge'ez.
- source_word: በምክረ፡ ዐግ
  choice: pelo conselho da maldade
  rationale: Mantém a construção nominal do texto, sem reduzi-la a simples intenção ou propósito.
- source_word: ሀገረ፡ ወማኅፈደ
  choice: uma cidade e uma torre
  rationale: Equivalência contextual clara para as duas construções associadas ao relato de Babel.
- source_word: ውስተ፡ ምድረ
  choice: na terra de Sinar
  rationale: O estado construto de ምድረ exige um complemento; 'Sinar', provavelmente deslocado pelo recorte do versículo, é confirmado pelo contexto imediato.
theological_decisions:
- issue: Relação entre o conselho da maldade e o ato de construir
  choice: “pelo conselho da maldade de construir”
  alternative: “pelo conselho da maldade, para construir”
  rationale: Sem vírgula, a construção expressa que o conselho perverso consistia em edificar a cidade e a torre, evitando sugerir que tornar-se mau tinha a construção como finalidade.
- issue: Complemento de “terra” no fim do versículo
  choice: “na terra de Sinar”
  alternative: “na terra”
  rationale: Embora o recorte fornecido termine em ምድረ, a forma construta requer um genitivo; o contexto e a provável continuação além da divisão do versículo sustentam “de Sinar”.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantêm-se as fórmulas cronológicas próprias de Jubileus e o tom solene de “Eis que”, evitando arcaísmos desnecessários.
