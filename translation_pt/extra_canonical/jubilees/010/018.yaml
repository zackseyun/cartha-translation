  to: 'E, no trigésimo terceiro jubileu, no primeiro ano da segunda semana, Pelegue tomou para si uma mulher chamada Lomna, filha de Sinar. No quarto ano dessa semana, ela deu-lhe à luz um filho. E ele lhe deu o nome de Reú, pois disse: “Eis que os filhos dos homens se tornaram maus pelo perverso conselho de construir para si uma cidade e uma torre na terra de Sinar.”'
