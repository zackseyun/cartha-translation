  text: And he prayed before the Lord his God, and said, “God of the spirits of all flesh, who have shown mercy to me and saved me and my sons from the waters of the flood, and have not caused me to perish as you caused the sons of perdition to perish—
translation:
  language: pt
  text: 'E ele orou diante do Senhor, seu Deus, e disse: “Deus dos espíritos de toda carne, tu que tiveste misericórdia de mim, salvaste a mim e a meus filhos das águas do dilúvio e não deixaste que eu perecesse como fizeste perecer os filhos da perdição—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: God of the spirits of all flesh
  choice: Deus dos espíritos de toda carne
  rationale: Mantém a fórmula solene e sua abrangência, sem explicar se “espíritos” se refere à vida, aos seres humanos ou aos seres espirituais.
