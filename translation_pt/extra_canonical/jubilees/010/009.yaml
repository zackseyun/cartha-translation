theological_decisions:
- issue: Relação de Mastema com os espíritos retidos
  choice: “deixa que alguns deles permaneçam diante de mim” e “sejam deixados comigo”
  alternative: “sob meu domínio”
  rationale: Evita explicitar um domínio que está implícito, mas não formulado diretamente, preservando a petição e a relação ambígua do personagem com esses espíritos.
- issue: Expressão temporal ou judicial ligada à corrupção e ao desvio
  choice: “antes do meu julgamento”
  alternative: “segundo o meu juízo”
  rationale: Mantém a leitura temporal atestada na camada de consulta e não resolve silenciosamente a formulação difícil em uma interpretação causal ou normativa.
