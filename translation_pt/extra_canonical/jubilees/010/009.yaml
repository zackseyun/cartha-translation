  text: And the chief of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me, I will not be able to exercise the authority of my will over the sons of men. For these are for corruption and for leading astray before my judgment, because the wickedness of the sons of men is great.”
translation:
  language: pt
  text: 'Então Mastema, o chefe dos espíritos, veio e disse: “Senhor, Criador, deixa que alguns deles permaneçam diante de mim; que escutem a minha voz e façam tudo o que eu lhes disser. Pois, se alguns deles não forem deixados comigo, não poderei exercer sobre os filhos dos homens a autoridade da minha vontade. Eles servem para corromper e desencaminhar antes do meu julgamento, pois é grande a maldade dos filhos dos homens.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastêmâ
  choice: Mastema
