  - severity: low
    issue: Variação desnecessária na tradução da expressão repetida relativa à rebelião.
    rationale: O rascunho usa “por causa da rebelião” uma vez e “por rebelião” nas ocorrências seguintes. A uniformidade conserva a repetição retórica e a relação textual entre as cláusulas.
