  verdict: revise
  source_fidelity: 'A tradução transmite o conteúdo do texto ge''ez e preserva adequadamente imagens importantes: a terra que não lhe coube por sorte, a queda, a maldição, a rebelião e o arrancamento definitivo. A sequência final, embora o excerto ge''ez fornecido termine truncado, corresponde ao restante atestado no trilho de auditoria inglês. Convém, porém, manter a repetição causal de በሀከከ de modo mais direto e uniforme como “por rebelião”.'
  naturalness: A construção inicial do rascunho — “Cam, seu pai, e Cuxe e Mizraim, seus irmãos” — é sintaticamente ambígua em português, pois os possessivos podem parecer referir-se a Cam, Cuxe ou Mizraim. A ordem “Seu pai, Cam, e seus irmãos, Cuxe e Mizraim” identifica naturalmente os parentes do destinatário e conserva o sentido.
  terminology: Cam, Cuxe e Mizraim são formas portuguesas correntes. “Terra”, “sorteio”, “amaldiçoados”, “rebelião” e “arrancado” preservam o registro solene sem artificialidade. “Por rebelião” reproduz melhor a repetição enfática do original e do audit trail do que a alternância com “por causa da rebelião”.
