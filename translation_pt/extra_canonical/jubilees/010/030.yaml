  yaml_path: translation/extra_canonical/jubilees/010/030.yaml
  text: 'And Ham his father, and Cush and Mizraim his brothers, said to him: ''Because you have settled in a land which is not yours, and which did not fall to you by lot, do not do so; for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'''
translation:
  language: pt
  text: 'Seu pai, Cam, e seus irmãos, Cuxe e Mizraim, lhe disseram: “Você se estabeleceu numa terra que não é sua e que não lhe coube por sorteio. Não faça isso, pois, se o fizer, você e seus filhos cairão nessa terra e serão amaldiçoados por rebelião. Foi por rebelião que você se estabeleceu nela, e por rebelião seus filhos cairão, e você será arrancado para sempre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደርከ
  choice: você se estabeleceu
  rationale: O verbo expressa habitar ou fixar residência; “estabeleceu-se” comunica naturalmente a ocupação duradoura da terra.
- source_word: በዕፁ
  choice: por sorteio
  rationale: Mantém a imagem concreta da distribuição territorial mediante sortes.
- source_word: ትወድቁ
  choice: cairão
  rationale: Preserva a metáfora e sua possível amplitude sem reduzi-la silenciosamente a “morrerão” ou “serão derrotados”.
- source_word: በሀከከ
  choice: por causa da rebelião
  rationale: Expressa a ideia de transgressão ou ação rebelde associada à ocupação indevida, sem acrescentar uma interpretação denominacional.
theological_decisions:
- issue: Natureza da maldição e da queda
  choice: Manter “cairão” e “serão amaldiçoados” como afirmações distintas
  alternative: Interpretar a queda como morte, derrota ou expulsão
  rationale: O texto sustenta imagens sobrepostas e não exige que a natureza exata da queda seja definida.
- issue: Agência na ocupação da terra
  choice: Traduzir como “por rebelião”
  alternative: “em sua rebelião” ou “por causa da sua rebelião”
  rationale: A formulação preserva a repetição enfática e evita tornar explícita uma relação possessiva que não precisa ser resolvida no corpo do texto.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para a interpelação singular e conserva a repetição retórica de “rebelião”. Os nomes próprios seguem formas correntes em português: Cam, Cuxe e Mizraim.'
