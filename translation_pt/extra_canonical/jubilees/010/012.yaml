  text: We left them so that they might be subject before Satan on the earth. And the remedy for all their diseases...
translation:
  language: pt
  text: Nós os deixamos para que ficassem sujeitos diante de Satanás na terra. E a cura de todas as suas doenças...
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አተርፍነ
  choice: Nós os deixamos
  rationale: O verbo está na primeira pessoa do plural e, neste trecho, não expressa por si só a quantidade; por isso, não se acrescenta «um décimo» ao texto principal.
- source_word: ይትኰነኑ
  choice: ficassem sujeitos
  rationale: Expressa submissão ou sujeição; esta formulação preserva o sentido sem especificar indevidamente a natureza dessa sujeição.
- source_word: ቅድመ፡ ሰይጣን
  choice: diante de Satanás
  rationale: Reproduz de modo formal e natural a relação indicada por ቅድመ, sem substituí-la por «sob o domínio de».
- source_word: ወፈውሰ፡ ደዌሆሙ፡ ኵሎ
  choice: E o remédio para todas as doenças deles...
  rationale: ፈውስ é entendido aqui como substantivo, «remédio/cura», e não como verbo na primeira pessoa do plural. Como o excerto termina numa oração incompleta, as reticências preservam o caráter fragmentário.
theological_decisions:
- issue: Relação dos espíritos com Satanás
  choice: sujeitos diante de Satanás
  alternative: submetidos a Satanás
  rationale: A opção escolhida conserva a preposição «diante de» do texto fornecido e evita tornar mais explícita uma relação de domínio que a formulação pode deixar em tensão.
- issue: Quantidade dos seres deixados
  choice: os deixamos
  alternative: deixamos um décimo deles
  rationale: Embora «um décimo» seja recuperável pelo contexto anterior, essa expressão não aparece no segmento ge'ez fornecido e, portanto, não é inserida neste versículo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. Mantém-se a oração nominal incompleta no fim, pois o texto-fonte fornecido está truncado.
