lexical_decisions:
- source_word: በቅድሜሁ፡ ለመኰንን፡ ቅዱስ፡
  choice: diante do príncipe santo
  rationale: O sufixo pronominal em በቅድሜሁ funciona de modo proléptico, antecipando o substantivo introduzido por ለ; por isso, não se duplica o referente como “diante dele, diante do príncipe santo”.
- source_word: ኖኅ፡ አቡነ
  choice: Noé, nosso pai
  rationale: Reproduz diretamente o nome próprio e a expressão relacional do ge'ez.
- source_word: ወኢሰምዖሙ፡
  choice: Mas ele não lhes deu ouvidos
  rationale: Embora ወ seja normalmente aditivo, o contexto permite valor adversativo; “não lhes deu ouvidos” expressa em português natural o sentido idiomático de não escutar ou atender.
- source_word: ወኀደረ፡ ምድረ፡
  choice: e habitou na terra
  rationale: Mantém a declaração simples do texto fornecido, sem acrescentar delimitações geográficas ausentes deste segmento.
