  text: for your grace has been great toward me, and great is your mercy toward my life—let your grace be magnified over my sons, and do not let wicked spirits rule over them, lest they destroy them from the earth.
translation:
  language: pt
  text: Pois a tua graça tem sido grande para mim, e grande é a tua misericórdia para com a minha vida. Que a tua graça seja engrandecida[a] sobre meus filhos, e não permitas que os espíritos malignos tenham domínio sobre eles, para que não os destruam da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seja elevada”.'
    reason: Registra uma tradução alternativa tradicional, embora “seja engrandecida” represente melhor a raiz ligada à ideia de grandeza e sua repetição no contexto.
lexical_decisions:
- source_word: yetʿabay (raiz ʿ-b-y)
  choice: seja engrandecida
