base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/029.yaml
  text: And Canaan saw the land of Lebanon as far as the brook of Egypt, that it was very good, and he did not go into the land of his inheritance to the west of the sea, and he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.
translation:
  language: pt
  text: E Canaã viu que a terra do Líbano, até o ribeiro do Egito, era muito boa, e não foi para a terra de sua herança, a oeste do mar[a], mas habitou na terra do Líbano, desde a fronteira do Jordão, a leste, até a fronteira do mar, a oeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge’ez também pode ser entendida como “em direção ao mar, a oeste”.
    reason: A construção espacial admite mais de uma análise sintática; a nota registra a alternativa sem obscurecer a leitura principal adotada no texto.
lexical_decisions:
- source_word: መሐዘ፡ ግብጽ
  choice: ribeiro do Egito
  rationale: Mantém a designação geográfica tradicional e traduz መሐዘ como um curso d’água menor, em consonância com o contexto bíblico.
- source_word: ሠናይ፡ ይእቲ፡ ጥቀ
  choice: era muito boa
  rationale: Reproduz diretamente o predicado e o intensificador do ge’ez em português natural.
- source_word: ምድረ፡ ርስት
  choice: a terra que lhe cabia por herança
  rationale: Explicita de modo natural que se trata da porção territorial herdada ou atribuída a Canaã, sem acrescentar uma interpretação teológica.
- source_word: ምድረ፡ ሊባኖስ
  choice: terra do Líbano
  rationale: Preserva o nome territorial empregado no texto-fonte.
- source_word: እምእደ፡ ዮርዳኖስ፡ ውእምእደ፡ [ባሕር]
  choice: desde a fronteira do Jordão ... até a fronteira do mar
  rationale: Verte a expressão espacial idiomática como limites territoriais e organiza os pares leste/oeste em português claro.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível, com sintaxe narrativa fluente. O fragmento inicial “em sua porção, na terra do sul” foi tratado como continuação do versículo anterior, conforme a segmentação refletida pela camada inglesa auditada. A cláusula final foi apresentada como uma extensão entre o Jordão, a leste, e o mar, a oeste, preservando os quatro elementos limítrofes do texto.
