revisions:
- from: E Canaã viu que a terra do Líbano, até o ribeiro do Egito, era muito boa. Por isso, não foi para a terra que lhe cabia por herança, a oeste, junto ao mar[a], mas habitou na terra do Líbano, desde a fronteira do Jordão, a leste, até a fronteira do mar, a oeste.
  to: E Canaã viu que a terra do Líbano, até o ribeiro do Egito, era muito boa, e não foi para a terra de sua herança, a oeste do mar[a], mas habitou na terra do Líbano, desde a fronteira do Jordão, a leste, até a fronteira do mar, a oeste.
  rationale: Remove-se a causalidade não expressa por “Por isso” e ajusta-se a expressão relativa ao mar para refletir mais diretamente a leitura principal do ge’ez e da trilha inglesa. Mantêm-se os limites orientais e ocidentais em formulação portuguesa natural.
