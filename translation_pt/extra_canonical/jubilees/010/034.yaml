lexical_decisions:
- source_word: ሊባኖስ
  choice: Líbano
  rationale: Transliteração portuguesa consagrada do topônimo.
- source_word: እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ
  choice: desde Hamate até a entrada do Egito
  rationale: Reproduz diretamente os limites geográficos indicados pelo texto, com formas correntes dos topônimos em português.
- source_word: ውእቱ፡ ወውሉዱ
  choice: ele e seus descendentes
  rationale: O pronome masculino e o sufixo possessivo apontam para um referente pessoal masculino, entendido no contexto como Canaã, e não para a terra.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: até o dia de hoje
  rationale: Expressão temporal idiomática que preserva o sentido literal e solene da fonte.
- source_word: ወበእንተዝ
  choice: E por causa disso,
  rationale: Mantém o conectivo causal e a frase incompleta que prossegue no versículo seguinte.
theological_decisions:
- issue: Referente do pronome masculino e do possessivo
  choice: ele e seus descendentes
  alternative: isso e seus descendentes
  rationale: A morfologia masculina e a referência contextual favorecem uma pessoa, Canaã; atribuir descendentes à terra obscureceria essa relação.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima da fonte. A vírgula final preserva deliberadamente a continuidade sintática para o versículo seguinte.
