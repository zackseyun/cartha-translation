  text: And the Lord sent a mighty wind against the tower, and it threw it down upon the earth.
translation:
  language: pt
  text: E o Senhor enviou um vento forte contra a torre, e ele a derrubou por terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፋሰ፡ ዐቢየ
  choice: um vento forte
  rationale: A expressão ge’ez significa literalmente um vento grande ou poderoso; “forte” é natural em português e preserva a intensidade.
- source_word: ውስተ፡ ማኅፈድ
  choice: contra a torre
  rationale: Neste contexto, ማኅፈድ designa a torre mencionada na narrativa; a preposição é vertida idiomaticamente como “contra” por se tratar de um vento enviado sobre ela.
