  text: Cursed are you, and cursed shall you be beyond all the sons of Noah, by the curse with which we bound ourselves by an oath before the holy judge and before Noah our father.”
translation:
  language: pt
  text: “Maldito és, e maldito serás mais do que todos os filhos de Noé, pela maldição com a qual nos comprometemos por juramento diante do santo Juiz e diante de Noé, nosso pai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርጉም፡ አንተ
  choice: Maldito és
  rationale: Reproduz diretamente a declaração nominal enfática do ge'ez, em linguagem portuguesa digna e clara.
- source_word: ወርጉመ፡ ትከውን
  choice: e maldito serás
  rationale: Preserva o paralelismo e a referência futura da expressão.
- source_word: እምኵሎሙ፡ ውሉደ፡ ኖኅ
  choice: mais do que todos os filhos de Noé
  rationale: Traduz a comparação expressa por እም e mantém a formulação abrangente relativa aos descendentes de Noé.
- source_word: በመርገም
  choice: pela maldição
  rationale: Mantém o substantivo cognato e a relação instrumental ou fundamentadora sem explicá-la em excesso.
- source_word: በመሐላ
  choice: por juramento
  rationale: Expressa de forma natural o meio pelo qual os participantes se comprometeram solenemente.
theological_decisions:
- issue: Título do juiz divino
  choice: santo Juiz
  alternative: Juiz Santo
  rationale: A forma escolhida soa natural em português e preserva o caráter reverente do título sem acrescentar identificação denominacional.
- issue: Força comparativa da maldição
  choice: mais do que todos os filhos de Noé
  alternative: entre todos os filhos de Noé
  rationale: Segue a leitura comparativa refletida pela evidência lexical e pela camada inglesa auditada, sem reduzir a expressão a mera pertença ao grupo.
translation_notes:
  register: Português moderno, solene e acessível. O paralelismo de “Maldito és / maldito serás” foi mantido, assim como a repetição de “diante de”, para conservar a cadência jurídica e cerimonial do enunciado.
