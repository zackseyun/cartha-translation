  text: And he dwelt in the land of Media, near his wife’s brothers, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media, after Madai their father.
translation:
  language: pt
  text: E ele habitou na terra da Média, perto dos irmãos de sua mulher, até o dia de hoje. E chamou de Média sua morada e a morada de seus filhos, por causa de Madai, pai deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ሜድቂን
  choice: terra da Média
  rationale: Expressa naturalmente o topônimo regional indicado pelo texto etíope e preservado pela tradição textual.
- source_word: አኀወ፡ ብእሲቱ
  choice: irmãos de sua mulher
  rationale: Mantém o plural explícito do texto-fonte, sem reduzi-lo a um único irmão.
- source_word: ምገባሪሁ፡ ወምገባረ፡ ውሉዱ
  choice: o lugar onde ele e seus filhos habitavam
  rationale: Reformula de modo natural em português a repetição 'sua morada e a morada de seus filhos', sem perder os dois referentes.
- source_word: እስመ፡ ማዳይ፡ አቡሆሙ
  choice: em homenagem a Madai, pai deles
  rationale: Comunica a relação de nomeação com Madai e mantém a referência plural de 'pai deles'.
