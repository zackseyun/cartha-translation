  yaml_path: translation/extra_canonical/jubilees/010/025.yaml
  text: It is between Asshur and Babylon in the land of Shinar[25]. And they called its name Overthrow.
translation:
  language: pt
  text: Ela fica entre Assur e Babilônia, na terra de Sinear. E deram-lhe o nome de Ruína.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome aqui traduzido como “Ruína” parece recordar a destruição da torre. A forma subjacente na tradição etíope é incerta.
    reason: Registra a incerteza lexical do nome sem enfraquecer o sujeito plural atestado no texto-base.
lexical_decisions:
- source_word: አሱር (ʾAssur)
  choice: Assur
