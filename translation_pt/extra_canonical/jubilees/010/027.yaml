  text: And it was between Asshur and Babylon, in the land of Shinar; and he called its name Overthrow, in the fourth week, in the first year at its beginning, in the thirty-fourth jubilee, they were dispersed.
translation:
  language: pt
  text: E ficava entre Assur e Babilônia, na terra de Sinear. Ele o chamou de Ruína. Na quarta semana, no primeiro ano, no início deste, no trigésimo quarto jubileu, eles foram dispersos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሱር
  choice: Assur
  rationale: Forma tradicional e reconhecível do nome próprio, distinta do nome português do país moderno.
- source_word: ሰናአር
  choice: Sinear
  rationale: Forma bíblica portuguesa tradicional para a região de Shinar.
- source_word: ደቀት
  choice: Ruína
  rationale: O termo ge'ez indica queda, ruína ou destruição; traduzir o sentido do nome é mais informativo do que simplesmente transliterá-lo.
- source_word: ተዘርዉ
  choice: foram dispersos
  rationale: Reproduz o valor passivo plural do verbo e preserva a formulação sem explicitar quem causou a dispersão.
theological_decisions:
- issue: Agente da dispersão
  choice: 'Preservar a voz passiva: “foram dispersos”'
  alternative: “Deus os dispersou”
  rationale: O texto não nomeia o agente nesta oração; explicitá-lo resolveria uma informação que a fonte deixa implícita.
- issue: Referente de “no início dela”
  choice: Manter o pronome feminino, referindo-o naturalmente à quarta semana
  alternative: “no início do primeiro ano”
  rationale: A construção da fonte permite alguma dificuldade sintática; a tradução mantém a relação formal mais próxima sem reformular a cronologia.
translation_notes:
  register: Português atual, digno e acessível, com pontuação ajustada para tornar inteligível a sequência geográfica, a nomeação do lugar e a data cronológica. Não foram mantidas notas de variantes já rejeitadas pela revisão da fonte.
