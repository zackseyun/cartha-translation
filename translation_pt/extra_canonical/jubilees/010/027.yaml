revisions:
- from: E isso aconteceu entre Assur e Babilônia, na terra de Sinear. Ele deu ao lugar o nome de Ruína. Na quarta semana, no primeiro ano, no início dela, no trigésimo quarto jubileu, eles foram dispersos.
  to: E ficava entre Assur e Babilônia, na terra de Sinear. Ele o chamou de Ruína. Na quarta semana, no primeiro ano, no início deste, no trigésimo quarto jubileu, eles foram dispersos.
