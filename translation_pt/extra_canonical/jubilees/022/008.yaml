base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/008.yaml
  text: And now I thank you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, advanced and complete in days, and all my days have been peace.
translation:
  language: pt
  text: E agora eu te agradeço, meu Deus, porque me fizeste ver este dia. Eis que tenho cento e setenta e cinco anos, idoso e pleno de dias, e todos os meus dias foram de paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትኃነይ፡ ለከ፡
  choice: eu te agradeço
  rationale: Expressa de modo natural em português o agradecimento dirigido a Deus, sem a rigidez de uma formulação como “dou graças a ti”.
- source_word: አርአይከኒ፡ ዛተ፡ ዕለተ፡
  choice: me fizeste ver este dia
  rationale: Preserva a construção causativa e a linguagem bíblica segundo a qual Deus permitiu ao falante chegar a este dia.
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕል፡
  choice: avançado e pleno de dias
  rationale: Mantém as duas qualificações do texto, evita repetir “velho” logo após a idade e emprega uma expressão bíblica inteligível para uma vida levada à sua medida completa.
- source_word: ሰላመ።
  choice: de paz
  rationale: Conserva o substantivo “paz” e sua abrangência, sem restringi-lo a tranquilidade, prosperidade ou ausência de conflito.
theological_decisions:
- issue: Atribuição a Deus da chegada a este dia
  choice: me fizeste ver este dia
  alternative: me mostraste este dia
  rationale: A construção escolhida conserva a agência divina e comunica em português que Deus concedeu ao falante viver até esse momento, sem desenvolver uma doutrina além do enunciado.
- issue: Sentido abrangente de paz ao longo da vida
  choice: todos os meus dias foram de paz
  alternative: todos os meus dias transcorreram em paz
  rationale: A formulação mais formal preserva a predicação nominal e não define indevidamente que espécie de paz está em vista.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve cadência bíblica. “Eis que” e “pleno de dias” preservam o registro solene do testemunho sem tornar a frase excessivamente arcaica.
