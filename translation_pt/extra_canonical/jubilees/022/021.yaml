  text: But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.
translation:
  language: pt
  text: E você também, meu filho Jacó, que o Deus Altíssimo o ajude; que o Deus do céu o abençoe e o livre da impureza deles e de todo o erro deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: E também você
  rationale: Reproduz a conjunção e a partícula aditiva, usando tratamento corrente e amplamente compreensível em português.
- source_word: አምላከ፡ ልዑል
  choice: o Deus Altíssimo
  rationale: Mantém o título divino e sua força superlativa em formulação natural e tradicional no português bíblico.
- source_word: ይርዳእከ
  choice: o ajude
  rationale: Expressa diretamente o pedido ou desejo de auxílio dirigido a Jacó.
- source_word: ወያግኅሥከ
  choice: e o afaste
  rationale: Conserva a ideia de retirar ou separar Jacó da condição e do desvio atribuídos aos outros, sem ampliar o sentido.
- source_word: ርእዮሙ
  choice: da impureza deles
  rationale: Segue o valor contextual refletido pela tradição textual consultada, em paralelo com “todo o erro deles”.
- source_word: እምኵሉ፡ ስሕተቶሙ
  choice: de todo o erro deles
  rationale: Preserva o singular coletivo e a atribuição explícita do erro ao grupo mencionado.
theological_decisions:
- issue: Relação entre “Deus Altíssimo” e “Deus do céu”
  choice: Manter as duas designações em sequência como referências ao mesmo Deus
  alternative: Reformular a segunda como uma entidade distinta ou fundir os dois títulos
  rationale: O paralelismo invocativo favorece dois títulos divinos coordenados, sem justificar distinção de seres nem eliminação da repetição.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O paralelismo da bênção foi preservado, e não se acrescentaram explicações denominacionais.
