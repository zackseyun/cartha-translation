base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/004.yaml
  text: And in those days Ishmael came to see his father, and the two of them came together; and Isaac slaughtered a sacrifice as a thank offering and offered it on the altar that his father had made in Hebron.
translation:
  language: pt
  text: Naqueles dias, Ismael veio ver seu pai, e os dois se reuniram. Isaque abateu uma vítima como oferta de gratidão e a ofereceu sobre o altar que seu pai havia feito em Hebrom.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽአ፡ ይስማዔል፡ ይርአይ፡ አባሁ
  choice: Ismael veio ver seu pai
  rationale: Reproduz diretamente o movimento e a finalidade expressos no ge'ez, em português corrente e digno.
- source_word: መጽኡ፡ ክልኤሆሙ፡ ኅቡረ
  choice: os dois se reuniram
  rationale: Mantém a referência relativamente aberta do original aos dois participantes, sem acrescentar nomes que o texto não explicita.
- source_word: ጠብሐ፡ ይስሐቅ፡ መሥዋዕተ
  choice: Isaque abateu um animal em sacrifício
  rationale: O verbo indica o abate sacrificial. A explicitação de 'um animal' evita a expressão pouco natural 'abateu um sacrifício' sem especificar uma espécie não indicada no texto.
- source_word: ለጽንሓሕ
  choice: como oferta de gratidão
  rationale: Expressa a função do sacrifício como oferta de agradecimento, em formulação portuguesa clara e idiomática.
- source_word: አዕረገ፡ ዲበ፡ ምሥዋዕ
  choice: o ofereceu sobre o altar
  rationale: Traduz o ato de fazer subir/oferecer a vítima sobre o altar sem impor terminologia ritual mais específica do que a passagem exige.
- source_word: በኬብሮን
  choice: em Hebrom
  rationale: Emprega a forma bíblica portuguesa tradicional e amplamente reconhecida do topônimo.
theological_decisions:
- issue: Identidade dos dois que se reuniram
  choice: os dois se reuniram
  alternative: Ismael e Isaque se reuniram
  rationale: O original usa apenas 'os dois'; a tradução preserva essa referência sem resolver explicitamente uma possível ambiguidade contextual.
- issue: Natureza da oferta
  choice: oferta de gratidão
  alternative: oferta de ação de graças
  rationale: A opção escolhida comunica o sentido cultual em linguagem ampla e compreensível, sem vinculá-lo a terminologia confessional específica.
translation_notes:
  register: Português moderno, digno e de leitura natural, com construção acessível ao público brasileiro e inteligível internacionalmente. A repetição de 'seu pai' foi mantida porque corresponde ao encadeamento do original; o período foi dividido para melhorar a clareza sem alterar a progressão narrativa.
