  yaml_path: translation/extra_canonical/jubilees/022/030.yaml
  text: And he blessed Jacob and said[30], “My son, in whom with all my heart and all my affection I rejoice, may Your grace and Your mercy rest upon him and upon his seed always.”
translation:
  language: pt
  text: 'E ele abençoou Jacó e disse: “Meu filho, em quem me alegro de todo o coração e com todo o meu afeto, que a tua graça e a tua misericórdia[a] permaneçam sobre ele e sobre a sua descendência para sempre.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação muda de modo abrupto: Abraão passa de falar a Jacó para dirigir-se em segunda pessoa, aparentemente a Deus, e então se refere a Jacó como “ele”. O texto preserva essa mudança de pessoa.'
    reason: textual_variant
lexical_decisions:
- source_word: ይትፈሣሕ፡ ቦቱ፡
  choice: em quem me alegro
  rationale: Preserva o sentido de regozijo expresso pelo verbo e a construção relacional, em português natural.
- source_word: ሣህለከ፡ ወምሕረትከ፡
  choice: a tua graça e a tua misericórdia
  rationale: Os sufixos em -ከ são de segunda pessoa masculina singular; por isso, não devem ser vertidos como “minha”.
- source_word: ነዋኅ፡ ላዕሌሁ፡
  choice: permaneçam sobre ele
  rationale: A formulação comunica a duração prolongada da graça e da misericórdia sobre Jacó sem recorrer a uma expressão portuguesa rígida como “sejam longas sobre ele”.
- source_word: ወላዕለ፡ ዘርኡ፡ ኵሎ፡ መዋዕለ።
  choice: e sobre a sua descendência para sempre
  rationale: “Sua descendência” representa o singular coletivo ዘርኡ; ኵሎ፡ መዋዕለ፡, literalmente “todos os dias”, tem aqui valor temporal contínuo e não significa “toda a sua descendência”.
theological_decisions:
- issue: Mudança de pessoa no interior da bênção
  choice: Manter “tua graça e tua misericórdia” e conservar “sobre ele”
  alternative: Regularizar como “minha graça e minha misericórdia sobre ele” ou “tua graça e tua misericórdia sobre ti”
  rationale: O texto passa de Abraão falando diretamente a Jacó para uma invocação em segunda pessoa, aparentemente dirigida a Deus, enquanto se refere a Jacó na terceira pessoa. A tradução preserva essa tensão gramatical e teológica em vez de corrigi-la silenciosamente.
translation_notes:
  register: Português atual, digno e de leitura ampla, com “descendência” para o singular coletivo e “para sempre” como equivalente idiomático de “todos os dias”. A construção foi mantida como bênção em forma de oração, sem eliminar a irregularidade de pessoa presente no ge’ez.
