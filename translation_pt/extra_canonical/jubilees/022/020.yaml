  yaml_path: translation/extra_canonical/jubilees/022/020.yaml
  text: They have no heart to understand, and their eyes do not see what they have made, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord and my deliverer.’ And they have no heart.
translation:
  language: pt
  text: 'Eles não têm coração para compreender, e seus olhos não veem o que fizeram nem como se desviam quando dizem à madeira: “Você é o meu deus”, e à pedra: “Você é o meu senhor e o meu libertador”. E deram-lhes um coração.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto geʽez apresentado diz literalmente: “E deram-lhes um coração”. A leitura é difícil no contexto; outra leitura, refletida em algumas traduções, é: “E eles não têm coração”.'
    reason: Sinaliza uma provável dificuldade ou corrupção textual sem substituir silenciosamente o texto-fonte fornecido.
lexical_decisions:
- source_word: ልበ፡ ለሐልዮ
  choice: coração para compreender
  rationale: Preserva a imagem antropológica do geʽez, em que o coração é a sede da compreensão, sem substituí-la simplesmente por “entendimento”.
- source_word: ዕፅ
  choice: madeira
  rationale: O termo designa madeira/árvore; “madeira” corresponde melhor ao objeto ao qual se dirige a fala idólatra neste contexto.
- source_word: መባሕሕየ
  choice: meu libertador
  rationale: Expressa a ideia de quem livra ou salva, mantendo o paralelismo com “meu deus” e “meu senhor”.
theological_decisions:
- issue: Atribuição de títulos divinos a ídolos
  choice: Mantiveram-se literalmente “meu deus”, “meu senhor” e “meu libertador” como palavras dos que se desviam.
  alternative: Amenizar os títulos ou explicitar no corpo do texto que são falsos deuses.
  rationale: O contexto já apresenta essas declarações como desvio; acrescentar uma avaliação explícita eliminaria a força retórica do original.
- issue: Cláusula final divergente e difícil
  choice: 'Traduziu-se o texto geʽez apresentado: “E deram-lhes um coração”, com nota textual.'
  alternative: Repetir “E eles não têm coração”, conforme a camada inglesa de consulta e uma provável correção textual.
  rationale: A tradução deve partir da evidência na língua original e não corrigir silenciosamente uma leitura difícil; a nota registra a alternativa contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se a metáfora semítica do coração como sede da compreensão. O tratamento “você” torna natural a fala direta dirigida aos objetos, sem perder solenidade excessiva; a cláusula final foi mantida formalmente por ser textualmente problemática.
