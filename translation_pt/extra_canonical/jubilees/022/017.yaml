  yaml_path: translation/extra_canonical/jubilees/022/017.yaml
  text: And may he renew his covenant with you, that you may be for him a people for an inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.
translation:
  language: pt
  text: E que ele renove sua aliança com você, para que você seja para ele um povo como sua herança por todos os tempos, e para que ele seja Deus para você e sua descendência, em verdade e justiça, durante todos os dias da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳኖ (kidāno)
  choice: a sua aliança
  rationale: Mantém o sentido pactual do termo e o vínculo possessivo com Deus, expresso no texto-fonte.
- source_word: ሕዝበ፡ ለርስት
  choice: um povo como herança
  rationale: Conserva a imagem de um povo destinado a Deus como herança, sem transformá-la apenas na ideia mais genérica de pertencimento.
- source_word: ለኵሉ፡ ዓለማት
  choice: por todos os tempos
  rationale: O plural ዓለማት pode designar eras ou idades; esta formulação natural em português comunica duração abrangente sem impor uma contagem específica de gerações.
- source_word: ዘበሀልወ፡ ወዘበጽድቅ
  choice: em verdade e justiça
  rationale: Reproduz de modo direto os dois substantivos éticos do original, preservando sua relação com o modo como Deus será Deus para o destinatário e sua descendência.
- source_word: በኵሉ፡ መዋዕለ፡ ምድር
  choice: durante todos os dias da terra
  rationale: Mantém a expressão temporal concreta do ge'ez, em vez de substituí-la por uma paráfrase como 'para sempre'.
theological_decisions:
- issue: O povo como herança de Deus
  choice: “para ele um povo como herança”
  alternative: “um povo que lhe pertença”
  rationale: A escolha preserva a metáfora teológica de herança presente no original, sem reduzi-la a mera posse.
- issue: Deus para o destinatário e sua descendência
  choice: “o Deus de você e da sua descendência”
  alternative: “Deus para você e para a sua descendência”
  rationale: A construção escolhida soa mais natural em português e mantém a relação pactual indicada pelo original, sem acrescentar uma fórmula denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O singular do destinatário foi mantido por meio de “você”. Evitou-se “teu/tua” para não misturar sistemas de tratamento. A repetição em “o Deus de você” é deliberadamente clara, embora menos literária, e evita a possível ambiguidade de “seu Deus”.
