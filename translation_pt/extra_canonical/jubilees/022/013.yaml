  yaml_path: translation/extra_canonical/jubilees/022/013.yaml
  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
translation:
  language: pt
  text: 'Então ele se aproximou e o beijou. E disse: “Benditos sejam meu filho Jacó e todos os seus filhos pelo Senhor Altíssimo, por todos os séculos. Que o Senhor lhe dê uma descendência justa e santifique alguns dos seus descendentes[a] no meio de toda a terra. Que as nações o sirvam, e que todos os povos se prostrem diante da sua descendência.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “e, dentre os seus descendentes, santifique”; o objeto de “santifique” fica implícito no original.'
    reason: A preposição tem valor partitivo, mas o verbo é ativo e seu objeto não é expresso separadamente no texto ge'ez; por isso, o texto principal explicita naturalmente «alguns dos seus descendentes».
lexical_decisions:
- source_word: ዘርአ፡ ጽድቅ
  choice: uma descendência justa
  rationale: Preserva a construção ‘semente/descendência de justiça’ em português natural, mantendo o sentido coletivo e moral de ዘርእ.
- source_word: ይትቀነዩ፡ ለከ
  choice: Que as nações o sirvam
  rationale: O verbo exprime servir ou estar sujeito; ‘sirvam’ é lexicalmente mais preciso do que ‘desejem’ e mantém a forma de bênção.
- source_word: ይስግዱ፡ በቅድመ፡ ዘርእከ
  choice: se prostrem diante da sua descendência
  rationale: Traduz o gesto de reverência/submissão e conserva o referente coletivo ‘descendência’.
- source_word: ለኵሉ፡ ዓለማት
  choice: por todos os séculos
  rationale: Reproduz a expressão temporal plural com uma formulação portuguesa digna e corrente.
theological_decisions:
- issue: Sujeito e objeto de ይቀድስ na cláusula sobre os descendentes
  choice: santifique alguns dos seus descendentes
  alternative: dentre os seus descendentes, santifique a si mesmo
  rationale: A forma verbal é ativa, não reflexiva. A preposição እም pode ter força partitiva, de modo que o objeto implícito é naturalmente entendido como ‘alguns’ dentre os descendentes, sem atribuir ao Senhor uma ação reflexiva não expressa pela morfologia.
- issue: Agente da bênção inicial
  choice: Benditos sejam ... pelo Senhor Altíssimo
  alternative: Benditos sejam ... para o Senhor Altíssimo
  rationale: A construção admite alguma tensão, mas o contexto de bênção favorece entender o Senhor Altíssimo como aquele que abençoa; evita-se transformar a frase em dedicação cultual sem apoio suficiente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. Mantiveram-se o paralelismo da bênção e a referência coletiva de ‘descendência’; a repetição introdutória ‘E disse’ foi preservada por proximidade ao estilo narrativo da fonte.
