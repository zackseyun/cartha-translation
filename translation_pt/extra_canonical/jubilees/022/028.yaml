revisions:
- from: E os dois se deitaram juntos na mesma cama, e Jacó dormiu no seio de Abraão, pai de seu pai. Abraão o beijou sete vezes, e sua compaixão e seu coração se alegraram por causa dele.[a]
  to: E os dois se deitaram juntos em uma só cama, e Jacó dormiu no seio de Abraão, pai de seu pai. Abraão o beijou sete vezes, e sua compaixão e seu coração se alegraram nele.[a]
  rationale: A revisão substitui uma relação causal («por causa dele») por uma relação afetiva diretamente orientada a Jacó («nele»), em conformidade com a construção final do ge'ez e com o verbo de alegria confirmado no histórico de revisão. Também ajusta «na mesma cama» para «em uma só cama», mais próximo da expressão de unidade da fonte.
