  text: And both of them lay down together on one bed[28], and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his compassion and his heart rejoiced over him.
translation:
  language: pt
  text: E os dois se deitaram juntos em uma só cama, e Jacó dormiu no seio de Abraão, pai de seu pai. Abraão o beijou sete vezes, e sua compaixão e seu coração se alegraram nele.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção da frase final é difícil; literalmente, a compaixão e o coração de Abraão se alegraram «nele» ou «sobre ele».
    reason: Registra a construção afetiva incomum e preserva a relação direta com Jacó, sem eliminar o verbo de alegria ou deleite presente na fonte.
lexical_decisions:
- source_word: ኅቡረ፡ ውስተ፡ ዐራት፡ አሐቲ
  choice: juntos na mesma cama
  rationale: Expressa naturalmente a ideia de ambos se deitarem juntos em uma única cama, sem acrescentar conotação indevida.
- source_word: ውስተ፡ ሕፅነ፡ አብርሃም
  choice: no seio de Abraão
  rationale: Mantém a imagem corporal e afetiva do termo ge'ez, em registro digno e reconhecível no português bíblico atual.
- source_word: አቡ፡ አቡሁ
  choice: pai de seu pai
  rationale: Preserva a formulação explícita da fonte, em vez de reduzi-la interpretativamente a 'avô'.
- source_word: ወትሤሖ
  choice: se alegraram por causa dele
  rationale: Conserva o verbo de alegria ou deleite atestado no texto, evitando a leitura sem verbo 'estavam sobre ele'.
- source_word: ምሕረቱ፡ ወልቡ
  choice: sua compaixão e seu coração
  rationale: Traduz distintamente os dois substantivos e mantém a expressão afetiva da fonte.
theological_decisions:
- issue: Sentido da cláusula afetiva final
  choice: sua compaixão e seu coração se alegraram por causa dele
  alternative: sua compaixão e seu coração estavam sobre ele
  rationale: O texto contém um verbo que comunica alegria ou deleite; a alternativa elimina esse elemento verbal. A redação escolhida preserva tanto a emoção quanto a construção incomum com 'compaixão' e 'coração' como sujeitos.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a imagem tradicional “no seio de Abraão” e a formulação literal “pai de seu pai”; a cláusula final mantém deliberadamente a tensão e a relativa estranheza do original.
