  yaml_path: translation/extra_canonical/jubilees/022/007.yaml
  text: And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the produce of the earth, and gave it to the children of men to eat and drink and bless their Creator.
translation:
  language: pt
  text: E ele comeu e bebeu, e bendisse o Deus Altíssimo, que criou o céu e a terra, que fez toda a abundância da terra e a deu aos filhos dos homens, para que comessem, bebessem e bendissessem o seu Criador.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስብሐ፡ ምድር
  choice: toda a abundância da terra
  rationale: A expressão etiópica corresponde literalmente à ideia de 'riqueza/gordura da terra', isto é, sua fertilidade e seus bens. 'Abundância' preserva essa imagem sem a estranheza de 'gordura' nem a restrição semântica de 'produtos'.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Mantém a expressão coletiva tradicional do texto-fonte, referindo-se à humanidade.
- source_word: ይባርኩ፡ ፈጣሪሆሙ
  choice: bendissessem o seu Criador
  rationale: Conserva a repetição temática do verbo 'bendizer' e traduz o sufixo possessivo plural de modo natural em português.
theological_decisions:
- issue: Relação entre a dádiva divina e as três ações humanas
  choice: para que comessem, bebessem e bendissessem
  alternative: para comer, beber e bendizer
  rationale: A construção final foi explicitada com verbos no imperfeito do subjuntivo, preservando que as três ações — inclusive bendizer o Criador — pertencem à finalidade expressa no texto, sem alterar seu alcance teológico.
translation_notes:
  register: Português moderno, claro e solene, com coordenação próxima da estrutura do gueês. Emprega 'Deus Altíssimo', 'céu e terra' e 'Criador' em registro bíblico amplamente reconhecível.
