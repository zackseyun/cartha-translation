base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/001.yaml
  text: And it came to pass in the first week[1], in the forty-fourth jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath to celebrate the Feast of Weeks, this feast of the firstfruits of the harvest, with Abraham their father.
translation:
  language: pt
  text: E aconteceu que, na primeira semana[a] do quadragésimo quarto jubileu, no segundo ano dessa semana — o ano em que Abraão morreu —, Isaque e Ismael vieram do Poço do Juramento[b] para celebrar com Abraão, seu pai, a Festa das Semanas, esta festa das primícias da colheita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “semana” é um período de sete anos, segundo o sistema cronológico usado em Jubileus.
    reason: contextualização cronológica
  - marker: b
    text: Isto é, Berseba; o nome significa “Poço do Juramento”.
    reason: identificação do topônimo
lexical_decisions:
- source_word: ሱባዔ
  choice: semana
  rationale: Conserva o sistema cronológico próprio de Jubileus; neste contexto, trata-se de uma semana de anos, esclarecida em nota.
- source_word: አርብዓ ወአርባዕቱ ኢዮቤልዉ
  choice: quadragésimo quarto jubileu
  rationale: As palavras ge'ez dizem explicitamente “quarenta e quatro”, e essa leitura corresponde à cronologia interna da obra.
- source_word: ዐዘቅተ መሐላ
  choice: Poço do Juramento
  rationale: Traduz o significado do topônimo de modo transparente, preservando a forma usada pelo texto-fonte; a identificação tradicional com Berseba é registrada em nota.
- source_word: በዓለ ሱባዔያት
  choice: Festa das Semanas
  rationale: É o nome convencional e semanticamente direto da festividade.
- source_word: ዘቀዳሚ ማእረር
  choice: das primícias da colheita
  rationale: Expressa a referência cultual aos primeiros frutos da colheita, em vez de sugerir equivocadamente uma “primeira festa”.
theological_decisions:
- issue: Relação entre o ano da morte de Abraão e a celebração com ele
  choice: Preservar ambas as afirmações sem explicação harmonizadora
  alternative: Reformular para indicar explicitamente que a festa ocorreu antes da morte naquele mesmo ano
  rationale: O texto afirma que era o ano em que Abraão morreu e que os filhos celebraram com ele; a sequência temporal pode ser inferida, mas não deve ser acrescentada à tradução.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A longa datação foi mantida, mas organizada sintaticamente para clareza; os nomes da festividade foram capitalizados como designações próprias.
