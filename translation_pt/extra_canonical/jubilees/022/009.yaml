  text: The sword of the adversary has not overcome me in all that you have given me and my children all the days of my life until this day.
translation:
  language: pt
  text: A espada do inimigo não me venceu em tudo o que deste a mim e aos meus filhos, durante todos os dias da minha vida até este dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ጸላኢ
  choice: A espada do inimigo
  rationale: Mantém a imagem concreta e a relação genitiva do ge'ez, sem transformar “espada” em uma referência genérica a ataques ou violência.
- source_word: ኢሞአኒ
  choice: não me venceu
  rationale: Expressa de maneira natural o verbo de derrota ou triunfo sobre alguém, preservando o objeto de primeira pessoa.
- source_word: በኵሉ፡ ዘወሀብከኒ፡ ወለውሉድየ
  choice: em tudo o que deste a mim e aos meus filhos
  rationale: Conserva a construção abrangente e entende o dom como destinado tanto ao falante quanto a seus filhos; a formulação evita acrescentar um objeto não expresso.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: durante todos os dias da minha vida até este dia
  rationale: Reproduz a extensão temporal completa e a expressão conclusiva do original em português claro e solene.
