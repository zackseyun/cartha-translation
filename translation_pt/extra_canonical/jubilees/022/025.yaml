  yaml_path: translation/extra_canonical/jubilees/022/025.yaml
  text: Do not fear, my son Jacob, and do not be dismayed, son of Abraham. The Most High God will keep you from corruption, and he will deliver you from every path of error.
translation:
  language: pt
  text: Não tenha medo, meu filho Jacó, nem fique apavorado, filho de Abraão. O Deus Altíssimo guardará você da corrupção e o livrará de todo caminho de erro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍራህ
  choice: Não tenha medo
  rationale: Imperativo negativo natural em português, correspondente a “não temas” sem recorrer a registro arcaizante.
- source_word: አትደንግፅ
  choice: nem fique apavorado
  rationale: Expressa consternação ou forte perturbação e mantém a distinção em relação ao verbo anterior, “ter medo”.
- source_word: አምላከ፡ ልዑል
  choice: O Deus Altíssimo
  rationale: Reproduz o título divino com formulação corrente, digna e facilmente compreensível.
- source_word: ይዕቀብከ
  choice: guardará você
  rationale: Traduz o sentido de guardar ou preservar e rege naturalmente a expressão “da corrupção”.
- source_word: ሙስና
  choice: corrupção
  rationale: Mantém o campo semântico de corrupção, deterioração ou ruína sem restringi-lo indevidamente a “destruição”.
- source_word: ኵሉ፡ ፍኖተ፡ ስሕተት
  choice: todo caminho de erro
  rationale: Preserva a imagem do caminho e a abrangência de “todo”, com formulação idiomática em português.
- source_word: ይባልሕከ
  choice: o livrará
  rationale: Representa o segundo verbo da estrutura paralela como ação de livrar ou resgatar.
theological_decisions:
- issue: Relação entre os dois verbos e seus complementos
  choice: “guardará você da corrupção e o livrará de todo caminho de erro”
  alternative: “guardará você da corrupção e de todo caminho de erro; ele o livrará”
  rationale: 'A sintaxe favorece duas orações paralelas: guardar da corrupção e livrar de todo caminho de erro. Essa leitura evita deixar o segundo verbo sem complemento claro.'
- issue: Natureza da “corrupção”
  choice: Manter o termo amplo “corrupção”
  alternative: “destruição” ou “perdição”
  rationale: O termo-fonte admite um campo semântico amplo; a tradução não deve decidir se a referência é especificamente moral, física ou escatológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega “você” em vez de flexão arcaica, sem perder a solenidade da bênção patriarcal; mantém o paralelismo e a tensão semântica do texto ge'ez.
