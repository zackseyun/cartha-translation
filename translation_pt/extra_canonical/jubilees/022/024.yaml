  terminology: “Sheol” é corretamente mantido e explicado em nota. “Lugar do juízo” é sóbrio e não funde indevidamente esse destino com Sheol. A nota sobre “os detestáveis” registra alternativas relevantes; “profanos” é contextual, enquanto “impuros” não deve ser adotado como tradução principal.
