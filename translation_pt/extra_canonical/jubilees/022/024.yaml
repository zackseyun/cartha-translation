base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/024.yaml
  text: And for all who worship idols and for the profane[24], there is no hope in the land of the living; for they will go down to Sheol, and they will go to the place of judgment, and they will have no memorial upon the earth. As the sons of Sodom were removed from the earth, so all who worship idols will be removed.
translation:
  language: pt
  text: E para todos os que adoram ídolos e para os detestáveis[a], não há esperança alguma na terra dos vivos, pois descerão ao Sheol[b] e irão ao lugar do juízo; não haverá lembrança alguma deles sobre a terra. Assim como os filhos de Sodoma foram removidos da terra, assim também serão removidos todos os que adoram ídolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “os profanos”; literalmente, “os odiados” ou “os odiosos”.
    reason: alternative_reading
  - marker: b
    text: Conserva-se “Sheol” porque o texto distingue a descida ao Sheol da ida ao “lugar do juízo”.
    reason: alternative_reading
lexical_decisions:
- source_word: ጽሉአን (ṣəluʾān)
  choice: os detestáveis
  rationale: O termo deriva da ideia de odiar ou considerar repugnante e pode significar “odiados”, “odiosos” ou “profanos”. “Detestáveis” preserva essa força sem confundi-lo com o vocabulário específico de impureza ritual.
- source_word: ሲኦል (Sheol)
  choice: Sheol
  rationale: Mantém o nome do domínio dos mortos e evita identificá-lo de modo indevido com “inferno” ou simplesmente “sepultura”, sobretudo porque o texto o distingue do “lugar do juízo”.
- source_word: ይትነሥኡ / ተንሥኡ
  choice: serão eliminados / foram eliminados
  rationale: No contexto, o verbo descreve a retirada da terra. A repetição da mesma formulação em português preserva o paralelo entre Sodoma e os adoradores de ídolos.
theological_decisions:
- issue: Relação entre Sheol e o lugar do juízo
  choice: Manter as duas expressões distintas
  alternative: Traduzir Sheol como “inferno” ou fundir ambos os destinos
  rationale: A construção do texto apresenta a descida ao Sheol e a ida ao lugar do juízo como elementos coordenados; a tradução não resolve se são etapas, locais ou aspectos distintos.
- issue: Sentido de ጽሉአን
  choice: “os detestáveis” com nota de alternativa
  alternative: “os profanos” ou “os impuros”
  rationale: “Detestáveis” representa melhor o campo lexical ligado ao ódio ou repulsa; “profanos” é uma possibilidade contextual, enquanto “impuros” sugere um conceito ritual expresso normalmente por outro vocábulo.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo preservado. Emprega “Sheol” como termo técnico transliterado e evita vocabulário denominacional. “Eliminados” comunica a remoção da terra sem pressupor além do que o contexto afirma.
