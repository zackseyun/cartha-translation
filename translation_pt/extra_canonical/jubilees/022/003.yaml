lexical_decisions:
- source_word: ጥሪቱ
  choice: bens
  rationale: O termo designa as posses ou propriedades de Isaque; “bens” é natural em português e preserva o sentido material amplo.
- source_word: በቤርሳቤ
  choice: em Berseba
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo Beer-Sheba.
- source_word: የሐውር ... ይዋሑ ... ይገብእ
  choice: costumava ir ver ... e voltar
  rationale: A sequência de formas verbais no imperfeito expressa ação habitual no passado; “costumava” torna esse valor aspectual claro em português.
- source_word: ኀበ፡ አቡሁ
  choice: para junto de seu pai
  rationale: Traduz a ideia direcional de retornar ao lugar onde estava o pai, com formulação natural e digna.
