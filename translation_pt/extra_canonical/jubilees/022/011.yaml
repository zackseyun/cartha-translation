  yaml_path: translation/extra_canonical/jubilees/022/011.yaml
  text: And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people of inheritance according to his will all the days.”
translation:
  language: pt
  text: 'E ele chamou Jacó e disse: “Meu filho Jacó, que o Deus de tudo abençoe você e lhe dê forças para fazer o que é justo e cumprir a vontade dele diante dele. Que ele escolha você e sua descendência, para que sejam para ele um povo de herança, conforme a vontade dele, todos os dias.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ኵሉ፡
  choice: o Deus de tudo
  rationale: Reproduz a expressão etíope de modo claro e direto, sem substituí-la pelo título interpretativo “Deus Todo-Poderoso”.
- source_word: ገቢረ፡ ጽድቅ፡
  choice: fazer o que é justo
  rationale: Comunica naturalmente a ideia de praticar a justiça sem restringi-la a um sentido meramente jurídico.
- source_word: ዘርእከ፡
  choice: a sua descendência
  rationale: O substantivo coletivo refere-se à linhagem ou posteridade de Jacó; “descendência” preserva esse valor melhor que o literal “semente”.
- source_word: ሕዝበ፡ ዘርስት፡
  choice: um povo que lhe pertença como herança
  rationale: Torna inteligível a construção “povo de herança”, preservando tanto a noção de povo pertencente a Deus quanto a imagem da herança.
- source_word: በኵሉ፡ መዋዕለ፡
  choice: todos os dias
  rationale: Mantém a expressão temporal do texto, que indica duração contínua.
theological_decisions:
- issue: Sentido de “povo de herança”
  choice: um povo que lhe pertença como herança
  alternative: um povo de herança
  rationale: A opção adotada conserva a metáfora bíblica da herança e explicita apenas a relação gramatical necessária em português, sem identificar a herança como terra, salvação ou outra realidade específica.
- issue: Identidade daquele que escolhe Jacó e sua descendência
  choice: Que ele escolha você e a sua descendência
  alternative: E que Deus escolha você e a sua descendência
  rationale: O pronome preserva a continuidade do sujeito no original, isto é, “o Deus de tudo”, sem acrescentar uma repetição ausente da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” por naturalidade contemporânea, mantendo a forma solene da bênção por meio de “que”. A repetição potencialmente pesada de “dele diante dele” foi vertida como “cumprir a vontade dele em sua presença”, sem alterar o referente.
