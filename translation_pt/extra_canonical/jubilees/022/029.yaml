  yaml_path: translation/extra_canonical/jubilees/022/029.yaml
  text: And he blessed him with all his heart and said, “The Most High God, the God of all and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and that I might establish a holy seed—may the Most High be blessed forever.”
translation:
  language: pt
  text: 'E ele o abençoou de todo o coração e disse: “O Deus Altíssimo, Deus de todos e Criador de tudo, que me tirou de Ur dos caldeus para me dar esta terra como herança para sempre e para que eu estabelecesse uma descendência santa — bendito seja o Altíssimo para sempre!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሉ፡ ልቡ
  choice: de todo o coração
  rationale: Expressa naturalmente a totalidade e a sinceridade indicadas literalmente por ‘com todo o seu coração’.
- source_word: አምላከ፡ ልዑል
  choice: o Deus Altíssimo
  rationale: Conserva o título divino explícito e seu tom solene.
- source_word: ምድረ፡ አርስ፡ ለዓለም
  choice: esta terra como herança para sempre
  rationale: Reproduz a ideia de uma terra concedida como posse ou herança duradoura, em português claro e de registro bíblico acessível.
- source_word: አቅም፡ ዘርአ፡ ቅዱሰ
  choice: para que eu estabelecesse uma descendência santa
  rationale: Mantém a mudança gramatical para a primeira pessoa como sujeito do verbo e traduz ‘semente’ pelo sentido genealógico natural de ‘descendência’.
- source_word: ይትባረክ፡ ልዑል፡ ለዓለም
  choice: bendito seja o Altíssimo para sempre
  rationale: Preserva a repetição explícita do título ‘Altíssimo’ e a força de bênção ou louvor da oração final.
theological_decisions:
- issue: Sujeito de ‘estabelecer uma descendência santa’
  choice: 'Abraão é o sujeito: ‘para que eu estabelecesse’'
  alternative: 'Deus como sujeito implícito: ‘para estabelecer’'
  rationale: A forma verbal em ge’ez é de primeira pessoa do singular e assinala uma mudança de sujeito em relação a Deus, que o tirou de Ur e lhe deu a terra.
- issue: Referência na bênção final
  choice: Repetir ‘o Altíssimo’
  alternative: Usar o pronome ‘ele’
  rationale: O texto-fonte repete expressamente o título ልዑል, repetição teologicamente significativa que não deve ser apagada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência bíblica moderada. A construção longa do original foi mantida, mas organizada com travessão antes da bênção final para tornar clara a conclusão da fala.
