revisions:
- from: Sê forte diante dos homens[a] e, enquanto dominares entre toda a descendência de Sete, então os teus caminhos e os caminhos dos teus filhos serão reconhecidos como justos, para que se tornem um povo santo.
  to: Sê forte diante dos homens[a] e, enquanto dominares entre toda a descendência de Sete, os teus caminhos e os caminhos dos teus filhos serão reconhecidos como justos, para que os teus filhos se tornem um povo santo.
  rationale: Foi ajustada somente a oração final, explicitando «os teus filhos» como os que se tornam um povo santo. Isso elimina a leitura sintaticamente impossível de que os caminhos se tornam um povo, preservando a referência contextual da cláusula final e todas as ambiguidades relevantes da oração central, que continuam registradas na nota.
