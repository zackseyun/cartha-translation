review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva os elementos centrais do ge''ez: o imperativo «Sê forte», «diante dos homens», a menção explícita à «descendência de Sete», os dois plurais «caminhos» e «caminhos dos teus filhos», e «povo santo». «Dominares» é uma solução defensável para a oração difícil, e a nota registra de modo apropriado a alternativa de exaltação.'
  naturalness: O texto é claro e de registro adequado, mas a oração final deixa «caminhos» como antecedente gramatical imediato de «se tornem um povo santo», o que produz uma incoerência semântica em português. É seguro explicitar que são os filhos/descendentes que se tornam um povo santo.
  terminology: «Descendência de Sete», «reconhecidos como justos» e «povo santo» são escolhas naturais e fiéis. A opção não força «justos» a funcionar como termo técnico de justificação posterior.
  issues:
  - severity: medium
    issue: Antecedente ambíguo e semanticamente inadequado em «para que se tornem um povo santo».
    rationale: Na redação atual, o sujeito gramatical mais próximo é «os teus caminhos e os caminhos dos teus filhos», mas caminhos não podem tornar-se um povo. O contexto e a cláusula final indicam os filhos/descendência; explicitá-los resolve a sintaxe sem alterar o sentido.
  revised_text: Sê forte diante dos homens[a] e, enquanto dominares entre toda a descendência de Sete, os teus caminhos e os caminhos dos teus filhos serão reconhecidos como justos, para que os teus filhos se tornem um povo santo.
  revised_footnotes:
