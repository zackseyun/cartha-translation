  text: Be strong before men[14], and while you rule among all the seed of Seth, then your ways and the ways of your sons will be justified, so that they may become a holy people.
translation:
  language: pt
  text: Sê forte diante dos homens[a] e, enquanto dominares entre toda a descendência de Sete, os teus caminhos e os caminhos dos teus filhos serão reconhecidos como justos, para que os teus filhos se tornem um povo santo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação é difícil. O ge'ez diz explicitamente «descendência de Sete»; a oração sobre a posição de Jacó entre eles também pode ter o sentido de ele ser exaltado entre os seres humanos.
    reason: segmentation_note
lexical_decisions:
- source_word: ኩን፡ ኃያለ
  choice: Sê forte
  rationale: Reproduz naturalmente o imperativo e o predicativo do texto ge'ez.
- source_word: በቅድመ፡ ሰብእ
  choice: diante dos homens
  rationale: Mantém a expressão espacial/social do original sem restringi-la indevidamente a um grupo específico.
- source_word: ትሜብል
  choice: dominares
  rationale: O verbo é difícil neste contexto; esta opção conserva o possível sentido de exercer domínio, sem apagar a alternativa de ser exaltado indicada em nota.
- source_word: ውስተ፡ ኵሉ፡ ዘርአ፡ ሴት
  choice: entre toda a descendência de Sete
  rationale: Traduz explicitamente Sete e verte 'semente' pelo idiomático 'descendência'.
- source_word: ፍናዊከ፡ ወፍናዊ፡ ውሉድከ
  choice: os teus caminhos e os caminhos dos teus filhos
  rationale: Preserva o plural confirmado pelas formas ge'ez e pela concordância verbal.
- source_word: ይጸድቃ
  choice: serão reconhecidos como justos
  rationale: Expressa o valor de serem considerados ou mostrados justos e evita sugerir apenas correção física ou mera retidão de percurso.
- source_word: ሕዝብ፡ ቅዱስ
  choice: um povo santo
  rationale: Correspondência direta, natural e tradicional, sem acréscimo confessional.
theological_decisions:
- issue: Sentido da posição de Jacó entre a descendência de Sete
  choice: enquanto dominares entre
  alternative: enquanto fores exaltado entre
  rationale: A formulação é textualmente difícil. O corpo do texto segue a leitura de governo presente na camada inglesa auditada, enquanto a nota preserva a alternativa sem resolver artificialmente a ambiguidade.
- issue: Valor de ይጸድቃ aplicado aos caminhos
  choice: serão reconhecidos como justos
  alternative: serão justificados
  rationale: A escolha conserva a linguagem de justiça sem impor ao verso um sentido técnico posterior de justificação teológica.
translation_notes:
  register: Português atual, claro e digno, com formas de segunda pessoa coerentes com o tom de bênção patriarcal. Conservou-se a repetição de «caminhos» e a ambiguidade da oração central foi registrada em nota.
