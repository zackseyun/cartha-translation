    reason: segmentation_note
  revision_rationale: Foi ajustada somente a oração final, explicitando «os teus filhos» como os que se tornam um povo santo. Isso elimina a leitura sintaticamente impossível de que os caminhos se tornam um povo, preservando a referência contextual da cláusula final e todas as ambiguidades relevantes da oração central, que continuam registradas na nota.
