base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/005.yaml
  text: And he brought a peace offering and made a great feast of rejoicing before Ishmael his brother. And Rebekah made fresh cakes from new grain and gave them to Jacob her son[5], so that he might bring them to Abraham, his father, from the firstfruits of the land, that he might eat and bless the Creator of all before he died.
translation:
  language: pt
  text: E ele trouxe uma oferta de paz e fez uma grande festa de alegria diante de seu irmão Ismael. Rebeca fez bolos recém-feitos de cereal novo e os deu a Jacó, seu filho, para que ele os levasse a Abraão, seu pai,[a] feitos com as primícias da terra, a fim de que Abraão comesse e bendissesse o Criador de tudo antes de morrer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abraão era avô de Jacó; aqui, «pai» é usado no sentido mais amplo de antepassado.
    reason: genealogical_clarification
lexical_decisions:
- source_word: መድኃኒተ
  choice: oferta de salvação
  rationale: O substantivo etiópico deriva da ideia de salvação/libertação e, neste contexto sacrificial, corresponde à expressão tradicional para oferta ou sacrifício de salvação; preserva-se essa formulação em vez de restringi-la a uma 'oferta pacífica'.
- source_word: ፯ዝዐ፡ ፍሥሓ
  choice: uma grande festa de alegria
  rationale: A sequência descreve uma celebração festiva marcada por júbilo; a redação portuguesa mantém ambos os elementos sem soar redundante.
- source_word: ጻፍንተ፡ ሐዳሰ፡ እምስርናይ፡ ኅዲስ
  choice: bolos frescos de cereal novo
  rationale: A expressão combina bolos/pães preparados recentemente com cereal da nova colheita; 'cereal' evita especificar uma espécie não inequívoca no trecho.
- source_word: አቡሁ
  choice: seu pai
  rationale: O texto diz literalmente 'seu pai'. Embora Abraão seja avô de Jacó, a linguagem bíblica pode empregar 'pai' para um antepassado; a tradução conserva o termo e registra a relação genealógica em nota.
- source_word: እምቀዳሚ፡ ፍሬ፡ ምድር
  choice: como primícias da terra
  rationale: A expressão indica os primeiros frutos/produtos da terra. 'Primícias' é conciso, corrente no registro bíblico e preserva a possível dimensão cultual.
- source_word: ፈጣሪ፡ ኵሉ
  choice: o Criador de tudo
  rationale: Tradução direta do título divino, natural em português e sem acrescentar interpretação denominacional.
theological_decisions:
- issue: Natureza da oferta designada por መድኃኒተ
  choice: oferta de salvação
  alternative: oferta pacífica
  rationale: A escolha retém o valor lexical ligado a 'salvação' e não identifica de modo excessivamente específico o sacrifício com uma categoria levítica posterior.
- issue: Designação de Abraão como pai de Jacó
  choice: manter 'seu pai' no texto
  alternative: seu avô / pai de seu pai
  rationale: A tradução preserva o enunciado da fonte e sua amplitude ancestral, sem corrigir silenciosamente a genealogia.
- issue: Possível referência a uma festa de primícias
  choice: traduzir apenas a formulação explícita do versículo
  alternative: identificar no texto a Festa das Semanas
  rationale: O versículo menciona primícias, mas não nomeia aqui a festa; uma identificação litúrgica não deve ser introduzida sem apoio explícito nesta frase.
translation_notes:
  register: Português moderno, digno e acessível, com leve tonalidade bíblica. Mantêm-se 'primícias' e 'Criador de tudo' por sua precisão e naturalidade no gênero. A pontuação esclarece que 'seu pai' se refere a Abraão, sem alterar a formulação da fonte.
