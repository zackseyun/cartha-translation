base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/026.yaml
  text: This house I have built for myself[26], to put my name upon it on the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, because you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”
translation:
  language: pt
  text: Esta casa eu construí para mim mesmo[a], para pôr sobre ela o meu nome na terra. Ela foi dada a você e à sua descendência para sempre, e será chamada casa de Abraão. Foi dada a você e à sua descendência para sempre, porque você construirá a minha casa e firmará o meu nome diante de Deus para sempre. A sua descendência e o seu nome permanecerão por todas as gerações da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Esta casa eu construí para mim mesmo” pode referir-se ao local de culto de Abraão, mas as linhas seguintes também evocam uma casa dinástica (“casa de Abraão”). A ambiguidade pode ser intencional.
    reason: segmentation_note
lexical_decisions:
- source_word: ቤተ
  choice: casa
  rationale: Preserva o sentido amplo do termo, que pode designar tanto uma construção quanto, no contexto, uma casa ou linhagem.
- source_word: ዘርእ
  choice: descendência
  rationale: Expressa naturalmente o sentido coletivo de 'semente' aplicado aos descendentes, sem limitar o termo a um único indivíduo.
- source_word: ይቀውም / ታቀውም
  choice: permanecerão / firmará
  rationale: O campo semântico envolve estabelecer-se ou manter-se de pé; as escolhas variam conforme o objeto e produzem português natural sem perder a ideia de continuidade e estabilidade.
- source_word: ወተሰምየ (leitura textual subjacente)
  choice: será chamada
  rationale: Segue a leitura confirmada pela tradição textual, em vez da forma corrompida por OCR presente na transcrição fornecida.
theological_decisions:
- issue: Ambiguidade de 'casa' entre local de culto e casa dinástica
  choice: Manter 'casa' e registrar a ambiguidade em nota
  alternative: Explicitar 'santuário' ou 'linhagem' no texto principal
  rationale: O contexto comporta as duas ressonâncias, e escolher apenas uma eliminaria uma tensão significativa do texto.
- issue: Tempo verbal da construção futura da casa
  choice: “você construirá ... e firmará”
  alternative: “você construiu ... e firmou”
  rationale: Os verbos etíopes são formas imperfeitas e, no contexto profético dirigido a Jacó, apontam para ação futura.
- issue: Expressão 'diante de Deus'
  choice: Preservar literalmente
  alternative: Reformular como 'na presença de Deus' ou identificar o falante com Deus
  rationale: A formulação do texto mantém uma relação teológica incomum entre o nome do falante e Deus; não convém harmonizá-la silenciosamente.
translation_notes:
  register: Português moderno, claro e digno, com uso de “você” para a fala direta singular. A repetição da fórmula de concessão foi mantida por ser estrutural no original. “Casa” foi preservada para conservar sua possível dupla referência cultual e dinástica.
