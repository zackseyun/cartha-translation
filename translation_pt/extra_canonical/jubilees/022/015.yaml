base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/015.yaml
  text: May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your offspring for all generations and forever.
translation:
  language: pt
  text: Que o Deus Altíssimo lhe conceda todas as bênçãos com que me abençoou e com que abençoou Noé e Adão. Que elas repousem sobre a cabeça santa da sua descendência para todas as gerações[a] e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de geração em geração”.'
    reason: Registra uma tradução idiomática possível da expressão geracional, enquanto o texto principal preserva o quantificador explícito “todas” na fonte.
lexical_decisions:
- source_word: የሀብከ (yəhābka)
  choice: lhe conceda
  rationale: Expressa de modo natural o valor jussivo de “dar a você”, adequado ao contexto de bênção.
- source_word: አምላከ፡ ልዑል
  choice: o Deus Altíssimo
  rationale: Mantém o título divino tradicional e o sentido direto do ge’ez.
- source_word: በረከታተ
  choice: bênçãos
  rationale: Preserva o plural explícito da fonte.
- source_word: ያዕርፉ
  choice: repousem
  rationale: Conserva a imagem concreta de as bênçãos repousarem sobre alguém, sem explicá-la ou enfraquecê-la.
- source_word: ዘርእከ
  choice: sua descendência
  rationale: O termo pode significar literalmente “semente”, mas aqui designa os descendentes; “descendência” é natural em português e preserva o sentido coletivo.
- source_word: ለኵሉ፡ ትውልደ፡ ትውልድ
  choice: por todas as gerações
  rationale: Representa o quantificador explícito “todas” e a expressão geracional da fonte.
- source_word: ወእስከ፡ ለዓለም
  choice: e para sempre
  rationale: Reproduz a extensão temporal final sem fundi-la com a expressão anterior.
theological_decisions:
- issue: Referente de “elas”
  choice: As bênçãos são o sujeito de “repousem”
  alternative: Entender a forma verbal como uma bênção genérica sem referente nominal expresso
  rationale: A concordância e o encadeamento do texto favorecem a retomada das “bênçãos”, preservando a imagem da fonte.
- issue: “Cabeça santa” da descendência
  choice: Manter literalmente “a cabeça santa da sua descendência”
  alternative: Naturalizar como “sobre a sua santa descendência” ou “sobre a cabeça dos seus santos descendentes”
  rationale: A construção da fonte é singular e imagética; reformulá-la resolveria indevidamente se a santidade qualifica a cabeça, a descendência ou seu representante.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. A repetição “com que abençoou” foi mantida por refletir a estrutura enfática da fonte. O marcador [a] aparece no texto principal.
