base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/018.yaml
  text: And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
translation:
  language: pt
  text: E você, meu filho Jacó, lembre-se das minhas palavras e guarde os mandamentos de Abraão, seu pai. Separe-se das nações; não coma com elas, não proceda segundo as obras delas e não se torne companheiro delas, pois suas obras são impuras, e todos os seus caminhos são contaminação, abominação e impureza.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር
  choice: lembre-se
  rationale: Reproduz de modo direto e natural o imperativo dirigido a Jacó.
- source_word: ዕቀብ
  choice: guarde
  rationale: Mantém o sentido de observar e conservar fielmente os mandamentos, em registro bíblico corrente.
- source_word: ተፈለጥ
  choice: separe-se
  rationale: Expressa a ordem de manter-se separado das nações sem acrescentar uma explicação teológica.
- source_word: ኢትብላዕ፡ ምስሌሆሙ
  choice: não coma com elas
  rationale: Preserva a referência concreta à comunhão de mesa.
- source_word: ኢትኩኖሙ፡ ቢጸ
  choice: não se torne companheiro delas
  rationale: Conserva a ideia relacional de tornar-se associado ou companheiro dos povos mencionados.
- source_word: ርኩስ
  choice: impuras
  rationale: Equivalente natural para a impureza atribuída às obras, sem reduzi-la meramente a sujeira física.
- source_word: ጐግኒ፡ ወምናኔ፡ ወስቆራር
  choice: contaminação, abominação e impureza
  rationale: Mantém a enumeração enfática de três termos negativos e evita fundi-los numa única noção.
theological_decisions:
- issue: Identidade das “nações” e alcance da separação ordenada
  choice: Manter simplesmente “nações” e conservar as proibições concretas do texto
  alternative: Interpretar como “gentios” e explicitar uma separação religiosa total
  rationale: O texto apresenta uma exortação específica à separação, à mesa e à conduta; a tradução não deve ampliar silenciosamente seu alcance nem impor terminologia confessional posterior.
- issue: Natureza da impureza das obras e caminhos
  choice: Usar linguagem abrangente de impureza, contaminação e abominação
  alternative: Explicitar que se trata exclusivamente de impureza ritual ou exclusivamente moral
  rationale: A formulação fonte permite sobreposição ritual, moral e religiosa; preservar essa tensão evita uma resolução interpretativa indevida.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição de “não” e a enumeração final foram preservadas para manter o caráter solene e enfático da exortação.
