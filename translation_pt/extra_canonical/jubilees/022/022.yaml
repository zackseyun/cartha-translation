base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/022.yaml
  text: Take heed, my son Jacob, that you do not take a wife from any of the seed of the daughters of Canaan, for all his seed is to be uprooted from the earth.
translation:
  language: pt
  text: Tome cuidado, meu filho Jacó, para não tomar como esposa nenhuma mulher da descendência das filhas de Canaã, pois toda a descendência dele será arrancada da terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “está destinada a ser arrancada da terra”.
    reason: Registra a possível nuance modal da construção ge’ez, que pode indicar destinação à erradicação, além de simples futuro.
lexical_decisions:
- source_word: ተዐቀብ (taʿaqab)
  choice: Tome cuidado
  rationale: Expressa de modo natural a advertência ou exortação do imperativo ge’ez, sem perder sua força.
- source_word: አትንግእ፡ ብእሲተ (ʾatnəngəʾ bəʾəsita)
  choice: não tomar como esposa
  rationale: Reproduz a expressão matrimonial de modo claro e corrente em português.
- source_word: ዘርአ፡ አዋልደ፡ ከናአን (zarʾa ʾawāləda Kanaʾan)
  choice: a descendência das filhas de Canaã
  rationale: Mantém a construção genealógica do texto, sem simplificá-la para apenas “cananeias”.
- source_word: ለሥራዊ፡ እምድር (la-śərāwi ʾəmdər)
  choice: será arrancada da terra
  rationale: Preserva a imagem concreta de erradicação ligada à raiz ś-r-w e sua relação com “da terra”, em português compreensível.
theological_decisions:
- issue: Identidade do referente em “toda a descendência dele”
  choice: dele
  alternative: de Canaã
  rationale: O pronome conserva a forma referencial do texto e a leve tensão quanto ao antecedente, embora Canaã seja o referente mais provável.
- issue: Valor temporal ou modal da erradicação
  choice: será arrancada
  alternative: está destinada a ser arrancada
  rationale: O futuro comunica naturalmente a declaração profética em português; a nota registra a possível nuance de destinação.
translation_notes:
  register: Português moderno, digno e acessível, com formulação de ampla legibilidade brasileira. “Tomar como esposa” conserva o tom bíblico sem soar arcaico; “arrancada da terra” mantém a metáfora agrícola do original.
