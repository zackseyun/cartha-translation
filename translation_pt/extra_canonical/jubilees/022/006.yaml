  yaml_path: translation/extra_canonical/jubilees/022/006.yaml
  text: And Isaac also sent by the hand of Jacob the best of the thank offering to Abraham, that he might eat and drink.
translation:
  language: pt
  text: E Isaque também enviou, pela mão de Jacó, o melhor da oferta de ação de graças a Abraão, para que Abraão comesse e bebesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእዴ፡ ያዕቆብ
  choice: pelas mãos de Jacó
  rationale: Preserva a expressão instrumental concreta do ge'ez, natural também em português bíblico, indicando que Jacó levou a oferta.
- source_word: ዘይሤኒ
  choice: a melhor parte
  rationale: O elemento qualifica aquilo que foi enviado como o melhor ou mais excelente; 'a melhor parte' produz uma frase clara sem perder essa força.
- source_word: መሥዋዕተ፡ ዘመድኃኒት
  choice: oferta de ação de graças
  rationale: Segue o sentido sacrificial tradicional da expressão no contexto, comunicando uma oferta vinculada a agradecimento, sem introduzir terminologia denominacional.
- source_word: ወይብላዕኒ፡ ወይስተይኒ
  choice: para que ele comesse e bebesse
  rationale: Reproduz de modo idiomático a finalidade expressa pelos verbos coordenados no ge'ez.
theological_decisions:
- issue: Natureza da oferta
  choice: oferta de ação de graças
  alternative: sacrifício de salvação
  rationale: A expressão pode refletir linguagem sacrificial associada a bem-estar, salvação ou agradecimento. Neste contexto de alimento enviado a Abraão, 'oferta de ação de graças' é compreensível e mantém a leitura atestada pela camada auditada, sem ampliar indevidamente a formulação.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A construção conserva o caráter narrativo e a mediação de Jacó, evitando arcaísmos desnecessários.
