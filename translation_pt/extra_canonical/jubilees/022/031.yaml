  yaml_path: translation/extra_canonical/jubilees/022/031.yaml
  text: And do not forsake him, and do not leave him, from now and unto the days of eternity. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him for a people of your inheritance. And bless him with all your blessings from now and for all the days forever, and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”
translation:
  language: pt
  text: E não o abandones nem o deixes, desde agora até os dias da eternidade.[b] Que os teus olhos estejam abertos sobre ele e sobre a sua descendência,[a] para que o guardes, o abençoes e o santifiques para ser um povo da tua herança. Abençoa-o com todas as tuas bênçãos, desde agora e por todos os dias da eternidade; e renova a tua aliança e a tua misericórdia com ele e com a sua descendência, conforme toda a tua vontade, por todas as gerações da terra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “voltados para ele e para a sua descendência”.'
    reason: A preposição pode ser vertida de modo mais idiomático como direção da atenção, embora “sobre” preserve mais de perto a imagem do texto.
  - marker: b
    text: 'Ou, de forma mais concisa: “desde agora e para sempre”.'
    reason: O texto traz literalmente a expressão enfática “até os dias da eternidade”.
lexical_decisions:
- source_word: አትኅድጎ፡ ... አትትሐየዮ፡
  choice: não o abandones nem o deixes
  rationale: Mantém os dois imperativos negativos e sua distinção sem forçar uma diferença semântica maior do que o texto permite.
- source_word: መዋዕለ፡ ዘለዓለም
  choice: dias da eternidade
  rationale: Conserva o substantivo explícito 'dias', presente no ge'ez, e a expressão temporal enfática.
- source_word: አዕይንቲከ፡ ክሡታተ፡ ላዕሌሁ፡ ወላዕለ፡ ዘርኡ፡
  choice: os teus olhos estejam abertos sobre ele e sobre a sua descendência
  rationale: Reproduz a imagem de vigilância e cuidado, bem como a preposição relacional, sem substituí-la por uma interpretação explicativa.
- source_word: ዘርኡ፡
  choice: sua descendência
  rationale: Expressa o sentido coletivo de 'semente' em português atual e evita a leitura exclusivamente agrícola.
- source_word: ለሕዝብ፡ ዘለርስትከ፡
  choice: para ser um povo da tua herança
  rationale: Torna clara em português a relação predicativa entre o indivíduo santificado e o povo que dele procede, preservando a linguagem de herança.
- source_word: ሐድስ፡ ኪዳነከ፡ ወሣህለከ፡
  choice: renova a tua aliança e a tua misericórdia
  rationale: Traduz diretamente os dois objetos coordenados, mantendo a linguagem pactual e a referência à misericórdia divina.
- source_word: በኵሉ፡ ፈቃድከ፡
  choice: conforme toda a tua vontade
  rationale: Conserva a abrangência de 'toda' e apresenta a relação normativa de modo natural em português.
theological_decisions:
- issue: Santificação do patriarca em relação ao povo da herança
  choice: o santifiques para ser um povo da tua herança
  alternative: o santifiques como povo da tua herança
  rationale: A formulação escolhida preserva a tensão entre o referente singular e sua identificação representativa ou geradora com o povo, sem decidir que ele já constitui sozinho esse povo.
- issue: Aliança e misericórdia com o patriarca e sua descendência
  choice: renova a tua aliança e a tua misericórdia com ele e com a sua descendência
  alternative: renova para ele e sua descendência a tua aliança misericordiosa
  rationale: Mantém aliança e misericórdia como elementos coordenados no texto, sem fundi-los em um único conceito teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe de oração solene. Preservaram-se as repetições temporais e a imagem dos olhos abertos por serem características do texto-fonte; empregou-se “descendência” para a expressão coletiva tradicionalmente traduzida por “semente”.
