base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/010.yaml
  text: My God, may your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.
translation:
  language: pt
  text: Meu Deus, que a tua misericórdia e a tua paz estejam sobre o teu servo e sobre a descendência de seus filhos, para que sejam para ti um povo escolhido e uma herança dentre todas as nações da terra, desde agora e por todos os dias das gerações da terra, por todos os tempos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላኪየ
  choice: Meu Deus
  rationale: Preserva o vocativo e o sufixo possessivo de primeira pessoa presentes no ge’ez.
- source_word: ሣህልከ፡ ወሰላምከ
  choice: a tua misericórdia e a tua paz
  rationale: Traduz diretamente os substantivos com sufixos de segunda pessoa, em formulação natural e digna.
- source_word: ዘርአ፡ ውሉዱ
  choice: a descendência de seus filhos
  rationale: “Descendência” comunica naturalmente o sentido coletivo de “semente”, sem eliminar a referência explícita aos filhos.
- source_word: ሕዝበ፡ ኅሩየ
  choice: um povo escolhido
  rationale: Equivalência direta para a expressão que designa um povo selecionado ou eleito.
- source_word: ወርስተ፡ እምኵሉ፡ አሕዛበ፡ ምድር
  choice: e uma herança dentre todas as nações da terra
  rationale: Mantém a imagem teológica de “herança” e o valor separativo de “dentre”.
- source_word: ለኵሉ፡ ዓለማት
  choice: por todos os tempos
  rationale: Expressa a duração indefinida e abrangente da fórmula final sem recorrer ao arcaísmo “séculos”.
theological_decisions:
- issue: Concordância de ይኩንከ com o referente coletivo
  choice: para que sejam para ti um povo escolhido
  alternative: para que seja para ti um povo escolhido
  rationale: O referente inclui o servo e a descendência, enquanto “povo” funciona como predicativo coletivo; o plural em português torna essa relação mais clara sem alterar a unidade do povo.
- issue: Sentido de “herança” entre as nações
  choice: uma herança dentre todas as nações
  alternative: uma herança de todas as nações
  rationale: “Dentre” conserva o sentido de seleção no meio das nações e evita sugerir que todas elas constituem conjuntamente a herança.
translation_notes:
  register: Português moderno, claro e reverente, com formas de segunda pessoa coerentes com a oração dirigida a Deus. A cadência extensa do original foi preservada sem tornar a frase artificial.
