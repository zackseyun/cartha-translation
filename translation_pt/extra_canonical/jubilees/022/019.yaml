  yaml_path: translation/extra_canonical/jubilees/022/019.yaml
  text: They sacrifice their sacrifices to the dead, and they worship demons, and they eat in the graves[19], and all their works are vanity and emptiness.
translation:
  language: pt
  text: Eles oferecem sacrifícios aos mortos, adoram demônios e comem dentro dos túmulos[a]; todas as suas obras são vaidade e vazio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Comem dentro dos túmulos” provavelmente se refere a refeições de culto funerário ou necromântico.
    reason: Nota cultural que esclarece uma prática antiga provável sem transformar a inferência em afirmação do texto.
lexical_decisions:
- source_word: መሥዋዕቶሙ፡ ... ይዘብሑ
  choice: oferecem sacrifícios
  rationale: A construção cognata do ge’ez, literalmente próxima de “sacrificam seus sacrifícios”, é expressa em português corrente sem repetição artificial.
- source_word: ለአብድነት
  choice: aos mortos
  rationale: Mantém o referente cultual da expressão no contexto, sem explicitar além do que o texto afirma.
- source_word: ወለአጋንንት፡ ይሰግዱ
  choice: adoram demônios
  rationale: Traduz diretamente a ação de prostrar-se em culto diante de demônios, com formulação natural em português.
- source_word: ወበውስተ፡ መቃብራት፡ ይበልዑ
  choice: e comem dentro dos túmulos
  rationale: Preserva o valor espacial explícito de በውስተ (“dentro de/em”) e evita substituir a imagem por “sobre os túmulos”.
- source_word: ከንቱ፡ ወበከ
  choice: vaidade e vazio
  rationale: Reproduz o par de termos negativos com uma combinação clara, concisa e semanticamente distinta em português.
theological_decisions:
- issue: Natureza das refeições nos túmulos
  choice: O texto principal mantém apenas “comem dentro dos túmulos”.
  alternative: Explicitar no corpo do versículo que se trata de refeições funerárias ou necromânticas.
  rationale: A finalidade ritual exata não é declarada no texto-fonte; a provável referência cultural pertence à nota, preservando a ambiguidade.
- issue: Relação entre os mortos e os demônios
  choice: Manter “mortos” e “demônios” como referentes distintos na sequência.
  alternative: Identificar os mortos com os demônios ou fundir os dois objetos de culto.
  rationale: O paralelismo do texto menciona ambos separadamente, e a tradução não deve impor uma identificação teológica não explicitada.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação direta conserva o ritmo acusatório do original; o ponto e vírgula separa as práticas cultuais de sua avaliação conclusiva.
