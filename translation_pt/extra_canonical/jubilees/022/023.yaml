  yaml_path: translation/extra_canonical/jubilees/022/023.yaml
  text: For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes, on the day of judgment.
translation:
  language: pt
  text: Pois, por causa da transgressão de Cam, Canaã se desviou, e toda a sua descendência será apagada da terra; dele não restará remanescente algum, nem haverá quem escape no dia do juízo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ (ʾabasa)
  choice: transgressão
  rationale: Expressa uma falta grave ou violação, preservando o tom judicial do contexto sem restringir o termo a uma formulação denominacional.
- source_word: ስሕተ (səḥta)
  choice: se desviou
  rationale: Mantém a ideia de errar ou afastar-se do caminho, sem definir de modo indevido a natureza exata do erro de Canaã.
- source_word: ዘርአ (zarʾa)
  choice: descendência
  rationale: Traduz naturalmente o sentido coletivo de 'semente' como linhagem ou posteridade.
- source_word: ይደመሰስ (yədammāsas)
  choice: será apagada
  rationale: Conserva a imagem forte de eliminação completa presente no verbo etíope.
- source_word: ተረፉ (tarāfihu)
  choice: remanescente algum
  rationale: Preserva o vocabulário de sobrevivência residual e a negação enfática do texto.
- source_word: ዕለተ ደይን (ʿəlata dayn)
  choice: dia do juízo
  rationale: Equivalência direta e tradicional da expressão judicial, em português claro e digno.
theological_decisions:
- issue: Relação causal entre a transgressão de Cam e o desvio de Canaã
  choice: por causa da transgressão de Cam, Canaã se desviou
  alternative: por sua transgressão, Cam fez Canaã errar
  rationale: A ordem e a sintaxe da fonte sustentam 'transgressão de Cam' seguida de 'Canaã se desviou'. A tradução conserva essa relação incomum sem redistribuir a culpa ou explicá-la teologicamente.
- issue: Referente de 'sua descendência' e 'dele'
  choice: Referência mantida em Canaã, o antecedente imediato
  alternative: Referência a Cam
  rationale: Canaã é o sujeito imediatamente anterior, e a continuação sobre sua descendência corresponde mais naturalmente a ele; a formulação não acrescenta identificação além da gramática contextual.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção causal e a tensão entre a falta de Cam e o desvio de Canaã foram preservadas, sem harmonização interpretativa.
