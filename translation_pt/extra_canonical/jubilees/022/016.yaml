  text: And may he cleanse you from all uncleanness and impurity, so that he may forgive all your transgressions and your sins of ignorance[16]. And may he strengthen you and bless you, and may you inherit the whole earth.
translation:
  language: pt
  text: Que ele purifique você de toda impureza e imundície, para que perdoe todas as suas transgressões e os pecados que você cometeu por ignorância[a]. Que ele lhe dê forças e o abençoe, e que você herde toda a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por «pecados que você cometeu por ignorância» é textualmente difícil; o ge’ez parece distinguir transgressões deliberadas de erros cometidos sem pleno conhecimento.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኵሰት፡ ወርኩስ
  choice: impureza e imundície
  rationale: Mantém os dois termos correlatos do ge’ez, sem reduzi-los a uma única ideia, em linguagem portuguesa clara e digna.
- source_word: አበሳከ
  choice: suas transgressões
  rationale: Expressa atos de violação ou culpa e preserva a distinção em relação aos erros ou pecados praticados por ignorância.
- source_word: ዘበአያእምሮ፡ ጌገይከ
  choice: os pecados que você cometeu por ignorância
  rationale: Torna inteligível a expressão difícil do ge’ez sem apagar a provável referência a faltas cometidas sem pleno conhecimento; a incerteza textual é registrada em nota.
- source_word: ያኃይለከ
  choice: lhe dê forças
  rationale: Tradução natural do pedido de fortalecimento, evitando a formulação menos corrente «fortaleça você».
- source_word: ትረስ፡ ኵላ፡ ምድረ
  choice: você herde toda a terra
  rationale: Preserva o sentido de receber a terra como herança e a abrangência de «toda».
theological_decisions:
- issue: Relação entre transgressões e faltas cometidas por ignorância
  choice: 'Manter duas categorias coordenadas: «transgressões» e «pecados ... por ignorância».'
  alternative: Fundir ambas em uma referência geral a todos os pecados.
  rationale: O texto parece distinguir transgressões de erros cometidos sem pleno conhecimento; a tradução conserva essa tensão sem definir uma doutrina específica sobre graus de culpa.
- issue: Valor verbal da cláusula final
  choice: «que você herde toda a terra»
  alternative: «ele fará você herdar toda a terra»
  rationale: A forma de bênção ou desejo é coerente com a sequência de pedidos e evita transformar o enunciado em promessa categórica.
translation_notes:
  register: Português moderno, claro e reverente, com construção de bênção introduzida por «Que». Emprega «você» para ampla legibilidade brasileira, sem coloquialismos. O marcador [a] foi colocado imediatamente após a expressão que a nota explica.
