  text: And Judah his father forbade him. And Er, Judah’s firstborn, was evil, and the LORD put him to death.
translation:
  language: pt
  text: E Judá, seu pai, o proibiu.[a] Er, o primogênito de Judá, era mau, e o SENHOR o matou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o impediu” ou “o deteve”.'
    reason: Registra a amplitude semântica do verbo geʿez, cujo sentido central é impedir ou restringir, e não repreender.
lexical_decisions:
- source_word: አሕበሶ (ʾaḥbaso)
  choice: o proibiu
  rationale: O causativo do verbo ሐበሰ comunica impedir, deter ou proibir. “O proibiu” expressa naturalmente a ação no contexto, sem recorrer ao sentido menos preciso de “repreendeu”.
- source_word: እኩይ (ʾəkkuy)
  choice: mau
  rationale: Equivalente direto e natural para a avaliação moral negativa de Er.
- source_word: ቀተሎ (qatalo)
  choice: o matou
  rationale: Verbo direto que declara que o SENHOR lhe tirou a vida; evita amenizar a formulação da fonte.
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: o SENHOR
  rationale: Forma consagrada em português para o nome/título divino neste contexto bíblico.
theological_decisions:
- issue: Agência divina na morte de Er
  choice: “o SENHOR o matou”
  alternative: “o SENHOR o fez morrer”
  rationale: A fonte atribui diretamente a ação ao SENHOR. A tradução preserva essa afirmação forte e sua tensão teológica, sem suavizá-la.
- issue: Objeto da proibição de Judá
  choice: Não explicitar o que foi proibido
  alternative: “proibiu-o de tomar uma mulher cananeia”
  rationale: O versículo traz apenas o pronome objeto e depende do contexto anterior. Acrescentar o conteúdo da proibição resolveria uma elipse que a fonte preserva.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “Judá” foi mantida por clareza e proximidade à estrutura da fonte; a conjunção antes de “Er” foi omitida para maior naturalidade em português, sem perda de sentido.
