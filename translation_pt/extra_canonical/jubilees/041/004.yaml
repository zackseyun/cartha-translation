  text: And Judah said to Onan, his brother,, “Go in to your brother’s wife, and perform a brother-in-law’s duty to her, and raise up offspring for your brother.”
translation:
  language: pt
  text: 'E Judá disse a Onã, irmão de Er: “Una-se à mulher do seu irmão, cumpra para com ela o dever de cunhado e dê descendência ao seu irmão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባእ፡ ኀበ፡ ብእሲተ፡ እኁከ፡
  choice: Una-se à mulher do seu irmão
  rationale: A expressão significa literalmente entrar para junto da mulher do irmão e funciona como referência eufemística à união sexual. “Una-se” conserva o sentido com dignidade e clareza em português atual.
- source_word: ወረከያ፡ ናዕልተ፡
  choice: cumpra para com ela o dever de cunhado
  rationale: A expressão descreve a obrigação levirática para com a viúva do irmão. A formulação explicita a relação familiar sem recorrer a terminologia técnica pouco conhecida.
- source_word: ወአንሥእ፡
  choice: e dê descendência ao seu irmão
  rationale: Embora o verbo isolado tenha o sentido de levantar ou suscitar, o contexto exige a ideia idiomática de suscitar descendência em favor do irmão falecido; “dê descendência” soa natural e mantém essa finalidade.
- source_word: ለአውናን፡ እኁሁ፡
  choice: a Onã, irmão de Er
  rationale: O pronome possessivo do texto remete contextualmente a Er, mencionado no entorno narrativo. Nomear Er evita a leitura genealogicamente errada de que Onã seria irmão de Judá.
theological_decisions:
- issue: Natureza da obrigação imposta a Onã
  choice: “dever de cunhado”
  alternative: “case-se com ela segundo a lei do levirato”
  rationale: O texto apresenta uma obrigação familiar voltada a suscitar descendência ao falecido, mas não emprega aqui uma formulação legal completa nem exige que se resolva se o ato equivale formalmente a casamento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fala mantém o eufemismo sexual do original sem se tornar obscura. “Onã” segue a forma portuguesa tradicional do nome.
