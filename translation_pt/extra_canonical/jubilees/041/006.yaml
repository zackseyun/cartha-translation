lexical_decisions:
- source_word: እግዚአብሔር
  choice: o SENHOR
  rationale: Forma tradicional e clara para o nome/título divino neste contexto, em continuidade com o segmento precedente.
- source_word: ወቀተሎ
  choice: e ele o matou
  rationale: Reproduz diretamente a ação verbal e mantém o referente pronominal implícito do texto.
- source_word: መርዓቱ
  choice: sua nora
  rationale: No contexto, designa Tamar pela relação familiar com Judá; 'nora' é o equivalente português natural.
- source_word: ንበሪ፡ ቤተ፡ አቡኪ
  choice: Fique na casa de seu pai
  rationale: Imperativo feminino singular expresso em português corrente e digno.
- source_word: እንዘ
  choice: enquanto...
  rationale: A fonte fornecida termina nesta conjunção circunstancial; as reticências sinalizam honestamente a interrupção do segmento sem suprir material ausente.
theological_decisions:
- issue: Agente da morte
  choice: ele o matou
  alternative: o SENHOR o matou
  rationale: Mantém a estrutura pronominal do texto fornecido e sua ligação imediata com 'o SENHOR', sem explicitar além da forma da fonte.
- issue: Conteúdo posterior à conjunção final
  choice: não completar a frase
  alternative: acrescentar 'como viúva até que meu filho Selá cresça'
  rationale: O trecho ge'ez apresentado termina em እንዘ ('enquanto/ao passo que'); completar a oração importaria conteúdo não presente no segmento fornecido.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. Conserva a abertura fragmentária, que continua uma oração anterior, e encerra com reticências porque a fonte fornecida está truncada.
