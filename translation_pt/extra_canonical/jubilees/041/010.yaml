  text: And she sat at the entrance that is on the road to Timnah. And as Judah was going, he found her.
translation:
  language: pt
  text: E ela se sentou[a] à entrada que fica no caminho de Timna. E, enquanto Judá ia passando, ele a encontrou[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “permaneceu”.'
    reason: O verbo pode ter o sentido mais amplo de ficar ou permanecer, embora “sentou-se” seja mais preciso neste contexto.
  - marker: b
    text: 'Ou: “deparou com ela”.'
    reason: A alternativa explicita que Judá a encontrou ao passar, sem implicar que a procurava.
lexical_decisions:
- source_word: ወነበረት (wa-nabarat)
  choice: E ela se sentou
  rationale: Neste contexto narrativo, o verbo indica que ela tomou assento naquele lugar; a formulação também corresponde ao cenário do paralelo em Gênesis 38:14. A nota preserva o sentido possível mais geral de permanência.
- source_word: ውስተ አንቀጽ (wəsta ʾanqaṣ)
  choice: à entrada
  rationale: Expressa de modo natural o local junto à entrada ou abertura mencionada pelo texto.
- source_word: ፍኖተ ቴምናታ (fənota Tēmnatā)
  choice: caminho de Timna
  rationale: A construção designa a estrada ou o caminho que conduz a Timna; a forma portuguesa tradicional e clara do topônimo é “Timna”.
- source_word: እንዘ የሐውር (ʾənza yaḥawər)
  choice: enquanto Judá ia passando
  rationale: Reproduz a ação em curso de Judá e deixa claro que ele se deslocava pelo caminho quando a avistou.
- source_word: ረከባ (rakabā)
  choice: ele a encontrou
  rationale: O verbo tem a força básica de encontrar ou deparar com alguém. “Encontrou” mantém essa força sem sugerir necessariamente um encontro combinado ou mútuo.
