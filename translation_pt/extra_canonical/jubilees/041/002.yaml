  yaml_path: translation/extra_canonical/jubilees/041/002.yaml
  text: For Er his firstborn he took a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.
translation:
  language: pt
  text: Tomou para Er, seu primogênito, uma esposa dentre as filhas de Arã, e o nome dela era Tamar. Mas Er a odiou e não se deitou com ela, porque sua mãe era das filhas de Canaã, e ele queria tomar para si uma esposa da parentela de sua mãe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ
  choice: uma mulher
  rationale: O termo designa mulher ou esposa; no contexto da ação de tomá-la para Er, «uma mulher» conserva a formulação do texto sem tornar a frase pouco natural.
- source_word: አዋልደ፡ አራም
  choice: filhas de Arã
  rationale: Mantém literalmente a expressão genealógica do ge'ez, entendida como mulheres do povo ou da linhagem de Arã.
- source_word: ጸልአ
  choice: rejeitou
  rationale: O verbo pode expressar ódio ou aversão; «rejeitou» comunica aqui a recusa concreta de Er sem intensificar indevidamente seu estado emocional.
- source_word: ኢሰከበ፡ ምስሌሃ
  choice: não se deitou com ela
  rationale: Reproduz de modo digno e claro o eufemismo sem apagar sua referência sexual.
- source_word: ነገደ፡ እሙ
  choice: parentela de sua mãe
  rationale: Expressa o grupo de parentesco ou linhagem materna em português corrente e preserva o sentido coletivo.
theological_decisions:
- issue: Sujeito de «rejeitou» e dos verbos seguintes
  choice: Explicitar «Er» na segunda frase
  alternative: Manter apenas «ele», permitindo possível referência ao pai
  rationale: A sequência narrativa e o motivo ligado à mãe apontam para Er como sujeito; explicitar o nome evita ambiguidade pronominal criada em português pelo sujeito da oração anterior.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa natural. «Arã» e «Canaã» seguem as formas bíblicas usuais; a linguagem evita tanto arcaísmos quanto explicitação sexual mais gráfica que a fonte.
