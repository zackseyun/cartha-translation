  text: And in the fifth year of this week, Shua, the wife of Judah, died. And in the sixth year Judah went up to shear his sheep at Timnah, and they told Tamar, saying, “Behold, your father-in-law is going up to Timnah to shear.”
translation:
  language: pt
  text: 'No quinto ano dessa semana, Sua, mulher de Judá, morreu. No sexto ano, Judá subiu a Timna para tosquiar suas ovelhas, e disseram a Tamar: “Eis que seu sogro está subindo a Timna para tosquiar.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘዝሱባዔ
  choice: dessa semana
  rationale: O demonstrativo ge’ez indica a semana em questão, não especificamente a sétima semana.
- source_word: ዐርገ
  choice: subiu
  rationale: Preserva o verbo de movimento do texto-fonte e corresponde ao modo natural de descrever a ida a Timna.
- source_word: ይቅርጽ አባግዒሁ
  choice: para tosquiar suas ovelhas
  rationale: Traduz explicitamente o propósito e o objeto presentes na primeira ocorrência.
- source_word: ይቅርጽ
  choice: para tosquiar
  rationale: Na repetição final, o objeto não aparece no ge’ez; a formulação concisa conserva essa característica, embora as ovelhas estejam claramente subentendidas.
- source_word: ሐሙኪ
  choice: seu sogro
  rationale: Expressa em português corrente a relação familiar de Judá com Tamar indicada pelo termo ge’ez.
