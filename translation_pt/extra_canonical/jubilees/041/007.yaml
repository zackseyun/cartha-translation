  yaml_path: translation/extra_canonical/jubilees/041/007.yaml
  text: Remain a widow until my son Shelah grows up, and I will give you to him as a wife. And he grew up, but Bedsu’el, Judah’s wife, did not let Shelah her son to marry, and Bed[su'el] died.
translation:
  language: pt
  text: “Permaneça viúva até que meu filho Selá cresça, e eu a darei a ele por esposa.” Ele cresceu, mas Bedsu’el, mulher de Judá, não permitiu que seu filho Selá se casasse, e Bed[su’el][a] morreu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge’ez preservado traz apenas “Bed”; o restante do nome foi completado com base em “Bedsu’el”, mencionado pouco antes.
    reason: Esclarece uma forma truncada no manuscrito sem ocultar a reconstrução editorial.
lexical_decisions:
- source_word: ትመዐስቢ
  choice: Permaneça viúva
  rationale: O verbo exprime especificamente a permanência no estado de viuvez, e não apenas a ideia genérica de esperar.
- source_word: ይልህቅ / ወልህቀ
  choice: cresça / Ele cresceu
  rationale: Preserva a repetição lexical e a progressão narrativa do crescimento futuro de Selá para seu efetivo amadurecimento.
- source_word: እሁበኪ፡ ሎቱ፡ ብእሲተ
  choice: eu darei você a ele por esposa
  rationale: Reproduz de modo claro a construção de dar a mulher ao filho como esposa, sem suavizar a agência patriarcal do texto antigo.
- source_word: ወኢኀደገት ... ከመ፡ ያውስብ
  choice: não permitiu ... que se casasse
  rationale: Expressa a proibição ou impedimento indicado pelo original, mantendo sem objeto explícito o verbo relativo ao casamento.
- source_word: ቤድ
  choice: Bed[su’el]
  rationale: O texto preservado termina na forma truncada “Bed”; os colchetes identificam com transparência a restauração provável do nome mencionado anteriormente.
