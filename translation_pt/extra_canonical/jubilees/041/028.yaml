  yaml_path: translation/extra_canonical/jubilees/041/028.yaml
  text: For he went in the innocence of his eyes and sought judgment, because by the judgment of Abraham, which he commanded his sons, Judah desired that she be burned with fire.
translation:
  language: pt
  text: Pois ele agiu na inocência de seus olhos[a] e buscou julgamento, porque, segundo o julgamento de Abraão[b], o qual havia ordenado isso aos seus filhos, Judá quis que ela fosse queimada no fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na simplicidade de seus olhos”.'
    reason: O termo ge'ez pode denotar inocência, simplicidade ou integridade.
  - marker: b
    text: 'Literalmente: “do julgamento de Abraão”.'
    reason: Registra o valor mais literal da preposição ge'ez, enquanto o texto principal expressa sua função contextual de base normativa.
lexical_decisions:
- source_word: በየውሀተ፡ አዕይንቲሁ
  choice: na inocência dos seus olhos
  rationale: የውሀት expressa inocência, simplicidade ou integridade; a formulação mantém a imagem do texto-fonte sem introduzir a ideia incorreta de desejo.
- source_word: ሖረ
  choice: procedeu
  rationale: Embora o verbo signifique literalmente “foi/andou”, “procedeu” comunica naturalmente, neste contexto, a maneira como Judá agiu.
- source_word: ኀሠሠ፡ ኵነኔ
  choice: buscou julgamento
  rationale: Preserva a linguagem judicial do original e a ação deliberada de procurar uma sentença.
- source_word: እምፍተሐ፡ አብርሃም
  choice: segundo o julgamento de Abraão
  rationale: A preposição እም é literalmente “de/desde”, mas aqui introduz a base normativa da decisão; “segundo” é idiomático e mantém a relação jurídica.
- source_word: ይውዐይ፡ በእሳት
  choice: fosse queimada no fogo
  rationale: Reproduz a construção passiva e a menção explícita ao fogo presentes no texto ge'ez.
theological_decisions:
- issue: Caracterização da conduta de Judá
  choice: na inocência dos seus olhos
  alternative: segundo o desejo dos seus olhos
  rationale: O substantivo ge'ez indica inocência/simplicidade, não desejo. A tradução preserva a apresentação justificadora da conduta de Judá sem intensificá-la para uma afirmação absoluta de impecabilidade.
- issue: Autoridade do julgamento atribuído a Abraão
  choice: segundo o julgamento de Abraão
  alternative: a partir do julgamento de Abraão
  rationale: A escolha apresenta o julgamento de Abraão como norma ou fundamento da decisão, sem acrescentar uma teoria específica sobre sua autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. Mantém a imagem semítica “inocência dos seus olhos”, esclarecendo sua amplitude lexical em nota, e conserva o vocabulário judicial do original.
