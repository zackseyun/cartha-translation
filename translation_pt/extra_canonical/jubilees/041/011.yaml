  text: And he thought her to be a prostitute and said to her, “Let me come in to you,” and she said to him, “Come,” and he went in. And she said to him,
translation:
  language: pt
  text: 'Ele a tomou por prostituta e lhe disse: “Deixe-me entrar em você”[a]. Ela respondeu: “Venha.” Então ele entrou. E ela lhe disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Deixe-me ir até você”. O verbo “entrar” pode ser uma alusão à relação sexual.'
    reason: Preserva uma alternativa mais indireta, enquanto o texto principal mantém o verbo ge'ez “entrar” e sua possível força eufemística no contexto.
lexical_decisions:
- source_word: ተሐዘባ (taḥazaba)
  choice: tomou por
  rationale: Expressa que ele a considerou ou supôs ser prostituta, sem sugerir que a reconheceu corretamente como tal.
- source_word: ዘማዊት (zamāwit)
  choice: prostituta
  rationale: Equivalente direto e corrente para a designação feminina no contexto.
- source_word: እባእ ኀቤኪ (ʾebāʾ ḫabēki)
  choice: Deixe-me ir até você
  rationale: Mantém a fala na primeira pessoa — um pedido para ele se aproximar dela — e evita transformá-la numa ordem dirigida à mulher.
- source_word: ባእ / ቦአ (bāʾ / boʾa)
  choice: Venha / entrou
  rationale: Reproduz a repetição do verbo de movimento, com formas naturais em português para a resposta dela e a ação dele.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formulação natural e sem explicitar além do texto a conotação sexual da fala. A oração final permanece incompleta, como no versículo-fonte, pois introduz a fala do versículo seguinte.
