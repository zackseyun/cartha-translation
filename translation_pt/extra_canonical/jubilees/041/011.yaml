  to: 'Ele a tomou por prostituta e lhe disse: “Deixe-me entrar em você”[a]. Ela respondeu: “Venha.” Então ele entrou. E ela lhe disse:'
  rationale: A revisão restitui “entrar”, exigido pelo verbo ge'ez, e conserva a primeira pessoa do pedido dirigido à mulher. Mantém-se a formulação narrativa, o sentido de suposição em “tomou por prostituta” e o final suspenso que introduz a fala seguinte.
