  yaml_path: translation/extra_canonical/jubilees/041/027.yaml
  text: And by this he will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.
translation:
  language: pt
  text: E, por meio disso, ele afastará de Israel a ira e o castigo. E dissemos a Judá que nenhum dos seus dois filhos havia se deitado com ela; por isso, sua descendência foi estabelecida para outra tribo e não foi extirpada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበእሊአሁ
  choice: E, por meio disso
  rationale: Preserva a relação instrumental expressa pela preposição, sem reduzir a expressão a uma simples sequência temporal.
- source_word: ያነድግ
  choice: afastará
  rationale: Comunica de modo natural a ideia de fazer cessar ou remover algo de sobre Israel.
- source_word: መዐተ፡ መመቅሠፍተ
  choice: a ira e o castigo
  rationale: Mantém os dois substantivos coordenados e sua distinção sem intensificação interpretativa.
- source_word: ነገሮሙ
  choice: dissemos
  rationale: Conserva a primeira pessoa do plural do texto e o enquadramento narrativo do livro, em vez de convertê-la em uma passiva impessoal.
- source_word: ክልኤሆሙ፡ ደቂቁ
  choice: nenhum dos seus dois filhos
  rationale: Expressa em português corrente que a negação se aplica aos dois filhos considerados individualmente.
- source_word: ዘርአ
  choice: descendência
  rationale: Neste contexto genealógico, traduz o sentido de 'semente' como linhagem ou posteridade.
- source_word: ቆመ፡ ... ነገደ
  choice: foi estabelecida como outra tribo
  rationale: Preserva a imagem de a descendência permanecer e constituir uma tribo distinta, sem especificar além do texto.
- source_word: ወኢይሤረወ
  choice: e não foi extirpada
  rationale: Retém a metáfora de arrancar pela raiz em formulação portuguesa digna e inteligível.
theological_decisions:
- issue: Voz narrativa na declaração dirigida a Judá
  choice: dissemos
  alternative: foi dito
  rationale: A forma de primeira pessoa do plural deve permanecer explícita, pois integra a moldura narrativa de Jubileus; a passiva impessoal apagaria essa característica.
- issue: Continuidade da linhagem de Judá
  choice: sua descendência foi estabelecida como outra tribo
  alternative: sua descendência foi preservada para outra tribo
  rationale: A redação mantém a tensão entre estabelecimento e identidade tribal sem transformar a frase em uma afirmação teológica mais específica sobre preservação providencial.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A sintaxe acompanha de perto as relações do texto ge'ez, mas evita literalismos pouco naturais. A primeira pessoa do plural foi preservada deliberadamente.
