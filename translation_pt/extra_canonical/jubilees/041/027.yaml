  verdict: revise
  source_fidelity: A tradução preserva bem a relação instrumental inicial, o futuro de «afastará», a primeira pessoa do plural em «dissemos», a negação aplicada aos dois filhos e a imagem final de não ser extirpada. Contudo, «como outra tribo» altera a relação indicada pelo texto, que diz literalmente que a descendência foi estabelecida «para outra tribo».
  naturalness: O português é claro, moderno e de registro apropriadamente solene. A formulação revista conserva essa fluência e torna mais explícita a relação de finalidade/destinação presente no original.
  terminology: «Ira», «castigo», «descendência» e «extirpada» são escolhas adequadas. «Para outra tribo» é preferível a «como outra tribo», pois evita afirmar uma identidade tribal que a construção-fonte não explicita da mesma maneira.
