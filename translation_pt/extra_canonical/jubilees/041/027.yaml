    issue: «foi estabelecida como outra tribo»
    rationale: O ge'ez traz a preposição equivalente a «para» antes de «outra tribo». «Como» pode sugerir que a descendência se tornou uma tribo distinta; «para outra tribo» preserva a relação mais ambígua do original e do audit trail inglês («for another tribe»).
