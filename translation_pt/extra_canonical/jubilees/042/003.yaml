  text: in the seven years of abundance and had kept it. And the Egyptians came to Joseph so that he might give them food, and he opened the storehouses where the grain of the former years was, and sold it to the peoples of the land for gold.
translation:
  language: pt
  text: nos sete anos de abundância, ele o havia ajuntado e guardado. Então os egípcios[a] vieram a José para que lhes desse alimento. Ele abriu os depósitos onde estava o cereal dos anos anteriores e o vendeu aos povos da terra em troca de ouro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o Egito”.'
    reason: O texto traz o nome “Egito” em sentido coletivo, acompanhado de formas verbais e pronominais no plural.
lexical_decisions:
- source_word: ግብጽ
  choice: os egípcios
  rationale: Embora o substantivo designe literalmente “Egito”, o verbo “vieram” e o pronome “lhes” estão no plural; a forma gentílica comunica naturalmente o sentido coletivo.
- source_word: ሲሲተ
  choice: alimento
  rationale: Termo geral para sustento ou provisão alimentar; “alimento” mantém a amplitude sem restringi-lo indevidamente ao cereal mencionado depois.
- source_word: መዛግብተ
  choice: depósitos
  rationale: Designa lugares de armazenamento; “depósitos” é claro e corrente em português.
- source_word: ስርናይ
  choice: cereal
  rationale: O termo indica grão/cereal; “cereal” evita a possível leitura de grãos individuais e se ajusta ao contexto de reservas alimentares.
- source_word: ዘቀዳሚ፡ ዓመት
  choice: dos anos anteriores
  rationale: Expressa de modo natural que o cereal provinha dos anos precedentes, sem sugerir apenas os primeiros anos de uma série.
- source_word: በወርቅ
  choice: em troca de ouro
  rationale: በወርቅ significa literalmente “por/com ouro”; no contexto de venda, “em troca de ouro” torna explícita a função do ouro como pagamento.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. Conservou-se o início fragmentário por sua ligação direta com o versículo anterior. O marcador [a] aparece imediatamente após “os egípcios”.
