lexical_decisions:
- source_word: በቀዳሚ፡ ዓመት፡
  choice: no primeiro ano
  rationale: Reproduz diretamente a expressão temporal do ge’ez em português natural.
- source_word: ዘሱባዔ፡ ሣልስ፡
  choice: da terceira semana
  rationale: Mantém a terminologia cronológica característica de Jubileus, em que cada semana corresponde a um período de sete anos.
- source_word: ዘ፵ወ፭፡ ኢዮቤልው፡
  choice: do quadragésimo quinto jubileu
  rationale: Conserva a numeração e o termo técnico do sistema cronológico da obra.
- source_word: እንዘ፡ ዐባር፡ ይምጻእ፡
  choice: enquanto a fome chegava
  rationale: Preserva o aspecto progressivo da construção circunstancial e evita antecipar uma fome já plenamente instalada.
- source_word: ውስተ፡
  choice: à terra
  rationale: A preposição indica movimento para dentro; o substantivo regido parece estar na continuação do texto, e “terra” é sustentado pelo contexto e pela tradição textual consultiva.
