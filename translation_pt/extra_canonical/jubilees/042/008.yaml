lexical_decisions:
- source_word: አሕስሊሆሙ
  choice: os sacos deles
  rationale: O termo se refere aos recipientes de provisões pertencentes aos irmãos; a expressão possessiva explícita preserva o sentido do sufixo ge'ez.
- source_word: ኢያእመሩ
  choice: sem que soubessem
  rationale: Expressa naturalmente em português a negação do conhecimento deles, mantendo a ligação circunstancial com a ação anterior.
- source_word: አዘዞሙ
  choice: ordenou-lhes
  rationale: Mantém a força volitiva do verbo e identifica os irmãos como destinatários da ordem.
- source_word: እኅዋሆሙ
  choice: o irmão mais novo
  rationale: O contexto narrativo indica o irmão que permanecera com o pai; a formulação segue a leitura contextual preservada pela tradição textual consultada.
