  text: He sent his brothers away, and he filled their sacks with grain, and he also put their money for them.
translation:
  language: pt
  text: Ele mandou seus irmãos embora, encheu de cereal os sacos deles e também deixou para eles o dinheiro[a] deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «o ouro deles».
    reason: Registra o sentido concreto de ወርቅ, enquanto o texto principal emprega o sentido contextual «dinheiro».
lexical_decisions:
- source_word: ስርናየ
  choice: cereal
  rationale: O termo designa grão ou cereal; «cereal» é natural e evita especificar uma espécie não indicada no texto.
- source_word: ወርቆሙ
  choice: o dinheiro deles
  rationale: Embora ወርቅ signifique literalmente «ouro», também pode designar dinheiro; o contexto comercial favorece «dinheiro», sem harmonizar indevidamente com a «prata» de Gênesis 42:25.
- source_word: ደየ፡ ሎሙ
  choice: deixou para eles
  rationale: Reproduz de modo natural a ideia de pôr ou deixar algo para alguém, mantendo o valor benefactivo de ሎሙ («para eles») sem acrescentar que o dinheiro foi posto dentro dos sacos.
