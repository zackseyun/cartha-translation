  yaml_path: translation/extra_canonical/jubilees/042/009.yaml
  text: And they went up from the land of Egypt and came to the land of Canaan, and they told their father everything that had happened to them, and how the ruler of the land had spoken harshly with them and had seized Simeon until...
translation:
  language: pt
  text: Eles subiram da terra do Egito e chegaram à terra de Canaã. Contaram ao pai tudo o que lhes havia acontecido e como o governante da terra lhes falara com dureza e havia prendido Simeão até que...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase continua no versículo seguinte.
    reason: O texto ge’ez termina este versículo com uma conjunção temporal que introduz uma oração ainda não concluída.
lexical_decisions:
- source_word: ወአፎ (waʾafo)
  choice: e como
  rationale: Expressa a maneira ou as circunstâncias relatadas, preservando o sentido de “como”, em vez de transformar a oração em simples afirmação com “que”.
- source_word: መኰንነ፡ ብሔር
  choice: o governante da terra
  rationale: Reproduz de modo claro e natural o título da autoridade territorial, sem especificar um cargo não indicado pelo texto.
- source_word: ዐጹባጺበ
  choice: com dureza
  rationale: Comunica fala severa ou áspera em português corrente e digno.
- source_word: ወአሐዘ፡ ለስምዖን
  choice: e havia prendido Simeão
  rationale: O verbo pode significar tomar, agarrar ou deter; “prendido” exprime naturalmente a custódia coercitiva no contexto.
- source_word: እስከ፡ ሶበ
  choice: até que...
  rationale: A expressão introduz uma oração temporal cuja continuação está no versículo seguinte; as reticências preservam a frase deliberadamente incompleta no limite do versículo.
