translation:
  language: pt
  text: 'que trouxessem Benjamim. E Jacó disse: “Vocês me deixaram sem filhos: José já não existe, e Simeão também já não existe...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያመጽእዎ፡ ለብንያም
  choice: que trouxessem Benjamim
  rationale: Expressa de modo natural a construção verbal de trazer seguida do objeto Benjamim, preservando a ligação sintática com o contexto anterior.
- source_word: እምከንከሙኒከ
  choice: Vocês me deixaram sem filhos
  rationale: Traduz o sentido causativo de privar alguém de seus filhos; a formulação corrente comunica a acusação de Jacó sem restringi-la necessariamente à morte comprovada.
- source_word: ኢሀሎ
  choice: já não existe
  rationale: Reproduz a expressão de ausência ou perda com naturalidade em português, sem afirmar além do texto se José estava morto ou apenas desaparecido.
- source_word: ወስምዖንሂ
  choice: e Simeão também
  rationale: Mantém o valor aditivo e enfático da partícula ligada ao nome de Simeão.
theological_decisions:
- issue: A condição de José e Simeão
  choice: já não existe
  alternative: morreu / está morto
  rationale: A expressão fonte declara que eles não estão ou já não existem na perspectiva de Jacó, mas não exige uma determinação explícita de morte; a tradução preserva essa tensão narrativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas nominais bíblicas correntes no Brasil. A fala conserva a força emocional de Jacó e a repetição do original.
