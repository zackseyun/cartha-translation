  yaml_path: translation/extra_canonical/jubilees/042/005.yaml
  text: And Joseph recognized them, but they did not recognize him. And he spoke harshly with them and said to them, “Are you not spies, and have you come to observe the exposed parts of the land?”
translation:
  language: pt
  text: 'José os reconheceu, mas eles não o reconheceram. Então falou com eles duramente e lhes disse: “Não são vocês espiões? Não vieram observar as partes desprotegidas da terra?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእመሮሙ / ኢያእመርዎ
  choice: os reconheceu / não o reconheceram
  rationale: No contexto de um reencontro entre pessoas que já se conheciam, o sentido é reconhecer a identidade, não apenas conhecer.
- source_word: ዐጹባጺበ
  choice: duramente
  rationale: Reproduz de modo natural o tom áspero ou severo da fala de José.
- source_word: ሰብአ ዓይን
  choice: espiões
  rationale: A expressão etíope literalmente relacionada a “homens do olho” funciona idiomaticamente como designação de observadores ou espiões; a tradução direta seria obscura em português.
- source_word: ጸባረ ምድር
  choice: as partes desprotegidas da terra
  rationale: Preserva a imagem de áreas expostas ou vulneráveis do território sem recorrer à formulação pouco natural “nudez da terra”.
