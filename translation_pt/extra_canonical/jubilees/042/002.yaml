  text: And the rain was withheld from the land, because there was no shower that came down. And the land became barren, but in the land of Egypt alone there was food, because Joseph had gathered seed for the land
translation:
  language: pt
  text: E a chuva foi retida na terra[a], pois não descia chuva alguma. A terra ficou estéril, mas somente na terra do Egito havia alimento, porque José havia reunido semente para a terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a chuva recusou-se a ser dada”.
    reason: Registra a personificação e o caráter idiomático da formulação ge'ez, que seriam pouco naturais no texto principal.
lexical_decisions:
- source_word: ወአበየ፡ ዝናም፡ ተውህቦ
  choice: E a chuva foi impedida de cair
  rationale: Expressa em português natural a ideia de a chuva ter sido recusada ou retida, preservando na nota a personificação literal do ge'ez.
- source_word: ምትነ፡ ዘይወርድ
  choice: chuva alguma
  rationale: No contexto da seca, comunica com clareza que nenhuma precipitação descia, sem introduzir uma distinção meteorológica incerta.
- source_word: ዐብረተ፡ ምድር
  choice: A terra ficou estéril
  rationale: Traduz o resultado da falta de chuva em linguagem direta e digna.
- source_word: ሲሲተ
  choice: alimento
  rationale: Termo amplo e natural para a provisão disponível no Egito.
- source_word: አስተጋብአ፡ ዮሴፍ፡ ዘርአ
  choice: José havia armazenado sementes
  rationale: O verbo indica reunir ou ajuntar; no contexto da reserva para a fome, 'armazenado' torna explícita a finalidade sem alterar o sentido, e o plural genérico soa natural em português.
