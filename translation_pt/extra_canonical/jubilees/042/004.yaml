  yaml_path: translation/extra_canonical/jubilees/042/004.yaml
  text: And the famine became very severe in the land of Canaan, and Jacob heard that there was grain in Egypt, and he sent ten of his sons to get grain for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.
translation:
  language: pt
  text: A fome se tornou muito grave na terra de Canaã. Jacó soube que havia cereal no Egito e enviou dez de seus filhos para que buscassem para ele cereal no Egito. Mas não enviou Benjamim. E os dez filhos de Jacó chegaram ao Egito com os viajantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረኃብ
  choice: fome
  rationale: Corresponde diretamente à ideia de escassez generalizada e preserva a ligação narrativa com a fome em Canaã.
- source_word: ሲሲት
  choice: cereal
  rationale: No contexto da viagem ao Egito para obter provisões, designa grãos/cereais; “cereal” é natural, preciso e não amplia o sentido para alimento em geral.
- source_word: ዘየሐውር
  choice: os que viajavam para lá
  rationale: Expressa o grupo de viajantes com quem os filhos de Jacó chegaram, explicitando apenas o destino já indicado pelo contexto, sem identificar indevidamente uma caravana.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e compreensão internacional. A repetição de “cereal” preserva a recorrência lexical do texto-fonte; as frases mantêm a progressão narrativa sem acrescentar explicações.
