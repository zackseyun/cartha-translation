  yaml_path: translation/extra_canonical/jubilees/021/002.yaml
  text: And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, seeking with all my heart to do his will.
translation:
  language: pt
  text: E eis que tenho cento e setenta e cinco anos e, durante todos os dias da minha vida, tenho me lembrado do Senhor, procurando de todo o coração fazer a vontade dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ
  choice: E eis que
  rationale: Preserva a partícula narrativa e o chamado enfático à atenção, em registro bíblico ainda compreensível.
- source_word: ወልደ፡ ምእት፡ ወሰብዓ፡ ወኃምስቱ፡ ዓመት
  choice: tenho cento e setenta e cinco anos
  rationale: Expressa de modo natural em português a declaração etária do texto ge'ez.
- source_word: ወበኵሉ፡ መዋዕለ፡ ሕይወትየ
  choice: durante todos os dias da minha vida
  rationale: Mantém a abrangência temporal explícita do original.
- source_word: ሀሎኩ፡ እንዘ፡ እዜከር፡ ለእግዚአብሔር
  choice: tenho me lembrado do Senhor
  rationale: Reproduz a construção durativa e o sentido direto de recordar-se do Senhor, sem substituí-lo por uma interpretação mais abstrata.
- source_word: ወእንዘ፡ አኀሥሥ፡ በኵሉ፡ ልብየ
  choice: procurando de todo o coração
  rationale: Traduz a ideia de buscar ou empenhar-se com o coração inteiro em linguagem portuguesa natural.
- source_word: ከመ፡ እግበር፡ ፈቃደቲሁ
  choice: fazer a vontade dele
  rationale: Mantém de forma direta a finalidade expressa no original e torna inequívoca em português a referência pronominal ao Senhor.
theological_decisions:
- issue: Natureza da lembrança do Senhor
  choice: tenho me lembrado do Senhor
  alternative: tenho permanecido atento ao Senhor
  rationale: A escolha conserva o sentido lexical de lembrar sem transformar a frase numa afirmação teológica mais específica sobre devoção ou fidelidade.
- issue: Busca de fazer a vontade divina
  choice: procurando de todo o coração fazer a vontade dele
  alternative: buscando com todo o meu coração cumprir a sua vontade
  rationale: A formulação preserva o empenho, sem sugerir que o personagem alegue ter cumprido perfeitamente a vontade divina.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Conserva-se «e eis que» pelo valor enfático e narrativo; «tenho me lembrado» comunica a ação continuada até o presente sem rigidez excessiva.
