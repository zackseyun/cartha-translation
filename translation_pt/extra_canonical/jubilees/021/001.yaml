  yaml_path: translation/extra_canonical/jubilees/021/001.yaml
  text: And in the sixth year of the seventh week of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and I am full of my days.”
translation:
  language: pt
  text: 'E no sexto ano da sétima semana deste jubileu, Abraão chamou seu filho Isaque e lhe deu instruções, dizendo: “Eu envelheci, não sei o dia da minha morte e já estou farto de dias.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “já estou saciado de dias”.'
    reason: Registra uma tradução mais literal do idioma que indica idade avançada e uma vida longa.
lexical_decisions:
- source_word: ሱባዔ
  choice: semana
  rationale: O termo designa aqui uma unidade de sete anos no esquema cronológico de Jubileus; ‘semana’ preserva a forma tradicional sem acrescentar uma explicação ausente no texto.
- source_word: አዘዞ
  choice: lhe deu instruções
  rationale: Expressa o sentido de ordenar ou instruir no contexto de orientações paternas, com naturalidade em português e sem enfraquecer a autoridade do verbo.
- source_word: ረሳዕኩ
  choice: envelheci
  rationale: Reproduz diretamente a declaração de Abraão sobre sua velhice.
- source_word: ጸገብኩ፡ መዋዕልየ
  choice: já estou farto de dias
  rationale: Preserva a primeira pessoa do verbo e o idioma semítico de ter vivido uma longa vida; ‘já’ torna natural em português o estado resultante no contexto.
theological_decisions:
- issue: Sentido da cláusula final sobre os dias de Abraão
  choice: já estou farto de dias
  alternative: meus dias se cumpriram
  rationale: A forma verbal é de primeira pessoa singular, literalmente ‘estou farto/saciado’, e não afirma diretamente que os dias, como sujeito, foram cumpridos; a tradução mantém a imagem e a tensão diante da morte ainda desconhecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cronologia foi mantida de forma concisa, e o idioma final foi preservado em vez de ser substituído por uma interpretação explicativa.
