base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/015.yaml
  text: Keep this command and do it[15], my son, so that you may walk rightly in all your deeds. And at all times be pure in your body, and wash yourself with water before you go up to offer on the altar; and wash your hands and your feet before you approach the altar; and when you have finished offering, return.
translation:
  language: pt
  text: Guarda este mandamento e cumpre-o[15], meu filho, para procederes corretamente em todas as tuas ações. Em todo momento, mantém o teu corpo puro e lava-te com água antes de subires para oferecer sobre o altar. Lava também as mãos e os pés antes de te aproximares do altar; e, quando terminares de oferecer, volta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: A numeração dos versículos nas linhas da fonte parece saltar do v. 15 para o v. 17. Não se fornece um v. 16 separado, pois a segmentação ge'ez fornecida não contém uma linha distinta para ele.
    reason: nota_de_segmentação
lexical_decisions:
- source_word: ዑቅ፡ ዛተእዛዘ፡ ወገብራ፡
  choice: Guarda este mandamento e cumpre-o
  rationale: Reproduz os dois imperativos — conservar/observar e fazer/cumprir — em português natural e digno.
- source_word: ታርትዕ፡ በኵሉ፡ ግብርከ
  choice: para procederes corretamente em todas as tuas ações
  rationale: Expressa a ideia de agir ou caminhar retamente em tudo o que se faz, sem restringir o sentido a atos rituais.
- source_word: ኩን፡ ንጹሐ፡ በሥጋከ
  choice: mantém puro o teu corpo
  rationale: Preserva a ordem sobre pureza corporal; 'mantém' soa mais natural em português do que uma reprodução rígida de 'sê' neste contexto contínuo.
- source_word: ለአዕርጎ፡ ውስተ፡ ምሥዋዕ
  choice: antes de subires para oferecer sobre o altar
  rationale: Mantém o movimento ascendente do verbo e a associação da oferta com o altar.
- source_word: ግባእ
  choice: volta
  rationale: O imperativo de ገብአ tem aqui o sentido de voltar/retornar, não de entrar.
theological_decisions:
- issue: Natureza da pureza exigida
  choice: mantém puro o teu corpo
  alternative: sê puro na tua carne
  rationale: A tradução conserva a dimensão corporal e ritual explícita no texto, sem ampliá-la para uma doutrina geral de pureza moral nem reduzi-la apenas à higiene.
- issue: Relação entre oferta e altar
  choice: oferecer sobre o altar
  alternative: levar a oferta ao altar
  rationale: A formulação segue de perto o movimento e a ação cultual do texto sem especificar uma oferta ou procedimento que a fonte não nomeia.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa do singular coerentes com a fala paterna dirigida a 'meu filho'. Preferiu-se 'ações' a 'obras' para legibilidade ampla, preservando o tom instrutivo e ritual.
