  text: And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of them.
translation:
  language: pt
  text: E ponha sal em todas as suas ofertas; não deixe faltar em nenhuma delas o sal da aliança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: suas ofertas
  rationale: O termo designa aquilo que é apresentado sacrificialmente; “ofertas” é natural em português e mantém a abrangência do contexto cultual.
- source_word: ፄወ
  choice: sal
  rationale: Equivalente direto e inequívoco do termo ge’ez.
- source_word: ፄወ፡ ኪዳን
  choice: sal da aliança
  rationale: Preserva a construção nominal e sua associação teológica sem explicar além do texto.
- source_word: ኢይደሪዕ
  choice: não deixe faltar
  rationale: Expressa naturalmente a proibição de que o sal esteja ausente, preservando o sentido do verbo no contexto.
theological_decisions:
- issue: Sentido de “sal da aliança”
  choice: Manter literalmente “sal da aliança”
  alternative: Explicitar como “sal que simboliza a aliança”
  rationale: O texto não explica a relação entre sal e aliança; a formulação literal preserva a tensão e evita impor uma interpretação ritual ou simbólica.
translation_notes:
  register: Português moderno, digno e claro, com imperativo natural. A repetição de “sal” foi mantida por corresponder à ênfase do original; “em nenhuma delas” torna explícita em português a referência final a todas as ofertas.
