  text: and to walk uprightly in all his paths. My soul hated idols, that I might observe to do
translation:
  language: pt
  text: e de andar retamente em todos os seus caminhos. Minha alma odiou os ídolos, para que eu tivesse o cuidado de cumprir[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase continua no versículo seguinte, onde aparece o que Abraão teve o cuidado de cumprir.
    reason: O versículo termina com uma construção incompleta em português porque o objeto do verbo se encontra na continuação textual; a nota evita que essa característica seja confundida com erro.
lexical_decisions:
- source_word: አርትዕ፡ ሐዊረ
  choice: andar retamente
  rationale: Reproduz a ideia de caminhar com retidão, mantendo a metáfora ética dos caminhos.
- source_word: በኵሉ፡ ፍናዊሁ
  choice: em todos os seus caminhos
  rationale: Mantém o plural e o pronome do texto ge'ez sem explicitar um referente que o fragmento não nomeia.
- source_word: ጣዖተ
  choice: os ídolos
  rationale: Equivalente português direto e corrente para imagens ou objetos de culto idolátrico.
- source_word: ጸልአት፡ ነፍስየ
  choice: Minha alma odiou
  rationale: Preserva a formulação enfática sem reduzi-la simplesmente a 'eu odiei'.
- source_word: ከመ፡ እትዐቀብ፡ ለገቢረ
  choice: para que eu tivesse o cuidado de cumprir
  rationale: Expressa o sentido positivo de observar ou cuidar de fazer, respeita a preposição ለ e não introduz a ideia oposta de evitar a ação. 'Cumprir' permite a ligação natural com o objeto apresentado no versículo seguinte.
theological_decisions:
- issue: Referente de “seus caminhos”
  choice: Manter “seus” em minúscula e sem explicitação
  alternative: “os caminhos de Deus” ou “Seus caminhos”
  rationale: O fragmento recebido não nomeia explicitamente o referente; a tradução preserva essa dependência contextual sem acrescentar identificação interpretativa.
- issue: Sentido da cláusula final
  choice: 'Ação positiva: “tivesse o cuidado de cumprir”'
  alternative: “me guardasse de praticá-los”
  rationale: A construção ge'ez aponta para cuidar de fazer algo cujo objeto vem na continuação, não para evitar a prática dos ídolos; a alternativa inverteria o sentido.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe suficientemente formal para o tom escritural. Conservou-se a transição inicial “e de”, pois o versículo é continuação da frase anterior, e manteve-se aberta a cláusula final para respeitar a divisão e a sintaxe da fonte.
