  to: 'e, com a sua oferta de bebida, para aroma agradável, uma oferta de cereal[a] ao Senhor. Coma-se a carne nesse dia e no segundo dia; não se deixe o sol se pôr sobre ela no segundo dia antes que seja comida. Nada dela seja deixado para o terceiro dia, pois não será aceitável: é coisa profana e não deve ser comida. Todos os que a comerem levarão sobre si o seu pecado. Pois assim encontrei escrito no livro dos meus antepassados de outrora e nas palavras de Enoque e nas palavras de Noé.'
