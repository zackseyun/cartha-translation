base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/010.yaml
  text: and with its drink offering, for a pleasing aroma, a grain offering to the Lord. And eat its flesh on that day and on the second day, and do not let the sun go down on it on the second day until it is eaten, and do not leave any of it for the third day, because it is not acceptable, because it is a profane thing, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the book of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.
translation:
  language: pt
  text: 'e, com a sua oferta de bebida, para aroma agradável, uma oferta de cereal[a] ao Senhor. Coma-se a carne nesse dia e no segundo dia; não se deixe o sol se pôr sobre ela no segundo dia antes que seja comida. Nada dela seja deixado para o terceiro dia, pois não será aceitável: é coisa profana e não deve ser comida. Todos os que a comerem levarão sobre si o seu pecado. Pois assim encontrei escrito no livro dos meus antepassados de outrora e nas palavras de Enoque e nas palavras de Noé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «pão de oferta».
    reason: Registra a imagem concreta da expressão ge'ez, enquanto o texto principal emprega o termo sacrificial mais claro em português.
lexical_decisions:
- source_word: ሞጻሕቱ
  choice: a sua oferta de bebida
  rationale: O termo designa a libação que acompanha o sacrifício; foi mantido para não omitir uma das duas ofertas mencionadas no texto.
- source_word: ኅብስተ፡ ጽንሓሕ
  choice: uma oferta de cereal
  rationale: A expressão literalmente ligada a pão/oferta é vertida pelo termo sacrificial corrente e recebe nota para conservar sua forma concreta.
- source_word: መዓዛ፡ ሠናይ
  choice: aroma agradável
  rationale: Expressão sacrificial idiomática, natural em português e semanticamente próxima de 'bom aroma'.
- source_word: እኩይ፡ ኅሩየ
  choice: coisa profana
  rationale: No contexto da carne sacrificada retida além do prazo, comunica sua condição ritual imprópria sem introduzir uma explicação denominacional.
- source_word: ይነሥኡ፡ ... ኃጢአተ፡ ሎሙ
  choice: levarão sobre si o seu pecado
  rationale: Preserva a imagem de carregar a responsabilidade pelo pecado, em vez de reduzi-la apenas a uma declaração abstrata de culpa.
- source_word: ነገረ፡ ሄኖክ / ነገረ፡ ኖኅ
  choice: relato de Enoque / relato de Noé
  rationale: Neste contexto literário, 'relato' expressa melhor uma tradição ou composição atribuída a cada personagem do que o português mais estreito 'palavras'.
theological_decisions:
- issue: Condição da carne no terceiro dia
  choice: é coisa profana e não deve ser comida
  alternative: é uma coisa má escolhida/separada
  rationale: A formulação adotada acompanha o sentido ritual contextual sem transformar a expressão difícil em uma afirmação teológica mais específica do que o texto permite.
- issue: Consequência para quem come a carne proibida
  choice: levarão sobre si o seu pecado
  alternative: incorrerão em culpa
  rationale: A opção formal conserva a tensão entre pecado, culpa e responsabilidade presente na expressão de origem.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção impessoal normativa nas instruções sacrificiais. Mantêm-se explicitamente tanto a oferta de bebida quanto a oferta de cereal, e o singular “livro” do texto-fonte.
