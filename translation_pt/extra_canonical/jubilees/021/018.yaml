  text: Tenha cuidado, meu filho, com o sangue; tenha muito cuidado de cobri-lo na terra. E não o coma de modo algum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐቀብ
  choice: tenha cuidado
  rationale: Reproduz naturalmente em português a exortação repetida do original.
- source_word: ጥቀ
  choice: muito
  rationale: Preserva a intensificação da segunda exortação, sem acrescentar a ideia de pó, ausente no texto ge'ez.
- source_word: ደፍኖ፡ ውስተ፡ ምድር
  choice: cobri-lo na terra
  rationale: Mantém o sentido direto de cobrir o sangue no solo/na terra; o pronome retoma 'sangue'.
- source_word: እንከ
  choice: de modo algum
  rationale: Expressa a força enfática da partícula no contexto da proibição negativa.
theological_decisions:
- issue: Proibição de consumir sangue
  choice: não o coma de modo algum
  alternative: não o coma
  rationale: A formulação enfática representa a partícula እንከ sem ampliar a proibição além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição imperativa foi preservada, e não se introduziu 'pó', elemento ausente no testemunho ge'ez fornecido.
