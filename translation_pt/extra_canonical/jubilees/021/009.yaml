base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/009.yaml
  text: The fat that is on them, and that which is on the entrails, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering.
translation:
  language: pt
  text: Retirarás a gordura que está sobre eles e a que está sobre as entranhas, bem como o fígado com os rins. Oferecerás tudo isso como aroma agradável diante do Senhor, com a sua oferta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መናቅፅ
  choice: entranhas
  rationale: O termo designa as partes internas ou intestinos; «entranhas» é natural no contexto sacrificial e evita a tradução menos precisa «lombos».
- source_word: ትብልእ
  choice: retirarás
  rationale: No encadeamento das instruções sacrificiais, a ação requerida é separar as partes que serão oferecidas; «retirarás» preserva o sentido contextual atestado pela camada de consulta, em vez do valor lexical comum «comerás», que tornaria incoerente a ordem seguinte de oferecer tudo isso.
- source_word: ወታዐርግ
  choice: oferecerás
  rationale: Literalmente, «farás subir»; no contexto, refere-se a fazer subir a oferta no altar, isto é, oferecê-la, provavelmente pela queima.
- source_word: ለመዐዛ፡ ሠናይ
  choice: como aroma agradável
  rationale: Expressão sacrificial que descreve a oferta como produtora de fragrância agradável; a formulação portuguesa é clara e digna.
- source_word: ምስለ፡ መሥዋዕቱ
  choice: com o sacrifício
  rationale: መሥዋዕት designa sacrifício ou oferta sacrificial; não especifica uma oferta de cereais, por isso a tradução não acrescenta essa precisão.
theological_decisions:
- issue: Natureza da oferta mencionada no final
  choice: com o sacrifício
  alternative: com a sua oferta de cereais
  rationale: O substantivo ge'ez é genérico para sacrifício/oferta e não contém indicação lexical de cereais. Mantém-se aberta a natureza exata da oferta, sem harmonização importada.
- issue: Formulação da aceitação divina
  choice: como aroma agradável diante do Senhor
  alternative: como fragrância agradável, aceitável diante do Senhor
  rationale: O original afirma que a oferta produz ou dá bom aroma diante do Senhor, mas não apresenta um adjetivo independente equivalente a «aceitável». A tradução evita explicitar além do texto.
translation_notes:
  register: Português moderno, claro e solene, com terminologia sacrificial acessível. A construção foi dividida em duas frases para legibilidade, sem alterar a sequência das instruções.
