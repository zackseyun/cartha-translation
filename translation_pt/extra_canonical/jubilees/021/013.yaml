base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/013.yaml
  text: '[called] arsatna and besem[13]; but from among these woods place under the sacrifice upon the altar those proven in appearance. And do not place any split or dark wood, but hard and clean wood, without blemish, sound and freshly grown; and do not place old wood[13], because its fragrance has gone out.'
translation:
  language: pt
  text: '[chamadas] arsatna e besem.[a] Dentre essas madeiras, porém, coloque debaixo do sacrifício, sobre o altar, as que se mostrarem aprovadas à vista.[b] Não coloque madeira rachada nem escurecida, mas madeira dura e limpa, sem defeito, íntegra e de crescimento recente. Não coloque madeira velha, pois sua fragrância já se foi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os nomes arsatna e besem são obscuros. Podem designar tipos de árvore, mas sua identificação é incerta, e o texto talvez preserve formas corrompidas ou termos botânicos regionais.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “coloque debaixo do sacrifício as que se mostrarem aprovadas à vista”. A relação sintática entre “sobre o altar” e as expressões vizinhas admite alguma incerteza.'
    reason: previous_rendering
lexical_decisions:
- source_word: አርሳትነ ወቤስም
  choice: arsatna e besem
  rationale: Os nomes botânicos são obscuros e possivelmente estão textualmente corrompidos; a transliteração evita identificações especulativas.
- source_word: ንቁዐ ወፈዋነ
  choice: rachada nem escurecida
  rationale: Conserva os dois qualificativos presentes no ge'ez, sem omitir o segundo.
- source_word: ተከለ
  choice: recém-cortada
  rationale: No contexto de lenha destinada ao altar, expressa de modo natural a ideia de madeira nova ou recente, em contraste com madeira velha.
- source_word: ምትነኒ
  choice: defeito
  rationale: Termo abrangente e natural para uma imperfeição que tornaria a madeira inadequada.
- source_word: ነወረ ፍጹመ
  choice: íntegra
  rationale: Comunica a exigência de madeira sã e completa, sem introduzir precisão técnica indevida.
theological_decisions:
- issue: Qualificação ritual da madeira do altar
  choice: Preservar a sequência concreta de qualidades — dura, limpa, sem defeito, íntegra e recente
  alternative: Resumir como madeira ritualmente pura ou apropriada
  rationale: O texto especifica propriedades da madeira; resumi-las em linguagem teológica importaria uma interpretação não explicitada.
- issue: Localização da madeira em relação ao sacrifício e ao altar
  choice: “debaixo do sacrifício, sobre o altar”
  alternative: “debaixo do sacrifício”
  rationale: Mantém os dois elementos locativos do ge'ez e evita a omissão de “sobre o altar”.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de instrução direta. Mantiveram-se transliterados os nomes botânicos incertos e preservaram-se tanto a ambiguidade sintática quanto todos os qualificativos relevantes do ge'ez.
