  yaml_path: translation/extra_canonical/jubilees/021/012.yaml
  text: 'your offerings before the Lord. And take care with the wood of the offering, that you do not bring wood for the altar in addition to these: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar.'
translation:
  language: pt
  text: 'suas ofertas diante do Senhor. Quanto à madeira para o sacrifício, tenha o cuidado de não levar para o altar madeira além destas espécies: cipreste, abeto, amendoeira, pinheiro, pinheiro-resinoso, cedro, zimbro, clematite, oliveira, murta, loureiro e cedro.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação de várias árvores nesta lista é incerta. O texto usa dois nomes diferentes que podem designar tipos distintos de cedro; por isso, “cedro” aparece duas vezes.
    reason: Sinalizar incerteza botânica genuína e explicar a aparente repetição sem alterar a lista do texto-fonte.
lexical_decisions:
- source_word: መሥዋዕቲከ
  choice: suas ofertas
  rationale: O termo designa sacrifício ou oferta; o plural português acompanha o sentido coletivo exigido pelo contexto da frase, que continua o versículo anterior.
- source_word: ዕፀወ፡ መሥዋዕት
  choice: madeira para o sacrifício
  rationale: Expressa naturalmente a relação entre a madeira e o sacrifício sem confundir መሥዋዕት com o altar.
- source_word: ዕፀወ፡ ምሥዋዕ
  choice: madeira ... para o altar
  rationale: Aqui ምሥዋዕ se refere ao altar, em contraste com መሥዋዕት, 'sacrifício/oferta'.
- source_word: ዲበ፡ ዝንቱ
  choice: além destas espécies
  rationale: 'Mantém a força restritiva da construção: não se deve acrescentar madeira de outras espécies às enumeradas.'
- source_word: ቍጲርሳን ... ቄዳር
  choice: cipreste ... cedro
  rationale: Segue as identificações botânicas mais diretamente sustentadas pela forma dos nomes na tradição textual consultada, preservando inclusive os dois termos distintos vertidos como 'cedro'.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” implícito nas formas “suas” e “tenha”. A redação preserva o caráter fragmentário do início, que continua a frase do versículo anterior, e deixa claro que a lista restringe as espécies permitidas, em vez de proibi-las.
