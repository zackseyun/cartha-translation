base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/020.yaml
  text: And do not accept a bribe or a present for human blood; blood for blood is to be rendered before the Lord, the Most High God. And it will be a good protection for you, so that you may be kept from every evil and so that he may save you from every death. For I see, my son, all the works of the children of men, that all their sin and evil and all their deeds are uncleanness and abomination and defilement, and there is no righteousness with them. Take care not to walk in their ways and not to tread in their paths, and do not sin a sin leading to death before the Most High God, lest he hide his face from you and give you into the hand of your enemies and root you out from the earth, and your seed from under heaven, and destroy your name and your seed from all the earth. Turn away from all their deeds and from all their uncleanness, and keep the charge of the Most High God, and do his will and be upright in everything. And he will bless you in all your deeds, and he will raise up from
    you a plant of righteousness in all the earth throughout all generations of the earth. And my name and your name will not be forgotten under heaven forever. Go, my son, in peace. May the Most High God, my God and your God, strengthen you to do his will; and may he bless all your seed and the remnant of your seed for everlasting generations with every righteous blessing, so that you may become a blessing on all the earth.” And he went out from before him rejoicing.
translation:
  language: pt
  text: 'Pelo sangue que derramou. Não aceite suborno nem presente em troca de sangue humano; sangue por sangue deverá ser entregue diante do Senhor, o Deus Altíssimo. Isso será uma boa proteção para você, para que seja guardado de todo mal e ele o livre de toda morte.


    Pois eu vejo, meu filho, todas as obras dos seres humanos: todo o pecado e a maldade deles, e todos os seus atos, são impureza, abominação e profanação; não há justiça entre eles. Tenha cuidado para não andar nos caminhos deles nem seguir os seus passos. Não cometa um pecado que leve à morte diante do Deus Altíssimo, para que ele não esconda de você o seu rosto, o entregue nas mãos dos seus inimigos, o arranque da terra e tire a sua descendência de debaixo do céu, destruindo o seu nome e a sua descendência de toda a terra.


    Afaste-se de todos os atos e de toda a impureza deles. Cumpra o encargo do Deus Altíssimo, faça a vontade dele e seja íntegro em tudo. Então ele o abençoará em todos os seus atos e fará surgir de você uma planta de justiça em toda a terra, por todas as gerações da terra. O meu nome e o seu nome jamais serão esquecidos debaixo do céu.


    Vá em paz, meu filho. Que o Deus Altíssimo, meu Deus e seu Deus, o fortaleça para fazer a vontade dele. Que ele abençoe toda a sua descendência e o restante dela, por gerações eternas, com toda bênção de justiça, para que você se torne uma bênção em toda a terra.”


    E ele saiu da presença dele cheio de alegria.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕልያነ፡ ወአምኃ
  choice: suborno nem presente
  rationale: Os dois substantivos designam pagamento corruptor e presente; a coordenação foi preservada, evitando a leitura anterior de parcialidade judicial.
- source_word: ዑቃቤሁ፡ ሠናይ
  choice: uma boa proteção
  rationale: ዑቃቤ indica proteção, preservação ou guarda, e não memorial.
- source_word: ጸላእከ
  choice: seus inimigos
  rationale: O termo ge'ez transmitido significa claramente 'teus inimigos'; segue-se o texto da fonte sem perpetuar a nota inglesa já superada.
- source_word: ተክለ፡ ጽድቅ
  choice: uma planta de justiça
  rationale: Mantém a metáfora concreta e a construção genitiva da fonte, sem especificar indevidamente se se trata de pessoa, linhagem ou comunidade.
- source_word: ዑቃቤ፡ ዘአምላክ፡ ልዑል
  choice: o encargo do Deus Altíssimo
  rationale: Aqui ዑቃቤ tem sentido de observância ou dever confiado; 'encargo' comunica a obrigação sem importar terminologia denominacional.
- source_word: ርኵስ፡ ወምኖ፡ ወገማኔ
  choice: impureza, abominação e profanação
  rationale: Conserva a tríade de avaliações negativas e distingue seus termos em português corrente e digno.
theological_decisions:
- issue: Pecado que conduz à morte
  choice: um pecado que leve à morte
  alternative: um pecado mortal
  rationale: A formulação relacional preserva a ideia de resultado expressa na fonte e evita transformar a frase numa categoria teológica técnica.
- issue: Planta de justiça
  choice: manter a metáfora sem identificar seu referente
  alternative: descendência justa
  rationale: A fonte deixa aberta a extensão da imagem; explicitá-la como linhagem resolveria uma ambiguidade genuína.
- issue: Bênção de justiça
  choice: toda bênção de justiça
  alternative: toda bênção justa
  rationale: O genitivo foi mantido para não decidir se a bênção é caracterizada pela justiça ou se procede dela.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento em terceira pessoa ('você') para boa legibilidade brasileira. A repetição retórica da fonte foi preservada quando significativa. O fragmento inicial presente no texto ge'ez foi traduzido, embora pareça continuar a oração da divisão anterior. Na frase final, 'de seu pai' explicita o referente contextual do pronome para evitar ambiguidade pouco natural em português.
