  text: the blood of wild animals and of cattle and of every bird that flies in the sky. And if you slaughter a sacrifice as an acceptable peace offering, slaughter it and pour out its blood on the altar; and all the fat of your offering you shall offer up on the altar, together with fine flour mixed with oil; and with its drink offering you shall offer it all together on the altar as an offering of a pleasing fragrance before
translation:
  language: pt
  text: o sangue dos animais selvagens, do gado e de toda ave que voa no céu. Se abateres uma oferta pacífica aceitável, abate-a e derrama o sangue dela sobre o altar. Oferece também sobre o altar toda a gordura da tua oferta, junto com farinha fina misturada com azeite; com a libação correspondente, oferece tudo junto sobre o altar, como oferta de aroma agradável diante de
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርዌ፡ ወዘእንስሳ
  choice: animais selvagens, do gado
  rationale: Mantém a distinção do texto entre animais selvagens e animais domésticos, usando termos naturais em português.
- source_word: ጽንሓሐ፡ ሰላም
  choice: oferta pacífica
  rationale: Reproduz a expressão sacrificial relativa à paz ou comunhão sem impor uma interpretação denominacional mais específica.
- source_word: ዘይሰጠው
  choice: aceitável
  rationale: O termo indica aquilo que é aceito ou aceitável; não significa especificamente uma oferta de ação de graças.
- source_word: ጽንሑክ
  choice: o sebo da tua oferta
  rationale: Preserva o sufixo possessivo de segunda pessoa singular e traduz a gordura sacrificial como 'sebo', termo claro no contexto ritual.
- source_word: ስንዳሌ፡ ልውሰ፡ በቅብዕ
  choice: farinha fina misturada com azeite
  rationale: Expressa diretamente os componentes da oferta cereal em linguagem portuguesa corrente e digna.
- source_word: ጽንሓሕነ፡ መዐዛ፡ ሠናይ
  choice: oferta de aroma agradável
  rationale: Mantém o conhecido idioma sacrificial de um aroma tido como agradável, sem explicá-lo teologicamente.
theological_decisions:
- issue: Natureza da oferta pacífica
  choice: oferta pacífica aceitável
  alternative: oferta pacífica de ação de graças
  rationale: O texto-fonte qualifica a oferta como aceita ou aceitável; traduzir como 'ação de graças' acrescentaria uma categoria que o vocábulo ge'ez não traz.
- issue: Agente do derramamento do sangue
  choice: derrama o sangue dele
  alternative: para que o sangue dele seja derramado
  rationale: A forma verbal é ativa e se dirige à segunda pessoa; a tradução conserva essa responsabilidade ritual explícita.
- issue: Final incompleto do versículo
  choice: diante de
  alternative: diante de Deus
  rationale: O trecho-fonte fornecido termina na preposição equivalente a 'diante de'. Não se completa a frase por conjectura, preservando a divisão textual recebida.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. Emprega segunda pessoa singular por corresponder ao discurso direto do contexto e preserva a cadência ritual. O término sintaticamente aberto é deliberado, pois o texto-fonte fornecido termina em 'diante de'.
