base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/004.yaml
  text: the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandments and those who despise his covenant.
translation:
  language: pt
  text: a vontade daquele que me criou. Pois ele é o Deus vivo; ele é santo, fiel e justo acima de todos. Nele não há parcialidade nem aceitação de presentes,[a] pois ele é um Deus justo, que executa o juízo contra todos os que transgridem seus mandamentos e contra os que desprezam sua aliança.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem recebimento de subornos”.'
    reason: A palavra pode designar presentes usados para influenciar o julgamento, isto é, subornos.
  - marker: b
    text: 'Outra tradução possível: “os que transgridem seus mandamentos e sua aliança”.'
    reason: Reflete a alternativa de vincular “sua aliança” ao verbo “transgridem”, em vez de manter a segunda ação, “desprezam”.
lexical_decisions:
- source_word: ፈቃዱ፡ ለዘፈጠረኒ
  choice: a vontade daquele que me criou
  rationale: Reproduz diretamente a construção possessiva e mantém a continuidade sintática do versículo anterior.
- source_word: አምላክ፡ ሕያው
  choice: o Deus vivo
  rationale: Equivalente tradicional, claro e direto para a expressão ge'ez.
- source_word: ምእመን
  choice: fiel
  rationale: Expressa a qualidade de confiabilidade/fidelidade atribuída a Deus.
- source_word: ነሢአ፡ ገጽ
  choice: parcialidade
  rationale: O idiomatismo de 'tomar/aceitar o rosto' indica favorecimento ou tratamento parcial.
- source_word: ነሢአ፡ ሕልያን
  choice: aceitação de presentes
  rationale: Mantém distinta a segunda expressão, referente a receber presentes ou subornos, sem redundá-la com 'parcialidade'.
- source_word: ገባሬ፡ ኵነኔ
  choice: que executa o juízo
  rationale: Preserva o sentido ativo de alguém que realiza ou aplica julgamento.
- source_word: ይትዐደዉ፡ ትእዛዞ
  choice: transgridem seus mandamentos
  rationale: Representa a transgressão das ordens divinas; o plural em português é natural e corresponde ao sentido coletivo.
- source_word: ይሜንኑ
  choice: desprezam
  rationale: Preserva o segundo verbo e sua força de rejeição ou menosprezo, sem fundi-lo com 'transgridem'.
theological_decisions:
- issue: Relação entre justiça divina, parcialidade e presentes
  choice: Manter 'parcialidade' e 'aceitação de presentes' como duas práticas distintas
  alternative: Traduzir ambas como formas de acepção de pessoas
  rationale: O texto ge'ez contém duas expressões diferentes; distingui-las preserva a denúncia tanto do favoritismo quanto da influência por presentes ou subornos.
- issue: Dois grupos submetidos ao juízo
  choice: Distinguir os que transgridem os mandamentos dos que desprezam a aliança
  alternative: Subordinar 'mandamentos' e 'aliança' ao único verbo 'transgredir'
  rationale: A fonte apresenta duas construções verbais coordenadas, e a tradução não deve apagar a segunda ação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se a abertura fragmentária, por depender do contexto anterior, e o paralelismo enfático das qualidades divinas.
