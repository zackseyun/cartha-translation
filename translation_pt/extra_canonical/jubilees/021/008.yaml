  text: 'the Lord. And the fat of the sacrifice of deliverance you shall place on the fire that is on the altar: the fat that is on the entrails, and all the fat that is on the inward parts, and the two kidneys, and all'
translation:
  language: pt
  text: 'o Senhor. Ponha sobre o fogo que está no altar a gordura do sacrifício de libertação: a gordura que está sobre as entranhas, toda a gordura que está sobre os órgãos internos, os dois rins e toda'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: sacrifício de libertação
  rationale: Mantém o sentido básico de መድኃኒት como livramento ou salvação, sem impor a expressão cultual mais específica “oferta de comunhão”.
- source_word: ስብሐ
  choice: gordura
  rationale: É o termo adequado no contexto sacrificial e preserva a repetição do texto-fonte.
- source_word: ከርሥ
  choice: entranhas
  rationale: Expressa de modo natural o conjunto visceral referido no contexto cultual.
- source_word: ንዋየ፡ ውስት
  choice: órgãos internos
  rationale: Tradução clara e corrente para os elementos ou partes do interior do corpo.
- source_word: ወክሊአ፡ ኵልያት
  choice: os dois rins
  rationale: Reproduz diretamente o numeral e o substantivo do ge'ez.
- source_word: ወኵሎ
  choice: e toda
  rationale: O termo significa “e toda” ou “e tudo”; aqui concorda com “gordura”, que aparece na continuação. A formulação deliberadamente incompleta preserva o corte do versículo no meio da frase.
theological_decisions:
- issue: Sentido cultual de መድኃኒት
  choice: libertação
  alternative: salvação; oferta de comunhão; oferta pacífica
  rationale: “Libertação” conserva o campo semântico de livramento sem identificar a oferta com uma categoria denominacional ou harmonizá-la automaticamente com uma terminologia bíblica posterior.
- issue: Final abrupto do versículo
  choice: manter “e toda” sem completar a frase
  alternative: “ambos” ou completar com palavras da continuação
  rationale: O texto fornecido termina no meio de uma construção que continua no versículo seguinte. Completá-la ou mudar ኵሎ para “ambos” resolveria artificialmente a segmentação e alteraria o sentido.
translation_notes:
  register: Português moderno, claro e digno, com terminologia sacrificial acessível. O imperativo foi vertido por “Ponha”, de leitura amplamente compreensível no Brasil, e o final truncado foi preservado por fidelidade à divisão textual fornecida.
