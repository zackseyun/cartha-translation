review_pass:
  verdict: revise
  source_fidelity: A tradução transmite fielmente a proibição de comer sangue, a rejeição de um presente ligado a um caso de sangue humano, a impunidade pelo derramamento e a poluição da terra. Contudo, «em troca de sangue humano» estreita e altera a relação imprecisa de ዲበ («a respeito de/em relação a»), podendo sugerir que o sangue é o objeto da troca, em vez de um presente recebido num caso de derramamento de sangue.
  naturalness: O português é claro, solene e natural. «Por causa do sangue de qualquer pessoa» preserva melhor a construção sem introduzir uma transação comercial explícita.
  terminology: «Sangue», «vida», «impunemente», «contamina» e «purificada» são escolhas adequadas. Mantém-se «presente», sem impor o termo técnico «suborno», que seria interpretativo.
  issues:
  - severity: medium
    issue: «em troca de sangue humano»
    rationale: O texto ge'ez diz literalmente um presente «sobre/a respeito de» qualquer sangue humano. «Em troca de» especifica uma relação de intercâmbio que o original não formula e pode ser lido como a compra do próprio sangue.
