  text: blood at all, because it is the life; and do not eat any blood. And do not accept a gift concerning any human blood, lest it be shed with impunity, without judgment; for it is the blood that is shed which pollutes the earth, and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it.
translation:
  language: pt
  text: sangue algum, porque ele é a vida; não comas sangue algum. Não aceites presente algum por causa do sangue de qualquer pessoa, para que este não seja derramado impunemente, sem julgamento; pois é o sangue derramado que contamina a terra, e a terra não pode ser purificada do sangue de uma pessoa, a não ser pelo sangue daquele que o derramou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደመ / ደም
  choice: sangue
  rationale: Equivalente direto, repetido conforme a ênfase do texto-fonte.
- source_word: ነፍስ
  choice: vida
  rationale: Embora o termo também possa significar «alma» ou «ser vivente», neste contexto a proibição alimentar identifica o sangue como a vida.
- source_word: ሕልያነ
  choice: presente
  rationale: Mantém a formulação concreta do texto e, no contexto judicial de sangue derramado, comunica um pagamento destinado a impedir a devida sentença sem restringi-lo explicitamente a um termo técnico.
- source_word: በከ
  choice: impunemente
  rationale: O valor adverbial é «em vão», «sem consequência» ou «com impunidade», e não «de ti».
- source_word: ይትከዐው
  choice: seja derramado
  rationale: O verbo se refere ao derramamento do sangue, conforme confirmado pela repetição na frase seguinte.
- source_word: ያንጥኦ
  choice: contamina
  rationale: No contexto ritual e moral, descreve o sangue derramado como aquilo que torna a terra impura.
- source_word: ነጺሐ
  choice: ser purificada
  rationale: Expressa a remoção da impureza causada pelo sangue humano derramado.
theological_decisions:
- issue: Relação entre o sangue, a vida e a proibição alimentar
  choice: «porque o sangue é a vida»
  alternative: «porque ele é a alma»
  rationale: «Vida» comunica naturalmente a função de ነፍስ neste contexto e preserva o fundamento da proibição sem impor uma antropologia técnica.
- issue: Consequência pelo homicídio
  choice: «a não ser pelo sangue daquele que o derramou»
  alternative: «senão mediante a execução do homicida»
  rationale: A tradução retém a imagem jurídica e expiatória do sangue no texto-fonte, sem transformá-la em explicação doutrinária ou jurídica mais específica.
translation_notes:
  register: Português moderno, claro e solene, com segunda pessoa do singular coerente com a exortação paterna do contexto. A abertura fragmentária («sangue algum») foi preservada porque o material fornecido começa no meio de uma oração, em decorrência da divisão do capítulo. Evitou-se a antiga leitura «seja exigido de ti», pois o verbo significa «ser derramado» e o advérbio indica impunidade.
