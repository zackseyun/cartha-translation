  text: a coisas impuras, ou atrás de imagens esculpidas, ou atrás de imagens fundidas. E não comam sangue algum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኩሳን (rəkusan)
  choice: coisas impuras
  rationale: Mantém o sentido plural genérico de coisas ritualmente ou moralmente impuras, sem restringi-lo indevidamente a uma classe específica de ídolos.
- source_word: ድኅሬሆሙ (dəḥrehomu)
  choice: sigam
  rationale: A expressão literal «atrás delas» indica ir atrás ou seguir; «sigam» expressa esse sentido de modo natural em português.
- source_word: ገሊፎ (galifo)
  choice: imagens esculpidas
  rationale: Designa objetos ou imagens talhados/esculpidos; «imagens esculpidas» é claro e preserva o contraste com as fundidas.
- source_word: ስብክ (səbk)
  choice: imagens fundidas
  rationale: Refere-se a objetos produzidos por fundição, em paralelo com as imagens esculpidas.
- source_word: ወኢምዝተኒ (waʾiməntani, forma textual)
  choice: sangue algum
  rationale: O elemento indefinido negativo reforça a proibição total; «sangue algum» reproduz essa ênfase.
theological_decisions:
- issue: Relação entre as expressões coordenadas e a proibição do contexto
  choice: «nem sigam ... nem ...»
  alternative: «ou atrás de imagens esculpidas, ou atrás de imagens fundidas»
  rationale: A construção com «nem» torna explícito em português que os membros estão sob uma proibição, sem acrescentar uma distinção teológica não presente na fonte.
- issue: Identificação das «coisas impuras» como ídolos
  choice: Preservar «coisas impuras»
  alternative: Traduzir como «ídolos impuros»
  rationale: A fonte permite uma referência idólatra no contexto, mas não contém aqui um substantivo explícito equivalente a «ídolos»; a formulação mais ampla preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. O início fragmentário foi preservado porque o versículo continua uma construção iniciada no contexto anterior; evitou-se inserir um verbo não atestado antes de «coisas impuras».
