translation:
  language: pt
  text: sua aliança.[a] E você também, meu filho, guarde seu mandamento, seu estatuto e seu juízo, e não caminhe atrás deles.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “sua aliança” provavelmente concluem a frase do versículo anterior, mas constam no segmento ge'ez deste versículo.
    reason: segmentação do texto-fonte
  - marker: b
    text: O texto deste segmento termina com “deles”; o referente do pronome depende da continuação ou do contexto imediato.
    reason: preservação de ambiguidade decorrente da segmentação
lexical_decisions:
- source_word: ኪዳኖ
  choice: sua aliança
  rationale: Traduz o substantivo com sufixo possessivo masculino singular; embora provavelmente encerre a frase do versículo anterior, ele faz parte do segmento fornecido e, por isso, foi mantido.
- source_word: ዕቀብ
  choice: guarde
  rationale: O imperativo expressa observar, conservar ou cumprir; “guarde” preserva a imagem verbal e soa natural no registro bíblico moderno.
- source_word: ትእዛዞ፡ ወሥርዐቶ፡ ወኵነኔሁ
  choice: o mandamento, o estatuto e o juízo dele
  rationale: Mantém os três substantivos no singular, conforme a morfologia ge'ez, e conserva a relação possessiva com o referente masculino singular.
- source_word: ወኢትሖር፡ ድኅሬሆሙ
  choice: e não ande atrás deles
  rationale: Reproduz literalmente a metáfora de caminhar após alguém ou algo e preserva a referência plural sem identificar silenciosamente seu antecedente.
theological_decisions:
- issue: Referente dos possessivos em “sua aliança” e “dele”
  choice: Manter o referente implícito por meio de pronomes possessivos
  alternative: Explicitar “de Deus”
  rationale: O segmento não nomeia o referente; explicitá-lo resolveria uma relação discursiva que o texto recebido deixa dependente do contexto.
- issue: Referente de “deles”
  choice: Preservar o pronome plural sem explicação no corpo do texto
  alternative: Substituir por um substantivo interpretativo, como “ídolos”
  rationale: O antecedente não aparece no trecho fornecido, e inserir um substantivo importaria contexto não presente na unidade textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega “você” na fala paterna e conserva a cadência tríplice dos termos jurídicos do original.
