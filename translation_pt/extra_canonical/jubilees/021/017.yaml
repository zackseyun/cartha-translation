  text: Lave as mãos e os pés. Que não se veja sangue algum sobre vocês nem em suas roupas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትሐፀብ
  choice: Lave
  rationale: Forma verbal de lavar, vertida como imperativo natural em português e coerente com a instrução dirigida ao interlocutor.
- source_word: እደዊከ፡ ወእገሪከ
  choice: as mãos e os pés
  rationale: Reproduz diretamente os dois membros do corpo mencionados no texto ge'ez.
- source_word: ኢያስተርኢ
  choice: Que não se veja
  rationale: Preserva a formulação passiva/impessoal do original, sem transformar a ordem em mera descrição.
- source_word: ኵሉ፡ ደም
  choice: sangue algum
  rationale: Em contexto negativo, esta é a expressão idiomática portuguesa correspondente a 'todo/qualquer sangue'.
- source_word: በዲቤክሙ
  choice: sobre vocês
  rationale: Mantém a preposição espacial 'sobre' e o referente plural indicado pela forma pronominal.
- source_word: በውስተ፡ አልባሲክሙ
  choice: sobre as suas roupas
  rationale: Embora በውስተ possa ter valor espacial amplo, o contexto de sangue visível em vestes favorece o português idiomático 'sobre as roupas'.
