  text: its fragrance, because there is no longer fragrance upon it as at first. Other than these woods, do not place any other, because its fragrance is distinct, and the odor of its fragrance goes up to heaven.
translation:
  language: pt
  text: seu aroma, porque já não há sobre ele o aroma de antes. Além dessas madeiras, não ponha nenhuma outra, porque seu aroma é distinto, e o odor de seu aroma sobe ao céu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዐዛሁ
  choice: seu aroma
  rationale: Preserva o substantivo referente à fragrância e o sufixo possessivo de terceira pessoa.
- source_word: እሉ፡ ዕፀው
  choice: essas madeiras
  rationale: Traduz o demonstrativo plural e o termo para árvores/madeiras no contexto de materiais aromáticos.
- source_word: ፍሉጥ
  choice: distinto
  rationale: Comunica que o aroma é reconhecível ou diferenciado, sem reduzir o sentido apenas a 'conhecido'.
- source_word: የዐርግ
  choice: sobe
  rationale: Mantém a imagem concreta de ascensão em direção ao céu.
- source_word: ፄና፡ መዐዛሁ
  choice: o odor de seu aroma
  rationale: Conserva a expressão enfática do ge'ez, apesar da repetição deliberada.
