  text: And in the sixth year of this week Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.
translation:
  language: pt
  text: 'E, no sexto ano desta semana[a], Isaque chamou seus dois filhos, Esaú e Jacó, e eles vieram até ele. Então lhes disse: “Meus filhos, estou seguindo pelo caminho de meus pais, para a casa eterna onde estão meus pais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “daquela semana”.
    reason: Registra a alternativa de tradução do demonstrativo na fórmula cronológica, embora “desta semana” corresponda melhor à formulação característica do contexto.
lexical_decisions:
- source_word: በሳድስ፡ ዓመት፡ ዘዝሱባዔ
  choice: no sexto ano desta semana
  rationale: Preserva a fórmula cronológica do texto etíope e o valor demonstrativo de ዝ, entendido como “esta”, em linguagem natural em português.
- source_word: ፍኖተ፡ አበውየ
  choice: o caminho de meus pais
  rationale: Mantém a metáfora da morte como seguir pelo caminho dos antepassados, sem explicá-la ou substituí-la por uma paráfrase teológica.
- source_word: ቤት፡ ዘለዓለም
  choice: a casa eterna
  rationale: Tradução formal e clara da expressão, preservando sua imagem e possível ambiguidade escatológica.
theological_decisions:
- issue: Sentido da “casa eterna”
  choice: Manter literalmente “casa eterna”
  alternative: Explicitar como túmulo, morada dos mortos ou vida após a morte
  rationale: O texto usa uma imagem que não identifica de modo inequívoco a morada; explicitá-la resolveria indevidamente uma tensão teológica genuína.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e vocabulário amplamente internacional. A repetição de “meus pais” foi preservada por refletir a estrutura e a ênfase do texto-fonte.
