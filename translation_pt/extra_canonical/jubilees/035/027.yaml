base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/027.yaml
  text: 'And I command you, my sons: do righteousness and uprightness on the earth, so that Yahweh may bring upon you all that Yahweh said he would do for Abraham and for his seed.'
translation:
  language: pt
  text: 'E eu lhes ordeno, meus filhos: pratiquem a justiça e a retidão na terra, para que Yahweh faça vir sobre vocês tudo o que Yahweh disse que faria por Abraão e por sua descendência.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: a justiça e a retidão
  rationale: Preserva os dois termos éticos distintos do ge'ez, sem reduzi-los a uma única ideia.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: Expressa naturalmente em português o sentido coletivo de 'semente' no contexto da posteridade de Abraão.
- source_word: ያምጽእ ... ላዕሌክሙ
  choice: faça vir sobre vocês
  rationale: Mantém a imagem e a construção causativa do texto-fonte, embora 'cumpra em vocês' fosse mais idiomático.
- source_word: እግዚአብሔር
  choice: Yahweh
  rationale: O contexto identifica o Deus de Abraão; a forma segue a política editorial indicada pela camada inglesa auditada.
- source_word: ነገረ ... ይገበር
  choice: prometeu fazer
  rationale: A construção literalmente se refere ao que Yahweh disse que faria; 'prometeu fazer' comunica de modo natural a força contextual sem alterar o conteúdo.
theological_decisions:
- issue: Relação entre a conduta dos filhos e o cumprimento da palavra dada a Abraão
  choice: para que Yahweh faça vir sobre vocês
  alternative: e então Yahweh fará vir sobre vocês
  rationale: A conjunção final do ge'ez apresenta a prática da justiça e da retidão como finalidade ou condição relacionada ao agir divino; a tradução preserva essa tensão sem explicar seu mecanismo teológico.
- issue: Referente da descendência
  choice: sua descendência
  alternative: sua semente
  rationale: Mantém o referente coletivo aberto, sem restringi-lo a um indivíduo nem acrescentar interpretação messiânica.
translation_notes:
  register: Português moderno, digno e direto, com imperativo natural no plural. Emprega 'vocês' para ampla legibilidade brasileira e compreensão internacional; conserva a repetição de 'Yahweh' presente na estrutura da frase.
