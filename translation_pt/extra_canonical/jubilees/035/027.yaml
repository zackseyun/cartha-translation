  terminology: «Justiça e retidão» traduz adequadamente o par ጽድቀ፡ ወርትዐ. «Descendência» comunica bem o coletivo ዘርኡ sem impor leitura individual. «Yahweh» está consistente com a trilha editorial inglesa.
