- source_word: ቅብሩኒ
  choice: Sepultem-me
  rationale: Reproduz diretamente o imperativo plural dirigido aos dois filhos, em registro digno e natural.
- source_word: ውስተ፡ ባዐት፡ ዘካዕበት
  choice: na caverna dupla
  rationale: Mantém a designação literal da caverna no texto etíope, sem substituí-la pelo nome tradicional do local.
- source_word: ውስተ፡ ገራህተ፡ ኤፍሮን፡ ኬጥያዊ
  choice: no campo de Efrom, o hitita
  rationale: Preserva o local e o gentílico do original com forma portuguesa corrente do nome próprio.
- source_word: ዘአጥረየ፡ አብርሃም፡ ለዝኅረ፡ መቃብር
  choice: que Abraão adquiriu como lugar de sepultamento
  rationale: Expressa a aquisição e sua finalidade/função funerária de maneira clara, acompanhando de perto a construção da fonte.
- source_word: ውስተ፡ መቃብር፡ ዘከረይኩ፡ ለርእስየ
  choice: no túmulo que cavei para mim
  rationale: Conserva a imagem concreta de cavar ou preparar pessoalmente o túmulo.
