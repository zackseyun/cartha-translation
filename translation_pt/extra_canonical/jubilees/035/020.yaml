base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/020.yaml
  text: And Jacob my brother—I love him more than all flesh, and I have no brother in all the earth except him alone. And this is no great thing for me, that I should love him, for he is my brother, and together we were sown in your womb, and together we came out from your belly. And if I do not love my brother, whom shall I love?
translation:
  language: pt
  text: 'E Jacó, meu irmão — eu o amo mais do que a qualquer outra pessoa, e não tenho outro irmão em toda a terra, a não ser ele. Não é grande coisa que eu o ame, pois ele é meu irmão: juntos fomos semeados no seu ventre e juntos saímos de suas entranhas. E, se eu não amar meu irmão, a quem amarei?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምኵሉ፡ ዘሥጋ
  choice: mais do que a qualquer pessoa
  rationale: A expressão literal, 'mais do que toda carne', usa 'carne' no sentido de seres humanos. A formulação escolhida comunica esse sentido com naturalidade em português atual.
- source_word: ተዘራእነ
  choice: fomos gerados
  rationale: O verbo significa literalmente 'fomos semeados'. No contexto da concepção no ventre materno, 'fomos gerados' preserva o sentido sem produzir uma imagem pouco natural em português.
- source_word: ከርሥኪ
  choice: seu ventre
  rationale: Designa o ventre materno e mantém o paralelismo corporal da frase.
- source_word: ኅንብርትኪ
  choice: suas entranhas
  rationale: O termo pode referir-se ao ventre ou às partes internas. 'Entranhas' distingue o segundo membro sem eliminar o paralelismo com 'ventre'.
- source_word: መነ፡ አፈቅር
  choice: a quem amarei?
  rationale: Reproduz diretamente a pergunta retórica do texto, com futuro natural em português.
theological_decisions:
- issue: Alcance de 'toda carne'
  choice: qualquer pessoa
  alternative: toda criatura de carne / toda carne
  rationale: O contexto compara o amor de Esaú por Jacó com seu amor por outros seres humanos, não formula uma afirmação sobre toda criatura viva. A escolha evita uma leitura indevidamente abrangente.
- issue: Metáfora da geração como semeadura
  choice: fomos gerados
  alternative: fomos semeados
  rationale: A metáfora semítica/etíope aponta à concepção comum dos irmãos. A tradução torna a referência inteligível sem acrescentar uma doutrina específica sobre a geração humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O travessão preserva a ênfase afetiva inicial; o paralelismo entre ventre e entranhas mantém o tom solene e familiar do discurso.
