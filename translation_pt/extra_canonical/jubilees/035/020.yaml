id: JUB.35.20
reference: Jubilees 35:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: charles_1895
  language: Geez
  text: '1. ወበቀዳማይ፡ *ዓመት፡ ዘሱባዔ፡ ቀዳማይ፡ በዘአርብዓ፡ ወኀምስቱ፡ ኢዮቤልው፡ ጸውዐቶ፡ ርብቃ፡ ለያዕቆብ፡ ወልዳ፡ ወአዘዘቶ፡ በእንተ፡ አቡሁ፡ ወበእንተ፡ እኁሁ፡ ከመ፡ ያክብሮሙ፡ ኵሎ፡

    2. መዋዕለ፡ ሕይወቱ፡ ለያዕቆብ። ወይቤ፡ ያዕቆብ፡ እገብር፡ ኵሎ፡ ዘከመ፡ አዘዝክኒ፡ እስመ፡ ክብር፡ ወዕበይ፡ ሊተ፡ ዝንቱ፡ ነገር፡ ወጽድቅ፡ ሊተ፡ በቅድመ፡ እግዚአብሔር፡ ከመ፡ አክብሮሙ።

    3. ወአንቲኒ፡ እሞ፡ ታአምሪ፡ እምዕለተ፡ ተወለድኩ፡ እስከ፡ ዛቲ፡ ዕለት፡ ኵሎ፡ ምግባርየ፡ ወኵሎ፡

    4. ዘውስተ፡ ልብየ፡ ከመ፡ ኵሎ፡ መዋዕለ፡ *እሐሊ፡ ሠናየ፡ ለኵሉ። ወአፎ፡ ኢይገብር፡ ዘንተ፡ ነገረ፡

    5. ዘአዘዝክኒ፡ ከመ፡ አክብር፡ አበየ፡ ወእኅየየ። ንግርኒ፡ እሞ፡ ምንተ ርኢኪ፡ በላዕሌየ፡ ጥውየተ፤

    6. ወአንግብስ፡ እምኔሁ፡ ወይከውን፡ ላዕሌየ፡ ሣህለ። ወትቤሎ፡ ወልድየ፡ ኵሎን፡ መዋዕልየ፡ አልቦ፡ ዘርኢኩ፡ በላዕሌከ፡ ምንተኒ፡ ግብረ፡ ጠዋየ፡ አላ፡ ርቱዐ። ወባሕቱ፡ ጽድቀ፡ እነግረከ፡ ወልድየ፡ አነ፡ በዛቲ፡ ዓመት፡ እመውት፡ ወኢይትዐደው፡ ዛተ፡ ዓመተ፡ በሕይወትየ፡ *እስመ፡ ርኢኩ፡ በሕልም፡ ዕለተ፡ ሞትየ፡ ከመ፡ ኢየሐዩ፡ ፈድፋደ፡ *እምእት፡ ወኃምሳ፡ ወኀምስ፡

    7. ዓመት፤ ወናሁ፡ *አነ፡ ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ ዘሀሎኩ፡ እሕየው። ወበሐቀ፡ ያዕቆብ፡ በእንተ፡ ነገረ፡ እሙ፡ እስመ፡ ትቤሎ፡ እሙ፡ ከመ፡ ትመውት፡ ወይእቲሰ፡ ትነብር፡ አንጻሪሁ፡ *ወኀይላ፡ ላዕሌሃ፡ ወኢደክመት፡ እምኀይላ፡ እስመ፡ ትበውእ፡ ወትወፅእ፡ ወትሬኢ፡

    8. ወአስናኒሃኒ፡ ጽኑዕ፡ *ወኢምንተኒ፡ ሕማም፡ ኢበከፋ፡ ኵሎ፡ *መዋዕለ፡ ሕይወታ። ወይቤላ፡ ያዕቆብ፡ ብፁዕ፡ አነ፡ እም፡ አመ፡ ቀርበ፡ መዋዕልየ፡ ለመዋዕለ፡ ሕይወትኪ፡ *ወይሄስ፡ ኀይለየ፡ ላዕሌየ፡ ከመዝ፡ በከመ፡ ኀይልኪ፡ ወአትመውቲ፡ እስመ፡ በከ፡ በጸው፡ ትትናገሪ፡ ምስሌየ፡ በእንተ፡

    9. ሞትኪ። ወቦአት፡ ኀበ፡ ይስሐቅ፡ ወትቤሎ፡ አሐተ፡ ስእለተ፡ አስተበቍዕ፡ በኀቤከ፡ እምሕሱ፡ ለዔሳው፡ ከመ፡ ኢያሕስም፡ ላዕለ፡ ያዕቆብ፡ ወኢይስድዶ፡ በጸልኢ፡ እስመ፡ *አንተ፡ ታአምር፡ ሕሊናሁ፡ ለዔሳው፡ ከመ፡ ጸዋን፡ ውእቱ፡ እምንእሱ፡ ወአልቦ፡ ላዕሌሁ፡ ኂሩተ፡ እስመ፡ ይፈቅድ፡

    10. ውእቱ፡ እምድኅረ፡ ሞትከ፡ ይቅትሎ። ወአንተ፡ ታአምር፡ ኵሎ፡ መጠነ፡ ገብረ፡ እምዕለተ፡ ሖረ፡ ያዕቆብ፡ እኁሁ፡ ውስተ፡ ካራን፡ እስከ፡ ዛቲ፡ ዕለት፡ ከመ፡ በኵሉ፡ ልቡ፡ ኀደገነ፡ ወገብረ፡

    11. ምስሌነ፡ እኩየ፡ መሪዕቶከ፡ አስተጋብአ፡ ወኵሎ፡ ጥሪትከ፡ ሄደ፡ እምቅድመ፡ ገጽከ። ወእንዘ፡ ናስተበቍዕ፡ ወንስእሎ፡ ዘእምዚአነ፡ ውእቱ፡ ይሬሲ፡ *ከመ፡ ዘብእሲ፡ ዘይምሕረነ።

    12. ወይመርር፡ ላዕሌከ፡ በእንተ፡ ዘባረኮ፡ ያዕቆብሃ፡ ወልደከ፡ ፍጹማዊ፡ ወፈትዐ፡ እስመ፡ አልቦ፡ እኩየ፡ ዘአንበበ፡ ኂሩትነ ወእምአመ፡ መጽአ፡ እምካራን፡ እስከ፡ ዛቲ፡ ዕለት፡ *ኢያሕፀፀ፡ ብነ፡ ወእምንትኒ፡ እስመ፡ ኵሉ፡ ይመጽእ፡ ለነ፡ በበጊዜሁ፡ ኵሉ፡ ዕለት፡ ወይትፌሣሕ፡ በኵሉ፡ ልቡ፡ ሶበ፡ ንነሥእ፡ እምእዴሁ፡ ወይባርከነ፡ ወኢተፈለጠ፡ እምኔነ፡ እምአመ፡ መጽአ፡ እምካራን፡ እስከ፡ ዛቲ፡ ዕለት፡ ወውእቱ፡ ይነብር፡ ምስሌነ፡ ዘልፈ፡ ውስተ፡ ቤት፡ እንዘ፡ ያከብረነ።

    13. ወይቤላ፡ ይስሐቅ፡ አነኒ፡ አአምር፡ ወእሬኢ፡ ግብረ፡ ያዕቆብ፡ ዘምስሌነ፡ ከመ፡ በኵሉ፡ ልቡ፡ ውእቱ፡ ያከብረነ፡ ወአፍቀርክዎ፡ ለዔሳው፡ ቀደሙ፡ እምነ፡ ያዕቆብ፡ እምዘተወልደ፡ ቀደሙ፡ ወይእዜኒ፡ *አፈቅር፡ ያዕቆብሃ፡ እምነ፡ ዔሳው፡ እስመ፡ አብዝኀ፡ አእክዮ፡ ምግባሪሁ፡ ወአልቦ፡ ጽድቀ፡ ሎቱ፡ እስመ፡ ኵሉ፡ ፍኖቱ፡ ዐመፃ፡ ወግፍዕ፡ ወአልቦ፡ ጽድቀ፡ ሎቱ፡ አውዶ።

    14. ወይእዜኒ፡ ልብየ፡ ይትሀወክ፡ በእንተ፡ ኵሉ፡ ምግባራቲሁ፡ ወኢኮነ፡ ውእቱ፡ ወዘርኡ፡ ሊድኅን፡ እስመ፡ እለ፡ ይትሐጐሉ፡ እሙንቱ፡ እምነ፡ ምድር፡ ወእለ፡ ይሤረዉ፡ እሙንቱ፡ እምታሕተ፡ ሰማይ፡ እስመ፡ *አምላኮ፡ ‛ለአብርሃም፡ ኀደገ፡ ወሖረ፡ ድኅረ፡ አንስቲያሁ፡ ወድኅረ፡

