  yaml_path: translation/extra_canonical/jubilees/035/010.yaml
  text: He will kill him after your death. And you know all that he has done from the day his brother Jacob went to Haran until this day, how with all his heart he has forsaken us and has done
translation:
  language: pt
  text: 'Ele o matará depois que você morrer. E você sabe tudo o que ele fez desde o dia em que seu irmão Jacó foi para Harã até hoje: como nos abandonou de todo o coração e fez'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቅትሎ
  choice: Ele o matará
  rationale: O verbo expressa ação futura, e o sufixo pronominal indica objeto masculino singular; a formulação conserva ambos sem explicitar identidades que este versículo não nomeia.
- source_word: ኵሎ፡ መጠነ፡ ገብረ
  choice: tudo o que ele fez
  rationale: Reproduz naturalmente em português a ideia da totalidade de sua conduta, sem a rigidez pouco idiomática de «toda a medida do que fez».
- source_word: ሖረ
  choice: foi
  rationale: Equivalente corrente e claro para o movimento de Jacó em direção a Harã.
- source_word: ኀደገነ
  choice: nos abandonou
  rationale: Comunica a ideia de deixar ou desamparar o grupo, com força adequada ao contexto, sem acrescentar uma qualificação teológica.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «você» para clareza na referência à morte do interlocutor. A frase termina de modo incompleto em «e fez», acompanhando a divisão e a sintaxe truncada do versículo-fonte, cuja continuação pertence ao contexto seguinte.
