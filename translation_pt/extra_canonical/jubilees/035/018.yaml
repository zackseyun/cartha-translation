base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/018.yaml
  text: and neither will seek evil against his brother, but only love, so that you may prosper, my sons, and be honored in the midst of the land, and no enemy may rejoice over you, and you may become a blessing and a mercy before the eyes of all who love you.”
translation:
  language: pt
  text: e nenhum de vocês procure o mal contra seu irmão, mas busque apenas o amor, para que prosperem, meus filhos, e sejam honrados no meio da terra; que nenhum inimigo se alegre por causa de vocês, e que vocês se tornem uma bênção e uma misericórdia aos olhos de todos os que os amam.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይኅሥሥ፡ እኩየ
  choice: procure fazer mal
  rationale: Reproduz a ideia de buscar ou intentar o mal em português natural, sem limitar o sentido a pensamentos ou planos.
- source_word: ተፋቅሮ
  choice: demonstrar amor
  rationale: Expressa o contraste positivo com procurar o mal e mantém o caráter relacional do substantivo verbal ligado ao amor mútuo.
- source_word: ወትሣረሑ
  choice: prosperem
  rationale: Segue o sentido contextual de ir bem ou prosperar, também refletido pela antiga tradução de Charles e pela camada inglesa auditada.
- source_word: ለበረከት፡ ወለምሕረት
  choice: uma bênção e uma expressão de misericórdia
  rationale: Mantém os dois substantivos coordenados; 'expressão de misericórdia' evita a formulação portuguesa pouco natural 'ser uma misericórdia' sem apagar o segundo conceito.
theological_decisions:
- issue: Sentido de 'misericórdia' como condição ou efeito produzido pelos filhos
  choice: uma expressão de misericórdia
  alternative: uma bênção e uma misericórdia
  rationale: A construção-fonte é concisa e admite certa amplitude. A opção escolhida conserva a misericórdia como elemento distinto da bênção, mas produz uma frase inteligível sem impor uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantém a exortação familiar, a sequência de resultados no plural e o paralelismo entre bênção e misericórdia.
