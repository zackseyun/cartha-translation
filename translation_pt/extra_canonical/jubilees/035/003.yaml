  yaml_path: translation/extra_canonical/jubilees/035/003.yaml
  text: And you, my son, know from the day you were born until this day, all my deeds and all that is in my heart, that I love your father exceedingly.
translation:
  language: pt
  text: 'E você também, meu filho, sabe, desde o dia em que nasceu até hoje, tudo o que tenho feito e tudo o que há no meu coração: que amo muito seu pai.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምግባርየ
  choice: tudo o que tenho feito
  rationale: O substantivo geʿez məgbār abrange atos, ações e conduta. A formulação verbal é natural em português e mantém o contraste entre o comportamento observável da mãe e o que há em seu coração.
- source_word: ዘውስተ ልብየ
  choice: o que há no meu coração
  rationale: Traduz de modo direto a expressão geʿez referente ao conteúdo interior do coração, preservando sua dimensão afetiva e intencional sem explicá-la além do texto.
- source_word: ጥቀ
  choice: muito
  rationale: O advérbio ṭəqqa expressa intensidade, como “muito” ou “grandemente”. “Muito” comunica essa força em português atual, com naturalidade e dignidade.
- source_word: እስከ ዛቲ ዕለት
  choice: até hoje
  rationale: A expressão significa literalmente “até este dia”. “Até hoje” é o equivalente idiomático corrente em português e conserva a extensão temporal indicada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção conserva a fala afetiva da mãe ao filho e mantém a relação entre seus atos, sua disposição interior e o amor pelo pai do interlocutor. Não foram necessárias notas de rodapé.
