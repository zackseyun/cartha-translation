    14. ወይእዜኒ፡ ልብየ፡ ይትሀወክ፡ በእንተ፡ ኵሉ፡ ምግባራቲሁ፡ ወኢኮነ፡ ውእቱ፡ ወዘርኡ፡ ሊድኅን፡ እስመ፡ እለ፡ ይትሐጐሉ፡ እሙንቱ፡ እምነ፡ ምድር፡ ወእለ፡ ይሤረዉ፡ እሙንቱ፡ እምታሕተ፡ ሰማይ፡ እስመ፡ *አምላኮ፡ ‛ለአብርሃም፡ ኀደገ፡ ወሖረ፡ ድኅረ፡ አንስቲያሁ፡ ወድኅረ፡

