  yaml_path: translation/extra_canonical/jubilees/035/001.yaml
  text: And in the first year of the first week, in the forty-fifth jubilee, Rebekah called Jacob her son and instructed him concerning his father and concerning his brother, that he should honor them all the days of his life.
translation:
  language: pt
  text: No primeiro ano da primeira semana, no quadragésimo quinto jubileu, Rebeca chamou seu filho Jacó e lhe deu instruções a respeito de seu pai e de seu irmão, para que os honrasse todos os dias de sua vida.
