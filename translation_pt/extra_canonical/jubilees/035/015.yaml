  text: their uncleanness and after their error, he and his children. And you tell me to make him swear that he will not kill Jacob his brother. Even if he swears, he will not keep his oath, nor will he do anything but evil. And if he desires to kill Jacob his brother, he will be given into Jacob’s hand, and he will not escape from his hand, for he will fall into his hand.
translation:
  language: pt
  text: a impureza deles e, depois do erro deles, ele e seus filhos. E você me diz que eu o faça jurar que não matará Jacó, seu irmão. Mesmo que jure, ele não cumprirá seu juramento nem fará coisa alguma além do mal. E, se quiser matar Jacó, seu irmão, será entregue na mão de Jacó e não escapará da mão dele, pois cairá em sua mão.
  philosophy: optimal-equivalence
