- source_word: ርኵሶን
  choice: a impureza deles
  rationale: Mantém o sentido concreto de impureza e preserva o início fragmentário do versículo, que depende do contexto anterior.
- source_word: መሐላሁ
  choice: seu juramento
  rationale: Equivalente natural e direto para o juramento que Esaú seria obrigado a fazer.
- source_word: ዘእንበለ፡ እኩይ
  choice: coisa alguma além do mal
  rationale: Reproduz a construção exclusiva da fonte sem reformulá-la como uma afirmação abstrata sobre fazer o bem.
- source_word: ውስተ፡ እዴ፡ ያዕቆብ
  choice: na mão de Jacó
  rationale: Preserva a imagem singular da mão como expressão de poder e domínio.
theological_decisions:
- issue: Certeza da queda de Esaú sob o poder de Jacó
  choice: será entregue na mão de Jacó... cairá em sua mão
  alternative: poderá ser entregue ao poder de Jacó
  rationale: Os verbos da fonte apresentam o resultado de modo afirmativo, não apenas como possibilidade; a metáfora da mão também foi mantida.
