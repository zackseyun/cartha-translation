  text: 'And she went in to Isaac and said to him, “I ask one request of you: make Esau swear that he will not devise evil against Jacob and will not pursue him in hostility, for you know Esau’s mind, that he has been cruel from his youth, and there is no goodness in him, for he desires'
translation:
  language: pt
  text: 'Ela foi até Isaque e lhe disse: “Tenho um pedido a lhe fazer: faça Esaú jurar, diante de você, que não tramará o mal contra Jacó nem o perseguirá com hostilidade, pois você conhece a mente de Esaú: ele tem sido cruel desde a juventude, e não há bondade nele, pois deseja'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስእለተ
  choice: uma coisa
  rationale: No contexto do pedido, expressa de modo natural o sentido de uma única solicitação, sem reproduzir uma construção rígida.
- source_word: ኢያሕስም፡ ላዕለ፡ ያዕቆብ
  choice: não tramará o mal contra Jacó
  rationale: Preserva o sentido de conceber ou maquinar o mal contra alguém, em vez de reduzi-lo simplesmente a odiar.
- source_word: ሕሊናሁ
  choice: a mente
  rationale: Abrange a disposição interior e os pensamentos de Esaú sem especificar além do texto.
- source_word: ጸዋን
  choice: cruel
  rationale: Comunica uma disposição dura e nociva de modo claro e digno no português atual.
- source_word: በጸልኢ
  choice: com hostilidade
  rationale: Mantém o valor de inimizade ou antagonismo associado à perseguição.
theological_decisions:
- issue: Avaliação moral de Esaú
  choice: não há bondade nele
  alternative: não há bem nele
  rationale: Conserva a afirmação contundente do texto sem atenuá-la nem transformá-la em uma tese teológica mais ampla.
- issue: Final sintaticamente incompleto
  choice: encerrar em “pois deseja” sem completar o objeto
  alternative: suprir uma ação presumida a partir do versículo seguinte
  rationale: A evidência fornecida termina de forma incompleta; completar a frase importaria conteúdo não presente neste segmento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A fala direta preserva a força do pedido e a tensão moral do original. O término abrupto é mantido por fidelidade ao segmento-fonte apresentado.
