  source_fidelity: 'A tradução preserva bem o sentido central: Rebeca pede a Isaque que faça Esaú jurar não maquinar o mal contra Jacó nem persegui-lo em hostilidade; também mantém a caracterização moral de Esaú e a interrupção sintática final. Contudo, በኀቤከ indica que o juramento é feito perante/a Isaque, elemento que convém explicitar.'
  naturalness: “Ela entrou até Isaque” soa pouco idiomático em português contemporâneo. “Foi até Isaque” é natural e conserva adequadamente o movimento narrativo. “Peço-lhe uma coisa” é compreensível, mas “Tenho um pedido a lhe fazer” é mais idiomático para uma solicitação formal.
  terminology: “Tramará o mal”, “com hostilidade”, “cruel”, “bondade” e os nomes Isaque, Esaú e Jacó são escolhas adequadas. O tratamento por “você” é coerente com a legibilidade brasileira e com “lhe”.
