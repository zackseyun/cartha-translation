base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/011.yaml
  text: He has dealt wickedly with us; he has gathered your flocks, and he has plundered all your possessions from before your face. And while we ask and request from him what is ours, he acts like a man who has mercy on us.
translation:
  language: pt
  text: Ele agiu perversamente contra nós; reuniu teus rebanhos e saqueou todos os teus bens diante dos teus próprios olhos. E, enquanto lhe suplicamos e pedimos o que é nosso, ele age como um homem que tem misericórdia de nós.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩየ
  choice: agiu perversamente
  rationale: O verbo exprime uma ação má ou injusta; a formulação portuguesa comunica naturalmente que ele procedeu mal contra os envolvidos.
- source_word: መሪዕቶከ
  choice: os seus rebanhos
  rationale: O termo designa coletivamente os animais apascentados; o plural é idiomático em português neste contexto patrimonial.
- source_word: ሄደ
  choice: saqueou
  rationale: Em ge'ez, o verbo aqui significa roubar ou tomar à força, não simplesmente ‘ir’; ኵሎ marca ‘todos os seus bens’ como objeto direto.
- source_word: እምቅድመ ገጽከ
  choice: diante dos seus próprios olhos
  rationale: A expressão literal ‘de diante do seu rosto’ indica uma ação praticada na presença da pessoa; a forma escolhida é natural e mantém a ênfase testemunhal.
- source_word: ናስተበቍዕ ወንስእሎ
  choice: lhe suplicamos e pedimos
  rationale: Preserva os dois verbos coordenados de apelo e solicitação sem os fundir.
- source_word: ዘእምዚአነ
  choice: o que é nosso
  rationale: Mantém de modo direto a reivindicação de algo pertencente aos falantes.
- source_word: ይሬሲ ከመ ዘብእሲ
  choice: age como se fosse um homem
  rationale: Reproduz a comparação comportamental e torna inteligível em português a aparência irônica de benevolência.
theological_decisions:
- issue: Aparência de misericórdia em contraste com a injustiça
  choice: “age como se fosse um homem que tem misericórdia de nós”
  alternative: “torna-se como um homem que tem misericórdia de nós”
  rationale: 'A tradução preserva a tensão e a ironia do texto: o opressor se apresenta como misericordioso, sem afirmar que de fato o seja.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação e os dois verbos de súplica foram preservados; evitou-se a leitura equivocada de ሄደ como ‘foi’.
