base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/021.yaml
  text: And I myself ask you that you admonish Jacob concerning me and concerning my children, for I know that he will surely reign over me and over my children, because on the day my father blessed him he made him high and me low.
translation:
  language: pt
  text: E eu lhe peço que advirta Jacó a meu respeito e a respeito dos meus filhos,[a] pois sei que ele certamente reinará sobre mim e sobre os meus filhos, porque, no dia em que meu pai o abençoou, colocou-o no alto e a mim, embaixo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em meu favor e em favor dos meus filhos”.'
    reason: A preposição ge’ez pode indicar tanto o assunto a respeito do qual se fala quanto benefício ou representação.
lexical_decisions:
- source_word: አስተብቍዐኪ
  choice: lhe peço
  rationale: Expressa o pedido enfático de Esaú a Rebeca em português corrente, sem tornar a formulação artificialmente solene.
- source_word: ትገሥጽዮ
  choice: aconselhe
  rationale: O verbo pode envolver admoestar, exortar ou instruir. “Aconselhe” comunica aqui o pedido para que Rebeca oriente Jacó quanto à sua conduta para com Esaú e seus filhos, sem sugerir necessariamente uma repreensão por falta já cometida.
- source_word: በእንቲአየ፡ ወበእንተ፡ ውሉድየ
  choice: a meu respeito e a respeito dos meus filhos
  rationale: Mantém o sentido contextual de “acerca de/quanto a”, ao mesmo tempo que registra em nota a possibilidade de valor benefactivo.
- source_word: ነጊሠ፡ ይነግሥ
  choice: certamente reinará
  rationale: A repetição do verbo na construção cognata intensifica a certeza da ação; “certamente” reproduz essa força de modo natural.
- source_word: ረሰየ፡ ልዑለ፡ ወኪያየ፡ ትሑተ
  choice: colocou-o no alto e a mim, embaixo
  rationale: Conserva o contraste espacial e hierárquico concreto do texto, sem explicá-lo além do que a fonte afirma.
theological_decisions:
- issue: Natureza do domínio futuro de Jacó sobre Esaú
  choice: reinará sobre mim e sobre os meus filhos
  alternative: dominará a mim e aos meus filhos
  rationale: “Reinará” corresponde diretamente ao verbo de realeza da fonte e preserva a tensão entre a bênção patriarcal e sua futura concretização, sem reduzir o enunciado a mera sujeição política.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal natural para leitores brasileiros. O paralelismo “no alto... embaixo” foi mantido por sua força retórica e por refletir de perto a formulação ge’ez.
