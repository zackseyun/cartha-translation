base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/012.yaml
  text: And he is bitter against you because you blessed Jacob, your perfect and upright son; for there is no evil at all in him, but only goodness. And from the time he came from Haran until this day he has not deprived us of anything, for everything comes to us in its time every day, and he rejoices with all his heart whenever we receive from his hand, and he blesses us. He has not separated himself from us from the time he came from Haran until this day, and he dwells with us continually in the house while honoring us.”
translation:
  language: pt
  text: E ele está ressentido com você porque você abençoou Jacó, seu filho íntegro e justo; pois não há nele mal algum, mas somente bondade. Desde o dia em que veio de Harã até hoje, ele não nos privou de coisa alguma, pois tudo nos chega no devido tempo, todos os dias. Ele se alegra de todo o coração sempre que recebemos de sua mão e nos abençoa. Desde o dia em que veio de Harã até hoje, ele não se afastou de nós e vive continuamente conosco nesta casa, honrando-nos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርር፡ ላዕሌከ
  choice: está ressentido com você
  rationale: A construção exprime amargura ou hostilidade dirigida contra alguém; “ressentido com” preserva a imagem afetiva em português natural.
- source_word: ፍጹማዊ፡ ወፈትዐ
  choice: íntegro e justo
  rationale: O par descreve Jacó como completo/irrepreensível e reto; “íntegro e justo” é claro, digno e evita o sentido moderno potencialmente absoluto de “perfeito”.
- source_word: አልቦ፡ እኩየ
  choice: não há nele mal algum
  rationale: Reproduz a negação enfática do mal atribuído a Jacó.
- source_word: ኂሩትነ
  choice: somente bondade
  rationale: O contexto contrasta o mal com a bondade. A forma textual apresenta dificuldade, mas o sentido contextual não requer o possessivo “nossa”.
- source_word: ኢያሕፀፀ፡ ብነ፡ ወእምንትኒ
  choice: não nos privou de coisa alguma
  rationale: Expressa de modo idiomático a ideia de não fazer faltar ou diminuir nada para eles.
- source_word: ንነሥእ፡ እምእዴሁ
  choice: recebemos algo de suas mãos
  rationale: “Receber de suas mãos” comunica provisão sem a possível conotação indevida de tomar à força.
- source_word: ይነብር፡ ምስሌነ፡ ዘልፈ፡ ውስተ፡ ቤት
  choice: vive continuamente conosco nesta casa
  rationale: Conserva a continuidade da convivência doméstica e produz uma formulação natural em português.
theological_decisions:
- issue: Descrição moral de Jacó como sem mal algum
  choice: 'Manter a afirmação forte do texto: “não há nele mal algum”'
  alternative: Atenuar para “não fez mal algum” ou “não há maldade em suas ações”
  rationale: A fonte formula uma avaliação direta da pessoa de Jacó neste discurso. Atenuá-la resolveria uma possível tensão teológica que a tradução deve preservar.
translation_notes:
  register: Português contemporâneo, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se o paralelismo temporal, a ênfase moral e o tom de defesa familiar do discurso, evitando arcaísmos desnecessários.
