  yaml_path: translation/extra_canonical/jubilees/035/028.yaml
  text: And love one another, my sons, among yourselves, each loving his brother as a man loves his own life, and let a man seek—”
translation:
  language: pt
  text: E amem uns aos outros, meus filhos, cada um amando seu irmão como ama a própria vida; e que cada um procure—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፋቅሮ
  choice: amem uns aos outros
  rationale: Expressa de modo natural em português o mandamento recíproco de amar no contexto fraternal.
- source_word: አኅዊክሙ
  choice: seu irmão
  rationale: 'Mantém o referente concreto e singular distributivo do texto: cada um deve amar o próprio irmão.'
- source_word: ነፍሶ
  choice: a própria vida
  rationale: O substantivo pode significar alma, pessoa ou vida; aqui, na comparação com o amor por si mesmo, “a própria vida” preserva bem a formulação sem impor leitura técnica.
- source_word: ወይኅሥሥ፡ ብእሲ
  choice: e que cada um procure
  rationale: ብእሲ é o sujeito de “procurar”, não seu objeto. “Cada um” retoma naturalmente a construção distributiva anterior e deixa o objeto para a continuação do versículo seguinte.
theological_decisions:
- issue: Sentido de ነፍሶ na comparação ética
  choice: a própria vida
  alternative: a si mesmo / a própria alma
  rationale: “Vida” conserva a amplitude do termo e acompanha a camada inglesa auditada, sem introduzir uma antropologia dicotômica por meio de “alma”.
- issue: Força verbal da oração final
  choice: e que cada um procure—
  alternative: e cada um procura—
  rationale: O contexto contém exortações de Isaque aos filhos; a forma exortativa em português comunica esse valor, mantendo a frase deliberadamente incompleta na divisão versicular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição locativa de “entre vocês” foi evitada por ser redundante em português após “uns aos outros”; a reciprocidade permanece explícita. O travessão final preserva a continuação sintática no versículo seguinte.
