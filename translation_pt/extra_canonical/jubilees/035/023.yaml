  yaml_path: translation/extra_canonical/jubilees/035/023.yaml
  text: And she called Jacob before Esau’s eyes and instructed him according to the words that she had spoken with Esau. And he said, “I will do your pleasure. Trust me that no evil may come out from me or from my children against Esau, and I will not be first in anything except in love.”
translation:
  language: pt
  text: 'Ela chamou Jacó na presença de Esaú e lhe deu instruções de acordo com as palavras que havia falado com Esaú. Jacó disse: “Farei o que você deseja. Confie em mim: nenhum mal virá de mim nem dos meus filhos contra Esaú, e não tomarei a dianteira em nada, a não ser no amor.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለዔሳው
  choice: diante de Esaú
  rationale: A expressão significa literalmente “diante dos olhos de Esaú”; em português atual, “diante de Esaú” preserva o sentido de presença pública sem soar artificial.
- source_word: ሥምረተኪ
  choice: o que você deseja
  rationale: O termo expressa vontade, agrado ou desejo; esta formulação comunica naturalmente que Jacó aceita cumprir o pedido de Rebeca.
- source_word: ተሐበይኒ
  choice: Confie em mim
  rationale: A forma verbal deriva de uma raiz ligada a crer ou confiar e é dirigida por Jacó a Rebeca; evita a antiga interpretação incorreta “esconde-me”.
- source_word: ከመ፡ ኢይወፅእ፡ እምኔየ፡ ወእምውሉድየ፡ እኩይ፡ ላዕለ፡ ዔሳው
  choice: nenhum mal virá de mim nem dos meus filhos contra Esaú
  rationale: Mantém a imagem verbal de algo mau “sair” ou proceder de Jacó e de seus descendentes, expressa em português natural como “vir de”.
- source_word: ወኢይቀድም፡ ምንተኒ፡ ዘእንበለ፡ ተፋቅሮ
  choice: e não serei o primeiro em coisa alguma, a não ser no amor
  rationale: Preserva a primeira pessoa e a ideia de primazia presentes no ge'ez, sem adotar a leitura alternativa de que “nada virá antes de nós”.
