  to: E eis que completei todos os dias da minha vida que eu havia de viver.” Jacó riu por causa das palavras de sua mãe, pois ela lhe havia dito que morreria; contudo, ela permanecia diante dele, ainda com sua força, sem ter perdido o vigor, pois entrava, saía e via,
