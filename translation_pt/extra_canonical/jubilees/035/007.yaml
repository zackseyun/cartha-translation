base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/007.yaml
  text: And behold, I have completed all the days of my life that I was to live.” And Jacob laughed because of the words of his mother, because his mother had told him that she would die, yet she remained opposite him, and her strength was upon her, and she had not grown weak in strength, for she went in and went out and saw,
translation:
  language: pt
  text: E eis que completei todos os dias da minha vida que eu havia de viver.” Jacó riu por causa das palavras de sua mãe, pois ela lhe havia dito que morreria; contudo, ela permanecia diante dele, ainda com sua força, sem ter perdido o vigor, pois entrava, saía e via,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: completei todos os dias da minha vida
  rationale: Reproduz diretamente a ideia de completar a totalidade dos dias de vida.
- source_word: ወበሐቀ፡ ያዕቆብ
  choice: Jacó riu
  rationale: O verbo indica riso; a formulação simples preserva o sentido narrativo.
- source_word: ትነብር፡ አንጻሪሁ
  choice: ela permanecia diante dele
  rationale: Mantém o valor de permanecer/estar e a relação espacial de estar em frente a Jacó, sem restringir a postura a 'sentada'.
- source_word: ወኀይላ፡ ላዕሌሃ
  choice: ainda com toda a sua força
  rationale: Expressa em português natural a construção idiomática segundo a qual sua força continuava sobre ela.
- source_word: ወኢደክመት፡ እምኀይላ
  choice: sem ter perdido o vigor
  rationale: Traduz a ausência de enfraquecimento de modo corrente e digno, evitando repetição pouco natural de 'força'.
- source_word: ትበውእ፡ ወትወፅእ፡ ወትሬኢ
  choice: entrava, saía e enxergava
  rationale: Conserva a tríade verbal concreta do texto-fonte e o aspecto de atividade habitual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe foi ajustada para fluidez sem eliminar a tensão entre o anúncio da morte e o vigor ainda evidente da mãe de Jacó. O versículo termina com vírgula porque a oração prossegue no contexto seguinte.
