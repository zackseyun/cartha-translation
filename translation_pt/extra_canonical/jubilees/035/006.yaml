base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/006.yaml
  text: 'And she said to him, “My son, all my days I have not seen in you any deed of crookedness, but only uprightness. Yet I will tell you the truth, my son: I shall die in this year, and I shall not live beyond this year, for I saw in a dream the day of my death, that I would not live beyond one hundred and fifty-five years.”'
translation:
  language: pt
  text: 'E ela lhe disse: “Meu filho, em todos os meus dias não vi em você nenhum ato de perversidade, mas somente retidão. Contudo, eu lhe direi a verdade, meu filho: morrerei neste ano e não viverei além dele, pois vi em sonho o dia da minha morte: não viverei além de cento e cinquenta e cinco anos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ጠዋየ
  choice: ato de perversidade
  rationale: Traduz a ideia de uma ação moralmente tortuosa ou desviada em português natural, sem restringi-la a mera desonestidade.
- source_word: ርቱዐ
  choice: retidão
  rationale: Preserva o contraste ético com a perversidade e a formulação substantiva do contexto.
- source_word: ጽድቀ
  choice: a verdade
  rationale: Neste contexto, a expressão introduz uma declaração franca e verdadeira, não uma afirmação técnica sobre justiça.
- source_word: ኢይትዐደው፡ ዛተ፡ ዓመተ፡ በሕይወትየ
  choice: não viverei além dele
  rationale: Expressa de modo idiomático que sua vida não ultrapassará o ano mencionado, evitando uma reprodução artificial da construção ge'ez.
- source_word: እምእት፡ ወኃምሳ፡ ወኀምስ
  choice: cento e cinquenta e cinco anos
  rationale: Reproduz diretamente o número preservado no texto-fonte.
