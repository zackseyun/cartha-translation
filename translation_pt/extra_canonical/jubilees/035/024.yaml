  source_fidelity: 'A indicação cronológica no rascunho não é uma idade de 155 anos. No contexto da edição de Charles e conforme o registro inglês de auditoria, a fórmula data a morte de Rebeca: no terceiro ano da sétima semana do quadragésimo primeiro jubileu. A conversão proposta também pressupõe jubileus de 49 anos, mas o texto não está a fornecer uma idade nessa cláusula.'
  naturalness: A redação é clara e fluente, mas a correção cronológica exige reformular a frase. «Caverna dupla» é compreensível e mantém a expressão do texto; «junto de Sara» soa um pouco mais natural aqui do que «perto de Sara».
  terminology: «Esaú», «Jacó», «Sara» e «jubileu» estão adequados. «Sétima semana» deve permanecer, pois é a unidade cronológica do livro; uma nota breve pode explicitar que se trata de uma semana de anos.
  issues:
  - severity: high
    issue: A morte de Rebeca é datada como se tivesse ocorrido aos 155 anos.
    rationale: A fonte contextual e a trilha inglesa identificam a expressão como «no terceiro ano da sétima semana do quadragésimo primeiro jubileu», não como a idade da personagem. Isso altera uma informação cronológica explícita.
  - severity: medium
    issue: A nota [a] explica uma leitura cronológica incorreta e introduz uma conversão numérica não sustentada nesta cláusula.
    rationale: A nota deve ser removida ou substituída por uma explicação neutra da «semana» como período de sete anos.
  revised_text: Naquela noite, ela e seus filhos comeram e beberam. E, naquela mesma noite, ela morreu, no terceiro ano da sétima semana do quadragésimo primeiro jubileu.[a] Seus dois filhos, Esaú e Jacó, a sepultaram na caverna dupla, junto de Sara, mãe do pai deles.
  revised_footnotes:
  - marker: a
    text: No calendário de Jubileus, uma «semana» é um período de sete anos.
    reason: Esclarece a unidade cronológica preservada literalmente, sem convertê-la em uma idade nem impor um cálculo adicional.
  revision_rationale: A revisão restaura a datação cronológica transmitida pelo versículo e elimina a conversão indevida em idade. Mantém-se a repetição narrativa de «naquela noite», os nomes tradicionais em português e a designação concisa «caverna dupla».
