  yaml_path: translation/extra_canonical/jubilees/035/024.yaml
  text: And they ate and drank, she and her sons, that night; and she died in that night, in the third year of the seventh week of the forty-first jubilee. And her two sons, Esau and Jacob, buried her in the double cave near Sarah, the mother of their father.
translation:
  language: pt
  text: Naquela noite, ela e seus filhos comeram e beberam. E, naquela mesma noite, ela morreu, no terceiro ano da sétima semana do quadragésimo primeiro jubileu.[a] Seus dois filhos, Esaú e Jacó, a sepultaram na caverna dupla, junto de Sara, mãe do pai deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: No calendário de Jubileus, uma «semana» é um período de sete anos.
    reason: Esclarece a unidade cronológica preservada literalmente, sem convertê-la em uma idade nem impor um cálculo adicional.
lexical_decisions:
- source_word: ሠለስተ፡ አዮቤልዉ፡ ወሱባዔ፡ አሐዱ፡ ወዓመት፡ አሐዱ
  choice: aos cento e cinquenta e cinco anos de idade
  rationale: 'A expressão etíope enumera três jubileus, uma semana de anos e um ano: 3×49 + 7 + 1 = 155. A formulação numérica comunica naturalmente a idade em português.'
- source_word: ባዐት፡ እንተ፡ ክልኤ
  choice: caverna dupla
  rationale: Tradução direta da expressão que designa a caverna dupla, preservando a forma do texto sem acrescentar uma identificação toponímica não explícita neste versículo.
- source_word: ቅሩበ፡ ሳራ
  choice: perto de Sara
  rationale: Mantém a relação espacial concisa do ge'ez; pelo contexto, a referência é ao lugar onde Sara estava sepultada.
- source_word: እመ፡ አቡሆሙ
  choice: mãe do pai deles
  rationale: Reproduz a relação familiar explicitada pelo texto, isto é, Sara como mãe de Isaque, pai de Esaú e Jacó.
