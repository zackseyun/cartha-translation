  text: 'which you commanded me: that I should honor my father and my brother. Tell me, then, what crookedness you have seen in me;'
translation:
  language: pt
  text: 'como você me ordenou: que eu honrasse meu pai e meu irmão. Diga-me, mãe, que desvio você viu a meu respeito;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አክብር
  choice: honrasse
  rationale: Expressa o mandamento de tratar com honra, em construção subordinada natural após “ordenou”.
- source_word: አበየ
  choice: meu pai
  rationale: Tradução direta do substantivo com sufixo possessivo de primeira pessoa.
- source_word: ወእኅየየ
  choice: e meu irmão
  rationale: O texto ge’ez diz “meu irmão”, não “minha mãe”; a escolha preserva a referência específica ao irmão do falante.
- source_word: ጥውየተ
  choice: desvio
  rationale: Reproduz a ideia de algo torto ou moralmente desviado sem impor uma acusação mais específica do que o original.
theological_decisions:
- issue: Relação entre o mandamento e pai/irmão
  choice: Manter “meu pai e meu irmão”
  alternative: Normalizar para a fórmula bíblica familiar “meu pai e minha mãe”
  rationale: A leitura efetiva do ge’ez menciona o irmão; normalizá-la apagaria a particularidade narrativa e introduziria uma formulação ausente da fonte.
translation_notes:
  register: Português atual, claro e digno, com “você” para ampla legibilidade brasileira. A abertura em minúscula e o ponto e vírgula preservam a continuidade sintática indicada pelo recorte do versículo.
