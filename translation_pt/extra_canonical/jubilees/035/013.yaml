  yaml_path: translation/extra_canonical/jubilees/035/013.yaml
  text: And Isaac said to her, “I also know and see Jacob’s conduct toward us, that with all his heart he honors us. I loved Esau before Jacob from the time he was born first, but now I love Jacob more than Esau, because he has made his deeds very evil, and there is no righteousness in him, for all his ways are injustice and violence, and there is no righteousness around him.”
translation:
  language: pt
  text: 'E Isaque lhe disse: “Eu também conheço e vejo como Jacó se comporta conosco: ele nos honra de todo o coração. Eu amava Esaú mais do que Jacó, pois ele nasceu primeiro; mas agora amo Jacó mais do que Esaú, porque Esaú tornou suas obras muito más[a] e não há justiça nele. Todos os seus caminhos são injustiça e violência, e não há justiça ao seu redor[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo outra compreensão da expressão: “porque suas obras são piores”.'
    reason: A construção com አብዝኀ pode ser entendida como intensificação, preferida no texto, embora uma leitura comparativa seja possível.
  - marker: b
    text: 'A expressão também pode ter sentido idiomático: “e não há justiça nele de modo algum”.'
    reason: O termo አውዶ significa literalmente “ao redor”, mas no contexto pode intensificar a negação.
lexical_decisions:
- source_word: ግብረ፡ ያዕቆብ
  choice: como Jacó se comporta
  rationale: Traduz naturalmente a ideia de conduta ou procedimento de Jacó, sem restringi-la a um ato isolado.
- source_word: በኵሉ፡ ልቡ፡ ውእቱ፡ ያከብረነ
  choice: ele nos honra de todo o coração
  rationale: Preserva a totalidade da devoção expressa pela locução etíope e mantém o objeto plural, referente a Isaque e Rebeca.
- source_word: ቀደሙ፡ እምነ፡ ያዕቆብ፡ እምዘተወልደ፡ ቀደሙ
  choice: mais do que Jacó, pois ele nasceu primeiro
  rationale: Expressa em português corrente a preferência anterior por Esaú e a razão ligada à sua primogenitura.
- source_word: አብዝኀ፡ አእክዮ፡ ምግባሪሁ
  choice: tornou suas obras muito más
  rationale: Entende አብዝኀ como intensificador e preserva o caráter ativo da expressão, em vez de introduzir necessariamente uma comparação.
- source_word: ዐመፃ፡ ወግፍዕ
  choice: injustiça e violência
  rationale: Mantém os dois conceitos éticos distintos e a formulação contundente do original.
- source_word: አውዶ
  choice: ao seu redor
  rationale: Conserva a imagem espacial explícita do termo, deixando em nota sua possível força idiomática.
theological_decisions:
- issue: Mudança da preferência de Isaque entre Esaú e Jacó
  choice: preservar a afirmação direta de que Isaque antes amava Esaú mais, mas agora ama Jacó mais
  alternative: atenuar “amava” para “preferia” ou harmonizar a declaração com outras tradições sobre os irmãos
  rationale: O texto formula deliberadamente uma mudança de amor ou preferência baseada na conduta; a tradução não deve resolver essa tensão narrativa.
- issue: Ausência de justiça em Esaú
  choice: manter tanto “não há justiça nele” quanto “não há justiça ao seu redor”
  alternative: fundir as duas declarações como mera repetição
  rationale: O original contém ambas as formulações, e a segunda acrescenta አውዶ; preservar as duas respeita a ênfase e a possível nuance própria da conclusão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe de leitura fluente no Brasil e compreensão internacional. “Isaque” e “Esaú” seguem as formas bíblicas correntes; “obras”, “justiça”, “injustiça” e “violência” preservam o tom ético solene do texto.
