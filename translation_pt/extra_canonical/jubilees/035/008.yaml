  language: en
  yaml_path: translation/extra_canonical/jubilees/035/008.yaml
  text: and her teeth were strong, and no sickness at all had come upon her in all the days of her life. And Jacob said to her, “Blessed am I, mother, if my days draw near to the days of your life, and if my strength remains upon me like this, according to your strength. You will not die, for you speak with me in vain concerning your death.”
translation:
  language: pt
  text: 'Seus dentes eram fortes, e nenhuma doença lhe havia sobrevindo durante todos os dias de sua vida. Então Jacó lhe disse: “Feliz sou eu, minha mãe, se os meus dias se aproximarem dos dias da sua vida e se a minha força permanecer assim sobre mim, conforme a sua força. Você não morrerá[a], pois fala comigo em vão a respeito da sua morte.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não morra”.'
    reason: Registra a leitura alternativa como proibição, embora o indicativo seja mais provável pela forma verbal e pelo contexto.
lexical_decisions:
- source_word: ጽኑዕ
  choice: ainda eram fortes
  rationale: O adjetivo expressa firmeza ou força; o acréscimo natural de “ainda” em português explicita, sem alterar o sentido, o vigor conservado na velhice.
- source_word: ኢበከፋ
  choice: nenhuma doença lhe havia sobrevindo
  rationale: A construção descreve uma enfermidade que não veio sobre ela; “sobrevir” conserva essa imagem e se ajusta ao registro narrativo.
- source_word: ብፁዕ፡ አነ
  choice: Feliz sou eu
  rationale: Expressa o estado afortunado de Jacó de modo corrente e digno, sem introduzir uma conotação técnica de beatificação.
- source_word: ወይሄስ፡ ኀይለየ፡ ላዕሌየ
  choice: e se a minha força permanecer assim sobre mim
  rationale: Mantém a imagem semítica da força que permanece “sobre” a pessoa, com sintaxe compreensível em português.
- source_word: አትመውቲ
  choice: Você não morrerá
  rationale: A forma verbal é mais bem entendida como imperfeito indicativo negativo, isto é, uma afirmação tranquilizadora, e não como ordem proibitiva.
- source_word: በጸው
  choice: em vão
  rationale: Reproduz a ideia de falar inutilmente ou sem fundamento, adequada à resposta de Jacó sobre a morte anunciada pela mãe.
theological_decisions:
- issue: Valor modal de አትመውቲ
  choice: Você não morrerá
  alternative: Não morra
  rationale: O indicativo preserva a leitura morfológica mais provável e o contexto em que Jacó conclui, a partir do vigor da mãe, que ela não morrerá; a alternativa é registrada em nota por sua presença na tradição de tradução.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se alguma literalidade nas expressões “dias da sua vida” e “força… sobre mim” para refletir as imagens do texto ge’ez sem tornar a frase obscura.
