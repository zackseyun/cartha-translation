  text: And you, do not fear for Jacob, for Jacob’s guardian is great and mighty and honored, and more praised than Esau’s guardian.” And Rebekah sent and called Esau, and he came to her. And she said to him, “My son, I ask one request from you; say that you will do it, my son.”
translation:
  language: pt
  text: '“E você, não tenha medo por Jacó, pois o guardião de Jacó é grande, poderoso e honrado, e mais louvado[a] do que o guardião de Esaú.” Então Rebeca mandou chamar Esaú, e ele veio até ela. Ela lhe disse: “Meu filho, tenho um pedido a lhe fazer; diga que o fará, meu filho.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «honrado e mais poderoso do que o guardião de Esaú. E Rebeca louvou Isaque e chamou Esaú».'
    reason: Registra a leitura alternativa previamente adotada no histórico inglês, sem a preferir à leitura do texto-fonte e da revisão atual, em que «mais louvado» continua a descrição do guardião de Jacó e Rebeca manda chamar Esaú.
lexical_decisions:
- source_word: ዐቃቢሁ (ʿaqābihu)
  choice: o guardião de
  rationale: Mantém a imagem do agente protetor ligado a cada irmão, sem especificar além do que o texto diz.
- source_word: ዐቢይ፡ ወኃያል፡ ወክቡር
  choice: grande, poderoso e honrado
  rationale: Reproduz a sequência de qualificativos do guardião de Jacó em português natural e solene.
- source_word: ወአኩት፡ እምዐቃቢሁ፡ ለዔሳው
  choice: e mais louvado do que o guardião de Esaú
  rationale: Conserva o sentido comparativo e o qualificativo ligado ao guardião de Jacó, evitando a leitura secundária que introduz um elogio de Rebeca a Isaque.
- source_word: ወለአኮት፡ ርብቃ፡ ወጸውዐተ፡ ለዔሳው
  choice: Então Rebeca mandou chamar Esaú
  rationale: Expressa o envio e o chamado como a construção idiomática portuguesa “mandar chamar”, sem inserir Isaque na ação.
- source_word: ስእለት፡ ብየ
  choice: faço-lhe um pedido
  rationale: Verte literalmente a ideia de pedir uma petição, eliminando em português a redundância pouco natural de “pedir um pedido”.
theological_decisions:
- issue: Identidade do guardião de Jacó e do guardião de Esaú
  choice: manter apenas “guardião”, sem identificar a figura
  alternative: explicitar “anjo da guarda” ou outra entidade espiritual
  rationale: O verso não identifica de modo inequívoco os guardiões; a tradução preserva essa abertura e evita importar uma angelologia específica.
- issue: Relação do comparativo “mais louvado”
  choice: ligá-lo ao guardião de Jacó
  alternative: ler a forma seguinte como uma ação de Rebeca, “Rebeca louvou Isaque”
  rationale: A sintaxe e a revisão textual fornecida favorecem a continuação da descrição comparativa do guardião, seguida de Rebeca mandar chamar Esaú.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções naturais para leitores brasileiros. O discurso direto preserva a repetição afetiva de “meu filho”. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
