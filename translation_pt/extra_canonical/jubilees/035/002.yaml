  yaml_path: translation/extra_canonical/jubilees/035/002.yaml
  text: And Jacob said to her, "I will do all that you have commanded me, for this matter will be an honor and greatness to me, and righteousness before God, that I should honor them."
translation:
  language: pt
  text: 'E Jacó lhe disse: “Farei tudo o que você me ordenou, pois este assunto será para mim honra e grandeza, e justiça diante de Deus, para que eu os honre.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘአዘዝክኒ
  choice: o que você me ordenou
  rationale: Preserva o verbo no perfeito, a interlocutora feminina no singular e Jacó como objeto na primeira pessoa, em português moderno e amplamente compreensível.
- source_word: ክብረ ፡ ወዕበየ
  choice: honra e grandeza
  rationale: Mantém os dois substantivos coordenados e sua função predicativa, sem reduzir o segundo a mero prestígio.
- source_word: ወጽድቀ ፡ ቅድመ ፡ እግዚአብሔር
  choice: e, diante de Deus, justiça
  rationale: Conserva a linguagem forense e moral de 'justiça' e a expressão espacial-relacional 'diante de Deus'.
- source_word: ከመ ፡ አክብሮሙ
  choice: que eu os honre
  rationale: Mantém o referente plural masculino do sufixo e deixa aberta a relação explicativa ou final introduzida por ከመ.
theological_decisions:
- issue: Relação entre honrar 'os' e a justiça diante de Deus
  choice: 'Pontuação com dois-pontos: ''justiça: que eu os honre'''
  alternative: '''justiça diante de Deus, para que eu os honre'''
  rationale: O dois-pontos preserva a possibilidade de a oração final explicar em que consiste essa justiça, sem excluir totalmente uma nuance de propósito e sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de leitura natural, com 'você' adequado à interlocutora singular e sem conteúdo de outros versículos. A formulação ligeiramente solene 'diante de Deus' preserva o registro do texto-fonte.
