base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/014.yaml
  text: And now my heart is troubled because of all his deeds, and neither he nor his seed will be saved, for they are those who will be destroyed from the earth and those who will be uprooted from under heaven, because he has forsaken the God of Abraham and gone after his wives and after
translation:
  language: pt
  text: E agora meu coração está perturbado por causa de todas as suas obras. Nem ele nem a sua descendência serão salvos, pois são eles os que serão eliminados da terra e arrancados de debaixo do céu, porque ele abandonou o Deus de Abraão e foi atrás de suas mulheres e atrás de[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto disponível deste versículo termina aqui, no meio da frase.
    reason: O testemunho fornecido é fragmentário e encerra-se após a segunda ocorrência de «atrás de»; a nota evita completar conjecturalmente o texto.
lexical_decisions:
- source_word: ልብየ፡ ይትሀወክ
  choice: meu coração está perturbado
  rationale: Reproduz de modo natural o estado de profunda inquietação expresso pelo ge'ez.
- source_word: ምግባራቲሁ
  choice: suas obras
  rationale: Mantém o sentido amplo de atos ou conduta sem restringi-lo a uma categoria específica.
- source_word: ወዘርኡ
  choice: nem a sua descendência
  rationale: O substantivo 'semente' designa aqui os descendentes; 'descendência' é claro e digno em português moderno.
- source_word: ይትሐጐሉ ... እምነ፡ ምድር
  choice: serão destruídos da terra
  rationale: Preserva a correspondência correta do primeiro verbo com 'da terra', conforme a ordem e o sentido do texto ge'ez.
- source_word: ይሤረዉ ... እምታሕተ፡ ሰማይ
  choice: arrancados de debaixo do céu
  rationale: Traduz a imagem de desenraizamento ou remoção total e mantém o complemento 'de debaixo do céu'.
- source_word: ኀደገ
  choice: abandonou
  rationale: Expressa a ideia de deixar ou abandonar Deus no contexto de infidelidade.
- source_word: ሖረ፡ ድኅረ፡ አንስቲያሁ
  choice: foi atrás de suas mulheres
  rationale: Conserva a construção concreta e acusatória do original sem explicar além do que o fragmento afirma.
theological_decisions:
- issue: Alcance da afirmação sobre a não salvação dele e de sua descendência
  choice: Nem ele nem a sua descendência serão salvos
  alternative: Ele e sua descendência não escaparão
  rationale: Mantém o valor soteriológico possível de ሊድኅን sem reduzir a frase apenas a escape físico; o contexto imediato de destruição permanece tensionado com esse sentido.
- issue: Identidade do referente plural em 'são eles os que'
  choice: Preservar o plural enfático sem explicitar quem são todos os envolvidos
  alternative: Explicitar o indivíduo e seus descendentes
  rationale: O original passa do singular e sua descendência a uma formulação plural; a tradução preserva essa transição sem resolver a referência de maneira interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A sintaxe conserva o encadeamento solene do original, mas divide o início em duas frases para facilitar a leitura. O final incompleto foi mantido deliberadamente e sinalizado por nota.
