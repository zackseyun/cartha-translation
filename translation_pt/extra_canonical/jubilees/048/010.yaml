  to: E todo o povo que ele havia feito sair perseguiu os israelitas[a]. Então Yahweh, nosso Deus, lançou-os no meio do mar, em suas profundezas, debaixo dos filhos de Israel, assim como os egípcios haviam lançado no rio os filhos deles. Um milhão e dez mil guerreiros valentes foram destruídos por causa de uma única criança de peito do teu povo, que eles haviam lançado no rio.[b]
