base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/010.yaml
  text: And all the people whom he brought out pursued after them[10], after Israel, and Yahweh our God cast them into the midst of the sea, into its depths, beneath the sons of Israel, just as the people of Egypt had cast their sons into the river. A thousand thousand and ten thousand mighty men were destroyed because of one nursing infant of the children of your people whom they had thrown into the river.
translation:
  language: pt
  text: E todo o povo que ele havia feito sair perseguiu os israelitas[a]. Então Yahweh, nosso Deus, lançou-os no meio do mar, em suas profundezas, debaixo dos filhos de Israel, assim como os egípcios haviam lançado no rio os filhos deles. Um milhão e dez mil guerreiros valentes foram destruídos por causa de uma única criança de peito do teu povo, que eles haviam lançado no rio.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A numeração preservada na fonte salta do versículo 9 para o 14; aqui o capítulo é numerado sequencialmente para facilitar a leitura, sem omitir o conteúdo existente.
    reason: segmentation_note
  - marker: b
    text: A divisão deste trecho entre versículos varia; a frase final foi mantida aqui para completar a construção da fonte preservada.
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር፡ አምላክ
  choice: Yahweh, nosso Deus
  rationale: Preserva o nome divino conforme a camada inglesa auditada e verte explicitamente 'Deus', mantendo a referência comunitária.
- source_word: ማእከለ፡ ባሕር፡ ውስተ፡ መዓምቅቲሃ
  choice: no meio do mar, em suas profundezas
  rationale: Reproduz as duas expressões espaciais do ge'ez sem fundi-las.
- source_word: ምእተ፡ አልፈ፡ ... ወዐሠርተ፡ ምእተ
  choice: um milhão e dez mil
  rationale: Expressa em numeração portuguesa corrente o valor literal 'mil milhares e dez milhares'.
- source_word: ዐይሠ
  choice: criança de peito
  rationale: Mantém a ideia de lactente de modo natural e dignificado, sem precisar o sexo que o termo não explicita claramente no contexto.
- source_word: በእንተ
  choice: por causa de
  rationale: Mantém a relação causal/retributiva sem acrescentar uma explicação teológica não expressa.
theological_decisions:
- issue: Caráter retributivo da destruição do exército egípcio
  choice: por causa de uma única criança de peito
  alternative: em retribuição por uma única criança de peito
  rationale: A formulação causal preserva a tensão do texto sem tornar explícita uma interpretação jurídica que o original não formula.
- issue: Nome divino
  choice: Yahweh
  alternative: SENHOR
  rationale: A transliteração distingue o nome próprio divino de títulos e segue a convenção POB indicada na revisão auditada.
- issue: Referência aos filhos lançados no rio
  choice: os filhos deles
  alternative: seus filhos
  rationale: Evita a ambiguidade pronominal em português e conserva o paralelo entre os egípcios e os filhos de Israel.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e alcance internacional. A repetição semítica foi suavemente reorganizada em 'perseguiu os israelitas', sem alterar os participantes. Todos os marcadores de nota aparecem no texto.
