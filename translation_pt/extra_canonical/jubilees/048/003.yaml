base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/003.yaml
  text: On the way[3], at the lodging-place, he met you. Did he not desire with all his power to kill you and to save the Egyptians from your hand, when he saw that you had been sent to do this and to execute judgment upon Egypt?
translation:
  language: pt
  text: No caminho, no lugar de pouso, ele encontrou você.[a] Não desejou ele, com todo o seu poder, matar você e livrar os egípcios da sua mão, quando viu que você havia sido enviado para fazer isso e executar juízo sobre o Egito?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo pode indicar um encontro hostil ou um confronto; compare com o episódio de Êxodo em que ocorre um confronto mortal durante a viagem.
    reason: lexical_alternative
lexical_decisions:
- source_word: በፍኖተ
  choice: No caminho
  rationale: Expressa naturalmente o sentido locativo de estar em viagem.
- source_word: በምጽላል
  choice: no lugar onde passaram a noite
  rationale: O termo designa o local de pouso ou alojamento durante a viagem; a formulação evita sugerir uma hospedaria formal.
- source_word: ትትቄበሎ
  choice: ele encontrou você
  rationale: O verbo indica encontro ou confronto; o contexto pode ser hostil, mas não justifica inserir explicitamente 'acusar'.
- source_word: አኮሁ
  choice: Não desejou ele...?
  rationale: Preserva a construção de pergunta retórica, em vez de convertê-la numa afirmação simples.
- source_word: ያድኅኖሙ
  choice: livrar
  rationale: Representa o sentido de salvar ou libertar os egípcios da mão de Moisés.
- source_word: በቀለ ላዕለ
  choice: executar juízo sobre
  rationale: No contexto, comunica uma ação punitiva ou retributiva contra o Egito sem especificar além do texto.
theological_decisions:
- issue: Identidade do agente do encontro hostil
  choice: Manter apenas o pronome 'ele'
  alternative: Identificá-lo explicitamente como Deus, o Senhor ou outro agente
  rationale: O fragmento fornecido usa referência pronominal; explicitar a identidade resolveria uma questão contextual que o próprio versículo não nomeia.
- issue: Natureza do encontro
  choice: Traduzir como 'encontrou', com nota sobre o possível caráter hostil
  alternative: Traduzir diretamente como 'atacou' ou 'veio acusar'
  rationale: A tradução principal conserva o valor lexical amplo, enquanto a nota informa a tensão narrativa sem importar o sentido não atestado de 'acusar'.
- issue: Sentido da ação contra o Egito
  choice: executar juízo sobre o Egito
  alternative: vingar-se do Egito
  rationale: A escolha preserva o caráter judicial e punitivo da expressão sem impor uma formulação mais emocional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A segunda pessoa foi vertida por 'você' para naturalidade contemporânea; 'da sua mão' foi mantido como expressão bíblica inteligível de poder ou domínio. A pergunta retórica se estende até o fim do versículo.
