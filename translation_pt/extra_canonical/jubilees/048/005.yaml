base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/005.yaml
  text: 'And the LORD executed a great vengeance on them for Israel: he struck them with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters, and their livestock with death, and with hailstones—by this he destroyed everything that grew for them—and with locusts that devoured what had been left for them from the hail, and with darkness, and with the death of their firstborn, of man and beast; and on all their gods the LORD executed vengeance.'
translation:
  language: pt
  text: 'E o SENHOR executou sobre eles uma grande vingança por causa de Israel: feriu-os com sangue, rãs, mosquitos e moscas caninas[a], e com úlceras malignas que rebentavam em bolhas; feriu os seus rebanhos com a morte e com pedras de granizo; por meio deste destruiu tudo o que crescia para eles; enviou gafanhotos, que devoraram o que lhes restara do granizo, e trevas; e trouxe a morte dos primogênitos deles, tanto de seres humanos como de animais. E o SENHOR executou vingança contra todos os deuses deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: enxames de moscas. O termo etíope significa literalmente “moscas de cão”, mas a identificação exata do inseto é incerta.'
    reason: Preserva a forma lexical da fonte e informa a incerteza zoológica e a alternativa contextual.
lexical_decisions:
- source_word: በቀለ
  choice: vingança
  rationale: O termo designa retribuição ou vingança; “vingança” preserva a repetição enfática no início e no fim do versículo.
- source_word: በጽንጽያ፡ ክልብ
  choice: moscas caninas
  rationale: Tradução formal do composto tradicionalmente entendido como “moscas de cão”; evita substituir silenciosamente o referente incerto por uma espécie moderna específica.
- source_word: ቍስል፡ ዘውእቱ፡ ይፈልሕ፡ ዐንጸዐንጺ
  choice: feridas malignas que irrompiam em bolhas
  rationale: Reproduz a imagem de lesões graves que rebentam ou fervilham em bolhas, com formulação natural em português.
- source_word: ኵሎ፡ ዘይሠርፅ፡ ሎሙ
  choice: tudo o que crescia para eles
  rationale: Mantém tanto a ideia de vegetação em crescimento quanto o dativo “para eles”, sem restringir indevidamente a plantações.
- source_word: በኵሉ፡ አማልክቲሆሙ
  choice: contra todos os deuses deles
  rationale: Conserva a referência plural explícita aos deuses dos egípcios e a ação retributiva dirigida contra eles.
theological_decisions:
- issue: Agente divino ao longo da enumeração das pragas
  choice: Tornar explícitos “feriu”, “enviou” e “trouxe” para manter clareza sintática, conservando o SENHOR como agente único.
  alternative: Repetir apenas a preposição “com” em toda a longa série, como no encadeamento da fonte.
  rationale: A explicitação é exigida pela fluência do português e não altera a atribuição teológica das pragas ao SENHOR.
- issue: Vingança “por causa de Israel”
  choice: Preservar a formulação causal ampla “por causa de Israel”.
  alternative: Interpretar como “em favor de Israel” ou “para vingar Israel”.
  rationale: A fonte permite uma relação causal ou representativa; a opção escolhida evita resolver além do necessário a nuance exata.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com boa naturalidade brasileira. A longa enumeração foi organizada por pontuação e por alguns verbos explícitos, sem perder a sequência cumulativa da fonte. “SENHOR” representa o título divino tradicional no texto.
