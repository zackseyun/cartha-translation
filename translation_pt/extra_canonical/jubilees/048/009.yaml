revisions:
- from: E o príncipe Mastema se levantou contra você e procurou entregá-lo nas mãos do faraó. Ele ajudou os magos do Egito, e eles se apresentaram diante de você e realizaram seus atos. Nós lhes permitimos, de fato, fazer o mal, mas não permitimos que realizassem curas com as próprias mãos.[a] O SENHOR, porém, os feriu com chagas malignas, e eles já não puderam continuar resistindo, porque os tornamos incapazes de realizar sequer um sinal de feitiçaria. Por meio de todos os sinais e prodígios, o príncipe Mastema foi envergonhado, até que, quando reuniu forças, gritou aos egípcios que perseguissem você com todo o poder do Egito — com seus carros, seus cavalos e toda a multidão do povo egípcio. Então me coloquei entre os egípcios e Israel, e livramos Israel das mãos dele e das mãos de seu povo; e o SENHOR os conduziu pelo meio do mar, como por terra seca.
