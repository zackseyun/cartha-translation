base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/009.yaml
  text: And the prince Mastema stood up against you and sought to cast you into Pharaoh’s hand, and he helped the magicians of Egypt, and they stood and acted before you. We indeed permitted them to do evil, but we did not allow healing to be performed by their hands. But the LORD struck them with evil sores, and they were unable to continue resisting, because we made them incapable of performing even one sign of enchantment. And through all the signs and wonders the prince Mastema was put to shame, until, when he grew strong, he cried out to the Egyptians that they should pursue after you with all the power of Egypt, with their chariots and with their horses and with all the multitude of the people of Egypt. And I stood between the Egyptians and Israel, and we delivered Israel from his hand and from the hand of his people, and the LORD brought them out through the midst of the sea as on dry land.
translation:
  language: pt
  text: E o príncipe Mastema se levantou contra você e procurou entregá-lo nas mãos do faraó. Ele ajudou os magos do Egito, e eles se puseram de pé e agiram diante de você. Nós lhes permitimos, de fato, fazer o mal, mas não permitimos que realizassem curas com as próprias mãos. O SENHOR, porém, os feriu com chagas malignas, e eles já não puderam continuar resistindo, porque os tornamos incapazes de realizar sequer um sinal de feitiçaria. Por meio de todos os sinais e prodígios, o príncipe Mastema foi envergonhado, até que, quando reuniu forças, gritou aos egípcios que perseguissem você com todo o poder do Egito — com seus carros, seus cavalos e toda a multidão do povo egípcio. Então me coloquei entre os egípcios e Israel, e livramos Israel das mãos dele e das mãos de seu povo; e o SENHOR os conduziu pelo meio do mar, como por terra seca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን፡ መስተማ
  choice: o príncipe Mastema
  rationale: መኰንን designa um governante, chefe ou príncipe; “príncipe” preserva o título tradicional e o papel supra-humano de Mastema no contexto de Jubileus.
- source_word: ያውድቅ፡ ውስተ፡ እዴ ፈረዖን
  choice: entregá-lo nas mãos do faraó
  rationale: A expressão idiomática significa fazer cair sob o poder de alguém; “entregar nas mãos” comunica isso naturalmente em português.
- source_word: ፈውሳስ
  choice: curas
  rationale: O termo indica cura ou remédio e forma contraste explícito com o mal permitido na oração anterior.
- source_word: ቍስል፡ እኩይ
  choice: chagas malignas
  rationale: Reproduz a combinação de “ferida/chaga” com “má/maligna” e se ajusta ao contexto das aflições dos magos.
- source_word: ሕሱደ፡ ትእምርተ
  choice: sinal de feitiçaria
  rationale: Expressa um sinal ligado a arte enganosa ou encantamento, sem confundi-lo com os sinais divinos mencionados em seguida.
- source_word: ተአምር፡ ወመንክር
  choice: sinais e prodígios
  rationale: Mantém a fórmula dupla do texto e sua ressonância narrativa com o êxodo.
- source_word: ኃይሎሙ፡ ለግብጽ
  choice: todo o poder do Egito
  rationale: Abrange a força militar egípcia, desenvolvida logo depois pela referência a carros, cavalos e multidão.
theological_decisions:
- issue: Agência divina e permissão do mal
  choice: “Nós lhes permitimos, de fato, fazer o mal, mas não permitimos que realizassem curas”
  alternative: “Eles praticaram suas artes, e nós permitimos que isso fosse feito por suas mãos”
  rationale: O texto etíope apresenta um contraste entre o mal permitido e a cura impedida. A tradução conserva tanto a permissão limitada quanto a restrição, sem atribuir a Deus a prática direta do mal.
- issue: Alternância entre primeira pessoa plural e o SENHOR
  choice: Preservar “nós” e “o SENHOR” como sujeitos distintos na superfície do texto
  alternative: Uniformizar todas as ações como atos do SENHOR ou do narrador angelical
  rationale: A alternância pertence ao texto e pode refletir o discurso do anjo e a ação divina; uniformizá-la resolveria indevidamente uma tensão narrativa e teológica genuína.
- issue: Referente de “Israel” no resgate
  choice: “livramos Israel”
  alternative: “livramos os israelitas”
  rationale: O original emprega Israel em forma coletiva e depois usa pronomes plurais; manter “Israel” preserva essa oscilação entre nome coletivo e povo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Empregou-se “você” porque o discurso se dirige diretamente a Moisés; formas oblíquas como “entregá-lo” evitam repetição excessiva. A pontuação foi ajustada para tornar claro o longo encadeamento narrativo sem eliminar suas relações lógicas.
