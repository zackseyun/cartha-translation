    issue: Nota de rodapé conserva uma leitura anterior não sustentada pelo texto corrigido
    rationale: A nota propõe uma redação que omite o contraste explícito entre o mal permitido e a cura impedida. Não assinala uma variante textual, mas uma tradução previamente corrigida; por isso pode induzir o leitor a tratar como alternativa textual uma leitura deficiente.
