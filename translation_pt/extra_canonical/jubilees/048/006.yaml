  text: And he burned them with fire. And everything was entrusted into your hand so that you might do it, before it was done, and you were present.
translation:
  language: pt
  text: E ele os queimou com fogo. E tudo foi confiado em tua mão, para que o fizesses antes que fosse feito, e tu estavas presente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውዐዮሙ፡ በእሳት
  choice: os queimou com fogo
  rationale: Reproduz diretamente o verbo causativo com o pronome plural e a expressão instrumental do ge'ez.
- source_word: ተፈነወ፡ በእዴከ
  choice: foi confiado às tuas mãos
  rationale: No contexto, expressa entrega à autoridade e atuação do destinatário; em português, o plural idiomático 'às tuas mãos' soa natural sem perder a imagem do original.
- source_word: ከመ፡ ትግበር
  choice: para que o fizesses
  rationale: Mantém a oração final e a referência abrangente a 'tudo', com sequência verbal natural em português.
- source_word: ዘእንበለ፡ ይትገበር
  choice: antes que fosse feito
  rationale: Traduz a construção temporal com እንበለ e subjuntivo como anterioridade, conforme a sintaxe do ge'ez.
- source_word: ወሀለወከ
  choice: e tu estavas presente
  rationale: Conserva explicitamente a afirmação final de presença, incluindo a ênfase pronominal adequada em português.
theological_decisions:
- issue: Relação entre a atuação do destinatário e a realização dos acontecimentos
  choice: antes que fosse feito, e tu estavas presente
  alternative: e nada foi feito sem ti
  rationale: A tradução escolhida segue a leitura temporal da construção ge'ez e preserva separadamente a declaração explícita de presença, sem converter o verso numa afirmação teológica mais abrangente de causalidade exclusiva.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento na segunda pessoa do singular para refletir o discurso direto. A sintaxe foi mantida próxima do original, mas com formulação idiomática brasileira e amplamente compreensível.
