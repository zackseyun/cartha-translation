  to: E ele os queimou com fogo. E tudo foi confiado em tua mão, para que o fizesses antes que fosse feito, e tu estavas presente.
  rationale: Apenas se restabelece o singular de «mão», conforme o ge'ez. Mantêm-se «antes que fosse feito» e «tu estavas presente», pois a primeira traduz a construção temporal adotada na revisão do texto-fonte inglês e a segunda conserva a afirmação final explícita, sem a transformar em uma alegação de que nada ocorreu sem o destinatário.
