base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/004.yaml
  text: But I delivered you from his hand, and you did the signs and wonders which you were sent to do in Egypt against Pharaoh and against all his house and against his servants and against his people.
translation:
  language: pt
  text: Mas eu te livrei da mão dele, e fizeste os sinais e prodígios que foste enviado a realizar no Egito contra o faraó, contra toda a sua casa, contra os seus servos e contra o seu povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባላሕኩከ፡ እምእዴሁ
  choice: Mas eu te livrei das mãos dele
  rationale: Preserva a imagem semítica de libertar alguém da mão, usando o plural idiomático natural em português.
- source_word: ተአምረ፡ ወመንክረ
  choice: sinais e prodígios
  rationale: Equivalência bíblica corrente e digna para o par que designa feitos extraordinários com valor revelador.
- source_word: ተፈነውከ፡ ትግበር
  choice: que foste enviado a realizar
  rationale: Reproduz a relação entre o envio e a realização dos sinais sem a construção gramaticalmente problemática registrada numa revisão inglesa anterior.
- source_word: ላዕለ
  choice: contra
  rationale: Mantém a força adversativa da preposição e sua repetição retórica diante dos quatro objetos.
- source_word: ኵሉ፡ ቤቱ
  choice: toda a sua casa
  rationale: Conserva o sentido coletivo e dinástico de 'casa', sem reduzi-lo apenas a residência ou família.
theological_decisions:
- issue: Agente da libertação de Moisés
  choice: eu te livrei
  alternative: tu foste livrado
  rationale: Mantém a primeira pessoa explícita do texto, sem ocultar a atuação do orador celestial no contexto.
- issue: Alcance de 'casa' do faraó
  choice: toda a sua casa
  alternative: toda a sua família
  rationale: Preserva a amplitude e a possível ambiguidade institucional, doméstica e dinástica do termo.
translation_notes:
  register: Português moderno, solene e acessível, com boa legibilidade brasileira. A repetição de 'contra' foi mantida por sua força formal e enumerativa. O elemento isolado ግብጻውያን ('egípcios') no início do recorte foi tratado como remanescente da segmentação do versículo anterior, em conformidade com a camada inglesa auditada e com a sintaxe completa deste versículo.
