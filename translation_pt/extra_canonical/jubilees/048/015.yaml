  yaml_path: translation/extra_canonical/jubilees/048/015.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the prince Mastema was bound and imprisoned behind the children of Israel.
translation:
  language: pt
  text: E, no décimo quarto dia, no décimo quinto, no décimo sexto, no décimo sétimo e no décimo oitavo, o príncipe Mastema foi amarrado e encarcerado atrás dos filhos de Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope fornecido começa com algumas palavras que parecem concluir o versículo anterior, acerca dos que foram lançados no meio do rio. A expressão traduzida por “atrás dos filhos de Israel” é literal, mas seu sentido exato neste contexto é incerto.
    reason: textual_boundary_and_ambiguity
lexical_decisions:
- source_word: መኩነነ፡ ማእቲማ፡
  choice: o príncipe Mastema
  rationale: መኩነን designa um governante, príncipe ou autoridade; “príncipe” mantém o título tradicional e comunica sua posição sem acrescentar uma interpretação denominacional.
- source_word: አቡረ፡ ወዐዐወ፡
  choice: ficou amarrado e encarcerado
  rationale: A dupla expressão descreve contenção física e reclusão. A formulação portuguesa conserva ambos os elementos e o valor estativo indicado pelo contexto.
- source_word: እምድኅሬሆሙ፡ ለውሉደ፡
  choice: atrás dos filhos de Israel
  rationale: A preposição tem sentido espacial básico de “atrás/depois deles”. Embora a expressão seja incomum, a tradução preserva essa dificuldade em vez de substituí-la por uma explicação como “longe deles” ou “impedido de acusá-los”.
theological_decisions:
- issue: Natureza e função de Mastema
  choice: Manter apenas o título “príncipe” e a descrição de sua prisão
  alternative: Identificá-lo como Satanás ou explicar que foi impedido de acusar Israel
  rationale: O trecho não faz explicitamente essa identificação nem declara aqui a finalidade da prisão; acrescentá-las resolveria além do texto sua identidade e função.
translation_notes:
  register: Português moderno, claro e digno, com repetição levemente condensada na enumeração dos dias. Conservou-se a expressão espacial difícil “atrás dos filhos de Israel” para não eliminar a ambiguidade do ge’ez.
