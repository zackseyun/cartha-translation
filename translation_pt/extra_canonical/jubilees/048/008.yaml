  yaml_path: translation/extra_canonical/jubilees/048/008.yaml
  text: Through him he took vengeance for Israel. And the LORD did everything for Israel, and according to his ordinance, which he established with Abraham, so that he might take vengeance on them just as they had enslaved them by force.
translation:
  language: pt
  text: Por meio dele, vingou Israel.[a] E o SENHOR fez tudo em favor de Israel, segundo a sua ordenança, que havia estabelecido com Abraão, para vingar-se deles, assim como eles os haviam escravizado à força.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Por meio dele, tomou vingança em favor de Israel”.'
    reason: Registra uma formulação alternativa para a construção de vingança em favor de Israel.
  - marker: b
    text: 'Ou: “assim como eles os haviam sujeitado com violência”.'
    reason: Preserva a amplitude lexical entre escravizar e sujeitar, e entre força e violência.
lexical_decisions:
- source_word: ቦቱ
  choice: Por meio dele
  rationale: Expressa o valor instrumental da forma ge’ez sem identificar além do texto o referente de “dele”.
- source_word: በቀለ፡ ለእስራኤል
  choice: vingou Israel
  rationale: Conserva a oração verbal e o sentido de tomar vingança em favor de Israel, sem transformar a frase em oração de finalidade.
- source_word: ሥርዐቱ
  choice: a sua ordenança
  rationale: Reflete o sentido de ordem, disposição ou determinação; evita introduzir “aliança”, que não é o termo empregado aqui.
- source_word: ተካየደ፡ ምስለ፡ አብርሃም
  choice: que havia estabelecido com Abraão
  rationale: Apresenta em português natural a disposição anteriormente firmada com Abraão.
- source_word: በከመ
  choice: assim como
  rationale: Preserva a comparação ou correspondência expressa pelo ge’ez, em vez de convertê-la numa relação meramente causal.
- source_word: ቀነይዎሙ፡ በግፍዕ
  choice: os haviam escravizado à força
  rationale: Traduz especificamente a ideia de sujeição ou escravização e mantém o elemento de coerção ou violência.
theological_decisions:
- issue: Sujeito implícito da primeira oração
  choice: Por meio dele, vingou Israel
  alternative: Por meio dele, o SENHOR vingou Israel
  rationale: O ge’ez deixa o sujeito verbal implícito. A tradução não acrescenta explicitamente “o SENHOR”, embora o contexto possa apontar para ele.
- issue: Natureza da disposição feita com Abraão
  choice: ordenança
  alternative: aliança
  rationale: “Ordenança” segue mais diretamente ሥርዐት; “aliança” tornaria explícita uma categoria teológica que o vocábulo desta oração não exige.
translation_notes:
  register: Português moderno, claro e digno, com “SENHOR” em versaletes tipográficas simuladas por maiúsculas. A estrutura comparativa e os referentes pronominais do original foram preservados sem explicitação denominacional.
