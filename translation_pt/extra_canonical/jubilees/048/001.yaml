base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/001.yaml
  text: And in the sixth year of the third week of the forty-ninth jubilee[1], you departed and lived in the land of Midian for five weeks of years and one year, and you returned to Egypt in the second week, in the second year, in the fiftieth jubilee.
translation:
  language: pt
  text: No sexto ano da terceira semana do quadragésimo nono jubileu[a], você partiu e viveu na terra de Midiã durante cinco semanas de anos e um ano. Depois, voltou ao Egito na segunda semana, no segundo ano do quinquagésimo jubileu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cronologia está condensada e é um tanto difícil no texto etíope. A expressão “cinco semanas de anos e um ano” foi mantida literalmente para preservar o esquema calendárico de Jubileus.
    reason: segmentation_note
lexical_decisions:
- source_word: ሖርከ
  choice: você partiu
  rationale: O verbo indica ir ou partir; no contexto da saída de Moisés, “partiu” é natural e preserva o movimento expresso no texto.
- source_word: ወነበርከ
  choice: e viveu
  rationale: O verbo pode significar permanecer, morar ou viver. “Viveu” comunica de modo claro a residência prolongada de Moisés em Midiã.
- source_word: ምድረ፡ ምድያም
  choice: terra de Midiã
  rationale: Reprodução direta da designação geográfica, em forma corrente no português bíblico.
- source_word: ፭ሱባዔ፡ ወዓመተ፡ አሐደ
  choice: cinco semanas de anos e um ano
  rationale: A formulação calendárica incomum é mantida para não apagar o sistema cronológico próprio de Jubileus.
- source_word: ወገባእከ
  choice: voltou
  rationale: ገብአ pode expressar retorno; aqui Moisés regressa ao Egito, por isso “voltou” é mais exato que “entrou”.
theological_decisions:
- issue: Cronologia jubilar condensada
  choice: Manter literalmente “cinco semanas de anos e um ano” e a datação final completa
  alternative: Converter a duração em número total de anos ou harmonizar a sequência cronológica
  rationale: A forma do texto preserva o esquema calendárico e sua dificuldade própria, sem impor uma solução interpretativa ou harmonização externa.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A sintaxe foi levemente desdobrada em duas frases, sem alterar a sequência dos acontecimentos. O termo técnico “jubileu” e as fórmulas cronológicas foram preservados.
