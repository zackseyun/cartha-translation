review_pass:
  verdict: revise
  source_fidelity: A tradução de ይርድእዎሙ ... ይደግኑ ... ለውሉደ እስራኤል como ajuda aos egípcios e perseguição aos filhos de Israel é adequada. Contudo, ተኀስየ é uma forma passiva com o sentido de «foi ocultado/permaneceu oculto», não «foi planejado». A revisão preserva também a referência pronominal não expressa no trecho isolado.
  naturalness: A redação revista mantém português moderno e legível. «Foi mantido oculto diante do Senhor» é uma formulação um pouco marcada, mas necessária para representar sem sobreinterpretar a construção passiva e sua relação com «o Senhor, nosso Deus».
  terminology: «Filhos de Israel», «endureceu o coração» e «Senhor, nosso Deus» são escolhas estáveis, naturais e adequadas ao registro do texto. «Obstinados» comunica bem o reforço da resistência expresso pelo verbo seguinte.
  issues:
  - severity: high
    issue: «foi planejado pelo Senhor Deus» para ወተኀስየ እምኀበ እግዚአብሔር አምላክ
    rationale: A forma geês é passiva e aponta para ocultação, não para planejamento. A versão proposta também introduz agência divina explícita que a linha, tal como fornecida, não declara nessa oração.
  - severity: low
    issue: Nota de rodapé sobre o desalinhamento de metadados e o fragmento inglês
    rationale: A nota não esclarece uma dificuldade do texto traduzido para o leitor e desloca para a edição um problema de processamento. A revisão já segue a linha geês fornecida; não é necessária nota textual no versículo.
  revised_text: para que ele ajudasse os egípcios e para que eles perseguissem os filhos de Israel. Ele endureceu o coração deles e os tornou obstinados; e isso foi mantido oculto diante do Senhor, nosso Deus, para que ele os ferisse.
