lexical_decisions:
- source_word: ይርድእዎሙ፡ ለግብጽ
  choice: para que ele ajudasse os egípcios
  rationale: Mantém o valor final ou consecutivo de ከመ no contexto e o objeto plural indicado pelo sufixo verbal, em português natural.
- source_word: ይደግኑ፡ ድኅሬሆሙ
  choice: para que eles perseguissem
  rationale: Expressa o movimento de ir atrás com intenção hostil, preservando o sujeito plural.
- source_word: ለውሉደ፡ እስራኤል
  choice: os filhos de Israel
  rationale: Reproduz a designação tradicional e transparente, sem substituir por um gentílico interpretativo.
- source_word: ጸጽንዐ፡ አልባቢሆሙ
  choice: endureceu o coração deles
  rationale: Conserva a metáfora semítica do coração como centro da decisão e da disposição.
- source_word: አንየሎሙ
  choice: os tornou obstinados
  rationale: Comunica o fortalecimento em resistência teimosa sugerido pelo contexto, sem suavizá-lo como mera coragem.
- source_word: ተኀስየ
  choice: foi planejado
  rationale: A forma passiva permite conservar a formulação de que o acontecimento foi concebido ou determinado, sem explicitar além do texto o modo dessa decisão.
- source_word: ይምሐጾሙ
  choice: os ferisse
  rationale: Mantém o sentido de golpear ou ferir, sem especificar morte ou destruição total.
theological_decisions:
- issue: Agência no endurecimento e no castigo
  choice: Preservar os pronomes e a mudança contextual de referente sem inserir nomes
  alternative: Identificar explicitamente Mastema como quem endurece e Deus como quem fere
  rationale: O trecho fornecido usa formas de terceira pessoa e depende do contexto anterior. Acrescentar nomes resolveria uma ambiguidade que esta linha, isoladamente, não resolve de modo explícito.
- issue: Relação entre a obstinação dos egípcios e o plano divino
  choice: Traduzir a coordenação literalmente com “e isso foi planejado pelo Senhor Deus”
  alternative: Introduzir contraste ou finalidade explicativa, como “mas Deus permitiu isso”
  rationale: O texto coordena as afirmações e atribui o plano ao Senhor Deus; não afirma mera permissão nem emprega uma conjunção adversativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura permanece como continuação sintática (“para que”), pois a linha-fonte é posicional e começa no meio de uma unidade maior. Mantiveram-se “filhos de Israel” e a metáfora do endurecimento do coração por sua relevância literária e teológica.
