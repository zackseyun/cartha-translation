  yaml_path: translation/extra_canonical/jubilees/048/014.yaml
  text: And all the people whom he had brought out pursued after Israel, and the Lord God cast them into the midst of the sea, into the depths of the abyss, beneath the children of Israel, just as the people of Egypt had cast their children into the river; He took vengeance on a million of them, and one thousand mighty men were destroyed, and those who pursued them perished because of envy.
translation:
  language: pt
  text: Em terra seca. E todo o povo que ele havia feito sair perseguiu Israel; então o Senhor Deus os lançou no meio do mar, nas profundezas do abismo, debaixo dos filhos de Israel,[a] assim como o povo do Egito havia lançado seus filhos no rio.[b] Ele se vingou de um milhão deles; mil homens poderosos foram destruídos, e os que perseguiam os israelitas pereceram por causa da inveja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no meio do mar, em suas profundezas, no abismo, debaixo dos filhos de Israel”.'
    reason: A sequência dos termos locativos admite mais de uma organização sintática em português.
  - marker: b
    text: 'Lit.: “os filhos deles”; o possessivo pode ser entendido de mais de uma maneira no contexto.'
    reason: Preserva e sinaliza a ambiguidade do referente pronominal no ge’ez.
lexical_decisions:
- source_word: የብስ
  choice: terra seca
  rationale: Preserva o sentido concreto de terreno seco no fragmento inicial, sem omiti-lo apesar de sua ligação sintática aparentemente depender do contexto anterior.
- source_word: ሰቀላይ
  choice: abismo
  rationale: Mantém o substantivo adicional referente ao grande abismo, que não deve ser absorvido apenas por “profundezas”.
- source_word: ኀበቀሎሙ
  choice: Ele se vingou deles
  rationale: Representa a forma textual entendida como variante de um verbo de vingança e conserva a ação retributiva explícita.
- source_word: ሕሱዳ
  choice: inveja
  rationale: É a correspondência direta e inteligível do motivo declarado no encerramento do versículo.
theological_decisions:
- issue: Retribuição entre o lançamento no rio e o lançamento no mar
  choice: Preservar o paralelo explícito com “assim como”
  alternative: Suavizar a relação como mera comparação narrativa
  rationale: O texto apresenta deliberadamente a ação divina como resposta correspondente ao ato anterior do povo do Egito; essa tensão não deve ser apagada.
- issue: Referente de “seus filhos”
  choice: Manter o pronome possessivo sem identificar explicitamente a etnia das crianças
  alternative: Traduzir como “os filhos dos israelitas” ou “os próprios filhos dos egípcios”
  rationale: A forma ge’ez usa o possessivo de terceira pessoa plural, cujo referente narrativo pode ser discutido; a tradução preserva essa ambiguidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura fragmentária foi mantida por constar do texto-fonte fornecido. Os números foram traduzidos segundo os valores multiplicativos indicados pelo ge’ez: um milhão e mil.'
