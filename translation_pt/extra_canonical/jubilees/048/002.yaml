base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/002.yaml
  text: Again, in the second year of the fiftieth jubilee, you know what was spoken to you on Mount Sinai, and what the prince Mastema desired to do to you when you were returning to Egypt.
translation:
  language: pt
  text: Novamente, no segundo ano do quinquagésimo jubileu, você sabe[a] o que lhe foi dito no monte Sinai e o que o príncipe Mastema quis fazer com você quando você retornava[b] ao Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “você saberá”.'
    reason: A forma verbal ge'ez pode ser entendida como presente ou futuro.
  - marker: b
    text: 'Ou: “entrava”.'
    reason: O verbo pode assumir o sentido de entrar, embora o contexto favoreça retornar.
lexical_decisions:
- source_word: ታአምር
  choice: você sabe
  rationale: O imperfeito ge'ez pode ter valor presente ou futuro; aqui, o contexto apela ao conhecimento que Moisés já possui sobre acontecimentos passados.
- source_word: መኰንን፡ መስተማ
  choice: o príncipe Mastema
  rationale: Reproduz o título e o nome próprio do texto-fonte sem acrescentar identificação teológica.
- source_word: ፈቀደ፡ ይግበር፡ ምስሌከ
  choice: quis fazer com você
  rationale: Mantém de modo próximo a construção 'desejou/quis fazer com você', sem explicitar uma hostilidade apenas implícita no contexto.
- source_word: ትገብእ፡ ግብጸ
  choice: quando você retornava ao Egito
  rationale: O verbo ገብአ pode significar 'voltar/retornar'; esse sentido corresponde ao retorno de Moisés ao Egito no contexto narrativo.
theological_decisions:
- issue: Valor temporal de ታአምር
  choice: você sabe
  alternative: você saberá
  rationale: A forma admite presente ou futuro, mas o contexto favorece uma referência ao conhecimento já adquirido por Moisés; a alternativa é preservada em nota.
- issue: Intenção de Mastema
  choice: quis fazer com você
  alternative: quis fazer contra você
  rationale: A tradução evita inserir 'contra', que tornaria explícita uma hostilidade não expressa lexicalmente pela preposição do texto-fonte.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais ao leitor brasileiro. 'Quinquagésimo jubileu' conserva a fórmula cronológica antiga; 'monte Sinai' segue o uso corrente. Todos os marcadores de nota aparecem no texto.
