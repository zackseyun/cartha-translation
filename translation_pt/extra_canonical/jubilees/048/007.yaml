base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/007.yaml
  text: 'And you were to speak before the king of Egypt, before all his servants and before his people. And everything happened at your word: ten great and grievous judgments came upon the land of Egypt, for you to carry out.'
translation:
  language: pt
  text: 'E você devia falar diante do rei do Egito, diante de todos os seus servos e diante do seu povo. E tudo aconteceu conforme a sua palavra: dez grandes e severos juízos vieram sobre a terra do Egito, para você os executar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትናገር
  choice: devia falar
  rationale: Expressa a forma verbal de segunda pessoa no contexto da incumbência dada a Moisés, com naturalidade em português.
- source_word: በቃልከ
  choice: conforme a sua palavra
  rationale: Preserva o sentido de que os acontecimentos se deram em correspondência à palavra pronunciada por Moisés, sem tornar a formulação excessivamente causal.
- source_word: ኵነኔ
  choice: juízos
  rationale: O termo designa julgamentos ou atos punitivos; “juízos” conserva a linguagem judicial e teológica do contexto.
- source_word: ጸዋጋት
  choice: dolorosos
  rationale: Comunica o caráter aflitivo ou penoso dos juízos em português corrente e digno.
- source_word: ትግበር
  choice: para que você os executasse
  rationale: Mantém a voz ativa e a segunda pessoa masculina singular, atribuindo a Moisés participação ativa na execução dos juízos.
theological_decisions:
- issue: Agência de Moisés na realização dos juízos
  choice: para que você os executasse
  alternative: para serem executados
  rationale: A forma ge'ez é ativa e está na segunda pessoa singular; a tradução evita apagar essa agência, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao leitor brasileiro e compreensível internacionalmente. A repetição de “diante” foi preservada por seu valor retórico e estrutural.
