  yaml_path: translation/extra_canonical/jubilees/048/012.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the angel Mastema was bound and restrained from following after the children of Israel.
translation:
  language: pt
  text: E, no décimo quarto dia, no décimo quinto, no décimo sexto, no décimo sétimo e no décimo oitavo, o anjo Mastema foi amarrado e impedido de seguir os filhos de Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአክ
  choice: anjo
  rationale: Tradução direta e usual de መልአክ neste contexto; evita introduzir o título interpretativo «príncipe».
- source_word: ተእስረ
  choice: foi amarrado
  rationale: Preserva de modo claro a imagem concreta de ser atado ou preso, sem fundi-la com o verbo seguinte.
- source_word: ተዐግሠ
  choice: impedido
  rationale: Expressa a ideia passiva de ser contido ou refreado e liga-se naturalmente, em português, à ação que Mastema não pôde realizar.
- source_word: እምድኅረ
  choice: de seguir
  rationale: No contexto, a construção indica que Mastema foi impedido de ir atrás de Israel; «seguir» mantém o sentido sem explicitar necessariamente perseguição hostil.
- source_word: ደቂቀ እስራኤል
  choice: os filhos de Israel
  rationale: Mantém a expressão tradicional e coletiva do texto-fonte, em linguagem amplamente compreensível.
