  yaml_path: translation/extra_canonical/jubilees/011/001.yaml
  text: In the thirty-fifth jubilee[1], in the third week, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.
translation:
  language: pt
  text: No trigésimo quinto jubileu[a], na terceira semana, no primeiro ano dessa semana, Reú tomou para si uma mulher chamada Ora, filha de Ur, filho de Kesed. Ela lhe deu à luz um filho, e ele lhe deu o nome de Seró, no sétimo ano dessa semana, neste jubileu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma da edição ge'ez parece ler «setenta e cinco». Adota-se aqui «trigésimo quinto» como correção, pois essa leitura concorda com a sequência cronológica interna de Jubileus.
    reason: textual_correction
lexical_decisions:
- source_word: እዮቤልው
  choice: jubileu
  rationale: Mantém o termo técnico do sistema cronológico da obra.
- source_word: ሱባዔ
  choice: semana
  rationale: Traduz literalmente a unidade de sete anos característica de Jubileus; o contexto cronológico deixa claro seu sentido.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: tomou para si uma mulher
  rationale: Reproduz de modo natural e relativamente formal a expressão matrimonial do ge'ez, sem acrescentar elementos ausentes.
- source_word: ወጸውዐ፡ ስሞ
  choice: deu o nome de
  rationale: Formulação portuguesa natural para o ato de nomear, preservando o sentido da expressão-fonte.
- source_word: ሴሮኅ
  choice: Seró
  rationale: Transliteração portuguesa legível do nome próprio conforme a forma ge'ez apresentada.
theological_decisions:
- issue: Natureza da 'semana' cronológica
  choice: Manter simplesmente 'semana' no texto
  alternative: semana de anos
  rationale: O original emprega o termo cronológico sem explicitação adicional; manter 'semana' preserva a forma própria da obra e evita interpretar no corpo do texto.
- issue: Leitura do número do jubileu
  choice: trigésimo quinto
  alternative: septuagésimo quinto ou indicação de texto corrompido
  rationale: A leitura transmitida é entendida como 'trigésimo quinto' ou uma forma corrompida próxima, e essa numeração concorda com a sequência cronológica interna; a incerteza textual é registrada em nota.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe narrativa natural. Preservam-se os termos cronológicos próprios de Jubileus e a cadeia genealógica sem expansão interpretativa.
