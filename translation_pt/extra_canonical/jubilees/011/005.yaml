base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/005.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits—those placed under his hand—to do all manner of wrong and sin and all manner of transgression, to corrupt and destroy, and to shed blood on the earth.
translation:
  language: pt
  text: E o príncipe Mastema empenhou-se em fazer tudo isso e enviou outros espíritos — os que estavam sob sua autoridade — para praticarem toda espécie de maldade, pecado e transgressão, a fim de corromper, destruir e derramar sangue sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince Mastema
  choice: príncipe Mastema
  rationale: Mantém o título e o nome próprio tradicionais, sem transformar o nome em uma designação teológica interpretativa.
- source_word: exerted himself
  choice: empenhou-se
  rationale: Expressa ação deliberada e intensa em português natural e digno.
- source_word: under his hand
  choice: sob sua autoridade
  rationale: Reproduz o sentido idiomático de subordinação, evitando a leitura corporal literal de “sob sua mão”.
- source_word: wrong and sin and all manner of transgression
  choice: toda espécie de maldade, pecado e transgressão
  rationale: Preserva a enumeração cumulativa das formas de desobediência, com fluidez em português.
- source_word: to corrupt and destroy, and to shed blood
  choice: a fim de corromper, destruir e derramar sangue
  rationale: Mantém a sequência de infinitivos e a finalidade destrutiva atribuída aos espíritos enviados.
theological_decisions:
- issue: Agência pessoal de Mastema
  choice: Emprego de formas pessoais masculinas e apresentação de Mastema como agente que envia espíritos subordinados
  alternative: Tratar Mastema de modo impessoal ou como simples abstração do mal
  rationale: O contexto apresenta Mastema como personagem pessoal, denominado príncipe e dotado de vontade e autoridade.
- issue: Relação entre Mastema e os outros espíritos
  choice: “os que estavam sob sua autoridade”
  alternative: “os que estavam sob sua mão”
  rationale: Preserva a subordinação indicada pela expressão sem acrescentar uma hierarquia demonológica mais específica do que a evidência permite.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A tradução conserva a repetição enfática das ações malignas sem introduzir as notas herdadas de uma redação anterior, pois elas se referem a um texto rejeitado na revisão crítica.
