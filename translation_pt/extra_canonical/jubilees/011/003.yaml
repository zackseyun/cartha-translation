base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/003.yaml
  text: And in the days of Serug there arose wars and all the sons of men turned to making graven images and carved images and unclean things, and evil spirits were helping them and leading them astray, so that they might commit transgression and uncleanness.
translation:
  language: pt
  text: Nos dias de Serug[a], surgiram guerras, e todos os filhos dos homens passaram a fazer imagens esculpidas, figuras entalhadas e coisas impuras. Espíritos malignos os ajudavam e os desencaminhavam, para que cometessem transgressão e impureza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Seroh”.'
    reason: Preserva a variante de transliteração registrada na camada inglesa de consulta.
lexical_decisions:
- source_word: Serug / Seroh
  choice: Serug
  rationale: Adota a forma bíblica portuguesa reconhecível e segue a revisão mais recente; a variante anterior é preservada em nota.
- source_word: sons of men
  choice: filhos dos homens
  rationale: Preserva a expressão antropológica tradicional e seu possível valor coletivo, sem reduzi-la simplesmente a “pessoas”.
- source_word: graven images and carved images
  choice: imagens esculpidas, figuras entalhadas
  rationale: Mantém a duplicação do texto de consulta e distingue, em português natural, os dois termos parcialmente sobrepostos.
- source_word: evil spirits
  choice: espíritos malignos
  rationale: Expressão corrente e digna que conserva a agência espiritual negativa sem acrescentar uma classificação demonológica mais específica.
- source_word: transgression and uncleanness
  choice: transgressão e impureza
  rationale: Preserva os dois conceitos e sua tensão moral e ritual, sem fundi-los em um único termo.
theological_decisions:
- issue: Agência dos espíritos malignos e responsabilidade humana
  choice: “os ajudavam e os desencaminhavam, para que cometessem”
  alternative: “faziam com que cometessem”
  rationale: Mantém tanto a influência dos espíritos quanto a ação dos seres humanos, sem transformar a influência em coerção absoluta.
- issue: Sentido de “impureza”
  choice: impureza
  alternative: imoralidade
  rationale: “Impureza” conserva a possível amplitude ritual, moral e corporal do termo, evitando uma interpretação exclusivamente ética ou sexual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O excerto ge’ez fornecido salta do versículo 1 para o 6 e, portanto, não contém material diretamente identificável como 11:3; por isso, esta redação segue cautelosamente a camada inglesa auditada, preservando sua estrutura e suas ambiguidades, sem alegar confirmação lexical direta pelo trecho ge’ez apresentado.
