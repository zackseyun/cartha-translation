  text: And they arose in the night and wanted to save their gods from the midst of the fire. And Haran rushed
translation:
  language: pt
  text: Eles se levantaram à noite e quiseram salvar seus deuses do meio do fogo. E Harã se precipitou[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Arã correu”. Esta frase provavelmente pertence ao início do versículo 14.'
    reason: Registra a tradução alternativa tradicional e a provável segmentação inadequada do trecho entre os versículos 13 e 14.
lexical_decisions:
- source_word: ተንሥኡ (tanśəʾu)
  choice: se levantaram
  rationale: Reproduz de modo natural o sentido de levantar-se ou pôr-se de pé, sem acrescentar movimento não expresso.
- source_word: ፈቀዱ (faqadu)
  choice: quiseram
  rationale: Expressa diretamente a vontade ou intenção indicada pelo verbo.
- source_word: አማልክቲሆሙ (ʾamālək­tihomu)
  choice: seus deuses
  rationale: Mantém a designação do texto-fonte, sem interpretá-los explicitamente como ídolos.
- source_word: ሰረረ (sarara)
  choice: se lançou
  rationale: Comunica um movimento súbito e impetuoso, mais próximo de saltar, precipitar-se ou avançar às pressas do que o simples 'correu'.
- source_word: አራን (ʾArān)
  choice: Harã
  rationale: Usa a forma portuguesa tradicional do nome do irmão de Abrão, preservando a identificação contextual.
theological_decisions:
- issue: Designação dos objetos de culto
  choice: seus deuses
  alternative: seus ídolos
  rationale: O texto chama esses objetos de 'deuses'; traduzir por 'ídolos' imporia uma avaliação teológica que, embora contextualizada, não está lexicalmente explícita aqui.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe corrente. A frase final permanece incompleta porque o trecho-fonte termina nesse ponto; a nota informa a provável questão de segmentação.
