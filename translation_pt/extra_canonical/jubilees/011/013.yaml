  source_fidelity: O texto ge'ez diz literalmente que eles se levantaram à noite e quiseram salvar seus deuses do meio do fogo; em seguida, afirma que Harã/Arã fez um movimento súbito e impetuoso ("correu", "avançou às pressas", "precipitou-se"). A tradução preserva corretamente os dois primeiros enunciados e a designação não interpretativa "seus deuses". Contudo, "se lançou" sugere mais especificamente atirar-se, possivelmente para dentro de algo, nuance que não está expressa no fragmento preservado.
  naturalness: '"Durante a noite" é natural, mas "à noite" é mais direto. "E Harã se precipitou" transmite bem a ação súbita e permanece gramaticalmente natural mesmo com o enunciado interrompido no fim do trecho.'
  terminology: '"Harã" é a forma portuguesa bíblica corrente para o irmão de Abrão. "Arã" pode ser mantido em nota como alternativa de transliteração. "Seus deuses" reproduz o termo-fonte sem substituí-lo interpretativamente por "ídolos".'
