  text: for those who make them, and a straying of heart for those who worship them. Do not worship them.” And his father said to him[6], “I also know, my son, but what can I do for a people who have made me subject to them?
translation:
  language: pt
  text: 'para os que os fazem, e desvio do coração para os que os adoram.[a] Não os adore.” Seu pai lhe disse: “Eu também sei, meu filho; mas o que posso fazer com um povo que me tornou sujeito a ele?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão traduzida como “desvio do coração para os que os adoram” é textualmente difícil no texto ge''ez fornecido. Também pode ser entendida como: “e o coração dos que os adoram se desvia”.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “que me obrigou a obedecer-lhe?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሕተት፡ ልብ
  choice: desvio do coração
  rationale: Preserva a construção nominal e a dificuldade do texto ge'ez, sem transformá-la indevidamente em uma oração verbal mais explícita.
- source_word: አታምልክዎሙ
  choice: Não os adore
  rationale: Traduz a proibição no singular, com referente plural, em português corrente e digno.
- source_word: እትአዘዝ
  choice: me tornou sujeito
  rationale: O verbo indica obedecer ou estar sujeito, não errar; a formulação conserva a voz passiva/causativa refletida pelo contexto.
theological_decisions:
- issue: Relação entre a fabricação dos ídolos e o desvio interior dos adoradores
  choice: 'Manter a expressão nominal paralela e difícil: “desvio do coração para os que os adoram”'
  alternative: “o coração dos que os adoram se desvia”
  rationale: O ge'ez fornecido emprega uma construção com preposição para ambos os grupos; explicitar um verbo resolveria uma dificuldade real do texto e reduziria sua ambiguidade.
- issue: Sentido da submissão do pai ao povo
  choice: “um povo que me tornou sujeito a ele”
  alternative: “um povo que me obrigou a obedecer-lhe”
  rationale: Ambas refletem o campo semântico de obedecer/estar sujeito; a opção principal acompanha mais de perto a forma da fonte e evita a antiga leitura incorreta de ‘errar’.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura fragmentária foi mantida porque o versículo continua a frase anterior; a ambiguidade textual não foi silenciosamente eliminada.
