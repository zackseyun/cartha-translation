  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: pt
  text: antes de Tera, seu pai. E o sepultaram em Ur dos caldeus. Tera saiu de Ur dos caldeus, ele e seus filhos, para irem à terra do Líbano e à terra de Canaã. Ele se estabeleceu na terra de Harã, e Abrão morou com Tera, seu pai, em Harã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀበርዎ
  choice: o sepultaram
  rationale: Reproduz o sentido de enterrar ou sepultar, mantendo o objeto masculino retomado do contexto anterior.
- source_word: ወፅአ
  choice: saiu
  rationale: Equivalente direto e natural para o movimento de partida de Ur.
- source_word: ኀደረ
  choice: se estabeleceu / morou
  rationale: O verbo pode indicar permanecer, residir ou assentar-se. As escolhas variam conforme o sujeito e produzem português natural sem alterar o sentido essencial.
- source_word: ካራን
  choice: Harã
  rationale: Forma tradicional e reconhecível em português para o topônimo bíblico.
