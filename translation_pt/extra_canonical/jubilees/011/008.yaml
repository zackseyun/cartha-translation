lexical_decisions:
- source_word: ያምልክዎሙ
  choice: eles os adorem
  rationale: Conserva o sujeito na terceira pessoa do plural e o objeto plural expresso pelo sufixo, evitando a leitura incorreta na segunda pessoa.
- source_word: ይስብሕዎሙ
  choice: os louvem
  rationale: Reproduz em paralelo a terceira pessoa do plural e o objeto plural do texto ge'ez.
- source_word: አርምም
  choice: Fique calado
  rationale: Imperativo natural e atual, adequado à fala de um pai que procura impedir o filho de se expor ao perigo.
- source_word: ከመ፡ አይቅትሉከ
  choice: para que não o matem
  rationale: Mantém a construção final/preventiva e o objeto de segunda pessoa sem identificar além do texto quem poderia matá-lo.
- source_word: ወነገረ
  choice: E ele contou
  rationale: Preserva a forma verbal e a continuidade incompleta do recorte, sem antecipar o complemento que pertence ao segmento seguinte.
