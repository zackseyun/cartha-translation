lexical_decisions:
- source_word: ጽድቀ
  choice: a verdade
  rationale: Neste contexto, o termo exprime aquilo que é verdadeiro ou correto e que o falante poderia declarar; “a verdade” é a formulação portuguesa mais natural.
- source_word: ይቀትሉኒ
  choice: eles me matarão
  rationale: Reproduz diretamente o verbo de matar com o objeto de primeira pessoa e o valor prospectivo da oração.
- source_word: ተለውት፡ ነፍሶሙ
  choice: a alma deles está apegada
  rationale: Preserva a imagem antropológica e afetiva do original sem explicá-la como adoração.
- source_word: ኀቤሆሙ
  choice: a essas coisas
  rationale: O referente pronominal é retomado de modo natural em português; “coisas” evita atribuir gênero ou identidade não explicitados neste fragmento.
theological_decisions:
- issue: Natureza do apego mencionado na cláusula final
  choice: Manter apenas a ideia de que a alma deles está apegada a essas coisas.
  alternative: Explicitar que eles as adoram.
  rationale: O texto fonte descreve apego, mas não contém nesta frase uma expressão explícita de adoração; a tradução evita acrescentar uma interpretação teológica.
