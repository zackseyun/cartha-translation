  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
translation:
  language: pt
  text: por duas semanas de anos.[a] No quinto ano da sexta semana, Abrão ficou acordado durante a noite, no começo do sétimo mês, observando os astros desde o entardecer até o amanhecer, para ver como seria o curso do ano quanto às chuvas. Ele estava ali sozinho, sentado e observando.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, dois períodos de sete anos. Jubileus costuma contar o tempo por essas unidades esquemáticas.
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት
  choice: duas semanas de anos
  rationale: 'Mantém a unidade cronológica esquemática característica de Jubileus: dois períodos de sete anos.'
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: no começo do sétimo mês
  rationale: A expressão etíope se refere ao surgimento ou início do mês, isto é, à ocasião da lua nova; a formulação escolhida é clara sem impor uma descrição astronômica mais específica.
- source_word: ያበይነ፡ ከዋክብተ
  choice: observando os astros
  rationale: O verbo sugere examinar ou discernir, e ከዋክብት designa estrelas ou corpos celestes; 'astros' preserva a amplitude no contexto de observação celeste.
- source_word: ግብረ፡ ዓመት
  choice: o curso do ano
  rationale: Literalmente, 'a obra/atividade do ano'; no contexto, indica como o ano se desenrolaria, especialmente em relação às chuvas.
- source_word: ይነብር
  choice: sentado e observando
  rationale: O verbo pode significar sentar-se, permanecer ou habitar; aqui descreve Abrão permanecendo sozinho em vigília.
theological_decisions:
- issue: Natureza da observação dos astros por Abrão
  choice: Descrição neutra da observação, sem classificá-la teologicamente
  alternative: Caracterizá-la explicitamente como prática astrológica ou como observação meramente meteorológica
  rationale: O texto associa os astros à previsão das chuvas, mas não oferece neste versículo uma avaliação explícita da prática; a tradução preserva essa tensão narrativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se 'semanas de anos' por ser terminologia estrutural do livro, explicada em nota. A abertura fragmentária foi mantida porque a expressão conclui o pensamento do versículo anterior.
