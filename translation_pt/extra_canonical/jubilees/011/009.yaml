review_pass:
  verdict: revise
  source_fidelity: 'A sequência inicial é fiel ao ge''ez: o verbo final está no plural, portanto «eles permaneceram calados». A cronologia e o casamento seguem o texto e a trilha inglesa. Contudo, «filha de seu pai» deixa em português ambíguo o referente de «seu»; a formulação deve identificar Abrão. A expressão de parentesco e a conclusão matrimonial não estão integralmente visíveis no excerto ge''ez fornecido, embora constem da trilha inglesa de controle; isso requer nota precisa.'
  naturalness: O português é claro e de registro adequado. «Tornou-se sua esposa» é mais fluente do que «ela se tornou sua esposa», sem perda de sentido.
  terminology: «Jubileu», «semana» (no sentido cronológico de Jubileus), «Abrão» e «Sarai» estão adequados. «Filha do pai de Abrão» preserva a formulação transmitida sem a ambiguidade possessiva portuguesa.
  issues:
  - severity: medium
    issue: Ambiguidade em «filha de seu pai»
    rationale: Em português, «seu pai» pode ser entendido como o pai de Sarai, enquanto a trilha inglesa especifica «his father», isto é, o pai de Abrão. A tradução deve conservar esse referente sem harmonizar o parentesco.
  - severity: low
    issue: Nota descreve de modo impreciso a lacuna do excerto fornecido
    rationale: Não apenas a sequência final, mas também a expressão de parentesco não aparece no trecho ge'ez disponibilizado. A nota deve distinguir o excerto fornecido da leitura seguida pela trilha inglesa.
  revised_text: Ele contou isso aos seus dois irmãos, e eles se iraram contra ele e permaneceram calados. No quadragésimo jubileu, na segunda semana, no sétimo ano dessa semana, Abrão tomou para si uma esposa. O nome dela era Sarai, filha do pai de Abrão,[a] e tornou-se sua esposa.
  revised_footnotes:
  - marker: a
    text: A expressão «filha do pai de Abrão» segue a leitura transmitida na trilha inglesa de controle e não é harmonizada com Gênesis. Ela pode refletir um problema textual ou uma maneira diferente de expressar parentesco nesta tradição. Essa expressão e a conclusão da frase não estão integralmente preservadas no excerto ge'ez fornecido.
    reason: textual_variant
  revision_rationale: A revisão elimina uma ambiguidade introduzida pelo possessivo português, preservando a leitura difícil de parentesco sem harmonização. A nota foi ajustada para informar com exatidão a limitação do excerto ge'ez fornecido e a dependência da trilha inglesa para a porção ausente.
