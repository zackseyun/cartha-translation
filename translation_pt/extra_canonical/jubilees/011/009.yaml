  text: He told this matter to his two brothers[9], and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.
translation:
  language: pt
  text: Ele contou isso aos seus dois irmãos, e eles se iraram contra ele e permaneceram calados. No quadragésimo jubileu, na segunda semana, no sétimo ano dessa semana, Abrão tomou para si uma esposa. O nome dela era Sarai, filha de seu pai,[a] e ela se tornou sua esposa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “filha de seu pai” é mantida conforme a tradição textual consultada, sem harmonização com Gênesis. Ela pode refletir um problema textual ou uma maneira diferente de expressar parentesco nessa tradição. A sequência final não está plenamente preservada no trecho ge'ez fornecido.
    reason: textual_variant
lexical_decisions:
- source_word: ነገረ
  choice: contou
  rationale: Expressa de modo natural o ato de relatar ou declarar o assunto mencionado.
- source_word: ተምዑ፡ ላዕሌሁ
  choice: se iraram contra ele
  rationale: Conserva a ideia de ira dirigida contra Abrão, com formulação digna e clara em português.
- source_word: አርመሙ
  choice: permaneceram calados
  rationale: O verbo está no plural; a tradução mantém a concordância com os dois irmãos, sem adotar a antiga leitura no singular.
- source_word: ሱባዔ
  choice: semana
  rationale: No sistema cronológico de Jubileus, designa um período de sete anos; a expressão tradicional é preservada, e o contexto esclarece seu sentido.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: tomou para si uma esposa
  rationale: Reproduz a construção semítica para contrair matrimônio sem tornar o português excessivamente artificial.
- source_word: ሶራ
  choice: Sarai
  rationale: Adota a forma bíblica portuguesa reconhecível correspondente ao nome transmitido, em consonância com o contexto patriarcal.
theological_decisions:
- issue: Identidade dos que permaneceram calados
  choice: eles permaneceram calados
  alternative: ele permaneceu calado
  rationale: A forma verbal ge'ez ወአርመሙ está no plural e retoma os dois irmãos; não há razão contextual ou teológica para convertê-la ao singular.
- issue: Parentesco de Sarai
  choice: filha de seu pai
  alternative: harmonizar com outra formulação de Gênesis ou omitir a expressão
  rationale: A formulação da tradição textual consultada é preservada sem harmonização, ainda que produza tensão com outras apresentações do parentesco de Sarai.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A cronologia técnica de Jubileus foi preservada, mas “no sétimo ano dessa semana” explicita a relação sintática. O plural do verbo referente ao silêncio foi mantido. A nota assinala com transparência a dificuldade da sequência final do testemunho fornecido.
