  text: And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called his name Ur.
translation:
  language: pt
  text: E Harã, seu irmão, tomou para si uma esposa no terceiro ano da terceira semana. Ela lhe deu à luz um filho no sétimo ano dessa semana, e ele lhe deu o nome de Ur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho etíope reproduzido para este versículo termina em “e ele chamou”; “o nome de Ur” pertence à continuação do texto e foi incluído aqui para completar a frase conforme a divisão tradicional dos versículos.
    reason: boundary_completion
lexical_decisions:
- source_word: አሬን
  choice: Harã
  rationale: Forma portuguesa tradicional do nome semítico Harã, aqui identificado como irmão do personagem mencionado no contexto.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: tomou para si uma esposa
  rationale: Reproduz de modo natural a expressão etíope para contrair casamento, sem acrescentar pormenores ausentes no texto.
- source_word: ሱባዔ
  choice: semana
  rationale: Mantém a unidade cronológica característica de Jubileus, entendida literalmente como um período de sete anos no sistema narrativo da obra.
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: Ela lhe deu um filho
  rationale: Expressa em português corrente a construção literal 'ela gerou para ele um filho'.
- source_word: ወጸውዐ
  choice: e ele lhe deu o nome de Ur
  rationale: O trecho fornecido termina em 'e chamou'; o complemento nominal, preservado na continuação textual e exigido pela sintaxe e pela versificação, completa a oração.
