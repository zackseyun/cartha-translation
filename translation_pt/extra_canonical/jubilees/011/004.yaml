base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/004.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits, those set under his hand, to do every kind of error and sin and transgression, to corrupt and destroy and to shed blood upon the earth.
translation:
  language: pt
  text: E o príncipe Mastema empenhou-se em fazer tudo isso e enviou outros espíritos, os que estavam sob sua autoridade, para praticarem toda espécie de erro, pecado e transgressão, a fim de corromper, destruir e derramar sangue sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mastema
  choice: Mastema
  rationale: Mantém o nome próprio tradicional sem substituí-lo por uma interpretação como «Satanás» ou «hostilidade».
- source_word: prince
  choice: príncipe
  rationale: Preserva o título hierárquico da tradição textual e sua associação direta com Mastema.
- source_word: exerted himself
  choice: empenhou-se
  rationale: Expressa esforço deliberado em português natural e digno.
- source_word: under his hand
  choice: sob sua autoridade
  rationale: Transmite de modo claro o sentido idiomático de subordinação, sem sugerir localização física.
- source_word: spirits
  choice: espíritos
  rationale: Conserva a designação ampla do texto sem definir além dele a natureza desses seres.
- source_word: every kind of error and sin and transgression
  choice: toda espécie de erro, pecado e transgressão
  rationale: Mantém os três termos coordenados e sua força cumulativa.
- source_word: upon the earth
  choice: sobre a terra
  rationale: Formulação natural que preserva o âmbito universal indicado pelo texto.
theological_decisions:
- issue: Identidade de Mastema
  choice: Manter «Mastema» como nome próprio
  alternative: Traduzir ou identificar como «Satanás»
  rationale: O texto nomeia a figura como Mastema; identificá-la explicitamente com outra figura resolveria uma questão interpretativa que o versículo não resolve.
- issue: Natureza dos espíritos subordinados
  choice: Usar apenas «outros espíritos»
  alternative: Especificar «espíritos malignos» ou «demônios»
  rationale: Embora suas ações sejam más, o texto os chama de espíritos; a tradução evita acrescentar uma classificação ontológica não explicitada.
- issue: Finalidade das ações
  choice: «a fim de corromper, destruir e derramar sangue»
  alternative: Coordenar tudo apenas com «e»
  rationale: A construção final preserva a relação entre o envio dos espíritos e os resultados pretendidos, sem atenuar a responsabilidade de Mastema.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A redação conserva o tom narrativo solene, a sequência cumulativa dos delitos e a ambiguidade quanto à identidade precisa de Mastema e à natureza dos espíritos.
