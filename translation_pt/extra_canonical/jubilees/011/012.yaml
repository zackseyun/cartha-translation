  yaml_path: translation/extra_canonical/jubilees/011/012.yaml
  text: In that fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no person knew it.
translation:
  language: pt
  text: Naquela quarta semana, no quarto ano dela, Abrão se levantou de noite e incendiou a casa dos ídolos. Queimou tudo o que havia dentro da casa, e ninguém soube disso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእቱ፡ ሱባዔ፡ ራብዕ፡
  choice: Naquela quarta semana
  rationale: O demonstrativo com a expressão temporal introduz naturalmente o período em que ocorreu o episódio; evita a leitura artificial «isto é, a quarta semana».
- source_word: ተንሥአ፡ አብራም፡ በሌሊት፡
  choice: Abrão se levantou de noite
  rationale: Reproduz diretamente a ação e a circunstância temporal, em português corrente e digno.
- source_word: አውዐየ፡ ቤተ፡ ጣዖታት፡
  choice: incendiou a casa dos ídolos
  rationale: «Incendiou» expressa que Abrão ateou fogo ao edifício, enquanto a frase seguinte explicita que seu conteúdo também foi queimado.
- source_word: ወሰብእ፡ አልቦ፡ ዘአእመረ።
  choice: e ninguém soube disso
  rationale: Forma portuguesa natural para a construção negativa que afirma que nenhuma pessoa teve conhecimento do ato.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e narrativo, com legibilidade brasileira e alcance internacional. O «Abrão» isolado no início do trecho-fonte foi tratado como artefato de segmentação pertencente ao versículo anterior. A repetição do verbo de queimar foi mantida semanticamente, mas com variação natural entre «incendiou» e «queimou».
