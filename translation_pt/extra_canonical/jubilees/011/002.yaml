  yaml_path: translation/extra_canonical/jubilees/011/002.yaml
  text: And the son grew[2], and his father taught him the investigations of the Chaldeans, to divine and to practice augury according to the signs of heaven.
translation:
  language: pt
  text: E o filho cresceu[a], e seu pai lhe ensinou as investigações dos caldeus, para adivinhar e praticar augúrios segundo os sinais do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os versículos 2–5 não aparecem na segmentação do texto ge’ez fornecida. A numeração preservada e o contexto do capítulo exigem, porém, material intermediário sobre Seroh, a adivinhação caldeia e a atuação de Mastema na idolatria. Esta redação segue o sentido esperado do versículo, mas sua formulação exata não pode ser verificada no trecho ge’ez disponibilizado.
    reason: Nota sobre lacuna de segmentação e base textual indireta; grafia do nome harmonizada com a trilha inglesa auditada.
lexical_decisions:
- source_word: investigações dos caldeus (texto reconstruído pelo contexto)
  choice: investigações dos caldeus
  rationale: Mantém a expressão tradicional que designa o estudo caldeu dos fenômenos celestes, sem reduzi-lo simplesmente a astrologia.
- source_word: divinar / praticar augúrios (texto reconstruído pelo contexto)
  choice: adivinhar e praticar augúrios
  rationale: Distingue a busca de conhecimento divinatório da interpretação de presságios, preservando o paralelismo.
- source_word: sinais do céu (texto reconstruído pelo contexto)
  choice: sinais do céu
  rationale: Conserva a linguagem cosmológica antiga e evita especificar astros quando a formulação transmitida é mais ampla.
theological_decisions:
- issue: Avaliação da prática divinatória
  choice: descrever a instrução sem acrescentar condenação explícita
  alternative: qualificar as práticas como falsas ou idólatras
  rationale: Embora o contexto mais amplo de Jubileus critique a idolatria e a atuação de Mastema, este versículo apenas relata o ensino recebido; a tradução não deve antecipar nem ampliar seu juízo teológico.
translation_notes:
  register: Português atual, claro e digno, com termos técnicos compreensíveis. A formulação acompanha cautelosamente a camada inglesa auditada porque o versículo correspondente está ausente do recorte ge’ez fornecido; a incerteza textual é explicitada em nota.
