  text: Abraham his father, on the mountain of Hebron. And there Jacob kept sending to his father and to his mother, from time to time, everything they needed; and they blessed Jacob with all their heart and with all their soul.
translation:
  language: pt
  text: Abraão, seu pai, no monte de Hebrom. E ali Jacó continuou enviando a seu pai e a sua mãe, de tempos em tempos, tudo de que precisavam; e eles abençoaram Jacó de todo o coração e de toda a alma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'ህየ
  choice: E ali
  rationale: Preserva o advérbio locativo, que retoma o monte de Hebrom e liga esta frase ao contexto anterior.
- source_word: ይፈኑ ... ዘይፈኑ
  choice: continuou enviando
  rationale: Expressa de modo natural a repetição verbal e o caráter continuado dos envios, sem reproduzir uma redundância pouco idiomática em português.
- source_word: እምጊዜ፡ በበ፡ ጊዜ
  choice: de tempos em tempos
  rationale: Equivalente português corrente para a ideia distributiva de envios periódicos.
- source_word: ኵሎ፡ ትካዞሙ
  choice: tudo de que precisavam
  rationale: Comunica naturalmente o conjunto das necessidades ou provisões dos pais indicado pela expressão ge'ez.
- source_word: በኵሉ፡ ልቦሙ፡ ወበኵሉ፡ ነፍሶሙ
  choice: de todo o coração e de toda a alma
  rationale: Mantém a fórmula enfática de totalidade em linguagem portuguesa digna e reconhecível.
