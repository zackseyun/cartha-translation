  to: Seus reinos eram Carnaim, Astarote, Edrei, Misur e Beon.[a] E o Senhor os destruiu por causa da maldade de seus atos, pois eram extremamente transgressores; e fez os amorreus habitarem no lugar deles — um povo mau e pecador. Até hoje não há povo que tenha levado a termo todos os pecados deles, e eles já não existem.
