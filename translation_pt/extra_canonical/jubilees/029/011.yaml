  text: their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon[11]. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people to this day that has completed all their sins, and they no longer exist.
translation:
  language: pt
  text: Seus reinos eram Carnaim, Astarote, Edrei, Misur e Beon.[a] E o Senhor os destruiu por causa da maldade de seus atos, pois eram extremamente transgressores; e fez os amorreus habitarem no lugar deles — um povo mau e pecador. Até hoje não há povo que tenha levado a termo todos os pecados deles, e eles já não existem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vários nomes de lugares nesta lista do território dos refains são difíceis na transmissão etíope; as transliterações aqui adotadas são conservadoras.
    reason: textual_variant
lexical_decisions:
- source_word: መንግሥቶሙ
  choice: Seus reinos
  rationale: Mantém o plural do ge'ez e introduz naturalmente a lista de centros territoriais.
- source_word: ቃራናኤም፡ ወአስጠሮስ፡ ወአድራእ፡ ወሚሱር፡ ወቤዎን
  choice: Carnaim, Astarote, Edrei, Misur e Beom
  rationale: Emprega transliterações portuguesas conservadoras, reconhecendo a dificuldade da transmissão etíope desses topônimos.
- source_word: አሕጐሎሙ
  choice: os destruiu
  rationale: Expressa a eliminação dos povos mencionados e concorda com a afirmação final de que já não existem.
- source_word: ጸዋጋን፡ ጥቀ
  choice: extremamente transgressores
  rationale: Conserva a intensidade de 'muito' e traduz a caracterização de quem viola a lei sem recorrer a jargão excessivo.
- source_word: ወአኅደረ፡ አሞሬዎነ
  choice: fez os amorreus habitarem
  rationale: Reproduz a construção causativa do texto-fonte.
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: que tenha levado a termo todos os pecados deles
  rationale: Preserva a formulação incomum e sua possível ambiguidade, sem inserir a ideia interpretativa de 'medida completa'.
- source_word: ወአልቦሙ
  choice: e eles já não existem
  rationale: Fornece em português uma conclusão completa e natural para a cláusula existencial negativa.
theological_decisions:
- issue: Relação entre a extrema transgressão dos povos destruídos e os pecados dos amorreus
  choice: Preservar o referente gramatical de 'pecados deles' sem explicá-lo no corpo do texto
  alternative: Interpretar como 'a medida completa dos pecados' ou identificar explicitamente o grupo referido
  rationale: O texto é tenso e pouco usual; explicitar uma doutrina de medida acumulada ou resolver o antecedente iria além da evidência fornecida.
- issue: Descrição moral dos amorreus
  choice: Manter o aposto 'um povo mau e pecador'
  alternative: Ligá-lo aos habitantes anteriores
  rationale: A posição da expressão no ge'ez favorece sua ligação com os amorreus, mas a tradução evita desenvolver implicações teológicas não declaradas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os nomes próprios em formas portuguesas conservadoras e a estranheza significativa da oração final, sem importar a expressão interpretativa 'medida completa'.
