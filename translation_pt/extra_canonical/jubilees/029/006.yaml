lexical_decisions:
- source_word: ወኢኀደጎ፡ እግዚአብሔር
  choice: E o Senhor não permitiu que ele
  rationale: Reproduz a coordenação narrativa, a negação e o sentido permissivo do verbo, em português natural.
- source_word: ከመ፡ ይሕስም፡ ላዕለ፡ ያዕቆብ
  choice: tramasse o mal contra Jacó
  rationale: A expressão indica conceber ou planejar dano contra alguém; «tramasse o mal» conserva a intenção hostil sem especificar um ato não expresso.
- source_word: እስመ፡ አስተረአዮ፡ በሕልም
  choice: porque lhe havia aparecido em sonho
  rationale: «Porque» preserva a relação causal, e o mais-que-perfeito composto marca que a aparição ocorreu antes da restrição narrada.
theological_decisions:
- issue: Referente do sujeito implícito em «havia aparecido»
  choice: Manter o Senhor como sujeito implícito e representar o destinatário por «lhe»
  alternative: 'Explicitar: «porque o Senhor havia aparecido a ele em sonho»'
  rationale: A continuidade sintática favorece o Senhor como sujeito da aparição. A formulação escolhida é clara no contexto e evita repetição, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. «Tramasse» comunica deliberação hostil de modo corrente, e «em sonho» mantém a concisão da fonte.
