  yaml_path: translation/extra_canonical/jubilees/029/018.yaml
  text: And he dwelt there apart from Esau his son. For in the days when Jacob went to Mesopotamia, Esau took for himself Mahalath, the daughter of Ishmael, as a wife, and he gathered together all his father's livestock and his wives, and he went up and dwelt on Mount Seir, and he left Isaac his father at the Well of the Oath.
translation:
  language: pt
  text: E ele morou ali, separado de seu filho Esaú. Pois, nos dias em que Jacó foi para a Mesopotâmia, Esaú tomou para si Maalate, filha de Ismael, como esposa; reuniu todos os rebanhos e demais animais de seu pai, bem como suas esposas, subiu e morou no monte Seir, deixando seu pai Isaque no Poço do Juramento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደረ
  choice: ficou morando / passou a morar
  rationale: O verbo exprime permanecer ou estabelecer residência; as duas formulações naturais em português refletem seus usos nos respectivos contextos.
- source_word: መስጴጦምያ
  choice: Mesopotâmia
  rationale: Transliteração histórica do nome geográfico, em sua forma portuguesa corrente.
- source_word: ብእሲተ
  choice: como esposa
  rationale: No contexto de “tomar para si”, o substantivo indica a relação matrimonial, não apenas uma mulher em sentido genérico.
- source_word: ኵሎ፡ መርዔተ፡ አቡሁ
  choice: todos os rebanhos e demais animais de seu pai
  rationale: A expressão designa coletivamente os animais domésticos do pai; esta formulação evita restringi-la apenas a ovelhas ou cabras.
- source_word: ደብረ፡ ሴር
  choice: monte Seir
  rationale: Equivalente geográfico tradicional e claro em português.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Poço do Juramento
  rationale: Traduz o topônimo em seu sentido lexical, correspondente a Berseba, e segue o final completo do versículo preservado fora do recorte truncado fornecido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Separado de” preserva a ideia de residência distinta, sem acrescentar motivo ou conflito. O final “no Poço do Juramento” restaura a conclusão do versículo, ausente do recorte ge’ez por truncamento de segmentação, conforme a forma completa indicada pela evidência editorial.
