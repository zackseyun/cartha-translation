lexical_decisions:
- source_word: ዐዘቅተ፡ መሐላ፡ (ʿazaqta maḥlā)
  choice: Poço do Juramento
  rationale: Traduz o nome descritivo de modo direto e mantém a formulação já estabelecida no contexto.
- source_word: ባሕቲቶ፡ (baḥtito)
  choice: somente
  rationale: Expressa a ideia restritiva de “só/somente” sem acrescentar interpretação.
- source_word: ወዐርገ፡ (wa-ʿarga)
  choice: E ... subiu
  rationale: Conserva tanto a coordenação narrativa quanto o sentido espacial do verbo.
- source_word: ወኀደረ፡ (wa-ḫadara)
  choice: e passou a morar
  rationale: Verte idiomaticamente o ato de estabelecer residência, em vez de sugerir apenas uma pernoite.
- source_word: ማኅፈደ፡ (māḫfada)
  choice: na torre de
  rationale: Trata o termo como substantivo comum em estado construto, não como o topônimo “Mahfed”; a relação possessiva se completa no texto seguinte.
