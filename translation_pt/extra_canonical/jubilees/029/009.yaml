base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/029/009.yaml
  text: “The Heap of Witness,” according to this heap. But formerly they used to call the land of Gilead the land of the Rephaim[9], for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.
translation:
  language: pt
  text: “O Montão do Testemunho”, de acordo com este montão.[a] Mas, antigamente, chamavam a terra de Gileade de terra dos refains,[b] pois ela é a terra dos refains. Ali nasceram os refains, gigantes cuja estatura era de dez côvados, nove côvados, oito côvados e até sete côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito ge'ez traz literalmente algo como “A Festa do Testemunho, de acordo com esta festa”. Aqui se adota a emenda “O Montão do Testemunho”, geralmente entendida como o sentido pretendido, em ligação com o nome Gileade e com o montão de pedras memorial de Gênesis 31:47.
    reason: textual_variant
  - marker: b
    text: A explicação do nome combina Gileade com o memorial do testemunho e acrescenta uma designação mais antiga relacionada aos refains. O capítulo sobrepõe intencionalmente essas tradições.
    reason: cross_reference
lexical_decisions:
- source_word: ፍሥሐተ ... ፍሥሐት
  choice: “O Monte do Testemunho” ... “este monte”
  rationale: Embora o texto ge'ez preservado tenha literalmente um termo associado a alegria/festa, o contexto etimológico de Gileade e Gênesis 31:47 apontam para uma corrupção textual antiga de ‘monte de pedras’. A tradução adota a emenda contextual e registra a leitura manuscrita em nota.
- source_word: ምድረ፡ ገለአድ
  choice: terra de Gileade
  rationale: Mantém o topônimo bíblico em sua forma portuguesa corrente.
- source_word: ረፋኤም / ራፋኤም
  choice: refains
  rationale: Transliteração tradicional portuguesa do nome do povo, preservando a associação histórica e bíblica sem converter o termo diretamente em ‘gigantes’.
- source_word: ረዐይት
  choice: gigantes
  rationale: O termo qualifica os refains como seres de grande porte; ‘gigantes’ comunica naturalmente o sentido no contexto das medidas de estatura.
- source_word: በአመት
  choice: côvados
  rationale: Apesar da forma transmitida aparentemente significar ‘em ano’, a sequência de dez a sete descreve altura e é entendida textualmente como côvados; a tradução segue o sentido contextual atestado pela tradição textual.
theological_decisions:
- issue: Relação entre Gileade, o memorial do testemunho e a antiga terra dos refains
  choice: Preservar as duas camadas tradicionais em sequência
  alternative: Harmonizar toda a explicação sob uma única etimologia
  rationale: O versículo associa primeiro o nome ao monte do testemunho e depois registra uma designação mais antiga ligada aos refains; a tradução não apaga essa sobreposição.
- issue: Identificação dos refains
  choice: Manter ‘refains’ e acrescentar o qualificativo textual ‘gigantes’
  alternative: Traduzir todas as ocorrências simplesmente como ‘gigantes’
  rationale: Isso preserva tanto o nome do povo quanto a descrição de sua grande estatura, sem impor uma identificação doutrinária adicional.
translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas reconhecíveis. Preferiu-se ‘monte’ no sentido de monte de pedras, e não ‘colina’. As enumerações de estatura foram condensadas com naturalidade, sem perder nenhum valor numérico.
