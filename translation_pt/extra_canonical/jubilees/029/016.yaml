  text: and drink[16], and milk, and butter, and bread of milk, and from the instruction of all. And for his mother Rebekah, a fourth of the year, in the middle of their times of the months, and between plowing and reaping, and in the middle.
translation:
  language: pt
  text: 16 e bebida, leite, manteiga, pão de leite e tâmaras do vale.[a] E, para sua mãe Rebeca, um quarto do ano, em meio aos seus períodos mensais, entre a época de arar e a de colher, e no meio…[b]
  philosophy: optimal-equivalence
  footnotes:
