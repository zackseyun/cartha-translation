    text: A expressão traduzida como “tâmaras do vale” é incerta no texto ge'ez.
    reason: lexical_alternative
  - marker: b
    text: O texto fornecido termina aqui no meio da frase.
    reason: textual_fragment
lexical_decisions:
- source_word: ወስቴ
  choice: e bebida
  rationale: Mantém o item inicial da lista conforme o texto ge'ez preservado, embora o versículo comece no meio de uma construção.
- source_word: ወሐሊበ፡ ወቅብአ፡ ወኅብስተ፡ ሐሊብ
  choice: leite, manteiga, pão de leite
  rationale: Reproduz diretamente a sequência de produtos lácteos e alimentares do ge'ez em português natural.
- source_word: ወእምነ፡ ትመርት፡ ቍላ
  choice: e tâmaras do vale
  rationale: Entende ትመርት como tâmaras e ቍላ como região baixa ou vale; a expressão é textualmente difícil, por isso recebe nota.
- source_word: ለአውራኅ
  choice: dos meses
  rationale: O substantivo designa meses, conforme a correção da revisão de fonte, e não caminhos.
- source_word: ማእከለ፡ ሐፅኒ፡ ወለ'ዐጺድ
  choice: entre a época de arar e a de colher
  rationale: A construção correlativa significa 'entre... e...', e os termos indicam o trabalho de arar e o de colher.
