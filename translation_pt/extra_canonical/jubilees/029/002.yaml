  yaml_path: translation/extra_canonical/jubilees/029/002.yaml
  text: And Jacob saw that Laban had gone to shear his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come with him to the land of Canaan.
translation:
  language: pt
  text: Jacó viu que Labão tinha ido tosquiar suas ovelhas. Então Jacó chamou Lia e Raquel e falou ao coração delas[a], para que fossem com ele à terra de Canaã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “falou com elas”. A expressão literal “falou ao coração delas” pode indicar que Jacó lhes falou de modo íntimo ou persuasivo.'
    reason: Explica o idiomatismo semítico preservado no texto principal e registra uma tradução mais corrente.
lexical_decisions:
- source_word: ይቅርጽ፡ አባግዒሁ
  choice: tosquiar suas ovelhas
  rationale: Reproduz diretamente a ação e conserva o possessivo do texto, cujo referente contextual é Labão.
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: falou ao coração delas
  rationale: Preserva a imagem semítica explícita de falar ao coração, que sugere uma abordagem íntima, persuasiva ou consoladora, sem reduzir o sentido a um simples diálogo.
- source_word: ምድረ፡ ከናአን
  choice: à terra de Canaã
  rationale: Forma bíblica natural em português e correspondência direta à expressão ge'ez.
