translation:
  language: pt
  text: E a morada deles se estendia desde a terra dos filhos de Amom até o monte Hermom e a casa de[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto deste versículo termina com uma construção incompleta, literalmente, «e a casa de»; o complemento aparece além deste recorte textual.
    reason: Preservar o estado construto de ቤተ e esclarecer que a frase truncada resulta da segmentação, sem inventar «Betel» ou outro complemento.
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: sua morada
  rationale: Expressa o lugar ou território em que habitavam; o possessivo plural é preservado naturalmente em português.
- source_word: ምድረ ውሉደ አሞን
  choice: a terra dos filhos de Amom
  rationale: Mantém a formulação genealógica do texto-fonte sem substituí-la por uma designação étnica interpretativa.
- source_word: ደብረ ሔርሞን
  choice: o monte Hermom
  rationale: ደብር designa monte ou montanha neste topônimo; “monte Hermom” é a forma portuguesa consagrada e clara.
- source_word: ወቤተ
  choice: e a casa de
  rationale: A forma ቤተ está em estado construto e exige um complemento; não corresponde ao nome próprio “Betel”. A tradução preserva a frase incompleta causada pela divisão do versículo.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com sintaxe natural. “Se estendia desde... até...” comunica a extensão territorial melhor do que uma reprodução rígida de “era desde...”. A incompletude final do texto-fonte foi mantida e explicada em nota.
