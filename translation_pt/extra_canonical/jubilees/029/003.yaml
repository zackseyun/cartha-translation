  text: For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should return to his father's house; and he said to him, “Go to every place, wherever you go.””
translation:
  language: pt
  text: 'Pois ele lhes contou tudo o que tinha visto no sonho e tudo o que lhe havia sido dito: que voltasse para a casa de seu pai[a]. E ele lhe disse: “Vá a todo lugar, por onde quer que você vá.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entre”.'
    reason: Alternativa de tradução registrada para o verbo relativo à ida à casa do pai; o texto principal conserva “voltasse” pelo sentido contextual de retorno.
  - marker: b
    text: 'Ou: “e estarei com você”.'
    reason: Leitura harmonizadora ou reconstruída, alinhada a Gênesis 31:3, mas ausente do texto ge'ez fornecido; por isso permanece em nota.
lexical_decisions:
- source_word: ይግባእ
  choice: voltasse
  rationale: O verbo ገብአ expressa aqui a ideia de retornar, de acordo com o contexto da volta de Jacó à casa de seu pai, e não simplesmente entrar.
- source_word: ቤተ፡ አቡሁ
  choice: para a casa de seu pai
  rationale: A construção indica o destino do retorno e é vertida de modo natural em português.
- source_word: ሖውር፡ ውስተ፡ ኵሉ፡ መካን
  choice: Vá a todo lugar
  rationale: Mantém a linguagem de movimento e a abrangência de 'todo lugar' sem acrescentar conteúdo ausente do texto etíope.
- source_word: ወአይ፡ ተሐውር
  choice: por onde quer que vá
  rationale: Reproduz a oração indefinida ligada ao deslocamento, preservando a formulação um tanto repetitiva do texto existente.
theological_decisions:
- issue: Conteúdo final da fala divina
  choice: Traduzir o texto etíope existente como “por onde quer que vá”
  alternative: “e eu estarei com você”
  rationale: A alternativa harmoniza a passagem com Gênesis 31:3, mas não consta do texto ge'ez fornecido; não se deve introduzir essa promessa por reconstrução ou harmonização.
- issue: Sujeito de “ele lhe disse”
  choice: Manter o pronome sem identificar explicitamente o sujeito
  alternative: Explicitar “Deus lhe disse”
  rationale: O texto usa uma forma pronominal e o referente pode ser inferido do contexto; explicitar Deus resolveria algo que o versículo não declara nominalmente.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento correntes no Brasil e compreensão ampla no espaço lusófono. A repetição da última fala foi suavizada apenas o necessário para soar inteligível, sem substituir o texto transmitido por uma harmonização com Gênesis.
