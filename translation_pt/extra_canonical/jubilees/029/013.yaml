  - marker: a
    text: 'Ou, segundo outra leitura: “no primeiro ano da décima semana”.'
    reason: Preserva a variante cronológica documentada sem inseri-la no texto principal.
lexical_decisions:
- source_word: ጽባሕ
  choice: na manhã seguinte
  rationale: Expressa naturalmente o valor temporal de “amanhã/manhã seguinte” no contexto narrativo.
- source_word: ምድረ፡ ገለአድ
  choice: terra de Gileade
  rationale: Mantém a designação geográfica tradicional e transparente.
- source_word: ኢያቦክሃ
  choice: Jaboque
  rationale: Forma portuguesa consagrada do topônimo bíblico Jaboque.
- source_word: ተኂነኖ
  choice: os dois se reconciliaram
  rationale: Comunica de modo natural a reconciliação mútua indicada pelo verbo no contexto.
theological_decisions:
- issue: Identificação da expressão cronológica após “nono mês”
  choice: no décimo primeiro dia do mês
  alternative: no primeiro ano da décima semana
  rationale: A evidência textual e a revisão mais recente entendem a forma corrompida como referência ao décimo primeiro dia; a alternativa é registrada em nota por refletir uma leitura anterior da expressão.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos em suas formas portuguesas usuais. A repetição coordenativa do ge'ez foi suavizada apenas o necessário para fluência narrativa; “nesse mesmo dia” conserva a ênfase temporal.
