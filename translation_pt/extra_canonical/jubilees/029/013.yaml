  text: And he journeyed on the next morning to the land of Gilead. And Jacob crossed the Jabbok in the ninth month, on the eleventh of it, and on this day Esau his brother came to him, and they were reconciled.
translation:
  language: pt
  text: Na manhã seguinte, ele partiu para a terra de Gileade. Jacó atravessou o Jaboque no nono mês, no décimo primeiro dia do mês,[a] e, nesse mesmo dia, seu irmão Esaú veio ao seu encontro, e os dois se reconciliaram.
  philosophy: optimal-equivalence
