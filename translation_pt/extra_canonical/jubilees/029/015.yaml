lexical_decisions:
- source_word: አመ፡ አቅራቦት
  choice: na época do outono
  rationale: A expressão temporal conclui a enumeração sazonal do contexto; አቅራቦት designa aqui o outono, não o ato de trazer ou apresentar.
- source_word: ወይፌኑ
  choice: E enviou
  rationale: O verbo significa enviar; a forma com ወ- dá continuidade à narrativa.
- source_word: እምኵሉ፡ ጥሪቱ
  choice: de todos os seus bens
  rationale: Expressa a procedência da oferta a partir do conjunto das posses do sujeito.
- source_word: ልብሰ
  choice: roupas
  rationale: O singular lexical funciona coletivamente e é vertido naturalmente no plural em português.
- source_word: ወሲሲተ፡ ሥጋ
  choice: e provisões de carne
  rationale: ሲሲት designa alimento ou provisões; a justaposição com ሥጋ é entendida como provisões compostas de carne, sem introduzir a ideia não atestada de primícias.
