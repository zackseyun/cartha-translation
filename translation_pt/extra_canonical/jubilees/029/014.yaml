  text: And he went from him to the land of Seir, but Jacob dwelt in tents. And in the first year of the fifth week in this jubilee, he crossed the Jordan and dwelt beyond the Jordan, and he pastured his sheep from the Sea of Heaps[14] as far as Beth-shan and as far as Dothan and as far as
translation:
  language: pt
  text: Ele se afastou dele e foi para a terra de Seir, mas Jacó habitou em tendas. No primeiro ano da quinta semana deste jubileu, Jacó atravessou o Jordão, habitou além do Jordão e apascentou suas ovelhas desde o Mar dos Montões[a] até Bete-Seã, até Dotã e até[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mar dos Montões” é um topônimo incerto no texto etíope; pode refletir outro nome de lugar em uma forma textual anterior.
    reason: lexical_alternative
  - marker: b
    text: O trecho fornecido termina literalmente com “e até”, deixando a frase incompleta.
    reason: textual_fragment
lexical_decisions:
- source_word: ወሖረ፡ እምኀቤሁ፡ ምድረ፡ ሴኢር
  choice: Ele partiu de junto dele para a terra de Seir
  rationale: Mantém o pronome do texto ge'ez, sem substituir explicitamente seu referente por Esaú, e expressa de modo natural o movimento para Seir.
- source_word: ኀደረ፡ በምጽላላት
  choice: habitou em tendas
  rationale: Reproduz o sentido concreto de residir ou permanecer em tendas, em registro bíblico claro.
- source_word: ዐደወ፡ ዮርዳኖስ
  choice: atravessou o Jordão
  rationale: Tradução direta do verbo de travessia e do topônimo.
- source_word: ኀደረ፡ ማዕዶተ፡ ዮርዳኖስ
  choice: habitou do outro lado do rio
  rationale: Evita a repetição pesada de “Jordão” em português, sem perder a referência imediata ao rio mencionado.
- source_word: ባሕረ፡ ፌሐሐት
  choice: Mar dos Montões
  rationale: Traduz a leitura tradicional do topônimo etíope, mas assinala em nota que sua identificação e forma subjacente são incertas.
- source_word: ቤተስን / ዶታኤም
  choice: Bete-Seã / Dotã
  rationale: Emprega formas portuguesas reconhecíveis dos topônimos bíblicos Beth-shan e Dothan.
