  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. O fragmento inicial «a terra de Gileade» foi mantido porque pertence à segmentação fornecida do versículo. A imagem semítica do coração foi preservada em formulação idiomática.
