  yaml_path: translation/extra_canonical/jubilees/029/005.yaml
  text: the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the seventh year of the fourth week[5], Jacob set out for Gilead in the first month, on the twenty-first; and Laban pursued after him, and he overtook Jacob on the mountain of Gilead in the third month, on the thirteenth.
translation:
  language: pt
  text: a terra de Gileade. Jacó ocultou de Labão o que tinha no coração e não lhe contou. No sétimo ano da quarta semana[a], Jacó partiu para Gileade no vigésimo primeiro dia do primeiro mês. Labão perseguiu-o e alcançou Jacó no monte Gileade, no décimo terceiro dia do terceiro mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cronologia deste versículo é difícil, pois a partida e o encontro são relacionados a meses diferentes. A tradução mantém as datas declaradas no texto, sem tentar harmonizá-las.
    reason: segmentation_note
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን
  choice: Jacó ocultou de Labão o que tinha no coração
  rationale: Preserva a imagem do coração presente no ge’ez, mas evita em português a formulação pouco natural «ocultou seu coração de Labão».
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: Jacó partiu para Gileade
  rationale: Expressa de modo natural o movimento de Jacó em direção a Gileade sem acrescentar detalhes ausentes do texto.
- source_word: ወደገኖ፡ ላባ፡ ድኅሬሁ
  choice: Labão foi atrás dele
  rationale: Traduz a perseguição indicada pelo ge’ez sem acrescentar «ouviu», elemento que não aparece na fonte.
- source_word: በደብረ፡ ገላአድ
  choice: no monte Gileade
  rationale: Mantém a designação geográfica no singular conforme a formulação da fonte.
