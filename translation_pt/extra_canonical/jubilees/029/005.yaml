    issue: A expressão «Labão foi atrás dele» é menos precisa que o verbo de perseguição do original.
    rationale: O ge'ez indica que Labão perseguiu Jacó. «Perseguiu-o» comunica esse sentido diretamente e não introduz a informação ausente de que Labão teria ouvido algo.
  - severity: low
    issue: A nota afirma que partida, perseguição e encontro são relacionados a meses diferentes.
    rationale: O versículo declara datas para a partida no primeiro mês e para o alcance/encontro no terceiro; a perseguição não recebe uma data independente. A formulação deve evitar sugerir três meses ou três datas distintas.
