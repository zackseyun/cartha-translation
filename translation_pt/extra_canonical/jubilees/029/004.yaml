base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/029/004.yaml
  text: And Jacob blessed the God of Isaac his father, and the God of Abraham, the father of his father; and he arose and set his wives and his children on animals, and took all his possessions, and crossed the River and arrived.
translation:
  language: pt
  text: Com você.[a] Jacó abençoou o Deus de Isaque, seu pai, e o Deus de Abraão, pai de seu pai. Depois se levantou, colocou suas mulheres e seus filhos sobre animais, tomou todos os seus bens, atravessou o rio e chegou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “com você” aparecem no início do trecho fornecido, mas parecem concluir a frase do versículo anterior.
    reason: O segmento inicial ምስሌከ é sintaticamente isolado neste versículo e provavelmente reflete a divisão editorial dos versículos.
lexical_decisions:
- source_word: ባረኮ
  choice: abençoou
  rationale: Mantém o sentido verbal direto de bendizer/abençoar, sem substituí-lo interpretativamente por “louvou”.
- source_word: ወጸዐ(ነ)፡ አኅቲያሁ፡ ወውሉዱ
  choice: fez suas mulheres e seus filhos montarem nos animais
  rationale: Representa a ação de pôr/carregar pessoas sobre animais, distinta do verbo seguinte, “tomou”, aplicado aos bens; também produz português natural.
- source_word: ጥሪተ
  choice: bens
  rationale: Expressa de modo corrente o conjunto de posses ou propriedade de Jacó.
- source_word: ፈለገ
  choice: o Rio
  rationale: O substantivo definido funciona como designação geográfica; a inicial maiúscula preserva esse uso sem acrescentar no corpo do texto o nome não expresso aqui.
- source_word: ወበጽሐ
  choice: e chegou
  rationale: Preserva a ausência de destino expresso no trecho fornecido, sem completar a frase por conjectura.
theological_decisions:
- issue: Jacó abençoa Deus
  choice: abençoou o Deus de Isaque
  alternative: louvou o Deus de Isaque
  rationale: A formulação potencialmente incomum é preservada porque o verbo-fonte diz “abençoou”; não se resolve a tensão teológica por paráfrase.
- issue: Relação de Abraão com Jacó
  choice: pai de seu pai
  alternative: seu avô
  rationale: Mantém a formulação genealógica explícita e repetitiva do original, em vez de condensá-la.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição genealógica e a chegada sem destino expresso foram mantidas. A ação de colocar a família sobre animais foi distinguida da tomada dos bens.
