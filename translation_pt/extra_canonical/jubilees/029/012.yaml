  text: life upon the earth.[12] And Jacob sent Laban away,, and he went into Mesopotamia, the land of the east; and Jacob returned to the land of Gilead. And he crossed the Jabbok in the ninth month, on the eleventh; and on that day Esau his brother came to him, and he was reconciled with him,
translation:
  language: pt
  text: vida sobre a terra.[a] Então Jacó mandou Labão embora, e ele foi para a Mesopotâmia, a terra do Oriente; Jacó, por sua vez, voltou para a terra de Gileade. No nono mês, no décimo primeiro dia, ele atravessou o Jaboque; naquele dia, seu irmão Esaú veio ao seu encontro e reconciliou-se com ele,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A oração anterior, «eles já não têm vida sobre a terra», também pode ser entendida como «não lhes restava nenhum vestígio de vida na terra».
    reason: alternative_reading
lexical_decisions:
- source_word: ሕይወት፡ ውስተ፡ ምድር
  choice: vida sobre a terra
  rationale: Mantém de modo direto a expressão ge'ez e a ligação com a oração anterior, embora o versículo comece no meio da frase.
- source_word: ፈነወ፡ ያዕቆብ፡ ላባሃ
  choice: Jacó despediu Labão
  rationale: Reproduz o sentido de enviar ou deixar partir sem acrescentar hostilidade; a ordem dos nomes segue naturalmente o português.
- source_word: ሜስጶ
  choice: Mesopotâmia
  rationale: Emprega a forma portuguesa tradicional do topônimo iniciado no trecho ge'ez preservado.
- source_word: the land of the east
  choice: a terra do Oriente
  rationale: Preserva a designação geográfica tradicional com linguagem corrente e digna.
- source_word: Jabbok
  choice: Jaboque
  rationale: Usa a forma bíblica portuguesa amplamente reconhecida.
theological_decisions:
- issue: Ambiguidade da afirmação sobre a permanência de vida na terra
  choice: Manter no texto a formulação literal «vida sobre a terra» e registrar a outra compreensão em nota
  alternative: Traduzir diretamente como «não lhes restava nenhum vestígio de vida na terra»
  rationale: A evidência permite mais de uma compreensão da oração anterior; a nota preserva essa tensão sem impor uma interpretação.
- issue: Reciprocidade da reconciliação entre Esaú e Jacó
  choice: «reconciliou-se com ele»
  alternative: «os dois se reconciliaram»
  rationale: A formulação mantém a estrutura e a referência pronominal do testemunho consultado, sem explicitar uma reciprocidade maior do que o texto declara.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e formas bíblicas reconhecíveis. Conservou-se o início fragmentário do versículo e a pontuação final aberta, pois o trecho fornecido continua além desta unidade.
