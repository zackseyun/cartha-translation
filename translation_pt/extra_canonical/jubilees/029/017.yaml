  yaml_path: translation/extra_canonical/jubilees/029/017.yaml
  text: Spring and rain and the middle of winter and summer were in the tower of Abraham. For Isaac had returned from the Well of the Oath and had gone up to the cave of his father Abraham.
translation:
  language: pt
  text: A primavera, a estação das chuvas, o meio do inverno e o verão estavam na torre de Abraão. Pois Isaque havia voltado do Poço do Juramento e subido à torre de seu pai Abraão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸዳይ (ṣəday)
  choice: primavera
  rationale: Equivalente natural do nome da estação no contexto.
- source_word: ዝናም (zənām)
  choice: estação das chuvas
  rationale: O substantivo significa literalmente “chuva”; na sequência de períodos do ano, “estação das chuvas” comunica melhor seu valor temporal.
- source_word: ማእከለ ክረምት (maʾəkala kərəmt)
  choice: o meio do inverno
  rationale: Mantém de modo direto a expressão temporal do ge'ez, sem harmonizar o sistema sazonal antigo com o moderno.
- source_word: ማኅፈድ (maḫfad)
  choice: torre
  rationale: O termo designa aqui uma torre, local associado a Abraão em Jubileus; foi traduzido da mesma forma nas duas ocorrências.
- source_word: ዐዘቅተ መሐላ (ʿazaqta maḥālā)
  choice: Poço do Juramento
  rationale: Reproduz o nome do lugar de modo semanticamente transparente e com capitalização própria.
- source_word: ዐርገ (ʿarga)
  choice: subido
  rationale: Preserva o movimento ascendente expresso pelo verbo, em construção coordenada com o retorno de Isaque.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. O primeiro enunciado é elíptico no ge'ez; “passaram” explicita minimamente o sentido temporal sugerido pela lista de estações, sem alterar sua sequência incomum. A repetição de “Abraão” foi mantida por fidelidade ao texto.
