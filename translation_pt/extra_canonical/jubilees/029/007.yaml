  text: by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain.
translation:
  language: pt
  text: À noite e contou a Labão a respeito de Jacó. No décimo quinto desses dias, Jacó ofereceu um banquete a Labão e a todos os que tinham vindo com Labão. Naquele dia, Jacó jurou a Labão, e Labão também jurou a Jacó, que nenhum deles passaria para o lado do outro com má intenção, no monte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሌሊተ
  choice: à noite
  rationale: Reproduz diretamente a expressão temporal, embora o versículo comece como continuação da frase anterior.
- source_word: ገብረ ... ግዝአ
  choice: ofereceu um banquete
  rationale: A construção indica preparar ou realizar uma refeição festiva; esta formulação é natural e mantém o caráter celebrativo.
- source_word: ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ
  choice: nenhum deles passaria para o lado do outro
  rationale: Expressa o movimento de atravessar em direção ao território ou lado da outra parte sem acrescentar uma delimitação ausente no texto.
- source_word: በእኩይ
  choice: com má intenção
  rationale: Conserva o sentido de agir para o mal sem restringi-lo a uma forma específica de hostilidade.
- source_word: በደብረ
  choice: no monte
  rationale: Traduz a expressão locativa tal como preservada no trecho, sem completar um possível nome geográfico ausente.
theological_decisions:
- issue: Natureza do juramento entre Jacó e Labão
  choice: manter o juramento recíproco e a proibição de atravessar com má intenção
  alternative: explicitar uma aliança de não agressão ou uma fronteira territorial
  rationale: O texto sustenta uma obrigação mútua, mas não exige uma formulação jurídica ou geográfica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O início fragmentário e o encerramento abrupto em “no monte” foram preservados porque refletem o trecho fornecido; não se acrescentou contexto conjectural.
