  text: '...of the sun and the moon, all are in the hand of the Lord. Why do I search? If he wills...'
translation:
  language: pt
  text: '...do sol e da lua; todos estão na mão do Senhor. Por que procuro? Se ele quiser...[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A divisão deste trecho deixa incompletos tanto o início quanto o fim do versículo: «do sol e da lua» continua a frase anterior, e «Se ele quiser» inicia a frase seguinte.'
    reason: Esclarece a segmentação editorial do trecho e evita que a oração condicional seja ligada à pergunta anterior.
lexical_decisions:
- source_word: ለፀሓይ፡ ወለወርኅ
  choice: '...do sol e da lua'
  rationale: Os prefixos ለ- têm aqui valor genitivo e dão continuidade ao conteúdo anterior; as reticências preservam o caráter fragmentário da divisão fornecida.
- source_word: ኵሉ፡ በእዴ፡ እግዚአብሔር
  choice: todos estão nas mãos do Senhor
  rationale: Reproduz o sentido distributivo de ኵሉ e a expressão de domínio divino; o plural natural em português concorda com os elementos mencionados.
- source_word: ለምንት፡ አነ፡ እትኃሠሥ
  choice: Por que continuo procurando?
  rationale: A primeira pessoa está explícita; 'continuo procurando' comunica naturalmente a busca em curso, sem acrescentar seu objeto.
- source_word: በእመ፡ ፈቀደ
  choice: Se ele quiser...
  rationale: Mantém a oração condicional como início incompleto da frase seguinte, sem ligá-la indevidamente à pergunta anterior.
theological_decisions:
- issue: Domínio do Senhor sobre os corpos celestes
  choice: todos estão nas mãos do Senhor
  alternative: tudo está na mão do Senhor
  rationale: A formulação preserva a afirmação do texto sem desenvolver uma doutrina adicional; o plural é idiomático e retoma o sol e a lua.
- issue: Referente de 'ele' em 'Se ele quiser'
  choice: manter o pronome sem explicitação
  alternative: Se o Senhor quiser
  rationale: Embora o Senhor seja o referente provável, o texto-fonte emprega a forma verbal sem nomeá-lo novamente; a tradução preserva essa forma e a transição incompleta.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. As reticências e a nota preservam a fragmentação causada pela divisão do trecho, em vez de reconstruir silenciosamente o contexto.
