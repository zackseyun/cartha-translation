  to: 'E ele disse: “Devo eu voltar para Ur dos caldeus, que procuram o meu rosto para que eu volte a eles? E que farei aqui, neste lugar? Torna reto diante de ti o caminho certo, por meio da mão do teu servo, para que ele o faça,[a] e não deixes que eu ande no erro do meu coração, meu Deus”. Quando terminou de falar e de orar, eis que alguém foi enviado.[b]'
