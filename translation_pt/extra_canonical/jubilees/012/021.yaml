  text: And he said[a], "Shall I return to Ur of the Chaldeans, who seek my face so that I should return to them? And what shall I do here in this place? Make the right path straight before you in the hand of your servant, that he may do it, and let me not walk in the error of my heart, my God." And he finished speaking and praying, and behold, one was sent
translation:
  language: pt
  text: 'E ele disse: “Devo eu voltar para Ur dos caldeus, que procuram o meu rosto para que eu volte a eles? E que farei aqui, neste lugar? Torna reto diante de ti o caminho certo, por meio da mão do teu servo, para que ele o faça,[a] e não deixes que eu ande no erro do meu coração, meu Deus”. Quando terminou de falar e de orar, eis que alguém foi enviado.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção desta petição é difícil no ge''ez segmentado. Também pode ser entendida mais literalmente como: “Torna reto diante de ti o caminho certo na mão do teu servo, para que ele o faça”.'
    reason: segmentation_note
  - marker: b
    text: 'O versículo termina de modo abrupto com uma forma passiva: “foi enviado”. O contexto seguinte esclarece o que foi enviado.'
    reason: incomplete_clause
lexical_decisions:
- source_word: የኀሥሡ፡ ገጽየ
  choice: procuram o meu rosto
  rationale: Mantém a expressão concreta do ge'ez, cujo contexto indica que desejam a presença e o retorno de Abraão, sem substituí-la pela leitura não exigida “procuram tirar a minha vida”.
- source_word: እግባእ፡ ኀቤሆሙ
  choice: eu volte a eles
  rationale: O verbo expressa retorno, e ኀቤሆሙ indica direção para eles.
- source_word: ፍኖተ፡ ርቱዐ
  choice: o caminho certo
  rationale: Reproduz o sintagma “caminho reto/certo” em português natural; com “torna reto”, “certo” evita uma repetição pesada.
- source_word: በቅድሜከ
  choice: diante de ti
  rationale: Preserva explicitamente a segunda pessoa do singular do texto ge'ez, em vez de emendá-la para “diante de mim”.
- source_word: ተፈነወ
  choice: foi enviado
  rationale: Mantém a forma passiva e a conclusão abrupta do versículo, sem identificar indevidamente o enviado.
theological_decisions:
- issue: Agência divina e humana na orientação do caminho
  choice: “Torna reto diante de ti o caminho certo, por meio da mão do teu servo, para que ele o siga”
  alternative: “Torna reto diante de mim o caminho certo, e que isso seja feito pela mão do teu servo”
  rationale: A tradução conserva “diante de ti” e a forma verbal ativa ligada ao servo, sem resolver a construção difícil por alteração de pessoa ou por uma passiva não presente no ge'ez.
- issue: Pedido para não seguir o erro interior
  choice: “não deixes que eu ande no erro do meu coração”
  alternative: “que eu não ande no erro do meu coração”
  rationale: A forma de pedido a Deus é explicitada de modo idiomático, preservando a dependência da direção divina sem acrescentar uma doutrina específica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas brasileiras naturais. Conservou-se a expressão semítica “procuram o meu rosto” por fidelidade ao texto e à ambiguidade genuína. A oração difícil foi vertida com fluência moderada, enquanto a nota registra sua forma mais literal. O fechamento abrupto foi preservado, com “alguém” como sujeito indefinido mínimo.
