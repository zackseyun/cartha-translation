  yaml_path: translation/extra_canonical/jubilees/012/012.yaml
  text: And in the sixtieth year of the life of Abram, that is, in the fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no one knew it.
translation:
  language: pt
  text: E, no sexagésimo ano da vida de Abrão, isto é, na quarta semana, no quarto ano dela, Abrão se levantou de noite, pôs fogo na casa dos ídolos e queimou tudo o que havia dentro da casa, sem que ninguém soubesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዓመት፡ ዘስሳ፡ ዘሕይወቱ፡ አብራም
  choice: E, no sexagésimo ano da vida de Abrão
  rationale: Reproduz diretamente a indicação cronológica e mantém a forma tradicional portuguesa do nome Abrão neste estágio da narrativa.
- source_word: ውእቱ፡ ሱባዔ፡ ራብዕ፡ በዓመት፡ ራብዕ፡ ሎቱ
  choice: isto é, na quarta semana, no quarto ano dela
  rationale: Mantém o sistema jubilar de semanas de anos e explicita naturalmente em português que o quarto ano pertence à quarta semana.
- source_word: ተንሥአ፡ አብራም፡ በሌሊት
  choice: Abrão se levantou de noite
  rationale: Conserva a sequência narrativa e o sentido temporal do texto etíope.
- source_word: ወአውዐየ፡ ቤተ፡ ጣዖታት
  choice: pôs fogo na casa dos ídolos
  rationale: Expressa de modo idiomático a ação intencional de incendiar o edifício, sem sugerir apenas aquecimento ou dano parcial.
- source_word: ወአውዐየ፡ ኵሎ፡ በውስተ፡ ቤት
  choice: e queimou tudo o que havia dentro da casa
  rationale: Preserva a repetição verbal e a abrangência de 'tudo' no interior da casa.
- source_word: ወሰብእ፡ አልቦ፡ ዘአእመረ
  choice: sem que ninguém soubesse
  rationale: É uma formulação portuguesa natural para a afirmação de que nenhuma pessoa teve conhecimento do ato.
