  text: the word of the LORD came to him by my hand, saying, "Go out from your land and from your kindred and from your father's house to the land that I will show you, and I will make you into a great and numerous nation, and I will bless you."
translation:
  language: pt
  text: 'A palavra do SENHOR veio a ele por minha mão, dizendo: “Saia da sua terra, dos seus parentes e da casa de seu pai, e vá para a terra que eu lhe mostrarei. Farei de você uma nação grande e numerosa e o abençoarei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ እግዚአብሔር
  choice: a palavra do SENHOR
  rationale: Reproduz a expressão etíope de modo tradicional e claro, usando SENHOR para o título divino.
- source_word: በእዴየ
  choice: por minha mão
  rationale: Preserva literalmente a mediação expressa pelo narrador, sem explicar além do que o texto afirma.
- source_word: ትዝምድከ
  choice: seus parentes
  rationale: Comunica em português atual o grupo de parentesco ou parentela indicado pelo termo.
- source_word: ሕዝበ፡ ዐቢየ፡ ወብዙኃ
  choice: uma nação grande e numerosa
  rationale: 'Mantém os dois atributos do texto-fonte: grandeza e multiplicidade.'
theological_decisions:
- issue: Mediação da palavra divina
  choice: veio a ele por minha mão
  alternative: veio diretamente a ele
  rationale: O texto inclui explicitamente “por minha mão”; a tradução conserva essa tensão narrativa sem identificar ou apagar o mediador.
- issue: Forma da promessa
  choice: Farei de você uma nação grande e numerosa
  alternative: Farei você um povo grande e numeroso
  rationale: “Nação” expressa naturalmente a promessa coletiva e corresponde ao uso consagrado do paralelo abraâmico, sem acrescentar conteúdo denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O imperativo foi vertido por “Saia” e “vá”, em tratamento uniforme por “você”; a sequência foi dividida em duas frases dentro da citação para maior clareza, sem alterar o conteúdo.
