    issue: Escopo do possessivo na primeira oração
    rationale: Em «abri a boca, os ouvidos e os lábios dele», o possessivo posposto pode ser entendido como ligado mais imediatamente apenas a «lábios». A construção dativa explicita que boca, ouvidos e lábios são dele, como no original.
  - severity: low
    issue: Formulação dos seis meses finais
    rationale: O ge'ez qualifica os seis meses como chuvosos. «Durante os seis meses chuvosos» reproduz essa qualificação de modo mais direto do que «durante os seis meses de chuva».
