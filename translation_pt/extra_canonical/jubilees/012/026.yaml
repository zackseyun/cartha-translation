base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/026.yaml
  text: And I opened his mouth and his ears and his lips, and I began to speak with him in Hebrew, in the language of creation. And he took the books of his fathers, and they were written in Hebrew, and he copied them and began from then on to study them. And I made known to him everything that he was unable to understand, and he studied them during the six rainy months.
translation:
  language: pt
  text: E eu abri-lhe a boca, os ouvidos e os lábios e comecei a falar com ele em hebraico, a língua da criação. Ele pegou os livros de seus pais, que estavam escritos em hebraico, copiou-os e, desde então, começou a estudá-los. Eu lhe dei a conhecer tudo o que ele não conseguia entender, e ele os estudou durante os seis meses chuvosos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዕብራይስጥ
  choice: em hebraico
  rationale: Equivalente direto e natural do nome da língua no contexto.
- source_word: በልሳነ፡ ፍጥረታት
  choice: a língua da criação
  rationale: Preserva a formulação distintiva do texto, sem explicá-la ou identificar sua referência teológica além do que a fonte afirma.
- source_word: መጻሕፍተ፡ አበዊሁ
  choice: os livros de seus pais
  rationale: Mantém o sentido literal de antepassados/pais e a possível referência a escritos ancestrais, sem especificação adicional.
- source_word: ወደገሞን
  choice: copiou-os
  rationale: No contexto dos livros escritos em hebraico, o verbo indica reprodução ou cópia; esta opção produz sentido claro em português.
- source_word: ስድስተ፡ ወርኀ፡ ዘናም
  choice: os seis meses de chuva
  rationale: Conserva a referência sazonal concreta da fonte, em vez de substituí-la por uma estação climática regional.
theological_decisions:
- issue: Identidade da “língua da criação”
  choice: Manter a expressão como aposto de “hebraico”
  alternative: Traduzir como “a língua na qual o mundo foi criado”
  rationale: A construção associa o hebraico à língua da criação, mas não exige explicitar de que maneira; a tradução preserva essa tensão sem ampliar a afirmação.
- issue: Natureza dos livros ancestrais
  choice: “livros de seus pais”
  alternative: “livros de seus antepassados” ou “livros sagrados de seus pais”
  rationale: A fonte não os qualifica explicitamente como sagrados; a opção escolhida evita importar uma categoria canônica ou confessional.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa fluente. Mantiveram-se as repetições e a progressão de ações da fonte, com leve reorganização para clareza. Não foram necessárias notas de rodapé.
