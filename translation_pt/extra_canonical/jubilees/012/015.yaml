  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: pt
  text: antes de Terá, seu pai. E o sepultaram em Ur dos Caldeus. Terá saiu de Ur dos Caldeus, ele e seus filhos, para irem à terra do Líbano e à terra de Canaã. Terá se estabeleceu na terra de Harã, e Abrão morou com Terá, seu pai, em Harã.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀበርዎ
  choice: o sepultaram
  rationale: Mantém o referente masculino e o sujeito plural implícito do verbo, em registro digno e corrente.
- source_word: ምድረ፡ ሊባኖስ
  choice: terra do Líbano
  rationale: Reproduz de modo direto a expressão geográfica do texto etíope.
- source_word: ኀደረ
  choice: se estabeleceu / morou
  rationale: O verbo pode indicar permanecer ou habitar; escolhas contextuais naturais distinguem a fixação de Terá da residência de Abrão com o pai.
- source_word: ካራን
  choice: Harã
  rationale: Adota a forma bíblica portuguesa amplamente reconhecida para o topônimo.
