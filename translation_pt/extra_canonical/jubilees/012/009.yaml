  text: He told this matter to his two brothers,, and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of
translation:
  language: pt
  text: Ele contou isso a seus dois irmãos, e eles ficaram irados com ele e permaneceram calados. No quadragésimo jubileu, na segunda semana, no sétimo ano dessa semana, Abrão tomou para si uma esposa. O nome dela era Sarai, filha de…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão genealógica fica incompleta no trecho fornecido. A continuação “filha de seu pai” é textualmente difícil neste contexto; alguns testemunhos e intérpretes entendem a relação familiar de outra maneira.
    reason: textual_variant
lexical_decisions:
- source_word: ዘንተ፡ ነገረ
  choice: Ele contou isso
  rationale: Expressa o demonstrativo e o verbo de dizer/contar de modo natural, sem acrescentar um substantivo como “assunto”.
- source_word: ለክልኤ፡ አሐዊሁ
  choice: a seus dois irmãos
  rationale: Preserva explicitamente o numeral “dois” e a relação fraterna.
- source_word: ወተምዑ፡ ላዕሌሁ
  choice: mas eles ficaram irados com ele
  rationale: O plural remete aos dois irmãos; “mas” comunica naturalmente a reação adversativa no contexto.
- source_word: ወአርመሙ
  choice: e permaneceram calados
  rationale: Mantém a terceira pessoa do plural da forma ge'ez, evitando a antiga leitura singular.
- source_word: በአርብዓ፡ አዮቤልዉ
  choice: No quadragésimo jubileu
  rationale: Reproduz a terminologia cronológica característica da obra.
- source_word: በሱባዔ፡ ካልእ፡ በሳብዕ፡ ዓመት፡ ሎቱ
  choice: na segunda semana, no sétimo ano dessa semana
  rationale: Explicita de forma discreta o referente do possessivo para tornar inteligível a estrutura cronológica em português.
- source_word: ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ
  choice: Abrão tomou para si uma esposa
  rationale: Preserva a construção reflexiva e o sentido matrimonial sem recorrer a linguagem arcaica.
- source_word: ወስማ፡ ሶራ
  choice: O nome dela era Sarai
  rationale: Usa a forma onomástica portuguesa reconhecível “Sarai”, em consonância com a tradição textual consultada, embora a forma ge'ez transliterada seja próxima de “Sora”.
- source_word: ወሰተ
  choice: filha de…
  rationale: O segmento fornecido termina no início de uma expressão genealógica; as reticências sinalizam honestamente que a frase está incompleta, sem suprir palavras ausentes.
theological_decisions:
- issue: Identidade e relação genealógica de Sarai
  choice: Manter a expressão incompleta como “filha de…” e registrar a dificuldade em nota
  alternative: Completar “filha de seu pai” ou definir outra relação familiar
  rationale: O trecho ge'ez fornecido termina antes de completar a relação, e a tradição textual é difícil; completar a frase resolveria indevidamente uma ambiguidade relevante.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos de uso corrente no Brasil e ampla compreensão internacional. A sintaxe cronológica foi levemente explicitada para clareza, sem alterar a sequência do original. As reticências fazem parte da tradução porque o segmento-fonte termina no meio da expressão genealógica.
