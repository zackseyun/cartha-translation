base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/006.yaml
  text: '[They are a deception] to those who make them, and confusion of heart to those who worship them. Do not worship them." And his father said to him, "I too know, my son, but what can I do for a people who have made me serve?'
translation:
  language: pt
  text: '[Eles são um engano][a] para os que os fazem e confusão de coração para os que os adoram. Não os adore”. Seu pai lhe disse: “Eu também sei disso, meu filho, mas o que posso fazer diante de um povo que me obrigou a servir?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes retomam o pensamento do versículo anterior; literalmente, esta frase começa com “para os que os fazem”.
    reason: O início do versículo depende sintaticamente do contexto anterior, e a complementação editorial deve ficar explícita.
  - marker: b
    text: 'Ou: “que me obrigou a obedecer?”'
    reason: O verbo ge’ez pode significar servir, obedecer ou submeter-se.
lexical_decisions:
- source_word: ከሕተት፡ ልብ
  choice: confusão de coração
  rationale: Mantém a expressão antropológica do ge’ez, na qual o coração representa o entendimento e a disposição interior, sem reduzir seu sentido a mera confusão mental.
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: os adoram / Não os adore
  rationale: Traduz de modo direto o verbo de culto e conserva a mudança do plural relativo para a proibição dirigida no singular ao filho.
- source_word: እትአዘዝ
  choice: servir
  rationale: O verbo pode expressar obedecer, submeter-se ou servir. Neste contexto de pressão social e serviço aos ídolos, “servir” oferece uma formulação natural sem acrescentar um objeto ausente no texto.
theological_decisions:
- issue: Complemento subentendido no início do versículo
  choice: '[Eles são um engano]'
  alternative: A vergonha pertence aos que os fazem
  rationale: O ge’ez começa com “para os que os fazem”, continuando sintaticamente o pensamento do versículo anterior. A complementação entre colchetes explicita essa continuidade sem introduzir o conceito de “vergonha”, ausente desta cláusula.
- issue: Natureza da submissão do pai ao povo
  choice: me obrigou a servir
  alternative: me obrigou a obedecer
  rationale: “Servir” se ajusta ao contexto idolátrico, mas a nota preserva o valor possível de obediência ou submissão e evita identificar de forma indevida um cargo religioso específico.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se “coração” por sua importância conceitual no texto antigo; a fala familiar usa “meu filho” e construção corrente, sem coloquialismo excessivo.
