  text: two weeks of years[a]. And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains. And he was there alone, sitting and observing, and a word came into his heart, and he said[a], “All the signs of the stars and their signs...
translation:
  language: pt
  text: 'Duas semanas de anos.[a] No quinto ano da sexta semana, Abrão ficou acordado durante a noite, no início do sétimo mês,[b] observando as estrelas desde o anoitecer até o amanhecer, para ver como seria o ano quanto às chuvas. Ele estava ali sozinho, sentado e observando, quando uma palavra lhe veio ao coração, e ele disse: “Todos os sinais das estrelas e seus sinais...”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “semana” é uma forma de contar um período de sete anos. Jubileus costuma calcular o tempo por jubileus, semanas e anos.
    reason: cultural_note
  - marker: b
    text: A expressão também pode ser entendida mais especificamente como o surgimento da lua, possivelmente indicando o começo do sétimo mês por ocasião da lua nova.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: semanas de anos
  rationale: Reproduz a expressão cronológica do texto, em que cada “semana” corresponde a sete anos, sem substituir a imagem pelo total numérico.
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: no início do sétimo mês
  rationale: Oferece uma formulação natural em português para a expressão ligada ao surgimento da lua/mês, enquanto a nota preserva a possibilidade mais específica de lua nova.
- source_word: ያበይነ፡ ከዋክብተ
  choice: observando as estrelas
  rationale: Expressa a atividade prolongada de examinar os astros no contexto da vigília noturna.
- source_word: ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት
  choice: para ver como seria o ano quanto às chuvas
  rationale: Mantém a referência à natureza ou ao comportamento esperado do ano em relação às chuvas, em linguagem clara e sem acrescentar uma teoria astrológica.
- source_word: መጽአ፡ ውስተ፡ ልቡ፡ ቃል
  choice: uma palavra lhe veio ao coração
  rationale: Conserva a imagem semítica do coração como sede do pensamento ou percepção, sem decidir se a palavra foi interior, revelada ou inspirada.
- source_word: ኵሉ፡ ተአምረ፡ ከዋክብት፡ ወተአምራሁ
  choice: Todos os sinais das estrelas e os sinais delas...
  rationale: Preserva a repetição do texto ge'ez e o caráter incompleto da fala no limite fornecido do versículo, em vez de eliminar ou completar conjecturalmente a frase.
theological_decisions:
- issue: Natureza da palavra que veio ao coração de Abrão
  choice: uma palavra lhe veio ao coração
  alternative: Deus pôs uma palavra no coração dele
  rationale: O texto não identifica explicitamente a origem da palavra; a tradução mantém essa ambiguidade e evita acrescentar uma atribuição divina.
- issue: Observação das estrelas e previsão das chuvas
  choice: observando as estrelas... para ver como seria o ano quanto às chuvas
  alternative: praticando astrologia para prever as chuvas
  rationale: A tradução descreve apenas a ação e o propósito declarados, sem impor uma classificação teológica ou cultural que o versículo não explicita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente naturalizada, mas conservaram-se a cronologia técnica, a imagem de uma palavra vindo ao coração e a repetição final do ge'ez. Os marcadores foram distinguidos como [a] e [b], corrigindo a duplicação presente na camada inglesa.
