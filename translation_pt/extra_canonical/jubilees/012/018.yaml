  text: He causes it to rain in the morning and in the evening; and if he wills, he does not make it come down. And everything is in his hand." And he prayed
translation:
  language: pt
  text: Ele faz chover de manhã e à noite; e, se quiser, não a faz cair. Tudo está em sua mão”. E ele orou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዘንም
  choice: Ele faz chover
  rationale: O verbo afirma diretamente que ele causa a chuva; não há condição nesta primeira oração.
- source_word: ነግሀ፡ ወሰርከ
  choice: de manhã e à tarde
  rationale: Expressa naturalmente em português os dois períodos do dia indicados pelo ge’ez.
- source_word: ወእመ፡ ፈቀደ፡ ኢያወርድ
  choice: e, se quiser, não faz a chuva cair
  rationale: Mantém a condição ligada apenas à retenção da chuva e explicita o referente implícito do verbo para dar clareza em português.
- source_word: ወኵሉ፡ ውስተ፡ እዴሁ
  choice: Tudo está em sua mão
  rationale: Preserva a imagem semítica da mão singular como expressão de poder e domínio.
- source_word: ወጸለየ
  choice: E ele orou
  rationale: Traduz a oração final presente no segmento fornecido, embora ela dê início à ação narrativa seguinte.
theological_decisions:
- issue: Soberania divina sobre a chuva
  choice: Preservar tanto a ação afirmativa de fazer chover quanto a liberdade de reter a chuva
  alternative: Acrescentar “se quiser” também à primeira oração
  rationale: No texto ge’ez, a expressão condicional aparece somente antes da oração negativa; estendê-la à primeira oração alteraria a sintaxe da fonte.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e ampla compreensão internacional. A formulação conserva a imagem tradicional de algo estar “em sua mão” e mantém “E ele orou” porque essas palavras integram o segmento-fonte fornecido.
