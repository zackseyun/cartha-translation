  text: before them? And if I speak the truth to them, they will kill me, for their souls cling to them.
translation:
  language: pt
  text: diante deles? E, se eu lhes disser a verdade[a], eles me matarão, pois as almas deles estão apegadas a eles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «falar-lhes da justiça».'
    reason: Preserva o valor possível de ጽድቀ como «justiça/retidão», em vez de apenas «verdade».
lexical_decisions:
- source_word: ጽድቀ
  choice: a verdade
  rationale: Embora o substantivo possa significar «justiça», no contexto de falar algo que provoca hostilidade, «dizer a verdade» é a expressão portuguesa mais natural, sem eliminar a alternativa lexical, registrada em nota.
- source_word: ተለውት፡ ነፍሶሙ፡ ኀቤሆሙ
  choice: a alma deles está apegada a esses deuses
  rationale: Expressa de modo corrente a ideia de apego ou adesão interior. O referente masculino plural remete, pelo contexto, aos deuses/ídolos mencionados anteriormente.
theological_decisions:
- issue: Referente do pronome plural final
  choice: esses deuses
  alternative: eles
  rationale: O português exige maior clareza para evitar que «eles» pareça referir-se às pessoas. A explicitação contextual não introduz uma distinção doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural. O fragmento inicial mantém o ponto de interrogação porque o versículo começa no meio de uma fala iniciada no contexto anterior.
