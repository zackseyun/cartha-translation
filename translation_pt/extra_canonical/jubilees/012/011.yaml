translation:
  language: pt
  text: de Ló.[a] E Naor, irmão dele, tomou uma mulher para si.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Estas palavras completam a frase iniciada no versículo anterior: “deu-lhe o nome de Ló”.'
    reason: A divisão dos versículos separa uma única construção sintática; a nota impede que o início fragmentário seja entendido como uma oração independente.
lexical_decisions:
- source_word: ስሞ፡ ሎጥ
  choice: de Ló
  rationale: A expressão significa literalmente “seu nome, Ló”, mas completa sintaticamente o verbo “chamou/deu o nome” no fim do versículo anterior. “de Ló” produz em português a construção natural “deu-lhe o nome de Ló” sem transformar o fragmento em uma oração independente.
- source_word: እኁሁ
  choice: irmão dele
  rationale: Mantém explícita a relação indicada pelo sufixo possessivo, evitando que “seu irmão” tenha referente ambíguo em português.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: tomou uma mulher para si
  rationale: Reproduz a formulação matrimonial do texto, incluindo o valor reflexivo de ሎቱ (“para si”), sem acrescentar informação ausente da fonte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. Conserva-se o caráter formular de “tomou uma mulher para si”, enquanto o início é vertido segundo a sintaxe que atravessa a divisão entre os versículos 10 e 11.
