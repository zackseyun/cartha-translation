  yaml_path: translation/extra_canonical/jubilees/012/023.yaml
  text: And I will make your name great, and you will be blessed in the earth, and in you all the nations of the earth will be blessed. And those who bless you I will bless, and those who curse you I will curse.
translation:
  language: pt
  text: E engrandecerei o seu nome, e você será abençoado na terra; e em você serão abençoadas todas as nações da terra. Abençoarei os que o abençoarem e amaldiçoarei os que o amaldiçoarem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐቢ፡ ስመከ
  choice: E engrandecerei o seu nome
  rationale: Reproduz diretamente a ideia de tornar grande o nome, sem acrescentar a bênção inicial ausente no texto ge'ez apresentado.
- source_word: ትከውን፡ ቡሩከ
  choice: você será abençoado
  rationale: Mantém a construção passiva do texto-fonte e seu sentido direto.
- source_word: ውስተ፡ ምድር
  choice: na terra
  rationale: Preserva a formulação espacial do ge'ez, sem substituí-la por uma expressão mais interpretativa.
- source_word: ይትባረኩ፡ ብከ
  choice: em você serão abençoadas
  rationale: Mantém tanto a preposição instrumental/relacional tradicionalmente vertida por “em” quanto a voz passiva, preservando a possível amplitude da frase.
- source_word: ኵሎሙ፡ አሕዛበ፡ ምድር
  choice: todas as nações da terra
  rationale: Equivalência natural e consolidada para a expressão coletiva universal do texto.
- source_word: ይረግሙከ / እረግሞሙ
  choice: o amaldiçoarem / amaldiçoarei
  rationale: Conserva a correspondência verbal enfática entre a ação humana e a resposta divina.
theological_decisions:
- issue: Sentido de “em você serão abençoadas”
  choice: Preservar a forma passiva e a expressão “em você”
  alternative: “por meio de você receberão bênção” ou “abençoarão a si mesmas por você”
  rationale: O texto permite tensão quanto ao modo preciso da bênção; a tradução não deve decidir silenciosamente entre leitura passiva, mediadora ou reflexiva.
- issue: Ausência de uma promessa inicial de bênção direta
  choice: Não acrescentar “eu o abençoarei” no início
  alternative: Incluir a frase por harmonização com tradições textuais paralelas
  rationale: A fonte ge'ez fornecida começa com a promessa de engrandecer o nome; acrescentar uma oração ausente não seria justificado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O pronome “você” torna a referência singular explícita e natural; a repetição de “abençoar” e “amaldiçoar” preserva o paralelismo solene do original.
