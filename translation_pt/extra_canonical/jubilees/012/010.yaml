lexical_decisions:
- source_word: ብእሲተ
  choice: esposa
  rationale: No contexto das fórmulas matrimoniais, o substantivo tem o sentido de mulher tomada em casamento; “esposa” comunica isso de modo natural e inequívoco em português atual.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: tomou para si uma esposa
  rationale: Preserva a construção reflexiva e a fórmula matrimonial do ge'ez sem tornar a ordem sintática artificial em português.
- source_word: ወለደት፡ ሎቱ፡ ወልደ
  choice: ela lhe deu à luz um filho
  rationale: Reproduz tanto o objeto indireto “lhe” quanto a expressão de nascimento, em formulação idiomática portuguesa.
- source_word: ወጸውዐ
  choice: ele lhe deu o nome de
  rationale: Neste contexto, o verbo introduz uma fórmula de nomeação. A redação mantém deliberadamente a frase incompleta no ponto em que termina o versículo fornecido.
