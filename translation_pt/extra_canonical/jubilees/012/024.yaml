  yaml_path: translation/extra_canonical/jubilees/012/024.yaml
  text: And I will be God to you and to your son and to your son's son and to all your seed. Do not fear from now and unto all the generations of the earth; I am your God." And he said to me,
translation:
  language: pt
  text: '“E eu serei Deus para você, para o seu filho, para o filho do seu filho e para toda a sua descendência. Não tenha medo, desde agora e até todas as gerações da terra[a]; eu sou o seu Deus.” E ele me disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “desde agora, por todas as gerações da terra”. O texto diz literalmente “e até todas as gerações da terra”.'
    reason: A construção temporal é incomum em português e pode ter sentido distributivo, mas não contém uma palavra explícita para “para sempre”.
lexical_decisions:
- source_word: አምላከ (ʾamlāka)
  choice: Deus
  rationale: 'O substantivo funciona como predicativo na promessa: “serei Deus para você”; a escolha preserva a formulação pactual sem acrescentar títulos ausentes.'
- source_word: ዘርእከ (zarʾaka)
  choice: toda a sua descendência
  rationale: O termo coletivo designa a linhagem ou posteridade; “descendência” é natural em português e não exige um plural artificial.
- source_word: ኢትፍራህ (ʾitəfrāh)
  choice: Não tenha medo
  rationale: Imperativo negativo singular, dirigido ao interlocutor; esta é a forma corrente e digna em português.
- source_word: ወእስከ (wa-ʾəska)
  choice: e até
  rationale: Reproduz diretamente a conjunção e a preposição de limite, sem inserir “para sempre”, expressão que não consta do texto geʽez.
- source_word: ወይቤለኒ (wayəbelanni)
  choice: E ele me disse
  rationale: Mantém o sujeito pronominal implícito e o objeto “me”, sem acrescentar “o Senhor Deus”.
theological_decisions:
- issue: Alcance temporal da exortação
  choice: “desde agora e até todas as gerações da terra”
  alternative: “desde agora, por todas as gerações da terra”
  rationale: A tradução principal conserva o valor limítrofe de እስከ (“até”) e evita introduzir a ideia explícita de “para sempre”; a nota registra a leitura idiomática possível sem decidir silenciosamente a tensão.
- issue: Identidade do falante na frase final
  choice: “ele”
  alternative: “o Senhor Deus”
  rationale: O geʽez traz apenas a forma verbal “disse” com sujeito masculino implícito; nomear o falante acrescentaria conteúdo não expresso neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A repetição “seu filho… filho do seu filho” foi mantida por refletir a progressão geracional do original. Os dois-pontos finais preservam a frase aberta que continua no contexto seguinte.
