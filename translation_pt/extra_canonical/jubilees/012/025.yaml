base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/025.yaml
  text: 'The Lord God [said]: ''Open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.''[a]'
translation:
  language: pt
  text: 'O Senhor Deus [disse]: “Abre-lhe a boca e os ouvidos, para que ele ouça e fale com a boca na língua que foi revelada, pois ela deixou de ser falada por todos os filhos dos homens desde o dia da queda.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase final provavelmente se refere à perda da língua primordial depois do juízo ligado a Babel. A formulação ge’ez é concisa: “desde o dia da queda”.'
    reason: cross_reference
lexical_decisions:
- source_word: ፍታሕ
  choice: Abre
  rationale: Imperativo na segunda pessoa do singular, dirigido ao agente que deve abrir a boca e os ouvidos dele.
- source_word: በልሳን፡ እንተ፡ ታስተርኢ
  choice: na língua que foi revelada
  rationale: Mantém a referência a uma língua específica e o valor passivo da expressão, sem identificar além do que o texto declara.
- source_word: አዐረፈ፡ እምአፈ
  choice: desapareceu da boca
  rationale: Expressa de modo natural que a língua deixou de ser falada; a imagem da boca é preservada.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Conserva a expressão coletiva tradicional e abrangente do texto-fonte.
- source_word: ዕለተ፡ ድቀት
  choice: dia da queda
  rationale: Tradução formal da expressão comprimida, preservando sua possível alusão sem explicá-la no corpo do texto.
theological_decisions:
- issue: Abertura da fala e sujeito do imperativo
  choice: 'O Senhor Deus [disse]: “Abre-lhe...”'
  alternative: Que o Senhor Deus lhe abra...
  rationale: ፍታሕ é um imperativo de segunda pessoa; o verbo “disse”, necessário para apresentar a ordem no contexto narrativo, não consta no trecho ge'ez fornecido e por isso aparece entre colchetes.
- issue: Identificação do “dia da queda”
  choice: Manter “dia da queda” no texto e explicar apenas como provável alusão na nota
  alternative: dia da confusão de Babel
  rationale: O texto não nomeia Babel explicitamente; a formulação preserva a tensão e evita transformar uma interpretação contextual em tradução.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Abre-lhe” preserva o imperativo e explicita naturalmente que boca e ouvidos pertencem à pessoa mencionada. “Com a própria boca” evita uma repetição pesada sem apagar a ênfase do original. O único marcador, [a], aparece ao fim da frase a que a nota se refere.
