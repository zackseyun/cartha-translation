lexical_decisions:
- source_word: ከመ፡ ያድኅኖሙ፡
  choice: para salvá-los
  rationale: Expressa a finalidade e preserva o objeto pronominal plural do ge'ez.
- source_word: ወነደደ፡ እሳት፡ ላዕሌሁ፡
  choice: então, acendeu-se fogo sobre ele
  rationale: Mantém a imagem passiva/incoativa do fogo que se acende e conserva literalmente a relação espacial «sobre ele», sem substituí-la por uma interpretação.
- source_word: ወውዐየ፡ በእሳት፡
  choice: e ele foi queimado pelo fogo
  rationale: Conserva a formulação passiva e a repetição de «fogo» presente na fonte; «pelo fogo» é idiomático em português e comunica o meio ou agente.
- source_word: በኡር፡ ዘከለዳዊያን፡
  choice: em Ur dos caldeus
  rationale: Emprega a forma geográfica tradicional e amplamente reconhecida em português.
