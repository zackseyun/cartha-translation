  yaml_path: translation/extra_canonical/jubilees/012/019.yaml
  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
translation:
  language: pt
  text: 'E naquela noite ele disse: “Meu Deus, Deus Altíssimo, somente tu és Deus para mim. Tu criaste todas as coisas, e tudo o que existe é obra de tuas mãos. Escolhi a ti e ao teu domínio[a]; salva-me.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma impressa no texto etíope parece conter um erro. A leitura corrigida significa “teu domínio” ou “teu governo”; a forma tal como impressa também já foi entendida como “teu louvor”.
    reason: Registra uma dificuldade textual real e preserva transparência quanto à alternativa encontrada na história da tradução.
lexical_decisions:
- source_word: አምላከ፡ ልዑል
  choice: Deus Altíssimo
  rationale: Reproduz de modo natural e tradicional o título divino, preservando sua força superlativa.
- source_word: አንተ፡ ባሕቲትከ፡ ሊተ፡ አምላክ
  choice: somente tu és Deus para mim
  rationale: Mantém tanto a exclusividade expressa por ባሕቲትከ quanto a relação pessoal indicada por ሊተ.
- source_word: ኵሎ፡ ፈጠርከ
  choice: Tu criaste todas as coisas
  rationale: Traduz a afirmação abrangente da criação sem acrescentar especificações ausentes no texto.
- source_word: ግብረ፡ እደዊከ፡ ኵሉ፡ ኮነ፡ ዘሀሎ
  choice: tudo o que existe é obra de tuas mãos
  rationale: Expressa em português claro a relação entre tudo quanto existe e a obra das mãos de Deus.
- source_word: ወመሰክንከ
  choice: e o teu domínio
  rationale: A forma transmitida na edição parece refletir um erro textual ou tipográfico por ወመኰንንከ, leitura que significa 'e o teu domínio/governo' e é apoiada pela tradição crítica.
- source_word: አድኅነኒ
  choice: salva-me
  rationale: Verte diretamente a petição final, com a amplitude do verbo sem restringi-lo a um tipo específico de livramento.
theological_decisions:
- issue: Exclusividade da confissão dirigida ao Deus Altíssimo
  choice: somente tu és Deus para mim
  alternative: tu somente és o meu Deus
  rationale: A escolha conserva a formulação relacional 'para mim' sem transformar a frase em uma declaração metafísica mais abrangente do que a sintaxe exige.
- issue: Objeto escolhido junto com Deus
  choice: o teu domínio
  alternative: o teu louvor
  rationale: A leitura 'domínio' decorre da provável correção textual reconhecida no testemunho editorial; 'louvor' tenta interpretar a forma defeituosa, mas tem apoio lexical inferior.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível e vocabulário bíblico amplamente compreensível. A repetição de “Deus” e a linguagem de “obra de tuas mãos” foram mantidas por seu peso retórico e teológico.
