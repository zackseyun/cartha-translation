  terminology: '«Espíritos malignos», «coração humano», «seguir-te» e «descendência» são escolhas adequadas, sem impor interpretação doutrinária. Não se deve introduzir «diante de ti»: o pronome ኪያየ significa «a mim», não contém essa noção.'
