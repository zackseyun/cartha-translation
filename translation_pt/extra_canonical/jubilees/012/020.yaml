  yaml_path: translation/extra_canonical/jubilees/012/020.yaml
  text: Deliver me from the hand of evil spirits that rule over the thoughts of the heart of man, and do not let them lead me astray from following you, my God. And establish me and my seed forever, so that we may not go astray from now and forever." And he said,
translation:
  language: pt
  text: 'Livra-me da mão dos espíritos malignos que dominam os pensamentos do coração humano, e não permitas que eles me desviem de seguir-te, meu Deus. Firma-me, a mim e à minha descendência, para sempre, para que não nos desviemos desde agora e para sempre”. E ele disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምእዴ፡ መናፍስት፡ እኩያን
  choice: das mãos dos espíritos malignos
  rationale: Reproduz a expressão de libertação com እድ (“mão”, aqui no plural contextual) e traduz እኩያን de modo natural como “malignos”.
- source_word: ይስልጡ
  choice: dominam
  rationale: Expressa o sentido de exercer domínio ou poder, sem acrescentar uma explicação teológica.
- source_word: ውስተ፡ ሕሊና፡ ልበ፡ ሰብእ
  choice: os pensamentos do coração humano
  rationale: Mantém a antropologia idiomática do texto, em que o coração é o âmbito do pensamento, com formulação clara em português atual.
- source_word: ወአይስሕቱኒ፡ እምድኅሬከ
  choice: e não permitas que eles me desviem de seguir-te
  rationale: A construção indica ser desviado de ir após Deus; “seguir-te” comunica naturalmente esse sentido relacional.
- source_word: ወትረሰየኒ፡ ኪያየ፡ ወዘርእየ
  choice: Firma a mim e à minha descendência
  rationale: ኪያየ é o pronome acusativo independente “a mim”, em aposição ao sufixo verbal, e introduz o objeto composto “a mim e à minha descendência”; não significa “diante de ti”.
- source_word: ለዓለም ... እስከ፡ ለዓለም
  choice: para sempre ... por toda a eternidade
  rationale: Variação idiomática em português para as duas expressões durativas, preservando sua força enfática.
theological_decisions:
- issue: Agência dos espíritos malignos e proteção divina
  choice: “não permitas que eles me desviem”
  alternative: “que eles não me desviem”
  rationale: A formulação portuguesa torna inteligível a oração dirigida a Deus sem negar a agência atribuída aos espíritos no texto.
- issue: Identidade da “descendência”
  choice: Manter o termo coletivo e não especificar filhos ou linhagem particular
  alternative: “meus filhos”
  rationale: O termo ዘርእ é amplo e pode designar semente, prole ou descendência; “descendência” preserva essa extensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conserva a imagem bíblica do coração como sede dos pensamentos e a transição narrativa incompleta “E ele disse:”, que liga o versículo ao seguinte.
