base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/012/005.yaml
  text: There is no spirit in them, because they are the work of hands; and you carry them on your shoulders, and from them there is no help for you, except great shame.
translation:
  language: pt
  text: Não há espírito neles, pois são obra de mãos. Vocês os carregam nos ombros, e deles não recebem ajuda alguma, a não ser grande vergonha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈስ (manfas)
  choice: espírito
  rationale: Preserva o sentido direto do termo, que pode abranger espírito, sopro ou princípio vital, sem reduzir a afirmação apenas à falta de respiração.
- source_word: ግብረ፡ እደው (gabra ʾedaw)
  choice: obra de mãos humanas
  rationale: Expressa naturalmente em português a ideia de objetos produzidos por mãos, deixando claro o contraste entre ídolos fabricados e seres dotados de espírito.
- source_word: መታክፍቲሆሙ (matākəftihomu)
  choice: nos ombros
  rationale: 'Segue o sentido anatômico concreto do texto: os próprios adoradores precisam carregar os ídolos.'
- source_word: ረድኤት (rədaʾet)
  choice: ajuda
  rationale: Equivalente comum e direto para auxílio ou socorro.
- source_word: ሐሳር፡ ዐቢይ (ḥasār ʿabiy)
  choice: grande vergonha
  rationale: Reproduz a combinação de desonra/vergonha com o qualificativo 'grande' em linguagem corrente e digna.
theological_decisions:
- issue: Natureza da ausência atribuída aos ídolos
  choice: “Não há espírito neles”
  alternative: “Eles não têm vida” ou “não há sopro neles”
  rationale: A tradução mantém a formulação do texto-fonte e sua possível amplitude sem convertê-la numa explicação teológica mais estreita.
- issue: Resultado de buscar ajuda nos ídolos
  choice: “a não ser grande vergonha”
  alternative: “mas somente grande humilhação”
  rationale: 'Mantém a construção forte e paradoxal do original: em vez de auxílio, o único resultado é vergonha.'
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A segunda pessoa do plural foi vertida por “vocês”, forma amplamente compreensível e natural. Não se acrescentou a ideia de que os ídolos são “um peso”, pois ela não está expressa no texto ge’ez.
