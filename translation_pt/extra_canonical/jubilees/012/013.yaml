  text: And they arose in the night and wanted to rescue their gods from the midst of the fire. And Haran rushed
translation:
  language: pt
  text: E eles se levantaram à noite e quiseram salvar seus deuses do meio do fogo. E Harã se precipitou[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Harã correu”. Esta cláusula parece iniciar a ação que continua no versículo seguinte.'
    reason: Registra uma alternativa adequada para o verbo ge'ez ሰረረ e informa, sem acrescentar conteúdo à tradução, que a cláusula final pode refletir uma divisão de versículos problemática.
lexical_decisions:
- source_word: ያድኅኑ
  choice: salvar
  rationale: O verbo expressa livrar ou resgatar; “salvar” é natural em português e preserva a ironia contextual de humanos tentarem salvar seus próprios deuses.
- source_word: አማልክቲሆሙ
  choice: seus deuses
  rationale: Tradução direta do plural com sufixo possessivo.
- source_word: ወሰረረ
  choice: correu para lá
  rationale: O verbo indica movimento rápido, como correr, precipitar-se ou lançar-se. A locução mantém o sentido direcional sugerido pelo contexto sem afirmar explicitamente que Harã entrou no fogo.
- source_word: አራን
  choice: Harã
  rationale: Forma portuguesa tradicional do nome bíblico correspondente ao ge'ez አራን.
theological_decisions:
- issue: Ironia de pessoas salvarem seus deuses
  choice: “salvar seus deuses”
  alternative: “resgatar seus deuses”
  rationale: 'A formulação conserva sem suavização a tensão teológica do texto: os adoradores procuram salvar as divindades que veneram.'
- issue: Destino do movimento de Harã
  choice: “correu para lá” com nota
  alternative: “lançou-se” ou “correu para o fogo”
  rationale: O fragmento ge'ez termina após o verbo e o nome, sem explicitar aqui o destino ou o resultado; evita-se completar silenciosamente a ação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Mantém a coordenação repetida do original e não completa a ação truncada além do que o contexto imediato permite.
