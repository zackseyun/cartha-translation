translation:
  language: pt
  text: diante dos meus olhos. Esconderei deles o meu rosto e os entregarei nas mãos das nações, para o cativeiro, o saque e a devoração. Eu os arrancarei[a] do meio da terra e os dispersarei entre as nações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eliminarei”.'
    reason: O verbo pode indicar erradicar, arrancar ou eliminar; o texto principal privilegia a imagem de desarraigar da terra.
lexical_decisions:
- source_word: አኀብእ ገጽየ
  choice: Esconderei deles o meu rosto
  rationale: Reproduz de modo natural a expressão semítica de retirada do favor ou da presença, sem explicitar além do texto.
- source_word: ውስተ እደ አሕዛብ
  choice: nas mãos das nações
  rationale: Conserva a metáfora tradicional de sujeição ao poder de outros povos.
- source_word: ለፂዋዌ ወለኀብለ ወለተበልዖ
  choice: para o cativeiro, o saque e a devoração
  rationale: Mantém a tríade e a intensidade da fonte; 'devoração' preserva a imagem forte sem reduzi-la a mera destruição.
- source_word: አቤስሎሙ
  choice: os arrancarei
  rationale: Expressa a força de erradicar ou desarraigar do meio da terra e soa mais natural no contexto agrícola do que 'removerei'.
- source_word: እዘርዎሙ
  choice: os dispersarei
  rationale: Verbo corrente e digno para espalhar um povo entre as nações.
theological_decisions:
- issue: Sentido de esconder o rosto
  choice: Preservar a expressão figurada 'Esconderei deles o meu rosto'
  alternative: Explicitar como abandono ou retirada da proteção divina
  rationale: A fonte deixa que a metáfora carregue suas próprias implicações teológicas; explicitá-las resolveria indevidamente sua amplitude.
- issue: Imagem de devoração
  choice: Manter 'devoração'
  alternative: Traduzir como 'destruição'
  rationale: A formulação concreta e violenta pertence à retórica do juízo e não deve ser suavizada.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A abertura fragmentária foi mantida porque o versículo começa em continuação direta do anterior.
