  text: 'um coração puro e um espírito santo, e não deixes que se enredem em seus pecados, desde agora e para sempre.” E o SENHOR disse a Moisés: “Eu conheço a obstinação deles, seus pensamentos e sua dura cerviz, e eles não escutarão'
