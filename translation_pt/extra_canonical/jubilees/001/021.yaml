lexical_decisions:
- source_word: ልበ፡ ንጹሐ፡
  choice: um coração puro
  rationale: Reproduz diretamente o sintagma etíope, com linguagem bíblica clara e natural em português.
- source_word: መንፈሰ፡ ቅዱሰ፡
  choice: um espírito santo
  rationale: Mantém o sentido comum de um espírito caracterizado pela santidade, sem impor aqui uma identificação trinitária que o contexto não explicita.
- source_word: ይትዐቀጹ፡
  choice: se enredem
  rationale: Expressa a imagem de ficar preso ou enlaçado pelo pecado, preservando a força metafórica do verbo.
- source_word: ተዋሥኦቶሙ፡
  choice: a obstinação deles
  rationale: Comunica a disposição de oposição ou resistência indicada pelo termo, de modo inteligível e sem restringi-la a uma forma específica de rebelião.
- source_word: ሕሊናሆሙ፡
  choice: seus pensamentos
  rationale: Equivalente natural para a atividade interior, intenção ou pensamento do povo neste contexto.
- source_word: ይቡሰ፡
  choice: sua dura cerviz
  rationale: Conserva a imagem tradicional da rigidez do pescoço, associada à resistência e à teimosia, em vez de dissolvê-la numa paráfrase.
theological_decisions:
- issue: Sentido de “espírito santo”
  choice: um espírito santo
  alternative: o Espírito Santo
  rationale: O sintagma ocorre em paralelo com “um coração puro” e não traz, por si só, artigo ou indicação inequívoca de referência pessoal; a tradução preserva essa abertura sem negar possíveis ecos teológicos.
- issue: Relação entre ação divina e responsabilidade humana diante do pecado
  choice: não deixes que se enredem em seus pecados
  alternative: que não sejam enredados por seus pecados
  rationale: A formulação acompanha o pedido dirigido a Deus e mantém simultaneamente a ação protetora divina e o vínculo dos pecados com o próprio povo, sem elaborar além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Preservou-se a expressão bíblica “dura cerviz” por seu valor imagético; o trecho permanece aberto no final porque a unidade fornecida termina no meio da fala.
