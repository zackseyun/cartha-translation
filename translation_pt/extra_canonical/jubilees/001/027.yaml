  text: And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst forever and ever, and the Lord will appear to the eyes of all.”
translation:
  language: pt
  text: 'E ele disse ao anjo da presença: “Escreva para Moisés desde o princípio da criação até o tempo em que o meu santuário for construído no meio deles para todo o sempre, e o Senhor aparecer aos olhos de todos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: anjo da presença
  rationale: Reproduz de modo natural o título etíope, literalmente associado à face/presença, sem explicitar uma interpretação além do texto.
- source_word: እምቀዳሚ፡ ፍጥረት
  choice: desde o princípio da criação
  rationale: Conserva o alcance temporal e a formulação solene do original.
- source_word: ለዓለመ፡ ዓለማት
  choice: para todo o sempre
  rationale: Expressão portuguesa corrente e digna para a fórmula intensiva de duração perpétua.
- source_word: ለዐይን፡ ኵሉ
  choice: aos olhos de todos
  rationale: Mantém a imagem visual explícita e a abrangência universal do original.
theological_decisions:
- issue: Alternância entre primeira e terceira pessoa na fala divina
  choice: “meu santuário” e “o Senhor aparecer”
  alternative: Uniformizar como “meu santuário” e “eu aparecerei”
  rationale: Preserva a mudança de pessoa presente no texto-fonte, sem corrigir nem harmonizar a tensão retórica.
- issue: Sentido de መልአከ፡ ገጽ
  choice: anjo da presença
  alternative: anjo da face
  rationale: “Presença” comunica em português o valor idiomático do título, enquanto “face” seria excessivamente literal e menos natural.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe acompanha o fluxo do original sem sacrificar a naturalidade; não foram necessárias notas de rodapé.
