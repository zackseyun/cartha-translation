  text: A glória do Senhor estava sobre o monte Sinai, e a nuvem o cobriu por seis dias. E ele o chamou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር፡
  choice: A glória do Senhor
  rationale: Reproduz a expressão nominal etíope de modo tradicional, claro e teologicamente neutro.
- source_word: ውስተ፡ ደብረ፡ ሲና፡
  choice: estava sobre o monte Sinai
  rationale: O texto apresenta uma construção elíptica; o verbo «estava» é suprido em português para formar uma oração natural sem acrescentar conteúdo.
- source_word: ወጸለሎ፡ ደመና፡
  choice: e a nuvem o cobriu
  rationale: Mantém a imagem da nuvem que cobre o monte e conserva o pronome objeto do texto-fonte.
- source_word: ስዱሰ፡ ዕለተ።
  choice: durante seis dias
  rationale: Expressa naturalmente em português a duração indicada pelo original.
- source_word: ወጸውዖ፡
  choice: Então ele o chamou
  rationale: Conserva os referentes pronominais implícitos e a continuação narrativa do fragmento, sem identificar além do que esta unidade textual explicita.
theological_decisions:
- issue: Identidade do sujeito e do objeto em «ele o chamou»
  choice: Manter ambos como pronomes
  alternative: Explicitar «o Senhor chamou Moisés»
  rationale: O fragmento etíope fornecido emprega formas pronominais e depende do contexto adjacente; explicitar os nomes resolveria uma referência que esta unidade não declara.
- issue: Natureza da glória do Senhor
  choice: Traduzir literalmente como «a glória do Senhor»
  alternative: Interpretar como uma manifestação específica ou como o próprio Senhor
  rationale: A formulação preserva a distinção e a tensão do texto sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação simples acompanha o ritmo narrativo do ge'ez; não foram acrescentadas notas porque as ambiguidades pronominais puderam ser preservadas diretamente no texto.
