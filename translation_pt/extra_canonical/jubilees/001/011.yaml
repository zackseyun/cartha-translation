  yaml_path: translation/extra_canonical/jubilees/001/011.yaml
  text: And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.
translation:
  language: pt
  text: E construirão para si lugares altos, bosques sagrados e imagens esculpidas; cada um se prostrará diante do seu próprio erro. Sacrificarão seus filhos aos demônios e a toda obra do erro de seu coração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐታተ
  choice: lugares altos
  rationale: No contexto cultual e em consonância com a antiga versão consultada, designa elevações ou santuários destinados ao culto.
- source_word: ወግልፎ
  choice: bosques sagrados
  rationale: A sequência enumera instalações e objetos cultuais; a tradução explicita o caráter religioso do bosque sem identificar indevidamente uma divindade específica.
- source_word: ስሒት / ስሕተት
  choice: erro / desvio
  rationale: Os termos pertencem ao campo semântico de errar, extraviar-se ou enganar-se. A variação portuguesa evita repetição pesada sem apagar a ligação conceitual.
- source_word: አጋንንት
  choice: demônios
  rationale: Equivalente corrente e direto para seres espirituais malignos no contexto de sacrifícios ilícitos.
- source_word: ልቦሙ
  choice: seu coração
  rationale: Preserva o singular coletivo semítico, referindo-se à disposição interior do povo.
theological_decisions:
- issue: Objeto da prostração idólatra
  choice: cada um se prostrará diante do seu próprio erro
  alternative: cada um adorará o seu próprio ídolo
  rationale: Mantém a formulação abstrata e teologicamente incisiva do texto, sem converter 'erro' em um objeto concreto não explicitado.
- issue: Relação entre demônios e obras do desvio
  choice: aos demônios e a toda obra do desvio de seu coração
  alternative: aos demônios, praticando toda obra do erro de seu coração
  rationale: Preserva a coordenação sintática e a ambiguidade do texto quanto a 'toda obra' funcionar como destinatário retórico ou como extensão da prática sacrificial.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. Mantiveram-se a imagem cultual de 'lugares altos', o paralelismo da enumeração e a tensão da expressão 'seu próprio erro'.
