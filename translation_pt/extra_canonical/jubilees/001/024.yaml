  yaml_path: translation/extra_canonical/jubilees/001/024.yaml
  text: And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.
translation:
  language: pt
  text: E as suas almas se apegarão a mim e a todos os meus mandamentos, e cumprirão os meus mandamentos. Eu serei o Pai deles, e eles serão meus filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሶሙ
  choice: a alma deles
  rationale: Mantém o singular coletivo do texto ge'ez, em vez de harmonizá-lo com o plural do contexto.
- source_word: ኀቤየ
  choice: a mim
  rationale: Expressa diretamente o movimento ou vínculo em direção ao locutor.
- source_word: ይገብሩ ... ትእዛዝየ
  choice: cumprirão os meus mandamentos
  rationale: Em português, «cumprir mandamentos» transmite naturalmente a ideia de pô-los em prática.
- source_word: እከውኖሙ አበ
  choice: serei Pai para eles
  rationale: Preserva a construção relacional do ge'ez e o título paterno sem acrescentar artigo possessivo.
- source_word: ይከውኑኒ ውሉደ
  choice: serão meus filhos
  rationale: Reproduz de modo idiomático a relação recíproca expressa no original.
theological_decisions:
- issue: Singular coletivo em «a alma deles»
  choice: Preservar o singular coletivo
  alternative: «as almas deles» ou «o coração deles»
  rationale: O texto fornecido traz ነፍሶሙ no singular com sufixo plural. A tradução conserva essa tensão gramatical sem reinterpretá-la.
- issue: Linguagem de filiação divina
  choice: «Eu serei Pai para eles, e eles serão meus filhos»
  alternative: «Eu me tornarei o Pai deles, e eles se tornarão meus filhos»
  rationale: A formulação escolhida mantém a afirmação relacional e evita sugerir uma mudança ontológica mais específica do que o texto exige.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com cadência bíblica moderada. O trecho fornecido em ge'ez continua depois de «filhos» («e todos serão chamados filhos do Deus vivo, e saberão...»), mas a tradução segue o recorte de Jubileus 1:24 apresentado pela camada inglesa auditada.
