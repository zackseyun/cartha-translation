  text: And I will send witnesses to them so that I may testify to them, but they will not listen; and they will also kill the witnesses, and they will drive away those who seek the law, and they will overturn everything and begin to do evil.
translation:
  language: pt
  text: E enviarei testemunhas a eles, para que eu lhes dê testemunho, mas não ouvirão; também matarão as testemunhas, expulsarão os que buscam a Lei, subverterão tudo e começarão a praticar o mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕተ
  choice: testemunhas
  rationale: O termo designa testemunhas e aparece novamente na oração em que elas são mortas; a repetição foi preservada.
- source_word: አስምዕ
  choice: testemunhe contra eles
  rationale: O causativo ligado à raiz de ouvir/testemunhar admite a ideia de dar testemunho ou fazer ouvir. No contexto de advertência e rejeição, 'testemunhe contra eles' expressa com naturalidade o valor judicial, sem eliminar totalmente a tensão do texto.
- source_word: ሕገ
  choice: a Lei
  rationale: Traduz 'lei' em sentido definido, provavelmente a Lei divina no contexto; a inicial maiúscula sinaliza esse referente sem acrescentar especificação denominacional.
- source_word: ያፀርዑ
  choice: transtornarão
  rationale: Mantém a noção forte de virar, subverter ou desordenar tudo, sem especificar além do texto.
- source_word: ይዌልእ፡ ለገቢረ፡ እኩይ
  choice: começarão a praticar o mal
  rationale: Reproduz a construção incoativa e traduz o fazer do mal por uma expressão portuguesa corrente e digna.
theological_decisions:
- issue: Sentido da finalidade do envio das testemunhas
  choice: para que eu testemunhe contra eles
  alternative: para que eu lhes dê testemunho / para fazê-los ouvir
  rationale: A primeira pessoa do verbo foi preservada, atribuindo o testemunho a Deus por meio das testemunhas. 'Contra eles' se ajusta ao contexto de recusa, embora o texto também possa sugerir simplesmente testemunhar-lhes ou fazê-los ouvir.
translation_notes:
  register: Português moderno, claro e solene, com coordenação paralela das ações futuras. Preservou-se a repetição de 'testemunhas' e evitou-se ampliar o texto com identificações não explícitas.
