revisions:
- from: E enviarei testemunhas a eles, para que eu testemunhe contra eles, mas não ouvirão; também matarão as testemunhas, expulsarão os que buscam a Lei, transtornarão tudo e começarão a praticar o mal.
  to: E enviarei testemunhas a eles, para que eu lhes dê testemunho, mas não ouvirão; também matarão as testemunhas, expulsarão os que buscam a Lei, subverterão tudo e começarão a praticar o mal.
  rationale: A revisão elimina o acréscimo interpretativo “contra eles” e conserva a direção indicada no texto (“a eles”), sem decidir se o testemunho é formalmente acusatório. Também ajusta o verbo referente a “tudo” para uma formulação portuguesa mais próxima da ideia de derrubar ou virar completamente. Não são necessárias notas de rodapé.
