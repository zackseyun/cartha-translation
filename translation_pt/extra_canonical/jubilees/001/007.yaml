  yaml_path: translation/extra_canonical/jubilees/001/007.yaml
  text: and they will know that I have been with them. And you, write down for yourself all the words that I make known to you today, for I know their rebellion and their stiff neck before I bring them into the land that I swore to their fathers—to Abraham, Isaac, and Jacob—saying, ‘To your seed I will give the land that flows with milk and honey.’ And they will eat and be satisfied.
translation:
  language: pt
  text: 'e eles saberão que estive com eles. E você, escreva para si todas as palavras que hoje lhe dou a conhecer, pois conheço a rebeldia deles e a obstinação deles antes de fazê-los entrar na terra que prometi sob juramento aos seus pais — a Abraão, Isaque e Jacó — dizendo: “À descendência de vocês darei a terra que mana leite e mel.” Eles comerão e ficarão satisfeitos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመ፡ ሀለው፡ ኮንኩ፡ ምስሌሆሙ
  choice: que estive com eles
  rationale: Reproduz a afirmação simples de presença, sem acrescentar o intensificador ausente no ge’ez.
- source_word: ምረተሙ፡ ወክሳዶሙ፡ ደቡበ
  choice: a rebeldia deles e a sua obstinação
  rationale: O primeiro termo indica rebeldia; a expressão corporal relativa à rigidez do pescoço é vertida pelo idiomatismo português natural “obstinação”, sem perder seu sentido moral.
- source_word: መሐልኩ፡ ለአበዊሆሙ
  choice: prometi sob juramento aos seus pais
  rationale: Torna explícita a força do verbo de jurar, que em português exige uma formulação diferente de uma simples promessa.
- source_word: ለዘርእክሙ
  choice: À descendência de vocês
  rationale: “Descendência” preserva o valor coletivo de “semente” em português atual e o plural dos destinatários retomado no discurso.
- source_word: ትውሕዝ፡ ሐሊበ፡ ወመዓረ
  choice: mana leite e mel
  rationale: Mantém a conhecida imagem bíblica e expressa naturalmente a ideia de fluir abundantemente.
theological_decisions:
- issue: Natureza da presença divina
  choice: “estive com eles”
  alternative: “verdadeiramente estive com eles”
  rationale: O texto não contém intensificador; a tradução evita acrescentar uma qualificação teológica.
- issue: Referente de “pais”
  choice: “aos seus pais — a Abraão, Isaque e Jacó”
  alternative: “aos antepassados deles”
  rationale: Conserva a linguagem pactual de parentesco e a identificação explícita dada no texto.
- issue: “Semente” como coletivo
  choice: “descendência”
  alternative: “semente”
  rationale: Preserva o sentido coletivo sem impor uma leitura singular ou cristológica que o contexto imediato não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Usa “você” no discurso dirigido a Moisés e mantém a cadência bíblica sem literalismos pouco naturais.
