  text: And on the seventh day he called to Moses from the midst of the cloud, and the appearance of the glory of Yahweh was like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.
translation:
  language: pt
  text: No sétimo dia, ele chamou Moisés do meio da nuvem, e a aparência da glória de Yahweh era como fogo ardente no alto do monte.[a] Moisés permaneceu no monte quarenta dias e quarenta noites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e a glória de Yahweh apareceu como fogo ardente no alto do monte”.'
    reason: Registra a possível leitura verbal da expressão, em contraste com a leitura nominal adotada no texto.
lexical_decisions:
- source_word: ርእዩ
  choice: a aparência
  rationale: Preserva o valor nominal provável do termo no contexto teofânico e a formulação refletida em Êxodo 24:17, sem transformá-lo silenciosamente em verbo.
- source_word: ስብሐተ፡ እግዚአብሔር
  choice: a glória de Yahweh
  rationale: Traduz o substantivo como “glória” e representa o nome divino como “Yahweh”, em vez de substituí-lo por um título.
- source_word: እሳት፡ ዘያነድድ
  choice: fogo ardente
  rationale: Expressão portuguesa natural que mantém a imagem de um fogo que queima intensamente.
- source_word: ርእሰ፡ ደብር
  choice: no alto do monte
  rationale: Transmite de modo idiomático o sentido literal de “cabeça/topo do monte”.
theological_decisions:
- issue: Relação entre a glória divina e sua manifestação visível
  choice: “a aparência da glória de Yahweh era como”
  alternative: “a glória de Yahweh apareceu como”
  rationale: A opção principal mantém a distinção entre a glória de Yahweh e sua aparência, sem afirmar que a própria glória era literalmente fogo; a alternativa verbal permanece registrada em nota por causa da ambiguidade linguística.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. “Monte” foi preferido a “montanha” por sua familiaridade no registro bíblico sem perder ampla inteligibilidade.
