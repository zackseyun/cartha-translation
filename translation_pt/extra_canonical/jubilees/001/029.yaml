base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/029.yaml
  text: And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years from the time of creation, of the law and of the testimony, of the weeks of their jubilees, year by year in all their number, and the jubilees year by year, from the day of creation until the day when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of Yahweh is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel, and that it may be thus from that day and throughout all the days of the earth.
translation:
  language: pt
  text: E o anjo da presença, que ia adiante do acampamento de Israel, tomou as tábuas das divisões dos anos desde o tempo da criação, da lei e do testemunho, das semanas de seus jubileus, ano após ano, em toda a sua contagem, e dos jubileus, ano após ano, desde o dia da criação até o dia em que os céus, a terra e todas as suas criaturas serão renovados segundo os poderes do céu e segundo toda a criação da terra, até que o santuário de Yahweh seja criado em Jerusalém, no monte Sião, e todas as luzes sejam renovadas para a cura, a paz e a bênção de todos os escolhidos de Israel, e para que assim seja daquele dia em diante, por todos os dias da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: anjo da presença
  rationale: Reproduz a expressão técnica do texto etíope sem reduzi-la a uma interpretação como “anjo que está diante de Deus”.
- source_word: ትዕይንቶሙ፡ ለእስራኤል
  choice: acampamento de Israel
  rationale: Segue o sentido contextual de hoste ou acampamento de Israel e mantém linguagem natural em português.
- source_word: ጸላተ፡ ዘክፋሌ፡ ዓመታት
  choice: tábuas das divisões dos anos
  rationale: Conserva a terminologia calendárica característica de Jubileus e a imagem concreta de registros inscritos.
- source_word: እግዚአብሔር
  choice: Yahweh
  rationale: Neste contexto, representa o nome divino conforme a leitura textual adotada pela camada de consulta auditada, sem substituí-lo por um título genérico.
- source_word: ኵሉ፡ ብርሃናት
  choice: todas as luzes
  rationale: Mantém o referente amplo e potencialmente cósmico do original, sem especificar astros particulares.
theological_decisions:
- issue: Criação do santuário de Yahweh no monte Sião
  choice: “até que o santuário de Yahweh seja criado”
  alternative: “até que o santuário de Yahweh seja estabelecido/construído”
  rationale: O verbo do texto é linguagem de criação. A tradução preserva essa formulação incomum e sua possível tensão escatológica, em vez de normalizá-la.
- issue: Renovação cósmica
  choice: “os céus, a terra e todas as suas criaturas serão renovados”
  alternative: “haverá novos céus e nova terra”
  rationale: O original fala de renovação, não necessariamente de substituição; a formulação escolhida evita resolver além do texto a natureza dessa transformação.
- issue: Poderes do céu
  choice: “segundo os poderes do céu”
  alternative: “segundo as forças celestes”
  rationale: Mantém a ambiguidade entre capacidades, ordens ou forças celestes, sem identificar os poderes como seres angelicais ou fenômenos naturais.
translation_notes:
  register: Português atual, digno e de leitura ampla, com períodos coordenados que refletem a extensa estrutura do original. Foram preservadas expressões técnicas e incomuns — especialmente “anjo da presença”, “divisões dos anos”, “poderes do céu” e “seja criado” — sem impor uma explicação denominacional.
