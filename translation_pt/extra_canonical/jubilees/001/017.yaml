  text: and I will be their God, and they will be my people in truth and in righteousness.
translation:
  language: pt
  text: e eu serei o Deus deles, e eles serão o meu povo, em verdade e em justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ
  choice: o Deus deles
  rationale: O substantivo አምላክ, com sufixo possessivo no contexto, é vertido naturalmente como “o Deus deles”; o artigo definido é idiomático em português.
- source_word: ሕዝብየ
  choice: o meu povo
  rationale: Preserva diretamente o substantivo “povo” e o sufixo possessivo de primeira pessoa.
- source_word: ዘበአማን
  choice: em verdade
  rationale: Mantém a formulação abstrata e solene do ge’ez, sem reduzir a expressão apenas a “fiel”.
- source_word: ዘበጽድቅ
  choice: em justiça
  rationale: Conserva o sentido amplo de retidão/justiça e evita restringi-lo a uma interpretação moral ou jurídica específica.
theological_decisions:
- issue: Relação pactual expressa por Deus e povo
  choice: “eu serei o Deus deles, e eles serão o meu povo”
  alternative: “eu lhes serei por Deus, e eles me serão por povo”
  rationale: A escolha preserva a reciprocidade da fórmula e seu teor teológico, usando sintaxe portuguesa atual e dignificada.
- issue: Valor de “verdade” e “justiça”
  choice: Manter os dois substantivos abstratos
  alternative: “com fidelidade e retidão”
  rationale: A redação não resolve a possível amplitude semântica em qualidades mais específicas e conserva a tensão do texto-fonte.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A coordenação e o paralelismo do original foram preservados. O fragmento posterior “ወኢ*የኀድ” parece pertencer à continuação do versículo ou ao corte seguinte e não foi incorporado, em consonância com o texto de consulta e o limite da referência.
