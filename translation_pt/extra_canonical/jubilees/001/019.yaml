base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/019.yaml
  text: And he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people.”
translation:
  language: pt
  text: 'E ele orou, dizendo: “Senhor, meu Deus, não abandones o teu povo e a tua herança, para que andem no erro de seus corações, nem os entregues nas mãos de seus inimigos, as nações, para que não os dominem e os façam pecar contra ti. Erga-se, Senhor, a tua misericórdia sobre o teu povo.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትኅድግ
  choice: não abandones
  rationale: Expressa diretamente a súplica negativa e preserva o sentido de não deixar ou desamparar o povo.
- source_word: ርስትከ
  choice: a tua herança
  rationale: Mantém a imagem pactual do povo como herança de Deus, sem substituí-la por uma explicação.
- source_word: በስሕተተ፡ ልቦሙ
  choice: no erro do coração
  rationale: Conserva a linguagem antropológica do texto-fonte; o singular coletivo soa natural e mantém o coração como centro do desvio.
- source_word: አሕዛብ
  choice: as nações
  rationale: Traduz o termo como aposto explicativo de “inimigos”, preservando a identificação presente no texto.
- source_word: ኢይኰንንዎሙ
  choice: para que não os dominem
  rationale: No contexto de entrega aos inimigos, comunica governo ou sujeição hostil sem restringir o verbo ao sentido judicial de condenar.
- source_word: ይትለዐል
  choice: Erga-se
  rationale: Preserva a metáfora verbal de elevação, em vez de a dissolver em uma paráfrase como “manifeste-se”.
theological_decisions:
- issue: Relação entre domínio estrangeiro e pecado contra Deus
  choice: “para que não os dominem e os façam pecar contra ti”
  alternative: “para que não os julguem e não os levem a pecar contra ti”
  rationale: A formulação adotada conserva a sequência causal da súplica e não especifica de que modo as nações induziriam o povo ao pecado.
- issue: Misericórdia elevada sobre o povo
  choice: “Erga-se, Senhor, a tua misericórdia sobre o teu povo”
  alternative: “Manifeste-se, Senhor, a tua misericórdia para com o teu povo”
  rationale: A escolha mantém a imagem incomum e sua possível tensão poética, evitando interpretar silenciosamente “elevar-se” como mera manifestação.
translation_notes:
  register: Português moderno, digno e acessível, com formas de segunda pessoa coerentes na oração. A sintaxe foi levemente explicitada em “deixando-os andar” para mostrar a relação entre abandono e desvio, sem eliminar a imagem do texto-fonte.
