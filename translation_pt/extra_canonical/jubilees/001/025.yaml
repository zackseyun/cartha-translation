  text: And every angel and every spirit will know that these are my children, and that I am their Father in uprightness and righteousness, and that I love them.
translation:
  language: pt
  text: E todo anjo e todo espírito saberão que estes são meus filhos, que eu sou o Pai deles em retidão e justiça e que os amo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ መላእክ፡ ወኵሉ፡ መንፈስ፡
  choice: todo anjo e todo espírito
  rationale: Preserva a distribuição singular do ge'ez e expressa de modo natural a abrangência de cada classe.
- source_word: ወያአምርዎሙ፡
  choice: saberão
  rationale: O verbo indica conhecer ou reconhecer; o futuro concorda com a forma verbal e introduz naturalmente as orações seguintes.
- source_word: እሙንቱ፡ ውሉድየ፡
  choice: estes são meus filhos
  rationale: Tradução direta do demonstrativo, da cópula e da relação filial, sem acrescentar conteúdo ausente no texto ge'ez.
- source_word: አቡሆሙ፡
  choice: o Pai deles
  rationale: Mantém a relação paterna explícita; a inicial maiúscula sinaliza a referência divina sem alterar o sentido lexical.
- source_word: በርቶዕ፡ ወበጽድቅ፡
  choice: em retidão e justiça
  rationale: Conserva os dois substantivos éticos e a preposição, sem fundi-los nem definir além do que o original permite.
- source_word: ወአፈቅርሙ፡
  choice: e que os amo
  rationale: Reproduz a declaração divina de amor com objeto plural, em português claro e direto.
theological_decisions:
- issue: Relação entre a paternidade divina e 'retidão e justiça'
  choice: que eu sou o Pai deles em retidão e justiça
  alternative: que, com retidão e justiça, eu sou o Pai deles
  rationale: Mantém a ligação sintática compacta e a possível tensão do original, sem decidir se os termos qualificam primariamente a paternidade, o modo de agir de Deus ou toda a afirmação.
- issue: Identidade dos filhos
  choice: estes são meus filhos
  alternative: eles são meus filhos
  rationale: Preserva o valor demonstrativo do ge'ez e não especifica além do contexto quem são os referidos.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A coordenação foi suavizada onde necessário, mas a sequência e a ambiguidade teológica do ge'ez foram preservadas.
