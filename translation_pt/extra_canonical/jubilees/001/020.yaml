revisions:
- from: E cria para eles um espírito reto, e não deixes que o espírito de Beliar[a] os domine, para acusá-los diante de ti e desviá-los de todo caminho de justiça, de modo que pereçam diante da tua face. Contudo, eles são o teu povo e a tua herança, que livraste da mão do Egito com o teu grande poder. Cria para eles
  to: E cria para eles um espírito reto, e não deixes que o espírito de Beliar[a] os domine, para acusá-los diante de ti e desviá-los de todo caminho de justiça, de modo que sejam eliminados de diante da tua face. Contudo, eles são o teu povo e a tua herança; tu os livraste da mão do Egito com o teu grande poder. Cria para eles
