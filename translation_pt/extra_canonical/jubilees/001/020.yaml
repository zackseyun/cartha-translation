base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/020.yaml
  text: And create for them an upright spirit, and do not let the spirit of Beliar rule over them to accuse them before you and to turn them away from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them
translation:
  language: pt
  text: E cria para eles um espírito reto, e não deixes que o espírito de Beliar[a] os domine, para acusá-los diante de ti e desviá-los de todo caminho de justiça, de modo que sejam eliminados de diante da tua face. Contudo, eles são o teu povo e a tua herança; tu os livraste da mão do Egito com o teu grande poder. Cria para eles
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Beliar: forma antiga do nome também conhecido como Belial.'
    reason: Ajuda o leitor moderno a reconhecer a variante do nome sem substituir a forma preservada na fonte nem acrescentar uma interpretação teológica.
lexical_decisions:
- source_word: መንፈሰ፡ ርቱዐ
  choice: um espírito reto
  rationale: Reproduz de modo natural a ideia de um espírito moralmente íntegro ou corretamente orientado, sem especificar se se trata de disposição interior ou de um ser espiritual.
- source_word: መንፈሰ፡ ቤልሖር
  choice: o espírito de Beliar
  rationale: Mantém a forma do nome próprio atestada nesta tradição textual e a construção genitiva da fonte.
- source_word: ወኢይኰንንዎሙ
  choice: e não deixes que ... os domine
  rationale: Expressa a petição negativa e o sentido de exercer domínio sobre eles em português corrente.
- source_word: ለአስተዋድዮቶሙ፡ ቅድሜከ
  choice: para acusá-los diante de ti
  rationale: Preserva a função acusatória e a orientação da ação perante Deus.
- source_word: ወለአዕቅጾቶሙ፡ እምኵሉ፡ ፍኖተ፡ ጽድቅ
  choice: e desviá-los de todo caminho de justiça
  rationale: Comunica a ideia de afastamento de cada caminho justo sem introduzir a imagem mais específica de uma armadilha.
- source_word: እምቅድመ፡ ገጽከ
  choice: diante da tua face
  rationale: Conserva a expressão antropomórfica e solene da fonte, em vez de reduzi-la simplesmente a 'da tua presença'.
- source_word: እምእዴ፡ ግብጽ
  choice: da mão do Egito
  rationale: Mantém literalmente a metáfora bíblica de libertação do poder ou domínio do Egito.
theological_decisions:
- issue: Identidade do “espírito reto”
  choice: Manter “um espírito reto” sem explicação interpretativa no corpo do texto.
  alternative: Traduzir como “uma disposição correta” ou identificar explicitamente o Espírito divino.
  rationale: A formulação permite tanto uma leitura relacionada à disposição humana quanto ao agir espiritual, preservando a ambiguidade da fonte.
- issue: Agência do espírito de Beliar
  choice: Apresentá-lo como agente que domina, acusa e desvia.
  alternative: Tratar “espírito de Beliar” apenas como inclinação abstrata ao mal.
  rationale: A sintaxe atribui ações ao espírito, mas não exige uma definição dogmática mais precisa de sua natureza.
- issue: Resultado expresso por “de modo que pereçam”
  choice: Preservar a formulação resultativa sem esclarecer se expressa intenção ou consequência.
  alternative: Traduzir explicitamente como “com a intenção de fazê-los perecer” ou “e assim eles pereceriam”.
  rationale: A construção pode comportar tensão entre finalidade e resultado; a tradução não a resolve de modo denominacional.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com formas de segunda pessoa singular coerentes com uma oração dirigida a Deus. Mantêm-se expressões bíblicas marcantes como “diante da tua face” e “da mão do Egito”. O encerramento incompleto, “Cria para eles”, foi preservado porque o trecho fornecido termina no início da frase seguinte.
