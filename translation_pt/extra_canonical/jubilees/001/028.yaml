  text: And all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion forever, and Zion and Jerusalem will be holy.”
translation:
  language: pt
  text: E todos saberão que eu sou o Deus de Israel, o Pai de todos os filhos de Jacó e rei no monte Sião para todo o sempre, e Sião e Jerusalém serão santas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያእምር
  choice: saberão
  rationale: O verbo expressa conhecimento ou reconhecimento; o futuro concorda com a sequência profética do contexto e com a forma verbal seguinte.
- source_word: አብ
  choice: Pai
  rationale: Tradução direta de “pai”; a inicial maiúscula é adequada por se tratar de um título divino no discurso em primeira pessoa.
- source_word: ደቂቀ ያዕቆብ
  choice: filhos de Jacó
  rationale: Expressão genealógica natural em português, sem restringir indevidamente o sentido a descendentes imediatos.
- source_word: ንጉሥ በደብረ ጽዮን
  choice: Rei no monte Sião
  rationale: Mantém a relação locativa do ge'ez e a referência tradicional ao monte Sião.
- source_word: ለዓለመ ዓለም
  choice: para todo o sempre
  rationale: Equivalente idiomático e solene da fórmula de duração perpétua.
- source_word: ቅድስት
  choice: santas
  rationale: O predicativo se aplica conjuntamente a Sião e Jerusalém; o plural feminino é exigido em português.
theological_decisions:
- issue: Escopo de “Pai”
  choice: o Pai de todos os filhos de Jacó
  alternative: um pai para todos os filhos de Jacó
  rationale: O artigo e a construção apoiam a leitura titular definida, sem acrescentar uma interpretação teológica além da filiação coletiva declarada no texto.
- issue: Realeza em Sião
  choice: o Rei no monte Sião
  alternative: rei do monte Sião
  rationale: A preposição locativa preserva mais diretamente o ge'ez e evita transformar o monte em objeto de posse ou domínio exclusivo.
- issue: Santidade de Sião e Jerusalém
  choice: Sião e Jerusalém serão santas
  alternative: Sião e Jerusalém serão uma coisa santa
  rationale: A concordância plural comunica naturalmente que ambas são qualificadas como santas, sem tentar harmonizar ou diferenciar as duas designações.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica moderada. Preserva a fala divina em primeira pessoa, a enumeração dos títulos e a fórmula de perpetuidade, sem reintroduzir a cláusula anteriormente removida por falta de apoio no texto ge'ez fornecido.
