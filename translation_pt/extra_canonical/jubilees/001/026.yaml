base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/026.yaml
  text: And I will write down for you all these things that I am making known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them throughout all the ages of eternity.”
translation:
  language: pt
  text: 'E eu escreverei para você todas estas coisas que lhe estou dando a conhecer neste monte: o que é primeiro, o que é último e o que está por vir, em todas as divisões dos dias, na Lei, no Testemunho e nas semanas dos seus jubileus, para sempre, até que eu desça e habite com eles por todas as eras da eternidade.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እጽሐፍ
  choice: escreverei
  rationale: O imperfeito etíope, em coordenação com a revelação dada a Moisés, é representado naturalmente pelo futuro em português.
- source_word: ነገረ
  choice: coisas
  rationale: Embora possa significar “palavra” ou “assunto”, aqui abrange todo o conteúdo revelado e fica mais natural como “coisas”.
- source_word: አየድዐከ
  choice: estou dando a conhecer a você
  rationale: Preserva o aspecto imperfeito e em curso do verbo, sem convertê-lo numa ação já concluída.
- source_word: ዙፋቤ፡ መዋዕል
  choice: divisões dos dias
  rationale: Mantém a expressão cronológica característica do texto e sua relação com a estrutura calendárica.
- source_word: ሕግ
  choice: Lei
  rationale: Traduz o termo como designação formal da Lei no par “Lei e Testemunho”.
- source_word: ስምዕ
  choice: Testemunho
  rationale: Mantém o substantivo tradicional e a possível força técnica da expressão.
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: semanas dos seus jubileus
  rationale: Conserva a formulação calendárica do original, sem explicar ou harmonizar os períodos.
- source_word: በኵሉ፡ ዓለመ፡ ዓለም
  choice: por todas as eras da eternidade
  rationale: Reproduz a expressão intensificada de duração eterna em português dignificado e compreensível.
theological_decisions:
- issue: Tempo/aspecto da revelação no monte
  choice: estou dando a conhecer
  alternative: dei a conhecer
  rationale: O imperfeito de አየድዐከ favorece uma ação em curso; a tradução não a apresenta como estritamente concluída.
- issue: Relação de “Lei”, “Testemunho” e ciclos calendáricos
  choice: manter os três elementos coordenados sem explicação interpretativa
  alternative: reformular como se as divisões estivessem contidas exclusivamente na Lei e no Testemunho
  rationale: A sintaxe permite tensão quanto ao alcance dos complementos; a redação conserva a sequência do original sem impor uma sistematização teológica.
- issue: Descida e habitação divina
  choice: “até que eu desça e habite com eles”
  alternative: explicitar identidade, ocasião escatológica ou modo da presença
  rationale: O original não especifica esses elementos, portanto a tradução preserva a afirmação e sua abertura teológica.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A repetição “a você” foi mantida para deixar claro tanto o destinatário da escrita quanto o da revelação; as expressões calendáricas e escatológicas foram preservadas sem paráfrase denominacional.
