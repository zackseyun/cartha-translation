  text: And I will not abandon them, nor will I estrange myself from them, for I am the Lord their God.” And Moses fell on his face,
translation:
  language: pt
  text: E não os abandonarei, nem me afastarei deles, pois eu sou o Senhor, o Deus deles.” E Moisés caiu com o rosto em terra,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጎሙ
  choice: os abandonarei
  rationale: O contexto e a tradução crítica indicam a ideia de deixar ou abandonar; a forma verbal é vertida naturalmente no futuro, em paralelo com a oração seguinte.
- source_word: ኢይትናከሮሙ
  choice: nem me afastarei deles
  rationale: Preserva a ideia reflexiva de tornar-se alheio ou distante sem recorrer ao pouco natural «me tornarei estranho para eles».
- source_word: እግዚአብሔር
  choice: Senhor
  rationale: Traduz o título divino presente no ge'ez sem substituí-lo pelo nome próprio Yahweh.
- source_word: ወወድቀ፡ ሙሴ፡ በገጹ
  choice: Então Moisés prostrou-se com o rosto em terra
  rationale: Expressão portuguesa natural para cair sobre o rosto em gesto de reverência ou súplica; «então» dá fluidez narrativa ao waw.
theological_decisions:
- issue: Relação contínua de Deus com o povo apesar do contexto de infidelidade
  choice: não os abandonarei, nem me afastarei deles
  alternative: não os rejeitarei, nem me tornarei estranho para eles
  rationale: Mantém as duas negações e sua tensão teológica sem explicar sua extensão nem harmonizá-las com outras declarações.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A vírgula final foi preservada porque o versículo termina no meio da sequência narrativa.
