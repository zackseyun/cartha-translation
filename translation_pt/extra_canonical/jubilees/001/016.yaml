  text: with all my heart and with all my soul. And they will be for a blessing and not for a curse, and they will be the head and not the tail. And I will build my sanctuary in their midst, and I will dwell with them,
translation:
  language: pt
  text: com todo o meu coração e com toda a minha alma. Eles serão uma bênção, e não uma maldição; serão a cabeça, e não a cauda. Construirei o meu santuário no meio deles e habitarei com eles,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልብየ
  choice: meu coração
  rationale: Equivalente direto e natural para o centro da vontade e da afeição.
- source_word: ነፍስየ
  choice: minha alma
  rationale: Preserva a formulação antropológica tradicional e o paralelismo com “coração”.
- source_word: ለበረከት
  choice: uma bênção
  rationale: Expressa com naturalidade a função ou condição indicada pela construção etíope.
- source_word: ርእሰ
  choice: a cabeça
  rationale: Mantém literalmente a imagem bíblica de primazia, em contraste com “cauda”.
- source_word: መቅደስየ
  choice: o meu santuário
  rationale: Conserva o sentido de lugar santo pertencente a Deus, sem restringi-lo indevidamente a “templo”.
- source_word: እኀድር
  choice: habitarei
  rationale: Verbo futuro de residência ou permanência, adequado à presença divina entre o povo.
theological_decisions:
- issue: Sujeito da dedicação expressa por “com todo o meu coração e com toda a minha alma”
  choice: Manter o fragmento sem explicitar novamente o sujeito
  alternative: Acrescentar “eu os reunirei” ou outra oração regente inferida do contexto anterior
  rationale: O versículo fornecido começa no meio de uma oração; inserir uma oração ausente resolveria editorialmente o contexto e ultrapassaria a evidência textual apresentada.
- issue: Natureza da presença divina
  choice: “habitarei com eles”
  alternative: “morarei entre eles”
  rationale: A escolha preserva a preposição refletida no texto e evita definir de modo excessivo se a presença é espacial, cultual ou relacional.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica natural. Preservaram-se as antíteses “bênção/maldição” e “cabeça/cauda”. A vírgula final indica que a oração continua no versículo seguinte, como no recorte da fonte.
