  text: And they will forget all my law and all my commandments and all my judgments, and they will go astray as to new moons
translation:
  language: pt
  text: E esquecerão toda a minha lei, todos os meus mandamentos e todos os meus juízos, e se desviarão no tocante às luas novas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: quanto ao início dos meses.'
    reason: O termo etíope pode designar o surgimento da lua nova e, por extensão, o começo do mês.
lexical_decisions:
- source_word: ሕግየ
  choice: minha lei
  rationale: Preserva o singular possessivo do texto etíope e o sentido amplo de instrução normativa.
- source_word: ትእዛዝየ
  choice: meus mandamentos
  rationale: Equivalente corrente e distinto de “lei”, mantendo a enumeração tripla do original.
- source_word: ፍትሕየ
  choice: meus juízos
  rationale: Mantém a categoria jurídica do termo sem reduzi-la a regras ou decretos.
- source_word: ይስሕቱ
  choice: se desviarão
  rationale: Expressa a ideia de errar ou afastar-se do caminho correto, com naturalidade em português.
- source_word: ሠርቀ
  choice: luas novas
  rationale: No contexto calendárico de Jubileus, refere-se às luas novas; o termo também pode evocar o surgimento ou começo do mês.
theological_decisions:
- issue: Relação entre apostasia e observância do calendário
  choice: “se desviarão quanto às luas novas”
  alternative: “errarão no cálculo das luas novas”
  rationale: A formulação preserva a amplitude do original e não especifica que o erro consiste necessariamente em cálculo, datação ou observância ritual.
translation_notes:
  register: Português moderno, claro e digno. A repetição de “todos/toda” foi mantida para reproduzir a ênfase cumulativa do original. O termo inicial አሕዛብ (“nações/gentios”) parece pertencer ao segmento anterior na divisão do capítulo e, de acordo com a camada inglesa auditada, não foi incorporado a este versículo.
