base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/005.yaml
  text: 'And the Lord taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book, so that their generations may see that I have not abandoned them because of all the evil that they have done by transgressing the ordinance that I establish between me and you.”'
translation:
  language: pt
  text: 'E o Senhor lhe deu a conhecer o que veio primeiro e o que ainda está por vir: o relato das divisões de todos os dias da lei e do testemunho. E disse: “Põe no coração tudo o que eu te disser neste monte e escreve-o num livro, para que as gerações deles vejam que não os abandonei por causa de todo o mal que fizeram ao transgredir a norma que estabeleço entre mim e ti.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአመሮ፡ እግዚአብሔር
  choice: E o Senhor lhe deu a conhecer
  rationale: O verbo expressa fazer alguém saber ou conhecer. A formulação é natural em português e mantém o Senhor como agente, sem usar o nome divino, que não aparece na fonte.
- source_word: ዘቀዳሚ፡ ወዘኒ፡ ይመጽእ
  choice: o que havia acontecido no princípio e o que ainda estava por vir
  rationale: Reproduz o contraste temporal entre o anterior ou primeiro e aquilo que virá, sem reduzir a expressão a categorias doutrinárias.
- source_word: ነገረ፡ ኩፋሌ፡ ኵሉ፡ መዋዕላት
  choice: o relato das divisões de todos os dias
  rationale: Mantém tanto a ideia de relato quanto o vocabulário característico de divisão ou repartição dos períodos, importante para o título e o tema da obra.
- source_word: አነብር፡ ልበከ
  choice: Põe no coração
  rationale: Conserva a imagem semítica de aplicar interiormente a atenção, em linguagem compreensível e digna.
- source_word: ሥርዐት
  choice: norma
  rationale: Abrange a ideia de ordenança, disposição ou regra estabelecida, evitando uma formulação excessivamente técnica.
theological_decisions:
- issue: Motivo pelo qual Deus não os abandona
  choice: não os abandonei por causa de todo o mal que fizeram
  alternative: não os abandonei, apesar de todo o mal que fizeram
  rationale: A construção causal da fonte foi preservada sem reformulá-la como concessão, mantendo a tensão teológica do enunciado.
- issue: Relação da norma com Deus e Moisés
  choice: a norma que estabeleço entre mim e ti
  alternative: a aliança que estabeleço entre mim e ti
  rationale: A fonte emprega um termo para norma ou ordenança, não o termo inequívoco para aliança; por isso, a tradução não introduz essa identificação teológica.
translation_notes:
  register: Português moderno de leitura ampla, com construção digna e direta. Emprega “ti” no discurso divino para preservar a distinção singular e o tom solene. O fragmento inicial ሌሊተ (“noite”) foi entendido como remanescente do versículo anterior conforme a divisão de capítulo indicada e, por isso, não foi incorporado a 1:5.
