  text: and I will cut off the foreskin of their heart and the foreskin of the heart of their seed, and I will create for them a holy spirit, and I will cleanse them so that they do not turn away from following me from that day and forever.
translation:
  language: pt
  text: E cortarei o prepúcio do coração deles e o prepúcio do coração dos descendentes deles[a]; criarei para eles um espírito santo e os purificarei, para que, daquele dia em diante e para sempre, não deixem de me seguir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a semente deles”. A expressão “prepúcio do coração” evoca a circuncisão interior.
    reason: Esclarece o uso coletivo de «semente» e a metáfora anatômica preservada no texto principal.
  - marker: b
    text: Literalmente, “não se desviem de detrás de mim”.
    reason: Registra a imagem espacial subjacente à expressão «me seguir».
lexical_decisions:
- source_word: ቍልፈተ፡ ልቦሙ፡ ወቍልፈተ፡ ልበ፡ ዘርኦሙ
  choice: o prepúcio do coração deles e o prepúcio do coração de seus descendentes
  rationale: Mantém a metáfora explícita da incircuncisão do coração, em consonância com o uso bíblico, sem substituí-la pelo eufemismo menos preciso «cobertura»; «descendentes» expressa naturalmente ዘርእ, literalmente «semente».
- source_word: እፈጥር፡ ሎሙ፡ መንፈሰ፡ ቅዱሰ
  choice: criarei para eles um espírito santo
  rationale: Traduz diretamente o verbo «criar/fazer» e preserva a ausência de artigo e a possível ambiguidade entre uma disposição santificada e o Espírito Santo como referente pessoal.
- source_word: እነጽሖሙ
  choice: os purificarei
  rationale: Expressa o sentido de tornar limpo ou puro, adequado ao contexto de transformação interior.
- source_word: ኢይትመየጡ፡ እምድኅሬየ
  choice: não deixem de me seguir
  rationale: Comunica em português natural o idioma espacial «não se desviem de detrás de mim», isto é, não abandonem a posição de seguidores.
- source_word: እምይእቲ፡ ዕለት፡ እስከ፡ ለዓለም
  choice: daquele dia em diante e para sempre
  rationale: Reproduz tanto o ponto inicial temporal quanto a duração ilimitada.
theological_decisions:
- issue: Metáfora da circuncisão interior
  choice: «cortarei o prepúcio do coração»
  alternative: «removerei/abrirei a cobertura do coração»
  rationale: A opção escolhida conserva a força corporal e teológica de ቍልፈት e sua ligação com a conhecida metáfora bíblica da circuncisão do coração.
- issue: Identidade de «espírito santo»
  choice: 'minúsculas e sem artigo: «um espírito santo»'
  alternative: «o Espírito Santo»
  rationale: O texto não obriga a identificar de modo inequívoco a expressão como nome próprio; a formulação escolhida preserva a tensão sem excluir essa leitura.
- issue: Expressão «de detrás de mim»
  choice: «não deixem de me seguir»
  alternative: «não se afastem de mim»
  rationale: A escolha torna explícita a imagem relacional de abandonar o seguimento, sem reduzir a frase a mera distância.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. A metáfora corporal foi mantida de forma direta; evitou-se capitalização interpretativa em «espírito santo». O fragmento final «ወትትሉ፡» não foi incluído, por pertencer à continuação textual além da unidade versicular fornecida.
