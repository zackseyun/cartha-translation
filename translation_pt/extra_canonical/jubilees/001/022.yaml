  text: and they will not listen until they acknowledge their sin and the sins of their fathers. And after this they will turn to me in all uprightness and with all their heart and with all their soul,
translation:
  language: pt
  text: e não ouvirão até reconhecerem seu pecado e os pecados de seus pais. Depois disso, voltarão para mim com toda a retidão, de todo o coração e de toda a alma,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢይሰምዑ
  choice: e não ouvirão
  rationale: Preserva a cláusula negativa explícita do ge'ez e o sentido de ouvir/atender, sem omiti-la.
- source_word: ያአምሩ
  choice: reconhecerem
  rationale: No contexto de pecado, expressa tomar conhecimento e admitir, mantendo o sentido do verbo sem acrescentar linguagem confessional mais específica.
- source_word: ይትመየጡ፡ ኀቤየ
  choice: voltarão para mim
  rationale: Traduz naturalmente o movimento de retorno a Deus indicado pelo texto.
- source_word: በኵሉ፡ ርቱዕ
  choice: com toda a retidão
  rationale: Mantém o substantivo ético e a força totalizante da expressão ge'ez.
- source_word: በኵሉ፡ ልብ፡ ወበኵሉ፡ ነፍስ
  choice: de todo o coração e de toda a alma
  rationale: Emprega a formulação portuguesa natural e preserva o paralelismo integral do original.
theological_decisions:
- issue: Natureza do reconhecimento do pecado
  choice: reconhecerem seu pecado
  alternative: confessarem seu pecado
  rationale: “Reconhecer” preserva a amplitude do verbo-fonte e não impõe a ideia mais específica de confissão formal.
- issue: Relação entre retidão, coração e alma
  choice: com toda a retidão, de todo o coração e de toda a alma
  alternative: com retidão, com todo o coração e com toda a alma
  rationale: A redação conserva as três expressões coordenadas e a repetição da totalidade, sem fundi-las em uma única condição interior.
translation_notes:
  register: Português moderno, digno e claro, com legibilidade brasileira. O fragmento inicial ክሳዶሙ (“seu pescoço”) foi tratado como remanescente da oração do versículo anterior, conforme a divisão contextual, e não foi incorporado como frase incompleta neste versículo. A pontuação final com vírgula preserva a continuidade sintática indicada pelo trecho fornecido.
