  yaml_path: translation/extra_canonical/jubilees/001/006.yaml
  text: 'today for their generations on Mount Sinai.” And so it will be: when all these things come upon them, they will know that I am more righteous than they are in all their judgments and in all their deeds,'
translation:
  language: pt
  text: 'hoje, para as suas gerações, no Monte Sinai”. E será assim: quando tudo o que foi dito vier sobre eles, saberão que sou mais justo do que eles em todos os seus julgamentos e em todas as suas ações,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዮም
  choice: hoje
  rationale: Reproduz explicitamente o advérbio temporal presente no início do segmento ge'ez.
- source_word: ለትውልዶሙ
  choice: para as suas gerações
  rationale: Mantém a referência às sucessivas gerações deles sem restringi-la a uma única época.
- source_word: ወይከውን፡ ከመዝ
  choice: E acontecerá assim
  rationale: Expressa de modo natural em português a fórmula que introduz o que ocorrerá.
- source_word: ኵሉ፡ ዝነገር፡ ላዕሌሆሙ
  choice: tudo o que foi dito ... sobre eles
  rationale: Preserva o valor passivo de 'foi dito' e a ideia de que o anunciado sobrevém a eles.
- source_word: ጻድቅ፡ እምኔሆሙ
  choice: sou mais justo do que eles
  rationale: O comparativo ge'ez exige 'do que eles'; o verbo 'sou' é suprido naturalmente pelo contexto da fala divina.
- source_word: በኵሉ፡ ፍትሖሙ፡ ወበኵሉ፡ ምግባሮሙ
  choice: em todos os seus julgamentos e em todas as suas ações
  rationale: Conserva o paralelismo e distingue decisões ou julgamentos de conduta ou feitos.
theological_decisions:
- issue: Comparação entre a justiça divina e a deles
  choice: sou mais justo do que eles
  alternative: sou justo, ao contrário deles
  rationale: A formulação comparativa preserva a tensão do texto ge'ez sem transformar a afirmação em contraste absoluto nem introduzir uma explicação doutrinária.
translation_notes:
  register: Português atual, digno e de leitura ampla. A abertura e a vírgula final foram mantidas como fragmento ligado aos versículos adjacentes; as aspas fecham a fala iniciada anteriormente.
