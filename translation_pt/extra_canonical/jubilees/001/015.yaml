  source_fidelity: 'A tradução acompanha de perto a sequência e os termos centrais do ge''ez: sábados, festas, jubileus, ordenanças; a volta dentre as nações; a reunião; a busca; a revelação de paz abundante em justiça; e o transplante como plantação íntegra. Contudo, «para que me encontrem» transforma a construção passiva «para que eu seja encontrado por eles» numa formulação ativa e torna menos visível a nuance do texto-fonte.'
  naturalness: O português é claro e de registro apropriado. A repetição de «com todo(a)» na primeira enumeração melhora o paralelismo e a leitura. «Para que eu seja encontrado por eles» é um pouco mais formal, mas é natural o suficiente no registro escriturístico e preserva a voz da fonte.
  terminology: «Jubileus», «ordenanças», «revelarei», «paz abundante em justiça» e «transplantarei» são escolhas adequadas. «Plantação íntegra» preserva de modo compreensível a metáfora de uma plantação reta/íntegra, sem impor uma interpretação confessional.
