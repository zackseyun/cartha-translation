  yaml_path: translation/extra_canonical/jubilees/001/015.yaml
  text: and Sabbaths and festivals and jubilees and ordinances. And after this they will turn to me from among the nations with all their heart and with all their soul and with all their strength, and I will gather them from among all the nations, and they will seek me so that I may be found by them. And when they seek me with all their heart and with all their soul, I will reveal to them abundant peace in righteousness, and I will transplant them as an upright planting,
translation:
  language: pt
  text: e sábados, festas, jubileus e ordenanças. Depois disso, eles se voltarão para mim dentre as nações, com todo o coração, com toda a alma e com toda a força. Eu os reunirei dentre todas as nações, e eles me buscarão para que eu seja encontrado por eles. Quando me buscarem com todo o coração e com toda a alma, eu lhes revelarei paz abundante em justiça e os transplantarei[a] como uma plantação íntegra,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os plantarei”.'
    reason: Embora “transplantarei” expresse melhor a nuance de deslocamento e novo estabelecimento do verbo, “plantarei” é uma tradução possível e mais geral.
lexical_decisions:
- source_word: ወአዮቤለ (wa-ʾayobela)
  choice: jubileus
  rationale: Mantém o termo técnico relativo aos ciclos jubilares e corresponde naturalmente ao contexto do livro.
- source_word: ወሥርዐተ (wa-śərʿāta)
  choice: e ordenanças
  rationale: Expressa normas ou disposições estabelecidas sem restringir o sentido a uma categoria denominacional específica.
- source_word: ወአስተጋብኦሙ (wa-ʾastagābəʾomu)
  choice: Eu os reunirei
  rationale: O causativo comunica reunir os dispersos, em harmonia com a procedência indicada pela frase seguinte.
- source_word: ወየኀሡኒ (wa-yaḫaśśuni)
  choice: e eles me buscarão
  rationale: Reproduz de modo direto e idiomático o ato intencional de procurar a Deus.
- source_word: እከሥት ሎሙ (ʾəkäśśət lomu)
  choice: eu lhes revelarei
  rationale: Conserva a ideia de tornar manifesto ou revelar algo a eles.
- source_word: ወእፈልሶሙ (wa-ʾəfalləsomu)
  choice: e os transplantarei
  rationale: O verbo causativo sugere deslocar e estabelecer novamente, nuance apropriada após a reunião dentre as nações e mais específica que simplesmente plantar.
- source_word: ተክለ ርቱዐ (takla rətuʿa)
  choice: como uma plantação íntegra
  rationale: Preserva a metáfora agrícola e o valor moral de algo reto, correto ou íntegro, evitando transformar a expressão em uma interpretação teológica mais específica.
theological_decisions:
- issue: Condição e resultado da busca por Deus
  choice: “eles me buscarão para que me encontrem”
  alternative: “eles me buscarão, e eu me deixarei encontrar por eles”
  rationale: Mantém a construção final do texto e sua tensão entre a busca humana e o encontro concedido por Deus, sem explicitar além da fonte quem determina o resultado.
- issue: Relação entre paz e justiça
  choice: “paz abundante em justiça”
  alternative: “paz abundante com justiça”
  rationale: A formulação conserva a associação estreita e potencialmente locativa ou esférica entre paz e justiça, sem reduzir a justiça a mero acompanhamento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A coordenação inicial foi mantida porque o versículo começa como continuação da frase anterior. A repetição de “dentre todas as nações” preserva a ênfase da fonte, e a vírgula final indica que a frase continua no versículo seguinte.
