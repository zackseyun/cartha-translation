    rationale: O ge'ez, como o audit trail inglês, expressa que Deus «seja encontrado por eles». «Para que me encontrem» é português idiomático, mas desloca a expressão para a ação ativa exclusiva dos que buscam. «Para que eu seja encontrado por eles» conserva a forma e a nuance da fonte.
  - severity: low
    issue: Paralelismo incompleto na primeira tríade.
    rationale: «De todo o coração, com toda a alma e com toda a força» é compreensível, mas «com todo o coração, com toda a alma e com toda a força» reproduz mais regularmente a repetição enfática da fonte.
