  yaml_path: translation/extra_canonical/jubilees/001/002.yaml
  text: On the sixteenth day of that month, Yahweh spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written, so that you may teach them.” And Moses went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai,
translation:
  language: pt
  text: 'No décimo sexto dia daquele mês, Deus falou a Moisés: “Suba até mim, ao monte, e eu lhe darei duas tábuas de pedra, com a lei e o mandamento que escrevi, para que você os ensine.” Então Moisés subiu ao monte de Deus e ali permaneceu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: Deus
  rationale: Neste texto etíope, o termo é a designação comum de Deus/Senhor, não uma representação explícita do tetragrama; “Deus” também corresponde ao uso contextual no “monte de Deus”.
- source_word: ዕረግ
  choice: Suba
  rationale: Imperativo singular dirigido a Moisés; “suba até mim” comunica de modo natural o movimento ascendente e o destino expresso no original.
- source_word: ክልኤተ ጽላተ እብን
  choice: duas tábuas de pedra
  rationale: Tradução direta da expressão, em concordância com a tradição textual do episódio do Sinai.
- source_word: ዘሕግ ወዘትእዛዝ
  choice: com a lei e o mandamento
  rationale: Mantém os dois substantivos singulares e sua distinção, sem fundi-los nem impor uma interpretação teológica específica.
- source_word: ታስብዎሙ
  choice: para que você os ensine
  rationale: Expressa a finalidade e preserva o objeto plural, entendido como a lei e o mandamento.
- source_word: ወኀደረ
  choice: e ali permaneceu
  rationale: O verbo significa permanecer, ficar ou passar algum tempo; esta tradução segue o texto ge'ez fornecido, que não menciona neste ponto a glória divina habitando no Sinai.
theological_decisions:
- issue: Representação do nome divino
  choice: Deus
  alternative: Yahweh
  rationale: O ge'ez apresentado traz እግዚአብሔር, e não uma transliteração inequívoca do nome Yahweh. Traduzir por “Deus” evita importar para este testemunho uma forma não explicitada nele.
- issue: Objeto do ensino
  choice: “os ensine”, retomando a lei e o mandamento
  alternative: “ensine por meio delas”, retomando as tábuas
  rationale: A forma plural permite mais de uma associação contextual; a redação conserva a referência gramatical ampla sem explicar além do que o texto afirma.
- issue: Encerramento do versículo
  choice: Moisés permaneceu no monte de Deus
  alternative: A glória de Yahweh habitou no monte Sinai
  rationale: O original ge'ez fornecido termina com a afirmação de que Moisés subiu ao monte de Deus e permaneceu. A leitura alternativa da camada inglesa não está presente neste trecho do testemunho-fonte e parece resultar da divisão do capítulo ou de conteúdo adjacente.
translation_notes:
  register: Português moderno, claro e digno, com formas correntes no Brasil e compreensão internacional. Emprega-se “você” para o singular dirigido a Moisés, evitando o arcaísmo de “tu” em variedades que não mantêm sua conjugação tradicional. A sintaxe foi levemente ajustada para fluidez, sem apagar as distinções do original.
