  source_fidelity: 'A tradução acompanha bem a estrutura e o sentido do ge''ez: o testemunho tem função acusatória, seguem-se as nações e aquilo que lhes pertence, e a enumeração final de consequências é preservada. Contudo, o presente do original em «tudo o que lhes ordeno» não deve ser deslocado para o futuro («ordenar»). Também é preferível conservar mais explicitamente as três ocorrências de «atrás de», que estruturam a sequência no texto-fonte.'
  naturalness: O português é claro, atual e de registro adequado. «Coisas vergonhosas» é mais neutro e semanticamente seguro do que «práticas vergonhosas», pois o texto não especifica práticas.
  terminology: «Testemunho», «mandamentos», «impurezas», «pedra de tropeço», «aflição», «tribulação» e «armadilha» são escolhas adequadas. «Os deuses delas» mantém de modo claro a referência às nações, sem alterar a força da expressão.
