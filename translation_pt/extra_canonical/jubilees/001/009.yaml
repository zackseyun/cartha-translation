    issue: Tempo verbal em «tudo o que eu lhes ordenar»
    rationale: O ge'ez, em consonância com a trilha inglesa («everything that I command them»), refere-se ao mandamento divino em curso. «Tudo o que lhes ordeno» preserva esse valor.
  - severity: low
    issue: Atenuação da repetição de «atrás de»
    rationale: O original repete a preposição para nações, impurezas e coisas vergonhosas. Repeti-la em português conserva a progressão enfática sem prejudicar a fluência.
  - severity: low
    issue: «Práticas vergonhosas» especifica além do texto
    rationale: O substantivo fonte designa coisas vergonhosas/degradantes, sem determinar que sejam práticas. Uma formulação mais abrangente evita essa restrição interpretativa.
