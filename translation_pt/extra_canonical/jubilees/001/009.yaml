base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/009.yaml
  text: And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.
translation:
  language: pt
  text: E este testemunho será ouvido como testemunho contra eles. Pois esquecerão todos os meus mandamentos, tudo o que lhes ordeno; andarão atrás das nações, atrás das suas impurezas e atrás das suas coisas vergonhosas; servirão aos deuses delas, e estes se tornarão para eles pedra de tropeço, aflição, tribulação e armadilha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ (səm‘)
  choice: testemunho
  rationale: O termo ocorre duas vezes e designa um testemunho que será ouvido e terá força contra o povo; a repetição foi preservada.
- source_word: ይረስዑ (yərrəs‘u)
  choice: esquecerão
  rationale: Mantém o sentido direto de deixar cair da memória ou negligenciar os mandamentos.
- source_word: የሐውሩ፡ ድኅረ (yəḥawwəru dəḫra)
  choice: seguirão
  rationale: A expressão idiomática significa literalmente andar atrás de; “seguir” é natural em português e conserva a ideia de adesão.
- source_word: ርኵሶሙ (rəkusomu)
  choice: suas impurezas
  rationale: Preserva a linguagem de impureza do texto sem especificar indevidamente se é ritual, moral ou ambas.
- source_word: ኀሣሮሙ (ḫəssaromu)
  choice: suas práticas vergonhosas
  rationale: Expressa aquilo que é vergonhoso ou degradante; “práticas” torna claro o objeto de seguimento sem introduzir uma categoria doutrinária.
- source_word: ማዕቅፈ (ma‘qəfa)
  choice: pedra de tropeço
  rationale: Reproduz a imagem tradicional de algo que leva alguém a cair, com formulação clara e corrente em português bíblico.
- source_word: መሥገርት (masgārt)
  choice: armadilha
  rationale: Comunica de modo natural a ideia de laço ou instrumento de captura.
theological_decisions:
- issue: Função condenatória do testemunho
  choice: “como testemunho contra eles”
  alternative: “como testemunho para eles”
  rationale: Embora a construção ge’ez possa ser vertida mais literalmente com “para eles”, o contexto apresenta o testemunho como evidência acusatória diante da futura desobediência; “contra eles” explicita essa função sem acrescentar conteúdo estranho.
- issue: Antecedente de “estes”
  choice: Os deuses das nações são mantidos como antecedente gramatical mais próximo.
  alternative: Entender “estes” como referência coletiva às nações, impurezas e práticas vergonhosas.
  rationale: A proximidade sintática favorece “os deuses”, mas o pronome demonstrativo foi preservado para não eliminar totalmente a abertura referencial do original.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A cadência enumerativa do original foi preservada, bem como a repetição enfática de “testemunho” e a sequência final de consequências.
