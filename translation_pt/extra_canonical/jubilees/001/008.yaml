  text: e eles se voltarão para deuses estrangeiros, que não poderão livrá-los de nenhuma de suas aflições.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትመየጡ
  choice: se voltarão
  rationale: Expressa de modo natural o movimento de mudança de lealdade indicado pelo verbo no contexto.
- source_word: አምላክ፡ ነኪር
  choice: deuses estrangeiros
  rationale: Reproduz diretamente a ideia de divindades alheias ou estrangeiras, sem acrescentar interpretação denominacional.
- source_word: ኢያድኅንዎሙ
  choice: não poderão livrá-los
  rationale: Comunica a incapacidade dessas divindades de salvar ou resgatar o povo.
- source_word: እምኵሉ፡ ምንዳቤሆሙ
  choice: de nenhuma de suas aflições
  rationale: 'Embora ኵሉ tenha o sentido básico de ''todo'', sob a negação a expressão indica incapacidade total: não os livrarão de aflição alguma. Esta formulação evita sugerir que poderiam livrá-los de algumas.'
theological_decisions:
- issue: Incapacidade dos deuses estrangeiros
  choice: que não poderão livrá-los de nenhuma de suas aflições
  alternative: que não poderão livrá-los de todas as suas aflições
  rationale: 'A alternativa pode sugerir uma capacidade parcial de livramento. A redação escolhida preserva a força da negação combinada com ''todo'' no texto-fonte: nenhuma aflição fica dentro da capacidade salvadora desses deuses.'
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao público geral. Conserva a coordenação com o contexto anterior por meio de 'e' e evita vocabulário excessivamente técnico.
