base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/010.yaml
  text: And many will perish, and they will be captured and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.
translation:
  language: pt
  text: Muitos perecerão; serão capturados e cairão nas mãos do inimigo, porque abandonaram os meus estatutos, os meus mandamentos, as festas da minha aliança, os meus sábados, as minhas coisas sagradas, que santifiquei para mim no meio deles, e o meu tabernáculo e o meu santuário, que santifiquei para mim no meio da terra, a fim de pôr sobre ele o meu nome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሐጐሉ
  choice: perecerão
  rationale: Expressa de modo direto o sentido de ruína ou perecimento do verbo ge'ez, mantendo o tom profético.
- source_word: ይትአኀዙ
  choice: serão capturados
  rationale: No contexto de queda diante do inimigo, comunica naturalmente a ideia de serem tomados como cativos.
- source_word: ሥርዐትየ
  choice: os meus estatutos
  rationale: Representa prescrições ou ordenanças estabelecidas, em linguagem bíblica clara e distinta de «mandamentos».
- source_word: በዓላት፡ ኪዳንየ
  choice: as festas da minha aliança
  rationale: Preserva a relação genitiva explícita entre as festas e a aliança.
- source_word: ቅድሳትየ
  choice: as minhas coisas sagradas
  rationale: Mantém a amplitude do plural substantivado sem restringi-lo indevidamente a objetos, lugares ou ritos específicos.
- source_word: ደብተራየ
  choice: o meu tabernáculo
  rationale: Equivalente tradicional e inteligível para a tenda sagrada, distinguindo-a do «santuário» mencionado em seguida.
- source_word: አሢም፡ ስምየ፡ ላዕሌሁ
  choice: pôr sobre ele o meu nome
  rationale: Conserva a imagem concreta da expressão de consagração e presença, sem explicá-la teologicamente.
theological_decisions:
- issue: Referente singular em «sobre ele»
  choice: Mantido o pronome singular, permitindo que remeta ao santuário ou ao complexo sagrado mencionado por último.
  alternative: Explicitar «sobre o santuário» ou empregar uma formulação plural.
  rationale: O texto-fonte usa referência singular; preservá-la evita resolver uma possível ambiguidade sintática.
- issue: Natureza das «coisas sagradas»
  choice: Usar uma designação abrangente e não especificada.
  alternative: Traduzir como «objetos sagrados», «lugares santos» ou «ritos sagrados».
  rationale: O termo não exige uma dessas categorias em particular, e uma especificação importaria interpretação além do texto.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação extensa do original foi preservada, mas a pontuação foi ajustada para clareza. «Nas mãos do inimigo» é a formulação idiomática natural em português para a expressão ge'ez no singular.
