  text: And all this was ordained and written on the heavenly tablets, and there is no injustice; and all who depart from the path that was ordained for them to walk in—
translation:
  language: pt
  text: Ele ordenou tudo isso, e foi escrito nas tábuas celestiais; não há injustiça. E todos os que se desviaram do caminho que lhes foi ordenado percorrer—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርዐ (śarʿa)
  choice: ordenou / foi ordenado
  rationale: Preserva a repetição lexical do verbo geʽez nas duas ocorrências e seu sentido de determinar ou ordenar.
- source_word: ጽላተ፡ ሰማይ (ṣəlāta samāy)
  choice: tábuas celestiais
  rationale: Expressa naturalmente em português as tábuas pertencentes ao âmbito do céu.
- source_word: ተዐደዉ፡ እምፍኖተ (taʿaddaw em-fənnota)
  choice: se desviam do caminho
  rationale: Comunica a ideia de ultrapassar ou abandonar o caminho prescrito sem acrescentar uma qualificação doutrinária.
- source_word: ይሖሩ፡ ባቲ (yəḫoru bāti)
  choice: seguir
  rationale: O sentido literal é andar nele; 'seguir [o caminho]' é idiomático em português e mantém a metáfora do caminho.
theological_decisions:
- issue: Relação entre a ausência de injustiça e os que se desviam
  choice: 'Separar as orações: ''não há injustiça. E todos os que...'''
  alternative: 'Ligar as expressões: ''não há injustiça para todos os que...'''
  rationale: A conjunção repetida introduz uma nova oração; separá-las evita sugerir que o desvio não seja injusto ou que os transgressores estejam fora do alcance da justiça.
- issue: Agente da ordenação inicial
  choice: Manter o sujeito implícito em 'ele ordenou'
  alternative: Usar a passiva 'foi ordenado'
  rationale: O verbo geʽez está na forma ativa masculina singular; 'ele' conserva essa informação sem identificar além do que o contexto permite.
translation_notes:
  register: Português moderno, claro e solene. O travessão final indica que a construção sintática continua no versículo seguinte, evitando transformar a oração dependente em frase completa.
