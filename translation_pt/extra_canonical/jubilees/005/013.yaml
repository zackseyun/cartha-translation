revisions:
- from: Tudo isso ele ordenou, e foi escrito nas tábuas celestiais; não há injustiça. E todos os que se desviam do caminho que lhes foi ordenado seguir—
  to: Ele ordenou tudo isso, e foi escrito nas tábuas celestiais; não há injustiça. E todos os que se desviaram do caminho que lhes foi ordenado percorrer—
  rationale: A revisão conserva a repetição de «ordenou», separa corretamente as duas orações coordenadas e mantém o travessão que sinaliza a continuação no versículo 14. Corrige-se o aspecto de «se desviam» para «se desviaram» e esclarece-se a construção final. A nota assinala a alternativa sintática sem impor-lhe a leitura preferida.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:00:33Z'
review_pass:
  verdict: revise
  source_fidelity: A divisão entre «não há injustiça» e a oração seguinte está correta e preserva a coordenação do geʽez, em concordância com a revisão inglesa. Contudo, «se desviam» muda o perfeito do texto-fonte («os que se desviaram/ultrapassaram»); convém conservar o aspecto perfeito. A formulação revista também torna mais explícito que a ordem de percorrer se aplica aos que abandonaram o caminho.
  naturalness: O texto é claro e de registro apropriadamente solene. «Tudo isso ele ordenou» é possível, mas «Ele ordenou tudo isso» é mais fluente em português moderno sem perda de ênfase relevante. O travessão final é necessário, pois a construção continua no versículo seguinte.
  terminology: «Ordenou» nas duas ocorrências preserva adequadamente a repetição de śarʿa. «Tábuas celestiais» e «caminho» são escolhas naturais e fiéis. «Percorrer» comunica de modo idiomático o «andar nele» referido ao caminho.
  issues:
  - severity: medium
    issue: Aspecto verbal de «se desviam»
    rationale: O geʽez apresenta os que «se desviaram» do caminho. O presente habitual português altera esse aspecto e deve ser substituído pelo perfeito.
  - severity: low
    issue: Ambiguidade sintática em «caminho que lhes foi ordenado seguir»
    rationale: A redação pode fazer parecer que o caminho, e não as pessoas, recebeu a ordem. «que lhes foi ordenado percorrer» deixa clara a relação sem explicitar além do texto.
  revised_text: Ele ordenou tudo isso, e foi escrito nas tábuas celestiais; não há injustiça. E todos os que se desviaram do caminho que lhes foi ordenado percorrer—
  revised_footnotes:
  - marker: a
    text: 'Ou: «e não há injustiça para todos os que se desviam».'
    reason: A nota registra a possibilidade de ligar «não há injustiça» à oração seguinte, refletindo a alternativa preservada no histórico inglês, sem adotar uma leitura que enfraqueça a coordenação principal do geʽez.
  revision_rationale: A revisão conserva a repetição de «ordenou», separa corretamente as duas orações coordenadas e mantém o travessão que sinaliza a continuação no versículo 14. Corrige-se o aspecto de «se desviam» para «se desviaram» e esclarece-se a construção final. A nota assinala a alternativa sintática sem impor-lhe a leitura preferida.
