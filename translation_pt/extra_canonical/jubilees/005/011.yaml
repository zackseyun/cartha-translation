  - severity: low
    issue: A oração «sem que ele o julgasse» não preserva tão diretamente a relação de anterioridade/completude expressa no audit trail inglês («had not judged»).
    rationale: «Que ele não tivesse julgado» mantém a negação relativa e torna mais clara a ideia de que ninguém permaneceu sem ter sido julgado.
