  text: And he destroyed all from their places, and not one of them remained whom he had not judged according to all their wickedness.
translation:
  language: pt
  text: E ele destruiu todos de seus lugares, e nenhum deles restou que ele não tivesse julgado segundo toda a sua maldade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደምሰሰ
  choice: E ele destruiu
  rationale: O verbo expressa eliminação ou destruição completa; “destruiu” comunica com clareza a força do contexto.
- source_word: ኵሉ፡ እመካኖሙ
  choice: a todos, removendo-os de seus lugares
  rationale: A construção literalmente associa “todos” à ideia de procedência a partir de seus lugares. A formulação portuguesa explicita a relação sem alterar o resultado destrutivo.
- source_word: ወኢተርፈ፡ አሐዱ፡ እምኔሆሙ
  choice: e nenhum deles restou
  rationale: 'Reproduz de modo natural a negação enfática: nem sequer um deles permaneceu.'
- source_word: ዘአኰነነ፡ በኵሉ፡ እኪዮሙ
  choice: sem que ele o julgasse segundo toda a sua maldade
  rationale: A oração relativa negativa é vertida idiomaticamente como “sem que”, mantendo a ideia de que nenhum escapou ao julgamento correspondente à totalidade de sua maldade.
theological_decisions:
- issue: Relação entre destruição e julgamento
  choice: O julgamento é apresentado como aplicado a cada um segundo toda a sua maldade.
  alternative: Entender a oração apenas como uma descrição geral da condenação coletiva.
  rationale: A construção “nenhum deles... sem que” conserva a aplicação distributiva do juízo sem acrescentar uma teoria sobre sua natureza ou duração.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. “Removendo-os de seus lugares” evita a rigidez de uma tradução literal como “destruiu todos de seus lugares”, enquanto preserva o movimento expresso pela fonte.
