  naturalness: O texto é claro e de registro apropriado. A construção relativa negativa direta é mais concisa e idiomática em português do que «nenhum deles restou sem que...».
  terminology: «Destruiu», «julgado» e «maldade» são escolhas adequadas e não carregam interpretação teológica adicional.
