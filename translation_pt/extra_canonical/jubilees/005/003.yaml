  yaml_path: translation/extra_canonical/jubilees/005/003.yaml
  text: And the Lord saw the earth, and behold, it was ruined, and all flesh had corrupted its order, and all who were on the earth had done evil before his eyes.
translation:
  language: pt
  text: E o Senhor viu a terra, e eis que estava arruinada; toda carne havia corrompido sua ordem, e todos os que estavam sobre a terra haviam praticado o mal diante dos seus olhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማሰነት / አማሰነት
  choice: estava arruinada / havia corrompido
  rationale: Preserva a repetição da raiz ligada a corrupção e ruína, usando formas naturais em português conforme cada sujeito.
- source_word: ኵሉ፡ ዘሤጋ
  choice: toda carne
  rationale: Mantém a expressão coletiva e concreta do texto, sem restringi-la explicitamente apenas à humanidade.
- source_word: ሥርዓታ
  choice: sua ordem
  rationale: O termo designa ordem, regra ou ordenamento; “ordem” preserva a ênfase na corrupção da ordem estabelecida e evita substituí-la por “caminho”.
- source_word: አእከየ
  choice: haviam praticado o mal
  rationale: Expressa de modo idiomático a ação de fazer o mal, mantendo o valor moral do verbo.
- source_word: ቅድመ፡ አዕይንቲሁ
  choice: diante dos seus olhos
  rationale: Conserva a imagem antropomórfica e judicial do original.
theological_decisions:
- issue: Alcance de “toda carne”
  choice: Manter “toda carne”
  alternative: “todos os seres humanos”
  rationale: O original usa uma formulação abrangente; explicitar apenas seres humanos resolveria uma possível ambiguidade que o texto mantém.
- issue: Sentido de ሥርዓታ
  choice: “sua ordem”
  alternative: “seu caminho”
  rationale: “Ordem” corresponde melhor ao campo semântico de regra, ordenamento ou disposição e preserva a tensão temática da desordem da criação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve cadência bíblica em “e eis que”, “toda carne” e “diante dos seus olhos”. A pontuação esclarece as três afirmações sem apagar o paralelismo.
