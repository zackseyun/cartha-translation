  yaml_path: translation/extra_canonical/jubilees/005/009.yaml
  text: And he sent a sword among them so that each might kill his fellow, and they began to kill one another until they all fell by the sword and were wiped out from the earth.
translation:
  language: pt
  text: E enviou uma espada entre eles, para que cada um matasse o seu companheiro; e começaram a matar uns aos outros, até que todos caíram à espada e foram eliminados da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ
  choice: uma espada
  rationale: O substantivo aparece sem pronome possessivo; por isso, evita-se acrescentar «sua». A expressão também pode representar a violência armada desencadeada entre eles.
- source_word: ማእከሎሙ
  choice: para o meio deles
  rationale: Reproduz o sentido espacial da expressão ge'ez de modo claro e natural.
- source_word: ቢጹ
  choice: seu companheiro
  rationale: O termo designa o próximo, semelhante ou companheiro de cada um; «companheiro» preserva a relação recíproca sem restringi-la a parentesco.
- source_word: እስከ፡ ወድቁ፡ ኵሎሙ፡ ውስተ፡ ሰይፍ
  choice: até que todos caíram à espada
  rationale: Mantém a imagem idiomática de morrer pela espada, com formulação corrente em português bíblico moderno.
- source_word: ተደምሰሱ፡ እምነ፡ ምድር
  choice: foram eliminados da terra
  rationale: Expressa a ideia de serem apagados, destruídos ou removidos da terra, sem intensificação adicional.
theological_decisions:
- issue: Agente que envia a espada
  choice: E enviou
  alternative: E ele enviou
  rationale: O verbo ge'ez contém sujeito masculino singular, mas o referente vem do contexto. O sujeito oculto é natural em português e não explicita além da fonte quem é o agente.
- issue: Natureza da espada
  choice: uma espada
  alternative: sua espada
  rationale: A fonte apresentada não traz possessivo; a tradução preserva isso e não transforma a espada explicitamente em posse ou instrumento pessoal do agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a coordenação narrativa e a imagem bíblica «caíram à espada», evitando arcaísmos desnecessários.
