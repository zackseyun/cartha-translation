  text: And Noah made the ark in every respect as He commanded him, in the twenty-sixth jubilee of years, in the fifth week, in the fifth year.
translation:
  language: pt
  text: E Noé fez a arca em todos os detalhes, conforme Deus lhe havia ordenado, no vigésimo sexto jubileu de anos, na quinta semana, no quinto ano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ኖኅ፡ ታቦተ
  choice: Noé fez a arca
  rationale: Reproduz diretamente o verbo ativo e seus complementos, em português natural.
- source_word: በኵሉ
  choice: em todos os detalhes
  rationale: Expressa a ideia adverbial de totalidade, isto é, que a construção seguiu integralmente a ordem recebida.
- source_word: በከመ፡ አዘዞ
  choice: conforme Deus lhe havia ordenado
  rationale: Mantém a construção ativa de አዘዞ e explicita como Deus o sujeito subentendido pelo contexto, evitando a forma passiva da tradição anterior.
- source_word: በዕሥራ፡ ወስድስቱ፡ ኢዮቤልው፡ ዓመታት
  choice: no vigésimo sexto jubileu de anos
  rationale: Conserva o número vinte e seis e a terminologia cronológica própria do livro.
- source_word: በኃምስ፡ ሱባዔ፡ በኃምስ፡ ዓመት
  choice: na quinta semana, no quinto ano
  rationale: Preserva a fórmula cronológica e sua sequência hierárquica.
theological_decisions:
- issue: Sujeito subentendido de አዘዞ
  choice: Deus lhe havia ordenado
  alternative: ele lhe havia ordenado / conforme lhe havia sido ordenado
  rationale: A forma verbal é ativa e inclui Noé como objeto; Deus é o referente contextual mais provável. A explicitação evita em português uma referência pronominal pouco clara, sem introduzir conteúdo doutrinário adicional.
translation_notes:
  register: Português moderno, digno e acessível, com formulação cronológica preservada. Usa-se “havia ordenado” para indicar que a ordem precedeu a execução da arca.
