  text: And on the twenty-seventh thereof he opened the ark and sent out from it beasts and cattle and birds and everything that moves.
translation:
  language: pt
  text: E, no dia vinte e sete daquele mês, ele abriu a arca e soltou de dentro dela os animais selvagens, os animais domésticos, as aves e tudo o que se move.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ዕሥራ፡ ወሰብዑ፡ ሎቱ
  choice: no dia vinte e sete daquele mês
  rationale: Expressa naturalmente em português a referência temporal ao vigésimo sétimo dia do período já indicado pelo contexto; “daquele mês” explicita o referente implícito do pronome.
- source_word: አራዊተ
  choice: animais selvagens
  rationale: Distingue esta categoria da seguinte, que designa animais domésticos ou gado.
- source_word: እንስሳ
  choice: animais domésticos
  rationale: No contraste com አራዊት, indica os animais domesticados; a formulação é mais abrangente e corrente que “gado”.
- source_word: አዕዋፈ
  choice: aves
  rationale: Equivalente português direto e natural para a categoria das aves.
- source_word: ዘይትነወስ
  choice: tudo o que se move
  rationale: Preserva a expressão abrangente do ge'ez sem restringi-la a uma classe específica de criaturas.
- source_word: ፈነወ
  choice: soltou
  rationale: No contexto da arca, comunica que Noé deixou os animais sair, de modo mais idiomático que “enviou para fora”.
