    issue: «Deu» em lugar de «fez»
    rationale: O texto-fonte apresenta um verbo de fazer/criar. «Deu» pode sugerir a concessão de uma qualidade preexistente, em vez da produção de uma nova natureza.
  - severity: low
    issue: Formulação temporal «nunca mais»
    rationale: Embora compatível com o sentido, antecipa em português uma nuance de cessação. A redação «não pecassem ... para sempre» mantém mais de perto a relação entre a negação, a totalidade da natureza e a duração.
