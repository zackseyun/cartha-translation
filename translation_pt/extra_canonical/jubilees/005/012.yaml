  verdict: revise
  source_fidelity: A tradução capta a estrutura geral e preserva adequadamente a dificuldade da cláusula. Contudo, «deu» enfraquece e altera o verbo de criação («fez»), que deve ser mantido. «Nunca mais» é uma explicitação possível de «até/para sempre», mas «para que não pecassem ... para sempre» reflete mais diretamente a disposição temporal do original.
  naturalness: O texto é compreensível e de registro apropriado. «Por todos os dias» é deliberadamente literal, mas soa pouco natural; «todos os dias» preserva a formulação sem introduzir a ideia mais interpretativa de «para sempre».
  terminology: «Natureza nova e justa» é uma solução defensável para a expressão difícil e deve permanecer assinalada em nota. «Espécie» é apropriado para a ordenação «cada qual segundo o seu tipo».
  issues:
