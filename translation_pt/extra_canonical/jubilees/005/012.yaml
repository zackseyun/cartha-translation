  yaml_path: translation/extra_canonical/jubilees/005/012.yaml
  text: And he made for all his works a new and righteous nature[a], so that they should not sin in all their nature forever, but should all be righteous, each according to its kind, all the days.
translation:
  language: pt
  text: E ele fez para todas as suas obras uma natureza nova e justa[a], para que não pecassem em toda a sua natureza para sempre, mas todas fossem justas, cada uma segundo a sua espécie, todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção desta frase é textual e semanticamente difícil. A tradução preserva a ideia de uma ordenação renovada e justa da criação segundo a espécie, em vez de reduzi-la a uma afirmação genérica.
    reason: textual_variant
lexical_decisions:
- source_word: ግብረ፡ ፍጥረተ፡ ሐዳሰ፡ ወጻድቅተ
  choice: uma natureza nova e justa
  rationale: Mantém a formulação difícil do ge'ez, entendendo a expressão como uma constituição ou natureza renovada e justa, sem reduzi-la a uma declaração genérica.
- source_word: እይረብቡ
  choice: nunca mais pecassem
  rationale: Expressa a ideia de não pecar, enquanto o contexto de renovação e a expressão temporal sustentam 'nunca mais' em português natural.
- source_word: በበ፡ ትዝምዳ
  choice: cada uma segundo a sua espécie
  rationale: Preserva a distribuição de todos os seres segundo seus respectivos tipos ou espécies.
- source_word: ኵሉ፡ መዋዕለ
  choice: por todos os dias
  rationale: Reproduz a expressão temporal abrangente do texto sem convertê-la simplesmente em 'para sempre'.
theological_decisions:
- issue: Alcance da renovação e da justiça
  choice: Aplicar a natureza nova e justa a todas as obras, cada uma segundo a sua espécie
  alternative: Entender a frase apenas como uma afirmação moral genérica sobre seres humanos
  rationale: A linguagem do texto abrange 'todas as suas obras' e mantém a ordenação da criação segundo a espécie; a tradução não restringe o alcance sem apoio textual.
- issue: Impecabilidade futura
  choice: para que nunca mais pecassem
  alternative: para que não errassem ou não se corrompessem
  rationale: A tradução conserva o sentido moral forte indicado pelo verbo e a tensão teológica de uma condição futura em que o pecado deixa de ocorrer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A expressão menos habitual 'por todos os dias' foi mantida para refletir a forma temporal distinta do original; o restante privilegia naturalidade sem apagar a dificuldade textual.
