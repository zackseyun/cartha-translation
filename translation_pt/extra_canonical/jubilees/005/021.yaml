lexical_decisions:
- source_word: ታቦተ
  choice: arca
  rationale: O termo designa aqui a embarcação de Noé; «arca» é a forma bíblica tradicional e amplamente compreendida em português.
- source_word: ማየ፡ አይኅ
  choice: águas do dilúvio
  rationale: Reproduz diretamente a expressão etíope «águas do dilúvio», preservando a imagem concreta e o referente narrativo.
- source_word: ይድኀኖ
  choice: fosse salvo
  rationale: Mantém a construção passiva e a finalidade expressa no texto, sem explicitar um agente que a fonte não nomeia nesta oração.
theological_decisions:
- issue: Agente da salvação de Noé
  choice: manter a forma passiva «fosse salvo»
  alternative: «escapasse» ou «Deus o salvasse»
  rationale: A fonte emprega uma forma passiva; a tradução conserva essa abertura sem reduzir a salvação a mero escape nem acrescentar explicitamente «Deus».
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima da fonte e vocabulário bíblico de ampla compreensão. O antecedente de «E ordenou» permanece implícito, como no texto fornecido.
