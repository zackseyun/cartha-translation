  text: Concerning all, he will judge the great according to his greatness, and the small according to his smallness, and each one according to his way.
translation:
  language: pt
  text: Quanto a todos, ele julgará o grande segundo a sua grandeza, o pequeno segundo a sua pequenez e cada um segundo o seu caminho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዐቢይ / ዐበየ
  choice: o grande / sua grandeza
  rationale: Preserva a repetição e a correspondência lexical do texto ge'ez, sem interpretar “grandeza” como posição, poder ou culpa.
- source_word: ለንኡስ / ንእሰ
  choice: o pequeno / sua pequenez
  rationale: Mantém o paralelismo antitético com “grande/grandeza” e conserva a abertura semântica do original.
- source_word: ፍኖቱ
  choice: seu caminho
  rationale: “Caminho” reproduz a metáfora ética tradicional do termo e evita restringi-lo a atos isolados ou a uma sentença específica.
- source_word: ይኴንኖ
  choice: julgará
  rationale: Expressa diretamente o sentido judicial do verbo no contexto e mantém o valor futuro indicado pela forma e pela camada de consulta.
theological_decisions:
- issue: Critério do julgamento
  choice: segundo a sua grandeza… segundo a sua pequenez… segundo o seu caminho
  alternative: conforme sua posição ou medida de culpa
  rationale: A tradução conserva a tensão e a formulação proporcional do texto, sem definir em que consiste a grandeza ou a pequenez nem impor uma teoria específica de juízo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com paralelismo deliberadamente preservado. A formulação literal “grandeza/pequenez” foi mantida por sua importância retórica e por não exigir explicitação interpretativa.
