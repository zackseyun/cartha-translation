  yaml_path: translation/extra_canonical/jubilees/005/020.yaml
  text: And the Lord said that He would destroy everything that is on the dry land, from man to cattle, to beasts, and to the birds of heaven, and to whatever moves on the earth.
translation:
  language: pt
  text: E o Senhor disse que destruiria tudo o que está sobre a terra seca, desde os seres humanos até os animais domésticos, os animais selvagens, as aves do céu e tudo o que se move sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የብስ
  choice: terra seca
  rationale: Distingue a porção seca da terra das águas e corresponde ao sentido concreto do termo ge'ez.
- source_word: እሰብእ
  choice: seres humanos
  rationale: Expressa de modo inclusivo e natural a referência coletiva à humanidade.
- source_word: እንስሳ
  choice: animais domésticos
  rationale: No contraste com አራዊት, indica mais especificamente os animais mantidos pelo ser humano, não os animais em geral.
- source_word: አራዊት
  choice: animais selvagens
  rationale: Preserva o contraste lexical com os animais domésticos.
- source_word: ዘይትሐወስ
  choice: tudo o que se move
  rationale: Mantém a formulação abrangente do texto sem restringi-la a uma classe zoológica específica.
theological_decisions:
- issue: Discurso direto ou indireto e voz verbal
  choice: “o Senhor disse que destruiria”
  alternative: '“o Senhor disse: ‘Seja destruído tudo...’”'
  rationale: A forma verbal ge'ez é ativa, na terceira pessoa, e rege o objeto “tudo”; por isso, a leitura mais bem sustentada é a de discurso indireto, no qual o Senhor é o agente da destruição.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A enumeração foi apresentada naturalmente após dois-pontos, sem enfraquecer sua abrangência nem eliminar a distinção entre animais domésticos e selvagens.
