base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/001.yaml
  text: And it came to pass, when the children of men began to multiply on the face of the earth, and daughters were born to them, that in a certain year of this jubilee the angels of God saw them, that they were beautiful to look upon; and they took wives for themselves from all whom they chose, and they bore children for them, and these were the giants.
translation:
  language: pt
  text: E aconteceu que, quando os filhos dos homens começaram a se multiplicar sobre a face da terra e lhes nasceram filhas, os anjos de Deus as viram, em certo ano deste jubileu, e perceberam que eram belas de se ver. Então tomaram para si mulheres dentre todas as que escolheram; elas lhes deram filhos, e estes foram os gigantes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: os filhos dos homens
  rationale: Expressão tradicional e semanticamente próxima do ge'ez, referindo-se aos seres humanos sem estreitar indevidamente o sentido.
- source_word: ዲበ፡ ገጸ፡ ለምድር
  choice: sobre a face da terra
  rationale: Preserva a imagem concreta e o caráter escritural da expressão-fonte.
- source_word: መላእክተ፡ እግዚአብሔር
  choice: os anjos de Deus
  rationale: Tradução direta da leitura explícita do texto ge'ez de Jubileus, sem substituí-la pela formulação de Gênesis 'filhos de Deus'.
- source_word: ሠናያት፡ ለርእይ
  choice: belas de se ver
  rationale: Mantém tanto a avaliação de beleza quanto o componente visual da expressão.
- source_word: ነሥእዎን፡ ሎሙ፡ አንስቲያ
  choice: tomaram para si mulheres
  rationale: Reproduz a ação e sua possível tensão coercitiva, sem suavizá-la com linguagem de casamento consensual.
- source_word: ረዐይት
  choice: gigantes
  rationale: Segue o valor lexical adotado pela tradição textual e pela edição de consulta para os descendentes dessa união.
theological_decisions:
- issue: Identidade dos seres celestes
  choice: anjos de Deus
  alternative: filhos de Deus
  rationale: O texto ge'ez apresentado diz explicitamente 'anjos de Deus'; a tradução não harmoniza o versículo com formulações alternativas de Gênesis 6.
- issue: Natureza da tomada das mulheres
  choice: tomaram para si mulheres
  alternative: casaram-se com mulheres
  rationale: A formulação conserva a ambiguidade moral e a tensão do verbo, evitando introduzir a ideia mais específica de casamento formal.
- issue: Identidade da descendência
  choice: estes foram os gigantes
  alternative: eles eram gigantes
  rationale: Mantém a identificação enfática da cláusula final sem desenvolver uma interpretação sobre a natureza dos gigantes.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência escritural. Emprega 'filhos dos homens' e 'face da terra' por sua transparência e intertextualidade, mas evita construções excessivamente arcaicas. Nenhum marcador de nota é necessário.
