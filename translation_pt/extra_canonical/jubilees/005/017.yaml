base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/017.yaml
  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: pt
  text: 'E a respeito dos filhos de Israel foi escrito e estabelecido: se eles voltarem para ele com justiça, ele perdoará todas as suas transgressões e absolverá todos os seus pecados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቀ፡ እስራኤል
  choice: filhos de Israel
  rationale: Expressão tradicional e natural em português bíblico, correspondente ao sentido coletivo de descendentes ou povo de Israel.
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: foi escrito e estabelecido
  rationale: Preserva os dois verbos passivos e a ideia de algo registrado e ordenado ou determinado.
- source_word: ተመይጡ፡ ኀቤሁ
  choice: voltarem para ele
  rationale: Reproduz diretamente o movimento de retorno a ele, sem explicitar além do texto se se trata de arrependimento.
- source_word: በጽድቅ
  choice: com justiça
  rationale: Mantém o substantivo 'justiça' e evita resolver sua possível nuance modal como 'sinceramente' ou 'em retidão'.
- source_word: የኀድግ
  choice: perdoará
  rationale: No contexto de transgressões, exprime naturalmente a ideia de deixar ou remitir as faltas.
- source_word: ይስሬ
  choice: absolverá
  rationale: Distingue o segundo verbo do primeiro e comunica a remissão dos pecados sem introduzir uma formulação denominacional.
theological_decisions:
- issue: Relação entre o retorno em justiça e o perdão
  choice: 'Preservar a construção condicional: ''se eles voltarem para ele com justiça, ele perdoará...'''
  alternative: Explicitar o retorno como arrependimento sincero ou como condição meritória
  rationale: O texto associa o retorno ao perdão, mas não define a natureza exata da relação nem autoriza uma sistematização teológica adicional.
- issue: Referente do pronome 'ele'
  choice: Manter o pronome em minúscula
  alternative: Substituir por 'Deus' ou usar maiúscula reverencial
  rationale: O original emprega referência pronominal; mantê-la preserva a forma e evita inserir um nome não expresso neste versículo.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência bíblica. A formulação conserva o paralelismo entre 'transgressões' e 'pecados' e entre 'perdoará' e 'absolverá'.
