  yaml_path: translation/extra_canonical/jubilees/005/007.yaml
  text: And concerning their sons, a word went out from before his face that they should be struck down with the sword and removed from under heaven.
translation:
  language: pt
  text: E a respeito dos filhos deles, saiu uma palavra de diante de sua face para que fossem abatidos à espada e removidos de debaixo do céu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይምሐጾሙ (yəmḥaṣṣomu)
  choice: fossem abatidos
  rationale: O verbo exprime golpear ou ferir; no contexto da espada, «abater» comunica o resultado letal sem substituir a imagem concreta por «exterminar».
- source_word: በሰይፍ (ba-sayf)
  choice: à espada
  rationale: Formulação portuguesa natural que preserva explicitamente o instrumento indicado no ge'ez.
- source_word: ያሰስሎሙ (yāsassəlomu)
  choice: removidos
  rationale: Preserva o sentido específico de retirar ou remover, evitando o mais interpretativo «destruídos».
- source_word: እምቅድመ ገጹ (ʾəm-qədma gaṣṣu)
  choice: de diante de sua face
  rationale: Mantém a expressão antropomórfica formal do texto, sem reduzi-la simplesmente a «dele».
- source_word: እምታሕተ ሰማይ (ʾəm-taḥta samāy)
  choice: de debaixo do céu
  rationale: Reproduz a construção espacial da fonte e sua ideia de eliminação do âmbito terrestre.
theological_decisions:
- issue: Agente referido pelo pronome em «sua face»
  choice: Manter o pronome sem explicitar o referente
  alternative: Substituir por «da face de Deus» ou «de diante do Senhor»
  rationale: O versículo usa um pronome; explicitar Deus ou Senhor resolveria no texto uma referência que deve ser determinada pelo contexto.
- issue: Relação entre a palavra decretada e a execução do juízo
  choice: «para que fossem»
  alternative: «ordenando que fossem»
  rationale: A construção final preserva a formulação da fonte sem acrescentar explicitamente a noção de ordem, embora ela seja plausível no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a solenidade de «saiu de diante de sua face uma palavra», pois a formulação marcada pertence à imagem do texto; os verbos do juízo foram vertidos com precisão concreta, sem intensificação denominacional ou interpretativa.
