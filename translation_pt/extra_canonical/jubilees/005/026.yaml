  text: And the waters rose upon the earth fifteen cubits; the waters rose high above all the high mountains, and the ark was lifted up from the earth and floated on the surface of the waters.
translation:
  language: pt
  text: E as águas subiram quinze côvados sobre a terra; as águas se elevaram acima de todos os montes altos, e a arca foi erguida da terra e flutuou sobre a superfície das águas.
