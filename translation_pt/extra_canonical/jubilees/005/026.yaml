lexical_decisions:
- source_word: ዐሠርት፡ ወኃምስተ፡ በእመት
  choice: quinze côvados
  rationale: Reproduz diretamente a medida do texto ge'ez, usando a forma tradicional e inteligível em contexto bíblico.
- source_word: ተለዐለ፡ ማያት
  choice: as águas se elevaram
  rationale: Conserva a ideia de elevação das águas e evita acrescentar uma intensidade que não precisa ser explicitada.
- source_word: ኵሉ፡ ደብር፡ ነዋኅ
  choice: todos os montes altos
  rationale: Mantém tanto a abrangência de 'todos' quanto a qualificação de altura presente no original.
- source_word: ተንሰፈ
  choice: flutuou
  rationale: Expressa naturalmente em português o movimento da arca sustentada pelas águas.
- source_word: ዲበ፡ ገጸ፡ ማያት
  choice: sobre a superfície das águas
  rationale: Traduz literalmente a imagem da 'face das águas' por uma expressão corrente em português.
