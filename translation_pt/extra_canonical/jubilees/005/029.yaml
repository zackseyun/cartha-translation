  text: And in the fourth month the fountains of the great deep were closed[a], and the floodgates of heaven were restrained; and at the beginning of the seventh month all the mouths of the depths of the earth were opened, and the waters began to descend into the lower deep.
translation:
  language: pt
  text: E no quarto mês, as fontes do grande abismo foram fechadas[a], e as comportas do céu foram refreadas; e, no início do sétimo mês, abriram-se todas as bocas dos abismos da terra, e as águas começaram a descer para o abismo inferior.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação pode parecer paradoxal: depois que as fontes do abismo são “fechadas”, as bocas dos abismos da terra são “abertas” para que as águas desçam ao abismo inferior. A tradução preserva essa sequência cosmológica, sem tentar harmonizá-la.'
    reason: textual_variant
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: as fontes do grande abismo
  rationale: Reproduz a expressão cosmológica do texto, com vocabulário bíblico natural e sem reinterpretar o referente.
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: as comportas do céu
  rationale: Expressa de modo claro a imagem de aberturas celestes que regulam as águas.
- source_word: ተአኀዘ
  choice: foram contidas
  rationale: Preserva a distinção em relação a “foram fechadas” e comunica que as comportas foram refreadas ou impedidas de continuar liberando água.
- source_word: በሠርቀ፡ ወርኀ፡ ሳብዕ
  choice: no início do sétimo mês
  rationale: Traduz naturalmente a indicação temporal, sem impor a interpretação mais específica de “lua nova”.
- source_word: ኵሉ፡ አፈወ፡ መዓምቅተ፡ ምድር
  choice: todas as entradas dos abismos da terra
  rationale: “Entradas” comunica o sentido figurado de “bocas” em português corrente, mantendo a pluralidade e a cosmologia do original.
- source_word: ቀላይ፡ ታሕቲት
  choice: o abismo inferior
  rationale: Mantém a referência espacial ao reservatório profundo situado abaixo, sem harmonizá-la com uma cosmologia moderna.
theological_decisions:
- issue: A aparente tensão entre o fechamento das fontes e a abertura posterior das entradas dos abismos
  choice: Preservar a sequência tal como está no texto
  alternative: Harmonizar as duas ações ou tratar a abertura como fechamento
  rationale: A formulação descreve primeiro o fechamento das fontes e depois a abertura de vias pelas quais as águas descem; a tradução não deve eliminar essa tensão cosmológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente compreensível. A estrutura semicolonada conserva a progressão das ações sem soar excessivamente arcaica.
