  text: And he said, “I will destroy man and all flesh upon the face of the earth, which I created.”
translation:
  language: pt
  text: 'E ele disse: “Destruirei o ser humano e toda carne sobre a face da terra que criei.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አይመሰለ
  choice: Exterminarei
  rationale: No contexto do juízo do dilúvio, expressa a eliminação completa da humanidade e dos seres de carne; “exterminarei” é claro, solene e natural em português.
- source_word: ለሰብእ
  choice: o ser humano
  rationale: Traduz o termo coletivo para a humanidade sem restringi-lo ao sexo masculino.
- source_word: ለኵሉ፡ ዘሥጋ
  choice: toda carne
  rationale: Mantém a expressão concreta e abrangente do texto, tradicional na linguagem bíblica, sem explicitar além da fonte quais seres estão incluídos.
- source_word: በመልዕልተ፡ ገጸ፡ ምድር
  choice: sobre a face da terra
  rationale: Reproduz a preposição ge'ez com sentido locativo, “sobre”, evitando o acréscimo de “de”, que não consta desta forma do texto.
theological_decisions:
- issue: Referente da oração relativa “que criei”
  choice: Manter a oração imediatamente após “terra”, sem explicação interpretativa
  alternative: Reformular para ligá-la explicitamente ao ser humano ou a toda carne
  rationale: A ordem da fonte permite que a relação sintática permaneça aberta; a tradução não deve resolver silenciosamente essa possível ambiguidade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência bíblica natural. Conserva “toda carne” e “face da terra” por serem expressões inteligíveis e próximas da forma da fonte.
