base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/014.yaml
  text: And if they do not walk in it[a], judgment is written for every creature and for every kind. And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the deep or in the place of darkness—all their judgments are ordained and written and engraved.
translation:
  language: pt
  text: 'E, se não andarem nela, o juízo está escrito para toda criatura e para toda espécie. Nada há no céu nem na terra, nem na luz nem nas trevas, nem no Sheol, nem no abismo, nem no lugar de escuridão[a]: todos os seus juízos estão determinados, escritos e gravados.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência “no céu... na terra... na luz... nas trevas... no Sheol... no abismo... no lugar de escuridão” forma uma enumeração cosmológica abrangente.
    reason: cultural_note
  - marker: b
    text: A tríade “determinados, escritos e gravados” preserva a imagem jurídica de decisões fixadas em um registro permanente. Uma leitura anterior, baseada na forma transmitida do texto, vertia a expressão como “tudo está determinado”.
    reason: textual_note
lexical_decisions:
- source_word: ሲኦል
  choice: Sheol
  rationale: Mantém o nome tradicional do domínio dos mortos, sem reduzi-lo a “inferno” e sem impor uma interpretação teológica posterior.
- source_word: ቀላይ
  choice: abismo
  rationale: Expressa a profundidade cósmica evocada pelo termo e se ajusta ao registro abrangente da enumeração.
- source_word: መጽልም
  choice: lugar de escuridão
  rationale: Preserva a referência espacial e a distinção formal em relação ao termo anterior traduzido por “trevas”.
- source_word: ሥሩዕ፡ ወጽሑፍ፡ ወቅሩጽ
  choice: determinados, escritos e gravados
  rationale: Conserva a tríade enfática e sua imagem de decisões fixadas em registro permanente.
- source_word: ኵነኔሆሙ (emenda contextual para a forma transmitida ዘነኒሆሙ)
  choice: seus juízos
  rationale: A emenda reconhece a provável corrupção de transmissão e recupera o substantivo judicial exigido pelo contexto e pela concordância da frase.
theological_decisions:
- issue: Referência ao mundo dos mortos
  choice: Sheol
  alternative: inferno
  rationale: “Sheol” preserva a categoria cosmológica antiga e evita identificar automaticamente o termo com uma doutrina posterior de punição eterna.
- issue: Alcance universal do juízo
  choice: para toda criatura e para toda espécie
  alternative: para toda criatura e toda parentela
  rationale: “Espécie” comunica de modo natural a abrangência classificatória da expressão sem restringi-la apenas a relações humanas de parentesco.
- issue: Objeto da cláusula final
  choice: todos os seus juízos
  alternative: tudo
  rationale: A leitura adotada mantém o foco jurídico da passagem e segue a provável restauração do substantivo “juízos” no texto transmitido.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. A enumeração paralela e a tríade final foram preservadas para manter o ritmo e a ênfase jurídica do original.
