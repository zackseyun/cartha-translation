  yaml_path: translation/extra_canonical/jubilees/005/023.yaml
  text: And he entered it in its sixth year[a], in the second month, on the new moon of the second month, until the sixteenth; and he entered, he and all that we brought to him, into the ark, and the Lord shut it from outside on the seventeenth evening.
translation:
  language: pt
  text: E ele entrou nela no sexto ano, no segundo mês, desde a lua nova do segundo mês até o dia dezesseis.[a] Então ele e tudo o que trouxemos para junto dele entraram na arca, e o Senhor a fechou por fora, na tarde do dia dezessete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência das datas neste versículo é difícil. Ela parece situar a entrada na arca entre a lua nova do segundo mês e o dia dezesseis, seguida pelo fechamento da arca pelo Senhor na tarde do dia dezessete.
    reason: segmentation_note
lexical_decisions:
- source_word: በሳድስ
  choice: no sexto ano
  rationale: O numeral ge'ez significa literalmente “sexto”; o contexto cronológico de Jubileus favorece o sexto ano do ciclo, sem harmonização com o sexcentésimo ano de Noé em Gênesis.
- source_word: በሠርቅ
  choice: desde a lua nova
  rationale: Preserva o termo calendárico “lua nova”, característico de Jubileus, em vez de substituí-lo interpretativamente por “primeiro dia”.
- source_word: ታቦት
  choice: arca
  rationale: É a designação portuguesa tradicional e clara para a embarcação de Noé neste contexto.
- source_word: እግዚአብሔር
  choice: o Senhor
  rationale: Equivalente português corrente e digno para o título divino ge'ez.
- source_word: እንተ፡ አፍአሁ
  choice: por fora
  rationale: Reproduz a indicação espacial de que o Senhor fechou a arca do lado de fora.
theological_decisions:
- issue: Relação entre a cronologia de Jubileus e Gênesis
  choice: “no sexto ano”
  alternative: “no sexcentésimo ano”
  rationale: A tradução segue a leitura explícita በሳድስ e mantém o sistema cronológico próprio de Jubileus, sem impor a formulação de Gênesis.
- issue: Identidade do plural em “trouxemos”
  choice: manter a primeira pessoa do plural sem identificar os agentes
  alternative: explicitar “os anjos trouxeram”
  rationale: O texto traz a primeira pessoa do plural, mas este versículo não identifica expressamente quem fala; a tradução preserva essa abertura.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. A repetição pouco natural do verbo “entrar” foi suavizada sem apagar a sequência do original; conservaram-se a expressão calendárica “lua nova”, a primeira pessoa plural “trouxemos” e a indicação “por fora”.
