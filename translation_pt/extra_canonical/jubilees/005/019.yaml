base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/019.yaml
  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
translation:
  language: pt
  text: Mas, entre todos os que corromperam seus caminhos e seus planos antes do Dilúvio[a], não se mostrou favor a nenhum deles, exceto somente a Noé. Pois a ele se mostrou favor em benefício de seus filhos, que ele salvou das águas do Dilúvio por causa de Noé, visto que o coração de Noé era justo em todos os seus caminhos, de acordo com o que lhe havia sido ordenado, e ele não se desviou de nada do que lhe fora determinado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida como “antes do Dilúvio” é difícil no texto ge'ez e envolve as “águas do Dilúvio”. O sentido geral é que, naquela geração, ninguém além de Noé recebeu consideração favorável.
    reason: lexical_alternative
lexical_decisions:
- source_word: አማሰኑ፡ ፍኖዊሆሙ፡ ወምክርሙ
  choice: corromperam seus caminhos e seus planos
  rationale: Mantém os dois objetos do texto ge'ez e expressa em português corrente tanto a conduta quanto os desígnios dessas pessoas.
- source_word: ኢተነሥአ፡ ገጾሙ / ተነሥአ፡ ሎቱ፡ ገጸ
  choice: não se mostrou favor a nenhum deles / a ele se mostrou favor
  rationale: A expressão idiomática de levantar o rosto indica acolhimento ou consideração favorável; 'mostrar favor' comunica o sentido sem introduzir a ideia específica de parcialidade.
- source_word: በእንተ፡ ውሉዱ
  choice: em benefício de seus filhos
  rationale: Distingue esta relação da frase seguinte, na qual os filhos são salvos por causa de Noé, e evita sugerir que o mérito dos filhos tenha causado o favor concedido a ele.
- source_word: ዘሥሩዕ፡ ሎቱ
  choice: do que lhe fora determinado
  rationale: Representa aquilo que havia sido estabelecido ou prescrito para Noé, preservando a força normativa do original.
theological_decisions:
- issue: Referente do sujeito na oração sobre salvar os filhos
  choice: que ele salvou das águas do Dilúvio
  alternative: que Deus salvou das águas do Dilúvio
  rationale: O original emprega uma forma verbal sem explicitar aqui o nome de Deus. O pronome mantém a forma e a tensão referencial do texto, enquanto a explicitação de 'Deus' resolveria silenciosamente a ambiguidade.
- issue: Fundamento da salvação dos filhos
  choice: por causa de Noé
  alternative: por causa deles
  rationale: O sufixo singular aponta para Noé; a redação deixa claro que o benefício alcança os filhos em razão dele, sem acrescentar uma formulação doutrinária externa.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais no Brasil e compreensíveis internacionalmente. A repetição de “Noé” em dois pontos esclarece referentes potencialmente confusos sem eliminar a ambiguidade do sujeito de “salvou”.
