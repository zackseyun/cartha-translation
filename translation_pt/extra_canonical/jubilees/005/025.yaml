  text: And the fountains of the deep also sent up waters until the whole world was full of water.
translation:
  language: pt
  text: E também as fontes do abismo fizeram subir as águas, até que o mundo inteiro ficou cheio de água.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንቅዐተ፡ ቀላይሂ
  choice: as fontes do abismo
  rationale: Traduz a expressão etíope referente às fontes ou nascentes das profundezas, preservando a imagem tradicional do relato do dilúvio.
- source_word: ያዐርጉ፡ ማያተ
  choice: fizeram subir suas águas
  rationale: Mantém o movimento ascendente expresso pelo verbo e representa o sufixo possessivo ligado a “águas”.
- source_word: ኵሉ፡ ዓለም
  choice: o mundo inteiro
  rationale: Correspondência natural e abrangente para “todo o mundo”, sem restringir antecipadamente o alcance da expressão.
- source_word: መልአ ... ማየ
  choice: ficou coberto de água
  rationale: A construção significa literalmente que o mundo “se encheu de água”; em português, “ficou coberto de água” comunica com naturalidade a cena do dilúvio sem alterar seu alcance.
theological_decisions:
- issue: Alcance de “o mundo inteiro”
  choice: Preservar a formulação abrangente do texto
  alternative: Interpretar explicitamente como toda a Terra ou apenas a terra habitada
  rationale: A tradução não resolve a questão geográfica além do que afirma a expressão-fonte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural e vocabulário reconhecível no contexto do dilúvio.
