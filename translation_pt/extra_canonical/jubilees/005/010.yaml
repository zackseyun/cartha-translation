  yaml_path: translation/extra_canonical/jubilees/005/010.yaml
  text: And their fathers were watching, and after this they were bound in the depths of the earth forever, until the day of the great judgment, for judgment upon all who corrupted their ways and their deeds before the Lord.
translation:
  language: pt
  text: E os pais deles vigiavam; depois disso, foram presos nas profundezas da terra para sempre, até o dia do grande juízo, para o juízo sobre todos[a] os que corromperam seus caminhos e suas obras diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o julgamento de todos”.'
    reason: Registra a construção alternativa já reconhecida, enquanto o texto principal preserva melhor a força de “sobre” no ge'ez.
lexical_decisions:
- source_word: ይኔጽሩ
  choice: estavam vigiando
  rationale: Preserva o valor verbal do texto ge'ez e a leitura adotada pela camada de consulta, sem converter implicitamente a forma em um título como “Vigilantes”.
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: nas profundezas da terra
  rationale: Reproduz de modo natural a imagem espacial do original.
- source_word: ተአስሩ
  choice: foram presos
  rationale: Expressa a ação passiva de amarrar ou manter em cativeiro; “presos” é claro e corrente no contexto.
- source_word: ፍኖቶሆሙ፡ ወምግባሪሆሙ
  choice: seus caminhos e suas obras
  rationale: Mantém os dois termos e a linguagem moral figurada do original, sem fundi-los em uma única ideia.
theological_decisions:
- issue: Identidade dos pais mencionados
  choice: os pais deles estavam vigiando
  alternative: os pais deles, os Vigilantes
  rationale: A forma foi mantida como verbo, conforme o texto fornecido e a leitura auditada, evitando introduzir como título uma identificação que resolveria a ambiguidade.
- issue: Alcance e direção do juízo
  choice: para juízo sobre todos
  alternative: para o julgamento de todos
  rationale: “Sobre todos” conserva a força direcional de ዲበ e indica o juízo exercido contra ou sobre os que corromperam sua conduta; a alternativa possível é registrada em nota.
- issue: Tensão entre duração indefinida e termo do encarceramento
  choice: para sempre, até o dia do grande juízo
  alternative: até o dia do grande juízo
  rationale: Mantém ambos os elementos temporais presentes no original, sem suavizar sua tensão aparente.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se a repetição conceitual de “juízo” e a tensão temporal do original.
