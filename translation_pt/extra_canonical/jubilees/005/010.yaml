review_pass:
  verdict: revise
  source_fidelity: 'O texto conserva os elementos centrais do ge''ez: os pais em atividade de vigilância, a prisão nas profundezas da terra, a dupla indicação temporal (“para sempre” e “até o dia do grande juízo”) e o juízo dirigido contra os que corromperam seus caminhos e obras diante do Senhor. A formulação principal deve, porém, empregar o artigo em “para o juízo”, para representar de modo idiomático a repetição nominal presente no original sem enfraquecer “sobre todos”.'
  naturalness: “Para juízo sobre todos” é compreensível, mas soa elíptico e pouco natural no português moderno. “Para o juízo sobre todos” é claro, solene sem ser arcaizante e preserva a estrutura deliberadamente repetitiva do versículo. “Vigiavam” é uma realização mais fluente do imperfeito do que “estavam vigiando”, sem alterar o aspecto verbal.
  terminology: “Grande juízo”, “Senhor”, “caminhos” e “obras” são adequados ao registro e à terminologia do texto. Mantém-se “sobre todos” no texto principal, pois reproduz melhor a direção de ዲበ do que uma formulação simplesmente possessiva; a alternativa é conservada em nota.
  issues:
