revisions:
- from: E os pais deles estavam vigiando; depois disso, foram presos nas profundezas da terra para sempre, até o dia do grande juízo, para juízo sobre todos[a] os que corromperam seus caminhos e suas obras diante do Senhor.
  to: E os pais deles vigiavam; depois disso, foram presos nas profundezas da terra para sempre, até o dia do grande juízo, para o juízo sobre todos[a] os que corromperam seus caminhos e suas obras diante do Senhor.
  rationale: 'A revisão limita-se a dois aperfeiçoamentos seguros de português: substitui a perífrase progressiva por um imperfeito simples e introduz o artigo em “para o juízo”. Não resolve a ambiguidade contextual de “os pais deles”, não introduz “Vigilantes” como título e preserva tanto a tensão temporal quanto a direção do juízo expressa no texto-fonte.'
