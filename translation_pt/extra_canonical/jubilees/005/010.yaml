    rationale: Embora não seja impossível, a expressão é menos idiomática em português. O artigo definido torna natural a referência ao juízo já anunciado, mantendo a repetição do original.
  - severity: low
    issue: Perífrase progressiva “estavam vigiando”.
    rationale: “Vigiavam” comunica adequadamente o imperfeito e oferece leitura mais direta em português, sem transformar o verbo em título ou identificação doutrinária.
