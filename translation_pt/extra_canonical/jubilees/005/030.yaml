lexical_decisions:
- source_word: በሠርቀ፡ ወርኀ፡
  choice: na lua nova
  rationale: A expressão etíope designa o começo ou nascimento do mês, entendido como lua nova; a escolha preserva a imagem calendárica explícita no texto.
- source_word: አርእስተ፡ አድባር፡
  choice: os cumes dos montes
  rationale: Tradução direta de ‘cabeças/topos dos montes’, em formulação natural e digna em português.
- source_word: አስተርአየት፡ ምድር፡
  choice: apareceu a terra
  rationale: Mantém o verbo de aparição e não acrescenta uma explicação como ‘ficou seca’ ou ‘tornou-se visível’.
