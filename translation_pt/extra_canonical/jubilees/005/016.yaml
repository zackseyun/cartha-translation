base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/016.yaml
  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
translation:
  language: pt
  text: Ele não faz acepção de pessoas nem aceita suborno quando declara que julgará cada um. Ainda que alguém lhe desse tudo o que há na terra, ele não faria acepção de pessoas nem aceitaria a oferta, e nada receberia da mão dessa pessoa, pois é juiz justo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይነሥእ ገጸ
  choice: faz acepção de pessoas
  rationale: A expressão literalmente ligada a “tomar o rosto” é um idiomatismo judicial para favorecer alguém ou mostrar parcialidade; a formulação escolhida preserva o tom bíblico e é amplamente compreensível em português.
- source_word: ይነሥእ ሕሊና
  choice: aceita suborno
  rationale: No contexto de julgamento e parcialidade, a expressão designa a aceitação de algo oferecido para influenciar a decisão; “suborno” comunica com precisão essa força judicial.
- source_word: ይገበር ዘንተ ለለ፻፻
  choice: julgará cada um
  rationale: A construção se refere à execução individual do juízo; em português, “julgará cada um” expressa isso naturalmente sem acrescentar uma definição do veredito.
- source_word: ኢይትሜጠው እምእዴሁ
  choice: nada receberia da mão dessa pessoa
  rationale: O verbo indica receber, tomar ou aceitar; esta tradução mantém tanto a ação quanto a imagem concreta da mão, evitando a leitura menos precisa de que o juiz seria apenas “influenciado”.
- source_word: መኰንን ጽድቅ
  choice: juiz justo
  rationale: Tradução direta e idiomática do título e de sua qualificação moral.
theological_decisions:
- issue: Imparcialidade e incorruptibilidade do juiz
  choice: Atribuir diretamente ao juiz a recusa de parcialidade, suborno e qualquer oferta humana
  alternative: Generalizar a afirmação como princípio abstrato de justiça
  rationale: O texto apresenta essas qualidades como ações e caráter do próprio juiz; a tradução conserva essa referência pessoal sem identificar além do que o versículo explicita.
translation_notes:
  register: Português moderno, digno e acessível, com leve ressonância bíblica em “acepção de pessoas”. O período conserva a repetição enfática do original, mas emprega “dessa pessoa” para evitar ambiguidade no referente da mão.
