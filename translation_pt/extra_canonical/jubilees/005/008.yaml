  text: And he said, “My spirit shall not abide upon man forever, for they too are flesh; and their days shall be one hundred and twenty years.”
translation:
  language: pt
  text: 'E ele disse: “Meu espírito não permanecerá sobre o ser humano para sempre, pois eles também são carne; e os dias deles serão cento e vinte anos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይነብር (yənabbər)
  choice: permanecerá
  rationale: Expressa a ideia de continuar, habitar ou permanecer, preservando aqui o valor durativo do verbo.
- source_word: ዲበ (diba)
  choice: sobre
  rationale: Traduz diretamente a preposição ge'ez ‘sobre’, sem harmonizá-la com a leitura tradicional ‘no’ de Gênesis.
- source_word: ሰብእ (sabəʾ)
  choice: o ser humano
  rationale: Termo coletivo para a humanidade, vertido de modo inclusivo e natural em português moderno.
- source_word: እሙንቱኒ (ʾəmuntu-ni)
  choice: eles também
  rationale: O enclítico -ni comunica ‘também’, nuance explícita que deve ser preservada.
- source_word: ምእት ወዕሥራ ዓመት
  choice: cento e vinte anos
  rationale: Tradução direta da expressão numérica ge'ez.
theological_decisions:
- issue: Relação do espírito com a humanidade
  choice: sobre o ser humano
  alternative: no ser humano
  rationale: A forma ‘sobre’ mantém a preposição específica do texto ge'ez e evita resolver a formulação por harmonização com outra tradição textual.
- issue: Sentido dos cento e vinte anos
  choice: os dias deles serão cento e vinte anos
  alternative: a vida deles será de cento e vinte anos / restam cento e vinte anos
  rationale: A tradução conserva a ambiguidade do enunciado entre limite da vida humana e prazo até o juízo, sem impor uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação coletiva ‘o ser humano’ seguida de ‘eles’ preserva a passagem do singular genérico ao plural presente no ge'ez.
