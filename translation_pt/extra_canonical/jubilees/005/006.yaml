base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/006.yaml
  text: And against his angels whom he had sent to the earth he was exceedingly angry[a], so as to strip them of all their dominion; and he told us to bind them in the depths of the earth, and behold, they are bound within them and separated.
translation:
  language: pt
  text: E contra os seus anjos, que ele havia enviado à terra, irou-se profundamente, a ponto de despojá-los de todo o seu domínio.[a] E nos[b] ordenou que os prendêssemos nas profundezas da terra; e eis que estão presos dentro delas e separados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A relação entre a ira e a perda do domínio também pode ser entendida: «irou-se profundamente e os despojou de todo o seu domínio».'
    reason: textual_ambiguity
  - marker: b
    text: O plural «nos» pertence à moldura narrativa de Jubileus, na qual um mediador angelical relata as ações e ordens divinas.
    reason: cross_reference
lexical_decisions:
- source_word: ተምዐ፡ ፈድፋደ
  choice: irou-se profundamente
  rationale: Reproduz a intensidade da expressão ge'ez com linguagem portuguesa natural e digna.
- source_word: ይሠርዎሙ፡ እምኵሉ፡ ሥልጣኖሙ
  choice: a ponto de despojá-los de todo o seu domínio
  rationale: O verbo indica privação ou remoção; «despojar» conserva a ideia de tirar-lhes completamente a autoridade, enquanto «a ponto de» expressa sem rigidez excessiva a relação sintática com a ira precedente.
- source_word: መዓምቅቲሃ፡ ለምድር
  choice: nas profundezas da terra
  rationale: Equivalência direta e idiomática para o lugar subterrâneo de aprisionamento.
- source_word: ማእከሎሙ
  choice: dentro delas
  rationale: O sufixo plural retoma naturalmente «profundezas»; esta formulação evita a impressão de que os anjos estejam presos no meio de outras pessoas.
- source_word: ብሕትዋን
  choice: mantidos à parte
  rationale: Comunica o estado de separação ou isolamento expresso pelo termo, sem especificar de quem ou de quê foram separados.
theological_decisions:
- issue: Identidade e culpa dos anjos
  choice: os seus anjos, que ele havia enviado à terra
  alternative: os anjos transgressores que ele enviara à terra
  rationale: Mantém a formulação do texto sem inserir explicitamente uma qualificação teológica que o contexto pode fornecer, mas que este versículo não declara.
- issue: Agente que prende os anjos
  choice: nos ordenou que os prendêssemos
  alternative: mandou que fossem presos
  rationale: Preserva a primeira pessoa do plural do relato e, assim, a moldura revelatória mediada por anjos em Jubileus.
- issue: Estado final dos anjos
  choice: mantidos à parte
  alternative: separados uns dos outros
  rationale: Conserva a falta de complemento no original e não determina indevidamente a natureza da separação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega «irou-se», «domínio» e «eis que» para conservar um tom bíblico digno, sem arcaísmo excessivo; usa próclise e construções correntes para manter clareza.
