  yaml_path: translation/extra_canonical/jubilees/005/024.yaml
  text: And the Lord opened seven floodgates of heaven and the openings of the fountains of the great deep[a], seven openings in all, and the floodgates poured down water from heaven for forty days and forty nights.
translation:
  language: pt
  text: E o Senhor abriu sete comportas do céu e as aberturas das fontes do grande abismo — sete aberturas ao todo[a] —, e as comportas derramaram água do céu durante quarenta dias e quarenta noites.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por «sete aberturas ao todo» diz literalmente algo como «sete bocas em número». O ge'ez conserva assim a imagem estruturada das aberturas do grande abismo.
    reason: cultural_note
lexical_decisions:
- source_word: መገብሕብሕተ፡ ሰማይ
  choice: comportas do céu
  rationale: Preserva a imagem cosmológica de aberturas celestes que controlam a passagem das águas, em linguagem corrente e digna.
- source_word: አፈወ፡ አንቅዐተ፡ ቀላይ፡ ዐቢይ
  choice: as aberturas das fontes do grande abismo
  rationale: Traduz o sentido contextual de «bocas» por «aberturas», sem eliminar a imagem das fontes do grande abismo.
- source_word: በሰብዑ፡ … በኍልቍ
  choice: sete aberturas ao todo
  rationale: Expressa naturalmente a contagem explícita do ge'ez, cujo sentido literal é aproximadamente «sete bocas em número».
- source_word: ይውርዱ፡ ማየ፡ እምሰማይ
  choice: as comportas derramaram água do céu
  rationale: Comunica de modo natural o movimento descendente da água por meio das comportas, acompanhando a estrutura da fonte e evitando uma formulação excessivamente mecânica.
theological_decisions: []
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A redação mantém o imaginário cosmológico antigo sem o explicar dentro do versículo; os travessões deixam claro que «sete aberturas ao todo» retoma e quantifica as aberturas das fontes.
