  text: And the ark went and came to rest on the summit of Lubar, one of the mountains of Ararat.
translation:
  language: pt
  text: E a arca moveu-se e repousou no cume de Lubar, um dos montes de Ararate.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረት
  choice: E a arca seguiu adiante
  rationale: O verbo etíope expressa movimento, literalmente algo como “foi”; “seguiu adiante” preserva essa etapa narrativa sem produzir a formulação pouco natural “a arca foi”.
- source_word: ወአዕረፈት
  choice: e repousou
  rationale: Traduz diretamente a ideia de cessar o movimento e ficar em repouso, em registro narrativo digno e natural.
- source_word: ዲበ፡ ርእሰ
  choice: no cume de
  rationale: A expressão indica posição sobre a cabeça/topo; “no cume de” é a equivalência geográfica natural em português.
- source_word: ሉባር
  choice: Lubar
  rationale: Mantém a transliteração tradicional do topônimo.
- source_word: አሐዱ፡ እምአድባረ፡ አራራት
  choice: um dos montes de Ararate
  rationale: Reproduz a construção partitiva do texto e preserva Ararate como designação da região montanhosa.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem narrativa do ge'ez foi preservada, evitando tratar “Ararate” como um único monte e mantendo “Lubar” como o cume específico.
