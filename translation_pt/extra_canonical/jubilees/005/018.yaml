  text: It has been written and ordained that mercy will be shown to all who turn from all their error[a], once each year.
translation:
  language: pt
  text: Está escrito e determinado que será concedida misericórdia a todos os que se afastarem de todos os seus erros, uma vez por ano.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «uma vez por ano» pode refletir a teologia calendárica de Jubileus, ligada à expiação ou à misericórdia recorrente. A formulação explícita foi mantida, em vez de ser generalizada.
    reason: cross_reference
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  choice: Está escrito e determinado
  rationale: Preserva a fórmula passiva que apresenta a disposição como registrada e estabelecida, sem explicitar um agente que o texto não nomeia.
- source_word: ይትመሐር፡
  choice: haverá misericórdia
  rationale: Expressa de modo natural em português a concessão passiva de misericórdia, mantendo indefinido o agente.
- source_word: ተመይጡ፡ እምኵሉ፡ ጌጋዮሙ፡
  choice: abandonarem todos os seus erros
  rationale: Traduz a ideia de voltar-se para longe dos próprios desvios; «abandonarem» é mais idiomático em português do que uma reprodução literal de «voltarem de».
- source_word: ምዕረ፡ ለለ፡ ዓመት።
  choice: uma vez por ano
  rationale: Mantém explícita a periodicidade anual indicada pelo texto, sem generalizá-la.
theological_decisions:
- issue: Agente da misericórdia
  choice: 'Construção impessoal: «haverá misericórdia»'
  alternative: «ele terá misericórdia» ou «Deus terá misericórdia»
  rationale: O trecho não explicita o agente; a formulação escolhida evita inserir um sujeito teológico não declarado.
- issue: Periodicidade da misericórdia
  choice: «uma vez por ano»
  alternative: «ano após ano» ou omissão da expressão
  rationale: Conserva a leitura explícita da tradição textual apresentada e sua possível tensão com a teologia calendárica de Jubileus.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A construção preserva a voz passiva e a ambiguidade quanto ao agente da misericórdia.
