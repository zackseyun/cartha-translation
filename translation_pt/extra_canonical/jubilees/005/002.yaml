base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/002.yaml
  text: And lawlessness increased on the earth, and all flesh corrupted its way, from men to cattle, and to beasts, and to birds, and to everything that moves on the earth. All of them corrupted their ways and their ordinances, and they began to devour one another; and lawlessness increased on the earth, and every imagination of the thoughts of all the children of men was thus evil all the days.
translation:
  language: pt
  text: E a transgressão aumentou sobre a terra, e toda carne corrompeu o seu caminho — desde os seres humanos até o gado, os animais selvagens, as aves e tudo o que se move sobre a terra. Todos corromperam os seus caminhos e as suas normas, e começaram a devorar uns aos outros; e a transgressão aumentou sobre a terra, e toda concepção da mente de todos os filhos dos homens era assim má todos os dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: transgressão
  rationale: O termo expressa violação, injustiça ou desordem moral. “Transgressão” preserva a dimensão moral e a possível alusão ao quadro do dilúvio sem restringi-lo apenas à ausência de lei.
- source_word: ኵሉ ዘሥጋ
  choice: toda carne
  rationale: Mantém a expressão abrangente e tradicional do texto, que inclui seres humanos e animais e é esclarecida pela enumeração seguinte.
- source_word: አማሰነ ፍኖተ
  choice: corrompeu o seu caminho
  rationale: Reproduz a metáfora ética do “caminho” e sua proximidade com a linguagem de Gênesis 6, sem explicá-la em excesso.
- source_word: ሥርዐቶሙ
  choice: as suas ordens
  rationale: O substantivo pode designar ordem, disposição, norma ou ordenança. “Ordens” conserva a amplitude e sugere as estruturas próprias de cada criatura sem tornar a expressão exclusivamente jurídica.
- source_word: ይትበልዑ በበይናቲሆሙ
  choice: devorar uns aos outros
  rationale: Traduz diretamente a ação recíproca e mantém a força concreta da violência descrita.
- source_word: ሕሊና አእምሮ
  choice: inclinação dos pensamentos
  rationale: A combinação envolve concepção, imaginação ou propósito mental. A formulação escolhida é natural em português e preserva o sentido de orientação interior contínua.
- source_word: እጓለ እመሕያው
  choice: filhos dos homens
  rationale: Mantém o semitismo antropológico da tradição textual, aqui com referência coletiva à humanidade.
- source_word: ኵሉ መዋዕለ
  choice: todos os dias
  rationale: Representa a duração habitual expressa pelo plural e evita acrescentar “continuamente”, embora essa nuance seja possível.
theological_decisions:
- issue: Alcance de “toda carne” e do sujeito de “todos corromperam”
  choice: Conservar a inclusão explícita de humanos e de todas as categorias animais.
  alternative: Entender “toda carne” principalmente como humanidade e tratar os animais como expansão retórica.
  rationale: A enumeração da fonte vai dos seres humanos ao gado, aos animais selvagens, às aves e aos seres que se movem no solo; por isso, a tradução não restringe a corrupção aos humanos.
- issue: Natureza das “ordens” corrompidas
  choice: Usar termo amplo, sem identificar essas ordens com uma lei religiosa específica.
  alternative: Traduzir como “leis”, “ordenanças” ou “naturezas estabelecidas”.
  rationale: A fonte permite um campo semântico de ordem, regra e disposição. Uma formulação ampla evita importar uma doutrina específica acerca da lei natural ou ritual.
- issue: Formulação do mal humano
  choice: 'Preservar a linguagem interior e temporal: “toda inclinação dos pensamentos... era assim má todos os dias”.'
  alternative: Harmonizar integralmente com uma redação bíblica específica, como “era continuamente má”.
  rationale: A tradução conserva a proximidade com Gênesis 6:5, mas segue a forma efetivamente atestada no texto ge'ez apresentado, inclusive o valor demonstrativo de “assim”.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se os semitismos significativos “toda carne”, “caminho” e “filhos dos homens”; a enumeração foi pontuada para clareza sem reduzir sua abrangência.
