  to: E a transgressão aumentou sobre a terra, e toda carne corrompeu o seu caminho — desde os seres humanos até o gado, os animais selvagens, as aves e tudo o que se move sobre a terra. Todos corromperam os seus caminhos e as suas normas, e começaram a devorar uns aos outros; e a transgressão aumentou sobre a terra, e toda concepção da mente de todos os filhos dos homens era assim má todos os dias.
