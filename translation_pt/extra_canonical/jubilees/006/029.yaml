  to: 'Para as festas e para os memoriais, para sempre; assim estão estabelecidas. E elas são registradas[a] nas tábuas celestiais: treze semanas, de uma a outra, para os seus memoriais, da primeira à segunda, da segunda à terceira e da terceira à quarta.'
