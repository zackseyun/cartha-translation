base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/029.yaml
  text: 'For the feasts and for memorials forever, and thus they are ordained. And they are recorded on the heavenly tablets: thirteen weeks, each one from another, for their memorials, from the first to the second, and from the second to the third, and from the third to the fourth.'
translation:
  language: pt
  text: 'Para as festas e para os memoriais, para sempre; assim estão estabelecidas. E elas são registradas[a] nas tábuas celestiais: treze semanas, de uma a outra, para os seus memoriais, da primeira à segunda, da segunda à terceira e da terceira à quarta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foram escritas”.'
    reason: Preserva uma tradução possível e tradicional do verbo no contexto das tábuas celestiais, embora o texto principal reflita seu valor presente ou contínuo.
lexical_decisions:
- source_word: በዓላት (baʿālāt)
  choice: festas
  rationale: Equivalente corrente e digno para celebrações ou festividades determinadas.
- source_word: ተዝካር (təzkar)
  choice: memoriais
  rationale: Preserva a ideia de comemoração ou lembrança ritual sem restringi-la a uma tradição confessional específica.
- source_word: ሥርዓት (śərʿāt)
  choice: estabelecidas
  rationale: O termo pode designar ordem, norma ou prescrição; a formulação verbal comunica que as festas têm uma ordenação fixada.
- source_word: ያዐርገዎን (yāʿargawon)
  choice: ficam registradas
  rationale: No contexto das tábuas celestiais, expressa a inscrição ou consignação contínua; o presente reflete a forma verbal imperfeita e o caráter permanente do registro.
- source_word: ጽላት ሰማይ (ṣəlāt samāy)
  choice: tábuas celestiais
  rationale: Mantém a imagem técnica e recorrente de Jubileus, em linguagem portuguesa natural.
- source_word: ዓሥሩ ወሠላስ ሰንበታት
  choice: treze semanas
  rationale: Tradução direta da expressão numérica e temporal.
- source_word: አሐቲ አሐቲ እምኔሆን
  choice: de uma a outra
  rationale: Reproduz de modo idiomático a relação intervalar entre as quatro referências sem explicitar além do texto.
theological_decisions:
- issue: Natureza normativa das festas e dos memoriais
  choice: assim estão estabelecidas
  alternative: assim são uma ordenança
  rationale: Conserva a força normativa de ሥርዓት, mas evita transformar desnecessariamente o substantivo coletivo em uma fórmula jurídica ou denominacional.
- issue: Tempo e modo do registro nas tábuas celestiais
  choice: ficam registradas
  alternative: foram escritas
  rationale: A escolha principal acompanha o valor imperfeito/presente indicado pela revisão textual e sugere registro permanente; a alternativa tradicional é preservada em nota.
- issue: Identidade das quatro referências ordinais
  choice: da primeira à segunda, da segunda à terceira e da terceira à quarta
  alternative: da primeira festa à segunda, da segunda festa à terceira e da terceira festa à quarta
  rationale: O original deixa implícito o substantivo governado pelos ordinais; a tradução mantém essa elipse e não resolve o referente de forma indevida.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção conserva a sequência repetitiva do original e sua ambiguidade quanto ao referente dos ordinais.
