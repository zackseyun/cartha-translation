  text: the tops of the mountains appeared, and Noah rejoiced. Therefore he ordained them for himself as festivals for remembrance forever, and thus they are ordained.
translation:
  language: pt
  text: apareceram os cumes dos montes, e Noé se alegrou. Por isso, ele os estabeleceu para si como festas de recordação para sempre; e assim foram estabelecidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስቲ፡ አድባር
  choice: os cumes dos montes
  rationale: Traduz literalmente a expressão “cabeças/topos dos montes” em português natural e digno.
- source_word: ተፈሥሐ፡ ኖኅ
  choice: Noé se alegrou
  rationale: Preserva o sentido direto do verbo reflexivo de alegria.
- source_word: ሠርዓን፡ ኪያሆን፡ ሎቱ
  choice: ele os estabeleceu para si
  rationale: Mantém o verbo com sentido de ordenar ou instituir, o objeto plural e a referência reflexiva a Noé; “estabeleceu” soa natural no contexto de festas comemorativas.
- source_word: በዓላተ፡ ለተዝካር፡ ለዓለም
  choice: como festas de recordação para sempre
  rationale: A segunda metade do versículo, ausente do recorte segmentado mas atestada no texto completo indicado pela revisão, contém explicitamente “festas”, “recordação” e “para sempre”; a tradução conserva os três elementos.
- source_word: ወከማሁ፡ ሠርዓዋ፡
  choice: e assim foram estabelecidos
  rationale: Reproduz a cláusula conclusiva sem explicitar um agente que o texto não identifica.
theological_decisions:
- issue: Duração e função das festas instituídas
  choice: festas de recordação para sempre
  alternative: festas para sempre
  rationale: 'A expressão “de recordação” não é uma expansão interpretativa: corresponde a ለተዝካር na continuação autêntica do versículo, omitida apenas por um erro de segmentação do trecho fornecido.'
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. A formulação preserva a solenidade narrativa sem arcaísmos. O pronome “os” mantém a referência contextual do original, em vez de substituir seu antecedente por uma interpretação explícita.
