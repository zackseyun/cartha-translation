  text: And he gave Noah and his sons a sign that there should never again be a flood upon the earth.
translation:
  language: pt
  text: E ele deu a Noé e a seus filhos um sinal de que nunca mais haveria um dilúvio sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእምርተ
  choice: um sinal
  rationale: Corresponde diretamente ao substantivo etíope para “sinal” e mantém a referência sem explicitar além do que o versículo diz.
- source_word: ዳግመ
  choice: nunca mais
  rationale: Em combinação com a negação, expressa naturalmente em português a ideia de que o acontecimento não voltaria a ocorrer.
- source_word: አይኅ
  choice: um dilúvio
  rationale: “Dilúvio” preserva o sentido de uma inundação catastrófica no contexto de Noé.
- source_word: ዲበ፡ ምድር
  choice: sobre a terra
  rationale: Tradução formal e idiomática da expressão locativa; “terra” conserva a possível amplitude do referente.
theological_decisions:
- issue: Identidade do sujeito de “deu”
  choice: E ele deu
  alternative: E Deus deu
  rationale: O texto fornecido emprega uma forma verbal com sujeito implícito. Mantê-lo pronominal evita inserir explicitamente “Deus” neste versículo, embora o contexto possa identificá-lo.
- issue: Natureza do sinal
  choice: um sinal
  alternative: o arco-íris como sinal
  rationale: O versículo não identifica aqui a natureza do sinal; a tradução preserva essa concisão e não acrescenta informação contextual.
translation_notes:
  register: Português moderno, claro e digno, com construção próxima ao texto ge'ez. “A Noé e a seus filhos” favorece legibilidade brasileira sem perder alcance internacional; “nunca mais haveria” comunica de modo natural a finalidade ou garantia associada ao sinal.
