base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/031.yaml
  text: 'And you, command the children of Israel to keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And it will not disturb its time from its days or from its feasts, for everything will come in them according to their testimony, and they will not omit a day nor disturb a feast.'
translation:
  language: pt
  text: 'E você, ordene aos filhos de Israel que observem os anos segundo esta contagem: trezentos e sessenta e quatro dias, e será um ano completo. Esse ano não alterará o seu tempo, seus dias nem suas festas, pois tudo ocorrerá neles segundo o testemunho deles; eles não omitirão dia algum nem alterarão festa alguma.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእንተኒ
  choice: E você
  rationale: Preserva o pronome independente enfático dirigido a Moisés, em vez de reduzi-lo a uma simples conjunção seguida do imperativo.
- source_word: ይዕቀቡ፡ ዓመታተ
  choice: observem os anos
  rationale: Expressa de modo natural a ideia de guardar ou cumprir os anos conforme a contagem prescrita.
- source_word: በዝ፡ ኍልቍ
  choice: segundo esta contagem
  rationale: Mantém o sentido concreto de cálculo ou cômputo calendárico, com linguagem corrente.
- source_word: ፍጹመ፡ ዓመተ
  choice: um ano completo
  rationale: Reproduz diretamente a noção de um ano íntegro ou completo.
- source_word: ወኢያማስን
  choice: Ele não desviará
  rationale: Mantém o verbo na terceira pessoa do singular, em contraste com a forma plural no fim do versículo; o pronome retoma o ano completo.
- source_word: በዓላቲሁ / በዓለ
  choice: suas festas / festa alguma
  rationale: Traduz de forma coerente o vocabulário das celebrações calendáricas.
- source_word: ይበጽሕ
  choice: ocorrerá
  rationale: No contexto do calendário, comunica naturalmente que cada evento chegará ou se dará no tempo determinado.
- source_word: ወኢየኀልፉ፡ ዕለተ
  choice: não omitirão dia algum
  rationale: Expressa a ideia de não deixar passar ou não saltar nenhum dia na contagem.
theological_decisions:
- issue: Referente do verbo singular na segunda frase
  choice: Ele não desviará o seu tempo
  alternative: Eles não desviarão o seu tempo
  rationale: A forma verbal ge'ez é masculina singular e provavelmente retoma o ano; a tradução conserva esse contraste gramatical com os verbos plurais posteriores.
- issue: Sentido de “testemunho” no calendário
  choice: segundo o testemunho deles
  alternative: segundo a determinação deles
  rationale: A formulação literal preserva a linguagem própria e sua possível amplitude sem convertê-la silenciosamente em uma interpretação específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário calendárico acessível. A sintaxe preserva a ênfase inicial em Moisés e a alternância entre o sujeito singular (“ele”, o ano) e o plural (“eles”, os israelitas).
