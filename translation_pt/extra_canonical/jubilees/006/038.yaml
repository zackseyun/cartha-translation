base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/038.yaml
  text: Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year three hundred and sixty-four days only. Therefore they will go wrong concerning the new moons and seasons and sabbaths and festivals, and they will eat all the blood with all flesh.
translation:
  language: pt
  text: Por isso, eu lhe ordeno e presto testemunho a você, para que você preste testemunho a eles; pois, depois da sua morte, seus filhos corromperão isso[a] e não farão o ano de apenas trezentos e sessenta e quatro dias. Por isso, errarão quanto às luas novas, às estações, aos sábados e às festas, e comerão todo o sangue com toda a carne.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O objeto de “corromperão” não é especificado no texto; pelo contexto, pode referir-se à contagem ou à ordenação do ano.
    reason: Esclarece uma referência implícita sem resolvê-la no corpo do texto.
  - marker: b
    text: Literalmente, “todo o sangue com toda a carne”; a formulação incomum foi preservada.
    reason: Sinaliza a dificuldade da expressão e evita uma paráfrase interpretativa.
lexical_decisions:
- source_word: አስምዕ / ታስምዕ
  choice: testifico diante de você / testemunhe diante deles
  rationale: Preserva o sentido solene e testemunhal do verbo causativo sem reduzir a expressão a simples transmissão de informação; a formulação com “diante de” é idiomática em português.
- source_word: ያማስኑ
  choice: corromperão isso
  rationale: Mantém o objeto implícito e contextualmente recuperável sem especificá-lo além do que o texto-fonte permite.
- source_word: ሠርቀ
  choice: luas novas
  rationale: No contexto calendárico, designa o aparecimento ou início lunar e corresponde naturalmente a “luas novas”.
- source_word: ጊዜ
  choice: estações
  rationale: Representa períodos ou tempos determinados no calendário, sem restringi-los a uma interpretação mais específica.
- source_word: ሰንበተ
  choice: sábados
  rationale: Mantém a referência aos dias sabáticos no plural.
- source_word: በዓላተ
  choice: festas
  rationale: Termo corrente e digno para celebrações festivas religiosas.
theological_decisions:
- issue: Peso testemunhal ou pactual de አስምዕ
  choice: “testifico diante de você, para que você testemunhe diante deles”
  alternative: “faço saber a você, para que você lhes faça saber”
  rationale: A escolha conserva o caráter de testemunho solene presente no verbo e evita enfraquecer a força da declaração.
- issue: Objeto da corrupção depois da morte do destinatário
  choice: “corromperão isso”
  alternative: “corromperão o calendário” ou “corromperão o ano”
  rationale: O objeto não é expresso de forma específica no trecho; manter “isso” preserva a ambiguidade referencial.
- issue: Formulação da proibição alimentar final
  choice: “comerão todo o sangue com toda a carne”
  alternative: “comerão todo tipo de sangue com todo tipo de carne” ou “comerão carne com sangue”
  rationale: A redação retém os quantificadores e a construção incomum do texto-fonte, sem harmonizá-la silenciosamente com uma proibição bíblica conhecida.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para o singular. A sintaxe foi levemente naturalizada, mas foram preservados o tom solene, a referência calendárica e as ambiguidades reais do texto.
