revisions:
- from: Por isso, eu lhe ordeno e testifico diante de você, para que você testemunhe diante deles; pois, depois da sua morte, seus filhos corromperão isso[a] e deixarão de fazer o ano de apenas trezentos e sessenta e quatro dias. Por causa disso, errarão quanto às luas novas, às estações, aos sábados e às festas, e comerão todo o sangue com toda a carne.[b]
  to: Por isso, eu lhe ordeno e presto testemunho a você, para que você preste testemunho a eles; pois, depois da sua morte, seus filhos corromperão isso[a] e não farão o ano de apenas trezentos e sessenta e quatro dias. Por isso, errarão quanto às luas novas, às estações, aos sábados e às festas, e comerão todo o sangue com toda a carne.[b]
  rationale: A revisão remove a ideia não expressa de testemunhar «diante de» alguém e a substitui por uma formulação portuguesa natural que conserva o caráter solene e testemunhal destacado no texto-fonte e no histórico de auditoria em inglês. Também substitui «deixarão de fazer» por «não farão», que reproduz mais diretamente a negação do original sem alterar o sentido. As notas preservam as duas ambiguidades textualmente relevantes.
