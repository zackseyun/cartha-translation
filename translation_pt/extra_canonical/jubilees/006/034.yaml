revisions:
- from: Pois eu sei e, de agora em diante, darei isso a conhecer a você — não de meu próprio coração, pois o livro está escrito diante de mim, e as divisões dos dias[a] estão estabelecidas nas tábuas celestiais —, para que eles não se esqueçam das festas da aliança nem sigam as festas das nações, acompanhando-as em seu erro e em sua ignorância.
  to: Pois eu sei e, de agora em diante, lhe darei a conhecer — não de meu próprio coração, pois o livro está escrito diante de mim, e as divisões dos dias[a] estão estabelecidas nas tábuas celestiais —, para que eles não se esqueçam das festas da aliança nem sigam as festas das nações, segundo o seu erro e a sua ignorância.
  rationale: 'A revisão elimina a ideia não expressa de «acompanhar» as festas e restitui a relação de conformidade indicada pela cláusula final: seguir as festas das nações segundo o erro e a ignorância. Também torna mais natural a comunicação ao destinatário singular, sem modificar a alternância do original para o plural em «eles».'
