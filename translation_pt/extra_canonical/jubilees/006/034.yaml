base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/034.yaml
  text: For I know, and from now on I will make it known to you—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.
translation:
  language: pt
  text: Pois eu sei e, de agora em diante, lhe darei a conhecer — não de meu próprio coração, pois o livro está escrito diante de mim, e as divisões dos dias[a] estão estabelecidas nas tábuas celestiais —, para que eles não se esqueçam das festas da aliança nem sigam as festas das nações, segundo o seu erro e a sua ignorância.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as divisões dos tempos”.'
    reason: Embora መዋዕል signifique literalmente “dias” e seja especialmente adequado ao contexto calendárico, “tempos” expressa uma possível extensão contextual.
lexical_decisions:
- source_word: መዋዕል
  choice: dias
  rationale: O termo significa literalmente “dias”; no contexto calendárico de Jubileus, essa tradução preserva a ênfase na contagem precisa dos dias, sem generalizá-los como “tempos”.
- source_word: በዓላተ፡ ኪዳን
  choice: festas da aliança
  rationale: Mantém a relação genitiva do original e a ligação explícita entre as celebrações e a aliança.
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Expressão tradicional e clara para as tábuas pertencentes à esfera celeste, sem acrescentar interpretação.
- source_word: የሐውሩ፡ በበዓላት፡ አሕዛብ
  choice: sigam as festas das nações
  rationale: “Sigam” comunica naturalmente o sentido de andar segundo ou observar as festas dos povos estrangeiros.
theological_decisions:
- issue: Origem da revelação calendárica
  choice: “não de meu próprio coração”
  alternative: “não por iniciativa própria”
  rationale: A formulação mais literal preserva a imagem semítica do coração como fonte interior, ressaltando que a informação procede do registro celestial, sem explicar além do texto.
- issue: Identidade do referente plural na cláusula final
  choice: “para que eles não se esqueçam”
  alternative: “para que vocês não se esqueçam”
  rationale: O original passa do destinatário singular (“a você”) a formas verbais plurais de terceira pessoa; a tradução conserva essa mudança em vez de uniformizá-la.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A longa estrutura causal e final do original foi preservada, mas organizada com travessões para facilitar a leitura. Evitou-se linguagem denominacional e manteve-se a tensão entre a comunicação pessoal e sua origem registrada nas tábuas celestiais.
