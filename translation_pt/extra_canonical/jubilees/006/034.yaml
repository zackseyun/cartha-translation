  revision_rationale: 'A revisão elimina a ideia não expressa de «acompanhar» as festas e restitui a relação de conformidade indicada pela cláusula final: seguir as festas das nações segundo o erro e a ignorância. Também torna mais natural a comunicação ao destinatário singular, sem modificar a alternância do original para o plural em «eles».'
