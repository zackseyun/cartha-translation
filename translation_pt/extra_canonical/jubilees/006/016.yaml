  text: He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.
translation:
  language: pt
  text: Ele pôs seu arco na nuvem como sinal da aliança eterna, para que nunca mais houvesse águas de dilúvio sobre a terra, a fim de destruí-la, durante todos os dias da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀስተ
  choice: seu arco
  rationale: O termo significa literalmente “arco”; o possessivo é exigido pelo sufixo verbal e preserva a imagem concreta que, no contexto, também designa o arco celeste.
- source_word: ለትእምርተ፡ ኪዳን፡ ዘለዓለም
  choice: como sinal da aliança eterna
  rationale: Reproduz de modo natural a relação final/predicativa do ge'ez e mantém o vocabulário de aliança.
- source_word: ማየ፡ አይኅ
  choice: águas de dilúvio
  rationale: Mantém os dois elementos da expressão, literalmente “águas de dilúvio”, sem reduzi-la apenas a “dilúvio”.
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: durante todos os dias da terra
  rationale: Preserva a formulação temporal incomum do original, em vez de normalizá-la como “enquanto a terra existir”.
theological_decisions:
- issue: Alcance da promessa de não destruição
  choice: para que nunca mais houvesse águas de dilúvio sobre a terra, a fim de destruí-la
  alternative: para que nunca mais houvesse águas de dilúvio sobre a terra para destruir tudo
  rationale: O objeto pronominal pode remeter à terra; a tradução segue a concordância e a sequência imediata do ge'ez, sem ampliar explicitamente o referente para toda criatura.
- issue: Duração da aliança
  choice: aliança eterna
  alternative: aliança perpétua
  rationale: “Eterna” traduz com dignidade e familiaridade o qualificativo temporal, sem explicar de antemão seu alcance teológico.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível ao leitor brasileiro e compreensão ampla no espaço lusófono. Conserva as imagens e a expressão temporal do texto ge'ez sem paráfrase denominacional.
