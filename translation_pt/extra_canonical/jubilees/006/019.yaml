  yaml_path: translation/extra_canonical/jubilees/006/019.yaml
  text: But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.
translation:
  language: pt
  text: Mas somente Abraão a guardou; Isaque, Jacó e os filhos dele também a guardaram até os teus dias. Nos teus dias, porém, os filhos de Israel a esqueceram, até que eu a renovei para eles neste monte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕቲቱ
  choice: somente
  rationale: Expressa a ideia de exclusividade associada a Abraão, em português natural.
- source_word: ዐቀበ / ዐቀብዋ
  choice: guardou / guardaram
  rationale: Mantém o sentido de observar ou preservar a ordenança, sem explicitar além do que o contexto fornece.
- source_word: ረከቡ
  choice: esqueceram
  rationale: Segue o sentido contextual atestado pela tradição textual e refletido na camada de consulta inglesa, pois o simples valor lexical de 'encontrar' não produz sentido coerente nesta sequência.
- source_word: ኀይስክዎሙ
  choice: eu a renovei para eles
  rationale: Reproduz a restauração da observância, com o pronome feminino retomando a instituição mencionada no contexto.
- source_word: ደብር
  choice: monte
  rationale: Equivalente corrente e digno para o local da revelação.
theological_decisions:
- issue: Objeto feminino implícito dos verbos guardar, esquecer e renovar
  choice: a
  alternative: isso
  rationale: Preserva a referência implícita à festa ou ordenança tratada no contexto, sem inserir um nome ausente deste versículo.
- issue: Identidade do sujeito na expressão 'eu a renovei'
  choice: manter a primeira pessoa sem identificação adicional
  alternative: Deus a renovou
  rationale: Conserva a voz direta do texto e evita acrescentar uma identificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa singular coerentes com o discurso dirigido a Moisés. A repetição de 'nos teus dias' foi preservada por sua função retórica; 'porém' marca naturalmente o contraste.
