revisions:
- from: 'E este testemunho foi escrito a respeito de vocês, para que o guardem para sempre: não comam, em tempo algum, sangue de animal selvagem, de ave ou de animal doméstico, durante todos os dias da terra. O homem que comer sangue de animal selvagem, de animal doméstico ou de ave, durante todos os dias da terra, será extirpado da terra, ele e sua descendência.'
  to: 'E este testemunho está escrito a respeito de vocês, para que o observem sempre: não comam sangue algum de animais selvagens, de aves ou de animais domésticos, durante todos os dias da terra. E o homem que comer sangue de animal selvagem, de animal doméstico ou de ave, durante todos os dias da terra, será extirpado da terra, ele e sua descendência.'
  rationale: A revisão restabelece o presente textual de «está escrito», substitui «guardem» por «observem» para explicitar naturalmente a guarda de uma prescrição, e elimina a duplicação temporal não necessária. Conserva-se a repetição deliberada de «durante todos os dias da terra», bem como a ambiguidade e a severidade corporativa da extirpação.
