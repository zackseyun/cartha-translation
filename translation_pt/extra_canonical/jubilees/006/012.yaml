base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/012.yaml
  text: 'And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.'
translation:
  language: pt
  text: 'E este testemunho está escrito a respeito de vocês, para que o observem sempre: não comam sangue algum de animais selvagens, de aves ou de animais domésticos, durante todos os dias da terra. E o homem que comer sangue de animal selvagem, de animal doméstico ou de ave, durante todos os dias da terra, será extirpado da terra, ele e sua descendência.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: testemunho
  rationale: Preserva o sentido de declaração solene e normativa do termo ge'ez, em harmonia com o contexto da aliança.
- source_word: ትዕቀብዋ
  choice: o guardem
  rationale: Expressa a ideia de observar e cumprir o testemunho, sem reduzi-la a mera conservação material.
- source_word: አራዊት
  choice: animal selvagem
  rationale: Distingue esta categoria de እንስሳ, que no contexto designa animais domésticos ou gado.
- source_word: እንስሳ
  choice: animal doméstico
  rationale: Mantém a distinção tripla entre animais selvagens, aves e animais domesticados, usando uma expressão abrangente e corrente.
- source_word: ይስሮ
  choice: será extirpado
  rationale: Conserva a força da imagem de ser arrancado ou eliminado, sem especificar indevidamente o meio da punição.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: Traduz naturalmente o sentido genealógico de 'semente' neste contexto.
theological_decisions:
- issue: Alcance temporal da proibição do sangue
  choice: durante todos os dias da terra
  alternative: para sempre
  rationale: A formulação incomum do original foi preservada porque pode realçar tanto a continuidade da ordem quanto sua relação com a duração da terra; não se resolveu essa tensão por paráfrase.
- issue: Extirpação do transgressor e de sua linhagem
  choice: será extirpado da terra, ele e sua descendência
  alternative: ele será eliminado, juntamente com seus descendentes
  rationale: Mantém a linguagem corporativa e genealógica explícita do texto, sem suavizar nem explicar teologicamente a inclusão da descendência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível no espaço lusófono. A repetição de “durante todos os dias da terra” foi mantida por refletir a estrutura enfática da fonte.
