review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a ordem, as três categorias de animais e a consequência de extirpação do transgressor e de sua descendência. Contudo, o perfeito «foi escrito» enfraquece a formulação textual presente («está escrito»), e «em tempo algum» introduz uma formulação temporal adicional ao lado da repetição explícita de «durante todos os dias da terra».
  naturalness: O texto é claro e de registro apropriado. «Está escrito» é mais idiomático para uma declaração normativa registrada, e «sangue algum de animais...» expressa com maior fluidez o escopo da proibição.
  terminology: «Testemunho», «observar», «animal selvagem», «animal doméstico», «extirpado» e «descendência» são escolhas adequadas e não impõem interpretação doutrinária. Mantém-se a distinção tripla do texto-fonte.
  issues:
  - severity: low
    issue: Tempo verbal em «foi escrito»
    rationale: 'O original e a trilha inglesa apresentam uma formulação de estado presente: o testemunho «está escrito». Em português bíblico e normativo, essa forma também é mais natural.'
  - severity: low
    issue: «em tempo algum» em conjunto com «durante todos os dias da terra»
    rationale: A fonte já qualifica a proibição pela expressão repetida «durante todos os dias da terra». A expressão adicional torna a frase mais pesada e pode parecer uma paráfrase temporal independente.
  revised_text: 'E este testemunho está escrito a respeito de vocês, para que o observem sempre: não comam sangue algum de animais selvagens, de aves ou de animais domésticos, durante todos os dias da terra. E o homem que comer sangue de animal selvagem, de animal doméstico ou de ave, durante todos os dias da terra, será extirpado da terra, ele e sua descendência.'
