  text: and on it the earth became dry, and he opened it and saw the earth. And on the new moon of the fourth month the mouths of the depths of the abyss beneath were closed. And on the new moon of the seventh month were opened all the mouths of
translation:
  language: pt
  text: e, nesse dia, a terra secou; ele a abriu e viu a terra. Na lua nova do quarto mês, fecharam-se as bocas das profundezas do abismo inferior. E, na lua nova do sétimo mês, abriram-se todas as bocas de[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho fornecido termina aqui, no meio da expressão «todas as bocas de»; a continuação não foi suprida.
    reason: Assinala que a oração incompleta reflete o limite do texto-fonte disponibilizado, e não uma omissão acidental da tradução.
lexical_decisions:
- source_word: ወባቲ
  choice: e, nesse dia
  rationale: A forma significa literalmente algo como «e nela/nesse», retomando o marco temporal anterior. «Nesse dia» produz português natural sem afirmar mais do que a referência contextual permite.
- source_word: የብሰት፡ ምድር
  choice: a terra secou
  rationale: Reproduz diretamente o sentido do verbo e mantém «terra» como sujeito.
- source_word: አርኀወ
  choice: ele a abriu
  rationale: Mantém o sujeito masculino implícito e o objeto feminino retomado pelo pronome, sem identificar no próprio versículo aquilo que foi aberto.
- source_word: ሠርቀ፡ ወርኅ
  choice: lua nova
  rationale: Expressa a designação calendárica do início/aparecimento do mês e acompanha de perto a imagem lexical do texto.
- source_word: አፈ፡ መዓምቅቲሃ፡ ለቀላይ፡ ታሕቲት
  choice: as bocas das profundezas do abismo inferior
  rationale: Preserva a cadeia nominal e a imagem concreta de «bocas», evitando simplificá-la como «fontes» ou «aberturas».
- source_word: ተርኅወ
  choice: abriram-se
  rationale: Traduz o verbo passivo/reflexivo presente no ge'ez, que não deve ser omitido mesmo com a oração interrompida no fim do excerto.
theological_decisions:
- issue: Identidade do sujeito e do objeto em «ele a abriu»
  choice: Manter os referentes implícitos
  alternative: Explicitar «Noé abriu a arca» ou outra identificação contextual
  rationale: O trecho fornecido não nomeia os referentes; explicitá-los resolveria uma referência que o original deixa dependente do contexto.
- issue: Descrição cosmológica das águas inferiores
  choice: Preservar «bocas», «profundezas» e «abismo inferior»
  alternative: Modernizar como «fontes subterrâneas»
  rationale: A formulação imagética pertence ao texto e pode ter importância cosmológica e teológica; não deve ser reinterpretada silenciosamente.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe corrente e vocabulário acessível. Conservam-se a imagem cosmológica do original, a referência pronominal não explicitada e a oração final truncada pelo limite do excerto.
