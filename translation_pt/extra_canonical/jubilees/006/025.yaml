lexical_decisions:
- source_word: ተዝካረ
  choice: um memorial
  rationale: O termo designa uma recordação ou memorial; o substantivo preserva a formulação solene e a função comemorativa do original.
- source_word: በሠርቀ፡ ወርኅ
  choice: na lua nova
  rationale: A expressão se refere ao início do mês marcado pela lua nova; esta tradução é natural e mantém a referência calendárica antiga.
- source_word: ታቦተ
  choice: a arca
  rationale: No contexto de Noé, refere-se à embarcação ordenada por Deus; “arca” é a designação bíblica estabelecida em português.
theological_decisions:
- issue: Referente do pronome em “foi-lhe dito”
  choice: Preservar a construção passiva e o pronome sem nomear quem falou
  alternative: “Deus lhe disse”
  rationale: O trecho fornecido não explicita o agente da fala; acrescentar “Deus” resolveria uma informação apenas implícita no contexto.
- issue: Valor de “memorial”
  choice: Manter o termo sem explicar o que exatamente servia de memorial
  alternative: “uma lembrança para ele”
  rationale: A redação conserva a possível tensão entre objeto, sinal e comemoração, sem impor uma interpretação.
