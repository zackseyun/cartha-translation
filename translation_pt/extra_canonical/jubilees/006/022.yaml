  text: For this festival, as it is written and ordained concerning it, celebrate it. For I have written in the book of the first law what I wrote for you, that you should celebrate it at its appointed time, one day in the year. And I told you about its sacrifices, that they should be a memorial, and that the children of Israel should celebrate it in...
translation:
  language: pt
  text: Pois, quanto a esta festa, celebre-a conforme está escrito e prescrito a seu respeito. Pois escrevi no livro da primeira lei — no que escrevi para você — que você a celebrasse no tempo determinado, um dia por ano. Também falei a você sobre os sacrifícios dela, para que servissem de memorial e para que os filhos de Israel a celebrassem no…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: A frase continua no versículo 23; literalmente, este versículo termina com “em/no”.
    reason: verse_boundary
lexical_decisions:
- source_word: በዓል (baʿāl)
  choice: festa
  rationale: Designa uma celebração religiosa ou festival; “festa” é natural, clara e adequada ao contexto.
- source_word: ቍሩጽ (qǝruṣ)
  choice: prescrito
  rationale: O termo traz a ideia de algo fixado ou decretado. “Prescrito” comunica que a observância foi formalmente estabelecida sem recorrer à imagem menos natural de algo “gravado”.
- source_word: በበጊዜሃ
  choice: no tempo determinado
  rationale: Expressa a realização da festa no tempo próprio ou designado para ela.
- source_word: ዝክራነ
  choice: memorial
  rationale: Refere-se à função comemorativa dos sacrifícios; a construção “servissem de memorial” é idiomática e preserva esse sentido.
- source_word: ደቂቀ እስራኤል
  choice: filhos de Israel
  rationale: Mantém a expressão coletiva tradicional do texto-fonte em linguagem bíblica amplamente compreensível.
theological_decisions:
- issue: Natureza normativa da festa
  choice: “prescrito”
  alternative: “gravado” ou “determinado”
  rationale: A escolha conserva o caráter estabelecido da observância sem introduzir uma imagem material que o contexto não exige.
- issue: Função dos sacrifícios
  choice: “para que servissem de memorial”
  alternative: “para que fossem memoriais”
  rationale: Preserva a finalidade memorial sem especificar indevidamente o objeto ou beneficiário da lembrança.
- issue: Frase interrompida na divisão dos versículos
  choice: manter “no…” no fim do versículo
  alternative: completar a frase com material do versículo seguinte
  rationale: O texto ge'ez termina com a preposição ውስተ, cuja complementação aparece no versículo 23. A tradução não importa para este versículo palavras ausentes nem cria a leitura “por todas as suas gerações”.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” para o singular. A sintaxe repetitiva de “escrevi” foi mantida em forma legível para refletir o texto-fonte, e as reticências assinalam a divisão artificial da frase entre os versículos 22 e 23.
