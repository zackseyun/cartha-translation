base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/037.yaml
  text: Therefore years will come upon them when they disturb the order, and they will make a day of testimony an abominable day, and an unclean day a festival day, and they will mix up all the holy days with the unclean, and the unclean day with the holy; for they will go wrong as to months and sabbaths and festivals and jubilees.
translation:
  language: pt
  text: Por isso, virão sobre eles anos em que perturbarão a ordem; farão de um dia de testemunho um dia abominável[a], e de um dia impuro, um dia de festa. Misturarão todos os dias santos com os impuros, e o dia impuro com o santo, pois errarão quanto aos meses, aos sábados, às festas e aos jubileus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “farão de um dia abominável um dia de testemunho”.'
    reason: Registra a tradução alternativa anterior, embora a sintaxe ge'ez favoreça que “dia de testemunho” seja o objeto transformado em “dia abominável”.
lexical_decisions:
- source_word: ያማስኑ
  choice: perturbarão a ordem
  rationale: O verbo expressa desarranjar ou corromper; a explicitação de “a ordem” comunica naturalmente o contexto do calendário, em acordo com a evidência textual.
- source_word: ዕለተ፡ ስምዐ
  choice: dia de testemunho
  rationale: Preserva de modo formal a expressão construta ge'ez e sua possível função calendárica sem interpretação denominacional.
- source_word: ምግንተ
  choice: dia abominável
  rationale: Traduz o sentido de algo abominável, desprezível ou censurável; no contexto, funciona como complemento que caracteriza aquilo em que o dia de testemunho será transformado.
- source_word: ርኵስተ
  choice: impuro
  rationale: Mantém o contraste ritual e moral com “santo”, em linguagem bíblica corrente.
- source_word: ሰንበታት
  choice: sábados
  rationale: Plural direto do termo referente aos sábados, distinto das festas e dos jubileus na enumeração.
- source_word: ኢዮቤል
  choice: jubileus
  rationale: Equivalente tradicional e transparente para os ciclos jubilares mencionados no texto.
theological_decisions:
- issue: Direção da transformação entre “dia de testemunho” e “dia abominável”
  choice: “farão de um dia de testemunho um dia abominável”
  alternative: “farão de um dia abominável um dia de testemunho”
  rationale: 'A análise sintática adotada entende “dia de testemunho” como objeto direto e “abominável” como complemento do objeto. Isso também preserva o paralelismo: um dia honrado é degradado, enquanto um dia impuro é elevado à condição de festa. A variante anterior é registrada em nota por refletir uma ambiguidade histórica de tradução.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a terminologia calendárica e o contraste santo/impuro, evitando explicações doutrinárias no corpo do versículo.
