  text: for their generations in this month, one day every year. And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and they are the days of the seasons in the four divisions of the year; they are written.
translation:
  language: pt
  text: para as suas gerações, neste mês, um dia a cada ano. E a lua nova do primeiro mês, a lua nova do quarto mês, a lua nova do sétimo mês e a lua nova do décimo mês são os dias de recordação e os dias das estações nas quatro divisões do ano; estão escritos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትዝምዶሙ
  choice: para as suas gerações
  rationale: O termo, provavelmente uma forma textual de ትውልዶሙ, completa a frase do versículo anterior e expressa continuidade pelas gerações.
- source_word: በዝ፡ ወርኅ
  choice: neste mês
  rationale: Representa naturalmente a expressão locativa com በ em português, preservando a referência ao mês mencionado no contexto.
- source_word: በሠርቀ፡ ወርኅ
  choice: a lua nova
  rationale: Expressão calendárica referente ao surgimento ou início do mês lunar; “lua nova” é a formulação portuguesa corrente e inteligível.
- source_word: ዕለታት፡ ተዝካር
  choice: dias de recordação
  rationale: Mantém o sentido memorial do substantivo sem acrescentar uma interpretação ritual não explicitada.
- source_word: ዕለታት፡ ጊዜ
  choice: dias que marcam as estações
  rationale: Torna clara em português a função calendárica dos dias, conservando o sentido temporal de ጊዜ.
- source_word: አርባዕቱ፡ መክፈላት፡ ዓመት
  choice: as quatro divisões do ano
  rationale: Tradução direta da estrutura, adequada ao contexto da divisão anual em quatro partes.
- source_word: ጽሑፋት፡ እማንቱ
  choice: eles estão escritos
  rationale: Preserva a cláusula final passiva e seu pronome masculino plural, sem acrescentar “ordenados”, ausente do texto.
theological_decisions:
- issue: Natureza dos dias calendáricos
  choice: “dias de recordação” e “dias que marcam as estações”
  alternative: “dias memoriais” e “dias dos tempos determinados”
  rationale: A redação escolhida preserva as duas caracterizações do texto e evita transformar, sem apoio explícito, os dias em festas litúrgicas ou em tempos teologicamente ordenados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura fragmentária foi mantida porque o versículo continua a frase anterior. A repetição de “lua nova” reproduz a estrutura enfática da fonte; a oração final permanece ligada por ponto e vírgula.
