  yaml_path: translation/extra_canonical/jubilees/006/021.yaml
  text: 'as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the Feast of Weeks, and it is the Feast of Firstfruits. It is of two kinds and of a double nature.'
translation:
  language: pt
  text: 'como mandamento para eles: um dia por ano, neste mês, celebrarão a festa. Pois é a Festa das Semanas e é a Festa das Primícias. Ela é de duas espécies e tem natureza dupla.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓለ፡ ሱባዔያት
  choice: Festa das Semanas
  rationale: Traduz o nome formal da festa de modo tradicional e transparente, preservando o plural do termo-fonte.
- source_word: በዓለ፡ ቀዳሜ፡ ፍሬ
  choice: Festa das Primícias
  rationale: Expressa literalmente a festa do primeiro fruto/primeiros frutos com a designação bíblica corrente em português.
- source_word: ክልኤ፡ ዐጽፍት ... ወለክልኤ
  choice: de duas espécies e tem natureza dupla
  rationale: Mantém as duas formulações paralelas ligadas à dualidade sem reduzi-las a uma única afirmação.
theological_decisions:
- issue: Relação entre Festa das Semanas e Festa das Primícias
  choice: Manter as duas designações coordenadas para a mesma celebração
  alternative: Tratá-las como duas festas distintas
  rationale: O singular retomado no contexto e a formulação copulativa identificam a celebração por dois nomes, sem explicar ou harmonizar teologicamente a relação.
translation_notes:
  register: Português moderno, claro e digno, com nomes formais das festas em maiúsculas. A construção prescritiva foi preservada com o futuro do indicativo; a repetição enfática da dualidade no final foi mantida em linguagem natural.
