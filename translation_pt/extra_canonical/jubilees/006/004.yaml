  yaml_path: translation/extra_canonical/jubilees/006/004.yaml
  text: All the days of the earth, seedtime and harvest shall not cease; cold and heat, summer and winter, and day and night shall not change their order, nor shall they cease forever.
translation:
  language: pt
  text: Durante todos os dias da terra, a semeadura e a colheita não cessarão; o frio e o calor, o verão e o inverno, o dia e a noite não mudarão sua ordem nem cessarão para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ መዋዕለ፡ ምድር
  choice: Durante todos os dias da terra
  rationale: Expressa naturalmente em português o valor temporal da frase, que rege as declarações seguintes.
- source_word: ዘርእ፡ ወማእረር
  choice: a semeadura e a colheita
  rationale: Mantém o par agrícola e o sentido sazonal do texto-fonte.
- source_word: ቍር፡ ወሙቀት
  choice: o frio e o calor
  rationale: Correspondência direta e idiomática para o par climático.
- source_word: ሐጋይ፡ ወክረምት
  choice: o verão e o inverno
  rationale: Preserva a oposição sazonal apresentada no texto e coincide com a compreensão tradicional do contexto.
- source_word: ኢይወልጡ፡ ሥርዓቶሙ
  choice: não mudarão sua ordem
  rationale: Traduz de modo formal e claro a negação de mudança na ordem estabelecida desses ciclos.
- source_word: ለዓለም
  choice: para sempre
  rationale: Equivalente corrente e digno da expressão temporal duradoura.
theological_decisions:
- issue: Permanência dos ciclos da criação
  choice: 'Futuro declarativo: “não cessarão” e “não mudarão”'
  alternative: Formulação modal, como “não deverão cessar”
  rationale: As formas verbais exprimem a continuidade assegurada dos ciclos, não uma obrigação dirigida a agentes humanos.
- issue: Relação entre ordem e cessação
  choice: Aplicar “não mudarão sua ordem nem cessarão” aos pares de frio/calor, estações e dia/noite
  alternative: Entender a cessação final como retomada de todos os elementos, inclusive semeadura e colheita
  rationale: A sequência sintática favorece a aplicação imediata aos elementos enumerados depois do ponto e vírgula, sem excluir a afirmação anterior sobre semeadura e colheita.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. O ponto e vírgula distingue as duas afirmações coordenadas sem alterar a sequência do ge'ez.
