base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/005.yaml
  text: And as for you, be fruitful and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.
translation:
  language: pt
  text: Quanto a vocês, sejam fecundos e multipliquem-se na terra; tornem-se numerosos sobre ela e sejam uma bênção sobre ela. Porei o medo e o pavor de vocês sobre tudo o que há na terra e no mar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሀቁ፡ ወተባዝኁ
  choice: sejam fecundos e multipliquem-se
  rationale: Reproduz a fórmula de bênção e fecundidade do texto, com linguagem bíblica clara e corrente em português.
- source_word: ወብዙኁ፡ ላዕሌሃ
  choice: tornem-se numerosos sobre ela
  rationale: Mantém a ideia distinta de aumentar em número e conserva a referência explícita à terra.
- source_word: ወኩኑ፡ ለበረከት፡ ላዕሌሃ
  choice: e sejam uma bênção sobre ela
  rationale: Preserva a formulação positiva e sua relação com a terra sem explicar além do que o original afirma.
- source_word: ፍርሀትክሙ፡ ወረዓድክሙ
  choice: o medo e o pavor de vocês
  rationale: Conserva os dois termos coordenados e sua intensidade crescente, em português natural.
- source_word: እሁብ፡ ዲበ፡ ኵሉ
  choice: Porei ... sobre tudo
  rationale: Traduz literalmente o ato divino de colocar ou impor esse medo sobre a totalidade indicada.
theological_decisions:
- issue: Alcance da bênção humana sobre a terra
  choice: sejam uma bênção sobre ela
  alternative: sejam abençoados sobre ela
  rationale: A construção apresenta os destinatários como bênção em relação à terra; a tradução não converte isso, sem necessidade, em mera recepção de bênção.
- issue: Objeto do medo e do pavor
  choice: tudo o que há na terra e no mar
  alternative: todos os seres da terra e do mar
  rationale: Mantém a abrangência e a generalidade do original, sem restringi-lo explicitamente a animais ou seres vivos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por formas naturais no Brasil sem regionalismos marcados. A repetição de “sobre ela” foi mantida para refletir a estrutura e a ênfase do original.
