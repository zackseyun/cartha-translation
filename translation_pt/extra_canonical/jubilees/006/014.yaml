base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/014.yaml
  text: And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day, at morning and evening. They shall make atonement for it continually before the Lord, so that they may keep it and not be uprooted.
translation:
  language: pt
  text: Esta lei não tem limite de dias, pois é para sempre. Eles a guardarão por todas as suas gerações, para que continuem suplicando em favor de vocês com sangue diante do altar, todos os dias, de manhã e à tarde. Farão continuamente expiação por ela[a] diante do Senhor, para que a guardem e não sejam arrancados pela raiz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente do pronome também pode ser entendido de modo mais amplo; o pronome no texto-fonte é ambíguo.
    reason: Preservar a ambiguidade do referente pronominal na expressão expiatória, sem fazer “por ela” parecer uma identificação interpretativa definitiva.
lexical_decisions:
- source_word: ይትመሀለሉ
  choice: continuem suplicando
  rationale: O verbo significa suplicar, rogar ou interceder. A escolha mantém sua distinção em relação ao verbo expiatório que aparece depois.
- source_word: ያስተሰርዩ
  choice: farão expiação
  rationale: O verbo expressa a ação de expiar ou efetuar expiação; o contexto de sangue e altar reforça o sentido cultual.
- source_word: ይሠረዉ
  choice: não sejam arrancados pela raiz
  rationale: Preserva a imagem forte do verbo passivo, que significa ser desarraigado ou erradicado, sem reduzi-lo à ideia de negligenciar.
- source_word: ዐቅመ፡ መዋዕል
  choice: limite de dias
  rationale: Reproduz de modo natural a ideia de uma duração delimitada; a oração seguinte esclarece que a lei é perpétua.
theological_decisions:
- issue: Distinção entre súplica e expiação
  choice: Traduzir a primeira ação como “suplicando” e a segunda como “farão expiação”
  alternative: Traduzir ambas como ações expiatórias
  rationale: O texto emprega verbos distintos. Preservar essa diferença evita fundir oração/intercessão e rito expiatório.
- issue: Consequência final da desobediência
  choice: “não sejam arrancados pela raiz”
  alternative: “não a negligenciem”
  rationale: A forma verbal é passiva e comunica desarraigamento ou erradicação, mantendo a severidade da advertência pactual.
- issue: Referente do pronome na frase expiatória
  choice: “por isso”, com nota de ambiguidade
  alternative: Explicitar “pela lei”, “pela aliança” ou “por vocês”
  rationale: O pronome do texto-fonte não identifica de maneira inequívoca o referente; a tradução evita resolver silenciosamente essa ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Em favor de vocês” comunica naturalmente a segunda pessoa do plural; “arrancados pela raiz” conserva a metáfora e a força do original.
