  to: Esta lei não tem limite de dias, pois é para sempre. Eles a guardarão por todas as suas gerações, para que continuem suplicando em favor de vocês com sangue diante do altar, todos os dias, de manhã e à tarde. Farão continuamente expiação por ela[a] diante do Senhor, para que a guardem e não sejam arrancados pela raiz.
