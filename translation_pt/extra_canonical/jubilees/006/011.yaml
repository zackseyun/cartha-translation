base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/011.yaml
  text: Therefore I have said that you also shall make a covenant with the children of Israel in this month on the mountain, with an oath; and you shall sprinkle blood on them because of all the words of the covenant that God made with them for all days.
translation:
  language: pt
  text: Por isso, eu disse que você também fará uma aliança com os filhos de Israel, neste mês, no monte, mediante juramento; e aspergirá sangue sobre eles por causa de todas as palavras da aliança que Deus fez com eles para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትካየድ፡ ኪዳነ
  choice: fará uma aliança
  rationale: Expressa de modo natural a construção etíope relativa ao estabelecimento de uma aliança, sem acrescentar conteúdo interpretativo.
- source_word: ደቂቀ፡ እስራኤል
  choice: filhos de Israel
  rationale: Mantém a designação tradicional e formal do povo de Israel.
- source_word: በዲበ፡ ደብር
  choice: sobre o monte
  rationale: Preserva a relação espacial do texto-fonte e o registro narrativo solene.
- source_word: ምስለ፡ ማሕላ
  choice: mediante juramento
  rationale: Comunica que a aliança é acompanhada ou ratificada por juramento, evitando a formulação portuguesa menos natural 'com um juramento'.
- source_word: ደመ
  choice: sangue
  rationale: Conserva o termo concreto e sacrificial do original, sem explicitar de quem é o sangue.
- source_word: እግዚአብሔር
  choice: Deus
  rationale: Segue o valor lexical indicado pelo testemunho fornecido e pela revisão auditada, sem importar a forma pactual 'SENHOR'.
- source_word: ለኵሉ፡ መዋዕል
  choice: para sempre
  rationale: Equivalente idiomático em português para a expressão temporal literalmente associada a 'todos os dias', indicando duração perpétua.
theological_decisions:
- issue: Agente da aliança na oração final
  choice: que Deus fez com eles
  alternative: que foi feita com eles
  rationale: A leitura textual apresentada inclui explicitamente እግዚአብሔር como agente; a tradução o conserva sem alterar a relação pactual.
- issue: Aplicação do sangue
  choice: aspergirá sangue sobre eles
  alternative: os aspergirá com sangue
  rationale: A opção escolhida acompanha mais de perto a estrutura e a imagem do original, sem especificar simbolismo ou finalidade além do que o texto declara.
- issue: Duração da aliança
  choice: para sempre
  alternative: por todos os dias
  rationale: A forma idiomática comunica perpetuidade sem decidir questões teológicas sobre a administração posterior da aliança.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. Mantiveram-se a segunda pessoa do singular, o paralelismo da frase e a tensão entre juramento, sangue e palavras da aliança.
