  yaml_path: translation/extra_canonical/jubilees/006/002.yaml
  text: And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he sprinkled wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the Lord.
translation:
  language: pt
  text: Ele pôs a gordura sobre o altar e tomou um boi, um carneiro, uma ovelha, cabritos, sal, uma rola e um pombinho. Ofereceu um holocausto sobre o altar, colocou sobre eles uma oferta misturada com azeite, aspergiu[a] vinho, pôs incenso sobre tudo e fez subir um aroma agradável, aceitável diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derramou”.'
    reason: Registra a alternativa tradicional ligada ao contexto de libação, embora o verbo da fonte favoreça “aspergiu”.
lexical_decisions:
- source_word: ነዝኀ
  choice: aspergiu
  rationale: O verbo ge'ez indica primariamente espalhar ou aspergir; por isso, mantém-se a ação expressa pela fonte, sem substituí-la pela formulação cultual mais esperada de 'derramar'.
- source_word: መዐዛ፡ ሠናየ
  choice: aroma agradável
  rationale: Expressão portuguesa natural e digna que reproduz o sentido literal de um odor bom ou aprazível.
- source_word: እግዚአብሔር
  choice: Senhor
  rationale: Traduz o título divino presente no texto sem empregar a forma tipográfica 'SENHOR', normalmente associada ao tetragrama hebraico.
- source_word: አጕለ፡ ርግብ
  choice: pombinho
  rationale: Reproduz a referência a um pombo jovem em linguagem comum e distingue-o da rola mencionada imediatamente antes.
theological_decisions:
- issue: Aceitabilidade da oferta
  choice: “aceitável diante do Senhor” modifica o aroma que sobe
  alternative: Entender a expressão como avaliação de todo o sacrifício
  rationale: A redação conserva a ligação sintática imediata com o aroma, sem excluir a implicação cultual mais ampla.
- issue: Identificação do nome divino
  choice: Senhor
  alternative: SENHOR
  rationale: A fonte ge'ez traz o título divino comum, não uma indicação que exija representar especificamente o tetragrama.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantiveram-se os termos cultuais correntes “altar”, “oferta”, “holocausto” e “incenso”, bem como a sequência concreta dos elementos sacrificiais.
