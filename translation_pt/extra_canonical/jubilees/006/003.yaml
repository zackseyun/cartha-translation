  text: And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth.
translation:
  language: pt
  text: 'E o SENHOR sentiu o aroma agradável e fez uma aliança com ele: nunca mais haveria águas de dilúvio para destruir a terra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጼነወ
  choice: sentiu o aroma
  rationale: Expressa de modo natural em português o ato de perceber pelo olfato, sem tornar a formulação desnecessariamente literal.
- source_word: እግዚአብሔር
  choice: o SENHOR
  rationale: Segue a representação bíblica portuguesa tradicional e reconhecível do título divino no contexto.
- source_word: መዐዛ፡ ሠናየ
  choice: o aroma agradável
  rationale: Reproduz a combinação de 'aroma/fragrância' e 'bom/agradável' em linguagem bíblica clara e atual.
- source_word: ተካየደ፡ ምስሌሁ፡ ኪዳነ
  choice: fez uma aliança com ele
  rationale: Comunica idiomaticamente a celebração de uma aliança, mantendo o referente masculino sem identificá-lo além do que o verso declara.
- source_word: ማየ፡ አይኅ
  choice: águas de dilúvio
  rationale: Preserva os dois elementos da expressão etíope, 'águas' e 'dilúvio', com formulação natural.
- source_word: ዘያማስን፡ ምድረ
  choice: para destruir a terra
  rationale: Mantém a finalidade ou efeito destrutivo e a abrangência de 'terra' sem acrescentar interpretação.
theological_decisions:
- issue: Linguagem antropomórfica sobre Deus sentir um aroma
  choice: Mantida diretamente
  alternative: Agradou-se do aroma
  rationale: O texto atribui explicitamente ao SENHOR a percepção do aroma; substituí-la por uma reação abstrata eliminaria a imagem concreta.
- issue: Força da promessa de não repetição
  choice: nunca mais haveria águas de dilúvio
  alternative: não houvesse águas de dilúvio
  rationale: A formulação portuguesa torna clara a negação futura enfática introduzida por 'para que não', sem inserir condições ausentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das ideias e a imagem concreta do original foram preservadas, evitando rigidez sintática.
