base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/007.yaml
  text: But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, so that your blood for your lives may not be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.
translation:
  language: pt
  text: Mas não comam carne com sua vida, com seu sangue, pois a vida de toda carne está no sangue, para que o sangue de vocês, por suas vidas, não seja requerido. Da mão de todo ser humano e da mão de todo ser vivo requererei o sangue humano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሱ
  choice: sua vida
  rationale: Embora o termo possa significar literalmente “espírito”, no paralelismo com “sangue” ele designa a vida da carne; esta escolha preserva o sentido contextual em português natural.
- source_word: ነፍሰ፡ ኵሉ፡ ዘሥጋ
  choice: a vida de toda carne
  rationale: “Vida” comunica aqui o princípio vital; “toda carne” mantém a expressão abrangente e concreta da fonte.
- source_word: ይትኀሠሥ / አኀሥሦ
  choice: seja requerido / requererei
  rationale: A repetição de “requerer” preserva o vínculo lexical entre a não exigência do sangue dos destinatários e a exigência do sangue humano ao responsável.
- source_word: ኵሉ፡ አኀሥሦ
  choice: todo ser vivo
  rationale: Neste contexto, a expressão refere-se aos seres vivos não humanos dos quais se exigirá prestação de contas; “ser vivo” evita restringi-la indevidamente a “animal”.
theological_decisions:
- issue: Relação entre vida e sangue
  choice: “com sua vida, isto é, com seu sangue”
  alternative: “com sua vida, com seu sangue”
  rationale: O texto apresenta vida e sangue em aposição ou estreita equivalência contextual. “Isto é” torna inteligível essa relação sem afirmar uma identidade metafísica além do contexto.
- issue: Sentido da cláusula de finalidade relativa ao sangue dos destinatários
  choice: “para que o sangue de vocês, por suas vidas, não seja requerido”
  alternative: “para que não se exija o sangue da vida de vocês”
  rationale: A formulação mantém a tensão e a construção pouco usual da fonte, sem transformar explicitamente a frase em ameaça, promessa ou explicação causal.
- issue: Responsabilidade pelo derramamento de sangue humano
  choice: “requererei o sangue humano”
  alternative: “pedirei contas pelo sangue humano”
  rationale: “Requererei” conserva a metáfora judicial e a repetição verbal da fonte; a alternativa seria mais idiomática, porém mais interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe ligeiramente solene adequada ao texto antigo. Mantiveram-se “toda carne”, “da mão de” e “requererei” para preservar imagens e conexões formais importantes, sem arcaísmos pronominais.
