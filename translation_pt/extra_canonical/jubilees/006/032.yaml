revisions:
- from: Mas, se transgredirem e não as observarem conforme lhes foi ordenado, então perturbarão todas as suas épocas; os anos sairão dessa ordem, e eles transgredirão as suas determinações.[a]
  to: Mas, se transgredirem e não as observarem conforme a sua ordem, então perturbarão todas as suas épocas; os anos sairão dessa ordem, e eles transgredirão as suas normas.[a]
  rationale: A revisão restaura a referência explícita ao “seu mandamento” no texto-fonte, sem resolver além do necessário o referente do possessivo. Mantêm-se o plural feminino do objeto, a agência ativa dos transgressores e a omissão, no corpo do texto, da cláusula repetitiva posta entre colchetes pela edição.
