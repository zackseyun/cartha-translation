base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/032.yaml
  text: But if they transgress and do not observe them according to his command, then they will disturb all their seasons, and the years will be moved from this order, and they will transgress their ordinances.
translation:
  language: pt
  text: Mas, se transgredirem e não as observarem conforme a sua ordem, então perturbarão todas as suas épocas; os anos sairão dessa ordem, e eles transgredirão as suas normas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A edição inclui entre colchetes uma frase repetitiva: “e perturbarão as suas épocas, e os anos sairão da ordem”.'
    reason: Registra a variante textual assinalada editorialmente sem incorporar ao corpo uma provável duplicação.
lexical_decisions:
- source_word: ወኢገብርዎን
  choice: e não as observarem
  rationale: O sufixo de objeto é feminino plural; “as” preserva a referência plural do texto, enquanto “observarem” expressa naturalmente o sentido de cumprir ou guardar prescrições.
- source_word: ያማስኑ
  choice: perturbarão
  rationale: 'A forma verbal é ativa e causativa: os transgressores perturbam ou desorganizam as épocas, em vez de as épocas serem apenas apresentadas na voz passiva.'
- source_word: ጊዜያቲሆሙ
  choice: as suas épocas
  rationale: “Épocas” comunica períodos determinados do calendário e evita restringir indevidamente o termo a estações climáticas.
- source_word: ይትሐወሱ
  choice: sairão dessa ordem
  rationale: O verbo indica mistura, confusão ou deslocamento; no contexto calendárico, a formulação comunica que os anos deixarão a ordem estabelecida.
- source_word: ሥርዐቶሙ
  choice: as suas determinações
  rationale: O termo pode designar ordem, regra, estatuto ou disposição; “determinações” mantém o sentido normativo sem impor terminologia denominacional.
theological_decisions:
- issue: Referente do objeto em “não as observarem”
  choice: Manter o objeto no feminino plural
  alternative: 'Empregar o singular: “não o observarem”'
  rationale: A morfologia ge'ez apoia um objeto feminino plural; a tradução não deve harmonizá-lo silenciosamente com um possível referente singular do contexto.
- issue: Agência na perturbação das épocas
  choice: 'Traduzir na voz ativa: “perturbarão”'
  alternative: 'Voz passiva: “as épocas serão perturbadas”'
  rationale: A forma causativa ativa atribui aos transgressores a ação de desorganizar o calendário e deve ser preservada.
- issue: Identidade do sujeito na cláusula final
  choice: 'Preservar o sujeito humano: “eles transgredirão”'
  alternative: Fazer das épocas e dos anos o sujeito da transgressão
  rationale: A leitura adotada acompanha a continuidade do sujeito plural humano, mas a sintaxe admite alguma tensão; evita-se ampliar teologicamente a afirmação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação em três membros torna perceptível a progressão entre desobediência, desordem do calendário e violação das determinações.
