  revision_rationale: A revisão restaura a referência explícita ao “seu mandamento” no texto-fonte, sem resolver além do necessário o referente do possessivo. Mantêm-se o plural feminino do objeto, a agência ativa dos transgressores e a omissão, no corpo do texto, da cláusula repetitiva posta entre colchetes pela edição.
