base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/018.yaml
  text: And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah's death. And from the day of Noah's death his sons corrupted it until the days of Abraham, and they ate blood.
translation:
  language: pt
  text: 'E toda esta festa foi celebrada no céu, desde o dia da criação até os dias de Noé: vinte e seis jubileus e cinco semanas de anos. Noé e seus filhos a observaram durante sete jubileus e uma semana de anos, até o dia da morte de Noé. Desde o dia da morte de Noé, seus filhos a corromperam até os dias de Abraão, e comeram sangue.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓል
  choice: festa
  rationale: O termo designa uma celebração ou festividade estabelecida; “festa” é natural, claro e preserva o sentido cultual sem acrescentar uma classificação denominacional.
- source_word: በሰማይ
  choice: no céu
  rationale: Tradução direta da expressão locativa, mantendo a afirmação cosmológica do texto.
- source_word: ኢዮቤልዉ
  choice: jubileus
  rationale: Mantém a unidade cronológica técnica própria de Jubileus, em vez de convertê-la interpretativamente em anos.
- source_word: ሱባዔ፡ ዓመት / ሱባዔ፡ ዓመታት
  choice: semana(s) de anos
  rationale: Reproduz a unidade de sete anos expressa na fonte e conserva a terminologia cronológica do livro.
- source_word: ዐቀብዋ
  choice: a observaram
  rationale: Expressa a ideia de guardar ou cumprir uma festa; o pronome retoma claramente “festa” em português.
- source_word: ደመ
  choice: sangue
  rationale: Equivalente direto, deixando intacta a conexão textual entre a corrupção da observância e o consumo de sangue.
theological_decisions:
- issue: Celebração celestial da festa
  choice: foi celebrada no céu
  alternative: era observada no céu
  rationale: A tradução conserva a afirmação explícita da fonte sem explicar quem a celebrava nem harmonizá-la com qualquer tradição teológica.
- issue: Corrupção da festa pelos filhos de Noé
  choice: seus filhos a corromperam
  alternative: seus filhos a negligenciaram
  rationale: “Corromperam” preserva a força e a tensão da formulação transmitida, sem reduzir o ato a mera omissão.
- issue: Relação entre corrupção e consumo de sangue
  choice: e comeram sangue
  alternative: comendo sangue
  rationale: A coordenação mantém as duas afirmações lado a lado, sem decidir se o consumo de sangue define integralmente a corrupção ou se é um ato adicional relacionado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe narrativa clara. Foram mantidas as unidades cronológicas antigas (“jubileus” e “semanas de anos”) e a repetição de “dia da morte de Noé”, importante para a estrutura temporal do original.
