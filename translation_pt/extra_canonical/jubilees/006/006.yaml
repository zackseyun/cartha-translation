base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/006.yaml
  text: And behold, I have given you all the beasts and everything that flies and everything that moves on the earth, and the fish in the waters, and everything for food; like the green plants I have given you everything to eat.
translation:
  language: pt
  text: E eis que lhes dei todos os animais, tudo o que voa, tudo o que se move sobre a terra, os peixes nas águas e tudo o que serve de alimento. Assim como lhes dei as plantas verdes, dei-lhes tudo para comer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊተ (ʾarāwit)
  choice: animais
  rationale: Termo coletivo para animais ou feras; “animais” é abrangente e natural no contexto.
- source_word: ዘይሰርር (za-yəsarrər)
  choice: o que voa
  rationale: Expressa aquilo que voa, preservando a referência às criaturas voadoras que havia sido omitida numa versão anterior.
- source_word: ዘይትሐወስ (za-yətḥawwas)
  choice: o que se move
  rationale: Verbo relativo com sentido de mover-se ou deslocar-se; a formulação mantém a amplitude do original sem restringi-lo a répteis.
- source_word: ለሲሲት (la-sisīt)
  choice: o que serve de alimento
  rationale: A construção indica destinação para alimento; esta redação é idiomática e conserva a generalidade do texto.
- source_word: ሐምለ፡ ሣዕር (ḥamla śaʿr)
  choice: plantas verdes
  rationale: Expressão vegetal comparável a “verdura/vegetação da erva”; “plantas verdes” comunica o sentido com clareza em português atual.
theological_decisions:
- issue: Extensão da concessão alimentar
  choice: “dei-lhes tudo para comer”
  alternative: “tudo isso lhes servirá de alimento”
  rationale: Preserva a formulação abrangente e a tensão do texto, sem acrescentar limitações alimentares ou harmonizações externas.
- issue: Relação com a concessão anterior das plantas
  choice: “Assim como lhes dei as plantas verdes”
  alternative: “como a erva verde”
  rationale: Torna explícita a comparação indicada por ከመ, sem impor uma interpretação denominacional sobre a mudança na dieta.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. A enumeração foi mantida clara e ritmada; não se acrescentaram categorias nem explicações ausentes do texto ge’ez.
