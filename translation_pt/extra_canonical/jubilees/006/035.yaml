  text: And there will be those who will assuredly make observations of the moon, for it corrupts the seasons.
translation:
  language: pt
  text: E[a] haverá os que certamente farão observações da lua, pois ela corrompe as estações.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Pois haverá».'
    reason: Registra a antiga alternativa causal para a ligação da frase, embora a conjunção ge’ez inicial favoreça «E».
lexical_decisions:
- source_word: ወይከውኑ
  choice: E haverá
  rationale: Preserva a conjunção inicial ወ («e») e o valor futuro de ይከውኑ.
- source_word: ያስተሐይጹ፡ ወርኀ፡ በሑያጼ
  choice: certamente farão observações da lua
  rationale: Expressa em português natural a ideia de observar ou calcular a lua com determinação ou precisão, sem acrescentar uma prática calendárica não explicitada nesta frase.
- source_word: እስመ
  choice: pois
  rationale: Introduz claramente a oração causal.
- source_word: ታማስን
  choice: corrompe
  rationale: Mantém a força do verbo, que indica corromper, arruinar ou deteriorar, em vez de apenas perturbar.
- source_word: ጊዜያተ
  choice: as estações
  rationale: No contexto calendárico, «estações» comunica o sentido contextual de períodos ou tempos determinados.
theological_decisions:
- issue: Força da crítica ao cálculo lunar
  choice: corrompe as estações
  alternative: perturba as estações
  rationale: O verbo ge’ez é mais forte que «perturbar»; a tradução conserva a afirmação polêmica do texto sem a suavizar.
- issue: Referente do pronome implícito em «corrompe»
  choice: ela, isto é, a lua
  alternative: isso, isto é, a prática de observá-la
  rationale: Segue a leitura contextual adotada pelo texto de consulta, mas evita desenvolver uma explicação doutrinária além da formulação do versículo.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. «Fazer observações da lua» preserva o caráter técnico da expressão sem soar excessivamente especializado.
