  text: And as for you, be fruitful and multiply upon the earth.
translation:
  language: pt
  text: E vocês também, sejam fecundos e multipliquem-se sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንትሙኒ
  choice: E vocês também
  rationale: Preserva a conjunção, o pronome plural enfático e a partícula de inclusão “também” do ge’ez.
- source_word: ለሀቁ
  choice: sejam fecundos
  rationale: Expressa de modo natural e digno a ideia de produzir fruto, mantendo a formulação tradicional da bênção de fecundidade.
- source_word: ብዙአ
  choice: multipliquem-se
  rationale: Mantém distinta a segunda ordem, referente ao aumento em número, sem fundi-la com a fecundidade.
- source_word: ዲበ ምድር
  choice: sobre a terra
  rationale: Reproduz diretamente a relação espacial indicada pelo ge’ez e conserva a amplitude de “terra”.
theological_decisions:
- issue: Caráter da formulação dirigida aos destinatários
  choice: 'Manter dois imperativos coordenados: “sejam fecundos e multipliquem-se”'
  alternative: Resumir como “aumentem muito”
  rationale: A fonte apresenta duas ideias relacionadas, mas distintas; mantê-las evita reduzir a bênção ou ordem a mero crescimento numérico.
translation_notes:
  register: Português moderno, claro e solene, com “vocês” para legibilidade ampla no Brasil. A expressão bíblica reconhecível “sejam fecundos e multipliquem-se” preserva a estrutura do original sem recorrer a formas verbais arcaicas.
