  yaml_path: translation/extra_canonical/jubilees/006/013.yaml
  text: And you, command the children of Israel not to eat any blood, so that their name and their seed may be before Yahweh our God always.
translation:
  language: pt
  text: E você, ordene aos filhos de Israel que não comam sangue algum, para que o nome deles e a descendência deles estejam sempre diante de Yahweh, nosso Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ ደመ
  choice: sangue algum
  rationale: A construção transmite a proibição de consumir qualquer sangue; «sangue algum» é natural em português e preserva o alcance total da expressão.
- source_word: ዘርኦሙ
  choice: a descendência deles
  rationale: O termo significa literalmente «semente», mas neste contexto designa os descendentes; «descendência» comunica o sentido genealógico com clareza e dignidade.
- source_word: እግዚአብሔር
  choice: Yahweh
  rationale: Representa explicitamente o nome divino, em conformidade com a evidência da fonte e com a política editorial indicada.
- source_word: ኵሎ፡ መዋዕለ
  choice: sempre
  rationale: A expressão, literalmente relacionada a «todos os dias», tem valor temporal contínuo; «sempre» é a equivalência portuguesa mais natural neste contexto.
theological_decisions:
- issue: Finalidade expressa pela permanência do nome e da descendência diante de Deus
  choice: «para que o nome deles e a descendência deles estejam sempre diante de Yahweh»
  alternative: «a fim de que o nome e a descendência deles permaneçam para sempre diante de Yahweh»
  rationale: A tradução mantém a relação final e a linguagem de presença diante de Deus sem explicar teologicamente em que consiste essa condição nem acrescentar a ideia lexical de «permanecer».
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. Conservou-se o tratamento direto no singular («você») e a formulação solene «diante de Yahweh, nosso Deus».
