revisions:
- from: e como estatuto, para servir de testemunho para sempre.[a] E Noé os estabeleceu para si como festas para todas as gerações, para sempre.
  to: E um estatuto para testemunho perpétuo.[a] E Noé os instituiu para si como festas para gerações sem fim.
  rationale: A revisão restaura uma representação mais direta do substantivo explícito «estatuto» e da expressão «para testemunho», evitando a paráfrase verbal do rascunho. Mantém-se «para si» e o pronome plural sem antecedente explicitado, pois ambos refletem o texto e a dependência do contexto anterior. A expressão final foi ajustada para uma formulação portuguesa natural que conserva a noção de gerações de duração perpétua.
