  text: and an ordinance for a testimony forever. And Noah ordained them for himself as festivals for everlasting generations,
translation:
  language: pt
  text: E um estatuto para testemunho perpétuo.[a] E Noé os instituiu para si como festas para gerações sem fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como testemunho perpétuo”.'
    reason: A relação sintática entre «estatuto» e «testemunho» admite uma leitura mais diretamente apositiva; a nota preserva essa alternativa sem introduzir um verbo ausente do texto.
lexical_decisions:
- source_word: ሥርዓት (śərʿāt)
  choice: estatuto
  rationale: Expressa uma determinação normativa e preserva o substantivo explícito no ge'ez.
- source_word: ስምዕ (səmʿ)
  choice: testemunho
  rationale: Equivalente natural que mantém a função memorial e comprobatória do termo.
- source_word: ሠርዓን (śarrāʿan)
  choice: os estabeleceu
  rationale: Verbo ligado à ideia de ordenar ou instituir; “estabeleceu” é corrente em português e se ajusta às festas como objeto plural.
- source_word: በዓላት (baʿālāt)
  choice: festas
  rationale: Designa celebrações ou festividades determinadas.
- source_word: ለትውልድ፡ ዘለዓለም
  choice: para todas as gerações, para sempre
  rationale: Mantém separadamente as ideias de continuidade geracional e duração perpétua, sem a rigidez de uma reprodução palavra por palavra.
theological_decisions:
- issue: Relação sintática entre “estatuto” e “testemunho”
  choice: como estatuto, para servir de testemunho para sempre
  alternative: como estatuto e testemunho para sempre
  rationale: Preserva a formulação do texto, em que “estatuto” é seguido por uma expressão de finalidade ou função, sem fundir os dois substantivos.
- issue: Referente do pronome plural em “os estabeleceu”
  choice: manter o pronome “os” sem explicitar o referente
  alternative: explicitar “esses dias” ou “esses períodos”
  rationale: O referente depende do contexto anterior; não o especificar neste versículo conserva a coesão e a ambiguidade do original.
- issue: Expressão reflexiva referente a Noé
  choice: para si
  alternative: por sua própria iniciativa
  rationale: “Para si” reproduz o elemento pronominal do ge'ez sem acrescentar uma inferência sobre iniciativa ou autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “para sempre” foi mantida porque ocorre em duas unidades distintas do texto e reforça a duração perpétua.
