review_pass:
  verdict: revise
  source_fidelity: 'A primeira oração do rascunho interpreta excessivamente a relação entre os substantivos: o ge''ez traz explicitamente «e um estatuto para testemunho para sempre», sem o verbo acrescentado «servir». A segunda oração conserva adequadamente o pronome plural não especificado e o elemento «para si».'
  naturalness: «E como estatuto, para servir de testemunho» é menos direto e cria uma construção sintática artificial. «E um estatuto para testemunho perpétuo» é conciso, natural em registro bíblico moderno e mais próximo da formulação-fonte. «Gerações sem fim» comunica com fluência a duração contínua de «gerações eternas/perpétuas».
  terminology: «Estatuto», «testemunho», «instituiu» e «festas» são escolhas apropriadas e consistentes com o registro normativo e cultual do texto.
  issues:
  - severity: medium
    issue: Acréscimo interpretativo de «para servir de» na primeira oração.
    rationale: O substantivo «estatuto» é seguido diretamente por uma expressão que pode ser entendida como finalidade ou aposição. O verbo «servir» não está expresso e reduz desnecessariamente a ambiguidade sintática preservada pelo original e pelo audit trail inglês.
  - severity: low
    issue: «Para todas as gerações, para sempre» é mais expansivo e repetitivo do que a expressão-fonte.
    rationale: A formulação ge'ez corresponde mais estreitamente a «para gerações sem fim» (ou «para gerações perpétuas»).
  revised_text: E um estatuto para testemunho perpétuo.[a] E Noé os instituiu para si como festas para gerações sem fim.
  revised_footnotes:
  - marker: a
    text: 'Ou: “como testemunho perpétuo”.'
    reason: A relação sintática entre «estatuto» e «testemunho» admite uma leitura mais diretamente apositiva; a nota preserva essa alternativa sem introduzir um verbo ausente do texto.
  revision_rationale: A revisão restaura uma representação mais direta do substantivo explícito «estatuto» e da expressão «para testemunho», evitando a paráfrase verbal do rascunho. Mantém-se «para si» e o pronome plural sem antecedente explicitado, pois ambos refletem o texto e a dependência do contexto anterior. A expressão final foi ajustada para uma formulação portuguesa natural que conserva a noção de gerações de duração perpétua.
