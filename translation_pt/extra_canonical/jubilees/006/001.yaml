base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/001.yaml
  text: And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.
translation:
  language: pt
  text: 'Na lua nova do terceiro mês, Noé saiu da arca e construiu um altar naquele monte. Fez expiação pela terra: tomou um cabrito e, com o sangue dele, fez expiação por toda a culpa da terra, pois tudo o que nela existia havia sido destruído, com exceção dos que estavam na arca com Noé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቁ፡ ለወርኅ፡ ሣልስ
  choice: na lua nova do terceiro mês
  rationale: Conserva a referência calendárica do ge'ez e a formulação explícita da fonte de consulta, sem convertê-la interpretativamente em “primeiro dia”.
- source_word: ወአስተስረየ
  choice: fez expiação
  rationale: O verbo expressa a realização de expiação; esta escolha preserva o sentido cultual e sua repetição no versículo.
- source_word: መሐስአ፡ ጠሊ
  choice: um cabrito
  rationale: Designa o filhote de uma cabra; “cabrito” é a forma corrente e precisa em português.
- source_word: አበሳ፡ ምድር
  choice: toda a culpa da terra
  rationale: “Culpa” mantém o aspecto de responsabilidade ou transgressão associado ao termo, sem reduzir a expressão apenas a impureza ritual.
- source_word: ተደምሰሰ
  choice: havia sido destruído
  rationale: Reproduz a ideia de apagamento ou destruição total no contexto do dilúvio.
theological_decisions:
- issue: A terra como objeto de expiação
  choice: fez expiação pela terra
  alternative: purificou a terra
  rationale: A tradução mantém a linguagem expiatória explícita e a tensão teológica do texto, sem substituí-la por uma interpretação mais restrita de purificação.
- issue: Relação entre sangue e expiação
  choice: com o sangue dele, fez expiação por toda a culpa da terra
  alternative: purificou com o sangue todo o pecado da terra
  rationale: Preserva tanto o papel instrumental do sangue quanto a repetição do verbo expiatório, sem definir além da fonte o mecanismo teológico envolvido.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O nome “Noé” foi explicitado no início para evitar um pronome sem antecedente no versículo isolado; a repetição final permanece conforme a fonte. A sintaxe foi levemente segmentada para fluidez, sem eliminar as repetições deliberadas.
