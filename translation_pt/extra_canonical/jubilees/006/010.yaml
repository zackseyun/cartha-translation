  yaml_path: translation/extra_canonical/jubilees/006/010.yaml
  text: And Noah and his sons swore that they would not eat any blood that is in any flesh, and he established a covenant before the Lord God forever throughout all the generations of the earth in this month.
translation:
  language: pt
  text: E Noé e seus filhos juraram não comer sangue algum que há em qualquer carne; e ele estabeleceu uma aliança diante do Senhor Deus para sempre, por todas as gerações da terra, nesse mês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐኩ
  choice: juraram
  rationale: Reproduz diretamente o verbo de juramento no plural, tendo Noé e seus filhos como sujeitos.
- source_word: ኢይብልዑ፡ ኵሎ፡ ደመ፡ ዘበኵሉ፡ ሥጋ
  choice: não comer sangue algum que estivesse em qualquer carne
  rationale: Mantém a proibição abrangente e a relação do sangue com toda carne, em português natural.
- source_word: ተካየደ፡ ኪዳነ
  choice: estabeleceu uma aliança
  rationale: Expressa formalmente a ação de instituir ou firmar a aliança, sem acrescentar conteúdo não explícito.
- source_word: እግዚአብሔር፡ አምላክ
  choice: Senhor Deus
  rationale: Traduz os títulos divinos do ge'ez sem introduzir o nome próprio Yahweh.
- source_word: ለዓለም፡ በኵሉ፡ ትውልደ፡ ምድር
  choice: para sempre, por todas as gerações da terra
  rationale: Conserva tanto a duração perpétua quanto a abrangência geracional da formulação original.
- source_word: በዝንቱ፡ ወርኅ
  choice: nesse mês
  rationale: Vertido como referência temporal ao mês mencionado no contexto precedente.
theological_decisions:
- issue: Sujeito de “estabeleceu uma aliança”
  choice: ele, isto é, Noé
  alternative: Noé e seus filhos estabeleceram a aliança
  rationale: O verbo aparece no singular após o juramento plural; a tradução preserva essa mudança gramatical sem harmonizá-la.
- issue: Designação divina
  choice: Senhor Deus
  alternative: SENHOR Deus
  rationale: O texto ge'ez apresenta títulos divinos, não o tetragrama; a forma escolhida evita importar o nome Yahweh.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação explicita a passagem do juramento coletivo à ação singular de Noé, preservando a tensão gramatical do original.
