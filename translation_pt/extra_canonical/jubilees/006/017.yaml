  text: For this reason it is ordained and written on the heavenly tablets that they should celebrate the Feast of Weeks in this month, once each year, to renew the covenant every year.
translation:
  language: pt
  text: Por essa razão, foi estabelecido e escrito nas tábuas celestiais que celebrassem a Festa das Semanas neste mês, uma vez por ano, para renovar a aliança ano após ano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ፡ ወተጽሕፈ
  choice: foi estabelecido e escrito
  rationale: Preserva os dois verbos passivos do ge'ez e expressa de modo natural a ideia de uma determinação registrada.
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Equivalência direta para as tábuas do céu, mantendo a expressão própria da obra.
- source_word: በዓል፡ ዘሱባዔ
  choice: Festa das Semanas
  rationale: Nome convencional e claro da festividade; a inicial maiúscula indica que se trata de uma celebração específica.
- source_word: ለሐዲስ፡ ኪዳን
  choice: para renovar a aliança
  rationale: Reproduz a finalidade expressa no texto sem especificar agentes ou conteúdo além do original.
- source_word: በኵሉ፡ ዓም፡ ወዓመት
  choice: todos os anos
  rationale: Transmite a recorrência anual enfática da expressão, sem uma repetição artificial em português.
theological_decisions:
- issue: Natureza e identidade da aliança
  choice: a aliança
  alternative: sua aliança / a nova aliança
  rationale: O texto menciona a renovação da aliança sem explicitar aqui seu possuidor nem classificá-la como uma aliança diferente; a tradução evita resolver essa questão.
- issue: Autoridade que estabelece a observância
  choice: foi estabelecido e escrito
  alternative: Deus estabeleceu e escreveu
  rationale: Mantém a voz passiva do texto-fonte e não introduz um sujeito que não aparece expressamente no versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe conserva o tom normativo do original sem soar arcaica; não são necessárias notas de rodapé.
