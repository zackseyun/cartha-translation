  yaml_path: translation/extra_canonical/jubilees/006/030.yaml
  text: And all the days of the commandments are fifty-two weeks of days, and all of them make a complete year. Thus it is inscribed and ordained on the heavenly tablets, and there is no neglecting a single year, from year to year.
translation:
  language: pt
  text: Todos os dias dos mandamentos perfazem cinquenta e duas semanas de dias e constituem um ano completo. Assim foi inscrito e estabelecido nas tábuas celestes, e não se omitirá[a] um único ano, de ano em ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: não se deixará passar; ou: não se transgredirá.'
    reason: O verbo pode comunicar a ideia de omitir, deixar passar ou transgredir a ordem calendárica.
lexical_decisions:
- source_word: ትእዛዛት
  choice: mandamentos
  rationale: O termo ge'ez está no plural; a tradução preserva essa forma, em vez do singular encontrado em versões mais antigas.
- source_word: ፶ምሳ፡ ወክልኤ፡ ሰንበታት፡ መዋዕል
  choice: cinquenta e duas semanas de dias
  rationale: Neste contexto calendárico, ሰንበታት designa ciclos semanais; a formulação mantém a expressão explícita 'de dias' do texto-fonte.
- source_word: ዓመት፡ ፍጹም
  choice: ano completo
  rationale: Reproduz diretamente a ideia de um ano pleno ou completo, formado pelas cinquenta e duas semanas.
- source_word: ተቈርፀ፡ ወተሠርዐ
  choice: foi inscrito e estabelecido
  rationale: 'Mantém a ordem dos verbos no ge''ez: primeiro gravar/inscrever, depois ordenar/estabelecer. ''Estabelecido'' comunica aqui uma determinação fixada.'
- source_word: ጽላት፡ ሰማይ
  choice: tábuas celestes
  rationale: Expressão natural e digna em português para as tábuas pertencentes ao âmbito celestial.
- source_word: ተዐድዎ
  choice: deixará passar
  rationale: No contexto da observância anual, exprime a ideia de passar por cima, omitir ou deixar sem observância, sem restringir o termo a uma única nuance.
theological_decisions:
- issue: Caráter normativo do calendário anual
  choice: não se deixará passar um único ano
  alternative: não se transgredirá um único ano
  rationale: A opção adotada preserva a exigência de observância contínua sem introduzir uma terminologia técnica de pecado mais forte do que o contexto necessariamente exige.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Conservou-se a estrutura calendárica incomum 'cinquenta e duas semanas de dias' e a repetição enfática 'de ano em ano'.
