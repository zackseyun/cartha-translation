revisions:
- from: Todos os dias dos mandamentos serão cinquenta e duas semanas de dias, e todos eles constituirão um ano completo. Assim foi inscrito e estabelecido nas tábuas celestes, e não se deixará passar[a] um único ano, de ano em ano.
