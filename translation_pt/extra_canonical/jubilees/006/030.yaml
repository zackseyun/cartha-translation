review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente os plurais de «mandamentos», «cinquenta e duas semanas de dias», o «ano completo», as «tábuas celestes» e a sequência «inscrito e estabelecido». Contudo, o futuro em «serão/constituirão» não é exigido pelo enunciado fonte, que apresenta a regra calendárica como realidade estabelecida.
  naturalness: «Todos os dias dos mandamentos serão cinquenta e duas semanas de dias» é pouco natural em português, pois equipara diretamente «dias» a «semanas». «Perfazem» exprime de modo idiomático a composição do ano sem diminuir a explicitude da fonte. «Não se omitirá um único ano» é mais conciso e formal que «não se deixará passar um único ano».
  terminology: «Mandamentos», «tábuas celestes» e «ano completo» são escolhas adequadas. «Estabelecido» traduz de forma segura o segundo verbo, depois de «inscrito», respeitando a ordem do ge'ez.
  issues:
  - severity: medium
    issue: Construção e tempo verbal em «Todos os dias dos mandamentos serão cinquenta e duas semanas de dias, e todos eles constituirão...»
    rationale: A cópula/fórmula fonte descreve a estrutura fixa do ano, não uma previsão. Além disso, a construção literal é pouco idiomática em português. «Perfazem» mantém o sentido quantitativo e torna clara a relação entre os dias e as semanas.
  - severity: low
    issue: «não se deixará passar um único ano»
    rationale: É possível, mas «não se omitirá um único ano» corresponde mais diretamente à ideia de não negligenciar/omitir e preserva a formulação normativa impessoal.
  revised_text: Todos os dias dos mandamentos perfazem cinquenta e duas semanas de dias e constituem um ano completo. Assim foi inscrito e estabelecido nas tábuas celestes, e não se omitirá[a] um único ano, de ano em ano.
  revised_footnotes:
  - marker: a
    text: 'Ou: não se deixará passar; ou: não se transgredirá.'
    reason: O verbo pode comunicar a ideia de omitir, deixar passar ou transgredir a ordem calendárica.
  revision_rationale: A revisão substitui o futuro desnecessário por uma formulação gnômica e idiomática que preserva o cálculo de cinquenta e duas semanas de dias e o caráter fixo do ano. Também ajusta o verbo final a uma expressão portuguesa mais direta, mantendo em nota as alternativas sem impor uma única nuance interpretativa.
