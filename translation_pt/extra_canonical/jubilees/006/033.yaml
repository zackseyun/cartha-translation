  yaml_path: translation/extra_canonical/jubilees/006/033.yaml
  text: And all the children of Israel will forget, and will not find the path of the years, and they will forget the new moons and appointed times and sabbaths, and they will go wrong as to the whole order of the years.
translation:
  language: pt
  text: E todos os filhos de Israel se esquecerão e não encontrarão o caminho dos anos; esquecerão as luas novas, os tempos determinados e os sábados, e se desviarão quanto a toda a ordem dos anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ እስራኤል
  choice: filhos de Israel
  rationale: Preserva a expressão coletiva tradicional e é natural no registro bíblico em português.
- source_word: ፍኖተ፡ ዓመታት
  choice: o caminho dos anos
  rationale: Mantém a metáfora do texto-fonte para o curso ou cômputo correto dos anos, sem explicá-la além do original.
- source_word: ሠርቀ
  choice: luas novas
  rationale: No contexto calendárico, designa as luas novas e os períodos por elas assinalados.
- source_word: ጊዜ
  choice: tempos determinados
  rationale: Expressa o sentido de tempos fixados ou ocasiões designadas no calendário, evitando o sentido vago de simples estações.
- source_word: ሰንበተ
  choice: sábados
  rationale: Equivalente convencional e claro para os dias sabáticos mencionados no plural.
- source_word: ሥርዐተ፡ ዘዓመታት
  choice: toda a ordem dos anos
  rationale: Conserva a ideia de ordenação ou sistema calendárico dos anos presente no original.
- source_word: ይጌግዩ
  choice: se desviarão
  rationale: Comunica erro e afastamento do curso correto, adequando-se à imagem anterior do caminho dos anos.
theological_decisions:
- issue: Natureza dos tempos mencionados
  choice: tempos determinados
  alternative: festas; estações
  rationale: O contexto é calendárico e pode envolver ocasiões cultuais fixadas, mas o texto não exige que o termo seja reduzido exclusivamente a festas; a formulação preserva essa amplitude.
- issue: Sentido do desvio final
  choice: se desviarão quanto a toda a ordem dos anos
  alternative: errarão em todo o cálculo dos anos
  rationale: A tradução mantém a linguagem ampla de erro ou desvio referente à ordem anual, sem acrescentar explicitamente a noção técnica de cálculo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve cadência bíblica. A repetição de “esquecerão” e as metáforas “caminho dos anos” e “ordem dos anos” foram preservadas por serem elementos significativos do texto-fonte.
