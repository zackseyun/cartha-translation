  text: Whoever sheds the blood of a man, by a man shall his blood be shed; for in the likeness of God he made man.
translation:
  language: pt
  text: Quem derramar sangue humano, por um ser humano terá o seu sangue derramado, pois Deus fez o ser humano à sua semelhança.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Adão”.'
    reason: A forma ge'ez ለአዳም permite formalmente a leitura do nome próprio, embora o contexto favoreça o sentido genérico.
lexical_decisions:
- source_word: ዘይከዑ፡ ደመ፡ ሰብእ
  choice: Quem derramar sangue humano
  rationale: Expressa naturalmente em português a construção relativa do ge'ez e entende ሰብእ em sentido genérico, conforme o contexto da citação de Gênesis 9:6.
- source_word: በሰብእ፡ ደሙ፡ ይትከዐው
  choice: por mãos humanas terá o seu sangue derramado
  rationale: Preserva a relação agente-meio indicada por በሰብእ sem sugerir que o mesmo indivíduo derramará o próprio sangue; a forma futura mantém o caráter sentencioso da declaração.
- source_word: በምስለ፡ እግዚአብሔር
  choice: à sua semelhança
  rationale: Traduz literalmente a ideia de semelhança divina e usa o possessivo de modo natural, tendo Deus como referente.
- source_word: ለአዳም
  choice: o ser humano
  rationale: Embora a forma possa ser lida como 'Adão', aqui ela reflete o uso genérico de 'adam na citação de Gênesis 9:6 e fundamenta a dignidade da humanidade em geral.
theological_decisions:
- issue: Sentido de ለአዳም no fundamento da proibição
  choice: o ser humano
  alternative: Adão
  rationale: O contexto liga o sangue humano à criação da humanidade à semelhança de Deus. A leitura genérica preserva esse alcance; a alternativa legítima é registrada em nota, sem impor uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação mantém o paralelismo solene do dito e explicita o agente com “por mãos humanas” para evitar ambiguidade sintática indevida. O marcador [a] aparece no texto principal.
