review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto a sequência e os contrastes do ge''ez: apegar-se aos mandamentos, não seguir ídolos e impurezas, não fabricar imagens, sua vacuidade e ausência de espírito, a confiança no nada, e a proibição de cultuá-los ou prostrar-se diante deles. A revisão conserva o caráter fragmentário inicial e final. Ajusta-se o plural de «impurezas» e a formulação de «obra de mãos» para maior precisão e idiomaticidade.'
  naturalness: «Não andem atrás» é compreensível, mas «não sigam» é mais natural em português moderno neste uso figurado. «Obra de mãos» isoladamente soa incompleto; «obra de mãos humanas» é a expressão portuguesa corrente e não altera o sentido. «Cultuar» distingue adequadamente o serviço religioso da prostração, que o texto apresenta em verbos sucessivos.
  terminology: «Deuses de metal fundido» e «imagens esculpidas» preservam a distinção entre objetos fundidos e talhados. «Vaidade», «espírito» e «impurezas» mantêm o registro religioso sem impor uma interpretação doutrinária. «Confiar no nada» comunica de modo natural a ênfase da construção semítica preservada também no audit trail inglês.
  issues:
