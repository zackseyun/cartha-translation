  yaml_path: translation/extra_canonical/jubilees/020/004.yaml
  text: the God of heaven, and cling to all his commandments, and do not walk after their idols and after their uncleanness. And do not make for yourselves gods of cast metal or carved images, for they are emptiness, and there is no spirit in them; for they are the work of hands, and all who trust in them trust in nothing. Do not serve them, and do not bow down to them. But serve the God
translation:
  language: pt
  text: o Deus do céu, apeguem-se a todos os seus mandamentos e não sigam os ídolos deles nem as suas impurezas. Não façam para vocês deuses de metal fundido nem imagens esculpidas, pois eles são vaidade, e não há neles espírito algum; são obra de mãos humanas, e todos os que neles confiam confiam no nada. Não os cultuem nem se prostrem diante deles. Mas cultuem o Deus
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትጸመዱ
  choice: apeguem-se
  rationale: Expressa a ideia de aderir firmemente ou manter-se ligado aos mandamentos, em português atual e natural.
- source_word: ርኵሶሙ
  choice: impureza deles
  rationale: Preserva o sentido cultual e moral de impureza sem restringi-lo a sujeira física.
- source_word: አማልክተ፡ ሰብክ
  choice: deuses de metal fundido
  rationale: Torna explícito o processo de fundição indicado pela expressão etíope, evitando a formulação pouco natural 'deuses fundidos'.
- source_word: ግልፈዋተ
  choice: imagens esculpidas
  rationale: Distingue imagens talhadas das figuras produzidas por fundição.
- source_word: ከንቱ
  choice: vaidade
  rationale: Mantém a noção de vazio, inutilidade e falta de realidade eficaz própria dos ídolos.
- source_word: ኢምነትኒ፡ መንፈስ፡ አልቦሙ
  choice: não há neles espírito algum
  rationale: Reproduz diretamente a afirmação de que os ídolos carecem de espírito, sem explicar além do texto.
- source_word: ኢታምልክዎሙ / አምልኩ
  choice: não os adorem / adorem
  rationale: 'O contraste exige o mesmo núcleo verbal: rejeitar o culto aos ídolos e dirigir culto ao Deus do céu.'
theological_decisions:
- issue: Natureza da inexistência ou impotência dos ídolos
  choice: eles são vaidade, e não há neles espírito algum
  alternative: eles não são nada e não têm vida
  rationale: A formulação escolhida preserva tanto a metáfora do vazio quanto a referência explícita ao espírito, sem resolver a linguagem em uma declaração ontológica mais forte.
- issue: Objeto da confiança nos ídolos
  choice: confiam em nada
  alternative: confiam em algo inútil
  rationale: Mantém a afirmação enfática do texto de que essa confiança não encontra objeto real ou eficaz, sem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com imperativos na terceira pessoa do plural para ampla legibilidade brasileira. O início e o fim permanecem sintaticamente incompletos porque o trecho fornecido é um fragmento de um contexto maior.
