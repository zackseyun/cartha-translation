    issue: «impureza deles» está no singular.
    rationale: O termo fonte tem sentido coletivo ou pluralizante neste contexto, e a coordenação com «ídolos» é mais bem refletida por «suas impurezas».
  - severity: low
    issue: «são obra de mãos» é pouco idiomático em português contemporâneo.
    rationale: «São obra de mãos humanas» preserva a afirmação de que são manufaturados e torna a frase natural.
  - severity: low
    issue: «adorem» para o verbo de servir/cultuar pode enfraquecer a distinção verbal com a prostração subsequente.
    rationale: «Cultuem» preserva melhor o campo de serviço religioso, enquanto «prostrem-se» representa explicitamente o segundo ato.
