  text: to Isaac his son. And Ishmael and his sons and the sons of Keturah and their children went together and settled from Paran as far as the entrance to Babylon, in all the land that faces eastward.
translation:
  language: pt
  text: a Isaque, seu filho. E Ismael, seus filhos, os filhos de Quetura e os filhos deles foram juntos e se estabeleceram desde Parã até a entrada para Babilônia, por toda a terra voltada para o leste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅቡረ፡ (ḫabura)
  choice: juntos
  rationale: Expressa de modo direto o sentido adverbial de ação em conjunto.
- source_word: ወኀደሩ፡ (wa-ḫadaru)
  choice: e se estabeleceram
  rationale: Neste contexto territorial, o verbo indica fixar residência ou habitar, não apenas passar a noite.
- source_word: እምፋርሞን፡ እስከ፡ ምብዋአ፡ ባቢሎን፡
  choice: desde Parã até a entrada de Babilônia
  rationale: Preserva os limites geográficos indicados pela construção ‘desde… até’ e traduz literalmente a ideia de entrada ou acesso a Babilônia.
- source_word: ምድር፡ እንተ፡ ገጸ፡ ጽባሕ፡ አንጻረ፡
  choice: terra voltada para o leste
  rationale: A expressão etíope descreve a terra cuja face está na direção do nascer do sol; ‘leste’ comunica isso naturalmente em português.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e nomes próprios em formas correntes. O início fragmentário foi mantido porque o versículo continua a frase anterior. A repetição de ‘filhos’ preserva as relações genealógicas explícitas do texto-fonte.
