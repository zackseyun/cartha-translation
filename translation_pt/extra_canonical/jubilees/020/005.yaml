  text: evening[a], and bow down to him, and continually seek his face at all times, and do uprightness and righteousness before him, so that he may direct you and give you mercy, and send down for you the rain of morning and evening, and bless all the work that you do on the earth, and bless your grain
translation:
  language: pt
  text: o Altíssimo; prostrem-se diante dele e busquem seu rosto continuamente, em todo tempo; pratiquem a retidão e a justiça diante dele, para que ele os guie, lhes conceda misericórdia, faça descer sobre vocês a chuva da manhã e da tarde[a], abençoe todo o trabalho que vocês realizam sobre a terra e abençoe o cereal de vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «chuva da manhã e da tarde» pode referir-se às chuvas oportunas do ciclo agrícola, comparáveis às chamadas chuvas temporã e serôdia.
    reason: lexical_alternative
lexical_decisions:
- source_word: ልዑለ
  choice: o Altíssimo
  rationale: Mantém o título divino no início do fragmento, que parece continuar sintaticamente o versículo anterior.
- source_word: ትስፈዉ፡ ገጸ፡ ዚአሁ
  choice: ponham em sua presença a esperança
  rationale: Preserva o sentido de esperar ou depositar esperança e representa o idiomatismo de «face» como presença, sem substituí-lo pelo verbo «buscar».
- source_word: ያርትዕ፡ ርእስክሙ
  choice: ele os conduza corretamente
  rationale: ርእስክሙ, literalmente «suas cabeças», funciona de modo reflexivo («vocês mesmos»); portanto, não significa «seu caminho». O verbo cognato de retidão permite a ideia de conduzir ou endireitar.
- source_word: ዝናመ፡ ነግሀ፡ ወሰርከ
  choice: a chuva da manhã e da tarde
  rationale: Tradução direta da expressão temporal agrícola, cuja possível equivalência funcional é explicada em nota.
- source_word: እክልከ
  choice: o cereal de vocês
  rationale: Representa o substantivo agrícola coletivo como cereal, evitando restringi-lo a uma espécie específica.
theological_decisions:
- issue: Sentido de «face» na exortação
  choice: ponham em sua presença a esperança
  alternative: busquem sua face
  rationale: O verbo ge'ez favorece esperar ou ter esperança, enquanto «face» pode designar presença; a tradução evita importar a ação distinta de buscar.
- issue: A ação divina expressa por ያርትዕ
  choice: ele os conduza corretamente
  alternative: ele os torne retos
  rationale: A forma admite a noção de endireitar ou dirigir. A escolha conserva a ambiguidade entre orientação e correção moral sem introduzir um «caminho» inexistente no texto.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis no Brasil e internacionalmente. O início fragmentário foi mantido porque «o Altíssimo» parece completar a construção do versículo anterior; o ponto e vírgula sinaliza essa continuidade sem reconstruir palavras ausentes.
