  naturalness: «Prostrem-se diante dele» e «busquem seu rosto continuamente» são naturais em registro bíblico moderno. A repetição de «diante dele»/«seu rosto» é própria da formulação solene e não requer harmonização. «Cereal» é claro e adequadamente coletivo.
  terminology: «Altíssimo», «retidão», «justiça», «misericórdia» e «cereal» são escolhas adequadas. A nota deve permanecer ancorada em «chuva da manhã e da tarde», pois explica precisamente essa expressão agrícola.
