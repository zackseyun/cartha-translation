  terminology: «Vigilantes», «aliança», «circuncidar» e «SENHOR» são adequados. «Prostituição» é mantida no sentido sexual amplo e textual, não como uma alegação de comércio sexual; a nota sobre os Vigilantes permanece descritiva e não impõe uma identificação doutrinária.
