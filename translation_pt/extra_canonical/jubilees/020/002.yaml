base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/002.yaml
  text: And that they should circumcise their sons according to the covenant that was established with them[a], and that they should not turn aside from this, neither to the right nor to the left, from any path that the LORD commanded; and that we should keep ourselves from all fornication and uncleanness, and that we should put away from among us every act of fornication and uncleanness. And if a woman among you commits harlotry, or even a daughter, burn her with fire, and let them not commit fornication after their eyes and after their heart, and let them not take wives for themselves from the daughters of Canaan, for the seed of Canaan will be uprooted from the land. And he told them of the judgment of the Watchers[a],
translation:
  language: pt
  text: E ordenou que circuncidassem seus filhos segundo a aliança estabelecida com eles[a]; que não se desviassem dela nem para a direita nem para a esquerda, nem de qualquer caminho que o SENHOR havia ordenado; que nos guardássemos de toda prostituição e impureza e eliminássemos do nosso meio toda prostituição e impureza. Se uma mulher entre vocês se entregar à prostituição, ou mesmo uma filha, queimem-na no fogo[b]. Que não se entreguem à prostituição seguindo os próprios olhos e o próprio coração, e que não tomem para si mulheres dentre as filhas de Canaã, pois a descendência de Canaã será arrancada da terra. E ele lhes contou sobre o julgamento dos Vigilantes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão foi vertida como “circuncidassem seus filhos segundo a aliança” à luz da aliança abraâmica; a redação desta testemunha ge'ez é comprimida e não explicita o ato com plena clareza.
    reason: lexical_alternative
  - marker: b
    text: A ordem tem tom jurídico severo, e o texto ge'ez diz explicitamente que a mulher ou filha seja queimada no fogo.
    reason: cultural_note
  - marker: c
    text: Os “Vigilantes” são os seres celestiais rebeldes cuja punição é narrada na tradição enoquita.
    reason: cross_reference
lexical_decisions:
- source_word: ይክስቡ፡ ውሉዶሙ፡ በኪዳን
  choice: circuncidassem seus filhos segundo a aliança
  rationale: A redação ge'ez desta testemunha é comprimida e, tomada isoladamente, não explicita com clareza o ato. O contexto da aliança abraâmica e a tradição textual sustentam a referência à circuncisão, mantida com nota para não ocultar a dificuldade.
- source_word: ዝሙት፡ ወርኵስ
  choice: imoralidade sexual e impureza
  rationale: Preserva os dois conceitos coordenados sem recorrer ao hoje menos corrente «fornicação»; «imoralidade sexual» comunica o campo semântico sexual de ዝሙት, enquanto «impureza» representa ርኵስ.
- source_word: ዘመወት / ይዘምዋ
  choice: se prostituir / se prostituam
  rationale: Mantém a natureza explicitamente sexual e a repetição da mesma raiz ge'ez, variando apenas conforme a construção portuguesa.
- source_word: ይሤረዉ፡ ዘርአ
  choice: a descendência ... será arrancada
  rationale: O verbo expressa extirpação ou desenraizamento. «Arrancada» conserva a imagem agrícola associada a «descendência/semente» e é mais específica que «destruída».
- source_word: ረዓይት
  choice: Vigilantes
  rationale: Designação tradicional dos seres celestiais rebeldes na literatura enoquita; a inicial maiúscula indica que se trata de um grupo específico.
theological_decisions:
- issue: Referência implícita à circuncisão na fórmula da aliança
  choice: Explicitar «circuncidassem», com nota textual
  alternative: Traduzir literalmente a redação comprimida como «recebessem/adquirissem seus filhos na aliança»
  rationale: A alternativa literal produziria em português uma frase opaca e provavelmente não comunicaria a referência contextual à aliança abraâmica. A nota registra honestamente a compressão do testemunho.
- issue: Mudança de pessoa gramatical
  choice: Preservar a passagem de «seus/eles» para «nos/nosso» e depois «vocês»
  alternative: Uniformizar todo o versículo em uma única pessoa
  rationale: As mudanças estão presentes no testemunho e podem refletir discurso citado ou transição retórica; uniformizá-las resolveria silenciosamente uma tensão textual genuína.
- issue: Sentença de queima no fogo
  choice: Traduzir diretamente «queimem-na no fogo»
  alternative: Abrandar como punição genérica ou destruição
  rationale: O ge'ez é explícito e jurídico; uma formulação mitigada alteraria a severidade do texto.
- issue: Referência aos Vigilantes
  choice: Manter «julgamento dos Vigilantes» sem identificar mais detalhadamente no corpo
  alternative: Interpretar no texto como «anjos caídos»
  rationale: «Vigilantes» preserva a terminologia própria e evita impor no corpo uma identificação teológica mais estreita; a nota fornece o contexto literário.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega «SENHOR» para o nome divino conforme a convenção editorial, «imoralidade sexual» em vez do arcaizante «fornicação» e preserva as mudanças de pessoa do testemunho. Os marcadores foram normalizados como [a], [b] e [c], cada qual em seu ponto de ancoragem.
