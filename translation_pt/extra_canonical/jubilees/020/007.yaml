translation:
  language: pt
  text: seus rebanhos. E vocês serão uma bênção na terra, e todos os povos da terra desejarão vocês,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: amarão vocês.'
    reason: O verbo ge'ez admite tanto o sentido de desejar quanto o de amar.
lexical_decisions:
- source_word: አባግዒከ
  choice: seus rebanhos
  rationale: O substantivo designa ovelhas ou, coletivamente, rebanhos; o contexto e a camada de consulta favorecem o sentido coletivo.
- source_word: በበረከት
  choice: uma bênção
  rationale: A construção indica que os destinatários serão bênção; a formulação nominal é natural em português e conserva a imagem do texto.
- source_word: አሕዛበ፡ ምድር
  choice: povos da terra
  rationale: አሕዛብ pode significar povos ou nações. “Povos” é claro, abrangente e evita sugerir exclusivamente Estados nacionais modernos.
- source_word: ይፈትዉክሙ
  choice: desejarão vocês
  rationale: O verbo pode expressar amar, querer ou desejar. “Desejarão” preserva a nuance adotada pela edição consultada e a tensão semântica do original; “vocês” deixa explícito que o objeto é plural.
theological_decisions:
- issue: Função dos destinatários como bênção
  choice: vocês serão uma bênção
  alternative: vocês serão abençoados
  rationale: O texto apresenta os próprios destinatários como bênção sobre a terra, não apenas como pessoas que recebem uma bênção.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para representar de modo inequívoco o plural do ge'ez. A colocação “desejarão vocês” é marcada, mas mantém a leitura literal sem introduzir um complemento interpretativo.
