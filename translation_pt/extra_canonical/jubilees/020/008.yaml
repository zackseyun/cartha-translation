  yaml_path: translation/extra_canonical/jubilees/020/008.yaml
  text: and they will bless your children in my name, so that they may be blessed as I am. And he gave gifts to Ishmael and to his sons and to the sons of Keturah, and he sent them away from Isaac his son; but he gave everything to him
translation:
  language: pt
  text: e eles abençoarão os filhos de vocês em meu nome, para que sejam abençoados como eu sou. E ele deu presentes a Ismael, aos filhos dele e aos filhos de Quetura, e os mandou para longe de Isaque, seu filho; mas[a] deu tudo a ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e deu tudo a ele”.'
    reason: A conjunção do texto-fonte pode ser entendida como aditiva (“e”) ou, pelo contraste do contexto, como adversativa (“mas”).
lexical_decisions:
- source_word: ውሉድክሙ
  choice: os filhos de vocês
  rationale: Explicita em português moderno que o sufixo possessivo está no plural, evitando que “seus filhos” seja entendido como referente a uma só pessoa.
- source_word: በስምየ
  choice: em meu nome
  rationale: Preserva diretamente a expressão instrumental ou representativa do texto-fonte, sem ampliar sua interpretação.
- source_word: ሀብተ
  choice: presentes
  rationale: No contexto da distribuição feita por Abraão, “presentes” expressa naturalmente bens concedidos, em contraste com aquilo que ele entrega integralmente a Isaque.
- source_word: ወፈነዎሙ
  choice: e os mandou para longe
  rationale: Comunica tanto o ato de enviá-los quanto a separação em relação a Isaque indicada pela construção seguinte.
- source_word: ወኵሎ፡ ወሀቦ
  choice: mas deu tudo a ele
  rationale: Mantém “tudo” e o objeto pronominal masculino singular incorporado ao verbo, ao mesmo tempo que usa a relação adversativa sugerida pelo contraste contextual.
theological_decisions:
- issue: A bênção pronunciada “em meu nome”
  choice: Manter literalmente “em meu nome”
  alternative: Explicitar como “invocando meu nome” ou “por minha autoridade”
  rationale: O texto permite mais de uma nuance e não deve ser restringido a uma interpretação ritual ou autoritativa específica.
- issue: Relação entre os presentes dados aos outros descendentes e a entrega de tudo a Isaque
  choice: Usar “mas” no texto e registrar a alternativa aditiva em nota
  alternative: Usar apenas “e”
  rationale: O contexto estabelece contraste, mas a conjunção etíope também pode ser traduzida de modo simplesmente aditivo; a nota preserva essa abertura.
translation_notes:
  register: Português contemporâneo, digno e acessível, com legibilidade brasileira. A forma “os filhos de vocês” torna inequívoco o destinatário plural. O pronome final “a ele” foi mantido, embora seu referente só fique plenamente claro no contexto imediato, preservando a construção do texto-fonte e o encerramento abrupto do versículo.
