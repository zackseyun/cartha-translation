lexical_decisions:
- source_word: ወማኅፀነ
  choice: e ventre
  rationale: O substantivo sem sufixo possessivo pertence sintaticamente à oração anterior; a tradução mantém o fragmento inicial porque o trecho fornecido começa no meio da frase.
- source_word: ወይባርክ
  choice: e que ele abençoe
  rationale: Preserva o valor verbal jussivo ou desiderativo, com sujeito masculino singular, sem transformar 'ventre' em objeto do verbo.
- source_word: ዘርአ፡ ከርሥከ
  choice: a descendência do seu corpo
  rationale: Traduz literalmente a imagem corporal, em português natural e sem restringir 'semente' a um sentido exclusivamente biológico.
- source_word: ዘርአ፡ ምድርከ
  choice: a produção da sua terra
  rationale: Neste paralelismo de bênçãos agrícolas, 'produção' comunica naturalmente a semente ou fruto proveniente da terra.
- source_word: መራዕየ፡ አልህምቲከ
  choice: as manadas do seu gado
  rationale: መራዕየ designa coletivos de animais de pasto; 'manadas' se ajusta ao gado.
- source_word: ወመራዕየ
  choice: e os rebanhos de
  rationale: Mantém o segundo coletivo pastoril e a incompletude do excerto, empregando 'rebanhos' para a classe animal que só aparece na continuação.
theological_decisions:
- issue: Relação de 'ventre' com a bênção subsequente
  choice: '''e ventre'' encerra a oração precedente; a bênção começa com ''a descendência do seu corpo'''
  alternative: '''e que ele abençoe o seu ventre, a descendência do seu corpo'''
  rationale: A forma ወማኅፀነ não traz o possessivo de segunda pessoa esperado para 'seu ventre', enquanto ወይባርክ introduz a nova oração e ዘርአ፡ ከርሥከ fornece seu objeto.
