  to: o deserto. E estes se misturaram com aqueles, e o nome deles foi combinado em árabes e ismaelitas.
  rationale: Substitui-se apenas a ligação pouco natural «unido como» por «combinado em». A revisão retém o singular «o nome deles», a ideia de mistura e a leitura de combinação atestada no texto geês; não adota a emenda «foi chamado».
