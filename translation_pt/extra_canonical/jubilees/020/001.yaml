  to: No quadragésimo segundo jubileu, no primeiro ano da sétima semana, Abraão chamou Ismael e seus doze filhos, Isaque e seus dois filhos, e os seis filhos de Quetura com seus descendentes. Ordenou-lhes que guardassem o caminho do SENHOR, praticassem a justiça, que cada um amasse seu irmão e se comportasse assim com todas as pessoas, e que caminhassem juntos, praticando o direito e a justiça na terra.[a]
