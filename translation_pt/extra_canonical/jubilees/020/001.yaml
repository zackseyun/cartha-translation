base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/001.yaml
  text: And in the forty-second jubilee[a], in the first year of the seventh week, Abraham called Ishmael and his twelve sons, and Isaac and his two sons, and the six sons of Keturah and their children. And he commanded them to keep the way of the LORD, to do righteousness, and that each should love his brother, and that he should thus be among all people, walking together to practice justice and righteousness on the earth.
translation:
  language: pt
  text: No quadragésimo segundo jubileu, no primeiro ano da sétima semana, Abraão chamou Ismael e seus doze filhos, Isaque e seus dois filhos, e os seis filhos de Quetura com seus descendentes. Ordenou-lhes que guardassem o caminho do SENHOR, praticassem a justiça, que cada um amasse seu irmão e se comportasse assim com todas as pessoas, e que caminhassem juntos, praticando o direito e a justiça na terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A última parte da frase tem sintaxe densa em ge'ez. O sentido parece ser que Abraão os exortou ao amor mútuo e a uma vida, em relação a todas as pessoas, marcada pela prática do direito e da justiça.
    reason: segmentation_note
lexical_decisions:
- source_word: ፍኖተ፡ እግዚአብሔር
  choice: o caminho do SENHOR
  rationale: Preserva a metáfora bíblica de conduta expressa por “caminho” e verte o título divino segundo a convenção portuguesa consagrada.
- source_word: ወያፈቅር፡ አሐዱ፡ አሐዱ፡ ቢጾ
  choice: cada um amasse seu irmão
  rationale: Mantém a construção distributiva singular e traduz ቢጽ no sentido relacional de irmão/companheiro; “irmão” é natural no contexto da família reunida.
- source_word: ይሖሩ
  choice: caminhassem
  rationale: Conserva o verbo e a metáfora de caminhar como modo de vida, evitando omitir um elemento explícito do ge'ez.
- source_word: ፍትሕ፡ ወጽድቅ
  choice: o direito e a justiça
  rationale: Distingue os dois termos coordenados em vez de fundi-los, preservando a ênfase dupla do texto.
- source_word: ወውሉዶሙ
  choice: com seus descendentes
  rationale: Expressa de forma inclusiva e natural a descendência dos seis filhos de Quetura, sem restringi-la necessariamente a filhos imediatos.
theological_decisions:
- issue: Número gramatical na exortação sobre a conduta entre os povos
  choice: “cada um ... fosse assim entre todos os povos”, no singular
  alternative: “eles fossem assim entre todos os povos”
  rationale: O ge'ez emprega ይኩን na terceira pessoa do singular, retomando distributivamente “cada um”; a tradução preserva essa mudança de número.
- issue: Relação entre justiça, amor fraternal e testemunho público
  choice: Manter as exortações coordenadas sem explicitar uma relação causal
  alternative: Interpretar que o amor fraternal produz ou define a justiça pública
  rationale: A sintaxe é densa e não determina com segurança uma relação causal; a tradução conserva a tensão e a sequência do original.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os idiomas bíblicos “caminho do SENHOR” e “caminhar”, enquanto a pontuação esclarece a longa sequência sem eliminar sua ambiguidade genuína.
