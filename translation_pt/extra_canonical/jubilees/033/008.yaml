  source_fidelity: 'A tradução preserva corretamente os elementos centrais: a ira intensa de Jacó, a relação sexual eufemística de Rúben com Bila e a imagem de ''descobrir a veste'' do pai. Contudo, ''e, assim,'' transforma a segunda oração causal do ge''ez em consequência explícita e atenua a repetição explicativa do original. Também é preferível eliminar o pronome potencialmente ambíguo e atribuir as ações diretamente a Rúben.'
  naturalness: O português é claro e de registro apropriado. A repetição de 'porque' é aceitável aqui por refletir a estrutura enfática/explicativa da fonte; a repetição do nome 'Rúben' evita qualquer oscilação momentânea de referente.
  terminology: '''Veste'' é uma boa equivalência para ክዳን e conserva a imagem de roupa/cobertura, em vez de substituir o termo por ''cama''. A nota deve explicar o valor idiomático sem acrescentar a formulação mais específica ''direitos conjugais'', que não é enunciada pelo texto.'
