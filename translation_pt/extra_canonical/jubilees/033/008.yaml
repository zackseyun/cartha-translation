  text: And Jacob was very angry with Reuben because he had lain with Bilhah, because he had uncovered his father’s skirt.
translation:
  language: pt
  text: E Jacó ficou muito irado com Rúben, porque Rúben tinha se deitado com Bila, porque tinha descoberto a veste de seu pai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a veste” ou “a cobertura de seu pai”. A expressão é uma forma figurada de referir-se à transgressão sexual já mencionada.
    reason: Esclarece o sentido idiomático e mantém o sentido lexical de ክዳን como veste/cobertura, sem substituir a imagem do texto por “cama” nem introduzir uma interpretação mais detalhada.
lexical_decisions:
- source_word: ተምዐ ፡ ጥቀ
  choice: ficou muito irado
  rationale: Reproduz a intensidade do verbo e do modificador, em linguagem natural e digna.
- source_word: ሰከበ ፡ ምስለ
  choice: havia se deitado com
  rationale: Mantém o eufemismo sexual tradicional do texto-fonte sem explicitá-lo além do necessário.
- source_word: ክዳነ ፡ አቡሁ
  choice: a veste de seu pai
  rationale: ክዳን designa veste ou cobertura; 'veste' preserva a imagem corporal e a alusão jurídica bíblica, ao contrário de 'cama'.
- source_word: ከሠተ
  choice: descoberto
  rationale: Conserva literalmente o ato de retirar a cobertura e o caráter idiomático da expressão.
theological_decisions:
- issue: Sentido da expressão 'descobrir a veste do pai'
  choice: Preservar a expressão figurada no texto
  alternative: Interpretá-la como 'desonrar o leito do pai' ou 'ter relações com a mulher do pai'
  rationale: A formulação da fonte ecoa a linguagem bíblica de transgressão sexual e parentesco; explicá-la diretamente resolveria uma tensão que o original mantém figurada.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A coordenação 'e, assim,' torna explícita a relação explicativa entre as duas orações causais repetidas na fonte sem apagar a imagem idiomática.
