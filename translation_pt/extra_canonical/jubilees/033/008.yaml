  - severity: low
    issue: A nota contém uma explicação excessivamente especificada.
    rationale: '''Violou a honra e os direitos conjugais de seu pai'' interpreta adequadamente o episódio, mas ''direitos conjugais'' é uma elaboração ausente da formulação figurada. Uma nota mais contida preserva o idiomatismo.'
