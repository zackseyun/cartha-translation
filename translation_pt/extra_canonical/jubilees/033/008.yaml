  rationale: A revisão mantém a tradução lexicalmente fiel de ክዳን como 'veste', restaura as duas relações causais presentes na fonte e torna Rúben o sujeito explícito das ações. A nota foi reduzida a uma explicação idiomática verificável e não confessional.
