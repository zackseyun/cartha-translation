  language: pt
  text: 'e não contou a ninguém. Quando Jacó chegou e a procurou, ela lhe disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢለመኑሂ ፡ ሰብአ
  choice: e não contou a ninguém
  rationale: A expressão negativa significa que ela não contou a nenhuma pessoa; em português, «não contou a ninguém» é a formulação natural e fiel.
- source_word: ወመጽአ ፡ ያዕቆብ
  choice: Quando Jacó chegou
  rationale: Reproduz com naturalidade a oração temporal introduzida pela chegada de Jacó.
- source_word: ወኀሠሣ
  choice: e a procurou
  rationale: 'A forma verbal tem sujeito masculino singular e sufixo de objeto feminino singular: Jacó é quem procura, e a mulher é procurada.'
- source_word: ትቤሎ
  choice: ela lhe disse
  rationale: Mantém o sujeito feminino e o destinatário masculino indicados pela forma ge'ez, preparando a fala que vem a seguir.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com fluidez narrativa. O termo inicial ፈድፋደ («muitíssimo», «intensamente») foi tratado como conclusão da oração do versículo anterior, conforme o corte contextual; inseri-lo aqui produziria um fragmento sem termo modificado. Não se manteve a antiga alternativa «ela o procurou», pois a morfologia indica sujeito masculino e objeto feminino.
