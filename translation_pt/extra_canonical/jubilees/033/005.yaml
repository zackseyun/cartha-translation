  source_fidelity: 'O texto traduz adequadamente a sequência verbal e as relações principais do ge''ez: a vergonha diante dele, a retirada da mão, a fuga dele e o lamento subsequente. Contudo, «por causa disso» tende a apresentar o fato como causa do lamento, enquanto በእንተዝ ነገር corresponde mais precisamente a lamento «por/sobre este assunto/esta questão».'
