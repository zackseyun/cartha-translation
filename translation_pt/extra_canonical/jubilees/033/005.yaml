translation:
  language: pt
  text: Ela ficou envergonhada diante dele, tirou a mão de sobre ele, e ele fugiu. E ela se lamentou por este assunto,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተኀፍረት
  choice: ficou envergonhada
  rationale: Expressa de modo natural o estado de vergonha indicado pelo verbo, sem acrescentar intensidade.
- source_word: እምኔሁ
  choice: diante dele
  rationale: Preserva o sentido relacional da preposição conforme a evidência contextual, evitando interpretá-la causalmente como «por causa dele».
- source_word: ኀደገት ፡ እዴሃ ፡ እምላዕሌሁ
  choice: tirou de cima dele a sua mão
  rationale: Reproduz claramente o gesto físico e a relação espacial do texto ge'ez em português corrente.
- source_word: ጐየ
  choice: fugiu
  rationale: Equivalente direto e natural do verbo de fuga.
- source_word: ትላሑ
  choice: se lamentou
  rationale: Mantém a expressão de pesar sem introduzir a intensidade «muito», ausente do texto apresentado.
- source_word: በእንተዝ ፡ ነገር
  choice: por causa disso
  rationale: Traduz idiomaticamente «a respeito/por causa desta questão», sem o peso pouco natural de «por causa deste assunto».
