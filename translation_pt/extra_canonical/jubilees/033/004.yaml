translation:
  language: pt
  text: na casa dela. Ele se deitou com ela; então ela acordou, viu-o e eis que Rúben estava deitado com ela na cama. Ela afastou a borda de sua coberta, agarrou-o e gritou; e reconheceu que era Rúben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ ቤታ
  choice: na casa dela
  rationale: Reproduz o fragmento locativo presente no início do texto ge'ez, ainda que ele dê continuidade sintática ao versículo anterior.
- source_word: ወሰከበ ምስሌሃ
  choice: Ele se deitou com ela
  rationale: Mantém a formulação direta do original e sua possível conotação sexual, sem explicá-la além do que o texto diz.
- source_word: ወርእየቶ
  choice: viu-o
  rationale: Inclui o sufixo de objeto masculino singular do verbo ge'ez, isto é, ela viu a ele.
- source_word: ወናሁ
  choice: e percebeu que
  rationale: O marcador apresentativo introduz a descoberta feita ao despertar; em português corrente, a construção comunica naturalmente a surpresa sem o artificialismo de um 'e eis que'.
- source_word: ክንፋ
  choice: a borda de sua coberta
  rationale: Literalmente pode designar 'asa' ou 'extremidade'; neste contexto de cama, refere-se de modo mais provável à ponta ou borda da cobertura.
- source_word: ወአእመረቶ
  choice: assim reconheceu
  rationale: Distingue este verbo de 'viu-o' e expressa a identificação posterior da pessoa como Rúben.
