  text: And Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father's covering—his deed is very evil,
translation:
  language: pt
  text: E Jacó não voltou a se aproximar dela, porque Rúben a havia contaminado. E todo homem que descobre a cobertura de seu pai — seu ato é muito mau,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አቀረበ
  choice: se aproximar
  rationale: Conserva o sentido básico de aproximar-se, deixando que o contexto comunique a possível conotação conjugal ou sexual sem explicitá-la além da fonte.
- source_word: አርኩሳ
  choice: havia contaminado
  rationale: Expressa profanação ou impureza causada por Rúben; o mais-que-perfeito composto situa naturalmente o ato antes da decisão de Jacó.
- source_word: ይከሥት
  choice: descobre
  rationale: Mantém o verbo concreto do idioma sexual e jurídico, sem substituir a imagem por uma interpretação explícita.
- source_word: ክዳነ
  choice: a cobertura
  rationale: Preserva a metáfora da fonte, que pode evocar a intimidade conjugal e a honra paterna.
theological_decisions:
- issue: Grau de explicitação do idioma «descobrir a cobertura do pai»
  choice: Manter literalmente «descobre a cobertura de seu pai»
  alternative: Explicitar como «tem relações com a mulher de seu pai»
  rationale: A formulação literal preserva a imagem e sua tensão interpretativa, evitando resolver silenciosamente o idioma.
- issue: Natureza da contaminação causada por Rúben
  choice: «a havia contaminado»
  alternative: «a havia desonrado» ou «a havia profanado»
  rationale: «Contaminado» conserva a dimensão de impureza presente no verbo sem limitar o sentido apenas à honra social ou à profanação cultual.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com sintaxe próxima da fonte. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto subsequente.
