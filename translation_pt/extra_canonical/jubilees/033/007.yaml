revisions:
- from: “Não estou pura para ti, pois fui contaminada longe de ti; porque Rúben me contaminou e se deitou comigo durante a noite, enquanto eu dormia. Eu não soube de nada até que ele descobriu a aba da minha veste[a] e se deitou comigo.”
  to: “Não sou pura para ti, pois fui maculada à parte de ti; pois Rúben me maculou e se deitou comigo durante a noite, enquanto eu dormia, e eu não soube até que ele descobriu a orla da minha veste[a] e se deitou comigo.”
  rationale: A revisão ajusta a expressão de separação em relação ao interlocutor, melhora a naturalidade do predicado de pureza e mantém em uma única sequência a sintaxe coordenada do texto-fonte. Conserva-se o eufemismo sexual repetido e evita-se tanto uma qualificação jurídica moderna quanto uma explicitação além do que a fonte afirma.
