  yaml_path: translation/extra_canonical/jubilees/033/007.yaml
  text: “I am not pure for you, because I have been defiled apart from you; for Reuben has defiled me and lay with me at night while I was asleep, and I did not know until he uncovered my skirt and lay with me.”
translation:
  language: pt
  text: “Não sou pura para ti, pois fui maculada à parte de ti; pois Rúben me maculou e se deitou comigo durante a noite, enquanto eu dormia, e eu não soube até que ele descobriu a orla da minha veste[a] e se deitou comigo.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lit. “abriu a minha asa”; “asa” pode designar a aba, orla ou extremidade de uma veste.
    reason: Preserva a metáfora concreta da expressão etíope e esclarece a opção idiomática «orla da minha veste».
lexical_decisions:
- source_word: ንጽሕተ
  choice: pura
  rationale: Expressa pureza ritual e sexual com linguagem natural e digna, sem restringir o sentido à limpeza física.
- source_word: ተገመዝኩ
  choice: fui contaminada
  rationale: Mantém a voz passiva e o campo semântico de profanação ou perda de pureza, sem acrescentar uma descrição jurídica ausente da formulação-fonte.
- source_word: እምኔከ
  choice: longe de ti
  rationale: Reproduz a ideia espacial e relacional de ter ocorrido à parte do interlocutor, em sua ausência.
- source_word: አርኩሰኒ
  choice: me contaminou
  rationale: Conserva a repetição do vocabulário de impureza presente no texto e evita suavizar a gravidade do ato.
- source_word: ሰከበ ምስሌየ
  choice: se deitou comigo
  rationale: Preserva o eufemismo sexual tradicional e a repetição da fonte, sem explicitar além do que ela afirma.
- source_word: ከሠተ ክነፍየ
  choice: descobriu a aba da minha veste
  rationale: Traduz a imagem concreta de abrir ou descobrir a 'asa', entendida idiomaticamente como a aba ou extremidade da veste.
theological_decisions:
- issue: Natureza e grau de explicitação da violação sexual
  choice: Manter “me contaminou” e “se deitou comigo”, junto das indicações de que ela dormia e nada soube.
  alternative: Traduzir diretamente por “me violentou” ou “teve relações sexuais comigo”.
  rationale: O contexto descreve ausência de conhecimento e consentimento, mas a fonte emprega linguagem de contaminação e o eufemismo “deitar-se com”. A tradução conserva tanto a gravidade narrativa quanto a forma e a tensão do texto, sem impor uma formulação jurídica moderna.
- issue: Sentido de pureza
  choice: Usar “pura” sem qualificador.
  alternative: Especificar “ritualmente pura” ou “sexualmente pura”.
  rationale: A fonte não limita explicitamente o tipo de pureza; o contexto sexual orienta a leitura, mas a formulação mais ampla preserva a possível dimensão moral, corporal e ritual.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A repetição de “contaminada/me contaminou” e “se deitou comigo” foi mantida por refletir a estrutura enfática da fonte.
