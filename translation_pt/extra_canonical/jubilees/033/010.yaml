revisions:
- from: 'Seu ato é extremamente mau, pois ele é abominável diante do SENHOR. Por isso, está escrito e decretado nas tábuas celestiais que nenhum homem deve se deitar com a mulher de seu pai nem levantar a aba da veste de seu pai[a], pois isso é impuro. Certamente ambos deverão morrer juntos: o homem que se deitar com a mulher de seu pai e também a mulher, porque cometeram um ato impuro na terra. Que não haja impureza diante de nosso Deus no meio do povo que ele escolheu para si como reino.


    E está escrito ainda uma segunda vez: “Maldito seja aquele que se deitar com a mulher de seu pai, pois expôs a vergonha de seu pai”. E que todos os santos do SENHOR digam: “Assim seja! Assim seja!”


    E você, Moisés, ordene aos filhos de Israel que guardem esta palavra, pois ela traz sentença de morte; esse ato é impuro, e jamais haverá expiação que faça expiação pelo homem que o praticar, a não ser matá-lo, apedrejá-lo e arrancá-lo do meio do povo de nosso Deus. Pois nenhum homem que fizer isso em Israel deverá permanecer vivo na terra nem sequer por um dia, porque é abominável e impuro.


    Que eles não digam: “Rúben teve permissão para viver e recebeu perdão depois de se deitar com a concubina de seu pai; e ela também permaneceu viva, embora tivesse marido e embora Jacó, pai de Rúben, ainda estivesse vivo”. Pois, até aquele tempo, a ordenança, o juízo e a lei ainda não tinham sido plenamente revelados a todos. Em seus dias, porém, ela é lei para todos os tempos e dias, lei eterna para todas as gerações eternas. Para esta lei não há fim de dias nem perdão, a não ser que ambos sejam arrancados do meio do povo; no próprio dia em que fizerem isso, deverão matá-los.


    E você, Moisés, escreva isso para Israel, para que guardem esta lei, não ajam dessa maneira e não cometam um pecado que leva à morte, porque o Juiz, o SENHOR nosso Deus, não mostra parcialidade nem aceita suborno. Diga-lhes esta palavra da ordenança, para que ouçam, fiquem alertas, guardem a si mesmos e não sejam destruídos nem arrancados da terra. Pois todos os que fazem isso na terra são impuros, profanados, poluídos e contaminados diante de nosso Deus.


    Não há pecado maior do que a imoralidade sexual que praticam na terra, pois Israel é um povo santo para o SENHOR, seu Deus; é um povo de herança, um povo sacerdotal, um povo real e um povo plantado[b]. Nenhuma impureza como essa deve ser vista no meio do povo santo.


    No terceiro ano daquela semana, Jacó e todos os seus filhos foram morar na casa de Abraão, perto de Isaque, seu pai, e de Rebeca, sua mãe. Estes são os nomes dos filhos de Jacó: o primogênito, Rúben; Simeão; Levi; Judá; Issacar; e Zebulom, filhos de Lia; os filhos de Raquel, José e Benjamim; os filhos de Bila, Dã e Naftali; os filhos de Zilpa, Gade e Aser; e Diná, a única filha de Lia, filha de Jacó.


    Eles foram e se curvaram diante de Isaque e Rebeca. Quando estes os viram, abençoaram Jacó e todos os seus filhos. Isaque alegrou-se muito porque viu os filhos de Jacó, seu filho mais novo, e os abençoou.'
