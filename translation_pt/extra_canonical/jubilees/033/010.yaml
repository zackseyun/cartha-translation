  text: 'His deed is very evil, for he is abominable before the LORD. Because of this it is written and ordained on the heavenly tablets that a man must not lie with his father’s wife and must not uncover his father’s skirt, because it is unclean. They must surely die together—the man who lies with his father’s wife and the woman also—for they have done an unclean deed on the earth. And let there be no uncleanness before our God among the people whom he has chosen for himself as a kingdom. And again it is written a second time: “Cursed be the one who lies with his father’s wife, because he has uncovered his father’s shame.” And let all the holy ones of the LORD say, “So be it, so be it.” And you, Moses, command the children of Israel that they keep this word, for it is a sentence of death, and it is unclean, and there is no atonement forever to atone for the man who has done this, except to put him to death and kill him and stone him and uproot him from the midst of the people of our God.
    For there shall not remain alive for a single day on the earth any man who does this in Israel, for he is abominable and unclean. And let them not say, “Reuben was allowed to live and forgiveness was granted after he lay with his father’s concubine, and she too, though she had a husband, and though Jacob his father was still alive.” For until that time the ordinance and the judgment and the law had not been fully revealed for all; but in your days it is as the law of the times and of the days, and as an everlasting law for the everlasting generations. And for this law there is no completion of days, and no forgiveness for it, except that both of them be uprooted from the midst of the people; on the day on which they did it they shall kill them. And you, Moses, write it down for Israel, that they may keep it and not do according to this matter and not sin with a sin unto death, because the Judge, the LORD our God, is one who does not show partiality and does not accept bribes. And tell
    them this word of the ordinance, that they may hear and be on guard and watch themselves and not be destroyed and rooted out from the land. For all who do it on the earth are unclean and defiled and polluted and contaminated before our God. And there is no greater sin than the sexual impurity that they commit on the earth, for Israel is a holy people to the LORD its God, and a people of inheritance, and a priestly people, and a kingdom people, and a planted people; and no such uncleanness is to be seen in the midst of the holy people. And in the third year of this week Jacob and all his sons went and dwelt in the house of Abraham, near Isaac his father and Rebekah his mother. And these are the names of the sons of Jacob: the firstborn, Reuben; and Simeon; and Levi; and Judah; and Issachar; and Zebulun, the sons of Leah; and the sons of Rachel, Joseph and Benjamin; and the sons of Bilhah, Dan and Naphtali; and the sons of Zilpah, Gad and Asher; and Dinah, the only daughter of Leah, the
    daughter of Jacob. And they went and bowed down to Isaac and Rebekah, and when they saw them they blessed Jacob and all his sons. And Isaac rejoiced greatly because he saw the sons of Jacob his younger son, and he blessed them.'
translation:
  language: pt
  text: 'Seu ato é extremamente mau, pois ele é abominável diante do SENHOR. Por isso, está escrito e decretado nas tábuas celestiais que nenhum homem deve se deitar com a mulher de seu pai nem descobrir a cobertura de seu pai[a], pois isso é impuro. Certamente ambos deverão morrer juntos: o homem que se deitar com a mulher de seu pai e também a mulher, porque cometeram um ato impuro na terra. Que não haja impureza diante de nosso Deus no meio do povo que ele escolheu para si como reino.


    E está escrito ainda uma segunda vez: “Maldito seja aquele que se deitar com a mulher de seu pai, pois expôs a vergonha de seu pai”. E que todos os santos do SENHOR digam: “Assim seja! Assim seja!”


    Moisés, ordene aos filhos de Israel que guardem esta palavra, pois ela traz sentença de morte; esse ato é impuro, e jamais haverá expiação que faça expiação pelo homem que o praticar, a não ser condená-lo à morte, matá-lo, apedrejá-lo e arrancá-lo do meio do povo de nosso Deus. Pois nenhum homem que fizer isso em Israel deverá permanecer vivo na terra nem sequer por um dia, porque é abominável e impuro.


    Que eles não digam: “Rúben teve permissão para viver e recebeu perdão depois de se deitar com a concubina de seu pai; e ela também permaneceu viva, embora tivesse marido e embora Jacó, pai de Rúben, ainda estivesse vivo”. Pois, até aquele tempo, a ordenança, o juízo e a lei ainda não tinham sido plenamente revelados a todos. Em seus dias, porém, ela é lei para todos os tempos e dias, lei eterna para todas as gerações eternas. Esta lei não tem prazo final nem perdão, a não ser que ambos sejam arrancados do meio do povo; no próprio dia em que fizerem isso, deverão matá-los.


    Moisés, escreva isso para Israel, para que guardem esta palavra, não ajam dessa maneira e não cometam um pecado que leva à morte, porque o Juiz, o SENHOR nosso Deus, não mostra parcialidade nem aceita suborno. Diga-lhes esta palavra da ordenança, para que ouçam, fiquem alertas, guardem a si mesmos e não sejam destruídos nem arrancados da terra. Pois todos os que fazem isso na terra são impuros, profanados, poluídos e contaminados diante de nosso Deus.


    Não há pecado maior do que a imoralidade sexual que praticam na terra, pois Israel é um povo santo para o SENHOR, seu Deus; é um povo de herança, um povo sacerdotal, um povo real e um povo plantado[b]. Nenhuma impureza como essa deve ser vista no meio do povo santo.


    No terceiro ano daquela semana, Jacó e todos os seus filhos foram morar na casa de Abraão, perto de Isaque, seu pai, e de Rebeca, sua mãe. Estes são os nomes dos filhos de Jacó: o primogênito, Rúben; Simeão; Levi; Judá; Issacar; e Zebulom, filhos de Lia; os filhos de Raquel, José e Benjamim; os filhos de Bila, Dã e Naftali; os filhos de Zilpa, Gade e Aser; e Diná, a única filha de Lia, filha de Jacó.


    Eles foram e se curvaram diante de Isaque e Rebeca. Quando estes os viram, abençoaram Jacó e todos os seus filhos. Isaque alegrou-se muito porque viu os filhos de Jacó, seu filho mais novo, e os abençoou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a veste de seu pai”. A expressão alude à mulher do pai, mas emprega aqui a imagem da cobertura; na frase seguinte, o texto usa literalmente “a vergonha de seu pai”.'
    reason: Preserva a distinção lexical entre a imagem de cobertura/veste e «vergonha», sem tornar a primeira expressão excessivamente específica.
  - marker: b
    text: Isto é, um povo estabelecido por Deus como quem planta algo.
    reason: Esclarece a metáfora incomum sem substituí-la por uma interpretação no texto principal.
lexical_decisions:
- source_word: እኩይ ፡ ነገሩ ፡ ጥቀ
  choice: Seu ato é extremamente mau
  rationale: Preserva a frase inicial e sua intensificação, ausente em uma versão anterior.
- source_word: ምኑን
  choice: abominável
  rationale: Expressa a forte avaliação cultual e moral do texto sem atenuá-la.
- source_word: ኪዳነተ ፡ አቡሁ
  choice: a aba da veste de seu pai
  rationale: Mantém a imagem concreta de veste ou cobertura e a distingue de ኀፍረተ, 'vergonha', usado em seguida.
- source_word: ኀፍረተ ፡ አቡሁ
  choice: a vergonha de seu pai
  rationale: Conserva a mudança lexical deliberada do texto-fonte em relação à expressão anterior.
- source_word: ርኩስ
  choice: impuro
  rationale: Mantém a linguagem de impureza cultual e moral recorrente na passagem.
- source_word: ዝሙና
  choice: imoralidade sexual
  rationale: Termo amplo e inteligível que comunica o campo semântico sexual sem restringi-lo indevidamente a uma única categoria moderna.
- source_word: ጥዕት
  choice: povo plantado
  rationale: Retém a metáfora incomum do original em vez de substituí-la por uma interpretação.
- source_word: ኢይነሥእ ፡ ገጸ ፡ ወኢይነሥእ ፡ ሕልያነ
  choice: não mostra parcialidade nem aceita suborno
  rationale: Emprega registro judicial natural em português e preserva os dois aspectos da imparcialidade do Juiz.
theological_decisions:
- issue: Força absoluta da sanção e ausência de expiação
  choice: Preservar a formulação rigorosa e repetitiva do texto
  alternative: Suavizar a passagem ou harmonizá-la com formulações teológicas posteriores sobre perdão
  rationale: A tradução deve conservar a tensão própria de Jubileus, sem impor uma solução confessional externa.
- issue: Identidade dos 'santos do SENHOR'
  choice: santos do SENHOR
  alternative: anjos do SENHOR ou povo santo do SENHOR
  rationale: O referente não é explicitado nesta frase; a tradução mantém a ambiguidade do termo.
- issue: Linguagem de Israel como povo sacerdotal, real e plantado
  choice: Traduzir cada título separadamente e de modo literal
  alternative: Fundir os títulos em uma paráfrase teológica
  rationale: A enumeração é significativa e deve permanecer visível, inclusive sua metáfora menos comum.
translation_notes:
