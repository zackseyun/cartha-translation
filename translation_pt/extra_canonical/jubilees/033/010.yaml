  naturalness: 'O registro é geralmente claro, solene e legível. Foram ajustadas algumas construções: «descobrir a cobertura» preserva a imagem sem introduzir a específica «aba»; «Moisés, ordene/escreva» evita a alternância coloquial de «você» num discurso legislativo elevado; e «não tem prazo final» traduz naturalmente a expressão de duração sem termo.'
  terminology: Mantêm-se «SENHOR», «impuro», «abominável», «expiação», «ordenança», «suborno» e os nomes tradicionais em português. Conserva-se a distinção lexical entre «cobertura» na primeira proibição e «vergonha» na citação seguinte, explicada em nota.
