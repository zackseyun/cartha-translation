    rationale: O termo ge'ez correspondente é associado a «cobertura/veste» e, conforme o registro de auditoria, deve distinguir-se de «vergonha» na frase seguinte. «Aba» estreita indevidamente a imagem e «levantar» soa menos idiomático neste uso.
