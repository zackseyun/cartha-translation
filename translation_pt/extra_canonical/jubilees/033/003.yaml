  text: the maidservant of Rachel, the concubine of his father, bathing in water in a secluded place, and he loved her. And he hid himself, and at night he entered the house of Bilhah and found her sleeping alone in her bed.
translation:
  language: pt
  text: a serva de Raquel, concubina de seu pai, enquanto ela se banhava em água, num lugar escondido; e ele a amou. Então se escondeu e, à noite, entrou na casa de Bila[a] e a encontrou dormindo sozinha em sua cama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto editado traz, entre colchetes, uma segunda ocorrência de “à noite” neste ponto.
    reason: Registra a variante ou possível repetição textual assinalada na edição-fonte sem reproduzir uma duplicação pouco natural no texto principal.
lexical_decisions:
- source_word: ለአኪተ ፡ ራሔል
  choice: a serva de Raquel
  rationale: A expressão ge’ez designa explicitamente a serva de Raquel, isto é, Bila; evita identificar erroneamente Raquel como a mulher vista.
- source_word: ዐቅብተ ፡ አቡሁ
  choice: concubina de seu pai
  rationale: Mantém a aposição do texto-fonte e identifica a serva como concubina do pai dele.
- source_word: በኅቡእ
  choice: num lugar escondido
  rationale: Expressa o sentido locativo de privacidade ou ocultação sem especificar um cenário ausente do texto.
- source_word: ወአፍቀራ
  choice: e ele a amou
  rationale: Preserva o verbo forte e direto do ge’ez, sem reduzi-lo interpretativamente a mero desejo.
- source_word: ውስተ ፡ ዐራታ ፡ ባሕቲታ
  choice: sozinha em sua cama
  rationale: Reproduz a localização e o isolamento indicados no texto; não acrescenta uma segunda referência à casa.
