lexical_decisions:
- source_word: ሖረ
  choice: partiu / foi
  rationale: O verbo expressa deslocamento. Na primeira ocorrência, “partiu” evita uma repetição pouco natural; na segunda, “foi” preserva de modo simples o movimento em direção ao pai.
- source_word: ኀደረ
  choice: acampou
  rationale: No contexto de uma parada durante a viagem, traduz naturalmente a ideia de permanecer ou passar a noite num lugar.
- source_word: መንገለ ደቡብ
  choice: ao sul de
  rationale: Reproduz a indicação espacial de direção ou posição meridional de forma idiomática em português.
- source_word: መግደላደራፋፍ
  choice: Migdal-Éder
  rationale: Adota a forma reconhecível do topônimo bíblico, com acentuação adequada à leitura em português.
- source_word: ኀበ አቡሁ
  choice: até seu pai
  rationale: Expressa o movimento em direção ao pai sem acrescentar identificação ou circunstâncias ausentes no texto.
