base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/005.yaml
  text: And now[a], my son, listen to my voice and do the will of your mother, and do not take for yourself a wife from the daughters of this land; rather, from my father’s house and from my father’s kindred you shall take a wife for yourself. And God Most High will bless you, and your children will be a righteous offspring and a holy seed.
translation:
  language: pt
  text: E agora, meu filho, ouça a minha voz e faça a vontade de sua mãe. Não tome para si uma esposa dentre as filhas desta terra; antes, tome para si uma esposa da casa de meu pai e da parentela de meu pai.[a] E o Deus Altíssimo o abençoará, e seus filhos serão uma descendência justa e uma semente santa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto apresenta uma repetição em torno de “da casa de meu pai”, possivelmente decorrente de ênfase estilística ou da segmentação local do texto extraído.
    reason: segmentation_note
lexical_decisions:
- source_word: ስማዕ፡ ቃለየ
  choice: ouça a minha voz
  rationale: Preserva a expressão semítica do texto-fonte, natural e compreensível em português.
- source_word: ብእሲተ
  choice: uma mulher
  rationale: Mantém o termo concreto do ge'ez no contexto de tomar uma mulher como esposa, sem precisar acrescentar uma explicação interpretativa.
- source_word: ዘመደ፡ አቡየ
  choice: parentela de meu pai
  rationale: ‘Parentela’ comunica o grupo familiar ampliado e distingue essa expressão da ‘casa de meu pai’.
- source_word: ትውልደ፡ ጽድቅ
  choice: uma descendência justa
  rationale: Reproduz a construção qualificativa e conserva a dimensão moral de ‘justiça’.
- source_word: ዘርአ፡ ቅዱሰ
  choice: uma semente santa
  rationale: Mantém a metáfora genealógica e a linguagem sacral do original.
theological_decisions:
- issue: Identidade e forma do título divino
  choice: o Deus Altíssimo
  alternative: Deus, o Altíssimo
  rationale: Expressa diretamente a construção do ge'ez sem introduzir formulação confessional adicional.
- issue: Referência da bênção e da descendência
  choice: o abençoará, e seus filhos serão
  alternative: te abençoará, e tua descendência será
  rationale: Mantém a referência pessoal singular e o plural concreto do original, sem ampliar a promessa além do enunciado.
translation_notes:
  register: Português moderno, digno e acessível, com formas brasileiras amplamente compreensíveis. A pontuação explicita o contraste entre as filhas da terra e a família do pai, sem eliminar a observação textual indicada pela nota.
