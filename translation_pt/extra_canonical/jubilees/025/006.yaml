  text: Then Jacob spoke with Rebekah his mother and said to her[a], “Look, I am now a son of nine weeks of years, and I do not know a woman, nor have I touched one, nor have I become engaged, nor do I intend to take a wife for myself from the daughters of Canaan.”
translation:
  language: pt
  text: 'Então Jacó falou com Rebeca, sua mãe, e lhe disse: “Veja, já tenho a idade de nove semanas de anos[a] e não conheço mulher alguma; não toquei em nenhuma, não me comprometi em casamento com nenhuma e não pretendo tomar para mim uma esposa dentre as filhas de Canaã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Nove semanas de anos” equivalem a sessenta e três anos; o texto principal preserva a forma cronológica própria de Jubileus.
    reason: cultural_note
lexical_decisions:
- source_word: ወልደ፡ ተስዓተ፡ ሱባዔ፡ ዓመት
  choice: tenho nove semanas de anos
  rationale: Preserva a expressão cronológica característica de Jubileus em linguagem portuguesa natural, sem substituir no texto principal pelo total calculado de sessenta e três anos.
- source_word: ኢያአምር፡ አንስቲ
  choice: não conheço mulher alguma
  rationale: Mantém o eufemismo semítico de ‘conhecer’ no sentido de relação sexual, inteligível no registro bíblico português.
- source_word: ወአገስስኩ
  choice: não toquei em nenhuma
  rationale: Traduz diretamente o verbo de contato físico e conserva a progressão das negações.
- source_word: ወአፈፃርኩ
  choice: não fiquei noivo de nenhuma
  rationale: Expressa o compromisso matrimonial indicado pelo verbo e evita omitir este elemento da sequência.
- source_word: ወኢይሔሊኒ፡ እንሣእ
  choice: não pretendo tomar
  rationale: Preserva a força de pensamento ou intenção do verbo ሐለየ, em vez de reduzi-la a uma simples declaração de futuro.
- source_word: እምአዋልደ፡ ከናአን
  choice: dentre as filhas de Canaã
  rationale: Conserva a designação coletiva e tradicional do texto-fonte.
