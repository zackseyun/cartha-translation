  yaml_path: translation/extra_canonical/jubilees/025/004.yaml
  text: But I[a], my son, love you exceedingly, and my heart and my affection will bless you at all times, by day and in the watches of the night.
translation:
  language: pt
  text: Mas eu, meu filho, amo você muitíssimo, e meu coração e meu afeto o abençoarão em todo tempo, de dia e nas vigílias da noite.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase final apresenta dificuldade textual e de segmentação; o sentido mais provável é um merismo: “de dia e nas vigílias da noite”.'
    reason: segmentation_note
lexical_decisions:
- source_word: አፈቅረከ፡ ጥቀ፡ ፈድፋደ
  choice: amo você muitíssimo
  rationale: Reproduz de modo natural a forte intensificação do amor expressa pela sequência adverbial, sem tornar a frase artificial em português.
- source_word: ወልብየ፡ ወምሕረትየ
  choice: meu coração e meu afeto
  rationale: Mantém os dois termos coordenados. Aqui, ምሕረት admite o sentido relacional de afeto ou ternura, adequado à fala materna, sem reduzi-lo à acepção técnica de misericórdia.
- source_word: ይባርከከ
  choice: o abençoarão
  rationale: Conserva a linguagem explícita de bênção e verte a forma verbal com valor prospectivo, conforme o sentido da declaração.
- source_word: በኵሉ፡ ጊዜ
  choice: em todo tempo
  rationale: Expressão corrente e dignificada que preserva a abrangência temporal do original.
- source_word: ዕለት፡ ወዐቃቤ፡ ለያልይ
  choice: de dia e nas vigílias da noite
  rationale: Entende a expressão final como um merismo que abrange dia e noite, preservando a imagem antiga das vigílias.
