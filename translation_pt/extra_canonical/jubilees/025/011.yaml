base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/011.yaml
  text: I swear before you all the days of my life that I will not take a wife for myself from the daughters of the seed of Canaan, and that I will not act wickedly as Esau did.
translation:
  language: pt
  text: Juro diante de você, por toda a minha vida, que não tomarei para mim uma esposa dentre as filhas da descendência de Canaã e que não praticarei o mal, como Esaú fez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não agirei perversamente, como Esaú agiu”.'
    reason: Registra uma alternativa idiomática que mantém a avaliação moral explícita do verbo ge'ez e a comparação com Esaú.
lexical_decisions:
- source_word: እምሕለ፡ አነ፡ እም፡ ቅድሜኪ
  choice: Juro diante de você
  rationale: Reproduz de modo natural a fórmula de juramento e mantém a referência direta à pessoa diante de quem ele é feito.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: por todos os dias da minha vida
  rationale: Conserva a expressão temporal enfática do texto ge’ez em português corrente.
- source_word: ብእሲተ፡ እምአዋልደ፡ ዘርአ፡ ከናአን
  choice: uma esposa dentre as filhas da descendência de Canaã
  rationale: Mantém tanto a ideia matrimonial quanto a formulação genealógica explícita do original.
- source_word: ወኢያአኪ፡ ገቢረ
  choice: e que não agirei perversamente
  rationale: O verbo ge’ez contém uma avaliação moral negativa; a tradução evita omiti-la, sem ampliar o sentido para uma doutrina específica.
- source_word: በከመ፡ ገብረ፡ ዔሳው
  choice: como Esaú agiu
  rationale: Preserva a comparação direta com a conduta de Esaú e evita a repetição pouco natural de “fez” em português.
theological_decisions:
- issue: Avaliação moral da conduta de Esaú
  choice: não agirei perversamente, como Esaú agiu
  alternative: não farei como Esaú fez
  rationale: A redação escolhida conserva o elemento explícito de maldade no verbo ያአኪ; a alternativa mais neutra reduziria uma avaliação moral presente no texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Você” corresponde ao singular da forma ge’ez; “descendência” comunica a linguagem genealógica sem soar excessivamente técnica.
