base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/012.yaml
  text: '"Do not fear, mother; be assured that I will do your will and walk in uprightness, and I will never corrupt my ways."'
translation:
  language: pt
  text: '“Não tenha medo, minha mãe; confie em mim: farei a sua vontade, andarei com retidão e jamais corromperei os meus caminhos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍርሂ
  choice: Não tenha medo
  rationale: Reproduz de modo natural a proibição dirigida à mãe, preservando o sentido direto do imperativo negativo.
- source_word: ትእመኒ
  choice: confie em mim
  rationale: O verbo expressa confiança ou crença dirigida ao falante; esta formulação é mais direta e fiel que a impessoal “esteja certa”.
- source_word: ፈቃደኪ
  choice: a sua vontade
  rationale: Mantém a referência à vontade ou desejo da mãe sem restringi-la a uma ordem específica.
- source_word: ወበርትዕ፡ አሐውር
  choice: andarei com retidão
  rationale: Expressa naturalmente a ideia de caminhar de maneira reta ou justa, conservando a metáfora ética do caminhar.
- source_word: ወኢያማስን፡ ፍናውየ፡ ለዓለም
  choice: e jamais corromperei os meus caminhos
  rationale: Preserva a metáfora plural dos caminhos e traduz a negação enfática temporal como “jamais”.
theological_decisions:
- issue: Natureza da retidão prometida
  choice: andarei com retidão
  alternative: andarei em justiça
  rationale: “Retidão” conserva o caráter moral da expressão sem impor uma leitura técnico-doutrinária de justiça.
- issue: Força de ለዓለም na negação
  choice: jamais
  alternative: para sempre
  rationale: No contexto de uma oração negativa, “jamais” comunica com clareza a duração enfática sem alterar a afirmação.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento brasileiro natural (“sua”) e preservação das metáforas éticas do texto-fonte. A fala direta recebe aspas de abertura e fechamento.
