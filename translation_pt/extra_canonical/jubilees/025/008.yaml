  yaml_path: translation/extra_canonical/jubilees/025/008.yaml
  text: And I heard previously that daughters had been born to Laban, your brother, and I set my heart on them, that I might take a wife from among them.
translation:
  language: pt
  text: Eu tinha ouvido anteriormente que haviam nascido filhas a Labão, seu irmão, e pus meu coração nelas, para que eu tomasse dentre elas uma esposa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕኩ፡ እምቀዲሙ፡
  choice: Eu já tinha ouvido
  rationale: Expressa a audição anterior indicada pelo verbo e por «anteriormente», usando uma construção temporal natural em português.
- source_word: ትወልዲ፡ አዋልደ፡ ለላባ፡
  choice: haviam nascido filhas a Labão
  rationale: Preserva a imagem explícita do nascimento das filhas, em vez de simplificá-la para «Labão tinha filhas».
- source_word: አንበርኩ፡ ልብየ፡
  choice: voltei para elas o meu coração
  rationale: Mantém a expressão idiomática concreta do texto-fonte, comunicando intenção e inclinação deliberadas sem reduzi-las apenas a preferência romântica.
- source_word: እንሣእ፡ እምኔሆን፡ ብእሲተ።
  choice: a fim de tomar dentre elas uma esposa
  rationale: Reproduz a finalidade e a ideia de escolher uma esposa dentre as filhas mencionadas, em linguagem digna e compreensível.
