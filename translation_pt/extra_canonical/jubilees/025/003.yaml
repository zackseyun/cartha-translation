  verdict: revise
  source_fidelity: 'A tradução acompanha adequadamente a estrutura e os termos centrais do ge''ez: a totalidade da conduta/obras, a imoralidade sexual, a impureza e a ausência de justiça/retidão. Contudo, «entre eles» pode sugerir a inexistência de justiça nas relações mútuas, ao passo que a formulação fonte afirma que a justiça/retidão não está neles. O pronome «ela» também cria, em português, uma retomada imediata e enganosa de «justiça», embora o referente do singular final não seja explicitado de modo tão restrito.'
  naturalness: O período é claro e de registro apropriado. A substituição de «entre eles» por «neles» torna a afirmação moral mais direta, e «isso é mau» evita uma concordância pronominal que tende a fixar indevidamente o antecedente.
  terminology: «Imoralidade sexual» e «impureza» são escolhas modernas aceitáveis para os termos morais da fonte. «Retidão» é preferível aqui a «justiça», pois preserva o sentido de qualidade moral pessoal e evita a leitura predominantemente social de «justiça».
  issues:
