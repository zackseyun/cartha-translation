lexical_decisions:
- source_word: ምግባሮሙ
  choice: a conduta deles
  rationale: Expressa de modo natural o conjunto do comportamento ou das práticas deles.
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Termo amplo e claro em português moderno para conduta sexual ilícita, sem restringir indevidamente o sentido a um ato específico.
- source_word: ምርጓት
  choice: impureza
  rationale: Preserva a ideia de impureza ou falta de pureza presente no contexto moral da frase.
- source_word: ጽድቀ
  choice: justiça
  rationale: Mantém o campo semântico de retidão/justiça sem introduzir uma interpretação confessional.
- source_word: እኩይ
  choice: má
  rationale: O adjetivo singular retoma naturalmente 'conduta' em português; conserva a avaliação moral direta do original.
theological_decisions:
- issue: Referente do pronome singular na oração final
  choice: porque ela é má
  alternative: porque isso é mau
  rationale: O original traz uma forma singular. Em português, a leitura mais próxima e natural faz o pronome retomar 'conduta', preservando a estrutura sem ampliar o referente.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação permanece próxima da sintaxe e da força moral do ge'ez, evitando arcaísmos e especificações denominacionais.
