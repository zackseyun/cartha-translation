  - severity: medium
    issue: «porque ela é má»
    rationale: Em português, «ela» retoma mais naturalmente «justiça», apesar de a oração final da fonte não identificar de forma expressa esse antecedente. «Isso» conserva a referência avaliativa sem a restringir.
  revised_text: Pois toda a conduta deles é imoralidade sexual e impureza, e não há retidão neles, pois isso é mau.
