  text: And despite all this that he has commanded me[a], these twenty-two years Esau has been urging me and pressing me, speaking to me and saying, ‘My brother, take a wife, one of the sisters of my two wives,’ but I have not been willing to do as he did.
translation:
  language: pt
  text: 'E, apesar de tudo isso que ele me ordenou[a], durante estes vinte e dois anos Esaú tem insistido comigo e me pressionado, falando comigo e dizendo: “Meu irmão, tome como esposa uma das irmãs de minhas duas mulheres.” Mas eu não tenho querido fazer como ele fez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão também pode ser entendida como: “E, com tudo isso que ele me ordenou”. Os “vinte e dois anos” parecem indicar um longo período de pressão por parte de Esaú.'
    reason: Preserva a possível leitura menos concessiva da abertura e esclarece a função temporal da expressão sem incorporá-la como interpretação definitiva ao texto.
lexical_decisions:
- source_word: ወምስለ፡ ኵሉ፡ ዘአዘዘኒ
  choice: E, apesar de tudo isso que ele me ordenou
  rationale: Preserva o valor concessivo do início e traduz explicitamente o verbo ዘአዘዘኒ, “que ele me ordenou”.
- source_word: ይትኃአዘኒ፡ ወያበዝኀ
  choice: tem insistido comigo e me pressionado
  rationale: Mantém os dois verbos, que expressam insistência e pressão continuadas.
- source_word: ብእሲተ፡ አሐተ፡ እኅትነ፡ ለአንስቲያየ፡ ክልኤቲ
  choice: tome como esposa uma das irmãs de minhas duas mulheres
  rationale: Explicita naturalmente em português a ideia de tomar uma mulher por esposa, sem alterar a relação familiar indicada pelo texto.
- source_word: ኢይፈቅድ፡ እግበር፡ ከመ፡ ገብረ፡ ውእቱ
  choice: não quis fazer como ele fez
  rationale: Reproduz de modo direto a recusa do falante e a comparação deliberadamente geral com a conduta de Esaú.
theological_decisions:
- issue: Identidade de quem deu a ordem mencionada no início
  choice: manter o pronome “ele” sem identificar o referente
  alternative: explicitar Esaú ou outra personagem como sujeito
  rationale: O trecho fornecido não resolve de maneira inequívoca o antecedente; preserva-se a ambiguidade do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência brasileira. A sintaxe foi levemente reorganizada para dar naturalidade, mantendo a abertura concessiva, os dois verbos de insistência e a ambiguidade do pronome inicial.
