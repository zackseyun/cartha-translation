  choice: guardei o meu espírito, para não pecar nem me contaminar em nenhum dos meus caminhos
  alternative: guardei-me, para não me contaminar e para que meus caminhos não se corrompessem
  rationale: O texto admite diferenças de segmentação e referência pronominal. A redação principal acompanha de perto a construção recebida, enquanto a nota preserva a alternativa genuína sem resolver a tensão silenciosamente.
