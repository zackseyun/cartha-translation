  choice: guardei o meu espírito
  rationale: Mantém a imagem e a ambiguidade da expressão etíope, em português natural e solene.
- source_word: ኢየአብስ
  choice: para não pecar
  rationale: Expressa diretamente a ideia de cometer pecado, preservando a finalidade indicada no contexto.
- source_word: ኢይማስን
