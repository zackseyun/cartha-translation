base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/009.yaml
  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
translation:
  language: pt
  text: E por isso guardei o meu espírito[a], para não pecar nem me contaminar em todos os meus caminhos, durante todos os dias da minha vida; pois, por causa da devassidão e da imoralidade sexual, Abraão, meu pai, deu-me muitos mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação também pode ser entendida assim: “para que eu não me contaminasse e para que os meus caminhos não se corrompessem”.'
    reason: Alternativa lexical e sintática possível no texto etíope.
