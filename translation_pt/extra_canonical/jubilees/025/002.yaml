  yaml_path: translation/extra_canonical/jubilees/025/002.yaml
  text: And she spoke to him, saying, “My son, do not take for yourself a wife from the daughters of Canaan, as Esau your brother did, who took for himself two wives from the daughters of Canaan, and they have made my spirit bitter by all their unclean conduct.”
translation:
  language: pt
  text: 'E ela lhe falou, dizendo: “Meu filho, não tome para si uma esposa dentre as filhas de Canaã, como fez Esaú, seu irmão, que tomou para si duas esposas dentre as filhas de Canaã; elas tornaram amargo o meu espírito por toda a sua conduta impura.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትንሣእ፡ ለከ፡ ብእሲተ
  choice: não tome para si uma mulher
  rationale: Preserva a construção reflexiva do ge'ez e expressa com naturalidade a ideia de tomar uma esposa.
- source_word: አዋልደ፡ ከናአን
  choice: filhas de Canaã
  rationale: Mantém a designação coletiva e genealógica da fonte, sem substituí-la por uma interpretação étnica mais específica.
- source_word: ወእምረርዋ፡ ለመንፈሰያ
  choice: elas amarguraram o meu espírito
  rationale: Reproduz a imagem concreta de tornar amargo o espírito, em vez de reduzi-la a mero desgosto emocional.
- source_word: በኵሉ፡ ምግባሮሙ፡ ርኵስ
  choice: com toda a sua conduta impura
  rationale: Traduz o sentido moral de comportamento ou prática, preservando a qualificação de impureza sem ampliá-la.
theological_decisions:
- issue: Natureza da impureza atribuída às mulheres cananeias
  choice: conduta impura
  alternative: conduta perversa
  rationale: A formulação conserva a linguagem de pureza da fonte e evita definir de modo denominacional ou excessivamente específico a natureza da transgressão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “tomou para si” e “filhas de Canaã” foi mantida por refletir a ênfase e a estrutura do original.
