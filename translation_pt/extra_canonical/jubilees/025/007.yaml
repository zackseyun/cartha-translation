base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/007.yaml
  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
translation:
  language: pt
  text: Pois me lembro da palavra de Abraão, nosso pai,[a] porque ele me ordenou que não tomasse esposa dentre as filhas de Canaã, mas que tomasse para mim uma esposa da descendência da casa de meu pai e da minha parentela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “daquilo que Abraão, nosso pai, me disse: que ele me ordenou”.'
    reason: A sequência inicial admite uma construção mais verbal, embora a redação principal preserve o substantivo «palavra» do texto-fonte.
lexical_decisions:
- source_word: ነገረ፡ አብርሃም፡ አቡነ፡
  choice: da palavra de Abraão, nosso pai
  rationale: Mantém o substantivo concreto «palavra» e o título comunitário «nosso pai», acompanhando de perto a sintaxe do ge'ez sem tornar o português obscuro.
- source_word: ብእሲተ፡
  choice: esposa
  rationale: No contexto de «tomar», o termo designa uma mulher como esposa; esta forma é natural e digna em português atual.
- source_word: እምአወልደ፡ ከናአን፡
  choice: dentre as filhas de Canaã
  rationale: Preserva a expressão genealógica do texto-fonte e evita substituir Canaã por uma designação étnica interpretativa.
- source_word: እምዘርአ፡ ቤተ፡ አቡየ፡
  choice: da descendência da casa de meu pai
  rationale: Conserva tanto a ideia de linhagem («descendência») quanto a de grupo familiar («casa de meu pai»).
- source_word: እምዘመድየ፡
  choice: da minha parentela
  rationale: Expressa o círculo de parentesco de maneira mais ampla que «família» e com registro adequado ao contexto antigo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura paralela «não tomasse... mas que tomasse» preserva a oposição do original, enquanto «dentre» evita a leitura de que todas as filhas de Canaã formariam uma única família imediata.
