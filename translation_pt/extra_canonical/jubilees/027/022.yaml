base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/022.yaml
  text: And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to a certain place at evening, and he turned aside from his road to the west of the road that night, and he slept there, because the sun had set.
translation:
  language: pt
  text: E Jacó saiu do Poço do Juramento para ir a Harã, no primeiro ano da segunda semana do quadragésimo quarto jubileu. Chegou a Luz, que fica na região montanhosa, isto é, Betel, na lua nova do primeiro mês daquela semana. Ao entardecer, chegou a certo lugar e, naquela noite, desviou-se de seu caminho para o lado oeste da estrada[a] e dormiu ali, porque o sol já havia se posto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção no texto é difícil. Outra tradução possível é: “desviou-se de seu caminho naquela noite”.'
    reason: Preserva a incerteza sintática em torno da expressão que parece indicar o lado oeste da estrada, sem omitir essa leitura do texto principal.
lexical_decisions:
- source_word: ዐዘቆተ፡ መሐላ
  choice: Poço do Juramento
  rationale: Traduz o topônimo de modo transparente, preservando sua forma tradicional e seu sentido etimológico.
- source_word: ሐራንሃ
  choice: Harã
  rationale: Forma portuguesa corrente do topônimo bíblico Haran.
- source_word: ሉዛ ... ቤቴል
  choice: Luz ... Betel
  rationale: Mantém os dois nomes e a identificação explícita feita pelo texto.
- source_word: ውስተ፡ ደብር
  choice: na região montanhosa
  rationale: Expressa naturalmente a localização em terreno montanhoso sem sugerir necessariamente uma única montanha.
- source_word: በሠርቀ፡ ወርኅ
  choice: na lua nova
  rationale: Representa o início do mês lunar indicado pela expressão etíope.
- source_word: መካነ፡ መሴየ
  choice: ao entardecer, chegou a certo lugar
  rationale: Preserva tanto a indefinição de 'lugar' quanto a circunstância temporal do entardecer.
- source_word: እምፍኖቱ፡ እንተ፡ ዐረበን፡ ለመንገደ
  choice: desviou-se de seu caminho para o lado oeste da estrada
  rationale: Conserva o sufixo possessivo de terceira pessoa e a indicação ocidental presente no texto, embora a construção seja sintaticamente difícil.
theological_decisions:
- issue: Sistema cronológico dos jubileus e das semanas de anos
  choice: primeiro ano da segunda semana do quadragésimo quarto jubileu
  alternative: primeiro ano do segundo período de sete anos do jubileu quarenta e quatro
  rationale: Mantém a terminologia própria da obra e a relação formal entre jubileu, semana e ano, sem expandir interpretativamente.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A coordenação narrativa repetida foi preservada em boa medida, mas com ajustes leves de ordem para fluência. O marcador [a] aparece no texto principal.
