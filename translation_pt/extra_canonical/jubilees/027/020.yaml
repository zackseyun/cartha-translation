  yaml_path: translation/extra_canonical/jubilees/027/020.yaml
  text: Do not fear for him, my sister, for he is upright in his way, and he is a blameless man, and he is faithful, and he will not be forsaken. Do not weep.
translation:
  language: pt
  text: Não tenha medo por ele, minha irmã, pois ele é íntegro em seu caminho, é um homem irrepreensível e é fiel; ele não será abandonado. Não chore.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትፍርሂ፡ በእንቲአሁ
  choice: Não tenha medo por causa dele
  rationale: Reproduz a proibição e a locução causal/referencial sem sugerir que o medo seja dirigido ao homem.
- source_word: ሪትዕ፡ በፍኖቱ
  choice: íntegro em seu caminho
  rationale: Mantém o substantivo no singular e expressa retidão moral em português natural.
- source_word: ፍጹም፡ ውእቱ፡ ብእሲ
  choice: é um homem irrepreensível
  rationale: Neste contexto moral, 'irrepreensível' comunica melhor a ideia de inteireza ou perfeição do que o literal pouco natural 'completo'.
- source_word: ምእመን፡ ውእቱ
  choice: é fiel
  rationale: Equivalente direto e natural para a qualidade de confiabilidade/fidelidade atribuída ao homem.
- source_word: ወኢይትገደፍ
  choice: ele não será abandonado
  rationale: Preserva a cláusula verbal passiva antes omitida em uma versão anterior e evita especificar quem não o abandonará.
- source_word: ኢትብከዪ
  choice: Não chore
  rationale: Imperativo negativo feminino singular, dirigido à irmã.
theological_decisions:
- issue: Agente implícito em 'não será abandonado'
  choice: Manter o agente sem identificação
  alternative: Explicitar 'Deus não o abandonará'
  rationale: A forma passiva do texto não nomeia o agente; explicitá-lo resolveria uma ambiguidade que deve ser preservada.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por 'você' implícito nas formas 'tenha' e 'chore'. A coordenação foi levemente ajustada com ponto e vírgula para clareza, sem omitir nenhuma oração do ge'ez.
