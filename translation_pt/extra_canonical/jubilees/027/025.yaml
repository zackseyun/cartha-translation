  yaml_path: translation/extra_canonical/jubilees/027/025.yaml
  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: pt
  text: 'E ele falou com Jacó e disse: “Eu sou o Senhor, o Deus de Abraão, seu pai, e o Deus de Isaque. A terra sobre a qual você está deitado e dormindo eu darei a você e à sua descendência depois de você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነ፡ ውእቱ፡ እግዚአብሔር
  choice: Eu sou o Senhor
  rationale: A expressão literalmente enfática «eu sou ele, o Senhor» é vertida pela forma portuguesa natural que preserva a autoidentificação divina sem acrescentar uma ênfase artificial.
- source_word: ትነውም
  choice: está deitado, adormecido
  rationale: Preserva o sentido concreto de estar deitado e dormindo, em vez de reduzir o verbo apenas a «dormir».
- source_word: ዘርእከ
  choice: sua descendência
  rationale: O termo significa literalmente «semente», mas aqui designa coletivamente os descendentes; «descendência» comunica esse sentido com clareza e dignidade em português moderno.
- source_word: እምድኅሬከ
  choice: depois de você
  rationale: Mantém a expressão temporal e sucessória do texto-fonte sem a substituir por uma formulação interpretativa.
theological_decisions:
- issue: Identificação de Abraão como pai de Jacó
  choice: Abraão, seu pai
  alternative: Abraão, seu antepassado
  rationale: Mantém a linguagem genealógica do texto-fonte, na qual «pai» pode designar um ancestral, sem explicitar no corpo do versículo uma interpretação.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A sintaxe acompanha de perto a formulação do ge'ez, mas evita rigidez desnecessária; «você» foi empregado para interlocução direta e natural.
