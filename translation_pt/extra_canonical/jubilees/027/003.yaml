  choice: Então mandarei buscá-lo de lá
  rationale: Traduz idiomaticamente a sequência de enviar alguém para trazer a pessoa de volta daquele lugar.
theological_decisions:
- issue: Sujeito da ação envolvendo a ira
  choice: ele afaste de você a sua ira
