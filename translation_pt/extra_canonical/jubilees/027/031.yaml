  yaml_path: translation/extra_canonical/jubilees/027/031.yaml
  text: and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you, my God.”
translation:
  language: pt
  text: e eu voltar em paz à casa de meu pai, então o Senhor será o meu Deus. E esta pedra, que ergui como coluna para servir de sinal neste lugar, será a casa do Senhor; e, de tudo o que me deres, certamente te darei a décima parte, meu Deus.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትመየጥ
  choice: voltar
  rationale: Expressa naturalmente o retorno indicado pelo verbo ge'ez, mantendo a construção condicional iniciada no contexto anterior.
- source_word: በሰላም
  choice: em paz
  rationale: Preserva a formulação direta do texto e seu sentido de retorno seguro e íntegro.
- source_word: ሐውልተ፡ ለትእምርት
  choice: coluna para servir de sinal
  rationale: 'Mantém os dois elementos do texto: a pedra erguida como monumento ou coluna e sua função de sinal.'
- source_word: ቤተ፡ እግዚአብሔር
  choice: casa do Senhor
  rationale: Correspondência formal e idiomática para a expressão ge'ez.
- source_word: አሡር
  choice: darei a décima parte
  rationale: Traduz a ideia verbal de separar ou entregar o dízimo sem recorrer a uma formulação eclesiástica mais marcada.
theological_decisions:
- issue: Relação condicional entre o retorno e a declaração de que o Senhor será o Deus de Jacó
  choice: então o Senhor será o meu Deus
  alternative: o Senhor será o meu Deus
  rationale: O advérbio português explicita a consequência já presente na sequência condicional, sem decidir se a frase constitui voto, reconhecimento ou compromisso pactual.
- issue: A pedra como casa do Senhor
  choice: esta pedra [...] será a casa do Senhor
  alternative: neste lugar haverá uma casa do Senhor
  rationale: Mantém a identificação surpreendente e teologicamente tensa do próprio texto, sem reinterpretá-la como mera referência ao local ou a um edifício futuro.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe conserva a sequência do voto e a ambiguidade teológica do original; não foram necessárias notas de rodapé.
