- source_word: አዋልደ፡ ምድር
  choice: filhas desta terra
  rationale: Preserva a expressão semítica e explicita o valor contextual definido do território em questão.
- source_word: ለምንት፡ ሊተ፡ እንከ፡ አሐዩ
  choice: para que hei de continuar vivendo?
  rationale: Reproduz a pergunta de desespero com fluidez em português moderno; ‘continuar’ comunica o valor de ‘ainda/então’ no contexto.
- source_word: እኩያት
