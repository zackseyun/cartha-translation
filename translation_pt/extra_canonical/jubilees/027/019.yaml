  yaml_path: translation/extra_canonical/jubilees/027/019.yaml
  text: For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.
translation:
  language: pt
  text: Pois sei que os caminhos dele prosperarão em tudo, por onde quer que vá, até que volte para nós em paz e o vejamos em paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አአምር
  choice: sei
  rationale: Traduz diretamente o verbo de conhecimento em primeira pessoa, mantendo a certeza expressa no texto.
- source_word: ይሤራኅ
  choice: prosperarão
  rationale: O verbo, no contexto dos caminhos ou empreendimentos da pessoa, comunica êxito e prosperidade; a formulação preserva essa imagem.
- source_word: ፍኖዊሁ
  choice: os caminhos dele
  rationale: Mantém a metáfora plural de 'caminhos', que pode abranger viagens, conduta e empreendimentos, sem restringir o sentido.
- source_word: በኵሉ ውእደ ሖረ
  choice: em tudo, por onde quer que vá
  rationale: Expressa conjuntamente a abrangência do êxito e o movimento espacial indicado pela oração.
- source_word: በሰላም
  choice: em paz
  rationale: Preserva a repetição deliberada da expressão tanto no retorno quanto no reencontro.
