  text: And Jacob rose early in the morning and took the stone that he had placed by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.
translation:
  language: pt
  text: Jacó se levantou de manhã cedo, pegou a pedra que havia colocado junto à cabeça e a ergueu como coluna, para servir de sinal. Depois, derramou óleo sobre o topo dela. E deu àquele lugar o nome de Betel; anteriormente, o nome daquela região era Luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በነግህ
  choice: de manhã cedo
  rationale: Expressa naturalmente o sentido temporal de levantar-se cedo pela manhã.
- source_word: ኀበ፡ ርእሱ
  choice: junto à cabeça
  rationale: Mantém a referência concreta à posição da pedra perto da cabeça de Jacó, sem introduzir o conceito mais específico de travesseiro.
- source_word: ሐውልተ፡ ለትእምርት
  choice: como coluna, para servir de sinal
  rationale: Preserva tanto a forma do objeto erguido quanto sua função de sinal ou memorial.
- source_word: ቅብአ
  choice: óleo
  rationale: Neste contexto de derramamento sobre uma coluna, 'óleo' é a equivalência portuguesa mais clara e tradicional, sem acrescentar uma finalidade ritual não explicitada.
- source_word: ብሔር
  choice: região
  rationale: O termo designa aqui a área ou território cujo nome anterior era Luz; 'região' é claro e evita confundi-lo com o lugar pontual já chamado Betel.
