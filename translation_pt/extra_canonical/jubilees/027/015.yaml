  text: And Isaac sent Jacob away, and he went to Mesopotamia, to Laban son of Bethuel the Syrian, the brother of Rebekah, Jacob's mother.
translation:
  language: pt
  text: E Isaque enviou Jacó embora, e ele foi à Mesopotâmia, para junto de Labão, filho de Betuel, o sírio, irmão de Rebeca, mãe de Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፈነዎ፡ ይስሐቅ፡ ለያዕቆብ
  choice: E Isaque despediu Jacó
  rationale: Reproduz de modo natural a ação de Isaque ao mandar Jacó partir, sem acrescentar motivo ou destino à forma verbal.
- source_word: መስጶጦሚያ
  choice: Mesopotâmia
  rationale: Emprega a forma geográfica tradicional e amplamente reconhecida em português.
- source_word: ላባ፡ ወልደ፡ ባቱኤል፡ ሶርያዊ
  choice: Labão, filho de Betuel, o sírio
  rationale: Mantém a filiação e o gentílico do texto-fonte; a aposição fica deliberadamente ligada a Betuel, como sugere a ordem imediata das palavras.
- source_word: እኁሃ፡ ለርብቃ
  choice: irmão de Rebeca
  rationale: Traduz diretamente a relação familiar expressa no ge'ez.
- source_word: እሙ፡ ለያዕቆብ
  choice: mãe de Jacó
  rationale: Preserva a menção explícita de Jacó na construção ge'ez, evitando reduzi-la a apenas 'sua mãe'.
