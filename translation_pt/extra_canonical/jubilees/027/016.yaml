  yaml_path: translation/extra_canonical/jubilees/027/016.yaml
  text: And after Jacob had arisen to go to Mesopotamia, the spirit of Rebekah was grieved over her son, and she wept.
translation:
  language: pt
  text: E aconteceu que, depois que Jacó se levantou para ir à Mesopotâmia, o espírito de Rebeca se entristeceu por causa de seu filho, e ela chorou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥአ
  choice: se levantou
  rationale: Reproduz o sentido de levantar-se e, no contexto, preparar-se para partir, sem reduzir o verbo simplesmente a “partiu”.
- source_word: ሰሐዊረ
  choice: para ir
  rationale: Expressa naturalmente em português a finalidade do levantar-se de Jacó.
- source_word: ሐዘነ፡ መንፈሰ፡ ርብቃ
  choice: o espírito de Rebeca se entristeceu
  rationale: Mantém a referência explícita ao espírito de Rebeca e a formulação antropológica do texto-fonte.
- source_word: ድኅረ፡ ወልዳ
  choice: por causa de seu filho
  rationale: No contexto de tristeza, a preposição indica o motivo ou objeto do pesar, não posterioridade temporal.
- source_word: ወትበኪ
  choice: e ela chorou
  rationale: Tradução direta e natural da ação atribuída a Rebeca.
theological_decisions:
- issue: Sentido de “espírito” na tristeza de Rebeca
  choice: Preservar “o espírito de Rebeca”
  alternative: Traduzir idiomaticamente como “Rebeca ficou profundamente triste”
  rationale: A redação formal preserva a expressão do original e evita decidir se “espírito” é apenas um modo idiomático de falar da interioridade ou possui nuance antropológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com estrutura narrativa de tonalidade bíblica. “E aconteceu que” conserva a abertura formular do ge'ez; “se entristeceu por causa de seu filho” evita o sentido temporal inadequado de uma tradução literal de ድኅረ.
