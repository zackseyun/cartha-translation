  text: 'E Rebeca disse a Jacó: “Eu entrarei e falarei, e ele o enviará.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እበውእ (ʾəbawəʾ)
  choice: entrarei
  rationale: Expressa a entrada de Rebeca para falar com Isaque, preservando a sequência verbal do texto.
- source_word: እነግር (ʾənaggər)
  choice: falarei com ele
  rationale: O verbo significa falar ou dizer; o complemento contextual “com ele” torna natural em português a referência a Isaque sem acrescentar conteúdo interpretativo relevante.
- source_word: ይፈንወከ (yəfannawaka)
  choice: ele mandará você embora
  rationale: O verbo com o sufixo de segunda pessoa indica que Isaque enviará Jacó, não que mandará chamá-lo. “Mandará você embora” explicita naturalmente o envio para longe, de acordo com o contexto imediato da partida para Harã.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com ordem coordenada próxima à do ge'ez. Emprega-se “você” para ampla legibilidade brasileira; “mandará você embora” evita a leitura incorreta de convocação sugerida por “mandará chamar você”.
