  text: And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.
translation:
  language: pt
  text: E que Deus Todo-Poderoso abençoe você, o torne fecundo e o multiplique; e que você se torne uma assembleia de povos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ሰዳይ
  choice: Deus Todo-Poderoso
  rationale: Reproduz o título divino «Deus Shaddai» em sua forma portuguesa tradicional e clara, em consonância com o contexto de Gênesis 28:3.
- source_word: ያልህቀ
  choice: o torne fecundo
  rationale: Expressa a ideia de produzir fruto ou descendência em português natural, sem restringi-la explicitamente a uma única interpretação.
- source_word: ያብዝኀከ
  choice: o multiplique
  rationale: Preserva a formulação tradicional da bênção de multiplicação e sua referência direta ao destinatário.
- source_word: መክብበ፡ አሕዛብ
  choice: uma assembleia de povos
  rationale: Traduz a expressão coletiva sem transformar «povos/nações» em um grupo especificamente religioso; «assembleia» conserva o sentido de reunião ou coletividade.
theological_decisions:
- issue: Alcance da promessa de fecundidade e multiplicação
  choice: Manter a linguagem ampla da bênção, aplicável ao destinatário e à sua descendência.
  alternative: Explicitar «dar muitos descendentes».
  rationale: O texto formula a promessa por meio de verbos de fecundidade e multiplicação; explicitar descendência resolveria uma amplitude que o original mantém.
- issue: Identidade da «assembleia de povos»
  choice: Não identificar a expressão com Israel, a Igreja ou outra comunidade específica.
  alternative: Interpretá-la como uma comunidade teológica determinada.
  rationale: O verso apresenta uma promessa abrangente, e a tradução deve preservar essa abertura sem importar uma leitura denominacional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por «você» para clareza brasileira. A coordenação repetida com «e» preserva o ritmo solene da bênção sem soar excessivamente arcaica.
