  yaml_path: translation/extra_canonical/jubilees/027/001.yaml
  text: And the matter of Esau her older son was told to Rebekah in a dream. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is bearing a grudge against you, to kill you.”
translation:
  language: pt
  text: 'Em um sonho, Rebeca foi informada sobre o caso de Esaú, seu filho mais velho. E ela mandou chamar Jacó, seu filho mais novo, e lhe disse: “Veja, seu irmão Esaú guarda rancor contra você e pretende matar você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተነግረ ... በሕልም
  choice: Em sonho, Rebeca foi informada
  rationale: Mantém o sentido passivo de que a informação foi comunicada a Rebeca durante um sonho, em ordem natural no português.
- source_word: ነገሩ ለዔሳው
  choice: sobre o caso de Esaú
  rationale: ነገር pode indicar assunto, caso ou situação. “O caso de Esaú” preserva essa amplitude sem convertê-lo especificamente em palavras ou plano.
- source_word: ዘይሌህቅ / ዘይንእስ
  choice: mais velho / mais novo
  rationale: Expressa de modo claro e corrente o contraste entre o filho de maior idade e o de menor idade.
- source_word: ይትቄየመከ
  choice: guarda rancor contra você
  rationale: O verbo ge'ez indica ressentimento, rancor ou atitude vingativa; esta tradução segue o texto ge'ez, sem importar o idioma hebraico paralelo de “consolar-se”.
- source_word: ከመ ይቅትልከ
  choice: e pretende matá-lo
  rationale: Comunica naturalmente a finalidade homicida ligada ao rancor de Esaú, sem enfraquecer a ameaça.
