  text: And your seed will be like the dust of the earth, and you will spread out to the sea and to the east and to the north and to the south. And in you and in your seed all the lands of the nations will be blessed.
translation:
  language: pt
  text: E sua descendência será como o pó da terra, e você se estenderá até o mar, até o leste, até o norte e até o sul. E em você e em sua descendência serão abençoadas todas as terras das nações.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “todos os países das nações”.
    reason: Registra uma alternativa natural para o termo traduzido por “terras”, sem recorrer à leitura secundária “famílias”.
lexical_decisions:
- source_word: ዘርእከ
  choice: sua descendência
  rationale: O termo designa a semente ou posteridade do destinatário; “descendência” comunica naturalmente o sentido coletivo em português.
- source_word: ባሕር
  choice: mar
  rationale: Mantém o substantivo concreto da fonte e preserva o idioma direcional tradicional, sem substituí-lo interpretativamente por “oeste”.
- source_word: በሐውርተ፡ አሕዛብ
  choice: terras das nações
  rationale: Segue a leitura do texto etíope como “terras/países das nações”, em vez de importar “famílias” da formulação de Gênesis.
theological_decisions:
- issue: Alcance e agente da bênção
  choice: serão abençoadas
  alternative: abençoarão a si mesmas
  rationale: A forma passiva preserva a leitura natural da tradição textual e não especifica além da fonte quem concede a bênção.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. A repetição de “até” torna natural a enumeração direcional e conserva “mar” literalmente.
