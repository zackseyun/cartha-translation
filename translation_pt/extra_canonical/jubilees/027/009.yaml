  text: And Rebekah went in and said to Isaac, “I loathe my life because of the two daughters of Heth whom Esau has taken for himself as wives.
translation:
  language: pt
  text: 'E Rebeca entrou e disse a Isaque: “Estou desgostosa da vida por causa das duas filhas de Hete que Esaú tomou para si como esposas.”'
