lexical_decisions:
- source_word: ቦአት
  choice: entrou
  rationale: Reproduz diretamente o verbo de entrada e mantém a sequência narrativa do texto ge'ez.
- source_word: ገእዝኩ፡ ሕይወትየ
  choice: Estou desgostosa da vida
  rationale: Expressa em português natural a forte aversão ou repulsa de Rebeca pela própria situação de vida, sem sugerir necessariamente um desejo explícito de morrer.
- source_word: እምክልኤሆን፡ አዋልደ፡ ኬጥ
  choice: por causa das duas filhas de Hete
  rationale: Preserva o número dual explicitado e translitera o nome étnico tradicionalmente como Hete.
- source_word: እለ፡ ነሥአ፡ ዔሳው፡ ሎቱ፡ አንስትያ
  choice: que Esaú tomou para si como esposas
  rationale: Mantém a construção relacional do original, deixando claro que Esaú as tomou como suas mulheres/esposas.
