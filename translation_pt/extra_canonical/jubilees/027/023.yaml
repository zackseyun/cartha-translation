  text: And he took one of the stones of that place and put it under that tree, and he was traveling alone, and he slept.
translation:
  language: pt
  text: E tomou uma das pedras daquele lugar e colocou-a debaixo daquela árvore; viajava sozinho[a] e dormiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «caminhava sozinho».'
    reason: O verbo ge'ez የሐውር pode denotar ir, caminhar ou viajar; «viajava» é contextual, e a alternativa deve permanecer acessível.
lexical_decisions:
- source_word: የሐውር (yaḥawwer)
  choice: viajando
  rationale: O verbo pode significar ir, andar ou viajar. No contexto da jornada de Jacó, «viajando» exprime naturalmente o deslocamento sem restringi-lo ao ato de caminhar.
- source_word: ኖመ (noma)
  choice: adormeceu
  rationale: A forma verbal significa dormir; «adormeceu» produz uma sequência narrativa natural em português depois da preparação do lugar de repouso.
- source_word: ውእቱ ዕፅ
  choice: aquela árvore
  rationale: Mantém o valor demonstrativo do texto ge'ez, em vez de reduzi-lo ao artigo definido.
