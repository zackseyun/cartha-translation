  yaml_path: translation/extra_canonical/jubilees/027/006.yaml
  text: And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you.”
translation:
  language: pt
  text: 'E Jacó disse a Rebeca, sua mãe: “Veja, você sabe que meu pai envelheceu e já não enxerga, porque seus olhos estão fracos. Se eu o deixar, isso será mau aos olhos dele, porque o terei abandonado e me afastado de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረሰአ
  choice: envelheceu
  rationale: Expressa de modo natural o sentido contextual de ter-se tornado velho.
- source_word: ክቡዳ፡ አዕይንቲሁ
  choice: seus olhos estão fracos
  rationale: Mantém a imagem concreta dos olhos debilitados e explica por que o pai já não enxerga.
- source_word: እኩይ፡ ውእቱ፡ በቅድመ፡ አዕይንቲሁ
  choice: isso será mau aos olhos dele
  rationale: Preserva o idioma avaliativo do texto-fonte sem especificar além dele se se trata de ofensa, culpa ou desagrado.
- source_word: አኀድጎ
  choice: o terei abandonado
  rationale: Reproduz a força de deixar alguém, distinguindo-a do movimento subsequente de afastar-se.
- source_word: እምኔክሙ
  choice: de vocês
  rationale: O sufixo é plural; por isso, a tradução preserva a mudança do pai no singular para os familiares no plural.
