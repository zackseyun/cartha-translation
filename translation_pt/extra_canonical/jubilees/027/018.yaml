  text: The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.
translation:
  language: pt
  text: O Deus Altíssimo o guardará de todo mal e estará com ele, pois não o abandonará em nenhum de seus dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: O Deus Altíssimo
  rationale: Reproduz o título divino e a ordem conceitual do ge’ez em português natural e solene.
- source_word: የዐቅቦ
  choice: o guardará
  rationale: Expressa diretamente a ideia de guardar ou proteger, mantendo o referente pronominal masculino.
- source_word: እምኵሉ፡ እኩይ
  choice: de todo mal
  rationale: Conserva a formulação abrangente da fonte sem especificar se o mal é moral, físico ou circunstancial.
- source_word: ወይሄሉ፡ ምስሌሁ
  choice: e estará com ele
  rationale: Tradução clara e formal da promessa de presença divina.
- source_word: እስመ፡ ኢየኀድጎ
  choice: pois não o abandonará
  rationale: Mantém a relação causal e traduz o verbo como abandono, adequado ao contexto da presença protetora.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: em nenhum de seus dias
  rationale: A construção negativa em português comunica naturalmente que Deus não o abandonará durante toda a sua vida, preservando o sentido abrangente do original.
theological_decisions:
- issue: Alcance temporal da promessa
  choice: em nenhum de seus dias
  alternative: todos os seus dias
  rationale: Com o verbo negativo, esta formulação evita a possível leitura inadequada de que o abandono duraria todos os dias e conserva o alcance vitalício da promessa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A repetição de “ele/o” foi preservada para manter explícito o referente masculino da fonte.
