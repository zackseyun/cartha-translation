  text: And Jacob prayed a prayer to the Lord, saying, “If the Lord is with me and keeps me on this road on which I am going, and gives me bread to eat and clothing to wear,
translation:
  language: pt
  text: 'E Jacó orou ao Senhor, dizendo: “Se o Senhor estiver comigo, me guardar neste caminho por onde vou e me der pão para comer e roupa para vestir,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸሎተ
  choice: uma oração
  rationale: Preserva explicitamente o substantivo do texto ge’ez, em vez de reduzi-lo apenas ao verbo ‘orou’.
- source_word: እግዚአብሔር
  choice: Senhor
  rationale: Equivalente tradicional, digno e amplamente compreensível para o título divino.
- source_word: ዐቀበኒ
  choice: me guardar
  rationale: Expressa a ideia de proteger, preservar ou guardar durante a viagem.
- source_word: ፍኖት
  choice: caminho
  rationale: Termo natural que mantém tanto o sentido concreto de rota quanto sua possível ressonância mais ampla.
- source_word: ኅብስተ
  choice: pão
  rationale: Mantém a imagem concreta do alimento básico presente no texto-fonte.
- source_word: ልብሰ
  choice: roupa
  rationale: Português corrente e abrangente para vestimenta, adequado ao paralelismo com ‘pão’.
theological_decisions:
- issue: Forma condicional da oração de Jacó
  choice: Se o Senhor estiver comigo
  alternative: Visto que o Senhor está comigo
  rationale: O ge’ez apresenta a partícula condicional እመ; a tradução conserva a tensão do voto condicional sem reinterpretá-lo como certeza declarativa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. A frase permanece aberta com vírgula porque o versículo termina no meio da oração condicional, que prossegue no contexto seguinte.
