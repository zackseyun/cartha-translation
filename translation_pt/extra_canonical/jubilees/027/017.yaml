  text: And Isaac said to Rebekah, “My sister, do not weep because of Jacob my son, for he will go in peace and return in peace.
translation:
  language: pt
  text: 'E Isaque disse a Rebeca: “Minha irmã, não chore por causa de Jacó, meu filho, pois ele irá em paz e voltará em paz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅትየ
  choice: Minha irmã
  rationale: Reproduz literalmente a forma de tratamento afetiva empregada por Isaque ao dirigir-se a Rebeca, sem substituí-la por uma explicação interpretativa.
- source_word: ኢትብከዪ
  choice: não chore
  rationale: Imperativo negativo natural em português, correspondente ao sentido direto de não derramar lágrimas.
- source_word: በእንተ፡ ያዕቆብ፡ ወልድየ
  choice: por causa de Jacó, meu filho
  rationale: Preserva a relação causal e o possessivo do texto ge'ez.
- source_word: በሰላም፡ የሐውር፡ ወበሰላም፡ ይትመየጥ
  choice: ele irá em paz e voltará em paz
  rationale: Mantém o paralelismo e a repetição enfática de “em paz” presentes no original.
