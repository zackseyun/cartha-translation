  text: And may he give to you the blessings of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”
translation:
  language: pt
  text: E que ele dê a você as bênçãos de meu pai Abraão, a você e à sua descendência depois de você, para que você herde a terra onde vive como estrangeiro e toda a terra que Deus deu a Abraão. Vá em paz, meu filho.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከታቲሁ
  choice: as bênçãos
  rationale: O termo ge'ez está no plural; a tradução preserva essa forma, sem harmonizá-la com o singular da passagem paralela em Gênesis.
- source_word: ዘርእከ
  choice: sua descendência
  rationale: Expressa naturalmente o sentido coletivo de 'semente' em português contemporâneo.
- source_word: ምድረ፡ ፍልሰትከ
  choice: a terra onde vive como estrangeiro
  rationale: Comunica a condição de residência temporária ou peregrinação sem sugerir posse já consolidada.
- source_word: ትረሰ
  choice: herde
  rationale: Mantém a ideia de receber a terra como herança.
- source_word: በሰላም
  choice: em paz
  rationale: Preserva a fórmula de despedida do texto-fonte em linguagem natural e digna.
theological_decisions:
- issue: Número de 'bênção'
  choice: 'Plural: ''as bênçãos'''
  alternative: 'Singular: ''a bênção'''
  rationale: A forma ge'ez በረከታቲሁ é plural e deve prevalecer sobre uma possível harmonização com Gênesis 28:4.
- issue: Referente de 'ele'
  choice: Preservar o pronome 'ele' sem explicitação
  alternative: Substituir por 'Deus'
  rationale: O versículo começa com um referente dependente do contexto; explicitá-lo eliminaria essa característica do texto.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Emprega 'você' de modo consistente e evita tanto arcaísmos quanto paráfrases doutrinárias.
