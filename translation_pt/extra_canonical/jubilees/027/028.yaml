  text: And Jacob awoke from his sleep and said, “Surely this place is the house of the Lord, and I did not know it.” And he was afraid and said, “How awesome this place is! This is none other than the house of the Lord, and this is the gate of heaven.”
translation:
  language: pt
  text: 'Jacó despertou do sono e disse: “De fato, este lugar é a casa do Senhor, e eu não sabia.” Então teve medo e disse: “Como é temível este lugar! Este lugar não é senão a casa do Senhor, e esta é a porta do céu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማን
  choice: De fato
  rationale: Expressa a afirmação enfática do original de modo natural e digno, sem acrescentar uma ideia de probabilidade.
- source_word: ግሩም
  choice: temível
  rationale: Preserva o sentido de algo que inspira temor reverente, em ligação direta com o medo de Jacó na oração anterior.
- source_word: አንቀጸ፡ ሰማይ
  choice: porta do céu
  rationale: Tradução direta e consagrada da imagem do original, mantendo sua força espacial e teológica.
theological_decisions:
- issue: Identificação do lugar com a casa do Senhor
  choice: “este lugar é a casa do Senhor”
  alternative: “a casa do Senhor está neste lugar”
  rationale: Mantém a predicação forte do texto, sem reduzi-la à mera presença de uma casa no local.
- issue: Força de ዘአኮ፡ ምንትኒ፡ ዘእንበለ
  choice: “não é outra coisa senão”
  alternative: “não é nada menos que”
  rationale: Conserva a identificação exclusiva do lugar, sem intensificação retórica adicional.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A formulação preserva o paralelismo, a repetição de “casa do Senhor” e a progressão entre despertar, reconhecimento e temor.
