  yaml_path: translation/extra_canonical/jubilees/027/024.yaml
  text: And he dreamed that night, and behold, a ladder was set on the earth, and its top reached to heaven. And behold, the angels of God were going up and coming down on it, and behold, God stood upon it.
translation:
  language: pt
  text: 'E naquela noite ele sonhou: eis que uma escada estava colocada sobre a terra, e seu topo alcançava o céu. E eis que os anjos de Deus subiam e desciam por ela, e eis que Deus estava de pé sobre ela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nela”.'
    reason: O ge'ez ውስቴታ pode ser entendido como “sobre ela” ou “nela”; a nota preserva essa ambiguidade espacial.
lexical_decisions:
- source_word: መዓርግ
  choice: escada
  rationale: O termo designa o meio de subida visto no sonho; “escada” é a correspondência natural e tradicional neste contexto.
- source_word: ትክልት
  choice: estava colocada
  rationale: Expressa que a escada se encontrava posta ou erguida sobre a terra, sem acrescentar um agente não declarado.
- source_word: የዐርጉ፡ ወይወርዱ
  choice: subiam e desciam
  rationale: Reproduz diretamente os movimentos opostos e preserva a ordem do texto ge'ez.
- source_word: እግዚአብሔር
  choice: Deus
  rationale: Neste versículo, a designação aparece tanto na expressão “anjos de Deus” quanto para aquele que está de pé; “Deus” mantém a referência uniforme e concorda com o contexto.
- source_word: ውስቴታ
  choice: sobre ela
  rationale: A forma pronominal pode indicar posição nela ou sobre ela. “Sobre ela” acompanha de perto o sentido locativo sem introduzir a ideia menos direta de estar acima dela.
theological_decisions:
- issue: Posição de Deus em relação à escada
  choice: sobre ela
  alternative: nela
  rationale: O ge'ez permite uma relação locativa que não deve ser transformada com segurança em “acima dela”. A tradução principal mantém “sobre ela”, e a nota registra a alternativa mais estritamente interior/locativa.
translation_notes:
  register: Português atual, claro e solene, com a fórmula narrativa “e eis que” preservada por sua função enfática. Emprega-se “por ela” para o movimento dos anjos e “sobre ela” para a posição de Deus, evitando repetição ambígua de “nela” no corpo do versículo.
