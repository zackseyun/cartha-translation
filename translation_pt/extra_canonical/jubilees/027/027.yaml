  text: And behold, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.
translation:
  language: pt
  text: E eis que eu estarei com você e o guardarei por onde quer que você for; e o trarei de volta a esta terra em paz. Pois não o deixarei até que eu tenha feito tudo o que lhe disse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነየ
  choice: E eis que
  rationale: Preserva o valor apresentativo e enfático da abertura, em registro bíblico digno e reconhecível.
- source_word: እዐቅበከ
  choice: o guardarei
  rationale: Expressa a ideia de guardar, proteger e preservar sem restringi-la a uma única forma de cuidado.
- source_word: በኵለን፡ ወእዴ፡ ሖርከ
  choice: por onde quer que você for
  rationale: Verte naturalmente a construção que abrange todos os lugares ou caminhos para os quais o destinatário for.
- source_word: ወአገብአከ
  choice: e o trarei de volta
  rationale: Reproduz o sentido causativo de fazer retornar, adequado ao contexto da promessa de regresso à terra.
- source_word: በሰላም
  choice: em paz
  rationale: Mantém diretamente a noção de paz, segurança e bem-estar presente no termo.
- source_word: ኢየኀድገከ
  choice: não o deixarei
  rationale: Conserva a promessa de não abandonar o destinatário em formulação natural no português atual.
theological_decisions:
- issue: Duração da presença e proteção divinas
  choice: até que eu tenha feito tudo o que lhe disse
  alternative: até eu cumprir tudo o que lhe prometi
  rationale: A opção escolhida preserva a formulação ampla do texto — fazer tudo o que foi dito — sem converter explicitamente cada palavra em uma categoria técnica de promessa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” e os clíticos “o/lhe” para clareza referencial; mantém “eis que” como marca solene da fala divina, sem arcaísmos adicionais.
