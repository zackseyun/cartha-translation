base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/013.yaml
  text: And the person who does any of these things on the Sabbath day shall die, so that the children of Israel may keep according to the commandments of the Sabbaths of the land, as it is written on the tablets that he gave into my hands so that I might write for you the laws of each appointed time according to the divisions of its days.
translation:
  language: pt
  text: E a pessoa que fizer qualquer uma dessas coisas no dia de sábado morrerá, para que os filhos de Israel observem o sábado[a] segundo os mandamentos dos sábados da terra, conforme está escrito nas tábuas que ele me entregou, para que eu escrevesse para você as leis de cada tempo determinado, segundo as divisões de seus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O sábado” está implícito; literalmente, “observem segundo os mandamentos”.
    reason: A tradução explicita o objeto exigido pelo português natural, enquanto a nota preserva a construção e a ambiguidade do texto-fonte.
lexical_decisions:
- source_word: ሰብእ
  choice: a pessoa
  rationale: Expressa o referente humano de modo natural e abrangente em português, sem restringi-lo desnecessariamente a um homem do sexo masculino.
- source_word: ኵሎ፡ ዘእምዝ
  choice: qualquer uma dessas coisas
  rationale: No contexto proibitivo, traduz naturalmente a ideia de fazer algo dentre todas as ações mencionadas anteriormente.
- source_word: በከመ፡ ትእዛዛተ
  choice: segundo os mandamentos
  rationale: Preserva በከመ, que apresenta os mandamentos como a norma segundo a qual o sábado deve ser observado.
- source_word: ሰንበታት፡ ምድር
  choice: os sábados da terra
  rationale: Mantém a formulação concreta e incomum do texto-fonte, sem reinterpretá-la como anos sabáticos ou descanso da terra.
- source_word: ሕገገ
  choice: as leis
  rationale: Reflete a forma plural construta reconhecida na revisão gramatical do texto ge'ez.
- source_word: ጊዜ፡ ወጊዜ
  choice: cada tempo determinado
  rationale: Verte o distributivo idiomático de maneira clara, em harmonia com a referência subsequente às divisões dos dias.
theological_decisions:
- issue: Pena de morte por violar o sábado
  choice: morrerá
  alternative: deverá ser morto
  rationale: O texto afirma literalmente o resultado de morte; a formulação escolhida preserva sua força sem acrescentar um agente executor não expresso.
- issue: Objeto de “observem”
  choice: observem o sábado
  alternative: guardem segundo os mandamentos
  rationale: O sábado é o objeto inferido mais imediato no contexto, mas, por não estar expresso no ge'ez, a explicitação é assinalada em nota para preservar a transparência textual.
- issue: Identidade de quem entregou as tábuas
  choice: ele me entregou
  alternative: Deus me entregou
  rationale: Conserva o pronome do texto-fonte e evita explicitar uma identificação teológica que o versículo deixa contextual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservam-se as expressões marcadas “sábados da terra” e “divisões de seus dias”, evitando paráfrases interpretativas.
