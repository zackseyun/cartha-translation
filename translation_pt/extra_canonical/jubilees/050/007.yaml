  yaml_path: translation/extra_canonical/jubilees/050/007.yaml
  text: Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your children and your male servants and your female servants and all your animals and also the resident foreigner who is with you.
translation:
  language: pt
  text: 'Seis dias vocês farão trabalho, mas o sétimo dia é sábado do SENHOR, seu Deus. Nesse dia não farão trabalho algum: nem vocês, nem seus filhos, nem seus servos, nem suas servas, nem nenhum dos seus animais, nem o estrangeiro que reside entre vocês.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉድክሙ (wəludəkkəmu)
  choice: seus filhos
  rationale: O substantivo plural pode designar filhos ou descendentes de modo coletivo. “Seus filhos” é natural em português, abrange a prole no contexto e preserva a correspondência direta sem acrescentar uma distinção de sexo ausente nesta forma do texto.
- source_word: ሰንበት (sanbat)
  choice: sábado
  rationale: No contexto do sétimo dia de repouso, “sábado” é a equivalência consagrada e mais clara para o leitor de língua portuguesa.
- source_word: ነኪር (nakir)
  choice: estrangeiro
  rationale: O termo indica uma pessoa estrangeira ou de fora; a oração relativa seguinte mostra que se trata daquele que reside junto à comunidade.
- source_word: ግብረ (gəbra)
  choice: trabalho
  rationale: Aqui designa labor ou atividade realizada; “trabalho” reproduz naturalmente tanto a ordem positiva dos seis dias quanto a proibição do sétimo.
theological_decisions:
- issue: Relação do sábado com o SENHOR Deus
  choice: sábado dedicado ao SENHOR, seu Deus
  alternative: sábado do SENHOR, seu Deus
  rationale: A construção genitiva pode ser reproduzida literalmente, mas em português “dedicado ao” comunica com naturalidade que o dia pertence ao SENHOR e lhe é consagrado, sem impor uma interpretação denominacional.
- issue: Abrangência da proibição de trabalho
  choice: trabalho algum
  alternative: nenhum trabalho
  rationale: Ambas as formas expressam a proibição total; “não farão trabalho algum” é idiomática e mantém a força abrangente do original.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega-se “vocês” porque as formas do original são plurais. “SENHOR” representa o título divino na expressão etíope, e a enumeração é mantida com paralelismo claro.
