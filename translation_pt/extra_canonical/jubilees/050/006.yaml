  text: And behold, I have written for you the command concerning the Sabbaths, and all the judgments of its laws.
translation:
  language: pt
  text: E eis que escrevi para você o mandamento acerca dos sábados e todos os juízos de suas leis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዘ፡ ሰንበታትኒ
  choice: o mandamento acerca dos sábados
  rationale: Reproduz a relação entre “mandamento” e o plural “sábados” de modo natural e formal em português.
- source_word: ፍትሓተ
  choice: decisões judiciais
  rationale: Preserva o sentido jurídico de determinações ou juízos, evitando a ideia moderna mais ampla de simples avaliações.
- source_word: ሕገጊሁ
  choice: suas leis
  rationale: O substantivo apresenta forma plural, conforme a evidência lexical indicada; o possessivo retoma os sábados ou o conjunto normativo sabático sem explicitar além da fonte.
theological_decisions:
- issue: Referente do possessivo em “suas leis”
  choice: Manter o possessivo sem explicitar o referente
  alternative: “as leis dos sábados” ou “as leis desse mandamento”
  rationale: A forma fonte admite tensão referencial; explicitá-la resolveria indevidamente uma ambiguidade genuína.
translation_notes:
  register: Português atual, digno e acessível. “E eis que” conserva o marcador enfático da fonte; “você” oferece ampla legibilidade brasileira, e “sábados” permanece em minúscula por ser nome comum em português.
