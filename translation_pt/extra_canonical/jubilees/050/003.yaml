  text: And the land will keep its sabbaths while they dwell upon it, and they will know the year of the jubilee.
translation:
  language: pt
  text: E a terra guardará os seus sábados enquanto eles habitarem nela, e conhecerão o ano do jubileu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታበብት
  choice: guardará
  rationale: O verbo, no contexto da terra e de seus sábados, expressa a observância ou guarda do descanso sabático; “guardará” preserva essa formulação concreta e bíblica.
- source_word: ሰንበታቲሃ
  choice: os seus sábados
  rationale: Mantém o plural e o sufixo possessivo referente à terra, preservando a alusão aos períodos de descanso sabático da terra.
- source_word: በነቢሮቶሙ፡ ዲቤሃ
  choice: enquanto eles habitarem nela
  rationale: Representa a circunstância temporal ligada à habitação deles sobre a terra, em português natural.
- source_word: ዓመተ፡ ለኢዮቤል
  choice: o ano do jubileu
  rationale: Tradução direta da expressão nominal, conservando a terminologia bíblica tradicional e amplamente compreensível.
- source_word: ያእምሩ
  choice: conhecerão
  rationale: Preserva o sentido básico de saber ou conhecer sem especificar indevidamente se se trata de reconhecer, observar ou calcular o ano.
theological_decisions:
- issue: Relação entre a habitação do povo e os sábados da terra
  choice: “enquanto eles habitarem nela”
  alternative: “quando eles habitarem nela”
  rationale: A construção foi mantida com valor temporal durativo, como indicado pelo texto de consulta, sem acrescentar uma explicação sobre obediência, exílio ou restauração.
- issue: Sentido de conhecer o ano do jubileu
  choice: “conhecerão”
  alternative: “reconhecerão” ou “saberão determinar”
  rationale: A tradução conserva a amplitude semântica do verbo e evita resolver uma possível tensão entre mero conhecimento e observância religiosa.
translation_notes:
  register: Português moderno, digno e acessível, com cadência bíblica moderada. Emprega “sábados” no plural por fidelidade ao texto e “jubileu” como termo tradicional consolidado.
