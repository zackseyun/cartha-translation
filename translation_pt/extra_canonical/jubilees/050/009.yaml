base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/009.yaml
  text: You shall do no work at all on the Sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep Sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of the kingdom for all Israel—this day throughout their days, throughout all days.
translation:
  language: pt
  text: Não façam nenhum trabalho no dia de sábado, exceto o que tiverem preparado para si no sexto dia, para comer, beber, descansar, guardar o sábado, abstendo-se de todo trabalho nesse dia, e bendizer o SENHOR, seu Deus, que lhes deu um dia de festa, um dia santo e um dia santo do Reino[a] para todo o Israel — este dia, ao longo dos dias deles[b], por todos os dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um dia do Reino santo”.'
    reason: O adjetivo ge'ez pode qualificar “dia” ou “Reino”, pois ambos os substantivos têm gênero feminino.
  - marker: b
    text: Literalmente, “nos dias deles”; a expressão também pode ter o sentido de “por todas as suas gerações”.
    reason: A nota preserva o possível valor idiomático da expressão, enquanto o texto principal mantém o termo ge'ez “dias”.
lexical_decisions:
- source_word: ሰንበት (sanbat)
  choice: sábado / guardar o sábado
  rationale: O substantivo designa o sábado e, na segunda ocorrência, integra uma construção verbal que exprime observá-lo ou repousar nele. A formulação portuguesa preserva ambos os usos com naturalidade.
- source_word: ግብር (gəbr)
  choice: trabalho
  rationale: Neste contexto de proibição sabática, “trabalho” comunica melhor a atividade vedada do que o sentido mais genérico “obra” ou “ação”.
- source_word: በዓል (baʿal)
  choice: festa
  rationale: O termo indica uma celebração ou festividade; “dia de festa” é corrente e dignificado em português.
- source_word: መዋዕል (mawāʿəl)
  choice: dias
  rationale: Traduz diretamente o termo ge'ez e preserva a repetição deliberada na conclusão, sem substituí-lo silenciosamente por “gerações” ou “para sempre”.
theological_decisions:
- issue: Relação sintática em ዕለተ፡ መንግሥት፡ ቅድስት
  choice: um dia santo do Reino
  alternative: um dia do Reino santo
  rationale: Como “dia” e “reino” são femininos em ge'ez, a forma adjetival “santa” pode relacionar-se a qualquer um deles. O texto principal segue a leitura contextualmente fluida, e a nota preserva a alternativa real sem decidir uma possível nuance teológica.
- issue: Referente de “deles” na frase final
  choice: manter “deles”
  alternative: explicitar “de Israel”
  rationale: O pronome do texto-fonte remete naturalmente a Israel, mas a tradução mantém sua forma pronominal para não acrescentar uma explicitação ausente do original.
translation_notes:
  register: Português moderno, claro e reverente, com legibilidade brasileira e alcance internacional. Emprega-se “vocês” para a segunda pessoa plural e “SENHOR” para o nome divino na tradição editorial bíblica. A sequência de infinitivos foi organizada para deixar claro que comer, beber, descansar, guardar o sábado e bendizer a Deus são finalidades ligadas ao preparo do sexto dia, sem eliminar a cadência acumulativa do original.
