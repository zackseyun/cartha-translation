base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
translation:
  language: pt
  text: 'Por isso, estabeleci para você semanas de anos, anos e jubileus: quarenta e nove jubileus desde os dias de Adão até este dia; ainda restam uma semana, dois anos e quarenta anos para aprender os mandamentos do SENHOR, até que eles atravessem o Jordão e entrem na terra de Canaã, a oeste.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «junto ao Jordão, a oeste».'
    reason: A expressão ge'ez final também admite uma leitura locativa; o texto principal preserva a força verbal de «atravessar» e entende a referência ocidental em relação ao Jordão.
lexical_decisions:
- source_word: ሠራዕኩ
  choice: estabeleci
  rationale: Expressa o ato de ordenar ou instituir períodos, em português natural, sem sugerir apenas uma ordem verbal.
- source_word: ሱባዔ፡ ዓመታት
  choice: semanas de anos
  rationale: Conserva a expressão calendárica do texto-fonte, isto é, unidades de sete anos.
- source_word: ኢዮቤሌዎታት
  choice: jubileus
  rationale: Mantém o termo técnico tradicional para os ciclos jubilares.
- source_word: ርሑቅ
  choice: ainda restam
  rationale: No contexto temporal, comunica que o período mencionado continua distante ou pendente até o acontecimento seguinte.
- source_word: ለእእምሮ
  choice: para aprender
  rationale: Traduz a finalidade ligada ao conhecimento dos mandamentos em linguagem clara, sem acrescentar a ideia específica de mera memorização.
- source_word: የዐድዉ ... ዐዲዎሙ ዮርዳኖሰ
  choice: passem ... atravessando o Jordão
  rationale: Preserva tanto o movimento de entrada na terra como a força verbal do gerúndio referente à travessia do Jordão.
- source_word: ገጸ፡ ዐረቢሁ
  choice: rumo ao oeste
  rationale: Representa literalmente a orientação para a face ou lado ocidental, com formulação idiomática em português.
theological_decisions:
- issue: Designação divina እግዚአብሔር
  choice: SENHOR
  alternative: Senhor
  rationale: A forma em versalete tipográfico simulado por maiúsculas segue a convenção bíblica portuguesa para a designação divina, sem introduzir uma identificação denominacional adicional.
- issue: Estranha soma cronológica de uma semana, dois anos e quarenta anos
  choice: Ainda restam uma semana, dois anos e quarenta anos
  alternative: Ainda restam quarenta e nove anos
  rationale: Mantém separadamente todos os componentes apresentados pelo texto-fonte e preserva sua possível tensão cronológica, em vez de harmonizá-los por cálculo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega “você” para o destinatário singular e “eles” para tornar claro o sujeito plural da entrada em Canaã. A enumeração cronológica e a repetição verbal foram mantidas por fidelidade à estrutura e às tensões do original.
