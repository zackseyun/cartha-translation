  yaml_path: translation/extra_canonical/jubilees/050/001.yaml
  text: And after this law I made known to you the days of the sabbaths in the wilderness of Sinai, which is between Elim and Sinai.
translation:
  language: pt
  text: E, depois dessa lei, dei a conhecer a você os dias dos sábados no deserto do Sinai, que fica entre Elim e o Sinai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, depois disso, dei a conhecer a você a lei dos dias dos sábados no deserto do Sinai, que fica entre Elim e o Sinai”.'
    reason: Preserva a possibilidade menos provável de interpretar «lei» como regente de «dias dos sábados».
lexical_decisions:
- source_word: ሕገ
  choice: dessa lei
  rationale: O substantivo é entendido como complemento da locução «depois de», retomando a lei apresentada anteriormente, e não como estado construto separado de seu complemento pelo verbo.
- source_word: አደለውኩ
  choice: dei a conhecer
  rationale: Expressa de modo natural e digno o sentido causativo de tornar algo conhecido.
- source_word: መዋዕለ፡ ሰንበታት
  choice: os dias dos sábados
  rationale: Mantém o plural do texto e sua referência aos dias sabáticos, sem reduzi-lo simplesmente a «o sábado».
- source_word: በገዳመ፡ ሲና
  choice: no deserto do Sinai
  rationale: ገዳም designa aqui o deserto ou região erma, não o monte Sinai.
- source_word: ምእከለ፡ ኤሎም፡ ወሲና
  choice: entre Elim e o Sinai
  rationale: Reproduz diretamente a localização relativa indicada no ge'ez.
theological_decisions:
- issue: Relação sintática de «lei» com o restante da oração
  choice: «depois dessa lei»
  alternative: «depois disso, dei a conhecer a você a lei dos dias dos sábados»
  rationale: A ordem das palavras e o uso normal da construção favorecem que «lei» retome a legislação anterior; a alternativa é possível, mas sintaticamente menos provável, e por isso é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Emprega «você» para o destinatário singular e conserva a formulação geográfica e o plural «sábados» do texto-fonte.
