base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/002.yaml
  text: And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but its year I did not tell you until the time when you enter the land that you are to possess.
translation:
  language: pt
  text: Eu lhe falei, no monte Sinai, dos sábados da terra, e lhe falei dos anos dos jubileus entre os sábados de anos; mas não lhe falei de seu ano[a] até o tempo em que vocês entrarem na terra da qual tomarão posse.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O ge'ez traz literalmente “seu ano” (de forma elíptica). Pelo contexto, pode referir-se ao ano do jubileu, mas o referente não é explicitado na expressão.
    reason: Preserva no texto a referência possessiva e elíptica do original, ao mesmo tempo que informa a identificação contextual provável sem apresentá-la como lexicalmente expressa.
lexical_decisions:
- source_word: ሰንበታተ፡ ምድር
  choice: sábados da terra
  rationale: Mantém a expressão técnica relativa aos períodos sabáticos da terra, em linguagem reconhecível e próxima da forma ge'ez.
- source_word: ዓመታተ፡ ኢዮቤሌዎኒ
  choice: anos dos jubileus
  rationale: Reproduz o plural do texto-fonte sem reduzi-lo a um único jubileu.
- source_word: ውስተ፡ ሰንበታተ፡ ዓመታት
  choice: entre os sábados de anos
  rationale: Conserva a formulação incomum e a relação estrutural entre jubileus e ciclos sabáticos, sem explicá-la além do texto.
- source_word: ትእኅዙ
  choice: tomarão posse
  rationale: Expressa naturalmente a ideia de adquirir e manter a posse da terra, em vez do sentido moderno mais genérico de simplesmente 'ter'.
theological_decisions:
- issue: Referente de ዓመተሰ ('mas o ano')
  choice: o ano do jubileu
  alternative: o ano / seu ano
  rationale: O contexto imediato aponta para o ano do jubileu, mas a forma ge'ez é elíptica; a nota registra essa concisão para não ocultar a ambiguidade formal.
- issue: Mudança do destinatário singular para o plural
  choice: “lhe falei” para Moisés e “vocês entrarem” para o povo
  alternative: uniformizar tudo no singular
  rationale: 'Preserva a mudança de número do texto-fonte: Moisés é o interlocutor individual, enquanto a entrada e a posse dizem respeito à comunidade.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento singular indireto para Moisés (“lhe”) e plural explícito para a comunidade (“vocês”). A terminologia sabática foi mantida de modo formal por ser conceitualmente importante.
