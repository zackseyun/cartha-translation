revisions:
- from: E o homem que fizer nela qualquer trabalho será morto. Todo homem que profanar este dia, ou que se deitar com uma mulher, ou que falar de algum assunto para realizar nele negócios de compra ou venda, ou que nele tirar água que não tenha preparado para si no sexto dia, ou que levantar qualquer carga para levá-la para fora de sua tenda ou de sua casa, será morto.
  to: E quem fizer nesse dia qualquer trabalho morrerá — todo aquele que profanar este dia, ou se deitar com uma mulher, ou disser que fará nele qualquer coisa a fim de tratar de qualquer compra ou venda, ou tirar nele água que não tenha preparado para si no sexto dia, ou levantar qualquer carga para levá-la para fora de sua tenda ou de sua casa, morrerá.
  rationale: A revisão corrige a cláusula de fala/intenção para refletir que se declara a realização de algo no dia com finalidade de transação comercial. Também usa “morrerá”, que corresponde à fórmula da fonte e da auditoria inglesa sem acrescentar um agente de execução. A enumeração, o teor jurídico, a referência à preparação no sexto dia e a moldura enfática da pena final foram mantidos.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:08:31Z'
review_pass:
  verdict: revise
  source_fidelity: A estrutura enumerativa, as ações proibidas e a repetição conclusiva da pena foram preservadas. Contudo, “falar de algum assunto” não traduz adequadamente a construção que expressa declarar a intenção de fazer algo no dia; além disso, “será morto” introduz mais explicitamente uma execução por agente externo, enquanto a fórmula-fonte e a trilha inglesa dizem simplesmente que a pessoa morrerá.
  naturalness: O texto é em geral claro e de registro jurídico apropriado. A revisão torna a cláusula sobre a declaração de intenção mais idiomática e semanticamente precisa, e substitui o pronome inicialmente sem antecedente explícito por “nesse dia”.
  terminology: “Trabalho”, “profanar”, “deitar-se com uma mulher”, “tirar água” e “carga” são escolhas adequadas. “Compra ou venda” conserva corretamente a alternativa comercial, sem impor que ambas ocorram juntas.
  issues:
  - severity: medium
    issue: A cláusula “ou que falar de algum assunto para realizar nele negócios” altera o ato descrito.
    rationale: O texto-fonte, conforme também refletido na auditoria inglesa, fala de alguém que diz que fará algo no dia com finalidade comercial; não se limita a falar sobre um assunto.
  - severity: low
    issue: “Será morto” explicita uma modalidade de execução não dita de forma inequívoca na fórmula verbal-fonte.
    rationale: “Morrerá” preserva a formulação de pena sem especificar agente, procedimento ou mecanismo da morte.
  revised_text: E quem fizer nesse dia qualquer trabalho morrerá — todo aquele que profanar este dia, ou se deitar com uma mulher, ou disser que fará nele qualquer coisa a fim de tratar de qualquer compra ou venda, ou tirar nele água que não tenha preparado para si no sexto dia, ou levantar qualquer carga para levá-la para fora de sua tenda ou de sua casa, morrerá.
