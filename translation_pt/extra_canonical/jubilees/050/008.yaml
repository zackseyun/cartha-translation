base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/008.yaml
  text: And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do any matter on it so as to do business concerning any buying or selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.
translation:
  language: pt
  text: E quem fizer nesse dia qualquer trabalho morrerá — todo aquele que profanar este dia, ou se deitar com uma mulher, ou disser que fará nele qualquer coisa a fim de tratar de qualquer compra ou venda, ou tirar nele água que não tenha preparado para si no sexto dia, ou levantar qualquer carga para levá-la para fora de sua tenda ou de sua casa, morrerá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: trabalho
  rationale: O substantivo designa obra ou trabalho; neste contexto legal sabático, “trabalho” é a opção portuguesa mais natural e precisa.
- source_word: ይፄምና
  choice: profanar
  rationale: Expressa tornar o dia impuro ou violar sua santidade; “profanar” preserva a força cultual e jurídica.
- source_word: ይስክብ፡ ምስለ፡ ብእሲት
  choice: se deitar com uma mulher
  rationale: Mantém o eufemismo sexual concreto do texto-fonte sem explicitação interpretativa adicional.
- source_word: ሠይጥ፡ ወተሣይጦ
  choice: compra ou venda
  rationale: O par verbal/substantival refere-se às duas faces de uma transação comercial; a formulação evita introduzir uma totalidade não exigida pelo original.
- source_word: ማየ፡ ይቀድሕ
  choice: tirar água
  rationale: Traduz de modo corrente a ação de buscar ou retirar água, sem especificar um recipiente ou uma fonte que o texto não menciona.
- source_word: ዘይጸውር
  choice: qualquer carga
  rationale: Refere-se ao que é levantado para ser transportado; “carga” comunica melhor o sentido contextual do que o abstrato “peso”.
- source_word: ይመት
  choice: será morto
  rationale: Preserva a fórmula jurídica de pena capital, em vez de sugerir apenas morte espontânea com “morrerá”.
theological_decisions:
- issue: Alcance da proibição comercial
  choice: “negócios de compra ou venda”
  alternative: “qualquer compra e venda”
  rationale: A redação conserva a referência ampla às transações sem afirmar que compra e venda precisem ocorrer conjuntamente nem acrescentar uma universalidade enfática.
- issue: Natureza da sanção
  choice: “será morto”
  alternative: “morrerá”
  rationale: O contexto é de prescrição legal e sanção comunitária; a voz passiva comunica isso, sem indicar agente ou procedimento não especificado.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com cadência jurídica adequada ao contexto. A repetição final de “será morto” foi mantida para reproduzir a moldura enfática do versículo. Empregou-se “nela/nele” conforme o referente imediato em português: o dia, entendido no enunciado como período em que as ações são proibidas.'
