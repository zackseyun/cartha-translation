base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/011.yaml
  text: This work alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel with a continual offering, day by day, as a memorial that is acceptable before the LORD, and he will receive them forever, day after day, according as you were commanded.
translation:
  language: pt
  text: Somente este trabalho será feito nos dias de sábado, na casa do santuário do SENHOR, seu Deus, para que façam expiação por Israel com uma oferta contínua[a], dia após dia, como memorial agradável diante do SENHOR. Ele os receberá para sempre, dia após dia, conforme lhe foi ordenado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que façam continuamente expiação por Israel com uma oferta”.'
    reason: A sequência ge'ez permite ligar “continuamente” ao ato de expiação, embora a leitura “oferta contínua” seja favorecida pela presença explícita de “oferta”.
lexical_decisions:
- source_word: ዘግብር፡ ባሕቲቱ
  choice: Somente este trabalho
  rationale: Preserva o substantivo ግብር, “trabalho/obra”, e a força restritiva de ባሕቲቱ, sem reduzir a expressão a “somente isto”.
- source_word: በመዋዕለ፡ ሰንበታት
  choice: nos dias de sábado
  rationale: Representa o plural do texto ge'ez de modo natural em português.
- source_word: በቤተ፡ መቅደሱ
  choice: na casa do santuário
  rationale: Mantém os dois elementos da expressão fonte, “casa” e “santuário”.
- source_word: ያስተስርዩ፡ ዲበ፡ እስራኤል
  choice: fazer expiação por Israel
  rationale: “Fazer expiação” é a formulação portuguesa clara e tradicional para a ação cultual indicada pelo verbo; “por Israel” comunica naturalmente a relação expressa por ዲበ.
- source_word: መባአ፡ ወትረ
  choice: com uma oferta contínua
  rationale: Inclui explicitamente መባአ, “oferta”, e entende ወትረ como qualificando sua continuidade.
- source_word: ለተዝካር
  choice: como memorial
  rationale: Conserva a função memorial da oferta sem ampliar a formulação.
- source_word: ዘይሠጠው፡ ቅድመ፡ እግዚአብሔር
  choice: agradável diante do SENHOR
  rationale: O verbo ሠጠወ exprime ser agradável ou aceitável, não “ser dado”; “agradável” produz uma frase natural e fiel.
- source_word: ወይትወከፎሙ
  choice: Ele os receberá
  rationale: Mantém o objeto plural do verbo e deixa o referente de “os” tão aberto quanto no texto fonte.
- source_word: በከመ፡ ተአዘዝከ
  choice: conforme lhe foi ordenado
  rationale: Reflete a segunda pessoa masculina singular do ge'ez com o pronome cortês e legível “lhe”, sem identificar além do que o contexto fornece.
theological_decisions:
- issue: Referente do objeto plural em “Ele os receberá”
  choice: Manter “os” sem explicitação
  alternative: Explicitar “as ofertas” ou “os israelitas”
  rationale: O sufixo pronominal plural permite tensão referencial; identificar seu antecedente resolveria uma ambiguidade que o texto não resolve claramente.
- issue: Relação de “contínua” com a frase anterior
  choice: Ligar o termo à oferta
  alternative: Traduzir “por Israel continuamente”
  rationale: A presença explícita de መባአ, “oferta”, favorece “oferta contínua”, mas a proximidade sintática permite registrar a outra ligação em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “SENHOR” representa o título divino; a sintaxe foi levemente reorganizada para fluidez, sem apagar repetições, referentes incertos ou linguagem cultual.
