review_pass:
  verdict: revise
  source_fidelity: 'O texto preserva adequadamente os elementos centrais do ge''ez: «trabalho» com a restrição «somente», os dias de sábado, a casa do santuário, a expiação por Israel, a oferta contínua, o memorial aceitável diante do SENHOR, a recepção no futuro e a repetição «dia após dia». A ambiguidade do objeto plural em «Ele os receberá» é prudentemente mantida.'
  naturalness: 'A construção «será feito ...: fazer expiação» é sintaticamente defeituosa em português: o infinitivo após os dois-pontos não se articula como finalidade do verbo passivo. A finalidade deve ser expressa por «para que façam expiação», conservando o sujeito plural não expresso do original.'
  terminology: «SENHOR», «expiação», «oferta», «memorial» e «agradável diante do SENHOR» são escolhas adequadas, naturais e de registro cultual sóbrio. «Casa do santuário» mantém a duplicação lexical da fonte e é aceitável.
  issues:
  - severity: medium
    issue: Finalidade expressa por construção sintaticamente inadequada
    rationale: '«Somente este trabalho será feito ...: fazer expiação por Israel» justapõe um infinitivo sem conexão gramatical clara ao predicado passivo. O ge''ez e o audit trail inglês expressam finalidade («so that they may make atonement»); «para que façam expiação» a comunica naturalmente sem especificar o sujeito.'
  revised_text: Somente este trabalho será feito nos dias de sábado, na casa do santuário do SENHOR, seu Deus, para que façam expiação por Israel com uma oferta contínua[a], dia após dia, como memorial agradável diante do SENHOR. Ele os receberá para sempre, dia após dia, conforme lhe foi ordenado.
