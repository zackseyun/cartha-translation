  revision_rationale: A revisão limita-se a reparar a sintaxe e a explicitar a relação de finalidade já presente no original, sem alterar o sentido, os termos cultuais, a repetição temporal nem a ambiguidade de «os». A nota é ajustada para acompanhar a nova oração final e continuar registrando a alternativa de escopo de «continuamente».
