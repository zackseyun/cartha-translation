  to: Somente este trabalho será feito nos dias de sábado, na casa do santuário do SENHOR, seu Deus, para que façam expiação por Israel com uma oferta contínua[a], dia após dia, como memorial agradável diante do SENHOR. Ele os receberá para sempre, dia após dia, conforme lhe foi ordenado.
