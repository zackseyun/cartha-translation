    rationale: O ge'ez ለመዋዕለ፡ ወለሰንበታት corresponde a «para os dias e para os sábados» (como o inglês auditado «for the days and for the sabbaths»). «Nos dias e nos sábados» altera a relação para uma circunstância temporal. «Para os dias e os sábados» conserva a formulação difícil sem resolver sua referência cultual.
  - severity: low
    issue: Redundância em «trabalho próprio da atividade humana»
    rationale: A expressão tenta verter «trabalho pertencente ao labor dos filhos dos homens», mas «trabalho» e «atividade» ficam semanticamente sobrepostos. «Trabalho ligado ao labor dos seres humanos» é mais natural e preserva a relação expressa no original.
