base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/010.yaml
  text: 'For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.'
translation:
  language: pt
  text: 'Pois grande é a honra que o SENHOR concedeu a Israel: comer, beber e ficar satisfeito neste dia de festa, e nele descansar de todo trabalho ligado ao labor dos seres humanos, exceto queimar incenso e apresentar uma oferta e um sacrifício diante do SENHOR, para os dias e os sábados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ፡ ክብር
  choice: grande é a honra
  rationale: Reproduz diretamente a ideia de grandeza e honra, mantendo a ênfase inicial da oração.
- source_word: ለጸጊብ
  choice: ficar satisfeito
  rationale: Expressa saciedade após comer e beber em linguagem portuguesa natural.
- source_word: በዓል
  choice: dia de festa
  rationale: No contexto, designa um dia festivo ou celebração, não apenas uma festa em sentido social.
- source_word: ግብር፡ ዘእምግብረ፡ እጓለ፡ እመሕያው
  choice: trabalho próprio da atividade humana
  rationale: Conserva a formulação abrangente sobre o trabalho dos seres humanos sem recorrer ao pouco natural 'filhos dos homens'.
- source_word: ዕጣን፡ ዕጣን
  choice: queimar incenso
  rationale: A repetição etíope parece representar a expressão ritual vertida na edição consultada como a ação de oferecer ou queimar incenso.
- source_word: ቍርባን፡ ወመሥዋዕት
  choice: uma oferta e um sacrifício
  rationale: Mantém distintos os dois termos cultuais, sem harmonizá-los.
- source_word: ለመዋዕለ፡ ወለሰንበታት
  choice: nos dias e nos sábados
  rationale: Preserva a coordenação e a formulação temporal do texto, embora a relação exata com o contexto cultual seja pouco explícita.
theological_decisions:
- issue: Escopo da exceção ao descanso
  choice: A exceção abrange queimar incenso e apresentar oferta e sacrifício.
  alternative: Entender a frase como referência geral aos deveres sacerdotais, explicitando-os na tradução.
  rationale: O texto enumera atos cultuais concretos; a tradução os conserva sem acrescentar uma limitação explícita aos sacerdotes.
- issue: Expressão final sobre dias e sábados
  choice: Manter literalmente 'nos dias e nos sábados'.
  alternative: Interpretar como 'nos dias de semana e nos sábados' ou 'nos dias e nas festas sabáticas'.
  rationale: A construção é difícil e não convém resolver na tradução uma ambiguidade que o texto transmitido preserva.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com preferência por sintaxe clara. O título divino é grafado como SENHOR, em continuidade com a camada de consulta, e a terminologia cultual permanece formal sem soar arcaica.
