revisions:
- from: E os jubileus passarão até que Israel seja purificado de toda culpa de imoralidade sexual, impureza, contaminação, pecado e erro, e habite em segurança por toda a terra. Então já não haverá para eles satanás algum nem malfeitor algum, e a terra ficará pura desde aquele tempo para sempre.
  to: E os jubileus passarão até que Israel seja purificado de toda culpa de imoralidade sexual, impureza, contaminação, pecado e erro, e habite em segurança em toda a terra; e já não haverá entre eles satanás algum nem malfeitor algum, e a terra ficará pura desde aquele tempo para sempre.
  rationale: A revisão limita-se a ajustar o locativo da habitação e a formulação portuguesa da ausência de satanás e de um ser mau. Mantêm-se a estrutura, a enumeração, a ambiguidade de «satanás» e o caráter permanente da purificação da terra.
