base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/005.yaml
  text: And the jubilees will pass until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in confidence in all the land; and there will no longer be for them any satan or any evil one, and the land will be clean from that time forever.
translation:
  language: pt
  text: E os jubileus passarão até que Israel seja purificado de toda culpa de imoralidade sexual, impureza, contaminação, pecado e erro, e habite em segurança em toda a terra; e já não haverá entre eles satanás algum nem malfeitor algum, e a terra ficará pura desde aquele tempo para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Expressa em português atual o campo semântico de conduta sexual ilícita, evitando restringir o termo apenas à prostituição ou ao adultério.
- source_word: ርኵስ
  choice: impureza
  rationale: Preserva a linguagem de impureza do texto, sem decidir se o sentido é exclusivamente ritual ou moral.
- source_word: ግማኔ
  choice: contaminação
  rationale: Mantém a ideia de poluição ou profanação e a distingue de “impureza” na enumeração.
- source_word: ይትአመን
  choice: habite em segurança
  rationale: Reproduz a noção de viver com confiança ou segurança, com formulação natural em português.
- source_word: ሰይጣነ
  choice: satanás algum
  rationale: Conserva o substantivo do texto sem impor aqui, por meio de maiúscula, que se trate necessariamente do nome próprio de uma única figura.
- source_word: እኩየ
  choice: malfeitor algum
  rationale: Representa o ser ou agente mau mencionado em paralelo com “satanás”, sem reduzir a expressão à ideia abstrata de mal.
theological_decisions:
- issue: Sentido de “satanás”
  choice: satanás algum
  alternative: Satanás
  rationale: A forma indefinida do contexto permite entender um adversário ou acusador; a tradução evita resolver a ambiguidade como referência obrigatória ao nome próprio.
- issue: Natureza da purificação de Israel
  choice: purificado de toda culpa de imoralidade sexual, impureza, contaminação, pecado e erro
  alternative: purificado de toda imoralidade sexual...
  rationale: Mantém “culpa” como termo regente da lista e preserva juntas as dimensões morais e de pureza sem harmonizá-las.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A enumeração e a tensão entre pureza ritual, culpa moral e segurança escatológica foram preservadas.
