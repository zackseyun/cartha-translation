base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/012.yaml
  text: And every person who does work on it, or goes on a journey, or tills his field, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—
translation:
  language: pt
  text: E toda pessoa que nele fizer algum trabalho, ou sair em viagem, ou cultivar seu campo, seja em casa, seja em qualquer lugar; ou acender fogo; ou montar em algum animal; ou viajar de navio pelo mar; ou ferir ou matar alguma coisa; ou abater um animal ou uma ave; ou capturar um animal selvagem, uma ave ou um peixe; ou jejuar; ou guerrear no dia de sábado—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ
  choice: algum trabalho
  rationale: Expressa de modo natural o sentido geral de trabalho ou atividade realizada no sábado.
- source_word: ወፍረ
  choice: cultivar seu campo
  rationale: O contexto indica trabalho agrícola; “campo” preserva maior precisão lexical do que “fazenda”.
- source_word: ይጼአን፡ ዲበ፡ ኵሉ፡ እንስሳ
  choice: montar em algum animal
  rationale: Traduz a construção referente a subir ou cavalgar sobre um animal em português corrente.
- source_word: ይነግድ፡ በሐመር፡ ባሕረ
  choice: viajar de navio pelo mar
  rationale: No contexto, o verbo descreve deslocamento marítimo em embarcação, sem exigir a ideia comercial de negociar.
- source_word: የሐርድ
  choice: abater
  rationale: Distingue o abate de animais da menção anterior mais geral a ferir ou matar.
- source_word: አሰገረ
  choice: capturar
  rationale: Representa a ação de apanhar animais selvagens, aves ou peixes sem especificar um método.
- source_word: ይገብር፡ ጸብአ
  choice: guerrear
  rationale: Forma verbal clara e concisa para a expressão “fazer guerra”.
theological_decisions:
- issue: Referente do pronome em “nele”
  choice: nele
  alternative: no sábado
  rationale: Mantém a ligação anafórica com o sábado estabelecido no contexto, sem inserir repetição ausente nesta oração.
- issue: Força normativa da enumeração
  choice: preservar a sequência coordenada e o travessão final
  alternative: encerrar como uma proibição completa com ponto final
  rationale: O versículo integra uma sentença que prossegue; o travessão sinaliza a continuidade sem completar ou interpretar antecipadamente a sanção.
- issue: Jejum no sábado
  choice: ou jejuar
  alternative: ou praticar jejum
  rationale: Preserva diretamente uma disposição potencialmente tensa do texto, sem harmonizá-la com práticas confessionais posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A longa enumeração foi pontuada com ponto e vírgula para clareza, preservando sua estrutura cumulativa e a continuidade sintática no fim do versículo.
