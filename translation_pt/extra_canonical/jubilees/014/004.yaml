  source_fidelity: 'O sentido é fiel: o herdeiro é aquele que procede do próprio corpo do interlocutor, e Deus o leva para fora e ordena que olhe. Contudo, «herdará de você» enfraquece a construção direta «herdará você»/«será seu herdeiro» e pode soar como se herdasse algo vindo de Deus, não como herdeiro de Abrão.'
