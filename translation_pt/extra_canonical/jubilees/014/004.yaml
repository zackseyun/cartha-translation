lexical_decisions:
- source_word: ዘይወፅእ፡ እምከርሥከ
  choice: aquele que sair do seu próprio ventre
  rationale: Reproduz a imagem concreta do ge'ez, literalmente ligada ao ventre/interior do corpo, sem reduzir a expressão apenas a ‘descendente’.
- source_word: ይወርሰከ
  choice: herdará de você
  rationale: Expressa de modo natural em português a ideia de receber a herança do interlocutor, preservando a relação verbal direta presente no texto.
- source_word: አውፅኦ፡ አፍአ
  choice: o levou para fora
  rationale: Verte com clareza o movimento causativo indicado pelo ge'ez.
- source_word: ነጽር
  choice: Olhe
  rationale: Imperativo corrente e direto, adequado ao início da ordem que continua no versículo seguinte.
theological_decisions:
- issue: Identidade e função daquele que procede do ventre de Abrão
  choice: Manter a formulação concreta ‘aquele que sair do seu próprio ventre’ e a ação de herdar
  alternative: Explicitar ‘seu filho biológico será o seu herdeiro’
  rationale: A alternativa acrescentaria uma identificação e uma formulação jurídica mais explícitas do que o segmento ge'ez oferece.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de ‘você’ para boa legibilidade brasileira. O trecho termina deliberadamente em ‘Olhe’, acompanhando o recorte incompleto do versículo fornecido.
