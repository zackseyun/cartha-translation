base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/014/001.yaml
  text: And after this new moon[a], in the fourth year of this week, on the new moon of the third month, the word of the LORD came to Abram in a dream, saying, “Do not fear, Abram; I am your protector, and your reward will be very great.”
translation:
  language: pt
  text: 'Depois dessas coisas, no quarto ano desta semana, na lua nova[a] do terceiro mês, a palavra do SENHOR veio a Abrão em sonho, dizendo: “Não tenha medo, Abrão. Eu sou o seu protetor, e a sua recompensa será muito grande.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo ge'ez pode significar “ao nascer”, “ao amanhecer” ou “no início”; no sistema calendárico de Jubileus, frequentemente indica a lua nova, isto é, o início do mês.
    reason: cultural_note
lexical_decisions:
- source_word: ነገር (nagar)
  choice: coisas
  rationale: No contexto da fórmula narrativa, o termo significa ‘coisa/acontecimento’; o plural idiomático ‘depois dessas coisas’ é natural em português e corresponde ao sentido, sem confundi-lo com a expressão calendárica seguinte.
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ (ba-śarqa śālis warḥ)
  choice: na lua nova do terceiro mês
  rationale: Śarqa pode indicar o começo, o nascer ou a aurora; no sistema calendárico de Jubileus, nesta construção, designa o início do mês, entendido como lua nova.
- source_word: ቃለ፡ እግዚአብሔር (qāla ʾEgziʾabəḥer)
  choice: a palavra do SENHOR
  rationale: Mantém a fórmula bíblica tradicional e traduz o nome divino com versalete convencional.
- source_word: ሞገስከ (mogasəka; continuação textual atestada do versículo)
  choice: o seu protetor
  rationale: Expressa a função de defesa e amparo indicada pelo termo no contexto da promessa divina.
- source_word: ዐስብከ፡ ዐቢይ፡ ጥቀ (ʿaśbəka ʿabiy ṭəqa; continuação textual atestada do versículo)
  choice: a sua recompensa será muito grande
  rationale: Reproduz diretamente a promessa final do versículo e conserva o grau intensivo.
theological_decisions:
- issue: Relação entre Deus, proteção e recompensa
  choice: “Eu sou o seu protetor, e a sua recompensa será muito grande”
  alternative: “Eu sou o seu escudo; a sua recompensa será muito grande”
  rationale: ‘Protetor’ comunica claramente a função atribuída a Deus sem impor a metáfora específica de ‘escudo’ quando o testemunho ge'ez sustenta uma expressão funcional.
- issue: Forma do nome divino
  choice: SENHOR
  alternative: Iahweh
  rationale: A convenção ‘SENHOR’ preserva o uso reverente amplamente reconhecido em português e não introduz uma vocalização discutida do tetragrama.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega tratamento em terceira pessoa (‘seu/sua’) na fala dirigida a Abrão. A fórmula temporal distingue corretamente ‘depois dessas coisas’ da indicação calendárica ‘na lua nova do terceiro mês’. A transcrição fornecida no pedido termina em ‘Eu sou...’, mas a continuação do versículo, confirmada pela evidência de revisão e pela tradição textual usada na edição, foi preservada na tradução.
