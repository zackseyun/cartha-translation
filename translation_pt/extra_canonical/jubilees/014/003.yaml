  text: Eliezer—he will inherit me, and to me you have not given seed.” And he said to him, “This one will not inherit you,”
translation:
  language: pt
  text: '“Eliezer — ele me herdará, e não me deste descendência.” E ele lhe disse: “Este não te herdará,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኤሊኤዜር፡ ውእቱ፡
  choice: É Eliezer quem
  rationale: Representa o nome explícito e o pronome enfático do ge'ez em português natural, sem omitir a ênfase.
- source_word: ይወርሰኒ፡
  choice: me herdará
  rationale: Mantém a formulação concreta e incomum do texto-fonte, em vez de explicá-la como simples sucessão patrimonial.
- source_word: ዘርአ፡
  choice: descendência
  rationale: Expressa o sentido de 'semente' como posteridade humana de modo claro e digno no português atual.
- source_word: ኢይወርስከዝ፡
  choice: Este não herdará você
  rationale: Conserva o demonstrativo e o objeto pessoal da expressão original, bem como o paralelismo com a fala anterior.
theological_decisions:
- issue: Sentido de 'herdar' uma pessoa
  choice: Preservar literalmente 'me/você herdará'
  alternative: Explicitar 'será meu/seu herdeiro' ou 'herdará meus/seus bens'
  rationale: A expressão do texto-fonte é concisa e potencialmente mais ampla que a posse dos bens; a tradução não deve resolver silenciosamente essa tensão.
- issue: Relação lógica entre falta de descendência e Eliezer como herdeiro
  choice: Usar 'pois'
  alternative: Manter coordenação simples com 'e'
  rationale: O segundo enunciado apresenta a razão contextual para Eliezer herdar; 'pois' torna a relação inteligível sem acrescentar conteúdo substantivo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção enfática natural. A pontuação final indica que o versículo termina no meio da fala e continua no contexto seguinte.
