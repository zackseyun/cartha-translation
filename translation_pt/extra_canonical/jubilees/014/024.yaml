base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/014/024.yaml
  text: Sarah took Hagar, her maidservant, the Egyptian, and gave her to Abram her husband as a wife. And he went in to her, and she conceived and bore a son, and he called his name Ishmael, in the fifth year of this week; and that year was the eighty-sixth year in Abram’s life.
translation:
  language: pt
  text: Sara tomou Agar, sua serva egípcia, e a deu a Abrão, seu marido, para que fosse sua mulher. Ele teve relações com ela, e ela concebeu e deu à luz um filho. Ele lhe deu o nome de Ismael, no quinto ano daquela semana; e esse ano era o octogésimo sexto ano da vida de Abrão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ
  choice: mulher
  rationale: O termo pode designar «mulher» ou «esposa». «Sua mulher» conserva a formulação relacional do texto e evita impor uma classificação jurídica mais específica.
- source_word: ወቦአ፡ ኀቤሃ
  choice: Ele teve relações com ela
  rationale: A expressão idiomática significa literalmente que ele «entrou até ela»; a tradução explicita em português atual e digno o sentido sexual do eufemismo.
- source_word: ይስማዔል
  choice: Ismael
  rationale: Emprega-se a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ሰብዐ
  choice: semana
  rationale: Mantém a unidade cronológica própria do livro, um período de sete anos, sem substituí-la interpretativamente por «septênio» no texto.
theological_decisions:
- issue: Condição de Agar em relação a Abrão
  choice: para que fosse sua mulher
  alternative: para que fosse sua esposa
  rationale: O texto-fonte a apresenta como «mulher» de Abrão, mas não desenvolve aqui uma distinção técnica entre esposa e concubina; a escolha preserva essa tensão sem importar uma classificação confessional ou jurídica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. A sintaxe foi dividida em frases para facilitar a leitura, sem omitir a identificação de Abrão como marido de Sara nem os dados cronológicos.
