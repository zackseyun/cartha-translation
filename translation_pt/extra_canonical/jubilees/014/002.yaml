  text: and your reward will be exceedingly great.” And he said[a], “Lord, Lord, what will you give me? For I go childless, and the son of Maseq, the son of my maidservant, is Damascus."”
translation:
  language: pt
  text: '“Permanece firme, e a tua recompensa será extremamente grande.” E ele disse: “Senhor, Senhor, que me darás? Pois ando sem filhos, e o filho de Maseq, filho da minha serva, é Damasco.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O final do texto ge'ez é incomumente condensado e diz literalmente “é Damasco”, sem mencionar o nome Eliezer. A passagem paralela em Gênesis 15:2 associa o herdeiro doméstico a Eliezer de Damasco.
    reason: Explica a dificuldade textual e a provável referência sem inserir no texto principal um nome ausente do ge'ez.
lexical_decisions:
- source_word: ዐስብከ፡ ይፈደፍድ፡ ጥቀ
  choice: a tua recompensa será extremamente grande
  rationale: Reproduz o sentido intensivo da expressão ge'ez, mantendo a segunda pessoa do singular e uma formulação natural e solene em português.
- source_word: አሐውር፡ ዘእንበለ፡ ውሉድ
  choice: eu sigo sem filhos
  rationale: Mantém o verbo de movimento, literalmente próximo de 'vou/caminho', sem tornar a frase artificial; 'sem filhos' expressa diretamente a condição indicada.
- source_word: ወወልደ፡ ማሴቅ፡ ወልደ፡ አመትየ
  choice: e o filho de Maseq, filho da minha serva
  rationale: Conserva a cadeia genealógica e a repetição de 'filho' presentes no texto, sem harmonizá-la com outra versão da narrativa.
- source_word: ውእቱ፡ ደማስቆስ
  choice: é Damasco
  rationale: Traduz a cópula e o nome efetivamente presentes no ge'ez, sem acrescentar 'Eliezer' nem converter a cópula em demonstrativo.
theological_decisions:
- issue: Identidade do herdeiro doméstico mencionado no final do versículo
  choice: Manter a leitura ge'ez 'é Damasco' no texto principal
  alternative: Acrescentar 'Eliezer' com base em Gênesis 15:2 ou verter a expressão como 'este Eliezer de Damasco'
  rationale: O texto ge'ez fornecido omite o nome 'Eliezer'. Acrescentá-lo resolveria por harmonização uma formulação textual difícil que deve permanecer visível ao leitor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se o tratamento singular “tu” no diálogo com o Senhor e a estranheza deliberada da cláusula final.
