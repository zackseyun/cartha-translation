  text: And Abram rejoiced, and he told this whole matter to Sarai his wife, and he believed that he would have offspring, though she was not bearing. And Sarai advised Abram her husband and said to him, “Go in to Hagar, my Egyptian maidservant; perhaps I may build up offspring for you from her.” And Abram listened to the voice of Sarai his wife and said to her, “Do so.” And she took her,
translation:
  language: pt
  text: 'Abrão se alegrou e contou todo esse assunto a Sarai, sua mulher. Ele creu que teria descendência, embora ela não desse à luz. Então Sarai aconselhou Abrão, seu marido, dizendo-lhe: “Tenha relações com Agar, minha serva egípcia; talvez eu possa formar para você uma descendência por meio dela.” Abrão deu ouvidos à voz de Sarai, sua mulher, e lhe disse: “Faça assim.” E ela a tomou,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእ፡ / ዘርአ፡
  choice: descendência
  rationale: O termo significa literalmente “semente”, mas neste contexto designa descendentes; “descendência” é natural em português e mantém o sentido coletivo.
- source_word: ባእ፡ ኀበ፡ አጋር፡
  choice: Tenha relações com Agar
  rationale: A expressão literalmente significa “entre/vá para junto de Agar” e funciona como eufemismo sexual; a formulação escolhida comunica o sentido em português moderno sem vulgaridade.
- source_word: አሐንጽ፡
  choice: formar
  rationale: O verbo apresenta a imagem de edificar ou construir. “Formar uma descendência” preserva o núcleo da metáfora em linguagem portuguesa compreensível.
- source_word: ወሰምዐ፡ ... ቃለ፡
  choice: deu ouvidos à voz
  rationale: Mantém a expressão semítica de ouvir no sentido de atender ou obedecer, sem reduzir o enunciado simplesmente a “obedeceu”.
- source_word: ወሥአታ፡
  choice: E ela a tomou consigo
  rationale: A forma verbal contém sujeito feminino singular implícito e objeto feminino singular; a tradução conserva ambos os pronomes e o caráter incompleto da oração no fim do versículo.
theological_decisions:
- issue: A promessa de descendência apesar da infertilidade de Sarai
  choice: “Ele creu que teria descendência, mas ela não dava à luz”
  alternative: “Ele creu que teria descendência, embora ela fosse estéril”
  rationale: A escolha preserva o aspecto verbal do original, que diz que ela não estava dando à luz, sem transformar a descrição em diagnóstico permanente nem eliminar a tensão narrativa.
- issue: Estratégia de Sarai para obter descendência por meio de Agar
  choice: “talvez eu possa formar para você uma descendência por meio dela”
  alternative: “talvez eu tenha filhos por meio dela”
  rationale: A formulação não acrescenta uma avaliação moral ou doutrinária e conserva tanto a finalidade da proposta quanto a imagem construtiva do verbo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Empregou-se “você” na fala para naturalidade internacional com boa recepção no Brasil. A última vírgula foi mantida porque a oração prossegue no versículo seguinte.
