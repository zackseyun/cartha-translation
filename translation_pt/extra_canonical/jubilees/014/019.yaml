  yaml_path: translation/extra_canonical/jubilees/014/019.yaml
  text: On that day the LORD made a covenant with Abram, saying, “To your offspring I will give this land, from the river of Egypt to the great river, the river Euphrates.”
translation:
  language: pt
  text: 'Naquele dia, o SENHOR fez uma aliança com Abrão, dizendo: “À sua descendência darei esta terra, desde o rio do Egito até o grande rio, o rio Eufrates.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተካየደ፡ ኪዳነ
  choice: fez uma aliança
  rationale: Expressa em português natural a fórmula de estabelecimento de uma aliança, sem alterar sua força jurídica e teológica.
- source_word: ለዘርእከ
  choice: à sua descendência
  rationale: O substantivo coletivo indica a linhagem de Abrão; “descendência” preserva o valor coletivo e soa mais natural do que “semente” neste contexto.
- source_word: እምፈለገ፡ ግብጽ
  choice: desde o rio do Egito
  rationale: Mantém literalmente a designação geográfica do texto, sem identificar o curso d’água com um rio moderno específico.
- source_word: ፈለገ፡ ዐቢይ፡ ፈለገ፡ ኤውፍራጢስ
  choice: o grande rio, o rio Eufrates
  rationale: Conserva a repetição explicativa e a ênfase geográfica do original.
theological_decisions:
- issue: Destinatário da promessa territorial
  choice: “à sua descendência” como expressão coletiva
  alternative: “à sua semente” ou “aos seus descendentes”
  rationale: A opção mantém a unidade coletiva do termo e não restringe antecipadamente sua interpretação teológica a um indivíduo ou a uma pluralidade explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “SENHOR” representa o nome divino segundo a convenção bíblica portuguesa; a estrutura da promessa e a repetição geográfica foram preservadas.
