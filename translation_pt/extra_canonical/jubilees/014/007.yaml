  text: And he said to him, “I am the LORD who brought you out from Ur of the Chaldeans, so that I might give you this land to inherit it.”
translation:
  language: pt
  text: 'E ele lhe disse: “Eu sou o SENHOR, que tirou você de Ur dos caldeus para lhe dar esta terra como herança.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: SENHOR
  rationale: Representa o nome divino segundo a convenção bíblica portuguesa, em harmonia com o contexto de Gênesis 15:7.
- source_word: ዘአውፃእኩከ
  choice: que tirou você
  rationale: Expressa de modo natural a oração relativa e o ato de fazer Abraão sair de Ur.
- source_word: ኡር፡ ዘከለዳዊያን
  choice: Ur dos caldeus
  rationale: Forma bíblica corrente e correspondência direta da construção ge'ez.
- source_word: ምድረ፡ ዛቲ
  choice: esta terra
  rationale: A leitura completa do verso em Charles 1895 inclui o demonstrativo, embora o trecho fornecido esteja truncado após 'terra'.
- source_word: ትረሳ
  choice: como herança
  rationale: Conserva a ideia final de receber a terra por herança em português claro, sem a formulação menos natural 'para herdá-la' após 'dar'.
theological_decisions:
- issue: Identificação do nome divino
  choice: SENHOR
  alternative: Senhor
  rationale: A caixa-alta sinaliza a designação divina tradicional sem inserir uma vocalização específica do tetragrama.
- issue: Finalidade da dádiva da terra
  choice: para lhe dar esta terra como herança
  alternative: para lhe dar esta terra, a fim de que você a herdasse
  rationale: Preserva tanto a dádiva divina quanto a noção de herança, evitando resolver além do necessário a relação semântica entre dar e herdar.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Emprega 'você' para o singular, sem coloquialismo excessivo, e mantém a cadência bíblica.
