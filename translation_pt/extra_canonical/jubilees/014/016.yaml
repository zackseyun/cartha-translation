  source_fidelity: 'A tradução preserva a sequência e os elementos centrais do ge''ez: ida aos pais/antepassados, em paz, e sepultamento em idade avançada favorável. Contudo, «numa boa velhice» é pouco idiomático e soa como uma situação em que o sepultamento ocorre, em vez de expressar claramente a idade avançada alcançada.'
  naturalness: «Mas você irá para junto de seus pais em paz e será sepultado numa boa velhice» é compreensível, mas «numa boa velhice» não é uma formulação portuguesa natural neste contexto. «Em boa velhice» é conciso, digno e preserva o registro bíblico sem criar essa ambiguidade sintática.
