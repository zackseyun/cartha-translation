  text: But you will go to your fathers in peace, and you will be buried at a good old age.
translation:
  language: pt
  text: Mas você irá para junto de seus pais em paz e será sepultado em boa velhice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐውር፡ ኀበ፡ አበዊከ
  choice: irá para junto de seus pais
  rationale: Reproduz a expressão ancestral do texto, sem substituí-la por uma explicação como “morrerá”; “para junto de” soa natural em português e preserva seu caráter figurado.
- source_word: በሰላም
  choice: em paz
  rationale: Equivalência direta e idiomática, preservando a ideia de uma partida tranquila.
- source_word: ወትትቀበር
  choice: e será sepultado
  rationale: Mantém a forma passiva e o sentido concreto de receber sepultura.
- source_word: በርእስ፡ ሠናይ
  choice: numa boa velhice
  rationale: A expressão corresponde à ideia de idade avançada e favorável; esta formulação é digna e natural em português bíblico contemporâneo.
theological_decisions:
- issue: Sentido de “ir para junto de seus pais”
  choice: Preservar a expressão figurada ancestral
  alternative: Explicitar como “morrerá” ou interpretar como reunião consciente com os antepassados
  rationale: O texto afirma figuradamente a partida para os pais, mas não define aqui com precisão o estado dos mortos; conservar a imagem evita resolver além da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O pronome “você” acompanha o tratamento direto e acessível do projeto; “sepultado” mantém registro bíblico sem arcaísmo excessivo.
