  text: And that day passed, and Abram offered up the pieces and the birds and their grain offerings and their drink offerings, and fire consumed them.
translation:
  language: pt
  text: E aquele dia passou. Abrão ofereceu os pedaços, as aves, suas ofertas de cereal[a] e suas ofertas de bebida, e o fogo os consumiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seus sacrifícios».'
    reason: O termo etíope pode ter o sentido mais amplo de oferta ou sacrifício, embora o paralelismo cultual com as ofertas de bebida favoreça aqui «ofertas de cereal».
lexical_decisions:
- source_word: አዕረገ
  choice: ofereceu
  rationale: Embora o verbo tenha o sentido básico de fazer subir, no contexto sacrificial ele indica apresentar ou oferecer sobre o altar; «ofereceu» comunica naturalmente essa função em português.
- source_word: ክፍላተ
  choice: os pedaços
  rationale: Preserva a referência concreta às partes dos animais divididos no contexto imediato, sem acrescentar uma identificação ausente do versículo.
- source_word: መሥዋዕቶሙ
  choice: suas ofertas de cereal
  rationale: No par cultual com ሞጻሕቶሙ, a expressão corresponde mais provavelmente às ofertas de cereal que acompanhavam as vítimas, evitando a redundância de «os pedaços, as aves e seus sacrifícios»; a possibilidade lexical mais ampla é registrada em nota.
- source_word: ሞጻሕቶሙ
  choice: suas ofertas de bebida
  rationale: Expressa em linguagem corrente as libações derramadas no culto, mantendo o paralelismo com «ofertas de cereal».
- source_word: በልዐቶሙ፡ እሳት
  choice: o fogo os consumiu
  rationale: Traduz idiomaticamente a imagem literal de o fogo os comer, sem especificar a origem do fogo, que o texto não declara aqui.
theological_decisions:
- issue: Origem ou caráter do fogo
  choice: o fogo os consumiu
  alternative: um fogo vindo de Deus os consumiu
  rationale: O texto menciona apenas fogo e não explicita neste versículo que ele veio de Deus; a tradução evita acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com terminologia cultual compreensível. Preferiu-se «ofertas de bebida» a «libações» para maior acessibilidade, e manteve-se «Abrão» conforme a forma do nome neste ponto da narrativa.
