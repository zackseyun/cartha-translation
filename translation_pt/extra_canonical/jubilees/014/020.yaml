  yaml_path: translation/extra_canonical/jubilees/014/020.yaml
  text: the Kenites, and the Kenizzites, and the Kadmonites, and the Perizzites, and the Rephaim, and the Rakites[a], and the Avvites, and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: pt
  text: os queneus, os quenezeus, os cadmoneus, os ferezeus, os refains, os raqueus[a], os aveus, os amorreus, os cananeus, os girgaseus e os jebuseus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O etnônimo traduzido por “raqueus” reflete a forma transmitida pelo ge’ez neste ponto e talvez corresponda a um povo conhecido por outro nome em tradições paralelas. A tradução preserva essa forma em vez de harmonizá-la.
    reason: textual_variant
lexical_decisions:
- source_word: ለራኬዎን
  choice: os raqueus
  rationale: Preserva a forma étnica transmitida pelo ge’ez (Rakewon), aportuguesando-a segundo o padrão dos demais gentílicos da lista, sem harmonizá-la com uma tradição paralela.
- source_word: ለራፋኤዎን
  choice: os refains
  rationale: Emprega a forma portuguesa bíblica corrente para o etnônimo Rephaim.
- source_word: ለቅድሞኔውስ
  choice: os cadmoneus
  rationale: Adota a forma portuguesa tradicional e reconhecível do etnônimo, correspondente ao Kadmonites da tradição paralela.
