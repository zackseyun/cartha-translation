  text: And in the fourth generation they will return here, for the sin of the Amorites is not complete until now.”
translation:
  language: pt
  text: E, na quarta geração, eles voltarão para cá, pois o pecado dos amorreus não se completou até agora.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበትውልድ፡ ራብዕ
  choice: E, na quarta geração
  rationale: Reproduz a expressão temporal do ge'ez de modo direto e natural em português.
- source_word: ይትመየጡ፡ ዝየ
  choice: eles voltarão para cá
  rationale: Mantém o plural verbal e o valor dêitico de «aqui/para cá», sem explicitar no texto sujeitos que dependem do contexto.
- source_word: ኃጢአቶሙ፡ ለአሞሬዎን
  choice: o pecado dos amorreus
  rationale: Expressa a construção possessiva do texto e conserva o singular coletivo «pecado».
- source_word: ኢተፈጸመ ... እስከ፡ ይእዜ
  choice: não se completou até agora
  rationale: Preserva tanto a ideia de não consumação quanto o limite temporal explícito, evitando acrescentar uma interpretação como «chegar ao limite».
theological_decisions:
- issue: Natureza da incompletude do pecado dos amorreus
  choice: não se completou até agora
  alternative: ainda não chegou ao seu limite
  rationale: A opção escolhida mantém a formulação aberta do ge'ez e não define em que sentido o pecado se torna «completo».
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do ge'ez. O pronome «eles» conserva o sujeito plural implícito no verbo; a identificação dos referentes permanece dependente do contexto. A aspa final foi mantida por indicar o encerramento da fala no versículo.
