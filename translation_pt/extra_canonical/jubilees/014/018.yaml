  yaml_path: translation/extra_canonical/jubilees/014/018.yaml
  text: And he awoke from his sleep and arose, and the sun had set, and there was a flame. And behold, a smoking furnace and a torch of fire passed between the pieces.
translation:
  language: pt
  text: Ele despertou do sono e se levantou. O sol havia se posto, e surgiu uma chama. Então, eis que um forno fumegante e uma tocha de fogo passaram entre os pedaços.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነድ (nad)
  choice: chama
  rationale: O termo designa chama ou fogo; a tradução segue diretamente o texto ge'ez e evita harmonizá-lo com a referência à escuridão em Gênesis 15:17.
- source_word: እቶን ይጤይስ
  choice: forno fumegante
  rationale: Reproduz a imagem concreta de um forno ou fornalha que solta fumaça, em linguagem natural.
- source_word: በልባስ እሳት
  choice: tocha de fogo
  rationale: Expressa o objeto ígneo que atravessa os pedaços e preserva a imagem tradicional sem confundi-lo com a chama mencionada antes.
- source_word: ክፍል
  choice: pedaços
  rationale: No contexto do sacrifício dividido, refere-se às partes em que os animais foram cortados.
theological_decisions:
- issue: Relação com Gênesis 15:17
  choice: traduzir ወነድ፡ ኮነ፡ como “e surgiu uma chama”
  alternative: “e escureceu” ou “e houve densas trevas”
  rationale: A redação ge'ez de Jubileus contém explicitamente o termo para “chama”; a tradução não deve substituir essa leitura pela formulação do texto massorético de Gênesis.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. “Eis que” foi mantido para conservar a apresentação súbita da visão; “havia se posto” explicita a anterioridade natural do pôr do sol em relação à cena seguinte.
