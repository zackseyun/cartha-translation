  text: And I will also judge the nation to whom they will be enslaved, and after this they will come out from there with much property.
translation:
  language: pt
  text: Também julgarei a nação à qual eles servirão[a]; depois disso, sairão de lá com muitos bens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “à qual estarão sujeitos”; o verbo pode, neste contexto, incluir a ideia de escravização.'
    reason: Preserva a alternativa de sujeição e registra a forte nuance contextual de escravização sem tratá-la como equivalência exclusiva.
lexical_decisions:
- source_word: ወለሕዝብ፡ኒ፡ (wa-la-ḥəzb-ni)
  choice: Também ... a nação
  rationale: A partícula enclítica ኒ preserva o sentido aditivo de “também”, enquanto a construção portuguesa é reorganizada para soar natural.
- source_word: ይትቀነዩ፡ (yətqannayu)
  choice: servirão
  rationale: O verbo pode expressar serviço em condição de sujeição. O futuro mantém o contexto profético; a nota registra explicitamente a nuance de escravização.
- source_word: እፈትሖሙ፡ (ʾəfathomu)
  choice: julgarei
  rationale: Neste contexto, o verbo indica exercer juízo contra a nação opressora, em correspondência com a declaração de Gênesis 15:14.
- source_word: ምስለ፡ ጥሪት፡ ብዙኅ፡ (məsla ṭərit bəzuḫ)
  choice: com muitos bens
  rationale: “Bens” comunica de modo corrente a ideia de propriedade ou posses em grande quantidade, sem restringi-la a dinheiro.
theological_decisions:
- issue: Tempo da servidão anunciada
  choice: futuro (“servirão”)
  alternative: presente (“servem” ou “estão escravizados”)
  rationale: A forma verbal ocorre numa profecia acerca dos descendentes de Abrão; o futuro preserva esse enquadramento temporal.
- issue: Natureza do serviço prestado à nação
  choice: “servirão”, com nota sobre sujeição e escravização
  alternative: “serão escravizados” no corpo do texto
  rationale: A opção principal conserva a construção relacional do ge’ez e sua proximidade com a tradição de Gênesis 15:14, enquanto a nota mantém visível a forte nuance coerciva sem resolver indevidamente a amplitude lexical.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem das palavras foi ajustada à sintaxe portuguesa, preservando “também”, o futuro profético e a ambiguidade entre servir sob sujeição e ser escravizado.
