translation:
  language: pt
  text: de três anos, uma cabra de três anos, um carneiro de três anos, uma rola e um pombo”. E ele tomou todos esses no meio do mês[a] e morava junto a
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “no meio do mês” está explícita no ge'ez. Ela é mantida porque Jubileus costuma assinalar o tempo com precisão para fins litúrgicos e cronológicos.
    reason: cultural_note
lexical_decisions:
- source_word: ዘሠለስቱ፡ ዓመት፡
  choice: de três anos
  rationale: A expressão abre o versículo por causa da divisão editorial, mas qualifica o animal mencionado no versículo anterior; a tradução preserva essa continuidade sintática.
- source_word: ጠሌ
  choice: cabra
  rationale: Designa um caprino; “cabra” é natural em português e corresponde ao animal feminino pedido no contexto sacrificial.
- source_word: በገዐ
  choice: carneiro
  rationale: Termo para o ovino macho adulto, em correspondência direta com a lista de animais.
- source_word: መንጢጠ፡ ወርግብ
  choice: uma rola e um pombo
  rationale: Mantém distintos os dois tipos de ave nomeados no ge'ez, sem acrescentar idade ou outra especificação ausente.
- source_word: በመንፈቀ፡ ወርኅ
  choice: no meio do mês
  rationale: Reproduz a indicação cronológica explícita no texto-fonte.
- source_word: ኀበ
  choice: junto a
  rationale: É uma preposição locativa cujo complemento aparece no versículo seguinte; “junto a” preserva a ligação sintática, em vez de substituí-la por “ali”.
theological_decisions:
- issue: Precisão cronológica da narrativa
  choice: manter explicitamente “no meio do mês”
  alternative: omitir a expressão ou generalizá-la como “naquela época”
  rationale: A indicação temporal é explícita no ge'ez e sua retenção evita apagar a ênfase cronológica característica de Jubileus.
translation_notes:
  register: Português moderno, claro e digno. O início e o fim abruptos foram preservados porque o recorte do versículo divide, respectivamente, a descrição do primeiro animal e a locução prepositiva cujo complemento vem no versículo seguinte.
