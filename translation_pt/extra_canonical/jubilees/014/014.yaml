  yaml_path: translation/extra_canonical/jubilees/014/014.yaml
  text: A deep sleep fell upon Abram; and behold, a great terror of darkness fell upon him. And it was said to Abram, “Know with certainty that your seed will be aliens in a land not theirs, and they will enslave them and afflict them four hundred years.”
translation:
  language: pt
  text: 'Um sono profundo caiu sobre Abrão; e eis que um grande terror de trevas caiu sobre ele. Então foi dito a Abrão: “Saiba com certeza que a sua descendência viverá como estrangeira numa terra que não lhe pertence; eles a escravizarão[a] e a afligirão durante quatrocentos anos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela servirá a eles”.'
    reason: A forma etíope pode ser entendida como sujeição/serviço prestado pela descendência, enquanto o contexto também sustenta a tradução causativa “escravizarão”.
lexical_decisions:
- source_word: ድንጋፄ
  choice: sono profundo
  rationale: No contexto da tradição de Gênesis 15, designa o torpor ou sono profundo que cai sobre Abrão; esta formulação é clara e digna em português.
- source_word: ግርማ፡ ዐቢይ፡ ጽልመት
  choice: um grande terror de trevas
  rationale: Preserva tanto a intensidade de ዐቢይ (“grande”) quanto a associação do terror com as trevas, sem reduzir a expressão apenas a medo ou escuridão.
- source_word: አእምሮ፡ አእምር
  choice: Saiba com certeza
  rationale: A repetição enfática do verbo “saber” é vertida por uma construção idiomática portuguesa que mantém a força asseverativa.
- source_word: ፈላሴ
  choice: viverá como estrangeira
  rationale: Expressa a condição de residente estrangeiro ou peregrino, aplicada coletivamente à descendência, sem sugerir mera viagem temporária.
- source_word: ምድረ፡ ነኪር
  choice: numa terra que não lhe pertence
  rationale: Comunica naturalmente a ideia de terra alheia/estrangeira e esclarece sua relação com a descendência.
- source_word: ይቀንይዎሙ
  choice: eles a escravizarão
  rationale: No contexto, o verbo descreve sujeição ou serviço imposto. A formulação segue a leitura causativa tradicional, enquanto a nota registra a possibilidade mais formal de “servirá a eles”.
theological_decisions:
- issue: Identidade dos agentes da escravização e aflição
  choice: Manter o sujeito como “eles”, sem identificar explicitamente um povo ou império.
  alternative: Explicitar “os habitantes daquela terra” ou “os egípcios”.
  rationale: O versículo não nomeia os agentes; explicitá-los importaria uma identificação contextual e eliminaria a abertura sintática do texto.
- issue: Sentido coletivo de “descendência”
  choice: Usar o singular coletivo “a sua descendência” e retomá-lo pelo pronome feminino singular.
  alternative: Usar “os seus descendentes” no plural.
  rationale: A escolha preserva a imagem coletiva do termo-fonte e evita impor uma leitura individualizada.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Conservam-se a repetição de “caiu sobre”, o coletivo “descendência” e a expressão densa “terror de trevas” para manter a textura do original.
