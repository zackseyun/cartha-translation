  text: 'as estrelas. E ele lhe disse: “Assim será a sua descendência”. Ele creu no SENHOR, e isso foi considerado justiça.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: a sua descendência
  rationale: Expressa naturalmente o sentido coletivo de “semente/prole” em português moderno, sem sugerir apenas um descendente individual.
- source_word: አምኖ፡ ለእግዚአብሔር
  choice: creu no SENHOR
  rationale: Reproduz a construção de fé ou confiança dirigida ao Senhor em linguagem portuguesa corrente e digna.
- source_word: ተኈለቍ፡ ጽድቀ
  choice: isso foi considerado justiça
  rationale: Mantém a formulação passiva do ge’ez e evita explicitar um agente não expresso no texto-fonte.
theological_decisions:
- issue: Quem considera a fé como justiça e a quem ela é atribuída
  choice: “isso foi considerado justiça”
  alternative: “isso lhe foi creditado como justiça”
  rationale: O ge’ez conserva uma construção passiva concisa, sem declarar aqui o agente nem repetir explicitamente o beneficiário; a tradução preserva essa abertura em vez de completar a formulação com dados contextuais.
translation_notes:
  register: Português moderno, claro e solene. “Descendência” substitui o literalismo pouco natural “semente”. SENHOR em versaletes representa o título divino presente no ge’ez.
