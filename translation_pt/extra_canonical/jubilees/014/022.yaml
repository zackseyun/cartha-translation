  yaml_path: translation/extra_canonical/jubilees/014/022.yaml
  text: And on this day we made the covenant with Abram[a], just as we had made it in this month with Noah; and Abram renewed it as a festival and as an ordinance for himself forever.
translation:
  language: pt
  text: E, nesse dia, fizemos a aliança com Abrão[a], assim como a havíamos feito com Noé, nesse mesmo mês. E Abrão a renovou como festa e como estatuto para si, para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A primeira pessoa do plural (“fizemos a aliança”) reflete a moldura de mediação celestial do livro de Jubileus. Provavelmente é o anjo narrador que fala no contexto da revelação a Moisés.
    reason: cross_reference
lexical_decisions:
- source_word: ተካየድነ፡ ኪዳነ
  choice: fizemos a aliança
  rationale: Reproduz de modo natural a primeira pessoa do plural e o sentido de estabelecer ou celebrar uma aliança.
- source_word: ሐደሶ
  choice: a renovou
  rationale: Mantém a ideia de renovar a aliança, cujo referente é recuperado pelo pronome feminino em português.
- source_word: በበዓል፡ ወለሥርዓት
  choice: como festa e como estatuto
  rationale: 'Preserva os dois aspectos do texto: celebração festiva e disposição normativa duradoura.'
- source_word: እስከ፡ ለዓለም
  choice: para sempre
  rationale: Equivalente português corrente da expressão de duração indefinida ou perpétua.
theological_decisions:
- issue: Primeira pessoa do plural em “fizemos a aliança”
  choice: Mantida no texto, com nota explicativa sobre a moldura narrativa celestial.
  alternative: Substituir por “Deus fez a aliança” ou identificar explicitamente os anjos no corpo do versículo.
  rationale: O original emprega a primeira pessoa do plural e não explicita aqui o sujeito; identificá-lo no texto resolveria uma ambiguidade que deve ser preservada.
- issue: Relação entre a aliança de Abrão e a de Noé
  choice: “assim como a havíamos feito com Noé”
  alternative: “a mesma aliança que havíamos feito com Noé”
  rationale: A formulação comparativa evita afirmar identidade absoluta entre as alianças além do que a construção do texto exige.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Abrão” segue a forma tradicional correspondente ao nome anterior à mudança para Abraão. A repetição de “como” preserva a estrutura do original sem tornar a frase excessivamente literal.
