  language: pt
  text: 'dos cananeus como posse eterna, e para eu ser Deus para você e para a sua descendência depois de você”. E ele disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለእኂዝ፡ ለዓለም
  choice: como posse eterna
  rationale: A construção expressa uma posse duradoura ou perpétua; “posse eterna” conserva o sentido e se encaixa naturalmente no fragmento iniciado no versículo anterior.
- source_word: ለከዊነ፡ ለከ፡ አምላከ
  choice: ser Deus para você
  rationale: Mantém diretamente a construção infinitiva e relacional do ge’ez, sem introduzir modalidade como “para que eu pudesse ser”.
- source_word: ለዘርእከ፡ እምድኅሬከ
  choice: para a sua descendência depois de você
  rationale: “Descendência” traduz o coletivo “semente” em português corrente, preservando a referência às gerações posteriores.
- source_word: ወይቤ
  choice: 'E ele disse:'
  rationale: Reproduz a fórmula narrativa que introduz a fala seguinte; os dois-pontos são adequados em português moderno.
theological_decisions:
- issue: Relação de Deus com Abraão e sua descendência
  choice: “ser Deus para você e para a sua descendência”
  alternative: “ser o seu Deus e o Deus da sua descendência”
  rationale: A opção escolhida segue mais de perto a estrutura do texto ge’ez e evita acrescentar artigos possessivos não expressos, sem alterar o sentido da relação pactual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O início fragmentário foi preservado porque o versículo continua sintaticamente o anterior. Não foram necessárias notas de rodapé.
