  text: all these, and poured out their blood upon the altar, and divided them in the middle, and placed them opposite one another, face to face; but the birds he did not divide. And birds came down upon the pieces,
translation:
  language: pt
  text: Quanto a todos eles, derramou-lhes o sangue sobre o altar, cortou-os ao meio e colocou cada metade diante da outra, face a face; mas não cortou as aves. E aves desceram sobre as partes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sobre os pedaços”.'
    reason: Registra uma alternativa idiomática para ክፍሉ, termo que neste contexto pode referir-se às partes ou peças dos animais divididos.
lexical_decisions:
- source_word: ወከዐወ፡ ደሞሙ
  choice: derramou o sangue deles
  rationale: Reproduz diretamente a ideia de verter ou derramar o sangue, sem acrescentar um verbo como “sacrificou”, que não aparece nesta expressão.
- source_word: ወነፈቆሙ፡ እማእከል
  choice: cortou-os ao meio
  rationale: Expressa em português natural a divisão dos animais pelo meio.
- source_word: አንጻራቲሆሙ፡ በበገጾሙ
  choice: cada metade diante da outra, face a face
  rationale: Torna explícita a relação entre as partes exigida pelo contexto, preservando a imagem enfática de estarem frente a frente.
- source_word: አዕዋፍ
  choice: aves
  rationale: Mantém o termo genérico do ge'ez, sem especificar “aves de rapina” ou identificar necessariamente as aves com as anteriormente mencionadas.
- source_word: ክፍሉ
  choice: as partes
  rationale: O substantivo pode indicar porção, parte ou peça; “partes” é natural no contexto dos animais divididos e preserva a amplitude do termo.
theological_decisions:
- issue: Identidade das aves que desceram
  choice: aves
  alternative: aves de rapina
  rationale: O texto fornecido não qualifica essas aves. A tradução evita importar a formulação mais específica de Gênesis 15:11.
- issue: Ação inicial sobre os animais
  choice: não acrescentar “sacrificou” ou “matou”
  alternative: sacrificou todos eles
  rationale: O segmento começa em continuidade sintática com o contexto anterior e menciona explicitamente o derramamento do sangue; acrescentar uma ação não expressa resolveria indevidamente a elipse.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe de continuidade no início porque o versículo começa no meio da construção anterior. “Cada metade diante da outra” esclarece o referente sem alterar a disposição descrita; “face a face” conserva a ênfase do original.
