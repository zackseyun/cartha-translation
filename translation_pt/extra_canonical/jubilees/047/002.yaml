  rationale: Conserva o termo coletivo amplo antes da especificação masculina que vem a seguir.
- source_word: ርሰ፡ ዘተወልደ
  choice: todo menino que nascesse
  rationale: Expressa em português corrente a especificação de cada criança do sexo masculino nascida.
- source_word: ፈለግ
  choice: rio
  rationale: Equivalente direto no contexto do decreto egípcio.
