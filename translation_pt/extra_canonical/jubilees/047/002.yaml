  rationale: Mantém a expressão tradicional e coletiva do texto-fonte.
- source_word: ንጉሠ፡ ግብጽ፡ ፈርዖን
  choice: Faraó, rei do Egito
  rationale: Identifica primeiro o título-nome pelo qual a figura é mais conhecida e preserva sua designação real.
- source_word: ውሉዶሙ፡ ኵሎ
