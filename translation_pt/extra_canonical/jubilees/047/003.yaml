  text: And they continued casting them in for seven months[3], until the day when you were born. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.
translation:
  language: pt
  text: E continuaram a lançá-los por sete meses, até o dia em que você nasceu. Sua mãe escondeu você durante três meses, mas souberam dela por sua causa. Então ela fez para você um cesto, revestiu-o de piche e asfalto e o colocou entre os juncos, junto à margem do rio. Ela pôs você dentro dele por sete dias. Sua mãe vinha à noite para amamentá-lo e, durante o dia, Miriã, sua irmã, guardava você das aves.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A construção final do texto ge'ez é compacta e sua segmentação é discutida. Esta tradução a entende como dizendo que Miriã, irmã da criança, a guardava durante o dia, das aves junto ao rio.
    reason: segmentation_note
lexical_decisions:
- source_word: ይገድፉ
  choice: lançá-los no rio
  rationale: O verbo exprime lançar ou atirar; o complemento 'no rio' é recuperado do contexto imediato da ordem contra as crianças e torna explícito em português o referente implícito, sem suavizar a ação.
- source_word: ሤፍተ
  choice: cesto
  rationale: Designa o recipiente feito para a criança; 'cesto' é natural em português e mantém a ligação narrativa com o relato de Moisés.
- source_word: ፒሳ፡ ወአስፋልጠ
  choice: piche e asfalto
  rationale: Mantém os dois materiais impermeabilizantes distintos mencionados na fonte.
- source_word: ሣዕር
  choice: juncos
  rationale: No cenário da margem fluvial, 'juncos' comunica melhor a vegetação aquática do que o genérico 'erva'.
- source_word: ታጠብወከ
  choice: amamentá-lo
  rationale: O verbo indica dar de mamar; a escolha é clara, atual e precisa.
- source_word: ትዐቅበከ
  choice: protegia você
  rationale: Reproduz a ideia de guardar, vigiar ou proteger, em construção natural para o português contemporâneo.
