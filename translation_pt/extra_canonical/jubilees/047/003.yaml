  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. O discurso direto a Moisés conserva 'você', coerente com a legibilidade brasileira. A nota preserva a incerteza de segmentação na frase final.
