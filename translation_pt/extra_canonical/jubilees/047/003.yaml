  naturalness: O português é claro e de registro apropriado. As alterações propostas preservam a fluência, removem a explicitação indevida e tornam a segunda oração mais próxima da construção-fonte.
  terminology: «Cesto», «piche e asfalto», «juncos», «amamentá-lo» e «Miriã» são escolhas adequadas. A nota deve limitar-se à incerteza de segmentação e não apresentar «outros perigos» como conteúdo textual explícito.
