  yaml_path: translation/extra_canonical/jubilees/047/012.yaml
  text: Your brother. And he became angry and was indignant and said[12], “Who appointed you a ruler and a judge over us? Do you intend to kill me as you killed the Egyptian yesterday?” And you feared and fled because of this matter.
translation:
  language: pt
  text: 'Teu irmão. Ele ficou irado e indignado e disse: “Quem nomeou você governante e juiz sobre nós? Você pretende me matar como matou ontem o egípcio?” Então você teve medo e fugiu por causa disso.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተምዐዐ፡ ወተቈጥዐ
  choice: ficou irado e indignado
  rationale: Mantém os dois verbos próximos do ge’ez, que intensificam a ira, sem introduzir a ideia não exigida de uma discussão mútua.
- source_word: መልአከ፡ ወመኰንነ
  choice: governante e juiz
  rationale: Reproduz os dois cargos atribuídos na pergunta; “governante” comunica autoridade sobre o grupo, enquanto “juiz” preserva a função judicial.
- source_word: ትፈቅድ
  choice: pretende
  rationale: Expressa intenção ou vontade no contexto da pergunta ameaçadora, sem afirmar que o ato já foi decidido.
- source_word: እምቅድመ፡ ዝንቱ፡ ነገር
  choice: por causa disso
  rationale: Forma natural em português para a relação causal do ge’ez, cujo sentido literal é “por causa/diante deste assunto”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com construções de boa legibilidade brasileira. Conservou-se o fragmento inicial “Seu irmão.” tal como aparece no texto fornecido, sem completar silenciosamente a frase com material conjectural. A repetição semântica de ira e indignação foi mantida por refletir a ênfase do original.
