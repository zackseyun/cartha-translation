base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/010.yaml
  text: And you were in the court of the king for three weeks of years until the day when you went out from the court of the king and saw an Egyptian striking your fellow countryman, one of your brothers.
translation:
  language: pt
  text: E você permaneceu na corte do rei durante três semanas de anos[a], até o dia em que saiu da corte real e viu um egípcio espancando um compatriota seu, um dos seus irmãos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, três períodos de sete anos, totalizando vinte e um anos.
    reason: Esclarece a antiga expressão cronológica sem apagá-la do texto principal.
lexical_decisions:
- source_word: ዐጸድ (ʿaṣad)
  choice: corte
  rationale: No contexto da residência e posterior saída de Moisés, o termo designa a corte ou recinto régio; “corte” produz sentido natural em português.
- source_word: ሠለስተ ሱባዔ ዓመተ (śalasta subāʿē ʿāmata)
  choice: três semanas de anos
  rationale: Preserva a expressão cronológica concreta do texto, isto é, três períodos de sete anos, sem substituir silenciosamente a formulação por “vinte e um anos”.
- source_word: ይዘብጦ (yezabṭo)
  choice: espancando
  rationale: Comunica uma agressão física reiterada ou severa e corresponde ao sentido contextual do verbo.
- source_word: ለካልእከ ... (la-kālʾeka ...)
  choice: um compatriota seu, um de seus irmãos
  rationale: Mantém tanto a relação nacional quanto a linguagem de fraternidade presente na fonte e confirmada pela camada inglesa auditada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa natural. Conservou-se a segunda pessoa e a expressão temporal antiga, acompanhada de nota explicativa.
