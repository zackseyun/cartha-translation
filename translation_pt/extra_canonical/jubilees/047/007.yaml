  yaml_path: translation/extra_canonical/jubilees/047/007.yaml
  text: And she said to her, “Go.” And she went and called your mother Jochebed, and she gave her wages, and she nursed you.
translation:
  language: pt
  text: 'E ela lhe disse: “Vá.” Então ela foi, chamou sua mãe, Joquebede, e a filha do faraó lhe deu um salário. Sua mãe o amamentou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሑሪ
  choice: Vá
  rationale: Imperativo feminino singular, vertido de modo direto e natural.
- source_word: ለእምከ፡ ለአዮካቤድ
  choice: sua mãe, Joquebede
  rationale: Mantém a relação explícita com Moisés e apresenta o nome em aposição, conforme a sintaxe do ge'ez.
- source_word: ዐስበ
  choice: um salário
  rationale: Designa pagamento ou remuneração pelo cuidado da criança; 'salário' comunica naturalmente esse sentido.
- source_word: ወሐፀነተከ
  choice: e ela amamentou você
  rationale: No contexto, o verbo expressa criar ou cuidar como ama de leite; 'amamentou' torna explícita a ação pretendida sem alterar o referente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com formas verbais brasileiras de ampla compreensão. O sujeito implícito de 'deu' foi explicitado como 'a filha do faraó' para evitar a ambiguidade referencial criada pela sequência de sujeitos femininos; o contexto imediato identifica esse sujeito.
