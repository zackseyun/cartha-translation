  yaml_path: translation/extra_canonical/jubilees/047/001.yaml
  text: And in the seventh week, in the seventh year, in the forty-seventh jubilee, your father came from the land of Canaan, and you were born in the fourth week, in the sixth year, in the forty-eighth jubilee.
translation:
  language: pt
  text: E na sétima semana, no sétimo ano, no quadragésimo sétimo jubileu, seu pai veio da terra de Canaã; e você nasceu na quarta semana, no sexto ano, no quadragésimo oitavo jubileu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: semana
  rationale: No sistema cronológico de Jubileus, designa uma héptada de anos; conserva-se o termo tradicional “semana”, enquanto a sequência “semana, ano” deixa clara a hierarquia cronológica.
- source_word: ኢዮቤልዉ
  choice: jubileu
  rationale: Equivalente consagrado em português para a unidade cronológica de quarenta e nove anos usada na obra.
- source_word: አቡከ
  choice: seu pai
  rationale: Reproduz a segunda pessoa singular do sufixo possessivo e mantém a referência direta ao destinatário.
- source_word: እምድረ፡ ከናአን
  choice: da terra de Canaã
  rationale: Tradução direta e idiomática da expressão geográfica.
