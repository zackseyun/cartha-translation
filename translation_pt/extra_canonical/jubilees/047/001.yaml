translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A fórmula cronológica foi preservada como “na sétima semana, no sétimo ano”, evitando a leitura equivocada de uma semana situada dentro de um ano. O ponto e vírgula separa com clareza os dois acontecimentos datados.
