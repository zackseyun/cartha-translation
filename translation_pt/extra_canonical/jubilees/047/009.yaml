  yaml_path: translation/extra_canonical/jubilees/047/009.yaml
  text: And wages were paid, and she nursed you. And after this, when you had grown up, they brought you to Pharaoh’s daughter, and you became her son. And your father Amram taught you writing, and when you had completed three weeks of years, he brought you into the court.
translation:
  language: pt
  text: Pagaram um salário a ela, e ela amamentou você. Depois disso, quando você cresceu, levaram você à filha do faraó, e você se tornou filho dela. Seu pai, Anrão, ensinou você a escrever e, quando você completou três semanas de anos[a], levou você para a corte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, vinte e um anos.
    reason: Esclarece a expressão cronológica literal «três semanas de anos» sem substituí-la no texto.
lexical_decisions:
- source_word: ዐስበ
  choice: Pagaram-lhe o salário
  rationale: O verbo se refere ao pagamento de uma remuneração, de acordo com o contexto de Êxodo 2:9; a forma portuguesa mantém o agente indeterminado.
- source_word: ሐፀነተከ
  choice: ela amamentou você
  rationale: A forma tem sujeito feminino e descreve o cuidado materno; 'amamentou' expressa com clareza a ação no contexto.
- source_word: ልሂቀከ
  choice: quando você cresceu
  rationale: Traduz o crescimento de Moisés antes de ser conduzido à filha do faraó.
- source_word: ወሰዱከ
  choice: levaram você
  rationale: Preserva o sujeito plural não especificado do texto.
- source_word: መሀረከ ... መጽሐፈ
  choice: ensinou-lhe a escrita
  rationale: Expressa naturalmente em português o ensino da escrita, sem ampliar o sentido para educação geral ou para um livro específico.
- source_word: ሠለስተ፡ ሱባዔ
  choice: três semanas de anos
  rationale: Mantém o modo tradicional de contar períodos de sete anos, explicitando o total apenas em nota.
- source_word: ዐጸደ
  choice: corte
  rationale: No contexto da casa real do faraó, 'corte' é a opção portuguesa mais natural, embora o termo também possa designar um recinto ou pátio.
