  to: Pagaram um salário a ela, e ela amamentou você. Depois disso, quando você cresceu, levaram você à filha do faraó, e você se tornou filho dela. Seu pai, Anrão, ensinou você a escrever e, quando você completou três semanas de anos[a], levou você para a corte.
