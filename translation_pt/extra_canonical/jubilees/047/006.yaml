base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/006.yaml
  text: '...to bring you, and he brought you to her. And she took you out of the basket and had compassion on you. And your sister said to her, “Shall I go and call for you one of the Hebrew women, who will rear him and nurse him?”'
translation:
  language: pt
  text: '…para trazer você, e ele levou você até ela. Ela tirou você do cesto e teve compaixão de você. E sua irmã lhe disse: “Quer que eu vá chamar para você uma das mulheres hebreias, para que ela crie e amamente o menino?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤፍቅ
  choice: cesto
  rationale: Designa o recipiente de onde a criança foi retirada; “cesto” é natural e condiz com o contexto de Moisés.
- source_word: መሐረተከ
  choice: teve compaixão de você
  rationale: Preserva o sentido afetivo de mostrar misericórdia ou compaixão, sem reduzi-lo apenas a pena.
- source_word: ታሐፅኖ ወታጠብዎ
  choice: crie e amamente o menino
  rationale: 'Mantém os dois verbos distintos: cuidar/criar a criança e dar-lhe de mamar. “O menino” explicita naturalmente em português o referente masculino dos sufixos do ge’ez.'
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para representar a segunda pessoa feminina singular do ge’ez. A abertura fragmentária foi preservada com reticências porque o versículo continua a frase anterior.
