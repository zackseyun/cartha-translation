revisions:
- from: '…para que ele trouxesse você; e ele a levou até ela. Ela tirou você do cesto e teve compaixão de você. Então sua irmã lhe disse: “Quer que eu vá chamar para você uma das mulheres hebreias, para que crie e amamente o menino?”'
  to: '…para trazer você, e ele levou você até ela. Ela tirou você do cesto e teve compaixão de você. E sua irmã lhe disse: “Quer que eu vá chamar para você uma das mulheres hebreias, para que ela crie e amamente o menino?”'
  rationale: A revisão corrige a referência pronominal que mudava indevidamente «você» para «ela». Também ajusta a ligação narrativa para refletir a coordenação do ge’ez. Conserva-se a abertura com reticências, pois o versículo começa no meio de uma frase, e mantêm-se ambos os predicados finais — criar e amamentar — conforme o texto-fonte.
