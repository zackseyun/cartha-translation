  yaml_path: translation/extra_canonical/jubilees/047/005.yaml
  text: And in those days Tarmut[a], the daughter of Pharaoh, went out to bathe in the river, and she heard your voice crying, and she told her maidens to bring you out.
translation:
  language: pt
  text: Naqueles dias, Tarmut[a], filha do faraó, saiu para se banhar no rio. Ela ouviu a sua voz enquanto você chorava e disse às suas servas que tirassem você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nome dado à filha do faraó em Jubileus, correspondente a Termútis em Josefo (Antiguidades Judaicas 2.224).
    reason: historical_context
lexical_decisions:
- source_word: ታርሙት
  choice: Tarmut
  rationale: Transliteração direta do nome em geʿez, preservando a forma própria de Jubileus.
- source_word: ለአዕጋሪቲሃ
  choice: às suas servas
  rationale: Designa as mulheres que acompanhavam e serviam a filha do faraó; “servas” é natural no contexto antigo e preserva o gênero feminino do termo.
- source_word: ያውፅኣከ
  choice: que tirassem você dali
  rationale: Reproduz a ideia de fazer sair ou retirar o menino; “dali” torna natural em português a referência contextual ao lugar em que ele estava, sem especificar recipiente não mencionado neste segmento.
