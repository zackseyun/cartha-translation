  yaml_path: translation/extra_canonical/jubilees/023/021.yaml
  text: And they will rise up with bow and with swords and with slaughter, to turn them back to the way; and they will not turn back until much blood is poured out on the earth, these by those.
translation:
  language: pt
  text: E eles se levantarão com arco, espadas e matança, para fazê-los voltar ao caminho[a]; e não voltarão atrás até que muito sangue seja derramado sobre a terra, uns pelos outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para fazê-los mudar de direção rumo ao caminho”.'
    reason: A formulação explicita a construção causativa e direcional do ge'ez; não há base textual para o sentido “expulsá-los do caminho”.
lexical_decisions:
- source_word: ይቀውሙ
  choice: se levantarão
  rationale: No contexto de ação armada, expressa erguer-se ou insurgir-se, indo além do sentido estático de simplesmente ficar em pé.
- source_word: ይሚጥዎሙ፡ ውስተ፡ ፍኖት
  choice: fazê-los voltar ao caminho
  rationale: A construção indica fazê-los mudar de direção para o caminho; ውስተ aponta para movimento para dentro ou em direção a, não para afastamento.
- source_word: ኢይትመየጡ
  choice: não recuarão
  rationale: Mantém a ideia de não voltar atrás no confronto, em português natural, sem confundi-la com a ação causativa anterior.
- source_word: እሉ፡ በእሉ
  choice: uns pelas mãos dos outros
  rationale: Reproduz de modo inteligível a expressão recíproca literalmente próxima de 'estes por aqueles', indicando violência mútua sem especificar grupos não nomeados.
theological_decisions:
- issue: Direção do retorno ao caminho
  choice: para fazê-los voltar ao caminho
  alternative: para expulsá-los do caminho
  rationale: A preposição ውስተ indica direção ao caminho. A alternativa exigiria uma ideia de procedência ou afastamento que o texto ge'ez não apresenta.
- issue: Reciprocidade do derramamento de sangue
  choice: uns pelas mãos dos outros
  alternative: estes por aqueles
  rationale: A formulação conserva a tensão de violência entre grupos e torna natural a expressão elíptica, sem identificar indevidamente os agentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preserva-se o paralelismo áspero da enumeração bélica e esclarece-se apenas a expressão recíproca final.
