  source_fidelity: 'A tradução preserva bem a sequência do ge''ez: levantar-se, armas e matança, forçar o retorno ao caminho e a persistência até o derramamento de muito sangue. «Fazê-los voltar ao caminho» reproduz adequadamente a direção de ውስተ («para/em direção a»), sem introduzir o sentido incorreto de expulsão. Contudo, «pelas mãos» não está expresso no texto-fonte; embora idiomático, acrescenta uma imagem corporal desnecessária à fórmula final elíptica.'
