  yaml_path: translation/extra_canonical/jubilees/023/018.yaml
  text: For all of them have acted wickedly, and every mouth speaks sin, and all their works are uncleanness and abomination, and all their ways are defilement and uncleanness and destruction.
translation:
  language: pt
  text: Pois todos eles agiram perversamente; toda boca profere pecado; todas as suas obras são impureza e abominação; e todos os seus caminhos são contaminação, impureza e destruição.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “corrupção”.'
    reason: O termo ge'ez final, ሙስና, pode denotar corrupção ou deterioração; neste contexto, “destruição” é a tradução principal mais bem atestada, sem excluir a alternativa lexical.
lexical_decisions:
- source_word: አእከዩ (ʾaʾkayu)
  choice: agiram perversamente
  rationale: Expressa de modo natural e digno a ação má indicada pelo verbo, sem enfraquecê-la.
- source_word: ዐበሳ (ʿabasa)
  choice: pecado
  rationale: Representa diretamente a transgressão moral expressa pelo termo; evita reduzi-la apenas à condição de culpa.
- source_word: ርኵስ (rəkus)
  choice: impureza
  rationale: Conserva o campo semântico de impureza e funciona tanto para as obras quanto para os caminhos.
- source_word: ስቈራር (səqwarar)
  choice: abominação
  rationale: Preserva a força do termo, que denota algo repulsivo ou abominável, em vez do mais fraco 'corrupção'.
- source_word: ግማኔ (gəmanē)
  choice: contaminação
  rationale: Distingue este termo de ርኵስ e comunica profanação ou poluição moral.
- source_word: ሙስና (musna)
  choice: corrupção
  rationale: O termo pode indicar corrupção, deterioração ou destruição; 'corrupção' preserva melhor a amplitude lexical no contexto moral.
theological_decisions:
- issue: Natureza do que toda boca profere
  choice: pecado
  alternative: culpa
  rationale: O texto caracteriza a fala como moralmente transgressora; 'pecado' mantém essa força sem reinterpretá-la como mera responsabilidade jurídica.
- issue: Sentido do termo final ሙስና
  choice: corrupção
  alternative: destruição
  rationale: A tradução principal mantém o sentido de deterioração moral, enquanto a nota registra a leitura resultativa 'destruição' sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado por ponto e vírgula. Emprega 'profere' para conservar o tom elevado sem soar arcaico; repete 'impureza' conforme a repetição lexical do original.
