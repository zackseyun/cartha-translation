  yaml_path: translation/extra_canonical/jubilees/023/008.yaml
  text: And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of weeping for Abraham were completed.
translation:
  language: pt
  text: E todos os homens da casa de Abraão choraram por ele durante quarenta dias, e também Isaque, Ismael, todos os filhos deles e todos os filhos de Quetura, cada qual em seu lugar. Completaram-se os dias de pranto por Abraão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በከይዎ
  choice: choraram por ele
  rationale: Expressa diretamente o pranto dos familiares por Abraão, mantendo o referente masculino do sufixo.
- source_word: አርብዓ፡ መዋዕለ
  choice: durante quarenta dias
  rationale: Forma portuguesa natural que preserva com exatidão a duração indicada.
- source_word: ኵሎሙ፡ ሰብአ፡ ቤቱ
  choice: todos os homens da casa de Abraão
  rationale: O substantivo indica os homens da casa; explicitar Abraão evita uma referência possessiva pouco clara em português.
- source_word: በመካኖሙ
  choice: cada qual em seu lugar
  rationale: Preserva a distribuição implícita no plural etíope, em linguagem portuguesa clara.
- source_word: መዋዕለ፡ ብካዩ
  choice: os dias de luto por Abraão
  rationale: O contexto indica o período em que outros pranteavam Abraão; 'luto' comunica naturalmente o pranto funerário sem sugerir que Abraão chorava.
