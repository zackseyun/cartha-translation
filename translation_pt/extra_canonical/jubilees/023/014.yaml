base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/014.yaml
  text: 'For blow upon blow, and wound upon wound, and distress upon distress, and evil report upon evil report, and sickness upon sickness, and every evil like these, one with another: disease and collapse and frost and hail and snow and fever and chills and stupor and famine and death and sword and captivity and every affliction and sickness.'
translation:
  language: pt
  text: 'Pois, golpe após golpe, ferida após ferida, aflição após aflição, má notícia após má notícia, doença após doença e todo mal semelhante a estes, um com o outro: enfermidade, colapso, geada, granizo, neve, febre, calafrios, torpor, fome, morte, espada, cativeiro e toda aflição e doença.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት
  choice: golpe / aflição
  rationale: O termo abre a série no sentido concreto de golpe e reaparece ao fim com alcance mais geral; a variação contextual preserva ambos os valores sem tornar o português artificial.
- source_word: ቍስላን
  choice: ferida
  rationale: Equivalente direto e natural para lesão ou chaga no contexto de calamidades sucessivas.
- source_word: ምንዳቤ
  choice: aflição
  rationale: Expressa sofrimento ou angústia de modo amplo e corrente.
- source_word: ስምዐት እኩይ
  choice: má notícia
  rationale: Tradução formal da expressão 'notícia/relato mau', mantendo a ideia de informações calamitosas sucessivas.
- source_word: ዝንቱ ምስለ ዝንቱ
  choice: uns junto aos outros
  rationale: Preserva a ideia distributiva e cumulativa de 'isto com isto' ou 'um com outro'.
- source_word: ጕፍጥአት
  choice: colapso
  rationale: Representa uma queda ou prostração física sem especificar além da evidência disponível.
- source_word: በረድ ወሐመዳ
  choice: granizo, neve
  rationale: Mantém distintos os dois fenômenos meteorológicos explicitamente enumerados.
- source_word: ስክሕካሕ ወሰምዛዝ
  choice: calafrios, torpor
  rationale: Reproduz dois estados físicos distintos, evitando omiti-los ou fundi-los com febre.
- source_word: መጥባሕት
  choice: espada
  rationale: No catálogo de calamidades, designa morte ou violência pela espada; a forma concisa acompanha o paralelismo da lista.
- source_word: ፂዋዌ
  choice: cativeiro
  rationale: Equivalente natural para captura, deportação ou condição de prisioneiro.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com ritmo cumulativo mantido pela repetição 'após'. A extensa enumeração do ge'ez foi preservada integralmente, inclusive 'uns junto aos outros' e os itens meteorológicos e físicos anteriormente omitidos. Não se introduziu interpretação confessional.
