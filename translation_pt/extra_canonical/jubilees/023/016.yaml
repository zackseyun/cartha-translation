  yaml_path: translation/extra_canonical/jubilees/023/016.yaml
  text: Then they will say, “The days of the former ones were many, up to a thousand years, and good; but behold, the days of our life, when a man has lived long, are seventy years, and if he is strong, eighty years, and they are evil, and there is no peace in the days of this evil generation.”
translation:
  language: pt
  text: 'Então eles dirão: “Os dias dos antigos foram muitos, até mil anos, e foram bons. Mas eis: os dias de nossa vida, quando alguém chega à velhice, são setenta anos; e, se for forte, oitenta anos. E eles são maus, e não há paz nos dias desta geração má.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለቀደምት
  choice: dos antigos
  rationale: Expressa de modo natural a referência às pessoas das gerações anteriores, sem restringi-la indevidamente aos primeiros seres humanos.
- source_word: እስከ፡ ዐሠርቱ፡ ምእት፡ ዓመት
  choice: até mil anos
  rationale: Reproduz diretamente o limite numérico do texto ge'ez.
- source_word: አመ፡ አብዝኀ፡ ሰብእ፡ ሐይወ
  choice: quando alguém vive muito
  rationale: Comunica a ideia de longevidade humana excepcional nesse contexto e evita uma formulação portuguesa artificial.
- source_word: እመ፡ ኀየለ
  choice: se for forte
  rationale: Mantém a construção condicional e o sentido de vigor ou força que permite chegar aos oitenta anos.
- source_word: እኩይ / እኪት
  choice: maus / má
  rationale: Preserva a repetição lexical e a avaliação moral ou penosa dos dias e da geração, sem explicá-la além do texto.
theological_decisions:
- issue: Relação entre a longevidade dos antigos e a brevidade da geração presente
  choice: Preservar o contraste explícito sem harmonização externa
  alternative: Explicar a passagem à luz de Salmos 90 ou de uma cronologia específica
  rationale: O versículo compara épocas e avalia a geração presente, mas não identifica aqui a causa nem exige uma interpretação cronológica ou doutrinária particular.
- issue: Sentido de “maus” aplicado aos dias
  choice: Manter a formulação ampla “esses dias são maus”
  alternative: Traduzir especificamente como “cheios de sofrimento” ou “pecaminosos”
  rationale: O termo admite uma carga negativa abrangente; uma especificação eliminaria a tensão entre calamidade e maldade moral.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. “Vejam” traduz o elemento apresentativo de forma corrente; “alguém” evita o masculino genérico marcado sem alterar o referente humano geral. A repetição de “anos” e “dias” foi mantida por sua função retórica.
