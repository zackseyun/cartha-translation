  text: And a great punishment will come upon the works of that generation from the LORD, and he will give them over to slaughter and judgment and captivity and plundering and destruction.
translation:
  language: pt
  text: E um grande castigo virá da parte do SENHOR sobre as obras daquela geração, e ele entregará aquela geração à matança, ao juízo, ao cativeiro, ao saque e à destruição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት፡ ዐቢይ
  choice: um grande castigo
  rationale: Reproduz de modo natural a ideia de uma punição ou calamidade punitiva de grande magnitude.
- source_word: ዲበ፡ ግብረ፡ ይእቲ፡ ትውልድ
  choice: sobre as obras daquela geração
  rationale: Mantém a referência explícita às obras ou ações da geração, sem restringir o sentido a um tipo específico de conduta.
- source_word: እምኀበ፡ እግዚአብሔር
  choice: da parte do SENHOR
  rationale: Expressa com clareza a origem divina do castigo; SENHOR segue a convenção bíblica portuguesa para o nome divino.
- source_word: መጥባሕት
  choice: matança
  rationale: O termo aponta para abate ou morticínio; “matança” é mais preciso aqui do que “espada”.
- source_word: ኵነኔ
  choice: julgamento
  rationale: Preserva o sentido judicial de condenação ou juízo sem explicitação interpretativa adicional.
- source_word: ፂዋዌ
  choice: cativeiro
  rationale: Comunica a condição de ser levado ou mantido como cativo em linguagem bíblica corrente.
- source_word: ሀደድ
  choice: saque
  rationale: Termo português natural para espoliação ou pilhagem violenta.
- source_word: ብልዐት
  choice: destruição
  rationale: Embora o campo lexical possa evocar devorar ou consumir, “destruição” comunica naturalmente o resultado devastador exigido pelo contexto.
theological_decisions:
- issue: Agente do castigo e da entrega
  choice: O castigo vem da parte do SENHOR, e ele entrega a geração às calamidades enumeradas.
  alternative: Tratar a formulação apenas como consequência impessoal das obras humanas.
  rationale: A sintaxe do texto atribui explicitamente a origem do castigo a Deus e mantém Deus como sujeito da entrega, sem desenvolver uma explicação teológica além disso.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A sequência coordenada de calamidades foi preservada, bem como a repetição de “ao/à”, que mantém o ritmo solene do original.
