  yaml_path: translation/extra_canonical/jubilees/023/012.yaml
  text: And all the generations that will arise from now until the day of the great judgment will grow old quickly before they complete two jubilees, and their knowledge will depart from them, from their spirit,, and all their knowledge will vanish.
translation:
  language: pt
  text: E todas as gerações que surgirem de agora até o dia do grande julgamento envelhecerão depressa, antes de completarem dois jubileus. O entendimento delas as deixará e se afastará de seu espírito, e todo o seu conhecimento desaparecerá.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase final, “e todo o seu conhecimento desaparecerá”, aparece entre colchetes na edição ge’ez usada como fonte, indicando incerteza textual.
    reason: A redação final está marcada editorialmente por colchetes no texto-fonte e deve ser preservada com transparência.
lexical_decisions:
- source_word: ኵሉ፡ ትውልድ
  choice: todas as gerações
  rationale: Conserva o sentido coletivo do sintagma ge’ez e concorda naturalmente com a oração relativa no plural em português.
- source_word: ዕለተ፡ ደይን፡ ዐባይ
  choice: o dia do grande julgamento
  rationale: Tradução direta e corrente da expressão escatológica, sem especificar além do que o texto afirma.
- source_word: ይረሰኡ፡ ፍጡነ
  choice: envelhecerão depressa
  rationale: Reproduz o verbo de envelhecer e o advérbio de rapidez, evitando interpretar a frase apenas como morte prematura.
- source_word: ክልኤ፡ ኢዮቤልወ
  choice: dois jubileus
  rationale: Mantém a unidade cronológica característica da obra, sem convertê-la em anos no corpo do texto.
- source_word: አእምሮቶሙ
  choice: o entendimento / todo o seu conhecimento
  rationale: O termo ligado ao saber e à compreensão ocorre nas duas cláusulas; a variação portuguesa evita rigidez sem eliminar a repetição conceitual.
- source_word: እመንፈሶሙ
  choice: afastando-se do espírito delas
  rationale: Retém explicitamente a referência ao espírito, presente no ge’ez e omitida em uma revisão inglesa anterior.
theological_decisions:
- issue: Natureza da perda de entendimento
  choice: O entendimento as deixará, afastando-se do espírito delas
  alternative: A mente delas ficará privada de entendimento
  rationale: A formulação escolhida preserva a imagem do conhecimento que parte e mantém a menção ao espírito, sem impor uma antropologia técnica ou denominacional.
- issue: Valor escatológico de ደይን
  choice: julgamento
  alternative: juízo
  rationale: Ambas são possíveis; “julgamento” é claro em português internacional e não altera a referência ao grande dia escatológico.
translation_notes:
  register: Português moderno, digno e acessível, com construção plural para evitar o masculino genérico ao retomar “gerações”. A divisão em duas frases melhora a legibilidade sem alterar a sequência lógica do ge’ez. “Jubileus” foi mantido como termo próprio da cronologia do livro.
