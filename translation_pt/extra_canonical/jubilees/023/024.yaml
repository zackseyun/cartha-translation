base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/024.yaml
  text: And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.
translation:
  language: pt
  text: E ele incitará contra eles os pecadores das nações, que não terão misericórdia nem compaixão deles e não mostrarão favor nem ao idoso, nem ao jovem, nem a ninguém; pois são maus e fortes, capazes de fazer o mal mais do que todos os filhos dos homens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያነቅህ
  choice: incitará
  rationale: Expressa a ação de despertar ou levantar agentes hostis contra alguém, de modo natural em português.
- source_word: ኃጥአኒሆሙ፡ ለአሕዛብ
  choice: os pecadores das nações
  rationale: Preserva a construção nominal e sua caracterização moral sem identificar povos específicos.
- source_word: ምሕረተ፡ ወሣህለ
  choice: misericórdia nem compaixão
  rationale: Mantém os dois termos próximos, mas distintos, relativos à clemência e à ternura.
- source_word: ለገጸ፡ መኑሂ፡ ኢያደልዉ
  choice: não mostrarão favor ... a ninguém
  rationale: Traduz a ideia de parcialidade ou consideração favorável de maneira idiomática.
- source_word: እኩያን፡ ወኀያላን
  choice: maus e fortes
  rationale: Conserva diretamente a dupla qualificação ética e física do texto.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Mantém a expressão semítica tradicional, aqui com sentido coletivo de humanidade.
theological_decisions:
- issue: Sujeito de «incitará»
  choice: E ele incitará
  alternative: E [Deus] incitará
  rationale: O versículo usa sujeito pronominal implícito; evita-se explicitar uma identificação teológica que depende do contexto.
- issue: Comparação final da prática do mal
  choice: capazes de fazer o mal mais do que todos os filhos dos homens
  alternative: para fazerem mais mal do que todos os seres humanos
  rationale: Preserva a formulação comparativa forte e a expressão antropológica tradicional, sem suavizar a tensão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe acompanha de perto a progressão do ge'ez, mas evita rigidez excessiva. Não foram necessárias notas de rodapé.
