base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/011.yaml
  text: For Abraham was perfect in all his deeds with the LORD, and he was pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he grew old because of evil, and he was full of days.
translation:
  language: pt
  text: Pois Abraão foi íntegro em todas as suas obras com o SENHOR e foi agradável em justiça todos os dias de sua vida. E eis que não completou quatro jubileus em sua vida, até envelhecer por causa do mal[a] e ficar cheio de dias.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, mais literalmente, “diante do mal”.
    reason: A expressão etíope pode ser lida espacialmente, embora aqui provavelmente tenha sentido causal.
  - marker: b
    text: Expressão idiomática que indica uma vida longa e completa; literalmente, “ficou cheio de seus dias”.
    reason: Esclarece o idioma bíblico sem acrescentar a morte, que não é expressa nesta frase.
lexical_decisions:
- source_word: ፍጹም (fəṣṣum)
  choice: íntegro
  rationale: No contexto da conduta de Abraão, expressa inteireza moral e fidelidade sem sugerir necessariamente impecabilidade absoluta.
- source_word: ምስለ፡ እግዚአብሔር (məsla ʾEgziʾabəḥer)
  choice: com o SENHOR
  rationale: A preposição ምስለ significa propriamente “com”; evita substituí-la por “diante de”. O título divino é vertido pela forma bíblica consagrada “SENHOR”.
- source_word: ይሠምር (yəsämmər)
  choice: lhe agradou
  rationale: O verbo comunica ser agradável ou obter aprovação; o pronome retoma naturalmente o SENHOR no português corrente.
- source_word: ኢፈጸመ፡ አርባዕተ፡ ኢዮቤልውሳተ
  choice: não chegou a completar quatro jubileus
  rationale: Reproduz a afirmação de que a vida de Abraão ficou aquém de quatro ciclos jubilares.
- source_word: ጸገበ፡ መዋዕሊሁ (ṣägäbä mawāʿə­lihu)
  choice: morreu cheio de dias
  rationale: Preserva o conhecido idioma bíblico de uma vida longa e completa. “Morreu” torna explícito em português o desfecho indicado pelo contexto, enquanto “cheio de dias” conserva a imagem do original.
theological_decisions:
- issue: Relação de Abraão com o SENHOR
  choice: com o SENHOR
  alternative: diante do SENHOR
  rationale: O texto usa ምስለ, “com”, e não a preposição esperada para “diante de”; a tradução não deve alterar essa relação.
- issue: Causa do envelhecimento e da redução da longevidade
  choice: por causa do mal
  alternative: diante do mal / na presença do mal
  rationale: A expressão ቅድመ፡ ገጸ pode funcionar causalmente, e o contexto do capítulo associa a redução da longevidade ao mal; a nota conserva a leitura espacial mais literal.
- issue: Plenitude dos dias
  choice: cheio de dias
  alternative: seus dias se cumpriram
  rationale: O verbo tem Abraão como sujeito e significa estar cheio ou saciado; a alternativa mudaria a construção e enfraqueceria o idioma de saciedade.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência bíblica moderada. “Íntegro” evita a possível leitura de perfeição absoluta; “jubileus” preserva a unidade cronológica própria da obra. Os marcadores [a] e [b] aparecem no texto principal.
