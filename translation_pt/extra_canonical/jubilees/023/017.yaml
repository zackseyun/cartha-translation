  source_fidelity: A revisão é necessária porque ደቂቅ tem aqui o sentido básico mais abrangente de “crianças”/“filhos”, e a trilha de auditoria inglesa adota “children” como texto principal. Em português, “crianças” preserva essa abrangência, com “filhos” como alternativa em nota. A formulação também deve tornar mais natural e menos ambígua que as faltas atribuídas são as dos pais e anciãos repreendidos.
  naturalness: O registro é claro e digno. A revisão troca “das palavras de sua boca” por “das palavras que proferem”, expressão moderna que conserva o sentido, e organiza a enumeração de modo fluente sem reduzir seu conteúdo.
  terminology: '“SENHOR”, “aliança”, “mandamentos”, “estatutos” e “lei” são adequados. “Crianças” no texto, com a nota “Ou: filhos”, alinha melhor a opção principal à decisão lexical registrada e mantém a alternativa interpretativa disponível.'
