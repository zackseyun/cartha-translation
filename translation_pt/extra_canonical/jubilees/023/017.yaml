base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/017.yaml
  text: And in that generation children will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.
translation:
  language: pt
  text: E naquela geração, as crianças[a] repreenderão seus pais e seus anciãos por causa do pecado, da injustiça, das palavras que proferem e dos grandes males que esses pais e anciãos cometem, e porque abandonaram a aliança que o SENHOR estabeleceu entre eles e ele próprio, para que guardassem e cumprissem todos os seus mandamentos, seus estatutos e toda a sua lei, sem se desviar nem para a direita nem para a esquerda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “filhos”.'
    reason: O ge’ez ደቂቅ pode referir-se a filhos ou, de modo mais amplo, a crianças. “Crianças” reproduz a opção principal da auditoria inglesa; a nota preserva a alternativa relacional.
lexical_decisions:
- source_word: ደቂቅ
  choice: filhos
  rationale: O termo pode designar tanto filhos quanto crianças. Neste contexto, “filhos” expressa com naturalidade a relação geracional com “pais”, enquanto a nota preserva a alternativa mais ampla.
- source_word: ይዘልፉ
  choice: repreenderão
  rationale: Comunica uma censura verbal direta e mantém o tom forte do verbo no contexto.
- source_word: ሥርዐተ
  choice: aliança / estatutos
  rationale: 'O mesmo vocábulo ocorre em construções distintas: na primeira, refere-se ao compromisso estabelecido pelo SENHOR entre as partes; depois integra a série de exigências divinas e é traduzido por “estatutos”.'
- source_word: እግዚአብሔር
  choice: SENHOR
  rationale: Forma portuguesa tradicional e dignificada para o título divino presente na fonte.
- source_word: አልቦ፡ ተኃኅቶ፡ የማነ፡ ወፀጋመ
  choice: sem se desviar nem para a direita nem para a esquerda
  rationale: Preserva a expressão direcional idiomática da fonte, clara também em português.
theological_decisions:
- issue: Identidade dos que censuram a geração mais velha
  choice: 'filhos, com nota “Ou: crianças”'
  alternative: crianças
  rationale: A fonte admite amplitude semântica. “Filhos” ressalta o contraste relacional com os pais, mas a nota evita eliminar a leitura abrangente.
- issue: Relação expressa pela fórmula da aliança
  choice: “entre eles e si mesmo”
  alternative: “entre eles e ele”
  rationale: A construção reflexiva deixa claro que o segundo participante é o próprio SENHOR, sem acrescentar conteúdo teológico não expresso.
- issue: Sujeito de “guardassem e cumprissem”
  choice: a geração humana obrigada pela aliança
  alternative: referência genérica ao povo
  rationale: Mantém a ligação gramatical com “eles” e não especifica além do que o texto fornece.
translation_notes:
  register: Português moderno, claro e dignificado, com cadência bíblica moderada. A enumeração repetitiva da fonte foi suavemente organizada por pontuação, sem eliminar seus elementos nem resolver ambiguidades indevidamente.
