  to: E naquela geração, as crianças[a] repreenderão seus pais e seus anciãos por causa do pecado, da injustiça, das palavras que proferem e dos grandes males que esses pais e anciãos cometem, e porque abandonaram a aliança que o SENHOR estabeleceu entre eles e ele próprio, para que guardassem e cumprissem todos os seus mandamentos, seus estatutos e toda a sua lei, sem se desviar nem para a direita nem para a esquerda.
