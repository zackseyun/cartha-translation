  text: And all this will come upon an evil generation which sins on the earth; their deeds are uncleanness and fornication and impurity and abomination.
translation:
  language: pt
  text: E tudo isso virá sobre uma geração perversa que peca na terra; suas obras são impureza, fornicação, poluição e abominação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኪት
  choice: perversa
  rationale: Expressa o caráter moralmente mau da geração em português natural e digno.
- source_word: ትኤብስ
  choice: peca
  rationale: O verbo significa pecar ou transgredir; evita a leitura anterior, não sustentada, de que a geração 'contamina' a terra.
- source_word: በምድር
  choice: na terra
  rationale: Preserva o sentido locativo da preposição e do substantivo.
- source_word: ርኵስ
  choice: impureza
  rationale: Representa a primeira categoria de impureza da lista, sem acrescentar uma especificação ritual ou sexual ausente do texto.
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Equivalente moderno e amplamente inteligível para conduta sexual ilícita; evita restringir o termo apenas à prostituição.
- source_word: ገማኔ
  choice: corrupção
  rationale: Distingue este termo da impureza anterior e comunica degradação moral, embora o valor exato do vocábulo seja incerto.
- source_word: ሳቀራር
  choice: abominação
  rationale: Conserva a forte censura moral do termo sem especificar uma prática não indicada.
- source_word: ገብርሙ
  choice: suas obras são
  rationale: Mantém a referência explícita às obras deles e liga toda a enumeração a esse sujeito.
theological_decisions:
- issue: Relação entre o pecado na terra e a lista de vícios
  choice: 'Duas orações: a geração peca na terra; suas obras correspondem à lista subsequente.'
  alternative: A geração contamina a terra por meio dos vícios enumerados.
  rationale: A morfologia apresentada sustenta o verbo 'peca', a expressão locativa 'na terra' e a menção independente a 'suas obras'; a alternativa funde elementos distintos.
- issue: Alcance de 'suas obras'
  choice: 'A expressão introduz toda a lista: impureza, imoralidade sexual, corrupção e abominação.'
  alternative: Ligar 'obras' somente ao último item, como em 'obras abomináveis'.
  rationale: A construção favorece que o substantivo se aplique à enumeração inteira, preservando a tensão e a estrutura do original.
