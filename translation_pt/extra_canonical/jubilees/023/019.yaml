base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/019.yaml
  text: Behold, the earth will be destroyed because of all their deeds, and there will be no grain, no wine, and no oil, because all their deeds are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.
translation:
  language: pt
  text: Eis que a terra será destruída por causa de todas as obras deles. Não haverá cereal, nem vinho, nem azeite, porque todas as suas obras são infiéis. E todos perecerão juntos — os animais selvagens, os animais domésticos, as aves e todos os peixes do mar — por causa dos filhos dos homens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትሐጐል
  choice: será destruída
  rationale: Expressa de modo natural o sentido passivo de ruína ou destruição aplicado à terra.
- source_word: ዘርእ፡ ወይን
  choice: cereal, nem vinho
  rationale: A sequência etíope pode soar literalmente como “semente e vinho” ou ser lida em relação à videira; a formulação agrícola “cereal... vinho” oferece em português uma enumeração natural ao lado do azeite, em consonância com o sentido contextual.
- source_word: ቅብዐ
  choice: azeite
  rationale: No contexto de produtos agrícolas, designa óleo, naturalmente entendido como azeite.
- source_word: ካሕደ፡ ምግባሪሆሙ
  choice: suas obras são infiéis
  rationale: Preserva a caracterização moral ligada à infidelidade, sem reduzi-la apenas a maldade genérica.
- source_word: አራዊት፡ ወእንስሳ
  choice: os animais selvagens, os animais domésticos
  rationale: Mantém a distinção entre feras e gado/animais domesticados.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Conserva a expressão tradicional e formal do original, referente à humanidade.
theological_decisions:
- issue: Relação causal entre o pecado humano e a ruína da criação
  choice: Manter “por causa” nas duas ocorrências
  alternative: Suavizar para “em consequência de” ou generalizar a causa
  rationale: O texto atribui diretamente aos atos humanos tanto a destruição da terra quanto a morte conjunta dos seres vivos; a tradução preserva essa tensão teológica sem explicá-la.
- issue: Natureza das obras humanas
  choice: “infiéis”
  alternative: “más”, “enganosas” ou “apóstatas”
  rationale: “Infiéis” preserva a dimensão relacional e religiosa do termo sem impor uma interpretação denominacional mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. “Eis que” mantém a força profética do início; a enumeração usa termos comuns, e os travessões destacam os seres vivos que perecem juntos.
