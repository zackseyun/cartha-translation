  text: And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.
translation:
  language: pt
  text: Então ele se levantou do colo de Abraão[a], correu e contou isso a Rebeca, sua mãe. Rebeca foi de noite até Isaque e lhe contou. Então eles foram juntos, e Jacó também estava com eles, e uma tocha estava em sua mão[b]. Quando chegaram, encontraram Abraão deitado, morto.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «do colo» ou «do seio». O contexto anterior indica o colo de Abraão.
    reason: Preserva o sentido concreto do ge'ez e esclarece o referente necessário em português.
  - marker: b
    text: Literalmente, «e uma tocha estava em sua mão». A tocha e o pronome são singulares; o referente mais provável é Jacó, mas não é nomeado expressamente no sintagma.
    reason: Registra a forma singular do original e preserva a pequena ambiguidade do referente pronominal.
lexical_decisions:
- source_word: እምሕፅኑ
  choice: do colo de Abraão
  rationale: O substantivo significa literalmente «colo/seio». O contexto anterior identifica Abraão como aquele em cujo colo Jacó dormia; explicitar o referente em português evita a leitura reflexiva e preserva a ligação narrativa.
- source_word: ሌሊተ
  choice: de noite
  rationale: Reproduz diretamente o valor temporal do termo em linguagem portuguesa natural.
- source_word: ማኅቶት
  choice: tocha
  rationale: Equivalente corrente para a fonte portátil de luz mencionada no relato.
- source_word: በድኖ
  choice: morto
  rationale: Expressa o estado sem vida de Abraão, mantendo a força conclusiva da cena.
theological_decisions:
- issue: Identidade de quem levava a tocha
  choice: Jacó levava uma tocha na mão
  alternative: O grupo levava tochas nas mãos
  rationale: O texto ge'ez apresenta «tocha» e o sufixo possessivo no singular masculino. Pela sequência sintática, o referente mais provável é Jacó, mas a nota registra que o pronome não o nomeia explicitamente.
translation_notes:
  register: Português moderno, corrente e digno, com sintaxe narrativa clara. «Colo» foi mantido em vez de «cama» por fidelidade ao ge'ez e ao contexto imediato; o referente Abraão foi explicitado para evitar ambiguidade artificial.
