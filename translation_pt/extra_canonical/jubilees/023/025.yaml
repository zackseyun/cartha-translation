  yaml_path: translation/extra_canonical/jubilees/023/025.yaml
  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
translation:
  language: pt
  text: E cometerão violência em Israel e pecarão contra Jacó, e muito sangue será derramado sobre a terra; não haverá quem recolha nem quem sepulte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀከከ
  choice: violência
  rationale: No contexto, o termo indica ação opressiva ou violenta; “cometer violência” é natural em português e preserva a gravidade da expressão.
- source_word: ዲበ፡ ያዕቆብ
  choice: contra Jacó
  rationale: 'A preposição ዲበ tem sentido básico de “sobre”, mas aqui, ligada ao pecado, expressa a pessoa ou comunidade atingida: “contra Jacó”. Isso também preserva a distinção em relação a ውስተ (“em”) na expressão anterior.'
- source_word: ይትከዐው
  choice: será derramado
  rationale: A forma passiva descreve o sangue sendo vertido; “será derramado” mantém a imagem e soa idiomático.
- source_word: ያስተጋብእ
  choice: recolha
  rationale: Expressa reunir ou recolher o sangue/corpos deixados no chão; o pronome “o” retoma diretamente “sangue” e preserva a formulação concisa.
- source_word: ይቀብር
  choice: sepulte
  rationale: Equivalente direto e digno para a ação de enterrar os mortos.
theological_decisions:
- issue: Relação do pecado com Jacó
  choice: pecarão contra Jacó
  alternative: pecarão sobre Jacó / pecarão em Jacó
  rationale: “Contra” comunica em português a força relacional da construção com ዲበ sem confundi-la com o ውስተ (“em”) usado para Israel; não acrescenta uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e solene, com coordenação profética fluida. “Jacó” e “Israel” foram mantidos como no texto, sem explicitar se designam o patriarca, o povo ou a terra, preservando a tensão referencial.
