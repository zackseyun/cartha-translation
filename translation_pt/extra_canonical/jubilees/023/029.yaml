base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/029.yaml
  text: And the days will begin to grow many and increase among the children of men, generation by generation and day by day, until their days draw near to one thousand years and to many years beyond many days. And there will be no old man, nor one who is not satisfied with his days; for all of them will be like children and youths. And all their days they will complete in peace and joy, and they will live, and there will be no Satan and no evil destroyer, for all their days will be days of blessing and healing.
translation:
  language: pt
  text: E os dias começarão a se multiplicar e a aumentar entre os filhos dos homens, de geração em geração e dia após dia, até que os dias deles se aproximem de mil anos e de muitos anos além de muitos dias. Não haverá velho, nem alguém que não esteja satisfeito com os seus dias, pois todos serão como crianças e jovens. Completarão todos os seus dias em paz e alegria, e viverão; não haverá Satanás nem destruidor maligno, pois todos os seus dias serão dias de bênção e cura.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕል
  choice: dias
  rationale: Mantém o termo recorrente do texto e sua ênfase na duração da vida.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Reproduz de modo natural e formal a expressão antropológica do ge'ez.
- source_word: ሕፃናት፡ ወደቂቅ
  choice: crianças e jovens
  rationale: Preserva as duas categorias etárias, sem reduzir ambas a um único termo.
- source_word: ሰይጣነ
  choice: Satanás
  rationale: Transliteração tradicional e amplamente inteligível do nome/título.
- source_word: እኩየ፡ ዘያማስን
  choice: destruidor maligno
  rationale: Conserva tanto a qualidade maligna quanto a função destrutiva da expressão.
- source_word: በረከት፡ ወፈውስ
  choice: bênção e cura
  rationale: Equivalentes diretos que preservam a dimensão de prosperidade divina e restauração.
theological_decisions:
- issue: Identidade do agente maligno na segunda expressão
  choice: destruidor maligno
  alternative: o Maligno que destrói
  rationale: Evita identificar necessariamente a expressão com Satanás, já mencionado separadamente, e conserva a possível distinção entre os agentes.
- issue: Longevidade escatológica
  choice: até que os dias deles se aproximem de mil anos
  alternative: até que cheguem a viver quase mil anos
  rationale: Mantém a formulação temporal e sua tensão própria, sem explicar ou harmonizar a expectativa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara e alguma conservação das repetições enfáticas do original. A expressão difícil 'muitos anos além de muitos dias' foi mantida de maneira relativamente formal para não eliminar a obscuridade genuína do texto transmitido.
