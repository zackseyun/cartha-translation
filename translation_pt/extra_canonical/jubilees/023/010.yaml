revisions:
- from: Pois os dias de vida dos antigos eram de dezenove jubileus[a]. Depois do Dilúvio, porém, sua longevidade começou a diminuir a partir dos dezenove jubileus; eles passaram a envelhecer depressa e a ter os dias de vida encurtados por causa de muitas enfermidades e da maldade dos seus caminhos, com exceção de Abraão.
  to: Pois a duração da vida dos antigos era de dezenove jubileus[a]; mas, depois do Dilúvio, eles começaram a ficar aquém de dezenove jubileus, a envelhecer depressa e a ter os dias de sua vida encurtados por causa de muitas aflições e da maldade de seus caminhos, com exceção de Abraão.
  rationale: A revisão substitui uma formulação potencialmente ambígua sobre a diminuição da longevidade por «ficar aquém de dezenove jubileus», que reproduz mais diretamente o patamar do qual as vidas passaram a ficar abaixo. Também amplia «enfermidades» para «aflições», preservando o alcance do termo-fonte. A exceção final «com exceção de Abraão» permanece sem delimitar artificialmente seu alcance.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:08:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva o número, a referência ao Dilúvio, o envelhecimento acelerado, as aflições, a maldade dos caminhos e a exceção final relativa a Abraão. Contudo, «sua longevidade começou a diminuir a partir dos dezenove jubileus» é menos preciso: o texto descreve pessoas que, após o Dilúvio, passaram a ficar aquém desse patamar de dezenove jubileus, não um processo iniciado “a partir” dele. «Enfermidades» também estreita o sentido mais amplo de «aflições»/«sofrimentos».'
  naturalness: O texto é geralmente fluente. A revisão torna mais idiomática e transparente a noção de não alcançar dezenove jubileus, sem introduzir uma explicação histórica ou teológica.
  terminology: «Jubileus», «Dilúvio», «Abraão» e «maldade de seus caminhos» são adequados. A nota que define o jubileu como ciclo de quarenta e nove anos é apropriada ao sistema cronológico do livro.
  issues:
  - severity: medium
    issue: «diminuir a partir dos dezenove jubileus»
    rationale: Em português, a expressão pode sugerir que a redução começou quando se atingiram dezenove jubileus. O original e a trilha inglesa indicam antes que as vidas posteriores ao Dilúvio passaram a ser inferiores a dezenove jubileus.
  - severity: low
    issue: «muitas enfermidades»
    rationale: O termo-fonte abrange aflições ou sofrimentos e não exige especificamente doenças. «Muitas aflições» conserva melhor a amplitude semântica.
  revised_text: Pois a duração da vida dos antigos era de dezenove jubileus[a]; mas, depois do Dilúvio, eles começaram a ficar aquém de dezenove jubileus, a envelhecer depressa e a ter os dias de sua vida encurtados por causa de muitas aflições e da maldade de seus caminhos, com exceção de Abraão.
