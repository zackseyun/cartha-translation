base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/010.yaml
  text: For the days of the former ones were nineteen jubilees for their lives; but after the Flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, except Abraham.
translation:
  language: pt
  text: Pois a duração da vida dos antigos era de dezenove jubileus[a]; mas, depois do Dilúvio, eles começaram a ficar aquém de dezenove jubileus, a envelhecer depressa e a ter os dias de sua vida encurtados por causa de muitas aflições e da maldade de seus caminhos, com exceção de Abraão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Um jubileu corresponde a um ciclo de quarenta e nove anos.
    reason: Esclarece ao leitor moderno a unidade cronológica própria do livro sem substituí-la no texto.
lexical_decisions:
- source_word: መዋዕለ፡ ቀደምት
  choice: os dias de vida dos antigos
  rationale: Reproduz o sentido temporal e ancestral da expressão em português natural, ligando-a a ለሕይወቶሙ, “para a vida deles”.
- source_word: ዐሠርቱ፡ ወተስዓቱ፡ ኢዮቤልውሳት
  choice: dezenove jubileus
  rationale: Mantém o número e a unidade cronológica característica da obra, sem convertê-la silenciosamente em anos.
- source_word: አይኅ
  choice: Dilúvio
  rationale: Designa o evento específico do relato primevo; a inicial maiúscula deixa clara essa referência.
- source_word: ይኅትጉ
  choice: começou a diminuir
  rationale: Expressa a redução progressiva da longevidade após o Dilúvio.
- source_word: ሕማም፡ ብዙኅ
  choice: muitas enfermidades
  rationale: Preserva a ideia de numerosos sofrimentos ou males físicos; “enfermidades” é digno e corrente.
- source_word: እከየ፡ ፍናዊሆሙ
  choice: a maldade dos seus caminhos
  rationale: Conserva a imagem ética sem explicá-la como uma doutrina mais específica.
- source_word: ዘእንበለ፡ አብርሃም
  choice: com exceção de Abraão
  rationale: Mantém a exceção explícita no final da frase e evita definir além do texto exatamente quais elementos anteriores ela modifica.
theological_decisions:
- issue: Relação entre sofrimento, conduta humana e redução da longevidade
  choice: “por causa de muitas enfermidades e da maldade dos seus caminhos”
  alternative: Explicitar que a redução foi castigo divino pelo pecado
  rationale: O texto apresenta causas, mas não formula explicitamente uma ação punitiva de Deus; a tradução preserva essa tensão sem acrescentar interpretação.
- issue: Alcance da exceção referente a Abraão
  choice: Manter “com exceção de Abraão” em posição final
  alternative: Especificar que somente Abraão não envelheceu depressa ou que somente sua vida não foi encurtada
  rationale: A posição final do original permite que a exceção se relacione com a sequência anterior; não convém restringir seu alcance sem apoio inequívoco.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção foi levemente reorganizada para evitar ambiguidade gramatical artificial: “sua longevidade” explicita aquilo que diminui, enquanto as demais ações continuam atribuídas às pessoas. Preservam-se a unidade “jubileus”, a linguagem figurada dos “caminhos” e o alcance não totalmente definido da exceção de Abraão.'
