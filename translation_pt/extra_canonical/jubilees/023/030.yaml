  yaml_path: translation/extra_canonical/jubilees/023/030.yaml
  text: And then the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies; and the righteous will see and give thanks and rejoice forever and ever with joy.
translation:
  language: pt
  text: Então o SENHOR curará os seus servos, e eles se levantarão e verão uma grande paz, e expulsarão os seus inimigos; e os justos verão, darão graças e se alegrarão com júbilo para todo o sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'እማን
  choice: Então
  rationale: Expressa de modo natural a progressão temporal ou narrativa do conector etíope, sem acrescentar a ideia mais específica de “naquele tempo”.
- source_word: ይፈውሶ
  choice: curará
  rationale: Preserva o sentido de curar ou restaurar e a orientação futura do contexto.
- source_word: ለገብርቲሁ
  choice: os seus servos
  rationale: Equivalente direto e corrente para o substantivo plural com sufixo possessivo.
- source_word: ሰላመ፡ ዐቢየ
  choice: uma grande paz
  rationale: Mantém tanto o substantivo “paz” quanto sua qualificação como grande.
- source_word: ወይሰድዱ፡ ጸላእቶሙ
  choice: e expulsarão os seus inimigos
  rationale: “Expulsar” comunica o ato de fazer os inimigos fugir ou removê-los, sem tornar a frase desnecessariamente bélica.
- source_word: ወያአኵቱ
  choice: darão graças
  rationale: Reproduz o sentido de agradecer ou louvar com gratidão, em português bíblico atual.
- source_word: እስከ፡ ለዓለመ፡ ዓለም
  choice: para todo o sempre
  rationale: Expressão portuguesa natural e dignificada para a fórmula de duração eterna.
- source_word: በፍሥሐ
  choice: com júbilo
  rationale: Conserva o substantivo enfático de alegria festiva sem repetir simplesmente “alegria” após “se alegrarão”.
theological_decisions:
- issue: Identidade dos “servos” e dos “justos”
  choice: Manter os dois grupos conforme a formulação do texto, sem declarar se são exatamente idênticos.
  alternative: Fundir os referentes ou explicitar que os servos são os justos.
  rationale: O versículo aproxima os grupos, mas não resolve explicitamente sua relação; a tradução preserva essa tensão.
- issue: Natureza da cura prometida
  choice: Traduzir simplesmente por “curará”.
  alternative: Especificar cura física, espiritual ou restauração nacional.
  rationale: O verbo admite a ideia geral de cura ou restauração, e o texto não exige uma delimitação doutrinária.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A pontuação separa a última declaração sobre os justos, preservando a sequência do original sem produzir um período excessivamente longo.
