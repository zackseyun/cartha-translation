  text: And they will contend, these with those, and the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and festival and month and Sabbath and Jubilee and all that is appointed.
translation:
  language: pt
  text: 'E eles contenderão uns com os outros: os jovens com os anciãos e os anciãos com os jovens, o pobre com o rico, o humilde com o poderoso e o necessitado com o governante, a respeito da Lei e da aliança, pois se esqueceram do mandamento, da aliança, da festa, do mês, do sábado, do jubileu e de tudo o que foi estabelecido[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão etíope também pode ser entendida mais literalmente como “tudo o que veio a ser” ou “tudo o que aconteceu”; no contexto, parece abranger o conjunto das observâncias estabelecidas.
    reason: Preserva a amplitude e a possível ambiguidade de ኵሎ፡ ዘ ኴነ, cuja tradução contextual “foi estabelecido” é mais específica do que a expressão literal.
lexical_decisions:
- source_word: ይትባአሱ
  choice: contenderão
  rationale: Expressa disputa ou conflito, preservando o tom formal do verbo sem restringi-lo necessariamente a combate físico.
- source_word: ወረዘት
  choice: jovens
  rationale: Mantém o contraste geracional com ሊቃናት de maneira natural e abrangente em português.
- source_word: ሊቃናት
  choice: anciãos
  rationale: Representa pessoas de idade e posição superior no contraste com os jovens, sem acrescentar um cargo religioso específico.
- source_word: ትሑት
  choice: humilde
  rationale: Conserva a ideia de condição baixa ou rebaixada e forma um contraste natural com o poderoso.
- source_word: ዐቢይ
  choice: poderoso
  rationale: No paralelismo social, comunica grandeza ou posição elevada com mais clareza do que o literal isolado “grande”.
- source_word: ሕግ
  choice: Lei
  rationale: Refere-se à Lei como realidade definida no contexto da aliança; a inicial maiúscula sinaliza essa referência sem especificar uma tradição denominacional.
- source_word: በዓል
  choice: festa
  rationale: Termo corrente e digno para uma celebração ou observância religiosa marcada.
- source_word: ሰንበት
  choice: sábado
  rationale: Equivalente português tradicional e semanticamente preciso para o dia sagrado de descanso.
- source_word: እዮቤሌወ
  choice: jubileu
  rationale: Transliteração lexical já estabelecida em português para o ciclo ou observância jubilar.
- source_word: ኵሎ፡ ዘ ኴነ
  choice: tudo o que foi estabelecido
  rationale: Segue o sentido contextual das observâncias ordenadas, mas a formulação etíope é mais ampla; essa amplitude é registrada em nota.
theological_decisions:
- issue: Natureza da disputa sobre a Lei e a aliança
  choice: “a respeito da Lei e da aliança”
  alternative: “contra a Lei e contra a aliança”
  rationale: A preposição etíope indica o assunto ou motivo da contenda, não afirma inequivocamente que os participantes combatem diretamente a Lei e a aliança.
- issue: Valor dos termos temporais no singular
  choice: manter “festa, mês, sábado e jubileu” no singular
  alternative: pluralizar como categorias recorrentes
  rationale: O singular da fonte foi preservado, permitindo que cada termo designe a instituição ou observância como categoria coletiva.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo social preservado. “Uns com os outros” substitui o pouco natural “estes com aqueles”, sem apagar a reciprocidade. A pontuação organiza a longa enumeração, e as designações religiosas permanecem legíveis para um público amplo.
