  text: And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.
translation:
  language: pt
  text: E as cabeças das crianças ficarão brancas de cabelos grisalhos; uma criança de três semanas parecerá tão velha quanto alguém de cem anos, e a estatura delas será destruída pela angústia e pela aflição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስተ፡ ደቂቅ
  choice: a cabeça das crianças
  rationale: Mantém o sentido corporal e coletivo da expressão ge'ez, em português natural.
- source_word: ሠለስት፡ ሱባዔ
  choice: três semanas
  rationale: Traduz literalmente a expressão temporal, sem tentar harmonizá-la com uma idade mais plausível.
- source_word: ልሂቅ
  choice: velha
  rationale: Expressa a aparência de idade avançada atribuída à criança.
- source_word: ይትሐጐል፡ ቍመቶሙ
  choice: sua estatura será consumida
  rationale: Preserva a imagem forte de perda ou definhamento da constituição física, sem reduzi-la apenas a baixa estatura.
- source_word: ምንዳቤ፡ ወፃዕር
  choice: angústia e aflição
  rationale: Conserva o par de sofrimentos do texto-fonte em linguagem digna e corrente.
