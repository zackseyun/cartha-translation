  yaml_path: translation/extra_canonical/jubilees/023/013.yaml
  text: And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; but most of his days are pain and labor and distress, and there is no peace.
translation:
  language: pt
  text: 'E, naqueles dias, se um homem viver um jubileu e meio de anos, dirão a respeito dele: “Ele viveu muitos anos”; mas a maior parte dos seus dias será de dor, trabalho e aflição, e não haverá paz.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልወ፡ ወመንፈቀ፡ ዓመታት
  choice: um jubileu e meio de anos
  rationale: Mantém a forma cronológica característica do texto — setenta e cinco anos — sem substituí-la por uma explicação interpretativa.
- source_word: አብዝኀ፡ ሐይወ
  choice: Viveu muito
  rationale: Expressa naturalmente em português o juízo de longevidade atribuído ao homem.
- source_word: ሕማም፡ ወስራሕ፡ ወምንዳቤ
  choice: dor, trabalho e aflição
  rationale: 'Preserva a tríade do texto-fonte com termos correntes e distintos: sofrimento, labor e angústia.'
- source_word: አልቦ፡ ሰላመ
  choice: não haverá paz
  rationale: Conserva a negação enfática e o sentido amplo de ausência de paz ou bem-estar.
