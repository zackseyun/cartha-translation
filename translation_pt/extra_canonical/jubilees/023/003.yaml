  yaml_path: translation/extra_canonical/jubilees/023/003.yaml
  text: And Jacob awoke from his sleep, and behold, Abraham had grown cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died.
translation:
  language: pt
  text: 'Jacó despertou do sono e viu que Abraão havia ficado frio como granizo.[a] Então disse: “Pai, pai!” Mas ninguém respondeu, e ele percebeu que Abraão havia morrido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “frio como gelo”. O termo etíope pode designar granizo ou gelo.'
    reason: A comparação está explicitamente presente no original, mas o substantivo admite as acepções próximas “granizo” e “gelo”.
lexical_decisions:
- source_word: ነቅሀ፡ ... እምንዋሙ፡
  choice: despertou do sono
  rationale: Reproduz diretamente a ação e conserva o tom narrativo solene em português natural.
- source_word: ወናሁ፡
  choice: e viu que
  rationale: O marcador de apresentação equivale a “e eis”; nesta cena, “e viu que” transmite naturalmente a descoberta de Jacó sem perder a força narrativa.
- source_word: ቈረ፡ አብርሃም፡ ከመ፡ ባረድ፡
  choice: Abraão havia ficado frio como granizo
  rationale: Preserva tanto a mudança de estado expressa pelo verbo quanto a comparação explícita ከመ ባረድ, literalmente “como granizo”; evita omitir a imagem presente na fonte.
- source_word: ወአልቦ፡ ዘነበበ፡
  choice: Mas ninguém respondeu
  rationale: A formulação literal, “não havia quem falasse”, indica a ausência de resposta ao chamado de Jacó. “Ninguém respondeu” é a expressão portuguesa natural nesse contexto.
- source_word: ወአእመረ፡
  choice: e ele percebeu
  rationale: O verbo pode significar conhecer ou saber; “percebeu” exprime a conclusão de Jacó a partir do silêncio e da frieza do corpo.
theological_decisions:
- issue: Identificação do sujeito falecido na oração final
  choice: explicitar “Abraão”
  alternative: “ele havia morrido”
  rationale: Embora o original use uma forma pronominal, repetir o nome elimina em português uma possível referência equivocada a Jacó sem alterar o conteúdo narrativo ou introduzir interpretação teológica.
translation_notes:
  register: Português atual, digno e narrativamente claro, com legibilidade brasileira e vocabulário amplamente internacional. A imagem concreta do original foi mantida, enquanto construções excessivamente literais foram vertidas em sintaxe portuguesa natural.
