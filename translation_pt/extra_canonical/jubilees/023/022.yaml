base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
translation:
  language: pt
  text: E os que tiverem escapado não abandonarão sua maldade para seguir o caminho da justiça, pois todos eles se levantarão em busca de engano e riqueza, cada um para tomar tudo o que pertence ao seu próximo. Farão para si um grande nome, mas não com verdade nem com justiça; e profanarão o Santo dos Santos com sua impureza e com a corrupção de sua contaminação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍኖተ፡ ጽድቅ
  choice: o caminho da justiça
  rationale: Mantém a imagem concreta de um caminho e traduz ጽድቅ pelo termo amplo e corrente “justiça”, sem restringi-lo a uma leitura confessional.
- source_word: ኢይትመየጡ፡ እምነ፡ እከዮሙ
  choice: não abandonarão sua maldade para seguir
  rationale: Expressa em português natural o movimento de afastar-se da maldade em direção ao caminho da justiça, evitando a formulação pouco idiomática “não retornarão de”.
- source_word: ትዕግልት፡ ወውስተ፡ ብዕል
  choice: em busca de engano e riqueza
  rationale: Conserva os dois objetos da ambição humana indicados pelo texto e torna explícita apenas a relação idiomática exigida em português.
- source_word: ዘቢጹ
  choice: o que pertence ao seu próximo
  rationale: “Próximo” reproduz o sentido relacional de companheiro ou semelhante e se encaixa naturalmente na ideia de apropriação dos bens alheios.
- source_word: ቅድስተ፡ ቅዱሳን
  choice: o Santo dos Santos
  rationale: Mantém a expressão superlativa cultual tradicional, sem identificar além do que o texto afirma o lugar ou objeto sagrado em vista.
- source_word: በርኵሶሙ፡ ወበሙስና፡ ግማኔሆሙ
  choice: com sua impureza e com a corrupção de sua contaminação
  rationale: Preserva a acumulação enfática de termos ligados à impureza e à corrupção, mesmo com a densidade retórica do original.
theological_decisions:
- issue: Sentido do afastamento da maldade em relação ao caminho da justiça
  choice: não abandonarão sua maldade para seguir o caminho da justiça
  alternative: não se desviarão de sua maldade no caminho da justiça
  rationale: A escolha comunica o contraste moral e a direção implícita sem sugerir que os sobreviventes já estejam vivendo no caminho justo.
- issue: Referente de “Santo dos Santos”
  choice: manter a expressão sem explicação no corpo do versículo
  alternative: explicitar “o santuário mais santo” ou identificar o templo
  rationale: O texto não resolve de modo inequívoco o referente concreto; preserva-se, portanto, a formulação cultual e sua abertura interpretativa.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura foi dividida em duas frases para clareza, preservando a progressão do original: persistência na maldade, cobiça, busca de renome e profanação cultual.'
