    issue: Referência possessiva final pouco explícita
    rationale: Em «pôs os dois dedos de Jacó sobre os olhos», o português não recupera com clareza que os olhos são os de Jacó, como indica o sufixo possessivo ge'ez. «Sobre os próprios olhos» explicita somente essa ligação já presente no texto-fonte, mantendo indefinido o referente do sujeito verbal.
