  verdict: revise
  source_fidelity: 'A sequência de ações e as expressões-chave correspondem ao ge''ez: os dois dedos de Jacó, «o Deus dos deuses», cobrir o rosto, estender os pés, «o sono eterno» e ser reunido aos pais. Contudo, «sobre os olhos» não deixa claro, em português, que o possessivo final do original se refere a Jacó; a formulação pode ser ajustada sem eliminar a ambiguidade de quem realiza a ação.'
  naturalness: O texto é solene e em geral fluente. «Sobre os próprios olhos» torna mais clara e natural a retomada possessiva, sem introduzir informação interpretativa sobre o sujeito de «colocou».
  terminology: «Deus dos deuses», «sono eterno» e «reunido a seus pais» são escolhas adequadas, literais e não doutrinariamente invasivas. «Bendisse» é aceitável no registro solene e preserva bem o sentido de louvar/bendizer a Deus.
