  yaml_path: translation/extra_canonical/jubilees/023/001.yaml
  text: And he placed Jacob's two fingers upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.
translation:
  language: pt
  text: E ele colocou os dois dedos de Jacó sobre os próprios olhos, bendisse o Deus dos deuses, cobriu o rosto, estendeu os pés, dormiu o sono eterno e foi reunido a seus pais.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጻብዐ፡ ያዕቆብ
  choice: os dois dedos de Jacó
  rationale: Preserva a construção possessiva do ge’ez e a referência explícita a dois dedos, em português natural.
- source_word: አምላክ፡ አማልክት
  choice: o Deus dos deuses
  rationale: Reproduz de modo formal e inteligível a expressão superlativa ou titular do texto-fonte sem explicá-la no corpo do versículo.
- source_word: ኖመ፡ ንዋመ፡ ዘለዓለም
  choice: dormiu o sono eterno
  rationale: Mantém a figura etimológica e o eufemismo solene para a morte presentes no ge’ez.
- source_word: ተጋብአ፡ ኀበ፡ አበዊሁ
  choice: foi reunido a seus pais
  rationale: Conserva a fórmula ancestral do texto-fonte; 'pais' retém a expressão tradicional sem restringi-la apenas ao pai imediato.
theological_decisions:
- issue: Sentido de “Deus dos deuses”
  choice: Manter literalmente “o Deus dos deuses”
  alternative: “o Deus supremo”
  rationale: A formulação original pode funcionar como título de supremacia, mas a tradução não deve resolver silenciosamente suas possíveis nuances teológicas.
- issue: Expressão sobre a morte
  choice: “dormiu o sono eterno”
  alternative: “morreu”
  rationale: Mantém a imagem e a tensão escatológica da expressão original, em vez de substituí-la por uma interpretação explícita.
- issue: Reunião aos antepassados
  choice: “foi reunido a seus pais”
  alternative: “foi reunido a seus antepassados”
  rationale: A opção formal preserva a imagem familiar do original; o contexto permite entender “pais” em sentido ancestral.
translation_notes:
  register: Português moderno, solene e claro, com coordenação narrativa simples e cadência próxima à do texto ge’ez. Não foram necessárias notas de rodapé.
