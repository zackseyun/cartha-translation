  text: In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be no one who will be saved.
translation:
  language: pt
  text: Naqueles dias, eles clamarão, invocarão e orarão para serem salvos da mão das nações pecadoras, mas não haverá ninguém que seja salvo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas ninguém escapará”.'
    reason: Registra a alternativa lexical legítima do verbo intransitivo sem adotar a leitura causativa “ninguém para salvar”.
lexical_decisions:
- source_word: ይጸርሑ፡ ወይጼውዑ፡ ወይጼልዩ
  choice: clamarão, invocarão e orarão
  rationale: 'Preserva a sequência cumulativa de três verbos distintos: clamar, chamar/invocar e orar.'
- source_word: እምእደ
  choice: das mãos
  rationale: Mantém o idioma semítico que expressa poder ou domínio; o plural soa natural em português diante de 'nações'.
- source_word: ኃጥአን፡ አሕዛብ
  choice: nações pecadoras
  rationale: Reproduz de modo direto o qualificativo moral aplicado às nações.
- source_word: ዘይድኅን
  choice: que seja salvo
  rationale: O verbo está na forma básica e tem sentido intransitivo/passivo, 'ser salvo' ou 'escapar', não o causativo 'salvar alguém'.
theological_decisions:
- issue: Sentido da cláusula final
  choice: não haverá ninguém que seja salvo
  alternative: não haverá ninguém para salvar
  rationale: A forma ge'ez ይድኅን favorece 'ser salvo/escapar'. A alternativa transitive requereria a forma causativa e alteraria o referente da afirmação.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo verbal preservado. A expressão idiomática “das mãos” mantém a imagem do texto-fonte, e o subjuntivo “seja salvo” produz uma formulação natural após “não haverá ninguém que”.
