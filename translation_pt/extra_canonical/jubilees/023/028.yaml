  text: And in those days the children will begin to search the law, and to seek the commandments, and to return to the way of righteousness.
translation:
  language: pt
  text: E naqueles dias, os filhos começarão a buscar a lei, a procurar os mandamentos e a voltar ao caminho da justiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቅ
  choice: os filhos
  rationale: Mantém o referente geracional do ge'ez e a continuidade com o contexto, sem especificar indevidamente idade ou sexo.
- source_word: ይትኀሠሡ፡ ሕገገ
  choice: examinar a lei
  rationale: O verbo expressa busca ou investigação diligente; “examinar” comunica de modo natural a ideia de procurar conhecer a lei.
- source_word: ለኀሢሠ፡ ትእዛዝ
  choice: buscar os mandamentos
  rationale: Preserva o paralelismo verbal e o sentido de procurar os mandamentos, sem acrescentar a ideia de obediência, que não está explicitada.
- source_word: ተመይጦ
  choice: voltar
  rationale: Traduz diretamente o movimento de retorno, preservando sua possível dimensão moral sem explicitá-la além do texto.
- source_word: ፍኖተ፡ ጽድቅ
  choice: caminho da justiça
  rationale: Expressão portuguesa natural que mantém a metáfora do caminho e a amplitude semântica de justiça/retidão.
theological_decisions:
- issue: Sentido de “justiça” em ፍኖተ፡ ጽድቅ
  choice: caminho da justiça
  alternative: caminho da retidão
  rationale: “Justiça” conserva a formulação tradicional e a amplitude moral e relacional do termo; evita restringi-lo apenas à conduta correta.
- issue: Relação entre buscar e obedecer aos mandamentos
  choice: buscar os mandamentos
  alternative: procurar cumprir os mandamentos
  rationale: O original declara busca, não explicita cumprimento; a tradução preserva essa tensão e não introduz uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A coordenação em três movimentos reproduz o paralelismo do original sem rigidez excessiva.
