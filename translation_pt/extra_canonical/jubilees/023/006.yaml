  yaml_path: translation/extra_canonical/jubilees/023/006.yaml
  text: And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept for Abraham his father, he and all the house of Abraham, and they wept with great weeping.
translation:
  language: pt
  text: Ouviu-se um som na casa de Abraão. Então Ismael, seu filho, levantou-se e foi até Abraão, seu pai, e chorou por Abraão, seu pai. Ele e toda a casa de Abraão choraram com grande pranto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃል
  choice: clamor
  rationale: Embora o termo possa significar literalmente «voz» ou «som», neste contexto de luto designa naturalmente o clamor ouvido na casa.
- source_word: ተንሥአ
  choice: levantou-se
  rationale: Preserva de modo natural o sentido do verbo ge'ez de erguer-se ou pôr-se de pé.
- source_word: ቤተ፡ አብርሃም
  choice: os da casa de Abraão
  rationale: A expressão refere-se ao conjunto da família e dos integrantes da casa, não apenas ao edifício.
- source_word: ብካየ፡ ዐቢየ
  choice: grande pranto
  rationale: Reproduz o intensificador sem a repetição pouco idiomática «choraram com grande choro».
