  text: and for glory above all days. This law and testimony was given to the children of Israel as an everlasting law throughout their generations.
translation:
  language: pt
  text: e para glória acima de todos os dias. Esta lei e este testemunho foram dados aos filhos de Israel como lei eterna por todas as suas gerações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለስብሐት
  choice: para glória
  rationale: Preserva a preposição prefixada ለ- e o sentido de finalidade ou destinação de ስብሐት, em continuidade com a frase anterior.
- source_word: እምኵሉ፡ መዋዕል
  choice: acima de todos os dias
  rationale: Representa o comparativo introduzido por እም e mantém a referência explícita a todos os dias.
- source_word: ሕግ፡ ወስምዕ
  choice: lei e testemunho
  rationale: Traduz os dois substantivos coordenados sem fundi-los nem explicar indevidamente sua relação.
- source_word: ለደቂቀ፡ እስራኤል
  choice: aos filhos de Israel
  rationale: Equivalente tradicional, claro e formal para a expressão genealógica do texto.
- source_word: ሕገ፡ ዘለዓለም
  choice: lei eterna
  rationale: Expressa a duração permanente indicada por ዘለዓለም com formulação natural em português.
- source_word: ለትውልዶሙ
  choice: por todas as suas gerações
  rationale: Torna explícito o alcance contínuo através das gerações, conforme o valor idiomático da expressão.
theological_decisions:
- issue: Alcance da designação do sábado como lei e testemunho
  choice: Manter a atribuição explícita aos filhos de Israel e às suas gerações
  alternative: Generalizar a obrigação para toda a humanidade
  rationale: O texto nomeia especificamente os filhos de Israel; a tradução não amplia nem restringe além disso.
- issue: Relação entre “lei” e “testemunho”
  choice: Conservar os dois termos coordenados
  alternative: Tratá-los como um único conceito composto
  rationale: A conjunção da fonte permite distinguir os termos, e não há base suficiente para eliminar essa tensão.
