translation:
  language: pt
  text: nele, na terra. E o Criador de tudo o abençoou — aquele que criou este dia para bênção e santidade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E o Criador de tudo abençoou este dia, que havia criado para bênção e santidade.”'
    reason: Registra a alternativa sintática que identifica o pronome objeto com «este dia», sem a adotar no texto principal.
lexical_decisions:
- source_word: ባቲ፡ በዲበ፡ ምድር
  choice: nele, sobre a terra
  rationale: Preserva a frase inicial, inclusive sua ligação fragmentária com o contexto anterior; o pronome é vertido no masculino para concordar naturalmente com “dia” em português.
- source_word: ፈጣሪ፡ ኵሉ
  choice: o Criador de tudo
  rationale: Reproduz de modo direto e natural o título e seu alcance universal.
- source_word: ለበረከት፡ ወለቅድሳት
  choice: para bênção e santidade
  rationale: Mantém os dois substantivos abstratos e a relação de finalidade expressa no ge’ez.
theological_decisions:
- issue: Objeto de “abençoou” e relação da oração relativa
  choice: “o abençoou — ele que criou este dia”
  alternative: “abençoou este dia, que havia criado”
  rationale: A redação principal conserva a sequência sintática do ge’ez e evita fundir silenciosamente o pronome objeto com “este dia”; a leitura mais fluida e integrada é registrada em nota.
translation_notes:
  register: Português atual, claro e digno, com travessão para tornar inteligível a aposição sem eliminar a tensão sintática do original. A abertura permanece deliberadamente fragmentária porque continua a frase do contexto anterior.
