  - severity: low
    issue: «ele que criou» é menos fluente como aposição explicativa.
    rationale: «Aquele que criou» reproduz de modo mais natural a função identificadora da oração relativa ge'ez e mantém a distinção entre o pronome objeto e «este dia».
