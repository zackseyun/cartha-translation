base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/005.yaml
  text: This was the work that he did on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and the dry land to appear.
translation:
  language: pt
  text: Esse foi o trabalho que ele realizou no segundo dia. No terceiro dia, ordenou às águas que se retirassem de toda a superfície da terra para um só lugar e que aparecesse a terra seca.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “disse às águas: ‘Retirem-se de diante da face de toda a terra para um só lugar, e apareça a terra seca’”.'
    reason: A sintaxe do ge’ez permite entender as formas verbais como conteúdo direto da ordem; a nota também preserva a imagem literal da “face” da terra.
lexical_decisions:
- source_word: ገብረ (gabra)
  choice: realizou
  rationale: O verbo tem o sentido amplo de fazer ou realizar; “realizou” soa natural com “trabalho” e preserva a repetição conceitual do texto.
- source_word: ገጸ፡ ለኵላ፡ ምድር (gaṣa la-kwella medr)
  choice: toda a superfície da terra
  rationale: A expressão literalmente alude à “face” de toda a terra; “superfície” comunica esse sentido espacial com clareza em português atual.
- source_word: ውስተ፡ መካን፡ አሐዱ (westa makān aḥadu)
  choice: para um só lugar
  rationale: Mantém a ideia de reunião das águas em um único lugar, em paralelo com Gênesis 1:9.
- source_word: የብስ (yabes)
  choice: terra seca
  rationale: Designa o terreno seco que se torna visível, e não apenas a qualidade abstrata de secura.
theological_decisions:
- issue: Forma indireta ou direta da ordem divina
  choice: 'Discurso indireto: “ordenou às águas que se retirassem... e que aparecesse...”'
  alternative: 'Discurso direto: “disse às águas: ‘Retirem-se... e apareça a terra seca’”'
  rationale: A construção pode refletir uma ordem citada ou uma descrição em discurso indireto. A redação principal segue a sintaxe contextual e mantém os dois verbos paralelos como conteúdo da ordem; a alternativa é registrada em nota.
translation_notes:
  register: Português atual, digno e acessível, com leitura natural no Brasil e compreensão internacional. Evitou-se a capitalização reverencial do pronome, que não é marcada no original. O paralelismo entre as duas ações ordenadas foi preservado.
