base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
translation:
  language: pt
  text: 'Nesse dia, [quem cessar] de todo o seu trabalho será santo e abençoado para sempre.[a] Do mesmo modo, declara e diz aos filhos de Israel o preceito deste dia: que guardem nele o sábado e não o abandonem por erro do coração, para não fazerem nele nenhum trabalho impróprio, nem fazerem nele a própria vontade, nem prepararem nele algo para comer ou beber, nem tirarem água, nem introduzirem ou retirarem por seus portões qualquer carga que eles mesmos não tenham preparado no sexto dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge’ez fornecido parece começar no meio de uma frase. «[quem cessar]» foi suprido para tornar inteligível a oração, sem pretender recuperar as palavras ausentes.
    reason: source_fragment
lexical_decisions:
- source_word: ከማሁ
  choice: Do mesmo modo
  rationale: Expressa continuidade comparativa, isto é, “igualmente/assim”, e não uma simples conjunção.
- source_word: ንገር
  choice: norma
  rationale: No contexto, designa a determinação ou preceito relativo ao dia; “norma” comunica seu caráter regulador sem impor terminologia jurídica mais específica.
- source_word: ያሰንብቱ
  choice: guardem nele o sábado
  rationale: O verbo causativo ligado ao sábado indica observar/celebrar o descanso sabático.
- source_word: በስሕተት፡ ልቦሙ
  choice: pelo desvio do coração
  rationale: Preserva a imagem semítica do coração que se extravia ou erra.
- source_word: ፈቃዶሙ
  choice: o próprio prazer
  rationale: Pode indicar vontade, desejo ou prazer; “próprio prazer” conserva a tensão entre desejo pessoal e santidade sabática.
- source_word: ይጸውር
  choice: carga
  rationale: O termo se refere ao que é carregado ou transportado.
- source_word: በሰዱስ
  choice: no sexto dia
  rationale: Referência direta ao dia anterior ao sábado, sem acrescentar “em suas moradas”, ausente do texto fornecido.
theological_decisions:
- issue: Natureza da observância sabática
  choice: Linguagem imperativa concreta sobre descanso, preparo e transporte
  alternative: Generalizar como princípio espiritual de repouso
  rationale: O texto enumera atos materiais específicos e deve manter seu caráter prescritivo.
- issue: “Próprio prazer” no sábado
  choice: Preservar a formulação ampla
  alternative: Restringir a atividades recreativas ou pecaminosas
  rationale: A fonte não define a extensão da expressão; uma especificação resolveria indevidamente sua ambiguidade.
- issue: Fragmento inicial e sujeito elíptico
  choice: Suprir “quem descansar” entre colchetes e sinalizar em nota
  alternative: Omitir o fragmento, como faz a camada inglesa consultiva
  rationale: A fonte ge’ez fornecida contém a oração inicial, mas parece começar no meio de uma construção; a suplementação mínima torna o português inteligível sem ocultar a dificuldade textual.
translation_notes:
  register: Português moderno, digno e acessível, com “filhos de Israel” preservado como expressão tradicional e “sábado” usado verbalmente na locução natural “guardar o sábado”. A frase inicial é mantida por constar da fonte, embora não apareça na camada inglesa; sua lacuna sintática é assinalada de modo transparente.
