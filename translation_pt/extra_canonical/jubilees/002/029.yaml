    issue: 'A oração inicial suplementada é pouco natural: «[quem descansar] de toda a sua obra».'
    rationale: O ge’ez fornecido começa no meio de uma construção, mas a suplementação editorial deve gerar uma oração portuguesa gramatical. «[quem cessar] de todo o seu trabalho» é uma reconstrução mínima e transparente, mantida entre colchetes e explicada em nota.
  - severity: low
    issue: «Por todos os dias» e «pelo desvio do coração» são formulações pouco idiomáticas.
    rationale: «Para sempre» comunica naturalmente o valor durativo de «por todos os dias», e «por erro do coração» mantém a expressão semítica sem uma construção portuguesa artificial.
  - severity: low
    issue: «O próprio prazer» pode estreitar o campo semântico de ፈቃዶሙ.
    rationale: O termo pode abranger vontade, desejo ou prazer. «A própria vontade» preserva melhor a ambiguidade da fonte.
