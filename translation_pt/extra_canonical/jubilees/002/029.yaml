revisions:
- from: 'Nele, [quem descansar] de toda a sua obra será santo e abençoado por todos os dias.[a] Do mesmo modo, declara e diz aos filhos de Israel a norma deste dia: que guardem nele o sábado e não o abandonem pelo desvio do coração, fazendo nele algum trabalho impróprio, buscando nele o próprio prazer, preparando nele algo para comer ou beber, tirando água ou fazendo entrar ou sair por seus portões qualquer carga que eles mesmos não tenham preparado no sexto dia.'
  to: 'Nesse dia, [quem cessar] de todo o seu trabalho será santo e abençoado para sempre.[a] Do mesmo modo, declara e diz aos filhos de Israel o preceito deste dia: que guardem nele o sábado e não o abandonem por erro do coração, para não fazerem nele nenhum trabalho impróprio, nem fazerem nele a própria vontade, nem prepararem nele algo para comer ou beber, nem tirarem água, nem introduzirem ou retirarem por seus portões qualquer carga que eles mesmos não tenham preparado no sexto dia.'
