base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/004.yaml
  text: 'He made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above, and half of them went down beneath the firmament that is in the midst, over the face of the whole earth. And this alone he made.'
translation:
  language: pt
  text: 'Ele fez sete grandes obras no primeiro dia. No segundo dia, fez o firmamento no meio das águas, e naquele dia as águas foram divididas: metade delas subiu, e metade desceu para debaixo do firmamento que está no meio, sobre a face de toda a terra.[a] E somente isto ele fez.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para debaixo do firmamento, no meio, sobre a face de toda a terra”.'
    reason: A sequência sintática permite relacionar “no meio” de maneira diferente.
  - marker: b
    text: 'Ou, literalmente: “E somente isto”.'
    reason: O original encerra a frase sem repetir o verbo, que é entendido pelo contexto.
lexical_decisions:
- source_word: ሰብዐተ፡ ግብረ፡ ዐበይተ
  choice: sete grandes obras
  rationale: Reproduz diretamente o número, o substantivo e o qualificativo do ge'ez em português natural.
- source_word: ምጽናዓተ
  choice: firmamento
  rationale: Mantém o termo cosmológico tradicional e reconhecível, adequado ao contexto da criação e à ideia de uma estrutura que separa as águas.
- source_word: ማእከለ፡ ማይ
  choice: no meio das águas
  rationale: Preserva a localização espacial expressa pelo ge'ez sem explicar além do texto.
- source_word: መንፈቆሙ
  choice: metade delas
  rationale: Expressa claramente cada uma das duas porções das águas, conservando o paralelismo.
- source_word: ዲበ፡ ገጸ፡ ለኵሉ፡ ምድር
  choice: sobre a face de toda a terra
  rationale: Mantém a imagem e a extensão universal da expressão de origem.
- source_word: ወዘንተ፡ ባሕቲቶ
  choice: E somente isto ele fez
  rationale: Conserva a exclusividade de 'isto somente' e explicita o verbo elíptico a partir do contexto imediato.
theological_decisions:
- issue: Natureza do firmamento
  choice: firmamento
  alternative: expansão
  rationale: O texto descreve uma estrutura que divide as águas; 'firmamento' preserva a formulação cosmológica tradicional sem impor uma interpretação física moderna.
- issue: Referente de 'no meio' na segunda descrição
  choice: o firmamento que está no meio
  alternative: debaixo do firmamento, no meio, sobre a face de toda a terra
  rationale: A leitura adotada liga a expressão ao firmamento e produz sintaxe clara, mas a construção de origem permite outra segmentação; a alternativa é preservada em nota.
- issue: Elipse na frase final
  choice: E somente isto ele fez
  alternative: E somente isto
  rationale: O verbo é suprido pelo contexto para obter português completo, sem acrescentar uma obra ou conceito não expresso.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário bíblico amplamente reconhecível. A coordenação repetida acompanha o estilo narrativo do texto de origem; as notas preservam ambiguidades sintáticas e elípticas reais.
