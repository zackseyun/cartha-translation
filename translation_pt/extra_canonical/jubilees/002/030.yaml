base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/030.yaml
  text: And they shall not bring in or take out from house to house on this day[30], for it is holy and blessed more than any jubilee day of jubilees. On this one we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.
translation:
  language: pt
  text: E, neste dia, não levarão nada para dentro nem tirarão nada para fora, de uma casa para outra, pois ele é santo e bendito mais do que qualquer dia de jubileu dos jubileus.[a] Nesse dia guardamos o sábado nos céus, antes que fosse dado a conhecer a qualquer ser de carne para que o guardasse na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “santo e bendito mais do que qualquer dia de jubileu dos jubileus” é difícil e pode ser uma comparação enfática que eleva o sábado semanal acima até mesmo dos mais elevados ciclos festivos.
    reason: alternative_reading
lexical_decisions:
- source_word: ወኢያብኡ፡ ወኢያውፅኡ፡
  choice: não levarão nada para dentro nem tirarão nada para fora
  rationale: Preserva os verbos contrapostos de introduzir e retirar; “nada” explicita em português o objeto implícito sem especificá-lo.
- source_word: እምቤት፡ ቤተ፡
  choice: de uma casa para outra
  rationale: Expressa de modo natural a construção distributiva referente ao transporte entre casas.
- source_word: ቅድስት፡ ... ወቡርክት፡
  choice: santo e bendito
  rationale: Mantém os dois predicados distintos, sem transformar automaticamente ambos em comparativos.
- source_word: ዕለት፡ ኢዮቤል፡ ዘኢዮቤልውሳት፡
  choice: dia de jubileu dos jubileus
  rationale: Conserva a sequência enfática do ge'ez, inclusive a primeira ocorrência de “jubileu”.
- source_word: አሰንበትነ፡
  choice: guardamos o sábado
  rationale: Traduz a forma verbal ligada ao sábado com a expressão portuguesa corrente, preservando a ação cultual.
- source_word: ለኵሉ፡ ዘሥጋ፡
  choice: a qualquer ser de carne
  rationale: Retém a linguagem antropológica concreta e abrangente da fonte, em vez de reduzi-la simplesmente a “pessoa”.
theological_decisions:
- issue: Comparação entre o sábado e o “dia de jubileu dos jubileus”
  choice: “santo e bendito mais do que qualquer dia de jubileu dos jubileus”
  alternative: “mais santo e mais bendito do que qualquer dia de jubileu dos jubileus”
  rationale: A formulação escolhida acompanha mais de perto a coordenação dos adjetivos e a posição do elemento comparativo, sem resolver a construção difícil além do que a fonte permite.
- issue: Observância celestial anterior à revelação terrestre
  choice: “guardamos o sábado nos céus”
  alternative: “o sábado era guardado nos céus”
  rationale: Mantém a primeira pessoa do plural presente na fonte e evita apagar a identidade narrativa dos falantes.
- issue: Força da oração final sobre a humanidade
  choice: “que deveria guardá-lo na terra”
  alternative: “para guardá-lo na terra”
  rationale: Expressa a observância esperada sem acrescentar uma formulação legal ou confessional mais forte do que o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluidez, mas a repetição enfática de “jubileu dos jubileus” e a linguagem concreta “ser de carne” foram preservadas.
