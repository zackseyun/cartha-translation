  naturalness: O português é claro, moderno e adequado ao registro. «Ser de carne» mantém deliberadamente a concretude antropológica da fonte e funciona em registro bíblico. A formulação final pode ser mais fluida e precisa com «para que o guardasse na terra».
  terminology: «sábado», «santo», «bendito» e «jubileu dos jubileus» são escolhas adequadas e consistentes. A nota preserva corretamente a dificuldade da comparação sem impor uma interpretação doutrinária.
