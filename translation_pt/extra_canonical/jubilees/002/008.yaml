  yaml_path: translation/extra_canonical/jubilees/002/008.yaml
  text: And on the fourth day he made the sun and the moon and the stars, and set them in the firmament of heaven so that they might give light upon all the earth and rule it,
translation:
  language: pt
  text: E no quarto dia ele fez o sol, a lua e as estrelas e os colocou no firmamento do céu, para que iluminassem toda a terra e a governassem,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዕለት ራብዕት
  choice: E no quarto dia
  rationale: Reproduz a transição narrativa e a indicação ordinal do texto ge’ez em português natural.
- source_word: ገብረ
  choice: ele fez
  rationale: Mantém o verbo simples de criação/produção, com o sujeito divino recuperado do contexto.
- source_word: ምጽናዓተ ሰማይ
  choice: firmamento do céu
  rationale: Preserva a imagem cosmológica tradicional e a relação genitiva do original, sem modernizá-la indevidamente.
- source_word: ከመ ያብርሁ
  choice: para que iluminassem
  rationale: Expressa a finalidade e ajusta o verbo ao sujeito plural formado pelos luminares.
- source_word: ወለኰንኖ
  choice: e a governassem
  rationale: Traduz a ideia de reger ou dominar e explicita em português o objeto pronominal feminino, a terra.
theological_decisions:
- issue: A função governante dos luminares
  choice: e a governassem
  alternative: e dominassem sobre ela
  rationale: Mantém a atribuição funcional do original sem explicar seu alcance cosmológico ou teológico; a formulação escolhida é clara e digna em português.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. Conservou-se “firmamento” por sua precisão tradicional e pela imagem cosmológica do texto. A vírgula final foi mantida porque o versículo termina no meio de uma construção que prossegue no contexto.
