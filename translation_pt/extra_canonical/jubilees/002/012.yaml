  footnotes:
  - marker: a
    text: Neste testemunho, o conteúdo apresentado como Jubileus 2:12 forma um bloco contínuo que provavelmente corresponde a várias divisões tradicionais (2:12–28). A numeração foi mantida conforme a segmentação da fonte fornecida.
    reason: segmentation_note
lexical_decisions:
- source_word: ጥዒና (ṭəʿina)
  choice: bem-estar
  rationale: O termo expressa saúde, integridade ou prosperidade. “Bem-estar” conserva essa amplitude sem reduzir o sentido a riqueza material.
- source_word: ዘይሰርር (za-yəsarrər)
  choice: tudo o que voa
  rationale: O verbo se refere a voar; não foi traduzido como “rastejar”, pois os seres que se movem sobre a terra aparecem separadamente na enumeração.
- source_word: ዘመድ (zamad)
  choice: espécie
  rationale: No inventário da criação, o termo designa classes ou tipos de seres e obras. “Espécie” é claro em português sem exigir uma classificação biológica moderna estrita.
- source_word: አስለጦ (ʾaslaṭo)
  choice: deu-lhes autoridade
  rationale: Expressa a concessão de poder ou domínio. “Autoridade” mantém a formulação relacional sem acrescentar uma interpretação específica sobre a extensão desse domínio.
- source_word: ፈቃደቲሁ (faqādatihu)
  choice: sua vontade
  rationale: O substantivo singular significa vontade, desejo ou beneplácito; “sua vontade” segue diretamente o texto e evita substituí-lo por “mandamentos”.
- source_word: አርእስተ፡ ሰብእ (ʾarʾəsta sabʾ)
  choice: antepassados da humanidade
  rationale: Literalmente, “cabeças de homens/humanidade”. No contexto da contagem de Adão a Jacó, “antepassados” comunica a função genealógica de modo inteligível.
theological_decisions:
- issue: Identidade dos demonstrativos em “este” e “aquele”
  choice: Preservar “este” e “aquele” sem explicitar seus referentes
  alternative: Identificá-los interpretativamente como Jacó/Israel e o sábado
  rationale: O texto aproxima os vinte e dois antepassados e as vinte e duas obras, mas a referência exata dos demonstrativos permanece densa e discutível. Explicitá-la eliminaria uma ambiguidade genuína.
- issue: Linguagem de pena de morte pela profanação do sábado
  choice: Manter as fórmulas enfáticas “certamente morrerá” e “morrerá para sempre”
  alternative: Atenuar para “será condenado à morte” ou harmonizar as duas expressões
  rationale: A tradução conserva tanto a ênfase jurídica quanto a tensão interna da formulação, sem decidir se “para sempre” descreve a pena, sua validade ou suas consequências.
- issue: Exortação dirigida ao interlocutor
  choice: 'Traduzir como imperativo: “E ordena aos filhos de Israel”'
