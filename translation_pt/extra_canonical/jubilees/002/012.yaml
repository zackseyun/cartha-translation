revisions:
- from: 'as aves e todas as suas espécies. E o sol nasceu sobre eles para o bem-estar[a], e sobre tudo o que havia na terra: tudo o que brota da terra, toda árvore que dá fruto e toda carne. Essas três espécies ele fez no quinto dia.


    No sexto dia, fez todos os animais selvagens da terra, todos os animais domésticos e tudo o que se move sobre a terra. Depois de tudo isso, fez a humanidade; homem e mulher os fez. Deu-lhes autoridade sobre tudo o que está sobre a terra e nos mares, sobre tudo o que voa, sobre os animais selvagens, sobre os animais domésticos, sobre tudo o que se move sobre a terra e sobre toda a terra. Sobre tudo isso lhes deu autoridade. Quatro espécies ele fez no sexto dia. Ao todo, eram vinte e duas espécies.


    E concluiu toda a sua obra no sexto dia: tudo o que há nos céus, na terra, nos mares, nas profundezas, na luz, nas trevas e em toda parte. E nos deu um grande sinal, o dia de sábado, para que trabalhássemos seis dias e descansássemos de todo trabalho no sétimo dia. E a todos os anjos da presença e a todos os anjos da santificação — essas duas grandes espécies — ele nos disse: “Descansemos com ele no céu e na terra”.


    E ele me disse: “Eis que separarei para mim um povo dentre todos os povos. Eles guardarão o sábado, e eu os santificarei para mim como meu povo e os abençoarei. Assim como santifiquei o dia de sábado, também os santificarei para mim e os abençoarei. Eles serão o meu povo, e eu serei o Deus deles. Escolhi a descendência de Jacó dentre tudo o que vi, registrei-o para mim como meu filho primogênito e o santifiquei para mim para todo o sempre. Eu lhes darei a conhecer o dia de sábado, para que nele descansem de todo trabalho”.


    Assim, ele estabeleceu um sinal para que, no sétimo dia, eles guardassem o sábado conosco, comessem, bebessem e bendissessem aquele que criou todas as coisas, assim como ele abençoou e santificou para si um povo como sua propriedade dentre todas as nações, e para que guardassem o sábado juntamente conosco. E fez sua vontade subir como aroma agradável, aceitável diante dele, todos os dias.


    Houve vinte e dois antepassados da humanidade desde Adão até Jacó, e vinte e duas espécies de obra foram feitas até o sétimo dia. Este é bendito e santo, e aquele também é bendito e santo; tanto este como aquele foram destinados à santidade e à bênção. E a este foi concedido que fossem benditos e santos todos os dias, conforme o testemunho e a primeira lei, assim como foi santificado e abençoado no sétimo dia.


    Ele criou o céu, a terra e tudo o que criou em seis dias, e Deus tornou santo o sétimo dia para todas as suas obras. Por isso, ordenou a respeito dele que todo aquele que nele fizer qualquer trabalho morra, e que quem o profanar certamente morra. E ordena aos filhos de Israel que guardem este dia, que o santifiquem, que nele não façam trabalho algum e que não o profanem, pois ele é mais santo do que todos os outros dias. Todo aquele que o profanar certamente morrerá, e todo aquele que nele fizer qualquer trabalho certamente morrerá para sempre. Assim, os filhos de Israel guardarão este dia por todas as suas gerações e não serão arrancados da terra, pois é um dia santo e um dia bendito. Toda pessoa que o guardar e nele descansar de todo o seu trabalho será santa e bendita por todos os dias, assim como nós.'
