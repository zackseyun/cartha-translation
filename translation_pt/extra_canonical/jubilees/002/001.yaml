base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/001.yaml
  text: 'And the angel of the presence said to Moses by the word of the LORD, saying, "Write the whole account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all."'
translation:
  language: pt
  text: 'E o anjo da presença disse a Moisés, pela palavra do SENHOR: “Escreva todo o relato da criação: como, em seis dias, o SENHOR Deus concluiu todas as suas obras e tudo o que criou; e, no sétimo dia, descansou, santificou esse dia para todas as eras e o estabeleceu como sinal para todos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  choice: anjo da presença
  rationale: Traduz literalmente a expressão etíope e preserva o título tradicional dessa figura em Jubileus.
- source_word: በቃለ፡ እግዚአብሔር፡
  choice: pela palavra do SENHOR
  rationale: Mantém a mediação expressa no texto-fonte sem explicá-la além do original; o nome divino é vertido pela convenção editorial SENHOR.
- source_word: ኵሎ፡ ነገረ፡ ፍጥረት፡
  choice: todo o relato da criação
  rationale: Expressa naturalmente a totalidade do registro ou relato referente à criação.
- source_word: ፈጸመ፡
  choice: concluiu
  rationale: Comunica o sentido de terminar ou levar a cabo, com boa correspondência ao contexto da obra criadora.
- source_word: ወአዕረፈ፡
  choice: descansou
  rationale: Preserva a linguagem tradicional e o paralelismo com o descanso divino no sétimo dia.
- source_word: ወቀደሳ፡
  choice: santificou esse dia
  rationale: O pronome sufixado retoma o sétimo dia; a explicitação de 'esse dia' evita ambiguidade gramatical em português.
- source_word: ለኵሉ፡ ዓለማት፡
  choice: para todas as eras
  rationale: Preserva o alcance temporal plural da expressão, sem reduzi-la simplesmente a 'para sempre'.
- source_word: ትእምርተ፡ ለኵሉ፡
  choice: sinal para todos
  rationale: Mantém a expressão universal final e não acrescenta um referente ausente no texto etíope.
theological_decisions:
- issue: Identidade e função do 'anjo da presença'
  choice: Preservar o título sem interpretação adicional
  alternative: Identificá-lo como anjo de Deus, mediador específico ou manifestação divina
  rationale: O versículo fornece o título, mas não resolve aqui questões de identidade; a tradução conserva essa tensão.
- issue: Referente de 'para todos' na frase final
  choice: Manter 'para todos' sem complemento
  alternative: Traduzir 'para todas as suas obras', 'para todos os povos' ou 'para todas as gerações'
  rationale: O texto-fonte termina com uma expressão universal sem substantivo explícito; acrescentar um referente resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A pontuação organiza a longa fala sem alterar sua estrutura. Não há notas de rodapé, portanto não se usam marcadores.
