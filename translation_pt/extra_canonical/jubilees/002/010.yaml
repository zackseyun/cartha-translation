    issue: “Essas três espécies”
    rationale: “Espécies” normalmente designa categorias biológicas em português e pode levar o leitor a entender que o texto enumera organismos. O ge'ez indica três tipos/classes, sem essa especificação.
  - severity: low
    issue: “para favorecer o florescimento”
    rationale: A formulação acrescenta a ideia verbal de favorecer, enquanto o original traz um sintagma preposicional. “Para o florescimento” é mais direto e conserva melhor a amplitude lexical documentada na nota.
