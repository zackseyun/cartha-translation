  text: And it separates between light and darkness[10], and for prosperity, so that everything that sprouts and grows on the earth may prosper. These three kinds he made on the fourth day.
translation:
  language: pt
  text: para os anos; para distinguir entre a luz e as trevas[a] e para o florescimento[b], a fim de que prospere tudo o que brota e cresce sobre a terra. Estes três tipos ele fez no quarto dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “entre o meio da luz e o meio das trevas”; a expressão é um modo idiomático de dizer “entre a luz e as trevas”.
    reason: previous_rendering
  - marker: b
    text: A expressão também pode ser entendida como “para o bem-estar” ou “para a cura”, referindo-se ao efeito benéfico dos luminares sobre o crescimento na terra.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማእከለ፡ ብርሃን፡ ወማእከለ፡ ጽልመት
  choice: entre a luz e as trevas
  rationale: A construção ge'ez com ማእከለ funciona idiomaticamente como “entre... e...”. A tradução natural evita o literalismo enganoso “entre o meio da luz e o meio das trevas”, preservado em nota como alternativa formal.
- source_word: ለጠዐዮ / ይጥዐይ
  choice: para favorecer o florescimento / prospere
  rationale: A raiz pode expressar bem-estar, melhora, cura ou florescimento. No contexto do que brota e cresce na terra, a linguagem de florescimento e prosperidade comunica o efeito benéfico sem reduzir a polissemia a cura física.
- source_word: ይሠርፅ፡ ወይለቍፅ
  choice: brota e cresce
  rationale: Reproduz com linguagem portuguesa corrente os dois verbos referentes ao surgimento e desenvolvimento da vegetação.
- source_word: ሠለስተ፡ ዘንተ፡ ዘመደ
  choice: Essas três espécies
  rationale: Mantém a ideia de três tipos ou classes, sem especificar além do que o texto afirma.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. O início “para os anos” foi preservado por constar no texto ge'ez, embora complete a sequência do contexto anterior. A ambiguidade da linguagem de prosperidade, cura e florescimento foi mantida por meio de nota.
