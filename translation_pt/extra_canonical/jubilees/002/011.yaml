  yaml_path: translation/extra_canonical/jubilees/002/011.yaml
  text: And on the fifth day he created the great sea monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—
translation:
  language: pt
  text: E, no quinto dia, ele criou os grandes monstros marinhos nas profundezas das águas, pois esses foram os primeiros seres de carne feitos por suas mãos, e todo ser que se move nas águas, e tudo o que voa —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አናብርት፡ ዐበይተ
  choice: grandes monstros marinhos
  rationale: Mantém a imagem de grandes seres aquáticos extraordinários, em consonância com o contexto da criação, sem reduzi-los especificamente a baleias.
- source_word: ማእከለ፡ ቀላያተ፡ ማያት
  choice: nas profundezas das águas
  rationale: Expressa de modo natural a localização no interior profundo das massas de água.
- source_word: ዘሥጋ
  choice: seres de carne
  rationale: Conserva a categoria concreta de seres corpóreos ou carnais presente no texto, sem lhe atribuir sentido moral ou teológico posterior.
- source_word: ኵሎ፡ ዘይትነወስ፡ ውስተ፡ ማያት
  choice: todo ser que se move nas águas
  rationale: Reproduz o sentido abrangente do movimento aquático, evitando uma repetição pouco natural em português.
- source_word: ኵሎ፡ ዘይሰርር
  choice: tudo o que voa
  rationale: Preserva a formulação genérica do trecho, sem antecipar a identificação mais específica que pode vir na continuação.
theological_decisions:
- issue: Referência às criaturas como primeiros seres de carne
  choice: os primeiros seres de carne feitos por suas mãos
  alternative: as primeiras coisas carnais criadas por suas mãos
  rationale: A opção adotada mantém a linguagem antropomórfica do agir divino e deixa 'carne' como categoria de seres vivos, sem introduzir uma conotação moral.
- issue: Identidade dos grandes seres aquáticos
  choice: monstros marinhos
  alternative: grandes criaturas marinhas
  rationale: A tradução conserva a força tradicional e extraordinária do termo, sem especificar uma espécie nem sugerir que sejam seres malignos.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O ponto e vírgula organiza a longa enumeração, e o travessão final indica que a frase continua no versículo seguinte.
