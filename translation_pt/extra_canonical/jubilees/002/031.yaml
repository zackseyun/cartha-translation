base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/031.yaml
  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
translation:
  language: pt
  text: E o Criador de todas as coisas o abençoou, mas não santificou todos os povos e nações para observarem nele o sábado; somente Israel — somente a ele concedeu que comesse, bebesse e observasse nele o sábado, sobre a terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “deu que comesse e bebesse”. No contexto, o sentido é o de conceder essa prerrogativa a Israel.'
    reason: previous_rendering
lexical_decisions:
- source_word: ፈጣሪ፡ ኵሉ
  choice: o Criador de todas as coisas
  rationale: Reproduz com naturalidade o título etíope “Criador de tudo”, sem restringir o alcance de ኵሉ.
- source_word: ለአሰንብቶ፡ ባቲ
  choice: para nele guardarem o sábado
  rationale: O causativo ligado ao sábado expressa a observância ou repouso sabático; “guardar o sábado” é claro, corrente e adequado ao contexto.
- source_word: ወሀበ፡ ይብላዕ፡ ወይስተይ
  choice: concedeu comer, beber
  rationale: Embora ወሀበ signifique literalmente “deu”, aqui introduz ações verbais e comunica concessão ou permissão; “concedeu” evita sugerir apenas o fornecimento de comida e bebida.
- source_word: ባሕቲቱ፡ ሎቱ፡ ለባሕቲቱ
  choice: somente Israel — somente a ele
  rationale: Mantém a repetição enfática e a referência singular coletiva a Israel.
theological_decisions:
- issue: Santificação do sábado e eleição de Israel
  choice: “não santificou todos os povos e nações...; somente Israel”
  alternative: Generalizar a obrigação ou a santificação sabática a todas as nações
  rationale: 'A formulação conserva a afirmação particularista do texto: a observância terrena santificada é concedida exclusivamente a Israel, sem harmonização doutrinária.'
- issue: Natureza da concessão de comer e beber
  choice: “concedeu comer, beber”
  alternative: “deu comida e bebida”
  rationale: O contexto apresenta comer e beber como parte da prerrogativa da observância sabática, não necessariamente como entrega material de alimentos.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção enfática preservada pelo travessão. “Guardar o sábado” comunica a observância sabática de modo natural. O pronome “o” retoma o dia mencionado no contexto anterior.
