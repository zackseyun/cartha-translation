revisions:
- from: E o Criador de todas as coisas o abençoou, mas não santificou todos os povos e nações para nele guardarem o sábado; somente Israel — somente a ele concedeu comer, beber e guardar o sábado nele, sobre a terra.[a]
  to: E o Criador de todas as coisas o abençoou, mas não santificou todos os povos e nações para observarem nele o sábado; somente Israel — somente a ele concedeu que comesse, bebesse e observasse nele o sábado, sobre a terra.[a]
  rationale: A revisão conserva a exclusividade enfática de Israel e a referência ao dia anteriormente mencionado, mas substitui formulações de regência e ordem de palavras menos idiomáticas por construções naturais em português. “Que comesse, bebesse e observasse” também preserva a nuance de concessão expressa no texto-fonte.
