    rationale: “Nele guardarem o sábado” e, sobretudo, “guardar o sábado nele” soam marcados e podem dificultar a identificação de “nele” como referência ao dia. “Observar nele o sábado” é mais idiomático e mantém o sentido de guardar o sábado naquele dia.
  - severity: low
    issue: Regência elíptica de “concedeu comer, beber”
    rationale: Embora compreensível, “concedeu comer” é menos natural em português. “Concedeu que comesse, bebesse e observasse” explicita que se trata de uma permissão ou prerrogativa dada a Israel, preservando a sintaxe concessiva do original.
