  text: And then we saw his works, and we blessed him and offered praise before him on account of all his works, because
translation:
  language: pt
  text: Então vimos as obras dele, nós o bendizemos e oferecemos louvor diante dele[a] por todas as suas obras, porque
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “louvamos diante dele”.'
    reason: A construção pode indicar louvor oferecido em sua presença; esta alternativa preserva a formulação espacial sem a repetição pouco natural de pronomes.
lexical_decisions:
- source_word: ምግባሮ (məgbāro)
  choice: as obras dele
  rationale: O termo designa aquilo que ele fez ou realizou; “obras” preserva a formulação concreta e a repetição do texto-fonte.
- source_word: ባረክናሁ (bāraknāhu)
  choice: nós o bendissemos
  rationale: Mantém o objeto pronominal explícito e o sentido cultual de bendizer, em registro digno e corrente.
- source_word: ሰብሕነ፡ ቅድሜሁ (sabbaḥna qədmēhu)
  choice: oferecemos louvor diante dele
  rationale: Expressa naturalmente em português o ato de louvar realizado em sua presença, sem criar a repetição pouco fluente “nós o louvamos diante dele” nem eliminar a construção espacial do ge'ez.
- source_word: በእንተ፡ ኵሉ፡ ምግባሩ (baʾənta kwəllu məgbāro)
  choice: por todas as suas obras
  rationale: “Por” comunica a razão do louvor, enquanto “todas as suas obras” conserva a abrangência e a repetição lexical do original.
theological_decisions:
- issue: Objeto e destinatário do verbo de louvor
  choice: oferecemos louvor diante dele
  alternative: nós o louvamos diante dele
  rationale: A construção do ge'ez permite entender o louvor como pronunciado diante dele, sem marcar de modo inequívoco um objeto direto. A tradução principal preserva essa nuance; a alternativa fica registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “obras” foi mantida por corresponder à estrutura enfática do original. O versículo termina em “porque”, pois a frase continua no contexto seguinte.
