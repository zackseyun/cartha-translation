  text: Assim fizeram as águas, como ele lhes havia dito, e retiraram-se da face da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማያት
  choice: as águas
  rationale: Equivalente direto e natural do substantivo plural “águas”.
- source_word: በከመ፡ ይቤሎሙ
  choice: exatamente como ele lhes havia ordenado
  rationale: Expressa que as águas agiram conforme a palavra que lhes foi dirigida; “ordenado” torna explícita, de modo natural, a força contextual da fala divina.
- source_word: ወተገብሡ
  choice: e se retiraram
  rationale: Preserva a ideia de recuo ou afastamento das águas, sem acrescentar um destino não expresso.
- source_word: እምዲበ፡ ገጸ፡ ለምድር
  choice: da face da terra
  rationale: Reproduz o sentido espacial de afastamento da superfície da terra em formulação portuguesa digna e corrente.
