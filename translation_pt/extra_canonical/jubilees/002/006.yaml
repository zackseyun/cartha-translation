  register: Português moderno, claro e dignificado, com leve cadência bíblica. Evitou-se conservar qualquer equivalente do termo final ውስተ (“para dentro de/em”), pois o trecho fornecido termina sem complemento expresso; acrescentá-lo produziria uma frase incompleta ou exigiria conteúdo não presente.
