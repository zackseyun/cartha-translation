    rationale: O texto-fonte diz que ele lhes falou/disse, tal como o rastro inglês (“told them”). Embora o contexto possa sugerir autoridade divina, “ordenou” acrescenta uma força ilocutória que não está lexicalmente expressa.
  revised_text: Assim fizeram as águas, como ele lhes havia dito, e retiraram-se da face da terra.
