  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: pt
  text: sobre o dia e a noite e para separar a luz das trevas. E Deus deu o sol como um grande sinal sobre a terra, para os dias, os sábados, os meses, as festas, os anos, os sábados de anos, os jubileus e todas as épocas dos anos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወሀበ፡ እግዚአብሔር፡ ፀሐየ
  choice: E Deus deu o sol
  rationale: Traduz diretamente o verbo ወሀበ, «dar», sem substituí-lo por «designar»; a formulação permanece natural em português.
- source_word: ለትእምርት፡ ዐቢይ
  choice: como um grande sinal
  rationale: Expressa a função indicada pela preposição e conserva o substantivo «sinal» e o adjetivo «grande».
- source_word: ለሰንበታት
  choice: para os sábados
  rationale: Mantém a referência explícita aos sábados, em paralelo com os demais períodos do calendário.
- source_word: ለአውራኅ
  choice: para os meses
  rationale: O plural designa meses; «meses» é claro e corrente, sem recorrer ao possível sentido etimológico ligado às luas.
- source_word: ለበዓላት
  choice: para as festas
  rationale: O termo se refere a festas ou celebrações; «festas» preserva essa especificidade melhor que a expressão mais ampla «tempos determinados».
- source_word: ለሰንበታት፡ ዓመታት
  choice: para os sábados de anos
  rationale: Conserva a construção incomum e conceitualmente importante do texto, sem harmonizá-la com terminologia denominacional posterior.
- source_word: ለኵሉ፡ ጊዜ
  choice: para todas as épocas
  rationale: Traduz literalmente a ideia de «todo tempo» numa forma idiomática adequada à série de ciclos e períodos.
theological_decisions:
- issue: Função calendárica do sol
  choice: Manter a sequência de dias, sábados, meses, festas, anos, sábados de anos e jubileus
  alternative: Resumir a lista como «tempos determinados» ou harmonizá-la com outro relato da criação
  rationale: A enumeração do texto-fonte é teologicamente e literariamente significativa e deve permanecer explícita.
- issue: Deus «deu» ou «designou» o sol
  choice: «Deus deu o sol como um grande sinal»
  alternative: «Deus designou o sol como um grande sinal»
  rationale: A escolha retém o verbo concreto do ge'ez e não resolve por paráfrase a natureza dessa dádiva ou nomeação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A abertura fragmentária foi preservada porque o versículo continua a sintaxe do contexto anterior. Repetições e expressões marcadas, como «sábados de anos», foram mantidas por fidelidade ao texto-fonte.
