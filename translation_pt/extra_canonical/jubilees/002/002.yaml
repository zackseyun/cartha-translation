base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/002.yaml
  text: 'For on the first day he created the heavens above and the earth and the waters and all the spirits that minister before him: the angels of the presence[2], and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of clouds, and of darkness, and of snow and hail and frost, and the angels of the voices and thunder and lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his works that are in the heavens and on the earth and in the seas and in the depths and in darkness and in night and in light and in dawn and in morning, which he prepared in the knowledge of his heart.'
translation:
  language: pt
  text: 'Pois, no primeiro dia, ele criou os céus superiores, a terra, as águas e todos os espíritos que servem diante dele: os anjos da presença[a], os anjos da santificação, os anjos do espírito do fogo, os anjos do espírito das nuvens, das trevas, da neve, do granizo e da geada; os anjos das vozes, dos trovões e dos relâmpagos; os anjos dos espíritos do frio, do calor, do inverno, da primavera, da colheita e do verão; e todos os espíritos de suas obras que estão nos céus, na terra, nos mares, nas profundezas, nas trevas, na noite, na luz, na aurora e na manhã — os quais ele preparou no conhecimento de seu coração.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “anjos da face”. O catálogo de anjos e espíritos elementares é textualmente denso e pode refletir alguma corrupção ou compressão local na tradição etíope; a tradução preserva sua sequência em vez de regularizá-la.
    reason: segmentation_note
  - marker: b
    text: 'Algumas traduções ou tradições textuais trazem variantes como “tarde” em vez de “manhã” e omitem “noite”. Aqui se segue o texto ge''ez fornecido: “trevas, noite, luz, aurora e manhã”.'
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልት
  choice: superiores
  rationale: Qualifica os céus como estando no alto; “céus superiores” preserva a referência espacial sem tornar a expressão artificial em português.
- source_word: ዘይትለአክ
  choice: que servem
  rationale: O verbo exprime prestar serviço ou ministrar diante de alguém; “servem” é natural e mantém a função desses espíritos.
- source_word: መላእክተ ገጽ
  choice: anjos da presença
  rationale: Tradução tradicional e semanticamente próxima de “anjos da face/presença”, preservando a categoria angelológica do texto.
- source_word: ቅዳሴ
  choice: santificação
  rationale: Mantém o substantivo abstrato ligado à santidade, sem reinterpretá-lo como simples louvor ou culto.
- source_word: ቃላት
  choice: vozes
  rationale: Equivalente direto; no catálogo, pode designar vozes ou sons celestes, e a tradução conserva essa abertura sem fundi-lo com “trovões”.
- source_word: ማእረር
  choice: colheita
  rationale: Designa a estação ou o período da ceifa; “colheita” é claro e adequado ao encadeamento sazonal.
- source_word: አእምሮ ልቡ
  choice: conhecimento de seu coração
  rationale: Reproduz de perto “conhecimento/entendimento de seu coração” e respeita a revisão que rejeita “propósito” como menos lexicalmente preciso.
theological_decisions:
- issue: Natureza dos espíritos elementares
  choice: Manter “anjos” e “espíritos” conforme as categorias do catálogo
  alternative: Reformular todos como forças naturais personificadas
  rationale: O texto apresenta seres ministrantes e categorias angelicais associadas aos elementos; uniformizá-los como fenômenos naturais apagaria a cosmologia própria da passagem.
- issue: “Anjos da presença”
  choice: Preservar a expressão técnica
  alternative: “anjos que estão diante dele”
  rationale: A forma nominal mantém a possível classe angelical específica e não reduz a expressão a uma descrição genérica.
- issue: Conhecimento do coração divino
  choice: “no conhecimento de seu coração”
  alternative: “segundo o propósito de seu coração”
  rationale: A alternativa é interpretativa; a opção adotada conserva a formulação cognitiva do ge'ez e sua tensão teológica.
translation_notes:
  register: Português moderno, digno e legível, com coordenação longa preservada por ponto e vírgula para tornar o catálogo compreensível. Evitaram-se termos confessionais adicionais e a lista foi mantida sem harmonização cosmológica.
