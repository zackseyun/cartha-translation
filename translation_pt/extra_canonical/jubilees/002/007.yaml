  text: one place outside this firmament[7], and the dry land appeared. And on that day he created for it all the seas according to their separate gatherings, and all the rivers and the gatherings of the waters in the mountains and in all the earth, and all the lakes and all the dew of the earth, and the seed that is sown, and everything that sprouts, and fruit-bearing trees, and woods, and the Garden of Eden in Eden for delight, and all these four great kinds he made on the third day.
translation:
  language: pt
  text: em um só lugar, fora deste firmamento, e a terra seca apareceu. Naquele dia, ele criou nela todos os mares, cada qual em seu ajuntamento, todos os rios e os ajuntamentos das águas nos montes e em toda a terra, todos os lagos, todo o orvalho da terra, a semente que se semeia, tudo o que brota, as árvores frutíferas, as florestas e o jardim do Éden, no Éden, para deleite. Ele fez todos esses quatro grandes tipos[a] no terceiro dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “todos esses quatro grandes tipos” é difícil, pois o versículo reúne, numa lista condensada, acidentes geográficos, águas, vegetação e o Éden. O número provavelmente resume grupos de elementos, em vez de contar cada item separadamente.
    reason: segmentation_note
lexical_decisions:
- source_word: ጽናዓት
  choice: firmamento
  rationale: Mantém o termo cosmológico tradicional e a referência a uma estrutura firme, sem substituir a imagem antiga por uma explicação moderna.
- source_word: ምትባኢሆሙ
  choice: cada qual em seu ajuntamento
  rationale: Expressa a distribuição dos mares segundo seus respectivos agrupamentos, preservando a formulação distributiva do ge'ez.
- source_word: ምዕቃባተ
  choice: lagos
  rationale: No contexto da enumeração de depósitos e cursos de água, designa reservatórios ou corpos de água; 'lagos' é claro e natural.
- source_word: አማተ
  choice: florestas
  rationale: Conserva o item vegetal distinto que aparece entre as árvores frutíferas e o jardim do Éden e que não deve ser omitido.
- source_word: ተድላ
  choice: deleite
  rationale: Reproduz a ideia de prazer ou deleite associada ao jardim sem acrescentar interpretação doutrinária.
- source_word: ዐበይተ ትውልደ
  choice: grandes categorias
  rationale: A expressão resume classes ou tipos da criação; 'categorias' comunica essa função melhor do que uma referência a gerações biológicas.
theological_decisions:
- issue: Localização do jardim do Éden
  choice: o jardim do Éden, no Éden
  alternative: o jardim do Éden em Éden
  rationale: Preserva a repetição e a possível distinção entre o jardim e a região chamada Éden, sem identificar ou harmonizar os dois conceitos.
- issue: Referente do pronome em ባቲ
  choice: ele criou nela
  alternative: ele criou para ela
  rationale: O feminino singular pode retomar a terra; a leitura locativa é coerente com a criação dos elementos nela, mas a forma não deve receber uma elaboração teológica.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A abertura fragmentária foi preservada porque o versículo continua a frase anterior. A enumeração mantém a amplitude e a compressão do original, e o marcador [a] aparece no texto principal.
