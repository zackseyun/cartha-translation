  yaml_path: translation/extra_canonical/jubilees/043/001.yaml
  text: And Joseph devised a plan by which he might know their thoughts, whether there was a thought of peace among them. And he said to the man who was over his house, "Fill all their sacks with grain, and put their money back in the middle of their bags; and put my silver cup, the cup from which I drink, in the sack of the youngest." And he sent them away.
translation:
  language: pt
  text: 'José elaborou um plano para saber o que eles pensavam, se havia entre eles disposição para a paz. Então disse ao homem que administrava sua casa: “Encha de cereal todos os sacos deles, devolva-lhes o dinheiro, colocando-o no meio de suas bolsas, e ponha a minha taça, a taça de prata da qual bebo, no saco do mais novo”. Depois, mandou-os partir.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለየ፡ ... ሕሊና
  choice: elaborou um plano
  rationale: A construção repete a raiz ligada a pensar ou conceber; em contexto, descreve José formulando deliberadamente um meio de provar os irmãos.
- source_word: ሕሊና፡ ሰላም
  choice: disposição para a paz
  rationale: Expressa naturalmente a ideia literal de um “pensamento de paz” sem reduzir o sentido a mera ausência de conflito.
- source_word: እክለ
  choice: cereal
  rationale: O termo designa grão ou cereal como alimento; “cereal” é claro e adequado ao contexto dos sacos abastecidos.
- source_word: ወርቆሙ
  choice: o dinheiro
  rationale: Embora o substantivo possa denotar ouro, aqui se refere ao pagamento que deveria ser devolvido aos irmãos, conforme o contexto narrativo.
- source_word: ኮራ፡ ዘብሩር
  choice: taça de prata
  rationale: Reproduz diretamente o recipiente identificado pelo material, em português corrente e digno.
