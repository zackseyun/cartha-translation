  text: And they came to Joseph, and all of them bowed down before him with their faces to the ground. And Joseph said to them, "You have done evil." And they said, "What shall we say, and how shall we clear ourselves? Our Lord has found the guilt of your servants."
translation:
  language: pt
  text: 'Então todos se prostraram diante de José, com o rosto em terra. José lhes disse: “Vocês fizeram o mal”. Eles responderam: “O que podemos dizer? Como poderíamos nos justificar? Nosso Senhor descobriu a culpa dos teus servos”.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰገዱ፡ ሎቱ፡
  choice: se prostraram diante de José
  rationale: O verbo expressa prostração ou reverência; a formulação conserva o gesto físico e sua relação com José sem acrescentar ‘casa’, ausente do texto ge'ez.
- source_word: በገጾሙ፡ ውስተ፡ ምድር
  choice: com o rosto em terra
  rationale: Tradução idiomática e fiel da postura descrita literalmente como o rosto voltado para a terra.
- source_word: እኩየ፡ ገበርክሙ፡
  choice: Vocês fizeram o mal
  rationale: Mantém a acusação direta e o valor moral de ‘mal’, sem especificar um delito além do que a fonte declara.
- source_word: ወምነት፡ ንትዋቀስ፡
  choice: Como poderíamos nos justificar?
  rationale: Expressa naturalmente a ideia de apresentar defesa ou demonstrar inocência, em paralelo com Gênesis 44:16.
- source_word: እግዚእነ፡
  choice: Nosso Senhor
  rationale: O título com possessivo significa ‘nosso Senhor’; a inicial maiúscula sinaliza que, neste contexto, os irmãos se referem a Deus, e não a José.
- source_word: አበሳሆሙ፡
  choice: a culpa dos teus servos
  rationale: ‘Culpa’ comunica adequadamente transgressão imputável. ‘Teus servos’ representa a autorreferência humilde dos irmãos diante de José, apoiada pelo contexto e pelo paralelo de Gênesis 44:16.
theological_decisions:
- issue: Identidade de ‘nosso Senhor’
  choice: Deus, indicado pela inicial maiúscula em ‘Senhor’
  alternative: José, como ‘nosso senhor’ em minúscula
  rationale: O paralelo narrativo de Gênesis 44:16 atribui a descoberta da culpa a Deus. A leitura também distingue o agente divino dos ‘teus servos’, dirigidos a José.
- issue: Sentido da culpa confessada
  choice: Preservar a expressão geral ‘a culpa’
  alternative: Especificá-la como o suposto furto da taça ou como a venda de José
  rationale: A fonte não identifica explicitamente a transgressão nesta frase; explicá-la resolveria indevidamente uma tensão narrativa e teológica genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por ‘vocês’ na fala direta e possessivo ‘teus’ na fórmula subordinada ‘teus servos’. O início não acrescenta o verbo ‘vieram’, pois o trecho ge'ez fornecido começa com ‘José’ e prossegue diretamente para a prostração; evita-se importar material não claramente atestado na fonte apresentada.
