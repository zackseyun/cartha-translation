  source_fidelity: 'O texto preserva os elementos atestados no ge''ez apresentado: a prostração coletiva diante de José, o rosto em terra, a acusação de terem praticado o mal, as perguntas retóricas sobre falar e justificar-se, e a atribuição da descoberta da culpa a «Nosso Senhor». Não acrescenta «vieram» nem «à casa de José», que não aparecem no trecho ge''ez fornecido. «Dos teus servos» representa adequadamente a autorreferência dos irmãos dirigida a José, conforme o contexto e o paralelo textual indicado na trilha de auditoria.'
