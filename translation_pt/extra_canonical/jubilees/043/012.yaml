  text: our father loves him, and his life is bound up with his life. And it will happen, when we go to your servant our father, if the boy is not with us, that he will die, and we will afflict our father with sorrow to death.
translation:
  language: pt
  text: nosso pai o ama, e a vida dele está ligada à vida do menino. Quando formos até o teu servo, nosso pai, se o menino não estiver conosco, ele morrerá[a], e afligiremos nosso pai com tristeza, até a morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, ao que tudo indica, nosso pai; o texto diz apenas “ele morrerá”.
    reason: Preserva a forma pronominal da fonte e esclarece seu referente contextual provável sem inseri-lo no texto principal.
lexical_decisions:
- source_word: ነፍስ (nafś)
  choice: vida
  rationale: Embora também possa significar “alma” ou “pessoa”, o contexto fala da ligação vital e afetiva entre o pai e o menino; “vida” preserva o sentido e soa natural em português.
- source_word: ወሬዛ (warezā)
  choice: o menino
  rationale: O substantivo designa o jovem mencionado no contexto; “o menino” identifica o referente sem recorrer ao pronome ambíguo do inglês.
- source_word: ንቀጽዕ (nəqaṣṣəʿ)
  choice: afligiremos
  rationale: O verbo significa afligir, castigar ou punir. “Afligiremos” se ajusta ao resultado de causar ao pai uma tristeza mortal e evita importar o verbo distinto do paralelo de Gênesis 44:31.
theological_decisions:
- issue: Referente do sujeito em “ele morrerá”
  choice: Manter o pronome “ele” no texto
  alternative: “nosso pai morrerá” ou “o velho morrerá”
  rationale: A forma ge’ez traz apenas o verbo na terceira pessoa, sem repetir um substantivo. O contexto aponta para o pai, mas explicitar isso no corpo do texto eliminaria uma ambiguidade gramatical genuína e acrescentaria palavras ausentes da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “a vida dele está ligada à vida deste menino” conserva a imagem da fonte sem recorrer ao mais arcaico “sua alma está ligada à alma dele”. A frase final foi formulada de modo natural para expressar que a tristeza causada ao pai resultará em sua morte.
