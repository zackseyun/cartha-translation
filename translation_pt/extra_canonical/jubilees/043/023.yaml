  register: Português atual, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. “Mudas de roupa” preserva o idioma contextual; “Também enviou” evita uma ordem excessivamente marcada sem perder a ênfase inclusiva de “também”.
