  text: And he gave all of them changes of garments and silver[23]. And to their father also he sent garments and silver.
translation:
  language: pt
  text: E deu a todos eles mudas de roupa e prata.[a] Também enviou ao pai deles roupas e prata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “mudas de roupa” também pode significar “roupas variadas” ou “roupas coloridas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: አልባሰ፡ ኅብር
  choice: mudas de roupa
  rationale: A expressão ge'ez admite os sentidos de variedade, mudança ou cor. Neste contexto, paralelo a Gênesis 45:22, “mudas de roupa” comunica naturalmente o sentido idiomático sem excluir em nota as demais possibilidades lexicais.
- source_word: ብሩረ
  choice: prata
  rationale: Tradução direta do termo ge'ez para prata, provavelmente entendida aqui como riqueza ou prata não especificada, sem acrescentar “moedas” ou “peças” ao texto.
- source_word: ለአቡሆሙ
  choice: ao pai deles
  rationale: Mantém o referente relacional explícito no ge'ez e evita substituir o substantivo pelo nome próprio.
