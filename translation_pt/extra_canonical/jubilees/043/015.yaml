  text: And he could no longer restrain himself, and told them that he was Joseph. And he spoke with them in the Hebrew language.
translation:
  language: pt
  text: E ele já não conseguiu se conter[a] e lhes contou que era José. Então falou com eles na língua hebraica.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto ge''ez preservado diz literalmente: “conteve-se”. É provável que uma negação tenha se perdido na transmissão; o contexto exige o sentido adotado no texto.'
    reason: Registra a leitura formal do manuscrito e explica a tradução contextual sem ocultar a dificuldade textual.
lexical_decisions:
- source_word: ተዐገሦ
  choice: já não conseguiu se conter
  rationale: Embora a forma ge'ez isoladamente signifique que ele se conteve ou se refreou, o contexto da revelação de José e o paralelo narrativo de Gênesis 45:1 exigem sentido negativo; a provável perda de uma negação é indicada em nota, preservando a evidência textual.
- source_word: ነገሮሙ
  choice: lhes contou
  rationale: Expressa naturalmente o ato de informar aos irmãos sua identidade.
- source_word: በከመ፡ ልሳነ፡ ዕብራይስጥ
  choice: na língua hebraica
  rationale: Mantém de modo claro e formal a referência explícita ao idioma hebraico.
theological_decisions:
- issue: Ausência formal de negação em ተዐገሦ
  choice: 'Traduzir pelo sentido contextual: “já não conseguiu se conter”'
  alternative: “conteve-se” ou “refreou-se”
  rationale: A alternativa literal contradiz a ação subsequente de José revelar sua identidade. O contexto e o paralelo com Gênesis 45:1 sustentam uma negação provavelmente perdida na transmissão, sem envolver decisão doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. “Já não conseguiu se conter” reproduz naturalmente a progressão narrativa; “língua hebraica” mantém a formulação explícita da fonte.
