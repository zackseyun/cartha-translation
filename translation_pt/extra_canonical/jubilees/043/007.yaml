  text: I will take him as a slave, and you may go in peace to your houses." And while they were searching in their goods, beginning with the eldest and finishing with the youngest, it was found in Benjamin's sack.
translation:
  language: pt
  text: “Eu o tomarei como escravo, e vocês poderão ir em paz para suas casas.” Enquanto revistavam os pertences deles, começando pelo mais velho e terminando pelo mais novo, o objeto foi encontrado no saco de Benjamim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እነሥእ
  choice: Eu o tomarei
  rationale: A forma verbal é ativa, na primeira pessoa do singular; preserva a declaração direta de José.
- source_word: ገብረ
  choice: como escravo
  rationale: No contexto, o termo indica a condição de servo ou escravo imposta ao homem em cuja bagagem se achasse o objeto.
- source_word: ተአትዉ፡ በሰላም፡ ቤቲክሙ
  choice: vocês poderão voltar em paz para suas casas
  rationale: Expressa em português natural a permissão para entrarem ou retornarem em segurança aos próprios lares.
- source_word: ይፈትኑ፡ ውስተ፡ ንዋዮሙ
  choice: revistavam as bagagens deles
  rationale: O verbo descreve uma busca, e o substantivo abrange os bens ou pertences transportados.
- source_word: ሐስለ፡ ብንያም
  choice: saco de Benjamim
  rationale: Designa o recipiente de transporte pertencente a Benjamim.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa fluente. A voz ativa da primeira oração segue diretamente a gramática ge'ez. “O objeto” evita introduzir aqui um referente específico não expresso neste versículo isolado, embora o contexto anterior o identifique.
