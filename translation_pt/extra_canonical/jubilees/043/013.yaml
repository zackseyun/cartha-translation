  naturalness: «E que eu ... fique» é compreensível, mas pouco natural como abertura de uma súplica em português atual. «Permite que eu ... fique» expressa claramente o pedido e mantém o registro solene. «Fazer voltar» é mais idiomático que «trazer de volta» neste contexto.
  terminology: «Escravo» traduz de modo coerente o termo social repetido no texto. «Fiador» mantém a distinção entre a oferta substitutiva de Judá e a garantia previamente assumida. «Menino» e «jovem» conservam a variação referencial do versículo.
