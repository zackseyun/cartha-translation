base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/013.yaml
  text: And I[13], your slave, remain alone instead of the boy as a slave to my lord, and let the young man go with his brothers, for I became surety for him from the hand of your slave, our father. And if I do not bring him back, your slave will bear the blame before our father all our days.’
translation:
  language: pt
  text: Permite que eu[a], teu escravo, fique sozinho no lugar do menino, como escravo de meu senhor, e que o jovem vá com seus irmãos, pois fui fiador dele perante teu escravo, nosso pai. E, se eu não o fizer voltar, teu escravo carregará a culpa diante de nosso pai por todos os nossos dias.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto ge’ez transmitido é condensado e apresenta algumas irregularidades. A tradução conserva seu sentido principal: Judá se oferece para ficar no lugar do menino e explica a garantia que assumiu perante o pai.'
    reason: segmentation_note
lexical_decisions:
- source_word: ገብርከ
  choice: teu escravo
  rationale: O termo designa alguém em condição de sujeição e é repetido no versículo; “escravo” preserva sua força social, enquanto a formulação possessiva acompanha a fala dirigida ao senhor.
- source_word: ህየንቴሁ
  choice: no lugar do menino
  rationale: 'Expressa substituição: Judá se oferece para permanecer em lugar do jovem.'
- source_word: ተሀበይክዎ
  choice: eu me responsabilizei por ele
  rationale: No contexto paralelo de Gênesis 44:32-33, o verbo comunica a assunção de garantia ou responsabilidade pelo rapaz; a formulação portuguesa é natural e mantém esse sentido.
- source_word: ይሌብከ
  choice: levará a culpa
  rationale: Reproduz a consequência duradoura da falha em devolver o menino, sem acrescentar uma punição específica não expressa no texto.
theological_decisions:
- issue: Natureza da oferta de Judá
  choice: Judá permanece como escravo em substituição ao menino
  alternative: Judá apenas se declara fiador do menino
  rationale: A sequência transmitida distingue a oferta substitutiva (“fique... no lugar do menino”) da explicação posterior de que Judá se responsabilizou por ele.
- issue: Relação da garantia com o pai
  choice: “diante de teu escravo, nosso pai”
  alternative: “da mão de teu escravo, nosso pai”
  rationale: A expressão etíope é idiomática e comprimida; “diante de” comunica em português que a responsabilidade foi assumida perante o pai, sem reproduzir de modo obscuro o semitismo “da mão de”.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega “escravo” para preservar a força do termo social, “menino” e “jovem” para a variação do texto, e sintaxe moderadamente formal adequada ao discurso narrativo.
