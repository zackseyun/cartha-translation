lexical_decisions:
- source_word: በቃለ፡ አፈ፡ ፈርዖን
  choice: por ordem do faraó
  rationale: A expressão etíope, literalmente ligada à ‘palavra da boca de Faraó’, comunica uma ordem ou determinação expressa; a formulação escolhida é natural em português e preserva a autoridade da fala.
- source_word: ሰረገላተ
  choice: carros
  rationale: Refere-se a veículos destinados ao transporte, adequados ao contexto da viagem; ‘carros’ é claro e tradicional sem especificar indevidamente carros de guerra.
- source_word: ስንቀ፡ ለፍኖት
  choice: provisões para a viagem
  rationale: Traduz a ideia de mantimentos ou suprimentos preparados para o caminho em linguagem corrente e precisa.
- source_word: ወወሀቦሙ
  choice: E ... deu-lhes
  rationale: Mantém a coordenação narrativa e o verbo ‘dar’ do texto-fonte, sem explicitar um sujeito que o trecho preserva por contexto.
