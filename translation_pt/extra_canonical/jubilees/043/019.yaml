  text: for preservation[19], go down, you and your households, so that you may not be consumed by the famine and not be distressed on account of your possessions. For God sent me before you quickly, so that they may live.
translation:
  language: pt
  text: Desçam depressa, vocês e os membros de suas casas, para que não sejam consumidos pela fome nem fiquem angustiados por causa de seus bens. Pois, para a preservação[a], Deus me enviou adiante de vocês, para que eles vivam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Também pode ser entendido, de modo mais específico, como «para um remanescente» ou «para a sobrevivência».
    reason: lexical_alternative
lexical_decisions:
- source_word: ፍጡነ፡ ረዱ
  choice: Desçam depressa
  rationale: Preserva o advérbio ፍጡነ, «depressa», junto ao imperativo plural ረዱ, «desçam», em ordem natural no português.
- source_word: አብያቲከሙ
  choice: os membros de suas casas
  rationale: A forma significa literalmente «suas casas», mas aqui designa os integrantes dos respectivos grupos domésticos; a expansão evita que o leitor entenda edifícios.
- source_word: ኢትትሐጐሉ፡ በዐባር
  choice: não sejam consumidos pela fome
  rationale: Expressa a ideia de destruição ou extermínio causado pela fome, sem confundi-la com o verbo de aflição que vem em seguida.
- source_word: ኢትትከዙ
  choice: nem fiquem angustiados
  rationale: O verbo denota tristeza, pesar, preocupação ou aflição, e não perecimento.
- source_word: ጥዕንትከሙ
  choice: seus bens
  rationale: No contexto, refere-se ao patrimônio ou às posses cuja perda poderia causar aflição; «bens» é atual e abrangente.
- source_word: ለሠሪዕ
  choice: para a preservação
  rationale: Mantém a formulação nominal e a abertura semântica entre preservação, sobrevivência e conservação de um remanescente.
- source_word: ይሕየዉ
  choice: para que eles vivam
  rationale: Reproduz a terceira pessoa do plural e a forma não causativa, sem transformá-la em «para que ele mantenha vocês vivos».
theological_decisions:
- issue: Referente do plural em «para que eles vivam»
  choice: Manter o pronome plural «eles» sem explicitar o referente
  alternative: «para que vocês vivam» ou «para conservar vocês com vida»
  rationale: A forma ge'ez é de terceira pessoa plural. Explicitar «vocês» ou atribuir a Deus uma forma causativa resolveria uma tensão gramatical que o texto-fonte deixa aberta.
- issue: Sentido de ለሠሪዕ
  choice: «para a preservação» no texto, com alternativas em nota
  alternative: «para um remanescente» ou «para a sobrevivência»
  rationale: A escolha conserva o propósito providencial sem impor uma leitura teológica mais específica de «remanescente».
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Empregou-se «vocês» para o plural e «membros de suas casas» para comunicar o sentido doméstico de «casas». A ordem da frase segue a evidência ge''ez: «depressa» modifica o comando de descer, enquanto «para a preservação» introduz o propósito de Deus ter enviado José adiante.'
