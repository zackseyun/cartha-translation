  text: And he embraced their necks and wept[16], but they did not recognize him, and they also wept. And he said to them,
translation:
  language: pt
  text: 'E abraçou-os pelo pescoço e chorou[a]; eles, porém, não o reconheceram e também choraram. E ele lhes disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A afirmação “não o reconheceram” pode indicar que, em meio à revelação de José, eles ainda estavam atônitos ou demoraram a reconhecê-lo plenamente.
    reason: alternative_reading
lexical_decisions:
- source_word: ሐቀፈ
  choice: abraçou
  rationale: Verbo correspondente a abraçar; conserva de modo natural a ação do texto-fonte.
- source_word: ክሳውዲሆሙ
  choice: o pescoço deles
  rationale: Mantém a expressão corporal do ge'ez, embora o português também pudesse dizer idiomaticamente 'abraçou-os pelo pescoço'.
- source_word: ኢያእመርዎ
  choice: não o reconheceram
  rationale: No contexto narrativo, o verbo de conhecer assume naturalmente o sentido de reconhecer a identidade da pessoa.
- source_word: አንከ
  choice: também
  rationale: 'Expressa a adição indicada pela partícula: eles igualmente choraram.'
theological_decisions:
- issue: A aparente continuidade da falta de reconhecimento após a manifestação de José
  choice: 'Preservar literalmente: “não o reconheceram”'
  alternative: Interpretar como espanto, hesitação ou reconhecimento ainda incompleto
  rationale: O ge'ez afirma a falta de reconhecimento sem explicar sua natureza; a tradução conserva a tensão narrativa e remete a possibilidade interpretativa à nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A construção “o pescoço deles” preserva de perto a imagem do original; “eles, porém” torna explícito em português o contraste marcado no ge'ez. A frase termina com dois-pontos porque introduz a fala do versículo seguinte.
