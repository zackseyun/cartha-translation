  text: a numerous people. And tell my father that I am still alive, and look, you yourselves see that God has made me as a father to Pharaoh and as ruler in his house,
translation:
  language: pt
  text: um povo numeroso. Digam ao meu pai que ainda estou vivo e eis que vocês mesmos veem que Deus me estabeleceu como pai do faraó[a] e como governante em sua casa,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pai do faraó” é uma designação figurada de elevada autoridade e proximidade junto ao faraó, não uma afirmação de parentesco.
    reason: Evita uma leitura biológica da expressão sem eliminar a metáfora do texto-fonte.
lexical_decisions:
- source_word: ሕዝብ፡ ብዙኃን
  choice: um povo numeroso
  rationale: Mantém o fragmento nominal do texto-fonte e expressa naturalmente a ideia de grande quantidade de pessoas.
- source_word: ወዜንውዎ፡ ለአቡየ
  choice: Contem a meu pai
  rationale: Traduz o imperativo plural e o objeto indireto de modo claro e corrente.
- source_word: ዓዲ፡ ሕያው፡ አነ
  choice: ainda estou vivo
  rationale: Preserva a afirmação enfática de que o falante continua vivo.
- source_word: አንትሙኒ፡ ናሁ፡ ትሬእዩ
  choice: 'Vejam: vocês mesmos podem ver'
  rationale: Conserva tanto a partícula de atenção quanto a ênfase no pronome plural, com formulação natural em português.
- source_word: ሠርዐኒ፡ እግዚአብሔር
  choice: Deus me estabeleceu
  rationale: Expressa a ação divina de designar ou colocar o falante em determinada posição sem tornar o sentido excessivamente técnico.
- source_word: ከመ፡ እመብል፡ ውስተ፡ ቤቱ
  choice: como governante em sua casa
  rationale: Mantém a função de autoridade administrativa no âmbito da casa de faraó.
theological_decisions:
- issue: Agência divina na elevação de José
  choice: Deus me estabeleceu
  alternative: Deus permitiu que eu me tornasse
  rationale: O texto atribui diretamente a Deus a ação de colocar José nessa posição; a alternativa enfraqueceria essa agência.
- issue: Expressão figurada “pai do faraó”
  choice: Preservar literalmente a imagem no texto e esclarecê-la em nota
  alternative: conselheiro do faraó
  rationale: A metáfora de parentesco pertence ao texto-fonte e pode envolver autoridade, cuidado ou aconselhamento; substituí-la por uma única função resolveria indevidamente sua amplitude.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação mantém o caráter fragmentário do início e a continuidade indicada pela vírgula final. “Vocês mesmos” reproduz a ênfase do plural sem recorrer a formas excessivamente solenes.
