  text: '“Seremos escravos de nosso senhor.” E ele lhes disse: “Não será assim. O homem com quem o encontrei — somente ele...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንትቀነይ
  choice: seremos escravos
  rationale: O verbo expressa sujeição ou serviço em condição de escravidão; esta formulação preserva a força da declaração no contexto.
- source_word: ለእግዚእነ
  choice: de nosso senhor
  rationale: Mantém a referência possessiva ao senhor humano a quem os irmãos se dirigem, sem acrescentar identificação ausente no texto.
- source_word: አኮ፡ ከማሁ
  choice: Não será assim
  rationale: Equivalente português natural para a negação enfática de que a proposta anterior seja aceita.
- source_word: ዘረከብክዎ
  choice: com quem o encontrei
  rationale: A forma verbal é ativa, na primeira pessoa do singular, com objeto na terceira pessoa; por isso, preserva-se explicitamente 'encontrei', em vez de uma construção passiva.
- source_word: ኪያሁ፡ ባሕቲቶ
  choice: somente o homem
  rationale: Expressa a restrição enfática de que apenas aquele homem sofrerá a consequência mencionada na continuação.
