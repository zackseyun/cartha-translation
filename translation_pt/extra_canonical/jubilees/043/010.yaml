  text: his slaves. Look, we are slaves to our lord, we and our donkeys also." And Joseph said to them, "God forbid that I should do this[10]. You, go to your houses; but your youngest brother shall be my slave, because you have done evil. Did you not know that a man surely divines with his cup, as I do?
translation:
  language: pt
  text: 'seu escravo. “Vejam, nós somos escravos do nosso senhor, tanto nós como também os nossos jumentos.” José lhes disse: “Deus me livre de fazer isso![a] Vocês, vão para as suas casas, mas o irmão mais novo de vocês será meu escravo, pois vocês praticaram o mal. Não sabiam que um homem certamente pratica adivinhação com seu cálice, como eu faço?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão ge’ez traduzida por “Deus me livre de fazer isso” é difícil. Pelo contexto, José rejeita enfaticamente a proposta de que todos se tornem escravos e insiste que apenas o irmão mais novo permaneça.
    reason: textual_variant
lexical_decisions:
- source_word: አግብርት / ቅኔየ
  choice: escravos / meu escravo
  rationale: Os termos indicam sujeição e propriedade, não apenas serviço voluntário; “escravo” preserva a força social e jurídica do texto.
- source_word: አእዱጊነ
  choice: nossos jumentos
  rationale: Tradução direta do substantivo plural referente aos animais de carga.
- source_word: እኑክሙ
  choice: o irmão mais novo de vocês
  rationale: No contexto da narrativa, o referente é Benjamim, o irmão mais novo; a forma ge’ez é textualmente difícil, mas essa identificação é sustentada pelo contexto imediato.
- source_word: ያስተቀስም ... ጽዋዖ
  choice: pratica adivinhação com seu cálice
  rationale: Mantém a referência explícita à adivinhação por meio do cálice, sem suavizar nem explicar teologicamente a afirmação.
theological_decisions:
- issue: Atribuição de adivinhação a José
  choice: “pratica adivinhação com seu cálice, como eu faço”
  alternative: Interpretar a fala como mero disfarce ou como capacidade sobrenatural não divinatória
  rationale: O texto apresenta a afirmação na fala de José; a tradução conserva a tensão narrativa sem decidir se ela é literal, fingida ou estratégica.
- issue: Fórmula difícil após “José lhes disse”
  choice: “Deus me livre de fazer isso” com nota
  alternative: “Deus não permita que eu tema”
  rationale: 'A formulação ge’ez é obscura. A tradução adotada corresponde ao sentido contextual: José rejeita enfaticamente a proposta de escravizar todos e determina que apenas o mais novo permaneça.'
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se “escravo” para a condição de sujeição, “jumentos” para os animais e “cálice” para o objeto narrativo. O início fragmentário foi preservado por ser continuação do versículo anterior.
