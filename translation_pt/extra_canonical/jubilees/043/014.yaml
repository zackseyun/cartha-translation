lexical_decisions:
- source_word: ልበ፡ ኵሎሙ፡ ዕሩይ
  choice: o coração de todos eles estava unido
  rationale: Preserva a imagem semítica do coração coletivo e a ideia de união ou concordância expressa pelo ge'ez.
- source_word: ብእሲ፡ ምስለ፡ ካልኡ
  choice: cada um ao outro
  rationale: Reproduz a reciprocidade da expressão, em português claro e próximo da forma da fonte.
- source_word: ለሠናይ
  choice: para o bem
  rationale: Mantém o sentido ético e final da expressão sem especificar além do texto.
- source_word: ወበአከ
  choice: e chorou
  rationale: Verte diretamente o verbo de chorar, cujo sujeito no contexto é José.
