  yaml_path: translation/extra_canonical/jubilees/043/017.yaml
  text: Do not weep over me, but hurry and bring my father to me, and you see that it is my mouth that speaks, and the eyes of my brother Benjamin also see. For behold, this is the second year of the famine,
translation:
  language: pt
  text: Não chorem por mim. Depressa, tragam meu pai até mim. Vocês veem[a] que é a minha boca que fala, e os olhos de meu irmão Benjamim também veem. Pois eis que este é o segundo ano da fome.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês verão”.'
    reason: O valor verbal pode ser entendido como presente ou futuro.
  - marker: b
    text: Isto é, o segundo ano em que há fome.
    reason: Esclarece a relação genitiva concisa sem inserir essa expansão no texto principal.
lexical_decisions:
- source_word: ኢትብከዩ፡ ላዕሌየ
  choice: Não chorem por mim
  rationale: Reproduz diretamente a proibição no plural e o sentido de chorar por causa de José.
- source_word: ወአፍጥኑ፡ ወእምጽእዎ፡ ለአቡየ፡ ኀቤየ
  choice: Depressa, tragam meu pai até mim
  rationale: Mantém a urgência do verbo e o movimento do pai em direção ao falante, em português natural.
- source_word: ወትሬእዩ
  choice: Vocês veem
  rationale: O imperfeito pode ter valor presente ou futuro; o presente se ajusta à situação imediata em que os irmãos presenciam José falando.
- source_word: ዘይነብብ፡ አፉየ
  choice: que é a minha boca que fala
  rationale: Preserva a construção enfática do texto-fonte, em vez de reduzi-la simplesmente a 'sou eu que falo'.
- source_word: ወአዕይንቲሁኒ፡ ለአኁየ፡ ብንያም፡ ይሬእያ
  choice: e os olhos de meu irmão Benjamim também veem
  rationale: Conserva tanto a referência explícita aos olhos quanto a partícula aditiva 'também'.
- source_word: እስመ፡ ናሁ፡ ዝንቱ፡ ካልእ፡ ዓም፡ ዘዐባር
  choice: Pois eis que este é o segundo ano da fome
  rationale: Traduz de modo direto 'segundo ano' e o genitivo 'da fome', sem acrescentar a ideia não expressa de continuação.
