  text: over all the land of Egypt. And their father did not believe them, for his mind was stunned. But when he saw the wagons that Joseph had sent, the life of his spirit was renewed, and he said, "It is enough for me if Joseph is alive. I will go down and see him before I die."
translation:
  language: pt
  text: 'sobre toda a terra do Egito. O pai deles não acreditou no que diziam, pois sua mente ficou atônita. Mas, quando viu as carroças que José havia enviado, a vida de seu espírito se renovou, e ele disse: “Basta-me que José esteja vivo. Descerei e o verei antes de morrer.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደንገፀ፡ በሕሊናሁ
  choice: ficou atônito em seu íntimo
  rationale: Expressa o abalo ou entorpecimento interior indicado pela construção, em português natural, sem reduzir o sentido apenas a uma reação intelectual.
- source_word: ሰረገላተ
  choice: carroças
  rationale: No contexto do transporte enviado por José, “carroças” é claro e historicamente adequado; “carruagens” sugeriria um veículo de prestígio ou de passageiros.
- source_word: ተሐደሰት፡ ሕይወተ፡ መንፈሱ
  choice: a vida de seu espírito se renovou
  rationale: Mantém de perto a imagem antropológica do texto, sem substituí-la pela formulação bíblica paralela mais idiomática “seu espírito reviveu”.
- source_word: ዐቢይ፡ ውእቱ፡ ሊተ፡ እመ
  choice: Basta-me que
  rationale: 'Comunica de modo natural a ideia de suficiência, preservando a relação condicional ou factual da frase: saber que José vive basta ao pai.'
- source_word: እረድ
  choice: Descerei
  rationale: Conserva a linguagem geográfica tradicional de descer ao Egito.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O fragmento inicial foi mantido em minúscula por continuar sintaticamente o versículo anterior. “No que diziam” explicita o objeto implícito de “não acreditou”, exigido pela fluência em português, sem acrescentar conteúdo interpretativo substancial.
