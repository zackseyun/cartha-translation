  text: And it happened[3], when they had gone out from there, Joseph said to the man of his house, "Pursue them, run and overtake them, saying, 'Instead of good you have repaid me evil; you have stolen from me the silver cup from which my lord drinks.' And bring back to me their youngest brother, and bring him quickly before I enter into my judgment."
translation:
  language: pt
  text: 'E aconteceu que, quando eles saíram dali, José disse ao homem de sua casa: “Persiga-os; corra e alcance-os, dizendo: ‘Em troca do bem, vocês me retribuíram com o mal; roubaram de mim a taça de prata da qual meu senhor bebe’. E traga de volta para mim o irmão mais novo deles e traga-o depressa, antes que eu entre em meu julgamento”.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A cláusula final deste versículo é textualmente difícil nesta segmentação. O sentido parece ser uma exigência urgente para que o irmão mais novo seja trazido de volta antes que a questão seja julgada; a expressão exata é incerta.
    reason: segmentation_note
lexical_decisions:
- source_word: ደግፎሙ
  choice: Persiga-os
  rationale: O contexto e a provável forma variante sustentam o sentido de perseguir ou ir atrás deles, sem acrescentar a ideia de ‘levantar-se’.
- source_word: ህየንተ፡ ሠናይት፡ ዐሠይክሙኒ፡ እኩየ
  choice: Em troca do bem, vocês me retribuíram com o mal
  rationale: Mantém o valor de ህየንተ, ‘em lugar de/em troca de’, e expressa naturalmente o contraste entre bem e mal.
- source_word: ሠረቅክሙኒ
  choice: roubaram de mim
  rationale: Preserva o sufixo de primeira pessoa singular presente no verbo ge'ez.
- source_word: ለአኁሆሙ፡ ዘይንእስ
  choice: o irmão mais novo deles
  rationale: A terceira pessoa plural mostra que esta é uma ordem de José ao homem de sua casa, não continuação das palavras dirigidas aos irmãos.
- source_word: ዘእንበለ
  choice: antes que
  rationale: Representa o sentido temporal ‘antes de’, evitando a leitura modal ‘para que não’ ou ‘a fim de que não’.
- source_word: ውስተ፡ ምኵናንየ
  choice: entre em meu julgamento
  rationale: Conserva de modo formal a construção e o possessivo do texto, embora a expressão seja difícil nesta segmentação.
