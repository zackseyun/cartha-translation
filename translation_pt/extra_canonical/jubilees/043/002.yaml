  text: And he did as Joseph told him, and filled all their sacks with grain, and put their money in their sacks; and he put the cup in Benjamin's sack. And when morning dawned, they went away.
translation:
  language: pt
  text: 'Ele fez como José lhe havia dito: encheu de cereal todos os sacos deles, pôs também o ouro deles nos sacos e colocou a taça no saco de Benjamim. Ao amanhecer, eles partiram.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሲሊተ
  choice: cereal
  rationale: O termo designa grão ou cereal; “cereal” é natural em português e expressa o conteúdo com que os sacos foram enchidos.
- source_word: ወርቆሙ
  choice: o ouro deles
  rationale: A fonte ge’ez diz literalmente “o ouro deles”. A tradução mantém esse dado concreto, sem substituí-lo interpretativamente por “dinheiro”.
- source_word: ኮራ
  choice: taça
  rationale: No contexto, o termo se refere ao recipiente colocado no saco de Benjamim; “taça” é corrente, claro e condiz com o objeto narrativo.
- source_word: አሕስሊሆሙ / ሐስለ
  choice: sacos / saco
  rationale: As formas relacionadas indicam os sacos usados para transportar o cereal; a variação singular/plural da fonte foi preservada.
