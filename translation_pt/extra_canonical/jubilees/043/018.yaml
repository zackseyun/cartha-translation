  text: And there are still five years in which there will be no plowing, and no fruit of trees, and no harvest.
translation:
  language: pt
  text: E ainda restam cinco anos em que não haverá aração, nem fruto das árvores, nem colheita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዓዲ
  choice: E ainda restam
  rationale: Expressa a continuidade indicada por «e ainda» e, em português natural, liga essa ideia aos cinco anos restantes.
- source_word: ማእረር
  choice: lavoura
  rationale: Representa o trabalho agrícola, entendido no contexto como lavrar ou cultivar a terra, sem restringir a frase apenas ao ato de arar.
- source_word: ፍሬ፡ ዕፅ
  choice: fruto das árvores
  rationale: Tradução direta da construção «fruto de árvore/árvores», com plural natural em português.
- source_word: ሐፅስ
  choice: colheita
  rationale: Conserva o sentido agrícola do termo e a distinção em relação à lavoura e ao fruto das árvores.
