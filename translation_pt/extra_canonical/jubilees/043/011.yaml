  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
translation:
  language: pt
  text: 'E Judá disse: “Por favor, meu senhor, permite que teu servo diga uma palavra ao ouvido de meu senhor. A mãe dele deu à luz dois irmãos para teu servo, nosso pai.[a] Um deles saiu e se perdeu, e ninguém o encontrou. Só ele restou de sua mãe, e teu servo...”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nosso pai, teu servo, teve dois filhos da mesma mãe.”'
    reason: A construção ge'ez é incomum em português e admite uma formulação idiomática que explicita a relação familiar pretendida.
lexical_decisions:
- source_word: ሳዕሌየ፡ እግዚኦ፡
  choice: Por favor, meu senhor
  rationale: Expressa de modo natural e respeitoso a súplica dirigida ao senhor, sem intensificá-la além do texto.
- source_word: አትናገር፡ ገብርከ፡ ቃለ፡ ውስተ፡ እዝነ፡ እግዚእየ፡
  choice: permite que teu servo diga uma palavra aos ouvidos de meu senhor
  rationale: Mantém a imagem formal de falar aos ouvidos do senhor e a autodesignação humilde como servo.
- source_word: ክልኤተ፡ አኀወ፡ ወለደት፡ እሙ፡ ለገብርከ፡ ለአቡነ፡
  choice: A mãe dele deu à luz dois irmãos a teu servo, nosso pai
  rationale: 'Conserva os elementos explícitos do ge''ez: mãe, deu à luz, dois irmãos, teu servo e nosso pai, apesar da sintaxe incomum.'
- source_word: ወፅአ፡ ወተገደፈ፡
  choice: saiu e se perdeu
  rationale: Reproduz a sequência verbal e comunica naturalmente que o irmão saiu e ficou perdido/desaparecido.
- source_word: ወአልቦ፡ ዘተረክበ፡
  choice: e ninguém o encontrou
  rationale: Traduz diretamente a ausência de alguém que o tenha encontrado.
- source_word: ወውእቱ፡ ባሕቲቱ፡ ተረፈ፡ እምእሙ፡
  choice: Só ele restou de sua mãe
  rationale: Preserva a ênfase em ele ser o único remanescente de sua mãe, sem substituir o referente por uma expressão deítica.
