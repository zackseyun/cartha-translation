  to: 'E Judá disse: “Por favor, meu senhor, permite que teu servo diga uma palavra ao ouvido de meu senhor. A mãe dele deu à luz dois irmãos para teu servo, nosso pai.[a] Um deles saiu e se perdeu, e ninguém o encontrou. Só ele restou de sua mãe, e teu servo...”'
