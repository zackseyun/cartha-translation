  text: And he ran after them and spoke to them according to this word. And they said to him, "Far be it from your servants to do this thing, and to steal from your lord's house any money or gold. The money that we found before in our sacks we, your servants, brought back from the land
translation:
  language: pt
  text: 'Ele correu atrás deles e lhes falou conforme esta palavra. Eles lhe disseram: “Longe de teus servos fazer tal coisa e roubar da casa de teu senhor dinheiro algum ou ouro.[a] O dinheiro que antes encontramos em nossos sacos, nós, teus servos, trouxemos de volta da terra'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “qualquer bem ou riqueza”.'
    reason: Registra o alcance possível de ንዋይ como bens ou riqueza, além do sentido contextual de dinheiro.
lexical_decisions:
- source_word: በከመ፡ ዝንቱ፡ ነገር
  choice: conforme essas palavras
  rationale: Reproduz de modo natural a ideia de falar segundo a mensagem ou declaração anteriormente dada, sem tornar a expressão mais específica do que o ge’ez.
- source_word: ሐሰ፡ ሎሙ፡ ለአግብርቲከ
  choice: Longe de teus servos
  rationale: Mantém a fórmula enfática de repúdio e o tratamento respeitoso em segunda pessoa singular.
- source_word: ምነተኒ፡ ንዋየ፡ ወወርቀኒ
  choice: qualquer quantia ou ouro
  rationale: ንዋይ pode designar bens, riqueza ou dinheiro; no contexto de roubo da casa e em paralelo com ouro, “quantia” comunica dinheiro sem harmonizar indevidamente com “prata” de Gênesis 44:8.
- source_word: ዘረከብነ፡ ቀዳሙ፡ ውስተ፡ አኅጢነ
  choice: O dinheiro que antes encontramos em nossos sacos
  rationale: Expressa claramente a referência ao valor encontrado anteriormente nos sacos, preservando a sequência narrativa.
