  language: pt
  text: e sobre toda a terra do Egito. Contem ao meu pai toda a minha honra e tudo o que me foi dado.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክብረየ (kəbraya)
  choice: a honra que recebi
  rationale: O termo significa literalmente “minha honra/glória”. A formulação escolhida soa natural em português e, neste contexto, comunica a posição honrosa alcançada por José sem ampliar o sentido para riquezas ou prestígio específicos.
- source_word: ኵሎ፡ ዘመጠነ፡ ወሀበኒ
  choice: tudo o que me foi dado
  rationale: Mantém a formulação abrangente e passiva do texto, sem acrescentar explicitamente Deus, riquezas ou glória, elementos não declarados nesta expressão.
- source_word: ዜንውዎ፡ ለአቡየ
  choice: Contem a meu pai
  rationale: Expressa de modo corrente o verbo de relatar/anunciar e conserva o pai como destinatário.
theological_decisions:
- issue: Identidade de quem concedeu o que José recebeu
  choice: 'Preservar a construção passiva: “me foi dado”'
  alternative: “Deus me deu”
  rationale: Embora Deus possa ser entendido como o agente no contexto teológico, ele não é nomeado nesta oração; explicitá-lo resolveria uma informação deixada implícita no texto.
translation_notes:
  register: Português moderno, digno e de leitura fluente. O início em minúscula preserva o fato de que o versículo começa como continuação sintática do anterior. Evitou-se a expansão interpretativa para “riquezas e glória”.
