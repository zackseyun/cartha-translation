  text: and ten donkeys carrying grain. And he sent them away. And they went up and told their father that Joseph was alive, and that he was distributing grain to all the peoples of the earth and ruling.
translation:
  language: pt
  text: e dez jumentos carregados de cereal. Então ele os despediu. Eles subiram e contaram ao pai deles que José estava vivo, que distribuía cereal a todos os povos da terra e governava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስርናየ
  choice: cereal
  rationale: O termo designa grão, especialmente trigo; “cereal” preserva o sentido abrangente e soa natural no contexto de provisões.
- source_word: ዐርጉ
  choice: subiram
  rationale: Mantém o movimento geográfico expresso pelo verbo de subida, sem o reduzir simplesmente a “foram”.
- source_word: ይበፍር
  choice: distribuía
  rationale: Expressa a ação contínua de fornecer ou repartir cereal aos povos.
- source_word: ይኴንን
  choice: governava
  rationale: O verbo pode envolver julgar ou exercer autoridade; “governava” se ajusta ao papel político de José e preserva o paralelismo com a ação contínua anterior.
