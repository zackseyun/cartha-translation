base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/014.yaml
  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
translation:
  language: pt
  text: E ele pôs sobre eles chefes de trabalhos forçados para afligi-los com opressão. Eles construíram cidades fortificadas para o faraó — Pitom e Ramessés — e construíram todos os muros e todos os aterros que haviam caído.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
  choice: chefes de trabalhos forçados
  rationale: A expressão designa supervisores encarregados de impor o trabalho; esta formulação é clara em português e preserva a estrutura administrativa coerciva.
- source_word: ያሕምምዎሙ፡ በቅኔ
  choice: afligi-los com opressão
  rationale: Mantém tanto a ideia verbal de causar sofrimento como o caráter opressivo do meio empregado.
- source_word: አህጉረ፡ ጽኑዓተ
  choice: cidades fortificadas
  rationale: Reproduz de modo natural a noção de cidades fortes ou protegidas por fortificações.
- source_word: ዐረፋተ
  choice: aterros
  rationale: Segue o sentido de obras elevadas de terra ou terraplenagens, sem restringi-las indevidamente a muralhas.
- source_word: ወደቀ
  choice: haviam desmoronado
  rationale: No contexto de muros e aterros, 'desmoronar' expressa de modo mais idiomático o sentido literal de cair.
- source_word: ወሐነጹ ... ዘወደቀ
  choice: reconstruíram ... que haviam desmoronado
  rationale: Embora o verbo seja literalmente 'construíram', a referência a estruturas anteriormente desmoronadas implica restauração; 'reconstruíram' torna essa relação explícita e natural em português.
