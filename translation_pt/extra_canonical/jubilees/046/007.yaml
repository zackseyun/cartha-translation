  yaml_path: translation/extra_canonical/jubilees/046/007.yaml
  text: Egypt and killed him there; and he pursued after them to Egypt, as far as the entrance of Eromon. But he could not enter, because another new king had arisen over Egypt, stronger than he, and he returned to the land of Canaan, and the gate of Egypt was shut, and there was none who went out and none who came in to Egypt.
translation:
  language: pt
  text: ao Egito e o matou ali. Depois, perseguiu-os até o Egito, até a entrada de Eromon. Mas não conseguiu entrar, porque um novo rei, outro rei, havia começado a reinar sobre o Egito e era mais forte do que ele. Então voltou para a terra de Canaã. A entrada do Egito foi fechada, e ninguém saía nem entrava no Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዴገነ፡ ድኅሬሆሙ
  choice: Depois, perseguiu-os
  rationale: Reproduz o sentido de ir no encalço de um referente plural sem substituir o pronome por uma identificação não expressa no texto.
- source_word: አንቀጸ፡ ኤሮሞን
  choice: a entrada de Eromom
  rationale: አንቀጽ pode designar entrada ou portão; “entrada” é natural no contexto de alcançar um limite geográfico e preserva o nome próprio.
- source_word: ነግሠ፡ ካልእ፡ ሐዲስ፡ ንጉሥ
  choice: outro rei, um novo rei, havia começado a reinar
  rationale: Conserva tanto “outro” quanto “novo” e explicita de modo natural em português a ascensão desse rei.
- source_word: ወገብአ፡ ምድረ፡ ከናአን
  choice: Então voltou para a terra de Canaã
  rationale: ገብአ significa aqui “voltar/retornar”, não “tomar posse”; a direção é expressa naturalmente por “para”.
- source_word: ወተዐጽወ፡ አንቀጸ፡ ግብጽ
  choice: A entrada do Egito foi fechada
  rationale: A forma verbal é passiva; evita atribuir o fechamento ao sujeito anterior e mantém አንቀጽ como “entrada”.
- source_word: ወአልቦ፡ ዘይወፅእ፡ ወአልቦ፡ ዘይበውእ
  choice: e ninguém saía nem entrava
  rationale: Expressa a ausência contínua de trânsito com uma formulação idiomática e clara em português.
