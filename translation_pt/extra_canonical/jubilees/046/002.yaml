base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/002.yaml
  text: And there was no adversary and nothing evil through all the days of Joseph's life that he lived after his father Jacob, because all Egypt honored him.
translation:
  language: pt
  text: E não houve adversário nem mal algum durante todos os dias da vida de José que ele viveu depois de seu pai Jacó[a], porque todo o Egito o honrava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “durante toda a vida de José depois de seu pai Jacó”.'
    reason: A construção relativa pode ser ligada de maneira ligeiramente diferente a “vida de José”; a nota preserva essa possibilidade sem acrescentar “morte” ao original.
lexical_decisions:
- source_word: ሰይጣን
  choice: adversário
  rationale: O termo pode designar um oponente ou adversário, sem exigir aqui a identificação com o nome próprio Satanás; o contexto favorece o sentido comum.
- source_word: ምንተኒ፡ እኩየ
  choice: mal algum
  rationale: Reproduz de modo natural a negação enfática de qualquer coisa má.
- source_word: ያከብ
  choice: honrava
  rationale: Expressa a honra contínua prestada por todo o Egito a José durante esse período.
theological_decisions:
- issue: Identidade de ሰይጣን
  choice: adversário
  alternative: Satanás
  rationale: A forma lexical permite o sentido geral de adversário, e o versículo não fornece elementos suficientes para impor a leitura como nome próprio.
- issue: Sentido temporal de “depois de seu pai Jacó”
  choice: manter a formulação elíptica no texto
  alternative: depois da morte de seu pai Jacó
  rationale: O original não explicita “morte”; a tradução preserva essa elipse e evita acrescentar uma resolução interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A repetição de “vida” e “viveu” foi mantida por corresponder à cláusula relativa explícita do ge'ez, apesar de soar um pouco mais formal em português.
