lexical_decisions:
- source_word: በሀገረ፡ ግብጽ
  choice: na terra do Egito
  rationale: Mantém a expressão geográfica do texto-fonte e a continuidade sintática com o contexto anterior.
- source_word: ይቀንይዎሙ፡ በግፍዕ
  choice: os fizeram servir à força
  rationale: Expressa a imposição coercitiva do serviço; “à força” traduz de modo claro o valor de በግፍዕ.
- source_word: ያሐስሙ፡ ላዕሌሆሙ
  choice: os oprimiam
  rationale: Verbo natural em português para o tratamento severo exercido contra eles, em consonância com o contexto da servidão no Egito.
- source_word: ወመጠነ ... ከማሁ
  choice: quanto mais ... mais
  rationale: Reproduz a estrutura comparativa correlativa, deixando-a deliberadamente incompleta porque o fragmento-fonte termina nesse ponto.
