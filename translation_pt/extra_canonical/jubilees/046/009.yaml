  register: Português moderno, claro e digno, com coordenação narrativa simples. Foram preservados tanto o início quanto o fim incompletos do versículo fornecido. A repetição da preposição ውስተ foi representada por “no campo, na caverna dupla, na montanha”, evitando criar uma relação de posse (“campo da caverna”) que a sintaxe não exige.
