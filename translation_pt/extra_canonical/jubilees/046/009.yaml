  text: in the land of Egypt. And all his brothers died after him. And the king of Egypt went out to fight with the king of Canaan in the forty-seventh jubilee, in the second week, in the second year; and the sons of Israel brought out all the bones of the sons of Jacob, except the bones of Joseph, and they buried them in the field, in the double cave in the mountain,
translation:
  language: pt
  text: na terra do Egito. E todos os irmãos dele morreram depois dele. O rei do Egito saiu para guerrear contra o rei de Canaã no quadragésimo sétimo jubileu, na segunda semana, no segundo ano. Então os filhos de Israel levaram dali todos os ossos dos filhos de Jacó, exceto os ossos de José, e os sepultaram no campo, na caverna dupla, na montanha,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትቃተል
  choice: guerrear contra
  rationale: Expressa de modo natural o propósito militar do rei, preservando o sentido reflexivo/recíproco do verbo no contexto.
- source_word: ሱባዔ
  choice: semana
  rationale: Mantém a fórmula cronológica própria de Jubileus sem acrescentar explicitamente “de anos”, elemento não expresso neste texto.
- source_word: አውፅኡ
  choice: levaram dali
  rationale: Comunica a retirada e o transporte dos ossos para fora do Egito em português corrente.
- source_word: በዐት፡ ዘካዕበት
  choice: caverna dupla
  rationale: Reproduz literalmente a designação da caverna como “dupla”, sem substituí-la por um nome tradicional não presente no trecho.
- source_word: ገዳም
  choice: campo
  rationale: Segue o sentido contextual e a tradição textual consultada para o local de sepultamento.
