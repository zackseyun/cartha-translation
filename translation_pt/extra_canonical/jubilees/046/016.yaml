lexical_decisions:
- source_word: ይበዝኁ፡ ወከማሁ፡ ይፈደፍዱ
  choice: cresceram e, do mesmo modo, se multiplicaram
  rationale: Preserva o paralelismo dos dois verbos e traduz ወከማሁ como correspondência («do mesmo modo»), sem introduzir a ideia comparativa de «ainda mais».
- source_word: ያስተረዙስዎሙ
  choice: passaram a detestar
  rationale: O verbo exprime considerar impuro, abominar ou detestar; o sujeito da aversão são os egípcios. «Passaram a» produz uma formulação idiomática em português sem sugerir que tornaram Israel detestável para terceiros.
- source_word: ሰብአ፡ ግብጽ፡ ለውሉደ፡ እስራኤል
  choice: os egípcios ... os filhos de Israel
  rationale: Traduz literalmente os grupos designados no texto, mantendo a expressão bíblica tradicional e clara «filhos de Israel».
