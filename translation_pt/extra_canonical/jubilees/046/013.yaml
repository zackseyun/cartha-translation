base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/013.yaml
  text: and he oppressed them, and he said to the people of Egypt, 'Look, the people of the children of Israel are more and stronger than we are. Come, let us deal wisely with them, before they multiply, and let us oppress them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.'
translation:
  language: pt
  text: 'E ele os oprimiu e disse ao povo do Egito: “Vejam! O povo dos filhos de Israel é mais numeroso e mais forte do que nós. Venham, ajamos com astúcia contra eles antes que se multipliquem[a] e os oprimamos com trabalho forçado, para que não venha sobre nós uma guerra e eles também se unam aos nossos inimigos e saiam da nossa terra,[b] pois os corações e os rostos deles estão voltados para a terra de Canaã.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “sem que se multipliquem”.'
    reason: A construção ge'ez pode ter valor de «antes que» ou «sem que»; o texto principal adota a leitura temporal mais natural neste ponto.
  - marker: b
    text: 'Ou: “subam da nossa terra”.'
    reason: Alternativa tradicional refletida no rastro inglês; o texto principal traduz o verbo ge'ez como «saiam».
lexical_decisions:
- source_word: ያሕምሞሙ / ወናሕምሞሙ
  choice: os oprimiu / os oprimamos
  rationale: O verbo é repetido no texto e expressa aflição ou opressão; a repetição foi preservada em português.
- source_word: ልህቁ፡ ወበዝኁ
  choice: é mais numeroso e mais forte
  rationale: Expressa a superioridade numérica e de poder do povo de Israel em português natural.
- source_word: ንጥበብ፡ ላዕሌሆሙ
  choice: ajamos com astúcia contra eles
  rationale: Mantém a ideia de agir calculadamente contra o grupo, sem dar à expressão uma conotação positiva de sabedoria.
- source_word: በቅኔ
  choice: com trabalho forçado
  rationale: No contexto egípcio, o termo indica serviço imposto ou servidão; esta formulação é clara e idiomática.
- source_word: ይወፅኡ፡ እምድርነ
  choice: saiam da nossa terra
  rationale: O verbo ge'ez significa sair, não subir; evita harmonização indevida com outra tradição textual de Êxodo 1:10.
- source_word: ልቦሙ፡ ወገጾሙ
  choice: o coração e o rosto deles
  rationale: Preserva a imagem dupla e concreta do original, embora incomum em português.
theological_decisions:
- issue: Sentido temporal de ዘእንበለ antes de ‘se multipliquem’
  choice: antes que se multipliquem
  alternative: para que não se multipliquem
  rationale: O valor básico da construção neste contexto é temporal (‘antes que’); a alternativa final poderia importar a formulação de outra tradição textual.
- issue: Direção da saída do Egito
  choice: saiam da nossa terra
  alternative: subam da nossa terra
  rationale: A tradução segue o verbo efetivamente presente no ge'ez e não harmoniza o versículo com o hebraico de Êxodo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. Preservaram-se a repetição de ‘oprimir’ e a imagem semítica ‘o coração e o rosto’, enquanto ‘trabalho forçado’ comunica naturalmente a servidão imposta.
