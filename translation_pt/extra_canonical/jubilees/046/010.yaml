translation:
  language: pt
  text: Muitos voltaram para o Egito, mas poucos deles permaneceram na região montanhosa de Hebrom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome «Hebrom» aparece na continuação imediata do texto ge'ez e completa a construção «região montanhosa de».
    reason: Esclarece que o topônimo pertence sintaticamente ao fim deste versículo, embora tenha sido deslocado para o versículo seguinte pelo recorte do analisador.
lexical_decisions:
- source_word: ወገብኡ፡ ብዙኃን፡ ውስተ፡ ግብጽ
  choice: Muitos voltaram para o Egito
  rationale: O verbo ገብአ expressa entrar ou regressar. No contexto narrativo, essas pessoas estão retornando ao Egito, por isso «voltaram» comunica naturalmente o movimento pretendido.
- source_word: ወኅዳጣን፡ ተርፉ፡ እምኔሆሙ
  choice: mas poucos deles permaneceram
  rationale: Reproduz o contraste entre os muitos que voltaram e os poucos que ficaram, mantendo explícita a referência partitiva «deles».
- source_word: ውስተ፡ ደብረ፡
  choice: na região montanhosa de Hebrom
  rationale: ደብር pode indicar monte ou região montanhosa; a forma construta ደብረ liga-se ao nome Hebrom, preservado pela continuidade textual embora o recorte fornecido termine antes dele.
