base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/003.yaml
  text: the sons of Israel throughout all the days of Joseph's life. And Joseph died at the age of one hundred and ten years. Seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt.
translation:
  language: pt
  text: José governou os filhos de Israel durante todos os dias de sua vida. José morreu com cento e dez anos de idade. Viveu dezessete anos na terra de Canaã, dez anos servindo, três anos na prisão e oitenta anos sob a autoridade do faraó, rei do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርዎሙ
  choice: cuidou
  rationale: O verbo apresenta José como quem pastoreia ou provê para os israelitas; “cuidou” comunica naturalmente esse sentido amplo sem restringi-lo apenas à alimentação.
- source_word: እንዘ፡ ይትቀነይ
  choice: servindo
  rationale: Expressa o período em que José esteve em condição de serviço ou sujeição; a forma concisa preserva a formulação do texto sem identificar além do que esta cláusula declara a quem ele servia.
- source_word: ቤተ፡ ሞቅሕ
  choice: prisão
  rationale: Literalmente, “casa de prisão/cativeiro”; “prisão” é a expressão corrente e clara em português.
- source_word: ታሕተ፡ ሤመቱ፡ ለፈርዖን
  choice: sob a autoridade do faraó
  rationale: Reflete a cláusula final completa atestada na revisão do texto-fonte e indica a posição de José sob a autoridade constituída do faraó.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com repetição de “José” para eliminar uma possível ambiguidade pronominal na abertura. Os períodos cronológicos foram mantidos em sequência paralela. “Faraó” aparece como título em minúscula segundo o uso corrente em português.
