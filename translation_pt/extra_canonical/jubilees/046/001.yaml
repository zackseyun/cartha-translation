base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/001.yaml
  text: And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all united in their hearts, so that each loved his brother and a man helped his brother. And they increased abundantly and multiplied exceedingly during all the days of Joseph, for ten weeks of years.
translation:
  language: pt
  text: Depois da morte de Jacó, os filhos de Israel aumentaram na terra do Egito e se tornaram um povo numeroso. Eram todos unidos de coração[a], de modo que cada um amava seu irmão, e cada homem ajudava seu irmão. Eles aumentaram abundantemente e se multiplicaram muitíssimo durante todos os dias de José, ao longo de dez semanas de anos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «tinham todos o mesmo sentir no coração».'
    reason: A expressão descreve concordância ou unidade interior; a alternativa preserva essa nuance sem reduzir a frase a mera proximidade social.
lexical_decisions:
- source_word: ውሉደ፡ እስራኤል
  choice: os filhos de Israel
  rationale: Mantém a designação tradicional e o sentido coletivo do texto-fonte.
- source_word: ዕሩያነ፡ በአልቦሙ
  choice: unidos no coração
  rationale: Expressa de modo natural a unidade interior indicada pela locução em ge'ez, sem omitir «no coração».
- source_word: ይትራዳእ
  choice: ajudava
  rationale: Verbo corrente que comunica a ideia de prestar auxílio mútuo.
- source_word: ወበዝኁ፡ ፈድፋደ፡ ወበዝኁ፡ ጥቀ
  choice: aumentaram abundantemente e se multiplicaram muitíssimo
  rationale: Preserva os dois verbos paralelos derivados de በዝኁ e a intensificação de cada oração, evitando interpretar o segundo como «tornaram-se fortes».
- source_word: ዐሠርተ፡ ሱባዔ፡ ዓመታት
  choice: dez semanas de anos
  rationale: Conserva a forma cronológica característica de Jubileus; equivale a setenta anos, mas não substitui a expressão original por um cálculo interpretativo.
