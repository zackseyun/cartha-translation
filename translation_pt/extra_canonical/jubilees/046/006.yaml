  text: seus ossos, no dia em que saíram da terra do Egito. Ele lhes fez jurar a respeito de seus ossos, pois sabia que os egípcios não voltariam a levá-lo para fora e sepultá-lo na terra de Canaã. Pois Macmarom, rei de Canaã, enquanto morava na terra da Assíria, combateu no vale contra o rei de[a]
