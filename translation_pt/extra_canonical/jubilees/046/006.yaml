lexical_decisions:
- source_word: አዕፅምቲሁ
  choice: seus ossos
  rationale: Tradução direta do substantivo plural com sufixo possessivo masculino; mantém a repetição do original.
- source_word: አይድኅሙ
  choice: não voltariam
  rationale: Expressa a ideia negativa de repetição presente no contexto, sem tornar a formulação portuguesa excessivamente literal.
- source_word: አውፅኦተ፡ ወቀቢሮተ
  choice: levá-lo para fora e sepultá-lo
  rationale: 'Preserva as duas ações coordenadas: retirar do Egito e sepultar em Canaã.'
- source_word: ማክማሮን
  choice: Macmarom
  rationale: Transliteração adaptada à ortografia portuguesa do nome próprio ge'ez.
- source_word: በቈላ
  choice: no vale
  rationale: Equivalente natural para o termo geográfico que designa uma planície baixa ou vale.
theological_decisions:
- issue: Identidade do referente de “seus ossos”
  choice: Manter apenas o pronome possessivo implícito no fragmento
  alternative: Inserir explicitamente “os ossos de José”
  rationale: O texto fornecido começa no meio de uma construção; explicitar José resolveria uma referência que este fragmento não nomeia.
- issue: Motivo da remoção dos ossos
  choice: Preservar a afirmação de que ele sabia que os egípcios não o levariam novamente para fora
  alternative: Reformular como simples pedido profético sobre o êxodo
  rationale: A tradução conserva a lógica e a tensão do texto ge'ez sem harmonização com outra tradição textual.
