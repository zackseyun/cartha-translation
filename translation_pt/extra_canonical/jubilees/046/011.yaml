- source_word: አብራም
  choice: Anrão
  rationale: Embora o texto ge'ez preservado leia literalmente “Abrão”, o contexto identifica o pai da pessoa a quem se dirige a fala como Anrão. A correção textual é adotada no corpo, mas a leitura efetiva do manuscrito é preservada em nota.
- source_word: ተረፈ
  choice: permaneceu
  rationale: Expressa de modo natural o sentido de ficar ou permanecer com outras pessoas.
- source_word: ሞአ
  choice: derrotou
  rationale: O verbo ge'ez significa vencer, conquistar ou prevalecer sobre; “derrotou” comunica claramente a relação entre os dois reis sem confundi-lo com o verbo “morrer”.
