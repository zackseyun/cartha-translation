lexical_decisions:
- source_word: ዐጸወ
  choice: fechou
  rationale: Reproduz diretamente o sentido verbal de fechar, mantendo a continuação sintática do versículo.
- source_word: አንቀጸ፡ ግብጽ
  choice: a porta do Egito
  rationale: Mantém a imagem concreta da fonte; “porta” é natural em português e evita ampliar o texto para “fronteiras”.
- source_word: ሐለየ፡ እኩየ፡ ሕሊና
  choice: concebeu um plano maligno
  rationale: Expressa de modo idiomático a ideia de formular um pensamento ou desígnio mau, sem acrescentar o conteúdo ainda não fornecido.
- source_word: ውሉደ፡ እስራኤል
  choice: os filhos de Israel
  rationale: Preserva a designação tradicional e formal da fonte, plenamente compreensível em português.
- source_word: ከመ
  choice: para que
  rationale: Conserva a oração final aberta, pois o trecho-fonte termina nessa conjunção e continua no contexto seguinte.
