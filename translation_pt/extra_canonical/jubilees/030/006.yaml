base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/006.yaml
  text: because they had committed shame in Israel. And the LORD delivered them into the hand of Jacob's sons so that they might destroy them with the sword and do this to them, and so that it might not be done again,
translation:
  language: pt
  text: porque haviam cometido uma infâmia em Israel. E o SENHOR os entregou nas mãos dos filhos de Jacó, para que os destruíssem[a] à espada e lhes fizessem isso, e para que não voltasse a acontecer,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os exterminassem”.'
    reason: O verbo geʽez pode indicar erradicação ou extermínio completo, sentido mais forte que o simples ato de matar.
lexical_decisions:
- source_word: ኀፍረተ (ḥafrat)
  choice: infâmia
  rationale: Expressa um ato vergonhoso e desonroso, preservando o peso moral do termo sem recorrer a uma formulação arcaica.
- source_word: ይሠርውዎሙ (yəśärəwwōmu)
  choice: os destruíssem
  rationale: O verbo tem o sentido forte de arrancar pela raiz, erradicar ou exterminar; “destruíssem” comunica essa força melhor do que simplesmente “matassem” e acompanha naturalmente “à espada”.
- source_word: መጠዎሙ ... ውስተ እዴ (mäṭṭäwomu ... wəstä ʾǝde)
  choice: os entregou nas mãos
  rationale: Mantém a conhecida expressão semítica de sujeição ao poder de alguém, inteligível em português bíblico moderno.
theological_decisions:
- issue: Agência divina na entrega dos ofensores aos filhos de Jacó
  choice: o SENHOR os entregou nas mãos dos filhos de Jacó
  alternative: o SENHOR permitiu que caíssem nas mãos dos filhos de Jacó
  rationale: A fonte atribui diretamente a entrega ao SENHOR; a tradução não atenua essa agência com “permitiu”.
- issue: Finalidade expressa pelas orações com ከመ
  choice: para que ... e para que
  alternative: de modo que ... e assim
  rationale: A construção da fonte apresenta finalidade ou resultado pretendido; “para que” preserva essa relação sem resolver além do texto a tensão teológica envolvida.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “SENHOR” preserva a convenção bíblica para o nome divino. A vírgula final foi mantida porque o texto-fonte fornecido termina com uma oração incompleta que continua no contexto seguinte; não se acrescentou material ausente deste segmento.
