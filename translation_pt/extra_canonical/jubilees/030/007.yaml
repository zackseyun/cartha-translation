base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/007.yaml
  text: Thus, there shall not be in Israel one who defiles an Israelite virgin. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And as for the woman,
translation:
  language: pt
  text: Assim, não haverá em Israel quem desonre uma virgem israelita. Se algum homem em Israel quiser dar sua filha, ou mesmo sua irmã, a um homem da linhagem das nações, certamente morrerá, e o apedrejarão, pois cometeu uma infâmia em Israel. Quanto à mulher,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto termina aqui introduzindo a mulher; a declaração a respeito dela continua no versículo seguinte. Outra segmentação possível seria: “e também a mulher”.'
    reason: A expressão ge'ez final pode parecer ligada à frase anterior quando isolada, mas sua forma e o contexto favorecem entendê-la como antecipação da oração seguinte.
lexical_decisions:
- source_word: ለአርኵሶ
  choice: desonre
  rationale: Expressa tornar impura ou profanar, aqui no contexto da violação da honra e integridade de uma virgem; “desonrar” é natural e mantém a dimensão social e moral do termo.
- source_word: ድንግለ፡ እስራኤላዊት
  choice: uma virgem israelita
  rationale: Tradução direta e clara da expressão nominal.
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: da linhagem das nações
  rationale: Preserva a imagem de descendência expressa por “semente/linhagem” e traduz “nações” sem substituir o termo por uma categoria religiosa mais interpretativa.
- source_word: ሞተ፡ ለይሙት
  choice: certamente morrerá
  rationale: Reproduz de modo idiomático a construção enfática de morte.
- source_word: በእብን፡ ይውግርዎ
  choice: o apedrejarão
  rationale: Comunica naturalmente a execução por pedras sem a redundância pouco idiomática “apedrejarão com pedras”.
- source_word: ኀፍረተ
  choice: infâmia
  rationale: Mantém o sentido de ato vergonhoso e desonroso, com registro jurídico-moral digno.
- source_word: ወለብእሲትሂ
  choice: Quanto à mulher
  rationale: Trata a expressão final como tópico antecipado da oração seguinte, evitando afirmar prematuramente que a mulher recebe a mesma pena ou pratica o mesmo ato.
theological_decisions:
- issue: Identidade das “nações” e natureza da proibição
  choice: Manter “homem da linhagem das nações”
  alternative: Interpretar como “gentio”, “pagão” ou membro de um grupo específico
  rationale: A formulação conserva a categoria étnica ampla do texto e não acrescenta uma definição confessional ou histórica não explicitada neste versículo.
- issue: Relação da mulher com a sentença anterior
  choice: 'Apresentá-la como tópico da continuação: “Quanto à mulher”'
  alternative: “e também a mulher”, vinculando-a à morte por apedrejamento ou à infâmia anterior
  rationale: A construção final parece introduzir a mulher como objeto/tópico da oração do versículo seguinte; a tradução preserva essa continuidade sintática e evita resolver indevidamente sua pena.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A ordem das ideias e a força jurídica foram preservadas, enquanto redundâncias semíticas foram vertidas de maneira idiomática.
