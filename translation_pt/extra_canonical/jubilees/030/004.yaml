base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/004.yaml
  text: And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all in agony, because they had disgraced Dinah their sister.
translation:
  language: pt
  text: E falaram com eles de modo enganoso, agiram traiçoeiramente com eles e os enganaram. Então Simeão e Levi entraram inesperadamente em Siquém e executaram juízo contra todos os homens de Siquém. Mataram todos os homens que encontraram ali e não deixaram nenhum; mataram-nos todos, enquanto sofriam[a], porque haviam desonrado Diná, irmã deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, sofriam as dores da circuncisão.
    reason: Esclarece a alusão contextual da expressão ge'ez «em sofrimento», sem substituir o texto por «ao fio da espada» nem atribuir o sofrimento a Simeão e Levi.
lexical_decisions:
- source_word: በአኩይ
  choice: de modo enganoso
  rationale: O sentido literal é agir ou falar «com maldade»; no contexto da negociação ardilosa, «de modo enganoso» expressa naturalmente a intenção.
- source_word: ወአስፈጥዎሙ
  choice: e os fizeram circuncidar
  rationale: A forma causativa, no contexto de Gênesis 34 e da dor mencionada ao fim do versículo, refere-se a fazer que os homens fossem circuncidados, não apenas a induzi-los genericamente ao erro.
- source_word: ግብተ
  choice: inesperadamente
  rationale: Comunica a entrada súbita ou de surpresa de Simeão e Levi, conservando o elemento de imprevisibilidade.
- source_word: ገብሩ፡ ኵነኔ
  choice: executaram juízo
  rationale: Mantém a linguagem judicial do original sem decidir se o narrador aprova moralmente a ação.
- source_word: በጻዕር (no texto fornecido, በ፵ዐር)
  choice: enquanto estavam sofrendo
  rationale: A leitura corrigida significa «em dor», «em tormento» ou «em sofrimento» e alude à condição dolorosa decorrente da circuncisão; evita a harmonização indevida com «ao fio da espada» em Gênesis 34.
- source_word: ገመፉ
  choice: haviam desonrado
  rationale: Expressa a desonra ou ultraje infligido a Diná sem suavizar a gravidade do ato.
theological_decisions:
- issue: Caracterização da matança como juízo
  choice: executaram juízo
  alternative: castigaram
  rationale: A formulação preserva a terminologia judicial do texto e sua tensão moral, sem acrescentar aprovação divina nem reduzi-la a vingança meramente pessoal.
- issue: Estado dos homens durante a matança
  choice: enquanto estavam sofrendo
  alternative: ao fio da espada
  rationale: A evidência ge'ez aponta para dor ou agonia, provavelmente ligada à circuncisão; a alternativa harmoniza o texto com Gênesis 34 e apaga uma particularidade exegética de Jubileus.
translation_notes:
  register: 'Português moderno, digno e de leitura ampla, com construção direta e vocabulário judicial preservado. «Siquém» é usado tanto para o lugar quanto no contexto narrativo tradicional; «da cidade» evita a repetição potencialmente ambígua. A sequência enfática «não deixaram nenhum: mataram todos» conserva a repetição retórica do original.'
