base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/015.yaml
  text: or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague[15], and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.
translation:
  language: pt
  text: ou se houver uma de suas filhas que ele tenha dado a um homem de qualquer uma das nações. Pois será praga sobre praga[a] e maldição sobre maldição; e todo juízo, praga e maldição virá. Se ele fizer tal coisa, ou fechar os olhos para os que praticam impureza, para os que profanam o santuário do SENHOR e para os que profanam o seu santo nome, todo o povo reunido será julgado por toda a impureza e profanação. Não haverá parcialidade, nem se aceitarão de sua mão fruto, sacrifício, holocausto, gordura ou fragrância de aroma agradável. Assim será com todo homem ou mulher em Israel que profanar o seu santuário.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo 15 é excepcionalmente denso e provavelmente condensa várias declarações legais e cultuais. A tradução preserva a sequência de impureza, culpa pública, ausência de parcialidade e rejeição das ofertas, sem a reorganizar excessivamente.
    reason: segmentation_note
lexical_decisions:
- source_word: መቅሠፍት
  choice: praga
  rationale: Preserva a imagem punitiva concreta do termo geês e a repetição enfática da expressão “praga sobre praga”.
- source_word: ርኵሰ
  choice: impureza
  rationale: Termo amplo que mantém o sentido cultual e moral sem restringi-lo indevidamente a uma só espécie de transgressão.
- source_word: ያረኵሱ / ያረኵስ
  choice: profanam / profanar
  rationale: No contexto do santuário, “profanar” expressa naturalmente a ação de tornar impuro ou violar aquilo que é santo.
- source_word: ነሢአ፡ ገጽ
  choice: parcialidade
  rationale: Equivalente idiomático moderno para a expressão ligada a favorecer ou levar em conta a pessoa/rosto.
- source_word: መሥዋዕተ
  choice: sacrifício
  rationale: Representa o termo cultual geral sem o confundir com o holocausto mencionado separadamente na enumeração.
- source_word: መዐዛ፡ ሠናይ
  choice: fragrância de aroma agradável
  rationale: Mantém a formulação cultual e sensorial da expressão, embora em português ela conserve a redundância retórica do original.
theological_decisions:
- issue: Responsabilidade coletiva de Israel
  choice: “todo o povo será julgado em conjunto”
  alternative: “toda a congregação será condenada”
  rationale: Mantém a tensão do texto entre a ação individual, a tolerância comunitária e o juízo coletivo, sem explicar ou atenuar essa relação.
- issue: Referente pronominal de “seu santuário”
  choice: Preservar “seu”, referindo-se ao SENHOR
  alternative: Explicitar “o santuário do SENHOR” na frase final
  rationale: Conserva a coesão e a forma pronominal da fonte, permanecendo claro pelo contexto que o santuário pertence ao SENHOR.
- issue: Rejeição das ofertas
  choice: “nem ele aceitará de sua mão”
  alternative: “e nenhuma oferta de sua mão será aceita”
  rationale: Preserva a agência divina implícita e a linguagem pessoal da aceitação cultual, sem acrescentar uma explicação teológica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega “SENHOR” como representação convencional do nome/título divino no contexto e conserva a cadência jurídica e cultual do trecho. A abertura em minúscula sinaliza que o versículo continua sintaticamente a frase anterior.
