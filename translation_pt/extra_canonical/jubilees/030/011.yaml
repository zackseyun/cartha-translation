base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/011.yaml
  text: And you, Moses, command the children of Israel and testify to them that they are not to give any of their daughters to the nations, and that they are not to take wives for their sons from the daughters of the nations.
translation:
  language: pt
  text: E você, Moisés, ordene aos filhos de Israel e advirta-os de que não deem nenhuma de suas filhas às nações, nem tomem esposas para seus filhos dentre as filhas das nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአስምዕ፡ ላዕሌሆሙ
  choice: e advirta-os
  rationale: A forma causativa de «ouvir», construída com «sobre/contra eles», funciona aqui como uma fórmula de advertência ou testemunho solene. «Advirta-os» é natural em português e preserva a força exortativa do contexto.
- source_word: ደቂቀ፡ እስራኤል
  choice: filhos de Israel
  rationale: Expressão tradicional, clara e formal, correspondente ao sentido coletivo do original.
- source_word: ለአሕዛብ
  choice: às nações
  rationale: Mantém o referente coletivo do termo ge'ez e evita restringi-lo indevidamente a uma designação étnica ou religiosa mais específica.
- source_word: አይንሥኡ፡ ለውሉዶሙ
  choice: não tomem, para seus filhos, mulheres
  rationale: Explicita com naturalidade o objeto matrimonial implícito em «tomar», sem alterar a proibição de obter esposas para os filhos.
- source_word: እምአዋልደ፡ አሕዛብ
  choice: dentre as filhas das nações
  rationale: Reproduz a construção de procedência e o paralelismo com a primeira metade do versículo.
theological_decisions:
- issue: Força da expressão causativa ligada a «ouvir»
  choice: advirta-os
  alternative: dê testemunho a eles / faça-os ouvir
  rationale: O contexto apresenta uma ordem solene dirigida a Israel. «Advirta-os» comunica a função jurídica e exortativa da expressão sem a estranheza de um decalque; a possibilidade de «testemunhar» permanece reconhecida como nuance do idioma.
- issue: Identidade das «nações»
  choice: manter «nações» sem interpretação adicional
  alternative: gentios / povos estrangeiros
  rationale: O original usa uma designação coletiva ampla. A tradução não acrescenta uma definição confessional nem decide além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com sintaxe acessível ao público brasileiro e inteligível internacionalmente. Conservou-se o paralelismo da proibição, evitando tanto um literalismo artificial quanto explicações não presentes no texto.
