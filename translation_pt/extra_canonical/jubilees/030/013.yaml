base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/013.yaml
  text: '"We will not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.'
translation:
  language: pt
  text: “Não daremos nossa filha a um homem que tenha prepúcio,[a] pois isso é uma vergonha para nós.” E isso é uma vergonha para Israel, tanto para os que dão suas filhas como para os que tomam para si mulheres dentre as filhas das nações, pois isso é impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, um homem incircunciso.
    reason: Esclarece a expressão anatômica literal sem apagá-la do texto principal.
lexical_decisions:
- source_word: ቍልፈተ (qʷəlfata)
  choice: prepúcio
  rationale: Reproduz o termo anatômico concreto do ge’ez, em vez de substituí-lo diretamente por “incircunciso”; a nota esclarece o sentido contextual.
- source_word: ጽእለት (ṣəʾlät)
  choice: vergonha
  rationale: Expressa de modo natural a ideia de desonra ou opróbrio no contexto, mantendo a repetição enfática do original.
- source_word: አዋልደ፡ አሕዛብ (ʾawāləda ʾaḥzāb)
  choice: filhas das nações
  rationale: Mantém a formulação coletiva e tradicional do original sem restringi-la a uma etnia específica.
- source_word: ርኵስ (rəkus)
  choice: impuro
  rationale: Conserva a linguagem de impureza do texto, sem decidir se ela é exclusivamente ritual, moral ou ambas.
theological_decisions:
- issue: Mudança entre a fala citada e o comentário normativo sobre Israel
  choice: Usar aspas apenas na primeira frase
  alternative: Apresentar todo o versículo como discurso contínuo sem aspas
  rationale: As aspas assinalam a fala que ecoa Gênesis 34:14, enquanto a segunda frase funciona como comentário geral; essa pontuação esclarece a transição sem acrescentar um sujeito não expresso.
- issue: Natureza da impureza mencionada
  choice: Traduzir simplesmente “impuro”
  alternative: Especificar “ritualmente impuro” ou “moralmente impuro”
  rationale: O original não explicita a categoria da impureza; a tradução preserva essa tensão interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição de “vergonha” foi preservada por corresponder à ênfase do original; “tomam para si mulheres” explicita de maneira mínima o sentido matrimonial exigido pelo contexto.
