  yaml_path: translation/extra_canonical/jubilees/030/005.yaml
  text: And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem be destroyed by the sword,
translation:
  language: pt
  text: Diná, irmã deles. E assim, de agora em diante, não se deve profanar uma filha de Israel, pois foi decretado no céu contra eles que todos os homens de Siquém fossem destruídos à espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅቶሙ
  choice: irmã deles
  rationale: Reproduz o substantivo com o sufixo possessivo plural e preserva a frase inicial ligada a Diná.
- source_word: አይትገበር
  choice: não se faça
  rationale: Mantém a forma impessoal e proibitiva do verbo, em português natural e solene.
- source_word: ለአርኵሶ
  choice: profanar
  rationale: Expressa a ideia de tornar impura ou desonrar sexualmente, sem acrescentar uma descrição mais específica que a forma-fonte.
- source_word: ተሠርዐ
  choice: foi decretado
  rationale: Comunica uma determinação estabelecida no céu, preservando a voz passiva.
- source_word: ያጥፍእዎሙ
  choice: fossem exterminados
  rationale: Representa a destruição completa determinada contra o grupo e concorda com a construção portuguesa após 'foi decretado'.
- source_word: በሰይፍ
  choice: à espada
  rationale: Equivalente idiomático e formal do instrumento ou meio expresso no ge'ez.
- source_word: ዐደወ፡ ሴቄማ
  choice: homens de Siquém
  rationale: Segue a compreensão textual refletida pela edição e pela camada auditada, identificando coletivamente os homens de Siquém.
theological_decisions:
- issue: Local e força da determinação
  choice: no céu foi decretado contra eles
  alternative: no céu foi ordenado a respeito deles
  rationale: Preserva tanto a origem celestial quanto a orientação adversa indicada por ላዕሌሆሙ, sem identificar explicitamente quem emitiu o decreto.
- issue: Modalidade do resultado decretado
  choice: que ... fossem exterminados
  alternative: que ... seriam exterminados
  rationale: O subjuntivo português apresenta o extermínio como conteúdo do decreto, sem transformar a frase em simples previsão.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A abertura fragmentária 'Diná, irmã deles' foi mantida porque consta do texto-fonte, embora provavelmente retome a oração do versículo anterior. Os travessões esclarecem que 'profanar uma filha de Israel' explica o ato que não deve ser praticado.
