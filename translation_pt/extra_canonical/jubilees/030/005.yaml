  rationale: A revisão elimina o acréscimo interpretativo «algo assim» e exprime diretamente a proibição contida no original. Mantém-se a abertura fragmentária, pois ela pertence ao texto transmitido e parece retomar o contexto anterior. «Fossem destruídos» apresenta o extermínio como conteúdo do decreto celestial, sem o converter em mera previsão nem acrescentar agente divino explícito.
