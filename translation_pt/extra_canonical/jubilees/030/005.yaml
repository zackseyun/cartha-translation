  terminology: «Profanar», «filha de Israel», «foi decretado», «homens de Siquém» e «à espada» são escolhas adequadas. «Exterminados» é possível, mas «destruídos» segue mais de perto o verbo-fonte e a auditoria inglesa, sem perder a gravidade do contexto.
