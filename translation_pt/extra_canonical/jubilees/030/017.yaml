base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/017.yaml
  text: And the seed of Levi was chosen for the priesthood and to be Levites, that they might minister before the LORD as we do at all times[17]. And Levi and his sons will be blessed forever, because he was zealous to execute righteousness and judgment and vengeance on all who rose up against Israel.
translation:
  language: pt
  text: E a descendência de Levi foi escolhida para o sacerdócio e para servir como levitas, a fim de ministrarem diante do SENHOR, como nós fazemos sempre[a]. Levi e seus filhos serão abençoados para sempre, porque ele foi zeloso em praticar a justiça, executar o juízo e exercer vingança contra todos os que se levantam contra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «como nós fazemos sempre» reflete a perspectiva do mensageiro angelical no quadro narrativo da revelação do Sinai em Jubileus.
    reason: cross_reference
lexical_decisions:
- source_word: ዘርአ፡ ሌዊ
  choice: a descendência de Levi
  rationale: Expressa naturalmente o sentido coletivo de «semente/linhagem de Levi» sem restringi-lo aos filhos imediatos.
- source_word: ለክህነት፡ ወለሌዋውያን
  choice: para o sacerdócio e para servir como levitas
  rationale: Preserva os dois elementos do texto ge'ez e evita a impressão equivocada de que a descendência foi escolhida em benefício dos levitas.
- source_word: ይትለአኩ
  choice: ministrarem
  rationale: Verbo adequado ao serviço religioso desempenhado diante do SENHOR.
- source_word: ቀንአ
  choice: foi zeloso
  rationale: Mantém a ideia de zelo intenso que motiva as ações seguintes.
- source_word: ጽድቀ፡ ወኵነኔ፡ ወበቀለ
  choice: a justiça, executar o juízo e exercer vingança
  rationale: Conserva a sequência tripla e a distinção entre justiça, julgamento e retribuição.
theological_decisions:
- issue: Identidade do sujeito em «como nós fazemos»
  choice: Manter a primeira pessoa do plural e explicá-la em nota
  alternative: Substituir por uma referência explícita aos anjos
  rationale: O contexto literário indica a perspectiva do mensageiro angelical, mas o versículo preserva apenas «nós»; explicitar «anjos» no corpo resolveria uma referência que o texto deixa implícita.
- issue: Retrato positivo das ações de Levi
  choice: Traduzir sem atenuar a aprovação expressa pelo texto
  alternative: Reformular a vingança em termos moralmente neutros ou inserir uma ressalva
  rationale: Jubileus apresenta o zelo e a vingança de Levi como justiça; a tradução deve conservar essa tensão teológica sem harmonizá-la silenciosamente com outras avaliações do episódio.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. «SENHOR» segue a convenção para o nome divino no contexto. A formulação mantém o paralelismo solene e a avaliação teológica própria do texto.
