  yaml_path: translation/extra_canonical/jubilees/030/016.yaml
  text: 'Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment[16], and it was reckoned to them as righteousness, and it was written for them for righteousness.'''
translation:
  language: pt
  text: 'Por isso, ordenei a você: “Proclame este testemunho a Israel: Veja o que aconteceu aos siquemitas e a seus filhos: eles foram entregues nas mãos dos dois filhos de Jacó, que os mataram com tormento[a]. Isso lhes foi considerado justiça e foi registrado em favor deles como justiça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão em ge’ez é difícil e também pode ser entendida como “com sofrimento” ou “com aflição”; algumas tradições textuais podem apontar para “à espada”. O sentido geral é que eles foram mortos violentamente.
    reason: lexical_alternative
lexical_decisions:
- source_word: አስምዕ፡ ዛተ፡ ስምዐ፡ ላዕለ፡ እስራኤል
  choice: Proclame este testemunho a Israel
  rationale: Reproduz a ideia causativa de fazer Israel ouvir formalmente o testemunho, em português natural e solene.
- source_word: ለሰቂሞን፡ ወለውሉዱ
  choice: a Siquém e a seus filhos
  rationale: Segue diretamente a forma nominal do ge’ez, que menciona Siquém e seus filhos, sem generalizá-la para todos os siquemitas.
- source_word: በፃዕር
  choice: com tormento
  rationale: Mantém a força do termo difícil, que pode indicar tormento, sofrimento ou aflição, sem substituí-lo silenciosamente por uma leitura textual alternativa.
- source_word: ወኮነቶሙ፡ ጽድቀ
  choice: Isso lhes foi considerado justiça
  rationale: Conserva a formulação teologicamente tensa do texto, sem explicar, aprovar ou atenuar o juízo expresso.
- source_word: ወተጽሕፎሙ፡ ለጽድቅ
  choice: foi registrado em favor deles como justiça
  rationale: Entende a construção como um registro feito em favor deles e evita a impressão de que algo lhes foi escrito como correspondência.
theological_decisions:
- issue: A morte de Siquém e de seus filhos é qualificada como justiça
  choice: Preservar literalmente a declaração de que o ato lhes foi considerado e registrado como justiça
  alternative: Atenuar a frase ou apresentá-la apenas como opinião dos filhos de Jacó
  rationale: O próprio texto celestial faz essa avaliação; a tradução não deve resolver nem suavizar a tensão moral e teológica.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. O discurso direto foi pontuado de modo natural, e a repetição de “justiça” foi mantida por corresponder à ênfase do original.
