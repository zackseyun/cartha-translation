base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/020.yaml
  text: And on the day when Jacob's sons killed Shechem, a record was written for them in heaven that they had performed righteousness and uprightness and vengeance on the sinners, and it was written down for blessing.
translation:
  language: pt
  text: E, no dia em que os filhos de Jacó mataram os siquemitas, foi escrito no céu, em favor deles, um registro de que praticaram justiça, retidão e vingança contra os pecadores; e foi escrito para bênção.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰቂማነ፡ (saqimāna)
  choice: os siquemitas
  rationale: A forma é plural e designa os habitantes ou homens de Siquém, não apenas a pessoa ou a cidade chamada Siquém.
- source_word: ተጽሕፈ፡ ሎሙ፡ መጽሐፍ፡ (taṣḥəfa lomu maṣḥaf)
  choice: foi escrito para eles um registro
  rationale: Preserva o verbo passivo «foi escrito» e traduz «livro/escrito» como «registro» no contexto de uma anotação celestial.
- source_word: ጽድቀ፡ ወርትዐ፡ (ṣədqa wa-rətʿa)
  choice: justiça e retidão
  rationale: Mantém os dois termos éticos distintos e a formulação solene do original.
- source_word: ወበቀለ፡ ላዕለ፡ ኃጥአን፡ (wa-baqala lāʿla ḫaṭəʾān)
  choice: executado vingança contra os pecadores
  rationale: Expressa o ato de retribuição ou vingança dirigido contra os pecadores, sem suavizar a avaliação do narrador.
- source_word: ተጽሕፈ፡ ለበረከት፡ (taṣḥəfa la-barakat)
  choice: isso lhes foi registrado como bênção
  rationale: Reproduz a segunda declaração de registro e comunica naturalmente a finalidade ou valoração «para bênção».
theological_decisions:
- issue: Avaliação celestial da violência dos filhos de Jacó
  choice: Conservar a afirmação de que o ato foi contado como justiça, retidão e vingança contra pecadores
  alternative: Atenuar ou reinterpretar a ação apenas como um acontecimento histórico
  rationale: O texto oferece explicitamente essa avaliação teológica, apesar da tensão com outras apresentações da narrativa; a tradução não deve resolvê-la nem suavizá-la.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. «Siquemitas» esclarece o plural etíope; «registro» evita sugerir necessariamente um códice físico, mantendo a imagem de uma inscrição celestial.
