  yaml_path: translation/extra_canonical/jubilees/030/003.yaml
  text: And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister.
translation:
  language: pt
  text: Ela tinha doze anos. Ele pediu ao pai e aos irmãos dela que a dessem a ele por esposa. Jacó e seus filhos ficaram irados por causa dos homens de Siquém, porque eles haviam desonrado Diná, irmã deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐደወ፡ ሰቂማ
  choice: os homens de Siquém
  rationale: A expressão contém uma forma plural construta com o sentido de “homens de”, não “cidade de”; assim, preserva-se a referência aos homens de Siquém.
- source_word: አርኰስዋ
  choice: haviam desonrado
  rationale: O verbo comunica que Diná foi aviltada ou tornada impura. “Desonrado” é claro no contexto e evita acrescentar uma especificidade além da formulação do texto.
- source_word: ትትወሀብ፡ ሎቱ፡ ብእሲተ
  choice: que a dessem a ele por esposa
  rationale: Reproduz a construção passiva e a finalidade matrimonial em português natural, sem transformar o pedido em linguagem moderna de consentimento que não está explícita na fonte.
