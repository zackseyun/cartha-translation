  text: because it is an abomination before the LORD. Therefore I have written for you in the words of the law all the deeds of the Shechemites that they did against Dinah, and how the sons of Jacob spoke, saying,
translation:
  language: pt
  text: 'porque isso é uma abominação diante do SENHOR. Por isso, escrevi para você, nas palavras da Lei, todos os atos dos siqueimitas[a] que eles praticaram contra Diná e como os filhos de Jacó falaram, dizendo:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, literalmente: “todos os atos de Siquém que eles praticaram”. O nome pode designar coletivamente o povo de Siquém.'
    reason: Preserva a possibilidade de manter o topônimo do texto, ao mesmo tempo que esclarece por que a tradução principal usa um referente coletivo, conforme os plurais do ge'ez.
lexical_decisions:
- source_word: ምኑን
  choice: uma abominação
  rationale: O substantivo indica algo abominável ou detestável; a formulação nominal preserva a força do texto-fonte.
- source_word: በቅድመ፡ እግዚአብሔር
  choice: diante do SENHOR
  rationale: Expressão idiomática que conserva tanto a relação espacial figurada quanto o juízo divino; SENHOR segue a convenção portuguesa para o nome divino neste contexto.
- source_word: ውስተ፡ ቃለ፡ ሕግ
  choice: nas palavras da Lei
  rationale: Tradução formal e natural da expressão, com Lei em maiúscula por se referir ao corpo normativo.
- source_word: ለሴቄማ
  choice: dos habitantes de Siquém
  rationale: Os sufixos e verbos plurais subsequentes mostram referência coletiva ao povo de Siquém, não apenas ao indivíduo homônimo.
- source_word: ላዕለ፡ ዲና
  choice: contra Diná
  rationale: A preposição, no contexto de atos hostis, é adequadamente expressa por 'contra'.
- source_word: ደቂ፡ ያዕቆብ
  choice: os filhos de Jacó
  rationale: Mantém a construção nominal explícita e o registro formal do original.
theological_decisions:
- issue: Natureza da avaliação divina
  choice: isso é uma abominação diante do SENHOR
  alternative: isso é abominável diante do SENHOR
  rationale: A construção nominal preserva melhor a ideia de algo classificado como abominação, sem ampliar ou explicar o referente ambíguo de 'isso'.
- issue: Identidade de Siquém
  choice: os habitantes de Siquém
  alternative: Siquém
  rationale: A concordância plural no ge'ez favorece uma referência coletiva, mas a nota registra a possibilidade de uma tradução mais literal e ambígua.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Preserva-se a estrutura encadeada do versículo e a fórmula introdutória final “dizendo:”, que conduz ao versículo seguinte.
