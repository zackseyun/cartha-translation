base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/010.yaml
  text: whoever defiles it shall surely die[10], and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man should be rooted out who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.
translation:
  language: pt
  text: Quem a profanar certamente morrerá e será apedrejado. Esta lei não tem limite de dias, nem há perdão nem expiação alguma, salvo que o homem que tiver profanado uma filha no meio de todo o Israel será extirpado[a], pois deu de sua descendência a Moloque[b] e agiu perversamente, profanando-a.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “será arrancado pela raiz”. A expressão pode indicar eliminação ou exclusão, sem especificar aqui de que modo isso ocorreria.'
    reason: lexical_ambiguity
  - marker: b
    text: A referência a Moloque surge de modo abrupto neste contexto. O texto etíope a preserva; ela talvez estabeleça uma analogia mais ampla entre o uso ilícito da descendência e a profanação cultual.
    reason: textual_variant
lexical_decisions:
- source_word: ዘያረኵስ
  choice: Quem a profanar
  rationale: Mantém o verbo de profanação e o objeto pronominal feminino implícito no contexto, sem substituir a expressão por uma explicação interpretativa.
- source_word: ሞተ፡ ለይሙት
  choice: certamente morrerá
  rationale: Reproduz em português natural a construção enfática semítica de verbo finito com forma cognata.
- source_word: ወበእብን፡ ይትወገር
  choice: e será apedrejado
  rationale: Traduz de modo corrente a formulação passiva literal, 'será atingido com pedra'.
- source_word: አልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ
  choice: Esta lei não tem limite de dias
  rationale: Conserva a afirmação de duração ilimitada da norma sem convertê-la em uma fórmula teológica mais específica.
- source_word: ይሤረው
  choice: será extirpado
  rationale: Preserva a imagem passiva de arrancar pela raiz ou eliminar, evitando o acréscimo interpretativo de 'matar imediatamente'.
- source_word: እምውስተ፡ ዘርኡ፡ ወሀቦ፡ ለሞሎክ
  choice: deu de sua descendência a Moloque
  rationale: Mantém a formulação concreta e abrupta do texto etíope acerca da descendência entregue a Moloque.
theological_decisions:
- issue: Sentido da extirpação do transgressor
  choice: será extirpado
  alternative: será morto / será eliminado da comunidade
  rationale: O texto não explicita se a imagem indica execução física, exclusão comunitária ou ambas; a tradução preserva essa tensão.
- issue: Relação da referência a Moloque com a profanação da filha
  choice: manter a oração sem explicitar a relação lógica
  alternative: explicar como analogia entre relações ilícitas e oferta cultual de descendentes
  rationale: A cláusula é abrupta no contexto e sua função exata não deve ser resolvida dentro do texto traduzido.
- issue: Referente do pronome final
  choice: profanando-a
  alternative: cometer profanação
  rationale: O feminino retoma naturalmente 'uma filha', mas conserva a forma pronominal em vez de desenvolver uma interpretação adicional.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formulações bíblicas reconhecíveis sem arcaísmo excessivo. A construção enfática foi naturalizada como “certamente morrerá”, enquanto “será extirpado” conserva a imagem e a ambiguidade do original.
