revisions:
- from: Quem a profanar certamente morrerá e será apedrejado. Esta lei não tem limite de dias, nem há perdão ou qualquer expiação; antes, será extirpado[a] o homem que tiver profanado uma filha no meio de todo o Israel, pois deu de sua descendência a Moloque[b] e agiu perversamente, profanando-a.
  to: Quem a profanar certamente morrerá e será apedrejado. Esta lei não tem limite de dias, nem há perdão nem expiação alguma, salvo que o homem que tiver profanado uma filha no meio de todo o Israel será extirpado[a], pois deu de sua descendência a Moloque[b] e agiu perversamente, profanando-a.
  rationale: Substituí a construção contrastiva com «antes» por «salvo que», a fim de refletir mais claramente a relação excepcional preservada pelo texto-fonte, e ajustei a dupla negação para uma formulação idiomática. Não alterei a ambiguidade de «extirpado», a referência abrupta a Moloque, nem os referentes femininos contextuais.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:08:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente os elementos centrais do ge''ez: a fórmula enfática de morte, o apedrejamento, a vigência sem limite temporal, a ausência de perdão/expiação e a imagem passiva de extirpação. Também mantém, sem harmonizá-la, a cláusula abrupta sobre Moloque. A revisão proposta apenas torna mais clara em português a relação excepcional entre a ausência de expiação e a extirpação do infrator.'
  naturalness: 'O texto é geralmente natural e digno. Contudo, «nem há perdão ou qualquer expiação; antes, será extirpado» emprega «antes» de modo pouco claro: pode soar como mera oposição, quando a construção fonte apresenta a extirpação como a única resolução indicada. «Nem perdão nem expiação alguma» é também mais idiomático.'
  terminology: «Profanar», «apedrejado», «extirpado», «descendência» e «Moloque» são escolhas adequadas. «Será extirpado» conserva corretamente a imagem e a indeterminação da sanção, sem reduzi-la a execução. As notas preservam utilmente tanto essa ambiguidade quanto a dificuldade contextual da menção a Moloque.
  issues:
  - severity: low
    issue: A conjunção «antes» deixa imprecisa a relação da oração de extirpação com a ausência de perdão e expiação.
    rationale: O ge'ez, tal como refletido na trilha de auditoria inglesa, introduz a extirpação como a única medida indicada, não simplesmente como uma frase contrastiva. «Salvo que» reproduz melhor essa relação sem definir o sentido de «extirpado».
  - severity: low
    issue: «Nem há perdão ou qualquer expiação» é menos fluente que uma coordenação negativa paralela.
    rationale: «Nem perdão nem expiação alguma» é português moderno mais natural e mantém integralmente a negação abrangente.
  revised_text: Quem a profanar certamente morrerá e será apedrejado. Esta lei não tem limite de dias, nem há perdão nem expiação alguma, salvo que o homem que tiver profanado uma filha no meio de todo o Israel será extirpado[a], pois deu de sua descendência a Moloque[b] e agiu perversamente, profanando-a.
  revised_footnotes:
