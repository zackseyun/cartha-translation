base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/008.yaml
  text: They shall burn her with fire, because she has defiled the name of her father's house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel throughout all the days of the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.
translation:
  language: pt
  text: Queimem-na no fogo, porque ela profanou o nome da casa de seu pai; ela será extirpada de Israel. Que nenhum fornicador nem pessoa impura seja encontrado em Israel durante todos os dias das gerações da terra[a], pois Israel é santo para o SENHOR. Todo homem que o profanar certamente morrerá; deverão apedrejá-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por todas as gerações da terra”.'
    reason: Registra uma forma portuguesa mais compacta da expressão temporal, embora o texto principal preserve o elemento “dias” presente no ge'ez.
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: Queimem-na no fogo
  rationale: Preserva o objeto feminino expresso pelo sufixo e a imagem jurídica concreta do texto, em português natural.
- source_word: አርኰሰት
  choice: profanou
  rationale: No contexto do nome da casa paterna, “profanou” comunica melhor a desonra e contaminação cultual que apenas “tornou impuro”.
- source_word: ወትሠረው፡ እምእስራኤል
  choice: ela será extirpada de Israel
  rationale: Mantém a força da exclusão total indicada pelo verbo e a formulação bíblica tradicional sem soar arcaica.
- source_word: ዘማ፡ ወርኵስ
  choice: fornicador nem pessoa impura
  rationale: Distingue a imoralidade sexual da impureza expressa pelos dois termos coordenados, sem fundi-los.
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: durante todos os dias das gerações da terra
  rationale: Conserva explicitamente “dias”, presente no ge'ez, e o característico alcance temporal da expressão.
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: Israel é santo para o SENHOR
  rationale: Reproduz diretamente a santidade de Israel em relação ao nome divino; “SENHOR” segue a convenção portuguesa para o referente divino.
- source_word: ሞተ፡ ለይሙት
  choice: certamente morrerá
  rationale: Representa a construção enfática de morte sem impor uma explicação jurídica além do texto.
- source_word: በእብን፡ ይውግርዎ
  choice: deverão apedrejá-lo
  rationale: Expressa idiomaticamente a execução por pedras; o pronome masculino mantém o referente “todo homem”.
theological_decisions:
- issue: Referente do pronome em “todo homem que o profanar”
  choice: “o” refere-se a Israel
  alternative: Entender o objeto como o nome divino, a santidade ou uma referência implícita
  rationale: O antecedente gramatical mais próximo e explícito é Israel; o pronome preserva essa ligação sem acrescentar um objeto interpretativo.
- issue: Valor de santidade aplicado a Israel
  choice: “Israel é santo para o SENHOR”
  alternative: “Israel é consagrado ao SENHOR”
  rationale: “Santo” preserva a formulação e a tensão teológica do original; “consagrado” explicitaria apenas um aspecto possível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantêm-se o paralelismo jurídico, a repetição conceitual e a linguagem forte do texto, evitando tanto arcaísmos desnecessários quanto suavização teológica.
