  text: And in the first year of the sixth week[1], he went up to Salem, east of Shechem, in peace, in the fourth month.
translation:
  language: pt
  text: No primeiro ano da sexta semana[a], ele subiu a Salém, a leste de Siquém, em paz, no quarto mês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase inicial apresenta dificuldades textuais. O texto geʽez parece situar o acontecimento no primeiro ano da sexta semana e relacionar o deslocamento a Salém, na região a leste de Siquém. O sujeito é Jacó, em seu retorno a Canaã.
    reason: segmentation_note
lexical_decisions:
- source_word: ሱባዔ ፮ይስ
  choice: sexta semana
  rationale: Mantém a terminologia cronológica característica de Jubileus, em que cada “semana” corresponde a um período de sete anos.
- source_word: ሰሌማሃ
  choice: Salém
  rationale: Translitera o topônimo como Salém, forma natural em português e coerente com sua identificação como lugar próximo de Siquém.
- source_word: ዘመንገለ ጽባሒሁ ለሰቂማ
  choice: a leste de Siquém
  rationale: Expressa de modo claro e conciso a localização de Salém em relação a Siquém, sem transformar a indicação geográfica em identificação absoluta.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe simples. Conserva-se “semana” como unidade cronológica própria do livro e usa-se “Salém” para o topônimo. A leitura “quarto mês” segue o texto etíope padrão; não se registra “sétimo mês” como variante, pois a revisão fornecida a identifica como erro de uma etapa anterior.
