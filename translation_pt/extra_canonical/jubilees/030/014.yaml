  text: And it is abominable for Israel. And Israel will not be cleansed from this uncleanness, who has a wife from the daughters of the nations,
translation:
  language: pt
  text: E isto é abominável para Israel. Israel não será purificado dessa impureza se houver em Israel uma mulher dentre as filhas das nações,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no qual há uma mulher dentre as filhas das nações”.'
    reason: A construção ge'ez pode ter valor condicional ou relativo. Ambas as leituras indicam a presença, em Israel, de uma mulher proveniente das nações, sem explicitar nesta frase a relação matrimonial.
lexical_decisions:
- source_word: ምኑን
  choice: abominável
  rationale: Expressa a forte reprovação ritual e moral do termo no contexto, em linguagem bíblica corrente.
- source_word: ኢይነጽሕ
  choice: não será purificado
  rationale: Preserva o sentido de tornar-se ou ser declarado limpo, em vez de reduzir a expressão à ideia geral de perdão.
- source_word: ርኵስ
  choice: impureza
  rationale: Mantém o campo semântico ritual do termo e sua ligação com a purificação.
- source_word: ዘቦ፡ ብእሲት
  choice: se tiver por esposa uma mulher
  rationale: Representa a construção relativa/condicional com valor possessivo ('que/se tem uma esposa') e evita interpretá-la apenas como existência de uma mulher.
- source_word: እም
  choice: dentre
  rationale: Indica origem ou pertencimento ao grupo, de modo natural em português.
theological_decisions:
- issue: Natureza da contaminação mencionada
  choice: impureza
  alternative: imundícia
  rationale: A tradução conserva a categoria de pureza sem acrescentar uma explicação doutrinária que o trecho não fornece.
- issue: Relação expressa por ዘቦ፡ ብእሲት
  choice: se tiver por esposa uma mulher
  alternative: que tem uma esposa
  rationale: O contexto permite valor condicional ou relativo; o texto principal usa a leitura condicional natural e a nota registra a alternativa, sem eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário bíblico acessível. A expressão “filhas das nações” foi mantida por seu caráter histórico e literário, sem ser substituída por uma interpretação explicativa.
