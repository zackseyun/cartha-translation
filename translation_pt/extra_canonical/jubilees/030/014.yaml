review_pass:
  verdict: revise
  source_fidelity: A expressão ge'ez ዘቦ፡ ብእሲት é literalmente uma construção relativa/condicional com o sentido de haver uma mulher «nele», isto é, em Israel. O texto proposto acrescenta de modo indevido a relação específica «por esposa», que não é explicitada por ብእሲት («mulher») nesta frase. A revisão conserva a ambiguidade sintática mediante a nota e mantém a referência coletiva a Israel.
  naturalness: «Se houver nele uma mulher» é compreensível, mas «se houver em Israel uma mulher» é mais natural em português moderno e torna explícito o antecedente coletivo implícito no pronome ge'ez. «Isto é abominável para Israel» mantém registro bíblico claro e sóbrio.
  terminology: «Abominável», «purificado», «impureza» e «filhas das nações» são escolhas adequadas e preservam o vocabulário moral-ritual e a formulação histórica do texto. Evita-se converter «mulher» em «esposa», uma especificação interpretativa.
  issues:
  - severity: medium
    issue: «se tiver por esposa uma mulher» acrescenta uma relação matrimonial não expressa no texto-fonte.
    rationale: A construção ዘቦ፡ ብእሲት pode ser entendida como «se houver nele uma mulher» ou, relativamente, «no qual há uma mulher». Embora o contexto mais amplo trate de uniões com estrangeiras, este versículo não emprega aqui um termo que exija «esposa».
  - severity: low
    issue: A nota alternativa também reproduz a especificação «por esposa».
    rationale: Para preservar a ambiguidade relevante, a alternativa deve refletir a construção relativa sem introduzir uma relação possessiva ou matrimonial mais definida que o ge'ez.
