base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/002.yaml
  text: And there Shechem[2], the son of Hamor the Hivite, the prince of the land, saw Dinah, Jacob's daughter, and he seized her and lay with her and defiled her, and she was a young girl.
translation:
  language: pt
  text: Ali, Siquém, filho de Hamor, o heveu, príncipe daquela terra, viu Diná, filha de Jacó. Ele a agarrou, deitou-se com ela e a tornou impura; ela era uma menina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto indica que Diná era uma menina; o versículo seguinte informa que ela tinha doze anos.
    reason: lexical_alternative
lexical_decisions:
- source_word: መስተዋ
  choice: viu
  rationale: Traduz diretamente o verbo de percepção visual no contexto narrativo.
- source_word: ወሰተ
  choice: agarrou
  rationale: Expressa a ação coercitiva de tomar ou apoderar-se dela, sem suavizar a violência do relato.
- source_word: ወሰከበ፡ ምስሌሃ
  choice: deitou-se com ela
  rationale: Mantém o eufemismo sexual tradicional do texto-fonte em português natural.
- source_word: ወአርኰሳ
  choice: e a tornou impura
  rationale: Preserva o sentido de contaminar ou tornar impura, central à linguagem de impureza deste capítulo, em vez de importar o sentido de 'humilhar' da formulação hebraica de Gênesis 34:2.
- source_word: ወይእቲሰ፡ ንስቲት
  choice: ela ainda era uma menina
  rationale: Comunica de modo natural que Diná era uma menina jovem; 'ainda' explicita a força contextual sem antecipar a idade informada no versículo seguinte.
theological_decisions:
- issue: Linguagem de impureza aplicada a Diná
  choice: a tornou impura
  alternative: a humilhou / a desonrou
  rationale: O verbo ge'ez empregado significa contaminar ou tornar impuro. A tradução conserva a terminologia própria de Jubileus sem transferir automaticamente a redação de Gênesis nem insinuar culpa moral da vítima.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A narrativa foi dividida em duas frases para evitar uma sequência excessiva de orações coordenadas. O segmento inicial do testemunho fornecido, «em paz, no sexto mês», parece pertencer ao fechamento do versículo anterior segundo a segmentação consultada e, por isso, não foi incorporado a 30:2.
