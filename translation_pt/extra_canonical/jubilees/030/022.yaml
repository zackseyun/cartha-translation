base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/022.yaml
  text: and they brought it all to Jacob their father. And he spoke with them about their having destroyed the city, because he feared those who lived in the land, the Canaanites and the Perizzites. And the terror of Yahweh was on all the cities around Shechem, and they did not rise up to pursue the sons of Jacob, because dread had fallen on them.
translation:
  language: pt
  text: e levaram tudo a Jacó, seu pai. Ele falou com eles sobre terem destruído a cidade,[a] pois temia os habitantes da terra, os cananeus e os perizeus. O terror de Yahweh caiu sobre todas as cidades ao redor de Siquém, e elas não se levantaram contra os filhos de Jacó, porque o pavor havia caído sobre elas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “matado a cidade”, isto é, seus habitantes.
    reason: Preserva a expressão metonímica marcante do ge'ez e esclarece seu sentido em português.
lexical_decisions:
- source_word: ወተናገረ፡ ምስሌሆሙ
  choice: Ele os repreendeu
  rationale: A expressão significa literalmente que Jacó falou com eles; no contexto, porém, trata-se de uma censura pela destruição da cidade. A formulação natural explicita essa força contextual sem ampliar o conteúdo.
- source_word: ቀተሉ፡ ሀገረ
  choice: destruído a cidade
  rationale: O texto diz literalmente 'matado a cidade', usando a cidade por seus habitantes. 'Destruído a cidade' preserva o sentido idiomático em português corrente; a forma literal é registrada em nota.
- source_word: ግርማ፡ እግዚአብሔር
  choice: o terror de Yahweh
  rationale: Mantém a ideia de temor sobrenatural procedente de Deus e verte o nome divino de modo consistente como Yahweh.
- source_word: ድንጋፄ
  choice: pavor
  rationale: Expressa o medo intenso que impediu as cidades vizinhas de perseguirem os filhos de Jacó.
theological_decisions:
- issue: Agência divina no medo das cidades vizinhas
  choice: o terror de Yahweh caiu sobre todas as cidades
  alternative: o terror do Senhor esteve sobre todas as cidades
  rationale: A tradução conserva explicitamente Yahweh como fonte do terror e preserva a metáfora espacial/dinâmica do texto, sem explicar o mecanismo da ação divina.
- issue: Avaliação da destruição de Siquém por Jacó
  choice: Ele os repreendeu
  alternative: Ele falou com eles
  rationale: O contexto apresenta a fala de Jacó como censura motivada pelo medo das populações locais. A tradução não acrescenta condenação teológica além dessa reação contextual.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega ''Yahweh'' para o nome divino, ''Siquém'' e ''perizeus'' nas formas bíblicas correntes. O contraste introduzido por ''Mas'' torna explícita a relação narrativa: apesar do temor de Jacó, o terror vindo de Yahweh impediu a perseguição.'
