  text: And so they inscribe for him on the heavenly tablets blessing and righteousness before the God of all.
translation:
  language: pt
  text: E assim registram em seu favor, como testemunho nas tábuas celestiais, bênção e justiça diante do Deus de todas as coisas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዐርጉ፡ ሎቱ
  choice: registram em seu favor
  rationale: A expressão significa literalmente algo como “fazem subir para ele”, mas, no contexto das tábuas celestiais, descreve o registro feito em favor de Levi; “registram em seu favor” comunica naturalmente essa função.
- source_word: በስምዐ
  choice: como testemunho
  rationale: Preserva um elemento explícito do ge'ez que não aparece na redação inglesa fornecida, indicando que o registro celestial serve de testemunho.
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Mantém a imagem técnica e recorrente do livro de Jubileus.
- source_word: በረከተ፡ ወጽድቀ
  choice: bênção e justiça
  rationale: Reproduz diretamente os dois substantivos coordenados, sem explicar ou reduzir sua tensão teológica.
- source_word: ለአምላከ፡ ኵሉ
  choice: do Deus de todas as coisas
  rationale: Expressa o alcance universal da fórmula de modo claro, evitando que “Deus de todos” seja entendido apenas como referência a pessoas.
theological_decisions:
- issue: Natureza do reconhecimento concedido a Levi
  choice: Manter “bênção e justiça” como conteúdo do registro celestial
  alternative: Parafrasear como “declaração de que ele foi abençoado e considerado justo”
  rationale: O texto apresenta substantivos teologicamente densos e não esclarece se se trata de qualidades, recompensas ou veredictos; a tradução preserva essa abertura.
- issue: Função das tábuas celestiais
  choice: Explicitar a frase fonte “como testemunho” sem ampliar seu sentido
  alternative: Seguir a camada inglesa e omitir a referência ao testemunho
  rationale: A evidência em ge'ez contém በስምዐ, e sua retenção preserva a função testemunhal do registro.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e terminologia coerente com o universo literário de Jubileus. A formulação segue prioritariamente o ge'ez e conserva o elemento “como testemunho”, ausente na camada inglesa de consulta.
