  yaml_path: translation/extra_canonical/jubilees/030/019.yaml
  text: 'And for this reason they inscribe for him a testimony of favor[a] on the heavenly tablets: blessing and righteousness before the God of all.'
translation:
  language: pt
  text: 'E por isso eles lhe inscrevem nas tábuas celestiais um testemunho de favor[a]: bênção e retidão diante do Deus de todos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Geʿez: ስምዐ ፡ ሞገስ (semʿa mogas), expressão que indica um registro formal de aprovação ou favor divino.'
    reason: lexical_choice
lexical_decisions:
- source_word: ይጽሕፉ
  choice: eles lhe inscrevem
  rationale: Preserva a forma verbal ativa no plural e o objeto indireto; o sujeito permanece sem identificação explícita, como no geʿez.
- source_word: ስምዐ ፡ ሞገስ
  choice: um testemunho de favor
  rationale: Expressa a ideia de um registro formal de aprovação ou benevolência, sem restringir ሞገስ ao sentido teológico mais específico de “graça”.
- source_word: ጽላተ ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Formulação natural em português que conserva a imagem das tábuas do céu.
- source_word: ጽድቀ
  choice: justiça
  rationale: Mantém o valor nominal amplo do termo, sem convertê-lo em uma avaliação moral mais interpretativa.
- source_word: አምላከ ፡ ኵሉ
  choice: Deus de todos
  rationale: Reproduz de modo direto o genitivo do original e preserva a abrangência pessoal ou universal de “todos”.
theological_decisions:
- issue: Referente do sujeito plural de ይጽሕፉ
  choice: Manter “eles” sem identificar o referente
  alternative: “é inscrito” ou “os anjos inscrevem”
  rationale: O texto apresenta um verbo ativo plural, mas não nomeia aqui os agentes; identificá-los como anjos resolveria uma ambiguidade que o versículo preserva.
- issue: Sentido de ሞገስ
  choice: favor
  alternative: graça
  rationale: “Favor” comunica aprovação benevolente sem importar uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. A tradução conserva o sujeito plural não identificado e limita-se estritamente ao conteúdo de Jubileus 30:19.
