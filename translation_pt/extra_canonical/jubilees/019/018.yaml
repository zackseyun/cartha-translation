  text: Pois sei que o SENHOR o escolherá para si como povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አእምር
  choice: sei
  rationale: O verbo exprime conhecimento; a primeira pessoa singular é indicada pelo contexto e confirmada pela tradição textual consultada.
- source_word: ያኀሪ
  choice: escolherá
  rationale: Preserva o sentido de eleição/escolha e a referência futura da oração.
- source_word: እግዚአብሔር
  choice: o SENHOR
  rationale: Forma portuguesa tradicional e dignificada para o título divino presente no texto.
- source_word: ሎቱ
  choice: para si
  rationale: Mantém a ideia de que a escolha é feita pelo SENHOR em relação a ele próprio.
- source_word: ለሕዝብ
  choice: como povo
  rationale: Reproduz a construção predicativa 'por/como povo' sem acrescentar qualificações ausentes.
theological_decisions:
- issue: O singular 'ele' seguido de 'como povo'
  choice: Preservar a formulação 'o escolherá para si como povo'
  alternative: Explicitar que dele surgirá um povo ou traduzir 'escolherá sua descendência como povo'
  rationale: Embora a combinação possa soar incomum, ela preserva a tensão e a formulação compacta do testemunho fornecido, sem inserir 'descendência' ou resolver interpretativamente a relação entre o indivíduo e o povo.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem foi levemente naturalizada, mas a concisão e a ambiguidade do original foram mantidas.
