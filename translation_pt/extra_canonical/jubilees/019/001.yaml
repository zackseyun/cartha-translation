  yaml_path: translation/extra_canonical/jubilees/019/001.yaml
  text: And in the first year of the first week in the fifty-eighth jubilee[1], Abraham returned and dwelt opposite Hebron—that is, Kiriath-arba—for another week of years.
translation:
  language: pt
  text: E, no primeiro ano da primeira semana do quinquagésimo oitavo jubileu, Abraão voltou e habitou defronte de Hebrom — isto é, Quiriate-Arba — por mais uma semana de anos[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Isto é, mais um período de sete anos.
    reason: clarification
lexical_decisions:
- source_word: ፶ወ፰
  choice: quinquagésimo oitavo
  rationale: O numeral ge'ez é literalmente cinquenta e oito; a tradução segue o texto-fonte fornecido.
- source_word: አንጻረ
  choice: diante de
  rationale: Preserva a relação espacial de estar defronte ou em frente a Hebrom, com formulação bíblica natural em português.
- source_word: ሱባዔ፡ ዓመት
  choice: semana de anos
  rationale: Mantém o conceito calendárico característico de Jubileus, em vez de reduzi-lo dinamicamente a 'sete anos'.
- source_word: ቀርያታርቦቅ
  choice: Quiriate-Arba
  rationale: Adota a forma bíblica portuguesa reconhecível para o topônimo identificado com Hebrom.
theological_decisions:
- issue: Terminologia calendárica de Jubileus
  choice: semana de anos
  alternative: sete anos
  rationale: A expressão técnica estrutura a cronologia e a teologia do livro; preservá-la evita apagar essa associação.
- issue: Número do jubileu
  choice: quinquagésimo oitavo
  alternative: quadragésimo oitavo (ou outras leituras críticas)
  rationale: O texto ge'ez fornecido traz ፶ወ፰, isto é, 58; variantes externas não devem substituir a evidência-base desta tarefa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva a fórmula cronológica e a terminologia especializada do livro, sem tornar a frase excessivamente arcaica.
