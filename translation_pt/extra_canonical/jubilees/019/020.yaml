revisions:
- from: Ele ama Esaú mais do que Jacó, mas vejo em você um justo amor por Jacó. Continue a tratá-lo com bondade, e que os seus olhos estejam sobre ele com amor, pois, de agora em diante e por todas as gerações da terra, ele será uma bênção na terra.
  to: Ele[a] ama Esaú mais do que Jacó, mas vejo que seu amor por Jacó é justo. Continue a mostrar-lhe bondade e mantenha os olhos sobre ele com amor, pois ele será uma bênção na terra, de agora em diante e por todas as gerações da terra.
  rationale: A revisão mantém a ambiguidade contextual quanto à identidade de «Ele», conserva Jacó como referente dos pronomes posteriores e não altera a afirmação de que ele será uma bênção. Apenas melhora a naturalidade do português e restaura a nota alternativa com sua âncora.
