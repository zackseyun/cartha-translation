  yaml_path: translation/extra_canonical/jubilees/019/020.yaml
  text: He loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.
translation:
  language: pt
  text: Ele[a] ama Esaú mais do que Jacó, mas vejo que seu amor por Jacó é justo. Continue a mostrar-lhe bondade e mantenha os olhos sobre ele com amor, pois ele será uma bênção na terra, de agora em diante e por todas as gerações da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ama Esaú».'
    reason: 'Preserva a alternativa do trilho inglês: o verbo ge''ez pode ser traduzido em português sem explicitar o sujeito, que está nele implícito.'
lexical_decisions:
- source_word: ያፈቅሮ፡ ለዔሳው፡ እም፡ ያዕቆብ
  choice: Ele ama Esaú mais do que Jacó
  rationale: O verbo ge'ez inclui sujeito masculino singular e a construção comparativa indica preferência por Esaú em relação a Jacó. O pronome «Ele» torna a oração completa em português sem explicitar um referente que o trecho não nomeia.
- source_word: መፍቀሪተ፡ ጽድቅ፡ ያዕቆብሃ
  choice: um justo amor por Jacó
  rationale: Reproduz a associação entre «amor/afeição» e «justiça/retidão» em linguagem portuguesa natural, sem transformar a expressão numa afirmação doutrinária.
- source_word: አሡንዮ፡ ላዕሌሁ
  choice: Continue a tratá-lo com bondade
  rationale: Expressa de modo idiomático a exortação a continuar demonstrando bondade a Jacó.
- source_word: ወይኩና፡ አዕይንትኪ፡ ላዕሌሁ፡ ለፍቅር
  choice: que os seus olhos estejam sobre ele com amor
  rationale: Mantém a imagem concreta dos olhos voltados para alguém, preservando o tom afetivo e protetor do original.
- source_word: ውእቱ፡ ይከውን
  choice: ele será
  rationale: Conserva a referência masculina singular a Jacó e o sentido futuro do enunciado.
theological_decisions:
- issue: Identidade do sujeito que ama Esaú
  choice: Manter apenas «Ele»
  alternative: Explicitar «Isaque»
  rationale: O contexto pode identificar o sujeito como Isaque, mas o segmento ge'ez apresentado não traz o nome; por isso, a tradução não resolve implicitamente a referência.
- issue: Jacó como bênção na terra
  choice: «ele será uma bênção na terra»
  alternative: «por meio dele a terra será abençoada»
  rationale: A formulação escolhida preserva a predicação direta apresentada pela tradição textual consultada, sem converter a frase numa explicação teológica mais específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. Conserva-se a imagem semítica dos olhos postos sobre Jacó e evita-se nomear o sujeito implícito. A parte final segue a evidência da camada inglesa auditada porque o excerto ge'ez fornecido termina no início da oração correspondente.
