  yaml_path: translation/extra_canonical/jubilees/019/015.yaml
  text: And all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and commanded her concerning Jacob, because he knew that she loved Jacob much more.
translation:
  language: pt
  text: E todos os atos de Esaú eram violentos. Abraão amava Jacó, mas Isaque amava Esaú. Abraão viu os atos de Esaú e soube que, em Jacó, seu nome e sua descendência seriam chamados[a]. Então chamou Rebeca e deu-lhe ordens a respeito de Jacó, pois sabia que ela amava Jacó muito mais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que, por meio de Jacó, seu nome e sua descendência seriam reconhecidos”. A expressão original emprega literalmente o verbo “chamar” e pode referir-se à continuidade ou à identificação do nome e da linhagem em Jacó.'
    reason: Esclarece o idioma pouco natural em português, sem substituir no texto principal a formulação aberta do original.
lexical_decisions:
- source_word: ግብሩ፡ ድሩክ
  choice: seus atos eram violentos
  rationale: O substantivo indica atos ou conduta, e o predicativo descreve dureza, ferocidade ou violência. “Atos violentos” é claro e natural sem reduzir a expressão apenas ao temperamento de Esaú.
- source_word: ያፈቅሮ
  choice: amava
  rationale: Mantém o sentido direto do verbo de afeição e o contraste explícito entre a preferência de Abraão por Jacó e a de Isaque por Esaú.
- source_word: ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርእ
  choice: seu nome e sua descendência seriam chamados
  rationale: Conserva a imagem verbal de “chamar” e a associação de nome e descendência com Jacó, em vez de resolver o idioma como “perpetuados” ou “preservados” no texto principal.
- source_word: አዘዘ፡ በእንተ፡ ያዕቆብ
  choice: lhe deu instruções a respeito de Jacó
  rationale: Expressa de modo idiomático que Abraão incumbiu ou instruiu Rebeca acerca de Jacó, sem especificar um conteúdo que o versículo não fornece.
- source_word: ፈድፋደ
  choice: muito mais
  rationale: Reproduz a intensificação da preferência de Rebeca por Jacó e acompanha a leitura atestada na camada inglesa auditada.
theological_decisions:
- issue: Sentido de o nome e a descendência serem “chamados” em Jacó
  choice: Manter no texto a linguagem de “ser chamados” e explicar sua amplitude em nota.
  alternative: Traduzir interpretativamente como “seriam perpetuados”, “seriam reconhecidos” ou “continuariam”.
  rationale: A formulação de origem preserva uma imagem potencialmente ampla, ligada à identificação, continuidade ou designação da linhagem. Uma solução mais explícita eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Os nomes próprios seguem as formas bíblicas correntes. O primeiro pronome implícito foi explicitado como “Esaú” para evitar ambiguidade no início isolado do versículo; a repetição de “atos” mantém a ligação interna do texto.
