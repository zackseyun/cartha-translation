  text: If a man can count the sand of the earth, then his seed also will be counted. And all the blessings with which he blessed me
translation:
  language: pt
  text: Se alguém puder contar a areia da terra, também a sua descendência será contada. E todas as bênçãos com as quais ele me abençoou
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብእ
  choice: alguém
  rationale: Embora o substantivo possa significar literalmente “homem”, nesta construção hipotética tem sentido genérico; “alguém” é natural e inclusivo em português.
- source_word: ኖላ፡ ምድር
  choice: a areia da terra
  rationale: Mantém a imagem e a formulação do texto-fonte, em concordância com o sentido contextual.
- source_word: ዘርኡሂ
  choice: também a sua descendência
  rationale: “Descendência” expressa naturalmente o sentido coletivo de “semente” aplicado aos descendentes, enquanto a partícula associada é representada por “também”.
- source_word: ይትኌለቍ
  choice: será contada
  rationale: Preserva a forma passiva e a correspondência verbal entre contar a areia e contar a descendência.
- source_word: ባረከኒ
  choice: ele me abençoou
  rationale: A forma verbal significa “ele me abençoou”; o sujeito explícito “o SENHOR” não aparece neste segmento e, por isso, não é acrescentado.
theological_decisions:
- issue: Identidade do sujeito de ባረከኒ
  choice: ele me abençoou
  alternative: o SENHOR me abençoou
  rationale: O texto-fonte deixa o sujeito apenas implícito na forma verbal. A tradução conserva essa referência anafórica sem inserir uma identificação teológica não expressa no segmento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O período permanece incompleto no fim, como no fragmento fornecido, pois a oração iniciada por “E todas as bênçãos...” continua além deste versículo ou recorte.
