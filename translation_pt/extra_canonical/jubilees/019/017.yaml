  text: than Esau. And he said to her, “My daughter, keep my son Jacob, for he will be in my place on the earth, and for a blessing in the midst of the sons of men, and for all the seed of Shem.”
translation:
  language: pt
  text: 'do que Esaú. E ele lhe disse: “Minha filha, cuide de meu filho Jacó, pois ele ocupará o meu lugar na terra e será uma bênção entre os filhos dos homens e para toda a descendência de Sem.”¹'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቀቢ
  choice: cuide de
  rationale: O imperativo transmite a ideia de guardar, proteger ou tomar conta; “cuide de” é natural em português e preserva o sentido no contexto familiar.
- source_word: ህየንቴየ
  choice: ocupará o meu lugar
  rationale: A expressão significa estar ou agir em lugar de alguém; esta formulação comunica com clareza a ideia de substituição ou sucessão.
- source_word: ለበረከት
  choice: será uma bênção
  rationale: A construção final/predicativa é vertida idiomaticamente, mantendo o substantivo teologicamente relevante “bênção”.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Mantém a expressão antropológica tradicional e inteligível, sem restringi-la indevidamente a um grupo específico.
- source_word: ኵሉ፡ ዘርኡ ሴም
  choice: toda a descendência de Sem
  rationale: Traduz literalmente a referência à totalidade da semente/linhagem de Sem; “descendência” é mais natural que “semente” neste contexto genealógico.
theological_decisions:
- issue: Relação de Jacó com a bênção
  choice: “será uma bênção entre os filhos dos homens e para toda a descendência de Sem”
  alternative: “será para bênção no meio dos filhos dos homens e para toda a descendência de Sem”
  rationale: A redação escolhida preserva o alcance amplo da afirmação e soa natural, sem explicar de que modo Jacó será bênção.
- issue: Ausência de “glória” na cláusula final
  choice: Não incluir “glória”
  alternative: “e para a glória de toda a descendência de Sem”
  rationale: O texto ge'ez fornecido não contém um termo correspondente a “glória”; incluí-lo importaria uma expansão ou emenda não sustentada pela fonte.
translation_notes:
  register: Português moderno, digno e acessível, com leitura brasileira. O fragmento inicial “do que Esaú” foi mantido por dar continuidade sintática ao versículo anterior. A fala direta conserva o tom familiar e solene.
