  text: May God be mine and my seed's, Jacob's and his seed's, forever. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth—shall be blessed.
translation:
  language: pt
  text: Que Deus seja meu e da minha descendência, de Jacó e da descendência dele, para sempre.[a] E, na descendência dele, sejam abençoados o meu nome e o nome dos meus antepassados — Sem, Noé, Enoque, Maalalel, Enos e Sete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e que a minha descendência pertença a Jacó e à descendência dele para sempre”.'
    reason: Registra a leitura alternativa da relação sintática e possessiva na primeira oração.
lexical_decisions:
- source_word: እግዚአብሔር፡ ኪያየ፡ ... ይኩን
  choice: Que Deus seja meu...
  rationale: Mantém እግዚአብሔር (“Deus”) como sujeito de ይኩን e entende ኪያየ em sentido possessivo, conforme a construção e a evidência contextual.
- source_word: ዘርእ / ዘርኡ
  choice: descendência / descendência dele
  rationale: “Descendência” comunica naturalmente o valor coletivo de “semente” em português e preserva a referência genealógica.
- source_word: ኵሎ፡ መዋዕለ
  choice: para sempre
  rationale: Expressa de modo corrente e solene a ideia idiomática de totalidade dos dias, isto é, duração perpétua.
- source_word: ይትባረክ
  choice: sejam benditos
  rationale: Reproduz explicitamente o verbo “ser bendito/abençoado”; o plural em português concorda com o sujeito composto “o meu nome e o nome dos meus pais”.
- source_word: አበዊየ
  choice: meus pais
  rationale: Preserva o sentido amplo de antepassados designados como “pais”, sem substituir a imagem familiar do texto.
theological_decisions:
- issue: Relação possessiva entre Deus, a linhagem do falante, Jacó e sua linhagem
  choice: “Que Deus seja meu e da minha descendência, de Jacó e da descendência dele”
  alternative: “e que a minha descendência pertença a Jacó e à descendência dele”
  rationale: A leitura principal conserva Deus como sujeito da forma verbal e não transforma silenciosamente a descendência no sujeito. A alternativa histórica é registrada em nota por causa da possível ambiguidade sintática, sem impor uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Empregam-se “descendência” em vez do literalismo “semente” e as formas tradicionais, amplamente reconhecíveis, dos nomes próprios. O marcador [a] aparece no texto principal.
