- from: Que Deus seja meu e da minha descendência, de Jacó e da descendência dele, para sempre.[a] E, na descendência dele, sejam benditos o meu nome e o nome dos meus pais — Sem, Noé, Enoque, Maalalel, Enos e Sete.
  to: Que Deus seja meu e da minha descendência, de Jacó e da descendência dele, para sempre.[a] E, na descendência dele, sejam abençoados o meu nome e o nome dos meus antepassados — Sem, Noé, Enoque, Maalalel, Enos e Sete.
