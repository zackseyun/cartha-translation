  text: And Abraham took for himself a third wife, and her name was Keturah, from among the daughters of the servants of his household.
translation:
  language: pt
  text: E Abraão tomou para si uma terceira esposa, e o nome dela era Quetura, dentre as filhas dos servos de sua casa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ፡ ሣልስተ፡
  choice: uma terceira esposa
  rationale: Reproduz diretamente a ordem ordinal e emprega «esposa», termo natural e digno no contexto matrimonial.
- source_word: ኬጡራ፡
  choice: Quetura
  rationale: Usa a forma portuguesa tradicional e reconhecível do nome bíblico.
- source_word: እምነ፡ አዋልደ፡ ልደ፡ ቤቱ፡
  choice: dentre as filhas dos servos de sua casa
  rationale: 'Conserva a relação expressa pela fonte: Quetura provinha das filhas dos servos pertencentes à casa de Abraão, sem reduzir a expressão a «servas de sua casa».'
theological_decisions:
- issue: Relação de Quetura com Abraão
  choice: esposa
  alternative: mulher ou concubina
  rationale: O substantivo da fonte neste versículo designa uma mulher/esposa e o ordinal «terceira» a apresenta como esposa; não se introduz aqui a classificação de concubina encontrada em outras tradições textuais.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe fluente e proximidade semântica à fonte ge'ez. «Chamada Quetura» evita a construção menos natural «e seu nome era Quetura» sem perder conteúdo.
