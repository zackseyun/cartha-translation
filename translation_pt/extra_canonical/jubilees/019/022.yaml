lexical_decisions:
- source_word: ውሉድየ
  choice: meus filhos
  rationale: Mantém o vocativo possessivo do ge'ez e a continuidade sintática com o contexto anterior.
- source_word: እስከ ለዓለም
  choice: para sempre
  rationale: Expressão portuguesa natural para a ideia de duração perpétua.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: No contexto genealógico, traduz o coletivo 'semente' de modo claro e idiomático, sem restringi-lo a um único descendente.
- source_word: ይመልእ ኵላ ምድረ
  choice: encha toda a terra
  rationale: Reproduz de maneira direta a extensão universal expressa pelo verbo 'encher' e por 'toda a terra'.
theological_decisions:
- issue: Valor volitivo dos verbos na bênção
  choice: Que ele seja bendito... e que sua descendência encha
  alternative: Ele será bendito... e sua descendência encherá
  rationale: A forma e o contexto favorecem uma bênção ou desejo solene, sem transformar silenciosamente a expressão em simples previsão.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A formulação evita o literalismo pouco natural 'seja aquela que enche', mas conserva o sentido da construção relativa por meio do subjuntivo coordenado. O início em minúscula sinaliza que 'meus filhos' completa a frase do versículo anterior, conforme o recorte da fonte.
