revisions:
- from: Nisso, Abraão mostrou-se fiel e paciente de espírito. Não disse palavra alguma a respeito da promessa da terra, sobre a qual o SENHOR havia dito que a daria a ele e à sua descendência depois dele. Ainda assim, pediu ali um lugar para sepultar sua falecida, pois mostrou-se fiel e foi registrado como amigo.[a]
  to: Nisso, Abraão foi achado fiel, paciente de espírito. E não disse palavra alguma a respeito da promessa de que o SENHOR lhe daria a terra, a ele e à sua descendência depois dele. Contudo, pediu ali um lugar para sepultar seus mortos, pois foi achado fiel e foi registrado como amigo.[a]
  rationale: A revisão corrige a restrição indevida de «sua falecida» para «seus mortos», aproxima as duas ocorrências de fidelidade da construção passiva do original e esclarece que é a terra que o SENHOR prometera dar. Mantém-se a ausência de complementos não presentes no trecho ge'ez disponibilizado e conserva-se a âncora de nota existente.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:08:03Z'
review_pass:
  verdict: revise
  source_fidelity: A versão preserva bem a referência inicial («Nisso»), a paciência de espírito, a promessa da terra e a repetição da fidelidade. Contudo, «sua falecida» restringe indevidamente o ge'ez, que se refere a «seus mortos», e introduz uma identificação feminina que o versículo não explicita. «Mostrou-se fiel» também atenua a formulação passiva de constatação («foi achado fiel») do original.
  naturalness: O texto é claro e de registro apropriado. «Sua falecida», porém, soa elíptico e pouco natural no português atual; «seus mortos» é tanto mais idiomático quanto mais fiel. A reformulação da oração sobre a promessa elimina a ambiguidade de «a daria», cujo antecedente poderia parecer ser «promessa».
  terminology: «SENHOR», «descendência» e «paciente de espírito» são adequados. Não se deve acrescentar «do SENHOR» nem «nas tábuas celestiais», pois esses elementos não estão no segmento ge'ez fornecido. A nota pode conservar a imagem de escrita, mas deve refletir que o texto principal mantém o passivo.
  issues:
  - severity: medium
    issue: «sua falecida» traduz ቤድኖ
    rationale: A expressão fonte significa «seu(s) morto(s)», sem marcar no versículo nem o sexo nem a identidade da pessoa. A opção do rascunho estreita o sentido e depende de informação contextual não expressa.
  - severity: low
    issue: «mostrou-se fiel» para a repetida constatação de fidelidade
    rationale: O original emprega a ideia de Abraão ter sido achado/encontrado fiel. «Foi achado fiel» preserva melhor a voz e evita sugerir principalmente uma demonstração ativa.
  - severity: low
    issue: Ambiguidade em «a promessa da terra, sobre a qual o SENHOR havia dito que a daria»
    rationale: O pronome «a» pode retomar «promessa», embora o objeto dado seja a terra. «A promessa de que o SENHOR lhe daria a terra» torna a relação inequívoca.
  revised_text: Nisso, Abraão foi achado fiel, paciente de espírito. E não disse palavra alguma a respeito da promessa de que o SENHOR lhe daria a terra, a ele e à sua descendência depois dele. Contudo, pediu ali um lugar para sepultar seus mortos, pois foi achado fiel e foi registrado como amigo.[a]
  revised_footnotes:
  - marker: a
    text: Literalmente, “foi escrito como amigo”.
    reason: Preserva para consulta a forma passiva e a metáfora de escrita do ge'ez, vertidas no texto por português mais natural.
  revision_rationale: A revisão corrige a restrição indevida de «sua falecida» para «seus mortos», aproxima as duas ocorrências de fidelidade da construção passiva do original e esclarece que é a terra que o SENHOR prometera dar. Mantém-se a ausência de complementos não presentes no trecho ge'ez disponibilizado e conserva-se a âncora de nota existente.
