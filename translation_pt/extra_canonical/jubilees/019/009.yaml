base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/009.yaml
  text: In this, Abraham was found faithful, patient in spirit. And he did not speak a word concerning the promise of the land, which the LORD had said he would give to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and he was recorded as a friend of the LORD on the heavenly tablets.
translation:
  language: pt
  text: Nisso, Abraão foi achado fiel, paciente de espírito. E não disse palavra alguma a respeito da promessa de que o SENHOR lhe daria a terra, a ele e à sua descendência depois dele. Contudo, pediu ali um lugar para sepultar seus mortos, pois foi achado fiel e foi registrado como amigo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “foi escrito como amigo”.
    reason: Preserva para consulta a forma passiva e a metáfora de escrita do ge'ez, vertidas no texto por português mais natural.
lexical_decisions:
- source_word: ቦቱ
  choice: Nisso
  rationale: Retém a referência anafórica ao acontecimento ou à prova do contexto anterior, em vez de omiti-la.
- source_word: ዕጉሠ፡ መንፈስ
  choice: paciente de espírito
  rationale: Reproduz de modo natural a ideia de paciência ou constância interior expressa pelo composto.
- source_word: ንባብ፡ ዘበምድር
  choice: promessa da terra
  rationale: Embora ንባብ possa designar palavra, fala ou declaração, o contexto daquilo que o SENHOR disse que daria sustenta 'promessa', sem perder a ligação com a declaração divina.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: Equivalente coletivo corrente e digno para 'semente' no sentido genealógico.
- source_word: ቤድኖ
  choice: sua falecida
  rationale: O sufixo possessivo é preservado, e o feminino português explicita naturalmente Sara, cuja sepultura está em vista no contexto.
- source_word: ተጽሕፈ፡ ዐርከ
  choice: foi registrado como amigo
  rationale: Mantém Abraão como sujeito do passivo masculino singular e traduz a construção predicativa de modo idiomático.
theological_decisions:
- issue: Identidade daquele de quem Abraão foi registrado como amigo
  choice: Não explicitar 'do SENHOR' no texto principal
  alternative: foi registrado como amigo do SENHOR
  rationale: O trecho ge'ez fornecido termina em 'amigo' e não contém, nesse ponto, um complemento explícito; acrescentá-lo resolveria além da evidência apresentada.
- issue: Local do registro
  choice: Não acrescentar 'nas tábuas celestiais'
  alternative: foi registrado como amigo do SENHOR nas tábuas celestiais
  rationale: Essa formulação consta da camada inglesa, mas não aparece no texto ge'ez fornecido; a tradução prioriza a evidência da fonte original disponibilizada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. 'SENHOR' segue a convenção para o título divino. A repetição de 'mostrou-se fiel' foi mantida por corresponder à repetição enfática da fonte. O texto não incorpora a menção às tábuas celestiais presente na consulta inglesa, pois ela não consta do segmento ge'ez fornecido.
