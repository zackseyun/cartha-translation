  text: that is, Hebron—for four hundred pieces of silver. And they urged him, saying, “We will give it to you for nothing,” but he did not take it from their hands for nothing, because he gave the full price in silver for the place.
translation:
  language: pt
  text: 'isto é, Hebrom, por quatrocentas peças de prata. E eles insistiram com ele, dizendo: “Nós a daremos a você de graça”. Mas ele não a recebeu de graça das mãos deles, pois pagou pelo lugar o preço integral em prata.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኬብሮን
  choice: Hebrom
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo.
- source_word: በአርባዕቱ ምእት ብሩር
  choice: por quatrocentas peças de prata
  rationale: Expressa naturalmente o valor indicado; o substantivo numismático não está especificado no texto, por isso 'peças' evita identificar indevidamente uma moeda.
- source_word: ያስተበቍዕዎ
  choice: insistiram com ele
  rationale: Comunica a ideia de instância ou pressão verbal no contexto da oferta.
- source_word: በከ
  choice: de graça
  rationale: Preserva em linguagem corrente as duas ocorrências do termo, tanto na oferta quanto na recusa.
- source_word: ብሩረ ፍጹመ
  choice: o preço integral em prata
  rationale: Transmite a ideia de pagamento pleno efetuado em prata, sem sugerir apenas prata de pureza integral.
