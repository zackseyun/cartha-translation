  text: and Adam. And they shall be to establish heaven and to strengthen the earth and to renew all.
translation:
  language: pt
  text: E Adão. E eles serão para estabelecer o céu, fortalecer a terra e renovar tudo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para o estabelecimento do céu, para o fortalecimento da terra e para a renovação de tudo”.'
    reason: Registra a leitura das formas introduzidas por ለ como expressões nominais de finalidade, em vez de infinitivos.
lexical_decisions:
- source_word: ይኩኑ (yǝkūnū)
  choice: existirão
  rationale: Preserva o valor futuro do verbo ‘ser/existir’ e permite que os infinitivos seguintes expressem finalidade, sem acrescentar a ideia de serviço ou de eleição.
- source_word: ለሳርረ (lasārrara)
  choice: para estabelecer
  rationale: O radical comunica a ideia de fundar, firmar ou estabelecer; ‘estabelecer’ mantém essa força melhor do que ‘sustentar’.
- source_word: ለአጽንዖ (laʾaṣnǝʿo)
  choice: fortalecer
  rationale: Expressa tornar firme ou forte e forma um paralelo verbal natural com ‘estabelecer’ e ‘renovar’.
- source_word: ለኀድሶ (laḫaddǝso)
  choice: renovar
  rationale: Reproduz diretamente a ideia de fazer novo ou restaurar.
- source_word: ኵሉ (kwǝllu)
  choice: tudo
  rationale: Mantém o alcance abrangente e não especificado do original, sem inserir um substantivo ausente.
theological_decisions:
- issue: Alcance de ‘renovar tudo’
  choice: Manter ‘tudo’ sem explicitação
  alternative: ‘renovar todas as coisas’
  rationale: O texto não delimita o referente; a tradução conserva essa abertura em vez de impor uma leitura cosmológica ou escatológica específica.
- issue: Função dos sujeitos na sequência de infinitivos
  choice: ‘existirão para’
  alternative: ‘serão destinados a’ ou simplesmente ‘estabelecerão’
  rationale: A formulação escolhida preserva tanto o verbo ‘ser/existir’ quanto a relação de finalidade, evitando acrescentar predestinação ou transformar diretamente a construção em três futuros simples.
translation_notes:
  register: Português moderno, digno e legível. A abertura fragmentária ‘e Adão’ foi mantida porque o trecho fornecido começa no meio de uma sequência. O paralelismo dos três infinitivos foi preservado.
