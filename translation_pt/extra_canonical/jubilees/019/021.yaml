  yaml_path: translation/extra_canonical/jubilees/019/021.yaml
  text: For a blessing on the earth from now and throughout all the generations of the earth. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all of them.
translation:
  language: pt
  text: Para uma bênção sobre a terra, de agora em diante e por todas as gerações da terra. Sejam fortes as suas mãos, e alegre-se o seu coração em seu filho Jacó, pois eu o amei muito mais do que a todos eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበረከት፡ ዲበ፡ ምድር
  choice: Para bênção sobre a terra
  rationale: Mantém a construção final/relacional do ge'ez e a forma elíptica do início do versículo, sem acrescentar um verbo ausente no texto-fonte.
- source_word: እምይእዜ፡ ወእስከ፡ ኵሉ፡ ትውልደ፡ ምድር
  choice: de agora em diante e por todas as gerações da terra
  rationale: Reproduz a extensão temporal desde o presente até todas as gerações, conservando a repetição de “terra” presente no original.
- source_word: ይጽንዓ፡ እደዊኪ
  choice: Sejam fortes as suas mãos
  rationale: Expressa naturalmente o sentido jussivo de fortalecimento; o sufixo feminino singular é representado pelo tratamento contextual em terceira pessoa, comum e claro em português.
- source_word: ትትፈሣሕ፡ ልብኪ
  choice: alegre-se o seu coração
  rationale: Preserva a personificação do coração e o valor volitivo/jussivo da forma verbal.
- source_word: አፍቀርኩ፡ ፈድፋደ፡ እምኵሎሙ
  choice: eu o amei muito mais do que a todos eles
  rationale: Mantém a ênfase comparativa forte e o referente plural explícito no encerramento.
theological_decisions:
- issue: Natureza da bênção e sua duração
  choice: Manter “bênção sobre a terra” e “todas as gerações da terra” sem explicar seu alcance teológico.
  alternative: Interpretar como promessa universal a todas as nações ou como bênção exclusiva da descendência de Jacó.
  rationale: O texto afirma alcance terrestre e geracional, mas este versículo isolado não define de modo inequívoco os beneficiários nem a mecânica da bênção.
- issue: Preferência por Jacó
  choice: Traduzir diretamente a afirmação de amor comparativo.
  alternative: Atenuar para “preferi Jacó” ou explicar a escolha como eleição divina.
  rationale: O original emprega linguagem de amor intensamente comparativa; uma explicação doutrinária resolveria além do que o texto declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento em terceira pessoa (“suas”, “seu”) por legibilidade brasileira e alcance internacional. Conservou-se a abertura elíptica do ge'ez e a repetição de “terra”, evitando completar ou harmonizar o período por conjectura.
