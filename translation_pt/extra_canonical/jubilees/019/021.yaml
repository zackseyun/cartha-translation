  source_fidelity: A tradução preserva adequadamente a abertura elíptica, a extensão temporal, os jussivos dirigidos à destinatária, a alegria em Jacó e a comparação enfática do amor. A inclusão de «uma» em «Para uma bênção» apenas realiza uma exigência idiomática normal do português e não acrescenta conteúdo ao ge'ez.
  naturalness: «Para bênção sobre a terra» soa excessivamente telegráfico em português moderno. «Para uma bênção sobre a terra» mantém o fragmento deliberadamente elíptico e torna a expressão idiomática.
  terminology: «bênção», «terra», «Jacó» e «amei muito mais do que a todos eles» são escolhas fiéis e adequadas. «Alegre-se ... em seu filho Jacó» conserva a construção relacional do original sem reduzir a afirmação a uma interpretação teológica.
