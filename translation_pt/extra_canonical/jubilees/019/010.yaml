  yaml_path: translation/extra_canonical/jubilees/019/010.yaml
  text: And in the fourth year of it he took a wife for Isaac his son, and her name was Rebekah, daughter of Bethuel, the son of Nahor, Abraham’s brother, the sister of Laban, and the daughter of Bethuel; and Bethuel was the son of Milcah, the wife of Nahor, Abraham’s brother.
translation:
  language: pt
  text: E, no quarto ano desse período, ele tomou uma esposa para seu filho Isaque. O nome dela era Rebeca, filha de Betuel, filho de Naor, irmão de Abraão. Ela era irmã de Labão e filha de Betuel; e Betuel era filho de Milca, mulher de Naor, irmão de Abraão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓመት፡ ራብዕ፡ ሎቱ
  choice: no quarto ano desse período
  rationale: A expressão significa literalmente algo como «no quarto ano dele». A formulação portuguesa mantém a referência anafórica ao período mencionado no contexto, sem especificá-lo além do que o texto permite.
- source_word: ነሥአ፡ ለይስሐቅ፡ ወልዱ፡ ብእሲተ
  choice: ele tomou uma esposa para seu filho Isaque
  rationale: Preserva a construção em que o sujeito providencia ou toma uma mulher para Isaque, em vez de fazer de Isaque o sujeito da ação.
- source_word: ርብቃ
  choice: Rebeca
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome bíblico.
- source_word: ባቱኤል / ላባ / ሜልካ / ናኮር
  choice: Betuel / Labão / Milca / Naor
  rationale: Formas consagradas e inteligíveis dos nomes bíblicos em português.
theological_decisions:
- issue: Repetição dos dados genealógicos de Rebeca e Betuel
  choice: Manter «irmã de Labão e filha de Betuel; e Betuel era filho de Milca»
  alternative: Condensar como «irmã de Labão e neta de Milca»
  rationale: O texto ge'ez repete explicitamente que Rebeca era filha de Betuel e depois identifica Betuel como filho de Milca. A tradução conserva essa estrutura incomum, sem harmonizar ou comprimir a genealogia.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com nomes bíblicos usuais no Brasil e ampla inteligibilidade internacional. A pontuação divide a genealogia extensa em frases manejáveis, mas preserva todos os elementos e repetições do texto-fonte.
