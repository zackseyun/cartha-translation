lexical_decisions:
- source_word: ጸጕር
  choice: peludo
  rationale: Preserva o adjetivo que conclui a descrição iniciada no contexto anterior, mantendo também o caráter fragmentário do início do versículo fornecido.
- source_word: ምጽላላት
  choice: tendas
  rationale: Equivalente direto e natural para as habitações nômades mencionadas no texto.
- source_word: ወሬዛ
  choice: rapazes
  rationale: Expressa os jovens em paralelo, conforme o contexto de Jacó e Esaú e a leitura atestada pela camada de consulta.
- source_word: መጽሐፈ
  choice: a escrita
  rationale: No contexto de aprender, indica o domínio das letras ou da escrita; evita o sentido pouco natural de aprender um livro específico.
- source_word: ሐቃላዊ
  choice: homem do campo
  rationale: Mantém a caracterização ligada ao campo sem acrescentar uma interpretação sobre ocupação ou temperamento.
- source_word: ነዓዊ
  choice: caçador
  rationale: Equivalente contextual direto para a atividade atribuída a Esaú.
- source_word: ፀብአ
  choice: a arte da guerra
  rationale: Transmite o sentido de guerra ou prática guerreira como habilidade aprendida, em português corrente e digno.
