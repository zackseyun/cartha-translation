  text: and hairy. And Jacob dwelt in tents. And the youths grew, and Jacob learned writing, but Esau did not learn, because he was a man of the field and a hunter, and he learned warfare.
translation:
  language: pt
  text: e peludo. Jacó habitava em tendas. Os rapazes cresceram, e Jacó aprendeu a escrita; Esaú, porém, não aprendeu, porque era homem do campo e caçador, e aprendeu a arte da guerra.
