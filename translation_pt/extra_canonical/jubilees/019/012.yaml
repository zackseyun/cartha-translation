  text: 'for Hagar had died before Sarah. And she bore him six sons: Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah, in two weeks of years.'
translation:
  language: pt
  text: 'pois Agar tinha morrido antes de Sara. E ela lhe deu à luz seis filhos: Zinrã, Jocsã, Medã, Midiã, Isbaque e Suá, em duas semanas de anos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, em catorze anos.
    reason: A expressão antiga «duas semanas de anos» designa dois períodos de sete anos e pode não ser imediatamente clara para leitores modernos.
lexical_decisions:
- source_word: እምቅድመ፡ ሳራ
  choice: antes de Sara
  rationale: Reproduz diretamente a relação temporal do ge'ez, entendida como a morte de Agar anterior à de Sara.
- source_word: ወወለደት፡ ሎቱ
  choice: E ela lhe deu ... filhos
  rationale: Expressa em português natural o sentido de dar à luz filhos para ele, sem perder a referência feminina do verbo.
- source_word: ውሉደ፡ ስድስተ
  choice: seis filhos
  rationale: Tradução direta e idiomática.
- source_word: በክልኤ፡ ሱባዔ፡ ዓመት
  choice: ao longo de duas semanas de anos
  rationale: Mantém a expressão cronológica própria de Jubileus e explicita que se trata de dois períodos de sete anos.
