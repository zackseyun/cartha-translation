    reason: textual_variant
lexical_decisions:
- source_word: ይብክያ
  choice: chorar por ela
  rationale: Expressa diretamente o lamento de Abraão por Sara, em linguagem portuguesa natural e digna.
- source_word: ይቅበራ
  choice: sepultá-la
  rationale: Traduz o verbo referente ao sepultamento, elemento explícito no texto etíope.
- source_word: ወመከርኖ (leitura textual corrigida)
  choice: Nós o provamos
  rationale: A leitura contextual e textualmente sustentada introduz a prova da paciência de Abraão; mantém-se a primeira pessoa do plural sem identificar além do que o texto diz.
- source_word: ይትነገሥ፡ መንፈሱ
  choice: se seu espírito era paciente
  rationale: Conserva a formulação antropológica e o tema da paciência, sem substituir 'espírito' por uma interpretação psicológica mais estreita.
- source_word: expressão final truncada no testemunho fornecido
  choice: não se exaltou nas palavras de sua boca
  rationale: Reproduz o sentido atestado pela tradição textual e preserva o idioma semítico 'palavras de sua boca', em vez de reduzi-lo simplesmente a 'não falou com violência'.
theological_decisions:
- issue: Identidade do sujeito plural em “Nós o provamos”
  choice: Manter “Nós” sem explicação no corpo do versículo
  alternative: Identificar explicitamente Deus ou os anjos como agentes da prova
  rationale: O versículo emprega a primeira pessoa do plural; explicitar uma identidade resolveria uma ambiguidade narrativa que o texto não resolve aqui.
- issue: Natureza da reação de Abraão
  choice: “não se exaltou nas palavras de sua boca”
  alternative: “não falou com violência” ou “não se impacientou”
  rationale: A escolha mantém tanto a reação interior sugerida pelo verbo quanto sua manifestação verbal, sem impor uma caracterização teológica mais específica.
translation_notes:
  register: Português moderno, amplamente compreensível e com leitura natural no Brasil. A construção conserva o tom narrativo solene e o idioma semítico “palavras de sua boca”, sem soar excessivamente arcaica.
