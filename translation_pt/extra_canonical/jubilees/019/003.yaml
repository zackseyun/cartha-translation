  text: And Abraham went to weep for her and to bury her, and we tested him to see if his spirit was patient, and he did not become violent in the speech of his mouth.
translation:
  language: pt
  text: Abraão foi chorar por ela e sepultá-la. Nós o provamos[a] para ver se seu espírito era paciente, e ele não se tornou violento ao falar.
  philosophy: optimal-equivalence
  footnotes:
