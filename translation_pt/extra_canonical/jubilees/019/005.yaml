  yaml_path: translation/extra_canonical/jubilees/019/005.yaml
  text: He spoke with the sons of Heth so that they might give him a place in which to bury his dead. And the LORD gave him favor before all who saw him[5], and he entreated courteously of the sons of Heth, and they gave him the land of the double cave, which is opposite Mamre—
translation:
  language: pt
  text: Ele falou com os filhos de Hete para que lhe dessem um lugar onde pudesse sepultar seu morto. E o SENHOR lhe concedeu favor diante de todos os que o viam. Ele suplicou com cortesia aos filhos de Hete, e eles lhe deram a terra da caverna dupla, que fica diante de Manre—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ኬጥ
  choice: filhos de Hete
  rationale: Expressão gentílica tradicional e transparente, correspondente aos descendentes de Hete.
- source_word: ቤድኖ
  choice: sua morta
  rationale: O substantivo significa cadáver ou pessoa morta; o contexto é o sepultamento de Sara, por isso o feminino natural em português preserva a referência.
- source_word: ሞገሰ
  choice: favor
  rationale: Reproduz o sentido de graça, aceitação ou boa disposição concedida diante dos observadores.
- source_word: በየውሀት
  choice: com mansidão
  rationale: Mantém a ideia de brandura, humildade ou cortesia sem reduzi-la apenas a boas maneiras.
- source_word: ምድረ፡ ባዓት፡ ዘካዕበት
  choice: a terra da caverna dupla
  rationale: Segue de perto a construção ge'ez e conserva a designação da caverna como dupla, sem substituir o termo pelo nome tradicional Macpela.
- source_word: ዘአንጻረ፡ መምብሬም
  choice: que fica diante de Manre
  rationale: A preposição indica posição em frente a ou defronte de; 'diante de' preserva essa relação espacial.
theological_decisions:
- issue: Ação divina na recepção favorável de Abraão
  choice: o SENHOR lhe concedeu favor
  alternative: o SENHOR fez com que todos o tratassem bem
  rationale: A formulação preserva a atribuição direta do favor a Deus sem explicar além do que o texto afirma.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe fluente. O travessão final preserva a continuidade sintática do texto-fonte, que termina com um pronome relativo e prossegue no versículo seguinte. O marcador [5] e a nota cosmológica da camada inglesa foram omitidos por serem estranhos a este versículo e não terem apoio no ge'ez fornecido.
