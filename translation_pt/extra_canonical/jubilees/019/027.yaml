  yaml_path: translation/extra_canonical/jubilees/019/027.yaml
  text: and he kissed him and blessed him and said, “Jacob, my beloved son, whom my soul loves, may God from above the firmament bless you and give you all the blessings with which he blessed Adam and Enoch and Noah and Shem; and whatever he has spoken to me and whatever he said he would give me, may it rest upon you and upon your seed forever, according to the days of heaven above the earth. And may the spirits of Mastema not come upon you or upon your seed, to turn you away from following the LORD, who is your God from now and forever. And may the Lord God be a father to you, and you be his firstborn son, and to the people always. Go, my son, in peace.” And the two of them went out together from Abraham. And Rebekah loved Jacob with all her heart and with all her soul, much more than Esau, but Isaac loved Esau much more than Jacob.
translation:
  language: pt
  text: 'E ele o beijou, o abençoou e disse: “Jacó, meu filho amado, a quem a minha alma ama, que Deus, que está acima do firmamento,[b] abençoe você e lhe dê todas as bênçãos com que abençoou Adão, Enoque, Noé e Sem;[a] e tudo o que ele me prometeu e tudo o que disse que me daria repouse sobre você e sobre a sua descendência para sempre, enquanto os céus permanecerem sobre a terra. Que os espíritos de Mastema não venham sobre você nem sobre a sua descendência, para afastá-los de seguir o SENHOR,[d] que é o seu Deus, desde agora e para sempre. Que o Senhor Deus[c] seja um pai para você, e que você seja seu filho primogênito e o seja para o povo por todos os dias. Vá em paz, meu filho.” Então os dois saíram juntos da presença de Abraão. Rebeca amava Jacó de todo o coração e de toda a alma, muito mais do que amava Esaú; mas Isaque amava Esaú muito mais do que amava Jacó.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Adão, Enoque e Noé; e tudo o que”.'
    reason: Registra a alternativa textual ou de segmentação que não inclui Sem na série.
  - marker: b
    text: 'Ou: “Deus Altíssimo”.'
    reason: Oferece a equivalência idiomática possível para a expressão cosmológica literal.
  - marker: c
    text: 'Ou: “o SENHOR seja um pai”.'
    reason: Registra a forma alternativa tradicional, embora o texto ge’ez contenha “Senhor Deus”.
  - marker: d
    text: 'Ou: “afastá-los do SENHOR”.'
    reason: Apresenta a formulação mais concisa, que não explicita a imagem de seguir o Senhor.
lexical_decisions:
- source_word: አምላክ፡ እመልዕልተ፡ ምጽናዓት
  choice: Deus, que está acima do firmamento
  rationale: Preserva a imagem cosmológica específica do ge’ez, em vez de reduzi-la ao título interpretativo “Deus Altíssimo”.
- source_word: ዘርእከ
  choice: sua descendência
  rationale: Expressa naturalmente em português o sentido coletivo de “semente” neste contexto de bênção pactual.
- source_word: ያጥጋእ፡ ላዕሌከ
  choice: repouse sobre você
  rationale: Mantém a metáfora espacial da bênção prometida vindo a permanecer sobre Jacó.
- source_word: መናፍስተ፡ መስቴማ
  choice: espíritos de Mastema
  rationale: Mantém o nome próprio e a construção plural do texto-fonte sem identificar interpretativamente esses espíritos.
- source_word: እምድኅረ፡ እግዚአብሔር
  choice: afastá-los de seguir o SENHOR
  rationale: Conserva a imagem de estar atrás do Senhor, isto é, segui-lo, explicitando-a em português corrente.
- source_word: እግዚአብሔር፡ አምላከ፡ አበ
  choice: o Senhor Deus seja um pai
  rationale: Representa os dois termos divinos presentes no ge’ez e mantém a metáfora paterna.
theological_decisions:
- issue: Título divino acima do firmamento
  choice: Deus, que está acima do firmamento
  alternative: Deus Altíssimo
  rationale: A formulação principal segue mais de perto o dado cosmológico do texto; a equivalência titular é registrada em nota.
- issue: Ação dos espíritos de Mastema
  choice: afastá-los de seguir o SENHOR
  alternative: afastá-los do SENHOR
  rationale: A escolha preserva a nuance de discipulado ou caminhada presente na expressão espacial do original.
- issue: Paternidade divina
  choice: o Senhor Deus seja um pai
  alternative: o SENHOR seja um pai
  rationale: O texto principal não omite “Deus”, embora a leitura abreviada tradicional seja indicada em nota.
- issue: Relação de Jacó com o povo
  choice: e o seja para o povo por todos os dias
  alternative: e [seja primogênito] do povo para sempre
  rationale: A sintaxe da cláusula é compacta e difícil; a tradução conserva sua tensão sem acrescentar um papel teológico não explicitado no texto.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Emprega “você” para tratamento direto natural, “descendência” para o coletivo e “SENHOR” para o nome/título divino convencional, preservando formulações cosmológicas e tensões sintáticas do texto.
