  text: And in the sixth week, in its second year, Rebekah bore to Isaac two sons, Jacob and Esau. And Jacob was smooth and upright, but Esau was a fierce man, and a man of the field,
translation:
  language: pt
  text: 'E, na sexta semana, em seu segundo ano, Rebeca deu à luz dois filhos a Isaque: Jacó e Esaú. Jacó era de pele lisa e íntegro, mas Esaú era um homem feroz e um homem do campo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልሙጽ
  choice: liso
  rationale: Reproduz o sentido físico de algo liso, em contraste com a descrição de Esaú, sem acrescentar a ideia de ausência de pelos além do que o termo expressa.
- source_word: ሬትዕ
  choice: íntegro
  rationale: Expressa retidão de caráter em português natural e preserva a caracterização moral de Jacó.
- source_word: ድሩክ
  choice: feroz
  rationale: O termo indica alguém feroz, áspero ou rude; evita a harmonização indevida com a descrição de Esaú como peludo em Gênesis.
- source_word: ሐቃላዊ
  choice: homem do campo
  rationale: Mantém a expressão tradicional e concreta para alguém ligado à vida no campo.
