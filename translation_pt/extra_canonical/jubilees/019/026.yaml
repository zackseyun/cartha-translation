lexical_decisions:
- source_word: ብርሃናት
  choice: as luzes
  rationale: Mantém o plural concreto do ge'ez e a referência aos luminares celestes, sem especificar além do texto.
- source_word: ምጽናዓት
  choice: firmamento
  rationale: Reproduz o termo cosmológico tradicional e preserva a ligação com a linguagem bíblica da abóbada celeste.
- source_word: ጸውዖ
  choice: chamou
  rationale: Equivalente direto e natural para o ato de chamar Jacó à presença.
- source_word: በቅድመ፡ አዕይንቲሃ
  choice: diante de
  rationale: A expressão é literalmente ligada aos 'olhos' de Rebeca, mas funciona idiomaticamente como 'na presença de'; 'diante de' preserva parte da imagem sem soar artificial.
