  text: 'And he bowed down to them again, and after this he buried his dead in the double cave. And all the days of Sarah’s life were one hundred and twenty-seven years: two jubilees and four weeks of years.'
translation:
  language: pt
  text: 'E curvou-se novamente diante deles e, depois disso, sepultou sua falecida na caverna dupla. Ao todo, Sara viveu cento e vinte e sete anos: dois jubileus e quatro semanas de anos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካዕበ
  choice: tornou a
  rationale: Expressa o sentido de repetição, “de novo/uma segunda vez”, sem tornar a frase pesada.
- source_word: ቤድኖ
  choice: a sua morta
  rationale: Preserva a referência concreta ao cadáver feminino de Sara, em vez de substituir por uma formulação interpretativa como “Sara”.
- source_word: ውስተ፡ ባዓት፡ ዘካዕበት
  choice: na caverna dupla
  rationale: Reproduz de modo direto a designação da caverna como dupla, sem harmonização explicativa.
- source_word: ክልኤ፡ ኢዮቤልዉ፡ ወአርባዕቱ፡ ሱባዔ
  choice: dois jubileus e quatro semanas de anos
  rationale: Mantém o sistema cronológico próprio de Jubileus; “semanas de anos” esclarece que se trata de períodos de sete anos.
