  source_fidelity: 'O texto preserva os elementos centrais do ge''ez: a reverência repetida (ካዕበ, “novamente”), o sepultamento, a designação “caverna dupla” e a dupla contagem cronológica. A formulação final mantém corretamente a tensão aritmética do texto-fonte, sem a harmonizar.'
  naturalness: “Tornou a inclinar-se” é compreensível, mas “curvou-se novamente” é mais direto e idiomático no português atual para o gesto de prostração/reverência. “A sua morta” é uma reprodução muito literal, porém soa marcadamente arcaica e pouco natural; “sua falecida” preserva a referência à mulher morta sem introduzir uma identificação adicional.
  terminology: “Jubileus” e “semanas de anos” são termos adequados e preservam o sistema cronológico característico de Jubileus. “Caverna dupla” mantém a designação do texto, sem a substituir pelo nome tradicional do local.
