  - severity: medium
    issue: “A sua morta” é excessivamente arcaico no registro-alvo
    rationale: Embora literal, a expressão não é de uso moderno amplo. “Sua falecida” conserva a referência feminina e o sentido de “sua morta”, com melhor legibilidade.
