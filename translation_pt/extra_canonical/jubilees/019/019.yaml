  text: que se destacará entre todas as nações que estão sobre a face da terra. E agora, Isaque, meu filho
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቀውም (yiqawwem)
  choice: se destacará
  rationale: O verbo tem o sentido básico de pôr-se de pé, permanecer ou levantar-se; neste contexto comparativo, «se destacará» expressa com naturalidade que ele sobressairá dentre as nações, sem explicitar a causa.
- source_word: አሕዛብ (ʾaḥzāb)
  choice: nações
  rationale: Equivalente corrente para povos ou nações, adequado à referência abrangente aos grupos humanos da terra.
- source_word: ዲበ ገጸ ምድር (diba gaṣa medr)
  choice: sobre a face da terra
  rationale: Preserva a expressão espacial tradicional do geʽez de modo claro e digno em português.
- source_word: ወናሁ (wa-nāhu)
  choice: E agora
  rationale: Neste encadeamento discursivo, segue a leitura contextual refletida na camada inglesa auditada; «E eis» seria uma tradução mais estritamente lexical.
theological_decisions:
- issue: Sentido de ይቀውም em relação às nações
  choice: se destacará
  alternative: se levantará / permanecerá de pé
  rationale: A escolha mantém a ideia de proeminência no contexto, sem definir se ela é política, espiritual ou de outra natureza.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. O trecho foi mantido como fragmento, sem acrescentar pontuação final que pudesse encerrar uma frase continuada no versículo seguinte.
