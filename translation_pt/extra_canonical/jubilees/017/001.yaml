base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/001.yaml
  text: And the Lord knew that Abraham was faithful in all his trials; for he had tested him in his country, and with famine, and had tested him through the wealth of kings, and again had tested him through his wife when she was taken away, and through circumcision, and had tested him through Ishmael and Hagar his maidservant when he sent them away. And in everything by which he had tested him, he was found faithful, and his soul was not impatient, and he did not delay in acting; for he was faithful and a lover of the Lord.
translation:
  language: pt
  text: E o Senhor sabia que Abraão era fiel em todas as suas provações, pois o havia posto à prova em sua terra e pela fome; também o havia posto à prova por meio das riquezas dos reis; e novamente o havia posto à prova por meio de sua mulher, quando ela foi levada, e por meio da circuncisão. Também o havia posto à prova por meio de Ismael e de Agar, sua serva, quando os mandou embora. Em tudo aquilo com que o havia posto à prova, Abraão foi achado fiel. Sua alma não se impacientou, e ele não demorou a agir, pois era fiel e amava o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምንዳቤሁ
  choice: suas provações
  rationale: O contexto é o de sucessivos testes de fidelidade; “provações” mantém tanto a adversidade quanto a função probatória do termo.
- source_word: አመከሮ
  choice: o havia posto à prova
  rationale: A repetição verbal estrutura o versículo e deve ser preservada; esta expressão é natural em português e explicita a ideia de testar sem sugerir indução ao mal.
- source_word: በምድሩ
  choice: em sua terra
  rationale: Mantém o sentido geográfico amplo do texto etíope sem restringi-lo desnecessariamente a uma entidade política moderna.
- source_word: በብዕለ፡ ነገሥት
  choice: por meio das riquezas dos reis
  rationale: Reproduz a referência concreta à riqueza ou aos bens dos reis e conserva a relação instrumental indicada no contexto.
- source_word: አመቱ
  choice: sua serva
  rationale: “Serva” é claro, digno e historicamente adequado; evita o tom excessivamente moderno de “empregada”.
- source_word: ኢተአገተት፡ ነፍሱ
  choice: Sua alma não se impacientou
  rationale: Conserva a expressão antropológica do original e a noção de não perder a paciência sob prova.
- source_word: መፍቀሬ፡ እግዚአብሔር
  choice: amava o Senhor
  rationale: Expressa em português corrente a ideia atributiva de ser alguém que ama o Senhor, evitando o pouco natural “amante do Senhor”.
theological_decisions:
- issue: Conhecimento divino e fidelidade comprovada
  choice: “o Senhor sabia que Abraão era fiel”
  alternative: “o Senhor reconheceu que Abraão era fiel”
  rationale: O verbo é vertido diretamente como “sabia”, sem reformular a relação entre o conhecimento do Senhor e as provas subsequentes.
- issue: Agente das provações
  choice: “o havia posto à prova”
  alternative: “Abraão havia sido provado”
  rationale: Mantém o Senhor como agente explícito, como no texto, sem atenuar a tensão teológica.
- issue: Caracterização final de Abraão
  choice: “era fiel e amava o Senhor”
  alternative: “era fiel e amante do Senhor”
  rationale: Preserva as duas afirmações coordenadas, mas usa formulação idiomática e não denominacional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A repetição de “posto à prova” foi mantida por sua função retórica. Os períodos foram moderadamente segmentados para clareza sem alterar a progressão do original.
