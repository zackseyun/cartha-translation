  text: her child. And she arose and went toward the wilderness of Paran. And the child grew, and he became an archer, and the Lord was with him, and his mother took for him a wife from the daughters of Egypt.
translation:
  language: pt
  text: seu filho. Então ela se levantou e foi em direção ao deserto de Parã. O menino cresceu e se tornou arqueiro; o Senhor estava com ele, e sua mãe tomou para ele uma esposa dentre as filhas do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕፃና
  choice: seu filho
  rationale: Forma com sufixo possessivo, provavelmente objeto do verbo no fim do versículo anterior; não contém o sentido verbal de “cresceu”.
- source_word: መንገለ
  choice: em direção a
  rationale: Expressa movimento rumo a um lugar, preservando a orientação sem afirmar necessariamente a chegada.
- source_word: በድው፡ ፍራም
  choice: deserto de Parã
  rationale: Designação geográfica tradicional e natural em português.
- source_word: አሀቀ፡ ሕፃን
  choice: O menino cresceu
  rationale: Traduz a oração que afirma o desenvolvimento da criança, evitando duplicá-la no início do versículo.
- source_word: ነዳፌ
  choice: arqueiro
  rationale: Nome de agente que designa quem usa o arco; “arqueiro” é preciso e corrente.
- source_word: ነሥአት፡ ሎቱ
  choice: lhe tomou por esposa
  rationale: Reproduz a construção segundo a qual a mãe providenciou ou escolheu uma esposa para ele.
- source_word: እምአዋልደ፡ ግብጽ
  choice: uma das filhas do Egito
  rationale: Mantém o idiomatismo coletivo de origem; em português, “uma das” explicita naturalmente a seleção de uma mulher do grupo.
theological_decisions:
- issue: Presença divina junto ao menino
  choice: o Senhor estava com ele
  alternative: Deus estava com ele
  rationale: እግዚአብሔር corresponde ao título divino “Senhor”; a tradução mantém a afirmação simples, sem explicar a natureza dessa presença.
translation_notes:
  register: Português moderno, digno e acessível. A abertura em minúscula preserva o caráter fragmentário de “seu filho”, que sintaticamente parece concluir o versículo anterior. A pontuação organiza as orações coordenadas sem eliminar o ritmo narrativo semítico.
