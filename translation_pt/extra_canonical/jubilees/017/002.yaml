lexical_decisions:
- source_word: ዘርአ (zar’a)
  choice: descendência
  rationale: O termo significa literalmente “semente”, mas, neste contexto, refere-se naturalmente à posteridade de Abraão; “descendência” comunica esse sentido em português atual.
- source_word: ይረሳ (yǝrassa)
  choice: herdasse
  rationale: Preserva a ideia de receber a terra como herança, sem substituí-la por noções mais gerais como possuir ou ocupar.
- source_word: በኵሉ አፉሁ (bakʷǝllu ’afuhu)
  choice: de toda a boca
  rationale: Mantém a expressão enfática e incomum do ge’ez, em vez de normalizá-la silenciosamente como “de todo o coração” ou “com todas as suas forças”.
- source_word: ለፈጣሪ (lafäṭari)
  choice: o Criador
  rationale: Reproduz o título divino presente no texto, sem acrescentar um complemento como “de todas as coisas”.
theological_decisions:
- issue: Agente da palavra lembrada
  choice: “a palavra que lhe fora dita”
  alternative: “a palavra que ele havia dito”
  rationale: A forma verbal do texto pode ser formalmente lida em relação ao antecedente, mas o contexto sugere uma palavra dirigida a Abraão. A formulação passiva evita identificar além do necessário o falante e preserva a tensão da expressão.
- issue: Sujeito que herdará a terra
  choice: “para que ela [a descendência] herdasse a terra”
  alternative: “para que ele [Abraão] herdasse a terra”
  rationale: A descendência é o antecedente imediato e concorda com o tema da promessa; o pronome explícito em português esclarece essa relação sem ampliar a promessa.
translation_notes:
  register: Português moderno, digno e de leitura ampla. Conserva-se a repetição de “terra” e a imagem semítica “de toda a boca”, pois ambas pertencem ao perfil retórico do texto-fonte. A pontuação foi ajustada para fluência sem apagar a sequência narrativa.
