  text: And He opened her eyes and saw a well of water, and she went and filled the skin with water and gave him drink.
translation:
  language: pt
  text: E ele abriu os olhos dela[a], e ela viu um poço de água. Então foi, encheu o odre de água e lhe deu de beber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo ge''ez está no masculino singular; o sujeito é entendido, no contexto, como Deus. Uma tradução anterior o verteu como: «ela abriu os olhos».'
    reason: Esclarece o pronome masculino e registra a tradução anterior sem sugerir uma variante textual.
lexical_decisions:
- source_word: ወከሠተ፡ አዕይንቲሃ፡
  choice: E ele abriu os olhos dela
  rationale: O verbo está na terceira pessoa masculina singular, enquanto o sufixo de አዕይንቲሃ indica que os olhos são dela; a mudança para verbos femininos em seguida confirma a distinção dos sujeitos.
- source_word: ዐዘቅተ፡ ማይ፡
  choice: um poço de água
  rationale: Expressa naturalmente em português a fonte ou poço de água designado pela construção ge'ez.
- source_word: ዝቃ፡
  choice: odre
  rationale: Refere-se a um recipiente de pele para transportar água; 'odre' é preciso e reconhecível no registro bíblico.
- source_word: ወአስተየቶ፡
  choice: e deu de beber ao menino
  rationale: O verbo causativo significa dar de beber; o objeto pronominal masculino remete ao menino no contexto, explicitado para clareza natural em português.
theological_decisions:
- issue: Identidade do sujeito que abre os olhos
  choice: ele
  alternative: ela
  rationale: A forma verbal masculina singular sustenta 'ele'; não se explicita 'Deus' porque o nome não aparece neste versículo, preservando a coesão com o contexto sem acrescentá-lo ao texto.
translation_notes:
  register: Português atual, claro e digno, com leve tonalidade bíblica. Mantém 'odre' por precisão histórica e usa 'ao menino' para tornar explícito o referente masculino implícito no verbo.
