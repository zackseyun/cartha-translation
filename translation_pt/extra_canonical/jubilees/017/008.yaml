lexical_decisions:
- source_word: ውስተ፡ ዐቢይ፡ ሕዝብ፡ እሬስዮ
  choice: Eu farei dele uma grande nação
  rationale: O imperfeito እሬስዮ expressa ação futura, e ውስተ com o verbo ረሰየ indica fazer alguém tornar-se algo; ዐቢይ modifica ሕዝብ. “Nação” é natural no contexto da promessa de numerosa descendência.
- source_word: እምዘርእከ፡ ውእቱ
  choice: ele vem da sua descendência
  rationale: Expressa naturalmente em português a relação de origem indicada por “ele é da sua semente”, sem perder o sentido genealógico de ዘርእ.
- source_word: ወነገሀ፡ አብርሃም፡ በነግህ
  choice: E Abraão levantou-se de madrugada
  rationale: Reproduz a construção enfática ligada à manhã com uma expressão portuguesa corrente e digna.
theological_decisions:
- issue: Forma da promessa sobre Ismael
  choice: Eu farei dele uma grande nação
  alternative: Entre um grande povo, eu o fiz grande
  rationale: A forma futura e a construção resultativa são gramaticalmente preferíveis e correspondem ao contexto da promessa; a leitura alternativa é preservada em nota por constar da tradição de tradução e refletir uma análise possível da construção.
- issue: Sentido de “semente”
  choice: descendência
  alternative: semente
  rationale: “Descendência” comunica claramente o sentido genealógico no português atual, sem introduzir uma interpretação teológica adicional.
