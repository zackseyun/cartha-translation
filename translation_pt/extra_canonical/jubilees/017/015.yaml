  yaml_path: translation/extra_canonical/jubilees/017/015.yaml
  text: When I called him. And it came to pass in the seventh week, in the first year, in the first month, in this jubilee, on the twelfth of this month, words came in heaven concerning Abraham, that he was faithful in all that he spoke, and he loved the Lord, and in every trial he was faithful.
translation:
  language: pt
  text: 'Quando eu o chamei.[a] E aconteceu que, na sétima semana, no primeiro ano, no primeiro mês deste jubileu, no décimo segundo dia deste mês, houve, no céu, palavras a respeito de Abraão: que ele era fiel em tudo o que dizia, amava o Senhor e, em toda provação, era fiel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas traduções anteriores trazem: «E quando ele o tinha chamado». A forma etíope, porém, está na primeira pessoa: «eu o chamei».'
    reason: Registra a variante histórica de tradução e explica por que o texto principal segue a morfologia da fonte.
lexical_decisions:
- source_word: ጸዋዕክዎ
  choice: eu o chamei
  rationale: A forma verbal é primeira pessoa do singular, com sufixo de objeto masculino singular; por isso, preserva-se o sentido «eu o chamei», em vez da antiga leitura na terceira pessoa.
- source_word: ወኮነ
  choice: E aconteceu que
  rationale: Fórmula narrativa natural em português, mantendo a nova oração indicada pelo texto e pela pontuação da edição.
- source_word: ኮነ፡ ቃላት፡ በሰማያት
  choice: foram pronunciadas palavras no céu
  rationale: Expressa de modo corrente a ocorrência de palavras no âmbito celestial, sem especificar um falante que a fonte não identifica.
- source_word: መሃይምን / ምእመነ
  choice: fiel / permanecia fiel
  rationale: Mantém a repetição temática da fidelidade de Abraão, com leve variação verbal para produzir português natural.
- source_word: ምንዳቤ
  choice: provação
  rationale: No contexto, designa uma situação que põe a fidelidade à prova; «provação» preserva esse sentido sem definir a natureza específica do sofrimento.
- source_word: እግዚአብሔር
  choice: o Senhor
  rationale: Equivalente tradicional e amplamente compreensível do título divino, de acordo com o contexto da frase.
theological_decisions:
- issue: Origem e estatuto das palavras celestiais
  choice: «foram pronunciadas palavras no céu»
  alternative: «houve palavras no céu»
  rationale: A formulação escolhida comunica que se trata de uma declaração celestial, mas não identifica Deus, anjos ou outro agente como falante, pois a fonte não o explicita.
- issue: Fidelidade de Abraão durante as provas
  choice: «permanecia fiel em toda provação»
  alternative: «foi fiel em toda provação»
  rationale: «Permanecia» torna claro o caráter reiterado ou constante da fidelidade, sem acrescentar uma doutrina específica sobre impecabilidade.
translation_notes:
  register: Português moderno, digno e amplamente acessível, com legibilidade brasileira. A sequência cronológica foi mantida integralmente; a frase inicial, embora fragmentária em relação ao contexto, foi preservada como oração independente conforme a edição e a forma verbal da fonte.
