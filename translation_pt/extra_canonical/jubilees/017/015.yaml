  naturalness: O português é claro e de registro apropriado. «Houve, no céu, palavras a respeito de Abraão» é mais natural do que um calque como «vieram palavras no céu» e evita acrescentar um falante ou modo de fala.
  terminology: «Senhor», «fiel» e «provação» são escolhas adequadas. A repetição de «era fiel» conserva a ênfase lexical da fonte sem a nuance adicional de continuidade em «permanecia fiel».
