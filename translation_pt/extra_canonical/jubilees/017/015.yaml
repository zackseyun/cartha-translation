  to: 'Quando eu o chamei.[a] E aconteceu que, na sétima semana, no primeiro ano, no primeiro mês deste jubileu, no décimo segundo dia deste mês, houve, no céu, palavras a respeito de Abraão: que ele era fiel em tudo o que dizia, amava o Senhor e, em toda provação, era fiel.'
