  text: that he should send them away from him. And the Lord said to Abraham, “Do not let it be grievous in your sight because of the boy and because of the slave woman. Whatever Sarah says to you, listen to her voice and do it.”
translation:
  language: pt
  text: 'para que ele os mandasse embora de sua presença.[a] E o Senhor disse a Abraão: “Não se aflija por causa do menino e da escrava. Tudo o que Sara lhe disser, escute o que ela lhe disser e faça isso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Esta frase completa a oração iniciada no versículo anterior. Ou, conforme se entenda a forma verbal: “Ele os mandou embora de junto de si.”'
    reason: A divisão de versículos separa uma oração sintaticamente dependente. A nota também preserva a alternativa indicativa registrada no rastro de auditoria inglês.
lexical_decisions:
- source_word: ይሰድዶሙ፡ እምኀቤሁ
  choice: para que ele os mandasse embora de junto de si
  rationale: A forma verbal tem valor subjuntivo/imperfeito e completa a ideia do versículo anterior; não descreve ainda uma ação concluída.
- source_word: ሐዘን
  choice: aflito
  rationale: Expressa de modo natural a tristeza ou o pesar que não deveria dominar Abraão.
- source_word: ሕፃን
  choice: menino
  rationale: No contexto, designa Ismael como criança ou rapaz, sem exigir uma idade mais precisa.
- source_word: ወለት
  choice: escrava
  rationale: Embora o termo possa ter uma faixa semântica mais ampla ligada a jovem ou serva, o contexto identifica Hagar em sua condição servil.
- source_word: ስማዕ፡ ቃለ
  choice: escute-a
  rationale: A expressão literal 'ouve a voz dela' significa atender ao que Sara diz; a forma escolhida é natural e preserva a ordem de ouvi-la.
theological_decisions:
- issue: Abertura sintaticamente dependente do versículo anterior
  choice: 'Manter a oração final/subordinada: ''para que ele os mandasse embora'''
  alternative: '''Ele os mandou embora'''
  rationale: O valor verbal e a sequência narrativa indicam que a frase conclui o pensamento anterior; convertê-la em passado indicativo anteciparia a ação de Abraão.
- issue: Identidade social de Hagar
  choice: '''a escrava'''
  alternative: '''a serva'' ou ''a mulher escrava'''
  rationale: A escolha comunica com clareza sua condição no relato sem amenizar a relação de escravidão nem acrescentar interpretação teológica.
translation_notes:
  register: Português atual, claro e digno, com formas de tratamento implícitas e verbos no imperativo de terceira pessoa. A construção inicial foi mantida como continuação do versículo anterior, conforme a sintaxe do ge'ez.
