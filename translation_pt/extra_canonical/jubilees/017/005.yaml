  yaml_path: translation/extra_canonical/jubilees/017/005.yaml
  text: …and her son, for the son of this slave woman will not be an heir with my son Isaac.” And the matter was very grievous in the sight of Abraham because of his maidservant and because of his son.
translation:
  language: pt
  text: …e o filho dela, pois o filho desta escrava não herdará com meu filho Isaque”. E isso foi muito penoso aos olhos de Abraão, por causa de sua serva e de seu filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወልዳ (wa-walda)
  choice: …e o filho dela
  rationale: Conserva o início coordenado do texto ge’ez, que retoma e completa a ordem iniciada no versículo anterior; as reticências tornam essa continuidade clara ao leitor.
- source_word: ኢይወርስ (ʾi-yəwərrəs)
  choice: não herdará
  rationale: Traduz diretamente o verbo de herdar, sem reformulá-lo como simples condição de herdeiro.
- source_word: ወሰት (wasat)
  choice: escrava
  rationale: Mantém a condição servil expressa na fala de Sara, em linguagem portuguesa atual e clara.
- source_word: ማኅዘነ (maḥzana)
  choice: muito penosas
  rationale: Comunica a forte aflição ou gravidade que as palavras causaram a Abraão, preservando o valor intensificado do contexto.
- source_word: አመቱ (ʾamatu)
  choice: sua serva
  rationale: Distingue a designação narrativa da expressão mais dura usada anteriormente na fala de Sara, sem ocultar a relação de dependência.
theological_decisions:
- issue: A exclusão do filho da escrava da herança com Isaque
  choice: não herdará com meu filho Isaque
  alternative: não será herdeiro junto com meu filho Isaque
  rationale: A formulação escolhida acompanha o verbo ge’ez e preserva a declaração de exclusão sucessória sem acrescentar uma explicação teológica.
- issue: Objeto da aflição de Abraão
  choice: por causa de sua serva e de seu filho
  alternative: por causa de seu filho
  rationale: Mantém os dois referentes expressos no texto ge’ez, sem reduzir a tensão narrativa apenas ao vínculo paterno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura fragmentária foi preservada porque o versículo continua a frase anterior. A expressão idiomática ge’ez equivalente a ‘diante dos olhos de Abraão’ foi vertida naturalmente como ‘aos olhos de Abraão’.
