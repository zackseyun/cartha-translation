  text: Pois, em Isaque, um nome e uma descendência serão chamados para você. E, quanto ao filho desta escrava,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Expressa a relação explicativa ou causal do conectivo geʽez no contexto.
- source_word: በይስሐቅ
  choice: em Isaque
  rationale: Mantém de modo direto a preposição e o nome próprio do texto-fonte, sem explicitar uma interpretação além dele.
- source_word: ይጼዋዕ
  choice: serão chamados
  rationale: Preserva o campo semântico de chamar/designar. O plural em português acomoda os dois substantivos coordenados, embora a forma verbal geʽez seja singular.
- source_word: ስም፡ ወዘርእ
  choice: um nome e uma descendência
  rationale: Traduz ambos os elementos; 'descendência' comunica naturalmente o sentido coletivo de 'semente' neste contexto genealógico.
- source_word: ወበእንተ
  choice: E quanto a
  rationale: Reproduz a introdução de um novo tópico e conserva a sintaxe que continua além do trecho.
- source_word: ወልደስ፡ ለዛ፡ ወለት
  choice: o filho desta escrava
  rationale: Entende ወለት no sentido social de serva/escrava, conforme o contexto de Hagar, e mantém a referência demonstrativa.
theological_decisions:
- issue: Relação de Isaque com o nome e a descendência de Abraão
  choice: em Isaque serão chamados para você um nome e uma descendência
  alternative: por meio de Isaque sua descendência será chamada
  rationale: A redação escolhida conserva os dois substantivos presentes no geʽez, 'nome' e 'descendência', bem como a formulação passiva, sem harmonizar silenciosamente com formas canônicas semelhantes.
- issue: Condição da mãe do outro filho
  choice: escrava
  alternative: serva
  rationale: '''Escrava'' expressa com maior precisão a condição social indicada no contexto antigo, sem suavizá-la; não acrescenta identificação nominal ausente neste fragmento.'
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A vírgula final foi mantida porque o texto fornecido termina numa oração incompleta que prossegue no contexto seguinte.
