  yaml_path: translation/extra_canonical/jubilees/017/011.yaml
  text: She went a bowshot away, because she said, “Let me not see the death of my child,” and she sat and wept. And an angel of God, one of the holy ones, said to her, “What are you weeping for, Hagar? Rise, take up the child, and hold him with your hand, for God has heard your voice and has seen the child.”
translation:
  language: pt
  text: 'Afastou-se a uma distância de um tiro de arco, pois disse: “Não quero ver a morte do meu filho.” Então se sentou e chorou. E um anjo de Deus, um dos santos, lhe disse: “Por que você está chorando, Agar? Levante-se, pegue o menino e segure-o pela mão, pois Deus ouviu a sua voz e viu o menino.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐቲ፡ ምንዳፍ፡
  choice: à distância de um tiro de arco
  rationale: A expressão significa literalmente “um tiro de arco” e conserva a medida concreta do texto, bem como sua relação literária com Gênesis 21:16.
- source_word: ሕፃን / ኅፃን
  choice: filho / menino
  rationale: O termo designa a criança; “meu filho” é natural na fala de Agar, enquanto “o menino” evita repetição e mantém a referência objetiva nas falas seguintes.
- source_word: እምቅዱሳን፡
  choice: um dos santos
  rationale: Mantém a designação plural substantivada do texto para o grupo celestial, sem acrescentar uma identificação denominacional ou especulativa.
- source_word: አንዝዮ፡ በእዴኪ፡
  choice: sustente-o com a sua mão
  rationale: Reproduz a referência explícita à mão e expressa de modo natural o ato de amparar a criança.
theological_decisions:
- issue: Identidade do anjo como “um dos santos”
  choice: Conservar “um anjo de Deus, um dos santos”
  alternative: “um dos seres santos” ou simplesmente “um anjo de Deus”
  rationale: A tradução preserva tanto a identificação como anjo de Deus quanto sua inclusão entre “os santos”, sem apagar nem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construções de boa legibilidade brasileira. Mantém-se a imagem específica do “tiro de arco”; não se introduz “sentada diante dele”, pois essa expressão pertence ao paralelo de Gênesis e não aparece no texto ge'ez deste versículo.
