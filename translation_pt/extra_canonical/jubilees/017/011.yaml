    rationale: “Ela se afastou à distância de um tiro de arco” é redundante em português. “Afastou-se a uma distância de um tiro de arco” transmite com clareza o ge'ez አሐቲ፡ ምንዳፍ፡, literalmente uma distância de um tiro de arco.
  - severity: low
    issue: Verbo de amparo pouco natural
    rationale: “Sustente-o com a sua mão” é possível, mas “segure-o pela mão” é mais idiomático e conserva tanto a ordem de tomar a criança quanto a menção explícita da mão.
