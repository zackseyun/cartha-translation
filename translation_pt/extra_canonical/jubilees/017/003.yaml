  yaml_path: translation/extra_canonical/jubilees/017/003.yaml
  text: And he remembered the word that He had spoken to him on the day when Lot was separated from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed the Creator with all his mouth.
translation:
  language: pt
  text: E ele se lembrou da palavra que o Senhor lhe havia dito no dia em que Ló se separou dele. E se alegrou porque o Senhor lhe dera descendência na terra para herdar a terra, e abençoou o Criador com toda a sua boca.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃሎ (qālo)
  choice: da palavra
  rationale: O substantivo está no singular e se refere à promessa anteriormente dirigida a Abraão; evita-se a pluralização não apoiada pelo texto ge'ez.
- source_word: ዘርአ (zar'a)
  choice: descendência
  rationale: Expressa naturalmente em português o sentido coletivo de 'semente' como posteridade.
- source_word: ይረሳ (yərasa)
  choice: herdar
  rationale: O verbo deriva de ወረሰ, 'herdar', e não de um verbo com o sentido de 'cobrir'.
- source_word: በኵሉ አፉሁ (bakullu afuhu)
  choice: com toda a sua boca
  rationale: Preserva a imagem enfática e concreta do ge'ez, embora menos idiomática que 'de todo o coração'.
theological_decisions:
- issue: Identidade de quem pronunciou a palavra
  choice: o Senhor lhe havia dito
  alternative: ele lhe havia dito
  rationale: Os sufixos pronominais do ge'ez distinguem quem fala e quem recebe a palavra, e o contexto identifica o Senhor como autor da promessa feita a Abraão; explicitar o referente evita uma ambiguidade pronominal artificial em português.
- issue: Sujeito implícito de 'herdar'
  choice: para herdar a terra
  alternative: para que sua descendência herdasse a terra
  rationale: O infinitivo conserva a concisão e certa abertura sintática do original, sem impor se o foco recai em Abraão por meio de sua descendência ou na própria descendência coletiva.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com preferência por 'descendência' em vez do literalismo potencialmente enganoso 'semente'. A repetição de 'terra' e a expressão concreta 'com toda a sua boca' foram mantidas para preservar a forma e a ênfase do texto-fonte.
