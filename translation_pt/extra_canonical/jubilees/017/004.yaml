  yaml_path: translation/extra_canonical/jubilees/017/004.yaml
  text: And Sarah saw Ishmael joking and dancing, and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, “Cast out this maidservant and her son.”
translation:
  language: pt
  text: 'E Sara viu Ismael brincando e dançando, e Abraão se alegrando com grande alegria. Então ela teve ciúmes de Ismael e disse a Abraão: “Expulse esta serva[a] e o filho dela.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma do texto ge'ez neste ponto é incerta; outra tradução possível é “esta mulher”.
    reason: Registra de modo transparente a incerteza textual e a alternativa menos específica, enquanto o texto principal adota a leitura contextual mais provável.
lexical_decisions:
- source_word: ይትዋነይ፡ ወይዘፍን
  choice: brincando e dançando
  rationale: Mantém as duas ações coordenadas do ge'ez e segue o sentido contextual de diversão e dança, sem reduzir a expressão a uma única atividade.
- source_word: ይትፌሣሕ፡ ፍሥሓ፡ ዐቢየ
  choice: se alegrando com grande alegria
  rationale: Preserva a construção enfática do original, que combina o verbo 'alegrar-se' com o substantivo cognato e o qualificativo 'grande'.
- source_word: ቀንአት
  choice: teve ciúmes
  rationale: Expressa naturalmente em português a reação de Sara em relação a Ismael, preservando o sentido de ciúme ou inveja sem acrescentar uma motivação não declarada.
- source_word: ስድድ
  choice: Expulse
  rationale: Traduz o imperativo forte que ordena afastar ou lançar para fora.
- source_word: ዛተ፡ ወሰተ
  choice: esta serva
  rationale: A forma transmitida no trecho é textualmente problemática, mas a leitura substantiva 'serva' é sustentada pelo contexto narrativo e pela tradição textual paralela; ela também preserva o estatuto social relevante da mulher.
theological_decisions:
- issue: Motivo da reação de Sara
  choice: teve ciúmes de Ismael
  alternative: ficou indignada com Ismael
  rationale: O texto atribui explicitamente a reação a ciúme/inveja; não se reformula a cena para justificar ou condenar teologicamente Sara.
- issue: Identidade e estatuto da mulher expulsa
  choice: esta serva
  alternative: esta mulher
  rationale: “Serva” conserva a posição social indicada pela leitura textual provável e pelo contexto, sem inserir nomenclatura denominacional ou interpretação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição enfática “se alegrando com grande alegria” foi mantida por refletir a forma do original. A fala direta usa “expulse”, corrente e suficientemente forte, e “o filho dela” evita uma construção excessivamente formal.
