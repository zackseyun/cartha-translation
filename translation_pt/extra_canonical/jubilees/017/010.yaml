lexical_decisions:
- source_word: ወነሥአቶ፡ እሙ፡
  choice: Então sua mãe o pegou
  rationale: Preserva o sujeito explícito, «sua mãe», e o sentido básico de tomar/pegar, com sintaxe natural em português.
- source_word: ወገደፈቶ፡
  choice: e o deixou
  rationale: O verbo pode expressar lançar, pôr ou deixar. Neste contexto, «deixou» comunica naturalmente a ação sem sugerir violência além do que a cena exige.
- source_word: ታኅተ፡ አሐቲ፡ እልያስ፡
  choice: debaixo de uma oliveira
  rationale: O numeral አሐቲ pode funcionar idiomaticamente como artigo indefinido; «uma oliveira» é natural e evita especificidade indevida.
- source_word: ወሖረት፡ ወነበረት፡ አንጻር፡ መጠነ፡
  choice: depois foi sentar-se em frente, a certa distância
  rationale: Reproduz a sequência de ir e sentar-se, bem como a posição oposta e o afastamento, em português corrente.
