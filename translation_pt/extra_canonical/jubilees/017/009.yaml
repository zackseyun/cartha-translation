  revision_rationale: A revisão torna a primeira frase natural em português e evita que o travessão apresente como detalhe inequívoco uma relação sintática discutível. Mantêm-se a leitura principal atestada no audit trail — Agar é mandada embora e carrega os provisões — e a alternativa é preservada em nota. Também se remove “mais”, que não é necessário para o sentido do original.
