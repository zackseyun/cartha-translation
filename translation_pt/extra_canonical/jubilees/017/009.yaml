  text: And he took bread and a skin of water and put them on Hagar's shoulder, and the child, and sent her away. And she went and wandered in the wilderness of Beersheba, and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell.
translation:
  language: pt
  text: Então ele tomou pão e um odre de água e os colocou sobre o ombro de Agar, junto com a criança, e a mandou embora.[a] Ela partiu e vagou pelo deserto de Berseba. A água do odre acabou, e a criança teve sede, não conseguiu andar e caiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “entregou-os a Agar e à criança e a mandou embora”.'
    reason: A construção ge'ez permite relacionar Agar e a criança como destinatários do pão e do odre. A tradução principal preserva o sentido mais concreto do verbo, de colocar uma carga sobre Agar, sem eliminar essa alternativa.
lexical_decisions:
- source_word: ዝቀ፡ ማይ (ziqqa māy)
  choice: um odre de água
  rationale: A expressão designa um recipiente de pele para água; “odre” é preciso, tradicional e ainda compreensível em português bíblico moderno.
- source_word: አስከማ (ʾaskamā)
  choice: pôs tudo sobre o ombro
  rationale: O verbo tem o sentido concreto de pôr uma carga sobre alguém ou fazê-la carregar, e não apenas de entregar.
- source_word: ገዳመ፡ ቤርሳቤ (gadāma Bērsābē)
  choice: deserto de Berseba
  rationale: “Deserto” comunica naturalmente a região erma ou inculta indicada pelo termo etíope; “Berseba” é a forma portuguesa estabelecida.
- source_word: ተፈጸመ፡ ማይ (tafaṣṣama māy)
  choice: a água [...] acabou
  rationale: Expressa de modo idiomático que a provisão se esgotou.
- source_word: ስእነ፡ ሐዊረ (seʾna ḥawira)
  choice: não conseguiu mais andar
  rationale: Reproduz a incapacidade de caminhar, com “mais” tornando natural a progressão narrativa sem alterar o sentido.
theological_decisions:
- issue: Quem foi mandado embora
  choice: “a mandou embora”, referindo-se a Agar
  alternative: “mandou-os embora”, referindo-se a Agar e à criança
  rationale: O sufixo verbal no texto etíope é feminino singular e aponta diretamente para Agar.
- issue: Posição da criança na construção da carga
  choice: A criança é apresentada como também colocada sobre o ombro de Agar
  alternative: O pão e a água foram apenas entregues a Agar e à criança
  rationale: A sintaxe é compacta, mas o verbo específico de carregar e a sequência “e a criança” favorecem a imagem de Agar recebendo no ombro tanto os suprimentos quanto a criança; a alternativa é preservada em nota.
translation_notes:
  register: Português moderno, digno e narrativo, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se “odre” por precisão histórico-cultural. O travessão esclarece a construção compacta do original sem esconder a alternativa, registrada em nota.
