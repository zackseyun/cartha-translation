  text: And Isaac did not recognize him, because his hands were hairy like his brother Esau’s hands, so he blessed him.
translation:
  language: pt
  text: E Isaque não o reconheceu, porque as mãos de Jacó eram peludas como as de seu irmão Esaú; por isso, o abençoou.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que o abençoasse”.'
    reason: Preserva a possível leitura de finalidade da construção ge'ez ከመ com subjuntivo, embora o contexto favoreça a leitura consecutiva adotada no texto.
lexical_decisions:
- source_word: ኢያእመረ (ʾiyāʿmara)
  choice: não o reconheceu
  rationale: No contexto do disfarce de Jacó, o verbo de conhecimento é naturalmente expresso como reconhecimento de identidade, sem perder o sentido básico do original.
- source_word: ጸጓር (ṣagwār)
  choice: peludas
  rationale: Descreve as mãos cobertas de pelos, em correspondência direta com as mãos de Esaú.
- source_word: ከመ (kama) + ይባርኮ (yəbārko)
  choice: assim, ele o abençoou
  rationale: A construção pode indicar o resultado da falta de reconhecimento, e essa leitura se ajusta à sequência narrativa; a possível leitura final ou de propósito é preservada em nota.
theological_decisions:
- issue: Relação lógica da oração final com ከመ e subjuntivo
  choice: 'resultado: “assim, ele o abençoou”'
  alternative: 'propósito: “para que o abençoasse”'
  rationale: O contexto apresenta a bênção como consequência do engano bem-sucedido, mas a forma da construção também admite valor de finalidade; por isso, a alternativa permanece explícita na nota.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A ordem foi levemente naturalizada, e o pronome “dele” evita a ambiguidade pouco fluente de “suas mãos”. O ponto e vírgula evidencia a relação de consequência sem tornar a frase excessivamente coloquial.
