  text: And Isaac said to him, “Come near, and let me feel you, my son, whether you are my son Esau or not.”
translation:
  language: pt
  text: 'E Isaque lhe disse: “Aproxime-se, meu filho, para que eu o apalpe, para ver se você é meu filho Esaú ou não.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅረብ
  choice: Aproxime-se
  rationale: Reproduz de modo natural o imperativo ‘chega-te/perto’, mantendo o convite direto de Isaque.
- source_word: ወእግስስከ
  choice: para que eu o apalpe
  rationale: O verbo expressa examinar pelo tato; ‘apalpar’ é claro e preserva a ação concreta sem suavizá-la.
- source_word: እመ፡ አንተ ... ወእመ፡ አኮኑ
  choice: se você é mesmo ... ou não
  rationale: Conserva a alternativa interrogativa do ge'ez em português corrente; ‘mesmo’ explicita naturalmente a verificação de identidade, sem eliminar a incerteza.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por ‘você’ para legibilidade brasileira. A ordem foi levemente ajustada para fluência, preservando a incerteza de Isaque e a verificação pelo tato.
