  to: 'Rebeca chamou Jacó, seu filho, e lhe disse: “Veja! Ouvi Isaque, seu pai, falar com Esaú, seu irmão. Ele disse: ‘Cace para mim, prepare-me uma comida e traga-a para mim, para que eu coma e abençoe você diante do SENHOR antes de morrer.’”'
