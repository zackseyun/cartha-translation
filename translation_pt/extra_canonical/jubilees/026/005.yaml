  yaml_path: translation/extra_canonical/jubilees/026/005.yaml
  text: And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me, and bring it to me, that I may eat and bless you before the LORD before I die.’”
translation:
  language: pt
  text: 'Rebeca chamou Jacó, seu filho, e lhe disse: “Veja! Ouvi Isaque, seu pai, falar com Esaú, seu irmão. Ele disse: ‘Cace para mim, prepare-me uma comida e traga-a para mim, para que eu coma e abençoe você diante do SENHOR antes de morrer.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሁ፡ ሰማዕክዎ፡
  choice: Escute! Ouvi
  rationale: ናሁ introduz enfaticamente a informação (‘eis’, ‘veja’); em português corrente, ‘Escute!’ se ajusta naturalmente ao relato de algo ouvido, enquanto ሰማዕክዎ é vertido diretamente por ‘Ouvi’.
- source_word: አሰግር፡ ሊተ፡
  choice: Cace uma presa para mim
  rationale: O verbo አሰግር exprime caçar ou apanhar caça, e não simplesmente trazê-la; ‘uma presa’ evita a ambiguidade moderna de ‘caça’ como atividade e distingue esta ação do verbo posterior ‘traga’.
- source_word: ወግበር፡ ሊተ፡ መብልዐ፡
  choice: prepare-me uma comida
  rationale: Reproduz a construção ‘faça/prepara para mim alimento’ em linguagem natural e digna.
- source_word: ወአብእ፡ ሊተ፡
  choice: e traga-a para mim
  rationale: Mantém o verbo distinto de trazer presente no texto e usa o pronome com referência à comida preparada.
- source_word: በቅድመ፡ እግዚአብሔር፡
  choice: diante do SENHOR
  rationale: Tradução formal da locução ‘na presença/diante de’ e representação convencional do nome divino nesse contexto.
- source_word: ዘእንበለ፡ እሙት፡
  choice: antes de morrer
  rationale: Expressa de modo idiomático a oração temporal ‘antes que eu morra’, preservando a primeira pessoa do discurso citado.
theological_decisions:
- issue: Relação da bênção com a presença divina
  choice: abençoe você diante do SENHOR
  alternative: abençoe você pelo SENHOR
  rationale: A preposição e a expressão espacial favorecem ‘diante do SENHOR’; a tradução não transforma a frase em uma afirmação explícita sobre a fonte ou fórmula da bênção.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O discurso direto aninhado foi preservado, com nomes nas formas portuguesas consagradas e tratamento por ‘você’ para clareza corrente sem perda de dignidade.
