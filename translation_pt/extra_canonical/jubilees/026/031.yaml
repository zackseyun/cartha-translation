  text: And he said, “Have you not reserved a blessing for me, father?” And Isaac answered and said to Esau, “Look, I have made him lord over you, and I have given all his brothers to him as servants; and with abundance.”
translation:
  language: pt
  text: 'E ele disse: “Não reservaste para mim uma bênção, meu pai?” Isaque respondeu e disse a Esaú: “Eis que o constituí senhor sobre ti e lhe dei todos os seus irmãos como servos; e com abundância...”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto-fonte fornecido termina aqui com uma frase incompleta: literalmente, “e com abundância”.'
    reason: Sinalizar ao leitor que a construção truncada pertence ao texto transmitido no excerto e não é uma omissão acidental da tradução.
lexical_decisions:
- source_word: ኢያትረፍከኒ፡ ሊተ፡ በረከተ
  choice: Não reservaste para mim uma bênção
  rationale: Mantém a pergunta negativa e o caráter indefinido de ‘bênção’, sem transformá-la em ‘a bênção’.
- source_word: ናሁ
  choice: Eis que
  rationale: Reproduz a partícula apresentativa com registro bíblico ainda compreensível em português moderno.
- source_word: እግዚአ፡ ሤምክዎ፡ ለከ
  choice: o constituí senhor sobre ti
  rationale: Expressa a designação de autoridade sobre Esaú sem acrescentar explicação.
- source_word: አግብርተ፡ ይኩንዎ
  choice: como servos
  rationale: Traduz a relação servil predicada dos irmãos, em formulação natural em português.
- source_word: ወበብዝኀ
  choice: e com abundância
  rationale: Conserva a frase final incompleta do trecho ge'ez fornecido, evitando suprir um verbo ou objeto com base em paralelos.
theological_decisions:
- issue: Alcance da autoridade concedida a Jacó
  choice: senhor sobre ti
  alternative: teu senhor
  rationale: A formulação preserva explicitamente a relação de domínio indicada pela preposição, sem ampliar nem atenuar sua força.
- issue: Cláusula final truncada
  choice: manter ‘e com abundância...’
  alternative: completar a oração a partir de Gênesis 27:37 ou de outra tradição textual
  rationale: O texto-fonte disponibilizado termina numa expressão incompleta; completá-la resolveria uma lacuna textual sem evidência presente no excerto.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve tonalidade bíblica em ‘Eis que’. A reticência e a nota preservam a incompletude real do texto-fonte. O marcador [a] aparece no texto principal.
