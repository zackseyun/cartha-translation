lexical_decisions:
- source_word: ወአንሥአ፡ ዔሳው፡ ቃሎ
  choice: Então Esaú levantou a voz
  rationale: Reproduz de modo natural a expressão semítica que indica choro em voz alta, preservando sua forma concreta.
- source_word: ወበከየ
  choice: e chorou
  rationale: Tradução direta do verbo ge'ez.
- source_word: ናሁ
