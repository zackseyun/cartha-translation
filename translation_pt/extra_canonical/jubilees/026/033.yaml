  rationale: Interjeição que chama a atenção para a declaração seguinte; 'Veja' é corrente e digna.
- source_word: እምጠለ፡ ምድር
  choice: longe do orvalho da terra
  rationale: Neste contexto, እም tem sentido separativo, não apenas de origem; 'longe de' preserva o contraste da bênção e evita a leitura oposta.
theological_decisions:
- issue: Sentido da declaração de Isaque sobre a morada de Esaú
  choice: longe do orvalho da terra
  alternative: do orvalho da terra
  rationale: O valor separativo da preposição no contexto indica privação ou distância. A formulação mantém a tensão com a bênção anterior sem transformar a fala em bênção equivalente.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. Mantém a repetição narrativa e a imagem concreta do original, mas evita o pouco natural 'respondeu e disse'. As reticências e a nota registram que a fonte fornecida termina com a oração incompleta.
