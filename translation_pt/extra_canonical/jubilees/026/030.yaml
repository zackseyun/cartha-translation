  text: 'he cried out with a very great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”'
translation:
  language: pt
  text: 'Ele soltou um grito muito forte e amargo e disse a seu pai: “Abençoe-me também, meu pai!” E ele lhe disse: “Seu irmão veio com engano e tomou as suas bênçãos.” Então ele disse: “Agora sei por que ele se chama Jacó: ele já me suplantou duas vezes. Primeiro tomou o meu direito de primogenitura, e agora tomou a minha bênção.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸርኀ፡ በቃል፡ ዐቢይ፡ ወመሪር፡ ጥቀ
  choice: gritou com um clamor muito grande e amargo
  rationale: Reproduz a intensidade e a formulação enfática do ge’ez sem recorrer a uma expressão excessivamente arcaica.
- source_word: በሕብል
  choice: com engano
  rationale: Expressa o meio fraudulento indicado pelo termo no contexto.
- source_word: በረከታቲከ
  choice: as suas bênçãos
  rationale: Mantém o plural explícito da forma ge’ez, sem harmonizá-lo com o singular posterior.
- source_word: አዐቀጸኒ
  choice: me passou para trás
  rationale: Comunica de modo natural a ideia de suplantar ou lograr, preservando o tom acusatório e o jogo narrativo ligado ao nome Jacó.
- source_word: ልደተየ
  choice: meu direito de primogenitura
  rationale: No contexto, refere-se ao direito ou privilégio associado à condição de primogênito, não apenas ao nascimento.
- source_word: በረከትየ
  choice: a minha bênção
  rationale: Mantém corretamente o singular da ocorrência final.
theological_decisions:
- issue: Alternância entre plural e singular em ‘bênção’
  choice: ‘suas bênçãos’ na fala do pai e ‘minha bênção’ na fala do filho
  alternative: Uniformizar ambas as ocorrências no singular
  rationale: A tradução conserva a distinção morfológica do texto-fonte, evitando harmonização interpretativa.
- issue: Sentido do verbo relacionado ao nome Jacó
  choice: ‘me passou para trás’
  alternative: ‘me suplantou’ ou ‘me enganou’
  rationale: A opção mantém a acusação de vantagem obtida às custas do falante em linguagem atual, sem definir o jogo etimológico de maneira mais rígida do que o contexto permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento brasileiro natural. A repetição de ‘tomou’ e a alternância entre plural e singular foram preservadas por refletirem o texto ge’ez.
