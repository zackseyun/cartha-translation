- source_word: ዘአርጐዐኒ፡
  choice: Porque [...] o trouxe
  rationale: Expressa naturalmente em português a relação causal e a ação de fazer o referente chegar à presença de Jacó; o pronome retoma aquilo que ele havia encontrado.
- source_word: አምላክከ፡
  choice: o teu Deus
  rationale: Mantém a segunda pessoa singular e a referência explícita ao Deus do interlocutor.
- source_word: ቅድሜየ።
  choice: diante de mim
  rationale: Preserva a imagem espacial do original sem substituí-la por uma interpretação mais específica.
theological_decisions:
- issue: Atribuição da ação providencial a Deus
  choice: o teu Deus o trouxe diante de mim
  alternative: o teu Deus fez com que eu o encontrasse
  rationale: A tradução conserva a afirmação direta de Jacó e a formulação espacial do ge'ez, sem explicar nem suavizar a alegação teológica presente na fala.
translation_notes:
  register: Português atual, claro e digno, com uso de “teu” coerente com uma fala singular e direta. A construção preserva a concisão e a ambiguidade referencial do original.
