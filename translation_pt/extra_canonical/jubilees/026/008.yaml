  text: And Rebekah his mother said to him, “Let your curse be on me, my son; only listen to my voice.”
translation:
  language: pt
  text: 'E Rebeca, sua mãe, lhe disse: “Que a tua maldição caia sobre mim, meu filho; apenas escute a minha voz.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላዕሌየ፡ መርገምከ
  choice: Caia sobre mim a sua maldição
  rationale: Reproduz de modo natural em português o sentido volitivo da expressão nominal ge'ez, mantendo a imagem da maldição recaindo sobre Rebeca.
- source_word: ስማዕ፡ ቃልየ
  choice: escute o que eu digo
  rationale: O sentido literal é “ouve minha voz/palavra”; esta formulação corrente preserva a ordem para atender às instruções de Rebeca sem soar artificial.
- source_word: ዳእሙ
  choice: apenas
  rationale: Expressa a restrição enfática “somente/tão somente” antes da ordem.
theological_decisions:
- issue: Responsabilidade pela eventual maldição
  choice: Caia sobre mim a sua maldição
  alternative: Que a sua maldição fique por minha conta
  rationale: 'Mantém a linguagem concreta e a tensão do texto: Rebeca se dispõe a receber a maldição temida pelo filho, sem explicar como essa transferência funcionaria.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com pontuação direta e tratamento familiar adequado entre mãe e filho.
