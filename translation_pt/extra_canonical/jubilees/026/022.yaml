  text: And he smelled the fragrant smell of his garments and blessed him and said, “Look, the smell of my son is like the smell of a field.”
translation:
  language: pt
  text: 'E ele sentiu o aroma agradável das roupas dele[a], o abençoou e disse: “Eis que o aroma do meu filho é como o aroma de um campo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mais literalmente, “o cheiro da fragrância das roupas dele”.
    reason: A construção em ge’ez reúne dois termos ligados a cheiro e fragrância; a tradução corrente evita uma redundância pouco natural, mas a nota preserva a forma da expressão original.
lexical_decisions:
- source_word: ጼና፡ መዐዛ፡ (ṣēnā maʿazā)
  choice: aroma agradável
  rationale: A combinação expressa cheiro ou aroma com a nuance adicional de fragrância agradável; esta formulação preserva essa nuance sem soar redundante em português.
- source_word: አልባሲሁ፡ (ʾalbāsihu)
  choice: das roupas dele
  rationale: Traduz diretamente o substantivo plural com sufixo possessivo, mantendo claro que se trata das roupas usadas pelo filho.
- source_word: ናሁ፡ (nāhu)
  choice: Eis que
  rationale: Mantém a força apresentativa do termo e o tom solene da declaração.
- source_word: ገዳም፡ (gadām)
  choice: campo
  rationale: Neste contexto, o termo designa terreno aberto ou campo; evita acrescentar a ideia de bênção ou cultivo, ausente no texto fornecido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade em “Eis que”. A repetição de “aroma” na fala foi mantida para refletir a correspondência lexical do original; na primeira oração, “aroma agradável” comunica a nuance de fragrância de modo natural.
