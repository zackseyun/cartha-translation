  text: and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Now let the days of mourning for my father come near, and I will kill Jacob my brother.”
translation:
  language: pt
  text: '“e a sua descendência será arrancada de sob o céu.” Esaú odiou Jacó por causa da bênção com que seu pai o havia abençoado e disse em seu coração: “Agora, aproximem-se os dias de luto por meu pai; matarei Jacó, meu irmão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: a sua descendência
  rationale: Expressa o sentido coletivo de ‘semente/linhagem’ em português atual, sem restringi-lo a um único descendente.
- source_word: ይሢሮ
  choice: será arrancada
  rationale: Preserva a imagem vigorosa de desenraizamento ou remoção completa presente no verbo da fonte.
- source_word: ይትሜአክ
  choice: odiou
  rationale: Verte diretamente a hostilidade intensa de Esaú contra Jacó, sem atenuá-la.
- source_word: ይእዜኒ
  choice: Agora
  rationale: Mantém o marcador temporal explícito da fonte, destacado também na revisão mais recente.
- source_word: ይብጻሕ
  choice: aproximem-se
  rationale: Conserva a ideia de os dias de luto se achegarem, em vez de apenas começarem ou chegarem.
theological_decisions:
- issue: Relação entre os dias de luto e o plano de matar Jacó
  choice: “aproximem-se os dias de luto por meu pai; então matarei”
  alternative: “quando chegarem os dias de luto por meu pai, matarei”
  rationale: A formulação escolhida preserva a construção volitiva e a tensão do texto, sem explicar além da fonte se Esaú espera a morte do pai ou deseja que ela se aproxime.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leve cadência bíblica em “disse em seu coração”. O início permanece em minúscula por continuar a fala do versículo anterior. A ordem “meu irmão Jacó” segue naturalmente o texto-fonte.
