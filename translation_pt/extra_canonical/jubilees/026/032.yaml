  text: with grain and wine and oil I have sustained him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”
translation:
  language: pt
  text: 'Com cereal, vinho e azeite eu o sustentei. E quanto a você, o que posso fazer agora, meu filho?” Então Esaú disse a seu pai Isaque: “O senhor tem apenas uma bênção, meu pai? Abençoe-me também, meu pai!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስርናይ፡ ወወይን፡ ወቅብዕ፡
  choice: cereal, vinho e azeite
  rationale: Mantém a tríade de produtos agrícolas; “cereal” expressa de modo abrangente o primeiro termo, e “azeite” é a forma portuguesa natural para óleo nesse contexto alimentar.
- source_word: አጽናዕክዎ፡
  choice: eu o sustentei
  rationale: O verbo pode sugerir fortalecer, firmar ou prover sustento; aqui, associado a cereal, vinho e azeite, “sustentei” comunica naturalmente apoio e provisão sem estreitar demais o sentido.
- source_word: ምንተ፡ እሬሲ፡
  choice: o que posso fazer
  rationale: Reproduz a pergunta de Isaque em português corrente, preservando sua força retórica.
- source_word: አሐቲኑ፡ ከመ፡ በረከት፡ እንቲአከስ፡
  choice: Por acaso tens apenas uma bênção
  rationale: Expressa a pergunta enfática de Esaú e conserva a ideia de uma única bênção disponível.
- source_word: ባርከኒ፡ ኪያየኒ፡
  choice: Abençoa também a mim
  rationale: Preserva a inclusão enfática de Esaú, com formulação natural e dignificada.
theological_decisions:
- issue: Natureza da bênção patriarcal
  choice: “apenas uma bênção”
  alternative: “uma única bênção”
  rationale: A tradução mantém a tensão narrativa sobre a singularidade e eficácia da bênção, sem explicar ou harmonizar sua teologia.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” na primeira fala e formas verbais tradicionais na súplica direta de Esaú (“tens”, “abençoa”), refletindo a solenidade afetiva do apelo; se for necessária uniformidade estrita de tratamento no projeto, pode-se regularizar para “o senhor tem” e “abençoe”.
