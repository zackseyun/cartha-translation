base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/009.yaml
  text: And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young goats and brought them to his mother, and his mother prepared them as food, such as he loved.
translation:
  language: pt
  text: E Jacó ouviu a voz de Rebeca, sua mãe; foi, pegou dois cabritos bons e gordos e os trouxe à sua mãe. Sua mãe os preparou como comida, como ele gostava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “como ele gostava”. O texto não identifica expressamente esse «ele»; no contexto narrativo, entende-se normalmente que se refere a Isaque, pai de Jacó.'
    reason: Preserva no texto a referência masculina não especificada do original e informa, sem a impor como parte da redação traduzida, a identificação sugerida pelo contexto.
lexical_decisions:
- source_word: ሰምዐ … ቃለ
  choice: ouviu a voz de
  rationale: Reproduz a expressão etíope e preserva tanto o ato de ouvir quanto a ideia contextual de atender à orientação recebida.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ
  choice: dois cabritos
  rationale: Expressa em português natural a referência a dois animais jovens do rebanho caprino.
- source_word: ሠናያነ፡ ወስቡሓነ
  choice: bons e gordos
  rationale: Mantém os dois qualificativos do texto, referentes à qualidade e à condição dos cabritos.
- source_word: መብልዐ
  choice: a comida
  rationale: Termo corrente e abrangente para o alimento ou prato preparado.
- source_word: ዘከመ፡ ያፈቅር
  choice: de que seu pai gostava
  rationale: A oração indica a preparação segundo o gosto do destinatário; o referente é explicitado como o pai pelo contexto narrativo, embora não apareça expresso nesta frase.
theological_decisions:
- issue: Referente do verbo final “gostava”
  choice: seu pai
  alternative: ele
  rationale: O contexto paralelo da narrativa identifica Isaque como aquele para quem a comida é preparada. Como o pronome implícito pode parecer referir-se a Jacó em português, o texto explicita “seu pai”, com nota para registrar a forma literal e preservar a transparência textual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa fluente. “Cabritos” evita a formulação pesada “filhotes de cabra”; a nota preserva a informação sobre o referente implícito no original.
