  text: full, which the LORD has blessed. And may the LORD give you—and multiply you—from the dew of heaven and from the dew of the earth[23], and abundance of grain and oil may he multiply for you. Let them serve you,
translation:
  language: pt
  text: cheio, que o SENHOR abençoou. E que o SENHOR te dê — e te multiplique — do orvalho do céu e do orvalho da terra[a]; e que multiplique para ti a abundância de trigo e azeite. Que eles te sirvam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “orvalho da terra” é incomum; em vista do texto de Gênesis, alguns poderiam esperar “fertilidade da terra”. A tradução segue aqui a redação ge'ez, sem harmonizá-la.
    reason: alternative_reading
lexical_decisions:
- source_word: ምሉእ (mǝluʾ)
  choice: cheio
  rationale: O termo significa simplesmente “cheio” e retoma o campo mencionado no versículo anterior; não se acrescenta “de bênção”.
- source_word: እምጠለ፡ ሰማይ፡ ወእምጠለ፡ ምድር
  choice: do orvalho do céu e do orvalho da terra
  rationale: Segue literalmente a formulação ge'ez, inclusive a expressão incomum “orvalho da terra”, sem harmonizá-la com Gênesis 27.
- source_word: ስርናይ፡ ወቅብእ
  choice: trigo e azeite
  rationale: Traduz os substantivos concretos como “trigo” e “azeite”, em linguagem corrente e adequada ao contexto agrícola.
- source_word: ይትቀነዩ፡ ለከ
  choice: Que eles te sirvam
  rationale: O ge'ez não explicita o sujeito; o pronome preserva essa indeterminação em vez de acrescentar “povos” ou “nações” a partir do paralelo de Gênesis.
