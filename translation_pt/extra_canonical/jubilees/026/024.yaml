  yaml_path: translation/extra_canonical/jubilees/026/024.yaml
  text: Let nations and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which God blessed me and blessed Abraham my father—let it be for you and for your seed.
translation:
  language: pt
  text: Que nações e povos se prostrem diante de você. Seja senhor de seus irmãos, e que os filhos de sua mãe se prostrem diante de você. E toda a bênção com que Deus abençoou a mim e a Abraão, meu pai, seja para você e para a sua descendência.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “semente”.
    reason: Registra a imagem lexical do termo ge'ez enquanto o texto principal emprega o português natural “descendência”.
lexical_decisions:
- source_word: አሕዛብ፡ ... ሕዝብ፡
  choice: nações e povos
  rationale: Traduz os dois termos presentes no início do texto ge'ez e preserva a distinção coletiva sem omitir አሕዛብ.
- source_word: ይስግዱ፡ ለከ፡
  choice: se prostrem diante de você
  rationale: Expressa de modo natural a ação de curvar-se ou prostrar-se perante alguém, mantendo aqui o valor volitivo da bênção.
- source_word: ኩን፡ እግዚአ፡
  choice: Seja senhor
  rationale: Conserva a forma de desejo ou determinação da bênção e o sentido de autoridade, sem transformar o título comum em designação divina.
- source_word: ዘርእከ፡
  choice: sua descendência
  rationale: O termo significa literalmente 'semente', mas, neste contexto genealógico, 'descendência' comunica naturalmente o sentido coletivo em português.
theological_decisions:
- issue: Designação divina em እግዚአብሔር
  choice: Deus
  alternative: o SENHOR
  rationale: Neste contexto, 'Deus' oferece uma correspondência adequada ao referente divino sem impor a representação do nome pessoal divino, que não aparece de forma inequívoca no texto fornecido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você/seus” de modo consistente e mantém as formas volitivas próprias de uma bênção.
