  text: shall be your dwelling[34], and from the dew of heaven above. And by your sword you shall live, and you shall serve your brother; and it shall be that when you rebel and remove the yoke from your neck, then you will commit a complete sin unto death,
translation:
  language: pt
  text: será a tua morada[a], e do orvalho do céu, lá do alto. Viverás pela tua espada e servirás ao teu irmão. Mas, quando te rebelares[b] e tirares o jugo do teu pescoço, então cometerás um pecado completo para a morte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo começa no meio da frase iniciada no versículo anterior. Esta passagem é especialmente difícil e apresenta uma forma mais extensa que Gênesis 27:40; a tradução conserva a redação mais difícil do texto ge'ez.
    reason: textual_variant
  - marker: b
    text: O verbo também pode ser entendido como “te recusares” ou “te tornares grande”.
    reason: lexical_ambiguity
  - marker: c
    text: Literalmente, “cometerás um pecado completo para a morte”.
    reason: literal_rendering
lexical_decisions:
- source_word: ንብረትከ
  choice: a tua morada
  rationale: O termo pode indicar morada, habitação ou propriedade. “Morada” preserva a formulação da bênção sem impor a leitura do paralelo de Gênesis.
- source_word: በመጥባኅትከ፡ ትሐዩ
  choice: Viverás pela tua espada
  rationale: Reproduz de modo natural a construção instrumental e mantém a imagem direta do texto.
- source_word: አበይከ
  choice: te rebelares
  rationale: O verbo está na segunda pessoa do singular e, neste contexto, pode expressar rebelião ou recusa; não contém a palavra “pai”.
- source_word: አስሰልከ፡ አርዑተ
  choice: tirares o jugo
  rationale: Mantém a segunda pessoa do singular e não acrescenta o possessivo “dele”, ausente no texto.
- source_word: አበሳ፡ ኵሎ
  choice: um pecado completo
  rationale: O adjetivo de totalidade qualifica o substantivo singular “pecado”; por isso, não foi vertido como “todos os pecados”.
- source_word: ለሞት
  choice: que leva à morte
  rationale: Expressa em português corrente a relação “para a morte”, preservando sua força teológica sem explicar de que tipo de morte se trata.
theological_decisions:
- issue: A expressão “pecado completo que leva à morte”
  choice: Manter a formulação difícil do texto ge'ez
  alternative: Harmonizar com Gênesis 27:40 ou suavizar para “pecarás gravemente”
  rationale: A redação transmitida contém linguagem própria sobre pecado e morte. A tradução conserva essa tensão e não a normaliza segundo o paralelo canônico.
- issue: A libertação do jugo
  choice: 'Atribuir as duas ações ao destinatário: “te rebelares e tirares”'
  alternative: “quando teu pai te deixar e retirar o jugo”
  rationale: As duas formas verbais são de segunda pessoa masculina singular; a alternativa introduz “pai” e muda o sujeito sem apoio no texto.
translation_notes:
  register: Português moderno, claro e digno, com formas de segunda pessoa coerentes com o contexto da bênção. A sintaxe inicial fragmentária foi mantida porque o versículo continua a frase anterior. Evitou-se harmonizar a passagem com Gênesis 27:40.
