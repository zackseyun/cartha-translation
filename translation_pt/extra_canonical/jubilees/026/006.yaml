revisions:
- from: 'E agora, meu filho, ouça a minha voz e faça o que lhe ordeno: vá ao seu rebanho e traga-me dois cabritos novos e bons. Eu os prepararei como uma comida de que seu pai gosta. Você a levará a seu pai, e ele comerá e abençoará você diante do SENHOR antes de morrer; e você será abençoado.”'
  to: 'E agora, meu filho, ouça a minha voz e faça o que lhe ordeno: vá ao seu rebanho e traga-me dois cabritos novos e bons. Farei deles uma refeição para seu pai, como ele gosta. Você a levará a seu pai, e ele comerá e abençoará você diante do SENHOR antes de morrer; e você será abençoado.”'
  rationale: 'A revisão é estritamente estilística: substitui uma expressão pouco idiomática por «Farei deles uma refeição», preservando todos os referentes, a progressão narrativa e o sentido do texto-fonte. Não são necessárias notas de rodapé.'
  reviewer_model: gpt-5.6-terra
