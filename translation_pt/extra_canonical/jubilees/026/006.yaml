base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/006.yaml
  text: 'And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”'
translation:
  language: pt
  text: 'E agora, meu filho, ouça a minha voz e faça o que lhe ordeno: vá ao seu rebanho e traga-me dois cabritos novos e bons. Farei deles uma refeição para seu pai, como ele gosta. Você a levará a seu pai, e ele comerá e abençoará você diante do SENHOR antes de morrer; e você será abençoado.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መርዔትከ
  choice: seu rebanho
  rationale: O termo designa o rebanho sob os cuidados do filho; esta formulação é natural e mantém o referente coletivo.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ
  choice: dois cabritos novos e bons
  rationale: A expressão indica dois filhotes de cabra de boa qualidade; “cabritos” é preciso e idiomático em português.
- source_word: መብልዐ
  choice: uma comida
  rationale: O substantivo tem sentido geral de alimento ou comida preparada, sem exigir um prato específico.
- source_word: ይባርከ
  choice: abençoará
  rationale: Preserva o verbo de bênção e sua função narrativa sem explicação teológica adicional.
- source_word: ቅድመ፡ እግዚአብሔር
  choice: diante do SENHOR
  rationale: Reproduz formalmente a expressão de presença divina; “SENHOR” segue a convenção portuguesa para o título divino.
theological_decisions:
- issue: Relação de “diante do SENHOR” com a bênção
  choice: manter a expressão ligada a “abençoará você”
  alternative: entender a frase apenas como afirmação geral de que tudo ocorre na presença de Deus
  rationale: A ordem sintática favorece a ligação direta com o ato de abençoar, mas a tradução evita desenvolver seu alcance teológico.
- issue: Resultado da bênção
  choice: “e você será abençoado”
  alternative: “para que você seja abençoado”
  rationale: A forma coordenada preserva a sequência assertiva do texto e não transforma explicitamente o resultado em finalidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega “você” para a fala materna direta e “SENHOR” como forma convencional do título divino. A repetição narrativa foi preservada, mas a construção inicial foi naturalizada para evitar rigidez excessiva.
