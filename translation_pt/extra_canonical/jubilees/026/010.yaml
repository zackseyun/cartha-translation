  text: And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and the skins of the young kids she put on his hands and on the bare part of his neck.
translation:
  language: pt
  text: Rebeca tomou as roupas preciosas de Esaú, seu filho mais velho, que estavam com ela em casa, e vestiu com elas Jacó, seu filho mais novo; e colocou as peles dos cabritinhos sobre as mãos dele e sobre a parte descoberta do pescoço dele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ ... ዘይትፈተው
  choice: roupas estimadas
  rationale: Expressa o valor ou apreço atribuído às roupas sem importar a formulação «melhores roupas» da passagem paralela de Gênesis.
- source_word: ዘይሌህቅ / ዘይንእስ
  choice: filho mais velho / filho mais novo
  rationale: Traduz naturalmente o contraste etário entre Esaú e Jacó.
- source_word: መሓስአ ጠሊ
  choice: peles dos cabritinhos
  rationale: Reflete o substantivo plural «peles» e a referência aos filhotes de cabra, sem introduzir a preposição equivocada «das peles» no sentido de matéria de origem.
- source_word: ዕርቃነ ክሳዱ
  choice: a parte descoberta do seu pescoço
  rationale: Preserva a referência específica à região sem cobertura do pescoço, em vez de sugerir que todo o pescoço estivesse necessariamente nu.
