  yaml_path: translation/extra_canonical/jubilees/026/007.yaml
  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
translation:
  language: pt
  text: 'E Jacó disse a Rebeca, sua mãe: “Minha mãe, não ficarei sem algo de tudo o que meu pai come e que lhe agrada?[a] Mas tenho medo, minha mãe, de que ele reconheça minha voz e queira me tocar. Você sabe que eu tenho a pele lisa, enquanto meu irmão Esaú é peludo. Aos olhos dele, parecerei alguém que zomba dele; farei algo que ele não me ordenou, e ele ficará irado comigo. E atrairei sobre mim uma maldição, e não uma bênção.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O início do versículo é textualmente difícil. O ge’ez parece dizer: “não ficarei sem algo de tudo o que meu pai come e que lhe agrada?”.'
    reason: segmentation_note
lexical_decisions:
- source_word: ኢይምሕክ
  choice: não me faltará alguma coisa
  rationale: Representa a expressão difícil como ideia de carecer de algo, sem retomar a leitura anterior de ‘reconhecer’.
- source_word: ወያሠምሮ
  choice: e que lhe agrada
  rationale: O verbo deriva de ‘agradar’, qualificando aquilo que o pai come.
- source_word: ይለቡ፡ ቃልየ
  choice: reconheça minha voz
  rationale: Expressa o temor de Jacó de ser identificado pela voz.
- source_word: ይፍቅድ፡ ይገሥሠኒ
  choice: queira me tocar
  rationale: Mantém o sentido volitivo de ይፍቅድ e Jacó como objeto de ‘tocar’.
- source_word: ልሙጽ
  choice: tenho a pele lisa
  rationale: Forma natural em português para o contraste físico com o irmão peludo.
- source_word: ዘያስተአኪ
  choice: alguém que zomba dele
  rationale: Preserva a comparação e a ideia de parecer estar escarnecendo ou enganando o pai.
- source_word: ይትመዓዓኒ
  choice: ficará irado comigo
  rationale: Segue a compreensão contextual de uma reação hostil do pai antes da maldição.
theological_decisions:
- issue: Relação entre o temor de Jacó e a maldição
  choice: 'Preservar a sequência narrativa: identificação pela voz e pelo toque, ira e consequente maldição'
  alternative: Explicitar que Isaque pronunciaria diretamente a maldição por causa do engano
  rationale: O texto não explica em detalhe o mecanismo da maldição; a tradução evita acrescentar uma interpretação moral ou teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas naturais como “tenho a pele lisa” e “queira me tocar”. A estranheza da pergunta inicial foi preservada e sinalizada em nota, sem substituir o sentido lexical por uma conjectura mais fluente.
