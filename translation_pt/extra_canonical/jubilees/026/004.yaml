  text: And Esau went to the open country to hunt, and to catch, and to bring it to his father.
translation:
  language: pt
  text: E Esaú foi ao campo aberto para caçar, capturar a presa e levá-la a seu pai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገዳመ (gädäma)
  choice: ao campo aberto
  rationale: Expressa o espaço não cultivado ou descampado para onde Esaú saiu, em português corrente e de acordo com o contexto de caça.
- source_word: ያሥግር (yasəggər)
  choice: caçar
  rationale: O verbo introduz a atividade de caça; a forma infinitiva preserva a sequência final do original.
- source_word: የአንዝ (yəʾannəz)
  choice: capturar a presa
  rationale: O verbo indica agarrar, apanhar ou capturar. A explicitação de «a presa» fornece em português o objeto naturalmente subentendido no contexto, sem confundi-lo com «procurar».
- source_word: ያምጽእ (yamṣəʾ)
  choice: levá-la
  rationale: Traduz o ato de trazer a presa até o pai; «levá-la a seu pai» é a formulação portuguesa natural segundo o ponto de vista narrativo.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com coordenação fluente. O pronome feminino em «levá-la» retoma «a presa», explicitada na oração anterior. Não se incluiu a variante «procurar», pois a evidência lexical favorece «capturar».
