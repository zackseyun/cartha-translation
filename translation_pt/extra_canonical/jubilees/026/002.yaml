base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/002.yaml
  text: And now take your hunting gear, your quiver and your bow, and go out to the field and hunt and catch game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”
translation:
  language: pt
  text: Agora, pegue seus apetrechos de caça, sua aljava e seu arco, saia ao campo e cace e apanhe uma presa para mim, meu filho.[a] Prepare para mim uma comida de que a minha alma goste e traga-a para mim, para que eu coma e a minha alma abençoe você antes que eu morra.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em formulação mais compacta: “cace uma presa para mim, meu filho”.'
    reason: Registra a possibilidade de entender os dois verbos como uma expressão conjunta, embora o texto principal preserve ambos explicitamente.
lexical_decisions:
- source_word: ንዋየ፡ ነፃዊከ
  choice: seus apetrechos de caça
  rationale: Expressa de modo natural o conjunto de utensílios destinados à caça, mantendo a referência geral do ge’ez.
- source_word: ምትኃደከ፡ ወቀስትከ
  choice: sua aljava e seu arco
  rationale: Mantém os dois objetos específicos e a relação possessiva do texto-fonte.
- source_word: ወነዐው፡ ... ወአንዝ
  choice: cace e apanhe uma presa
  rationale: Preserva os dois verbos distintos do ge’ez — caçar e apanhar/capturar — sem reduzi-los a uma única ação.
- source_word: ነፍስየ
  choice: a minha alma
  rationale: Conserva a linguagem antropológica explícita do original nas duas ocorrências, em vez de substituí-la simplesmente por “eu”.
- source_word: መብልዐ
  choice: uma comida
  rationale: Termo corrente e abrangente para o alimento preparado que Isaque pede.
theological_decisions:
- issue: A alma como sujeito de gostar e abençoar
  choice: Manter “a minha alma” nas duas ocorrências
  alternative: Traduzir idiomaticamente como “de que eu goste” e “para que eu abençoe você”
  rationale: A repetição de “minha alma” é significativa no texto e deve permanecer sem impor uma explicação doutrinária sobre a natureza da alma.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Apetrechos de caça” e “apanhe uma presa” soam naturais sem apagar os elementos do ge’ez; a forma “abençoe você” evita regionalismo excessivo e mantém ampla inteligibilidade.
