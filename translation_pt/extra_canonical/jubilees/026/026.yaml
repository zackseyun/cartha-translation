  text: And Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father arise and eat from my game, so that your soul may bless me.”
translation:
  language: pt
  text: 'E seu irmão Esaú chegou da caça. Ele também preparou comida, levou-a a seu pai e lhe disse: “Que meu pai se levante e coma da minha caça, para que a sua alma me abençoe.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መብልዐ
  choice: uma comida
  rationale: O termo designa alimento ou comida preparada; a formulação natural evita especificar carne ou um prato saboroso além do que o vocábulo exige.
- source_word: እመሥገርትየ
  choice: da minha caça
  rationale: Expressa aquilo que Esaú obteve na caça e mantém a ligação explícita com sua atividade de caçador.
- source_word: ነፍስከ
  choice: a sua alma
  rationale: Traduz diretamente ‘tua alma’, preservando a linguagem antropológica e a possível tensão teológica do texto, sem reduzi-la simplesmente a ‘você’.
theological_decisions:
- issue: A alma do pai como agente da bênção
  choice: para que a sua alma me abençoe
  alternative: para que o senhor me abençoe
  rationale: A tradução mantém a referência explícita à alma presente no ge’ez, sem normalizá-la segundo o uso idiomático moderno.
translation_notes:
  register: Português atual, digno e acessível, com discurso filial respeitoso. O primeiro vocábulo isolado do testemunho fornecido (ተኀብአ, ‘escondeu-se/foi escondido’) foi tratado como remanescente da divisão do versículo anterior, de acordo com o limite textual validado e com a camada inglesa auditada.
