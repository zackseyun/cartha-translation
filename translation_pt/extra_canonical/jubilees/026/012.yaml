  text: And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”
translation:
  language: pt
  text: 'Então Jacó entrou até onde estava seu pai e disse: “Eu sou seu filho. Fiz como o senhor me disse. Levante-se, sente-se e coma daquilo que cacei, meu pai, para que sua alma me abençoe.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቦአ፡ ... ኀበ፡ አቡሁ
  choice: entrou até onde estava seu pai
  rationale: Reproduz de modo natural o movimento de Jacó para junto do pai, sem sugerir apenas uma entrada genérica.
- source_word: አነ፡ ወልድከ
  choice: Eu sou seu filho
  rationale: Mantém a formulação do texto ge'ez e sua ambiguidade narrativa, sem acrescentar o nome Esaú presente em tradições paralelas.
- source_word: በከመ፡ ትቤለኒ
  choice: como o senhor me disse
  rationale: O tratamento por “o senhor” comunica respeito filial em português brasileiro corrente.
- source_word: እምዘ፡ አሰገርኩ
  choice: daquilo que cacei
  rationale: Expressa o resultado da caça de maneira idiomática, preservando a alegação enganosa de Jacó.
- source_word: ነፍስከ
  choice: sua alma
  rationale: Conserva a expressão semítica concreta e teologicamente carregada, em vez de reduzi-la a um simples pronome pessoal.
theological_decisions:
- issue: A bênção atribuída à alma do pai
  choice: para que sua alma me abençoe
  alternative: para que o senhor me abençoe
  rationale: A tradução literal preserva a antropologia e a formulação distintiva do texto, sem resolver se “alma” funciona aqui como referência enfática à pessoa inteira.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O discurso filial usa “o senhor” para marcar respeito; “meu pai” conserva o vocativo afetivo e persuasivo. Nenhuma nota de rodapé foi necessária.
