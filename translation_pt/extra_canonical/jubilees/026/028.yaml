lexical_decisions:
- source_word: ወተደመ፡ ይስሐቅ፡ ድማመ፡ ዐቢየ፡ ጥቀ
  choice: Então Isaque estremeceu com um tremor muito grande
  rationale: Mantém a construção enfática do ge'ez, com verbo e substantivo cognatos, em português claro e solene.
- source_word: መኑ፡ ውእቱ፡ ዝንቱ
  choice: Quem é, então, esse
  rationale: Conserva a forma presente e o demonstrativo do texto-fonte, sem reduzi-los a uma pergunta meramente retrospectiva.
- source_word: ዘነዐወ፡ ወአሥገረ
  choice: que caçou e apanhou a caça
  rationale: Representa os dois verbos distintos do ge'ez — caçar e capturar/apanhar — evitando harmonização com uma formulação mais curta de Gênesis.
- source_word: ወአምጽአ፡ ሊተ
  choice: trouxe-a para mim
  rationale: O pronome feminino retoma naturalmente 'a caça' em português.
- source_word: ወበላዕኩ፡ እምኵሉ
  choice: e eu comi de tudo
  rationale: Tradução idiomática que preserva a abrangência de 'tudo' no original.
- source_word: ወባረክዎ
  choice: e o abençoei
  rationale: Preserva diretamente o objeto masculino singular e a força conclusiva da declaração.
theological_decisions:
- issue: Validade ou possível revogação da bênção
  choice: Encerrar o versículo com a pergunta de Isaque, sem acrescentar explicação
  alternative: Explicitar que a bênção permaneceria válida ou que fora dada por engano
  rationale: O texto deste versículo apenas relata que Isaque o abençoou; qualquer conclusão teológica adicional resolveria uma tensão que deve permanecer no contexto narrativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição enfática 'estremeceu com um tremor' foi mantida por refletir uma característica expressiva do original. Não há marcadores de nota, pois nenhuma nota é necessária para esta redação.
