  text: “The voice is Jacob’s voice[17], but the hands are Esau’s hands.” And he did not recognize him, because it was a turning from heaven to remove his spirit,
translation:
  language: pt
  text: “A voz é a voz de Jacó[a], mas as mãos são as mãos de Esaú.” E ele não o reconheceu, porque aquilo era um desvio vindo do céu para afastar seu espírito,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A divisão dos versículos 17–21 é irregular nas linhas da fonte. A fórmula de reconhecimento e a sequência da bênção foram dispostas segundo a ordem mais coerente do texto ge'ez.
    reason: segmentation_note
lexical_decisions:
- source_word: ሚጠት፡ (miṭat)
  choice: desvio
  rationale: Preserva o substantivo do ge'ez e a ideia de uma alteração ou desvio, sem reduzir a expressão a uma simples ação verbal.
- source_word: እምሰማይ፡ (ʾəm-samāy)
  choice: vindo do céu
  rationale: Expressa com naturalidade a origem celeste indicada pela preposição ge'ez.
- source_word: ለአሕልፎ፡ መንፈሱ፡ (la-ʾaḥləfo manfasu)
  choice: para afastar seu espírito
  rationale: Mantém a finalidade e o sentido causativo de fazer passar ou afastar, sem explicitar além do texto se 'espírito' significa percepção, discernimento ou disposição interior.
theological_decisions:
- issue: Agência celeste no não reconhecimento de Jacó
  choice: “aquilo era um desvio vindo do céu”
  alternative: “isso aconteceu por intervenção do céu”
  rationale: A tradução conserva a afirmação enigmática e a construção nominal da fonte, sem explicar a natureza da ação celeste nem atribuí-la explicitamente a Deus.
- issue: Sentido de “espírito”
  choice: “seu espírito”
  alternative: “seu discernimento”
  rationale: Mantém o termo teologicamente aberto da fonte, evitando interpretar silenciosamente a referência como percepção mental ou sentidos físicos.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima da fonte. “Desvio vindo do céu” conserva a estranheza intencional da oração ge'ez; a vírgula final foi mantida porque o trecho prossegue na unidade textual seguinte.
