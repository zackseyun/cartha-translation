  text: “My son, I have grown old, and now my eyes are too dim to see, and I do not know the day of my death.”
translation:
  language: pt
  text: “Meu filho, envelheci, e eis que meus olhos estão fracos demais para enxergar, e não sei o dia da minha morte.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  choice: Meu filho
  rationale: Vocativo possessivo direto, sem acrescentar uma fórmula introdutória ausente no texto ge'ez.
- source_word: ረሳዕኩ
  choice: envelheci
  rationale: 'Expressa de modo natural o estado alcançado pelo falante: ter ficado velho.'
- source_word: አዕይንትየ፡ ከፍአ፡ ለርእይ
  choice: meus olhos estão fracos demais para enxergar
  rationale: Reproduz em português corrente a deterioração da visão indicada pelo original, preservando a referência explícita aos olhos.
- source_word: ወኢያአምር፡ ዕለተ፡ ሞትየ
  choice: e não sei o dia da minha morte
  rationale: Tradução direta da declaração de desconhecimento quanto ao dia da própria morte.
theological_decisions:
- issue: Conhecimento do dia da morte
  choice: não sei o dia da minha morte
  alternative: não conheço o dia em que morrerei
  rationale: Mantém a formulação substantiva e a tensão do original sem explicar a causa ou o alcance desse desconhecimento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A tradução começa diretamente pelo vocativo, pois o texto ge'ez fornecido não contém “E ele disse”. Não foi preservada a nota da versão inglesa anterior, porque ela documentava uma leitura já corrigida e não sustentada pelo texto-fonte.
