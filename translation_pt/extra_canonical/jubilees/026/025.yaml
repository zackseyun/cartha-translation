translation:
  language: pt
  text: para sempre. Quem amaldiçoar você será amaldiçoado, e quem abençoar você será abençoado.” E aconteceu que, depois que Isaque terminou de abençoar seu filho Jacó, e depois que Jacó saiu de junto de Isaque, seu pai, ele se escondeu;[a]
