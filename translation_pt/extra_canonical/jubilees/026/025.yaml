lexical_decisions:
- source_word: እስከ፡ ለዓለም
  choice: para sempre
  rationale: Expressa de modo natural a duração indefinida/perpétua da fórmula etíope, preservando sua ligação com a frase anterior.
- source_word: ዘይረግመከ፡ ርጉም
  choice: Quem amaldiçoar você será amaldiçoado
  rationale: Mantém a correspondência direta entre amaldiçoar e ser amaldiçoado, sem explicitar um agente que o texto não identifica.
- source_word: ዘይባርከከ፡ ቡሩክ
  choice: quem abençoar você será abençoado
  rationale: Conserva o paralelismo formal e teológico da bênção pronunciada sobre Jacó.
- source_word: ወኮነ፡ እምድኅረ
  choice: Depois que
  rationale: Converte a fórmula narrativa semítica em português corrente, evitando a construção pesada “e aconteceu, depois que”.
- source_word: ወፅአ ... እም
  choice: saiu da presença de
  rationale: Em português, comunica com clareza o afastamento de Jacó em relação a Isaque, sem sugerir origem física ou descendência.
- source_word: ይስሐቅ፡ አቡሁ
  choice: seu pai Isaque
  rationale: Reproduz a relação explícita “Isaque, seu pai” numa ordem idiomática em português.
theological_decisions:
- issue: Agente da maldição e da bênção resultantes
  choice: Uso das formas passivas “será amaldiçoado” e “será abençoado”
  alternative: “Deus o amaldiçoará” e “Deus o abençoará”
  rationale: O texto deixa o agente implícito; a tradução preserva essa abertura em vez de inserir explicitamente Deus.
- issue: Retenção de “ele se escondeu” após a borda do trecho citado
  choice: Retida no texto, com nota textual
  alternative: Encerrar o versículo após “seu pai Isaque”
  rationale: A continuação é atestada na tradição textual e nas edições consultadas mencionadas no histórico editorial; o colchete final do excerto fornecido sinaliza continuação além do recorte, não ausência da frase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “você” nas fórmulas dirigidas a Jacó e preserva o paralelismo entre maldição e bênção. A sequência narrativa foi levemente dessemantizada de sua fórmula semítica para soar natural, sem perda de conteúdo.
