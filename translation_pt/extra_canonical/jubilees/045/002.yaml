  text: fourth, in the second year of the third week of the forty-second[2] jubilee. And Joseph came to receive him.
translation:
  language: pt
  text: No quarto mês[a], no segundo ano da terceira semana do quadragésimo segundo[b] jubileu. E José veio recebê-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «quarto». «Mês» é retomado da frase iniciada no versículo anterior; a divisão dos versículos separou o ordinal do substantivo que ele qualifica.
    reason: verse_segmentation
  - marker: b
    text: O texto ge'ez diz literalmente «quadragésimo segundo» (፵ወ፪), embora a cronologia interna de Jubileus exija que este seja o quadragésimo quinto jubileu.
    reason: textual_variant
lexical_decisions:
- source_word: ራብዕ
  choice: No quarto mês
  rationale: O termo significa literalmente «quarto»; «mês» é recuperado do contexto da frase iniciada no versículo anterior, evitando a leitura contraditória «quarto ano».
- source_word: ዘሰብዓ፡ ሣልስ
  choice: da terceira semana
  rationale: Reproduz a expressão cronológica do texto ge'ez de modo natural em português.
- source_word: ፵ወ፪ እዮቤልው
  choice: quadragésimo segundo jubileu
  rationale: Mantém a leitura numérica efetivamente preservada no texto ge'ez, sem corrigi-la silenciosamente com base na cronologia interna.
- source_word: ወመጽአ፡ ዮሴፍ፡ ይትቀበል
  choice: E José veio recebê-lo
  rationale: Preserva a conjunção inicial, o movimento expresso por «veio» e o pronome objeto sem identificar além do que este segmento declara.
theological_decisions:
- issue: Divergência entre o numeral manuscrito e a cronologia interna de Jubileus
  choice: quadragésimo segundo
  alternative: quadragésimo quinto
  rationale: A tradução conserva o numeral explícito do texto-fonte e registra a dificuldade em nota, em vez de emendar o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe cronológica natural. A explicitação de «mês» resolve a divisão artificial entre versículos sem transformar «quarto» em «quarto ano»; a discrepância cronológica é preservada e documentada.
