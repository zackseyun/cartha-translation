  text: And Joseph made it a statute for the land of Egypt to this day. And Israel lived in the land of Egypt seventeen years, and all the days that he lived were three jubilees, one hundred and forty-seven years. And he died in the fourth year of the fifth week of the forty-fifth jubilee.
translation:
  language: pt
  text: E José fez disso um estatuto para a terra do Egito até o dia de hoje. Israel viveu dezessete anos na terra do Egito, e todos os dias que viveu foram três jubileus, isto é, cento e quarenta e sete anos. Ele morreu no quarto ano da quinta semana do quadragésimo quinto jubileu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ
  choice: estatuto
  rationale: Expressa uma norma estabelecida e duradoura, preservando o caráter formal do termo sem sugerir especificamente um rito religioso.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: até o dia de hoje
  rationale: Reproduz diretamente a fórmula temporal do texto ge'ez em português natural.
- source_word: እዮቤሌውስ
  choice: jubileus
  rationale: Mantém a unidade cronológica própria da obra e a terminologia reconhecível em português.
- source_word: ሱባዔ
  choice: semana
  rationale: Conserva o sistema cronológico de grupos de sete anos usado em Jubileus; o contexto deixa claro que se trata de uma unidade calendárica dentro do jubileu.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa corrente. A expressão explicativa «isto é» torna transparente que os três jubileus correspondem aos cento e quarenta e sete anos, sem alterar a cronologia do original.
