    issue: «todo o território ao redor»
    rationale: A expressão ge'ez designa todo o território ou os distritos pertencentes à localidade, não especificamente a região ‘ao redor’. A formulação atual introduz uma delimitação espacial não indicada pela fonte.
  - severity: low
    issue: Nota interpreta «diante do faraó» como autoridade delegada
    rationale: Embora essa leitura seja possível, a expressão é ambígua. A nota deve apresentar a literalidade e a possibilidade sem afirmar como certo que se trata de autoridade delegada.
