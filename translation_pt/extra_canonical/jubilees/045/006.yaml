  yaml_path: translation/extra_canonical/jubilees/045/006.yaml
  text: And Joseph gave his father and his brothers a possession, so that they might dwell in the land of Goshen, and in Rameses and all its territory, which he ruled before Pharaoh. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.
translation:
  language: pt
  text: E José deu a seu pai e a seus irmãos uma propriedade, para que habitassem na terra de Gósen, em Ramessés e em todo o seu território, que ele governava diante do faraó.[a] Israel e seus filhos se estabeleceram na terra de Gósen, a melhor parte da terra do Egito. Israel tinha cento e trinta anos quando entrou no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «diante do faraó». A expressão pode referir-se ao exercício do governo por José na presença do faraó ou em seu serviço.
    reason: Preserva a expressão relacional do ge'ez e assinala sua possível nuance institucional sem resolver a ambiguidade.
lexical_decisions:
- source_word: ሀብተ
  choice: uma propriedade
  rationale: O substantivo indica uma possessão ou bem concedido; «propriedade» comunica naturalmente uma porção de terra destinada à residência.
- source_word: ይኅደሩ / ኀደረ
  choice: habitassem / se estabeleceram
  rationale: No primeiro caso, o contexto pede residência; no segundo, a forma narrativa descreve a fixação de Israel e seus filhos na região.
- source_word: ወኵሎ አድያሚሃ
  choice: e em todo o território ao redor
  rationale: A expressão abrange as áreas ou distritos pertencentes à localidade, vertida de modo corrente em português.
- source_word: ይኴንን
  choice: ele governava
  rationale: O verbo de ኰነነ expressa governar ou exercer autoridade, sustentando a referência ao governo de José.
- source_word: ምሥናይሃ ለምድረ ግብጽ
  choice: a melhor parte da terra do Egito
  rationale: A construção caracteriza Gósen como a parte excelente ou mais favorável do Egito.
theological_decisions:
- issue: Relação de José com o faraó na oração relativa
  choice: «o qual ele governava diante do faraó»
  alternative: «conforme fora aprovado diante do faraó»
  rationale: O verbo ge'ez favorece «governava», não «foi aprovado». A formulação conserva a expressão relacional «diante do faraó» sem especificar além do texto se ela indica serviço oficial, presença ou autoridade delegada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com nomes próprios em formas bíblicas correntes no Brasil. A sintaxe mantém a progressão narrativa e preserva a tensão da expressão «diante do faraó» por meio de nota.
