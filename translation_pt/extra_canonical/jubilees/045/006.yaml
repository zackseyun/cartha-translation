  source_fidelity: 'A tradução acompanha a estrutura e o sentido geral do ge''ez: a concessão feita por José, a residência em Gósen/Ramessés, a excelência de Gósen e a idade de Israel. Contudo, «todo o território ao redor» acrescenta a noção espacial de circunvizinhança, que não é expressa pelo termo para o território/distritos pertencentes a Ramessés. A oração sobre o governo de José deve conservar a relação ambígua «diante do faraó», sem explicá-la no texto como autoridade delegada.'
  naturalness: O português é claro e de registro narrativo apropriado. «Todo o seu território» é mais direto e fiel do que «todo o território ao redor». A nota pode explicar a literalidade sem transformar uma possibilidade interpretativa em afirmação.
  terminology: «Gósen», «Ramessés», «faraó», «propriedade», «se estabeleceram» e «a melhor parte da terra do Egito» são escolhas adequadas para português moderno de ampla compreensão. «Governava» corresponde bem ao verbo ge'ez.
