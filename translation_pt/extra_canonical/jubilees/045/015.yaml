  yaml_path: translation/extra_canonical/jubilees/045/015.yaml
  text: And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah[15] in the land of Canaan, near Abraham his father.
translation:
  language: pt
  text: E ele os abençoou e deu a José uma porção dupla na terra. E adormeceu com seus antepassados e foi sepultado na caverna de Macpela[a], na terra de Canaã, perto de Abraão, seu pai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a caverna dupla”. Corresponde à caverna funerária ancestral conhecida em outros textos como Macpela.
    reason: cross_reference
lexical_decisions:
- source_word: ባረኮሙ
  choice: os abençoou
  rationale: Reproduz diretamente o verbo e o sufixo de objeto plural do ge'ez.
- source_word: ክልኤተ፡ መክፈሊተ
  choice: uma porção dobrada
  rationale: Expressa literalmente a ideia de duas partes, em português natural, sem especificar além do texto a natureza da porção.
- source_word: ኖመ፡ ምስለ፡ አበዊሁ
  choice: repousou com seus antepassados
  rationale: Preserva o eufemismo tradicional para a morte; 'antepassados' comunica aqui o sentido coletivo de 'pais' com clareza moderna.
- source_word: በዐት፡ ዘካዕበት
  choice: caverna de Macpela
  rationale: Usa o topônimo bíblico reconhecível; a forma ge'ez corresponde literalmente à 'caverna dupla', associação explicada em nota.
- source_word: ቅሩበ፡ አብርሃም፡ አቡሁ
  choice: perto de Abraão, seu pai
  rationale: Mantém a relação espacial e a designação de Abraão como pai/ancestral, sem tentar harmonizar ou explicar a genealogia.
theological_decisions:
- issue: Eufemismo da morte
  choice: repousou com seus antepassados
  alternative: dormiu com seus pais
  rationale: Mantém a imagem tradicional do texto, mas evita em português moderno uma formulação que possa soar sexual ou excessivamente literal.
- issue: Designação de Abraão como pai
  choice: Abraão, seu pai
  alternative: Abraão, seu antepassado
  rationale: Preserva a formulação explícita da fonte e sua possível amplitude semântica, em vez de resolver silenciosamente a tensão genealógica.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe clara. Conserva o tom narrativo bíblico, o eufemismo mortuário e a tensão da expressão “Abraão, seu pai”.
