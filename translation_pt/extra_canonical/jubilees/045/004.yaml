  text: from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. Blessed be the LORD my God forever and ever, and blessed be his name."
translation:
  language: pt
  text: 'do seu servo Jacó. Grande é para mim isto: ter visto o seu rosto enquanto ainda estou vivo, porque verdadeiramente se cumpriu a visão que tive em Betel. Bendito seja o SENHOR, meu Deus, para todo o sempre, e bendito seja o seu nome.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ፡ ሊተ
  choice: Grande é para mim isto
  rationale: Preserva a construção enfática e solene do ge'ez, mantendo a ligação com a oração explicativa seguinte.
- source_word: አማን
  choice: verdadeiramente
  rationale: Expressa o valor adverbial de certeza ou realidade sem acrescentar uma interpretação doutrinária.
- source_word: ሀለወ
  choice: se cumpriu
  rationale: No contexto da visão de Betel agora confirmada pelos acontecimentos, comunica naturalmente a ideia de que ela se tornou realidade; evita a formulação pouco idiomática 'foi estabelecida'.
- source_word: ለዓለመ፡ ዓለም
  choice: para todo o sempre
  rationale: Equivalente português corrente da expressão intensificada de duração perpétua.
theological_decisions:
- issue: Relação entre a visão de Betel e os acontecimentos presentes
  choice: a visão ... se cumpriu
  alternative: a visão ... foi estabelecida
  rationale: A escolha indica confirmação ou realização da visão pelo acontecimento, sem especificar além do que o contexto permite como ela se cumpriu.
- issue: Forma da bênção divina
  choice: Bendito seja o SENHOR, meu Deus
  alternative: Que o SENHOR, meu Deus, seja bendito
  rationale: Mantém o caráter declarativo e doxológico da cláusula, com formulação natural e dignificada em português.
translation_notes:
  register: Português moderno, solene e acessível, com legibilidade brasileira e vocabulário amplamente internacional. O início fragmentário foi preservado porque o versículo continua sintaticamente o anterior. 'SENHOR' segue a convenção editorial para o nome divino presente no texto.
