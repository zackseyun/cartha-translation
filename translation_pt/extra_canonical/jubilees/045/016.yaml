  yaml_path: translation/extra_canonical/jubilees/045/016.yaml
  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
translation:
  language: pt
  text: no túmulo que havia escavado para si na caverna dupla, na terra de Hebrom. E entregou todos os seus livros e os livros de seus pais a Levi, seu filho, para que os guardasse e os renovasse[a] para seus filhos até o dia de hoje.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Renovasse” pode indicar que os livros seriam preservados por meio de novas cópias, restaurados ou transmitidos de novo às gerações posteriores.
    reason: lexical_alternative
lexical_decisions:
- source_word: መቃብር (maqāber)
  choice: túmulo
  rationale: Equivalente direto e natural para o lugar de sepultamento.
- source_word: በዐት፡ ዘካዕበት (baʿāt za-kāʿbet)
  choice: caverna dupla
  rationale: Preserva a designação literal da caverna associada a Hebrom, sem substituir o texto por um nome tradicional.
- source_word: ይዕቀቦን (yəʿqabbon)
  choice: os guardasse
  rationale: Expressa conservar e proteger os livros; o pronome plural retoma os dois conjuntos de livros.
- source_word: ያሐድሶን (yaḥaddəson)
  choice: os renovasse
  rationale: Mantém o sentido formal de renovar, que pode envolver restaurar, recopiar ou transmitir novamente, sem escolher silenciosamente uma única prática.
- source_word: ለውሉዱ (la-wəludu)
  choice: para seus filhos
  rationale: Reproduz a referência pronominal do original e conserva a possível tensão quanto ao referente imediato de “seus”.
- source_word: እስከ፡ ዛቲ፡ ዕለት (ʾəska zāti ʿəlat)
  choice: até o dia de hoje
  rationale: Mantém a fórmula temporal do texto-fonte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. O início em minúscula preserva o caráter de continuação sintática do versículo anterior. A formulação mantém a ambiguidade do pronome “seus” e não especifica além do original como os livros seriam “renovados”.
