  yaml_path: translation/extra_canonical/jubilees/045/014.yaml
  text: And before he died, Israel blessed his sons and told them everything that would happen to them in the land of Egypt and he made known to them what would come upon them in later days.
translation:
  language: pt
  text: Antes de morrer, Israel abençoou seus filhos e lhes contou tudo o que lhes aconteceria na terra do Egito; também lhes deu a conhecer o que lhes sobreviria nos dias posteriores.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como isso lhes sobreviria nos dias posteriores».'
    reason: O elemento ge’ez ከመ pode ser entendido de modo modal («como») ou, no contexto, introduzir o conteúdo do que foi revelado («o que»).
lexical_decisions:
- source_word: ዘእንበለ፡ ይሙት
  choice: Antes de morrer
  rationale: Expressa de modo natural a oração temporal do ge’ez, sem alterar sua relação com a bênção.
- source_word: ይረክቦሙ
  choice: lhes aconteceria
  rationale: O verbo tem o sentido de alcançar, encontrar ou sobrevir; neste contexto, a formulação portuguesa comunica aquilo que os filhos enfrentariam.
- source_word: በደኃሪ፡ መዋዕል
  choice: nos dias posteriores
  rationale: Mantém a referência aberta a um tempo futuro sem impor necessariamente a leitura escatológica mais marcada de «nos últimos dias».
- source_word: እይድያሙ
  choice: lhes deu a conhecer
  rationale: Segue a leitura textual reconhecida como uma forma corrompida de አይድዖሙ, restaurando o verbo final paralelo a «lhes contou».
theological_decisions:
- issue: Possível caráter escatológico de «dias posteriores»
  choice: nos dias posteriores
  alternative: nos últimos dias
  rationale: A escolha preserva a referência temporal futura do ge’ez sem decidir se a expressão tem sentido técnico escatológico.
- issue: Valor de ዘከመ na oração final
  choice: o que lhes sobreviria
  alternative: como isso lhes sobreviria
  rationale: O contexto favorece um segundo objeto da revelação de Israel, em paralelo com «tudo o que lhes aconteceria»; a alternativa conserva a possibilidade de valor modal de ከመ.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e paralelismo entre «lhes contou» e «lhes deu a conhecer». Evitou-se uma expressão escatológica excessivamente marcada no texto principal.
