lexical_decisions:
- source_word: ሴሰዮሙ
  choice: sustentou
  rationale: O verbo expressa alimentar, nutrir ou manter com provisões; “sustentou” conserva o sentido amplo e se aplica naturalmente às pessoas e aos rebanhos.
- source_word: ጥሪቶሙ
  choice: todos os rebanhos deles
  rationale: Neste contexto, o termo designa os animais domésticos ou o gado pertencente à família, e não genericamente tudo o que possuíam.
- source_word: በከመ፡ የአክሎሙ
  choice: dando-lhes o suficiente
  rationale: Reproduz em português natural a ideia de provisão conforme a quantidade necessária ou suficiente para eles.
- source_word: ለሰብዐቱ፡ ዓመታት፡ ዐባር
  choice: durante os sete anos de fome
  rationale: Mantém a duração e a circunstância explícitas no texto ge'ez.
