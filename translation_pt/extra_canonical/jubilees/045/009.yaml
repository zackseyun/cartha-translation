  yaml_path: translation/extra_canonical/jubilees/045/009.yaml
  text: And the years of famine were completed[9], and Joseph gave the people who were in the land seed and provisions, so that they might sow the land in the eighth year, because the river had overflowed over all the land of Egypt.
translation:
  language: pt
  text: E terminaram os anos de fome. José deu ao povo que estava na terra sementes e provisões, para que semeasse a terra no oitavo ano, pois o rio havia transbordado sobre toda a terra do Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመታት፡ ዐባር
  choice: os anos de fome
  rationale: Expressa diretamente a construção do ge’ez, mantendo a referência ao período de fome.
- source_word: ለአሕዛብ፡ ዘውስተ፡ ምድረ
  choice: ao povo que estava na terra
  rationale: Embora አሕዛብ possa ter sentido plural, neste contexto designa coletivamente os habitantes; “ao povo” é natural em português e preserva o valor coletivo.
- source_word: ዘርአ፡ ወሲሳተ
  choice: sementes e provisões
  rationale: Distingue a semente destinada ao plantio dos mantimentos ou recursos de sustento fornecidos ao povo.
- source_word: በሳምን፡ ዓመት
  choice: no oitavo ano
  rationale: ሳምን significa “oitavo”; o dado também se ajusta ao ano posterior aos sete anos de fome.
- source_word: መልአ፡ ፈለግ፡ ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  choice: o rio havia transbordado sobre toda a terra do Egito
  rationale: A formulação comunica naturalmente que as águas do rio cobriram ou inundaram a região, sem identificar explicitamente o rio como o Nilo, pois o texto-fonte não o nomeia.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém “terra” tanto para a região quanto para o solo cultivado, conforme o contexto, e não acrescenta a identificação do rio.
