base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/010.yaml
  text: For during the seven years of famine it had not overflowed and had not watered the land, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.
translation:
  language: pt
  text: Pois, durante os sete anos de fome, o rio não tinha transbordado[a] nem irrigado a terra, exceto em poucos lugares às suas margens. Mas agora ele transbordou, e o Egito semeou a terra e colheu muitíssimo trigo naquele ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não tinha subido”.'
    reason: O verbo ge'ez para a condição do rio pode ser entendido como indicar que ele não subira ou não atingira a cheia; «não tinha transbordado» expressa o sentido contextual adotado.
lexical_decisions:
- source_word: መልአ (mal'a)
  choice: transbordar
  rationale: O verbo significa literalmente “encher”; aplicado ao rio neste contexto, descreve sua cheia ou transbordamento. A alternativa “subir” é preservada em nota.
- source_word: ሰቀየ (saqaya)
  choice: irrigar
  rationale: O verbo significa “regar, dar água, irrigar”, corrigindo a possível confusão com a ideia de o rio apenas subir.
- source_word: ድንጋጌ፡ ፈለግ
  choice: às suas margens
  rationale: A expressão localiza os poucos lugares junto às bordas ou margens do rio; o pronome torna a referência natural em português.
- source_word: ሥርናየ (śernāy)
  choice: trigo
  rationale: O termo designa especificamente trigo, embora possa ser vertido de modo mais genérico como cereal em alguns contextos.
- source_word: ግብጽ (Gəbtṣ)
  choice: o Egito
  rationale: Mantém a personificação geográfica do texto-fonte, em vez de explicitar “os egípcios” ou “os habitantes do Egito”.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente para leitores brasileiros e compreensão internacional. Conservou-se “o Egito” como sujeito e a repetição de “naquele ano”, seguindo a forma do texto-fonte.
