  yaml_path: translation/extra_canonical/jubilees/045/008.yaml
  text: And the land of Egypt suffered because of the famine, and Joseph acquired all the land of Egypt for Pharaoh in exchange for grain, and he acquired the people, their livestock, and everything for Pharaoh.
translation:
  language: pt
  text: E a terra do Egito sofreu por causa da fome; e José adquiriu para o faraó toda a terra do Egito em troca de cereal, e adquiriu também o povo, os seus animais e tudo para o faraó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e adquiriu para o faraó o povo, os seus animais e tudo o que possuíam”.'
    reason: A expressão final “tudo” pode ser entendida de modo absoluto ou, pelo contexto, como tudo o que pertencia ao povo.
lexical_decisions:
- source_word: ሐመተ
  choice: sofreu
  rationale: Expressa de modo natural o dano ou aflição que a fome causou à terra do Egito.
- source_word: አስተጋብአ
  choice: adquiriu
  rationale: Mantém José como sujeito ativo e comunica a obtenção da terra para o faraó.
- source_word: በእክል
  choice: em troca de cereal
  rationale: O substantivo indica grão ou cereal; a relação contextual é de aquisição mediante o fornecimento de alimento.
- source_word: ሰብአኒ
  choice: também o povo
  rationale: ሰብእ significa povo ou pessoas, e a partícula enclítica -ኒ acrescenta o sentido de 'também'.
- source_word: አጥሪየ
  choice: adquiriu
  rationale: É entendido como forma verbal ativa, não como substantivo 'posses'; o sujeito continua sendo José.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com coordenação próxima da estrutura do ge'ez. Emprega-se “o faraó” segundo o uso corrente em português e “cereal” para evitar restringir o termo a uma espécie específica de grão.
