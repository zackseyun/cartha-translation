  text: '...his father Jacob in the land of Goshen, and he embraced his father''s neck and wept. And Israel said to Joseph, "Now let me die, since I have seen you; and now may the LORD, the God of Israel, the God of Abraham and the God of Isaac, be blessed—he who has shown mercy and compassion."'
translation:
  language: pt
  text: '…seu pai Jacó, na terra de Gósen, e abraçou o pescoço de seu pai e chorou. Então Israel disse a José: “Agora posso morrer, pois vi você. E agora seja bendito o SENHOR, o Deus de Israel, o Deus de Abraão e o Deus de Isaque, que demonstrou misericórdia e compaixão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐቀፈ፡ ክሳደ፡ አቡሁ
  choice: abraçou o pescoço de seu pai
  rationale: Reproduz diretamente a expressão ge'ez, preservando a imagem concreta e a referência ao pai.
- source_word: እሙት፡ ይእዜሰ
  choice: Agora posso morrer
  rationale: Expressa em português natural o sentido volitivo/permissivo da declaração de Israel, sem sugerir uma ordem dirigida a outro.
- source_word: እምዘ፡ ርኢኩከ
  choice: pois vi você
  rationale: Mantém a relação causal e a segunda pessoa singular do texto fonte.
- source_word: ይትባረክ፡ እግዚአብሔር
  choice: seja bendito o SENHOR
  rationale: Conserva a fórmula de louvor e verte o título divino segundo a convenção bíblica portuguesa.
- source_word: ዘአክአለ፡ ምሕረተ፡ ወሣህሎ
  choice: que demonstrou misericórdia e compaixão
  rationale: Comunica positivamente a ação divina associada aos dois termos de benevolência, de forma fiel e idiomática.
theological_decisions:
- issue: Identificação de Deus por títulos patriarcais
  choice: o Deus de Israel, o Deus de Abraão e o Deus de Isaque
  alternative: o Deus de Israel, de Abraão e de Isaque
  rationale: A repetição de “Deus” acompanha a estrutura enfática do ge'ez e preserva o peso de cada identificação.
- issue: Natureza da declaração “Agora posso morrer”
  choice: Declaração de Israel sobre a própria morte
  alternative: “Agora, deixa-me morrer”
  rationale: O contexto e a forma verbal favorecem uma declaração de prontidão após rever José; a formulação escolhida é natural sem ampliar teologicamente o enunciado.
