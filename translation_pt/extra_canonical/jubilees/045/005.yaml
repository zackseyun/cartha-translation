  - severity: medium
    issue: «que o havia preservado e preservado para ele seus doze filhos»
    rationale: A segunda ocorrência de «preservado» fica sintaticamente incompleta/áspera sem auxiliar ou flexão verbal. «que o preservara e lhe preservara os seus doze filhos» mantém a repetição significativa do original e explicita a relação dativa.
