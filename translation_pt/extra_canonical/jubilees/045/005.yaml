  yaml_path: translation/extra_canonical/jubilees/045/005.yaml
  text: And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.
translation:
  language: pt
  text: José e seus irmãos comeram pão diante de seu pai e beberam vinho. Jacó se alegrou com alegria muito grande, porque viu José comendo com seus irmãos e bebendo diante de Jacó. E abençoou o Criador de tudo, que o preservara e lhe preservara os seus doze filhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  choice: pão
  rationale: Corresponde diretamente ao substantivo etíope para pão e mantém a formulação concreta do texto.
- source_word: ተፈሥሐ፡ ... ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: se alegrou com enorme alegria
  rationale: Preserva a construção enfática com verbo e substantivo cognatos, expressando a intensidade indicada por 'muito grande' em português natural.
- source_word: ፈጣሪ፡ ኵሉ
  choice: Criador de tudo
  rationale: Reproduz o título divino sem acrescentar identificação ou formulação denominacional.
- source_word: ዐቀቦ፡ ወዐቀበ፡ ሎቱ
  choice: o havia preservado e preservado para ele
  rationale: Mantém a repetição verbal e a distinção entre preservar Jacó e preservar seus filhos para ele.
theological_decisions:
- issue: Referente do primeiro objeto em 'que o havia preservado'
  choice: Jacó
  alternative: José
  rationale: A sequência sintática apresenta Jacó como quem bendiz, e o objeto masculino singular remete naturalmente a ele; a segunda oração distingue os doze filhos preservados para Jacó.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima ao original. Conservou-se a repetição enfática e a expressão relacional 'diante de', evitando paráfrases interpretativas.
