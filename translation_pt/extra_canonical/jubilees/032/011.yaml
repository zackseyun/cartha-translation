base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/011.yaml
  text: Their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the LORD destroyed them for their evil deeds, because they were very wicked, and he caused the Amorites to dwell in their place, evil and sinful, and there is no people today that has completed all their sins, and they are no more.
translation:
  language: pt
  text: Seus reinos eram Carnaim, Astarote, Edrei, Misur e Beom. O SENHOR os destruiu por causa de suas obras más, pois eram muito perversos. E fez os amorreus habitarem no lugar deles — um povo mau e pecador. Hoje não há povo algum que tenha completado todos os pecados deles, e eles já não existem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕጐሎሙ
  choice: os destruiu
  rationale: O verbo ge'ez indica destruir ou arruinar; evita-se a tradução menos precisa «julgou-os».
- source_word: ጸዋጋን፡ ጥቀ
  choice: muito perversos
  rationale: Expressa em português natural a forte caracterização moral do original sem acrescentar uma nuance doutrinária específica.
- source_word: ወአኅደረ፡ አሞሬዎነ፡ ህየንቴሆሙ
  choice: fez os amorreus habitarem no lugar deles
  rationale: Preserva a construção causativa e a substituição territorial explícita no ge'ez.
- source_word: ዘፈጸመ፡ ኀጣውኢሆሙ፡ ኵሎ
  choice: que tenha completado todos os pecados deles
  rationale: Mantém tanto o verbo «completar» quanto o quantificador «todos», sem inserir a ideia interpretativa de uma medida de pecados.
theological_decisions:
- issue: Agente da destruição
  choice: O SENHOR os destruiu
  alternative: O SENHOR os julgou
  rationale: A leitura «destruiu» corresponde ao sentido lexical do verbo e mantém explícita a agência divina do texto.
- issue: Referência dos pronomes no encerramento
  choice: Preservar «deles» e «eles» sem explicitar o referente
  alternative: Substituir os pronomes por um povo nomeado
  rationale: O encadeamento do original permite tensão referencial; explicitar um antecedente resolveria uma ambiguidade que o texto não resolve.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e formas amplamente reconhecíveis no espaço lusófono. Os topônimos seguem grafias bíblicas portuguesas usuais. A oração sobre os amorreus foi pontuada com travessão para indicar que «um povo mau e pecador» os caracteriza, sem alterar a sequência do original.
