translation:
  language: pt
  text: Está estabelecido que eles o façam e sejam registrados como amigos. Mas, se transgredirem e agirem com impureza em todos os seus caminhos, serão registrados nas tábuas celestiais como adversários; serão apagados do livro da vida e registrados no livro dos que perecerão, junto com os que...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho da fonte fornecida termina aqui, deixando a frase incompleta.
    reason: Sinaliza com transparência que a interrupção pertence ao segmento-fonte e não é uma conclusão acrescentada pela tradução.
lexical_decisions:
- source_word: ሤሠርዐት፡ ሎሙ
  choice: Foi estabelecido para eles
  rationale: Preserva a formulação passiva ou impessoal indicada pelo ge'ez, sem introduzir no texto principal um sujeito não expresso.
- source_word: ወይጸሐፉ፡ አዕርክተ
  choice: e fossem registrados como amigos
  rationale: O verbo passivo e o substantivo plural formam a ideia de serem inscritos como amigos, em contraste deliberado com “adversários” na oração seguinte.
- source_word: ሰርኵስ
  choice: com impureza
  rationale: Expressa o sentido de impureza ou contaminação moral do termo no contexto.
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Mantém a imagem concreta tradicional das tábuas do céu.
- source_word: ጸላእተ
  choice: adversários
  rationale: Conserva o contraste lexical e judicial com “amigos”, sem restringir o termo a inimigos militares.
- source_word: መጽሐፈ፡ ሕይወት
  choice: livro da vida
  rationale: Tradução direta da expressão e designação tradicional inteligível em português.
- source_word: እለ፡ ይትሐጐሉ
  choice: os que perecerão
  rationale: Reproduz a referência futura aos destinados a perecer ou ser destruídos, sem explicitar o agente.
theological_decisions:
- issue: Contraste entre a inscrição como amigos e como adversários
  choice: Manter explicitamente “registrados como amigos” e “registrados ... como adversários”
  alternative: Entender a primeira expressão como “registrar isso como uma ordenança”
  rationale: A morfologia e o paralelismo favorecem a referência às pessoas como “amigos”; isso preserva o contraste teológico e judicial interno do versículo.
- issue: Voz da declaração inicial
  choice: 'Formulação passiva e impessoal: “Foi estabelecido para eles”'
  alternative: “Ele lhes ordenou”
  rationale: Evita inserir um sujeito que não está explícito nesta formulação e conserva a possível ambiguidade da construção.
- issue: Destino registrado no segundo livro
  choice: “os que perecerão”
  alternative: “os que serão destruídos”
  rationale: A opção escolhida mantém o resultado futuro sem determinar se a ação é direta, passiva ou judicialmente executada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Tábuas celestiais”, “livro da vida” e o paralelismo entre “amigos” e “adversários” foram preservados. A frase final permanece incompleta porque o texto-fonte fornecido se interrompe nesse ponto.
