  source_fidelity: A tradução preserva adequadamente o contraste central entre serem inscritos como “amigos” e como “adversários”, bem como as imagens das tábuas celestiais e do livro da vida. Contudo, “Foi estabelecido” desloca para o passado uma formulação que é mais naturalmente normativa no presente. A nota a propõe uma alternativa pessoal que não é necessária para a tradução e cuja base não é suficientemente clara para justificá-la como variante editorial.
  naturalness: “Está estabelecido que eles o façam” é mais natural e idiomático em português moderno do que “Foi estabelecido para eles que o fizessem”, ao mesmo tempo que conserva o tom jurídico-normativo. O restante é claro e de registro apropriado.
  terminology: “Amigos”, “adversários”, “tábuas celestiais”, “livro da vida” e “os que perecerão” são escolhas adequadas e coerentes com o paralelismo do original. “Com impureza” preserva a expressão sem especificação doutrinária indevida.
