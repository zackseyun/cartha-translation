revisions:
- from: Foi estabelecido para eles que o fizessem e fossem registrados como amigos.[a] Mas, se transgredirem e agirem com impureza em todos os seus caminhos, serão registrados nas tábuas celestiais como adversários; serão apagados do livro da vida e registrados no livro dos que perecerão, junto com os que...[b]
  to: Está estabelecido que eles o façam e sejam registrados como amigos. Mas, se transgredirem e agirem com impureza em todos os seus caminhos, serão registrados nas tábuas celestiais como adversários; serão apagados do livro da vida e registrados no livro dos que perecerão, junto com os que...[a]
