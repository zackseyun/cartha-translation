base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/016.yaml
  text: The LORD will put it in their mouths, that they may bless all the seed of the beloved. Your mother called you Levi, and in truth she called you so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours, and you and your sons shall eat, and for all.
translation:
  language: pt
  text: Deus porá isso na boca deles, para que abençoem toda a descendência do amado. Sua mãe chamou você de Levi e, em verdade, assim o chamou para que você fosse unido ao SENHOR e se tornasse companheiro de todos os filhos de Jacó. Que a mesa seja para você; você e seus filhos comerão dela — e para todos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão final, “e para todos”, fica incompleta no texto conservado deste versículo.
    reason: Preserva e sinaliza a frase final truncada, em vez de completá-la por conjectura.
lexical_decisions:
- source_word: አብሔር
  choice: Deus
  rationale: Representa diretamente o termo ge’ez para Deus, sem substituir pela forma titular usada depois no versículo.
- source_word: ዘርአ ለፍቅር
  choice: a descendência do amado
  rationale: Preserva o singular coletivo “descendência” e mantém sem explicitação a identidade do “amado”.
- source_word: እምከ ... ሌዊሃ
  choice: Sua mãe chamou você de Levi
  rationale: እምከ significa “sua mãe”; a frase remete à mãe que deu a Levi esse nome, e não a alguém que o chamou dentre outras pessoas.
- source_word: አጸቁ
  choice: fosse unido
  rationale: Conserva o jogo etimológico com o nome Levi, associado à ideia de unir ou ligar.
- source_word: ሱታፌ
  choice: companheiro
  rationale: Expressa participação ou associação de maneira natural, sem acrescentar uma função institucional não declarada.
- source_word: እግዚአብሔር
  choice: SENHOR
  rationale: Distingue o título divino desta ocorrência em relação a አብሔር no início do versículo.
- source_word: ብልዕዋ
  choice: comerão dela
  rationale: O sufixo pronominal retoma “mesa”; em português, comer “dela” comunica naturalmente participar do alimento servido nela.
theological_decisions:
- issue: Relação de Levi com Deus e com os filhos de Jacó
  choice: “unido ao SENHOR” e “companheiro de todos os filhos de Jacó” como duas relações coordenadas
  alternative: Entender a passagem como aproximação cultual ao SENHOR para que os filhos de Jacó comam à mesa de Levi
  rationale: A redação escolhida conserva tanto o jogo com o nome Levi quanto o substantivo “companheiro”, sem fundir essas cláusulas com a referência posterior à mesa.
- issue: Identidade do “amado”
  choice: Manter “o amado” sem identificar a pessoa
  alternative: Explicitar “Jacó” ou “Abraão”
  rationale: O texto não identifica expressamente o referente neste versículo; explicitá-lo resolveria uma ambiguidade genuína.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento naturais à leitura brasileira. “SENHOR” em versaletes é representado por maiúsculas. A formulação preserva o jogo nominal de Levi, a referência não explicada ao “amado” e o término fragmentário do texto.
