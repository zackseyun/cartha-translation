base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/010.yaml
  text: Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man be rooted out who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.
translation:
  language: pt
  text: Quem profanar certamente morrerá; será apedrejado. Não há limite de dias para esta lei, nem remissão nem expiação alguma, a não ser que o homem que profanou sua filha no meio de todo o Israel seja eliminado, pois deu alguém de sua descendência a Moloque e agiu perversamente ao profaná-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O pronome é masculino no texto ge'ez; seu referente exato é incerto.
    reason: O sufixo masculino singular não concorda com «filha», e o antecedente pretendido não é inequívoco.
lexical_decisions:
- source_word: ዘያረኵስ
  choice: Quem profanar
  rationale: O verbo expressa tornar impuro ou profanar; «profanar» preserva o caráter cultual e moral sem especificar indevidamente o objeto na primeira oração.
- source_word: ይትወገር
  choice: será apedrejado
  rationale: Equivalente português natural para a construção passiva ligada a «com pedras», cujo instrumento fica implícito no próprio verbo.
- source_word: ኅድገተ ... ስርየተ
  choice: remissão ou qualquer expiação
  rationale: Mantém distintos os conceitos de remissão/perdão e expiação, em coordenação natural em português.
- source_word: ይሤረው
  choice: seja eliminado
  rationale: Conserva a voz passiva e o sujeito singular «o homem»; «eliminado» comunica a ideia de ser extirpado do povo.
- source_word: ዘርኡ
  choice: alguém de sua descendência
  rationale: A expressão significa literalmente «de sua semente»; esta formulação moderna mantém a referência a um descendente oferecido a Moloque.
- source_word: ለሞሎክ
  choice: a Moloque
  rationale: Transliteração portuguesa tradicional e amplamente reconhecível do nome.
theological_decisions:
- issue: Duração da lei
  choice: Não há limite de dias para esta lei
  alternative: Esta lei é perpétua
  rationale: A tradução conserva a formulação concreta e potencialmente enfática da fonte, sem converter a expressão em uma definição teológica mais abstrata.
- issue: Agente da eliminação
  choice: a não ser que seja eliminado o homem
  alternative: a não ser que eliminem o homem
  rationale: A forma verbal ge'ez é singular passiva; a tradução evita introduzir um agente plural não expresso.
- issue: Referente do pronome final masculino
  choice: ao profaná-lo
  alternative: ao profanar sua filha
  rationale: O sufixo ge'ez é masculino singular e não concorda com «filha»; mantém-se o pronome masculino e registra-se em nota a incerteza do antecedente, em vez de resolver silenciosamente a tensão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. Evitou-se a redundância literal «apedrejado com pedras», naturalizando-a como «apedrejado», e preservaram-se a linguagem jurídica, a voz passiva e a ambiguidade do pronome final.
