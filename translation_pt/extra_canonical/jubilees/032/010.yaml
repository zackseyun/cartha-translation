review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a estrutura jurídica, a voz passiva em «seja eliminado» e a ambiguidade do pronome final masculino, adequadamente assinalada em nota. «Deu alguém de sua descendência» comunica o idiomatismo «de sua semente». Ajusta-se a primeira sanção para explicitar a ênfase de «certamente morrerá».
  naturalness: O texto é claro e de registro apropriado. «Certamente morrerá» é mais direto e idiomático em formulação legal solene do que «deverá morrer», além de não sugerir meramente obrigação futura. A coordenação negativa fica mais natural como «nem remissão nem expiação alguma».
  terminology: «Profanar», «apedrejado», «remissão», «expiação», «eliminado» e «Moloque» são escolhas adequadas. Mantém-se «ao profaná-lo», pois o sufixo ge'ez é masculino singular e seu antecedente permanece incerto.
  issues:
