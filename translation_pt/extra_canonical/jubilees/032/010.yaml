    rationale: «Deverá morrer» pode expressar prescrição, mas não reproduz tão claramente a ênfase presente em «shall surely die» / na construção fonte. «Certamente morrerá» preserva melhor a força assertiva.
  - severity: low
    issue: Coordenação de «remissão» e «expiação».
    rationale: «Nem remissão nem expiação alguma» é a forma negativa portuguesa mais natural e mantém a exclusão de ambas, sem alterar o sentido.
