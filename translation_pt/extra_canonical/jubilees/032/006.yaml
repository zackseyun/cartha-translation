base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/006.yaml
  text: from the prayer that he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed it, he burned frankincense upon it in the fire, and for the sacrifice of deliverance he offered two oxen and four rams and four sheep and four he-goats and four yearling sheep.
translation:
  language: pt
  text: da oração que ele havia feito, de que daria o dízimo junto com os sacrifícios deles e as libações deles.[a] E, quando o fogo o consumiu,[b] ele queimou incenso sobre ele no fogo. E, como sacrifício de salvação,[c] ofereceu dois bois, quatro carneiros, quatro ovelhas, quatro bodes e quatro cordeiros de um ano.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “com os sacrifícios deles e as libações deles”. O referente do plural não é explicitado neste versículo.
    reason: Preserva os sufixos plurais do texto-fonte e assinala a ambiguidade de seu referente.
  - marker: b
    text: Isto é, quando o fogo consumiu aquilo que havia sido oferecido; o objeto não é repetido no texto.
    reason: Evita identificar silenciosamente o objeto como “holocausto”, expressão não especificada nesta cláusula.
  - marker: c
    text: Ou “sacrifício de libertação”.
    reason: O termo etíope pode expressar salvação, livramento ou libertação.
lexical_decisions:
- source_word: ጸሎት
  choice: oração
  rationale: É o sentido direto do termo etíope; evita substituí-lo por “voto”, embora o contexto envolva um compromisso de dar o dízimo.
- source_word: የዐሥር
  choice: dar o dízimo
  rationale: Expressa naturalmente em português a ação verbal de separar a décima parte.
- source_word: ጥዓሕቶሙ
  choice: suas ofertas de bebida
  rationale: Designa libações; a formulação corrente é clara para leitores modernos e preserva o sufixo de terceira pessoa do plural em conjunto com “sacrifícios deles”.
- source_word: ስኂነ
  choice: incenso
  rationale: O termo é tradicionalmente entendido como incenso aromático, especificamente olíbano; “incenso” oferece leitura corrente sem sobrecarregar o texto.
- source_word: መሥዋዕተ፡ መድኃኒት
  choice: sacrifício de salvação
  rationale: Preserva a construção e a amplitude teológica de “salvação/libertação”, sem reduzi-la a uma categoria sacrificial denominacionalmente definida.
- source_word: አባግዐ፡ ዘዘ፡ ዓመት
  choice: cordeiros de um ano
  rationale: Torna explícita em português a idade anual dos animais e os distingue das ovelhas mencionadas antes.
theological_decisions:
- issue: Natureza do sacrifício designado por መድኃኒት
  choice: sacrifício de salvação
  alternative: sacrifício de libertação
  rationale: “Salvação” mantém a abrangência semântica do termo, que pode envolver livramento, preservação ou salvação, e evita resolver em excesso sua função ritual.
- issue: Relação entre oração e dízimo
  choice: em cumprimento da oração que havia feito, para dar o dízimo
  alternative: da oração que havia feito, de que daria o dízimo
  rationale: A redação conserva a ligação causal/final do texto, sem transformar explicitamente a oração em voto.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário sacrificial compreensível. A abertura mantém o caráter de continuação sintática do contexto anterior. Foram preservados o plural de “sacrifícios/ofertas de bebida”, o pronome sem referente explícito em “o consumiu” e a amplitude de “salvação”. O numeral editorial ፭ não foi tratado como parte do texto; por isso, são quatro bodes.
