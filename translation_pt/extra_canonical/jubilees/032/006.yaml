revisions:
- from: em cumprimento da oração que havia feito, para dar o dízimo junto com os sacrifícios deles e suas ofertas de bebida.[a] Quando o fogo o consumiu,[b] ele queimou incenso sobre ele, no fogo. E, como sacrifício de salvação,[c] ofereceu dois bois, quatro carneiros, quatro ovelhas, quatro bodes e quatro cordeiros de um ano.
  to: da oração que ele havia feito, de que daria o dízimo junto com os sacrifícios deles e as libações deles.[a] E, quando o fogo o consumiu,[b] ele queimou incenso sobre ele no fogo. E, como sacrifício de salvação,[c] ofereceu dois bois, quatro carneiros, quatro ovelhas, quatro bodes e quatro cordeiros de um ano.
  rationale: A revisão elimina a nuance interpretativa de “em cumprimento da oração” e exprime de modo mais direto a oração relativa ao ato de dizimar. Também substitui “ofertas de bebida” por “libações”, termo sacrificial preciso. Mantêm-se deliberadamente o objeto pronominal sem antecedente repetido, a cláusula sobre o incenso e todos os numerais do texto-fonte.
