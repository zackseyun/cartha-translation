base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/024.yaml
  text: And he came to the land of Ephrath, and he stayed there. And Rachel gave birth in the night to a son, and she called his name Son of My Sorrow, because she suffered while giving birth; but his father called his name Benjamin, on the eleventh of the eighth month, in the first year of the sixth week of this jubilee.
translation:
  language: pt
  text: E ele chegou à terra de Efrata e permaneceu ali. Raquel deu à luz, durante a noite, um filho e lhe deu o nome de Filho da Minha Dor,[a] porque sofreu ao dar à luz. Seu pai, porém, lhe deu o nome de Benjamim. Isso aconteceu no décimo primeiro dia do oitavo mês, no primeiro ano da sexta semana deste jubileu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Benoni.
    reason: Registra a forma tradicional do nome correspondente ao significado traduzido no texto.
lexical_decisions:
- source_word: ምድረ ከብራታን
  choice: terra de Efrata
  rationale: O topônimo corresponde a Efrata; a forma portuguesa consagrada torna a identificação clara, sem seguir uma possível corrupção gráfica da tradição etíope.
- source_word: ኀደረ
  choice: passou a noite
  rationale: O verbo ge'ez pode significar permanecer ou pernoitar; neste contexto, a referência imediata ao nascimento noturno favorece 'passou a noite'.
- source_word: ወልደ ሕማምየ
  choice: Filho da Minha Dor
  rationale: Traduz o significado do nome dado por Raquel, preservando a expressão explicativa do texto em vez de substituí-la diretamente pela forma hebraica Benoni.
- source_word: ዐጸበታ
  choice: sofreu muito
  rationale: Expressa a aflição ou dificuldade intensa ligada ao parto em português natural.
- source_word: ብንያም
  choice: Benjamim
  rationale: Usa a forma bíblica tradicional e amplamente reconhecida em português.
- source_word: አመ ዐሡሩ ወአሚሩ
  choice: no décimo primeiro dia
  rationale: A fórmula calendárica indica o dia onze, embora 'dia' esteja implícito no ge'ez.
theological_decisions:
- issue: Sentido do nome dado por Raquel
  choice: Traduzir literalmente como 'Filho da Minha Dor', com nota sobre Benoni
  alternative: Usar somente 'Benoni' no corpo do texto
  rationale: A tradução mantém acessível ao leitor a relação explícita entre o nome e o sofrimento do parto, sem perder a forma tradicional, registrada em nota.
- issue: Cronologia jubilar
  choice: Manter integralmente 'no primeiro ano da sexta semana deste jubileu'
  alternative: Converter ou explicar o ano em um sistema cronológico moderno
  rationale: Preserva o sistema cronológico próprio da obra e evita impor uma reconstrução externa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A coordenação repetitiva do ge'ez foi suavizada moderadamente, sem apagar a sequência dos acontecimentos nem a precisão cronológica.
