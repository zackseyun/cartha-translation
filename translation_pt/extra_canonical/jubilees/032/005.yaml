  yaml_path: translation/extra_canonical/jubilees/032/005.yaml
  text: from the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not allow him to harm Jacob, for he appeared to him in a dream at night and Laban told Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain,
translation:
  language: pt
  text: da terra de Gileade. Jacó ocultou de Labão o que tinha no coração e não lhe contou. Na quarta semana, no sétimo ano, Jacó voltou-se para Gileade no primeiro mês, no dia vinte e um. Labão o perseguiu e alcançou Jacó no monte de Gileade, no terceiro mês, no dia treze. Mas o SENHOR não permitiu que ele fizesse mal a Jacó, pois apareceu a Labão num sonho durante a noite, e Labão contou isso a Jacó. No dia quinze daqueles dias, Jacó preparou um banquete para Labão e para todos os que tinham vindo com ele. Naquele dia, Jacó jurou a Labão, e Labão também jurou a Jacó, que nenhum dos dois atravessaria para o lado do outro com más intenções, no monte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀብአ፡ ያዕቆብ፡ ልቦ
  choice: Jacó ocultou de Labão o que tinha no coração
  rationale: Preserva a imagem semítica de ocultar o coração, mas a exprime de modo compreensível em português corrente, sem reduzi-la apenas a “intenção”.
- source_word: ተመይጠ፡ ያዕቆብ፡ ገለአድሃ
  choice: Jacó voltou-se para Gileade
  rationale: O sufixo direcional em ገለአድሃ indica movimento rumo a Gileade; não significa partir de Gileade.
- source_word: በቅዳሜ፡ ወርኅ፡ አመ፡ ዐሥራሁ፡ ወአሚሩ
  choice: no primeiro mês, no dia vinte e um
  rationale: A expressão fornece o mês e o dia, não “o primeiro dia” nem “o décimo ano”.
- source_word: በወርኅ፡ ሣልስ፡ አመ፡ ዐሡሩ፡ ወሠሉሱ
  choice: no terceiro mês, no dia treze
  rationale: አመ introduz aqui o dia do mês; “no décimo terceiro ano” confundiria a fórmula cronológica.
- source_word: ይሕክም፡ ላዕለ፡ ያዕቆብ
  choice: fizesse mal a Jacó
  rationale: Traduz naturalmente a ideia de agir de modo nocivo contra Jacó.
- source_word: ገብረ፡ ያዕቆብ፡ ግዝአ
  choice: Jacó preparou um banquete
  rationale: O substantivo designa uma refeição festiva; “preparou um banquete” é idiomático e mantém o sentido.
- source_word: ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ፡ በእኩይ
  choice: nenhum dos dois atravessaria para o lado do outro com más intenções
  rationale: Conserva tanto o movimento de cruzar para o território do outro quanto a finalidade hostil.
theological_decisions:
- issue: Identidade de quem apareceu no sonho e sujeito da oração seguinte
  choice: O SENHOR apareceu a Labão; depois, Labão contou isso a Jacó
  alternative: O SENHOR falou a Labão acerca de Jacó
  rationale: A sequência etíope apresenta Labão como sujeito explícito de ወነገሮ e Jacó como destinatário; a tradução evita harmonizar o texto silenciosamente com Gênesis 31:24.
- issue: Representação de እግዚአብሔር
  choice: SENHOR
  alternative: Deus / o Senhor
  rationale: Segue a convenção da camada auditada para a referência divina, sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente legível, com preferência por construções naturais no Brasil. Mantém-se o início e o fim fragmentários porque o recorte do versículo começa com “da terra de Gileade” e termina em “no monte,”. A cronologia foi traduzida diretamente do ge'ez, inclusive “no dia treze”, em vez da leitura inglesa inadequada “no décimo terceiro ano”.
