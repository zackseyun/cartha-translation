  source_fidelity: 'A tradução preserva a progressão e o alcance do ge''ez: a continuação «todos os filhos dos homens», a dádiva de toda a terra sob o céu à descendência, o domínio sobre as nações e a subsequente apropriação/herança da terra. «Atrairão para si» representa adequadamente a nuance causativa/consolidante de ያስተጋብኡ sem a reduzir a um ajuntamento físico.'
  naturalness: O português é moderno, claro e de registro elevado sem ser arcaizante. «Sua descendência», «debaixo do céu», «dominarão todas as nações» e «a herdarão» são formulações naturais. A inicial minúscula é apropriada, pois o versículo começa no meio de uma unidade sintática.
  terminology: «Descendência» traduz bem o coletivo genealógico ዘርእከ; «dominarão» comunica o governo exercido sobre as nações; e «herdarão» mantém o vocabulário de herança. A nota em «toda a terra» conserva a alternativa mais diretamente literal para o verbo de reunião/agregação.
