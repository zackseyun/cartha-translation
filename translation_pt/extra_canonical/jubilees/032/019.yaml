base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/019.yaml
  text: all the children of men. And I will give to your seed all the earth that is under heaven, and they will rule over all the nations as they desire; and after this they will draw the whole earth to themselves and inherit it.
translation:
  language: pt
  text: todos os filhos dos homens. Darei à sua descendência toda a terra debaixo do céu, e eles dominarão todas as nações como desejarem. Depois disso, atrairão para si toda a terra[a] e a herdarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “reunirão toda a terra”.
    reason: Preserva a alternativa mais literal para o verbo ge'ez que pode significar reunir, ajuntar ou agregar.
lexical_decisions:
- source_word: ዘርእከ (zarʿeka)
  choice: sua descendência
  rationale: Expressa naturalmente o sentido coletivo de “semente” aplicado aos descendentes, sem perder a referência genealógica.
- source_word: ይኴንኑ (yǝkwännǝnu)
  choice: dominarão
  rationale: O verbo indica exercício de governo ou domínio; “dominarão todas as nações” comunica com clareza a relação de autoridade.
- source_word: ያስተጋብኡ (yastagabʾu)
  choice: atrairão para si
  rationale: O causativo pode transmitir reunir, ajuntar ou agregar. No contexto de domínio e herança, “atrairão para si” conserva a ideia de incorporação sem reduzir a expressão a um ajuntamento físico.
- source_word: ይወርስዋ (yǝwärsǝwa)
  choice: a herdarão
  rationale: Mantém o sentido direto de tomar ou receber a terra como herança; o pronome retoma “toda a terra”.
theological_decisions:
- issue: Alcance do domínio prometido à descendência
  choice: “dominarão todas as nações”
  alternative: “governarão entre todas as nações”
  rationale: A construção favorece domínio exercido sobre as nações, mas a tradução não acrescenta qualquer identificação teológica da descendência nem explica como a promessa se cumpre.
- issue: Sentido da reunião de toda a terra
  choice: “atrairão para si toda a terra” com nota alternativa
  alternative: “reunirão toda a terra”
  rationale: O texto permite uma nuance de agregação ou reunião. A formulação principal explicita o movimento para o grupo dominante, enquanto a nota preserva a leitura mais literal e menos interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O início em minúscula preserva o fato de que o versículo começa como continuação da frase anterior. Evitou-se linguagem denominacional e manteve-se a ambiguidade lexical relevante em nota.
