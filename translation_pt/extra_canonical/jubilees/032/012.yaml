  text: It has been ordained, and there is no keeping it over from this year to the year that is coming. For in its year the seed is eaten until the days of the gathering of the seed of the year, and wine until the time of
translation:
  language: pt
  text: Foi determinado, e nada disso deve ser guardado deste ano para o ano seguinte. Pois, no próprio ano, come-se o cereal até os dias da colheita do cereal daquele ano, e bebe-se o vinho até o tempo de…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho da fonte fornecida termina no meio da frase, depois de “até o tempo de”.
    reason: source_truncation
lexical_decisions:
- source_word: ተኀርየ
  choice: Foi determinado
  rationale: O verbo pode expressar escolha ou determinação; neste contexto normativo, “foi determinado” comunica de modo natural que a prática foi estabelecida, sem acrescentar um agente não expresso.
- source_word: ወአልቦ፡ ለአትርፎ፡ እምኔሁ
  choice: e nada disso deve ser guardado
  rationale: A construção nega que se deixe ou conserve parte daquilo; a formulação portuguesa preserva o sentido prático de não guardar para depois.
- source_word: ዘርእ
  choice: cereal
  rationale: O termo significa literalmente “semente”, mas, no contexto de alimento consumido e colhido, designa o produto cerealífero; “cereal” evita a impressão de que se comem sementes destinadas ao plantio.
- source_word: መዋዕለ፡ ሐፊረ፡ ዘርእ
  choice: os dias da colheita do cereal
  rationale: Traduz a expressão temporal e agrícola de modo claro, mantendo a referência aos dias da reunião ou recolha da produção.
- source_word: አመ
  choice: o tempo de
  rationale: Neste trecho, o termo introduz um momento ou período, não necessariamente um ano; a frase permanece incompleta no excerto fornecido.
theological_decisions:
- issue: Agente da determinação
  choice: Manter o agente implícito em “Foi determinado”
  alternative: “Deus determinou”
  rationale: O texto não nomeia explicitamente o agente; identificá-lo como Deus resolveria uma implicação teológica que a redação preserva de forma implícita.
- issue: Força normativa da proibição de guardar
  choice: “deve ser guardado” em construção negativa
  alternative: “não há como guardar”
  rationale: O contexto apresenta uma prescrição, não uma impossibilidade física; a formulação escolhida comunica essa força normativa sem amplificação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Os numerais etíopes presentes na edição de 1895 foram tratados como sinais editoriais de notas, não como parte do texto bíblico. A elipse e a nota preservam a interrupção real do excerto, em vez de completar a frase por conjectura.
