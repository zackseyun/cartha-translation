base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/004.yaml
  text: He put on priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids,
translation:
  language: pt
  text: Ele o vestiu com as vestes sacerdotais e encheu-lhe as mãos.[a] No décimo quinto dia deste mês, levou ao altar, dentre o gado, catorze bois, vinte e oito carneiros, quarenta e nove ovelhas, sete cordeiros e vinte e um cabritos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “encheu-lhe as mãos”, expressão ritual associada à investidura ou consagração para o sacerdócio.
    reason: A imagem literal pode ser obscura ao leitor moderno, mas deve ser preservada por seu valor ritual e por não definir sozinha todos os pormenores do ato.
lexical_decisions:
- source_word: አልባሰ፡ ክህነት፡
  choice: o vestiu com as vestes sacerdotais
  rationale: O verbo é transitivo, «vestiu [alguém]», e o contexto imediato fornece o objeto implícito. «Vestes sacerdotais» expressa naturalmente a referência à indumentária do sacerdócio, sem seguir a leitura reflexiva da camada inglesa.
- source_word: መልአ፡ እደዊሁ
  choice: encheu-lhe as mãos
  rationale: Mantém a imagem semítica ligada à investidura ou consagração sacerdotal e conserva o pronome possessivo do referente investido.
- source_word: አብአ፡ ውስተ፡ ምሥዋዕ
  choice: levou ao altar
  rationale: Reproduz o movimento até o altar sem acrescentar «como sacrifícios», expressão não explicitada no texto ge'ez.
- source_word: እምአልህምት
  choice: dentre o gado
  rationale: Indica que os animais enumerados foram retirados do conjunto dos animais domésticos, preservando a relação partitiva da preposição.
theological_decisions:
- issue: Sentido ritual de «encher as mãos»
  choice: Preservar a expressão no texto e explicá-la em nota como fórmula de investidura ou consagração sacerdotal
  alternative: Traduzir diretamente por «consagrou-o sacerdote»
  rationale: A tradução direta eliminaria a metáfora ritual do original e resolveria além do necessário a relação exata entre o gesto e a investidura sacerdotal.
- issue: Objeto implícito de «vestiu»
  choice: Traduzir «Ele o vestiu», entendendo que o agente veste a pessoa mencionada no contexto
  alternative: «Ele vestiu as vestes sacerdotais», com sentido reflexivo
  rationale: A forma verbal ge'ez é transitiva e favorece a leitura em que uma pessoa veste outra; assim se evita reproduzir a interpretação reflexiva menos provável da versão inglesa de consulta.
translation_notes:
  register: Português moderno, claro e digno, com formas numéricas por extenso. A construção «encheu-lhe as mãos» mantém solenidade bíblica sem arcaísmo excessivo. A enumeração segue de perto a ordem do ge'ez.
