base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
translation:
  language: pt
  text: e assim serão os seus filhos por todas as gerações. Que o SENHOR dê a você e à sua descendência grandeza de coração para a sua glória; e que aproxime de si, dentre toda a humanidade, você e a sua descendência, para que sirvam[a] em seu santuário como os anjos da Presença e como os santos. A descendência dos seus filhos será como eles, para glória e grandeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em uma antiga interpretação: “para que você sirva”.'
    reason: O ge'ez traz uma forma de terceira pessoa do plural, favorecendo “sirvam”; a nota registra a alternativa de segunda pessoa presente na trilha de revisão inglesa.
lexical_decisions:
- source_word: ውሉደከ
  choice: seus filhos
  rationale: Traduz diretamente o substantivo com sufixo de segunda pessoa e mantém a referência inclusiva aos descendentes imediatos.
- source_word: ዓለማት
  choice: gerações
  rationale: Neste contexto de continuidade da linhagem, o plural literalmente ligado a eras ou tempos é expresso naturalmente por “gerações”.
- source_word: ዘርእከ
  choice: sua descendência
  rationale: Representa o sentido coletivo de “semente” sem exigir leitura estritamente biológica ou masculina.
- source_word: ዐበየ፡ ልበየ
  choice: grandeza de coração
  rationale: Preserva a imagem e a formulação incomum do texto-fonte, sem a interpretar como uma virtude específica.
- source_word: እምኵሉ፡ ዘሥጋ
  choice: dentre todos os seres humanos
  rationale: Comunica o idiomatismo “de toda carne” como seleção dentre a humanidade, conforme a sintaxe da oração.
- source_word: ይትአዘዙ
  choice: sirvam
  rationale: O contexto do santuário favorece serviço cultual; a forma verbal está na terceira pessoa do plural, retomando principalmente a descendência.
- source_word: መላእክተ፡ ገጽ
  choice: anjos da Presença
  rationale: Mantém o título técnico da tradição de Jubileus, no qual “Presença” designa a presença divina.
- source_word: ቅዱሳን
  choice: santos
  rationale: Preserva a designação substantivada e sua possível referência a seres celestiais, sem explicitação interpretativa.
theological_decisions:
- issue: Identidade dos “santos”
  choice: santos
  alternative: seres santos
  rationale: A tradução conserva a designação ambígua do texto, sem decidir se ela indica outra classe angelical ou um grupo mais amplo.
- issue: Sujeito de “sirvam”
  choice: terceira pessoa do plural, referente sobretudo à descendência
  alternative: “para que você sirva”
  rationale: A concordância verbal do ge'ez favorece o plural; não se adotou a antiga leitura de segunda pessoa.
- issue: Alcance de “dentre toda carne”
  choice: aproximação de Jacó e de sua descendência dentre toda a humanidade
  alternative: aproximação de toda carne
  rationale: A construção com a preposição e os objetos anteriores favorece um grupo escolhido dentre os seres humanos, sem desenvolver implicações confessionais.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Empregou-se “você” para o singular, “SENHOR” para o nome divino conforme a convenção editorial e maiúscula em “Presença” por se tratar de um título tradicional.
