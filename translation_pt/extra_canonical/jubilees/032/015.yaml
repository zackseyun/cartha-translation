base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/015.yaml
  text: the daughters of the nations. And if there is any from his daughters whom he gives to a man from any of the nations, for it is plague upon plague, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.
translation:
  language: pt
  text: as filhas das nações. E, se houver alguma dentre as filhas dele que ele dê a um homem de qualquer uma das nações, pois isso é praga sobre praga e maldição sobre maldição. Toda essa praga e maldição virá se ele fizer tal coisa e se fechar os olhos para os que praticam impureza, para os que profanam o santuário do SENHOR e para os que profanam o seu santo nome. Todo o povo, em conjunto, será julgado por toda a impureza e profanação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምአዋልዲሁ
  choice: dentre as filhas dele
  rationale: O sufixo é de terceira pessoa masculina singular; a formulação portuguesa explicita corretamente “dele”, sem alterar a referência.
- source_word: መቅሠፍት፡ ላዕለ፡ መቅሠፍት
  choice: praga sobre praga
  rationale: Preserva a repetição enfática e a relação expressa por ላዕለ.
- source_word: ተዐወረ፡ አዕይንቲሁ
  choice: fechar os olhos
  rationale: Expressão idiomática natural em português para ignorar deliberadamente a conduta mencionada.
- source_word: ያረኵሱ፡ መቅደሶ
  choice: profanam o santuário
  rationale: Traduz a ideia de tornar impuro ou contaminar o espaço sagrado com linguagem corrente e digna.
- source_word: ይጌምኑ፡ ስሞ፡ ቅዱሰ
  choice: profanam o seu santo nome
  rationale: Mantém a distinção entre a profanação do santuário e a do nome santo, apesar da repetição verbal em português.
- source_word: ይትኬነን
  choice: será julgado
  rationale: Reproduz o sentido judicial passivo do verbo no contexto.
theological_decisions:
- issue: Referência do possessivo em “suas filhas”
  choice: as filhas dele
  alternative: as suas filhas
  rationale: “Dele” evita a ambiguidade do possessivo português e conserva a terceira pessoa masculina singular indicada pelo ge'ez.
- issue: Agente e alcance do juízo coletivo
  choice: Todo o povo, em conjunto, será julgado
  alternative: todos os povos juntos serão julgados
  rationale: O texto apresenta ኵሉ፡ ሕዝብ no singular coletivo; a tradução não amplia isso para uma pluralidade explícita de povos.
- issue: Valor causal de እስመ e cópula ውእቱ
  choice: pois isso é praga sobre praga
  alternative: praga sobre praga cairá sobre ele
  rationale: Preserva tanto a conjunção causal quanto a construção copulativa, sem acrescentar um destinatário ausente do texto.
translation_notes:
  register: Português moderno, internacional e legível no Brasil, com tom solene sem arcaísmo. O início fragmentário foi mantido porque o texto fornecido começa como continuação sintática do contexto anterior. “SENHOR” segue a convenção editorial para o nome divino, e a repetição de “profanam” conserva o paralelismo do original.
