base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/020.yaml
  text: And through you the salvation of Israel will be found. And on the day you sit on the throne of the glory of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you, and also those who curse you, shall be destroyed and cut off.
translation:
  language: pt
  text: E por meio de ti será encontrada a salvação de Israel. E, no dia em que te assentares no trono da glória da tua justiça,[a] haverá grande paz para toda a descendência dos filhos do amado.[b] Quem te abençoar será abençoado; mas todos os que te odiarem e te afligirem, bem como os que te amaldiçoarem, serão arrancados e perecerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no dia em que habitares no trono da glória da tua justiça”.'
    reason: O verbo ge’ez pode significar tanto sentar-se quanto habitar ou permanecer.
  - marker: b
    text: Literalmente, “para toda a semente dos filhos do amado”. “O amado” também pode ser entendido como “aquele que é amado”.
    reason: Preserva a forma da expressão ge’ez e evita identificar de maneira indevida quem é chamado de amado.
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: a salvação de Israel
  rationale: Mantém o sentido direto do substantivo ge’ez para livramento ou salvação, sem especificar indevidamente sua natureza.
- source_word: ትነብር
  choice: te assentares
  rationale: No contexto de um trono, o verbo admite naturalmente o sentido de sentar-se ou tomar assento; a possibilidade mais ampla de ‘habitar/permanecer’ é registrada em nota.
- source_word: መንበረ፡ ክብር፡ ጽድቅከ
  choice: trono da glória da tua justiça
  rationale: Reproduz a cadeia nominal do original e conserva sua densidade e possível ambiguidade relacional.
- source_word: ዘርአ
  choice: descendência
  rationale: Expressa em português corrente o sentido coletivo de ‘semente’ como posteridade.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: serão arrancados e perecerão
  rationale: 'Preserva as duas imagens verbais do texto: remoção pela raiz e perdição ou desaparecimento.'
theological_decisions:
- issue: Identidade de ‘o Amado’
  choice: dos filhos do Amado
  alternative: de seus filhos amados
  rationale: A construção ge’ez favorece ‘filhos do amado’, tratando ‘o amado’ como substantivo ou título; não se identifica a personagem além do que o texto permite.
- issue: Relação entre entronização e paz
  choice: uma única oração temporal
  alternative: 'duas afirmações independentes: ‘Naquele dia habitarás... Haverá grande paz...’'
  rationale: A expressão temporal e a forma verbal sustentam a ligação direta entre o assentar-se no trono e a paz subsequente, embora a amplitude semântica do verbo seja indicada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. Mantiveram-se a cadeia nominal solene e as duas ações distintas da sentença final; a pontuação explicita a estrutura sem eliminar ambiguidades genuínas.
