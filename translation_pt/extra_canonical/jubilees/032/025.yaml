base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/025.yaml
  text: And Rachel died there and was buried in the land of Ephrath, that is, Bethlehem. And Jacob built a pillar over Rachel’s grave on the road, above her tomb.
translation:
  language: pt
  text: E Raquel morreu ali e foi sepultada na terra de Efrata, isto é, Belém. Jacó ergueu sobre o túmulo de Raquel uma coluna à beira do caminho, sobre a sepultura dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ ፡ ኤፍራታ
  choice: terra de Efrata
  rationale: Mantém a designação geográfica do texto ge'ez sem reduzi-la apenas à cidade identificada em seguida.
- source_word: ሐውልተ
  choice: coluna
  rationale: Expressa um monumento vertical de pedra erguido para assinalar uma sepultura; é natural em português e preserva o sentido concreto.
- source_word: ውስተ ፡ ፍኖት
  choice: à beira do caminho
  rationale: O contexto descreve a localização do monumento funerário em relação ao caminho; esta formulação é idiomática e evita a leitura pouco natural 'dentro do caminho'.
- source_word: ላዕለ ፡ መቃብሪሃ
  choice: sobre a sepultura dela
  rationale: Traduz diretamente a relação espacial e conserva a repetição semântica entre túmulo e sepultura presente no texto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, de ampla compreensão internacional e com boa legibilidade brasileira. A tradução segue prioritariamente o texto ge'ez fornecido e conserva a identificação explicativa de Efrata com Belém.
