base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/018.yaml
  text: Blessed be everyone who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and be spoken of throughout all the earth and regions. Then nations will fear before your face.
translation:
  language: pt
  text: 'Bendito seja todo aquele que abençoar você, e seja amaldiçoado todo povo que amaldiçoar você. E a Judá ele disse: “Que o Senhor lhe dê força e poder para esmagar todos os que odeiam você. Seja governante sobre os filhos de Jacó — você e um de seus filhos. Que o seu nome e o nome de seus filhos percorram e sejam proclamados por toda a terra e pelas regiões. Então as nações temerão diante de você.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃይለ፡ ወጽንዐ
  choice: força e poder
  rationale: Preserva os dois termos coordenados, expressando capacidade e vigor sem os fundir numa só ideia.
- source_word: ትኪዶሙ
  choice: esmagar
  rationale: O verbo transmite a imagem de pisar ou subjugar; “esmagar” conserva sua força em português corrente.
- source_word: መኰንነ
  choice: governante
  rationale: Termo amplo e não dinástico para uma autoridade ou príncipe, evitando especificar um título político além do texto.
- source_word: ዘየሐውር፡ ወዘያንበቡ
  choice: percorram e sejam proclamados
  rationale: 'Mantém os dois verbos do ge''ez: um ligado a ir ou circular, e outro à leitura, recitação ou proclamação; em contexto, ambos descrevem a ampla difusão dos nomes.'
- source_word: አሕዛብ
  choice: nações
  rationale: Representa o sentido coletivo de povos ou gentios sem introduzir uma distinção religiosa desnecessária.
- source_word: እምቅድመ፡ ገጽከ
  choice: diante de você
  rationale: Traduz naturalmente a expressão idiomática literal “diante do seu rosto”, preservando a ideia de temor em sua presença.
theological_decisions:
- issue: Identidade e duração do governo prometido a Judá
  choice: “você e um de seus filhos”
  alternative: “você e um dos seus descendentes”
  rationale: “Filho” reproduz mais diretamente o termo do texto e mantém aberta a questão de referência imediata ou dinástica, sem identificar o descendente.
- issue: Título divino እግዚአ ብሔር
  choice: Senhor
  alternative: SENHOR
  rationale: Usa o título divino tradicional sem impor a convenção tipográfica associada especificamente à representação do tetragrama hebraico.
translation_notes:
  register: Português moderno, digno e acessível, com pronomes de terceira pessoa (“você”, “lhe”) para clareza internacional e boa legibilidade brasileira. A fala permanece aberta ao final porque continua no versículo seguinte.
