base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/001.yaml
  text: And Judah saw and rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."
translation:
  language: pt
  text: 'E Judá viu[a] e se alegrou, e abençoou o Deus de seus pais, Abraão e Isaque. E disse: “Agora sei que tenho uma esperança eterna, e também os meus filhos, diante do Deus de todos. Assim está estabelecido a respeito dos dois, e isso será registrado para eles como testemunho eterno nas tábuas celestiais, conforme Isaque os abençoou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo a forma preservada do texto: “E Judá se alegrou”. A leitura “viu e se alegrou” reflete uma provável correção de um erro de transmissão.'
    reason: A forma ge’ez fornecida parece defeituosa; a tradição editorial sustenta a presença de “viu”, mas convém tornar transparente a incerteza textual.
lexical_decisions:
- source_word: ወይሁዳሃ
  choice: E Judá viu
  rationale: A forma transmitida parece corrompida ou resultante de erro de cópia/OCR; a evidência editorial e a revisão crítica sustentam a leitura equivalente a “E Judá viu”, preservada com nota por causa da incerteza textual.
- source_word: ተስፋ፡ ዘለዓለም
  choice: esperança eterna
  rationale: Reproduz diretamente a noção de esperança duradoura/perpétua sem explicitação teológica adicional.
- source_word: በቅድመ፡ አምላከ፡ ኵሉ
  choice: diante do Deus de todos
  rationale: Mantém a construção relacional e o alcance universal do título divino.
- source_word: ሥሩዕ
  choice: estabelecido
  rationale: Expressa algo ordenado ou determinado; “estabelecido” é natural em português e evita especificar indevidamente o agente.
- source_word: በስምዕ፡ ዘለዓለም
  choice: como testemunho eterno
  rationale: Conserva o sentido jurídico-memorial de testemunho permanente.
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Mantém a imagem técnica e recorrente de Jubileus.
theological_decisions:
- issue: Referente de “os dois”
  choice: Manter “os dois” sem identificar os referentes
  alternative: Explicitar os nomes ou identificar os filhos
  rationale: O versículo depende do contexto anterior, e o texto-fonte não repete os referentes; explicitá-los resolveria uma referência que aqui permanece implícita.
- issue: Sujeito/agente da ordenação
  choice: Usar a forma impessoal “está estabelecido”
  alternative: “Deus determinou”
  rationale: O original afirma que algo está ordenado sem nomear explicitamente o agente; a tradução preserva essa abertura.
- issue: Valor de “em favor deles”
  choice: “será registrado em favor deles”
  alternative: “será registrado para eles”
  rationale: “Em favor deles” comunica melhor o valor benéfico do registro, sem convertê-lo em posse ou entrega material.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe bíblica moderada. Empregam-se “bendisse”, “diante de” e “tábuas celestiais” para conservar o registro religioso e as imagens próprias da obra sem arcaísmo excessivo.
