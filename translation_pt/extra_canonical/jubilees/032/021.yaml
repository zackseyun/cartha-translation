  text: And he went up into heaven[21]. And he saw in a vision of the night, and behold, an angel was descending from heaven, and in his hands were tablets, and he gave them to Jacob, and he read them and learned everything written in them that would happen to him and to his children through all the ages. And he showed him everything written on the tablets and said to him, "Do not build this place, and do not make it an eternal sanctuary, and do not dwell here, for this is not the place. Go to the house of Abraham your father, and dwell with Isaac your father until the day of your father's death. For in Egypt you will die in peace, and in this land you will be buried in honor in the tomb of your fathers, with Abraham and Isaac. Do not fear, for as you have seen and read, so shall everything be. And you also, write down everything as you have seen and read." And Jacob said, "Lord, how shall I remember everything that I have read and seen?" And he said to him, "I will make you remember everything."
    And he went up from him, and he awoke from his sleep and remembered everything that he had read and seen, and he wrote down all the matters that he had read and seen[21]. And there he celebrated one additional day, and he observed it according to all that they sacrifice in former days, and he called its name Addition, because that day had been added, and they had formerly called them a feast. And thus he showed that it should be so, and it is written on the heavenly tablets concerning this, that it was revealed to him that he should observe it and add it to the seven days of the feast. And its name was called Addition, because it is added to the feast days according to the number of the days of the year. And on the night of the thirteenth of this month Deborah, Rebekah's nurse, died, and they buried her below the city, under the oak by the river, and they called the name of that place Deborah's River, and the oak, the Oak of the Mourning of Deborah. And Rebekah went and entered her house
    to Isaac her father, and Jacob sent by her hand rams and sheep, that she might bring them to his father's house. And he said to her, "Let us go to every place, and do not travel with you." And Jacob blessed the God of Isaac his father and the God of Abraham, the father of his father, and he arose and loaded his wives and his children and took all his possessions and crossed the river and arrived.
translation:
  language: pt
  text: 'E ele subiu ao céu. Numa visão durante a noite, Jacó viu um anjo que descia do céu com tábuas nas mãos. O anjo as entregou a Jacó, que as leu e ficou sabendo de tudo o que nelas estava escrito sobre o que lhe aconteceria, a ele e a seus filhos, ao longo de todas as eras. O anjo lhe mostrou tudo o que estava escrito nas tábuas e disse:


    — Não construa este lugar nem faça dele um santuário eterno. Não permaneça aqui, pois este não é o lugar. Vá à casa de Abraão, seu pai, e fique com Isaque, seu pai, até o dia da morte de seu pai. Pois você morrerá em paz no Egito, mas será sepultado com honra nesta terra, no túmulo de seus pais, junto de Abraão e Isaque. Não tenha medo, pois, assim como você viu e leu, assim tudo acontecerá. Escreva também tudo o que você viu e leu.


    Jacó perguntou:


    — Senhor, como me lembrarei de tudo o que li e vi?


    Ele lhe respondeu:


    — Eu farei que você se lembre de tudo.


    Então ele subiu e se afastou dele. Jacó despertou do sono, lembrou-se de tudo o que havia lido e visto e escreveu todos os assuntos que havia lido e visto.


    Ali ele acrescentou um dia e nele ofereceu sacrifícios, conforme tudo o que se sacrificava antigamente. Chamou esse dia de Acréscimo,[a] porque esse dia havia sido acrescentado; aos dias anteriores, porém, chamavam festa. Assim lhe foi mostrado que isso deveria ser feito, e está escrito nas tábuas celestiais a esse respeito que lhe foi revelado que ele deveria celebrá-lo e acrescentá-lo aos sete dias da festa. Seu nome foi chamado Acréscimo porque ele é acrescentado aos dias da festa, de acordo com o número dos dias do ano.


    Na noite do décimo terceiro dia daquele mês, morreu Débora, a ama de Rebeca. Eles a sepultaram abaixo da cidade, debaixo do carvalho junto ao ribeiro. Chamaram aquele lugar de Ribeiro de Débora e ao carvalho, Carvalho do Luto de Débora.[b]


    Rebeca foi e entrou em sua casa, junto de Isaque, seu pai.[c] Por meio dela, Jacó enviou carneiros e ovelhas para que ela os levasse à casa de seu pai. Ele lhe disse:


    — Vamos a todo lugar, e não venhas comigo.[c]


    Jacó bendisse o Deus de Isaque, seu pai, e o Deus de Abraão, pai de seu pai. Depois se levantou, fez suas mulheres e seus filhos montarem, tomou todos os seus bens, atravessou o rio e chegou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Acréscimo” traduz um termo que significa algo acrescentado ou anexado. O próprio trecho o explica como um dia festivo adicional, somado aos sete dias da festa.
    reason: cultural_note
  - marker: b
    text: A expressão preservada no manuscrito é difícil e aparentemente corrompida. A tradução “Carvalho do Luto de Débora” representa a leitura associada ao pranto ou luto; também seria possível entender o nome simplesmente como “Carvalho de Débora”.
    reason: textual_variant
  - marker: c
    text: As orações sobre os movimentos de Rebeca, a referência a “Isaque, seu pai” e a instrução final de Jacó são sintaticamente obscuras no ge'ez. A tradução mantém a formulação transmitida, inclusive a ordem negativa “não venhas comigo”, sem harmonizá-la com a narrativa conhecida.
    reason: textual_variant
lexical_decisions:
- source_word: ተውሳክ (tawsāk)
  choice: Acréscimo
  rationale: O substantivo designa algo acrescentado ou suplementar, e o próprio contexto explica que se trata de um dia adicionado aos sete dias da festa.
- source_word: ይሠውዑ
  choice: ofereceu sacrifícios / se sacrificava
  rationale: O verbo se refere especificamente ao ato de sacrificar; evita-se a generalização por “fazer” ou “observar”.
- source_word: ኀሐ (leitura corrompida associada a luto)
  choice: Luto
  rationale: A forma manuscrita é entendida no contexto do topônimo tradicional como referência a pranto ou luto, preservando o elemento semântico ausente numa tradução apenas como “Carvalho de Débora”.
- source_word: አብርሃም፡ አቡከ
  choice: Abraão, seu pai
  rationale: Traduz diretamente a expressão ge'ez, sem harmonizá-la para “pai de seu pai”.
- source_word: በኵሉ፡ ዓለማት
  choice: ao longo de todas as gerações
  rationale: A expressão temporal abrange todos os tempos ou eras; “gerações” comunica naturalmente a continuidade relativa aos descendentes, sem limitar a extensão.
theological_decisions:
- issue: Identidade do interlocutor chamado “Senhor”
  choice: Manter “Senhor” na fala de Jacó sem identificar explicitamente o interlocutor como Deus
  alternative: Substituir por “meu senhor” ou declarar que Jacó fala diretamente com Deus
  rationale: O relato apresenta um anjo, mas a forma de tratamento admite mais de uma compreensão; a tradução preserva essa tensão narrativa.
- issue: Santuário eterno e lugar escolhido
  choice: Traduzir literalmente a proibição sem identificar o local ou explicar sua função teológica
  alternative: Associar explicitamente o lugar a Betel, Jerusalém ou a uma tradição cultual específica
  rationale: O texto não faz essa identificação dentro da unidade fornecida, e a tradução não deve impor uma solução confessional ou histórica.
- issue: Destino de Jacó no Egito e sepultamento na terra
  choice: Preservar as duas afirmações em sequência
  alternative: Reformular para eliminar uma possível tensão entre morrer no Egito e ser sepultado na terra ancestral
  rationale: O texto distingue claramente o lugar da morte do lugar do sepultamento; a tensão é intencional e inteligível.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. O discurso direto foi disposto em parágrafos para tornar a longa unidade narrativa mais clara. Evitaram-se arcaísmos, harmonizações bíblicas não exigidas pelo ge'ez e explicações denominacionais. Os topônimos descritivos foram traduzidos para comunicar seu sentido.
