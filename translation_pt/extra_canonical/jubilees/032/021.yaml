revisions:
- from: 'E ele subiu ao céu. Numa visão durante a noite, Jacó viu um anjo que descia do céu com tábuas nas mãos. O anjo as entregou a Jacó, que as leu e ficou sabendo de tudo o que nelas estava escrito a respeito do que aconteceria com ele e com seus filhos ao longo de todas as gerações. O anjo lhe mostrou tudo o que estava escrito nas tábuas e disse:


    — Não construa este lugar nem faça dele um santuário eterno. Não permaneça aqui, pois este não é o lugar. Vá à casa de Abraão, seu pai, e fique com Isaque, seu pai, até o dia da morte dele. Você morrerá em paz no Egito, mas será sepultado com honra nesta terra, no túmulo de seus pais, junto de Abraão e Isaque. Não tenha medo, pois tudo acontecerá conforme você viu e leu. Escreva também tudo conforme você viu e leu.


    Jacó perguntou:


    — Senhor, como me lembrarei de tudo o que li e vi?


    Ele lhe respondeu:


    — Eu farei você se lembrar de tudo.


    Então o anjo subiu e se afastou dele. Jacó despertou do sono e se lembrou de tudo o que havia lido e visto; depois escreveu todos os acontecimentos que havia lido e visto.


    Ali ele celebrou mais um dia e nele ofereceu sacrifícios conforme tudo o que se sacrificava nos dias anteriores. Chamou esse dia de Acréscimo,[a] porque havia sido acrescentado; os dias anteriores, porém, ele chamou de Festa. Assim lhe foi mostrado que deveria ser feito, e isso está escrito nas tábuas celestiais: foi-lhe revelado que deveria celebrar esse dia e acrescentá-lo aos sete dias da festa. Seu nome foi chamado Acréscimo porque ele é acrescentado aos dias da festa, de acordo com o número dos dias do ano.


    Na noite do décimo terceiro dia daquele mês, morreu Débora, a ama de Rebeca. Eles a sepultaram abaixo da cidade, debaixo do carvalho junto ao ribeiro. Chamaram aquele lugar de Ribeiro de Débora e ao carvalho, Carvalho do Luto de Débora.[b]


    Rebeca partiu e voltou para sua casa, para junto de Isaque, pai de Jacó. Por meio dela, Jacó enviou carneiros e ovelhas para a casa de seu pai. Ele lhe disse: “Iremos a todo lugar; aonde você for, irei com você”.[c]


    Jacó bendisse o Deus de Isaque, seu pai, e o Deus de Abraão, pai de seu pai. Depois se levantou, fez suas mulheres e seus filhos montarem, levou todos os seus bens, atravessou o rio e chegou ao seu destino.'
