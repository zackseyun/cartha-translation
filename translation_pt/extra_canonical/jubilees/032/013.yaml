base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/013.yaml
  text: Let us not give our daughter to a man who has a foreskin, for that is a reproach to us. And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.
translation:
  language: pt
  text: Não demos nossa filha a um homem incircunciso[a], pois isso é uma desonra para nós. É também uma desonra para Israel — para os que dão e para os que tomam dentre as filhas das nações —, pois isso é impuro.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “um homem que tem prepúcio”.
    reason: Registra a imagem anatômica explícita do original por trás da tradução idiomática “incircunciso”.
lexical_decisions:
- source_word: ብእሲ፡ ዘቦ፡ ቍልፈተ
  choice: homem incircunciso
  rationale: A expressão diz literalmente “homem que tem prepúcio”. “Incircunciso” comunica o sentido de modo natural e preciso em português, enquanto a nota preserva a forma concreta do original.
- source_word: ጽእለት
  choice: desonra
  rationale: Expressa censura, vergonha ou opróbrio público; “desonra” é corrente, digna e adequada nas duas ocorrências.
- source_word: አዋልደ፡ አሕዛብ
  choice: filhas das nações
  rationale: Mantém a formulação coletiva do texto e evita restringir indevidamente አሕዛብ a uma etnia ou categoria religiosa específica.
- source_word: ርኩስ
  choice: impuro
  rationale: Preserva a linguagem de impureza do original sem explicá-la como meramente ritual, moral ou social.
theological_decisions:
- issue: Natureza da impureza mencionada no fim do versículo
  choice: “isso é impuro”
  alternative: “ele é impuro” ou “elas são impuras”
  rationale: O referente exato não deve ser definido além do que o texto permite. “Isso” conserva a possibilidade de a afirmação abranger a união ou prática descrita, sem declarar que as mulheres estrangeiras sejam pessoalmente impuras.
- issue: Sentido de “nações”
  choice: manter “nações”
  alternative: “gentios” ou “povos pagãos”
  rationale: “Nações” preserva o valor amplo do termo e não acrescenta uma caracterização religiosa ausente da expressão.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. A construção paralela “para os que dão e para os que tomam” foi mantida para refletir a concisão e a tensão do original; os travessões tornam sua relação com “Israel” legível sem acrescentar objetos não expressos.
