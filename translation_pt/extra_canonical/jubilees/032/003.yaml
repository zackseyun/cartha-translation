base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/003.yaml
  text: And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons starting from him, and Levi came up in the portion of the LORD, and his father clothed him.
translation:
  language: pt
  text: Naqueles dias, Raquel ficou grávida de Benjamim. Jacó contou seus filhos começando por ele[a], e Levi saiu na porção do SENHOR, e seu pai o vestiu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “a partir dele”; o referente mais provável é Benjamim.
    reason: A expressão ge'ez é concisa e pronominal; a tradução explicita sua relação provável com Benjamim, preservando em nota a forma literal.
lexical_decisions:
- source_word: ፀንሰት፡ ይእቲ፡ ራሔል፡ ብንያምሃ
  choice: Raquel ficou grávida de Benjamim
  rationale: Expressa em português corrente a concepção de Benjamim, mantendo o conteúdo narrativo do ge'ez.
- source_word: እምኔሁ
  choice: começando por ele
  rationale: Preserva o detalhe de que a contagem parte de Benjamim, necessário para compreender como Levi resulta como a décima parte, sem reproduzir uma construção portuguesa obscura como “a partir dentre ele”.
- source_word: ወዐርገ፡ ወወረደ፡ ሌዊ፡ በመክፈሊተ፡ እግዚአብሔር
  choice: e Levi saiu como a porção do SENHOR
  rationale: “Saiu” comunica naturalmente o resultado da contagem ou seleção, enquanto “como a porção do SENHOR” conserva a linguagem de repartição e consagração.
- source_word: ወአልበሱ፡ አቡሁ
  choice: então seu pai o vestiu
  rationale: Mantém a ação concreta e a referência paterna do texto, sem antecipar explicações sacerdotais do contexto posterior.
theological_decisions:
- issue: A escolha de Levi como porção do SENHOR
  choice: Levi saiu como a porção do SENHOR
  alternative: Levi coube ao SENHOR como sua porção
  rationale: A formulação escolhida preserva a imagem de um resultado obtido pela contagem, sem definir além do texto o mecanismo exato como sorteio, dízimo ou ordenação.
- issue: Referente de “ele” em “começando por ele”
  choice: Benjamim como referente provável, com nota sobre a forma literal
  alternative: Omitir a expressão ou deixá-la sem referente discernível
  rationale: O contexto imediato favorece Benjamim e esse detalhe explica a posição de Levi na contagem; a nota reconhece a concisão pronominal do original sem apagar sua informação.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. “SENHOR” representa o título divino; a pontuação organiza a longa coordenação do ge'ez sem alterar a sequência dos acontecimentos.
