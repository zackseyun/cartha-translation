base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/009.yaml
  text: This is a testimony of joy like this joy. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits.
translation:
  language: pt
  text: Este é um testemunho de alegria, como esta alegria.[a] Antigamente, chamavam a terra de Gileade de terra dos refains, porque era a terra dos refains; e ali nasceram refains, gigantes cuja altura era de dez côvados,[b] de nove côvados, de oito côvados e até de sete côvados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Uma alegria de testemunho como esta alegria.”'
    reason: A relação sintática entre “alegria” e “testemunho” na expressão etíope é ambígua.
  - marker: b
    text: A primeira medida é entendida como “dez côvados”; a forma transmitida no texto fornecido parece ter sofrido confusão gráfica com o numeral nove.
    reason: A sequência completa esperada e atestada pela revisão textual é dez, nove, oito e sete; a grafia inicial pode refletir erro de leitura ou OCR.
lexical_decisions:
- source_word: ፍሥሐተ
  choice: alegria
  rationale: O termo ocorre duas vezes na frase inicial e denota alegria; a repetição foi preservada, sem confundi-lo com ስምዕ, “testemunho”.
- source_word: ስምዕ
  choice: testemunho
  rationale: Equivalente direto e natural em português, mantendo a formulação nominal e sua possível tensão com “alegria”.
- source_word: ምድረ፡ ገለአድ
  choice: terra de Gileade
  rationale: Forma bíblica portuguesa amplamente reconhecível para o topônimo.
- source_word: ረፋኤም / ራፋኤም
  choice: refains
  rationale: Emprega a forma bíblica portuguesa tradicional do nome do povo, em vez de confundi-lo com o nome próprio Rafael.
- source_word: ረዐይት
  choice: gigantes
  rationale: No contexto dos refains e das alturas enumeradas, “gigantes” comunica naturalmente a referência a homens de tamanho extraordinário.
- source_word: በአመት
  choice: côvados
  rationale: A sequência descreve medidas de altura; segue-se a compreensão textual adotada na tradição de edição e na camada auditada.
theological_decisions:
- issue: Relação entre “alegria” e “testemunho” na cláusula inicial
  choice: “um testemunho de alegria, como esta alegria”
  alternative: “uma alegria de testemunho como esta alegria”
  rationale: A construção etíope é compacta e pouco transparente. A redação principal preserva os dois substantivos e a repetição de “alegria”, sem transformar a expressão em uma ordenança nem acrescentar “para sempre”; a alternativa registra outra relação sintática possível.
- issue: Identificação dos refains
  choice: Manter “refains” como designação do povo e qualificá-los como “gigantes”
  alternative: Traduzir o etnônimo como “gigantes” em todas as ocorrências
  rationale: Conservar o etnônimo evita apagar a referência geográfica e genealógica, enquanto “gigantes” transmite a descrição associada à sua estatura.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e vocabulário bíblico reconhecível. Preservam-se a repetição enfática de “alegria”, o etnônimo “refains” e a enumeração descendente das alturas.
