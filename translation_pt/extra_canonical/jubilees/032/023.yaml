  text: in joy. And Jacob arranged his two sons[23], one on his right hand and one on his left, and it was counted to him as righteousness. And Jacob told everything to his father in the night, how the LORD had dealt with him in great mercy and how he had prospered all his way and protected him from all evil. And Isaac blessed the God of his father Abraham, who had not withheld mercy and righteousness from the son of his servant Isaac. And in the morning Jacob told his father Isaac the prayer that he had prayed to the LORD, and the vision that he had seen, and how he had built an altar, and all that was prepared for sacrifice to offer before the LORD according to how he had prayed, and how he had come to carry him on a donkey. And Isaac said to Jacob, "My son, I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred and sixty-five years old today. I am no longer able to travel; set your mother on a beast and let her go with
    you. And I know, my son, that you came on my account, and this day is blessed, on which you have seen me alive and I also have seen you, my son. Prosper and perform the prayer that you have prayed, and do not delay your prayer, for it is sought out, and now quickly do it, and may he who has done everything grant success to the prayer for which you have prayed." And he said to Rebekah, "Go with Jacob your son." And Rebekah went with Jacob her son, and Deborah was with her, and they came to Bethel. And Jacob remembered the prayer with which his father had blessed him, and his two sons, Levi and Judah, and he rejoiced and blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be raised for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them." And he stayed that night in Bethel, and Levi dreamed
    that they had appointed and ordained him priest of the Most High God, him and his sons forever. And he awoke from his sleep and blessed the LORD. And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth from everything that had come with him, from people to cattle, from gold to all possessions, and he took and tithed from everything. And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons, and Levi came up in the LORD’s portion, and his father clothed him with priestly garments and filled his hands. And on the fifteenth of this month he brought to the altar as sacrifices from the cattle fourteen oxen and eighteen rams and forty-nine sheep and seven lambs and twenty-one kids.
translation:
  language: pt
  text: 'com alegria. Jacó pôs seus dois filhos[a], um à sua direita e outro à sua esquerda, e isso lhe foi contado como justiça. Durante a noite, Jacó contou tudo a seu pai: como o SENHOR o havia tratado com grande misericórdia, como havia feito prosperar todo o seu caminho e como o havia protegido de todo mal. Então Isaque bendisse o Deus de seu pai Abraão, que não havia negado misericórdia e justiça ao filho de seu servo Isaque.


    Pela manhã, Jacó contou a seu pai Isaque a oração que havia feito ao SENHOR, a visão que havia tido, como havia construído um altar e tudo o que estava preparado para oferecer um sacrifício diante do SENHOR, conforme havia orado, e como tinha vindo para transportá-lo num jumento.[b] Isaque disse a Jacó:


    — Meu filho, não posso ir com você, pois estou velho e não consigo suportar a viagem. Vá em paz, meu filho, porque hoje tenho cento e sessenta e cinco anos. Já não posso viajar. Ponha sua mãe sobre um animal e leve-a com você. Sei, meu filho, que você veio por minha causa. Bendito seja este dia, no qual você me viu vivo, e eu também vi você, meu filho. Prospere e cumpra aquilo pelo que você orou. Não adie o cumprimento de sua oração, pois ela está sendo atendida. Agora, apresse-se em cumpri-la, e que aquele que fez todas as coisas faça prosperar tudo pelo que você orou.


    Então Isaque disse a Rebeca:


    — Vá com seu filho Jacó.


    Rebeca foi com seu filho Jacó, e Débora foi com ela; e chegaram a Betel. Jacó se lembrou da oração com que seu pai havia abençoado a ele e a seus dois filhos, Levi e Judá. Alegrou-se e bendisse o Deus de seus pais, Abraão e Isaque. E disse:


    — Agora sei que há para mim uma esperança eterna, e também para meus filhos, diante do Deus de todos. Assim está determinado a respeito dos dois, e isso será estabelecido em favor deles como testemunho eterno nas tábuas celestiais, conforme Isaque os abençoou.


    Jacó passou aquela noite em Betel, e Levi sonhou que o haviam nomeado e constituído sacerdote do Deus Altíssimo, ele e seus filhos, para sempre. Ao despertar do sono, bendisse o SENHOR.


    Na manhã do décimo quarto dia daquele mês, Jacó se levantou cedo e deu o dízimo de tudo o que havia vindo com ele: desde as pessoas até os animais, desde o ouro até todos os bens. Separou a décima parte de tudo. Naqueles dias, Raquel ficou grávida de Benjamim. Jacó contou seus filhos, e Levi coube como porção do SENHOR.[c] Seu pai o vestiu com as roupas sacerdotais e lhe encheu as mãos.


    No décimo quinto dia daquele mês, Jacó levou ao altar, como sacrifícios, catorze bois, dezoito carneiros, quarenta e nove ovelhas, sete cordeiros e vinte e um cabritos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A linha-fonte repete aqui material do início do capítulo e depois prossegue até a narrativa da gravidez de Raquel. A tradução conserva essa seção repetida como parte do texto transmitido.
    reason: segmentation_note
  - marker: b
    text: Isto é, Jacó havia vindo para transportar Isaque num jumento; o pronome do texto-fonte se refere a Isaque.
    reason: source_clarification
  - marker: c
    text: A expressão apresenta Levi como a porção do SENHOR no contexto da contagem e da separação do dízimo; o modo exato dessa designação não é explicitado.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተብቈ፡ ሎቱ፡ ጽድቀ
  choice: isso lhe foi contado como justiça
  rationale: Mantém a formulação forense e teológica do ge'ez sem explicar a razão pela qual o ato é contado como justiça.
- source_word: ይጽዐኖ፡ ዲበ፡ አድግ
  choice: para levá-lo montado num jumento
  rationale: 'Preserva o sufixo de objeto masculino em ይጽዐኖ: Jacó veio para transportar Isaque, não simplesmente montado ele próprio.'
- source_word: ጻዕና፡ ለአምካ፡ ወትሖር፡ ምስሌከ
  choice: Ponha sua mãe sobre um animal e leve-a com você
  rationale: Traduz a instrução explícita de Isaque para que Rebeca acompanhe Jacó montada em um animal.
- source_word: ይሥመር
  choice: faça prosperar
  rationale: Expressa êxito ou bom resultado sem restringir indevidamente o sentido ao campo material.
- source_word: በመክፈሊተ፡ እግዚአብሔር
  choice: por sorte como porção do SENHOR
  rationale: O contexto descreve a seleção cultual de Levi; a tradução conserva tanto a ideia de lote/sorte quanto a de porção pertencente ao SENHOR.
- source_word: መልአ፡ እደዊሁ
  choice: lhe encheu as mãos
  rationale: Mantém o idioma técnico de investidura sacerdotal em vez de substituí-lo por uma interpretação denominacional.
theological_decisions:
- issue: O ato de Jacó contado como justiça
  choice: isso lhe foi contado como justiça
  alternative: isso foi considerado uma ação justa
  rationale: A forma escolhida preserva a linguagem teológica tradicional e a possível tensão sobre a natureza exata do ato meritório.
- issue: Sacerdócio perpétuo de Levi e seus filhos
  choice: sacerdote do Deus Altíssimo, ele e seus filhos, para sempre
  alternative: sacerdote... por todas as gerações
  rationale: Segue diretamente a afirmação temporal forte do texto sem harmonizá-la com sistemas teológicos posteriores.
- issue: Esperança eterna de Jacó e de seus filhos
  choice: há para mim uma esperança eterna, e também para meus filhos
  alternative: tenho esperança eterna, juntamente com meus filhos
  rationale: Conserva o alcance coletivo e escatológico da declaração sem definir em que consiste a esperança.
- issue: Tábuas celestiais
  choice: tábuas celestiais
  alternative: registros do céu
  rationale: Mantém a imagem cosmológica própria de Jubileus, sem desmitologizá-la.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. Empregou-se “você” no diálogo familiar, “SENHOR” para o nome divino conforme a convenção editorial e vocabulário cultual reconhecível. Preservaram-se expressões técnicas ou imagéticas do texto, como “contado como justiça”, “tábuas celestiais” e “encheu as mãos”, com nota apenas onde a compreensão exigia esclarecimento.
