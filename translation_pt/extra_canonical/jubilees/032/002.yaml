base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/002.yaml
  text: And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth of everything that had come with him, from people to cattle, from gold to all possessions; and he brought it and gave a tenth of everything.
translation:
  language: pt
  text: E Jacó levantou-se de madrugada, no décimo quarto dia daquele mês, e deu a décima parte de tudo o que viera com ele, desde pessoas até animais, desde ouro até todos os bens; trouxe-a e deu a décima parte de tudo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐሠረ
  choice: separou a décima parte / deu a décima parte
  rationale: O verbo ligado ao numeral dez expressa a ação de dizimar. A formulação explícita em português é clara e preserva a repetição do texto.
- source_word: እምሰብእ፡ እስከ፡ እንስሳ
  choice: desde as pessoas até os animais
  rationale: Reproduz a construção abrangente 'de... até...' sem restringir o sentido de 'pessoas' a servos ou familiares.
- source_word: እምወርቅ፡ እስከ፡ ኵሉ፡ ንዋይ
  choice: desde o ouro até todos os bens
  rationale: Mantém os extremos da enumeração e traduz ንዋይ de modo amplo como bens ou posses.
- source_word: ወአብአ
  choice: então a trouxe
  rationale: A forma causativa de ቦአ, 'entrar', significa 'fazer entrar', portanto 'trazer' ou 'apresentar', e não 'tomar'. O pronome retoma naturalmente 'a décima parte'.
theological_decisions:
- issue: Natureza da décima parte dada por Jacó
  choice: Linguagem concreta de separar, trazer e dar a décima parte
  alternative: Empregar o termo técnico 'dizimar' ou explicitar uma instituição posterior do dízimo
  rationale: A tradução conserva as ações descritas sem importar definições confessionais ou legislação posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conservou-se a repetição enfática de 'décima parte de tudo' e a enumeração inclusiva do original.
