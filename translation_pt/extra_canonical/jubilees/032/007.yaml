base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/007.yaml
  text: 'Therefore thus it is ordained in Israel concerning the defilement of an Israelite virgin: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman'
translation:
  language: pt
  text: Portanto, assim é ordenado em Israel a respeito da profanação de uma virgem israelita:[a] se houver em Israel um homem que queira dar sua filha, ou mesmo sua irmã, a qualquer homem da descendência das nações, certamente morrerá, e o apedrejarão com pedras, porque cometeu uma desonra em Israel; e a mulher...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a respeito de uma virgem israelita que foi profanada».'
    reason: A construção ge’ez pode ser entendida como referência nominal à profanação ou como descrição da virgem profanada.
lexical_decisions:
- source_word: በአርኵሰ፡ ድንግል፡ እስራኤላዊት
  choice: a respeito da profanação de uma virgem israelita
  rationale: Conserva a construção nominal e traduz explicitamente ድንግል como «virgem» e እስራኤላዊት como «israelita», sem transformar esta última em «filha de Israel».
- source_word: ዘእምዘርአ፡ አሕዛብ
  choice: da descendência das nações
  rationale: Mantém a imagem de «semente/descendência» e o plural «nações», evitando especificar uma identidade étnica além do texto.
- source_word: ሞተ፡ ለይሙት
  choice: certamente morrerá
  rationale: Reproduz em português natural a construção enfática de morte.
- source_word: ወበእብን፡ ይውግሮዎ
  choice: e o apedrejarão
  rationale: Expressa naturalmente a ação de lançar pedras contra alguém; a menção explícita às pedras seria redundante em português.
- source_word: ኀፍረተ
  choice: desonra
  rationale: Comunica vergonha ou ignomínia pública no contexto de Israel sem acrescentar uma categoria jurídica ou sexual mais específica.
theological_decisions:
- issue: Sentido de «profanação» na oração inicial
  choice: Formulação nominal no texto, com alternativa em nota
  alternative: «a respeito de uma virgem israelita que foi profanada»
  rationale: A sintaxe permite uma leitura nominal, mas a relação entre a profanação e a virgem pode ser entendida como estado ou ação sofrida; a nota preserva essa ambiguidade.
- issue: Final incompleto do versículo fornecido
  choice: «e também a mulher...»
  alternative: Completar a sentença com material do versículo seguinte
  rationale: O testemunho apresentado termina em ወለብእሲትሂ, «e também a mulher», sem concluir a oração. As reticências sinalizam a ruptura sem importar texto não fornecido.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário internacional. Preservou-se o caráter jurídico do enunciado e sinalizou-se o término abrupto do fragmento.
