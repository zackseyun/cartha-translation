base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/008.yaml
  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: pt
  text: Queimem-na com fogo, porque ela profanou o nome da casa de seu pai; e ela será eliminada de Israel. Que não se encontre em Israel prostituição nem impureza durante todos os dias das gerações da terra, pois Israel é santo para o SENHOR. Todo aquele que o profanar certamente morrerá; apedrejem-no.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያውዕይዋ፡ በእሳት
  choice: Queimem-na no fogo
  rationale: O verbo traz objeto feminino explícito e a expressão instrumental «com/no fogo». O imperativo português comunica naturalmente a determinação legal do contexto.
- source_word: አርኰሰት
  choice: profanou
  rationale: O verbo expressa tornar impuro ou profanar; «profanou» ajusta-se ao objeto «o nome da casa de seu pai» e preserva o teor religioso e familiar.
- source_word: ትሠረው፡ እምእስራኤል
  choice: será eliminada de Israel
  rationale: Reproduz a ideia de ser removida ou extirpada da comunidade sem especificar além do texto o mecanismo dessa eliminação.
- source_word: ዘማ፡ ወርኵስ
  choice: prostituição nem impureza
  rationale: 'Mantém os dois conceitos coordenados: imoralidade sexual/prostituição e impureza. «Prostituição» conserva a formulação concreta e forte do termo.'
- source_word: ኵሎ፡ መዋዕለ፡ ትውልደ፡ ምድር
  choice: durante todos os dias das gerações da terra
  rationale: Tradução próxima da expressão etíope, preservando sua formulação temporal ampla e incomum em vez de a normalizar como «para sempre».
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር
  choice: Israel é santo para o SENHOR
  rationale: Conserva a santidade consagrada de Israel em relação ao nome divino; «SENHOR» segue a convenção editorial portuguesa para o nome divino.
- source_word: ሞተ፡ ለይሙት
  choice: certamente morrerá
  rationale: A construção cognata intensifica a certeza da pena; a fórmula portuguesa mantém essa ênfase sem literalismo áspero.
- source_word: በእብን፡ ይውግርዎ
  choice: apedrejem-no
  rationale: Expressa de modo natural a ação indicada literalmente por lançar pedras contra ele.
theological_decisions:
- issue: Referente do pronome em «todo aquele que o profanar»
  choice: Manter o pronome masculino «o», com referente mais imediato em «Israel»
  alternative: Explicitar «todo aquele que profanar Israel» ou entender o referente como a santidade/comunidade
  rationale: O texto apresenta um objeto pronominal cuja referência pode ser inferida de Israel no contexto. A tradução evita acrescentar uma interpretação mais específica do que a sintaxe permite.
- issue: Sentido da eliminação de Israel
  choice: «será eliminada de Israel» sem definir se equivale diretamente à execução
  alternative: «será extirpada de Israel» ou «será morta e retirada de Israel»
  rationale: Embora a sequência mencione morte e apedrejamento, o verbo de remoção não deve ser silenciosamente fundido com uma formulação penal mais explícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A formulação jurídica foi vertida por imperativos naturais no plural. Preservou-se a repetição conceitual e a tensão penal do original, evitando arcaísmos desnecessários e explicações denominacionais.
