base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/017.yaml
  text: 'every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were given into the hand of the two sons of Jacob, and they killed them in agony, and it was reckoned to them as righteousness, and it was written down for them as righteousness."'
translation:
  language: pt
  text: 'todo homem e toda mulher em Israel que profanar o seu santuário. Por isso, ordenei a você: “Faça este testemunho ser ouvido em Israel: veja o que aconteceu a Siquém e a seus filhos, como foram entregues nas mãos dos dois filhos de Jacó, e estes os mataram em agonia. Isso lhes foi considerado justiça e foi registrado para eles como justiça.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘያረኵስ፡ መቅደሶ
  choice: que profanar o seu santuário
  rationale: Reproduz a oração relativa e mantém o possessivo masculino singular do texto, sem explicitar à força se o santuário é de Deus ou do homem mencionado.
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  choice: Faça Israel ouvir este testemunho
  rationale: Preserva tanto o valor causativo de ‘fazer ouvir’ quanto o peso testemunhal do substantivo cognato, em português natural.
- source_word: ተውህበት፡ ውስተ፡ እዴ፡ ክልኤሆሙ፡ ደቂቀ፡ ያዕቆብ
  choice: foram entregues nas mãos dos dois filhos de Jacó
  rationale: Verte diretamente a ideia de serem dados ou entregues ao poder dos dois filhos; o plural idiomático ‘nas mãos’ é mais corrente em português.
- source_word: በፃዕር
  choice: em meio ao sofrimento
  rationale: ፃዕር indica dor, aflição ou sofrimento, não ‘espada’. A formulação conserva a concisão e alguma ambiguidade da expressão etíope.
- source_word: ጽድቀ
  choice: justiça
  rationale: Mantém o termo teológica e juridicamente carregado e também sua repetição no fim do versículo.
theological_decisions:
- issue: A morte dos siquemitas é considerada justiça aos filhos de Jacó
  choice: Isso lhes foi considerado justiça e registrado em favor deles como justiça
  alternative: Isso lhes foi atribuído como um ato justo
  rationale: Mantém a afirmação e a repetição enfática do texto sem suavizar sua tensão moral nem acrescentar uma justificativa interpretativa.
- issue: Referente do possessivo em ‘seu santuário’
  choice: manter ‘seu’ sem identificar explicitamente o possuidor
  alternative: ‘o santuário de Deus’
  rationale: O original traz possessivo masculino singular; explicitar ‘de Deus’ resolveria uma ambiguidade que o versículo, isoladamente, não elimina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservam-se a abertura fragmentária do versículo, que continua a frase anterior, a força jurídica de ‘testemunho’ e ‘justiça’, e a tensão moral da declaração final.
