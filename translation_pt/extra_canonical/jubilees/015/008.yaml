base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/008.yaml
  text: And I will make you very great, and I will make you into nations, and kings shall come out from you. And I will establish my covenant between me and you and between your seed after you throughout their generations, as an everlasting ordinance, so that I may be God to you and to your seed after you.
translation:
  language: pt
  text: Eu o engrandecerei muito; farei de você nações, e reis sairão de você. Estabelecerei a minha aliança entre mim e você e entre mim e a sua descendência depois de você, por todas as gerações deles, como uma ordenança eterna, para que eu seja o seu Deus e o Deus da sua descendência depois de você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዐብየከ፡ ጥቀ
  choice: Eu o tornarei extremamente numeroso
  rationale: Expressa a ideia de engrandecer ou multiplicar em grau muito elevado, com sentido natural no contexto da promessa de descendência.
- source_word: አሕዛብ
  choice: nações
  rationale: Preserva o plural e o alcance coletivo do termo, sem restringi-lo a um único povo.
- source_word: ዘርእከ
  choice: sua descendência
  rationale: Traduz o substantivo coletivo 'semente' de modo claro em português atual, mantendo a referência aos descendentes como conjunto.
- source_word: ኪዳንየ
  choice: a minha aliança
  rationale: É o equivalente tradicional e semanticamente adequado para um vínculo solene estabelecido por Deus.
- source_word: ሥርዓት፡ ዘለዓለም
  choice: uma ordenança eterna
  rationale: Mantém a força normativa de ሥርዓት e a duração permanente indicada por ዘለዓለም.
theological_decisions:
- issue: Formulação do estabelecimento da aliança
  choice: Estabelecerei a minha aliança
  alternative: Darei a minha aliança
  rationale: Embora o verbo etíope tenha sentido básico de 'dar', nessa construção idiomática ele comunica a instituição ou confirmação da aliança; 'estabelecerei' transmite isso naturalmente sem acrescentar conteúdo confessional.
- issue: Finalidade da aliança
  choice: para que eu seja o Deus de você e da sua descendência
  alternative: para ser Deus para você e para a sua descendência
  rationale: Preserva a oração final e a relação pactual expressa no texto, sem explicar além do que a fonte afirma.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. Emprega 'você' para comunicação ampla e evita arcaísmos; mantém a repetição solene de 'depois de você' e a linguagem pactual do original.
