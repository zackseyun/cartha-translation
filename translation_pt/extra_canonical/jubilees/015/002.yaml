base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/002.yaml
  text: 'And he offered a new sacrifice on the altar, the firstfruits of the produce, to the Lord: a bull and a goat and a sheep on the altar as a pleasing aroma to the Lord; and their grain offering and their drink offering he offered on the altar with incense.'
translation:
  language: pt
  text: 'E ele ofereceu ao Senhor um novo sacrifício sobre o altar, as primícias da colheita: um touro, um cabrito e uma ovelha sobre o altar, como aroma agradável ao Senhor. Também ofereceu sobre o altar, com incenso, suas ofertas de cereais e suas libações.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ (ʾaʿraga)
  choice: ofereceu
  rationale: Embora o verbo tenha o sentido básico de «fazer subir», no contexto cultual significa fazer subir uma oferta sobre o altar, isto é, oferecê-la.
- source_word: መሥዋዕተ ሐዲስ (maśwāʿta ḥādis)
  choice: um novo sacrifício
  rationale: Reproduz diretamente a expressão do texto etíope sem especificar um tipo de sacrifício que a fonte não explicita.
- source_word: ቀዳሜ እክል (qadāme ʾəkl)
  choice: as primícias da colheita
  rationale: A expressão combina a ideia de primeiro produto com cereal ou alimento; «primícias da colheita» comunica naturalmente o sentido agrícola e cultual.
- source_word: ላህመ (lāḥma)
  choice: um touro
  rationale: O termo designa bovino macho; «touro» é a equivalência portuguesa mais direta neste contexto sacrificial.
- source_word: በሐኮ (baḥāko)
  choice: um cabrito
  rationale: Designa um filhote de cabra, não um carneiro. «Cabrito» preserva a distinção lexical em relação à ovelha mencionada em seguida.
- source_word: በግዐ (bagʿa)
  choice: uma ovelha
  rationale: Termo genérico do gado ovino; o texto não exige que seja entendido especificamente como carneiro.
- source_word: ጽንሓሐ ለእግዚአብሔር (ṣənḥāḥa la-ʾəgziʾabəḥer)
  choice: como aroma agradável ao Senhor
  rationale: A expressão cultual descreve a oferta como cheiro ou aroma agradável, e não identifica aqui uma categoria independente de holocausto.
- source_word: መሥዋዕቶሙ (maśwāʿtomu)
  choice: as ofertas de cereal correspondentes
  rationale: No par com as ofertas derramadas, refere-se às ofertas que acompanham os animais; a formulação explicita em português o referente plural indicado pelo sufixo.
- source_word: ሞጻሕቶሙ (moṣāḥtomu)
  choice: as ofertas derramadas correspondentes
  rationale: Termo cultual para libações; «ofertas derramadas» é claro para leitores comuns e conserva a ação ritual.
- source_word: ስኂን (səḥin)
  choice: incenso
  rationale: A fonte permite o sentido amplo de substância aromática queimada; «incenso» evita restringi-la especificamente a olíbano.
theological_decisions:
- issue: Sentido da fórmula cultual ligada ao aroma
  choice: como aroma agradável ao Senhor
  alternative: como holocausto ao Senhor
  rationale: A formulação da fonte expressa o caráter agradável do aroma diante de Deus, sem nomear inequivocamente o sacrifício como holocausto.
- issue: Identidade do segundo animal
  choice: cabrito
  alternative: carneiro
  rationale: O vocábulo etíope በሐኮ indica cabrito ou animal caprino jovem; traduzi-lo como «carneiro» confundiria caprinos e ovinos.
translation_notes:
  register: Português moderno, claro e digno, com vocabulário cultual compreensível. A repetição de «sobre o altar» foi preservada por corresponder à estrutura enfática da fonte; a última oração foi reorganizada moderadamente para soar natural em português sem eliminar os elementos do original.
