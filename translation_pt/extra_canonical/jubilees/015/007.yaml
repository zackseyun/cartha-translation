  yaml_path: translation/extra_canonical/jubilees/015/007.yaml
  text: And your name shall no longer be called Abram, but from now and forever your name shall be Abraham, for I have made you the father of many nations.
translation:
  language: pt
  text: E seu nome não será mais Abrão; de agora em diante e para sempre, seu nome será Abraão, pois eu fiz de você pai de muitas nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይጼዋዕ
  choice: já não será chamado
  rationale: Reproduz a construção passiva negativa do ge'ez, em português natural e solene.
- source_word: አምይእዜ፡ ወእስከ፡ ለዓለም
  choice: de agora em diante e para sempre
  rationale: 'Conserva os dois elementos temporais: o início imediato da mudança e sua duração permanente.'
- source_word: አሕዛብ
  choice: nações
  rationale: Equivalente contextual de povos ou nações, adequado à fórmula que apresenta Abraão como pai de uma pluralidade de coletividades.
- source_word: ሤምኩከ
  choice: eu fiz de você
  rationale: Expressa a ação divina já declarada no texto, sem enfraquecê-la como mera promessa futura.
theological_decisions:
- issue: Valor temporal da nomeação de Abraão como pai de muitas nações
  choice: eu fiz de você
  alternative: eu farei de você
  rationale: O texto-fonte apresenta a nomeação como ato já efetuado; mantém-se essa tensão entre a declaração presente e seu cumprimento histórico futuro.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a solenidade da mudança de nome sem recorrer a arcaísmos.
