  text: And I will give to you and to your seed after you the land where you have resided as a foreigner, the land of Canaan, for an everlasting possession, and I will be their God.”
translation:
  language: pt
  text: E darei a você e à sua descendência depois de você a terra em que você viveu como estrangeiro, a terra de Canaã, como posse eterna; e serei o Deus deles.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: sua descendência
  rationale: Expressa naturalmente o sentido coletivo de “semente” no contexto de uma promessa feita às gerações futuras.
- source_word: ኀበ፡ ፈለስከ
  choice: em que viveu como estrangeiro
  rationale: Preserva a ideia de residência temporária como forasteiro, sem sugerir posse prévia da terra.
- source_word: ዘትኳን፡ ለዓለም
  choice: como posse eterna
  rationale: Traduz a construção que apresenta Canaã como propriedade permanente, mantendo a linguagem solene da promessa.
- source_word: አምላከ
  choice: o Deus deles
  rationale: Mantém o referente plural da descendência e a fórmula relacional da aliança.
theological_decisions:
- issue: Duração da posse prometida
  choice: eterna
  alternative: perpétua
  rationale: “Eterna” representa diretamente a expressão temporal do texto e preserva sua força, sem limitar ou explicar teologicamente o alcance da promessa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e ampla compreensão internacional. Conserva a mudança de “você” para “deles” presente na promessa.
