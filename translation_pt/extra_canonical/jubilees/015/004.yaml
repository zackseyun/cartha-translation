  text: And I will establish my covenant between me and you, and I will multiply you greatly.
translation:
  language: pt
  text: E estabelecerei a minha aliança entre mim e você, e o multiplicarei grandemente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ
  choice: estabelecerei
  rationale: Embora a forma tenha o sentido básico de “darei”, em contexto de aliança “estabelecerei” expressa com naturalidade o ato de instituir ou confirmar a aliança, sem sugerir que ela seja apenas um objeto entregue.
- source_word: ኪዳንየ
  choice: a minha aliança
  rationale: “Aliança” é o equivalente corrente e teologicamente neutro para o termo de pacto ou aliança.
- source_word: ማእከሌየ፡ ወማእከሌከ
  choice: entre mim e você
  rationale: Reproduz a relação bilateral indicada pela repetição de “entre”, em português natural.
- source_word: ወአአብቀከ፡ ጥቀ
  choice: e o multiplicarei grandemente
  rationale: Mantém o objeto masculino singular e a forte intensificação do original; “grandemente” preserva o tom bíblico sem ser obscuro.
theological_decisions:
- issue: Formulação da iniciativa divina na aliança
  choice: estabelecerei a minha aliança
  alternative: darei a minha aliança
  rationale: A escolha conserva a iniciativa divina e usa a formulação portuguesa mais idiomática para a instituição de uma aliança, sem acrescentar uma leitura denominacional.
- issue: Referente do pronome em “multiplicarei”
  choice: o multiplicarei
  alternative: multiplicarei você
  rationale: O original dirige-se a um interlocutor masculino singular. O pronome “o” preserva essa referência gramatical; o contexto mais amplo pode determinar se a multiplicação envolve também a descendência, mas isso não é explicitado aqui.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência bíblica. Emprega “você” para ampla legibilidade brasileira e “o multiplicarei grandemente” para conservar a forma enfática e o objeto singular do ge’ez.
