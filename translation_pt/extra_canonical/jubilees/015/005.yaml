  verdict: revise
  source_fidelity: A tradução reproduz com precisão a queda de Abrão, a fórmula enfática «Eis», a aliança e a promessa de paternidade de muitas nações. Contudo, o ge'ez apresentado diz simplesmente que Deus «falou e disse»; não explicita «com ele». Embora o ইংlês do histórico de auditoria traga «spoke with him», a revisão deve seguir prioritariamente a fonte original e não acrescentar esse complemento.
  naturalness: O português é claro, moderno e de registro adequado. «Caiu com o rosto por terra» é idiomático e digno; «Eis que» preserva bem a ênfase solene; «você» atende à legibilidade brasileira e continua compreensível internacionalmente.
  terminology: «Abrão», «Deus», «aliança» e «pai de muitas nações» são escolhas adequadas. «Aliança» é justificável neste contexto abraâmico para ሥርዓትየ e está em consonância com o registro textual, sem impor desenvolvimento teológico.
  issues:
