  yaml_path: translation/extra_canonical/jubilees/015/005.yaml
  text: And Abram fell on his face, and God spoke with him and said, “Behold, my covenant is with you, and you shall become the father of many nations.”
translation:
  language: pt
  text: 'Abrão caiu com o rosto por terra, e Deus falou, dizendo: “Eis que a minha aliança está com você, e você se tornará pai de muitas nações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወድቀ፡ አብራም፡ በገጹ፡
  choice: Abrão caiu com o rosto por terra
  rationale: Reproduz de modo natural a ação de prostrar-se com a face voltada ao chão, sem acrescentar uma motivação não expressa.
- source_word: ተናገሮ፡ እግዚአብሔር፡
  choice: Deus falou com ele
  rationale: Mantém a relação expressa pelo sufixo pronominal e segue a identificação divina do texto-fonte.
- source_word: ሥርዓትየ፡
  choice: a minha aliança
  rationale: Embora o termo possa ter sentidos como ordem, disposição ou estatuto, neste contexto de compromisso divino com Abrão, “aliança” comunica adequadamente o valor contextual e corresponde ao paralelo tradicional de Gênesis 17.
- source_word: ወትከውን፡
  choice: e você se tornará
  rationale: Expressa o valor futuro e resultativo do verbo, em vez de apenas um estado estático.
- source_word: አበ፡ ለብዙኃን፡ አሕዛብ፡
  choice: pai de muitas nações
  rationale: Tradução direta e idiomática, preservando a amplitude coletiva de “muitas nações”.
theological_decisions:
- issue: Natureza de ሥርዓትየ no discurso divino
  choice: minha aliança
  alternative: meu estatuto / minha disposição
  rationale: O contexto abraâmico indica um vínculo pactuado entre Deus e Abrão. “Aliança” preserva essa força teológica sem desenvolver implicações denominacionais.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. “Eis que” conserva a solenidade e a função enfática de ናሁ; “com o rosto por terra” soa mais natural do que o decalque “sobre o seu rosto”.
