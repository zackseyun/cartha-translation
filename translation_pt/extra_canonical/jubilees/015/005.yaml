    rationale: O texto traz «e Deus falou e disse», sem equivalente explícito de «com ele». A omissão em português preserva a concisão e evita ampliar o enunciado, ainda que o destinatário seja evidente pelo contexto.
  revised_text: 'Abrão caiu com o rosto por terra, e Deus falou, dizendo: “Eis que a minha aliança está com você, e você se tornará pai de muitas nações.”'
