lexical_decisions:
- source_word: ስርናይ
  choice: trigo
  rationale: O termo ge'ez designa especificamente o trigo, e não os cereais em sentido genérico.
- source_word: ገብረ፡ አብራም፡ በዓለ
  choice: Abrão celebrou a festa
  rationale: Embora ገብረ tenha o sentido básico de “fez”, neste contexto a expressão indica a realização ou celebração da festa.
- source_word: ቀዳሜ፡ ማእረር
  choice: primícias da colheita
  rationale: A expressão refere-se aos primeiros frutos ou primeiros produtos recolhidos da colheita; “primícias” preserva a linguagem cultual e continua compreensível em português.
- source_word: በመንፈቀ፡ ወርኀ
  choice: na metade do mês
  rationale: Tradução direta da indicação temporal, sem convertê-la interpretativamente em um dia específico.
