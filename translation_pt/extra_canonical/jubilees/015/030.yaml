base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/030.yaml
  text: For Ishmael and his sons and his brothers and Esau, the Lord did not bring near to himself, and he did not choose them, though they are the children of Abraham, because he knew them; and he chose Israel to be his people.
translation:
  language: pt
  text: Pois Ismael, seus filhos, seus irmãos e Esaú, o Senhor não os aproximou de si nem os escolheu, embora sejam filhos de Abraão, porque os conhecia; e escolheu Israel para ser seu povo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢያቅረቦ፡ ኀቤሁ
  choice: não os aproximou de si
  rationale: Preserva a imagem relacional do verbo causativo ‘fazer aproximar’ e do complemento ‘para junto dele’, sem reduzi-la simplesmente a ‘aceitou’.
- source_word: አእመሮሙ
  choice: os conhecia
  rationale: Traduz diretamente o verbo ‘conhecer’ no contexto, sem explicitar caráter, atos ou presciência além do que o texto declara.
- source_word: ኀረየ፡ ይኩንዎ፡ ሕዝበ
  choice: escolheu Israel para ser seu povo
  rationale: Expressa de modo natural a eleição de Israel com a finalidade de ser o povo de Deus.
theological_decisions:
- issue: Relação causal introduzida pelo segundo እስመ
  choice: porque os conhecia
  alternative: mas os conhecia
  rationale: O valor normal de እስመ é causal (‘porque/pois’); evita-se substituir essa relação por uma adversativa sem apoio lexical.
- issue: Sentido teológico de ‘conhecer’
  choice: manter simplesmente ‘os conhecia’
  alternative: ‘conhecia de antemão o caráter/as ações deles’
  rationale: A tradução conserva a formulação e a tensão do texto sem impor uma explicação interpretativa específica.
- issue: Conexão da oração final
  choice: mas escolheu Israel
  alternative: e escolheu Israel
  rationale: Embora o copulativo etíope permita ‘e’, ‘mas’ torna explícito em português o contraste já estabelecido entre os não escolhidos e Israel, sem alterar o conteúdo proposicional.
translation_notes:
  register: Português moderno, digno e acessível, com construção de ampla legibilidade brasileira. ‘Filhos de Abraão’ é mantido como expressão de descendência; a repetição pronominal foi ajustada à naturalidade do português.
