  yaml_path: translation/extra_canonical/jubilees/015/003.yaml
  text: And the Lord appeared to Abram and said to him, “I am God Shaddai; be pleasing before me, and be blameless.”
translation:
  language: pt
  text: 'E o Senhor apareceu a Abrão e lhe disse: “Eu sou Deus Shaddai[a]; sê agradável diante de mim e sê irrepreensível.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradicionalmente traduzido como “Deus Todo-Poderoso”; o sentido exato de Shaddai é incerto.
    reason: Esclarece o título divino preservado por transliteração e sua tradução tradicional.
lexical_decisions:
- source_word: አምላክ፡ ሰዳይ
  choice: Deus Shaddai
  rationale: Mantém o título divino transliterado, sem substituí-lo silenciosamente pela interpretação tradicional “Deus Todo-Poderoso”.
- source_word: አሥምር፡ ቅድሜየ
  choice: sê agradável diante de mim
  rationale: Traduz o sentido de agradar ou ser agradável presente no geês e evita harmonizar o texto com “anda diante de mim” de outra tradição textual de Gênesis 17:1.
- source_word: ኩን፡ ፍጹመ
  choice: sê irrepreensível
  rationale: Expressa no registro moral do contexto a ideia de integridade ou perfeição, com formulação natural em português.
theological_decisions:
- issue: Forma do título divino Shaddai
  choice: Preservar “Shaddai” no texto e explicar em nota a tradução tradicional.
  alternative: Traduzir diretamente como “Todo-Poderoso”.
  rationale: O título é semanticamente discutido; a transliteração conserva essa incerteza sem impor uma etimologia específica.
- issue: Relação com Gênesis 17:1
  choice: Traduzir o verbo geês como “sê agradável”, conforme o texto fonte de Jubileus.
  alternative: “Anda diante de mim”, conforme a forma hebraica tradicional de Gênesis.
  rationale: A tradução deve seguir a evidência original fornecida e não harmonizar Jubileus com outra tradição textual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A construção pouco habitual “sê agradável diante de mim” foi mantida deliberadamente por fidelidade ao verbo geês e para evitar harmonização com Gênesis 17:1 na tradição hebraica.
