  text: And you, command the children of Israel, and let them keep the sign of the covenant throughout their generations as an everlasting ordinance, and they shall not be uprooted from the land.
translation:
  language: pt
  text: E você, ordene aos filhos de Israel que guardem o sinal da aliança por todas as suas gerações, como estatuto eterno, e não serão arrancados da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ
  choice: E você
  rationale: Preserva a coordenação e a ênfase direta no destinatário, sem acrescentar o advérbio “agora”, ausente do texto ge'ez.
- source_word: ለውሉደ፡ እስራኤል
  choice: aos filhos de Israel
  rationale: Mantém a expressão tradicional e transparente para a descendência ou o povo de Israel.
- source_word: ትእምርተ፡ ኪዳን
  choice: o sinal da aliança
  rationale: Representa diretamente a construção nominal definida, sem introduzir o demonstrativo “desta”.
- source_word: ለትውልዶሙ
  choice: por todas as suas gerações
  rationale: Expressa a continuidade geracional de modo natural em português; “todas” explicita o alcance distributivo da fórmula.
- source_word: ለሥርዐት፡ ዘለዓለም
  choice: como estatuto eterno
  rationale: “Estatuto” comunica uma determinação normativa permanente e conserva o registro jurídico-religioso.
- source_word: ወኢይሠረዉ፡ እምነ፡ ምድር
  choice: para que não sejam arrancados da terra
  rationale: “Arrancados” preserva a imagem forte de remoção ou desenraizamento; a subordinação final traduz naturalmente a relação entre guardar a aliança e permanecer na terra.
theological_decisions:
- issue: Relação entre a guarda do sinal da aliança e a permanência na terra
  choice: para que não sejam arrancados da terra
  alternative: e não serão arrancados da terra
  rationale: A forma verbal ge'ez após a sequência imperativa pode ser entendida em sentido volitivo ou consecutivo. A formulação escolhida conserva a ligação normativa e teleológica sem transformar a frase numa promessa incondicional; a alternativa declarativa também é gramaticalmente possível.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário bíblico reconhecível. Emprega-se “você” para o singular direto, conforme a legibilidade brasileira ampla, e evita-se acrescentar elementos sem apoio no ge'ez.
