base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/032.yaml
  text: But over Israel he did not hand over or entrust any angel or spirit, for he alone is their ruler, and he will guard them and require them from the hand of his angels and from the hand of his spirits and from the hand of all his authorities, so that he may guard them and bless them, and that they may be his and he may be theirs from now and forever.
translation:
  language: pt
  text: Mas, quanto a Israel, ele não o entregou nem o confiou a nenhum anjo ou espírito[a], pois somente ele é o seu governante. Ele os guardará e os reclamará das mãos de seus anjos, de seus espíritos e de todas as suas autoridades[b], para guardá-los e abençoá-los, a fim de que eles sejam dele e ele seja deles, desde agora e para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não pôs nenhum anjo ou espírito sobre Israel».'
    reason: Registra a leitura funcional possível da construção, preservando a ambiguidade entre entregar Israel a seres espirituais e nomeá-los sobre ele.
  - marker: b
    text: 'Ou: «de todos os seus poderes».'
    reason: O termo pode designar autoridades, poderes ou agentes subordinados.
lexical_decisions:
- source_word: ኢያሰለመ፡ ወአመነሂ፡
  choice: não o entregou nem o confiou
  rationale: Preserva os dois verbos do ge'ez e a ideia de que Israel, diferentemente das demais nações, não foi entregue aos cuidados de seres espirituais.
- source_word: መኰንኖሙ
  choice: o seu governante
  rationale: Expressa a função de quem rege ou governa, sem restringir o termo ao sentido judicial de «juiz».
- source_word: የዐቅቦሙ
  choice: os guardará
  rationale: Mantém o sentido de proteger e vigiar e permite conservar a repetição posterior do mesmo campo verbal.
- source_word: ይትኀሠሦሙ፡ እምእዴ
  choice: os reclamará das mãos de
  rationale: O verbo pode significar buscar, requerer ou exigir; com «das mãos de», «reclamar» comunica de modo natural a ideia de reivindicar ou requerer de volta.
- source_word: ትእዛዝያኒሁ
  choice: suas autoridades
  rationale: Conserva a referência abrangente a poderes ou agentes subordinados sob autoridade divina.
- source_word: እምይእዜ፡ ወእስከ፡ ለዓለም
  choice: desde agora e para sempre
  rationale: Equivalência portuguesa natural para a fórmula temporal do texto.
theological_decisions:
- issue: Relação singular de Deus com Israel
  choice: Israel não foi entregue nem confiado a nenhum anjo ou espírito; somente Deus é seu governante
  alternative: Deus não nomeou nenhum anjo ou espírito sobre Israel
  rationale: A redação escolhida preserva os dois verbos do original e a tensão conceitual entre o governo divino direto de Israel e a mediação espiritual associada a outros povos, sem acrescentar uma doutrina externa.
- issue: Deus reclamar Israel das autoridades espirituais
  choice: os reclamará das mãos de
  alternative: os buscará das mãos de / os requererá das mãos de
  rationale: «Reclamará» mantém a possível ideia de busca, reivindicação e prestação de contas, em português corrente e digno, sem definir em excesso o mecanismo teológico.
- issue: Fórmula de pertencimento mútuo
  choice: eles sejam dele e ele seja deles
  alternative: eles lhe pertençam e ele lhes pertença
  rationale: A formulação mais literal conserva a reciprocidade e a força pactual da expressão sem explicá-la ou suavizá-la.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «guardar» e a fórmula «eles sejam dele e ele seja deles» foram mantidas por sua importância literária e teológica. A alternância entre «Israel» no singular e o pronome plural «os» acompanha a passagem do povo coletivo para seus membros, presente no original.
