  text: 'And the Lord said to Abraham, “And as for you, keep my covenant, you and your seed after you. And circumcise every male among you, and circumcise the flesh of your foreskins, and it shall be a sign of an everlasting ordinance between me and you. And a son of eight days you shall circumcise—every male among you, one born in the house and one bought with your gold [or ''money''] from any sons of foreigners who are not from your seed. The one born in your house must surely be circumcised, and the one whom you bought with your silver must be circumcised; and my covenant shall be in your flesh as an everlasting ordinance. But an uncircumcised male, one whose foreskin''s flesh is not circumcised on the eighth day, that person shall be cut off from his kin, because he has broken my covenant.” And the Lord said to Abraham, “As for Sarai your wife, you shall no longer call her name Sarai, for Sarah is her name. And I will bless her, and from her I will give you a son; and I will bless him,
    and he shall become a nation, and kings of nations shall come from him.” And Abraham fell on his face and rejoiced, and he said in his heart, “Shall a son be born to one a hundred years old? And shall Sarah, who is ninety years old, give birth?” And Abraham said to the Lord, “If only Ishmael might live before you!” And God said, “Yes, and Sarah shall bear you a son, and you shall call his name Isaac; and I will establish my covenant with him, an everlasting covenant, and with his seed after him. And concerning Ishmael also, I have heard you. Behold, I will bless him and make him fruitful and multiply him very greatly; he shall father twelve princes, and I will make him into a great nation. But my covenant I will establish with Isaac, whom Sarah shall bear to you at this time in the next year.” And he finished speaking with him, and the Lord went up from Abraham. And Abraham did as the Lord had said to him, and he took Ishmael his son and all those born in his house and those bought with
    silver, every male in his house, and circumcised the flesh of their foreskins. And on that very day Abraham was circumcised, and all the men of his house—those born in his house—and all those bought with silver from the sons of foreigners were circumcised with him. This is a statute for all the generations forever: there is no delaying of days, and no omission of even one day from eight days, for it is an everlasting ordinance, ordained and written on the heavenly tablets. And everyone who is born whose flesh of foreskin is not circumcised on the eighth day does not belong to the children of the covenant that the Lord made with Abraham, for he belongs to the children of destruction; and there is no sign on him that he belongs to the Lord, but he is for destruction, and for being destroyed from the earth, and for being rooted out from the earth, because he has broken the covenant of the Lord our God.'
translation:
  language: pt
  text: 'E o Senhor disse a Abraão: “Quanto a você, guarde a minha aliança, você e a sua descendência depois de você. Circuncidem todo homem entre vocês; circuncidem a carne do seu prepúcio, e isso será sinal de uma prescrição eterna entre mim e vocês. Todo menino, ao completar oito dias, deverá ser circuncidado — todo homem entre vocês, tanto o nascido em casa como o comprado com o seu ouro[a] dentre todos os filhos de estrangeiros que não sejam da sua descendência. Tanto o nascido em sua casa como o comprado com o seu ouro deverão, sem falta, ser circuncidados. Assim, a minha aliança estará na carne de vocês como prescrição eterna. Mas o homem incircunciso, cuja carne do prepúcio não for circuncidada no oitavo dia, será eliminado do meio de sua parentela, pois quebrou a minha aliança.”


    E o Senhor disse a Abraão: “Quanto a Sarai, sua mulher, você já não a chamará Sarai, pois o nome dela é Sara. Eu a abençoarei e, por meio dela, darei a você um filho. Eu o abençoarei, e ele se tornará uma nação; reis de nações procederão dele.”


    Então Abraão prostrou-se com o rosto em terra, alegrou-se e disse em seu coração: “Acaso nascerá um filho a um homem de cem anos? E Sara, que tem noventa anos, dará à luz?” E Abraão disse ao Senhor: “Quem dera Ismael vivesse diante de ti!”


    Deus respondeu: “Sim, e Sara dará a você um filho, e você lhe dará o nome de Isaque. Estabelecerei a minha aliança com ele como aliança eterna, e também com a descendência dele depois dele. Quanto a Ismael, também ouvi o seu pedido. Eu o abençoarei, o farei fecundo e o multiplicarei muitíssimo. Ele gerará doze príncipes, e farei dele uma grande nação. Mas estabelecerei a minha aliança com Isaque, a quem Sara dará à luz para você nesta mesma época, no próximo ano.”


    Quando terminou de falar com ele, o Senhor subiu, afastando-se de Abraão. E Abraão fez conforme o Senhor lhe havia dito. Tomou Ismael, seu filho, todos os nascidos em sua casa e todos os comprados com ouro — todo homem de sua casa — e circuncidou a carne do prepúcio deles. Naquele mesmo dia, Abraão foi circuncidado, juntamente com todos os homens de sua casa — os nascidos em sua casa e todos os comprados com ouro dentre os estrangeiros.


    Este é um estatuto para todas as gerações, para sempre: não se deve retardar o rito, nem deixar passar sequer um dia além dos oito dias, pois é uma prescrição eterna, decretada e escrita nas tábuas celestiais. Todo aquele que nascer e cuja carne do prepúcio não for circuncidada no oitavo dia não pertence aos filhos da aliança que o Senhor estabeleceu com Abraão, pois pertence aos filhos da destruição. Não há nele o sinal de que pertence ao Senhor; antes, está destinado à destruição, a ser destruído da terra e a ser arrancado da terra, pois quebrou a aliança do Senhor, nosso Deus.


    [a] Ou “dinheiro”. O termo ge’ez significa literalmente “ouro”, mas também pode designar dinheiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “dinheiro”. O termo ge’ez significa literalmente “ouro”, mas também pode designar dinheiro.
    reason: Registra a extensão semântica possível de ወርቅ sem substituir sua acepção lexical primária.
lexical_decisions:
- source_word: ዘርእ (zarʾ)
  choice: descendência
  rationale: Expressa o sentido coletivo de “semente” em português natural, preservando a referência à posteridade.
- source_word: ወርቅ (warq)
  choice: ouro
  rationale: Segue a escolha lexical específica do ge’ez, em vez de harmonizá-la com a “prata” de Gênesis 17; a extensão semântica “dinheiro” é registrada em nota.
- source_word: ሥርዓት ዘለዓለም
  choice: prescrição eterna
  rationale: Comunica uma norma instituída e permanente sem restringir o termo a uma formulação denominacional.
- source_word: ተፈሥሐ
  choice: alegrou-se
  rationale: Traduz o verbo ge’ez apresentado, sem harmonizá-lo silenciosamente com a leitura “riu” de outras tradições textuais.
- source_word: መላእክተ
  choice: príncipes
  rationale: No contexto dos doze descendentes governantes de Ismael, “príncipes” expressa adequadamente a função dos personagens.
- source_word: ውሉደ ሙስና
  choice: filhos da destruição
  rationale: Mantém a expressão semítica concreta e severa do texto, sem reinterpretá-la por uma categoria teológica posterior.
theological_decisions:
- issue: Referente dos pronomes após a promessa do filho de Sara
  choice: “Eu o abençoarei, e ele se tornará uma nação; reis de nações procederão dele”
  alternative: “Eu a abençoarei, e ela se tornará povos; reis de nações procederão dela”
  rationale: Os sufixos e verbos masculinos do ge’ez referem-se explicitamente ao filho prometido. A tradução não foi harmonizada com o texto massorético de Gênesis 17:16.
- issue: Resposta de Abraão à promessa
  choice: “alegrou-se”
  alternative: “riu”
  rationale: A escolha segue o verbo do testemunho ge’ez fornecido e conserva a apresentação própria de Jubileus.
- issue: Tríplice linguagem de juízo no encerramento
  choice: “destinado à destruição, a ser destruído da terra e a ser arrancado da terra”
  alternative: Omitir a terceira expressão ou condensar as três
  rationale: Preserva a acumulação retórica e inclui explicitamente a frase ge’ez sobre ser arrancado da terra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregaram-se “você/vocês” para distinguir os destinatários singulares e plurais, mantendo construções solenes sem arcaísmo excessivo. As repetições jurídicas e a intensidade das fórmulas de aliança e juízo foram preservadas.
