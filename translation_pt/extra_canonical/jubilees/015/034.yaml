base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/034.yaml
  text: And there will be great wrath from the Lord against the children of Israel, because they have forsaken his covenant and turned aside from his word and provoked and blasphemed, in that they do not perform the ordinance of this law; for they have made themselves like the nations, for uprooting and destruction from the earth. And there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned for all the sin of this eternal error.
translation:
  language: pt
  text: E haverá grande ira da parte do Senhor contra os filhos de Israel, porque abandonaram a aliança dele, desviaram-se da sua palavra, provocaram e blasfemaram, pois não cumprem a prescrição desta lei. Eles se tornaram semelhantes às nações, para serem arrancados e destruídos da terra. E já não haverá para eles perdão nem remissão, para que sejam perdoados e recebam remissão de todo o pecado deste erro eterno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de todo o pecado deste erro que dura para sempre”. A relação exata entre “pecado”, “erro” e “eterno” é compacta e pode ser entendida de mais de uma maneira.'
    reason: Preservar a ambiguidade sintática e semântica da expressão final sem omitir o termo ge'ez para “pecado”.
lexical_decisions:
- source_word: መዓት
  choice: ira
  rationale: Expressa a reação judicial intensa do Senhor; “grande ira” mantém a força de ዐቢይ.
- source_word: ኪዳኖ
  choice: a aliança dele
  rationale: Preserva a referência à aliança do Senhor e evita confundi-la com uma aliança pertencente a Israel.
- source_word: ተገኅሡ
  choice: desviaram-se
  rationale: Comunica afastamento ou transgressão em relação à palavra divina sem restringir o sentido a mera desobediência verbal.
- source_word: ሥርዐተ
  choice: prescrição
  rationale: Representa uma determinação normativa concreta desta lei em português atual e digno.
- source_word: ለስስሎ
  choice: para serem arrancados
  rationale: Mantém a imagem forte de desarraigamento ou remoção da terra, preferível a um termo genérico como “retirados”.
- source_word: ስርየተ
  choice: remissão
  rationale: Distingue o segundo termo do par “perdão e remissão”, preservando a duplicação deliberada do original.
- source_word: ኃጢአት
  choice: pecado
  rationale: Traduz explicitamente o substantivo presente no ge'ez, que não deve ser omitido.
- source_word: ስሕተት
  choice: erro
  rationale: Preserva a ideia de desvio ou erro sem interpretá-la de modo denominacionalmente específico.
theological_decisions:
- issue: Destino expresso pela fórmula de arrancamento e destruição
  choice: “para serem arrancados e destruídos da terra”
  alternative: “destinados ao arrancamento e à destruição da terra”
  rationale: A escolha preserva o juízo dirigido às pessoas e evita sugerir que a própria terra será destruída.
- issue: Repetição de perdão e remissão
  choice: 'Manter os dois pares: “perdão nem remissão” e “perdoados e absolvidos”'
  alternative: Simplificar para uma única referência ao perdão
  rationale: A repetição pertence à retórica judicial do texto e sua supressão reduziria sua força, embora se use “absolvidos” na segunda ocorrência para legibilidade.
- issue: Relação entre pecado, erro e eternidade
  choice: “de todo o pecado deste erro eterno”
  alternative: “de todo o pecado deste erro que dura para sempre”
  rationale: Mantém a construção compacta e difícil do texto, sem omitir “pecado” nem resolver silenciosamente o alcance exato do qualificativo temporal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura solene e as repetições judiciais do original foram preservadas, mas com pontuação e sintaxe naturais em português.
