base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/033.yaml
  text: And now I am telling you that the children of Israel will not keep this ordinance, and they will not circumcise their sons according to all the law; for they will leave some of the flesh of their circumcision in the circumcision of their sons, and all the sons of Belial will leave their sons uncircumcised as they were born.
translation:
  language: pt
  text: E agora eu te digo que os filhos de Israel não cumprirão esta ordenança[a] e não circuncidarão seus filhos de acordo com toda a lei. Pois deixarão parte da carne de sua circuncisão na circuncisão de seus filhos, e todos os filhos de Belial[b] deixarão seus filhos incircuncisos, tal como nasceram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “serão infiéis a esta ordenança”.'
    reason: Preserva a nuance do verbo ge'ez, que pode indicar agir falsamente ou com infidelidade.
  - marker: b
    text: “Belial” pode designar a perversidade ou funcionar como nome próprio.
    reason: Preserva a possível tensão entre o sentido moral do termo e sua leitura como nome pessoal.
lexical_decisions:
- source_word: ይሐስዉ
  choice: não cumprirão
  rationale: No contexto de uma ordenança, o verbo exprime agir de modo falso ou infiel para com ela; «não cumprirão» comunica naturalmente a transgressão sem acrescentar uma explicação doutrinária.
- source_word: ኵሉ፡ ሕግ
  choice: toda a lei
  rationale: Reproduz a expressão sem inserir o demonstrativo «esta», ausente no ge'ez.
- source_word: መተርፋነ
  choice: deixarão parte
  rationale: Expressa a ideia de fazer restar ou deixar uma porção da carne, em conformidade com a construção do contexto.
- source_word: ውሉደ፡ ቤልአር
  choice: filhos de Belial
  rationale: Mantém o nome tradicional e a designação coletiva do texto, sem convertê-la interpretativamente em uma categoria moral específica.
- source_word: ዘእንበለ፡ ክስበት
  choice: incircuncisos
  rationale: Forma portuguesa direta para «sem circuncisão», adequada ao contraste com o estado em que nasceram.
theological_decisions:
- issue: Natureza da infidelidade de Israel à ordenança
  choice: não cumprirão esta ordenança
  alternative: agirão falsamente quanto a esta ordenança
  rationale: A opção principal é clara e idiomática, enquanto a nota preserva a nuance literal de falsidade ou infidelidade.
- issue: Identidade dos «filhos de Belial»
  choice: preservar «filhos de Belial»
  alternative: filhos da perversidade
  rationale: A transliteração evita decidir se Belial funciona aqui como nome próprio ou como personificação/designação da iniquidade.
translation_notes:
  register: Português moderno, claro e digno, com construção acessível ao leitor brasileiro e compreensível internacionalmente. A repetição de «circuncisão» foi mantida porque corresponde à formulação enfática e algo técnica da fonte; evitou-se suavizar a referência concreta à carne.
