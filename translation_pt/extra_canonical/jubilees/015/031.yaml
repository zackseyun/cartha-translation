base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/031.yaml
  text: And he sanctified him and gathered him from all the children of men; for there are many nations and many peoples, and all are his, and over all he appointed spirits to lead them astray from following him.
translation:
  language: pt
  text: E ele o santificou e o reuniu dentre todos os filhos dos homens, pois há muitas nações e muitos povos, e todos lhe pertencem; e sobre todos designou espíritos para desviá-los de segui-lo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de ir atrás dele”.
    reason: Registra a forma da expressão ge'ez subjacente a «de segui-lo».
lexical_decisions:
- source_word: አስተጋብኦ
  choice: o separou dentre
  rationale: No contexto de eleição dentre toda a humanidade, expressa a reunião ou retirada para si sem sugerir apenas uma concentração física.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Preserva a expressão antropológica tradicional e inteligível do texto-fonte.
- source_word: አሕዛብ / ሕዝብ
  choice: nações / povos
  rationale: Mantém a distinção lexical e o paralelismo do ge'ez.
- source_word: አሰለመ፡ መናፍስተ
  choice: designou espíritos
  rationale: Comunica a ideia de encarregar ou pôr espíritos sobre os povos sem especificar além do texto a natureza dessa autoridade.
- source_word: ያስሕትዎሙ
  choice: desviá-los
  rationale: Verbo natural em português que preserva o sentido causativo de fazer errar ou desencaminhar.
- source_word: እምድኅሬሁ
  choice: de segui-lo
  rationale: Traduz idiomaticamente a expressão semítica literalmente ligada a estar 'atrás dele', preservando seu sentido relacional.
theological_decisions:
- issue: A pertença universal dos povos e a designação de espíritos que os desviam
  choice: e todos lhe pertencem; e sobre todos designou espíritos para desviá-los
  alternative: e todos são dele; e pôs sobre todos espíritos para fazê-los errar
  rationale: 'Mantém sem harmonização a tensão teológica do texto: todos pertencem a Deus, embora espíritos sejam designados sobre eles com função de desvio.'
- issue: Identidade do indivíduo santificado e separado
  choice: manteve-se apenas o pronome masculino «o»
  alternative: explicitar «Israel»
  rationale: O versículo depende do contexto para identificar o referente; inserir um nome resolveria uma referência que o texto desta unidade deixa pronominal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva o paralelismo «muitas nações e muitos povos» e a tensão do enunciado, evitando explicações doutrinárias dentro do texto.
