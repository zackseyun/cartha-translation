base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/027.yaml
  text: For all the angels of the presence and all the angels of holiness—thus was their creation from the day of their creation—and before the angels of the presence and the angels of holiness he sanctified Israel, that they might be with him and with his holy angels.
translation:
  language: pt
  text: Pois, quanto a todos os anjos da presença e a todos os anjos da santidade, assim foi a criação deles[a] desde o dia de sua criação; e, diante[b] dos anjos da presença e dos anjos da santidade, ele santificou Israel, para que estivesse com ele e com seus santos anjos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim ele os criou”.'
    reason: A expressão nominal ge'ez pode ser vertida verbalmente, embora “a criação deles” reflita mais diretamente sua forma.
  - marker: b
    text: 'Ou: “em oposição a”.'
    reason: O termo ge'ez pode indicar estar diante ou na presença de alguém, mas também uma posição oposta.
lexical_decisions:
- source_word: መላእክተ፡ ገጽ
  choice: anjos da presença
  rationale: Expressa literalmente a construção ge'ez e preserva a designação tradicional dessa classe de anjos.
- source_word: መላእክተ፡ ቅዳሴ
  choice: anjos da santidade
  rationale: Mantém o substantivo abstrato do original, distinguindo esta expressão de መላእክቲሁ፡ ቅዱሳን, traduzido no fim como “seus santos anjos”.
- source_word: ከመዝ፡ ፍጥረቶሙ
  choice: assim era a criação deles
  rationale: Preserva a formulação nominal “a criação deles”, sem convertê-la silenciosamente no verbo “ele os criou”.
- source_word: ወአንጻሮሙ
  choice: e diante
  rationale: “Diante” é natural no contexto e conserva a ideia espacial ou relacional de estar perante alguém; a leitura mais estritamente espacial é registrada em nota.
- source_word: ቀደሶ
  choice: santificou
  rationale: Reproduz o sentido causativo de tornar ou separar como santo, sem especificar além do que o texto afirma.
theological_decisions:
- issue: Relação de Israel com os anjos santos
  choice: para que estivesse com ele e com seus santos anjos
  alternative: para que pertencesse a ele e a seus santos anjos
  rationale: A tradução mantém a noção simples de estar com Deus e com os anjos, sem introduzir uma relação de posse ou uma doutrina adicional.
- issue: Natureza ou modo da criação dos anjos
  choice: assim era a criação deles
  alternative: assim ele os criou
  rationale: A formulação nominal conserva a tensão do original e evita identificar explicitamente o sujeito agente onde a frase ge'ez emprega “criação”.
translation_notes:
  register: Português moderno, digno e acessível, com ordem próxima à do ge'ez. A repetição de “criação” e das duas designações angélicas foi mantida por corresponder à estrutura enfática do original. Todos os marcadores de nota aparecem no texto.
