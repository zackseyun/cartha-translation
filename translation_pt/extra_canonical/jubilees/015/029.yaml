lexical_decisions:
- source_word: ትእዛዝ
  choice: mandamento
  rationale: Equivalente natural e preciso para uma ordem normativa, adequado ao contexto da circuncisão.
- source_word: ተሠርዐ
  choice: foi estabelecido
  rationale: Expressa a ideia de algo instituído ou ordenado, sem sugerir apenas que foi verbalmente mandado.
- source_word: ለኪዳን
  choice: como aliança
  rationale: Mantém a relação predicativa entre o mandamento e a aliança, conforme o texto-fonte e a camada inglesa auditada.
- source_word: ይዕቀብዎ
  choice: o guardem
  rationale: Preserva o sentido de observar fielmente um mandamento, em linguagem bíblica clara e corrente.
- source_word: ለዓለም
  choice: para sempre
  rationale: É a expressão portuguesa idiomática para duração perpétua neste contexto.
- source_word: ኵሎሙ፡ ደቂቀ፡ እስራኤል
  choice: todos os filhos de Israel
  rationale: Conserva a designação coletiva tradicional e inteligível, sem substituir por uma formulação interpretativa.
theological_decisions:
- issue: Relação entre mandamento e aliança
  choice: “o mandamento foi estabelecido como aliança”
  alternative: “o mandamento foi estabelecido para a aliança”
  rationale: A construção ge'ez com ለ pode admitir nuance relacional, mas o contexto e a versão de consulta favorecem a identificação funcional do mandamento como sinal ou disposição da aliança. A tradução preserva a formulação sem desenvolver uma interpretação teológica adicional.
translation_notes:
  register: Português moderno, digno e de leitura fluida. A ordem foi ajustada para que “todos os filhos de Israel” funcione naturalmente como sujeito de “guardem”, preservando todo o conteúdo do original.
