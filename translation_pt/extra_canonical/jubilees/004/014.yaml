  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Danel, his father’s brother’s daughter; and in the sixth year of this week she bore him a son, and he called his name Methuselah.
translation:
  language: pt
  text: No décimo segundo jubileu, na sétima semana, Enoque tomou para si uma esposa, chamada Edni, filha de Danel e filha da irmã de seu pai;[a] no sexto ano dessa semana, ela lhe deu um filho, a quem ele chamou Matusalém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto geês diz literalmente “filha de Danel, filha da irmã de seu pai”. Algumas traduções trazem “filha do irmão de seu pai”.
    reason: Preserva uma divergência textual ou interpretativa relevante na descrição do parentesco, sem corrigi-la silenciosamente segundo a camada inglesa.
