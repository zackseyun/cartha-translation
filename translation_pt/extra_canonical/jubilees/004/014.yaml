- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: tomou para si uma esposa
  rationale: Reproduz de modo natural e digno a fórmula matrimonial do geês, sem acrescentar linguagem moderna de casamento não expressa no texto.
- source_word: እድኒ
  choice: Edni
  rationale: Transliteração simples do nome próprio, em continuidade com a forma preservada na tradição textual.
- source_word: ማቱሳላ
  choice: Matusalém
  rationale: Emprega a forma portuguesa bíblica amplamente reconhecida para o nome.
- source_word: ወጸውዐ፡ ስሞ
  choice: a quem ele chamou
  rationale: Expressa em português corrente o ato de dar nome, preservando o sujeito masculino do original.
theological_decisions:
- issue: Identificação do parentesco de Edni
  choice: filha de Danel e filha da irmã de seu pai
  alternative: filha de Danel, filha do irmão de seu pai
  rationale: O texto geês fornecido traz explicitamente እኅተ, “irmã”, embora a camada inglesa de consulta apresente “irmão”. A tradução segue prioritariamente a evidência da língua-fonte e registra a divergência em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. O nome “Enoque” foi explicitado para evitar ambiguidade fora do contexto imediato; a cronologia técnica de jubileus e semanas foi mantida.
