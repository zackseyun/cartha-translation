base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/022.yaml
  text: And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against them all.
translation:
  language: pt
  text: E ele testemunhou contra os Vigilantes, que haviam pecado com as filhas dos homens; pois eles haviam começado a unir-se a elas e a contaminar-se com as filhas dos homens. E Enoque testemunhou contra todos eles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰትጉሃን
  choice: Vigilantes
  rationale: Designação tradicional dos seres angelicais no contexto de Jubileus; preserva o sentido técnico do termo em vez de reduzi-lo a uma descrição genérica.
- source_word: አበሱ
  choice: haviam pecado
  rationale: Reproduz diretamente a ideia de transgressão já ocorrida.
- source_word: ይደመሩ
  choice: unir-se a elas
  rationale: Expressa a associação ou união com as filhas dos homens; o pronome explicita em português o referente já mencionado sem acrescentar uma identificação nova.
- source_word: ይርኩሱ
  choice: contaminar-se
  rationale: Mantém a noção de impureza ou profanação reflexiva presente no contexto.
- source_word: አስምዐ ... ላዕለ
  choice: testemunhou contra
  rationale: A construção indica testemunho acusatório dirigido contra os transgressores.
theological_decisions:
- issue: Identidade dos seres chamados ሰትጉሃን
  choice: Vigilantes
  alternative: anjos vigilantes
  rationale: O texto usa uma designação própria tradicional. “Vigilantes” preserva essa terminologia sem inserir explicitamente uma classificação ontológica que o versículo não declara.
- issue: Natureza da união com as filhas dos homens
  choice: unir-se a elas
  alternative: manter relações com elas
  rationale: A formulação conserva a relativa amplitude do verbo e não torna mais explícita do que a fonte a natureza da união, embora o contexto indique transgressão e contaminação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e vocabulário acessível. A repetição de “filhas dos homens” foi mantida por corresponder à ênfase da fonte; “contra” explicita o caráter acusatório do testemunho.
