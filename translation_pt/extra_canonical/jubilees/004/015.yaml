  language: en
  yaml_path: translation/extra_canonical/jubilees/004/015.yaml
  text: And he was still with the angels of God for six jubilees of years, and they showed him everything that is on earth and in the heavens, the rule of the sun, and he wrote down everything.
translation:
  language: pt
  text: E ele permaneceu com os anjos de Deus durante seis jubileus de anos. Eles lhe mostraram tudo o que há na terra e nos céus, o domínio do sol, e ele escreveu tudo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀሎ፡ እንከ፡ ምስለ
  choice: permaneceu com
  rationale: Expressa de modo natural a permanência de Enoque junto aos anjos, preservando o valor continuativo do enunciado.
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: durante seis jubileus de anos
  rationale: Mantém a unidade cronológica própria de Jubileus e explicita naturalmente em português que se trata de duração.
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: o domínio do sol
  rationale: ሥልጣን pode indicar autoridade, governo ou domínio. “Domínio” conserva essa amplitude sem reduzir a expressão ao simples movimento ou curso solar.
- source_word: ወጸሐፈ፡ ኵሎ
  choice: e ele escreveu tudo
  rationale: Reproduz diretamente a afirmação de que Enoque pôs por escrito tudo o que lhe foi mostrado, sem acrescentar objeto ou finalidade não expressos.
theological_decisions:
- issue: Natureza do que é chamado de “domínio do sol”
  choice: Preservar a formulação cosmológica ampla como “o domínio do sol”.
  alternative: Interpretar como “o curso do sol” ou “as leis que regem o sol”.
  rationale: O termo-fonte denota domínio ou autoridade e não especifica se a referência é ao movimento, à função calendárica ou à esfera de governo do sol; a tradução não resolve essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. Conservou-se a expressão técnica “jubileus de anos” por sua importância no sistema cronológico da obra.
