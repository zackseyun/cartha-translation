base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/004.yaml
  text: And therefore the Lord rebuked Cain because of Abel[4], because he had killed him; and he made him a fugitive on the earth because of the blood of his brother, and he cursed him on the earth.
translation:
  language: pt
  text: Por isso, o Senhor repreendeu Caim por causa de Abel[a], porque o havia matado; fez dele um fugitivo na terra por causa do sangue de seu irmão e o amaldiçoou na terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo 4 não aparece preservado separadamente como linha numerada no corpus de trabalho. Seu sentido é transmitido pela repetição inicial e pela continuação no versículo 5; a tradução recompõe com cautela o provável texto intermediário a partir do contexto geʽez imediato.
    reason: segmentation_note
lexical_decisions:
- source_word: እግዚአብሔር (ʾEgziʾabḥer)
  choice: o Senhor
  rationale: Representa naturalmente o título divino em geʽez sem empregar a convenção tipográfica «SENHOR», normalmente associada ao tetragrama hebraico.
- source_word: ወዘለፎ (wä-zä-läfo)
  choice: repreendeu
  rationale: Expressa a censura divina com linguagem clara e digna, em consonância com o sentido preservado na tradição textual.
- source_word: በእንተ (bäʾəntä)
  choice: por causa de
  rationale: Mantém o valor causal da expressão nas ocorrências ligadas a Abel e ao sangue do irmão.
- source_word: ቀተሎ (qätäl-o)
  choice: o havia matado
  rationale: O mais-que-perfeito esclarece que a morte de Abel antecedeu a repreensão, sem acrescentar conteúdo ao texto.
- source_word: ደመ እኁሁ (dämä ʾəḫuhu)
  choice: sangue de seu irmão
  rationale: Preserva a formulação concreta e a relação familiar do original.
theological_decisions:
- issue: Forma do título divino
  choice: o Senhor
  alternative: o SENHOR
  rationale: O geʽez não apresenta aqui uma distinção ortográfica equivalente à convenção usada para o tetragrama hebraico; por isso, evita-se introduzi-la.
- issue: Relação causal entre o homicídio e a condição de fugitivo
  choice: preservar explicitamente «por causa do sangue de seu irmão»
  alternative: parafrasear como punição pelo assassinato
  rationale: A redação mantém a imagem bíblica do sangue derramado e não reduz sua possível carga jurídica e teológica a uma explicação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de «sobre a terra» foi mantida por refletir a estrutura e a ênfase do texto-fonte; o marcador [a] aparece no texto principal.
