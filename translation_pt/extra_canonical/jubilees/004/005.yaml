base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/005.yaml
  text: 'And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and not reported, let him be cursed in the same way.'
translation:
  language: pt
  text: 'E por causa disso está escrito nas tábuas celestiais: “Maldito aquele que ferir outra pessoa com maldade”. E todos os que virem e ouvirem digam: “Assim seja”. E o homem que tiver visto e não tiver denunciado[a] seja amaldiçoado da mesma forma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez apresentado traz literalmente “e tiver denunciado”, mas o contexto e a leitura textual reconhecida indicam “e não tiver denunciado”.
    reason: Registra uma provável falha textual ou de transcrição/OCR na fonte fornecida, sem tornar a sentença incoerente no texto principal.
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Reproduz de modo natural a expressão ge'ez para as tábuas do céu, mantendo o plural e a linguagem característica de Jubileus.
- source_word: ዘይዘብጥ፡ ካልአ
  choice: aquele que ferir outra pessoa
  rationale: O verbo indica golpear ou ferir, e ካልአ significa literalmente 'outro'; 'outra pessoa' evita restringir indevidamente o referente a um vizinho.
- source_word: በእኩይ
  choice: com maldade
  rationale: Preserva o valor moral de agir de modo mau ou malicioso sem especificar um motivo além do texto.
- source_word: ይኩን
  choice: Assim seja
  rationale: Equivalente português corrente da fórmula de assentimento ou ratificação.
- source_word: ርጉመ፡ ከማሁ
  choice: amaldiçoado da mesma forma
  rationale: Mantém a correspondência explícita entre a maldição da testemunha omissa e a maldição anteriormente pronunciada.
theological_decisions:
- issue: Responsabilidade da testemunha que viu o ato
  choice: não tiver denunciado
  alternative: tiver denunciado
  rationale: Embora o texto ge'ez apresentado contenha a forma positiva ወአነገረ ('e denunciou/relatou'), o contexto jurídico e a leitura textual reconhecida exigem a negativa ወኢነገረ ('e não denunciou/relatou'). A nota preserva transparência sobre a divergência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o tom jurídico e solene do pronunciamento sem recorrer a vocabulário confessional específico.
