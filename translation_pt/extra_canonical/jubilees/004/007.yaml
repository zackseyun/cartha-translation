  text: that are committed in heaven and on earth, and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks[7] of years. And in the fourth year of the fifth week they became joyful, and Adam again knew his wife, and she bore him a son, and he called his name Seth; for he said, “the Lord has raised up for me another seed on the earth in place of Abel, because Cain killed him.” And in the sixth week he fathered his daughter Azura. And Cain took Awan his sister as a wife, and she bore him Enoch at the end of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city and named it after his son Enoch. And Adam knew Eve his wife, and she bore nine more sons. And in the fifth week of the fifth jubilee Seth took Azura his sister as a wife, and in the fourth year she bore him Enos. He was the first to call on the name of the Lord on the earth. And in the seventh jubilee, in the
    third week, Enos took Noam his sister as a wife, and she bore him a son in the third year of the fifth week, and he called his name Kenan. And at the end of the eighth jubilee Kenan took Mualeleth his sister as a wife, and she bore him a son in the ninth jubilee, in the first week, in the third year of that week, and they called his name Mahalalel. And in the second week of the tenth jubilee Mahalalel took Dinah, the daughter of Barakiel, his father's brother's daughter, as a wife, and she bore him a son in the third week, in its sixth year, and they called his name Jared. For in his days the angels of the Lord descended to the earth, those who are called the Watchers, so that they might instruct the children of men,
translation:
  language: pt
  text: 'que são cometidos no céu e na terra, na luz e nas trevas, e em todo lugar. Adão e sua mulher prantearam Abel durante quatro semanas de anos.[a] No quarto ano da quinta semana, eles voltaram a se alegrar. Adão conheceu novamente sua mulher, e ela lhe deu um filho. Ele lhe deu o nome de Sete, pois disse: “O Senhor fez surgir para mim outra descendência na terra, no lugar de Abel, porque Caim o matou”. Na sexta semana, Adão gerou sua filha Azura.


    Caim tomou por mulher sua irmã Avã, e ela lhe deu Enoque no fim do quarto jubileu. No primeiro ano da primeira semana do quinto jubileu, começaram a construir casas na terra. Caim construiu uma cidade e lhe deu o nome de seu filho Enoque. Adão conheceu Eva, sua mulher, e ela lhe deu outros nove filhos.


    Na quinta semana do quinto jubileu, Sete tomou por mulher sua irmã Azura, e, no quarto ano, ela lhe deu Enos. Ele foi o primeiro a invocar o nome do Senhor na terra. No sétimo jubileu, na terceira semana, Enos tomou por mulher sua irmã Noam. No terceiro ano da quinta semana, ela lhe deu um filho, e ele lhe deu o nome de Cainã.


    No fim do oitavo jubileu, Cainã tomou por mulher sua irmã Mualeleth. No nono jubileu, na primeira semana, no terceiro ano dessa semana, ela lhe deu um filho, e deram-lhe o nome de Maalalel. Na segunda semana do décimo jubileu, Maalalel tomou por mulher Diná, filha de Baraquiel e da irmã de seu pai. Na terceira semana, no sexto ano, ela lhe deu um filho, e deram-lhe o nome de Jarede. Isso porque, nos dias dele, os anjos do Senhor desceram à terra — aqueles que são chamados Vigilantes — para instruir os filhos dos homens,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste capítulo, “semana” é uma unidade do sistema cronológico de Jubileus e normalmente corresponde a sete anos.
    reason: Nota cultural e cronológica necessária para evitar que “semana” seja entendida como sete dias.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: o Senhor
  rationale: O termo ge'ez é um título divino, não a forma explícita do nome Yahweh; por isso, evita-se a versalização “SENHOR”.
- source_word: ሱባዔ
  choice: semana / período de sete anos
  rationale: No sistema cronológico de Jubileus, designa uma unidade de sete anos. Mantém-se “semana” onde o contexto é transparente, com nota explicativa; na última ocorrência, “período de sete anos” evita a leitura equivocada de que se trata da terceira semana do décimo jubileu, pois o texto diz respeito ao terceiro período.
- source_word: ትጉሃነ
  choice: Vigilantes
  rationale: É a designação tradicional e semanticamente adequada do grupo angélico, preservada como título.
- source_word: አእመራ
  choice: conheceu
  rationale: Mantém o eufemismo sexual sem explicá-lo ou suavizá-lo indevidamente.
- source_word: ዘርአ
  choice: descendência
  rationale: Reproduz o sentido coletivo de “semente/linhagem” em português natural, sem decidir se a referência se limita ao filho individual.
theological_decisions:
- issue: Invocar ou proclamar o nome do Senhor
  choice: invocar o nome do Senhor
  alternative: proclamar o nome do Senhor
  rationale: O verbo pode admitir nuances de chamar ou proclamar; “invocar” conserva a formulação bíblica corrente e a dimensão cultual sem excluir a proclamação.
- issue: Finalidade da descida dos Vigilantes
  choice: para instruir os filhos dos homens
  alternative: para ensinar aos seres humanos
  rationale: Preserva a finalidade positiva expressa nesta oração e a linguagem tradicional, sem antecipar desenvolvimentos posteriores sobre a atuação dos Vigilantes.
- issue: Relação de Diná com Maalalel
  choice: filha de Baraquiel, que era irmão de seu pai
  alternative: filha de Baraquiel, filha do irmão de seu pai
  rationale: A sintaxe ge'ez identifica Diná como prima paterna; a redação escolhida comunica essa relação sem corrigir ou expandir o texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por formas correntes no Brasil. Mantiveram-se os termos cronológicos próprios da obra, os eufemismos do texto e a oração final incompleta, pois o trecho fornecido termina no meio da frase.
