base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/019.yaml
  text: And he recounted the sabbaths of years, as we made known to him. And he saw what was and what will be in a vision of his sleep, how it will happen to the children of men in their generations until the day of judgment. He saw and understood everything, and wrote his testimony, and placed the testimony on earth...
translation:
  language: pt
  text: E ele relatou os sábados de anos, conforme lhe fizemos saber. E viu, numa visão durante o sono, o que foi e o que será, e como isso sucederá aos filhos dos homens em suas gerações, até o dia do juízo. Ele viu e compreendeu tudo, escreveu o seu testemunho e pôs o testemunho sobre a terra[a]...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto-fonte fornecido continua após “sobre a terra”; a divisão do versículo ocorre no meio da sentença.
    reason: A fonte ge'ez apresentada termina com uma construção incompleta, equivalente a “sobre a terra, sobre...”. A nota esclarece a continuidade sem suprir conjecturalmente o complemento.
lexical_decisions:
- source_word: ሰንበታት፡ ዓመታት
  choice: sábados de anos
  rationale: Mantém a expressão calendárica do texto, em vez de a substituir interpretativamente por “semanas de anos”.
- source_word: ወዘኮነ፡ ወዘይከውን
  choice: o que aconteceu e o que acontecerá
  rationale: Reproduz o contraste temporal entre aquilo que foi/aconteceu e aquilo que será/acontecerá.
- source_word: በራእየ፡ ንዋሙ
  choice: numa visão durante o sono
  rationale: Expressa naturalmente a visão recebida no sono sem determinar se a experiência deve ser chamada especificamente de sonho.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: filhos dos homens
  rationale: Preserva o idiomatismo antropológico tradicional do original e sua abrangência coletiva.
- source_word: ዕለተ፡ ደይን
  choice: dia do juízo
  rationale: Equivalente direto e corrente para o momento escatológico de julgamento.
- source_word: ስምዖ
  choice: testemunho
  rationale: Conserva o sentido documental e testemunhal do escrito de Enoque.
- source_word: አንበረ
  choice: depositou
  rationale: Comunica que o testemunho foi colocado e deixado na terra, com naturalidade em português.
theological_decisions:
- issue: Alcance da visão de Enoque
  choice: “até o dia do juízo” modifica o que sucederá às gerações humanas
  alternative: Tratar a frase apenas como indicação geral da duração da visão
  rationale: A formulação conserva a progressão do texto e não amplia o conhecimento de Enoque para além do que a fonte afirma.
- issue: Natureza da revelação no sono
  choice: “visão durante o sono”
  alternative: “sonho” ou “visão de sonho”
  rationale: Evita reduzir a experiência profética a um sonho comum e preserva a associação explícita entre visão e sono.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa clara. Mantiveram-se “sábados de anos” e “filhos dos homens” por sua relevância literária e conceitual. A reticência da camada inglesa não foi reproduzida; a continuidade truncada foi indicada por nota, pois o texto ge'ez fornecido termina em “sobre”.
