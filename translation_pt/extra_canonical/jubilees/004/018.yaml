  yaml_path: translation/extra_canonical/jubilees/004/018.yaml
  text: And at the end of the nineteenth jubilee, in the seventh week, in its sixth year, Adam died, and all his sons buried him in the land of his creation; and he was the first to be buried in the earth.
translation:
  language: pt
  text: Ele foi o primeiro a escrever um testemunho e deu testemunho aos filhos dos homens, no meio das gerações da terra. Relatou as semanas dos jubileus, deu a conhecer os dias dos anos e pôs os meses em ordem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዐ፡ ወአስምዐ
  choice: escrever um testemunho e deu testemunho
  rationale: Reproduz a linguagem correlata de testemunho presente no ge’ez e preserva sua repetição enfática.
- source_word: ለደቂቀ፡ እጓለ፡ እመሕያው
  choice: aos filhos dos homens
  rationale: Equivalente tradicional e inteligível para a expressão semítica que designa os seres humanos.
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: as semanas dos jubileus
  rationale: Mantém a terminologia cronológica própria do livro, sem interpretar as semanas como simples períodos genéricos.
- source_word: አውራኅ፡ ሰርዐ
  choice: pôs os meses em ordem
  rationale: Expressa de modo natural o ato de ordenar ou organizar os meses.
