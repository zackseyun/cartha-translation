base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/013.yaml
  text: And in the eleventh jubilee, Jared took for himself a wife whose name was Baraka, the daughter of Rasuyal,[a] a daughter of his father's brother, in the fourth week of this jubilee. And she bore him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch.
translation:
  language: pt
  text: No décimo primeiro jubileu, Jarede tomou para si uma esposa chamada Baraca, filha de Rasuyal,[a] uma filha do irmão do pai de Jarede, na quarta semana desse jubileu. Ela lhe deu à luz um filho na quinta semana, no quarto ano desse jubileu, e ele lhe deu o nome de Enoque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome Rasuyal (ራሱያል) aparece transliterado como Rasujal em algumas edições antigas.
    reason: lexical_choice
lexical_decisions:
- source_word: ያሬድ
  choice: Jarede
  rationale: Forma portuguesa tradicional e reconhecível do nome bíblico Jared.
- source_word: ባረካ
  choice: Baraca
  rationale: Transliteração natural em português do nome geʿez, preservando sua forma própria sem traduzi-lo.
- source_word: ራሱያል
  choice: Rasuyal
  rationale: Transliteração direta dos caracteres geʿez, mantendo o som de y e evitando a grafia antiga Rasujal.
- source_word: ሄኖክሃ
  choice: Enoque
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome bíblico.
- source_word: ብእሲተ
  choice: esposa
  rationale: No contexto da construção ‘tomou para si’, o substantivo designa a mulher tomada em casamento; ‘esposa’ comunica isso de modo claro e natural.
