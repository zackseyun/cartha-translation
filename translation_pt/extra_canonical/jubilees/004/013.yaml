translation_notes:
  register: Português moderno, claro e digno, com formas bíblicas tradicionais para Jarede e Enoque. A expressão genealógica ‘filha do irmão de seu pai’ foi preservada em vez de ser simplificada para ‘prima’, mantendo a formulação e a precisão do texto-fonte.
