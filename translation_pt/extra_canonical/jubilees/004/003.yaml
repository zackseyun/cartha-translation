  text: And he killed him in the field, and his blood cried out from the ground to heaven, complaining about him.
translation:
  language: pt
  text: E ele o matou no campo, e o sangue dele clamou da terra ao céu, acusando-o.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «apresentando queixa contra ele».'
    reason: Registra a possível nuance de queixa ou denúncia do verbo, ao lado da formulação judicial «acusando-o».
lexical_decisions:
- source_word: በገዳም
  choice: no campo
  rationale: Reproduz o sentido locativo tradicional de «campo» e mantém a ligação narrativa com o relato de Caim e Abel.
- source_word: ጸርኀ፡ ደሙ፡ እምድር፡ ውስተ፡ ሰማይ
  choice: o sangue dele clamou da terra ao céu
  rationale: 'Preserva de modo claro e solene o movimento expresso no texto: o sangue clama desde a terra até o céu.'
- source_word: እንዘ፡ ይስኪ፡ በእንተ
  choice: acusando-o
  rationale: Expressa naturalmente em português a ideia de apresentar queixa ou acusação a respeito do homicida, sem tornar a construção desnecessariamente pesada.
theological_decisions:
- issue: Personificação do sangue como testemunha contra o assassino
  choice: o sangue dele clamou... acusando-o
  alternative: o sangue dele clamou... queixando-se dele
  rationale: Mantém a personificação explícita e a dimensão judicial do clamor, sem explicar além do que o texto diz.
translation_notes:
  register: Português atual, claro e digno, com sintaxe próxima do original. O pronome em «acusando-o» refere-se ao assassino; a nota preserva a nuance lexical alternativa.
