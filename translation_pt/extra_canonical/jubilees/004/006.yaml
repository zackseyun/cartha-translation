lexical_decisions:
- source_word: ናየድዕ
  choice: declaramos
  rationale: Expressa o ato de tornar conhecido ou confessar abertamente; “declaramos” preserva a formulação ampla do texto sem impor um sentido litúrgico mais específico.
- source_word: መጻእነ፡ ቅድመ
  choice: ao comparecermos diante de
  rationale: Reproduz a ideia de vir à presença de alguém em português natural e digno.
- source_word: እግዚአብሔር፡ አምላክነ
  choice: Senhor, nosso Deus
  rationale: O primeiro termo é um título divino, não o nome próprio Yahweh; a aposição mantém os dois elementos da fonte.
- source_word: ኵሎ፡ ኀጢአተ
  choice: todos os pecados
  rationale: Tradução direta que conserva o alcance total expresso na fonte.
theological_decisions:
- issue: Sentido de ናየድዕ no contexto dos pecados
  choice: declaramos
  alternative: confessamos
  rationale: “Confessamos” poderia antecipar uma interpretação religiosa específica; “declaramos” mantém o sentido básico de tornar conhecido e preserva a abertura semântica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem algo marcada foi mantida para refletir a estrutura e o caráter fragmentário da unidade fornecida. “Senhor” não aparece em versalete porque a fonte traz um título divino, não o nome Yahweh.
