  terminology: “Senhor, nosso Deus” corresponde adequadamente a እግዚአብሔር፡ አምላክነ e a pontuação assinala corretamente a aposição. “Declaramos” é uma escolha semanticamente defensável para ናየድዕ e evita impor “confessamos” como leitura exclusivamente ritual.
