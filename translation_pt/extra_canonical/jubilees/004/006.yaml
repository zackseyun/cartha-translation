  source_fidelity: 'A tradução preserva os elementos da fonte: a relação causal (“E, por essa razão”), o ato de declarar/tornar conhecido, a vinda perante Deus, o título divino “Senhor, nosso Deus” e o objeto fragmentário “todos os pecados”. Não introduz o nome divino Yahweh nem restringe indevidamente o verbo a uma confissão litúrgica.'
