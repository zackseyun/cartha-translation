  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Daniel, the daughter of his father's sister; and in the sixth year of this week she bore him a son, and he called his name
translation:
  language: pt
  text: No décimo segundo jubileu, na sétima semana, ele tomou para si uma esposa chamada Edni, filha de Daniel, que era filha da irmã de seu pai. No sexto ano dessa semana, ela lhe deu um filho, e ele lhe deu o nome de…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto-fonte fornecido termina neste ponto, antes de informar o nome do filho.
    reason: Explica por que a frase permanece incompleta sem introduzir no corpo do texto conteúdo ausente da fonte apresentada.
lexical_decisions:
- source_word: በአሠርቱ፡ ወክልኤቱ፡ ኢዮቤልዉ
  choice: no décimo segundo jubileu
  rationale: Reproduz diretamente a indicação cronológica do ge'ez em português natural.
- source_word: በሳብዕ፡ ሱባዔሁ
  choice: na sétima semana
  rationale: Mantém o sistema cronológico de semanas dentro do jubileu; o possessivo é dispensável em português pelo contexto.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: tomou para si uma esposa
  rationale: Preserva a formulação semítica de contrair casamento sem torná-la excessivamente coloquial.
- source_word: እድኒ
  choice: Edni
  rationale: Transliteração próxima da forma nominal presente no texto ge'ez fornecido.
- source_word: ወለተ፡ ዳንኤል፡ ወለተ፡ እኅተ፡ አቡሁ
  choice: filha de Daniel, que era filha da irmã de seu pai
  rationale: Conserva a cadeia genealógica do texto e explicita apenas a ligação sintática necessária para que seja compreensível em português.
- source_word: ወለደት፡ ሎቱ፡ ወልደ
  choice: ela lhe deu um filho
  rationale: Expressão portuguesa natural que mantém o sentido de ela ter dado à luz um filho para ele.
- source_word: ወጸውዐ፡ ስሞ፡
  choice: e ele lhe deu o nome de…
  rationale: O trecho fornecido termina depois da fórmula de nomeação, sem registrar o nome; a redação portuguesa preserva essa incompletude.
theological_decisions:
- issue: Identidade e gênero na genealogia de Edni
  choice: “filha de Daniel, que era filha da irmã de seu pai”
  alternative: “filha de Daniel, filho da irmã de seu pai”
  rationale: O texto ge'ez repete a forma feminina ወለተ (“filha de”); não se emenda o gênero com base em expectativas acerca do nome Daniel.
- issue: Nome do filho ausente no excerto
  choice: não suprir o nome
  alternative: acrescentar “Matusalém” com base em outras testemunhas ou no contexto conhecido
  rationale: A tradução segue a evidência textual fornecida e não completa silenciosamente uma frase truncada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário cronológico coerente com Jubileus. A genealogia foi mantida literalmente onde o ge'ez apresenta uma relação feminina potencialmente inesperada.
