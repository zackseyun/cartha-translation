  yaml_path: translation/extra_canonical/jubilees/004/001.yaml
  text: And in the third week in the second jubilee she gave birth to Cain, and in the fourth she gave birth to Abel, and in the fifth she gave birth to her daughter Awan.
translation:
  language: pt
  text: Na terceira semana do segundo jubileu, ela deu à luz Caim; na quarta, deu à luz Abel; e na quinta, deu à luz sua filha Avã.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O trecho ge''ez fornecido para esta entrada está desalinhado e corresponde a material posterior, associado a Jubileus 4:4: “E o SENHOR repreendeu Caim por causa de Abel, porque o havia matado”. O texto principal apresenta o conteúdo de Jubileus 4:1 preservado pela tradição textual.'
    reason: source_misalignment
lexical_decisions:
- source_word: ወለደት (leitura esperada na tradição textual de Jubileus 4:1)
  choice: deu à luz
  rationale: Expressão natural e digna em português para o nascimento dos filhos, sem perder a repetição estrutural do relato.
- source_word: Awan (nome preservado pela tradição textual de Jubileus 4:1)
  choice: Avã
  rationale: Transliteração adaptada à leitura em português, preservando o nome próprio em vez de lhe atribuir significado não explicitado no texto.
- source_word: week / jubilee (vocabulário cronológico esperado em Jubileus 4:1)
  choice: semana / jubileu
  rationale: Mantém as unidades cronológicas características da obra e a sequência ordinal do versículo.
theological_decisions:
- issue: Identidade da mãe não repetida no recorte do versículo
  choice: ela
  alternative: Eva
  rationale: Preserva a continuidade anafórica do contexto e evita inserir no versículo um nome que o texto desta unidade não repete.
- issue: Trecho ge'ez fornecido não corresponde a Jubileus 4:1
  choice: Traduzir o conteúdo de 4:1 atestado pela tradição e sinalizar a discrepância em nota
  alternative: Traduzir o trecho fornecido como repreensão de Caim
  rationale: O trecho ge'ez apresentado pertence a material posterior, associado a Jubileus 4:4; traduzi-lo como 4:1 perpetuaria o desalinhamento identificado na revisão crítica.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo cronológico preservado. A pontuação com ponto e vírgula torna a enumeração fluida sem apagar a repetição deliberada de “deu à luz”.
