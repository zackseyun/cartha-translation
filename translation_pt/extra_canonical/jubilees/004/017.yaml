base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/017.yaml
  text: …year of the jubilee, and he called his name Enoch. He was the first among the children of men born on the earth who learned writing and knowledge and wisdom, and who wrote down the signs of heaven according to the order of their months in a book, so that they might know…
translation:
  language: pt
  text: …ano do jubileu, e chamou-o Enoque. Ele foi o primeiro entre os seres humanos nascidos na terra que aprendeu a escrita, o conhecimento e a sabedoria e que registrou num livro os sinais do céu, segundo a ordem dos meses deles, para que soubessem…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሄኖክ
  choice: Enoque
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: መጽሐፈ፡ ወትምህርተ፡ ወጥበበ
  choice: a escrita, o conhecimento e a sabedoria
  rationale: Reproduz a tríade do texto etíope em português natural, sem fundir os conceitos.
- source_word: ተአምረ፡ ሰማይ
  choice: os sinais do céu
  rationale: Mantém a expressão astronômica ampla do original, sem especificá-la como estrelas, astros ou presságios.
- source_word: በከመ፡ ሥርዐተ፡ አውራኅሆሙ
  choice: segundo a ordem dos meses deles
  rationale: Preserva o pronome plural potencialmente ambíguo ligado aos sinais celestes, em vez de explicitar uma relação não plenamente definida no fragmento.
theological_decisions:
- issue: Identidade daqueles que deveriam saber
  choice: para que soubessem
  alternative: para que os seres humanos soubessem
  rationale: O trecho fornecido termina apenas com a forma verbal plural; evita-se acrescentar um sujeito explícito que não aparece nesta porção do texto.
