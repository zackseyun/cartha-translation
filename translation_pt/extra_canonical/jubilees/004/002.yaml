  text: And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but Cain’s sacrifice was not accepted.
translation:
  language: pt
  text: Na quinta semana, ela lhe deu à luz uma filha, Avã. No primeiro ano do terceiro jubileu, Caim matou Abel, porque a oferta de Abel foi aceita, mas o sacrifício de Caim não foi aceito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋን
  choice: Avã
  rationale: Transliteração portuguesa clara do nome ge'ez, preservando a forma tradicional Awan sem anglicismo gráfico.
- source_word: ቍርባኖ
  choice: oferta
  rationale: Expressa o sentido de oferenda apresentada e mantém a distinção lexical do texto em relação a መሥዋዕቶ.
- source_word: መሥዋዕቶ
  choice: sacrifício
  rationale: Equivalente natural e formalmente distinto de “oferta”, refletindo a variação lexical do original.
- source_word: ኢዮቤሌው
  choice: jubileu
  rationale: Termo consagrado em português para a unidade cronológica empregada no livro.
theological_decisions:
- issue: Motivo da morte de Abel
  choice: “porque a oferta de Abel foi aceita, mas o sacrifício de Caim não foi aceito”
  alternative: Explicitar quem aceitou as ofertas, por exemplo, “Deus aceitou”
  rationale: O original usa formas passivas sem nomear explicitamente o agente; a tradução preserva essa formulação e não acrescenta uma identificação ausente do texto.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe direta. A repetição dos nomes Abel e Caim evita ambiguidade pronominal e corresponde à explicitação do original.
