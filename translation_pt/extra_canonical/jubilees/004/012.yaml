  text: He was the first to write a testimony[12], and he testified to the children of men among the generations of the earth, and recounted the weeks of the jubilees, and made known the days of the years, and set in order the months,
translation:
  language: pt
  text: Ele foi o primeiro a escrever um testemunho[a] e deu testemunho aos filhos dos homens, entre as gerações da terra. Relatou as semanas dos jubileus, deu a conhecer os dias dos anos e pôs os meses em ordem.
