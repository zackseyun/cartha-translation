- source_word: ስምዐ (śəmʿa)
  choice: testemunho
  rationale: Preserva o sentido jurídico e memorial de “testemunho”, bem como a ligação lexical com o verbo seguinte, “deu testemunho”; o termo também pode designar um registro escrito.
- source_word: አስምዐ (ʾasməʿa)
  choice: deu testemunho
  rationale: Reproduz em português a relação com ስምዐ e expressa a ação de tornar conhecido ou atestar o conteúdo aos seres humanos.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው
  choice: filhos dos homens
  rationale: Mantém a expressão antropológica tradicional da fonte, compreensível em português bíblico atual, sem restringi-la a um grupo específico.
- source_word: ሱባዔሆሙ፡ ለኢዮቤልውሳት
  choice: as semanas dos jubileus
  rationale: Conserva a terminologia cronológica própria do livro e a relação entre ciclos de sete e jubileus.
- source_word: አውራኅ፡ ሰርዐ
  choice: pôs os meses em ordem
  rationale: Traduz diretamente a ideia de ordenar ou organizar os meses, com formulação natural em português.
