base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/016.yaml
  text: And they did justice and uprightness upon the earth. And in the tenth jubilee[16], in the first week, Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, the daughter of his father's sister, as his wife, in the fourth year of this week; and she bore him a son in the fifth week, in the fourth year.
translation:
  language: pt
  text: E praticaram a justiça e a retidão sobre a terra. No décimo jubileu, na primeira semana, no quarto ano dessa semana, Jarede tomou para si por esposa Baraka, filha de Rasujal, filha da irmã de seu pai; e ela lhe deu à luz um filho na quinta semana, no quarto ano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍትሐ፡ ወርተዐ
  choice: a justiça e a retidão
  rationale: Conserva o par de substantivos do ge'ez e seu sentido ético, sem reduzir os dois termos a uma única ideia.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: tomou para si por esposa
  rationale: Expressa em português natural a fórmula matrimonial do texto-fonte.
- source_word: ወለተ፡ እኅተ፡ አቡሁ
  choice: filha da irmã de seu pai
  rationale: Mantém literalmente a relação de parentesco apresentada no ge'ez, identificando Baraka como prima paterna de Jarede.
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: ela lhe deu à luz um filho
  rationale: Reproduz com clareza o sujeito feminino e o objeto masculino da construção.
