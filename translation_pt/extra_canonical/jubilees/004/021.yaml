base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/021.yaml
  text: And he was still with the angels of God for six jubilees of years[21], and they showed him everything that is on the earth and in the heavens, the dominion of the sun, and he wrote down everything.
translation:
  language: pt
  text: E ele permaneceu com os anjos de Deus durante seis jubileus de anos; eles lhe mostraram tudo o que há na terra e nos céus, o domínio do sol, e ele escreveu tudo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሀሎ፡ እንከ
  choice: E ele permaneceu
  rationale: Expressa naturalmente a continuação da permanência indicada pelo verbo, sem sobrecarregar a frase com um advérbio cuja força exata é contextual.
- source_word: ምስለ፡ መላእክት፡ አምላክ
  choice: com os anjos de Deus
  rationale: Reproduz diretamente a relação genitiva do texto geʽez.
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት
  choice: durante seis jubileus de anos
  rationale: Mantém a unidade cronológica própria de Jubileus, em vez de convertê-la interpretativamente em um número de anos.
- source_word: ኵሎ፡ ዘውስተ፡ ምድር፡ ወዘበሰማያት
  choice: tudo o que há na terra e nos céus
  rationale: Formulação portuguesa clara que preserva a abrangência terrestre e celestial do original.
- source_word: ሥልጣነ፡ ለፀሐይ
  choice: o domínio do sol
  rationale: Preserva a ideia de autoridade, governo ou esfera de poder atribuída ao sol, sem reduzi-la a mero movimento astronômico.
- source_word: ወጸሐፈ፡ ኵሎ
  choice: e ele escreveu tudo
  rationale: Tradução direta e natural; o contexto permite entender que ele registrou por escrito o que lhe foi mostrado.
theological_decisions:
- issue: Identidade do sujeito
  choice: Manter o pronome «ele» sem inserir um nome
  alternative: Explicitar «Enoque»
  rationale: O geʽez emprega uma forma verbal de terceira pessoa, e o referente vem do contexto. Inserir o nome resolveria explicitamente algo que o versículo não repete.
- issue: Sentido de «domínio do sol»
  choice: Conservar a expressão sem explicação interpretativa
  alternative: Traduzir como «curso do sol» ou «leis que regem o sol»
  rationale: O termo fonte significa domínio ou autoridade; uma paráfrase astronômica estreitaria indevidamente seu alcance.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluida e preservação da terminologia cronológica e cosmológica característica da obra. O nome «Matusalém» no início do recorte geʽez foi tratado como remanescente da divisão do versículo anterior, de acordo com o conteúdo contínuo do versículo e com a camada inglesa auditada.
