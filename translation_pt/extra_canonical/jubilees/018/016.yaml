revisions:
- from: E em sua descendência serão abençoadas todas as nações da terra, porque você ouviu a minha voz; e fiz saber a todos que você me é fiel em tudo o que lhe ordenei. Vá em paz.”
  to: E em sua descendência serão abençoadas todas as nações da terra, porque você ouviu a minha voz; e fiz saber a todos que você é fiel a mim em tudo o que lhe disse. Vá em paz.”
  rationale: Substitui-se «ordenei» por «disse» para refletir o verbo geral do texto-fonte e preservar sua amplitude, sem inferir uma categoria de fala que o versículo não explicita. Ajusta-se a ordem de «fiel a mim» para maior naturalidade em português moderno.
  reviewer_model: gpt-5.6-terra
