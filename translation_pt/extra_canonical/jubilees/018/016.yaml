  text: And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to all that you are faithful to me in all that I have said to you. Go in peace.”
translation:
  language: pt
  text: E em sua descendência serão abençoadas todas as nações da terra, porque você ouviu a minha voz; e fiz saber a todos que você é fiel a mim em tudo o que lhe disse. Vá em paz.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዘርእከ
  choice: em sua descendência
  rationale: Traduz o sentido coletivo de “semente/descendência” em português natural, preservando a formulação da promessa.
- source_word: ይትባረኩ
  choice: serão abençoadas
  rationale: Mantém a forma passiva e o valor futuro do verbo no contexto da promessa.
- source_word: ዘሰማዕከ፡ ቃለ፡ ዚአየ
  choice: porque você ouviu a minha voz
  rationale: Reproduz de modo direto o idioma semítico/etiópico de ouvir a voz, que no contexto implica atenção obediente sem substituir a expressão por uma interpretação.
- source_word: ምእመን
  choice: fiel
  rationale: Expressa confiabilidade e fidelidade na relação com Deus, de acordo com o predicativo aplicado a Abraão.
- source_word: ዘእቤለከ
  choice: o que lhe ordenei
  rationale: Embora literalmente relacionado ao que foi dito, no contexto da prova a fala divina tem força de ordem; a escolha produz português claro e acompanha o sentido contextual.
- source_word: ሖር፡ በሰላም
  choice: Vá em paz
  rationale: Equivalente português corrente e digno da fórmula de despedida.
theological_decisions:
- issue: Sentido de “descendência” na promessa
  choice: em sua descendência
  alternative: por meio de sua descendência
  rationale: A preposição fonte permite conservar a expressão tradicional e sua possível amplitude sem explicitar um mecanismo teológico não declarado no verso.
- issue: Ouvir a voz como obediência
  choice: ouviu a minha voz
  alternative: obedeceu à minha voz
  rationale: Preserva a imagem verbal do texto-fonte e deixa que a implicação de obediência surja do contexto, sem eliminar a tensão lexical.
- issue: Caráter público da fidelidade de Abraão
  choice: fiz saber a todos
  alternative: mostrei a todos
  rationale: Mantém a afirmação de que Deus tornou conhecida a fidelidade de Abraão, sem especificar quem são “todos” além do que o texto diz.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” de maneira coerente com o registro contemporâneo e conserva expressões bíblicas transparentes, como “ouviu a minha voz” e “Vá em paz”.
