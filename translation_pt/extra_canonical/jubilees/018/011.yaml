  yaml_path: translation/extra_canonical/jubilees/018/011.yaml
  text: And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your firstborn, from me.”
translation:
  language: pt
  text: 'E eu lhe disse: “Não estenda a mão contra o rapaz nem lhe faça coisa alguma, pois agora sei que você teme a Deus e não me recusou o seu filho, o seu primogênito.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto digitalizado apresenta aqui “sua descendência”, mas a edição impressa traz “seu primogênito”.
    reason: Documenta uma divergência causada por erro de digitalização sem introduzi-la silenciosamente no texto principal.
lexical_decisions:
- source_word: ወእቤሎ
  choice: E eu lhe disse
  rationale: A forma verbal é a primeira pessoa do singular, coerente com a fala do anjo narrador a Moisés.
- source_word: ሕፃን
  choice: rapaz
  rationale: No contexto de Isaque, designa o jovem; “rapaz” é natural e evita a conotação de bebê que “criança” pode sugerir.
- source_word: አትፈኑ፡ እዴከ፡ ዲበ
  choice: Não estenda a mão contra
  rationale: Preserva a imagem idiomática do texto-fonte e expressa claramente uma ação hostil.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: teme a Deus
  rationale: Mantém a formulação teológica tradicional e a amplitude semântica de temor, reverência e obediência.
- source_word: ወኢምሕከ
  choice: e não me recusou
  rationale: Expressa de modo corrente a ideia de não reter ou negar alguém a quem o exige.
- source_word: በኵረከ (leitura da edição impressa; digitalizado como በዘረከ)
  choice: o seu primogênito
  rationale: Segue a leitura da edição impressa de Charles, confirmada no contexto, em vez do erro de digitalização “sua descendência”.
theological_decisions:
- issue: Identidade do falante
  choice: 'Primeira pessoa: “eu lhe disse”'
  alternative: 'Terceira pessoa: “ele lhe disse”'
  rationale: A forma ge'ez ወእቤሎ é de primeira pessoa, e o Anjo da Presença narra o episódio a Moisés.
- issue: Objeto não recusado
  choice: “seu filho, o seu primogênito”
  alternative: “seu filho, sua descendência”
  rationale: A leitura “primogênito” pertence à edição impressa; “descendência” resulta de erro no texto digitalizado fornecido. A aposição preserva os dois elementos da leitura crítica sem fundi-los.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para fluidez brasileira e boa inteligibilidade internacional. A construção conserva a imagem “estender a mão contra” e a tensão teológica de “temer a Deus” sem explicá-la no corpo do versículo.
