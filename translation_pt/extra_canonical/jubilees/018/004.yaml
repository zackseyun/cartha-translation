  yaml_path: translation/extra_canonical/jubilees/018/004.yaml
  text: And he saw the place from afar. And he came as far as the well of water, and he said to his servants, “Stay here with the donkeys, and I and the boy will go on, and we will worship, and we will return to you.”
translation:
  language: pt
  text: 'Ele viu o lugar de longe. Chegou até o poço de água e disse aos seus servos: “Fiquem aqui com os jumentos. Eu e o menino iremos adiante, adoraremos e voltaremos para junto de vocês.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መካነ
  choice: o lugar
  rationale: Corresponde diretamente a ‘lugar’ e preserva a referência não especificada do texto.
- source_word: ዐዘቅተ፡ ማይ
  choice: poço de água
  rationale: Expressão natural em português para a locução etíope, sem perder a menção explícita à água; ‘cisterna de água’ continua possível.
- source_word: አድግት
  choice: os jumentos
  rationale: O substantivo está no plural; evita harmonização indevida com o singular de Gênesis 22:5 em outras tradições textuais.
- source_word: ሕፃን
  choice: o menino
  rationale: Neste contexto, designa o filho jovem que acompanha Abraão; ‘menino’ é corrente e digno.
- source_word: ሰጊደነ
  choice: adoraremos
  rationale: O verbo denota prostração ou adoração; no contexto cultual, ‘adoraremos’ comunica adequadamente a ação.
theological_decisions:
- issue: Declaração de retorno no plural
  choice: “voltaremos”
  alternative: “retornaremos” ou uma formulação que sugira apenas a volta de Abraão
  rationale: O verbo fonte está na primeira pessoa do plural. A tradução conserva a tensão narrativa sem explicar se a fala expressa expectativa, intenção ou outra nuance teológica.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém a sequência narrativa simples do ge’ez, usa ‘jumentos’ no plural conforme a fonte e evita harmonização com Gênesis 22:5.
