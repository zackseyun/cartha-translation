  yaml_path: translation/extra_canonical/jubilees/018/012.yaml
  text: And Prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, one ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: pt
  text: E o Príncipe Mastema foi envergonhado. E Abraão levantou os olhos e viu, e eis que um carneiro estava preso pelos chifres no matagal. E Abraão foi, pegou o carneiro e o ofereceu como holocausto em lugar de seu filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትገፍረ
  choice: foi envergonhado
  rationale: Reproduz o sentido passivo de sofrer vergonha ou humilhação, sem acrescentar uma explicação sobre a causa.
- source_word: መኰንን፡ መስተማ
  choice: o príncipe Mastema
  rationale: Traduz o título መኰንን como “príncipe” e conserva Mastema como nome próprio.
- source_word: አሐዱ፡ በሐኵ
  choice: um carneiro
  rationale: Representa አሐዱ, “um”, de modo idiomático em português; neste contexto, o artigo numeral já identifica um único carneiro.
- source_word: አኀዝ፡ በዕፀው፡ በአቅርንቲሁ
  choice: estava preso pelos chifres no matagal
  rationale: Mantém tanto o local quanto o modo pelo qual o carneiro estava retido.
- source_word: አዕረገ፡ ለጽንሓሕ
  choice: o ofereceu como holocausto
  rationale: Emprega o termo bíblico corrente “holocausto” para a oferta inteiramente queimada.
- source_word: ህየንተ፡ ወልዱ
  choice: em lugar de seu filho
  rationale: Expressa diretamente a substituição indicada pelo texto.
theological_decisions:
- issue: A humilhação de Mastema
  choice: foi envergonhado
  alternative: ficou frustrado
  rationale: A escolha preserva a afirmação explícita de vergonha/humilhação e evita reduzir o sentido a mera frustração.
- issue: Caráter substitutivo do sacrifício
  choice: em lugar de seu filho
  alternative: no lugar do seu filho
  rationale: Mantém de forma clara a relação substitutiva do carneiro, sem desenvolver implicações doutrinárias além do texto.
translation_notes:
  register: Português moderno, claro e digno, com terminologia bíblica amplamente reconhecível. A construção deíctica “e eis” foi vertida naturalmente por “viu que”, sem perda do conteúdo visual; “Então” torna fluida a progressão narrativa.
