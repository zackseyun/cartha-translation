  text: And he kept this festival every year for seven days with joy, and he named it the Festival of the LORD, according to the seven days during which he had gone and returned in peace.
translation:
  language: pt
  text: E ele celebrava essa festa todos os anos, durante sete dias, com alegria; e deu-lhe o nome de Festa do SENHOR, conforme os sete dias durante os quais tinha ido e voltado em paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብር
  choice: celebrava
  rationale: No contexto de uma festa anual, o verbo com sentido básico de “fazer” é expresso naturalmente em português por “celebrar”.
- source_word: በፍሥሓ
  choice: com alegria
  rationale: Reproduz de modo claro o sentido de júbilo ou regozijo associado à observância da festa.
- source_word: በዓለ፡ እግዚአብሔር
  choice: Festa do SENHOR
  rationale: Mantém a designação cultual do texto e representa o nome divino segundo a convenção portuguesa em versaletes.
- source_word: በሰላም
  choice: em paz
  rationale: Preserva a formulação simples e teologicamente aberta do original, sem ampliá-la para “em segurança”.
theological_decisions:
- issue: Relação dos sete dias com a nomeação da festa
  choice: por causa dos sete dias em que tinha ido e voltado em paz
  alternative: conforme os sete dias durante os quais tinha ido e voltado em paz
  rationale: “Por causa de” comunica naturalmente a relação explicativa indicada pelo contexto, sem impor uma identificação ritual mais específica.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. O aspecto habitual anual foi explicitado por “celebrava ... todos os anos”; a sequência narrativa foi preservada sem acrescentar interpretação.
