  text: And thus it is ordained and written on the heavenly tablets concerning Israel and his seed, that they should keep this festival seven days with festal joy.
translation:
  language: pt
  text: 'E assim está determinado e escrito nas tábuas celestiais a respeito de Israel e de sua descendência: que celebrem esta festa durante sete dias, com alegria festiva.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com alegria de festa”.'
    reason: Registra uma tradução mais literal da expressão final, que repete o termo correspondente a “festa”.
lexical_decisions:
- source_word: ሤሩዕ፡ ... መጽሐፍ
  choice: está determinado e escrito
  rationale: Reproduz a combinação entre algo estabelecido ou prescrito e seu registro escrito, em português natural, sem reduzir um dos dois aspectos.
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Mantém a imagem concreta tradicional das tábuas pertencentes ao âmbito celestial.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: Expressa o sentido coletivo de 'semente' aplicado aos descendentes de Israel, com clareza em português moderno.
- source_word: ለገቢረ፡ ዛቲ፡ በዓል
  choice: que celebrem esta festa
  rationale: O verbo literalmente ligado a 'fazer' assume aqui o sentido idiomático de observar ou celebrar uma festa; 'celebrem' é natural e preserva a função cultual.
- source_word: በፍሥሓ፡ በዓል
  choice: com alegria festiva
  rationale: Conserva tanto a alegria quanto a segunda referência explícita à festa, evitando a perda lexical de traduzir apenas 'com alegria'.
theological_decisions:
- issue: Força normativa do registro celestial
  choice: está determinado e escrito
  alternative: está ordenado e escrito
  rationale: '''Determinado'' preserva a ideia de algo estabelecido no registro celestial sem impor necessariamente a nuance mais forte de uma ordem direta.'
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível ao público geral. A expressão “alegria festiva” preserva a repetição semântica do termo “festa” no original, enquanto a nota oferece a forma mais literal.
