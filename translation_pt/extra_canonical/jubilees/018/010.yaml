  text: And I called to him from heaven and said to him, “Abraham, Abraham.” And he was terrified and said, “Here I am.”
translation:
  language: pt
  text: 'Então eu o chamei do céu e lhe disse: “Abraão, Abraão!” Ele ficou aterrorizado e respondeu: “Aqui estou.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸዋዕክዎ
  choice: eu o chamei
  rationale: Expressa diretamente a ação de chamar, preservando a primeira pessoa do narrador e o objeto masculino.
- source_word: እምሰማይ
  choice: do céu
  rationale: Reproduz de modo natural a origem da voz indicada pela preposição e pelo substantivo ge'ez.
- source_word: ወይገብዕ
  choice: ele ficou aterrorizado
  rationale: Mantém o sentido contextual de temor ou recuo diante da voz celestial, atestado para ገብዐ nesta passagem, em vez da leitura anterior 'apressou-se'.
- source_word: ነየ፡ አነ
  choice: Aqui estou
  rationale: Equivalente idiomático português da fórmula de disponibilidade e resposta à chamada.
theological_decisions:
- issue: Reação de Abraão à voz celestial
  choice: ele ficou aterrorizado
  alternative: ele se apressou
  rationale: A escolha preserva a expansão narrativa própria de Jubileus e segue o valor lexical contextual indicado pela evidência ge'ez, sem suavizar o temor de Abraão.
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. Usou-se “Então” para dar continuidade narrativa ao waw inicial; a repetição enfática do nome foi preservada.
