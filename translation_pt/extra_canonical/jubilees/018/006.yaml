  yaml_path: translation/extra_canonical/jubilees/018/006.yaml
  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: pt
  text: 'E Isaque disse a seu pai: “Pai!” Ele respondeu: “Aqui estou, meu filho.” Então Isaque lhe disse: “Veja: o fogo, a faca e a lenha; mas onde está a ovelha para o holocausto, pai?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጥባሕት
  choice: faca
  rationale: Designa o instrumento de abate; “faca” é natural e clara em português, sem acrescentar especificidade não exigida pelo texto.
- source_word: ዕፀው
  choice: lenha
  rationale: Embora o termo se relacione a madeira, no contexto sacrificial trata-se da madeira destinada ao fogo; “lenha” expressa naturalmente essa função.
- source_word: በግዕ
  choice: cordeiro
  rationale: O termo pode designar uma ovelha ou animal ovino; “cordeiro” é idiomático neste contexto e mantém a conhecida formulação sacrificial, embora a idade do animal não esteja plenamente explicitada.
- source_word: ጽንሓሕ
  choice: holocausto
  rationale: Termo português tradicional e amplamente reconhecido para a oferta inteiramente queimada, preservando o sentido cultual específico.
theological_decisions:
- issue: Identidade e idade do animal sacrificial
  choice: cordeiro
  alternative: ovelha
  rationale: O contexto aponta para um ovino destinado ao holocausto, mas o termo-fonte não torna a idade inequívoca. “Cordeiro” foi adotado por naturalidade bíblica, sem fazer disso uma afirmação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com pontuação que preserva a progressão dialogal e a tensão da pergunta de Isaque. O imperativo “Veja” representa de modo natural o marcador de atenção “eis”.
