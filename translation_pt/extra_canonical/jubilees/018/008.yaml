  yaml_path: translation/extra_canonical/jubilees/018/008.yaml
  text: And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.
translation:
  language: pt
  text: E ele construiu o altar, colocou a lenha sobre o altar, amarrou seu filho Isaque e o deitou sobre a lenha que estava em cima do altar. Então estendeu a mão para pegar a faca, a fim de sacrificar seu filho Isaque.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሥዋዕ
  choice: altar
  rationale: O substantivo designa o altar; a repetição foi preservada por corresponder à progressão solene da narrativa.
- source_word: ዕፀወ / ዕፀው
  choice: lenha
  rationale: Neste contexto sacrificial, o plural referente à madeira preparada para o altar é expresso naturalmente em português como “lenha”.
- source_word: መጥባሕተ
  choice: faca
  rationale: Designa o instrumento cortante empregado no sacrifício; “faca” é claro e natural, sem especificar além do texto.
- source_word: ይዝብሖ
  choice: sacrificar
  rationale: O verbo tem o sentido concreto de matar ou imolar ritualmente. “Sacrificar” preserva o contexto cultual e produz uma formulação digna e corrente.
theological_decisions:
- issue: Descrição da ação pretendida contra Isaque
  choice: “a fim de sacrificar”
  alternative: “para degolar” ou “para matar”
  rationale: A escolha mantém tanto a realidade da morte pretendida quanto seu contexto sacrificial, sem suavizar a tensão narrativa nem acrescentar interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação narrativa do ge’ez foi mantida, mas dividida em duas frases para maior clareza em português.
