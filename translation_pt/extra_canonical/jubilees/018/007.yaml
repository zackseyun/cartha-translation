  yaml_path: translation/extra_canonical/jubilees/018/007.yaml
  text: And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.
translation:
  language: pt
  text: 'E ele disse: “Deus verá para si[a] a ovelha para o holocausto, meu filho.” E aproximou-se do lugar no monte do SENHOR.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Neste contexto, “verá para si” também pode dar a entender “providenciará para si”.
    reason: Esclarece a possível conotação contextual do verbo sem substituir seu sentido expresso no texto principal.
lexical_decisions:
- source_word: ይሬኢ፡ ሎቱ
  choice: verá para si
  rationale: Mantém o sentido primário de ‘ver’ e a construção reflexiva do ge'ez, sem apagar a possível conotação contextual de que Deus providenciará a vítima.
- source_word: በግዐ
  choice: a ovelha
  rationale: Traduz o termo genérico para ovino sem especificar indevidamente ‘cordeiro’ ou ‘carneiro’.
- source_word: ለጽንሓሕ
  choice: para o holocausto
  rationale: Emprega o termo bíblico corrente para uma oferta sacrificial inteiramente queimada.
- source_word: ደብረ፡ እግዚአብሔር
  choice: monte do SENHOR
  rationale: Reproduz a relação nominal do texto e representa o título divino de modo tradicional e reconhecível.
theological_decisions:
- issue: A fala pode significar tanto que Deus ‘verá’ quanto, por implicação, que Deus ‘providenciará’ a vítima.
  choice: Conservar ‘verá’ no texto e explicar a implicação em nota.
  alternative: Traduzir diretamente ‘Deus providenciará para si’.
  rationale: A opção preserva a formulação explícita da fonte ge'ez e sua tensão semântica, sem impor apenas a leitura providencial.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe bíblica moderada. ‘Holocausto’ é mantido por sua precisão sacrificial; ‘SENHOR’ identifica de modo convencional o título divino.
