  yaml_path: translation/extra_canonical/jubilees/018/015.yaml
  text: And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your firstborn, your beloved one, from me, surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.”
translation:
  language: pt
  text: 'E ele disse: “Jurei por mim mesmo, diz o SENHOR: porque você fez isso e não me privou de seu filho, seu primogênito, a quem você ama,[a] eu certamente o abençoarei e multiplicarei grandemente sua descendência, como as estrelas do céu e como a areia à beira-mar. Sua descendência tomará posse das cidades de seus inimigos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “seu filho, seu primogênito, seu amado, de mim”.'
    reason: A expressão relativa pode ser expressa em português como oração (“a quem você ama”) ou como aposição afetiva (“seu amado”), preservando a sequência alternativa.
lexical_decisions:
- source_word: በርእስየ
  choice: por mim mesmo
  rationale: Expressa de modo natural a fórmula enfática de juramento, literalmente ligada à própria pessoa de quem jura.
- source_word: ዘንተ፡ ቃለ
  choice: isso
  rationale: A expressão pode ser vertida literalmente como “esta palavra/coisa”, mas aqui se refere ao ato que Abraão praticou; “isso” é natural e fiel ao contexto.
- source_word: በኵረከ (leitura da edição; o texto digital traz በዘረከ)
  choice: seu primogênito
  rationale: Segue a leitura confirmada da edição de Charles, em vez do erro de reconhecimento óptico presente na transcrição digital.
- source_word: ዘአፍቀርከ
  choice: a quem você ama
  rationale: Mantém a oração relativa e o aspecto afetivo do original sem transformá-la apenas em um adjetivo.
- source_word: ዘርአከ
  choice: sua descendência
  rationale: O substantivo singular coletivo designa os descendentes; “descendência” preserva esse valor melhor que “semente” no português corrente.
- source_word: ይወርሱ
  choice: tomará posse
  rationale: No contexto de cidades inimigas, o verbo de herdar/possuir comunica aquisição efetiva; “tomará posse” é idiomático e preserva a ideia central.
- source_word: አህጉረ
  choice: cidades
  rationale: Neste contexto, o termo refere-se aos centros ou territórios urbanos dos inimigos, em paralelo com a tradição textual de Gênesis 22:17.
theological_decisions:
- issue: Forma intensiva da promessa de bênção e multiplicação
  choice: eu certamente o abençoarei e multiplicarei grandemente
  alternative: abençoando, eu o abençoarei; e multiplicando, multiplicarei
  rationale: Reproduz em português natural a força enfática das construções cognatas sem criar uma formulação artificial.
- issue: Referente singular coletivo de “descendência”
  choice: Sua descendência tomará posse
  alternative: Seus descendentes tomarão posse
  rationale: Conserva o singular coletivo do texto-fonte e evita restringir indevidamente o alcance do termo.
translation_notes:
  register: Português moderno, digno e acessível, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A repetição semítica foi representada por intensificadores naturais, e a sequência “filho, primogênito, amado” foi mantida sem harmonização doutrinária.
