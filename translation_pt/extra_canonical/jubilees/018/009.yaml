  yaml_path: translation/extra_canonical/jubilees/018/009.yaml
  text: And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”
translation:
  language: pt
  text: 'E eu me pus diante dele e diante do anjo Mastema, e o SENHOR disse: “Diga-lhe que não estenda a mão contra o menino e que não lhe faça coisa alguma, pois agora sei que ele teme a Deus.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቆምኩ
  choice: me pus diante
  rationale: Expressa de modo natural o ato de tomar posição na presença de alguém, preservando o sentido do verbo ‘estar de pé’ no contexto.
- source_word: መስተማ
  choice: Mastema
  rationale: Mantém a forma tradicional do nome próprio presente no texto-fonte.
- source_word: ኢያውርድ፡ እዴሁ፡ ላዕለ፡ ሕፃን
  choice: não estenda a mão contra o menino
  rationale: Reproduz a expressão concreta do ge’ez em português idiomático; ‘contra’ explicita a intenção hostil indicada pelo contexto, sem identificar uma ação específica.
- source_word: ኢይግበር፡ ምዝገኒ፡ ላዕሌሁ
  choice: não lhe faça coisa alguma
  rationale: Preserva a proibição abrangente e indefinida do original.
- source_word: ፈራሄ፡ እግዚአብሔር
  choice: teme a Deus
  rationale: Mantém a linguagem bíblica tradicional de reverência e obediência a Deus, sem paráfrase interpretativa.
theological_decisions:
- issue: A declaração divina de conhecimento
  choice: pois agora sei
  alternative: pois sei agora
  rationale: Conserva diretamente o ‘agora sei’ do texto e sua tensão teológica, sem reinterpretá-lo como mera demonstração pública ou confirmação.
- issue: Identidade daquele que teme a Deus
  choice: ele teme a Deus
  alternative: ele é alguém que teme a Deus
  rationale: A formulação verbal é natural em português e preserva o predicado do original sem acrescentar uma classificação teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega ‘SENHOR’ para o título divino e conserva ‘príncipe Mastema’. A sintaxe foi levemente naturalizada sem eliminar a repetição solene da cena.
