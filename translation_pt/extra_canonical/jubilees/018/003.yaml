  text: And he rose early in the morning and saddled his donkey, and he took two servants with him, and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.
translation:
  language: pt
  text: E levantou-se de madrugada, selou seu jumento e levou consigo dois servos e seu filho Isaque. Rachou a lenha para o holocausto e partiu para o lugar no terceiro dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አድጎ
  choice: seu jumento
  rationale: O substantivo designa o animal de carga; “jumento” é natural e tradicional neste contexto.
- source_word: ደቂቀ
  choice: servos
  rationale: No contexto, refere-se aos dois jovens subordinados que o acompanham; “servos” comunica sua função com clareza.
- source_word: መሥዋዕተ
  choice: holocausto
  rationale: O termo sacrificial no contexto corresponde à oferta inteiramente queimada; “holocausto” mantém a terminologia bíblica corrente.
- source_word: ሰፀረ
  choice: rachou
  rationale: Expressa a ação de partir a madeira em pedaços, de modo idiomático em português.
- source_word: በሠሉስ፡ ዕለት
  choice: No terceiro dia
  rationale: Tradução direta da expressão temporal preservada no fim do versículo pela segmentação da edição.
