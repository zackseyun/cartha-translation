  text: And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go to the high land, and offer him up on one of the mountains that I will show you.”
translation:
  language: pt
  text: 'E o SENHOR disse a Abraão: “Abraão, Abraão!” Ele respondeu: “Aqui estou.” Então o SENHOR disse: “Tome seu filho, seu amado, a quem você ama, Isaque, e vá para a terra elevada[a]. Ofereça-o[b] sobre um dos montes que eu lhe mostrarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “terra alta”.'
    reason: Registra uma alternativa natural para o adjetivo que qualifica a terra.
  - marker: b
    text: Literalmente, “faça-o subir”.
    reason: Preserva a imagem verbal do ge'ez por trás do sentido sacrificial “ofereça-o”.
lexical_decisions:
- source_word: ምድር፡ ልዐልት
  choice: terra elevada
  rationale: A expressão é formada por substantivo e adjetivo feminino e significa literalmente uma terra alta ou elevada; esta formulação é natural em português e evita a leitura gramaticalmente inadequada de “terra da altura”.
- source_word: ወአዕርጎ
  choice: Ofereça-o
  rationale: O causativo do verbo relacionado a “subir” pode expressar fazer subir como oferta. “Ofereça-o” comunica o sentido sacrificial sem acrescentar o advérbio “ali”, ausente do texto-fonte; a imagem literal é preservada em nota.
- source_word: ፍቁረከ፡ ዘታፈቅር
  choice: seu amado, a quem você ama
  rationale: Mantém a repetição afetiva deliberada do original, em vez de condensá-la em uma única expressão.
- source_word: ነየ፡ አነ
  choice: Aqui estou
  rationale: Equivalente idiomático atual da fórmula de prontidão e presença, preservando sua concisão solene.
theological_decisions:
- issue: Designação divina እግዚአብሔር
  choice: SENHOR
  alternative: Deus / o Senhor
  rationale: Segue o valor tradicional e contextual da designação divina nesta narrativa e a convenção editorial apresentada na camada de consulta, sem inserir uma identificação denominacional adicional.
- issue: Natureza exata da oferta de Isaque
  choice: Ofereça-o
  alternative: ofereça-o em holocausto
  rationale: O verbo indica fazê-lo subir/oferecê-lo, mas o termo específico para “holocausto” não aparece neste texto ge'ez; a tradução evita explicitar além da evidência lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservam-se a repetição “Abraão, Abraão” e a sequência enfática “seu filho, seu amado, a quem você ama”. O tratamento por “você” mantém clareza contemporânea sem coloquialismo excessivo.
