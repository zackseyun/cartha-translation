  yaml_path: translation/extra_canonical/jubilees/018/005.yaml
  text: And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together to that place.
translation:
  language: pt
  text: E tomou a lenha da oferta e a pôs sobre Isaque, seu filho. Tomou também na mão o fogo e a faca, e os dois foram juntos até aquele lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀወ፡ መሥዋዕት
  choice: a lenha da oferta
  rationale: Mantém a relação explícita entre a lenha e a oferta, sem restringir o termo a uma formulação sacrificial mais específica do que o texto exige.
- source_word: አስከሞ
  choice: a pôs sobre
  rationale: Expressa de modo natural o ato de colocar a carga sobre Isaque.
- source_word: መጥባሕት
  choice: faca
  rationale: Equivalente claro e corrente para o instrumento cortante levado por Abraão no contexto.
- source_word: ኅቡረ፡ ክልኤሆሙ
  choice: os dois foram juntos
  rationale: Reproduz enfaticamente tanto a companhia quanto o número dos viajantes.
- source_word: እስክ፡ ውእቱ፡ መካን
  choice: até aquele lugar
  rationale: Conserva o valor direcional/terminativo da expressão ge'ez e a referência ao lugar já determinado.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. A repetição do verbo “tomou” e a expressão “os dois foram juntos” foram preservadas por sua função narrativa. “Oferta” foi mantido em vez de explicitar “holocausto”, evitando acrescentar uma especificação não inequívoca neste texto.
