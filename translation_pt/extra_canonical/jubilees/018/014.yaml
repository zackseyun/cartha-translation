  text: And the LORD called to Abraham by name a second time from heaven, as he had shown me, that we should speak in the name of the LORD.
translation:
  language: pt
  text: E o SENHOR chamou Abraão pelo nome, pela segunda vez, do céu, como ele me havia mostrado que falássemos em nome do SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸውዖ
  choice: chamou
  rationale: Reproduz diretamente o verbo de chamar, mantendo o ato de convocação ou pronunciamento dirigido a Abraão.
- source_word: በስሙ
  choice: pelo nome
  rationale: Preserva a expressão instrumental do texto, indicando que Abraão foi chamado pelo nome.
- source_word: ዳግመ
  choice: pela segunda vez
  rationale: Expressa de modo natural e preciso a ideia de repetição.
- source_word: እምሰማይ
  choice: desde o céu
  rationale: Mantém a origem celeste da voz; «desde» soa natural neste contexto narrativo.
- source_word: ከመ፡ ንትናገር
  choice: para que falássemos
  rationale: Conserva a forma verbal na primeira pessoa do plural e a relação de finalidade possível introduzida pela conjunção.
- source_word: በስመ፡ እግዚአብሔር
  choice: em nome do SENHOR
  rationale: Equivalência formal da expressão, sem ampliar sua possível função profética ou representativa.
theological_decisions:
- issue: Identidade do sujeito de «ele me havia mostrado»
  choice: Manter o pronome «ele» sem identificar explicitamente o referente
  alternative: Substituir por «o SENHOR»
  rationale: O texto contém o pronome e não exige que a tradução resolva expressamente seu referente.
- issue: Valor da conjunção antes de «falássemos»
  choice: 'Traduzir como finalidade: «para que»'
  alternative: 'Traduzir como conteúdo ou resultado: «que» / «de modo que»'
  rationale: A construção admite nuance final, refletida de maneira inteligível em português, embora o encadeamento permaneça incomum.
- issue: Primeira pessoa do plural em «falássemos»
  choice: Preservar a primeira pessoa do plural
  alternative: Regularizar para a terceira pessoa ou para o singular
  rationale: A forma plural faz parte da tensão textual e não deve ser harmonizada com outra versão da narrativa.
translation_notes:
  register: Português moderno, claro e digno, com «SENHOR» em versaletes convencionais representadas por maiúsculas. A sintaxe ligeiramente incomum da oração final foi preservada por refletir o texto-fonte.
