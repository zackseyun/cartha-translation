  source_fidelity: 'A tradução preserva os elementos principais: o chamado divino, Abraão nomeado, a repetição, a procedência celeste e a primeira pessoa do plural na oração final. Contudo, «para que» fixa como finalidade uma relação que o ge''ez e a trilha inglesa deixam menos determinada; é mais seguro vinculá-la diretamente ao que foi mostrado.'
  naturalness: «Desde o céu» é compreensível, mas «do céu» é a formulação narrativa idiomática em português. A redação revista mantém a leve incomumidade do enunciado sem criar uma finalidade explícita desnecessária.
  terminology: «SENHOR», «Abraão», «pelo nome» e «em nome do SENHOR» são adequados e consistentes. Mantém-se o pronome não especificado em «ele me havia mostrado», sem resolver seu referente.
