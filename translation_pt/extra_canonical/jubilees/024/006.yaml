base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/006.yaml
  text: '"Swear to me today." And he swore to him. And Jacob gave Esau his brother bread and stew, and he ate until he was satisfied. And Esau sold his birthright. Therefore his name was called Edom, because of the wheat stew that Jacob gave him in exchange for his birthright.'
translation:
  language: pt
  text: “Jure para mim hoje.” E Esaú lhe jurou. Então Jacó deu a Esaú, seu irmão, pão e ensopado; Esaú comeu até ficar satisfeito. Esaú vendeu seu direito de primogenitura. Por isso, recebeu o nome de Edom, por causa do ensopado de trigo[a] que Jacó lhe deu em troca de seu direito de primogenitura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez diz “trigo”; em Gênesis 25:34, o ensopado é de lentilhas.
    reason: Esclarece uma diferença textual relevante e evita que o leitor suponha que “trigo” seja uma harmonização ou um erro.
lexical_decisions:
- source_word: መሐል፡ ሊተ፡ ዮም
  choice: Jure para mim hoje
  rationale: Reproduz de forma direta e natural a ordem para prestar juramento naquele mesmo dia.
- source_word: ወመጠ፡ ዔሳው፡ ቀዳሙ፡ ትውልዶ
  choice: Esaú vendeu seu direito de primogenitura
  rationale: O verbo indica alienar ou vender, não desprezar; a expressão seguinte designa a prerrogativa ligada ao nascimento como primogênito.
- source_word: ተብሰለ፡ ስርናይ
  choice: ensopado de trigo
  rationale: ስርናይ significa trigo. A tradução evita harmonizar o texto com as lentilhas de Gênesis 25.
- source_word: በቅድመተ፡ ልደቱ
  choice: em troca de seu direito de primogenitura
  rationale: Expressa em português corrente a relação de troca entre a comida e a prerrogativa de primogênito.
theological_decisions:
- issue: Caracterização da atitude de Esaú para com a primogenitura
  choice: vendeu seu direito de primogenitura
  alternative: desprezou seu direito de primogenitura
  rationale: A opção segue o verbo do texto ge'ez e não importa para este versículo a formulação interpretativa de Gênesis 25:34.
- issue: Identificação do ensopado associado ao nome Edom
  choice: ensopado de trigo
  alternative: ensopado vermelho de lentilhas
  rationale: O texto ge'ez menciona explicitamente trigo e não contém aqui os termos para vermelho ou lentilhas; a tensão com o relato de Gênesis deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão ampla no espaço lusófono. Evitou-se a formulação excessivamente literal “seu nome foi chamado”, preferindo-se “recebeu o nome”, sem alterar o sentido.
