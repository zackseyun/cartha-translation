  rationale: Substituiu-se «foi morar junto ao» por «foi morar no», para refletir fielmente que Isaque habitou no lugar designado pelo topônimo, sem introduzir a noção de proximidade. A ligação «partiu de Hebrom e foi morar» conserva de modo idiomático a sequência de partida, ida e residência. A âncora da nota permanece imediatamente após o topônimo a que se refere.
