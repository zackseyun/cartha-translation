  terminology: «o Senhor», «Isaque», «Hebrom», «Poço da Visão» e «jubileu» são escolhas consistentes e adequadas. A nota preserva prudentemente a distinção entre a tradução literal do topônimo e uma identificação tradicional mais desenvolvida.
