base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/001.yaml
  text: And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision[a] in the first year of the third week of this jubilee.
translation:
  language: pt
  text: Depois que Abraão morreu, o Senhor abençoou Isaque, seu filho. Isaque partiu de Hebrom e foi morar no Poço da Visão[a], no primeiro ano da terceira semana deste jubileu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O nome do lugar foi traduzido literalmente do ge'ez como «Poço da Visão». É provável que corresponda ao local conhecido em Gênesis, mas a tradução evita inserir no texto principal a forma tradicional mais extensa do nome.
    reason: cross_reference
lexical_decisions:
- source_word: እግዚአብሔር
  choice: o Senhor
  rationale: É a designação divina no texto ge'ez; «o Senhor» preserva o uso bíblico tradicional sem acrescentar uma identificação não explicitada pela forma da fonte.
- source_word: ዐዘቅተ፡ ራእይ
  choice: Poço da Visão
  rationale: Tradução literal do nome do lugar, preservando a forma específica do ge'ez e evitando importar para o texto principal o nome tradicional mais extenso de Gênesis.
- source_word: ወኀደረ
  choice: foi morar junto a
  rationale: Expressa de modo natural a ideia de estabelecer residência ou permanecer no local; «junto ao» é idiomático em português para morar nas proximidades de um poço.
- source_word: በዓመት፡ አሐዱ፡ ዘሣልስ፡ ሱባዔ፡ ዘዝ
  choice: no primeiro ano da terceira semana deste jubileu
  rationale: Reproduz a fórmula cronológica do sistema de jubileus sem acrescentar «sete anos», expressão que não integra o fechamento desta fórmula no texto fornecido.
theological_decisions:
- issue: Referente de «seu filho» e sujeito da ação seguinte
  choice: Encerrar a primeira frase com «Isaque, seu filho» e repetir «Isaque» no início da segunda
  alternative: «o Senhor abençoou seu filho Isaque. E ele partiu...»
  rationale: A repetição esclarece naturalmente que Isaque é quem parte de Hebrom, sem alterar o conteúdo nem deixar um pronome potencialmente ambíguo em português.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A abertura formulaica foi condensada em «Depois da morte de Abraão» para maior naturalidade, e o nome do lugar foi mantido em tradução literal.
