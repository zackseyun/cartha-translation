  naturalness: O português é claro e de registro bíblico moderno. “Em tua descendência” e “teu pai” tornam explícito que Deus se dirige diretamente a Isaque; “preceitos” oferece uma designação mais idiomática para o primeiro item da lista sem eliminar as distinções subsequentes.
  terminology: 'A lista jurídica mantém cinco itens distintos: preceitos, mandamentos, leis, estatutos e aliança. “Semanas de anos” é preservado no texto, enquanto a nota fornece o cálculo sem o impor como substituição textual.'
