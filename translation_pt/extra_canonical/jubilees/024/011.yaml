  text: By your seed all the nations of the earth will be covenant.[a] And now your father obeyed my voice and kept my charge and my commandments and my laws and my statutes and my covenant. And now, listen to my voice and dwell in this land." And he dwelt in Gerar three weeks of years. And Abimelech gave command concerning him
translation:
  language: pt
  text: Em tua descendência, todas as nações da terra serão abençoadas, porque teu pai obedeceu à minha voz e guardou os meus preceitos, os meus mandamentos, as minhas leis, os meus estatutos e a minha aliança.[a] E agora, ouve a minha voz e habita nesta terra.” E ele habitou em Gerar durante três semanas de anos.[b] Abimeleque deu ordens a respeito dele
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A enumeração jurídica no discurso divino é densa e contém termos parcialmente sobrepostos. A tradução conserva os cinco elementos distintos, em vez de reuni-los sob um único termo, como “leis”.
    reason: segmentation_note
  - marker: b
    text: Isto é, três períodos de sete anos, ou vinte e um anos.
    reason: chronology_clarification
lexical_decisions:
- source_word: በዘርእከ
  choice: Por meio da sua descendência
  rationale: Expressa o sentido instrumental da preposição e verte 'semente' pelo termo coletivo natural 'descendência'.
- source_word: ዘሰምዐ ... ቃለ ዚአየ
  choice: porque seu pai obedeceu à minha voz
  rationale: Embora o verbo tenha o sentido básico de 'ouvir', no contexto da guarda dos mandamentos ele denota escuta obediente.
- source_word: ዑቃቤየ፡ ወትእዛዛትየ፡ ወሕገጊየ፡ ወሥርዐትየ፡ ወኪዳንየ
  choice: a minha ordem, os meus mandamentos, as minhas leis, os meus estatutos e a minha aliança
  rationale: Mantém separados os cinco termos jurídicos do texto ge'ez, sem omitir 'minhas leis' nem fundir a enumeração.
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመት
  choice: três semanas de anos
  rationale: Preserva a expressão cronológica tradicional, equivalente a três períodos de sete anos, sem substituir no texto por um cálculo interpretativo.
- source_word: ወአዘዘ፡ አቤሜሌክ፡ በእንቲአሁ
  choice: Abimeleque deu ordens a respeito dele
  rationale: Conserva a formulação transitiva e incompleta no fim do segmento, que continua no versículo seguinte.
theological_decisions:
- issue: Sentido da bênção das nações na descendência
  choice: todas as nações da terra serão abençoadas
  alternative: todas as nações da terra abençoarão a si mesmas
  rationale: A forma recebida e o paralelo da promessa favorecem a leitura passiva, sem especificar aqui o mecanismo teológico da bênção.
- issue: Relação causal com a obediência do pai
  choice: porque seu pai obedeceu à minha voz
  alternative: e seu pai obedeceu à minha voz
  rationale: A construção introduz a obediência paterna como fundamento expresso da declaração precedente; a tradução mantém essa tensão textual sem reformulá-la doutrinariamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o paralelismo do discurso divino, a lista jurídica completa, a expressão antiga 'semanas de anos' e o término sintaticamente aberto, pois a frase prossegue no versículo seguinte.
