  text: And to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And they will bless themselves
translation:
  language: pt
  text: E à sua descendência darei toda esta terra e confirmarei o juramento que fiz a Abraão, seu pai. Multiplicarei sua descendência como as estrelas do céu e darei à sua descendência toda esta terra. E eles se abençoarão.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E eles serão abençoados”. O trecho fornecido termina aqui; o sujeito não é explicitado nesta oração.'
    reason: Preservar a ambiguidade entre os sentidos reflexivo e passivo e não importar palavras da continuação do texto.
lexical_decisions:
- source_word: ዘርእከ (zarʾəka)
  choice: sua descendência
  rationale: O termo significa literalmente “semente”, mas, neste contexto de promessa genealógica, “descendência” comunica naturalmente o sentido coletivo sem limitar o número ou importar uma interpretação posterior.
- source_word: አቀውም (ʾaqawwəm)
  choice: confirmarei
  rationale: O verbo tem o sentido de estabelecer, firmar ou fazer permanecer. “Confirmarei o juramento” é português natural e conserva a ideia de dar validade firme ao juramento já feito.
- source_word: መሐላየ (maḥālayə)
  choice: o juramento
  rationale: Representa diretamente o substantivo “juramento”, com o sufixo possessivo expresso pelo contexto verbal em português.
- source_word: ይትባረኩ (yətbāraku)
  choice: se abençoarão
  rationale: A forma permite leitura reflexiva ou passiva. A construção pronominal portuguesa preserva em alguma medida essa abertura, enquanto a nota registra explicitamente a alternativa passiva.
theological_decisions:
- issue: Sentido reflexivo ou passivo da forma final ይትባረኩ
  choice: E eles se abençoarão
  alternative: E eles serão abençoados
  rationale: A forma etíope admite mais de uma análise, e o trecho fornecido termina nesse verbo. A tradução principal mantém a leitura reflexiva da camada inglesa auditada, sem eliminar a leitura passiva possível.
- issue: Identidade do antecedente de “eles” na oração final truncada
  choice: Manter apenas “eles”, sem explicitar o referente
  alternative: Acrescentar “todas as nações da terra”
  rationale: A expressão “todas as nações da terra” não consta no segmento ge'ez fornecido e aparentemente pertence à continuação. Acrescentá-la resolveria indevidamente uma lacuna causada pela divisão do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “descendência” em vez do literal “semente”, e evitou-se completar a oração final com palavras ausentes do texto-fonte fornecido.
