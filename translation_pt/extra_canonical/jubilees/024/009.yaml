  text: And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and sojourn in that land, and I will be with you and bless you. For to you
translation:
  language: pt
  text: 'E o SENHOR lhe apareceu e lhe disse: “Não desça ao Egito. Habite na terra que eu lhe disser e viva como estrangeiro nessa terra; estarei com você e o abençoarei. Pois a você[a]…”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto fornecido deste versículo termina aqui, no meio da frase; a promessa continua no trecho seguinte.
    reason: Assinala que a tradução termina onde termina a fonte disponibilizada e não completa a frase por conjectura.
lexical_decisions:
- source_word: ኢትረድ፡ ግብጸ
  choice: Não desça ao Egito
  rationale: Reproduz diretamente a proibição e o movimento de descida expressos no ge’ez.
- source_word: ንበር፡ ውስተ፡ ምድር
  choice: Habite na terra
  rationale: Mantém a ordem positiva de residir na terra, em linguagem portuguesa natural e digna.
- source_word: ፍልስ፡ ውስተ፡ ይእቲ፡ ምድር
  choice: viva como estrangeiro nessa terra
  rationale: Preserva o sentido de permanência como residente temporário ou estrangeiro, distinguindo-o do simples ato de habitar.
- source_word: ወእሄሉ፡ ምስሌከ
  choice: Eu estarei com você
  rationale: Tradução direta da promessa de presença divina, com sintaxe corrente.
- source_word: ወእባርከከ
  choice: e o abençoarei
  rationale: Expressa de modo direto a bênção prometida ao destinatário masculino.
theological_decisions:
- issue: Representação do nome/título divino እግዚአብሔር
  choice: SENHOR
  alternative: Senhor / Deus
  rationale: Segue a convenção do texto de consulta e conserva o título divino sem acrescentar uma identificação denominacional não explicitada.
- issue: Caráter temporário da residência
  choice: viva como estrangeiro
  alternative: permaneça / fique
  rationale: Evita apagar a tensão entre habitar na terra e nela residir como estrangeiro, presente no vocabulário da fonte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e ampla compreensão internacional. Emprega tratamento por “você”, conforme o registro corrente do projeto, e preserva a repetição de “terra” e a distinção entre habitar e viver como estrangeiro. As reticências marcam a interrupção material da fonte fornecida, não uma pausa retórica do original.
