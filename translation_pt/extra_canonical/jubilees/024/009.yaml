  to: 'E o SENHOR lhe apareceu e lhe disse: “Não desça ao Egito. Habite na terra que eu lhe disser e viva como estrangeiro nessa terra; estarei com você e o abençoarei. Pois a você[a]…”'
  rationale: A revisão torna a formulação mais idiomática, restitui «que eu lhe disser» como equivalente mais próximo do verbo da fonte e posiciona a nota antes das reticências para marcar com precisão o ponto de truncamento. Mantêm-se «SENHOR», o tratamento por «você» e «viva como estrangeiro», todos compatíveis com a fonte e com o registro do projeto.
