  naturalness: 'O português é claro, atual e apropriado ao registro narrativo. Ajustes leves melhoram a precisão sem sacrificar fluência: «o altar que Abraão... havia construído anteriormente» evita introduzir a ideia de lugar; «opróbrio» mantém a dicção solene e o sentido de reprovação pública.'
