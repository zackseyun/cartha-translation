revisions:
- from: 'depois da morte de Abraão e os encheram de terra. Abimeleque disse a Isaque: “Afaste-se de nós, pois você se tornou muito mais poderoso do que nós”. Isaque partiu dali no primeiro ano da sétima semana e acampou no vale de Gerar. Tornaram a cavar os poços de água que os servos de Abraão, seu pai, haviam cavado e que os filisteus tinham entulhado depois da morte de Abraão, seu pai; e deram-lhes os mesmos nomes que Abraão, seu pai, lhes havia dado. Os servos de Isaque cavaram um poço no vale e encontraram água viva. Então os pastores de Gerar discutiram com os pastores de Isaque, dizendo: “A água é nossa”. Isaque deu àquele poço o nome de Contenda, porque contenderam conosco. Cavaram outro poço e também discutiram por causa dele; por isso Isaque lhe deu o nome de Hostilidade. Ele partiu dali e cavou outro poço. Como não discutiram por causa dele, deu-lhe o nome de Lugar Amplo. Isaque disse: “Agora o SENHOR abriu espaço para nós, e seremos fecundos na terra”.


    Dali ele subiu ao Poço do Juramento, no primeiro ano da primeira semana do quadragésimo quarto jubileu. Naquela noite, ao raiar do primeiro dia do primeiro mês, o SENHOR lhe apareceu e disse: “Eu sou o Deus de Abraão, seu pai. Não tenha medo, pois estou com você. Eu o abençoarei e multiplicarei grandemente sua descendência, como a areia da terra, por causa de Abraão, meu servo”. Isaque construiu ali um altar, no lugar onde Abraão, seu pai, havia construído o primeiro; invocou o nome do SENHOR e ofereceu um sacrifício ao Deus de Abraão, seu pai. Cavaram um poço e encontraram água viva. Os servos de Isaque cavaram outro poço, mas não encontraram água. Foram contar a Isaque que não haviam encontrado água, e ele disse: “Hoje jurei aos filisteus, e isso nos aconteceu”. Deu àquele lugar o nome de Poço do Juramento, porque ali jurou a Abimeleque, a Auzate, companheiro deste, e a Ficol, comandante do seu exército. Naquele dia, Isaque compreendeu que havia jurado sob coação para fazer paz com
    eles.


    Naquele mesmo dia, Isaque amaldiçoou os filisteus, dizendo: “Malditos sejam os filisteus, com ira e indignação, entre todas as nações. Que o SENHOR os entregue à humilhação, à maldição, à ira e à indignação, nas mãos de nações pecadoras, nas mãos dos quitim. E os que escaparem da espada do inimigo e dos quitim, que um povo justo os extermine em juízo[a] de debaixo do céu, pois eles serão inimigos e odiarão meus filhos ao longo de suas gerações sobre a terra. Não lhes restará sobrevivente algum, nem quem escape no dia do julgamento da ira. Pois toda a descendência dos filisteus está destinada à destruição, ao desenraizamento e à eliminação da terra; e já não restará a esses caftoritas remanescente nem descendência sobre a terra. Ainda que algum deles suba ao céu, de lá será trazido para baixo; se afundar na terra, de lá será arrastado; se esconder entre as nações, de lá será desenraizado; e, se descer ao Sheol, também ali seu julgamento aumentará, e não haverá paz para ele. Se for levado
    ao cativeiro, os que procuram tirar-lhe a vida o matarão no meio do caminho. Não lhe restarão nome nem descendência em toda a terra, pois irá para a maldição eterna”.


    Assim está escrito e decretado a respeito dele nas tábuas celestiais: que isso lhe seja feito no dia do julgamento, para que seja desenraizado da terra.'
