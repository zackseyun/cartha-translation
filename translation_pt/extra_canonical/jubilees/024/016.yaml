lexical_decisions:
- source_word: ማየ፡ ሕይወ፡
  choice: água viva
  rationale: Mantém a expressão concreta do ge’ez para água proveniente de fonte ou corrente, sem reduzi-la apenas a uma explicação técnica.
- source_word: ዕፁብ፡
  choice: Contenda
  rationale: Traduz o nome etiológico do poço pelo sentido exigido pela explicação seguinte.
- source_word: ጽልአ፡
  choice: Hostilidade
  rationale: Expressa o sentido de inimizade ou hostilidade do nome, distinguindo-o de “Contenda”.
- source_word: ስፍሐ፡
  choice: Lugar Amplo
  rationale: Reproduz o jogo entre o nome do poço e a afirmação de que o SENHOR abriu espaço.
- source_word: ዐዘቅተ፡ መሐላ፡
  choice: Poço do Juramento
  rationale: Traduz o topônimo de modo transparente e preserva sua ligação narrativa com o juramento.
- source_word: ኪጢኤም፡
  choice: quitim
  rationale: Mantém o etnônimo tradicional, sem identificar de modo especulativo o povo histórico referido.
- source_word: ክፍቶር፡
  choice: caftoritas
  rationale: Emprega a forma portuguesa reconhecível para os descendentes de Caftor.
