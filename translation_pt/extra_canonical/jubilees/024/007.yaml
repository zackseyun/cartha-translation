  verdict: approve
  source_fidelity: A tradução segue a leitura restaurada de Charles, necessária porque a cadeia ge'ez fornecida contém corrupção de OCR. «Cresceu» representa adequadamente ወአህቀ; «guardou o mandamento de seu pai» representa ወኀለወ ትእዛዘ አቡሁ; e «mas Esaú o rejeitou» preserva o contraste e o sujeito de ወዔሳውሰ ዐበየ. «Houve fome na terra» é fiel à construção existencial. A oração final permanece truncada e com sujeito não expresso, como no trecho-fonte e na trilha inglesa.
  naturalness: O português é moderno, claro e apropriado ao registro narrativo. «Esaú o rejeitou» tem antecedente inequívoco no mandamento. A frase final incompleta é intencional e deve ser mantida, pois o recorte da fonte também termina com o verbo.
  terminology: «Mandamento», «guardou», «fome», «Jacó» e «Esaú» são escolhas estáveis, naturais e adequadas. Não há imposição interpretativa ou teológica.
