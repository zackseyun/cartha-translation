  text: And Jacob grew up, and kept the command of his father, but Esau rejected it. And there was famine upon the land, and he came
translation:
  language: pt
  text: E Jacó cresceu e guardou o mandamento de seu pai, mas Esaú o rejeitou. Houve fome na terra, e ele veio
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአህቀ
  choice: E Jacó cresceu
  rationale: O verbo indica crescer ou chegar à maturidade; o nome Jacó, preservado pela tradição textual corrigida e pelo contexto, explicita o sujeito em português.
- source_word: ወኀለወ ትእዛዘ አቡሁ
  choice: e guardou o mandamento de seu pai
  rationale: ኀለወ significa guardar ou observar; esta leitura segue o texto de Charles corrigido, pois a forma fornecida apresenta corrupção de OCR.
- source_word: ወዔሳውሰ ዐበየ
  choice: mas Esaú o rejeitou
  rationale: A partícula contrastiva e o verbo ዐበየ apresentam Esaú em contraste com Jacó, recusando o mandamento.
- source_word: ወኮነ ዐባር ዲበ ምድር
  choice: Houve fome na terra
  rationale: Tradução idiomática e direta da construção existencial; ዐባር designa fome ou escassez severa.
- source_word: ወመጽአ
  choice: e ele veio
  rationale: Mantém o sujeito pronominal não explicitado e a oração inacabada do trecho-fonte, sem antecipar o versículo seguinte.
theological_decisions:
- issue: Quem observa e quem rejeita o mandamento paterno
  choice: Jacó guarda o mandamento; Esaú o rejeita
  alternative: Jacó se afasta do mandamento de seu pai
  rationale: A leitura corrigida do texto de Charles contém ኀለወ, “guardou”, e menciona Esaú como aquele que rejeitou. A alternativa deriva de texto corrompido por OCR e inverte o sentido.
- issue: Referente do pronome na oração final
  choice: Preservar “ele” sem identificar o referente
  alternative: Nomear Isaque ou outro personagem com base no contexto seguinte
  rationale: O verbo está na terceira pessoa masculina singular, mas este fragmento não nomeia o sujeito; preservar a ambiguidade evita acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe acessível. A oração final permanece deliberadamente incompleta, como no fragmento fornecido. A tradução segue a leitura textual corrigida registrada na revisão, já que o texto ge'ez apresentado contém uma grave corrupção de OCR.
