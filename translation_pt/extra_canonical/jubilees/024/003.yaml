  yaml_path: translation/extra_canonical/jubilees/024/003.yaml
  text: And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this wheat stew." And Jacob said to him, "Sell me your firstborn birthright."
translation:
  language: pt
  text: 'E Jacó cozinhou um ensopado de lentilhas. Esaú veio do campo, com fome, e disse a Jacó, seu irmão: “Dê-me um pouco deste ensopado de trigo[a]”. Jacó lhe respondeu: “Venda-me o seu direito de primogenitura”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto em ge’ez diz literalmente “ensopado de trigo”, embora o prato preparado por Jacó seja chamado de “ensopado de lentilhas” na frase anterior.
    reason: Preserva e explica a aparente discrepância lexical do texto-fonte, evitando harmonização silenciosa.
lexical_decisions:
- source_word: ተብሰለ፡ ብርስን
  choice: cozinhou um ensopado de lentilhas
  rationale: A expressão identifica claramente o primeiro prato como um cozido ou ensopado de lentilhas; a formulação portuguesa é natural e mantém a informação lexical.
- source_word: ርኁብ
  choice: com fome
  rationale: Equivale a “faminto/com fome”; “com fome” é corrente, claro e não exagera a intensidade.
- source_word: ተብሰል፡ ዘሥርናይ
  choice: ensopado de trigo
  rationale: O ge’ez identifica literalmente o prato pedido por Esaú como sendo de trigo ou cereal. A tradução preserva essa diferença textual, sem harmonizá-la com as lentilhas da frase anterior.
- source_word: ልህቃኒከ፡ ዘቅድመ፡ ልደት
  choice: seu direito de primogenitura
  rationale: A expressão se refere à condição ou prerrogativa ligada ao primeiro nascimento. “Direito de primogenitura” transmite isso de modo idiomático e preciso em português, sem interpretar ቅድመ como o advérbio temporal “primeiro”.
theological_decisions:
- issue: Natureza do que Jacó exige de Esaú
  choice: direito de primogenitura
  alternative: posição de primogênito / prerrogativa do primeiro nascimento
  rationale: A escolha mantém o conceito jurídico-familiar tradicional do texto sem especificar indevidamente quais bênçãos, herança ou privilégios ele incluía.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A estrutura narrativa foi levemente naturalizada (“voltou do campo”), enquanto a peculiar alternância entre lentilhas e trigo foi mantida e assinalada em nota.
