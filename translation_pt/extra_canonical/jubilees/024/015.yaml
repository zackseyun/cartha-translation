lexical_decisions:
- source_word: መእተ፡ ስዊተ
  choice: cem vezes mais
  rationale: Expressa de modo natural a ideia de uma colheita multiplicada por cem, preservando o valor quantitativo do texto.
- source_word: ዐብየ፡ ይስሐቅ፡ ፈድፋደ
  choice: Isaque tornou-se muito poderoso
  rationale: O verbo indica que Isaque se engrandeceu, intensificado por 'muitíssimo'; 'poderoso' comunica aqui sua crescente grandeza e prosperidade sem soar fisicamente descritivo.
- source_word: ቀንኡ፡ ላዕሌሁ
  choice: tiveram inveja dele
  rationale: Reproduz diretamente a reação dos filisteus contra Isaque.
- source_word: ደፈንዎ
  choice: os taparam
  rationale: Mantém o sentido concreto de fechar ou obstruir os poços, em português corrente.
