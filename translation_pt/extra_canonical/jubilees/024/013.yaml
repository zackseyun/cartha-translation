lexical_decisions:
- source_word: ለይሙት
  choice: Que ele certamente morra
  rationale: A construção intensiva expressa uma sentença enfática de morte; em português atual, “certamente” preserva essa força sem tornar a frase artificial.
- source_word: በፍልስጥኤም
  choice: na Filístia
  rationale: O termo é um topônimo e indica o lugar onde Isaque prosperou, não simplesmente convivência entre os filisteus.
- source_word: ጥሪት፡ ብዙኅ
  choice: muitos bens
  rationale: A expressão designa propriedade ou posses em abundância; “muitos bens” é natural, amplo e adequado ao registro narrativo.
