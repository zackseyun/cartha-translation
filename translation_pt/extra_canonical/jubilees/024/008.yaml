base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024/008.yaml
  text: Isaac was going to go down to Egypt in the second year of this week, and he went to Gerar, to Abimelech king of the Philistines.
translation:
  language: pt
  text: Isaque estava para descer ao Egito no segundo ano desta semana[a], e foi a Gerar, a Abimeleque, rei dos filisteus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «da sexta semana».'
    reason: O ge'ez traz literalmente «desta semana»; «sexta semana» é uma identificação contextual alternativa.
lexical_decisions:
- source_word: ይረድ
  choice: estava para descer
  rationale: O imperfeito expressa intenção ou ação iminente, não uma descida concluída; a formulação também preserva o fato narrativo de que Isaque não chegou ao Egito.
- source_word: ዘዝ፡ ሱባዔ
  choice: desta semana
  rationale: Traduz diretamente o demonstrativo ge'ez «esta», sem substituí-lo pela interpretação contextual «sexta».
- source_word: ወሖረ
  choice: mas foi
  rationale: O perfeito indica movimento efetivamente realizado. «Mas» explicita em português o contraste narrativo entre o plano de descer ao Egito e a ida a Gerar.
- source_word: ኀበ፡ ንጉሠ፡ ፍልስጥኤም፡ ጌራርገ፡ ኀበ፡ አቤሜሌክ
  choice: a Gerar, a Abimeleque, rei dos filisteus
  rationale: Mantém os dois complementos de destino e associa naturalmente o título real a Abimeleque.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes em formas portuguesas correntes. A construção «estava para descer» comunica intenção iminente sem sugerir que Isaque de fato entrou no Egito.
