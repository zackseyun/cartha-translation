base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/027.yaml
  text: For I see, and behold, the demons have begun to lead you and your children astray. And now I fear for you, that after my death you will shed human blood upon the earth, and you too will be destroyed from the face of the earth.
translation:
  language: pt
  text: 'Pois eu vejo e eis que os demônios já começaram a desencaminhar vocês e seus filhos. E agora temo por vocês: depois da minha morte, vocês derramarão sangue humano sobre a terra e também serão destruídos da face da terra.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አጋንንት
  choice: os demônios
  rationale: Equivalente direto e natural do termo ge'ez para seres demoníacos.
- source_word: አበሱተ ወጠኑ
  choice: já começaram a desencaminhar
  rationale: Preserva o aspecto incoativo da expressão e o sentido causativo de levar ao erro, sem especificar uma forma de engano não indicada pelo texto.
- source_word: ትክዐዉ ደመ ሰብእ
  choice: vocês derramarão sangue humano
  rationale: Reproduz a expressão concreta do original, em vez de substituí-la simplesmente por “matarão”.
- source_word: ትደመሰሱ
  choice: serão apagados
  rationale: Conserva a imagem forte de eliminação ou extinção, que se completa na locução “da face da terra”.
theological_decisions:
- issue: A atuação dos demônios sobre os descendentes de Noé
  choice: “começaram a desencaminhar vocês e seus filhos”
  alternative: “começaram a seduzir vocês e seus filhos”
  rationale: “Desencaminhar” expressa influência moral maléfica sem introduzir conotação sexual nem definir o mecanismo dessa influência.
- issue: Caráter da declaração sobre o derramamento de sangue
  choice: 'futuro declarativo: “vocês derramarão”'
  alternative: 'modal: “vocês poderão derramar”'
  rationale: O ge'ez apresenta a ação temida de modo direto; a tradução não enfraquece a advertência convertendo-a em mera possibilidade.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para clareza internacional e boa legibilidade brasileira. A abertura foi formulada com fluidez, mantendo a progressão entre visão, temor, derramamento de sangue e destruição.
