translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “A fronteira” foi acrescentado como referente contextual mínimo para tornar inteligível a série de movimentos geográficos; os topônimos antigos foram preservados, e as ambiguidades relevantes aparecem em notas.
