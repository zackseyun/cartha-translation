base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/015.yaml
  text: This sea is named the tongue of the Egyptian Sea. And it extends from there northward to the mouth of the Great Sea, at the waters' edge, and it goes along toward the west to Afra, and it goes on until it approaches the waters of the Gihon River, on the north side of the waters of Gihon.
translation:
  language: pt
  text: Este mar se chama Língua do Mar do Egito. Dali, ele se estende para o norte, em direção à embocadura do Grande Mar, à beira das águas; depois segue para o oeste, até Afra,[a] e continua até se aproximar das águas do rio Giom,[b] pelo lado norte das águas do Giom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível: “para o oeste de Afra”.'
    reason: A sequência geográfica admite, embora menos provavelmente, que Afra determine a posição ocidental em vez de ser o destino do movimento.
  - marker: b
    text: 'Ou: “das águas de Giom, o rio”.'
    reason: A relação sintática entre “águas”, “Giom” e “rio” pode ser reproduzida de maneira mais literal, mas menos natural em português.
lexical_decisions:
- source_word: ልሳነ፡ ባሕረ፡ ገብጽ
  choice: Língua do Mar do Egito
  rationale: Mantém literalmente o topônimo geográfico composto, sem substituí-lo por uma identificação moderna incerta.
- source_word: አፉሃ፡ ለባሕር፡ ዐቢይ
  choice: embocadura do Grande Mar
  rationale: አፉሃ significa literalmente “sua boca”; “embocadura” expressa de modo natural a referência geográfica, enquanto “Grande Mar” preserva o nome tradicional.
- source_word: ውስተ፡ ክናፍረ፡ ማያት
  choice: junto à margem das águas
  rationale: A expressão envolve os “lábios/bordas das águas”; “margem” comunica em português o sentido topográfico sem estranheza excessiva.
- source_word: መንገበ፡ ዐረብ፡ ዐፍራ
  choice: para o oeste, até Afra
  rationale: Trata ዐረብ como direção ocidental e ዐፍራ como destino, em conformidade com a sintaxe e a revisão da evidência-fonte.
- source_word: ማየ፡ ጊዮን፡ ፈለገ
  choice: águas do rio Giom
  rationale: Explicita o valor de ፈለገ (“rio”) e usa a forma portuguesa corrente “Giom”.
