base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/001.yaml
  text: In the twenty-ninth jubilee, in the first week, in its first year, Arpachshad took a wife for himself, and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bore him
translation:
  language: pt
  text: No vigésimo nono jubileu[a], na primeira semana, em seu primeiro ano, Arfaxade tomou para si uma mulher chamada Rasueia, filha de Susan, filha de Elão, e ela lhe deu à luz[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A edição fornecida parece trazer “quadragésimo nono”; a cronologia interna do livro favorece “vigésimo nono”.
