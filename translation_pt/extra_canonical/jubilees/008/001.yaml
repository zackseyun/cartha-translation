  - marker: b
    text: A frase se completa no versículo seguinte.
    reason: Esclarece por que a oração de nascimento termina sem o complemento expresso neste versículo.
lexical_decisions:
- source_word: አርፋክስድ
  choice: Arfaxade
  rationale: Forma portuguesa tradicional e reconhecível do nome semítico Arpachshad.
- source_word: ራሱእያ
  choice: Rasueia
  rationale: Transliteração portuguesa legível, conservando de perto a sequência consonantal e vocálica do nome ge'ez.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: tomou para si uma mulher
  rationale: Reproduz a expressão matrimonial do texto-fonte com linguagem natural, sem acrescentar uma cerimônia ou conceito denominacional.
- source_word: ወወለደት፡ ሎቱ
  choice: e ela lhe deu à luz
  rationale: Mantém a oração final e sua ligação com o complemento que aparece no versículo seguinte, evitando suprimi-la ou antecipar esse complemento.
