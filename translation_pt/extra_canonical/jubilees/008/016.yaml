base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/016.yaml
  text: And it goes toward the border of this river, and it goes toward the east until it approaches the garden of Eden, toward its north, to the north, and from the east of all the land of Eden, and to all the east, and it turns within the east and comes until it approaches the east of the mountain whose name is
translation:
  language: pt
  text: E segue em direção ao limite deste rio e vai para o leste, até se aproximar do jardim do Éden, pelo lado norte dele, rumo ao norte; e, do leste de toda a terra do Éden e por todo o leste, volta-se para dentro do leste e avança até se aproximar do lado leste do monte cujo nome é
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንገበ፡ ድንጋጉ፡ ለዝ፡ ፈለግ
  choice: em direção à margem deste rio
  rationale: መንገበ indica direção; ድንጋጉ é entendido como a margem ou limite dele, e ለዝ፡ ፈለግ identifica o referente como “deste rio”, não como nome próprio.
- source_word: መንገበ፡ ጽባሕ
  choice: para o leste
  rationale: Traduz a locução direcional de modo natural, preservando o sentido geográfico.
- source_word: ገነት፡ ዘኤዶም
  choice: jardim do Éden
  rationale: Forma portuguesa consagrada para a expressão, sem acrescentar interpretação.
- source_word: መንገበ፡ ሰሜኑ፡ ለሰሜን
  choice: pelo lado norte dele, rumo ao norte
  rationale: Mantém separadas a referência ao norte do jardim e a direção para o norte, evitando condensá-las em “nordeste”.
- source_word: ወእምጽባሒሃ፡ ለኵላ፡ ምድረ፡ ኤዶም
  choice: e, desde o leste de toda a terra do Éden
  rationale: Preserva a preposição “desde/de” e a referência explícita a toda a terra do Éden.
- source_word: ወይትመየጥ፡ ውስተ፡ ጽባሕ
  choice: volta-se dentro do oriente
  rationale: Conserva a formulação espacial incomum do texto em vez de normalizá-la silenciosamente.
- source_word: መንገበ፡ ጽባሒሁ፡ ለደብር
  choice: do lado leste do monte
  rationale: Expressa a direção em relação ao lado oriental do monte, não simplesmente movimento “para o monte”.
