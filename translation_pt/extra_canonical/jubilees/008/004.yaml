translation:
  language: pt
  text: …e a lua e as estrelas, em todos os sinais do céu. E ele o escreveu e nada disse a respeito…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto impresso traz literalmente “e falou a respeito”; a tradução segue a provável correção para “e não falou a respeito”. O trecho fornecido começa no fim da frase anterior.
    reason: Registra tanto a emenda textual adotada quanto o problema de segmentação do versículo.
lexical_decisions:
- source_word: ትእምረ
  choice: sinais
  rationale: Corresponde ao sentido básico de “sinal” e preserva a linguagem celeste do texto sem explicitar “presságios”, que não aparece neste segmento.
- source_word: ጸሐፋ
  choice: o escreveu
  rationale: Verbo de escrever com objeto pronominal implícito, mantido de modo natural em português.
- source_word: አነገረ
  choice: nada disse a respeito
  rationale: Segue a provável leitura corrigida ወኢነገረ indicada pela crítica textual e pelo contexto; a forma transmitida sem a negação significaria “e contou/falou”.
theological_decisions:
- issue: Possível referência à astrologia ou a presságios
  choice: “sinais do céu”
  alternative: “presságios do céu”
  rationale: O trecho fornecido diz literalmente “sinais”; evita-se inserir uma avaliação religiosa ou uma prática divinatória que só fica explícita no contexto anterior.
- issue: Negação conjectural no último verbo
  choice: “e nada disse a respeito” no texto principal
  alternative: “e falou a respeito”
  rationale: A leitura com negação é considerada provável diante do erro gráfico indicado e da tradição de tradução, mas a forma efetivamente impressa deve ser registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com reticências para indicar que o fragmento começa e termina no meio do contexto. A formulação mantém a ambiguidade de “sinais” e não acrescenta material ausente do trecho ge'ez fornecido.
