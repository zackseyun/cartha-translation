    issue: «Ela lhe deu um filho» é ambíguo em português.
    rationale: Embora possa ser entendido como “deu-lhe um filho” no sentido de gerar, também pode significar que ela lhe entregou uma criança. A locução «deu-lhe à luz um filho» explicita o sentido do verbo-fonte sem acrescentar conteúdo.
  - severity: low
    issue: «Dessa semana» atenua o demonstrativo do original.
    rationale: O ge'ez diz literalmente “desta semana”; a forma proximal é preferível no contexto narrativo sem alterar o sistema cronológico.
