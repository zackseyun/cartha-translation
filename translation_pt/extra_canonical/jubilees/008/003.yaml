base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/003.yaml
  text: And his father taught him writing. And he went to seek for himself a place where he might seize a city for himself. And he found a writing which the ancients had cut on a rock, and he read what was in it. And he copied it, and he found from what was in it that there was in it the teaching of the Watchers, by which they used to observe the omens of the sun.
translation:
  language: pt
  text: E seu pai lhe ensinou a escrita. Ele foi procurar para si um lugar onde pudesse tomar posse de uma cidade. Encontrou um escrito que os antigos haviam gravado numa rocha e leu o que nele estava. Então o copiou e descobriu, pelo que nele estava escrito, que continha o ensinamento dos Vigilantes, pelo qual eles observavam os presságios do sol.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽሐፈ
  choice: a escrita / um escrito
  rationale: O substantivo pode designar escrita, livro ou documento. No primeiro contexto, refere-se à habilidade ensinada pelo pai; no segundo, ao texto gravado na rocha.
- source_word: ይእኅዝ
  choice: tomar posse de
  rationale: Expressa a ideia de apoderar-se ou ocupar; esta formulação preserva o sentido sem sugerir necessariamente violência militar explícita.
- source_word: ዘቈረጹ
  choice: haviam gravado
  rationale: Literalmente envolve cortar ou entalhar; 'gravado' é natural para inscrições feitas numa rocha.
- source_word: ወአዕለዎ
  choice: Então o copiou
  rationale: 'Segue a leitura lexical indicada pelo ge''ez e pela revisão crítica: ele transcreveu o escrito, não apenas o compreendeu.'
- source_word: ትጉሃን
  choice: Vigilantes
  rationale: Termo tradicional para os seres conhecidos como Watchers na literatura enoquita, preservando sua função como designação de grupo.
- source_word: ሰገለ፡ ፀሓይ
  choice: presságios do sol
  rationale: Representa a prática divinatória ligada à observação de sinais ou augúrios solares; 'presságios' mantém a conotação do contexto.
theological_decisions:
- issue: Natureza do ensinamento dos Vigilantes
  choice: ensinamento dos Vigilantes
  alternative: doutrina dos anjos vigilantes
  rationale: Mantém a designação própria do texto sem identificar explicitamente sua natureza angelical nem acrescentar interpretação teológica.
- issue: Função dos sinais solares
  choice: observavam os presságios do sol
  alternative: observavam os sinais do sol
  rationale: '''Presságios'' comunica a dimensão divinatória provável, enquanto a construção conserva que os próprios Vigilantes praticavam essa observação.'
translation_notes:
  register: Português moderno, claro e digno, com fluidez brasileira e compreensão internacional. A repetição semítica foi moderadamente suavizada, sem omitir nenhuma ação narrativa. Não foi incorporada a frase 'E o menino cresceu', ausente do texto ge'ez fornecido.
