base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/037.yaml
  text: Before the altar that is accepted. And in the fifth year make a release, so that you may release it.
translation:
  language: pt
  text: Diante do altar que é aceito. E, no quinto ano, façam uma remissão, para que o liberem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto transmitido traz literalmente “fizeram uma remissão”; a tradução segue a provável leitura imperativa, “façam”, de acordo com a segunda pessoa do plural em “liberem”. O verbo final também pode significar “deixem-no”.
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: ምሥዋዕ (məśwāʿ)
  choice: altar
  rationale: O substantivo designa o altar; “oferta” corresponderia normalmente a uma forma nominal distinta.
- source_word: ዘይትወከፍ (zaytəwakkaf)
  choice: que é aceito
  rationale: Preserva a construção relativa passiva e evita especificar quem aceita o altar.
- source_word: ኅድገት (ḥədgat)
  choice: remissão
  rationale: Expressa o ato de soltar, deixar ou dispensar, mantendo o sentido institucional sugerido pelo contexto do quinto ano.
- source_word: ታሕድግዎ (tāḥdəgewwo)
  choice: o liberem
  rationale: Conserva a segunda pessoa do plural e o objeto pronominal, além da relação lexical com “remissão”.
theological_decisions:
- issue: Referente e agente da aceitação
  choice: “altar que é aceito”
  alternative: “altar aceitável” ou “altar que ele aceita”
  rationale: A formulação passiva mantém a indeterminação do agente presente no texto-fonte.
- issue: Forma verbal ገበሩ no segundo período
  choice: 'imperativo plural: “façam”'
  alternative: 'indicativo: “fizeram”'
  rationale: Embora a forma transmitida possa ser lida literalmente como terceira pessoa plural, o verbo seguinte está na segunda pessoa plural; a leitura imperativa, provavelmente refletindo uma pequena falha de transmissão ou transcrição, produz a sequência coerente de uma ordem.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe relativamente formal para preservar o caráter fragmentário do texto-fonte. “Remissão” foi mantido por sua amplitude jurídica e ritual; a nota registra tanto a dificuldade textual quanto a alternativa lexical.
