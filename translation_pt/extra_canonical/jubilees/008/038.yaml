base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/038.yaml
  text: You, in righteousness and uprightness, shall be righteous, and all your plantings shall prosper. For thus Enoch, the father of your father, commanded Methuselah his son, and Methuselah his son Lamech, and Lamech...
translation:
  language: pt
  text: Em justiça e retidão, vocês serão justos, e todas as suas plantações prosperarão. Pois assim Enoque, pai do pai de vocês,[a] ordenou a seu filho Matusalém; Matusalém, a seu filho Lameque; e Lameque...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura possível: “Enoque ordenou a Matusalém, pai de vocês”.'
    reason: A cadeia de possessivos admite essa segmentação alternativa, registrada na auditoria inglesa; o texto principal preserva a sequência genealógica mais explícita do ge'ez.
lexical_decisions:
- source_word: ጽድቅ
  choice: justiça
  rationale: Preserva o campo semântico de retidão ou justiça e mantém a repetição com o verbo cognato seguinte.
- source_word: ርትዕ
  choice: retidão
  rationale: Expressa integridade e conduta correta, distinguindo o termo do substantivo anterior sem exagerar a diferença entre ambos.
- source_word: ትጸድቁ
  choice: serão justos
  rationale: Mantém a forma verbal cognata de 'justiça' e a construção declarativa refletida pela evidência textual disponível.
- source_word: ይረተው
  choice: prosperará
  rationale: Comunica êxito ou bom desenvolvimento de modo natural em português.
- source_word: ተክሊክሙ
  choice: tudo o que plantarem
  rationale: Conserva a imagem de plantio, mas evita o pouco natural 'todas as suas plantações'; a formulação também deixa aberta uma possível extensão metafórica.
- source_word: አቡሁ፡ ለአቡክሙ
  choice: pai do pai de vocês
  rationale: Traduz explicitamente a relação genealógica atribuída a Enoque, sem a fundir com a identificação de Matusalém como filho dele.
theological_decisions:
- issue: Sentido potencialmente literal ou metafórico do plantio
  choice: tudo o que plantarem
  alternative: todas as suas plantações
  rationale: A escolha preserva a metáfora do original sem decidir se ela se refere apenas a cultivos ou também a obras e descendência.
- issue: Cadeia de transmissão genealógica
  choice: Enoque, pai do pai de vocês, ordenou a seu filho Matusalém; Matusalém, a seu filho Lameque
  alternative: Enoque ordenou ao pai de vocês, Matusalém, e Matusalém a seu filho Lameque
  rationale: A redação principal conserva separadamente a qualificação de Enoque e a designação de Matusalém como seu filho, conforme a sequência explícita do ge'ez.
translation_notes:
  register: Português moderno, digno e acessível, com 'vocês' para o plural. A repetição entre 'justiça' e 'justos' foi mantida por corresponder à repetição lexical do ge'ez. As orações finais são separadas por ponto e vírgula para tornar clara a cadeia de instruções. As reticências preservam o término abrupto do trecho fornecido.
