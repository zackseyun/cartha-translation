- source_word: ወልህቀ
  choice: “e cresceu”
  rationale: Mantém o segundo verbo da sequência, anteriormente omitido em algumas versões.
- source_word: ብእሲተ
  choice: “uma mulher”
  rationale: Neste contexto genealógico, o termo designa a mulher que ele tomou por esposa; a formulação preserva de perto a expressão da fonte.
- source_word: በቀዳሚ፡ ወበሠላስ፡ እዮቤልው
  choice: “do trigésimo primeiro jubileu”
  rationale: A sequência numérica indica trinta e um, conforme a ordem numeral do ge’ez e a revisão crítica fornecida.
