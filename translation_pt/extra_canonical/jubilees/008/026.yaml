base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/026.yaml
  text: which they shed in the midst of the earth, He destroyed everything; and I and you, my children, and all who entered with us into the ark were left. And now, behold, I see before me your deeds, that you are not walking in righteousness, for you have begun to walk in the path of corruption, and you are separating, each one from his neighbor, and are jealous of one another, and are not united together.
translation:
  language: pt
  text: 'O sangue que derramaram no meio da terra, ele destruiu tudo.[a] Restamos eu, vocês, meus filhos, e todos os que entraram conosco na arca. E agora, eis que vejo diante de mim as suas ações: vocês não andam em justiça,[b] pois começaram a andar pelo caminho da corrupção. Cada um se separa do seu próximo, vocês têm ciúmes uns dos outros e não estão unidos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra segmentação possível: “os que estavam no meio da terra, ele os destruiu, todos eles”.'
    reason: Registra a leitura sintática tradicional alternativa, embora a análise de ዘከዐዉ como “que derramaram” e de ኵሎ como “tudo” favoreça o texto principal.
  - marker: b
    text: 'Ou: “que vocês não estão andando em justiça”.'
    reason: Explicita o possível matiz progressivo do imperfeito sem convertê-lo indevidamente em passado.
lexical_decisions:
- source_word: ዘከዐዉ
  choice: o sangue que derramaram
  rationale: O relativo retoma o sangue mencionado no contexto anterior, e o verbo significa “derramar”; a explicitação de “sangue” torna a retomada natural em português.
- source_word: ደምሰሰ፡ ኵሎ
  choice: ele destruiu tudo
  rationale: Mantém o singular implícito do agente e traduz ኵሎ como “tudo”, não “todos eles”.
- source_word: በፍኖተ፡ ሙስና
  choice: pelo caminho da corrupção
  rationale: ፍኖት está no singular; “corrupção” preserva o sentido moral amplo de ሙስና.
- source_word: ቢጹ
  choice: seu próximo
  rationale: Designa o companheiro ou semelhante de cada pessoa; “próximo” é corrente e digno em português bíblico moderno.
- source_word: ኅቡረ
  choice: unidos
  rationale: Expressa a ideia de estarem juntos em comunhão, sem acrescentar uma estrutura institucional ausente do texto.
theological_decisions:
- issue: Agente de “destruiu tudo”
  choice: “ele”, em minúscula
  alternative: “Ele”, com inicial maiúscula
  rationale: O referente divino decorre do contexto, mas o ge'ez não emprega distinção de maiúsculas; a forma minúscula evita introduzir uma convenção editorial teológica.
- issue: Valor aspectual de ዘተሐውሩ
  choice: “não andam em justiça”
  alternative: “não estão andando em justiça”
  rationale: O imperfeito indica ação presente ou habitual; a formulação escolhida é natural e conserva ambos os matizes.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “vocês” para o plural dirigido aos filhos, mantém tom solene sem arcaísmos e preserva a transição do derramamento de sangue mencionado no versículo anterior.
