base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/021.yaml
  text: 'and the Lord forever. And he knew that a blessed portion and a blessing had come to Shem and to his sons for the generations of eternity: all the land of Edom, and all the land of the Red Sea, and all the land of the east and India, and on the Red Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the south, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea, beyond the mountains of Asshur toward the north.'
translation:
  language: pt
  text: 'e o Senhor para sempre.[a] E ele soube que uma porção de bênção e uma bênção[b] haviam cabido a Sem e a seus filhos por todas as gerações, para sempre: toda a terra de Edom, toda a terra do mar Eritreu,[c] toda a terra do Oriente e da Índia, a Eritreia e seus montes, toda a terra de Basã, toda a terra do Líbano e as ilhas de Caftor, todos os montes de Senir e Amaná, os montes da Assíria ao sul, toda a terra de Elão, Assíria e Babilônia, Susã e Média, todos os montes de Ararate e toda a região além do mar, para lá dos montes da Assíria, ao norte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Estas palavras concluem a frase iniciada no versículo anterior.
    reason: O segmento-fonte começa com uma oração fragmentária que pertence sintaticamente ao contexto precedente.
  - marker: b
    text: 'Também pode ser traduzido: “uma porção abençoada e uma bênção”.'
    reason: A relação entre «porção» e o primeiro termo para bênção admite uma formulação adjetival em português.
  - marker: c
    text: Nome antigo geralmente correspondente ao mar Vermelho, embora seu alcance geográfico pudesse ser mais amplo.
    reason: Evita identificar sem ressalva um topônimo histórico com limites modernos.
lexical_decisions:
- source_word: መክፈልተ፡ በረከት፡ ወቡራኬ
  choice: uma porção de bênção e uma bênção
  rationale: Mantém os dois substantivos ligados a bênção e evita a leitura sem apoio de «porção ampla»; a repetição deliberada do ge'ez é preservada.
- source_word: ባሕረ፡ ኤርትራ
  choice: mar Eritreu
  rationale: Equivalente histórico e geográfico da expressão, tradicionalmente identificada com o mar Vermelho, sem reduzir à força o alcance antigo do nome.
- source_word: መክፈልተ
  choice: porção
  rationale: Expressa uma parte territorial atribuída por sorteio ou divisão, adequada ao contexto da repartição da terra.
- source_word: በጽሐ፡ ለሴም
  choice: haviam cabido a Sem
  rationale: Reproduz de modo idiomático a ideia de que a porção chegou ou foi destinada a Sem.
- source_word: ዘለዓለም
  choice: para sempre
  rationale: Conserva explicitamente a duração indefinida da atribuição, além da referência às gerações.
theological_decisions:
- issue: Duplicação dos termos de bênção
  choice: uma porção de bênção e uma bênção
  alternative: uma porção abençoada
  rationale: A alternativa suaviza a frase, mas elimina o segundo termo coordenado do ge'ez; o texto principal conserva a formulação enfática e potencialmente significativa.
- issue: Sujeito de «soube»
  choice: ele
  alternative: Noé
  rationale: O ge'ez emprega o sujeito verbal implícito; não se introduz no versículo um nome que depende do contexto anterior.
translation_notes:
  register: Português atual, digno e de leitura ampla, com topônimos bíblicos correntes no uso brasileiro. A abertura fragmentária foi mantida por pertencer ao segmento ge'ez fornecido; a longa enumeração territorial conserva o ritmo cumulativo do original sem acrescentar conectivos interpretativos.
