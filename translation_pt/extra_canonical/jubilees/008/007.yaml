base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/007.yaml
  text: And in the sixth year she bore him a son, and he called his name Peleg, because in his days, when he was born, the sons of Noah began to divide the earth among themselves. For this reason he called his name Peleg.
translation:
  language: pt
  text: E, no sexto ano, ela lhe deu à luz um filho, e ele lhe deu o nome de Pelegue,[a] porque, nos dias em que ele nasceu, os filhos de Noé começaram a repartir a terra entre si. Por isso, ele lhe deu o nome de Pelegue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O nome Pelegue (Geʿez: ፋሌክ, Fālēk) reflete a raiz hebraica פלג (plg), que significa «dividir» ou «separar», em referência à repartição da terra descrita neste versículo.'
    reason: lexical_choice
lexical_decisions:
- source_word: ፋሌክ
  choice: Pelegue
  rationale: Adota a forma bíblica tradicional e amplamente reconhecível em português, preservando em nota o jogo etimológico ligado à divisão.
- source_word: ይትካፈሉ
  choice: repartir
  rationale: Expressa de modo natural a distribuição da terra entre os filhos de Noé e mantém a relação semântica com a explicação do nome Pelegue.
- source_word: ደቂቀ፡ ኖኅ
  choice: os filhos de Noé
  rationale: Tradução direta da expressão genealógica, sem ampliar seu sentido para descendentes de forma genérica.
