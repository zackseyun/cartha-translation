base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/025.yaml
  text: The thoughts and desire of man imagine vanity and evil continually, and the Lord destroyed everything from the face of the earth because of their evil deeds and because of blood.
translation:
  language: pt
  text: O pensamento e o desejo do ser humano imaginam continuamente o que é vão e mau, e o Senhor destruiu tudo da face da terra por causa das más ações deles e por causa do sangue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ
  choice: O pensamento e o desejo do ser humano
  rationale: Mantém os dois aspectos do texto etíope — pensamento e desejo/vontade — e entende «homem» em sentido coletivo, com linguagem portuguesa atual e inclusiva sem alterar o referente.
- source_word: ይኄሊ
  choice: concebem
  rationale: Expressa a atividade mental indicada pelo verbo («pensar», «imaginar»), evitando reduzi-lo a uma simples afirmação de que os seres humanos eram maus.
- source_word: ከንተ፡ ወእኩየ
  choice: vaidade e mal
  rationale: Preserva os dois objetos coordenados, inclusive «vaidade/coisa vã», nuance omitida em versões mais abreviadas.
- source_word: በኵሉ፡ መዋዕል
  choice: continuamente
  rationale: Equivalente idiomático de «em todos os dias», indicando constância.
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እምነ፡ ገጸ፡ ምድር
  choice: e o Senhor destruiu tudo o que havia sobre a face da terra
  rationale: Reproduz a ação destrutiva e a expressão espacial tradicional, explicitando apenas o complemento naturalmente subentendido em português.
- source_word: ወበእንተ፡ ደም
  choice: e por causa do sangue
  rationale: Mantém a formulação concreta e aberta do original, sem substituí-la interpretativamente por «derramamento de sangue».
theological_decisions:
- issue: Sentido de «sangue» no motivo do juízo
  choice: por causa do sangue
  alternative: por causa do derramamento de sangue
  rationale: O substantivo etíope diz literalmente «sangue»; embora o contexto possa aludir a sangue derramado, a tradução preserva a concisão e a possível amplitude teológica da expressão.
- issue: Condição humana ou atividade mental contínua
  choice: concebem vaidade e mal continuamente
  alternative: eram maus continuamente
  rationale: A escolha conserva tanto o verbo de pensamento quanto os dois objetos presentes no texto-fonte, sem simplificar a afirmação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a linguagem antropológica coletiva e a solenidade narrativa, sem importar terminologia confessional.
