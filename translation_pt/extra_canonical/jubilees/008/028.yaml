  text: And he blessed the God of gods, who had put the word of the Lord in his mouth.
translation:
  language: pt
  text: E ele abençoou o Deus dos deuses, que havia posto em sua boca a palavra do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: bendisse
  rationale: Traduz diretamente o verbo sem elevar desnecessariamente o registro; o sujeito masculino é recuperado pelo contexto.
- source_word: አምላክ፡ አማልክት
  choice: Deus dos deuses
  rationale: Mantém a construção superlativa/relacional do ge'ez e sua formulação teológica sem explicá-la.
- source_word: ዘወደየ
  choice: que havia posto
  rationale: O mais-que-perfeito composto expressa naturalmente em português a ação anterior à bênção.
- source_word: ንባበ፡ እግዚአብሔር
  choice: a palavra do Senhor
  rationale: Preserva a expressão do texto-fonte, entendendo ንባብ como palavra ou enunciado e usando a forma bíblica corrente para o título divino.
- source_word: ውስተ፡ አፉሁ
  choice: em sua boca
  rationale: Conserva a imagem sem substituí-la por uma paráfrase como “deu-lhe o que dizer”.
theological_decisions:
- issue: Sentido de “Deus dos deuses”
  choice: Manter literalmente “Deus dos deuses”
  alternative: “Deus supremo”
  rationale: A formulação original deve conservar sua tensão e não ser transformada em uma explicação teológica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com fluidez brasileira. A forma inicial ተፈጥረ parece ser material residual ligado ao contexto anterior ou a uma segmentação textual problemática; seguindo a unidade sintática reconhecida pela camada auditada e a leitura coerente do versículo, não foi incorporada ao corpo da tradução.
