base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/018.yaml
  text: For Shem and for his sons to possess it forever, for his generations forever. And Noah rejoiced because this portion came forth for Shem and for his sons, and he remembered all that he had spoken with his mouth in prophecy, for he said, “Blessed be the Lord God of Shem, and may he dwell...
translation:
  language: pt
  text: 'Para Sem e seus filhos, para que a possuíssem para sempre, por todas as suas gerações. Noé se alegrou porque essa porção coube a Sem e a seus filhos, e lembrou-se de tudo o que havia declarado com sua boca em profecia, pois tinha dito: “Bendito seja o SENHOR, Deus de Sem, e que ele habite...”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto-fonte fornecido termina neste ponto, no meio da frase.
    reason: Sinalizar que as reticências refletem a forma incompleta do excerto disponível, e não uma omissão interpretativa.
lexical_decisions:
- source_word: ለእኂዞታ
  choice: para que a possuíssem
  rationale: O infinitivo ge'ez com sufixo pronominal exprime a finalidade de possuir a porção; a forma verbal portuguesa torna explícito o sujeito plural já mencionado sem transformar o termo em um substantivo.
- source_word: መክፈልት
  choice: porção
  rationale: Designa a parte territorial atribuída a Sem e seus descendentes, em continuidade com o contexto da divisão da terra.
- source_word: በትንቢት
  choice: em profecia
  rationale: Preserva de modo direto a caracterização do pronunciamento de Noé como profético.
- source_word: እግዚአብሔር፡ አምላኩ፡ ለሴም
  choice: o SENHOR, Deus de Sem
  rationale: Mantém a construção tradicional e semanticamente direta do título divino, sem acrescentar uma relação teológica não expressa no texto.
- source_word: ወይኅድር
  choice: e que ele habite
  rationale: Reproduz o valor volitivo do verbo e conserva a referência pronominal sem a resolver além do que permite o fragmento.
theological_decisions:
- issue: Referente do pronome em “que ele habite”
  choice: Manter “ele” sem explicitar o referente
  alternative: “que Deus habite” ou “que Sem habite”
  rationale: O trecho fornecido termina logo após o verbo, e a construção pronominal não deve ser interpretativamente resolvida no corpo da tradução.
- issue: Fórmula de bênção dirigida ao Deus de Sem
  choice: “Bendito seja o SENHOR, Deus de Sem”
  alternative: “Bendito seja o SENHOR, o Deus de Sem”
  rationale: A formulação sem artigo apositivo é natural em português bíblico e preserva a relação expressa no ge'ez sem desenvolver implicações confessionais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. “Coube” comunica naturalmente a atribuição da porção, enquanto a primeira oração mantém a construção final do ge'ez. A repetição de “para sempre” e “por todas as suas gerações” foi preservada por seu valor enfático.
