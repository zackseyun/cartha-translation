  language: pt
  text: e cada um contra o seu próximo. Todos se venderam para praticar a injustiça e derramar muito sangue.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez fornecido não corresponde ao conteúdo normalmente numerado como Jubileus 8:23 nas edições modernas; parece pertencer a outra passagem. A tradução acima segue o texto-fonte apresentado.
    reason: source_reference_misalignment
lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: cada um contra o seu próximo
  rationale: A expressão fragmentária retoma a ação hostil do contexto e designa o próximo ou semelhante; a preposição «contra» torna explícita em português a relação exigida pela frase.
- source_word: ኵሉ፡ ተሰይጠ
  choice: Todos se venderam
  rationale: Preserva a metáfora reflexiva do texto, que comunica entrega voluntária à prática do mal.
- source_word: ይግበር፡ ዐመፃ
  choice: para praticar a injustiça
  rationale: Reproduz a construção final e traduz ዐመፃ por um termo amplo que abrange perversidade, transgressão e violência injusta.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: derramar muito sangue
  rationale: Mantém o idioma semítico referente a homicídio e violência em larga escala.
theological_decisions:
- issue: Metáfora moral de vender-se
  choice: se venderam para praticar a injustiça
  alternative: entregaram-se à injustiça
  rationale: A formulação escolhida conserva a imagem forte do original sem a reduzir a uma explicação interpretativa.
- issue: Desalinhamento entre referência e texto-fonte
  choice: traduzir o texto ge'ez fornecido
  alternative: restaurar por conjectura o conteúdo tradicional de Jubileus 8:23
  rationale: A tradução segue prioritariamente a evidência original apresentada; a anomalia de referência é informada em nota, sem substituir silenciosamente o texto.
translation_notes:
  register: Português atual, digno e de leitura ampla. Conservou-se a metáfora «se venderam» e o idioma «derramar sangue». Como o trecho começa no meio de uma construção, empregou-se «contra» para produzir uma frase inteligível segundo a relação contextual indicada pela fonte e pela camada inglesa auditada.
