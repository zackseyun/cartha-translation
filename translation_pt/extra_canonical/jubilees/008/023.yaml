review_pass:
  verdict: revise
  source_fidelity: 'A segunda frase corresponde bem ao ge''ez: «todos se venderam» preserva a metáfora reflexiva, e «praticar a iniquidade e derramar muito sangue» traduz de modo direto ዐመፃ e ደመ ብዙኀ. Na primeira frase, porém, «contra» não está expresso no fragmento fornecido. O ge''ez apresenta uma elipse («e um homem, seu próximo»), provavelmente dependente de um verbo de matar no contexto antecedente que não foi incluído.'
  naturalness: A redação é clara e de registro adequado. A substituição da preposição interpretativa por um verbo suprido entre colchetes torna o fragmento compreensível em português sem ocultar a lacuna contextual do texto apresentado.
  terminology: «Iniquidade» é mais próximo do campo semântico moral de ዐመፃ e da trilha de auditoria inglesa do que «injustiça», embora esta não seja incorreta. «Derramar muito sangue» é idiomático e fiel.
  issues:
  - severity: medium
    issue: «contra o seu próximo» introduz uma relação que o fragmento ge'ez não enuncia.
    rationale: A expressão ሰብእሂ፡ ቢጾ traz literalmente «um homem, seu próximo» e parece elíptica. Dado o provável contexto de violência, pode-se suprir «matava», mas a intervenção deve ser assinalada, não convertida em «contra».
  - severity: low
    issue: «injustiça» é um pouco mais estreito que a formulação tradicional e o campo de ዐመፃ.
    rationale: «Iniquidade» mantém um sentido moral amplo, sem restringir o termo a injustiça em sentido jurídico ou social.
  revised_text: e um homem [matava] o seu próximo. Todos se venderam para praticar a iniquidade e derramar muito sangue.[a]
  revised_footnotes:
  - marker: a
    text: O texto ge'ez fornecido não corresponde ao conteúdo normalmente numerado como Jubileus 8:23 nas edições modernas; parece pertencer a outra passagem. A tradução acima segue o texto-fonte apresentado. O verbo entre colchetes é suprido para tornar compreensível uma expressão elíptica no fragmento ge'ez.
    reason: source_reference_misalignment; supplied_ellipsis
  revision_rationale: A revisão elimina a preposição «contra», que não consta do texto-fonte, e assinala explicitamente o verbo necessário para verter a elipse inicial de modo inteligível. Também adota «iniquidade», mantendo a imagem de «vender-se» e o idioma «derramar muito sangue». A nota conserva o aviso indispensável sobre o desalinhamento entre a referência e o texto ge'ez e identifica a mínima complementação editorial.
