base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/024.yaml
  text: And the earth was filled with violence. And after this, they sinned against the beasts and the birds and everything that moves and everything that walks on the earth, and much blood was shed on the earth.
translation:
  language: pt
  text: E a terra se encheu de violência. Depois disso, pecaram contra os animais, as aves, tudo o que se move e tudo o que anda sobre a terra; e muito sangue foi derramado sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: violência
  rationale: Expressa naturalmente o campo semântico de violência, injustiça e transgressão no contexto, em acordo com a formulação de que a terra ficou cheia dela.
- source_word: አበሱ
  choice: pecaram contra
  rationale: Mantém o sentido moral explícito do verbo e sua relação com os seres vivos mencionados.
- source_word: አራዊት
  choice: animais
  rationale: Termo amplo e corrente para os animais terrestres; evita restringir indevidamente o referente a feras.
- source_word: ዐዋፍ
  choice: aves
  rationale: Equivalente português direto e digno para os seres alados mencionados.
- source_word: ይትሐወስ
  choice: se move
  rationale: Preserva a descrição ampla de tudo o que se movimenta, sem especificar um tipo de locomoção.
- source_word: ያንሶሱ
  choice: anda
  rationale: Representa a locomoção sobre a terra em português natural e mantém a distinção em relação a 'se move'.
- source_word: ትክዐወ ደም ብዙኅ
  choice: muito sangue foi derramado
  rationale: Reproduz a imagem de abundante derramamento de sangue em uma construção idiomática e solene em português.
theological_decisions:
- issue: Identidade do sujeito de 'pecaram'
  choice: 'Manter o sujeito implícito no plural: ''pecaram'''
  alternative: Explicitar 'eles pecaram' ou identificar os agentes
  rationale: O trecho fornecido pressupõe os agentes pelo contexto anterior, mas não os nomeia neste versículo; mantê-los implícitos evita acrescentar uma identificação interpretativa.
- issue: Natureza do pecado contra os seres vivos
  choice: Não especificar em que consistiu o pecado
  alternative: Interpretá-lo explicitamente como violência, corrupção ou relações ilícitas
  rationale: A fonte afirma que pecaram contra os animais e as aves, mas neste verso não define precisamente o ato; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. A repetição de 'sobre a terra' foi preservada por corresponder à ênfase da fonte, enquanto o ponto e vírgula organiza naturalmente a sequência final.
