base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
translation:
  language: pt
  text: “...o SENHOR habite na morada de Sem.”[a] E ele soube que o jardim do Éden é o Santo dos Santos e a morada do SENHOR; que o monte Sinai fica no meio do deserto; e que o monte Sião fica no meio do umbigo da terra. Esses três foram criados como lugares santos, voltados uns para os outros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O verbo “habite” vem da oração iniciada no versículo anterior; aqui o texto diz literalmente: “o SENHOR na morada de Sem”.'
    reason: Esclarece que a frase inicial é uma continuação sintática e que o verbo não está expresso neste versículo.
lexical_decisions:
- source_word: ገነት፡ ኤዶም
  choice: jardim do Éden
  rationale: Emprega a designação bíblica corrente em português para o jardim de Eden.
- source_word: ቅድስተ፡ ቅዱሳን
  choice: o Santo dos Santos
  rationale: Preserva o superlativo semítico e sua força cultual, tratando o jardim como o lugar de santidade máxima.
- source_word: ሕንብርት፡ ለምድር
  choice: umbigo da terra
  rationale: Mantém a imagem cosmográfica concreta do texto, sem suavizá-la para uma expressão meramente geográfica como 'centro da terra'.
- source_word: መንጸረ
  choice: voltados uns para os outros
  rationale: Expressa a relação espacial de estarem diante ou de frente uns para os outros em português natural.
theological_decisions:
- issue: A frase inicial é um fragmento que continua a bênção optativa do versículo anterior.
  choice: “...o SENHOR habite na morada de Sem.”
  alternative: “O SENHOR habitou na morada de Sem.”
  rationale: O ge'ez deste versículo não traz verbo expresso; a forma verbal e o valor optativo vêm da oração iniciada no versículo anterior. A tradução conserva essa continuidade e evita transformar a bênção profética em declaração no passado.
- issue: Identidade do sujeito de “soube”.
  choice: E ele soube
  alternative: E Noé soube
  rationale: Mantém o pronome presente na fonte e não explicita um referente que o texto deste versículo deixa dependente do contexto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Preservam-se as imagens tradicionais e incomuns “Santo dos Santos” e “umbigo da terra”; a pontuação organiza as três localizações paralelas sem eliminar sua relação sintática.
