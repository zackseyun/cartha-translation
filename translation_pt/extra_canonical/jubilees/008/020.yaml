base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/020.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee and the seventh week, Noah began to command the ordinances and the commandments to the children of his sons, and all that he knew of justice; and he testified to his sons that they should do righteousness and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication,
translation:
  language: pt
  text: Estes são os filhos de Noé.[a] No vigésimo oitavo jubileu e na sétima semana, Noé começou a ordenar aos filhos de seus filhos os estatutos e os mandamentos, bem como tudo o que sabia a respeito da justiça. Ele exortou seus filhos a praticarem a retidão, a cobrirem a nudez de seu corpo, a bendizerem seu Criador, a honrarem pai e mãe, a amarem cada um o seu irmão e a guardarem a própria alma da imoralidade sexual.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A abertura e a construção da frase são textualmente difíceis. Outra tradução possível é: “Quanto aos filhos de Noé, no vigésimo oitavo jubileu e na sétima semana, enquanto Noé ordenava aos filhos de seus filhos os estatutos e os mandamentos, bem como tudo o que sabia a respeito da justiça, ele exortou seus filhos...”'
    reason: Registra a possível leitura de እንዘ como 'enquanto' e a alternativa sintática atestada, sem deixar o texto principal como fragmento.
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዘ
  choice: os estatutos e os mandamentos
  rationale: Distingue os dois termos jurídicos do ge'ez em linguagem bíblica clara e corrente.
- source_word: ፍትሐ
  choice: justiça
  rationale: Preserva o campo semântico de justiça, juízo e direito sem restringi-lo a uma única modalidade.
- source_word: አስምዐ
  choice: exortou
  rationale: No contexto, o verbo introduz a incumbência solene dirigida aos filhos; 'exortou' comunica isso com naturalidade, embora literalmente possa significar 'deu testemunho'.
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: a nudez de seu corpo
  rationale: Expressa de modo natural a locução literal 'vergonha de sua carne', cujo referente é a nudez corporal.
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Termo abrangente e moderno para conduta sexual ilícita; evita limitar indevidamente o sentido a adultério ou prostituição.
theological_decisions:
- issue: Referência ao Criador
  choice: seu Criador
  alternative: aquele que os criou
  rationale: Mantém a designação teológica concisa do texto e a relação entre as pessoas instruídas e quem as criou.
- issue: Objeto da preservação diante de ዝሙት
  choice: guardarem a própria alma da imoralidade sexual
  alternative: guardarem a si mesmos da fornicação
  rationale: Preserva explicitamente 'alma' no texto-fonte, sem reduzir a expressão a mera proteção corporal, e traduz o vício sexual de forma abrangente.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A redação evita arcaísmos desnecessários, conserva o paralelismo da série de mandamentos e mantém a ambiguidade textual principal em nota.
