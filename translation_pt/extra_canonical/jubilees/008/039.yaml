base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/039.yaml
  text: He commanded me all that his fathers had commanded him. And I also command you, my children, according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation; he commanded and testified to his son and to his son's children until the day of his death.
translation:
  language: pt
  text: Ele me ordenou tudo o que seus pais lhe haviam ordenado. E eu também ordeno a vocês, meus filhos, assim como Enoque ordenou a seu filho nos primeiros jubileus, enquanto ainda vivia, na sétima geração. Enoque ordenou e deu testemunho[a] ao seu filho e aos filhos de seu filho até o dia de sua morte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fez ouvir”.'
    reason: O verbo ge'ez é causativo de “ouvir” e pode significar tanto fazer ouvir ou declarar quanto dar testemunho.
lexical_decisions:
- source_word: አበዊሁ (ʾabawihu)
  choice: seus pais
  rationale: Mantém o plural do texto ge'ez e a referência aos antepassados daquele que transmitiu a ordem.
- source_word: በቀዳሚ፡ እዮቤልውሳት (ba-qadāmi ʾiyobelusāt)
  choice: nos primeiros jubileus
  rationale: Preserva o substantivo plural e evita transformar sem necessidade a expressão em um único jubileu.
- source_word: ውስተ፡ ትዝምዳ፡ ሳባዕ (wəsta təzəmda sābāʿ)
  choice: na sétima geração
  rationale: Tradução direta da localização genealógica indicada pelo ge'ez.
- source_word: አስምዐ (ʾasmaʿa)
  choice: deu testemunho
  rationale: O causativo de 'ouvir' pode ter o sentido contextual de testemunhar ou declarar solenemente; a alternativa mais literal é registrada em nota.
theological_decisions:
- issue: Natureza da ação expressa por አስምዐ
  choice: deu testemunho
  alternative: fez ouvir
  rationale: A escolha comunica em português corrente o valor solene possível do verbo sem especificar um conteúdo doutrinário não expresso; a ambiguidade lexical é preservada em nota.
translation_notes:
  register: Português moderno, digno e acessível, com construção narrativa clara. Emprega-se “vocês” para ampla legibilidade brasileira, mantendo “seu” nas relações familiares. A repetição de “ordenou” foi preservada por refletir a estrutura enfática do original.
