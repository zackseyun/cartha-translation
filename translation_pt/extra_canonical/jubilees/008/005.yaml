base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/005.yaml
  text: For he was afraid to tell Noah about it, lest he be angry with him because of it. And in the fifth jubilee, in the first week, in the first year, he took a wife, and her name was Melka, the daughter of Madai, the son of Japheth; and in the fourth year of it he fathered a son, and he called his name Salah.
translation:
  language: pt
  text: Pois ele tinha medo de contar isso a Noé, para que Noé não se irasse com ele por causa disso. No quinto jubileu, na primeira semana, no primeiro ano, ele tomou para si uma mulher chamada Melca, filha de Madai, filho de Jafé. No quarto ano dessa semana, ele gerou um filho e lhe deu o nome de Salá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይፈርህ
  choice: tinha medo
  rationale: Expressa naturalmente o valor do verbo de temer no contexto, sem aumentar sua intensidade.
- source_word: ኢይትመዐዐ
  choice: não se irasse
  rationale: Conserva o sentido de ficar irado; a repetição de «Noé» esclarece em português o sujeito do verbo sem alterar o referente.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: tomou para si uma mulher
  rationale: Mantém de modo inteligível a construção matrimonial idiomática do ge'ez.
- source_word: ሎቱ
  choice: dessa semana
  rationale: Na fórmula cronológica, o pronome retoma idiomaticamente a semana mencionada, e não indica que a mulher deu um filho «a ele».
- source_word: ወሊደ፡ ወልደ
  choice: gerou um filho
  rationale: O verbo está no masculino singular e apresenta o patriarca como sujeito; «gerou» preserva a formulação genealógica.
- source_word: ሜልካ ... አመዳይ ... ያፌት ... ሳላ
  choice: Melca ... Madai ... Jafé ... Salá
  rationale: Translitera os nomes segundo formas claras em português, usando «Jafé» e «Salá» em conformidade com o uso bíblico português.
