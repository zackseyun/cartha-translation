translation:
  language: pt
  text: E, no ano em que José se apresentou diante do Faraó, ele tinha trinta anos quando se apresentou diante do Faraó.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E José tinha trinta anos quando se apresentou diante do Faraó.”'
