lexical_decisions:
- source_word: በዐሰተ (provavelmente በዐመተ)
  choice: no ano
  rationale: O contexto e a revisão textual indicam que a forma transmitida é provavelmente um erro por በዐመተ, “no ano”; a tradução conserva a primeira oração explicitamente presente.
- source_word: ቆመ ኀበ ፈርዖን
  choice: se apresentou diante do faraó
  rationale: A expressão significa literalmente “esteve de pé diante do faraó”, mas, neste contexto de comparecimento oficial, “se apresentou diante” comunica o sentido com naturalidade e dignidade.
- source_word: ወልደ ሠላሳ ክረምተ
  choice: ele tinha trinta anos
  rationale: A construção etíope expressa a idade de José; a formulação portuguesa é direta e idiomática.
