  yaml_path: translation/extra_canonical/jubilees/040/008.yaml
  text: And Joseph went out through all the land of Egypt, and all Pharaoh’s princes loved him, and all his servants, and all who did the king’s work, because he walked uprightly and there was no pride, or arrogance of heart, or partiality, and no taking of bribes; for he judged uprightly for all the peoples of the earth.
translation:
  language: pt
  text: E José percorreu toda a terra do Egito. Todos os príncipes do faraó o amavam, bem como todos os servos do faraó e todos os que realizavam o trabalho do rei, porque ele andava com retidão, sem orgulho, arrogância de coração ou parcialidade, e não aceitava subornos; pois julgava com justiça todos os povos da terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መበለ
  choice: percorreu
  rationale: No contexto, descreve o deslocamento de José por toda a terra do Egito; “percorreu” é natural em português e preserva a ideia de circular pela região.
- source_word: አፍቀርዎ
  choice: o amavam
  rationale: Reproduz diretamente o sentido afetivo do verbo, sem enfraquecê-lo para mera estima ou aprovação.
- source_word: ርቱዐ፡ የሐውር
  choice: andava com retidão
  rationale: Mantém a metáfora ética de caminhar e exprime conduta íntegra em português corrente e digno.
- source_word: አሢሦተ፡ ገጽ
  choice: parcialidade
  rationale: A expressão idiomática ligada ao rosto denota favoritismo ou acepção de pessoas, não altivez facial.
- source_word: ነሢአ፡ ሕልያነ
  choice: aceitava subornos
  rationale: O sintagma indica receber presentes corruptores ou subornos; evita a confusão lexical com pensamento ou mente.
- source_word: ርቱዐ፡ ይኴንን
  choice: julgava com justiça
  rationale: Expressa de modo natural a ação judicial reta, preservando a correspondência com a retidão anteriormente atribuída a José.
theological_decisions:
- issue: Alcance de “todos os povos da terra”
  choice: todos os povos da terra
  alternative: todo o povo da terra
  rationale: A forma plural አሕዛብ favorece “povos”; a tradução mantém o alcance amplo do texto sem restringi-lo aos egípcios nem explicar além da fonte.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A coordenação foi levemente ajustada para fluência, preservando a sequência causal e as negações do ge'ez.
