base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/009.yaml
  text: And the land of Egypt prospered before Pharaoh because of Joseph, for the Lord was with him and gave him favor and mercy over all his generation, in the sight of all who knew him and all who heard of him. And Pharaoh’s kingdom was well ordered, and there was no adversary and no evil.
translation:
  language: pt
  text: E a terra do Egito prosperou diante do faraó por causa de José, pois o Senhor estava com ele e lhe concedeu favor e misericórdia sobre toda a sua geração, à vista de todos os que o conheciam e de todos os que ouviam falar dele. E o reino do faraó estava bem organizado, e não havia adversário[a] nem mal algum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Satanás”.'
    reason: O termo etíope pode significar tanto “adversário” como designar Satanás.
lexical_decisions:
- source_word: ትሠናአወት
  choice: prosperou
  rationale: Expressa o florescimento ou bom estado da terra do Egito no contexto, em português natural, sem reduzi-lo apenas à paz política.
- source_word: ሞገሰ፡ ወምሕረተ
  choice: favor e misericórdia
  rationale: 'Mantém os dois conceitos distintos do texto etíope: benevolência/favor e compaixão/misericórdia.'
- source_word: ላዕለ፡ ኵሎሙ፡ ዘመዱ
  choice: sobre toda a sua geração
  rationale: Preserva o valor de ላዕለ como 'sobre' e traduz ዘመድ, neste contexto, como 'geração', em referência aos contemporâneos de José, sem substituir a preposição pela expressão posterior 'à vista de'.
- source_word: ወረጐዐት
  choice: estava bem organizado
  rationale: Comunica a condição estável, ordenada e tranquila do reino, de modo idiomático e sem restringir o sentido a mera ausência de guerra.
- source_word: ሰይጣነ
  choice: adversário
  rationale: O substantivo pode designar um opositor ou adversário e, em certos contextos, Satanás; a situação política do reino favorece o sentido comum, mantendo-se a alternativa em nota.
- source_word: እኩየ
  choice: mal algum
  rationale: O termo é substantivado de modo amplo e não exige a interpretação pessoal 'maligno'; 'mal algum' oferece uma leitura natural e não sectária.
theological_decisions:
- issue: Se ሰይጣነ designa um adversário humano ou Satanás
  choice: adversário
  alternative: Satanás
  rationale: O paralelismo descreve a ordem do reino do faraó, favorecendo a ideia de ausência de oposição; como o termo também pode funcionar como nome ou título de Satanás, a ambiguidade é registrada em nota.
- issue: Se o mal final é pessoal ou abstrato
  choice: mal algum
  alternative: nenhum maligno
  rationale: A forma etíope permite o sentido amplo de mal ou coisa má, e o contexto não obriga a personificá-la.
translation_notes:
  register: Português atual, digno e de leitura ampla, com 'faraó' em minúscula como título. A construção menos usual 'sobre toda a sua geração' foi mantida para refletir a preposição do original e preservar sua tensão sem confundi-la com a expressão seguinte, 'à vista de'.
