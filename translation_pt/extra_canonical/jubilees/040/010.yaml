  text: And the king called Joseph’s name Pontifans,^a and he gave Joseph as wife the daughter of Potiphar, the daughter of Sawes^b of Heliopolis, chief of the guards.
translation:
  language: pt
  text: E o rei deu a José o nome de Pontifans[a] e deu-lhe por mulher a filha de Potifar, filha de Sawes[b], de Heliópolis, chefe dos guardas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma ge’ez é “Pontifans”; outras tradições apresentam uma forma como “Psonthomphanes”.
    reason: Registra a variante tradicional sem substituir a leitura da fonte.
  - marker: b
    text: O ge’ez traz “Sawes” como nome. Essa forma pode ter surgido de uma transmissão corrompida da palavra grega para “sacerdote”.
    reason: Explica a dificuldade textual e a alternativa conhecida, preservando no texto principal a leitura ge’ez.
lexical_decisions:
- source_word: ጸውዐ፡ ንጉሥ፡ ስሞ፡ ለዮሴፍ
  choice: o rei deu a José o nome de
  rationale: Expressa em português natural a fórmula de nomeação do texto ge’ez sem alterar seu sentido.
- source_word: ጶንጢፋንስ
  choice: Pontifans
  rationale: Translitera diretamente a forma própria preservada no ge’ez, sem harmonizá-la com a Septuaginta de Gênesis 41:45.
- source_word: ጶጢፋራን
  choice: Potifará
  rationale: Representa como nome próprio a forma ge’ez no contexto genealógico da mulher dada a José.
- source_word: ሳውፅ
  choice: Sawes
  rationale: Mantém como nome próprio a leitura efetiva da tradição etíope, em vez de emendá-la silenciosamente para ‘sacerdote’.
- source_word: ሊቀ፡ ዐቀብት
  choice: chefe dos guardas
  rationale: Tradução formal dos elementos ‘chefe’ e ‘guardas/guardiões’, preservando o título tal como aparece no ge’ez.
theological_decisions:
- issue: Harmonização com Gênesis 41:45
  choice: Preservar ‘Pontifans’ e ‘Sawes’ no texto principal
  alternative: Usar ‘Psonthomphanes’ e interpretar ‘Sawes’ como ‘sacerdote’
  rationale: A tradução segue prioritariamente a forma transmitida pelo texto ge’ez de Jubileus e registra em nota as relações textuais possíveis, sem substituir a leitura da fonte por uma harmonização bíblica.
- issue: Relação sintática do título final
  choice: Ligar ‘chefe dos guardas’ a Sawes
  alternative: Entender o título como referência a outro nome ou cargo reconstruído
  rationale: A sequência nominal do ge’ez favorece a ligação com Sawes, embora a tradição textual subjacente pareça difícil; a tradução evita reconstruções não expressas no texto fornecido.
translation_notes:
  register: Português contemporâneo, claro e digno, com sintaxe narrativa natural e nomes próprios próximos das formas ge’ez. A repetição ‘filha de... filha de...’ foi mantida por refletir a estrutura da fonte, apesar de sua dificuldade textual.
