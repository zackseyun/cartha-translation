base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/012.yaml
  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: pt
  text: 'E naquele ano Isaque morreu. E aconteceu como José havia dito a respeito da interpretação de seus dois sonhos, conforme lhe havia declarado: houve sete anos de abundância em toda a terra do Egito, e a terra do Egito produziu muitíssimo; uma medida rendeu mil e oitocentas medidas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ
  choice: morreu
  rationale: Tradução direta e natural do verbo ge'ez para morrer.
- source_word: ፍካሬ
  choice: interpretação
  rationale: No contexto dos sonhos, designa a explicação ou interpretação de seu significado.
- source_word: ክልኤ፡ ሕልሙ
  choice: seus dois sonhos
  rationale: Preserva o numeral dual expresso e a referência possessiva a José.
- source_word: ሰብዐቱ፡ ክረምት፡ ዘጽጋብ
  choice: sete anos de abundância
  rationale: Expressa em português corrente o período de fartura agrícola indicado pelo texto.
- source_word: ፈርየት
  choice: produziu
  rationale: Verbo agrícola amplo e natural, sem especificar um cultivo ausente no original.
- source_word: መስፈርት / መስፈረ
  choice: medida / medidas
  rationale: Mantém a unidade genérica do original, sem convertê-la indevidamente em uma medida moderna.
theological_decisions:
- issue: Cumprimento da interpretação dos sonhos de José
  choice: aconteceu exatamente como José havia dito
  alternative: cumpriu-se o que José profetizou
  rationale: Conserva a formulação narrativa do texto sem transformar explicitamente a interpretação em profecia ou acrescentar uma classificação teológica.
- issue: Referente de “lhe” na declaração dos sonhos
  choice: conforme lhe havia declarado
  alternative: conforme havia declarado ao faraó
  rationale: Preserva a referência pronominal do texto e evita inserir explicitamente “faraó”, embora seja o referente contextual provável.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe narrativa bíblica moderada. Mantiveram-se “terra do Egito” e a proporção extraordinária de uma para mil e oitocentas medidas, sem normalização histórica ou agronômica.
