  terminology: “Faraó”, “supervisores”, “cereal”, “depósitos”, “provisão” e “fome” são escolhas naturais e semanticamente adequadas. As notas a e b estão corretamente ancoradas e correspondem a ambiguidades/alternativas efetivamente presentes no histórico de auditoria inglês.
