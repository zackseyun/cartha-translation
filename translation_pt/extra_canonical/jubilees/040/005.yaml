base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/005.yaml
  text: “And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up grain in the storehouses of the cities, in each city, during the days of the years of abundance. And it will be provision for the seven years of famine, and the land will not perish before the face of the famine, for it will be very severe.”
translation:
  language: pt
  text: “Agora, que o faraó nomeie supervisores em toda a terra do Egito, e que eles armazenem cereal nos depósitos das cidades[a], em cada cidade, durante os dias dos anos de fartura[b]. Isso servirá de provisão para os sete anos de fome, e a terra não perecerá diante da fome, pois ela será extremamente severa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nas casas-armazéns das cidades”.
    reason: Registra de modo mais literal a expressão ge’ez “nas casas das cidades”, entendida contextualmente como depósitos.
  - marker: b
    text: Ou “durante os anos de fartura”.
    reason: A formulação principal conserva o idioma semítico/ge’ez literal “durante os dias dos anos”; a alternativa oferece seu sentido corrente.
lexical_decisions:
- source_word: መኰንነ
  choice: supervisores
  rationale: O termo designa autoridades ou encarregados nomeados; o plural contextual concorda com a atuação por toda a terra do Egito.
- source_word: ይዝግቡ
  choice: armazenem cereal
  rationale: O verbo expressa guardar ou acumular; “cereal” explicita naturalmente o objeto subentendido pelo contexto de fartura e fome.
- source_word: በቤተ፡ አህጉር
  choice: nos depósitos das cidades
  rationale: A expressão literalmente ligada às “casas das cidades” refere-se, no contexto, a locais urbanos de armazenamento, sem omitir ቤተ.
- source_word: ሲሳተ
  choice: provisão
  rationale: Transmite a ideia de sustento ou mantimento reservado para o período de fome.
- source_word: ኀያል፡ ይከውን፡ ጥቀ
  choice: será extremamente severa
  rationale: Preserva a forte intensificação da gravidade da fome em português natural.
