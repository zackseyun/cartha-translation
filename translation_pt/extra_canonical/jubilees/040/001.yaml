base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/001.yaml
  text: 'And it happened to them just as he had interpreted for them: Pharaoh restored the chief cupbearer to his office, and he killed the baker, as Joseph had interpreted for them. And the chief cupbearer left Joseph in the prison house, even though he had informed him of what would happen, and he did not remember to inform Pharaoh of what Joseph had told him, for he forgot.'
translation:
  language: pt
  text: 'E aconteceu com eles exatamente como ele lhes havia interpretado: o faraó restituiu o chefe dos copeiros ao seu cargo e matou o padeiro, conforme José lhes havia interpretado. O chefe dos copeiros deixou José na prisão, embora José lhe tivesse informado o que aconteceria, e não se lembrou de contar ao faraó o que José lhe havia dito, pois se esqueceu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: chefe dos copeiros
  rationale: A expressão contém explicitamente o título de chefia e designa o responsável pelos copeiros.
- source_word: ሐባዚስ
  choice: padeiro
  rationale: O texto ge'ez não traz aqui o título equivalente a «chefe»; por isso, evita-se harmonizar com Gênesis mediante «chefe dos padeiros».
- source_word: ወረሰዮ
  choice: deixou
  rationale: O verbo significa deixar ou pôr, e não esquecer; o verbo específico para «esquecer» aparece no fim do versículo.
- source_word: አይድዖ
  choice: lhe tivesse revelado
  rationale: A forma causativa indica que José fez o copeiro saber o que aconteceria; «revelado» expressa isso naturalmente no contexto de interpretação de sonhos.
- source_word: ቤተ፡ ሞቅሕ
  choice: na prisão
  rationale: Embora literalmente seja «casa de prisão», «na prisão» é a formulação corrente e preserva o sentido.
theological_decisions:
- issue: Identidade do sujeito na abertura
  choice: manter o pronome «ele»
  alternative: explicitar «José»
  rationale: O original emprega um pronome na primeira ocorrência e só nomeia José mais adiante; a tradução preserva essa progressão sem criar repetição indevida.
- issue: Responsabilidade do chefe dos copeiros
  choice: distinguir «deixou» de «se esqueceu»
  alternative: traduzir a primeira ação também como esquecimento
  rationale: O original usa verbos distintos e culmina na afirmação explícita de que ele se esqueceu; manter a distinção preserva a sequência e a ênfase do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A ordem narrativa e as repetições significativas do ge'ez foram preservadas, sem harmonização automática com Gênesis.
