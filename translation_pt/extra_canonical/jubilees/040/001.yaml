  to: 'E aconteceu com eles exatamente como ele lhes havia interpretado: o faraó restituiu o chefe dos copeiros ao seu cargo e matou o padeiro, conforme José lhes havia interpretado. O chefe dos copeiros deixou José na prisão, embora José lhe tivesse informado o que aconteceria, e não se lembrou de contar ao faraó o que José lhe havia dito, pois se esqueceu.'
