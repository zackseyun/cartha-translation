base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/002.yaml
  text: And in those days Pharaoh dreamed two dreams in one night concerning the matter of the famine that would come upon all the earth. And he awoke from his sleep and called all the interpreters of dreams who were in Egypt, and the diviners, and he told them both his dreams, but they were not able to understand.
translation:
  language: pt
  text: Naqueles dias, o faraó teve, numa só noite, dois sonhos a respeito da fome que viria sobre toda a terra. Ao despertar do sono, mandou chamar todos os intérpretes de sonhos que havia no Egito e também os adivinhos. Contou-lhes os dois sonhos, mas eles não conseguiram compreendê-los.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐለመ፡ ... ሕለመ፡ ክልኤተ
  choice: teve ... dois sonhos
  rationale: Expressa em português natural o ato de sonhar, preservando explicitamente o número de sonhos.
- source_word: በእንተ፡ ነገረ፡ ረኃብ
  choice: a respeito da fome
  rationale: Reproduz o sentido de assunto ou questão relativa à fome sem acrescentar uma interpretação.
- source_word: ዲበ፡ ኵሉ፡ ምድር
  choice: sobre toda a terra
  rationale: Mantém a extensão geográfica abrangente e a ambiguidade de 'terra' entre território e mundo habitado.
- source_word: መፈክራነ፡ ሕልም
  choice: intérpretes de sonhos
  rationale: Equivalente claro e corrente para os especialistas convocados a explicar sonhos.
- source_word: ወረቅይተ
  choice: e também os adivinhos
  rationale: Distingue este segundo grupo dos intérpretes de sonhos e torna natural em português a coordenação.
- source_word: ወአክሀሉ፡ አእምሮ
  choice: mas eles não conseguiram compreendê-los
  rationale: Reflete diretamente a incapacidade de entender, conforme a redação etíope, sem transformar a frase em incapacidade de comunicar o significado.
theological_decisions:
- issue: Alcance de 'toda a terra'
  choice: Preservar 'toda a terra'
  alternative: Explicitar 'todo o país' ou 'o mundo inteiro'
  rationale: O texto permite amplitude sem definir com precisão o alcance; a tradução não deve resolver essa ambiguidade.
- issue: Natureza dos especialistas egípcios
  choice: Manter separados 'intérpretes de sonhos' e 'adivinhos'
  alternative: Fundir ambos em 'sábios' ou 'magos'
  rationale: A fonte enumera grupos distintos, e preservá-los evita importar categorias teológicas externas.
translation_notes:
  register: Português moderno, digno e de leitura fluente, com ampla legibilidade brasileira. A ordem foi levemente ajustada para naturalidade, sem omitir grupos, ações ou relações temporais e causais do texto.
