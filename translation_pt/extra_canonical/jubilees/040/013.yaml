  yaml_path: translation/extra_canonical/jubilees/040/013.yaml
  text: And Joseph gathered food for each city within the city until they were full of grain, until they were unable to count and measure it because of its abundance.
translation:
  language: pt
  text: José reuniu mantimentos para cada cidade na própria cidade[a], até que elas ficaram cheias de cereal, até que, por causa de sua abundância, já não era possível contá-lo nem medi-lo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de cidade em cidade”.'
    reason: A construção ge'ez admite essa leitura mais literal, embora o contexto favoreça o armazenamento dos mantimentos de cada cidade nela própria.
lexical_decisions:
- source_word: ሲሳተ፡ (sisāta)
  choice: mantimentos
  rationale: Expressa alimento armazenado como provisão, de modo natural no contexto da fome.
- source_word: ለሀገር፡ ውስተ፡ ሀገር፡ (la-hagar wəsta hagar)
  choice: para cada cidade na própria cidade
  rationale: Preserva o sentido de guardar os mantimentos destinados a uma cidade dentro dessa mesma cidade, em vez de sugerir transporte entre cidades.
- source_word: መልአ፡ ስርናየ፡ (mal'a sərnāya)
  choice: ficaram cheias de cereal
  rationale: Traduz diretamente a ideia de estar cheio de cereal, sem antecipar a oração seguinte sobre a impossibilidade de contar e medir.
- source_word: ይስእኑ፡ ኍልቈቶ፡ ወሰፈረ፡ (yəs'ənu ḫʷəlqʷato wa-safara)
  choice: já não era possível contá-lo nem medi-lo
  rationale: Mantém contar e medir sob a mesma expressão de incapacidade e usa uma construção impessoal natural em português, pois o agente não é especificado com clareza.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com repetição de “até que” preservada para refletir a progressão do original. A construção impessoal no final evita impor um sujeito que o contexto não identifica explicitamente.
