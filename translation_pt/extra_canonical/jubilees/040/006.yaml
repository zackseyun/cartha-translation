  choice: favor e misericórdia
  rationale: Preserva os dois substantivos coordenados do ge'ez e sua distinção semântica.
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለፈርዖን
  choice: aos olhos do faraó
  rationale: Mantém o idiomatismo de aprovação ou boa acolhida presente no texto-fonte.
- source_word: ጠቢበ፡ ወማእረ
  choice: sábio e entendido
  rationale: Reproduz o par de qualidades intelectuais por termos naturais e distintos em português.
- source_word: መንፈሰ፡ እግዚአብሔር
  choice: o Espírito do Senhor
  rationale: Representa diretamente a expressão do texto, usando a forma bíblica consagrada em português.
theological_decisions:
- issue: Referência ao Espírito do Senhor
  choice: Espírito do Senhor
  alternative: espírito do Senhor
  rationale: A expressão designa o Espírito pertencente ou associado ao Senhor; a inicial maiúscula segue o uso bíblico português para a referência divina sem acrescentar explicação trinitária ao texto.
