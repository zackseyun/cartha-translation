  text: And the Lord gave Joseph favor and mercy in Pharaoh’s sight, and Pharaoh said to his servants, “We will not find a man wise and understanding like this man, for the spirit of the Lord is with him.”
translation:
  language: pt
  text: 'E o Senhor concedeu a José favor e misericórdia aos olhos do faraó. Então o faraó disse aos seus servos: “Não encontraremos homem sábio e entendido como este, pois o Espírito do Senhor está com ele.”'
  philosophy: optimal-equivalence
