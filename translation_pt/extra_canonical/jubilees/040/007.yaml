  yaml_path: translation/extra_canonical/jubilees/040/007.yaml
  text: And he appointed him second in all his kingdom, and made him ruler over all Egypt, and caused him to ride on Pharaoh’s second chariot. And he clothed him with garments of fine linen, and put a gold chain on his neck, and they proclaimed before him, “El, El,” and “Abrer”; and he gave him his signet ring into his hand, and set him over all his house, and magnified him, and said to him, “Only with respect to the throne alone will I be greater than you.”
translation:
  language: pt
  text: 'E ele o nomeou segundo em todo o seu reino, fez dele governante sobre todo o Egito e mandou que ele andasse no segundo carro do faraó. Vestiu-o com roupas de linho fino, pôs uma corrente de ouro em seu pescoço, e proclamaram diante dele: “El, El” e “Abrer”[a]. Entregou-lhe em sua mão o seu anel de sinete, colocou-o sobre toda a sua casa, engrandeceu-o e lhe disse: “Somente quanto ao trono serei maior do que você.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“El, El” e “Abrer”: aclamações cujo significado exato é incerto no texto ge’ez; por isso, foram mantidas em transliteração.'
    reason: Preserva uma dificuldade textual e lexical genuína, sem resolvê-la conjecturalmente ou harmonizá-la com o paralelo de Gênesis 41:43.
lexical_decisions:
- source_word: ዳግመ
  choice: o segundo
  rationale: Expressa a posição imediatamente inferior à do faraó no reino, sem acrescentar um título não presente no texto.
- source_word: ልብሰ፡ ቢሶስ
  choice: roupas de linho fino
  rationale: “ቢሶስ” é um empréstimo relacionado a byssos, termo usado para tecido fino, especialmente linho.
- source_word: ማዕተቤ
  choice: anel de selar
  rationale: No contexto de investidura e autoridade delegada, designa o anel usado como selo; a formulação mantém a função concreta do objeto.
- source_word: መንበር
  choice: trono
  rationale: Mantém a imagem régia e a única superioridade que o faraó reserva para si.
theological_decisions:
- issue: Sentido das aclamações “አል፡ አል፡ ... አቢርር”
  choice: Transliterar como “El, El” e “Abrer”
  alternative: Traduzir conjecturalmente como uma ordem de homenagem, por exemplo, “Ajoelhem-se”
  rationale: O sentido exato das fórmulas é incerto. A transliteração preserva o testemunho ge’ez e evita impor uma interpretação baseada apenas no paralelo de Gênesis 41:43.
translation_notes:
  register: Português moderno, claro e digno, com construção narrativa fluente e legibilidade brasileira. Mantiveram-se a repetição solene das ações de investidura e a distinção entre a autoridade concedida a José e a primazia régia do faraó.
