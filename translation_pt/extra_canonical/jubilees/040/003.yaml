  yaml_path: translation/extra_canonical/jubilees/040/003.yaml
  text: Then the chief cupbearer remembered Joseph and spoke about him to the king, and he brought him out from the prison house, and he told before him both his dreams.
translation:
  language: pt
  text: Então o chefe dos copeiros se lembrou de José e falou a respeito dele ao rei. O rei o tirou da prisão e lhe contou os dois sonhos que tivera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente: “ambos os sonhos dele”.'
    reason: O ge'ez emprega uma expressão com possessivo masculino singular; no contexto, ela se refere aos sonhos do rei.
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: chefe dos copeiros
  rationale: O título designa o principal oficial responsável pelas bebidas do rei; esta formulação é clara, natural e coerente com o contexto de José.
- source_word: ንጉሥ
  choice: rei
  rationale: Equivalente direto do termo ge'ez, sem substituir pelo título contextual 'faraó'.
- source_word: ቤተ፡ ሞቅሕ
  choice: prisão
  rationale: A expressão literalmente significa 'casa de prisão/cativeiro'; 'prisão' comunica naturalmente o referente em português.
- source_word: ሕለመሁ
  choice: os dois sonhos que ele havia tido
  rationale: O sufixo -ሁ marca posse masculina singular ('dele/seus'). A oração relativa evita a possível leitura portuguesa de que os sonhos pertenciam a José.
theological_decisions:
- issue: Identidade do sujeito que tirou José da prisão
  choice: O rei mandou tirá-lo da prisão
  alternative: e ele o tirou da casa da prisão
  rationale: A cadeia verbal ge'ez mantém um sujeito masculino singular, mas o contexto permite formular a ação como ordem régia; 'mandou tirar' evita sugerir de modo pouco natural que o rei foi pessoalmente à prisão, sem atribuir a ação ao copeiro.
- issue: Referente do possessivo em 'seus sonhos'
  choice: os dois sonhos que ele havia tido
  alternative: seus dois sonhos
  rationale: O ge'ez explicita o possessivo masculino singular, e o contexto indica o rei. A formulação preserva a posse e elimina a ambiguidade criada em português pela forma 'seus'.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. A repetição de sujeitos foi usada para desfazer ambiguidades pronominais próprias do português sem alterar a sequência dos acontecimentos.
