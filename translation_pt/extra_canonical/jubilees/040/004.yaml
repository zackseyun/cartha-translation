  text: And he said before Pharaoh that both his dreams were one, and he said to him, “Seven years of abundance will come in all the land of Egypt, and after this seven years of famine, such famine as has not been in all the earth.”
translation:
  language: pt
  text: 'E ele disse diante do faraó que os dois sonhos eram um só. E lhe disse: “Virão sete anos de abundância em toda a terra do Egito e, depois disso,[a] sete anos de fome, uma fome como nunca houve em toda a terra.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “depois deles”.
    reason: Embora o texto diga literalmente “depois disso”, a alternativa pode tomar como referente contextual os sete anos de abundância.
lexical_decisions:
- source_word: ክልኤሆሙ፡ ሕለመሁ፡ አሐዱ፡ እሙንቱ
  choice: os dois sonhos eram um só
  rationale: Reproduz diretamente a afirmação de que ambos os sonhos de faraó constituíam uma única mensagem.
- source_word: ጽጋብ
  choice: abundância
  rationale: No contexto dos sete anos, designa fartura ou abundância de provisões; “abundância” é natural e mantém o contraste com a fome.
- source_word: ወእምድኅረዝ
  choice: e, depois disso
  rationale: O demonstrativo é singular e corresponde formalmente a “depois disso”, em vez de “depois deles”.
- source_word: ረኃብ፡ ዘአኮ፡ ከማሁ፡ ረኃብ
  choice: uma fome como nunca houve
  rationale: Expressa em português corrente a ideia de uma fome sem precedente, sem conservar uma construção comparativa artificial.
- source_word: ውስተ፡ ኵሉ፡ ምድር
  choice: em toda a terra
  rationale: Mantém a abrangência universal da formulação ge'ez e não a restringe à terra do Egito.
