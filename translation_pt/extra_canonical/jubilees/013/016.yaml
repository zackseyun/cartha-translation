  yaml_path: translation/extra_canonical/jubilees/013/016.yaml
  text: And in the forty-first jubilee, in the third year of the first week, he returned to this place and offered a sacrifice upon it, and he called on the name of the LORD.
translation:
  language: pt
  text: E aconteceu que, no quadragésimo primeiro jubileu, no terceiro ano da primeira semana, ele voltou a este lugar, ofereceu sobre ele um sacrifício e invocou o nome do SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብአ፡ ውስተዝ፡ መካን፡
  choice: voltou a este lugar
  rationale: ገብአ exprime aqui o retorno de Abrão, e o demonstrativo ዝ indica “este”; a escolha também se ajusta ao movimento narrativo sem depender de harmonização externa.
- source_word: ወአዕረገ፡ በዲቤሁ፡ ጽንሓሐ፡
  choice: ofereceu ali um sacrifício
  rationale: A expressão descreve a apresentação de uma oferta/sacrifício sobre ou naquele lugar. “Ali” produz português natural, preservando a referência locativa sem introduzir um altar ausente do texto ge'ez.
- source_word: ወጸውዐ፡ በስመ፡ እግዚአብሔር፡
  choice: e invocou o nome do SENHOR
  rationale: Formulação tradicional e semanticamente direta para chamar/invocar o nome divino; “SENHOR” representa o título divino no texto.
theological_decisions:
- issue: Possível harmonização com Gênesis 13:4 pela construção de um altar
  choice: Não mencionar a construção de um altar
  alternative: “entrou naquele lugar e construiu ali um altar”
  rationale: O texto ge'ez fornecido fala de retorno e oferta de sacrifício, não da construção de um altar. Evita-se importar conteúdo de uma passagem paralela.
translation_notes:
  register: Português moderno, corrente e digno, com estrutura cronológica clara. “E aconteceu que” conserva o caráter narrativo da abertura; “primeira semana” mantém a terminologia calendárica própria de Jubileus.
