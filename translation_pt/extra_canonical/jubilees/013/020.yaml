    text: 'A frase continua no versículo 21, onde aparece o verbo: «não será contada».'
    reason: Esclarece que a construção fica incompleta neste limite de versículo e impede que se acrescente aqui um verbo que não está no texto.
  revision_rationale: A revisão melhora a fluência e emprega os equivalentes contextuais portugueses mais naturais para as duas imagens, sem alterar a estrutura essencial. Mantêm-se as reticências e a nota porque o texto ge'ez encerra o versículo com «também a sua descendência», e a negação verbal pertence ao versículo seguinte.
