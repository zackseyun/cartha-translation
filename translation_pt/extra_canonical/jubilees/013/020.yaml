revisions:
- from: Pois toda a terra que você vê, eu a darei a você e à sua descendência para sempre. Farei a sua descendência como a areia do mar; se alguém puder contar a areia da terra, também a sua descendência...[a]
  to: Pois eu darei para sempre a você e à sua descendência toda a terra que você vê. Farei a sua descendência como a areia do mar; se alguém puder contar o pó da terra, também a sua descendência...[a]
  rationale: A revisão melhora a fluência e emprega os equivalentes contextuais portugueses mais naturais para as duas imagens, sem alterar a estrutura essencial. Mantêm-se as reticências e a nota porque o texto ge'ez encerra o versículo com «também a sua descendência», e a negação verbal pertence ao versículo seguinte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:00:41Z'
review_pass:
  verdict: revise
  source_fidelity: A tradução preserva corretamente a promessa da terra, a destinatária coletiva de «descendência» e, sobretudo, a cláusula sintaticamente incompleta que continua no versículo 21. Contudo, o ge'ez emprega a mesma palavra nas duas imagens, mas o contexto idiomático pede «areia do mar» e «pó da terra»; essa distinção contextual também acompanha o registro do audit trail inglês e evita a expressão menos natural «contar a areia da terra».
  naturalness: O texto é claro, mas «toda a terra que você vê, eu a darei» tem uma vírgula desnecessária e uma ordem um pouco marcada. «Pois eu darei ... toda a terra que você vê» é mais fluente sem reduzir a solenidade. «Pó da terra» é uma colocação portuguesa estabelecida neste tipo de comparação.
  terminology: «Descendência» é uma boa opção coletiva e teologicamente não interpretativa para zarʾ. «Para sempre» traduz adequadamente a duração expressa. «Pó da terra» traduz contextual e naturalmente ኆፃ na segunda ocorrência, enquanto «areia do mar» permanece apropriado na primeira.
  issues:
  - severity: low
    issue: «Areia da terra»
    rationale: Embora a mesma palavra ge'ez ocorra nas duas imagens, «pó da terra» é o equivalente contextual mais natural em português e corresponde à oposição imagética «areia do mar / pó da terra» refletida no audit trail inglês.
  - severity: low
    issue: Pontuação e ordem da primeira oração
    rationale: A vírgula depois de «vê» não é necessária; reorganizar a oração torna a leitura mais natural em português contemporâneo.
  revised_text: Pois eu darei para sempre a você e à sua descendência toda a terra que você vê. Farei a sua descendência como a areia do mar; se alguém puder contar o pó da terra, também a sua descendência...[a]
  revised_footnotes:
