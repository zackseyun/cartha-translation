  text: For all the land that you see I will give to you and to your seed forever. And I will make your seed like the sand of the sea; if a man can count the dust of the earth, then your seed also
translation:
  language: pt
  text: Pois eu darei para sempre a você e à sua descendência toda a terra que você vê. Farei a sua descendência como a areia do mar; se alguém puder contar o pó da terra, também a sua descendência...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase continua no versículo 21, onde aparece o verbo: «não será contada».'
    reason: Esclarece que a construção fica incompleta neste limite de versículo e impede que se acrescente aqui um verbo que não está no texto.
lexical_decisions:
- source_word: ዘርእ (zarʾ)
  choice: descendência
  rationale: Expressa naturalmente em português o sentido coletivo de “semente” aplicado aos descendentes, preservando a repetição da promessa.
- source_word: ኆፃ (ḫoṣā)
  choice: areia
  rationale: O mesmo termo ocorre nas expressões “areia do mar” e “areia da terra”; traduzi-lo de modo uniforme evita introduzir a distinção “areia/pó”, ausente neste texto.
- source_word: እስከ፡ ለዓለም
  choice: para sempre
  rationale: Equivalente português corrente e digno para a expressão temporal de duração indefinida ou perpétua.
- source_word: ኍልቆ
  choice: contar
  rationale: No contexto, refere-se a determinar numericamente a areia; “contar” comunica isso com naturalidade sem tornar a frase excessivamente literal.
theological_decisions:
- issue: A promessa à “semente” de Abraão
  choice: descendência
  alternative: semente
  rationale: “Descendência” mantém o sentido coletivo sem decidir questões posteriores sobre a identidade ou extensão dos herdeiros da promessa.
- issue: Cláusula incompleta no limite do versículo
  choice: Manter “também a sua descendência...” sem acrescentar verbo
  alternative: Completar com “poderá ser contada”
  rationale: O texto ge'ez termina aqui com “e/também a sua descendência”; o verbo negativo que completa a construção aparece no versículo seguinte. Acrescentar um verbo positivo neste versículo contrariaria essa continuidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição de “descendência” e as duas imagens com “areia” foram preservadas. As reticências assinalam que a frase prossegue no versículo seguinte.
