  text: And one who had escaped came and told Abram that his brother’s son had been taken captive[24]. And he armed the servants born in his house . . . Upon Abram and upon his seed is the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him[24],
translation:
  language: pt
  text: E aquele que escapou veio e contou a Abrão que o filho de seu irmão havia sido levado cativo. Então ele armou os servos nascidos em sua casa... [a] A Abrão e à sua descendência cabe o primeiro dízimo para o SENHOR,[b] e o SENHOR o estabeleceu como estatuto perpétuo, para que o dessem aos sacerdotes que ministram diante dele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto é difícil e parece estar condensado ou incompleto neste ponto. Depois de “armou os servos nascidos em sua casa”, a narrativa passa bruscamente à instituição do dízimo; provavelmente havia aqui uma parte mais extensa da narrativa.
    reason: segmentation_note
  - marker: b
    text: 'A expressão também pode ser traduzida como “o dízimo principal” ou entendida como um dízimo inicial ligado às primícias. A construção em ge''ez é incomum; como a oração não traz verbo expresso, outra tradução possível é: “Sobre Abrão e sobre sua descendência foi imposto o primeiro dízimo para o SENHOR”.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: ተፄወወ፡ ወልደ፡ እኁሁ
  choice: o filho de seu irmão havia sido levado cativo
  rationale: Reproduz a relação de parentesco expressa no ge'ez e o sentido passivo de captura, sem substituir a formulação por uma identificação interpretativa como “seu sobrinho”.
- source_word: ዐሥራተ፡ ቀዳሚ
  choice: o primeiro dízimo
  rationale: Mantém a combinação incomum do substantivo “dízimo” com “primeiro”, preservando a dificuldade lexical do texto em vez de defini-la como dízimo principal ou dízimo das primícias.
- source_word: ይትቀነዩ፡ ቅድሜሁ
  choice: ministram diante dele
  rationale: Expressa o serviço cultual prestado pelos sacerdotes na presença do SENHOR em português bíblico atual e claro.
theological_decisions:
- issue: Natureza da obrigação do dízimo na oração sem verbo
  choice: A Abrão e à sua descendência cabe o primeiro dízimo para o SENHOR
  alternative: Sobre Abrão e sobre sua descendência foi imposto o primeiro dízimo para o SENHOR
  rationale: O ge'ez apresenta uma oração nominal, sem sujeito explícito para um verbo ativo como “impôs”. “Cabe” produz português natural e comunica a incumbência sem introduzir um agente não expresso.
- issue: Destinatários do dízimo
  choice: para que o dessem aos sacerdotes que ministram diante dele
  alternative: para que o dessem aos sacerdotes que o servem
  rationale: Conserva tanto a entrega aos sacerdotes quanto sua posição de serviço diante do SENHOR, sem acrescentar uma definição denominacional do sacerdócio.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Usa “SENHOR” para o nome divino conforme a convenção do projeto, “descendência” em vez de “semente” para clareza e “ministram” para o serviço sacerdotal. As reticências preservam a lacuna e a transição abrupta da edição-fonte.
