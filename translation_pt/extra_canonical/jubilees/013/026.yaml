  verdict: revise
  source_fidelity: 'O sentido central é fiel: a lei não tem termo temporal e estabelece a entrega de um décimo ao SENHOR, abrangendo produção agrícola, vinho e azeite. A explicitação de «sementes» como produtos da terra é defensável e corretamente resguardada por nota. Contudo, o propósito duradouro expresso no original é mais bem reproduzido em português pelo presente do subjuntivo («deem») do que pelo imperfeito («dessem»).'
  naturalness: O texto é claro, atual e de registro apropriado. A alteração de «que dessem» para «para que deem» torna a construção de finalidade mais natural e preserva melhor o caráter permanente da ordenança.
  terminology: «SENHOR», «décima parte», «vinho» e «azeite» são adequados. «Produtos da terra» comunica bem o provável alcance agrícola de «semente», sem eliminar o literal, que permanece indicado na nota.
  issues:
  - severity: low
    issue: Tempo verbal em «que dessem»
    rationale: Após «a estabeleceu ... para sempre», o imperfeito do subjuntivo pode apresentar a entrega como finalidade situada no passado. «Para que deem» expressa mais diretamente a finalidade normativa e contínua do texto.
