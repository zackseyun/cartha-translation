base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/026.yaml
  text: 'And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed[26] and from wine and from oil.'
translation:
  language: pt
  text: E esta lei não tem limite de dias, pois ele a estabeleceu para todas as gerações, para sempre, para que deem ao SENHOR a décima parte de tudo — dos produtos da terra[a], do vinho e do azeite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «da semente»; aqui, a expressão provavelmente se refere à produção ou colheita agrícola, e não apenas à semente reservada para o plantio.
    reason: cultural_note
lexical_decisions:
- source_word: ወሰነ፡ መዋዕል
  choice: limite de dias
  rationale: Preserva de perto a expressão etíope, que afirma não haver termo temporal para a lei, sem reduzir a ideia simplesmente a «prazo».
- source_word: ዓሥራተ
  choice: a décima parte
  rationale: Expressa em português corrente a porção de um décimo, isto é, o dízimo, sem acrescentar terminologia institucional.
- source_word: እምዘርእ
  choice: dos produtos da terra
  rationale: Embora o termo signifique literalmente «semente», neste contexto agrícola abrange a produção ou colheita da terra; a nota conserva o sentido literal.
- source_word: እምወይን፡ ወእምቅብእ
  choice: do vinho e do azeite
  rationale: Equivalentes naturais dos produtos agrícolas mencionados; «azeite» é preferível a «óleo» neste contexto bíblico.
theological_decisions:
- issue: Identidade daquele que estabeleceu a lei
  choice: ele a estabeleceu
  alternative: Deus a estabeleceu / Abraão a estabeleceu
  rationale: O texto deste versículo traz apenas o referente pronominal; mantê-lo evita decidir no próprio texto uma referência que depende do contexto.
- issue: Duração da ordenança
  choice: para todas as gerações, para sempre
  alternative: para as gerações eternas
  rationale: Mantém cumulativamente a linguagem de gerações e perpetuidade do original, sem enfraquecer nem reinterpretar sua força.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação preserva a solenidade jurídica do texto e sua ambiguidade quanto ao agente de «estabeleceu».
