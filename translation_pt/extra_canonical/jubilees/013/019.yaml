  yaml_path: translation/extra_canonical/jubilees/013/019.yaml
  text: In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,
translation:
  language: pt
  text: 'Naquele ano, quando Ló foi levado cativo, o SENHOR disse a Abrão, depois que Ló se separou dele, no quarto ano desta semana: “Erga os olhos e, do lugar onde você está morando, olhe para o norte, para o sul, para o oeste e para o leste,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፄወወ፡ ሎጥ
  choice: Ló foi levado cativo
  rationale: Expressa de modo natural o sentido passivo de Ló ter sido capturado.
- source_word: እግዚአብሔር
  choice: o SENHOR
  rationale: Segue a convenção bíblica portuguesa para o nome divino neste contexto.
- source_word: በ፬ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: no quarto ano desta semana
  rationale: Preserva a cronologia característica de Jubileus, em que 'semana' designa um período de sete anos.
- source_word: አንሥእ፡ አዕይንቲከ
  choice: Levante os olhos
  rationale: Mantém a imagem idiomática do texto-fonte em português bíblico claro.
- source_word: ሰሜን፡ ወሌብ፡ ወባሕር፡ ወጽባሕ
  choice: norte, sul, oeste e leste
  rationale: Traduz os quatro pontos cardeais; 'mar' funciona como designação do oeste e 'nascente' como designação do leste.
theological_decisions:
- issue: Representação do nome divino
  choice: SENHOR
  alternative: Senhor
  rationale: A forma em versaletes simuladas por maiúsculas comunica a convenção tradicional sem acrescentar interpretação doutrinária.
- issue: Continuidade da fala direta
  choice: Não fechar as aspas neste versículo
  alternative: Fechar as aspas ao fim do versículo
  rationale: A fala do SENHOR continua no versículo seguinte; a pontuação preserva essa continuidade.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por construções naturais de ampla compreensão e legibilidade brasileira. Conserva-se 'semana' como unidade cronológica própria da obra e a sequência dos quatro pontos cardeais do texto ge'ez.
