lexical_decisions:
- source_word: ኢይትኍለቍ
  choice: será incontável
  rationale: A forma negativa expressa a impossibilidade de contar; esta formulação preserva o sentido e se liga naturalmente à frase iniciada no versículo anterior.
- source_word: አንሶሱ
  choice: percorra
  rationale: O verbo indica andar ou circular pela terra; “percorra” transmite com naturalidade a ideia de atravessá-la para conhecê-la.
- source_word: ውስተ፡ ኑኃ፡ ወርኅባ
  choice: em toda a sua extensão, de uma ponta à outra
  rationale: A expressão corresponde às dimensões de comprimento e largura. A redação comunica a totalidade espacial em português corrente sem soar mecânica.
- source_word: ወርኢ፡ ኵሎ
  choice: e veja tudo
  rationale: Tradução direta da ordem para ver a totalidade da terra.
