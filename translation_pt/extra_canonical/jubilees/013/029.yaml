revisions:
- from: '“Dá-nos as pessoas que resgataste, mas os bens sejam teus.” Abrão lhe respondeu: “Ergui minha mão para Deus Altíssimo: não tomarei nada do que é teu, nem mesmo um fio ou uma correia de sandália, para que não digas: ‘Eu enriqueci Abrão’. Aceito somente o que os jovens comeram e a parte dos homens que foram comigo: Aner, Escol e Manre. Que eles recebam a parte que lhes cabe.”'
  to: '“Dá-nos as pessoas que resgataste, mas os bens sejam teus.” Abrão lhe respondeu: “Ergui as mãos ao Deus Altíssimo: não tomarei nada do que é teu, desde um fio até uma correia de sandália, para que não digas: ‘Eu enriqueci Abrão’ — exceto somente o que os jovens comeram e a parte dos homens que foram comigo: Aner, Escol e Manre. Que eles recebam a parte que lhes cabe.”'
  rationale: A revisão corrige a inversão introduzida por «Aceito somente», restabelecendo a exceção à recusa de Abrão. Também restitui «as mãos», conforme o original, e preserva todas as demais escolhas centrais do rascunho, inclusive o imperativo plural «Dá-nos».
