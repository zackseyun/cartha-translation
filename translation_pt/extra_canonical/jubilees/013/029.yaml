base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/029.yaml
  text: 'Give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: from a thread even to a sandal strap, I will not take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre; let them take their share.”'
translation:
  language: pt
  text: '“Dá-nos as pessoas que resgataste, mas os bens sejam teus.” Abrão lhe respondeu: “Ergui as mãos ao Deus Altíssimo: não tomarei nada do que é teu, desde um fio até uma correia de sandália, para que não digas: ‘Eu enriqueci Abrão’ — exceto somente o que os jovens comeram e a parte dos homens que foram comigo: Aner, Escol e Manre. Que eles recebam a parte que lhes cabe.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸግወነ
  choice: Dá-nos
  rationale: A forma ge’ez traz sufixo de primeira pessoa do plural; preserva-se a leitura própria de Jubileus sem harmonizá-la com Gênesis 14:21.
- source_word: ነፍሰ
  choice: as pessoas
  rationale: Embora o termo possa significar literalmente “alma”, neste contexto designa as pessoas resgatadas.
- source_word: ባሳሕከ
  choice: que resgataste
  rationale: Expressa a libertação das pessoas recuperadas por Abrão, em linguagem corrente e fiel ao contexto.
- source_word: እምፈትል፡ እስከ፡ ተታነ፡ እሣእነ
  choice: nem mesmo um fio ou uma correia de sandália
  rationale: Mantém os extremos concretos da expressão proverbial, com formulação idiomática em português.
- source_word: ወራዙት
  choice: os jovens
  rationale: Equivalente natural para os jovens ou moços que acompanharam a expedição.
- source_word: መክፈልቶሙ
  choice: a parte que lhes cabe
  rationale: Comunica claramente a porção ou quota devida aos aliados.
theological_decisions:
- issue: Destinatário do juramento de Abrão
  choice: Deus Altíssimo
  alternative: o Deus Altíssimo
  rationale: A ausência do artigo conserva a forma titular do texto sem acrescentar uma identificação não explicitada nesta frase.
- issue: Fórmula de juramento elíptica
  choice: “Ergui minha mão... não tomarei nada”
  alternative: “Ergui minha mão... se eu tomar...”
  rationale: A tradução torna inteligível a força negativa do juramento em português, sem completar a imprecação que o original deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Preserva-se “Dá-nos”, leitura do ge’ez, apesar da forma singular encontrada em tradições de Gênesis. A oração final foi levemente explicitada para naturalidade, sem alterar o sentido distributivo.
