- from: E Targal[a], rei das nações; e mataram o rei de Gomorra, mas o rei de Sodoma fugiu, e muitos caíram no betume do vale dos sodomitas[b], junto ao mar Salgado. Levaram cativos os habitantes de Sodoma, Admá e Zeboim; levaram também Ló, filho do irmão de Abrão, com todos os seus bens, e foram até Dã.
  to: E Targal[a], rei das nações; e mataram o rei de Gomorra, e o rei de Sodoma fugiu, e muitos caíram no betume do vale dos sodomitas[b], junto ao Mar Salgado. Levaram cativos os habitantes de Sodoma, Admá e Zeboim; levaram também Ló, filho do irmão de Abrão, com todos os seus bens, e foram até Dã.
