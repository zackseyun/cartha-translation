base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/023.yaml
  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
translation:
  language: pt
  text: E Targal[a], rei das nações; e mataram o rei de Gomorra, e o rei de Sodoma fugiu, e muitos caíram no betume do vale dos sodomitas[b], junto ao Mar Salgado. Levaram cativos os habitantes de Sodoma, Admá e Zeboim; levaram também Ló, filho do irmão de Abrão, com todos os seus bens, e foram até Dã.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Em geʿez, Targal, correspondente a Tidal em Gênesis 14:1.
    reason: lexical_choice
  - marker: b
    text: 'O geʿez diz literalmente: “no óleo/betume do vale dos sodomitas”. A expressão corresponde aos “poços de betume no vale de Sidim” de Gênesis 14:10. Charles (1902) considerou o texto corrompido e propôs “por ferimentos”, mas o geʿez pode ser compreendido como uma forma de transmitir a tradição de Gênesis.'
    reason: textual_critical
lexical_decisions:
- source_word: ተርጋል
  choice: Targal
  rationale: Translitera a forma geʿez do nome, sem substituí-la silenciosamente pela forma Tidal de Gênesis 14:1.
- source_word: ወጐየ
  choice: fugiu
  rationale: O verbo da edição crítica significa fugir e descreve a ação do rei de Sodoma.
- source_word: በቀብአ
  choice: no betume
  rationale: Embora qabʾa normalmente possa significar óleo ou unguento, neste contexto corresponde ao betume da tradição de Gênesis 14:10; não se adota a emenda conjectural 'por ferimentos'.
- source_word: ሰዶማውያን
  choice: dos sodomitas
  rationale: Reproduz a leitura explícita do geʿez, em vez de substituí-la por 'de Sidim'.
- source_word: ፄወዉ
  choice: Levaram cativos os habitantes de
  rationale: O verbo indica captura ou condução ao cativeiro; em português, explicitar 'os habitantes de' evita a impressão de que as cidades físicas foram transportadas.
- source_word: ጥሪቶ
  choice: bens
  rationale: Forma corrente e abrangente para as posses de Ló.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se o início fragmentário ligado ao contexto anterior e a leitura incomum 'vale dos sodomitas'. Usa-se 'mar Salgado' como nome geográfico transparente e 'Dã' conforme a forma bíblica portuguesa tradicional.
