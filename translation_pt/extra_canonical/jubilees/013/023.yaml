  source_fidelity: 'A tradução acompanha de modo geral o geʿez e preserva adequadamente as leituras distintivas: Targal, a morte do rei de Gomorra, a fuga do rei de Sodoma, o «vale dos sodomitas», a captura de Ló e de seus bens e a chegada a Dã. Contudo, «mas o rei de Sodoma fugiu» introduz uma relação adversativa que não está expressa no encadeamento coordenativo do original.'
  naturalness: O português é claro, moderno e apropriado ao registro narrativo. «Levaram cativos os habitantes de» é uma explicitação idiomática aceitável do emprego de nomes de cidades como referência a seus habitantes. A pontuação inicial conserva de forma compreensível a construção fragmentária dependente do contexto anterior.
  terminology: «Targal», «Gomorra», «Sodoma», «Admá», «Zeboim», «Ló», «Abrão» e «Dã» são formas adequadas. «Betume», «vale dos sodomitas» e «Mar Salgado» refletem as escolhas lexicais e a nota textual sem harmonizar indevidamente o texto com Gênesis.
