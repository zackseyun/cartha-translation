  text: for I will give it to your seed.” And Abram went to Hebron and settled there. And in this year Chedorlaomer king of Elam came, and Amraphel king of Shinar, and Arioch king of Ellasar,
translation:
  language: pt
  text: “pois eu a darei à sua descendência.” Então Abrão foi para Hebrom e se estabeleceu ali. Naquele ano, vieram Quedorlaomer, rei de Elão, Anrafel, rei de Sinar, e Arioque, rei de Elasar,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዘርእከ
  choice: à sua descendência
  rationale: O substantivo semítico correspondente a “semente” tem aqui sentido coletivo de posteridade; “descendência” comunica esse valor naturalmente em português.
- source_word: እሁብ
  choice: eu a darei
  rationale: Preserva a promessa na primeira pessoa e explicita com o pronome feminino a referência à terra no contexto precedente.
- source_word: ኀደረ
  choice: se estabeleceu
  rationale: No contexto de mudança para Hebrom, expressa residência ou permanência, e não apenas passar uma noite.
- source_word: መጽአ
  choice: vieram
  rationale: O verbo está no singular na sequência etíope, mas introduz uma lista coordenada de três reis; o plural produz português natural sem alterar o sentido narrativo.
theological_decisions:
- issue: Sentido de “semente” na promessa
  choice: descendência
  alternative: semente
  rationale: O contexto é uma promessa de terra à posteridade de Abrão. “Descendência” preserva o sentido coletivo sem introduzir uma identificação teológica mais específica.
translation_notes:
  register: Português moderno, claro e digno, com formas onomásticas bíblicas correntes no Brasil. A frase final permanece aberta com vírgula porque o versículo termina no meio da enumeração/narrativa.
