base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/015.yaml
  text: And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, to the place of the altar, between Bethel on the west and Ai on the east, and he blessed the LORD his God who had brought him back in peace.
translation:
  language: pt
  text: Então o faraó mandou embora Sarai, mulher de Abrão, e o expulsou da terra do Egito. Abrão foi para o lugar onde, no início, havia armado a sua tenda, para o lugar do altar, entre Betel, a oeste, e Ai, a leste; e bendisse o SENHOR, seu Deus, que o havia trazido de volta em paz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአገብአ፡ ፈርዖን፡ ሦራሃ
  choice: Então o faraó mandou embora Sarai
  rationale: Expressa de modo natural o ato causativo de fazê-la partir, mantendo Sarai como objeto explícito.
- source_word: ወአፍለሶ፡ እምድረ፡ ግብጽ
  choice: e o expulsou da terra do Egito
  rationale: Preserva a mudança para o pronome masculino, cujo referente contextual é Abrão, e a força de remoção do território.
- source_word: ኀበ፡ ተከለ፡ ደብተራሁ፡ እንተ፡ ቀዳማ
  choice: onde, no início, havia armado a sua tenda
  rationale: Formulação corrente que conserva a referência ao primeiro acampamento de Abrão.
- source_word: ውስተ፡ መካን፡ ምሥዋዕ
  choice: para o lugar do altar
  rationale: Mantém a ordem e a referência locativa explícita do texto etíope.
- source_word: አጌ፡ እምጽባሓ፡ ወቤቴል፡ እምባሕር
  choice: entre Betel, a oeste, e Ai, a leste
  rationale: Traduz literalmente as orientações semíticas baseadas no mar (oeste) e no nascer do sol/manhã (leste), reorganizando os elementos para clareza em português.
- source_word: ወባረከ፡ ለእግዚአብሔር፡ አምላኩ
  choice: e bendisse o SENHOR, seu Deus
  rationale: ‘Bendisse’ preserva o registro cultual; ‘SENHOR’ segue a convenção portuguesa para o nome divino representado pelo título etíope.
- source_word: ዘገብ፡ በሰላም
  choice: que o havia trazido de volta em paz
  rationale: Conserva a ideia de retorno seguro e explicita o valor perfectivo anterior ao ato de bendizer.
theological_decisions:
- issue: Identidade daquele que foi expulso do Egito
  choice: ‘o expulsou’, referindo-se a Abrão
  alternative: ‘os expulsou’ ou ‘expulsou Sarai’
  rationale: O texto muda de Sarai, objeto feminino do primeiro verbo, para um sufixo masculino singular no segundo; a tradução preserva essa distinção gramatical sem harmonizá-la.
- issue: Representação do título divino
  choice: SENHOR
  alternative: Senhor ou uma transliteração do nome divino
  rationale: A forma em versaletes segue uma convenção bíblica amplamente reconhecida e não acrescenta uma identificação denominacional específica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluida e nomes próprios nas formas bíblicas correntes no Brasil. A ordem ‘lugar do altar’ antes das coordenadas geográficas acompanha de perto o texto-fonte. Não são necessárias notas de rodapé.
