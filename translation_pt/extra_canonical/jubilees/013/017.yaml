  text: And he said, “You are God Most High, my God forever and ever.” And in the seventh year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.
translation:
  language: pt
  text: 'E ele disse: “Tu és o Deus Altíssimo, meu Deus para todo o sempre.” No sétimo ano desta semana, Ló separou-se dele, e Ló habitou em Sodoma; e os homens de Sodoma eram extremamente pecadores.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: Deus Altíssimo
  rationale: Expressa de modo natural e tradicional o título divino formado por ‘Deus’ e ‘Altíssimo’.
- source_word: ለዓለመ፡ ዓለም
  choice: para todo o sempre
  rationale: Reproduz o idiomatismo de duração perpétua em português corrente e digno.
- source_word: በ፯ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: No sétimo ano dessa semana
  rationale: Mantém a contagem cronológica do texto etíope; ‘semana’ designa aqui o período de sete anos no sistema narrativo de Jubileus.
- source_word: ኀደረ፡ ... ውስተ፡ ሰዶም
  choice: foi morar em Sodoma
  rationale: Traduz naturalmente a ideia de fixar residência ou habitar em Sodoma, sem acrescentar duração não expressa.
- source_word: ኃጥኣን፡ ጥቀ
  choice: extremamente pecadores
  rationale: Preserva tanto o predicado ‘pecadores’ quanto a forte intensificação ‘muito/extremamente’.
theological_decisions:
- issue: Identificação de Deus como ‘Altíssimo’ e ‘meu Deus’
  choice: Tu és o Deus Altíssimo, meu Deus
  alternative: Tu, Deus Altíssimo, és o meu Deus
  rationale: A formulação escolhida segue de perto a estrutura predicativa da fonte e não redefine a relação sintática como mera invocação.
- issue: Avaliação moral dos homens de Sodoma
  choice: eram extremamente pecadores
  alternative: eram muito maus
  rationale: Mantém o termo explicitamente ligado ao pecado, sem substituir a avaliação por uma descrição moral mais genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva a segunda pessoa singular solene na fala dirigida a Deus e usa uma formulação natural na sequência narrativa.
