lexical_decisions:
- source_word: አእከዮ፡ በልቡ፡
  choice: pesou-lhe no coração
  rationale: Expressa de modo natural e digno a ideia de aflição interior, preservando a referência explícita ao coração.
- source_word: ተፈልጠ፡
  choice: tivesse sido separado
  rationale: Mantém o sentido passivo da forma do texto-fonte sem especificar quem causou a separação.
- source_word: ወልደ፡ እኁሁ፡
  choice: o filho de seu irmão
  rationale: Tradução direta da relação de parentesco, sem substituir por um termo menos explícito como “sobrinho”.
- source_word: አልቦ፡ ውሉደ፡
  choice: não tinha filhos
  rationale: Reproduz com clareza a ausência de descendentes indicada pelo texto.
theological_decisions:
- issue: Agente da separação
  choice: 'Construção passiva sem agente: “tivesse sido separado dele”'
  alternative: “tivesse se separado dele”
  rationale: A construção escolhida preserva a voz passiva do texto ge'ez e não atribui implicitamente a iniciativa da separação ao sobrinho.
