- source_word: island(s)
  choice: ilhas
  rationale: Mantém o referente geográfico e conserva a repetição presente na evidência textual consultada.
- source_word: toward the border
  choice: em direção à fronteira
  rationale: Preserva o valor direcional sem definir indevidamente se as ilhas tocavam ou apenas se orientavam para essa fronteira.
