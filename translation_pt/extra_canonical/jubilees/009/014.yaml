  text: And Noah slept with his fathers[14], and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.
translation:
  language: pt
  text: … os malignos, atrás dos filhos de Noé. E [Noé] deu a Sem, seu filho, tudo o que havia escrito, a quem amava.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O excerto ge’ez fornecido começa no meio de uma oração e não traz explicitamente o sujeito de «deu»; «[Noé]» é recuperado do contexto imediato. A abertura conserva a elipse do fragmento: o texto traz «os malignos» e uma expressão ligada a estar ou ir atrás dos filhos de Noé, mas não traz negação, impedimento nem o substantivo «espíritos».'
    reason: textual_note
lexical_decisions:
- source_word: እኩያን
  choice: '[espíritos] malignos'
  rationale: A forma significa literalmente “malignos” ou “maus”. O substantivo “espíritos” é recuperado entre colchetes do contexto imediato da obra, pois o trecho ge’ez fornecido começa no meio da oração.
- source_word: እምድኅሬሆሙ፡ ለውሉደ፡ ኖኅ
  choice: não perseguissem os filhos de Noé
  rationale: A expressão espacial ligada a “atrás/depois deles” descreve os seres malignos indo atrás dos filhos de Noé; em português natural, “perseguir” comunica essa relação. A negação e a ideia de impedimento dependem da parte anterior da oração, ausente no excerto, e por isso são explicitadas na nota.
- source_word: ኵሎ፡ ዘጸሐፈ
  choice: tudo o que havia escrito
  rationale: Reproduz diretamente a totalidade do escrito e usa o mais-que-perfeito composto para situar a escrita antes da entrega.
- source_word: ለሴም፡ ወልዱ
  choice: a Sem, seu filho
  rationale: Mantém a relação familiar e a construção dativa do ge’ez em português claro.
- source_word: ዘይፈህቅ
  choice: a quem amava
  rationale: Preserva a oração relativa do texto fornecido sem acrescentar o grau comparativo encontrado em outras formas textuais ou traduções.
theological_decisions:
- issue: Identidade dos “malignos”
  choice: '[espíritos] malignos'
  alternative: os malignos
  rationale: O contexto literário identifica os agentes como espíritos, mas o substantivo não consta no fragmento fornecido; os colchetes distinguem com transparência a restauração contextual do texto efetivamente preservado no excerto.
- issue: Finalidade da restrição dos espíritos
  choice: não perseguissem os filhos de Noé
  alternative: fossem impedidos de fazer mal aos filhos de Noé
  rationale: “Perseguir” fica mais próximo da expressão ge’ez “atrás deles” e evita definir de modo excessivo a forma exata do dano.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. As reticências iniciais e os colchetes tornam visível que o testemunho fornecido é fragmentário, em vez de apresentar como explícitas palavras preservadas apenas pelo contexto.
