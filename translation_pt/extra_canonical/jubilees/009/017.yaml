base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/017.yaml
  text: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men because of the righteousness in which he was perfect, except for Enoch. For Enoch's role was created as a testimony to the generations of the world, so that he might recount all the deeds to the generations.
translation:
  language: pt
  text: Dezenove jubileus, duas semanas e cinco anos. Ele superou todos os filhos dos homens, exceto Enoque, por causa da justiça na qual foi perfeito. Pois Enoque foi criado como testemunha para as gerações do mundo, para que relatasse todos os feitos às gerações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዮቤልው፡ ወክልኤ፡ ሱባዔ፡ ወ፭ዓመተ
  choice: Dezenove jubileus, duas semanas e cinco anos
  rationale: Mantém as unidades cronológicas explícitas do ge’ez; no contexto, “semanas” designa períodos de sete anos.
- source_word: ዘአፈድፈደ፡ ሐዩዎ፡ ዲበ፡ ምድር፡ እምውሉደ፡ ሰብእ
  choice: foi o tempo que ele viveu na terra, mais do que os filhos dos homens
  rationale: Expressa naturalmente a comparação de longevidade presente no texto, sem acrescentar uma identificação nominal ausente deste versículo.
- source_word: በእንተ፡ ጽድቅ፡ ዘባቲ፡ ፍጹመ፡ ኮነ
  choice: por causa da justiça na qual foi perfeito
  rationale: Preserva tanto a relação causal quanto a formulação de perfeição ligada à justiça.
- source_word: ዘእንበለ፡ ሄኖክ
  choice: com exceção de Enoque
  rationale: Reproduz a exceção explícita, sem explicar além do que o texto afirma.
- source_word: ገብሩ፡ ለሄኖክ፡ ተፈጥሮተ
  choice: a função de Enoque foi estabelecida
  rationale: “Função” comunica aqui o encargo ou papel atribuído a Enoque; “foi estabelecida” oferece português idiomático para a forma passiva sem sugerir que a pessoa de Enoque foi criada nesse momento.
- source_word: ለስምዕ፡ ለትዝምደ፡ ዓለም
  choice: como testemunho para as gerações do mundo
  rationale: Mantém o propósito testemunhal e o alcance transgeracional do original.
- source_word: ከመ፡ ይንገር፡ ኵሎ፡ ግብረ፡ ለትውልደ
  choice: a fim de que ele relatasse às gerações todos os feitos
  rationale: Conserva a oração de finalidade e a referência abrangente a “todos os feitos”, sem especificar seus autores onde o original não o faz.
theological_decisions:
- issue: O sentido da perfeição do personagem
  choice: “a justiça na qual foi perfeito”
  alternative: “sua perfeita justiça”
  rationale: A escolha mantém separadas as ideias de justiça e de ter sido perfeito nela, preservando a formulação e a possível tensão teológica do original.
- issue: A natureza do papel de Enoque
  choice: “a função de Enoque foi estabelecida como testemunho”
  alternative: “Enoque foi criado para servir de testemunho”
  rationale: Evita transformar uma afirmação sobre o encargo de Enoque numa afirmação sobre a criação de sua pessoa e acompanha a leitura contextual refletida pela tradição textual consultada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe foi levemente reorganizada para clareza, preservando a contagem cronológica, a comparação de longevidade, a exceção de Enoque e a finalidade testemunhal de sua função. A nota inglesa herdada foi omitida porque pertence à tradução anterior, reconhecidamente desalinhada com este texto-fonte.
