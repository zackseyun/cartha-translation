revisions:
- from: Dezenove jubileus, duas semanas e cinco anos foi o tempo que ele viveu na terra, mais do que os filhos dos homens, por causa da justiça na qual foi perfeito — com exceção de Enoque. Pois a função de Enoque foi estabelecida como testemunho para as gerações do mundo, a fim de que ele relatasse às gerações todos os feitos.
  to: Dezenove jubileus, duas semanas e cinco anos. Ele superou todos os filhos dos homens, exceto Enoque, por causa da justiça na qual foi perfeito. Pois Enoque foi criado como testemunha para as gerações do mundo, para que relatasse todos os feitos às gerações.
  rationale: A enumeração cronológica é mantida como frase nominal, como no texto-fonte. A oração seguinte recupera a comparação qualitativa e sua base causal, sem convertê-la em comparação de longevidade. A declaração sobre Enoque é traduzida diretamente como criação para o testemunho, e a finalidade de relatar todos os feitos às gerações é preservada. A nota inglesa herdada pertence a outra passagem e não deve ser mantida.
