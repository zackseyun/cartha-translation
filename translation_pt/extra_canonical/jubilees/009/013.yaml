  source_fidelity: A tradução acerta «Noé», «plantas da terra», o registro escrito e «os espíritos». Contudo, «também acerca dos enganos deles» não reproduz adequadamente ምስለ, cujo sentido básico é «com/juntamente com»; o inglês POB também registra explicitamente essa relação. A redação revista preserva essa relação aditiva sem criar uma construção portuguesa que pareça dizer que os enganos foram instruídos.
  naturalness: O português do rascunho é geralmente claro, mas «instruímos Noé também acerca dos enganos deles» desloca a relação sintática do original. «Demos a conhecer a Noé ... juntamente com os enganos deles» é mais natural no contexto elíptico e conserva a associação indicada pelo texto.
  terminology: «Plantas da terra», «toda espécie de cura» e «os espíritos foram contidos» são escolhas adequadas. Não se deve acrescentar «malignos» ao texto principal, embora a nota contextual seja admissível.
  issues:
  - severity: medium
    issue: A construção ምስለ («com; juntamente com») foi vertida no texto principal como «também acerca de».
    rationale: Isso converte uma relação de acompanhamento/associação em simples assunto do ensino. A nota registra a leitura mais literal, mas não compensa a alteração no texto principal; o inglês POB auditado confirma «along with their deceptions».
