  yaml_path: translation/extra_canonical/jubilees/009/013.yaml
  text: And we told Noah along with their deceptions, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book concerning every kind of healing, and the spirits were restrained.
translation:
  language: pt
  text: E demos a conhecer a Noé, juntamente com os enganos deles[a], como poderiam ser curados pelas plantas da terra. Noé escreveu num livro tudo o que lhe havíamos ensinado a respeito de toda espécie de cura, e os espíritos[b] foram contidos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “com os erros deles”.'
    reason: አስሕተትሙ pode referir-se a enganos, erros ou desvios; «juntamente com» traduz ምስለ («com») no texto principal.
  - marker: b
    text: 'Ou: “os espíritos malignos”.'
    reason: O contexto os apresenta como nocivos, mas መናፍስት significa literalmente apenas «os espíritos».
lexical_decisions:
- source_word: አስሕተትሙ፡
  choice: os enganos deles
  rationale: O termo pode designar enganos, erros ou desvios; “enganos” preserva aqui a ideia contextual de ações enganadoras dos espíritos sem acrescentar uma qualificação ausente no texto.
- source_word: ዕፀወ፡ ምድር
  choice: plantas da terra
  rationale: Tradução direta e natural da expressão referente à vegetação terrestre empregada para a cura.
- source_word: በኵሉ፡ ትዝምደ፡ ፈውሳት፡
  choice: a respeito de toda espécie de cura
  rationale: Expressa de modo corrente a abrangência das instruções terapêuticas registradas por Noé.
- source_word: ወተዐጸዉ፡ መናፍስት፡
  choice: e os espíritos foram contidos
  rationale: Mantém a voz passiva e traduz መናፍስት sem inserir “maus”, qualificação inferível do contexto, mas ausente desta forma lexical.
theological_decisions:
- issue: Identidade moral dos espíritos
  choice: os espíritos
  alternative: os espíritos malignos
  rationale: O contexto aponta para espíritos nocivos, mas o texto desta oração diz apenas “espíritos”; a tradução principal evita tornar explícito o que permanece implícito.
- issue: Relação sintática de ምስለ com “os enganos deles”
  choice: também acerca dos enganos deles
  alternative: juntamente com os enganos deles
  rationale: A construção etíope é compacta e admite incerteza quanto ao elemento coordenado; a redação principal produz português compreensível sem apagar a nuance aditiva, enquanto a nota conserva a formulação mais literal.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. “Instruímos” acomoda o contexto de ensino retomado na oração seguinte; as notas preservam as ambiguidades lexical e sintática do ge’ez.
