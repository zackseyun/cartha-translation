base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/018.yaml
  text: And in the thirty-third jubilee[18], in the first year of the second week, Peleg took for himself a wife whose name was Lomna, the daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land.”
translation:
  language: pt
  text: 'E no trigésimo terceiro jubileu, no primeiro ano da segunda semana, Pelegue tomou para si uma mulher chamada Lomna, filha de Sinear. No quarto ano dessa semana, ela lhe deu um filho. E ele lhe deu o nome de Reú, pois disse: “Eis que os filhos dos homens se tornaram maus por causa do propósito perverso de construir para si uma cidade e uma torre na terra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ፡ ሎቱ፡ ፋሌክ፡ ብእሲተ
  choice: Pelegue tomou para si uma mulher
  rationale: Mantém de perto a construção etíope de tomada matrimonial, em português natural e sem acrescentar uma cerimônia não expressa.
- source_word: ሎምና
  choice: Lomna
  rationale: Transliteração direta do nome próprio preservado no texto ge'ez.
- source_word: ሲናአር
  choice: Sinear
  rationale: Emprega a forma bíblica portuguesa amplamente reconhecível para Shinar.
- source_word: ራገው
  choice: Reú
  rationale: Usa a forma bíblica portuguesa corrente do nome Reu.
- source_word: እኩያነ
  choice: maus
  rationale: Reproduz o sentido moral do adjetivo sem intensificação indevida.
- source_word: በምክረ፡ ዐግ
  choice: por causa do propósito perverso
  rationale: Representa a ideia de conselho, desígnio ou propósito mau; 'propósito' soa natural e conserva o nexo causal.
- source_word: ሀገረ፡ ወማኅፈደ
  choice: uma cidade e uma torre
  rationale: O contexto da narrativa de Babel sustenta 'torre' para o segundo substantivo, conforme a tradição textual e a consulta auditada.
theological_decisions:
- issue: Causa ou manifestação da maldade humana
  choice: “se tornaram maus por causa do propósito perverso”
  alternative: “tornaram-se maus no conselho perverso”
  rationale: Conserva a relação expressa pela preposição ge'ez sem transformar a declaração em uma doutrina mais ampla sobre a origem do mal.
- issue: Referência coletiva de “filhos dos homens”
  choice: “os filhos dos homens”
  alternative: “a humanidade”
  rationale: Preserva a formulação tradicional e a imagem genealógica do original, sem restringi-la a um sexo nem apagá-la por paráfrase.
translation_notes:
  register: Português moderno, digno e acessível, com grafias bíblicas de boa legibilidade brasileira. A nota inglesa sobre medidas da torre não pertence ao conteúdo deste versículo e, por isso, não foi reproduzida. A divisão em três frases melhora a leitura sem alterar a sequência do original.
