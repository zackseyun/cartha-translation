  text: And for Japheth came out the third portion beyond the river Tina, toward the north of the outflow of its waters, and it extends northeastward to the whole region of Gog and to all the country east of it.
translation:
  language: pt
  text: A Jafé coube a terceira porção, além do rio Tina, ao norte de onde suas águas desembocam; ela se estende para o nordeste, até toda a região de Gogue e toda a terra a leste dela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መክፈልት / “portion”
  choice: porção
  rationale: Mantém o sentido territorial da parte atribuída a Jafé, em linguagem clara e compatível com o contexto da divisão das terras.
- source_word: “came out”
  choice: coube
  rationale: Expressa em português natural o resultado da distribuição das porções, sem alterar o conteúdo do enunciado.
- source_word: “northeastward”
  choice: para o nordeste
  rationale: Reproduz de modo direto a orientação geográfica.
- source_word: “country”
  choice: terra
  rationale: Evita sugerir o conceito político moderno de país e preserva o sentido territorial amplo.
