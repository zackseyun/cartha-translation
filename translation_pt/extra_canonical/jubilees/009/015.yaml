lexical_decisions:
- source_word: እስመ
  choice: Pois
  rationale: Expressa a relação explicativa ou causal do conector ge'ez sem acrescentar informação.
- source_word: ኪያሁ ያፈቅር
  choice: ele o amava
  rationale: Mantém os referentes pronominais do texto-fonte, inclusive a identidade não explicitada do objeto.
- source_word: ፈድፋደ እምኵሉ ውሉዱ
  choice: mais do que a todos os seus filhos
  rationale: Reproduz a comparação e o alcance de 'todos os seus filhos' em português natural.
- source_word: ወኖመ ኖኅ ምስለ አበዊሁ
  choice: E Noé dormiu com seus pais
  rationale: Preserva literalmente a fórmula tradicional para a morte, sem convertê-la em explicação interpretativa.
theological_decisions:
- issue: Identidade daquele a quem ele amava
  choice: Manter 'o' sem nomear o referente
  alternative: Explicitar 'Arfaxade'
  rationale: O texto ge'ez fornecido usa pronome, não o nome; explicitar o referente resolveria uma referência que o versículo mantém implícita.
- issue: Eufemismo de morte
  choice: dormiu com seus pais
  alternative: morreu e foi reunido aos seus antepassados
  rationale: A formulação-fonte deve conservar sua imagem e possível ressonância teológica, sem paráfrase explicativa.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do ge'ez. Conserva-se a ambiguidade pronominal e a expressão bíblica tradicional 'dormiu com seus pais'.
