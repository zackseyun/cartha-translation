  text: And for Tubal there came out a fifth portion in the midst of the tongue that approaches toward the portion of Lud, as far as the other tongue, into the region beyond the other tongue.
translation:
  language: pt
  text: E a Tubal coube uma quinta porção, no meio da faixa de terra[a] que se estende em direção à porção de Lude, até a outra faixa de terra, entrando na região além dessa outra faixa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “língua”; aqui, o termo parece designar uma faixa ou projeção de terra.
    reason: Preserva a imagem e a incerteza do termo geográfico original.
  - marker: b
    text: 'A descrição geográfica do texto original é obscura. Outra tradução possível é: “dentro da região da outra faixa de terra”.'
    reason: Registra uma alternativa sintática antiga sem ocultar a dificuldade textual.
lexical_decisions:
- source_word: ወለቱቤልሂ
  choice: E a Tubal coube
  rationale: A forma ge'ez identifica Tubal como o beneficiário da porção; a expressão inicial «እዴ፡ ሉድ» pertence ao fim da unidade anterior.
- source_word: መክፈልት፡ ኃምስ
  choice: uma quinta porção
  rationale: Reproduz diretamente a numeração e a terminologia da divisão territorial.
- source_word: ልሳን
  choice: faixa de terra
  rationale: O sentido literal é «língua», mas aqui o termo descreve uma formação ou projeção geográfica; «faixa de terra» comunica essa função sem fingir precisão cartográfica.
- source_word: ማዕዶተ
  choice: além de
  rationale: O termo indica o lado oposto ou a região para lá de um limite, e não apenas localização dentro dele.
