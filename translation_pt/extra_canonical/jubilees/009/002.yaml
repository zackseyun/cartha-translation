  text: And it extends to all the mountains of fire, and it extends toward the west to the sea of Atel, and it extends westward until it reaches the sea of Mauk, that sea into which everything that descends is not destroyed.
translation:
  language: pt
  text: E estende-se até todas as montanhas de fogo; estende-se em direção ao oeste, até o mar de Atel, e continua para o oeste até chegar ao mar de Mauk, o mar no qual tudo o que nele desce não é destruído.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o mar em que tudo o que desce não perece”. A construção indica que aquilo que desce no mar não é destruído.'
    reason: Esclarece de modo conciso a relação entre “tudo o que desce” e “não é destruído”, sem inserir histórico editorial na nota.
lexical_decisions:
- source_word: ባሕር
  choice: mar
  rationale: Equivalente direto e natural do substantivo ge'ez para uma grande extensão de água.
- source_word: ይወርድ
  choice: desce
  rationale: Preserva o sentido espacial do verbo e sua relação com aquilo que entra no mar.
- source_word: ኢይመስን
  choice: não é destruído
  rationale: Expressa a negação e o sentido passivo de perecer ou sofrer destruição sem especificar indevidamente o processo.
- source_word: Atel / Mauk
  choice: Atel / Mauk
  rationale: Mantém os topônimos tradicionais transliterados, sem tentar identificá-los com lugares modernos incertos.
theological_decisions:
- issue: Relação entre a oração relativa e o verbo negativo na descrição do mar de Mauk
  choice: “nada do que nele desce é destruído”
  alternative: “no qual desce tudo o que não é destruído”
  rationale: A sintaxe ge'ez faz de “tudo o que desce nele” o sujeito de “não é destruído”; a alternativa inverte essa relação e altera o sentido.
translation_notes:
  register: Português moderno, claro e digno, com repetição deliberada de “estende-se” para conservar a cadência geográfica do texto. A formulação “nada do que nele desce” é idiomática e mantém a afirmação abrangente do original.
