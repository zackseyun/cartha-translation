revisions:
- from: E estende-se até todas as montanhas de fogo; estende-se em direção ao oeste, até o mar de Atel, e continua para o oeste até chegar ao mar de Mauk, o mar no qual nada do que nele desce é destruído.[a]
  to: E estende-se até todas as montanhas de fogo; estende-se em direção ao oeste, até o mar de Atel, e continua para o oeste até chegar ao mar de Mauk, o mar no qual tudo o que nele desce não é destruído.[a]
  rationale: A revisão substitui “nada do que nele desce” por “tudo o que nele desce não é destruído”, que reproduz de forma inequívoca a sintaxe e o sentido do ge'ez, bem como a decisão registrada na auditoria inglesa. Também simplifica a nota para que ela sirva ao leitor da tradução.
