  text: The third tongue. And for Mesek came forth the sixth portion, all the region beyond the third tongue.
translation:
  language: pt
  text: 'A terceira língua. E a Meseque coube a sexta porção: toda a região além da terceira língua.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a região da terceira língua”.'
    reason: A construção geográfica e o valor exato de ማዕዶተ permitem entender a frase como a região situada além da terceira língua ou, menos especificamente, como a região pertencente a ela.
lexical_decisions:
- source_word: ልሳን፡ ሣልስት (lisāna śālist)
  choice: a terceira língua
  rationale: Mantém o sentido literal de “língua/idioma” e preserva a formulação geográfica incomum do texto, sem substituí-la interpretativamente por “povo” ou “território”.
- source_word: ለሞስክ (la-Mosḵ)
  choice: a Meseque
  rationale: Emprega a forma portuguesa tradicional do nome bíblico Meshech/Mosoch.
- source_word: ወፅአ፡ መክፈልት፡ ሳድስ (waṣ'a makfalt sādis)
  choice: coube a sexta porção
  rationale: A expressão literal “saiu a sexta porção” descreve o resultado da repartição; “coube” comunica isso naturalmente em português sem alterar o sentido.
- source_word: ኵሉ፡ ማዕዶተ (kwellu maʿədota)
  choice: toda a região além
  rationale: ማዕዶተ pode indicar o outro lado, a área além ou a região situada para lá de um limite; “região além” conserva essa relação espacial.
theological_decisions: []
translation_notes:
  register: Português atual, digno e acessível. O início fragmentário, “A terceira língua”, foi preservado porque reflete a estrutura do texto-fonte e sua continuidade com o contexto anterior.
