  text: And this is the land that came out for Ham, as the portion which he was to occupy forever, for himself and for his sons throughout their generations forever.
translation:
  language: pt
  text: E esta é a terra que saiu em sorte para Cam, como a porção que ele deveria possuir para sempre, para si e para seus filhos, por todas as suas gerações, para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፅአ፡ መክፈልት፡
  choice: saiu em sorte ... como a porção
  rationale: No contexto da divisão territorial, a expressão indica a porção atribuída por sorteio; a formulação preserva a imagem de algo que “saiu” em sorte e soa natural em português.
- source_word: የአኅዝ፡
  choice: deveria possuir
  rationale: Expressa a tomada e manutenção da terra como posse, sem acrescentar uma ideia de conquista que o verbo não exige.
- source_word: ለውሉዱ፡
  choice: para seus filhos
  rationale: “Filhos” mantém o sentido concreto de descendência imediata, que em seguida é estendido pela expressão “por todas as suas gerações”.
