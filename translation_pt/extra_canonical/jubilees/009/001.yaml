base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/001.yaml
  text: And for the south there came out his portion[1], for Shem, as far as it approaches the middle of the sea. And for Madai there came out a portion, that he should possess from the west of his two brothers, as far as the islands and as far as their borders.
translation:
  language: pt
  text: E o interior de sua porção estendia-se para o sul, até se aproximar do mar de Meate.[a] A Madai coube uma porção, para que tomasse posse da região a oeste de seus dois irmãos, até as ilhas e os confins delas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início desta seção de distribuição de terras está fragmentário nas linhas fornecidas. «Mar de Meate» translitera o nome do texto; também se tem entendido a expressão como «o meio do mar».
    reason: textual_uncertainty
lexical_decisions:
- source_word: ውሳጥያቲሁ፡ ለደቡብ
  choice: o interior de sua porção estendia-se para o sul
  rationale: O segmento literalmente indica o interior ou a parte interior «para o sul». «De sua porção» explicita com moderação o referente possessivo no contexto imediato da distribuição territorial.
- source_word: ባሕረ፡ ሜአት
  choice: mar de Meate
  rationale: Trata ሜአት como topônimo transliterado, em vez de o converter sem segurança em «meio do mar»; a expressão e a segmentação do trecho são textualmente incertas.
- source_word: መክፈልት
  choice: porção
  rationale: No contexto de repartição de terras, «porção» comunica uma parte territorial atribuída sem sugerir acaso tão fortemente quanto «sorte».
- source_word: የአኅዝ
  choice: tomasse posse
  rationale: O verbo pode significar agarrar, tomar ou possuir; aqui, a aquisição de território favorece «tomar posse», sem a conotação excessivamente violenta de «apoderar-se».
- source_word: ለክአኢሆሙ፡ አኅዊሁ
  choice: de seus dois irmãos
  rationale: Preserva explicitamente o numeral dual «dois», reconhecido na revisão textual, e liga a expressão à localização a oeste.
- source_word: ደስያት፡ ወእስከ፡ ጽነፊሆን
  choice: as ilhas e os confins delas
  rationale: Mantém os dois elementos geográficos e entende o sufixo plural feminino como retomando «ilhas».
