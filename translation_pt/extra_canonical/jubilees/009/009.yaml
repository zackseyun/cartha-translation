  yaml_path: translation/extra_canonical/jubilees/009/009.yaml
  text: And the prince of spirits, Mastema, came and said, "Lord, Creator, leave some of them to me, and let them listen to my voice and do everything that I tell them; for if none of them is left to me, I will not be able to exercise the authority of my will among the children of men, because they are for corrupting and leading astray before my judgment, for great is the evil of the sons of men."
translation:
  language: pt
  text: 'E o príncipe dos espíritos, Mastema, veio e disse: “Senhor, Criador, deixa alguns deles comigo, para que escutem a minha voz e façam tudo o que eu lhes disser. Pois, se nenhum deles me for deixado, não poderei exercer a autoridade da minha vontade entre os filhos dos homens, porque eles servem para corromper e desviar antes do meu julgamento, pois grande é a maldade dos filhos dos homens.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “E veio o anjo dos espíritos, Mastema”. O termo etíope normalmente significa “anjo” ou “mensageiro”; “príncipe” interpreta, no contexto, a autoridade de Mastema sobre os espíritos.
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: o príncipe dos espíritos, Mastema
  rationale: Preserva o título explícito do texto etíope e identifica Mastema pelo nome; embora መልአክ também possa significar “anjo” ou “mensageiro”, o contexto apresenta uma figura de autoridade sobre espíritos.
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: deixa alguns deles comigo
  rationale: Expressa o pedido para que uma parte dos espíritos seja poupada da reclusão e permaneça à disposição de Mastema.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: exercer a autoridade da minha vontade
  rationale: Mantém a combinação tensa de autoridade/poder e vontade presente na fonte, sem reduzi-la simplesmente a “meu domínio”.
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: para corromper e desviar
  rationale: Reproduz os dois infinitivos de finalidade, distinguindo corrupção de indução ao erro.
- source_word: ውሉደ፡ ሰብእ
  choice: filhos dos homens
  rationale: Conserva a expressão antropológica tradicional da fonte, em registro bíblico compreensível.
theological_decisions:
- issue: Identidade e título de Mastema
  choice: “o príncipe dos espíritos, Mastema”
  alternative: “o anjo dos espíritos, Mastema” ou “o príncipe Mastema”
  rationale: A tradução mantém tanto a referência aos espíritos quanto o nome próprio, sem identificar Mastema explicitamente com Satanás nem omitir parte do título.
- issue: Relação entre a ação dos espíritos e o julgamento de Mastema
  choice: “eles servem para corromper e desviar antes do meu julgamento”
  alternative: “eles foram destinados a corromper e desviar sob o meu juízo”
  rationale: Preserva a formulação difícil e sua ambiguidade teológica, evitando definir se “meu julgamento” significa autoridade judicial, condenação futura ou atuação anterior ao juízo.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com leve cadência bíblica. Mantiveram-se “filhos dos homens” e a expressão deliberadamente incomum “autoridade da minha vontade” para refletir de perto a fonte. O marcador [a] aparece no texto principal.
