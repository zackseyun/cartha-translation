  choice: grande mar
  rationale: Preserva a referência ao “grande mar”, em vez de transformar a expressão em “grandes águas”.
- source_word: Gēyon
  choice: Giom
  rationale: Emprega a forma portuguesa bíblica corrente do nome do rio.
- source_word: mangala ʾazēb (conforme a revisão source-grounded)
