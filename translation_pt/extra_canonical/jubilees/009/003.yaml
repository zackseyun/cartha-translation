  yaml_path: translation/extra_canonical/jubilees/009/003.yaml
  text: And it goes forth toward the north to the limits of Gadir, and it goes forth to the coast of the waters of the great sea, until it approaches the river Gihon; and it goes along the south of the waters of Gihon to the bank of this river.
translation:
  language: pt
  text: E a divisa segue para o norte até os limites de Gadir; depois, segue até a costa das águas do grande mar, até se aproximar do rio Giom. Então, segue ao sul das águas do Giom até a margem desse rio.
  philosophy: optimal-equivalence
