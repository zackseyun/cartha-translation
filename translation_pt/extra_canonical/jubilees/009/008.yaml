base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/008.yaml
  text: And the angel of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me from among them, I will not be able to exercise the authority of my will over the children of men, for these are for corrupting and leading astray before my judgment, for great is the wickedness of the children of men.”
translation:
  language: pt
  text: 'E o anjo dos espíritos, Mastema, veio e disse: “Senhor, Criador, deixa que alguns deles permaneçam diante de mim, que escutem a minha voz e façam tudo o que eu lhes disser. Pois, se alguns deles não me forem deixados dentre eles, não poderei exercer a autoridade da minha vontade sobre os filhos dos homens, porque eles servem para corromper e desencaminhar antes do meu julgamento, pois grande é a maldade dos filhos dos homens.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡ መስተማ
  choice: o anjo dos espíritos, Mastema
  rationale: Mantém a construção nominal e preserva explicitamente o nome próprio መስተማ, sem o confundir com uma oração relativa.
- source_word: አትርፍ፡ እምኔሆሙ፡ ቅድሜየ
  choice: deixa que alguns deles permaneçam diante de mim
  rationale: Expressa o pedido para que uma parte dos espíritos seja poupada ou deixada sob a presença e direção de Mastema.
- source_word: ገቢረ፡ ስልጣነ፡ ፈቃድየ
  choice: exercer a autoridade da minha vontade
  rationale: Reproduz a combinação de ação, autoridade e vontade sem reduzir a expressão simplesmente a poder ou domínio.
- source_word: ለአማስኖ፡ ወለአስሕቶ
  choice: para corromper e desencaminhar
  rationale: Conserva os dois infinitivos de finalidade e sua progressão sem acrescentar uma interpretação denominacional.
- source_word: ቅድመ፡ ኵነኔየ
  choice: antes do meu julgamento
  rationale: Segue de perto o valor temporal de ቅድመ e mantém a primeira pessoa presente no texto-fonte.
theological_decisions:
- issue: A agência dos espíritos na corrupção humana
  choice: “eles servem para corromper e desencaminhar”
  alternative: “estes existem para que eu corrompa e desencaminhe”
  rationale: A formulação preserva a referência gramatical aos espíritos e evita explicitar um sujeito causador que o texto não identifica de modo inequívoco.
- issue: A autoridade reivindicada por Mastema
  choice: “a autoridade da minha vontade”
  alternative: “o poder que desejo”
  rationale: Mantém a tensão do pedido de Mastema e a formulação incomum do original, sem legitimar nem reinterpretar teologicamente essa autoridade.
translation_notes:
  register: Português moderno, claro e solene, com períodos naturais. Conservam-se “Mastema”, “filhos dos homens” e a expressão deliberadamente tensa “antes do meu julgamento”. O ኵሎ inicial parece concluir a unidade precedente e, em conformidade com a delimitação tradicional do versículo, não foi incorporado como palavra isolada nesta tradução.
