  source_fidelity: 'A estrutura principal está correta: «um de nós» é destinatário de «ele disse», e «que ensinássemos» conserva adequadamente a primeira pessoa do plural. «Lugar do juízo» e a manutenção do «pois» final correspondem bem ao fragmento e à continuidade da frase. Contudo, «remédios contra eles» explicita uma relação que o ge''ez ኵሎ፡ ፈውሶሙ («todos os seus remédios» / «todos os remédios deles») deixa menos determinada.'
