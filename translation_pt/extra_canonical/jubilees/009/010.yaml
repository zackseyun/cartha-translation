  text: And he said[10], "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And he told one of us that we should teach Noah all their remedies, for
translation:
  language: pt
  text: 'E ele disse: “Que um décimo deles[a] permaneça diante dele, e que as outras nove partes desçam ao lugar do juízo.” Então ele disse a um de nós que ensinássemos a Noé todos os seus remédios, pois'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A permanência de um décimo deles explica, neste capítulo, a continuidade da atividade dos espíritos malignos depois do dilúvio.
    reason: cross_reference
lexical_decisions:
- source_word: መካነ፡ ደይን
  choice: lugar do juízo
  rationale: Reproduz de modo natural a expressão ge'ez para o lugar associado ao julgamento, sem especificar além do texto.
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ
  choice: Então ele disse a um de nós
  rationale: Mantém ለ, que marca “um de nós” como destinatário, e não como sujeito de “disse”.
- source_word: ንምሀር፡ ለኖኅ
  choice: que ensinássemos a Noé
  rationale: Expressa a forma verbal de primeira pessoa do plural e conserva Noé como destinatário do ensino.
- source_word: ኵሎ፡ ፈውሶሙ
  choice: todos os remédios contra eles
  rationale: “Remédios” preserva o campo semântico de cura; “contra eles” esclarece em português que se trata dos meios de combater os espíritos, sem transformar a expressão em cura dos próprios espíritos.
- source_word: እስመ
  choice: pois
  rationale: Mantém a conjunção causal no fim do fragmento, indicando que a frase continua no versículo seguinte.
theological_decisions:
- issue: Permanência de parte dos espíritos após o dilúvio
  choice: “Que um décimo deles permaneça diante dele”
  alternative: Explicitar a identidade, a função ou a autoridade desses espíritos
  rationale: A formulação conserva a explicação própria do capítulo e sua referência pronominal, sem acrescentar uma interpretação teológica.
- issue: Quem falou a um dos anjos
  choice: “ele disse a um de nós”
  alternative: “um de nós disse”
  rationale: A preposição ge'ez ለ faz de “um de nós” o destinatário da fala. A alternativa inverteria a estrutura sintática e alteraria o agente.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. O fragmento termina em “pois” para preservar a continuidade sintática com o versículo seguinte.
