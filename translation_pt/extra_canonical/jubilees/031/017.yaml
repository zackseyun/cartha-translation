  yaml_path: translation/extra_canonical/jubilees/031/017.yaml
  text: May your table be full, and may your food not fail for all ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And the one who blesses you,
translation:
  language: pt
  text: Que a sua mesa esteja cheia, e que o seu alimento não falte por todas as eras. Todos os que odeiam você cairão diante de você, e todos os seus adversários serão arrancados pela raiz e perecerão. E aquele que abençoar você,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማዕድከ፡ ምልእተ
  choice: a sua mesa esteja sempre farta
  rationale: Reproduz a imagem concreta da mesa cheia em português natural; “farta” comunica abundância sem abandonar a metáfora.
- source_word: እክልከ
  choice: o seu alimento
  rationale: O termo designa comida ou provisão, frequentemente cereal; “alimento” preserva a abrangência adequada ao contexto da bênção.
- source_word: ለኵሉ፡ ዓለማት
  choice: por todas as gerações
  rationale: A expressão temporal aponta para duração contínua através das eras; “por todas as gerações” é clara e se harmoniza com a linguagem de bênção duradoura.
- source_word: ይደቁ
  choice: cairão
  rationale: Mantém o sentido de serem derrubados ou caírem diante do destinatário.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: serão arrancados pela raiz e perecerão
  rationale: Conserva tanto a imagem de extirpação completa quanto o verbo subsequente de destruição.
- source_word: ወዘይባርከከ
  choice: E aquele que abençoar você,
  rationale: Mantém a oração nominal incompleta no fim do versículo; o predicado pertence ao versículo seguinte.
theological_decisions:
- issue: A bênção final atravessa a divisão entre os versículos 17 e 18
  choice: Encerrar com “E aquele que abençoar você,”
  alternative: “E bendito seja aquele que abençoar você,”
  rationale: O texto ge'ez deste versículo contém apenas o sujeito, “aquele que abençoar você”; antecipar o predicado resolveria indevidamente a construção e duplicaria o conteúdo do versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural de bênção. Emprega “você” para ampla legibilidade brasileira e preserva deliberadamente a frase suspensa no final, conforme a divisão textual.
