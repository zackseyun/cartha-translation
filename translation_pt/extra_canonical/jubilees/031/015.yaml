  yaml_path: translation/extra_canonical/jubilees/031/015.yaml
  text: and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness[15], and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be in their mouths
translation:
  language: pt
  text: e santidade. Que ele os engrandeça por todas as eras. Eles serão governantes, juízes e chefes para toda a descendência dos filhos de Jacó. Proclamarão com justiça a palavra do Senhor, julgarão com justiça todos os seus juízos e darão a conhecer os seus caminhos a Jacó e as suas veredas[a] a Israel. A bênção do Senhor estará em suas bocas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão traduzida por “suas veredas a Israel” é textualmente difícil; alguns intérpretes entendem um sentido mais forte, como “seus preceitos” ou “sua disciplina” para Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውስተ፡ ኵሉ፡ ዓለማት
  choice: por todas as eras
  rationale: Reproduz a extensão temporal plural da expressão etíope em português natural, sem reduzi-la apenas ao presente mundo.
- source_word: መኳንንተ፡ ወመሳፍንተ፡ ወመላእክተ
  choice: governantes, juízes e chefes
  rationale: Mantém a tríade de funções de autoridade conforme a leitura contextual atestada pela camada de consulta, em linguagem clara e sem sugerir que os descendentes se tornariam seres angelicais.
- source_word: ቃሎ፡ ለእግዚአብሔር
  choice: a palavra do Senhor
  rationale: É a correspondência direta e tradicional da construção genitiva, com registro bíblico corrente.
- source_word: በጽድቅ
  choice: com justiça
  rationale: Expressa o valor adverbial da locução e preserva sua repetição enfática nas duas orações.
- source_word: በረከተ፡ ለእግዚአብሔር፡ … አፉሆሙ
  choice: A bênção do Senhor estará em sua boca
  rationale: Mantém a afirmação simples de presença indicada pelo texto, sem acrescentar a ideia de que a bênção lhes seria dada.
theological_decisions:
- issue: Sentido do termo difícil paralelo a “caminhos” na declaração dirigida a Israel
  choice: suas veredas
  alternative: seus preceitos / sua disciplina
  rationale: Conserva o paralelismo poético com “caminhos” e a ambiguidade recebida, enquanto a nota registra sentidos mais fortes propostos para o termo textualmente difícil.
- issue: Identidade do agente em “Que ele os engrandeça”
  choice: manter o pronome “ele”
  alternative: explicitar “o Senhor”
  rationale: O fragmento fonte emprega uma referência pronominal dependente do contexto anterior; explicitá-la resolveria uma relação que este versículo isolado não torna plenamente explícita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo preservado e repetição deliberada de “com justiça”. O início em minúscula mantém o caráter fragmentário de “e santidade”, que continua a frase do contexto anterior. “Em sua boca” conserva o singular coletivo da imagem sem acrescentar um verbo de concessão ausente do texto.
