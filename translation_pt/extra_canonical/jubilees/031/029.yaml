  text: in that you have seen me alive, and I also have seen you, my son. Prosper and fulfill the vow that you have vowed, and do not delay your vow, for you will be called to account concerning the vow, and now hasten to perform it.
translation:
  language: pt
  text: Visto que você me viu vivo, e eu também vi você, meu filho, prospere e cumpra o voto que fez. Não adie o seu voto, pois você será chamado a prestar contas a respeito dele; agora, apresse-se em cumpri-lo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ባቲ፡
  choice: Visto que
  rationale: A expressão funciona aqui como conjunção causal ou explicativa, sem antecedente feminino explícito que exija a tradução temporal “no dia em que”.
- source_word: ተስፋሕ፡
  choice: prospere
  rationale: Mantém o valor imperativo e o sentido de florescer ou ir bem, em linguagem portuguesa natural e digna.
- source_word: ጸሎተ፡
  choice: voto
  rationale: Embora o termo possa normalmente designar oração, o contexto de fazer, não adiar e cumprir aponta para um compromisso solene ou voto.
- source_word: ትትኀሠሥ፡
  choice: você será chamado a prestar contas
  rationale: Expressa idiomaticamente a ideia passiva de ser procurado ou requerido em razão do voto, sem especificar quem fará a cobrança.
- source_word: ጕጕአ፡ ትግበራ፡
  choice: apresse-se em cumpri-lo
  rationale: Reproduz a exortação urgente à execução do voto e evita a construção pouco natural “fazê-lo”.
theological_decisions:
- issue: Natureza de ጸሎት no contexto
  choice: voto
  alternative: oração
  rationale: A sequência “fez”, “não adie” e “cumpra” favorece um voto religioso; “oração” tornaria a ação de cumprir menos coerente no contexto imediato.
- issue: Agente da prestação de contas
  choice: construção passiva sem agente expresso
  alternative: Deus cobrará de você
  rationale: O texto-fonte não identifica explicitamente o agente; acrescentar Deus resolveria uma ambiguidade que deve ser preservada.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “você” para ampla legibilidade brasileira. A repetição integral de “voto” foi reduzida por pronomes onde isso melhora a fluidez sem perder o referente.
