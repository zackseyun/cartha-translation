lexical_decisions:
- source_word: ጽርሕ
  choice: aposento
  rationale: Designa o recinto ou quarto interior onde Isaque estava; “aposento” conserva o tom digno e permanece claro em português moderno.
- source_word: ኀበ፡ ይስክብ፡ ህየ
  choice: onde ele estava deitado
  rationale: O advérbio resumptivo ህየ (“ali”) é natural em ge'ez, mas seria redundante após “onde” em português.
- source_word: እዴ፡ አቡሁ
  choice: a mão do pai
  rationale: Expressa de modo natural o gesto de Jacó ao tomar a mão de seu pai, sem o tornar mais específico do que o texto permite.
- source_word: ተሰቅለ
  choice: se agarrou a
  rationale: Preserva a ideia de Isaque se prender ou se apegar a alguém ou algo; o complemento não consta do excerto fornecido.
