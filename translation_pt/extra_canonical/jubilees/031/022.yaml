  yaml_path: translation/extra_canonical/jubilees/031/022.yaml
  text: He had seen the sons of Jacob his son truly. And he went out from between his feet and fell down and bowed to him. And he blessed them and rested there near Isaac his father that night[22], and they ate and drank.
translation:
  language: pt
  text: Ele tinha visto verdadeiramente[a] os filhos de Jacó, seu filho. Então Jacó saiu de entre os pés dele[b], caiu e se prostrou diante dele. Ele os abençoou e, naquela noite, repousou ali, perto de Isaque, seu pai; e eles comeram e beberam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em justiça”.'
    reason: lexical_ambiguity
  - marker: b
    text: A expressão “saiu de entre os pés dele” reproduz uma formulação obscura do texto; provavelmente descreve Jacó afastando-se da presença imediata de Isaque antes de se prostrar.
    reason: segmentation_note
lexical_decisions:
- source_word: ዘበጽድቅ (za-ba-ṣədq)
  choice: verdadeiramente
  rationale: A expressão funciona aqui de modo adverbial, com o sentido provável de “em verdade” ou “verdadeiramente”. A alternativa mais literal é registrada em nota para preservar a ambiguidade.
- source_word: ወወፅአ እማእከለ እገሪሁ
  choice: Então Jacó saiu de entre os pés dele
  rationale: Mantém a imagem incomum do ge'ez sem substituí-la por uma explicação conjectural. O nome “Jacó” explicita a mudança de sujeito exigida pelo contexto imediato, pois é ele quem depois repousa perto de Isaque, seu pai.
- source_word: ወድቀ ወሰገደ ሎቱ
  choice: prostrou-se e inclinou-se diante dele
  rationale: Reproduz os dois verbos sucessivos de queda e reverência, evitando reduzir a construção a um único gesto.
- source_word: ወአዕረፈ ህየ ቅሩበ ይስሐቅ አቡሁ
  choice: repousou ali, perto de Isaque, seu pai
  rationale: Segue de perto a ordem e as relações explícitas do texto, em português natural.
theological_decisions:
- issue: Sentido de ዘበጽድቅ
  choice: verdadeiramente
  alternative: em justiça / na justiça
  rationale: O valor adverbial “verdadeiramente” se ajusta melhor à frase, mas o sentido ligado a “justiça” é lexicalmente possível e, por isso, permanece em nota.
- issue: Referentes dos sujeitos e pronomes
  choice: Explicitar Jacó somente na mudança de sujeito
  alternative: Manter apenas “ele” em toda a sequência
  rationale: O sujeito inicial é entendido pelo contexto como Isaque, enquanto aquele que repousa perto de “Isaque, seu pai” é Jacó. Explicitar Jacó evita uma referência impossível em português sem alterar os demais pronomes além do necessário.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por equivalência ótima. A construção obscura referente aos pés foi preservada no corpo do texto e esclarecida sem dogmatismo em nota.
