base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/007.yaml
  text: She heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing.”
translation:
  language: pt
  text: 'Ela ouviu: “Eis que Jacó, seu filho, chegou.” E o beijou. Ela viu seus dois filhos e os reconheceu, e lhe perguntou: “Estes são seus filhos, meu filho?” Ela os abraçou, os beijou e os abençoou, dizendo: “Em vocês será honrada a descendência de Abraão, e vocês se tornarão uma bênção.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሁ
  choice: Eis que
  rationale: Preserva a partícula apresentativa enfática do geês em registro digno e corrente.
- source_word: ውሉዱ
  choice: os dois filhos dele
  rationale: O substantivo significa filhos/crianças; o contexto identifica os dois como filhos de Jacó, e a formulação evita a ambiguidade do possessivo português.
- source_word: ዘርአ፡ አብርሃም
  choice: a descendência de Abraão
  rationale: ‘Descendência’ comunica naturalmente o sentido coletivo de ‘semente’ neste contexto genealógico.
- source_word: ይክበር
  choice: será honrada
  rationale: Mantém o valor passivo e o campo semântico de honra/glória sem ampliar o sentido.
- source_word: ብክሙ … ትከውኑ
  choice: Em vocês … vocês se tornarão
  rationale: As formas do geês são plurais e se dirigem aos dois filhos, distinção preservada explicitamente em português.
theological_decisions:
- issue: Destinatários da bênção
  choice: 'Plural: “vocês”'
  alternative: 'Singular: “você”'
  rationale: A morfologia plural do texto-fonte indica que a declaração é dirigida aos dois filhos, apesar da possível ambiguidade de traduções que usam ‘you’.
- issue: Extensão da bênção
  choice: “uma bênção”, sem complemento locativo
  alternative: “uma bênção na terra”
  rationale: O texto geês fornecido não contém expressão correspondente a ‘na terra’; não se acrescentou conteúdo de outras tradições textuais ou contextos paralelos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem narrativa foi levemente ajustada em “Ao ver...” para fluência, sem alterar os participantes nem a sequência dos acontecimentos. Não foram necessárias notas de rodapé.
