base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/020.yaml
  text: and in you shall the salvation of Israel be found. And on the day you sit on the throne of the glory of your righteousness[20], there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed.
translation:
  language: pt
  text: e em ti se encontrará a salvação de Israel. E, no dia em que te assentares no trono da glória da tua justiça[a], haverá grande paz para toda a descendência dos filhos do amado. Bendito seja aquele que te abençoar; e todos os que te odiarem e te afligirem, e também os que te amaldiçoarem, serão arrancados pela raiz e destruídos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «trono da glória da tua justiça» é sintaticamente densa e também pode ser entendida de modo mais compacto como «trono glorioso da tua justiça».
    reason: segmentation_note
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: a salvação de Israel
  rationale: Reproduz diretamente a expressão nominal do ge'ez, sem especificar indevidamente se a salvação é uma pessoa, um ato ou uma condição.
- source_word: ወአመ፡ ዕለት
  choice: E, no dia em que
  rationale: Mantém o substantivo temporal explícito ዕለት, “dia”, que não deve ser reduzido simplesmente a “quando”.
- source_word: መንበረ፡ ክብር
  choice: trono da glória
  rationale: Traduz መንበር como “trono” e ክብር como “glória”, em registro solene e natural.
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: toda a descendência dos filhos do amado
  rationale: Preserva a construção genealógica densa e lê ለፍቅር como referência ao “amado”, sem a substituir pela ideia não atestada de “para sempre”.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: serão arrancados pela raiz e destruídos
  rationale: 'Conserva as duas imagens verbais coordenadas: erradicação e perdição/destruição.'
theological_decisions:
- issue: Relação sintática entre “glória”, “tua justiça” e “grande paz”
  choice: “no trono da glória da tua justiça, haverá grande paz”
  alternative: “no trono da glória, tua justiça será grande paz”
  rationale: A sequência ge'ez é compacta e admite mais de uma segmentação. O texto principal segue a leitura tradicional refletida na camada inglesa auditada, enquanto a nota registra a alternativa que toma ጽድቅከ como sujeito de ትከውን.
- issue: Identidade do “amado”
  choice: manter “o amado” sem identificar o referente
  alternative: explicitar uma personagem ou grupo específico
  rationale: O versículo não nomeia explicitamente o referente; identificá-lo no texto importaria uma interpretação.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com formas pronominais solenes moderadas (“te”, “tua”) adequadas a uma bênção patriarcal. A ordem foi levemente ajustada para fluidez, sem eliminar a densidade ou a ambiguidade do original.
