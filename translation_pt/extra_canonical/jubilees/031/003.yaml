  yaml_path: translation/extra_canonical/jubilees/031/003.yaml
  text: And he went up on the new moon of the seventh month, to Bethel. And he built an altar in the place where he had lodged, and he set up there a pillar, and he sent to his father Isaac that he should come to him.
translation:
  language: pt
  text: Na lua nova do sétimo mês, ele subiu a Betel. Construiu um altar no lugar onde havia passado a noite, ergueu ali uma coluna e mandou dizer a seu pai Isaque que viesse até ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: na lua nova do sétimo mês
  rationale: A expressão designa o início ou a lua nova do sétimo mês; não há no texto a palavra que significaria «ano».
- source_word: ኖመ
  choice: havia passado a noite
  rationale: O verbo indica dormir ou pernoitar num lugar; esta formulação é natural em português e adequada ao contexto.
- source_word: ሐውልተ
  choice: coluna
  rationale: Designa uma pedra ou coluna erguida como marco; «coluna» mantém a linguagem bíblica corrente sem acrescentar uma função não expressa.
- source_word: ፈነወ፡ ኀበ፡ አቡሁ፡ ይስሐቅ
  choice: mandou dizer a seu pai Isaque
  rationale: Reproduz o ato de enviar uma mensagem a Isaque, deixando a oração seguinte explicitar o pedido.
