  source_fidelity: 'A tradução reproduz com precisão a sequência do ge''ez: a subida a Betel na lua nova do sétimo mês, a construção do altar no local da pernoite, a ereção de uma coluna e o envio de uma mensagem a Isaque para que viesse. «Na lua nova do sétimo mês» corresponde ao texto e evita corretamente a antiga leitura errônea «no primeiro mês, no sétimo ano».'
