  yaml_path: translation/extra_canonical/jubilees/031/001.yaml
  text: And on the new moon of the month Jacob spoke to all the people of his house, saying, “Purify yourselves and change your garments, and let us rise and go up to Bethel, where I prayed to him in the day when I fled from the face of Esau my brother, and he was with me and brought me back into this land in peace. And put away
translation:
  language: pt
  text: 'E, na lua nova do mês[a], Jacó disse a todos os de sua casa: “Purifiquem-se, mudem suas roupas e vamos subir a Betel, onde orei a Deus no dia em que fugi de meu irmão Esaú. Ele esteve comigo e me trouxe de volta a esta terra em paz. Afastem”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “no primeiro dia do mês”. A lua nova marcava o início do mês.'
    reason: A expressão pode ser comunicada pelo fenômeno lunar ou por sua função calendárica.
lexical_decisions:
- source_word: በሠርቀ፡ ወርኅ፡
  choice: na lua nova do mês
  rationale: A expressão ge'ez designa a lua nova, isto é, o início do mês, e não o primeiro mês do ano.
- source_word: ንጽሑ፡
  choice: Purifiquem-se
  rationale: Mantém o imperativo plural reflexivo e sua conotação de purificação.
- source_word: ወወልጡ፡ አልባሲክሙ፡
  choice: troquem de roupa
  rationale: Forma corrente e clara para o imperativo literal de mudar as vestes.
- source_word: በኀበ፡ ጸለይኩ፡ ሎቱ፡ ጸሎተ፡
  choice: onde orei a Deus
  rationale: O pronome masculino remete a Deus no contexto; explicitar o referente produz português natural sem acrescentar uma identificação controversa.
- source_word: ወሜጠኒ፡
  choice: me trouxe de volta
  rationale: O verbo expressa retorno, não apenas deslocamento até um lugar.
- source_word: ወአስስሉ፡
  choice: Afastem
  rationale: É um imperativo plural que continua a fala de Jacó; seu objeto aparece no versículo seguinte, por isso a frase e as aspas permanecem abertas.
theological_decisions:
- issue: Referente de “a ele” na oração de Jacó
  choice: a Deus
  alternative: a ele
  rationale: O contexto identifica naturalmente Deus como destinatário da oração, e a explicitação evita uma construção pouco natural em português sem introduzir conteúdo denominacional.
- issue: Continuidade da fala no fim do versículo
  choice: manter a fala aberta após “Afastem”
  alternative: encerrar a citação em “terra”
  rationale: O último verbo do texto-fonte é um imperativo dirigido à casa de Jacó, e o complemento vem no versículo seguinte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com imperativos na terceira pessoa do plural. Preserva-se deliberadamente o final incompleto do versículo, pois a ordem continua no versículo seguinte.
