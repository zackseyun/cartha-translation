  text: he had prayed, and when he came, he might set him on a donkey. And Isaac said to Jacob his son, “I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to travel. Set your mother on a beast and let her go."”
translation:
  language: pt
  text: 'Ele havia orado e, quando chegasse, o colocaria sobre um jumento.[a] Então Isaque disse a seu filho Jacó: “Não posso acompanhar você, pois estou velho e não consigo suportar a viagem. Vá em paz, meu filho, pois hoje tenho cento e sessenta e cinco anos. Já não consigo viajar. Ponha sua mãe sobre um animal e deixe que ela vá.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando chegou, colocou-o sobre um jumento”. A forma verbal também pode ser entendida como ação realizada, embora favoreça uma ação projetada ou subsequente.'
    reason: Preserva a ambiguidade temporal e modal da construção ge'ez.
  - marker: b
    text: 'Ou: “Ponha sua mãe sobre um animal e vá”. A última forma verbal pode ser entendida como “que ela vá” ou como uma ordem dirigida a Jacó: “vá você”.'
    reason: Preserva a ambiguidade entre a terceira pessoa feminina e a segunda pessoa masculina na forma verbal.
lexical_decisions:
- source_word: ጸለየ
  choice: havia orado
  rationale: O verbo significa ‘orar’; o mais-que-perfeito composto mantém a relação retrospectiva indicada pelo contexto sem recorrer ao sentido incorreto ‘fez um voto’.
- source_word: ይጽዐኖ
  choice: o colocaria
  rationale: A forma imperfeita/subjuntiva indica ação projetada ou subsequente, não um simples passado narrativo; o pronome objeto masculino foi preservado.
- source_word: በፍኖት
  choice: a viagem
  rationale: Neste contexto, o termo relativo a caminho ou percurso designa naturalmente a jornada que Isaque não consegue suportar.
- source_word: ነጊደ
  choice: viajar
  rationale: Expressa deslocamento ou jornada; ‘viajar’ é corrente e evita introduzir a ideia específica de montar um animal, ausente desta oração.
- source_word: ጻዐና ለአምካ
  choice: Ponha sua mãe sobre um animal de carga
  rationale: Torna explícita em português a ação de fazer a mãe montar, preservando a referência inequívoca a ‘sua mãe’; o animal é recuperado do contexto imediato.
