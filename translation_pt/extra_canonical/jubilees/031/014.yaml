base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/014.yaml
  text: and your children throughout all the ages. And may the Lord give to you and to your seed great understanding for glory. And may he bring you and your seed near to him from among all flesh, to minister in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your children be for glory and greatness
translation:
  language: pt
  text: e os seus filhos por todas as eras. Que o Senhor dê a você e à sua descendência grande entendimento[a], para glória. E que ele aproxime você e a sua descendência de si, dentre toda a humanidade, para ministrarem em seu santuário como os anjos da Presença e como os santos. Assim como eles são, também a descendência de seus filhos será, para glória e grandeza.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «grandeza de coração».'
    reason: Registra uma tradução mais etimológica da expressão, embora «entendimento» represente melhor o sentido lexical do substantivo.
lexical_decisions:
- source_word: ልባዌ (ləbbāwē)
  choice: entendimento
  rationale: O substantivo derivado designa entendimento, inteligência ou compreensão; a nota conserva a imagem etimológica ligada ao coração.
- source_word: ዘርእ (zarʾ)
  choice: descendência
  rationale: Expressa coletivamente a posteridade e evita a estranheza do literal «semente» em português corrente.
- source_word: እምኵሉ ዘሥጋ
  choice: dentre toda a humanidade
  rationale: Comunica o sentido de escolha ou aproximação a partir do conjunto de «toda carne», sem sugerir que toda a humanidade seja aproximada.
- source_word: ይትአለክ
  choice: ministrarem
  rationale: O contexto do santuário pede o sentido cultual de prestar serviço, melhor expresso por «ministrar».
- source_word: መላእክተ ገጽ
  choice: anjos da Presença
  rationale: Mantém a designação técnica e a referência à presença divina, com inicial maiúscula para tornar clara essa relação.
- source_word: ቅዱሳን
  choice: santos
  rationale: Preserva a formulação ampla do original sem definir além do texto a identidade precisa desses santos.
theological_decisions:
- issue: Identidade dos «santos»
  choice: como os santos
  alternative: como os seres santos
  rationale: A tradução não determina se a expressão se refere especificamente a anjos ou a outra classe celestial; conserva a tensão do original.
- issue: Finalidade expressa por «para glória»
  choice: para glória
  alternative: para a sua glória
  rationale: O original não explicita de quem é a glória; evita-se acrescentar um referente teológico não declarado.
translation_notes:
  register: Português moderno, digno e acessível, com leve registro bíblico. Empregou-se «você» em harmonia com a legibilidade brasileira e «descendência» para o coletivo. A repetição de «para glória» foi mantida por refletir a estrutura e a ênfase do texto-fonte.
