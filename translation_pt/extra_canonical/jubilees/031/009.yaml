  yaml_path: translation/extra_canonical/jubilees/031/009.yaml
  text: He embraced the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?”
translation:
  language: pt
  text: 'Ele abraçou Jacó, seu filho, pelo pescoço[a] e chorou sobre o pescoço de Jacó. Então a turvação passou dos olhos de Isaque, e ele viu os dois filhos de Jacó, Levi e Judá, e perguntou: “Estes são os seus filhos, meu filho?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o pescoço de Jacó, seu filho”. O verbo “abraçou” é retomado do contexto.
    reason: O início do segmento ge’ez conserva explicitamente “pescoço”, mas não repete o verbo; a nota torna transparente tanto a forma literal quanto o complemento contextual.
lexical_decisions:
- source_word: ክሳደ፡ ያዕቆብ፡ ወልዱ፡
  choice: abraçou Jacó, seu filho, pelo pescoço
  rationale: O texto preservado começa literalmente com “o pescoço de Jacó, seu filho”; o verbo “abraçar” é suprido pelo contexto imediato e pela tradição textual. A formulação portuguesa mantém a referência explícita ao pescoço sem soar truncada.
- source_word: ወበከየ፡ ዲበ፡ ክሳዱ።
  choice: e chorou sobre o pescoço dele
  rationale: Reproduz de perto a preposição “sobre” e mantém o referente masculino explícito, evitando a ambiguidade de “seu pescoço” em português.
- source_word: ወጽላሌ፡ ኀለፈ፡ እምአዕይንተ፡ ይስሐቅ፡
  choice: Então a névoa desapareceu dos olhos de Isaque
  rationale: ጽላሌ expressa sombra, escurecimento ou turvação da vista; “névoa” comunica naturalmente a visão obscurecida, e “desapareceu dos olhos” representa a ideia de que ela passou ou se retirou.
- source_word: ክልኤሆሙ፡ ውሉደ፡ ለያዕቆብ፡ ሌዊሃ፡ ወይሁዳሃ፡
  choice: os dois filhos de Jacó, Levi e Judá
  rationale: Mantém o número dual explícito e identifica os dois filhos na mesma ordem do texto-fonte.
- source_word: ውሉድከሁ፡ እሉ፡ ወልድየ፡
  choice: Estes são os seus filhos, meu filho?
  rationale: A ordem foi naturalizada em português, preservando tanto a pergunta de reconhecimento quanto o tratamento afetuoso “meu filho”.
