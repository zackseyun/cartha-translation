base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/024.yaml
  text: 'And it was reckoned to him as righteousness. And Jacob told his father during the night everything: how the Lord had shown him great mercy, and how he had made all his ways prosper and had protected him from everything.'
translation:
  language: pt
  text: 'E isso lhe foi atribuído como justiça.[a] Durante a noite, Jacó contou tudo ao pai: como o Senhor lhe havia demonstrado grande misericórdia, havia feito prosperar todos os seus caminhos e o havia protegido de tudo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme a forma registrada na transcrição: “E a justiça passou para ele”.'
    reason: A transcrição fornecida parece conter ተኀለፈ (“passou”) por erro de OCR, em lugar de ተኈለቈ (“foi contado/atribuído”).
  - marker: b
    text: 'Ou, mais literalmente: “tudo: como o Senhor havia feito com ele grande misericórdia”.'
    reason: Preserva a construção mais literal do ge'ez e sua possível ambiguidade sintática.
lexical_decisions:
- source_word: 'ተኈለቈ (leitura corrigida; no texto fornecido: ተኀለፈ)'
  choice: foi atribuído
  rationale: A leitura textual corrigida significa “foi contado/atribuído” e forma a conhecida expressão bíblica “atribuído como justiça”; a redação evita o menos acessível “imputado”.
- source_word: እግዚአ ብሔር
  choice: o Senhor
  rationale: Corresponde ao título divino presente no ge'ez, sem reduzi-lo ao termo genérico “Deus”.
- source_word: ገብረ ... ሣህለ፡ ዐቢየ
  choice: lhe havia demonstrado grande misericórdia
  rationale: Expressa em português natural o idiomatismo de “fazer misericórdia” com alguém.
- source_word: ሠርሖ፡ ኵሎ፡ ፍኖቲሁ
  choice: feito prosperar todos os seus caminhos
  rationale: Conserva a metáfora semítica dos “caminhos” e apresenta o Senhor como aquele que os fez prosperar.
- source_word: ተማኅፀኖ፡ እምኵሉ
  choice: protegido de tudo
  rationale: Mantém o alcance não especificado de “tudo”, sem acrescentar “mal”.
theological_decisions:
- issue: Leitura do primeiro verbo e alusão à fórmula bíblica de justiça
  choice: E isso lhe foi atribuído como justiça.
  alternative: E a justiça passou para ele.
  rationale: Embora a transcrição fornecida traga ተኀለፈ (“passou”), a revisão textual identifica um erro de OCR por ተኈለቈ (“foi contado/atribuído”), leitura coerente com a fórmula bíblica. A alternativa baseada na forma transcrita é preservada em nota.
- issue: Relação entre a ação do Senhor e a “grande misericórdia”
  choice: como o Senhor lhe havia demonstrado grande misericórdia
  alternative: tudo o que o Senhor havia feito com ele, a grande misericórdia
  rationale: A redação principal torna natural o idiomatismo, enquanto a nota conserva a possibilidade de uma construção mais literal e sintaticamente aberta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantiveram-se a fórmula bíblica “atribuído como justiça”, a metáfora de “caminhos” e o final abrangente “de tudo”, sem explicitação teológica indevida.
