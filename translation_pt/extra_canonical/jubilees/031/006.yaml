  text: And he came to his father Isaac and to his mother Rebekah. And Rebekah came out from the chamber to the door of the chamber to kiss Jacob and embrace him, for her spirit had revived when...
translation:
  language: pt
  text: E ele veio a seu pai, Isaque, e a sua mãe, Rebeca. Rebeca saiu da câmara até a porta da câmara, para beijar Jacó e abraçá-lo, pois seu espírito reviveu quando[a]...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «naquele momento».'
    reason: Registra a alternativa adverbial para በጊዜ, embora o contexto e a construção favoreçam «quando», ligado à oração seguinte.
lexical_decisions:
- source_word: ማኅፈድ
  choice: câmara
  rationale: O mesmo substantivo ocorre duas vezes; repetir «câmara» preserva a correspondência e a repetição do texto ge’ez, sem substituí-lo por «casa» na segunda ocorrência.
- source_word: አንቀጸ
  choice: porta
  rationale: No contexto de uma câmara ou recinto, «porta» é mais natural e preciso que «portão».
- source_word: ትስዐሞ ... ወትሕቀፎ
  choice: beijar ... e abraçá-lo
  rationale: Traduz diretamente as duas ações, com pronomes naturais em português.
- source_word: ሐይወ፡ መንፈሳ
  choice: o espírito dela havia revivido
  rationale: Mantém a imagem explícita do espírito que revive, em vez de reduzi-la interpretativamente a «recobrou o ânimo».
- source_word: በጊዜ
  choice: quando...
  rationale: Aqui a expressão introduz uma oração temporal que continua além do limite fornecido para o versículo; as reticências preservam essa sintaxe incompleta sem inventar o complemento.
theological_decisions:
- issue: Sentido de «espírito» em referência a Rebeca
  choice: o espírito dela havia revivido
  alternative: ela havia recobrado o ânimo
  rationale: A formulação escolhida preserva a linguagem antropológica do original e evita decidir se «espírito» é apenas um modo idiomático de falar do estado emocional.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Conserva a repetição de «câmara» e o final suspenso imposto pelo limite textual da fonte.
