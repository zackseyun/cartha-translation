  text: And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.
translation:
  language: pt
  text: E Isaque abençoou o Deus de seu pai Abraão, que não havia retirado a sua misericórdia e a sua justiça do filho de Isaque, seu servo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  choice: bendisse
  rationale: Expressa de modo natural o ato de louvar ou bendizer a Deus neste contexto.
- source_word: አኀደገ
  choice: havia retirado
  rationale: Com a negação, comunica que Deus não privou nem afastou do beneficiário sua misericórdia e justiça.
- source_word: ምሕረተ፡ ወጽድቀ
  choice: sua misericórdia e sua justiça
  rationale: Preserva os dois substantivos teologicamente significativos e sua coordenação.
- source_word: እምወልደ፡ ገብሩ፡ ይስሐቅ
  choice: do filho de seu servo Isaque
  rationale: Mantém a relação sintática e a referência a Isaque como servo de Deus, sem tentar eliminar a formulação incomum.
theological_decisions:
- issue: Relação entre misericórdia e justiça divinas
  choice: manter ambos os atributos em paralelo
  alternative: interpretar “justiça” como fidelidade
  rationale: A tradução conserva a tensão e a amplitude semântica do texto-fonte, sem impor uma leitura teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção incomum “do filho de seu servo Isaque” foi preservada por refletir o texto ge'ez e evitar uma explicitação não atestada.
