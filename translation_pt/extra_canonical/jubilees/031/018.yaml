  text: and cursed be every people that curses you.” And to Judah he said, “May the Lord give you strength and power, so that you may tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go about and travel through all the earth and its regions. Then nations shall fear before your face,”
translation:
  language: pt
  text: '“Seja bendito[a]; e seja amaldiçoado todo povo que amaldiçoar você.” E a Judá ele disse: “Que o Senhor lhe dê força e poder, para que você pise sobre todos os que o odeiam. Seja governante sobre os filhos de Jacó, você e um dos seus filhos. Que o seu nome e o nome dos seus filhos circulem e percorram toda a terra e suas regiões. Então as nações temerão na sua presença.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo começa no texto-fonte com a palavra “bendito”, aparentemente concluindo uma frase iniciada no contexto anterior.
    reason: A forma isolada no início do trecho é sintaticamente incompleta; a nota preserva o testemunho do texto fornecido sem inventar um sujeito.
lexical_decisions:
- source_word: ሕዝብ
  choice: povo
  rationale: O termo designa um povo ou grupo humano; “povo” é mais preciso aqui do que restringi-lo a uma entidade política moderna.
- source_word: ኀይለ፡ ወጽንዐ
  choice: força e poder
  rationale: Mantém os dois substantivos coordenados e expressa capacidade e vigor sem fundi-los.
- source_word: ትኪዶሙ
  choice: pise
  rationale: Preserva a imagem concreta de subjugar os inimigos pisando-os, em vez de substituí-la por uma paráfrase abstrata.
- source_word: መኰንነ
  choice: governante
  rationale: Expressa autoridade política ou judicial em linguagem portuguesa atual, sem especificar uma forma particular de governo.
- source_word: ዘየሐውር፡ ወዘያንሶሱ
  choice: circulem e percorram
  rationale: Conserva o paralelismo dos dois verbos de movimento e comunica ampla difusão pela terra.
- source_word: አሕዛብ
  choice: nações
  rationale: No plural, o termo se refere aos diversos povos estrangeiros; “nações” é natural neste contexto.
theological_decisions:
- issue: Autoridade de Judá e de um descendente
  choice: “Seja governante sobre os filhos de Jacó, você e um dos seus filhos”
  alternative: “Você seja governante, e um dos seus filhos seja governante dos filhos de Jacó”
  rationale: A formulação mantém a coordenação e a possível dimensão dinástica da bênção sem identificar o descendente nem impor uma interpretação messiânica específica.
- issue: Imagem de vitória sobre os inimigos
  choice: “para que você pise todos os que o odeiam”
  alternative: “para que você derrote todos os que o odeiam”
  rationale: A imagem corporal do texto-fonte é teologicamente expressiva e não deve ser suavizada para uma ideia genérica de vitória.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de tratamento brasileiras (“você”, “seu”) e sintaxe natural. A tradução preserva o paralelismo da bênção, as imagens concretas e a ambiguidade quanto ao descendente de Judá.
