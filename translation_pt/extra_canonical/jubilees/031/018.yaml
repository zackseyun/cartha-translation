  to: '“Seja bendito[a]; e seja amaldiçoado todo povo que amaldiçoar você.” E a Judá ele disse: “Que o Senhor lhe dê força e poder, para que você pise sobre todos os que o odeiam. Seja governante sobre os filhos de Jacó, você e um dos seus filhos. Que o seu nome e o nome dos seus filhos circulem e percorram toda a terra e suas regiões. Então as nações temerão na sua presença.”'
