  naturalness: O texto é em geral claro e atual. «Pise todos os que o odeiam» pode soar pouco idiomático ou admitir outros sentidos em português; «pise sobre todos os que o odeiam» conserva a imagem e é mais claro. «Temerão na sua presença» comunica naturalmente a expressão «diante de você».
  terminology: «Povo», «força e poder», «governante», «filhos de Jacó» e «nações» são escolhas adequadas. «Senhor» é uma representação convencional e não confessionalmente excessiva para o título divino do texto.
