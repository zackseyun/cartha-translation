  yaml_path: translation/extra_canonical/jubilees/031/013.yaml
  text: 'and his left hand on Judah, and he turned toward Levi first and began to bless him, and said to him: “May the God of all, the Lord of all the ages, bless you'
translation:
  language: pt
  text: 'e sua mão esquerda sobre Judá.[a] Então se voltou primeiro para Levi, começou a abençoá-lo e lhe disse: “Que o Deus de tudo, o Senhor de todas as eras, abençoe você'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e Judá com sua mão esquerda”.'
    reason: A construção elíptica continua a ação do versículo anterior. O texto principal explicita que Judá recebe a mão esquerda; a alternativa preserva mais de perto a ordem elíptica do original, mantendo o possessivo.
lexical_decisions:
- source_word: በፀጋማዊ፡ እዴሁ፡
  choice: a mão esquerda
  rationale: A expressão indica literalmente a mão do lado esquerdo; em português corrente, “a mão esquerda” é a forma natural. O verbo é recuperado do contexto anterior, sem ser repetido neste fragmento.
- source_word: ቀዲሙ፡
  choice: primeiro
  rationale: Preserva a prioridade dada a Levi na sequência da bênção, sem repetir desnecessariamente a ideia.
- source_word: አምላከ፡ ኵሉ፡
  choice: o Deus de tudo
  rationale: Mantém o alcance amplo de ኵሉ, sem restringi-lo apenas a pessoas.
- source_word: እግዚአ፡ ኵሉ፡ ዓለማት፡
  choice: o Senhor de todas as eras
  rationale: Traduz ዓለማት no sentido temporal plural de eras ou idades, preservando a formulação solene.
theological_decisions:
- issue: Alcance de “Deus de tudo”
  choice: o Deus de tudo
  alternative: o Deus de todos
  rationale: “Tudo” preserva a possível abrangência cósmica da expressão, enquanto “todos” poderia ser entendido apenas como referência a seres pessoais.
- issue: Sentido temporal de ዓለማት
  choice: todas as eras
  alternative: todos os mundos
  rationale: O contexto e a fórmula titulativa favorecem o sentido temporal, mas a polissemia tradicional do termo não deve ser convertida em uma afirmação cosmológica específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural no Brasil. O início permanece como continuação do versículo anterior, e a fala fica aberta porque a sentença prossegue no versículo seguinte.
