  to: 'Betel. Jacó se lembrou da oração com que seu pai havia abençoado Levi e Judá. Então, alegrou-se e louvou o Deus de seus pais, Abraão e Isaque. E disse: “Agora sei que há para mim uma esperança eterna, e também para meus filhos, diante do Deus de todos.” Assim foi determinado a respeito dos dois, e isso foi registrado para eles como testemunho justo e eterno[a] nas tábuas celestes, conforme Isaque os abençoou.[b]'
