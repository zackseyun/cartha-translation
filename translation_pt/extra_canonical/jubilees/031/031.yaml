  text: Bethel. And Jacob remembered the prayer with which his father had blessed Levi and Judah, and he rejoiced and blessed the God of his fathers Abraham and Isaac. And he said, “Now I know that I have an everlasting hope, and my children also, before the God of all.” And thus it was ordained concerning the two of them, and it was recorded for them as an everlasting, righteous testimony on the heavenly tablets, just as Isaac blessed them.
translation:
  language: pt
  text: 'Betel. Jacó se lembrou da oração com que seu pai havia abençoado Levi e Judá. Então, alegrou-se e louvou o Deus de seus pais, Abraão e Isaque. E disse: “Agora sei que há para mim uma esperança eterna, e também para meus filhos, diante do Deus de todos.” Assim foi determinado a respeito dos dois, e isso foi registrado para eles como testemunho justo e eterno[a] nas tábuas celestes, conforme Isaque os abençoou.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como testemunho eterno de justiça”.'
    reason: A relação entre «justo/justiça» e «testemunho» admite mais de uma formulação natural em português.
  - marker: b
    text: Isto é, Levi e Judá.
    reason: Esclarece o referente plural sem inseri-lo novamente no corpo do texto.
lexical_decisions:
- source_word: ተስፋ፡ ዘለዓለም
  choice: esperança eterna
  rationale: Reproduz de modo direto a expressão etíope para uma esperança duradoura ou perpétua, sem explicitar indevidamente seu conteúdo.
- source_word: በቅድመ፡ አምላከ፡ ኵሉ
  choice: diante do Deus de todos
  rationale: Mantém a construção relacional ‘diante de’ e o alcance universal de ‘todos’.
- source_word: ሥሩዕ፡ በእንተ፡ ክልኤሆሙ
  choice: foi determinado a respeito dos dois
  rationale: Preserva a ideia de algo estabelecido ou ordenado com referência a Levi e Judá.
- source_word: ስምዕ፡ ዘለዓለም
  choice: testemunho ... eterno
  rationale: Traduz os elementos explícitos ‘testemunho’ e ‘eterno’; ‘justo’ acompanha a forma textual refletida pela revisão crítica fornecida.
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestes
  rationale: Expressão natural e dignificada para as tábuas do céu, motivo recorrente em Jubileus.
theological_decisions:
- issue: Referente da esperança eterna
  choice: ‘tenho uma esperança eterna, e também meus filhos’
  alternative: ‘há esperança eterna para mim e para meus filhos’
  rationale: Mantém a formulação pessoal e a extensão aos descendentes sem definir a natureza teológica específica dessa esperança.
- issue: Natureza do registro celeste
  choice: ‘isso foi registrado em favor deles como testemunho’
  alternative: ‘eles foram registrados’
  rationale: O singular conserva como referente o decreto ou testemunho, evitando transformar Levi e Judá no objeto direto do registro.
translation_notes:
  register: Português contemporâneo, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. Emprega ‘bendisse’ no contexto de louvor a Deus e ‘abençoado’ para a bênção dada por Isaque. A abertura segue a unidade versicular fornecida pela camada inglesa auditada, pois a linha etíope apresentada começa no fim da menção a Judá.
