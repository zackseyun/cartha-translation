  text: For they resemble you.” And he told him that they were indeed his sons. And he said, “Now I see that they are truly your sons.”
translation:
  language: pt
  text: '“Pois eles se parecem com você.” E ele lhe disse que de fato eram seus filhos. Então disse: “Agora vejo que eles são realmente seus filhos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስሉከ
  choice: eles se parecem com você
  rationale: Reproduz de modo natural o sentido de semelhança expresso pelo verbo, mantendo a referência da segunda pessoa.
- source_word: ውሉዱ
  choice: seus filhos
  rationale: O termo designa filhos ou descendentes; neste diálogo, trata-se dos filhos de Jacó. ‘Filhos’ preserva a formulação do texto etíope e a lógica de que eles se parecem com o pai.
- source_word: በአማን / አማን
  choice: de fato / realmente
  rationale: As duas expressões de confirmação foram vertidas com equivalentes portugueses naturais, sem perder a repetição enfática.
- source_word: ርእክ
  choice: vejo
  rationale: Mantém o verbo de percepção na primeira pessoa conforme o sentido da fala direta.
theological_decisions:
- issue: 'Relação familiar: filhos ou netos'
  choice: seus filhos
  alternative: seus netos
  rationale: Embora os rapazes sejam netos de Isaque, a fala identifica corretamente a relação deles com Jacó, a quem se assemelham. O texto etíope emprega ‘filhos’, e ‘netos’ enfraqueceria a lógica imediata da afirmação.
- issue: Identidade dos interlocutores nos verbos introdutórios
  choice: manter os pronomes sem inserir nomes
  alternative: explicitar ‘Jacó’ e ‘Isaque’
  rationale: O trecho fornecido usa referências pronominais. Não foram acrescentados nomes ausentes do texto, preservando a dependência do contexto e qualquer ambiguidade discursiva genuína.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por ‘você’ para refletir naturalmente a segunda pessoa singular. A repetição de ‘seus filhos’ foi mantida por ser significativa no diálogo.
