  text: 'E que ele faça prosperar tudo o que você fizer, tudo aquilo pelo qual você orou.” Então ele disse a Rebeca: “Vá com Jacó, seu filho.” Rebeca foi com Jacó, seu filho, e Débora foi com ela; e eles chegaram a'
