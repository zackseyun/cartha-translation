lexical_decisions:
- source_word: ይሥመር
  choice: faça prosperar
  rationale: O verbo expressa a ideia de favorecer, fazer ter êxito ou prosperar; esta formulação preserva o sentido da bênção em português natural.
- source_word: ጸለይከ፡ ጸሎተ
  choice: você orou
  rationale: A construção cognata significa literalmente algo como «orou uma oração»; em português, a repetição seria pouco natural, sem acrescentar conteúdo.
- source_word: ወልዳ / ወልድኪ
  choice: seu filho
  rationale: O contexto e a forma textual corrigida identificam Jacó explicitamente como filho de Rebeca, tanto na ordem quanto na narrativa.
