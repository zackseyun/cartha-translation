translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento de ampla legibilidade brasileira. A frase termina deliberadamente em «chegaram a», pois o trecho-fonte fornecido também se interrompe nesse ponto. O sujeito explícito «Rebeca» foi mantido, e não se acrescentou a ação «levantou-se», ausente do ge'ez.
