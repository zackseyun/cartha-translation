  text: the foreign gods that are among you.' And they gave him the foreign gods, and what was in their ears and what was on their necks, and the idols that Rachel had stolen from Laban her brother. And she gave them all to Jacob, and he burned them, and crushed them, and destroyed them, and hid them under the oak that was in the land of Shechem.
translation:
  language: pt
  text: “os deuses estrangeiros que estão no meio de vocês”. E eles lhe deram os deuses estrangeiros, o que estava em suas orelhas e em seus pescoços, e os ídolos que Raquel havia roubado de Labão, seu irmão.[a] Ela entregou tudo a Jacó, e ele os queimou, os esmagou, os destruiu e os escondeu debaixo da árvore[b] que havia na terra de Siquém.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Assim no texto ge''ez: “seu irmão”. Em Gênesis 31, Labão é apresentado como pai de Raquel.'
    reason: textual_tension
  - marker: b
    text: O termo designa uma árvore, mas a espécie exata é incerta; também pode ser traduzido como “carvalho” ou “terebinto”.
    reason: lexical_alternative
lexical_decisions:
- source_word: አማልክተ፡ ነኪር
  choice: deuses estrangeiros
  rationale: Mantém o sentido direto da expressão ge'ez e a ligação com o fim da fala iniciada no versículo anterior.
- source_word: ዘውስተ፡ እዘኒሆሙ፡ ወዘውስተ፡ ክሳውዲሆሙ
  choice: o que traziam nas orelhas e no pescoço
  rationale: Expressa em português natural os objetos ou adornos que estavam nas orelhas e no pescoço, sem especificar além da fonte.
- source_word: ወአውዕዮ፡ ወፀተሞ፡ ወአማስኖ
  choice: queimou, esmagou e destruiu tudo
  rationale: Conserva os três verbos distintos do ge'ez, inclusive o terceiro, omitido em uma versão anterior.
- source_word: ድርዋስ
  choice: árvore frondosa
  rationale: A espécie exata é incerta; esta formulação mantém a referência arbórea sem afirmar especificamente carvalho ou terebinto.
- source_word: ምድረ፡ ሰቂሞን
  choice: terra de Siquém
  rationale: Tradução direta do topônimo e de sua qualificação geográfica.
theological_decisions:
- issue: Identidade de Labão em relação a Raquel
  choice: seu irmão
  alternative: seu pai
  rationale: O texto ge'ez apresentado diz literalmente “seu irmão”. Embora a tradição de Gênesis identifique Labão como pai de Raquel, a tradução preserva a leitura da fonte e registra a tensão em nota.
- issue: Sequência da destruição dos objetos cultuais
  choice: queimou, esmagou e destruiu tudo, e depois o escondeu
  alternative: queimou e esmagou tudo, e o escondeu
  rationale: Mantém todos os verbos presentes no texto-fonte, sem omitir a declaração adicional de destruição.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O início conserva o fechamento da fala do versículo anterior. A repetição de “deuses estrangeiros” e a série de verbos foram mantidas por corresponderem à estrutura e à ênfase da fonte.
