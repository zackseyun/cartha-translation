  source_fidelity: A tradução preserva adequadamente «os dois juntos», «um espírito de profecia», a imagem incomum de sua descida «à sua boca» e a mão direita. Contudo, o ge'ez e a trilha inglesa apresentam três unidades coordenadas; a fusão das duas últimas e a substituição inicial de «E» por «Então» suavizam desnecessariamente essa progressão.
  naturalness: O português é claro e de registro apropriado. Separar as orações coordenadas melhora a legibilidade sem perder o caráter fragmentário inicial, que depende do contexto anterior.
  terminology: «Um espírito de profecia» é uma escolha fiel e prudentemente não interpretativa. «Levi» e «mão direita» estão corretos. «Com a mão direita» conserva que a mão direita é o instrumento do sujeito, sem introduzir uma leitura diferente.
