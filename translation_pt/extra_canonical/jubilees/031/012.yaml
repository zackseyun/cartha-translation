  text: os dois juntos. E um espírito de profecia desceu à sua boca. E ele tomou Levi com a mão direita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለክልኤሆሙ፡ ኀቡረ
  choice: os dois juntos
  rationale: Reproduz de modo natural a referência explícita aos dois e a ideia de estarem juntos; o fragmento dá continuidade à frase anterior.
- source_word: መንፈሰ፡ ትንቢት
  choice: um espírito de profecia
  rationale: Mantém a expressão concreta e sua possível ambiguidade, sem reduzi-la a mero impulso profético.
- source_word: ወረደ፡ ውስተ፡ አፉሁ
  choice: desceu à sua boca
  rationale: Preserva a imagem incomum do texto ge'ez, em vez de explicá-la como fala inspirada.
- source_word: በየማናዊ
  choice: com a mão direita
  rationale: Expressa idiomaticamente o instrumento e conserva a especificação da direita.
theological_decisions:
- issue: Natureza do espírito profético
  choice: um espírito de profecia
  alternative: o espírito de profecia
  rationale: O texto não exige identificar a expressão como título técnico ou entidade única; o artigo indefinido preserva a abertura sem enfraquecer o caráter sobrenatural.
- issue: Imagem da descida à boca
  choice: desceu à sua boca
  alternative: veio sobre ele e o fez profetizar
  rationale: A tradução conserva a formulação corpórea e teologicamente sugestiva da fonte, sem acrescentar interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se o início fragmentário porque o versículo continua a construção do contexto anterior; usa-se «Então» para uma ligação narrativa natural, sem eliminar a sequência do original.
