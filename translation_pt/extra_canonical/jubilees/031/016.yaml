  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
translation:
  language: pt
  text: para que abençoem toda a descendência do amado. Sua mãe lhe deu o nome de Levi, e verdadeiramente lhe deu esse nome.[a] Você estará unido ao Senhor e será companheiro de todos os filhos de Jacó. Que a mesa dele seja a sua, e que você e seus filhos comam dela. E a sua mesa estará cheia para todas as gerações.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “Sua mãe chamou seu nome Levi, e verdadeiramente chamou seu nome”.'
    reason: Registra a repetição formal do original, suavizada no texto principal para produzir português natural.
  - marker: b
    text: O trecho fornecido termina em “para todos”, mas a continuação do versículo na edição traz “gerações” e o verbo “estará cheia”.
    reason: Esclarece que a forma adotada depende da continuação atestada do versículo completo, mencionada no histórico de revisão, e não apenas do recorte truncado.
lexical_decisions:
- source_word: ዘርአ
  choice: descendência
  rationale: Expressa naturalmente o sentido coletivo de “semente, posteridade” sem sugerir apenas sementes literais.
- source_word: ለፍቅር
  choice: do amado
  rationale: Mantém a forma substantivada e a possível referência titular do original, sem identificar explicitamente quem é o amado.
- source_word: ሌዊን
  choice: Levi
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: በአማን
  choice: verdadeiramente
  rationale: Conserva a afirmação enfática de verdade do texto, em vez de interpretá-la como “corretamente” ou “com razão”.
- source_word: አጸቶ
  choice: estará unido
  rationale: Reproduz a ideia de ligação ou associação expressa pelo verbo e preserva o provável jogo com o nome Levi.
- source_word: ሱታፌ
  choice: companheiro
  rationale: Representa a noção de participação e associação sem impor uma função institucional específica.
- source_word: ማእዳ
  choice: mesa
  rationale: Mantém a imagem concreta da mesa e suas possíveis conotações de comunhão, sustento e serviço sagrado.
theological_decisions:
- issue: Identidade de “o amado”
  choice: Mantido como “o amado”
  alternative: “Jacó, o amado” ou outra identificação explícita
  rationale: O texto apresentado não explicita o referente nesse ponto; identificá-lo resolveria uma ambiguidade genuína.
- issue: Referente de “a mesa dele”
  choice: Pronome preservado sem explicitação
  alternative: “a mesa do Senhor”
  rationale: Embora “o Senhor” seja um antecedente provável, a tradução não deve eliminar a possibilidade de outra referência contextual.
- issue: Natureza da união com o Senhor
  choice: “estará unido ao Senhor”
  alternative: “pertencerá ao Senhor” ou “será ligado ao sacerdócio do Senhor”
  rationale: A formulação mantém a imagem relacional do original sem acrescentar uma definição doutrinária ou institucional.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural para leitores brasileiros. A repetição semítica na nomeação de Levi foi parcialmente suavizada no corpo do texto e preservada em nota. As imagens de união, companhia e mesa foram mantidas sem expansão confessional.
