  yaml_path: translation/extra_canonical/jubilees/031/026.yaml
  text: And in the morning Jacob told his father Isaac the prayer that he had prayed to the Lord[26], and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord.
translation:
  language: pt
  text: E, pela manhã, Jacó contou a seu pai Isaque a oração que havia feito ao Senhor[a], a visão que havia tido, como havia construído um altar e que tudo estava preparado para oferecer o sacrifício diante do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Embora o geês empregue aqui palavras relacionadas à oração, o contexto imediato — Betel, o altar, o sacrifício e a advertência de Isaque para que Jacó não se demorasse — indica que pode estar em vista o voto feito por Jacó.
    reason: 'Leitura alternativa contextual: «voto» em vez do sentido lexical direto «oração».'
lexical_decisions:
- source_word: ጸሎተ፡ ዘጸለየ
  choice: a oração que havia feito
  rationale: Reproduz diretamente o substantivo e o verbo cognato ligados à oração no geês, em português natural, sem substituir no texto principal por «voto».
- source_word: ሬአየ፡ ዘርእየ
  choice: a visão que havia tido
  rationale: O contexto e a forma substantivada apontam para aquilo que Jacó viu; «visão» preserva o caráter revelatório expresso na tradição textual.
- source_word: ኀነጸ፡ ምሥዋዐ
  choice: havia construído um altar
  rationale: Traduz de modo claro a ação de edificar/construir e o objeto «altar».
- source_word: ኵሉ፡ ድልው
  choice: tudo estava preparado
  rationale: Expressa o sentido de totalidade e prontidão com formulação idiomática em português.
- source_word: ለመሥዋዕት፡ ለገቢር፡ ቅድመ፡ እግዚአብሔር
  choice: para oferecer o sacrifício diante do Senhor
  rationale: Conserva a finalidade sacrificial e a ideia espacial/cultual de realizá-la perante o Senhor.
theological_decisions:
- issue: Se ጸሎተ፡ ዘጸለየ deve ser entendido como oração ou voto
  choice: oração que havia feito
  alternative: voto que havia feito
  rationale: A redação principal segue a evidência lexical explícita do geês. O contexto de Betel, altar e sacrifício pode sugerir que se trata do voto de Jacó, mas essa interpretação contextual é registrada em nota, sem substituir silenciosamente o sentido formal da expressão.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Emprega «Isaque», forma bíblica corrente em português, e mantém a ambiguidade entre oração e voto por meio de nota textual.
