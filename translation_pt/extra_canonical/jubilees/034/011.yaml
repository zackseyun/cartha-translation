revisions:
- from: Siquém, e os encontrou na terra de Dotã. Eles agiram traiçoeiramente com ele e tramaram matá-lo; mas, mudando de ideia, venderam-no a mercadores ismaelitas. Estes o levaram ao Egito e o venderam a Potifar, eunuco[a] do faraó, chefe dos guardas e sacerdote da cidade de Heliópolis.
  to: Siquém; e ele os encontrou na terra de Dotã. Eles agiram traiçoeiramente contra ele e tramaram matá-lo; mas, mudando de ideia, venderam-no a mercadores ismaelitas. Ele foi levado ao Egito e vendido a Potifar, eunuco[a] do faraó, chefe dos guardas e sacerdote da cidade de Heliópolis.
  rationale: Substituiu-se «Estes o levaram ... e o venderam» por uma formulação passiva, a fim de não fixar um agente que a redação etíope não nomeia novamente. Ajustou-se também «com ele» para «contra ele», formulação portuguesa mais direta para a perfídia dirigida a José. A nota lexical e os demais títulos foram preservados.
