review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem os elementos centrais: a perfídia contra José, o plano de matá-lo, a mudança de decisão, os mercadores ismaelitas, o Egito e os títulos de Potifar. «Chefe dos guardas» corresponde corretamente a ሊቀ ዐቀብት, sem harmonização indevida com «chefe dos cozinheiros». Contudo, «Estes» resolve como certo que os mercadores são os agentes de levar José ao Egito e vendê-lo a Potifar, enquanto a sucessão de sujeitos no texto etíope não o explicita de modo independente.'
  naturalness: O português é claro, narrativo e de registro apropriado. A formulação passiva na revisão mantém a fluência e evita atribuir explicitamente as duas ações finais a um antecedente que o texto não identifica de forma inequívoca.
  terminology: «Agiram traiçoeiramente», «mercadores ismaelitas», «eunuco do faraó», «chefe dos guardas», «sacerdote» e «Heliópolis» são escolhas adequadas. A nota sobre «eunuco» trata de modo equilibrado o uso cortesão possível do título.
  issues:
  - severity: medium
    issue: «Estes o levaram ao Egito e o venderam» torna os mercadores explicitamente sujeitos das ações finais.
    rationale: O etíope usa formas verbais sem novo sujeito nominal nesse encadeamento. Como a referência do sujeito após a venda aos mercadores pode ser entendida de mais de uma maneira, a explicitação por «Estes» vai além do que o texto determina. Uma construção passiva preserva os eventos e a ambiguidade.
  revised_text: Siquém; e ele os encontrou na terra de Dotã. Eles agiram traiçoeiramente contra ele e tramaram matá-lo; mas, mudando de ideia, venderam-no a mercadores ismaelitas. Ele foi levado ao Egito e vendido a Potifar, eunuco[a] do faraó, chefe dos guardas e sacerdote da cidade de Heliópolis.
