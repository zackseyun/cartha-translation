base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/011.yaml
  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
translation:
  language: pt
  text: Siquém; e ele os encontrou na terra de Dotã. Eles agiram traiçoeiramente contra ele e tramaram matá-lo; mas, mudando de ideia, venderam-no a mercadores ismaelitas. Ele foi levado ao Egito e vendido a Potifar, eunuco[a] do faraó, chefe dos guardas e sacerdote da cidade de Heliópolis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «alto funcionário». O termo também era usado como título de oficiais da corte, sem necessariamente indicar que fossem eunucos.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐብበይዎ (wa-ḥabbabayəwo)
  choice: Eles agiram traiçoeiramente com ele
  rationale: O verbo exprime agir com perfídia ou engano contra alguém, não simplesmente odiá-lo.
- source_word: ለነጋዲተ እስማዒላዊያን
  choice: a mercadores ismaelitas
  rationale: Reproduz diretamente a identificação dos negociantes no texto etíope.
- source_word: ሐፀወ ፈርዖን
  choice: eunuco do faraó
  rationale: Mantém o sentido imediato do título etíope; no uso cortesão, o termo também pode designar de modo mais amplo um alto funcionário.
- source_word: ሊቀ ዐቀብት
  choice: chefe dos guardas
  rationale: A expressão significa literalmente chefe dos guardas, e não chefe dos cozinheiros, formulação conhecida de outra tradição textual.
- source_word: ሣውዕ ዘሀገረ ኤሌው
  choice: sacerdote da cidade de Heliópolis
  rationale: Traduz o título sacerdotal e usa o nome português convencional para a cidade indicada pelo etíope ኤሌው.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa natural. Conservou-se o início fragmentário «Siquém», que depende do contexto do versículo anterior, e evitou-se harmonizar o título de Potifar com a redação mais conhecida de Gênesis.
