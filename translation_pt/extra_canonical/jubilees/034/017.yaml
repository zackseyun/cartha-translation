- source_word: ይላሑ / ላላሑ
  choice: lamentando
  rationale: O verbo, repetido no versículo, comunica lamento continuado; a repetição da mesma raiz em português mantém a ligação verbal do original.
- source_word: ድኅሬሁ ለዮሴፍ
  choice: José
  rationale: A construção indica que o lamento era por José; a formulação portuguesa natural dispensa reproduzir literalmente a preposição.
theological_decisions:
- issue: Sentido de “descer à sepultura”
  choice: Manter a declaração como imagem de morrer ainda em luto
  alternative: Traduzir “descerei ao Sheol”
