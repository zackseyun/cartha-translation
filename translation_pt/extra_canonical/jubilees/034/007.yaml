  text: six thousand men who carried weapons. And he killed them in the descent of Shechem, and pursued those who fled, and killed them with the edge of the sword, and he killed Ares and Taphu and Seragan.
translation:
  language: pt
  text: seis mil homens que portavam armas. Ele os matou na descida de Siquém, perseguiu os que fugiam e os matou ao fio da espada; matou também Ares, Tafu e Seragan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እለ፡ ይጸውሩ፡ አበይፍተ
  choice: que portavam armas
  rationale: Reproduz de modo natural a expressão ge'ez referente aos homens que levavam armas.
- source_word: ጸአተ፡ ዘሴቄም
  choice: descida de Siquém
  rationale: ጸአተ expressa saída/descida e, neste contexto topográfico, é mais bem entendido como 'descida', não 'planície'.
- source_word: በአፈ፡ ሰይፍ
  choice: ao fio da espada
  rationale: Mantém o conhecido idiomatismo semítico, literalmente associado à 'boca da espada', em português claro e digno.
- source_word: አሬስ፡ ... ታፉ፡ ... ሴሬጋን
  choice: Ares, Tafu e Seragã
  rationale: Translitera os nomes próprios em grafia legível em português, preservando a forma textual.
