lexical_decisions:
- source_word: ይማህርኩ
  choice: apoderar-se
  rationale: No contexto de uma ação hostil contra os bens alheios, expressa tomar ou capturar o gado, sem suavizar a força do verbo.
- source_word: እንስሳሆሙ
  choice: o gado deles
  rationale: O termo designa os animais possuídos pelo grupo; “gado” é natural neste contexto narrativo.
- source_word: ኖንዝና፡ መንፈሱ
  choice: o espírito dele estava abatido
  rationale: Preserva a referência ao espírito interior de Isaque e comunica aflição profunda em português corrente e digno.
- source_word: ስእኑ፡ ኀዲጎተ
  choice: não podiam deixá-lo
  rationale: Reproduz de modo direto a incapacidade dos filhos de se afastarem de Isaque naquele estado.
