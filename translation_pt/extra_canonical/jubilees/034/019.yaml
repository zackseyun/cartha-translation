  to: O pecado deles foi terem entristecido a compaixão de seu pai por causa de José, seu filho. E esse dia foi instituído para que nele se entristecessem por seus pecados, por todas as suas transgressões e por todos os seus erros, a fim de se purificarem nesse dia, uma vez por ano.
