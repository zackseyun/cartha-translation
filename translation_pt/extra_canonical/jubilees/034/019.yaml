base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/019.yaml
  text: Their sin was that they had brought grief to the compassion of their father because of Joseph his son. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.
translation:
  language: pt
  text: O pecado deles foi terem entristecido a compaixão de seu pai por causa de José, seu filho. E esse dia foi instituído para que nele se entristecessem por seus pecados, por todas as suas transgressões e por todos os seus erros, a fim de se purificarem nesse dia, uma vez por ano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃጢአቶሙ (ḫaṭiʾātomu)
  choice: O pecado deles
  rationale: O substantivo aparece no singular com sufixo plural possessivo; a formulação preserva esse valor coletivo na oração inicial.
- source_word: አኅዘኑ (ʾaḥzanu)
  choice: terem entristecido
  rationale: Expressa causar tristeza ou pesar; o infinitivo composto produz português natural após “foi” sem enfraquecer a relação causal.
- source_word: ምሕረተ፡ አቡሆሙ (miḥrata ʾabuhomu)
  choice: o coração compassivo de seu pai
  rationale: A expressão literalmente envolve a compaixão ou misericórdia do pai. “Coração compassivo” conserva essa imagem afetiva em português inteligível, evitando a construção pouco natural “entristecer a compaixão”.
- source_word: ተሠርዐት (tasaṛʿat)
  choice: foi instituído
  rationale: O verbo indica que o dia foi ordenado, estabelecido ou prescrito; “instituído” se ajusta ao contexto de observância anual.
- source_word: ይሕዝኑ (yiḥzanu)
  choice: se entristecessem
  rationale: Mantém o vínculo lexical com o pesar causado ao pai e comunica lamento penitencial sem acrescentar terminologia confessional.
- source_word: አበሳሆሙ (ʾabasāhomu)
  choice: suas transgressões
  rationale: O termo denota culpa, falta ou transgressão; a escolha distingue-o de “pecados” e preserva a enumeração.
theological_decisions:
- issue: Natureza da purificação anual
  choice: “a fim de se purificarem nesse dia, uma vez por ano”
  alternative: “para fazerem expiação nesse dia, uma vez por ano”
  rationale: “Purificarem-se” acompanha a camada inglesa auditada e evita converter a expressão em uma teoria específica de expiação. A formulação mantém aberta a relação entre lamento, arrependimento e purificação ritual.
- issue: Objeto entristecido pela ação dos irmãos
  choice: “o coração compassivo de seu pai”
  alternative: “a misericórdia de seu pai”
  rationale: A alternativa mais literal soa semanticamente opaca em português. A escolha comunica a ternura ou compaixão paterna ferida sem identificar essa compaixão com uma doutrina particular.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de “por” conserva o ritmo enumerativo do texto, e “José, filho dele” retém a referência explícita sem criar ambiguidade sobre a filiação.
