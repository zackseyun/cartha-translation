  text: And he mourned all that night, because at evening they had brought it to him, and he became fevered with grief for his death, and said, “A wild beast has devoured Joseph.” And all the people of his house mourned with him on that day, and they were grieving and mourning with him all that day.
translation:
  language: pt
  text: 'E ele chorou durante toda aquela noite, pois, ao entardecer, tinham trazido a túnica até ele.[a] Ficou febril de tanta tristeza pela morte de José e disse: “Um animal selvagem devorou José”. E todos os de sua casa choraram com ele naquele dia; ficaram entristecidos e choraram com ele durante todo aquele dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, a túnica de José, que havia sido manchada de sangue.
    reason: O texto usa um pronome cujo referente está no versículo anterior; a nota torna explícita a ligação contextual.
lexical_decisions:
- source_word: ወበሐወ (wa-bahawa)
  choice: e ele chorou
  rationale: Expressa o lamento audível de Jacó em linguagem portuguesa corrente e digna.
- source_word: ኪያሁ (kiyahu)
  choice: a túnica
  rationale: O pronome retoma a roupa de José, ensanguentada no contexto imediatamente anterior; explicitar o referente evita uma construção obscura em português.
- source_word: ወፈጸነ፡ በላህ፡ ሞቶ
  choice: ficou febril de tanta tristeza pela morte de José
  rationale: Preserva a imagem forte de uma reação febril causada pelo pesar, sem reduzi-la simplesmente a tristeza intensa.
- source_word: አርዌ፡ ጸዋገ
  choice: um animal selvagem
  rationale: Equivalente natural para a fera ou animal feroz mencionado no texto, sem especificar uma espécie.
- source_word: ኵሉ፡ ሰብአ፡ ቤቱ
  choice: todos os de sua casa
  rationale: Mantém o sentido coletivo da casa de Jacó, abrangendo seus membros sem restringi-los à família imediata.
theological_decisions:
- issue: A morte de José é apenas presumida por Jacó
  choice: pela morte de José
  alternative: por sua morte
  rationale: A formulação apresenta a perspectiva de Jacó sem afirmar narratorialmente que José de fato morreu; o contexto deixa claro que se trata da morte que ele julgava ter ocorrido.
translation_notes:
  register: Português moderno, amplamente compreensível e com fluidez brasileira. A repetição de “naquele dia” e “todo aquele dia” foi mantida por refletir a ênfase temporal do original; “ficou febril” conserva sua imagem corporal incomum.
