base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
translation:
  language: pt
  text: Por isso, foi estabelecido para os filhos de Israel que se afligissem no décimo dia do sétimo mês[a], no dia em que a notícia a respeito de José chegou a Jacó, seu pai, e que nesse dia fizessem expiação por si mesmos com um cabrito, no décimo dia do sétimo mês, uma vez por ano, por causa dos seus pecados; pois haviam entristecido o afeto de seu pai por José, seu filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O capítulo relaciona a aflição anual no décimo dia do sétimo mês à roupa ensanguentada de José e ao luto de Jacó, apresentando assim uma explicação da origem da observância do Dia da Expiação (Yom Kippur).
    reason: cross_reference
lexical_decisions:
- source_word: ተሠርዐ
  choice: foi estabelecido
  rationale: Expressa uma determinação normativa instituída, com linguagem natural e digna em português.
- source_word: ይሕመሙ
  choice: se afligissem
  rationale: Preserva o sentido ritual de humilhação ou aflição pessoal sem especificar uma prática não explicitada no texto.
- source_word: ዜናሁ፡ ለዮሴፍ
  choice: a notícia a respeito de José
  rationale: Mantém a formulação não específica do geʿez e evita acrescentar que José teria morrido.
- source_word: ያስተስርዩ
  choice: fizessem expiação por si mesmos
  rationale: Reproduz o valor expiatório e a referência reflexiva presentes na construção.
- source_word: ጠሊ
  choice: cabrito
  rationale: Designa naturalmente em português um bode jovem usado no rito, sem reduzir o termo ao genérico 'bode'.
- source_word: ምሕረቶ
  choice: afeto
  rationale: No contexto, refere-se ao sentimento do pai por José; 'afeto' é natural e evita a leitura menos adequada de 'compaixão'.
theological_decisions:
- issue: Relação do episódio com o Dia da Expiação
  choice: Manter no texto apenas a data, a aflição e a expiação explicitamente declaradas; explicar a relação etiológica em nota.
  alternative: Inserir 'Dia da Expiação' ou 'Yom Kippur' diretamente no versículo.
  rationale: O texto descreve a observância sem empregar aqui esse nome; a nota fornece a identificação contextual sem acrescentá-la ao corpo da tradução.
- issue: Conteúdo da notícia sobre José
  choice: Traduzir de modo aberto como 'a notícia a respeito de José'.
  alternative: Especificar 'a notícia de que José havia morrido'.
  rationale: A fonte não explicita a morte de José nesta frase, embora o contexto narrativo possa sugerir o que Jacó foi levado a crer.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “no décimo dia do sétimo mês” foi mantida por corresponder à estrutura enfática da fonte. O marcador [a] aparece no texto principal.
