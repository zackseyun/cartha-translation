  text: have surrounded your sons, and their flocks have been seized.” And he rose up from his house, he and his three sons, and all his father’s servants, and the servants of his house, and he went against them with six thousand men.
translation:
  language: pt
  text: “Cercaram os seus filhos e apreenderam os rebanhos deles.” Então ele se levantou, saiu de casa com seus três filhos, com todos os servos de seu pai e com os servos de sua própria casa, e foi contra eles com seis mil homens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐገትዎሙ
  choice: Cercaram
  rationale: Expressa de modo natural a ação de rodear ou cercar pessoas, preservando o caráter urgente da notícia.
- source_word: መራዕዮሙ
  choice: os rebanhos deles
  rationale: O termo designa coletivamente os animais apascentados; “rebanhos” é amplo e natural em português.
- source_word: ተማህጠኑ
  choice: tomaram
  rationale: No contexto de ataque, indica que os rebanhos foram capturados ou apreendidos; “tomaram” mantém a formulação clara sem acrescentar violência não explicitada.
- source_word: ወተንሥአ፡ እምነ፡ ቤቱ
  choice: Então ele se levantou, saiu de casa
  rationale: Reproduz a sequência de levantar-se e partir da casa em português corrente, sem fundir as duas ações.
- source_word: ወኵሎሙ፡ ደቂ፡ አቡሁ፡ ወደቁ፡ ወሖረ
  choice: com todos os servos de seu pai e com os servos de sua própria casa
  rationale: Segue a evidência textual corrigida, que distingue dois grupos domésticos, evitando conflá-los.
- source_word: በስሳ፡ [ምእት]
  choice: com seis mil homens
  rationale: A leitura numérica tradicional corresponde a sessenta centenas, isto é, seis mil; “homens” explicita naturalmente a força que marchou contra os adversários.
