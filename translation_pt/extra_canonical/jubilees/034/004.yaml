  text: And Benjamin was the youngest[4], and for this reason he remained with his father. And there came the kings of Taphu, and the kings of Ares, and the kings of Seragan, and the kings of Selo, and the kings of Gaas, and the king of Bethoron, and the king of Maanisakir, and all those who dwell on this mountain, and those who dwell in
translation:
  language: pt
  text: Benjamim era o mais novo[a] e, por isso, permaneceu com seu pai. Então vieram os reis de Tafu, os reis de Ares, os reis de Seragã, os reis de Selô, os reis de Gaas, o rei de Bethoron, o rei de Maanisaquir e todos os que habitam neste monte, e os que habitam em
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência de lugares e títulos régios nos vv. 4–8 é difícil na tradição etíope; os nomes são transliterados de maneira conservadora, sem tentativa de normalização.
    reason: Nota necessária sobre a incerteza textual e a transliteração dos nomes próprios.
lexical_decisions:
- source_word: ዘይኄእስ
  choice: o mais novo
  rationale: O contexto e a tradição textual apontam para a condição de Benjamim como o filho mais jovem; a formulação é natural em português.
- source_word: ነበረ፡ ኀበ፡ አቡሁ
  choice: permaneceu com seu pai
  rationale: Reproduz de modo direto a ideia de ficar junto ao pai.
- source_word: ነገሥተ
  choice: reis
  rationale: Mantém o plural repetido no texto diante dos primeiros topônimos, sem harmonizá-lo com os singulares posteriores.
- source_word: ደብር
  choice: monte
  rationale: Equivalente corrente para elevação ou região montanhosa; preserva a referência demonstrativa do texto.
