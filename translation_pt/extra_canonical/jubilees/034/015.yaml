  text: And on that day Bilhah heard that Joseph had perished, and while she was mourning for him she died in Qafratef[15], and Dinah his daughter also died after Joseph had perished.
translation:
  language: pt
  text: Naquele dia, Bila soube que José havia perecido. Enquanto o lamentava, ela morreu em Qafratef[a]. Diná, filha de Jacó, também morreu depois que José havia perecido.
