  rationale: 'Reproduz diretamente a sequência do texto: tomar uma mulher/esposa da Mesopotâmia como segunda.'
theological_decisions:
- issue: Sentido do verbo aplicado a Simeão
  choice: mudou de ideia
  alternative: arrependeu-se; voltou atrás; lamentou isso
  rationale: A formulação preserva o sentido contextual sem atribuir necessariamente ao verbo uma carga teológica de arrependimento moral.
