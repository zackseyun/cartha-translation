  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
translation:
  language: pt
  text: A esposa de Benjamim era Iyasaka. Simeão mudou de ideia[a] e tomou outra esposa da Mesopotâmia, como seus irmãos.
  philosophy: optimal-equivalence
