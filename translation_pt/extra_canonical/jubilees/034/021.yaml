lexical_decisions:
- source_word: ኢያስካ
  choice: Iasaca
  rationale: Transliteração portuguesa simples do nome próprio ge'ez, preservando sua forma no texto-fonte.
- source_word: ወተመይጠ፡ ስምዖን
  choice: Simeão mudou de ideia
  rationale: O verbo pode expressar voltar-se, mudar de posição ou arrepender-se; no contexto, indica a decisão de Simeão de tomar outra esposa.
- source_word: ብእሲተ፡ እም፡ ሜስጶጦምያ፡ ካልእተ
