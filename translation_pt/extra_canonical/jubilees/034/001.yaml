  text: And in the sixth year of this week, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and their servants also with them, in the pasture of Shechem.
translation:
  language: pt
  text: E no sexto ano desta semana, deste quadragésimo quarto jubileu, Jacó enviou seus filhos para apascentarem as ovelhas deles, e também os servos deles com eles, na pastagem de Siquém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ
  choice: semana
  rationale: Termo técnico da cronologia de Jubileus; a referência a um período de sete anos é dada pelo contexto, sem necessidade de explicitação no corpo do texto.
- source_word: ዘአርብዓ ወረባዕቱ እዮቤልው
  choice: no quadragésimo quarto jubileu
  rationale: Reproduz diretamente a numeração ordinal e mantém a expressão cronológica da obra.
- source_word: ይርዐዩ
  choice: para apascentarem
  rationale: Expressa naturalmente em português a finalidade do envio e o sentido pastoral do verbo.
- source_word: አባግዒሆሙ
  choice: as ovelhas deles
  rationale: O sufixo possessivo é plural, referindo as ovelhas aos filhos de Jacó.
- source_word: ወአግብርቲሆሙኒ
  choice: e os servos deles também
  rationale: O sufixo -ሆሙ é de terceira pessoa do plural; portanto, 'deles', e não 'dele'.
- source_word: ውስተ ጸአተ ሴቄም
  choice: até a pastagem de Siquém
  rationale: Preserva o singular de 'pastagem' e verte a construção direcional de modo idiomático.
