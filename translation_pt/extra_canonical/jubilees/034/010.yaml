lexical_decisions:
- source_word: አግብርተ
  choice: seus servos
  rationale: O termo designa servos ou servidores; o possessivo retoma o referente do contexto anterior, como exige o fragmento inicial do versículo.
- source_word: ወረዱ
  choice: desceram
  rationale: Mantém o verbo tradicional e geograficamente apropriado para a ida ao Egito.
- source_word: ሱባዔ
  choice: semana
  rationale: Em Jubileus, o termo indica uma unidade de sete anos; conservar «semana» preserva o sistema cronológico próprio da obra.
- source_word: ፈነወ
  choice: enviou
  rationale: Equivalente direto e natural do verbo de envio.
- source_word: ያእምር፡ ሰላሞሙ
  choice: para saber se seus irmãos estavam bem
  rationale: A expressão idiomática refere-se a inteirar-se do bem-estar ou da paz deles; esta formulação soa natural em português sem perder o sentido.
- source_word: ውስተ፡ ምድረ
  choice: na terra de
  rationale: «Terra» está em construção com um complemento posterior; a tradução preserva deliberadamente a frase incompleta do trecho fornecido.
