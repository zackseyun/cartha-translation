base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/020.yaml
  text: And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, an Egyptian; and the name of Benjamin’s wife was Iyasaka.
translation:
  language: pt
  text: Depois que José foi levado embora[a], os filhos de Jacó se casaram. A esposa de Rúben chamava-se Ada; a de Simeão, Adiba, uma cananeia; a de Levi, Melca, das filhas de Arã, da descendência dos filhos de Terá; a de Judá, Betasuel, uma cananeia; a de Issacar, Hizeca; a de Zebulom, Niamã; a de Dã, Egla; a de Naftali, Rasuá, da Mesopotâmia; a de Gade, Maca; a de Aser, Ijona; a de José, Asenate, uma egípcia; e a de Benjamim, Iasaca.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «desapareceu»; ou: «se perdeu».'
    reason: O verbo pode abranger a ideia de perda ou desaparecimento, mas o texto principal preserva sua formulação passiva.
lexical_decisions:
- source_word: ተሐጕለ
  choice: desapareceu
  rationale: O verbo indica que José se perdeu ou deixou de estar presente; “desapareceu” preserva essa perspectiva sem especificar aqui como isso ocorreu.
- source_word: ነሥኡ፡ ... አንስትያ
  choice: se casaram
  rationale: A expressão literalmente fala em “tomar mulheres/esposas”; “se casaram” comunica naturalmente em português o sentido matrimonial do contexto.
- source_word: ከናዊት / ከነናዊት
  choice: uma cananeia
  rationale: Mantém a indicação de origem étnica em forma idiomática e indefinida.
- source_word: ግብጻዊት
  choice: uma egípcia
  rationale: Reproduz o gentílico feminino como descrição de origem, sem transformá-lo em título ou epíteto exclusivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com nomes próprios adaptados à ortografia e à pronúncia correntes em português. A repetição literal de “o nome da esposa de...” foi condensada após a primeira ocorrência para dar fluidez à longa lista, sem perda de conteúdo.
