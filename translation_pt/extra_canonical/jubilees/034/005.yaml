lexical_decisions:
- source_word: አም፡ ምድረ፡ ከናዓን
  choice: da terra de Canaã
  rationale: O primeiro termo é entendido como erro tipográfico por እም, preposição que significa ‘de, desde’; a expressão completa continua a frase do versículo anterior.
- source_word: ወዜነዉዎ፡ ለያዕቆብ
  choice: E contaram a Jacó
  rationale: Traduz diretamente o verbo de informar ou relatar, com o destinatário Jacó.
- source_word: እንዘ፡ ይብሉ
  choice: ':'
  rationale: A fórmula introdutória literalmente equivalente a ‘dizendo’ é representada de modo natural em português pelos dois-pontos antes do discurso direto.
- source_word: ናሁ
  choice: Eis que
  rationale: Preserva a partícula apresentativa enfática e o tom narrativo solene.
- source_word: ነገሥተ፡ አሞሬዎን
  choice: os reis dos amorreus
  rationale: Mantém o plural ‘reis’ e o nome gentílico tradicional e reconhecível em português.
