lexical_decisions:
- source_word: መራዕይሁ
  choice: seus rebanhos
  rationale: O termo deriva do campo semântico de pastorear e designa mais naturalmente os animais sob seu cuidado; evita o sentido excessivamente amplo de “posses”.
- source_word: ፀባሕተ
  choice: tributo
  rationale: No contexto de vitória e submissão, indica uma prestação imposta ao povo vencido.
- source_word: ኀምስተ፡ ፍሬ፡ ምድርሙ
  choice: um quinto da produção de sua terra
  rationale: Expressa de forma natural a fração exigida dos frutos ou produtos da terra.
- source_word: ወዐብየ፡ ላዕሌሆሙ
  choice: prevaleceu contra eles
  rationale: Preserva a ideia de superioridade ou vitória sobre os adversários sem acrescentar detalhes militares ausentes.
- source_word: ወሐነጸ
  choice: E construiu
  rationale: Mantém a oração incompleta do trecho-fonte, cujo objeto aparece na continuação textual.
