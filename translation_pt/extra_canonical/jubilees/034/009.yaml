lexical_decisions:
- source_word: በሰላም
  choice: em paz
  rationale: Reproduz diretamente a expressão adverbial do ge'ez e soa natural em português.
- source_word: ገብረ፡ ምስሌሆሙ፡ ሰላመ
  choice: fez as pazes com eles
  rationale: Expressa idiomaticamente a construção literal 'fez paz com eles', sem alterar seu sentido.
- source_word: ወኮንዎ
  choice: e eles se tornaram seus
  rationale: Conserva o valor ingressivo possível de 'tornar-se' e o sufixo pronominal masculino singular -wo, que estabelece uma relação com ele; o complemento parece continuar no versículo seguinte.
theological_decisions:
- issue: Natureza da relação indicada por ወኮንዎ
  choice: se tornaram seus
  alternative: tornaram-se seus servos / tributários
  rationale: O texto deste versículo marca uma relação de pertença ou submissão, mas não explicita aqui sua natureza; acrescentar 'servos' ou 'tributários' resolveria indevidamente a elipse.
