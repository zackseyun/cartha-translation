  text: And he blessed and rejoiced, and he called the name of this feast the feast of the Lord, a joy
translation:
  language: pt
  text: E ele abençoou e se alegrou, e chamou esta festa de Festa do Senhor, uma alegria[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Festa do Senhor, Alegria”.'
    reason: Preserva a possibilidade de que “Alegria” faça parte do nome da festa, em vez de funcionar como uma aposição explicativa.
lexical_decisions:
- source_word: ባረከ
  choice: abençoou
  rationale: Corresponde diretamente ao verbo ge'ez para abençoar, em linguagem atual e digna.
- source_word: ተፈሥሐ
  choice: se alegrou
  rationale: Expressa naturalmente a ideia de alegrar-se ou regozijar-se.
- source_word: ጸውዐ፡ ስማ
  choice: chamou ... de
  rationale: Reproduz de modo idiomático em português a construção semítica literal 'chamou o nome de'.
- source_word: በዓለ፡ እግዚአብሔር
  choice: Festa do Senhor
  rationale: Mantém a designação nominal do texto-fonte sem acrescentar interpretação.
- source_word: ፍሥሓ
  choice: uma alegria
  rationale: Conserva o substantivo final em aposição, enquanto o artigo indefinido torna a expressão natural em português.
theological_decisions:
- issue: Relação sintática do substantivo final ፍሥሓ ('alegria') com o nome da festa
  choice: uma alegria, em aposição explicativa
  alternative: integrá-lo ao título como 'Festa do Senhor, Alegria'
  rationale: O ge'ez permite entender o termo final como aposição, e não deixa inequívoco se ele pertence formalmente ao nome. A tradução principal segue a leitura sintaticamente fluida, enquanto a nota preserva a alternativa titular.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção idiomática “chamou esta festa de” evita o decalque pouco natural “chamou o nome desta festa”, sem perder o conteúdo do original.
