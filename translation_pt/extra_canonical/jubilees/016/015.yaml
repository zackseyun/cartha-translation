  text: the covenant that is established forever. And in the sixth year of the fourth week we came to Abraham at the Well of the Oath, and we appeared to him as we had told Sarah that we would return to her and she would conceive a son.
translation:
  language: pt
  text: a aliança estabelecida para sempre. No sexto ano da quarta semana, fomos até Abraão, junto ao Poço do Juramento, e aparecemos a ele, conforme havíamos dito a Sara que voltaríamos a ela e que ela conceberia um filho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳን
  choice: aliança
  rationale: Equivalente natural e tradicional para o substantivo geʽez que designa pacto ou aliança.
- source_word: ተሠርዐት
  choice: estabelecida
  rationale: Expressa o sentido passivo de algo instituído ou estabelecido, sem acrescentar uma nuance denominacional.
- source_word: ለዓለም
  choice: para sempre
  rationale: Neste contexto, a expressão indica duração perpétua.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Poço do Juramento
  rationale: Tradução semântica do topônimo, preservando sua ligação explícita com um juramento.
- source_word: አስተርአይናሁ
  choice: aparecemos a ele
  rationale: Mantém a primeira pessoa do plural e o sentido de tornar-se visível ou aparecer.
- source_word: ንገብአ፡ ኀቤሃ
  choice: voltaríamos a ela
  rationale: Reproduz a direção pessoal da expressão e a perspectiva temporal do discurso relatado.
theological_decisions:
- issue: Sujeito plural de “fomos” e “aparecemos”
  choice: Manter a primeira pessoa do plural sem identificar os agentes
  alternative: Explicitar “os anjos” ou “nós, os anjos”
  rationale: O verso emprega formas plurais, mas não nomeia aqui os agentes; explicitá-los importaria informação contextual para o texto.
- issue: Resultado da volta a Sara
  choice: “ela conceberia um filho”
  alternative: “ela teria concebido um filho” ou “ela daria à luz um filho”
  rationale: A leitura transmitida e o contexto apontam para concepção futura; “conceberia” preserva essa referência sem substituir concepção por nascimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura em minúscula preserva o fato de que o versículo começa como continuação sintática do anterior. A coordenação final foi mantida clara e natural, sem identificar além do texto os agentes da primeira pessoa do plural.
