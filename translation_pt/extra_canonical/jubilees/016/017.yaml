  yaml_path: translation/extra_canonical/jubilees/016/017.yaml
  text: And we blessed him and told him everything that had been decreed concerning him, that he would not die until he had begotten six more sons and seen them before he died; but in Isaac his name and seed would be called.
translation:
  language: pt
  text: 'E nós o abençoamos e lhe contamos tudo o que havia sido decretado a seu respeito: que ele não morreria até que tivesse gerado mais seis filhos e os visse antes de morrer; mas, em Isaque, seriam chamados o seu nome e a sua descendência.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas, em Isaque, lhe seriam chamados nome e descendência”.'
    reason: A construção final é compacta e admite variação quanto à relação do pronome com “nome” e “descendência”.
lexical_decisions:
- source_word: ወባረክናሁ
  choice: E nós o abençoamos
  rationale: Reproduz diretamente a ação e a primeira pessoa plural da narrativa angélica.
- source_word: ስድስተ፡ ውሉደ
  choice: mais seis filhos
  rationale: O numeral e o substantivo indicam seis filhos; “mais” reflete o valor contextual da tradição textual, segundo a qual estes seriam adicionais a Isaque.
- source_word: ወይሬኢ
  choice: e vê-los
  rationale: Mantém como objeto implícito os seis filhos imediatamente mencionados, sem introduzir “os filhos de Isaque”.
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: mas em Isaque seriam chamados o seu nome e a sua descendência
  rationale: Preserva a formulação passiva e algo incomum do ge'ez, sem resolver indevidamente a relação entre nome, descendência e Isaque.
theological_decisions:
- issue: Identidade da linhagem chamada em Isaque
  choice: Preservar a expressão “em Isaque seriam chamados o seu nome e a sua descendência”
  alternative: “por meio de Isaque seu nome e sua descendência seriam perpetuados”
  rationale: A alternativa interpreta o sentido teológico e dinástico; a redação escolhida conserva a tensão e a formulação da fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “vê-los antes de morrer” foi mantida porque corresponde à ênfase temporal da fonte. A frase final conserva deliberadamente certa estranheza para não eliminar sua ambiguidade.
