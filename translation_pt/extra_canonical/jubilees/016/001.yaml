base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/001.yaml
  text: 'She conceived a son. And and we returned to Sarah in the seventh month and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and would see them before he died, and that in Isaac a name and seed would be called for him.'
translation:
  language: pt
  text: 'Ela concebeu um filho. No sétimo mês, voltamos para junto de Sara e constatamos que ela havia concebido antes de chegarmos.[a] Então o abençoamos e lhe contamos tudo o que havia sido ordenado a seu respeito: ele não morreria antes de gerar seis filhos e vê-los antes de morrer; e, em Isaque, seriam chamados o seu nome e a sua descendência.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que ela havia concebido diante de nós”.'
    reason: O termo ge'ez pode ser entendido temporalmente como “antes de nós” ou espacialmente como “diante de nós”.
  - marker: b
    text: Isto é, o seu nome e a sua linhagem estariam ligados a Isaque. A expressão traduzida literalmente como “seriam chamados” também pode ter o sentido de “seriam reconhecidos” ou “receberiam designação”.
    reason: A construção com “chamar” é densa e pouco idiomática em português; a nota esclarece possibilidades sem substituir a formulação do original.
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Ela concebeu um filho
  rationale: Traduz diretamente a abertura do texto ge'ez, sem importar a leitura anterior que introduzia um anúncio a Abraão.
- source_word: በወርኅ፡ ሳብዕ
  choice: No sétimo mês
  rationale: Pela ordem e pela sintaxe do texto, a expressão temporal modifica o retorno dos narradores a Sara.
- source_word: ቅድሜነ
  choice: antes de chegarmos
  rationale: Expressa em português natural a ideia literal de 'antes de nós'; a possível leitura espacial é preservada em nota.
- source_word: ፮ዲ፡ ስድስተ፡ ውሉደ
  choice: seis filhos
  rationale: O numeral e o substantivo são vertidos diretamente; 'gerar seis filhos' mantém a perspectiva do sujeito masculino.
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት
  choice: e vê-los
  rationale: O objeto implícito é naturalmente retomado como os seis filhos; a oração anterior já estabelece que isso ocorreria antes de sua morte.
- source_word: ይጼዋዕ
  choice: seriam chamados
  rationale: Preserva o verbo 'chamar', bem como a formulação bíblica e sua tensão semântica, em vez de substituí-lo por uma interpretação como 'perpetuados'.
- source_word: ዘርአ
  choice: descendência
  rationale: Neste contexto genealógico, 'descendência' comunica melhor o sentido coletivo de 'semente' em português corrente.
theological_decisions:
- issue: Referente dos pronomes masculinos em 'o abençoamos' e 'lhe contamos'
  choice: Manter o referente implícito como no texto
  alternative: Explicitar 'Abraão'
  rationale: Embora o contexto provavelmente aponte para Abraão, o nome não aparece nesta oração do texto ge'ez; explicitá-lo resolveria silenciosamente uma referência pronominal.
- issue: Sentido de 'nome e descendência seriam chamados em Isaque'
  choice: Preservar a formulação com 'chamados'
  alternative: Interpretar como 'seriam perpetuados' ou reduzir à fórmula 'por Isaque seria chamada a sua descendência'
  rationale: O texto menciona tanto 'nome' quanto 'descendência'. A tradução mantém ambos e evita harmonizar a frase com uma fórmula canônica mais conhecida.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição defeituosa de 'e e' presente na camada inglesa não foi reproduzida. Os referentes pronominais e a expressão final foram mantidos sem explicitação doutrinária.
