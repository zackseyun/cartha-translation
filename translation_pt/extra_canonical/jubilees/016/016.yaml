base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/016.yaml
  text: And we returned in the seventh month and found Sarah pregnant before us, and we blessed the Lord, and we announced to him all the things which he had spoken concerning him, that he would surely do them.
translation:
  language: pt
  text: 'Voltamos no sétimo mês e encontramos Sara grávida em nossa presença. Abençoamos Abraão e lhe anunciamos tudo o que havia sido decretado a seu respeito: ele não morreria antes de gerar outros seis filhos e de vê-los antes de morrer; e, em Isaque, seriam chamados o seu nome e a sua descendência.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባረክናሁ
  choice: Abençoamos Abraão
  rationale: A forma verbal traz objeto masculino singular, cujo referente contextual é Abraão. Nomeá-lo evita a leitura equivocada de que os mensageiros bendisseram o Senhor.
- source_word: ዘተአዘዘ፡ ሎቱ
  choice: o que havia sido decretado a seu respeito
  rationale: O verbo expressa algo ordenado ou determinado; neste contexto, 'decretado' comunica uma determinação divina acerca de Abraão sem reduzir a frase a meras palavras ditas.
- source_word: ስድስተ፡ ውሉደ
  choice: outros seis filhos
  rationale: O texto diz literalmente 'seis filhos'; 'outros' torna explícita a relação contextual com os filhos que Abraão já tinha ou teria antes desses seis, correspondendo aos seis filhos posteriores de Quetura.
- source_word: ወበይስሐቅ፡ ይጼዋዕ፡ ሎቱ፡ ስም፡ ወዘርአ
  choice: mas seria em Isaque que seu nome e sua descendência seriam perpetuados
  rationale: A expressão semítica 'ser chamado' em Isaque indica a continuidade reconhecida do nome e da linhagem por meio dele. 'Seriam perpetuados' transmite esse sentido naturalmente, sem identificar a descendência apenas com a existência biológica.
theological_decisions:
- issue: Referente daquele que é abençoado
  choice: Abraão é o objeto da bênção dos mensageiros
  alternative: o Senhor é bendito
  rationale: O sufixo masculino singular e a sequência narrativa apontam para Abraão; a leitura 'bendizemos o Senhor' não representa adequadamente o texto ge'ez fornecido.
- issue: Conteúdo do anúncio a Abraão
  choice: Inclui a promessa de que viveria até gerar e ver outros seis filhos, seguida da primazia da linhagem de Isaque
  alternative: Deus certamente faria tudo o que havia dito
  rationale: O texto-fonte explicita que Abraão não morreria até gerar seis filhos e vê-los, e depois contrasta essa prole com a linhagem chamada em Isaque. A formulação alternativa omite conteúdo substancial do original.
- issue: Relação entre Isaque e os demais filhos
  choice: A continuidade do nome e da descendência de Abraão é atribuída especialmente a Isaque
  alternative: Todos os filhos ocupam papel idêntico na linhagem
  rationale: A conjunção adversativa e a cláusula final distinguem Isaque, preservando a tensão do texto sem acrescentar uma doutrina denominacional.
translation_notes:
  register: Português moderno, digno e acessível. Os pronomes ambíguos foram esclarecidos apenas onde o referente contextual é seguro. A tradução segue o texto ge'ez fornecido, inclusive o conteúdo sobre os seis filhos, em vez da redação inglesa abreviada.
