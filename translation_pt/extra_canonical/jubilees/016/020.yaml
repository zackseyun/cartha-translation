  yaml_path: translation/extra_canonical/jubilees/016/020.yaml
  text: And he built there an altar to Yahweh, who delivered him and made him rejoice in the land of his sojourning, and he made a festival of joy in this month for seven days, near the altar which he had built at the Well of the Oath.
translation:
  language: pt
  text: E ali construiu um altar a Yahweh, que o livrou e o fez alegrar-se na terra onde vivia como estrangeiro; e, neste mês, celebrou durante sete dias uma festa de alegria junto ao altar que havia construído no Poço do Juramento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, Berseba; o nome significa “Poço do Juramento”.
    reason: Ajuda o leitor a reconhecer o topônimo bíblico por trás da tradução literal da expressão geʿez.
lexical_decisions:
- source_word: ፈላስነቱ
  choice: onde vivia como estrangeiro
  rationale: Expressa em português natural a condição temporária de residente estrangeiro, sem sugerir necessariamente exílio forçado ou mera peregrinação.
- source_word: በዐዘቅተ ፡ መሐላ
  choice: no Poço do Juramento
  rationale: Traduz literalmente a expressão geʿez, um decalque do nome hebraico Berseba, e conserva o vínculo narrativo com o juramento.
- source_word: እግዚአብሔር
  choice: Yahweh
  rationale: Representa o nome divino conforme a decisão editorial adotada na camada de consulta e distingue-o do título genérico “Senhor”.
- source_word: ገብረ ፡ በዓለ ፡ ትፍሥሕት
  choice: celebrou ... uma festa de alegria
  rationale: Reproduz de modo idiomático a construção “fez uma festa de alegria”, preservando seu caráter festivo e jubiloso.
theological_decisions:
- issue: Relação das orações relativas com Yahweh
  choice: “que o livrou e o fez alegrar-se”
  alternative: “que o havia livrado e o fazia alegrar-se”
  rationale: Mantém as duas ações coordenadas como atributos de Yahweh sem impor uma distinção aspectual não exigida pelo texto geʿez.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação evita o substantivo pouco corrente “peregrinação” para a condição de Abraão e conserva a repetição de “alegria”, presente no texto-fonte.
