  yaml_path: translation/extra_canonical/jubilees/016/024.yaml
  text: 'And morning and evening he burned fragrant incense: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus, seven of these; he offered all of them mixed together, pure.'
translation:
  language: pt
  text: 'De manhã e à tarde, ele queimava incenso aromático: olíbano, gálbano, estoraque, nardo, mirra, cássia e costo — sete substâncias ao todo. Ele oferecia todas as sete.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለመዐዛ፡ ሠናይ
  choice: incenso aromático
  rationale: A expressão denota aroma agradável; no contexto do ato de queimar as sete substâncias, «incenso aromático» é natural e semanticamente adequado.
- source_word: ማየ፡ ልብን
  choice: olíbano
  rationale: Designação portuguesa corrente da resina de frankincense, preservando a referência a uma substância aromática específica.
- source_word: ስኂነ
  choice: estoraque
  rationale: Equivalente tradicional e inteligível de stacte; mantém a identificação antiga sem tentar resolver além da evidência a natureza exata da resina.
- source_word: ሰንበልተ፡ ወኵስተ
  choice: cássia e costo
  rationale: 'Mantém a ordem atestada no texto ge''ez: primeiro cássia, depois costo.'
- source_word: ያቀርብ
  choice: oferecia
  rationale: Verbo cultual apropriado para apresentar ou oferecer as substâncias.
