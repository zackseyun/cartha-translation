  yaml_path: translation/extra_canonical/jubilees/016/022.yaml
  text: at this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he offered, day by day, on the altar to the Lord two oxen, two rams, seven sheep, one male goat for a sin offering,
translation:
  language: pt
  text: nesta festa,[a] e ele foi o primeiro a celebrar a Festa das Cabanas na terra. Durante esses sete dias, ofereceu, dia após dia, no altar, ao Senhor, dois bois, dois carneiros, sete ovelhas e um bode como oferta pelo pecado,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para esta festa”.'
    reason: A preposição etíope pode admitir essa relação, embora o sentido temporal «nesta festa» seja mais provável no contexto.
lexical_decisions:
- source_word: በዛቲ፡ በዓል
  choice: nesta festa
  rationale: A preposição በ indica naturalmente localização temporal, ‘nesta/durante esta festa’. A expressão parece dar continuidade à frase do versículo anterior.
- source_word: በዓለ፡ መጻላት
  choice: Festa das Cabanas
  rationale: Designa a festa de habitações temporárias; ‘Cabanas’ é claro e corrente em português, sem depender de terminologia denominacional.
- source_word: ያቀርብ
  choice: ofereceu
  rationale: O verbo significa literalmente aproximar ou apresentar, mas, no contexto do altar e dos animais sacrificiais, ‘oferecer’ comunica com naturalidade seu sentido cultual.
- source_word: አልህምተ፡ ክልኤተ
  choice: dois bois
  rationale: Representa os bovinos machos enumerados para a oferta em linguagem portuguesa natural.
- source_word: መሐስአ፡ ጠሊ፡ አሐደ
  choice: um bode
  rationale: A expressão especifica um caprino macho; ‘bode’ é a forma direta e idiomática em português.
theological_decisions:
- issue: Função sacrificial do bode
  choice: como oferta pelo pecado
  alternative: pelo pecado
  rationale: O contexto cultual e a fórmula final indicam a função expiatória do animal; a tradução explicita que o bode é apresentado como oferta, sem ampliar a afirmação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário cultual reconhecível. Preservou-se a abertura fragmentária do versículo, pois ela parece concluir a frase do versículo anterior; a pontuação e a minúscula inicial refletem essa continuidade.
