base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/005.yaml
  text: She conceived a son. And in this month the Lord executed judgment on Sodom and Gomorrah and Admah [or 'and Dom'] and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, just as I have now declared to you all their deeds, that they are utterly wicked and sinful.
translation:
  language: pt
  text: 'Ela concebeu um filho. Nesse mês, o Senhor executou o julgamento contra Sodoma, Gomorra, Admá[a] e toda a região do Jordão. Queimou-as com fogo e enxofre e as destruiu; assim permanecem até hoje, conforme acabo de lhe dar a conhecer todos os atos deles: eram extremamente perversos e pecadores.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez traz literalmente «Dom», provavelmente uma forma corrompida de «Admá».
    reason: textual_variant
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Ela concebeu um filho
  rationale: Reproduz a oração inicial do ge'ez, inclusive o objeto «filho», omitido em versões anteriores.
- source_word: ገብረ፡ እግዚአብሔር፡ ዘነኒሆሙ
  choice: o Senhor executou o julgamento contra
  rationale: Expressa de modo natural em português a ação judicial do Senhor indicada pelo contexto e pela tradição textual.
- source_word: ወለዶም
  choice: Admá[a]
  rationale: «Dom» no manuscrito parece ser uma forma corrompida de Admá, cidade associada à destruição de Sodoma e Gomorra; a leitura literal é preservada em nota.
- source_word: አደያመ፡ ዮርዳኖስ
  choice: toda a região do Jordão
  rationale: «Região» comunica naturalmente a extensão territorial indicada pelo termo ge'ez, sem restringi-la apenas à margem ou ao vale.
- source_word: በእሳት፡ ወበተይ
  choice: com fogo e enxofre
  rationale: Mantém a dupla tradicional dos agentes da destruição em linguagem corrente.
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: como permanecem até hoje
  rationale: Em português, explicita de maneira mínima que o estado resultante da destruição perdura até o presente, evitando sugerir uma ação destrutiva contínua.
- source_word: በከመ፡ ናሁ፡ አይዳዐኩ፡ ኵሎ፡ ምግባሮሙ
  choice: Acabo de lhe dar a conhecer todos os atos deles
  rationale: Preserva o verbo de declaração, o valor temporal/enfático de «agora/eis» e a referência a todos os atos, conforme o texto ge'ez.
- source_word: ፀዋጋን፡ ወኃጥኣን፡ ጥቀ
  choice: extremamente perversos e pecadores
  rationale: Mantém os dois qualificativos e a forte intensificação final sem introduzir a categoria teológica mais específica de «sem lei».
theological_decisions:
- issue: Caráter judicial da destruição
  choice: executou o julgamento contra
  alternative: castigou
  rationale: A formulação conserva a dimensão de juízo divino sem reduzir a ação a mero castigo nem ampliar sua interpretação doutrinária.
- issue: Relação entre a declaração dos atos e a qualificação moral
  choice: duas orações ligadas por dois-pontos
  alternative: «todos os atos deles, mostrando que eram...»
  rationale: Os dois-pontos preservam a relação explicativa do ge'ez sem decidir rigidamente se a última oração é conteúdo direto da declaração ou inferência baseada nos atos.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A alternância entre o singular «lhe» (destinatário da revelação) e o plural «deles» (habitantes das cidades) conserva as referências do contexto. O marcador [a] aparece junto à leitura textualmente discutida.
