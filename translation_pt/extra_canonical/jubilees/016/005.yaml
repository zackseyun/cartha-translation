revisions:
- from: 'Ela concebeu um filho. Nesse mês, o Senhor executou o julgamento contra Sodoma, Gomorra, Admá[a] e toda a região do Jordão. Queimou-as com fogo e enxofre e as destruiu, como permanecem até hoje. Acabo de lhe dar a conhecer todos os atos deles: eram extremamente perversos e pecadores.'
  to: 'Ela concebeu um filho. Nesse mês, o Senhor executou o julgamento contra Sodoma, Gomorra, Admá[a] e toda a região do Jordão. Queimou-as com fogo e enxofre e as destruiu; assim permanecem até hoje, conforme acabo de lhe dar a conhecer todos os atos deles: eram extremamente perversos e pecadores.'
  rationale: A revisão explicita que o estado decorrente da destruição perdura «até hoje» e retém a ligação comparativa com a declaração dos atos. Mantém-se a identificação cautelosa de «Admá», com a leitura ge'ez «Dom» preservada em nota, sem apresentar a conjectura como certa.
