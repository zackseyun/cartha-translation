lexical_decisions:
- source_word: ስሐቀት
  choice: riu
  rationale: Corresponde diretamente ao ato de rir e preserva a ligação com a tradição narrativa de Sara.
- source_word: እስመ
  choice: porque
  rationale: 'Exprime aqui a relação causal indicada pela conjunção: Sara riu porque ouviu o que fora dito.'
- source_word: ዘንተ፡ ቃለ
  choice: esta palavra
  rationale: Mantém a formulação concreta do ge'ez, na qual 'palavra' pode designar a declaração ou mensagem proferida.
- source_word: ተናገርነ
  choice: havíamos dito
  rationale: O mais-que-perfeito composto deixa clara a anterioridade da fala em relação ao momento em que Sara a ouviu e riu.
- source_word: ዘለፍናሃ
  choice: a repreendemos
  rationale: Traduz a ideia de censurar ou corrigir verbalmente, em registro digno e corrente.
theological_decisions:
- issue: Identidade do sujeito plural em 'havíamos dito' e 'nós a repreendemos'
  choice: Preservar a primeira pessoa do plural sem identificar explicitamente seus referentes
  alternative: Explicitar o sujeito como anjos ou mensageiros
  rationale: O versículo emprega formas verbais na primeira pessoa do plural, mas não identifica por si só quem compõe esse grupo; explicitá-lo importaria uma interpretação contextual para o texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conserva-se a expressão semítica 'esta palavra' e o plural narrativo do original, sem explicações acrescentadas.
