translation:
  language: pt
  text: Mas salvamos Ló, porque Deus se lembrou de Abraão e o tirou do meio da destruição.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናድኅኖ
  choice: salvamos
  rationale: A forma verbal expressa livramento ou salvação; a primeira pessoa do plural foi preservada sem explicitar quem fala.
- source_word: ተዘከሮ
  choice: se lembrou de
  rationale: Reproduz de modo natural o verbo de recordar, preservando a causalidade ligada a Abraão.
- source_word: አውፅኦ
  choice: o tirou
  rationale: Traduz o sentido de fazer sair; o pronome retoma Ló, como exige o contexto.
- source_word: እማእከለ
  choice: do meio da destruição
  rationale: A expressão significa literalmente “do meio de”; “da destruição” explicita o desastre de Sodoma indicado pelo contexto imediato e pela camada inglesa auditada.
theological_decisions:
- issue: A lembrança de Abraão por Deus como motivo do livramento de Ló
  choice: porque Deus se lembrou de Abraão
  alternative: pois Deus se lembrou de Abraão
  rationale: Mantém a relação causal explícita do texto sem explicar em que sentido Deus “se lembrou” nem desenvolver uma doutrina de intercessão.
- issue: Sujeito plural de “salvamos”
  choice: preservar a primeira pessoa do plural sem identificação adicional
  alternative: explicitar “nós, os anjos, salvamos”
  rationale: O trecho não identifica diretamente os falantes; a tradução conserva essa tensão narrativa e evita acrescentar uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A ordem e a causalidade do original foram preservadas; não foram acrescentados títulos ou identificações interpretativas.
