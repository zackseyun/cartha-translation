  terminology: «Sacrifício de comunhão», «ofertas de cereal», «ofertas de bebida», «carneiros», «cabritos», «ovelhas» e «bodes» são escolhas adequadas. «Descendência» traduz naturalmente o coletivo «semente»; a nota literal é útil.
