base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/023.yaml
  text: to make atonement for sin by it, for himself and for his seed. And for a sacrifice of well-being, seven rams, seven kids, seven sheep, and seven male goats, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.
translation:
  language: pt
  text: 'para fazer, por meio dele, expiação pelo pecado, por si mesmo e por sua descendência.[a] Como sacrifício de comunhão, ofereceu sete carneiros, sete cabritos, sete ovelhas e sete bodes, com suas ofertas de cereal e suas ofertas de bebida. Queimou no altar toda a gordura deles: uma oferta escolhida ao Senhor, de aroma agradável.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lit.: “por sua semente”.'
    reason: Registra a imagem literal do termo fonte, traduzido no texto pelo sentido coletivo natural “descendência”.
lexical_decisions:
- source_word: ያስተስሪ፡ ቦቱ
  choice: por meio dele, fazer expiação
  rationale: Preserva tanto a ideia de expiação do verbo quanto o elemento instrumental ቦቱ, cujo referente se encontra no contexto anterior.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: Expressa em português corrente o sentido coletivo de 'semente' ou posteridade.
- source_word: መሥዋዕተ፡ መድኀኒት
  choice: sacrifício de comunhão
  rationale: Designa uma oferta sacrificial de bem-estar/paz sem reduzir seu sentido à ideia moderna de saúde ou prosperidade.
- source_word: አብሐኩ፡ ... መሐስአ፡ ... አባግዐ፡ ... ደቤላት
  choice: carneiros ... cabritos ... ovelhas ... bodes
  rationale: Segue os valores lexicais da lista etíope e mantém distintas as quatro classes de animais.
- source_word: መሥዋዕቶሙኒ፡ ወቍጻጼቶሙኒ
  choice: suas ofertas de cereal e suas ofertas de bebida
  rationale: Usa termos sacrificiais claros e correntes para as ofertas acompanhantes sólidas e líquidas.
- source_word: የዐጥን
  choice: Queimou ... como incenso
  rationale: Reflete o verbo de fazer subir fumaça ou queimar ritualmente, em vez de uma queima meramente destrutiva.
- source_word: ጽንሓሐ፡ ኅሩየ፡ ለእግዚአ
  choice: uma oferta escolhida ao Senhor, de aroma agradável
  rationale: Conserva a qualidade de oferta seleta e a fórmula cultual do aroma agradável.
theological_decisions:
- issue: Objeto e meio da expiação
  choice: fazer expiação pelo pecado, por meio dele
  alternative: fazer expiação por si mesmo e por sua descendência
  rationale: A ordem e a sintaxe do ge'ez apresentam o pecado como objeto da expiação e ቦቱ como expressão instrumental; a tradução não elimina esse elemento nem transforma as pessoas no único objeto.
- issue: Natureza do sacrifício
  choice: sacrifício de comunhão
  alternative: sacrifício de bem-estar
  rationale: A escolha transmite a categoria cultual de paz/bem-estar de modo inteligível, sem sugerir uma doutrina específica de salvação ou prosperidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura em minúscula preserva o caráter de continuação sintática do versículo anterior. A terminologia sacrificial é técnica o bastante para manter o contexto cultual, mas evita arcaísmos desnecessários.
