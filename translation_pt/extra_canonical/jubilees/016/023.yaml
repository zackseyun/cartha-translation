  source_fidelity: 'A lista de animais, as ofertas acompanhantes, o pecado como objeto da expiação e o elemento instrumental «por meio dele» correspondem bem ao ge''ez e ao atual registro de auditoria em inglês. Contudo, «como incenso» introduz uma modalidade que o texto não declara: o verbo descreve a queima ritual da gordura, não a oferta de incenso.'
