  yaml_path: translation/extra_canonical/jubilees/016/031.yaml
  text: And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches seven times; and in the morning he praised and gave thanks to his God for everything with joy.
translation:
  language: pt
  text: E Abraão tomou ramos de palmeira e frutos de belas árvores. Todos os dias, dava sete voltas ao redor do altar com os ramos; e, pela manhã, louvava seu Deus e lhe dava graças por tudo, com alegria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ፀበርት
  choice: ramos de palmeira
  rationale: A expressão etíope designa ramos ou folhas de palmeira; «ramos de palmeira» é natural e corresponde ao sentido contextual.
- source_word: ፍሬ፡ ዕፀ፡ ሠናይ
  choice: frutos de belas árvores
  rationale: Mantém os elementos explícitos «fruto», «árvore» e «bela/boa», sem identificar espécies não mencionadas.
- source_word: የዐውድ፡ ምሥዋዐ
  choice: dava ... voltas ao redor do altar
  rationale: Traduz o movimento repetido de circundar o altar em português corrente.
- source_word: በአዕፁቅ፡ ስብዕ
  choice: com os ramos ... sete voltas
  rationale: Preserva tanto o acompanhamento pelos ramos quanto o número sete, com ordem sintática natural em português.
- source_word: ይሴብሕ፡ ወይጌኒ
  choice: louvava ... e lhe dava graças
  rationale: Representa os dois atos distintos de louvor e ação de graças.
- source_word: በፍሥሓ
  choice: com alegria
  rationale: Expressa o modo alegre da ação em formulação portuguesa idiomática.
