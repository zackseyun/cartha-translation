base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/026.yaml
  text: And he blessed his Creator, who had created him in his generation, because He had created him according to His good pleasure; for he knew and perceived that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might be like Him who made all things.
translation:
  language: pt
  text: E ele abençoou o seu Criador, que o havia criado em sua geração, pois o havia criado segundo a sua boa vontade. Ele sabia e percebia que dele viria uma planta de justiça para as gerações eternas e, dele, uma descendência santa, para que ela fosse semelhante àquele que fez todas as coisas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትዝምዱ፡
  choice: em sua geração
  rationale: Mantém a referência temporal e genealógica do termo no contexto, em concordância com a evidência textual disponível, sem expandi-la para uma interpretação específica.
- source_word: በሥምረቱ፡
  choice: segundo a sua boa vontade
  rationale: Expressa tanto vontade quanto favor ou agrado, preservando o peso da iniciativa divina na criação.
- source_word: ወጠየቀ፡
  choice: e percebia
  rationale: Ao lado de አእመረ፡, traduz a ideia de conhecimento discernido ou confirmado sem produzir uma repetição pouco natural em português.
- source_word: ተከለ፡ ጽድቅ፡
  choice: uma planta de justiça
  rationale: Conserva a metáfora concreta do texto-fonte, em vez de substituí-la por uma explicação como “linhagem justa”.
- source_word: ዘርእ፡ ቅዱስ፡
  choice: uma descendência santa
  rationale: “Descendência” comunica naturalmente o sentido genealógico de “semente” em português, preservando seu caráter coletivo.
- source_word: ዘገብረ፡ ኵሎ።
  choice: aquele que fez todas as coisas
  rationale: Traduz ኵሎ። explicitamente e corrige a revisão anterior baseada na ausência equivocadamente presumida desse termo.
theological_decisions:
- issue: Referente da semelhança expressa em ከማሁ፡
  choice: semelhante àquele que fez todas as coisas
  alternative: semelhante a ele, que fez todas as coisas
  rationale: A formulação mantém o referente divino indicado pela oração relativa, sem acrescentar uma explicação teológica que o texto não fornece.
- issue: Finalidade ou resultado em ከመ፡ ይኩን፡
  choice: para que fosse
  alternative: de modo que seria
  rationale: A construção final preserva a orientação intencional mais provável, sem afirmar além do texto se a semelhança se aplica distributivamente à descendência ou coletivamente à semente santa.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. Mantiveram-se a metáfora “planta de justiça” e a tensão entre linguagem genealógica e finalidade teológica. As referências divinas permanecem claras pelo contexto, sem capitalização pronominal não exigida pelo português contemporâneo.
