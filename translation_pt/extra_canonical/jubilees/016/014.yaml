  text: And Abraham circumcised his son on the eighth day; he was the first to be circumcised according to the ordinance ordained forever.
translation:
  language: pt
  text: E Abraão circuncidou seu filho Isaque no oitavo dia; Isaque foi o primeiro a ser circuncidado segundo a ordenança instituída para sempre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከበቦ (wa-kababo)
  choice: E Abraão circuncidou
  rationale: O verbo expressa diretamente o ato de circuncidar; a coordenação inicial foi preservada.
- source_word: ለወልዱ (la-waldu)
  choice: seu filho
  rationale: Mantém a referência relacional do texto sem inserir no corpo do versículo um nome cuja posição no excerto pode pertencer ao contexto anterior.
- source_word: እመ፡ ሳምንት
  choice: no oitavo dia
  rationale: Segue o sentido temporal atestado pela tradição textual e pela camada inglesa auditada, em português corrente.
- source_word: ቀዳሚ (qaddami)
  choice: o primeiro
  rationale: Preserva a afirmação de precedência sem explicá-la além do texto.
- source_word: በከመ (ba-kama)
  choice: segundo
  rationale: Aqui introduz conformidade com a ordenança mencionada na continuação do texto, e não apenas o sentido adverbial de “desse modo”.
- source_word: ሥርዓት ዘተሠርዓ ለዘለዓለም
  choice: a ordenança estabelecida para sempre
  rationale: Reproduz a ideia de uma norma instituída com validade permanente, evitando em português a repetição pouco natural “ordenança ordenada”.
theological_decisions:
- issue: Duração da ordenança da circuncisão
  choice: estabelecida para sempre
  alternative: ordenada eternamente
  rationale: Conserva a força temporal de “para sempre” sem definir teologicamente o modo de sua aplicação posterior.
- issue: Alcance da afirmação “o primeiro”
  choice: ele foi o primeiro a ser circuncidado
  alternative: ele foi o primeiro circuncidado segundo essa ordenança
  rationale: Mantém a sintaxe e a tensão do texto, sem acrescentar uma delimitação histórica ou doutrinária que não esteja expressa.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do original. “Ordenança” conserva o tom normativo do texto, enquanto “estabelecida” evita uma repetição artificial.
