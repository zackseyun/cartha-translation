  - severity: medium
    issue: O pronome «ele» é ambíguo em português.
    rationale: Após «Abraão circuncidou seu filho», «ele foi o primeiro» pode ser entendido como retomando Abraão. O sentido textual é que Isaque foi o primeiro circuncidado segundo a ordenança.
