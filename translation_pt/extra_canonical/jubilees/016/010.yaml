- source_word: between Kadesh and Shur
  choice: entre Cades e Sur
  rationale: Conserva a localização geográfica e emprega as formas portuguesas tradicionais dos topônimos.
- source_word: in the mountains of Gerar
  choice: nas montanhas de Gerar
  rationale: Preserva a indicação topográfica sem harmonizá-la ou reinterpretá-la.
