  yaml_path: translation/extra_canonical/jubilees/016/006.yaml
  text: and they defiled themselves and committed fornication in their flesh and did uncleanness on the earth. And thus the Lord will execute judgment on the places where they have acted according to the uncleanness of Sodom, just as he judged Sodom.
translation:
  language: pt
  text: e eles se contaminaram, prostituíram-se em sua carne e praticaram impureza sobre a terra. E assim o Senhor executará juízo sobre os lugares em que agiram conforme a impureza de Sodoma, assim como julgou Sodoma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትራኩሱ
  choice: se contaminaram
  rationale: Reproduz a ideia reflexiva de tornar-se impuro ou contaminado, em linguagem natural e digna.
- source_word: ይዜምዉ
  choice: prostituíram-se
  rationale: Expressa a conduta sexual ilícita indicada pelo verbo, sem acrescentar uma interpretação denominacional.
- source_word: በሥጋሆሙ
  choice: em sua carne
  rationale: Mantém a formulação corporal concreta do texto-fonte e sua possível carga teológica.
- source_word: ርኵሰ
  choice: impureza
  rationale: Preserva o campo semântico de impureza moral e ritual, sem restringi-lo indevidamente.
- source_word: ኵነኔ
  choice: juízo
  rationale: Representa a ação judicial divina; o verbo 'executará' comunica que esse juízo será efetivado.
- source_word: መካናት
  choice: lugares
  rationale: Equivalente direto e claro para o plural locativo do texto.
theological_decisions:
- issue: Relação entre a conduta descrita e a impureza de Sodoma
  choice: agiram segundo a impureza de Sodoma
  alternative: fizeram conforme a impureza de Sodoma
  rationale: Preserva a comparação moral do texto sem especificar além da fonte a natureza exata do pecado de Sodoma.
- issue: Paralelo entre o juízo futuro e o juízo de Sodoma
  choice: assim como julgou Sodoma
  alternative: como condenou Sodoma
  rationale: '''Julgou'' mantém a linguagem judicial e evita resolver se o termo enfatiza o processo, a sentença ou a condenação.'
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. A sintaxe conserva o paralelismo e a solenidade do original, evitando tanto arcaísmos quanto explicitação interpretativa.
