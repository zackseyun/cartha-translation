  yaml_path: translation/extra_canonical/jubilees/016/004.yaml
  text: and his name, Isaac, was written on the heavenly tablets. And when we returned to her at the appointed time, she conceived and bore a son.
translation:
  language: pt
  text: E o nome dele, Isaque, foi escrito nas tábuas celestiais.[a] Quando voltamos para ela no tempo determinado,[b] ela concebeu e deu à luz um filho.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E seu nome foi escrito nas tábuas celestiais: Isaque”.'
    reason: Registra a possibilidade de conservar a aposição de “Isaque” no fim da oração, embora a ordem adotada seja mais natural em português.
  - marker: b
    text: 'Ou, em sentido mais geral: “fomos até ela”.'
    reason: Assinala a tradução mais ampla possível do verbo, embora “voltamos” expresse melhor seu valor contextual.
lexical_decisions:
- source_word: ስሙ (səmu)
  choice: o nome dele
  rationale: O sufixo possessivo de terceira pessoa exige a ideia de “seu nome/o nome dele”; “o nome dele” evita, em português, possível referência ambígua causada por “seu”.
- source_word: ጽላተ፡ ሰማይ (ṣəllāta samāy)
  choice: tábuas celestiais
  rationale: Mantém a expressão característica de Jubileus para os registros do céu, em linguagem natural e digna.
- source_word: ገባእነ (gabāʾna)
  choice: voltamos
  rationale: O verbo expressa retorno, não apenas chegada, e preserva a ligação narrativa com a promessa de voltar até Sara.
- source_word: በጊዜ፡ ሰዓት (ba-gize sāʿat)
  choice: no tempo determinado
  rationale: A expressão indica o momento fixado ou marcado; esta formulação é clara sem tornar o sentido excessivamente técnico.
theological_decisions:
- issue: O registro antecipado do nome de Isaque nas tábuas celestiais
  choice: E o nome dele, Isaque, foi escrito nas tábuas celestiais
  alternative: 'E seu nome foi escrito nas tábuas celestiais: Isaque'
  rationale: A tradução conserva a afirmação textual sobre o registro celestial sem explicar sua natureza nem acrescentar uma doutrina de predestinação.
- issue: Identidade do sujeito plural em “voltamos”
  choice: manter a primeira pessoa do plural sem identificar os falantes
  alternative: explicitar “nós, os anjos, voltamos”
  rationale: O texto mantém o sujeito implícito; identificá-lo na tradução resolveria uma questão contextual que o versículo não explicita.
translation_notes:
  register: Português moderno, amplamente internacional e de fácil leitura no Brasil. A formulação preserva a cadência narrativa, evita arcaísmos e mantém sem explicitação indevida tanto o sujeito de “voltamos” quanto a natureza das tábuas celestiais.
