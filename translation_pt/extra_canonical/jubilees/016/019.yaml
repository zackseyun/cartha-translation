lexical_decisions:
- source_word: ዘክህነት
  choice: um sacerdócio
  rationale: O substantivo coletivo é melhor expresso como “sacerdócio” do que como “sacerdotes”.
- source_word: ሕዝበ፡ ቅዱሰ
  choice: um povo santo
  rationale: Tradução direta e natural da expressão nominal.
- source_word: ለባሬ፡ ኵሉ
  choice: o Criador de tudo
  rationale: Preserva o título divino específico e liga “tudo” a “Criador”, conforme a leitura contextual e a evidência textual indicada.
- source_word: ዘነገርናሁ
  choice: porque lhe havíamos contado isso
  rationale: A oração é entendida em sentido causal; “isso” retoma o conteúdo comunicado no contexto anterior.
- source_word: ወተፈሥሐ
  choice: alegrou-se
  rationale: Equivalente corrente e digno para a ação de regozijar-se.
theological_decisions:
- issue: Título divino na bênção
  choice: Criador de tudo
  alternative: Senhor
  rationale: “Criador de tudo” conserva o título específico atestado pela leitura do texto, sem substituí-lo por um título teologicamente mais genérico.
- issue: Relação sintática de “tudo” e da oração seguinte
  choice: “tudo” modifica “Criador”, e a oração seguinte é causal
  alternative: “bendisse o Senhor por tudo o que lhe havíamos contado”
  rationale: Essa análise evita deslocar “tudo” para o conteúdo narrado e reflete a revisão filológica fornecida.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e vocabulário amplamente internacional. O fragmento inicial foi mantido como continuação sintática do versículo anterior.
