base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/009.yaml
  text: from the days of Adam until that time, because a man lay with his daughters. And behold, it was commanded and decreed concerning all his seed on the heavenly tablets, that he should remove them and uproot them, and that their judgment be executed like the judgment of Sodom, and that he should leave no seed of his on the earth on the day of condemnation.
translation:
  language: pt
  text: desde os dias de Adão até aquele tempo, porque um homem se deitou com suas filhas. E eis que, nas tábuas celestiais, foi ordenado e decretado, a respeito de toda a descendência daquele homem, que ele[a] os eliminasse e os arrancasse pela raiz, que o julgamento deles fosse executado como o julgamento de Sodoma e que ele não deixasse sobre a terra nenhum de seus descendentes no dia da condenação.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito não é nomeado nesta oração; pelo contexto, refere-se a Deus.
    reason: O ge’ez emprega verbos na terceira pessoa masculina singular, mas deixa implícita a identidade do agente.
lexical_decisions:
- source_word: አሜሁ
  choice: naquele tempo
  rationale: A expressão funciona como locução adverbial temporal, ‘então/naquele tempo’, e não como referência possessiva a ‘seu tempo’.
- source_word: ተአዘዘ፡ ወተቈረጸ
  choice: foi ordenado e decretado
  rationale: Preserva o paralelismo dos dois verbos passivos e expressa o caráter vinculante da decisão registrada nas tábuas celestiais.
- source_word: ያአትትሙ፡ ወ...ይሠርዎሙ
  choice: os eliminasse e os arrancasse pela raiz
  rationale: Mantém os verbos ativos na terceira pessoa masculina singular e reproduz a imagem enfática de remoção completa.
- source_word: ይገበር፡ ኵነኔሆሙ
  choice: que o julgamento deles fosse executado
  rationale: Reflete a construção passiva do texto, sem transformar indevidamente o sujeito singular anterior em agente plural.
- source_word: ኢያትርፍ፡ ሎቱ፡ ኵሎ፡ ዘርአ
  choice: que ele não deixasse ... nenhum descendente seu
  rationale: Conserva a forma ativa com sujeito masculino singular e comunica de modo natural a extinção completa da linhagem.
theological_decisions:
- issue: Identidade do sujeito singular das ações de eliminar, arrancar e não deixar descendência
  choice: Emprego de ‘ele’, com nota indicando que o contexto aponta para Deus
  alternative: 'Formulação passiva sem agente: ‘que fossem eliminados e arrancados pela raiz’'
  rationale: Os verbos ge’ez estão na terceira pessoa masculina singular, mas o substantivo que identifica o agente não aparece nesta oração. A tradução preserva a gramática sem tornar a identificação contextual mais explícita do que o texto.
- issue: Comparação com Sodoma
  choice: ‘como o julgamento de Sodoma’
  alternative: ‘à semelhança da condenação de Sodoma’
  rationale: ‘Julgamento’ mantém a repetição e a tensão jurídica do termo, sem especificar se Sodoma é o objeto, o padrão ou o evento da sentença além do que a comparação afirma.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. ‘Deitou-se com’ conserva o eufemismo antigo sem soar técnico; ‘descendência/descendente’ evita a ambiguidade moderna de ‘semente’. A abertura em minúscula preserva o caráter de continuação sintática do versículo anterior.
