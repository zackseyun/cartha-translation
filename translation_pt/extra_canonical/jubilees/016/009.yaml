  to: desde os dias de Adão até aquele tempo, porque um homem se deitou com suas filhas. E eis que, nas tábuas celestiais, foi ordenado e decretado, a respeito de toda a descendência daquele homem, que ele[a] os eliminasse e os arrancasse pela raiz, que o julgamento deles fosse executado como o julgamento de Sodoma e que ele não deixasse sobre a terra nenhum de seus descendentes no dia da condenação.
