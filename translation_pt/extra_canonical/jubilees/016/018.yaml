base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/018.yaml
  text: And Isaac alone would become a holy seed, and he would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom
translation:
  language: pt
  text: E somente Isaque se tornaria uma descendência santa e não seria contado entre as nações, pois se tornaria a porção do Altíssimo. Toda a sua descendência coube por sorte a Deus, para que, dentre todos os povos, se tornasse para o Senhor um povo de sua propriedade e se tornasse um reino.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይስሐቅኒ፡ አሐዱ
  choice: E somente Isaque
  rationale: Mantém o sujeito explícito, Isaque, e a ênfase exclusiva de አሐዱ, que neste contexto distingue Isaque dos demais filhos de Abraão.
- source_word: ዘርእ፡ ቅዱስ
  choice: uma descendência santa
  rationale: Traduz o sentido coletivo de 'semente' em português natural, preservando a ideia de linhagem consagrada.
- source_word: ኢይትኌለቍ፡ ውስተ፡ አሕዛብ
  choice: não seria contado entre as nações
  rationale: Conserva a formulação passiva e a distinção entre a descendência de Isaque e as nações.
- source_word: መክፈልተ፡ ልዑል
  choice: a porção do Altíssimo
  rationale: Reproduz a linguagem de repartição e pertença associada ao Altíssimo.
- source_word: ዘይመልከ፡ አምላክ፡ ወረደ
  choice: coube por sorte a Deus
  rationale: Expressa a imagem de algo que cai ou é atribuído por sorte, sem reduzir a frase simplesmente a 'pertenceu'.
- source_word: ሕዝበ፡ ትርሲት
  choice: um povo de sua propriedade
  rationale: Comunica posse especial ou herança adquirida em português claro e digno.
- source_word: መንግሥተ
  choice: um reino
  rationale: Mantém o substantivo político-teológico sem completar a oração além do texto fornecido.
theological_decisions:
- issue: Exclusividade de Isaque como descendência santa
  choice: somente Isaque
  alternative: Isaque, um só / Isaque se tornaria uma descendência santa
  rationale: O valor contextual de አሐዱ enfatiza que Isaque, em contraste com os outros descendentes de Abraão, é o único em vista.
- issue: Eleição e pertença divina
  choice: a porção do Altíssimo; coube por sorte a Deus
  alternative: a herança do Altíssimo; pertenceu a Deus
  rationale: Preserva as duas imagens relacionadas, mas não idênticas, de porção e atribuição por sorte, sem sistematizá-las teologicamente.
- issue: Relação do povo eleito com os demais povos
  choice: dentre todos os povos
  alternative: acima de todos os povos / separado de todos os povos
  rationale: A preposição indica proveniência ou seleção a partir do conjunto dos povos; a tradução evita acrescentar superioridade ou explicitar separação além do texto.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. O período foi dividido em duas frases para facilitar a leitura, sem alterar a progressão lógica. A tradução termina em 'um reino', acompanhando o recorte incompleto do versículo fornecido.
