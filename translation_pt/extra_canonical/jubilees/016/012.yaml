  text: From there he moved and dwelt by the Well of the Oath. And in the middle of the sixth month the Lord visited Sarah
translation:
  language: pt
  text: Dali, ele partiu e passou a morar junto ao Poço do Juramento. E, em meados do sexto mês, o SENHOR visitou Sara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: Dali
  rationale: Expressa de modo natural o sentido de procedência, «desde/de lá», retomando o local anterior.
- source_word: ወኀደረ
  choice: ele partiu e passou a morar
  rationale: No contexto de mudança de lugar e residência, a formulação portuguesa comunica o deslocamento implícito e a permanência, em consonância com a leitura contextual auditada.
- source_word: ኀበ፡ ዐዘቅት፡ መሐላ
  choice: junto ao Poço do Juramento
  rationale: Traduz o topônimo descritivo literalmente e evita a leitura incorreta «Carvalho de Manre»; «junto a» é natural para a localização.
- source_word: ወበመንፈቀ፡ ወርኅ፡ ሳድስ
  choice: E, em meados do sexto mês
  rationale: Reproduz a indicação temporal com português corrente; «em meados» comunica adequadamente o ponto médio sem rigidez artificial.
- source_word: ሐወጻ፡ እግዚአብሔር
  choice: o SENHOR visitou Sara
  rationale: Mantém «visitou», verbo teologicamente carregado que pode indicar intervenção favorável, sem explicitar além do texto; Sara é o objeto preservado pela tradição textual e pelo contexto imediato.
theological_decisions:
- issue: Sentido da visita divina
  choice: visitou Sara
  alternative: veio em auxílio de Sara / cuidou de Sara
  rationale: «Visitou» conserva a formulação e a tensão teológica do original, sem reduzir a ação divina a uma única interpretação.
- issue: Representação do nome/título divino
  choice: SENHOR
  alternative: Senhor
  rationale: A forma em versaletes convencionais (aqui representada por maiúsculas) sinaliza o referente divino e mantém registro bíblico reconhecível, sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O topônimo foi traduzido semanticamente. Não se incluiu a nota anterior sobre o «Carvalho de Manre», pois ela registra uma tradução equivocada, não uma ambiguidade genuína sustentada por este texto.
