  to: 'É um estatuto eterno para todas as suas gerações, ano após ano. Não há limite de dias para isso, pois foi estabelecido para sempre para Israel: eles devem celebrá-lo, habitar em cabanas, usar coroas na cabeça e tomar ramos frondosos e salgueiros.'
