base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/030.yaml
  text: It is an everlasting statute throughout their generations, year by year. And there is no limit of days for this, for it is ordained forever for Israel, that they should celebrate it and dwell in booths and wear crowns on their heads and take leafy branches and willows.
translation:
  language: pt
  text: 'É um estatuto eterno para todas as suas gerações, ano após ano. Não há limite de dias para isso, pois foi estabelecido para sempre para Israel: eles devem celebrá-lo, habitar em cabanas, usar coroas na cabeça e tomar ramos frondosos e salgueiros.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገ፡ ዘለዓለም
  choice: estatuto eterno
  rationale: Reproduz a ideia de uma determinação normativa de duração permanente, em linguagem bíblica clara e corrente.
- source_word: በኵሉ፡ ዓመት፡ ወዓመት
  choice: ano após ano
  rationale: Expressa naturalmente a recorrência anual indicada pela formulação etíope.
- source_word: ይግበርዎ
  choice: celebrá-lo
  rationale: Embora o verbo seja literalmente 'fazê-lo', o objeto implícito é a observância da festa; 'celebrá-lo' torna a referência compreensível sem acrescentar um rito novo.
- source_word: ምጽላል
  choice: cabanas
  rationale: Designa abrigos temporários ou cabanas, conforme o contexto da festa.
- source_word: አክሊላተ
  choice: coroas
  rationale: Mantém o sentido concreto de coroas ou grinaldas usadas na cabeça.
- source_word: ዐጽቀ፡ ቈጽል
  choice: ramos frondosos
  rationale: Comunica a imagem de ramos com folhas em português natural.
- source_word: ውኩሓ
  choice: salgueiros
  rationale: Traduz o termo como 'salgueiros' sem acrescentar 'do ribeiro', expressão ausente do texto ge'ez fornecido.
theological_decisions:
- issue: Força normativa e duração da observância
  choice: foi estabelecido para sempre sobre Israel
  alternative: é ordenado eternamente a Israel
  rationale: Preserva tanto a instituição divina permanente quanto sua aplicação a Israel, sem ampliar ou restringir teologicamente o alcance indicado pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura conserva o caráter normativo e a sequência ritual do original, evitando a harmonização com Levítico 23:40 ('do ribeiro'), que não aparece no ge'ez fornecido.
