  text: and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.
translation:
  language: pt
  text: E habitou entre Cades e Sur, nas montanhas de Gerar. Em meados do quinto mês, partiu dali e habitou junto ao Poço do Juramento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O “Poço do Juramento” é tradicionalmente identificado com Berseba.
    reason: Ajuda o leitor a reconhecer o topônimo tradicional sem apagamento do significado expresso no texto.
lexical_decisions:
- source_word: ኀደረ
  choice: habitou
  rationale: Expressa de modo natural o sentido de permanecer ou fixar residência, preservando a repetição significativa da ação.
- source_word: ማእከለ
  choice: entre
  rationale: É a correspondência direta e idiomática para a localização entre Cades e Sur.
- source_word: ውስተ፡ አደባረ፡ ጌራሮን
  choice: nas montanhas de Gerar
  rationale: Mantém o plural e a referência geográfica do texto ge'ez sem transformar a região em uma única montanha.
- source_word: በመንፈቀ፡ ወርኅ፡ ኃምስ
  choice: em meados do quinto mês
  rationale: Reproduz naturalmente a ideia literal de metade ou meio do quinto mês.
- source_word: Well of the Oath (audited consultation layer)
  choice: Poço do Juramento
  rationale: Preserva o sentido transparente do topônimo em vez de substituí-lo silenciosamente pela forma tradicional Berseba.
