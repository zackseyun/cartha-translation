  text: He overthrew it. And he and his daughters also committed sin upon the earth, such as had not been on the earth.
translation:
  language: pt
  text: Ele a derrubou. E ele e suas filhas também cometeram na terra um pecado como nunca antes havia ocorrido na terra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E ele também cometeu pecado na terra, junto com suas filhas, como nunca antes havia ocorrido na terra”.'
    reason: Registra a possibilidade de uma coordenação mais estritamente formal da oração, em português idiomático.
lexical_decisions:
- source_word: ገፍታአ
  choice: Ele a derrubou
  rationale: Preserva o verbo inicial, ausente em uma versão anterior, e o objeto pronominal feminino retomado do contexto precedente.
- source_word: ገብረ ... ኀጢአተ
  choice: cometeram pecado
  rationale: Reproduz de modo natural a expressão sem suavizar seu juízo moral.
- source_word: ዘአኮ ዲበ ምድር
  choice: como nunca antes havia ocorrido sobre a terra
  rationale: Expressa a ideia de algo sem precedente na terra em português corrente e digno.
theological_decisions:
- issue: Referente do pronome e sujeitos da segunda oração
  choice: Ele a derrubou. E ele e suas filhas também cometeram pecado
  alternative: Ele a destruiu. E ele também cometeu pecado, e suas filhas, sobre a terra
  rationale: A tradução mantém a sequência e a coordenação do ge'ez sem identificar explicitamente os referentes, que dependem do contexto. A alternativa mais literal da coordenação é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Mantém a repetição de “sobre a terra” por corresponder à ênfase do texto-fonte; “a” conserva sem explicitação o referente feminino do contexto anterior.
