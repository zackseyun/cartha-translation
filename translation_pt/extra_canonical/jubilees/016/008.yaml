review_pass:
  verdict: revise
  source_fidelity: 'O texto traduz adequadamente as duas afirmações principais: o primeiro verbo, «ele a derrubou», e o pecado cometido pelo homem e por suas filhas, sem precedente na terra. Porém, «como nunca antes havia ocorrido» fica sintaticamente solto e pode fazer o leitor entender que o ocorrido em geral, e não especificamente o pecado, é que não tinha precedente.'
  naturalness: A redação é clara e de registro apropriado. A explicitação de «um pecado» antes da oração comparativa torna a construção mais idiomática e liga sem ambiguidade «como nunca antes...» ao pecado. «Na terra» é mais natural em português nesse contexto do que «sobre a terra», preservando o sentido da expressão repetida no original.
  terminology: «Cometeram pecado» preserva corretamente o juízo moral do texto. «Derrubou-a» mantém a imagem verbal de «overthrew» e o pronome feminino contextual, sem identificar o referente além do que o texto permite.
  issues:
  - severity: low
    issue: A oração comparativa não está ligada explicitamente a «pecado».
    rationale: Em português, «cometeram pecado ..., como nunca antes havia ocorrido» é compreensível, mas «um pecado como nunca antes havia ocorrido» reproduz de modo mais preciso a qualificação de excepcionalidade presente no texto-fonte.
  - severity: low
    issue: A nota alternativa apresenta uma coordenação pouco natural em português.
    rationale: «E ele também cometeu pecado, e suas filhas» não constitui uma alternativa portuguesa fluente. A possibilidade sintática pode ser registrada sem sacrificar a clareza.
  revised_text: Ele a derrubou. E ele e suas filhas também cometeram na terra um pecado como nunca antes havia ocorrido na terra.[a]
