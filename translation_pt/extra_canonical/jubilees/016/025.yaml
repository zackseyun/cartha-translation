  text: And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.
translation:
  language: pt
  text: E celebrou essa festa durante sete dias, alegrando-se de todo o coração e com toda a sua alma, ele e todos os que estavam em sua casa. Não havia com ele nenhum estrangeiro nem pessoa incircuncisa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ዘንተ፡ በዓለ
  choice: celebrou essa festa
  rationale: A expressão significa literalmente “fez esta festa”; “celebrou” transmite em português atual o sentido idiomático do ato festivo sem perder a referência cultual.
- source_word: በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ
  choice: de todo o coração e com toda a sua alma
  rationale: Conserva o paralelismo e a abrangência das duas expressões do texto etíope em linguagem portuguesa natural e solene.
- source_word: እለ፡ ውስተ፡ ቤቱ
  choice: os que estavam em sua casa
  rationale: Mantém o sentido doméstico e coletivo da formulação, sem restringi-la indevidamente a parentes consanguíneos.
- source_word: foreign terminology preserved in the audited consultation layer
  choice: estrangeiro ... pessoa incircuncisa
  rationale: A porção final não está integralmente visível no excerto ge'ez fornecido; a redação segue a camada inglesa auditada e preserva as duas categorias distintas, sem fundi-las.
theological_decisions:
- issue: Relação entre estrangeiro e incircunciso
  choice: nenhum estrangeiro nem pessoa incircuncisa
  alternative: nenhum estrangeiro incircunciso
  rationale: A coordenação preservada pela camada de consulta apresenta duas categorias paralelas; a tradução evita transformá-las numa única categoria e não resolve a possível sobreposição entre elas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Celebrou” foi preferido ao literalismo pouco natural “fez”, e “pessoa incircuncisa” evita tratar o adjetivo substantivado como rótulo desumanizante. A pontuação divide o longo período para facilitar a leitura sem alterar sua progressão.
