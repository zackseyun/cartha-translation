  yaml_path: translation/extra_canonical/jubilees/016/029.yaml
  text: Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths for seven days with joy in the seventh month, acceptable before the Lord.
translation:
  language: pt
  text: Por isso, foi ordenado nas tábuas celestiais a respeito de Israel que celebrassem com alegria a Festa das Tendas por sete dias, no sétimo mês, aceitável diante do Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: foi estabelecido
  rationale: Expressa a ideia de algo ordenado ou instituído, preservando o tom normativo sem tornar explícito um agente que o texto não nomeia.
- source_word: ጽላተ ሰማይ
  choice: tábuas celestiais
  rationale: Tradução direta da expressão etíope, conservando a imagem característica do livro.
- source_word: ይኩኑ ገበርያኮ በዓለ
  choice: que celebrassem ... a Festa
  rationale: A construção idiomática indica realizar ou observar uma festa; “celebrassem” é natural em português e adequado ao contexto festivo.
- source_word: መጸለት
  choice: Tendas
  rationale: Designa abrigos ou cabanas usados na festa; “Festa das Tendas” é claro, digno e amplamente compreensível.
- source_word: ዘይትወከፍ
  choice: aceita
  rationale: Mantém a noção de ser recebida favoravelmente, e o feminino singular permite relacioná-la à Festa das Tendas, como sugere a forma da expressão.
theological_decisions:
- issue: O que é “aceito diante do Senhor”
  choice: A formulação liga “aceita” à Festa das Tendas.
  alternative: Entender que a celebração de Israel, ou os próprios celebrantes, seriam aceitos diante do Senhor.
  rationale: A concordância e a posição da expressão favorecem a festa como referente, mas a tradução evita desenvolver uma explicação teológica além do que o texto afirma.
translation_notes:
  register: 'Português moderno, corrente e solene, com boa legibilidade brasileira. A ordem foi ajustada para fluência, mantendo todos os elementos do texto: instituição nas tábuas celestiais, referência a Israel, duração de sete dias, alegria, sétimo mês e aceitação diante do Senhor.'
