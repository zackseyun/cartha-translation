lexical_decisions:
- source_word: ፈርት
  choice: teve medo
  rationale: Reproduz de modo natural o sentido do verbo ge'ez no contexto narrativo.
- source_word: ሐሰወት
  choice: negou
  rationale: No contexto da reação de Sara, o verbo expressa negação do fato de ela ter rido.
- source_word: ቃል
  choice: palavra
  rationale: Mantém a amplitude semântica do termo, sem especificar indevidamente se se trata de declaração, promessa ou anúncio.
- source_word: ሥሩዕ
  choice: determinado
  rationale: Comunica algo previamente estabelecido ou ordenado, preservando a formulação passiva do texto.
theological_decisions:
- issue: Identidade do sujeito plural em “nós lhe dissemos”
  choice: Preservar a primeira pessoa do plural sem identificar seus referentes
  alternative: Explicitar “os anjos lhe disseram” ou outro sujeito
  rationale: O versículo usa a primeira pessoa do plural, e a identificação explícita dependeria do contexto ou de interpretação.
- issue: Sentido de “por causa da palavra”
  choice: Manter a expressão aberta
  alternative: Traduzir como “por causa do que fora dito” ou “a respeito da promessa”
  rationale: “Palavra” preserva a ambiguidade do substantivo ge'ez e evita resolver sua referência teológica.
