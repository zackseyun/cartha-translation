  yaml_path: translation/extra_canonical/jubilees/016/013.yaml
  text: And he did to Sarah as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham; on the feast of the firstfruits of the harvest, he was born.
translation:
  language: pt
  text: E ele fez a Sara conforme havia dito. Ela concebeu e deu à luz um filho no terceiro mês, no meio do mês, no tempo que o Senhor havia indicado a Abraão; ele nasceu na festa das primícias da colheita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለሳራ
  choice: a Sara
  rationale: Mantém explícito o nome de Sara, presente no texto ge'ez, em vez de substituí-lo por pronome.
- source_word: በወርኅ፡ ሣልስ፡ ወበመንፈቀ፡ ወርኅ
  choice: no terceiro mês, no meio do mês
  rationale: Reproduz diretamente as duas indicações temporais do original, sem identificar o mês com um calendário posterior.
- source_word: በበዓለ፡ ቀዳሜ፡ ማእረር
  choice: na Festa das Primícias da Colheita
  rationale: Expressa de modo natural a festa ligada aos primeiros frutos da colheita; as maiúsculas indicam uma celebração determinada.
- source_word: ተወልደ
  choice: ele nasceu
  rationale: O verbo está na terceira pessoa masculina singular e não traz explicitamente o nome Isaque; o pronome retoma o filho mencionado na oração anterior.
theological_decisions:
- issue: Identidade do sujeito em “ele nasceu”
  choice: Preservar o pronome implícito como “ele”, sem inserir o nome Isaque
  alternative: “Isaque nasceu”
  rationale: Embora o contexto identifique o filho como Isaque, o texto ge'ez deste versículo não registra o nome; não se deve tornar explícito o que o original deixa contextual.
- issue: Agente da promessa cumprida na frase inicial
  choice: “E ele fez a Sara conforme havia dito”
  alternative: Explicitar “O Senhor fez a Sara”
  rationale: O original emprega a terceira pessoa sem repetir o nome divino nessa oração. A tradução conserva essa coesão referencial e evita uma explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e acessível, com construção próxima ao original. Conservou-se a repetição de “mês” e a referência pronominal final. “Festa das Primícias da Colheita” foi usada como designação clara da celebração, sem impor uma identificação denominacional ou calendário específico.
