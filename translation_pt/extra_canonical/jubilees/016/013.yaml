revisions:
- from: E ele fez a Sara conforme havia dito. Ela concebeu e deu à luz um filho no terceiro mês, no meio do mês, no tempo do qual o Senhor havia falado a Abraão; ele nasceu na Festa das Primícias da Colheita.
  to: E ele fez a Sara conforme havia dito. Ela concebeu e deu à luz um filho no terceiro mês, no meio do mês, no tempo que o Senhor havia indicado a Abraão; ele nasceu na festa das primícias da colheita.
  rationale: A revisão substitui uma relativa pouco natural e semanticamente imprecisa por uma formulação que expressa que o Senhor indicara o tempo a Abraão. Também normaliza a capitalização da designação festiva. Mantêm-se o sujeito não explicitado na abertura e o pronome final, sem acrescentar o nome Isaque ausente neste versículo.
