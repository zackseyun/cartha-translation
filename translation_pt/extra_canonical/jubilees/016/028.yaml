  yaml_path: translation/extra_canonical/jubilees/016/028.yaml
  text: And both of them had very great joy. And he built there an altar to the Lord, who had blessed him and who had made him rejoice in the land of his sojourning. And he made a feast of joy in this month for seven days.
translation:
  language: pt
  text: E ambos tiveram uma alegria muito grande. Ele construiu ali um altar ao Senhor, que o havia abençoado e o havia feito alegrar-se na terra de sua peregrinação. E, naquele mês, celebrou durante sete dias uma festa de alegria.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሓ
  choice: alegria
  rationale: Mantém o sentido reiterado de júbilo ou regozijo no versículo e soa natural em português atual.
- source_word: ምሥዋዐ
  choice: altar
  rationale: Equivalente direto e tradicional para o lugar de sacrifício ou oferenda.
- source_word: እግዚአብሔር
  choice: Senhor
  rationale: Forma portuguesa consagrada para o título divino presente no texto.
- source_word: ምድረ፡ ፍልሰቱ
  choice: terra de sua peregrinação
  rationale: Preserva a ideia de residência transitória ou condição de forasteiro sem restringi-la indevidamente a mera viagem.
- source_word: ገብረ፡ በዓለ፡ ፍሥሓ
  choice: celebrou ... uma festa de alegria
  rationale: Traduz idiomaticamente a construção ‘fez uma festa de alegria’, conservando tanto o ato celebrativo quanto seu caráter jubiloso.
- source_word: ሰቡዐ፡ መዋዕለ
  choice: durante sete dias
  rationale: Expressa de modo claro e natural a duração indicada no ge'ez.
theological_decisions:
- issue: Identidade do sujeito de ‘abençoou’ e ‘fez alegrar-se’
  choice: Tratar o Senhor como antecedente das duas orações relativas
  alternative: Ler uma ou ambas as ações com outro antecedente implícito
  rationale: A sequência gramatical liga naturalmente as duas ações ao Senhor, sem exigir complementação doutrinária.
- issue: Sentido de ‘peregrinação’
  choice: Conservar a condição de permanência estrangeira ou transitória
  alternative: Traduzir apenas como ‘terra onde morava’
  rationale: ‘Peregrinação’ preserva a tensão do termo fonte entre residência efetiva e não pertencimento pleno.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de ‘alegria’ foi preservada por refletir a recorrência lexical do ge'ez; a segunda frase conserva a estrutura relativa, enquanto a última foi levemente reorganizada para fluência.
