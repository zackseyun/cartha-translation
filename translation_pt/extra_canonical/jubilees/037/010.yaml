base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/010.yaml
  text: And there came to them from Moab and from the sons of Ammon one thousand chosen men who were hired; and from Philistia one thousand chosen men fit for war; and from Edom and from the Horites one thousand chosen men trained for battle; and from the Kittim strong men fit for war.
translation:
  language: pt
  text: Homens fortes, guerreiros escolhidos. E vieram até eles, de Moabe e dos filhos de Amom, mil homens escolhidos que foram contratados; da Filístia, mil homens escolhidos, aptos para a guerra; de Edom e dos horeus, mil homens escolhidos, treinados para a batalha; e de Quitim, homens fortes, aptos para a guerra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያነ
  choice: homens escolhidos
  rationale: Reproduz o sentido de pessoas selecionadas para a força militar e mantém a repetição enfática do texto.
- source_word: ተዐሰቡ
  choice: haviam sido contratados
  rationale: Expressa o caráter passivo e a anterioridade contextual do recrutamento remunerado sem acrescentar quem os contratou.
- source_word: መስተቃትላነ
  choice: aptos para a guerra
  rationale: Formulação natural em português para combatentes capacitados ou adequados à guerra; preserva a distinção em relação ao termo seguinte.
- source_word: መስተባእሳነ
  choice: treinados para a batalha
  rationale: Comunica preparação para combater e evita reduzir o termo à ideia não explicitada de experiência prolongada.
- source_word: ኬጢዎን
  choice: Quitim
  rationale: Transliteração bíblica portuguesa tradicional do nome étnico/geográfico Kittim.
- source_word: ዕደወ
  choice: homens fortes
  rationale: No contexto militar, verte a ideia de força ou vigor, em concordância com a leitura adotada pela camada de consulta.
