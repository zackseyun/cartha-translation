base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/013.yaml
  text: He went in front to lead them to Jacob his brother. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob all his days.
translation:
  language: pt
  text: 'Ele foi à frente para conduzi-los até seu irmão Jacó. Então se lembrou de todo o mal que estivera escondido em seu coração contra seu irmão Jacó e não se lembrou do juramento que havia jurado a seu pai e a sua mãe: durante toda a vida, não procuraria fazer mal algum a Jacó.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሖር፡ ቅድመ፡ ይምርሖሙ
  choice: Ele foi à frente para conduzi-los
  rationale: Reproduz tanto o movimento à frente quanto sua finalidade explícita, sem omitir a oração inicial do texto ge'ez.
- source_word: ተዘከረ
  choice: se lembrou
  rationale: Mantém o contraste verbal direto com ኢተዘከረ, “não se lembrou”, na oração seguinte.
- source_word: ኵሎ፡ እኩየ
  choice: todo o mal / mal algum
  rationale: No primeiro contexto, a expressão designa a totalidade do mal guardado no coração; sob negação, o português idiomático pede “mal algum”.
- source_word: ኅብእተ፡ ላዕለ፡ ያዕቆብ፡ እኁሁ
  choice: escondido em seu coração contra seu irmão Jacó
  rationale: Preserva a imagem do mal oculto interiormente e sua direção contra Jacó, identificado aqui como irmão.
- source_word: ኢይትኃሠሥ
  choice: não procuraria fazer
  rationale: Expressa o sentido volitivo de “não buscar/procurar” de modo natural em português diante de “mal algum”.
- source_word: ኵሎ፡ መዋዕሊሁ
  choice: durante toda a vida
  rationale: Equivalente idiomático de “todos os seus dias”, indicando a totalidade da vida.
theological_decisions:
- issue: Natureza do mal escondido no coração
  choice: “todo o mal que estivera escondido em seu coração”
  alternative: “todas as más intenções que ele ocultara no coração”
  rationale: A formulação escolhida conserva a expressão concreta e abrangente do ge'ez, sem restringi-la interpretativamente a planos ou intenções.
- issue: Referência final a Jacó
  choice: “a Jacó”
  alternative: “a seu irmão Jacó”
  rationale: A ocorrência final do ge'ez traz apenas o nome Jacó, sem repetir “seu irmão”; a tradução respeita essa diferença.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez brasileira e compreensão internacional. O paralelismo entre “se lembrou” e “não se lembrou” foi preservado, assim como a tensão moral entre o mal interior e o juramento esquecido.
