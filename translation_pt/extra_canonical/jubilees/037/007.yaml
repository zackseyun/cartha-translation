lexical_decisions:
- source_word: ኢትሖሩ
  choice: Não vão
  rationale: Reproduz diretamente a proibição de ir, em português natural e atual.
- source_word: ኢትግበሩ፡ ምስሌሁ፡ ፀብአ
  choice: nem façam guerra contra ele
  rationale: A construção expressa fazer guerra com/contra alguém; “contra ele” é a formulação idiomática em português, sem acrescentar conteúdo.
- source_word: ከመ፡ ኢትደቁ
  choice: para que não caiam
  rationale: Mantém a finalidade ou consequência temida da construção, preservando a concisão e sem especificar o sentido da queda.
theological_decisions:
- issue: Sentido de “cair”
  choice: Mantido sem explicação
  alternative: “ser derrotados” ou “morrer”
  rationale: O verbo pode evocar derrota ou morte no contexto bélico, mas o texto diz literalmente “cair”; explicitar uma dessas possibilidades resolveria uma ambiguidade genuína.
