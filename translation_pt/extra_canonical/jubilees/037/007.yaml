  register: Português moderno, digno e amplamente compreensível, com concordância brasileira natural. O elemento inicial ኃይለ parece ser remanescente do contexto anterior na segmentação da edição e não foi incorporado ao versículo, em consonância com a delimitação validada e com a camada inglesa auditada.
