translation_notes:
  register: Português contemporâneo, claro e digno, com coordenação retórica adequada a uma fala de convocação militar. As formas “Arã”, “Moabe” e “Amom” seguem grafias bíblicas correntes; “Filístia” designa o território filisteu. As reticências iniciais preservam o fato de que o versículo começa no meio de uma frase vinda do contexto anterior.
