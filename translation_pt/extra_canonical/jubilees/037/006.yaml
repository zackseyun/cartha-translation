base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/006.yaml
  text: 'with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us choose for ourselves select men, eager for battle, and let us go against him and fight with him and uproot him from the land before he grows strong."'
translation:
  language: pt
  text: '“... conosco, também faremos mal a você. Agora, ouça-nos: enviemos a Arã, à Filístia, a Moabe e a Amom; escolhamos para nós homens escolhidos, ávidos de combate; vamos contra ele, lutemos com ele e o arrancaremos pela raiz da terra antes que se fortaleça.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወንፈኑ
  choice: enviemos mensageiros
  rationale: O verbo significa “enviar”. Em português, explicitar o objeto implícito “mensageiros” torna natural o envio dirigido a diversos povos sem alterar a ação central.
- source_word: ኅሩያነ፡ ሰብአ
  choice: homens de elite
  rationale: Reproduz a ideia de homens escolhidos ou selecionados, evitando a repetição pouco natural de “escolhamos homens escolhidos”.
- source_word: እለ፡ ይዳበጉ፡ ውስተ፡ ቀትል
  choice: ávidos por lutar
  rationale: Expressa homens que se lançam com ímpeto ao combate; “lutar” é mais natural no contexto do que uma formulação literal ligada a matar.
- source_word: ወንሠርዎ፡ እምድር
  choice: e o arrancaremos pela raiz da terra
  rationale: Preserva a metáfora vigorosa do verbo associado a desarraigar, em vez de reduzi-la a “eliminar”.
- source_word: እንበለ፡ የአዝዝ
  choice: antes que se fortaleça
  rationale: Comunica a ação preventiva antes que o adversário se torne forte ou poderoso.
