base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/002.yaml
  text: Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they contended with their father, saying, "Why, did he give the rights of the firstborn to Jacob, who is younger, while you are the elder, and leave you aside?"
translation:
  language: pt
  text: 'Isaque havia dado o direito de primogenitura a Jacó, seu filho mais novo, e eles ficaram extremamente irados. Então discutiram com o pai, dizendo: “Por que ele deu o direito de primogenitura a Jacó, que é mais novo, embora você seja o mais velho, e deixou você de lado?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቃነ
  choice: direito de primogenitura
  rationale: O termo denota a precedência ou condição do primogênito no contexto da transmissão feita por Isaque; a expressão portuguesa comunica naturalmente o direito familiar em questão.
- source_word: ዘይንእስ
  choice: mais novo
  rationale: Expressa a comparação etária entre Jacó e Esaú sem acrescentar uma interpretação teológica.
- source_word: ተምዑ፡ ፈድፋደ
  choice: ficaram extremamente irados
  rationale: Reproduz a intensidade marcada pelo advérbio sem recorrer a uma formulação arcaica.
- source_word: ተጋአዙ
  choice: contestaram
  rationale: Comunica a ideia de entrar em disputa ou contenda verbal com o pai, em português atual e digno.
- source_word: ዘትልህቅ
  choice: seja o mais velho
  rationale: Mantém a comparação explícita que identifica o interlocutor, Esaú, como mais velho que Jacó.
theological_decisions:
- issue: Identidade dos referentes na pergunta dos filhos
  choice: “ele” refere-se a Isaque e “você” refere-se a Esaú
  alternative: 'Entender a fala como dirigida a Isaque: “enquanto estávamos presentes, por que você deu... e nos deixou de lado?”'
  rationale: A construção ge’ez እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ aponta para o interlocutor singular como aquele que é mais velho; no contexto narrativo, os filhos falam com o pai, Esaú, a respeito do ato de Isaque.
- issue: Natureza do que Isaque concedeu a Jacó
  choice: direito de primogenitura
  alternative: primazia ou condição de mais velho
  rationale: A opção escolhida torna claro o sentido jurídico-familiar do ato sem especificar benefícios além dos afirmados no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. Emprega-se “você” para distinguir naturalmente o interlocutor singular dos demais referentes; a sequência pronominal conserva o sentido contextual do ge’ez.
