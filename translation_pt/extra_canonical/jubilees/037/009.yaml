- source_word: ኢንሰምዕ፡ ንሕነሰ፡ ዘንተ፡ ነገረ።
  choice: Nós não daremos ouvidos a essa palavra
  rationale: “Dar ouvidos” expressa adequadamente o sentido de ouvir com disposição para obedecer; “palavra” preserva a amplitude de ነገር, que pode indicar palavra, declaração ou assunto.
- source_word: ወፈነዉ፡
  choice: Então enviaram mensageiros
  rationale: O verbo significa “enviaram”; o objeto implícito é explicitado como “mensageiros” para tornar natural em português o envio dirigido a pessoas, sem alterar a ação narrativa.
- source_word: ፲፻ መስተባእሳነ፡
  choice: mil guerreiros para a batalha
  rationale: Reproduz o número e o caráter militar da expressão sem acrescentar ideias como experiência ou seleção que não estão no texto.
