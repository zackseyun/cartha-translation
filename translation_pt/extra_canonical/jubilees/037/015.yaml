base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/015.yaml
  text: Then Judah said to Jacob his father, saying to him, "Bend your bow, father, and send out your arrows and strike down the enemy and kill the adversary; and may you have strength, for we will not kill your brother, because he is such, and because he is your kinsman we will give him honor." Then Jacob bent his bow and sent forth an arrow and struck Esau his brother on his right breast and killed him. And again he sent an arrow and struck Adoran the Aramean on the left breast and drove him back and killed him. Then the sons of Jacob and their slaves went out from the four sides of the tower. And Judah went out first, and Naphtali and Gad with him, and fifty slaves with him, on the south side of the tower, and they killed all whom they found before them, and not one of them escaped. And Levi and Dan and Asher went out on the east side of the tower, and fifty men with them, and they killed the warriors of Moab and Ammon. And Reuben and Issachar and Zebulun went out on the north side of
    the tower, and fifty men with them, and they killed the fighters of Philistia. And Simeon and Benjamin and Enoch the son of Reuben went out on the west side of the tower, and fifty men with them, and they killed of Edom and of the Horites four hundred strong and warlike men. And six hundred fled, and four of Esau’s sons fled with them, and they left their father lying slain, as he had fallen on the hill that is in Adurim. And the sons of Jacob pursued after them as far as Mount Seir. But Jacob buried his brother in the hill that is in Adurim, and he returned to his house, and they comforted him there.
translation:
  language: pt
  text: '[15] Então Judá disse a Jacó, seu pai: “Curve o seu arco, meu pai, dispare as suas flechas, derrube o inimigo e mate o adversário. Que você tenha força, pois nós não mataremos seu irmão. Visto que ele é seu parente, nós lhe concederemos essa honra.” Então Jacó curvou o arco, disparou uma flecha, atingiu seu irmão Esaú no lado direito do peito e o matou. Disparou outra flecha, atingiu Adorã, o arameu, no lado esquerdo do peito, o fez recuar e o matou.


    Então os filhos de Jacó e seus escravos saíram pelos quatro lados da torre. Judá saiu primeiro, acompanhado de Naftali, Gade e cinquenta escravos, pelo lado sul da torre. Eles mataram todos os que encontraram pela frente, e nenhum deles escapou. Levi, Dã e Aser saíram pelo lado leste da torre, acompanhados de cinquenta homens, e mataram os guerreiros de Moabe e Amom. Rúben, Issacar e Zebulom saíram pelo lado norte da torre, acompanhados de cinquenta homens, e mataram os combatentes da Filístia. Simeão, Benjamim e Enoque, filho de Rúben, saíram pelo lado oeste da torre, acompanhados de cinquenta homens, e mataram quatrocentos homens fortes e aguerridos dentre os edomitas e os horeus.


    Seiscentos fugiram, e quatro dos filhos de Esaú fugiram com eles. Deixaram seu pai morto, caído no monte que fica em Adurim. Os filhos de Jacó os perseguiram até o monte Seir. Jacó, porém, sepultou seu irmão no monte que fica em Adurim, voltou para casa, e ali o consolaram.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: Na fonte de trabalho, esta seção aparece sob o número 38, embora dê continuidade à mesma unidade narrativa; aqui ela é apresentada como Jubileus 37:15.
    reason: segmentation_note
  - marker: a
    text: 'Ou: “e ali os alimentaram”.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: አግብርቲሆሙ
  choice: seus escravos
  rationale: O termo designa pessoas em condição de servidão e, no contexto, pertencentes às casas dos filhos de Jacó; “escravos” conserva sem eufemismo a linguagem social do texto.
- source_word: ማኅፈድ
  choice: torre
  rationale: A narrativa descreve quatro lados e saídas defensivas; “torre” segue o sentido contextual adotado pela tradição textual, em linguagem clara.
- source_word: ጥቦ የማናዊ / ጥቦ ፀጋማዊ
  choice: lado direito do peito / lado esquerdo do peito
  rationale: A formulação portuguesa explicita naturalmente a lateralidade sem perder a referência anatômica do ge’ez.
- source_word: መስተቃትላነ / መስተባእሳነ
  choice: guerreiros; combatentes; homens fortes e aguerridos
  rationale: Os termos descrevem homens aptos ou experimentados em combate; as escolhas evitam repetição excessiva e preservam o caráter militar.
- source_word: ወመገብዎሙ
  choice: e ali o consolaram
  rationale: Adota a leitura narrativa tradicional refletida na camada de consulta, mas registra em nota a possibilidade lexical mais literal, “alimentaram”.
theological_decisions:
