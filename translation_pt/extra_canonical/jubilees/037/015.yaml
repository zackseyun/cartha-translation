revisions:
- from: '[15] Então Judá disse a Jacó, seu pai: “Curve o seu arco, meu pai, dispare as suas flechas, derrube o inimigo e mate o adversário. Que a força esteja com você, pois nós não mataremos seu irmão. Visto que ele é seu parente, nós lhe concederemos essa honra.” Então Jacó curvou o arco, disparou uma flecha, atingiu seu irmão Esaú no lado direito do peito e o matou. Disparou outra flecha, atingiu Adorã, o arameu, no lado esquerdo do peito, fez que recuasse e o matou.


    Então os filhos de Jacó e seus escravos saíram pelos quatro lados da torre. Judá saiu primeiro, acompanhado de Naftali, Gade e cinquenta escravos, pelo lado sul da torre. Eles mataram todos os que encontraram pela frente, e nenhum deles escapou. Levi, Dã e Aser saíram pelo lado leste da torre, acompanhados de cinquenta homens, e mataram os guerreiros de Moabe e Amom. Rúben, Issacar e Zebulom saíram pelo lado norte da torre, acompanhados de cinquenta homens, e mataram os combatentes da Filístia. Simeão, Benjamim e Enoque, filho de Rúben, saíram pelo lado oeste da torre, acompanhados de cinquenta homens, e mataram quatrocentos homens fortes e aguerridos dentre os edomitas e os horeus.


    Seiscentos fugiram, e quatro dos filhos de Esaú fugiram com eles. Deixaram seu pai morto, caído no monte que fica em Adurim. Os filhos de Jacó os perseguiram até o monte Seir. Jacó, porém, sepultou seu irmão no monte que fica em Adurim, voltou para casa, e ali o consolaram.[a]'
