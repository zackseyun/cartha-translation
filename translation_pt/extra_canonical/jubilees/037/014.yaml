  text: 'Throughout all this[14], Jacob did not know that they were coming against him to kill him. And he was mourning for Leah his wife until they came near to the tower with four thousand men, warriors and chosen fighters. And they sent to him honorable men, saying, "Behold, your brother has come against you to fight you, with four hundred men girded with the sword, and they carry shields and weapons of war." For they loved Jacob more than Esau, and they told him that Jacob was a gracious and merciful man, more than Esau. Then Jacob was alarmed when they came near to the tower, and he shut the gates of the tower and stood on the battlements and spoke with his brother Esau and said, "The comfort for which you have come is a fine comfort, to comfort me concerning my wife who has died. Is this the oath that you swore to your father and your mother? Again, before they have died, you have broken the oath, and at the moment you swore to your father you were condemned." And at that time Esau
    answered and said to him, "There is no righteous oath for the sons of men, nor for the beasts of the earth; for whatever they swear, they scheme one against another with evil[14], so that each may kill his enemy and foe. And you hate me and my children forever, and there is no observing brotherhood with you. Hear this word that I declare to you: if the boar can change its skin and its bristles become soft like wool, or if horns grow on its head like the horns of a stag or a sheep, then I will keep brotherhood with you. And if the breasts separated from their mother should return and suckle again, then I will be reconciled to you as a brother. And if wolves make peace with lambs so as not to devour or oppress them, and if their hearts are good toward them, then there will be peace in my heart toward you. And if the lion becomes the friend of the ox and is bound together with it under one yoke and plows with it and makes peace with it, then I will make peace with you. And when the raven
    becomes white like the raza-bird, then I will know that I have loved you and will make peace with you. Be destroyed, and may your sons be destroyed, and let there be no peace for you." And when Jacob saw that he was evil in his heart toward him, and with all his soul intended to kill him, and that he came raging like a wild boar rushing upon the spear that pierces and kills it and does not turn back from it, then he said to his own and to his servants that they should attack him and all his companions.'
translation:
  language: pt
  text: 'Durante tudo isso, Jacó não sabia que eles vinham contra ele para matá-lo. Ele estava de luto por sua esposa Lia até que eles se aproximaram da torre com quatro mil homens, guerreiros e combatentes escolhidos.[a] Então enviaram a Jacó homens respeitáveis, dizendo: “Seu irmão veio contra você para lutar, acompanhado de quatrocentos homens com espadas à cintura, que levam escudos e armas de guerra.” Pois eles amavam Jacó mais do que Esaú e lhe disseram que Jacó era um homem mais bondoso e misericordioso do que Esaú.


    Então Jacó ficou alarmado quando eles se aproximaram da torre. Fechou os portões, postou-se nas ameias e falou com seu irmão Esaú: “Belo consolo é este que você veio me trazer por causa da morte de minha esposa! É este o juramento que você fez a seu pai e a sua mãe? Mais uma vez, antes mesmo que eles morressem, você quebrou o juramento; e, desde o momento em que jurou a seu pai, você já estava condenado.”[b]


    Esaú lhe respondeu: “Não existe juramento justo entre os seres humanos, nem entre os animais da terra; pois, não importa o que jurem, tramam o mal uns contra os outros, procurando cada qual matar seu inimigo e adversário. Você odeia a mim e a meus filhos para sempre, e não há como manter fraternidade com você. Ouça o que lhe declaro: se o javali mudar de pele, e suas cerdas ficarem macias como lã, ou se nascerem chifres em sua cabeça como os chifres do cervo ou da ovelha, então manterei fraternidade com você. Se os seios que se separaram de sua mãe voltarem a mamar, então me reconciliarei com você como irmão. Se os lobos fizerem paz com os cordeiros, sem devorá-los nem oprimi-los, e o coração deles for bondoso para com eles, então haverá paz em meu coração para com você. Se o leão se tornar amigo do boi, for atrelado com ele ao mesmo jugo, lavrar com ele e fizer paz com ele, então farei paz com você. E quando o corvo se tornar branco como a ave raza,[c] então saberei que amo você e farei
    paz com você. Seja destruído, e sejam destruídos os seus filhos! Que não haja paz para você!”


    Quando Jacó viu que Esaú tinha o coração cheio de maldade contra ele, que desejava com toda a alma matá-lo e que vinha furioso como um javali que avança contra a lança que o perfura e mata, sem recuar diante dela, disse aos seus homens e aos seus servos que atacassem Esaú e todos os seus companheiros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge’ez traz “quatro mil” na primeira aproximação, mas os mensageiros mencionam depois “quatrocentos”. A discrepância foi preservada.
    reason: textual_variant
  - marker: b
    text: 'A construção desta frase é difícil. Também pode ser entendida como: “Mais uma vez, antes que eles morressem, você transgrediu o juramento; e, no momento em que jurou a seu pai, foi condenado.”'
    reason: source_ambiguity
  - marker: c
    text: “Raza” translitera um nome de ave de identificação incerta no ge’ez; a comparação indica uma ave notavelmente branca.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፵፻ ብእሲ
  choice: quatro mil homens
  rationale: Preserva o numeral expresso no primeiro relato da aproximação, sem harmonizá-lo com os quatrocentos mencionados depois pelos mensageiros.
- source_word: መስተቃላን፡ ወመስተበአላን፡ ኀሩያን
  choice: guerreiros e combatentes escolhidos
  rationale: Reproduz a descrição militar e o caráter seleto do grupo em português natural.
- source_word: ሰብአ፡ ክቡርን
  choice: homens de honra
  rationale: Mantém a ideia de pessoas honradas ou respeitáveis enviadas como mensageiros.
- source_word: ጸጋዊ፡ ወመሓሪ
  choice: bondoso e misericordioso
  rationale: Expressa as duas qualidades atribuídas a Jacó sem linguagem denominacional.
- source_word: ተደባብ
  choice: ameias
  rationale: No contexto da torre fortificada, designa a parte superior defensiva onde Jacó se posta.
- source_word: ራዛ
  choice: ave raza
  rationale: Translitera o nome zoológico incerto, evitando uma identificação específica sem base segura.
- source_word: መፍለስ
  choice: javali
  rationale: A imagem descreve um suíno selvagem que avança furiosamente contra uma lança.
theological_decisions:
- issue: Validade dos juramentos na fala de Esaú
  choice: “Não existe juramento justo entre os seres humanos, nem entre os animais da terra”
  alternative: “Nenhum juramento permanece válido para sempre”
  rationale: Mantém a formulação extrema e moralmente tensa da personagem, sem convertê-la em princípio doutrinário nem suavizá-la.
- issue: Condenação de Esaú ao jurar
  choice: “desde o momento em que jurou a seu pai, você já estava condenado”
  alternative: “o juramento feito a seu pai o condenará”
  rationale: Preserva a relação temporal e judicial do texto, sem especificar agente ou modalidade de condenação.
- issue: Fraternidade entre Jacó e Esaú
  choice: “manter fraternidade”
  alternative: “agir como irmão”
  rationale: Conserva o tema repetido do vínculo fraterno e sua rejeição, sem acrescentar uma noção jurídica de aliança.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais ao leitor brasileiro. As falas preservam a aspereza retórica do confronto e as imagens proverbiais do original. A discrepância numérica e o nome incerto da ave foram mantidos e explicados em notas.
