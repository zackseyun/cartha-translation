base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/003.yaml
  text: '"Jacob is younger; to Jacob your father gave the birthright, and you he abandoned." And Esau said to them, "For I sold my birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, so that he might eat and bless me, Jacob came by craftiness and brought my father food and drink, and my father blessed him and set me under his hand. And now our father has made us swear, me and him, that we will not seek evil, each against his brother."'
translation:
  language: pt
  text: '“Jacó é o mais novo; a Jacó teu pai deu o direito de primogenitura e a ti abandonou.” E Esaú lhes disse: “Pois[a] vendi a Jacó o meu direito de primogenitura por um pequeno prato de ensopado de lentilhas. E, no dia em que meu pai me mandou caçar e trazer-lhe caça, para que ele comesse e me abençoasse, Jacó veio com astúcia, levou comida e bebida a meu pai, e meu pai o abençoou e me colocou sob a mão de Jacó. Agora nosso pai fez com que jurássemos, eu e ele, que não procuraríamos fazer o mal, um contra o seu irmão.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E Esaú lhes disse: ‘Eu vendi’.”'
    reason: A partícula inicial pode introduzir a fala sem valor causal explícito; nesse caso, «Pois» pode ser omitido.
lexical_decisions:
- source_word: ልህቃነ
  choice: direito de primogenitura
  rationale: Expressa o direito e a posição do primogênito sem a redundância de uma formulação como “primogenitura de primogênito”.
- source_word: በኅዳጥ፡ ጸብሐ፡ ብርስን
  choice: por um pequeno prato de ensopado de lentilhas
  rationale: Conserva tanto a pequenez da porção quanto a identificação do alimento como lentilhas.
- source_word: በተጠብቦት
  choice: com astúcia
  rationale: Mantém a avaliação negativa do modo como Jacó agiu, sem ampliar para uma acusação mais específica como “fraude”.
- source_word: ታሕተ፡ እዴሁ
  choice: sob a mão dele
  rationale: Preserva a imagem concreta de sujeição presente no texto-fonte, em vez de reduzi-la a uma paráfrase abstrata.
- source_word: ኢነትኃሠሥ፡ በእኩይ
  choice: não procuraríamos fazer o mal
  rationale: Reproduz a ideia de buscar ou intentar o mal, com uma construção natural em português.
theological_decisions:
- issue: Relação estabelecida pela bênção paterna
  choice: “me colocou sob a mão dele”
  alternative: “me tornou subordinado a ele”
  rationale: A opção escolhida conserva a metáfora e a tensão narrativa do original sem explicar em termos doutrinários a natureza da sujeição.
- issue: Identificação do agente que veio com astúcia
  choice: “Jacó veio com astúcia”
  alternative: “ele veio com astúcia”
  rationale: O referente é Jacó no contexto; explicitar o nome evita ambiguidade acidental em português sem alterar a atribuição narrativa.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Mantiveram-se a fala direta, a metáfora de sujeição “sob a mão” e a formulação fraterna final, evitando harmonizações ou explicações confessionais.
