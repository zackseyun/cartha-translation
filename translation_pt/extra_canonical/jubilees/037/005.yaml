  text: 'e que permanecêssemos em amor e em paz, cada um com seu irmão, sem corrompermos os nossos caminhos”. Mas eles lhe disseram: “Não vamos dar ouvidos a você; não faremos paz com ele, pois a nossa força é maior que a dele, e nós somos mais fortes que ele. Vá contra ele, e nós o mataremos e destruiremos seus filhos. Mas, se você não for'
