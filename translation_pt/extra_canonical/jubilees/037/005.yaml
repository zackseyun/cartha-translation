lexical_decisions:
- source_word: በተፋቅሮ፡ ወበሰላም
  choice: em amor e em paz
  rationale: Reproduz diretamente o par de substantivos do ge'ez em linguagem portuguesa natural e digna.
- source_word: ብእሲ፡ ምስለ፡ እኁሁ
  choice: cada um com seu irmão
  rationale: Expressa idiomaticamente a construção distributiva literal, 'um homem com seu irmão', sem restringi-la a dois indivíduos específicos.
- source_word: ወኢናማስን፡ ፍኖዊነ
  choice: sem corrompermos os nossos caminhos
  rationale: O verbo indica arruinar ou corromper, e o substantivo está no plural; 'caminhos' também preserva o conhecido sentido moral da imagem bíblica.
- source_word: ለገቢረ፡ ምስሌሁ፡ ሰላመ
  choice: para fazer as pazes com ele
  rationale: Traduz naturalmente a expressão 'fazer paz com ele' no contexto de reconciliação entre partes hostis.
- source_word: ሖውር፡ ላዕሌሁ
  choice: Vá contra ele
  rationale: A construção significa avançar ou subir contra alguém; 'vá contra' conserva o sentido hostil sem introduzir terreno elevado não explicitado pelo contexto.
- source_word: ወናሐጕሎ፡ ውሉዱ
  choice: e destruiremos seus filhos
  rationale: Mantém o valor forte do verbo e o sentido coletivo de 'filhos/descendentes', sem suavizar a ameaça.
