  yaml_path: translation/extra_canonical/jubilees/036/011.yaml
  text: I declare and testify to you, my sons, according to the judgment that will come upon the man who desires to do evil against his brother.
translation:
  language: pt
  text: Eu declaro e testemunho[a] a vocês, meus filhos, em conformidade com o juízo que virá sobre o homem que deseja fazer o mal contra seu irmão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “e faço saber”.'
    reason: O segundo verbo pode ser entendido de modo mais geral como “fazer ouvir” ou “fazer saber”, embora o contexto favoreça a força solene de “testemunhar”.
lexical_decisions:
- source_word: አነግር፡ ወአስምዕ
  choice: declaro e testemunho
  rationale: Preserva os dois verbos coordenados. O segundo, causativo de “ouvir”, pode significar “fazer saber”, mas neste contexto solene comporta a força de “testemunhar”.
- source_word: በከመ፡ ኵነኔ
  choice: em conformidade com o juízo
  rationale: Mantém explicitamente a construção que vincula a declaração ao juízo, sem reduzi-la a uma simples apresentação do conteúdo do juízo.
- source_word: ዘይፈቅድ፡ ይግበር፡ ሕሡመ
  choice: que deseja fazer o mal
  rationale: Reproduz de modo natural a ideia de intenção ou desejo seguido da prática do mal, sem restringir “mal” a mero dano físico.
- source_word: ላዕለ፡ እኁሁ
  choice: contra seu irmão
  rationale: “Contra” expressa em português a ação hostil dirigida ao irmão.
theological_decisions:
- issue: Natureza do pronunciamento de Isaac
  choice: “declaro e testemunho”
  alternative: “declaro e faço saber”
  rationale: A formulação escolhida conserva o tom solene e potencialmente forense ou pactual do segundo verbo, sem acrescentar uma doutrina específica.
- issue: Relação sintática com o juízo
  choice: “em conformidade com o juízo”
  alternative: “o juízo” como objeto direto de “declaro”
  rationale: A fonte contém uma expressão equivalente a “de acordo com”, de modo que o texto não deve ser reformulado como se Isaac apenas anunciasse qual é o juízo.
translation_notes:
  register: Português atual, digno e de ampla compreensão, com legibilidade brasileira. A construção “em conformidade com o juízo” conserva uma relação sintática importante da fonte, apesar de ser mais formal que a fala cotidiana.
