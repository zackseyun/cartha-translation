  text: the man who does righteousness, him and his seed forever.” And he finished commanding them and blessing them, and they ate and drank together before him and rejoiced,
translation:
  language: pt
  text: o homem que pratica a justiça, ele e sua descendência para sempre.” E terminou de lhes dar ordens e de abençoá-los. E comeram e beberam juntos diante dele e se alegraram,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲ
  choice: o homem
  rationale: Equivalente direto e natural do substantivo geês, mantendo a referência individual.
- source_word: ዘይገብር፡ ጽድቀ
  choice: que pratica a justiça
  rationale: Expressa literalmente a ideia de fazer/praticar justiça em português corrente e digno.
- source_word: ዘርኦ
  choice: sua descendência
  rationale: Preserva o sentido coletivo de 'semente' sem sugerir apenas filhos imediatos.
- source_word: ይኤዝዞሙ
  choice: lhes dar ordens
  rationale: Traduz o ato de ordenar ou instruir com força imperativa, conforme o contexto.
- source_word: ይባርኮሙ
  choice: abençoá-los
  rationale: Mantém o valor religioso e relacional do verbo geês.
- source_word: ኅቡረ
  choice: juntos
  rationale: Reproduz de modo idiomático a ação conjunta de comer e beber.
theological_decisions:
- issue: Sentido de 'justiça'
  choice: manter 'pratica a justiça'
  alternative: faz o que é justo
  rationale: A formulação conserva a terminologia teológica do texto sem definir ou restringir o conteúdo da justiça.
- issue: Alcance de 'descendência'
  choice: usar o coletivo 'descendência'
  alternative: semente
  rationale: Evita uma leitura excessivamente literal e pouco natural, preservando a extensão indefinida da linhagem.
