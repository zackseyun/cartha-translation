  yaml_path: translation/extra_canonical/jubilees/036/002.yaml
  text: And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb that I dug for myself there, bury me.
translation:
  language: pt
  text: E sepultem-me perto de Abraão, meu pai, na caverna dupla, no campo de Efrom, o hitita, que Abraão adquiriu como lugar de sepultamento ali. Sepultem-me ali, no túmulo que cavei para mim mesmo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባዐት፡ ዘካዕበት
  choice: caverna dupla
  rationale: Reproduz diretamente a expressão etíope para a caverna caracterizada como dupla, sem substituí-la pelo nome tradicional de Macpela, que não aparece neste texto.
- source_word: ቀሩበ፡ አብርሃም፡ አቡየ
  choice: perto de Abraão, meu pai
  rationale: Mantém a relação espacial e o vínculo familiar expressos no original.
- source_word: አጥረየ
  choice: adquiriu
  rationale: Expressa de modo natural o ato de obter a propriedade, sem especificar além do texto se foi compra ou outra forma de aquisição.
- source_word: ከረይኩ
  choice: cavei
  rationale: Preserva a imagem concreta de escavar ou preparar o próprio túmulo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A repetição do pedido de sepultamento foi preservada por sua força retórica.
