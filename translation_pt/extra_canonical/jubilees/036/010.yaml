  yaml_path: translation/extra_canonical/jubilees/036/010.yaml
  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
translation:
  language: pt
  text: E, no dia de tumulto, maldição, furor e ira, com fogo ardente e devorador, assim como ele queimou Sodoma, também queimará a terra dele, a sua cidade e tudo o que lhe pertence. Ele será apagado do livro da disciplina dos filhos dos homens[a] e não subirá ao livro da vida, mas irá para o que está destinado à destruição; passará para a maldição eterna, para que, por todos os dias, o julgamento deles seja renovado[b] com execração, maldição, ira, tormento, furor, pragas e enfermidade eterna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “livro da disciplina dos filhos dos homens” é textualmente difícil. O ge'ez parece distinguir esse registro do “livro da vida”, mas a natureza exata do primeiro livro é incerta.
    reason: textual_variant
  - marker: b
    text: O texto passa do condenado no singular para “o julgamento deles”. Além disso, a sequência final acumula termos de maldição quase sinônimos; a tradução conserva tanto a mudança de número quanto essa repetição enfática.
    reason: segmentation_note
lexical_decisions:
- source_word: ሁከት
  choice: tumulto
  rationale: Expressa perturbação ou desordem e mantém o tom solene da enumeração.
- source_word: ቍጥዓ፡ ወመዓት
  choice: furor e ira
  rationale: Emprega dois termos distintos para preservar a acumulação de palavras próximas no original.
- source_word: መጽሐፈ፡ ተግሣጸ፡ ውሉደ፡ ሰብእ
  choice: livro da disciplina dos filhos dos homens
  rationale: Segue de perto a construção ge'ez e não identifica esse registro incerto com o livro da vida.
- source_word: ትትሔደስ
  choice: seja renovado
  rationale: Preserva a ideia de renovação ou repetição contínua do julgamento, ausente em uma leitura anterior.
- source_word: ደዌ፡ ዘለዓለም
  choice: enfermidade eterna
  rationale: Mantém o sentido concreto de doença ou enfermidade e o qualificativo temporal forte.
theological_decisions:
- issue: Relação entre o livro da disciplina e o livro da vida
  choice: Tratados como registros distintos
  alternative: Entender o primeiro como outra designação do livro da vida
  rationale: A sintaxe ge'ez os contrapõe; a identidade e a função exatas do primeiro permanecem incertas.
- issue: Mudança do condenado singular para “o julgamento deles”
  choice: Preservar a mudança de número
  alternative: Uniformizar como “o julgamento dele”
  rationale: A evidência textual revista sustenta o plural possessivo; harmonizá-lo eliminaria uma tensão real do texto.
- issue: Destino expresso depois do livro da vida
  choice: “irá para o que está destinado à destruição”
  alternative: Explicitar um “livro da destruição”
  rationale: O texto não nomeia inequivocamente outro livro, por isso a tradução evita acrescentá-lo.
