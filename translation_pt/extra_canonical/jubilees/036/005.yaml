    rationale: “Eu lhes ordeno e exorto que” é inteligível, mas “eu lhes ordeno e os exorto a...” torna a construção mais natural e deixa claro que ambos os verbos se dirigem aos destinatários.
  revised_text: Quanto aos ídolos, eu lhes ordeno e os exorto a desprezá-los e rejeitá-los e a não amá-los, pois estão cheios de engano para os que os adoram e para os que se prostram diante deles.
