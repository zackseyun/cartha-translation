review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência de imperativos, a dupla atitude diante dos ídolos (desprezá-los e rejeitá-los), a proibição de amá-los e a distinção entre adorar e prostrar-se. A formulação final mantém a predicação do erro/engano ligada aos ídolos, sem resolver indevidamente a possível ambiguidade em favor de uma qualidade atribuída apenas aos adoradores.
  naturalness: O texto é claro e de registro apropriado. Contudo, “Quanto à questão dos ídolos” soa um pouco burocrático para o contexto exortativo; “Quanto aos ídolos” é mais direto e natural. A coordenação verbal também fica mais fluente com pronomes explícitos ligados a “exorto”.
  terminology: “Ídolos”, “desprezar”, “rejeitar”, “adorar” e “prostrar-se diante de” são escolhas adequadas. “Engano” é defensável para o termo-fonte e conserva a leitura de que os ídolos estão associados ao erro; não requer nota.
