  yaml_path: translation/extra_canonical/jubilees/036/005.yaml
  text: And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.
translation:
  language: pt
  text: Quanto aos ídolos, eu lhes ordeno e os exorto a desprezá-los e rejeitá-los e a não amá-los, pois estão cheios de engano para os que os adoram e para os que se prostram diante deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጣዖት
  choice: ídolos
  rationale: Equivalente direto e corrente para imagens ou objetos de culto.
- source_word: ትመንንምዎሙ
  choice: os desprezem
  rationale: Preserva a ideia de tratar os ídolos como indignos ou sem valor.
- source_word: ተጸረርዎሙ
  choice: rejeitem
  rationale: Expressa oposição e repúdio em português natural, sem acrescentar uma ação física não indicada.
- source_word: ስሕተት
  choice: engano
  rationale: O termo pode abranger erro, desvio e engano; aqui, “engano” comunica naturalmente o poder de desviar atribuído aos ídolos.
- source_word: ይሰግዱ፡ ሎሙ
  choice: se prostram diante deles
  rationale: Mantém o gesto concreto de reverência cultual, distinguindo-o do verbo mais geral “adorar” que aparece antes.
theological_decisions:
- issue: Relação entre os ídolos e o engano
  choice: “estão cheios de engano para os que...”
  alternative: “os que os adoram estão completamente enganados”
  rationale: Mantém a estrutura e a ambiguidade do texto-fonte, que atribui aos ídolos uma relação com o erro ou engano, sem transferir silenciosamente a qualidade apenas aos adoradores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento pronominal brasileiro (“lhes”) e paralelismo preservado entre “adoram” e “se prostram”.
