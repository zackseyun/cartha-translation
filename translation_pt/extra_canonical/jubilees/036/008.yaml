  text: And let each one love his brothers with mercy and righteousness, and let no man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.
translation:
  language: pt
  text: Que cada um ame seus irmãos com misericórdia e justiça, e que ninguém deseje o mal contra seu irmão, desde agora e para sempre, durante todos os dias da vida de vocês, para que prosperem em tudo o que fizerem e não pereçam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅዋሁ
  choice: seus irmãos
  rationale: O substantivo está no plural neste primeiro uso, em contraste com o singular እኁሁ mais adiante no versículo.
- source_word: በምሕረት፡ ወበጽድቅ
  choice: com misericórdia e justiça
  rationale: Preserva as duas qualidades coordenadas e expressa de modo natural a maneira pela qual os irmãos devem ser amados.
- source_word: ኢይፈቅድ፡ ብእሲ፡ እኩየ
  choice: que ninguém deseje o mal
  rationale: A construção negativa com 'homem' tem sentido indefinido; 'ninguém' é a forma corrente em português, e o verbo mantém a ideia de querer ou desejar o mal.
- source_word: ትሠርሑ
  choice: prosperem
  rationale: No contexto da exortação e de seu resultado, o verbo é entendido no sentido de ter bom êxito ou prosperar, em vez do sentido genérico de apenas trabalhar.
- source_word: ኢትትሐጐሉ
  choice: não pereçam
  rationale: Expressa de forma digna e natural o resultado negativo de ruína ou destruição indicado pelo verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com formas inclusivas de leitura ampla sem apagar a distinção do original entre o plural 'irmãos' no primeiro membro e o singular distributivo 'irmão' no segundo. A sequência temporal enfática foi preservada como 'desde agora e para sempre, durante todos os dias da vida de vocês'.
