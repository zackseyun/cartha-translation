base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/009.yaml
  text: But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.
translation:
  language: pt
  text: Mas, se houver entre vocês alguém que trame o mal contra seu irmão, saibam desde já que todo aquele que trama o mal contra seu irmão cairá nas mãos dele[a], será eliminado da terra dos vivos, e sua descendência será apagada de debaixo do céu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «na mão dele»; pelo contexto, provavelmente na mão de seu irmão, isto é, sob o poder dele.
    reason: O pronome ge'ez não explicita por si só se o referente é o irmão ou o próprio malfeitor, embora o contexto favoreça o irmão.
lexical_decisions:
- source_word: ዘኀሠሠ / ዘየኀሥሥ
  choice: que trame / que trama
  rationale: No contexto de uma intenção maléfica contra o irmão, «tramar» comunica de modo natural a ideia de conceber ou procurar causar o mal.
- source_word: ውስተ፡ እዴሁ፡ ይወድቅ
  choice: cairá nas mãos dele
  rationale: Mantém a imagem semítica de cair sob o poder de alguém e preserva a referência pronominal do texto-fonte.
- source_word: ይሤር፡ እምድረ፡ ሕያዋን
  choice: será eliminado da terra dos vivos
  rationale: Reproduz a fórmula solene de exclusão ou morte sem especificar além do que o texto afirma.
- source_word: ዘርኡኒ፡ ይትሐጐል
  choice: também a sua descendência desaparecerá
  rationale: «Descendência» expressa o sentido coletivo de «semente», e «desaparecerá» comunica a extinção indicada pelo verbo.
theological_decisions:
- issue: Referente do pronome em «na mão dele»
  choice: Manter «dele» no texto e explicar a referência provável em nota
  alternative: Explicitar «nas mãos de seu irmão» ou interpretar reflexivamente como «nas próprias mãos»
  rationale: A forma ge'ez diz literalmente «na mão dele». O contexto favorece o irmão como referente, isto é, o malfeitor cairá sob o poder daquele contra quem tramou, mas a nota preserva a forma e a ambiguidade pronominal do texto-fonte.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por «vocês» para ampla legibilidade brasileira e internacional. A estrutura proverbial e judicial do aviso foi preservada sem arcaísmos desnecessários.
