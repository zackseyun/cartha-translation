translation:
  language: pt
  text: à esquerda do túmulo de Sara, mãe de seu pai. E todos os filhos dela e os filhos dele vieram juntar-se a ele para chorar por Lia, sua esposa, e consolá-lo por causa dela, pois ele estava sofrendo por ela.
