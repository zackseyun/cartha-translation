lexical_decisions:
- source_word: በፀጋመ፡
  choice: à esquerda
  rationale: O termo ge'ez indica especificamente o lado esquerdo, e não apenas um lado indeterminado.
- source_word: ለመቃብረ፡ ሣራ፡
  choice: do túmulo de Sara
  rationale: Tradução direta e natural da relação espacial com o túmulo de Sara.
- source_word: እሙ፡ አቡሁ
  choice: mãe de seu pai
  rationale: Preserva literalmente a relação de parentesco expressa no ge'ez.
- source_word: ይብክይዋ፡ ልያሃ፡
  choice: chorar por Lia
  rationale: O verbo denota prantear ou chorar pela falecida; a formulação é clara e idiomática em português.
- source_word: ይናዝዝዎ፡
  choice: consolá-lo
  rationale: Expressa o ato de oferecer consolo à pessoa enlutada.
- source_word: ሀሎ፡ ይሳቀዮ፡
  choice: estava sofrendo por ela
  rationale: Reproduz a dor contínua do enlutado sem acrescentar uma interpretação psicológica específica.
