  text: And Esau said, “I sold it to Jacob, and I gave the birthright to Jacob; let it be given to him, and I have no word to say about it, for it is his."”
translation:
  language: pt
  text: 'E Esaú disse: “Eu a vendi a Jacó e dei a primogenitura a Jacó. Que ela seja dada a ele; não tenho palavra alguma a dizer sobre isso, pois ela é dele.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤጥኩ፡ ሎቱ፡ ለያዕቆብ
  choice: Eu o vendi a Jacó
  rationale: Mantém o objeto pronominal implícito na sequência e reproduz diretamente a declaração de Esaú.
- source_word: ልህቃነ
  choice: a primogenitura
  rationale: No contexto, designa o direito ou privilégio do primogênito; “primogenitura” é a forma bíblica corrente e clara em português.
- source_word: ወይትወሀብ፡ ሎቱ
  choice: Que ela seja dada a ele
  rationale: Preserva a construção passiva e a referência feminina à primogenitura.
- source_word: አልቦየ፡ ቃለ፡ ዘእብል፡ በእንቲአሁ
  choice: não tenho palavra alguma a dizer sobre isso
  rationale: Traduz a continuação atestada do texto completo, evitando reduzir a frase ao truncado “não tenho nada”.
- source_word: እስመ፡ ዚአሁ፡ ውእቱ
  choice: pois ela é dele
  rationale: Reproduz a oração causal e entende o pronome como referente à primogenitura.
theological_decisions:
- issue: Natureza do que Esaú transferiu a Jacó
  choice: primogenitura
  alternative: direito de primogênito
  rationale: Ambas são possíveis, mas “primogenitura” conserva a terminologia bíblica tradicional sem acrescentar uma interpretação denominacional.
- issue: Força da renúncia final de Esaú
  choice: não tenho palavra alguma a dizer sobre isso
  alternative: não tenho nada
  rationale: A opção escolhida segue o texto ge'ez completo registrado na revisão, incluindo “palavra”, “dizer” e “sobre isso”, e não a forma acidentalmente truncada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “Jacó” foi mantida por refletir a ênfase do original; a pontuação foi ajustada para fluência sem eliminar a estrutura da fala.
