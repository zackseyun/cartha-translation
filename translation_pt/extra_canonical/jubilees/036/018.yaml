  text: there was peace among them. And they went out from him and rested that day and slept. And Isaac slept on his bed five years[18], rejoicing, and he slept the eternal sleep and died at the age of one hundred and eighty years. He completed twenty-five weeks and five years. And his two sons buried him.
translation:
  language: pt
  text: Havia paz entre eles. Então saíram de junto dele, descansaram naquele dia e dormiram. Naquele mesmo dia, Isaque dormiu em sua cama, alegrando-se; adormeceu no sono eterno e morreu aos cento e oitenta anos. Ele completou vinte e cinco semanas e cinco anos.[a] E seus dois filhos o sepultaram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, vinte e cinco semanas de anos (175 anos) mais cinco anos, totalizando 180 anos.
    reason: Esclarece o cálculo calendárico expresso literalmente no texto.
lexical_decisions:
- source_word: ዐርዮ
  choice: paz
  rationale: O termo expressa uma condição de concórdia ou paz entre eles; “paz” é direto, natural e preserva o sentido contextual.
- source_word: ንዋመ፡ ዘለዓለም
  choice: sono eterno
  rationale: Mantém a imagem eufemística do texto-fonte para a morte sem substituí-la por uma explicação interpretativa.
- source_word: ሱባዔ
  choice: semanas
  rationale: Traduz literalmente a unidade de sete; neste contexto cronológico, trata-se de semanas de anos, esclarecidas em nota.
- source_word: ክልኤሆሙ፡ ውሉዱ
  choice: seus dois filhos
  rationale: Reproduz apenas a informação presente neste versículo, sem acrescentar os nomes dos filhos.
theological_decisions:
- issue: A expressão “sono eterno” como descrição da morte
  choice: Preservar literalmente a metáfora “sono eterno”
  alternative: Traduzir apenas como “morreu” ou explicar como estado pós-morte
  rationale: A formulação é uma imagem literária do texto e não deve ser convertida em uma afirmação doutrinária mais específica.
- issue: Relação entre 180 anos e vinte e cinco semanas mais cinco anos
  choice: Manter as duas declarações em frases sucessivas e explicar sua equivalência na nota
  alternative: Inserir “isto é” no texto principal
  rationale: A sintaxe da fonte apresenta primeiro a idade e depois o resumo calendárico; a nota esclarece a relação sem fundir as duas formulações.
translation_notes:
  register: Português moderno, digno e acessível, com fluidez narrativa. “Naquele mesmo dia” evita a leitura artificial de que Isaque teria dormido durante cinco anos e corresponde ao marcador temporal da fonte. A repetição ligada ao sono foi levemente ajustada para soar natural em português, preservando a progressão entre deitar-se, adormecer no sono eterno e morrer.
