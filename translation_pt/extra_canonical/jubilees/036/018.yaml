revisions:
- from: Havia paz entre eles. Então saíram da presença dele, descansaram naquele dia e dormiram. Naquele mesmo dia, Isaque deitou-se em sua cama, cheio de alegria; adormeceu no sono eterno e morreu aos cento e oitenta anos. Ele completou vinte e cinco semanas e cinco anos.[a] E seus dois filhos o sepultaram.
  to: Havia paz entre eles. Então saíram de junto dele, descansaram naquele dia e dormiram. Naquele mesmo dia, Isaque dormiu em sua cama, alegrando-se; adormeceu no sono eterno e morreu aos cento e oitenta anos. Ele completou vinte e cinco semanas e cinco anos.[a] E seus dois filhos o sepultaram.
