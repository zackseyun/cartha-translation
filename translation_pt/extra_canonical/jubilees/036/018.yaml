  source_fidelity: A tradução preserva adequadamente a paz entre as partes, a sequência de repouso, a morte aos 180 anos, o resumo cronológico de vinte e cinco semanas e cinco anos e o sepultamento pelos dois filhos. Contudo, o texto-fonte diz que Isaque «dormiu em sua cama» naquele dia; «deitou-se» reduz essa afirmação a apenas deitar-se e desloca o verbo dormir para o sono eterno subsequente.
  naturalness: O português é claro, moderno e de registro narrativo apropriado. «Dormiu em sua cama naquele dia, alegrando-se» é natural e conserva melhor a repetição intencional entre o repouso ordinário e o «sono eterno».
  terminology: «Paz», «sono eterno», «semanas» e «seus dois filhos» são escolhas apropriadas. A nota explica com precisão que as semanas são semanas de anos, sem transformar a relação cronológica em paráfrase no corpo do versículo.
