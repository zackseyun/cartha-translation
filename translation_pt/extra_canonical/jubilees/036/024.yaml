lexical_decisions:
- source_word: ወይዜከር
  choice: E ele se lembrou
  rationale: Reproduz diretamente o verbo de recordar e mantém a ligação narrativa marcada pela conjunção.
- source_word: ኵሎ ምግባራቲሃ ዘገብረት
  choice: de tudo o que ela havia feito
  rationale: Expressa com naturalidade em português a totalidade dos atos dela; o mais-que-perfeito composto situa esses atos antes da lembrança.
- source_word: በሕይወታ
