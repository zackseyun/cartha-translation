  rationale: Preserva o sentido temporal de suas ações enquanto vivia sem acrescentar explicação não presente no texto.
- source_word: ወይላሕዋ ጥቀ
  choice: e lamentou profundamente por ela
  rationale: Comunica luto ou pesar intenso, preservando o referente feminino.
- source_word: ያፈቅራ
  choice: a amava
  rationale: Verte o amor pessoal contínuo de modo claro e idiomático.
- source_word: በኵሉ ልቡ ወበኵሉ ነፍሱ
  choice: de todo o coração e de toda a alma
  rationale: Mantém o paralelismo antropológico e a formulação enfática do original.
