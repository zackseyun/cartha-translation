lexical_decisions:
- source_word: ፈለጠ (falaṭa)
  choice: dividiu
  rationale: O verbo exprime separar ou dividir; evita-se a leitura anterior, lexicalmente inadequada, «investigou/procurou saber».
- source_word: መዋዕለ፡ ልደቱ (mawāʿǝla lǝdat-u)
  choice: os dias da sua geração
  rationale: Mantém a formulação temporal e a possível ideia de duração da vida/geração. «Os dias do seu nascimento» seria mais literal para ልደት isoladamente, mas é menos natural neste contexto e pode sugerir apenas a ocasião do nascimento.
- source_word: በዓተ፡ ዘእንተ፡ ክልኤ
  choice: caverna dupla
  rationale: Reproduz a designação etíope de uma caverna associada ao número dois, correspondente à sepultura ancestral conhecida na tradição de Gênesis.
- source_word: ቅሩበ፡ ርብቃ፡ እሙ
  choice: perto de Rebeca, sua mãe
  rationale: Conserva a relação espacial expressa por «perto» e identifica Rebeca como mãe do sujeito, sem transformar a frase em «ao lado de».
theological_decisions:
- issue: Identificação da «caverna dupla»
  choice: Manter a expressão no texto e explicar sua identificação tradicional em nota
  alternative: Substituir diretamente por «caverna de Macpela»
  rationale: O texto ge'ez traz a descrição «dupla», não o nome próprio; a nota permite a correlação com Gênesis sem apagar a forma da fonte.
- issue: Alcance da frase inicial
  choice: Traduzir a frase tal como aparece na divisão fornecida e assinalar sua provável continuidade com o versículo anterior
  alternative: Omiti-la deste versículo ou reformulá-la para produzir uma oração independente mais clara
  rationale: A segmentação parece ter transportado para este versículo o fim de uma construção anterior. A tradução preserva o testemunho textual sem inventar contexto sintático.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Preservou-se a concisão cronológica da fonte. Os marcadores [a] e [b] aparecem no texto principal, e as ambiguidades lexical e de segmentação são tratadas em nota, sem resolução denominacional.
