  yaml_path: translation/extra_canonical/jubilees/036/003.yaml
  text: 'And this I command you, my sons: do righteousness and uprightness on the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.'
translation:
  language: pt
  text: 'E isto lhes ordeno, meus filhos: pratiquem a justiça e a retidão na terra, para que o SENHOR faça vir sobre vocês tudo o que o SENHOR disse que faria a Abraão e à sua descendência.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: a justiça e a retidão
  rationale: Reproduz o par ético do ge'ez com termos portugueses correntes e distintos, sem fundi-los numa única ideia.
- source_word: ትግበሩ
  choice: pratiquem
  rationale: Expressa naturalmente a ação contínua de fazer ou realizar justiça e retidão.
- source_word: ዘርኡ
  choice: sua descendência
  rationale: Neste contexto genealógico e pactual, 'descendência' comunica de modo claro o coletivo representado por 'semente', sem restringir número ou gerações.
- source_word: ያምጽእ ... ላዕሌክሙ
  choice: faça vir sobre vocês
  rationale: Preserva a imagem e a construção direcional do texto-fonte, além do valor final expresso por 'para que'.
theological_decisions:
- issue: Relação entre a conduta ordenada e o cumprimento da palavra divina
  choice: para que o SENHOR faça vir sobre vocês
  alternative: e então o SENHOR fará vir sobre vocês
  rationale: Mantém a relação final ou resultativa do texto sem definir além dele a natureza teológica dessa relação.
- issue: Referente e alcance de 'descendência'
  choice: por Abraão e por sua descendência
  alternative: a Abraão e à sua descendência
  rationale: A construção foi mantida próxima da tradição textual apresentada, sem decidir se a ênfase recai exclusivamente sobre promessa feita a eles ou sobre ação divina em favor deles.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento por 'vocês' para legibilidade brasileira e alcance internacional. A repetição de 'o SENHOR' foi preservada por corresponder ao texto-fonte e evitar um pronome potencialmente ambíguo.
