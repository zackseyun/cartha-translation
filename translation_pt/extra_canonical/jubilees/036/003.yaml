review_pass:
  verdict: revise
  source_fidelity: O texto preserva adequadamente a ordem, o par ético «justiça e retidão», o âmbito «na terra» e a construção «fazer vir sobre vocês». Contudo, «disse que faria por Abraão e por sua descendência» desloca a relação do ge'ez, que expressa o que Deus disse que faria a/em relação a Abraão e à sua descendência, para um sentido mais marcadamente vicário ou causal («por causa de/em favor de»).
  naturalness: O português é moderno, claro e de registro digno. «Pratiquem a justiça e a retidão» e «faça vir sobre vocês» são naturais e mantêm bem a força do original. A troca de regência proposta é igualmente idiomática.
  terminology: «SENHOR» representa de modo consistente o nome divino conforme a trilha inglesa. «Justiça», «retidão» e «descendência» são escolhas adequadas e distintas para os termos e o contexto.
  issues:
  - severity: medium
    issue: Regência de «por Abraão e por sua descendência»
    rationale: Em português, «faria por» tende a significar «faria em favor de», «por causa de» ou «no lugar de». O texto-fonte e a tradução inglesa de auditoria apontam para o conteúdo daquilo que Deus disse que faria a Abraão e à sua descendência. «A Abraão e à sua descendência» conserva essa relação sem introduzir a nuance vicária/casual.
  revised_text: 'E isto lhes ordeno, meus filhos: pratiquem a justiça e a retidão na terra, para que o SENHOR faça vir sobre vocês tudo o que o SENHOR disse que faria a Abraão e à sua descendência.'
