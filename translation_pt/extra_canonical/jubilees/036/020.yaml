  yaml_path: translation/extra_canonical/jubilees/036/020.yaml
  text: But Jacob dwelt on Mount Hebron, in the tower of the land of the sojourning of Abraham his father, and he worshiped the LORD with all his heart and according to the commandments as they were revealed,
translation:
  language: pt
  text: Mas Jacó habitou no monte Hebrom, na torre da terra onde Abraão, seu pai, viveu como estrangeiro,[a] e adorou o SENHOR de todo o coração e conforme os mandamentos foram revelados,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também se pode traduzir mais literalmente: “na torre da terra da peregrinação de Abraão, seu pai”.'
    reason: A sequência de genitivos no texto etiópico admite esta tradução mais literal, embora menos natural em português.
lexical_decisions:
- source_word: ኀደረ (ḫadara)
  choice: habitou
  rationale: Expressa residência ou permanência de modo natural e digno em português.
- source_word: ማኅደድ (maḥdad)
  choice: torre
  rationale: Segue o sentido tradicional do termo neste contexto, embora a construção locativa seja textualmente difícil.
- source_word: ምድረ፡ ፍልሰተ (medra felsata)
  choice: terra em que ... havia peregrinado
  rationale: Torna natural em português a cadeia genitiva etiópica, preservando tanto 'terra' quanto a ideia de residência como estrangeiro.
- source_word: አምላከ (amlaka)
  choice: adorou
  rationale: No contexto, o verbo descreve o culto prestado ao Senhor; 'adorou' é claro e idiomático.
- source_word: በኵሉ፡ ልቡ (bakʷellu lebbu)
  choice: de todo o coração
  rationale: Equivalente português corrente da expressão semítica que indica devoção integral.
- source_word: ያስተርኢ (yāstarʾi)
  choice: lhe foram revelados
  rationale: A forma transmite a ideia de algo dado a conhecer ou manifestado; a voz passiva é natural em português.
theological_decisions:
- issue: Identidade do objeto de culto
  choice: o SENHOR
  alternative: Deus
  rationale: O texto distingue o verbo de culto e o título divino; 'o SENHOR' segue a tradição de representação reverente adotada pela camada de consulta sem acrescentar especificidade doutrinária.
- issue: Destinatário implícito da revelação
  choice: que lhe foram revelados
  alternative: conforme foram revelados
  rationale: O pronome explicita a relação mais provável com Jacó, mas a nota registra a possibilidade de uma formulação impessoal, preservando a leve ambiguidade sintática.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A vírgula final foi mantida porque o versículo termina como continuação sintática do trecho seguinte na fonte fornecida.
