revisions:
- from: Mas Jacó habitou no monte Hebrom, na torre da terra em que Abraão, seu pai, havia peregrinado,[a] e adorou o SENHOR de todo o coração e segundo os mandamentos que lhe foram revelados,
  to: Mas Jacó habitou no monte Hebrom, na torre da terra onde Abraão, seu pai, viveu como estrangeiro,[a] e adorou o SENHOR de todo o coração e conforme os mandamentos foram revelados,
  rationale: Substituí a explicitação «lhe foram revelados» por uma passiva sem destinatário expresso, preservando a ambiguidade da fonte. Também ajustei a expressão relativa à peregrinação de Abraão para comunicar naturalmente a residência como estrangeiro, mantendo «terra» e apoiando a leitura mais literal na nota. A vírgula final é conservada, pois o versículo está sintaticamente ligado à continuação.
  reviewer_model: gpt-5.6-terra
