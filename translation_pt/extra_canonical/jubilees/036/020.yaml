    reason: A sequência de genitivos no texto etiópico admite esta tradução mais literal, embora menos natural em português.
  revision_rationale: Substituí a explicitação «lhe foram revelados» por uma passiva sem destinatário expresso, preservando a ambiguidade da fonte. Também ajustei a expressão relativa à peregrinação de Abraão para comunicar naturalmente a residência como estrangeiro, mantendo «terra» e apoiando a leitura mais literal na nota. A vírgula final é conservada, pois o versículo está sintaticamente ligado à continuação.
