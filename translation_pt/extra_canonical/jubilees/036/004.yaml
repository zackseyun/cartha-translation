  yaml_path: translation/extra_canonical/jubilees/036/004.yaml
  text: And be, my sons, loving among yourselves, loving your brothers as a man who loves his own life, and each seeking for his brother what is good for him; and act together on the earth, and let them love one another as themselves.
translation:
  language: pt
  text: Meus filhos, vivam em amor uns com os outros, amando seus irmãos como um homem ama a própria vida e buscando, cada um, para seu irmão o que lhe é bom. Ajam em união na terra, e que eles se amem uns aos outros como a si mesmos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto passa aqui da segunda pessoa (“vocês”) para a terceira pessoa (“eles”).
    reason: A mudança de pessoa está no texto ge'ez e pode ser significativa ou refletir uma transição abrupta; a nota preserva essa tensão sem harmonizá-la silenciosamente.
lexical_decisions:
- source_word: ውሉድየ
  choice: Meus filhos
  rationale: Vocativo familiar e solene; corresponde ao sentido contextual de “meus filhos”, embora o substantivo também possa ter o sentido mais amplo de “meus descendentes/crianças”.
- source_word: በበይናቲክሙ
  choice: entre vocês
  rationale: Reproduz a relação recíproca interna ao grupo sem recorrer a uma formulação artificial.
- source_word: ታፈቅሩ፡ አኅዊክሙ
  choice: amando seus irmãos
  rationale: Mantém a segunda pessoa do plural do ge'ez, evitando a leitura distributiva em terceira pessoa “cada um amando seu irmão”.
- source_word: ነፍሶ
  choice: a própria vida
  rationale: ነፍስ pode significar “alma”, “vida” ou “si mesmo”; aqui “vida” expressa naturalmente o objeto do amor e preserva o paralelismo.
- source_word: የኀሥሥ
  choice: buscando
  rationale: Conserva o fluxo participial da construção anterior.
- source_word: በገቢረ፡ ኅቡረ
  choice: Ajam em união
  rationale: Expressa a ideia de agir conjuntamente, em linguagem portuguesa atual e digna.
theological_decisions:
- issue: Sentido de ነፍስ nas duas comparações
  choice: vida
  alternative: alma / si mesmo
  rationale: O campo semântico permite as alternativas, mas “amar a própria vida” é claro no primeiro paralelo e evita introduzir uma distinção teológica entre alma e corpo que o texto não exige.
- issue: Mudança da segunda para a terceira pessoa na cláusula final
  choice: “que eles amem” no texto, com nota explicativa
  alternative: “amem-se” ou “amem uns aos outros”
  rationale: Preserva a mudança gramatical real do ge'ez em vez de harmonizá-la silenciosamente com os imperativos dirigidos aos filhos.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom exortativo e digno. A sintaxe foi tornada natural sem apagar a sequência participial nem a mudança final de pessoa do original.
