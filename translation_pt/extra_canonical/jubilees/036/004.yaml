  naturalness: O português é claro e adequado ao registro exortativo. “Vivam em amor uns com os outros” torna explícita de forma natural a reciprocidade de “entre vocês”. A forma final “que eles se amem uns aos outros” preserva a mudança abrupta de pessoa, mas soa gramaticalmente mais completa com o pronome reflexivo.
  terminology: “Meus filhos”, “irmãos”, “vida” na primeira comparação e “ajam em união” são escolhas apropriadas. Na comparação final, “a si mesmos” é preferível a “a própria vida”, pois evita transferir indevidamente o sentido lexical da primeira ocorrência para uma construção reflexiva plural.
