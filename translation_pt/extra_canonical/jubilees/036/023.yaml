  yaml_path: translation/extra_canonical/jubilees/036/023.yaml
  text: For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because gentleness and peace and uprightness and honor were in her.
translation:
  language: pt
  text: Pois ele a amou muitíssimo depois que Raquel, irmã dela, morreu, porque ela era íntegra e reta em todos os seus caminhos e honrava Jacó. Durante todos os dias em que viveu com ele, ele não ouviu da boca dela nenhuma palavra áspera, porque nela havia mansidão, paz, retidão e honra.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque ela era mansa, pacífica, reta e honrada”.'
    reason: Registra uma tradução adjetival possível das quatro qualidades finais, embora o geʽez empregue substantivos abstratos seguidos de “nela”.
lexical_decisions:
- source_word: ያፈቅራ፡ ፈድፋደ፡ ጥቀ
  choice: a amou muitíssimo
  rationale: Reproduz a forte intensificação do amor expressa no geʽez, em português natural e digno.
- source_word: ፍጽምት፡ ወሬትዕት
  choice: íntegra e reta
  rationale: “Íntegra” comunica plenitude moral sem sugerir impecabilidade técnica; “reta” preserva a ideia de conduta correta.
- source_word: በኵሉ፡ ፍናዊሃ
  choice: em todos os seus caminhos
  rationale: Mantém a metáfora semítica dos “caminhos” como modo de vida, clara também em português bíblico corrente.
- source_word: ቃለ፡ ድሩከ
  choice: nenhuma palavra áspera
  rationale: Expressa fala dura ou severa de modo idiomático, sem ampliar o sentido para insulto ou abuso.
- source_word: የውህት፡ ወሰላመ፡ ወርትዕ፡ ወክብራ፡ ባቲ
  choice: nela havia mansidão, paz, retidão e honra
  rationale: Conserva os substantivos abstratos e a construção “nela” do texto geʽez, em vez de convertê-los silenciosamente em adjetivos.
theological_decisions:
- issue: Descrição da integridade da mulher
  choice: íntegra e reta
  alternative: perfeita e justa
  rationale: Evita impor ao termo “perfeita” uma noção teológica de impecabilidade, ao mesmo tempo que preserva a avaliação moral enfática do original.
- issue: Forma das quatro qualidades finais
  choice: mansidão, paz, retidão e honra estavam nela
  alternative: ela era mansa, pacífica, reta e honrada
  rationale: A tradução principal preserva a estrutura nominal do geʽez e sua possível nuance de qualidades presentes nela; a alternativa adjetival é registrada em nota.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O período foi dividido em duas frases para clareza, preservando a progressão argumentativa e o tom elevado. O marcador [a] aparece no texto principal junto à expressão a que se refere.
