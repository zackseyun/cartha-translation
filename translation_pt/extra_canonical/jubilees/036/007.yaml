base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/007.yaml
  text: And now I make you swear by a great oath, for there is no oath greater than it, by the glorious and honorable and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you may be those who fear him and those who worship him.
translation:
  language: pt
  text: E agora faço vocês jurarem com um grande juramento — pois não há juramento maior do que este — pelo nome glorioso, honrado, grande, esplêndido, maravilhoso e poderoso daquele que fez os céus, a terra e todas as coisas juntas,[a] para que sejam dos que o temem e dos que o adoram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “toda a criação”.'
    reason: Registra uma tradução idiomática possível para a expressão de totalidade, enquanto o texto principal preserva o sentido explícito de que todas as coisas são tomadas juntas.
lexical_decisions:
- source_word: አምሕለክሙ፡ በመሐላ፡ ዐቢይ
  choice: faço vocês jurarem com um grande juramento
  rationale: Reproduz a construção causativa e mantém a repetição enfática entre jurar e juramento, em português corrente.
- source_word: በስም፡ ስቡሕ፡ ወክቡር፡ ወዐቢይ፡ ወስፉሕ፡ ወመንክር፡ ወኀያል
  choice: pelo nome glorioso, honrado, grande, esplêndido, maravilhoso e poderoso
  rationale: Preserva a série cumulativa de qualificativos aplicada ao nome, sem abreviá-la nem harmonizá-la.
- source_word: ወኵሎ፡ ኅቡረ
  choice: e todas as coisas em conjunto
  rationale: Mantém o sentido explícito de totalidade e a força de ኅቡረ, 'juntas/em conjunto', em vez de substituí-lo pela paráfrase 'toda a criação'.
- source_word: ከመ፡ ትኩኑ
  choice: para que sejam
  rationale: Expressa naturalmente a construção final do ge'ez e preserva sua orientação para o resultado desejado.
- source_word: ታመልከዎ
  choice: o adoram
  rationale: Escolha ampla e natural para o verbo de culto, sem acrescentar uma forma denominacional específica de devoção.
theological_decisions:
- issue: Valor da oração introduzida por ከመ
  choice: para que sejam
  alternative: de modo que vocês sejam / que vocês sejam
  rationale: A formulação final preserva a possível nuance de propósito ou resultado, evitando transformar a frase numa simples previsão.
- issue: Descrição divina por meio do 'nome'
  choice: mantida literalmente como juramento pelo nome daquele que criou
  alternative: juramento diretamente por Deus
  rationale: Conserva a mediação textual pelo 'nome', importante para a forma e a tensão teológica do enunciado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para a segunda pessoa plural e mantém a solenidade por meio da cadência enumerativa e do vocabulário do juramento.
