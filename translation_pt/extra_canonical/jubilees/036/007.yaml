    text: 'Ou: “toda a criação”.'
    reason: Registra uma tradução idiomática possível para a expressão de totalidade, enquanto o texto principal preserva o sentido explícito de que todas as coisas são tomadas juntas.
  revision_rationale: 'A única revisão é estilística e desambiguadora: “juntas” mantém a força de ኅቡረ (“juntas/em conjunto”) com maior naturalidade em português e sem sugerir que a criação foi feita em parceria. Não há alteração de sentido, de registro nem de teologia.'
