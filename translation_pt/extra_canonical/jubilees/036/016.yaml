  text: And my heart has rejoiced concerning the birthright, that you did not do violence concerning it. May the LORD bless you
translation:
  language: pt
  text: E meu coração se alegrou por causa do direito de primogenitura, porque você não agiu com violência a respeito dele.[a] Que o SENHOR abençoe você.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «porque nenhuma violência foi cometida por causa dele».'
    reason: Preserva a alternativa passiva anteriormente atestada para a construção.
  - marker: b
    text: 'Ou, sem objeto expresso: «Que o SENHOR abençoe».'
    reason: Registra a possibilidade de traduzir a cláusula final sem explicitar o destinatário.
lexical_decisions:
- source_word: ልብየ
  choice: meu coração
  rationale: Mantém a imagem antropológica e afetiva do texto-fonte.
- source_word: ልህቃን
  choice: direito de primogenitura
  rationale: No contexto, designa a prerrogativa do primogênito, e não simplesmente o fato de nascer primeiro.
- source_word: ኢትግበር
  choice: você não agiu
  rationale: Reflete a forma verbal negativa na segunda pessoa masculina singular, preservando Esaú como sujeito ativo.
- source_word: ፁገ
  choice: com violência
  rationale: Expressa a ideia de violência ou dano associada à ação negada.
- source_word: እግዚአብሔር
  choice: SENHOR
  rationale: Equivalente tradicional e reconhecível para o título divino presente na fonte, sem acrescentar «Altíssimo».
theological_decisions:
- issue: Agente da ação relativa ao direito de primogenitura
  choice: porque você não agiu com violência a respeito dele
  alternative: porque nenhuma violência foi cometida por causa dele
  rationale: A forma verbal favorece uma leitura ativa de segunda pessoa; a alternativa passiva é registrada em nota por refletir uma possível compreensão anterior da construção.
- issue: Destinatário da bênção final
  choice: Que o SENHOR abençoe você
  alternative: Que o SENHOR abençoe
  rationale: O objeto «você» é favorecido pela forma/contexto do discurso direto e evita uma oração abruptamente incompleta, embora a tradução mais estritamente sem objeto permaneça possível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. «Direito de primogenitura» comunica o sentido jurídico-familiar; «você» torna explícito o interlocutor singular sem recorrer a formas regionais. A formulação conserva a tensão textual nas notas.
