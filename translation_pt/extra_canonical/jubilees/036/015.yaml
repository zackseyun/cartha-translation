  text: And Isaac said, “May a blessing rest upon you, my sons, and upon your seed this day, because you have given me rest.”
translation:
  language: pt
  text: 'E Isaque disse: “Que uma bênção repouse sobre vocês, meus filhos, e sobre a descendência de vocês neste dia, porque vocês me deram descanso.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከተ
  choice: uma bênção
  rationale: Traduz diretamente o substantivo ge’ez que designa bênção, mantendo a formulação indefinida do texto.
- source_word: ታዕርፍ፡ ዲቤክሙ
  choice: repouse sobre vocês
  rationale: Preserva a imagem de a bênção vir a repousar sobre os destinatários, com expressão natural em português.
- source_word: አውሉድየ
  choice: meus filhos
  rationale: Equivalente direto e afetivo do vocativo empregado por Isaque.
- source_word: ዘርእክሙ
  choice: a descendência de vocês
  rationale: Expressa o sentido coletivo de ‘semente, posteridade’ sem sugerir apenas filhos imediatos.
- source_word: አዕረፍክሙኒ
  choice: vocês me deram descanso
  rationale: Conserva o jogo lexical com o verbo anterior ‘repouse’ e o sentido causativo de proporcionar descanso a Isaque.
theological_decisions:
- issue: Força da declaração de bênção
  choice: Que uma bênção repouse
  alternative: Uma bênção repousará
  rationale: A forma verbal no contexto funciona naturalmente como desejo ou pronunciamento de bênção; a construção optativa preserva essa força sem transformá-la em previsão categórica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ‘vocês’ para leitura natural no Brasil e inteligibilidade internacional. A repetição conceitual entre ‘repouse’ e ‘deram descanso’ foi mantida por refletir a linguagem do original.
