  yaml_path: translation/extra_canonical/jubilees/036/001.yaml
  text: And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.”
translation:
  language: pt
  text: 'E no sexto ano desta semana, Isaque chamou seus dois filhos, Esaú e Jacó, e eles vieram até ele. Então lhes disse: “Meus filhos, vou pelo caminho de meus antepassados, para a casa eterna onde estão meus antepassados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመት፡ ዘዝሱባዔ
  choice: ano desta semana
  rationale: Preserva a terminologia cronológica própria de Jubileus, em que a “semana” designa um período de sete anos.
- source_word: እሐውር፡ ውስተ፡ ፍኖተ፡ አበውየ
  choice: estou seguindo pelo caminho de meus pais
  rationale: Mantém a metáfora eufemística do texto-fonte para a morte, sem substituí-la por uma explicação interpretativa.
- source_word: ቤት፡ ዘለዓለም
  choice: morada eterna
  rationale: Traduz literalmente a ideia de “casa eterna”, usando “morada” para obter uma expressão natural e digna em português sem definir em excesso a natureza do lugar.
theological_decisions:
- issue: A linguagem sobre a morte e o destino dos antepassados
  choice: Preservar as imagens “caminho de meus pais” e “morada eterna onde estão meus pais”
  alternative: Explicitar como “vou morrer e me reunir aos meus antepassados”
  rationale: O original emprega linguagem figurada e não desenvolve uma doutrina específica do estado dos mortos; a tradução conserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A repetição de “meus pais” foi mantida por corresponder à repetição deliberada do original.
