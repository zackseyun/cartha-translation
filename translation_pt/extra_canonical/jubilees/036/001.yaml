  terminology: «Isaque», «Esaú» e «Jacó» seguem formas portuguesas correntes. «Semana» preserva adequadamente a unidade cronológica característica de Jubileus. «Antepassados» evita a ambiguidade moderna de «pais» e mantém a repetição presente no texto-fonte.
