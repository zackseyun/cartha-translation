  source_fidelity: 'A estrutura e o sentido geral correspondem bem ao ge''ez: a datação, os dois filhos nomeados, a vinda deles a Isaque e a fala de despedida foram preservados. Contudo, «meus pais» em português normalmente designa os genitores imediatos e não comunica com clareza o sentido de «meus pais/pais» como antepassados, que é o sentido exigido pelo contexto. «Morada eterna» é aceitável, mas «casa eterna» reproduz mais diretamente a imagem do original sem prejudicar a inteligibilidade.'
