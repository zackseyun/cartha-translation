base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/006.yaml
  text: Remember, my sons, the LORD, the God of Abraham your father; and how I also worshipped him and served him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted throughout all generations forever.
translation:
  language: pt
  text: Lembrem-se, meus filhos, do SENHOR, o Deus de Abraão, pai de vocês, e de como eu também o adorei[a] e o servi com justiça e alegria, para que ele os multiplique e torne a descendência de vocês tão numerosa como as estrelas do céu, e os plante na terra como planta de justiça, que não será arrancada ao longo de todas as gerações, para sempre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope preservado traz literalmente «meu Deus», expressão que parece resultar de corrupção textual. A tradução segue a emenda tradicional «eu o adorei».
    reason: Registra uma dificuldade textual real e evita apresentar como indiscutível a reconstrução adotada no texto principal.
lexical_decisions:
- source_word: ተዘከርዎ
  choice: Lembrem-se ... do
  rationale: Reproduz o imperativo plural dirigido aos filhos e emprega a regência natural do português.
- source_word: አምላከ
  choice: o Deus de
  rationale: Mantém a identificação do SENHOR como Deus de Abraão.
- source_word: ተቀነዩኩ፡ ሎቱ
  choice: eu ... o servi
  rationale: O verbo expressa serviço ou sujeição; «servi» é direto, tradicional e adequado ao contexto religioso.
- source_word: ዘበጽድቅ፡ ወበፍሥሓ
  choice: com justiça e alegria
  rationale: Conserva os dois modos ou esferas do serviço sem transformar «justiça» em mera sinceridade.
- source_word: ያልህቅ፡ ዘርአክሙ
  choice: torne a descendência de vocês ... numerosa
  rationale: Expressa o aumento da semente/linhagem em português corrente; «descendência» evita a leitura agrícola indevida.
- source_word: ተክለ፡ ጽድቅ
  choice: planta de justiça
  rationale: Preserva a metáfora concreta e sua formulação teológica, em vez de explicá-la como simples povo justo.
- source_word: ዘኢይሤረዉ
  choice: que não será arrancada
  rationale: Mantém a imagem de uma planta que não pode ser removida pela raiz.
theological_decisions:
- issue: Forma textual አምላክየ após ወእምዝ አነኒ
  choice: e de como eu também o adorei[a]
  alternative: e eu também, meu Deus / e eu também me dediquei a ele
  rationale: A leitura transmitida parece corrompida e, tomada literalmente, não produz uma sequência sintática satisfatória. A emenda tradicional que entende uma forma verbal de «adorar» se ajusta ao paralelismo com «o servi», mas a incerteza é explicitada em nota.
- issue: Finalidade da multiplicação e do plantio
  choice: para que ele os multiplique ... e os plante
  alternative: de modo que ele os multiplicou ... e os plantou
  rationale: As formas verbais sustentam a orientação prospectiva/final, coerente com a exortação paterna, sem converter a promessa em resultado já cumprido.
- issue: Duração enfática
  choice: por todas as gerações, para sempre
  alternative: para todas as gerações eternas
  rationale: Mantém os dois componentes temporais do original e sua ênfase, ainda que haja aparente redundância em português.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para o plural familiar e «SENHOR» como representação convencional do nome divino. A metáfora agrícola e a repetição temporal do original foram preservadas.
