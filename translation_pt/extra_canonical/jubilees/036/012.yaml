  source_fidelity: 'A tradução preserva os elementos principais: a divisão de todos os bens, a porção maior dada ao homem nascido primeiro, a torre, o que a circunda e o que Abraão adquiriu no Poço do Juramento. Contudo, “incluindo” transforma a sequência coordenada do ge''ez em uma explicação subordinada e torna mais explícita do que o texto a relação entre a porção maior e os itens seguintes. É mais fiel conservar a coordenação.'
