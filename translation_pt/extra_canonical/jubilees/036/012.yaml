  yaml_path: translation/extra_canonical/jubilees/036/012.yaml
  text: And he divided all the possessions that he had between them on that day, and he gave the greater share to the man who was born first, and the tower[12] and all that was around it, and all that Abraham had acquired at the Well of the Oath.
translation:
  language: pt
  text: E, naquele dia, ele repartiu entre eles todos os bens que possuía e deu a parte maior ao homem que nasceu primeiro, e a torre[a], tudo o que havia ao redor dela e tudo o que Abraão havia adquirido no Poço do Juramento.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A torre” talvez se refira a um elemento específico da propriedade incluído na herança. A lista é concisa, e o sentido exato do termo no texto subjacente é incerto.
    reason: cultural_note
lexical_decisions:
- source_word: ጥሪተ
  choice: bens
  rationale: O termo designa bens, posses ou patrimônio; “bens” explicita o substantivo presente no ge'ez e soa natural em português.
- source_word: ዕበየ
  choice: a parte maior
  rationale: No contexto de uma divisão de bens, a expressão indica a porção maior; “parte maior” mantém o sentido comparativo sem acrescentar uma proporção específica.
- source_word: ለብእሲ፡ ዘውእቱ፡ ቀደመ፡ ተወልደ
  choice: ao homem que havia nascido primeiro
  rationale: Preserva o substantivo explícito “homem” e a prioridade de nascimento indicada pelo texto, evitando importar terminologia jurídica como “primogênito”.
- source_word: ማኅፈደ
  choice: torre
  rationale: Segue o sentido adotado pela edição e pela camada inglesa auditada, embora a identificação exata do elemento da propriedade seja incerta; a incerteza é registrada em nota.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Poço do Juramento
  rationale: Traduz os componentes do topônimo de modo transparente, em vez de substituí-los silenciosamente pela forma tradicional “Berseba”.
