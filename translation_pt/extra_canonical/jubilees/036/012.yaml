translation_notes:
  register: Português moderno, digno e de leitura corrente. A segunda oração foi formulada com “incluindo” para deixar claro que a torre e os demais bens enumerados integram a parte maior, sem alterar a estrutura distributiva do versículo. O marcador [a] aparece imediatamente após “torre”, expressão a que a nota se refere.
