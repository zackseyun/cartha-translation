revisions:
- from: E, naquele dia, ele repartiu entre eles todos os bens que possuía. Deu a parte maior ao homem que havia nascido primeiro, incluindo a torre[a], tudo o que havia ao redor dela e tudo o que Abraão havia adquirido junto ao Poço do Juramento.
  to: E, naquele dia, ele repartiu entre eles todos os bens que possuía e deu a parte maior ao homem que nasceu primeiro, e a torre[a], tudo o que havia ao redor dela e tudo o que Abraão havia adquirido no Poço do Juramento.
  rationale: A revisão restaura a sequência coordenada do texto-fonte, evitando que “incluindo” imponha uma relação explicativa mais definida entre a parte maior e a enumeração posterior. Também ajusta a expressão locativa e torna a nota mais cautelosa quanto à identificação da “torre”.
