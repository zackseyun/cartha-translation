lexical_decisions:
- source_word: እሁብ
  choice: Dou
  rationale: Expressa de modo direto e natural a ação de dar em primeira pessoa, em conformidade com o sentido contextual.
- source_word: ዘንተ፡ ዕበየ
  choice: esta porção maior
  rationale: O demonstrativo e a ideia comparativa exigem em português um referente explícito; “porção” torna claro que se trata de uma parte da herança, enquanto “maior” preserva a comparação.
- source_word: ለብእሲ
  choice: ao homem
  rationale: Mantém explicitamente o substantivo masculino presente no texto etíope, sem reduzi-lo ao pronome genérico “àquele”.
- source_word: ዘውእቱ፡ ቀደመ፡ ተወልደ
  choice: que nasceu primeiro
  rationale: Reproduz com clareza a prioridade de nascimento sem introduzir o termo interpretativo “primogênito”.
