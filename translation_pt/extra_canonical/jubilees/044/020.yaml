translation:
  language: pt
  text: 'E os filhos de Benjamim: Belá, Bequer, Asbel, Gera, Naamã, Eí, Rosh, Mupim, Hupim e Arde — onze.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lista traz dez nomes, mas o texto ge’ez declara “dez e um”, isto é, onze.
    reason: Preserva e esclarece a discrepância interna do texto-fonte sem propor uma explicação conjectural.
lexical_decisions:
- source_word: ወውሉደ፡ ብንያም
  choice: E os filhos de Benjamim
  rationale: Reproduz diretamente a construção genealógica do ge’ez, em português natural.
- source_word: ባላ፡ ወበኮር፡ ወአስቤል፡ ጌራ፡ ወንእማን፡ ወኤሒ፡ ወሮስ፡ ወሙጲም፡ ወሑጲም፡ ወአርድ
  choice: Belá, Bequer, Asbel, Gera, Naamã, Eí, Rôs, Mupim, Hupim e Arde
  rationale: Emprega formas portuguesas reconhecíveis dos nomes bíblicos, mantendo todos os dez nomes e sua ordem no manuscrito.
- source_word: ዐሠርቱ፡ ወአሐዱ
  choice: onze
  rationale: É a tradução direta da expressão numérica ge’ez, literalmente “dez e um”, embora a lista contenha dez filhos.
theological_decisions:
- issue: A discrepância entre os dez nomes e o total declarado de onze
  choice: Manter “onze” no texto e explicar a discrepância em nota
  alternative: Corrigir o total para “dez”, como faz a camada inglesa consultiva
  rationale: A fonte ge’ez declara explicitamente onze. O total provavelmente inclui o próprio Benjamim, mas a formulação “os filhos de Benjamim” deixa essa contagem implícita; por isso, a tensão textual deve ser preservada, não corrigida silenciosamente.
