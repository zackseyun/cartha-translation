  text: And Jacob remembered the dream that he had seen at Bethel, and he was afraid to go down into Egypt.
translation:
  language: pt
  text: E Jacó se lembrou do sonho que tinha visto em Betel, teve medo e desceu ao Egito.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከረ
  choice: se lembrou
  rationale: Expressa de modo natural o sentido reflexivo de recordar, preservando o valor narrativo do verbo.
- source_word: ሕልመ
  choice: sonho
  rationale: Equivalente direto e corrente para o substantivo ge'ez.
- source_word: ዘርእየ
  choice: que tinha visto
  rationale: Mantém a formulação da fonte, na qual Jacó 'viu' o sonho, e o mais-que-perfeito composto esclarece que a visão ocorreu antes da lembrança.
- source_word: በቤቴል
  choice: em Betel
  rationale: Transliteração tradicional e amplamente reconhecida do topônimo bíblico.
- source_word: ፈርሀ
  choice: ficou com medo
  rationale: Português corrente e digno para indicar o estado de temor sem acrescentar sua causa.
- source_word: ፈደ ውስተ ግብጽ
  choice: descer ao Egito
  rationale: Preserva o verbo espacial bíblico 'descer' e traduz o destino com regência natural em português.
theological_decisions:
- issue: Relação entre o sonho em Betel e o medo de ir ao Egito
  choice: Manter apenas a coordenação narrativa
  alternative: Explicitar que o sonho causou ou fundamentou o medo
  rationale: A fonte liga os acontecimentos com 'e', sem declarar expressamente uma relação causal; a tradução preserva essa abertura interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva a expressão bíblica 'descer ao Egito' e evita uma construção excessivamente literal como 'temeu descer'.
