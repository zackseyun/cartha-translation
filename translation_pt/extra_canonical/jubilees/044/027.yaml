  text: And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons[27], all of them seventy-five.
translation:
  language: pt
  text: Todas as pessoas de Jacó que entraram no Egito somavam setenta. Eram seus filhos e os filhos de seus filhos[a], setenta e cinco ao todo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A contagem do capítulo é deliberada, mas não é simples: primeiro são mencionadas setenta pessoas que entraram no Egito e, em seguida, setenta e cinco. Depois, o texto explica que cinco morreram no Egito, enquanto José e seus dois filhos são excluídos dessa menção de mortes.'
    reason: cross_reference
lexical_decisions:
- source_word: መንፈስ / ነፍስ
  choice: pessoas
  rationale: Embora os termos possam significar literalmente “espírito” e “alma”, aqui funcionam como formas de contar pessoas; “pessoas” comunica naturalmente o sentido enumerativo em português.
- source_word: ውሉዱ ወውሉደ ውሉዱ
  choice: seus filhos e os filhos de seus filhos
  rationale: Mantém a estrutura genealógica explícita do ge’ez sem substituir a segunda expressão pelo termo mais interpretativo “netos”.
- source_word: ኵሎሙ ሰብዓ ወኃምስቱ
  choice: setenta e cinco ao todo
  rationale: Preserva o total declarado no texto e sua tensão com o número setenta da frase anterior.
theological_decisions:
- issue: Diferença entre os totais setenta e setenta e cinco
  choice: Manter ambos os números no texto principal
  alternative: Harmonizar os totais ou escolher apenas um deles
  rationale: O texto-fonte apresenta deliberadamente os dois totais; a tradução não deve eliminar a dificuldade genealógica e aritmética.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A formulação preserva a repetição genealógica e a tensão entre os dois totais.
