  text: I will go down with you, and I will surely bring you up again. And in this land you will be buried, and Joseph will place his hands on your eyes. Do not fear; go down into Egypt.”
translation:
  language: pt
  text: Eu descerei com você e certamente o farei subir de novo. Você será sepultado nesta terra, e José porá as mãos sobre os seus olhos.[a] Não tenha medo; desça ao Egito.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a mão”.'
    reason: A tradição textual apresenta variação de número nesta expressão; o texto principal segue o plural refletido no ge’ez de Jubileus.
lexical_decisions:
- source_word: አወጽአከ
  choice: o farei subir novamente
  rationale: O verbo significa literalmente fazer sair ou levar para fora; neste contexto, a subida para fora do Egito é a formulação natural em português e mantém a promessa de retorno.
- source_word: እዴሁ
  choice: as mãos
  rationale: A forma ge’ez é entendida aqui como plural, em consonância com a tradição textual refletida em Jubileus; a nota registra a possibilidade de leitura no singular.
- source_word: ያነብር ... ዲበ፡ አዕይንቲከ
  choice: porá ... sobre os seus olhos
  rationale: Preserva concretamente a expressão de José fechar os olhos de Jacó após sua morte, sem explicitar no texto principal o sentido implícito.
theological_decisions:
- issue: A relação entre a promessa de Deus descer com Jacó, fazê-lo subir e seu sepultamento
  choice: Manter juntas a subida futura e a declaração de sepultamento na terra
  alternative: Interpretar a subida apenas como o transporte posterior do corpo de Jacó
  rationale: O texto conserva uma tensão entre promessa coletiva, retorno pessoal e sepultamento. A tradução não restringe silenciosamente a promessa a uma única interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você”. A repetição de “eu” traduz a ênfase do original sem tornar a frase excessivamente literal.
