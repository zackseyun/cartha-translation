  text: 'And Israel set out from Add a footnote: "Ge''ez reads *Haran*, a likely scribal error for *Hebron*.", from his house, on the new moon of the third month, and he went by the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month.'
translation:
  language: pt
  text: Israel partiu de sua casa em Harã[a], no dia da lua nova do terceiro mês, e seguiu pelo caminho do Poço do Juramento. No sétimo dia desse mês, ofereceu um sacrifício ao Deus de seu pai Isaque.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto ge'ez lê “Harã”, provavelmente por erro de copista em lugar de “Hebrom”.
    reason: Esclarece que «Harã» é a leitura do texto-fonte, embora o contexto narrativo sugira uma provável corrupção textual.
lexical_decisions:
- source_word: እምካራን (ʾəm-Kārān)
  choice: de Harã
  rationale: Reproduz formalmente o topônimo presente no texto ge'ez, sem corrigir silenciosamente a provável corrupção textual.
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  choice: na lua nova do terceiro mês
  rationale: Expressa o sentido calendárico da locução ge'ez de modo claro e natural em português.
- source_word: ፍኖተ፡ ዐዘቅተ፡ መሐላ
  choice: pelo caminho do Poço do Juramento
  rationale: Traduz os elementos do nome geográfico, tradicionalmente identificado com Berseba, preservando a forma descritiva da fonte.
- source_word: ሦዐ፡ መሥዋዕተ
  choice: ofereceu um sacrifício
  rationale: Formulação portuguesa natural que mantém explicitamente o ato sacrificial da fonte.
- source_word: አምላከ፡ አቡሁ፡ ይስሐቅ
  choice: ao Deus de seu pai Isaque
  rationale: Mantém a relação sintática e familiar expressa no ge'ez.
theological_decisions:
- issue: Identificação do lugar de partida
  choice: Manter “Harã” no texto e explicar a dificuldade em nota
  alternative: Corrigir o texto principal para “Hebrom”
  rationale: O ge'ez preservado lê Harã, embora o contexto narrativo favoreça Hebrom. A tradução conserva a evidência textual e não resolve silenciosamente a variante provável.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e nomes bíblicos familiares ao leitor brasileiro. A divisão em duas frases melhora a legibilidade sem alterar a sequência narrativa.
