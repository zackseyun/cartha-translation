base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/028.yaml
  text: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob, whom she bore to Jacob: Dan and Naphtali. And these are the names of their children who came with them into Egypt: the sons of Dan: Hushim and Samon.'
translation:
  language: pt
  text: '[Estes são os nomes dos filhos de Bila, serva] de Raquel, mulher de Jacó, os quais Bila deu à luz a Jacó: Dã e Naftali.[a] Estes são os nomes dos filhos deles que entraram com eles no Egito: os filhos de Dã: Husim e Samom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O início entre colchetes foi restaurado a partir do contexto do versículo, pois não aparece no segmento ge''ez fornecido. Sem essa restauração, o fragmento poderia ser traduzido literalmente: “A Raquel, mulher de Jacó, ela deu à luz a Jacó Dã e Naftali”; porém, o contexto identifica Bila como o sujeito de “deu à luz”.'
    reason: A divisão do capítulo omitiu o começo da frase e deixou o antecedente de “ela” fora do segmento.
lexical_decisions:
- source_word: ብእሲቱ፡ ለያዕቆብ
  choice: mulher de Jacó
  rationale: Reproduz de modo natural a relação expressa pelo genitivo no texto ge'ez.
- source_word: ዘወለደት፡ ለያዕቆብ
  choice: que ela deu à luz para Jacó
  rationale: Mantém o verbo no feminino e evita atribuir o parto a Raquel; no contexto restaurado, o antecedente é Bila.
- source_word: እለ፡ ቦኡ፡ ምስሌሆሙ፡ ውስተ፡ ግብጽ
  choice: que entraram com eles no Egito
  rationale: Tradução direta do movimento de entrada, preservando a referência pronominal plural sem explicitação conjectural.
- source_word: ሑሲም፡ ወሳሞን
  choice: Husim e Samom
  rationale: Transliteração portuguesa simples dos nomes próprios conforme as formas preservadas no ge'ez.
theological_decisions:
- issue: Identidade da mulher que deu à luz Dã e Naftali
  choice: O trecho restaurado identifica Bila como sujeito de “deu à luz”.
  alternative: Traduzir o fragmento isolado como se Raquel tivesse dado à luz Dã e Naftali.
  rationale: O verbo ge'ez está no feminino, mas o início segmentado do versículo fornece Bila como antecedente; isso também evita uma atribuição genealógica incorreta.
translation_notes:
  register: Português atual, claro e digno, com nomes em formas legíveis para o público lusófono. Os colchetes assinalam material restaurado devido a uma falha de segmentação da fonte fornecida; a nota preserva a evidência e a ambiguidade do fragmento.
