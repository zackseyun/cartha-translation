  text: And his sons and the sons of his sons rose up, and they loaded their father and their possessions on wagons. And Israel set out from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt.
translation:
  language: pt
  text: Seus filhos e netos se levantaram e puseram o pai e seus bens nas carroças. Israel partiu do Poço do Juramento[a] no décimo sexto dia do terceiro mês e foi para a terra do Egito.
  philosophy: optimal-equivalence
  footnotes:
