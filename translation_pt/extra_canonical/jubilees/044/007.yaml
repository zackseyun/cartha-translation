  rationale: Mantém o sentido transparente do topônimo na fonte ge'ez, enquanto a nota registra sua identificação tradicional.
- source_word: ተንሥአ
  choice: partiu
  rationale: No contexto de viagem, o verbo de levantar-se e pôr-se em marcha é vertido naturalmente por “partiu”.
- source_word: ምድረ፡ ግብጽ
