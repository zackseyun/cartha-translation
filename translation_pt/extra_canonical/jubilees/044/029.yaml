  text: And Asudi, and Iyak, and Solomon were six. And they died in the year they entered Egypt, and there remained to Dan
translation:
  language: pt
  text: E Asudi, Iyaque e Salomão eram seis. Eles morreram no ano em que entraram no Egito, e restou a Dã[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase continua no versículo seguinte, que identifica quem restou a Dã. Ou: “e Dã permaneceu”.'
    reason: Esclarece a oração truncada e registra a alternativa de leitura sem lhe atribuir uma probabilidade que o segmento isolado não permite estabelecer.
lexical_decisions:
- source_word: ሲድስቱ
  choice: eram seis
  rationale: Reproduz o numeral e a construção elíptica do texto ge'ez sem acrescentar um referente não expresso.
- source_word: ወሞቱ
  choice: Eles morreram
  rationale: Traduz diretamente o verbo no plural, retomando o grupo mencionado.
- source_word: በዓመተ፡ ቦኡ፡ በግብጽ
  choice: no ano em que entraram no Egito
  rationale: Expressa de modo natural em português a relação temporal do ge'ez.
- source_word: ወተርፈ፡ ለዳን
  choice: e restou a Dã
  rationale: Mantém o verbo intransitivo e o valor dativo de ለ-, sem transformar Dã no sujeito; a oração permanece incompleta, como no segmento-fonte.
theological_decisions:
- issue: Identidade do sujeito ou conteúdo que restou a Dã
  choice: Não explicitar no corpo do versículo
  alternative: e Dã permaneceu
  rationale: A gramática aponta para algo ou alguém que restou a Dã, provavelmente especificado na continuação; inverter a relação sintática resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno. Os nomes foram transliterados em formas legíveis; “Iyaque” conserva de perto o nome ge'ez. A sintaxe final foi deliberadamente mantida em suspensão para respeitar a divisão do capítulo e a construção da fonte.
