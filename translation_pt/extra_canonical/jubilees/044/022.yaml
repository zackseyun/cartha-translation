translation:
  language: pt
  text: 'E os filhos de Bila, escrava de Raquel — esposa de Jacó —, que Bila deu à luz para Jacó: Dã e Naftali.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ላእከታ፡ ለራሔል
  choice: escrava de Raquel
  rationale: O termo designa uma serva em condição de dependência e propriedade; “escrava” comunica com clareza essa realidade social, sem suavizá-la.
- source_word: ዘወለደት፡ ለያዕቆብ
  choice: que ela deu a Jacó
  rationale: Embora a expressão possa ser vertida literalmente como “que ela gerou/deu à luz para Jacó”, no contexto o antecedente gramatical mais próximo é Bila; a formulação portuguesa evita atribuir o parto a Raquel e expressa que Bila deu esses filhos a Jacó.
- source_word: ወውሉደ፡ ባላ
  choice: E os filhos de Bila
  rationale: Mantém a estrutura genealógica coordenada do texto e translitera o nome na forma bíblica portuguesa corrente, Bila.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe genealógica preservada. Emprega “escrava” em vez de “serva” ou “criada” para não ocultar a condição social indicada pelo texto. A aposição “mulher de Jacó” foi mantida porque consta no ge’ez e identifica Raquel.
