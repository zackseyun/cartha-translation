  text: 'E os filhos de Zilpa, serva de Lia e mulher de Jacó, que deu à luz para Jacó Gade e Aser, foram Gade e Aser. Estes são os nomes dos filhos deles que entraram com ele no Egito: os filhos de Gade foram Zifiom, Hagi, Suni, Esbom, Eri, Arodi e Areli[a] — sete ao todo.'
