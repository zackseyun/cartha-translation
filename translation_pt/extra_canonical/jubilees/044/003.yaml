  yaml_path: translation/extra_canonical/jubilees/044/003.yaml
  text: And while he was considering sending to Joseph that he should come to him[3], and not going down himself, he remained there seven days, to see in a vision whether he should stay or whether he should go down. And he celebrated the feast of the harvest of the firstfruits of the old grain, for in all the land of Canaan there was not a handful of any seed in the land, because the famine was upon all the beasts and the livestock and the birds and also upon men.
translation:
  language: pt
  text: Enquanto pensava em mandar dizer a José que viesse até ele, e em não descer ele próprio[a], Jacó permaneceu ali sete dias, à espera de uma visão que lhe mostrasse se deveria ficar ou descer. Então celebrou a festa da colheita das primícias do trigo velho[b], pois em toda a terra de Canaã não havia sequer um punhado de semente, porque a fome havia atingido todos os animais selvagens, os rebanhos, as aves e também os seres humanos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação etíope desta primeira frase é difícil. Literalmente, ela aproxima as ideias de mandar chamar José e de Jacó não descer pessoalmente; o sentido provável é que Jacó ponderava chamar José sem descer ao Egito.
    reason: textual_difficulty
  - marker: b
    text: Isto é, trigo armazenado de uma colheita anterior. O texto associa esse trigo à festa da colheita das primícias, embora a fome tivesse deixado a terra sem nova produção.
    reason: historical_context
lexical_decisions:
- source_word: ይሔሊ
  choice: pensava
  rationale: Expressa a deliberação de Jacó sem sugerir uma decisão já tomada.
- source_word: ማእረረ፡ ቀዳሚ፡ ፍሬ
  choice: colheita das primícias
  rationale: Conserva tanto o elemento de 'colheita' quanto o de 'primeiros frutos/primícias', presentes no texto etíope.
- source_word: እምሥርናይ፡ ብሉይ
  choice: com trigo velho
  rationale: ሥርናይ designa trigo, e ብሉይ indica que era velho, isto é, armazenado de uma colheita anterior; a preposição 'com' produz português natural sem ocultar a dificuldade contextual.
- source_word: ዐባር
  choice: fome
  rationale: O substantivo significa 'fome' ou 'carestia' e deve aparecer explicitamente na tradução.
- source_word: አራዊት፡ ለእንስሳ፡ ወለአዕዋፍ
  choice: animais selvagens, os rebanhos, as aves
  rationale: Mantém as três categorias do original, distinguindo os animais selvagens dos animais domésticos.
theological_decisions:
- issue: Função da visão esperada por Jacó
  choice: uma visão que lhe mostrasse se deveria ficar ou descer
  alternative: ver numa visão se ficaria ou desceria
  rationale: Torna clara a função orientadora da visão sem afirmar sua origem nem antecipar seu conteúdo, preservando a tensão narrativa.
- issue: Relação entre o envio de José e a descida de Jacó
  choice: em vez de ele próprio descer
  alternative: e não descer ele próprio
  rationale: A sintaxe transmitida é difícil. A formulação adotada expressa a provável alternativa considerada por Jacó, enquanto a nota registra a incerteza textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com escolhas naturais para leitores brasileiros. O nome 'Jacó' foi explicitado para evitar ambiguidade pronominal no início isolado do versículo. A construção difícil do etíope foi traduzida de modo legível, mas sua incerteza foi preservada em nota.
