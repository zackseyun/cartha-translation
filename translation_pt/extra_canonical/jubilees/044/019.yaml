  text: 'And sons were born to Joseph in Egypt before his father came into Egypt, whom Asenath, the daughter of Potiphar, priest of Heliopolis, bore to him: Manasseh and Ephraim—two.'
translation:
  language: pt
  text: E nasceram a José, no Egito, antes de seu pai chegar ao Egito, Manassés e Efraim — dois —, que Azenate, filha de Potífera, sacerdote de Heliópolis, lhe deu à luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተወልዱ
  choice: nasceram
  rationale: Reproduz diretamente o verbo passivo de nascimento e mantém o foco nos filhos de José.
- source_word: ይባእ
  choice: chegasse
  rationale: No contexto, o verbo indica a chegada/entrada do pai de José no Egito; «chegasse ao Egito» é natural e fiel em português.
- source_word: ወለደት፡ ሎቱ
  choice: lhe deu
  rationale: A expressão significa literalmente «deu à luz para ele»; «lhe deu» preserva a relação parental sem produzir uma formulação pesada.
- source_word: ካህን
  choice: sacerdote
  rationale: Equivalente normal do título religioso atribuído a Potífera.
- source_word: ኤልዮጶሊስ
  choice: Heliópolis
  rationale: Adota a forma portuguesa tradicional do topônimo grego refletido no texto etíope.
