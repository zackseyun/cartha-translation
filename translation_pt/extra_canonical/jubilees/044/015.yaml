  text: 'These are the sons of Jacob and their sons, whom Leah bore to Jacob in Mesopotamia: six, and Dinah their sister, one. And all the persons of Leah’s sons and their sons who came with Jacob their father into Egypt were thirty-three; and with Jacob their father among them, they were thirty-four.'
translation:
  language: pt
  text: 'Estes são os filhos de Jacó e seus filhos, que Lia deu à luz a Jacó na Mesopotâmia: seis filhos e Diná, irmã deles, uma. Todas as pessoas dos filhos de Lia e de seus filhos que entraram no Egito com Jacó, seu pai, eram trinta e três; com Jacó, pai deles, entre elas, eram trinta e quatro.'
  philosophy: optimal-equivalence
