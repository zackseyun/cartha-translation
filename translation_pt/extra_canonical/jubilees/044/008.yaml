  text: And Israel sent Judah before him to his son Joseph, so that he might examine the land of Goshen, because there Joseph had told his brothers to come and dwell, so that they might be near him. And it was the best of the land of Egypt, and near to him, for all of them and for their livestock.
translation:
  language: pt
  text: Israel enviou Judá adiante dele a José, seu filho, para que examinasse[a] a terra de Gósen, pois ali José havia dito a seus irmãos que viessem morar, a fim de ficarem perto dele. Era a melhor parte da terra do Egito[b] e ficava perto dele, para todos eles e para o seu gado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “preparasse”.'
    reason: A tradição textual e tradutória admite a ideia de preparar o lugar, enquanto o contexto também permite entendê-lo como examinar ou reconhecer a terra.
  - marker: b
    text: 'Ou: “Era boa na terra do Egito”.'
    reason: A construção pode ser entendida de modo menos enfático, sem o valor superlativo expresso no texto principal.
lexical_decisions:
- source_word: ያስተዳሉ፡ ምድረ፡ ጌሴም
  choice: examinasse a terra de Gósen
  rationale: No contexto do envio antecipado de Judá, a expressão é vertida como uma ação de examinar ou reconhecer a região; preserva-se em nota a alternativa tradicional “preparar”.
- source_word: ሠናይት፡ በምድረ፡ ግብጽ
  choice: a melhor região da terra do Egito
  rationale: A formulação contextual caracteriza Gósen como parte especialmente boa do Egito; “região” torna explícito em português o referente territorial implícito.
- source_word: ለእንስሳሂ
  choice: para o seu gado
  rationale: Neste contexto doméstico e migratório, o termo designa os animais pertencentes à família, naturalmente expressos como “gado”.
