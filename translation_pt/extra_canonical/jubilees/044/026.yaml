lexical_decisions:
- source_word: ዐሠርቱ፡ ወአሐዱ
  choice: Onze
  rationale: Traduz diretamente a expressão numérica ge'ez e preserva sua forma elíptica, ligada à contagem genealógica precedente.
- source_word: ኵሉ፡ ነፍስ፡ ዘራሔል
  choice: Ao todo, as pessoas de Raquel
  rationale: ነፍስ, literalmente 'alma', funciona aqui como termo de contagem de pessoas; 'ao todo' expressa naturalmente ኵሉ no contexto genealógico.
- source_word: ዐሠርቱ፡ ወአርባዕቱ
  choice: eram catorze
  rationale: Representa diretamente o total numérico indicado pelo ge'ez.
- source_word: ወውሉደ፡ ባላ፡ ላእከታ
  choice: 'E os filhos de Bila, sua serva:'
  rationale: ላእከታ significa 'sua serva' e modifica Bila; a construção introduz a lista que segue, justificando os dois-pontos.
