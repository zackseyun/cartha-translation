  yaml_path: translation/extra_canonical/jubilees/007/004.yaml
  text: And he prepared the kid first, and put some of its blood on the flesh that was on the altar which he had made; and all its fat he offered up on the altar where he had made the burnt offering, and the ox and the ram and the sheep.
translation:
  language: pt
  text: E ele preparou primeiro o cabrito e pôs um pouco do sangue dele sobre a carne que estava no altar que ele havia feito. Depois, fez subir sobre o altar toda a gordura dele, no altar onde havia feito o holocausto, bem como o boi, o carneiro e as ovelhas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A ligação exata da frase final é incerta; também pode ser entendida como: “no altar onde havia feito o holocausto do boi, do carneiro e das ovelhas”.'
    reason: Preserva a ambiguidade sintática da enumeração final no texto etíope, sem tornar explícita uma relação que o original deixa compacta.
lexical_decisions:
- source_word: ማሕስአ
  choice: cabrito
  rationale: O termo designa um filhote de cabra, aqui como animal sacrificial.
- source_word: አንበረ
  choice: pôs
  rationale: Verbo corrente e natural que preserva a ação concreta de colocar o sangue sobre a carne.
- source_word: አዕረገ
  choice: fez subir
  rationale: Mantém a imagem sacrificial de fazer a oferta subir, sem reduzir o verbo simplesmente a “ofereceu”.
- source_word: ስብሖ
  choice: a gordura dele
  rationale: O sufixo possessivo remete ao cabrito; “gordura” é o termo sacrificial apropriado.
- source_word: ምሥዋዕ
  choice: altar
  rationale: Equivalente direto e natural para o local do sacrifício.
- source_word: ጽንሓሐ
  choice: holocausto
  rationale: Expressa a oferta inteiramente queimada no registro bíblico corrente.
theological_decisions:
- issue: Imagem ascensional do sacrifício
  choice: fez subir
  alternative: ofereceu
  rationale: A formulação conserva a imagem do original e sua possível associação com a fumaça da oferta, sem explicá-la teologicamente.
- issue: Relação sintática dos animais ao final do versículo
  choice: bem como o boi, o carneiro e as ovelhas
  alternative: onde havia preparado o holocausto do boi, do carneiro e das ovelhas
  rationale: O texto é sintaticamente compacto e pode ligar a lista à ação sacrificial; a tradução preserva essa tensão, e a nota registra a alternativa.
translation_notes:
  register: Português moderno, digno e acessível, com terminologia sacrificial bíblica. A expressão “fez subir” foi mantida por sua proximidade com a imagem do original; a ordem e a pontuação foram ajustadas para clareza sem eliminar a ambiguidade final.
