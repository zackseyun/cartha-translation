base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/025.yaml
  text: The thoughts and desires of man imagine what is vain and evil continually, and the Lord destroyed everything from the face of the earth because of the evil of their deeds and because of blood.
translation:
  language: pt
  text: Os pensamentos e os desejos do ser humano concebem continuamente o que é vão e mau, e o Senhor destruiu tudo da face da terra por causa de suas más obras e por causa do sangue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ፡
  choice: Os pensamentos e desejos do ser humano
  rationale: Reproduz os dois aspectos da vida interior, pensamento e vontade/desejo, e usa uma formulação inclusiva e natural sem eliminar o referente coletivo humano.
- source_word: ይኄሊ፡
  choice: concebem
  rationale: Mantém o sentido verbal de pensar, imaginar ou conceber, em vez de reduzi-lo a uma cópula.
- source_word: ከንተ፡ ወእኩየ፡
  choice: o que é vão e mau
  rationale: Preserva os dois qualificadores do ge'ez, incluindo a noção de vaidade/futilidade omitida numa redação anterior.
- source_word: በኵሉ፡ መዋዕል።
  choice: continuamente
  rationale: Expressa de modo idiomático a duração constante indicada pelo original.
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እም ... ገጸ፡ ምድር፡
  choice: e o Senhor apagou tudo da face da terra
  rationale: Mantém a imagem de eliminar/apagar da superfície da terra e segue a referência explícita ao Senhor.
- source_word: ወበእንተ፡ ደም፡
  choice: e por causa do sangue derramado
  rationale: No contexto moral, 'sangue' é uma metonímia natural para derramamento de sangue; a explicitação evita uma formulação obscura, sem especificar além disso quem o derramou.
theological_decisions:
- issue: Condição moral humana
  choice: conserva a atividade contínua de conceber o que é vão e mau
  alternative: “são maus continuamente”
  rationale: A alternativa achata o verbo do original e omite a vaidade; a redação escolhida mantém a afirmação severa sem convertê-la numa formulação doutrinária mais ampla.
- issue: Motivo do juízo divino
  choice: por causa da maldade das obras deles e por causa do sangue derramado
  alternative: por causa de suas más obras e do sangue
  rationale: A escolha conserva os dois fundamentos paralelos do juízo e torna inteligível a referência elíptica ao sangue.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por “ser humano” em sentido coletivo. A cadência mantém as duas partes do versículo e sua relação causal; o ponto e vírgula evita uma frase excessivamente fragmentada.
