  yaml_path: translation/extra_canonical/jubilees/007/006.yaml
  text: And he rejoiced and drank some of this wine, he and his sons with joy. And it became evening, and he went into his tent, and being drunk he lay down and slept, and he was uncovered inside his tent while he slept.
translation:
  language: pt
  text: Ele se alegrou e bebeu daquele vinho, ele e seus filhos, com alegria. Quando chegou a tarde, ele entrou em sua tenda e, embriagado, deitou-se e dormiu. E ficou descoberto dentro de sua tenda enquanto dormia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፈሥሐ / በፍሥሓ
  choice: se alegrou / com alegria
  rationale: Preserva a repetição do campo semântico da alegria presente no ge'ez, mantendo uma expressão natural em português.
- source_word: ሰቀላሁ
  choice: sua tenda
  rationale: O termo designa a tenda ou habitação coberta de Noé neste contexto; “tenda” também mantém a ligação tradicional com o episódio paralelo de Gênesis.
- source_word: ስኩሩ
  choice: embriagado
  rationale: Expressa diretamente o estado causado pelo vinho, sem acrescentar avaliação moral ausente da formulação.
- source_word: ተከሥተ
  choice: ficou descoberto
  rationale: Conserva a formulação potencialmente ampla do texto, sem especificar nudez além do que o verbo exige.
theological_decisions:
- issue: Natureza da exposição de Noé
  choice: ficou descoberto
  alternative: ficou nu
  rationale: A tradução preserva a ambiguidade da expressão de origem e evita tornar explícito um detalhe que o texto deste versículo não formula de modo inequívoco.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e leve preservação da repetição semítica. Optou-se por “Ao anoitecer” para tornar natural a expressão temporal sem alterar a sequência narrativa.
