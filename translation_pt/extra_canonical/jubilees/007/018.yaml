base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/018.yaml
  text: The sons of Japheth were Gomer and Magog and Madai and Javan, Tubal and Meshech and Tiras.
translation:
  language: pt
  text: 'E estes são os filhos de Sem: Elão, Assur, Arfaxade — este nasceu dois anos depois do dilúvio —, Lude e Arã.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሴም
  choice: os filhos de Sem
  rationale: Reproduz diretamente a fórmula genealógica do ge'ez e corrige o erro de segmentação que atribuía o versículo aos filhos de Jafé.
- source_word: ኤላም፡ ወአሱር፡ ወአርፋክስድ
  choice: Elão, Assur, Arfaxade
  rationale: Emprega as formas portuguesas bíblicas correntes dos nomes próprios Elam, Asshur e Arpachshad.
- source_word: ዝንቱ፡ ትውልደ፡ ክልኤ፡ ዓም፡ እምድኅረ፡ አይኅ
  choice: este nasceu dois anos depois do dilúvio
  rationale: Mantém a observação parentética ligada a Arfaxade, com redação natural e fiel à indicação temporal do texto.
- source_word: ወሉድ፡ ወአራም
  choice: Lude e Arã
  rationale: Translitera os dois nomes finais em formas reconhecíveis e correntes em português bíblico.
