    issue: “suas próprias normas” acrescenta e distorce a referência à ordem dada aos Vigilantes.
    rationale: O etíope fala de uma ordem/mandamento relacionado aos Vigilantes, não de normas que lhes pertençam. A formulação reflexiva também enfraquece a ideia de violação de uma ordem recebida.
