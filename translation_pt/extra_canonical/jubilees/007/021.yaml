base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/021.yaml
  text: And uncleanness and all lawlessness. For because of these three things the flood came upon the earth[a], because of the fornication by which the Watchers committed fornication contrary to the command of their ordinances, going after the daughters of men, and they took for themselves wives from all whom they chose, and they made the beginning of uncleanness.
translation:
  language: pt
  text: 'E impureza e toda iniquidade. Pois, por causa dessas três coisas, o dilúvio veio sobre a terra: por causa da imoralidade sexual que os Vigilantes praticaram contra a ordem que lhes fora dada, indo atrás das filhas dos homens. Tomaram para si mulheres dentre todas as que escolheram e deram início à impureza.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵስ / ርኵሰ
  choice: impureza
  rationale: Conserva a ideia de contaminação moral expressa pelo termo etíope e mantém a repetição que enquadra o versículo.
- source_word: ዐመፃ
  choice: iniquidade
  rationale: Expressa rebeldia e transgressão moral de modo natural e digno; evita o sentido excessivamente jurídico de “ilegalidade”.
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Comunica claramente a conduta sexual ilícita sem sugerir especificamente prostituição comercial, associação possível em português com “prostituição”.
- source_word: ትጉሃን
  choice: Vigilantes
  rationale: Reproduz a designação tradicional dos seres vigilantes nesse contexto enoquiano e a distingue de uma referência genérica a pessoas atentas.
- source_word: አይኅ
  choice: dilúvio
  rationale: É o equivalente português corrente para a inundação universal evocada pelo contexto.
theological_decisions:
- issue: Identidade dos ትጉሃን
  choice: Vigilantes
  alternative: os que velavam / sentinelas
  rationale: O contexto os apresenta como o conhecido grupo de seres celestes que tomou as filhas dos homens; “Vigilantes” preserva esse título tradicional sem acrescentar uma classificação ontológica não explicitada no versículo.
- issue: Relação entre a imoralidade, o mandamento e as filhas dos homens
  choice: A imoralidade foi praticada contra o mandamento, quando os Vigilantes foram atrás das filhas dos homens.
  alternative: Os Vigilantes transgrediram o mandamento de suas normas por causa das filhas dos homens.
  rationale: A construção etíope é compacta e admite diferenças de ligação sintática. A redação principal conserva tanto a violação do mandamento quanto o movimento em direção às filhas dos homens, sem reduzir um elemento ao outro.
translation_notes:
  register: Português atual, claro e solene, com boa legibilidade brasileira. Manteve-se a abertura fragmentária com “E”, pois o versículo continua a enumeração anterior, bem como a repetição de “impureza”. A nota inglesa sobre nomes de grupos de gigantes não corresponde ao conteúdo deste versículo etíope e, por isso, não foi reproduzida.
