revisions:
- from: 'E impureza e toda iniquidade. Pois foi por causa dessas três coisas que o dilúvio veio sobre a terra: por causa da imoralidade sexual praticada pelos Vigilantes, contrariando o mandamento de suas próprias normas[a], quando foram atrás das filhas dos homens. Eles tomaram para si, dentre todas as que escolheram, mulheres por esposas e deram início à impureza.'
  to: 'E impureza e toda iniquidade. Pois, por causa dessas três coisas, o dilúvio veio sobre a terra: por causa da imoralidade sexual que os Vigilantes praticaram contra a ordem que lhes fora dada, indo atrás das filhas dos homens. Tomaram para si mulheres dentre todas as que escolheram e deram início à impureza.'
  rationale: A revisão substitui a expressão interpretativa e pouco natural “o mandamento de suas próprias normas” por “a ordem que lhes fora dada”, preservando a referência a um mandamento violado sem atribuir normas próprias aos Vigilantes. Mantêm-se a construção causal, a terminologia tradicional “Vigilantes”, a continuação fragmentária inicial e a repetição de “impureza”. A nota foi removida porque não é necessária após a redação neutra e não corresponde à nota inglesa, que é alheia ao conteúdo deste versículo.
