    issue: A nota de rodapé não resolve uma dificuldade textual real e repete de modo pouco útil a formulação do texto principal.
    rationale: A alternativa proposta continua apresentando “suas normas”, elemento que não é necessário para reproduzir o sentido da fonte. Uma tradução principal neutra dispensa a nota.
