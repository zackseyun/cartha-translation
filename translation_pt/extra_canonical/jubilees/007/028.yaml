base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/028.yaml
  text: For three years the fruit of everything that is eaten shall not be gathered; and in the fourth year its fruit shall be gathered, and the firstfruits acceptable before the LORD Most High, who created heaven and earth and everything, shall be offered up. Let them offer in abundance the first wine and oil as firstfruits on the altar of the LORD, who receives it; and what is left over let the servants of the house of the LORD eat before the altar that receives it.
translation:
  language: pt
  text: Durante três anos, não se colherá o fruto de tudo o que serve de alimento; no quarto ano, porém, seu fruto será colhido, e as primícias serão apresentadas perante o SENHOR Altíssimo, que criou o céu, a terra e todas as coisas. Ofereçam com fartura o primeiro vinho e o primeiro azeite como primícias sobre o altar do SENHOR, que recebe essas ofertas; e o que restar seja comido pelos servidores da casa do SENHOR, diante do altar que as recebe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሬሁ፡ ዘኢይትቀሠም፡ እምኵሉ፡ ዘይትበላዕ
  choice: não se colherá o fruto de tudo o que serve de alimento
  rationale: 'A construção com pronome antecipatório em ፍሬሁ é vertida naturalmente como uma relação genitiva: “o fruto de tudo”, e não “seu fruto... de tudo”. ዘይትበላዕ indica aquilo que é comido ou serve de alimento.'
- source_word: ቀዳሜ፡ ፍሬ
  choice: primícias
  rationale: Expressa o primeiro produto da colheita destinado à oferta; “primícias” é corrente, conciso e adequado ao registro cultual.
- source_word: እግዚአብሔር፡ ልዑል
  choice: SENHOR Altíssimo
  rationale: Preserva os dois títulos divinos do texto e segue a convenção bíblica portuguesa para o nome/título divino.
- source_word: በጥሉ
  choice: com fartura
  rationale: O contexto exorta a apresentar generosamente os primeiros produtos; “com fartura” comunica o valor adverbial sem tornar a frase artificial.
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: servidores da casa do SENHOR
  rationale: Mantém a referência aos que servem na casa do SENHOR sem impor uma identificação sacerdotal mais específica do que o texto exige.
theological_decisions:
- issue: Referente de “que as recebe”
  choice: manter o altar como referente gramatical imediato
  alternative: entender o SENHOR como aquele que recebe a oferta
  rationale: A formulação do texto liga a expressão ao altar; a tradução conserva essa construção, sem apagar a noção anterior de que a oferta é apresentada ao SENHOR.
- issue: Caráter normativo da instrução
  choice: usar futuro prescritivo e imperativo
  alternative: uniformizar tudo como simples descrição futura
  rationale: O trecho combina determinação sobre os anos da colheita com exortação cultual; a variação verbal preserva essa força.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi suavizada para evitar o pronome antecipatório estranho em português, sem resolver além do necessário as relações cultuais do texto.
