- from: Durante três anos, não se colherá o fruto de tudo o que serve de alimento; no quarto ano, porém, seu fruto será colhido, e as primícias oferecidas perante o SENHOR Altíssimo, que criou o céu, a terra e todas as coisas, serão apresentadas a ele. Ofereçam com fartura o primeiro vinho e o primeiro azeite como primícias sobre o altar do SENHOR, que as recebe; e o que restar seja comido pelos servidores da casa do SENHOR, diante do altar que as recebe.
