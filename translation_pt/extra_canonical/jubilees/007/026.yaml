  yaml_path: translation/extra_canonical/jubilees/007/026.yaml
  text: which they shed in the midst of the earth. He destroyed everything, and I and you, my children, and all that entered with us into the ark were left. And behold, I see before me your deeds, that you are not walking in righteousness; for you have begun to walk in the paths of corruption, and you are separating, each one from his neighbor, and you will fight one with another, and you will not be united.
translation:
  language: pt
  text: 'que eles derramaram no meio da terra. Ele destruiu tudo, e ficamos eu, vocês, meus filhos, e todos os que entraram conosco na arca. E eis que vejo diante de mim as ações de vocês: vocês não estão andando em justiça, pois começaram a andar pelos caminhos da corrupção; estão se separando, cada um do seu próximo, lutarão uns contra os outros e não permanecerão unidos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከዐዉ
  choice: derramaram
  rationale: O verbo exprime derramar e, pelo contexto do versículo anterior, tem como antecedente o sangue.
- source_word: ደምሰሰ ኵሎ
  choice: Ele destruiu tudo
  rationale: Traduz o verbo de destruição e preserva ኵሎ, “tudo”, que não deve ser omitido.
- source_word: በጽድቅ
  choice: em justiça
  rationale: Mantém a formulação ética e religiosa do original sem restringi-la a uma interpretação denominacional.
- source_word: በፍኖተ ሙስና
  choice: pelos caminhos da corrupção
  rationale: Conserva a metáfora plural de caminhos e o sentido moral de corrupção ou perversão.
- source_word: ትትፋለጡ ... እም ቢጹ
  choice: estão se separando, cada um do seu próximo
  rationale: O verbo indica separação ou divisão, e a preposição እም indica afastamento “de”, não perseguição ou movimento “atrás de” alguém.
- source_word: ኢትሄልዉ ኅቡረ
  choice: não permanecerão unidos
  rationale: Expressa a negação de estar ou permanecer em conjunto, em português natural.
theological_decisions:
- issue: Referente daquele que destrói tudo
  choice: “Ele destruiu tudo”, mantendo o sujeito implícito como referência contextual a Deus
  alternative: “isso destruiu tudo” ou “o que destruiu o centro da terra”
  rationale: A forma verbal está no singular masculino, e o contexto do dilúvio favorece Deus como agente; a tradução não acrescenta explicitamente “Deus”, preservando o grau de explicitação do original.
- issue: Valor de “justiça”
  choice: Manter “justiça” sem paráfrase doutrinária
  alternative: “retidão” ou uma explicação teológica ampliada
  rationale: O termo descreve conduta justa, mas o contexto não autoriza inserir uma definição confessional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”, “ações de vocês”). A alternância entre presente (“estão se separando”) e futuro (“lutarão”, “não permanecerão”) acompanha as formas verbais e a progressão da advertência. O início permanece ligado sintaticamente ao “sangue” mencionado no versículo anterior.
