  yaml_path: translation/extra_canonical/jubilees/007/031.yaml
  text: 'And I also command you, my sons, according to the command that Enoch gave to his son in the first jubilees, while he was still alive in the seventh generation: he commanded and testified to his son and to his sons'' sons until the day of his death.'
translation:
  language: pt
  text: 'E eu também lhes ordeno, meus filhos, conforme Enoque ordenou a seu filho nos primeiros jubileus, enquanto ainda vivia, na sétima geração: ele ordenou e deu testemunho a seu filho e aos filhos de seus filhos, até o dia de sua morte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኤዝዘክሙ (ʾəʾəzzəkəmu)
  choice: lhes ordeno
  rationale: Preserva o sentido direto e solene do verbo de ordenar, com formulação natural em português.
- source_word: በቅድሜ፡ ኢዮቤልውሳት
  choice: nos primeiros jubileus
  rationale: Reproduz o plural da expressão ge'ez e evita reduzir a referência cronológica a um único jubileu.
- source_word: ውስተ፡ ትዝምዱ፡ ሳባስ
  choice: na sétima geração
  rationale: Traduz literalmente a indicação genealógica-temporal do texto.
- source_word: አስምዐ
  choice: deu testemunho
  rationale: O causativo de 'ouvir' pode expressar fazer ouvir, declarar ou atestar; 'deu testemunho' preserva o tom solene sem especificar indevidamente o conteúdo da advertência.
- source_word: ለውሉደ፡ ውሉዱ
  choice: aos filhos de seus filhos
  rationale: Mantém a forma genealógica explícita do original, em vez de substituí-la por um termo mais geral como 'descendentes'.
theological_decisions:
- issue: Natureza da transmissão das ordens de Enoque
  choice: ordenou e deu testemunho
  alternative: ordenou e advertiu solenemente
  rationale: A redação conserva a distinção entre mandar e atestar/proclamar, sem interpretar o segundo verbo apenas como advertência moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção preserva a solenidade testamentária e a sequência cronológica do ge'ez sem harmonização adicional.
