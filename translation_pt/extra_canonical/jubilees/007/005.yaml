base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/005.yaml
  text: And he caused all their flesh to ascend on the altar, and he placed all their offering mixed with oil upon it, and afterward he poured wine into the fire that was on the altar, and put incense on the altar, and caused a pleasing fragrance to ascend, acceptable before the LORD his God.
translation:
  language: pt
  text: E fez subir sobre o altar toda a carne deles; pôs sobre ele toda a oferta deles, misturada com óleo; depois derramou vinho no fogo que estava sobre o altar, pôs incenso sobre o altar e fez subir um aroma agradável, aceitável diante do SENHOR, seu Deus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕረገ
  choice: fez subir
  rationale: Preserva a linguagem sacrificial concreta do texto, em vez de simplificá-la para “queimou” ou “ofereceu”.
- source_word: ሥጋሆሙ
  choice: a carne deles
  rationale: Mantém o referente pronominal plural do ge’ez e a formulação sacrificial direta.
- source_word: ቅብዕ
  choice: óleo
  rationale: Equivalente natural para a substância usada na mistura da oferta; “azeite” seria possível, mas é mais específico do que o termo exige.
- source_word: ወይነ
  choice: vinho
  rationale: Tradução direta do termo ge’ez.
- source_word: ስኂነ
  choice: incenso
  rationale: O termo indica incenso ou substância aromática sem exigir a identificação mais específica “olíbano”.
- source_word: መዐዛ፡ ሠናየ
  choice: um aroma agradável
  rationale: Expressa de modo natural a ideia de uma fragrância boa ou aprazível no contexto sacrificial.
- source_word: እግዚአብሔር
  choice: SENHOR
  rationale: Segue a convenção bíblica portuguesa para o nome/título divino neste contexto e mantém o registro solene.
theological_decisions:
- issue: Relação entre o aroma e a aceitação divina
  choice: “um aroma agradável, aceitável diante do SENHOR”
  alternative: “um aroma agradável que agradou ao SENHOR”
  rationale: A opção escolhida preserva a distinção e a tensão sintática entre a qualidade agradável do aroma e sua aceitabilidade diante de Deus, sem transformar explicitamente o texto em uma declaração sobre emoção divina.
- issue: Valor sacrificial de “fez subir”
  choice: manter a imagem de subida
  alternative: “queimou” ou “ofereceu”
  rationale: Evita interpretar de forma excessiva o mecanismo ritual e conserva a linguagem tradicional de fazer a oferta subir do altar.
translation_notes:
  register: Português moderno, claro e digno, com cadência bíblica moderada. A pontuação organiza a longa sequência ritual sem apagar sua progressão. “SENHOR” em versalete convencional representado por maiúsculas.
