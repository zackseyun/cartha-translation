lexical_decisions:
- source_word: ወቀንአ፡ ለአኁሁ
  choice: ficou com inveja de seu irmão
  rationale: O verbo expressa ciúme ou inveja; no contexto, Jafé vê a cidade do irmão e constrói outra para si, de modo que «inveja» comunica com naturalidade a relação indicada.
- source_word: ወሐነጸ፡ ሎቱ፡ ውእቱሂ፡ ሀገረ
  choice: ele também construiu para si uma cidade
  rationale: Conserva o valor reflexivo de «para si» e a ênfase de «também» presente no texto etíope.
- source_word: ወሰመየ፡ ስማ፡ በስመ፡ ብእሲቱ
  choice: lhe deu o nome de sua esposa
  rationale: Formulação portuguesa natural para o idiomático «chamou seu nome pelo nome de sua esposa», sem alterar o sentido.
- source_word: አዳተኔሴስ
  choice: Adataneses
  rationale: Transliteração da forma etíope, em continuidade com a evidência textual disponível; a segmentação exata do nome é incerta.
