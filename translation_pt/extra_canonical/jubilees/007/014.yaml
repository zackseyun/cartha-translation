  text: And Japheth saw it and became jealous of his brother, and he too built for himself a city and called its name after the name of his wife, Adataneses[a].
translation:
  language: pt
  text: Jafé viu isso e ficou com inveja de seu irmão. Então ele também construiu para si uma cidade e lhe deu o nome de sua esposa, Adataneses.[a]
  philosophy: optimal-equivalence
