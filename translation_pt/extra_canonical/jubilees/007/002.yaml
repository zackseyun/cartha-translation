  text: And he kept its fruit, and gathered it in that year, in the seventh month. And he made wine from it, and put it into a vessel, and kept it until the fifth year, until the first day.
translation:
  language: pt
  text: E guardou o fruto dela e o colheu naquele ano, no sétimo mês. Fez vinho com ele, colocou-o num recipiente e o guardou até o quinto ano, até o primeiro dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas traduções completam: “até o primeiro dia do primeiro mês”; na fonte ge''ez fornecida, “do primeiro mês” pertence ao versículo seguinte.'
    reason: Esclarecer a variante de delimitação versicular registrada na tradição de tradução sem incorporá-la ao texto principal.
lexical_decisions:
- source_word: ዐቀበ
  choice: guardou
  rationale: O verbo pode significar guardar, conservar ou manter; “guardou” é natural e preserva a repetição do termo na passagem.
- source_word: ቀሰሞ
  choice: o colheu
  rationale: No contexto do fruto da vinha, indica recolher ou colher; “colheu” é a formulação portuguesa mais idiomática.
- source_word: ወይነ
  choice: vinho
  rationale: Designa vinho, aqui produzido a partir do fruto mencionado.
- source_word: ንዋይ
  choice: recipiente
  rationale: Termo amplo para utensílio, vaso ou recipiente; a opção evita especificar indevidamente o material ou formato.
theological_decisions:
- issue: Delimitação do fim do versículo
  choice: “até o primeiro dia” no texto principal
  alternative: “até o primeiro dia do primeiro mês”
  rationale: A fonte ge'ez fornecida termina com “até o primeiro dia”; a referência ao primeiro mês pertence ao início do versículo seguinte segundo a delimitação adotada.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe narrativa simples. A repetição de “guardou” foi mantida por refletir a repetição lexical da fonte; “recipiente” preserva a generalidade do original.
