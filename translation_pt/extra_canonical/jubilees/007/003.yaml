base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/003.yaml
  text: 'On the new moon of the first month, he made a feast on that day with rejoicing, and he made a burnt offering to the LORD: one young bull, one ram, seven yearling sheep, and one male goat, so that he might make atonement for himself and for his sons.'
translation:
  language: pt
  text: 'Na lua nova do primeiro mês, ele celebrou naquele dia uma festa com alegria e ofereceu ao SENHOR um holocausto: um novilho, um carneiro, sete cordeiros de um ano e um bode, a fim de fazer expiação por si mesmo e por seus filhos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቀ፡ ወርኀ፡ ቀዳሚት
  choice: lua nova do primeiro mês
  rationale: Mantém explicitamente o marcador calendárico presente no ge'ez, com formulação natural em português.
- source_word: ጽንሓሐ
  choice: holocausto
  rationale: Designa a oferta inteiramente queimada, termo sacrificial consagrado e compreensível no registro bíblico.
- source_word: እምአልህምቱ፡ አሐደ
  choice: um novilho
  rationale: Representa um animal bovino jovem destinado ao sacrifício; “novilho” é mais idiomático em português bíblico do que “touro jovem”.
- source_word: አባግዐ፡ ዘዘ፡ ዓመት፡ ሰብዐተ
  choice: sete ovelhas de um ano
  rationale: Conserva tanto a designação genérica dos ovinos quanto a idade de um ano explicitada no texto, sem acrescentar sexo não indicado com segurança.
- source_word: መሐስአ፡ ጢለ፡ አሐደ
  choice: um bode
  rationale: Expressa de modo claro e corrente o caprino macho da lista sacrificial.
- source_word: ያስተስሪ
  choice: fazer expiação
  rationale: Preserva o sentido cultual e teológico do verbo sem substituí-lo por uma paráfrase interpretativa.
theological_decisions:
- issue: Objeto e beneficiários da expiação
  choice: fazer expiação por si mesmo e por seus filhos
  alternative: obter perdão para si mesmo e para seus filhos
  rationale: A formulação escolhida mantém a linguagem ritual do original e evita reduzir “expiação” apenas a perdão.
- issue: Representação do nome divino
  choice: SENHOR
  alternative: YHWH
  rationale: Segue a convenção bíblica portuguesa amplamente reconhecida para o nome divino, sem introduzir uma vocalização disputada.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia sacrificial bíblica sem arcaísmos desnecessários. A ordem da lista e os detalhes calendárico e etário do ge'ez foram preservados.
