  yaml_path: translation/extra_canonical/jubilees/007/001.yaml
  text: And in the seventh week, in its first year, in this jubilee, Noah planted a vine on the mountain on which the ark had come to rest, whose name was Lubar, one of the mountains of Ararat; and in the fourth year it produced fruit.
translation:
  language: pt
  text: E, na sétima semana, em seu primeiro ano, neste jubileu, Noé plantou uma videira no monte onde a arca repousara, chamado Lubar, um dos montes de Ararate; e, no quarto ano, ela deu fruto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሱባዔ፡ ሳብዕ
  choice: na sétima semana
  rationale: Mantém a terminologia cronológica própria de Jubileus e a sequência explícita do texto ge'ez.
- source_word: ወይነ
  choice: uma videira
  rationale: O termo designa a planta da uva, não simplesmente vinho ou vinha como terreno cultivado.
- source_word: አዕረፈት፡ ታቦት
  choice: a arca havia repousado
  rationale: Reproduz o sentido de a arca ter chegado ao repouso naquele monte, em português natural.
- source_word: ሉባር
  choice: Lubar
  rationale: Transliteração tradicional e clara do topônimo.
- source_word: እምአድባረ፡ አራራት
  choice: um dos montes de Ararate
  rationale: Preserva o plural 'montes' e a relação partitiva expressa na fonte.
- source_word: ገብረ፡ ፍሬ
  choice: deu fruto
  rationale: Expressão portuguesa idiomática que conserva o sentido literal de produzir fruto.
