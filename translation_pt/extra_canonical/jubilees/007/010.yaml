translation:
  language: pt
  text: 'E abençoou Sem e disse: “Bendito seja o SENHOR, Deus de Sem; e seja Canaã seu servo[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “escravo”.
    reason: O substantivo ge'ez ገብር pode ter tanto o sentido amplo de servo quanto o sentido social mais forte de escravo.
lexical_decisions:
- source_word: ይትባረክ (yitbārak)
  choice: Bendito seja
  rationale: Preserva a forma de bênção dirigida ao SENHOR e soa natural no registro bíblico português.
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: SENHOR
  rationale: Representa o nome divino segundo a convenção bíblica portuguesa, em harmonia com o paralelo tradicional de Gênesis 9:26.
- source_word: ገብሮ (gabro)
  choice: servo
  rationale: O termo pode designar servo ou escravo. “Servo” mantém a formulação digna e tradicional sem ocultar a acepção mais forte, registrada em nota.
theological_decisions:
- issue: Referente do pronome possessivo em “seu servo”
  choice: Manter “seu” sem explicitar o referente
  alternative: “servo de Sem” ou “servo do SENHOR”
  rationale: A construção fonte permite tensão referencial; explicitar Sem ou o SENHOR resolveria uma ambiguidade que o texto não resolve formalmente.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem e o paralelismo da bênção foram preservados, e a ambiguidade pronominal não foi eliminada.
