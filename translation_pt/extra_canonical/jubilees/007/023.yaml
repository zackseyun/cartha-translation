lexical_decisions:
- source_word: ሰብእሂ፡ ቢጾ
  choice: um homem, o seu próximo
  rationale: Mantém a formulação elíptica do ge'ez e sua ligação provável com o contexto anterior, sem acrescentar um verbo ou uma preposição que não aparecem no trecho fornecido.
- source_word: ኵሉ
  choice: todos
  rationale: Expressa de modo natural o sentido distributivo ou coletivo de 'todos/cada um'.
- source_word: ተሰይጠ
  choice: se venderam
  rationale: Preserva a imagem forte e reflexiva de vender a si mesmo, em vez de atenuá-la para 'se entregaram'.
- source_word: ይግበር፡ ዐመፃ
  choice: praticar a injustiça
  rationale: Reproduz a construção 'fazer/praticar injustiça' em português corrente e digno.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ
  choice: derramar muito sangue
  rationale: Segue diretamente a imagem e a quantidade expressas no ge'ez.
