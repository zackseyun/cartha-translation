  text: e um homem, o seu próximo.[a] E todos se venderam para praticar a injustiça e derramar muito sangue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão inicial é elíptica e parece concluir uma oração iniciada no contexto anterior; literalmente, “e um homem, o seu próximo”.
