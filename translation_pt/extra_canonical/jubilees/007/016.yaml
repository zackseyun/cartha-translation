  text: 'And behold, these three cities are near Mount Lubar: Sedeqetelebab in front of the mountain toward its east, Ne''elatama''uk toward the south, and Adataneses toward the sea.'
translation:
  language: pt
  text: 'E estas três cidades ficavam perto do monte Lubar: Sedeqetelebab, diante do monte, a leste; Neelat-Mauque, ao norte[a]; e Adataneses, em direção ao mar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra leitura: “ao sul”.'
    reason: A camada inglesa auditada e sua revisão registram “sul”, mas o texto ge’ez apresentado lê ሰሜን, “norte”; a nota preserva a divergência textual sem alterar silenciosamente a fonte fornecida.
lexical_decisions:
- source_word: ናሁ (nāhu)
  choice: E
  rationale: Introduz a observação sem o peso artificial de uma tradução literal como “e eis”; o valor apresentativo permanece no fluxo narrativo.
- source_word: ሠላስ፡ ቅሩበ (śalās qrūba)
  choice: estas três cidades ficavam perto
  rationale: O contexto identifica como cidades os três nomes próprios; “ficavam perto” expressa naturalmente a localização.
- source_word: ቅድመ፡ ገጸ፡ ደብር፡ በጽባሒሁ
  choice: diante do monte, a leste
  rationale: 'Conserva os dois elementos geográficos: a posição diante da face do monte e sua orientação oriental.'
- source_word: ገጸ፡ ሰሜን (gaṣa samēn)
  choice: ao norte
  rationale: O texto etíope fornecido traz explicitamente ሰሜን, “norte”; a variante “sul” é registrada em nota devido à divergência da tradição consultada.
- source_word: መንገለ፡ ባሕር (mangala bāḥr)
  choice: em direção ao mar
  rationale: Mantém a referência relativa ao mar sem especificar qual mar nem converter a expressão em um ponto cardeal.
theological_decisions: []
