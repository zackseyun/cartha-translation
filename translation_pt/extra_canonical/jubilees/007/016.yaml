  verdict: revise
  source_fidelity: A direção no texto ge’ez fornecido é ሰሜን (samēn), «norte». Portanto, «ao norte» deve permanecer no texto principal. A versão inglesa auditada («toward the south») diverge da edição-fonte apresentada e não deve prevalecer sobre ela. A localização de Sedeqetelebab diante do monte, para o leste, e a de Adataneses em direção ao mar são preservadas.
  naturalness: A redação é clara, mas «estão perto» reproduz melhor o valor apresentativo e presente de «E eis que estas três cidades...» do que «ficavam perto». A grafia dos nomes pode seguir mais de perto a transliteração da fonte inglesa, sem hífen não atestado em Ne'elatama'uk.
  terminology: Os topônimos são mantidos como nomes próprios transliterados. A nota deve descrever a divergência entre a tradução inglesa de auditoria e a edição ge’ez fornecida, não apresentá-la como «outra leitura» textual, pois os dados fornecidos não documentam uma variante manuscrita.
  issues:
  - severity: medium
    issue: A nota caracteriza «ao sul» como «Outra leitura».
    rationale: O material fornecido mostra uma divergência de tradução/auditoria, não uma variante textual documentada. A edição ge’ez citada lê explicitamente «norte».
  - severity: low
    issue: «ficavam perto» muda desnecessariamente a apresentação presente do enunciado.
    rationale: «Estão perto» é mais direto, natural e mais próximo do valor do texto-fonte.
  - severity: low
    issue: «Neelat-Mauque» introduz hífen e adapta a forma do nome além do necessário.
    rationale: «Ne'elatama'uk» conserva de modo mais transparente a forma transliterada atestada no registro inglês e evita segmentação especulativa.
  revised_text: 'E eis que estas três cidades estão perto do monte Lubar: Sedeqetelebab, diante do monte, a leste; Ne''elatama''uk, ao norte[a]; e Adataneses, em direção ao mar.'
  revised_footnotes:
  - marker: a
    text: A tradução inglesa de referência traz «ao sul», mas a edição ge’ez fornecida lê «ao norte».
    reason: Registra transparentemente a divergência de auditoria sem alegar uma variante textual não documentada.
  revision_rationale: A revisão mantém «ao norte», conforme a edição ge’ez fornecida, ajusta o tempo verbal à formulação apresentativa do original, regulariza a transliteração do topônimo e reformula a nota para que ela identifique corretamente uma divergência entre os materiais de controle.
