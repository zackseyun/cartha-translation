  source_fidelity: 'A tradução cobre a extensão integral do texto ge''ez fornecido, incluindo as instruções agrícolas e sobre primícias que o rastro inglês não contém. Contudo, algumas escolhas interpretam além do texto: «poderão» enfraquece o futuro advertencial; «culpa por sangue» substitui a imagem de sangue que aparece sobre os destinatários; «obra de misericórdia» é mais específico que «boa obra/ato benéfico»; e «diante de vocês» foi ligado a «cubram» em vez da proibição de comer sangue. A expressão final parece referir-se aos sacerdotes/servidores cultuais, não genericamente a todos os servidores da casa.'
  naturalness: O português é fluente, moderno e adequado ao registro exortativo. A revisão abaixo preserva essa legibilidade, torna a sequência da proibição mais clara e conserva a metáfora de ser «plantados em justiça».
  terminology: «Sheol» é apropriado. «Lugar de julgamento» traduz com maior neutralidade a expressão fonte do que «lugar de condenação». «Seres vivos» evita a construção pouco natural «ser de carne», sem perder a referência a toda criatura/carne. «Sacerdotes» no último segmento é a leitura cultual mais provável de «os sacerdotes da casa do Senhor».
  issues:
  - severity: medium
    issue: Futuro advertencial vertido como possibilidade
    rationale: '«vocês poderão derramar» introduz possibilidade onde o texto apresenta a consequência em futuro: «derramarão».'
  - severity: medium
    issue: «Que não recaia ... culpa por sangue» interpreta a formulação imagética
    rationale: O ge'ez diz literalmente que nenhum sangue apareça/esteja sobre eles; isso pode implicar culpa, mas não a explicita. «Que nenhum sangue recaia sobre vocês» preserva melhor a imagem e a ambiguidade.
  - severity: medium
    issue: «Obra de misericórdia» é uma especificação interpretativa
    rationale: O termo pode significar esmola, boa obra ou ato benéfico. No contexto, «façam um ato de bondade em favor de vocês mesmos» é mais aberto e natural.
  - severity: medium
    issue: Posicionamento de «diante de vocês»
    rationale: 'Na fonte, a expressão acompanha «não comam sangue»: «sejam firmes para não comer sangue diante de vocês»; o imperativo seguinte é «cubram o sangue».'
  - severity: low
    issue: «Sejam estabelecidos» reduz a imagem vegetal
    rationale: O verbo significa «ser plantado». Como o próprio texto imediatamente passa ao plantio, «sejam plantados em justiça» é natural e preserva a metáfora.
  - severity: medium
    issue: Agentes que comem o restante das primícias
    rationale: A expressão final designa provavelmente os sacerdotes da casa do Senhor. «Servidores» é possível, mas excessivamente genérico no contexto de altar e ofertas.
  revised_text: 'Meus filhos, [amem] uns aos outros.[a] Pois vejo, e eis que os demônios começaram a pecar contra vocês e contra seus filhos; e agora temo por vocês: depois da minha morte, vocês derramarão sangue humano sobre a terra e serão vocês mesmos exterminados da face da terra. Pois todo aquele que derramar sangue humano, e todo aquele que comer o sangue de qualquer ser vivo, serão exterminados da terra. Não restará sobre a terra homem algum que coma sangue ou derrame sangue humano; não lhe restarão descendência nem sobrevivente debaixo do céu. Pois irão para o Sheol, descerão ao lugar de julgamento e todos entrarão nas profundas trevas por uma morte violenta.


    Que nenhum sangue recaia sobre vocês, de todo o sangue derramado em todos os dias em que abaterem qualquer animal selvagem, animal doméstico ou criatura que rasteje sobre a terra. Façam um ato de bondade em favor de vocês mesmos, cobrindo com terra aquilo que foi derramado sobre a face da terra. Não sejam como quem come com o sangue; sejam firmes para não comer sangue diante de vocês. Cubram o sangue, pois assim fui ordenado a testemunhar a vocês e a seus filhos, juntamente com toda carne. Não comam a vida com a carne, para que o sangue de vocês, que é a sua vida, não seja exigido da mão de qualquer ser vivo que o derrame sobre a terra. Pois a terra não será purificada do sangue que foi derramado sobre ela, a não ser pelo sangue daquele que o derramou; assim a terra será purificada em todas as suas gerações.


    Agora, meus filhos, escutem: pratiquem o direito e a justiça, para que sejam plantados em justiça sobre a face de toda a terra e para que a glória de vocês seja elevada diante do meu Deus, que me salvou das águas do dilúvio.


    E eis que vão e construam cidades para vocês; plantem nelas toda planta que há sobre a terra e toda árvore que dá fruto. Durante três anos, o seu fruto não será colhido nem comido. No quarto ano, seu fruto será colhido, e as primícias serão oferecidas diante do Senhor Altíssimo, que criou o céu, a terra e todas as coisas. As primícias do vinho, do azeite e de todo fruto serão oferecidas primeiro sobre o altar do Senhor, para que sejam aceitas; e o que restar será comido pelos sacerdotes da casa do Senhor.[b]'
  revised_footnotes:
  - marker: a
    text: O início da frase é elíptico no texto ge'ez preservado, literalmente algo como «Meus filhos, um com seu irmão». O verbo «amem» é suprido pelo contexto.
    reason: textual_or_elliptical_reading
  - marker: b
    text: A longa instrução sobre sangue, homicídio, plantio e primícias aparece reunida em um único versículo nos dados preservados aqui, embora corresponda provavelmente a várias unidades de versículos em edições mais completas.
    reason: segmentation_note
  revision_rationale: A revisão mantém o texto completo transmitido e o registro da versão proposta, mas restaura futuros e imagens explícitas do ge'ez, evita especificações desnecessárias em passagens semanticamente amplas e ajusta a sintaxe das proibições. Também retém «Sheol» e «lugar de julgamento» sem impor identificação teológica posterior.
