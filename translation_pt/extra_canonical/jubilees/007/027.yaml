revisions:
- from: 'Meus filhos, [amem] uns aos outros.[a] Pois eu vejo que os demônios já começaram a pecar contra vocês e contra seus filhos. Agora temo por vocês: depois da minha morte, vocês poderão derramar sangue humano sobre a terra e ser também exterminados da face da terra. Pois todo aquele que derramar sangue humano, e todo aquele que comer o sangue de qualquer ser de carne, será exterminado da terra. Não restará homem algum que coma sangue ou derrame sangue humano sobre a terra; não lhe restarão descendência nem posteridade viva debaixo do céu. Eles irão para o Sheol, descerão ao lugar de condenação e entrarão todos nas trevas do abismo por meio de uma morte violenta.


    Que não recaia sobre vocês culpa por sangue algum, sempre que matarem um animal selvagem, um animal doméstico ou qualquer criatura que rasteje sobre a terra. Façam uma obra de misericórdia em favor de sua própria vida, cobrindo com terra o sangue derramado sobre a superfície do solo. Não sejam como quem come carne com o sangue; mantenham-se firmes e não comam sangue. Cubram o sangue diante de vocês, pois assim recebi ordem de testemunhar a vocês, aos seus filhos e a todos os seres de carne. Não comam a vida junto com a carne, para que o sangue de vocês — a sua vida — não seja exigido da mão de nenhum ser de carne que o derrame sobre a terra. Pois a terra não pode ser purificada do sangue derramado sobre ela; somente pelo sangue daquele que o derramou a terra será purificada, por todas as suas gerações.


    Agora, meus filhos, escutem: pratiquem a justiça e a retidão, para que sejam estabelecidos com justiça sobre toda a face da terra e para que a glória de vocês seja elevada diante do meu Deus, que me salvou das águas do dilúvio.


    Agora, vão, construam cidades para vocês e plantem nelas toda espécie de planta da terra e toda árvore frutífera. Durante três anos, não se colherá nem se comerá seu fruto. No quarto ano, seu fruto será colhido, e as primícias serão apresentadas diante do Senhor Altíssimo, que criou o céu, a terra e todas as coisas. Assim, serão apresentadas no altar do Senhor, para que sejam aceitas, as primícias do vinho e do azeite, juntamente com as primícias dos frutos; e o que restar será comido pelos servidores da casa do Senhor.[b]'
