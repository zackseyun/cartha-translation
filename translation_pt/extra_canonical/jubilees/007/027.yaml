lexical_decisions:
- source_word: '*አውሉድየ፡ አሐዱ፡* ምስለ፡ እኁሁ'
  choice: Meus filhos, [amem] uns aos outros
  rationale: O texto transmitido é elíptico, literalmente algo como “meus filhos, um com seu irmão”; o verbo necessário ao sentido é suprido entre colchetes, em consonância com a evidência de tradução antiga, sem ocultar a lacuna.
- source_word: ሲኦል
  choice: Sheol
  rationale: Mantém o nome tradicional do mundo dos mortos, sem o identificar automaticamente com uma formulação teológica posterior como “inferno”.
- source_word: መካን፡ ዘይደኑ
  choice: lugar de condenação
  rationale: Expressa o lugar associado ao julgamento/condenação, preservando a imagem escatológica sem acrescentar detalhes não presentes.
- source_word: ምጽዋተ፡ ላዕለ፡ ነፍስክሙ
  choice: uma obra de misericórdia em favor de sua própria vida
  rationale: ምጽዋት pode designar esmola ou ato misericordioso; no contexto, trata-se do benefício moral de cobrir o sangue, não de uma doação monetária.
- source_word: ለነፍስ፡ ምስለ፡ ሥጋ
  choice: a vida junto com a carne
  rationale: נפש/Ge'ez ነፍስ pode significar vida ou alma; “vida” comunica melhor a identificação contextual da vida com o sangue.
- source_word: ትትከሉ፡ በጽድቅ
  choice: sejam estabelecidos com justiça
  rationale: A metáfora literal é “ser plantado em justiça”; a formulação portuguesa mantém o sentido de estabilidade e enraizamento sem soar acidentalmente agrícola no meio da exortação ética.
- source_word: ባእዛኒ፡ ቤተ፡ እግዚአብሔር
  choice: servidores da casa do Senhor
  rationale: O termo refere-se aos vinculados ao serviço da casa/santuário; “servidores” evita especificar uma classe sacerdotal além do que a forma lexical exige.
theological_decisions:
- issue: Responsabilidade pelo sangue derramado
  choice: “o sangue de vocês — a sua vida — não seja exigido”
  alternative: “a alma de vocês não seja buscada”
  rationale: A escolha conserva a ligação explícita entre sangue e vida no contexto, sem formular uma doutrina independente sobre a natureza da alma.
- issue: Purificação da terra pelo sangue do homicida
  choice: “somente pelo sangue daquele que o derramou a terra será purificada”
  alternative: paráfrase mitigada sobre punição judicial
  rationale: Preserva a afirmação forte e sua tensão teológica, sem suavizá-la nem explicar o mecanismo de expiação ou justiça.
- issue: Destino dos transgressores
  choice: “Sheol... lugar de condenação... trevas do abismo”
  alternative: “inferno”
  rationale: Mantém distintas as três expressões do texto e não as funde em uma categoria confessional posterior.
translation_notes:
  register: Português moderno, claro e digno, com formas brasileiras amplamente compreensíveis (“vocês”, “seus filhos”). A tradução segue de perto as repetições e imagens jurídicas do ge'ez, mas ajusta a sintaxe para leitura natural. Termos potencialmente confessionais foram evitados quando o original permite formulação mais aberta.
