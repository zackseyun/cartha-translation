base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/027.yaml
  text: 'My children, [love] one another. For I see, and behold, the demons have begun to sin against you and against your children, and now I fear for you, that after my death you will shed the blood of men on the earth, and you yourselves will be destroyed from the face of the earth. For everyone who sheds the blood of man[a], and everyone who eats the blood of any flesh, will all be destroyed from the earth. And no man who eats blood, or who sheds the blood of man on the earth, will be left; neither seed nor descendants will remain to him under heaven. For into Sheol they will go, and into the place of judgment they will descend, and into the darkness of the deep they will all enter by a violent death. Let no blood appear upon you from all the blood there is in all the days in which you slaughter any beast or cattle or whatever creeps on the earth; and do a good work for your souls by covering with earth that which has been poured out on the face of the earth. And do not be like one who
    eats with the blood, but be strong not to eat blood before you; cover the blood, for thus I have been commanded to testify to you and to your children, together with all flesh. And do not eat the life with the flesh, so that your blood, which is your life, may not be required from the hand of any flesh that sheds it on the earth. For the earth will not be cleansed from the blood that has been poured out upon it, except by the blood of the one who poured it out will the earth be cleansed throughout all its generations. And now, my children, listen: do justice and righteousness, so that you may be planted in righteousness over the face of the whole earth, and your glory may be lifted up before my God, who saved me from the waters of the flood. And behold, go and build for yourselves cities, and plant in them every plant that is on the earth, and every fruit-bearing tree.'
translation:
  language: pt
  text: 'Meus filhos, [amem] uns aos outros.[a] Pois vejo, e eis que os demônios começaram a pecar contra vocês e contra seus filhos; e agora temo por vocês: depois da minha morte, vocês derramarão sangue humano sobre a terra e serão vocês mesmos exterminados da face da terra. Pois todo aquele que derramar sangue humano, e todo aquele que comer o sangue de qualquer ser vivo, serão exterminados da terra. Não restará sobre a terra homem algum que coma sangue ou derrame sangue humano; não lhe restarão descendência nem sobrevivente debaixo do céu. Pois irão para o Sheol, descerão ao lugar de julgamento e todos entrarão nas profundas trevas por uma morte violenta.


    Que nenhum sangue recaia sobre vocês, de todo o sangue derramado em todos os dias em que abaterem qualquer animal selvagem, animal doméstico ou criatura que rasteje sobre a terra. Façam um ato de bondade em favor de vocês mesmos, cobrindo com terra aquilo que foi derramado sobre a face da terra. Não sejam como quem come com o sangue; sejam firmes para não comer sangue diante de vocês. Cubram o sangue, pois assim fui ordenado a testemunhar a vocês e a seus filhos, juntamente com toda carne. Não comam a vida com a carne, para que o sangue de vocês, que é a sua vida, não seja exigido da mão de qualquer ser vivo que o derrame sobre a terra. Pois a terra não será purificada do sangue que foi derramado sobre ela, a não ser pelo sangue daquele que o derramou; assim a terra será purificada em todas as suas gerações.


    Agora, meus filhos, escutem: pratiquem o direito e a justiça, para que sejam plantados em justiça sobre a face de toda a terra e para que a glória de vocês seja elevada diante do meu Deus, que me salvou das águas do dilúvio.


    E eis que vão e construam cidades para vocês; plantem nelas toda planta que há sobre a terra e toda árvore que dá fruto. Durante três anos, o seu fruto não será colhido nem comido. No quarto ano, seu fruto será colhido, e as primícias serão oferecidas diante do Senhor Altíssimo, que criou o céu, a terra e todas as coisas. As primícias do vinho, do azeite e de todo fruto serão oferecidas primeiro sobre o altar do Senhor, para que sejam aceitas; e o que restar será comido pelos sacerdotes da casa do Senhor.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O início da frase é elíptico no texto ge'ez preservado, literalmente algo como «Meus filhos, um com seu irmão». O verbo «amem» é suprido pelo contexto.
    reason: textual_or_elliptical_reading
  - marker: b
    text: A longa instrução sobre sangue, homicídio, plantio e primícias aparece reunida em um único versículo nos dados preservados aqui, embora corresponda provavelmente a várias unidades de versículos em edições mais completas.
