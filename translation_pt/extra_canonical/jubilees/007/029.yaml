base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/029.yaml
  text: And in the fifth year make the release[a], so that you may release it in righteousness and uprightness, and you will be righteous, and all your planting will prosper.
translation:
  language: pt
  text: No quinto ano, façam a liberação[a], para que a realizem com justiça e retidão. Assim, vocês serão justos, e tudo o que plantarem prosperará.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A ordem relativa ao quinto ano é difícil de precisar. “Liberação” traduz um termo que pode significar deixar, soltar ou renunciar, provavelmente em referência a uma prática agrícola ligada às instruções anteriores sobre as primícias.
    reason: alternative_reading
lexical_decisions:
- source_word: ኅድገተ (ḥədgata)
  choice: liberação
  rationale: O substantivo deriva da ideia de deixar, soltar ou renunciar. “Liberação” preserva a indeterminação do mandamento agrícola sem impor uma prática específica não explicitada no texto.
- source_word: በጽድቅ፡ ወበርኅብ (ba-ṣədq wa-ba-rəḥb)
  choice: com justiça e retidão
  rationale: A expressão descreve o modo correto de cumprir o mandamento. “Justiça e retidão” mantém o paralelismo ético em português natural e digno.
- source_word: ወትጸድቁ (wa-təṣaddəqu)
  choice: vocês serão justos
  rationale: Mantém como oração independente a afirmação explícita sobre os destinatários, sem fundi-la com a oração seguinte sobre o plantio.
- source_word: ወይረኅብ፡ ኵሉ፡ ተክልክሙ (wa-yərəḥb kʷəllu taklakəmu)
  choice: e tudo o que plantarem prosperará
  rationale: O verbo comunica ampliação ou prosperidade; a formulação idiomática expressa que todo o plantio terá bom desenvolvimento.
theological_decisions:
- issue: Natureza da ordem referente ao quinto ano
  choice: Manter o termo geral “liberação” e explicar sua incerteza em nota
  alternative: Identificá-la diretamente como pousio, remissão ou abandono da colheita
  rationale: O texto não define com precisão a prática. Uma identificação específica resolveria indevidamente uma ambiguidade histórica e legal genuína.
- issue: Relação entre a justiça dos destinatários e a prosperidade do plantio
  choice: Traduzir como duas afirmações coordenadas distintas
  alternative: “Todo o plantio de vocês será justo e próspero”
  rationale: A forma verbal referente aos destinatários declara explicitamente que eles serão justos; a oração seguinte trata separadamente de todo o plantio.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais na terceira pessoa do plural para ampla legibilidade brasileira. A expressão técnica foi mantida deliberadamente geral, e a sintaxe distingue a justiça das pessoas da prosperidade do plantio.
