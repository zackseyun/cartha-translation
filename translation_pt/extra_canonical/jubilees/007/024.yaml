  text: And the earth was filled with violence. And after this they sinned against the beasts and birds and everything that moves and everything that walks upon the earth, and much blood was shed upon the earth, and all—
translation:
  language: pt
  text: E a terra se encheu de violência. Depois disso, eles pecaram contra os animais, as aves, tudo o que se move e tudo o que anda sobre a terra; muito sangue foi derramado sobre a terra, e tudo—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  choice: violência
  rationale: Expressa naturalmente a ideia de violência ou injustiça grave no contexto, em correspondência com a terra que se enche dela.
- source_word: አበሱ፡ ሎሙ፡ በአራዊት
  choice: pecaram contra os animais
  rationale: O pronome antecipatório remete aos animais, e a construção indica que estes são o alvo do pecado; evita a leitura gramaticalmente inadequada de que pecaram contra si mesmos com animais.
- source_word: አዕዋፍ
  choice: aves
  rationale: Equivalente português direto e corrente.
- source_word: ዘይትሐወስ
  choice: tudo o que se move
  rationale: Mantém a categoria ampla indicada pelo particípio sem restringi-la a uma espécie específica.
- source_word: ዘያንሶሱ
  choice: tudo o que anda
  rationale: Reproduz a segunda categoria de seres terrestres em linguagem natural, preservando seu paralelismo com 'tudo o que se move'.
- source_word: ወትክዐወ፡ ደም፡ ብዙኅ
  choice: muito sangue foi derramado
  rationale: Construção idiomática em português que conserva a passiva e a ênfase na grande quantidade de sangue.
theological_decisions:
- issue: Natureza do pecado contra os animais
  choice: pecaram contra os animais
  alternative: pecaram contra si mesmos com animais
  rationale: A sintaxe do ge'ez favorece os animais e as aves como referentes do pronome antecipatório e como alvos do pecado. A opção evita introduzir uma interpretação de bestialidade que o texto não exige.
- issue: Final incompleto do trecho fornecido
  choice: e tudo—
  alternative: completar a oração com material do versículo seguinte ou de outra testemunha
  rationale: O texto-fonte fornecido termina em 'e tudo'; o travessão preserva honestamente a interrupção sem inventar uma conclusão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A coordenação e as repetições foram mantidas para refletir o ritmo cumulativo do ge'ez; o final abrupto foi preservado.
