translation:
  language: pt
  text: Que Deus dê amplo espaço a Jafé, e que Deus habite nas moradas de Sem; e que Canaã seja seu escravo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያስፋሕ (yāsfāḥ)
  choice: dê amplo espaço
  rationale: Expressa de modo natural o sentido causativo de alargar ou ampliar, preservando a ideia espacial e a possível alusão ao nome de Jafé.
- source_word: እግዚአብሔር (ʾEgziʾabəḥer)
  choice: Deus
  rationale: O termo da fonte designa Deus; não há evidência do tetragrama que justifique “SENHOR”.
- source_word: ይኅድር (yəḥəddər)
  choice: habite
  rationale: Mantém o sentido de residir ou estabelecer morada, sem explicar quem seria representado por essa presença.
- source_word: ማኅደሪ (maḥdari)
  choice: moradas
  rationale: Reproduz o sentido amplo de lugares de habitação e acompanha o registro poético da bênção.
- source_word: ገብሮ (gabra)
  choice: seu escravo
  rationale: O termo indica serviço em condição servil; “escravo” comunica essa força melhor que o mais genérico “servo”.
theological_decisions:
- issue: Sujeito da habitação nas moradas de Sem
  choice: “que Deus habite”
  alternative: “que ele habite” (referindo-se a Jafé)
  rationale: A fonte repete explicitamente o termo para Deus antes do verbo; por isso, Deus permanece como sujeito, sem harmonização interpretativa com leituras alternativas de Gênesis 9:27.
- issue: Referente do possessivo em “seu escravo”
  choice: Manter “seu” sem explicitar o referente
  alternative: “escravo de Jafé”, “escravo de Sem” ou “escravo deles”
  rationale: A forma pronominal da fonte não resolve de maneira inequívoca o referente no contexto imediato; a tradução preserva essa ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com cadência de bênção poética. A repetição de “Deus” foi mantida por corresponder à fonte etíope e para evitar a inserção indevida de “SENHOR”. O possessivo ambíguo foi preservado.
