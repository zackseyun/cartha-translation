base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/019.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee Noah began to command the ordinances and the commandments to his sons' sons, and all the judgments that he knew; and he testified to his sons that they should do righteousness, and that they should cover the shame of their flesh, and that they should bless their Creator, and honor father and mother, and each one love his neighbor, and guard themselves from fornication and uncleanness and all injustice.
translation:
  language: pt
  text: Estes são os filhos de Noé. No vigésimo oitavo jubileu, Noé começou a ordenar aos filhos de seus filhos os preceitos e os mandamentos, bem como todos os juízos que conhecia. Ele instruiu seus filhos a praticarem a justiça, cobrirem a nudez de seus corpos, bendizerem aquele que os criou, honrarem pai e mãe, cada um amar o seu próximo e guardarem a si mesmos da imoralidade sexual, da impureza e de toda injustiça.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ወትእዛዛተ
  choice: os estatutos e os mandamentos
  rationale: Mantém a distinção entre prescrições estabelecidas e ordens, em linguagem bíblica clara e atual.
- source_word: ፍትሐ
  choice: normas de justiça
  rationale: O termo pode indicar juízos, decisões ou direito; esta formulação preserva o sentido normativo no contexto da instrução de Noé.
- source_word: ኃፍረተ፡ ሥጋሆሙ
  choice: a nudez de seu corpo
  rationale: A expressão etíope significa literalmente a vergonha do corpo/carne e, no contexto, refere-se à nudez; a tradução comunica isso naturalmente sem apagar a conotação de pudor.
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Expressa de modo amplo e contemporâneo a conduta sexual ilícita indicada pelo termo, sem restringi-la indevidamente a um único ato.
- source_word: ዐመፃ
  choice: injustiça
  rationale: O termo abrange transgressão, violência e injustiça; 'injustiça' se ajusta à enumeração ética e preserva sua amplitude moral.
theological_decisions:
- issue: Identidade daquele que deve ser bendito
  choice: aquele que os criou
  alternative: seu Criador
  rationale: Conserva a referência explícita ao ato criador sem acrescentar uma identificação teológica além do texto.
- issue: Objeto do amor recíproco
  choice: cada um o seu próximo
  alternative: uns aos outros / cada um o seu companheiro
  rationale: O original fala de cada pessoa amar seu semelhante ou companheiro; 'próximo' é natural, abrangente e não limita a ordem aos irmãos de sangue.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura cumulativa da exortação foi preservada, mas organizada com pontuação natural. 'Filhos de seus filhos' foi mantido em vez de simplesmente 'netos' para refletir a formulação do texto-fonte e permitir um alcance mais amplo aos descendentes.
