base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/020.yaml
  text: And in the twenty-eighth jubilee, Noah began to command the ordinances and the commandments to his children's children, and all the judgments[a] that he knew. And he testified to his children that they should do righteousness, and cover the shame of their flesh, and bless their Creator,[b] and honor father and mother, and love each one his neighbor, and guard their souls from fornication and uncleanness and all iniquity.
translation:
  language: pt
  text: E, no vigésimo oitavo jubileu, Noé começou a transmitir aos filhos de seus filhos os estatutos, os mandamentos e todos os juízos[a] que conhecia. Ele exortou seus filhos a praticarem a justiça, cobrirem a vergonha de sua carne, bendizerem aquele que os criou,[b] honrarem pai e mãe, amarem, cada um, o seu próximo e guardarem suas almas da imoralidade sexual, da impureza e de toda iniquidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “justiça”.
    reason: lexical_choice
  - marker: b
    text: Literalmente, “aquele que os criou”.
    reason: literal_translation
lexical_decisions:
- source_word: ለውሉደ፡ ውሉዱ፡
  choice: aos filhos de seus filhos
  rationale: Reproduz corretamente a relação de descendência expressa no geʿez, isto é, os netos de Noé, sem acrescentar uma geração.
- source_word: አኀዘ፡ ይእዘዝ፡
  choice: começou a transmitir
  rationale: O sentido é que Noé passou a ordenar ou instruir seus descendentes. “Transmitir” soa natural em português com estatutos e mandamentos, sem eliminar a força normativa do contexto.
- source_word: ፍትሐ
  choice: juízos
  rationale: O termo pertence ao campo semântico de julgamento, justiça e direito. “Juízos” se harmoniza com “estatutos” e “mandamentos”, enquanto a nota preserva a alternativa “justiça”.
- source_word: ከመ፡ ይክድኑ፡ ኃፍረተ፡ ሥጋሆሙ፡
  choice: cobrirem a vergonha de sua carne
  rationale: Mantém a imagem concreta do original, relativa à nudez corporal, sem a interpretar de modo mais específico.
- source_word: ለዘፈጠሮሙ
  choice: aquele que os criou
  rationale: Segue de perto a construção relativa do geʿez e evita converter silenciosamente a expressão no título teológico “seu Criador”.
- source_word: ዝሙት
  choice: imoralidade sexual
  rationale: Expressa em português atual o campo semântico de relações sexuais ilícitas; “prostituição” ou “fornicação” poderiam ser estreitos ou pouco correntes.
- source_word: ርኵስ
  choice: impureza
  rationale: Equivalente direto e apropriado ao contexto moral da exortação.
- source_word: ዐመፃ
  choice: iniquidade
  rationale: Preserva a noção ampla de perversidade, transgressão ou injustiça, sem restringi-la apenas à violência física.
theological_decisions:
- issue: Identidade daquele que criou os descendentes
  choice: aquele que os criou
  alternative: seu Criador
  rationale: A formulação relativa traduz a expressão do texto de modo mais formal e não acrescenta um título que, embora legítimo, não está lexicalmente expresso.
- issue: Sentido de ፍትሐ no conjunto jurídico-moral
  choice: juízos
  alternative: justiça
  rationale: O contexto de estatutos e mandamentos favorece “juízos”, mas a polissemia genuína é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração do geʿez foi preservada, mas a sintaxe foi ajustada para fluência. “Filhos de seus filhos” mantém a geração correta; “cada um, o seu próximo” conserva a distribuição individual do original.
