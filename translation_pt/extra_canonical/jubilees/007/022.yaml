base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/022.yaml
  text: And they fathered the children of the Naphidim, and all of them were unlike one another, and they devoured one another; and the giants killed the Naphil, and the Naphil killed the Elyo, and the Elyo mankind.
translation:
  language: pt
  text: E eles geraram filhos, os Naphidim,[a] e todos eram diferentes uns dos outros; devoraram uns aos outros. O gigante matou o Naphil, o Naphil matou o Elyo, e o Elyo matou os seres humanos.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Naphidim”, “Naphil” e “Elyo” reproduzem designações distintas do texto ge'ez; sua identificação exata é incerta.
    reason: Informa que as designações são lexicalmente distintas e evita identificações especulativas.
  - marker: b
    text: Na última oração, “matou” está subentendido no texto e foi repetido para tornar clara a sequência em português.
    reason: Explica a explicitação da elipse verbal final.
lexical_decisions:
- source_word: ናፊዲም (Nāfidim)
  choice: Naphidim
  rationale: Mantém como nome transliterado esta classe específica, sem a confundir com ናፊል (Naphil), termo distinto no texto ge'ez.
- source_word: ናፊል (Nāfil)
  choice: Naphil
  rationale: Preserva a forma e a distinção lexical do ge'ez em relação a Naphidim.
- source_word: ኤልዮ (ʾElyo)
  choice: Elyo
  rationale: Transliteração cautelosa de uma designação obscura, evitando uma identificação interpretativa não explicitada pela fonte.
- source_word: ይርባሕ (yirbāḥ)
  choice: os gigantes
  rationale: Segue o sentido contextual e a tradição textual refletida na edição de Charles, formando a primeira classe da sequência de grupos que se matam.
- source_word: አንሰ፡ አመሕያው (ʾansa ʾamaḥyāw)
  choice: os seres humanos
  rationale: Expressa de modo natural a referência coletiva à humanidade, em contraste com as classes anteriores.
theological_decisions:
- issue: Distinção entre Naphidim e Naphil
  choice: Conservar duas designações transliteradas distintas
  alternative: Traduzir ambas por “nefilins”
  rationale: A fonte ge'ez emprega formas diferentes; fundi-las eliminaria uma distinção real e alteraria a sequência do conflito.
- issue: Verbo elíptico na cláusula final
  choice: Repetir “mataram” em português
  alternative: 'Manter a frase nominal truncada: “e os Elyo, os seres humanos”'
  rationale: O verbo é recuperado naturalmente da cadeia coordenada anterior; explicitá-lo torna a frase inteligível sem resolver a identidade dos Elyo.
- issue: Relações entre as classes mencionadas
  choice: Não identificar Naphidim, Naphil ou Elyo com categorias doutrinárias externas
  alternative: Explicar cada nome como uma classe angelical, demoníaca ou híbrida específica
  rationale: O versículo não oferece base suficiente para essas identificações, e a transliteração preserva sua tensão e obscuridade.
translation_notes:
  register: Português moderno, claro e digno, com fluidez narrativa. A repetição enfática do original foi organizada em duas frases e numa sequência com dois-pontos, preservando a progressão. Os nomes obscuros foram transliterados de modo consistente, sem harmonização com “nefilins” nem importação de taxonomias posteriores.
