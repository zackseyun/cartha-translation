  text: And Ham saw Noah his father naked[a], and he went out and told his two brothers outside. And Shem took a garment, and he and Japheth laid the garment on their shoulders.
translation:
  language: pt
  text: Cam viu Noé, seu pai, nu; saiu e contou isso a seus dois irmãos lá fora. Então Sem pegou uma veste, e ele e Jafé a colocaram sobre os ombros.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A divisão do texto-fonte é incomum neste ponto: a ação de Sem e Jafé começa no trecho identificado como versículo 8, enquanto a continuação, em que eles andam de costas e cobrem o pai, pertence ao trecho seguinte. Aqui se conserva o limite do texto fornecido para este versículo.'
    reason: segmentation_note
lexical_decisions:
- source_word: ዕራቆ (ʿērāqō)
  choice: nu
  rationale: Expressa diretamente o estado de nudez de Noé, sem acrescentar a noção interpretativa de vergonha.
- source_word: ልብሰ (ləbsa)
  choice: uma roupa
  rationale: O termo designa uma peça de vestuário; “uma roupa” é natural e suficientemente amplo em português, sem especificar um tipo de manto não indicado pelo texto.
- source_word: በአፍአ (baʾafā)
  choice: do lado de fora
  rationale: Preserva a indicação espacial de que os irmãos estavam fora.
- source_word: ዲበ መታክፍቲሆሙ (diba matākəftihomu)
  choice: sobre os ombros
  rationale: Tradução direta da locução que indica onde Sem e Jafé colocaram a roupa.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com nomes nas formas correntes Cam, Noé, Sem e Jafé. A formulação evita antecipar o conteúdo do versículo seguinte e mantém “nu” sem interpretação teológica adicional.
