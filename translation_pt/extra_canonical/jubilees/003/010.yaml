base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/010.yaml
  text: 'Therefore the commandment was written on the heavenly tablets concerning her who gives birth: if she bears a male, she shall remain in her uncleanness seven days, according to the first seven days, and thirty-three days she shall remain in the blood of purification; she shall touch nothing holy, and she shall not enter the sanctuary until she completes these days for a male child.'
translation:
  language: pt
  text: 'Por isso, o mandamento foi escrito nas tábuas celestiais a respeito da mulher que dá à luz: se ela der à luz um filho homem, permanecerá sete dias em sua impureza, como nos primeiros sete dias, e permanecerá trinta e três dias no sangue de sua purificação. Não tocará em nada santo nem entrará no santuário até completar esses dias para um filho homem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: tábuas celestiais
  rationale: Reproduz diretamente a expressão etíope para as tábuas do céu, mantendo a terminologia característica de Jubileus.
- source_word: ርኵሳ
  choice: impureza
  rationale: Preserva o sentido ritual do termo sem acrescentar uma conotação moral indevida.
- source_word: ደመ፡ ንጽሓ
  choice: sangue de sua purificação
  rationale: Mantém a formulação concreta e cultual da fonte, sem substituir a tensão da expressão por uma paráfrase explicativa.
- source_word: መቅደስ
  choice: santuário
  rationale: Equivalente natural e preciso para o espaço sagrado ao qual a mulher não deve entrar durante o período indicado.
- source_word: ተባዕት
  choice: menino
  rationale: Expressa em português corrente o filho do sexo masculino mencionado no contexto de parto.
theological_decisions:
- issue: Natureza da impureza pós-parto
  choice: Linguagem de impureza ritual
  alternative: Linguagem de culpa ou pecado
  rationale: O texto trata de estado cultual e acesso ao sagrado; não afirma culpa moral decorrente do parto.
- issue: Referência aos primeiros sete dias
  choice: como nos primeiros sete dias
  alternative: conforme a primeira semana
  rationale: A formulação preserva a referência interna do texto à cronologia de Adão e sua mulher sem explicá-la além do que o versículo declara.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A sintaxe conserva o tom legal e cultual do original, e a cláusula final foi mantida integralmente.
