base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/008.yaml
  text: In the first week Adam was created[a], and the rib—his wife—was made; and in the second week he showed her to him. Therefore the command was given to keep seven days for a male, and two weeks of days for a female, in impurity.
translation:
  language: pt
  text: Na primeira semana, Adão foi criado[a], e a costela — sua mulher — foi criada; na segunda semana, ela lhe foi mostrada. Por isso, foi dado o mandamento de observar sete dias de impureza pelo nascimento de um menino e duas semanas de dias pelo nascimento de uma menina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O capítulo relaciona a entrada posterior de Adão e da mulher no Éden com os períodos de impureza depois do parto prescritos para o nascimento de menino ou menina.
    reason: cross_reference
lexical_decisions:
- source_word: ሳብዕት / ሱባ
  choice: semana / sete dias
  rationale: Os termos se referem a períodos de sete dias. “Semana” é natural nas duas primeiras ocorrências; “sete dias” explicita a duração prescrita na aplicação ritual.
- source_word: ገቦ
  choice: costela
  rationale: Mantém a designação concreta da parte tirada de Adão e a associação direta, no texto, entre a costela e sua mulher.
- source_word: ትእዛዝ
  choice: mandamento
  rationale: Expressa uma ordem normativa e solene, adequada ao contexto de prescrição ritual.
- source_word: ርኵስን
  choice: impureza
  rationale: É o equivalente ritual apropriado, sem acrescentar a ideia de culpa moral.
theological_decisions:
- issue: Relação entre a criação de Adão e da mulher e os períodos pós-parto
  choice: Preservar a explicação causal do texto e explicitar que os períodos se referem ao nascimento de menino ou menina
  alternative: Traduzir apenas “para um homem” e “para uma mulher”
  rationale: O contexto imediato relaciona a entrada tardia de Adão e da mulher no Éden às prescrições de impureza depois do parto. A explicitação evita que o leitor entenda os períodos como impostos ao homem e à mulher adultos.
- issue: Agente da apresentação da mulher a Adão
  choice: Usar a construção passiva “ela lhe foi mostrada”
  alternative: Explicitar “Deus a apresentou a ele”
  rationale: A forma passiva preserva o referente contextual sem inserir diretamente um nome que não aparece nesta oração.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão incomum “duas semanas de dias” foi mantida para refletir de perto a formulação enfática do texto-fonte. O travessão conserva a identificação compacta da costela com a mulher.
