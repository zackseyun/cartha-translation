  text: And in the first week of the first jubilee, Adam and his wife were in the garden of Eden for seven years, tilling and keeping it.
translation:
  language: pt
  text: E, na primeira semana do primeiro jubileu, Adão e sua mulher ficaram sete anos no jardim do Éden, cultivando-o e guardando-o.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ገነት፡ ኤዶም
  choice: no jardim do Éden
  rationale: A expressão designa o jardim de Éden; a forma portuguesa consagrada é natural e mantém a referência geográfica do texto.
- source_word: ይትቀነይ
  choice: cultivando-o
  rationale: O verbo exprime trabalhar ou cultivar a terra; o gerúndio acompanha naturalmente a construção circunstancial e retoma o jardim.
- source_word: የዐቅብ
  choice: guardando-o
  rationale: Preserva o sentido de guardar, vigiar ou conservar e também a ressonância de Gênesis 2:15 sem restringi-la a uma única nuance.
- source_word: ሰብዐተ፡ ዓመተ
  choice: sete anos
  rationale: Tradução direta da duração indicada pelo texto.
theological_decisions:
- issue: Natureza da atividade de Adão e sua mulher no jardim
  choice: cultivando-o e guardando-o
  alternative: servindo-o e preservando-o
  rationale: A formulação escolhida conserva os dois verbos distintos e sua provável alusão à missão humana em Gênesis, sem acrescentar uma interpretação sacerdotal ou denominacional.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural. A vírgula após a expressão temporal facilita a leitura, e «sua mulher» acompanha o modo relacional do texto-fonte sem introduzir o nome Eva.
