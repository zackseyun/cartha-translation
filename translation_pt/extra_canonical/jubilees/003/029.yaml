translation:
  language: pt
  text: Mas somente a Adão, dentre todos os animais selvagens e domésticos, ele deu os meios para cobrir a sua nudez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mas somente a Adão ele deu os meios para cobrir a sua nudez, dentre todos os animais selvagens e domésticos.”'
    reason: A posição da expressão final no ge'ez permite alguma ambiguidade quanto à sua ligação sintática.
lexical_decisions:
- source_word: ባሕቲቱ
  choice: somente
  rationale: Expressa a exclusividade atribuída a Adão.
- source_word: ይክድን
  choice: com que cobrir
  rationale: Preserva o sentido verbal de cobrir sem especificar além do que o texto afirma qual foi o meio concedido.
- source_word: ኀፍረቶ
  choice: sua nudez
  rationale: No contexto de Adão após a transgressão, o termo designa a nudez ou as partes íntimas expostas; 'nudez' é natural e dignificado em português.
- source_word: አራዊት ወእንስሳ
  choice: animais selvagens e domésticos
  rationale: Mantém a distinção entre feras/animais selvagens e animais domesticados ou gado.
theological_decisions:
- issue: Identidade do sujeito de 'deu'
  choice: ele
  alternative: Deus
  rationale: O contexto torna Deus o referente, mas o texto emprega a forma verbal sem nomeá-lo explicitamente neste ponto; o pronome preserva a coesão e evita explicitação interpretativa.
- issue: Relação sintática de 'dentre todos os animais'
  choice: ligada à exclusividade de Adão
  alternative: ligada ao meio de cobrir a nudez
  rationale: A ordem e o contraste favorecem a leitura de que somente Adão, em contraste com todos os animais, recebeu esse recurso; a ambiguidade possível é registrada em nota.
translation_notes:
  register: Português moderno, claro e dignificado, com leitura natural no Brasil e compreensão internacional. 'Animais selvagens e domésticos' comunica a dupla categoria do original sem recorrer ao termo regionalmente variável 'gado'.
