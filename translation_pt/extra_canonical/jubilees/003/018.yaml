  text: …of the garden God commanded you, saying, ‘Do not eat from it.’ And she said to him, “From all the fruit of the trees of the garden God said to us, ‘Eat’; but from the fruit of the tree that is in the middle of the garden,”
translation:
  language: pt
  text: '…do jardim Deus ordenou a vocês, dizendo: “Não comam dele.” E ela lhe disse: “Deus nos disse: ‘Comam de todo fruto das árvores do jardim’; mas, do fruto da árvore que está no meio do jardim…”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho fornecido termina aqui, no meio da fala.
    reason: Esclarece que a construção incompleta reflete os limites do texto-fonte disponibilizado, e não uma tentativa de completar ou harmonizar a frase.
lexical_decisions:
- source_word: አዘዘክሙ
  choice: ordenou a vocês
  rationale: Reproduz o verbo ‘ordenar’ e o objeto na segunda pessoa do plural, em linguagem natural e amplamente compreensível.
- source_word: ኢትብልዑ፡ እምኔሁ
  choice: Não comam dele
  rationale: Mantém a proibição no plural e a referência pronominal ao elemento mencionado no contexto anterior.
- source_word: ወትቤሎ
  choice: E ela lhe disse
  rationale: Conserva o sujeito feminino e o destinatário masculino codificados pela forma verbal.
- source_word: እምኵሉ፡ ፍሬ፡ ዕፀ፡ ዘውስተ፡ ገነት
  choice: de todo fruto das árvores do jardim
  rationale: Expressa de modo natural a abrangência de ‘todo fruto’ e a relação com as árvores situadas no jardim.
- source_word: ዘማእከለ፡ ገነት
  choice: que está no meio do jardim
  rationale: Traduz diretamente a localização central da árvore sem identificar sua espécie ou acrescentar interpretação.
theological_decisions:
- issue: Relação entre as duas partes da fala sobre os frutos
  choice: mas, do fruto
  alternative: e, do fruto
  rationale: Embora o texto empregue a conjunção comum ወ, o contraste entre a permissão geral e a exceção torna ‘mas’ a equivalência contextual mais natural, sem completar a proibição que não consta no trecho fornecido.
- issue: Trecho incompleto nas duas extremidades
  choice: Manter reticências no início e no fim
  alternative: Reconstruir o contexto ausente
  rationale: O excerto ge’ez começa no fim de uma pergunta e termina no meio da resposta. As reticências preservam honestamente esses limites sem importar palavras de versículos adjacentes.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com ‘vocês’ para a segunda pessoa do plural. A ordem das palavras foi naturalizada sem eliminar o contraste nem reconstruir o material ausente. As aspas distinguem a fala da mulher da citação que ela faz das palavras de Deus.
