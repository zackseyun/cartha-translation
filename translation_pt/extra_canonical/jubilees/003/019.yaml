base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/019.yaml
  text: God said to us, ‘Do not eat from it, and do not touch it, lest you die.’” And the serpent said to the woman, “You will not surely die, for God knows that on the day you eat from it, your eyes will be opened, and you will be like gods, and you will know good.”
translation:
  language: pt
  text: 'Deus nos disse: “Não comam dele nem toquem nele, para não morrerem.” Então a serpente disse à mulher: “De modo nenhum vocês morrerão, pois Deus sabe que, no dia em que comerem dele, os olhos de vocês se abrirão, e vocês serão como deuses e conhecerão o bem[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “saberão o que é bom”.
    reason: A expressão ge'ez pode ser vertida como o substantivo abstrato “o bem” ou, de forma mais explicativa, “o que é bom”.
lexical_decisions:
- source_word: አኮ፡ ሞተ፡ ዘትመውቱ
  choice: De modo nenhum vocês morrerão
  rationale: Reproduz em português natural a negação enfática da morte na fala da serpente.
- source_word: ከመ፡ አማልክት
  choice: como deuses
  rationale: Mantém o plural explícito e a comparação do texto ge'ez, sem especificar além do que a fonte permite.
- source_word: ወታአምሩ፡ ሠናየ
  choice: e conhecerão o bem
  rationale: Preserva o verbo finito coordenado, 'e conhecerão', e traduz o objeto de modo conciso, mantendo em nota uma alternativa idiomática.
theological_decisions:
- issue: Identidade ou natureza dos 'deuses'
  choice: como deuses
  alternative: como seres divinos
  rationale: A tradução principal conserva a formulação plural tradicional e não decide se a expressão designa divindades, seres celestes ou uma condição divina.
- issue: Força da negação da morte
  choice: De modo nenhum vocês morrerão
  alternative: Não é certo que vocês morrerão
  rationale: A primeira opção expressa a negação enfática do texto e evita enfraquecer a afirmação da serpente como mera incerteza.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais na terceira pessoa do plural para ampla legibilidade brasileira. A estrutura dialogal e as repetições relevantes da fonte foram preservadas sem rigidez artificial.
