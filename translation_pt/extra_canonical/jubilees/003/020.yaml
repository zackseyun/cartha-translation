base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/020.yaml
  text: And the woman saw the tree, that it was delightful[a] and pleasing to the eye, and its fruit was good for food, and she took from it and ate.
translation:
  language: pt
  text: A mulher viu que a árvore era agradável[a] e atraente aos olhos, e que seu fruto era bom para comer. Então tomou dela e comeu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra geʿez ʾaddām funciona aqui como adjetivo, com o sentido de “agradável” ou “prazerosa”, e não como o nome próprio Adão.
    reason: lexical_choice
lexical_decisions:
- source_word: አዳም
  choice: agradável
  rationale: Aqui, ʾaddām funciona como adjetivo e expressa prazer ou agrado, não como o nome próprio Adão.
- source_word: ያሠምር፡ ለዐይን
  choice: atraente aos olhos
  rationale: Reproduz de modo natural a ideia de algo que agrada à vista, sem fundi-la com o adjetivo anterior.
- source_word: ለበሊዕ
  choice: para comer
  rationale: Expressa diretamente a finalidade ou adequação do fruto como alimento neste contexto.
- source_word: ወነሥአት፡ እምኔሁ
  choice: Então tomou dela
  rationale: Mantém a formulação concisa do geʿez, cujo pronome retoma a árvore, e evita acrescentar explicitamente 'fruto', embora esse seja o objeto entendido pelo contexto.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com estrutura próxima à fonte. A repetição de percepções sobre a árvore e o fruto foi preservada, enquanto a pontuação em duas frases favorece a leitura natural.
