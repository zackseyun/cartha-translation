base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/009.yaml
  text: And after forty days had been completed for Adam in the land where he had been created, we brought him into the garden of Eden, that he might till it and keep it; but his wife was brought in after eighty days, and after this she entered into the garden of Eden.
translation:
  language: pt
  text: Depois que se completaram quarenta dias para Adão, na terra onde ele havia sido criado, nós o levamos ao jardim do Éden, para que o cultivasse e guardasse. Sua mulher, porém, foi trazida[a] depois de oitenta dias; e, depois disso, ela entrou no jardim do Éden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eles trouxeram sua mulher”.'
    reason: A forma verbal em ge'ez está na terceira pessoa do plural, mas pode ter sentido impessoal e ser traduzida por uma passiva.
lexical_decisions:
- source_word: ተፈጸመ፡ ለአዳም፡ አርብዓ፡ መዋዕለ
  choice: se completarem quarenta dias para Adão
  rationale: Mantém a construção temporal e a referência explícita a Adão sem acrescentar uma explicação ausente do texto.
- source_word: አበአናሁ
  choice: nós o levamos
  rationale: Reproduz a primeira pessoa do plural do verbo, coerente com a voz angélica do contexto.
- source_word: ይትቀነይ፡ ወይዕቀባ
  choice: o cultivasse e guardasse
  rationale: Expressa as duas atividades atribuídas a Adão no jardim, em formulação natural e próxima da tradição lexical de Gênesis.
- source_word: ወብእሲቱኒ፡ አብአ
  choice: Sua mulher, porém, foi levada para lá
  rationale: Entende a forma plural como plural impessoal com valor passivo; evita introduzir agentes indefinidos e preserva o contraste com a entrada de Adão.
- source_word: በሰማንያ፡ መዋዕለ
  choice: depois de oitenta dias
  rationale: Conserva o período temporal explícito aplicado à mulher.
- source_word: ቦአት፡ ውስተ፡ ገነት፡ ኤዶም
  choice: ela entrou no jardim do Éden
  rationale: Traduz diretamente o verbo feminino singular e mantém a repetição enfática do jardim do Éden.
theological_decisions:
- issue: Identidade dos agentes que levam a mulher ao jardim
  choice: 'voz passiva: “foi levada para lá”'
  alternative: “eles a levaram para lá”
  rationale: A terceira pessoa do plural em ge'ez pode funcionar impessoalmente. A tradução passiva preserva a indeterminação do agente, sem atribuir explicitamente a ação a Deus, aos anjos ou a outro grupo.
- issue: Relação entre os prazos de quarenta e oitenta dias e normas posteriores
  choice: manter apenas os prazos narrados
  alternative: explicitar uma relação com leis de purificação
  rationale: O versículo fornece os números e os acontecimentos, mas não exige que a tradução incorpore sua interpretação legal ou teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Cultivasse e guardasse” preserva a concisão e a ressonância do relato de Gênesis. O marcador [a] aparece no texto principal.
