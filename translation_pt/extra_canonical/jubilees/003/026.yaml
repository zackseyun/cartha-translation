    text: A lista de substâncias aromáticas e a relação temporal da frase final são textualmente difíceis. O sentido geral é que Adão queimou um incenso aromático ao nascer do sol, depois de cobrir sua nudez.
    reason: textual_variant
lexical_decisions:
- source_word: ገነት፡ ኤዶም
  choice: jardim
  rationale: O contexto identifica o jardim do Éden; nesta frase, a forma breve é natural e mantém a referência já estabelecida.
- source_word: ዐጠነ፡ ለመዐዛ፡ ሠናይ፡ ዕጣነ
  choice: queimou ... um incenso de aroma agradável
  rationale: Reproduz o ato de oferecer incenso e a descrição de seu aroma sem acrescentar linguagem sacrificial não explícita.
- source_word: ስኂነ፡ ወቀንአተ፡ ወማየ፡ ልብን፡ ወሰንበለ
  choice: estoraque, gálbano, incenso e especiarias
  rationale: Segue a identificação tradicional dos aromáticos, mas a enumeração ge'ez é lexical e textualmente difícil; a nota preserva essa incerteza.
- source_word: በጽባሕ፡ ምስለ፡ ትንሣኤ፡ ፀሐይ
  choice: pela manhã, ao nascer do sol
  rationale: Tradução direta e idiomática da indicação temporal.
- source_word: ኀፍረቶ
  choice: sua nudez
  rationale: No contexto da cobertura corporal, 'nudez' comunica melhor o referente concreto do que o abstrato 'vergonha', embora o termo também carregue essa conotação.
theological_decisions:
- issue: Natureza do ato de Adão
  choice: queimou ... incenso
  alternative: ofereceu uma oferta de incenso
  rationale: O texto descreve a queima aromática, mas não explicita aqui a categoria cultual de 'oferta'; evita-se tornar a formulação mais ritual do que a fonte.
- issue: Relação temporal da frase final
  choice: desde o dia em que cobriu sua nudez
  alternative: no dia em que cobriu sua nudez
  rationale: Mantém a formulação temporal difícil do texto recebido, sem resolver silenciosamente se ela retoma exatamente o mesmo dia ou marca o início de uma prática.
