  yaml_path: translation/extra_canonical/jubilees/003/006.yaml
  text: And he recognized her and said to her, “This now is bone from my bones and flesh from my flesh. This one shall be called my woman, because she was taken from her man.”
translation:
  language: pt
  text: 'E ele a reconheceu[a] e lhe disse: “Esta, afinal, é osso dos meus ossos e carne da minha carne. Ela será chamada mulher, porque foi tirada do homem.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a identificou”. O verbo também pode significar “conheceu”, mas aqui indica que Adão reconheceu quem ela era e de onde havia sido tirada.'
    reason: Esclarece a amplitude semântica do verbo ge'ez e evita a conotação sexual que “conheceu-a” pode ter neste contexto.
lexical_decisions:
- source_word: አእመራ (ʾaʾmerā)
  choice: a reconheceu
  rationale: No contexto, Adão identifica a mulher como proveniente dele. “Conheceu-a” poderia sugerir indevidamente relações sexuais em português bíblico.
- source_word: ዝንቱ፡ ይእዜ (zəntu yəʾəze)
  choice: Esta, sim
  rationale: Reproduz com naturalidade a força demonstrativa e enfática de “esta agora”, sem tornar a frase artificial.
- source_word: ብእሲትየ (bəʾəsitye)
  choice: mulher
  rationale: O termo designa a mulher, em correspondência com bəʾəsi, “homem”; evita o possessivo aparente de certas segmentações, que não convém ao sentido da fórmula eti etimológica.
- source_word: ብእሲሃ (bəʾəsiha)
  choice: do homem
  rationale: Mantém a relação lexical entre “mulher” e “homem” expressa no texto, ainda que o jogo de palavras não seja plenamente reproduzível em português.
theological_decisions:
- issue: Sentido do reconhecimento de Adão
  choice: “a reconheceu”
  alternative: “a conheceu”
  rationale: Preserva a identificação consciente da mulher por Adão e evita antecipar uma união sexual, narrada em outra sequência.
- issue: Formulação da origem da mulher
  choice: “foi tirada do homem”
  alternative: “foi tomada de seu homem”
  rationale: A formulação escolhida conserva a afirmação de origem sem introduzir uma relação conjugal possessiva além do que o contexto exige.
translation_notes:
  register: Português moderno, digno e acessível, com cadência bíblica moderada. A expressão “Esta, sim” comunica a ênfase do original; “osso dos meus ossos e carne da minha carne” preserva a fórmula tradicional e a repetição retórica.
