  text: until she completes these days for a male. But for a female, two weeks, like the first two weeks, in her uncleanness, and sixty-six days she shall remain in the blood of her purification.
translation:
  language: pt
  text: até que complete estes dias no caso de um menino. Mas, no caso de uma menina, ficará duas semanas em sua impureza, como nas duas primeiras semanas, e permanecerá sessenta e seis dias no sangue de sua purificação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰቡዓተ
  choice: semanas
  rationale: O termo designa períodos de sete dias e, no contexto das normas de purificação após o parto, corresponde naturalmente a “semanas”.
- source_word: ዘበተባዕት / ዘበአንስት
  choice: por um menino / por uma menina
  rationale: Os termos contrastam o sexo masculino e o feminino da criança; esta formulação é clara e natural em português e mantém o paralelismo.
- source_word: በርኵሳ
  choice: em sua impureza
  rationale: Preserva tanto o sentido ritual de impureza quanto o sufixo possessivo feminino da forma geʿez.
- source_word: በደመ፡ ንጽሓ
  choice: no sangue de sua purificação
  rationale: Mantém a expressão concreta e teologicamente carregada do texto-fonte, inclusive o possessivo feminino, sem substituí-la por uma paráfrase interpretativa.
theological_decisions:
- issue: Natureza da impureza e da purificação
  choice: Conservar os termos “impureza” e “sangue de sua purificação”
  alternative: Explicar como período ritual pós-parto ou como fluxo de purificação
  rationale: O texto remete à legislação ritual, mas não explicita aqui sua interpretação; a tradução preserva sua linguagem e tensão próprias sem impor uma leitura confessional ou médica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi levemente ajustada para fluência, sem acrescentar a soma de oitenta dias, que pertence ao versículo seguinte.
