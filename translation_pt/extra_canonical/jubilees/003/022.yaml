base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/022.yaml
  text: And he ate, and his eyes were opened, and he saw that he was naked. And he took fig leaves and sewed them and made himself a covering, and covered his shame.
translation:
  language: pt
  text: E ele comeu; então seus olhos se abriram, e ele viu que estava nu. Pegou folhas de figueira, costurou-as, fez para si uma cobertura e cobriu sua nudez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበልዐ
  choice: E ele comeu
  rationale: Reproduz a oração inicial do ge'ez, preservando sua coordenação narrativa e evitando a omissão registrada na versão anterior.
- source_word: ወተርኅወ፡ አዕይንቲሁ
  choice: então seus olhos se abriram
  rationale: Expressão idiomática natural em português; “então” explicita com leveza a sequência resultante indicada pela cadeia narrativa, sem acrescentar interpretação teológica.
- source_word: ቈጽለ፡ በለስ
  choice: folhas de figueira
  rationale: Equivalente corrente e preciso para as folhas da figueira.
- source_word: ወጠቅዐ
  choice: costurou-as
  rationale: Mantém a ação concreta de unir/coser as folhas e explicita o objeto já mencionado por meio do pronome.
- source_word: ምርአ
  choice: uma cobertura
  rationale: Termo amplo que preserva a referência a algo feito para cobrir o corpo, sem especificar indevidamente o tipo de vestimenta.
- source_word: ኀፍረቶ
  choice: sua nudez
  rationale: No contexto, o termo ligado à vergonha designa as partes nuas ou a nudez vergonhosa; “nudez” oferece leitura digna e natural, em consonância com a oração anterior.
theological_decisions:
- issue: Relação entre comer e a abertura dos olhos
  choice: Sequência narrativa com “então”
  alternative: 'Coordenação estrita: “e seus olhos se abriram”'
  rationale: A formulação comunica a progressão imediata do relato sem definir além do texto a natureza moral, espiritual ou causal da abertura dos olhos.
- issue: Sentido de “vergonha”/“nudez” no fechamento do versículo
  choice: “cobriu sua nudez”
  alternative: “cobriu sua vergonha” ou “cobriu suas partes íntimas”
  rationale: “Nudez” preserva o referente corporal e a ligação com “estava nu”, sem tornar a expressão excessivamente abstrata ou explicitamente anatômica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A coordenação do ge'ez foi suavizada apenas o necessário para fluência; o conteúdo e a progressão das ações foram integralmente preservados.
