translation:
  language: pt
  text: Então Deus despertou Adão do seu sono. Quando Adão despertou, levantou-se no sexto dia, e Deus trouxe a mulher até ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነቅሆ
  choice: despertou
  rationale: O verbo causativo indica fazer despertar ou acordar; “despertou” preserva o tom narrativo digno.
- source_word: እምነዋሙ
  choice: do seu sono
  rationale: Tradução direta da expressão que indica a origem do despertar.
- source_word: ተንሥአ
  choice: levantou-se
  rationale: Expressa o ato de se erguer após despertar, sem acrescentar interpretação.
- source_word: አብጽሓ ኀቤሁ
  choice: trouxe a mulher até ele
  rationale: O verbo indica fazê-la chegar ou conduzi-la até Adão; o objeto feminino retoma a mulher formada na frase anterior.
theological_decisions:
- issue: Identidade do agente que desperta Adão e lhe traz a mulher
  choice: Deus
  alternative: ele
  rationale: O sujeito expresso na oração precedente é o Senhor Deus, e a sequência narrativa o mantém como agente. Repetir “Deus” em português evita uma ambiguidade artificial segundo a qual Adão poderia ter trazido a mulher a si mesmo.
translation_notes:
  register: Português moderno, claro e digno, com repetição moderada dos nomes para distinguir os agentes. “A mulher” explicita o referente feminino já apresentado no contexto imediato, sem introduzir informação nova.
