base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/027.yaml
  text: And on that day the mouths of all the beasts and cattle and birds and whatever walks and whatever moves were closed from speech, for they all used to speak with one another, with one lip and one tongue.
translation:
  language: pt
  text: E naquele dia, as bocas de todos os animais selvagens, dos animais domésticos, das aves, de tudo o que anda e de tudo o que se move foram fechadas à fala, pois todos falavam uns com os outros com um só lábio e uma só língua.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊት
  choice: animais selvagens
  rationale: Distingue esta categoria de እንስሳ, que no contexto designa os animais domésticos.
- source_word: እንስሳ
  choice: animais domésticos
  rationale: Expressa a categoria de animais mantidos ou domesticados, em contraste com os animais selvagens.
- source_word: ተፈጽመ፡ አፈ ... እምነቢብ
  choice: a boca ... foi impedida de falar
  rationale: Transmite de modo natural o sentido idiomático de que a capacidade de fala cessou, sem sugerir apenas que a boca foi fisicamente fechada.
- source_word: ክንፈረ፡ አሐደ፡ ወልሳነ፡ አሐደ
  choice: com os mesmos lábios e a mesma língua
  rationale: Mantém as duas imagens corporais do ge'ez e comunica uma fala compartilhada; o plural 'lábios' é idiomático em português.
theological_decisions:
- issue: A fala original dos animais
  choice: afirmar diretamente que todos falavam uns com os outros
  alternative: tratar a frase como metáfora de comunicação não verbal
  rationale: O texto apresenta a fala dos animais como parte explícita da narrativa, sem indicar sentido metafórico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a enumeração e a afirmação narrativa do original, evitando rigidez excessiva.
