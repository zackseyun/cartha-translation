  yaml_path: translation/extra_canonical/jubilees/003/023.yaml
  text: And the Lord cursed the serpent and was angry with it forever. And he was also angry with the woman, because she listened to the voice of the serpent and ate; and he said to her, “I will greatly multiply your sorrow and your pain; in sorrow you shall bear children, and your desire shall be for your husband, and he will rule over you.”
translation:
  language: pt
  text: 'E o Senhor amaldiçoou a serpente e ficou irado com ela para sempre. Também ficou irado com a mulher, porque ela deu ouvidos à voz da serpente e comeu. E disse-lhe: “Multiplicarei grandemente a tua tristeza e as tuas dores; com tristeza darás à luz filhos. Tu te voltarás para o teu marido[a], e ele dominará sobre ti.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o teu retorno será para o teu marido”. A expressão também é tradicionalmente traduzida como “o teu desejo será para o teu marido”.
    reason: Preserva a redação mais diretamente apoiada pelo ge'ez e informa a conhecida alternativa interpretativa sem resolver indevidamente a ambiguidade.
lexical_decisions:
- source_word: ተምዕዓ
  choice: ficou irado
  rationale: O contexto e o paralelismo com a reação do Senhor à serpente favorecem a ideia de ira; a formulação portuguesa é natural e preserva a atribuição explícita ao Senhor.
- source_word: ኀዘንኪ ወለፃዕርኪ
  choice: a tua tristeza e as tuas dores
  rationale: Mantém os dois termos coordenados do texto, sem reduzi-los apenas à dor física do parto.
- source_word: ለዲ ውሉደ
  choice: darás à luz filhos
  rationale: Expressa em português corrente o sentido de gerar ou trazer filhos ao mundo.
- source_word: ኀበ ምትኪ ምግባእኪ ውእቱ
  choice: Tu te voltarás para o teu marido
  rationale: O substantivo ligado a 'ir/entrar/retornar' aponta literalmente para retorno ou voltar-se em direção ao marido. A tradução evita substituir silenciosamente essa imagem por 'desejo'.
- source_word: ይኴንነኪ
  choice: ele dominará sobre ti
  rationale: Traduz a noção de exercer domínio ou governo, preservando o caráter forte da declaração.
theological_decisions:
- issue: Sentido da orientação da mulher para o marido
  choice: Tu te voltarás para o teu marido
  alternative: o teu desejo será para o teu marido
  rationale: A forma ge'ez apresentada favorece 'retorno/voltar-se'. Como a tradição de Gênesis frequentemente traz 'desejo', a nota registra a alternativa sem impô-la ao texto principal.
- issue: Natureza da afirmação sobre o domínio do marido
  choice: ele dominará sobre ti
  alternative: ele te governará
  rationale: A tradução mantém a declaração como parte do juízo narrado, sem transformá-la em mandamento nem suavizar sua força.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “dar à luz” e “deu ouvidos” como expressões correntes, mantendo a solenidade narrativa. O pronome “tu” foi conservado de modo coerente dentro da fala direta.
