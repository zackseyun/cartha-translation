  text: And they shall be eighty days in all. And when she had completed these eighty days, we brought her into the garden of Eden, for it is holier than all the earth, and every tree that is planted in it is holy.
translation:
  language: pt
  text: Ao todo, serão oitenta dias. Depois que ela completou esses oitenta dias, nós a levamos para o jardim do Éden, pois ele é mais santo do que toda a terra, e toda árvore plantada nele é santa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውና፡ ኵሎን፡ ሰማንያ፡ መዋዕለ
  choice: Ao todo, serão oitenta dias
  rationale: Preserva a primeira oração do ge'ez, inclusive seu valor futuro, com uma ordem natural em português.
- source_word: ገነት፡ ኤዶም
  choice: jardim do Éden
  rationale: Emprega a forma bíblica corrente em português para o topônimo e traduz o substantivo como «jardim».
- source_word: ቅድስት፡ ይእቲ፡ እምኵሉ፡ ምድር
  choice: ele é mais santo do que toda a terra
  rationale: Expressa naturalmente o sentido comparativo da construção ge'ez sem enfraquecer a afirmação de santidade.
- source_word: ወኵሉ፡ ዕፀ፡ ዘትከል
  choice: e toda árvore plantada nele é santa
  rationale: Mantém a abrangência de «toda árvore» e explicita em português a relação locativa indicada pelo contexto.
theological_decisions:
- issue: Santidade do jardim e de suas árvores
  choice: mais santo do que toda a terra; toda árvore plantada nele é santa
  alternative: santo acima de toda a terra; toda árvore que nele cresce é santa
  rationale: A formulação escolhida conserva diretamente a comparação e a atribuição de santidade, sem reinterpretá-las segundo uma tradição denominacional.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Conservou-se a mudança do futuro na frase inicial para o passado narrativo na frase seguinte, conforme o texto-fonte.
