base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/016.yaml
  text: And we gave him work, and we instructed him to do everything suitable for cultivation. And he was cultivating, and he was naked and did not know it, and was not ashamed, and he kept the garden from the birds and from the beasts and from the cattle, and gathered its fruit and ate, and set aside the remainder for himself.
translation:
  language: pt
  text: E nós lhe demos trabalho e o instruímos a fazer tudo o que era apropriado para o cultivo.[a] Ele cultivava, estava nu, não sabia disso nem se envergonhava. Guardava o jardim das aves, dos animais selvagens e do gado, colhia seus frutos e comia, e separava para si o que restava.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o instruímos em tudo”.'
    reason: A construção ge’ez permite uma formulação mais geral da extensão da instrução, embora o infinitivo “fazer” favoreça o texto principal.
lexical_decisions:
- source_word: ምግባረ
  choice: uma tarefa
  rationale: O termo indica trabalho ou ocupação; “uma tarefa” é natural em português e preserva a ideia de trabalho confiado a Adão.
- source_word: ገቢሮተ፡ ኵሉ፡ ዘይስተርኢ፡ ለቅኔ
  choice: a fazer tudo o que era apropriado para o cultivo
  rationale: Explicita o infinitivo ገቢሮተ (“fazer”) e expressa a adequação ao trabalho de cultivo sem tornar a frase excessivamente literal.
- source_word: ይትቀነይ
  choice: cultivava a terra
  rationale: No contexto do jardim, o verbo descreve o trabalho continuado de cultivo; “a terra” torna a expressão idiomática em português sem alterar o referente contextual.
- source_word: አራዊት ... እንስሳ
  choice: animais selvagens ... gado
  rationale: Mantém a distinção entre feras ou animais selvagens e animais domésticos/gado.
- source_word: ተረፎ፡ ሎቱ
  choice: separava para si o que restava
  rationale: Reproduz tanto a ideia do restante quanto o beneficiário expresso por ሎቱ, “para si”.
theological_decisions:
- issue: A nudez e a falta de conhecimento
  choice: estava nu, mas não sabia disso nem se envergonhava
  alternative: estava nu, não o percebia e não sentia vergonha
  rationale: A formulação conserva as afirmações distintas do texto — nudez, desconhecimento e ausência de vergonha — sem explicar a natureza desse desconhecimento.
translation_notes:
  register: Português moderno, claro e digno, com fluência brasileira e vocabulário amplamente compreensível no mundo lusófono. A coordenação narrativa e o aspecto habitual das ações foram preservados.
