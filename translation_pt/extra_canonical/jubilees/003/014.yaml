lexical_decisions:
- source_word: ይትፈጸማ እላንቱ መዋዕል
  choice: até que se completem esses dias
  rationale: Reproduz a ideia de levar à conclusão o período de dias já mencionado no contexto, em português natural.
- source_word: ለተባዕት ወለአንስት
  choice: para o menino e para a menina
  rationale: O contexto trata dos períodos prescritos conforme o sexo da criança. A conjunção ወ foi traduzida corretamente por “e”, não por “ou”.
- source_word: ሕግ ወስምዕ
  choice: a lei e o testemunho
  rationale: Mantém os dois termos coordenados e sua formulação jurídica e testemunhal, sem fundi-los nem acrescentar conteúdo.
- source_word: ዘተጽሕፈ
  choice: que foi escrito
  rationale: Preserva a forma singular do texto-fonte, que apresenta “lei e testemunho” como uma fórmula conjunta.
theological_decisions:
- issue: Relação entre “lei” e “testemunho”
  choice: Manter “a lei e o testemunho” como expressão coordenada seguida do singular “que foi escrito”.
  alternative: 'Regularizar para o plural: “que foram escritos”.'
  rationale: O singular no ge’ez pode tratar a expressão como uma unidade textual ou formular; regularizá-lo eliminaria essa característica sem necessidade.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Menino” e “menina” tornam explícito o referente infantil indicado pelo contexto imediato, enquanto “e” conserva a conjunção do ge’ez.
