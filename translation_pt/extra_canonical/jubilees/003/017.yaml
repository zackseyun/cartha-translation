  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
translation:
  language: pt
  text: 'para si e para sua mulher, e armazenou o que estava sendo guardado. Ao se completarem os sete anos que ele havia passado ali — sete anos exatos —, no segundo mês, no décimo sétimo dia[a], a serpente veio e se aproximou da mulher. E a serpente disse à mulher: “Deus ordenou a vocês: ‘Não comam de nenhuma árvore do jardim’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A data é apresentada com precisão: segundo mês, décimo sétimo dia, depois de sete anos completos no Éden. O livro de Jubileus usa regularmente esse tipo de cronologia como parte de sua estrutura revelatória.'
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓቱ፡ ዓመት / ሰብዓተ፡ ዓመተ
  choice: sete anos / sete anos exatos
  rationale: Os numerais escritos por extenso no texto ge'ez significam “sete”; os sinais ፳፮ e ፳፯ são marcas do aparato crítico, não os números vinte e seis e vinte e sete.
- source_word: አርዌ፡ ምድር
  choice: a serpente
  rationale: Embora a expressão seja literalmente “serpente da terra”, “a serpente” é a equivalência natural no contexto narrativo e mantém a ligação com o relato do Gênesis.
- source_word: ቀርበ፡ ኀበ፡ ብእሲት
  choice: se aproximou da mulher
  rationale: Reproduz diretamente o movimento da serpente em direção à mulher em português corrente.
- source_word: እምኵሉ፡ ዕፀ
  choice: de nenhuma árvore
  rationale: Preserva o alcance negativo da pergunta ardilosa da serpente, sem reformulá-la como uma proibição verdadeira ou mais limitada.
theological_decisions:
- issue: Alcance da proibição citada pela serpente
  choice: “Não comam de nenhuma árvore do jardim”
  alternative: “Não comam de todas as árvores do jardim”
  rationale: A formulação escolhida expressa em português natural a leitura interrogativa de proibição total insinuada pela serpente, mantendo a tensão com a ordem divina sem endossar a citação como correta.
- issue: Número de anos no Éden
  choice: sete anos
  alternative: vinte e seis anos / vinte e sete anos
  rationale: A leitura “sete” vem das palavras ge'ez do corpo do texto; os números maiores surgem da confusão entre marcas do aparato da edição e o conteúdo textual.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe fragmentária inicial foi preservada por pertencer à continuação do versículo anterior; a cronologia recebeu pontuação que facilita a leitura sem alterar seu conteúdo.
