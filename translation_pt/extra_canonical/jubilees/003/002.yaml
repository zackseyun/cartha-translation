    rationale: «Cada um segundo o seu próprio nome» pode sugerir que cada ser já possuía um nome prévio; «a cada um o seu próprio nome» mantém a concisão distributiva do texto sem essa aspereza.
  - severity: low
    issue: Construção verbal pesada no encerramento
    rationale: «Assim ficou sendo o nome deles» é inteligível, mas «esse foi o nome deles» comunica a mesma relação correlativa de forma mais natural.
