  source_fidelity: O rascunho preserva a ação de Adão nomear todos e a correlação entre o modo como os chamou e seus nomes. A formulação distributiva, porém, pode ser vertida de modo mais idiomático sem perder o paralelismo do ge'ez e da trilha inglesa.
  naturalness: «Deu nome a todos eles, cada um segundo o seu próprio nome» é compreensível, mas soa pouco natural em português. «Deu nomes a todos eles, a cada um o seu próprio nome» expressa com clareza a distribuição individual. «Assim ficou sendo» também é mais pesado que a construção simples «esse foi».
  terminology: «Adão» e «nome(s)» são adequados e consistentes com o registro bíblico em português. Não há termos teológicos controvertidos neste versículo.
