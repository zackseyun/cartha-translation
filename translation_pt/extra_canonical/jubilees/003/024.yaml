  yaml_path: translation/extra_canonical/jubilees/003/024.yaml
  text: And to Adam also he said, “Because you listened to the voice of your wife and ate from that tree from which I commanded you not to eat, cursed shall the ground be on your account. It shall produce thorns and thistles for you, and you shall eat your bread by the sweat of your face until you return to the ground from which you were taken; for you are earth, and to the earth you shall return.”
translation:
  language: pt
  text: 'E também disse a Adão: “Porque deste ouvidos à voz de tua mulher e comeste daquela árvore da qual te ordenei que não comesses, maldita seja a terra por tua causa. Ela produzirá para ti espinhos e cardos, e comerás o teu pão com o suor do teu rosto, até voltares à terra da qual foste tirado; pois tu és terra e à terra voltarás.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድር (mədr)
  choice: terra
  rationale: O mesmo termo designa o solo amaldiçoado, a matéria da qual Adão foi tirado e o lugar ao qual retornará; repetir “terra” preserva o vínculo literário e teológico do original.
- source_word: ቃለ፡ ብእሲትከ
  choice: a voz de tua mulher
  rationale: Tradução direta da expressão, mantendo o registro solene e a formulação tradicional sem acrescentar interpretação.
- source_word: እከዋከ፡ ወአሜካሳ
  choice: espinhos e cardos
  rationale: Equivalentes portugueses correntes para as duas plantas nocivas mencionadas no texto.
- source_word: በሐፈ፡ ገጽከ
  choice: com o suor do teu rosto
  rationale: Reproduz a imagem corporal do original em português natural e reconhecível.
- source_word: ሣዕስቲከ
  choice: o teu pão
  rationale: Segue o sentido alimentar adotado pela tradição textual de consulta e dá uma formulação portuguesa idiomática no contexto do trabalho penoso.
theological_decisions:
- issue: Relação entre Adão e a terra
  choice: Repetir “terra” nas três ocorrências
  alternative: Alternar entre “solo”, “terra” e “pó”
  rationale: A repetição preserva a conexão verbal explícita do texto sem introduzir “pó”, que não aparece nesta formulação ge'ez.
- issue: Fundamento da maldição
  choice: “por tua causa”
  alternative: “por tua culpa”
  rationale: “Por tua causa” expressa a relação causal sem intensificar o texto com uma formulação jurídica ou moral adicional.
translation_notes:
  register: Português moderno, dignificado e amplamente compreensível, com sintaxe bíblica moderada. Emprega “tu” para conservar a alocução direta e solene, evitando arcaísmos mais marcados.
