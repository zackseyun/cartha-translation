lexical_decisions:
- source_word: ለበሊዕ
  choice: para comer
  rationale: Expressa naturalmente a finalidade indicada pela forma infinitiva, preservando a ligação do fragmento com o contexto anterior.
- source_word: እምኔሁ
  choice: dele
  rationale: Mantém o pronome de origem do texto ge'ez, cujo referente é determinado pelo contexto.
- source_word: ኀፍረታ
  choice: sua nudez
  rationale: No contexto da cobertura com folhas, 'nudez' comunica com clareza o sentido concreto de vergonha ou partes vergonhosas sem produzir uma formulação artificial.
- source_word: በቈጽለ፡ በለስ
  choice: com folhas de figueira
  rationale: Equivalente português corrente para a expressão 'com folhas de figo/figueira'.
- source_word: ዘቀዳሚ
  choice: Primeiro
  rationale: Preserva explicitamente o valor temporal 'primeiro', indicando que ela se cobriu antes de dar o fruto a Adão.
