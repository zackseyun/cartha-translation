base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/001.yaml
  text: 'And during the six days of the second week we brought to Adam, by the word of the Lord, all the beasts, and all the livestock, and all the birds, and everything that moves on the earth, and everything that moves in the waters, according to their kinds and according to their forms: the beasts on the first day, the livestock on the second day, the birds on the third day, and everything that moves on the earth on the fourth day, and what moves in the waters on the fifth day.'
translation:
  language: pt
  text: 'E, durante os seis dias da segunda semana, trouxemos a Adão, pela palavra do Senhor, todos os animais selvagens, todos os animais domésticos, todas as aves, tudo o que se move sobre a terra e tudo o que se move nas águas, segundo suas espécies e segundo suas formas: os animais selvagens no primeiro dia, os animais domésticos no segundo dia, as aves no terceiro dia, tudo o que se move sobre a terra no quarto dia e o que se move nas águas no quinto dia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰዱስ፡ መዋዕል
  choice: durante os seis dias
  rationale: Reproduz o valor temporal plural da expressão ge'ez e concorda com a distribuição das ações por vários dias no restante do versículo.
- source_word: አራዊተ
  choice: animais selvagens
  rationale: Distingue esta categoria de እንስሳ, que designa os animais domésticos ou rebanhos.
- source_word: እንስሳ
  choice: animais domésticos
  rationale: Expressão portuguesa ampla e natural para os animais mantidos pelo ser humano, sem restringir o sentido apenas ao gado bovino.
- source_word: በቃለ፡ እግዚአብሔር
  choice: pela palavra do Senhor
  rationale: Mantém de modo transparente a formulação do texto-fonte, sem reduzir 'palavra' a uma interpretação como 'ordem'.
- source_word: በበ፡ ዘመዶሙ ወበበ፡ አምሳሎሙ
  choice: segundo suas espécies e segundo suas formas
  rationale: Preserva as duas classificações paralelas do ge'ez e sua distinção lexical.
- source_word: ዘይትነወስ / ዘይትሐወስ
  choice: o que se move
  rationale: Formulação abrangente que acompanha o sentido verbal e evita especificar indevidamente uma classe zoológica.
theological_decisions:
- issue: Agente plural em 'trouxemos'
  choice: Preservar a primeira pessoa do plural
  alternative: Explicitar 'nós, os anjos'
  rationale: O texto apresenta o agente na primeira pessoa do plural, mas este versículo não o identifica expressamente; explicitar anjos importaria informação contextual para o corpo do texto.
- issue: Força de 'palavra do Senhor'
  choice: Manter 'pela palavra do Senhor'
  alternative: Traduzir 'por ordem do Senhor'
  rationale: A tradução escolhida conserva a imagem e a possível amplitude teológica de 'palavra', sem negar que ela possa funcionar como ordem divina no contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A enumeração e o paralelismo do original foram preservados, evitando arcaísmos e especificações zoológicas excessivas.
