  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: pt
  text: 'Por isso, foi estabelecida para a mulher que der à luz um menino ou uma menina a prescrição para esses dias: ela não tocará em nada santo nem entrará no santuário até que'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: foi estabelecida
  rationale: Expressa a instituição formal da prescrição, preservando a voz passiva do texto.
- source_word: ለእኅተ፡ ትውልድ፡ ለተባዕት፡ ወለአንስት
  choice: para a mulher que der à luz um menino ou uma menina
  rationale: Reproduz naturalmente em português a referência à parturiente e aos dois sexos da criança.
- source_word: ፍትሖን
  choice: a prescrição
  rationale: No contexto ritual e jurídico, indica uma determinação ou norma estabelecida; “prescrição” mantém esse registro sem impor terminologia denominacional.
- source_word: መዋዕል፡ ኵሎ
  choice: todos esses dias
  rationale: Conserva a abrangência temporal da expressão e sua relação com o período ritual mencionado.
- source_word: ቅዱሰ፡ ኢትልከፍ
  choice: não tocará em nada santo
  rationale: Mantém a proibição ritual e o valor abrangente do objeto santo.
- source_word: ውስተ፡ መቅደስ፡ ኢትባእ
  choice: nem entrará no santuário
  rationale: Tradução direta e idiomática da proibição de entrar no lugar sagrado.
- source_word: እስከ፡ አመ
  choice: até o dia em que
  rationale: Preserva a oração incompleta que continua no versículo seguinte, sem completar indevidamente o sentido.
theological_decisions:
- issue: Natureza da norma pós-parto
  choice: prescrição
  alternative: lei / estatuto
  rationale: “Prescrição” comunica uma determinação ritual concreta sem ampliar o texto para uma caracterização teológica mais geral.
- issue: Forma verbal das proibições
  choice: 'futuro com valor normativo: “não tocará... nem entrará”'
  alternative: 'presente: “não toca... nem entra”'
  rationale: O futuro soa natural no registro jurídico bíblico em português e conserva a força normativa.
translation_notes:
  register: Português moderno, claro e digno, com leve registro jurídico-ritual. A frase termina deliberadamente em suspensão porque o texto-fonte continua no versículo seguinte.
