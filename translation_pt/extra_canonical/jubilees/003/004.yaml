base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/004.yaml
  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
translation:
  language: pt
  text: 'E o Senhor nos disse: “Não é bom que o homem esteja sozinho; façamos para ele uma ajudadora semelhante a ele.” Então o Senhor, nosso Deus, fez cair sobre ele um sono profundo, e ele adormeceu. Tirou dentre os seus ossos um osso para a mulher; e aquela costela, dentre os seus ossos, foi a origem[a] da mulher. Depois, formou carne no lugar dela e formou a mulher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a formação” ou “a criação”.'
    reason: O termo etíope ፍጥረት pode referir-se a formação, criação ou origem. “Origem” produz uma oração portuguesa mais natural, enquanto a nota preserva a amplitude lexical.
lexical_decisions:
- source_word: መርዳእ፡ ዘከማሁ
  choice: uma auxiliadora que lhe corresponda
  rationale: Expressa tanto a ideia de ajuda quanto a de semelhança/correspondência, sem reduzir a mulher a mera assistente nem resolver além do texto a relação indicada por ዘከማሁ.
- source_word: ዐጽመ፡ አሐደ
  choice: um osso
  rationale: O substantivo é genericamente 'osso'; a identificação específica como costela aparece na oração seguinte.
- source_word: ገቦ
  choice: costela
  rationale: Aqui o texto emprega o termo anatômico específico, em contraste com o 'osso' da oração anterior.
- source_word: ፍጥረት
  choice: formação
  rationale: Mantém o sentido de criação, origem ou constituição da mulher dentro de uma frase que descreve seu surgimento.
- source_word: ሐነጸ
  choice: formou
  rationale: O verbo tem o sentido básico de construir/edificar; 'formou' soa natural em português no relato da criação e preserva a ação deliberada, inclusive em sua repetição.
theological_decisions:
- issue: Plural divino em “façamos” e destinatário em “nos disse”
  choice: Manter “nos disse” e “façamos” literalmente
  alternative: Reformular no singular ou identificar explicitamente os interlocutores como anjos
  rationale: O texto apresenta ambos os plurais, mas não identifica nesta frase quem integra o grupo; a tradução preserva essa tensão sem impor uma explicação teológica.
- issue: Relação da auxiliadora com o homem
  choice: “que lhe corresponda”
  alternative: “semelhante a ele” ou “adequada para ele”
  rationale: A formulação conserva as noções de semelhança e correspondência sem definir hierarquia, identidade ou complementaridade em termos confessionais.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se a repetição de “formou” e a alternância lexical entre “osso” e “costela”, pois ambas refletem distinções e ênfases do texto ge'ez.
