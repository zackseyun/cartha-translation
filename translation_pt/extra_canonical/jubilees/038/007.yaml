  yaml_path: translation/extra_canonical/jubilees/038/007.yaml
  text: And Reuben and Issachar and Zebulun went out toward the north side of the tower, and fifty were with them; and they killed the fighting men of the Philistines.
translation:
  language: pt
  text: Rúben, Issacar e Zebulom saíram em direção ao lado norte da torre, e cinquenta estavam com eles; e mataram os combatentes dos filisteus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወፅኡ
  choice: saíram
  rationale: Reproduz diretamente o verbo de movimento no plural, com a conjunção inicial absorvida pela fluência natural do português.
- source_word: እንተ፡ ገጸ፡ ሰሜን፡ ለማኅፈድ
  choice: em direção ao lado norte da torre
  rationale: Mantém a orientação espacial e a referência à torre sem tornar a construção artificial em português.
- source_word: ወ፶ ምስሌሆሙ
  choice: acompanhados de cinquenta homens
  rationale: Expressa naturalmente que cinquenta pessoas estavam com eles; “homens” é inferido pelo contexto militar.
- source_word: መስተባእሳኒሆሙ
  choice: os combatentes
  rationale: Designa aqueles que lutavam, evitando tanto o coloquial “homens de luta” quanto a possível conotação profissional de “guerreiros”.
- source_word: ለፍልስጥኤም
  choice: dos filisteus
  rationale: Forma portuguesa corrente para o gentílico, preservando a relação com os combatentes.
