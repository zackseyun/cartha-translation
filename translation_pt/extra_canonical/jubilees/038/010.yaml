lexical_decisions:
- source_word: ወገር (wagar)
  choice: monte
  rationale: O termo ge'ez denota uma elevação, como monte ou montanha. “Monte” preserva o dado topográfico sem sugerir necessariamente uma grande montanha.
- source_word: ቀበሮ (qabarō)
  choice: sepultou
  rationale: Expressa de modo natural e digno o ato de enterrar o morto.
- source_word: እኅዋሁ (ʾəḫwāhu)
  choice: seu irmão
  rationale: Mantém a relação fraterna explicitada no texto.
- source_word: ወገብአ (wagabaʾa)
  choice: e voltou
  rationale: Reproduz a sequência narrativa e o sentido de retornar.
- source_word: ውስተ ቤቱ (wəsta bētu)
  choice: para casa
  rationale: Formulação corrente em português para o retorno à própria casa; o possessivo fica naturalmente implícito.
