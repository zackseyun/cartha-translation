lexical_decisions:
- source_word: ፈነወ፡ ሐጸ
  choice: atirou uma flecha
  rationale: Expressa em português natural a ação de lançar/disparar uma flecha, de acordo com o contexto bélico.
- source_word: አዶራንሃ
  choice: Adorã
  rationale: Transliteração portuguesa do nome próprio Adoran, com terminação nasal claramente legível.
- source_word: አረማዊ
  choice: o arameu
  rationale: Mantém a identificação étnica do texto-fonte em forma corrente em português.
- source_word: ጥቦ፡ ፀጋማዊ
  choice: no lado esquerdo do peito
  rationale: Reproduz a localização corporal indicada pelo ge'ez, evitando a possível leitura moderna de 'seio'.
- source_word: ወሰደዶ
  choice: ele o fez recuar
  rationale: Preserva o sentido de repelir ou impelir para trás sem especificar um meio não declarado.
- source_word: ወቀተሎ
  choice: e o matou
  rationale: Tradução direta e inequívoca da ação final.
