  yaml_path: translation/extra_canonical/jubilees/038/020.yaml
  text: And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned in his place; and the name of his city was Avith.
translation:
  language: pt
  text: Asam morreu, e Adat, filho de Barad, que feriu Midiã no campo de Moabe, reinou em seu lugar[a]; o nome de sua cidade era Avite.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, em tradução menos literal, “reinou depois dele”.
    reason: Registra uma alternativa tradicional de tradução; “em seu lugar” representa mais diretamente o sentido de sucessão expresso no texto ge’ez.
lexical_decisions:
- source_word: ህየንቴሁ
  choice: em seu lugar
  rationale: Expressa diretamente a ideia de ocupar o lugar ou suceder alguém, em vez de indicar apenas uma sequência cronológica.
- source_word: ዘቀተለ፡ ምዕድያምሃ
  choice: que derrotou Midiã
  rationale: Embora ቀተለ tenha sentido básico de matar ou ferir, neste contexto régio e militar a expressão indica a derrota de Midiã, em paralelo com a tradição textual de Gênesis 36:35.
- source_word: በሐቅለ፡ ሞአብ
  choice: no campo de Moabe
  rationale: Mantém a formulação geográfica concreta do texto-fonte de maneira natural em português.
- source_word: ወስመ
  choice: o nome de sua cidade era
  rationale: A fonte fornecida termina no início desta oração por causa da divisão editorial; a continuação é preservada pela camada de consulta auditada e pelo contexto textual conhecido.
