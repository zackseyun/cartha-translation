  yaml_path: translation/extra_canonical/jubilees/038/008.yaml
  text: And Simeon and Benjamin and Enoch, the son of Reuben, went out to the west side of the tower, and fifty were with them; and they killed four hundred valiant warriors of Edom and the Horites.
translation:
  language: pt
  text: Simeão, Benjamim e Enoque, filho de Rúben, saíram para o lado oeste da torre, e cinquenta estavam com eles; e mataram quatrocentos guerreiros valentes dos edomitas e dos horeus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገጸ፡ ዐረቢሁ፡ ለማኅፈድ
  choice: para o lado oeste da torre
  rationale: Reproduz o sentido espacial da expressão etíope de modo direto e natural em português.
- source_word: ጽኑዓነ፡ መስተቃትላነ
  choice: guerreiros valentes
  rationale: A combinação descreve homens fortes ou valentes, aptos para o combate; a formulação evita a repetição pouco natural de dois qualificativos em português.
- source_word: ወ*፶* ምስሌሆሙ
  choice: acompanhados de cinquenta homens
  rationale: Expressa naturalmente a ideia literal de que cinquenta estavam com eles; 'homens' fica implícito no contexto militar.
- source_word: ኤዶማ፡ ... ወኤዶማ፡ ሖሬዎን
  choice: de Edom e dos horeus
  rationale: Mantém os dois grupos associados aos quatrocentos mortos, seguindo o sentido contextual da construção preservada no texto etíope.
