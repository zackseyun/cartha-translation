  rationale: A revisão conserva a violência e todos os dados narrativos, mas substitui uma inferência editorial por uma formulação literal e natural («cinquenta estavam com eles») e explicita de forma paralela os dois povos mencionados. Não é necessária nota, pois a redação resultante não resolve nem oculta uma ambiguidade textual relevante.
