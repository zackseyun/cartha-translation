  text: E mandaram perguntar ao pai se deviam fazer as pazes com eles ou matá-los.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአኩ
  choice: mandaram perguntar
  rationale: O verbo significa literalmente “enviaram”; no contexto, a finalidade interrogativa é expressa naturalmente em português por “mandaram perguntar”.
- source_word: ይገብሩ፡ ሰላመ
  choice: deviam fazer as pazes
  rationale: Reproduz a expressão “fazer paz” em português corrente, deixando claro que se trata de reconciliação com o grupo mencionado.
- source_word: ይቀትልዎሙ
  choice: matá-los
  rationale: Traduz diretamente o verbo “matar” com o objeto pronominal plural; preserva a alternativa completa atestada no texto geʿez fornecido.
