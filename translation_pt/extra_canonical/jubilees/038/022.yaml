  text: Salman morreu, e Saul, de Reobote junto ao rio, reinou em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ (mota)
  choice: morreu
  rationale: Equivalente direto e natural do verbo ge'ez para morrer.
- source_word: ነግሠ (nägśa)
  choice: reinou
  rationale: Expressa diretamente o exercício da realeza e mantém a concisão narrativa.
- source_word: ህየንቴሁ (həyäntehu)
  choice: em seu lugar
  rationale: Preserva o sentido espacial e sucessório de 'no lugar dele', mais preciso do que apenas 'depois dele'.
- source_word: ዘእም፡ ራኦቦት፡ ፈለግ (za'em Ra'obot Fäläg)
  choice: de Reobote junto ao rio
  rationale: Trata Reobote como topônimo e 'rio' como sua especificação locativa, em português natural; corresponde à localidade conhecida como Reobote junto ao Rio.
