  yaml_path: translation/extra_canonical/jubilees/038/001.yaml
  text: And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send forth your arrows, and cast down the enemy and kill the adversary; and let there be strength for you, for we will not kill your brother, for he is your companion and he is like you; let us give him honor.”
translation:
  language: pt
  text: 'Depois disso, Judá falou a Jacó, seu pai, e lhe disse: “Entesa o teu arco, pai, e dispara as tuas flechas; derruba o inimigo e mata o adversário. Que tenhas força, pois não mataremos o teu irmão, porque ele é teu companheiro e semelhante a ti; demos-lhe honra.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto ge''ez desta parte apresenta formas problemáticas na tradição impressa. A tradução segue a leitura contextual: “não mataremos o teu irmão, porque ele é teu companheiro e semelhante a ti; demos-lhe honra”. Outra leitura, baseada estritamente nas formas impressas, seria: “mataremos o inimigo de teus irmãos. Tua mão está contigo, e tua ajuda está contigo; nós o daremos a ti para honra”.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ምስከ፡ ቀስተከ
  choice: Entesa o teu arco
  rationale: O verbo indica puxar ou curvar o arco, isto é, prepará-lo para o disparo; “entesar” expressa essa ação com precisão e naturalidade em português.
- source_word: ወፈኑ፡ አሕፃከ
  choice: e dispara as tuas flechas
  rationale: ፈነወ tem o sentido de enviar ou lançar; no contexto de arco e flechas, “disparar” comunica naturalmente a ação pretendida.
- source_word: ጸላኢ፡ ... ፀረዊ
  choice: o inimigo ... o adversário
  rationale: Mantém o paralelismo entre dois termos próximos, sem reduzi-los a uma única designação.
- source_word: ወይኩን፡ ለከ፡ ኀይለ
  choice: Que tenhas força
  rationale: Reproduz a formulação volitiva do ge'ez em português corrente e digno.
- source_word: አኅዋከ
  choice: o teu irmão
  rationale: Segue a leitura contextual no singular indicada pela correção textual subjacente à tradução, em vez da leitura superficial problemática do texto impresso.
- source_word: ንህቦ፡ ለክብር
  choice: demos-lhe honra
  rationale: Conserva o sentido exortativo e o referente pessoal masculino, sem introduzir a ideia não sustentada de dar algo a Jacó.
theological_decisions:
- issue: Tratamento do irmão que é também adversário
  choice: “não mataremos o teu irmão... demos-lhe honra”
  alternative: “mataremos o inimigo de teus irmãos... nós o daremos a ti para honra”
  rationale: 'A escolha segue a leitura contextual corrigida do ge''ez e preserva a tensão do texto: o adversário deve ser abatido, mas o irmão de Jacó não deve ser morto e deve receber honra. A alternativa resulta de formas textuais ou tipográficas problemáticas e produz referentes pouco coerentes.'
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. Empregou-se “entesa” por sua precisão no contexto do arco; a sintaxe foi levemente ajustada para fluidez sem eliminar o paralelismo nem a dificuldade textual do final do versículo.
