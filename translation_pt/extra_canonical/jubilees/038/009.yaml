  text: 'And six hundred fled, and four of the sons of Esau fled with them; and they left their father slain, as he had fallen in the hill-country which is in Add footnote: "Ge''ez reads Adufim, likely a scribal corruption of Adurim.". And the sons of Jacob pursued them as far as Mount Seir.'
translation:
  language: pt
  text: E seiscentos fugiram, e quatro dos filhos de Esaú fugiram com eles. Deixaram o pai morto, caído na região montanhosa que fica em Adufim[a]. E os filhos de Jacó os perseguiram até o monte Seir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Possivelmente “Adurim”. O texto ge’ez traz “Adufim”, provavelmente por corrupção na transmissão do texto.
    reason: Registra com transparência a leitura da fonte e a emenda geográfica proposta por estudiosos, sem substituir silenciosamente o texto atestado.
lexical_decisions:
- source_word: ስድስቱ፡ ምእት
  choice: seiscentos homens
  rationale: O numeral significa literalmente “seiscentos”; “homens” explicita naturalmente em português o grupo humano já pressuposto pelo contexto.
- source_word: ጕዩ
  choice: fugiram
  rationale: Reproduz diretamente o movimento de fuga, repetido no texto para os seiscentos e para os quatro filhos de Esaú.
- source_word: ቅቱለ
  choice: morto
  rationale: O termo indica que o pai foi morto; a formulação portuguesa evita sugerir que ele apenas morreu por causa da queda.
- source_word: ወገር
  choice: região montanhosa
  rationale: Expressa o sentido topográfico do termo de modo natural, sem reduzi-lo a uma única colina.
- source_word: አዱፊም
  choice: Adufim
  rationale: Mantém no texto principal a leitura efetivamente atestada no ge’ez, deixando a possível correção para a nota.
- source_word: ደብረ፡ ሴኢር
  choice: monte Seir
  rationale: Forma portuguesa tradicional e clara do topônimo, correspondente à expressão “monte de Seir”.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com coordenação narrativa simples. A repetição de “fugiram” foi preservada por corresponder à estrutura enfática da fonte. “Caído” foi ligado a “morto” para manter a imagem do pai deixado no lugar em que tombara.
