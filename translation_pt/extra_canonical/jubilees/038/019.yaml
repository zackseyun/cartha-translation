  text: E Jobabe morreu, e Assã, da região montanhosa de Temã, reinou em seu lugar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሞተ
  choice: E ... morreu
  rationale: Reproduz de modo natural a coordenação narrativa e o sentido direto do verbo ge'ez.
- source_word: ዮባብ
  choice: Jobabe
  rationale: Forma portuguesa tradicional do nome bíblico correspondente a Jobab.
- source_word: ነግሠ
  choice: reinou
  rationale: Expressa diretamente o início ou exercício do reinado no contexto da sucessão régia.
- source_word: ህየንቴሁ
  choice: em seu lugar
  rationale: Preserva o sentido específico de substituição ou sucessão no lugar dele, em vez do sentido meramente temporal de 'depois dele'.
- source_word: አሳም
  choice: Assã
  rationale: Transliteração portuguesa legível do nome ge'ez, sem identificá-lo indevidamente com outra forma nominal.
- source_word: ዘእም፡ ደብረ፡ ቴማን
  choice: da região montanhosa de Temã
  rationale: Traduz a proveniência e dá a ደብረ um sentido geográfico natural, sem restringi-lo necessariamente a uma única montanha.
