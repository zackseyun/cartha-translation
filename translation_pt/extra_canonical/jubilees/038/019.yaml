translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa bíblica. A formulação mantém a precisão sucessória de ህየንቴሁ e verte ደብረ como uma área de relevo montanhoso. Não se incluiu nota, pois a alternativa inglesa 'depois dele' é menos exata diante do ge'ez.
