lexical_decisions:
- source_word: እስከ፡ ዛቲ፡ ዕለት
  choice: até o dia de hoje
  rationale: Reproduz de modo natural a expressão temporal do ge'ez, sem ampliar seu sentido.
- source_word: በምድረ፡ ኤዶም
  choice: na terra de Edom
  rationale: Mantém a designação geográfica explícita e a forma tradicional do topônimo em português.
- source_word: ባላቅ፡ ወልደ፡ ቤዖር
  choice: Balaque, filho de Beor
  rationale: Emprega formas portuguesas legíveis dos nomes próprios e traduz literalmente a relação de filiação.
- source_word: ወነግሠ
  choice: E ... reinou
  rationale: Preserva tanto a conjunção que abre a oração quanto o sentido régio do verbo.
- source_word: ደናባ / Denaba
  choice: Denaba
  rationale: Conserva a forma do nome da cidade atestada pela camada de consulta, sem harmonizá-la com variantes de outras tradições textuais.
