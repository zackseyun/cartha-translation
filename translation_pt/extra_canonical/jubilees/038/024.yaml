  text: And Baelunan son of Achbor died, and Adath reigned in his place; and the name of his wife was Mayṭabigo, daughter of Maṭarego, daughter of Metebedzaab.
translation:
  language: pt
  text: E Baelunan, filho de Acbor, morreu, e Adate reinou em seu lugar; e o nome de sua esposa era Maytabigo, filha de Matarego, filha de Metebedzaab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ
  choice: em seu lugar
  rationale: Expressa substituição no cargo ou posição, de modo mais preciso que a alternativa temporal «depois dele».
- source_word: መይጠቢጎ
  choice: Maitabigo
  rationale: Preserva na transliteração portuguesa o elemento ይ (y), representado naturalmente por «i» no ditongo «ai», sem harmonizar o nome com formas de outras tradições textuais.
- source_word: ነግሠ
  choice: reinou
  rationale: É o equivalente direto e natural do verbo que indica exercer o reinado.
- source_word: ብእሲቱ
  choice: esposa dele
  rationale: No contexto genealógico e régio, designa a mulher do rei; esta formulação é clara e corrente em português.
