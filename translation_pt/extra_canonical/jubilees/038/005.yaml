  yaml_path: translation/extra_canonical/jubilees/038/005.yaml
  text: And Judah went out first, and Naphtali and Gad with him, and fifty servants with him, toward the south side of the tower; and they killed all whom they found before them, and none of them escaped, not even one.
translation:
  language: pt
  text: Judá saiu primeiro, e Naftali, Gade e cinquenta servos foram com ele, em direção ao lado sul da torre. Eles mataram todos os que encontraram diante de si, e nenhum deles escapou, nem um sequer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጹመ
  choice: primeiro
  rationale: No contexto da saída de Judá à frente do grupo, a leitura contextual transmitida pela tradição textual é vertida naturalmente como “primeiro”, de acordo com a evidência editorial e sem a rigidez de “na frente”.
- source_word: ገጸ፡ ደቡብ፡ ለማኅፈድ
  choice: em direção ao lado sul da torre
  rationale: 'Preserva a orientação espacial do texto: a face ou o lado meridional da torre.'
- source_word: ዘረከቡ፡ በቅድሜሆሙ
  choice: os que encontraram diante de si
  rationale: Mantém tanto a ideia de encontrar quanto a expressão espacial “diante deles”, em português natural.
- source_word: ወአልቦ፡ ዘአምለጠ፡ እምኔሆሙ፡ ወአሐዱኒ
  choice: e nenhum deles escapou, nem sequer um
  rationale: Conserva a negação total e sua intensificação final.
