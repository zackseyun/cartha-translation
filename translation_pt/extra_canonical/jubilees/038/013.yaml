base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/038/013.yaml
  text: And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should pay tribute to Jacob and his sons all their days.
translation:
  language: pt
  text: E Jacó mandou dizer a seus filhos que fizessem a paz. Eles fizeram a paz com eles e lhes impuseram um jugo de serviço, para que pagassem tributo[a] a Jacó e a seus filhos todos os seus dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “servissem a Jacó”.'
    reason: Registra uma tradução alternativa tradicional do verbo, embora “pagassem tributo” seja mais precisa no contexto.
lexical_decisions:
- source_word: ሰላመ (salāma)
  choice: paz / fizessem a paz
  rationale: Reproduz de modo natural a expressão repetida no texto, primeiro como ordem e depois como ação realizada.
- source_word: አርዑተ፡ ቅኔ (ʾarʿuta qenē)
  choice: jugo de serviço
  rationale: Mantém a metáfora concreta de um jugo e a ideia de sujeição laboral, sem restringi-la indevidamente a escravidão pessoal.
- source_word: ይጽብሑ (yiṣbəḥu)
  choice: pagassem tributo
  rationale: O verbo, neste contexto, indica prestação tributária; a nota registra a possibilidade tradicional mais ampla de serviço.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. Conservou-se “com eles” porque o referente está no contexto anterior e o versículo usa pronome. A forma inicial ይቀትልዎሙ (“eles os mataram”) foi tratada como encerramento do versículo anterior, de acordo com a divisão do capítulo e com o início reconhecido de 38:13.
