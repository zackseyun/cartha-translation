  text: days before God. And Joseph remembered this matter and refused to lie with her. And she urged him for one year and a second, but he refused to listen. And he/she made certain [or remove]
translation:
  language: pt
  text: … dias diante de Deus.[a] José se lembrou desse assunto e recusou-se a deitar-se com ela. Ela insistiu com ele durante um ano e mais um, mas ele se recusou a ouvi-la. Então ela procurou certificar-se disso.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão inicial parece ser o final da frase do versículo anterior; foi mantida porque faz parte do texto ge'ez fornecido.
    reason: segmentation_uncertainty
  - marker: b
    text: O sujeito não está expresso no ge'ez e o verbo também pode ser entendido como “averiguou”, “confirmou” ou “informou”. O texto fornecido termina abruptamente aqui.
    reason: lexical_and_segmentation_uncertainty
lexical_decisions:
- source_word: ተዘከረ
  choice: se lembrou
  rationale: Reproduz diretamente o sentido de recordar, tendo como objeto explícito ዘንተ ነገረ, “esse assunto”.
- source_word: አፈቀደ
  choice: recusou-se
  rationale: Neste contexto, o verbo expressa não consentir ou não querer; “recusou-se” é natural em português e mantém a oposição à insistência da mulher.
- source_word: ይስክብ ምስሌሃ
  choice: a deitar-se com ela
  rationale: Mantém o eufemismo sexual do texto-fonte sem torná-lo mais explícito.
- source_word: አስተብቍዐቶ
  choice: insistiu com ele
  rationale: Comunica súplica ou pressão reiterada no contexto, sem especificar indevidamente o modo da insistência.
- source_word: ዓመተ አሐደ ወካልአ
  choice: durante um ano e mais um
  rationale: Preserva a formulação distributiva incomum, isto é, um primeiro ano e um segundo, em vez de suavizá-la simplesmente para “dois anos”.
- source_word: አበየ ሰሚዐ
  choice: se recusou a ouvi-la
  rationale: Conserva a expressão concreta “ouvir”, que no contexto também implica não atender ao pedido dela.
- source_word: አጠየቀ
  choice: procurou certificar-se disso
  rationale: Representa cautelosamente o campo semântico causativo de averiguar, confirmar ou tornar certo; o sujeito feminino é inferido do contexto imediato.
theological_decisions:
- issue: Fragmento inicial possivelmente pertencente ao versículo anterior
  choice: Manter “… dias diante de Deus” com reticências e nota
  alternative: Omitir o fragmento como erro de segmentação
  rationale: A sequência consta expressamente no texto ge'ez fornecido. As reticências sinalizam que a unidade começa no meio de uma frase, sem deslocar silenciosamente o material.
- issue: Sujeito e sentido da oração final
  choice: “Então ela procurou certificar-se disso”
  alternative: “Então ele/ela averiguou” ou omitir a oração
  rationale: O contexto favorece a mulher como sujeito, mas a forma verbal isolada não explicita o gênero e seu alcance exato é incerto; a nota preserva essa ambiguidade textual.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. O eufemismo “deitar-se com ela” preserva o registro bíblico. As reticências inicial e a nota final tornam visíveis os aparentes cortes de segmentação sem reconstruir material ausente.
