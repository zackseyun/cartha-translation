  yaml_path: translation/extra_canonical/jubilees/039/010.yaml
  text: And the Egyptian saw Joseph’s garment and the broken door-bar, and he heard the account of his wife, and he put Joseph into the prison-house, into the place where the king’s prisoners were confined. And he was there.
translation:
  language: pt
  text: E o egípcio viu a roupa de José e a tranca da porta quebrada, ouviu o relato de sua mulher e mandou José para a prisão, para o lugar onde ficavam os prisioneiros que o rei havia encarcerado. E ele ficou ali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጐብጻዊ
  choice: o egípcio
  rationale: Reproduz diretamente a designação do homem no texto-fonte, sem acrescentar seu cargo ou nome.
- source_word: ልብሶ
  choice: a roupa
  rationale: Termo corrente e abrangente para a peça de vestuário de José; evita especificar indevidamente manto ou túnica.
- source_word: ማዕጾ፡ ስቡረ
  choice: a tranca da porta quebrada
  rationale: Expressa de modo claro e natural o objeto de fechamento que aparece quebrado no contexto.
- source_word: ነገረ፡ ብእሲቱ
  choice: o relato de sua mulher
  rationale: Mantém a ideia das palavras ou da versão apresentada pela mulher, sem afirmar que eram verdadeiras.
- source_word: ቤተ፡ ሞቅሕ
  choice: a prisão
  rationale: Equivalente português natural para a expressão literalmente associada à casa de confinamento.
- source_word: ወሀሎ
  choice: E ele ficou ali
  rationale: Preserva a conclusão breve do original sem acrescentar a expressão interpretativa “na prisão”.
