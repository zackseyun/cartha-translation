lexical_decisions:
- source_word: ጐየ
  choice: fugiu
  rationale: No contexto da acusação, expressa de modo natural que ele saiu correndo para escapar.
- source_word: ልብሶ
  choice: sua roupa
  rationale: Termo comum para veste ou roupa; o possessivo corresponde ao sufixo do texto.
- source_word: አኀዝክዎ
  choice: o agarrei
  rationale: Reproduz a ação física de segurar ou prender alguém sem acrescentar precisão ausente do texto.
- source_word: ሰበረ
  choice: arrombou
  rationale: O verbo significa literalmente quebrar; com uma porta como objeto, 'arrombou' oferece uma formulação portuguesa natural e mantém a ideia de rompimento forçado.
- source_word: ማዕጾ
  choice: porta
  rationale: É o sentido primário e mais direto do substantivo ge'ez; evita substituir o objeto por um possível componente específico, como a tranca.
