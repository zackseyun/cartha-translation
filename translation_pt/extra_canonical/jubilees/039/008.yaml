  text: And that woman saw that he would not lie with her, and she accused him before his master, saying, “Your Hebrew slave, whom you love, wanted to force me[a] so as to lie with me; and it happened that when
translation:
  language: pt
  text: 'E aquela mulher viu que ele não se deitaria com ela e o acusou diante do seu senhor, dizendo: “O teu escravo hebreu, a quem amas, quis forçar-me a deitar-me com ele[a]; e aconteceu que, quando'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo da acusação traduzido como “forçar-me a deitar-me com ele” também pode ser entendido, de modo mais geral, como “agredir-me” ou “zombar de mim”; porém, as orações ao redor indicam uma acusação de tentativa sexual.
    reason: lexical_alternative
lexical_decisions:
- source_word: አይስክብ፡ ምስሌሃ
  choice: não se deitaria com ela
  rationale: Mantém o eufemismo sexual do ge’ez, em linguagem portuguesa clara e digna.
- source_word: ጠየቀተ፡ ቅድመ፡ እግዚአ
  choice: o acusou diante do seu senhor
  rationale: No contexto, o ato de apresentar a alegação perante o senhor de José é adequadamente expresso por “acusou”; “diante de” conserva a formulação relacional da fonte.
- source_word: ገብርከ፡ ዕብራዊ
  choice: o teu escravo hebreu
  rationale: “Escravo” comunica com precisão a condição social indicada por ገብር neste contexto, sem suavizá-la para “servo”.
- source_word: ይትዐገላኒ
  choice: quis me forçar
  rationale: Expressa intenção e coerção sem acrescentar movimento ou consumação; a amplitude possível do verbo é registrada em nota.
- source_word: ወኮነ፡ ሶበ
  choice: e aconteceu que, quando
  rationale: Preserva a fórmula narrativa e o término incompleto do versículo transmitido.
