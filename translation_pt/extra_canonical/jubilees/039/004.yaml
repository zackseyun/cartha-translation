  text: And Joseph was handsome in appearance and very good to look at, and his master's wife lifted up her eyes and saw Joseph and loved him, and asked him
translation:
  language: pt
  text: O SENHOR fazia prosperar tudo o que ele fazia. José era belo de aparência e muito belo de se ver[a]. A mulher de seu senhor ergueu os olhos, viu José, amou-o e lhe fez um pedido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “muito bom de se ver”.
    reason: Registra uma formulação mais literal da segunda descrição da aparência de José, enquanto o texto principal exprime naturalmente a beleza visual intensificada.
lexical_decisions:
- source_word: ይሴርሖ
  choice: fazia prosperar
  rationale: O verbo expressa fazer prosperar ou levar a bom resultado; a construção contínua em português se ajusta ao contexto narrativo.
- source_word: ሠናይ፡ ራእዮ፡ ወላህይ፡ ራእዮ፡ ጥቀ
  choice: belo de aparência e muito agradável de se ver
  rationale: Preserva as duas descrições da aparência de José e mantém a intensidade explícita de ጥቀ, ‘muito’.
- source_word: አፍቀረቶ
  choice: amou-o
  rationale: Traduz diretamente o verbo ‘amar’, sem substituir seu sentido pelo desejo sexual implícito no contexto.
- source_word: አስተብቍዐቶ
  choice: lhe fez um pedido
  rationale: Expressa o ato de pedir ou rogar e preserva o caráter incompleto da frase, que conduz ao pedido apresentado na sequência.
theological_decisions:
- issue: A agência divina no êxito de José
  choice: O SENHOR fazia prosperar tudo o que ele fazia
  alternative: Tudo o que José fazia prosperava
  rationale: A redação mantém explicitamente Deus como agente, conforme o texto ge’ez, sem reduzir a frase a uma afirmação impessoal sobre o sucesso de José.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A abertura presente no ge’ez foi traduzida, embora não apareça na camada inglesa fornecida; o paralelismo da descrição física e o intensificador ጥቀ foram preservados.
