  source_fidelity: 'A tradução preserva a sequência e o sentido central do ge''ez: José refreia a si mesmo, recorda o SENHOR e a instrução patriarcal, a proibição diz respeito à relação sexual ilícita com mulher casada, a pena de morte é decretada nos céus perante Deus Altíssimo, e o pecado é inscrito contra o transgressor nos livros eternos. Contudo, «para sempre registrado» desloca a nuance final de በኵሉ, que é melhor expressa por «continuamente»/«sempre», e pode sugerir sobretudo permanência do registro.'
