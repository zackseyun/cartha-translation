  text: to lie with her. But he guarded his soul and remembered the LORD and the words that Jacob his father used to recite from the words of Abraham[a], that no man should commit fornication with a woman who has a husband, for the judgment of death has been ordained for him in heaven before the Most High God, and the sin is recorded against him in the eternal books continually.
translation:
  language: pt
  text: 'para se deitar com ela. Mas ele se conteve, lembrou-se do SENHOR e das palavras de Abraão que Jacó, seu pai, costumava recitar[a]: nenhum homem deve cometer imoralidade sexual com uma mulher casada, pois, para quem o fizer, a sentença de morte foi estabelecida nos céus diante do Deus Altíssimo, e o pecado é continuamente registrado contra ele nos livros eternos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A referência a Jacó recitando palavras transmitidas por Abraão é uma ampliação característica de Jubileus: a recusa de José é fundamentada na instrução patriarcal recebida, e não apenas em sua convicção pessoal.'
    reason: cross_reference
lexical_decisions:
- source_word: አመጠወ፡ ነፍሶ፡
  choice: ele se conteve
  rationale: A expressão descreve José refreando a si mesmo; a formulação reflexiva é natural em português e mantém o foco em seu domínio próprio.
- source_word: ይዜሙ፡
  choice: cometer imoralidade sexual
  rationale: O verbo designa conduta sexual ilícita. No contexto de uma mulher casada, trata-se especificamente de adultério, mas a escolha preserva a formulação mais ampla do termo-fonte.
- source_word: ኵነኔ፡ ሞት፡
  choice: sentença de morte
  rationale: Expressa com clareza o juízo ou condenação à morte estabelecido para o transgressor.
- source_word: ወኀጢአት፡ ተዐርገ፡ በእንቲአሁ፡ ውስተ፡ መጻሕፍት፡ ዘለዓለም፡ በኵሉ፡
  choice: e o pecado fica para sempre registrado contra ele nos livros eternos
  rationale: Verte idiomaticamente a imagem de o pecado subir aos livros eternos contra o culpado, preservando a ideia de registro acusatório contínuo sem acrescentar uma referência divina ausente no fim do texto ge'ez.
theological_decisions:
- issue: Força normativa da construção ከመ፡ አልቦ፡ ... ዘይዜሙ፡
  choice: nenhum homem deve cometer
  alternative: não há homem que cometa
  rationale: No contexto da instrução patriarcal lembrada por José, a construção exerce função proibitiva, e não a de uma afirmação descritiva absoluta.
- issue: Origem e autoridade da instrução moral
  choice: palavras que Jacó costumava recitar dentre as palavras de Abraão
  alternative: ensinamentos pessoais de Jacó
  rationale: Mantém a cadeia de transmissão patriarcal explicitada no texto, sem atribuir as palavras apenas a Jacó nem equipará-las indevidamente a uma citação bíblica canônica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais. “SENHOR” representa o título divino do texto. A expressão final foi mantida como “para sempre”, sem acrescentar “diante do SENHOR”, pois essa frase não aparece no encerramento do ge'ez.
