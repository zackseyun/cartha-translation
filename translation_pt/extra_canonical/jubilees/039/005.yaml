  terminology: «SENHOR», «Deus Altíssimo», «sentença de morte» e «livros eternos» são escolhas adequadas. «Imoralidade sexual» mantém a amplitude do verbo, embora o contexto seja o de uma mulher casada; não é necessário estreitá-lo a «adultério».
