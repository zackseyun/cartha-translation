  text: ወበከመ፡ ፈከረ፡ ሎሙ፡¹ ከማሁ፡ ኮኖሙ፡ ወ²ለሊቀ፡ መዘርት፡³ አግብኦ፡ ፈርዖን፡ ውስተ፡ ግብሩ፡ ወለሐባዚስ፡⁴ ቀተሎ፡ በከመ፡ ፈከረ፡ ሎሙ፡¹ ዮሴፍ። ወረሰዮ፡ ሊቀ፡ መዘርት፡ ለዮሴፍ፡ ቤተ፡ ሞቅሕ፡ አመ፡¹ አይድዖ፡ ዘይከውን፡ ወኢተዘከረ፡ ከመ፡ ያይድዕ፡ ለፈርዖን፡ ዘከመ፡ ነገሮ፡ ዮሴፍ፡ እስመ፡ ረሳዐ።
