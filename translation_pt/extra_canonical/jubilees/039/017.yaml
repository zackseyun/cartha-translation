base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/017.yaml
  text: 'And as he interpreted for them, so it happened to them: Pharaoh restored the chief cupbearer to his service, but the baker he killed, just as Joseph had interpreted for them. But the chief cupbearer forgot Joseph in the prison-house, although he had told him what would happen[a], and he did not remember to make it known to Pharaoh what Joseph had told him, for he forgot.[b]'
translation:
  language: pt
  text: 'E aconteceu com eles exatamente como José havia interpretado: o faraó restituiu o chefe dos copeiros ao seu serviço, mas mandou matar o padeiro, conforme José lhes havia interpretado. Contudo, o chefe dos copeiros esqueceu-se de José na prisão, embora José lhe tivesse dito o que aconteceria[a]; não se lembrou de contar ao faraó o que José lhe havia dito, pois se esqueceu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “depois de José lhe ter dito o que aconteceria”.'
    reason: A partícula etíope pode ser entendida em sentido temporal; no contexto, também pode introduzir uma ideia concessiva.
  - marker: b
    text: A frase final é pouco clara no texto etíope transmitido. O sentido parece ser que o chefe dos copeiros esqueceu José e não contou ao faraó a interpretação que José lhe dera, apesar de ter visto que ela se cumpriu.
    reason: A nota preserva a dificuldade textual e explica o sentido provável sem reescrever silenciosamente a passagem.
lexical_decisions:
- source_word: ሊቀ፡ መዘርት
  choice: chefe dos copeiros
  rationale: O título designa o oficial principal encarregado das bebidas do rei; esta formulação é corrente, clara e adequada ao contexto de Gênesis 40.
- source_word: አግብኦ ... ውስተ፡ ግብሩ
  choice: restituiu ... ao seu serviço
  rationale: Expressa o retorno do oficial à sua função, sem limitar ግብር ao sentido moderno de trabalho manual.
- source_word: ለሐባዚስ
  choice: o padeiro
  rationale: Designa aqui o oficial dos padeiros já conhecido no contexto; o artigo e o singular preservam essa referência.
- source_word: አይድዖ
  choice: lhe tivesse dito
  rationale: O verbo tem força causativa, isto é, ‘fazer saber, informar’, e tem José como sujeito; evita a leitura incorreta ‘ele soubesse’.
- source_word: ቤተ፡ ሞቅሕ
  choice: na prisão
  rationale: Literalmente ‘casa de encarceramento’; ‘prisão’ comunica o sentido natural em português sem perder conteúdo.
- source_word: ኢተዘከረ
  choice: não se lembrou
  rationale: Mantém a repetição intencional entre não recordar e esquecer, presente no texto transmitido.
theological_decisions:
- issue: Sujeito de አይድዖ na frase final
  choice: José lhe tivesse dito
  alternative: ele soubesse o que aconteceria
  rationale: A morfologia causativa favorece ‘informar/fazer saber’, e o contexto identifica José como aquele que comunicou o desfecho ao copeiro.
- issue: Relação lógica da oração introduzida por አመ
  choice: embora
  alternative: quando/depois que
  rationale: A sequência transmitida é sintaticamente difícil. ‘Embora’ conserva o contraste contextual entre ter recebido de José a interpretação verdadeira e ainda assim esquecê-lo, sem eliminar a possibilidade temporal, registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição final de ‘lembrou/esqueceu’ foi preservada por corresponder ao texto etíope, apesar de soar enfática. ‘Faraó’ foi usado com artigo, conforme o uso português corrente.
