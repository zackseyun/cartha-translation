  yaml_path: translation/extra_canonical/jubilees/039/013.yaml
  text: And he remained there two years. And in those days Pharaoh king of Egypt was angry with his two eunuchs, with the chief cupbearer and with the chief baker, and he put them into prison.
translation:
  language: pt
  text: E ele permaneceu ali por dois anos. Naqueles dias, o faraó, rei do Egito, irou-se contra dois de seus eunucos[a], o chefe dos copeiros e o chefe dos padeiros, e colocou-os na prisão.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “oficiais da corte”. O termo traduzido por “eunucos” também podia designar altos funcionários, sem necessariamente afirmar sua condição física.'
    reason: Preserva a amplitude semântica do título cortesão sem apagar a tradução tradicional.
  - marker: b
    text: O trecho em ge’ez fornecido termina literalmente com “para dentro de”; “a prisão” é suprido pelo contexto.
    reason: Torna transparente a complementação necessária da frase truncada no material-fonte apresentado.
lexical_decisions:
- source_word: ነበረ፡ ህየ፡ ካልአ፡ ዓመተ
  choice: permaneceu ali por dois anos
  rationale: Reproduz diretamente a permanência e a duração indicadas pelo ge’ez, em português natural.
- source_word: ተምዐዐ
  choice: irou-se contra
  rationale: Mantém a força do verbo que exprime ira, sem reduzi-lo a mero desagrado.
- source_word: ክልኤቱ፡ ሕፁዋኒሁ
  choice: dois de seus eunucos
  rationale: Conserva a designação tradicional do texto, embora o termo também possa funcionar como título amplo para oficiais da corte.
- source_word: ሊቀ፡ መዛርት
  choice: chefe dos copeiros
  rationale: Expressa o cargo palaciano responsável pelo serviço de bebidas ao rei.
- source_word: ሊቀ፡ ሐበዝት
  choice: chefe dos padeiros
  rationale: Traduz de modo claro o título do responsável principal pelos padeiros.
- source_word: ወወደዮሙ፡ ውስተ፡
  choice: e mandou-os para a prisão
  rationale: O trecho fornecido termina literalmente com uma expressão direcional incompleta, ‘para dentro de’; ‘prisão’ é exigido pelo contexto narrativo e confirmado pela camada inglesa auditada.
