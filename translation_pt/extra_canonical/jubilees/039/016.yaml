  text: And both of them dreamed a dream[a], the chief cupbearer and the chief baker, and they told Joseph.
translation:
  language: pt
  text: E os dois tiveram um sonho[a] — o chefe dos copeiros e o chefe dos padeiros — e o contaram a José.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “sonharam um sonho”. O texto apresenta “sonho” no singular ao falar dos dois.
    reason: Preserva a forma singular e a construção cognata do ge'ez sem decidir explicitamente se a expressão resume dois sonhos individuais.
lexical_decisions:
- source_word: ሐለሙ፡ ... ሕልመ
  choice: tiveram um sonho
  rationale: A construção cognata significa literalmente “sonharam um sonho”; “tiveram um sonho” é natural em português e preserva o singular do texto.
- source_word: ሊቀ፡ መዛርት
  choice: chefe dos copeiros
  rationale: Designa o oficial principal encarregado das bebidas; “copeiros” é claro, tradicional e adequado ao contexto de corte.
- source_word: ሊቀ፡ ሐበዝት
  choice: chefe dos padeiros
  rationale: Reproduz diretamente o título do responsável principal pelos padeiros.
- source_word: ወነገርዎ፡ ለዮሴፍ
  choice: e o contaram a José
  rationale: O sufixo pronominal singular retoma naturalmente “sonho”; a formulação evita introduzir um objeto plural não expresso no texto ge'ez.
