  text: in the house of the Egyptian because of Joseph. And everything that he did, the LORD made to prosper. And the Egyptian left everything in Joseph’s hand, because he saw that the LORD was with him, and everything that he did the LORD made to prosper.
translation:
  language: pt
  text: na casa do egípcio por causa de José.[a] E tudo o que ele fazia, o SENHOR fazia prosperar. O egípcio deixou tudo nas mãos de José, porque viu que o SENHOR estava com ele e que o SENHOR fazia prosperar tudo o que ele fazia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na casa do egípcio, por causa de José, e tudo o que ele fazia o SENHOR fazia prosperar”.'
    reason: A frase inicial parece continuar a oração do versículo anterior; a segmentação e a relação sintática com a oração seguinte admitem mais de uma leitura.
lexical_decisions:
- source_word: ይሴርሖ
  choice: fazia prosperar
  rationale: O verbo, neste contexto, expressa fazer com que uma atividade tenha êxito ou prospere; a construção causativa em português preserva esse sentido.
- source_word: በእዴሁ፡ ለዮሴፍ
  choice: nas mãos de José
  rationale: Mantém a metáfora semítica de confiar algo à autoridade e administração de alguém, que também é natural em português.
- source_word: ግብጻዊ
  choice: o egípcio
  rationale: Reproduz a designação do personagem no texto-fonte sem identificá-lo por um título não presente neste versículo.
theological_decisions:
- issue: Representação do nome divino እግዚአብሔር
  choice: SENHOR
  alternative: Senhor
  rationale: Segue a convenção bíblica portuguesa de representar o nome divino com versaletes tipográficos simulados por maiúsculas, sem acrescentar uma vocalização específica.
- issue: Agente da prosperidade
  choice: o SENHOR fazia prosperar
  alternative: tudo prosperava
  rationale: Preserva explicitamente a ação divina causativa afirmada no texto, sem reduzi-la a um resultado impessoal.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura em minúscula foi mantida porque o trecho começa no meio de uma frase que vem do versículo anterior. A repetição da declaração de que o SENHOR fazia prosperar foi preservada por ser expressa no texto-fonte.
