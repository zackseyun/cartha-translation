  yaml_path: translation/extra_canonical/jubilees/039/012.yaml
  text: Whatever he did, the LORD made to prosper. And he left everything in his hand, and the chief keeper of the prison knew nothing that was with him, because Joseph did everything and the LORD brought it to completion.
translation:
  language: pt
  text: Tudo o que José fazia, o SENHOR fazia prosperar. O chefe dos guardas da prisão deixou tudo nas mãos de José e não sabia de nada do que estava sob os cuidados de José, porque José fazia tudo, e o SENHOR levava tudo a bom termo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሴርሖ
  choice: fazia prosperar
  rationale: O verbo expressa fazer prosperar ou fazer ter êxito; a formulação preserva a ação do SENHOR sobre tudo o que José fazia.
- source_word: በእዴሁ
  choice: nas mãos dele
  rationale: Mantém a imagem semítica de confiar algo às mãos de alguém; o contexto identifica José como referente.
- source_word: አልቦ ... ዘያአምር ... ምንተኒ
  choice: não precisava tomar conhecimento de nada
  rationale: Reproduz idiomaticamente a ideia de que o chefe da prisão não tinha de acompanhar ou verificar coisa alguma sob a responsabilidade de José, sem transformar o verbo em uma afirmação mais específica como 'preocupar-se'.
- source_word: ይፈጽም
  choice: levava tudo a bom termo
  rationale: Expressa conclusão, realização plena ou êxito concedido pelo SENHOR, distinguindo este verbo do anterior 'fazia prosperar'.
theological_decisions:
- issue: A relação entre a atividade de José e a ação do SENHOR
  choice: porque José fazia tudo, e o SENHOR levava tudo a bom termo
  alternative: porque José fazia tudo, mas o SENHOR é que o completava
  rationale: A coordenação com 'e' conserva a tensão do texto entre a atuação integral de José e a eficácia concedida pelo SENHOR, sem opor indevidamente as duas ações.
- issue: Identificação dos referentes pronominais
  choice: Explicitar 'José' na abertura e 'O chefe dos guardas da prisão' na oração seguinte
  alternative: Manter apenas pronomes em ambas as orações
  rationale: A explicitação evita ambiguidade artificial em português e segue os referentes exigidos pelo contexto, sem acrescentar conteúdo doutrinário.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente compreensível. 'SENHOR' em versaletes textuais representa o título divino; a construção conserva a imagem de confiar tudo às mãos de José e mantém em paralelo o trabalho de José e a ação eficaz de Deus.
