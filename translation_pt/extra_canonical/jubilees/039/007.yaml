  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição do verbo etíope foi preservada semanticamente por 'agarrou' e 'segurou'. As reticências finais marcam a oração interrompida no limite do versículo.
