  yaml_path: translation/extra_canonical/jubilees/039/007.yaml
  text: And she seized him in the house to force him to lie with her[a], and she shut the doors of the house and seized him, but he left his garment in her hand and broke the door-bar and ran outside from before her face. And she saw
translation:
  language: pt
  text: E ela o agarrou dentro da casa para obrigá-lo a deitar-se com ela.[a] Então fechou as portas da casa e o agarrou; mas ele deixou sua roupa na mão dela, quebrou a tranca da porta e correu para fora, fugindo da presença dela. E ela viu...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A sequência é textualmente condensada: ela fecha as portas, agarra-o, ele deixa a roupa, quebra a tranca e foge. A ordem exata das ações pode refletir a segmentação compacta da narrativa etíope.'
    reason: segmentation_note
lexical_decisions:
- source_word: ወአንዘተ
  choice: E ela o agarrou / e o segurou
  rationale: O verbo ocorre duas vezes no texto e ambas as ocorrências foram representadas, com leve variação natural em português para evitar repetição pesada sem perder a ação.
- source_word: ትትበአስ፡ ይስክብ፡ ምስሌሃ
  choice: para obrigá-lo a deitar-se com ela
  rationale: Expressa a finalidade coercitiva da ação e conserva o sentido sexual sem recorrer a formulação eufemística obscura.
- source_word: ማዕጾ
  choice: a tranca da porta
  rationale: No contexto da fuga após as portas terem sido fechadas, designa o dispositivo que barrava ou prendia a porta.
- source_word: እምቅድመ፡ ገጻ
  choice: fugindo da presença dela
  rationale: Reproduz idiomaticamente a expressão ligada ao rosto/presença dela, evitando o artificial 'de diante do rosto dela'.
- source_word: ወርእየት
  choice: E ela viu...
  rationale: Mantém a oração final incompleta do versículo e sinaliza em português que a narrativa prossegue.
