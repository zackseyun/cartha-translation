  text: There in the prison, the LORD gave Joseph favor and mercy before the chief of the keepers of the prison-house[a], because he saw that the LORD was with him, and everything
translation:
  language: pt
  text: Ali, na prisão, o SENHOR concedeu a José favor e misericórdia diante do chefe dos guardas da prisão[a], porque ele viu que o SENHOR estava com José, e tudo
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O título emprega a mesma raiz de “guardar” ou “vigiar” usada anteriormente, mas, neste contexto, designa o responsável pela prisão, não o cargo de Potifar em sua casa.
    reason: lexical_alternative
lexical_decisions:
- source_word: ህየ፡ ውስተ፡ ሞቅሕ
  choice: Ali, na prisão
  rationale: Reproduz a indicação locativa inicial do ge'ez, que situa explicitamente a ação na prisão.
- source_word: ሞገሰ፡ ... ወምሕረተ
  choice: favor e misericórdia
  rationale: Mantém distintos os dois substantivos do texto-fonte, com equivalentes naturais e dignos em português.
- source_word: ሊቀ፡ ዐቀብተ፡ ቤተ፡ ሞቅሕ
  choice: chefe dos guardas da prisão
  rationale: Expressa o título do responsável pelos guardas no contexto prisional e conserva a linguagem de guarda/vigilância do original.
- source_word: ወኵሎ
  choice: e tudo
  rationale: O testemunho fornecido termina de modo incompleto com 'e tudo'; a tradução preserva essa forma em vez de suprir conteúdo não presente.
theological_decisions:
- issue: Referente do pronome em 'porque ele viu'
  choice: ele
  alternative: o chefe viu
  rationale: O original permite recuperar o responsável da prisão como referente, mas a forma pronominal preserva a estrutura e a leve ambiguidade do texto sem explicitação interpretativa.
- issue: Nome divino እግዚአብሔር
  choice: SENHOR
  alternative: Deus
  rationale: Segue a convenção bíblica da camada de consulta para este contexto e mantém a formulação teológica sem acrescentar especificação denominacional.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. A frase final permanece deliberadamente incompleta porque o texto-fonte fornecido termina em “e tudo”.
