base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/001.yaml
  text: And Jacob dwelt in the land of his father’s sojourning, in the land of Canaan. These are the generations of Jacob. And Joseph, being seventeen years old, was brought down into Egypt, and Potiphar, an officer of Pharaoh, chief of the guards, bought him.
translation:
  language: pt
  text: Jacó habitou na terra em que seu pai viveu como estrangeiro, na terra de Canaã. Estas são as gerações de Jacó. José tinha dezessete anos quando o levaram para o Egito, e Potifar, oficial do faraó e chefe da guarda, o comprou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደረ
  choice: habitou
  rationale: Expressa de modo natural e digno a ideia de residir ou permanecer, de acordo com o contexto.
- source_word: ምድረ፡ ፍልሰተ፡ አቡሁ
  choice: na terra em que seu pai viveu como estrangeiro
  rationale: Preserva a noção de residência transitória ou peregrinação do pai sem recorrer ao pouco corrente «terra das peregrinações».
- source_word: ትዝምደ
  choice: gerações
  rationale: Mantém a fórmula genealógica tradicional e sua possível abrangência narrativa, sem reduzi-la apenas a «descendência» ou «história».
- source_word: አውረድዎ
  choice: o levaram para o Egito
  rationale: Reproduz o valor passivo e direcional de ser conduzido para baixo, evitando uma formulação artificial em português.
- source_word: ኅፅዉ
  choice: o comprou
  rationale: Traduz diretamente o ato de aquisição de José, preservando a concisão do texto.
- source_word: ጰጢፋሬን
  choice: Potifar
  rationale: Emprega a forma portuguesa tradicional e reconhecível do nome.
theological_decisions:
- issue: Fórmula «Estas são as gerações de Jacó»
  choice: Preservar «gerações»
  alternative: «Esta é a história da família de Jacó»
  rationale: A expressão pode introduzir tanto uma linhagem quanto o relato associado a ela; a tradução mantém essa tensão em vez de interpretá-la de modo restritivo.
- issue: Cargo de Potifar
  choice: «oficial do faraó»
  alternative: «eunuco do faraó»
  rationale: O termo de cargo pode designar um oficial da corte e nem sempre implica condição física; «oficial» evita afirmar mais do que o contexto exige.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. Mantém-se a fórmula bíblica «Estas são as gerações» por sua relevância estrutural, enquanto construções excessivamente literais são suavizadas.
