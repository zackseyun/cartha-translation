  text: For Pharaoh, the chief of the guards. And he appointed Joseph over all his house, and the blessing of the LORD came to be.
translation:
  language: pt
  text: de Faraó, chefe da guarda. Ele pôs José à frente de toda a sua casa, e houve a bênção do SENHOR.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ ዐቀብት (liqa ʿaqabt)
  choice: chefe da guarda
  rationale: A expressão designa o responsável principal pela guarda; o singular coletivo «guarda» é natural em português e evita pressupor uma função mais específica do que o texto indica.
- source_word: ሤሞ፡ ... ዲበ፡ ኵሉ፡ ቤቱ (śämo ... dibä kwellu betu)
  choice: pôs José à frente de toda a sua casa
  rationale: Expressa naturalmente a nomeação de José sobre toda a casa, preservando a abrangência administrativa da construção ge'ez.
- source_word: ወኮነት፡ በረከተ፡ እግዚአብሔር (wa-konät barakata Egzi’abḥer)
  choice: e houve a bênção do SENHOR
  rationale: Mantém a formulação existencial do texto extante sem acrescentar beneficiário, lugar ou causa que não aparecem neste versículo.
theological_decisions:
- issue: Referente e alcance da bênção divina
  choice: Não especificar sobre quem ou onde veio a bênção
  alternative: «a bênção do SENHOR veio sobre a casa do egípcio por causa de José»
  rationale: O texto ge'ez fornecido termina apenas com a afirmação de que houve a bênção do Senhor; explicitar casa, egípcio ou causalidade importaria conteúdo ausente.
- issue: Representação do nome/título divino እግዚአብሔር
  choice: SENHOR
  alternative: Senhor
  rationale: A forma em versalete textual segue a convenção bíblica portuguesa para o título divino, sem acrescentar uma identificação denominacional.
translation_notes:
  register: Português moderno, digno e de leitura brasileira ampla. O início fragmentário «de Faraó, chefe da guarda» foi preservado porque o trecho-fonte começa no meio de uma construção sintática provavelmente iniciada no versículo anterior; não se acrescentou um nome nem um verbo para resolver a lacuna.
