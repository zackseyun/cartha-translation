    text: 'Ou: «conforme a sua aparência» ou «forma».'
    reason: O termo ge’ez pode designar aparência, forma ou tipo; no contexto de reprodução, «espécies» é a leitura principal.
  revision_rationale: A revisão conserva todos os referentes e o paralelismo distributivo do ge’ez, substitui uma formulação potencialmente ambígua pela leitura contextual mais forte e ajusta o tempo verbal ao fluxo narrativo. A nota preserva a amplitude semântica do termo-fonte.
