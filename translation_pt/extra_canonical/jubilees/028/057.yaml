- from: 'As ovelhas davam cria conforme sua aparência[a]: todas as que tinham marcas pertenciam a Jacó, e as que não tinham marcas pertenciam a Labão.'
  to: As ovelhas deram cria segundo as suas espécies[a]; todas as que tinham marcas pertenciam a Jacó, e todas as que não tinham marcas pertenciam a Labão.
