lexical_decisions:
- source_word: በቀዳሚ፡ ዓመት፡ ዘሱባዔ፡ ራብዕ
  choice: No primeiro ano da quarta semana
  rationale: Mantém a fórmula cronológica do sistema de semanas de anos de Jubileus de modo claro e próximo da estrutura do ge'ez.
- source_word: ወበዝ፡ ኵሉ
  choice: Durante todo esse tempo
  rationale: Expressa naturalmente em português a ideia circunstancial de continuidade presente em 'em/por tudo isto', sem sugerir causalidade indevida.
- source_word: ትቀንዕ
  choice: teve ciúmes
  rationale: Comunica o sentido de inveja ou ciúme no contexto da rivalidade entre as irmãs, em linguagem corrente e digna.
- source_word: በልያ
  choice: de Lia
  rationale: A regência portuguesa natural de 'ter ciúmes' exige 'de'; o nome bíblico é grafado na forma portuguesa consagrada.
- source_word: እስመ፡ ይእቲ
  choice: porque era estéril
  rationale: O contexto e a leitura atestada exigem o predicado relativo à esterilidade de Raquel; a oração preserva o referente feminino sem repetir desnecessariamente o nome.
theological_decisions:
- issue: Referente da oração causal final
  choice: Raquel era estéril
  alternative: Lia era estéril
  rationale: A narrativa de Gênesis e o texto consultado identificam a esterilidade de Raquel como a causa de seus ciúmes de Lia; a tradução portuguesa mantém o sujeito implícito, como é natural, sem alterar o referente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluência brasileira. Conserva a divisão sentencial abrupta da fórmula cronológica transmitida no texto-fonte.
