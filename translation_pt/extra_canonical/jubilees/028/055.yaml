  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምአጣሊ (ʾəm-ʾaṭāli)
  choice: entre as cabras
  rationale: O substantivo ge'ez designa cabras, não cordeiros; a preposição é vertida de modo natural segundo o contexto de nascimento dentro do rebanho.
- source_word: ሐመደ (ḥamada)
  choice: salpicado
  rationale: O termo se relaciona a uma aparência cor de cinza ou pontilhada; “salpicado” preserva aqui a distinção em relação ao descritor seguinte sem reduzi-lo simplesmente a “escuro”.
- source_word: ጋሰ (gāsa)
  choice: malhado
  rationale: Expressa uma pelagem marcada por manchas e distingue-se naturalmente de “salpicado” em português.
- source_word: ጸዐዳ (ṣaʿdā)
  choice: branco
  rationale: Equivalente direto do adjetivo de cor no texto-fonte.
- source_word: ዐስቦ (ʿasbo)
  choice: seu pagamento
  rationale: No contexto do acordo laboral de Jacó, indica remuneração ou salário; “pagamento” é claro e natural.
- source_word: ወይወልዱ (wa-yawallədu)
  choice: E elas deram à luz
  rationale: Mantém o valor narrativo e a continuação incompleta na divisão fornecida do versículo.
