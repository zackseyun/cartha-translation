  text: a house for myself, for I have completed the years for which I served you for your two daughters, and I will go.
translation:
  language: pt
  text: uma casa para mim, pois completei os anos durante os quais servi você por suas duas filhas, e partirei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊተ፡ ቤተ፡
  choice: uma casa para mim
  rationale: Traduz diretamente a expressão etíope «para mim, uma casa». Embora o paralelo de Gênesis possa sugerir «minha mulher», essa leitura não deve substituir o texto efetivamente preservado nesta fonte.
- source_word: ዘተቀነይኩ፡ ለከ፡
  choice: durante os quais servi você
  rationale: Expressa de modo natural a oração relativa que indica os anos de serviço prestado ao interlocutor.
- source_word: ህየንተ፡ ክልኤቲ፡ አዋልዲከ፡
  choice: por suas duas filhas
  rationale: Neste contexto, «por» comunica o serviço realizado em troca ou em consideração às duas filhas, sem tornar a formulação excessivamente explicativa.
- source_word: ወአሐውር፡
  choice: e partirei
  rationale: O verbo de movimento é vertido no futuro, de acordo com a intenção declarada de ir embora.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e uso de «você» para o singular. Conserva-se a redação «uma casa para mim», apesar da dificuldade contextual e do paralelo narrativo, porque ela corresponde ao texto ge'ez fornecido. O início fragmentário é mantido, pois o versículo parece continuar a oração anterior.
