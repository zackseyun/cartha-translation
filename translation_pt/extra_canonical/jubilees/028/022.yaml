  text: Rachel, Bilhah, the sister of Zilpah, as a maidservant. And he served another seven years for
translation:
  language: pt
  text: Raquel, Bila, irmã de Zilpa, como serva.[a] E ele serviu mais sete anos por…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O versículo começa no meio de uma oração iniciada no versículo anterior; Labão é quem dá Bila a Raquel como serva.
    reason: Esclarece a divisão textual sem inserir no corpo um verbo ausente deste segmento.
  - marker: b
    text: O texto deste versículo termina com a preposição “por”; a oração continua no versículo seguinte.
    reason: Sinaliza que a frase incompleta reflete a segmentação da fonte, e não uma omissão acidental da tradução.
lexical_decisions:
- source_word: ራሔል፡ ባላንሃ፡ አኅታ፡ ለዜልፋን፡ ለአኪት
  choice: Raquel, Bila, irmã de Zilpa, como serva
  rationale: Mantém a sequência nominal fragmentária do texto ge'ez, sem acrescentar um verbo que faria de Raquel, indevidamente, o sujeito da entrega. O trecho parece continuar a oração do versículo anterior.
- source_word: ወትቀንየ፡ ሰብዓተ፡ ዓመተ፡ ዳግመ
  choice: E ele serviu mais sete anos
  rationale: 'Traduz diretamente a nova oração: o sujeito masculino permanece implícito no verbo, e ዳግመ indica repetição, expressa naturalmente por “mais”.'
- source_word: በእንተ
  choice: por
  rationale: A preposição introduz a pessoa ou finalidade pela qual Jacó serviu; como o segmento fornecido termina aqui, a tradução também fica incompleta.
theological_decisions:
- issue: Sujeito implícito de uma possível entrega de Bila
  choice: Não inserir “Raquel deu” nem outro verbo no primeiro fragmento
  alternative: “Raquel deu Bila, irmã de Zilpa, como serva”
  rationale: O ge'ez fornecido não contém nesse ponto um verbo equivalente a “deu”, e o contexto narrativo identifica Labão, não Raquel, como quem entrega Bila. A fragmentação resulta da divisão do versículo e deve ser preservada sem criar contradição.
translation_notes:
  register: Português atual, claro e digno, com nomes na forma bíblica corrente em português. Conservou-se deliberadamente a estrutura fragmentária nas duas extremidades do versículo, explicada em notas, para não reconstruir silenciosamente material pertencente aos versículos adjacentes.
