  text: 'The sixth: in the sixth year of the third week, Jacob again went in to Bilhah, and she conceived.'
translation:
  language: pt
  text: 'O sexto[a]: no sexto ano da terceira semana, Jacó tornou a unir-se a Bila, e ela engravidou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, entendendo o termo inicial como parte da datação: “No sexto ano da terceira semana”.'
    reason: A forma isolada “sexto” pode funcionar como indicação enumerativa, provavelmente do sexto filho, mas também há tradição de leitura que inicia simplesmente pela datação.
lexical_decisions:
- source_word: ሳድስ
  choice: O sexto
  rationale: Preserva o termo inicial isolado, provavelmente uma indicação enumerativa ligada à sequência dos filhos, sem incorporá-lo silenciosamente à expressão seguinte.
- source_word: በሳድስ ዓመት ዘሱባዔ ሣልስ
  choice: no sexto ano da terceira semana
  rationale: Reproduz com clareza a estrutura cronológica do texto ge'ez.
- source_word: ደገመ ... ቦአ ኀበ
  choice: tornou a unir-se a
  rationale: Expressa de modo natural e digno tanto a repetição quanto o eufemismo bíblico de entrar até a mulher, evitando uma tradução corporalmente estranha em português.
- source_word: ፀንሰት
  choice: ela engravidou
  rationale: Equivalente corrente e claro para a concepção, adequado ao registro narrativo.
theological_decisions:
- issue: Função do termo inicial ሳድስ (“sexto”)
  choice: 'Mantê-lo como elemento enumerativo independente: “O sexto”'
  alternative: Iniciar diretamente com “No sexto ano”
  rationale: O testemunho fornecido contém uma primeira ocorrência isolada de “sexto”, além da expressão “no sexto ano”. Mantê-la evita apagar uma possível referência ao sexto filho, embora sua função não seja explicitada no versículo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. “Tornou a unir-se” conserva o eufemismo sexual e a ideia de repetição sem redundância pesada.
