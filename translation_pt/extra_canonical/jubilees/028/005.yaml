  text: '[He took] Leah his elder daughter, and gave her to Jacob as a wife, and he gave her Zilpah his maidservant as a handmaid.'
translation:
  language: pt
  text: '[Ele tomou][a] Lia, sua filha mais velha, e a deu a Jacó por esposa. Também lhe deu sua serva Zilpa como criada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Lia, sua filha mais velha, e a deu”.'
    reason: A divisão dos versículos separa “Lia” do verbo que aparece no versículo anterior. “Ele tomou” foi suprido para que este versículo possa ser lido como uma frase completa, preservando-se em nota a construção não suprida.
lexical_decisions:
- source_word: ትልህቅ
  choice: mais velha
  rationale: O termo caracteriza Lia como a filha de maior idade; “mais velha” é a forma natural e clara em português.
- source_word: ብእሲተ
  choice: por esposa
  rationale: Expressa a condição em que Lia foi dada a Jacó, preservando de modo idiomático o sentido matrimonial.
- source_word: አመተ፡ ለእኪት
  choice: sua serva, para servi-la
  rationale: Reproduz tanto a condição servil de Zilpa quanto a função para a qual foi entregue a Lia, sem recorrer à forma arcaica “serva de companhia”.
theological_decisions: []
translation_notes:
  register: Português atual, digno e de ampla compreensão, com boa legibilidade brasileira. Os colchetes indicam palavras supridas por exigência da divisão do versículo; a segunda oração foi formulada naturalmente, sem alterar a relação entre Lia, Zilpa e Labão.
