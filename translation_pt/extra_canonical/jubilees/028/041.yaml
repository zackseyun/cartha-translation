  text: she also took and gave her maidservant Zilpah to Jacob as a wife, and she conceived and bore
translation:
  language: pt
  text: Ela também tomou sua serva Zilpa e a deu a Jacó como esposa, e Zilpa concebeu e deu à luz.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይእቲኒ
  choice: Ela também
  rationale: O pronome feminino independente com a partícula enclítica -ኒ expressa que ela, igualmente, realizou a ação, em paralelo com o contexto anterior.
- source_word: ዜልፋሃ
  choice: Zilpa
  rationale: Forma portuguesa tradicional e reconhecível do nome próprio.
- source_word: ለአኪታ
  choice: sua serva
  rationale: Expressa a relação possessiva e a condição de serva pessoal sem recorrer ao termo hoje pouco corrente 'serva particular'.
- source_word: ብእሲተ
  choice: como esposa
  rationale: O substantivo feminino indica mulher/esposa; a construção com o verbo 'dar' pede naturalmente 'como esposa' em português.
- source_word: ወፀንሰት፡ ወወለደት
  choice: concebeu e deu à luz
  rationale: Reproduz diretamente a sequência verbal e usa a expressão portuguesa natural para o parto.
theological_decisions:
- issue: Sujeito dos verbos finais
  choice: Repetir 'Zilpa' em 'Zilpa concebeu'
  alternative: Manter apenas 'ela concebeu'
  rationale: Embora o ge'ez use formas verbais femininas sem repetir o nome, em português 'ela' poderia remeter ambiguamente à mulher que tomou e entregou Zilpa. A repetição esclarece a referência narrativa sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e legibilidade brasileira. O advérbio 'também' foi ligado ao sujeito, acompanhando a morfologia de ይእቲኒ e o paralelismo narrativo.
