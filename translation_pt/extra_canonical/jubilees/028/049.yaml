  rationale: Reproduz a cláusula incompleta do testemunho fornecido, que termina antes da indicação do nome.
theological_decisions:
- issue: A lembrança divina de Raquel
  choice: se lembrou de Raquel
  alternative: atentou para Raquel
  rationale: Mantém o verbo antropomórfico do texto e sua tensão teológica, sem o explicar como esquecimento anterior nem suavizá-lo.
- issue: Abertura do ventre por ação divina
  choice: abriu o seu ventre
  alternative: tornou-a fértil
  rationale: Conserva a atribuição direta da ação ao Senhor e a metáfora original, evitando uma paráfrase doutrinária ou fisiológica.
