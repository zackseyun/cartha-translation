  rationale: Equivalente direto e corrente para a concepção.
- source_word: ወለደት ወልደ
  choice: deu à luz um filho
  rationale: Expressão idiomática moderna que mantém explicitamente o nascimento de um filho.
- source_word: ጸውዐት ስሞ
