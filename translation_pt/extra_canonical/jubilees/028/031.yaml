lexical_decisions:
- source_word: ወወለደት፡ ሎቱ፡ ወልደ፡ ራብዐ፡
  choice: E ela lhe deu à luz um quarto filho
  rationale: A forma verbal feminina explicita que ela deu à luz; ሎቱ preserva a relação expressa por “lhe”, e ራብዐ indica “quarto”.
- source_word: ወጸውዐ፡ ስሞ፡ ይሁዳ፡
  choice: e ele lhe deu o nome de Judá
  rationale: ጸውዐ é terceira pessoa masculina singular no texto fornecido. A expressão portuguesa “dar o nome de” comunica naturalmente o sentido de chamar/nomear.
- source_word: በዐሡሩ፡ ወኀሙሱ፡ ለወርኅ፡ ሣልስ፡
  choice: no décimo quinto dia do terceiro mês
  rationale: 'Reproduz diretamente a data: quinze, mês terceiro.'
theological_decisions:
- issue: Identidade gramatical de quem dá o nome à criança
  choice: ele lhe deu o nome
  alternative: ela lhe deu o nome
  rationale: Embora Gênesis 29:35 atribua o nome a Lia e possa haver uma leitura variante feminina, o texto ge'ez apresentado traz ጸውዐ, forma masculina singular. A tradução segue a fonte fornecida sem harmonização silenciosa.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação narrativa foi preservada, assim como a distinção entre o sujeito feminino do parto e o sujeito masculino da nomeação.
