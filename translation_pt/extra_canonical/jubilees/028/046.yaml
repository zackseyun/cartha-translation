lexical_decisions:
- source_word: ለኃምስ፡ ወርኅ፡
  choice: no quinto mês
  rationale: A formula temporal é vertida de modo natural em português, indicando quando ocorreu o acontecimento.
- source_word: በዓመት፡ ራብዕ፡ ዘሱባዔ፡ ራብዕ፡
  choice: no quarto ano da quarta semana
  rationale: Preserva a estrutura cronológica característica de Jubileus e a relação genitiva entre o ano e a semana.
- source_word: ወወሀበተ፡ ለሐፂኒት።
  choice: E ela o entregou a uma ama.
  rationale: O feminino verbal é preservado; o pronome masculino implícito é expresso para clareza, e 'ama' comunica de forma concisa a mulher encarregada de cuidar e amamentar a criança.
- source_word: ወቦአ፡ ያዕቆብ፡ ዳግመ፡
  choice: E Jacó entrou novamente.
  rationale: '''Entrou'' mantém o sentido básico do verbo, enquanto ''novamente'' traduz o advérbio sem acrescentar um destino não expresso neste fragmento.'
