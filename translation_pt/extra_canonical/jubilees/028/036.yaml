lexical_decisions:
- source_word: አመትየ
  choice: minha serva
  rationale: Reproduz diretamente o substantivo com o sufixo possessivo de primeira pessoa.
- source_word: ወትፀንስ፡ ወትወልድ
  choice: ela conceberá e dará à luz
  rationale: Mantém a sequência coordenada dos dois verbos no feminino sem acrescentar a expressão harmonizadora «vá para a cama com ela», ausente no ge'ez.
- source_word: ሊተ፡ ወልደ
  choice: um filho para mim
  rationale: Conserva tanto a referência ao filho quanto o interesse expresso pela primeira pessoa.
- source_word: ባላሃ
  choice: Bila
  rationale: Emprega a forma portuguesa corrente do nome bíblico Bilhah.
- source_word: ብእሲተ
  choice: mulher
  rationale: Aqui o termo designa a mulher em relação conjugal; «ser sua mulher» é natural e preserva o sentido matrimonial.
theological_decisions:
- issue: Possível harmonização com Gênesis 30:3
  choice: Não inserir «tenha relações com ela» ou expressão equivalente
  alternative: «minha serva; vá para a cama com ela, e ela conceberá»
  rationale: O texto ge'ez fornecido passa diretamente de «minha serva» a «e ela conceberá»; acrescentar a ordem importaria conteúdo de uma passagem paralela.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe próxima do ge'ez sem sacrificar a naturalidade. O fragmento começa em continuação direta do versículo ou oração anterior.
