lexical_decisions:
- source_word: ኢያእመረ
  choice: não sabia
  rationale: Reproduz diretamente a negação do verbo «saber/conhecer», sem acrescentar uma explicação ausente do texto.
- source_word: አምሳለ
  choice: pensava
  rationale: No contexto, expressa a percepção ou suposição de Jacó de que a mulher era Raquel; é mais natural em português do que uma reprodução rígida como «considerava semelhante a».
- source_word: ቦአ፡ ኀቤሃ
  choice: entrou até ela
  rationale: Preserva o eufemismo narrativo tradicional para a relação sexual e mantém a direção indicada por «até/junto dela», sem explicitação indevida.
- source_word: ናሁ
  choice: e eis que
  rationale: Mantém a fórmula de surpresa e mudança de percepção, além da suspensão sintática que continua no versículo seguinte.
