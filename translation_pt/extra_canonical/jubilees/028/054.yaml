  text: and take your wages.” And they agreed between themselves that he would give him as his wages every lamb
translation:
  language: pt
  text: “E receba o seu salário.” Então combinaram entre si que ele lhe daria, como seu salário,[b] todo cordeiro.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “toda ovelha jovem”.
    reason: A expressão ge’ez designa um animal do rebanho e especifica que se trata de um animal jovem; «cordeiro» é a tradução principal mais natural, mas a identificação mais ampla como ovelha é possível.
  - marker: b
    text: Isto é, o salário daquele que o receberia.
    reason: Esclarece que o possessivo se refere ao destinatário do salário.
lexical_decisions:
- source_word: ወንሣእ፡ ዐስበከ
  choice: “E receba o seu salário”
  rationale: O imperativo ንሣእ (‘tomar, receber’) é expresso de modo natural, e o sufixo de segunda pessoa em ዐስበከ é preservado por ‘seu’.
- source_word: ወተካሀሉ፡ በበይናቲሆሙ
  choice: Então combinaram entre si
  rationale: Reproduz a ideia de chegarem a um acordo entre eles, em português corrente.
- source_word: ከመ፡ የሀቦ፡ ዐስቦ
  choice: que ele lhe daria, como salário dele
  rationale: Mantém tanto a relação entre aquele que dá e aquele que recebe quanto o sufixo possessivo masculino singular de ዐስቦ (‘salário dele’).
- source_word: ኵሎ፡ በግዐ፡ እመሐስዕ
  choice: cada cordeiro
  rationale: A expressão aponta para cada animal jovem do rebanho; ‘cordeiro’ incorpora a nuance de እመሐስዕ, em vez de generalizar como ‘ovelha’.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. A fala direta é mantida, e os pronomes masculinos da fonte são preservados sem inserir nomes ausentes deste versículo.
