  text: E os bens de Jacó aumentaram muitíssimo, e ele adquiriu gado, ovelhas, jumentos e camelos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጥሪቱ
  choice: bens
  rationale: O termo designa as posses ou riquezas de Jacó; “bens” é natural em português e abrange o patrimônio mencionado em seguida.
- source_word: ጥቀ
  choice: muitíssimo
  rationale: Intensifica o crescimento das posses; “muitíssimo” preserva a forte ênfase do texto.
- source_word: አልህምተ
  choice: gado
  rationale: Refere-se a animais de criação, aqui distinguindo o gado das ovelhas, dos jumentos e dos camelos.
- source_word: አባግዐ
  choice: ovelhas
  rationale: Equivalente direto e corrente para o grupo ovino.
- source_word: አእዱገ
  choice: jumentos
  rationale: O vocábulo presente no ge'ez significa jumentos; sua inclusão corrige a omissão registrada numa versão anterior.
- source_word: አገማለ
  choice: camelos
  rationale: Equivalente direto do nome plural no texto-fonte.
