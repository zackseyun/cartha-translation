  text: And he lifted up his feet and went to the land of the east, to Laban, the brother of Rebekah, and he stayed with him.
translation:
  language: pt
  text: Então ele pôs-se a caminho e foi para a terra do Oriente, até Labão, irmão de Rebeca, e ficou com ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንሥአ፡ እገሪሁ
  choice: Então ele pôs-se a caminho
  rationale: A expressão etíope diz literalmente que ele “levantou os pés”, um modo de indicar o início da jornada. A formulação portuguesa comunica naturalmente a ação sem perder seu sentido idiomático.
- source_word: ምድረ፡ ጽባሕ
  choice: terra do Oriente
  rationale: A expressão relaciona a região ao nascer do sol e, portanto, ao leste. “Oriente” é claro, digno e geograficamente adequado.
- source_word: ወሀሎ፡ ምስሌሁ
  choice: e ficou com ele
  rationale: Embora a construção possa ser vertida literalmente como “esteve com ele”, no contexto ela indica permanência junto a Labão; “ficou com ele” expressa isso em português corrente.
