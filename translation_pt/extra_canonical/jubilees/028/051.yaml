  text: 'José[a]. Jacó disse a Labão: “Dá-me minhas esposas e meus filhos, e irei para junto de meu pai Isaque e farei...”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Neste recorte, o texto começa apenas com “José”, provavelmente concluindo a frase anterior. Conforme o contexto, também se pode entender: “Quando José nasceu”.'
    reason: O corte de segmentação separa o nome de sua provável construção sintática anterior; a nota preserva a possível leitura contextual sem inseri-la no texto principal.
  - marker: b
    text: O texto fornecido termina literalmente com “e farei”; a oração fica incompleta neste ponto.
    reason: Evita substituir o verbo por “voltarei” ou acrescentar um complemento não atestado no segmento.
lexical_decisions:
- source_word: ዮሴፍ
  choice: José
  rationale: Reproduz o nome que abre o segmento sem acrescentar o verbo “nasceu”, ausente do texto ge'ez fornecido.
- source_word: ሀበኒ
  choice: Dá-me
  rationale: Forma direta e natural para o imperativo “dá a mim”.
- source_word: አንስትየየ
  choice: minhas mulheres
  rationale: Mantém o sentido plural de “mulheres/esposas”; “mulheres” evita restringir além do que a forma lexical exige, embora no contexto sejam as esposas de Jacó.
- source_word: ወእሖር፡ ኀበ፡ አቡየ፡ ይስሐቅ
  choice: e irei para junto de meu pai Isaque
  rationale: Expressa naturalmente o movimento em direção ao pai de Jacó, preservando o futuro do verbo.
- source_word: ወእግበር
  choice: e farei
  rationale: Traduz o verbo ge'ez de fazer/realizar, sem confundi-lo com um verbo que significaria “voltar”. Como o segmento termina aqui, a oração permanece incompleta.
theological_decisions:
- issue: Conclusão incompleta da fala de Jacó
  choice: Preservar “e farei...” sem fornecer objeto ou complemento
  alternative: Traduzir “e voltarei” ou completar conjecturalmente a oração
  rationale: O ge'ez traz o verbo “fazer”, não “voltar”, e o corte do versículo parece interromper uma oração que prossegue fora do segmento apresentado. Completá-la resolveria indevidamente uma lacuna de segmentação.
- issue: Relação de “José” com a frase anterior
  choice: Manter apenas o nome e sinalizar em nota sua provável ligação com o contexto precedente
  alternative: Inserir no texto “Quando José nasceu”
  rationale: O segmento fornecido contém somente o nome José. A leitura temporal é contextualmente possível, mas exige palavras não presentes neste recorte.
translation_notes:
  register: Português atual, claro e digno, com nomes na forma bíblica corrente no Brasil. A ordem e as descontinuidades do segmento ge'ez foram preservadas; as notas explicam os dois prováveis cortes de segmentação.
