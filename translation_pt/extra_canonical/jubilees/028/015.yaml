  text: he brings up sin against himself into heaven, and no one who does this thing is righteous, for
translation:
  language: pt
  text: faz subir ao céu o pecado contra si mesmo[a], e ninguém que faz isso é justo, pois
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faz subir ao céu seu pecado por sua causa”.'
    reason: A expressão preposicional pode ser entendida como “contra si mesmo”, “por sua causa” ou “por sua conta”; a alternativa registra essa ambiguidade.
lexical_decisions:
- source_word: አበሳ (ʾabäsa)
  choice: o pecado
  rationale: O substantivo pode expressar pecado, culpa ou transgressão; “pecado” preserva o sentido moral direto e funciona como objeto do verbo causativo.
- source_word: ያዐርግ (yaʿarg)
  choice: faz subir
  rationale: 'A forma verbal é causativa: o sujeito faz que o pecado suba, em vez de o pecado simplesmente subir.'
- source_word: በእንቲአሁ (baʾəntīʾahu)
  choice: contra si mesmo
  rationale: No contexto, a expressão indica que o pecado levado ao céu recai sobre o próprio agente; a nota conserva a possibilidade mais literal de causa ou conta.
- source_word: ዘንተ፡ ነገረ (zäntä nägärä)
  choice: isso
  rationale: A expressão significa literalmente “esta coisa”; em português corrente, “isso” retoma com naturalidade o ato mencionado.
theological_decisions:
- issue: Relação entre o ato e a condição de justo
  choice: ninguém que faz isso é justo
  alternative: não há justo que faça isso
  rationale: 'A formulação escolhida preserva a força declarativa da construção: quem pratica esse ato não é considerado justo, sem sugerir apenas que os justos por acaso não o praticam.'
translation_notes:
  register: Português moderno, claro e digno. A oração permanece em minúscula e termina com “pois” porque o versículo é um fragmento ligado ao contexto imediato. A ordem verbal mantém explícito o valor causativo do geês.
