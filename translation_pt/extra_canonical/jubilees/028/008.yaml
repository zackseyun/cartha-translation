- source_word: 7ፋዕከኒ
  choice: você me enganou
  rationale: No contexto do casamento trocado, expressa de modo claro a ação injusta e enganosa de Labão contra Jacó; evita o menos específico «prejudicou».
- source_word: ንግአ፡ ወሰተከ፡
  choice: Tome a sua filha
  rationale: Mantém o imperativo e a referência à filha do interlocutor, seguindo a segmentação transmitida e a continuação aberta do versículo.
