lexical_decisions:
- source_word: አባግዒሁ
  choice: suas ovelhas
  rationale: Mantém o referente possessivo e o sentido concreto do substantivo ge’ez no fragmento que continua a frase anterior.
- source_word: ወጸውዖን
  choice: e chamou
  rationale: Reproduz de modo direto a ação de convocar; o sufixo pronominal feminino plural é explicitado pelos nomes seguintes.
- source_word: ለሊያ፡ ወለራሔል
  choice: Lia e Raquel
  rationale: Emprega as formas portuguesas tradicionais e amplamente reconhecidas dos nomes bíblicos.
- source_word: ወተናገረ፡ ውስተ፡ ልቦን
  choice: e falou ao coração delas
  rationale: Preserva a expressão semítica concreta e afetiva, em vez de reduzi-la interpretativamente a ‘persuadiu’ ou ‘falou em particular’.
- source_word: ከመ፡ ይምጽኣ፡ ምስ
  choice: para que viessem
  rationale: Expressa naturalmente em português a oração final; o fragmento-fonte termina após a preposição ‘com’, indicando continuação além deste recorte.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do ge’ez. O trecho é fragmentário no início e no fim; por isso, começa em minúscula e não recebe pontuação final. A locução ‘falou ao coração delas’ foi conservada por sua força idiomática e por não exigir resolução interpretativa.
