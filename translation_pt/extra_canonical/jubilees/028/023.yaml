lexical_decisions:
- source_word: ራሔል
  choice: Raquel
  rationale: Forma portuguesa tradicional do nome próprio Rachel.
- source_word: እስመ
  choice: porque
  rationale: Expressa naturalmente o valor causal da conjunção ge'ez.
- source_word: ትውህበት
  choice: havia sido dada
  rationale: Preserva a voz passiva e a anterioridade da ação em relação ao contexto narrativo.
- source_word: አርኀወ
  choice: abriu
  rationale: Equivalente direto do verbo, preservando a imagem idiomática do texto-fonte.
- source_word: ማኅፀነ ልያ
  choice: o ventre de Lia
  rationale: Tradução formal e digna da expressão anatômica e reprodutiva.
- source_word: ፀንሰት
  choice: ela concebeu
  rationale: Reproduz de modo claro e conciso a concepção de Lia.
theological_decisions:
- issue: Ação divina na concepção
  choice: o SENHOR abriu o ventre de Lia
  alternative: o SENHOR tornou Lia fértil
  rationale: A formulação literal preserva a agência divina e a metáfora bíblica sem interpretá-la por meio de uma paráfrase.
- issue: Início do versículo ausente no recorte ge'ez fornecido
  choice: E ele amava Raquel mais do que Lia
  alternative: Iniciar com o fragmento “Raquel, porque Lia...”
  rationale: A cláusula é exigida pelo contexto e pela versificação atestada na revisão textual; sua inclusão evita uma frase truncada, embora o recorte apresentado comece em “Raquel”.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se a expressão bíblica “abriu o ventre” e grafou-se SENHOR em versaletes textuais para representar o nome divino.
