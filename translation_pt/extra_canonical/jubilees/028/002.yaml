lexical_decisions:
- source_word: ወተቀንየ፡ ሎቱ፡
  choice: E ele o serviu
  rationale: Reproduz diretamente o verbo de serviço e o objeto pronominal, em português natural.
- source_word: ህየንተ፡ ራሔል፡ ወለቱ፡
  choice: por sua filha Raquel
  rationale: Preserva tanto a relação de troca expressa por 'por' quanto ወለቱ, 'sua filha', elemento que não deve ser omitido.
- source_word: ሱባዔ፡ አሐደ።
  choice: durante uma semana
  rationale: Mantém a terminologia cronológica característica de Jubileus, literalmente 'uma semana', sem explicitar no corpo do texto que se trata de uma semana de anos.
theological_decisions:
- issue: Sentido cronológico de 'uma semana'
  choice: Manter 'uma semana' no texto
  alternative: Traduzir interpretativamente como 'sete anos'
  rationale: A formulação literal preserva o sistema cronológico próprio do livro e sua possível tensão para o leitor; a equivalência contextual é esclarecida em nota.
translation_notes:
  register: Português moderno, claro e digno. A construção 'o serviu' mantém concisão e proximidade formal com o ge'ez; 'durante' torna natural em português a expressão da duração.
