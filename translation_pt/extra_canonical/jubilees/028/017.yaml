lexical_decisions:
- source_word: ግበሩ፡ ዘንተ፡ ቃለ
  choice: Façam o seguinte
  rationale: Reproduz a ordem introdutória de modo natural e digno em português, sem o literalismo pouco idiomático de “façam esta palavra”.
- source_word: አይንሥኡ፡ ወአየሀቡ
  choice: não tomem nem deem
  rationale: Mantém os dois verbos coordenados do ge’ez e a linguagem matrimonial de tomar e dar em casamento, sem acrescentar uma explicação ausente do texto.
- source_word: እንተ፡ ትንእስ
  choice: a mais nova
  rationale: O feminino concorda com a referência contextual às filhas e preserva o contraste comparativo entre a mais nova e a mais velha.
- source_word: ያቅድሙ፡ እንተ፡ ትልህቅ
  choice: antes de primeiro darem a mais velha
  rationale: Conserva a prioridade explícita da mais velha e a repetição enfática de anterioridade presente na construção fonte.
