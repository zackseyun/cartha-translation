  text: 'Ela não deu à luz e disse a Jacó: “Dê-me filhos.” Jacó respondeu: “Por acaso eu te privei?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A pergunta final é abreviada no texto etíope. Mais literalmente: “Eu te privei [de algo]?” O objeto não é expresso.'
    reason: Preserva a elipse sintática do original e esclarece que a tradução não acrescenta um objeto ou uma explicação teológica.
lexical_decisions:
- source_word: ኢትወልድ
  choice: Ela não deu à luz
  rationale: Reproduz a negação do verbo ‘dar à luz’, com sujeito feminino explícito para clareza natural em português.
- source_word: ሀበኒ፡ ውሉደ
  choice: Dê-me filhos
  rationale: Mantém de forma direta o imperativo e o plural ‘filhos’.
- source_word: ከላእኩ፡ እምኔኪ
  choice: fui eu que os impedi de vir de você
  rationale: Expressa o sentido de reter ou impedir algo procedente dela, sem acrescentar uma referência explícita a Deus ausente deste texto.
theological_decisions:
- issue: Cláusula final abreviada e ambígua
  choice: Por acaso fui eu que os impedi de vir de você?
  alternative: Será que eu os retive de você?
  rationale: Preserva a pergunta e sua formulação incomum, ao mesmo tempo que a torna inteligível em português; não completa a fala com material de Gênesis nem resolve sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com formas compreensíveis tanto no Brasil quanto internacionalmente. O diálogo permanece direto, e a estranheza real da frase final é preservada em nota.
