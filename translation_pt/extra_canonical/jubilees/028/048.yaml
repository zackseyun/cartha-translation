  text: And a daughter was born, whose name was Dinah, in the seventh month, in the seventh year of the sixth week of the fourth jubilee. And He had mercy on her,
translation:
  language: pt
  text: E nasceu uma filha, cujo nome era Diná, no sétimo mês, no sétimo ano da sexta semana do quarto jubileu. E ele teve misericórdia dela,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O sujeito masculino não é nomeado nesta frase; pelo contexto, trata-se de Deus. A pessoa de quem ele teve misericórdia é feminina.
    reason: A forma ge'ez codifica sujeito masculino singular e objeto feminino singular, enquanto a identidade do sujeito depende do contexto.
lexical_decisions:
- source_word: ስማ፡ ዲና
  choice: cujo nome era Diná
  rationale: Preserva explicitamente ስማ, «seu nome», e apresenta o nome próprio de modo natural em português.
- source_word: በሳብዕ፡ ወርኅ
  choice: no sétimo mês
  rationale: Tradução direta da indicação cronológica.
- source_word: ዘሳብዕ፡ ዓመት፡ ዘሳድስ፡ ሱባዔ፡ ዘራብዕ
  choice: no sétimo ano da sexta semana do quarto jubileu
  rationale: Mantém sem simplificação a estrutura cronológica própria de Jubileus.
- source_word: ወተሣሀላ
  choice: E ele teve misericórdia dela
  rationale: Representa o sujeito masculino singular e o objeto feminino singular indicados pela forma ge'ez, sem acrescentar um nome divino ausente do texto.
theological_decisions:
- issue: Identidade do sujeito de «teve misericórdia»
  choice: ele
  alternative: o Senhor / Deus
  rationale: A forma verbal indica sujeito masculino singular, mas o nome do sujeito não aparece nesta unidade textual. Empregar «ele» preserva a referência contextual sem inserir «o Senhor» ou «Deus».
translation_notes:
  register: Português moderno, claro e digno, com terminologia cronológica consistente. A vírgula final reflete que a frase continua no versículo seguinte.
