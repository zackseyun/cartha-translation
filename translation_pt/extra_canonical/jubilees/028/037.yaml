  text: And he went in to her, and she conceived and bore him a son, and he called his name Dan, on the ninth of the month.
translation:
  language: pt
  text: Ele se uniu a ela, e ela concebeu e lhe deu à luz um filho. Ele[a] lhe deu o nome de Dan, no dia nove do mês.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns manuscritos trazem: “Ela”.'
    reason: Registra a variante feminina conhecida sem substituir a forma masculina do texto ge'ez fornecido.
  - marker: b
    text: 'Ou, segundo outra interpretação: “no nono mês”.'
    reason: Preserva a alternativa tradicional de análise da expressão temporal, embora o sentido de “dia nove do mês” seja preferido.
lexical_decisions:
- source_word: ወቦአ፡ ኀቤሃ፡
  choice: Ele se uniu a ela
  rationale: A expressão ge'ez, literalmente próxima de “entrou até ela”, funciona como um eufemismo para relações sexuais; a formulação escolhida preserva o tom digno e torna o sentido natural em português atual.
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ፡ ወልደ፡
  choice: ela concebeu e lhe deu à luz um filho
  rationale: Reproduz a sequência verbal e a relação indicada pelo pronome dativo, com sintaxe corrente em português.
- source_word: ወጸውዐ፡ ስሞ፡ ዳን፡
  choice: Ele lhe deu o nome de Dã
  rationale: O verbo no texto fornecido está na terceira pessoa masculina do singular. “Deu o nome de” é a expressão idiomática portuguesa correspondente a “chamou seu nome”.
- source_word: አመ፡ ተሱዑ፡ ለወርኅ፡
  choice: no dia nove do mês
  rationale: አመ introduz aqui uma data, e o numeral indica o nono dia do mês; a redação evita confundi-lo com o nono mês.
