translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente compreensível. O eufemismo sexual foi vertido naturalmente, sem explicitação desnecessária; a frase foi dividida em dois períodos para melhorar a leitura.
