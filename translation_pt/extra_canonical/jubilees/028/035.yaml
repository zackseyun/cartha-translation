  text: to Jacob—Reuben, Simeon, Levi, and Judah—and she said to him, “Go in to Bilhah.”
translation:
  language: pt
  text: 'a Jacó — Rúben, Simeão, Levi e Judá —; e ela lhe disse: “Vá unir-se a Bila.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto etíope da ordem final é obscuro; esta tradução segue uma reconstrução contextual.
    reason: Registra a incerteza textual real sem atribuir a fala a Bila nem introduzir uma formulação alternativa sem base suficiente.
lexical_decisions:
- source_word: ወትቤሎ
  choice: e ela lhe disse
  rationale: A forma verbal inclui a conjunção e o pronome objeto masculino singular, cujo referente natural no contexto é Jacó.
- source_word: ባላ፡ ኀበ፡ *ባላ፡
  choice: Vá se unir a Bila
  rationale: A sequência textual parece corrompida, mas a leitura contextual proposta expressa o convite para Jacó entrar até Bila; em português, “unir-se a” conserva com naturalidade o eufemismo sexual.
- source_word: ሮቤል ... ወስምዖን ... ወሌዊ ... ወይሁዳ
  choice: Rúben, Simeão, Levi e Judá
  rationale: Empregam-se as formas portuguesas tradicionais e amplamente reconhecidas dos nomes bíblicos.
theological_decisions:
- issue: Natureza da ordem dirigida a Jacó
  choice: “Vá se unir a Bila”
  alternative: “Entre até Bila”
  rationale: A formulação escolhida comunica o sentido conjugal/sexual do eufemismo sem torná-lo vulgar nem acrescentar uma interpretação denominacional.
- issue: Incerteza textual na fala final
  choice: Manter no texto principal a reconstrução contextual e registrar a alternativa em nota
  alternative: Traduzir literalmente a sequência etíope tal como preservada
  rationale: A sequência transmitida é obscura e provavelmente corrompida; a nota preserva a incerteza real em vez de apresentar a reconstrução como indiscutível.
translation_notes:
  register: Português moderno, claro e digno, com nomes bíblicos de uso corrente. A expressão “unir-se a” funciona como eufemismo compreensível e evita tanto a literalidade pouco natural de “entrar até” quanto uma explicitação excessiva.
