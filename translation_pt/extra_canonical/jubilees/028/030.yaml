lexical_decisions:
- source_word: ቀዳማዊ
  choice: Primeiro
  rationale: Traduz o termo inicial explicitamente, embora ele provavelmente complete a sequência ou o pensamento do versículo anterior.
- source_word: ሱባዔ
  choice: semana
  rationale: Mantém o sentido cronológico técnico de um período de sete anos no sistema de Jubileus, sem ampliar o texto principal.
- source_word: ደገመ
  choice: tornou a
  rationale: Expressa de modo natural em português a ideia de repetição, isto é, que Jacó fez isso novamente.
- source_word: ቦአ ኀቤሃ
  choice: unir-se a ela
  rationale: Reproduz com dignidade o eufemismo semítico para relações sexuais; uma tradução literal como “entrou até ela” seria pouco natural e potencialmente enganosa em português.
- source_word: ፀንሰት
  choice: ela concebeu
  rationale: Tradução direta do verbo que indica o início da gravidez.
