  text: Leah conceived and bore Jacob a second son, and he called his name Simeon, on the twenty-first.
translation:
  language: pt
  text: Lia concebeu e deu à luz um segundo filho para Jacó, e ele lhe deu o nome de Simeão, no vigésimo primeiro dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፀንሰት፡ ወወለደት፡
  choice: concebeu e deu ... um filho
  rationale: Os verbos femininos têm Lia como sujeito; a formulação é natural em português e preserva a sequência concepção-nascimento.
- source_word: ወልደ፡ ካልአ፡
  choice: um segundo filho
  rationale: Reproduz diretamente a ordem de nascimento indicada pelo substantivo e pelo ordinal.
- source_word: ወጸውዐ፡ ስሞ፡ ስምዖን፡
  choice: ele lhe deu o nome de Simeão
  rationale: A forma verbal é masculina singular, indicando que Jacó, e não Lia, dá o nome; 'deu o nome de' é idiomático em português.
- source_word: አመ፡ ፲ሥራ፡
  choice: no vigésimo primeiro dia
  rationale: Expressa a data ordinal de modo claro; 'dia' é explicitado em português conforme o contexto calendárico.
theological_decisions:
- issue: Identidade de quem dá o nome à criança
  choice: ele lhe deu o nome
  alternative: ela lhe deu o nome
  rationale: O verbo ge'ez ጸውዐ está na terceira pessoa masculina singular. A tradução mantém essa característica textual, sem harmonizá-la com a narrativa de Gênesis.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O conectivo inicial foi omitido por fluidez, sem perda de conteúdo; a mudança de sujeito para Jacó foi explicitada pelo pronome masculino.
