  text: Leah conceived and bore him a third son, and he called his name Levi, on the first day of the first month.
translation:
  language: pt
  text: Leia concebeu e lhe deu à luz um terceiro filho; e ele o chamou de Levi, no primeiro dia do mês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na lua nova»; literalmente, «no começo» ou «no nascer do mês».
    reason: A expressão ge’ez በሠርቅ፡ ወርኅ pode designar a lua nova, isto é, o primeiro dia do mês. A nota preserva a imagem lexical sem introduzir «primeiro mês», que não está expresso no texto-fonte fornecido.
lexical_decisions:
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ
  choice: concebeu e lhe deu à luz
  rationale: Reproduz a sequência dos verbos femininos «concebeu» e «deu à luz», mantendo ሎቱ como referência a Jacó («lhe»).
- source_word: ወልደ፡ ሣልሰ
  choice: um terceiro filho
  rationale: Expressa naturalmente em português a ordem ordinal do filho nascido.
- source_word: ወጸውዐ፡ ስሞ፡ ሌዊ
  choice: e ele lhe deu o nome de Levi
  rationale: O verbo ጸውዐ está na terceira pessoa masculina do singular; «deu o nome de» é uma formulação portuguesa natural para «chamou o nome dele».
- source_word: በሠርቅ፡ ወርኅ
  choice: no primeiro dia do primeiro mês
  rationale: No contexto calendárico, a expressão designa o começo ou a lua nova do mês. Segue-se a divisão de versículo validada e a leitura cronológica da camada auditada, preservando em nota a imagem lexical do nascer do mês.
theological_decisions:
- issue: Sujeito de «deu o nome»
  choice: ele
  alternative: ela
  rationale: Embora Leia seja o sujeito dos dois verbos anteriores, a forma ge’ez de «chamou» é masculina singular e aponta para Jacó; não se regularizou a concordância com base apenas no contexto narrativo.
- issue: Formulação da data
  choice: no primeiro dia do primeiro mês
  alternative: na lua nova do mês / ao nascer do mês
  rationale: A tradução principal comunica o valor calendárico pretendido, enquanto a nota conserva a metáfora e a possível formulação alternativa do ge’ez.
translation_notes:
  register: Português atual, claro e digno, com boa legibilidade brasileira. A coordenação narrativa simples reflete o original sem produzir uma construção artificial; a referência masculina em «ele» foi mantida por razões morfológicas.
