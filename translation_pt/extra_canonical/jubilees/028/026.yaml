lexical_decisions:
- source_word: እግዚአብሔር
  choice: O SENHOR
  rationale: Forma corrente e dignificada para o título divino neste contexto, em consonância com a camada de consulta auditada.
- source_word: ትጸላእ
  choice: era odiada
  rationale: Preserva a força do verbo e o contraste explícito com Raquel, sem suavizá-lo para “menos amada”.
- source_word: ትትፈቀር
  choice: era amada
  rationale: Reproduz diretamente o estado passivo e mantém o paralelismo com “era odiada”.
- source_word: ደገመ
  choice: novamente
  rationale: Expressa de modo natural a ideia de repetição.
- source_word: ቦአ ኀበ
  choice: entrou ... para junto de
  rationale: Mantém o sentido idiomático de aproximação/entrada e deixa a preposição aberta para receber “Raquel” no início do versículo seguinte, conforme a divisão do texto-fonte.
theological_decisions:
- issue: Intensidade do contraste entre Lia e Raquel
  choice: “Lia era odiada, enquanto Raquel era amada”
  alternative: “Lia era menos amada do que Raquel”
  rationale: O texto apresenta oposição entre “odiada” e “amada”; suavizar o primeiro termo resolveria uma tensão que a fonte conserva.
- issue: Objeto da expressão final
  choice: Não acrescentar “ela” nem “Raquel” neste versículo
  alternative: “entrou novamente para junto dela”
  rationale: A fonte termina na preposição ኀበ, cujo complemento, “Raquel”, aparece no início do versículo 27. Acrescentar um pronome produziria redundância na leitura contínua.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A terminação deliberadamente suspensa em “de” preserva a divisão de versículos da fonte e deve ser lida em continuidade com o versículo 27.
