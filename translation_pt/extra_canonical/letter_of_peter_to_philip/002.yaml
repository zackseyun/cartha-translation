translation:
  language: pt
  text: 'Pedro então reuniu os outros. Eles foram ao monte chamado das Oliveiras, onde antes costumavam reunir-se com o bendito Cristo, quando ele habitava no corpo.


    Quando os apóstolos estavam reunidos e se puseram de joelhos, oraram assim, dizendo:


    “Pai, Pai, Pai da luz,

    tu, a quem pertencem os indestrutíveis,

    escuta-nos,

    assim como te agradaste do teu santo Filho, Jesus Cristo,

    pois, por nossa causa, ele se tornou uma luz [a] nas trevas.

    Verdadeiramente, escuta-nos.”


    E oraram mais uma vez, dizendo:


    “Filho da vida, Filho da imortalidade,

    tu que habitas na luz,

    Filho, Cristo da imortalidade,

    nosso redentor,

    dá-nos força,

    pois estão nos perseguindo para nos matar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho de base traz aqui um marcador vazio de restauração: “[]”. Isso indica uma possível lacuna ou texto não restaurado após “luz”.'
    reason: Preservar de maneira legível a incerteza textual registrada no material fornecido.
lexical_decisions:
- source_word: Olivet
  choice: monte das Oliveiras
  rationale: Emprega o nome corrente e reconhecível em português para o local tradicionalmente chamado Olivet.
- source_word: blessed Christ
  choice: bendito Cristo
  rationale: Preserva a forma devocional e solene sem introduzir uma interpretação adicional.
- source_word: dwelt in the body
  choice: habitava no corpo
  rationale: Mantém a formulação corporal incomum e sua possível tensão teológica, em vez de normalizá-la como simples referência à vida terrena.
- source_word: indestructible ones
  choice: indestrutíveis
  rationale: Reproduz a categoria substantivada do testemunho, sem identificá-la como seres, pessoas ou almas.
- source_word: deathlessness
  choice: imortalidade
  rationale: É a expressão portuguesa natural para a condição de não estar sujeito à morte, mantendo a repetição litúrgica.
- source_word: redeemer
  choice: redentor
  rationale: Termo religioso corrente, digno e semanticamente próximo.
- source_word: they are hunting for us
  choice: estão nos perseguindo
  rationale: Expressa de modo natural a busca hostil implícita no contexto, preservando a finalidade explícita de matar.
theological_decisions:
- issue: A relação entre o Pai e “os indestrutíveis”
  choice: “tu, a quem pertencem os indestrutíveis”
  alternative: “tu, que pertences aos indestrutíveis”
  rationale: Segue a leitura sintática do testemunho inglês fornecido, mas sem definir quem são os “indestrutíveis”.
- issue: Cristo “habitava no corpo”
  choice: Preservar literalmente a expressão
  alternative: “quando vivia corporalmente” ou “durante sua vida terrena”
  rationale: A formulação pode carregar uma antropologia ou cristologia específica; uma paráfrase resolveria indevidamente essa tensão.
- issue: “Filho, Cristo da imortalidade”
  choice: Manter a aposição e a ordem incomuns
  alternative: “Filho imortal, Cristo”
  rationale: Evita transformar “da imortalidade” em simples adjetivo e conserva a estrutura invocativa do testemunho.
- issue: Objeto do agrado divino
  choice: “te agradaste do teu santo Filho”
  alternative: “tiveste prazer em teu santo Filho”
  rationale: Mantém a relação com o Filho sem especificar se o agrado se refere à pessoa, à obediência ou à missão dele.
translation_notes:
  register: Português moderno, solene e acessível, com cadência de oração. A tradução é provisória porque se baseia no testemunho inglês de domínio público fornecido; a revisão direta do copta ainda está pendente. O número isolado “[1]” foi tratado como numeração intrusiva de página do manuscrito e não foi incluído. O marcador vazio foi convertido em nota [a], presente no texto principal.
