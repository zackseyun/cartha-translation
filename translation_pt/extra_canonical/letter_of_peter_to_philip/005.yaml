base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/005.yaml
  text: “Now concerning the fullness, I, [yes] I, was sent down into the body for the sake of this seed that had been lost, and I descended into their mortal mold. But they did not recognize me, because they thought I was a mortal person. I spoke with the one who belongs to me, and he listened to me, just as you also have listened today. I gave him authority to enter the inheritance of his fatherhood, and I took [him] [] [. . .] filled [. . .] through his salvation. Since he was deficiency, he became fullness.
translation:
  language: pt
  text: “Agora, quanto à plenitude, sou eu, [sim,] eu quem foi enviado para dentro do corpo por causa desta semente que se havia perdido, e desci ao molde mortal deles. Eles, porém, não me perceberam, pois imaginavam que eu fosse uma pessoa mortal. Falei com aquele que é meu, e ele me deu atenção, assim como vocês também me deram atenção hoje. Dei-lhe autoridade para entrar na herança de sua paternidade, e tomei [a ele] [...] cheio [...] por meio de sua salvação.[a] Visto que ele era deficiência, tornou-se plenitude.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase está fragmentária no testemunho disponível; os colchetes e as reticências assinalam palavras supridas ou texto perdido, e a relação sintática entre “tomei”, “cheio” e “salvação” permanece incerta.
    reason: Preservar transparentemente os sinais de dano manuscrito e evitar reconstruir uma sintaxe ou teologia que o texto transmitido não assegura.
lexical_decisions:
- source_word: fullness
  choice: plenitude
  rationale: Mantém o termo conceitual do testemunho e sua oposição explícita a “deficiência”, sem reduzir o sentido a mera completude comum.
- source_word: seed
  choice: semente
  rationale: Preserva a metáfora e sua possível carga coletiva ou espiritual, sem especificar “descendência”.
- source_word: mortal mold
  choice: molde mortal
  rationale: Conserva a imagem incomum de uma forma ou estrutura mortal, em vez de normalizá-la como “corpo humano”.
- source_word: the one who is mine
  choice: aquele que é meu
  rationale: Reproduz a relação possessiva deliberadamente vaga, sem identificar a personagem além do que o testemunho permite.
- source_word: fatherhood
  choice: paternidade
  rationale: Mantém a formulação abstrata e peculiar, evitando substituí-la interpretativamente por “Pai”, “linhagem” ou “patrimônio paterno”.
- source_word: deficiency
  choice: deficiência
  rationale: Preserva o substantivo abstrato em contraste direto com “plenitude”, embora a construção seja incomum em português.
theological_decisions:
- issue: Contraste entre plenitude e deficiência
  choice: 'Manter ambos como substantivos abstratos predicativos: “era deficiência” e “tornou-se plenitude”.'
  alternative: Interpretar como “era deficiente/incompleto” e “tornou-se pleno/completo”.
  rationale: A redação abstrata pode ser terminologia cosmológica ou soteriológica deliberada; convertê-la em adjetivos resolveria uma tensão que o testemunho não resolve.
- issue: Identidade de “aquele que é meu”
  choice: Deixar a referência sem identificação explícita.
  alternative: Identificá-lo como discípulo, ser humano interior ou figura salvífica específica.
  rationale: O trecho fornecido não autoriza uma identificação inequívoca.
- issue: “Herança de sua paternidade”
  choice: Preservar a expressão literalmente estranha.
  alternative: Explicitar como herança do Pai ou herança de sua linhagem paterna.
  rationale: As alternativas introduziriam uma interpretação teológica ou genealógica não estabelecida pelo testemunho disponível.
translation_notes:
  register: 'Português atual, digno e de leitura ampla, com manutenção intencional de termos conceituais e imagens incomuns. Esta redação é provisória: baseia-se no testemunho inglês de domínio público fornecido, pois a revisão direta do copta ainda está pendente. Os colchetes e as reticências foram preservados como sinais editoriais de suprimento e lacuna.'
