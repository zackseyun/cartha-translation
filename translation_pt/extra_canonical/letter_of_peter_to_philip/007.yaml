lexical_decisions:
- source_word: all praises
  choice: todo tipo de louvor
  rationale: Expressa a abrangência do testemunho sem o português pouco natural “com todos os louvores”.
- source_word: on account of our being small
  choice: por sermos pequenos
  rationale: Mantém a formulação incomum e sua possível carga teológica, sem explicá-la como fraqueza, insignificância ou inferioridade.
- source_word: dwelt in the body
  choice: habitava no corpo
  rationale: Preserva a distinção conceitual do testemunho entre Jesus e o corpo, sem harmonização doutrinária.
- source_word: a holy Spirit
  choice: um espírito santo
  rationale: Mantém o artigo indefinido e a ambiguidade do testemunho inglês provisório; não o identifica silenciosamente com o título cristão convencional “o Espírito Santo”.
- source_word: tree
  choice: madeiro
  rationale: No contexto de crucificação, “madeiro” conserva a imagem do termo sem sugerir que Jesus foi pendurado numa árvore viva.
- source_word: alien to such suffering
  choice: alheio a um sofrimento como esse
  rationale: Reproduz a afirmação teologicamente tensa sem substituí-la por “incapaz de sofrer”, “não sofreu” ou outra interpretação mais definida.
- source_word: trespass of the Mother
  choice: transgressão da Mãe
  rationale: Preserva a terminologia cosmológica e a inicial maiúscula do testemunho, sem identificar ou explicar quem é a Mãe.
- source_word: author of our life
  choice: autor da nossa vida
  rationale: Mantém a metáfora ampla do testemunho, que pode envolver origem ou autoria, sem reduzi-la a “criador” ou “fonte”.
- source_word: Godless ones
  choice: ímpios
  rationale: Escolha portuguesa natural para pessoas sem reverência a Deus; evita a expressão mais moderna e potencialmente anacrônica “ateus”.
theological_decisions:
- issue: Predição do sofrimento dos discípulos
  choice: “terão de sofrer” e “serão arrastados”
  alternative: “deverão sofrer” e “deverão ser arrastados”
  rationale: O futuro passivo/necessitativo comunica destino anunciado sem transformar a passagem em ordem moral para buscar sofrimento.
- issue: Relação de Jesus com o sofrimento narrado
  choice: “Jesus é alheio a um sofrimento como esse”
  alternative: “Jesus não sofreu realmente essas coisas”
  rationale: A alternativa resolveria uma tensão cristológica que o texto deixa em formulação própria e enigmática.
- issue: Natureza simbólica do anúncio de Jesus
  choice: “anunciou tudo em sentido simbólico”
  alternative: “falou de tudo por parábolas”
  rationale: “Sentido simbólico” acompanha o testemunho e não restringe o recurso literário à categoria específica de parábola.
- issue: Identidade do espírito que enche Pedro
  choice: “um espírito santo”
  alternative: “o Espírito Santo”
  rationale: A base provisória traz artigo indefinido; a tradução não deve impor uma identificação dogmática antes da revisão copta.
- issue: Referência à Mãe
  choice: manter “Mãe” sem glosa interpretativa
  alternative: identificá-la com uma figura cosmológica específica
  rationale: O excerto não fornece identificação suficiente, e uma glosa importaria um sistema interpretativo externo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação evita construções excessivamente literais quando não carregam significado, mas conserva termos estranhos, ambiguidades cristológicas e a linguagem cosmológica do testemunho. Esta é uma versão provisória baseada no testemunho inglês de domínio público; a revisão direta do copta continua pendente. Números de página do manuscrito foram omitidos, e danos textuais relevantes foram preservados e explicados em notas.
