translation:
  language: pt
  text: 'Os apóstolos, então, deram graças ao Senhor com todo tipo de louvor e voltaram para Jerusalém.


    Enquanto desciam pela estrada — do monte em direção a Jerusalém —, conversavam sobre a luz que se tornara visível. Surgiu entre eles uma discussão a respeito do Senhor, e disseram: “Se ele, nosso Senhor, sofreu, quanto mais nós sofreremos?”


    Pedro respondeu: “Ele sofreu por nossa causa, e nós também teremos de sofrer, por sermos pequenos.”


    Então uma voz lhes disse: “Eu lhes disse muitas vezes que vocês terão de sofrer. Vocês serão arrastados às sinagogas e levados diante de governadores, e isso lhes causará sofrimento. Mas aquele que não sofrer também não [—] [...] [meu] Pai [...], para que possa [...].”[a]


    Os apóstolos, porém, ficaram muito alegres e subiram a Jerusalém. Foram ao templo, ensinaram a salvação em nome do Senhor Jesus Cristo e curaram uma multidão.


    Então Pedro começou a falar e disse aos seus discípulos: “Quando nosso Senhor Jesus habitava no corpo, ele nos contou tudo, pois ele mesmo havia descido. Meus irmãos, prestem atenção à minha voz.”


    Ele ficou cheio de um espírito santo e falou assim:


    “Jesus, nossa luz, desceu,

    foi crucificado,

    usou uma coroa de espinhos,

    vestiu um manto púrpura,

    foi pendurado num madeiro,

    foi sepultado num túmulo

    e ressuscitou dentre os mortos.


    “Meus irmãos, Jesus é alheio a um sofrimento como esse. Nós, porém, somos os que sofreram por causa da transgressão da Mãe. Por isso, quando estava entre nós, ele anunciou tudo em sentido simbólico. O Senhor Jesus, Filho da glória imensurável do Pai, é o autor da nossa vida.


    “Meus irmãos, não demos atenção a esses ímpios, nem andemos em [—] [...].”[b]'
