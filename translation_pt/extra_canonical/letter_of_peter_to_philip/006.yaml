translation:
  language: pt
  text: '“Quanto à prisão de vocês, ela acontece porque vocês pertencem a mim. Quando removerem de si mesmos o que é perecível, vocês se tornarão luzes entre os mortais.


    “Quanto à luta de vocês contra os poderes, ela ocorre porque eles, ao contrário de vocês, não têm descanso, pois não querem que vocês sejam salvos.”


    Então os apóstolos tornaram a adorar e disseram: “Senhor, ensina-nos: como lutaremos contra os arcontes[a], visto que eles são mais poderosos do que nós?”


    Então uma voz lhes clamou de dentro da aparição: “Vocês devem combatê-los da seguinte maneira, porque os arcontes combatem o ser humano interior[b]. Vocês devem combatê-los assim:


    “Reúnam-se e ensinem ao mundo a salvação acompanhada de uma promessa. Revistam-se do poder de meu Pai e apresentem o pedido de vocês; e ele, o Pai, os ajudará, assim como ajudou vocês quando me enviou. […] [Não tenham medo; eu estarei sempre com vocês][c], como lhes disse anteriormente, quando habitava no corpo.”


    Então relâmpagos e trovões vieram do céu, e aquele que eles tinham visto ali na aparição foi arrebatado ao céu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Arcontes” significa literalmente “governantes” ou “autoridades”; aqui designa poderes adversários no mundo espiritual do escrito.
    reason: O empréstimo técnico preserva o contexto antigo, mas requer esclarecimento para leitores modernos.
  - marker: b
    text: Também poderia ser traduzido de modo mais literal por “Homem Interior”. A expressão parece designar a dimensão interior da pessoa, mas o texto não a define aqui.
    reason: Registra a forma tradicional e preserva a incerteza antropológica.
  - marker: c
    text: O testemunho apresenta uma lacuna antes desta frase e indica como restauradas as palavras entre colchetes. A extensão e a redação exatas do texto perdido permanecem incertas.
    reason: Preserva de modo legível os sinais de dano e restauração do manuscrito refletidos no testemunho fornecido.
lexical_decisions:
- source_word: detention
  choice: prisão
  rationale: Expressa de modo natural a ideia de detenção ou confinamento, sem especificar indevidamente sua forma.
- source_word: powers
  choice: poderes
  rationale: Mantém o termo cosmológico amplo do testemunho e evita identificá-lo automaticamente com uma categoria doutrinária mais específica.
- source_word: archons
  choice: arcontes
  rationale: Preserva o termo técnico do contexto antigo, acompanhado de nota explicativa para leitores comuns.
- source_word: Inner Man
  choice: ser humano interior
  rationale: Reproduz a expressão antropológica sem restringi-la ao sexo masculino; a nota registra a possibilidade mais literal de 'homem interior'.
- source_word: gird yourselves
  choice: revistam-se
  rationale: Comunica a metáfora de equipar-se com poder em português natural, sem eliminá-la por completo.
- source_word: apparition
  choice: aparição
  rationale: Mantém a natureza visual e extraordinária do fenômeno sem decidir se se trata de visão, forma ou manifestação física.
- source_word: snatched
  choice: arrebatado
  rationale: Conserva o movimento súbito e passivo para o céu presente no testemunho.
theological_decisions:
- issue: Natureza dos poderes e arcontes
  choice: Manter 'poderes' e 'arcontes' como designações distintas
  alternative: Harmonizar ambos como 'potestades', 'governantes espirituais' ou 'demônios'
  rationale: O testemunho emprega categorias diferentes, e identificá-las completamente importaria uma interpretação cosmológica não explicitada.
- issue: O 'ser humano interior'
  choice: Preservar a expressão como categoria antropológica aberta
  alternative: Interpretar como 'espírito', 'alma' ou 'eu interior'
  rationale: Essas alternativas resolveriam uma tensão conceitual que o texto não explica.
- issue: Promessa associada à salvação
  choice: Traduzir 'salvação acompanhada de uma promessa'
  alternative: Traduzir 'a promessa de salvação'
  rationale: A construção do testemunho pode distinguir a salvação da promessa; a redação escolhida conserva essa relação sem fundi-las.
- issue: Sujeito de 'quando me enviou'
  choice: Conservar a sequência pronominal do testemunho
  alternative: Reformular para explicar exatamente como o Pai ajudou os apóstolos ao enviar o falante
  rationale: A lógica da frase é difícil e possivelmente depende do texto copta ou de lacunas; não se acrescentou uma explicação conjectural.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com formas brasileiras naturais como “vocês”. A tradução é provisória: baseia-se no testemunho público em inglês fornecido, pois a revisão direta do copta ainda está pendente. Evitaram-se explicações confessionais e harmonizações com outros textos. A lacuna foi representada por reticências entre colchetes, e a restauração conservada entre colchetes com nota.'
