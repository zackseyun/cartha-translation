review_pass:
  verdict: revise
  source_fidelity: A tradução segue de perto o testemunho inglês fornecido, mas “prisão” torna “detention” mais específico, “mais poderosos” interpreta “superior”, e “ali na aparição” não reproduz adequadamente “in that place”. A formulação dos colchetes também deve preservar mais claramente o caráter lacunar/restaurado transmitido pelo testemunho. A revisão direta do copta continua pendente.
  naturalness: O português é geralmente claro e de registro adequado. Ajustes pontuais tornam mais natural a voz procedente da aparição e a formulação da instrução sobre tornar conhecido o pedido, sem suavizar a linguagem cosmológica do escrito.
  terminology: “Poderes”, “arcontes”, “ser humano interior”, “salvação”, “Pai” e “arrebatado” são escolhas adequadas. Mantêm-se “arcontes” e “poderes” distintos, sem impor uma identificação doutrinária. “Ser humano interior” preserva a abertura de “Inner Man”.
  issues:
  - severity: medium
    issue: “prisão” para “detention”
    rationale: “Prisão” pode implicar encarceramento formal ou uma instituição prisional; “detenção” preserva a formulação mais ampla do testemunho.
  - severity: low
    issue: “mais poderosos” para “superior”
    rationale: A opção explica “superior” como superioridade de poder. “Superiores” conserva a indeterminação do texto.
  - severity: medium
    issue: “ali na aparição” para “in that place”
    rationale: O testemunho localiza o arrebatamento “naquele lugar”, não necessariamente dentro ou na própria aparição.
  - severity: medium
    issue: Representação dos trechos lacunares e restaurados
    rationale: O testemunho contém uma lacuna vazia e segmentos entre colchetes. A tradução deve manter sinais inequívocos de texto perdido/restaurado e a nota deve esclarecer que a reconstituição é provisória.
