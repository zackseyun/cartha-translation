base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/001.yaml
  text: '[] The Letter of Peter, which he sent to Philip.


    Peter, an apostle of Jesus Christ, to Philip, our beloved brother and fellow apostle, and also to the brothers who are with you. Greetings.


    I want you to understand, our brother, that we received instructions from our Lord, the Savior of the whole world, to gather together so that we might teach and preach about the salvation promised to us by [] our Lord Jesus Christ.


    But you separated yourself from us and did not want to gather together to learn how we could coordinate with one another so that we might proclaim the message.


    Therefore, our brother, would it be acceptable to you to come in accordance with the instructions of our God, Jesus?


    When Philip received and read this, he went to Peter, rejoicing with delight.'
translation:
  language: pt
  text: '[...][a] A Carta de Pedro, que ele enviou a Filipe.


    Pedro, apóstolo de Jesus Cristo, a Filipe, nosso amado irmão e companheiro de apostolado, bem como aos irmãos que estão com você. Saudações.


    Quero que você entenda, nosso irmão, que recebemos instruções de nosso Senhor, o Salvador do mundo inteiro, para nos reunirmos, a fim de ensinar e pregar sobre a salvação que nos foi prometida por [...][b] nosso Senhor Jesus Cristo.


    Você, porém, afastou-se de nós e não quis se reunir conosco para aprender como poderíamos atuar em conjunto, a fim de anunciar a mensagem.


    Portanto, nosso irmão, você estaria disposto a vir, de acordo com as instruções de nosso Deus, Jesus?[c]


    Quando Filipe recebeu e leu a carta, foi até Pedro, cheio de alegria e júbilo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito antes do título preservado.
    reason: Sinalizar dano ou perda textual indicado pelos colchetes na testemunha de base.
  - marker: b
    text: Há uma lacuna no manuscrito antes de “nosso Senhor Jesus Cristo”; o conteúdo perdido é incerto.
    reason: Evitar que uma restauração conjectural seja apresentada como texto seguro.
  - marker: c
    text: A expressão preservada na testemunha consultada é literalmente “nosso Deus, Jesus”.
    reason: Chamar atenção para uma construção incomum e teologicamente significativa sem alterá-la silenciosamente.
lexical_decisions:
- source_word: dispatched / sent
  choice: enviou
  rationale: Forma corrente e natural para o envio de uma carta, sem acrescentar uma nuance técnica ausente na testemunha consultada.
- source_word: co-apostle
  choice: companheiro de apostolado
  rationale: Expressa a participação comum no apostolado em português natural, evitando o pouco corrente “coapóstolo”.
- source_word: directives
  choice: instruções
  rationale: Preserva a ideia de orientações autorizadas sem tornar o termo necessariamente jurídico ou militar.
- source_word: coordinate ourselves
  choice: atuar em conjunto
  rationale: Comunica cooperação organizada em linguagem clara e idiomática, sem sugerir uma estrutura institucional específica.
- source_word: message
  choice: mensagem
  rationale: Mantém a generalidade do testemunho inglês, que não identifica aqui a mensagem por um termo técnico como “evangelho”.
- source_word: delighting with glee
  choice: cheio de alegria e júbilo
  rationale: Retém a ênfase intensificada da expressão, embora com uma formulação digna e compreensível em português.
theological_decisions:
- issue: A expressão “nosso Deus, Jesus” identifica diretamente Jesus como Deus.
  choice: “nosso Deus, Jesus”
  alternative: “nosso Deus Jesus” ou “Deus, Jesus”
  rationale: A tradução conserva a construção explícita e sua tensão teológica, sem reformulá-la segundo uma leitura denominacional. A vírgula apresenta “Jesus” como aposição, conforme o testemunho fornecido.
- issue: Agente da promessa na frase sobre a salvação
  choice: “a salvação que nos foi prometida por [...] nosso Senhor Jesus Cristo”
  alternative: “a salvação prometida a nós pelo [...] Senhor”
  rationale: Mantém Jesus Cristo como agente da promessa segundo a sintaxe da testemunha inglesa, ao mesmo tempo que sinaliza a lacuna manuscrita que pode afetar a formulação.
- issue: Referência aos destinatários como “brethren”
  choice: “irmãos”
  alternative: “irmãos e irmãs”
  rationale: Preserva a forma coletiva tradicional e a indeterminação do testemunho disponível, sem explicitar uma composição de gênero que o texto fornecido não estabelece.
translation_notes:
  register: 'Português moderno, claro e digno, com ampla legibilidade brasileira. O tratamento por “você” acompanha o singular dirigido a Filipe e evita a solenidade arcaizante de “tu” em muitas variedades contemporâneas. As repetições retóricas do texto foram em geral preservadas. Este rascunho é necessariamente provisório: foi elaborado a partir da testemunha inglesa de domínio público fornecida, pois a revisão direta do copta dos códices Nag Hammadi VIII,2 e Tchacos ainda está pendente. As lacunas manuscritas foram mantidas visivelmente e explicadas em notas.'
