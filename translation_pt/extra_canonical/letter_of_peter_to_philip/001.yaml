    Você, porém, afastou-se de nós e não quis se reunir conosco para aprender como poderíamos atuar em conjunto, a fim de anunciar a mensagem.


    Portanto, nosso irmão, seria aceitável para você vir de acordo com as instruções de nosso Deus, Jesus?[c]


    Quando Filipe recebeu e leu isto, foi até Pedro, alegrando-se com grande alegria.'
