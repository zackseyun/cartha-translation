review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o trecho conclusivo abreviado do testemunho inglês fornecido. Contudo, em “viram [Jesus]”, ela transforma em nome próprio o pronome restaurado “[him]”, resolvendo uma lacuna que o texto auditado mantém sem essa explicitação.
  naturalness: O português é claro, moderno e de registro apropriado. “Um Espírito santo” é uma formulação deliberadamente incomum, mas é defensável para preservar a forma indefinida e a capitalização não plenamente inequívoca do testemunho.
  terminology: “Descanso”, “espírito de entendimento”, “maravilhas”, “fiéis ao meu nome” e “quatro missões de pregação” são escolhas adequadas. A nota sobre as “quatro mensagens” registra corretamente a obscuridade da expressão.
  issues:
  - severity: medium
    issue: Explicitação indevida do referente em “viram [Jesus]”.
    rationale: O testemunho diz “saw [him]”; embora o contexto provavelmente se refira a Jesus, os colchetes indicam material restaurado e a tradução não deve substituir o pronome por um nome próprio sem necessidade. “Viram [ele]” preserva a referência e a lacuna do texto-base.
