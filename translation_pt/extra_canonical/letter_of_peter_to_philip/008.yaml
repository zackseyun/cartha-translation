base_translation:
  language: en
  yaml_path: translation/extra_canonical/letter_of_peter_to_philip/008.yaml
  text: 'Peter [then] gathered [the others] and said, “Our Lord Jesus Christ, author of our rest, give us a spirit of understanding so that we too may perform wonders!”


    Peter and the other apostles then saw [him]. They were filled with a holy Spirit, and each one performed healings. They went out to proclaim the Lord Jesus. Later they gathered again, greeted one another, and said, “Amen.”


    Jesus then appeared and said to them, “Peace be with [all] of you and with everyone who is faithful in my name. As you go, joy, grace, and power will be yours. Do not be afraid. I will be with you always.”


    The apostles then parted from one another for their four preaching missions, and they went in peace with the power of Jesus.


    The Letter of Peter to Philip.'
translation:
  language: pt
  text: 'Pedro [então] reuniu [os outros] e disse: “Nosso Senhor Jesus Cristo, autor do nosso descanso, concede-nos um espírito de entendimento, para que nós também possamos realizar maravilhas!”


    Então Pedro e os outros apóstolos viram [Jesus]. Eles ficaram cheios de um Espírito santo[a], e cada um realizou curas. Partiram para anunciar o Senhor Jesus. Depois, reuniram-se novamente, saudaram uns aos outros e disseram: “Amém.”


    Então Jesus apareceu e lhes disse: “A paz esteja com [todos] vocês e com todos os que são fiéis ao meu nome. Quando partirem, vocês terão alegria, graça e poder.


    “Não tenham medo. Eu estarei sempre com vocês.”


    Então os apóstolos se separaram uns dos outros para as quatro missões de pregação[b] e seguiram em paz, com o poder de Jesus.


    A Carta de Pedro a Filipe'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão do testemunho é literalmente “um Espírito santo”; a forma incomum foi preservada.
    reason: Evitar resolver uma possível ambiguidade teológica e gramatical.
  - marker: b
    text: O texto também pode ser entendido literalmente como “quatro mensagens”; a passagem é obscura.
    reason: Registrar a incerteza textual e semântica da expressão.
lexical_decisions:
- source_word: repose
  choice: descanso
  rationale: Preserva a imagem de repouso sem impor uma interpretação técnica como salvação, morte ou repouso escatológico.
- source_word: spirit of insight
  choice: espírito de entendimento
  rationale: Expressão natural em português e próxima do sentido cognitivo de discernimento ou compreensão.
- source_word: miracles / wonders
  choice: maravilhas
  rationale: Evita restringir a expressão somente a curas, que são mencionadas separadamente na sequência.
- source_word: faithful in my name
  choice: fiéis ao meu nome
  rationale: Mantém a relação ambígua com o nome de Jesus, sem expandi-la para uma fórmula doutrinária.
- source_word: continually
  choice: sempre
  rationale: Forma idiomática e clara que comunica presença contínua.
theological_decisions:
- issue: Capitalização de “holy Spirit”
  choice: um Espírito santo
  alternative: o Espírito Santo
  rationale: O testemunho inglês traz artigo indefinido e capitalização mista; a tradução preserva essa forma incomum e evita identificá-la silenciosamente com uma formulação trinitária posterior.
- issue: Identidade do referente em “saw [him]”
  choice: viram [Jesus]
  alternative: viram [aquele]
  rationale: O contexto aponta para Jesus, mas o texto é restaurado; os colchetes preservam a incerteza manuscrita.
- issue: “four messages”
  choice: quatro missões de pregação
  alternative: quatro mensagens
  rationale: A formulação do testemunho é obscura. A opção segue a camada inglesa auditada, que entende a frase como quatro envios missionários, mas a nota registra a leitura literal.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Esta versão é provisória: baseia-se no testemunho inglês público fornecido, pois a revisão direta do copta ainda está pendente. Colchetes foram mantidos para indicar restaurações textuais; números de página intrusivos foram omitidos.'
