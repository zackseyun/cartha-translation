translation:
  language: pt
  text: 'Então, uma luz brilhante tornou-se visível, e o monte resplandeceu por causa da aparição daquele que se havia tornado visível. Uma voz lhes clamou, dizendo:


    “Prestem atenção às minhas palavras, para que eu possa falar com vocês.

    Por que vocês estão me procurando?

    Eu sou Jesus Cristo, que permanece continuamente com vocês.”


    Os apóstolos responderam:


    “Senhor, gostaríamos de compreender a deficiência dos éons[a],

    bem como a plenitude deles,

    e como somos impedidos de avançar nesta morada.

    Como chegamos a este lugar?

    Como partiremos daqui?

    [...][b] Como passamos a ter autoridade para falar com ousadia?

    Por que os poderes[c] lutam contra nós?”


    Então, uma voz vinda da luz lhes clamou: “Vocês são os que dão testemunho de que eu lhes disse todas estas coisas. Mas, por causa da falta de fé de vocês, eu as repetirei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éons” é um termo cosmológico que pode designar eras, domínios ou realidades espirituais; aqui ele é mantido sem especificação adicional.
    reason: O termo técnico é ambíguo, e a fonte copta ainda não foi diretamente revista.
  - marker: b
    text: Há uma lacuna ou sinal de texto ausente neste ponto do testemunho utilizado.
    reason: Preserva de modo legível o indicador de dano, omissão ou restauração textual representado por colchetes vazios na fonte fornecida.
  - marker: c
    text: “Poderes” pode referir-se a forças ou autoridades hostis, possivelmente espirituais; o texto não as identifica com maior precisão.
    reason: Evita impor uma identificação teológica não explicitada pelo testemunho.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Mantém o termo cosmológico técnico e sua ambiguidade, em vez de o substituir por “eras” ou por uma interpretação denominacional.
- source_word: fullness
  choice: plenitude
  rationale: Preserva o contraste técnico entre deficiência e plenitude sem explicar além do que o testemunho permite.
- source_word: dwelling-place
  choice: morada
  rationale: Termo natural e digno que conserva a possível dimensão espacial ou existencial do original.
- source_word: held back
  choice: impedidos de avançar
  rationale: Expressa a ideia de retenção ou impedimento em português corrente, sem definir quem exerce o impedimento.
- source_word: authority for boldness of speech
  choice: autoridade para falar com ousadia
  rationale: Conserva tanto a noção de autoridade quanto a de franqueza ou ousadia no falar.
- source_word: powers
  choice: poderes
  rationale: Mantém a designação ambígua de forças ou entidades, sem convertê-la interpretativamente em “demônios” ou “autoridades”.
- source_word: unfaithfulness
  choice: falta de fé
  rationale: Reproduz a dimensão de incredulidade ou infidelidade indicada pelo testemunho, sem escolher uma formulação excessivamente técnica.
theological_decisions:
- issue: Natureza dos éons
  choice: Manter “éons” sem identificar sua natureza no corpo do texto
  alternative: Traduzir como “eras”, “mundos” ou “seres celestiais”
  rationale: O contexto cosmológico admite mais de uma compreensão, e a revisão direta do copta ainda está pendente.
- issue: Identidade dos poderes
  choice: Usar o termo amplo “poderes”
  alternative: Explicitar “poderes espirituais”, “autoridades” ou “demônios”
  rationale: A tradução não deve resolver silenciosamente a identidade das forças hostis.
- issue: Sentido de unfaithfulness
  choice: “falta de fé”
  alternative: “infidelidade” ou “incredulidade”
  rationale: “Falta de fé” é clara e preserva uma faixa semântica ampla; a escolha permanece provisória até a análise do copta.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis e boa legibilidade brasileira. A redação é provisória porque se baseia no testemunho inglês de domínio público fornecido; a revisão direta dos manuscritos coptas de Nag Hammadi VIII,2 e do Códice Tchacos continua pendente. A repetição de “tornou-se visível” foi preservada para refletir a formulação enfática do testemunho.
