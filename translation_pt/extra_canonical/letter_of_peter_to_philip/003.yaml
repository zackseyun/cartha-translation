review_pass:
  verdict: revise
  source_fidelity: A revisão direta do copta permanece pendente; em comparação com o testemunho inglês fornecido, a versão acompanha de perto a sequência, os termos cosmológicos e a ambiguidade. Contudo, «impedidos de avançar» acrescenta a noção de progresso/avanço, ausente de «held back», e o sinal «[...]» transforma os colchetes vazios do testemunho em reticências editoriais.
  naturalness: O registro é claro e contemporâneo. «Uma voz lhes clamou» é menos natural em português atual do que «uma voz clamou-lhes» ou «uma voz lhes gritou». A redação revista conserva solenidade sem arcaísmo excessivo.
  terminology: «Éons», «plenitude» e «poderes» preservam adequadamente a terminologia técnica e suas ambiguidades. «Morada» é uma equivalência viável para «dwelling-place». «Infidelidade» reproduz de modo mais direto «unfaithfulness», sem especificar se se trata de incredulidade, deslealdade ou outra modalidade de falta de fidelidade.
  issues:
  - severity: medium
    issue: Acréscimo semântico em «impedidos de avançar».
    rationale: O testemunho diz apenas que os apóstolos são «held back» nesta morada; «avançar» introduz um movimento ou progresso que não está expresso. «Retidos nesta morada» conserva a formulação sem ampliar seu sentido.
  - severity: medium
    issue: O indicador textual «[]» foi convertido em «[...]».
    rationale: Reticências sugerem palavras elididas em uma continuação, enquanto o testemunho fornecido apresenta especificamente colchetes vazios. Deve-se preservar o sinal sem preenchê-lo editorialmente.
  - severity: low
    issue: Formulação pouco idiomática em «Uma voz lhes clamou».
    rationale: «Uma voz clamou-lhes» é a construção mais natural, mantendo o tom elevado e o sentido de «cried out to them».
