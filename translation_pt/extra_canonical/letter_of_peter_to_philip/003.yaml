review_pass:
  verdict: revise
  source_fidelity: A tradução preserva a maior parte da sequência, os termos técnicos e o sinal de lacuna. Contudo, «aparición» desloca «sight» para uma manifestação objetiva, «impedidos de avançar» acrescenta a ideia de progresso, e «Como passamos a ter» sugere uma aquisição já ocorrida, onde o testemunho pergunta como se chega a ter essa autoridade.
  naturalness: O texto é claro e tem registro apropriado. «Por causa da visão daquele que se tornou visível» conserva uma repetição deliberadamente estranha do testemunho; a nota de tradução pode explicar sua natureza provisória, mas não é necessária no texto.
  terminology: «Éons», «plenitude» e «poderes» são escolhas adequadas e prudentemente não interpretativas. «Infidelidade» reproduz «unfaithfulness» de modo mais direto que «falta de fé», sem resolver se a nuance é incredulidade, deslealdade ou ambas.
  issues:
  - severity: medium
    issue: «Aparição» para «sight»
    rationale: «Aparição» interpreta a expressão como evento de manifestação. «Visão» é o correspondente mais direto do testemunho e preserva a formulação repetitiva.
  - severity: medium
    issue: «Impedidos de avançar» para «held back»
    rationale: «Avançar» não está expresso no testemunho e introduz uma direção ou progresso. «Somos retidos nesta morada» conserva a retenção sem acréscimo.
  - severity: medium
    issue: «Como passamos a ter» para «How do we come to have»
    rationale: O perfeito sugere que os apóstolos já adquiriram a autoridade. «Como chegamos a ter» mantém a pergunta sobre o modo de vir a possuí-la.
  - severity: low
    issue: «Falta de fé» para «unfaithfulness»
    rationale: É possível, mas «infidelidade» mantém de forma mais ampla e literal a noção de falta de fidelidade, sem reduzir o termo a uma única leitura.
