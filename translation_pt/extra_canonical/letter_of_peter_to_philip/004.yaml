translation:
  language: pt
  text: '“Agora, pois, quanto à [deficiência] dos éons, esta é a deficiência: quando se manifestaram a rebeldia e a insensatez da Mãe, à parte da ordem da Grandeza do Pai, ela desejou estabelecer éons. Quando ela falou, o tirano veio em seguida; mas, quando ela abandonou uma porção, o tirano se apoderou dela, e ela se tornou uma deficiência. Esta é a deficiência dos éons.


    “Depois que o tirano tomou uma porção, ele a plantou, colocando sobre ela poderes e autoridades, e a confinou dentro dos éons mortais. Todos os poderes cósmicos ficaram exultantes por terem sido produzidos. [][a] Contudo, ignoravam o [Pai] preexistente, pois são estrangeiros para ele. [Em vez disso, a este] tirano foi concedido poder, e eles o adoraram e o louvaram.[b]


    “Então, a mente do tirano se tornou arrogante por causa do louvor dos poderes. Ele se fez adversário e desejou substituir uma imagem [por outra imagem] e uma forma por outra forma. Depois, encarregou os poderes sob sua autoridade de moldar corpos mortais, e estes vieram a existir a partir de uma disparidade na semelhança que havia sido produzida.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes vazios assinalam uma lacuna ou trecho ilegível no testemunho manuscrito refletido pela tradução de consulta.
    reason: Preservar de modo visível o sinal de dano ou ausência textual presente no testemunho fornecido.
  - marker: b
    text: O trecho restaurado antes de “tirano” é incerto; os colchetes preservam a reconstrução editorial do testemunho de consulta.
    reason: Distinguir palavras restauradas editorialmente de texto seguramente preservado.
  - marker: c
    text: A expressão traduzida por “disparidade na semelhança” é obscura e admite outras análises; a formulação foi mantida sem explicação interpretativa.
    reason: Sinalizar uma ambiguidade real, especialmente porque a revisão direta do copta ainda está pendente.
lexical_decisions:
- source_word: deficiency
  choice: deficiência
  rationale: Preserva o termo cosmológico recorrente e sua relação verbal e conceitual com aquilo que se tornou incompleto, sem reduzir a ideia a mera ausência.
- source_word: aeons
  choice: éons
  rationale: Mantém o termo técnico da cosmologia do escrito, em forma reconhecível no português contemporâneo.
- source_word: the tyrannical one
  choice: o tirano
  rationale: Forma natural e forte em português que conserva a caracterização substantivada da figura, sem acrescentar um nome ou identidade teológica.
- source_word: powers and authorities
  choice: poderes e autoridades
  rationale: Conserva as duas categorias distintas do testemunho e evita harmonizá-las com terminologia de outros textos.
- source_word: aliens to him
  choice: estrangeiros para ele
  rationale: Preserva a noção de alheamento ou não pertencimento, em vez de enfraquecê-la para simples desconhecimento.
- source_word: opponent
  choice: adversário
  rationale: Expressa oposição ativa sem importar automaticamente o nome próprio ou a figura de Satanás.
- source_word: disparity of the likeness
  choice: disparidade na semelhança
  rationale: Mantém a formulação tensa e incomum do testemunho, cuja relação sintática e conceitual permanece incerta enquanto se aguarda revisão do copta.
theological_decisions:
- issue: Identidade do Pai preexistente
  choice: Manter “[Pai] preexistente” sem identificação adicional
  alternative: Identificá-lo explicitamente com Deus ou com a Grandeza do Pai
  rationale: O trecho preservado não exige que a tradução resolva a relação entre essas designações.
- issue: Identidade do tirano
  choice: Não nomear nem equiparar o tirano a outra figura
  alternative: Traduzir ou explicar como demiurgo, arconte ou Satanás
  rationale: Tais identificações excederiam a evidência textual fornecida e introduziriam uma interpretação doutrinária.
- issue: Ação e condição da Mãe
  choice: Traduzir “rebeldia e insensatez” de modo direto
  alternative: Abrandar para erro, ignorância ou desvio involuntário
  rationale: A tradução conserva a avaliação negativa e a tensão do testemunho sem explicar sua causa ou culpabilidade.
- issue: Origem dos corpos mortais
  choice: Preservar a obscura “disparidade na semelhança”
  alternative: Explicitar uma criação defeituosa ou uma cópia imperfeita
  rationale: A explicitação resolveria indevidamente uma expressão difícil e teologicamente carregada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se “éons” e outras designações cosmológicas como termos técnicos. Os colchetes internos reproduzem restaurações e lacunas do testemunho inglês público fornecido. Este rascunho é necessariamente provisório, pois foi elaborado a partir desse testemunho de consulta e ainda requer cotejo direto com o copta dos códices Nag Hammadi VIII,2 e Tchacos.
