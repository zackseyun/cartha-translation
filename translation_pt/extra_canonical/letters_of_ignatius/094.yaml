base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/094.yaml
  text: 'Do not neglect widows. After the Lord, be their protector. Let nothing be done without your consent, and do nothing without God’s consent, as indeed you do not. Be steadfast.


    Let meetings be held more frequently. Seek out everyone by name.


    Do not despise enslaved people, whether men or women. Yet let them not in turn be puffed up, but let them serve even more faithfully for the glory of God, so that they may obtain a better freedom from God. Let them not seek to be freed at public expense, lest they be found to be slaves of lust.'
translation:
  language: pt
  text: 'Não deixe que as viúvas sejam negligenciadas. Depois do Senhor, seja você o protetor delas.[a] Que nada seja feito sem o seu consentimento; e você também não faça nada sem Deus, como, de fato, você já faz. Permaneça firme.


    Que as reuniões sejam realizadas com mais frequência. Procure cada pessoa pelo nome.[b]


    Não trate com arrogância as pessoas escravizadas, sejam homens ou mulheres. Mas que elas também não se encham de orgulho; antes, que sirvam com fidelidade ainda maior, para a glória de Deus, a fim de obterem de Deus uma liberdade melhor. Que não desejem ser libertadas com recursos comuns,[c] para que não sejam encontradas escravas do desejo.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Depois do Senhor» também pode indicar uma posição de responsabilidade subordinada ao Senhor, e não apenas uma sequência temporal.
    reason: A expressão grega pode comunicar ordem de precedência e subordinação.
  - marker: b
    text: Isto é, dê atenção pessoal a cada um; a expressão também pode sugerir procurar ou conhecer cada pessoa individualmente.
    reason: «Procurar pelo nome» pode soar apenas como busca literal em português, enquanto o sentido relacional permanece possível.
  - marker: c
    text: Literalmente, «do comum» ou «com recursos comuns»; pode referir-se aos recursos partilhados pela comunidade cristã.
    reason: A expressão grega não especifica diretamente uma instituição ou fonte de financiamento.
  - marker: d
    text: «Desejo» pode significar desejo desordenado ou cobiça; não precisa referir-se especificamente ao desejo sexual.
    reason: Preserva a amplitude semântica de ἐπιθυμία e evita uma leitura sexual indevidamente estreita.
lexical_decisions:
- source_word: widows
  choice: viúvas
  rationale: Preserva diretamente a categoria social e eclesial indicada pelo testemunho.
- source_word: protector
  choice: protetor
  rationale: Mantém a imagem de cuidado e responsabilidade sem especificar uma função técnica não demonstrada pelo material fornecido.
- source_word: meetings
  choice: reuniões
  rationale: Termo amplo e natural, que não decide se eram assembleias litúrgicas, administrativas ou ambas.
- source_word: slaves, whether men or women
  choice: os escravizados, sejam homens ou mulheres
  rationale: Usa linguagem portuguesa atual que expressa a condição imposta, preservando a referência explícita a ambos os sexos.
- source_word: better freedom
  choice: uma liberdade melhor
  rationale: Conserva a comparação aberta do testemunho, sem identificar de modo exclusivo essa liberdade como espiritual, escatológica ou social.
- source_word: lust
  choice: desejo
  rationale: Evita restringir indevidamente o termo à sexualidade; o contexto pode envolver cobiça ou desejo desordenado pela emancipação.
theological_decisions:
- issue: Relação entre o líder e Deus na expressão “After the Lord”
  choice: “Depois do Senhor, seja você o protetor delas”
  alternative: “Como representante do Senhor, seja o protetor delas”
  rationale: A formulação escolhida preserva a ordem ou subordinação expressa no testemunho e não introduz uma ideia representativa que ele não explicita.
- issue: Consentimento de Deus
  choice: “sem o consentimento de Deus”
  alternative: “sem Deus” ou “sem a vontade de Deus”
  rationale: Mantém o paralelismo com o consentimento do destinatário e evita harmonizar a expressão com terminologia teológica mais comum.
- issue: Natureza da “liberdade melhor”
  choice: Mantida sem explicação no texto
  alternative: “a verdadeira liberdade espiritual”
  rationale: O testemunho deixa em tensão a liberdade social e a liberdade concedida por Deus; a tradução não deve resolver essa ambiguidade.
- issue: Emancipação às custas da comunidade
  choice: “às custas da comunidade”
  alternative: “com recursos da igreja” ou “a expensas públicas”
  rationale: “Comunidade” comunica a provável dimensão coletiva sem afirmar que se trata de fundos civis ou de uma estrutura eclesiástica formal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento no singular porque a exortação é dirigida a Policarpo. A redação evita arcaísmos, mantém o tom pastoral e imperativo e assinala em notas as ambiguidades que dependem de futura revisão direta do grego da recensão média.
