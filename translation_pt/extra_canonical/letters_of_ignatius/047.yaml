revisions:
- from: 'Não digo isso porque tenha tomado conhecimento de alguma coisa assim entre vocês; antes, por serem meus amados, desde já me mantenho vigilante por vocês, pois prevejo as armadilhas do diabo. Portanto, armem-se de mansidão e renovem-se na fé, que é a carne do Senhor, e no amor, que é o sangue de Jesus Cristo.


    Nenhum de vocês guarde ressentimento contra o próximo. Não deem aos gentios motivo de acusação, para que, por causa de uns poucos insensatos, a multidão que vive segundo Deus não seja difamada. Pois está escrito: “Ai daquele por meio de quem o meu nome é blasfemado inutilmente diante de alguns.”[a]'
  to: 'Não que eu tenha sabido de algo assim entre vocês; mas, como meus amados, vigio por vocês desde já, pois prevejo as armadilhas do diabo. Portanto, armem-se de mansidão e recuperem-se na fé, que é a carne do Senhor, e no amor, que é o sangue de Jesus Cristo.


    Nenhum de vocês guarde ressentimento contra o próximo. Não deem ocasião aos gentios, para que, por causa de uns poucos insensatos, a multidão de Deus não seja blasfemada. Pois: “Ai daquele por meio de quem o meu nome é blasfemado em vão entre alguns.”[a]'
  rationale: A revisão aproxima a tradução das construções e do vocabulário da recensão grega média, remove acréscimos interpretativos e preserva tanto a densidade metafórica quanto a ambiguidade da alusão final. A pontuação da citação foi simplificada sem alterar sua voz em primeira pessoa.
