base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/047.yaml
  text: 'It is not indeed that I have known of any such thing among you, but I keep watch over you betimes, as my beloved, for I foresee the snares of the devil. Do ye therefore arm yourselves with gentleness and recover yourselves in faith, which is the flesh of the Lord, and in love, which is the blood of Jesus Christ.


    Let none of you bear a grudge against his neighbor. Give no occasion to the Gentiles, lest by reason of a few foolish men the godly multitude be blasphemed: for, “Woe unto him through whom My name is vainly blasphemed before some.”'
translation:
  language: pt
  text: 'Não que eu tenha sabido de algo assim entre vocês; mas, como meus amados, vigio por vocês desde já, pois prevejo as armadilhas do diabo. Portanto, armem-se de mansidão e recuperem-se na fé, que é a carne do Senhor, e no amor, que é o sangue de Jesus Cristo.


    Nenhum de vocês guarde ressentimento contra o próximo. Não deem ocasião aos gentios, para que, por causa de uns poucos insensatos, a multidão de Deus não seja blasfemada. Pois: “Ai daquele por meio de quem o meu nome é blasfemado em vão entre alguns.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A formulação ecoa Isaías 52:5 na Septuaginta, com adaptação. «Entre alguns» traduz a expressão grega parà tisin e não identifica quem são esses «alguns».
    reason: Esclarece a provável alusão bíblica e a referência deliberadamente não especificada da expressão final, sem impor uma identificação interpretativa.
lexical_decisions:
- source_word: keep watch over you betimes
  choice: desde já me mantenho vigilante por vocês
  rationale: Preserva a ideia de cuidado preventivo e antecipado, em linguagem portuguesa natural.
- source_word: arm yourselves with gentleness
  choice: armem-se de mansidão
  rationale: Mantém a metáfora militar deliberada e verte a virtude por um termo bíblico corrente e digno.
- source_word: recover yourselves
  choice: renovem-se
  rationale: Expressa recuperação ou restauração interior sem sugerir apenas cura física; a formulação permanece provisória até revisão direta do grego.
- source_word: faith which is the flesh of the Lord
  choice: fé, que é a carne do Senhor
  rationale: Conserva a identificação metafórica forte e sua tensão teológica, sem explicá-la ou enfraquecê-la.
- source_word: love which is the blood of Jesus Christ
  choice: amor, que é o sangue de Jesus Cristo
  rationale: Preserva o paralelismo sacramental ou metafórico do testemunho sem impor uma interpretação denominacional.
- source_word: bear a grudge
  choice: guarde ressentimento
  rationale: Equivalente moderno e claro para alimentar hostilidade persistente contra outra pessoa.
- source_word: Gentiles
  choice: gentios
  rationale: Mantém o termo histórico cristão para os de fora, evitando reduzir necessariamente a referência a uma etnia específica.
- source_word: godly multitude
  choice: multidão que vive segundo Deus
  rationale: Evita o sentido moderno potencialmente ambíguo de “multidão piedosa” e comunica orientação de vida conforme Deus.
theological_decisions:
- issue: Relação entre fé/carne e amor/sangue
  choice: Manter as afirmações identificadoras literalmente metafóricas
  alternative: Explicitar uma referência eucarística ou tratar carne e sangue apenas como comparações
  rationale: O texto sustenta uma formulação densa e possivelmente sacramental, mas não autoriza que a tradução fixe uma única interpretação.
- issue: Voz da citação final
  choice: Conservar a primeira pessoa em “meu nome”
  alternative: Normalizar para uma citação bíblica conhecida ou identificar explicitamente o falante como Deus
  rationale: Preserva a forma transmitida pelo testemunho e sua possível alusão composta sem resolver sua origem ou voz.
- issue: Sentido de “godly”
  choice: “que vive segundo Deus”
  alternative: “piedosa” ou “de Deus”
  rationale: Representa a qualidade ética-religiosa sem afirmar posse institucional nem recorrer a uma expressão menos corrente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Tradução provisória baseada no testemunho inglês de domínio público fornecido; a tradição manuscrita grega da recensão média ainda requer exame direto. Mantiveram-se as metáforas e ambiguidades teológicas centrais.
