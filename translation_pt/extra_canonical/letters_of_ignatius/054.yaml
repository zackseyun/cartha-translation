revisions:
- from: 'Já que, em resposta à minha oração a Deus, foi-me concedido ver os rostos de vocês, dignos de Deus, recebi até mais do que pedi. Pois, acorrentado em Cristo Jesus, espero saudá-los, se for da vontade de Deus que eu seja considerado digno de chegar até o fim.


    De fato, o começo está bem encaminhado, contanto que eu alcance a meta e receba minha herança sem impedimento. Temo justamente o amor de vocês, para que ele não venha a me prejudicar. Pois é fácil para vocês fazerem o que desejam; para mim, porém, é difícil chegar a Deus, a menos que vocês me poupem.'
  to: 'Como, em resposta às minhas orações a Deus, me foi concedido contemplar seus rostos piedosos, obtive ainda mais do que pedi. Pois, estando acorrentado em Cristo Jesus, espero saudá-los, se for da vontade de Deus que eu seja considerado digno de chegar ao fim.


    Pois o começo está, de fato, em boa ordem, desde que eu alcance a meta, para receber sem impedimento a herança que me cabe. Temo o próprio amor de vocês, para que ele não me prejudique. Pois é fácil para vocês fazerem o que desejam; para mim, porém, é difícil chegar a Deus, a menos que vocês me poupem.'
  rationale: A revisão corrige detalhes confirmados pelo grego e substitui duas formulações portuguesas menos naturais, sem explicar no corpo do texto o possível martírio, a natureza da herança ou a maneira pela qual os romanos poderiam «poupá-lo». Assim, preserva-se a tensão retórica e escatológica do original e a auditabilidade em relação ao testemunho inglês público.
