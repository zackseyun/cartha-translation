base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/054.yaml
  text: 'Because, in answer to my prayer to God, I have been granted the privilege of seeing your godly faces, I have received even more than I asked for. For while wearing chains in Christ Jesus, I hope to greet you, if it is the divine will that I should be counted worthy to reach the end.


    For the beginning is indeed well ordered, provided that I reach the goal and receive my inheritance without hindrance. I fear your very love, in case it should harm me. For it is easy for you to do what you want, but it is difficult for me to reach God unless you spare me.'
translation:
  language: pt
  text: 'Como, em resposta às minhas orações a Deus, me foi concedido contemplar seus rostos piedosos, obtive ainda mais do que pedi. Pois, estando acorrentado em Cristo Jesus, espero saudá-los, se for da vontade de Deus que eu seja considerado digno de chegar ao fim.


    Pois o começo está, de fato, em boa ordem, desde que eu alcance a meta, para receber sem impedimento a herança que me cabe. Temo o próprio amor de vocês, para que ele não me prejudique. Pois é fácil para vocês fazerem o que desejam; para mim, porém, é difícil chegar a Deus, a menos que vocês me poupem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly countenances
  choice: rostos de vocês, dignos de Deus
  rationale: Preserva a referência visível aos rostos e expressa a qualificação religiosa de modo digno e compreensível, sem a possível conotação meramente devocional de “rostos piedosos”.
- source_word: wearing bonds in Christ Jesus
  choice: acorrentado em Cristo Jesus
  rationale: Mantém tanto a realidade da prisão quanto a associação cristológica das correntes, em formulação natural e concisa.
- source_word: reach unto the end
  choice: chegar até o fim
  rationale: Conserva a abertura da expressão, que pode abranger a conclusão da viagem, o martírio e a perseverança final, sem explicitar apenas uma dessas possibilidades.
- source_word: goal
  choice: meta
  rationale: Retém a imagem de percurso iniciada por “começo” e concluída no alvo, em português corrente.
- source_word: attain unto God
  choice: chegar a Deus
  rationale: Reproduz a formulação teologicamente intensa sem substituí-la por uma interpretação como “morrer” ou “ser martirizado”.
- source_word: unless ye shall spare me
  choice: a menos que vocês me poupem
  rationale: Mantém a formulação paradoxal e a ambiguidade do testemunho disponível; no contexto, o pedido parece ser que os destinatários não impeçam seu caminho, mas isso não é inserido diretamente no texto.
theological_decisions:
- issue: Sentido de “chegar até o fim”
  choice: Manter a expressão aberta
  alternative: Traduzir explicitamente como “chegar ao martírio”
  rationale: O contexto de prisão e possível martírio orienta a leitura, mas a expressão também comunica perseverança e conclusão; explicitar somente o martírio eliminaria essa tensão.
- issue: Sentido de “chegar a Deus”
  choice: Preservar a linguagem direta de aproximação a Deus
  alternative: Parafrasear como “morrer e estar com Deus”
  rationale: A paráfrase imporia uma explicação escatológica específica e reduziria a força própria da formulação de Inácio.
- issue: O amor dos romanos como possível prejuízo
  choice: Conservar o paradoxo sem explicar no corpo do texto
  alternative: Acrescentar que o amor poderia levá-los a intervir contra sua condenação
  rationale: O contexto sugere essa intervenção, mas a redação recebida deixa o mecanismo implícito; a tradução não deve resolver silenciosamente o que o texto mantém tenso.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento por “vocês” para leitura brasileira natural. Evitaram-se arcaísmos e explicações intrusivas. Como o material fornecido informa que a revisão direta do grego da recensão média ainda está pendente, esta redação é provisória e se apoia no testemunho inglês público auditado, preservando suas ambiguidades relevantes.
