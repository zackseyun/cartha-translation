review_pass:
  verdict: revise
  source_fidelity: Revisão à luz da formulação grega tradicionalmente atestada para IgnEph. 7 (γεννητὸς καὶ ἀγέννητος; ἐν ἀνθρώπῳ θεός; καὶ ἐκ Μαρίας καὶ ἐκ θεοῦ; πρῶτον παθητὸς καὶ τότε ἀπαθής). O rascunho preserva bem os paradoxos centrais, mas “Filho de Maria e Filho de Deus” segue o testemunho inglês fornecido e não reflete com precisão o grego, que diz “de Maria e de Deus”.
  naturalness: O português é claro e de registro apropriado. “Por maligna astúcia” é mais idiomático do que “com maliciosa astúcia”, e “Deus em um ser humano” mantém a estranheza concisa do original sem o possível sentido genérico de “Deus em ser humano”.
  terminology: Mantêm-se “o Nome”, “médico”, “gerado e não gerado” e “sujeito ao sofrimento / não sujeito ao sofrimento”. As notas explicam os pares paradoxais sem os resolver doutrinariamente. A nota sobre “Deus em um ser humano” passa a identificar corretamente a construção grega.
  issues:
  - severity: high
    issue: “Filho de Maria e Filho de Deus”
    rationale: A expressão do grego médio-recensional é καὶ ἐκ Μαρίας καὶ ἐκ θεοῦ, literalmente “tanto de Maria como de Deus”, não uma repetição de “Filho de”. Embora o inglês-base tenha “Son of Mary and Son of God”, a fidelidade à fonte original requer preservar a formulação preposicional.
  - severity: low
    issue: “com maliciosa astúcia”
    rationale: A locução é compreensível, mas “por maligna astúcia” soa mais natural e concisa em português, sem mudar o sentido.
  - severity: low
    issue: Nota b atribuída ao “testemunho usado”
    rationale: A construção incomum é confirmada pelo grego ἐν ἀνθρώπῳ θεός; a nota pode descrevê-la diretamente, sem apresentar como mera limitação do testemunho inglês.
  revised_text: 'Pois alguns costumam, por maligna astúcia, mercadejar o Nome, enquanto praticam outras coisas indignas de Deus. Vocês devem evitar essas pessoas como feras, pois são cães raivosos que mordem às escondidas. Fiquem atentos a elas, porque são difíceis de curar.


    Há um só médico, de carne e de espírito, gerado e não gerado[a], Deus em um ser humano[b], verdadeira Vida na morte, tanto de Maria como de Deus, primeiro sujeito ao sofrimento e depois não sujeito ao sofrimento[c]: Jesus Cristo, nosso Senhor.'
  revised_footnotes:
  - marker: a
    text: “Gerado e não gerado” reproduz uma expressão cristológica condensada e paradoxal. Pode distinguir o nascimento humano de Cristo de sua existência divina sem origem criada.
    reason: A formulação é teologicamente densa e pode soar contraditória sem esclarecimento, mas não deve ser harmonizada no corpo do texto.
  - marker: b
    text: 'Literalmente, “Deus em um ser humano” (grego: ἐν ἀνθρώπῳ θεός). A construção é propositalmente compacta e incomum.'
    reason: Registra a construção do original sem convertê-la em fórmula teológica posterior.
  - marker: c
    text: Isto é, primeiro sujeito a padecer e depois além do sofrimento. A formulação tradicional também pode ser vertida por “primeiro passível e depois impassível”.
    reason: Esclarece o sentido dos termos teológicos sem impor uma interpretação denominacional.
  revision_rationale: 'A revisão corrige a principal divergência entre o rascunho e o grego: “tanto de Maria como de Deus” corresponde à dupla expressão ἐκ ... καὶ ἐκ ..., enquanto “Filho de Maria e Filho de Deus” é uma expansão do testemunho inglês. Foram conservados os contrastes e a ordem da frase, bem como a ambiguidade cristológica. Ajustes menores aumentam a naturalidade e tornam a nota textual mais precisa.'
