base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/008.yaml
  text: 'For some are accustomed, with malicious deceit, to peddle the Name while doing other things unworthy of God. You should avoid these people as wild beasts, for they are mad dogs that bite in secret. Be on your guard against them, for they are difficult to heal.


    There is only one physician, of flesh and of spirit, generated and ungenerated, God in man, true Life in death, Son of Mary and Son of God, first able to suffer and then unable to suffer: Jesus Christ our Lord.'
translation:
  language: pt
  text: 'Pois alguns costumam, com maliciosa astúcia, mercadejar o Nome, ao mesmo tempo que praticam outras coisas indignas de Deus. Vocês devem evitar essas pessoas como feras, pois são cães raivosos que mordem às escondidas. Fiquem atentos a elas, porque são difíceis de curar.


    Há um só médico, de carne e de espírito, gerado e não gerado[a], Deus em ser humano[b], verdadeira Vida na morte, Filho de Maria e Filho de Deus, primeiro sujeito ao sofrimento e depois não sujeito ao sofrimento[c]: Jesus Cristo, nosso Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Gerado e não gerado” reproduz uma expressão cristológica condensada e paradoxal; pode distinguir o nascimento humano de Cristo de sua existência divina sem origem criada.
    reason: A formulação é teologicamente densa e pode soar contraditória sem esclarecimento, mas não deve ser harmonizada no corpo do texto.
  - marker: b
    text: Literalmente, conforme o testemunho usado para esta versão, “Deus em homem”; a expressão grega ainda requer revisão direta.
    reason: Registra a construção incomum e a limitação da base documental fornecida.
  - marker: c
    text: Isto é, primeiro sujeito a padecer e depois além do sofrimento. A formulação tradicional também pode ser vertida por “primeiro passível e depois impassível”.
    reason: Esclarece o sentido dos termos teológicos sem impor uma interpretação denominacional.
lexical_decisions:
- source_word: hawk about / peddle
  choice: mercadejar
  rationale: Conserva a imagem pejorativa de explorar ou negociar o Nome, em linguagem digna e compreensível.
- source_word: the Name
  choice: o Nome
  rationale: Mantém a expressão reverente e deliberadamente não explicitada do testemunho, provavelmente referente ao nome cristão ou a Cristo.
- source_word: physician
  choice: médico
  rationale: É a correspondência direta e natural em português, preservando a metáfora de cura.
- source_word: of flesh and of spirit
  choice: de carne e de espírito
  rationale: Mantém o paralelismo compacto e a tensão cristológica do texto.
- source_word: passible / impassible
  choice: sujeito ao sofrimento / não sujeito ao sofrimento
  rationale: Expressa com clareza atual a capacidade de padecer, sem usar os termos técnicos pouco transparentes “passível/impassível”.
theological_decisions:
- issue: generated and ungenerated
  choice: gerado e não gerado
  alternative: nascido e não originado
  rationale: Preserva a formulação paradoxal do testemunho e evita resolver antecipadamente se os termos apontam, respectivamente, para a humanidade e a divindade de Cristo.
- issue: God in man
  choice: Deus em ser humano
  alternative: Deus no homem
  rationale: Mantém a construção relacional do testemunho sem transformá-la em uma fórmula posterior como “Deus-homem”; “ser humano” evita que “homem” seja entendido apenas como sexo masculino.
- issue: first passible and then impassible
  choice: primeiro sujeito ao sofrimento e depois não sujeito ao sofrimento
  alternative: primeiro capaz de sofrer e depois incapaz de sofrer
  rationale: Preserva a sequência e a tensão do texto, sem especificar além do testemunho a relação com a morte, ressurreição ou naturezas de Cristo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas brasileiras naturais (“vocês”, “fiquem”). A tradução é necessariamente provisória porque o material fornecido contém apenas um testemunho inglês de domínio público e informa que a revisão direta do grego está pendente. Preservaram-se os paralelos breves, os paradoxos cristológicos e a ambiguidade de “o Nome”.
