base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/032.yaml
  text: 'If, then, those who had lived according to ancient practices came to a new hope, no longer observing Sabbaths but shaping their lives according to the Lord’s day—on which our life also arose through him and through his death, which some deny—a mystery through which we came to believe, and for this reason we patiently endure, so that we may be found to be disciples of Jesus Christ, our only teacher—


    if this is so, how will we be able to live apart from him? For even the prophets, as his disciples, were awaiting him as their teacher through the Spirit. And for this reason, he whom they rightly awaited, when he one, raised them from the dead.'
translation:
  language: pt
  text: 'Se, portanto, aqueles que viviam segundo práticas antigas chegaram à novidade da esperança, já não observando os sábados, mas vivendo segundo o dia do Senhor[a] — dia em que também a nossa vida despontou por meio dele e da sua morte, que alguns negam —, mistério pelo qual chegamos a crer; e se, por essa razão, perseveramos com paciência, para sermos reconhecidos como discípulos de Jesus Cristo, nosso único mestre,


    como poderemos viver separados dele? Pois até os profetas, sendo discípulos dele, o aguardavam pelo Espírito como seu mestre. E, por essa razão, aquele a quem justamente esperavam, quando veio, os ressuscitou dentre os mortos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A expressão grega é elíptica: traz o adjetivo “do Senhor” sem declarar o substantivo. “Dia do Senhor” é a leitura tradicional e contextual; também se discute se a ênfase recai, de modo mais amplo, em viver segundo o Senhor.'
    reason: Registrar uma ambiguidade lexical genuína sem tornar o corpo do texto artificial.
  - marker: b
    text: O testemunho inglês fornecido traz aqui a expressão sem sentido “when he one”. A redação grega corresponde à ideia de que aquele que era esperado veio ou se fez presente e ressuscitou os profetas dentre os mortos.
    reason: Explicar a correção de uma corrupção evidente do testemunho inglês à luz da redação grega conhecida.
lexical_decisions:
- source_word: ἀναστραφέντες / “had walked”
  choice: viviam
  rationale: Expressa naturalmente a ideia de conduzir a vida ou comportar-se, sem reproduzir literalmente a metáfora de caminhar.
- source_word: καινότης ἐλπίδος / “newness of hope”
  choice: novidade da esperança
  rationale: Mantém a formulação conceitual e seu caráter enfático, sem reduzi-la simplesmente a “nova esperança”.
- source_word: σαββατίζοντες / “observing Sabbaths”
  choice: observando os sábados
  rationale: Preserva a referência à prática sabática, sem acrescentar avaliação teológica além do texto.
- source_word: κατὰ κυριακὴν ζῶντες / “fashioning their lives after the Lord’s day”
  choice: vivendo segundo o dia do Senhor
  rationale: Mantém tanto a ideia de uma vida orientada por algo quanto a leitura tradicional de κυριακή como referência ao dia do Senhor; a elipse do substantivo é indicada em nota.
- source_word: ἀνέτειλεν / “arose”
  choice: despontou
  rationale: Conserva a imagem de nascer ou surgir como a luz, aplicada aqui à vida.
- source_word: ἐλάβομεν τὸ πιστεύειν / “we attained unto belief”
  choice: chegamos a crer
  rationale: Forma portuguesa natural que preserva o sentido ingressivo de vir à fé, sem transformar a expressão em posse abstrata.
- source_word: παρὼν / wording corrupted in the supplied witness as “when He one”
  choice: quando veio
  rationale: O sentido contextual é o da chegada ou presença daquele que era aguardado; evita perpetuar a corrupção evidente do testemunho inglês.
- source_word: ἤγειρεν αὐτοὺς ἐκ νεκρῶν / “raised them from the dead”
  choice: os ressuscitou dentre os mortos
  rationale: Reproduz diretamente a linguagem de ressurreição e conserva o objeto plural, os profetas.
theological_decisions:
- issue: Relação entre o sábado e o dia do Senhor
  choice: Traduzir o contraste sem explicar se ele implica substituição litúrgica, mudança de calendário ou modo cristológico de viver.
  alternative: Explicitar que os cristãos deixaram de guardar o sábado e passaram a celebrar o domingo.
  rationale: O texto contrasta duas práticas, mas uma explicação denominacional iria além do que a frase afirma.
- issue: “Por meio dele e da sua morte”
  choice: Manter os dois elementos coordenados como meios pelos quais a vida despontou.
  alternative: Reformular para fazer a vida surgir somente pela ressurreição de Cristo.
  rationale: A construção recebida associa explicitamente Cristo e sua morte ao surgimento da vida; a tensão deve permanecer.
- issue: Os profetas como discípulos de Cristo
  choice: Preservar a afirmação de que os profetas eram discípulos dele e o aguardavam pelo Espírito.
  alternative: Abrandar para dizer apenas que os profetas predisseram Cristo.
  rationale: A formulação mais forte pertence ao argumento cristológico de Inácio e não deve ser reduzida.
- issue: Cristo ressuscitando os profetas
  choice: Manter literalmente “os ressuscitou dentre os mortos”.
  alternative: Interpretar figuradamente como “confirmou suas palavras” ou “os despertou espiritualmente”.
  rationale: O texto emprega linguagem explícita de levantar dentre os mortos; resolver seu sentido como metáfora eliminaria uma possível afirmação teológica real.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com preferência por construções naturais no Brasil sem regionalismos marcados. O período longo e argumentativo de Inácio foi preservado, mas recebeu pontuação que torna sua progressão inteligível. A redação foi confrontada com a formulação grega tradicionalmente atestada para esta passagem; ainda assim, convém realizar a revisão crítica direta anunciada nos metadados antes da publicação definitiva.
