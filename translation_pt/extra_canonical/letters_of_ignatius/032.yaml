review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente o argumento central e os termos relevantes (práticas antigas, sábados, dia do Senhor, profetas como discípulos e ressurreição). Contudo, a oração relativa ao mistério foi alterada de modo indevido: o texto liga tanto o chegar à fé quanto o perseverar paciente ao mistério, sem introduzir uma nova condição. Além disso, o particípio παρών exprime presença, não necessariamente a vinda como evento pontual.'
  naturalness: O português é em geral claro, digno e atual. A reestruturação da oração do mistério melhora a progressão lógica e elimina o ponto e vírgula seguido de uma condicional artificial. “Ao se fazer presente” é natural e conserva melhor a força aspectual de “estando presente”.
  terminology: “Dia do Senhor”, “sábados”, “Espírito”, “discípulos”, “mestre” e “ressuscitou dentre os mortos” são escolhas apropriadas. A nota sobre a elipse em κυριακήν é útil, desde que não apresente a leitura tradicional como certeza gramatical absoluta.
  issues:
  - severity: high
    issue: Foi introduzida uma condição em “e se, por essa razão, perseveramos com paciência”.
    rationale: A construção correspondente liga “por meio do qual chegamos a crer” e “pelo qual perseveramos” ao antecedente “mistério”; não condiciona o perseverar. A alteração prejudica a sintaxe e o encadeamento argumentativo da passagem.
  - severity: medium
    issue: “Quando veio” restringe o sentido de παρών.
    rationale: O particípio significa literalmente “estando presente” ou “tendo-se feito presente”. “Quando veio” é possível como explicitação contextual, mas introduz mais claramente um acontecimento de chegada do que o texto exige.
  - severity: low
    issue: “Para sermos reconhecidos” interpreta εὑρεθῶμεν de modo mais específico que o necessário.
    rationale: “Para que sejamos encontrados como discípulos” conserva a metáfora forense/avaliativa sem especificar quem reconhece os discípulos.
  revised_text: 'Se, portanto, aqueles que viviam segundo práticas antigas chegaram à novidade da esperança, já não observando os sábados, mas vivendo segundo o dia do Senhor[a] — dia em que também a nossa vida despontou por meio dele e de sua morte, que alguns negam —, mistério por meio do qual chegamos a crer e pelo qual perseveramos pacientemente, para que sejamos encontrados como discípulos de Jesus Cristo, nosso único mestre,



    como poderemos viver separados dele? Pois até os profetas, sendo discípulos dele, o aguardavam pelo Espírito como seu mestre. E, por essa razão, aquele a quem justamente esperavam, ao se fazer presente, os ressuscitou dentre os mortos.[b]'
  revised_footnotes:
  - marker: a
    text: 'A expressão grega é elíptica: traz o adjetivo “do Senhor” sem declarar um substantivo. “Dia do Senhor” é a leitura tradicional e contextual; também se discute se a ênfase recai, de modo mais amplo, em viver segundo o Senhor.'
    reason: Registrar a ambiguidade lexical e sintática sem tornar artificial o texto principal.
  - marker: b
    text: O testemunho inglês fornecido traz aqui a expressão sem sentido “when he one”. A redação grega conhecida tem o particípio “estando presente” ou “tendo-se feito presente”; por isso, o texto traduz “ao se fazer presente”.
    reason: Explicar a correção da corrupção do testemunho inglês e a opção que conserva a força do particípio grego.
  revision_rationale: 'A revisão restabelece o paralelismo: o mistério é o meio pelo qual os destinatários chegaram à fé e o motivo pelo qual perseveram. Também substitui uma formulação de chegada pontual por uma que representa mais precisamente o particípio grego relativo à presença daquele que os profetas aguardavam. As demais escolhas centrais são mantidas, inclusive o contraste entre sábados e o dia do Senhor, sem impor interpretação confessional.'
