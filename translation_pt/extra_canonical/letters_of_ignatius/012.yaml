  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/012.yaml
  text: 'These are the last times. Henceforth let us have reverence; let us fear the long-suffering of God, lest it turn into a judgment against us. For either let us fear the wrath which is to come or let us love the grace which now is—the one or the other; provided only that we be found in Christ Jesus unto true life.


    Let nothing glitter in your eyes apart from him, in whom I carry about my bonds, my spiritual pearls in which I would fain rise again through your prayer, whereof may it be my lot always to be a partaker, that I may be found in the company of those Christians of Ephesus who moreover were ever of one mind with the apostles in the power of Jesus Christ.'
translation:
  language: pt
  text: 'Estes são os últimos tempos. De agora em diante, sejamos reverentes; temamos a paciência de Deus, para que ela não se transforme em condenação contra nós. Pois, de duas uma: ou temamos a ira que está por vir, ou amemos a graça que agora está presente, contanto apenas que sejamos encontrados em Cristo Jesus para a vida verdadeira.


    Que nada brilhe diante dos olhos de vocês além dele. Nele carrego por toda parte minhas correntes, minhas pérolas espirituais, com as quais desejo ressuscitar mediante a oração de vocês. Que me seja concedido participar sempre dela, para que eu seja encontrado na companhia daqueles cristãos de Éfeso que, além disso, sempre estiveram em plena concordância com os apóstolos, no poder de Jesus Cristo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Esta tradução é provisória e se baseia no testemunho inglês de domínio público de J. B. Lightfoot. A revisão direta da tradição manuscrita grega da recensão média ainda está pendente; por isso, construções como “condenação contra nós”, “com as quais desejo ressuscitar” e “participar sempre dela” devem ser conferidas no grego.
    reason: O material fornecido declara que a revisão na língua original ainda está pendente; a nota torna transparente a base indireta e identifica os pontos sintaticamente mais incertos.
lexical_decisions:
- source_word: last times
  choice: últimos tempos
  rationale: Preserva a formulação escatológica tradicional e a tensão do testemunho sem explicá-la além do que o texto diz.
- source_word: long-suffering of God
  choice: paciência de Deus
  rationale: Expressa em português atual a ideia de tolerância prolongada, sem sugerir passividade ou sofrimento físico.
- source_word: judgment against us
  choice: condenação contra nós
  rationale: O contexto contrapõe a paciência divina à ira futura; 'condenação' comunica a força judicial da expressão inglesa, embora dependa de revisão do grego.
- source_word: glitter in your eyes
  choice: brilhe diante dos olhos de vocês
  rationale: Mantém a imagem visual e o sentido de algo que atrai ou fascina, evitando uma paráfrase excessiva.
- source_word: bonds
  choice: correntes
  rationale: Torna concreta a referência à prisão de Inácio e harmoniza-se com a metáfora subsequente das pérolas.
- source_word: spiritual pearls
  choice: pérolas espirituais
  rationale: Preserva literalmente a metáfora positiva aplicada às correntes.
- source_word: of one mind
  choice: em plena concordância
  rationale: Comunica unidade de pensamento e propósito em português natural, sem exigir identidade absoluta de opinião.
theological_decisions:
- issue: Relação entre temor da ira e amor à graça
  choice: 'Preservar a alternativa retórica: ''ou temamos... ou amemos...'''
  alternative: Fundir as duas atitudes como simultâneas ou apresentar uma delas como superior
  rationale: O testemunho fornecido formula explicitamente 'uma ou outra'; a tradução não resolve a tensão teológica.
- issue: Sentido de ser encontrado em Cristo para a vida verdadeira
  choice: Manter 'para a vida verdadeira'
  alternative: Interpretar como condição para obter salvação eterna
  rationale: A formulação conserva a direção/finalidade do texto sem importar uma definição soteriológica denominacional.
- issue: Ressurreição mediante a oração dos efésios
  choice: Traduzir 'desejo ressuscitar mediante a oração de vocês'
  alternative: Suavizar para 'ser fortalecido' ou afirmar que a oração causa meritoriamente a ressurreição
  rationale: Preserva a linguagem ousada do testemunho, sem explicar o mecanismo teológico nem lhe atribuir causalidade meritória.
- issue: Concordância dos cristãos de Éfeso com os apóstolos
  choice: Manter a concordância 'no poder de Jesus Cristo'
  alternative: Converter a frase em reivindicação institucional de sucessão apostólica
  rationale: O texto fala de unidade/concordância e poder; não explicita uma teoria eclesiológica posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega 'vocês' para o plural e evita arcaísmos como 'doravante' e 'quiçá'. A redação procura conservar o paralelismo, as metáforas e a tensão escatológica do testemunho. Como não foi fornecido o texto grego, as decisões são necessariamente provisórias e não alegam constituir revisão direta da fonte antiga.
