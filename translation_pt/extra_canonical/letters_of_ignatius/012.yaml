review_pass:
  verdict: revise
  source_fidelity: 'A redação inicial segue em geral o testemunho inglês, mas diverge em pontos relevantes do grego da recensão média: αἰσχυνθῶμεν pede «envergonhemo-nos», não «sejamos reverentes»; κρίμα é mais bem preservado por «juízo» do que por «condenação»; e κλῆρος não é simplesmente «companhia». A segunda frase também deve conservar explicitamente Jesus Cristo e a imagem verbal mais ampla de «aparecer/apresentar-se», em vez de restringi-la a algo que «brilha diante dos olhos».'
  naturalness: A revisão mantém um registro moderno e digno, com «vocês», paralelismo retórico e imagens inteligíveis. «Que nada se apresente a vocês fora de Jesus Cristo» e «que eu sempre tenha parte nela» soam naturais sem reduzir o sentido.
  terminology: «Paciência de Deus» comunica adequadamente μακροθυμία em português contemporâneo. «Juízo», «graça presente», «vida verdadeira», «correntes» e «pérolas espirituais» preservam os termos e as metáforas sem impor interpretação doutrinária. «Seja contado entre os cristãos de Éfeso» traduz de modo idiomático a pertença/porção expressa por κλῆρος.
  issues:
  - severity: high
    issue: «Sejamos reverentes» para a primeira exortação
    rationale: O grego αἰσχυνθῶμεν significa «envergonhemo-nos»/«tenhamos vergonha». «Reverência» reflete o testemunho inglês fornecido, mas não o sentido mais direto do texto grego.
  - severity: medium
    issue: «Condenação contra nós» para κρίμα
    rationale: κρίμα designa juízo ou julgamento e não exige a noção mais específica e final de «condenação».
  - severity: medium
    issue: «Que nada brilhe diante dos olhos de vocês além dele»
    rationale: O grego não menciona olhos nem limita a imagem a brilho; φανήτω exprime aparecer ou apresentar-se. Além disso, explicitar «Jesus Cristo» evita uma referência pronominal menos nítida.
  - severity: medium
    issue: «Na companhia» para κλῆρος
    rationale: κλῆρος indica lote, parte, porção ou pertença; «ser contado entre» preserva a ideia de inclusão sem transformá-la apenas em convivência.
  revised_text: 'Estes são os últimos tempos. Daqui em diante, envergonhemo-nos; temamos a paciência de Deus, para que ela não se torne juízo contra nós. Pois, uma de duas: ou temamos a ira que há de vir, ou amemos a graça presente; uma coisa ou outra, contanto apenas que sejamos encontrados em Cristo Jesus para a vida verdadeira.


    Que nada se apresente a vocês fora de Jesus Cristo, em quem levo comigo as minhas correntes, minhas pérolas espirituais, nas quais desejo ressuscitar por meio da oração de vocês. Que eu sempre tenha parte nela, para que eu seja contado entre os cristãos de Éfeso, que também sempre concordaram com os apóstolos na força de Jesus Cristo.[a]'
  revised_footnotes:
  - marker: a
    text: A tradução foi revista em confronto com o texto grego da recensão média e com o testemunho inglês de J. B. Lightfoot. «Envergonhemo-nos» traduz o grego comumente transmitido aqui; o testemunho inglês fornecido traz «let us have reverence». «Que nada se apresente» conserva o verbo grego «aparecer/apresentar-se», e «seja contado entre» procura expressar a ideia de parte ou pertença em «os cristãos de Éfeso». A verificação direta de variantes manuscritas permanece pendente.
    reason: A nota, ancorada no fim do parágrafo, documenta de forma transparente as diferenças relevantes entre a ponte inglesa e a leitura grega adotada, sem alegar que questões de crítica textual manuscrita já foram encerradas.
  revision_rationale: A revisão prioriza o texto grego indicado como tradição de origem, corrigindo os principais desvios introduzidos pela tradução inglesa de apoio. Conserva a alternativa retórica entre temor da ira futura e amor à graça presente, a relação entre oração e ressurreição sem explicar seu mecanismo, e a unidade dos efésios com os apóstolos sem inferências eclesiológicas posteriores.
