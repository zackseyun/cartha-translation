base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/071.yaml
  text: 'For even though certain people wanted to deceive me according to the flesh, the spirit is not deceived, since it is from God. For it knows where it comes from and where it is going, and it searches out hidden things. When I was among you, I cried out; I spoke in a loud voice, with God’s own voice: “Pay attention to the bishop, the presbytery, and the deacons.”


    Nevertheless, some suspected that I said this because I knew beforehand about the division of certain people. But He in whom I am bound is my witness that I did not learn it from human flesh. It was the preaching of the Spirit, who spoke in this way: “Do nothing without the bishop. Keep your flesh as a temple of God. Cherish unity. Avoid divisions. Be imitators of Jesus Christ, just as He Himself also was of His Father.”'
translation:
  language: pt
  text: 'Pois, ainda que certas pessoas quisessem me enganar segundo a carne, o espírito não é enganado, porque vem de Deus; pois sabe de onde vem e para onde vai, e investiga as coisas ocultas. Quando eu estava entre vocês, clamei, falando em alta voz, com voz de Deus: “Deem atenção ao bispo, ao presbitério e aos diáconos.”


    No entanto, alguns suspeitavam que eu dizia isso porque sabia de antemão da divisão de certas pessoas. Mas aquele em quem estou acorrentado é minha testemunha de que não o aprendi de carne humana. Foi a proclamação do Espírito, que dizia o seguinte: “Não façam nada sem o bispo. Guardem a sua carne como templo de Deus. Cultivem a união. Evitem as divisões. Sejam imitadores de Jesus Cristo, assim como ele próprio também o foi de seu Pai.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: after/according to the flesh
  choice: segundo a carne
  rationale: Preserva a formulação antropológica antiga e sua possível tensão entre meios humanos e origem espiritual, sem reduzi-la a mero engano físico.
- source_word: spirit / Spirit
  choice: espírito / Espírito
  rationale: A primeira ocorrência permanece em minúscula porque o referente admite alguma ambiguidade no testemunho fornecido; na proclamação posterior, a agência divina é suficientemente explícita para usar maiúscula.
- source_word: presbytery
  choice: presbitério
  rationale: Designa aqui o corpo coletivo dos presbíteros, em paralelo com o bispo e os diáconos, e não apenas um espaço físico.
- source_word: cherish union
  choice: cultivem a união
  rationale: Expressa cuidado ativo e contínuo pela unidade comunitária em português natural, mantendo o substantivo 'união' do testemunho.
- source_word: in whom I am bound
  choice: em quem estou acorrentado
  rationale: Mantém a imagem concreta das cadeias de Inácio e a relação cristológica implícita, sem substituir o referente por uma explicação interpretativa.
theological_decisions:
- issue: Identidade do 'espírito' na primeira frase
  choice: Manter 'espírito' em minúscula
  alternative: Traduzir 'Espírito' como referência inequívoca ao Espírito Santo
  rationale: O testemunho afirma que o espírito vem de Deus, mas a forma fornecida não elimina totalmente a possibilidade de referência ao espírito humano dado por Deus; a tradução preserva essa ambiguidade.
- issue: Autoridade da voz proclamada
  choice: “com a voz do próprio Deus”
  alternative: “como voz de Deus” ou “pela voz de Deus”
  rationale: Segue de perto o testemunho disponível e conserva a afirmação forte, sem explicar o mecanismo de inspiração.
- issue: Relação com o bispo
  choice: “Não façam nada sem o bispo”
  alternative: Acrescentar qualificações como “nada relacionado à igreja”
  rationale: Não se introduz uma limitação ausente no testemunho, nem se amplia a frase por comentário denominacional.
- issue: Imitação de Cristo e do Pai
  choice: “assim como ele também é imitador de seu Pai”
  alternative: “assim como ele também imitou seu Pai”
  rationale: O presente preserva o aspecto do testemunho inglês e evita resolver as implicações cristológicas da linguagem de imitação.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais como “vocês” e “deem”. Esta é uma tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego da recensão média continua pendente. Por isso, foram evitadas notas que alegassem variantes ou detalhes lexicais gregos ainda não verificados.
