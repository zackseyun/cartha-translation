  yaml_path: translation/extra_canonical/letters_of_ignatius/067.yaml
  text: 'Keep away from noxious herbs, which are not the husbandry of Jesus Christ, because they are not the planting of the Father. Not that I have found division among you, but filtering.


    For as many as are of God and of Jesus Christ, they are with the bishop; and as many as shall repent and enter into the unity of the Church, these also shall be of God, that they may be living after Jesus Christ. Be not deceived, my brethren.


    If any man follows one that makes a schism, he does not inherit the kingdom of God. If any man walks in strange doctrine, he has no fellowship with the passion.'
translation:
  language: pt
  text: 'Mantenham-se afastados das ervas nocivas, que Jesus Cristo não cultiva, pois elas não são plantação do Pai. Não digo isso porque tenha encontrado divisão entre vocês, mas, sim, uma filtragem.[a]


    Pois todos os que pertencem a Deus e a Jesus Cristo estão com o bispo; e todos os que se arrependerem e entrarem na unidade da igreja também pertencerão a Deus, para que vivam segundo Jesus Cristo. Não se deixem enganar, meus irmãos.


    Se alguém segue quem provoca um cisma, não herda o reino de Deus. Se alguém anda segundo uma doutrina estranha, não tem comunhão com a paixão de Cristo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Filtragem” traduz literalmente uma imagem incomum, que pode sugerir peneiramento, depuração ou separação. Como a revisão direta do grego ainda está pendente, a metáfora foi preservada sem interpretação adicional.
    reason: Sinaliza uma expressão textual difícil e evita resolver indevidamente seu sentido.
  - marker: b
    text: Isto é, a paixão ou o sofrimento de Cristo. “Ter comunhão” pode envolver participação, união ou solidariedade com esse sofrimento.
    reason: Evita o sentido moderno de paixão como emoção e preserva a amplitude teológica de “comunhão”.
lexical_decisions:
- source_word: κακῶν βοτανῶν (conforme a tradição grega indicada; revisão direta pendente)
  choice: ervas nocivas
  rationale: Preserva a metáfora agrícola e o sentido negativo sem tornar a expressão excessivamente arcaica.
- source_word: γεωργεῖ
  choice: cultiva
  rationale: Expressa naturalmente a ação agrícola atribuída a Jesus Cristo, evitando o substantivo antiquado do testemunho inglês.
- source_word: φυτείαν πατρός
  choice: plantação do Pai
  rationale: Mantém o paralelo agrícola e a relação explícita com o Pai.
- source_word: ἀποδιϋλισμόν (provável leitura subjacente ao inglês “filtering”)
  choice: filtragem
  rationale: Conserva a imagem incomum e a possível tensão entre divisão e depuração, sem decidir silenciosamente que se trata de pureza doutrinária ou discernimento.
- source_word: σχίζοντι / schism (conforme o testemunho fornecido)
  choice: quem provoca um cisma
  rationale: Torna clara a ação de produzir ruptura, preservando o vocabulário eclesial histórico.
- source_word: ἑτεροδοξίᾳ / strange doctrine (conforme o testemunho fornecido)
  choice: doutrina estranha
  rationale: Preserva a alteridade ou incompatibilidade indicada no texto sem importar a acepção denominacional moderna de “heterodoxia”.
- source_word: πάθει
  choice: paixão de Cristo
  rationale: Mantém o termo cristão histórico referente ao sofrimento de Cristo; o complemento explicativo evita que “paixão” seja entendido como mero sentimento.
theological_decisions:
- issue: Relação entre pertencer a Deus e estar com o bispo
  choice: “todos os que pertencem a Deus e a Jesus Cristo estão com o bispo”
  alternative: “todos os que estão com o bispo pertencem a Deus e a Jesus Cristo”
  rationale: 'Preserva a direção lógica do testemunho: os que são de Deus e de Cristo estão com o bispo, sem converter a frase em uma afirmação inversa mais abrangente.'
- issue: Retorno à unidade da igreja mediante arrependimento
  choice: “os que se arrependerem e entrarem na unidade da igreja também pertencerão a Deus”
  alternative: “os que retornarem arrependidos à unidade da igreja”
  rationale: Mantém separadas as duas ações presentes no testemunho e não pressupõe além do texto a situação eclesial anterior dessas pessoas.
- issue: Comunhão com a paixão
  choice: “não tem comunhão com a paixão de Cristo”
  alternative: “não participa do sofrimento de Cristo”
  rationale: Retém a formulação teologicamente densa e sua ambiguidade entre participação, solidariedade e comunhão, identificando apenas o referente cristológico dado pelo contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”, “não se deixem”). As metáforas agrícolas e a expressão incomum “filtragem” foram mantidas. O texto é provisório porque o material fornecido identifica o testemunho inglês de domínio público como base e informa que a revisão direta da tradição grega da recensão média ainda está pendente.
