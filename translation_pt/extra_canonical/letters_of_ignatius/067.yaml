review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto a recensão média grega: preserva as metáforas agrícolas, a oposição entre divisão e διυλισμός, a relação lógica entre os que são de Deus e de Cristo e o bispo, e as advertências finais. Há, porém, uma pequena perda de forma e foco na primeira metáfora: o grego diz que as ervas «não são cultivadas por Jesus Cristo» (voz passiva), não primariamente que ele «não [as] cultiva». A revisão também substitui a nota provisória sobre a falta de revisão grega por uma explicação baseada no termo grego efetivamente atestado.'
  naturalness: O português é moderno, claro e de registro apropriado. «Filtragem» é incomum neste contexto, mas essa estranheza é deliberadamente fiel à imagem difícil; a nota a torna inteligível sem fixar uma interpretação. «Paixão de Cristo» é expressão tradicional, e a nota reduz a possibilidade de leitura emocional moderna.
  terminology: «Ervas nocivas», «plantação do Pai», «bispo», «unidade da igreja», «cisma», «reino de Deus» e «paixão de Cristo» são escolhas adequadas. «Doutrina estranha» conserva a alteridade de ἑτεροδοξία sem usar uma etiqueta confessional posterior. A formulação «não são cultivadas por Jesus Cristo» reproduz melhor o passivo γεωργοῦνται.
  issues:
  - severity: low
    issue: A primeira oração agrícola mudou a voz do original.
    rationale: '«Que Jesus Cristo não cultiva» comunica amplamente o sentido, mas o grego ἅτινες οὐ γεωργοῦνται ὑπὸ Ἰησοῦ Χριστοῦ é passivo: «que não são cultivadas por Jesus Cristo». A forma passiva mantém o foco nas «ervas» e a construção da fonte.'
  - severity: low
    issue: A nota sobre «filtragem» ainda apresenta a revisão do grego como pendente.
    rationale: O termo da recensão média é διυλισμόν. A nota pode descrevê-lo diretamente como imagem de filtragem ou peneiramento, mantendo a incerteza sem depender de uma ressalva metodológica já superada nesta revisão.
  revised_text: 'Mantenham-se afastados das ervas nocivas, que não são cultivadas por Jesus Cristo, pois elas não são plantação do Pai. Não que eu tenha encontrado divisão entre vocês, mas, sim, uma filtragem.[a]


    Pois todos os que pertencem a Deus e a Jesus Cristo estão com o bispo; e todos os que se arrependerem e entrarem na unidade da igreja também pertencerão a Deus, para que vivam segundo Jesus Cristo. Não se deixem enganar, meus irmãos.


    Se alguém segue quem provoca um cisma, não herda o reino de Deus. Se alguém anda segundo uma doutrina estranha, não tem comunhão com a paixão de Cristo.[b]'
  revised_footnotes:
