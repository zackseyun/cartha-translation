review_pass:
  verdict: revise
  source_fidelity: É necessária uma correção segura na primeira metáfora. O grego γεώργημα designa aquilo que é cultivado/uma lavoura, não a ação ativa de Jesus Cristo cultivar; por isso, “que Jesus Cristo não cultiva” altera a relação expressa no texto. A formulação revista preserva o paralelismo entre “lavoura de Jesus Cristo” e “plantação do Pai”. O restante mantém adequadamente a sequência lógica, a imagem difícil de διυλισμός (“filtragem”) e a linguagem sobre cisma, unidade e paixão.
  naturalness: A redação é clara e contemporânea. “Lavoura” é mais natural e semanticamente exata do que uma construção verbal ativa neste contexto, conservando a metáfora agrícola. “Filtragem” permanece deliberadamente incomum, como no testemunho e na expressão grega subjacente, e por isso requer nota.
  terminology: “Bispo”, “unidade da igreja”, “cisma”, “reino de Deus” e “paixão de Cristo” são adequados. “Paixão de Cristo” deve conservar nota para esclarecer o sentido de sofrimento, sem reduzir a amplitude de comunhão/participação indicada pelo testemunho de base.
  issues:
  - severity: medium
    issue: “que Jesus Cristo não cultiva” verte γεώργημα como verbo ativo.
    rationale: 'γεώργημα é um substantivo: “cultivo”, “lavoura” ou “campo cultivado”. O texto afirma que essas ervas não pertencem à lavoura de Jesus Cristo, não que ele simplesmente não as cultive.'
  revised_text: 'Mantenham-se afastados das ervas nocivas, que não são lavoura de Jesus Cristo, pois não são plantação do Pai. Não digo isso porque tenha encontrado divisão entre vocês, mas, sim, filtragem.[a]


    Pois todos os que pertencem a Deus e a Jesus Cristo estão com o bispo; e todos os que se arrependerem e entrarem na unidade da igreja também pertencerão a Deus, para que vivam segundo Jesus Cristo. Não se deixem enganar, meus irmãos.


    Se alguém segue quem provoca um cisma, não herda o reino de Deus. Se alguém anda segundo uma doutrina estranha, não tem comunhão com a paixão de Cristo.[b]'
  revised_footnotes:
  - marker: a
    text: “Filtragem” traduz literalmente uma imagem incomum, que pode sugerir peneiramento, depuração ou separação. Como a revisão direta do grego ainda está pendente, a metáfora foi preservada sem interpretação adicional.
    reason: Sinaliza uma expressão textual difícil e evita resolver indevidamente seu sentido.
  - marker: b
    text: Isto é, a paixão ou o sofrimento de Cristo. “Ter comunhão” pode envolver participação, união ou solidariedade com esse sofrimento.
    reason: Evita o sentido moderno de paixão como emoção e preserva a amplitude teológica de “comunhão”.
  revision_rationale: Substitui-se apenas a construção ativa “Jesus Cristo não cultiva” por “não são lavoura de Jesus Cristo”, a fim de refletir o substantivo agrícola do original e o paralelismo da frase. As notas e os demais elementos são mantidos, pois preservam adequadamente as ambiguidades e o registro do texto.
