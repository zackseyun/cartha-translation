    rationale: O texto-fonte descreve a economia/plano e explicita que ela consiste nesses elementos. Os dois-pontos da redação atual podem fazer deles simples aposição a “Jesus Cristo” ou uma enumeração independente. Convém explicitar “a qual consiste”, sem resolver além do necessário a relação interpretativa dos elementos.
