base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/021.yaml
  text: 'If Jesus Christ should count me worthy through your prayer, and if it should be God’s will, then in the second tract that I intend to write to you, I will further set before you the dispensation of which I have begun to speak, relating to the new man Jesus Christ. This consists in faith toward him and love toward him, in his passion and resurrection,


    especially if the Lord should reveal anything to me. Assemble yourselves together in common, each one of you severally, person by person, in grace, in one faith and one Jesus Christ, who according to the flesh was of David’s race, who is Son of Man and Son of God, so that you may obey the bishop and the presbytery without distraction of mind; breaking one bread, which is the medicine of immortality and the antidote that we should not die but live forever in Jesus Christ.'
translation:
  language: pt
  text: 'Se Jesus Cristo me considerar digno, por meio da oração de vocês, e se essa for a vontade de Deus, no segundo escrito que pretendo lhes dirigir explicarei mais plenamente o plano[a] do qual comecei a falar, referente ao novo homem, Jesus Cristo, o qual consiste na fé nele e no amor por ele, em sua paixão e ressurreição — sobretudo se o Senhor me revelar alguma coisa.


    Reúnam-se todos juntos, cada um de vocês, um por um, na graça, em uma só fé e em um só Jesus Cristo, que, segundo a carne, veio da linhagem de Davi e é Filho do Homem e Filho de Deus. Assim, obedeçam ao bispo e ao presbitério sem a mente dividida, partindo um só pão, que é remédio de imortalidade e antídoto para não morrermos, mas vivermos para sempre em Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “administração”, “ordem estabelecida” ou “dispensação”. O termo pode indicar o plano ou a maneira como Deus conduz e realiza sua obra.'
    reason: Preserva o campo semântico amplo do termo testemunhado por “dispensation”, especialmente porque a revisão direta do grego ainda está pendente.
lexical_decisions:
- source_word: οἰκονομία / “dispensation” (conforme a testemunha inglesa)
  choice: plano
  rationale: Expressa em português corrente a ideia de disposição ou plano divino sem impor uma construção teológica técnica; a nota preserva a amplitude do termo.
- source_word: πάθος / “passion”
  choice: paixão
  rationale: Mantém o termo cristão histórico para o sofrimento e a morte de Jesus, em paralelo com “ressurreição”.
- source_word: πρεσβυτέριον / “presbytery”
  choice: presbitério
  rationale: Designa o corpo de presbíteros, evitando confundi-lo com um edifício ou com um único presbítero.
- source_word: φάρμακον ἀθανασίας / “medicine of immortality”
  choice: remédio de imortalidade
  rationale: Conserva a metáfora medicinal forte e sua relação direta com a imortalidade.
- source_word: ἀντίδοτος / “antidote”
  choice: antídoto
  rationale: Preserva a segunda imagem terapêutica e a progressão retórica do texto.
- source_word: κατὰ σάρκα / “according to the flesh”
  choice: segundo a carne
  rationale: Mantém a fórmula cristológica antiga e sua tensão com os títulos “Filho do Homem” e “Filho de Deus”.
theological_decisions:
- issue: Natureza do “plano/dispensação” referente ao novo homem Jesus Cristo
  choice: '“o plano [...] referente ao novo homem, Jesus Cristo: a fé nele e o amor por ele, sua paixão e ressurreição”'
  alternative: “a dispensação [...] que consiste na fé e no amor, na paixão e na ressurreição”
  rationale: A pontuação conserva a relação entre todos os elementos sem definir além da evidência disponível exatamente como cada expressão depende de “plano” ou de “novo homem”.
- issue: Linguagem eucarística
  choice: “partindo um só pão, que é remédio de imortalidade”
  alternative: Parafrasear como símbolo, sacramento ou presença real
  rationale: Mantém a afirmação vigorosa de Inácio sem acrescentar uma explicação denominacional sobre o modo de eficácia do pão.
- issue: Obediência e unidade mental
  choice: “obedeçam ao bispo e ao presbitério sem a mente dividida”
  alternative: “sem distração” ou “sem hesitação”
  rationale: “Sem a mente dividida” comunica a unidade interior e comunitária do contexto, preservando a imagem sem reduzi-la a simples falta de atenção.
- issue: Cristologia davídica
  choice: “segundo a carne, veio da linhagem de Davi”
  alternative: “era da raça de Davi”
  rationale: A formulação é natural e digna em português, afirma a descendência humana e não dilui a expressão tradicional “segundo a carne”.
translation_notes:
  register: Português moderno, amplo e legível no Brasil, com tom digno e eclesiástico sem arcaísmos desnecessários. Empregam-se “vocês/lhes” para inteligibilidade corrente; “bispo”, “presbitério”, “paixão” e “segundo a carne” são mantidos como vocabulário histórico necessário. Como o material fornecido declara pendente a revisão do grego, as decisões são deliberadamente cautelosas e ancoradas na testemunha pública inglesa e na camada consultiva POB.
