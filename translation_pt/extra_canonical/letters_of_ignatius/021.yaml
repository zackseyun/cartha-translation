  source_fidelity: A tradução preserva bem o conteúdo central da testemunha inglesa e os principais termos técnicos. Contudo, a construção com dois-pontos depois de “Jesus Cristo” torna mais solta a relação sintática que o texto apresenta entre a economia/plano e seus elementos constitutivos. “Em comunidade” também acrescenta uma nuance institucional que não é necessária para o sentido de reunião comum/coletiva.
  naturalness: O registro é claro e moderno. Ainda assim, “Reúnam-se todos em comunidade, cada um de vocês, pessoa por pessoa” soa redundante e pouco idiomático; “Reúnam-se todos juntos, cada um de vocês, um por um” conserva a ênfase distributiva de modo mais natural.
  terminology: “Plano”, com nota, é uma solução prudente para οἰκονομία; “paixão”, “presbitério”, “segundo a carne”, “remédio de imortalidade” e “antídoto” são adequados e não introduzem leitura denominacional. A nota mantém corretamente alternativas relevantes enquanto a revisão direta do grego permanece pendente.
