base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/042.yaml
  text: 'In the same way, let everyone respect the deacons as Jesus Christ, just as they should respect the bishop as a representation of the Father, and the presbyters as the council of God and the assembly of the apostles. Apart from these, there is not even the name of a church.


    I am convinced that you think this way concerning these matters, for I received an example of your love and have it with me in the person of your bishop. His very conduct is a great lesson, while his gentleness is power—a man to whom I think even the godless show reverence.


    Because I love you, I spare you in this way, though I could write more sharply on his behalf. But I did not consider myself qualified to do this: as a convict, to give you orders as though I were an apostle.'
translation:
  language: pt
  text: 'Do mesmo modo, que todos respeitem os diáconos como a Jesus Cristo; o bispo, como figura do Pai; e os presbíteros, como o conselho de Deus e o vínculo dos apóstolos.[a] Sem estes, não se dá nem mesmo o nome de igreja.[b]



    Estou convencido de que vocês pensam assim a respeito dessas coisas, pois recebi, na pessoa do bispo de vocês, uma expressão do amor de vocês e a tenho comigo. Sua própria conduta é um grande ensinamento, e sua mansidão é força. Penso que até os que não creem em Deus o tratam com reverência.[c]



    Porque amo vocês, poupo-os assim, embora pudesse escrever de maneira mais incisiva em defesa dele. Mas não me considerei qualificado para isso: eu, sendo um condenado, dar-lhes ordens como se fosse um apóstolo.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Vínculo” também pode ser traduzido como “laço”, “elo” ou “união”.
    reason: σύνδεσμος designa primariamente uma ligação ou união; a nota preserva alternativas portuguesas sem transformar a expressão em título institucional.
  - marker: b
    text: Literalmente, “sem estes, não é chamada igreja”.
    reason: Preserva a forma passiva e a ênfase do texto na designação de “igreja”.
  - marker: c
    text: “Os que não creem em Deus” traduz um termo que também pode ser vertido como “ateus” ou, conforme o contexto antigo, “ímpios”.
    reason: Evita fixar uma única nuance histórica ou moral para o vocábulo.
  - marker: d
    text: “Condenado” refere-se à condição de Inácio como prisioneiro sentenciado, não a uma avaliação espiritual de sua pessoa.
    reason: Previne uma leitura teológica indevida de uma referência judicial e biográfica.
lexical_decisions:
- source_word: ἐντρεπέσθωσαν
  choice: respeitem
  rationale: Expressa de modo natural a ideia de consideração reverente, sem elevar o verbo ao sentido de adoração.
- source_word: τύπον
  choice: figura
  rationale: Preserva o sentido representativo ou tipológico do termo sem especificar além do texto a natureza dessa representação.
- source_word: συνέδριον
  choice: conselho
  rationale: Comunica uma assembleia deliberativa e mantém a imagem institucional aplicada aos presbíteros.
- source_word: σύνδεσμον
  choice: colegiado
  rationale: Representa o corpo unido dos apóstolos em português corrente e dignificado; a nota registra a amplitude possível do termo.
- source_word: κατάστημα
  choice: conduta
  rationale: Abrange porte, comportamento e maneira de viver; é mais natural aqui do que uma tradução física como “postura”.
- source_word: μαθητεία
  choice: ensinamento
  rationale: No contexto, a conduta do bispo constitui uma lição ou formação prática; “ensinamento” transmite isso com clareza.
- source_word: πραότης
  choice: mansidão
  rationale: Mantém a qualidade de força contida e gentileza não agressiva presente no contraste com “poder”.
- source_word: ἀθέους
  choice: os que não creem em Deus
  rationale: Evita o possível tom meramente insultuoso de “ímpios” e expressa o referente religioso do termo.
- source_word: κατάκριτος
  choice: condenado
  rationale: Preserva a referência de Inácio à sua situação judicial e à sentença sob a qual se encontrava.
theological_decisions:
- issue: Comparação dos diáconos com Jesus Cristo
  choice: “respeitem os diáconos como a Jesus Cristo”
  alternative: “respeitem os diáconos como representantes de Jesus Cristo”
  rationale: O texto formula uma comparação direta e não inclui explicitamente “representantes”; a tradução conserva essa força sem acrescentar uma explicação eclesiológica.
- issue: Relação do bispo com o Pai
  choice: “como figura do Pai”
  alternative: “como representante do Pai”
  rationale: “Figura” mantém aberta a extensão teológica de τύπος e evita transformar a imagem em uma definição formal de autoridade.
- issue: Constituição da igreja
  choice: “Sem eles, não se pode chamar algo de igreja”
  alternative: “Sem eles, não existe igreja”
  rationale: A formulação preserva a linguagem de nomeação do texto e não a amplia para uma declaração ontológica mais absoluta.
- issue: Autoridade apostólica de Inácio
  choice: “como se eu fosse apóstolo”
  alternative: “como um apóstolo”
  rationale: Conserva a autocontenção retórica de Inácio e não sugere que ele esteja reivindicando para si o ofício apostólico.
translation_notes:
  register: Português moderno, amplamente internacional, com legibilidade brasileira. O tratamento por “vocês” torna o plural explícito e natural. Mantiveram-se “bispo”, “presbíteros”, “diáconos” e “apóstolos” por serem termos históricos reconhecíveis. A redação foi confrontada com a formulação grega tradicionalmente atestada para IgnTrall. 3, mas, conforme os metadados fornecidos, a revisão direta e formal do testemunho manuscrito grego ainda está pendente.
