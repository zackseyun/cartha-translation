    May all things therefore abound unto you in grace, for ye are worthy. Ye refreshed me in all things, and Jesus Christ shall refresh you. In my absence and in my presence ye cherished me. May God recompense you; for whose sake if ye endure all things, ye shall attain unto Him.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/085.yaml
  text: 'From now on, it is reasonable for us to wake up and be sober-minded while we [still] have time to repent and turn to God. It is good to recognize God and the bishop. Whoever honors the bishop is honored by God; whoever does anything without the bishop’s knowledge serves the devil.


    Therefore, may all things abound to you in grace, for you are worthy. You refreshed me in every way, and Jesus Christ will refresh you. Both in my absence and in my presence, you cherished me. May God repay you; for whose sake, if you endure all things, you will attain to him.'
translation:
  language: pt
  text: 'É razoável, portanto, que, de agora em diante, despertemos para a sobriedade, enquanto ainda temos oportunidade de nos arrepender e nos voltar para Deus. É bom reconhecer a Deus e o bispo. Quem honra o bispo é honrado por Deus; quem faz alguma coisa às escondidas do bispo presta culto ao diabo.


    Portanto, que todas as coisas lhes sejam abundantes na graça, pois vocês são dignos disso. Vocês me reconfortaram em tudo, e Jesus Cristo os reconfortará. Tanto na minha ausência como na minha presença, vocês tiveram carinho por mim. Que Deus seja a recompensa de vocês; pois, se por amor a ele suportarem todas as coisas, vocês o alcançarão.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vocês chegarão até ele”. O pronome se refere provavelmente a Deus.'
    reason: Esclarece a construção final e seu referente provável sem eliminar a forma pronominal do texto.
lexical_decisions:
- source_word: ἀνανῆψαι
  choice: despertemos para a sobriedade
  rationale: Preserva a imagem de recobrar a lucidez ou sair de um estado de torpor, combinando despertar e sobriedade em português natural.
- source_word: καιρόν
  choice: oportunidade
  rationale: Expressa um tempo favorável ou ocasião disponível, e não apenas tempo cronológico.
- source_word: εἰδέναι
  choice: reconhecer
  rationale: Neste contexto exortativo, comunica mais do que simples conhecimento intelectual, sem especificar indevidamente a forma prática desse reconhecimento.
- source_word: λάθρα ἐπισκόπου
  choice: às escondidas do bispo
  rationale: Reflete o sentido de agir secretamente, sem transformar a expressão apenas em falta de autorização ou conhecimento.
- source_word: λατρεύει
  choice: presta culto
  rationale: Mantém a força religiosa de servir ou cultuar, em vez do mais genérico 'serve'.
- source_word: ἀνεπαύσατε / ἀναπαύσει
  choice: deram descanso / dará descanso
  rationale: Conserva a repetição deliberada e a reciprocidade verbal do trecho.
- source_word: ἀμοιβὴ ὑμῖν ὁ θεός
  choice: Que Deus seja a recompensa de vocês
  rationale: Segue mais diretamente a construção nominal grega do que a paráfrase 'Que Deus lhes recompense'.
- source_word: τεύξεσθε
  choice: alcançarão
  rationale: Preserva a ideia de chegar a obter ou alcançar alguém, aqui com Deus como referente provável.
theological_decisions:
- issue: Relação entre reconhecer a Deus e reconhecer o bispo
  choice: É bom reconhecer a Deus e o bispo
  alternative: É bom conhecer a Deus e o bispo / É bom submeter-se a Deus e ao bispo
  rationale: A formulação mantém o paralelismo forte do texto sem reduzir 'reconhecer' a mero conhecimento intelectual nem ampliá-lo explicitamente para submissão.
- issue: Ação realizada λάθρα do bispo
  choice: quem faz alguma coisa às escondidas do bispo
  alternative: quem faz alguma coisa sem o conhecimento do bispo
  rationale: A opção escolhida preserva o elemento de segredo presente no advérbio e evita afirmar que toda ação não conhecida pelo bispo esteja necessariamente em vista.
- issue: Deus como recompensa
  choice: Que Deus seja a recompensa de vocês
  alternative: Que Deus recompense vocês
  rationale: A construção conserva a possibilidade teológica de que o próprio Deus seja apresentado como recompensa, conforme a sintaxe grega.
- issue: Referente final de αὐτοῦ
  choice: vocês o alcançarão
  alternative: vocês chegarão até ele
  rationale: Mantém o pronome e seu referente provável, Deus, sem substituir explicitamente o pronome no corpo do texto.
translation_notes:
  register: Português contemporâneo, digno e de ampla compreensão, com 'vocês' como plural de segunda pessoa. A redação foi conferida à luz do texto grego conhecido da recensão média; mantém paralelismos, repetições e tensões teológicas, evitando linguagem denominacional.
