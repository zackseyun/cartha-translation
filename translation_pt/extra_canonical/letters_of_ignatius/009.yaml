review_pass:
  verdict: revise
  source_fidelity: 'A revisão é limitada porque o grego não foi fornecido, mas o rascunho acompanha em geral o testemunho inglês. Há, contudo, uma imprecisão em «igreja de vocês, os efésios»: a construção é pouco natural e pode sugerir que «os efésios» é aposto de «igreja». «Igreja dos efésios» exprime com clareza o genitivo do testemunho. «Por todas as gerações» também estreita levemente «unto all the ages»; «ao longo de todas as eras» preserva melhor a amplitude temporal.'
  naturalness: O texto tem registro moderno e digno. A revisão elimina a construção pesada «pela igreja de vocês, os efésios» e ajusta a pontuação para uma leitura mais fluida, sem perder o paralelismo do original.
  terminology: «Desejo», «carne», «Espírito», «fé», «infidelidade» e «em Jesus Cristo» são escolhas defensáveis e conservam as tensões do texto. «Oferta» mantém a imagem cultual sem impor uma teoria expiatória.
  issues:
  - severity: medium
    issue: «pela igreja de vocês, os efésios»
    rationale: A expressão é sintaticamente ambígua e pouco idiomática em português. O sentido do testemunho é a igreja pertencente aos efésios, não uma igreja identificada por um aposto pessoal.
  - severity: low
    issue: «por todas as gerações» para «unto all the ages»
    rationale: «Gerações» é possível, mas «eras» preserva melhor a formulação temporal abrangente do testemunho.
  revised_text: '8 Portanto, ninguém engane vocês — como, de fato, vocês não são enganados —, pois pertencem inteiramente a Deus. Pois, quando nenhum desejo capaz de atormentá-los se estabelece em vocês, então verdadeiramente vivem segundo Deus. Entrego-me por vocês e consagro-me como oferta em favor da igreja dos efésios, que é célebre ao longo de todas as eras.[a]



    Os que são da carne não podem fazer as coisas do Espírito, nem os que são do Espírito podem fazer as coisas da carne; do mesmo modo, a fé não pode fazer as coisas da infidelidade, nem a infidelidade, as coisas da fé. Contudo, até mesmo o que vocês fazem segundo a carne é espiritual, pois fazem tudo em Jesus Cristo.'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega da recensão média, sobretudo na frase de dedicação e oferta.
    reason: O texto grego não foi fornecido e a própria documentação informa que a revisão na língua-fonte ainda está pendente; a nota torna transparente essa limitação relevante.
  revision_rationale: 'Foram feitas somente correções seguras de clareza sintática e de alcance semântico: «igreja dos efésios» torna inequívoca a relação genitiva, e «ao longo de todas as eras» reflete melhor «unto all the ages». A nota de transparência foi preservada, pois a conferência direta do grego continua pendente.'
