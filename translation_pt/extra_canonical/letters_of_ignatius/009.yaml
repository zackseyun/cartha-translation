base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/009.yaml
  text: 'Therefore, let no one deceive you, just as indeed you are not deceived, since you belong wholly to God. For when no desire that has the power to torment you is established within you, then you truly live according to God. I devote myself for you, and I dedicate myself as an offering for the church of you Ephesians, which is famous throughout all ages.


    Those who are of the flesh cannot do the things of the Spirit, nor can those who are of the Spirit do the things of the flesh, just as faith cannot do the things of unfaithfulness, nor unfaithfulness the things of faith. Indeed, even the things you do according to the flesh are spiritual, for you do everything in Jesus Christ.'
translation:
  language: pt
  text: '8 Portanto, ninguém engane vocês — como, de fato, vocês não são enganados —, pois pertencem inteiramente a Deus. Quando nenhum desejo capaz de atormentá-los se estabelece em vocês, então verdadeiramente vivem segundo Deus. Entrego-me por vocês e consagro-me como oferta pela igreja de vocês, os efésios, que é célebre por todas as gerações.[a]


    Os que são da carne não podem fazer as coisas do Espírito, nem os que são do Espírito podem fazer as coisas da carne; do mesmo modo, a fé não pode fazer as coisas da infidelidade, nem a infidelidade, as coisas da fé. Contudo, até mesmo o que vocês fazem segundo a carne é espiritual, pois fazem tudo em Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega da recensão média, sobretudo na frase de dedicação e oferta.
    reason: O texto grego não foi fornecido e a própria documentação informa que a revisão na língua-fonte ainda está pendente; a nota torna transparente essa limitação relevante.
lexical_decisions:
- source_word: lust / desire (Greek review pending)
  choice: desejo
  rationale: “Desejo” mantém o sentido amplo do testemunho disponível sem restringi-lo indevidamente à sexualidade, como poderia ocorrer com “luxúria”.
- source_word: live after God
  choice: vivem segundo Deus
  rationale: Preserva a formulação relacional e ética do testemunho, sem ampliá-la para uma paráfrase interpretativa.
- source_word: I devote myself / dedicate myself as an offering
  choice: Entrego-me / consagro-me como oferta
  rationale: Reproduz a linguagem dupla de dedicação e sacrifício no testemunho inglês, em português natural e digno.
- source_word: of the flesh / after the flesh
  choice: da carne / segundo a carne
  rationale: Mantém a terminologia contrastiva tradicional e a tensão paradoxal do trecho, sem reduzir “carne” simplesmente a corpo ou pecado.
- source_word: unfaithfulness
  choice: infidelidade
  rationale: Conserva o contraste lexical direto com “fé” e permite tanto a ideia de falta de fé quanto a de deslealdade.
- source_word: in Jesus Christ
  choice: em Jesus Cristo
  rationale: Mantém a expressão incorporativa sem substituí-la por uma explicação teológica.
theological_decisions:
- issue: Contraste entre carne e Espírito
  choice: Preservar literalmente “carne” e “Espírito”, bem como a afirmação de que atos “segundo a carne” podem ser espirituais.
  alternative: Interpretar “carne” como “natureza pecaminosa” ou entender a última ocorrência apenas como ações corporais.
  rationale: O texto apresenta deliberadamente uma tensão. Explicá-la no corpo da tradução resolveria uma ambiguidade teológica que o testemunho não resolve.
- issue: Linguagem sacrificial do autor em favor da igreja
  choice: “consagro-me como oferta pela igreja de vocês”
  alternative: “sacrifico-me pela igreja de vocês” ou uma leitura técnica de resgate/expiação.
  rationale: “Oferta” preserva a imagem cultual sem atribuir ao autor uma função expiatória específica não demonstrável a partir da evidência fornecida.
- issue: “Infidelidade” em contraste com fé
  choice: Manter o substantivo abstrato “infidelidade”.
  alternative: Traduzir como “incredulidade”.
  rationale: A evidência inglesa permite mais de uma nuance; “infidelidade” conserva maior amplitude sem eliminar a oposição à fé.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Emprega “vocês” para o plural e preserva termos teologicamente carregados como “carne”, “Espírito”, “fé” e “em Jesus Cristo”. A sintaxe foi atualizada sem apagar os paralelismos retóricos do trecho.
