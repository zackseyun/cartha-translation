review_pass:
  verdict: revise
  source_fidelity: A versão preserva com boa precisão o testemunho inglês fornecido, incluindo a repetição da igreja na Síria, a autodepreciação do autor e a imagem do orvalho. Contudo, «oração unida» pode sugerir uma única oração, enquanto «united prayer» descreve mais naturalmente a oração coletiva/concorde da comunidade. A nota de transparência sobre a ausência de revisão direta do grego deve permanecer.
  naturalness: O texto é claro e de registro apropriado. «ser concedido à igreja ... ser revigorada» é gramatical, mas pesado e pouco idiomático em português contemporâneo. «receber refrigério» transmite melhor a construção sem alterar sua reserva nem a metáfora.
  terminology: «cheios de Deus», «exortei», «alcance Deus», «membro», «amor ... em Deus» e «súplica fervorosa» são escolhas defensáveis e não impõem leitura denominacional. «oração concorde» expressa com mais naturalidade a unidade da oração comunitária.
  issues:
  - severity: low
    issue: «oração unida»
    rationale: A expressão é compreensível, mas em português pode ser lida como uma oração singular. «oração concorde» comunica de forma mais idiomática a oração feita em unidade, sem acrescentar conteúdo.
  - severity: low
    issue: Construção «seja concedido ... ser revigorada»
    rationale: A sequência de passiva impessoal com infinitivo é desajeitada. «seja concedido ... receber refrigério» preserva o sentido de concessão e produz português mais fluente.
  revised_text: Sabendo que vocês estão cheios de Deus, eu os exortei brevemente. Lembrem-se de mim em suas orações, para que eu alcance Deus. Lembrem-se também da igreja que está na Síria, da qual não sou digno de ser chamado membro. Pois necessito da oração concorde de vocês e do amor que têm em Deus, para que seja concedido à igreja que está na Síria receber refrigério pelo orvalho da fervorosa súplica de vocês.[a]
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta da tradição manuscrita grega da recensão média ainda está pendente.
    reason: A fonte apresentada informa explicitamente que a análise na língua original ainda não foi realizada; a nota torna transparente essa limitação textual.
  revision_rationale: 'Foram feitas apenas duas revisões estilístico-semânticas seguras: «oração concorde» evita a possível leitura de uma oração singular e «receber refrigério» substitui uma construção passiva pouco natural. Mantêm-se a ambiguidade de «alcance Deus», a relação do amor «em Deus», a linguagem eclesial e a imagem do orvalho. Como a revisão direta do grego permanece pendente, conserva-se a nota de limitação da base textual.'
