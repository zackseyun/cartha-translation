source:
  text: Knowing that ye are full of God, I have exhorted you briefly. Remember me in your prayers, that I may attain unto God; and remember also the church which is in Syria, whereof I am not worthy to be called a member. For I have need of your united prayer and love in God, that it may be granted to the church which is in Syria to be refreshed by the dew of your fervent supplication.
