base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/037.yaml
  text: Knowing that you are full of God, I have encouraged you briefly. Remember me in your prayers, so that I may reach God. Also remember the church in Syria, of which I am not worthy to be called a member. For I need your united prayer and love in God, so that the church in Syria may be granted refreshment by the dew of your fervent prayer.
translation:
  language: pt
  text: Sabendo que vocês estão cheios de Deus, eu os exortei brevemente. Lembrem-se de mim em suas orações, para que eu alcance Deus. Lembrem-se também da igreja que está na Síria, da qual não sou digno de ser chamado membro. Pois necessito da oração unida de vocês e do amor que têm em Deus, para que seja concedido à igreja que está na Síria ser revigorada pelo orvalho da fervorosa súplica de vocês.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta da tradição manuscrita grega da recensão média ainda está pendente.
    reason: A fonte apresentada informa explicitamente que a análise na língua original ainda não foi realizada; a nota torna transparente essa limitação textual.
lexical_decisions:
- source_word: full of God
  choice: cheios de Deus
  rationale: Preserva de modo direto a forte expressão do testemunho disponível, sem diluí-la em uma paráfrase interpretativa.
- source_word: exhorted
  choice: exortei
  rationale: Mantém o sentido de apelo e encorajamento sério, em registro digno e ainda compreensível.
- source_word: attain unto God
  choice: alcance Deus
  rationale: Conserva a formulação escatológica concisa e sua tensão, sem explicitar indevidamente morte, martírio ou salvação.
- source_word: united prayer
  choice: oração unida
  rationale: Expressa a ação conjunta da comunidade sem acrescentar uma formulação eclesiológica ausente do testemunho.
- source_word: refreshed by the dew
  choice: revigorada pelo orvalho
  rationale: Preserva a metáfora do orvalho e comunica naturalmente a ideia de refrigério e renovação.
- source_word: fervent supplication
  choice: fervorosa súplica
  rationale: Retém tanto a intensidade quanto o caráter de petição insistente.
theological_decisions:
- issue: Sentido de “alcançar Deus”
  choice: Manter “para que eu alcance Deus”
  alternative: “para que eu chegue à presença de Deus” ou referência explícita ao martírio
  rationale: O testemunho fornecido não resolve plenamente a expressão; a tradução preserva sua densidade e evita impor uma interpretação específica.
- issue: Relação entre amor e Deus
  choice: “do amor que têm em Deus”
  alternative: “do amor de Deus”
  rationale: A construção do testemunho favorece o amor da comunidade situado em Deus, e não necessariamente o amor procedente de Deus.
- issue: Indignidade em relação à igreja da Síria
  choice: “da qual não sou digno de ser chamado membro”
  alternative: “à qual não sou digno de pertencer”
  rationale: A formulação escolhida preserva mais de perto a autodepreciação eclesial do testemunho sem tentar explicar sua causa.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com uso de “vocês” para boa legibilidade brasileira. A repetição de “igreja que está na Síria” e a metáfora do orvalho foram mantidas por sua relevância retórica. Evitou-se linguagem denominacional e qualquer explicitação do martírio não exigida pelo testemunho disponível.
