base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/049.yaml
  text: But if, as certain godless people—that is, unbelievers—say, he suffered only in appearance, while they themselves are mere appearances, why am I in chains? And why do I also desire to fight with wild beasts? Then I die for nothing. Truly, then, I lie against the Lord.
translation:
  language: pt
  text: Mas, se, como dizem certas pessoas ímpias — isto é, incrédulas —, ele sofreu apenas em aparência, sendo elas mesmas mera aparência, por que estou acorrentado? E por que desejo também lutar com feras? Nesse caso, morro em vão. Então, na verdade, minto contra o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godless
  choice: ímpias
  rationale: Preserva a censura religiosa do testemunho sem recorrer a uma formulação excessivamente técnica; a explicação seguinte, “isto é, incrédulas”, mantém a precisão do autor.
- source_word: suffered only in semblance
  choice: sofreu apenas em aparência
  rationale: Expressa de modo claro a alegação de que o sofrimento não teria sido real, sem acrescentar terminologia doutrinária posterior.
- source_word: being themselves mere semblance
  choice: sendo elas mesmas mera aparência
  rationale: Mantém o jogo retórico e a repetição de “aparência”, ainda que a formulação deliberadamente paradoxal permaneça aberta.
- source_word: in bonds
  choice: acorrentado
  rationale: Termo natural em português para encarceramento físico, preservando a força concreta da imagem.
- source_word: fight with wild beasts
  choice: lutar com feras
  rationale: Formulação direta e historicamente adequada, sem explicitar além do testemunho o cenário da execução.
- source_word: in vain
  choice: em vão
  rationale: Preserva a ideia de inutilidade ou falta de propósito com linguagem digna e corrente.
- source_word: lie against the Lord
  choice: estou mentindo contra o Senhor
  rationale: Mantém a construção forte e incomum do testemunho, em vez de suavizá-la para “dar falso testemunho” ou resolver seu sentido.
theological_decisions:
- issue: Realidade do sofrimento de Cristo
  choice: “sofreu apenas em aparência” como afirmação atribuída aos opositores
  alternative: Empregar o rótulo posterior “docetismo” ou explicar que Cristo não sofreu fisicamente
  rationale: A tradução conserva o argumento cristológico de Inácio sem importar nomenclatura doutrinária posterior nem ampliar o que o texto diz.
- issue: Sentido da frase sobre os opositores serem “mera aparência”
  choice: Preservar literalmente a réplica paradoxal
  alternative: Interpretar como “eles próprios não são reais”, “não passam de fantasmas” ou “sua fé é aparente”
  rationale: O testemunho disponível permite mais de uma nuance retórica; a versão não deve resolver silenciosamente essa ambiguidade.
- issue: Consequência para o martírio de Inácio
  choice: “Nesse caso, morro em vão”
  alternative: “Portanto, minha morte não tem valor”
  rationale: Mantém a relação lógica com a negação do sofrimento real de Cristo sem formular uma teoria adicional sobre o valor do martírio.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. A pontuação destaca o aposto “isto é, incrédulas” e preserva a progressão retórica das perguntas até a conclusão. Como a revisão direta do grego ainda está pendente, o texto permanece conscientemente próximo do testemunho público em inglês, sem alegar decisões filológicas não verificadas.
