review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês e a estrutura conhecida do grego médio. Contudo, a oração final perde a ligação explícita de «por meio de quem» (δι’ οὗ) com a condição subsequente. Além disso, «morrer para a paixão dele» é pouco idiomático em português e não exprime com clareza suficiente a construção difícil εἰς τὸ αὐτοῦ πάθος.
  naturalness: 'O texto é geralmente claro, digno e moderno. «Duas cunhagens» preserva adequadamente a imagem monetária, embora seja uma escolha um tanto técnica. A formulação final, porém, soa truncada: após «Jesus Cristo», a frase condicional começa sem retomar «por meio de quem», e «morrer para a paixão dele» não é uma colocação natural.'
  terminology: «Deus Pai», «Jesus Cristo», «paixão», «fiéis» e «descrentes» são adequados ao registro patrístico e não impõem leitura confessional indevida. «Em amor» conserva prudentemente a ambiguidade de ἐν ἀγάπῃ. Mantém-se «cunhagens» para conservar a metáfora de δύο νομίσματα e «marca» para χαρακτήρ.
  issues:
  - severity: medium
    issue: A ligação de «por meio de quem» com a oração condicional final foi omitida na sintaxe portuguesa.
    rationale: O testemunho inglês traz «through whom, unless...», correspondente ao grego δι’ οὗ. Embora «por meio de Jesus Cristo» ocorra na oração anterior, a segunda ocorrência introduz especificamente a condição sobre morrer em relação à paixão dele e deve ser preservada.
  - severity: medium
    issue: «Morrer para a paixão dele» é uma formulação pouco natural e semanticamente opaca.
    rationale: A expressão procura reproduzir literalmente a dificuldade de εἰς τὸ αὐτοῦ πάθος, mas em português «morrer em sua paixão» preserva a linguagem participativa sem sugerir uma finalidade estranha ou explicar excessivamente a relação.
  revised_text: Visto, portanto, que todas as coisas têm um fim e que estas duas — vida e morte — estão postas diante de nós ao mesmo tempo, cada pessoa irá para o seu próprio lugar. Pois, assim como há duas cunhagens, uma de Deus e outra do mundo, e cada uma traz gravada a marca que lhe é própria, assim os descrentes trazem a marca deste mundo, mas os fiéis, em amor, trazem a marca de Deus Pai por meio de Jesus Cristo, por meio de quem, se não aceitarmos livremente morrer em sua paixão, sua vida não está em nós —
  revised_footnotes: []
  revision_rationale: A revisão restabelece a segunda referência a Jesus Cristo introduzida por «por meio de quem», conservando a sintaxe e o encadeamento argumentativo do testemunho. Substitui-se a expressão pouco idiomática «morrer para a paixão dele» por «morrer em sua paixão», que mantém a concisão e a dificuldade deliberada da construção sem impor uma interpretação doutrinária. O travessão final é preservado, pois a frase continua além do recorte.
