review_pass:
  verdict: revise
  source_fidelity: A redação acompanha de perto o testemunho inglês fornecido e preserva adequadamente as imagens de fim, vida e morte, duas cunhagens e marcas distintivas. Contudo, a frase final omite o elemento relacional «por meio de quem» (through whom), ligado a Jesus Cristo, ao iniciar uma nova frase simplesmente com «Se não aceitarmos».
  naturalness: O português é claro, moderno e de registro apropriado. «Duas cunhagens» e «marca» preservam bem a metáfora monetária. A reconstrução da ligação final com «por meio de quem» exige uma ordem um pouco mais marcada, mas permanece inteligível e evita a omissão.
  terminology: «Deus Pai», «Jesus Cristo», «paixão», «fiéis» e «descrentes» são escolhas adequadas. «Morrer para a sua paixão» conserva prudentemente a formulação difícil do testemunho, sem resolver interpretativamente o sentido da participação no sofrimento de Cristo.
  issues:
  - severity: medium
    issue: Omissão de «through whom» na oração final.
    rationale: O testemunho diz «through Jesus Christ, through whom unless ...». O texto traduz «por meio de Jesus Cristo», mas a frase seguinte («Se não aceitarmos...») deixa de expressar o segundo «por meio de quem», que deve ser preservado, ainda que a construção seja sintaticamente densa.
  revised_text: Visto, portanto, que todas as coisas têm um fim, e que estas duas — vida e morte — estão postas diante de nós ao mesmo tempo, cada pessoa irá para o seu próprio lugar. Pois, assim como há duas cunhagens, uma de Deus e outra do mundo, e cada uma traz gravada a marca que lhe é própria, assim os descrentes trazem a marca deste mundo, mas os fiéis, em amor, trazem a marca de Deus Pai por meio de Jesus Cristo, por meio de quem, se não aceitarmos, por nossa própria escolha, morrer para a sua paixão, a sua vida não está em nós —
  revised_footnotes: []
  revision_rationale: A revisão restaura a repetição de «por meio de quem», presente no testemunho inglês e atribuída a Jesus Cristo. Mantêm-se as escolhas lexicais e a ambiguidade de «morrer para a sua paixão», bem como o travessão final que assinala a continuação do período.
