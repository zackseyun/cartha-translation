base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/028.yaml
  text: Seeing then that all things have an end, and these two—life and death—are set before us together, each person shall go to his own place. For just as there are two coinages, one of God and the other of the world, and each has its proper stamp impressed upon it, so the unbelievers bear the stamp of this world, but the faithful, in love, bear the stamp of God the Father through Jesus Christ, through whom, unless we of our own free choice accept to die unto his passion, his life is not in us:--
translation:
  language: pt
  text: Visto, portanto, que todas as coisas têm um fim, e que estas duas — vida e morte — estão postas diante de nós ao mesmo tempo, cada pessoa irá para o seu próprio lugar. Pois, assim como há duas cunhagens, uma de Deus e outra do mundo, e cada uma traz gravada a marca que lhe é própria, assim os descrentes trazem a marca deste mundo, mas os fiéis, em amor, trazem a marca de Deus Pai por meio de Jesus Cristo. Se não aceitarmos, por nossa livre escolha, morrer para a paixão dele, a vida dele não está em nós —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: two coinages
  choice: duas cunhagens
  rationale: Preserva a metáfora monetária e a ideia de dois sistemas de pertença identificados por marcas distintas.
- source_word: proper stamp
  choice: a marca que lhe é própria
  rationale: Comunica de modo natural a impressão distintiva de cada cunhagem, sem perder a imagem do selo gravado.
- source_word: the faithful in love
  choice: os fiéis, em amor
  rationale: Mantém a ligação explícita entre fidelidade e amor sem decidir se a expressão modifica principalmente os fiéis ou o ato de trazer a marca.
- source_word: passion
  choice: paixão
  rationale: Emprega o termo cristão tradicional para o sofrimento e a morte de Jesus, adequado ao contexto patrístico.
- source_word: of our own free choice
  choice: por nossa livre escolha
  rationale: Retém a ênfase do testemunho fornecido na decisão voluntária, sem acrescentar uma formulação doutrinária mais técnica.
theological_decisions:
- issue: Relação entre morrer e a paixão de Cristo
  choice: morrer para a paixão dele
  alternative: morrer em conformidade com a paixão dele / morrer por causa da paixão dele
  rationale: A construção do testemunho é semanticamente difícil e a revisão direta do grego ainda está pendente; a formulação escolhida conserva a tensão e evita explicar em excesso a natureza dessa participação.
- issue: Agência humana na aceitação da morte
  choice: Se não aceitarmos, por nossa livre escolha
  alternative: Se não estivermos dispostos espontaneamente
  rationale: Preserva a afirmação explícita da voluntariedade sem transformá-la numa tese sistemática sobre livre-arbítrio.
- issue: A vida de Cristo nos fiéis
  choice: a vida dele não está em nós
  alternative: não temos em nós a vida dele
  rationale: Mantém a linguagem ontológica e relacional do testemunho sem esclarecer indevidamente como essa presença deve ser entendida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A pontuação divide o período longo sem eliminar seu movimento retórico. O travessão final preserva a continuação da frase além desta seção. Como a revisão direta da tradição manuscrita grega está pendente, a redação permanece prudentemente próxima do testemunho inglês público fornecido.
