review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha em geral a testemunha inglesa: conserva os destinatários enviados a Esmirna, a ação de graças, a afeição por Policarpo, o pedido de lembrança, a intercessão pela igreja na Síria, a condição de prisioneiro a caminho de Roma e a esperança comum. A construção final sobre ter sido considerado digno de «ser achado para a honra de Deus» permanece deliberadamente incomum, como na testemunha, e requer cautela até a revisão direta do grego.'
  naturalness: 'Há um problema sintático em «de onde sou levado prisioneiro para Roma»: em português, «de onde» tende a retomar a Síria como origem, mas a formulação fica pesada; «de lá sou levado como prisioneiro» é mais idiomático. «O último de todos os fiéis dali» acrescenta um «todos» desnecessário e soa menos natural que «o último dos fiéis de lá». «Estejam bem» é compreensível, mas «Permaneçam firmes» oferece uma despedida mais natural e digna para o sentido convencional de bem-estar/fortalecimento, sem alterar o teor.'
  terminology: «Igreja», «Senhor», «Jesus Cristo», «Deus Pai» e «esperança comum» estão adequados. «Policarpo» e «Esmirna» seguem as formas portuguesas correntes. «Sou inteiramente dedicado» intensifica levemente a fórmula da testemunha; «Sou dedicado» preserva melhor sua concisão sem perder a afeição.
  issues:
  - severity: medium
    issue: Construção pouco natural em «de onde sou levado prisioneiro para Roma»
    rationale: A expressão é gramatical, mas cria uma ligação pesada entre «Síria» e o deslocamento. «De lá sou levado como prisioneiro para Roma» conserva a referência espacial e melhora a leitura.
  - severity: low
    issue: Intensificação e redundância em «inteiramente dedicado» e «o último de todos os fiéis dali»
    rationale: Nem «inteiramente» nem «todos» são exigidos pela testemunha inglesa. A redação mais concisa preserva melhor o tom semântico.
  - severity: medium
    issue: Despedida «Estejam bem» pouco idiomática no registro epistolar solene
    rationale: «Permaneçam firmes» comunica naturalmente a fórmula de despedida sem atribuir uma doutrina ou especificação ausente.
  revised_text: 'Sou dedicado a vocês e àqueles que vocês enviaram a Esmirna para a honra de Deus. De lá também lhes escrevo, dando graças ao Senhor e amando Policarpo como também amo vocês. Lembrem-se de mim, assim como desejo que Jesus Cristo também se lembre de vocês.


    Orem pela igreja que está na Síria, de lá sou levado como prisioneiro para Roma — eu, que sou o último dos fiéis de lá —, pois fui considerado digno de ser achado para a honra de Deus.[a] Permaneçam firmes em Deus Pai e em Jesus Cristo, nossa esperança comum.'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público. A redação desta frase é incomum, e a revisão direta do grego ainda está pendente.
    reason: Sinaliza a limitação documental e evita apresentar como segura uma formulação cuja sintaxe e nuance precisam de confirmação no texto grego.
  revision_rationale: Foram feitas apenas correções seguras de fluência, concisão e registro. A formulação ambígua sobre ser considerado digno de «ser achado para a honra de Deus» foi mantida, com nota, para não antecipar uma decisão exegética antes da revisão direta do texto grego.
