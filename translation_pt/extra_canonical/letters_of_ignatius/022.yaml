review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto a testemunha inglesa fornecida e preserva as relações essenciais: o envio a Esmirna, a escrita a partir de lá, a afeição por Policarpo, o pedido de memória e oração e a autodepreciação do autor. Contudo, «visto que» torna explicitamente causal uma relação que a formulação «according as» mantém mais aberta; «conforme» conserva melhor essa imprecisão.'
  naturalness: O português é claro e de registro adequado. A expressão «inteiramente dedicado» acrescenta uma intensificação não expressa de modo inequívoco pela testemunha e pode ser simplificada. A formulação incomum sobre ser considerado digno de ser encontrado para a honra de Deus é justificadamente mantida, com nota, pois a revisão direta do grego ainda está pendente.
  terminology: «Esmirna», «Policarpo», «Síria», «Roma», «igreja», «fiéis», «Deus Pai» e «Jesus Cristo» estão adequados. «Nossa esperança comum» conserva corretamente a expressão cristológica compartilhada.
  issues:
  - severity: low
    issue: Intensificação em «inteiramente dedicado»
    rationale: A testemunha diz «I am devoted», sem um equivalente explícito de «inteiramente». A remoção evita reforço semântico desnecessário.
  - severity: medium
    issue: Relação causal em «visto que fui considerado digno»
    rationale: A testemunha inglesa usa «according as», cuja relação sintática e semântica permanece algo incomum. «Visto que» a interpreta como causa; «conforme» preserva melhor a abertura do texto enquanto não há revisão direta do grego.
  revised_text: 'Sou dedicado a vocês e àqueles que vocês enviaram a Esmirna para a honra de Deus. É de lá que também lhes escrevo, dando graças ao Senhor e amando Policarpo como amo vocês. Lembrem-se de mim, assim como desejo que Jesus Cristo também se lembre de vocês.


    Orem pela igreja que está na Síria, de onde sou levado prisioneiro para Roma — eu, que sou o último de todos os fiéis dali —, conforme fui considerado digno de ser achado para a honra de Deus.[a] Estejam bem em Deus Pai e em Jesus Cristo, nossa esperança comum.'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público. A redação desta frase é incomum, e a revisão direta do grego ainda está pendente.
    reason: Sinaliza a limitação documental e evita apresentar como segura uma formulação cuja sintaxe e nuance precisam de confirmação no texto grego.
  revision_rationale: 'Foram feitas apenas duas correções seguras: retirou-se a intensificação não necessária de «inteiramente» e substituiu-se a conexão causal «visto que» por «conforme», que reproduz com maior cautela a relação incomum da testemunha inglesa. A nota permanece necessária, pois a confirmação direta da sintaxe grega ainda está pendente.'
