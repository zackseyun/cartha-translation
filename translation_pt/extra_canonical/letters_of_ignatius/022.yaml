base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/022.yaml
  text: 'I am devoted to you and to those whom you sent to Smyrna for the honor of God. From there I also write to you, giving thanks to the Lord and loving Polycarp as I love you too. Remember me, just as I desire that Jesus Christ may also remember you.


    Pray for the church in Syria, from which I am being led as a prisoner to Rome—I who am the very last of the faithful there, according as I was counted worthy to be found for the honor of God. Farewell in God the Father and in Jesus Christ, our common hope.'
translation:
  language: pt
  text: 'Sou inteiramente dedicado a vocês e àqueles que vocês enviaram a Esmirna para a honra de Deus. É de lá que também lhes escrevo, dando graças ao Senhor e amando Policarpo como amo vocês. Lembrem-se de mim, assim como desejo que Jesus Cristo também se lembre de vocês.


    Orem pela igreja que está na Síria, de onde sou levado prisioneiro para Roma — eu, que sou o último de todos os fiéis dali —, visto que fui considerado digno de ser achado para a honra de Deus.[a] Estejam bem em Deus Pai e em Jesus Cristo, nossa esperança comum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público. A redação desta frase é incomum, e a revisão direta do grego ainda está pendente.
    reason: Sinaliza a limitação documental e evita apresentar como segura uma formulação cuja sintaxe e nuance precisam de confirmação no texto grego.
lexical_decisions:
- source_word: I am devoted to you
  choice: Sou inteiramente dedicado a vocês
  rationale: Expressa devoção afetuosa em português natural, sem introduzir uma imagem específica que não pode ser confirmada antes da revisão direta do grego.
- source_word: Remember me
  choice: Lembrem-se de mim
  rationale: Mantém o pedido simples e sua possível dimensão de memória e oração, sem explicitar mais do que a testemunha permite.
- source_word: the very last of the faithful there
  choice: o último de todos os fiéis dali
  rationale: Preserva a autodepreciação enfática e identifica o grupo de modo inteligível.
- source_word: our common hope
  choice: nossa esperança comum
  rationale: Conserva a afirmação cristológica e o sentido de esperança compartilhada.
theological_decisions:
- issue: Sentido de ser considerado digno e achado para a honra de Deus
  choice: visto que fui considerado digno de ser achado para a honra de Deus
  alternative: pois fui considerado digno de servir para a honra de Deus
  rationale: A formulação escolhida preserva a construção incomum e a tensão da testemunha inglesa, evitando definir se a referência é ao martírio, ao aprisionamento ou ao serviço, enquanto a revisão do grego permanece pendente.
- issue: Pedido para que Cristo se lembre dos destinatários
  choice: assim como desejo que Jesus Cristo também se lembre de vocês
  alternative: para que Jesus Cristo também se lembre de vocês
  rationale: Mantém a forma volitiva e não converte silenciosamente o paralelismo em uma relação causal explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa do plural. A tradução segue provisoriamente a testemunha inglesa fornecida, pois a revisão direta da tradição grega da recensão média está pendente. Mantiveram-se as repetições e a ambiguidade relevante, com leve reorganização de pontuação para fluência.
