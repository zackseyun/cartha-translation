revisions:
- from: 'Pois, quando vocês obedecem ao bispo como a Jesus Cristo, fica evidente para mim que não vivem segundo os seres humanos, mas segundo Jesus Cristo, que morreu por nós, para que, crendo em sua morte, vocês escapassem da morte.


    Portanto, é necessário que, como já é costume de vocês, nada façam sem o bispo. Sejam também obedientes ao presbitério, como aos apóstolos de Jesus Cristo, nossa esperança; pois, se vivermos nele, também seremos encontrados nele.


    Do mesmo modo, os que são diáconos dos mistérios de Jesus Cristo devem procurar agradar a todos em tudo. Pois não são diáconos de comidas e bebidas, mas servos da Igreja de Deus. Portanto, é justo que se guardem da acusação como do fogo.'
  to: 'Pois, quando vocês obedecem ao bispo como a Jesus Cristo, fica evidente para mim que não vivem de modo humano, mas segundo Jesus Cristo, que morreu por nós, para que, crendo em sua morte, vocês escapem da morte.


    Portanto, é necessário que, como já é costume de vocês, nada façam sem o bispo. Sejam também obedientes ao presbitério, como aos apóstolos de Jesus Cristo, nossa esperança; pois, se vivermos nele, também seremos encontrados nele.


    Do mesmo modo, os que são diáconos dos mistérios de Jesus Cristo devem agradar a todos em tudo. Pois não são diáconos de comidas e bebidas, mas servos da Igreja de Deus. Portanto, é justo que se precavenham das acusações como do fogo.'
  rationale: A revisão conserva as opções históricas e teologicamente não interpretativas do rascunho. Apenas corrige o enquadramento verbal do propósito, remove uma atenuação não exigida em «procurar agradar» e restitui o plural de «acusações». «De modo humano» comunica naturalmente o sentido idiomático de viver «segundo o ser humano», sem impor uma leitura doutrinária adicional.
