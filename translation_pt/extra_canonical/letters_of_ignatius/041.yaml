base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/041.yaml
  text: 'For when you are obedient to the bishop as to Jesus Christ, it is evident to me that you are living not after men but after Jesus Christ, who died for us, so that, believing in his death, you might escape death.


    It is therefore necessary, even as is your custom, that you should do nothing without the bishop; but be obedient also to the presbytery, as to the Apostles of Jesus Christ our hope. For if we live in him, we shall also be found in him.


    And likewise those who are deacons of the mysteries of Jesus Christ must please all people in every way. For they are not deacons of meats and drinks but servants of the Church of God. It is right, therefore, that they should beware of blame as of fire.'
translation:
  language: pt
  text: 'Pois, quando vocês obedecem ao bispo como a Jesus Cristo, fica evidente para mim que não vivem de modo humano, mas segundo Jesus Cristo, que morreu por nós, para que, crendo em sua morte, vocês escapem da morte.


    Portanto, é necessário que, como já é costume de vocês, nada façam sem o bispo. Sejam também obedientes ao presbitério, como aos apóstolos de Jesus Cristo, nossa esperança; pois, se vivermos nele, também seremos encontrados nele.


    Do mesmo modo, os que são diáconos dos mistérios de Jesus Cristo devem agradar a todos em tudo. Pois não são diáconos de comidas e bebidas, mas servos da Igreja de Deus. Portanto, é justo que se precavenham das acusações como do fogo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bishop (Greek source review pending)
  choice: bispo
  rationale: Mantém o título eclesiástico tradicional do testemunho, em linguagem corrente e historicamente reconhecível.
- source_word: presbytery (Greek source review pending)
  choice: presbitério
  rationale: Preserva a referência coletiva ao corpo de presbíteros, sem reduzi-la a um único presbítero nem modernizá-la como mera diretoria.
- source_word: deacons / servants
  choice: diáconos / servos
  rationale: Reproduz o contraste verbal do testemunho entre o ofício dos diáconos e o serviço prestado à Igreja, embora o jogo lexical grego exato dependa de revisão direta.
- source_word: mysteries
  choice: mistérios
  rationale: Conserva a amplitude religiosa e a possível densidade sacramental do termo, sem substituí-lo por uma interpretação específica.
- source_word: blame
  choice: acusação
  rationale: Expressa a ideia de censura ou imputação pública sem pressupor necessariamente culpa comprovada.
theological_decisions:
- issue: Obediência ao bispo “como a Jesus Cristo”
  choice: como a Jesus Cristo
  alternative: como obedeceriam a Jesus Cristo
  rationale: Mantém a comparação forte e sua tensão eclesiológica, sem convertê-la em identidade entre o bispo e Cristo.
- issue: Viver “segundo” Cristo em contraste com os seres humanos
  choice: não vivem segundo os seres humanos, mas segundo Jesus Cristo
  alternative: não vivem à maneira humana, mas à maneira de Jesus Cristo
  rationale: Preserva a estrutura contrastiva e evita explicar em excesso se a referência é a padrões, autoridade ou modo de vida.
- issue: Crer na morte de Cristo e escapar da morte
  choice: crendo em sua morte, vocês escapassem da morte
  alternative: por meio da fé na morte dele, vocês fossem libertos da morte
  rationale: Mantém a formulação causal/final e a repetição de “morte”, sem definir a natureza da morte da qual se escapa.
- issue: Ser “encontrados” em Cristo
  choice: também seremos encontrados nele
  alternative: também estaremos nele
  rationale: Conserva a formulação passiva e sua possível dimensão escatológica, em vez de nivelá-la a simples permanência presente.
- issue: Diáconos dos mistérios
  choice: diáconos dos mistérios de Jesus Cristo
  alternative: ministros dos sacramentos de Jesus Cristo
  rationale: Evita restringir “mistérios” a uma doutrina sacramental posterior específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural e mantém os títulos históricos “bispo”, “presbitério” e “diáconos”. Como foi fornecido apenas um testemunho inglês e a revisão direta do grego está pendente, a redação é deliberadamente conservadora em pontos lexical e teologicamente sensíveis.
