base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/034.yaml
  text: I say these things, my dearly loved ones, not because I have learned that any of you think this way. Rather, since I am less than any of you, I want you to be on your guard in good time, so that you do not fall into the snares of empty teaching. Instead, be fully convinced about the birth, the suffering, and the resurrection, which took place during the governorship of Pontius Pilate. For these things were truly and certainly done by Jesus Christ, our hope. May none of you be turned away from this hope.
translation:
  language: pt
  text: Digo estas coisas, meus queridos, não porque eu tenha ficado sabendo que algum de vocês pense assim. Pelo contrário, como sou o menor entre vocês, quero que se acautelem desde já, para que não caiam na armadilha da vanglória. Mas estejam plenamente convencidos acerca do nascimento, do sofrimento e da ressurreição, que ocorreu durante a administração de Pôncio Pilatos. Pois essas coisas foram verdadeira e certamente realizadas por Jesus Cristo, nossa esperança. Que nenhum de vocês se desvie desta esperança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: my dearly beloved
  choice: meus queridos
  rationale: Expressão natural e afetuosa em português atual, sem perder o tom pastoral.
- source_word: be on your guard betimes
  choice: estejam prevenidos desde já
  rationale: Preserva tanto a ideia de vigilância quanto a de agir antecipadamente.
- source_word: vain doctrine
  choice: ensinamento vazio
  rationale: Comunica a falta de conteúdo verdadeiro ou proveitoso sem acrescentar conotação denominacional.
- source_word: passion
  choice: sofrimento
  rationale: Em português corrente, transmite com clareza o sofrimento de Cristo; evita que «paixão» seja entendido no sentido moderno de emoção intensa.
- source_word: governorship
  choice: governo
  rationale: Forma clara e idiomática para designar o período da administração de Pôncio Pilatos.
- source_word: our hope
  choice: nossa esperança
  rationale: Mantém a identificação cristológica direta e o caráter teológico da expressão.
theological_decisions:
- issue: Historicidade do nascimento, sofrimento e ressurreição
  choice: «acontecimentos que se deram durante o governo de Pôncio Pilatos» e «foram verdadeira e certamente realizados»
  alternative: Tratar apenas o sofrimento e a ressurreição como ocorridos sob Pôncio Pilatos
  rationale: O testemunho inglês fornecido liga gramaticalmente os três itens à oração temporal. A tradução preserva essa formulação, ainda que sua relação cronológica possa parecer difícil, sem corrigi-la silenciosamente.
- issue: Referente da esperança final
  choice: «dessa esperança»
  alternative: «dele» ou «de Jesus Cristo»
  rationale: Mantém a referência explícita do testemunho à esperança, ao mesmo tempo que a frase anterior identifica Jesus Cristo como «nossa esperança».
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego da recensão média ainda está pendente.
