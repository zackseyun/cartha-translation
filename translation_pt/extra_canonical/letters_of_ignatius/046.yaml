review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem a estrutura e os termos principais do testemunho inglês fornecido, inclusive o sinal textual em «[Deus] Jesus Cristo». Contudo, «isso certamente acontecerá» apresenta «this will surely be» como um acontecimento específico, quando o contexto pede «isso certamente será assim»/«isso certamente se dará». No fim, «não tem a consciência pura» é interpretativo em relação à predicação «não é puro em sua consciência»; uma formulação mais próxima preserva a linguagem de pureza do original.
  naturalness: O português é claro, contemporâneo e adequado ao registro exortativo. «Fiquem atentos» e «se encherem de orgulho» são naturais. «Não é puro em sua consciência» mantém boa legibilidade e cria uma correspondência mais transparente com a repetição de «puro».
  terminology: «Santuário», «bispo», «presbitério» e «diáconos» são escolhas adequadas. «Determinações dos apóstolos» é defensável para «ordinances», embora «preceitos» pudesse ser possível; não é necessária alteração terminológica. Os colchetes em «[Deus] Jesus Cristo» devem ser preservados, pois assinalam uma leitura textual incerta no testemunho-base.
  issues:
  - severity: medium
    issue: «isso certamente acontecerá» para «this will surely be»
    rationale: «Acontecerá» sugere a ocorrência de um evento. O testemunho diz que algo «será» ou «será assim», em ligação condicional com a humildade e a união com Cristo, o bispo e as ordenanças apostólicas.
  - severity: low
    issue: «não tem a consciência pura» para «is not clean in his conscience»
    rationale: A versão muda uma predicação de pureza aplicada à pessoa em sua consciência para uma afirmação sobre possuir uma consciência pura. «Não é puro em sua consciência» preserva melhor a repetição e a imagem cultual-moral do texto.
  revised_text: 'Portanto, fiquem atentos a pessoas assim. E isso certamente será assim, se vocês não se encherem de orgulho e permanecerem inseparáveis de [Deus] Jesus Cristo, do bispo e das determinações dos apóstolos.


    Quem está dentro do santuário é puro; mas quem está fora do santuário não é puro. Isto é: quem faz alguma coisa sem o bispo, o presbitério e os diáconos não é puro em sua consciência.'
  revised_footnotes: []
  revision_rationale: 'Foram feitas apenas duas correções seguras: «será assim» evita transformar a afirmação condicional em previsão de um evento, e «não é puro em sua consciência» conserva a construção e a repetição de «puro» do testemunho. Mantêm-se «[Deus]», «determinações», «santuário» e os títulos eclesiais, sem resolver questões textuais ou impor interpretação denominacional.'
