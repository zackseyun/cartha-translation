source:
  text: 'Be ye therefore on your guard against such men. And this will surely be, if ye be not puffed up and if ye be inseparable from [God] Jesus Christ and from the bishop and from the ordinances of the Apostles.


    He that is within the sanctuary is clean; but he that is without the sanctuary is not clean, that is, he that doeth aught without the bishop and presbytery and deacons, this man is not clean in his conscience.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
