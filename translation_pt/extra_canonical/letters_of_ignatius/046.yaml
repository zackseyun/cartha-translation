review_pass:
  verdict: revise
  source_fidelity: A revisão direta do grego confirma que θυσιαστήριον designa mais especificamente «altar», não «santuário». A formulação final deve conservar o predicado «não é puro em sua consciência», em vez de o converter em «não tem a consciência pura». A leitura textual assinalada por colchetes em «[Deus] Jesus Cristo» é preservada.
  naturalness: O texto é em geral claro e adequado ao português moderno. «Permaneçam inseparavelmente unidos a» exprime de forma mais idiomática a exortação de união contínua, e «à parte do bispo...» evita a possível leitura de mera ausência física dos ministros.
  terminology: «Altar» corresponde ao termo cultual do texto grego. «Presbitério» preserva o sentido coletivo. «Preceitos dos apóstolos» transmite διατάγματα/«ordinances» sem impor uma categoria confessional específica. «Puros» mantém a imagem de pureza do original.
  issues:
  - severity: medium
    issue: «Santuário» para o lugar cultual
    rationale: O termo grego θυσιαστήριον significa propriamente «altar». «Santuário» é mais amplo e perde a imagem específica empregada pelo autor.
  - severity: low
    issue: Reformulação de «não é puro em sua consciência»
    rationale: «Não tem a consciência pura» é idiomático, mas muda a construção predicativa e desloca levemente a ênfase do original; a formulação revisada a conserva.
  - severity: low
    issue: «Sem o bispo...» pode sugerir simples ausência
    rationale: No contexto, χωρὶς indica agir separado ou à parte da ordem episcopal, presbiteral e diaconal. «À parte do» torna essa relação mais nítida sem a ampliar.
  revised_text: 'Portanto, guardem-se de pessoas assim. E isso certamente se dará, se vocês não se deixarem encher de orgulho e permanecerem inseparavelmente unidos a [Deus] Jesus Cristo, ao bispo e aos preceitos dos apóstolos.


    Quem está dentro do altar é puro, mas quem está fora do altar não é puro. Isto é, quem faz algo à parte do bispo, do presbitério e dos diáconos não é puro em sua consciência.'
  revised_footnotes: []
  revision_rationale: A revisão substitui «santuário» por «altar», de acordo com o termo grego, e ajusta a última frase para refletir mais de perto sua sintaxe e seu sentido. Também torna mais explícita a noção de agir à parte da liderança indicada, preservando o tom exortativo e sem extrair implicações eclesiológicas além das expressas no texto. Os colchetes em «[Deus]» são mantidos como sinal da variante/leitura textual já indicada pelo testemunho de trabalho.
