  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Be ye therefore on your guard against such men. And this will surely be, if ye be not puffed up and if ye be inseparable from [God] Jesus Christ and from the bishop and from the ordinances of the Apostles.


    He that is within the sanctuary is clean; but he that is without the sanctuary is not clean, that is, he that doeth aught without the bishop and presbytery and deacons, this man is not clean in his conscience.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/046.yaml
  text: 'Therefore, be on your guard against such people. And this will certainly be so, if you are not puffed up and if you remain inseparable from [God] Jesus Christ, from the bishop, and from the ordinances of the Apostles.


    Whoever is inside the sanctuary is clean, but whoever is outside the sanctuary is not clean. That is, whoever does anything without the bishop, presbytery, and deacons is not clean in his conscience.'
translation:
  language: pt
  text: 'Portanto, fiquem atentos a pessoas assim. E isso certamente acontecerá, se vocês não se encherem de orgulho e permanecerem inseparáveis de [Deus] Jesus Cristo, do bispo e das determinações dos apóstolos.


    Quem está dentro do santuário é puro; mas quem está fora do santuário não é puro. Isto é: quem faz alguma coisa sem o bispo, o presbitério e os diáconos não tem a consciência pura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: be on your guard
  choice: fiquem atentos
  rationale: Expressão corrente e clara que conserva a exortação à vigilância sem soar excessivamente militar.
- source_word: puffed up
  choice: se encherem de orgulho
  rationale: Reproduz a imagem de arrogância de modo natural em português moderno.
- source_word: ordinances
  choice: determinações
  rationale: Mantém o sentido amplo de instruções ou disposições apostólicas, sem especificar indevidamente tradições, decretos ou ritos.
- source_word: sanctuary
  choice: santuário
  rationale: Preserva a metáfora cultual e a contraposição espacial do testemunho fornecido.
- source_word: presbytery
  choice: presbitério
  rationale: Refere-se ao corpo coletivo de presbíteros, não a um edifício ou a um único ministro.
- source_word: clean
  choice: puro / consciência pura
  rationale: Conserva a linguagem de pureza cultual e sua aplicação moral à consciência.
theological_decisions:
- issue: Leitura entre colchetes antes de «Jesus Cristo»
  choice: '[Deus] Jesus Cristo'
  alternative: Jesus Cristo
  rationale: Os colchetes foram preservados como sinal textual, conforme o testemunho fornecido e a revisão grega ainda pendente.
- issue: Relação entre santuário e liderança eclesial
  choice: Preservar a explicação explícita do autor
  alternative: Interpretar «santuário» como o edifício da igreja ou como pertencimento espiritual abstrato
  rationale: O próprio trecho identifica estar fora do santuário com agir sem o bispo, o presbitério e os diáconos; a tradução não amplia nem suaviza essa identificação.
- issue: Natureza das determinações apostólicas
  choice: 'Formulação ampla: «determinações dos apóstolos»'
  alternative: «tradições», «decretos» ou «doutrinas dos apóstolos»
  rationale: Evita importar uma categoria denominacional mais específica do que permite a evidência provisória.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O plural «vocês» torna explícito o destinatário coletivo do inglês arcaico. Tradução necessariamente provisória, pois o material fornecido declara pendente a revisão direta do grego da recensão média.
