revisions:
- from: 'Portanto, empenhem-se em reunir-se com mais frequência para dar graças a Deus e para a sua glória. Pois, quando vocês se reúnem com frequência, os poderes de Satanás são derrubados, e sua obra destrutiva é reduzida a nada pela concórdia da fé de vocês.


    Nada é melhor do que a paz, na qual é abolida toda guerra entre as coisas do céu e as da terra.[a]'
  to: 'Portanto, empenhem-se em reunir-se mais frequentemente em ação de graças a Deus e para a sua glória. Pois, quando vocês se reúnem frequentemente, os poderes de Satanás são derrubados, e sua destruição é desfeita na concórdia de vocês na fé.


    Nada é melhor do que a paz, na qual toda guerra de seres celestiais e terrestres é abolida.[a]'
  rationale: A revisão substitui formulações levemente interpretativas por equivalentes mais próximos da construção grega e elimina a especificação indevida de que a guerra ocorre necessariamente entre o céu e a terra. Mantêm-se o registro moderno, o plural «vocês» e a cautela quanto ao alcance técnico de «ação de graças».
  reviewer_model: gpt-5.6-terra
