base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/014.yaml
  text: 'Therefore, be diligent to meet together more frequently for thanksgiving to God and for his glory. For when you meet together frequently, the powers of Satan are cast down, and his mischief comes to nothing in the concord of your faith.


    There is nothing better than peace, in which all warfare of things in heaven and things on earth is abolished.'
translation:
  language: pt
  text: 'Portanto, empenhem-se em reunir-se mais frequentemente em ação de graças a Deus e para a sua glória. Pois, quando vocês se reúnem frequentemente, os poderes de Satanás são derrubados, e sua destruição é desfeita na concórdia de vocês na fé.


    Nada é melhor do que a paz, na qual toda guerra de seres celestiais e terrestres é abolida.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «toda guerra das coisas celestiais e terrestres». O grego não esclarece de modo inequívoco se a expressão se refere a conflitos entre os dois âmbitos ou, mais amplamente, à guerra ligada a seres celestiais e terrestres.'
    reason: Preserva a ambiguidade sintática e semântica da expressão final, sem introduzir no texto principal a leitura mais específica «entre».
lexical_decisions:
- source_word: thanksgiving
  choice: dar graças
  rationale: Expressão portuguesa natural que preserva o sentido de ação de graças sem pressupor aqui, com base apenas no testemunho fornecido, o uso técnico de «eucaristia».
- source_word: powers of Satan
  choice: os poderes de Satanás
  rationale: Mantém a formulação ampla e a personificação do testemunho, sem especificar se se trata de forças, domínio ou agentes espirituais.
- source_word: mischief
  choice: obra destrutiva
  rationale: Comunica o dano maligno pretendido num registro atual e digno; «maldade» seria possível, mas menos claramente dinâmica no contexto.
- source_word: concord
  choice: concórdia
  rationale: Preserva a ideia forte de união harmoniosa da fé comunitária e a dicção elevada do período.
- source_word: peace
  choice: paz
  rationale: Equivalente direto, preservando tanto a dimensão comunitária quanto a possível dimensão cósmica da afirmação.
- source_word: all warfare
  choice: toda guerra
  rationale: Mantém a imagem abrangente de conflito sem reduzi-la a mera discórdia interpessoal.
theological_decisions:
- issue: Natureza da ação de graças
  choice: dar graças a Deus
  alternative: celebrar a Eucaristia de Deus
  rationale: O testemunho inglês permite um sentido comum ou possivelmente litúrgico. Sem revisão direta do grego, a tradução evita impor uma identificação sacramental específica.
- issue: Como a concórdia se relaciona com a derrota do mal
  choice: pela concórdia da fé de vocês
  alternative: na concórdia da fé de vocês
  rationale: A formulação mantém a concórdia comunitária como esfera ou meio dessa derrota sem explicar mecanicamente a causalidade teológica.
- issue: Alcance da paz final
  choice: guerra entre as coisas do céu e as da terra
  alternative: guerra das coisas celestes e terrenas
  rationale: A redação principal torna legível a relação entre os dois âmbitos, enquanto a nota reconhece que a sintaxe do testemunho pode ser entendida de modo mais amplo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com «vocês» para o plural. Como o material fornecido é um testemunho inglês de domínio público e a revisão da tradição grega ainda está pendente, escolhas potencialmente técnicas ou sintaticamente ambíguas foram mantidas com cautela e, quando necessário, sinalizadas em nota.
