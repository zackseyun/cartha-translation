    text: 'Ou: «toda guerra das coisas celestiais e terrestres». O grego não esclarece de modo inequívoco se a expressão se refere a conflitos entre os dois âmbitos ou, mais amplamente, à guerra ligada a seres celestiais e terrestres.'
    reason: Preserva a ambiguidade sintática e semântica da expressão final, sem introduzir no texto principal a leitura mais específica «entre».
  revision_rationale: A revisão substitui formulações levemente interpretativas por equivalentes mais próximos da construção grega e elimina a especificação indevida de que a guerra ocorre necessariamente entre o céu e a terra. Mantêm-se o registro moderno, o plural «vocês» e a cautela quanto ao alcance técnico de «ação de graças».
