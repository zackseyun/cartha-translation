review_pass:
  verdict: revise
  source_fidelity: 'O rascunho acompanha bem o sentido do testemunho inglês e, em pontos verificáveis na tradição grega média, preserva a estrutura principal: a notícia da paz em Antioquia, o envio de um diácono, a alegria com a assembleia e a diversidade de enviados pelas igrejas vizinhas. Contudo, «terna compaixão» torna σπλάγχνα excessivamente abstrato; «terno afeto» comunica melhor a linguagem de profunda afeição. Além disso, «pelo nome de Deus» pode sugerir meio ou causa, enquanto εἰς ὄνομα θεοῦ é mais naturalmente «em nome de Deus».'
  naturalness: O português é em geral claro, digno e natural. A mudança para «terno afeto» e «em nome de Deus» melhora a idiomaticidade sem perder o registro eclesial. «Quando eles estiverem reunidos» explicita de modo natural que o referente são os cristãos de Antioquia, não os destinatários da carta.
  terminology: «diácono», «bispos» e «presbíteros» preservam adequadamente as designações históricas. «Embaixador de Deus» mantém a imagem enfática θεοῦ πρεσβεύτην. «O Nome» é uma boa preservação da expressão reverente e não deve ser identificado dogmaticamente; a nota pode ser mais precisa, sem alegar uma incerteza que o contexto imediato resolve parcialmente.
  issues:
  - severity: low
    issue: «terna compaixão» para «tender sympathy» / σπλάγχνα
    rationale: A expressão grega remete a afeto profundo, entranhado e solidário. «Terno afeto» é mais natural e menos redutor do que «compaixão», que pode restringir o sentido à pena pelo sofrimento.
  - severity: medium
    issue: «pelo nome de Deus»
    rationale: A construção «em nome de Deus» traduz mais diretamente εἰς ὄνομα θεοῦ e evita a leitura instrumental ou causal de «pelo».
  - severity: low
    issue: Nota sobre «o Nome»
    rationale: A nota atual diz que não se explicita se o referente é Deus ou Jesus Cristo. Embora a fórmula isolada permaneça reverente e não seja desenvolvida, o uso subsequente de «nome de Deus» oferece contexto. A nota deve registrar a preservação da fórmula sem forçar uma identificação teológica.
  revised_text: 'Visto que, em resposta à oração de vocês e ao terno afeto que têm em Cristo Jesus, fui informado de que a igreja que está em Antioquia da Síria está em paz, convém que vocês, como igreja de Deus, designem um diácono para ir até lá como embaixador de Deus, a fim de alegrar-se com eles quando estiverem reunidos e glorificar o Nome.[a]


    Bem-aventurado em Jesus Cristo é aquele que for considerado digno de tal serviço; e vocês mesmos serão glorificados. Se desejarem, não lhes será impossível fazer isso em nome de Deus, assim como as igrejas mais próximas enviaram bispos, e outras, presbíteros e diáconos.[b]'
  revised_footnotes:
  - marker: a
    text: «O Nome» preserva uma fórmula reverente do texto. A tradução não explicita além do que o contexto permite o referente da expressão.
    reason: Conservar a formulação reverente sem impor uma identificação teológica.
  - marker: b
    text: Esta tradução é provisória, baseada no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega ainda está pendente.
    reason: Declarar com transparência a base textual limitada do rascunho.
  revision_rationale: 'Foram feitos apenas ajustes seguros: «terno afeto» representa melhor a afeição profunda expressa pela fonte; «alegrar-se com eles» reproduz a reciprocidade de «congratulate them»/συγχαρῆναι; e «em nome de Deus» reflete mais diretamente a construção da fonte. Mantêm-se a voz passiva em «serão glorificados», os títulos eclesiais históricos e a distinção entre os grupos de igrejas que enviaram representantes.'
