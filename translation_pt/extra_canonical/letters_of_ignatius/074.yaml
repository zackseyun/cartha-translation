review_pass:
  verdict: revise
  source_fidelity: O rascunho transmite com boa fidelidade o sentido do testemunho inglês e, nos pontos verificáveis da tradição grega média, preserva a paz da igreja em Antioquia, o envio de um diácono como representante de Deus, a congratulação da comunidade reunida e a enumeração dos ministros enviados. Contudo, «em resposta à ... terna compaixão» trata a compaixão como algo a que se dá resposta; a construção de partida associa a notícia à oração e à profunda afeição dos destinatários. Também convém conservar o presente de «não é impossível para vocês».
  naturalness: O português é geralmente claro, digno e contemporâneo. «Quando estiverem reunidos» pode, porém, ter como antecedente os destinatários em Filadélfia, e «não lhes será impossível» é menos direto e desloca o tempo verbal. Pequenos ajustes eliminam essas ambiguidades sintáticas.
  terminology: «Diácono», «bispos» e «presbíteros» são escolhas adequadas e historicamente reconhecíveis. «Embaixador de Deus» comunica bem a metáfora. «O Nome» preserva corretamente a expressão reverente sem decidir seu referente; a nota correspondente é apropriada.
  issues:
  - severity: medium
    issue: Relação entre a notícia e a compaixão dos destinatários
    rationale: «Em resposta à oração ... e à terna compaixão» sugere que a compaixão recebeu uma resposta. A formulação grega subjacente e o testemunho indicam antes que a notícia vem em conformidade com/à vista da oração e da afeição solidária deles.
  - severity: low
    issue: Antecedente potencialmente ambíguo em «quando estiverem reunidos»
    rationale: O contexto requer que a igreja de Antioquia, e não os leitores, seja a comunidade reunida. «Quando eles se reunirem» torna isso explícito sem acrescentar informação.
  - severity: low
    issue: Tempo e construção de «não lhes será impossível»
    rationale: A expressão corresponde mais naturalmente a «não é impossível para vocês», preservando o presente da declaração e a referência direta aos destinatários.
  revised_text: 'Visto que, em atenção à oração de vocês e à terna compaixão que têm em Cristo Jesus, fui informado de que a igreja em Antioquia da Síria está em paz, convém que vocês, como igreja de Deus, designem um diácono para ir até lá como embaixador de Deus, a fim de felicitá-los quando eles se reunirem e glorificar o Nome.[a]



    Bem-aventurado em Jesus Cristo aquele que for considerado digno de tal serviço; e vocês mesmos serão glorificados. Se desejarem, não é impossível para vocês fazer isso pelo nome de Deus, assim como as igrejas mais próximas enviaram bispos, e outras, presbíteros e diáconos.[b]'
  revised_footnotes:
  - marker: a
    text: «O Nome» é uma forma reverente de referência divina; o texto não explicita aqui se se trata do nome de Deus ou de Jesus Cristo.
    reason: Preservar a ambiguidade teológica real da expressão.
  - marker: b
    text: Esta tradução é provisória, baseada no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega ainda está pendente.
    reason: Declarar com transparência a base textual limitada do rascunho.
  revision_rationale: A revisão ajusta a relação sintática entre a oração, a compaixão e a notícia recebida; esclarece que os cristãos de Antioquia são os que se reúnem; e restitui a construção presente «não é impossível para vocês». Mantêm-se a terminologia eclesial, a passiva de «serão glorificados», a metáfora de representação divina e a ambiguidade deliberada de «o Nome».
