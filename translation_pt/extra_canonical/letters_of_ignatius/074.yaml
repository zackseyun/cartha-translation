base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/074.yaml
  text: 'Seeing that in answer to your prayer and to the tender sympathy which you have in Christ Jesus, it has been reported to me that the church which is in Antioch of Syria has peace, it is becoming for you, as a church of God, to appoint a deacon to go there as God’s ambassador, that he may congratulate them when they are assembled together, and may glorify the Name.


    Blessed in Jesus Christ is he who shall be counted worthy of such a ministration; and you yourselves shall be glorified. Now if you desire it, it is not impossible for you to do this for the name of God, even as the churches which are nearest have sent bishops, and others presbyters and deacons.'
translation:
  language: pt
  text: 'Visto que, em atenção à oração de vocês e à terna compaixão que têm em Cristo Jesus, fui informado de que a igreja em Antioquia da Síria está em paz, convém que vocês, como igreja de Deus, designem um diácono para ir até lá como embaixador de Deus, a fim de felicitá-los quando eles se reunirem e glorificar o Nome.[a]



    Bem-aventurado em Jesus Cristo aquele que for considerado digno de tal serviço; e vocês mesmos serão glorificados. Se desejarem, não é impossível para vocês fazer isso pelo nome de Deus, assim como as igrejas mais próximas enviaram bispos, e outras, presbíteros e diáconos.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «O Nome» é uma forma reverente de referência divina; o texto não explicita aqui se se trata do nome de Deus ou de Jesus Cristo.
    reason: Preservar a ambiguidade teológica real da expressão.
  - marker: b
    text: Esta tradução é provisória, baseada no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega ainda está pendente.
    reason: Declarar com transparência a base textual limitada do rascunho.
lexical_decisions:
- source_word: tender sympathy
  choice: terna compaixão
  rationale: Expressa afeto solidário e profundo em português natural, sem reduzir a expressão a mero sentimento.
- source_word: hath peace
  choice: se encontra em paz
  rationale: Preserva a ideia de uma condição restaurada de paz na comunidade, sem especificar uma causa não declarada.
- source_word: God’s ambassador
  choice: embaixador de Deus
  rationale: Mantém a metáfora representativa do testemunho inglês e seu tom solene.
- source_word: ministration
  choice: serviço
  rationale: Termo claro e digno para uma incumbência ministerial, evitando restringi-la indevidamente a um ofício técnico.
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva a designação eclesial histórica, amplamente reconhecível em português.
theological_decisions:
- issue: Referência ao «Nome»
  choice: o Nome
  alternative: o nome de Deus / o nome de Jesus
  rationale: Mantém a formulação reverente e a ambiguidade do testemunho, sem identificar explicitamente o referente onde o texto não o faz.
- issue: Agente da glorificação dos destinatários
  choice: vocês mesmos serão glorificados
  alternative: vocês mesmos receberão honra
  rationale: Preserva a voz passiva e a tensão teológica, sem determinar se Deus ou a comunidade é o agente.
- issue: Diversidade dos enviados pelas igrejas
  choice: bispos, e outras, presbíteros e diáconos
  alternative: alguns bispos, outros presbíteros e diáconos
  rationale: Mantém a distinção entre igrejas que enviaram diferentes representantes, sem harmonizar os ofícios.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais como «vocês». A estrutura foi suavemente ajustada para fluidez, preservando o caráter eclesial, a voz passiva e as ambiguidades do testemunho disponível.
