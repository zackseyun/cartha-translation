base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/017.yaml
  text: 'Do not be deceived, my brethren. Those who corrupt households will not inherit the kingdom of God.


    If those who do such things according to the flesh are put to death, how much more if a man, through evil teaching, corrupts the faith of God for which Jesus Christ was crucified. Such a man, having defiled himself, will go into the unquenchable fire; and likewise also the one who listens to him.'
translation:
  language: pt
  text: 'Não se deixem enganar, meus irmãos. Os que corrompem famílias[a] não herdarão o reino de Deus.


    Se os que praticam tais coisas segundo a carne morrem, quanto mais aquele que, por meio de um ensino perverso, corrompe a fé de Deus, pela qual Jesus Cristo foi crucificado.[b] Esse, tendo-se contaminado, irá para o fogo inextinguível; e o mesmo acontecerá com aquele que lhe dá ouvidos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «lares» ou «casas». A expressão pode referir-se à corrupção de famílias ou unidades domésticas.'
    reason: O termo original se refere a «casas» ou unidades domésticas; «famílias» comunica o provável sentido social sem excluir as alternativas.
  - marker: b
    text: A expressão «fé de Deus» e a relação indicada por «pela qual» admitem mais de uma compreensão; a tradução preserva essa ambiguidade.
    reason: Evita decidir prematuramente entre fé pertencente a Deus, fé em Deus ou fé proveniente dele, bem como entre possíveis nuances da oração relativa.
lexical_decisions:
- source_word: corrupters of houses
  choice: os que corrompem famílias
  rationale: O testemunho inglês traz expressão literalmente ligada a 'casas', mas, neste contexto, 'famílias' comunica com mais naturalidade o provável sentido social de lares ou unidades domésticas, sem especificar a forma da corrupção.
- source_word: after the flesh
  choice: segundo a carne
  rationale: Mantém a formulação teologicamente carregada e sua possível ambiguidade, em vez de reduzi-la apenas a atos físicos ou sexuais.
- source_word: evil doctrine
  choice: ensino perverso
  rationale: Expressa uma instrução moral e religiosamente nociva em português corrente e digno.
- source_word: the faith of God
  choice: a fé de Deus
  rationale: Preserva a construção ambígua do testemunho, que pode apontar para a fé pertencente a Deus, procedente dele ou dirigida a ele.
- source_word: hearkeneth unto him
  choice: lhe dá ouvidos
  rationale: Equivale naturalmente a escutar com acolhimento ou obediência, não à mera percepção auditiva.
theological_decisions:
- issue: Relação entre a fé e a crucificação de Jesus Cristo
  choice: a fé de Deus, pela qual Jesus Cristo foi crucificado
  alternative: a fé em Deus, por causa da qual Jesus Cristo foi crucificado
  rationale: A redação conserva a relação gramatical do testemunho e evita definir de modo mais estreito tanto 'fé de Deus' quanto o valor causal da oração relativa.
- issue: Destino daquele que acolhe o falso mestre
  choice: também irá aquele que lhe dá ouvidos
  alternative: o mesmo acontecerá com aquele que lhe dá ouvidos
  rationale: Explicita apenas o referente verbal exigido em português, mantendo que o ouvinte participante compartilha o destino descrito.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Tradução provisória fundamentada no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega da recensão média permanece necessária.
