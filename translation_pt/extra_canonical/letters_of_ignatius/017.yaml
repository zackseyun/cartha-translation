review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido. «Segundo a carne», «ensino perverso», «a fé de Deus», «fogo inextinguível» e «lhe dá ouvidos» preservam adequadamente o teor e as ambiguidades relevantes. Contudo, «pela qual Jesus Cristo foi crucificado» pode ser lido em português como meio instrumental; «por causa da qual» representa com maior clareza a relação causal expressa pelo testemunho («for which») sem resolver indevidamente o sentido de «fé de Deus».
  naturalness: O texto é claro, solene e natural em português contemporâneo. «Lares» mantém um campo semântico mais amplo que «famílias», que poderia restringir «houses» exclusivamente às relações familiares.
  terminology: «Reino de Deus», «carne», «fé de Deus» e «fogo inextinguível» são escolhas consistentes e adequadas. A nota sobre «fé de Deus» deve continuar a assinalar a ambiguidade do genitivo, mas a oração relativa é melhor vertida causalmente.
  issues:
  - severity: medium
    issue: Possível leitura instrumental de «pela qual Jesus Cristo foi crucificado».
    rationale: Embora «pela qual» possa ocasionalmente ter valor causal, seu uso corrente também sugere instrumento ou meio. «Por causa da qual» torna explícito o valor causal do testemunho inglês sem impor uma leitura doutrinária para «fé de Deus».
  - severity: low
    issue: «Famílias» restringe o alcance de «houses».
    rationale: O termo do testemunho pode abranger lares ou unidades domésticas, não apenas famílias. «Lares», acompanhado de nota, preserva melhor essa amplitude.
  revised_text: 'Não se deixem enganar, meus irmãos. Os que corrompem lares[a] não herdarão o reino de Deus.


    Se os que praticam tais coisas segundo a carne são condenados à morte, quanto mais aquele que, por meio de um ensino perverso, corrompe a fé de Deus, por causa da qual Jesus Cristo foi crucificado.[b] Esse, tendo-se contaminado, irá para o fogo inextinguível; e do mesmo modo também irá aquele que lhe dá ouvidos.'
  revised_footnotes:
  - marker: a
    text: 'Ou: “famílias” ou “casas”. A expressão pode referir-se à corrupção de lares ou unidades domésticas.'
    reason: O testemunho disponível usa “houses”, e a revisão direta do grego ainda está pendente.
  - marker: b
    text: A expressão “fé de Deus” admite mais de uma compreensão; a tradução preserva essa ambiguidade. “Por causa da qual” expressa a relação causal da oração relativa.
    reason: Evita decidir prematuramente entre fé pertencente a Deus, fé em Deus ou fé proveniente dele, e evita uma leitura instrumental da relação com a crucificação.
  revision_rationale: A revisão substitui «famílias» por «lares» para não estreitar o alcance de «houses» e substitui «pela qual» por «por causa da qual» para comunicar de forma inequívoca a relação causal do testemunho. O restante do texto é mantido, inclusive as ambiguidades teológicas e o registro dignificado.
