review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha de perto a tradição grega da recensão média e o testemunho inglês fornecido. Contudo, «são condenados à morte» introduz um sentido judicial que não está expresso: o verbo indica que os que praticam tais coisas «morrem»/«são mortos». A formulação revista evita essa especificação.'
  naturalness: O português é claro, moderno e de registro apropriado. «Não se deixem enganar», «ensino perverso» e «lhe dá ouvidos» são naturais. «Quanto mais» preserva adequadamente a progressão retórica.
  terminology: «Reino de Deus», «segundo a carne», «fé de Deus» e «fogo inextinguível» são escolhas consistentes e preservam termos e ambiguidades relevantes. «Famílias», com nota que registra «lares» e «casas», é uma solução legível para a expressão relativa a unidades domésticas.
  issues:
  - severity: medium
    issue: «são condenados à morte»
    rationale: A expressão acrescenta uma condenação formal/judicial. O texto antigo e o testemunho inglês falam de morrer ou ser morto, sem explicitar uma sentença judicial; «morrem» preserva melhor o enunciado.
  revised_text: 'Não se deixem enganar, meus irmãos. Os que corrompem famílias[a] não herdarão o reino de Deus.


    Se os que praticam tais coisas segundo a carne morrem, quanto mais aquele que, por meio de um ensino perverso, corrompe a fé de Deus, pela qual Jesus Cristo foi crucificado.[b] Esse, tendo-se contaminado, irá para o fogo inextinguível; e o mesmo acontecerá com aquele que lhe dá ouvidos.'
  revised_footnotes:
  - marker: a
    text: 'Ou: «lares» ou «casas». A expressão pode referir-se à corrupção de famílias ou unidades domésticas.'
    reason: O termo original se refere a «casas» ou unidades domésticas; «famílias» comunica o provável sentido social sem excluir as alternativas.
  - marker: b
    text: A expressão «fé de Deus» e a relação indicada por «pela qual» admitem mais de uma compreensão; a tradução preserva essa ambiguidade.
    reason: Evita decidir prematuramente entre fé pertencente a Deus, fé em Deus ou fé proveniente dele, bem como entre possíveis nuances da oração relativa.
  revision_rationale: A única alteração necessária substitui a formulação judicialmente específica «são condenados à morte» por «morrem». Também se explicita no desfecho, por meio de «o mesmo acontecerá», que quem dá ouvidos ao corruptor compartilha o destino anteriormente enunciado, sem acrescentar conteúdo.
