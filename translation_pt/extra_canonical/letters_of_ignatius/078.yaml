review_pass:
  verdict: revise
  source_fidelity: 'A redação preserva bem a sequência e a argumentação do testemunho e coincide, nos pontos centrais, com o grego da recensão média: o sofrimento vicário, sua realidade, a auto-ressurreição, a polêmica contra os que a reduzem à aparência e o desfecho dirigido a eles. Contudo, «certos descrentes» é menos preciso para ἄπιστοι do que «certos incrédulos», e «conforme suas opiniões» enfraquece o verbo φρονοῦσιν (“pensam”, “sustentam”).'
  naturalness: O texto é claro e moderno. «Sendo eles próprios meras aparências» é compreensível, mas «sendo eles próprios apenas aparência» reproduz mais diretamente o jogo do grego τὸ δοκεῖν e soa menos como se se tratasse de várias “aparências” concretas.
  terminology: «Ressuscitou a si mesmo» conserva corretamente a agência reflexiva do testemunho e do grego ἑαυτὸν ... ἀνέστησεν. «Demoníacos» traduz de modo mais próximo δαιμονικοῖς do que a perífrase comparativa «semelhantes a demônios», sem afirmar que sejam literalmente demônios. A nota sobre o trecho entre colchetes continua necessária, pois a restauração está assinalada no testemunho-base.
  issues:
  - severity: medium
    issue: «descrentes» para ἄπιστοι
    rationale: Embora possível em contexto religioso, «incrédulos» é o equivalente mais direto e natural para o termo polêmico grego e para “unbelievers” do testemunho.
  - severity: low
    issue: «conforme suas opiniões» para καθὼς φρονοῦσιν
    rationale: O grego focaliza o que essas pessoas pensam ou sustentam, não meramente as suas opiniões como objetos abstratos.
  - severity: low
    issue: «meras aparências» para αὐτοὶ ὄντες τὸ δοκεῖν
    rationale: O singular abstrato τὸ δοκεῖν (“o parecer”, “a aparência”) sustenta melhor «sendo eles próprios apenas aparência» e preserva o paralelo verbal com o sofrimento supostamente aparente.
  - severity: low
    issue: «semelhantes a demônios» para δαιμονικοῖς
    rationale: A construção comparativa é interpretativa. «Demoníacos» representa mais diretamente o adjetivo, sem alterar a referência polêmica.
  revised_text: 'Pois ele sofreu todas essas coisas por nossa causa [para que fôssemos salvos][a]. Ele sofreu verdadeiramente, assim como também ressuscitou a si mesmo verdadeiramente. Não foi como dizem certos incrédulos: que ele sofreu apenas em aparência, sendo eles próprios apenas aparência. E, conforme pensam, assim também lhes acontecerá, pois são sem corpo e demoníacos.'
  revised_footnotes:
  - marker: a
    text: As palavras entre colchetes preservam o sinal de restauração presente no testemunho inglês utilizado. A conferência direta com o grego ainda está pendente.
    reason: Distingue material restaurado ou textualmente sinalizado de palavras transmitidas sem essa marca e declara a limitação da base de redação.
  revision_rationale: A revisão faz ajustes lexicais e sintáticos de baixo risco para aproximar a tradução do grego e do testemunho inglês, especialmente no jogo com “aparência” e na caracterização dos opositores. Mantém-se o trecho restaurado entre colchetes, a nota correspondente e a formulação reflexiva da ressurreição.
