revisions:
- from: 'Pois ele sofreu todas essas coisas por nossa causa [para que fôssemos salvos][a]. Ele sofreu verdadeiramente, assim como também verdadeiramente ressuscitou a si mesmo. Não foi como dizem certos descrentes: que ele sofreu apenas em aparência, sendo eles próprios meras aparências. E, conforme suas opiniões, assim também lhes acontecerá, pois são sem corpo e semelhantes a demônios.'
  to: 'Pois ele sofreu todas essas coisas por nossa causa [para que fôssemos salvos][a]. Ele sofreu verdadeiramente, assim como também ressuscitou a si mesmo verdadeiramente. Não foi como dizem certos incrédulos: que ele sofreu apenas em aparência, sendo eles próprios apenas aparência. E, conforme pensam, assim também lhes acontecerá, pois são sem corpo e demoníacos.'
  rationale: A revisão faz ajustes lexicais e sintáticos de baixo risco para aproximar a tradução do grego e do testemunho inglês, especialmente no jogo com “aparência” e na caracterização dos opositores. Mantém-se o trecho restaurado entre colchetes, a nota correspondente e a formulação reflexiva da ressurreição.
