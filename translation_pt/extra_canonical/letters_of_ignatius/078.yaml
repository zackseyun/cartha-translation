base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/078.yaml
  text: For he suffered all these things for our sake [so that we might be saved]. He truly suffered, just as he truly raised himself. It was not as certain unbelievers say—that he suffered only in appearance, while they themselves are mere appearances. What they believe will also happen to them, for they are bodiless and demon-like.
translation:
  language: pt
  text: 'Pois ele sofreu todas essas coisas por nossa causa [para que fôssemos salvos][a]. Ele sofreu verdadeiramente, assim como também ressuscitou a si mesmo verdadeiramente. Não foi como dizem certos incrédulos: que ele sofreu apenas em aparência, sendo eles próprios apenas aparência. E, conforme pensam, assim também lhes acontecerá, pois são sem corpo e demoníacos.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes preservam o sinal de restauração presente no testemunho inglês utilizado. A conferência direta com o grego ainda está pendente.
    reason: Distingue material restaurado ou textualmente sinalizado de palavras transmitidas sem essa marca e declara a limitação da base de redação.
lexical_decisions:
- source_word: suffered truly
  choice: sofreu verdadeiramente
  rationale: Mantém a ênfase enfática do testemunho contra a ideia de um sofrimento apenas aparente.
- source_word: in semblance / mere semblance
  choice: apenas em aparência / meras aparências
  rationale: Preserva em português o jogo verbal entre a alegada aparência do sofrimento de Cristo e a caracterização dos descrentes.
- source_word: without body
  choice: sem corpo
  rationale: Expressão clara e direta para leitores atuais, sem acrescentar uma explicação metafísica ausente no testemunho.
- source_word: demon-like
  choice: semelhantes a demônios
  rationale: Reproduz a comparação do testemunho sem identificar essas pessoas literalmente como demônios.
theological_decisions:
- issue: A agência de Cristo em sua ressurreição
  choice: ressuscitou a si mesmo
  alternative: foi ressuscitado
  rationale: O testemunho inglês fornecido apresenta uma construção reflexiva explícita (“raised Himself”); a tradução a conserva, sem harmonizá-la silenciosamente com formulações passivas de outras tradições textuais.
- issue: A realidade do sofrimento de Cristo
  choice: sofreu verdadeiramente ... apenas em aparência
  alternative: sofreu de fato ... aparentemente
  rationale: A formulação mantém o contraste teológico central e a repetição ligada a “aparência”, sem expandir a polêmica com terminologia denominacional posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação permanece provisória porque foi preparada a partir do testemunho inglês de domínio público; a revisão direta da tradição manuscrita grega da recensão média ainda está pendente.
