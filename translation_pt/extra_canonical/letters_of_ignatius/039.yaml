review_pass:
  verdict: revise
  source_fidelity: A abertura, os destinatários e os termos principais correspondem ao testemunho fornecido. Contudo, «que vive em paz» desloca «having peace» para uma caracterização mais ativa, e «em nossa ressurreição» não preserva o meio expresso por «through». A fórmula final «alegria abundante» perde o sentido explícito de saudação, embora χαίρειν tenha origem no campo semântico de alegrar-se.
  naturalness: O texto tem registro epistolar digno e é amplamente natural. «Por meio de nossa ressurreição para ele» permanece deliberadamente difícil, como o original, mas a nota torna a dificuldade inteligível. «À maneira apostólica» é mais idiomático e mais próximo de «after the apostolic fashion» do que «segundo o caráter apostólico».
  terminology: «Teóforo», «paixão», «carne e espírito» e «plenitude divina» são escolhas adequadas e cautelosas. «Muitas saudações» restitui a função de fórmula epistolar de «abundant greeting» sem exigir uma interpretação teológica de χαίρειν.
  issues:
  - severity: medium
    issue: «que vive em paz» para «having peace»
    rationale: A expressão portuguesa pode sugerir uma conduta ou estado contínuo da comunidade. «Que tem paz» conserva mais diretamente a posse/condição indicada pelo testemunho.
  - severity: medium
    issue: «em nossa ressurreição» para «through our resurrection»
    rationale: A preposição «em» muda a relação instrumental indicada pelo testemunho inglês. «Por meio de» preserva essa relação, sem resolver a construção final difícil.
  - severity: medium
    issue: «alegria abundante» para «abundant greeting»
    rationale: Ainda que a fórmula grega tenha afinidade etimológica com alegria, neste contexto ela funciona como despedida/saudação epistolar. «Muitas saudações» preserva essa função comunicativa.
  - severity: low
    issue: «segundo o caráter apostólico» para «after the apostolic fashion»
    rationale: «À maneira apostólica» é uma equivalência mais direta, natural e menos interpretativa.
  revised_text: Inácio, também chamado Teóforo,[a] à igreja amada por Deus, Pai de Jesus Cristo — à santa igreja que está em Trales, na Ásia, escolhida e digna de Deus, que tem paz na carne e no espírito por meio da paixão de Jesus Cristo, nossa esperança, por meio de nossa ressurreição para ele.[b] Também saúdo essa igreja na plenitude divina, à maneira apostólica, e desejo-lhe muitas saudações.
  revised_footnotes:
  - marker: a
    text: Teóforo pode ser entendido como «portador de Deus»; também admite a nuance de «levado por Deus».
    reason: O título grego comporta mais de uma nuance, que não deve ser resolvida silenciosamente na tradução.
  - marker: b
    text: A expressão «por meio de nossa ressurreição para ele» é difícil. Também pode ser entendida como referência à ressurreição que nos conduz a ele.
    reason: Preserva a ambiguidade da relação entre ressurreição, esperança e orientação para Cristo, sem tornar a construção mais definida do que o testemunho permite.
  revision_rationale: 'A revisão conserva a estrutura e as ambiguidades cristológicas e escatológicas do testemunho, mas corrige três deslocamentos de sentido: a posse de paz, o valor instrumental ligado à ressurreição e o caráter epistolar da saudação final. Também substitui uma formulação interpretativa por «à maneira apostólica», mais próxima do texto de controle.'
