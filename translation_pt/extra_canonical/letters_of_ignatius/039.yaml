base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/039.yaml
  text: Ignatius, who is also called Theophorus, to the church beloved by God the Father of Jesus Christ—the holy church in Tralles of Asia, chosen and worthy of God, having peace in flesh and spirit through the passion of Jesus Christ, who is our hope through our resurrection unto him. I also greet this church in the divine fullness, after the apostolic fashion, and wish her abundant greeting.
translation:
  language: pt
  text: 'Inácio, também chamado Teóforo,[a] à igreja amada por Deus, o Pai de Jesus Cristo: à santa igreja que está em Trales, na Ásia, escolhida e digna de Deus, que vive em paz na carne e no espírito por meio da paixão de Jesus Cristo, nossa esperança em nossa ressurreição para ele.[b] Saúdo também essa igreja na plenitude divina, segundo o caráter apostólico, e desejo-lhe alegria abundante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teóforo pode ser entendido como «portador de Deus»; também admite a nuance de «levado por Deus».
    reason: O título grego comporta mais de uma nuance, que não deve ser resolvida silenciosamente na tradução.
  - marker: b
    text: A expressão «para ele» é difícil e também pode ser entendida como «na ressurreição que nos leva a ele».
    reason: Preserva a ambiguidade da relação entre ressurreição, esperança e movimento ou orientação para Cristo.
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Mantém como nome ou título tradicional a forma transliterada, sem decidir no corpo do texto entre as possíveis nuances de «portador de Deus» e «levado por Deus».
- source_word: passion
  choice: paixão
  rationale: Emprega o termo cristão histórico para o sofrimento e a morte de Jesus, preservando a densidade teológica da expressão.
- source_word: in flesh and spirit
  choice: na carne e no espírito
  rationale: Conserva o paralelismo antropológico do testemunho, sem reduzi-lo a «corpo e alma» nem explicar a relação entre os termos.
- source_word: Divine plenitude
  choice: plenitude divina
  rationale: Reproduz a formulação do testemunho inglês fornecido; a confirmação exata do adjetivo aguarda revisão direta do grego.
- source_word: apostolic fashion
  choice: segundo o caráter apostólico
  rationale: Expressa de modo natural, mas relativamente formal, a ideia de uma saudação marcada pelo padrão ou caráter apostólico.
- source_word: abundant greeting
  choice: alegria abundante
  rationale: Traduz o valor idiomático da fórmula epistolar de saudação, ligada ao verbo grego «alegrar-se», em vez de repetir artificialmente «saudação».
theological_decisions:
- issue: Relação entre Deus Pai e Jesus Cristo na abertura
  choice: «Deus, o Pai de Jesus Cristo»
  alternative: «Deus Pai e por Jesus Cristo» ou «Deus, Pai de Jesus Cristo»
  rationale: Segue a sintaxe do testemunho fornecido e mantém explícita a designação de Deus como Pai de Jesus Cristo, sem introduzir uma segunda agência não atestada.
- issue: Esperança e ressurreição
  choice: «Jesus Cristo, nossa esperança em nossa ressurreição para ele»
  alternative: «Jesus Cristo, nossa esperança, mediante a ressurreição que nos leva a ele»
  rationale: Preserva a construção difícil e sua tensão escatológica, evitando decidir se a frase descreve direção, finalidade ou união com Cristo.
- issue: Paz na carne e no espírito por meio da paixão
  choice: Mantida a conexão causal da paz com a paixão de Jesus Cristo
  alternative: Reformular como paz interior e exterior concedida pelo sofrimento de Cristo
  rationale: Não explicita uma doutrina da expiação além do que a frase afirma e conserva a abrangência de «carne e espírito».
translation_notes:
  register: Português atual, digno e acessível, com cadência de prólogo epistolar antigo. «Igreja» permanece em minúscula como comunidade local; «Trales» usa a forma portuguesa corrente. O rascunho é necessariamente provisório, pois foi elaborado a partir do testemunho inglês de domínio público fornecido, com revisão direta do grego ainda pendente.
