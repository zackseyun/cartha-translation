review_pass:
  verdict: revise
  source_fidelity: A revisão permanece fiel ao testemunho inglês fornecido, em especial à estrutura de dedicatória, à dupla qualificação da igreja e à construção deliberadamente difícil «through our resurrection unto Him». A formulação portuguesa foi ajustada para não transformar «fashion» em uma interpretação de «caráter» e para refletir a fórmula epistolar final como saudação.
  naturalness: O rascunho é geralmente claro, mas «nossa esperança em nossa ressurreição para ele» e «segundo o caráter apostólico» soam pouco naturais e introduzem, no segundo caso, uma nuance não exigida. «Muitas saudações» é uma fórmula portuguesa mais idiomática para a despedida/saudação abundante.
  terminology: «Teóforo», «paixão», «carne e espírito», «plenitude divina» e «eleita» preservam bem o registro cristão antigo sem impor leituras confessionais. «À maneira apostólica» é mais próximo e menos interpretativo do que «segundo o caráter apostólico».
  issues:
  - severity: medium
    issue: «segundo o caráter apostólico» interpreta «after the apostolic fashion» como uma qualidade de caráter.
    rationale: A expressão do testemunho indica modo ou maneira; «à maneira apostólica» conserva isso sem acrescentar uma caracterização psicológica ou institucional.
  - severity: medium
    issue: «nossa esperança em nossa ressurreição para ele» torna opaca a relação instrumental expressa por «through».
    rationale: «Mediante nossa ressurreição para ele» preserva o vínculo com a esperança e a orientação a Cristo, mantendo a dificuldade da expressão sem substituir «through» por uma relação meramente locativa.
  - severity: low
    issue: «alegria abundante» desloca a fórmula de saudação para um desejo abstrato de alegria.
    rationale: «Muitas saudações» é fórmula epistolar natural e conserva melhor o sentido de «abundant greeting».
  revised_text: 'Inácio, também chamado Teóforo,[a] àquela que é amada por Deus, o Pai de Jesus Cristo: à santa igreja que está em Trales, na Ásia, eleita e digna de Deus, que tem paz na carne e no espírito por meio da paixão de Jesus Cristo, que é nossa esperança mediante nossa ressurreição para ele.[b] Saúdo também essa igreja na plenitude divina, à maneira apostólica, e lhe desejo muitas saudações.'
  revised_footnotes:
  - marker: a
    text: Teóforo pode ser entendido como «portador de Deus»; também admite a nuance de «levado por Deus».
    reason: O título grego comporta mais de uma nuance, que não deve ser resolvida silenciosamente na tradução.
  - marker: b
    text: A expressão «para ele» é difícil e também pode ser entendida como «na ressurreição que nos leva a ele».
    reason: Preserva a ambiguidade da relação entre ressurreição, esperança e movimento ou orientação para Cristo.
  revision_rationale: A revisão melhora a idiomaticidade e a precisão sem exceder o testemunho inglês de base. Mantém-se a ambiguidade da ressurreição «para ele», sinalizada pela nota, e não se introduz nenhuma explicação doutrinária. Como a revisão direta do grego ainda está pendente, «plenitude divina» é mantida conforme o audit trail disponível.
