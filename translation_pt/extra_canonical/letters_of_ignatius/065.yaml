  english_witness: 'This your bishop I have found to hold the ministry which pertaineth to the common weal, not of himself or through men, nor yet for vain glory, but in the love of God the Father and the Lord Jesus Christ. And I am amazed at his forbearance;


    whose silence is more powerful than others speech. For he is attuned in harmony with the commandments, as a lyre with its strings. Wherefore my soul blesseth his godly mind, for I have found that it is virtuous and perfect--even the imperturbable and calm temper which he hath, while living in all godly forbearance.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/065.yaml
  text: 'I have found that this bishop of yours holds the ministry that serves the common good, not from himself or through people, nor for vain glory, but in the love of God the Father and the Lord Jesus Christ. I am amazed at his patience;


    his silence is more powerful than the speech of others. For he is attuned to the commandments in harmony, like a lyre with its strings. Therefore my soul blesses his godly mind, for I have found it virtuous and perfect—even the untroubled and calm disposition he has while living with all godly patience.'
translation:
  language: pt
  text: 'Descobri que este bispo de vocês exerce o ministério voltado para o bem comum, não por iniciativa própria nem por intermédio de pessoas, tampouco por vanglória, mas no amor de Deus Pai e do Senhor Jesus Cristo. Fico admirado com sua paciência: seu silêncio é mais poderoso que a fala de outros. Pois ele está em harmonia com os mandamentos, como a lira com suas cordas. Por isso, minha alma bendiz sua mente piedosa, pois descobri que ela é virtuosa e perfeita — assim como a disposição serena e imperturbável que ele mantém, vivendo com toda a paciência que vem de Deus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot. É necessária uma revisão direta da tradição manuscrita grega, especialmente para confirmar as nuances de “paciência”, “mente piedosa” e da frase final.
    reason: O material fornecido informa que a revisão do texto grego ainda está pendente; a nota torna transparente a base textual indireta e os principais pontos que exigem confirmação.
lexical_decisions:
- source_word: ministry which pertaineth to the common weal
  choice: ministério voltado para o bem comum
  rationale: Preserva a dimensão pública e comunitária do serviço episcopal sem recorrer a formulação arcaica.
- source_word: not of himself or through men
  choice: não por iniciativa própria nem por intermédio de pessoas
  rationale: Expressa de modo natural a dupla negação do testemunho, sem determinar além dele se a referência é à origem, nomeação ou autoridade.
- source_word: vain glory
  choice: vanglória
  rationale: Termo português corrente em registro bíblico e patrístico, indicando busca vazia de honra pessoal.
- source_word: forbearance / patience
  choice: paciência
  rationale: Abrange tolerância, domínio próprio e perseverança; a repetição mantém a ligação retórica do trecho.
- source_word: godly mind
  choice: mente piedosa
  rationale: Conserva tanto o aspecto intelectual/disposicional quanto sua orientação para Deus.
- source_word: attuned in harmony
  choice: está em harmonia
  rationale: Mantém a metáfora musical desenvolvida pela comparação com a lira, evitando redundância pouco natural em português.
- source_word: imperturbable and calm temper
  choice: disposição serena e imperturbável
  rationale: Traduz uma qualidade estável de caráter e preserva os dois elementos descritivos.
theological_decisions:
- issue: Origem ou legitimidade do ministério episcopal
  choice: não por iniciativa própria nem por intermédio de pessoas
  alternative: não de si mesmo nem por meio de seres humanos
  rationale: A redação mantém a tensão entre iniciativa humana e procedência divina sem formular uma doutrina específica de sucessão, eleição ou ordenação.
- issue: Sentido de “godly” na paciência final
  choice: paciência que vem de Deus
  alternative: paciência piedosa
  rationale: A formulação comunica em português natural a orientação divina do atributo, mas não afirma tecnicamente se se trata de origem, semelhança ou devoção; a incerteza textual é indicada em nota.
- issue: Referente de “virtuous and perfect”
  choice: ela é virtuosa e perfeita
  alternative: ele é virtuoso e perfeito
  rationale: O testemunho inglês liga gramaticalmente os adjetivos à “mente piedosa”; a tradução preserva essa ligação, embora uma revisão direta do grego ainda seja necessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A imagem da lira foi preservada, bem como o paralelismo entre silêncio e fala. Evitaram-se arcaísmos, linguagem excessivamente eclesiástica e definições denominacionais do episcopado.
