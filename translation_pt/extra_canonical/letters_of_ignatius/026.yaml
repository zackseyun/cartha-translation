review_pass:
  verdict: revise
  source_fidelity: A redação segue de perto o testemunho inglês fornecido, mas «não se valham da juventude» não expressa com clareza «não presumir/tirar proveito da juventude», e «quem age assim» introduz uma condição que o texto não formula. «Não terá de prestar contas» também desloca a afirmação presente e modal do original.
  naturalness: O texto é geralmente claro e digno, mas «aquele que quis vocês» soa pouco natural e combina objeto coloquial com registro elevado. «A juventude que aparenta ter» e «aquele que os quis» oferecem formulações mais naturais sem resolver a ambiguidade assinalada.
  terminology: «Bispo», «presbíteros», «reverência», «sem fingimento» e «o Bispo de todos» são adequados. «Ceder-lhe lugar» reproduz melhor a metáfora de deferência de «give place/yield» do que «submeter-se», sem eliminar a dimensão de honra e reconhecimento.
  issues:
  - severity: medium
    issue: «não se valham da juventude do seu bispo»
    rationale: A expressão pode sugerir simplesmente fazer uso da juventude do bispo. O contexto pede não explorar ou tirar proveito de sua juventude.
  - severity: medium
    issue: «quem age assim» e «não terá de prestar contas»
    rationale: O testemunho faz uma declaração geral sobre quem tenta enganar o bispo visível e afirma que essa pessoa deve responder a Deus. A formulação proposta acrescenta uma condição e altera o modo/tempo.
  - severity: low
    issue: «aquele que quis vocês»
    rationale: Além de pouco fluente no registro do trecho, a construção com «vocês» como objeto destoa da linguagem formal circundante. «Aquele que os quis» preserva o verbo ambíguo do testemunho.
  revised_text: 'Sim, convém também que vocês não tirem proveito da juventude de seu bispo, mas, segundo o poder de Deus Pai, lhe tributem toda reverência. Pois aprendi que também os santos presbíteros não se aproveitaram da juventude que ele aparenta ter, mas lhe cedem lugar como a alguém prudente em Deus — contudo, não a ele, mas ao Pai de Jesus Cristo, o Bispo de todos.


    Portanto, para a honra daquele que os quis[a], é apropriado que obedeçam sem fingimento. Pois ninguém engana tanto este bispo visível quanto tenta defraudar aquele que é invisível; e, nesse caso, deve prestar contas não à carne, mas a Deus, que conhece as coisas ocultas.'
  revised_footnotes:
  - marker: a
    text: Ou, possivelmente, «daquele que os escolheu» ou «daquele que os chamou». A formulação do testemunho disponível é ambígua; a revisão direta do grego ainda está pendente.
    reason: Registra a incerteza lexical e referencial de «Him who desired you» sem escolher silenciosamente entre desejo, escolha ou chamado.
  revision_rationale: A revisão corrige a expressão relativa à juventude do bispo, preserva a imagem de deferência em «ceder lugar», evita introduzir uma condição ausente no texto e conserva a ambiguidade de «aquele que os quis» com nota. Mantém-se «Bispo de todos» para o Pai, como no testemunho, e o contraste entre o bispo visível e Deus, que conhece o oculto.
