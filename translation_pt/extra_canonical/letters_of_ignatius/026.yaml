  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Yea, and it becometh you also not to presume upon the youth of your bishop, but according to the power of God the Father to render unto him all reverence, even as I have learned that the holy presbyters also have not taken advantage of his outwardly youthful estate, but give place to him as to one prudent in God; yet not to him, but to the Father of Jesus Christ, even to the Bishop of all.


    For the honor therefore of Him that desired you, it is meet that ye should be obedient without dissimulation. For a man doth not so much deceive this bishop who is seen, as cheat that other who is invisible; and in such a case he must reckon not with flesh but with God who knoweth the hidden things.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/026.yaml
  text: 'Yes, and it is fitting for you also not to presume upon the youth of your bishop, but, in accordance with the power of God the Father, to show him every reverence. I have learned that the holy presbyters likewise have not taken advantage of his outwardly youthful condition, but yield to him as to one who is wise in God—yet not to him, but to the Father of Jesus Christ, the Bishop of all.


    Therefore, for the honor of Him who desired you, it is right that you should obey without pretense. For a person does not so much deceive this visible bishop as cheat the One who is invisible; and in such a case, that person must reckon not with flesh but with God, who knows the hidden things.'
translation:
  language: pt
  text: 'Sim, convém também que vocês não se valham da juventude do seu bispo, mas, de acordo com o poder de Deus Pai, lhe demonstrem toda reverência. Pois soube que os santos presbíteros também não se aproveitaram de sua aparente juventude, mas se submetem a ele como a alguém sábio em Deus — não, porém, a ele, mas ao Pai de Jesus Cristo, o Bispo de todos.


    Portanto, em honra daquele que quis vocês[a], convém que obedeçam sem fingimento. Pois quem age assim não engana tanto este bispo visível, mas procura defraudar aquele que é invisível; e, nesse caso, não terá de prestar contas à carne, mas a Deus, que conhece as coisas ocultas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, “daquele que os escolheu” ou “daquele que os chamou”. A formulação do testemunho disponível é ambígua; a revisão direta do grego ainda está pendente.
    reason: Registra a incerteza lexical e referencial sem resolvê-la silenciosamente.
lexical_decisions:
- source_word: presbyters
  choice: presbíteros
  rationale: Mantém o título eclesial antigo sem o identificar de modo exclusivo com terminologia denominacional posterior.
- source_word: give place / yield
  choice: se submetem
  rationale: Expressa a deferência prática e a aceitação da autoridade do bispo no contexto, em português corrente e digno.
- source_word: without dissimulation
  choice: sem fingimento
  rationale: Comunica obediência sincera, sem aparência enganosa, com linguagem moderna.
- source_word: cheat
  choice: procura defraudar
  rationale: Preserva a força moral do contraste com simplesmente enganar, sem sugerir que Deus possa de fato ser lesado.
- source_word: reckon
  choice: prestar contas
  rationale: Torna explícito o sentido de responsabilização perante Deus, natural neste contexto.
theological_decisions:
- issue: A referência de «aquele que quis vocês»
  choice: aquele que quis vocês
  alternative: Aquele que os escolheu / chamou
  rationale: A formulação mantém a ambiguidade do testemunho fornecido quanto ao referente e ao sentido exato do verbo, em vez de decidir entre escolha, chamado ou desejo.
- issue: «Bispo de todos» aplicado ao Pai
  choice: o Bispo de todos
  alternative: o Supervisor de todos
  rationale: Preserva o paralelo retórico entre o bispo visível e Deus Pai, sem suavizar o título teológico do texto.
- issue: Submissão aos presbíteros ou, em última instância, ao Pai
  choice: não, porém, a ele, mas ao Pai de Jesus Cristo
  alternative: não tanto a ele, mas ao Pai de Jesus Cristo
  rationale: 'Conserva a tensão enfática do testemunho: a deferência ao bispo é apresentada como dirigida, em última instância, ao Pai.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural «vocês» evita formas arcaicas. Como a revisão direta do grego está pendente, a tradução segue cautelosamente o testemunho inglês público fornecido e assinala sua principal ambiguidade.
