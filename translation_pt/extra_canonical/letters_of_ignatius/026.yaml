review_pass:
  verdict: revise
  source_fidelity: A revisão conserva o conteúdo e a ambiguidade do testemunho inglês provisório. Corrige, porém, "não se valham da juventude", que em português pode sugerir simplesmente usar a juventude, para "não tirem proveito da juventude". Também restaura o contraste entre a deferência ao bispo visível e a responsabilidade perante Deus, sem fazer a tradução depender de uma resolução doutrinária.
  naturalness: 'A redação revista emprega português moderno e claro: "não tirem proveito", "lhe dão lugar" e "terá de prestar contas" são mais idiomáticos e adequados ao registro do que as formulações anteriores. Mantém-se "vocês" para legibilidade brasileira e internacional.'
  terminology: '"Bispo", "presbíteros", "Deus Pai" e "o Bispo de todos" são preservados. "Lhe dão lugar" traduz a deferência de give place/yield sem intensificá-la para uma submissão institucional mais forte do que o testemunho afirma.'
  issues:
  - severity: medium
    issue: '"não se valham da juventude do seu bispo"'
    rationale: A construção portuguesa não expressa com precisão "presume upon" no sentido de explorar ou tirar proveito da juventude; pode significar apenas fazer uso dela.
  - severity: medium
    issue: '"mas se submetem a ele"'
    rationale: '"Give place to him" indica ceder-lhe lugar ou deferir-lhe, não exige a formulação mais forte "submeter-se". Além disso, o testemunho contrasta o perfeito negativo com o presente "give place".'
  - severity: medium
    issue: '"quem age assim não engana tanto..." e "não terá de prestar contas"'
    rationale: O sujeito deve abranger diretamente quem engana o bispo visível, e "must reckon" exprime uma prestação de contas inevitável, não uma consequência futura condicionada por "age assim".
  - severity: low
    issue: '"aquele que quis vocês"'
    rationale: Embora procure manter a ambiguidade do testemunho, a ordem é pouco natural. "Aquele que os quis" preserva de modo mais idiomático o sentido deliberadamente não especificado de "Him who desired you".
  revised_text: 'Sim, convém também que vocês não tirem proveito da juventude do seu bispo, mas, de acordo com o poder de Deus Pai, lhe demonstrem toda reverência. Pois soube que os santos presbíteros também não tiraram proveito de sua aparência juvenil, mas lhe dão lugar como a alguém sábio em Deus — não, porém, a ele, mas ao Pai de Jesus Cristo, o Bispo de todos.


    Portanto, em honra daquele que os quis[a], convém que obedeçam sem fingimento. Pois uma pessoa não engana tanto este bispo visível quanto tenta ludibriar aquele que é invisível; e, nesse caso, terá de prestar contas não à carne, mas a Deus, que conhece as coisas ocultas.'
  revised_footnotes:
  - marker: a
    text: Ou, literalmente, “daquele que os desejou”. A formulação do testemunho disponível não esclarece por si só o referente nem a nuance exata do verbo; a revisão direta do grego ainda está pendente.
    reason: Preserva a ambiguidade assinalada no testemunho inglês sem introduzir alternativas interpretativas específicas, como “escolheu” ou “chamou”, que não são explicitadas pela redação fornecida.
  revision_rationale: 'A revisão substitui expressões que enfraqueciam ou deslocavam o sentido do testemunho por equivalentes portugueses naturais: explorar a juventude, dar lugar/deferir ao bispo e prestar contas a Deus. Mantém a construção enfática segundo a qual a deferência prestada ao bispo se orienta, em última instância, ao Pai de Jesus Cristo, sem transformar essa afirmação em uma definição eclesiológica posterior. A nota foi ajustada para documentar apenas a ambiguidade efetivamente preservada.'
