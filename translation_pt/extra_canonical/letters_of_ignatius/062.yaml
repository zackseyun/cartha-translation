base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/062.yaml
  text: 'Remember in your prayers the church in Syria, which has God as its shepherd in my place. Jesus Christ alone will be its bishop—he and your love.


    But I am ashamed to be called one of them, for I am not worthy, being the very last of them and an untimely birth. Yet I have found mercy so that I may be someone, if indeed I attain to God.


    My spirit greets you, as does the love of the churches that received me in the name of Jesus Christ, not as a mere traveler. For even the churches that were not on my route according to the flesh went ahead of me from city to city.'
translation:
  language: pt
  text: 'Lembrem-se, em suas orações, da igreja que está na Síria, a qual tem Deus como pastor em meu lugar. Somente Jesus Cristo cuidará dela, juntamente com o amor de vocês.[a]



    Quanto a mim, envergonho-me de ser chamado um deles, pois não sou digno: sou o último de todos e como alguém nascido fora de tempo.[b] Contudo, alcancei misericórdia para ser alguém, se de fato eu chegar a Deus.[c]



    Meu espírito saúda vocês, assim como o amor das igrejas que me receberam em nome de Jesus Cristo, não como alguém de passagem. Pois até as igrejas que não ficavam em minha rota segundo a carne[d] me precederam, de cidade em cidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O verbo traduzido por «cuidará» corresponde a um termo relacionado a «bispo» ou «supervisor». A construção liga Jesus Cristo e «o amor de vocês» à ação sobre a igreja; a relação exata entre essas duas expressões permanece aberta.
    reason: Preservar a sintaxe incomum sem transformar «o amor de vocês» em título ou ofício eclesiástico.
  - marker: b
    text: «Nascido fora de tempo» traduz uma imagem de nascimento anormal ou prematuro, semelhante à usada por Paulo em 1Coríntios 15:8.
    reason: Esclarecer a metáfora antiga e sua provável ressonância bíblica sem substituí-la no texto.
  - marker: c
    text: «Chegar a Deus» pode, neste contexto, estar ligado à expectativa de martírio, mas a expressão não precisa ser limitada a esse sentido.
    reason: Registrar a possível dimensão martirial, conservando a amplitude da frase.
  - marker: d
    text: «Segundo a carne» parece referir-se aqui à rota física ou geográfica da viagem.
    reason: A formulação literal pode soar abstrata ao leitor moderno; a nota esclarece seu sentido contextual mais provável.
lexical_decisions:
- source_word: shepherd
  choice: pastor
  rationale: Preserva a metáfora de condução e cuidado da igreja, em linguagem bíblica natural e corrente.
- source_word: bishop
  choice: bispo
  rationale: Mantém o título eclesial específico do testemunho, sem substituí-lo por uma paráfrase denominacional.
- source_word: untimely birth
  choice: como alguém nascido fora de tempo
  rationale: Conserva a imagem forte e provavelmente alusiva à linguagem paulina, sem reduzi-la a 'indigno' ou 'abortivo'.
- source_word: attain unto God
  choice: chegar a Deus
  rationale: Expressa a ideia de alcançar o destino final sem explicar antecipadamente se a referência é ao martírio, à morte ou à união com Deus.
- source_word: according to the flesh
  choice: segundo a carne
  rationale: Retém a formulação antropológica e concreta do testemunho, apesar de sua estranheza moderna, para não eliminar sua possível carga teológica.
- source_word: went ahead of me
  choice: iam adiante de mim
  rationale: Preserva a imagem espacial do testemunho disponível e evita especificar, sem confirmação grega, se as igrejas o precederam, acompanharam ou providenciaram recepção antecipada.
theological_decisions:
- issue: A relação entre Jesus Cristo, o amor dos destinatários e o episcopado da igreja na Síria
  choice: “Somente Jesus Cristo será seu bispo — ele e o amor de vocês”
  alternative: “Jesus Cristo somente, juntamente com o amor de vocês, cuidará dela como bispo”
  rationale: A construção transmitida é incomum e teologicamente tensa. A redação escolhida conserva a coordenação e a ambiguidade, em vez de transformar 'o amor de vocês' numa autoridade eclesiástica claramente definida.
- issue: O sentido de chegar a Deus
  choice: Manter “chegar a Deus” sem explicação no corpo do texto
  alternative: Explicitar “chegar a Deus por meio do martírio”
  rationale: O contexto pode sugerir martírio, mas o trecho não o declara diretamente. A tradução não deve resolver essa tensão por inferência.
- issue: A autodepreciação de Inácio
  choice: Preservar “o último de todos” e a imagem do nascimento fora de tempo
  alternative: Suavizar para “o menos importante e indigno”
  rationale: As imagens ecoam linguagem cristã antiga e talvez paulina; sua intensidade faz parte do argumento espiritual do autor.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais (“vocês”, “Lembrem-se”). Mantiveram-se certas expressões deliberadamente antigas ou bíblicas — “segundo a carne”, “nascido fora de tempo”, “chegar a Deus” — porque carregam imagens e tensões que uma modernização plena apagaria. Como a revisão direta do grego da recensão média ainda está pendente e o material fornecido é um testemunho inglês de domínio público, escolhas sintáticas especialmente difíceis, sobretudo em “ele e o amor de vocês” e “iam adiante de mim”, devem ser verificadas contra o texto grego antes da publicação definitiva.
