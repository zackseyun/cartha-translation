source:
  text: 'Remember in your prayers the church which is in Syria, which hath God for its shepherd in my stead. Jesus Christ alone shall be its bishop-He and your love.


    But for myself I am ashamed to be called one of them; for neither am I worthy, being the very last of them and an untimely birth: but I have found mercy that I should be some one, if so be I shall attain unto God.


    My spirit saluteth you, and the love of the churches which received me in the name of Jesus Christ, not as a mere wayfarer; for even those churches which did not lie on my route after the flesh went before me from city to city.'
