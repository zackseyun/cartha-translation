review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva em geral a sequência argumentativa, os nomes e a distinção entre mensageiros e cartas. Contudo, “as casas de seus filhos” não é sustentado pelo testemunho: a expressão refere-se à casa/família da esposa de Epítropo e a seus filhos, não às casas destes. Além disso, “serão honrados” atenua indevidamente “may be glorified”.'
  naturalness: O português é claro e contemporâneo. Ajustei “Despeço-me sempre de vocês” para uma despedida mais natural e diretamente correspondente a “I bid you farewell always”, e reformulei a frase sobre a glória para evitar construção pouco idiomática sem perder o sentido.
  terminology: “Pensamento de Deus”, “mensageiros”, “graça”, “nosso Deus, Jesus Cristo” e “supervisão de Deus” são mantidos. “Unidade de Deus e supervisão de Deus” conserva os dois genitivos do testemunho e não impõe leitura eclesiástica técnica. A nota sobre “supervisão” continua adequadamente cautelosa, pois a revisão direta do grego está pendente.
  issues:
  - severity: high
    issue: “com toda a sua casa e as casas de seus filhos”
    rationale: O testemunho inglês diz “with her whole household and her children's”; ainda que sua pontuação seja imperfeita, não fornece base para acrescentar “as casas” dos filhos. A formulação segura é “com toda a sua casa e seus filhos”.
  - severity: medium
    issue: “Assim, vocês serão honrados” para “that ye may be glorified”
    rationale: “Honrados” reduz “glorified” a reconhecimento humano. “Sejam glorificados” preserva o vocabulário e deixa aberta a nuance do original.
  - severity: low
    issue: “na unidade e sob a supervisão de Deus”
    rationale: A construção desloca “de Deus” para reger apenas “supervisão”. “Na unidade de Deus e na supervisão de Deus” reproduz mais claramente a estrutura do testemunho, sem resolver antecipadamente a questão grega.
  revised_text: 'Como não pude escrever a todas as igrejas, porque parti repentinamente de Trôade para Neápolis, conforme determina a vontade divina, você escreverá às igrejas que estão adiante, como alguém que possui o pensamento de Deus, para que elas também façam a mesma coisa: os que puderem enviem mensageiros, e os demais enviem cartas por meio das pessoas que você enviar. Assim, vocês sejam glorificados por uma obra de memória eterna — pois isso é digno de você.



    Saúdo todos pelo nome, especialmente a esposa de Epítropo, com toda a sua casa e seus filhos. Saúdo meu amado Átalo. Saúdo aquele que for designado para ir à Síria. A graça estará sempre com ele e com Policarpo, que o envia.



    Sempre me despeço de vocês em nosso Deus, Jesus Cristo. Permaneçam nele, na unidade de Deus e na supervisão de Deus.[a] Saúdo Alce, nome que me é muito querido. Estejam bem no Senhor.'
  revised_footnotes:
  - marker: a
    text: “Supervisão” traduz literalmente o testemunho disponível. O termo pode ter conotação de cuidado, direção ou ofício de supervisão; a revisão direta do grego ainda está pendente.
    reason: Preserva a ambiguidade histórica e teológica sem antecipar a análise direta do texto grego.
  revision_rationale: A revisão elimina uma expansão sem apoio textual relativa aos filhos da esposa de Epítropo, restitui “glorificados” e torna explícita a vinculação de “Deus” tanto a “unidade” quanto a “supervisão”. A nota [a] é mantida; a antiga nota [a] é removida porque dependia da leitura incorreta que introduzia “as casas de seus filhos”.
