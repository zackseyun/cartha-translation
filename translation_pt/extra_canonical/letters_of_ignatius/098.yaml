review_pass:
  verdict: revise
  source_fidelity: A revisão exige duas correções seguras. O destinatário de «para que sejas/seja glorificado» é Policarpo no singular, não o conjunto dos destinatários. Além disso, a construção final coordena «unidade» e «supervisão» sob a mesma relação com Deus; «sob a supervisão de Deus» altera a estrutura ao transformar Deus no agente da supervisão. A formulação relativa à casa da esposa de Epítropo permanece sintaticamente elíptica e deve ser assinalada sem escolher além do necessário entre casa dela e casas dos filhos.
  naturalness: O português é claro, atual e de registro apropriado. «Seja glorificado por uma ação de memória eterna» é mais fiel e idiomático que «vocês serão honrados por um ato digno de memória eterna». «Na unidade e na supervisão de Deus» mantém o paralelismo do original/testemunho e continua inteligível.
  terminology: «Igrejas», «mensageiros», «graça», «nosso Deus, Jesus Cristo» e «supervisão» são escolhas adequadas. «Pensamento de Deus» conserva, de modo não doutrinariamente fechado, a expressão transmitida por «mind of God». Os nomes Trôade, Neápolis, Epítropo, Átalo, Policarpo e Alce foram preservados.
  issues:
  - severity: high
    issue: Mudança indevida do singular para o plural em «Assim, vocês serão honrados».
    rationale: A instrução é dirigida a Policarpo («você escreverá») e o texto-fonte/testemunho diz «that thou mayest be glorified». O plural muda o destinatário da promessa de honra.
  - severity: medium
    issue: «sob a supervisão de Deus» reestrutura a coordenação final.
    rationale: O testemunho tem «in the unity and supervision of God». A tradução deve manter «unidade» e «supervisão» como termos coordenados relacionados a Deus, sem apresentar a supervisão primariamente como uma ação exercida por Deus.
  - severity: low
    issue: A nota a formula uma alternativa pouco distinta do texto principal e usa «a de seus filhos» no singular.
    rationale: A elipse relativa à casa dos filhos é real, mas a nota deve descrevê-la com precisão e sem introduzir uma formulação portuguesa artificial.
  revised_text: 'Como não pude escrever a todas as igrejas, porque parti repentinamente de Trôade para Neápolis, conforme determina a vontade divina, você escreverá às igrejas que estão adiante, como alguém que possui o pensamento de Deus, para que elas também façam a mesma coisa: os que puderem enviem mensageiros, e os demais enviem cartas por meio das pessoas que você enviar. Assim, você será glorificado por uma ação de memória eterna — pois isto é digno de você.


    Saúdo todos pelo nome, especialmente a esposa de Epítropo, com toda a sua casa e com as casas de seus filhos.[a] Saúdo meu amado Átalo. Saúdo aquele que for designado para ir à Síria. A graça estará sempre com ele e com Policarpo, que o envia.


    Sempre me despeço de vocês em nosso Deus, Jesus Cristo. Permaneçam nele, na unidade e na supervisão de Deus.[b] Saúdo Alce, nome que me é muito querido. Estejam bem no Senhor.'
  revised_footnotes:
  - marker: a
    text: A expressão é elíptica e pode ser entendida como incluindo a casa da esposa de Epítropo e as de seus filhos, ou como «com toda a sua casa e seus filhos».
    reason: Preserva a ambiguidade sintática transmitida pelo testemunho, sem definir de modo indevido a relação entre «casa» e «filhos».
  - marker: b
    text: «Supervisão» traduz o termo do testemunho disponível. Ele pode evocar cuidado, direção ou um ofício de supervisão; a revisão direta do grego ainda está pendente.
    reason: Mantém a amplitude semântica e evita harmonização eclesiológica ou teológica.
  revision_rationale: Foram corrigidos o número do destinatário em «você será glorificado» e o paralelismo de «na unidade e na supervisão de Deus». A frase sobre a família da esposa de Epítropo foi ajustada e recebeu uma nota que explicita sua elipse. As demais escolhas preservam o sentido e o registro do testemunho fornecido, sem resolver questões textuais ou teológicas além do que ele permite.
