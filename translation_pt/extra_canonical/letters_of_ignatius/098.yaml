base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/098.yaml
  text: 'Since I have been unable to write to all the churches because I sailed suddenly from Troas to Neapolis, as the divine will commands, you shall write to the churches ahead, as one who possesses the mind of God, so that they too may do this same thing: let those who are able send messengers, and let the rest send letters with the people you send, so that you may be glorified by an ever-memorable deed—for this is worthy of you.


    I greet everyone by name, especially the wife of Epitropus, together with her entire household and those of her children. I greet my beloved Attalus. I greet the one who will be appointed to go to Syria. Grace will always be with him, and with Polycarp, who sends him.


    I always bid you farewell in our God Jesus Christ. Remain in him, in the unity and supervision of God. I greet Alce, a name very dear to me. Farewell in the Lord.'
translation:
  language: pt
  text: 'Como não pude escrever a todas as igrejas, porque parti repentinamente de Trôade para Neápolis, conforme determina a vontade divina, você escreverá às igrejas que estão adiante, como alguém que possui o pensamento de Deus, para que elas também façam a mesma coisa: os que puderem enviem mensageiros, e os demais enviem cartas por meio das pessoas que você mandar. Assim, vocês serão honrados por um ato digno de memória eterna — pois isso é digno de você.


    Saúdo todos pelo nome, especialmente a esposa de Epítropo, com toda a sua casa e as casas de seus filhos.[a] Saúdo meu amado Átalo. Saúdo aquele que for designado para ir à Síria. A graça estará sempre com ele e com Policarpo, que o envia.


    Despeço-me sempre de vocês em nosso Deus, Jesus Cristo. Permaneçam nele, na unidade e sob a supervisão de Deus.[b] Saúdo Alce, nome que me é muito querido. Estejam bem no Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “com toda a sua casa e a de seus filhos”.
    reason: O testemunho inglês ('her whole household and her children's') permite mais de uma análise da relação entre a casa da mulher e a de seus filhos.
  - marker: b
    text: “Supervisão” traduz literalmente o testemunho disponível. O termo pode ter conotação de cuidado, direção ou ofício de supervisão; a revisão direta do grego ainda está pendente.
    reason: Preserva a ambiguidade histórica e teológica sem antecipar a análise do texto grego.
lexical_decisions:
- source_word: the mind of God
  choice: o pensamento de Deus
  rationale: Preserva a formulação cognitiva do testemunho sem transformá-la em uma alegação denominacional ou em linguagem de revelação mais forte.
- source_word: messengers
  choice: mensageiros
  rationale: Mantém a distinção entre representantes enviados pessoalmente e cartas transportadas por outros.
- source_word: ever-memorable deed
  choice: um ato digno de memória eterna
  rationale: Expressa naturalmente a ideia de uma ação que jamais deve ser esquecida, sem sugerir mérito salvífico.
- source_word: supervision
  choice: supervisão
  rationale: Retém deliberadamente o termo amplo e potencialmente técnico do testemunho, sem harmonizá-lo com 'episcopado', 'governo' ou 'providência'.
- source_word: Fare ye well
  choice: Estejam bem
  rationale: Reproduz uma fórmula cordial de despedida em português atual e digno.
theological_decisions:
- issue: Relação entre Jesus Cristo e a designação 'nosso Deus'
  choice: em nosso Deus, Jesus Cristo
  alternative: em nosso Deus e em Jesus Cristo
  rationale: A pontuação do testemunho fornecido apresenta 'Jesus Cristo' em aposição a 'nosso Deus'; a tradução preserva essa leitura cristológica sem acrescentar uma conjunção.
- issue: Sentido de 'supervision of God'
  choice: sob a supervisão de Deus
  alternative: no episcopado de Deus
  rationale: A evidência fornecida não inclui revisão direta do grego; por isso, evita-se impor terminologia eclesiástica técnica e conserva-se a tensão do testemunho inglês.
- issue: Número dos destinatários na seção final
  choice: vocês / permaneçam
  alternative: você / permaneça
  rationale: O testemunho alterna formas historicamente ambíguas no inglês; o plural ajusta-se à saudação comunitária final, enquanto o singular foi mantido nas instruções dirigidas especificamente a Policarpo.
translation_notes:
  register: 'Português moderno, amplamente internacional, com legibilidade brasileira. Emprega ''você'' para Policarpo no corpo da instrução e plural comunitário na despedida. Os topônimos e nomes seguem formas portuguesas usuais: Trôade, Neápolis, Epítropo, Átalo e Policarpo. Como a revisão direta do grego está pendente, o texto é conscientemente provisório e se apoia no testemunho inglês público e na camada de consulta POB.'
