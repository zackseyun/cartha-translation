base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/063.yaml
  text: 'I am writing these things to you from Smyrna by the hand of the Ephesians, who are worthy of every congratulation. Crocus also, a name very dear to me, is here with me, along with many others.


    Regarding those who went ahead of me from Syria to Rome for the glory of God, I believe you have received instructions. Let them also know that I am near, for they are all worthy of God and of you, and it is fitting for you to refresh them in every way.


    I am writing these things to you on the ninth day before the Calends of September. Farewell to the end as you wait patiently for Jesus Christ.'
translation:
  language: pt
  text: 'Escrevo-lhes estas coisas de Esmirna, por intermédio dos efésios, que são dignos de toda felicitação. Croco também está comigo, e seu nome me é muito querido, junto com muitos outros.


    Quanto aos que foram adiante de mim, da Síria para Roma, para a glória de Deus, creio que vocês receberam instruções. Avisem-lhes também que estou perto, pois todos eles são dignos de Deus e de vocês, e convém que vocês os reconfortem em tudo.


    Escrevo-lhes estas coisas no nono dia antes das calendas de setembro.[a] Que estejam bem até o fim, enquanto esperam com paciência por Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, 24 de agosto, segundo a contagem inclusiva do calendário romano.
    reason: O texto conserva a data romana antiga; a nota oferece a equivalência moderna sem substituir a forma histórica no corpo.
lexical_decisions:
- source_word: by the hand of
  choice: por intermédio de
  rationale: Expressa naturalmente o meio ou a agência dos efésios sem exigir que tenham atuado literalmente como escribas.
- source_word: worthy of all felicitation
  choice: dignos de toda felicitação
  rationale: Preserva a formulação enfática e elogiosa do testemunho, embora seja menos idiomática que uma paráfrase como “merecedores de todos os parabéns”.
- source_word: refresh them
  choice: os reanimem
  rationale: Mantém a ideia ampla de proporcionar alívio, ânimo e cuidado, sem restringi-la apenas a hospitalidade ou provisão material.
- source_word: patient waiting
  choice: esperam com paciência
  rationale: Reproduz tanto a espera por Jesus Cristo quanto sua qualidade perseverante em português corrente.
- source_word: Fare ye well
  choice: Permaneçam bem
  rationale: Evita o sentido moderno de despedida definitiva que “adeus” poderia sugerir e conserva a exortação a continuar bem até o fim.
theological_decisions:
- issue: A expressão “para a glória de Deus” pode qualificar a viagem ou seu propósito mais amplo.
  choice: partiram antes de mim da Síria para Roma, para a glória de Deus
  alternative: partiram antes de mim da Síria para Roma rumo à glória de Deus
  rationale: A pontuação mantém aberta a relação da frase com a viagem, sem transformar “glória” explicitamente em destino escatológico.
- issue: Objeto da espera paciente no encerramento.
  choice: enquanto esperam com paciência por Jesus Cristo
  alternative: na paciente espera de Jesus Cristo
  rationale: A forma verbal é clara e natural, preservando Jesus Cristo como aquele por quem se espera, sem acrescentar referência explícita à segunda vinda.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. O tratamento plural foi vertido por “vocês”, evitando formas arcaicas. Como a revisão direta do grego está pendente e o material fornecido é um testemunho inglês de domínio público, escolhas potencialmente sensíveis foram mantidas próximas desse testemunho, sem alegar certeza além da evidência disponível.
