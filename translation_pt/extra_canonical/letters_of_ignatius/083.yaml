revisions:
- from: 'Portanto, os que contradizem o bom dom de Deus perecem por causa de suas discussões. Seria melhor que tivessem amor, para que também ressuscitem.


    É justo, portanto, que vocês se afastem de tais pessoas e não falem a respeito delas, nem em particular nem em público. Em vez disso, deem atenção aos Profetas e, sobretudo, ao Evangelho, no qual a paixão nos é apresentada e a ressurreição é realizada.'
  to: 'Portanto, os que se opõem à graça de Deus perecem por suas controvérsias. Seria melhor que tivessem amor, para que também ressuscitem.


    É justo, portanto, que vocês se afastem de tais pessoas e não falem a respeito delas, nem em particular nem em público. Em vez disso, deem atenção aos Profetas e, sobretudo, ao Evangelho, no qual a paixão nos foi manifestada e a ressurreição foi consumada.'
  rationale: A revisão restabelece «graça» como tradução de χάρις, em conformidade com o grego da recensão média, sem depender da formulação imprecisa do testemunho inglês. Também ajusta «controvérsias» e os verbos finais para refletir com maior precisão o vocabulário e o aspecto verbal do original. A expressão «para que também ressuscitem» é mantida sem explicar ou delimitar o alcance da ressurreição.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:52:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'É necessária uma correção importante no termo central: o grego da recensão média tem χάρις τοῦ θεοῦ, «a graça de Deus», não «o bom dom de Deus». A redação inglesa fornecida («good gift») não reflete adequadamente esse termo. «Os que se opõem» traduz naturalmente ἀντιλέγοντες; «controvérsias» preserva melhor o sentido de ζητήσεις como disputas argumentativas. No encerramento, os perfeitos passivos gregos pedem formulação de resultado já efetivado: a paixão foi manifestada e a ressurreição foi consumada.'
  naturalness: O português do rascunho é claro e de registro apropriado. «Tais pessoas» explicita de modo aceitável «tais [pessoas]», e «nem em particular nem em público» é natural. A revisão troca «é realizada», que sugere processo presente e soa pouco idiomático nesse contexto, por «foi consumada».
  terminology: «Graça de Deus» é o termo exigido pelo grego e é teologicamente neutro no contexto. Mantêm-se «Profetas», «Evangelho», «paixão» e «ressurreição», vocabulário tradicional, compreensível e não confessionalmente restritivo. «Paixão» conserva a referência ao sofrimento de Cristo sem introduzir interpretação adicional.
  issues:
  - severity: high
    issue: «bom dom de Deus» em lugar de «graça de Deus»
    rationale: O texto grego diz τῇ χάριτι τοῦ θεοῦ («à graça de Deus»). Embora o testemunho inglês apresentado diga «good gift», a tradução portuguesa deve seguir o original quando o testemunho auxiliar diverge.
  - severity: medium
    issue: «a ressurreição é realizada» não preserva bem o perfeito passivo
    rationale: τετελείωται comunica uma ação levada a cumprimento. «Foi consumada» mantém a ideia de efetivação concluída e evita sugerir uma realização ainda em curso.
  - severity: low
    issue: «discussões» atenua a nuance de disputas controversiais
    rationale: ζητήσεις designa mais especificamente controvérsias, debates ou disputas argumentativas; «controvérsias» é mais preciso e ainda natural.
  revised_text: 'Portanto, os que se opõem à graça de Deus perecem por suas controvérsias. Seria melhor que tivessem amor, para que também ressuscitem.


    É justo, portanto, que vocês se afastem de tais pessoas e não falem a respeito delas, nem em particular nem em público. Em vez disso, deem atenção aos Profetas e, sobretudo, ao Evangelho, no qual a paixão nos foi manifestada e a ressurreição foi consumada.'
  revised_footnotes: []
  revision_rationale: A revisão restabelece «graça» como tradução de χάρις, em conformidade com o grego da recensão média, sem depender da formulação imprecisa do testemunho inglês. Também ajusta «controvérsias» e os verbos finais para refletir com maior precisão o vocabulário e o aspecto verbal do original. A expressão «para que também ressuscitem» é mantida sem explicar ou delimitar o alcance da ressurreição.
