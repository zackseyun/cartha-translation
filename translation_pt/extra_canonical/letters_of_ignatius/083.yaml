base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/083.yaml
  text: 'Therefore, those who deny the good gift of God perish through their arguments. It would be better for them to have love, so that they too may rise again.


    It is therefore right for you to keep away from such people and not speak about them either privately or publicly. Instead, pay attention to the Prophets, and especially to the Gospel, in which the suffering is shown to us and the resurrection is accomplished.'
translation:
  language: pt
  text: 'Portanto, os que se opõem à graça de Deus perecem por suas controvérsias. Seria melhor que tivessem amor, para que também ressuscitem.


    É justo, portanto, que vocês se afastem de tais pessoas e não falem a respeito delas, nem em particular nem em público. Em vez disso, deem atenção aos Profetas e, sobretudo, ao Evangelho, no qual a paixão nos foi manifestada e a ressurreição foi consumada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gainsay
  choice: contradizem
  rationale: Preserva a ideia de oposição ou contestação ao dom de Deus sem restringi-la ao sentido mais específico de negação.
- source_word: good gift of God
  choice: bom dom de Deus
  rationale: Mantém a formulação teológica tradicional e transparente do testemunho disponível.
- source_word: questionings
  choice: discussões
  rationale: Expressa controvérsias e disputas argumentativas em português corrente, sem presumir que se trate de perguntas sinceras.
- source_word: passion
  choice: paixão
  rationale: Emprega o termo cristão tradicional para o sofrimento e a morte de Jesus; o contexto evita o sentido moderno de emoção intensa.
- source_word: is accomplished
  choice: é realizada
  rationale: Conserva a força de cumprimento efetivo, em vez de reduzir a frase a uma simples narrativa da ressurreição.
theological_decisions:
- issue: Sentido de “para que também ressuscitem”
  choice: Preservar a referência à ressurreição sem especificar se se trata de ressurreição para a vida, restauração espiritual ou participação escatológica.
  alternative: Explicitar “ressuscitem para a vida” ou interpretar como arrependimento espiritual.
  rationale: O testemunho fornecido deixa a expressão aberta, e a tradução não deve resolver silenciosamente essa tensão.
- issue: Relação do Evangelho com a paixão e a ressurreição
  choice: 'Manter a assimetria verbal: a paixão é apresentada, e a ressurreição é realizada.'
  alternative: Uniformizar como “são narradas” ou “são anunciadas”.
  rationale: A formulação incomum pode carregar uma distinção intencional e deve ser preservada enquanto a revisão direta do grego estiver pendente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se “Profetas” e “Evangelho” com iniciais maiúsculas como designações reconhecíveis de corpos de testemunho. Como a revisão direta da tradição grega ainda está pendente, o texto evita reconstruções lexicais não confirmadas e segue com cautela o testemunho público de Lightfoot, consultando a versão inglesa POB apenas como camada auxiliar.
