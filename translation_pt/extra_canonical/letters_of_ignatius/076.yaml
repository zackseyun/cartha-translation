review_pass:
  verdict: revise
  source_fidelity: 'A redação atual desloca e fragmenta a cadeia de qualificações dirigida à única igreja destinatária. Em particular, «digníssima de Deus» não traduz adequadamente «most reverend»: no contexto da tradição grega, a expressão é mais precisamente «muito amada por Deus». «Recebeu toda espécie de dom» também separa indevidamente a ideia de misericórdia/graça da qualificação dos dons.'
  naturalness: A repetição de «à igreja» torna a saudação menos clara e cria a impressão de destinatários distintos. Uma única oração relativa, com as qualificações em sequência, preserva a sintaxe epistolar solene e é natural em português atual.
  terminology: «Teóforo» e a nota de ambiguidade são adequados. «Portadora de coisas santas» é defensável para a imagem aberta de «bearing holy treasures». «Muito amada por Deus» evita tanto o título clerical associado a «reverendíssima» quanto a alteração semântica de «digníssima de Deus».
  issues:
  - severity: high
    issue: Estrutura do destinatário desmembrada e repetida
    rationale: O texto-fonte dirige a saudação a uma só igreja, sucessivamente qualificada. As três ocorrências de «à igreja» no rascunho obscurecem essa relação e introduzem uma segmentação que não pertence à saudação.
  - severity: high
    issue: «Digníssima de Deus» não preserva o sentido de «most reverend» no seu contexto grego
    rationale: A qualificação subjacente é entendida como «muito amada por Deus», não como dignidade dirigida a Deus ou proveniente dele. A revisão restitui essa relação sem empregar um título eclesiástico moderno.
  - severity: medium
    issue: «por misericórdia, recebeu toda espécie de dom» enfraquece a unidade da expressão sobre a graça/dons
    rationale: A formulação pode sugerir que a igreja recebeu tipos variados de dons por um ato de misericórdia, em vez de expressar que ela foi agraciada/enriquecida com todo dom. «Agraciada com todos os dons» é mais coeso e idiomático.
  revised_text: 'Inácio, também chamado Teóforo[a], à igreja de Deus Pai e de Jesus Cristo, o Amado, agraciada com todos os dons, plena de fé e amor e não carecendo de dom algum, muito amada por Deus e portadora de coisas santas, a qual está em Esmirna da Ásia[b], em espírito irrepreensível e na palavra de Deus: muitas saudações.'
  revised_footnotes:
  - marker: a
    text: «Teóforo» pode ser entendido como «portador de Deus» ou «levado por Deus»; aqui é mantido como nome ou título.
    reason: Preservar a ambiguidade etimológica e tradicional do epíteto.
  - marker: b
    text: «Ásia» refere-se à província romana da Ásia, na parte ocidental da atual Turquia, e não ao continente inteiro.
    reason: Evitar que o sentido geográfico antigo seja confundido com o uso moderno do nome.
  revision_rationale: 'A revisão recompõe a saudação como endereçada a uma única igreja e conserva, em ordem inteligível, suas qualificações: pertencente a Deus Pai e a Jesus Cristo, agraciada, plena de fé e amor, sem falta de dom, muito amada por Deus e portadora de coisas santas. Mantêm-se a ambiguidade de «Teóforo», a referência geográfica antiga e a inicial minúscula de «espírito», sem impor uma leitura pneumatológica. A redação permanece cautelosa porque o dossiê identifica a revisão direta do grego como pendente.'
