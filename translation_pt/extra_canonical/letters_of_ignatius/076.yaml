base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/076.yaml
  text: 'Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ the Beloved, which has been mercifully endowed with every grace, being filled with faith and love and lacking in no grace, most reverend and bearing holy treasures; to the church which is in Smyrna of Asia, in a blameless spirit and in the word of God: abundant greeting.'
translation:
  language: pt
  text: 'Inácio, também chamado Teóforo[a], à igreja de Deus Pai e de Jesus Cristo, o Amado; à igreja que, por misericórdia, recebeu toda espécie de dom, está cheia de fé e amor e não carece de dom algum; à igreja digníssima de Deus e portadora de coisas santas, que está em Esmirna, na Ásia[b]: no espírito irrepreensível e na palavra de Deus, muitas saudações.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Teóforo» pode ser entendido como «portador de Deus» ou «levado por Deus»; aqui é mantido como nome ou título.
    reason: Preservar a ambiguidade etimológica e tradicional do epíteto.
  - marker: b
    text: «Ásia» refere-se à província romana da Ásia, na parte ocidental da atual Turquia, e não ao continente inteiro.
    reason: Evitar que o sentido geográfico antigo seja confundido com o uso moderno do nome.
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Mantém o nome ou título tradicional sem decidir no corpo do texto entre as possíveis nuances etimológicas; a nota registra a ambiguidade.
- source_word: mercifully endowed with every grace
  choice: por misericórdia, recebeu toda espécie de dom
  rationale: Expressa tanto a iniciativa misericordiosa quanto a amplitude dos dons, evitando o sentido moderno mais estreito de «graça» como mera elegância ou favor social.
- source_word: faith and love
  choice: fé e amor
  rationale: Emprega os equivalentes portugueses naturais e teologicamente não sectários.
- source_word: most reverend
  choice: digníssima de Deus
  rationale: Evita «reverendíssima», que em português moderno pode soar como título clerical, e conserva a orientação da dignidade para Deus sugerida pela tradição grega subjacente.
- source_word: bearing holy treasures
  choice: portadora de coisas santas
  rationale: Preserva a imagem concreta e sua abertura sem especificar quais seriam as realidades santas carregadas pela igreja.
- source_word: abundant greeting
  choice: muitas saudações
  rationale: Reproduz de modo idiomático a intensidade da fórmula epistolar, sem transformar a saudação em bênção formal.
theological_decisions:
- issue: Relação entre Deus Pai, Jesus Cristo e «o Amado»
  choice: «de Deus Pai e de Jesus Cristo, o Amado»
  alternative: «de Deus Pai e do seu Amado Jesus Cristo»
  rationale: Mantém «o Amado» ligado diretamente a Jesus Cristo, conforme o testemunho fornecido, sem acrescentar um pronome possessivo ausente.
- issue: Natureza dos «tesouros» ou «elementos santos» levados pela igreja
  choice: «portadora de coisas santas»
  alternative: «portadora de santos tesouros»
  rationale: A formulação escolhida preserva a indeterminação do referente e evita sugerir necessariamente objetos materiais, relíquias ou um conceito sacramental específico.
- issue: «Espírito» como disposição humana ou Espírito Santo
  choice: «no espírito irrepreensível»
  alternative: «no Espírito irrepreensível»
  rationale: A inicial minúscula preserva a possibilidade de referência à condição ou disposição da comunidade e não identifica silenciosamente a expressão com o Espírito Santo.
translation_notes:
  register: 'Português atual, solene e inteligível, com estrutura epistolar preservada e sem arcaísmos desnecessários. Esta redação é provisória: foi preparada a partir do testemunho inglês de domínio público fornecido e da informação de que ele representa a recensão média; a revisão direta e integral do grego ainda está pendente. Por isso, escolhas finas devem ser reavaliadas quando o texto grego crítico for disponibilizado.'
