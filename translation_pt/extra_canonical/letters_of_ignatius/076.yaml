review_pass:
  verdict: revise
  source_fidelity: A redação preserva o destinatário, os qualificativos principais e a saudação, mas reorganiza indevidamente a cadeia de qualificações como se houvesse várias igrejas destinatárias. Além disso, «digníssima de Deus» não traduz com segurança nem o «most reverend» do testemunho inglês nem, provavelmente, o qualificativo grego subjacente; «muito amada por Deus» preserva melhor a provável força de θεοφιλτάτῃ, sem introduzir um título eclesiástico.
  naturalness: O português é em geral solene e claro, mas a repetição de «à igreja» torna a sintaxe confusa e altera a arquitetura do cabeçalho. Uma única oração relativa que reúna todos os qualificativos é mais natural e fiel ao período epistolar.
  terminology: «Teóforo», «fé», «amor», «dom» e «portadora de coisas santas» são escolhas adequadas. Mantém-se «espírito» em minúscula para não resolver uma ambiguidade. A nota sobre «Ásia» é útil e proporcional.
  issues:
  - severity: high
    issue: Repetição de «à igreja» divide os qualificativos de um único destinatário.
    rationale: O texto-fonte dirige-se uma só vez à igreja de Esmirna e acumula seus predicados. A repetição cria, sintaticamente, destinatários sucessivos e torna ambígua a relação entre as cláusulas.
  - severity: medium
    issue: «Digníssima de Deus» é uma equivalência imprecisa para «most reverend» e para o provável grego subjacente.
    rationale: A expressão portuguesa não é idiomática neste sentido e acrescenta uma noção de dignidade que não corresponde claramente ao qualificativo. «Muito amada por Deus» reflete melhor a provável construção grega, embora a verificação direta do grego permaneça necessária.
  - severity: low
    issue: «Muitas saudações» atenua a intensificação de «abundant greeting».
    rationale: «Saudações abundantes» conserva mais diretamente a amplitude da fórmula, ainda em português atual.
  revised_text: 'Inácio, também chamado Teóforo[a], à igreja de Deus Pai e de Jesus Cristo, o Amado, que foi, por misericórdia, enriquecida com todo dom, cheia de fé e amor e sem carecer de dom algum, muito amada por Deus e portadora de coisas santas, a qual está em Esmirna, na Ásia[b]: no espírito irrepreensível e na palavra de Deus, saudações abundantes.'
  revised_footnotes:
  - marker: a
    text: «Teóforo» pode ser entendido como «portador de Deus» ou «levado por Deus»; aqui é mantido como nome ou título.
    reason: Preserva a ambiguidade etimológica e o uso tradicional do epíteto.
  - marker: b
    text: «Ásia» refere-se à província romana da Ásia, na parte ocidental da atual Turquia, e não ao continente inteiro.
    reason: Evita que o sentido geográfico antigo seja confundido com o uso moderno do nome.
  revision_rationale: A revisão restabelece uma única igreja como destinatária e mantém a sucessão de qualificativos do cabeçalho. Substitui-se a formulação pouco segura «digníssima de Deus» por «muito amada por Deus», que corresponde melhor ao provável termo grego, sem depender de uma interpretação confessional. A versão continua provisória, pois a base fornecida é um testemunho inglês e a revisão direta do grego crítico está pendente.
