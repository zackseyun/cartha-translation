review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e conserva adequadamente a formulação ambígua sobre a unidade. Contudo, “tanto corporal como espiritual” fica ligado, pela concordância no singular, somente à ressurreição; o testemunho inglês o apresenta após o par “sofrimento e ressurreição”, com alcance pelo menos potencialmente sobre ambos. Além disso, o sinal de restauração “[and]” precisa aparecer como conjunção entre “presbitério” e “meus conservos”, não apenas como chamada de nota seguida por um “e” não assinalado.
  naturalness: O registro é moderno, digno e claro. “Reconfortou” é mais idiomático neste contexto epistolar do que “reanimou”, que pode sugerir reanimação física. A formulação revista mantém “vocês” sem tom indevidamente coloquial.
  terminology: “Trôade”, “Burro”, “presbitério”, “diáconos” e “conservos” são escolhas defensáveis. “Corporal e espiritual” comunica o contraste do testemunho inglês sem impor uma explicação teológica; seu alcance é expresso sobre os dois substantivos antecedentes.
  issues:
  - severity: medium
    issue: Alcance de “tanto corporal como espiritual”
    rationale: Na redação atual, a concordância singular (“sua ressurreição, tanto corporal como espiritual”) restringe a qualificação à ressurreição. O texto de controle diz “in his suffering and resurrection, both bodily and spiritual”, e a tradução deve ao menos não excluir o alcance sobre sofrimento e ressurreição.
  - severity: medium
    issue: Sinal textual [and] não está preservado no corpo do texto
    rationale: O colchete do testemunho indica uma conjunção restaurada. “presbitério [a] e meus conservos” apresenta uma chamada, mas deixa o “e” como texto seguro; deve-se assinalar a própria conjunção como “[e]”, com a nota ancorada ali.
  - severity: low
    issue: “Ele me reanimou”
    rationale: Embora possível, “reanimou” é menos natural para o sentido epistolar de refresh/comfort. “Reconfortou” comunica melhor o benefício recebido.
  revised_text: 'O amor dos irmãos e irmãs que estão em Trôade saúda vocês. É de lá também que lhes escrevo por intermédio de Burro, a quem vocês enviaram comigo juntamente com os efésios, irmãos e irmãs de vocês. Ele me reconfortou de todas as maneiras. Quem dera todos o imitassem, pois ele é um exemplo do serviço de Deus. A graça divina o recompensará em tudo.



    Saúdo o piedoso bispo de vocês, seu venerável presbitério [e]ᵃ meus conservos, os diáconos, bem como todos vocês, cada um em particular e todos em conjunto, em nome de Jesus Cristo, em sua carne e seu sangue, em seu sofrimento e sua ressurreição, ambos corporais e espirituais, na unidade de Deus e de vocês. Graça, misericórdia, paz e perseverança estejam sempre com vocês.'
  revised_footnotes:
  - marker: a
    text: 'O testemunho inglês assinala neste ponto uma conjunção restaurada: “[and]”. Por isso, a tradução preserva “[e]”. A revisão direta do grego ainda está pendente.'
    reason: Preservar no texto e explicar em nota o sinal de restauração textual presente no testemunho fornecido.
  revision_rationale: 'A revisão corrige dois pontos de fidelidade formal: reproduz “[e]” como a conjunção textualmente assinalada e explicita que “corporais e espirituais” qualifica o par “sofrimento e ressurreição”, sem decidir de modo doutrinário como essa expressão deve ser entendida. Também substitui “reanimou” por “reconfortou” para maior naturalidade epistolar.'
