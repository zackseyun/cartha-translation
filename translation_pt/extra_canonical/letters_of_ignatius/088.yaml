base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/088.yaml
  text: 'The love of the brothers and sisters in Troas greets you. From there I am also writing to you through Burrhus, whom you sent with me together with your brothers and sisters, the Ephesians. He has refreshed me in every way. I wish everyone would imitate him, for he is an example of service to God. Divine grace will repay him in all things.


    I greet your godly bishop, your venerable council of elders, [and] my fellow servants the deacons, as well as all of you individually and together, in the name of Jesus Christ, and in his flesh and blood, in his suffering and resurrection, both bodily and spiritual, in the unity of God and of yourselves. Grace, mercy, peace, and patience be with you always.'
translation:
  language: pt
  text: 'O amor dos irmãos e irmãs que estão em Trôade saúda vocês. É de lá também que lhes escrevo por intermédio de Burro, a quem vocês enviaram comigo juntamente com os efésios, irmãos e irmãs de vocês. Ele me reanimou de todas as maneiras. Quem dera todos o imitassem, pois ele é um exemplo do serviço de Deus. A graça divina o recompensará em tudo.


    Saúdo o piedoso bispo de vocês, seu venerável presbitério [a] e meus conservos, os diáconos, bem como todos vocês, cada um em particular e todos em conjunto, em nome de Jesus Cristo, em sua carne e seu sangue, em seu sofrimento e sua ressurreição, tanto corporal como espiritual, na unidade de Deus e de vocês. Graça, misericórdia, paz e perseverança estejam sempre com vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O testemunho inglês assinala neste ponto uma conjunção restaurada: “[e]”. A tradução reorganiza a enumeração em português, mas preserva aqui o sinal de incerteza textual.'
    reason: Registrar o colchete de restauração textual presente no testemunho fornecido, já que a revisão direta do grego ainda está pendente.
lexical_decisions:
- source_word: brethren
  choice: irmãos e irmãs
  rationale: Expressa em português atual o provável sentido coletivo e comunitário, sem limitar a saudação aos homens.
- source_word: Troas
  choice: Trôade
  rationale: Forma portuguesa tradicional e reconhecível do topônimo antigo.
- source_word: Burrhus
  choice: Burro
  rationale: Transliteração portuguesa convencional do nome grego Βούρρος, embora possa causar estranheza ao leitor moderno.
- source_word: presbytery
  choice: presbitério
  rationale: Preserva a designação coletiva antiga sem substituí-la por uma estrutura eclesiástica moderna específica.
- source_word: ministry of God
  choice: serviço de Deus
  rationale: Mantém a ambiguidade entre serviço prestado a Deus e serviço pertencente à obra de Deus.
- source_word: passion
  choice: sofrimento
  rationale: Comunica o sentido da paixão de Cristo em linguagem corrente e digna.
- source_word: patience
  choice: perseverança
  rationale: Neste contexto de bênção e provação, traduz melhor a ideia de constância resistente do que a mera espera paciente.
theological_decisions:
- issue: A ressurreição descrita como corporal e espiritual
  choice: “sua ressurreição, tanto corporal como espiritual”
  alternative: “sua paixão e ressurreição, ambas corporais e espirituais”
  rationale: O testemunho inglês permite incerteza quanto ao alcance da qualificação. A redação adotada segue a pontuação da camada inglesa POB, mas não explica nem harmoniza a tensão entre os dois termos.
- issue: Unidade de Deus e dos destinatários
  choice: “na unidade de Deus e de vocês”
  alternative: “na unidade com Deus e entre vocês”
  rationale: Conserva a formulação compacta e potencialmente ambígua do testemunho, evitando transformar o genitivo em uma interpretação explícita.
- issue: Carne e sangue de Cristo
  choice: “em sua carne e seu sangue”
  alternative: “por sua carne e seu sangue”
  rationale: Mantém a linguagem participativa e a preposição do testemunho sem restringi-la a uma leitura sacramental ou exclusivamente histórica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Empregou-se “vocês” para o plural sem coloquialismo excessivo. Esta é uma tradução provisória baseada no testemunho inglês de domínio público; a tradição manuscrita grega da recensão média ainda requer revisão direta.
