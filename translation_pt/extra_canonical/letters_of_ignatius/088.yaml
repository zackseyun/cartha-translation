review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem o testemunho inglês e preserva elementos importantes, como a incerteza assinalada por colchetes e a formulação compacta de «na unidade de Deus e de vocês». Duas melhorias seguras decorrem da formulação grega subjacente: θεοπρεπῆ é mais precisamente «digno de Deus» do que «piedoso», e a qualificação «corporal e espiritual» deve poder abranger tanto o sofrimento quanto a ressurreição, não apenas a ressurreição mais próxima.'
  naturalness: O texto é geralmente claro, digno e adequado ao português internacional de boa legibilidade brasileira. «Companheiros de serviço» é mais atual e transparente que «conservos», sem reduzir o sentido de συνεργοί. A construção explícita «ambos corporais e espirituais» elimina uma ambiguidade sintática portuguesa que não corresponde à melhor leitura do enunciado-fonte.
  terminology: «Presbitério», «diáconos», «Trôade», «Burro», «sofrimento», «graça», «misericórdia» e «perseverança» são escolhas apropriadas. «Bispo digno de Deus» reproduz melhor o qualificativo elevado aplicado ao bispo, sem impor uma leitura denominacional. O sinal de restauração textual é mantido no ponto da enumeração em que ocorre.
  issues:
  - severity: medium
    issue: «piedoso bispo» para «godly bishop» / θεοπρεπῆ
    rationale: «Piedoso» tende a caracterizar a devoção pessoal. O adjetivo grego transmite mais diretamente a ideia de alguém «digno de Deus» ou condizente com Deus; essa formulação é também natural no registro do texto.
  - severity: medium
    issue: «em seu sofrimento e sua ressurreição, tanto corporal como espiritual» pode qualificar apenas «ressurreição» em português
    rationale: A posição do predicativo após o segundo substantivo favorece, em português, seu vínculo apenas com «ressurreição». A formulação revista torna explícito que a caracterização abrange os dois termos, sem explicar ou harmonizar seu sentido.
  - severity: low
    issue: «conservos» é pouco corrente
    rationale: Embora correto, o termo é arcaizante para o alvo declarado. «Companheiros de serviço» preserva a relação de serviço compartilhado e melhora a inteligibilidade.
  revised_text: 'O amor dos irmãos e irmãs que estão em Trôade saúda vocês. É de lá também que lhes escrevo por intermédio de Burro, a quem vocês enviaram comigo juntamente com os efésios, irmãos e irmãs de vocês. Ele me reanimou de todas as maneiras. Quem dera todos o imitassem, pois ele é um exemplo do serviço de Deus. A graça divina o recompensará em tudo.


    Saúdo o bispo de vocês, digno de Deus, seu venerável presbitério[a] e meus companheiros de serviço, os diáconos, bem como todos vocês, cada um em particular e todos em conjunto, em nome de Jesus Cristo, em sua carne e seu sangue, em seu sofrimento e sua ressurreição, ambos corporais e espirituais, na unidade de Deus e de vocês. Graça, misericórdia, paz e perseverança estejam sempre com vocês.'
  revised_footnotes:
  - marker: a
    text: 'O testemunho inglês assinala neste ponto uma conjunção restaurada: «[e]». A tradução conserva a conjunção necessária à enumeração em português e mantém o sinal de incerteza textual.'
    reason: Registrar o colchete de restauração textual presente no testemunho fornecido, enquanto a revisão direta da tradição grega permanece pendente.
  revision_rationale: A revisão conserva o conteúdo, o registro e as ambiguidades teológicas do texto-base. Ela apenas torna mais preciso o epíteto do bispo, esclarece o alcance sintático de «corporais e espirituais» para os dois eventos mencionados e atualiza «conservos». A âncora da nota continua imediatamente após «presbitério», isto é, no local da conjunção restaurada.
