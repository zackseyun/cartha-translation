  terminology: «Em carne», «demônio sem corpo», «espírito», «Pai» e «unido» são escolhas adequadas e não acrescentam explicação doutrinária. «Demônio» traduz δαιμόνιον de modo mais preciso do que «espírito maligno», que explicita uma avaliação não lexicalmente necessária no contexto.
