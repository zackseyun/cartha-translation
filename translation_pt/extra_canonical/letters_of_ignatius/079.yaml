    rationale: Embora o contexto seja polêmico, δαιμόνιον é mais diretamente «demônio»; «maligno» é explicativo.
  - severity: low
    issue: Formulação de ὡς σαρκικός
    rationale: «Como alguém em carne» é compreensível, mas pouco natural. «Como alguém de carne» é mais fluente e conserva a referência à corporeidade.
