base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/079.yaml
  text: 'For I know and believe that he was in the flesh even after the resurrection;


    and when he came to Peter and his companions, he said to them, “Take hold of me and touch me, and see that I am not a bodiless demon.” Immediately they touched him, and they believed, being united with his flesh and his blood. Therefore they also despised death; indeed, they proved superior to death. After his resurrection he [both ate and drank with them as one in the flesh, though spiritually he was united with the Father.'
translation:
  language: pt
  text: 'Pois eu sei e creio que ele estava em carne mesmo depois da ressurreição.


    E, quando foi ao encontro de Pedro e dos que estavam com ele, disse-lhes: “Segurem-me e apalpem-me, e vejam que não sou um demônio sem corpo.” Imediatamente, eles o tocaram e creram, unidos à sua carne e ao seu espírito.[a] Por isso, desprezaram até a morte; mais que isso, mostraram-se superiores à morte. Depois da ressurreição, ele comeu e bebeu com eles como alguém de carne, embora estivesse espiritualmente unido ao Pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto grego da recensão média traz “ao seu espírito”; o testemunho inglês fornecido traz “ao seu sangue”.
    reason: Registra uma divergência relevante entre a leitura grega e a tradução-testemunho fornecida, sem importar para o texto principal a leitura do testemunho inglês.
lexical_decisions:
- source_word: ἐν σαρκί
  choice: em carne
  rationale: Mantém a formulação concreta e cristologicamente enfática do grego, sem enfraquecê-la para apenas “em forma humana”.
- source_word: τοὺς περὶ Πέτρον
  choice: Pedro e os que estavam com ele
  rationale: Expressa de modo natural o sentido idiomático de Pedro e seu grupo ou círculo.
- source_word: ψηλαφήσατέ με
  choice: apalpem-me
  rationale: Comunica exame físico pelo tato, e não um toque meramente casual.
- source_word: δαιμόνιον ἀσώματον
  choice: espírito maligno sem corpo
  rationale: “Demônio incorpóreo” seria mais formal, porém menos transparente ao leitor comum; a escolha preserva tanto o caráter maligno quanto a ausência de corpo.
- source_word: κραθέντες
  choice: unidos
  rationale: Preserva a imagem de ligação ou adesão decorrente do contato, sem definir de modo excessivo a natureza dessa união.
- source_word: ὑπὲρ θάνατον
  choice: superiores à morte
  rationale: Mantém a expressão forte e paradoxal do texto, em vez de reduzi-la a mera coragem diante da morte.
- source_word: ὡς σαρκικός
  choice: como alguém em carne
  rationale: Evita o sentido ético negativo que “carnal” costuma ter no português atual e mantém a referência à existência corporal.
theological_decisions:
- issue: Realidade corporal de Cristo após a ressurreição
  choice: “está em carne mesmo depois da ressurreição”
  alternative: “teve um corpo mesmo depois da ressurreição”
  rationale: A opção escolhida conserva a linguagem ontológica e enfática da tradição textual, sem converter “carne” em uma explicação interpretativa.
- issue: União dos discípulos com a carne e o espírito de Cristo
  choice: “à sua carne e ao seu espírito”
  alternative: “à sua carne e ao seu sangue”
  rationale: A leitura grega da recensão média é “espírito”; “sangue” pertence ao testemunho inglês fornecido e é registrado em nota, sem ser importado para o texto principal.
- issue: Relação de Cristo com o Pai
  choice: “espiritualmente unido ao Pai”
  alternative: “unido ao Pai em espírito”
  rationale: Mantém a tensão entre a participação corporal de Cristo na refeição e sua união espiritual com o Pai, sem explicar a mecânica dessa união.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução prioriza a evidência grega conhecida da recensão média; o testemunho inglês foi usado como camada de consulta. O colchete sem par do testemunho inglês não foi reproduzido, pois não corresponde a uma lacuna necessária no texto grego contínuo consultado.
