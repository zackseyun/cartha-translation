review_pass:
  verdict: revise
  source_fidelity: 'A revisão mantém o conteúdo e as ambiguidades do testemunho inglês provisório. Corrige especialmente a primeira descrição da estrela: o rascunho fazia "mais do que todas as estrelas" qualificar diretamente o ato de brilhar, ao passo que o testemunho a situa "no céu, acima de todas as estrelas", e já reserva a superioridade de brilho para a oração seguinte. A formulação sobre a manifestação de Deus e a abolição da morte conserva o caráter não dogmaticamente explicitado e incoativo do texto.'
  naturalness: O texto é geralmente claro e de registro apropriado, mas "brilhou no céu mais do que todas as estrelas" e "aparecimento singular" soam menos naturais e obscurecem a progressão da imagem. Foram substituídos por formulações correntes, sem reduzir a linguagem elevada do escrito.
  terminology: Foram preservados "governante deste mundo", "virgindade", "parto", "mistérios", "feitiçaria", "encantamento", "antigo reino" e "abolição da morte". "Às eras" retém de modo mais reconhecível a amplitude de "ages"; a nota explica a possibilidade temporal. A expressão "em forma humana" continua a refletir o testemunho fornecido sem impor uma formulação metafísica posterior.
  issues:
  - severity: medium
    issue: A localização/superioridade da estrela foi deslocada na primeira frase.
    rationale: '"Brilhou no céu mais do que todas as estrelas" pode significar que ela brilhou em intensidade maior já nessa oração. O testemunho primeiro a apresenta no céu, acima de todas as estrelas, e somente depois declara que superava todas em brilho.'
  - severity: low
    issue: '"Aparecimento singular" é uma construção pouco idiomática no contexto.'
    rationale: '"Manifestação estranha" comunica com mais naturalidade o fenômeno cuja procedência causava perplexidade, preservando o estranhamento do testemunho.'
  - severity: low
    issue: A nota sobre "aos séculos" não corresponde à opção mais clara para a amplitude de "ages".
    rationale: A leitura "às eras" é mais transparente como referência aos tempos/eras, e a nota pode registrar tanto o alcance temporal quanto o cosmológico sem sobrecarregar o texto.
  revised_text: 'A virgindade de Maria, o seu parto e também a morte do Senhor ficaram ocultos ao governante deste mundo — três mistérios que devem ser proclamados em alta voz —, realizados no silêncio de Deus. Como, então, foram manifestados às eras?[a]



    Uma estrela brilhou no céu, acima de todas as estrelas. Sua luz era indescritível, e sua singularidade causava espanto. Todas as demais constelações, junto com o sol e a lua, formaram um coro ao redor da estrela; mas ela superava a todas em brilho. Havia perplexidade quanto à origem daquela manifestação estranha, tão diferente das outras.



    Desde então, toda feitiçaria e todo encantamento foram desfeitos; a ignorância da maldade desapareceu, e o antigo reino foi derrubado, quando Deus apareceu em forma humana para a novidade da vida eterna.[b] E aquilo que havia sido levado à perfeição nos desígnios de Deus começou a realizar-se. A partir daí, todas as coisas foram abaladas, pois tinha começado a abolição da morte.'
  revised_footnotes:
  - marker: a
    text: “Às eras” também pode ser entendido como “ao longo dos tempos”; a expressão pode ter alcance temporal ou cosmológico.
    reason: Preserva a amplitude de “ages” no testemunho inglês provisório sem escolher uma única interpretação no texto.
  - marker: b
    text: A construção também pode ser entendida como “com vistas à novidade da vida eterna”.
    reason: A relação indicada por “para/unto” permanece sintaticamente aberta no testemunho inglês provisório e requer posterior conferência no grego.
  revision_rationale: A revisão é necessária para restaurar a progressão e a sintaxe do testemunho na imagem da estrela, melhorar duas formulações portuguesas e ajustar a nota correspondente a “ages”. Não se alterou o sentido histórico ou teológico da passagem. Como a revisão direta do grego da recensão média ainda está pendente, as escolhas continuam provisórias e seguem o testemunho inglês auditado.
