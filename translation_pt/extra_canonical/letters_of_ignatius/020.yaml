base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/020.yaml
  text: 'Hidden from the ruler of this world were Mary’s virginity, her giving birth, and also the Lord’s death—three mysteries to be proclaimed aloud—which were accomplished in the silence of God. How, then, were they revealed to the ages?


    A star shone forth in the heaven above all the stars. Its light was beyond description, and its strangeness caused amazement. All the other constellations, together with the sun and moon, formed a chorus around the star, but the star itself far outshone them all. There was bewilderment about where this strange appearance, so unlike the others, had come from.


    From that time on, every sorcery and every spell was dissolved. Ignorance of wickedness vanished, and the ancient kingdom was torn down when God appeared in human likeness unto the newness of everlasting life. What had been brought to completion in the counsels of God began to take effect. From then on, everything was thrown into turmoil because the abolition of death had begun.'
translation:
  language: pt
  text: 'A virgindade de Maria, o seu parto e também a morte do Senhor ficaram ocultos ao governante deste mundo — três mistérios a serem proclamados em alta voz —, realizados no silêncio de Deus. Como, então, foram manifestados aos séculos?[a]


    Uma estrela brilhou no céu, acima de todas as estrelas. Sua luz era indescritível, e sua singularidade causava espanto. Todas as demais constelações, junto com o sol e a lua, formaram um coro ao redor da estrela; mas ela superava a todas em brilho. Havia perplexidade quanto à origem daquela aparência estranha, tão diferente das outras.


    Desde então, toda feitiçaria e todo encantamento foram desfeitos; a ignorância da maldade desapareceu, e o antigo reino foi derrubado, quando Deus apareceu em forma humana para a novidade da vida eterna.[b] E aquilo que havia sido levado à perfeição nos desígnios de Deus começou a realizar-se. A partir daí, todas as coisas foram abaladas, pois se empreendia a abolição da morte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Aos séculos” também pode ser entendido como “às eras” ou “ao longo dos tempos”.
    reason: A expressão admite alcance temporal ou cosmológico; a nota preserva essa amplitude.
  - marker: b
    text: A construção também pode ser entendida como “com vistas à novidade da vida eterna”.
    reason: A relação indicada por “para” permanece sintaticamente aberta e não deve ser especificada além do texto.
lexical_decisions:
- source_word: prince/ruler of this world (Greek review pending)
  choice: governante deste mundo
  rationale: Expressão natural e digna que preserva a referência ao poder cósmico hostil sem impor uma identificação explicativa no texto.
- source_word: child-bearing
  choice: parto
  rationale: Mantém a distinção concisa entre a virgindade de Maria e o ato de dar à luz.
- source_word: mysteries to be cried aloud
  choice: mistérios que devem ser proclamados em alta voz
  rationale: Preserva o contraste retórico entre proclamação pública e realização no silêncio de Deus.
- source_word: ages
  choice: séculos
  rationale: Retém a ambiguidade temporal e cosmológica do testemunho, explicada em nota sem a resolver no corpo do texto.
- source_word: constellations ... formed themselves into a chorus
  choice: constelações ... formaram um coro
  rationale: Conserva a personificação e a imagem coral do texto.
- source_word: sorcery / spell
  choice: feitiçaria / encantamento
  rationale: Usa termos distintos e correntes para preservar o paralelismo lexical.
- source_word: ancient kingdom
  choice: antigo reino
  rationale: Mantém a formulação aberta, sem identificar de modo denominacional o reino referido.
- source_word: abolishing of death
  choice: abolição da morte
  rationale: Reproduz a força conceitual da expressão, mais intensa que simples superação ou derrota.
theological_decisions:
- issue: Identidade do governante deste mundo
  choice: Não explicitada além da expressão tradicional
  alternative: Satanás
  rationale: O texto alude a uma figura conhecida, mas nomeá-la eliminaria uma medida de implicitude presente no testemunho.
- issue: Formulação da encarnação
  choice: Deus apareceu em forma humana
  alternative: Deus se tornou homem
  rationale: A escolha segue a formulação do testemunho e evita resolver questões metafísicas além do que esta passagem afirma.
- issue: Relação entre o plano divino e sua execução histórica
  choice: aquilo que havia sido levado à perfeição nos desígnios de Deus começou a realizar-se
  alternative: aquilo que Deus havia planejado começou
  rationale: Preserva a tensão entre algo já consumado no conselho divino e seu início de efetivação na história.
- issue: Início da abolição da morte
  choice: tinha começado a abolição da morte
  alternative: a morte foi abolida
  rationale: Mantém o aspecto incoativo do testemunho, sem antecipar uma consumação plena.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom elevado adequado a um escrito cristão antigo. Evitaram-se arcaísmos como “deu à luz” em construção nominal excessivamente longa e explicações doutrinárias dentro do texto. Como o grego da recensão média ainda não foi fornecido para revisão direta, as decisões são provisórias e se baseiam no testemunho público inglês auditado; uma colação posterior poderá ajustar sintaxe, aspecto verbal e terminologia.
