    Now Onesimus of his own accord highly praiseth your orderly conduct in God, for that ye all live according to truth, and that no heresy hath a home among you: nay, ye do not so much as listen to any one, if he speak of aught else save concerning Jesus Christ in truth.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/007.yaml
  text: 'And in proportion as anyone sees that his bishop is silent, let him fear him the more. For everyone whom the Master of the household sends to be steward over His own house, we ought to receive as Him that sent him. Plainly therefore we ought to regard the bishop as the Lord Himself.


    Now Onesimus of his own accord highly praises your orderly conduct in God, for you all live according to truth, and no heresy has a home among you; indeed, you do not so much as listen to anyone if he speaks of anything other than Jesus Christ in truth.'
translation:
  language: pt
  text: 'E, quanto mais alguém percebe que seu bispo permanece em silêncio, tanto mais deve temê-lo.[a] Pois todo aquele que o Senhor da casa envia para administrar a sua própria casa deve ser recebido por nós como aquele que o enviou. Portanto, é evidente que devemos considerar o bispo como o próprio Senhor.[b]


    Ora, Onésimo, por iniciativa própria, elogia muito a conduta ordeira de vocês em Deus, porque todos vivem de acordo com a verdade e nenhuma heresia encontra morada entre vocês. Com efeito, vocês nem sequer dão ouvidos a alguém que fale de outra coisa que não seja Jesus Cristo em verdade.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Temê-lo” também pode envolver a ideia de profunda reverência; a formulação preserva a força do testemunho antigo.
    reason: Sinaliza a amplitude semântica sem resolver a ambiguidade no corpo do texto.
  - marker: b
    text: Isto é, recebê-lo em relação ao Senhor que o enviou; o texto emprega uma comparação deliberadamente forte.
    reason: Ajuda a evitar que a linguagem comparativa seja lida automaticamente como identidade absoluta, sem suavizar o texto principal.
  - marker: c
    text: A expressão “em verdade” pode qualificar tanto o falar sobre Jesus Cristo quanto a realidade de Jesus Cristo confessada.
    reason: Registra uma ambiguidade sintática e teológica genuína.
lexical_decisions:
- source_word: σιγῶντα / “is silent” (as reflected in the witness)
  choice: permanece em silêncio
  rationale: Preserva a imagem do bispo silencioso sem interpretar o silêncio como mansidão, reserva ou autoridade tácita.
- source_word: φοβείσθω / “let him fear” (as reflected in the witness)
  choice: deve temê-lo
  rationale: Mantém a força e a ambiguidade do testemunho, sem reduzir o termo a mero respeito ou reverência.
- source_word: οἰκοδεσπότης / “Master of the household”
  choice: Senhor da casa
  rationale: Reproduz a metáfora doméstica e sua relação com o administrador enviado.
- source_word: οἰκονομίαν / “to be steward” (concept reflected in the witness)
  choice: para administrar
  rationale: Expressa em português corrente a função de responsável pela casa, sem recorrer ao menos transparente “mordomo”.
- source_word: εὐταξίαν / “orderly conduct”
  choice: conduta ordeira
  rationale: Conserva a ideia de boa ordem comunitária e moral, sem especificar uma estrutura eclesiástica além do texto.
- source_word: αἵρεσις / “heresy”
  choice: heresia
  rationale: Mantém o termo histórico-teológico direto e reconhecível.
- source_word: περὶ Ἰησοῦ Χριστοῦ ἐν ἀληθείᾳ / “concerning Jesus Christ in truth”
  choice: Jesus Cristo em verdade
  rationale: Preserva a construção compacta e sua possível relação tanto com o conteúdo da fala quanto com a confissão verdadeira de Cristo.
theological_decisions:
- issue: Comparação entre a recepção do bispo e a recepção do Senhor
  choice: “considerar o bispo como o próprio Senhor”
  alternative: “olhar para o bispo como representante do Senhor”
  rationale: A tradução mantém a formulação enfática do testemunho sem acrescentar a explicação interpretativa “representante”, que atenuaria a tensão retórica do texto.
- issue: Sentido de temer o bispo silencioso
  choice: “deve temê-lo”
  alternative: “deve respeitá-lo ainda mais”
  rationale: O campo semântico pode incluir temor reverente, mas o testemunho fornecido não autoriza eliminar a força de “temer”.
- issue: Exclusividade do ensino ouvido pela comunidade
  choice: “outra coisa que não seja Jesus Cristo em verdade”
  alternative: “algo que não trate verdadeiramente de Jesus Cristo”
  rationale: A opção escolhida conserva a ambiguidade sintática e teológica da frase em vez de fixar “em verdade” apenas como modificador do modo de falar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “vocês” para o plural. A redação conserva a retórica enfática e as metáforas domésticas do testemunho. Como a revisão direta do grego está pendente, as decisões são provisórias e baseadas no testemunho inglês público fornecido, com apoio apenas nas correspondências gregas tradicionalmente associadas ao trecho.
