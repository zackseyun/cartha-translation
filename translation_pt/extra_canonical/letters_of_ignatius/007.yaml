review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a progressão do testemunho: o temor diante do bispo silencioso, a analogia doméstica do enviado e do remetente, a formulação enfática sobre o bispo e o elogio de Onésimo à comunidade. Pequenos ajustes tornam mais transparente a imagem da administração da casa e evitam uma formulação portuguesa que poderia obscurecer o referente de «sua própria casa».'
  naturalness: O texto é em geral claro e de registro apropriado. «Conduta ordeira ... em Deus» soa menos idiomático e menos próximo da ideia coletiva de boa ordem do que «boa ordem ... em Deus». Também é mais natural dizer que uma heresia «habita» entre a comunidade e que não se dá ouvidos «a ninguém que fale de algo...»
  terminology: «Bispo», «Senhor», «heresia», «Onésimo» e «Jesus Cristo» são adequados. «Temê-lo» preserva corretamente a força e a amplitude do testemunho. A nota sobre «como o próprio Senhor» deve permanecer descritiva, sem apresentar uma delimitação doutrinal como se fosse explicitada pelo texto.
  issues:
  - severity: low
    issue: «conduta ordeira de vocês em Deus»
    rationale: Embora compreensível, a formulação é pouco natural e pode individualizar o que o testemunho elogia como a boa ordem da comunidade. «Boa ordem de vocês em Deus» é mais fluente e conserva o alcance coletivo.
  - severity: low
    issue: «para administrar a sua própria casa»
    rationale: O pronome «sua» pode remeter-se, em português, ao enviado, enquanto a analogia do testemunho é a do senhor da casa que envia alguém para sua administração. «Para exercer a administração de sua própria casa» torna a relação mais clara.
  - severity: low
    issue: Nota b
    rationale: A frase «Isto é» e a explicação sobre identidade absoluta vão além de uma nota estritamente textual. Convém limitar a nota à força comparativa da expressão, sem fixar uma leitura doutrinal.
  revised_text: 'E, quanto mais alguém percebe que seu bispo permanece em silêncio, tanto mais deve temê-lo.[a] Pois todo aquele que o Senhor da casa envia para exercer a administração de sua própria casa deve ser recebido por nós como aquele que o enviou. Portanto, é evidente que devemos considerar o bispo como o próprio Senhor.[b]


    Ora, o próprio Onésimo elogia muito a boa ordem de vocês em Deus, porque todos vivem de acordo com a verdade e nenhuma heresia habita entre vocês. Com efeito, vocês nem sequer dão ouvidos a ninguém que fale de algo que não seja Jesus Cristo em verdade.[c]'
  revised_footnotes:
  - marker: a
    text: «Temê-lo» também pode envolver a ideia de profunda reverência; a formulação preserva a força do testemunho antigo.
    reason: Sinaliza a amplitude semântica sem resolver a ambiguidade no corpo do texto.
  - marker: b
    text: A expressão «como o próprio Senhor» formula a comparação em termos deliberadamente fortes.
    reason: Chama atenção para a ênfase da formulação sem acrescentar uma definição doutrinal.
  - marker: c
    text: A expressão «em verdade» pode qualificar tanto o falar sobre Jesus Cristo quanto a realidade de Jesus Cristo confessada.
    reason: Registra uma ambiguidade sintática e teológica genuína.
  revision_rationale: A revisão mantém o sentido e as ambiguidades do testemunho fornecido, mas melhora a legibilidade moderna e a coesão da metáfora doméstica. A formulação relativa a Onésimo foi aproximada da ideia de boa ordem comunitária, e a nota b foi tornada estritamente descritiva. Como o próprio dossiê informa que a revisão direta do grego ainda está pendente, não foram introduzidas decisões que dependam de resolver variantes ou questões filológicas além do testemunho auditado.
