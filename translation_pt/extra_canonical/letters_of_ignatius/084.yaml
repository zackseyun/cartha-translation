base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/084.yaml
  text: '[But] shun divisions, since they are the beginning of evils. All of you, follow your bishop as Jesus Christ followed the Father, and the presbytery as the Apostles; and respect the deacons as God’s commandment. Let no one do anything pertaining to the Church apart from the bishop. Let that be held a valid eucharist which is under the bishop or one to whom he has committed it.


    Wherever the bishop appears, there let the people be; even as wherever Jesus may be, there is the universal Church. It is not lawful apart from the bishop either to baptize or to hold a love-feast; but whatever he approves is also well-pleasing to God, so that everything you do may be sure and valid.'
translation:
  language: pt
  text: '[Mas] evitem as divisões, pois elas são o princípio dos males. Sigam todos o bispo, assim como Jesus Cristo seguiu o Pai, e sigam o conselho de presbíteros como seguiriam os apóstolos. Respeitem os diáconos como respeitam o mandamento de Deus. Ninguém faça nada referente à igreja sem o bispo. Seja considerada válida a eucaristia celebrada sob a autoridade do bispo ou de alguém a quem ele a tenha confiado.


    Onde quer que o bispo apareça, ali esteja o povo; assim como, onde quer que esteja Jesus, ali está a igreja universal.[a] Não é permitido, sem o bispo, nem batizar nem celebrar a refeição de amor.[b] Mas tudo o que ele aprovar também será agradável a Deus, para que tudo o que vocês fizerem seja seguro e válido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «igreja católica». Aqui, a expressão tem o sentido antigo de igreja universal, completa ou presente em toda parte.'
    reason: Preserva a alternativa histórica ligada ao grego katholikos sem induzir automaticamente uma identificação denominacional posterior.
  - marker: b
    text: A «refeição de amor» (ágape) era uma refeição comunitária dos primeiros cristãos.
    reason: Explica uma prática antiga que pode não ser imediatamente reconhecida pelo leitor moderno.
lexical_decisions:
- source_word: divisions
  choice: divisões
  rationale: Preserva o sentido eclesial amplo do testemunho, sem restringi-lo a cismas formalmente constituídos.
- source_word: bishop
  choice: bispo
  rationale: É o equivalente histórico e corrente do ofício eclesiástico mencionado.
- source_word: presbytery
  choice: conselho de presbíteros
  rationale: Expressa o caráter coletivo do termo, evitando que o leitor o confunda com um edifício ou com o presbiterato em sentido abstrato.
- source_word: eucharist
  choice: eucaristia
  rationale: Mantém o termo histórico específico do texto cristão antigo, em vez de substituí-lo por uma interpretação denominacional.
- source_word: under the bishop
  choice: sob a autoridade do bispo
  rationale: Torna natural em português a ideia de supervisão ou autorização, sem sugerir localização física.
- source_word: universal Church
  choice: igreja universal
  rationale: Traduz o sentido básico de universalidade e evita depender da conotação denominacional moderna de «católica».
- source_word: love-feast
  choice: refeição de amor
  rationale: Conserva a designação da refeição comunitária cristã antiga e recebe nota explicativa.
- source_word: sure and valid
  choice: seguro e válido
  rationale: 'Preserva os dois aspectos do testemunho: confiabilidade e legitimidade reconhecida.'
theological_decisions:
- issue: Natureza da obediência ao conselho de presbíteros
  choice: «sigam o conselho de presbíteros como seguiriam os apóstolos»
  alternative: «sigam o presbitério como os apóstolos»
  rationale: A formulação esclarece que «presbytery» é um corpo de presbíteros e mantém aberta a relação exata pretendida pela comparação.
- issue: Relação entre bispo e validade da eucaristia
  choice: «celebrada sob a autoridade do bispo ou de alguém a quem ele a tenha confiado»
  alternative: «que estiver sob o bispo ou sob aquele a quem ele a conceder»
  rationale: Comunica autorização delegada sem acrescentar uma teoria sacramental posterior.
- issue: Sentido de «universal Church»
  choice: «igreja universal» com nota
  alternative: «Igreja Católica»
  rationale: Mantém o sentido histórico de totalidade/universalidade sem importar associações confessionais modernas, reconhecendo em nota a tradução tradicional.
- issue: Escopo de «não é permitido»
  choice: «sem o bispo»
  alternative: «longe do bispo»
  rationale: O contexto indica ausência de autorização ou participação episcopal, não mera distância física.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural («sigam», «respeitem», «evitem») e terminologia histórica cristã. Como o material fornecido é um testemunho inglês de domínio público e a revisão direta do grego ainda está pendente, escolhas potencialmente dependentes do original foram tratadas com cautela e, quando necessário, anotadas.
