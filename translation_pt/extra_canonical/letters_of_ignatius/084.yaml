review_pass:
  verdict: revise
  source_fidelity: A revisão direta do grego permanece pendente, mas, em comparação com o testemunho inglês fornecido, a redação proposta introduz duas alterações de sentido na frase sobre o presbitério e os diáconos. O paralelismo deve conservar «[sigam] o presbitério como os apóstolos», não «como seguiriam os apóstolos»; e os diáconos devem ser respeitados «como [se respeita] o mandamento de Deus», não mediante uma comparação explícita com o modo como os leitores respeitam esse mandamento.
  naturalness: O texto é em geral claro e digno. «Presbitério» é um termo histórico eclesial preciso; uma nota breve pode esclarecer seu sentido coletivo. «Onde quer que ... esteja presente» soa mais natural do que «apareça», sem alterar o sentido contextual.
  terminology: «Bispo», «presbitério», «diáconos», «eucaristia» e «igreja universal» são adequados. A nota sobre «igreja católica» preserva a opção tradicional sem impor uma leitura denominacional posterior. «Refeição de amor» com explicação é apropriado.
  issues:
  - severity: high
    issue: A comparação relativa ao presbitério foi reformulada de modo indevido.
    rationale: «Sigam o conselho de presbíteros como seguiriam os apóstolos» apresenta os apóstolos como objeto hipotético de seguimento. O testemunho diz, em construção paralela, que se siga o presbitério «como [se seguem] os apóstolos».
  - severity: high
    issue: A comparação relativa aos diáconos foi alterada.
    rationale: '«Respeitem os diáconos como respeitam o mandamento de Deus» acrescenta um sujeito e um modo de respeito não expressos. A formulação deve conservar a comparação: «como o mandamento de Deus».'
  - severity: medium
    issue: «Conselho de presbíteros» é explicativo, mas menos direto que o termo técnico coletivo.
    rationale: «Presbitério», acompanhado de nota, preserva melhor a terminologia histórica e o paralelismo da passagem, sem confundi-lo com um edifício.
  revised_text: '[Mas] evitem as divisões, pois são o princípio dos males. Todos vocês, sigam o bispo, assim como Jesus Cristo seguiu o Pai; e sigam o presbitério como os apóstolos; respeitem os diáconos como o mandamento de Deus.[a] Ninguém faça nada que pertença à igreja sem o bispo. Seja considerada válida a eucaristia que estiver sob a autoridade do bispo ou de alguém a quem ele a tenha confiado.


    Onde quer que o bispo esteja presente, ali esteja o povo; assim como, onde quer que Jesus esteja, ali está a igreja universal.[b] Não é permitido, sem o bispo, nem batizar nem celebrar uma refeição de amor.[c] Mas tudo o que ele aprovar também será agradável a Deus, para que tudo o que vocês fizerem seja seguro e válido.'
  revised_footnotes:
  - marker: a
    text: '«Presbitério» designa o corpo ou conselho de presbíteros; a comparação mantém a construção concisa do texto: seguir o presbitério como os apóstolos.'
    reason: Esclarece o termo coletivo e evita transformar os apóstolos em objeto hipotético da exortação.
  - marker: b
    text: 'Ou: «igreja católica». Aqui, a expressão tem o sentido antigo de igreja universal, completa ou presente em toda parte.'
    reason: Preserva a alternativa histórica ligada a katholikos sem induzir automaticamente uma identificação denominacional posterior.
  - marker: c
    text: A «refeição de amor» (ágape) era uma refeição comunitária dos primeiros cristãos.
    reason: Explica uma prática antiga que pode não ser imediatamente reconhecida pelo leitor moderno.
  revision_rationale: A revisão restaura o paralelismo e as comparações do testemunho de base na exortação relativa ao bispo, ao presbitério e aos diáconos. Mantém a linguagem de supervisão episcopal na eucaristia sem acrescentar uma teoria sacramental, conserva «igreja universal» com alternativa histórica em nota e preserva a explicação cultural de «refeição de amor».
