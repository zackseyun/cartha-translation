review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido. Contudo, «como seguiriam os apóstolos» altera a comparação concisa «o presbitério como os apóstolos», e «será agradável» desloca para o futuro a afirmação gnômica no presente. A revisão conserva a relação comparativa sem especificar além do texto o modo de seguir o presbitério.
  naturalness: O registro é claro e apropriado ao português moderno. «Presbitério» é um termo histórico eclesial natural neste contexto; a nota ou uma breve explicação lexical pode esclarecer seu caráter coletivo sem transformar a tradução em paráfrase. «Esteja presente» é mais idiomático e contextual que «apareça» nesta máxima.
  terminology: Mantêm-se «bispo», «presbitério», «diáconos» e «eucaristia». «Igreja universal» traduz o sentido básico de katholike sem impor uma leitura denominacional posterior. A nota é ajustada para não definir o termo como «presente em toda parte», noção que excede o sentido lexical necessário.
  issues:
  - severity: medium
    issue: A comparação relativa ao presbitério é interpretada em excesso.
    rationale: «Sigam o conselho de presbíteros como seguiriam os apóstolos» introduz uma formulação hipotética e torna mais explícita do que o testemunho a relação da comparação. «Sigam o presbitério como aos apóstolos» preserva a concisão e a ambiguidade sintática do texto.
  - severity: low
    issue: Tempo verbal em «também será agradável a Deus».
    rationale: O texto apresenta o resultado como princípio geral no presente («is well-pleasing»); «também é agradável a Deus» o preserva.
  - severity: low
    issue: A nota sobre «católica» contém uma glosa demasiado ampla.
    rationale: «Presente em toda parte» não é necessário para explicar katholike e pode sugerir uma definição técnica indevida. «Universal» ou «que abrange o todo» é suficiente.
  revised_text: '[Mas] evitem as divisões, pois elas são o princípio dos males. Todos sigam o bispo, assim como Jesus Cristo seguiu o Pai, e o presbitério, como aos apóstolos; respeitem os diáconos como ao mandamento de Deus. Ninguém faça nada referente à igreja sem o bispo. Seja considerada válida a eucaristia celebrada sob a autoridade do bispo ou de alguém a quem ele a tenha confiado.


    Onde quer que o bispo esteja presente, ali esteja o povo; assim como, onde quer que Jesus esteja, ali está a igreja universal.[a] Não é permitido, sem o bispo, nem batizar nem celebrar a refeição de amor.[b] Mas tudo o que ele aprovar também é agradável a Deus, para que tudo o que vocês fizerem seja seguro e válido.'
  revised_footnotes:
  - marker: a
    text: 'Ou: «igreja católica». Aqui, a expressão é empregada em seu sentido antigo de igreja universal, que abrange o todo.'
    reason: Preserva a alternativa histórica ligada a katholike sem pressupor uma identificação denominacional posterior.
  - marker: b
    text: A «refeição de amor» (ágape) era uma refeição comunitária dos primeiros cristãos.
    reason: Explica uma prática antiga que pode não ser imediatamente reconhecida pelo leitor moderno.
  revision_rationale: Foram feitas correções limitadas para preservar melhor a comparação com os apóstolos, o valor presente da aprovação divina e a ambiguidade histórica do termo «católica». Não se acrescenta uma teoria eclesiológica ou sacramental além do que o testemunho permite.
