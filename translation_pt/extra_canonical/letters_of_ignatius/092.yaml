    O tempo presente precisa de você, assim como os pilotos precisam dos ventos e o marinheiro açoitado pela tempestade precisa de um porto, para que ele[a] chegue a Deus. Mantenha-se sóbrio, como atleta de Deus. O prêmio é a incorruptibilidade e a vida eterna, das quais você também está convencido. Em todas as coisas, dedico-me a você — eu e minhas correntes, que você acolheu com carinho.'
