  source_fidelity: A revisão requer correções. «bons discípulos» restringe indevidamente a ideia de pessoas inclinadas a aprender; «os mais difíceis» enfraquece a imagem de pessoas mais enfermas; e «o tempo presente precisa de você» inverte a construção comparativa. A cláusula final, à luz do grego subjacente («para que alcances a Deus»), refere-se ao destinatário, não exige a ambiguidade preservada pelo testemunho inglês provisório.
  naturalness: 'O texto é em geral claro e adequado ao português moderno. As revisões propostas melhoram a precisão sem abandonar a legibilidade brasileira: «os que gostam de aprender», «os mais enfermos», «você precisa de uma ocasião favorável» e «sem malícia».'
  terminology: «Mansidão», «incorruptibilidade», «vida eterna» e «atleta de Deus» são escolhas adequadas. «Emplastro» e «cataplasmas» conservam a distinção das metáforas terapêuticas. «Sem malícia» representa melhor «guileless/akeraíos» do que «puro», que pode introduzir a noção distinta de pureza moral.
  issues:
  - severity: medium
    issue: «bons discípulos» para «good scholars / philomathēs»
    rationale: A formulação sugere discípulos já bons ou obedientes, enquanto o sentido é mais propriamente alguém inclinado a aprender (ou que aprecia quem aprende).
  - severity: medium
    issue: «os mais difíceis» para «the more pestilent»
    rationale: A tradução apaga a metáfora de enfermidade presente no original; «os mais enfermos» a preserva sem transformar a expressão em diagnóstico literal.
  - severity: high
    issue: Inversão de sentido em «O tempo presente precisa de você»
    rationale: A comparação afirma que o destinatário necessita de uma ocasião favorável, tal como pilotos necessitam de ventos e quem está em tempestade necessita de porto.
  - severity: medium
    issue: Pronome ambíguo em «para que ele[a] chegue a Deus»
    rationale: A sintaxe grega resolve o sujeito como o destinatário. A nota, criada para reproduzir uma ambiguidade do inglês provisório, não deve prevalecer sobre a fonte.
  - severity: low
    issue: «puro» para «guileless»
    rationale: «Sem malícia» exprime mais diretamente ausência de dolo e evita associar a frase a pureza moral ou ritual.
