base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/092.yaml
  text: 'If you love good students, that is no credit to you. Rather, bring the more pernicious into submission through gentleness. Not all wounds are healed by the same ointment. Soothe sharp pains with compresses.


    Be prudent as the serpent in all things and always guileless as the dove. You are made of flesh and spirit so that you may accommodate the things visible before your eyes; and as for the invisible things, pray that they may be revealed to you, so that you may lack nothing but abound in every spiritual gift.


    The season requires you, as pilots require winds or as a storm-tossed sailor requires a harbor, so that it may attain to God. Be sober, as God’s athlete. The prize is incorruption and eternal life, of which you too are persuaded. In all things I am devoted to you—I and my bonds, which you cherished.'
translation:
  language: pt
  text: 'Se você ama os que gostam de aprender, isso não lhe traz mérito algum. Antes, submeta os mais enfermos com mansidão. Nem todas as feridas são curadas com o mesmo emplastro. Acalme as dores agudas com cataplasmas.


    Seja prudente como a serpente em todas as coisas e sempre sem malícia como a pomba. Você é feito de carne e espírito para que se acomode às coisas visíveis diante dos seus olhos; quanto às invisíveis, ore para que lhe sejam reveladas, a fim de que nada lhe falte e você abunde em todo dom espiritual.


    Você precisa de uma ocasião favorável, assim como os pilotos precisam dos ventos e o marinheiro açoitado pela tempestade precisa de um porto, para que você alcance a Deus. Mantenha-se sóbrio, como atleta de Deus. O prêmio é a incorruptibilidade e a vida eterna, das quais você também está convencido. Em todas as coisas, dedico-me a você — eu e minhas correntes, que você estimou.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: good scholars
  choice: bons discípulos
  rationale: No contexto de uma exortação pastoral, “discípulos” comunica pessoas dóceis ao ensino com mais naturalidade do que “estudiosos”, sem limitar o sentido ao ambiente acadêmico.
- source_word: the more pestilent
  choice: os mais difíceis
  rationale: Evita a estranheza e o tom excessivamente patologizante de “perniciosos”, preservando a referência a pessoas particularmente problemáticas ou resistentes.
- source_word: gentleness
  choice: mansidão
  rationale: Termo corrente no registro cristão e ético, que expressa domínio benevolente e não mera suavidade.
- source_word: guileless
  choice: puro
  rationale: Expressa ausência de dolo em português natural; “sem malícia” seria igualmente possível, mas poderia sugerir ingenuidade.
- source_word: humor / accommodate
  choice: lidar com
  rationale: Mantém aberto o sentido de adaptar-se prudentemente às realidades visíveis, sem sugerir necessariamente condescendência ou aprovação.
- source_word: season
  choice: tempo presente
  rationale: Torna claro o valor de ocasião ou conjuntura, em vez de uma estação do ano.
- source_word: incorruption
  choice: incorruptibilidade
  rationale: Preserva o termo escatológico tradicional e sua distinção em relação a simples imortalidade.
- source_word: bonds
  choice: correntes
  rationale: Representa concretamente a prisão de Inácio, em vez do sentido abstrato que “laços” teria em português.
theological_decisions:
- issue: Referente do pronome em “para que ele chegue a Deus”
  choice: Preservar o pronome ambíguo e acrescentar nota
  alternative: Explicitar “para que você chegue a Deus” ou “para que o tempo presente alcance a Deus”
  rationale: A evidência fornecida assinala expressamente a ambiguidade, e a revisão direta do grego ainda está pendente; não convém resolvê-la silenciosamente.
- issue: Relação entre carne e espírito
  choice: Manter “feito de carne e espírito” sem explicação adicional
  alternative: Interpretar como natureza humana material e alma, ou como contraste entre natureza humana e Espírito Santo
  rationale: A formulação admite tensão antropológica e espiritual; a tradução não deve impor uma construção doutrinária específica.
- issue: “Atleta de Deus”
  choice: Conservar a metáfora literalmente
  alternative: Parafrasear como “competidor a serviço de Deus”
  rationale: A imagem atlética é central à exortação e se liga diretamente ao prêmio da incorruptibilidade e da vida eterna.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” e imperativos naturais no uso brasileiro. A redação é provisória porque a base fornecida é um testemunho inglês de domínio público e a revisão direta da tradição manuscrita grega da recensão média ainda está pendente.
