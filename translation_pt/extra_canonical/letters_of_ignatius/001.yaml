review_pass:
  verdict: revise
  source_fidelity: A redação acompanha a estrutura e os principais termos do testemunho, mas «para existir para sempre, em glória permanente e imutável» introduz «existir» e torna menos nítida a construção relativa à glória. «Eterna» corresponde mais diretamente ao valor de αἴδιος do que «imutável».
  naturalness: A saudação é compreensível e mantém registro elevado. «Digna de toda congratulação» é mais idiomático no português moderno do que «digna de toda felicitação», sem reduzir o tom formal. «Abundantes saudações» conserva melhor o singular coletivo/intensivo da fórmula que «muitas saudações».
  terminology: «Teóforo», «plenitude», «predestinada», «eleita», «paixão verdadeira» e «Jesus Cristo, nosso Deus» são escolhas adequadas e não impõem desenvolvimento doutrinário. Mantém-se «paixão» como termo cristológico tradicional, sem explicitar um complemento que o texto não traz.
  issues:
  - severity: medium
    issue: Formulação da glória preordenada
    rationale: «Para existir para sempre, em glória permanente e imutável» acrescenta a noção verbal de existir e substitui a ideia de glória perpétua/eterna por uma paráfrase parcialmente diversa. Uma formulação mais direta preserva a construção densa do original.
  - severity: low
    issue: «Felicitação» pouco natural
    rationale: Embora seja cognato possível, «congratulação» transmite de modo mais corrente a honra ou felicitação devida à igreja, mantendo o registro solene.
  - severity: low
    issue: Intensidade da saudação final
    rationale: «Abundantes saudações» reflete mais de perto «abundant greeting» do que «muitas saudações».
  revised_text: 'Inácio, também chamado Teóforo, àquela que foi grandemente abençoada pela plenitude de Deus Pai; que foi predestinada antes dos séculos para a glória perpétua e eterna, unida e eleita em uma paixão verdadeira, pela vontade do Pai e de Jesus Cristo, nosso Deus; isto é, à igreja que está em Éfeso [da Ásia][a], digna de toda congratulação: abundantes saudações em Cristo Jesus e em alegria irrepreensível.'
  revised_footnotes:
  - marker: a
    text: As palavras «da Ásia» aparecem entre colchetes no testemunho utilizado, indicando incerteza textual ou uma restauração editorial.
    reason: Preservar de modo transparente o sinal de restauração do testemunho de base.
  revision_rationale: A revisão elimina uma expansão desnecessária («existir»), aproxima a expressão da glória da formulação grega tradicionalmente atestada e ajusta duas expressões para maior naturalidade sem alterar a sintaxe densa, o referente e as ambiguidades da saudação.
