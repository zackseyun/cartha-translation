base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/001.yaml
  text: 'Ignatius, who is also Theophorus, to her who has been blessed in greatness through the fullness of God the Father; who was foreordained before the ages to be forever in abiding and unchangeable glory, united and chosen in a true passion, by the will of the Father and of Jesus Christ our God; even to the church that is in Ephesus [of Asia], worthy of every felicitation: abundant greeting in Christ Jesus and in blameless joy.'
translation:
  language: pt
  text: 'Inácio, também chamado Teóforo, àquela que foi grandemente abençoada pela plenitude de Deus Pai; que foi predestinada antes dos séculos para existir para sempre, em glória permanente e imutável; unida e eleita em uma paixão verdadeira, pela vontade do Pai e de Jesus Cristo, nosso Deus; isto é, à igreja que está em Éfeso [da Ásia][a], digna de toda felicitação: muitas saudações em Cristo Jesus e em alegria irrepreensível.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras «da Ásia» aparecem entre colchetes no testemunho utilizado, indicando incerteza textual ou uma restauração editorial.
    reason: Preservar de modo transparente o sinal de restauração do testemunho de base.
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Mantém o nome ou título tradicional transliterado, sem impor uma interpretação como «portador de Deus» ou «levado por Deus».
- source_word: plentitude / πλήρωμα
  choice: plenitude
  rationale: Preserva a densidade conceitual da formulação e sua possível ressonância teológica.
- source_word: foreordained
  choice: predestinada
  rationale: Expressa a determinação anterior aos séculos, tendo a igreja como referente, sem desenvolver além do que o testemunho permite.
- source_word: true passion
  choice: paixão verdadeira
  rationale: Conserva a referência à paixão ou sofrimento real de Cristo e evita reduzi-la ao sentido moderno de emoção intensa.
- source_word: elect
  choice: eleita
  rationale: Reproduz a linguagem de eleição aplicada à igreja sem especificar um sistema doutrinário.
- source_word: felicitation
  choice: felicitação
  rationale: Mantém a ideia formal de congratulação e honra presente na saudação antiga.
- source_word: blameless joy
  choice: alegria irrepreensível
  rationale: Preserva o qualificativo ético do testemunho em linguagem digna e inteligível.
theological_decisions:
- issue: A designação de Jesus Cristo como Deus
  choice: Jesus Cristo, nosso Deus
  alternative: nosso Deus e Salvador Jesus Cristo
  rationale: Mantém a construção explícita do testemunho fornecido sem acrescentar «Salvador» nem suavizar a identificação cristológica.
- issue: Referente de «unida e eleita»
  choice: A concordância feminina remete à igreja destinatária
  alternative: Fazer os termos qualificarem diretamente a glória ou a paixão
  rationale: A estrutura da saudação apresenta a igreja como destinatária e referente natural, embora a longa sintaxe antiga permaneça densa.
- issue: Sentido de «paixão verdadeira»
  choice: Formulação literal, sem explicação no corpo do texto
  alternative: «sofrimento verdadeiro» ou «verdadeira paixão de Cristo»
  rationale: A redação conserva a tensão cristológica e a concisão do testemunho, sem tornar explícito um complemento ausente.
translation_notes:
  register: Português moderno, formal e acessível, com cadência epistolar antiga. A redação é provisória porque a revisão direta do grego ainda está pendente; por isso, preserva com cautela a sintaxe e as ambiguidades do testemunho público fornecido.
