review_pass:
  verdict: revise
  source_fidelity: A redação conserva adequadamente a identificação «Jesus Cristo, nosso Deus», o sinal editorial em «[da Ásia]» e a cadeia de qualificações dirigida à igreja. Contudo, «para existir para sempre, em glória» torna mais livre a relação entre «ser para sempre» e «para uma glória duradoura e imutável»; uma formulação mais próxima preserva melhor a construção do testemunho. A revisão direta do grego permanece pendente, conforme o contexto fornecido.
  naturalness: «Àquela que ...; ...; isto é, à igreja» soa excessivamente indireto e pouco natural em português, sobretudo porque o destinatário é identificado na própria saudação. «Digna de toda felicitação» é compreensível, mas «digna de toda congratulação» é mais idiomático no registro formal contemporâneo. A sintaxe longa é mantida por refletir deliberadamente a saudação antiga.
  terminology: «Teóforo», «plenitude», «predestinada», «eleita», «paixão verdadeira» e «Jesus Cristo, nosso Deus» são escolhas defensáveis e não acrescentam interpretação doutrinária. «Paixão» permanece deliberadamente conciso, sem explicitar um complemento que o texto-base não expressa na formulação apresentada.
  issues:
  - severity: medium
    issue: Construção do destinatário e relação com a glória
    rationale: A abertura «àquela que ... isto é, à igreja» é pouco fluente, e «para existir para sempre, em glória» pode sugerir que a igreja simplesmente existe dentro da glória, em vez de conservar a orientação «para uma glória» do testemunho.
  - severity: low
    issue: «Felicitação» pouco idiomático neste contexto
    rationale: Embora lexicalmente possível, «congratulação» transmite com maior naturalidade a honra ou saudação elogiosa pretendida, sem reduzir o sentido.
  revised_text: 'Inácio, também chamado Teóforo, à igreja que está em Éfeso [da Ásia][a], grandemente abençoada pela plenitude de Deus Pai, predestinada antes dos séculos a ser para sempre, para uma glória duradoura e imutável, unida e eleita numa paixão verdadeira, pela vontade do Pai e de Jesus Cristo, nosso Deus; digna de toda congratulação: muitas saudações em Cristo Jesus e em alegria irrepreensível.'
  revised_footnotes:
  - marker: a
    text: As palavras «da Ásia» aparecem entre colchetes no testemunho utilizado, indicando incerteza textual ou uma restauração editorial.
    reason: Preserva de modo transparente o sinal de restauração do testemunho de base.
  revision_rationale: A revisão torna explícito desde o início que a igreja de Éfeso é a destinatária de todos os particípios femininos, melhora a fluência sem desfazer a cadência solene e aproxima «ser para sempre, para uma glória duradoura e imutável» da relação sintática do testemunho. Também substitui «felicitação» por «congratulação», mais natural no português formal atual. O colchete e sua nota são preservados.
