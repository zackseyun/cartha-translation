base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/066.yaml
  text: 'Therefore, as children [of the light] of truth, avoid division and false teachings. Where the shepherd is, follow him like sheep.


    For many persuasive wolves use harmful pleasures to take captive those running in God’s race. But where you are united, they will find no place.'
translation:
  language: pt
  text: 'Portanto, como filhos [da luz] da verdade, evitem a divisão e os falsos ensinamentos. Onde estiver o pastor, sigam-no como ovelhas.


    Pois muitos lobos de aparência persuasiva, por meio de prazeres nocivos, levam cativos os que correm na corrida de Deus. Mas, onde vocês estiverem unidos, eles não encontrarão lugar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: children [of the light] of the truth
  choice: filhos [da luz] da verdade
  rationale: Mantém a formulação e os colchetes do testemunho fornecido, sem decidir se «da luz» pertence ao texto estabelecido.
- source_word: shun division
  choice: evitem a divisão
  rationale: Expressão natural e direta em português, preservando a força da exortação.
- source_word: wrong doctrines
  choice: falsos ensinamentos
  rationale: Comunica claramente a ideia de doutrinas errôneas em linguagem acessível, sem terminologia confessional específica.
- source_word: specious wolves
  choice: lobos de aparência persuasiva
  rationale: Preserva a noção de algo enganadoramente atraente ou convincente, evitando o falso cognato «especiosos».
- source_word: baneful delights
  choice: prazeres nocivos
  rationale: Reproduz o contraste entre atração e dano em linguagem moderna.
- source_word: the runners in God's race
  choice: os que correm na corrida de Deus
  rationale: Conserva explicitamente a metáfora atlética do testemunho, sem reduzi-la a uma referência genérica à vida cristã.
- source_word: where ye are at one
  choice: onde vocês estiverem unidos
  rationale: Expressa a unidade coletiva de modo idiomático e amplamente compreensível.
theological_decisions:
- issue: Identidade e alcance do «pastor»
  choice: o pastor
  alternative: o Pastor
  rationale: Mantém a referência aberta e não impõe pela capitalização uma identificação exclusivamente cristológica ou eclesiástica.
- issue: Expressão textual entre colchetes
  choice: '[da luz]'
  alternative: da luz sem colchetes ou omissão da expressão
  rationale: Preserva a incerteza assinalada no material de base, já que a revisão direta do grego ainda está pendente.
- issue: Metáfora da corrida pertencente a Deus
  choice: corrida de Deus
  alternative: carreira cristã ou corrida para Deus
  rationale: Evita resolver a relação genitiva além do que permite o testemunho inglês provisório.
translation_notes:
  register: Português moderno, digno e de leitura natural no Brasil, com formas verbais na terceira pessoa do plural («vocês») e vocabulário internacionalmente inteligível. Tradução provisória fundamentada no testemunho inglês de domínio público; a revisão direta da tradição manuscrita grega da recensão média permanece pendente.
