base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/011.yaml
  text: 'And pray also without ceasing for the rest of humanity, for there is in them a hope of repentance, that they may find God. Therefore, permit them to learn at least from your works.


    Against their outbursts of anger, be meek; against their proud words, be humble; against their insults, set your prayers; against their errors, be steadfast in the faith; against their fierceness, be gentle. And do not be zealous to imitate them by requital.


    Let us show ourselves to be their brothers by our forbearance; but let us be zealous to be imitators of the Lord, competing with one another over who shall suffer the greater wrong, who shall be defrauded, and who shall be set at nothing; that no herb of the devil may be found in you. But in all purity and self-control abide in Christ Jesus, with your flesh and with your spirit.'
translation:
  language: pt
  text: 'E orem também sem cessar pelo restante da humanidade, pois neles há esperança de arrependimento, para que encontrem Deus. Portanto, permitam que aprendam ao menos com as obras de vocês.


    Diante de seus acessos de ira, sejam mansos; diante de suas palavras orgulhosas, sejam humildes; em resposta a seus insultos, ofereçam suas orações; diante de seus erros, permaneçam firmes na fé; diante de sua ferocidade, sejam brandos. E não se empenhem em imitá-los, retribuindo-lhes na mesma moeda.


    Mostremo-nos irmãos deles por meio de nossa paciência; mas empenhemo-nos em imitar o Senhor, competindo uns com os outros para ver quem sofrerá a maior injustiça, quem será defraudado e quem será desprezado, a fim de que nenhuma erva do diabo seja encontrada entre vocês.[a] Mas permaneçam em Cristo Jesus com toda pureza e domínio próprio, tanto na carne como no espírito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Erva do diabo” preserva a metáfora incomum do testemunho; a imagem indica algo maligno que brota ou cresce no meio da comunidade.
    reason: A expressão literal pode soar estranha em português moderno, mas sua imagem deve ser preservada e brevemente esclarecida.
lexical_decisions:
- source_word: repentance
  choice: arrependimento
  rationale: Preserva o sentido religioso e moral do testemunho sem acrescentar uma formulação confessional mais específica.
- source_word: works
  choice: obras
  rationale: 'Mantém o termo concreto e sua possível amplitude: ações, conduta e frutos visíveis.'
- source_word: requital
  choice: retribuindo-lhes na mesma moeda
  rationale: Expressa em português corrente a ideia de responder ao mal imitando a conduta dos ofensores.
- source_word: forbearance
  choice: paciência
  rationale: Comunica a disposição de suportar ofensas sem retaliar; é natural e digna no contexto.
- source_word: herb of the devil
  choice: erva do diabo
  rationale: Preserva a imagem agrícola incomum do testemunho, evitando substituí-la silenciosamente por uma interpretação como 'semente' ou 'planta'.
- source_word: temperance
  choice: domínio próprio
  rationale: Termo moderno e amplo para autocontrole, sem restringir indevidamente a referência a um único tipo de abstinência.
theological_decisions:
- issue: A esperança de arrependimento presente 'neles'
  choice: pois neles há esperança de arrependimento
  alternative: pois ainda há esperança de que se arrependam
  rationale: A escolha conserva a formulação e a ambiguidade do testemunho quanto ao modo como essa esperança está 'neles', sem transformar a frase em uma afirmação mais explícita sobre possibilidade, certeza ou alcance da salvação.
- issue: Imitação do Senhor por meio do sofrimento voluntariamente suportado
  choice: competindo uns com os outros para ver quem sofrerá a maior injustiça
  alternative: procurando superar uns aos outros em suportar injustiças
  rationale: Mantém a retórica paradoxal de emulação presente no testemunho, sem sugerir que se deva procurar abuso ou injustiça.
- issue: Unidade de carne e espírito na permanência em Cristo
  choice: tanto na carne como no espírito
  alternative: de corpo e espírito
  rationale: Preserva a terminologia antropológica do testemunho e evita resolver a relação entre 'carne' e 'espírito' mediante uma paráfrase.
translation_notes:
  register: 'Português moderno, amplamente internacional e de leitura natural no Brasil, com tratamento comunitário no plural por meio de “vocês” e formas verbais correspondentes. O tom exortativo e as repetições paralelas foram preservados. Esta versão é provisória: foi elaborada a partir do testemunho inglês público fornecido e da camada inglesa auditada; a revisão direta do grego da recensão média ainda está pendente.'
