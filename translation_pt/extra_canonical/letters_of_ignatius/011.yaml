    Mostremo-nos irmãos deles por meio de nossa paciência; mas empenhemo-nos em imitar o Senhor, competindo uns com os outros para ver quem sofrerá a maior injustiça, quem será defraudado e quem será desprezado, a fim de que nenhuma erva do diabo seja encontrada em vocês.[a] Mas, em toda pureza e domínio próprio, permaneçam em Cristo Jesus, tanto na carne como no espírito.'
  revised_footnotes:
  - marker: a
    text: “Erva do diabo” preserva a metáfora incomum do testemunho; a imagem indica algo maligno que brota ou cresce nos próprios destinatários e em sua comunidade.
    reason: A expressão literal pode soar estranha em português moderno, mas sua imagem deve ser preservada e brevemente esclarecida, sem substituir “erva” por uma interpretação como “semente” ou “planta”.
  revision_rationale: A revisão corrige o referente de “in you”, preserva mais estritamente a série retórica de respostas aos ataques e restitui o valor de “in all purity and temperance”. Não altera o sentido geral nem resolve questões teológicas ou textuais que exigiriam consulta direta ao grego.
