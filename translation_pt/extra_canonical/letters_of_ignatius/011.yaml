  naturalness: O português é moderno, claro e adequado à leitura brasileira, sem regionalismos excessivos. As séries de contrastes permanecem fluentes e retóricas.
  terminology: «Arrependimento», «mansos», «fé», «domínio próprio», «carne» e «espírito» são escolhas apropriadas. A preservação de «erva do diabo», acompanhada de nota, mantém uma metáfora incomum sem a substituir por explicação doutrinária.
  issues:
  - severity: low
    issue: «com toda pureza e domínio próprio»
    rationale: O testemunho diz «in all purity and temperance». «Em toda pureza e domínio próprio» reproduz mais diretamente a esfera ou maneira da permanência, sem sugerir que a pureza seja apenas algo acrescentado instrumentalmente.
  - severity: low
    issue: «seja encontrada entre vocês»
    rationale: O testemunho diz «be found in you». «Entre vocês» explicita uma leitura comunitária possível, mas «em vocês» preserva melhor a formulação e sua amplitude.
