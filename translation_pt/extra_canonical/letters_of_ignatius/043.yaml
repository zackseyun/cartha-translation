  terminology: «Vanglória», «açoite», «inveja do diabo», «mansidão» e «governante deste mundo» são escolhas semanticamente defensáveis e apropriadas ao registro cristão sem impor uma leitura doutrinária. «Reduzido a nada» mantém a força de «brought to nought» sem especificar mecanismo ou extensão.
