base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/043.yaml
  text: 'I have many profound thoughts in God, but I keep myself within proper bounds, so that I do not perish through my boasting. For now I must be even more afraid and must not listen to those who would puff me up, because those who say such things to me are a scourge to me.


    For although I desire to suffer, I do not know whether I am worthy. The envy of the devil is indeed unseen by many, but it wages an even fiercer war against me. Therefore, I long for gentleness, by which the ruler of this world is brought to nothing.'
translation:
  language: pt
  text: 'Tenho muitos pensamentos profundos em Deus, mas reconheço os meus limites, para não perecer por causa da minha vanglória. Pois agora devo temer ainda mais e não dar ouvidos aos que querem me encher de orgulho, porque aqueles que me dizem tais coisas são um açoite para mim.


    Embora eu deseje sofrer, não sei se sou digno disso. De fato, muitos não percebem a inveja do diabo, mas contra mim ela trava uma guerra ainda mais feroz. Por isso, anseio pela mansidão, por meio da qual o governante deste mundo é reduzido a nada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: deep thoughts in God
  choice: pensamentos profundos em Deus
  rationale: Mantém a expressão relacional e algo incomum do testemunho, sem explicar indevidamente se se trata de discernimentos, convicções ou aspirações espirituais.
- source_word: take the measure of myself
  choice: reconheço os meus limites
  rationale: Expressa em português corrente a ideia de avaliar-se com sobriedade e manter-se dentro da própria medida.
- source_word: boasting
  choice: vanglória
  rationale: Preserva o sentido moral de exaltação pessoal, mais específico que a simples ação de falar com orgulho.
- source_word: scourge
  choice: açoite
  rationale: Conserva a força da metáfora de algo doloroso e disciplinador.
- source_word: envy of the devil
  choice: inveja do diabo
  rationale: Retém a formulação do testemunho e sua tensão, sem substituí-la por 'malícia' ou 'hostilidade'.
- source_word: gentleness
  choice: mansidão
  rationale: Termo natural no registro cristão, que comunica força sob domínio e ausência de agressividade melhor que uma mera delicadeza de modos.
- source_word: prince of this world
  choice: governante deste mundo
  rationale: Mantém o título tradicional e sua ressonância joanina, usando linguagem moderna e amplamente compreensível.
- source_word: brought to nought
  choice: reduzido a nada
  rationale: Preserva a intensidade da expressão sem decidir entre destruição, anulação de poder ou derrota.
theological_decisions:
- issue: A dignidade de sofrer
  choice: não sei se sou digno disso
  alternative: não sei se sou merecedor
  rationale: ‘Digno’ preserva a perspectiva ascética e martirial sem sugerir que o sofrimento seja adquirido por mérito.
- issue: A ação da mansidão contra o governante deste mundo
  choice: por meio da qual o governante deste mundo é reduzido a nada
  alternative: pela qual o governante deste mundo é derrotado
  rationale: A formulação conserva a afirmação forte e a possível ambiguidade quanto ao modo e ao alcance dessa anulação, sem acrescentar uma explicação doutrinária.
- issue: A inveja do diabo como agente da guerra
  choice: contra mim ela trava uma guerra ainda mais feroz
  alternative: ele trava contra mim uma guerra ainda mais feroz
  rationale: O pronome retoma gramaticalmente ‘a inveja’, como no encadeamento do testemunho, sem identificar de modo silencioso a inveja com o próprio diabo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário cristão amplamente reconhecível. A redação é provisória porque o material fornecido informa que a revisão direta do grego da recensão média ainda está pendente; por isso, evitou-se construir notas filológicas não verificadas.
