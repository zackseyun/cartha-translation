  source_fidelity: 'A tradução conserva adequadamente a progressão e as imagens do testemunho: os muitos pensamentos «em Deus», a autolimitação contra a vanglória, o perigo dos que o exaltam, a inveja do diabo que trava guerra e a mansidão pela qual o governante deste mundo é reduzido a nada. «Reconheço os meus limites» é uma equivalência natural e sóbria para «take the measure of myself», sem ampliar o sentido de modo indevido. A ressalva editorial de que a revisão direta do grego ainda está pendente é apropriada.'
