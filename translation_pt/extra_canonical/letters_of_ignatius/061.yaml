base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/061.yaml
  text: 'I no longer desire to live in the manner of human beings, and this will happen if you desire it. Desire it, so that you yourselves may also be desired. In this brief letter I plead with you: believe me.


    And Jesus Christ will make these things clear to you—that I am speaking the truth—Jesus Christ, the unerring mouth in whom the Father has spoken [truly].


    Pray for me, that I may attain [through the Holy Spirit]. I am not writing to you according to the flesh, but according to the mind of God. If I suffer, it was your desire; if I am rejected, it was your hatred.'
translation:
  language: pt
  text: 'Já não desejo viver à maneira dos seres humanos, e isso acontecerá se vocês o desejarem. Desejem isso, para que vocês mesmos também sejam desejados. Nesta breve carta, eu lhes suplico: creiam em mim.


    E Jesus Cristo lhes mostrará claramente estas coisas: que digo a verdade — Jesus Cristo, a boca que não erra, por meio de quem o Pai falou [verdadeiramente].[a]


    Suplicai por mim, para que eu alcance isso [por meio do Espírito Santo].[b] Não lhes escrevo segundo a carne, mas segundo a mente de Deus. Se eu sofrer, foi isso que vocês desejaram; se eu for rejeitado, foi isso que vocês odiaram.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo “verdadeiramente” aparece entre colchetes no testemunho inglês usado como base provisória, sinalizando incerteza textual ou palavra suprida. É necessária conferência direta do grego.
    reason: Preservar transparência sobre a condição textual da expressão.
  - marker: b
    text: A expressão “por meio do Espírito Santo” aparece entre colchetes no testemunho de base. O objeto de “alcance” não é explicitado nesta forma do texto e provavelmente remete ao objetivo mencionado no contexto anterior.
    reason: Registrar simultaneamente a incerteza da expressão e a elipse do verbo.
  - marker: c
    text: 'A frase final também pode ser entendida de modo mais elíptico: “Se eu sofrer, [isso será] o desejo de vocês; se eu for rejeitado, [isso será] o ódio de vocês.”'
    reason: Preservar a concisão e a dureza retórica da construção testemunhada sem ocultar sua ambiguidade.
lexical_decisions:
- source_word: after the manner of men
  choice: à maneira dos seres humanos
  rationale: Mantém o contraste entre o modo comum de viver da humanidade e a aspiração de Inácio, sem restringir o sentido aos homens do sexo masculino.
- source_word: Desire ye
  choice: Desejem isso
  rationale: Conserva a repetição retórica de “desejar”, embora o objeto permaneça contextualmente implícito no testemunho.
- source_word: unerring mouth
  choice: a boca que não erra
  rationale: Reproduz de modo claro e digno a metáfora cristológica sem convertê-la em um título teológico posterior.
- source_word: after the flesh
  choice: segundo a carne
  rationale: Preserva a expressão antropológica e teológica tradicional, em contraste explícito com “a mente de Deus”.
- source_word: attain
  choice: alcance isso
  rationale: O objeto não está expresso no testemunho fornecido; “isso” preserva a referência contextual sem especificar indevidamente martírio, morte ou salvação.
theological_decisions:
- issue: Cristo como a boca por meio de quem o Pai falou
  choice: por meio de quem o Pai falou
  alternative: em quem o Pai falou
  rationale: “Por meio de quem” soa natural em português e mantém Cristo como agente mediador da fala do Pai, sem desenvolver uma doutrina além do texto.
- issue: Referência ao Espírito Santo entre colchetes
  choice: manter [por meio do Espírito Santo] no texto
  alternative: incorporar a expressão sem colchetes ou omiti-la
  rationale: Os colchetes do testemunho indicam incerteza ou suplementação textual; mantê-los preserva a condição provisória da evidência disponível.
- issue: Contraste entre carne e mente de Deus
  choice: segundo a carne / segundo a mente de Deus
  alternative: por motivos humanos / conforme a vontade de Deus
  rationale: A formulação mais formal conserva tanto a tensão antropológica quanto a expressão incomum “mente de Deus”, sem interpretá-la simplesmente como “vontade”.
- issue: Desejo e ódio atribuídos aos destinatários
  choice: manter a oposição direta
  alternative: atenuar como aprovação e desaprovação
  rationale: A conclusão deliberadamente incisiva deve permanecer, sem suavizar a responsabilidade retórica atribuída aos leitores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega-se “vocês” no discurso geral, mas “Suplicai” foi mantido como imperativo solene; numa revisão de consistência, pode-se preferir “Supliquem”. A tradução é necessariamente provisória, pois foi elaborada a partir do testemunho inglês de domínio público, com revisão direta do grego ainda pendente.
