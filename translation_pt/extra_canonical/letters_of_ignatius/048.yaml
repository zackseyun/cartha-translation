review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a sequência enfática do texto: descendência davídica, maternidade de Maria, realidade do nascimento, alimentação, perseguição, crucificação, morte, ressurreição e futura ressurreição dos crentes. Também mantém adequadamente a fórmula cosmológica «os que estão no céu... na terra... debaixo da terra» e não resolve de modo indevido «em Cristo Jesus». A forma portuguesa do nome histórico, porém, deve ser «Pôncio Pilato», não «Pôncio Pilatos».'
  naturalness: O registro é moderno, digno e legível. «Ressuscitará a nós» é possível, mas é marcadamente menos natural no português atual do que «nos ressuscitará»; a revisão conserva a repetição retórica do Pai como sujeito sem esse custo de fluência.
  terminology: «Linhagem de Davi», «verdadeiramente», «à parte de» e «verdadeira vida» são escolhas defensáveis e consistentes com o testemunho fornecido. Mantém-se «filho de Maria» em minúscula, como predicação descritiva no fluxo da frase, sem introduzir uma decisão cristológica tipográfica que o texto-base em inglês não exige.
  issues:
  - severity: medium
    issue: Nome de Pôncio Pilato grafado incorretamente
    rationale: Em português, a forma estabelecida do nome é «Pôncio Pilato». «Pôncio Pilatos» introduz um erro de nome próprio histórico.
  - severity: low
    issue: Ordem pouco natural em «ressuscitará a nós»
    rationale: 'A construção é compreensível, mas «nos ressuscitará» é a formulação corrente e preserva plenamente o destaque subsequente: «seu Pai, digo, nos ressuscitará».'
  revised_text: 'Portanto, façam-se surdos quando alguém lhes falar à parte de Jesus Cristo. Ele era da linhagem de Davi e filho de Maria. Nasceu verdadeiramente, comeu e bebeu; foi verdadeiramente perseguido sob Pôncio Pilato; foi verdadeiramente crucificado e morreu à vista dos que estão no céu, dos que estão na terra e dos que estão debaixo da terra.


    Além disso, foi verdadeiramente ressuscitado dentre os mortos, pois seu Pai o ressuscitou. Do mesmo modo, seu Pai também nos ressuscitará, a nós que cremos nele — seu Pai, digo, nos ressuscitará — em Cristo Jesus, à parte de quem não temos a verdadeira vida.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego da recensão média ainda está pendente.
    reason: A origem grega foi identificada, mas não foi fornecido o texto grego para verificação lexical e sintática direta; a nota torna transparente a base documental limitada.
  revision_rationale: A revisão corrige a forma portuguesa do nome «Pôncio Pilato» e substitui uma ordem pronominal pouco idiomática por «nos ressuscitará». Não altera a estrutura argumentativa, a repetição de «verdadeiramente», a agência do Pai, nem as ambiguidades teológicas e cosmológicas do texto.
