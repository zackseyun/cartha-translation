review_pass:
  verdict: revise
  source_fidelity: A tradução conserva adequadamente a sequência argumentativa, a repetição enfática de «verdadeiramente», a referência histórica a Pôncio Pilatos, a fórmula cosmológica tripartida e a repetida atribuição da ressurreição ao Pai. «Linhagem de Davi» traduz bem a descendência davídica sem a conotação moderna de «raça». A ressalva sobre a revisão direta do grego é apropriada, pois a base apresentada é o testemunho inglês.
  naturalness: O registro é claro, solene e amplamente legível. Contudo, «filho de Maria», com minúscula, pode ser lido apenas como uma descrição genealógica comum e enfraquece na escrita portuguesa a designação cristológica que o testemunho inglês assinala com «Son». «Filho de Maria» é igualmente natural e preserva melhor essa função titulativa, sem acrescentar interpretação doutrinal.
  terminology: Recomenda-se «Filho de Maria» para corresponder à capitalização titulativa de «Son of Mary» no texto de controle. Permanecem adequados «Jesus Cristo», «Davi», «Pôncio Pilatos», «ressuscitado dentre os mortos», «Pai» e «em Cristo Jesus».
  issues:
  - severity: low
    issue: Capitalização de «filho de Maria»
    rationale: O inglês de controle traz «Son of Mary». Em português, «Filho de Maria» conserva a apresentação como designação de Jesus e evita uma leitura meramente descritiva, sem alterar o sentido.
  revised_text: 'Portanto, façam-se surdos quando alguém lhes falar à parte de Jesus Cristo. Ele era da linhagem de Davi e Filho de Maria. Nasceu verdadeiramente, comeu e bebeu; foi verdadeiramente perseguido sob Pôncio Pilatos; foi verdadeiramente crucificado e morreu à vista dos que estão no céu, dos que estão na terra e dos que estão debaixo da terra.


    Além disso, foi verdadeiramente ressuscitado dentre os mortos, pois seu Pai o ressuscitou. Do mesmo modo, o Pai também ressuscitará a nós, os que nele cremos — seu Pai, digo, nos ressuscitará — em Cristo Jesus, à parte de quem não temos a verdadeira vida.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego da recensão média ainda está pendente.
    reason: A origem grega foi identificada, mas não foi fornecido o texto grego para verificação lexical e sintática direta; a nota torna transparente a base documental limitada.
  revision_rationale: A única alteração é a capitalização de «Filho de Maria», para refletir de modo mais fiel a designação titulativa do testemunho inglês («Son of Mary»). Não foram alteradas as ambiguidades, a ênfase retórica nem as afirmações teológicas do texto.
