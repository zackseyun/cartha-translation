base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/048.yaml
  text: 'Therefore, be deaf whenever anyone speaks to you apart from Jesus Christ. He was of the family line of David and was the Son of Mary. He was truly born, and he ate and drank. He was truly persecuted under Pontius Pilate. He was truly crucified and died in the sight of those in heaven, those on earth, and those under the earth.


    Moreover, he was truly raised from the dead, for his Father raised him. In the same way, his Father will also raise us who believe in him—his Father, I say, will raise us—in Christ Jesus, apart from whom we do not have true life.'
translation:
  language: pt
  text: 'Portanto, façam-se surdos quando alguém lhes falar à parte de Jesus Cristo. Ele era da linhagem de Davi e filho de Maria. Nasceu verdadeiramente, comeu e bebeu; foi verdadeiramente perseguido sob Pôncio Pilatos; foi verdadeiramente crucificado e morreu à vista dos que estão no céu, dos que estão na terra e dos que estão debaixo da terra.


    Além disso, foi verdadeiramente ressuscitado dentre os mortos, pois seu Pai o ressuscitou. Do mesmo modo, o Pai também ressuscitará a nós, os que nele cremos — seu Pai, digo, nos ressuscitará — em Cristo Jesus, à parte de quem não temos a verdadeira vida.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego da recensão média ainda está pendente.
    reason: A origem grega foi identificada, mas não foi fornecido o texto grego para verificação lexical e sintática direta; a nota torna transparente a base documental limitada.
lexical_decisions:
- source_word: race of David
  choice: linhagem de Davi
  rationale: Expressa descendência familiar de modo natural e digno, sem a conotação moderna e potencialmente enganosa de «raça».
- source_word: Be ye deaf
  choice: façam-se surdos
  rationale: Preserva a imagem imperativa forte do testemunho, em vez de reduzi-la a «não deem ouvidos».
- source_word: truly
  choice: verdadeiramente
  rationale: Mantém a repetição enfática que afirma a realidade do nascimento, sofrimento, morte e ressurreição de Jesus.
- source_word: under Pontius Pilate
  choice: sob Pôncio Pilatos
  rationale: Conserva a fórmula histórica e a possível referência à autoridade sob a qual ocorreu a perseguição.
- source_word: apart from
  choice: à parte de
  rationale: Preserva a mesma relação ampla nas duas ocorrências, sem decidir entre sentidos como «sem referência a», «separado de» ou «fora de».
- source_word: true life
  choice: a verdadeira vida
  rationale: Mantém tanto a qualidade enfática de «verdadeira» quanto a formulação substantiva do testemunho.
theological_decisions:
- issue: Realidade da encarnação, paixão e ressurreição
  choice: Repetir «verdadeiramente» nos pontos centrais
  alternative: Suprimir parte das repetições por fluência estilística
  rationale: A repetição carrega a ênfase antidocética do texto e não deve ser suavizada.
- issue: Agente da ressurreição de Cristo e dos fiéis
  choice: Identificar explicitamente o Pai como aquele que ressuscitou Cristo e ressuscitará os que creem
  alternative: Usar formas passivas sem agente explícito
  rationale: O testemunho fornecido nomeia e repete o Pai como agente; a tradução conserva essa ênfase.
- issue: Ressurreição dos fiéis «em Cristo Jesus»
  choice: Manter «em Cristo Jesus» junto da afirmação da futura ressurreição
  alternative: Reformular para explicar se a expressão indica esfera, união ou meio
  rationale: A construção admite densidade teológica e não deve ser resolvida por paráfrase interpretativa.
- issue: Os que estão debaixo da terra
  choice: Manter a formulação cosmológica literal
  alternative: Interpretar como «os mortos» ou «os habitantes do mundo dos mortos»
  rationale: A expressão pode ter alcance retórico ou cosmológico; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira e alcance internacional. Mantiveram-se as repetições retóricas e as fórmulas teologicamente densas. Empregou-se «vocês» de modo implícito nas formas «façam-se» e «lhes», evitando tanto arcaísmo excessivo quanto coloquialismo.
