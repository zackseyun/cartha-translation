base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/006.yaml
  text: 'For if, in a short time, I had such fellowship with your bishop—not in a merely human way, but in the Spirit—how much more do I congratulate you who are closely joined to him, as the Church is joined to Jesus Christ and Jesus Christ to the Father, so that all things may be harmonious in unity.


    Let no one be deceived. If anyone is not within the precinct of the altar, that person lacks the bread [of God]. For if the prayer of one person and another has such great power, how much more does the prayer of the bishop and the whole Church.


    Therefore, whoever does not come to the congregation thereby shows pride and has separated himself, for it is written, “God resists the proud.” Let us therefore be careful not to resist the bishop, so that by our submission we may give ourselves to God.'
translation:
  language: pt
  text: 'Pois, se em pouco tempo tive tamanha comunhão com o bispo de vocês — não de modo meramente humano, mas no Espírito —, quanto mais felicito vocês, que estão estreitamente unidos a ele, assim como a Igreja está unida a Jesus Cristo, e Jesus Cristo ao Pai, para que todas as coisas estejam em harmonia na unidade.


    Que ninguém se engane. Se alguém não está dentro do recinto do altar, fica privado do pão [de Deus].[a] Pois, se a oração de uma e outra pessoa tem tamanha força, quanto mais a oração do bispo e de toda a Igreja!


    Portanto, quem não comparece à congregação demonstra, com isso, seu orgulho e se separou, pois está escrito: “Deus resiste aos orgulhosos”.[b] Tenhamos, portanto, o cuidado de não resistir ao bispo, para que, por nossa submissão, nos entreguemos a Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “recinto do altar” conserva uma imagem cultual. “De Deus” aparece entre colchetes no testemunho inglês fornecido; a confirmação direta no grego ainda está pendente.
    reason: Sinalizar a metáfora histórica e a incerteza editorial/textual indicada pela fonte de trabalho.
  - marker: b
    text: Alusão a Provérbios 3:34, também citada em Tiago 4:6 e 1Pedro 5:5.
    reason: Identificar a referência bíblica explicitamente introduzida por “está escrito”.
lexical_decisions:
- source_word: converse / fellowship (Greek review pending)
  choice: comunhão
  rationale: Expressa relação e participação compartilhada com dignidade e naturalidade, sem reduzir o sentido a uma simples conversa.
- source_word: not after the manner of men but in the Spirit
  choice: não de modo meramente humano, mas no Espírito
  rationale: Preserva o contraste entre o âmbito humano e o espiritual, evitando sugerir que o encontro não envolveu interação humana real.
- source_word: closely joined
  choice: estreitamente unidos
  rationale: Mantém a imagem de forte vínculo e a correspondência com a união da Igreja a Cristo e de Cristo ao Pai.
- source_word: precinct of the altar
  choice: recinto do altar
  rationale: Conserva a metáfora cultual e sua estranheza histórica, sem substituí-la interpretativamente por ‘Igreja’ ou ‘Eucaristia’.
- source_word: bread [of God]
  choice: pão [de Deus]
  rationale: Mantém os colchetes do testemunho fornecido para indicar que ‘de Deus’ possui condição textual ou editorial incerta até a revisão direta do grego.
- source_word: congregation
  choice: congregação
  rationale: Designa a assembleia reunida sem restringir indevidamente o termo a um edifício ou a uma denominação moderna.
- source_word: submission
  choice: submissão
  rationale: Reproduz de maneira direta a relação de sujeição apresentada no texto, sem amenizá-la nem expandi-la doutrinariamente.
theological_decisions:
- issue: Relação entre bispo, Igreja, Cristo e Pai
  choice: Preservar as analogias paralelas de união
  alternative: Explicar a passagem como uma doutrina eclesiológica sistemática
  rationale: O texto exorta à unidade por analogia; a tradução não deve acrescentar definições institucionais ou metafísicas ausentes.
- issue: Sentido de estar fora do recinto do altar e carecer do pão
  choice: Manter a linguagem metafórica sem explicação no corpo do texto
  alternative: Traduzir explicitamente como exclusão da Eucaristia ou da salvação
  rationale: A formulação pode envolver assembleia, culto e participação eucarística, mas o testemunho disponível não justifica resolver toda essa tensão numa única interpretação.
- issue: Oração do bispo e de toda a Igreja
  choice: Tratar ‘do bispo e de toda a Igreja’ como uma oração coletiva
  alternative: Afirmar uma eficácia sacramental exclusiva do bispo
  rationale: A comparação ressalta a força da oração comum, mas não explicita no trecho uma teoria sacramental completa.
- issue: Submissão ao bispo e entrega a Deus
  choice: Preservar a lógica exortativa do autor
  alternative: Equiparar sem qualificação toda obediência episcopal à obediência divina
  rationale: A tradução mantém a afirmação do texto sem importar uma doutrina posterior de autoridade irrestrita.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Emprega ‘vocês’ para o plural e mantém termos históricos como ‘bispo’, ‘altar’ e ‘congregação’. Esta versão é provisória porque foi preparada a partir do testemunho inglês de domínio público e da camada inglesa auditada; requer revisão direta da tradição manuscrita grega da recensão média.
