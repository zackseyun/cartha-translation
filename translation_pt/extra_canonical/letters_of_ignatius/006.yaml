review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a sequência argumentativa, as analogias de união, a metáfora do altar e a exortação final. Contudo, «congregação» para ἐπὶ τὸ αὐτό é menos preciso: a expressão designa o reunir-se/estar juntos, não primariamente uma entidade congregacional. «Reunião» conserva melhor esse sentido sem impor uma leitura institucional. «Uma e outra pessoa» também é uma reprodução pouco natural de «one and another»; «um e outro» é idiomático e mantém o paralelo.'
  naturalness: O português é claro, atual e de registro apropriado. A pequena revisão proposta melhora a fluência em «a oração de um e de outro» e evita que «comparece à congregação» soe como pertença ou presença numa instituição, em vez de participação na reunião comum.
  terminology: «Bispo», «Igreja», «altar», «Espírito», «submissão» e «pão [de Deus]» foram mantidos de forma adequada. «Comunhão» é uma opção possível para a relação estreita expressa no início, embora o termo grego subjacente também possa abranger convivência/associação; no contexto, não cria alteração doutrinária. Mantêm-se os colchetes em «[de Deus]» e a nota de cautela textual.
  issues:
  - severity: medium
    issue: «quem não comparece à congregação»
    rationale: A formulação grega ἐπὶ τὸ αὐτό refere-se ao ajuntamento ou reunião comum. «Congregação» pode designar a comunidade como instituição; «não vem à reunião» preserva mais diretamente a ação expressa no original e no testemunho inglês.
  - severity: low
    issue: «a oração de uma e outra pessoa»
    rationale: Embora compreensível, a expressão é pouco natural no português atual. «A oração de um e de outro» é idiomática, conserva a construção distributiva e não modifica o sentido.
  revised_text: 'Pois, se em pouco tempo tive tamanha comunhão com o bispo de vocês — não de modo meramente humano, mas no Espírito —, quanto mais felicito vocês, que estão estreitamente unidos a ele, assim como a Igreja está unida a Jesus Cristo, e Jesus Cristo ao Pai, para que todas as coisas estejam em harmonia na unidade.


    Que ninguém se engane. Se alguém não está dentro do recinto do altar, fica privado do pão [de Deus].[a] Pois, se a oração de um e de outro tem tamanha força, quanto mais a oração do bispo e de toda a Igreja!


    Portanto, quem não vem à reunião demonstra, com isso, seu orgulho e se separou, pois está escrito: “Deus resiste aos orgulhosos”.[b] Tenhamos, portanto, o cuidado de não resistir ao bispo, para que, por nossa submissão, nos entreguemos a Deus.'
  revised_footnotes:
  - marker: a
    text: A expressão “recinto do altar” conserva uma imagem cultual. “De Deus” aparece entre colchetes no testemunho inglês fornecido; a confirmação direta no grego ainda está pendente.
    reason: Sinalizar a metáfora histórica e a incerteza editorial/textual indicada pela fonte de trabalho.
  - marker: b
    text: Alusão a Provérbios 3:34, também citada em Tiago 4:6 e 1Pedro 5:5.
    reason: Identificar a referência bíblica explicitamente introduzida por “está escrito”.
  revision_rationale: A revisão é limitada a duas correções seguras de precisão e idiomaticidade. «À reunião» representa melhor o sentido de reunir-se expresso pela fórmula grega subjacente e evita institucionalização indevida. «De um e de outro» torna natural uma construção distributiva sem alterar a comparação sobre a força da oração. As notas, seus marcadores e a ambiguidade de «pão [de Deus]» permanecem preservados.
