base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/052.yaml
  text: 'The love of the Smyrnaeans and Ephesians greets you. Remember in your prayers the church which is in Syria, whereof [also] I am not worthy to be called a member, being the very last of them.


    Farewell in Jesus Christ, submitting yourselves to the bishop as to the commandment, and likewise also to the presbytery; and each of you severally love one another with an undivided heart.


    My spirit is offered up for you, not only now, but also when I shall attain unto God. For I am still in peril; but the Father is faithful in Jesus Christ to fulfill my petition and yours. May we be found unblamable in Him.'
translation:
  language: pt
  text: 'O amor dos esmirnenses e dos efésios saúda vocês. Lembrem-se, em suas orações, da igreja que está na Síria, da qual também[a] não sou digno de ser chamado membro, pois sou o último entre eles.


    Permaneçam firmes em Jesus Cristo, submetendo-se ao bispo como a um mandamento e, do mesmo modo, ao presbitério. E cada um de vocês ame os outros com um coração indiviso.


    Minha vida é dada em troca da de vocês, não somente agora, mas também quando eu chegar a Deus. Pois ainda estou em perigo; mas o Pai é fiel, em Jesus Cristo, para cumprir o meu pedido e o de vocês. Que sejamos encontrados irrepreensíveis nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo “também” é uma restauração editorial assinalada no testemunho inglês fornecido; sua confirmação depende da revisão direta da tradição manuscrita grega.
    reason: Preserva visivelmente o sinal de incerteza editorial da fonte de trabalho, sem tratar a palavra como segura no texto-base.
lexical_decisions:
- source_word: the love of the Smyrnaens and Ephesians
  choice: O amor dos esmirnenses e dos efésios
  rationale: Mantém a personificação coletiva do testemunho, em vez de substituí-la por uma saudação direta das comunidades.
- source_word: presbytery
  choice: presbitério
  rationale: Designa o corpo de presbíteros e preserva a terminologia eclesial antiga sem reduzi-la a um único presbítero.
- source_word: undivided heart
  choice: coração indiviso
  rationale: Conserva a imagem de inteireza e lealdade não fragmentada, com formulação natural e digna em português.
- source_word: attain unto God
  choice: alcançar a Deus
  rationale: Preserva a expressão característica e sua força escatológica, sem explicitar de modo indevido como se dá esse alcançar.
- source_word: unblamable
  choice: irrepreensíveis
  rationale: Expressa a condição de não estar sujeito a acusação ou censura, sem sugerir perfeição metafísica.
theological_decisions:
- issue: Submissão ao bispo “como ao mandamento”
  choice: submetendo-se ao bispo como ao mandamento
  alternative: submetendo-se ao bispo como a um mandamento de Deus
  rationale: A redação mantém a construção incomum e sua ambiguidade, sem acrescentar “de Deus”, ausente do testemunho fornecido.
- issue: Linguagem sacrificial sobre o espírito do autor
  choice: Meu espírito é oferecido por vocês
  alternative: Eu me entrego por vocês
  rationale: Preserva a imagem cultual ou sacrificial do testemunho e evita convertê-la apenas em linguagem genérica de dedicação.
- issue: Fidelidade do Pai e realização das petições
  choice: o Pai é fiel, em Jesus Cristo, para realizar o meu pedido e o de vocês
  alternative: o Pai, por meio de Jesus Cristo, atenderá às nossas orações
  rationale: Mantém a relação sintática e a distinção entre os pedidos, sem transformar a declaração em promessa mais explícita do que o texto permite.
translation_notes:
  register: Português moderno, claro e dignificado, com leitura natural no Brasil e compreensão internacional. Mantiveram-se termos históricos como “presbitério” e formulações teologicamente densas sem paráfrases denominacionais. Esta versão é provisória, pois foi elaborada a partir do testemunho inglês de domínio público; a revisão direta do grego da recensão média ainda está pendente.
