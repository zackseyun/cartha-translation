base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/090.yaml
  text: Ignatius, who is also called Theophorus, to Polycarp, bishop of the church of the Smyrnaeans—or rather, one who has God the Father and Jesus Christ as his bishop—abundant greeting.
translation:
  language: pt
  text: Inácio, também chamado Teóforo, a Policarpo, bispo da igreja dos esmirnenses — ou melhor, supervisionado por Deus Pai e pelo Senhor Jesus Cristo —, muitas saudações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Mantém o cognome tradicional como nome próprio, sem decidir entre seus sentidos etimológicos possíveis.
- source_word: Smyrnaens
  choice: esmirnenses
  rationale: Gentílico português corrente para os habitantes de Esmirna, adequado ao contexto eclesial.
- source_word: bishop
  choice: bispo
  rationale: Preserva o título e o jogo retórico da saudação, primeiro aplicado a Policarpo e depois a Deus Pai e Jesus Cristo.
- source_word: abundant greeting
  choice: muitas saudações
  rationale: Expressão natural em português que conserva a ideia de saudação ampla ou abundante sem soar excessivamente literal.
theological_decisions:
- issue: Deus Pai e Jesus Cristo descritos conjuntamente como bispo de Policarpo
  choice: tem como bispo Deus Pai e Jesus Cristo
  alternative: tem Deus Pai e Jesus Cristo como seus bispos
  rationale: Conserva o singular do testemunho fornecido e a tensão retórica e teológica da formulação, sem harmonizá-la para um plural.
- issue: Função de «ou melhor»
  choice: — ou melhor, alguém que... —
  alternative: ou, antes, por Deus Pai e Jesus Cristo episcopado
  rationale: Mantém a autocorreção enfática de Inácio e deixa claro que a segunda descrição se refere a Policarpo, evitando uma formulação portuguesa obscura.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe epistolar preservada. O texto é necessariamente provisório porque a revisão direta do grego ainda está pendente; as decisões seguem o testemunho inglês público fornecido e evitam resolver ambiguidades além de sua evidência.
