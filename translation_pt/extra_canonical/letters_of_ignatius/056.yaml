revisions:
- from: 'Vocês nunca tiveram inveja de ninguém; ensinaram a outros. E eu desejo que permaneçam válidas as lições que vocês, como mestres, ordenam.


    Apenas orem para que eu tenha poder por dentro e por fora, a fim de que eu não apenas fale, mas também deseje; que eu não apenas seja chamado cristão, mas também seja reconhecido como tal. Pois, se eu for reconhecido como tal, também poderei ser chamado assim e ser fiel quando já não estiver visível para o mundo.


    Nada do que é visível é bom. Pois nosso Deus, Jesus Cristo, estando no Pai, torna-se ainda mais claramente visível. A obra não é questão de persuasão; pelo contrário, o cristianismo é poder quando é odiado pelo mundo.'
  to: 'Vocês nunca invejaram ninguém; ensinaram outros. E eu desejo que permaneçam firmes as instruções que vocês dão como mestres.



    Apenas orem para que eu tenha força tanto interior como exteriormente, a fim de que eu não apenas fale, mas também deseje; que eu não apenas seja chamado cristão, mas também seja achado como tal. Pois, se eu for achado como tal, também poderei ser chamado cristão e ser fiel então, quando já não estiver visível para o mundo.



    Nada do que é visível é bom. Pois o nosso Deus, Jesus Cristo, estando no Pai, é visto com maior clareza. A obra não é de persuasão, mas o cristianismo é de grandeza quando é odiado pelo mundo.'
  rationale: 'A revisão segue o grego da recensão média acima do audit trail inglês nos dois pontos em que este é menos preciso: «grandeza» para μεγέθους e «é visto» para φαίνεται. Também ajusta construções para um português moderno e digno, sem explicitar o sentido martirial de «já não estiver visível para o mundo» nem impor uma interpretação à antítese entre persuasão e grandeza.'
