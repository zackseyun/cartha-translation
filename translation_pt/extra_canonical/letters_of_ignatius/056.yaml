base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/056.yaml
  text: 'You never begrudged anyone; you were the instructors of others. And I desire that the lessons you give as teachers will remain in force.


    Only pray that I may have power both inwardly and outwardly, so that I may not only say it but also desire it; that I may not only be called a Christian but also be found to be one. For if I am found to be one, then I can also be called one and be faithful when I am no longer visible to the world.


    Nothing visible is good. For our God Jesus Christ, being in the Father, is all the more plainly visible. The work is not of persuasiveness, but Christianity is a thing of power whenever it is hated by the world.'
translation:
  language: pt
  text: 'Vocês nunca invejaram ninguém; ensinaram outros. E eu desejo que permaneçam firmes as instruções que vocês dão como mestres.



    Apenas orem para que eu tenha força tanto interior como exteriormente, a fim de que eu não apenas fale, mas também deseje; que eu não apenas seja chamado cristão, mas também seja achado como tal. Pois, se eu for achado como tal, também poderei ser chamado cristão e ser fiel então, quando já não estiver visível para o mundo.



    Nada do que é visível é bom. Pois o nosso Deus, Jesus Cristo, estando no Pai, é visto com maior clareza. A obra não é de persuasão, mas o cristianismo é de grandeza quando é odiado pelo mundo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: begrudged / grudged
  choice: tiveram inveja de
  rationale: Expressa em português corrente a ideia de ressentir-se do bem ou da posição de outra pessoa, sem acrescentar um objeto não indicado.
- source_word: hold good
  choice: permaneçam válidas
  rationale: Conserva o sentido de continuarem vigentes ou eficazes as instruções dadas.
- source_word: power within and without
  choice: poder por dentro e por fora
  rationale: Mantém o paralelismo entre realidade interior e manifestação exterior, sem interpretar mais precisamente a natureza desse poder.
- source_word: be found one
  choice: seja reconhecido como tal
  rationale: Comunica a ideia de mostrar-se ou comprovar-se cristão, em contraste com apenas receber o nome.
- source_word: The Work
  choice: A obra
  rationale: Preserva o termo amplo e sua possível força enfática, sem identificar de modo indevido uma obra específica.
- source_word: persuasiveness
  choice: persuasão
  rationale: Mantém o contraste entre discurso persuasivo e poder efetivo.
- source_word: might / power
  choice: poder
  rationale: Escolha direta e teologicamente não restritiva para a força eficaz atribuída ao cristianismo.
theological_decisions:
- issue: Designação de Jesus Cristo como Deus
  choice: nosso Deus, Jesus Cristo
  alternative: Jesus Cristo, nosso Deus
  rationale: Preserva explicitamente a alta cristologia do testemunho e a relação sintática entre o título divino e Jesus Cristo.
- issue: Paradoxo entre invisibilidade e manifestação
  choice: estando no Pai, torna-se ainda mais claramente visível
  alternative: por estar no Pai, manifesta-se com maior clareza
  rationale: Mantém a tensão paradoxal do texto, evitando explicá-la ou harmonizá-la.
- issue: Fidelidade quando já não visível ao mundo
  choice: ser fiel quando já não estiver visível para o mundo
  alternative: então ser considerado fiel, quando desaparecer do mundo
  rationale: Conserva a ambiguidade entre fidelidade demonstrada no martírio e reconhecimento como fiel, sem inserir explicitamente a morte.
- issue: Cristianismo odiado pelo mundo
  choice: o cristianismo é poder quando é odiado pelo mundo
  alternative: o cristianismo é obra de poder sempre que o mundo o odeia
  rationale: Preserva a formulação provocativa e a relação temporal sem transformar o ódio do mundo em condição doutrinária sistemática.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. Mantiveram-se os paralelismos, as repetições deliberadas e as tensões teológicas. Como o material fornecido é um testemunho inglês de domínio público e a revisão direta do grego da recensão média ainda está pendente, esta redação deve ser considerada provisória para fins de crítica textual e lexical.
