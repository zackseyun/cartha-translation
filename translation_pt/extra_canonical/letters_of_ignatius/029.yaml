  english_witness: 'Seeing then that in the aforementioned persons I beheld your whole people in faith and embraced them, I advise you, be ye zealous to do all things in godly concord, the bishop presiding after the likeness of God and the presbyters after the likeness of the council of the Apostles, with the deacons also who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore do ye all study conformity to God and pay reverence one to another; and let no man regard his neighbor after the flesh, but love ye one another in Jesus Christ always. Let there be nothing among you which shall have power to divide you, but be ye united with the bishop and with them that preside over you as an ensample and a lesson of incorruptibility.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/029.yaml
  text: 'Since, in the persons mentioned above, I saw and embraced your whole people in faith, I urge you: be zealous to do all things in godly concord, with the bishop presiding after the likeness of God, the presbyters after the likeness of the council of the Apostles, and also the deacons, who are most dear to me, having been entrusted with the diaconate of Jesus Christ, who was with the Father before the worlds and appeared at the end of time.


    Therefore, all of you, study conformity to God and show reverence to one another. Let no one regard a neighbor after the flesh, but always love one another in Jesus Christ. Let there be nothing among you that has power to divide you; rather, be united with the bishop and with those who preside over you, as an example and a lesson of incorruptibility.'
translation:
  language: pt
  text: 'Visto, pois, que nas pessoas mencionadas acima contemplei e abracei na fé todo o povo de vocês, aconselho-os: empenhem-se em fazer tudo em piedosa concórdia, sob a presidência do bispo à semelhança de Deus, dos presbíteros à semelhança do conselho dos apóstolos e também dos diáconos, que me são muito queridos e aos quais foi confiado o diaconato de Jesus Cristo — aquele que estava com o Pai antes dos séculos e apareceu no fim dos tempos.


    Portanto, empenhem-se todos em viver em conformidade com Deus e tratem uns aos outros com reverência. Ninguém considere o próximo segundo a carne; pelo contrário, amem-se sempre uns aos outros em Jesus Cristo. Não haja entre vocês coisa alguma capaz de dividi-los. Antes, estejam unidos ao bispo e aos que os presidem, como exemplo e ensinamento de incorruptibilidade.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly concord
  choice: piedosa concórdia
  rationale: Preserva tanto a dimensão religiosa quanto a ênfase na harmonia comunitária, em registro digno e inteligível.
- source_word: presbyters
  choice: presbíteros
  rationale: Mantém o termo eclesial histórico sem o identificar de modo indevido com uma estrutura denominacional moderna específica.
- source_word: diaconate
  choice: diaconato
  rationale: Conserva a designação histórica do encargo confiado aos diáconos.
- source_word: before the worlds
  choice: antes dos séculos
  rationale: Expressa a fórmula temporal tradicional sem reduzir sua amplitude a uma simples referência à criação do mundo.
- source_word: after the flesh
  choice: segundo a carne
  rationale: Preserva a formulação teológica e sua possível tensão sem interpretá-la como mera aparência, parentesco ou parcialidade humana.
- source_word: incorruptibility
  choice: incorruptibilidade
  rationale: Retém a amplitude do conceito, que pode envolver integridade moral e participação na vida imperecível.
theological_decisions:
- issue: Analogia entre os dirigentes e Deus ou os apóstolos
  choice: à semelhança de Deus / à semelhança do conselho dos apóstolos
  alternative: no lugar de Deus / no lugar do colégio apostólico
  rationale: A opção evita transformar uma analogia em identidade representativa absoluta e preserva a formulação do testemunho fornecido.
- issue: Preexistência de Jesus Cristo
  choice: aquele que estava com o Pai antes dos séculos
  alternative: aquele que existia junto ao Pai antes da criação
  rationale: Mantém a afirmação cristológica forte e a linguagem temporal ampla sem acrescentar uma definição metafísica não explicitada no testemunho.
- issue: Conformidade com Deus
  choice: viver em conformidade com Deus
  alternative: imitar a Deus
  rationale: Preserva o sentido ético-comunitário sem limitar a expressão à ideia mais específica de imitação.
- issue: Incorruptibilidade
  choice: incorruptibilidade
  alternative: integridade incorruptível
  rationale: Não resolve se o termo aponta sobretudo para integridade ética, ausência de corrupção ou vida imperecível.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O texto mantém tom exortativo e eclesial, evita arcaísmos pronominais e preserva termos históricos relevantes. Como a revisão direta do grego está pendente, escolhas potencialmente sensíveis permanecem próximas do testemunho inglês público fornecido.
