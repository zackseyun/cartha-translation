review_pass:
  verdict: revise
  source_fidelity: A revisão permanece necessariamente condicionada ao testemunho inglês público, pois a revisão direta do grego está pendente. O rascunho preserva bem os termos eclesiais e cristológicos principais, mas a primeira frase desloca «na fé» para «abracei», quando o testemunho o vincula à visão do povo; além disso, sua construção pode fazer os diáconos parecerem incluídos entre os que presidem. A revisão corrige ambos os pontos sem ampliar o sentido.
  naturalness: O registro é em geral claro, moderno e adequado. A redação revista torna a enumeração dos bispo, presbíteros e diáconos mais legível e elimina uma ambiguidade sintática relevante.
  terminology: «Presbíteros», «diáconos», «diaconato», «segundo a carne», «antes dos séculos» e «incorruptibilidade» são escolhas apropriadas e conservadoras. «Concórdia piedosa» soa mais natural em português do que «piedosa concórdia», sem perda de sentido.
  issues:
  - severity: medium
    issue: O modificador «na fé» está ligado de modo ambíguo a «abracei».
    rationale: No testemunho fornecido, «in faith» caracteriza o povo que o autor viu («I beheld your whole people in faith») e não o ato de abraçar. «Vi todo o povo de vocês na fé e o abracei» preserva essa ligação.
  - severity: high
    issue: A enumeração sob «a presidência» pode incluir indevidamente os diáconos.
    rationale: O testemunho distingue o bispo e os presbíteros, que presidem, dos diáconos, aos quais foi confiado o diaconato. A frase do rascunho coordena «dos diáconos» sob «sob a presidência», alterando potencialmente a estrutura da exortação.
  - severity: low
    issue: «Piedosa concórdia» é menos idiomático na ordem adjetivo-substantivo.
    rationale: «Concórdia piedosa» mantém o registro elevado e a mesma qualificação religiosa, com fluidez mais natural.
  revised_text: 'Visto, pois, que, nas pessoas mencionadas acima, vi todo o povo de vocês na fé e o abracei, aconselho-os: sejam zelosos em fazer todas as coisas em concórdia piedosa, tendo o bispo a presidência à semelhança de Deus, os presbíteros à semelhança do conselho dos apóstolos e os diáconos — que me são muito queridos e aos quais foi confiado o diaconato de Jesus Cristo, aquele que estava com o Pai antes dos séculos e apareceu no fim dos tempos.


    Portanto, todos vocês, procurem conformar-se a Deus e tratem uns aos outros com reverência. Ninguém considere o próximo segundo a carne; antes, amem-se sempre uns aos outros em Jesus Cristo. Não haja entre vocês nada que tenha poder para dividi-los; antes, estejam unidos ao bispo e aos que os presidem, como exemplo e ensinamento de incorruptibilidade.'
  revised_footnotes: []
  revision_rationale: A revisão reposiciona «na fé» para qualificar «todo o povo», separa sintaticamente os diáconos da presidência atribuída ao bispo e aos presbíteros e ajusta pequenas escolhas de fluência. Mantém a analogia «à semelhança de», a linguagem da preexistência («antes dos séculos») e a ambiguidade teológica de «incorruptibilidade», sem notas explicativas que imponham interpretação.
