base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/087.yaml
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in bonds most pleasing to God, I salute all men, though I am not worthy to belong to it, being the very last of them. By the divine will was this vouchsafed to me, not of my own complicity, but by God’s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore, that your work may be perfected both on earth and in heaven, it is fitting that your church should appoint, for the honor of God, an ambassador of God, that he may go as far as Syria and congratulate them because they are at peace, have recovered their proper stature, and their proper fullness has been restored to them.


    It seemed to me therefore a fitting thing that you should send one of your own people with a letter, that he might join with them in giving glory for the calm which, by God’s will, had overtaken them, and because they were already reaching a haven through your prayers. Seeing you are perfect, let your counsels also be perfect; for if you desire to do well, God is ready to grant the means.'
translation:
  language: pt
  text: 'A oração de vocês chegou até a igreja que está em Antioquia da Síria. Vindo de lá como prisioneiro, em cadeias muito agradáveis a Deus, saúdo a todos, embora eu não seja digno de pertencer a ela, pois sou o último de todos eles. Pela vontade divina, isso me foi concedido, não por cumplicidade minha, mas pela graça de Deus. Oro para que essa graça me seja concedida plenamente, a fim de que, por meio das orações de vocês, eu alcance Deus.[a]


    Portanto, para que a obra de vocês seja aperfeiçoada tanto na terra como no céu, convém que a igreja de vocês designe, para a honra de Deus, um embaixador de Deus, para que ele vá até a Síria e os felicite porque estão em paz, recuperaram sua devida grandeza e lhes foi restaurada sua própria organização.[b]


    Pareceu-me, portanto, apropriado que vocês enviassem um dos seus com uma carta, para que ele se unisse a eles em dar glória pela calmaria que, pela vontade de Deus, lhes sobreveio e porque, mediante as orações de vocês, já chegavam a um porto.[c] Visto que vocês são perfeitos, que também sejam perfeitas as suas deliberações; pois, se desejam fazer o bem, Deus está pronto para lhes conceder os meios.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Não por cumplicidade minha” traduz uma expressão grega concisa que pode referir-se à ausência de culpa, envolvimento ou responsabilidade pessoal na situação de sua prisão.
    reason: Preserva a ambiguidade da expressão, sem transformá-la em uma afirmação sobre mérito religioso.
  - marker: b
    text: “Organização” traduz uma palavra que pode referir-se à constituição, ordem ou estrutura própria da comunidade.
    reason: Esclarece o alcance comunitário do termo sem fixar uma estrutura eclesiástica específica.
  - marker: c
    text: “Calmaria” e “porto” formam uma metáfora náutica para o restabelecimento da paz na igreja de Antioquia.
    reason: Esclarece a unidade da imagem sem substituir a metáfora por uma explicação no texto.
lexical_decisions:
- source_word: prayer sped forth
  choice: A oração de vocês chegou até
  rationale: Expressa de modo natural a imagem de uma oração enviada e eficaz, sem acrescentar uma explicação causal ausente no testemunho.
- source_word: most godly bonds / bonds most pleasing to God
  choice: cadeias muito agradáveis a Deus
  rationale: Preserva a avaliação religiosa das cadeias sem sugerir que elas sejam divinas em sua origem ou natureza.
- source_word: ambassador of God
  choice: embaixador de Deus
  rationale: Mantém a linguagem representativa e solene do testemunho, sem substituir o encargo por um título eclesiástico específico.
- source_word: proper stature / proper bulk
  choice: devida grandeza / devida plenitude
  rationale: Conserva as duas imagens correlatas de restauração, evitando o literalismo pouco natural de “volume” ou “massa” em português.
- source_word: calm ... haven
  choice: calmaria ... porto seguro
  rationale: Preserva a metáfora náutica coerente do alívio após a perturbação.
- source_word: counsels
  choice: deliberações
  rationale: No contexto de decidir e organizar o envio de um representante, “deliberações” é mais preciso do que “conselhos”.
theological_decisions:
- issue: A expressão “alcançar Deus” em contexto de prisão e possível martírio
  choice: eu alcance Deus
  alternative: eu chegue à presença de Deus
  rationale: Mantém a formulação teologicamente carregada e sua possível referência ao martírio, sem explicá-la ou atenuá-la no corpo do texto.
- issue: Relação entre graça divina e mérito pessoal
  choice: não por mérito próprio, mas pela graça de Deus
  alternative: não por minha própria participação, mas pela graça de Deus
  rationale: O testemunho inglês usa uma expressão obscura (“complicity”); a tradução comunica o contraste evidente entre realização própria e graça, mas registra a incerteza em nota.
- issue: “Perfeitos” aplicado aos destinatários e às suas decisões
  choice: Visto que vocês são perfeitos, que também sejam perfeitas as suas deliberações
  alternative: Visto que vocês são maduros, que também sejam maduras as suas decisões
  rationale: Preserva a repetição e a tensão retórica do testemunho, sem reinterpretar “perfeitos” apenas como maturidade.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com “vocês” para a segunda pessoa plural. O período foi moderadamente segmentado para legibilidade, preservando paralelismos e metáforas. Rascunho necessariamente provisório: foi produzido a partir do testemunho inglês público fornecido, pois a revisão direta do grego da recensão média está explicitamente pendente.'
