source:
  text: 'Your prayer sped forth unto the church which is in Antioch of Syria; whence coming a prisoner in most godly bonds I salute all men, though I am not worthy to belong to it, being the very last of them. By the Divine will was this vouchsafed to me, not of my own complicity, but by God''s grace, which I pray may be given to me perfectly, that through your prayers I may attain unto God.


    Therefore that your work may be perfected both on earth and in heaven, it is meet that your church should appoint, for the honor of God, an ambassador of God that he may go as far as Syria and congratulate them because they are at peace, and have recovered their proper stature, and their proper bulk hath been restored to them.


    It seemed to me therefore a fitting thing that ye should send one of your own people with a letter, that he might join with them in giving glory for the calm which by God''s will had overtaken them, and because they were already reaching a haven through your prayers. Seeing ye are perfect, let your counsels also be perfect; for if ye desire to do well, God is ready to grant the means.'
