review_pass:
  verdict: revise
  source_fidelity: 'O rascunho acompanha bem a estrutura e as imagens do testemunho inglês, mas introduz sentidos que não estão assegurados: “mérito próprio” interpreta indevidamente a expressão obscura “not of my own complicity”, “membros” explicita “deles”, e “porto seguro” acrescenta “seguro”. “Chegou até” também enfraquece a imagem dinâmica de a oração ir rapidamente à igreja. A revisão conserva a obscuridade onde o texto de partida a apresenta e retém as imagens duplicadas de estatura/tamanho e calmaria/porto.'
  naturalness: A redação é clara e de registro apropriado. Os ajustes propostos tornam mais idiomática a oração relativa do emissário e evitam a segmentação artificial de “Que ele vá”. “Estatura que lhes é própria” e “tamanho que lhes é próprio” preservam, em português compreensível, o paralelismo imagético incomum do original.
  terminology: “Cadeias muito agradáveis a Deus”, “embaixador de Deus”, “graça de Deus”, “alcançar Deus” e “perfeitos” são escolhas adequadas. Para a cláusula relativa à consciência/participação pessoal, não é seguro converter a formulação em linguagem de mérito; por isso a tradução literal é acompanhada de nota de incerteza.
  issues:
  - severity: medium
    issue: “não por mérito próprio”
    rationale: “Mérito” introduz uma categoria avaliativa e teológica que o testemunho inglês (“not of my own complicity”) não afirma. A formulação subjacente é obscura e deve permanecer não resolvida, com nota.
  - severity: low
    issue: “o último de seus membros”
    rationale: “Membros” não consta do testemunho e torna explícita uma metáfora eclesial ausente; “o último de todos eles” é mais fiel.
  - severity: low
    issue: “porto seguro”
    rationale: O testemunho diz apenas “a haven”; “seguro” é uma qualificação acrescentada.
  - severity: low
    issue: “chegou até” para “sped forth”
    rationale: A opção comunica o resultado, mas não o movimento rápido/impetuoso da imagem.
  revised_text: 'A oração de vocês se dirigiu prontamente à igreja que está em Antioquia da Síria. Vindo de lá como prisioneiro, em cadeias muito agradáveis a Deus, saúdo a todos, embora eu não seja digno de pertencer a ela, pois sou o último de todos eles. Pela vontade divina, isso me foi concedido, não segundo minha própria consciência,[a] mas pela graça de Deus. Oro para que essa graça me seja concedida plenamente, a fim de que, por meio das orações de vocês, eu alcance Deus.[b]


    Portanto, para que a obra de vocês seja aperfeiçoada tanto na terra como no céu, convém que a igreja de vocês designe, para a honra de Deus, um embaixador de Deus que vá até a Síria e os felicite porque estão em paz, recuperaram a estatura que lhes é própria e lhes foi restituído o tamanho que lhes é próprio.[c]


    Assim, pareceu-me apropriado que vocês enviassem alguém dentre vocês com uma carta, para que se unisse a eles em dar glória pela calmaria que, pela vontade de Deus, lhes sobreveio e porque, mediante as orações de vocês, eles já se aproximavam de um porto.[d] Visto que vocês são perfeitos, que também sejam perfeitas as suas deliberações; pois, se desejam fazer o bem, Deus está pronto para lhes conceder os meios.'
  revised_footnotes:
  - marker: a
    text: A expressão traduzida literalmente por “não segundo minha própria consciência” é obscura neste testemunho e sua formulação grega requer confirmação direta. Não deve ser reduzida sem ressalvas a “não por mérito próprio”.
    reason: Preserva uma dificuldade textual e impede que uma interpretação de mérito seja incorporada ao texto.
  - marker: b
    text: “Alcance Deus” pode aludir à expectativa de Inácio de chegar a Deus por meio do martírio.
    reason: A expressão tem peso teológico e escatológico que não deve ser resolvido silenciosamente.
  - marker: c
    text: “Estatura” e “tamanho” reproduzem duas imagens correlatas de restauração presentes no testemunho; a formulação grega precisa ser confirmada em revisão direta da tradição manuscrita.
    reason: Conserva o paralelismo incomum sem o harmonizar em uma única abstração.
  - marker: d
    text: “Calmaria” e “porto” formam uma metáfora náutica para o restabelecimento da paz na igreja de Antioquia.
    reason: Esclarece a unidade da imagem sem acrescentar a qualificação “seguro” ao porto.
  revision_rationale: A revisão remove explicitações e qualificações não garantidas pelo testemunho, preserva a linguagem dinâmica e as repetições imagéticas, e substitui a interpretação “mérito próprio” por uma tradução deliberadamente literal com nota de incerteza. Como a revisão direta do grego ainda está pendente, a nota assinala, sem tentar solucionar, a cláusula mais obscura.
