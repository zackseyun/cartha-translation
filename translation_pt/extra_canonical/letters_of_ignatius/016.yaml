review_pass:
  verdict: revise
  source_fidelity: O texto preserva bem os contrastes deliberadamente concisos («calar-se e ser», «falar e não ser»), a referência ao único Mestre, a escuta do seu silêncio e a metáfora dos templos. Há apenas pequenos ajustes seguros para refletir melhor o paralelismo entre «palavra/fala» e para não tornar a prática do mestre mais explícita do que o enunciado requer.
  naturalness: A redação é geralmente clara e digna. «Pratica o que ensina» é uma explicitação interpretativa leve; «quem ensina pratica» conserva melhor a concisão. No segundo parágrafo, «por meio de sua fala, aja» é menos fluente que «atue por sua palavra». No final, «o amor que justamente temos por ele» soa pouco idiomático em português moderno.
  terminology: «Mestre», «palavra», «silêncio», «Senhor», «templos» e «Deus» são escolhas adequadas. Mantém-se a capitalização discreta de «Mestre» e os pronomes em minúscula, sem inserir identificações ou desenvolvimentos doutrinários não expressos.
  issues:
  - severity: low
    issue: Explicitação em «pratica o que ensina»
    rationale: A testemunha diz apenas que quem fala/ensina «pratica»; a complementação «o que ensina» é plausível, mas não é necessária e reduz a concisão proverbial.
  - severity: low
    issue: Formulação de ação e reconhecimento no segundo parágrafo
    rationale: «Atue por sua palavra e seja reconhecido por seu silêncio» é mais natural e preserva o paralelismo do texto-base sem decidir quem o reconhece.
  - severity: low
    issue: Formulação final do amor dirigido a Deus
    rationale: «O amor que corretamente lhe dedicamos» comunica de modo mais idiomático o amor que se tem para com ele, mantendo o qualificativo moral («rightly»).
  revised_text: 'É melhor guardar silêncio e ser do que falar e não ser. Ensinar é algo excelente, se quem ensina pratica. Ora, há um só Mestre, que falou, e aconteceu. Sim, até mesmo as coisas que ele fez em silêncio são dignas do Pai.


    Quem verdadeiramente possui a palavra de Jesus também é capaz de escutar o seu silêncio, para que seja perfeito: para que atue por sua palavra e seja reconhecido por seu silêncio.


    Nada está oculto ao Senhor; até os nossos segredos estão perto dele. Portanto, façamos tudo sabendo que ele habita em nós, a fim de que sejamos seus templos e ele mesmo esteja em nós como nosso Deus. Assim é, e isso também se tornará evidente diante dos nossos olhos por meio do amor que corretamente lhe dedicamos.[a]'
