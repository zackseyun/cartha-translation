base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/016.yaml
  text: 'It is better to be silent and to be than to speak and not to be. It is a fine thing to teach, if the speaker practices. Now there is one teacher who spoke, and it came to pass. Indeed, even the things he has done in silence are worthy of the Father.


    Whoever truly possesses the word of Jesus is also able to listen to his silence, so that he may be perfect—so that through his speech he may act, and through his silence he may be known.


    Nothing is hidden from the Lord; even our secrets are near to him. Therefore, let us do everything knowing that he dwells in us, so that we may be his temples and he himself may be in us as our God. This is so, and it will also be made clear before our eyes through the love that we rightly bear toward him.'
translation:
  language: pt
  text: 'É melhor guardar silêncio e ser do que falar e não ser. Ensinar é algo excelente, se quem fala pratica o que ensina. Ora, há um só Mestre, que falou, e aconteceu. Sim, até mesmo as coisas que ele fez em silêncio são dignas do Pai.


    Quem verdadeiramente possui a palavra de Jesus também é capaz de escutar o seu silêncio, para que seja perfeito: para que, por meio de sua fala, aja e, por meio de seu silêncio, seja reconhecido.


    Nada está oculto ao Senhor; até os nossos segredos estão perto dele. Portanto, façamos tudo sabendo que ele habita em nós, a fim de que sejamos seus templos e ele mesmo esteja em nós como nosso Deus. Assim é, e isso também se tornará evidente diante dos nossos olhos pelo amor que justamente temos por ele.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público de J. B. Lightfoot. A tradição manuscrita grega da recensão média ainda requer revisão direta; por isso, algumas escolhas finas de sintaxe e vocabulário poderão ser ajustadas.
    reason: A fonte fornecida identifica explicitamente a versão inglesa como base de redação e informa que a revisão do grego está pendente.
lexical_decisions:
- source_word: keep silence / σιγᾶν (presumido pela tradição grega)
  choice: guardar silêncio
  rationale: Mantém a formulação enfática e proverbial, em registro digno e natural.
- source_word: to be
  choice: ser
  rationale: Preserva a concisão e a tensão ontológica do contraste, sem explicá-lo como mera coerência ou autenticidade.
- source_word: one teacher
  choice: um só Mestre
  rationale: O uso de maiúscula sinaliza a referência cristológica indicada pelo contexto, sem acrescentar um nome ausente.
- source_word: possesseth the word of Jesus
  choice: possui a palavra de Jesus
  rationale: 'Conserva a construção potencialmente ambígua: pode referir-se à mensagem de Jesus ou à palavra proveniente dele.'
- source_word: hearken unto His silence
  choice: escutar o seu silêncio
  rationale: Retém o paradoxo deliberado em vez de o substituir por uma interpretação explicativa.
- source_word: temples
  choice: templos
  rationale: Mantém a metáfora cultual no plural e sua aplicação comunitária aos leitores.
- source_word: rightly bear towards Him
  choice: justamente temos por ele
  rationale: Expressa a ideia de um amor devido ou correto sem impor uma definição doutrinária mais específica.
theological_decisions:
- issue: Identidade do «um só Mestre» e dos pronomes subsequentes
  choice: Mestre com inicial maiúscula e pronomes em minúscula
  alternative: mestre e pronomes todos em minúscula, ou inserir explicitamente «Jesus/Cristo»
  rationale: O contexto aponta para Jesus, mas a tradução não insere um nome que o texto fornecido não traz; a capitalização de «Mestre» orienta discretamente o leitor.
- issue: «As coisas que ele fez em silêncio são dignas do Pai»
  choice: preservar a relação aberta entre as obras silenciosas e o Pai
  alternative: explicar que são obras «agradáveis», «próprias» ou «reveladoras» do Pai
  rationale: «Dignas do Pai» conserva a formulação teologicamente densa sem decidir exatamente em que consiste essa dignidade.
- issue: Sujeito de «seja reconhecido»
  choice: manter o sujeito humano implícito
  alternative: traduzir como «Deus seja conhecido» ou explicitar quem reconhece quem
  rationale: A testemunha inglesa entende o sujeito como aquele que possui a palavra de Jesus; a formulação preserva isso, embora a revisão direta do grego ainda seja necessária.
- issue: Habitação divina nos fiéis
  choice: «ele habita em nós... ele mesmo esteja em nós como nosso Deus»
  alternative: atenuar para presença moral ou acrescentar linguagem trinitária específica
  rationale: Mantém a forte afirmação de habitação divina do texto, sem reduzi-la nem desenvolver uma doutrina além do trecho.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom proverbial e exortativo foi preservado, com frases claras e dignas. Evitaram-se arcaísmos como «deveras», «achegar-se» e «para que venha a ser», bem como paráfrases que eliminariam os paradoxos de «ser», «silêncio» e «palavra».
