review_pass:
  verdict: revise
  source_fidelity: 'É necessária uma correção importante em «sabendo que ele habita em nós». Em ὡς ἐν αὐτῷ κατοικοῦντες, o particípio indica que os exortados devem agir como pessoas que habitam nele (no Senhor). A oração seguinte então preserva a reciprocidade deliberada: eles são seus templos, e ele está neles como seu Deus. A redação proposta antecipava e duplicava a segunda afirmação, invertendo a relação da primeira.'
  naturalness: O texto é geralmente claro, moderno e apropriado ao registro. «Como quem habita nele» é idiomático e torna explícito o valor exortativo de ὡς sem acrescentar interpretação doutrinária. «Seja conhecido» reproduz mais diretamente γινώσκηται do que «seja reconhecido».
  terminology: «Guardar silêncio», «ser», «palavra de Jesus», «templos» e «dignas do Pai» preservam adequadamente os paradoxos e a terminologia do trecho. Mantém-se «Mestre» com maiúscula e os pronomes em minúscula, solução editorial discreta e consistente com a referência contextual, sem inserir um nome ausente.
  issues:
  - severity: high
    issue: Inversão da relação em «sabendo que ele habita em nós».
    rationale: O texto grego da recensão média lê ὡς ἐν αὐτῷ κατοικοῦντες, «como [pessoas] que habitam nele». A sequência «para que sejamos seus templos e ele mesmo esteja em nós» expressa precisamente a relação recíproca que a redação atual desfaz.
  - severity: low
    issue: «Seja reconhecido» é menos direto que «seja conhecido».
    rationale: γινώσκηται significa primariamente «seja conhecido». «Reconhecido» é possível, mas pode sugerir validação pública ou aceitação, nuance não exigida pelo texto.
  revised_text: 'É melhor guardar silêncio e ser do que falar e não ser. Ensinar é algo excelente, se quem fala pratica o que ensina. Ora, há um só Mestre, que falou, e aconteceu. Sim, até mesmo as coisas que ele fez em silêncio são dignas do Pai.


    Quem verdadeiramente possui a palavra de Jesus também é capaz de escutar o seu silêncio, para que seja perfeito: para que, por meio de sua fala, aja e, por meio de seu silêncio, seja conhecido.


    Nada está oculto ao Senhor; até os nossos segredos estão perto dele. Portanto, façamos tudo como quem habita nele, a fim de que sejamos seus templos e ele mesmo esteja em nós como nosso Deus. Assim é, e isso também se tornará evidente diante dos nossos olhos pelo amor que justamente temos por ele.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada na testemunha inglesa de domínio público de J. B. Lightfoot. A tradição manuscrita grega da recensão média ainda requer revisão direta integral; por isso, algumas escolhas finas de sintaxe e vocabulário poderão ser ajustadas.
    reason: A fonte fornecida identifica explicitamente a versão inglesa como base de redação e informa que a revisão integral do grego está pendente.
  revision_rationale: A revisão corrige a construção central da exortação final para conservar a alternância recíproca entre os fiéis habitarem no Senhor e o Senhor estar neles. Também ajusta «reconhecido» para «conhecido», mais próximo do verbo grego, sem resolver além do necessário a ambiguidade de quem conhece. As demais escolhas são mantidas por refletirem bem o tom conciso, paradoxal e teologicamente denso do original e da testemunha inglesa.
