review_pass:
  verdict: revise
  source_fidelity: 'A redação altera de modo indevido alguns pontos do testemunho: «me deixarem seguir» substitui «leave me alone»; «preservar minha carne» interpreta «desire my flesh»; e «nasça» troca a imagem ascensional de «rise» por nascimento. «Permitiu» também enfraquece a formulação de concessão graciosa/dignação divina. A revisão restitui esses elementos, mantendo a ambiguidade retórica de «palavra» e «clamor».'
  naturalness: O tratamento por «vocês» e o registro são naturais e adequados. A imagem final é deliberadamente poética e algo incomum em português; a nota a esclarece sem a reduzir a uma formulação doutrinária.
  terminology: «Libação», «altar», «coro» e «Pai em Jesus Cristo» preservam bem o vocabulário cultual e comunitário. «Clamor» corresponde mais diretamente ao «mere cry» do testemunho inglês do que «voz».
  issues:
  - severity: medium
    issue: Paráfrase interpretativa de «leave me alone» e «desire my flesh».
    rationale: «Me deixarem seguir» e «preservar minha carne» explicitam uma interpretação martirial que não está formulada assim no testemunho. «Me deixarem em paz» e «desejarem minha carne» conservam a expressão e sua força retórica.
  - severity: medium
    issue: A imagem final foi alterada de «rise» para «nasça».
    rationale: O texto conserva o par figurativo pôr-se/erguer-se; «nasça» introduz uma imagem diferente e pode sugerir uma leitura teológica mais definida.
  - severity: low
    issue: «Permitiu» é mais fraco que a concessão graciosa expressa no testemunho.
    rationale: «Dignou-se» conserva melhor o tom de favor divino sem ampliar seu sentido.
  revised_text: 'Pois não quero que vocês procurem agradar às pessoas, mas a Deus, como de fato lhe agradam. Pois eu mesmo jamais encontrarei uma oportunidade como esta de chegar a Deus, nem vocês, se permanecerem em silêncio, poderão atribuir a si mesmos obra mais nobre. Pois, se permanecerem em silêncio e me deixarem em paz, serei uma palavra de Deus; mas, se desejarem minha carne, voltarei a ser apenas um clamor.[a]



    Concedam-me apenas isto: que eu seja derramado como libação para Deus, enquanto ainda há um altar preparado, para que, formando um coro no amor, vocês cantem ao Pai em Jesus Cristo, porque Deus se dignou que o bispo da Síria fosse encontrado no Ocidente, tendo-o chamado do Oriente. É bom para mim pôr-me do mundo em direção a Deus, para que eu me levante para ele.[b]'
  revised_footnotes:
  - marker: a
    text: «Palavra» e «clamor» formam um contraste retórico. A linguagem sobre sua «carne» não especifica por si só como os destinatários poderiam intervir; no contexto da carta, relaciona-se ao desejo de Inácio de não ser impedido de sofrer o martírio.
    reason: Esclarece o contraste sem substituir a expressão concreta «desejarem minha carne» por uma paráfrase interpretativa no texto.
  - marker: b
    text: 'A frase preserva imagens de pôr-se e levantar-se, como o ocaso e o surgir de um astro: Inácio deseja afastar-se do mundo em direção a Deus. Também pode ser traduzida de modo menos figurado: «É bom partir do mundo para Deus, para que eu me levante para ele».'
    reason: A construção poética é incomum em português e o par de imagens deve ser esclarecido sem identificá-lo automaticamente com uma formulação técnica sobre a ressurreição.
  revision_rationale: A revisão mantém o português moderno e o registro solene, mas elimina paráfrases que restringiam ou reconfiguravam a linguagem do testemunho. Também conserva a sequência de imagens sacrificiais, corais e astronômicas e mantém as notas nos dois pontos que exigem orientação de leitura.
