base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/055.yaml
  text: 'For I do not want you to please people, but to please God, as indeed you do please him. For I myself will never find an opportunity like this to attain to God, nor can you, if you remain silent, receive credit for any nobler work. For if you remain silent and leave me alone, I am a word of God; but if you desire my flesh, then I will again be merely a cry.


    No, grant me nothing more than to be poured out as a libation to God while an altar is still ready, so that, forming yourselves into a chorus in love, you may sing to the Father in Jesus Christ, because God has graciously granted that the bishop from Syria should be found in the West, having summoned him from the East. It is good to set from the world unto God, so that I may rise unto him.'
translation:
  language: pt
  text: 'Pois não quero que vocês procurem agradar às pessoas, mas a Deus, como de fato já lhe agradam. Eu jamais terei uma oportunidade como esta de chegar a Deus; e vocês, se permanecerem em silêncio, não poderão ser reconhecidos por uma obra mais nobre. Pois, se permanecerem em silêncio a meu respeito e me deixarem em paz, serei uma palavra de Deus; mas, se desejarem o meu corpo, voltarei a ser apenas uma voz.[a]



    Concedam-me nada além de ser derramado como libação para Deus, enquanto ainda houver um altar pronto, para que, tornando-se um coro em amor, vocês cantem ao Pai em Jesus Cristo, porque Deus, por sua bondade, julgou digno que o bispo da Síria fosse encontrado no Ocidente, tendo-o chamado do Oriente. É bom que eu me ponha, passando do mundo para Deus, para que eu surja para ele.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Palavra” e “voz” formam um contraste retórico: se a comunidade não interferir, a morte de Inácio se tornará uma mensagem; se ela se apegar ao seu corpo, ele voltará a ser apenas uma voz.'
    reason: Esclarece o contraste sem tratá-lo como título teológico literal e sem alterar o sentido de «desejarem o meu corpo».
  - marker: b
    text: 'O texto joga com imagens de ocaso e surgimento: Inácio deseja “pôr-se” em relação ao mundo e “surgir” para Deus. De modo menos figurado, pode-se traduzir: “É bom partir do mundo para Deus, para que eu me levante para ele”.'
    reason: Preserva e explica a ambiguidade poética de δῦναι/ἀνατείλω, sem identificar o enunciado com uma formulação técnica sobre ressurreição.
lexical_decisions:
- source_word: men-pleasers
  choice: procurem agradar às pessoas
  rationale: Expressa em português corrente a ideia de orientar a conduta pela aprovação humana, sem restringi-la aos homens do sexo masculino.
- source_word: attain unto God
  choice: chegar a Deus
  rationale: Mantém o movimento em direção a Deus sem definir de modo indevido a natureza teológica dessa chegada.
- source_word: word of God / mere cry
  choice: palavra de Deus / apenas uma voz
  rationale: Preserva o contraste retórico entre uma mensagem dotada de sentido e uma voz ou clamor que não chega a se tornar palavra testemunhal.
- source_word: libation
  choice: libação
  rationale: Conserva a imagem sacrificial de uma oferta líquida derramada sobre ou junto ao altar.
- source_word: chorus
  choice: um só coro
  rationale: Reproduz a imagem comunitária e musical, ao mesmo tempo que explicita naturalmente a unidade do grupo em português.
- source_word: set / rise
  choice: me ponha no ocaso / nasça
  rationale: Preserva o jogo de imagens astronômicas entre desaparecer no horizonte do mundo e surgir para Deus.
theological_decisions:
- issue: Sentido da morte como caminho para Deus
  choice: chegar a Deus
  alternative: alcançar Deus
  rationale: A formulação conserva a expectativa de Inácio sem sugerir conquista, mérito ou uma definição sistemática do estado após a morte.
- issue: Identificação de Inácio como “palavra de Deus”
  choice: serei palavra de Deus
  alternative: serei uma palavra de Deus
  rationale: Mantém a formulação forte e sua tensão retórica, sem transformá-la em título cristológico nem explicá-la doutrinariamente.
- issue: Linguagem sacrificial do martírio
  choice: derramado como libação para Deus
  alternative: oferecido em sacrifício a Deus
  rationale: Preserva a metáfora específica da libação e evita ampliar a frase para uma teoria sacrificial não explicitada no trecho.
- issue: Imagem de ocaso e nascimento para Deus
  choice: deixando o mundo em direção a Deus, para que eu nasça para ele
  alternative: partir do mundo para Deus, a fim de ressuscitar para ele
  rationale: Conserva a metáfora poética e evita identificar silenciosamente “nascer/surgir” com uma formulação técnica sobre a ressurreição.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. A sintaxe foi atualizada sem eliminar as imagens sacrificial, coral e astronômica. Como a revisão direta do grego foi indicada como pendente no material fornecido, o texto segue prioritariamente o testemunho inglês público, consultando com cautela as formas gregas tradicionalmente associadas à recensão média e registrando em nota a principal ambiguidade poética.
