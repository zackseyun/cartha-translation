base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/068.yaml
  text: Therefore, be careful to observe one Eucharist (for there is one flesh of our Lord Jesus Christ and one cup for union in his blood; there is one altar, just as there is one bishop, together with the presbytery and the deacons, my fellow servants), so that whatever you do, you may do it in accordance with God.
translation:
  language: pt
  text: Portanto, tenham o cuidado de celebrar uma só Eucaristia, pois há uma só carne de nosso Senhor Jesus Cristo e um só cálice para a união em seu sangue; há um só altar, assim como há um só bispo, junto com o presbitério e os diáconos, meus companheiros de serviço. Assim, tudo o que fizerem, façam segundo Deus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; a revisão direta do grego da recensão média ainda está pendente. A expressão “segundo Deus” também pode ser entendida como “de acordo com Deus” ou “conforme a vontade de Deus”.
    reason: Registra a limitação da base documental fornecida e esclarece, sem resolver, a concisão ambígua da expressão final.
lexical_decisions:
- source_word: one eucharist
  choice: uma só Eucaristia
  rationale: Mantém a terminologia cristã antiga e a ênfase numérica de “one”; “celebrar” expressa de modo natural a observância comunitária da Eucaristia.
- source_word: one flesh
  choice: uma só carne
  rationale: Preserva a formulação concreta e teologicamente carregada do testemunho, sem suavizá-la para “corpo”.
- source_word: presbytery
  choice: presbitério
  rationale: Designa aqui o corpo coletivo dos presbíteros, não um edifício; o termo conserva a estrutura ministerial mencionada.
- source_word: my fellow-servants
  choice: meus companheiros de serviço
  rationale: Comunica serviço compartilhado sem introduzir conotação moderna de emprego nem apagar a humildade ministerial.
- source_word: after God
  choice: segundo Deus
  rationale: 'Conserva a expressão condensada e sua possível amplitude: agir conforme Deus, sua vontade ou sua ordem.'
theological_decisions:
- issue: Unidade da Eucaristia
  choice: uma só Eucaristia
  alternative: uma única celebração eucarística
  rationale: A redação escolhida preserva a concisão e a tensão entre unidade sacramental e unidade comunitária, sem especificar além do testemunho.
- issue: Relação expressa pelo cálice e pelo sangue
  choice: um só cálice para a união em seu sangue
  alternative: um só cálice que nos une por meio de seu sangue
  rationale: Mantém a ambiguidade da construção testemunhada quanto à natureza exata da união, evitando acrescentar objeto ou mecanismo não explicitado.
- issue: Sentido de “altar”
  choice: altar
  alternative: mesa
  rationale: Preserva a linguagem cultual do testemunho e sua associação paralela com a unidade episcopal, sem reinterpretá-la denominacionalmente.
translation_notes:
  register: Português moderno, digno e acessível, com formas verbais no plural amplamente naturais no Brasil. Mantiveram-se “Eucaristia”, “altar”, “bispo”, “presbitério” e “diáconos” por seu valor histórico e eclesial. A tradução é necessariamente provisória porque o material fornecido é um testemunho inglês, e não o texto grego.
