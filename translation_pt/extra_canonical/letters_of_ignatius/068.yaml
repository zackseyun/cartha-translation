review_pass:
  verdict: revise
  source_fidelity: A estrutura principal e os termos eclesiais do testemunho estão bem preservados. Contudo, a oração final introduzida por “that” é final/propositiva (“para que”), não meramente consecutiva (“Assim”), e “segundo Deus” é uma reprodução excessivamente literal e pouco natural de “after God”.
  naturalness: O texto é globalmente claro e de registro apropriado. “Para que ... o façam de acordo com Deus” mantém a concisão solene, mas soa mais natural em português moderno do que “Assim ... façam segundo Deus”.
  terminology: “Eucaristia”, “carne”, “cálice”, “altar”, “bispo”, “presbitério” e “diáconos” são escolhas adequadas. “Companheiros de serviço” comunica apropriadamente “fellow-servants”, sem impor leitura confessional.
  issues:
  - severity: medium
    issue: A relação final foi traduzida como consequência, não como propósito.
    rationale: 'O “that” do testemunho introduz o objetivo da exortação: a unidade descrita deve resultar em que tudo seja feito “after God”. “Assim” enfraquece essa relação; “para que” a preserva.'
  - severity: low
    issue: “Segundo Deus” é pouco idiomático no português contemporâneo.
    rationale: “De acordo com Deus” transmite de modo natural a formulação ampla do testemunho, sem especificar se se trata da vontade, ordem ou norma divina.
  revised_text: Portanto, tenham o cuidado de celebrar uma só Eucaristia (pois há uma só carne de nosso Senhor Jesus Cristo e um só cálice para a união em seu sangue; há um só altar, assim como há um só bispo, junto com o presbitério e os diáconos, meus companheiros de serviço), para que tudo o que fizerem o façam de acordo com Deus.[a]
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; a revisão direta do grego da recensão média ainda está pendente. A expressão “de acordo com Deus” traduz uma formulação concisa que também pode ser entendida como “conforme a vontade de Deus”.
    reason: Registra a limitação da base documental fornecida e esclarece a amplitude da expressão final, sem impor uma interpretação específica.
  revision_rationale: A revisão restabelece a relação de finalidade presente no testemunho e substitui um calque pouco natural por uma formulação portuguesa idiomática. Também reinsere os parênteses do testemunho, deixando explicitamente delimitada a explicação sobre a unidade da Eucaristia, do altar e do ministério.
