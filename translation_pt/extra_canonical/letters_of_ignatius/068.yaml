source:
  text: Be ye careful therefore to observe one eucharist (for there is one flesh of our Lord Jesus Christ and one cup unto union in His blood; there is one altar, as there is one bishop, together with the presbytery and the deacons my fellow-servants), that whatsoever ye do, ye may do it after God.
