review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva os elementos centrais do testemunho: a exortação à unidade eucarística, a única carne, o único cálice, o único altar, o bispo, o presbitério, os diáconos e a conclusão «segundo Deus». Convém, porém, manter a relação final de finalidade («para que») e a estrutura parentética do testemunho, em vez de converter a conclusão em uma frase apenas consecutiva.'
  naturalness: O registro é claro, moderno e apropriado. «Juntamente com» soa um pouco mais cuidado e natural neste contexto do que «junto com», e «esforcem-se por celebrar» comunica bem a força exortativa sem o tom algo burocrático de «tenham o cuidado de».
  terminology: «Eucaristia», «carne», «cálice», «altar», «bispo», «presbitério» e «diáconos» são escolhas adequadas. «Companheiros de serviço» preserva satisfatoriamente a solidariedade ministerial de «fellow-servants».
  issues:
  - severity: low
    issue: A oração final é apresentada como consequência autônoma («Assim»), não como finalidade.
    rationale: O testemunho liga a unidade eclesial-eucarística à finalidade de que tudo seja feito «after God». «Para que ... o façam» conserva mais precisamente essa relação, sem alterar o sentido.
  - severity: low
    issue: A moldura parentética da fundamentação sobre a Eucaristia e os ministros não foi mantida.
    rationale: A pontuação não muda substancialmente o conteúdo, mas os parênteses refletem a estrutura do testemunho e tornam mais clara a sequência da exortação principal até sua finalidade.
  revised_text: Portanto, esforcem-se por celebrar uma só Eucaristia (pois há uma só carne de nosso Senhor Jesus Cristo e um só cálice para a união em seu sangue; há um só altar, assim como há um só bispo, juntamente com o presbitério e os diáconos, meus companheiros de serviço), para que tudo o que fizerem, o façam segundo Deus.[a]
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; a revisão direta do grego da recensão média ainda está pendente. A expressão “segundo Deus” também pode ser entendida como “de acordo com Deus” ou “conforme a vontade de Deus”.
    reason: Registra a limitação da base documental fornecida e esclarece, sem resolver, a concisão ambígua da expressão final.
  revision_rationale: 'A revisão aproxima a sintaxe da do testemunho fornecido: conserva a justificativa entre parênteses e explicita a finalidade introduzida por «that». As escolhas terminológicas e a nota provisória são mantidas, pois não introduzem interpretação doutrinária adicional e refletem adequadamente a limitação de uma revisão baseada no testemunho inglês.'
