  source_fidelity: 'O texto português acompanha com boa fidelidade o testemunho inglês fornecido e preserva pontos importantes de ambiguidade: «chegar a Deus», «porção» e «considerado reprovado». A expressão «em oração uns pelos outros» é uma leitura natural de «in prayer one with another» e não acrescenta conteúdo doutrinário. Os colchetes de restauração foram preservados, bem como sua nota explicativa.'
  naturalness: Português moderno, claro e de registro condizente com uma carta cristã antiga sem arcaização excessiva. «Saúdo vocês», «correntes», «concórdia», «anime o coração» e «Orem também por mim» fluem bem no padrão internacional com legibilidade brasileira.
  terminology: «Presbíteros» conserva adequadamente o termo histórico sem equipará-lo a um ofício denominacional contemporâneo. «Corpo ... espírito», «Pai», «Jesus Cristo» e «apóstolos» refletem o testemunho. «Porção» é uma opção cautelosa e apropriada para “lot”, e «considerado reprovado» mantém a gravidade de “reprobate” sem impor uma explicação teológica.
