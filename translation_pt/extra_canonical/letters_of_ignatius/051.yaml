base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/051.yaml
  text: 'I greet you from Smyrna, together with the churches of God that are here with me—people who refreshed me in every way, both in body and in spirit.


    My chains, which I carry for Jesus Christ’s sake, urge you, as I plead that I may reach God: remain united in harmony and in prayer with one another. For each of you, and especially the presbyters, ought to encourage the soul of your bishop, to the honor of the Father [and to the honor] of Jesus Christ and of the apostles.


    I pray that you will listen to me in love, so that, by writing this, I may not become a witness against you. And you also must pray for me, for I need your love in the mercy of God, so that I may be granted the destiny I am eager to attain and may not be found rejected.'
translation:
  language: pt
  text: 'Saúdo vocês de Esmirna, juntamente com as igrejas de Deus que estão aqui comigo — pessoas que me reanimaram de todas as maneiras, tanto no corpo como no espírito.


    Minhas correntes, que carrego por causa de Jesus Cristo, exortam vocês, enquanto suplico que eu possa chegar a Deus: permaneçam em concórdia e em oração uns pelos outros. Pois convém que cada um de vocês, e especialmente os presbíteros, anime o coração de seu bispo, para a honra do Pai [e para a honra] de Jesus Cristo e dos apóstolos.[a]


    Peço que me escutem com amor, para que, por lhes ter escrito assim, eu não venha a servir de testemunho contra vocês. Orem também por mim, pois necessito do amor de vocês na misericórdia de Deus, para que me seja concedida a porção que anseio alcançar e eu não seja considerado reprovado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes em “[e para a honra]” reproduzem o sinal de restauração presente no testemunho usado para esta tradução.
    reason: A revisão direta do grego ainda está pendente; é importante não ocultar a incerteza textual assinalada pelo testemunho.
lexical_decisions:
- source_word: flesh
  choice: corpo
  rationale: Em português corrente, “corpo” comunica naturalmente a dimensão física em contraste com “espírito”, sem o sentido moral negativo que “carne” poderia sugerir aqui.
- source_word: bonds
  choice: correntes
  rationale: Mantém a imagem concreta do aprisionamento de Inácio e soa natural no contexto.
- source_word: concord
  choice: concórdia
  rationale: Preserva a ideia de acordo e harmonia comunitária sem reduzir a expressão apenas a unidade institucional.
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva o termo histórico e eclesial, evitando identificar de modo indevido a função antiga com uma estrutura denominacional moderna específica.
- source_word: cheer the soul
  choice: anime o coração
  rationale: Expressão idiomática e compreensível em português, transmitindo fortalecimento interior e encorajamento.
- source_word: lot
  choice: porção
  rationale: Preserva a imagem de algo atribuído ou concedido, sem definir de forma excessiva se se trata de destino, sorte ou herança.
- source_word: reprobate
  choice: considerado reprovado
  rationale: Mantém a força de não passar pela aprovação final sem introduzir uma formulação dogmática mais específica.
theological_decisions:
- issue: “Chegar a Deus” no contexto do martírio esperado
  choice: chegar a Deus
  alternative: alcançar Deus / morrer e estar com Deus
  rationale: A formulação preserva a expressão teologicamente densa do testemunho e não explicita além dele a relação entre martírio, morte e comunhão com Deus.
- issue: A força testemunhal da carta contra os destinatários
  choice: servir de testemunho contra vocês
  alternative: tornar-me testemunha contra vocês
  rationale: Mantém a provável alusão judicial e bíblica, sem afirmar que o próprio Inácio, em vez de sua advertência escrita, seja necessariamente o testemunho.
- issue: O referente da “porção” desejada
  choice: a porção que anseio alcançar
  alternative: o destino que anseio alcançar
  rationale: Evita resolver a imagem como um destino abstrato e conserva sua possível ressonância de quinhão concedido por Deus.
- issue: Honra do Pai, de Jesus Cristo e dos apóstolos
  choice: Preservação dos colchetes em “[e para a honra]”
  alternative: Remover os colchetes e integrar a frase sem indicação
  rationale: O testemunho fornecido sinaliza uma restauração textual; a tradução mantém visível essa incerteza editorial.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega “vocês” para o plural e mantém termos históricos como “presbíteros”. Rascunho provisório baseado no testemunho inglês de domínio público fornecido; requer conferência direta com a tradição manuscrita grega da recensão média.
