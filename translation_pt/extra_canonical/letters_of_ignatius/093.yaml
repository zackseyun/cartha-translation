review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha de perto a testemunha inglesa e preserva corretamente as imagens da bigorna e do atleta, a exortação à perseverança e a sequência paradoxal dos atributos daquele que é aguardado. Contudo, «Intocável» não é o equivalente mais preciso de «Impalpable»: pode sugerir alguém que não deve ser tocado, enquanto o original pretende a qualidade de não poder ser apalpado/tocado. Além disso, «tudo suportou de todas as maneiras» introduz explicitamente «tudo», embora a formulação transmitida diga que ele suportou/permaneceu firme «de todas as maneiras».'
  naturalness: O texto é claro, digno e amplamente legível. «Torne-se ainda mais diligente» torna explícita e natural a comparação intensiva presente na exortação. «Aquele que não se pode tocar» é mais idiomático do que um tecnicismo pouco corrente e conserva a precisão da imagem.
  terminology: «Impassível» é uma boa preservação do termo histórico-teológico e deve permanecer acompanhado de nota, pois o contraste imediato com «que sofreu» é intencional. «Aquele que não se pode tocar» traduz o atributo de impalpabilidade sem criar a nuance normativa de «intocável».
  issues:
  - severity: medium
    issue: «Intocável» para «Impalpable»
    rationale: «Intocável» em português normalmente pode denotar inviolabilidade, posição inalcançável ou proibição de tocar. «Aquele que não se pode tocar» exprime diretamente a impalpabilidade afirmada pela fonte.
  - severity: low
    issue: «tudo suportou de todas as maneiras»
    rationale: 'O acréscimo de «tudo» explicita um objeto que a formulação da fonte não apresenta; é mais fiel conservar a abrangência modal: «suportou de todas as maneiras».'
  - severity: low
    issue: Comparação em «Seja ainda mais diligente»
    rationale: A redação é compreensível, mas «Torne-se ainda mais diligente» comunica com maior nitidez a injunção de progredir e intensificar-se.
  revised_text: 'Não deixe que o perturbem aqueles que parecem convincentes, mas ensinam doutrinas estranhas. Permaneça firme, como a bigorna quando é golpeada. Cabe a um grande atleta receber golpes e sair vitorioso. Acima de tudo, devemos suportar todas as coisas por causa de Deus, para que ele também nos suporte.[a]



    Torne-se ainda mais diligente. Esteja atento aos tempos. Aguarde aquele que está acima de todo tempo: o Eterno, o Invisível, que se tornou visível por nossa causa; aquele que não se pode tocar, o Impassível,[b] que sofreu por nossa causa; aquele que suportou de todas as maneiras por nossa causa.'
  revised_footnotes:
