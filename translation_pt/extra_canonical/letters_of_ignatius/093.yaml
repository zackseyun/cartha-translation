base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/093.yaml
  text: 'Do not let those who seem convincing but teach strange doctrine dismay you. Stand firm, like an anvil when it is struck. It is the part of a great athlete to receive blows and be victorious. Above all, for God’s sake we must endure everything, so that he may also endure us.


    Be more diligent than you are. Pay attention to the seasons. Await the one who is above every season: the Eternal, the Invisible, who became visible for our sake; the Untouchable, the one incapable of suffering, who suffered for our sake; the one who endured in every way for our sake.'
translation:
  language: pt
  text: 'Não deixe que o perturbem aqueles que parecem convincentes, mas ensinam doutrinas estranhas. Permaneça firme, como a bigorna quando é golpeada. Cabe ao grande atleta receber golpes e sair vitorioso. Acima de tudo, devemos suportar todas as coisas por causa de Deus, para que ele também nos suporte.[a]


    Seja ainda mais diligente. Esteja atento aos tempos. Aguarde aquele que está acima de todo tempo: o Eterno, o Invisível, que se tornou visível por nossa causa; o Intocável, o Impassível,[b] que sofreu por nossa causa; aquele que, por nossa causa, tudo suportou de todas as maneiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seja paciente conosco». A expressão mantém a ideia de Deus nos suportar ou tolerar.'
    reason: Registra uma alternativa natural sem apagar a reciprocidade verbal incomum da frase.
  - marker: b
    text: Isto é, não sujeito ao sofrimento; o texto o coloca deliberadamente em contraste com «que sofreu».
    reason: Esclarece o sentido histórico-teológico de «Impassível» e preserva o paradoxo.
lexical_decisions:
- source_word: plausible
  choice: convincentes
  rationale: Expressa a aparência persuasiva dessas pessoas sem afirmar que sejam verdadeiramente confiáveis.
- source_word: strange doctrine
  choice: doutrinas estranhas
  rationale: Mantém o caráter alheio ou desviante do ensino sem acrescentar uma classificação denominacional.
- source_word: anvil
  choice: bigorna
  rationale: Preserva diretamente a imagem concreta de firmeza sob golpes.
- source_word: seasons
  choice: tempos
  rationale: Conserva a amplitude temporal da expressão; «épocas» também seria possível, mas soaria menos natural nesta exortação.
- source_word: Impalpable
  choice: Intocável
  rationale: É linguagem clara e digna, adequada ao contraste deliberado entre a transcendência de Cristo e sua experiência histórica.
- source_word: Impassible
  choice: Impassível
  rationale: Preserva o termo teológico e o paradoxo explícito com «que sofreu», sem dissolver a tensão do texto.
- source_word: endured in all ways
  choice: tudo suportou de todas as maneiras
  rationale: Reproduz a abrangência enfática da testemunha inglesa sem restringir o tipo de sofrimento ou perseverança.
theological_decisions:
- issue: «that He also may endure us»
  choice: «para que ele também nos suporte»
  alternative: «para que ele também seja paciente conosco»
  rationale: A opção escolhida conserva a reciprocidade verbal e a formulação desconcertante do texto, evitando transformar a frase em uma explicação teológica mais suave.
- issue: Paradoxo entre impassibilidade e sofrimento
  choice: «o Impassível, que sofreu por nossa causa»
  alternative: «aquele que não está sujeito ao sofrimento, mas sofreu por nossa causa»
  rationale: Mantém a justaposição forte e antiga, sem tentar resolver como as duas afirmações se relacionam.
- issue: Identidade daquele que é aguardado
  choice: «aquele... o Eterno, o Invisível...»
  alternative: explicitar «Cristo» ou «Deus»
  rationale: O referente permanece implícito como na testemunha fornecida; não se acrescenta uma identificação que o trecho não formula diretamente.
translation_notes:
  register: 'Português contemporâneo, claro e digno, com formas de tratamento na terceira pessoa para ampla legibilidade brasileira e internacional. A tradução é necessariamente provisória: foi elaborada a partir da testemunha inglesa pública fornecida, pois a revisão direta do grego da recensão média ainda está pendente.'
