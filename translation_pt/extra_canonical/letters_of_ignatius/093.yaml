review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha bem a testemunha inglesa e preserva as imagens centrais, a reciprocidade incomum de «para que ele também nos suporte» e o paradoxo entre impassibilidade e sofrimento. Contudo, «Seja ainda mais diligente» não traduz plenamente o comparativo «Be more diligent than you are»; «do que já é» deve ser explicitado. «Impalpável» corresponde mais diretamente a «Impalpable» do que «Intocável». A formulação final também deve conservar «de todas as maneiras», sem introduzir «tudo» como objeto de «suportou».
  naturalness: O registro é claro, digno e natural em português contemporâneo. «Permaneça firme» e «bigorna» funcionam bem. «Observe os tempos» é mais direto para a exortação do que «Esteja atento aos tempos», embora a expressão conserve a amplitude de «tempos».
  terminology: «Impassível» é o termo histórico-teológico apropriado e a nota explica adequadamente seu emprego paradoxal. «Impalpável» é o correspondente lexical mais preciso para o atributo precedente. Mantém-se o referente implícito, sem acrescentar uma identificação confessional.
  issues:
  - severity: medium
    issue: O comparativo em «Be more diligent than you are» foi atenuado.
    rationale: «Seja ainda mais diligente» sugere intensificação, mas não explicita a comparação com a diligência presente. «Seja mais diligente do que já é» preserva a construção da testemunha.
  - severity: medium
    issue: «Intocável» é menos preciso que «Impalpável» para «Impalpable».
    rationale: «Intocável» pode significar inviolável ou inacessível, enquanto «impalpável» preserva especificamente a noção de não poder ser apalpado/tocado, em paralelo com o atributo antigo.
  - severity: low
    issue: «Tudo suportou de todas as maneiras» acrescenta um objeto que não está expresso na cláusula inglesa.
    rationale: «Suportou de todas as maneiras por nossa causa» conserva a abrangência modal de «endured in every way» sem especificar indevidamente o que foi suportado.
  revised_text: 'Não deixe que o perturbem aqueles que parecem convincentes, mas ensinam doutrinas estranhas. Permaneça firme, como a bigorna quando é golpeada. Cabe ao grande atleta receber golpes e sair vitorioso. Acima de tudo, devemos suportar todas as coisas por causa de Deus, para que ele também nos suporte.[a]



    Seja mais diligente do que já é. Observe os tempos. Aguarde aquele que está acima de todo tempo: o Eterno, o Invisível, que se tornou visível por nossa causa; o Impalpável, o Impassível,[b] que sofreu por nossa causa; aquele que suportou de todas as maneiras por nossa causa.'
  revised_footnotes:
  - marker: a
    text: 'Ou: «seja paciente conosco». A expressão mantém a ideia de Deus nos suportar ou tolerar.'
    reason: Registra uma alternativa natural sem apagar a reciprocidade verbal incomum da frase.
  - marker: b
    text: Isto é, não sujeito ao sofrimento; o texto o coloca deliberadamente em contraste com «que sofreu».
    reason: Esclarece o sentido histórico-teológico de «Impassível» e preserva o paradoxo.
  revision_rationale: 'A revisão corrige três pontos seguros de fidelidade à testemunha: explicita o comparativo da diligência, emprega «Impalpável» para o atributo correspondente e mantém o alcance modal, não objetal, da cláusula final. As demais escolhas, inclusive «Impassível» e «nos suporte», são preservadas por refletirem as tensões do texto sem as resolver interpretativamente.'
