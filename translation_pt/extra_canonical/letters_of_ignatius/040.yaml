base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/040.yaml
  text: 'I have learned that you have a blameless mind and are steadfast in patience, not from habit but by nature, just as Polybius your bishop informed me. By the will of God and Jesus Christ, he visited me in Smyrna, and he rejoiced so greatly with me in my chains in Christ Jesus that in him I saw the whole multitude of you.


    Therefore, having received your godly goodwill through him, I gave glory, because I had found you to be imitators of God, just as I had learned.'
translation:
  language: pt
  text: 'Soube que vocês se mantêm irrepreensíveis e inabaláveis na perseverança, não por hábito, mas por natureza, conforme me informou Políbio, bispo de vocês. Pela vontade de Deus e de Jesus Cristo, ele visitou-me em Esmirna e alegrou-se tanto comigo em minhas correntes em Cristo Jesus que, nele, vi toda a comunidade de vocês.


    Assim, tendo recebido por meio dele a benevolência de vocês, digna de Deus, dei glória a Deus, pois encontrei em vocês, exatamente como eu havia sabido, imitadores de Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mind (Greek review pending)
  choice: disposição
  rationale: Expressa a orientação interior e o caráter da comunidade em português natural, sem restringir o sentido apenas ao intelecto.
- source_word: steadfast in patience
  choice: permanecem firmes na perseverança
  rationale: Preserva tanto a constância quanto a resistência paciente sugeridas pelo testemunho.
- source_word: not from habit, but by nature
  choice: não por hábito, mas por natureza
  rationale: Mantém a antítese enfática e sua possível tensão retórica, sem explicá-la.
- source_word: bonds
  choice: correntes
  rationale: Termo concreto e tradicional para a condição de prisioneiro de Inácio.
- source_word: whole multitude
  choice: toda a comunidade
  rationale: Comunica o conjunto da igreja destinatária com naturalidade, evitando a conotação moderna potencialmente negativa de “multidão”.
- source_word: godly benevolence
  choice: benevolência de vocês, digna de Deus
  rationale: Evita o possível sentido vago de “piedosa” e conserva a relação qualificadora com Deus sem afirmar, antes da revisão grega, uma construção mais específica.
- source_word: gave glory
  choice: dei glória a Deus
  rationale: Explicita o objeto naturalmente subentendido na expressão do testemunho e produz português idiomático.
theological_decisions:
- issue: Relação da vontade com Deus e Jesus Cristo
  choice: Pela vontade de Deus e de Jesus Cristo
  alternative: Pela vontade de Deus, em Jesus Cristo
  rationale: Mantém a coordenação presente no testemunho fornecido e não redefine a relação cristológica antes da consulta direta ao grego.
- issue: Imitadores de Deus
  choice: imitadores de Deus
  alternative: pessoas que seguem o exemplo de Deus
  rationale: Preserva a formulação teologicamente forte e sua tensão, sem paráfrase doutrinária.
- issue: Correntes em Cristo Jesus
  choice: minhas correntes em Cristo Jesus
  alternative: minhas correntes por causa de Cristo Jesus
  rationale: Conserva a ambiguidade relacional da expressão; não a reduz somente à causa do aprisionamento.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Trata-se de versão provisória baseada no testemunho inglês público fornecido; a revisão direta da tradição manuscrita grega da recensão média continua pendente.
