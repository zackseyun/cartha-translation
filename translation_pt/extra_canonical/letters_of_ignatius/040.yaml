  to: 'Soube que vocês se mantêm irrepreensíveis e inabaláveis na perseverança, não por hábito, mas por natureza, conforme me informou Políbio, bispo de vocês. Pela vontade de Deus e de Jesus Cristo, ele visitou-me em Esmirna e alegrou-se tanto comigo em minhas correntes em Cristo Jesus que, nele, vi toda a comunidade de vocês.


    Assim, tendo recebido por meio dele a benevolência de vocês, digna de Deus, dei glória a Deus, pois encontrei em vocês, exatamente como eu havia sabido, imitadores de Deus.'
  rationale: A revisão ajusta a primeira frase à sintaxe e à ênfase do grego, preservando a antítese «não por hábito, mas por natureza». Também substitui uma inferência mais conclusiva por «encontrei», mais próxima do texto. Mantêm-se as formulações que conservam ambiguidades relevantes, inclusive «Pela vontade de Deus e de Jesus Cristo» e «em Cristo Jesus».
