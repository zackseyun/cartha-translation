revisions:
- from: 'Soube que vocês têm uma disposição irrepreensível e permanecem firmes na perseverança, não por hábito, mas por natureza, conforme me informou Políbio, bispo de vocês. Pela vontade de Deus e de Jesus Cristo, ele foi visitar-me em Esmirna e alegrou-se tanto comigo em minhas correntes em Cristo Jesus que, nele, vi toda a comunidade de vocês.


