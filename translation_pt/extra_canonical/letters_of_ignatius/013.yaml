base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/013.yaml
  text: 'I know who I am and to whom I am writing. I am a condemned prisoner; you have received mercy. I am in danger; you are firmly established.


    You are the highway of those who are on their way to die unto God. You share in the mysteries with Paul, who was sanctified, who received a good testimony, and who is worthy of every congratulation. I would gladly be found following in his footsteps when I shall attain to God. In every letter, he makes mention of you in Christ Jesus.'
translation:
  language: pt
  text: 'Sei quem sou e a quem escrevo. Eu sou um prisioneiro condenado; vocês receberam misericórdia. Eu estou em perigo; vocês estão firmemente estabelecidos.


    Vocês são a estrada principal daqueles que estão a caminho de morrer para Deus.[a] Vocês compartilham dos mistérios com Paulo, que foi santificado, recebeu bom testemunho e é digno de toda felicitação. Eu gostaria de ser encontrado seguindo os passos dele quando alcançar a Deus. Em cada carta, ele faz menção de vocês em Cristo Jesus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “morrer por Deus”. A expressão também pode indicar caminhar rumo à morte tendo Deus como destino ou finalidade.'
    reason: Preservar a amplitude da preposição refletida no testemunho inglês enquanto se aguarda revisão direta do grego.
  - marker: b
    text: A afirmação “em cada carta” é mantida conforme o testemunho antigo; não fica claro se ela pretende designar literalmente todas as cartas de Paulo conhecidas pelo autor.
    reason: Sinalizar uma dificuldade histórica e referencial sem corrigir ou restringir silenciosamente o texto.
lexical_decisions:
- source_word: convict
  choice: prisioneiro condenado
  rationale: Preserva tanto a condição de preso quanto a ideia de sentença, evitando o sentido moderno restrito de alguém apenas declarado culpado.
- source_word: high-road
  choice: estrada principal
  rationale: Mantém a metáfora viária concreta do testemunho, em português natural.
- source_word: associates in the mysteries
  choice: compartilham dos mistérios
  rationale: Conserva a linguagem religiosa deliberadamente ampla, sem especificar sacramentos ou ritos que o testemunho não explicita.
- source_word: attain unto God
  choice: alcançar a Deus
  rationale: Reproduz a fórmula característica de Inácio, ligada à sua morte esperada, sem substituir a imagem por uma interpretação explicativa.
- source_word: worthy of all felicitation
  choice: digno de toda felicitação
  rationale: Mantém o tom elevado de louvor; 'felicitação' comunica honra e congratulação sem atribuir ao texto uma bem-aventurança técnica.
theological_decisions:
- issue: Sentido de “morrer para Deus”
  choice: morrer para Deus
  alternative: morrer por Deus
  rationale: A formulação preserva a direção ou finalidade expressa pelo testemunho e não reduz a frase apenas à ideia de martírio em favor de Deus.
- issue: Natureza dos “mistérios” compartilhados com Paulo
  choice: não especificada no corpo do texto
  alternative: explicá-los como sacramentos, fé cristã ou experiências de sofrimento
  rationale: O testemunho fornecido não resolve a referência; a tradução conserva a ambiguidade teológica e histórica.
- issue: Alcance de “em cada carta”
  choice: Em cada carta
  alternative: em todas as cartas dele
  rationale: Mantém a afirmação abrangente do testemunho, embora sua relação exata com o corpus paulino conhecido seja historicamente difícil.
translation_notes:
  register: Português moderno, corrente e digno, com formas de tratamento brasileiras amplamente compreensíveis. A redação é provisória porque o material fornecido é um testemunho inglês de domínio público e a revisão direta da tradição grega da recensão média ainda está pendente.
