review_pass:
  verdict: revise
  source_fidelity: A redação acompanha em grande parte o testemunho inglês e o grego da recensão média. Contudo, “estrada principal” intensifica indevidamente πάροδος, e “os que estão a caminho de morrer” enfraquece o particípio passivo ἀναιρουμένων (“os que estão sendo levados à morte” / “mortos”). “Compartilham dos mistérios” também não exprime com precisão μύσται, termo que designa participantes/iniciados nos mistérios.
  naturalness: O texto é geralmente claro em português moderno. “Via” é mais natural e menos interpretativo do que “estrada principal” nesta metáfora; “companheiros nos mistérios” comunica a relação com Paulo sem introduzir uma explicação sacramental. “Chegar a Deus” é mais idiomático que “alcançar a Deus”.
  terminology: 'Foram preservados “misericórdia”, “mistérios”, “santificado” e “Cristo Jesus”. “Toda congratulação” reproduz o louvor enfático de παντὸς μακαρισμοῦ com uso mais corrente do que “toda felicitação”. A nota sobre “em cada carta” não é necessária: o enunciado é direto no texto e a ressalva histórica não resolve uma ambiguidade tradutória.'
  issues:
  - severity: medium
    issue: “estrada principal daqueles que estão a caminho de morrer para Deus”
    rationale: πάροδος significa via, passagem ou caminho, não exige “principal”; ἀναιρουμένων é passivo e se refere aos que são levados à morte ou mortos. A revisão conserva a metáfora e a voz do original.
  - severity: medium
    issue: “compartilham dos mistérios com Paulo”
    rationale: μύσται aponta mais especificamente para pessoas iniciadas ou participantes dos mistérios. “Companheiros nos mistérios com Paulo” preserva o campo semântico sem definir quais seriam esses mistérios.
  - severity: low
    issue: Nota b de caráter histórico
    rationale: A observação limita-se a levantar uma dificuldade externa, mas não assinala variante nem ambiguidade presente na tradução. Sua retirada torna o aparato mais proporcional ao texto.
  revised_text: 'Sei quem sou e a quem escrevo. Eu sou um prisioneiro condenado; vocês receberam misericórdia. Eu estou em perigo; vocês estão firmemente estabelecidos.


    Vocês são a via dos que estão sendo levados à morte para Deus.[a] Vocês são companheiros nos mistérios com Paulo, que foi santificado, recebeu bom testemunho e é digno de toda congratulação. Eu gostaria de ser encontrado seguindo os passos dele quando chegar a Deus. Em cada carta, ele faz menção de vocês em Cristo Jesus.'
  revised_footnotes:
  - marker: a
    text: 'Ou: “à morte por Deus”. A expressão pode também indicar que Deus é o destino ou a finalidade dessa morte.'
    reason: A construção grega permite mais de uma nuance para a relação da morte com Deus; a nota preserva essa abertura sem tornar o texto principal excessivamente explicativo.
  revision_rationale: 'A revisão corrige dois pontos em que o rascunho introduzia ou perdia matizes relevantes do grego: a imagem de πάροδος e a voz passiva de ἀναιρουμένων, bem como o sentido iniciático-participativo de μύσται. Mantém-se a linguagem elevada, mas inteligível, e não se especifica doutrinariamente a natureza dos “mistérios”.'
