base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/069.yaml
  text: 'My brethren, my heart completely overflows with love for you; and rejoicing beyond measure, I watch over your safety—yet not I, but Jesus Christ. Wearing his bonds, I am all the more afraid because I have not yet been perfected. But your prayer will perfect me [unto God], so that I may attain the inheritance wherein I have found mercy, taking refuge in the Gospel as the flesh of Jesus and in the apostles as the council of elders of the church.


    Yes, and we also love the prophets, because they too pointed to the Gospel in their preaching, set their hope on him, and awaited him. Having faith in him, they too were saved in the unity of Jesus Christ, as holy men worthy of all love and admiration, approved by Jesus Christ and numbered together in the Gospel of our common hope.'
translation:
  language: pt
  text: 'Meus irmãos, meu coração transborda por completo de amor por vocês e, cheio de uma alegria imensa, zelo pela segurança de vocês — não eu, porém, mas Jesus Cristo. Carregando as correntes dele, sinto ainda mais temor, porque ainda não fui aperfeiçoado. Mas a oração de vocês me aperfeiçoará [para Deus][a], para que eu alcance a herança na qual encontrei misericórdia, refugiando-me no evangelho como na carne de Jesus e nos apóstolos como no conselho de presbíteros da igreja.[b]


    Sim, também amamos os profetas, porque eles igualmente apontaram para o evangelho em sua pregação, puseram nele a esperança e o aguardaram. Tendo fé nele, também foram salvos na unidade de Jesus Cristo. Como homens santos, dignos de todo amor e admiração, foram aprovados por Jesus Cristo e incluídos no evangelho da nossa esperança comum.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras «para Deus» são apresentadas entre colchetes porque o testemunho de tradução fornecido as assinala como restauração textual; a revisão direta do grego ainda está pendente.
    reason: Preservar com transparência o sinal de incerteza textual presente na base documental.
  - marker: b
    text: «Conselho de presbíteros» traduz o termo tradicionalmente vertido como «presbitério», aqui entendido como o corpo colegiado de presbíteros da igreja.
    reason: Esclarecer um termo eclesial que, em português moderno, poderia ser confundido com um local ou com uma estrutura denominacional posterior.
lexical_decisions:
- source_word: brethren
  choice: irmãos
  rationale: Forma coletiva natural e tradicional no contexto comunitário, sem acrescentar uma explicitação de gênero ausente no testemunho fornecido.
- source_word: safety
  choice: segurança
  rationale: Preserva o sentido amplo do testemunho, que pode envolver bem-estar ou preservação, sem restringi-lo explicitamente a 'salvação'.
- source_word: bonds
  choice: correntes
  rationale: Expressa de modo concreto e corrente a condição de prisioneiro de Inácio e mantém a associação das correntes com Cristo.
- source_word: Gospel
  choice: evangelho
  rationale: Mantém o termo cristão estabelecido e sua possível amplitude entre mensagem proclamada e tradição evangélica.
- source_word: presbytery
  choice: conselho de presbíteros
  rationale: Comunica a ideia de um corpo colegiado de anciãos/presbíteros, evitando reduzir o termo a um edifício ou importar uma estrutura denominacional posterior.
- source_word: numbered together
  choice: incluídos
  rationale: Português natural que conserva a ideia de serem contados ou integrados no âmbito do evangelho, sem especificar além do testemunho.
theological_decisions:
- issue: Agência na vigilância ou proteção da comunidade
  choice: «não eu, porém, mas Jesus Cristo»
  alternative: Reformular como mera assistência de Jesus a Inácio
  rationale: Preserva a correção enfática do autor e a tensão entre sua ação pastoral e a agência de Cristo.
- issue: Aperfeiçoamento por meio da oração da comunidade
  choice: «a oração de vocês me aperfeiçoará»
  alternative: Atenuar para «ajudará a aperfeiçoar-me»
  rationale: Mantém a afirmação forte do testemunho, sem explicar o mecanismo nem eliminar sua tensão teológica.
- issue: Profetas salvos pela fé em Cristo
  choice: «Tendo fé nele, também foram salvos na unidade de Jesus Cristo»
  alternative: Explicitar uma teoria sobre fé prospectiva ou conhecimento messiânico
  rationale: Conserva a formulação cristológica sem importar uma construção doutrinária não expressa no texto.
- issue: Evangelho como carne de Jesus
  choice: Manter a metáfora literalmente
  alternative: Interpretar como os relatos escritos da vida corporal de Jesus
  rationale: A imagem é teologicamente densa e potencialmente ambígua; não deve ser resolvida silenciosamente.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com preferência por construções naturais ao leitor brasileiro. O rascunho é necessariamente provisório: foi preparado a partir do testemunho inglês público e da camada inglesa auditada, pois a revisão direta da tradição manuscrita grega da recensão média ainda está pendente. As metáforas e tensões teológicas do testemunho foram preservadas, sem harmonização denominacional.'
