    reason: Evitar resolver silenciosamente uma concepção característica e teologicamente carregada do discipulado.
  - marker: c
    text: A redação deste capítulo é provisória, baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego da recensão média ainda está pendente. Os trechos entre colchetes reproduzem sinais de restauração ou incerteza presentes nesse testemunho.
