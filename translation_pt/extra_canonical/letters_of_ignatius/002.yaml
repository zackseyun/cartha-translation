translation:
  language: pt
  text: 'Acolhi em Deus o nome muito amado de vocês, que lhes pertence por natureza, [com mente reta e virtuosa], mediante a fé e o amor em Cristo Jesus, nosso Salvador. Como imitadores de Deus, tendo o coração inflamado no sangue de Deus[a], vocês cumpriram perfeitamente a obra que lhes é própria.


    Pois, quando souberam que eu vinha da Síria, acorrentado por causa do Nome e da esperança que compartilhamos, e que esperava, mediante as orações de vocês, conseguir enfrentar as feras em Roma, para que, conseguindo isso, eu pudesse ser discípulo[b], vocês se apressaram em vir me ver.


    Assim, em nome de Deus, recebi toda a comunidade de vocês na pessoa de Onésimo, homem de amor indescritível e, além disso, bispo de vocês [na carne]. Oro para que vocês o amem de acordo com Jesus Cristo e para que todos sejam semelhantes a ele. Pois bendito é aquele que lhes concedeu, como vocês merecem, ter um bispo assim.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sangue de Deus” é a expressão preservada pelo testemunho; não foi substituída por “sangue de Cristo”.
    reason: Preservar a formulação cristológica incomum e sua tensão teológica.
  - marker: b
    text: Isto é, Inácio espera alcançar plenamente a condição de discípulo ao enfrentar o martírio; a frase, porém, foi mantida sem essa explicação no texto.
    reason: Evitar resolver silenciosamente uma concepção característica e teologicamente carregada do discipulado.
  - marker: c
    text: A redação deste capítulo é provisória, baseada no testemunho inglês de domínio público fornecido; a revisão direta do grego da recensão média ainda está pendente. Os trechos entre colchetes reproduzem sinais de restauração ou incerteza presentes nesse testemunho.
    reason: Declarar com transparência os limites da base textual disponível e explicar os colchetes.
lexical_decisions:
- source_word: well beloved name
  choice: nome muito amado
  rationale: Mantém a formulação pessoal e honorífica do testemunho sem reduzir “nome” à mera reputação.
- source_word: common Name and hope
  choice: Nome e esperança que compartilhamos
  rationale: Conserva “Nome” com inicial maiúscula como possível referência cristológica e torna explícito apenas o caráter comum indicado pelo testemunho.
- source_word: congenial work
  choice: obra que lhes é própria
  rationale: Expressa a ideia de uma ação correspondente à natureza ou disposição dos destinatários sem recorrer a uma formulação artificial.
- source_word: in bonds
  choice: acorrentado
  rationale: Transmite de modo concreto e corrente a condição de prisioneiro de Inácio.
- source_word: whole multitude
  choice: toda a comunidade
  rationale: No contexto epistolar, refere-se ao conjunto da igreja, não a uma multidão indistinta.
- source_word: bishop
  choice: bispo
  rationale: É o equivalente histórico e corrente do título eclesial, sem acrescentar uma concepção denominacional posterior.
theological_decisions:
- issue: A expressão “sangue de Deus”
  choice: sangue de Deus
  alternative: sangue de Cristo
  rationale: Preserva a formulação teologicamente marcante e cristológica do testemunho, sem harmonizá-la ou explicá-la no corpo do texto.
- issue: O sentido de tornar-se discípulo por meio do martírio
  choice: para que... eu pudesse ser discípulo
  alternative: para que eu me mostrasse um verdadeiro discípulo
  rationale: Mantém a tensão da formulação de Inácio e evita acrescentar “verdadeiro”, que resolveria interpretativamente o sentido.
- issue: “Nome” como possível referência a Cristo
  choice: Nome
  alternative: nome comum
  rationale: A inicial maiúscula conserva a provável força titular, enquanto a nota reconhece a concisão e a ambiguidade da expressão.
- issue: Agente de “bendito é aquele”
  choice: aquele
  alternative: Deus
  rationale: O testemunho traz um pronome e não identifica expressamente o referente; a tradução evita explicitar o que permanece implícito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês” para boa legibilidade brasileira e internacional. A sintaxe longa do testemunho foi dividida em períodos menores sem eliminar suas conexões argumentativas. Evitaram-se arcaísmos e expansões confessionais. A tradução é necessariamente provisória, pois os dados fornecidos incluem apenas um testemunho inglês e informam que a revisão direta da fonte grega está pendente.
