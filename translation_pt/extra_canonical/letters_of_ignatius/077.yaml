id: IGN.077
reference: Letters of Ignatius — IgnSmyrn. 1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'I give glory to Jesus Christ the God who bestowed such wisdom upon you; for I have perceived that ye are established in faith immovable, being as it were nailed on the cross of the Lord Jesus Christ, in flesh and in spirit, and firmly grounded in love in the blood of Christ, fully persuaded as touching our Lord that He is truly of the race of David according to the flesh, but Son of God by the Divine will and power, truly born of a virgin and baptized by John that all righteousness might be fulfilled by Him,


    truly nailed up in the flesh for our sakes under Pontius Pilate and Herod the tetrarch (of which fruit are we--that is, of His most blessed passion); that He might set up an ensign unto all the ages through His resurrection, for His saints and faithful people, whether among Jews or among Gentiles, in one body of His Church.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/077.yaml
  text: 'I glorify Jesus Christ, the God who gave you such wisdom, because I have seen that you are established in unshakable faith, as though nailed to the cross of the Lord Jesus Christ in flesh and spirit, and firmly rooted in love in the blood of Christ. You are fully convinced concerning our Lord that he is truly descended from David according to the flesh, yet is the Son of God by divine will and power; that he was truly born of a virgin and baptized by John so that all righteousness might be fulfilled by him;


    that he was truly nailed up in the flesh for our sake under Pontius Pilate and Herod the tetrarch (of which we are the fruit—that is, of his most blessed suffering); and that through his resurrection he might raise a banner for all ages, for his saints and faithful people, whether among Jews or Gentiles, in the one body of his Church.'
translation:
  language: pt
  text: 'Dou glória a Jesus Cristo, o Deus que lhes concedeu tamanha sabedoria, pois percebi que vocês estão firmados numa fé inabalável, como que pregados à cruz do Senhor Jesus Cristo, na carne e no espírito, e solidamente arraigados no amor, no sangue de Cristo. Vocês estão plenamente convencidos a respeito de nosso Senhor: ele é verdadeiramente da linhagem de Davi segundo a carne, mas é Filho de Deus pela vontade e pelo poder divinos; nasceu verdadeiramente de uma virgem e foi batizado por João, para que por ele se cumprisse toda a justiça;


    foi verdadeiramente pregado na carne por nossa causa, sob Pôncio Pilatos e Herodes, o tetrarca — e nós somos o fruto disso, isto é, de seu sofrimento benditíssimo —, a fim de que, por meio de sua ressurreição, ele levantasse um estandarte para todas as eras, para os seus santos e fiéis, quer entre os judeus, quer entre os gentios, no único corpo de sua Igreja.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; a revisão direta da tradição manuscrita grega da recensão média ainda está pendente.
    reason: A fonte fornecida declara que a análise direta do grego ainda não foi realizada; a nota torna transparente a base documental e o grau de segurança do rascunho.
lexical_decisions:
- source_word: give glory
  choice: Dou glória
  rationale: Mantém a formulação do testemunho e um registro devocional digno, sem a tornar artificial em português.
- source_word: established in faith immovable
  choice: firmados numa fé inabalável
  rationale: Expressa estabilidade e imobilidade de modo natural e vigoroso.
- source_word: in flesh and in spirit
  choice: na carne e no espírito
  rationale: Preserva o paralelismo e a abrangência antropológica sem explicar além do texto.
- source_word: of the race of David according to the flesh
  choice: da linhagem de Davi segundo a carne
  rationale: Conserva a linguagem tradicional e teologicamente carregada de descendência histórica.
- source_word: ensign
  choice: estandarte
  rationale: Preserva a imagem pública e congregadora do sinal erguido, em vez de reduzi-la a uma abstração.
- source_word: Gentiles
  choice: gentios
  rationale: Termo bíblico corrente e amplamente compreensível para os povos não judeus.
theological_decisions:
- issue: Designação de Jesus Cristo como Deus
  choice: Jesus Cristo, o Deus
  alternative: Jesus Cristo, Deus
  rationale: Mantém de forma explícita a aposição presente no testemunho, sem enfraquecer sua afirmação cristológica.
- issue: Filiação divina e vontade/poder divinos
  choice: mas é Filho de Deus pela vontade e pelo poder divinos
  alternative: e Filho de Deus por vontade e poder de Deus
  rationale: Preserva a tensão entre descendência davídica e filiação divina, bem como a formulação instrumental, sem impor uma explicação posterior.
- issue: Agente do cumprimento de toda a justiça
  choice: para que por ele se cumprisse toda a justiça
  alternative: para que ele cumprisse toda a justiça
  rationale: Conserva a forma passiva e a possível ambiguidade do testemunho inglês quanto à agência.
- issue: Relação entre os crentes e a paixão de Cristo
  choice: nós somos o fruto disso, isto é, de seu sofrimento benditíssimo
  alternative: somos fruto de sua benditíssima paixão
  rationale: Mantém a metáfora causal e a glosa explicativa do texto, usando linguagem atual.
- issue: Unidade eclesial
  choice: no único corpo de sua Igreja
  alternative: em um só corpo, o de sua Igreja
  rationale: Preserva a unidade corporal da Igreja sem desenvolver uma doutrina denominacional.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira, com vocabulário bíblico reconhecível. Mantiveram-se as imagens concretas de ser pregado à cruz, estar arraigado no amor e levantar um estandarte. A pontuação divide o longo período sem desfazer sua progressão retórica. Por depender provisoriamente de um testemunho inglês, escolhas sensíveis deverão ser verificadas contra o grego antes da publicação definitiva.
