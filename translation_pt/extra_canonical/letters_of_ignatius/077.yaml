review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a sequência argumentativa e as afirmações centrais do testemunho inglês, em geral confirmáveis pela formulação grega da recensão média: Cristo é Deus, descendente de Davi segundo a carne, Filho de Deus, nascido de virgem, batizado por João e realmente pregado/crucificado sob Pilatos e Herodes. A expressão sobre os destinatários como fruto da paixão precisa ser ajustada: o texto diz que eles são fruto da paixão, não simplesmente «fruto disso», cujo antecedente português fica impreciso.'
  naturalness: O registro é moderno, digno e legível. A longa frase permanece manejável. «Do qual somos fruto» é mais claro e idiomático que «e nós somos o fruto disso», além de reproduzir melhor a relação sintática do original.
  terminology: «Jesus Cristo, o Deus», «linhagem de Davi», «segundo a carne», «Filho de Deus», «gentios», «estandarte» e «Igreja» são escolhas adequadas. «Um só corpo de sua Igreja» reproduz com maior precisão a ideia de unidade do que «o único corpo».
  issues:
  - severity: medium
    issue: Antecedente impreciso em «e nós somos o fruto disso».
    rationale: A construção inglesa «of which fruit are we—that is, of His ... passion» e o grego vinculam diretamente os fiéis ao fruto da paixão de Cristo. «Disso» pode remeter indevidamente à crucificação sob Pilatos e Herodes, e não à paixão explicitamente glosada.
  - severity: low
    issue: «No único corpo de sua Igreja» pode sugerir exclusividade em vez de unidade.
    rationale: A formulação grega é «em um só corpo da sua Igreja». A revisão conserva a imagem paulina/eclesial sem acrescentar uma nuance desnecessária.
  revised_text: 'Dou glória a Jesus Cristo, o Deus que lhes concedeu tamanha sabedoria, pois percebi que vocês estão firmados numa fé inabalável, como que pregados à cruz do Senhor Jesus Cristo, na carne e no espírito, e solidamente arraigados no amor, no sangue de Cristo. Vocês estão plenamente convencidos a respeito de nosso Senhor: ele é verdadeiramente da linhagem de Davi segundo a carne, mas é Filho de Deus pela vontade e pelo poder divinos; nasceu verdadeiramente de uma virgem e foi batizado por João, para que por ele se cumprisse toda a justiça;


    foi verdadeiramente pregado na carne por nossa causa, sob Pôncio Pilatos e Herodes, o tetrarca — do qual somos fruto, isto é, de seu sofrimento benditíssimo —, a fim de que, por meio de sua ressurreição, ele levantasse um estandarte para todas as eras, para os seus santos e fiéis, quer entre os judeus, quer entre os gentios, em um só corpo de sua Igreja.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; a revisão direta da tradição manuscrita grega da recensão média ainda está pendente.
    reason: A fonte fornecida declara que a análise direta do grego ainda não foi realizada; a nota torna transparente a base documental e o grau de segurança do rascunho.
  revision_rationale: A revisão elimina a ambiguidade referencial em torno de «fruto» e ajusta «um só corpo» à formulação de unidade presente no texto. Não altera as afirmações cristológicas, a ambiguidade passiva de «para que por ele se cumprisse toda a justiça», nem a imagem do estandarte erguido por meio da ressurreição.
