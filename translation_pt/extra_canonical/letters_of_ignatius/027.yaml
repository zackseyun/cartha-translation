base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/027.yaml
  text: Therefore, it is right that we should not only be called Christians but also be Christians. In the same way, some people have the bishop’s name on their lips but act apart from him in everything. Such people do not seem to me to maintain a good conscience, because they do not assemble together lawfully according to the commandment.
translation:
  language: pt
  text: Portanto, é justo que não apenas sejamos chamados cristãos, mas que também o sejamos. Do mesmo modo, alguns têm o nome do bispo nos lábios, mas em tudo agem à parte dele. Essas pessoas não me parecem manter boa consciência, pois não se reúnem devidamente, segundo o mandamento.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego da recensão média ainda está pendente.
    reason: A fonte apresentada declara que a análise direta do original grego ainda não foi realizada; a nota torna transparente essa limitação textual.
lexical_decisions:
- source_word: be called Christians, but also be such
  choice: sejamos chamados cristãos, mas que também o sejamos
  rationale: Mantém o contraste enfático entre possuir o nome cristão e viver de modo coerente com ele, sem acrescentar uma explicação interpretativa.
- source_word: have the bishop's name on their lips
  choice: têm o nome do bispo nos lábios
  rationale: Preserva a imagem concreta do testemunho inglês e seu sentido de reconhecimento apenas verbal.
- source_word: act apart from him
  choice: agem à parte dele
  rationale: Conserva a amplitude da expressão, que pode envolver agir sem comunhão, concordância ou submissão ao bispo, sem escolher apenas uma dessas nuances.
- source_word: keep a good conscience
  choice: conservar uma boa consciência
  rationale: Reproduz de forma natural e digna a ideia ética de manter uma consciência íntegra.
- source_word: assemble themselves together lawfully
  choice: se reúnem legitimamente
  rationale: Expressa a noção de uma reunião realizada de maneira reconhecida ou ordenada, evitando especificar uma estrutura eclesiástica além da evidência disponível.
- source_word: according to commandment
  choice: segundo o mandamento
  rationale: Mantém o singular e não identifica indevidamente qual mandamento está em vista.
theological_decisions:
- issue: Natureza da relação com o bispo
  choice: à parte dele
  alternative: sem a sua autoridade / em desacordo com ele
  rationale: A formulação escolhida preserva a tensão e a abrangência do testemunho, sem importar uma teoria denominacional específica de autoridade episcopal.
- issue: Identidade do mandamento
  choice: o mandamento
  alternative: o mandamento de Deus / a ordem do bispo
  rationale: O referente não é explicitado no testemunho fornecido; por isso, a tradução não o determina.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe conserva o paralelismo e a admoestação moral do trecho. Evitaram-se termos confessionais mais específicos que poderiam resolver indevidamente a relação entre comunidade, bispo e mandamento.
