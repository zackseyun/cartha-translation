revisions:
- from: 'Nada disso está oculto de vocês, se forem completos na fé e no amor para com Jesus Cristo, pois estes são o princípio e o fim da vida: a fé é o princípio, e o amor, o fim. Os dois, quando se encontram em unidade, são Deus,[a] enquanto todas as demais coisas os acompanham rumo à verdadeira nobreza.


    Ninguém que professa a fé vive pecando, e ninguém que possui o amor odeia.[b] A árvore se revela pelo seu fruto; do mesmo modo, os que professam pertencer a Cristo serão reconhecidos por suas ações. Pois a Obra[c] não é agora uma questão de profissão verbal, mas se torna visível quando alguém permanece no poder da fé até o fim.'
  to: 'Nada disso lhes está oculto, se tiverem fé e amor perfeitos em Jesus Cristo; pois estes são o princípio e o fim da vida: a fé é o princípio, e o amor, o fim. Os dois, tendo chegado à unidade, são Deus,[a] e todas as outras coisas os seguem para o bem.


    Ninguém que professa fé peca, e ninguém que tem amor odeia. A árvore se torna manifesta por seu fruto; assim, os que dizem pertencer a Cristo se revelam por aquilo que fazem. Pois a obra não é agora uma questão de profissão, mas de ser encontrado no poder da fé até o fim.'
  rationale: 'A revisão segue o grego disponível: remove a suavização aspectual de «peca», substitui a interpretação «verdadeira nobreza» por «para o bem», elimina a capitalização editorial de «obra» e ajusta a relação de fé e amor «em Jesus Cristo». A nota retém a formulação disputadamente estranha sobre a unidade de fé e amor, sem lhe impor explicação doutrinária.'
