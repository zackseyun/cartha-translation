base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/015.yaml
  text: 'None of these things is hidden from you, if you are complete in your faith and love toward Jesus Christ, for these are the beginning and end of life—faith is the beginning and love is the end. The two, found in unity, are God, while everything else follows in their train toward true nobility.


    No one who professes faith sins, and no one who possesses love hates. The tree is revealed by its fruit; likewise, those who profess to belong to Christ will be recognized by their actions. For the Work is not now a matter of profession, but is seen when someone is found in the power of faith to the end.'
translation:
  language: pt
  text: 'Nada disso lhes está oculto, se tiverem fé e amor perfeitos em Jesus Cristo; pois estes são o princípio e o fim da vida: a fé é o princípio, e o amor, o fim. Os dois, tendo chegado à unidade, são Deus,[a] e todas as outras coisas os seguem para o bem.


    Ninguém que professa fé peca, e ninguém que tem amor odeia. A árvore se torna manifesta por seu fruto; assim, os que dizem pertencer a Cristo se revelam por aquilo que fazem. Pois a obra não é agora uma questão de profissão, mas de ser encontrado no poder da fé até o fim.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação preserva a construção incomum do grego: literalmente, «os dois, tendo chegado à unidade, são Deus».'
    reason: Manter a tensão sintática e teológica do texto sem harmonização interpretativa.
lexical_decisions:
- source_word: perfect
  choice: completos
  rationale: Preserva a ideia de inteireza ou maturidade sem sugerir necessariamente impecabilidade absoluta.
- source_word: toward Jesus Christ
  choice: para com Jesus Cristo
  rationale: Expressa de modo natural a orientação relacional tanto da fé quanto do amor.
- source_word: true nobility
  choice: verdadeira nobreza
  rationale: Mantém a imagem ética elevada do testemunho, sem reduzi-la a mera respeitabilidade social.
- source_word: professing
  choice: professa / professam
  rationale: Conserva o contraste entre declaração verbal e conduta efetiva.
- source_word: shall be seen through their actions
  choice: serão reconhecidos por suas ações
  rationale: Formulação corrente que preserva a ideia de identificação mediante a conduta.
- source_word: unto the end
  choice: até o fim
  rationale: Mantém a dimensão de perseverança presente no testemunho.
theological_decisions:
- issue: A afirmação de que fé e amor, unidos, “são Deus”
  choice: Os dois, quando se encontram em unidade, são Deus
  alternative: Os dois, unidos, conduzem a Deus
  rationale: Preserva a formulação teologicamente tensa do testemunho fornecido, sem harmonização ou explicação introduzida no corpo do texto.
- issue: O caráter absoluto de “quem professa a fé não peca”
  choice: Ninguém que professa a fé vive pecando
  alternative: Ninguém que professa a fé peca
  rationale: A expressão portuguesa evita apresentar uma declaração casualmente contraditória sobre qualquer ato isolado, mas a revisão direta do grego ainda é necessária; por isso, a questão é assinalada em nota.
- issue: “the Work” com inicial maiúscula
  choice: a Obra
  alternative: a obra
  rationale: A capitalização foi preservada por fidelidade ao testemunho inglês fornecido, sem identificar a expressão com uma doutrina específica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Como a revisão direta da tradição grega da recensão média está pendente, a tradução permanece provisória e se baseia no testemunho inglês público auditado. Mantiveram-se as repetições de “fé”, “amor” e “professar”, bem como a tensão entre profissão e prática.
