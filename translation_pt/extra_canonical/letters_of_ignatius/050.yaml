review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente as imagens centrais do testemunho inglês (rebentos, fruto, plantação, ramos, cruz, cabeça e membros) e não resolve de maneira doutrinária a afirmação final sobre a união. Contudo, “fruto mortal” pode significar fruto sujeito à morte, em vez de fruto que causa morte; e o futuro “morrerá” enfraquece levemente a imediatidade assertiva de “forthwith he dieth”. A formulação referente à cruz pode também tornar mais explícito, sem acrescentar interpretação, que “seus membros” se refere àquele que chama.
  naturalness: O registro é claro, atual e apropriado. “Rebentos” é compreensível internacionalmente, embora “brotos” seja mais imediato para muitos leitores brasileiros; mantém-se “rebentos” por sua adequada correspondência à metáfora vegetal. A pequena reordenação na oração sobre a cruz melhora a leitura e reduz a ambiguidade pronominal.
  terminology: “Plantação do Pai”, “ramos da Cruz”, “paixão”, “cabeça”, “membros” e “união” preservam com sobriedade o vocabulário metafórico e teológico do texto. “Fruto mortífero” comunica com maior precisão o efeito letal expresso no testemunho, sem alterar a imagem.
  issues:
  - severity: medium
    issue: “Fruto mortal” é semanticamente ambíguo em português.
    rationale: Pode descrever um fruto que é mortal/perecível, não necessariamente um fruto que causa a morte de quem o prova. “Fruto mortífero” preserva melhor “deadly fruit”.
  - severity: low
    issue: “Morrerá imediatamente” desloca para o futuro a formulação gnômica e imediata do testemunho.
    rationale: “Morre imediatamente” reproduz mais de perto “forthwith he dieth” no período condicional geral.
  - severity: low
    issue: A referência de “seus membros” pode ficar momentaneamente opaca após “a cruz”.
    rationale: “A nós, que somos seus membros” mantém a estrutura do testemunho e deixa claro que os membros são daquele que chama, sem explicar teologicamente a metáfora.
  revised_text: 'Portanto, evitem esses rebentos desprezíveis, que produzem fruto mortífero. Se alguém provar dele, morre imediatamente. Pois essas pessoas não são plantação do Pai.


    Se o fossem, teriam sido vistas como ramos da Cruz, e seu fruto seria imperecível — a Cruz pela qual ele, em sua paixão, nos chama, a nós que somos seus membros. Ora, não pode haver cabeça sem membros, visto que Deus promete a união, e essa união é ele mesmo.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de J. B. Lightfoot. A redação deverá ser conferida diretamente com a tradição manuscrita grega da recensão média.
    reason: O material fornecido informa que a revisão direta do grego ainda está pendente; a nota torna transparente a base documental limitada desta versão.
  revision_rationale: 'Foram feitos apenas ajustes seguros de precisão semântica e fluência: “mortífero” esclarece que o fruto causa morte; “morre imediatamente” retém o enunciado imediato do testemunho; e a reordenação final da frase sobre a Cruz torna inequívoca a ligação de “membros” com aquele que chama. A nota de transparência documental foi preservada, pois a conferência direta com o grego continua pendente.'
