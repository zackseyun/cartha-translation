base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/050.yaml
  text: 'Therefore shun those vile offshoots that produce deadly fruit. If anyone tastes it, that person dies at once. For these people are not the Father’s planting:


    for if they had been, they would have been seen to be branches of the Cross, and their fruit imperishable—the Cross by which He, through His passion, invites us, being His members. Now a head cannot be found without members, since God promises union, and this union is Himself.'
translation:
  language: pt
  text: 'Portanto, evitem esses rebentos desprezíveis, que produzem fruto mortal. Se alguém provar desse fruto, morrerá imediatamente. Pois essas pessoas não são plantação do Pai.


    Se fossem, seriam reconhecidas como ramos da cruz, e seu fruto seria imperecível — a cruz pela qual ele, por meio de sua paixão, nos chama, pois somos seus membros. Ora, não pode haver cabeça sem membros, visto que Deus promete a união, e essa união é ele mesmo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de J. B. Lightfoot. A redação deverá ser conferida diretamente com a tradição manuscrita grega da recensão média.
    reason: O material fornecido informa que a revisão direta do grego ainda está pendente; a nota torna transparente a base documental limitada desta versão.
lexical_decisions:
- source_word: vile offshoots
  choice: rebentos desprezíveis
  rationale: Mantém a metáfora vegetal e o forte juízo negativo do testemunho, em linguagem portuguesa atual.
- source_word: deadly fruit
  choice: fruto mortal
  rationale: Preserva de modo conciso a imagem do fruto que causa morte imediata.
- source_word: the Father’s planting
  choice: plantação do Pai
  rationale: Conserva a metáfora agrícola e a relação explícita com o Pai, sem substituí-la por uma formulação eclesiológica interpretativa.
- source_word: branches of the Cross
  choice: ramos da cruz
  rationale: Retém a imagem incomum do testemunho em vez de normalizá-la ou explicar seu sentido.
- source_word: passion
  choice: paixão
  rationale: Emprega o termo cristão tradicional para o sofrimento e a morte de Cristo, compreensível no registro religioso contemporâneo.
- source_word: union
  choice: união
  rationale: Preserva o caráter amplo e potencialmente teológico do termo, sem defini-lo como uma forma específica de comunhão.
theological_decisions:
- issue: Relação entre a cruz, a paixão e o chamado
  choice: “a cruz pela qual ele, por meio de sua paixão, nos chama”
  alternative: “a cruz, isto é, sua paixão, pela qual ele nos chama”
  rationale: Mantém a estrutura e a tensão metafórica do testemunho disponível, sem identificar de modo explícito a cruz e a paixão além do que ele permite.
- issue: Identidade dos membros
  choice: “pois somos seus membros”
  alternative: “para que sejamos seus membros”
  rationale: Segue o valor circunstancial do testemunho (“being His members”) e não transforma a condição declarada em finalidade.
- issue: Deus como a própria união
  choice: “essa união é ele mesmo”
  alternative: “a união está nele”
  rationale: Preserva a afirmação forte e incomum do testemunho, sem atenuá-la por paráfrase.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se as metáforas agrícolas e corporais, bem como a formulação teologicamente densa sobre a união. Evitaram-se arcaísmos e explicações denominacionais.
