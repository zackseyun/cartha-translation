review_pass:
  verdict: revise
  source_fidelity: A versão preserva as metáforas agrícolas, a imagem paradoxal dos «ramos da Cruz», a referência à paixão e a afirmação final sobre a união. Contudo, «seriam reconhecidas como» enfraquece e altera a construção do testemunho, que diz que elas «teriam sido vistas como» ramos da Cruz. «Fruto mortal» também pode sugerir fruto sujeito à morte, enquanto o sentido é fruto que causa morte.
  naturalness: O português é claro, atual e de registro adequado. «Fruto mortífero» é mais idiomático e semanticamente preciso neste contexto. A formulação densa acerca da Cruz e dos membros é mantida sem explicação doutrinária acrescentada.
  terminology: «Plantação do Pai», «ramos da Cruz», «paixão» e «união» são escolhas adequadas. Emprega-se «Cruz» com maiúscula por sua referência cristológica contextual, em correspondência com o testemunho fornecido.
  issues:
  - severity: medium
    issue: «seriam reconhecidas como ramos da cruz»
    rationale: O inglês «would have been seen to be branches of the Cross» expressa manifestação ou evidência, não mero reconhecimento. «Teriam sido vistas como ramos da Cruz» conserva a construção e sua força.
  - severity: medium
    issue: «fruto mortal»
    rationale: «Deadly fruit» é fruto que produz morte. Em português, «mortal» pode qualificar algo que morre; «mortífero» explicita naturalmente o efeito letal sem mudar a metáfora.
  revised_text: 'Portanto, evitem esses rebentos desprezíveis, que produzem fruto mortífero. Se alguém provar desse fruto, morrerá imediatamente. Pois essas pessoas não são plantação do Pai.


    Se fossem, teriam sido vistas como ramos da Cruz, e seu fruto seria imperecível — a Cruz pela qual ele, por meio de sua paixão, nos chama, pois somos seus membros. Ora, não pode haver cabeça sem membros, visto que Deus promete a união, e essa união é ele mesmo.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de J. B. Lightfoot. A redação deverá ser conferida diretamente com a tradição manuscrita grega da recensão média.
    reason: O material fornecido informa que a revisão direta do grego ainda está pendente; a nota torna transparente a base documental limitada desta versão.
  revision_rationale: 'Foram feitas apenas correções seguras de precisão semântica: «mortífero» traduz o efeito de deadly, e «teriam sido vistas como» preserva o sentido passivo-evidencial de would have been seen to be. Mantêm-se a ambiguidade e a formulação teológica incomum do testemunho disponível, bem como a nota de limitação documental.'
