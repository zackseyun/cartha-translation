base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/018.yaml
  text: 'For this reason the Lord received ointment on his head, so that he might breathe incorruption upon the church. Do not be anointed with the foul odor of the teaching of the prince of this world, so that he may not take you captive and rob you of the life set before you.


    Why do we not all walk wisely, receiving the knowledge of God, which is Jesus Christ? Why do we perish in our foolishness, not knowing the gift of grace that the Lord has truly sent?'
translation:
  language: pt
  text: 'Por essa razão, o Senhor recebeu unguento sobre a cabeça, para soprar incorruptibilidade sobre a igreja. Não se deixem ungir pelo mau cheiro do ensino do príncipe deste mundo, para que ele não os leve cativos nem os prive da vida que está diante de vocês.


    E por que não andamos todos com sabedoria, recebendo o conhecimento de Deus, que é Jesus Cristo? Por que perecemos em nossa insensatez, sem conhecer o dom da graça que o Senhor verdadeiramente enviou?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ointment
  choice: unguento
  rationale: Preserva a imagem concreta da unção e sua relação verbal com «ungir», em registro digno e compreensível.
- source_word: incorruption
  choice: incorruptibilidade
  rationale: Mantém o substantivo abstrato e a amplitude da imagem, sem reduzi-la apenas a imortalidade ou pureza.
- source_word: prince of this world
  choice: príncipe deste mundo
  rationale: Conserva a expressão tradicional e sua referência teológica sem explicitação interpretativa.
- source_word: walk prudently
  choice: andamos todos com sabedoria
  rationale: Emprega a metáfora bíblica de andar como modo de viver e traduz a qualidade adverbial com naturalidade.
- source_word: knowledge of God
  choice: conhecimento de Deus
  rationale: Preserva a possível amplitude do genitivo e evita decidir entre conhecimento acerca de Deus e conhecimento proveniente dele.
theological_decisions:
- issue: Relação entre o conhecimento de Deus e Jesus Cristo
  choice: «o conhecimento de Deus, que é Jesus Cristo»
  alternative: «o conhecimento de Deus, isto é, Jesus Cristo»
  rationale: Mantém a identificação direta e a tensão cristológica do testemunho, sem acrescentar uma explicação doutrinária.
- issue: Imagem de Cristo soprando incorruptibilidade sobre a igreja
  choice: Preservada literalmente
  alternative: Parafrasear como «comunicar vida imperecível à igreja»
  rationale: A metáfora do sopro parece deliberada e deve permanecer aberta em suas possíveis ressonâncias.
- issue: Dom da graça enviado pelo Senhor
  choice: «o dom da graça que o Senhor verdadeiramente enviou»
  alternative: Identificar explicitamente o dom com Cristo
  rationale: O testemunho não faz essa identificação gramatical de modo inequívoco nesta oração; a tradução preserva a formulação recebida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais («vocês», «os») e preservação das imagens antigas. Rascunho necessariamente provisório, pois o material fornecido é um testemunho inglês e a revisão direta do grego da recensão média ainda está pendente.
