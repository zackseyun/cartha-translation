  terminology: «Unguento», «incorruptibilidade», «príncipe deste mundo», «conhecimento de Deus» e «graça» são escolhas adequadas, compreensíveis e teologicamente não reducionistas. A identificação «que é Jesus Cristo» deve permanecer sem explicação adicional.
