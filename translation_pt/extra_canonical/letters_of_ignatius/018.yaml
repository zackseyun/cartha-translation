review_pass:
  verdict: revise
  source_fidelity: O rascunho acompanha de perto o testemunho inglês e preserva corretamente as imagens centrais. A construção grega subjacente a «breathe incorruption upon the Church» é mais bem refletida em português por uma ordem que associe explicitamente «incorruptibilidade» à igreja, sem transformar a metáfora em explicação. «Conhecimento de Deus, que é Jesus Cristo» conserva a identificação presente no testemunho, e «príncipe deste mundo» é adequado.
  naturalness: «Soprar incorruptibilidade sobre a igreja» é compreensível, mas soa sintaticamente calcado. «Soprar sobre a igreja a incorruptibilidade» mantém a imagem e lê melhor. «Ser ungido pelo mau cheiro» também é menos idiomático do que «ser ungido com o mau cheiro», sem alteração de sentido.
  terminology: «Unguento», «incorruptibilidade», «príncipe deste mundo», «conhecimento de Deus» e «graça» são escolhas adequadas para o registro e para a densidade conceitual do trecho. Mantém-se «igreja» em minúscula, sem introduzir uma decisão eclesiológica não exigida pelo texto.
  issues:
  - severity: low
    issue: Ordem pouco natural na imagem do sopro
    rationale: A locução «soprar incorruptibilidade sobre a igreja» é um decalque possível, porém «soprar sobre a igreja a incorruptibilidade» preserva integralmente a metáfora e melhora a fluência.
  - severity: low
    issue: Regência de «ungir» com «mau cheiro»
    rationale: Em português, «ungir com» é a formulação mais natural para o meio ou substância da unção; «pelo mau cheiro» pode sugerir agente.
  revised_text: 'Por essa razão, o Senhor recebeu unguento na cabeça, para soprar sobre a igreja a incorruptibilidade. Não se deixem ungir com o mau cheiro do ensino do príncipe deste mundo, para que ele não os leve cativos nem os prive da vida que está diante de vocês.


    E por que não andamos todos com sabedoria, recebendo o conhecimento de Deus, que é Jesus Cristo? Por que perecemos em nossa insensatez, sem conhecer o dom da graça que o Senhor verdadeiramente enviou?'
  revised_footnotes: []
  revision_rationale: 'Foram feitas apenas correções estilísticas seguras: «na cabeça» é a realização portuguesa natural de «on his head»; a reordenação de «soprar ... a incorruptibilidade» conserva a imagem semântica e melhora a sintaxe; e «ungir com» exprime mais idiomaticamente o elemento da unção. Não se acrescentou identificação doutrinária ao dom da graça nem se resolveu além do necessário a relação entre o conhecimento de Deus e Jesus Cristo.'
