base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/025.yaml
  text: Since, then, I was permitted to see you in the person of Damas, your godly bishop, and your worthy presbyters Bassus and Apollonius, and my fellow servant, the deacon Zotion—whom I would gladly rejoice in, because he is subject to the bishop as to the grace of God, and to the presbytery as to the law of Jesus Christ—
translation:
  language: pt
  text: Assim, já que me foi concedido ver vocês por meio de Damas, seu bispo digno de Deus, e dos dignos presbíteros Basso e Apolônio, bem como do diácono Zótion, meu companheiro de serviço — em cuja companhia oro para ser encontrado, pois ele se submete ao bispo como à graça de Deus e ao presbitério como à lei de Jesus Cristo —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: godly
  choice: piedoso
  rationale: Expressa devoção a Deus em português corrente e digno, sem sugerir que o bispo seja divino.
- source_word: presbyters / presbytery
  choice: presbíteros / presbitério
  rationale: Mantém a terminologia eclesial antiga e a distinção entre os ministros individuais e o corpo que formam.
- source_word: fellow-servant
  choice: companheiro de serviço
  rationale: Preserva a ideia de serviço compartilhado sem introduzir a conotação moderna mais forte de escravidão que poderia resultar de «coescravo».
- source_word: is subject to
  choice: se submete a
  rationale: Comunica uma relação voluntária e contínua de sujeição ou obediência, de modo natural em português.
- source_word: law
  choice: lei
  rationale: Retém a comparação explícita do testemunho e sua possível força normativa, sem reinterpretá-la como mera orientação.
theological_decisions:
- issue: Comparação do bispo com a graça de Deus e do presbitério com a lei de Jesus Cristo
  choice: 'Preservar literalmente as duas comparações: «como à graça de Deus» e «como à lei de Jesus Cristo».'
  alternative: Explicitar que bispo e presbitério apenas representam ou administram a graça e a lei.
  rationale: O texto apresenta comparações densas e potencialmente ambíguas; acrescentar «representante» ou «instrumento» resolveria uma tensão que o testemunho não esclarece.
- issue: Natureza da sujeição do diácono
  choice: «se submete»
  alternative: «obedece»
  rationale: «Submete-se» preserva melhor a linguagem relacional e hierárquica do testemunho sem reduzir todo o vínculo a atos pontuais de obediência.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A frase permanece aberta ao trecho seguinte por terminar em travessão, acompanhando a sintaxe incompleta da unidade fornecida. Como a revisão direta do grego ainda está pendente, a redação é provisória e se apoia no testemunho inglês de domínio público e na camada inglesa auditada.
