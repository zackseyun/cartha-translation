id: IGN.005
reference: Letters of Ignatius — IgnEph. 4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'So then it becometh you to run in harmony with the mind of the bishop; which thing also ye do. For your honorable presbytery, which is worthy of God, is attuned to the bishop, even as its strings to a lyre. Therefore in your concord and harmonious love Jesus Christ is sung.


    And do ye, each and all, form yourselves into a chorus, that being harmonious in concord and taking the key note of God ye may in unison sing with one voice through Jesus Christ unto the Father, that He may both hear you and acknowledge you by your good deeds to be members of His Son. It is therefore profitable for you to be in blameless unity, that ye may also be partakers of God always.'
  text_scope: public_domain_english_witness
  manuscript: Middle-recension Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.iii.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'So then it becometh you to run in harmony with the mind of the bishop; which thing also ye do. For your honorable presbytery, which is worthy of God, is attuned to the bishop, even as its strings to a lyre. Therefore in your concord and harmonious love Jesus Christ is sung.


    And do ye, each and all, form yourselves into a chorus, that being harmonious in concord and taking the key note of God ye may in unison sing with one voice through Jesus Christ unto the Father, that He may both hear you and acknowledge you by your good deeds to be members of His Son. It is therefore profitable for you to be in blameless unity, that ye may also be partakers of God always.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/005.yaml
  text: 'So then it is fitting for you to run in harmony with the mind of the bishop, as indeed you do. For your honorable council of elders, which is worthy of God, is attuned to the bishop like strings to a lyre. Therefore Jesus Christ is sung in your unity and harmonious love.


    Each and every one of you should form yourselves into a chorus, so that, being harmonious in unity and taking the key note of God, you may sing in unison with one voice through Jesus Christ to the Father. Then he may both hear you and acknowledge by your good deeds that you are members of his Son. It is therefore beneficial for you to be in blameless unity, so that you may always share in God.'
translation:
  language: pt
  text: 'Assim, convém que vocês caminhem em harmonia com o pensamento do bispo, como de fato já fazem. Pois o respeitável conselho de presbíteros de vocês, digno de Deus, está afinado com o bispo como as cordas de uma lira. Desse modo, em sua concórdia e em seu amor harmonioso, Jesus Cristo é cantado.


    Que todos vocês, cada um sem exceção, formem um coro, para que, harmonizados pela concórdia e tomando de Deus o tom, cantem em uníssono, a uma só voz, por meio de Jesus Cristo, ao Pai. Assim, ele os ouvirá e reconhecerá, por suas boas obras, que vocês são membros de seu Filho. Portanto, é proveitoso que vocês permaneçam em uma unidade irrepreensível, para que também participem sempre de Deus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradução deste trecho é provisória e se baseia no testemunho inglês de domínio público fornecido; a revisão direta da tradição manuscrita grega da recensão média ainda está pendente.
    reason: O material disponibilizado identifica explicitamente a base de redação como testemunho inglês e informa que a revisão na língua-fonte ainda não foi realizada.
lexical_decisions:
- source_word: τρέχειν / “to run” (as reflected in the witness)
  choice: caminhem
  rationale: A imagem indica conduta conjunta e alinhada; “caminhem” soa natural em português e evita sugerir literalmente uma corrida, embora a revisão direta do grego ainda esteja pendente.
- source_word: γνώμη / “mind”
  choice: pensamento
  rationale: Preserva a ideia de orientação, propósito ou modo de pensar do bispo sem estreitá-la a uma ordem específica.
- source_word: πρεσβυτέριον / “presbytery”
  choice: conselho de presbíteros
  rationale: Expressa o caráter coletivo do grupo e mantém o termo histórico “presbíteros”, sem impor uma estrutura denominacional moderna.
- source_word: συνηρμοσμένον / “attuned”
  choice: afinado
  rationale: Mantém a metáfora musical desenvolvida pela comparação com as cordas da lira.
- source_word: σύμφωνοι / συμφωνία / “harmonious, concord”
  choice: harmonizados / concórdia
  rationale: Preserva tanto a metáfora musical quanto a dimensão relacional de unidade.
- source_word: χρῶμα Θεοῦ / “key note of God”
  choice: tom de Deus
  rationale: “Tom” comunica de modo claro a referência musical; a expressão grega pode envolver nuance técnica e requer revisão da fonte.
- source_word: μέλη τοῦ υἱοῦ αὐτοῦ / “members of his Son”
  choice: membros de seu Filho
  rationale: Conserva a metáfora corporal e sua formulação teologicamente densa sem explicá-la além do texto.
- source_word: μετέχειν Θεοῦ / “partakers of God”
  choice: participem de Deus
  rationale: Mantém a linguagem forte de participação em Deus, evitando reduzi-la a receber apenas bênçãos ou benefícios divinos.
theological_decisions:
- issue: Relação da comunidade e dos presbíteros com o bispo
  choice: Traduzir a harmonia com o pensamento do bispo sem acrescentar linguagem de submissão ou autoridade absoluta.
  alternative: “submetam-se à autoridade do bispo”
  rationale: O testemunho fornecido enfatiza concordância e afinação; explicitar submissão importaria uma formulação eclesiológica não presente nesta redação.
- issue: Reconhecimento por meio das boas obras
  choice: “reconhecerá, por suas boas obras, que vocês são membros de seu Filho”
  alternative: “os salvará por causa de suas boas obras”
  rationale: O texto fala de ouvir e reconhecer, não define aqui a relação entre obras e salvação; a tradução preserva essa tensão sem sistematizá-la.
- issue: Participação em Deus
  choice: “participem sempre de Deus”
  alternative: “desfrutem sempre da comunhão com Deus”
  rationale: A alternativa é mais idiomática, mas atenua a formulação participativa forte do testemunho; a escolha preserva sua densidade teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O campo metafórico musical — afinado, lira, coro, tom, uníssono e uma só voz — foi mantido de forma consistente. “Vocês” evita regionalismo excessivo; “presbíteros” conserva a designação histórica, acompanhada de “conselho” para clareza. A tradução permanece necessariamente provisória até a consulta direta ao grego.
