review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha de perto a testemunha inglesa fornecida, cuja revisão direta contra o grego da recensão média permanece pendente. Há, porém, uma alteração de voz relevante em “essas coisas foram realizadas por nosso Senhor”: a testemunha diz que o próprio Senhor “fez” essas coisas. A revisão restitui essa agência. Também explicita, sem ampliar o sentido, o objeto elíptico de “Que seja...”.'
  naturalness: O texto é em geral claro e de registro adequado. Corrigiram-se “eu os advirto sobre essas coisas”, que em português pode fazer de “os” o destinatário da advertência, e “encontrar[a]”, construção incompleta. Mantêm-se a cadência solene e as repetições retóricas do original auditado.
  terminology: “Feras em forma humana”, “apenas em aparência”, “nossa verdadeira vida” e “o ser humano perfeito” preservam bem as formulações da base inglesa, sem impor interpretação confessional. “Acolher” continua apropriado para “receive”.
  issues:
  - severity: medium
    issue: Mudança de voz e de agência em “foram realizadas por nosso Senhor”
    rationale: A testemunha afirma condicionalmente que nosso Senhor fez essas coisas “em aparência”; a passiva pode sugerir que outros as realizaram nele.
  - severity: medium
    issue: Pronome inadequado em “Mas eu os advirto sobre essas coisas”
    rationale: Em português, “os” tende a retomar pessoas, enquanto “essas coisas” é o conteúdo da advertência. “Advirto vocês sobre estas coisas” preserva os destinatários e o sentido.
  - severity: medium
    issue: Construção incompleta em “nem sequer encontrar[a]”
    rationale: O verbo “encontrar” requer aqui o objeto que a testemunha inglesa assinala entre colchetes. “encontrá-las[a]” torna a frase gramatical e conserva a âncora da restauração.
  - severity: low
    issue: Referente excessivamente elíptico em “Que seja somente em nome de Jesus Cristo”
    rationale: A formulação portuguesa fica suspensa sem sujeito ou referente. “Que isso seja somente...” preserva a abertura do antecedente, mas produz uma frase natural.
  revised_text: 'Mas eu advirto vocês sobre estas coisas, amados, sabendo que vocês mesmos pensam assim. Ainda assim, desde já velo por vocês, para protegê-los de feras em forma humana — pessoas que vocês não só não devem acolher, mas, se possível, nem sequer encontrá-las[a]. Apenas orem por elas; talvez se arrependam. Isso, de fato, é difícil, mas Jesus Cristo, nossa verdadeira vida, tem poder sobre isso.


    Pois, se nosso Senhor fez essas coisas apenas em aparência, então eu também sou prisioneiro apenas em aparência. E por que, então, me entreguei à morte, ao fogo, à espada, às feras? Mas, perto da espada, perto de Deus; na companhia das feras, na companhia de Deus. Que isso seja somente em nome de Jesus Cristo, para que soframos juntamente com ele. Suporto todas as coisas, pois ele mesmo me fortalece — ele, que é o ser humano perfeito.'
  revised_footnotes:
  - marker: a
    text: A testemunha inglesa fornecida põe “them” (“elas”) entre colchetes, assinalando uma palavra suprida para completar a construção. Em português, o pronome foi incorporado a “encontrá-las”.
    reason: Preserva o sinal de restauração textual da base de redação e explica sua realização idiomática em português.
  revision_rationale: 'A revisão é limitada a correções seguras de fidelidade e de gramática: restitui o Senhor como agente de “fez essas coisas”, esclarece os destinatários da advertência, completa o objeto de “encontrar” com a âncora correspondente e dá referente mínimo a “Que isso seja”. Não resolve questões textuais ou exegéticas que dependam da revisão direta do grego.'
