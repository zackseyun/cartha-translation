  english_witness: 'But these things I warn you, dearly beloved, knowing that ye yourselves are so minded. Howbeit I watch over you betimes to protect you from wild beasts in human form--men whom not only should ye not receive, but, if it were possible, not so much as meet [them]; only pray ye for them, if haply they may repent. This indeed is difficult, but Jesus Christ, our true life, hath power over it.


    For if these things were done by our Lord in semblance, then am I also a prisoner in semblance. And why then have I delivered myself over to death, unto fire, unto sword, unto wild beasts? But near to the sword, near to God; in company with wild beasts, in company with God. Only let it be in the name of Jesus Christ, so that we may suffer together with Him. I endure all things, seeing that He Himself enableth me, who is perfect Man.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/080.yaml
  text: 'But I warn you about these things, dearly loved, knowing that you yourselves think this way. Nevertheless, I am watching over you in advance to protect you from wild beasts in human form—people whom you should not only refuse to receive but, if possible, not even meet [them]. Only pray for them, in case they might repent. This is indeed difficult, but Jesus Christ, our true life, has power over it.


    For if our Lord did these things only in appearance, then I too am a prisoner only in appearance. And why, then, have I handed myself over to death, to fire, to the sword, to wild beasts? But close to the sword, close to God; in the company of wild beasts, in the company of God. Only let it be in the name of Jesus Christ, so that we may suffer together with him. I endure everything, since he himself enables me, who is the perfect human being.'
translation:
  language: pt
  text: 'Mas eu os advirto sobre essas coisas, queridos, sabendo que vocês mesmos pensam assim. Ainda assim, desde já velo por vocês, para protegê-los de feras em forma humana — pessoas que vocês não só não devem acolher, mas, se possível, nem sequer encontrar[a]. Apenas orem por elas, para que talvez se arrependam. Isso, de fato, é difícil, mas Jesus Cristo, nossa verdadeira vida, tem poder sobre isso.


    Pois, se essas coisas foram realizadas por nosso Senhor apenas em aparência, então eu também sou prisioneiro apenas em aparência. E por que, então, me entreguei à morte, ao fogo, à espada, às feras? Mas, perto da espada, perto de Deus; na companhia das feras, na companhia de Deus. Que seja somente em nome de Jesus Cristo, para que soframos juntamente com ele. Suporto todas as coisas, pois ele mesmo me fortalece — ele, que é o ser humano perfeito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A testemunha inglesa fornecida marca “them” (“elas”) entre colchetes, indicando uma palavra suprida para completar a construção.
    reason: Preservar o sinal de restauração textual presente na base de redação fornecida.
lexical_decisions:
- source_word: dearly beloved
  choice: queridos
  rationale: Forma afetiva, natural e inclusiva em português atual, sem o tom excessivamente arcaico de “caríssimos”.
- source_word: watch over you betimes
  choice: desde já velo por vocês
  rationale: Preserva tanto a ideia de vigilância pastoral quanto o sentido preventivo ou antecipado expresso pela testemunha inglesa.
- source_word: wild beasts in human form
  choice: feras em forma humana
  rationale: Mantém a metáfora forte e concreta da testemunha, sem explicá-la ou suavizá-la.
- source_word: receive
  choice: acolher
  rationale: Expressa recepção relacional ou comunitária, sem restringir indevidamente o sentido a hospedar em casa.
- source_word: in semblance
  choice: apenas em aparência
  rationale: Comunica com clareza a oposição entre realidade e mera aparência, central ao argumento do trecho.
- source_word: enableth me
  choice: me fortalece
  rationale: Português natural para a capacitação que permite ao autor suportar tudo, evitando uma construção mecânica como “me habilita”.
- source_word: perfect Man
  choice: ser humano perfeito
  rationale: Representa a humanidade plena atribuída a Cristo sem fazer de “Homem” um título introduzido pela tradução.
theological_decisions:
- issue: A realidade dos sofrimentos do Senhor em oposição à mera aparência
  choice: “se essas coisas foram realizadas por nosso Senhor apenas em aparência”
  alternative: “se nosso Senhor fez essas coisas apenas aparentemente”
  rationale: A formulação escolhida conserva a referência ampla e algo ambígua a “essas coisas”, sem especificar além da evidência fornecida se se trata exclusivamente da paixão, da encarnação ou de ambas.
- issue: Sofrer em união com Cristo
  choice: “para que soframos juntamente com ele”
  alternative: “para que compartilhemos os seus sofrimentos”
  rationale: Mantém a formulação verbal e relacional da testemunha, sem definir a natureza dessa participação segundo uma tradição teológica específica.
- issue: Descrição de Cristo como “perfect Man”
  choice: “ele, que é o ser humano perfeito”
  alternative: “ele, que é Homem perfeito”
  rationale: Preserva a afirmação cristológica da humanidade perfeita de Cristo, mas evita transformar a expressão em título técnico ou introduzir uma ênfase de gênero não exigida pelo sentido.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com “vocês” para legibilidade brasileira e internacional. Mantiveram-se as repetições retóricas (“perto... perto”; “na companhia... na companhia”) e a intensidade das imagens. Esta redação é provisória: foi preparada a partir da testemunha inglesa de domínio público e da camada inglesa auditada fornecidas; a revisão direta do grego da recensão média continua pendente.'
