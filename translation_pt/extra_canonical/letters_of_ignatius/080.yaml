    issue: O trecho “nem sequer encontrar[a]” não traz em português o complemento restaurado.
    rationale: A testemunha de redação assinala “them” como suprimento entre colchetes. Em português, o verbo fica sem seu complemento e a nota, embora presente, não resolve plenamente a leitura do texto. “encontrá-las[a]” traduz o elemento suprido e conserva uma âncora de nota.
