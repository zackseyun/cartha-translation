  source_fidelity: 'A redação acompanha de perto a testemunha inglesa fornecida: preserva a advertência pastoral, a metáfora das feras em forma humana, o contraste entre realidade e aparência, as repetições retóricas e a afirmação final sobre Cristo. A principal correção necessária é tornar explícito, em português, o objeto restaurado de “encontrar”, sem perder o sinal de nota.'
  naturalness: O português é moderno, claro e de registro apropriado. “Encontrar[a]”, porém, fica sintaticamente incompleto no contexto e não comunica adequadamente a restauração indicada pelos colchetes da testemunha.
  terminology: “Acolher”, “apenas em aparência”, “nossa verdadeira vida” e “ser humano perfeito” são escolhas defensáveis e não impõem leitura denominacional. Mantém-se “ele” para Cristo e as imagens contundentes do texto.
  issues:
