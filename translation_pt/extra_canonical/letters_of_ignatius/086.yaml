review_pass:
  verdict: revise
  source_fidelity: 'A revisão requer correções em três pontos centrais à luz do grego da recensão média: ἀνεπαύσατε significa que os destinatários deram descanso/alívio aos mensageiros, não que os reanimaram; ἀποτίσει ὑμῖν exprime retribuição; e ἡ τελεία πίστις é literalmente “a fé perfeita”, não “a fidelidade perfeita”. A formulação abreviada “Minha vida pela de vocês” preserva de modo mais fiel o valor vicário/de penhor de τὸ ἐμὸν πνεῦμα ἀντίψυχον ὑμῶν, sem desenvolver uma teoria sacrificial. A leitura crítica [Cristo] deve permanecer assinalada.'
  naturalness: O texto revisto conserva português moderno e digno, com “vocês”, e torna mais natural a referência a descanso e a construção relativa das algemas. “A fé perfeita, Jesus Cristo” é uma personificação deliberadamente incomum no original; a aposição preserva a identificação textual sem a normalizar.
  terminology: “Ministros” é aceitável para διάκονοι, sem impor um ofício técnico. “Palavra de Deus” traduz λόγος θεοῦ de forma direta. “Algemas” comunica as cadeias do prisioneiro com boa naturalidade. O nome Ῥαῖος é aportuguesado transliterativamente como “Raio”; “Agátopo” e “Filão” são mantidos.
  issues:
  - severity: medium
    issue: “os reanimaram” para “refreshed them”
    rationale: O grego ἀνεπαύσατε indica proporcionar descanso, repouso ou alívio. “Reanimar” desloca o sentido para revigorar ânimo ou vida.
  - severity: high
    issue: “a fidelidade perfeita” para ἡ τελεία πίστις
    rationale: πίστις é “fé” neste texto. Embora “faithfulness” conste no testemunho inglês fornecido, a fonte grega exige “fé”; a formulação personificada é então explicitamente identificada com Jesus Cristo.
  - severity: medium
    issue: “Meu espírito se oferece por vocês”
    rationale: ἀντίψυχον exprime mais precisamente uma vida/penhor em substituição ou em favor da vida dos destinatários. “Minha vida pela de vocês” preserva a concisão e a intensidade idiomática.
  - severity: low
    issue: “Reio” para Ῥαῖος
    rationale: “Raio” é uma transliteração mais próxima da forma grega atestada e evita uma vocalização portuguesa pouco transparente.
  revised_text: 'Vocês fizeram bem em receber Filão e Raio Agátopo, que me acompanharam na palavra de Deus, como ministros de [Cristo] Deus.[a] Eles também dão graças ao Senhor por vocês, porque lhes deram descanso em tudo. Isso lhes será retribuído.


    Minha vida pela de vocês, assim como as minhas algemas, que vocês não desprezaram nem das quais se envergonharam. Tampouco a fé perfeita, Jesus Cristo, se envergonhará de vocês.'
  revised_footnotes:
  - marker: a
    text: A palavra “Cristo” aparece entre colchetes no testemunho utilizado, indicando uma restauração ou incerteza textual. A revisão direta da tradição manuscrita grega ainda está pendente.
    reason: Preserva transparentemente o sinal crítico presente na fonte de trabalho e a limitação da base textual.
  revision_rationale: 'A revisão segue o grego onde ele esclarece termos que o testemunho inglês verte de modo interpretativo: descanso para ἀναπαύω, retribuição para ἀποτίω e fé para πίστις. Mantém-se a ambiguidade e o sinal crítico de [Cristo], sem harmonizar a expressão cristológica. A última frase preserva a personificação de “a fé perfeita” e a aposição “Jesus Cristo”, tal como a sintaxe do texto permite.'
