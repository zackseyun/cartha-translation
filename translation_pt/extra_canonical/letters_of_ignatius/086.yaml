base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/086.yaml
  text: 'You did well to receive Philo and Rhaius Agathopus, who followed me in the cause of God, as ministers of [Christ] God. They also give thanks to the Lord for you, because you refreshed them in every way. Nothing shall be lost to you.


    My spirit is devoted for you, as also are my bonds, which you did not despise, neither were ashamed of them. Nor shall he who is perfect faithfulness, even Jesus Christ, be ashamed of you.'
translation:
  language: pt
  text: 'Vocês fizeram bem em receber Filão e Reio Agátopo, que me acompanharam pela causa de Deus, como ministros de [Cristo] Deus.[a] Eles também dão graças ao Senhor por vocês, porque os reanimaram de todas as maneiras. Nada disso ficará sem recompensa para vocês.


    Meu espírito se oferece por vocês, assim como minhas correntes, que vocês não desprezaram nem delas se envergonharam. E aquele que é a fidelidade perfeita, Jesus Cristo, também não se envergonhará de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra “Cristo” aparece entre colchetes no testemunho utilizado, indicando uma restauração ou incerteza textual. A revisão direta da tradição manuscrita grega ainda está pendente.
    reason: Preservar transparentemente o sinal crítico presente na fonte de trabalho e a limitação da base textual.
lexical_decisions:
- source_word: Philo and Rhaius Agathopus
  choice: Filão e Reio Agátopo
  rationale: Transliteração aportuguesada dos nomes próprios, mantendo-os reconhecíveis e legíveis em português.
- source_word: followed me
  choice: me acompanharam
  rationale: Expressa de modo natural a ideia de terem seguido Ignácio em sua jornada e serviço, sem especificar além do testemunho disponível.
- source_word: in the cause of God
  choice: pela causa de Deus
  rationale: Preserva a formulação ampla do testemunho inglês e sua motivação religiosa.
- source_word: ministers
  choice: ministros
  rationale: Mantém o sentido de servidores ou agentes religiosos sem impor um cargo eclesiástico específico.
- source_word: refreshed them
  choice: os reanimaram
  rationale: Comunica cuidado, alívio e renovação de ânimo em português atual.
- source_word: Nothing shall be lost to you
  choice: Nada disso ficará sem recompensa para vocês
  rationale: Torna explícita a força idiomática de que o bem praticado não deixará de ser reconhecido, sem definir a natureza da recompensa.
- source_word: My spirit is devoted for you
  choice: Meu espírito se oferece por vocês
  rationale: Preserva a linguagem intensa de entrega pessoal e possível sentido sacrificial, evitando reduzi-la a mero afeto.
- source_word: bonds
  choice: correntes
  rationale: Refere-se concretamente à condição de prisioneiro de Ignácio e conserva a força imagética.
- source_word: perfect faithfulness
  choice: a fidelidade perfeita
  rationale: Mantém a construção predicativa incomum e teologicamente densa do testemunho, em vez de substituí-la por apenas 'fiel'.
theological_decisions:
- issue: Leitura entre colchetes em '[Christ] God'
  choice: ministros de [Cristo] Deus
  alternative: ministros de Deus / ministros de Cristo Deus
  rationale: Os colchetes foram preservados como sinal de restauração ou incerteza textual no testemunho fornecido; a sintaxe não foi harmonizada silenciosamente.
- issue: Identidade daquele que não se envergonhará
  choice: aquele que é a fidelidade perfeita, Jesus Cristo
  alternative: Deus, que é perfeitamente fiel, não se envergonhará de vocês, por meio de Jesus Cristo
  rationale: Segue a identificação explícita do testemunho inglês com Jesus Cristo e preserva sua formulação cristológica forte, reconhecendo que a revisão direta do grego ainda está pendente.
- issue: Natureza da recompensa
  choice: Nada disso ficará sem recompensa para vocês
  alternative: Nada se perderá para vocês
  rationale: A formulação comunica a expectativa de reconhecimento divino sem especificar mérito, mecanismo ou tipo de recompensa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa do plural. A tradução é provisória porque o material fornecido é um testemunho inglês de domínio público e informa que a revisão direta do grego da recensão média ainda está pendente. Mantiveram-se a linguagem de entrega pessoal, a imagem concreta das correntes e a tensão da expressão “[Cristo] Deus”.
