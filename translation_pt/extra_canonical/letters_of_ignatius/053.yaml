base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/053.yaml
  text: 'Ignatius, who is also called Theophorus, to the church that has found mercy in the generosity of the Most High Father and of Jesus Christ, his only Son; to the church beloved and enlightened through the will of him who willed all things that exist, by faith and love toward Jesus Christ our God; even to the church that has the presidency in the territory of the region of the Romans, worthy of God, worthy of honor, worthy of felicitation, worthy of praise, worthy of success, worthy in purity, and having the presidency of love, walking in the law of Christ and bearing the Father’s name; this church also I greet in the name of Jesus Christ, the Son of the Father. To those who in flesh and spirit are united to his every commandment, being filled with the grace of God without wavering, and filtered clear from every foreign stain: abundant greeting in Jesus Christ our God, in blamelessness.'
translation:
  language: pt
  text: 'Inácio, também chamado Teóforo, à igreja que alcançou misericórdia na generosidade do Pai Altíssimo e de Jesus Cristo, seu único Filho; à igreja amada e iluminada pela vontade daquele que quis que existissem todas as coisas, mediante a fé e o amor para com Jesus Cristo, nosso Deus; àquela que preside no território da região dos romanos, digna de Deus, digna de honra, digna de felicitação, digna de louvor, digna de êxito, digna em pureza, que preside no amor, anda na lei de Cristo e leva o nome do Pai. Saúdo também essa igreja em nome de Jesus Cristo, o Filho do Pai. Aos que, em carne e espírito, estão unidos a cada um dos seus mandamentos, cheios da graça de Deus sem vacilar e purificados, como por um filtro, de toda mancha estranha: muitas saudações em Jesus Cristo, nosso Deus, em irrepreensibilidade.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Mantém o nome ou cognome tradicional em forma portuguesa, sem escolher entre possíveis explicações etimológicas.
- source_word: hath the presidency / having the presidency
  choice: preside / preside
  rationale: Preserva a repetição e a linguagem de presidência do testemunho, sem definir a natureza ou a extensão dessa função.
- source_word: country of the region of the Romans
  choice: território da região dos romanos
  rationale: Conserva a formulação geográfica incomum e evita modernizá-la simplesmente para “Roma”.
- source_word: felicitation
  choice: felicitação
  rationale: Retém como qualidade distinta na série laudatória, sem fundi-la com honra, louvor ou felicidade.
- source_word: success
  choice: êxito
  rationale: Reproduz o sentido positivo do termo no testemunho sem lhe atribuir uma interpretação eclesiológica específica.
- source_word: filtered clear
  choice: purificados, como por um filtro
  rationale: Mantém explícita a imagem concreta e incomum da filtragem, ao mesmo tempo que produz português compreensível.
- source_word: blamelessness
  choice: irrepreensibilidade
  rationale: Expressa a condição abstrata indicada no fecho, em registro digno e corrente na linguagem religiosa.
theological_decisions:
- issue: Jesus Cristo chamado “nosso Deus”
  choice: Jesus Cristo, nosso Deus
  alternative: Jesus Cristo, que é nosso Deus
  rationale: Mantém a predicação direta do testemunho e sua força cristológica sem acrescentar uma cópula explicativa.
- issue: “preside no amor”
  choice: que preside no amor
  alternative: que preside sobre a comunidade do amor
  rationale: Preserva a ambiguidade da expressão e evita identificar “amor” com uma instituição, jurisdição ou coletividade específica.
- issue: Referente de “seus mandamentos”
  choice: seus mandamentos
  alternative: mandamentos de Cristo
  rationale: Conserva a referência pronominal do testemunho, que pode ser relacionada ao referente divino precedente, sem resolver além da evidência disponível.
- issue: Relação entre vontade, fé e amor
  choice: pela vontade daquele... mediante a fé e o amor
  alternative: amada e iluminada, na fé e no amor, pela vontade daquele
  rationale: Mantém as relações sintáticas tão abertas quanto permite o português, sem impor com certeza a ligação de “fé e amor” a um único verbo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A estrutura solene e cumulativa da saudação foi preservada, mas dividida em períodos para evitar opacidade excessiva. Como a revisão direta do grego ainda está pendente, as escolhas seguem cautelosamente o testemunho inglês público fornecido e a camada consultiva da POB, conservando formulações marcadas e ambiguidades relevantes.
