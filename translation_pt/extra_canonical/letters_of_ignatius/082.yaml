base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/082.yaml
  text: 'Let no one be deceived. Even the heavenly beings, the glory of the angels, and the rulers, visible and invisible—if they do not believe in the blood of Christ [who is God], judgment awaits them also. He who receives, let him receive. Let no one be puffed up by office, for faith and love are all in all, and nothing is preferred before them.


    But mark those who hold strange doctrine concerning the grace of Jesus Christ that came to us, how they are contrary to the mind of God. They have no care for love, none for the widow, none for the orphan, none for the afflicted, none for the prisoner, none for the hungry or thirsty. They abstain from the eucharist (thanksgiving) and prayer because they do not acknowledge that the eucharist is the flesh of our Savior Jesus Christ, which flesh suffered for our sins and which the Father, in His goodness, raised up.'
translation:
  language: pt
  text: '6. Ninguém se engane. Até os seres celestiais, a glória dos anjos e os governantes, visíveis e invisíveis — se não crerem no sangue de Cristo [que é Deus][a] — também os aguarda o juízo. Quem puder acolher isso, acolha. Que ninguém se encha de orgulho por causa de seu cargo, pois a fé e o amor são tudo, e nada lhes é superior.


    Observem, porém, os que sustentam doutrinas estranhas a respeito da graça de Jesus Cristo que veio até nós: vejam como são contrários ao pensamento de Deus. Não se importam com o amor, nem com a viúva, nem com o órfão, nem com o aflito, nem com o prisioneiro, nem com quem tem fome ou sede. Eles se abstêm da eucaristia[b] e da oração, porque não reconhecem que a eucaristia é a carne de nosso Salvador Jesus Cristo — a carne que sofreu por nossos pecados e que o Pai, em sua bondade, ressuscitou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “que é Deus” aparece entre colchetes no testemunho utilizado, sinalizando uma restauração ou questão textual. A revisão direta da tradição manuscrita grega ainda está pendente.
    reason: Preservar de modo transparente o sinal textual presente na fonte fornecida.
  - marker: b
    text: “Eucaristia” vem do termo grego que significa “ação de graças”.
    reason: Conservar a explicação lexical parentética do testemunho inglês sem tornar o texto principal pesado.
lexical_decisions:
- source_word: office
  choice: cargo
  rationale: Expressa uma posição de responsabilidade ou autoridade sem importar uma estrutura eclesiástica específica.
- source_word: faith and love are all in all
  choice: a fé e o amor são tudo
  rationale: Preserva a força abrangente da expressão com formulação natural em português.
- source_word: mind of God
  choice: pensamento de Deus
  rationale: Mantém o sentido de disposição ou modo de pensar divino sem o reduzir a simples opinião.
- source_word: eucharist (thanksgiving)
  choice: eucaristia
  rationale: Conserva o termo histórico e litúrgico; a nota registra seu sentido lexical de ação de graças.
- source_word: allow not / acknowledge not
  choice: não reconhecem
  rationale: Indica rejeição da afirmação, sem sugerir mera falta de conhecimento.
- source_word: raised up
  choice: ressuscitou
  rationale: No contexto da carne de Jesus após o sofrimento, o verbo refere-se à ressurreição.
theological_decisions:
- issue: A frase entre colchetes “who is God”
  choice: Preservar no texto como “[que é Deus]” e acrescentar marcador de nota
  alternative: Integrá-la sem colchetes ou omiti-la
  rationale: O testemunho fornecido assinala a frase como restauração ou questão textual; os colchetes preservam esse dado sem decidir silenciosamente sua condição.
- issue: Identificação da eucaristia com a carne de Cristo
  choice: Traduzir diretamente “a eucaristia é a carne de nosso Salvador Jesus Cristo”
  alternative: Parafrasear em termos simbólicos, sacramentais ou confessionais
  rationale: A redação mantém a afirmação vigorosa e sua tensão teológica sem impor uma interpretação denominacional posterior.
- issue: “Quem recebe, receba”
  choice: “Quem puder acolher isso, acolha”
  alternative: “Quem recebe, receba”
  rationale: A formulação portuguesa explicita apenas o valor idiomático provável de aceitação, sem definir precisamente o objeto e preservando a concisão proverbial.
- issue: Agentes celestiais e crença no sangue de Cristo
  choice: Manter a construção condicional tal como transmitida
  alternative: Explicá-la como hipótese retórica ou referência exclusiva a seres humanos
  rationale: O texto é teologicamente incomum e não deve ser harmonizado ou reinterpretado sem revisão direta do grego.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A tradução é provisória porque o material fornecido declara pendente a revisão direta do grego; por isso, evita reconstruções não sustentadas e preserva os sinais textuais do testemunho público consultado.
