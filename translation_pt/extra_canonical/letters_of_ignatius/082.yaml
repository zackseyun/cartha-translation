  revision_rationale: A revisão reduz expansões não sustentadas pelo testemunho inglês, restaura no texto a glosa parentética transmitida para “eucaristia” e melhora a fluência de construções pontuais. Mantêm-se os colchetes e a nota da frase cristológica, sem resolver a questão textual nem impor leitura doutrinária.
