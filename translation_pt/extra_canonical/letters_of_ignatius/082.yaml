  revision_rationale: A revisão elimina uma expansão interpretativa da fórmula proverbial, restaura no texto a glosa parentética do testemunho inglês e torna a exortação do segundo parágrafo mais natural em português. Mantêm-se tanto os colchetes quanto a nota para não resolver antecipadamente a questão textual de “[que é Deus]”.
