    Considerem, porém, como são contrários ao pensamento de Deus os que sustentam doutrinas estranhas a respeito da graça de Jesus Cristo que veio até nós. Não se importam com o amor, nem com a viúva, nem com o órfão, nem com o aflito, nem com o prisioneiro, nem com quem tem fome ou sede. Eles se abstêm da eucaristia (ação de graças)[b] e da oração, porque não reconhecem que a eucaristia é a carne de nosso Salvador Jesus Cristo — a carne que sofreu por nossos pecados e que o Pai, em sua bondade, ressuscitou.'
