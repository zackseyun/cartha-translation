review_pass:
  verdict: revise
  source_fidelity: 'É necessária uma correção segura em relação ao texto grego da recensão média: a expressão é κατὰ οἰκονομίαν θεοῦ, isto é, «segundo o plano/ordenação de Deus». O rascunho, seguindo a testemunha inglesa fornecida, omite «de Deus». «Foi concebido» é mais preciso que «foi gerado» para ἐκυοφορήθη. Mantém-se «por seu sofrimento» para a relação instrumental de τῷ πάθει, sem explicação doutrinal adicional.'
  naturalness: O texto é claro e de registro apropriado. «Meu espírito é refugo por causa da cruz» evita o aspecto incoativo não expresso de «se torna» e conserva a imagem áspera. «Plano de Deus» é mais inteligível no português moderno do que «dispensação» e restitui o elemento presente no grego.
  terminology: «Pedra de tropeço», «descendência de Davi», «Espírito Santo» e «vida eterna» são escolhas estáveis e naturais. A designação «nosso Deus, Jesus, o Cristo» preserva a ênfase cristológica do original. A nota sobre «refugo» continua útil; a nota sobre «dispensação» deve ser substituída, pois a tradução revista usa «plano de Deus».
  issues:
  - severity: high
    issue: Omissão de «Deus» em «conforme a dispensação».
    rationale: O texto grego da recensão média traz κατὰ οἰκονομίαν θεοῦ («segundo o plano/ordenação de Deus»). A testemunha inglesa disponibilizada aparentemente abrevia esse elemento; a revisão pela fonte original requer sua restituição.
  - severity: medium
    issue: «Foi gerado» para a concepção no ventre de Maria.
    rationale: «Foi concebido» corresponde mais diretamente ao sentido de ἐκυοφορήθη e evita a possível leitura de geração/nascimento, que o período em seguida distingue explicitamente.
  - severity: low
    issue: «Se torna» introduz uma nuance incoativa.
    rationale: A construção grega é nominal; «é refugo» é mais próxima do enunciado, permanecendo compreensível em português.
  revised_text: 'Meu espírito é refugo[a] por causa da cruz, que é pedra de tropeço para os que não creem, mas, para nós, é salvação e vida eterna. Onde está o sábio? Onde está o debatedor? Onde está a vanglória dos que são chamados prudentes?


    Pois o nosso Deus, Jesus, o Cristo, foi concebido no ventre de Maria segundo o plano de Deus[b], da descendência de Davi, mas também do Espírito Santo. Ele nasceu e foi batizado para que, por seu sofrimento, purificasse a água.'
  revised_footnotes:
  - marker: a
    text: “Refugo” traduz uma imagem de algo removido ou tratado como resto desprezível; o termo também podia adquirir o sentido de alguém oferecido em favor de outros.
    reason: A metáfora é incomum em português e possui uma amplitude semântica que não deve ser reduzida silenciosamente.
  - marker: b
    text: O grego diz literalmente “segundo a ordenação/plano de Deus”. “Plano de Deus” comunica aqui a ideia de propósito ou ordem estabelecida, sem remeter necessariamente a um sistema teológico posterior.
    reason: Restitui o termo “de Deus”, presente no grego, e esclarece o sentido de οἰκονομία sem impor uso denominacional posterior.
  revision_rationale: A revisão restitui «de Deus» conforme o texto grego da recensão média, substitui «foi gerado» por «foi concebido» e remove a nuance de processo em «se torna». As demais escolhas são preservadas por manterem adequadamente a força, as ambiguidades e o registro do original.
