base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/019.yaml
  text: 'My spirit is made refuse for the cross, which is a stumbling block to those who do not believe, but to us is salvation and eternal life. Where is the wise person? Where is the debater? Where is the boasting of those who are called prudent?


    For our God, Jesus the Christ, was conceived in Mary’s womb according to a dispensation, from the seed of David but also from the Holy Spirit. He was born and was baptized so that by his suffering he might cleanse water.'
translation:
  language: pt
  text: 'Meu espírito se torna refugo[a] por causa da cruz, que é pedra de tropeço para os que não creem, mas, para nós, é salvação e vida eterna. Onde está o sábio? Onde está o debatedor? Onde está a vanglória dos que são chamados prudentes?


    Pois o nosso Deus, Jesus, o Cristo, foi gerado no ventre de Maria conforme a dispensação[b], da descendência de Davi, mas também do Espírito Santo. Ele nasceu e foi batizado para que, por seu sofrimento, purificasse a água.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Refugo” traduz uma imagem de algo removido ou tratado como resto desprezível; o termo também podia adquirir o sentido de alguém oferecido em favor de outros.
    reason: A metáfora é incomum em português e possui uma amplitude semântica que não deve ser reduzida silenciosamente.
  - marker: b
    text: Aqui, “dispensação” significa uma ordem, administração ou plano estabelecido; o termo não aponta necessariamente para um sistema teológico posterior.
    reason: Evita uma leitura denominacional anacrônica e esclarece o sentido antigo do vocábulo.
lexical_decisions:
- source_word: offscouring (provável grego περίψημα)
  choice: refugo
  rationale: Mantém a imagem forte de algo desprezado ou removido como resíduo, sem convertê-la em uma formulação sacrificial mais específica do que a evidência fornecida permite.
- source_word: stumbling-block (provável grego σκάνδαλον)
  choice: pedra de tropeço
  rationale: Expressão bíblica reconhecível e natural em português, preservando a ideia de algo que leva à queda ou à rejeição.
- source_word: dispensation (provável grego οἰκονομία)
  choice: dispensação
  rationale: Preserva a amplitude do termo, que pode indicar ordenação, administração ou plano estabelecido, sem identificar explicitamente um agente não expresso na formulação recebida.
- source_word: seed of David
  choice: descendência de Davi
  rationale: Comunica naturalmente a linhagem davídica; a tradução literal 'semente' seria menos idiomática em português contemporâneo.
- source_word: passion
  choice: sofrimento
  rationale: Evita que 'paixão' seja mal compreendida no português moderno e mantém a referência ao padecimento de Cristo.
theological_decisions:
- issue: Designação de Jesus como Deus
  choice: “o nosso Deus, Jesus, o Cristo”
  alternative: “Jesus Cristo, nosso Deus”
  rationale: Mantém de perto a ordem e a força predicativa do testemunho, sem atenuar a identificação cristológica.
- issue: Concepção a partir da descendência de Davi e do Espírito Santo
  choice: “da descendência de Davi, mas também do Espírito Santo”
  alternative: “da descendência de Davi segundo a carne e do Espírito Santo”
  rationale: Não acrescenta “segundo a carne”, ausente do testemunho fornecido, e conserva a tensão da construção paralela.
- issue: Purificação da água pelo sofrimento de Cristo
  choice: “para que, por seu sofrimento, purificasse a água”
  alternative: “para que purificasse a água para o seu sofrimento”
  rationale: Segue a relação instrumental apresentada pelo testemunho e não explica dogmaticamente de que modo o batismo e a paixão se relacionam.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe bíblica moderada. Mantiveram-se as formulações abruptas e teologicamente densas do testemunho. Como a revisão direta do grego ainda está indicada como pendente nos dados fornecidos, decisões associadas aos prováveis termos gregos são deliberadamente cautelosas.
