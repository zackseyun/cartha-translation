review_pass:
  verdict: revise
  source_fidelity: 'A redação preserva bem a sequência e as imagens do testemunho e, em pontos centrais, corresponde ao grego da recensão média: «ordenanças», «carne e espírito», a ordem não harmonizada «Filho, Pai e Espírito», o presbitério como coroa/grinalda espiritual e os diáconos «segundo Deus». Contudo, o imperativo de submissão (ὑποτάσσεσθε) é melhor vertido por «sujeitem-se»/«submetam-se» do que por uma afirmação explícita de que Cristo e os apóstolos «obedeceram», pois a comparação do original descreve submissão. «Para permanecer firmes» também atenua a construção passiva de ser estabelecido/confirmado.'
  naturalness: O português é claro e de registro apropriado. «Coroa espiritual harmoniosamente entrelaçada» é compreensível, mas «grinalda espiritual bem entrelaçada» comunica mais naturalmente a imagem figurada de uma coroa tecida. A colocação da chamada de nota após vírgula, «[segundo a carne],[a]», é tipograficamente inadequada; a chamada deve seguir o trecho entre colchetes, sem vírgula interveniente.
  terminology: «Ordenanças», «presbitério», «diáconos», «carne» e «espírito» são escolhas adequadas e não impõem leitura denominacional. Conserva-se «Espírito», sem acrescentar «Santo», e mantém-se a qualificação entre colchetes como sinal textual, sem decidir a sua origem ou alcance.
  issues:
  - severity: medium
    issue: «Jesus Cristo obedeceu ao Pai» e «os apóstolos obedeceram»
    rationale: O grego usa o mesmo campo de submissão/sujeição do imperativo dirigido aos leitores, não um verbo independente e mais específico de obedecer. «Submeter-se» preserva melhor a relação verbal e evita estreitar o enunciado.
  - severity: low
    issue: «permanecer firmes» para «be confirmed»
    rationale: A formulação é natural, mas deixa de refletir a nuance passiva de ser firmemente estabelecido. «Estejam firmemente estabelecidos» a preserva sem introduzir conotação sacramental.
  - severity: low
    issue: Posição da chamada de nota
    rationale: A chamada «[a]» aparece depois de uma vírgula imediatamente posterior aos colchetes. A reposição após o trecho entre colchetes resolve a apresentação sem alterar o sentido.
  revised_text: 'Portanto, empenhem-se para estar firmemente estabelecidos nas ordenanças do Senhor e dos apóstolos, para que prosperem em tudo o que fizerem, na carne e no espírito, pela fé e pelo amor, no Filho, no Pai e no Espírito, no princípio e no fim, juntamente com o seu respeitado bispo, com a grinalda espiritual bem entrelaçada do seu presbitério e com os diáconos que andam segundo Deus.



    Sujeitem-se ao bispo e uns aos outros, assim como Jesus Cristo se submeteu ao Pai [segundo a carne][a], e como os apóstolos se submeteram a Cristo e ao Pai, para que haja união tanto da carne como do espírito.'
  revised_footnotes:
  - marker: a
    text: A expressão “segundo a carne” aparece entre colchetes no testemunho usado como base, sinalizando incerteza ou particularidade textual; a revisão direta do grego ainda está pendente.
    reason: Preserva de forma transparente o sinal textual do testemunho e os limites da base disponível.
  revision_rationale: A revisão conserva todas as ambiguidades, a ordem dos termos e as metáforas do texto. Ajusta-se a tradução da submissão para corresponder mais diretamente ao verbo grego e à estrutura comparativa, recupera-se a nuance passiva de «ser estabelecido» e corrige-se a ancoragem tipográfica da nota. A substituição de «coroa» por «grinalda» é uma melhoria estilística segura para a imagem de um círculo/coroa entretecido, sem redefinir o presbitério.
