base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/036.yaml
  text: 'Therefore, make every effort to be firmly established in the ordinances of the Lord and of the apostles, so that you may prosper in everything you do, in flesh and spirit, through faith and love, in the Son and Father and in the Spirit, in the beginning and in the end, with your revered bishop, with the fitly wreathed spiritual circlet of your presbytery, and with the deacons who walk after God.


    Be obedient to the bishop and to one another, just as Jesus Christ was to the Father [according to the flesh], and as the apostles were to Christ and to the Father, so that there may be union of both flesh and spirit.'
translation:
  language: pt
  text: 'Portanto, empenhem-se para permanecer firmes nas ordenanças do Senhor e dos apóstolos, a fim de prosperarem em tudo o que fizerem, na carne e no espírito, mediante a fé e o amor, no Filho, no Pai e no Espírito, no princípio e no fim, juntamente com seu respeitado bispo, com a coroa espiritual harmoniosamente entrelaçada do seu presbitério e com os diáconos que andam segundo Deus.


    Obedeçam ao bispo e uns aos outros, assim como Jesus Cristo obedeceu ao Pai [segundo a carne],[a] e como os apóstolos obedeceram a Cristo e ao Pai, para que haja união tanto da carne como do espírito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “segundo a carne” aparece entre colchetes no testemunho usado como base, sinalizando incerteza ou particularidade textual; a revisão direta do grego ainda está pendente.
    reason: Preservar de forma transparente o sinal textual do testemunho e os limites da base disponível.
lexical_decisions:
- source_word: ordinances
  choice: ordenanças
  rationale: Preserva o sentido amplo de determinações, preceitos ou disposições transmitidos pelo Senhor e pelos apóstolos, sem especificar indevidamente uma forma institucional.
- source_word: be confirmed
  choice: permanecer firmes
  rationale: Expressa de modo natural o sentido de ser estabelecido ou confirmado, evitando uma possível leitura sacramental anacrônica de “confirmados”.
- source_word: in flesh and spirit
  choice: na carne e no espírito
  rationale: Mantém o paralelismo antropológico e a tensão do testemunho, sem reduzir “carne” simplesmente a “corpo”.
- source_word: fitly wreathed spiritual circlet
  choice: coroa espiritual harmoniosamente entrelaçada
  rationale: Conserva a metáfora coletiva do presbitério como coroa ou grinalda, tornando inteligível a ideia de membros bem ajustados entre si.
- source_word: presbytery
  choice: presbitério
  rationale: Mantém a designação histórica do corpo de presbíteros, em vez de confundi-la com um edifício ou com uma denominação moderna.
- source_word: walk after God
  choice: andam segundo Deus
  rationale: Preserva o idioma ético-religioso de “andar” e evita ampliar a expressão para uma interpretação específica.
theological_decisions:
- issue: Relação de Jesus Cristo com o Pai
  choice: “Jesus Cristo obedeceu ao Pai [segundo a carne]”
  alternative: “Jesus Cristo estava sujeito ao Pai” ou omitir os colchetes
  rationale: A explicitação verbal decorre do imperativo “obedeçam” e torna a comparação natural em português. Os colchetes são mantidos como sinal textual, sem resolver sua condição ou suas implicações cristológicas.
- issue: Fórmula trinitária e ordem dos termos
  choice: “no Filho, no Pai e no Espírito”
  alternative: normalizar para “no Pai, no Filho e no Espírito Santo”
  rationale: Preserva a ordem incomum e a forma exata do testemunho fornecido, sem harmonização litúrgica ou doutrinária.
- issue: União de carne e espírito
  choice: “união tanto da carne como do espírito”
  alternative: “unidade de corpo e alma”
  rationale: Conserva os termos e a tensão do texto, sem impor uma antropologia dicotômica específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A redação é provisória porque foi feita a partir do testemunho inglês público fornecido; a revisão direta da tradição manuscrita grega da recensão média permanece pendente. Mantiveram-se a metáfora da coroa, a linguagem de carne e espírito e a ordem incomum de Filho, Pai e Espírito.
