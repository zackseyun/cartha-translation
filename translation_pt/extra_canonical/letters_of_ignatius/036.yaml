review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a estrutura, a ordem incomum «Filho, Pai e Espírito», a metáfora do presbitério como coroa/grinalda e o sinal editorial dos colchetes. Contudo, «permanecer firmes» acrescenta a noção de continuidade onde o grego e o testemunho apontam para ser estabelecido/firme, e «harmoniosamente» interpreta além de «fitly wreathed»/ἀξιοπλόκου. A construção de sujeição no segundo parágrafo é melhor refletida por «sujeitem-se» do que por «obedeçam».
  naturalness: O texto é claro e de registro adequado, mas «a coroa espiritual harmoniosamente entrelaçada do seu presbitério» soa algo pesada e «andam segundo Deus» é pouco idiomático em português atual. «Coroa espiritual, bem entrelaçada, do presbitério de vocês» e «diáconos que vivem segundo Deus» preservam o sentido com maior fluência.
  terminology: «Ordenanças», «presbitério», «diáconos», «carne» e «espírito» são escolhas apropriadas. Mantém-se «Filho, Pai e Espírito», sem harmonização litúrgica. «Sujeitem-se» reproduz mais precisamente o campo semântico de ὑποτάσσεσθε e evita reduzir a comparação a mera obediência pontual.
  issues:
  - severity: medium
    issue: «permanecer firmes» para «be confirmed»
    rationale: A formulação introduz a ideia aspectual de continuar em uma condição já possuída. «Firmarem-se» conserva melhor a exortação a tornar-se estabelecido/firme.
  - severity: low
    issue: «harmoniosamente entrelaçada» para «fitly wreathed»
    rationale: «Harmoniosamente» explicita uma avaliação interpretativa. «Bem entrelaçada» mantém a imagem da coroa/grinalda adequadamente composta.
  - severity: medium
    issue: «Obedeçam» para ὑποτάσσεσθε e pontuação da chamada de nota
    rationale: O verbo grego refere sujeição/submissão e a chamada está posicionada após uma vírgula redundante («[...],[a]»). «Sujeitem-se» é mais fiel, e a chamada deve seguir imediatamente o trecho entre colchetes, antes da vírgula.
  revised_text: 'Portanto, esforcem-se por se firmarem nas ordenanças do Senhor e dos apóstolos, para que prosperem em tudo o que fizerem, na carne e no espírito, na fé e no amor, no Filho, no Pai e no Espírito, no princípio e no fim, juntamente com o bispo de vocês, muito digno de honra, com a coroa espiritual, bem entrelaçada, do presbitério de vocês e com os diáconos que vivem segundo Deus.


    Sujeitem-se ao bispo e uns aos outros, assim como Jesus Cristo ao Pai [segundo a carne][a], e como os apóstolos a Cristo e ao Pai, para que haja união tanto da carne como do espírito.'
  revised_footnotes:
  - marker: a
    text: A expressão “segundo a carne” aparece entre colchetes no testemunho usado como base, sinalizando uma particularidade textual; a revisão direta do grego ainda está pendente.
    reason: Preserva de modo transparente o sinal editorial do testemunho de base, sem decidir a condição textual nem suas implicações cristológicas.
  revision_rationale: 'A revisão conserva o conteúdo, as ambiguidades e a ordem do testemunho, ao mesmo tempo que aproxima a redação dos verbos e imagens do grego da recensão média: estabelecimento/firmeza, sujeição, coroa espiritual bem entrelaçada e diáconos segundo Deus. Também corrige a colocação do marcador da nota.'
