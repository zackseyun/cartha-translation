base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/045.yaml
  text: 'Therefore I urge you—yet not I, but the love of Jesus Christ—take only Christian food, and abstain from strange herbage, which is heresy:


    for these people even mingle poison with Jesus Christ, imposing upon others by a show of honesty, like persons administering a deadly drug with honeyed wine, so that one who does not know it, fearing nothing, drinks in death with baneful delight.'
translation:
  language: pt
  text: 'Portanto, eu os exorto — ou melhor, não eu, mas o amor de Jesus Cristo —: alimentem-se somente do alimento cristão e abstenham-se de ervas estranhas, isto é, da heresia.


    Pois essas pessoas chegam a misturar veneno com Jesus Cristo, enganando os outros com uma aparência de honestidade. São como aqueles que servem uma droga mortal misturada com vinho adoçado com mel, para que quem não sabe, sem nada temer, beba a própria morte com um prazer funesto.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Christian food
  choice: alimento cristão
  rationale: Preserva a metáfora alimentar central do testemunho e mantém linguagem clara e digna.
- source_word: strange herbage
  choice: ervas estranhas
  rationale: Conserva o contraste metafórico entre alimento cristão e vegetação alheia, sem reduzir a imagem a uma paráfrase abstrata.
- source_word: heresy
  choice: heresia
  rationale: Mantém o termo histórico e teológico explícito no testemunho fornecido.
- source_word: mingle poison with Jesus Christ
  choice: misturar veneno com Jesus Cristo
  rationale: Retém a formulação forte e deliberadamente tensa, sem explicá-la como mera mistura com ensino cristão.
- source_word: honeyed wine
  choice: vinho adoçado com mel
  rationale: Expressa de modo natural em português a bebida antiga descrita, preservando o elemento do mel.
- source_word: baneful delight
  choice: prazer funesto
  rationale: Reproduz a combinação paradoxal de prazer e resultado mortal em registro digno e compreensível.
theological_decisions:
- issue: Relação entre as ervas estranhas e a heresia
  choice: isto é, da heresia
  alternative: que é heresia
  rationale: Torna natural em português a identificação presente no testemunho, sem ampliar sua definição teológica.
- issue: O veneno misturado com Jesus Cristo
  choice: preservar literalmente a associação
  alternative: misturar veneno com o ensino de Jesus Cristo
  rationale: A alternativa resolveria uma tensão metafórica que o testemunho deixa intacta e acrescentaria um referente não expresso.
- issue: Fonte da exortação
  choice: ou melhor, não eu, mas o amor de Jesus Cristo
  alternative: não sou eu que os exorto, mas o amor de Jesus Cristo
  rationale: Mantém a correção retórica e a personificação do amor de Jesus Cristo sem transformar a frase em uma afirmação doutrinária mais explícita.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom pastoral e solene. Usa segunda pessoa do plural por meio de «vocês» implícito nas formas verbais, evitando tanto arcaísmos quanto coloquialismo. Esta versão é necessariamente provisória, pois foi preparada a partir do testemunho inglês de domínio público fornecido; a revisão direta do grego da recensão média continua pendente.
