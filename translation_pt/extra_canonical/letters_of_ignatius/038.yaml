base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/038.yaml
  text: The Ephesians in Smyrna greet you; I am also writing to you from here. They are here with me for the glory of God, as you also are, and they have comforted me in every way, together with Polycarp, bishop of the Smyrnaeans. Yes, and all the other churches greet you in the honor of Jesus Christ. Farewell in godly harmony, and possess a steadfast spirit, which is Jesus Christ.
translation:
  language: pt
  text: Os efésios que estão em Esmirna saúdam vocês; é também daqui que lhes escrevo. Eles estão aqui comigo para a glória de Deus, assim como vocês também estão, e, juntamente com Policarpo, bispo dos esmirnenses, têm me consolado em tudo. Sim, e todas as outras igrejas saúdam vocês na honra de Jesus Cristo. Passem bem, em harmonia segundo Deus, e conservem um espírito firme, que é Jesus Cristo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público de J. B. Lightfoot; a revisão direta do texto grego da recensão média ainda está pendente. A frase final identifica literalmente o «espírito firme» com Jesus Cristo.
    reason: O material fornecido declara que a revisão da língua-fonte está pendente, e a construção final contém uma identificação teologicamente marcante que deve ser preservada sem resolução interpretativa.
lexical_decisions:
- source_word: salute / greet
  choice: saúdam
  rationale: Mantém o tom epistolar antigo com uma forma ainda clara e digna em português.
- source_word: for the glory of God
  choice: para a glória de Deus
  rationale: Conserva diretamente a finalidade expressa pelo testemunho disponível.
- source_word: bishop of the Smyrnaeans
  choice: bispo dos esmirnenses
  rationale: Reproduz o gentílico do testemunho, sem modernizá-lo para uma formulação institucional mais específica.
- source_word: godly concord
  choice: harmonia segundo Deus
  rationale: Expressa concordância orientada por Deus sem recorrer ao adjetivo pouco natural «divina», que poderia sugerir identidade ou origem em vez de conformidade.
- source_word: possess ye a steadfast spirit
  choice: conservem um espírito firme
  rationale: Produz português natural e preserva a exortação à estabilidade interior ou espiritual, sem definir além do testemunho o sentido de «espírito».
theological_decisions:
- issue: Identificação do «espírito firme» com Jesus Cristo
  choice: que é Jesus Cristo
  alternative: isto é, Jesus Cristo / o qual é Jesus Cristo
  rationale: Mantém a identificação forte e a tensão teológica do testemunho, sem convertê-la em mera comparação, explicação metafórica ou referência inequívoca ao Espírito Santo.
- issue: Sentido de «as you also are» após «for the glory of God»
  choice: assim como vocês também estão
  alternative: assim como vocês também estão aqui para a glória de Deus
  rationale: Preserva a concisão e a possível elipse do testemunho, evitando acrescentar «aqui», que poderia indicar presença física em Esmirna.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega «vocês» para o plural e conserva leve tonalidade epistolar em «saúdam» e «passem bem». Como não foi fornecido o texto grego, esta redação permanece explicitamente provisória e segue criticamente o testemunho inglês disponível.
