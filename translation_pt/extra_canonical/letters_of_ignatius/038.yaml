source:
  text: The Ephesians from Smyrna salute you, from whence also I write to you. They are here with me for the glory of God, as also are ye; and they have comforted me in all things, together with Polycarp bishop of the Smyrnaeans. Yea, and all the other churches salute you in the honor of Jesus Christ. Fare ye well in godly concord, and possess ye a steadfast spirit, which is Jesus Christ.
