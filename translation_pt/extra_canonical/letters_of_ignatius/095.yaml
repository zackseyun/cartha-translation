base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/095.yaml
  text: 'Flee evil arts—or rather, hold discourse about these. Tell my sisters to love the Lord and to be content with their husbands in flesh and in spirit. In like manner also charge my brothers in the name of Jesus Christ to love their wives, as the Lord loved the Church.


    If anyone is able to abide in chastity to the honor of the flesh of the Lord, let him so abide without boasting. If he boasts, he is lost; and if it becomes known beyond the bishop, he is polluted. It becometh men and women too, when they marry, to unite themselves with the consent of the bishop, that the marriage may be after the Lord and not after concupiscence. Let all things be done to the honor of God.'
translation:
  language: pt
  text: 'Fuja das práticas más — ou melhor, fale sobre elas. Diga às minhas irmãs que amem o Senhor e se contentem com seus maridos, na carne e no espírito. Do mesmo modo, exorte também os meus irmãos, em nome de Jesus Cristo, a amar suas esposas, assim como o Senhor amou a Igreja.


    Se alguém é capaz de permanecer em castidade[a] para honra da carne do Senhor, permaneça assim, sem se vangloriar. Se ele se vangloriar, está perdido; e, se isso chegar ao conhecimento de alguém além do bispo,[b] está corrompido. Convém também que homens e mulheres, quando se casam, se unam com o consentimento do bispo, para que o casamento seja segundo o Senhor, e não segundo a concupiscência.[c] Que tudo seja feito para a honra de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aqui, “castidade” provavelmente se refere a permanecer sem se casar, em continência; o termo também pode ter um sentido moral mais amplo.
    reason: Esclarece o uso contextual sem substituir a amplitude lexical no texto principal.
  - marker: b
    text: 'Literalmente, “exceto o bispo”. A expressão parece delimitar quem pode tomar conhecimento do assunto: não alguém além do bispo. O referente exato de “isso” permanece expresso de modo geral, como no original.'
    reason: Esclarece a função de πλην (“exceto”) e preserva a indeterminação sintática do referente.
  - marker: c
    text: Isto é, não governado pelo desejo carnal desordenado.
    reason: Explica em linguagem atual o sentido moral de “concupiscência” sem enfraquecer o contraste do texto.
lexical_decisions:
- source_word: evil arts (Greek source review pending; witness reflects κακοτεχνίαι)
  choice: práticas perversas
  rationale: Evita a associação moderna e estreita de “artes malignas” com magia, preservando o sentido amplo de expedientes, práticas ou artimanhas moralmente maus.
- source_word: be content with
  choice: se contentem com
  rationale: Mantém de perto o testemunho disponível e expressa fidelidade e satisfação no vínculo conjugal sem acrescentar uma noção não explícita de submissão.
- source_word: chastity
  choice: castidade
  rationale: Preserva o termo histórico e sua amplitude; uma nota esclarece que, neste contexto, ele provavelmente aponta para a continência ou o celibato.
- source_word: flesh of the Lord
  choice: carne do Senhor
  rationale: Mantém a formulação cristológica concreta e potencialmente tensa, sem substituí-la por uma paráfrase doutrinária como “encarnação”.
- source_word: concupiscence
  choice: concupiscência
  rationale: Conserva o contraste moral tradicional com um casamento “segundo o Senhor”; a nota oferece uma explicação em linguagem atual.
- source_word: polluted
  choice: corrompido
  rationale: Reproduz a gravidade moral do testemunho inglês sem restringir o sentido à impureza ritual.
theological_decisions:
- issue: A castidade em relação ao casamento
  choice: Manter “castidade” e esclarecer contextualmente em nota
  alternative: Traduzir diretamente como “celibato”
  rationale: A passagem distingue quem permanece casto de homens e mulheres que se casam, mas o termo pode ter alcance mais amplo; a redação não transforma uma provável aplicação em definição absoluta.
- issue: “Para honra da carne do Senhor”
  choice: Preservar literalmente a expressão
  alternative: Parafrasear como “em honra da encarnação do Senhor”
  rationale: A paráfrase resolveria a relação teológica entre a continência e a carne de Cristo de modo mais específico do que permite o testemunho.
- issue: Consentimento do bispo no casamento
  choice: Traduzir como orientação explícita do texto, sem explicar seu mecanismo
  alternative: Converter em exigência sacramental ou mero conselho pastoral
  rationale: O texto afirma a participação ou anuência episcopal, mas não define aqui sua forma jurídica, sacramental ou litúrgica.
- issue: Conhecimento “para além do bispo”
  choice: Manter a formulação difícil e assinalá-la em nota
  alternative: Interpretar como “ser estimado acima do bispo” ou “tornar-se conhecido por mais pessoas que o bispo”
  rationale: O testemunho fornecido adota “known beyond the bishop”, mas a expressão subjacente é notoriamente difícil; não se deve eliminar a ambiguidade antes da revisão grega direta.
translation_notes:
  register: Português contemporâneo, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se “carne do Senhor”, “castidade”, “concupiscência” e “consentimento do bispo” por sua importância histórica e teológica. A tradução é provisória porque o material fornecido declara pendente a revisão direta da tradição manuscrita grega; a testemunha inglesa pública foi tratada como camada de consulta, e a ambiguidade mais relevante foi explicitada em nota.
