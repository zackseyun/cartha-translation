review_pass:
  verdict: revise
  source_fidelity: A revisão do grego da recensão média confirma, em linhas gerais, o sentido do rascunho. Contudo, πλην τοῦ ἐπισκόπου significa mais diretamente “exceto o bispo” / “por alguém além do bispo”, não “para além do bispo” no sentido espacial ou comparativo. A redação foi ajustada para conservar essa delimitação e a construção impessoal do original.
  naturalness: Foram modernizados imperativos isolados (“Foge”, “Dize”) para “Fuja” e “Diga”, mantendo tratamento coerente e registro digno. “Fale sobre elas” é mais natural do que “conversa a respeito dessas coisas”, sem alteração de sentido.
  terminology: Mantêm-se “castidade”, “carne do Senhor”, “bispo” e “concupiscência”, termos importantes e adequados ao caráter histórico-teológico do texto. “Práticas más” comunica κακοτεχνίαι sem restringi-lo indevidamente a magia.
  issues:
  - severity: medium
    issue: “Para além do bispo” não traduz com precisão πλην τοῦ ἐπισκόπου.
    rationale: 'πλήν introduz uma exceção: o conhecimento não deve estender-se a ninguém exceto ao bispo. “Além do bispo” preserva parte da ideia, mas é menos claro em português e a nota propõe uma alternativa comparativa sem base no sentido mais direto da expressão.'
  - severity: low
    issue: Oscilação de registro nos imperativos (“Foge”, “Dize”) em texto voltado ao português contemporâneo.
    rationale: “Fuja” e “Diga” são formas amplamente internacionais e mais naturais para a leitura brasileira, mantendo o singular dirigido a Policarpo.
  - severity: low
    issue: A nota b caracteriza a expressão como ambiguidade semântica mais ampla do que a sustentada pelo grego disponível.
    rationale: A construção grega é suficientemente clara quanto à exceção do bispo; a dificuldade está no referente exato do que se torna conhecido, que pode permanecer expresso de forma impessoal.
