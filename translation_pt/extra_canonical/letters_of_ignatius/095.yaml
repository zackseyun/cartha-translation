review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de modo geral a testemunha inglesa e preserva adequadamente as formulações historicamente importantes, incluindo «carne do Senhor», «castidade» e a anuência do bispo. Há, porém, pequenos ajustes seguros: o aoristo em «está perdido» não deve ser deslocado para o futuro («estará perdido»), e a referência na cláusula difícil sobre ser conhecido «além do bispo» não deve ser alterada para o demonstrativo neutro «isso». A ambiguidade dessa cláusula continua devidamente marcada em nota.'
  naturalness: O registro é majoritariamente claro, mas «Dize» destoa do português contemporâneo pretendido, e «conversa a respeito dessas coisas» é menos idiomático do que «fala sobre elas» neste imperativo. «Diz» e «fala» mantêm o tom direto e digno com melhor legibilidade internacional e brasileira.
  terminology: «Práticas perversas», «castidade», «carne do Senhor», «concupiscência» e «consentimento do bispo» são escolhas aceitáveis. Mantém-se «concupiscência», com nota explicativa, e não se infere uma estrutura sacramental específica a partir do consentimento episcopal.
  issues:
  - severity: medium
    issue: Tempo/aspecto em «estará perdido»
    rationale: A testemunha diz «he is lost», refletindo um aoristo de resultado consumado. «Está perdido» comunica melhor o valor da afirmação do que o futuro «estará perdido».
  - severity: medium
    issue: Referente alterado em «se isso se tornar conhecido»
    rationale: A formulação difícil da testemunha é «if it becomes known beyond the bishop»; no contexto, a cláusula se liga à pessoa e/ou à sua pretensão de castidade, não a um «isso» autonomizado. «Se ele vier a ser conhecido além do bispo» preserva a dificuldade sem introduzir um referente neutro.
  - severity: low
    issue: Registro levemente arcaizante e construção pouco natural
    rationale: «Dize» e «conversa a respeito dessas coisas» podem ser atualizados para «Diz» e «fala sobre elas», sem perda de sentido nem de solenidade.
  revised_text: 'Foge das práticas perversas — ou melhor, fala sobre elas. Diz às minhas irmãs que amem o Senhor e se contentem com seus maridos, na carne e no espírito. Do mesmo modo, exorta também os meus irmãos, em nome de Jesus Cristo, a amar suas esposas, assim como o Senhor amou a Igreja.


    Se alguém é capaz de permanecer em castidade[a] para a honra da carne do Senhor, permaneça assim, sem se vangloriar. Se ele se vangloriar, está perdido; e, se ele vier a ser conhecido além do bispo,[b] ficará corrompido. Convém que homens e mulheres, ao se casarem, se unam com o consentimento do bispo, para que o casamento seja segundo o Senhor, e não segundo a concupiscência.[c] Que tudo seja feito para a honra de Deus.'
  revised_footnotes:
  - marker: a
    text: Aqui, «castidade» provavelmente se refere a permanecer sem se casar, em continência; o termo também pode ter um sentido moral mais amplo.
    reason: Esclarece o uso contextual sem substituir a amplitude lexical no texto principal.
  - marker: b
    text: A expressão traduzida por «ser conhecido além do bispo» é difícil e admite outras interpretações; entre elas, «ser tido em maior conta que o bispo». A redação permanece provisória até a revisão direta do grego.
    reason: Preserva a incerteza textual e semântica, sem escolher silenciosamente uma interpretação.
  - marker: c
    text: Isto é, não governado pelo desejo carnal desordenado.
    reason: Explica em linguagem atual o sentido moral de «concupiscência» sem enfraquecer o contraste do texto.
