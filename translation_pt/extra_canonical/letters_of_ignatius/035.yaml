base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/035.yaml
  text: May I have joy in you in all things, if I am worthy. For even though I am in chains, I am not comparable to any one of you who are free. I know that you are not puffed up, for you have Jesus Christ within you. And when I praise you, I know that you only feel all the more ashamed, as it is written, “The righteous person accuses himself.”
translation:
  language: pt
  text: 'Que eu possa alegrar-me com vocês em todas as coisas, se eu for digno. Pois, embora esteja algemado, não sou comparável sequer a um de vocês que estão livres. Sei que vocês não se enchem de orgulho, pois têm Jesus Cristo em vocês mesmos. E, quando os elogio, sei que vocês se envergonham ainda mais, como está escrito: “O justo acusa a si mesmo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citação da abertura de Provérbios 18:17 na Septuaginta (LXX). O provérbio continua além das palavras citadas aqui.
    reason: Identifica a fonte da citação e esclarece que Inácio cita apenas sua primeira parte.
lexical_decisions:
- source_word: have joy of you
  choice: tenha alegria em vocês
  rationale: Mantém a formulação relacional do testemunho sem reduzi-la a simples satisfação ou orgulho.
- source_word: in bonds
  choice: acorrentado
  rationale: Expressa de modo natural e concreto a condição de prisioneiro indicada pelo testemunho.
- source_word: at liberty
  choice: estão livres
  rationale: Preserva o contraste direto entre a prisão de Inácio e a liberdade dos destinatários.
- source_word: puffed up
  choice: cheios de orgulho
  rationale: Comunica em português atual a imagem idiomática de arrogância ou presunção.
- source_word: in yourselves
  choice: dentro de si
  rationale: Preserva a afirmação de presença interior de Jesus Cristo sem explicar além do texto.
- source_word: self-accuser
  choice: acusa a si mesmo
  rationale: Mantém o sentido reflexivo e judicial da formulação citada, sem suavizá-la para 'reconhece as próprias faltas'.
theological_decisions:
- issue: Presença de Jesus Cristo nos destinatários
  choice: têm Jesus Cristo dentro de si
  alternative: Jesus Cristo habita em vocês
  rationale: A opção escolhida segue mais de perto o testemunho fornecido e evita transformar a formulação em terminologia teológica mais desenvolvida.
- issue: A autodeclaração do justo
  choice: O justo acusa a si mesmo
  alternative: O justo é seu próprio acusador
  rationale: Conserva a tensão da máxima e não a interpreta como mera humildade, confissão ou exame de consciência.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. Tradução provisória fundamentada no testemunho inglês público fornecido; é necessária revisão direta da tradição manuscrita grega da recensão média.
