revisions:
- from: 'Que eu tenha alegria em vocês em todas as coisas, se é que sou digno disso. Pois, embora esteja acorrentado, não sou comparável a nenhum de vocês, que estão livres. Sei que vocês não estão cheios de orgulho, pois têm Jesus Cristo dentro de si. E, quando os elogio, sei que vocês se sentem ainda mais envergonhados, como está escrito: “O justo acusa a si mesmo.”[a]'
  to: 'Que eu possa alegrar-me com vocês em todas as coisas, se eu for digno. Pois, embora esteja algemado, não sou comparável sequer a um de vocês que estão livres. Sei que vocês não se enchem de orgulho, pois têm Jesus Cristo em vocês mesmos. E, quando os elogio, sei que vocês se envergonham ainda mais, como está escrito: “O justo acusa a si mesmo.”[a]'
  rationale: 'A revisão melhora a idiomaticidade e ajusta pormenores de precisão: a construção inicial passa a expressar um desejo natural em português; “sequer a um” conserva a força comparativa do grego; e “em vocês mesmos” preserva a referência interior com concordância pronominal. A nota é atualizada para a identificação verificável da alusão a Provérbios na LXX, sem alegar mais do que o texto cita.'
