    Portanto, evitem os maus artifícios e as tramas do príncipe deste mundo, para que não sejam esmagados por suas maquinações e enfraqueçam no amor. Reúnam-se, porém, todos vocês, com um coração indiviso. E


    Dou graças ao meu Deus porque tenho a consciência tranquila no meu trato com vocês. Ninguém pode alegar, em segredo ou em público, que fui um peso para alguém, seja em coisas pequenas, seja em grandes. Sim, e, por todos aqueles entre os quais falei, oro para que não transformem isso em testemunho contra si mesmos.'
