base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/070.yaml
  text: 'But if anyone teaches Judaism to you, do not listen to him. For it is better to hear Christianity from a circumcised man than Judaism from an uncircumcised man. But if either one does not speak concerning Jesus Christ, I regard them as tombstones and graves of the dead, on which only the names of men are inscribed.


    Therefore shun the wicked arts and plots of the prince of this world, lest you perhaps be crushed by his schemes and grow weak in your love. But gather together, all of you, with an undivided heart. And


    I thank my God that I have a good conscience in my dealings with you. No one can boast, either secretly or openly, that I was a burden to anyone in small things or great. Yes, and for all among whom I spoke, I pray that they may not turn it into a testimony against themselves.'
translation:
  language: pt
  text: 'Mas, se alguém lhes ensinar o judaísmo, não lhe deem ouvidos. Pois é melhor ouvir o cristianismo de um homem circuncidado do que o judaísmo de um incircunciso. Mas, se um ou outro não falar a respeito de Jesus Cristo, considero-os pedras tumulares e sepulturas dos mortos, nas quais estão inscritos apenas nomes de homens.


    Portanto, evitem os maus artifícios e as tramas do príncipe deste mundo, para que não sejam esmagados por suas maquinações e enfraqueçam no amor. Reúnam-se, porém, todos vocês, com um coração indiviso. E


    Dou graças ao meu Deus porque tenho a consciência tranquila no meu trato com vocês. Ninguém pode alegar, em segredo ou em público, que fui um peso para alguém, seja em coisas pequenas, seja em grandes. Sim, e, por todos aqueles entre os quais falei, oro para que não transformem isso em testemunho contra si mesmos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Judaism
  choice: judaísmo
  rationale: Preserva o contraste histórico e religioso explícito do testemunho, sem ampliá-lo para uma referência étnica ao povo judeu.
- source_word: Christianity
  choice: cristianismo
  rationale: Mantém o paralelismo nominal com “judaísmo” e a formulação do testemunho antigo.
- source_word: circumcised / uncircumcised
  choice: homem circuncidado / incircunciso
  rationale: Conserva a oposição retórica e concreta do texto, usando formas naturais em português.
- source_word: tombstones and graves of the dead
  choice: pedras tumulares e sepulturas de mortos
  rationale: Retém as duas imagens funerárias distintas e sua força polêmica.
- source_word: prince of this world
  choice: príncipe deste mundo
  rationale: Preserva a expressão teológica tradicional sem identificar além do que o texto afirma.
- source_word: undivided heart
  choice: coração indiviso
  rationale: Mantém a metáfora antiga de unidade interior e comunitária em registro digno e inteligível.
- source_word: burdensome
  choice: fui um peso
  rationale: Expressa de modo natural a ideia de impor encargo material ou pessoal, sem especificar qual.
theological_decisions:
- issue: Alcance da crítica ao judaísmo
  choice: Manter “judaísmo” como o ensino proposto aos destinatários
  alternative: Reformular como crítica geral aos judeus ou à identidade judaica
  rationale: O trecho censura a mensagem ensinada quando dissociada de Jesus Cristo; não autoriza ampliar a censura para um povo inteiro.
- issue: Identidade do “príncipe deste mundo”
  choice: Preservar o título sem explicação no corpo do texto
  alternative: Traduzir explicitamente como “Satanás” ou “o diabo”
  rationale: A expressão é teologicamente sugestiva, mas o testemunho fornecido não explicita a identidade; a tradução preserva essa formulação.
- issue: Referente plural em “considero-os”
  choice: Usar plural para abranger ambos os tipos de pessoa mencionados
  alternative: Usar singular genérico
  rationale: O testemunho passa de “um ou outro” a uma avaliação que alcança ambos quando não falam de Jesus Cristo.
- issue: “Testemunho contra si mesmos”
  choice: Preservar a linguagem judicial e sua ambiguidade
  alternative: Explicar como condenação final ou acusação específica
  rationale: O texto não define a natureza nem o momento desse testemunho, portanto a tradução não o resolve.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com registro digno. A tradução é necessariamente provisória porque a revisão direta do grego ainda está pendente e o material fornecido é um testemunho inglês de domínio público. O “E” abrupto ao fim do segundo parágrafo foi preservado deliberadamente, conforme o testemunho e a nota editorial fornecidos.
