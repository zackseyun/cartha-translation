review_pass:
  verdict: revise
  source_fidelity: A revisão requer correções seguras. «Alcançou paz por meio das orações» transforma uma referência às orações em causa explícita e troca o estado de estar em paz por um evento de alcançar paz. Além disso, o destinatário imediato das ordens é Policarpo (singular), e a formulação relativa ao eleito deve conservar esse enquadramento. «Dedicação do amor» também inverte e enfraquece a expressão «amor zeloso». No último parágrafo, «dedica seu tempo» segue literalmente o testemunho inglês, mas «dedica-se a Deus» comunica de modo mais natural o sentido de disponibilidade/devotamento expresso pelo verbo subjacente, sem introduzir interpretação doutrinária.
  naturalness: O registro é geralmente claro e digno. «Benditíssimo» é menos natural em português moderno e pode sugerir um título devocional posterior; «muito abençoado» é mais transparente. «Conselho piedoso» e «amor zeloso» são compreensíveis no registro epistolar antigo. A revisão mantém o singular para Policarpo e o plural para a comunidade.
  terminology: Mantêm-se «intercessão», «graça divina», «discípulo» e «mensageiro de Deus». «Mensageiro de Deus» continua uma solução apropriada para a metáfora/título de um enviado; não se deve especificar uma função eclesiástica técnica. «Chegar a Deus» preserva a formulação intensa, sem a reduzir a martírio ou salvação.
  issues:
  - severity: medium
    issue: Relação entre a paz da igreja e as orações
    rationale: «Alcançou paz por meio das orações de vocês» apresenta as orações como causa direta e «alcançou» como mudança concluída. O testemunho apenas vincula a notícia da paz às orações; a redação revista evita explicitar causalidade.
  - severity: medium
    issue: Pessoa gramatical e referente na ordem a Policarpo
    rationale: O apelo é dirigido a Policarpo no singular. «Entre vocês» e «lhes seja» deslocam sem necessidade a escolha para a comunidade; a revisão preserva que Policarpo convoque e escolha alguém que lhe seja querido.
  - severity: low
    issue: «Dedicação do amor de vocês»
    rationale: A expressão reordena «zealous love» e torna o zelo uma dedicação abstrata. «Amor zeloso» conserva os dois elementos de modo direto.
  - severity: low
    issue: «Dedica seu tempo a Deus»
    rationale: Embora espelhe a tradução inglesa, é restritivo e pouco idiomático em português. «Dedica-se a Deus» preserva a entrega/disponibilidade a Deus sem limitar o sentido a tempo cronológico.
  revised_text: 'Visto que, conforme me foi informado nas orações de vocês, a igreja de Antioquia da Síria está em paz, eu também fiquei ainda mais consolado, livre de preocupação por Deus — se, por meio do sofrimento, eu conseguir chegar a Deus, para que, pela intercessão de vocês, eu seja reconhecido como discípulo.



    Convém a você, muito abençoado Policarpo, convocar um conselho piedoso e escolher alguém que lhe seja muito querido e também zeloso, alguém que seja digno de ser chamado mensageiro de Deus. Designe-o, digo, para que vá à Síria e glorifique o amor zeloso de vocês para a glória de Deus.



    O cristão não dispõe de si mesmo, mas dedica-se a Deus. Esta é obra de Deus e também de vocês, quando a levarem a termo; pois confio na graça divina que vocês estão prontos para uma boa obra digna de Deus. Conhecendo o ardor da sinceridade de vocês, eu os exortei em uma breve carta.'
  revised_footnotes: []
  revision_rationale: A revisão elimina uma causalidade não expressa, restaura a referência singular a Policarpo no segundo parágrafo, conserva a combinação «amor zeloso» e substitui um literalismo pouco natural por uma formulação portuguesa que mantém o sentido de devotamento a Deus. A construção «conforme me foi informado nas orações de vocês» é deliberadamente cautelosa, pois a relação sintática exata da expressão referente às orações exige confirmação final na tradição grega; ela não afirma que as orações tenham produzido a paz.
