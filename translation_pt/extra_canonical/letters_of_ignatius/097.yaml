base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/097.yaml
  text: 'Seeing that the church in Antioch of Syria has peace, as it has been reported to me, through your prayers, I myself also have been the more comforted, since God has banished my care—if indeed through suffering I may attain to God, so that through your intercession I may be found to be a disciple.


    It is fitting for you, most blessed Polycarp, to call together a godly council and choose someone among you who is very dear to you and also zealous, who will be fit to bear the name of God’s courier. Appoint him, I say, so that he may go to Syria and glorify your zealous love to the glory of God.


    A Christian has no authority over himself but gives his time to God. This is God’s work, and yours also, when you shall complete it; for I trust in the divine grace that you are ready for an act of well doing worthy of God. Knowing the fervor of your sincerity, I have exhorted you in a short letter.'
translation:
  language: pt
  text: 'Visto que, conforme me informaram, a igreja que está em Antioquia da Síria alcançou paz por meio das orações de vocês, eu também fiquei ainda mais consolado, pois Deus afastou minha preocupação — se é que, por meio do sofrimento, conseguirei chegar a Deus, para que, pela intercessão de vocês, eu seja reconhecido como discípulo.


    Convém a você, benditíssimo Policarpo, reunir um conselho que honre a Deus e escolher entre vocês alguém que lhes seja muito querido e que também seja zeloso, alguém apto a receber o título de mensageiro de Deus. Designe-o, digo, para que vá à Síria e, para a glória de Deus, torne conhecida a dedicação do amor de vocês.


    O cristão não dispõe de si mesmo, mas dedica seu tempo a Deus. Esta obra é de Deus e também de vocês, quando a levarem a termo; pois confio na graça divina que vocês estão prontos para praticar uma boa obra digna de Deus. Conhecendo o ardor da sinceridade de vocês, escrevi-lhes esta breve exortação.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hath peace
  choice: alcançou paz
  rationale: Expressa em português corrente a nova condição de paz da igreja, sem especificar a natureza dessa paz além do testemunho disponível.
- source_word: attain unto God
  choice: chegar a Deus
  rationale: Preserva a formulação teologicamente intensa e sua ligação com o sofrimento, sem explicá-la como morte, martírio ou salvação.
- source_word: godly council
  choice: um conselho que honre a Deus
  rationale: Evita o sentido moderno de órgão administrativo fixo e comunica uma deliberação ou reunião condizente com Deus.
- source_word: God's courier
  choice: mensageiro de Deus
  rationale: Mantém a função de enviado portador de notícias, em linguagem natural e digna; 'correio de Deus' seria pouco idiomático em português atual.
- source_word: has no authority over himself
  choice: não dispõe de si mesmo
  rationale: Comunica ausência de domínio autônomo sobre a própria vida sem sugerir especificamente autoridade eclesiástica ou civil.
- source_word: giveth his time to God
  choice: dedica seu tempo a Deus
  rationale: Reproduz o sentido do testemunho fornecido de colocar o próprio tempo a serviço de Deus, com formulação corrente.
- source_word: zealous love
  choice: a dedicação do amor de vocês
  rationale: Conserva a combinação de amor e zelo sem produzir a expressão pouco natural 'amor zeloso'.
theological_decisions:
- issue: Chegar a Deus por meio do sofrimento
  choice: Manter a afirmação sem explicação adicional
  alternative: Explicitar 'chegar a Deus pelo martírio'
  rationale: O testemunho fala em sofrimento e em chegar a Deus, mas não explicita aqui a interpretação; a tradução preserva essa tensão.
- issue: Intercessão da comunidade e reconhecimento como discípulo
  choice: Preservar a relação expressa entre intercessão e ser reconhecido como discípulo
  alternative: Enfraquecer para mero encorajamento humano
  rationale: A relação está presente no testemunho e não deve ser eliminada nem convertida numa formulação doutrinária mais definida.
- issue: A obra pertence a Deus e à comunidade
  choice: Manter a dupla atribuição da obra
  alternative: Atribuir a obra exclusivamente a Deus ou exclusivamente aos destinatários
  rationale: A formulação mantém lado a lado a ação divina e a responsabilidade humana, como no testemunho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se as alternâncias entre o singular dirigido a Policarpo ('você') e o plural dirigido à comunidade ('vocês'). O texto fornecido como base é um testemunho inglês de domínio público; como a revisão direta do grego ainda está pendente, escolhas lexicais especialmente sensíveis — como 'mensageiro de Deus' e 'dedica seu tempo' — devem ser verificadas contra a tradição manuscrita grega antes da publicação definitiva.
