base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/003.yaml
  text: 'Regarding my fellow servant Burrhus, who by the will of God is your deacon, blessed in every way, I ask that he may remain with me, to the honor of both you and your bishop. And Crocus also, who is worthy of God and of you, whom I received as an example of the love you bear me, has relieved me in every way. In the same way, may the Father of Jesus Christ refresh him, together with Onesimus, Burrhus, Euplus, and Fronto. In them I saw you all with the eyes of love.


    May I always have joy in you, if indeed I am worthy of it. Therefore, it is fitting for you in every way to glorify Jesus Christ, who glorified you, so that, being perfectly joined together in one submission and submitting yourselves to your bishop and presbytery, you may be sanctified in all things.'
translation:
  language: pt
  text: 'Quanto a Burro, meu conservo, que, pela vontade de Deus, é o diácono de vocês, abençoado em tudo, peço que ele permaneça comigo, para honra de vocês e do bispo de vocês. Também Croco, digno de Deus e de vocês, a quem recebi como exemplo do amor que vocês têm por mim, trouxe-me alívio em tudo. Do mesmo modo, que o Pai de Jesus Cristo lhe conceda alívio, juntamente com Onésimo, Burro, Euplo e Frontão. Neles vi todos vocês com os olhos do amor.



    Que eu sempre me alegre com vocês, se de fato sou digno disso. Portanto, convém que vocês glorifiquem Jesus Cristo em tudo, ele que glorificou vocês, para que, perfeitamente unidos em uma só submissão e submetendo-se ao bispo e ao presbitério de vocês, sejam santificados em tudo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fellow servant
  choice: companheiro de serviço
  rationale: Mantém a ideia de serviço compartilhado sem introduzir uma categoria eclesiástica mais específica do que permite a testemunha disponível.
- source_word: deacon
  choice: diácono
  rationale: Emprega o termo eclesiástico tradicional e amplamente compreendido em português.
- source_word: refresh / relieved
  choice: reanime / trouxe-me alívio
  rationale: Preserva a relação semântica entre o auxílio recebido por Inácio e a bênção que ele deseja para Croco, com formulação natural em português.
- source_word: presbytery
  choice: conselho de presbíteros
  rationale: Indica o corpo coletivo de presbíteros e evita que “presbitério” seja entendido apenas como espaço físico.
- source_word: with the eyes of love
  choice: com os olhos do amor
  rationale: Conserva a imagem expressiva da testemunha, em vez de reduzi-la a uma paráfrase abstrata.
theological_decisions:
- issue: Relação entre a comunidade, o bispo e o conselho de presbíteros
  choice: “submetendo-se ao bispo e ao conselho de presbíteros de vocês”
  alternative: “obedecendo ao bispo e ao presbitério”
  rationale: “Submetendo-se” preserva a repetição e a ênfase do texto; “conselho de presbíteros” torna explícito o sentido coletivo sem ampliar a estrutura eclesiológica além da testemunha.
- issue: Finalidade da união e submissão
  choice: “para que... sejam santificados em tudo”
  alternative: “a fim de serem completamente santificados”
  rationale: Mantém a construção final e a amplitude potencial de “em tudo”, sem decidir se ela descreve extensão, integralidade ou ambos.
- issue: Jesus Cristo glorifica a comunidade
  choice: “Jesus Cristo, que glorificou vocês”
  alternative: “Jesus Cristo, por quem vocês foram glorificados”
  rationale: Conserva a agência direta atribuída a Jesus Cristo na testemunha fornecida e evita reformulação teológica desnecessária.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês”. Como a revisão direta do grego da recensão média ainda está pendente, o texto segue cautelosamente a testemunha inglesa pública e a camada inglesa auditada, sem acrescentar notas conjecturais nem ocultar a natureza coletiva de “presbytery”.
