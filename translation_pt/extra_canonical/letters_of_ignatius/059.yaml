  source_fidelity: 'A tradução conserva muito bem a progressão retórica, as imagens de limite cósmico, nascimento, luz e martírio, bem como as ambiguidades deliberadas. Uma pequena correção é indicada: a tradição grega da recensão média traz a ordem «Cristo Jesus» em «morrer por Cristo Jesus», ao passo que o testemunho inglês inverte os nomes. A formulação «não queiram que eu morra» também reproduz mais diretamente a construção grega sem alterar o paradoxo do trecho.'
  naturalness: O português é moderno, fluente e de registro elevado sem arcaísmo. «Tenham paciência comigo», «Deixem-me receber a luz pura» e «então serei homem» são claros e preservam o tom urgente. A revisão proposta melhora a precisão de «não desejem a minha morte» sem reduzir a naturalidade.
  terminology: «Meu Deus», «ressuscitou», «luz pura» e «sofrimentos» são escolhas sóbrias e semanticamente adequadas. Mantém-se «sofrimentos» para πάθος, evitando impor ao texto uma elaboração devocional ligada a «Paixão». Conservam-se os colchetes e a nota para o segmento textualmente assinalado no testemunho de base.
  issues:
