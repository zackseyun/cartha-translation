base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/059.yaml
  text: 'The farthest reaches of the universe will profit me nothing, nor will the kingdoms of this world. It is good for me to die for Jesus Christ rather than to reign over the farthest reaches of the earth. Him I seek, who died on our behalf; Him I desire, who rose again [for our sake].


    The pangs of a new birth are upon me. Bear with me, brethren. Do not hinder me from living; do not desire my death. Do not give to the world one who desires to be God’s, nor entice him with material things. Allow me to receive the pure light. When I have arrived there, then I will be a man.


    Permit me to be an imitator of the passion of my God. If anyone has Him within himself, let him understand what I desire and have fellow-feeling with me, for he knows the things that constrain me.'
translation:
  language: pt
  text: 'Os confins mais distantes do universo de nada me servirão, nem os reinos deste mundo. É bom para mim morrer por Cristo Jesus, em vez de reinar sobre os confins mais distantes da terra. Busco aquele que morreu em nosso favor; desejo aquele que ressuscitou [por nossa causa].[a]



    As dores de um novo nascimento estão sobre mim. Tenham paciência comigo, irmãos. Não me impeçam de viver; não queiram que eu morra. Não entreguem ao mundo aquele que deseja pertencer a Deus, nem o seduzam com coisas materiais. Deixem-me receber a luz pura. Quando eu chegar lá, então serei homem.



    Permitam-me imitar os sofrimentos do meu Deus. Se alguém o tem dentro de si, que compreenda o que desejo e se compadeça de mim, pois conhece as coisas que me afligem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “por nossa causa” aparecem entre colchetes no testemunho utilizado, indicando uma restauração ou incerteza textual.
    reason: Preservar de modo transparente o sinal editorial presente na fonte fornecida.
lexical_decisions:
- source_word: the farthest bounds of the universe
  choice: os confins mais distantes do universo
  rationale: Mantém a imagem espacial e cósmica do testemunho sem recorrer a linguagem arcaica.
- source_word: shall profit me nothing
  choice: de nada me servirão
  rationale: Expressão portuguesa natural que preserva a ideia de completa ausência de proveito.
- source_word: the pangs of a new birth
  choice: as dores de um novo nascimento
  rationale: Conserva a metáfora de parto e nascimento sem explicá-la além do testemunho disponível.
- source_word: Bestow not on the world
  choice: Não entreguem ao mundo
  rationale: Reproduz a ideia de dar ou ceder alguém ao mundo em português corrente.
- source_word: material things
  choice: coisas materiais
  rationale: Mantém a amplitude da expressão, sem restringi-la a riqueza ou prazeres específicos.
- source_word: the passion of my God
  choice: os sofrimentos do meu Deus
  rationale: Comunica em linguagem atual o sentido de padecimento, preservando a formulação cristológica marcante 'meu Deus'.
- source_word: the things which straiten me
  choice: as coisas que me afligem
  rationale: Expressa pressão e angústia de modo inteligível, sem especificar indevidamente a natureza dessas circunstâncias.
theological_decisions:
- issue: A morte como passagem para a vida
  choice: Não me impeçam de viver; não desejem a minha morte
  alternative: Não me impeçam de alcançar a vida; não queiram que eu morra
  rationale: Preserva o paradoxo deliberado entre martírio, morte e vida, sem inserir uma explicação teológica no corpo do texto.
- issue: A humanidade alcançada após chegar 'lá'
  choice: então serei homem
  alternative: então serei verdadeiramente homem
  rationale: Evita acrescentar 'verdadeiramente', ausente do testemunho, e conserva a tensão antropológica da declaração.
- issue: A expressão cristológica 'meu Deus'
  choice: os sofrimentos do meu Deus
  alternative: os sofrimentos de Cristo, meu Deus
  rationale: Mantém a identificação enfática tal como recebida, sem explicitação adicional.
- issue: Ressurreição 'por nossa causa'
  choice: ressuscitou [por nossa causa]
  alternative: ressuscitou por nossa causa
  rationale: Conserva os colchetes do testemunho, sinalizando que essas palavras dependem de restauração ou apresentam incerteza textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de leitura natural no Brasil. A tradução foi preparada a partir do testemunho inglês de domínio público fornecido e consultada à luz das informações editoriais disponíveis; a revisão direta da tradição manuscrita grega da recensão média continua pendente. Evitaram-se arcaísmos como “aproveitar-me-ão” e explicações doutrinárias inseridas no texto.
