    issue: Ordem dos nomes em «Jesus Cristo»
    rationale: No texto grego da recensão média, a expressão é «Χριστὸν Ἰησοῦν» (“Cristo Jesus”). A inversão do testemunho inglês não precisa ser seguida quando a forma grega está disponível.
  - severity: low
    issue: Formulação de «não desejem a minha morte»
    rationale: O grego pede literalmente que os destinatários não queiram que ele morra. «Não queiram que eu morra» conserva melhor o paralelismo pessoal com «não me impeçam de viver».
