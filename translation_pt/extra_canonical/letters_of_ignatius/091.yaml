base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/091.yaml
  text: 'I welcome your godly mind, grounded as though on an immovable rock, and I give exceedingly great glory that I have been granted the privilege of seeing your blameless face,


    of which I long to have joy in God. I urge you in the grace with which you are clothed to press forward in your course and to urge everyone that they may be saved. Vindicate your office with all diligence of flesh and spirit. Be concerned for unity, than which there is nothing better. Bear with everyone, just as the Lord also bears with you. Endure everyone in love, as indeed you do.


    Devote yourself to unceasing prayers. Ask for greater wisdom than you have. Be watchful, and keep your spirit from falling asleep. Speak to each person individually after the manner of God. Bear the illnesses of all, like a perfect athlete. Where there is more toil, there is much gain.'
translation:
  language: pt
  text: 'Acolho a sua mente piedosa, firmada como sobre uma rocha inabalável, e dou glória abundantemente por me ter sido concedido ver o seu rosto irrepreensível,


    no qual desejo alegrar-me em Deus. Exorto você, pela graça de que está revestido, a avançar em sua corrida e a exortar todos para que sejam salvos. Defenda a sua função com toda a diligência da carne e do espírito. Cuide da unidade, pois nada é melhor do que ela. Suporte a todos, assim como o Senhor também suporta você. Seja paciente com todos em amor, como de fato já é.


    Dedique-se a orações incessantes. Peça uma sabedoria maior do que a que você tem. Mantenha-se vigilante e não deixe o seu espírito adormecer. Fale a cada pessoa individualmente, à maneira de Deus.[a] Carregue as enfermidades de todos, como um atleta consumado. Onde há mais trabalho, há grande proveito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “de modo digno de Deus”. A expressão é concisa e pode indicar falar de maneira coerente com o caráter ou a vontade de Deus.'
    reason: Preserva a ambiguidade da expressão transmitida pelo testemunho enquanto oferece ao leitor uma alternativa plausível.
lexical_decisions:
- source_word: θεοσεβής / godly
  choice: piedosa
  rationale: Expressa devoção e reverência a Deus em português corrente, sem sugerir uma qualidade divina inerente.
- source_word: ἑδραῖος / grounded
  choice: firmada
  rationale: Conserva a metáfora de estabilidade sobre uma rocha e soa natural em português.
- source_word: τόπος / office
  choice: ministério
  rationale: No contexto da exortação a Policarpo, designa sua responsabilidade e serviço eclesial; evita o sentido moderno de espaço físico de “ofício/escritório”.
- source_word: ἕνωσις / union
  choice: unidade
  rationale: Termo claro e natural para a coesão comunitária pretendida.
- source_word: πάντας βάσταζε / bear all
  choice: Suporte a todos
  rationale: Preserva a ideia de sustentar e tolerar pessoas, reforçada pela comparação com a paciência do Senhor.
- source_word: ἀδιαλείπτοις προσευχαῖς / unceasing prayers
  choice: orações incessantes
  rationale: Mantém a força da continuidade sem tornar a frase artificial.
- source_word: ἀθλητής / athlete
  choice: atleta
  rationale: Preserva a imagem antiga de disciplina, resistência e esforço.
- source_word: κόπος / toil
  choice: trabalho
  rationale: Comunica esforço penoso em linguagem corrente, mantendo a relação proverbial entre esforço e ganho.
theological_decisions:
- issue: Destinatário da glória na frase inicial
  choice: dou imensa glória a Deus
  alternative: dou imensa glória
  rationale: O testemunho inglês deixa o complemento implícito, mas a expressão idiomática cristã pressupõe que a glória seja dada a Deus. A explicitação torna o português inteligível sem atribuir glória a Policarpo.
- issue: Linguagem de salvação
  choice: exortar todos para que sejam salvos
  alternative: exortar todos, a fim de salvá-los
  rationale: Preserva a formulação passiva e evita atribuir diretamente ao ministro o poder de salvar.
- issue: Corpo e espírito
  choice: diligência do corpo e do espírito
  alternative: diligência da carne e do espírito
  rationale: “Corpo” comunica aqui a dimensão concreta e exterior do serviço sem introduzir indevidamente o sentido paulino negativo que “carne” pode sugerir ao leitor moderno.
- issue: Expressão normativa sobre falar individualmente
  choice: segundo a maneira de Deus
  alternative: de modo semelhante a Deus
  rationale: Mantém a formulação incomum e sua abertura sem definir se ela indica caráter, vontade, sabedoria ou acomodação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “você” para o singular, acompanhando o tratamento direto e pessoal do texto. A quebra de parágrafo após “rosto irrepreensível” foi mantida conforme o testemunho fornecido. Como a revisão direta do grego ainda está pendente, as decisões foram feitas com cautela a partir do testemunho inglês público e da camada inglesa auditada; a formulação não deve ser tratada como substituta de uma futura conferência integral da tradição grega.
