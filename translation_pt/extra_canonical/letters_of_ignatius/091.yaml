review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a sequência exortativa e as imagens principais. Contudo, «a Deus» introduz um destinatário que não está expresso na frase transmitida; «corpo» neutraliza a oposição deliberada «carne e espírito»; e «ministério» especifica o sentido institucional de τόπος mais do que o texto exige.
  naturalness: O português é em geral claro e digno. «Muito ganho» soa pouco idiomático neste registro; «grande proveito» é mais natural. «Atleta consumado» comunica melhor a ideia de um atleta plenamente preparado do que «atleta perfeito».
  terminology: «Unidade», «orações incessantes», «enfermidades» e «salvos» são escolhas adequadas. «Função» mantém a referência à responsabilidade/cargo do destinatário sem impor a leitura eclesiástica mais estreita de «ministério». «Carne e espírito» deve ser mantido como par tradicional e como reflexo do contraste da fonte.
  issues:
  - severity: medium
    issue: Explicitação de «a Deus» em «dou imensa glória a Deus»
    rationale: O destinatário da glorificação não é expresso no testemunho apresentado. Embora Deus seja uma inferência contextual plausível, a tradução não deve transformá-la em complemento explícito.
  - severity: medium
    issue: «corpo e espírito» por «carne e espírito»
    rationale: A fonte distingue σάρξ e πνεῦμα. «Corpo» reduz a correspondência lexical e evita interpretativamente uma expressão que deve permanecer no texto, sem que isso imponha uma doutrina específica.
  - severity: low
    issue: «ministério» para «office/tóπος»
    rationale: «Ministério» é possível no contexto, mas torna explícita uma leitura eclesiástica. «Função» preserva de modo mais aberto a responsabilidade ou posição confiada ao destinatário.
  - severity: low
    issue: Formulações finais pouco naturais
    rationale: «Atleta perfeito» e «muito ganho» são compreensíveis, mas «atleta consumado» e «grande proveito» soam mais naturais e preservam a metáfora de competência e a relação entre esforço e benefício.
