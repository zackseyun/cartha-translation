base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/089.yaml
  text: 'I greet the households of my brothers, with their wives and children, and the virgins who are called widows. I bid you farewell in the power of the Father. Philo, who is with me, greets you.


    I greet the household of Tavia, and I pray that she may be grounded in faith and love, both of flesh and of spirit. I greet Alce, a name very dear to me, and the incomparable Daphnus, and Eutecnus, and all by name. Farewell in the grace of God.'
translation:
  language: pt
  text: 'Saúdo as famílias de meus irmãos, com suas mulheres e seus filhos, e as virgens chamadas viúvas.[a] Que vocês estejam bem no poder do Pai. Fílon, que está comigo, envia saudações.


    Saúdo a família de Távia e oro para que ela seja firmada na fé e no amor, tanto da carne como do espírito.[b] Saúdo Alce, nome que me é muito querido, o incomparável Dafno, Eutecno e todos, um por um. Que vocês estejam bem na graça de Deus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “virgens chamadas viúvas” é incomum e pode refletir uma designação comunitária antiga; seu sentido exato é incerto.
    reason: Sinalizar ao leitor uma dificuldade histórica e lexical genuína sem resolvê-la no texto.
  - marker: b
    text: A expressão “tanto da carne como do espírito” também pode ser entendida como qualificando a fé e o amor; a construção exata permanece ambígua.
    reason: Preservar a possível ambiguidade sintática e teológica do testemunho.
lexical_decisions:
- source_word: households
  choice: famílias
  rationale: Expressa de modo natural o grupo doméstico, incluindo os membros da casa, sem restringi-lo ao edifício.
- source_word: virgins who are called widows
  choice: virgens chamadas viúvas
  rationale: Mantém literalmente a designação difícil e sua tensão histórica, sem identificar à força a condição ou função dessas mulheres.
- source_word: grounded
  choice: firmada
  rationale: Conserva a ideia de estabilidade e fundamento na fé e no amor em português corrente.
- source_word: both of flesh and of spirit
  choice: tanto da carne como do espírito
  rationale: Preserva a formulação antropológica e sua ambiguidade, sem substituir 'carne' por uma interpretação como 'corpo'.
- source_word: all by name
  choice: todos, um por um
  rationale: Comunica a saudação individual implícita na expressão, com naturalidade em português.
- source_word: Fare ye well / Farewell
  choice: Despeço-me de vocês / Permaneçam
  rationale: 'Distingue de forma contextual as duas despedidas: a primeira ligada ao poder do Pai e a final formulada como desejo de permanência na graça.'
theological_decisions:
- issue: A relação entre carne e espírito na fé e no amor
  choice: manter 'tanto da carne como do espírito'
  alternative: traduzir interpretativamente como 'no corpo e no espírito' ou ligar os termos diretamente a Távia
  rationale: A redação transmitida permite incerteza quanto à ligação sintática e ao alcance da expressão; a tradução evita resolver essa tensão.
- issue: Identidade das 'virgens chamadas viúvas'
  choice: preservar a designação sem explicá-la no corpo do texto
  alternative: identificá-las como uma ordem eclesiástica específica ou como viúvas celibatárias
  rationale: O testemunho fornecido não permite fixar com segurança o estatuto histórico dessas mulheres.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os nomes próprios foram aportuguesados de modo moderado: Fílon, Távia, Dafno e Eutecno; Alce foi mantido. Como o texto grego não foi fornecido e a revisão direta da língua-fonte está pendente, o rascunho segue criticamente o testemunho inglês público indicado e explicita as incertezas relevantes.'
