  naturalness: «Famílias», «firmada», «um por um» e os nomes aportuguesados são claros e adequados ao português moderno. «Que vocês estejam bem» reproduz com naturalidade o valor desiderativo das duas despedidas sem introduzir a ideia adicional de o autor despedir-se ou de os leitores permanecerem.
