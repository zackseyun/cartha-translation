review_pass:
  verdict: revise
  source_fidelity: 'A revisão requer correções para refletir com maior precisão a testemunha fornecida: «either ... or» não é «nem ... nem»; «apart from others» não equivale a decisões isoladas; e as expressões finais dizem que Cristo «está com Um» e «partiu para Um», não que permaneceu e voltou. A repetição enfática de «Um» deve ser mantida, sem harmonização doutrinária.'
  naturalness: 'A redação revista mantém português moderno e legível, mas substitui construções que alteravam o sentido por formulações naturais: «seja ... seja», «à parte dos outros» e «como para». «Um só pensamento» permite que o relativo masculino preserve o antecedente gramatical mais direto da construção.'
  terminology: «Bispo», «presbíteros», «altar» e «Jesus Cristo» são adequados. «Um» é conservado nas duas últimas expressões para espelhar a formulação deliberadamente incomum da testemunha, com nota de transparência textual.
  issues:
  - severity: high
    issue: A primeira frase traduz «either by Himself or by the Apostles» como «nem por si mesmo nem por meio dos apóstolos».
    rationale: A construção da testemunha apresenta duas modalidades abrangidas pela negação («seja ... seja»), não uma coordenação negativa que possa sugerir que ambas as modalidades são excluídas como alternativas independentes.
  - severity: medium
    issue: «aquilo que decidirem isoladamente» acrescenta a ideia de decidir e não traduz adequadamente «think anything right ... apart from others».
    rationale: O texto trata de considerar algo correto para si mesmos à parte dos outros; a revisão retira o acréscimo semântico e preserva a referência aos outros.
  - severity: high
    issue: «permaneceu com o Um e voltou para o Um» altera os tempos e o verbo de «is with One and departed unto One».
    rationale: A testemunha diz «está com Um» e «partiu para Um». Não é seguro converter isso em permanência passada ou retorno.
  - severity: medium
    issue: A nota b apresenta como igualmente possíveis antecedentes que a forma relativa não sustenta da mesma maneira.
    rationale: Na construção subjacente, o relativo masculino aponta mais diretamente para «one mind»; «um só pensamento» preserva esse gênero e evita criar uma ambiguidade portuguesa artificial.
  - severity: low
    issue: «como em um só templo» e «como junto a um só altar» enfraquecem o movimento direcional de «as to».
    rationale: «Como para um único templo/altar» reflete melhor a exortação a convergir.
  revised_text: 'Portanto, assim como o Senhor nada fez sem o Pai, [estando unido a ele][a], seja por si mesmo, seja por meio dos apóstolos, também vocês não façam nada sem o bispo e os presbíteros. E não tentem considerar correto coisa alguma para vocês mesmos à parte dos outros; pelo contrário, haja uma só oração em comum, uma só súplica, um só pensamento, uma só esperança, em amor e em alegria irrepreensível, que é Jesus Cristo, do qual nada é melhor.[b]



    Apressem-se todos a reunir-se como para um único templo, que é Deus; como para um único altar, que é Jesus Cristo. Ele procedeu de um único Pai, está com Um e partiu para Um.[c]'
  revised_footnotes:
  - marker: a
    text: A expressão “estando unido a ele” aparece entre colchetes na testemunha inglesa fornecida, sinalizando uma restauração ou incerteza textual; os colchetes foram preservados.
    reason: Registrar de modo transparente o sinal editorial da fonte de consulta.
  - marker: b
    text: A construção identifica Jesus Cristo com o “um só pensamento”; a formulação compacta também mantém ligada essa identificação à unidade de oração, súplica, esperança, amor e alegria que a precede.
    reason: Explicar a referência gramatical mais direta sem expandir o sentido em uma interpretação doutrinária.
  - marker: c
    text: 'A testemunha inglesa repete “One” nas duas últimas expressões: Cristo “está com Um” e “partiu para Um”. A formulação incomum foi preservada; a revisão direta do grego ainda está pendente.'
    reason: Explicar a repetição deliberadamente preservada e o caráter provisório da base textual.
  revision_rationale: Foram corrigidas alterações de sentido introduzidas pelo rascunho, preservando o registro eclesial antigo, a unidade retórica da passagem, os colchetes da testemunha e a formulação incomum final. Não se impõe interpretação confessional às imagens de Deus como templo, de Cristo como altar ou de «Um».
