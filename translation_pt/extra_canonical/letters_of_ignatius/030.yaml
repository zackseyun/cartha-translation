review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a exortação à unidade, os termos eclesiais e as identificações metafóricas de Deus como templo e de Jesus Cristo como altar. Contudo, «aquilo que decidirem isoladamente» acrescenta a noção de decidir, ausente da fonte, em lugar de traduzir o ato de considerar/julgar algo correto. No fecho, «permaneceu» altera o presente «is with One», e «voltou» introduz retorno que não está expresso em «departed unto One».
  naturalness: O registro é claro e digno. Foram feitos pequenos ajustes para uma formulação portuguesa natural sem explicitar indevidamente relações que o texto mantém comprimidas e incomuns.
  terminology: «Bispo», «presbíteros», «oração», «súplica» e «altar» são escolhas adequadas. «O Um» conserva, de modo marcado mas inteligível, a repetição enfática da testemunha de base nas duas últimas expressões.
  issues:
  - severity: medium
    issue: Acréscimo de «decidirem» em «aquilo que decidirem isoladamente».
    rationale: A fonte diz para não considerar ou pensar que algo é correto à parte dos outros; não menciona uma decisão. A revisão remove esse acréscimo e preserva a advertência.
  - severity: medium
    issue: Alteração do tempo e do movimento no enunciado final.
    rationale: A testemunha fornecida traz «is with One» e «departed unto One». «Permaneceu» põe a relação no passado, e «voltou» pressupõe um retorno. «Está com o Um e partiu para o Um» conserva o presente e não acrescenta essa pressuposição.
  - severity: low
    issue: «Como em um só templo» enfraquece a orientação comparativa de «as to one temple».
    rationale: «Como para um só templo» representa mais diretamente a imagem de convergência em direção ao templo/altar, sem transformar Deus e Cristo em meros locais físicos.
  revised_text: 'Portanto, assim como o Senhor nada fez sem o Pai, [estando unido a ele][a], nem por si mesmo nem por meio dos apóstolos, também vocês não façam coisa alguma sem o bispo e os presbíteros. E não tentem considerar correto nada à parte dos outros; mas haja uma só oração em comum, uma só súplica, uma só mente, uma só esperança, em amor e em alegria irrepreensível, que é Jesus Cristo, e nada há melhor do que ele.[b]



    Todos vocês, apressem-se a reunir-se como para um só templo, isto é, Deus; como para um só altar, isto é, um só Jesus Cristo. Ele veio de um só Pai, está com o Um e partiu para o Um.[c]'
  revised_footnotes:
  - marker: a
    text: A expressão “estando unido a ele” aparece entre colchetes na testemunha inglesa fornecida, sinalizando uma restauração ou incerteza textual; os colchetes foram preservados.
    reason: Registrar de modo transparente o sinal editorial da fonte de consulta.
  - marker: b
    text: A construção pode relacionar “que é Jesus Cristo” à esperança, à alegria ou ao conjunto da unidade descrita.
    reason: Preservar a ambiguidade sintática da construção, sem escolher um único antecedente.
  - marker: c
    text: 'A testemunha inglesa repete enfaticamente “One”: Cristo “veio de Um Pai”, “está com Um” e “partiu para Um”. A redação é incomum, e a revisão direta do grego ainda está pendente.'
    reason: Explicar a repetição deliberadamente preservada e o caráter provisório da base textual.
  revision_rationale: A revisão elimina acréscimos semânticos e conserva mais estritamente os tempos verbais e a direção do enunciado final da testemunha fornecida. Também ajusta a imagem de reunião em direção ao único templo e ao único altar. Mantêm-se os colchetes editoriais, a ambiguidade da oração relativa e a formulação incomum «o Um», sem harmonização doutrinal.
