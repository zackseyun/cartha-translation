base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/030.yaml
  text: 'Therefore, just as the Lord did nothing without the Father, [being united with Him], either by Himself or by the Apostles, so neither do you do anything without the bishop and the presbyters. And do not attempt to think anything right for yourselves apart from others; but let there be one prayer in common, one supplication, one mind, one hope, in love and in joy unblamable, which is Jesus Christ, than whom there is nothing better.


    Hasten, all of you, to come together as to one temple, even God; as to one altar, even to one Jesus Christ, who came forth from One Father and is with One and departed unto One.'
translation:
  language: pt
  text: 'Portanto, assim como o Senhor nada fez sem o Pai, [estando unido a ele][a], nem por si mesmo nem por meio dos apóstolos, também vocês não devem fazer coisa alguma sem o bispo e os presbíteros. Não tentem considerar correto aquilo que decidirem isoladamente; pelo contrário, haja uma só oração em comum, uma só súplica, uma só mente e uma só esperança, em amor e em alegria irrepreensível — que é Jesus Cristo, e nada há melhor do que ele.[b]


    Apressem-se todos a reunir-se como em um só templo, o próprio Deus; como junto a um só altar, o próprio Jesus Cristo. Ele veio de um só Pai, permaneceu com o Um e voltou para o Um.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “estando unido a ele” aparece entre colchetes na testemunha inglesa fornecida, sinalizando uma restauração ou incerteza textual; os colchetes foram preservados.
    reason: Registrar de modo transparente o sinal editorial da fonte de consulta.
  - marker: b
    text: A construção pode relacionar “que é Jesus Cristo” à esperança, à alegria ou ao conjunto da unidade descrita.
    reason: Preservar uma ambiguidade sintática e teológica real, em vez de escolher um único antecedente.
  - marker: c
    text: 'Literalmente, a testemunha inglesa repete “One”: Cristo “veio de Um Pai”, “está/esteve com Um” e “partiu/voltou para Um”. A redação é incomum, e a revisão direta do grego ainda está pendente.'
    reason: Explicar a repetição deliberadamente preservada e o caráter provisório da base textual.
lexical_decisions:
- source_word: bishop (Greek ἐπίσκοπος, conforme a tradição indicada)
  choice: bispo
  rationale: É o equivalente histórico e corrente em português para o ofício mencionado, sem ampliar suas funções no texto.
- source_word: presbyters (Greek πρεσβύτεροι)
  choice: presbíteros
  rationale: Mantém a designação eclesial antiga e evita substituir o termo por uma estrutura denominacional moderna.
- source_word: one mind
  choice: uma só mente
  rationale: Preserva a imagem de unidade de pensamento sem reduzi-la a mera concordância ou opinião comum.
- source_word: unblamable
  choice: irrepreensível
  rationale: Reproduz o sentido moral elevado em registro digno e natural.
- source_word: altar
  choice: altar
  rationale: Conserva a metáfora cultual explícita, sem interpretá-la sacramental ou institucionalmente.
- source_word: One
  choice: o Um
  rationale: Preserva a formulação enfática e incomum da testemunha inglesa, bem como sua provável referência à unicidade do Pai, sem substituir o termo diretamente por “Pai” nas duas ocorrências finais.
theological_decisions:
- issue: A relação entre a ação comunitária e o bispo e os presbíteros
  choice: “não devem fazer coisa alguma sem o bispo e os presbíteros”
  alternative: “não façam nada independentemente do bispo e dos presbíteros”
  rationale: A formulação conserva a força abrangente do testemunho sem acrescentar uma teoria posterior sobre a extensão ou a natureza dessa autoridade.
- issue: O antecedente de “que é Jesus Cristo”
  choice: Manter a oração relativa após a série “esperança, em amor e em alegria irrepreensível”
  alternative: Explicitar “a esperança, que é Jesus Cristo” ou “a alegria, que é Jesus Cristo”
  rationale: O vínculo sintático e teológico é potencialmente ambíguo; a tradução não determina silenciosamente se Jesus Cristo é identificado especificamente com a esperança, com a alegria ou com toda a unidade descrita.
- issue: As três expressões finais sobre a procedência, permanência e retorno de Cristo
  choice: “veio de um só Pai, permaneceu com o Um e voltou para o Um”
  alternative: “procedeu do único Pai, está com ele e retornou a ele”
  rationale: A escolha mantém a repetição enfática de “um/Um” e evita harmonizar a linguagem com uma fórmula dogmática posterior; “permaneceu” representa o testemunho fornecido sem definir a metafísica da relação.
- issue: Deus como templo e Jesus Cristo como altar
  choice: “um só templo, o próprio Deus; ... um só altar, o próprio Jesus Cristo”
  alternative: “um templo de Deus; ... o altar de Jesus Cristo”
  rationale: Preserva as identificações fortes do texto (“even God”, “even ... Jesus Christ”) sem enfraquecê-las nem lhes acrescentar interpretação ritual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” para o plural eclesial, mantendo termos históricos como “bispo” e “presbíteros”. A redação é provisória porque o material fornecido declara que a revisão direta da tradição grega da recensão média ainda está pendente; por isso, não se corrigiram conjecturalmente as formulações incomuns da testemunha inglesa.
