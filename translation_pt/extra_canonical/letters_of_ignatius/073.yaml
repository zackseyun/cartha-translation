base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/073.yaml
  text: 'The priests likewise were good, but better is the High Priest, to whom the holy of holies is entrusted. For to him alone are entrusted the hidden things of God. He himself is the door of the Father, through which Abraham, Isaac, and Jacob enter, along with the Prophets, the Apostles, and the whole Church. All these things come together in the unity of God.


    But the Gospel has a unique preeminence in the coming of the Savior, our Lord Jesus Christ, and in his suffering and resurrection. For the beloved Prophets pointed to him in their preaching, but the Gospel is the fulfillment of immortality. All things together are good, if you believe through love.'
translation:
  language: pt
  text: 'Do mesmo modo, os sacerdotes eram bons, mas melhor é o Sumo Sacerdote, a quem foi confiado o Santo dos Santos; pois somente a ele foram confiadas as coisas ocultas de Deus. Ele mesmo é a porta do Pai, pela qual entram Abraão, Isaque e Jacó, bem como os Profetas, os Apóstolos e toda a Igreja. Todas essas coisas convergem para a unidade de Deus.


    Mas o evangelho tem uma preeminência singular na vinda do Salvador, nosso Senhor Jesus Cristo, e em seu sofrimento e ressurreição. Pois os amados Profetas apontavam para ele em sua pregação; o evangelho, porém, é a consumação da imortalidade. Todas essas coisas, em conjunto, são boas, se vocês creem por meio do amor.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego da recensão média ainda está pendente.
    reason: A fonte disponibilizada declara que a revisão na língua original ainda não foi realizada; a nota torna transparente a limitação textual da presente redação.
lexical_decisions:
- source_word: High-priest
  choice: Sumo Sacerdote
  rationale: Equivalente português tradicional e claro, preservando o contraste com os demais sacerdotes e a alusão cultual.
- source_word: holy of holies
  choice: Santo dos Santos
  rationale: Expressão bíblica corrente para o recinto mais sagrado, mantendo a imagem do sacerdócio e do acesso exclusivo.
- source_word: hidden things of God
  choice: coisas ocultas de Deus
  rationale: Preserva a linguagem de mistério sem explicar além do testemunho disponível.
- source_word: door of the Father
  choice: porta do Pai
  rationale: Mantém diretamente a metáfora cristológica e sua relação com o acesso ao Pai.
- source_word: combine in the unity of God
  choice: convergem para a unidade de Deus
  rationale: Comunica reunião orientada à unidade sem definir de maneira indevida a natureza dessa unidade.
- source_word: Gospel
  choice: evangelho
  rationale: Mantém a possível amplitude entre a mensagem proclamada e sua realidade salvífica, sem restringi-la a um livro.
- source_word: advent
  choice: vinda
  rationale: Português atual e natural, sem impor aqui o uso técnico litúrgico de “advento”.
- source_word: passion
  choice: sofrimento
  rationale: Forma compreensível ao leitor moderno que conserva a referência aos padecimentos de Cristo; “paixão” poderia ser mal compreendida no uso comum.
- source_word: completion of immortality
  choice: consumação da imortalidade
  rationale: Preserva a formulação densa e algo ambígua do testemunho, evitando reduzi-la a “promessa”, “garantia” ou “realização”.
- source_word: believe through love
  choice: creem por meio do amor
  rationale: Mantém a relação instrumental ou mediadora expressa por “through”, sem substituí-la por “creem com amor” ou “creem e amam”.
theological_decisions:
- issue: Referente dos pronomes ligados ao Sumo Sacerdote
  choice: “a ele” e “Ele mesmo”, referindo-se ao Sumo Sacerdote
  alternative: Explicitar imediatamente “Jesus Cristo”
  rationale: O contexto cristológico sustenta a identificação, mas o parágrafo só nomeia Jesus em seguida; a tradução preserva a progressão retórica.
- issue: Relação entre patriarcas, profetas, apóstolos e Igreja
  choice: Todos entram pela porta do Pai e convergem para a unidade de Deus
  alternative: Explicar como entrada no céu, salvação ou comunhão eclesial
  rationale: O testemunho não especifica o sentido exato de “entram”; acrescentar uma definição resolveria uma ambiguidade genuína.
- issue: Sentido de “consumação da imortalidade”
  choice: Manter a expressão teologicamente densa
  alternative: “cumprimento da promessa de imortalidade” ou “plenitude da vida eterna”
  rationale: As alternativas acrescentariam elementos não expressos e estreitariam a possível relação entre evangelho, ressurreição e imortalidade.
- issue: Fé e amor na cláusula final
  choice: “se vocês creem por meio do amor”
  alternative: “se vocês creem com amor”
  rationale: A opção escolhida conserva a tensão da formulação transmitida e evita enfraquecer a função atribuída ao amor.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se termos bíblicos reconhecíveis, como “Sumo Sacerdote”, “Santo dos Santos” e “porta do Pai”, enquanto formas arcaicas foram evitadas. As maiúsculas em “Profetas”, “Apóstolos” e “Igreja” acompanham o caráter coletivo e histórico desses grupos no testemunho; os pronomes divinos seguem capitalização moderada, sem obrigatoriedade confessional.
