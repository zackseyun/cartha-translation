review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha amplamente o testemunho inglês e preserva as imagens sacerdotais e cristológicas. Contudo, a cláusula final reflete de modo excessivamente mediado o inglês “through love”: a construção grega tradicionalmente atestada é ἐν ἀγάπῃ, mais diretamente “em amor”. Também é preferível não fazer “preeminência ... na vinda” parecer uma superioridade temporal do evangelho durante a vinda; a construção apresenta a vinda, o sofrimento e a ressurreição como aquilo que o evangelho possui de singular.'
  naturalness: 'O português é claro, atual e de registro apropriado. A reformulação de “tem uma preeminência singular na...” para “tem algo de singular: ...” torna a sintaxe mais natural e deixa explícita a relação entre o evangelho e os eventos enumerados. “Creem em amor” é uma formulação um pouco elevada, mas é inteligível e conserva deliberadamente a concisão e a preposição da fonte.'
  terminology: “Sumo Sacerdote”, “Santo dos Santos”, “porta do Pai”, “Profetas”, “Apóstolos” e “Igreja” são escolhas adequadas. “Sofrimento” conserva o sentido de πάθος sem a possível ambiguidade moderna de “paixão”. “Consumação da imortalidade” retém de modo útil a densidade da expressão, sem acréscimo doutrinal.
  issues:
  - severity: medium
    issue: A expressão final “creem por meio do amor” não representa com precisão a preposição da tradição grega.
    rationale: O texto grego da recensão média traz ἐν ἀγάπῃ (“em amor”). “Por meio de” torna o amor explicitamente instrumental, interpretação possível no inglês de auditoria, mas menos literal e mais estreita do que a formulação grega.
  - severity: low
    issue: “Tem uma preeminência singular na vinda ... e em seu sofrimento e ressurreição” pode sugerir que o evangelho é preeminente durante esses acontecimentos.
    rationale: A enumeração funciona como aposição ou explicação daquilo que o evangelho tem de excepcional. Dois-pontos preservam melhor essa relação sem acrescentar interpretação.
  revised_text: 'Do mesmo modo, os sacerdotes eram bons, mas melhor é o Sumo Sacerdote, a quem foi confiado o Santo dos Santos; pois somente a ele foram confiadas as coisas ocultas de Deus. Ele mesmo é a porta do Pai, pela qual entram Abraão, Isaque e Jacó, bem como os Profetas, os Apóstolos e toda a Igreja. Todas essas coisas convergem para a unidade de Deus.


    Mas o evangelho tem algo de singular: a vinda do Salvador, nosso Senhor Jesus Cristo, e seu sofrimento e ressurreição. Pois os amados Profetas apontavam para ele em sua pregação; o evangelho, porém, é a consumação da imortalidade. Todas essas coisas, em conjunto, são boas, se vocês creem em amor.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta e integral do texto grego da recensão média ainda está pendente.
    reason: A fonte disponibilizada declara que a revisão direta na língua original ainda não foi realizada; a nota torna transparente essa limitação textual.
  revision_rationale: A revisão corrige a relação preposicional da cláusula final à luz do grego transmitido, sem resolver além do necessário o papel de amor e fé. Ajusta-se ainda a sintaxe da frase sobre o evangelho para que a vinda, o sofrimento e a ressurreição sejam apresentados como o conteúdo de sua singularidade, em consonância com o testemunho inglês e com a construção grega. O restante é preservado, inclusive as ambiguidades sobre a entrada pela porta do Pai, a unidade de Deus e a “consumação da imortalidade”.
