base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/044.yaml
  text: 'Am I not able to write to you about heavenly things? But I fear lest I should cause you harm, being infants. So bear with me, lest, not being able to take them in, you should be choked.


    For I myself also, although I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible—I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
translation:
  language: pt
  text: 'Não sou capaz de lhes escrever sobre as coisas celestiais? Mas temo lhes causar dano, pois ainda são crianças. Portanto, tenham paciência comigo, para que vocês não se engasguem por não serem capazes de assimilá-las.


    Pois eu mesmo, embora esteja acorrentado e seja capaz de compreender as coisas celestiais, as fileiras dos anjos e as concentrações dos principados, as coisas visíveis e as invisíveis, nem por isso já sou discípulo. Pois ainda nos faltam muitas coisas, para que Deus não nos falte.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A formulação final é deliberadamente paradoxal: “ainda nos faltam muitas coisas, para que Deus não nos falte”. Também pode ser entendida como “carecemos de muitas coisas, a fim de não carecermos de Deus”.'
    reason: Preservar a dificuldade e a tensão teológica da cláusula final, evitando resolvê-la silenciosamente.
lexical_decisions:
- source_word: heavenly things
  choice: coisas celestiais
  rationale: Mantém o campo semântico amplo do testemunho, sem especificar mistérios, doutrinas ou revelações que o texto não explicita.
- source_word: babes
  choice: crianças
  rationale: Conserva a metáfora de imaturidade e evita o tom excessivamente clínico de “bebês” neste contexto de instrução.
- source_word: take them in
  choice: assimilá-las
  rationale: Expressa a capacidade de receber e compreender ensinamentos difíceis, ao mesmo tempo que prepara naturalmente a imagem seguinte de engasgar-se.
- source_word: arrays of the angels
  choice: fileiras dos anjos
  rationale: Preserva a imagem de seres angelicais ordenados ou dispostos em formação, sem impor uma hierarquia técnica não demonstrada pelo testemunho fornecido.
- source_word: musterings of the principalities
  choice: concentrações dos principados
  rationale: Retém a ideia de reunião ou agrupamento e mantém “principados”, termo tradicional para poderes celestes, sem definir sua natureza com maior precisão do que permite a base disponível.
- source_word: in bonds
  choice: acorrentado
  rationale: Comunica de modo concreto a condição de prisioneiro de Inácio, com naturalidade em português moderno.
theological_decisions:
- issue: A compreensão de realidades celestiais como prova de discipulado
  choice: “nem por isso já sou discípulo”
  alternative: “nem por causa disso sou discípulo”
  rationale: 'Preserva a tensão do autor: conhecimento espiritual elevado e sofrimento em cadeias não bastam, por si mesmos, para estabelecer maturidade plena no discipulado.'
- issue: Cláusula final sobre aquilo que falta aos seres humanos e a presença de Deus
  choice: “Pois ainda nos faltam muitas coisas, para que Deus não nos falte”
  alternative: “Pois carecemos de muitas coisas, a fim de não carecermos de Deus”
  rationale: Mantém o paralelismo e o paradoxo do testemunho sem explicar indevidamente como a carência humana se relaciona com não carecer de Deus.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita arcaísmos e conserva as metáforas fortes do trecho. Como a revisão direta do grego da recensão média ainda está pendente, este rascunho é necessariamente provisório e foi elaborado a partir do testemunho inglês público fornecido; em especial, os termos relativos às formações angélicas e a sintaxe da frase final deverão ser conferidos no grego.
