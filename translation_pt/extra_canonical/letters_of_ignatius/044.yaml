source:
  text: 'Am I not able to write to you of heavenly things? But I fear lest I should cause you harm being babes. So bear with me, lest not being able to take them in, ye should be choked.


    For I myself also, albeit I am in bonds and can comprehend heavenly things and the arrays of the angels and the musterings of the principalities, things visible and things invisible---I myself am not yet by reason of this a disciple. For we lack many things, that God may not be lacking to us.'
