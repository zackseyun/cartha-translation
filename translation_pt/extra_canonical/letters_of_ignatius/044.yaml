review_pass:
  verdict: revise
  source_fidelity: 'A tradução conserva a progressão e o paradoxo do texto: o autor se contém diante de destinatários ainda imaturos, relativiza tanto suas cadeias como seu conhecimento das realidades celestiais e afirma a carência humana para não carecer de Deus. Contudo, «concentrações dos principados» não representa naturalmente «musterings» nem a imagem de agrupamentos/assembleias; além disso, a construção «para que vocês não se engasguem por não serem capazes» torna a relação sintática menos direta que a advertência original.'
  naturalness: O registro é geralmente claro e atual. Convém uniformizar o tratamento de segunda pessoa ("lhes" / "vocês") e substituir «concentrações» por uma expressão portuguesa idiomática. «Ter paciência comigo» comunica adequadamente o pedido de tolerância/indulgência.
  terminology: «Coisas celestiais», «principados», «visíveis e invisíveis» e «discípulo» são escolhas adequadas e não impõem uma leitura doutrinária. «Em cadeias» é mais idiomático e suficientemente concreto que «acorrentado» para a condição de prisioneiro. «Formações dos anjos» e «reuniões dos principados» mantêm as imagens coletivas sem transformar os termos em títulos técnicos de uma hierarquia.
  issues:
  - severity: medium
    issue: «concentrações dos principados»
    rationale: Em português, «concentrações» soa administrativo, militar ou químico e não comunica com naturalidade a noção de ajuntamentos/formações expressa pelo testemunho inglês («musterings»).
  - severity: low
    issue: Alternância entre «lhes» e «vocês»
    rationale: A alternância é compreensível, mas prejudica levemente a coerência estilística em uma tradução breve.
  - severity: low
    issue: Formulação da advertência sobre engasgar-se
    rationale: «Para que vocês não se engasguem por não serem capazes de assimilá-las» é inteligível, mas «para que não se engasguem por não conseguirem assimilá-las» reproduz mais diretamente a sequência do original e evita a perífrase pesada.
  revised_text: 'Não sou capaz de lhes escrever sobre as coisas celestiais? Mas temo causar-lhes dano, pois ainda são crianças. Portanto, tenham paciência comigo, para que não se engasguem por não conseguirem assimilá-las.


    Pois eu mesmo, embora esteja em cadeias e seja capaz de compreender as coisas celestiais, as formações dos anjos e as reuniões dos principados, as coisas visíveis e as invisíveis, nem por isso ainda sou discípulo. Pois nos faltam muitas coisas, para que Deus não nos falte.[a]'
  revised_footnotes:
  - marker: a
    text: 'A formulação final é deliberadamente paradoxal: “nos faltam muitas coisas, para que Deus não nos falte”. Também pode ser entendida como: “carecemos de muitas coisas, a fim de não carecermos de Deus”.'
    reason: Preserva a dificuldade sintática e a tensão teológica da cláusula sem resolvê-las por interpretação.
  revision_rationale: A revisão melhora a naturalidade e a precisão das imagens coletivas celestiais, uniformiza o tratamento dos destinatários e torna mais transparente a advertência sobre a incapacidade de receber o ensino. Mantém-se a ambiguidade paradoxal da cláusula final, assinalada em nota.
