review_pass:
  verdict: revise
  source_fidelity: A revisão é feita provisoriamente contra o testemunho inglês fornecido, com atenção à formulação grega tradicionalmente atestada para a recensão média. O sentido geral está bem preservado. Contudo, a oração sobre o discipulado deve conservar mais claramente o «ainda» e a relação concessiva («nem por causa disso»). A frase final é mais fiel se expressar que nós não venhamos a carecer de Deus, em vez de sugerir que Deus deixe de estar presente ou disponível para nós.
  naturalness: O texto é claro e de registro apropriado. «Concentrações dos principados» soa pouco idiomático e excessivamente abstrato em português; «agrupamentos dos principados» transmite melhor a imagem de reunião/formação. «Venham a ser sufocados» conserva mais naturalmente a voz passiva da imagem, sem perder a metáfora de incapacidade de receber ensinamento.
  terminology: «Coisas celestiais», «crianças», «fileiras dos anjos» e «principados» são escolhas defensáveis. «Em cadeias» é uma forma mais próxima e natural para a condição de prisioneiro. A nota final deve explicar a construção paradoxal sem oferecer uma paráfrase que mude o sujeito de «carecer de Deus».
  issues:
  - severity: medium
    issue: «concentrações dos principados»
    rationale: Não corresponde naturalmente à ideia de «musterings»/agrupamentos ou formações e soa como concentração no sentido químico ou estatístico. «Agrupamentos dos principados» preserva a imprecisão deliberada quanto à natureza dessas ordens.
  - severity: medium
    issue: «nem por isso já sou discípulo»
    rationale: A posição de «já» é ambígua em português e enfraquece o «ainda não» do testemunho. «Nem por causa disso sou ainda discípulo» preserva que tais conhecimentos e condições não constituem, por si, discipulado.
  - severity: medium
    issue: «para que Deus não nos falte»
    rationale: Embora tente refletir o paradoxo, pode significar que Deus nos abandone ou deixe de prover. A construção subjacente aponta para não carecermos de Deus; a redação revista mantém o paradoxo sem deslocar o sentido.
  revised_text: 'Não posso escrever-lhes sobre as coisas celestiais? Mas temo causar-lhes dano, pois vocês ainda são crianças. Portanto, tenham paciência comigo, para que, por não serem capazes de assimilá-las, não venham a ser sufocados.


    Pois também eu, embora esteja em cadeias e possa compreender as coisas celestiais, as fileiras dos anjos e os agrupamentos dos principados, as coisas visíveis e as invisíveis, nem por causa disso sou ainda discípulo. Pois ainda nos faltam muitas coisas, para que não venhamos a carecer de Deus.[a]'
  revised_footnotes:
  - marker: a
    text: 'A construção é deliberadamente paradoxal: literalmente, muitas coisas «nos faltam», para que não venhamos a «carecer de Deus». A tradução conserva a repetição e não especifica quais são essas coisas.'
    reason: Explicar a sintaxe e o paralelismo da cláusula final sem alterar seu sujeito nem resolver sua tensão teológica.
  revision_rationale: A revisão conserva a linguagem elevada e as imagens do texto, mas corrige formulações que obscureciam a relação lógica do discipulado e da cláusula final. Também substitui um termo pouco natural para as formações dos principados e aproxima «em cadeias» do testemunho-base. Como a colação direta do grego ainda é pendente no contexto fornecido, a terminologia cósmico-angélica permanece prudente e não técnica.
