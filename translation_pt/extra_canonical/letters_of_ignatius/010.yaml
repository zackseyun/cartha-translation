base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/010.yaml
  text: 'But I have learned that certain people passed through you from elsewhere, bringing evil teaching; you did not allow them to sow seed in you, for you stopped your ears so that you might not receive the seed sown by them. For you are stones of a temple, prepared beforehand for a building of God the Father, being hoisted up to the heights through the lifting device of Jesus Christ, which is the cross, and using the Holy Spirit as a rope. Your faith is your windlass, and love is the way that leads up to God.


    Therefore, you are all companions on the way, carrying your God and your shrine, your Christ and your holy things, clothed from head to foot in the commandments of Jesus Christ. I too, taking part in the celebration, am permitted by letter to accompany you and rejoice with you, that you set not your love on anything after the common life of men, but only on God.'
translation:
  language: pt
  text: 'Mas fiquei sabendo que certas pessoas, vindas de lá, passaram entre vocês trazendo um ensinamento perverso. Vocês não permitiram que elas semeassem em vocês, pois taparam os ouvidos para não receber a semente lançada por elas. De fato, vocês são pedras de um templo, preparadas de antemão para a construção de Deus Pai. São elevados às alturas pelo mecanismo de elevação de Jesus Cristo, isto é, a cruz, usando o Espírito Santo como corda. A fé de vocês é o guincho, e o amor é o caminho que conduz a Deus.


    Portanto, todos vocês são companheiros de jornada, portadores de Deus, do santuário, de Cristo e das coisas santas, adornados da cabeça aos pés com os mandamentos de Jesus Cristo. Também eu, participando da celebração, fui considerado digno, por meio desta carta, de acompanhá-los e de me alegrar com vocês, para que não ponham o amor em nada conforme o modo de vida comum dos seres humanos, mas somente em Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evil doctrine
  choice: ensinamento perverso
  rationale: Expressa o caráter nocivo e moralmente reprovável do ensino sem recorrer ao termo mais técnico e potencialmente anacrônico “heresia”.
- source_word: engine / lifting device
  choice: mecanismo de elevação
  rationale: Mantém a imagem concreta de uma máquina usada para içar pedras, sem especificar um aparelho que o testemunho disponível não identifica com certeza.
- source_word: windlass
  choice: guincho
  rationale: 'Preserva a metáfora de construção: a fé é o dispositivo que, com a corda, permite elevar as pedras.'
- source_word: companions in the way
  choice: companheiros de viagem
  rationale: Conserva tanto a ideia de jornada compartilhada quanto a continuidade com o “caminho” que conduz a Deus.
- source_word: shrine
  choice: santuário
  rationale: Mantém a referência cultual de algo ou algum recinto sagrado, evitando reduzi-la a “templo” e apagar a mudança de termo presente no testemunho.
- source_word: holy things
  choice: coisas santas
  rationale: Preserva a amplitude e a possível ambiguidade cultual da expressão, sem identificar indevidamente objetos, ritos ou sacramentos específicos.
- source_word: festivity
  choice: celebração
  rationale: Soa natural em português moderno e retém o tom festivo e comunitário sem definir a ocasião com maior precisão do que a evidência permite.
theological_decisions:
- issue: Imagem da cruz como instrumento de elevação
  choice: “pelo mecanismo de elevação de Jesus Cristo, isto é, a cruz”
  alternative: “pela máquina de Jesus Cristo — a cruz”
  rationale: Mantém explicitamente a identificação da cruz com o instrumento que eleva, preservando a metáfora arquitetônica e sua tensão teológica.
- issue: Função do Espírito Santo na metáfora
  choice: “usando o Espírito Santo como corda”
  alternative: “tendo o Espírito Santo por cabo”
  rationale: Conserva a formulação metafórica direta, sem transformá-la em explicação doutrinária.
- issue: Objeto exclusivo do amor
  choice: “não amam coisa alguma segundo o modo de vida comum dos seres humanos, mas somente a Deus”
  alternative: “não amam nada da vida humana comum, mas somente a Deus”
  rationale: A escolha preserva a relação ambígua entre “amar coisa alguma” e o padrão da vida humana comum, evitando sugerir rejeição absoluta da existência humana ou da criação.
- issue: Portadores de Deus e do sagrado
  choice: “levando consigo seu Deus e seu santuário, seu Cristo e suas coisas santas”
  alternative: “portadores de Deus, do santuário, de Cristo e das coisas santas”
  rationale: Mantém a sequência enfática e incomum do testemunho sem impor uma interpretação eclesiológica ou sacramental específica.
translation_notes:
  register: Português contemporâneo, digno e acessível, com tratamento plural por “vocês”. A tradução preserva as metáforas encadeadas de agricultura, arquitetura, içamento, caminho, procissão e vestimenta. Como a revisão direta do grego da recensão média ainda está pendente e o material fornecido é um testemunho inglês de domínio público, escolhas lexicais mais técnicas — especialmente as ligadas ao mecanismo de içamento e à procissão cultual — permanecem provisórias.
