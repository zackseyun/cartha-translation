base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/072.yaml
  text: 'I therefore did my part, as a man committed to unity. But where there is division and anger, God does not dwell. Now the Lord forgives everyone when they repent, if in repentance they return to the unity of God and to the council of the bishop. I have faith in the grace of Jesus Christ, who will strike off every fetter from you; and I urge you,


    Do nothing in a spirit of faction, but according to the teaching of Christ. For I heard certain people saying, “If I do not find it in the charters, I do not believe it in the Gospel.” And when I said to them, “It is written,” they answered me, “That is the question.” But for me, my charter is Jesus Christ; the inviolable charter is his cross, his death, his resurrection, and faith through him. In these I desire to be justified through your prayers.'
translation:
  language: pt
  text: 'Portanto, fiz a minha parte, como alguém dedicado à unidade. Mas onde há divisão e ira, Deus não habita. O Senhor perdoa a todos os que se arrependem, se, em arrependimento, voltam à unidade de Deus e ao conselho do bispo. Tenho fé na graça de Jesus Cristo, que romperá todas as correntes que prendem vocês. E lhes peço:


    Não façam nada por espírito de facção, mas ajam segundo o ensino de Cristo. Pois ouvi certas pessoas dizerem: “Se não encontro isso nos documentos, não creio que esteja no evangelho”. Quando eu lhes disse: “Está escrito”, responderam: “É justamente isso que está em questão”. Para mim, porém, o meu documento é Jesus Cristo; o documento inviolável é a sua cruz, a sua morte, a sua ressurreição e a fé que vem por meio dele.[a] Nisso desejo ser justificado, mediante as orações de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “a fé por meio dele”. Como a revisão direta do grego ainda está pendente, preserva-se a possível ideia de que a fé vem por meio de Cristo, sem excluir outras relações sintáticas com a cruz, a morte e a ressurreição.
    reason: O testemunho inglês permite mais de uma relação para “through him”; a nota evita resolver indevidamente a ambiguidade antes da revisão da fonte grega.
lexical_decisions:
- source_word: charters
  choice: documentos
  rationale: Preserva a imagem de registros escritos ou títulos autorizadores e a repetição retórica, sem o sentido político moderno que “cartas constitucionais” poderia sugerir.
- source_word: council of the bishop
  choice: conselho do bispo
  rationale: Mantém a formulação do testemunho disponível sem decidir se se refere ao conselho dado pelo bispo ou ao corpo reunido em torno dele.
- source_word: fetter
  choice: correntes que prendem vocês
  rationale: Expressa em português natural a metáfora de grilhões ou vínculos dos quais a graça liberta.
- source_word: factiousness
  choice: espírito de facção
  rationale: Conserva a ligação temática com divisão e ira, indicando ação movida por partidarismo e ruptura.
- source_word: Gospel
  choice: evangelho
  rationale: Mantém a possível referência tanto à mensagem cristã quanto à sua forma textual, sem especificar um escrito canônico particular.
theological_decisions:
- issue: Retorno à unidade de Deus e ao conselho do bispo
  choice: Preservar ambas as expressões como condições ligadas ao arrependimento
  alternative: Reformular como simples reconciliação com Deus por intermédio da obediência episcopal
  rationale: O testemunho distingue, mas relaciona, a unidade de Deus e o conselho do bispo; a tradução não deve fundi-los nem criar uma doutrina eclesiológica mais definida.
- issue: Justificação mediante as orações dos destinatários
  choice: “Nisso desejo ser justificado, mediante as orações de vocês”
  alternative: “por isso espero ser considerado justo graças às orações de vocês”
  rationale: Mantém a linguagem teológica e a tensão entre fé, acontecimentos de Cristo e intercessão comunitária, sem explicar o mecanismo.
- issue: “Faith through him”
  choice: “a fé que vem por meio dele” com nota de ambiguidade
  alternative: “a fé nele” ou “a fé por meio dele”
  rationale: Evita substituir a mediação expressa no testemunho por um objeto explícito da fé, ao mesmo tempo que reconhece a incerteza sintática.
- issue: Presença de Deus em meio à divisão
  choice: “Deus não habita”
  alternative: “Deus não permanece”
  rationale: “Habita” conserva a força espacial e comunitária da afirmação sem enfraquecê-la como mera desaprovação.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão internacional. “Vocês” foi usado para o plural, evitando regionalismos. A repetição de “documento(s)” foi mantida porque estrutura o contraste retórico entre textos invocados pelos interlocutores e Cristo como garantia decisiva. Este rascunho é necessariamente provisório, pois se baseia no testemunho inglês de domínio público e a revisão direta da tradição grega da recensão média ainda está pendente.
