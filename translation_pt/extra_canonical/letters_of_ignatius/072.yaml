review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha bem o argumento e o registro exortativo. Contudo, o termo repetido no testemunho inglês como “charter” corresponde ao grego ἀρχεῖα, com o sentido de registros ou arquivos autorizados; “documentos” é possível, mas “registros” preserva melhor tanto a ideia de fonte documental invocada quanto a repetição deliberada. Na citação, “não creio que esteja no evangelho” introduz uma paráfrase de conteúdo que não está expressa: o enunciado contrapõe encontrar algo nos registros a crer no evangelho.'
  naturalness: O português é claro, atual e adequado. “Registros” continua compreensível no contexto, sem o sentido técnico moderno excessivo de “arquivos”, e a repetição produz o efeito retórico necessário. “A fé por meio dele” é mais próximo e menos interpretativo do que “a fé que vem por meio dele”.
  terminology: '“Conselho do bispo”, “espírito de facção”, “evangelho”, “justificado” e “graça” são escolhas apropriadas. A nota sobre “fé ... por meio dele” deve ser retirada: a sua formulação sugere alternativas sintáticas mais amplas do que o texto sustenta e a redação revista já conserva a formulação sem explicação doutrinária adicional.'
  issues:
  - severity: medium
    issue: “Documentos” para a imagem repetida de “charters”
    rationale: O termo subjacente ἀρχεῖα remete mais especificamente a registros ou arquivos documentais, provavelmente invocados como textos autorizados. “Registros” conserva melhor a imagem e sua repetição retórica.
  - severity: medium
    issue: Explicitação em “não creio que esteja no evangelho”
    rationale: 'A expressão acrescenta “que esteja”, tratando o evangelho como lugar em que o item deveria constar. A formulação da fonte mantém a declaração mais direta: se não o encontram nos registros, não creem no evangelho.'
  - severity: low
    issue: Nota de rodapé sobre “a fé que vem por meio dele”
    rationale: A nota propõe uma ambiguidade sintática excessiva e a oração relativa “que vem” explicita uma relação de origem que não é necessária. “A fé por meio dele” mantém a construção sem sobredefini-la.
  revised_text: 'Portanto, fiz a minha parte, como alguém dedicado à unidade. Mas onde há divisão e ira, Deus não habita. O Senhor perdoa a todos os que se arrependem, se, arrependendo-se, voltam à unidade de Deus e ao conselho do bispo. Tenho fé na graça de Jesus Cristo, que romperá todas as correntes que prendem vocês. E lhes peço:


    Não façam nada por espírito de facção, mas segundo o ensino de Cristo. Pois ouvi certas pessoas dizerem: “Se não o encontro nos registros, não creio no evangelho”. Quando eu lhes disse: “Está escrito”, responderam-me: “Isso é o que está em questão”. Para mim, porém, os registros são Jesus Cristo; os registros invioláveis são a sua cruz, a sua morte, a sua ressurreição e a fé por meio dele. Nisso desejo ser justificado, mediante as orações de vocês.'
  revised_footnotes: []
  revision_rationale: A revisão preserva a estrutura, as afirmações teológicas e a linguagem eclesial do rascunho, mas torna mais fiel a imagem documental repetida e elimina uma explicitação indevida na fala dos interlocutores. Também substitui a oração relativa interpretativa por uma formulação portuguesa diretamente correspondente a “faith through him” e remove a nota que ampliava artificialmente a ambiguidade.
