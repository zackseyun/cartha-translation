review_pass:
  verdict: revise
  source_fidelity: 'A revisão requer ajustes para conservar imagens e relações do testemunho: “charters” deve manter a imagem repetida de “arquivos”, e “strike off every fetter from you” é mais bem expresso como libertação de todo grilhão. “A fé por meio dele” preserva a mediação explicitada pelo testemunho, sem a reinterpretação causal de “que vem por meio dele”.'
  naturalness: O texto revisto conserva registro moderno e digno, com leitura clara para o português internacional e brasileiro. “Arquivos” é natural no contexto de documentos ou registros de autoridade, e sua repetição deliberada reproduz o contraste retórico do trecho.
  terminology: “Conselho do bispo”, “evangelho”, “unidade”, “grilhão”, “espírito de facção” e “justificado” preservam o vocabulário eclesial e teológico sem impor interpretação confessional. “Arquivos” é preferível a “documentos”, pois mantém a metáfora técnica repetida no testemunho.
  issues:
  - severity: medium
    issue: “Documentos” para a imagem reiterada de “charters”.
    rationale: “Documentos” é excessivamente genérico e enfraquece o contraste entre os registros escritos invocados por alguns e Cristo, sua cruz, morte e ressurreição como os “arquivos” decisivos. “Arquivos” mantém melhor a imagem institucional e a repetição.
  - severity: low
    issue: “A fé que vem por meio dele” reformula “faith through him”.
    rationale: A formulação pode sugerir apenas origem causal. “A fé por meio dele” conserva mais diretamente a relação mediadora expressa pelo testemunho, sem especificar indevidamente o mecanismo.
  - severity: low
    issue: “Correntes que prendem vocês” torna mais perifrástica a imagem de “every fetter”.
    rationale: “Todo grilhão” mantém a metáfora concisa de vínculos ou cadeias, enquanto “libertará vocês de” exprime com naturalidade o sentido de removê-los.
  revised_text: 'Portanto, fiz a minha parte, como alguém preparado para a unidade. Mas, onde há divisão e ira, Deus não habita. O Senhor perdoa a todos os que se arrependem, desde que, ao se arrependerem, retornem à unidade de Deus e ao conselho do bispo. Tenho fé na graça de Jesus Cristo, que libertará vocês de todo grilhão. E lhes peço:


    Não façam nada por espírito de facção, mas conforme o ensino de Cristo. Pois ouvi certas pessoas dizerem: “Se não o encontro nos arquivos, não creio no evangelho.” Quando eu lhes disse: “Está escrito”, responderam-me: “Isso é o que está em questão.” Para mim, porém, os meus arquivos são Jesus Cristo; os arquivos invioláveis são a sua cruz, a sua morte, a sua ressurreição e a fé por meio dele. Nessas coisas desejo ser justificado, mediante as orações de vocês.'
  revised_footnotes: []
  revision_rationale: A revisão recupera a imagem repetida de registros autorizados por meio de “arquivos”, sem decidir quais escritos específicos os interlocutores tinham em vista. Também torna mais direta a metáfora dos grilhões e conserva a construção “fé por meio dele”. A nota anterior é removida porque sua formulação especulava sobre uma ambiguidade que não é necessária para traduzir de modo fiel o testemunho fornecido; o texto revisto não fixa objeto, mecanismo ou doutrina adicional para essa fé.
