  text: Ignatius, who is also Theophorus, to the church of God the Father and of Jesus Christ, which is in Philadelphia of Asia, which has found mercy and is firmly established in the concord of God and rejoices in the passion of our Lord and in His resurrection without wavering, being fully assured in all mercy; which church I salute in the blood of Jesus Christ, that is eternal and abiding joy, more especially if they are at one with the bishop and the presbyters who are with him, and with the deacons who have been appointed according to the mind of Jesus Christ, whom after His own will He confirmed and established by His Holy Spirit.
translation:
  language: pt
  text: Inácio, também chamado Teóforo[a], à igreja de Deus Pai e de Jesus Cristo que está em Filadélfia da Ásia. Ela alcançou misericórdia, está firmemente estabelecida na harmonia de Deus e se alegra, sem vacilar, nos sofrimentos de nosso Senhor e em sua ressurreição, plenamente convicta de toda misericórdia. Saúdo essa igreja no sangue de Jesus Cristo, que é alegria eterna e permanente, sobretudo se seus membros estiverem unidos ao bispo, aos presbíteros que estão com ele e aos diáconos designados segundo o pensamento de Jesus Cristo. Conforme a sua própria vontade, ele os fortaleceu e estabeleceu por meio de seu Espírito Santo.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Teóforo” pode significar “portador de Deus” ou “levado por Deus”; a forma do cognome permite mais de uma compreensão.
    reason: Preserva uma ambiguidade antiga relevante que não deve ser resolvida silenciosamente no texto.
  - marker: b
    text: Esta tradução é provisória, baseada no testemunho inglês de domínio público fornecido; ainda é necessária a revisão direta da tradição manuscrita grega da recensão média.
    reason: Declara com transparência a limitação da base documental desta etapa.
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Mantém o cognome tradicional e sua forma própria; uma nota preserva a possível força semântica do nome sem escolher entre interpretações antigas.
- source_word: passion
  choice: sofrimentos
  rationale: Comunica em português atual a paixão padecida por Cristo, evitando o sentido moderno predominante de forte emoção ou atração.
- source_word: concord
  choice: harmonia
  rationale: Expressa acordo e unidade ordenada em linguagem natural, sem reduzir o termo a mera concordância verbal.
- source_word: presbyters
  choice: presbíteros
  rationale: Conserva o título eclesial antigo reconhecível, sem substituí-lo por um cargo denominacional moderno.
- source_word: mind
  choice: pensamento
  rationale: Preserva a referência à disposição ou propósito de Jesus Cristo sem torná-la mais técnica do que o testemunho fornecido.
theological_decisions:
- issue: Relação entre o sangue de Jesus Cristo e a alegria eterna e permanente
  choice: “no sangue de Jesus Cristo, que é alegria eterna e permanente”
  alternative: Entender a alegria eterna e permanente como descrição da saudação ou da igreja
  rationale: A construção do testemunho associa mais diretamente a oração relativa ao sangue, embora a sintaxe seja densa; a tradução mantém essa ligação sem explicação doutrinária adicional.
- issue: Sujeito que fortalece e estabelece os ministros
  choice: “ele”, referindo-se a Jesus Cristo
  alternative: Deus Pai como sujeito implícito
  rationale: Jesus Cristo é o antecedente imediato no testemunho fornecido. A nota registra que a revisão direta do grego ainda está pendente, evitando alegar certeza superior à base disponível.
- issue: Unidade com a liderança da igreja
  choice: “se seus membros estiverem unidos ao bispo...”
  alternative: “se eles forem um com o bispo...”
  rationale: Explicita apenas o referente natural do pronome (“os membros” da igreja) para produzir português corrente, sem definir a natureza ou o alcance teológico dessa unidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregam-se termos eclesiais historicamente adequados (“bispo”, “presbíteros”, “diáconos”), sem importar estruturas denominacionais posteriores. A sintaxe longa do testemunho foi dividida em períodos para clareza, preservando suas relações principais.
