review_pass:
  verdict: revise
  source_fidelity: 'A revisão da formulação grega da recensão média indica duas correções importantes: a oração relativa que descreve a «alegria eterna e permanente» retoma «igreja» (feminino), não «sangue»; e o relativo final retoma os diáconos, não todos os três grupos ministeriais. «Paixão» preserva melhor o singular e o sentido técnico-histórico de πάθος do que «sofrimentos». A formulação revista mantém a densidade sintática e as ambiguidades que o texto permite.'
  naturalness: O texto revisto permanece em português moderno e claro. «Plenamente segura em toda misericórdia» é mais idiomático e semanticamente mais próximo que «plenamente convicta de toda misericórdia». «Na paixão de nosso Senhor» é natural no registro cristão histórico e não exige paráfrase.
  terminology: Mantêm-se «Teóforo», «bispo», «presbíteros» e «diáconos». «Paixão» é o equivalente preferível para o singular πάθος neste contexto. «Harmonia» traduz adequadamente ὁμόνοια sem impor um modelo eclesiológico posterior.
  issues:
  - severity: high
    issue: O antecedente de «que é alegria eterna e permanente» foi traduzido como «sangue de Jesus Cristo».
    rationale: Na tradição grega, o relativo feminino retoma «igreja» (ἐκκλησία, feminino). A tradução deve dizer que a igreja é a alegria eterna e permanente, ainda que o testemunho inglês fornecido possa sugerir outra ligação.
  - severity: high
    issue: «Ele os fortaleceu e estabeleceu» faz o pronome «os» abranger bispo, presbíteros e diáconos.
    rationale: O relativo grego no masculino plural segue imediatamente «diáconos» e os retoma especificamente. Além disso, o verbo é melhor vertido por «confirmou e estabeleceu» do que por «fortaleceu».
  - severity: medium
    issue: «Sofrimentos» plural para «passion».
    rationale: O original emprega o singular πάθος; «paixão» preserva o número e o uso histórico-cristológico sem necessidade de explicação interpretativa.
  - severity: low
    issue: «Plenamente convicta de toda misericórdia».
    rationale: «Convicta de» é menos natural e pode deslocar o sentido de πλήρης/πεπληροφορημένη. «Plenamente segura em toda misericórdia» conserva a imagem de plena certeza.
  revised_text: Inácio, também chamado Teóforo[a], à igreja de Deus Pai e de Jesus Cristo, que está em Filadélfia da Ásia, que alcançou misericórdia e está firmemente estabelecida na harmonia de Deus, e que se alegra na paixão de nosso Senhor e, sem vacilar, em sua ressurreição, plenamente segura em toda misericórdia. Saúdo essa igreja no sangue de Jesus Cristo; ela é alegria eterna e permanente, sobretudo se seus membros estiverem unidos ao bispo, aos presbíteros que estão com ele e aos diáconos designados segundo o pensamento de Jesus Cristo. Conforme a sua própria vontade, ele os confirmou e estabeleceu por meio de seu Espírito Santo.[b]
  revised_footnotes:
  - marker: a
    text: “Teóforo” pode significar “portador de Deus” ou “levado por Deus”; a forma do cognome permite mais de uma compreensão.
    reason: Preserva uma ambiguidade antiga relevante que não deve ser resolvida silenciosamente no texto.
  - marker: b
    text: Esta tradução é provisória, baseada no testemunho inglês de domínio público fornecido e confrontada com a formulação da tradição grega da recensão média indicada no contexto; a revisão crítica direta dos manuscritos gregos ainda é necessária.
    reason: Declara com transparência a limitação documental da etapa, sem atribuir à tradução uma certeza crítica que ela não possui.
  revision_rationale: 'A revisão corrige os dois antecedentes relativos decisivos: a igreja, e não o sangue, é chamada «alegria eterna e permanente»; os diáconos, e não todo o conjunto de ministros, são os que Cristo confirmou e estabeleceu. Também restaura o singular «paixão» e melhora a expressão de plena segurança em misericórdia. A associação de «sem vacilar» à ressurreição segue o testemunho inglês fornecido; sua colocação foi ajustada apenas para clareza portuguesa.'
