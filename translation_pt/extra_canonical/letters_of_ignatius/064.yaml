review_pass:
  verdict: revise
  source_fidelity: 'A redação preserva em geral a estrutura e os títulos eclesiais do testemunho. Contudo, a oração relativa depois de “no sangue de Jesus Cristo” deve retomar “igreja”, não “sangue”: no original grego, o relativo é feminino e se refere à igreja. A revisão também restaura de modo mais explícito “confirmou e estabeleceu” e emprega “paixão” para o termo técnico do sofrimento de Cristo.'
  naturalness: O texto é claro e adequado ao português moderno. Pequenos ajustes de pontuação e de referente tornam a frase sobre a alegria eterna mais clara sem simplificar indevidamente a sintaxe densa.
  terminology: “Teóforo”, “bispo”, “presbíteros” e “diáconos” são apropriados. “Paixão” é preferível a “sofrimentos” neste contexto, pois conserva a terminologia cristã antiga sem exigir uma interpretação doutrinária. “Pensamento” é possível para a expressão referente à disposição ou ao propósito de Jesus Cristo.
  issues:
  - severity: high
    issue: O relativo “que é alegria eterna e permanente” está ligado ao “sangue de Jesus Cristo”.
    rationale: A construção original emprega um relativo feminino, cujo antecedente é a igreja, não “sangue”. A tradução deve dizer explicitamente “a qual é alegria...” para preservar essa relação.
  - severity: medium
    issue: “Sofrimentos” substitui o termo técnico “paixão”.
    rationale: Embora comunique sofrimento, perde a designação tradicional e lexicalmente mais próxima do padecimento de Cristo no texto.
  - severity: medium
    issue: “Fortaleceu” não reproduz integralmente “confirmou e estabeleceu”.
    rationale: A dupla verbal do testemunho deve ser mantida; “confirmou” preserva a nuance de ratificação/firmamento sem apagar “estabeleceu”.
  revised_text: Inácio, também chamado Teóforo[a], à igreja de Deus Pai e de Jesus Cristo, que está em Filadélfia da Ásia. Ela alcançou misericórdia, está firmemente estabelecida na harmonia de Deus e se alegra na paixão de nosso Senhor e em sua ressurreição, sem vacilar, plenamente segura em toda misericórdia. Saúdo essa igreja no sangue de Jesus Cristo, a qual é alegria eterna e permanente, sobretudo se seus membros estiverem unidos ao bispo, aos presbíteros que estão com ele e aos diáconos designados segundo o pensamento de Jesus Cristo. Conforme a sua própria vontade, ele os confirmou e estabeleceu por meio de seu Espírito Santo.[b]
  revised_footnotes:
  - marker: a
    text: “Teóforo” pode significar “portador de Deus” ou “levado por Deus”; a forma do cognome permite mais de uma compreensão.
    reason: Preserva uma ambiguidade antiga relevante que não deve ser resolvida silenciosamente no texto.
  - marker: b
    text: Esta tradução é provisória, baseada no testemunho inglês de domínio público fornecido; ainda é necessária a revisão direta da tradição manuscrita grega da recensão média.
    reason: Declara com transparência a limitação da base documental desta etapa.
  revision_rationale: A revisão corrige o antecedente da oração relativa, que descreve a igreja como “alegria eterna e permanente”, e conserva mais de perto os termos e a sequência verbal do testemunho. A ambiguidade tradicional de “Teóforo” e a limitação documental da etapa permanecem devidamente assinaladas.
