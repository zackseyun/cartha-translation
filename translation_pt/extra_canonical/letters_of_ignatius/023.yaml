base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/023.yaml
  text: Ignatius, who is also called Theophorus, to her who has been blessed through the grace of God the Father in Christ Jesus our Savior, in whom I salute the church in Magnesia on the Maeander, and I wish her abundant greeting in God the Father and in Jesus Christ.
translation:
  language: pt
  text: Inácio, também chamado Teóforo, à igreja que foi abençoada pela graça de Deus Pai, em Cristo Jesus, nosso Salvador. Nele saúdo a igreja que está em Magnésia, junto ao Meandro, e lhe desejo abundantes saudações em Deus Pai e em Jesus Cristo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego ainda está pendente.
    reason: A base de elaboração declarada não inclui ainda verificação direta da tradição manuscrita grega.
lexical_decisions:
- source_word: Theophorus
  choice: Teóforo
  rationale: Mantém transliterado o cognome tradicional, sem impor uma interpretação etimológica específica.
- source_word: her / church
  choice: à igreja / lhe
  rationale: Explicita cedo o referente institucional que o testemunho inglês apresenta inicialmente por pronome feminino, produzindo português natural sem alterar o destinatário.
- source_word: Magnesia on the Maeander
  choice: Magnésia, junto ao Meandro
  rationale: Usa as formas portuguesas dos topônimos e expressa a relação geográfica de modo claro e idiomático.
- source_word: abundant greeting
  choice: abundantes saudações
  rationale: Preserva a intensidade da fórmula epistolar do testemunho, evitando uma paráfrase excessivamente interpretativa.
theological_decisions:
- issue: Agência da bênção e sua esfera cristológica
  choice: abençoada pela graça de Deus Pai, em Cristo Jesus
  alternative: abençoada por meio da graça de Deus Pai em Cristo Jesus
  rationale: Mantém tanto a graça do Pai como a expressão 'em Cristo Jesus', sem definir além do testemunho a relação exata entre meio e esfera.
- issue: Referente de 'Nele'
  choice: Nele saúdo a igreja
  alternative: por meio dele saúdo a igreja
  rationale: Preserva a formulação cristológica e sua possível amplitude sem reduzir a expressão a mera instrumentalidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A longa saudação foi dividida em duas frases para clareza, sem remover seus vínculos teológicos. O cognome tradicional foi transliterado e a incerteza decorrente da revisão grega pendente foi registrada em nota.
