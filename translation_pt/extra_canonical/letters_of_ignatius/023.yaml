review_pass:
  verdict: revise
  source_fidelity: 'É necessária correção segura do referente de «em quem»: a construção grega correspondente é feminina (ἐν ᾗ) e retoma a igreja destinatária, não Cristo. A formulação «Nele» altera tanto o gênero quanto o referente. O restante preserva adequadamente a saudação, os topônimos e a fórmula de votos.'
  naturalness: O texto é fluente e de registro epistolar digno. «Nela saúdo» é natural e torna explícita, em português, a retomada feminina presente no original. «Junto ao Meandro» é uma solução clara para a localização de Magnésia.
  terminology: «Teóforo» mantém de modo apropriado o cognome tradicional. «Deus Pai», «Cristo Jesus» e «nosso Salvador» são adequados. Mantém-se «em Cristo Jesus» e «em Deus Pai» sem converter essas expressões em uma interpretação instrumental ou doutrinária mais específica.
  issues:
  - severity: high
    issue: Referente e gênero de «Nele»
    rationale: O pronome traduzido por «em quem» no texto de base corresponde a um relativo feminino e retoma a igreja («aquela que foi abençoada»). «Nele» introduz um antecedente masculino e desloca a saudação para Cristo; deve ser «Nela».
  revised_text: Inácio, também chamado Teóforo, à igreja que foi abençoada pela graça de Deus Pai, em Cristo Jesus, nosso Salvador. Nela saúdo a igreja que está em Magnésia, junto ao Meandro, e lhe desejo abundantes saudações em Deus Pai e em Jesus Cristo.[a]
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto grego ainda está pendente.
    reason: A base de elaboração declarada não inclui ainda verificação direta da tradição manuscrita grega.
  revision_rationale: Substitui-se somente «Nele» por «Nela», pois o relativo feminino da saudação retoma a igreja destinatária. A nota de procedência permanece necessária enquanto a revisão direta do grego estiver pendente.
