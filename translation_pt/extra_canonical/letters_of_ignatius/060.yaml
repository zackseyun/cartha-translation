review_pass:
  verdict: revise
  source_fidelity: 'A revisão conserva o sentido do testemunho inglês e melhora pontos em que o português afastava levemente a expressão de seus prováveis equivalentes gregos: “os que estão presentes” para o grupo que está junto de Inácio; “disposição voltada para Deus” para a orientação interior; “apego à matéria” para o fogo de anseio material; e “descendência de Davi” para a fórmula genealógica. O sinal editorial em “[Pois]” permanece explicitamente assinalado.'
  naturalness: A redação revista mantém um registro exortativo e solene, mas usa construções mais naturais em português contemporâneo, em especial “os que estão presentes”, “entre vocês”, “acreditem no que lhes escrevo” e “Vem para o Pai”.
  terminology: Foram preservados “governante deste mundo”, “Jesus Cristo”, “pão de Deus”, “carne de Cristo”, “descendência de Davi” e “amor incorruptível”. “Apego à matéria” exprime com mais precisão a imagem ascética sem lhe impor leitura doutrinária.
  issues:
  - severity: medium
    issue: “que estão perto” e “disposição para com Deus” são formulações menos precisas/naturais.
    rationale: O contexto se dirige aos que estão presentes junto do autor, e a expressão sobre a mente orientada a Deus é mais idiomática como “disposição voltada para Deus”.
  - severity: medium
    issue: “anseio material” enfraquece a imagem do apego à matéria.
    rationale: A formulação revista preserva melhor a construção em que há um “fogo” associado ao amor/apego pela matéria, sem transformar o próprio fogo em um anseio genérico.
  - severity: low
    issue: “linhagem de Davi” é inteligível, mas “descendência de Davi” corresponde mais diretamente à fórmula genealógica do testemunho.
    rationale: A alteração mantém português corrente e conserva a relação tradicional com a descendência davídica.
  revised_text: 'O governante deste mundo quer me despedaçar e corromper minha disposição voltada para Deus. Portanto, nenhum de vocês que estão presentes o ajude. Em vez disso, fiquem do meu lado — isto é, do lado de Deus. Não falem de Jesus Cristo ao mesmo tempo que desejam o mundo. Não deixem que a inveja encontre morada em vocês.


    Mesmo que eu próprio, quando estiver entre vocês, venha a suplicar-lhes, não me obedeçam; antes, acreditem no que lhes escrevo. [Pois]ᵃ escrevo a vocês ainda em vida, mas ansiando pela morte. Meu desejo foi crucificado, e não há em mim fogo de apego à matéria; há somente água viva, que fala dentro de mim e diz: “Vem para o Pai”.


    Não encontro prazer no alimento da corrupção nem nos prazeres desta vida. Desejo o pão de Deus, que é a carne de Cristo, que é da descendência de Davi; e, como bebida, desejo o sangue dele, que é amor incorruptível.'
  revised_footnotes:
