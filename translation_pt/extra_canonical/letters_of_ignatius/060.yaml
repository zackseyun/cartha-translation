base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/060.yaml
  text: 'The ruler of this world wants to tear me to pieces and corrupt my mind toward God. Therefore, let none of you who are near help him. Instead, stand on my side—that is, on God’s side. Do not speak of Jesus Christ while also desiring the world. Do not let envy make its home in you.


    Even if I myself, when I am with you, should plead with you, do not obey me. Instead, believe what I am writing to you. [For] I write to you while still alive, yet longing for death. My desire has been crucified, and there is no fire of material longing in me. There is only living water, speaking within me and saying, “Come to the Father.”


    I take no delight in the food of corruption or in the pleasures of this life. I desire the bread of God, which is the flesh of Christ, who was from the seed of David; and as my drink I desire his blood, which is incorruptible love.'
translation:
  language: pt
  text: 'O governante deste mundo quer me despedaçar e corromper minha disposição para com Deus. Portanto, nenhum de vocês que estão perto o ajude. Em vez disso, fiquem do meu lado, isto é, do lado de Deus. Não falem de Jesus Cristo ao mesmo tempo que desejam o mundo. Não deixem que a inveja encontre morada em vocês.


    Mesmo que eu próprio, quando estiver com vocês, venha a suplicar-lhes, não me obedeçam; antes, deem crédito ao que lhes escrevo. [Pois][a] escrevo a vocês ainda em vida, mas ansiando pela morte. Meu desejo foi crucificado, e não há em mim fogo algum de anseio material; há somente água viva, que fala dentro de mim e diz: “Venha para o Pai”.


    Não encontro prazer no alimento da corrupção nem nos prazeres desta vida. Desejo o pão de Deus, que é a carne de Cristo, descendente da linhagem de Davi; e, como bebida, desejo o sangue dele, que é amor incorruptível.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pois” aparece entre colchetes no testemunho utilizado, indicando uma restauração editorial; a revisão direta do grego ainda está pendente.
    reason: Preservar de modo transparente o sinal editorial presente na fonte de redação.
lexical_decisions:
- source_word: prince/ruler of this world
  choice: governante deste mundo
  rationale: Expressão natural e digna que preserva o título e sua ressonância joanina sem especificar além do testemunho fornecido.
- source_word: mind to Godward
  choice: disposição para com Deus
  rationale: Preserva a orientação interior para Deus; evita reduzir a expressão apenas ao intelecto.
- source_word: lust/desire
  choice: desejo
  rationale: Mantém a amplitude da linguagem ascética e a ligação com o verbo desejar, sem impor necessariamente uma conotação sexual.
- source_word: food of corruption
  choice: alimento da corrupção
  rationale: Mantém a metáfora e a ambiguidade entre alimento perecível e aquilo que pertence à corrupção.
- source_word: seed of David
  choice: linhagem de Davi
  rationale: Comunica em português corrente a descendência davídica, sem perder o sentido genealógico.
- source_word: incorruptible love
  choice: amor incorruptível
  rationale: Preserva a identificação direta e teologicamente densa do sangue com o amor incorruptível.
theological_decisions:
- issue: Identificação do governante deste mundo
  choice: Mantido como título, sem explicação no corpo do texto
  alternative: Explicitar “Satanás” ou “o diabo”
  rationale: O texto testemunhado usa um título alusivo; explicitá-lo resolveria uma referência que o original deixa implícita.
- issue: Pão de Deus e carne de Cristo
  choice: Mantida a afirmação direta “que é a carne de Cristo”
  alternative: Parafrasear em termos simbólicos ou sacramentais específicos
  rationale: A formulação deve conservar sua força e tensão próprias, sem importar uma interpretação denominacional.
- issue: Sangue como amor incorruptível
  choice: Mantida a construção identificadora
  alternative: Traduzir como “o sangue dele, isto é, seu amor incorruptível”
  rationale: A redação direta conserva a densidade poética e teológica do testemunho, sem converter a relação em mera explicação.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom exortativo e solene. Empregou-se “vocês” para clareza contemporânea e plurais verbais inequívocos. Como a revisão direta do grego está pendente, a redação permanece conscientemente próxima do testemunho inglês de domínio público, preservando suas ambiguidades e o marcador editorial.
