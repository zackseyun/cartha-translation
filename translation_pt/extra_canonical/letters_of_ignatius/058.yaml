base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/058.yaml
  text: 'From Syria all the way to Rome, I fight with wild beasts, on land and sea, night and day, bound among ten leopards—that is, a company of soldiers—who only grow worse when they are treated kindly. Yet through their wrongdoing I become more fully a disciple, though I am not thereby justified.


    May I have joy from the beasts prepared for me. I pray that I may find them ready; indeed, I will entice them to devour me quickly, unlike what they have done to some, refusing out of fear to touch them. Even if they are unwilling while I am ready, I myself will force them to it.


    Bear with me. I know what is best for me. Now I am beginning to be a disciple. Let nothing visible or invisible envy me, so that I may attain to Jesus Christ. Let fire and cross come, grappling with wild beasts, [cuttings and manglings,] wrenching of bones, hacking off of limbs, crushing of my whole body; let the cruel tortures of the devil come upon me. Only let me attain to Jesus Christ.'
translation:
  language: pt
  text: 'Da Síria até Roma, luto contra feras, por terra e por mar, noite e dia, acorrentado entre dez leopardos — isto é, um destacamento de soldados —, que só se tornam piores quando são tratados com bondade. Contudo, por meio dos maus-tratos deles, torno-me discípulo mais plenamente; nem por isso, porém, sou justificado.


    Que eu possa alegrar-me com as feras preparadas para mim. Oro para encontrá-las prontas; eu até as provocarei, para que me devorem depressa, ao contrário do que fizeram com alguns, quando, por medo, se recusaram a tocá-los. E, mesmo que elas próprias não queiram, embora eu esteja pronto, eu as forçarei.


    Tenham paciência comigo. Sei o que é melhor para mim. Agora começo a ser discípulo. Que nada, entre as coisas visíveis ou invisíveis, me impeça por inveja de alcançar Jesus Cristo. Venham o fogo e a cruz, a luta corpo a corpo com as feras, [os cortes e as mutilações],[a] o deslocamento dos ossos, o decepamento dos membros, o esmagamento do corpo inteiro; venham sobre mim as cruéis torturas do diabo. Que eu apenas alcance Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes são preservadas do testemunho de tradução fornecido e sinalizam incerteza textual ou editorial; a confirmação pela tradição manuscrita grega ainda está pendente.
    reason: O testemunho inglês põe “cuttings and manglings” entre colchetes, e o material fornecido informa que esse sinal deve ser preservado até a revisão direta do grego.
lexical_decisions:
- source_word: θηριομαχῶ (thēriomachō)
  choice: luto contra feras
  rationale: Preserva a imagem concreta de combate e também sua aplicação inicial aos guardas, sem reduzi-la apenas a uma metáfora.
- source_word: δέκα λεοπάρδοις (deka leopardois)
  choice: dez leopardos
  rationale: Mantém a metáfora vívida, explicada pelo próprio autor como um destacamento de soldados.
- source_word: μαθητής (mathētēs)
  choice: discípulo
  rationale: Conserva o vocabulário formativo e religioso do texto, inclusive a tensão entre tornar-se discípulo e não ser justificado por isso.
- source_word: δεδικαίωμαι (dedikaiōmai)
  choice: sou justificado
  rationale: Mantém a formulação teológica e forense sem substituí-la por ideias interpretativas como inocência, mérito ou salvação.
- source_word: ἐπιτυχεῖν Ἰησοῦ Χριστοῦ (epitychein Iēsou Christou)
  choice: alcançar Jesus Cristo
  rationale: Reproduz o sentido de chegar a, obter ou atingir o objetivo, sem explicitar além do texto como essa união deve ser entendida.
- source_word: κολακευόμενοι (kolakeuomenoi) / expressão correspondente no testemunho
  choice: tratados com bondade
  rationale: Segue o sentido contextual do testemunho fornecido; evita o pouco natural “lisonjeados”, embora a revisão direta do grego ainda seja necessária.
theological_decisions:
- issue: Relação entre sofrimento, discipulado e justificação
  choice: “torno-me discípulo mais plenamente; nem por isso, porém, sou justificado”
  alternative: “me aperfeiçoo como discípulo, mas isso não me torna justo”
  rationale: A opção escolhida conserva a tensão e o vocabulário teológico do texto, sem afirmar que o martírio produz mérito justificante nem definir uma doutrina posterior de justificação.
- issue: Desejo de martírio e agência sobre as feras
  choice: Manter as declarações fortes “as provocarei” e “eu as forçarei”
  alternative: Abrandar para “não fugirei delas”
  rationale: O tom extremo e retórico pertence ao argumento de Inácio e não deve ser suavizado por preocupações interpretativas modernas.
- issue: “Coisas visíveis ou invisíveis” como agentes de inveja
  choice: “Que nada, entre as coisas visíveis ou invisíveis, me impeça por inveja”
  alternative: “Que nenhuma coisa visível ou invisível tenha inveja de mim”
  rationale: Torna a personificação inteligível em português sem decidir se a referência aponta especificamente para seres humanos, poderes espirituais ou obstáculos em geral.
- issue: “Torturas do diabo”
  choice: “as cruéis torturas do diabo”
  alternative: “as cruéis torturas infligidas pelo diabo”
  rationale: 'Preserva a ambiguidade do genitivo: as torturas podem ser associadas ao diabo sem definir com precisão o modo de agência.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução procura preservar o ritmo crescente e a linguagem corporal intensa do trecho. Como a revisão direta da fonte grega está explicitamente pendente, o texto foi elaborado a partir do testemunho público inglês auditado, com cautela especial nas decisões lexicais atribuídas ao grego e sem tratar reconstruções inferidas como definitivas.
