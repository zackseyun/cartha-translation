base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/057.yaml
  text: 'I write to all the churches, and I want everyone to know that I willingly die for God—unless you hinder me. I urge you: do not show me kindness at the wrong time. Let me be given to the wild beasts, for through them I can reach God. I am God’s wheat, and I am ground by the teeth of wild beasts so that I may be found to be pure bread [of Christ].


    Instead, entice the wild beasts, so that they may become my grave and leave no part of my body behind. Then, when I have fallen asleep, I will not be a burden to anyone. I will truly be a disciple of Jesus Christ when the world does not even see my body. Plead with the Lord for me, so that through these instruments I may be found to be a sacrifice to God.


    I do not command you as Peter and Paul did. They were apostles; I am a convict. They were free, but I am a slave even to this hour. Yet if I suffer, then I will be a freedman of Jesus Christ, and I will rise free in him. Now, in my chains, I am learning to put away every desire.'
translation:
  language: pt
  text: 'Escrevo a todas as igrejas e declaro a todos que morro por Deus de livre vontade — a menos que vocês me impeçam. Exorto vocês: não me demonstrem uma bondade fora de hora. Deixem que eu seja entregue às feras, pois por meio delas posso chegar a Deus. Sou trigo de Deus e sou moído pelos dentes das feras, para que eu seja achado pão puro [de Cristo].[a]


    Em vez disso, atraiam as feras, para que se tornem meu túmulo e não deixem para trás nenhuma parte do meu corpo; assim, depois que eu adormecer, não serei um peso para ninguém. Então serei verdadeiramente discípulo de Jesus Cristo, quando o mundo já nem sequer vir meu corpo. Supliquem ao Senhor por mim, para que, por meio desses instrumentos, eu seja achado um sacrifício para Deus.


    Não lhes dou ordens como Pedro e Paulo davam. Eles eram apóstolos; eu sou um condenado. Eles eram livres; eu, porém, sou escravo até esta hora. Mas, se eu sofrer, então serei um liberto de Jesus Cristo e ressuscitarei livre nele. Agora, em minhas correntes, estou aprendendo a abandonar todo desejo.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras “de Cristo” aparecem entre colchetes no testemunho utilizado, sinalizando incerteza ou restauração textual. A revisão direta do grego ainda está pendente.
    reason: Preservar de modo transparente o sinal crítico do testemunho-base.
  - marker: b
    text: “Todo desejo” também pode ser entendido como “toda paixão” ou “todo anseio”; o termo não é qualificado explicitamente aqui.
    reason: Registrar a amplitude lexical e evitar que a tradução defina o desejo como necessariamente mau.
lexical_decisions:
- source_word: ἐπιτυχεῖν θεοῦ (reconstructed from the middle-recension Greek tradition; direct review pending)
  choice: chegar a Deus
  rationale: Mantém a ideia de alcançar ou chegar a Deus sem explicitar além do testemunho a natureza dessa união ou destino.
- source_word: σῖτός εἰμι θεοῦ
  choice: Sou trigo de Deus
  rationale: Preserva literalmente a metáfora agrícola central e sua progressão para o pão.
- source_word: κατάκριτος / convict (witness)
  choice: condenado
  rationale: No contexto de prisão e execução, comunica melhor uma pessoa sob sentença do que o moderno 'presidiário', sem sugerir necessariamente uma categoria penal contemporânea.
- source_word: ἀπελεύθερος Ἰησοῦ Χριστοῦ
  choice: liberto de Jesus Cristo
  rationale: Conserva a imagem jurídica e social do escravo alforriado, bem como a relação expressa pelo genitivo, sem reduzi-la simplesmente a 'livre'.
- source_word: ἐπιθυμίαν
  choice: desejo
  rationale: Mantém a amplitude possível do termo, que pode abranger desejo, anseio ou paixão, evitando qualificá-lo automaticamente como pecaminoso.
theological_decisions:
- issue: Sentido de morrer 'por Deus' e chegar a Deus mediante as feras
  choice: Preservar as formulações 'morro por Deus' e 'por meio delas posso chegar a Deus'
  alternative: Interpretar como 'morro pela causa de Deus' e 'entro na presença de Deus'
  rationale: O texto associa martírio, entrega e chegada a Deus, mas não define completamente a relação; a tradução evita resolver essa tensão.
- issue: Expressão textualmente sinalizada 'de Cristo'
  choice: Manter os colchetes em '[de Cristo]' e acrescentar nota
  alternative: Incorporar 'de Cristo' sem marca ou omitir a expressão
  rationale: Os colchetes do testemunho fornecido indicam incerteza ou restauração textual e devem permanecer visíveis.
- issue: Liberdade adquirida mediante o sofrimento
  choice: Traduzir 'serei um liberto de Jesus Cristo e ressuscitarei livre nele'
  alternative: Parafrasear como libertação espiritual plena
  rationale: Preserva a metáfora escravo/liberto e a formulação escatológica sem impor uma teoria específica do martírio ou da salvação.
- issue: Pedido para atrair as feras
  choice: Traduzir diretamente 'atraiam as feras'
  alternative: Atenuar para 'não afastem as feras'
  rationale: A força retórica do testemunho é deliberadamente extrema; suavizá-la alteraria a voz e a teologia martirial do autor.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento plural por “vocês”. Mantiveram-se as metáforas fortes do martírio, da escravidão e da alforria. Como o material fornecido declara que a revisão direta do grego está pendente, o texto é um rascunho crítico fundamentado prioritariamente no testemunho público de Lightfoot e auditado pela POB inglesa; decisões atribuídas ao grego são provisórias.
