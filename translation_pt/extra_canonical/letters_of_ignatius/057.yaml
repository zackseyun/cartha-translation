source:
  text: 'I write to all the churches, and I bid all men know, that of my own free will I die for God unless Ye should hinder me. I exhort you, be ye not an unseasonable kindness to me. Let me be given to the wild beasts, for through them I can attain unto God. I am God''s wheat, and I am ground by the teeth of wild beasts that I may be found pure bread [of Christ].


    Rather entice the wild beasts, that they may become my sepulchre and may leave no part of my body behind, so that I may not, when I am fallen asleep, be burdensome to any one. Then shall I be truly a disciple of Jesus Christ, when the world shall not so much as see my body. Supplicate the Lord for me, that through these instruments I may be found a sacrifice to God.


    I do not enjoin you, as Peter and Paul did. They were Apostles, I am a convict; they were free, but I am a slave to this very hour. Yet if I shall suffer, then am I a freed-man of Jesus Christ, and I shall rise free in Him. Now I am learning in my bonds to put away every desire.'
