review_pass:
  verdict: revise
  source_fidelity: 'O rascunho acompanha de perto o testemunho inglês e conserva adequadamente as imagens deliberadamente extremas do martírio, do trigo/pão e da escravidão/alforria. Mantém também, de forma correta e transparente, os colchetes em “[de Cristo]”. A principal revisão é estilística e discursiva: “Pelo contrário” reproduz melhor o valor adversativo de “Rather” do que “Em vez disso”, sem supor uma alternativa não expressa.'
  naturalness: O português é geralmente claro, moderno e adequado ao registro epistolar. Ajustou-se a transição adversativa e simplificou-se levemente a formulação de “não lhes dou ordens”, para maior naturalidade sem perda de força.
  terminology: “Trigo de Deus”, “feras”, “condenado”, “escravo”, “liberto” e “correntes” preservam as metáforas e categorias do testemunho. “Desejo” continua sendo uma escolha ampla e não moralizante para o termo final.
  issues:
  - severity: low
    issue: “Em vez disso” para “Rather”
    rationale: “Em vez disso” pode sugerir a substituição de uma ação previamente proposta. No contexto, o autor intensifica a súplica anterior; “Pelo contrário” preserva melhor o movimento adversativo/exortativo do testemunho.
  - severity: low
    issue: “Não lhes dou ordens como Pedro e Paulo davam”
    rationale: O verbo explícito “davam” soa um pouco pesado e pode sugerir hábito. “Não lhes dou ordens como Pedro e Paulo” é mais idiomático e mantém a comparação elíptica do original e do testemunho.
