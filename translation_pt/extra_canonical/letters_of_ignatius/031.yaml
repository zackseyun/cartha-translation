base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/031.yaml
  text: 'Do not be led astray by strange teachings or by ancient fables, which are useless. For if we still live according to Judaism even to this day, we admit that we have not received grace.


    For the divine prophets lived after Christ Jesus. For this reason they were also persecuted, being inspired by his grace, so that those who are disobedient might be fully convinced that there is one God, who manifested himself through Jesus Christ his Son. He is his Word who proceeded from silence and who in every way was well-pleasing to the one who sent him.'
translation:
  language: pt
  text: 'Não se deixem enganar por doutrinas estranhas nem por fábulas antigas, que não têm proveito algum. Pois, se ainda hoje vivemos segundo o judaísmo, confessamos que não recebemos a graça.


    De fato, os profetas divinos viveram segundo Cristo Jesus.[a] Por essa razão, também foram perseguidos, inspirados pela graça dele, para que os desobedientes fossem plenamente convencidos de que há um só Deus, o qual se manifestou por meio de Jesus Cristo, seu Filho. Ele é a sua Palavra, que procedeu do silêncio[b] e que em todas as coisas agradou àquele que o enviou.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «viveram de acordo com Cristo Jesus». A expressão apresenta os profetas como orientados por Cristo, embora tenham vivido antes de sua manifestação histórica; o texto não explica mais precisamente essa relação.'
    reason: Preserva e sinaliza a tensão temporal e teológica da frase.
  - marker: b
    text: «Procedeu do silêncio» é uma formulação condensada e de interpretação incerta. Pode evocar a revelação da Palavra antes oculta, mas o texto não identifica explicitamente o «silêncio».
    reason: Evita transformar uma imagem ambígua em afirmação doutrinária definida.
lexical_decisions:
- source_word: ἑτεροδοξίαις
  choice: doutrinas estranhas
  rationale: Preserva a ideia de ensinos alheios ou divergentes sem introduzir o termo técnico e denominacionalmente carregado «heresias».
- source_word: παλαιοῖς μύθοις
  choice: fábulas antigas
  rationale: Mantém tanto a antiguidade quanto o caráter de narrativa mítica ou não confiável da expressão.
- source_word: Ἰουδαϊσμόν
  choice: judaísmo
  rationale: É a correspondência direta e historicamente reconhecível, sem ampliar a referência para o povo judeu em geral.
- source_word: ἔζησαν κατὰ Χριστὸν Ἰησοῦν
  choice: viveram segundo Cristo Jesus
  rationale: Conserva a formulação paradoxal de Inácio e evita resolver a ambiguidade como se significasse apenas que os profetas predisseram Cristo.
- source_word: Λόγος
  choice: Palavra
  rationale: Traduz o título cristológico Logos em linguagem bíblica corrente e mantém a personificação por meio da inicial maiúscula.
- source_word: ἀπὸ σιγῆς προελθών
  choice: que procedeu do silêncio
  rationale: Reproduz a expressão teologicamente densa sem explicar de modo especulativo o que é o «silêncio».
- source_word: εὐηρέστησεν
  choice: agradou
  rationale: Expressa de modo natural a ideia de ser plenamente agradável, sem perder a relação com aquele que enviou o Filho.
theological_decisions:
- issue: A relação dos profetas anteriores a Jesus com Cristo
  choice: «viveram segundo Cristo Jesus»
  alternative: «viveram na expectativa de Cristo Jesus» ou «viveram conforme os ensinamentos de Cristo Jesus»
  rationale: A construção afirma uma relação temporal e teológica deliberadamente tensa; as alternativas explicariam além do que o texto diz.
- issue: Manifestação do único Deus por meio do Filho
  choice: «um só Deus, o qual se manifestou por meio de Jesus Cristo, seu Filho»
  alternative: «um só Deus, manifestado como Jesus Cristo»
  rationale: Mantém a mediação expressa por «por meio de» e a distinção relacional entre Deus e seu Filho, sem impor formulação dogmática posterior.
- issue: A Palavra que procede do silêncio
  choice: expressão mantida literalmente, com nota de cautela
  alternative: interpretar «silêncio» como o Pai, a eternidade ou o mistério oculto
  rationale: A imagem admite mais de uma leitura histórica e teológica; não deve ser silenciosamente definida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural «vocês» fica implícito nas formas verbais «se deixem». Mantiveram-se as imagens e tensões cristológicas do testemunho, sem arcaísmos desnecessários. Como a revisão direta do grego ainda está pendente, as decisões foram tomadas com base no testemunho inglês fornecido e em formas gregas tradicionalmente atestadas para a recensão média.
