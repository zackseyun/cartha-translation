base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/004.yaml
  text: 'I do not command you as though I were someone important. For even though I am in chains for the sake of the Name, I have not yet been perfected in Jesus Christ. [For] I am only now beginning to be a disciple, and I speak to you as my fellow students. For I ought to be trained by you for the contest in faith, admonition, endurance, and patience.


    But since love does not allow me to remain silent concerning you, I was therefore eager to exhort you to run in harmony with the mind of God. For Jesus Christ also, our inseparable life, is the mind of the Father, just as the bishops established in the farthest parts of the earth are in the mind of Jesus Christ.'
translation:
  language: pt
  text: 'Não lhes dou ordens como se eu fosse alguém importante. Pois, embora esteja acorrentado por causa do Nome, ainda não fui aperfeiçoado em Jesus Cristo. [Pois][a] somente agora começo a ser discípulo, e falo com vocês como a companheiros de aprendizado. Porque eu deveria ser treinado por vocês para a luta, na fé, na admoestação, na perseverança e na paciência.


    Mas, visto que o amor não me permite ficar calado a respeito de vocês, apressei-me a exortá-los a correr em harmonia com o pensamento de Deus. Pois Jesus Cristo, nossa vida inseparável, é também o pensamento do Pai, assim como os bispos estabelecidos nas regiões mais distantes da terra estão em harmonia com o pensamento de Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra “Pois” é preservada entre colchetes porque o testemunho de tradução fornecido a apresenta como restauração textual; a revisão direta do grego ainda está pendente.
    reason: Sinalizar com transparência a incerteza textual herdada da base provisória.
lexical_decisions:
- source_word: ὄνομα / “the Name” (as reflected in the witness)
  choice: o Nome
  rationale: Mantém a forma reverente e alusiva do testemunho, sem explicitar um referente que o texto deixa implícito.
- source_word: συμμαθηταί / “school-fellows” (as reflected in the witness)
  choice: companheiros de aprendizado
  rationale: Expressa a imagem de pessoas que aprendem juntas em português atual, preservando o tom humilde de Inácio.
- source_word: ἀγών / “contest” (as reflected in the witness)
  choice: luta
  rationale: Conserva a metáfora de esforço e combate sem restringi-la artificialmente a uma competição atlética.
- source_word: γνώμη / “mind” (as reflected in the witness)
  choice: pensamento
  rationale: Preserva a ideia ampla de mente, propósito ou disposição, evitando resolver a polissemia em favor de apenas uma dessas nuances.
- source_word: μακροθυμία / “long-suffering” (as reflected in the witness)
  choice: paciência
  rationale: Forma natural e clara em português para a disposição de suportar dificuldades por longo tempo.
theological_decisions:
- issue: O referente de “o Nome”
  choice: Manter “o Nome” sem expansão
  alternative: “o nome de Jesus Cristo”
  rationale: O testemunho fornecido emprega uma designação reverente implícita; explicitá-la eliminaria uma característica genuína da formulação.
- issue: Jesus Cristo como “pensamento do Pai”
  choice: Preservar a predicação direta
  alternative: “está de acordo com a vontade do Pai”
  rationale: A alternativa explicaria e reduziria a força da formulação; a tradução conserva a linguagem elevada e a tensão teológica do texto.
- issue: Bispos “no pensamento de Jesus Cristo”
  choice: Traduzir como “em harmonia com o pensamento de Jesus Cristo”
  alternative: “são a mente de Jesus Cristo”
  rationale: A construção paralela parece indicar consonância ou alinhamento, não identidade; a formulação evita atribuir aos bispos a mesma predicação feita sobre Cristo em relação ao Pai.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “vocês”. A redação é provisória porque o material fornecido informa que a revisão direta da tradição manuscrita grega da recensão média ainda está pendente. Procurou-se preservar o paralelismo, a humildade retórica e as metáforas de discipulado, treinamento, luta e corrida.
