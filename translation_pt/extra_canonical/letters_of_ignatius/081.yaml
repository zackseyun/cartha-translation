base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/081.yaml
  text: 'But certain people ignorantly deny Him—or rather, have been denied by Him—being advocates of death rather than of the truth; and they have not been persuaded by the prophecies, nor by the law of Moses, nor even to this very hour by the Gospel, nor by the sufferings of each of us severally; for they are of the same mind also concerning us.


    For what profit is it [to me], if someone praises me but blasphemes my Lord, not confessing that He was a bearer of flesh? Yet whoever does not affirm this thereby denies Him altogether, being himself a bearer of a corpse.


    But their names, being unbelievers, I have not thought fit to record in writing—nay, far be it from me even to remember them—until they repent and return to the passion, which is our resurrection.'
translation:
  language: pt
  text: 'Mas certas pessoas, por ignorância, o negam — ou, melhor dizendo, foram negadas por ele —, pois defendem a morte em vez da verdade. Elas não foram persuadidas pelas profecias, nem pela Lei de Moisés, nem, até esta mesma hora, pelo evangelho, nem pelos sofrimentos de cada um de nós; pois também a nosso respeito pensam da mesma maneira.


    Pois de que me adianta alguém me elogiar, mas blasfemar contra o meu Senhor, sem confessar que ele veio em carne?[a] Quem não afirma isso o nega por completo, sendo ele próprio portador de um cadáver.[b]


    Quanto aos nomes deles, por serem descrentes, não considerei apropriado registrá-los por escrito. Longe de mim até mesmo lembrá-los, enquanto não se arrependerem e retornarem à paixão, que é a nossa ressurreição.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mais literalmente: “sem confessar que ele era portador de carne”. A expressão afirma a realidade da carne assumida pelo Senhor.'
    reason: Preservar a metáfora do testemunho e sua ligação com o contraste da frase seguinte.
  - marker: b
    text: “Portador de um cadáver” reproduz o contraste incisivo com “portador de carne”; a imagem não é suavizada no texto.
    reason: Sinalizar a formulação incomum e retoricamente intencional.
lexical_decisions:
- source_word: σαρκοφόρον
  choice: veio em carne
  rationale: Expressa em português corrente a afirmação cristológica de que o Senhor realmente assumiu e portou carne; a nota preserva a imagem mais literal, importante para o contraste retórico.
- source_word: νεκροφόρος
  choice: portador de um cadáver
  rationale: Mantém a imagem deliberadamente áspera e o jogo de contraste com 'portador de carne', sem suavizá-lo para uma interpretação abstrata.
- source_word: πάθος
  choice: paixão
  rationale: No contexto, designa os sofrimentos e a morte de Cristo; 'paixão' preserva o termo tradicional e a ligação com a confissão cristológica do autor.
- source_word: ἀρνηθέντες ὑπ’ αὐτοῦ
  choice: foram negadas por ele
  rationale: 'Preserva a inversão enfática e teologicamente tensa: não apenas negam Cristo, mas são por ele negadas.'
theological_decisions:
- issue: Realidade da encarnação
  choice: sem confessar que ele veio em carne
  alternative: sem confessar que ele era portador de carne
  rationale: A formulação principal comunica com naturalidade a realidade corporal da vinda de Cristo, enquanto a nota conserva a metáfora literal e seu paralelo com 'portador de um cadáver'.
- issue: A paixão como nossa ressurreição
  choice: retornarem à paixão, que é a nossa ressurreição
  alternative: retornarem à fé na paixão, pela qual ressuscitamos
  rationale: Mantém a identificação compacta e paradoxal do texto, sem acrescentar explicações causais ou doutrinárias ausentes do testemunho.
- issue: Negação por Cristo
  choice: ou, melhor dizendo, foram negadas por ele
  alternative: ou, antes, ele as rejeitou
  rationale: Preserva a correspondência verbal entre negar Cristo e ser negado por ele, sem reduzir a expressão a uma rejeição genérica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a repetição de 'nem', a inversão 'foram negadas por ele', o contraste corporal e a afirmação paradoxal de que a paixão é nossa ressurreição. Como a revisão direta do grego está indicada como pendente, as decisões seguem prudentemente o testemunho inglês fornecido e registram em nota a imagem literal mais relevante.
