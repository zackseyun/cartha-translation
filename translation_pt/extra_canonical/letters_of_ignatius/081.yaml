review_pass:
  verdict: revise
  source_fidelity: A revisão é necessária porque «veio em carne» interpreta e substitui a imagem deliberada do testemunho («era portador de carne»), enfraquecendo o paralelismo antitético com «portador de um cadáver». A versão revista preserva ambas as imagens e mantém o sinal editorial do acréscimo [para mim].
  naturalness: O texto revisto mantém português moderno e fluente, com formulações mais diretas como «são defensoras da morte» e «pensam o mesmo a nosso respeito», sem diluir o tom polêmico e epistolar do autor.
  terminology: «Portador de carne» e «portador de um cadáver» preservam o contraste retórico ligado a σαρκοφόρος/νεκροφόρος. «Paixão» é mantido como termo tradicional para πάθος, sem explicação doutrinária acrescentada. «Incrédulos» traduz adequadamente o qualificativo do testemunho neste contexto.
  issues:
  - severity: medium
    issue: A expressão principal «ele veio em carne» substitui a metáfora corporal do texto-fonte.
    rationale: Embora a nota registre uma alternativa literal, o corpo do texto deixa de apresentar o paralelo intencional entre «portador de carne» e «portador de um cadáver». Como a imagem é central à formulação, ela deve ser preservada no texto.
  - severity: low
    issue: Falta no texto português o sinal de restauração editorial correspondente a «[to me]».
    rationale: O testemunho inglês e o POB inglês preservam os colchetes. «[para mim]» permite conservar a incerteza/restauração sem tornar a frase incompreensível.
  revised_text: 'Mas certas pessoas o negam por ignorância — ou, antes, foram por ele negadas —, pois são defensoras da morte, e não da verdade; e não se deixaram convencer nem pelas profecias, nem pela Lei de Moisés, nem, até o dia de hoje, pelo evangelho, nem pelos sofrimentos de cada um de nós; pois também pensam o mesmo a nosso respeito.


    Pois que proveito há [para mim] se alguém me elogia, mas blasfema contra o meu Senhor, sem confessar que ele é portador de carne?[a] Mas quem não afirma isso, por isso mesmo o nega inteiramente, sendo ele próprio portador de um cadáver.[b]


    Quanto aos nomes deles, por serem incrédulos, não achei adequado registrá-los por escrito — não, longe de mim até mesmo recordá-los —, até que se arrependam e retornem à paixão, que é a nossa ressurreição.'
  revised_footnotes:
  - marker: a
    text: Mais literalmente, «sem confessar que ele era portador de carne». A formulação conserva a imagem corporal que contrasta diretamente com «portador de um cadáver» na frase seguinte.
    reason: Preservar a metáfora e o paralelismo retórico do testemunho, sem acrescentar uma explicação doutrinária ao texto.
  - marker: b
    text: «Portador de um cadáver» reproduz o contraste incisivo com «portador de carne»; a imagem não é suavizada no texto.
    reason: Sinalizar uma formulação incomum, mas intencional, e sua função no contraste.
  revision_rationale: A única alteração substancial repõe no corpo do texto a metáfora de «portador de carne», que a versão anterior deslocava para nota por meio de uma paráfrase cristológica. Também se preserva [para mim], como no testemunho inglês, e se ajustam pontuação e algumas construções para maior naturalidade sem alteração de sentido.
