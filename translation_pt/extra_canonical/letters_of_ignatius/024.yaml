  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/024.yaml
  text: 'When I learned of the exceeding good order of your love in the ways of God, I was gladdened and determined to address you in the faith of Jesus Christ.


    For, being counted worthy to bear a most godly name in these bonds, which I carry about, I sing the praise of the churches; and I pray that there may be in them union of the flesh and of the spirit which are Jesus Christ’s, our never-failing life—and union of faith and of love, which is preferred before all things, and—what is more than all—union with Jesus and with the Father, in whom, if we endure patiently all the despite of the prince of this world and escape therefrom, we shall attain unto God.'
translation:
  language: pt
  text: 'Quando soube da excelente ordem do amor de vocês, segundo Deus, alegrei-me e decidi falar-lhes na fé de Jesus Cristo.


    Pois, tendo sido considerado digno de levar um nome muito digno de Deus, nestas correntes que carrego, canto em louvor das igrejas. Oro para que nelas haja união da carne e do espírito de Jesus Cristo, aquele que é nossa vida para sempre; união de fé e de amor, acima dos quais nada é preferível; e, o que é mais importante que tudo, união com Jesus e com o Pai. Naquele em quem, se vocês suportarem com paciência toda a emboscada do governante deste mundo e dela escaparem, alcançarão a Deus.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exceeding good order / πολυεύτακτον (reconstruído a partir da tradição conhecida)
  choice: excelente ordem
  rationale: Mantém a ideia enfática de uma vida amorosa muito bem ordenada, sem recorrer a uma formulação arcaica.
- source_word: in the ways of God / κατὰ θεόν (provável expressão grega subjacente)
  choice: que vocês vivem segundo Deus
  rationale: Expressa naturalmente que o amor é orientado pela vontade de Deus, sem acrescentar uma doutrina específica.
- source_word: most godly name
  choice: um nome sumamente digno de Deus
  rationale: Evita que “diviníssimo” sugira que o próprio nome seja divino e preserva a ideia de algo apropriado ou honroso diante de Deus.
- source_word: bonds
  choice: correntes
  rationale: No contexto da prisão de Inácio, “correntes” comunica de modo concreto e corrente o instrumento de seu cativeiro.
- source_word: prince of this world
  choice: governante deste mundo
  rationale: “Governante” é linguagem atual e preserva o título de autoridade sem identificar explicitamente a figura além do que o texto declara.
- source_word: attain unto God
  choice: alcançaremos a Deus
  rationale: Preserva a formulação teleológica e sua tensão teológica sem explicá-la como salvação, martírio ou presença celestial.
theological_decisions:
- issue: A união da carne e do espírito pertence a quem?
  choice: “da carne e do espírito, que pertencem a Jesus Cristo”
  alternative: “união da carne e do espírito de vocês em Jesus Cristo”
  rationale: Segue a sintaxe do testemunho fornecido, que atribui carne e espírito a Jesus Cristo, e não transfere silenciosamente a referência aos destinatários.
- issue: Referente do pronome em “in whom”
  choice: “Nele[a]” com nota de alternativa
  alternative: “Neles” ou explicitação como “em Jesus”/“no Pai”
  rationale: O singular do testemunho pode apontar para um referente singular em uma frase que acaba de mencionar Jesus e o Pai. A tradução evita resolver de modo dogmático a ambiguidade.
- issue: Identidade do “governante deste mundo”
  choice: manter o título sem identificação adicional
  alternative: traduzir ou glosar como “Satanás”
  rationale: Embora a expressão seja frequentemente associada a Satanás, o texto não o nomeia aqui; a tradução não deve importar a identificação para o corpo textual.
- issue: Sentido de “alcançar a Deus”
  choice: preservar literalmente a meta relacional
  alternative: “chegaremos à presença de Deus” ou “seremos salvos”
  rationale: As alternativas interpretam a expressão. A formulação escolhida conserva sua densidade e possível conexão com perseverança, martírio e comunhão com Deus.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação evita arcaísmos como “ultraje”, “príncipe deste século” e “chegar até Deus”. Este rascunho é necessariamente provisório: foi preparado com base no testemunho inglês de domínio público fornecido e em correspondências gregas conhecidas apenas de modo auxiliar; requer conferência direta e integral com a tradição manuscrita grega da recensão média antes da publicação.'
