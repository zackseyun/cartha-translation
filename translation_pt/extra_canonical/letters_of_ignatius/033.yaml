review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência argumentativa e as imagens do testemunho inglês fornecido. Contudo, a revisão direta do grego da recensão média continua pendente; portanto, a fidelidade ao original antigo não pode ser plenamente confirmada nesta etapa. Ajustei «junto de Deus» para «para Deus», que corresponde melhor a «unto God», e mantive a formulação paradoxal sobre o judaísmo sem a resolver.
  naturalness: O português é claro e de registro apropriado. «Como convém ao cristianismo» reproduz mais diretamente a construção e soa natural. «Por seu sabor» evita a ambiguidade de «pelo seu sabor», que poderia remeter a Cristo, e preserva a metáfora.
  terminology: «Cristianismo», «judaísmo», «fermento», «salgados» e «sabor» mantêm os termos e as metáforas distintivas do testemunho. «Absurdo» é uma solução moderna e proporcional para a forte incongruência expressa no texto. A nota sobre a antítese judaísmo/cristianismo foi restringida para não acrescentar uma reconstrução histórica ou teológica que o enunciado em si não explicita.
  issues:
  - severity: medium
    issue: «junto de Deus» para «unto God»
    rationale: Em português, «junto de Deus» sugere sobretudo proximidade espacial ou comunhão junto a Deus. «Para Deus» preserva melhor o movimento/finalidade da reunião expresso pelo testemunho.
  - severity: low
    issue: Nota c acrescenta uma explicação histórica e teológica além da construção textual
    rationale: A afirmação de que a fé cristã «surgiu dentro da história e das Escrituras de Israel» pode ser historicamente pertinente, mas não é uma explicação necessária da sintaxe nem é afirmada diretamente neste trecho. A nota deve esclarecer a construção sem resolver ou ampliar sua polêmica.
  revised_text: 'Portanto, não sejamos insensíveis à sua bondade. Pois, se ele nos tratasse imitando nossas obras, estaríamos perdidos. Por isso, visto que nos tornamos seus discípulos, aprendamos a viver como convém ao cristianismo. Pois quem é chamado por outro nome além deste não pertence a Deus.


    Livrem-se, portanto, do fermento vil, que envelheceu e azedou, e voltem-se para o novo fermento, que é Jesus Cristo. Sejam salgados nele, para que ninguém entre vocês apodreça, pois vocês serão postos à prova por seu sabor.[a]


    É absurdo falar de Jesus Cristo e praticar o judaísmo.[b] Pois não foi o cristianismo que creu no judaísmo, mas o judaísmo no cristianismo, no qual toda língua creu e foi reunida para Deus.[c]'
  revised_footnotes:
  - marker: a
    text: A sequência de imagens — fermento, sal, deterioração e sabor — é preservada de modo deliberadamente concreto. “Sabor” também pode sugerir a qualidade pela qual alguém é reconhecido ou avaliado.
    reason: Explicar uma metáfora compacta e incomum sem resolvê-la no corpo do texto.
  - marker: b
    text: Neste contexto polêmico antigo, “praticar o judaísmo” se refere à adoção de práticas ou observâncias judaizantes por cristãos; a frase não deve ser entendida como condenação de pessoas judaicas ou de sua identidade étnica.
    reason: Evitar uma leitura anacrônica ou antijudaica sem enfraquecer o contraste histórico do autor.
  - marker: c
    text: 'A frase apresenta uma antítese retórica e paradoxal: o judaísmo é dito crer no cristianismo, e “no qual” retoma “cristianismo”. “Toda língua” é uma personificação coletiva para povos de diferentes línguas.'
    reason: Esclarecer a referência da construção e sua linguagem coletiva sem eliminar sua tensão retórica.
  revision_rationale: 'A revisão faz dois ajustes seguros: torna mais direta a expressão sobre viver de modo condizente com o cristianismo e corrige a direção/finalidade de «unto God». Também limita a nota final a uma explicação sintática e retórica. As imagens incomuns e a antítese histórica foram preservadas, pois não devem ser harmonizadas sem consulta direta ao grego.'
