base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/033.yaml
  text: 'Therefore, let us not be insensitive to his goodness. For if he were to imitate us according to our deeds, we would be lost. For this reason, since we have become his disciples, let us learn to live in a way worthy of Christianity. For whoever is called by any name other than this does not belong to God.


    Therefore, put away the vile leaven that has grown stale and sour, and turn to the new leaven, which is Jesus Christ. Be salted in him, so that none of you becomes putrid, since you will be tested by your savor.


    It is monstrous to speak of Jesus Christ and practice Judaism. For Christianity did not believe in Judaism, but Judaism believed in Christianity, in which every tongue believed and was gathered together to God.'
translation:
  language: pt
  text: 'Portanto, não sejamos insensíveis à sua bondade. Pois, se ele nos tratasse imitando nossas obras, estaríamos perdidos. Por isso, visto que nos tornamos seus discípulos, aprendamos a viver de maneira digna do cristianismo. Pois quem é chamado por outro nome além deste não pertence a Deus.


    Livrem-se, portanto, do fermento vil, que envelheceu e azedou, e voltem-se para o novo fermento, que é Jesus Cristo. Sejam salgados nele, para que ninguém entre vocês apodreça, pois vocês serão postos à prova pelo seu sabor.[a]


    É absurdo falar de Jesus Cristo e praticar o judaísmo.[b] Pois não foi o cristianismo que creu no judaísmo, mas o judaísmo no cristianismo, no qual toda língua creu e foi reunida junto de Deus.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A sequência de imagens — fermento, sal, deterioração e sabor — é preservada de modo deliberadamente concreto. “Sabor” também pode sugerir a qualidade pela qual alguém é reconhecido ou avaliado.
    reason: Explicar uma metáfora compacta e incomum sem resolvê-la no corpo do texto.
  - marker: b
    text: Neste contexto polêmico antigo, “praticar o judaísmo” se refere à adoção de observâncias judaizantes por cristãos; a frase não deve ser entendida como condenação de pessoas judaicas ou de sua identidade étnica.
    reason: Evitar leitura anacrônica ou antissemita sem enfraquecer o contraste histórico do autor.
  - marker: c
    text: A construção afirma que a fé cristã surgiu dentro da história e das Escrituras de Israel e depois reuniu povos de todas as línguas. A formulação permanece retoricamente tensa.
    reason: Preservar a tensão teológica e esclarecer a lógica da antítese.
lexical_decisions:
- source_word: insensible
  choice: insensíveis
  rationale: Mantém a imagem de falta de percepção ou resposta diante da bondade divina sem paráfrase excessiva.
- source_word: Christianity
  choice: cristianismo
  rationale: Reproduz o termo identitário do testemunho, embora aqui possa designar a vida ou realidade cristã, e não apenas um sistema religioso posterior.
- source_word: vile leaven
  choice: fermento vil
  rationale: Preserva a metáfora pejorativa e sua ligação com o contraste entre fermento velho e novo.
- source_word: Be ye salted in Him
  choice: Sejam salgados nele
  rationale: Conserva a metáfora incomum do testemunho em vez de a explicar ou substituir.
- source_word: savor
  choice: sabor
  rationale: Mantém o campo metafórico do sal, da deterioração e da prova, apesar da possível extensão semântica para cheiro ou qualidade.
- source_word: monstrous
  choice: absurdo
  rationale: Expressa em português atual uma incompatibilidade grave e chocante sem recorrer ao pouco natural 'monstruoso' neste contexto.
- source_word: Judaism
  choice: judaísmo
  rationale: Mantém a designação histórica do testemunho, cuja referência contextual deve ser distinguida de pessoas judaicas em geral.
theological_decisions:
- issue: Pertencimento a Deus e o nome cristão
  choice: “quem é chamado por outro nome além deste não pertence a Deus”
  alternative: “quem recebe outro nome além deste não é de Deus”
  rationale: Preserva a formulação forte e a ambiguidade sobre nome, identidade e lealdade, sem transformá-la numa definição denominacional.
- issue: Relação entre cristianismo e judaísmo
  choice: Manter a antítese do testemunho
  alternative: Suavizar como contraste apenas entre práticas antigas e fé cristã
  rationale: A tensão histórica e teológica é genuína no texto e não deve ser apagada; uma nota esclarece que a linguagem é contextual e não autoriza hostilidade étnica ou religiosa.
- issue: “toda língua”
  choice: “toda língua creu”
  alternative: “pessoas de todas as línguas creram”
  rationale: Mantém o eco bíblico e a personificação coletiva, preservando a formulação do testemunho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução é provisória porque o material fornecido informa que a revisão direta do grego da recensão média ainda está pendente; por isso, metáforas e ambiguidades do testemunho inglês foram preservadas com cautela.
