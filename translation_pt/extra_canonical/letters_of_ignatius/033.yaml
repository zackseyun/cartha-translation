review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e preserva as imagens e a antítese do texto. Contudo, “se ele nos tratasse imitando nossas obras” introduz a ideia de tratamento em vez de conservar diretamente a formulação “se ele nos imitasse segundo nossas obras”. A revisão restaura essa construção, estranha mas deliberada, sem interpretar além do testemunho. Como a revisão direta do grego da recensão média está pendente, permanece necessária confirmação humana das nuances metafóricas.
  naturalness: O português é moderno e compreensível. “Sejam salgados nele” conserva uma metáfora propositalmente incomum; a nota a torna inteligível sem a diluir. “Apodreça” é natural e mantém o contraste com o sal.
  terminology: “Cristianismo”, “judaísmo”, “fermento”, “salgados” e “toda língua” mantêm os termos e o registro do testemunho. “Praticar o judaísmo” é uma boa forma de verter a expressão polêmica, desde que a nota a situe no debate antigo e não a transforme em juízo sobre pessoas judaicas.
  issues:
  - severity: medium
    issue: Paráfrase interpretativa em “se ele nos tratasse imitando nossas obras”
    rationale: O testemunho diz que ele “nos imitasse segundo nossas obras”; “nos tratasse” explica e altera a imagem verbal. É mais fiel manter “nos imitasse”, ainda que a formulação seja retoricamente incomum.
  - severity: low
    issue: A nota c apresenta como explicação textual uma síntese histórica mais ampla
    rationale: A afirmação sobre a origem da fé cristã dentro da história de Israel é uma contextualização plausível, mas vai além do que a frase antitética afirma diretamente. A nota foi ajustada para descrever a construção e sua tensão, sem resolver sua lógica teológica.
  revised_text: 'Portanto, não sejamos insensíveis à sua bondade. Pois, se ele nos imitasse segundo nossas obras, estaríamos perdidos. Por isso, visto que nos tornamos seus discípulos, aprendamos a viver de maneira digna do cristianismo. Pois quem é chamado por outro nome além deste não pertence a Deus.


    Portanto, livrem-se do fermento vil, que envelheceu e azedou, e voltem-se para o novo fermento, que é Jesus Cristo. Sejam salgados nele, para que ninguém entre vocês apodreça, pois vocês serão postos à prova pelo seu sabor.[a]


    É absurdo falar de Jesus Cristo e praticar o judaísmo.[b] Pois não foi o cristianismo que creu no judaísmo, mas o judaísmo no cristianismo, no qual toda língua creu e foi reunida junto de Deus.[c]'
