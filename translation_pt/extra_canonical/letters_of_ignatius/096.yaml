review_pass:
  verdict: revise
  source_fidelity: A revisão do grego da recensão média confirma a maior parte das escolhas, incluindo «presbíteros», a série de verbos com «juntos», «soldo», o equipamento militar amplo («armas») e a metáfora contábil. Contudo, «Ofereço minha vida» transforma ἀντίψυχον, que é uma designação de substituição/garantia vital («vida por vida», «resgate»), em um verbo não expresso; e a última frase soa no grego como afirmação presente de contentamento/alegria, não como desejo.
  naturalness: O português é atual e claro. A substituição de «descansem juntos» por «deitem-se juntos» reproduz mais exatamente συγκοιμᾶσθε sem dificuldade de leitura. «Procurem agradar àquele sob cujo comando vocês servem» evita introduzir no texto o título explícito «Comandante», que a fonte não traz, embora a imagem militar permaneça evidente.
  terminology: «Bispo», «presbíteros» e «diáconos» preservam os títulos antigos sem impor modelos eclesiásticos posteriores. «Administradores, assessores e servidores» é uma boa reprodução funcional da tríade. «Garantia de vida por vocês», acompanhado de nota, mantém a expressão incomum ἀντίψυχον e sua ambiguidade, sem construir uma teoria de expiação.
  issues:
  - severity: medium
    issue: «Ofereço minha vida[a] pelos que se submetem» para Ἐγὼ ἀντίψυχον ὑμῶν
    rationale: A formulação troca o predicado nominal do original por uma oferta verbal e enfraquece a noção de vida dada em substituição ou como garantia. Uma redação que retenha «garantia de vida» e a nota explicativa preserva melhor a expressão difícil.
  - severity: low
    issue: «Que eu sempre tenha alegria em vocês»
    rationale: 'A forma grega εὐδοκῶ é indicativa presente: Inácio expressa seu contentamento/alegria contínua nos destinatários, em vez de formular um desejo.'
  - severity: low
    issue: «Comandante» foi explicitado no corpo do texto
    rationale: O verbo στρατεύεσθε contém a imagem de serviço militar, mas não nomeia literalmente um comandante. A revisão conserva a imagem sem acrescentar o título.
  - severity: low
    issue: «descansem juntos» para συγκοιμᾶσθε
    rationale: O verbo se refere mais concretamente a deitar-se/dormir junto. «Deitem-se juntos» é mais próximo e mantém a cadência da série.
  revised_text: 'Deem atenção ao bispo, para que Deus também dê atenção a vocês. Sou uma garantia de vida por vocês[a] que se submetem ao bispo, aos presbíteros e aos diáconos. Que me seja concedido ter parte com eles em Deus. Trabalhem juntos, lutem juntos, corram juntos, sofram juntos, deitem-se juntos e levantem-se juntos, como administradores, assessores e servidores de Deus.


    Procurem agradar àquele sob cujo comando vocês servem e de quem também receberão o soldo. Que nenhum de vocês seja encontrado como desertor. Que o batismo de vocês permaneça como suas armas; a fé, como seu capacete; o amor, como sua lança; e a perseverança, como sua armadura completa. Que as obras de vocês sejam seus depósitos, para que recebam os valores que lhes cabem.[b] Portanto, tenham paciência uns com os outros, com mansidão, assim como Deus é com vocês. Alegro-me sempre em vocês.'
  revised_footnotes:
  - marker: a
    text: 'Literalmente, «sou um ἀντίψυχον por vocês»: uma expressão incomum que evoca vida dada em troca de vida, resgate ou garantia pessoal.'
    reason: Explica a imagem forte e lexicalmente difícil de ἀντίψυχον, sem especificar uma teoria sacrificial.
  - marker: b
    text: O texto emprega linguagem contábil incomum, falando de «depósitos» e do que se recebe em retorno.
    reason: Sinaliza a metáfora financeira e a incerteza lexical dos termos, sem sobrecarregar o texto principal.
  revision_rationale: 'A revisão corrige duas alterações de sentido seguras: a expressão nominal ἀντίψυχον é mantida como imagem de garantia/substituição vital, com nota que preserva suas possibilidades, e a declaração final é vertida como afirmação presente. Também reduz uma explicitação não necessária («Comandante») e torna mais concreto o verbo «deitar-se». As demais escolhas estruturais, terminológicas e as âncoras das notas foram preservadas.'
