review_pass:
  verdict: revise
  source_fidelity: O rascunho preserva bem a sequência exortativa, as imagens militar e contábil e os títulos eclesiais. Porém, «Ofereço minha vida pelos que se submetem» altera a referência de ὑμῶν («vocês») e introduz uma formulação verbal que o grego não explicita. «Comandante» também não está expresso no texto grego, que diz literalmente «aquele a quem vocês servem como soldados». A revisão conserva a força de ἀντίψυχον sem resolver de modo excessivo seu valor preciso.
  naturalness: O português é atual e claro. A substituição de «Comandante em cujo exército vocês servem» por «Agradam àquele a quem vocês servem como soldados» é igualmente natural e mais fiel. «Ergam-se juntos» mantém a cadência e evita sugerir apenas o ato físico de levantar-se.
  terminology: «Bispo», «presbíteros», «diáconos», «administradores», «assessores», «servidores», «soldo», «capacete», «lança» e «armadura completa» são adequados. «Armas» preserva corretamente o coletivo ὅπλα. A nota sobre ἀντίψυχον deve referir-se a «vocês», não «eles».
  issues:
  - severity: high
    issue: Referência e formulação de ἀντίψυχον
    rationale: «Ofereço minha vida pelos que se submetem» muda «por vocês, os que se submetem» para uma terceira pessoa e torna explícito um verbo de oferta. O termo é forte, mas seu sentido exato permanece debatido; uma redação mais comedida no texto e uma nota preservam essa ambiguidade.
  - severity: medium
    issue: Inclusão de «Comandante»
    rationale: O grego não nomeia um comandante nessa frase; emprega apenas o pronome relativo para «aquele a quem vocês servem como soldados». A imagem militar deve permanecer, sem acrescentar o título.
  - severity: low
    issue: «assim como Deus é com vocês»
    rationale: A construção portuguesa é menos clara do que «assim como Deus está com vocês» e pode sugerir uma comparação de qualidades não expressa.
  revised_text: 'Deem atenção ao bispo, para que Deus também dê atenção a vocês. Eu me entrego por vocês, que se submetem ao bispo, aos presbíteros e aos diáconos.[a] Que me seja concedido ter parte com eles em Deus. Trabalhem juntos, lutem juntos, corram juntos, sofram juntos, descansem juntos e ergam-se juntos, como administradores, assessores e servidores de Deus.



    Agradam àquele a quem vocês servem como soldados e de quem também receberão o soldo. Que nenhum de vocês seja encontrado como desertor. Que o batismo de vocês permaneça como suas armas; a fé, como seu capacete; o amor, como sua lança; e a perseverança, como sua armadura completa. Que as obras de vocês sejam seus depósitos, para que recebam o que lhes é devido.[b] Portanto, sejam pacientes uns com os outros, com mansidão, assim como Deus está com vocês. Que eu sempre tenha alegria em vocês.'
  revised_footnotes:
  - marker: a
    text: A expressão grega ἀντίψυχον é incomum e forte; pode evocar alguém que se dá pela vida de outros, como garantia, substituto ou resgate. A tradução «Eu me entrego por vocês» conserva a entrega pessoal sem determinar o valor técnico da expressão.
    reason: Preserva a ambiguidade lexical e corrige a referência para «vocês», correspondente ao grego.
  - marker: b
    text: O texto emprega linguagem contábil incomum, falando de «depósitos» e do que se recebe em retorno.
    reason: Sinaliza a metáfora financeira e a incerteza lexical dos termos, sem sobrecarregar o texto principal.
  revision_rationale: 'Foram corrigidos dois acréscimos ou deslocamentos relevantes: a referência de ἀντίψυχον foi mantida em segunda pessoa, e «Comandante» foi removido por não estar expresso no grego. Também se esclareceu a última comparação com «Deus está com vocês». O restante preserva a estrutura, o registro e as metáforas do rascunho.'
