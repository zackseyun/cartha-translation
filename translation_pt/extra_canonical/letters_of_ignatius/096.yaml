  text: 'Give heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, and the deacons. May it be granted me to have my portion with them in the presence of God. Toil together with one another, struggle together, run together, suffer together, lie down together, rise up together, as God’s stewards, assessors, and ministers.


    Please the Captain in whose army you serve, from whom also you will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that you may receive your assets due to you. Be therefore long-suffering with one another in gentleness, as God is with you. May I have joy of you always.'
translation:
  language: pt
  text: 'Deem atenção ao bispo, para que Deus também dê atenção a vocês. Ofereço minha vida[a] pelos que se submetem ao bispo, aos presbíteros e aos diáconos. Que me seja concedido ter parte com eles em Deus. Trabalhem juntos, lutem juntos, corram juntos, sofram juntos, descansem juntos e levantem-se juntos, como administradores, assessores e servidores de Deus.


    Agradem ao Comandante em cujo exército vocês servem e de quem também receberão o soldo. Que nenhum de vocês seja encontrado como desertor. Que o batismo de vocês permaneça como suas armas; a fé, como seu capacete; o amor, como sua lança; e a perseverança, como sua armadura completa. Que as obras de vocês sejam seus depósitos, para que recebam os valores que lhes cabem.[b] Portanto, sejam pacientes uns com os outros, com mansidão, assim como Deus é com vocês. Que eu sempre tenha alegria em vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida literalmente como «sou um resgate por eles»; aqui comunica a disposição de Inácio de entregar a própria vida.
    reason: Preserva a força e a ambiguidade da expressão grega ἀντίψυχον sem impor ao texto uma teoria sacrificial específica.
  - marker: b
    text: O texto emprega linguagem contábil incomum, falando de «depósitos» e do que se recebe em retorno.
    reason: Sinaliza a metáfora financeira e a incerteza lexical dos termos, sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: ἀντίψυχον
  choice: Ofereço minha vida
  rationale: Conserva a imagem forte de entrega pessoal do termo grego, sem impor a formulação sacrificial mais específica de «resgate»; é mais fiel que o enfraquecido «sou dedicado» da testemunha inglesa.
- source_word: πρεσβύτεροι
  choice: presbíteros
  rationale: Mantém o título eclesial antigo reconhecível em português, sem o identificar automaticamente com uma forma denominacional moderna de governo.
- source_word: οἰκονόμοι, πάρεδροι, ὑπηρέται
  choice: administradores, assessores e servidores
  rationale: Reproduz a sequência de funções com termos atuais e dignos; «assessores» preserva a ideia dos que se assentam ao lado para auxiliar.
- source_word: ὀψώνια
  choice: soldo
  rationale: Mantém a metáfora militar do pagamento recebido por quem serve em campanha.
- source_word: ὅπλα
  choice: armas
  rationale: O grego tem um termo coletivo para armas ou equipamento militar, não o termo específico para «escudo» adotado pela testemunha inglesa.
- source_word: ὑπομονή
  choice: perseverança
  rationale: Expressa resistência firme e continuada melhor que a mera espera sugerida por «paciência», especialmente na metáfora da armadura.
- source_word: δεπόσιτα … ἄκκεπτα
  choice: depósitos … valores que lhes cabem
  rationale: Preserva a metáfora contábil e evita uma precisão técnica excessiva, pois a correspondência exata dos dois termos é incomum e discutível.
theological_decisions:
- issue: Sentido de ἐν θεῷ
  choice: ter parte com eles em Deus
  alternative: ter minha porção com eles na presença de Deus
  rationale: A formulação mais curta conserva a expressão relacional e teologicamente densa do grego, sem convertê-la silenciosamente em uma referência espacial à presença divina.
- issue: Imagem do batismo
  choice: o batismo … como suas armas
  alternative: o batismo … como seu escudo
  rationale: Segue o termo grego amplo ὅπλα e preserva o batismo como equipamento de combate sem restringi-lo a uma peça defensiva não explicitada.
- issue: Entrega pessoal de Inácio
  choice: Ofereço minha vida pelos que se submetem
  alternative: Sou dedicado aos que se submetem
  rationale: Retém a força afetiva e potencialmente sacrificial do original, mas evita definir a entrega como expiação ou substituição doutrinária.
- issue: Recompensa das obras
  choice: recebam os valores que lhes cabem
  alternative: recebam os bens que lhes são devidos
  rationale: Mantém a metáfora de prestação de contas e recompensa sem elaborar uma doutrina específica de mérito.
translation_notes:
  register: Português atual, digno e de leitura ampla, com «vocês» para evitar a artificialidade de formas arcaicas. A repetição de «juntos» foi mantida para reproduzir a cadência exortativa. A terminologia militar e contábil permanece visível. O rascunho dá prioridade à evidência grega identificável da recensão média, mas deve ser considerado provisório até a revisão filológica direta e integral da tradição manuscrita indicada.
