source:
  text: 'Give ye heed to the bishop, that God also may give heed to you. I am devoted to those who are subject to the bishop, the presbyters, the deacons. May it be granted me to have my portion with them in the presence of God. Toil together one with another, struggle together, run together, suffer together, lie down together, rise up together, as God''s stewards and assessors and ministers.


    Please the Captain in whose army ye serve, from whom also ye will receive your pay. Let none of you be found a deserter. Let your baptism abide with you as your shield; your faith as your helmet; your love as your spear; your patience as your body armor. Let your works be your deposits, that ye may receive your assets due to you. Be ye therefore long-suffering one with another in gentleness, as God is with you. May I have joy of you always.'
