base_translation:
  language: en
  yaml_path: translation/extra_canonical/letters_of_ignatius/075.yaml
  text: 'Now concerning Philo, the deacon from Cilicia, a man of good report, who now also ministers to me in the word of God, together with Rhaius Agathopus, an elect one who follows me from Syria, having bidden farewell to this present life: the same also bear witness to you. I myself thank God on your behalf, because you received them, just as I trust that the Lord will receive you. But may those who treated them with dishonor be redeemed through the grace of Jesus Christ.


    The love of the brethren in Troas greets you; from there I also write to you by the hand of Burrhus, who was sent with me by the Ephesians and Smyrnaeans as a mark of honor. The Lord shall honor them, even Jesus Christ, on whom their hope is set in flesh and soul and spirit, by faith, love, and concord. Farewell in Christ Jesus, our common hope.'
translation:
  language: pt
  text: 'Quanto a Fílon, o diácono da Cilícia, homem de boa reputação, que agora também me serve na palavra de Deus, juntamente com Reu Agátopo, homem escolhido que me acompanha desde a Síria, tendo-se despedido desta vida presente: eles também dão testemunho a respeito de vocês. Eu mesmo agradeço a Deus por vocês, porque os receberam, assim como confio que o Senhor receberá vocês. Mas que aqueles que os trataram com desonra sejam redimidos pela graça de Jesus Cristo.


    O amor dos irmãos que estão em Trôade saúda vocês. É de lá que também lhes escrevo pela mão de Burro, que foi enviado comigo pelos efésios e pelos esmirnenses como sinal de honra. O Senhor os honrará — Jesus Cristo, em quem está depositada a esperança deles, na carne, na alma e no espírito, mediante a fé, o amor e a concórdia. Estejam bem em Cristo Jesus, nossa esperança comum.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Philo / Rhaius Agathopus / Burrhus
  choice: Fílon / Reu Agátopo / Burro
  rationale: Formas portuguesas transliteradas segundo o testemunho fornecido, com acentuação que favorece a leitura; os nomes devem ser conferidos diretamente no grego.
- source_word: ministereth to me
  choice: me serve
  rationale: Expressa serviço ou assistência sem impor um sentido litúrgico específico ao verbo subjacente, ainda não verificado.
- source_word: in the word of God
  choice: na palavra de Deus
  rationale: 'Mantém a formulação tradicional e sua possível amplitude: proclamação, ensino ou serviço relacionado à mensagem de Deus.'
- source_word: elect one
  choice: homem escolhido
  rationale: Preserva o sentido de eleição ou escolha sem transformar a expressão em título eclesiástico.
- source_word: this present life
  choice: esta vida presente
  rationale: Conserva a referência ascética à ruptura com a vida atual sem explicá-la além do testemunho disponível.
- source_word: redeemed
  choice: redimidos
  rationale: Retém a força soteriológica da expressão e evita reduzi-la a simples perdão ou correção moral.
- source_word: concord
  choice: concórdia
  rationale: Termo corrente e digno que comunica unidade harmoniosa, tema importante nas cartas de Inácio.
- source_word: Fare ye well
  choice: Estejam bem
  rationale: Despedida natural em português que preserva o valor de voto ou exortação, em vez de usar apenas a interjeição moderna 'adeus'.
theological_decisions:
- issue: Relação sintática de “o Senhor” e “Jesus Cristo”
  choice: “O Senhor os honrará — Jesus Cristo”
  alternative: “O Senhor Jesus Cristo os honrará”
  rationale: O travessão conserva a possível aposição enfática do testemunho inglês sem eliminar a tensão sintática antes da revisão do grego.
- issue: Alcance de “na carne, na alma e no espírito”
  choice: Ligado à esperança depositada em Cristo
  alternative: Ligado à honra futura concedida pelo Senhor
  rationale: A pontuação segue a leitura mais imediata do testemunho fornecido, mas evita paráfrase explicativa porque a relação exata precisa de conferência no original.
- issue: Sentido da despedida da vida presente
  choice: Formulação literal, sem identificar o ato como martírio ou renúncia ascética específica
  alternative: Explicitar que Agátopo renunciou à vida mundana ou aceitou o martírio
  rationale: O testemunho permite mais de uma nuance; não se deve resolver a ambiguidade teológica e histórica sem revisão grega.
- issue: Recepção dos mensageiros e recepção pelo Senhor
  choice: Manter o paralelo “os receberam... o Senhor receberá vocês”
  alternative: Interpretar a recepção divina como salvação final ou acolhimento eclesial
  rationale: O paralelo retórico é claro no testemunho, enquanto o alcance escatológico permanece aberto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por “vocês” para legibilidade brasileira e neutralidade relativa. Trata-se de versão provisória baseada no testemunho inglês de domínio público; a tradição grega da recensão média ainda precisa de revisão direta, sobretudo quanto aos nomes próprios, à sintaxe de “Jesus Cristo”, à expressão sobre despedir-se da vida presente e ao referente de “na carne, na alma e no espírito”.
