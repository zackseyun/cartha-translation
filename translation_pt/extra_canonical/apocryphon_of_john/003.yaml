translation:
  language: pt
  text: '1. [Eu também] pedi para [compreender isso, e ele me disse]: “A Mônada[a] [é uma unidade sem nada] acima dela.


    2. [É aquela que existe] como [Deus] e como Pai do Todo,[b] [o invisível], que está acima do [Todo, que existe como] incorruptibilidade, [como] luz pura, para a qual nenhum [olho] pode olhar.


    3. Ele [é o] [Espírito] invisível, a respeito de quem não é apropriado [pensar] como um deus ou como algo semelhante, pois ele é mais do que um deus, visto que nada existe acima dele e ninguém o governa.


    4. [Isso porque ele] não [existe] dentro de coisa alguma subordinada [a ele, visto que tudo] existe dentro dele, pois ele é autoestabelecido.


    5. [Ele é eterno], visto que não necessita de [nada], pois [ele] é a perfeição completa.


    6. [Nada lhe faltava] de que precisasse para ser aperfeiçoado por [isso].


    7. [Ao contrário], ele é para sempre completamente perfeito em [luz].


    8. Ele é [ilimitado], visto que não existe ninguém [antes dele] que pudesse impor-lhe limites.


    9. Ele é insondável, [visto que] não existe antes dele ninguém que pudesse [sondá-lo].


    10. [Ele está] além de toda medida, visto que ninguém [existiu antes dele que pudesse medi-lo].


    11. [Ele é invisível, visto que] ninguém o viu.


    12. [Ele é eterno], visto que [existe] eternamente.


    13. Ele é [inefável, visto que] ninguém existiu que pudesse concebê-lo a fim de falar [dele].


    14. Ele não pode ser nomeado, visto que [ninguém existiu antes dele] que pudesse [dar-lhe nome].


    15. Ele é [luz sem medida], puro, santo e [sem mancha].


    16. Ele é inefável, [existindo em perfeita] incorruptibilidade.


    17. (Ele existe) [não] (confinado) na perfeição, nem na bem-aventurança, nem na divindade, mas está muito acima (delas).


    18. Ele não é corporal [nem] incorpóreo.


    19. Ele não é grande [nem] pequeno.


    20. [É impossível] dizer que ele tem quantidade ou que [tem qualidade], pois ninguém pode [compreendê-lo].


    21. Ele não é um ser entre [os seres, mas está] muito acima, [não] como [se fosse mais elevado], mas (é elevado) em si mesmo.


    22. Ele não [participa] dos éons[c] nem da temporalidade, pois aquele que participa de [um éon] estabelecido anteriormente [...].


    23. A ele [não] não foi atribuída uma medida temporal,[d] [visto que] não recebe coisa alguma de outro, [pois ela seria recebida] como empréstimo; aquele que existe antes de outra pessoa [não precisa] aceitar (coisa alguma) de [outro].


    24. Isso porque ele é aquele que contempla a si mesmo, esperando, em [sua] luz, visto que o [...] é glorioso.


    25. A ele pertence pureza sem medida.


    26. Ele é um éon que concede éons.


    27. Ele é [vida] que concede vida.


    28. Ele é o bem-aventurado que concede bem-aventurança.


    29. Ele é conhecimento que concede conhecimento.


    30. [Ele é] bondade que concede bondade.


    31. [Ele é] misericórdia e redenção [que concedem misericórdia].


    32. Ele é graça que concede graça,


    33. [não] porque ela lhe pertença, mas porque ele concede [a luz] que está além de toda medida e compreensão.


    34. [Como posso falar] com você a respeito dele, [visto que] seu [éon] está além da destruição, em repouso e permanecendo em [silêncio, descansando], existindo antes de [tudo, pois ele] é o líder de [todos] os éons [e] aquele que lhes concede força por meio de sua bondade?”


    [a] “Mônada” significa a unidade primeira e indivisível; o termo técnico foi mantido por sua importância neste texto.


    [b] “O Todo” designa aqui a totalidade de tudo quanto existe, com provável sentido cosmológico.


    [c] “Éons” pode designar eras ou realidades eternas; o termo foi transliterado para preservar essa amplitude de sentido.


    [d] O texto transmitido apresenta uma difícil dupla negação: “[não] não foi atribuída”. Ela foi preservada porque o estado da fonte não permite resolvê-la com segurança.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mônada” significa a unidade primeira e indivisível; o termo técnico foi mantido por sua importância neste texto.
    reason: Esclarece um termo filosófico pouco conhecido sem substituí-lo por uma equivalência estreita.
  - marker: b
    text: “O Todo” designa aqui a totalidade de tudo quanto existe, com provável sentido cosmológico.
    reason: Explica o uso substantivado e técnico da expressão.
  - marker: c
    text: “Éons” pode designar eras ou realidades eternas; o termo foi transliterado para preservar essa amplitude de sentido.
    reason: Preserva a polissemia de um termo central da cosmologia do escrito.
  - marker: d
    text: 'O texto transmitido apresenta uma difícil dupla negação: “[não] não foi atribuída”. Ela foi preservada porque o estado da fonte não permite resolvê-la com segurança.'
    reason: Sinaliza uma dificuldade textual que não deve ser corrigida silenciosamente.
lexical_decisions:
- source_word: monad
  choice: Mônada
  rationale: Mantém o termo técnico cosmológico e metafísico, acompanhado de nota explicativa, sem reduzi-lo simplesmente a “um” ou “unidade”.
- source_word: the All
  choice: o Todo
  rationale: Preserva o uso substantivado para a totalidade cósmica, evitando uma paráfrase que resolva demais o conceito.
- source_word: indestructibility
  choice: incorruptibilidade
  rationale: Termo corrente no registro religioso e filosófico, adequado à condição imperecível descrita.
- source_word: aeon(s)
  choice: éon(s)
  rationale: A transliteração conserva a ambiguidade entre era, esfera e realidade eterna característica do texto.
- source_word: unspeakable
  choice: inefável
  rationale: Expressa com dignidade e concisão aquilo que não pode ser adequadamente dito.
- source_word: self-established
  choice: autoestabelecido
  rationale: Reproduz a afirmação de independência ontológica sem acrescentar uma explicação doutrinária.
- source_word: somatic / non-somatic
  choice: corporal / incorpóreo
  rationale: Usa vocabulário português natural e mantém a negação paradoxal das duas categorias.
theological_decisions:
- issue: Descrição da Mônada como “mais do que um deus”
  choice: “mais do que um deus”
  alternative: “superior a Deus”
  rationale: Preserva a formulação comparativa do testemunho sem introduzir uma identificação ou hierarquia teológica mais específica.
- issue: Pronomes e gênero da Mônada
  choice: Alternância inicial coerente com “a Mônada” e posterior masculino referente ao Pai/Espírito
  alternative: Uniformizar tudo no masculino ou tudo no feminino
  rationale: Reflete as mudanças referenciais presentes no texto e evita apagar a tensão gramatical e conceitual.
- issue: Negação de corporal e incorpóreo
  choice: “não é corporal nem incorpóreo”
  alternative: Explicar como transcendência de matéria e espírito
  rationale: Mantém o paradoxo apofático sem impor uma interpretação metafísica externa.
- issue: Dupla negação no parágrafo 23
  choice: Preservar “[não] não foi atribuída” com nota
  alternative: Corrigir para “não lhe foi atribuída” ou “foi-lhe atribuída”
  rationale: O testemunho fornecido assinala uma leitura difícil; a correção silenciosa eliminaria uma incerteza textual genuína.
- issue: “Éon que concede éons”
  choice: Manter literalmente a relação
  alternative: Parafrasear como “eternidade que dá origem às eras”
  rationale: Evita resolver o sentido técnico e possivelmente hipostático de éon.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário filosófico-religioso moderado. Colchetes, parênteses e reticências foram preservados como sinais de reconstrução, esclarecimento ou lacuna no testemunho fornecido. Os números de página manuscrita foram omitidos por interromperem as frases. Rascunho necessariamente provisório, pois a revisão direta do copta continua pendente e a base disponível é um testemunho inglês de domínio público.
