lexical_decisions:
- source_word: Fullness
  choice: Plenitude
  rationale: Mantém o termo cosmológico técnico e sua associação com a totalidade do domínio divino, sem substituí-lo por uma explicação interpretativa.
- source_word: aeon
  choice: éon
  rationale: Transliteração já corrente em português para a entidade ou esfera cosmológica; evita reduzi-la simplesmente a “era”.
- source_word: chief archon
  choice: arconte principal
  rationale: Preserva o título técnico e traduz a relação hierárquica de modo claro.
- source_word: Mother-Father
  choice: Mãe-Pai
  rationale: Conserva a formulação paradoxal e a tensão de gênero do testemunho.
- source_word: Primal Man
  choice: Homem Primordial
  rationale: Expressa a figura arquetípica, distinguindo-a de um mero primeiro ser humano histórico.
- source_word: grinned
  choice: sorriu
  rationale: “Abriu um sorriso” ou “sorriu de modo largo” seria mais específico, mas “sorriu” oferece naturalidade sem impor uma conotação de escárnio não segura.
- source_word: garment of darkness
  choice: veste de trevas
  rationale: Preserva a metáfora concreta e o registro solene.
- source_word: deficiency
  choice: deficiência
  rationale: Mantém o vocabulário cosmológico do texto e não o converte em “pecado” ou “erro”, interpretações teologicamente mais estreitas.
theological_decisions:
- issue: Identidade do sujeito em “[he] agreed” e nas ações subsequentes
  choice: Preservar os colchetes e as mudanças de referente tal como aparecem no testemunho, sem identificar categoricamente o sujeito
  alternative: Uniformizar todas as referências como o Espírito invisível ou como o companheiro
  rationale: O testemunho inglês sinaliza restauração e apresenta referentes ambíguos; resolvê-los ocultaria uma incerteza textual e teológica genuína.
- issue: Relação entre arrependimento, vergonha e deficiência da mãe
  choice: Traduzir diretamente os termos distintos como “arrependeu-se”, “vergonha” e “deficiência”
  alternative: Harmonizá-los sob categorias como pecado, culpa ou queda
  rationale: O texto articula conceitos diferentes, e uma harmonização importaria uma estrutura doutrinária externa.
- issue: Formulação “O Homem existe, e o Filho do Homem”
  choice: Conservar os dois títulos literalmente e com iniciais maiúsculas
  alternative: Interpretar o segundo como descendente, humanidade ou título cristológico específico
  rationale: A formulação pode carregar múltiplas associações; a tradução não deve resolver sua relação interna sem evidência copta direta.
- issue: Mãe-Pai e forma masculina
  choice: Manter lado a lado a designação “Mãe-Pai” e a manifestação “em forma masculina”
  alternative: Regularizar o gênero ou parafrasear a entidade como andrógina
  rationale: A tensão de gênero pertence ao discurso do texto e não deve ser eliminada nem explicada além do que o testemunho afirma.
- issue: Sentido de “theft” cometido pelo filho
  choice: Traduzir como “roubo”
  alternative: Usurpação
  rationale: “Usurpação” explicaria o ato em termos cosmológicos mais específicos, mas o testemunho fornecido sustenta a imagem mais ampla de roubo.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário técnico preservado onde necessário. O texto foi elaborado a partir do testemunho inglês público fornecido, pois a revisão direta da fonte copta continua pendente. As restaurações entre colchetes e o marcador editorial {águas:2} foram conservados; o número isolado de página «14» foi omitido.
