  text: '1. I said, however, “Lord, what does ‘she moved back and forth’ mean?” He grinned and said, “Do not think that it agrees with what Moses said, ‘above the {waters:2}.’ No!


    2. Instead, when she witnessed the evil that had occurred and the theft her son had committed, she repented. She was overwhelmed by oblivion within the darkness of ignorance and began to feel ashamed. [And she did not dare] to return, but [she moved] about.


    3. This movement, however, is “to go back and forth.” And the proud one obtained power from his mother because he was ignorant and assumed that no one but his mother existed.


    4. When he saw the host of angels he had created, however, he exalted himself above them.


    5. Furthermore, when the mother realized that the garment of darkness was flawed, she understood that her companion had not agreed with her.


    6. She repented, «14» weeping profusely, and the entire Fullness listened to her prayer of repentance. On her behalf, they praised the unseen, virginal Spirit.


    7. And [he] agreed. But when [the unseen Spirit] had agreed, the holy Spirit poured out upon her from their entire Fullness. For it was not that her companion approached her (alone), but he approached her by means of the Fullness so that he could correct her deficiency. She was taken up—not to her own aeon, however, but above her son—so that she would dwell in the Ninth until she had corrected her deficiency.


    8. A voice also came from the lofty heavenly aeon: “The Man exists, and the Son of Man.” The chief archon, Yaltabaoth, overheard it and assumed that the voice had come from his mother, but he did not know where it had come from.


    9. He also taught them—that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came into being, the Primal Man—because he made his likeness manifest in a male form.


    10. Furthermore, the entire aeon of the chief archon shook, and the foundations of the abyss moved. The bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest. When all the authorities and the chief archon looked, they saw the entire region beneath them illuminated.'
translation:
  language: pt
  text: '**Apócrifo de João — A Mãe se arrepende**


    1. Eu, porém, perguntei: “Senhor, o que significa ‘ela se movia de um lado para o outro’?” Ele sorriu e respondeu: “Não pense que isso corresponde ao que Moisés disse: ‘acima das {águas:2}’. Não!


    2. Pelo contrário, quando ela viu o mal que havia acontecido e o roubo que seu filho havia cometido, arrependeu-se. Foi dominada pelo esquecimento em meio às trevas da ignorância e começou a sentir vergonha. [E não ousava] voltar, mas [movia-se] de um lado para o outro.


    3. Esse movimento, porém, é “ir de um lado para o outro”. E o orgulhoso obteve poder de sua mãe, pois era ignorante e supunha que ninguém existia além dela.


    4. Quando, porém, viu a multidão de anjos que havia criado, exaltou-se acima deles.


    5. Além disso, quando a mãe percebeu que a veste de trevas era imperfeita, compreendeu que seu companheiro não havia concordado com ela.


    6. Ela se arrependeu, chorando copiosamente, e toda a Plenitude ouviu sua oração de arrependimento. Em favor dela, louvaram o Espírito invisível e virginal.


    7. E [ele] concordou. Quando, porém, [o Espírito invisível] concordou, o Espírito santo foi derramado sobre ela, vindo de toda a Plenitude deles. Pois não foi seu companheiro sozinho que se aproximou dela; ele se aproximou por meio da Plenitude, a fim de corrigir a deficiência dela. Ela foi elevada — não ao seu próprio éon, mas acima de seu filho — para habitar no Nono até que corrigisse sua deficiência.


    8. Também veio uma voz do elevado éon celestial: “O Homem existe, e o Filho do Homem”. O arconte principal, Yaltabaoth, ouviu-a e supôs que a voz tivesse vindo de sua mãe, mas não sabia de onde ela vinha.


    9. Ele também lhes revelou — isto é, a sagrada e perfeita Mãe-Pai, a Providência perfeita, a imagem do Invisível, que é o Pai do Todo, por meio de quem tudo veio a existir, o Homem Primordial —, pois manifestou sua semelhança em forma masculina.[a]


    10. Além disso, todo o éon do arconte principal estremeceu, e os fundamentos do abismo se moveram. O fundo das águas acima da matéria foi iluminado pela aparição dessa imagem que havia sido manifestada. Quando todas as autoridades e o arconte principal olharam, viram iluminada toda a região abaixo deles.


    [a] A construção e os referentes pronominais deste período são incertos no testemunho disponível; a tradução conserva essa dificuldade.'
