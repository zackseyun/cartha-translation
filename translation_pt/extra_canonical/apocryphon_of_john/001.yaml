translation:
  language: pt
  text: '**Apócrifo de João — João e o fariseu**


    1. O ensinamento [do] Salvador, [a revelação] dos mistérios e [as] palavras ocultas no silêncio, [isto é, estas palavras que] ele ensinou a João, [seu] discípulo.


    2. Aconteceu, [porém], [certo dia], quando João, [irmão] de Tiago — ambos eram filhos de Zebedeu —, tinha subido ao templo, que um fariseu chamado Arimânios [foi até] ele [e] lhe perguntou: “[Onde] está o seu mestre, [a quem] você seguia?”


    3. Ele [lhe] respondeu: “Voltou para o [lugar] de onde [veio]”.


    4. O fariseu [lhe disse: “Com engano, esse Nazareno enganou todos vocês; encheu os ouvidos de vocês de mentiras e fechou o coração de vocês, afastando-os] das tradições [de seus pais]”.


    5. [Quando] eu, [João], ouvi essas palavras, [afastei-me] do templo [e fui para uma região deserta cheia de montanhas]. Então me lamentei [profundamente em meu coração, perguntando]:


    6. “Como o Salvador [foi designado]? Por que foi enviado [ao mundo] por [seu Pai]? E quem é o seu Pai, que [o enviou]? E que espécie de éon[a] é [aquele para o qual iremos]?


    7. Pois o que ele [quis dizer quando nos falou]: ‘O éon para [o qual vocês irão é] um éon [indestrutível]’?


    8. [Ele, porém, não] nos explicou [que espécie de éon é esse]”.


    [a] **éon:** termo de sentido amplo que pode indicar uma era, uma realidade ou esfera de existência; aqui se conserva o termo para não limitar prematuramente seu significado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '**éon:** termo de sentido amplo que pode indicar uma era, uma realidade ou esfera de existência; aqui se conserva o termo para não limitar prematuramente seu significado.'
    reason: O empréstimo técnico é menos conhecido do leitor comum, mas alternativas como “era”, “mundo” ou “eternidade” estreitariam indevidamente o sentido.
lexical_decisions:
- source_word: savior
  choice: Salvador
  rationale: Equivalente português tradicional e claro, usado como título no trecho.
- source_word: aeon
  choice: éon
  rationale: A transliteração preserva a amplitude conceitual do termo, que pode envolver era, realidade ou esfera de existência, sem reduzi-lo simplesmente a “eternidade” ou “mundo”.
- source_word: appointed
  choice: foi designado
  rationale: Mantém a ideia de atribuição ou estabelecimento de uma função sem especificar um mecanismo teológico não expresso no testemunho.
- source_word: dispatched
  choice: foi enviado
  rationale: Forma natural em português que conserva a relação entre aquele que envia e o enviado.
- source_word: sealed off your hearts
  choice: fechou o coração de vocês
  rationale: Expressão idiomática clara que mantém a imagem de tornar o coração inacessível, sem introduzir uma interpretação doutrinária.
- source_word: traditions of your fathers
  choice: tradições de seus pais
  rationale: Tradução formal que preserva a referência ancestral; não se substitui por “antepassados” porque a formulação familiar faz parte da acusação.
theological_decisions:
- issue: Destino do Salvador após seu retorno
  choice: “Voltou para o lugar de onde veio”
  alternative: “Voltou para aquele que o enviou”
  rationale: O testemunho fornecido fala de um lugar, não explicitamente de uma pessoa; a tradução conserva essa distinção.
- issue: Natureza do éon indestrutível
  choice: Manter “éon” e a pergunta sem explicação interpretativa no corpo do texto
  alternative: Traduzir como “mundo eterno”, “era eterna” ou “reino”
  rationale: O próprio narrador declara não ter recebido explicação sobre sua natureza; uma equivalência mais específica eliminaria deliberadamente essa tensão.
- issue: Designação e envio do Salvador
  choice: Preservar como perguntas separadas
  alternative: Fundir as perguntas em uma afirmação cristológica explicativa
  rationale: O trecho apresenta a perplexidade de João e não oferece ainda uma resolução; a tradução não antecipa uma resposta doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento legíveis no Brasil. Os colchetes preservam as indicações do testemunho inglês fornecido para texto danificado ou restaurado editorialmente. A redação é necessariamente provisória porque a revisão direta do copta ainda está pendente; foram evitadas reconstruções ou precisões além das presentes no testemunho.
