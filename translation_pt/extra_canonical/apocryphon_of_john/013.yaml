    15. A mãe de todos esses, Onorthochras, permanece no meio deles, pois é ilimitada e se une a todos eles. Ela é realmente a matéria, porque os alimenta.


    16. Os quatro demônios principais são: Ephememphi, relacionado ao prazer; Yoko, relacionado à luxúria; Nenentophni, relacionado à tristeza; e Blaomen, relacionado ao medo.


