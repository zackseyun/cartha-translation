  text: '2. Further, they created by means of their individual powers, in accordance with their allotted attributes. Each authority provided an attribute by means of the shape of the image he had seen in its psychic (dimension).


    9. However, the host of angels attended him, and they obtained from the authorities the seven substances of the life-soul, so that they could create the sizes of the limbs and the sizes of the torso, and the proper functioning of all the parts with one another.


    10. … However, those especially at work in the limbs are these: the head, Diolimodraza; the neck, Yammeax; the right shoulder, Yakoubib; the left shoulder, Yerton; the right hand, Oudidi; the left (hand), Arbao; the right-hand fingers, Lampno; the left-hand fingers, Leekaphar; the right breast, Barbar; the left breast, Imae; the chest, Pisandraptes; the right shoulder joint, Koade; the left shoulder joint, Odeor; the right ribs, Asphixix; the left ribs, Synogchouta; the belly, Arouph; the womb, Sabalo; the right thigh, Charcharb; the left thigh, Chthaon; all the genitals, Bathinoth; the right leg, Choux; the left leg, Charcha; the right shinbone, Aroer; the left shinbone, Toechtha; the right knee, Aol; the left knee, Charaner; the right foot, Bastan; its toes, Archentechtha; the left foot, Marephnounth; its toes, Abrana.


    17. However, the mother of all of them (is) Esthensis-Ouch-Epi-Ptoe.


    23. However, insight into their reality (comes from) Anaro, the chief of the hylic soul, because it pertains to the seven senses, to Ouch-Epi-Ptoe.


    27. Although I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster.'
translation:
  language: pt
  text: '**Apócrifo de João — As autoridades criam Adão**


    1. Além disso, por meio da luz, eles viram na água a forma da imagem, e ele disse às autoridades que o acompanhavam: “Venham, criemos um ser humano segundo a imagem de Deus e segundo a nossa semelhança, para que a imagem dele se torne uma luz para nós.”


    2. Então criaram por meio de seus poderes individuais, de acordo com os atributos que lhes haviam sido designados. Cada autoridade conferiu um atributo segundo a forma da imagem que havia visto em sua dimensão psíquica.[a]


    3. Ele criou um ser segundo a semelhança do Homem Primordial perfeito, e eles disseram: “Vamos chamá-lo Adão, para que o nome dele se torne para nós um poder de luz.” Então os poderes começaram:


    4. O primeiro, {Bondade}, criou um osso vivo; o segundo, Providência, criou um tendão vivo.


    5. O terceiro, Divindade, criou carne viva; o quarto, Senhorio, criou medula viva.


    6. O quinto, Reino, criou sangue vivo.


    7. O sexto, Ciúme, criou pele viva.


    8. O sétimo, Entendimento, criou cabelo vivo.


    9. O exército dos anjos, porém, o assistia. Eles receberam das autoridades as sete substâncias da alma vital, a fim de formar as dimensões dos membros e do tronco e fazer com que todas as partes funcionassem corretamente umas com as outras.


    10. O primeiro começou a criar a cabeça. Eteraphaope-Abron criou sua cabeça; Meniggesstroeth, o cérebro; Asterechmen, o olho direito; Thaspomocham, o olho esquerdo; Yeronumos, a orelha direita; Bissoum, a orelha esquerda; Akioreim, o nariz; Banen-Ephroum, os lábios; Amen, os dentes; Ibikan, os molares; Basiliademe, as amígdalas; Achcha, a úvula; Adaban, o pescoço; Chaaman, as vértebras; Dearcho, a garganta; Tebar, o ombro direito; N[..., o] ombro esquerdo; Mniarchon, o cotovelo direito; [...e, o] cotovelo esquerdo; Abilrion, a axila direita; Evanthen, a axila esquerda; Krys, a mão direita; Beluai, a mão esquerda; Treneu, os dedos da mão direita; Balbel, os dedos da mão esquerda; Kriman, as unhas das mãos; Astrops, o seio direito; Barroph, o seio esquerdo; Baoum, a articulação do ombro direito; Ararim, a articulação do ombro esquerdo; Areche, o ventre; Phthave, o umbigo; Senaphim, o abdômen; Arachethopi, as costelas direitas; Zabedo, as costelas esquerdas; Barias, o quadril direito; Phnouth,
    o quadril esquerdo;

    Abenlenarchei, a medula; Chnoumeninorin, os ossos; Gesole, o estômago; Agromauma, o coração; Bano, os pulmões; Sostrapal, o fígado; Anesimalar, o baço; Thopithro, os intestinos; Biblo, os rins; Roeror, os tendões; Taphreo, a coluna vertebral; Ipouspoboba, as veias; Bineborin, as artérias; a Aatoimenpsephei pertence o sopro existente em cada membro; Entholleia, toda a carne; Bedouk, a {parte inferior direita}; Arabeei, o pênis esquerdo; Eilo, o seu par; Sorma, os órgãos genitais; Gorma-Kaiochlabar, a coxa direita; Nebrith, a coxa esquerda; Pserem, os rins da perna direita; Asaklas, o rim esquerdo; Ormaoth, a perna direita; Emenun, a perna esquerda; Knyx, a tíbia direita; Tupelon, a tíbia esquerda; Achiel, o joelho direito; Phneme, o joelho esquerdo; Phiouthrom, o pé direito; Boabel, os dedos desse pé; Trachoun, o pé esquerdo; Phikna, os dedos desse pé; Miamai, as unhas dos pés; Labernioum, [...].[b]


    Os que foram colocados sobre todos esses são sete: Athoth, Armas, Kalila, Jabel, Sabaoth, Caim e Abel. Mas os que atuam especialmente nos membros são estes: na cabeça, Diolimodraza; no pescoço, Yammeax; no ombro direito, Yakoubib; no ombro esquerdo, Yerton; na mão direita, Oudidi; na mão esquerda, Arbao; nos dedos da mão direita, Lampno; nos dedos da mão esquerda, Leekaphar; no seio direito, Barbar; no seio esquerdo, Imae; no peito, Pisandraptes; na articulação do ombro direito, Koade; na articulação do ombro esquerdo, Odeor; nas costelas direitas, Asphixix; nas costelas esquerdas, Synogchouta; no ventre, Arouph; no útero, Sabalo; na coxa direita, Charcharb; na coxa esquerda, Chthaon; em todos os órgãos genitais, Bathinoth; na perna direita, Choux; na perna esquerda, Charcha; na tíbia direita, Aroer; na tíbia esquerda, Toechtha; no joelho direito, Aol; no joelho esquerdo, Charaner; no pé direito, Bastan; nos dedos desse pé, Archentechtha; no pé esquerdo, Marephnounth; nos dedos desse
    pé, Abrana.


    11. Os que exercem poder sobre todos esses são sete: Michael, Ouriel, Asmenedas, Saphasatoel, Aarmouriam, Richram e Amiorps.


    12. Além disso, quem controla os sentidos é Archendekta; quem controla a percepção, Deitharbathas; quem controla a imaginação, Oummaa; quem controla o estabelecimento das proporções, Aachiaram; e quem controla todos os impulsos, Riaramnacho.


    13. A origem dos demônios que habitam o corpo inteiro está estabelecida em quatro elementos: calor, frio, umidade e secura.


    14. A mãe de todos eles é a matéria. Quem governa o calor é Phloxopha; quem governa o frio, Oroorrothos; quem governa a secura, Erimacho; e quem governa a umidade, Athuro.


    15. A mãe de todos esses, Onorthochras, permanece no meio deles, pois é ilimitada e se mistura com todos eles. Ela é realmente a matéria, porque os alimenta.


    16. Os quatro demônios principais são: Ephememphi, relacionado ao prazer; Yoko, relacionado ao desejo; Nenentophni, relacionado à tristeza; e Blaomen, relacionado ao medo.


    17. A mãe de todos eles é Esthensis-Ouch-Epi-Ptoe.


    18. Dos quatro demônios procederam as paixões. Da tristeza vieram a inveja, o ciúme, o infortúnio, a aflição, a dor, a crueldade, a ansiedade, a lamentação e coisas semelhantes.


    19. Do prazer surgem muitos males, a arrogância vazia e coisas semelhantes.


    20. Do desejo vêm a ira, a fúria, a amargura, a paixão amarga, a insatisfação constante e coisas semelhantes.


    21. Do medo vêm o horror, o servilismo, a miséria e a humilhação.


    22. Todas essas coisas se assemelham tanto ao que é virtuoso como ao que é perverso.


    23. O discernimento da realidade delas vem de Anaro, o chefe da alma hílica,[a] pois isso diz respeito aos sete sentidos, a Ouch-Epi-Ptoe.[c]


    24. Este é o número dos anjos: ao todo, são 365.


    25. Todos trabalharam nele, membro por membro, até concluírem tanto o corpo psíquico como o corpo hílico.[a]


    26. Além desses, há outros que controlam as paixões restantes.


    27. Embora eu não os tenha enumerado para você, se quiser saber quem são, tudo isso está escrito no Livro de Zoroastro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Psíquico” e “hílico” são termos técnicos. Aqui, “psíquico” se relaciona à alma; “hílico”, à matéria.
    reason: Os equivalentes comuns “psicológico” e “material” poderiam apagar distinções técnicas importantes do texto.
  - marker: b
    text: Esta extensa lista anatômica contém trechos danificados e designações incertas. Colchetes e chaves assinalam lacunas ou leituras problemáticas preservadas no testemunho usado para esta versão.
    reason: O testemunho copta ainda aguarda revisão direta, e várias correspondências anatômicas são textualmente inseguras.
  - marker: c
    text: A construção desta frase é obscura; não fica claro como Anaro, a alma hílica, os sete sentidos e Ouch-Epi-Ptoe se relacionam sintaticamente.
    reason: Preserva uma ambiguidade genuína em vez de impor uma identificação especulativa.
lexical_decisions:
- source_word: psychic
  choice: psíquico/psíquica
  rationale: Mantém o termo técnico que designa a dimensão associada à alma, sem reduzi-lo ao sentido moderno de “psicológico”.
- source_word: hylic
  choice: hílico/hílica
  rationale: Preserva o termo técnico derivado de hylē, “matéria”, evitando substituí-lo por uma interpretação denominacional ou cosmológica mais específica.
- source_word: life-soul
  choice: alma vital
  rationale: Reproduz a combinação conceitual do testemunho e distingue essa expressão das referências posteriores à alma psíquica e à alma hílica.
- source_word: authorities
  choice: autoridades
  rationale: Mantém a designação das potências governantes e sua possível ressonância cosmológica, sem normalizá-la como “governantes” ou “arcontes”.
- source_word: Primal Man
  choice: Homem Primordial
  rationale: Expressa a figura arquetípica com dignidade e clareza, conservando a capitalização titular.
- source_word: passions
  choice: paixões
  rationale: Preserva o sentido antigo de afetos ou impulsos dominantes, ainda reconhecível em português no contexto filosófico-religioso.
- source_word: groveling
  choice: servilismo
  rationale: Transmite a ideia de rebaixamento abjeto ou submissão degradante sem recorrer a formulação pouco natural.
- source_word: proportioning
  choice: estabelecimento das proporções
  rationale: Conserva a ideia funcional de determinar medidas e relações corporais sem fingir maior precisão técnica.
theological_decisions:
- issue: Plural deliberativo em “criemos” e relação com a imagem de Deus
  choice: Preservar “criemos um ser humano segundo a imagem de Deus e segundo a nossa semelhança”
  alternative: Harmonizar com Gênesis ou identificar explicitamente as autoridades como arcontes
  rationale: O texto explora a linguagem de Gênesis dentro de sua própria cosmologia. A tradução não resolve a tensão entre a imagem divina, a semelhança das autoridades e a imagem humana.
- issue: Natureza do ser criado no versículo 3
  choice: “um ser”
  alternative: “um homem” ou “uma entidade”
  rationale: “Um ser” mantém a generalidade do testemunho e evita antecipar a plena humanidade ou materialidade de Adão.
- issue: Matéria como mãe e nutridora
  choice: Traduzir literalmente a personificação da matéria
  alternative: Explicar a matéria como princípio metafísico maligno
  rationale: O trecho personifica a matéria, mas a tradução não acrescenta um juízo doutrinário que não está explicitado nestas frases.
- issue: Ambiguidade sintática do versículo 23
