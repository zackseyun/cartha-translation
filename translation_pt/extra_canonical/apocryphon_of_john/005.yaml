translation:
  language: pt
  text: '**Apócrifo de João — A Pêntade**


    1. Ela se tornou o ventre universal, pois é aquela que existe antes de todos eles: a Mãe-Pai, o Ser Humano Primordial, o Espírito santo, o triplamente masculino, o triplamente poderoso, o andrógino de três nomes e o éon eterno entre os invisíveis, o primeiro a proceder.


    2. ‹Ela› suplicou ao Espírito invisível e virginal — isto é, Barbelo — que lhe concedesse Presciência, e o Espírito consentiu.


    3. Quando ele [consentiu], Presciência se apresentou e acompanhou Providência, aquela que procede do Pensamento do Espírito invisível e virginal.


    4. Ela exaltou a ele [e] a seu poder perfeito, Barbelo, porque eles vieram a existir por causa dela.


    5. Mais uma vez, ela suplicou que ele lhe concedesse [Incorruptibilidade], e ele consentiu.


    6. Quando ele [consentiu], Incorruptibilidade [se apresentou] e acompanhou Pensamento e Presciência.


    7. Ela exaltou o Invisível e Barbelo, aquela por causa de quem eles vieram a existir.


    8. Barbelo também suplicou que ele lhe concedesse vida eterna, e o Espírito invisível consentiu. Quando ele consentiu, Vida Eterna se apresentou,


    9. e elas [os acompanharam] e exaltaram o [Espírito] invisível e Barbelo, por causa de quem vieram a existir.


    10. Mais uma vez, ela suplicou que ele lhe concedesse verdade. E [ele consentiu]; e, [quando ele] consentiu,


    11. Verdade se apresentou, e elas os acompanharam e exaltaram o admirável Espírito invisível e sua Barbelo, por causa de quem vieram a existir.


    12. Esta é a pêntade eônica do Pai, que é o Ser Humano Primordial, a imagem do Espírito invisível.


    13. Esta é Providência — isto é, Barbelo —, juntamente com Pensamento, Presciência, Incorruptibilidade, Vida Eterna e Verdade.[a]


    14. Esta é a pêntade eônica andrógina, que constitui a década eônica, a qual é o Pai.[b]


    [a] Embora a enumeração apresente Barbelo e mais cinco nomes, o texto a chama de “pêntade”; sua estrutura e contagem não foram harmonizadas na tradução.


    [b] “Pêntade” significa um conjunto de cinco, e “década”, um conjunto de dez. A passagem relaciona a pêntade andrógina a uma década, provavelmente contando cada realidade sob um aspecto masculino e um feminino; a tradução preserva a formulação do testemunho.'
