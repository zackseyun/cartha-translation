lexical_decisions:
- source_word: universal womb
  choice: ventre universal
  rationale: Preserva a metáfora corporal e cosmogônica sem reduzi-la a um sentido abstrato como “matriz”.
- source_word: Mother-Father
  choice: Mãe-Pai
  rationale: Mantém a expressão composta e sua tensão andrógina.
- source_word: Primal Man / Primal Human
  choice: Ser Humano Primordial
  rationale: Comunica o sentido antropológico abrangente em português atual, sem restringi-lo indevidamente ao sexo masculino.
- source_word: aeon / aeonic
  choice: éon / eônico
  rationale: Mantém o termo técnico da cosmologia do escrito, evitando equipará-lo simplesmente a “era” ou “eternidade”.
- source_word: Idea
  choice: Pensamento
  rationale: Neste contexto, o nome designa uma realidade intelectual hipostasiada; “Pensamento” é mais natural e inteligível que o cognato “Ideia”, embora este continue possível.
- source_word: Precognition
  choice: Presciência
  rationale: Exprime conhecimento antecipado como entidade personificada e conserva o vocabulário teológico tradicional sem especificar seu mecanismo.
- source_word: Indestructibility
  choice: Incorruptibilidade
  rationale: Escolha idiomática no registro religioso e filosófico; abrange a condição de não sofrer corrupção ou perecimento.
- source_word: attended
  choice: acompanhou / acompanharam
  rationale: Preserva a ideia relacional sem impor uma hierarquia como ocorreria com “serviu” ou “assistiu”.
- source_word: issue forth / come forth
  choice: proceder
  rationale: Expressa origem ou emanação em registro cosmogônico, sem explicar além do testemunho.
- source_word: pentad / decad
  choice: pêntade / década
  rationale: Conserva os termos técnicos para conjuntos de cinco e dez; notas breves auxiliam o leitor.
theological_decisions:
- issue: Identificação entre o Espírito invisível e Barbelo em 2
  choice: Preservar literalmente “isto é, Barbelo”
  alternative: Reformular Barbelo apenas como a suplicante, separada do Espírito
  rationale: O testemunho fornecido contém uma identificação sintaticamente tensa; sem revisão copta concluída, a tradução não a resolve silenciosamente.
- issue: Gênero e aspecto andrógino de Barbelo
  choice: Manter pronomes femininos para Barbelo e títulos compostos ou masculinos conforme o testemunho
  alternative: Uniformizar tudo no feminino ou usar linguagem sem gênero
  rationale: A alternância faz parte da apresentação teológica da figura como Mãe-Pai e andrógina.
- issue: Contagem da pêntade em 13–14
  choice: Manter a lista e os números como transmitidos, com notas
  alternative: Alterar a enumeração para produzir exatamente cinco e dez elementos
  rationale: A aparente tensão numérica pertence ao testemunho e não deve ser harmonizada por conjectura.
- issue: Referentes pronominais plurais em 4, 7, 9 e 11
  choice: Preservar os referentes de modo tão aberto quanto o português permite
  alternative: Nomear explicitamente as entidades pressupostas
  rationale: O texto fornecido não torna todos os antecedentes inequívocos; explicitação excessiva importaria interpretação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A redação mantém maiúsculas nos nomes de realidades personificadas e minúscula em “santo” quando integra o título conforme o testemunho. Colchetes e sinais angulares foram preservados como marcas de restauração ou incerteza textual. Trata-se de versão provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta permanece pendente.
