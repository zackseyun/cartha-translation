review_pass:
  verdict: revise
  source_fidelity: 'A tradução conserva adequadamente a sequência cosmológica, os termos técnicos e a personificação feminina. Contudo, há três alterações interpretativas que excedem o testemunho inglês fornecido: «Ele não percebeu o que fazia» acrescenta um objeto e uma ação; «que havia sido retirado» substitui «brought forth»; e «para que eles não dominassem» introduz negação e uma finalidade que o texto-fonte deixa sintaticamente abrupta. Como a revisão direta do copta está pendente, essas ambiguidades devem ser mantidas, não resolvidas.'
  naturalness: O português é claro, moderno e de registro apropriado. A revisão abaixo melhora a precisão sem sacrificar a fluidez, especialmente em «Ele não tinha consciência disso» e na formulação menos interpretativa do período sobre a misericórdia.
  terminology: «Corpo psíquico», «arconte», «potências», «intelecto», «Mãe-Pai» e «Reflexão Radiante» são escolhas consistentes e adequadas. «Luz-sombra» é preferível a «sombra luminosa», pois preserva diretamente a justaposição paradoxal do testemunho, sem inclinar a relação entre os dois elementos.
  issues:
  - severity: medium
    issue: Explicitação de ação em «Ele não percebeu o que fazia».
    rationale: O testemunho diz apenas «He was unaware, because he exists in ignorance». A redação introduz «o que fazia», ausente do texto e potencialmente interpretativa.
  - severity: high
    issue: Inversão interpretativa da cláusula «because they might acquire power».
    rationale: «Para que eles não dominassem» acrescenta a negação e converte uma cláusula causal/possível, sintaticamente difícil no testemunho, em finalidade negativa. A nota reconhece a dificuldade, mas a tradução não deve resolver a ambiguidade sem apoio do copta.
  - severity: medium
    issue: «Havia sido retirado do governante principal» para «had been brought forth from the chief ruler».
    rationale: «Retirado» antecipa e especifica a transferência/recuperação do poder. «Tinha saído» conserva melhor a formulação do testemunho e sua ligação verbal com o parágrafo anterior.
  - severity: low
    issue: «Sombra luminosa» suaviza «light-shadow».
    rationale: Embora idiomática, a expressão altera a ordem e torna a construção menos paradoxal. «Luz-sombra» preserva o composto incomum do texto.
