    With the sacred decree, he dispatched the five lights down onto the place of the angels of the chief archon, and they counseled him that they should bring forth the power of the mother, and they said to Yaltabaoth, “Blow of your Spirit into his face, and his body will stand up.” And he blew into his face his Spirit, which is the power of his mother.


    He was unaware, because he exists in ignorance, and the power of the mother went forth from Yaltabaoth into the psychic body they had formed according to the image of he who is from the beginning.


    The body moved and attained strength, and it was radiant, and at that time the rest of «20» the powers grew envious, because he had come into existence through all of them, and they had bestowed their power on the man, and his intellect surpassed (that of) those who had made him, and the chief archon.


    When, however, they saw that he was radiant, and that he could reason better than they, and that he was unburdened by evil, they took him up and thrust him down into the nethermost region of all matter.


    However, the Blessed One, the Mother-Father, the beneficent and merciful one, showed mercy to the power of the mother which had been brought forth from the chief ruler, because they might acquire power over the psychic and sensory body, and through his beneficent Spirit and his great mercy he dispatched to Adam a helper, Radiant Reflection who emerges out of him, who is called “{Life:1}.”


    She, however, helps the entire creation by laboring together with him, and by restoring to him his perfection, and by instructing him concerning the descent of his seed, and by instructing him concerning the way of ascent, the way by which it descended.


    Further, Reflection of Light was concealed inside Adam, so that the archons would be unknowing, but that Reflection would be a rectification of the deficiency of the mother, and the man became visible on account of the light-shadow inside him, and his intellect surpassed (that of) all those who had made him.'
translation:
  language: pt
  text: 'Entretanto, todos os anjos e demônios trabalharam até formarem o corpo psíquico.[a] A criação deles permaneceu completamente inerte e imóvel por muito tempo.


    Quando, porém, a mãe quis recuperar o poder que havia concedido ao arconte principal,[b] suplicou ao Misericordiosíssimo, o Mãe-Pai do Todo.[c]


    Por meio do decreto sagrado, ele enviou as cinco luzes ao lugar dos anjos do arconte principal. Elas o aconselharam a fazer sair o poder da mãe e disseram a Yaltabaoth: “Sopra do teu Espírito no rosto dele, e seu corpo se levantará”. Então ele soprou no rosto dele o seu Espírito, que é o poder de sua mãe.


    Ele não percebeu o que fazia, pois existe na ignorância. Assim, o poder da mãe saiu de Yaltabaoth e entrou no corpo psíquico que eles haviam formado segundo a imagem daquele que existe desde o princípio.


    O corpo se moveu, adquiriu força e ficou radiante. Então as demais potências ficaram com inveja, pois ele havia vindo à existência por meio de todas elas, e elas haviam dado seu poder ao ser humano. O intelecto dele superava o daqueles que o haviam formado e também o do arconte principal.


    Quando viram que ele era radiante, que raciocinava melhor do que elas e que estava livre do mal, levantaram-no e o lançaram na região mais baixa de toda a matéria.


    O Bendito, porém — o Mãe-Pai, bondoso e misericordioso —, compadeceu-se do poder da mãe que havia sido retirado do governante principal, para que eles não dominassem o corpo psíquico e sensorial.[d] Por meio de seu Espírito bondoso e de sua grande misericórdia, enviou a Adão uma auxiliadora: a Reflexão Radiante, que procede dele e é chamada “Vida”.[e]


    Ela auxilia toda a criação, trabalhando junto com ele, restaurando-o à sua perfeição, instruindo-o a respeito da descida de sua descendência e ensinando-lhe o caminho da subida, o caminho pelo qual ela desceu.[f]


    Além disso, a Reflexão da Luz ficou oculta dentro de Adão, para que os arcontes não soubessem dela e para que essa Reflexão corrigisse a deficiência da mãe. O ser humano tornou-se visível por causa da sombra luminosa que havia dentro dele,[g] e seu intelecto superava o de todos os que o haviam formado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Psíquico” é mantido como termo técnico. Aqui ele designa uma dimensão do corpo humano distinta da dimensão sensorial mencionada adiante.
    reason: Evitar que o leitor entenda o termo apenas no sentido moderno de “psicológico”.
  - marker: b
    text: “Arconte” significa “governante” ou “autoridade” e, neste escrito, designa uma potência cósmica.
    reason: Esclarecer um termo técnico pouco comum sem substituí-lo no texto.
  - marker: c
    text: A expressão composta “Mãe-Pai” preserva a linguagem paradoxal do escrito para a realidade suprema.
    reason: Impedir que a forma incomum seja tomada como erro ou seja harmonizada teologicamente.
  - marker: d
    text: O testemunho inglês traz literalmente uma construção próxima de “porque eles poderiam adquirir poder sobre o corpo psíquico e sensorial”. A tradução entende que a ação misericordiosa visa impedir esse domínio; a revisão direta do copta ainda está pendente.
    reason: Sinalizar uma decisão sintática importante baseada em testemunho secundário.
  - marker: e
    text: O testemunho fornecido apresenta “{Life:1}”, aparentemente um marcador editorial. Traduz-se o nome como “Vida” e omite-se o código interno.
    reason: Remover artefato editorial sem perder o conteúdo nominal.
  - marker: f
    text: O referente de “ela” pode ser a auxiliadora, a descendência ou a realidade associada à descida. A formulação preserva a possível ambiguidade.
    reason: Não resolver silenciosamente uma referência incerta.
  - marker: g
    text: “Sombra luminosa” traduz uma expressão paradoxal que também pode ser vertida de modo mais literal como “luz-sombra”.
    reason: Registrar a forma incomum e uma alternativa formal.
lexical_decisions:
- source_word: psychic body
  choice: corpo psíquico
  rationale: Mantém o termo técnico do testemunho e sua distinção em relação ao corpo sensorial, sem reduzi-lo simplesmente a “alma” ou “corpo animado”.
- source_word: chief archon / chief ruler
  choice: arconte principal / governante principal
  rationale: “Arconte” preserva a designação cosmológica técnica; a variação “governante” acompanha a variação do testemunho e torna o sentido acessível.
- source_word: Mother-Father of the All
  choice: o Mãe-Pai do Todo
  rationale: Preserva a formulação composta e paradoxal, bem como o gênero gramatical sugerido pelo pronome subsequente, sem normalizá-la para uma designação exclusivamente paterna.
- source_word: Radiant Reflection / Reflection of Light
  choice: Reflexão Radiante / Reflexão da Luz
  rationale: Reproduz a variação do testemunho e mantém a personificação feminina indicada pelo contexto.
- source_word: powers
  choice: potências
  rationale: Emprega termo cosmológico amplo que pode indicar seres ou forças, preservando a ambiguidade.
- source_word: intellect
  choice: intelecto
  rationale: Mantém o valor noético do termo, evitando paráfrases como “inteligência” que poderiam estreitar seu sentido técnico.
- source_word: light-shadow
  choice: sombra luminosa
  rationale: Conserva a tensão paradoxal da expressão em português natural, sem explicá-la ou harmonizá-la.
theological_decisions:
- issue: Origem e transferência do poder materno
  choice: Manter que o Espírito de Yaltabaoth é o poder de sua mãe e passa dele ao corpo de Adão
  alternative: Reformular como simples dom divino de vida
  rationale: A sequência cosmológica do texto depende da recuperação involuntária de um poder previamente concedido; uma paráfrase bíblica convencional apagaria essa tensão.
- issue: Identidade e gênero da auxiliadora
  choice: 'Traduzir como figura feminina personificada, “uma auxiliadora: a Reflexão Radiante”'
  alternative: Usar o masculino genérico “um ajudante” ou tratar como qualidade impessoal
  rationale: O testemunho prossegue com pronome feminino e associa a figura a “Vida”; a tradução deve preservar essa personificação.
- issue: Finalidade da compaixão no parágrafo 7
  choice: 'Explicitar a leitura contextual negativa: “para que eles não dominassem”'
  alternative: Conservar literalmente “porque eles poderiam adquirir poder”
  rationale: A sintaxe inglesa é abrupta e potencialmente elíptica; o contexto indica que a ajuda é enviada em misericórdia para impedir o domínio dos governantes. A nota registra a incerteza decorrente da falta de revisão copta.
- issue: Referente na descida e subida
  choice: Manter pronome feminino em “o caminho pelo qual ela desceu”
  alternative: 'Fazer o referente ser a descendência: “pelo qual sua descendência desceu”'
  rationale: O testemunho permite tensão referencial. O feminino pode retomar a descendência ou a auxiliadora; a redação preserva a ambiguidade tanto quanto o português permite.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe foi moderadamente desmembrada para fluidez, enquanto os termos cosmológicos e as tensões conceituais foram preservados. Trata-se de tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta dos manuscritos coptas permanece pendente.
