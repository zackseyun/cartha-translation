translation:
  language: pt
  text: '1. Além disso, da Presciência da Mente Perfeita, mediante a revelação da vontade do Espírito invisível e da vontade do Autogerado, procedeu o Homem Perfeito, a primeira revelação, isto é, a verdade.


    2. Ele é aquele a quem o Espírito virginal deu o nome de Pigera-Adamas. E o estabeleceu sobre o primeiro éon, junto com o Poderoso, o Autogerado, Cristo, diante da primeira luz, Armozel, acompanhado por seus poderes.


    3. Além disso, o Invisível lhe concedeu uma força espiritual e invulnerável.


    4. Então ele falou, exaltou e louvou o Espírito invisível, dizendo: “Por tua causa, o Todo veio à existência, e a ti o Todo retornará.


    5. Eu te louvarei e exaltarei, bem como o Autogerado e os três éons: o Pai, a Mãe e o Filho, o poder perfeito”.


    6. Ele também estabeleceu seu filho Sete sobre o segundo éon, diante da segunda luz, Oroiel. No terceiro éon, a descendência de Sete foi estabelecida sobre a terceira luz, Daveithai; e nele foram colocadas as almas dos santos.


    7. Além disso, no quarto éon foram colocadas as almas daqueles que não conheceram a Plenitude e não se arrependeram de imediato, mas permaneceram assim por algum tempo e só depois se arrependeram.


    8. Estes são a quarta luz, Eleleth.[a]


    9. Estes são seres que exaltam o Espírito invisível.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase traduz literalmente a construção incomum do testemunho disponível: “Estes são a quarta luz, Eleleth”. Também seria possível entender: “Esta é a quarta luz, Eleleth”.'
    reason: Sinaliza uma anomalia de número e referente que não pode ser resolvida com segurança antes da revisão direta dos testemunhos coptas.
lexical_decisions:
- source_word: Precognition
  choice: Presciência
  rationale: Mantém o caráter técnico da emanação ou faculdade personificada, com inicial maiúscula, sem reduzi-la a simples previsão.
- source_word: self-generated one
  choice: Autogerado
  rationale: Preserva como título técnico a ideia de alguém gerado a partir de si mesmo, sem importar terminologia denominacional posterior.
- source_word: aeon
  choice: éon
  rationale: Emprega a transliteração técnica corrente em estudos de textos gnósticos, evitando confundi-la simplesmente com uma era cronológica.
- source_word: the All
  choice: o Todo
  rationale: Conserva o sentido cosmológico abrangente e a provável função técnica da expressão.
- source_word: Fullness
  choice: Plenitude
  rationale: Retém a terminologia cosmológica técnica e sua personificação implícita mediante inicial maiúscula.
- source_word: seed of Seth
  choice: descendência de Sete
  rationale: Em português atual, 'descendência' comunica naturalmente a linhagem coletiva indicada por 'seed'.
- source_word: holy ones
  choice: santos
  rationale: Forma simples e digna para o grupo de pessoas consagradas, sem especificar além do testemunho.
theological_decisions:
- issue: Relação entre o Homem Perfeito, a primeira revelação e a verdade
  choice: 'Manter os três termos em aposição: “o Homem Perfeito, a primeira revelação, isto é, a verdade”'
  alternative: Interpretar “verdade” como entidade distinta ou transformar toda a expressão em oração explicativa
  rationale: O testemunho é sintaticamente condensado; a tradução conserva a identificação provável sem desenvolver uma ontologia não explicitada.
- issue: Referente de “ele” no estabelecimento de Adamas
  choice: Preservar o sujeito pronominal sem identificá-lo nominalmente
  alternative: Explicitar “o Espírito invisível” ou “o Espírito virginal”
  rationale: A sequência permite incerteza quanto ao referente imediato, e explicitá-lo resolveria silenciosamente uma ambiguidade genuína.
- issue: Enumeração “Pai, Mãe, Filho, poder perfeito”
  choice: Traduzir “o Pai, a Mãe e o Filho, o poder perfeito” sem decidir se “poder perfeito” designa apenas o Filho ou a tríade
  alternative: Pontuar de modo a identificar inequivocamente o Filho como o poder perfeito
  rationale: A aposição no testemunho admite mais de uma relação sintática; a pontuação escolhida mantém essa tensão.
- issue: Identidade da quarta luz em relação às almas descritas
  choice: Preservar literalmente o plural “Estes são” seguido do singular “a quarta luz, Eleleth”
  alternative: Harmonizar para “Esta é a quarta luz” ou “Eles pertencem à quarta luz”
  rationale: A formulação incomum pode refletir variação textual, condensação ou problema de transmissão e não deve ser normalizada sem revisão copta.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os nomes técnicos foram preservados: Pigera-Adamas, Armozel, Oroiel, Daveithai e Eleleth. “Sete” segue a forma portuguesa tradicional do nome Seth. A numeração de página intrusa («9») foi omitida por não integrar a frase. Como a revisão direta do copta está pendente, a redação permanece explicitamente baseada no testemunho inglês público fornecido; ambiguidades e irregularidades relevantes foram conservadas.'
