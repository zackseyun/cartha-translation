translation:
  language: pt
  text: '1. Quando olharam para baixo, perceberam que o intelecto dele superava o deles. Então se reuniram em conselho com o grupo dos arcontes e todos os anjos.


    2. Tomaram fogo, terra e água e os combinaram entre si, juntamente com os quatro ventos ardentes. Misturaram tudo, provocando um grande tumulto, e o levaram para a sombra da morte, a fim de moldá-lo outra vez com terra, água, fogo e vento — aquilo cuja origem está na matéria, que é a ignorância das trevas, o desejo e o falso espírito deles.[a]


    3. Este é o túmulo, a forma do corpo com que os ladrões vestiram o ser humano, a corrente do esquecimento; e ele se tornou um homem mortal.


    4. Este é o primeiro que desceu e a primeira separação. Mas a Reflexão da Luz, que habitava dentro dele, despertou-lhe o intelecto.[b]


    5. Depois, os arcontes o levaram e o colocaram no paraíso. Disseram-lhe: “Coma”, isto é, “na indolência”, pois o prazer deles é amargo, sua beleza é corrompida, seu prazer é engano, suas árvores são impiedade, seu fruto é veneno incurável e sua promessa é mortalidade.[c]


    6. Eles, porém, haviam colocado sua árvore da vida no meio do paraíso. Eu ensinarei a todos vocês o mistério da vida deles: é a trama que conceberam juntos, a qual é semelhante ao espírito deles.


    7. Sua raiz é amarga, e seus ramos são mortalidade; sua sombra é ódio, e o engano habita em suas folhas; sua flor é a unção maligna, seu fruto é mortalidade, o desejo é sua semente, e ela brota nas trevas.


    8. Os que dela provam têm o Hades por morada, e as trevas são seu lugar de repouso.


    9. Contudo, para que ele não pudesse erguer os olhos para sua perfeição nem percebesse a vergonha de sua nudez, eles permaneceram diante daquilo que chamam de “árvore do conhecimento do bem e do mal”, que é a Reflexão da Luz.[d] Eu, porém, fui quem os fez comer.”


    10. Perguntei também ao Salvador: “Senhor, não foi a serpente que ensinou Adão a comer?”


    11. O Salvador sorriu e disse: “A serpente os ensinou a comer da maldade do desejo sexual e da destruição, para poder explorá-lo.[e]


    12. Além disso, ele sabia que Adão lhe desobedecia por causa da Reflexão da Luz que nele habita, a qual tornou o intelecto de Adão mais preciso que o do arconte principal. Então ele quis retirar o poder que ele mesmo lhe havia dado e fez cair um ‘transe’ sobre Adão.”[f]


    13. Perguntei ainda ao Salvador: “O que é o ‘transe’?”


    14. Ele respondeu: “Não é como Moisés escreveu, nem como vocês ouviram. Pois ele disse em seu primeiro livro: ‘Ele o fez dormir’. Na verdade, fez adormecer sua percepção, pois disse por meio do profeta: ‘Tornarei pesado o coração deles, para que não prestem atenção nem vejam’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A construção final é densa: “aquilo cuja origem está na matéria” pode se referir ao composto usado para remodelar Adão ou à forma corporal resultante.'
    reason: Preservar uma ambiguidade sintática relevante do testemunho.
  - marker: b
    text: “Reflexão da Luz” traduz uma figura personificada; o testemunho a trata no feminino.
    reason: Esclarecer a manutenção deliberada da personificação e do gênero.
  - marker: c
    text: A ligação entre “Coma” e “na indolência” é obscura no testemunho disponível e pode refletir um jogo verbal do texto antigo.
    reason: Sinalizar uma dificuldade textual sem conjecturar uma solução.
  - marker: d
    text: A frase pode identificar a árvore com a Reflexão da Luz ou situar a Reflexão diante dela; a redação transmitida é incerta.
    reason: Registrar uma ambiguidade que afeta a interpretação narrativa.
  - marker: e
    text: O trecho alterna entre o plural (“os”) e o singular (“explorá-lo”), mudança preservada do testemunho.
    reason: Evitar corrigir silenciosamente a oscilação de número.
  - marker: f
    text: Os referentes de vários pronomes nesta frase não são totalmente claros; o sentido geral envolve Adão, a Reflexão da Luz e o arconte principal.
    reason: Impedir que a tradução apresente como certa uma identificação interpretativa.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional da literatura gnóstica, evitando reduzi-lo genericamente a ‘governantes’.
- source_word: intellect
  choice: intelecto
  rationale: Preserva o vocabulário antropológico e contemplativo do testemunho, sem confundi-lo com simples inteligência prática.
- source_word: Reflection of Light
  choice: Reflexão da Luz
  rationale: Conserva a possível personificação feminina e a relação lexical com luz, sem impor uma identificação doutrinária.
- source_word: lust
  choice: desejo / desejo sexual
  rationale: ‘Desejo’ preserva maior amplitude nos vv. 2 e 7; no v. 11, o contexto explicitamente sexual justifica ‘desejo sexual’.
- source_word: trance
  choice: transe
  rationale: Mantém a releitura polêmica do sono de Adão e sua distinção subsequente entre sono corporal e percepção adormecida.
- source_word: Hades
  choice: Hades
  rationale: Preserva o nome cosmológico do lugar dos mortos, sem equipará-lo automaticamente ao inferno.
theological_decisions:
- issue: Identidade e gênero da Reflexão da Luz
  choice: Tratada como entidade personificada feminina onde a sintaxe permite
  alternative: Interpretá-la como faculdade mental impessoal
  rationale: O testemunho usa pronome feminino e lhe atribui ação própria; a tradução preserva essa personificação sem explicar sua ontologia.
- issue: Referentes pronominais no v. 12
  choice: Uso de ‘ele’, com ‘Adão’ explicitado apenas onde necessário à legibilidade
  alternative: Identificar todos os pronomes como o arconte principal ou Adão
  rationale: A cadeia de referentes é ambígua no testemunho; uma resolução completa importaria interpretação não garantida.
- issue: Árvore do conhecimento no v. 9
  choice: Preservada a identificação sintaticamente difícil com a Reflexão da Luz
  alternative: Reformular para dizer que a Reflexão estava diante da árvore
  rationale: O texto transmitido permite tensão ou corrupção; a tradução não deve harmonizá-lo silenciosamente com Gênesis.
- issue: Crítica a Moisés no v. 14
  choice: Mantida de forma direta
  alternative: Suavizar como mera interpretação alternativa
  rationale: O diálogo contrasta explicitamente o que Moisés escreveu com a explicação do Salvador.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e vocabulário técnico mantido quando necessário. Os números de página do manuscrito e os marcadores editoriais em chaves foram omitidos. Como a revisão direta do copta está pendente, este é um rascunho provisório fundamentado no testemunho inglês público fornecido; dificuldades e ambiguidades relevantes foram preservadas e anotadas.
