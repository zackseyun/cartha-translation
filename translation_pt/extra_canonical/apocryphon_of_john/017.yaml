  text: 'I appeared in the form of an eagle on the tree of knowledge, which is the Reflection of the Providence of Pure Light, so that I could instruct them and awaken them from their deep sleep, because both of them had fallen and were aware of their nakedness.


    Reflection appeared to them as a light and awakened their minds. But when ‹Y›aldabaoth realized that they had withdrawn from him, he cursed his earth.


    He encountered the woman while she was «24» preparing herself for her husband.


    He was her overlord, although he did not know the mystery that had taken place through the sacred decree. They were afraid to accuse him. He revealed to his angels the ignorance within him, expelled them from paradise, and clothed them in dark gloom.


    The chief archon also saw the virgin who stood near Adam and saw that the radiant Reflection of Life had appeared within her. ‹Y›aldabaoth was filled with ignorance. When the Providence of the All saw this, she sent messengers, and they quickly removed Life from Eve.


    Then the chief archon polluted her, and he fathered two sons with her, the first and the second: Eloim and Yave.


    Eloim has the face of a bear, but Yave has the face of a cat.


    Yave is just, but Eloim is unjust.


    Yave was placed over fire and wind, while Eloim was placed over water and earth. But with the intent to deceive, he called them by the names Cain and Abel.


    Sexual intercourse has continued until today because of the chief archon. It was he who planted sexual desire within the woman who belongs to Adam. Through intercourse he made copies of the bodies and inspired them with his false spirit.


    He placed the two archons over several principalities so that they would rule over the tomb.


    But when Adam became aware of the likeness of his own foreknowledge, he fathered the likeness «25» of the Son of Man, whom he called Seth, in agreement with the way the race exists among the aeons.


    Similarly, the mother also sent down her spirit, which is in her own likeness, along with an image of the one who dwells in the Fullness, because she will prepare a dwelling place for the aeons who will descend.


    He also made them drink the water of oblivion from the chief archon so that they would not know the place of their origin.


    In this way, the seed remained for a time to help, so that when the Spirit comes forth from the sacred aeons, he will raise him up and heal him of his deficiency, so that the entire Fullness will become holy and without fault.”'
translation:
  language: pt
  text: 'Eu apareci em forma de águia sobre a árvore do conhecimento, que é o Reflexo da Providência da Luz Pura, para instruí-los e despertá-los de seu sono profundo, pois ambos haviam caído e tinham consciência de sua nudez.


    O Reflexo lhes apareceu como luz e despertou o pensamento deles. Mas, quando Yaldabaoth percebeu que eles haviam se afastado dele, amaldiçoou sua terra.


    Ele encontrou a mulher enquanto ela se preparava para seu marido.


    Ele era o senhor dela, embora não conhecesse o mistério que havia acontecido por meio do decreto sagrado. Eles tinham medo de acusá-lo. Ele revelou aos seus anjos a ignorância que havia dentro dele, expulsou os dois do paraíso e os revestiu de trevas sombrias.


    O arconte principal também viu a virgem que estava junto de Adão e percebeu que o radiante Reflexo da Vida havia aparecido dentro dela. Yaldabaoth encheu-se de ignorância. Quando a Providência do Todo viu isso, enviou mensageiros, e eles rapidamente retiraram Vida de Eva.


    Então o arconte principal a profanou e gerou com ela dois filhos, o primeiro e o segundo: Eloim e Yave.


    Eloim tem rosto de urso, mas Yave tem rosto de gato.


    Yave é justo, mas Eloim é injusto.


    Yave foi posto sobre o fogo e o vento, enquanto Eloim foi posto sobre a água e a terra. Mas, com a intenção de enganar, ele lhes deu os nomes Caim e Abel.


    Até hoje, a relação sexual tem continuado por causa do arconte principal. Foi ele quem implantou o desejo sexual naquela que pertence a Adão. Por meio da relação sexual, produziu cópias dos corpos e insuflou nelas seu espírito falso.


    Ele colocou os dois arcontes sobre vários principados, para que governassem sobre o túmulo.


    Mas, quando Adão tomou consciência da imagem de sua própria presciência, gerou a imagem do Filho do Homem, a quem chamou Sete, de acordo com o modo como a linhagem existe entre os éons.[a]


    Do mesmo modo, a mãe também fez descer seu espírito, que é conforme a própria imagem dela, juntamente com uma representação daquele que habita na Plenitude, pois ela preparará uma morada para os éons que descerão.[b]


    Ele também os fez beber a água do esquecimento, proveniente do arconte principal, para que não conhecessem o lugar de sua origem.[c]


    Assim, a semente permaneceu por algum tempo para prestar auxílio, a fim de que, quando o Espírito proceder dos éons sagrados, ele a erga e a cure de sua deficiência, para que toda a Plenitude se torne santa e irrepreensível.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éons” é um termo técnico para as realidades ou entidades da ordem divina. “Linhagem” também pode ser entendida como “raça” ou “descendência”.
    reason: Esclarece vocabulário cosmológico pouco familiar e preserva a amplitude do termo coletivo.
  - marker: b
    text: “Representação” traduz um termo vertido no testemunho como “simulacro”; a expressão pode indicar uma imagem ou contraparte, sem definir aqui sua natureza exata.
    reason: Evita que “simulacro” seja entendido apenas em sentido pejorativo e registra a incerteza conceitual.
  - marker: c
    text: A construção desta frase e o referente exato de “ele” são incertos no testemunho disponível.
    reason: Assinala uma dificuldade real de sintaxe e referência que não deve ser resolvida silenciosamente.
  - marker: d
    text: O testemunho fala de “a semente”, mas depois emprega formas pronominais masculinas. A tradução entende a semente coletivamente, sem excluir outro referente possível.
    reason: Preserva a tensão gramatical e interpretativa do período final.
lexical_decisions:
- source_word: Reflection
  choice: Reflexo
  rationale: Mantém a imagem conceitual do testemunho e permite a personificação feminina indicada pelo contexto, sem substituí-la por um termo interpretativo como “Pensamento”.
- source_word: Providence
  choice: Providência
  rationale: Preserva o termo técnico e sua personificação no sistema cosmológico do escrito.
- source_word: chief archon
  choice: arconte principal
  rationale: Retém o vocábulo técnico “arconte”, já corrente em português acadêmico e religioso, e traduz “chief” de modo claro sem identificar a figura com categorias externas ao texto.
- source_word: polluted
  choice: profanou
  rationale: Comunica violação e impureza sem reduzir o verbo à ideia moderna de poluição ambiental; conserva a gravidade e alguma amplitude semântica.
- source_word: aeons
  choice: éons
  rationale: Transliteração técnica consagrada para as entidades ou esferas da cosmologia gnóstica; evita o sentido meramente cronológico de “eras”.
- source_word: Fullness
  choice: Plenitude
  rationale: Traduz o conceito técnico normalmente associado a Pleroma, mantendo a inicial maiúscula para sinalizar seu uso cosmológico.
- source_word: foreknowledge / precognition
  choice: presciência
  rationale: Preserva a noção de conhecimento antecipado e seu provável valor técnico, sem normalizá-la como simples memória ou entendimento.
- source_word: seed
  choice: semente
  rationale: Mantém a metáfora coletiva e a ambiguidade entre descendência, elemento espiritual e grupo humano.
- source_word: tomb
  choice: túmulo
  rationale: Tradução formal que conserva a imagem enigmática do testemunho, sem explicá-la como “corpo” ou “mundo”.
theological_decisions:
- issue: Identidade e gênero gramatical de “Reflection” e “Providence”
  choice: Manter as figuras distintas e acompanhar a personificação feminina da Providência onde o testemunho usa “she”
  alternative: Fundir ambas como uma única entidade ou neutralizar toda personificação
  rationale: O texto associa intimamente os conceitos, mas não autoriza eliminar suas designações próprias nem resolver por completo sua relação.
- issue: Natureza do ato do arconte contra Eva
  choice: “a profanou”
  alternative: “a violentou”, “a contaminou” ou “teve relações com ela”
  rationale: O testemunho afirma profanação e geração de filhos, mas não explicita com precisão moderna a natureza ou o grau de coerção do ato; a tradução evita acrescentar uma especificação não assegurada.
- issue: Referente de “he” ao dar os nomes Caim e Abel
  choice: Conservar o sujeito masculino singular sem explicitá-lo além de “ele”
  alternative: Nomear Yaldabaoth ou o arconte principal
  rationale: O referente é provável pelo contexto, mas a forma testemunhada mantém o pronome; explicitá-lo eliminaria uma pequena ambiguidade.
- issue: Pronomes no período final
  choice: Verter “seed” como feminino em português e usar “a erga” e “a cure”
  alternative: Interpretar o pronome masculino do testemunho como referente a um indivíduo específico
  rationale: O testemunho alterna uma “semente” coletiva com pronome masculino. A concordância portuguesa torna a frase legível, enquanto a nota registra a oscilação textual sem impor uma identificação teológica.
- issue: A água do esquecimento e seu agente
  choice: Preservar a formulação difícil “proveniente do arconte principal”
  alternative: Reformular como “a água do esquecimento do arconte principal” ou identificar outro agente
  rationale: A sintaxe e a sequência de referentes são difíceis; a tradução evita harmonizar a passagem ou criar uma posse teológica mais definida do que o testemunho permite.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário internacional. Termos cosmológicos necessários — “arconte”, “éons” e “Plenitude” — foram preservados e, quando útil, explicados em nota. A numeração de páginas do manuscrito («24» e «25») foi omitida por interromper as frases. Como a revisão direta do copta ainda está pendente, esta redação permanece baseada no testemunho inglês público fornecido e evita emendas conjecturais.
