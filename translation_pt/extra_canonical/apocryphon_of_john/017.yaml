  naturalness: O português é moderno, claro e de registro apropriado. Foram feitos ajustes pontuais para melhorar a fluência de expressões técnicas e de construções potencialmente pesadas, mantendo a legibilidade brasileira e internacional.
  terminology: “Reflexo”, “Providência”, “arconte principal”, “éons”, “Plenitude”, “presciência” e “túmulo” são escolhas consistentes com o testemunho e com o caráter técnico da passagem. “Profanou” preserva a gravidade sem especificar indevidamente a natureza do ato.
  issues:
  - severity: medium
    issue: “ambos haviam caído” em vez de uma condição decaída
    rationale: O testemunho diz que ambos “were in a fallen condition”; a formulação original pode sugerir mais fortemente um evento anterior de queda do que o estado descrito.
  - severity: low
    issue: “retiraram Vida de Eva”
    rationale: O testemunho especifica que Vida foi removida “from out of Eve”. “De dentro de Eva” preserva melhor a imagem espacial.
  - severity: low
    issue: “imagem” para “likeness” em Apocryphon 17.12
    rationale: “Semelhança” mantém uma correspondência mais próxima e evita confundir esse termo com “representation”, que verte o distinto “simulacrum” no parágrafo seguinte.
