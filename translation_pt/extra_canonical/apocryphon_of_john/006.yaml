    And the Logos followed Will, because by means of the Logos, Christ, the self-generated God, created the All.'
translation:
  language: pt
  text: '1. Ele também contemplou Barbelo com a luz pura que circunda o Espírito invisível e com a centelha dele; e ela concebeu dele.


    2. Ele gerou uma centelha de luz por meio de uma luz semelhante à bem-aventurança; esta, porém, não é igual à grandeza dele.


    3. Assim veio a ser um Unigênito da Mãe-Pai, que havia emanado: sua única descendência, o Unigênito do Pai, a luz pura.


    4. O Espírito invisível e virginal também se alegrou por causa da luz que havia passado a existir, que havia emanado do primeiro poder de sua Providência — isto é, Barbelo —,


    5. e ungiu-o com sua unção até que ele se tornasse perfeito, sem nada lhe faltar da unção, pois o havia ungido com a unção do Espírito invisível. E permaneceu junto dele enquanto a derramava sobre ele. Assim que recebeu do Espírito, ele exaltou o Espírito Santo e a Providência perfeita, por causa da qual havia emanado.


    6. Ele também pediu que lhe fosse dado um cooperador, que é a Mente; e o Espírito consentiu de bom grado.


    7. Quando o Espírito invisível consentiu, a Mente se aproximou e permaneceu junto de Cristo, o Ungido[a], exaltando-o e também a Barbelo. E todos eles passaram a habitar no silêncio.


    8. A Mente também quis produzir algo por meio do Logos[b] do Espírito invisível. Sua Vontade, até então potencial, tornou-se realidade e se aproximou com a Mente e a Luz, exaltando-o.


    9. E o Logos seguiu a Vontade, pois, por meio do Logos, Cristo, o Deus Autogerado, criou a Totalidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Cristo” significa “Ungido”.
    reason: Torna acessível ao leitor comum a explicação parentética presente no testemunho.
  - marker: b
    text: “Logos” pode significar palavra, expressão ou princípio racional.
    reason: Preserva a amplitude do termo técnico e explica por que ele não foi reduzido a um único equivalente português.
lexical_decisions:
- source_word: Barbelo
  choice: Barbelo
  rationale: Mantém o nome técnico da figura emanada sem tentar identificá-la ou explicá-la por uma tradição posterior.
- source_word: Mother-Father
  choice: Mãe-Pai
  rationale: Reproduz a formulação composta e paradoxal do testemunho, preservando sua tensão de gênero e função.
- source_word: Mind
  choice: Mente
  rationale: Usa equivalente português claro e o trata como entidade personificada no contexto.
- source_word: Logos
  choice: Logos
  rationale: Retém o termo técnico transliterado, pois pode abranger palavra, expressão e princípio racional; 'Verbo' estreitaria suas ressonâncias.
- source_word: self-generated
  choice: Autogerado
  rationale: Preserva a designação técnica de origem própria sem substituí-la por linguagem cristológica denominacional.
- source_word: the All
  choice: a Totalidade
  rationale: Expressa o sentido cosmológico do conjunto de tudo o que foi criado, evitando o português pouco natural 'o Todo'.
- source_word: Providence
  choice: Providência
  rationale: A inicial maiúscula sinaliza uma realidade personificada, identificada no texto com Barbelo.
theological_decisions:
- issue: Relação entre Cristo e a unção
  choice: Cristo, o Ungido
  alternative: Cristo (o ungido)
  rationale: Explicita o valor titular de 'Christ' sem fazer afirmações além da própria etimologia e do ato de unção narrado.
- issue: Designação Mãe-Pai
  choice: Preservar literalmente 'Mãe-Pai'
  alternative: Parente primordial ou Pai-Mãe
  rationale: Evita normalizar a linguagem teológica peculiar do escrito e conserva a ordem do testemunho fornecido.
- issue: Agência e referentes pronominais
  choice: Manter referentes abertos quando o testemunho não os resolve, esclarecendo apenas onde a sintaxe portuguesa exige
  alternative: Atribuir sistematicamente cada ação ao Espírito, a Barbelo ou ao Unigênito
  rationale: O trecho contém cadeias pronominais genuinamente difíceis; uma resolução ampla importaria interpretação não garantida.
- issue: Criação da Totalidade
  choice: Conservar Cristo como Deus Autogerado que cria por meio do Logos
  alternative: Fundir Cristo e Logos em um único título sem distinção sintática
  rationale: Mantém a formulação e a tensão do testemunho, no qual Cristo cria por meio do Logos e ambos aparecem estreitamente relacionados.
translation_notes:
  register: Português moderno, digno e legível, com termos cosmológicos personificados em inicial maiúscula. A redação preserva repetições deliberadas, paralelismos e ambiguidades pronominais relevantes. Trata-se de versão provisória baseada no testemunho inglês público fornecido; a revisão direta dos manuscritos coptas ainda está pendente.
