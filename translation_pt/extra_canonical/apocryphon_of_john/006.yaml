    3. Tal era o Unigênito da Mãe-Pai que havia emanado, sendo ele sua única prole, o Unigênito do Pai, a luz pura.


    4. O Espírito invisível e virginal também se alegrou por causa da luz que havia passado a existir, que havia emanado do primeiro poder de sua Providência — isto é, Barbelo —


    5. e ungiu-o com sua unção até que ele se tornasse perfeito, sem nada lhe faltar da unção, pois o havia ungido com a unção do Espírito invisível. E permaneceu junto dele enquanto a derramava sobre ele. Assim que recebeu do Espírito, ele exaltou o Espírito Santo e a Providência perfeita, por causa da qual havia emanado.


    6. Ele também pediu que lhe fosse dado um colaborador, que é a Mente; e o Espírito consentiu de bom grado.


    7. Quando o Espírito invisível consentiu, a Mente se aproximou, e ele permaneceu junto de Cristo, o Ungido[a], exaltando-o e também a Barbelo. E todos eles passaram a habitar no interior do silêncio.


    8. A Mente também quis produzir algo por meio do Logos[b] do Espírito invisível. Sua Vontade, até então potencial, tornou-se efetiva e se aproximou com a Mente e a Luz, exaltando-o.


