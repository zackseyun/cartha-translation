  text: 'He also established seven kings, each corresponding to the heavenly firmaments above the seven heavens, and five over the depths of the abyss, so that they would rule.


    He also shared his fire with them, but he did not send out any of the power of the light he had obtained from his mother, because he is ignorant darkness. When the light combined with the darkness, it made the darkness shine; and when the darkness combined with the light, it darkened the light. It became neither light nor darkness, but grew gloomy.


    The feeble archon has three names. The first name is Yaltabaoth, the second is Saklas, and the third is Samael. He is wicked in the pride within him, because he said, “I am God, and there is no god other than me.” For he is unaware of his own strength and of the place from which he originated.


    The archons also created seven powers for themselves, and each of the powers created six angels for themselves, so that they numbered 365 angels. These are the bodies that pertain to the names:


    The first ‹is› Athoth—he has the face of a sheep; the second is Eloaiou—he has the face of a donkey; the third is Astaphaios—he has the face of a [hyena]; the fourth is Yao—he has the face of a seven-headed [dragon]; the fifth is Sabaoth—he has the face of a dragon; the sixth is Adonin—he has the face of a monkey; the seventh is Sabbede—he has the face of a glowing fire.


    These are the sevenfold (aspect) of the week.


    Yaltabaoth, however, had a multitude «12» of faces—more than all the others—so that when he was among the seraphs, he was able to put on any face before all of them, as he wished.


    Because he shared his fire with them, he became their overlord.


    Because of the glorious power he possessed through his mother’s light, he called himself God, and he was disobedient to the place from which he had originated.


    He also joined the seven powers within his thought together with the authorities who were with him. When he spoke, it happened, and he named each of the powers, beginning with the highest:


    The first is Goodness, together with the first authority, Athoth; the second is Providence, together with the second authority, Eloaio; the third is Divinity, together with the third authority, Astraphaio; the fourth is Lordship, together with the fourth authority, Yao; the fifth is Kingdom, together with the fifth authority, Sabaoth; the sixth is Jealousy, together with the sixth authority, Adonein; the seventh is Sophia, together with the seventh authority, Sabbateon.


    These also have a firmament corresponding to each heavenly aeon.


    They were given names corresponding to the glory of the heavenly beings, to bring about the [annihilation of the] powers. But power dwelt in the names given to [them by] their originator, while the names given to them in accordance with the glory of the heavenly beings will mean annihilation and feebleness for them.


    In this way, they have two names.


    [Further, after] creating [everything, he organized] them according to the likeness of the first aeons that had come into being, so that he could «13» create them after the likeness of the indestructible ones.


    It was not because he had seen the indestructible beings, but because of the power within him, which he had obtained from his mother, that he generated within himself the likeness of the world. When he saw the creation around him and the host of angels around him, which had issued from him, he declared to them, “I am a jealous God, and there is no God other than me.”


    By declaring this, however, he indicated to the angels attending him that there is another God. For if there were no other, how could he be jealous of another?


    The mother then began “to {move:3} back and forth,” becoming aware of the deficiency as the brightness of her light decreased, and she grew dark because her companion had not agreed together with her.'
translation:
  language: pt
  text: 'Ele também estabeleceu sete reis, cada um correspondente aos firmamentos celestes acima dos sete céus, e outros cinco sobre as profundezas do abismo, para que governassem.


    Também compartilhou com eles o seu fogo, mas não lhes transmitiu nada do poder da luz que havia recebido de sua mãe, pois ele é treva ignorante. Quando a luz se uniu à treva, fez a treva brilhar; e, quando a treva se uniu à luz, escureceu a luz. Ela não se tornou nem luz nem treva, mas ficou sombria.


    O arconte fraco tem três nomes. O primeiro é Yaltabaoth; o segundo, Saklas; e o terceiro, Samael. Ele é perverso por causa do orgulho que há dentro dele, pois disse: “Eu sou Deus, e não há outro deus além de mim”. Isso porque ele desconhece a própria força e o lugar de onde se originou.


    Os arcontes também criaram para si sete poderes, e cada um dos poderes criou para si seis anjos, totalizando 365 anjos. Estes são os corpos relacionados aos nomes:


    O primeiro ‹é› Athoth — ele tem rosto de ovelha; o segundo é Eloaiou — ele tem rosto de jumento; o terceiro é Astaphaios — ele tem rosto de [hiena]; o quarto é Yao — ele tem rosto de [dragão] de sete cabeças; o quinto é Sabaoth — ele tem rosto de dragão; o sexto é Adonin — ele tem rosto de macaco; o sétimo é Sabbede — ele tem rosto de fogo resplandecente.


    Estes são o aspecto sétuplo da semana.[a]


    Yaltabaoth, porém, tinha uma multidão de rostos — mais do que todos os outros —, de modo que, quando estava entre os serafins, podia assumir diante deles qualquer rosto que desejasse.[b]


    Por ter compartilhado o seu fogo com eles, tornou-se o senhor deles.


    Por causa do poder glorioso que possuía graças à luz de sua mãe, chamou a si mesmo de Deus e desobedeceu ao lugar de onde se originou.


    Ele também uniu, dentro de seu pensamento, os sete poderes às autoridades que estavam com ele. Quando falou, aconteceu; e deu nome a cada um dos poderes, começando pelo mais elevado:


    O primeiro é Bondade, junto com a primeira autoridade, Athoth; o segundo é Providência, junto com a segunda autoridade, Eloaio; o terceiro é Divindade, junto com a terceira autoridade, Astraphaio; o quarto é Domínio, junto com a quarta autoridade, Yao; o quinto é Reino, junto com a quinta autoridade, Sabaoth; o sexto é Ciúme, junto com a sexta autoridade, Adonein; o sétimo é Sophia, junto com a sétima autoridade, Sabbateon.[c]


    Eles também possuem, cada qual, um firmamento correspondente a um éon celeste.[d]


    Foram-lhes dados nomes correspondentes à glória dos seres celestes, para causar a [aniquilação dos] poderes. Contudo, havia poder nos nomes que o seu originador lhes dera, enquanto os nomes que lhes foram dados de acordo com a glória dos seres celestes significarão para eles aniquilação e fraqueza.[e]


    Assim, eles têm dois nomes.


    [Além disso, depois de] criar [todas as coisas, ele as organizou] conforme a semelhança dos primeiros éons que haviam vindo à existência, a fim de criá-las à semelhança dos seres indestrutíveis.[f]


    Não foi porque tivesse visto os seres indestrutíveis, mas por causa do poder que havia dentro dele, recebido de sua mãe, que ele gerou dentro de si a imagem do mundo. Quando viu a criação ao seu redor e o exército de anjos que o cercava e que havia procedido dele, declarou-lhes: “Eu sou um Deus ciumento, e não há outro Deus além de mim”.


    Ao declarar isso, porém, indicou aos anjos que o serviam que existe outro Deus. Pois, se não existisse outro, como poderia ele ter ciúme de outro?


    A mãe então começou a “mover-se de um lado para outro”, tomando consciência da deficiência à medida que o brilho de sua luz diminuía; e ela escureceu porque seu companheiro não havia concordado com ela.[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “aspecto sétuplo da semana” é obscura e parece relacionar as sete figuras aos sete dias ou às esferas associadas a eles.
    reason: Sinalizar uma formulação difícil sem resolvê-la no corpo do texto.
  - marker: b
    text: O testemunho inglês registra aqui o número de página do manuscrito «12», omitido do texto corrido por não pertencer à frase.
    reason: Documentar a remoção de um marcador codicológico intrusivo.
  - marker: c
    text: As formas dos nomes variam ligeiramente entre as duas listas — por exemplo, Eloaiou/Eloaio e Astaphaios/Astraphaio — e foram preservadas como aparecem no testemunho.
    reason: Evitar harmonizar variantes ou possíveis diferenças deliberadas.
  - marker: d
    text: “Éon” é um termo cosmológico que pode designar uma realidade, domínio ou entidade celeste.
    reason: Auxiliar leitores comuns sem substituir o termo técnico no texto.
  - marker: e
    text: A passagem sobre os dois conjuntos de nomes e seus efeitos é difícil; os colchetes indicam reconstruções editoriais no testemunho disponível.
    reason: Preservar a incerteza textual e semântica.
  - marker: f
    text: Os colchetes assinalam texto restaurado editorialmente. O número de página do manuscrito «13» foi omitido do texto corrido.
    reason: Distinguir reconstrução de texto preservado e documentar o marcador removido.
  - marker: g
    text: O testemunho traz uma notação editorial obscura junto ao verbo “mover”. A tradução apresenta o sentido proposto sem tentar interpretar o código editorial; “companheiro” permanece sem identificação.
    reason: Produzir português legível sem converter uma notação opaca em afirmação teológica.
lexical_decisions:
- source_word: archon
  choice: arconte
  rationale: Mantém o termo técnico corrente nos estudos de textos gnósticos, evitando reduzir o conceito a “governante” ou “príncipe”.
- source_word: power
  choice: poder
  rationale: Preserva a repetição e a elasticidade semântica do testemunho, em que o termo pode designar tanto potência quanto uma entidade personificada.
- source_word: aeon
  choice: éon
  rationale: Conserva o vocabulário cosmológico técnico, pois “era” não comunicaria adequadamente a possível referência a uma entidade ou domínio celeste.
- source_word: Lordship
  choice: Domínio
  rationale: Expressa uma esfera ou qualidade de governo e mantém distinção em relação a “Reino”.
- source_word: Sophia
  choice: Sophia
  rationale: Mantém o nome próprio tradicional da figura, sem traduzi-lo silenciosamente como “Sabedoria”.
- source_word: ignorant darkness
  choice: treva ignorante
  rationale: Preserva a formulação personificada e teologicamente carregada, em vez de normalizá-la como mera falta de conhecimento.
- source_word: overlord
  choice: senhor deles
  rationale: Solução natural em português que comunica supremacia sobre o grupo sem introduzir um título técnico ausente.
theological_decisions:
- issue: Alegação de exclusividade divina de Yaltabaoth
  choice: Preservar “Eu sou Deus, e não há outro deus além de mim” e a posterior inferência irônica do narrador
  alternative: Harmonizar a declaração com o monoteísmo bíblico canônico
  rationale: O contraste e a crítica à ignorância do arconte são essenciais à teologia própria do documento e não devem ser suavizados.
- issue: Relação entre luz e treva
  choice: 'Manter a reciprocidade paradoxal: a luz ilumina a treva e a treva escurece a luz'
  alternative: Explicar a mistura como corrupção unilateral
  rationale: O texto sustenta deliberadamente a tensão e conclui com um estado que não é nem luz nem treva.
- issue: Nomes celestes como fonte de poder e aniquilação
  choice: Preservar a aparente tensão entre os dois conjuntos de nomes
  alternative: Reformular para identificar inequivocamente quais nomes salvam ou destroem
  rationale: A passagem é textualmente difícil e não autoriza resolver de forma segura o referente de cada afirmação.
- issue: Deficiência da mãe e desacordo do companheiro
  choice: Traduzir sem identificar ou explicar as figuras
  alternative: Inserir nomes ou uma interpretação cosmológica específica
  rationale: A unidade fornecida não nomeia o companheiro nem explicita toda a relação; acrescentá-los importaria uma reconstrução doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A sintaxe foi moderadamente simplificada, mas as repetições, paradoxos e termos cosmológicos técnicos foram preservados. Os nomes próprios foram transliterados conforme o testemunho fornecido. A tradução é necessariamente provisória, pois a revisão direta do copta ainda está pendente e a base disponível é um testemunho inglês de domínio público.
