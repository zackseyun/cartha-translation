review_pass:
  verdict: revise
  source_fidelity: A tradução preserva bem a sequência, a numeração descontínua, os nomes e a terminologia cosmológica. Contudo, “governa as profundezas” interpreta de modo mais forte o inglês provisório “is over”, que também pode indicar mera posição ou superintendência. “Está sobre” conserva a ambiguidade da testemunha e deve ser preferido enquanto falta revisão direta do copta.
  naturalness: O português é claro e de registro adequado. “O mau [{olho:1}]” é deliberadamente estranho por reproduzir uma lacuna/notação editorial interna da testemunha; a nota torna essa opção transparente. A redação do v. 1 conserva a elipse presente na testemunha provisória sem suprir um objeto que ela não fornece.
  terminology: “Éons”, “centelha luminosa”, “autoridades”, “Ceifador”, “Hades” e os nomes próprios são escolhas adequadas. “Caim” segue a forma portuguesa corrente. A alteração de “governa” para “está sobre” evita impor uma leitura de autoridade governamental.
  issues:
  - severity: medium
    issue: “que governa as profundezas do Hades” em 15
    rationale: A formulação torna explícita uma função de governo que a testemunha inglesa expressa apenas por “is over”. Como a revisão copta está pendente, a tradução deve preservar essa amplitude semântica.
