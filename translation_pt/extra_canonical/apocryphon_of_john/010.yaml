translation:
  language: pt
  text: '1. Ele tomou para si e criou outros éons com uma centelha luminosa que existe ainda agora. Ficou maravilhado com o orgulho que havia dentro dele e gerou para si autoridades.


    4. O primeiro se chama Athoth, a quem as gerações chamam [o Ceifador].[a]


    5. O segundo é Harmas, [que é] o mau [{olho:1}].[b]


    6. O terceiro é Kalila-Oumbri.


    7. O quarto é Yabel.


    8. O quinto é Adonaiou, chamado Sabaoth.


    9. O sexto é Caim, a quem as gerações humanas chamam o Sol.


    10. O sétimo é Abel.


    11. O oitavo é Abrisene.


    12. O nono é Yobel.


    13. O décimo é Armoupieel.


    14. O décimo primeiro é Melcheir-Adonein.


    15. O décimo segundo é Belias, que governa as profundezas do Hades.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Ceifador” está entre colchetes na testemunha utilizada, indicando texto restaurado ou editorialmente suprido.
    reason: Preservar transparência sobre a condição textual da expressão.
  - marker: b
    text: A expressão “[{olho:1}]” reproduz uma notação de restauração presente na testemunha inglesa fornecida; seu valor exato deverá ser revisto diretamente nos manuscritos coptas.
    reason: Evitar converter uma notação editorial incerta em texto corrido supostamente seguro.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Mantém o termo cosmológico técnico do texto, em vez de reduzi-lo a simples períodos de tempo ou mundos.
- source_word: shining spark
  choice: centelha luminosa
  rationale: Reproduz de modo natural a imagem de uma pequena parcela de luz.
- source_word: authorities
  choice: autoridades
  rationale: Preserva o sentido de seres ou poderes governantes sem impor o termo teológico mais específico “potestades”.
- source_word: generations
  choice: gerações
  rationale: Conserva a expressão coletiva e sua possível referência às sucessivas gerações humanas.
- source_word: the Reaper
  choice: o Ceifador
  rationale: Mantém o título e sua metáfora de colher ou ceifar.
- source_word: deeps of Hades
  choice: profundezas do Hades
  rationale: Preserva tanto a imagem espacial quanto o nome próprio do domínio dos mortos.
theological_decisions:
- issue: Natureza dos éons e das autoridades
  choice: Manter “éons” e “autoridades” sem explicação doutrinária no corpo do texto
  alternative: Interpretá-los como mundos, eras, anjos ou demônios
  rationale: O trecho apresenta uma cosmologia própria, mas não define aqui com precisão a natureza dessas entidades; a tradução não deve resolver essa tensão.
- issue: Relação de Belias com as profundezas do Hades
  choice: “governa as profundezas do Hades”
  alternative: “está sobre as profundezas do Hades”
  rationale: A expressão inglesa “is over” sugere posição de autoridade; “governa” comunica isso naturalmente, embora a revisão copta ainda esteja pendente.
- issue: Identificação de Caim com o Sol
  choice: Preservar literalmente a atribuição
  alternative: Explicar ou harmonizar a identificação com tradições bíblicas posteriores
  rationale: A associação pertence à cosmologia do documento e deve permanecer sem harmonização denominacional.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com legibilidade brasileira. Os nomes próprios foram transliterados conforme a testemunha fornecida. A numeração descontínua foi preservada. A tradução é provisória porque se baseia numa testemunha inglesa de domínio público e a revisão direta do copta ainda está pendente; colchetes e a notação editorial incorporada foram mantidos.
