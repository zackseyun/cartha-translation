translation:
  language: pt
  text: 'Além disso, sendo um éon, Sofia da Reflexão concebeu por si mesma um pensamento, juntamente com a concepção do Espírito invisível e da Presciência.


    Ela quis gerar de si mesma uma semelhança, sem a concordância do Espírito, que não havia consentido nisso, sem seu companheiro e sem a deliberação dele, embora a face de sua contraparte masculina não tivesse aceitado isso.


    Ainda assim, ela gerou, apesar de não ter encontrado seu companheiro e de ter deliberado sem a concordância do Espírito e sem o conhecimento de seu companheiro. E, por causa da força invulnerável que habitava dentro dela,


    seu pensamento não permaneceu estéril. Ela produziu de si mesma algo incompleto, diferente de sua própria aparência, pois o havia criado sem seu companheiro. Ele diferia da aparência de sua mãe, porque possuía outra forma.


    Quando ela viu o resultado de sua própria vontade, ele assumiu a forma de um dragão com rosto de leão,


    e seus olhos eram semelhantes a fogos de relâmpagos que lampejam.


    Ela o lançou para longe de si, para fora daqueles lugares, a fim de que nenhum dos imortais o visse, pois o havia criado em ignorância.


    Também o envolveu numa nuvem luminosa e ergueu um trono no meio da nuvem, para que ninguém o visse, exceto o Espírito santo — cujo nome é Mãe dos Viventes. E ela lhe deu o nome de Yaltabaoth.[a]


    Este é o arconte principal,[b] que obteve de sua mãe um grande poder.


    Ele se separou dela e afastou-se dos lugares onde havia nascido.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A grafia do nome varia entre traduções e estudos; aqui se mantém “Yaltabaoth”, conforme a testemunha inglesa fornecida.
    reason: Registrar uma variação textual/transliteracional relevante sem sobrecarregar o texto principal.
  - marker: b
    text: “Arconte” é um termo técnico que significa governante ou autoridade; neste escrito, designa um poder dirigente da ordem cósmica inferior.
    reason: Auxiliar leitores comuns sem substituir o vocabulário característico do documento.
lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Mantém o termo técnico da cosmologia do texto, em vez de reduzi-lo a uma simples era ou entidade genérica.
- source_word: Sophia of Reflection
  choice: Sofia da Reflexão
  rationale: Preserva Sofia como nome próprio e traduz o qualificativo de modo transparente.
- source_word: Precognition
  choice: Presciência
  rationale: Conserva a provável personificação e o sentido de conhecimento antecipado.
- source_word: companion
  choice: companheiro
  rationale: Mantém a relação cosmológica sem impor termos conjugais ou técnicos não explicitados pela testemunha disponível.
- source_word: face of her maleness
  choice: face de sua contraparte masculina
  rationale: A formulação literal seria obscura em português; 'contraparte masculina' comunica a relação sem eliminar a imagem de 'face' presente na testemunha.
- source_word: chief archon
  choice: arconte principal
  rationale: Preserva 'arconte' como termo técnico e traduz a posição hierárquica sem associá-la automaticamente a uma tradição denominacional.
- source_word: Mother of the Living
  choice: Mãe dos Viventes
  rationale: Formulação dignificada e inteligível que conserva o título personificado.
- source_word: Yaltabaoth
  choice: Yaltabaoth
  rationale: Mantém a forma do nome apresentada na testemunha inglesa fornecida.
theological_decisions:
- issue: Agência e falta de consentimento na geração
  choice: Preservar as sucessivas afirmações de que Sofia agiu sem a concordância do Espírito e sem seu companheiro
  alternative: Condensar a passagem como simples desobediência ou pecado
  rationale: O texto apresenta relações cosmológicas e graus de consentimento de modo repetitivo e tenso; não cabe impor uma categoria doutrinária posterior.
- issue: Identidade do Espírito santo e da Mãe dos Viventes
  choice: Manter a construção segundo a qual o Espírito santo tem o nome de Mãe dos Viventes
  alternative: Separar as expressões como duas entidades distintas ou harmonizá-las com terminologia cristã posterior
  rationale: A redação da testemunha identifica os títulos, e a tradução deve conservar essa afirmação sem harmonização confessional.
- issue: Natureza do ser produzido
  choice: Usar inicialmente 'algo incompleto' e depois pronomes masculinos
  alternative: Chamado desde o início de filho, criatura ou divindade
  rationale: Isso conserva a progressão e a oscilação da testemunha, que primeiro o descreve de modo indefinido e depois como agente masculino.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. Tradução provisória baseada na testemunha inglesa pública fornecida, pois a revisão direta do copta está pendente. Removeu-se o número de página intrusivo «10» e omitiu-se o marcador editorial ligado a “dragão”, preservando a palavra.
