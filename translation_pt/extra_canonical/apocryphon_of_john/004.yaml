translation:
  language: pt
  text: '1. Isso acontece porque [não] [compreendemos as coisas indizíveis e] não compreendemos o que [não pode ser medido], exceto por meio daquele que se originou [dele], isto é, [o] Pai, pois [somente] ele foi quem [nos explicou] isso. Ele contempla a si [mesmo] dentro da luz que o envolve, isto é, a fonte [da] água viva; é ele quem abastece [cada éon] e, olhando para a fonte do [Espírito], contempla sua imagem em todas as direções ao mesmo tempo.


    2. É ele quem coloca seu desejo dentro de sua [água]-luz, [que habita na] fonte da [pura luz]-água [que] o envolve. Então [seu pensamento, que existia em potência, tornou-se] realidade, e ela se aproximou, [isto é], aquela que havia [aparecido] diante dele, dentro [do fulgor] de sua luz.


    3. Esta é a primeira [potência, que existia] antes do Todo e [que procedeu] de sua mente.


    4. Ela [é a Providência do Todo] — sua luz [resplandece como a] luz dele —, a potência [perfeita] que é [a] imagem do Espírito perfeito, invisível e virginal.


    5. [A primeira potência] é a glória de Barbelo, a glória perfeita dentro dos éons, a glória da revelação.


    6. Ela exaltou o Espírito virginal e foi ela quem o louvou, porque havia procedido por causa dele.


    7. Este é o primeiro pensamento, a imagem dele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Mantém o termo técnico cosmológico do escrito, evitando reduzi-lo simplesmente a “era” ou “mundo”.
- source_word: the All
  choice: o Todo
  rationale: Preserva a expressão cosmológica que designa a totalidade, com artigo e maiúscula para marcar seu uso técnico.
- source_word: Providence
  choice: Providência
  rationale: Conserva a personificação feminina e o possível caráter titular da expressão.
- source_word: power
  choice: potência
  rationale: “Potência” expressa melhor uma entidade ou realidade emanada e também permite a nuance de capacidade, sem sugerir apenas autoridade política.
- source_word: thought
  choice: pensamento
  rationale: Mantém a linguagem intelectual do testemunho e a referência feminina subsequente sem converter o termo em uma entidade doutrinariamente definida.
- source_word: spring
  choice: fonte
  rationale: É a equivalência natural para uma nascente de água e preserva a imagem de origem e provisão.
- source_word: virginal Spirit
  choice: Espírito virginal
  rationale: Preserva a formulação incomum e sua ambiguidade, sem normalizá-la para uma expressão confessional mais conhecida.
theological_decisions:
- issue: Identidade daquele que se originou do Pai
  choice: Manter “daquele que se originou [dele], isto é, [o] Pai” sem identificar explicitamente a figura
  alternative: Inserir “Filho” ou outro título cristológico
  rationale: O trecho fornecido não nomeia essa figura; uma identificação explícita resolveria indevidamente a ambiguidade textual e teológica.
- issue: Gênero da primeira potência/pensamento
  choice: Usar referências femininas (“ela”) conforme o testemunho e a identificação com Barbelo
  alternative: Neutralizar o gênero ou tratar “pensamento” apenas no masculino gramatical
  rationale: A personificação feminina é estrutural no trecho e deve permanecer visível em português.
- issue: Relação entre imagem e Espírito
  choice: Traduzir literalmente como “imagem do Espírito perfeito, invisível e virginal”
  alternative: Reformular como identidade substancial ou relação de criação
  rationale: O texto afirma uma relação imagética, mas não a explica; a tradução não deve impor uma ontologia posterior.
- issue: Procedência de Barbelo
  choice: “havia procedido por causa dele”
  alternative: “foi criada por ele” ou “emanou dele”
  rationale: “Proceder” conserva a linguagem de origem sem decidir entre criação, emanação ou outra relação metafísica.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Os colchetes foram preservados como sinais de lacuna, dano ou restauração editorial. A numeração de página intrusiva «5» foi omitida. Como a revisão direta do copta ainda está pendente, esta versão permanece necessariamente provisória e segue de perto o testemunho inglês público fornecido.
