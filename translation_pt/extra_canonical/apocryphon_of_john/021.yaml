translation:
  language: pt
  text: '“Diante de você, concluí tudo por sua causa; e lhe disse tudo para que você escreva estas palavras e as transmita em segredo aos espíritos que são seus companheiros, pois este é o mistério da raça inabalável.”[a]


    O Salvador também lhe confiou estas palavras para que as escrevesse e as mantivesse guardadas. E lhe disse: “Maldito seja quem trocar estas palavras por alguma dádiva — seja comida, bebida, roupa ou qualquer outra coisa semelhante.”


    Estas palavras também lhe foram confiadas em mistério. De repente, ele desapareceu de sua presença. Então João foi até os discípulos que eram seus companheiros e lhes contou o que o Salvador lhe havia dito.[b]


    Jesus Cristo. Amém.


    O Escrito Secreto segundo João[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradução desta conclusão é provisória, baseada no testemunho inglês público fornecido; a revisão direta do copta ainda está pendente. “Diante de você” representa uma expressão que também pode ser entendida mais literalmente como “aos seus ouvidos”.
    reason: Sinaliza a base textual indireta e uma ambiguidade relevante da frase inicial.
  - marker: b
    text: 'O nome “João” está explícito aqui apenas para esclarecer a sequência dos pronomes: é ele quem vai aos demais discípulos depois que o Salvador desaparece.'
    reason: Explica uma explicitação necessária para clareza em português.
  - marker: c
    text: O título também é tradicionalmente vertido como “O Livro Secreto de João” ou “O Apócrifo de João”.
    reason: Registra títulos alternativos amplamente reconhecíveis sem substituir o sentido mais direto de “escrito secreto”.
lexical_decisions:
- source_word: In your hearing
  choice: Diante de você
  rationale: A expressão do testemunho inglês é incomum e pode indicar algo dito na presença ou aos ouvidos de João. A formulação portuguesa mantém o caráter direto sem recorrer ao pouco natural “em sua audição”.
- source_word: companion spirits
  choice: espíritos que são seus companheiros
  rationale: Preserva a referência explícita a “espíritos” e evita decidir se se trata de companheiros espirituais, espíritos afins ou membros de um grupo assim designado.
- source_word: unmoving race
  choice: raça inabalável
  rationale: “Inabalável” comunica estabilidade e firmeza em português natural, sem reduzir a expressão a imobilidade física.
- source_word: keep them locked away
  choice: as mantivesse guardadas
  rationale: Expressa custódia e restrição de acesso sem impor a imagem moderna de uma fechadura material.
- source_word: trade ... for a gift
  choice: trocar ... por alguma dádiva
  rationale: Conserva a tensão entre comércio e presente, seguida pelos exemplos concretos do texto.
- source_word: in a mystery
  choice: em mistério
  rationale: Mantém a formulação deliberadamente enigmática e sua possível dimensão ritual ou revelatória.
- source_word: The Secret Writing According to John
  choice: O Escrito Secreto segundo João
  rationale: Traduz “writing” como “escrito”, designação natural de uma obra, e preserva o título tradicional sem transformar “secreto” em interpretação técnica.
theological_decisions:
- issue: Identidade da “raça inabalável”
  choice: Manter a expressão sem explicação no corpo do texto
  alternative: Interpretar como “geração dos eleitos”, “raça imutável” ou outro grupo teologicamente definido
  rationale: O testemunho fornecido não resolve aqui a identidade ou a natureza do grupo; explicitá-la importaria uma leitura doutrinária.
- issue: Natureza dos “espíritos companheiros”
  choice: Traduzir literalmente como espíritos que são companheiros de João
  alternative: Substituir por “companheiros espirituais” ou “irmãos na fé”
  rationale: A construção permanece ambígua e não deve ser normalizada como mera relação religiosa humana.
- issue: Referente pronominal na partida final
  choice: Explicitar João apenas onde o contexto narrativo o exige
  alternative: Manter todos os pronomes masculinos ou identificar repetidamente João
  rationale: Em português, a explicitação evita confundir João com o Salvador depois do desaparecimento, sem acrescentar conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se o tom solene da despedida, o vocabulário esotérico do documento e suas ambiguidades. O número de página manuscrita «32» foi omitido por não integrar o conteúdo contínuo. A revisão do copta permanece necessária antes de uma edição crítica definitiva.
