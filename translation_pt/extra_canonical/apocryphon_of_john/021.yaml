review_pass:
  verdict: revise
  source_fidelity: A tradução preserva em geral a sequência narrativa, a advertência contra negociar os ditos e a terminologia deliberadamente não interpretada. Contudo, “Diante de você” não corresponde adequadamente a “In your hearing”, que se refere ao ato de ouvir; e “inabalável” interpreta “unmoving” como firmeza, em vez de conservar sua imagem de não movimento. A identificação explícita de João na última frase não consta do testemunho fornecido e deve ser evitada.
  naturalness: O registro é claro, solene e natural em português contemporâneo. “Aos seus ouvidos” é uma formulação mais fiel e ainda compreensível no contexto. “Raça imóvel” é menos idiomática do que “raça inabalável”, mas conserva a estranheza terminológica do texto de partida sem lhe atribuir uma interpretação.
  terminology: “Salvador”, “espíritos companheiros”, “em mistério” e “Escrito Secreto segundo João” são escolhas aceitáveis e não impõem leitura confessional. “Mantivesse sob chave” restitui de modo mais concreto o sentido de “keep them locked away”.
  issues:
  - severity: medium
    issue: Abertura vertida como “Diante de você”
    rationale: “In your hearing” refere-se primariamente à audição, não à mera presença. “Aos seus ouvidos” conserva essa referência e a solenidade da fala.
  - severity: medium
    issue: “unmoving race” vertido como “raça inabalável”
    rationale: “Inabalável” favorece o sentido interpretativo de firmeza; “imóvel” mantém a imagem lexical do testemunho, ainda que incomum.
  - severity: medium
    issue: Inserção de “João” no corpo da narrativa
    rationale: O testemunho fornecido emprega pronome, e a explicitação de um nome não presente acrescenta informação. A referência pode permanecer pronominal sem prejuízo decisivo da inteligibilidade.
  - severity: low
    issue: “Mantivesse guardadas” atenua “locked away”
    rationale: A expressão indica custódia restrita; “mantivesse sob chave” reproduz melhor esse aspecto sem exigir uma fechadura moderna específica.
  revised_text: '“Aos seus ouvidos, completei tudo para o seu bem; mas lhe disse tudo para que você escreva estas palavras e as distribua em segredo aos espíritos que são seus companheiros, pois este é o mistério da raça imóvel.”[a]


    O Salvador também lhe confiou estas palavras para que as escrevesse e as mantivesse sob chave. E lhe disse: “Maldito seja quem trocar estas palavras por alguma dádiva — seja comida, bebida, roupa ou qualquer outra coisa semelhante.”


    Estas palavras também lhe foram confiadas em mistério. De repente, ele desapareceu de sua presença. Então ele se dirigiu aos discípulos que eram seus companheiros e lhes contou o que o Salvador lhe havia dito.


    Jesus Cristo. Amém.


    O Escrito Secreto segundo João[b]'
