review_pass:
  verdict: revise
  source_fidelity: 'A revisão é necessária porque algumas escolhas do rascunho afastam-se do testemunho fornecido: “Diante de você” não preserva adequadamente “In your hearing”; “transmita” enfraquece o sentido de distribuir; e “inabalável” interpreta “unmoving” como firmeza, em vez de conservar a imagem de imobilidade. A identificação de João na última frase é uma explicitação contextual aceitável, desde que assinalada em nota.'
  naturalness: O texto é em geral claro e de registro apropriado. As revisões propõem português moderno e solene, conservando formulações estranhas que pertencem ao caráter esotérico do escrito, especialmente “em mistério” e “raça imóvel”.
  terminology: “Salvador”, “espíritos que lhe são companheiros”, “dádiva”, “Jesus Cristo” e “Escrito Secreto segundo João” são adequados. “Raça imóvel” é preferível a “raça inabalável” para não interpretar o qualificativo do grupo.
  issues:
  - severity: medium
    issue: A expressão inicial foi vertida como “Diante de você”.
    rationale: “In your hearing” se refere à audição/aos ouvidos do destinatário, não simplesmente à sua presença. “A seus ouvidos” conserva a formulação e sua estranheza controlada.
  - severity: medium
    issue: “as transmita” substitui “distribute them”.
    rationale: Transmitir pode significar apenas comunicar; o testemunho fala de escrever e distribuir os ditos em segredo. “As distribua” preserva a ação distinta.
  - severity: medium
    issue: “raça inabalável” interpreta “unmoving race”.
    rationale: “Inabalável” sugere firmeza ou resistência; “unmoving” traz primordialmente a ideia de não se mover. “Raça imóvel” mantém a imagem sem definição teológica.
  - severity: low
    issue: “mantivesse guardadas” atenua “keep them locked away”.
    rationale: “As mantivesse trancadas” preserva melhor a restrição de acesso expressa pelo testemunho, sem exigir uma fechadura material específica.
  revised_text: '“A seus ouvidos, concluí tudo em seu favor; mas lhe disse tudo para que você escreva estas palavras e as distribua em segredo aos espíritos que lhe são companheiros, pois este é o mistério da raça imóvel.”[a]


    O Salvador também lhe confiou estas palavras para que ele as escrevesse e as mantivesse trancadas. E lhe disse: “Maldito seja todo aquele que trocar estas palavras por uma dádiva, seja de alimento, de bebida, de roupas ou de qualquer outra coisa semelhante.”


    Estas palavras também lhe foram confiadas em mistério. De repente, ele desapareceu de diante dele. Então João foi até seus discípulos companheiros e lhes contou o que o Salvador lhe havia dito.[b]


    Jesus Cristo. Amém.


    O Escrito Secreto segundo João[c]'
  revised_footnotes:
  - marker: a
    text: Esta tradução da conclusão é provisória e se baseia no testemunho inglês público fornecido; a revisão direta do copta ainda está pendente. “A seus ouvidos” traduz literalmente uma expressão que também pode ser formulada como “em sua audição”.
    reason: Sinaliza a base textual indireta e explica a formulação inicial incomum sem alterar seu sentido.
  - marker: b
    text: 'O nome “João” é explicitado para esclarecer a sequência dos pronomes: é ele quem vai aos demais discípulos depois que o Salvador desaparece.'
    reason: Evita ambiguidade referencial em português; o contexto narrativo identifica o personagem.
  - marker: c
    text: O título também é tradicionalmente vertido como “O Livro Secreto de João” ou “O Apócrifo de João”.
    reason: Registra títulos alternativos reconhecíveis sem substituir o sentido direto de “escrito secreto”.
  revision_rationale: 'A revisão restaura o sentido mais próximo do testemunho inglês nos pontos em que o rascunho interpretava ou generalizava o texto: a referência à audição do destinatário, a distribuição secreta dos ditos, a qualidade de “imóvel” atribuída à raça e o ato de manter os ditos trancados. Mantêm-se a ambiguidade de “em mistério”, a designação não interpretada dos espíritos companheiros e a explicitação pontual de João, documentada em nota.'
