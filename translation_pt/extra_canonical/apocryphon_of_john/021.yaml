    reason: Registra títulos alternativos amplamente reconhecíveis sem substituir o sentido direto de “escrito secreto”.
  revision_rationale: A revisão corrige duas alterações semânticas da redação anterior (“Diante de você” e “inabalável”), torna mais explícita a restrição de acesso em “sob chave” e remove a inserção editorial de “João”. Mantêm-se as ambiguidades relativas aos espíritos companheiros, ao mistério e à raça imóvel, pois o testemunho inglês e a ausência de revisão direta do copta não autorizam resolvê-las.
