translation:
  language: pt
  text: '1. Perguntei também ao Salvador: “Senhor, então todas as almas serão conduzidas em segurança à luz pura?”


    2. Ele me respondeu: “Grandes questões surgiram em sua mente, pois é difícil explicá-las aos outros, exceto aos que pertencem à raça inabalável.[a]


    3. Aqueles sobre quem o Espírito da vida pousar e a quem ele fortalecer serão salvos e se tornarão perfeitos. Serão dignos da Grandeza e, naquele lugar, serão purificados de todo mal e também de toda participação no mal.


    4. Portanto, visto que nada os preocupa além da incorruptibilidade, e nela concentrarão sua atenção desde agora, sem ira, inveja, ciúme, desejo ou cobiça de coisa alguma, nada os afligirá, a não ser a condição da existência na carne. Eles a suportarão enquanto aguardam com esperança o tempo em que serão recebidos pelos recebedores.[b]


    5. Tais pessoas, portanto, são dignas da vida eterna e incorruptível e da eleição, pois resistem a tudo e tudo suportam, a fim de completar a prova e herdar a vida eterna.”


    6. Perguntei-lhe: “Senhor, as almas daqueles que não tiverem praticado essas obras, mas sobre quem o poder ‹e› o Espírito da vida tiver descido, serão [rejeitadas]?[c]”


    7. Ele me respondeu: “Se o Espírito desceu sobre elas, ainda assim serão salvas e mudarão de conduta, pois o poder descerá sobre todas as pessoas, porque sem ele ninguém pode resistir.


    8. Contudo, depois que alguém nasce, à medida que o Espírito da vida cresce e o poder chega e fortalece essa alma, ninguém poderá desviá-la por meio de obras más.


    9. Mas aqueles sobre quem desce o espírito falso são arrastados por ele e desviados.”


    10. Perguntei: “Senhor, quando as almas deles deixarem a carne, para onde irão?”


    11. Ele sorriu e me disse: “A alma na qual o poder se tornar mais forte que o espírito vil — pois ela é forte e foge do mal — será salva, pela intervenção do Incorruptível, e elevada ao repouso dos éons.[d]”


    12. Perguntei: “Senhor, onde habitarão as almas daqueles que não souberam a quem pertencem?”


    13. Ele me disse: “Quando o espírito vil se fortaleceu neles, eles se desviaram. Ele torna a alma pesada e a arrasta para obras más; lança-a no esquecimento e, depois que ela deixa o corpo, ela é entregue às autoridades que vieram a existir por meio do arconte.[e] Elas a prendem com correntes, lançam-na na prisão e a acompanham até que desperte do esquecimento e alcance o conhecimento. Se assim chegar à perfeição, será salva.”


    14. Perguntei: “Senhor, como a alma pode tornar-se menor e retornar ao estado natural de sua mãe ou ao homem?”[f]


    15. Ele se alegrou quando lhe fiz essa pergunta e me disse: “Verdadeiramente, você é bem-aventurado, pois compreendeu que tal alma será levada a seguir outra, na qual habita o Espírito da vida.[g]


    16. Ela será salva por meio dele.


    17. Não será lançada novamente em outra carne.”


    18. Perguntei também: “Senhor, para onde irão as almas daqueles que chegaram a conhecer, mas se afastaram?”


    19. Ele me disse: “Elas serão levadas ao lugar para onde vão os anjos da indigência,[h] o lugar onde não há arrependimento. Ali ficarão detidas até o dia em que aqueles que blasfemaram contra o Espírito serão atormentados; e serão punidas com um castigo que dura uma era.”[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Raça inabalável” é uma expressão técnica da obra para um grupo associado ao conhecimento e à estabilidade espiritual; “raça” aqui não corresponde às categorias raciais modernas.
    reason: Evitar uma leitura moderna equivocada e preservar o termo cosmológico.
  - marker: b
    text: “Recebedores” designa figuras que acolhem ou recebem as almas; sua identidade exata não é esclarecida neste trecho.
    reason: Explicar um termo técnico sem identificar indevidamente seus referentes.
  - marker: c
    text: Os sinais ‹ › marcam uma inserção editorial no testemunho utilizado; os colchetes em [rejeitadas] indicam uma restauração ou leitura incerta.
    reason: Preservar de modo transparente os sinais textuais presentes na fonte fornecida.
  - marker: d
    text: “Éons” pode designar eras, domínios ou realidades supra-humanas na cosmologia desta obra. Aqui o termo foi transliterado para não reduzir essa amplitude.
    reason: Conservar a terminologia cosmológica e sua polissemia.
  - marker: e
    text: “Arconte” significa literalmente um governante, mas nesta obra é um termo técnico para poderes cósmicos subordinados.
    reason: Tornar compreensível o empréstimo lexical sem apagar seu sentido especializado.
  - marker: f
    text: A formulação da pergunta é obscura no testemunho disponível; “sua mãe”, “o homem” e “tornar-se menor” admitem mais de uma interpretação.
    reason: Preservar uma dificuldade textual real em vez de resolvê-la por conjectura.
  - marker: g
    text: “Será levada a seguir outra” também pode ser entendido como “será feita sucessora de outra”. O sentido exato da relação entre as almas permanece incerto.
    reason: Registrar a ambiguidade decisiva do v. 15.
  - marker: h
    text: “Indigência” traduz uma expressão que também pode sugerir privação, pobreza ou carência; pode funcionar como nome de uma condição ou potência.
    reason: Não restringir uma expressão cosmológica incomum a um único sentido.
  - marker: i
    text: Literalmente, um castigo “de uma era” ou “duradouro por uma era”. A expressão não determina por si só, neste testemunho, se a duração é interminável.
    reason: Preservar a ambiguidade teológica e temporal do original mediado.
lexical_decisions:
- source_word: unmoving race
  choice: raça inabalável
  rationale: Preserva a linguagem técnica e coletiva do testemunho, evitando o pouco natural 'raça imóvel'; a nota sinaliza seu caráter próprio da cosmologia da obra.
- source_word: indestructibility
  choice: incorruptibilidade
  rationale: Termo português digno e corrente em literatura religiosa, capaz de expressar uma condição imperecível sem reduzi-la apenas à longevidade.
- source_word: receivers
  choice: recebedores
  rationale: Mantém a designação técnica e sua estranheza deliberada, sem identificar essas figuras de modo não garantido pelo testemunho.
- source_word: contest
  choice: prova
  rationale: Comunica a ideia de uma luta ou percurso a ser completado em português natural, sem introduzir uma metáfora esportiva excessivamente específica.
- source_word: aeons
  choice: éons
  rationale: Transliteração já usada em português para as realidades ou esferas da cosmologia gnóstica; evita nivelá-las a simples 'eras' no v. 11.
- source_word: archon
  choice: arconte
  rationale: Preserva o termo cosmológico técnico em vez de substituí-lo por 'governante', que poderia ocultar seu uso especializado.
- source_word: angels of destitution
  choice: anjos da indigência
  rationale: Tradução formal que mantém a expressão incomum sem decidir se indica pobreza, privação ou uma entidade personificada.
- source_word: age-long punishment
  choice: castigo que dura uma era
  rationale: Conserva a relação lexical com 'era/éon' e não resolve a expressão como necessariamente eterna nem como meramente breve.
theological_decisions:
- issue: Salvação das almas sobre as quais o Espírito desceu, apesar da falta de obras
  choice: “ainda assim serão salvas e mudarão de conduta”
  alternative: “serão salvas independentemente disso”
  rationale: Mantém lado a lado a prioridade do Espírito e a reforma moral subsequente, sem harmonizar a tensão com o destaque anterior dado à perseverança.
- issue: Papel do Incorruptível na salvação
  choice: “pela intervenção do Incorruptível”
  alternative: “mesmo pela intervenção do incorruptível”
  rationale: A sintaxe do testemunho inglês é difícil; a tradução conserva a agência externa sem definir a identidade do Incorruptível nem desenvolver uma doutrina adicional.
- issue: Destino restaurador da alma ignorante
  choice: prisão até despertar, conhecer e chegar à perfeição
  alternative: condenação definitiva
  rationale: Segue a progressão explícita do testemunho, que admite salvação posterior, sem assimilá-la a esquemas confessionais posteriores.
- issue: Retorno a outra carne
  choice: “levada a seguir outra” e depois “não será lançada novamente em outra carne”
  alternative: reencarnação explicitamente afirmada ou negada em todo o trecho
  rationale: Preserva a linguagem enigmática e a tensão interna do testemunho, sem impor uma interpretação sistemática de transmigração.
- issue: Duração do castigo final
  choice: “castigo que dura uma era”
  alternative: “castigo eterno”
  rationale: Mantém a ambiguidade temporal de 'age-long' e evita decidir uma questão teológica além da evidência fornecida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se termos técnicos essenciais — “éons”, “arconte”, “raça inabalável” e “recebedores” — acompanhados de notas. As marcas de página manuscrita foram omitidas, enquanto os sinais editoriais ‹e› e [rejeitadas] foram preservados. Como a revisão direta do copta ainda está pendente, o texto é um rascunho fundamentado no testemunho inglês público fornecido; ambiguidades relevantes foram mantidas e anotadas.
