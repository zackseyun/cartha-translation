review_pass:
  verdict: revise
  source_fidelity: 'Revisão limitada ao testemunho inglês fornecido, pois não há texto copta apresentado para cotejo direto. O rascunho é globalmente fiel, preserva as incertezas editoriais em 6 e as ambiguidades cosmológicas. Há, porém, uma alteração indevida em 6: o inglês não contém adversativa equivalente a “mas” entre “essas obras” e a oração relativa. Em 15, “made to succeed another” é mais bem preservado por “feita sucessora de outra” do que por “levada a seguir outra”.'
  naturalness: Português moderno, claro e de registro adequado. “Recebedores” é uma opção deliberadamente literal, mas é pouco natural; a nota técnica o sustenta. Ajustaram-se pequenas construções para melhorar a fluência sem reduzir a indeterminação do testemunho.
  terminology: “Incorruptibilidade”, “Grandeza”, “éons”, “arconte” e “indigência” preservam adequadamente o vocabulário técnico. “Espírito da vida” e “espírito falso/vil” permanecem consistentes. A nota sobre “raça inabalável” é útil e evita anacronismo.
  issues:
  - severity: medium
    issue: Versículo 6 introduz “mas” sem correspondente no testemunho.
    rationale: A frase-fonte pergunta pelas almas dos que não praticaram as obras e sobre os quais desceram poder e Espírito; a adversativa pode sugerir uma oposição que não está expressa.
  - severity: medium
    issue: Versículo 15 traduz “will be made to succeed another” por “será levada a seguir outra”.
    rationale: “Seguir” pode indicar mera sequência ou acompanhamento. “Feita sucessora de outra” conserva melhor a relação sucessória, mantendo a dificuldade interpretativa.
  - severity: low
    issue: Versículo 4 traduz “receivers” por “recebedores”.
    rationale: É inteligível e formalmente próximo, mas soa marcado em português. Mantém-se por prudência, com nota explicativa, dada a natureza técnica e indeterminada da designação.
