base_translation:
  language: en
  yaml_path: translation/extra_canonical/apocryphon_of_john/016.yaml
  text: 'Reflection of Light then hid herself inside him. The chief archon wanted to extract her from his rib, but Reflection of Light cannot be grasped.


    Although the darkness pursued her, it could not catch her. He extracted a portion of his power from him and made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him. He brought «23» the portion he had extracted from the man’s power inside the female mold—not, as Moses said, “his rib”—and he saw the woman beside him.


    At that moment, Radiant Reflection also appeared. She lifted the veil that had covered his mind, and he regained his sobriety after the intoxication of darkness. He recognized the counterpart of his own image and said, “This is surely bone of my bones and flesh of my flesh.


    Therefore the man will leave his father and his mother, and he will cling to his wife, and both of them will become one flesh,” because his companion will be sent to him. He will leave his father and his mother—even Sophia, our sister, who descended in innocence to correct her deficiency, because of which she was called “Life,” who is “the mother or the living”—through the Providence of the sovereignty of Heaven and [Reflection who appeared] to him. Through her, they tasted perfect knowledge.'
translation:
  language: pt
  text: 'A Reflexão da Luz, então, ocultou-se dentro dele. O arconte principal quis extraí-la de sua costela, mas a Reflexão da Luz não pode ser agarrada.


    Embora as trevas a perseguissem, não conseguiram alcançá-la. Então ele extraiu de si uma porção de seu poder e fez outro molde, com forma de mulher, segundo a semelhança da Reflexão que lhe havia aparecido. Pôs dentro do molde feminino a porção que havia extraído do poder do homem — e não, como disse Moisés, “a costela dele” — e viu a mulher ao seu lado.


    Naquele momento, também apareceu a Reflexão Radiante. Ela levantou o véu que havia coberto a mente dele, e ele recobrou a lucidez depois da embriaguez das trevas. Reconheceu nela a correspondente de sua própria imagem e disse: “Esta, sim, é osso dos meus ossos e carne da minha carne.


    Por isso, o homem deixará seu pai e sua mãe, se unirá à sua mulher, e os dois se tornarão uma só carne”, pois sua companheira lhe será enviada. Ele deixará seu pai e sua mãe — isto é, Sofia, nossa irmã, que desceu em inocência para corrigir sua deficiência e, por causa disso, foi chamada “Vida”, que é “a mãe dos viventes”[a] — por meio da Providência da soberania do Céu e da [Reflexão que apareceu] a ele.[b] Por meio dela, eles provaram o conhecimento perfeito.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho inglês de base registra aqui a alternativa “a mãe ou os viventes”. A tradução “a mãe dos viventes” segue a provável alusão a Gênesis 3:20, mas a leitura deve ser revista diretamente nos testemunhos coptas.
    reason: Registrar uma incerteza textual e sintática relevante sem sobrecarregar o corpo do texto.
  - marker: b
    text: 'Os colchetes indicam palavras restauradas no testemunho: “[Reflexão que apareceu]”. A construção de toda a frase final é difícil, e a relação exata entre “por meio da Providência”, a Reflexão e o ato de deixar pai e mãe permanece incerta.'
    reason: Preservar o sinal de restauração e advertir sobre uma ambiguidade genuína do texto de base.
lexical_decisions:
- source_word: Reflection of Light
  choice: Reflexão da Luz
  rationale: Mantém a personificação e a relação lexical com “Reflexão Radiante”, sem substituir o termo por uma interpretação teológica mais específica.
- source_word: chief archon
  choice: arconte principal
  rationale: Preserva o termo técnico do universo conceitual do escrito, usando “principal” de modo claro e natural.
- source_word: mold
  choice: molde
  rationale: Conserva a imagem de uma forma receptora ou matriz fabricada, em vez de suavizá-la como “corpo”.
- source_word: counterpart
  choice: correspondente
  rationale: Expressa uma figura que corresponde à imagem dele sem impor identidade, complemento conjugal ou duplicação exata.
- source_word: sobriety
  choice: lucidez
  rationale: Em português corrente, comunica a recuperação mental em contraste com a “embriaguez das trevas”, preservada na sequência.
- source_word: cleave
  choice: se unirá
  rationale: Forma natural e digna em português que mantém o vínculo estreito da alusão a Gênesis.
- source_word: Providence
  choice: Providência
  rationale: A inicial maiúscula sinaliza a realidade personificada ou hipostática provável no contexto, sem explicá-la além do testemunho.
- source_word: perfect knowledge
  choice: conhecimento perfeito
  rationale: Tradução direta que evita importar o termo técnico “gnose” onde o testemunho fornecido diz “knowledge”.
theological_decisions:
- issue: Correção explícita do relato mosaico da costela
  choice: “e não, como disse Moisés, ‘a costela dele’”
  alternative: Harmonizar a passagem com Gênesis ou traduzir a porção de poder como se fosse a própria costela
  rationale: O texto polemiza expressamente com a formulação atribuída a Moisés; essa tensão deve permanecer.
- issue: Identificação de “pai e mãe” com Sofia
  choice: Manter “isto é, Sofia, nossa irmã” dentro da frase
  alternative: Reformular para distinguir claramente qual dos dois progenitores seria Sofia
  rationale: A construção transmitida é sintaticamente difícil e teologicamente ambígua; a tradução não deve resolver aquilo que o testemunho não esclarece.
- issue: Relação entre Vida e “mãe dos viventes”
  choice: “Vida”, que é “a mãe dos viventes”
  alternative: “Vida”, que é “a mãe ou os viventes”
  rationale: A formulação escolhida representa a alusão mais provável a Eva em Gênesis, mas a incerteza textual do testemunho é registrada em nota.
- issue: Agentes expressos no trecho final
  choice: Preservar tanto a Providência quanto a [Reflexão que apareceu] a ele
  alternative: Fundir as duas expressões ou eliminar uma delas para tornar a sintaxe mais simples
  rationale: A sintaxe é difícil, mas ambos os elementos pertencem ao testemunho; a restauração entre colchetes também deve permanecer visível.
- issue: Número do sujeito em “eles provaram”
  choice: Manter o plural “eles”
  alternative: Mudar para singular ou identificar explicitamente Adão e Eva
  rationale: O antecedente do plural não é plenamente explícito no recorte; identificá-lo seria interpretação adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantêm-se termos técnicos essenciais, como “arconte”, e as imagens fortes do original, como “molde”, “véu” e “embriaguez das trevas”. A numeração intrusiva de página «23» foi omitida. Como a revisão direta do copta ainda está pendente, esta é uma tradução provisória fundamentada no testemunho inglês público fornecido.
