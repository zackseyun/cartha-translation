  text: '**O Apócrifo de João — O espírito vil**


    1. Eu, porém, perguntei: “Senhor, de onde veio o espírito vil?”


    2. Ele me respondeu: “A Mãe-Pai, abundante em misericórdia, o Espírito santo em todas as suas formas, aquele que é misericordioso e se compadece de todos vocês — isto é, o Reflexo da Providência radiante — fez surgir a descendência da raça perfeita, o intelecto dela e a luz eterna do Homem.[a]


    3. Quando o arconte principal percebeu que eles ocupavam uma altura superior à dele e o superavam em intelecto, quis compreender o objetivo deles. Não sabia que eles o superavam em intelecto e que ele não seria capaz de compreendê-los.[b]


    4. Ele tramou um plano com suas autoridades, que são seus poderes, e juntos cometeram adultério com Sofia. Deles nasceu o amargo Destino, o último laço instável. Ele é de natureza vacilante, mas é mais duradouro e mais forte do que aquela com quem os deuses se uniram em adultério, bem como os anjos, os demônios e todas as gerações até o dia de hoje.[c] Pois desse Destino procederam toda transgressão, injustiça e blasfêmia, o laço do esquecimento e da ignorância, toda ordem severa acompanhada de graves transgressões e medos esmagadores.


    5. Desse modo, toda a criação também foi cegada, para que não conhecesse o Deus que está acima de todos. Por causa do laço do esquecimento, os pecados deles ficaram ocultos, pois estão presos a medidas, tempos e momentos, visto que o Destino é o soberano universal.[d]


    6. Então ele se arrependeu de tudo o que havia acontecido por causa dele.


    7. Dessa vez, tramou provocar um dilúvio sobre as obras da humanidade. Mas a grandeza da Providência radiante avisou Noé, e ele anunciou isso a toda a descendência dos filhos da humanidade; aqueles, porém, que eram estranhos a ele não lhe deram ouvidos.


    8. Não foi como Moisés disse: ‘Eles se esconderam numa arca’. Em vez disso, esconderam-se num lugar — não somente Noé, mas também muitas outras pessoas da raça inabalável.[e]


    9. Entraram num lugar e se esconderam dentro de uma nuvem radiante. Ele tinha consciência de sua autoridade, e aquela que pertence à luz o acompanhava.[f]


    10. Ela havia brilhado sobre eles, porque ele fizera as trevas cobrirem toda a terra e tramara um plano com seus poderes.[g]


    11. Ele enviou seus anjos às filhas dos homens, para que tomassem algumas para si e produzissem descendência para seu prazer; mas, de início, eles não tiveram êxito.


    12. Como não conseguiram, reuniram-se novamente e, juntos, tramaram um plano.


    13. Criaram um espírito vil semelhante ao Espírito que havia descido, para que, por meio dele, corrompessem as almas. Os anjos transformaram sua aparência na aparência dos companheiros delas e as encheram do espírito das trevas que, para elas, haviam misturado com o mal.[h]


    14. Apresentaram ouro e prata, além de dádivas de cobre e ferro e objetos feitos de todo tipo de metal. Assim, por meio de uma multidão de artimanhas, desencaminharam os que os seguiam e os levaram a grandes aflições.


    15. Eles envelheceram sem desfrutar prazer algum.


    16. Morreram sem descobrir a verdade e sem conhecer o Deus verdadeiro. Desse modo, toda a criação caiu numa escravidão que atravessa as eras, desde a fundação do mundo até agora.


    17. Eles também escolheram mulheres e geraram filhos procedentes das trevas, segundo a semelhança de seu próprio espírito. Fecharam o coração e se endureceram mediante a dureza do espírito vil, até o dia de hoje.”


    [a] “Mãe-Pai”, “Providência”, “Homem” e “Destino” recebem maiúscula por funcionarem como designações ou entidades próprias neste discurso cosmológico. A relação sintática entre “Mãe-Pai”, “Espírito santo” e “Reflexo” permanece complexa no testemunho disponível.


    [b] “Objetivo” também pode significar “propósito” ou “intenção”; o testemunho inglês disponível não permite determinar com segurança qual nuance representa melhor o copta.


    [c] A sintaxe da comparação — “mais forte do que aquela...” — e a ligação de “os anjos, os demônios e todas as gerações” são obscuras no testemunho disponível; a tradução preserva essa dificuldade sem reconstruir uma relação não atestada.


    [d] O sujeito de “é o soberano universal” parece ser o Destino, mas a referência pronominal é formalmente ambígua no testemunho disponível.


    [e] “Raça inabalável” designa, na terminologia do escrito, um grupo espiritual; também seria possível traduzir “raça imóvel”.


    [f] Os referentes de “ele”, “sua” e “o” nesta frase não são inteiramente claros no testemunho disponível.


    [g] A sequência de sujeitos masculinos e femininos nesta passagem é ambígua: “ela” parece referir-se à figura ligada à luz, enquanto “ele” parece referir-se ao arconte.


    [h] “Companheiros delas” traduz uma expressão cujo referente exato pode ser “cônjuges”, “parceiros” ou “companheiros”; a formulação preserva a amplitude sem definir a relação.'
