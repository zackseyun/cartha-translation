lexical_decisions:
- source_word: vile spirit
  choice: espírito vil
  rationale: Mantém a força moral pejorativa da expressão e segue o título e a terminologia recorrente do testemunho, sem suavizá-la para “impuro” ou “maligno”.
- source_word: Mother-Father
  choice: Mãe-Pai
  rationale: Preserva a designação paradoxal e composta, importante para a cosmologia do texto.
- source_word: Reflection of Radiant Providence
  choice: Reflexo da Providência radiante
  rationale: Conserva os termos técnicos e sua relação genitiva, usando português natural sem explicar indevidamente a entidade.
- source_word: chief archon
  choice: arconte principal
  rationale: “Arconte” é termo técnico reconhecível em textos gnósticos; “principal” comunica a hierarquia sem importar o título bíblico “príncipe”.
- source_word: Destiny
  choice: Destino
  rationale: A inicial maiúscula assinala que o termo é personificado ou tratado como poder cosmológico nesta passagem.
- source_word: unmoving race
  choice: raça inabalável
  rationale: Expressa melhor, em português corrente, a ideia de estabilidade espiritual; a alternativa mais literal “raça imóvel” é registrada em nota.
- source_word: age-long slavery
  choice: escravidão que atravessa as eras
  rationale: Evita tanto reduzir a duração a uma época única quanto impor a noção de eternidade absoluta.
- source_word: seed
  choice: descendência
  rationale: No contexto coletivo e genealógico, “descendência” é mais natural que “semente”, embora preserve o sentido de linhagem.
theological_decisions:
- issue: Identidade e relação entre Mãe-Pai, Espírito santo e Reflexo da Providência
  choice: Preservar a aposição complexa e explicá-la apenas como dificuldade sintática em nota
  alternative: Fundir explicitamente as três expressões numa única pessoa ou separá-las em entidades distintas
  rationale: O testemunho disponível não resolve de modo seguro a relação ontológica e gramatical entre as designações.
- issue: Personificação do Destino
  choice: Usar “Destino” com inicial maiúscula e retomá-lo explicitamente no v. 5
  alternative: Traduzir como conceito abstrato em minúscula
  rationale: O texto apresenta o Destino como realidade gerada, agente de males e soberano; a maiúscula torna essa função perceptível sem defini-la dogmaticamente.
- issue: Contradição explícita de Moisés no relato do dilúvio
  choice: Traduzir diretamente “Não foi como Moisés disse”
  alternative: Atenuar para uma interpretação alegórica da arca
  rationale: A tensão polêmica pertence ao texto e não deve ser harmonizada com Gênesis.
- issue: Duração da escravidão cósmica
  choice: “que atravessa as eras”
  alternative: “eterna” ou “por uma era”
  rationale: A expressão inglesa “age-long” não exige eternidade sem fim e deve permanecer aberta quanto à duração precisa.
- issue: Referentes pronominais nos vv. 9–10
  choice: Conservar a alternância de gênero e registrar a ambiguidade
  alternative: Substituir todos os pronomes por nomes interpretativamente escolhidos
  rationale: Nomear referentes específicos resolveria silenciosamente uma passagem cuja sintaxe permanece incerta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se termos cosmológicos essenciais como “arconte”, “Mãe-Pai”, “Providência” e “Destino”. Os números de página do manuscrito foram omitidos por interromperem as frases. Trata-se de versão provisória baseada no testemunho público em inglês fornecido; é necessária revisão direta dos testemunhos coptas.
