lexical_decisions:
- source_word: Providence
  choice: Providência
  rationale: Mantém o termo personificado e a associação com o cuidado e o propósito divinos, sem reduzir seu papel a mera previsão.
- source_word: the all
  choice: o Todo
  rationale: A maiúscula sinaliza o uso cosmológico e totalizante do termo, distinto de uma referência coloquial a 'tudo'.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva o valor técnico cosmológico do conceito, com forma natural em português.
- source_word: Chaos
  choice: Caos
  rationale: Mantém o termo cosmológico como domínio personificado ou estruturado, indicado pela maiúscula.
- source_word: Hades
  choice: Hades
  rationale: Evita identificar sem ressalva o mundo inferior do texto com 'inferno', opção teologicamente mais específica.
- source_word: aeon
  choice: éon
  rationale: Preserva a polissemia técnica entre era, ordem cósmica e domínio espiritual; uma nota auxilia o leitor.
- source_word: virginal Spirit
  choice: Espírito virginal
  rationale: Conserva o adjetivo do testemunho sem reinterpretá-lo como título mariano ou como simples sinônimo de pureza.
- source_word: angels of destitution
  choice: anjos da indigência
  rationale: Reproduz a ideia de privação ou carência e evita tornar a expressão mais abstrata do que o testemunho permite.
- source_word: five seals
  choice: cinco selos
  rationale: Mantém a terminologia ritual do texto sem explicar indevidamente sua natureza.
theological_decisions:
- issue: Identidade e gênero gramatical da voz da Providência
  choice: Empregar formas femininas quando a voz se identifica como Providência e Misericordiosa
  alternative: Neutralizar o gênero ou usar formas masculinas por associação com o Salvador
  rationale: Em português, 'Providência' é feminino, e o testemunho apresenta essa figura como voz pessoal; não se deve resolver a tensão identificando-a silenciosamente com uma figura masculina.
- issue: Sentido de Hades
  choice: Transliterar como 'Hades' e explicar em nota
  alternative: Traduzir como 'inferno'
  rationale: '''Inferno'' importaria associações doutrinárias posteriores e mais estreitas que não são exigidas pela cosmologia da passagem.'
- issue: Destruição iminente no versículo 5
  choice: Manter que os fundamentos do Caos estavam prestes a desabar e destruir seus habitantes
  alternative: Fazer da Providência o sujeito direto da destruição
  rationale: O testemunho permite uma relação sintática tensa; a redação escolhida conserva os fundamentos como referente mais próximo sem eliminar a ambiguidade cosmológica.
- issue: A prisão do corpo
  choice: Preservar a expressão no texto e registrar sua condição restaurada em nota
  alternative: Omitir 'do corpo' ou apresentá-lo sem ressalva
  rationale: A leitura é importante para a antropologia da passagem, mas a transparência textual exige indicar que depende de restauração editorial.
- issue: Água dos cinco selos
  choice: Preservar a fórmula ritual sem identificação denominacional
  alternative: Interpretá-la explicitamente como batismo cristão
  rationale: A passagem não define o rito, e uma identificação confessional resolveria indevidamente a evidência.
translation_notes:
  register: Português moderno, corrente e digno, com legibilidade brasileira e alcance internacional. Mantiveram-se os termos cosmológicos técnicos indispensáveis, explicados em notas. A numeração de página do manuscrito foi omitida por interromper a frase; a restauração editorial relevante foi incorporada com nota. Como a revisão direta do copta ainda está pendente, o rascunho permanece explicitamente baseado no testemunho inglês público fornecido.
