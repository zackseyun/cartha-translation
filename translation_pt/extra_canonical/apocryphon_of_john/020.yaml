translation:
  language: pt
  text: '1. Portanto, eu, a perfeita Providência do Todo, transformei-me em minha própria semente, pois fui a primeira a existir, percorrendo todos os caminhos, porque sou a riqueza da luz.


    2. Sou a memória da Plenitude. Entrei, porém, no domínio das trevas e perseverei até chegar ao meio da prisão. Os fundamentos do Caos estremeceram, e eu me escondi deles por causa de sua maldade; por isso, não me reconheceram.


    3. Voltei novamente, pela segunda vez, e percorri tudo ao redor.


    4. Procedi daqueles que pertencem à luz — a luz que eu sou —, sendo eu a memória da Providência.


    5. Entrei no meio das trevas e no interior do Hades,[a] pois estava cuidando de minha missão. Os fundamentos do Caos estremeceram, prestes a desabar sobre os que habitam no Caos e a destruí-los. Então tornei a subir depressa para minha raiz de luz, para que eles não fossem destruídos antes do tempo.


    6. Pela terceira vez, saí outra vez — eu, a luz que está dentro da luz; eu, a memória da Providência — a fim de entrar no meio das trevas e no interior do Hades. Enchi meu rosto com a luz da consumação do éon deles[b] e entrei no meio da prisão deles, isto é, a prisão do corpo.[c] Então disse: “Quem ouve, levante-se do sono profundo!” Ele chorou, e as lágrimas correram.


    7. Ele enxugou de si as lágrimas amargas e disse: “Quem está chamando meu nome? De onde me veio esta esperança, enquanto estou preso nas correntes da prisão?”


    8. Eu também disse: “Eu sou a Providência da luz pura.


    9. Sou o pensamento do Espírito virginal, que eleva você ao lugar digno de louvor.


    10. Levante-se e lembre-se de que foi você quem deu ouvidos. Siga sua raiz, que sou eu, a Misericordiosa. Proteja-se dos anjos da indigência, dos demônios do Caos e de todos os que armam ciladas contra você. Guarde-se do sono profundo e do confinamento no interior do Hades.”


    11. Então eu o levantei e o selei com a luz da água dos cinco selos,[d] para que, daquele momento em diante, a Morte não o dominasse. E eis que agora subirei ao éon perfeito.


    [a] Hades: o mundo inferior ou domínio dos mortos; o termo tradicional preserva a linguagem cosmológica do texto.


    [b] Éon: era ou ordem de existência; neste escrito, o termo também pode designar um domínio da realidade.


    [c] A expressão “do corpo” corresponde a uma restauração editorial de uma lacuna no testemunho textual.


    [d] “A água dos cinco selos” parece designar um rito de selamento ou purificação; sua forma exata não é explicada nesta passagem.'
