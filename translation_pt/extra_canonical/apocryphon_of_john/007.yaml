lexical_decisions:
- source_word: self-generated
  choice: autogerado
  rationale: Preserva o termo cosmológico distintivo e sua recorrência, sem substituí-lo por uma explicação doutrinária.
- source_word: the All
  choice: o Todo
  rationale: Mantém o sentido técnico da totalidade cósmica e a substantivação presente no testemunho.
- source_word: aeon
  choice: éon
  rationale: Emprega a transliteração consagrada em português para a entidade ou esfera cosmológica, evitando reduzi-la simplesmente a “era”.
- source_word: attended / attend
  choice: acompanhavam / acompanhasse / acompanham
  rationale: Expressa presença e serviço sem impor a ideia mais específica de culto, adoração ou subordinação funcional.
- source_word: Indestructibility
  choice: Indestrutibilidade
  rationale: Conserva a abstração personificada e a inicial maiúscula do contexto cosmológico.
- source_word: Discretion
  choice: Discernimento
  rationale: Em português atual, comunica melhor a faculdade de distinguir ou julgar do que “discrição”.
- source_word: Sophia
  choice: Sofia
  rationale: Preserva o nome técnico personificado em forma portuguesa, em vez de resolver silenciosamente o termo como a abstração comum “Sabedoria”.
theological_decisions:
- issue: Identidade e relações entre o Espírito, Barbelo, o Autogerado e Cristo
  choice: Preservar as aposições e os pronomes do testemunho, sem harmonizá-los
  alternative: Reformular a passagem para identificar explicitamente cada figura e sua relação
  rationale: A sintaxe transmitida permite tensões e ambiguidades; explicitá-las exigiria uma interpretação teológica não garantida pelo material fornecido.
- issue: Sentido de “the All”
  choice: Traduzir como o termo técnico “o Todo”
  alternative: Traduzir como “todas as coisas” ou “o universo”
  rationale: “O Todo” conserva a possível dimensão cosmológica técnica sem restringi-la à criação material.
- issue: Função das quatro luzes e dos doze éons
  choice: Usar “acompanhar” e “pertencer” conforme o testemunho
  alternative: Usar “adorar”, “servir” ou definir uma hierarquia angelológica
  rationale: O testemunho não exige uma dessas relações teológicas mais específicas.
