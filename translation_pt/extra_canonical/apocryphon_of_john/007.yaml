  terminology: “Autogerado”, “Todo”, “éon”, “Indestrutibilidade”, “Sofia” e “Discernimento” são escolhas consistentes e apropriadas. “Acompanhar” preserva prudentemente o valor não especificado de attended, sem introduzir linguagem de culto ou uma hierarquia doutrinária.
  issues:
  - severity: medium
    issue: Posição de “juntamente com Barbelo” no versículo 2
    rationale: O testemunho diz que o Espírito santo completou “the self-generated God, his Son, together with Barbelo”. Ao deslocar a expressão para antes do objeto, a versão pode sugerir que Barbelo é coparticipante da ação de completar, em vez de conservar a ligação ambígua/mais imediata com o Deus autogerado, seu Filho.
  - severity: low
    issue: “Designado por um nome” no versículo 4
    rationale: A expressão “had been named with a name” é mais diretamente reproduzida por “fora chamado por um nome”. “Designado” é possível, mas tende a introduzir a noção de nomeação para uma função.
