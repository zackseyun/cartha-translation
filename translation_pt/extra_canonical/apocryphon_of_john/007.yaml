translation:
  language: pt
  text: '**O Apócrifo de João — As Quatro Luzes**


    1. A Vida Eterna, juntamente com a Vontade dele, e a Mente, com a Presciência, acompanhavam e exaltavam o Espírito invisível e Barbelo, pois haviam vindo à existência por causa dela.


    2. O Espírito santo também completou, juntamente com Barbelo, o Deus autogerado, seu Filho, para que ele acompanhasse o grande Espírito invisível e virginal do Deus autogerado, o Cristo, a quem ele havia exaltado em alta voz.


    3. Ele procedeu por meio da Providência, e o Espírito invisível e virginal estabeleceu o Deus verdadeiramente autogerado sobre o Todo.


    4. Também sujeitou a ele toda autoridade e fez com que a verdade estivesse dentro dele, para que conhecesse o Todo — ele, que havia sido designado por um nome exaltado acima de todo nome, pois esse nome será pronunciado aos que forem dignos dele —,


    5. pois, da Luz, que é Cristo, e da Indestrutibilidade, por meio da dádiva do Espírito e das quatro [grandes] luzes provenientes do Deus autogerado [...].[a] Ele esperou que elas o acompanhassem:


    6. as três — Vontade, Ideia e Vida —


    7. e as quatro potências — Entendimento, Graça, Percepção e Discernimento.


    8. Além disso, a Graça pertence ao éon-luz Armozel — que é o primeiro anjo —, e há outros três éons juntamente com esse éon: Graça, Verdade e Forma.


    9. Há também a segunda luz, Oriael, que foi estabelecida sobre o segundo éon.


    10. Além disso, há outros três éons juntamente com ele: Reflexão, Percepção e Memória.


    11. A terceira luz é Daveithai, que foi estabelecida sobre o terceiro éon, e há outros três éons juntamente com ele: Entendimento, Amor e Forma Ideal.


    12. O quarto éon foi estabelecido sobre a quarta luz, Eleleth.


    13. Além disso, há outros três éons juntamente com ele: Perfeição, Paz e Sofia.


    14. Essas são as quatro luzes que acompanham o Deus autogerado.


    15. Esses são os doze éons que acompanham o Filho do Poderoso, o Autogerado, Cristo, por meio da vontade e da dádiva do Espírito invisível; e os doze éons pertencem ao Filho autogerado.


    16. Além disso, tudo foi estabelecido por meio da vontade do Espírito santo, por meio do Autogerado.


    [a] O texto-fonte está incompleto neste ponto, e a relação sintática entre os elementos da frase não pode ser determinada com segurança.'
