translation:
  language: pt
  text: '1. Imediatamente, [enquanto eu refletia sobre essas coisas], eis que [os céus se abriram, e] a criação [inteira] debaixo do céu resplandeceu, e [o mundo] estremeceu.


    2. [Fiquei com medo e, de repente,] vi, dentro da [luz, uma criança em pé] perto de mim.


    3. Enquanto eu [a] contemplava, [ela se tornou] semelhante a um ancião; então ele [mudou sua] aparência, tornando-se semelhante a um filho.[a]


    4. Não [era uma entidade diferente] diante de mim; antes, havia dentro da [luz] uma [aparição] com múltiplas formas. [As figuras semelhantes] apareciam umas por meio das outras, [e] a [aparição] tinha três formas.


    5. Ele me perguntou: “João, João, por que você se admira e por que [tem] medo?


    6. Será que esta aparição é desconhecida de todos vocês?


    7. Quero dizer: não [seja] fraco de coração.


    8. Eu sou aquele que [está] sempre [com todos vocês].


    9. Eu [sou o Pai], eu sou a Mãe, eu sou o Filho.


    10. Eu sou aquele que não foi poluído nem contaminado.


    11. [Agora vim revelar a você] o que é, [o que era] e o que [acontecerá], para que [você compreenda as coisas] que ainda não se manifestaram [e as que estão manifestas, e para lhe revelar] a [raça inabalável do] [Homem Perfeito].


    12. [Levante, portanto,] o [rosto, para que] você [receba] as coisas que eu [lhe direi] hoje [e] possa [transmiti-las aos espíritos que são seus companheiros], [da] raça [inabalável] do [Homem] Perfeito.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho inglês fornecido traz aqui “filho” acompanhado de um marcador de nota, mas não fornece o conteúdo da nota. A leitura é, portanto, provisória até a consulta direta aos testemunhos coptas.
    reason: Sinalizar honestamente que a palavra e o marcador dependem do testemunho intermediário e ainda aguardam revisão na língua-fonte.
lexical_decisions:
- source_word: lo
  choice: eis que / de repente
  rationale: A primeira ocorrência foi vertida pela fórmula digna “eis que”; na segunda, “de repente” produz português natural sem perder a irrupção visionária.
- source_word: old man
  choice: ancião
  rationale: “Ancião” conserva a idade e o registro religioso-literário sem soar depreciativo.
- source_word: appearance
  choice: aparição
  rationale: No contexto visionário, “aparição” expressa uma forma visível que se manifesta sem definir sua natureza ontológica.
- source_word: unmoving race
  choice: raça inabalável
  rationale: “Inabalável” comunica constância e estabilidade melhor do que o literal e pouco natural “imóvel”, preservando o caráter técnico da expressão.
- source_word: Perfect Man
  choice: Homem Perfeito
  rationale: Mantém o provável título técnico e suas maiúsculas, sem interpretá-lo como simples descrição moral.
- source_word: companion spirits
  choice: espíritos que são seus companheiros
  rationale: Preserva a relação ambígua entre o destinatário e os espíritos, evitando decidir se a expressão significa apenas “espíritos semelhantes” ou membros de um grupo formal.
- source_word: unpolluted and untainted
  choice: não foi poluído nem contaminado
  rationale: Mantém os dois termos coordenados e a imagem de pureza sem reduzir a frase a um único adjetivo.
theological_decisions:
- issue: Identidade tríplice da figura reveladora
  choice: “Eu [sou o Pai], eu sou a Mãe, eu sou o Filho”
  alternative: Reformular como três modos, pessoas ou aspectos
  rationale: A tradução conserva a autodeclaração e sua tensão teológica, sem impor uma explicação trinitária ou modalista.
- issue: Uma aparição em três formas
  choice: A aparição única “tinha três formas”
  alternative: Tratar as formas como três entidades distintas
  rationale: O texto nega que se trate de uma entidade diferente e simultaneamente descreve pluralidade formal; ambas as afirmações foram mantidas.
- issue: Sentido de “raça inabalável”
  choice: Preservar como expressão técnica sem explicação no corpo do texto
  alternative: Interpretar como igreja, eleitos, humanidade espiritual ou linhagem específica
  rationale: Essas identificações excederiam a evidência fornecida e importariam uma leitura doutrinária.
- issue: Referência de “todos vocês”
  choice: Manter o plural apesar do diálogo direto com João
  alternative: Regularizar para o singular “você”
  rationale: O plural pode incluir João e seus companheiros ou uma comunidade mais ampla; normalizá-lo eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais. Os colchetes foram preservados para indicar material restaurado ou incerto no testemunho fornecido. A numeração intrusiva de página do manuscrito foi omitida. Como a revisão direta do copta está pendente, esta é uma tradução provisória baseada no testemunho inglês público, usada com cautela e sem resolver ambiguidades textuais ou teológicas.
