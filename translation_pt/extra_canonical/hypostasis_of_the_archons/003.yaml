  text: 'The archons plotted and said, “Come, let us create a man to be soil of the earth.”


    They fashioned their creation as an entirely earthly being.


    The archons have bodies that are both female [and male], and their faces are the faces of beasts. They took [soil] from the earth and fashioned [their man] according to their own bodies and [according to the image] of God that had appeared [to them] on the water.


    They said, “[Come], let us seize the image through the form we have molded, [so that] the image may gaze upon its male counterpart [and become enamored with it], [] and so that we may grasp it in the form we have molded.” Because they were powerless, they did not understand the power of God.


    He blew into the man’s face, and the man received a soul, but he remained on the ground for several days. Because they were powerless, the archons could not make him rise. They kept blowing like stormy winds, trying to seize the image that had appeared to them on the waters, but they did not know its power.


    All these events happened by the will of the Father of the All.


    Afterward, the Spirit looked upon the soulish man on the ground. The Spirit came forth from the Adamic Land. It descended and made its dwelling within him, and that man became a living soul. The Spirit called his name Adam because he was found moving on the ground.


    A voice from indestructibility came forth to help Adam. The archons gathered all the animals of the earth and all the birds of the sky and brought them before Adam to learn what Adam might call them, so that he could give names to all the birds and all the animals.'
translation:
  language: pt
  text: 'Os arcontes tramaram e disseram: “Venham, criemos um homem para ser solo da terra.”


    Eles moldaram sua criatura como um ser inteiramente terreno.


    Os arcontes possuem corpos que são ao mesmo tempo femininos [e masculinos], e seus rostos são rostos de feras. Tomaram [solo] da terra e moldaram [seu homem] segundo seus próprios corpos e [segundo a imagem] de Deus que lhes havia aparecido sobre a água.


    Disseram: “[Venham], apoderemo-nos da imagem por meio da forma que moldamos, [para que] a imagem contemple seu correspondente masculino [e se enamore dele], [][a] e para que possamos agarrá-la na forma que moldamos.” Como eram impotentes, não compreenderam o poder de Deus.


    Ele[b] soprou no rosto do homem, e o homem passou a possuir uma alma, mas permaneceu no chão durante vários dias. Como eram impotentes, os arcontes não conseguiram fazê-lo levantar-se. Continuaram soprando como ventos tempestuosos, tentando apoderar-se da imagem que lhes havia aparecido sobre as águas, mas não conheciam o poder dela.


    Todos esses acontecimentos se deram pela vontade do Pai do Todo.


    Depois disso, o Espírito contemplou o homem dotado de alma, caído no chão. O Espírito veio da Terra Adâmica, desceu e fez morada dentro dele; e aquele homem tornou-se uma alma vivente. O Espírito deu-lhe o nome de Adão, porque ele foi encontrado movendo-se sobre o chão.


    Uma voz vinda da indestrutibilidade manifestou-se para ajudar Adão. Os arcontes reuniram todos os animais da terra e todas as aves do céu e os levaram à presença de Adão, para saber como Adão os chamaria, a fim de que desse nome a todas as aves e a todos os animais.'
