lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional para as potências governantes deste escrito, sem substituí-lo por uma interpretação denominacional.
- source_word: soil of the earth
  choice: solo da terra
  rationale: Preserva a formulação deliberadamente redundante e sua ligação temática entre o ser humano e a terra.
- source_word: soulish man
  choice: homem dotado de alma
  rationale: Expressa de modo compreensível a condição intermediária descrita pelo texto, sem recorrer ao pouco transparente “homem psíquico”.
- source_word: Adamic Land
  choice: Terra Adâmica
  rationale: Trata a expressão como designação própria e conserva sua associação explícita com Adão.
- source_word: Father of the All
  choice: Pai do Todo
  rationale: Preserva o título cosmológico específico, em vez de normalizá-lo como “Pai de todos”.
- source_word: indestructibility
  choice: indestrutibilidade
  rationale: Mantém o substantivo abstrato e o caráter técnico da esfera transcendente mencionada.
- source_word: living soul
  choice: alma vivente
  rationale: Conserva o eco tradicional da linguagem de criação e a distinção interna entre possuir alma e tornar-se alma vivente.
theological_decisions:
- issue: Identidade de quem sopra no rosto do homem
  choice: Preservar o sujeito singular como “Ele” e assinalar a ambiguidade
  alternative: Identificar o sujeito como um arconte específico ou como o chefe dos arcontes
  rationale: O testemunho fornecido muda do plural para o singular sem nomear explicitamente o agente; a tradução não deve resolver essa tensão.
- issue: Natureza do homem antes da entrada do Espírito
  choice: “homem dotado de alma”
  alternative: “homem psíquico” ou “homem sem vida”
  rationale: A escolha mantém a distinção entre alma e Espírito presente na narrativa, sem impor uma sistematização posterior.
- issue: A vontade do Pai do Todo e a ação dos arcontes
  choice: Traduzir diretamente que todos os acontecimentos se deram pela vontade do Pai do Todo
  alternative: Atenuar para permissão ou presciência
  rationale: O texto afirma vontade, e convertê-la em mera permissão resolveria indevidamente a tensão teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os colchetes das reconstruções e da lacuna foram preservados. Como o texto copta ainda aguarda revisão direta, esta versão é provisória e se baseia no testemunho inglês público fornecido; por isso, evita conjecturas além das restaurações já sinalizadas.
