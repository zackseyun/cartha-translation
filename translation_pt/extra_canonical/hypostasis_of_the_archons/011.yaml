base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: pt
  text: 'Quando Sabaoth, filho de Yaldabaoth, viu o poder daquele anjo, arrependeu-se e condenou ao juízo seu pai e a Matéria, sua mãe, a quem insultou.


    Ele entoou cânticos de louvor à Sophia do alto e à filha dela, Zoe. Sophia e Zoe o elevaram e o estabeleceram sobre o sétimo céu, abaixo do véu que separa os domínios superiores dos inferiores. Ele é chamado “Deus dos exércitos, Sabaoth”, porque está sobre os exércitos do caos, pois Sophia o estabeleceu nessa posição.


    Depois que esses acontecimentos se deram, Sabaoth fez para si um enorme carro de querubins com quatro faces, uma infinidade de anjos para servi-lo, além de harpas e liras.


    Sophia trouxe sua filha Zoe, fez que ela se sentasse à direita dele e o instruísse a respeito das coisas do oitavo céu. E colocou o anjo da ira à esquerda dele.


    [A partir] daquele dia, [a direita dele] passou a ser chamada “vida”, [a] enquanto a esquerda passou a simbolizar a injustiça do domínio superior do Autocrata. Antes do tempo em que vocês vieram a existir, esses acontecimentos já haviam ocorrido.


    Quando Yaldabaoth viu Sabaoth em tão grande majestade e elevado a tamanha altura, sentiu inveja dele, e sua inveja tornou-se uma entidade andrógina. Essa foi a origem da Inveja, que deu à luz a Morte. A Morte gerou descendentes e designou cada um deles para governar seu próprio céu. E todos os céus do caos ficaram repletos de suas multidões.


    Todos esses acontecimentos, porém, deram-se pela vontade do Pai do Todo, segundo o modelo de tudo o que está acima, para que se completasse a totalidade do caos.


    Vejam, eu instruí vocês a respeito do molde dos arcontes, da matéria na qual ele se manifestou, bem como do progenitor deles e do mundo deles.”'
