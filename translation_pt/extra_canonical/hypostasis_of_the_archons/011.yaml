lexical_decisions:
- source_word: Sabaoth
  choice: Sabaoth
  rationale: Mantém o nome tradicional do personagem e preserva a associação explícita com o título “Deus dos exércitos”.
- source_word: Sophia / Zoe
  choice: Sophia / Zoe
  rationale: Preserva os nomes gregos personificados; traduzi-los simplesmente como “Sabedoria” e “Vida” poderia apagar sua função nominal no relato.
- source_word: hosts
  choice: exércitos
  rationale: Equivalente bíblico tradicional e inteligível, adequado tanto ao título quanto às hostes do caos.
- source_word: autocrat
  choice: Autocrata
  rationale: Conserva o título técnico da cosmologia do escrito sem identificá-lo interpretativamente com outra figura.
- source_word: archons
  choice: arcontes
  rationale: Transliteração já corrente em português para os governantes cósmicos desta literatura, evitando uma harmonização indevida com termos bíblicos mais gerais.
- source_word: summation of chaos
  choice: totalidade do caos
  rationale: Expressa a ideia de consumação ou composição completa sem definir de modo excessivo uma formulação cujo sentido técnico depende do original copta ainda não revisto.
- source_word: mold
  choice: molde
  rationale: Mantém a imagem concreta e a possível terminologia cosmogônica do testemunho, em vez de substituí-la por “forma” ou “natureza”.
theological_decisions:
- issue: A identidade de Sabaoth como “Deus dos exércitos”
  choice: Manter o título dentro da cosmologia própria do texto
  alternative: Harmonizar diretamente Sabaoth com o Deus bíblico
  rationale: O trecho distingue Sabaoth, Yaldabaoth e o Pai do Todo; a tradução não deve dissolver essa tensão teológica.
- issue: Personificação de Matéria, Inveja e Morte
  choice: Usar iniciais maiúsculas quando funcionam como entidades pessoais
  alternative: Tratálas apenas como substantivos abstratos
  rationale: O relato atribui parentesco, ação e governo a essas figuras, indicando personificação narrativa.
- issue: Relação entre Zoe e a “vida” à direita de Sabaoth
  choice: Preservar Zoe como nome e “vida” como designação
  alternative: Traduzir ambos uniformemente como “Vida”
  rationale: A distinção formal do testemunho pode ser significativa e não deve ser eliminada sem exame direto do copta.
- issue: “Pai do Todo”
  choice: Pai do Todo
  alternative: Pai de todos
  rationale: “Todo” parece designar a totalidade cósmica ou pleromática, não apenas um conjunto de pessoas; a formulação conserva essa possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente legível, com preferência por construções naturais no Brasil sem regionalismos marcados. A tradução é provisória, baseada no testemunho inglês público fornecido; a revisão direta do copta do Códice II,4 de Nag Hammadi continua pendente. Colchetes de restauração foram preservados, e a lacuna vazia recebeu nota explícita. Os números [7] e [8], que são marcadores materiais do testemunho e não notas explicativas do trecho, foram omitidos.
