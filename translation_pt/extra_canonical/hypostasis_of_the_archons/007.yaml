    Orea [3] then approached Noah, desirous to board the ark. When he refused her, she blew on the ark so that it was devoured by fire. So a second time he made an ark.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: pt
  text: 'Os governantes tramaram entre si e disseram: “Venham, provoquemos um dilúvio com nossas próprias mãos e aniquilemos toda carne, seres humanos e animais.”


    Quando o governante das forças soube da trama deles, disse a Noé: “Faça para você uma arca de madeira que não apodrece e esconda-se nela — você, seus filhos, os animais e as aves do céu, tanto os pequenos como os grandes —, colocando-a sobre o monte Sir.”


    Orea [a] então se aproximou de Noé, querendo entrar na arca. Quando ele não permitiu, ela soprou sobre a arca, e esta foi consumida pelo fogo. Então ele fez uma arca pela segunda vez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho fornecido traz “Orea [3]”. O número entre colchetes parece ser um sinal manuscrito ou editorial, não parte do nome; aqui ele é representado por esta nota. A forma do nome também pode aparecer como Norea em estudos e traduções.
    reason: Preserva e explica o marcador editorial fornecido, ao mesmo tempo que informa uma variante relevante do nome sem alterar silenciosamente o texto principal.
lexical_decisions:
- source_word: archons
  choice: governantes
  rationale: Traduz o título funcional de modo claro e natural, sem importar a forma técnica grega “arcontes”; neste escrito, o termo designa poderes governantes.
- source_word: all flesh
  choice: toda carne
  rationale: Preserva a expressão tradicional e sua abrangência, explicitada logo depois por “seres humanos e animais”.
- source_word: ark
  choice: arca
  rationale: É o equivalente português estabelecido para a embarcação de Noé e mantém a intertextualidade com a narrativa do dilúvio.
- source_word: wood that does not rot
  choice: madeira que não apodrece
  rationale: Mantém o sentido concreto do testemunho sem identificar uma espécie de madeira não indicada.
- source_word: blew on the ark
  choice: soprou sobre a arca
  rationale: Conserva a ação incomum do texto e evita explicar o mecanismo sobrenatural além do que a testemunha afirma.
theological_decisions:
- issue: Identidade e valoração dos archons
  choice: governantes
  alternative: arcontes
  rationale: A tradução comunica a função dessas figuras sem acrescentar uma interpretação denominacional; a nota esclarece o termo técnico possível.
- issue: O governante que adverte Noé
  choice: o governante das forças
  alternative: o arconte das potestades
  rationale: Preserva a formulação distintiva e sua possível ambiguidade hierárquica, sem identificar essa personagem com Deus ou com outra entidade.
- issue: Recusa de Noé a Orea
  choice: Quando ele não permitiu
  alternative: Quando ele a recusou
  rationale: No contexto, a recusa diz respeito à entrada na arca; a formulação torna isso natural em português sem sugerir necessariamente uma rejeição pessoal mais ampla.
- issue: Natureza da destruição da arca
  choice: foi consumida pelo fogo
  alternative: pegou fogo
  rationale: Mantém a força do testemunho, segundo o qual a arca foi devorada pelo fogo, sem suavizar o acontecimento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação segue provisoriamente o testemunho inglês de domínio público fornecido, pois a revisão direta do copta ainda está pendente. Mantiveram-se a estranheza narrativa, a terminologia de poderes governantes e as ambiguidades não resolvidas do trecho.
