  terminology: '"Governantes", "toda carne", "arca", "madeira que não apodrece" e "governante das forças" são escolhas defensáveis e consistentes com o caráter provisório da base inglesa. "Orea" deve permanecer no texto; a variante "Norea" pode ser informada em nota, sem substituí-la.'
