    issue: Capitalização interpretativa de «Espírito»
    rationale: O testemunho de base diz «By the spirit of the Father of truth», sem capitalização. A maiúscula em português pode identificar o referente como o Espírito Santo ou como um título divino; essa identificação não deve ser imposta enquanto a consulta direta ao copta está pendente.
