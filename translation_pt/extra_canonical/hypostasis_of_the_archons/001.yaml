translation:
  language: pt
  text: '[] Sobre a substância das autoridades (aquilo de que foram feitas). Pelo Espírito do Pai da verdade, o grande apóstolo mencionou as autoridades das trevas e nos informou: “Nossa luta não é contra carne e [sangue], mas contra as autoridades cósmicas e os espíritos do mal.” Enviei a você este escrito porque você perguntou sobre a substância das autoridades (aquilo de que foram feitas).'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: substance
  choice: substância
  rationale: Mantém a formulação técnica e a possível dimensão ontológica do testemunho, enquanto a explicação parentética esclarece o sentido pretendido.
- source_word: authorities
  choice: autoridades
  rationale: Preserva o termo recorrente e sua ambiguidade entre poderes governantes e seres cósmicos, sem impor uma interpretação como “arcontes” no corpo do texto.
- source_word: spirit
  choice: Espírito
  rationale: A inicial maiúscula é apropriada no contexto da expressão “do Pai da verdade”, que apresenta o espírito como agente divino.
- source_word: cosmic authorities
  choice: autoridades cósmicas
  rationale: Reproduz a dimensão cosmológica da expressão e mantém sua ligação lexical com “autoridades” no restante da introdução.
- source_word: battle
  choice: luta
  rationale: Expressão natural em português e adequada ao conflito descrito, sem intensificar desnecessariamente para “guerra”.
- source_word: spirits of evil
  choice: espíritos do mal
  rationale: Preserva a construção ampla do testemunho, sem resolver se “mal” indica natureza, origem ou esfera de atuação.
theological_decisions:
- issue: Identidade das “autoridades”
  choice: Manter “autoridades”
  alternative: Traduzir como “arcontes”, “potestades” ou “poderes”
  rationale: A escolha conserva a repetição terminológica e não antecipa uma identificação doutrinária específica; “cósmicas” fornece o contexto supramundano.
- issue: Agência do Espírito do Pai da verdade
  choice: “Pelo Espírito do Pai da verdade”
  alternative: “Por meio do espírito do Pai da verdade”
  rationale: Mantém a agência expressa no testemunho e sua possível referência divina, sem desenvolver uma formulação trinitária ausente do texto.
- issue: Natureza da substância das autoridades
  choice: Preservar “substância” com a explicação parentética
  alternative: Simplificar para “origem” ou “matéria”
  rationale: O texto relaciona a substância àquilo de que as autoridades foram feitas; manter ambos preserva a tensão entre composição e origem.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário internacional. O número isolado de página do manuscrito foi omitido. O colchete inicial vazio e os colchetes em [sangue] foram preservados como sinais do estado material ou da restauração do testemunho. A redação é provisória, pois a revisão direta do copta ainda está pendente.
