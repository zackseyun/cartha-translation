review_pass:
  verdict: revise
  source_fidelity: A tradução mantém com precisão a estrutura, a repetição de “substância” e “autoridades”, a explicação parentética sobre aquilo de que elas foram feitas, e os colchetes do testemunho. “Luta”, “autoridades cósmicas” e “espíritos do mal” correspondem adequadamente ao testemunho inglês provisório. A revisão direta do copta permanece pendente.
  naturalness: O português é claro, moderno e adequado ao registro do texto. “Aquilo de que foram feitas” é compreensível e preserva a explicação do original; a repetição é intencional e deve ser mantida.
  terminology: “Autoridades” preserva bem o termo técnico sem antecipar “arcontes” ou outra identificação interpretativa. Contudo, a maiúscula em “Espírito” introduz uma identificação teológica mais definida do que a fornecida pelo testemunho, que traz “spirit” em minúscula. Deve-se usar “espírito”, conservando a possível leitura divina sem a impor.
  issues:
  - severity: medium
    issue: Capitalização interpretativa de “Espírito”.
    rationale: O testemunho de base diz “By the spirit of the Father of truth”. A inicial maiúscula em português pode identificar o referente especificamente como o Espírito Santo e, assim, acrescentar uma determinação teológica que o texto-base não explicita. “Pelo espírito do Pai da verdade” preserva a ambiguidade.
  revised_text: '[] Sobre a substância das autoridades (aquilo de que foram feitas). Pelo espírito do Pai da verdade, o grande apóstolo mencionou as autoridades das trevas e nos informou: “Nossa luta não é contra carne e [sangue], mas contra as autoridades cósmicas e os espíritos do mal.” Enviei a você este escrito porque você perguntou sobre a substância das autoridades (aquilo de que foram feitas).'
