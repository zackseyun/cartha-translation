  source_fidelity: A tradução preserva a estrutura, a repetição de «substância» e «autoridades», a citação e os colchetes. Contudo, a maiúscula em «Espírito» interpreta como nome/título divino uma expressão que o testemunho inglês apresenta em minúscula («the spirit of the Father of truth»); como a revisão direta do copta está pendente, convém não fixar essa interpretação.
  naturalness: O português é claro, moderno e adequado ao registro. «Enviei a você» é natural e compreensível no português brasileiro e internacional.
  terminology: «Substância», «autoridades», «autoridades cósmicas» e «espíritos do mal» conservam adequadamente a terminologia e as ambiguidades do texto. «Espírito» deve ser mudado para «espírito» para evitar uma especificação teológica não exigida pelo testemunho de base.
