base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/008.yaml
  text: 'The archons went to meet her, plotting to deceive her. Their leader said to her, “Your mother, Eve, came to us.” But Norea turned to them and said, “You are the archons of darkness. Cursed are you! You did not know my mother. Instead, you knew your own female counterpart, because I am not your offspring. I come from the world above.”


    In his might, the arrogant archon turned, and his face became like a flaming [inferno]. He acted presumptuously toward her and [said], “You must serve us sexually, as your mother Eve did, because [. . .] has been delegated to me.”


    But Norea, in the power of [God], turned and cried out in a loud voice to the Holy One, the God of the All: [] “Rescue me from the archons of injustice, and save me immediately from their hands!” [4]


    An angel descended from heaven and said to her, “Why do you call upon God? Why are you so presumptuous toward the holy Spirit?”


    Norea asked, “Who are you?”


    Meanwhile, the archons of injustice had withdrawn from her.'
translation:
  language: pt
  text: 'Os arcontes foram ao encontro dela, tramando enganá-la. O líder deles lhe disse: “Sua mãe, Eva, veio até nós.” Norea, porém, voltou-se para eles e disse: “Vocês são os arcontes das trevas. Malditos sejam! Vocês não conheceram minha mãe; em vez disso, conheceram sua própria contraparte feminina, pois eu não sou descendente de vocês. Eu venho do mundo do alto.”


    Em seu poder, o arrogante arconte se voltou, e seu rosto ficou como um [inferno] em chamas.[a] Ele a tratou com insolência e [disse]: “Você terá de nos prestar serviços sexuais, como fez sua mãe Eva, porque [. . .] foi confiado a mim.”[b]


    Norea, porém, no poder de [Deus], voltou-se e clamou em alta voz ao Santo, o Deus do Todo:[c] [] “Livra-me dos arcontes da injustiça e salva-me imediatamente das mãos deles!”


    Um anjo desceu do céu e lhe disse: “Por que você invoca Deus? Por que se mostra tão presunçosa para com o Espírito santo?”[d]


    Norea perguntou: “Quem é você?”


    Enquanto isso, os arcontes da injustiça haviam se afastado dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “[Inferno]” representa uma restauração editorial em trecho danificado do manuscrito.
    reason: Explicar os colchetes e não apresentar a restauração como leitura inteiramente preservada.
  - marker: b
    text: Há uma lacuna no manuscrito antes de “foi confiado a mim”; não é possível determinar com segurança o que teria sido confiado ao arconte.
    reason: Preservar a incerteza sintática e semântica causada pelo dano textual.
  - marker: c
    text: “[Deus]” é uma restauração; o sinal [] indica outra lacuna no texto antes do clamor de Norea.
    reason: Informar o leitor sobre dois sinais distintos de dano ou reconstrução textual.
  - marker: d
    text: A pergunta do anjo é mantida em sua forma difícil. O texto disponível parece censurar Norea por sua atitude para com o Espírito santo, sem explicar de imediato a aparente tensão.
    reason: Evitar harmonizar uma fala ambígua ou surpreendente.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional para os poderes governantes desta obra, evitando reduzi-lo a simples autoridades humanas.
- source_word: female counterpart
  choice: contraparte feminina
  rationale: Preserva a formulação cosmológica e sua relativa indeterminação, sem substituí-la por ‘esposa’, ‘mulher’ ou outra relação mais específica.
- source_word: world above
  choice: mundo do alto
  rationale: Expressa com naturalidade a procedência transcendente de Norea sem impor terminologia teológica adicional.
- source_word: sexual services
  choice: serviços sexuais
  rationale: Torna explícita a coerção sexual presente no testemunho, em linguagem clara e digna, sem eufemismo que enfraqueça a violência da cena.
- source_word: God of the All
  choice: Deus do Todo
  rationale: Conserva o título cosmológico característico e sua possível dimensão técnica.
- source_word: holy Spirit
  choice: Espírito santo
  rationale: Mantém a expressão do testemunho sem decidir se funciona aqui como nome pessoal plenamente definido ou como designação descritiva.
theological_decisions:
- issue: Identidade e natureza dos arcontes
  choice: Preservar ‘arcontes’ como designação técnica
  alternative: Traduzir como ‘governantes’ ou ‘poderes’
  rationale: O contexto cosmológico da obra dá ao termo um sentido especializado; uma tradução genérica poderia fazê-los parecer apenas governantes humanos.
- issue: Relação entre Eva e a ‘contraparte feminina’ dos arcontes
  choice: Manter as duas referências distintas como aparecem no testemunho
  alternative: Identificar ou harmonizar explicitamente Eva com a contraparte feminina
  rationale: A passagem contém tensão conceitual; a tradução não deve resolver uma possível distinção ou identificação que o texto não esclarece.
- issue: Acusação do anjo contra Norea
  choice: Traduzir literalmente a pergunta sobre sua presunção para com o Espírito santo
  alternative: Reformular como elogio à ousadia ou corrigir uma aparente incongruência narrativa
  rationale: A fala é teologicamente e narrativamente tensa. Preservá-la evita harmonização interpretativa.
- issue: Restaurações e lacunas manuscritas
  choice: Conservar colchetes e reticências sinalizando texto restaurado ou perdido
  alternative: Completar as lacunas por conjectura ou omiti-las silenciosamente
  rationale: O estado textual deve permanecer visível, especialmente porque ainda falta revisão direta do copta.
translation_notes:
  register: Português moderno, corrente e digno, com boa legibilidade brasileira e compreensão internacional. ‘Você/vocês’ foi usado no diálogo por naturalidade contemporânea; ‘livra-me’ e ‘salva-me’ preservam solenidade na oração. A tradução é provisória, baseada no testemunho inglês de domínio público fornecido; requer conferência direta com o copta do Códice de Nag Hammadi II,4. Colchetes e lacunas foram preservados de modo visível.
