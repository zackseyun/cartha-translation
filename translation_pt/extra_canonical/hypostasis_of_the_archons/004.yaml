  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
translation:
  language: pt
  text: 'Os arcontes levaram Adão e o colocaram no jardim, para que o cultivasse e guardasse. Deram-lhe uma ordem: “Você pode comer de [todas] as árvores do jardim, mas não coma da árvore do conhecimento do bem e do mal. Não a [toque], porque, no dia em que dela comer, certamente morrerá.”


    [Isso] eles [lhe disseram], embora não entendessem o que [lhe haviam dito]. Ao contrário, foi segundo a vontade do Pai [] que falaram dessa maneira, para que Adão de fato comesse e para que Adão <não> os considerasse como os consideraria uma pessoa inteiramente material.


    Os arcontes conspiraram entre si e disseram: “Venham, façamos cair um sono profundo sobre Adão”; e Adão adormeceu. O sono profundo que fizeram cair sobre ele, e que ele dormiu, é a ignorância. Abriram-lhe o lado, como uma mulher viva. Depois fecharam-lhe o lado, pondo carne no lugar, e Adão tornou-se meramente psíquico.[a]


    A mulher espiritual aproximou-se dele e lhe disse: “Levante-se, Adão.”


    Quando olhou para ela, ele disse: “Você me deu vida. Será chamada Mãe dos Viventes, porque ela é minha mãe. Ela é a médica, a mulher, aquela que deu à luz.”[b]


    As autoridades aproximaram-se do Adão delas. Quando viram a contraparte feminina dele conversando com ele, ficaram excitadas e a cobiçaram. Disseram umas às outras: “Venham, lancemos nosso sêmen nela”; e a perseguiram. Ela, porém, riu delas por causa de sua estupidez e cegueira. Quando a agarraram, ela se transformou numa árvore e pôs diante delas uma semelhança sombria de si mesma. Elas a profanaram da maneira mais vil, profanando o selo da voz dela.[c] Assim, trouxeram juízo sobre si mesmas por meio da forma que haviam modelado à própria imagem.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“Psíquico” traduz uma categoria antropológica técnica: alguém pertencente ao nível da alma, em contraste com o espiritual. Não significa simplesmente “emocional”.'
    reason: O equivalente português pode ser mal interpretado no uso moderno, mas preserva melhor a terminologia técnica do que uma paráfrase resolutiva.
  - marker: b
    text: A mudança de “você” para “ela” está no testemunho traduzido e foi preservada; a relação exata entre as afirmações permanece incerta.
    reason: Sinaliza uma irregularidade relevante sem corrigi-la conjecturalmente.
  - marker: c
    text: “O selo da voz dela” é uma expressão obscura no testemunho; pode evocar uma marca, impressão ou sinal ligado à voz, mas o sentido exato é incerto.
    reason: Evita que uma imagem textualmente difícil pareça inequívoca em português.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional para as potências governantes desta obra, distinguindo-o do termo mais amplo “autoridades”, que também ocorre no trecho.
- source_word: soulish
  choice: psíquico
  rationale: Preserva a categoria antropológica técnica que contrasta com “espiritual”, sem reduzi-la ao sentido cotidiano de “emocional” ou normalizá-la como simples ausência de espírito.
- source_word: spiritual woman
  choice: mulher espiritual
  rationale: Reproduz de modo transparente a identificação da personagem e conserva o contraste explícito com o estado psíquico de Adão.
- source_word: female counterpart
  choice: contraparte feminina
  rationale: Evita identificar silenciosamente a figura com uma personagem específica e preserva a relação de correspondência expressa pelo testemunho.
- source_word: signet
  choice: selo
  rationale: Conserva a imagem de marca, impressão ou autenticação, embora a expressão completa permaneça obscura.
theological_decisions:
- issue: A proibição e a vontade do Pai
  choice: Preservar a afirmação de que a fala dos arcontes serviu à vontade do Pai para que Adão comesse.
  alternative: Harmonizar a passagem com Gênesis, apresentando a proibição como vontade direta e final de Deus.
  rationale: A inversão e a tensão teológica pertencem ao argumento próprio da obra e não devem ser resolvidas por harmonização denominacional.
- issue: Estado antropológico de Adão
  choice: “meramente psíquico”
  alternative: “apenas dotado de alma” ou “sem espírito”
  rationale: A formulação técnica preserva a provável distinção tripartida do texto sem explicitar além da evidência que Adão estivesse totalmente “sem espírito”.
- issue: Mudança de pessoa em “porque ela é minha mãe”
  choice: Manter a passagem da segunda para a terceira pessoa.
  alternative: Regularizar como “porque você é minha mãe”.
  rationale: A mudança consta do testemunho e pode refletir uma tensão textual ou discursiva genuína; corrigi-la apagaria essa ambiguidade.
- issue: Identidade da mulher espiritual
  choice: Não nomeá-la como Eva nem como outra entidade.
  alternative: Identificá-la explicitamente com Eva, Zoe ou uma figura de Sabedoria.
  rationale: Embora o contexto sugira associações, o trecho fornecido a chama apenas de “mulher espiritual”; uma identificação explícita importaria interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Foram mantidos os sinais críticos do testemunho — colchetes, colchetes vazios e sinais angulares — porque a revisão direta do copta ainda está pendente. A tradução é necessariamente provisória e fundamentada no testemunho inglês público fornecido; evita reconstruções não sustentadas e conserva as ambiguidades narrativas e teológicas.
