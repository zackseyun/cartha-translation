  terminology: «Arcontes», «autoridades», «psíquico», «mulher espiritual», «contraparte feminina» e «selo» são escolhas adequadas e coerentes. «Psíquico» requer e recebe nota explicativa. Não se deve identificar a mulher espiritual com uma personagem nomeada.
