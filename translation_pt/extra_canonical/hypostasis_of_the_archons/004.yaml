    rationale: No testemunho, «it» refere-se à «shadowy likeness of herself», apresentada imediatamente antes. Em português, «a» pode ser lido como referência à mulher espiritual. A explicitação de «essa semelhança» preserva o referente sem interpretar a imagem obscura.
  - severity: low
    issue: «os considerasse como os consideraria uma pessoa inteiramente material» é estruturalmente pesado.
    rationale: 'A formulação pode ser simplificada para «pensasse neles como pensaria um homem inteiramente material», preservando o sentido do testemunho: Adão não deveria concebê-los segundo a perspectiva de um humano plenamente material.'
