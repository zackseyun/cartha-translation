    issue: Aspecto verbal em «Caim cultivava a terra»
    rationale: A testemunha diz «Cain tilled the land» em sequência narrativa de ações concluídas. «Caim cultivou a terra» reproduz melhor esse aspecto sem alterar o sentido.
  - severity: low
    issue: Construção «deu [Sete] a Adão»
    rationale: Embora compreensível, a expressão é pouco natural em português. «Deu à luz [Sete] para Adão» conserva a formulação relacional da testemunha («bore [Seth] to Adam») e melhora a legibilidade.
