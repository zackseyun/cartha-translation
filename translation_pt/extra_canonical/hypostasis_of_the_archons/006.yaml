  naturalness: O registro é moderno, claro e digno. «Caim cultivou a terra» corresponde melhor à ação narrativa pontual da testemunha do que o imperfeito «cultivava». «Deu à luz [Sete] para Adão» é mais idiomático e mantém a orientação relacional incomum do texto-fonte.
  terminology: «Carnal», «guardião», «contraparte feminina», «forças» e «profanaram» preservam, sem especificação doutrinária, os termos potencialmente técnicos ou ambíguos da testemunha. Os nomes Caim, Abel, Sete, Eva, Adão e Norea foram mantidos de modo consistente.
  issues:
