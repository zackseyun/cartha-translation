  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se as repetições narrativas, as expressões incomuns e todos os colchetes de restauração da testemunha. Como a revisão direta do copta ainda está pendente, esta versão é provisória e se baseia prioritariamente na evidência disponibilizada da testemunha inglesa pública, consultando a POB inglesa apenas como camada auditada.
