lexical_decisions:
- source_word: knew
  choice: conheceu / [conhecer]
  rationale: Preserva o eufemismo bíblico para a união sexual e mantém os colchetes onde a testemunha indica restauração textual.
- source_word: fleshly
  choice: carnal
  rationale: Mantém a caracterização antropológica e possivelmente teológica do texto, sem reduzi-la simplesmente a 'físico' ou interpretá-la como 'pecaminoso'.
- source_word: keeper
  choice: guardião
  rationale: Expressa responsabilidade de cuidado e vigilância em português natural, preservando a força da pergunta retórica.
- source_word: female counterpart
  choice: contraparte feminina
  rationale: Conserva a formulação incomum da testemunha, em vez de normalizá-la apenas como 'mulher' ou 'esposa'.
- source_word: forces
  choice: forças
  rationale: Preserva a designação ampla das potências hostis no contexto do escrito, sem impor uma identificação mais específica.
- source_word: defile
  choice: profanaram
  rationale: Retém a possível dimensão ritual, sexual e espiritual do verbo, sem resolver a ambiguidade em favor de apenas uma delas.
- source_word: progress
  choice: progredir
  rationale: Mantém a ideia positiva ou desenvolvimental da testemunha, distinguindo-a de mera expansão numérica.
theological_decisions:
- issue: Identidade de Deus na narrativa de Caim e Abel
  choice: Deus
  alternative: o governante / o arconte
  rationale: A testemunha fornecida diz 'God'; sem revisão direta do copta, não se deve inserir uma identificação cosmológica mais específica.
- issue: Sentido da frase 'You have sinned with your mouth'
  choice: Você pecou com a sua boca
  alternative: O pecado está à porta / Você pecou ao falar
  rationale: A formulação estranha foi preservada porque pode refletir uma variante ou releitura deliberada, e não deve ser harmonizada silenciosamente com Gênesis.
- issue: Ação de Norea em favor das gerações humanas
  choice: ajudar muitas gerações de seres humanos
  alternative: servir às muitas gerações da humanidade
  rationale: Mantém a finalidade e o alcance intergeracional sem definir em que consiste essa ajuda.
- issue: Agente de 'Ele gerou'
  choice: Ele
  alternative: Deus
  rationale: O pronome foi preservado para não resolver uma referência que a testemunha deixa implícita.
