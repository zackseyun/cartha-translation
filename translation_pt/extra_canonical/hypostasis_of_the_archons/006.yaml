    Deus disse a Caim: “Escute! A voz do sangue do seu irmão clama a mim. Você pecou com a sua boca. Isso voltará sobre você. Quem matar Caim desencadeará sete vinganças, e você viverá gemendo e tremendo sobre a terra.”



    Adão tornou a [conhecer] sua contraparte feminina, Eva, e ela engravidou e deu à luz [Sete] para Adão. Ela disse: “Por meio de Deus, dei à luz [outro] homem para substituir [Abel].”



    Eva tornou a engravidar e deu à luz [Norea]. Eva disse: “Ele gerou para mim uma virgem, a fim de ajudar muitas gerações de seres humanos.”[a] Ela é a virgem que as forças não macularam.



