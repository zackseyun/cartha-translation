translation:
  language: pt
  text: 'O líder deles é cego. [Por causa de seu] poder, ignorância e orgulho, declarou em seu [poder]: “Eu sou Deus; não há nenhum outro [além de mim]”.


    Quando disse isso, pecou contra [o Todo].[a] Essa vanglória subiu até a Indestrutibilidade, [].[b] Então, da Indestrutibilidade, uma voz respondeu: “Você está enganado, Samael” — nome que significa “deus cego” —, pois os pensamentos dele eram cegos. Ele descarregou seu poder, isto é, a blasfêmia que havia proferido, e a seguiu para baixo, até o Caos e até sua mãe, o Abismo, por impulso de Pistis Sophia.[c] Ela estabeleceu cada um dos descendentes dele de acordo com seu poder, à semelhança dos elevados éons eternos,[d] porque o que se vê teve origem no que não se vê.


    A Indestrutibilidade olhou para baixo, para o lugar das águas. Sua imagem apareceu como reflexo sobre as águas, e as autoridades das trevas se apaixonaram por ela. Contudo, não conseguiram reter a imagem que lhes aparecera sobre as águas, porque eram fracas. E aquilo que é meramente psíquico não consegue reter o que é espiritual,[e] pois as autoridades tiveram origem embaixo, enquanto a imagem da Indestrutibilidade teve origem no alto.


    Por isso, a Indestrutibilidade olhou para baixo, para aquele lugar, a fim de que, pela vontade do Pai, pudesse unir todos eles à luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “O Todo” é um título cosmológico abrangente; o texto não explicita aqui seu referente exato.
    reason: Preservar a ambiguidade de um termo técnico sem inserir identificação teológica.
  - marker: b
    text: O sinal [.] representa uma lacuna no testemunho textual fornecido.
    reason: Registrar de modo transparente a ausência de texto preservada no material de base.
  - marker: c
    text: 'A construção é difícil: “a” pode retomar o poder ou a blasfêmia, e a relação exata de Pistis Sophia com a descida não é totalmente clara no testemunho disponível.'
    reason: Sinalizar ambiguidades sintáticas que não devem ser resolvidas sem revisão direta do copta.
  - marker: d
    text: “Éons” designa aqui realidades ou entidades eternas do mundo superior, não apenas períodos de tempo.
    reason: Esclarecer um termo cosmológico técnico pouco familiar ao leitor comum.
  - marker: e
    text: “Psíquico” traduz uma categoria ligada à alma, em contraste com o “espiritual”; não significa simplesmente “mental” ou “psicológico” no sentido moderno.
    reason: Evitar uma leitura moderna enganosa do vocabulário técnico.
lexical_decisions:
- source_word: indestructability
  choice: Indestrutibilidade
  rationale: Mantém a personificação de uma realidade transcendente e reproduz o sentido do testemunho sem substituí-lo por um termo doutrinariamente mais carregado, como “incorruptibilidade”.
- source_word: the All
  choice: o Todo
  rationale: Preserva o título cosmológico abrangente e sua ambiguidade, em vez de explicá-lo como referência direta a Deus ou à criação.
- source_word: Chaos
  choice: Caos
  rationale: Usado como nome próprio do domínio cosmológico, conforme o contexto.
- source_word: Abyss
  choice: Abismo
  rationale: Mantém o caráter personificado e cosmológico do termo, assinalado pela inicial maiúscula.
- source_word: Pistis Sophia
  choice: Pistis Sophia
  rationale: Conserva o nome técnico tradicional sem traduzir seletivamente seus componentes gregos como “Fé Sabedoria”.
- source_word: aeons
  choice: éons
  rationale: Emprega a transliteração corrente para as entidades ou realidades eternas da cosmologia do escrito, evitando reduzi-las simplesmente a “eras”.
- source_word: soulish
  choice: psíquico
  rationale: Preserva o contraste técnico entre o âmbito psíquico e o espiritual; “da alma” poderia sugerir uma formulação antropológica mais comum e perder a categoria cosmológica.
- source_word: authorities
  choice: autoridades
  rationale: Tradução formal que preserva a designação dos poderes cósmicos sem importar o termo interpretativo “arcontes” onde o testemunho apresentado diz “authorities”.
theological_decisions:
- issue: Identidade de “o Todo”
  choice: Manter “o Todo” como título não explicado
  alternative: Explicitar como “Deus”, “a Plenitude” ou “tudo o que existe”
  rationale: O testemunho deixa a referência como título cosmológico; explicitá-la resolveria indevidamente uma questão interpretativa.
- issue: Personificação da Indestrutibilidade
  choice: Usar inicial maiúscula e pronomes femininos
  alternative: Tratar como qualidade abstrata impessoal
  rationale: A entidade olha, fala por meio de uma voz e possui uma imagem; a tradução preserva essa personificação e o gênero gramatical português.
- issue: Relação entre o psíquico e o espiritual
  choice: Conservar o contraste técnico sem paráfrase doutrinária
  alternative: Interpretar como oposição entre pessoas “naturais” e “espirituais”
  rationale: O trecho apresenta categorias cosmológicas; uma aplicação antropológica ou confessional iria além do texto fornecido.
- issue: Agente e referente em “he followed it down”
  choice: Traduzir literalmente como “a seguiu para baixo”, com nota sobre a ambiguidade
  alternative: Determinar que ele seguiu “a blasfêmia”, “seu poder” ou que foi lançado para baixo
  rationale: A sintaxe do testemunho é difícil, e a evidência copta direta ainda aguarda revisão; a tradução não deve eliminar a tensão.
- issue: Finalidade da descida da Indestrutibilidade
  choice: “pudesse unir todos eles à luz”
  alternative: “os reunisse todos na luz” ou identificar explicitamente os referentes
  rationale: Mantém tanto o objeto pronominal quanto a relação com a luz sem definir além do testemunho quem está incluído em “todos eles”.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se os colchetes das restaurações do testemunho e a marca de lacuna, distinguindo-os das notas alfabéticas. A redação é provisória porque a base fornecida é uma tradução inglesa de domínio público e a revisão direta do copta do Códice de Nag Hammadi II,4 ainda está pendente.
