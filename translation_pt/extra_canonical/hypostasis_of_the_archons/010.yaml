translation:
  language: pt
  text: 'Eu disse: “Meu Senhor, instrui-me acerca do [poder destas] autoridades. [Como] vieram a existir? De que espécie de substância e de que [] matéria são? Quem as criou, e de onde vem a força delas?”[a]


    O grande anjo Eleleth, que é Sabedoria, disse-me: “A Indestrutibilidade habita em éons infinitos. Sophia, chamada Pistis, desejou criar algo por si mesma, sem seu companheiro, e aquilo que ela produziu teve origem no alto.


    “Há um véu entre o mundo superior e os éons de baixo. Debaixo do véu surgiu uma sombra; a sombra tornou-se matéria e caiu num lugar à parte.


    “Aquilo que ela havia produzido desenvolveu-se em algo material, semelhante a um feto abortado. Sua forma foi moldada a partir da sombra, e ele se tornou uma fera arrogante, semelhante a um leão. Era andrógino, como mencionei antes, porque se originara da matéria.


    “Ele abriu os olhos e contemplou uma quantidade imensa e ilimitada de matéria. Então se encheu de arrogância e disse: ‘Eu sou Deus, e nada existe além de mim.’


    “Ao dizer isso, pecou contra o Todo. E uma voz veio do alto, acima do lugar do domínio supremo,[b] dizendo: ‘Você está enganado, Samael’ — nome que significa ‘deus cego’.


    “Ele disse: ‘Se alguma outra coisa existe antes de mim, que se mostre a mim.’


    “Imediatamente, Sophia estendeu o dedo e introduziu luz na matéria; depois, acompanhou-a para baixo, até o lugar do caos. Então voltou para o alto, para sua luz, enquanto a escuridão novamente [caía sobre] a matéria.


    “Esse arconte, sendo andrógino, fez para si um vasto reino, uma extensão ilimitada.


    “[] Ele pensou em gerar descendentes para si e criou sete descendentes, andróginos como seu progenitor.


    “Ele disse aos seus descendentes: ‘Eu sou o Deus do Todo.’


    “Zoe, filha de Pistis Sophia, clamou e lhe disse: ‘Você está enganado, Sakla’ — cujo outro nome é Yaldabaoth. Zoe soprou no rosto dele, e o sopro dela tornou-se para ela um anjo de fogo. Esse anjo amarrou Yaldabaoth e o lançou no Tártaro, abaixo do abismo.”


    [a] O testemunho preserva aqui uma indicação de página do manuscrito, “[5]”, omitida do corpo da tradução.

    [b] O testemunho preserva aqui a indicação de página “[6]”, também omitida do corpo da tradução.'
