lexical_decisions:
- source_word: authorities / archon
  choice: autoridades / arconte
  rationale: “Autoridades” preserva o termo usado na pergunta inicial, enquanto “arconte” mantém o título técnico da tradição gnóstica na referência singular posterior.
- source_word: Indestructibility
  choice: Indestrutibilidade
  rationale: A inicial maiúscula conserva o caráter personificado ou hipostático possível do termo sem defini-lo além do testemunho.
- source_word: aeons
  choice: éons
  rationale: Transliteração já estabelecida em português para o termo cosmológico, evitando reduzi-lo simplesmente a “eras” ou “mundos”.
- source_word: Sophia / Pistis / Zoe
  choice: Sophia / Pistis / Zoe
  rationale: Os nomes gregos são mantidos como nomes próprios; seus sentidos não são inseridos no texto quando o testemunho não os explica nesse ponto.
- source_word: the All
  choice: o Todo
  rationale: Preserva a expressão cosmológica abrangente e sua possível dimensão hipostática.
- source_word: androgynous
  choice: andrógino
  rationale: Tradução direta que conserva a caracterização dupla sem paráfrase interpretativa.
- source_word: Tartaros
  choice: Tártaro
  rationale: Forma portuguesa tradicional do nome do lugar mitológico e cosmológico.
- source_word: breath / breathed
  choice: sopro / soprou
  rationale: Mantém a ligação lexical entre a ação de Zoe e a entidade que dela resulta, sem decidir entre “respiração”, “sopro” e “espírito” como categorias teológicas.
theological_decisions:
- issue: Identificação de Eleleth com Sabedoria
  choice: “Eleleth, que é Sabedoria”
  alternative: “Eleleth, o da Sabedoria”
  rationale: Segue a relação explícita do testemunho, preservando a identificação sem elaborar sua ontologia.
- issue: Criação independente de Sophia
  choice: “por si mesma, sem seu companheiro”
  alternative: “independentemente, à parte de seu parceiro”
  rationale: Expressa tanto a iniciativa independente quanto a separação do consorte, sem acrescentar juízo moral.
- issue: Origem do produto de Sophia
  choice: “teve origem no alto”
  alternative: “originou-se de cima”
  rationale: Mantém a afirmação espacial/cosmológica deliberadamente ampla.
- issue: Pecado contra o Todo
  choice: “pecou contra o Todo”
  alternative: “cometeu pecado contra a Totalidade”
  rationale: Conserva a tensão teológica e a terminologia do testemunho sem explicar a natureza do pecado.
- issue: Sentido do nome Samael
  choice: “nome que significa ‘deus cego’”
  alternative: “isto é, ‘deus dos cegos’”
  rationale: Segue exatamente a glosa fornecida pelo testemunho, embora outras análises etimológicas sejam possíveis.
- issue: Gênero do produto andrógino
  choice: Transição de “algo” para o pronome masculino “ele”
  alternative: Manter construções neutras ou impessoais
  rationale: Reproduz a mudança narrativa do produto material para a figura pessoal que fala e age, sem apagar sua androginia.
- issue: Agência da luz na descida
  choice: “acompanhou-a para baixo”
  alternative: “perseguiu-a para baixo”
  rationale: O referente e a nuance do verbo no testemunho são incertos; “acompanhou-a” mantém Sophia seguindo a luz sem sugerir hostilidade indevida.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Termos técnicos essenciais da cosmologia gnóstica — “éons”, “arconte”, “o Todo” — foram preservados. Colchetes internos mantêm sinais de restauração ou lacuna do testemunho. Como a revisão direta do copta ainda está pendente, decisões que dependem da sintaxe ou lexicografia copta permanecem provisórias.
