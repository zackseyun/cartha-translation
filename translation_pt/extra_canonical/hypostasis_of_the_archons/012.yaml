  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: pt
  text: 'Eu disse: “Meu Senhor, eu também venho da matéria deles?”


    “Você e seus descendentes vêm do Pai, que existia desde o princípio.


    “As almas vêm do alto, da luz indestrutível. Por isso, as autoridades não podem se aproximar delas, pois o espírito da verdade está dentro delas. E todo aquele que conhece este caminho da verdade será imortal entre os seres humanos mortais.


    “Contudo, essa semente ainda não será conhecida. Ela será conhecida depois de três eras e, então, os libertará da escravidão ao erro das autoridades.”


    Perguntei: “Meu Senhor, quanto tempo falta para que isso aconteça?”


    Ele me disse: “Até o momento em que o Homem Verdadeiro, em uma substância moldável[a], revelar [o espírito da] verdade que o Pai enviou.


    “[...][b] Então ele os instruirá a respeito de todas as coisas e os ungirá com o óleo da vida eterna, concedido a ele pela geração sem rei.


    “Então eles serão libertados do pensamento cego. Pisarão sobre a morte, que vem das autoridades, e subirão à luz infinita, onde habita essa semente.


    “Então as autoridades abrirão mão dos tempos que lhes foram concedidos. Seus anjos chorarão por causa da destruição delas, e seus demônios se lamentarão por causa da morte delas.


    “Então todos os filhos da luz conhecerão verdadeiramente a verdade, sua raiz, o Pai do Todo e o Espírito Santo. Todos proclamarão a uma só voz: ‘A verdade do Pai é justa. O Filho reina sobre o Todo’. E de todos virá esta proclamação: ‘Para todo o sempre, santo, santo, santo! Amém’.”


    A Substância dos Governantes


    [a] Ou “matéria moldável”; o termo é o empréstimo grego plasma.


    [b] Há uma lacuna no manuscrito neste ponto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “matéria moldável”; o termo é o empréstimo grego plasma.
    reason: Registra a forma lexical incomum e uma alternativa sem sobrecarregar o texto principal.
  - marker: b
    text: Há uma lacuna no manuscrito neste ponto.
    reason: Representa explicitamente a indicação de perda textual presente no testemunho, sem conjecturar conteúdo.
lexical_decisions:
- source_word: hyle
  choice: matéria
  rationale: Mantém o sentido concreto de matéria ou substância material, central à pergunta de Norea.
- source_word: archons / authorities
  choice: autoridades; no título, Governantes
  rationale: “Autoridades” é natural no corpo do texto e preserva a função dominadora do termo; “Governantes” no título identifica de modo claro os arcontes sem recorrer ao tecnicismo pouco acessível “arcontes”.
- source_word: plasma
  choice: substância moldável
  rationale: Preserva a ideia de material que pode receber forma; a nota registra a alternativa “matéria moldável” e o empréstimo grego.
- source_word: kingless generation
  choice: geração sem rei
  rationale: Tradução transparente que conserva a expressão incomum e sua possível carga teológica sem explicá-la ou normalizá-la.
- source_word: the All
  choice: o Todo
  rationale: Mantém o uso substantivado e cosmológico da expressão, sem reduzi-la simplesmente a “todas as coisas”.
- source_word: deathless
  choice: imortal
  rationale: É a forma portuguesa natural para a condição de não estar sujeito à morte, mantendo o contraste explícito com os humanos mortais.
theological_decisions:
- issue: Identidade do “Homem Verdadeiro”
  choice: Homem Verdadeiro, com iniciais maiúsculas
  alternative: homem verdadeiro
  rationale: A formulação parece funcionar como designação titular, mas não foi identificada explicitamente com uma figura doutrinária posterior.
- issue: Restauração em “[o espírito da] verdade”
  choice: Preservar os colchetes
  alternative: Incorporar “o espírito da” sem marcação ou omitir a restauração
  rationale: Os colchetes deixam claro que essas palavras são uma restauração editorial e preservam a incerteza textual.
- issue: Referente de “os libertará”
  choice: Manter o pronome sem explicitar o referente
  alternative: Substituir por “libertará os descendentes” ou “libertará as almas”
  rationale: O referente permanece potencialmente ambíguo no testemunho fornecido; explicitá-lo resolveria indevidamente a tensão.
- issue: “tempos” das autoridades
  choice: “abrirão mão dos tempos que lhes foram concedidos”
  alternative: “renunciarão às suas eras”
  rationale: Conserva a linguagem temporal e torna inteligível a ideia de períodos atribuídos às autoridades sem definir sua natureza escatológica.
- issue: Gênero dos pronomes em destruição e morte
  choice: Referir “delas” às autoridades
  alternative: Entender a destruição e a morte como pertencentes aos anjos e demônios
  rationale: A sintaxe do testemunho favorece as autoridades como referente, embora o contexto permaneça denso; a tradução evita ampliação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução é provisória e baseada no testemunho inglês público fornecido; a revisão direta do copta do Códice de Nag Hammadi II,4 ainda está pendente. Preservaram-se a restauração editorial entre colchetes, a lacuna e expressões cosmológicas incomuns, evitando harmonização confessional.
