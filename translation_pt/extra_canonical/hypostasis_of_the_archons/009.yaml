base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: pt
  text: 'O anjo disse: “Sou eu, Eleleth, o grande anjo Sabedoria, que está diante do Espírito santo. Fui enviado para falar com você, salvá-la[a] das mãos dos que não têm lei e instruí-la a respeito de sua raiz.”


    Quanto àquele anjo, não sou capaz de descrever seu poder. Sua aparência é semelhante ao ouro fino, e sua veste, à neve. Minha boca realmente não é capaz de descrever seu poder nem a aparência de seu rosto.


    O grande anjo Eleleth falou comigo e disse: “Eu sou a Sabedoria, um dos Quatro Luminares[b] que estão diante do grande Espírito invisível. Você realmente imagina que esses arcontes[c] podem exercer algum poder sobre você? Nenhum deles será capaz de vencer a raiz da verdade, pois ele[d] apareceu nos últimos dias por causa da raiz da verdade, e essas autoridades serão confinadas. Além disso, essas autoridades não poderão contaminar você nem aquela geração, porque sua morada está na incorruptibilidade[e], onde habita o Espírito virgem, que está acima das autoridades do caos e do mundo delas.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A interlocutora é feminina no contexto narrativo; o testemunho inglês, por si só, não marca o gênero de “you”.
    reason: Tornar transparente uma informação contextual necessária para a concordância em português.
  - marker: b
    text: “Luminares” traduz “Lights” como título de quatro seres ou potências celestes.
    reason: Esclarecer o emprego técnico de uma palavra que também pode designar luz física.
  - marker: c
    text: “Arcontes” significa literalmente “governantes” ou “autoridades”; aqui é um termo técnico para poderes cósmicos do relato.
    reason: Facilitar a compreensão sem apagar a terminologia própria da obra.
  - marker: d
    text: O referente de “ele” não é claro no testemunho disponível; pode estar relacionado à “raiz da verdade” ou a outra figura pressuposta pelo contexto.
    reason: Preservar e sinalizar uma ambiguidade real do texto-base disponível.
  - marker: e
    text: 'Ou: “indestrutibilidade”. A expressão designa um domínio ou estado que não pode ser destruído nem corrompido.'
    reason: Registrar uma alternativa lexical plausível para o substantivo abstrato.
lexical_decisions:
- source_word: Wisdom
  choice: Sabedoria
  rationale: Preserva o título personificado do testemunho e sua associação conceitual com a figura angélica, sem tentar harmonizá-lo com terminologia de uma tradição específica.
- source_word: Four Lights
  choice: Quatro Luminares
  rationale: “Luminares” soa natural como título de seres celestes e evita reduzir a expressão a quatro luzes meramente físicas.
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico do ambiente cosmológico do escrito; a nota esclarece seu sentido básico como governantes ou poderes.
- source_word: root
  choice: raiz
  rationale: Conserva a metáfora reiterada e deliberadamente enigmática, sem substituí-la por “origem”, “linhagem” ou outra interpretação.
- source_word: indestructibility
  choice: incorruptibilidade
  rationale: Expressa um domínio ou estado imperecível em linguagem religiosa portuguesa corrente, preservando o caráter abstrato do termo.
- source_word: virgin Spirit
  choice: Espírito virgem
  rationale: Mantém a formulação incomum e sua ambiguidade em vez de convertê-la em um título teológico mais familiar.
- source_word: lawless
  choice: os que não têm lei
  rationale: Reproduz o sentido literal e moral sem impor a leitura mais estreita de “criminosos”.
theological_decisions:
- issue: Identidade gramatical do referente que apareceu nos últimos dias
  choice: “ele” no texto, acompanhado de nota de ambiguidade
  alternative: Explicitar “a raiz da verdade”, “o da verdade” ou outro referente interpretado
  rationale: O testemunho fornecido traz um pronome masculino cujo antecedente não é inequívoco; a tradução preserva essa tensão em vez de resolvê-la silenciosamente.
- issue: Relação entre Eleleth e a Sabedoria
  choice: Tratar “Sabedoria” como autodesignação/título de Eleleth
  alternative: Reformular como “anjo da Sabedoria”
  rationale: A construção do testemunho identifica diretamente o anjo com Sabedoria; inserir “da” alteraria essa identificação.
- issue: Poder dos arcontes sobre a interlocutora
  choice: Preservar a pergunta retórica e o quantificador indefinido “algum poder”
  alternative: Declarar categoricamente que os arcontes não têm poder algum
  rationale: A pergunta seguida da explicação conserva o movimento argumentativo e não antecipa uma conclusão mais absoluta do que a formulação recebida.
- issue: “Aquela geração”
  choice: Manter o demonstrativo “aquela”
  alternative: “Sua geração” ou “essa geração”
  rationale: O referente e a distância discursiva são incertos; a formulação preserva o demonstrativo do testemunho sem identificar a geração.
- issue: Gênero da pessoa interpelada
  choice: Empregar formas femininas na tradução e registrar a dependência do contexto narrativo
  alternative: Usar masculino genérico ou reestruturar todas as frases para evitar gênero
  rationale: O episódio se dirige a uma interlocutora feminina no contexto da obra, embora o português exija escolhas que o “you” inglês isoladamente não mostra.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução é provisória porque a base fornecida é um testemunho inglês de domínio público e a revisão direta do copta do Códice de Nag Hammadi II,4 ainda está pendente. Foram preservados termos cosmológicos importantes, repetições retóricas e ambiguidades de referente, com notas breves onde o português exigiu explicitação.
