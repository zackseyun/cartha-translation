translation:
  language: pt
  text: 'Então, a natureza espiritual feminina veio sob a aparência da serpente, a instrutora. A serpente instruiu Adão e Eva e disse: “O que Samael [disse a] vocês? Foi isto que ele disse: ‘Vocês podem comer de todas as árvores do jardim, mas não comam [da árvore] do conhecimento do bem e do mal’?”[a]


    A mulher carnal disse: “Ele não disse apenas: ‘Não comam’, mas também: ‘Não toquem nela, pois, no dia em que comerem dela, certamente morrerão’”.


    A serpente, a instrutora, disse: “Certamente vocês não morrerão, pois ele lhes disse isso movido por ciúme. Pelo contrário, os olhos de vocês se abrirão, e vocês se tornarão como deuses, conhecendo o bem e o mal”. Então, a natureza feminina que instruía afastou-se da serpente e a abandonou como se ela fosse algo terreno.


    A mulher carnal tomou do fruto da árvore e comeu. Deu também a seu marido, e assim comeram, eles que eram meramente psíquicos.[b] Sua imperfeição foi revelada pela falta de conhecimento. Perceberam que haviam sido despojados do que era espiritual; então pegaram folhas de figueira e as prenderam ao redor dos quadris nus.


    Sem saber o que havia acontecido, o chefe dos arcontes chegou e disse: “Adão, onde você está?”


    Adão respondeu: “Ouvi a tua voz e fiquei com medo porque estava nu; por isso me escondi”.


    O arconte disse: “Por que você se escondeu, senão porque comeu da única árvore da qual eu o proibi de comer? Você comeu dela!”


    Adão respondeu: “A mulher que me deste [entregou] o fruto, e eu comi”.


    Então o arrogante [arconte] amaldiçoou a mulher.


    A mulher disse: “A serpente me enganou, e por isso comi”.


    [Os arcontes voltaram-se] para a serpente, amaldiçoaram sua sombra e [a fizeram] enfraquecer.


    Eles não sabiam que aquela era a mesma forma que haviam modelado. Desde então, a serpente ficou sob a maldição das autoridades, que duraria [—] até a vinda do Homem Perfeito.[c]


    Voltaram-se para o Adão deles e o expulsaram do jardim junto com sua mulher. Não possuíam bênção alguma, pois eles também estavam sob a maldição.


    Lançaram a humanidade numa imensa confusão e numa vida de trabalho, para que a humanidade deles se ocupasse das coisas do mundo e não tivesse tempo de se ocupar do Espírito santo.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes em “[disse a]” e “[da árvore]” indicam palavras supridas na reconstrução do texto. A abertura deste diálogo apresenta dano ou lacuna no manuscrito.
    reason: Preservar de modo legível os sinais de restauração e dano transmitidos pelo testemunho.
  - marker: b
    text: Aqui, “psíquicos” significa seres pertencentes apenas ao âmbito da alma, em contraste com o espiritual; não tem o sentido moderno de fenômenos paranormais.
    reason: Esclarecer um termo antropológico técnico que pode ser mal interpretado por leitores atuais.
  - marker: c
    text: Há uma lacuna no manuscrito antes de “até a vinda do Homem Perfeito”; a ligação sintática foi vertida de modo provisório.
    reason: Sinalizar dano textual que afeta a duração e a construção da frase.
  - marker: d
    text: A tradução foi preparada provisoriamente a partir do testemunho inglês público fornecido. A revisão direta do texto copta do Códice II de Nag Hammadi ainda está pendente.
    reason: Declarar com transparência a base documental e o grau de certeza do rascunho.
lexical_decisions:
- source_word: female spiritual nature
  choice: natureza espiritual feminina
  rationale: Preserva a personificação feminina e a categoria ontológica do testemunho, sem reduzi-la simplesmente a uma mulher ou entidade nomeada.
- source_word: the teacher / teaching nature
  choice: a instrutora / a natureza feminina que instruía
  rationale: O feminino concorda com serpente em português e mantém a função pedagógica; a segunda formulação evita o pouco natural 'natureza docente'.
- source_word: fleshly woman
  choice: mulher carnal
  rationale: Mantém o contraste deliberado entre o carnal e o espiritual, importante para a antropologia do escrito.
- source_word: merely soulish
  choice: meramente psíquicos
  rationale: '''Psíquicos'' preserva a categoria técnica ligada à alma e sua oposição ao espiritual; uma nota evita a leitura moderna exclusivamente psicológica.'
- source_word: archon(s)
  choice: arconte(s)
  rationale: Emprega a transliteração consagrada para os governantes cósmicos deste texto, em vez de substituir a categoria por um termo interpretativo.
- source_word: authorities
  choice: autoridades
  rationale: Distingue o termo de 'arcontes' no português, como faz o testemunho disponível, sem presumir identidade lexical no copta ainda não revisto.
- source_word: Perfect Man
  choice: Homem Perfeito
  rationale: Conserva o título e sua carga antropológica/salvífica, com iniciais maiúsculas.
- source_word: holy Spirit
  choice: Espírito santo
  rationale: Mantém a referência espiritual personificada ou elevada, mas evita impor a capitalização cristã tradicional completa a uma expressão cuja análise copta está pendente.
theological_decisions:
- issue: Papel da serpente
  choice: Preservar sua apresentação como instrutora e veículo temporário da natureza espiritual feminina
  alternative: Harmonizá-la com a identificação bíblica tradicional da serpente como inteiramente maligna
  rationale: O trecho reinterpreta deliberadamente a narrativa do Gênesis; harmonizá-lo apagaria sua tensão teológica própria.
- issue: Motivo de Samael
  choice: Traduzir como ciúme
  alternative: inveja
  rationale: '''Ciúme'' comunica a tentativa de reter prerrogativas e corresponde diretamente ao testemunho inglês; ''inveja'' continua semanticamente possível, mas não deve substituir a nuance sem revisão do copta.'
- issue: Condição de Adão e Eva após comer
  choice: Eles percebem ter sido despojados do que era espiritual
  alternative: Eles adquirem a espiritualidade ou simplesmente percebem a nudez física
  rationale: A escolha preserva a formulação paradoxal e a antropologia do documento, sem harmonização com Gênesis.
- issue: Identidade do Homem Perfeito
  choice: Manter o título sem identificar seu referente
  alternative: Identificá-lo explicitamente com Cristo ou outra figura
  rationale: O excerto isolado não autoriza resolver a identidade no corpo da tradução.
- issue: Espírito santo
  choice: Manter a expressão sem explicação trinitária
  alternative: Interpretá-la explicitamente como a terceira pessoa da Trindade
  rationale: Essa leitura denominacional não deve ser importada para um escrito gnóstico antigo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se termos técnicos indispensáveis — “arconte” e “psíquicos” — acompanhados de esclarecimento quando necessário. As restaurações foram conservadas entre colchetes; uma lacuna foi marcada por [—]. Evitaram-se harmonizações com Gênesis e definições confessionais não exigidas pelo trecho.
