lexical_decisions:
- source_word: generation
  choice: geração
  rationale: Preserva o termo recorrente e sua possível dimensão coletiva, genealógica e espiritual, sem reduzir o sentido a um grupo específico.
- source_word: realm
  choice: domínio
  rationale: Distingue o termo de “reino” e mantém sua possível referência cosmológica a uma esfera ou ordem.
- source_word: ruler
  choice: governante
  rationale: Mantém a designação funcional sem importar o termo técnico denominacional “arconte”, embora este possa estar por trás do testemunho.
- source_word: seed
  choice: descendência
  rationale: Expressa em português natural o possível sentido de linhagem, com nota registrando a imagem literal de “semente”.
- source_word: taken up / ascend
  choice: ser elevadas / subir
  rationale: Preserva a linguagem espacial do testemunho e evita especificar destino ou agente onde o texto não o faz.
- source_word: great people
  choice: pessoas importantes
  rationale: Oferece leitura portuguesa inteligível, mas registra em nota a alternativa literal “pessoas grandes” devido à incerteza.
- source_word: roof of greenery
  choice: teto de folhagem
  rationale: Conserva a imagem incomum de cobertura vegetal em linguagem natural.
theological_decisions:
- issue: Destino das almas e natureza da geração santa
  choice: Manter as afirmações tal como aparecem, sem harmonização com textos canônicos ou sistemas posteriores.
  alternative: Explicar “viver”, “ser elevadas” e “geração santa” segundo uma doutrina definida de salvação.
  rationale: O trecho contém sua própria cosmologia e tensão teológica; explicitá-la doutrinariamente excederia a evidência fornecida.
- issue: Identidade do “décimo terceiro demônio”
  choice: Traduzir o testemunho por “décimo terceiro demônio”, com alternativa em nota.
  alternative: Usar apenas “décimo terceiro espírito”.
  rationale: A tradução-base favorece “demon”, mas a ambiguidade lexical indicada na tradição de tradução merece ser preservada até revisão copta direta.
- issue: A mão que criou os humanos mortais
  choice: Preservar a formulação sem identificar seu agente.
  alternative: Identificar a “mão” com Deus, um demiurgo ou governantes cósmicos.
  rationale: O fragmento não fornece base segura para resolver a identidade do criador mencionado.
- issue: Judas governará sobre as gerações
  choice: Manter “governarás sobre elas”.
  alternative: Interpretar como superioridade espiritual, condenação ou triunfo escatológico específico.
  rationale: A afirmação é tensionada pela maldição de Judas e por sua exclusão da geração santa; a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de segunda pessoa singular (“tu”) para conservar a distinção de interlocutor e um tom antigo moderado. Colchetes e reticências preservam restaurações e danos indicados no testemunho. Trata-se de versão provisória baseada no testemunho inglês público fornecido; a revisão direta do copta do Codex Tchacos 3 permanece pendente.
