  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: pt
  text: 'Quando Jesus [disse] essas coisas, partiu, [levando] consigo Judas Iscariotes. Ele lhe disse: “A água que está na montanha elevada vem [de] […]. Ela não veio para [regar… o poço] da árvore [do fruto…] deste domínio […] depois de algum tempo […], mas veio regar o paraíso de Deus e o [fruto] duradouro, porque [ela] não corromperá o [modo de vida] daquela geração, mas [existirá] por toda a eternidade.”[a]


    Judas lhe disse: “[Diga]-me: que tipo de fruto esta geração produz?”


    Jesus disse: “As almas de todas as gerações humanas morrerão. No entanto, quando essas pessoas tiverem completado seu tempo no reino e o espírito as deixar, seus corpos morrerão, mas suas almas viverão e serão elevadas.”


    Judas disse: “O que farão as demais gerações humanas?”


    Jesus disse: “Não é possível semear sobre a [rocha] e colher seu fruto. Do mesmo modo, [não é possível semear sobre] a raça [corrompida], juntamente com a sabedoria perecível [e] a mão que criou os seres humanos mortais, para que suas almas possam subir aos domínios superiores. [Em verdade] lhe digo: [nenhum governante], anjo [ou] poder será capaz de ver os [lugares] que [esta grande] e santa geração [verá].” Quando Jesus disse isso, partiu.


    Judas disse: “Mestre, assim como escutaste todos eles, escuta-me também agora, pois tive uma grande visão.”


    Ao ouvir isso, porém, Jesus riu. Ele lhe disse: “Por que estás tão agitado, décimo terceiro demônio? Mas fala, e eu te suportarei.”[b]


    Judas lhe disse: “Na visão, eu vi a mim mesmo. Os doze discípulos me apedrejavam e me perseguiam [depressa]. Também cheguei ao lugar onde [eu te havia seguido]. Vi [uma casa naquele lugar], e meus olhos não conseguiam [medir] seu tamanho. Pessoas importantes a rodeavam, e aquela casa tinha um teto de folhagem. No meio da casa havia [uma multidão…]. Mestre, recebe-me entre essas pessoas!”[c]


    [Jesus] respondeu: “Tua estrela te desencaminhou, Judas”, e acrescentou: “Nenhuma pessoa nascida mortal é digna de entrar na casa que viste, pois aquele lugar está reservado aos santos. Nem o sol, nem a lua, nem o dia governarão ali; os santos, porém, permanecerão para sempre naquele domínio com os santos anjos. Vê: eu te contei os mistérios do reino e te ensinei sobre o erro das estrelas e […] enviado [ao alto] sobre os doze domínios.”[d]


    Judas disse: “Mestre, certamente minha descendência não domina os governantes, domina?”[e]


    Jesus lhe respondeu: “Vem, deixa-me [falar] a ti [sobre a geração santa. Não para que vás até lá], mas tu te entristecerás profundamente quando vires o reino e toda a sua geração.”


    Ao ouvir isso, Judas lhe disse: “De que me adiantou teres me separado daquela geração?”


    Jesus respondeu: “Tu te tornarás o décimo terceiro, serás amaldiçoado pelas outras gerações e governarás sobre elas. Nos últimos dias, elas […] a ti, e tu não subirás até a geração santa.”[f]


    [a] As lacunas e restaurações tornam incerta a relação exata entre a água, o fruto e o modo de vida da geração.

    [b] Ou: “décimo terceiro espírito”; o termo traduzido por “demônio” pode admitir essa acepção no contexto copta, mas a revisão direta da língua-fonte ainda está pendente.

    [c] “Pessoas importantes” também pode ser entendido como “pessoas grandes”; o sentido do qualificativo é incerto.

    [d] A lacuna impede determinar com segurança o sujeito e a construção da frase final.

    [e] “Descendência” traduz literalmente a ideia de “semente” e pode indicar linhagem ou posteridade.

    [f] A lacuna oculta o verbo da oração “elas […] a ti”.'
