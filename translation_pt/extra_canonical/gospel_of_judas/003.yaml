  text: 'The next morning, he appeared to his disciples. [And] they said to him, “Master, where did [you] go, and what did you do when you left us?”


    Jesus said to them, “I went to another great and holy generation.”


    His disciples said to him, “Lord, what great generation is better and holier than we are, that is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I say to you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it, because that generation does not come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.”


    When his disciples heard these things, each of them was troubled in their spirit. They could not say anything.'
translation:
  language: pt
  text: 'Na manhã seguinte, ele apareceu aos seus discípulos. [E] eles lhe perguntaram: “Mestre, aonde [você] foi e o que fez quando nos deixou?”


    Jesus lhes respondeu: “Fui para outra geração, grande e santa.”


    Seus discípulos lhe disseram: “Senhor, que grande geração é melhor e mais santa do que nós e não está nestes domínios?”


    Ao ouvir isso, Jesus riu. E lhes disse: “Por que vocês ficam se perguntando, no coração, sobre a geração forte e santa? Em verdade lhes digo: ninguém nascido [deste] domínio verá [essa geração]. Nenhum exército de anjos das estrelas governará sobre ela, e nenhuma pessoa de nascimento mortal poderá unir-se a ela, porque essa geração não vem de […] que se tornou […] a geração das pessoas entre [eles] vem da geração do grande povo […] as autoridades poderosas que […] nem os poderes […] aqueles pelos quais vocês governam.”


    Quando os discípulos ouviram essas coisas, cada um deles ficou perturbado em seu espírito. Não conseguiram dizer nada.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: generation
  choice: geração
  rationale: Preserva o termo recorrente e sua possível dimensão genealógica, coletiva e transcendente, sem reduzir o sentido a “povo” ou “raça”.
- source_word: realms
  choice: domínios
  rationale: Mantém a ideia de esferas ou regiões de autoridade; “reinos” poderia sugerir de modo excessivo Estados ou monarquias terrestres.
- source_word: army of angels from the stars
  choice: exército de anjos das estrelas
  rationale: Reprodução formal da expressão cosmológica, sem explicar se os anjos pertencem às estrelas ou procedem delas.
- source_word: join it
  choice: unir-se a ela
  rationale: Expressa ingresso ou associação à geração sem impor a ideia específica de nascimento, salvação ou pertencimento étnico.
- source_word: mortal birth
  choice: nascimento mortal
  rationale: Preserva a oposição conceitual do testemunho entre origem mortal e a geração santa.
- source_word: powers / authorities
  choice: poderes / autoridades
  rationale: Mantém distintos os dois termos hierárquicos do testemunho, sem harmonizá-los.
theological_decisions:
- issue: Natureza da “geração grande e santa”
  choice: Manter “geração” e a linguagem de origem e pertencimento
  alternative: Interpretar como “raça espiritual”, “povo eleito” ou “geração celestial”
  rationale: O trecho não define de maneira inequívoca a natureza do grupo; a tradução conserva a tensão cosmológica e antropológica.
- issue: Riso de Jesus
  choice: Traduzir diretamente “Jesus riu”
  alternative: Explicar o riso como aprovação, ironia, escárnio ou correção
  rationale: O valor do gesto permanece ambíguo no texto e não deve ser resolvido pela tradução.
- issue: Autoridade dos discípulos
  choice: Preservar “aqueles pelos quais vocês governam”
  alternative: Emendar para “aqueles que governam vocês” ou explicitar uma hierarquia cósmica
  rationale: A passagem está fragmentária, e a sintaxe transmitida no testemunho inglês deve permanecer sem harmonização conjectural.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Os colchetes e as reticências entre colchetes foram preservados como sinais de restauração editorial e lacunas do manuscrito. Como a revisão direta do copta ainda está pendente, a redação é provisória e se baseia no testemunho inglês público fornecido.
