  text: 'One day Jesus was with his disciples in Judea. He found them sitting together, practicing their piety. When he [came up to] his disciples sitting together and praying over the bread, [he] laughed.


    The disciples said to him, “Master, why are you laughing at [our] prayer? What have we done? [This] is what is right.”


    He answered them, “I’m not laughing at you. You aren’t doing this because you want to, but because through this your God [will be] praised.”


    They said, “Master, you […] are the Son of our God!”


    Jesus said to them, “How do [you] know me? Truly [I] say to you, no generation of the people among you will know me.”


    When his disciples heard this, [they] began to grow angry and furious, and they began to curse him in their hearts.


    But when Jesus noticed their ignorance, [he said] to them, “Why are you letting your anger trouble you? Has your God within you and [his stars] become angry with your souls? If any of you is [strong enough] among humans to bring out the perfect Humanity, stand up and face me.”


    They all said, “We’re strong enough.” But their spirits weren’t brave enough to stand before [him]—except for Judas Iscariot. He was able to stand before him, but he couldn’t look him in the eye, so he looked away.


    Judas [said] to him, “I know who you are and where you’ve come from. You’ve come from the immortal realm of Barbelo, and I’m not worthy to utter the name of the one who’s sent you.”


    Then Jesus, knowing that he was thinking about what is exalted, said to him, “Come away from the others, and I’ll tell you the mysteries of the kingdom. Not so that you’ll go there, but you’ll grieve much because someone else will replace you to complete the twelve [elements] before their God.”


    Judas said to him, “When will you tell me these things, and when will the great day of light dawn for the generation […]?”


    But when he said these things, Jesus left him.'
translation:
  language: pt
  text: 'Certo dia, Jesus estava com seus discípulos na Judeia. Encontrou-os sentados juntos, praticando sua piedade. Quando [se aproximou de] seus discípulos, que estavam sentados juntos e oravam sobre o pão, [ele] riu.


    Os discípulos lhe disseram: “Mestre, por que você está rindo da [nossa] oração? O que fizemos? [Isto] é o que é certo.”


    Ele lhes respondeu: “Não estou rindo de vocês. Vocês não fazem isso porque querem, mas porque, por meio disso, o Deus de vocês [será] louvado.”


    Eles disseram: “Mestre, você […] é o Filho do nosso Deus!”


    Jesus lhes disse: “Como [vocês] me conhecem? Em verdade, [eu] lhes digo: nenhuma geração do povo que está entre vocês me conhecerá.”


    Quando seus discípulos ouviram isso, [eles] começaram a ficar irados e furiosos e a amaldiçoá-lo no coração.


    Mas, quando Jesus percebeu a ignorância deles, [disse-lhes]: “Por que vocês deixam que sua ira os perturbe? Será que o Deus de vocês, que está dentro de vocês, e [as estrelas dele] se iraram contra a alma de vocês? Se algum de vocês é [forte o bastante], dentre os seres humanos, para fazer surgir a Humanidade perfeita,[a] levante-se e venha me enfrentar.”


    Todos disseram: “Somos fortes o bastante.” Mas o espírito deles não teve coragem de permanecer diante [dele] — com exceção de Judas Iscariotes. Ele conseguiu permanecer diante dele, mas não pôde olhá-lo nos olhos; por isso, desviou o olhar.


    Judas [lhe disse]: “Sei quem você é e de onde veio. Você veio do reino imortal de Barbelo,[b] e eu não sou digno de pronunciar o nome daquele que enviou você.”


    Então Jesus, sabendo que ele pensava no que é elevado, disse-lhe: “Afaste-se dos outros, e eu lhe contarei os mistérios do reino. Não para que você vá até lá; pelo contrário, você sofrerá muito, pois outra pessoa substituirá você, a fim de completar os doze [elementos][c] diante do Deus deles.”


    Judas lhe perguntou: “Quando você me contará essas coisas? E quando o grande dia de luz raiará para a geração […]?”


    Mas, depois que ele disse essas coisas, Jesus o deixou.'
