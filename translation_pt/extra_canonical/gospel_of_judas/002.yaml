    issue: “a alma de vocês” está no singular.
    rationale: O testemunho diz “your souls”, no plural. “Suas almas” preserva o número sem alterar o sentido.
  - severity: medium
    issue: “o espírito deles não teve coragem” está no singular.
    rationale: O texto-base diz “their spirits weren’t brave enough”. “Os espíritos deles não tiveram coragem” conserva o plural e evita uma leitura de espírito coletivo não marcada.
  - severity: low
    issue: “Judas lhe perguntou” intensifica o verbo de fala.
    rationale: O testemunho registra “Judas said to him”. “Judas lhe disse” preserva a designação narrativa sem converter a fala em pergunta formal.
  - severity: low
    issue: “[disse-lhes]” incorpora o pronome dativo à restauração.
    rationale: O trecho restaurado no testemunho é apenas “[he said]”. “[Ele] lhes disse” reproduz com maior transparência o alcance do colchete.
