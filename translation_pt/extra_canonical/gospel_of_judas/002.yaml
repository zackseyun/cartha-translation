  terminology: “Piedade”, “o Deus de vocês”, “Humanidade perfeita”, “Barbelo”, “mistérios do reino” e “[elementos]” são escolhas adequadas e cautelosas. As notas preservam a incerteza sem impor leitura doutrinária.
