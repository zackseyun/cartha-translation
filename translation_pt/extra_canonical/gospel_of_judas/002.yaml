  footnotes:
  - marker: a
    text: “Humanidade perfeita” pode ser uma expressão técnica para a humanidade ideal, completa ou primordial; o referente exato permanece incerto.
    reason: Preservar uma provável categoria cosmológica sem impor uma interpretação individual ou coletiva.
  - marker: b
    text: Barbelo é uma figura ou realidade celestial mencionada em alguns textos cristãos antigos de orientação gnóstica. Aqui, o nome é mantido sem explicação doutrinária adicional.
    reason: Ajudar o leitor comum a reconhecer o nome próprio sem importar uma reconstrução sectária específica.
  - marker: c
    text: A palavra “elementos” é uma restauração em trecho danificado; sua referência exata não é segura.
    reason: Sinalizar a incerteza textual já indicada pelos colchetes e evitar identificar indevidamente os doze.
lexical_decisions:
- source_word: practicing their piety
  choice: praticando sua piedade
  rationale: Mantém a formulação religiosa do testemunho e evita especificar atos cultuais não expressos.
- source_word: praying over the bread
  choice: oravam sobre o pão
  rationale: Preserva a relação espacial e ritual ambígua de “over”, sem interpretar o ato como bênção ou eucaristia.
- source_word: your God
  choice: o Deus de vocês
  rationale: Reproduz o distanciamento retórico recorrente de Jesus em relação ao Deus dos discípulos, sem identificar teologicamente essa figura.
- source_word: perfect Humanity
  choice: a Humanidade perfeita
  rationale: Retém a provável expressão técnica e sua ambiguidade coletiva ou arquetípica, usando maiúscula para sinalizar seu caráter conceitual.
- source_word: immortal realm of Barbelo
  choice: reino imortal de Barbelo
  rationale: “Reino” é natural e suficientemente amplo; Barbelo é preservado como nome próprio.
- source_word: mysteries of the kingdom
  choice: mistérios do reino
  rationale: Conserva a linguagem iniciática e a ambiguidade quanto à identidade do reino.
- source_word: generation
  choice: geração
  rationale: Mantém o termo recorrente, que pode designar linhagem, grupo espiritual ou geração histórica, sem resolver o referente.
theological_decisions:
- issue: Identidade do “Deus de vocês”
  choice: Manter “o Deus de vocês” em todas as ocorrências pertinentes
  alternative: Traduzir simplesmente como “Deus” ou identificá-lo com uma divindade específica
  rationale: O distanciamento é essencial à tensão teológica do texto; explicá-lo na tradução imporia uma interpretação.
- issue: Sentido de “Humanidade perfeita”
  choice: Preservar a expressão com maiúscula e nota não dogmática
  alternative: Interpretar como “ser humano perfeito”, “Adão perfeito” ou “raça perfeita”
  rationale: O testemunho permite leitura individual, coletiva ou arquetípica; a tradução não deve decidir entre elas.
- issue: Destino de Judas
  choice: “Não para que você vá até lá; pelo contrário, você sofrerá muito”
  alternative: Reformular como promessa de entrada posterior ou exclusão definitiva
  rationale: Mantém o contraste e a tensão do testemunho sem harmonizar o papel de Judas com qualquer sistema teológico.
- issue: Os doze [elementos]
  choice: Conservar a restauração entre colchetes
  alternative: Traduzir como “doze discípulos”, “doze éons” ou “doze números”
  rationale: O substantivo restaurado é incerto, e uma identificação mais específica ultrapassaria a evidência fornecida.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e compreensão internacional. O tratamento por “você/vocês” reflete fala direta corrente sem excessiva solenidade. Colchetes e reticências foram preservados como sinais de lacuna ou restauração manuscrita. Como a revisão direta do copta ainda está pendente, o texto permanece um rascunho provisório fundamentado no testemunho inglês público fornecido; não se fizeram emendas conjecturais além das restaurações já marcadas.
