translation:
  language: pt
  text: 'Em outro dia, Jesus foi até eles. Eles lhe disseram: “Mestre, nós vimos você em um sonho, pois tivemos grandes [sonhos na noite passada].”[a]


    Mas Jesus disse: “Por que vocês […] se esconderam?”


    E eles [disseram: “Vimos] uma grande [casa, com um grande] altar [dentro dela, e] doze pessoas — diríamos que eram sacerdotes — e um nome. Uma multidão esperava junto ao altar [até que] os sacerdotes [terminassem de receber] as ofertas. Nós também continuamos esperando.”


    [Jesus disse]: “Como eles eram?”


    Eles responderam: “[Alguns] jejuam [por] duas semanas. Outros sacrificam os próprios filhos; outros, suas esposas, louvando e humilhando-se uns diante dos outros. Outros se deitam com homens; outros assassinam; outros ainda cometem muitos pecados e praticam crimes. [E] as pessoas que estão [diante] do altar invocam o teu [nome]! E, em todos os seus sacrifícios, enchem o [altar] com suas ofertas.” Quando disseram isso, [eles] se calaram, pois estavam perturbados.


    Jesus lhes disse: “Por que vocês estão perturbados? Em verdade lhes digo: todos os sacerdotes que estão diante daquele altar invocam o meu nome. E [novamente] lhes digo: meu nome foi escrito nesta [casa] das gerações das estrelas pelas gerações humanas. [E eles] plantaram vergonhosamente árvores sem fruto em meu nome.” Jesus lhes disse: “São vocês que recebem as ofertas sobre o altar que viram. Esse é o Deus a quem vocês servem, e vocês são as doze pessoas que viram. Os animais que vocês viram ser levados para o sacrifício são a multidão que vocês desencaminham diante daquele altar. [O ministro de vocês] se levantará e usará o meu nome dessa maneira, e [as] gerações dos piedosos lhe serão fiéis. Depois dele, outra pessoa apresentará [os que mantêm relações sexuais promíscuas]; outra, os que assassinam crianças; outra, os que se deitam com homens; e ainda os que jejuam e todo o restante da impureza, do crime e do erro. E os que dizem: ‘Somos iguais aos anjos’ — eles são as estrelas que
    levam tudo ao fim.[b] Foi dito às gerações humanas: ‘Vejam, Deus aceitou o sacrifício de vocês das mãos dos sacerdotes’, isto é, do ministro do erro. Mas o Senhor que ordena é o Senhor sobre tudo. No último dia, eles serão considerados culpados.”


    Jesus [lhes] disse: “Parem de [sacrificar animais]. Vocês os [ofereceram] sobre o altar, sobre as suas estrelas com os seus anjos, onde eles já foram levados ao fim.[c] Portanto, deixem que eles se tornem […] com vocês e deixem que [se tornem] claros.”


    Seus discípulos [lhe disseram]: “Purifica-nos dos nossos [pecados], que cometemos por causa do engano dos anjos.”


    Jesus lhes disse: “Não é possível […], nem [pode] uma fonte apagar o fogo de todo o mundo habitado. Tampouco o poço de uma [cidade] pode satisfazer todas as gerações, exceto a grande e firme.[d] Uma só lâmpada não iluminará todos os domínios, exceto a segunda geração; nem um padeiro pode alimentar toda a criação debaixo do [céu].”


    E [quando os discípulos ouviram] essas [coisas], disseram-lhe: “Mestre, ajuda-nos e salva-nos!”


    Jesus lhes disse: “Parem de lutar contra mim. Cada um de vocês tem a sua própria estrela, [e …] das estrelas […] o que lhe pertence […] Eu não fui enviado à geração corruptível, mas à geração forte e incorruptível, porque nenhum inimigo dominou [essa] geração, nem estrela alguma. Em verdade lhes digo: a coluna de fogo cairá em breve, e aquela geração não será abalada pelas estrelas.”


    [a] A passagem sobre os “grandes sonhos” é uma reconstrução de texto danificado.

    [b] Ou: “que completam tudo”. O sentido preciso da expressão é incerto.

    [c] Ou: “onde elas já foram completadas”. O referente do pronome e o sentido exato são incertos.

    [d] A sintaxe permite relacionar “exceto a grande e firme” a uma geração excepcional, mas a passagem permanece obscura.'
