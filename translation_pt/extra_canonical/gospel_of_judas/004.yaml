lexical_decisions:
- source_word: Master
  choice: Mestre
  rationale: Forma natural e tradicional em português, sem acrescentar um título cristológico mais específico.
- source_word: house
  choice: casa
  rationale: Preserva o termo amplo do testemunho; “templo” resolveria indevidamente a identificação do edifício.
- source_word: altar
  choice: altar
  rationale: Equivalente direto e adequado ao contexto sacrificial.
- source_word: sleep with men
  choice: se deitam com homens
  rationale: Mantém uma formulação concreta e relativamente formal, sem ampliar nem suavizar a referência sexual.
- source_word: minister
  choice: ministro
  rationale: Preserva a ambiguidade funcional do termo, evitando especificar “sacerdote”, “servidor” ou uma função eclesiástica posterior.
- source_word: inhabited world
  choice: mundo habitado
  rationale: Conserva a extensão cosmográfica da expressão, em vez de reduzi-la simplesmente a “mundo”.
- source_word: realms
  choice: domínios
  rationale: Termo amplo que preserva a possível dimensão cosmológica sem impor “reinos” políticos ou celestes.
- source_word: generation
  choice: geração
  rationale: Mantém o vocabulário técnico e repetido do texto, mesmo quando seu referente é cosmológico ou coletivo.
- source_word: corruptible / incorruptible
  choice: corruptível / incorruptível
  rationale: Preserva o contraste formal e teológico do testemunho.
theological_decisions:
- issue: Identidade do Deus servido pelos discípulos
  choice: “Esse é o Deus a quem vocês servem”
  alternative: “Esse é o deus a quem vocês servem”
  rationale: O testemunho fornecido traz “God”; a inicial maiúscula foi preservada sem explicar se a fala é irônica, polêmica ou ontológica.
- issue: Gerações das estrelas e gerações humanas
  choice: Preservar literalmente as duas expressões
  alternative: Interpretá-las como ordens angélicas ou grupos históricos
  rationale: A cosmologia e a relação entre as gerações permanecem ambíguas; uma paráfrase doutrinária eliminaria tensão genuína.
- issue: “Iguais aos anjos” e as estrelas
  choice: Manter a identificação direta feita pelo discurso
  alternative: Explicar estrelas como anjos ou governantes celestes
  rationale: O texto associa os grupos, mas não oferece uma ontologia completa; a tradução não deve completar o sistema.
- issue: A geração grande e firme / segunda geração
  choice: Manter os títulos sem harmonização
  alternative: Identificá-los entre si ou com a geração incorruptível
  rationale: Não há base suficiente no trecho para afirmar que todas essas designações têm exatamente o mesmo referente.
- issue: Alcance da missão de Jesus
  choice: “não fui enviado à geração corruptível, mas à geração forte e incorruptível”
  alternative: Reformular como exclusão salvífica definitiva
  rationale: A tradução conserva a afirmação do texto sem deduzir uma doutrina sistemática sobre eleição ou salvação.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. Os colchetes e as reticências foram preservados como sinais de lacuna ou reconstrução manuscrita. Por se tratar de uma versão provisória baseada no testemunho público em inglês, e estando pendente a revisão direta do copta do Codex Tchacos 3, escolhas em passagens danificadas foram mantidas cautelosas e acompanhadas de notas quando necessário.
