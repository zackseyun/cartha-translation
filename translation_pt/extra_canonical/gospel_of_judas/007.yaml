lexical_decisions:
- source_word: earthly Adam
  choice: Adão terreno
  rationale: Mantém o contraste cosmológico do testemunho sem interpretar ‘terreno’ apenas como ‘humano’ ou ‘pecaminoso’.
- source_word: the one who bears me / the human who bears me
  choice: aquele que me carrega / o ser humano que me carrega
  rationale: Preserva a formulação corporal e teologicamente tensa do testemunho, sem substituí-la por uma explicação interpretativa.
- source_word: Saklas
  choice: Saklas
  rationale: Transliteração do nome próprio, evitando identificá-lo no corpo do texto com outra figura por inferência doutrinária.
- source_word: horn
  choice: chifre
  rationale: Conserva a imagem concreta e ambígua, em vez de parafraseá-la como poder, autoridade ou exaltação.
- source_word: realm / realms
  choice: reino / reinos
  rationale: Escolha ampla que preserva a linguagem cosmológica; a evidência copta direta ainda requer revisão.
- source_word: guest room
  choice: aposento de hóspedes
  rationale: Tradução transparente do testemunho disponível, sem harmonização com terminologia dos evangelhos canônicos.
- source_word: handed him over
  choice: o entregou
  rationale: Expressa a ação sem acrescentar ‘traiu’, preservando a formulação narrativa e sua tensão.
theological_decisions:
- issue: Relação entre Jesus e ‘aquele que me carrega’
  choice: Manter literalmente ‘aquele que me carrega’
  alternative: Interpretar como ‘meu corpo’ ou ‘o homem no qual habito’
  rationale: A formulação pode refletir uma antropologia ou cristologia específica, mas a tradução não deve resolver a ambiguidade sem revisão da fonte copta.
- issue: Ação de Judas ao sacrificar o ser humano que carrega Jesus
  choice: Preservar ‘você sacrificará’ sem qualificação moral explícita
  alternative: Traduzir como condenação direta ou como ato de libertação exaltado
  rationale: O trecho combina exaltação, ira, desvio e sacrifício; impor uma leitura exclusivamente positiva ou negativa eliminaria a tensão do texto.
- issue: Identidade de Saklas
  choice: Não explicar no texto principal
  alternative: Identificá-lo como demiurgo, criador ou Satanás
  rationale: Essas identificações exigem contexto e interpretação adicionais e não devem ser incorporadas como se fossem tradução.
- issue: ‘Grande geração de Adão’
  choice: Manter a expressão cosmológica
  alternative: Parafrasear como eleitos, humanidade espiritual ou descendentes santos
  rationale: O referente permanece especializado e parcialmente obscuro; a tradução conserva sua abertura sem importar um sistema doutrinário.
- issue: Entrada de Judas na nuvem
  choice: Relatar sem explicar seu sentido
  alternative: Descrever como glorificação, ascensão, condenação ou iniciação
  rationale: O testemunho narra o evento, mas a lacuna na voz da nuvem impede uma interpretação segura.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com tratamento por ‘você’ para preservar naturalidade brasileira sem coloquialismo excessivo. A sintaxe foi suavizada apenas onde isso não apaga rupturas, lacunas ou ambiguidades do testemunho. Os marcadores [a] e [b] aparecem ao fim do texto principal, imediatamente antes das respectivas notas.
