translation:
  language: pt
  text: 'Jesus disse: “Em verdade, digo [a vocês]: este batismo [que receberam em] meu nome […] destruirá toda a geração do Adão terreno. Amanhã torturarão aquele que me carrega. Em verdade, [digo] a vocês: nenhuma mão de um ser humano mortal [cairá] sobre mim. Em verdade, [digo] a você, Judas: os que oferecem sacrifícios a Saklas […] tudo o que é mau. Mas você fará mais do que todos eles, pois sacrificará o ser humano que me carrega. Seu chifre já foi erguido, sua ira se acendeu, sua estrela ascendeu e seu coração [se desviou]. Em verdade, [digo a você]: seu último [… e] o [… os tronos] do reino foram [derrotados], os reis se enfraqueceram, as gerações angélicas se entristeceram, o mal [que semearam…] foi destruído, [e] o [governante] foi eliminado. [E] então o [fruto] da grande geração de Adão será exaltado, porque, antes do céu, da terra e dos anjos, existe essa geração procedente dos reinos. Veja, tudo lhe foi dito. Erga os olhos e veja a nuvem, com a luz dentro dela e as estrelas ao
    redor. E a estrela que vai à frente é a sua estrela.”


    Então Judas ergueu os olhos, viu a nuvem luminosa e entrou nela. Os que estavam no chão ouviram uma voz vinda da nuvem, que dizia: “[… a] grande [geração…] e […].” E Judas não viu mais Jesus.


    Imediatamente houve uma agitação entre [os] judeus, maior do que […]. Os chefes dos sacerdotes murmuravam porque ele havia entrado no aposento de hóspedes para orar. Alguns escribas, porém, estavam ali, observando atentamente, para poder prendê-lo durante sua oração. Eles tinham medo do povo, pois todos o consideravam profeta.


    Então se aproximaram de Judas e lhe disseram: “O que você está fazendo aqui? Você não é discípulo de Jesus?”


    Ele lhes respondeu como desejavam. Depois Judas recebeu algum dinheiro e o entregou a eles.


    O Evangelho


    de Judas


