source:
  text: 'Jesus said, "Truly I say [to you], this baptism[which they''ve received in] my name […] will destroy the whole generation of the earthly Adam. Tomorrow they''ll torture the one who bears me. Truly I [say] to you, no hand of a mortal human [will fall] upon me. Truly [I say] to you, Judas, those who offer sacrifices to Saklas […] everything that''s evil. But you''ll do more than all of them, because you''ll sacrifice the human who bears me. Your horn has already been raised, your anger has been kindled, your star has ascended, and your heart has [strayed]. Truly [I say to you], your last [… and] the [… the thrones] of the realm have [been defeated], the kings have grown weak, the angelic generations have grieved, and the evil [they sowed …] is destroyed, [and] the [ruler] is wiped out. [And] then the [fruit] of the great generation of Adam will be exalted, because before heaven, earth, and the angels, that generation from the realms exists. Look, you''ve been told everything. Lift
    up your eyes and see the cloud with the light in it and the stars around it. And the star that leads the way is your star."


    Then Judas looked up and saw the luminous cloud, and he entered it. Those standing on the ground heard a voice from the cloud saying, "[ . . . the] great [generation . . . ] and [ . . . ]." And Judas didn''t see Jesus anymore.


    Immediately there was a disturbance among [the] Jews, more than […] Their high priests grumbled because he''d gone into the guest room to pray. But some scribes were there watching closely so they could arrest him during his prayer, because they were afraid of the people, since they all regarded him as a prophet.


    And they approached Judas and said to him, "What are you doing here? Aren''t you Jesus'' disciple?"


    Then he answered them as they wished. Then Judas received some money and handed him over to them.


    The Gospel

    of Judas'
