translation:
  language: pt
  text: 'Jesus disse: “[Venha], e eu lhe ensinarei sobre os [mistérios que nenhum] ser humano [verá], pois existe um grande e ilimitado reino cujos horizontes nenhuma geração de anjos jamais viu. [Nele] há um [grande] Espírito invisível, que nenhum olho [de anjo] jamais viu, nenhum coração jamais compreendeu e que nunca foi chamado por nome algum.


    “E ali apareceu uma nuvem luminosa. E ele (o Espírito) disse: ‘Que venha a existir um anjo para me servir.’ Então um grande anjo, o Autogerado, o Deus da Luz, surgiu da nuvem. E, por causa dele, outros quatro anjos vieram a existir de outra nuvem e serviram ao Autogerado angélico. E o [Autogerado] disse: ‘Que [um reino] venha a existir’, e ele veio a existir [assim como ele disse]. E ele [criou] o primeiro luminar para governá-lo. E disse: ‘Que anjos venham a existir para [servi-lo’, e miríades] sem número vieram a existir. E disse: ‘[Que um] reino luminoso venha a existir’, e ele veio a existir. Criou o segundo luminar para governá-lo, juntamente com miríades de anjos sem número para prestar serviço. Foi assim que criou os demais reinos de luz. Ele os colocou sob governo e criou para eles miríades de anjos sem número para auxiliá-los.


    “E Adamas estava na primeira nuvem de luz, que nenhum anjo jamais poderia ver entre todos os chamados ‘Deus’. E [Adamas gerou Sete naquele] lugar, segundo a imagem [de…] e segundo a semelhança [deste] anjo. Ele fez a [geração] incorruptível de Sete aparecer aos doze [luminares] andróginos. [E então] fez setenta e dois luminares aparecerem na geração incorruptível, segundo a vontade do Espírito. Depois, os próprios setenta e dois luminares fizeram trezentos e sessenta luminares aparecerem na geração incorruptível, segundo a vontade do Espírito, para que houvesse cinco para cada um. E os doze reinos dos doze luminares constituem seu pai, com seis céus para cada reino; assim, há setenta e dois céus para os setenta e dois luminares e, para cada um [deles, cinco] firmamentos, [totalizando] trezentos e sessenta [firmamentos. A eles] foram dados autoridade e um [grande] exército de anjos sem número, para honra e serviço, além de espíritos virgens [também], para a honra e o [serviço] de todos
    os reinos e dos céus com seus firmamentos.


    “O conjunto desses imortais é chamado ‘cosmos’ — isto é, ‘perecível’ — pelo pai e pelos setenta e dois luminares, juntamente com o Autogerado e seus setenta e dois reinos. Foi ali que apareceu o primeiro ser humano, com seus poderes incorruptíveis. No reino que apareceu com a geração dele estão a nuvem do conhecimento e o anjo chamado [Eleleth…] Depois dessas coisas, [Eleleth] disse: ‘Que doze anjos venham a existir [para] governar o Caos e o [Hades].’ E eis que da nuvem apareceu um [anjo] cujo rosto resplandecia com [fogo] e cuja aparência estava [maculada] de sangue. Seu nome era Nebro, que significa ‘Rebelde’. Outros o chamam Yaldabaoth. E outro anjo, Saklas, também veio da nuvem. Então Nebro criou seis anjos — e Saklas [fez o mesmo] — para serem auxiliares. Eles produziram doze anjos nos céus, e cada um deles recebeu uma porção nos céus.


    “E os doze governantes disseram aos doze anjos: ‘Que cada um de vocês […] e que eles […] geração [… cinco] anjos:


    “O primeiro [é Yaoth], chamado ‘o Bom’.


    “O segundo é Harmathoth, [o olho de fogo].


    “O [terceiro] é Galila.


    “O quarto [é] Yobel.


    “O quinto é Adonaios.


    “Esses são os cinco que governaram o Hades e são os primeiros sobre o Caos.


    “Então Saklas disse aos seus anjos: ‘Criemos um ser humano segundo a semelhança e a imagem.’ E eles formaram Adão e sua esposa Eva, que na nuvem é chamada ‘Vida’, pois por esse nome todas as gerações o procuram, e cada uma delas a chama pelos nomes delas. Saklas, porém, não [ordenou…] dar à luz, exceto […] entre as gerações […] que isto […] e o [anjo] lhe disse: ‘Sua vida, junto com a de seus filhos, durará um tempo limitado.’”


    Então Judas disse a Jesus: “[Por quanto] tempo uma pessoa pode viver?”


    Jesus disse: “Por que você se admira de que o tempo de vida de Adão e de sua geração seja limitado no lugar onde ele recebeu seu reino, juntamente com seu governante?”


    Judas disse a Jesus: “O espírito humano morre?”


    Jesus disse: “É assim: Deus ordenou a Miguel que emprestasse espíritos às pessoas, para que elas servissem. Depois, o Grande ordenou a Gabriel que desse espíritos à grande geração que não tem rei — o espírito junto com a alma. Assim, as [demais] almas […] luz [… o] Caos […] procuram [o] espírito dentro de vocês, que vocês fizeram viver nesta carne, proveniente das gerações angélicas. Então Deus fez com que o conhecimento fosse levado a Adão e aos que estavam com ele, para que os reis do Caos e do Hades não os dominassem.”


    [Então] Judas disse a Jesus: “O que, portanto, farão essas gerações?”


    Jesus disse: “Em verdade lhe digo: as estrelas levam todas essas coisas ao seu cumprimento. Quando Saklas completar o período que lhe foi determinado, a primeira estrela deles aparecerá com as gerações, e eles consumarão o que foi dito. Então praticarão imoralidade em meu nome, assassinarão seus filhos e [eles…] o mal e […] os reinos, trazendo as gerações e apresentando-as a Saklas. [E], depois disso, […] trará as doze tribos de [Israel] de […], e todas as [gerações] servirão a Saklas, pecando em meu nome. E sua estrela [governará] o décimo terceiro reino.” Então Jesus [riu].


    [Judas] disse: “Mestre, por que [está rindo de mim?”


    Jesus] respondeu [e disse]: “Não estou rindo [de você, mas] do erro das estrelas, pois essas seis estrelas se desviam com esses cinco guerreiros, e todas serão destruídas junto com suas criações.”


    Então Judas disse a Jesus: “O que farão os que foram batizados em seu nome?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: realm
  choice: reino
  rationale: Mantém o campo de domínio ou esfera transcendente e é mais natural ao leitor comum do que o tecnicismo ‘éon’; não elimina a possibilidade cosmológica do termo.
- source_word: Self-Begotten
  choice: Autogerado
  rationale: Reproduz o título cosmológico sem o assimilar ao vocabulário cristológico mais conhecido de ‘Unigênito’.
- source_word: luminary
  choice: luminar
  rationale: Preserva a designação técnica de seres luminosos e sua distinção de ‘anjos’ e ‘estrelas’.
- source_word: generation
  choice: geração
  rationale: Conserva a polissemia entre linhagem, coletividade e ordem de seres, importante para a cosmologia do texto.
- source_word: androgynous
  choice: andróginos
  rationale: Tradução direta que preserva a caracterização cosmológica sem explicação interpretativa.
- source_word: cosmos
  choice: cosmos
  rationale: Mantém o empréstimo explicitamente glosado pelo próprio texto como ‘perecível’.
- source_word: Chaos / Hades
  choice: Caos / Hades
  rationale: Preserva os nomes cosmológicos e evita reduzir Hades simplesmente a ‘inferno’.
- source_word: to loan spirits
  choice: emprestasse espíritos
  rationale: Mantém a metáfora incomum e sua possível implicação de concessão temporária, sem suavizá-la para ‘dar’.
- source_word: sleep around
  choice: praticarão imoralidade
  rationale: Expressa em registro digno a conduta sexual indicada pelo testemunho inglês, sem acrescentar uma especificação ausente.
- source_word: complete
  choice: levam ... ao seu cumprimento
  rationale: Preserva a ideia de consumação ou execução do que foi determinado, em vez de mera conclusão cronológica.
theological_decisions:
- issue: Identidade do Espírito invisível e referência pronominal
  choice: Manter ‘ele (o Espírito)’ e o título ‘Deus da Luz’ conforme o testemunho
  alternative: Identificar ou harmonizar essas figuras com categorias trinitárias posteriores
  rationale: A cosmologia própria do documento deve permanecer distinta, sem importação de doutrina denominacional.
- issue: Relação entre imagem e semelhança na criação humana
  choice: ‘segundo a semelhança e a imagem’, preservando a ordem do testemunho
  alternative: Normalizar para a formulação bíblica tradicional ‘imagem e semelhança’
  rationale: Evita harmonização silenciosa com Gênesis.
- issue: Espírito e alma na grande geração
  choice: Preservar ‘o espírito junto com a alma’ e a sintaxe fragmentária ao redor
  alternative: Explicar uma antropologia sistemática de corpo, alma e espírito
  rationale: O manuscrito está danificado e o texto mantém tensão conceitual que não deve ser resolvida editorialmente.
- issue: Predição de pecado ‘em meu nome’
  choice: Traduzir literalmente sem identificar historicamente o grupo visado
  alternative: Aplicar a denúncia a uma igreja, sacramento ou tradição específica
  rationale: O referente sectário não é seguro e uma identificação denominacional excederia a evidência fornecida.
- issue: Batismo em nome de Jesus
  choice: Manter a pergunta final sem resposta, como no escopo fornecido
  alternative: Completar a resposta a partir de reconstruções ou outras edições
  rationale: O trecho termina na pergunta e não se deve suprir material não apresentado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Colchetes e reticências foram preservados como sinais de restauração editorial, lacuna ou dano manuscrito. A redação é necessariamente provisória porque a revisão direta do copta ainda está pendente; o testemunho público em inglês foi usado como camada de acesso. Nomes próprios e títulos cosmológicos foram transliterados ou traduzidos de modo consistente. Não foram criadas notas de rodapé, portanto não há marcadores no texto principal.
