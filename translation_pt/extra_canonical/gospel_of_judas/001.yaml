review_pass:
  verdict: revise
  source_fidelity: Com base no testemunho inglês fornecido (a revisão direta do copta ainda está pendente), a tradução conserva adequadamente a duração de oito dias, a anterioridade de três dias em relação à Páscoa, os sinais e maravilhas, o contraste entre os dois grupos, os mistérios além do mundo e a aparição como criança. Contudo, “transmitiu a Judas” torna unilateral uma fala que o testemunho descreve como ocorrida “com Judas”; uma formulação que indique conversa preserva melhor esse dado.
  naturalness: O português é claro, moderno e de registro apropriado. “Em conversa com Judas Iscariotes” é natural e evita sugerir que Judas foi apenas destinatário passivo de uma transmissão.
  terminology: “Mensagem secreta de julgamento”, “caminho da justiça”, “transgressão”, “mistérios ... além do mundo” e “Páscoa” preservam os termos e as ambiguidades do testemunho disponível. A marca de texto incerto é mantida tanto no texto quanto em nota.
  issues:
  - severity: medium
    issue: “Jesus transmitiu a Judas Iscariotes”
    rationale: O inglês diz que Jesus “spoke with Judas Iscariot”, isto é, situa a mensagem numa interação com Judas. “Transmitiu a” sugere predominantemente comunicação unilateral. “Proferiu em conversa com” mantém a forma de interação sem ampliar seu conteúdo.
  revised_text: 'Esta é a mensagem secreta de julgamento que Jesus proferiu em conversa com Judas Iscariotes ao longo de oito dias, três dias antes de celebrar a Páscoa.


    Quando apareceu na terra, ele realizou sinais e grandes maravilhas para a salvação da humanidade. Alguns [andaram][a] no caminho da justiça, mas outros andaram em sua transgressão; por isso, foram chamados os doze discípulos. Ele começou a lhes falar sobre os mistérios que estão além do mundo e sobre o que aconteceria no fim. Muitas vezes, não se revelava aos discípulos, mas era possível encontrá-lo no meio deles como uma criança.'
  revised_footnotes:
  - marker: a
    text: Os colchetes indicam texto restaurado ou incerto no manuscrito.
    reason: O testemunho fornecido apresenta “walked” entre colchetes; a tradução conserva visivelmente essa incerteza textual.
  revision_rationale: A revisão limita-se a restaurar a reciprocidade ou o contexto conversacional expresso por “spoke with Judas”, sem decidir questões que dependem de revisão direta do copta. O restante do texto e a nota preservam as ambiguidades e a incerteza manuscrita do testemunho fornecido.
