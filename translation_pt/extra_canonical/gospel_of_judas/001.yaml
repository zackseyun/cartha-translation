    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: pt
  text: 'Esta é a mensagem secreta de julgamento que Jesus transmitiu a Judas Iscariotes ao longo de oito dias, três dias antes de celebrar a Páscoa.


    Quando apareceu na terra, ele realizou sinais e grandes maravilhas para a salvação da humanidade. Alguns [andaram][a] no caminho da justiça, mas outros andaram em sua transgressão; por isso, foram chamados os doze discípulos. Ele começou a lhes falar sobre os mistérios que estão além do mundo e sobre o que aconteceria no fim. Muitas vezes, não se revelava aos discípulos, mas era possível encontrá-lo no meio deles como uma criança.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes indicam texto restaurado ou incerto no manuscrito.
    reason: O testemunho fornecido apresenta “walked” entre colchetes; a tradução conserva visivelmente essa incerteza textual.
lexical_decisions:
- source_word: secret message of judgment
  choice: mensagem secreta de julgamento
  rationale: Mantém a formulação e a tensão semântica do testemunho inglês fornecido, sem reinterpretar “judgment” como “revelação” ou “condenação” antes da revisão do copta.
- source_word: over a period of eight days
  choice: ao longo de oito dias
  rationale: Expressa naturalmente a duração indicada pelo testemunho.
- source_word: the way of righteousness
  choice: o caminho da justiça
  rationale: Preserva a metáfora do caminho e o sentido ético-religioso de “righteousness” em linguagem portuguesa corrente e digna.
- source_word: mysteries beyond the world
  choice: os mistérios que estão além do mundo
  rationale: Evita definir indevidamente a natureza espacial, cósmica ou transcendente desses mistérios.
- source_word: as a child
  choice: como uma criança
  rationale: Conserva a comparação direta e sua possível ambiguidade, sem explicar a aparência ou identidade da criança.
theological_decisions:
- issue: Sentido de “judgment” no título de abertura
  choice: julgamento
  alternative: juízo; condenação; revelação
  rationale: “Julgamento” reproduz o testemunho disponível sem impor uma leitura escatológica, condenatória ou revelatória mais específica.
- issue: Relação causal no chamado dos doze
  choice: por isso, foram chamados os doze discípulos
  alternative: então os doze discípulos foram chamados
  rationale: Mantém o nexo expresso por “so”, embora sua relação exata com as duas formas de conduta permaneça aberta.
- issue: Modo da presença de Jesus entre os discípulos
  choice: era possível encontrá-lo no meio deles como uma criança
  alternative: ele aparecia no meio deles como uma criança
  rationale: Preserva a distinção do testemunho entre não se revelar e ser encontrado, sem converter o enunciado explicitamente em uma transformação ou aparição.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. A redação é provisória porque se baseia no testemunho inglês de domínio público fornecido; a revisão direta do copta do Códice Tchacos 3 ainda está pendente. Mantiveram-se a concisão introdutória, as ambiguidades teológicas e a marca de restauração manuscrita.
