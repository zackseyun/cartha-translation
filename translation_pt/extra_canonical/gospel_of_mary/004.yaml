  revised_footnotes:
  - marker: a
    text: Os colchetes em “[Ele]” e “[disse]”, assim como nos demais termos entre colchetes, preservam sinais de palavras restauradas ou incertas no testemunho usado para esta versão. Em português, “[Ele]” concorda com “poder”.
