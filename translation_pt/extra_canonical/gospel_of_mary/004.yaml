base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/004.yaml
  text: 'Desire said, “I did not see you going down, but now I see you going up. So why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you did not see or know me. To you I was just a garment, and you did not recognize me.” When it said these things, it left, rejoicing greatly.


    Again, it came to the third power, called “Ignorance.” [It] questioned the soul and [said], “Where are you going? You are bound in wickedness. Since you are bound, do not judge!”


    [And] the soul said, “Why do you judge me, since I have not judged? I was bound, even though I have not bound. They did not recognize me, but I have recognized that everything will dissolve—both the things of the [earth] and the things of [heaven].”


    When the soul had overcome the third power, it went up and saw the fourth power, which took seven forms:


    The first form is Darkness;

    The second, Desire;

    The third, Ignorance;

    The fourth, Zeal for Death;

    The fifth, the Kingdom of the Flesh;

    The sixth, the Foolish “Wisdom” of Flesh;

    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They ask the soul, “Where do you come from, you murderer, and where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed, what surrounds me has been overcome, my desire is gone, and ignorance has died. In a [world] I was released from a world, [and] in a type from a type which is above, and from the chain of forgetfulness, which exists only for a time. From now on, I will receive the rest of the time of the season of the age in silence.”


    When Mary had said these things, she fell silent, because the Savior had spoken with her up to this point.'
translation:
  language: pt
  text: 'O Desejo disse: “Não vi você descendo, mas agora vejo que está subindo. Então, por que mente, já que pertence a mim?”


    A alma respondeu: “Eu vi você, mas você não me viu nem me conheceu. Para você, eu era apenas uma veste, e você não me reconheceu.” Depois de dizer essas coisas, ela partiu, alegrando-se muito.


    Novamente, ela chegou ao terceiro poder, chamado “Ignorância”. [Ele][a] interrogou a alma e [disse]: “Aonde você vai? Você está presa à maldade. Já que está presa, não julgue!”


    [E] a alma disse: “Por que você me julga, se eu não julguei? Fui presa, embora não tenha prendido. Eles não me reconheceram, mas eu reconheci que tudo se dissolverá — tanto as coisas da [terra] como as coisas do [céu].”


    Depois de vencer o terceiro poder, a alma subiu e viu o quarto poder, que assumiu sete formas:


    A primeira forma é a Escuridão;

    a segunda, o Desejo;

    a terceira, a Ignorância;

    a quarta, o Zelo pela Morte;

    a quinta, o Reino da Carne;

    a sexta, a “Sabedoria” Insensata da Carne;

    a sétima, a “Sabedoria” da Ira.


    Esses são os sete poderes da Cólera.


    Eles perguntam à alma: “De onde você vem, assassina, e para onde vai, vencedora do espaço?”


    A alma respondeu: “Aquilo que me prende foi morto; aquilo que me cerca foi vencido; meu desejo desapareceu, e a ignorância morreu. Em um [mundo], fui libertada de um mundo; [e] em uma forma, de uma forma que está acima; e da corrente do esquecimento, que existe apenas por algum tempo. De agora em diante, receberei em silêncio o repouso do tempo, da estação e da era.”[b]


    Depois de dizer essas coisas, Maria se calou, pois o Salvador havia falado com ela até esse ponto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os colchetes em “[Ele]” e “[disse]”, assim como nos demais termos entre colchetes, preservam sinais de palavras restauradas ou incertas no testemunho usado para esta versão.
    reason: Esclarecer ao leitor que os colchetes pertencem à situação textual e não são simples pontuação editorial.
  - marker: b
    text: 'A frase final é de interpretação incerta. Também pode ser entendida mais literalmente como: “receberei o restante do tempo da estação da era em silêncio”.'
    reason: Preservar a ambiguidade sintática e semântica da cláusula sobre repouso, tempo, estação e era.
lexical_decisions:
- source_word: Desire
  choice: Desejo
  rationale: Mantém a personificação e corresponde naturalmente ao nome do poder em português.
- source_word: soul
  choice: alma
  rationale: É o equivalente tradicional e claro, preservando o referente feminino que ajuda a distinguir a alma dos poderes.
- source_word: power
  choice: poder
  rationale: Preserva a linguagem cosmológica do testemunho sem interpretá-la como autoridade, espírito ou entidade demoníaca.
- source_word: garment
  choice: veste
  rationale: Mantém a metáfora concreta em registro digno; “roupa” seria mais coloquial.
- source_word: type
  choice: forma
  rationale: “Tipo” seria possível, mas em português pode soar classificatório; “forma” preserva melhor o paralelismo cosmológico, embora o trecho permaneça obscuro.
- source_word: Wrath
  choice: Cólera
  rationale: Distingue o poder coletivo final da sétima forma, traduzida como “Ira”, e conserva o tom personificado.
- source_word: space
  choice: espaço
  rationale: Tradução formal que não resolve o possível sentido cosmológico do termo.
- source_word: rest
  choice: repouso
  rationale: Preserva a possível densidade escatológica e o sentido de descanso, sem reduzi-lo a mera porção restante.
theological_decisions:
- issue: Relação da alma com o Desejo
  choice: “já que pertence a mim”
  alternative: “já que é minha”
  rationale: Conserva a alegação de posse feita pelo poder sem endossá-la nem explicá-la.
- issue: “I was bound, even though I have not bound”
  choice: “Fui presa, embora não tenha prendido”
  alternative: “Fui amarrada, embora não tenha amarrado”
  rationale: Mantém a assimetria e a dificuldade do texto, sem acrescentar objeto ou agente inexistente.
- issue: Libertação entre mundo e forma
  choice: Preservar a construção repetitiva e obscura
  alternative: Parafrasear como libertação do mundo material e de sua imagem superior
  rationale: Evita importar uma cosmologia específica que não é explicitada no testemunho fornecido.
- issue: Cláusula final sobre tempo, estação e era
  choice: “receberei em silêncio o repouso do tempo, da estação e da era”
  alternative: “receberei o restante do tempo da estação da era em silêncio”
  rationale: A sequência é textualmente difícil. A escolha produz português legível, mas não pretende resolver definitivamente as relações sintáticas; a nota registra a incerteza.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. As personificações recebem iniciais maiúsculas. Mantiveram-se as restaurações entre colchetes e construções difíceis quando uma paráfrase exigiria decisões cosmológicas não asseguradas. Esta minuta é necessariamente provisória, pois foi elaborada a partir do testemunho inglês público fornecido; a revisão direta do copta e dos fragmentos gregos continua pendente.
