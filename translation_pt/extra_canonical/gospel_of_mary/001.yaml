  footnotes:
  - marker: a
    text: Os colchetes indicam palavras restauradas em uma passagem danificada ou incompleta do manuscrito.
    reason: Preservar com transparência os sinais editoriais presentes no testemunho fornecido.
  - marker: b
    text: A formulação paradoxal distingue o pecado como realidade independente dos atos pelos quais as pessoas o produzem; “adultério” também pode ter alcance figurado, mas o texto não o esclarece.
    reason: Sinalizar a ambiguidade teológica e semântica sem resolvê-la no corpo da tradução.
  - marker: c
    text: A construção “até as realidades de cada natureza” é difícil e provisória; também pode ser entendida de modo mais literal como “até as coisas de toda natureza”.
    reason: O testemunho inglês assinala uma formulação obscura, e ainda falta revisão direta do copta e dos fragmentos gregos.
  - marker: d
    text: A passagem entre colchetes é uma restauração editorial sobre uma lacuna textual.
    reason: Informar que a continuidade da frase não está integralmente preservada.
  - marker: e
    text: A relação entre contentamento e as “diversas imagens da natureza” é obscura no testemunho disponível; a tradução evita explicar a expressão.
    reason: Preservar uma dificuldade real do texto enquanto se aguarda consulta direta às fontes antigas.
lexical_decisions:
- source_word: matter
  choice: matéria
  rationale: Mantém o termo conceitual central do testemunho e sua relação reiterada com natureza, dissolução e paixão.
- source_word: roots / root
  choice: raízes / raiz
  rationale: Preserva a metáfora cosmológica sem substituí-la por uma interpretação como origem ou essência.
- source_word: the Good
  choice: o Bem
  rationale: A forma substantivada e capitalizada conserva o caráter aparentemente titular ou personificado da expressão.
- source_word: adultery
  choice: adultério
  rationale: Mantém o vocábulo concreto e teologicamente tenso do testemunho, sem reduzi-lo a imoralidade ou infidelidade em sentido genérico.
- source_word: passion
  choice: paixão
  rationale: Preserva a amplitude do termo, que pode indicar desejo, afecção ou impulso, sem resolver sua nuance.
- source_word: content at heart
  choice: tenham o coração contente
  rationale: Usa português natural e conserva tanto a interioridade quanto o contraste lexical com descontentamento e contentamento.
theological_decisions:
- issue: A afirmação de que o pecado não existe
  choice: “O pecado não existe por si mesmo; são vocês que produzem o pecado”
  alternative: “O pecado não existe”
  rationale: A expressão “por si mesmo” explicita o contraste interno entre a inexistência do pecado e sua produção pelos agentes, sem transformar a frase em negação da realidade dos atos chamados pecado.
- issue: A natureza do adultério como aquilo que é chamado pecado
  choice: Preservar literalmente “natureza do adultério” e “chamada ‘pecado’”
  alternative: Interpretar como desejo sexual, infidelidade espiritual ou corrupção
  rationale: O texto fornecido não determina qual dessas leituras é pretendida; a tradução mantém a tensão e evita impor doutrina.
- issue: O Bem como agente de restauração
  choice: “o Bem veio”
  alternative: “o Bom veio” ou identificar explicitamente o Bem com uma pessoa divina
  rationale: A substantivação abstrata reproduz o testemunho sem decidir a identidade metafísica do agente.
- issue: Restauração de cada natureza em sua raiz
  choice: Manter pronome singular em “restaurá-la em sua raiz”
  alternative: “restaurar todas elas em suas raízes”
  rationale: O singular acompanha a formulação recebida e preserva a possível referência coletiva ou distributiva de “cada natureza”.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com tratamento alternado conforme a fala: “tu” nas formas dirigidas individualmente ao Salvador e “vocês” nas palavras ao grupo. Tradução provisória baseada no testemunho inglês de domínio público fornecido; requer revisão direta do copta e dos fragmentos gregos. Os colchetes do texto-base foram preservados, e todas as notas estão marcadas no texto principal.'
