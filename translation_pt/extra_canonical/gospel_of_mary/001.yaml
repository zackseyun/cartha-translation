  text: '“Then will [matter] be [destroyed], or not?”


    The Savior said, “Every nature, every form, every creature exists in and with each other, but they’ll dissolve again into their own roots, because the nature of matter dissolves into its nature alone. Anyone who has ears to hear should hear!”


    Peter said to him, “Since you’ve explained everything to us, tell us one more thing. What’s the sin of the world?”


    The Savior said, “Sin doesn’t exist, but you’re the ones who make sin when you act in accordance with the nature of adultery, which is called ‘sin.’ That’s why the Good came among you, up to the things of every nature in order to restore it within its root.”


    Then he continued and said, “That’s why you get sick and die, because [you love what tricks you. Anyone who] can understand should understand!


    “Matter [gave birth to] a passion that has no image because it comes from what’s contrary to nature. Then confusion arises in the whole body. That’s why I told you to be content at heart. If you’re discontented, find contentment in the presence of the various images of nature. Anyone who has ears to hear should hear!”'
translation:
  language: pt
  text: '“Então, a [matéria] será [destruída] ou não?”[a]


    O Salvador disse: “Toda natureza, toda forma e toda criatura existem umas nas outras e umas com as outras, mas voltarão a se dissolver em suas próprias raízes, pois a natureza da matéria se dissolve apenas em sua própria natureza. Quem tem ouvidos para ouvir, ouça!”


    Pedro lhe disse: “Já que nos explicaste tudo, dize-nos ainda uma coisa: o que é o pecado do mundo?”


    O Salvador disse: “O pecado não existe por si mesmo; são vocês que produzem o pecado quando agem de acordo com a natureza do adultério, que é chamada ‘pecado’.[b] Foi por isso que o Bem veio para o meio de vocês, até as realidades de cada natureza, a fim de restaurá-la em sua raiz.”[c]


    Então ele prosseguiu: “É por isso que vocês adoecem e morrem: porque [amam aquilo que os engana. Quem] puder compreender, compreenda![d]


    “A matéria [deu origem a] uma paixão sem imagem, pois ela procede do que é contrário à natureza. Então surge confusão em todo o corpo. Por isso eu lhes disse: tenham o coração contente. Se estiverem descontentes, encontrem contentamento diante das diversas imagens da natureza.[e] Quem tem ouvidos para ouvir, ouça!”'
