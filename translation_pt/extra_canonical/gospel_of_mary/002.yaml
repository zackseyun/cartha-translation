review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês provisório. Contudo, “Recebam a minha paz” atenua o imperativo “Acquire my peace”, que pede uma formulação de apropriação, e “nem façam uma lei como o legislador” soa sintaticamente incompleta em português e não exprime com clareza o sentido comparativo de “like the lawgiver”. A formulação final também deve conservar a modalidade de possibilidade em “or you may be bound by it”. A subida aos gentios é mantida como “subir até os gentios”, embora seja uma expressão menos idiomática, por fidelidade ao testemunho disponível.
  naturalness: 'O registro é claro, contemporâneo e adequado. Foram feitos ajustes pontuais para melhorar a fluência: “saudou todos eles”, “Façam sua a minha paz”, “à maneira do legislador” e clíticos em “não o pouparam”/“nos poupariam”.'
  terminology: “Bem-aventurado”, “Filho da Humanidade”, “gentios”, “evangelho” e “legislador” são escolhas defensáveis e coerentes com a intenção provisória de não harmonizar o texto com fórmulas tradicionais. “Reino” é mantido conforme o rascunho. As notas preservam adequadamente as ambiguidades indicadas, com a ressalva de que a revisão dos testemunhos coptas e gregos continua necessária.
  issues:
  - severity: medium
    issue: “Recebam a minha paz” para “Acquire my peace”
    rationale: “Recebam” apresenta a paz sobretudo como algo passivamente concedido, enquanto “acquire” requer que os destinatários a obtenham ou se apropriem dela. “Façam sua a minha paz” preserva esse apelo de modo natural, sem sugerir compra ou mérito.
  - severity: medium
    issue: Construção “façam uma lei como o legislador”
    rationale: Em português, a comparação fica elíptica e pode sugerir que a lei se assemelha ao legislador. “Não instituam uma lei à maneira do legislador” torna explícita a comparação de modo de legislar sem identificar o legislador.
  - severity: low
    issue: Modalidade de “lest you be bound by it”
    rationale: “Para que não fiquem presos” pode soar como finalidade direta. “Ou poderão ficar presos a ela” reproduz melhor a advertência consequencial e potencial do testemunho inglês.
  revised_text: 'Depois de dizer essas coisas, o Bem-aventurado saudou todos eles e disse: “A paz esteja com vocês! Façam sua a minha paz. Tenham cuidado para que ninguém os engane, dizendo: ‘Vejam aqui!’ ou ‘Vejam ali!’, pois o Filho da Humanidade está dentro de vocês.[a] Sigam-no! Aqueles que o buscam o encontrarão.


    “Vão, portanto, e anunciem o evangelho do Reino. Não estabeleçam nenhuma regra além daquilo que lhes dei, nem instituam uma lei à maneira do legislador, ou poderão ficar presos a ela.” Depois de dizer essas coisas, ele partiu.


    Eles, porém, ficaram aflitos e choraram amargamente. Diziam: “Como poderemos subir até os gentios para anunciar o evangelho do Reino do Filho da Humanidade?[b] Se não o pouparam, por que nos poupariam?”'
  revised_footnotes:
  - marker: a
    text: “Dentro de vocês” também pode ser entendido coletivamente como “no meio de vocês”; a revisão direta dos testemunhos coptas e gregos ainda é necessária.
    reason: Preservar a ambiguidade espacial e comunitária da expressão conforme o estado provisório da fonte.
  - marker: b
    text: A expressão “Reino do Filho da Humanidade” pode indicar o Reino pertencente a ele ou associado a ele; o texto não explicita a relação.
    reason: Evitar definir silenciosamente a relação teológica expressa pela construção genitiva.
  revision_rationale: 'A revisão mantém a estrutura, os termos distintivos e as ambiguidades do rascunho, mas corrige três pontos em que a redação portuguesa suavizava ou deixava menos clara a construção do testemunho inglês: a apropriação da paz, a advertência contra legislar à maneira do legislador e a consequência potencial de ficar ligado à lei. “Subir até os gentios” é conservado intencionalmente para não apagar o “go up” do texto-base provisório.'
