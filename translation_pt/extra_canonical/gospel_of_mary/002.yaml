base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: pt
  text: 'Depois de dizer essas coisas, o Bem-aventurado saudou a todos e disse: “A paz esteja com vocês! Recebam a minha paz. Tenham cuidado para que ninguém os engane, dizendo: ‘Vejam aqui!’ ou ‘Vejam ali!’, pois o Filho da Humanidade está dentro de vocês.[a] Sigam-no! Aqueles que o buscam o encontrarão.


    “Vão, portanto, e anunciem o evangelho do Reino. Não estabeleçam nenhuma regra além daquilo que lhes dei, nem façam uma lei como o legislador, para que não fiquem presos a ela.” Depois de dizer essas coisas, ele partiu.


    Eles, porém, ficaram aflitos e choraram amargamente. Diziam: “Como poderemos ir até os gentios para anunciar o evangelho do Reino do Filho da Humanidade?[b] Se não pouparam a ele, por que poupariam a nós?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Dentro de vocês” também pode ser entendido coletivamente como “no meio de vocês”; a revisão direta dos testemunhos coptas e gregos ainda é necessária.
    reason: Preservar a ambiguidade espacial e comunitária da expressão conforme o estado provisório da fonte.
  - marker: b
    text: A expressão “Reino do Filho da Humanidade” pode indicar o Reino pertencente a ele ou associado a ele; o texto não explicita a relação.
    reason: Evitar definir silenciosamente a relação teológica expressa pela construção genitiva.
lexical_decisions:
- source_word: the Blessed One
  choice: o Bem-aventurado
  rationale: Mantém o caráter titular e reverente da expressão sem identificar além do que o testemunho fornecido permite.
- source_word: Acquire my peace
  choice: Recebam a minha paz
  rationale: Em português atual, “recebam” comunica naturalmente a apropriação da paz oferecida; “adquiram” poderia sugerir compra ou obtenção por mérito.
- source_word: Son of Humanity
  choice: Filho da Humanidade
  rationale: Preserva a formulação inclusiva e distintiva do testemunho inglês, evitando substituí-la silenciosamente pela expressão tradicional “Filho do Homem” antes da revisão copta e grega.
- source_word: within you
  choice: dentro de vocês
  rationale: Conserva a leitura interior do testemunho disponível e também a possível ambiguidade do plural, esclarecida em nota.
- source_word: Gentiles
  choice: gentios
  rationale: Termo bíblico corrente e inteligível para povos não judeus, sem ampliar a formulação para uma interpretação específica.
- source_word: lawgiver
  choice: legislador
  rationale: Equivalente formal e neutro, sem identificar explicitamente a figura com Moisés, identificação não expressa no testemunho fornecido.
theological_decisions:
- issue: Localização do Filho da Humanidade
  choice: “está dentro de vocês”
  alternative: “está entre vocês”
  rationale: O testemunho-base traz “within you”. A nota preserva a possível amplitude sem resolver a questão doutrinariamente.
- issue: Relação entre regras, lei e liberdade
  choice: “para que não fiquem presos a ela”
  alternative: “para que não sejam aprisionados por ela”
  rationale: Mantém a advertência contra ser vinculado pela lei criada, sem transformar a passagem numa rejeição geral de toda lei.
- issue: Extensão da expressão sobre o Reino
  choice: “o evangelho do Reino do Filho da Humanidade”
  alternative: “o evangelho do Reino”
  rationale: No último parágrafo, conserva toda a cadeia genitiva do testemunho, sem decidir se o Filho governa o Reino, se o Reino lhe pertence ou se a expressão qualifica a mensagem.
translation_notes:
  register: 'Português contemporâneo, digno e amplamente compreensível, com formas brasileiras naturais (“vocês”) e vocabulário bíblico de circulação internacional. Rascunho necessariamente provisório: foi elaborado a partir do testemunho inglês público fornecido, pois a revisão direta do copta e dos fragmentos gregos está pendente.'
