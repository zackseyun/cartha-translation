  yaml_path: translation/extra_canonical/gospel_of_mary/005.yaml
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: pt
  text: 'André respondeu aos irmãos e às irmãs:[a] “Digam o que quiserem sobre o que ela disse. Quanto a mim, não creio que o Salvador tenha dito essas coisas, pois esses ensinamentos parecem ideias diferentes.”


    Pedro manifestou as mesmas preocupações. Perguntou-lhes a respeito do Salvador: “Por acaso ele falou em particular com uma mulher, sem o nosso conhecimento, em vez de falar abertamente conosco? Agora devemos mudar de posição e todos ouvi-la? Será que ele a preferiu a nós?”


    Então Maria chorou e disse a Pedro: “Meu irmão Pedro, o que você está pensando? Acha mesmo que inventei isso sozinha em meu coração ou que estou mentindo a respeito do Salvador?”


    Levi respondeu a Pedro: “Pedro, você sempre foi irascível. Agora vejo você discutindo com esta mulher como fazem os adversários. Mas, se o Salvador a tornou digna, quem é você para rejeitá-la? Certamente o Salvador a conhece muito bem. Foi por isso que a amou mais do que a nós.


    “Em vez disso, devemos nos envergonhar, revestir-nos da Humanidade perfeita,[b] adquiri-la para nós, como ele nos instruiu, e anunciar o evangelho, sem estabelecer nenhuma outra regra ou lei além do que o Salvador disse.”


    Quando [Levi disse essas coisas],[c] eles começaram a sair para ensinar e anunciar o evangelho.


    O Evangelho


    Segundo


    Maria'
