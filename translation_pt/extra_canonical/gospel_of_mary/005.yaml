lexical_decisions:
- source_word: brothers (and sisters)
  choice: irmãos e às irmãs
  rationale: Torna explícita a inclusão indicada pelo testemunho inglês, mantendo linguagem natural em português.
- source_word: different ideas
  choice: ideias diferentes
  rationale: Preserva a formulação aberta e um tanto vaga do testemunho, sem especificar que sejam heréticas ou contraditórias.
- source_word: angry
  choice: irascível
  rationale: Expressa uma disposição recorrente à ira, coerente com “sempre”, sem reduzir a fala a um estado momentâneo.
- source_word: perfect Humanity
  choice: Humanidade perfeita
  rationale: Mantém a capitalização e a possível função conceitual ou técnica da expressão no testemunho, sem interpretá-la como uma doutrina específica.
- source_word: preach the gospel
  choice: anunciar o evangelho
  rationale: Formulação corrente, digna e compreensível, adequada tanto à proclamação quanto à atividade missionária.
theological_decisions:
- issue: Autoridade da revelação atribuída a Maria
  choice: Preservar as alegações e contestações de cada personagem sem validá-las editorialmente
  alternative: Apresentar a fala de Maria como revelação comprovada ou a objeção de Pedro como correta
  rationale: A passagem encena um conflito de autoridade; a tradução não deve solucionar a tensão que o texto mantém.
- issue: Preferência e amor do Salvador por Maria
  choice: “a amou mais do que a nós”
  alternative: Suavizar para “a estimava muito”
  rationale: Mantém a comparação explícita do testemunho e sua tensão teológica e comunitária.
- issue: “Humanidade perfeita” como conceito
  choice: Conservar a expressão com inicial maiúscula e acrescentar nota de cautela
  alternative: Interpretar como “ser humano perfeito”, “nova humanidade” ou “natureza humana perfeita”
  rationale: A revisão direta do copta e do grego ainda está pendente; escolher uma dessas paráfrases resolveria prematuramente a ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A redação é provisória porque se baseia no testemunho inglês de domínio público; a consulta direta ao copta e aos fragmentos gregos está pendente. Mantiveram-se o conflito sobre autoridade, a comparação do amor do Salvador e a ambiguidade de “Humanidade perfeita”.
