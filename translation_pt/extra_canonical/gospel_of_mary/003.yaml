review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto a testemunha inglesa provisória, preservando as restaurações entre colchetes, a terminologia distinta de «mente», «alma» e «espírito» e a lacuna de quatro páginas. Contudo, «voltou o coração deles» não expressa adequadamente «turned their hearts [toward] the Good», e o fim da última fala regulariza em excesso uma frase que a testemunha deixa interrompida e editorialmente incerta.
  naturalness: O registro é moderno, claro e apropriado. As mudanças propostas tornam mais idiomática a exortação inicial («nem deixem que...»), corrigem a construção referente ao coração e conservam a interrupção final sem criar uma conclusão sintática indevida.
  terminology: «Bem», «Salvador», «Senhor», «mente», «alma», «espírito» e «seres humanos» são escolhas adequadas e coerentes. «Irmãos e irmãs» reflete corretamente a inclusão indicada pela testemunha de base.
  issues:
  - severity: medium
    issue: «voltou o coração deles [para] o Bem»
    rationale: Em português, «voltar o coração» normalmente significa fazê-lo retornar, e não orientá-lo para algo. A testemunha diz que Maria dirigiu/orientou o coração deles [para] o Bem.
  - severity: medium
    issue: «[e] é ela que…» no final lacunoso
    rationale: 'A testemunha preserva uma construção incompleta: «[and] it [that …]». A redação atual introduz «é ela que», fornecendo uma estrutura relativa e uma resolução gramatical que o texto interrompido não atesta. Deve-se manter a incerteza com colchetes e reticências.'
