translation:
  language: pt
  text: 'Então Maria se levantou e saudou a todos. Disse a seus irmãos e irmãs[a]: “Não chorem nem se entristeçam, e que o coração de vocês não fique dividido, pois a graça dele estará com todos vocês e os protegerá. Em vez disso, louvemos sua grandeza, porque ele nos preparou e nos fez seres humanos[b].”


    Depois que Maria disse isso, voltou o coração deles [para] o Bem, e eles [começaram] a discutir as palavras do [Salvador].


    Pedro disse a Maria: “Irmã, sabemos que o Salvador amava você mais do que todas as outras mulheres. Conte-nos as palavras do Salvador de que você se lembra — aquilo que você sabe e nós não sabemos, e que não ouvimos.”


    Maria respondeu: “Vou contar a vocês o que lhes está oculto.” Então começou a lhes dizer estas palavras: “Eu”, disse ela, “vi o Senhor numa visão e lhe disse: ‘Senhor, hoje vi você numa visão.’


    “Ele me respondeu: ‘Feliz é você, porque não vacilou ao me ver. Pois onde está a mente, ali está o tesouro.’


    “Eu lhe disse: ‘Senhor, aquele que vê a visão a vê na alma ou no espírito?’[c]


    “O Salvador respondeu: ‘Não a vê na alma nem no espírito; mas é a mente, que [existe] entre os dois, que vê a visão, [e] é ela que…’[d]


    [Faltam as páginas 11 a 14 do manuscrito.]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A testemunha inglesa traz literalmente “irmãos (e irmãs)”; a tradução explicita ambos.
    reason: Registrar a forma inclusiva e a incerteza refletida pela testemunha de base.
  - marker: b
    text: 'Ou: “nos fez humanos”. A possível ênfase ou sentido técnico da expressão permanece incerto.'
    reason: Preservar a tensão lexical sem impor uma interpretação antropológica específica.
  - marker: c
    text: A testemunha marca “na alma” e “no espírito” como alternativas explícitas na pergunta.
    reason: Explicar em português corrido o sinal editorial com barras usado na fonte inglesa.
  - marker: d
    text: A frase se interrompe porque o manuscrito fica lacunoso; em seguida faltam quatro páginas.
    reason: Distinguir a perda física do manuscrito de uma simples omissão editorial.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: irmãos e irmãs
  rationale: Explicita o sentido inclusivo indicado pela testemunha inglesa, em português natural, sem depender do masculino genérico.
- source_word: Humans
  choice: seres humanos
  rationale: Preserva a ênfase antropológica da inicial maiúscula inglesa sem usar em português uma capitalização artificial ou potencialmente doutrinária.
- source_word: the Good
  choice: o Bem
  rationale: Mantém a possível força substantivada ou técnica da expressão, bem como sua capitalização.
- source_word: mind
  choice: mente
  rationale: Distingue a faculdade mental de “alma” e “espírito”, conforme o contraste explícito do texto.
- source_word: didn’t waver
  choice: não vacilou
  rationale: Conserva a ideia de firmeza diante da visão sem restringi-la indevidamente a medo, dúvida ou incredulidade.
- source_word: debate
  choice: discutir
  rationale: Expressa a troca deliberativa sobre as palavras do Salvador sem necessariamente implicar hostilidade.
theological_decisions:
- issue: A graça e a proteção referidas pelo pronome masculino
  choice: “a graça dele” e “os protegerá”
  alternative: Identificar explicitamente o referente como “a graça do Salvador”
  rationale: O trecho fornecido usa apenas o pronome; preservar o referente implícito evita resolver uma ligação que depende do contexto perdido ou anterior.
- issue: O Salvador amava Maria mais do que as outras mulheres
  choice: Tradução direta da comparação limitada às mulheres
  alternative: “mais do que todos os discípulos”
  rationale: A testemunha fornecida diz “all other women”; ampliar a comparação importaria uma tradição textual ou interpretação não presente nesta base.
- issue: Relação entre mente, alma e espírito
  choice: Manter a mente como aquilo que está “entre os dois”
  alternative: Explicar a mente como uma parte, faculdade ou mediadora da alma
  rationale: O texto apresenta uma antropologia deliberadamente tensa e incompleta; não se deve harmonizá-la com um sistema teológico posterior.
- issue: “Nos fez seres humanos”
  choice: Conservar a formulação sem explicação doutrinária
  alternative: Interpretar como restauração, iluminação ou humanidade espiritual
  rationale: A frase pode ter sentido técnico no escrito, mas a base provisória não permite fixá-lo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Esta é uma tradução provisória baseada na testemunha inglesa pública fornecida; a revisão direta do copta e dos fragmentos gregos continua pendente. Colchetes foram mantidos onde a testemunha sinaliza restauração editorial, e a lacuna material foi indicada explicitamente.
