translation:
  language: pt
  text: 'Se, então, ele é incompreensível, por conseguinte não pode ser conhecido; nenhum pensamento pode apreendê-lo, ele é invisível para tudo, indizível por quaisquer palavras e está além do alcance de qualquer mão. Somente ele conhece a si mesmo tal como ele [] é, e conhece sua forma, sua grandeza e sua dimensão tal como são. E, porque pode conceber a si mesmo, ver a si mesmo, nomear a si mesmo e compreender a si mesmo, ele é o único cujo próprio intelecto, próprio olho, própria boca e própria forma equivalem ao seu próprio ser. Assim, ele é aquilo que concebe, aquilo que vê, aquilo que diz e aquilo que compreende: ele é o inconcebível, o indizível, o inapreensível e o imutável. Já aquilo que ele concebe, vê e diz, aquilo em que pensou, é sustento, alegria, verdade, agrado e repouso. Ele ultrapassa toda sabedoria e está acima de todo intelecto, de toda glória, de toda beleza, de toda doçura, de toda grandeza, de toda profundidade e de toda altura.


    Aquele que é incognoscível por natureza e possui todos os grandes atributos que enumerei pode, se quiser, conceder, da riqueza de sua doçura, o conhecimento pelo qual ele é conhecido. Seu poder para fazer isso é sua vontade. Contudo, em silêncio, o Grande contém a si mesmo, ele que faz as Totalidades[a] virem à existência eterna.


    [] Em sentido estrito, ele gera a si mesmo de modo indizível, pois somente ele é autogerado, uma vez que foi concebido de si mesmo e conhece a si mesmo tal como é. De sua grandeza infinita, de sua sabedoria insondável, de seu poder imensurável e de sua doçura que está além de todo sabor, ele produz tudo quanto é digno de seu respeito, glória, honra e louvor. Ele projeta a si mesmo no modo da geração, recebendo glória e louvor, honra e amor; e glorifica e louva a si mesmo, dando a si mesmo honra e amor. Desse modo, ele tem um Filho, que subsiste nele. O Pai permanece em silêncio a respeito do Filho, que é indizível no Indizível, invisível no Invisível, inapreensível no Inapreensível e incompreensível no Incompreensível.[b]


    Desse modo, o Filho existe no Pai para sempre. Como explicamos anteriormente, de modo não gerado, o Pai conhece a si mesmo em si mesmo, ele que gerou a si mesmo pelo pensamento — o pensamento a respeito dele —, sendo a percepção [] de si mesmo, o [...] de sua natureza eterna. Contudo, em sentido estrito, isso é o silêncio, a sabedoria e a dádiva, se é correto dar-lhe esses nomes. Assim como o Pai existe em sentido estrito — antes dele nenhum [outro existia], e além [dele] não há nenhum outro que seja não gerado —, também [o Filho] existe em sentido estrito: antes dele nenhum outro existia, e depois dele não existirá outro filho. Portanto, ele é o Primogênito e o Filho único. É o Primogênito porque ninguém existe antes dele, e é o Filho único porque ninguém virá depois dele. Além disso, ele tem seu fruto, o qual não pode ser conhecido por causa de sua grandeza transcendente. No entanto, pela riqueza de sua doçura, ele quis que seu fruto se tornasse conhecido. E revelou um poder inexplicável
    e o mesclou com a grande riqueza de sua generosidade.


    [a] “Totalidades” preserva um termo técnico e coletivo do tratado; pode designar o conjunto das realidades que procedem do princípio divino.


    [b] A construção do texto de base permite alguma incerteza quanto ao referente de “permanecendo em silêncio a respeito dele”. A tradução explicita Pai e Filho apenas para tornar a frase legível, sem eliminar essa incerteza.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Totalidades” preserva um termo técnico e coletivo do tratado; pode designar o conjunto das realidades que procedem do princípio divino.
    reason: O termo é incomum em português e tem função conceitual específica no tratado.
  - marker: b
    text: A construção do texto de base permite alguma incerteza quanto ao referente de “permanecendo em silêncio a respeito dele”. A tradução explicita Pai e Filho apenas para tornar a frase legível, sem eliminar essa incerteza.
    reason: Registra uma ambiguidade genuína que a sintaxe natural do português exige esclarecer parcialmente.
lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: incompreensível / inapreensível
  rationale: Mantém a distinção entre não poder ser compreendido e não poder ser captado pelo pensamento.
- source_word: mind
  choice: intelecto
  rationale: Neste contexto metafísico, “intelecto” comunica melhor a faculdade noética do que o amplo “mente”.
- source_word: scale
  choice: dimensão
  rationale: Expressa extensão ou magnitude sem sugerir apenas uma escala graduada moderna.
- source_word: Totalities
  choice: Totalidades
  rationale: Preserva o caráter técnico e distintivo do termo, com nota explicativa.
- source_word: self-begotten
  choice: autogerado
  rationale: Conserva a afirmação reflexiva e incomum do testemunho sem normalizá-la teologicamente.
- source_word: projects himself
  choice: projeta a si mesmo
  rationale: Retém a terminologia emanacionista do tratado e evita substituí-la por “cria” ou “envia”.
- source_word: Firstborn and only Son
  choice: Primogênito e Filho único
  rationale: Mantém os dois títulos e o contraste explicado pelo próprio texto.
- source_word: sustenance, joyful, true, pleasing, and restful
  choice: sustento, alegria, verdade, agrado e repouso
  rationale: A sintaxe do testemunho é difícil; a nominalização em português produz uma enumeração natural sem decidir se todos os termos são predicados pessoais ou qualidades.
theological_decisions:
- issue: Autogeração do Pai e geração do Filho
  choice: Preservar literalmente ambas as formulações
  alternative: Harmonizar a passagem com categorias trinitárias posteriores
  rationale: O tratado sustenta deliberadamente uma tensão entre autoconhecimento, autogeração e filiação; a tradução não deve impor uma resolução confessional.
- issue: Existência eterna do Filho no Pai
  choice: “o Filho existe no Pai para sempre”
  alternative: “o Filho coexistiu eternamente com o Pai”
  rationale: A primeira opção acompanha a linguagem de inerência do testemunho sem acrescentar uma formulação ontológica posterior.
- issue: Primogênito e Filho único
  choice: Manter a explicação paradoxal do próprio texto
  alternative: Interpretar “primogênito” como primeiro entre muitos filhos
  rationale: 'O trecho define os títulos de modo próprio: ninguém antes dele e nenhum filho depois dele.'
- issue: Referentes pronominais na passagem sobre o Filho
  choice: Explicitar Pai e Filho com nota de incerteza
  alternative: Manter todos os pronomes ambíguos
  rationale: A explicitação mínima torna o português inteligível, enquanto a nota reconhece a ambiguidade sintática do testemunho.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se os colchetes e as reticências entre colchetes para sinalizar lacunas ou restaurações editoriais do manuscrito. Por se tratar de um rascunho baseado no testemunho inglês público, a redação permanece provisória até revisão direta do copta.
