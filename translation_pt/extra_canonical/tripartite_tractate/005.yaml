base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/005.yaml
  text: 'The Father brought forth the All like a small child, like a drop from a spring, like a blossom from [a vine], like [a flower], like a <planting> [. . .], so that it needed to obtain [nourishment] and growth and perfection. He held it back for a season. The one who conceived of it from the first instant of the beginning possessed and beheld it from the first instant of the beginning, but he <concealed> it for those who were the first to originate from him. Not from envy, but that the aeons could not receive their perfection (prematurely) from the first instant of the beginning and could not lift up themselves to the glory (that belongs solely to) the Father, and could not suppose that they possess all this from themselves. Instead, just as he willed to allow them to be able to come into being, so that they could also come into being as perfect entities, at the time of his choosing he granted them the perfect idea of generosity toward them.


    The one he raised up to be a light to those who originated from himself, the one from whom they derive their name, he is the full, complete and perfect Son. He produced him mixed with what emerged out of him, [] [. . .] sharing in the glory [. . .] the Totality, congruent with [. . .], by means of which each is [able] to receive it to [himself], although each did not have this greatness before they were received by it. They, instead, exist only partially in his proper mode and form and greatness. [They] are able to see him and speak of [what they] know about him, because they wear each other, because they are able to grasp [him]. By contrast, [his] mode of being is without comparison, so that the Father could receive honor from each one and could reveal himself, despite his incomparability. Concealed and unseen, they wonder at him in mind. The greatness of his exaltedness is consequently manifested when they speak of him and behold him, hymning him for the riches of his sweetness.'
translation:
  language: pt
  text: 'O Pai produziu o Todo como uma criancinha, como uma gota de uma fonte, como um broto de [uma videira], como [uma flor], como uma <plantação> [. . .], de modo que precisava receber [alimento], crescimento e perfeição. Ele o reteve por algum tempo. Aquele que o concebeu desde o primeiro instante do princípio o possuía e contemplava desde o primeiro instante do princípio, mas o <ocultou> daqueles que foram os primeiros a se originar dele. Não por inveja, mas para que os éons não recebessem sua perfeição (prematuramente) desde o primeiro instante do princípio, não se elevassem à glória (que pertence somente) ao Pai e não supusessem possuir tudo isso por si mesmos. Pelo contrário, assim como quis permitir que viessem a existir, para que também viessem a existir como seres perfeitos, no tempo por ele escolhido concedeu-lhes a ideia perfeita de sua generosidade para com eles.


    Aquele a quem ele elevou para ser luz dos que se originaram dele, aquele de quem eles recebem seu nome, é o Filho pleno, completo e perfeito. Ele o produziu mesclado com o que procedeu dele, [] [. . .] participando da glória [. . .] a Totalidade, em conformidade com [. . .], por meio da qual cada um é [capaz] de recebê-la em [si mesmo], embora nenhum deles tivesse essa grandeza antes de serem recebidos por ela. Eles, porém, existem apenas parcialmente segundo o modo, a forma e a grandeza que lhe são próprios. [Eles] são capazes de vê-lo e de falar sobre [o que] sabem a respeito dele, porque se revestem uns dos outros, porque são capazes de compreendê-[lo]. Em contraste, [seu] modo de ser não admite comparação, para que o Pai recebesse honra de cada um e pudesse revelar-se, apesar de sua incomparabilidade. Oculto e invisível, eles se maravilham com ele em sua mente. Assim, a grandeza de sua exaltação se manifesta quando falam dele e o contemplam, entoando-lhe hinos pelas riquezas de sua
    doçura.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the All
  choice: o Todo
  rationale: Mantém o termo cosmológico como designação substantivada e evita reduzi-lo a uma simples expressão quantitativa.
- source_word: aeons
  choice: éons
  rationale: Conserva o termo técnico do contexto valentiniano, em vez de substituí-lo por 'eras' ou por uma interpretação explicativa.
- source_word: produced / brought forth
  choice: produziu
  rationale: Segue de perto o testemunho fornecido e mantém aberta a natureza precisa da procedência.
- source_word: planting
  choice: plantação
  rationale: Preserva o sentido concreto e o sinal editorial entre sinais angulares, sem tentar reconstruir além do testemunho.
- source_word: wear each other
  choice: se revestem uns dos outros
  rationale: Reproduz a metáfora difícil sem normalizá-la para uma interpretação mais clara, porém menos segura.
- source_word: sweetness
  choice: doçura
  rationale: Preserva a imagem afetiva e laudatória do texto, em registro digno e natural.
theological_decisions:
- issue: O motivo de o Pai ocultar o Todo
  choice: Manter a negação da inveja e a finalidade pedagógica/teleológica expressa no texto
  alternative: Explicar o ato como uma doutrina específica de emanação ou de providência
  rationale: 'O trecho apresenta sua própria tensão: ocultação sem inveja, a fim de impedir perfeição prematura e autoglorificação. A tradução não deve impor uma sistematização externa.'
- issue: A glória do Pai
  choice: Preservar '(que pertence somente) ao Pai' entre parênteses
  alternative: Integrar a exclusividade diretamente à frase sem sinal editorial
  rationale: Os parênteses pertencem ao testemunho fornecido e indicam provável esclarecimento editorial; sua retenção evita confundi-lo com texto seguramente preservado.
- issue: Relação do Filho com aquilo que procede do Pai
  choice: Traduzir literalmente 'mesclado com o que procedeu dele'
  alternative: Resolver como união, consubstancialidade ou composição ontológica específica
  rationale: A passagem está fragmentária e teologicamente ambígua; uma formulação confessional mais definida excederia a evidência disponível.
- issue: Pronomes e referentes no segundo parágrafo
  choice: Preservar, tanto quanto possível, a alternância entre ele/eles e ela, apesar da dificuldade
  alternative: Identificar explicitamente todos os referentes como Filho, Totalidade, glória ou grandeza
  rationale: O estado lacunar do texto torna vários referentes incertos. A tradução evita uma resolução silenciosa.
translation_notes:
  register: Português moderno, digno e legível, com preferência por construções correntes no Brasil sem regionalismos marcados. Foram preservados todos os sinais textuais e editoriais do testemunho — colchetes, colchetes vazios, reticências espaçadas, parênteses e sinais angulares. Como a revisão direta do copta ainda está pendente, esta é uma tradução provisória fundamentada no testemunho inglês público fornecido.
