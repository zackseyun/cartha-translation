    [] [. . .] todo [. . .] anjo [. . .] palavras [e] o [som] de uma trombeta, anunciando a grande restauração completa, vinda do oriente radiante, na câmara nupcial, que é o amor de Deus, o [Pai], de acordo com o poder que [. . .] da grandeza [. . .], a doçura do [. . .] dele, porque ele se revela às grandezas [. . .] sua bondade [. . .] o louvor, o reino e a [glória], por meio de [Jesus Cristo], o Senhor, o Salvador, o Redentor de todos aqueles abrangidos por aquele que é cheio de misericórdia amorosa, por meio de [seu] Espírito Santo, desde agora, por todas as gerações, para todo o sempre. Amém.'
