translation:
  language: pt
  text: 'Esta é a natureza completa da geração, causada pelo que [Cristo] suportou quando resplandeceu sobre eles [com] uma [luz] que revelou [. . .] como a sua [. . .] que será [. . .] como a sua [. . .], enquanto a única diferença [que] existe naqueles que eram


    (5 linhas ausentes)


    [] [. . .] aqueles que existem [. . .] por meio de [. . .], como [eu] disse anteriormente, ao passo que os materiais serão abandonados até o fim, para serem destruídos, porque não darão seus [nomes], caso retornem mais uma vez ao que [não existirá]. Assim como eram [. . .], não eram [. . .], mas foram úteis [durante o] tempo em que habitaram entre eles, embora não fossem [. . .] no princípio. Então [. . .] agir de modo diferente mediante o domínio que possuíam na preparação, [para] resistir-lhes.


    Embora eu faça uso contínuo [destas] palavras, [não consegui compreender] os pensamentos. Alguns anciãos [. . .] a ele grandeza.


    (5 ou 6 linhas ausentes)


    [] [. . .] todo [. . .] anjo [. . .] palavras [e] o [som] de uma trombeta, anunciando a grande restauração completa, vinda do oriente radiante, na câmara nupcial, que é o amor de Deus, o [Pai], de acordo com o poder que [. . .] da grandeza [. . .], a doçura do [. . .] seu, porque ele se revela às grandezas [. . .] sua bondade [. . .] o louvor, o reino e a [glória], por meio de [Jesus Cristo], o Senhor, o Salvador, o Redentor de todos aqueles abrangidos por aquele que é cheio de misericórdia amorosa, por meio de [seu] Espírito Santo, desde agora, por todas as gerações, para todo o sempre. Amém.'
