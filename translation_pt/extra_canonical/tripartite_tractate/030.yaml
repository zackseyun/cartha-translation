lexical_decisions:
- source_word: begetting
  choice: geração
  rationale: Preserva o sentido de origem ou ato de gerar sem restringi-lo a nascimento físico; a revisão direta do copta continua pendente.
- source_word: material ones
  choice: os materiais
  rationale: Mantém a categoria antropológica do testemunho, evitando explicá-la ou harmonizá-la teologicamente.
- source_word: complete restoration
  choice: restauração completa
  rationale: Reproduz de modo transparente a formulação do testemunho e evita importar terminologia técnica não confirmada pelo copta.
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Conserva a imagem ritual e simbólica do texto em expressão corrente e digna.
- source_word: loving mercy
  choice: misericórdia amorosa
  rationale: Retém os dois componentes sem reduzir a expressão simplesmente a amor ou misericórdia.
theological_decisions:
- issue: Identificação do sujeito em trecho restaurado
  choice: '[Cristo]'
  alternative: ele
  rationale: Mantém entre colchetes a restauração editorial presente no testemunho, sem apresentá-la como texto manuscrito seguro.
- issue: Destino dos “materiais”
  choice: “serão abandonados até o fim, para serem destruídos”
  alternative: paráfrase explicativa de condenação final
  rationale: Preserva a afirmação e sua tensão próprias, sem acrescentar uma interpretação denominacional.
- issue: Referente de “aquele que é cheio de misericórdia amorosa”
  choice: manter o referente indeterminado
  alternative: identificá-lo explicitamente com o Pai ou com Cristo
  rationale: A sintaxe do testemunho é ambígua e o manuscrito está danificado; uma identificação explícita resolveria indevidamente a ambiguidade.
- issue: Relação da câmara nupcial com o amor de Deus
  choice: “na câmara nupcial, que é o amor de Deus”
  alternative: “na câmara nupcial do amor de Deus”
  rationale: Mantém a relação equativa expressa no testemunho, apesar de sua densidade teológica.
translation_notes:
  register: Português moderno, internacional e legível no Brasil, com tom digno. Colchetes, reticências e avisos de linhas ausentes foram preservados para distinguir restaurações editoriais e danos do manuscrito. A redação permanece necessariamente provisória, pois foi baseada no testemunho inglês público fornecido e a revisão direta do copta ainda está pendente. Materiais de navegação, contato e publicidade do site foram omitidos.
