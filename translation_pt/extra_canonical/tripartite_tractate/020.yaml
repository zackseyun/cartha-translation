translation:
  language: pt
  text: 'Acima de todos os arcontes, ele estabeleceu um arconte a quem ninguém dá ordens. Ele é o senhor de todos eles, isto é, o rosto que o Verbo produziu por meio de seu pensamento para ser uma representação do Pai das Totalidades. Por isso, ele é adornado com todo <nome> que constitui uma semelhança daquele, pois possui toda qualidade e todo atributo glorioso. Assim, é chamado até mesmo de “Pai”, “Deus”, “Demiurgo”, “Rei”, “Juiz”, “Lugar”, “Morada” e “Lei”. O Verbo o utiliza como mão para ordenar a obra das coisas inferiores e como boca para dizer o que deve ser profetizado. Ele falou e pôs em ordem; e, quando viu que suas obras eram grandes, boas e maravilhosas, sentiu prazer e alegria, como [] se as tivesse dito e realizado em seus próprios pensamentos, sem saber que o movimento dentro dele procedia do Espírito, que o move de maneira predeterminada para fazer tudo quanto lhe ocorre desejar.


    Quanto às coisas que vieram a existir por meio dele, falou a respeito delas, e elas vieram a existir à semelhança dos lugares espirituais aos quais nos referimos anteriormente, ao tratar das imagens. Ele <fez> mais do que simplesmente trabalhar, pois, tendo sido designado pai de seu plano de salvação, gerou não somente por meio de si mesmo e das sementes, mas também [por meio do] Espírito escolhido, que descerá [por meio dele] aos lugares inferiores. Ele faz [mais] do que apenas proferir suas próprias palavras espirituais, <mas> o faz de maneira oculta por meio do Espírito, que clama e dá à luz coisas que ultrapassam a própria natureza dele.[a] Visto que, segundo sua natureza, ele é Deus e Pai, além de todos os outros títulos de honra, supôs que esses títulos pertenciam à sua própria natureza.


    Ele estabeleceu um repouso para os que lhe obedecem; para os que lhe desobedecem, <também instituiu> castigos. Um paraíso e um reino habitam com ele, assim como todas as demais coisas que habitam no éon que existia antes dele. Elas têm mais valor do que as cópias, por causa de sua relação com o pensamento. Essa relação é, por assim dizer, comparável a [] uma sombra e uma veste, pois ele não consegue ver como realmente existe tudo o que existe.


    Ele instituiu trabalhadores e servos para ajudá-lo no que faria e diria, porque, em todo lugar onde atuava, deixava seu rosto com seu belo nome, produzindo e pronunciando tudo o que contempla. De sua própria essência, [ele] estabeleceu em seu lugar imagens visíveis da luz e [os] lugares espirituais (invisíveis). Desse modo, todos os lugares, em toda parte, foram adornados por ele, refletindo a imagem daquele que os colocou, e assim foram estabelecidos. Embora paraísos, reinos, repousos, promessas e multidões de servos encarregados de cumprir sua vontade sejam senhores governantes, estão abaixo do senhor que os designou.


    Depois de ouvi-lo desse modo, ele colocou as luzes que <constituem> a fonte <do> sistema sobre a organização das coisas inferiores.[b] Foi assim que o Espírito invisível o moveu, para que ele [] se dispusesse a governar por meio de seu próprio servo, a quem também utilizou como mão, como <boca> e até como seu rosto. Ele produziu ordem, ameaças e medo, para que aqueles que agiam por ignorância […] pudessem conservar o lugar [que lhes fora dado para] guardar, pois estão presos aos seus lugares [pelas correntes dos] arcontes que estão acima deles.


    Toda a natureza da matéria [está] dividida em três categorias. O Verbo espiritual produziu as [primeiras] potências a partir da imaginação e do orgulho, colocando-as em primeiro lugar segundo a posição espiritual. Aquelas potências que estas produziram por ânsia de domínio, ele colocou na posição intermediária, porque elas, [por conseguinte], <eram> potências ávidas por dominar, a fim de que pudessem governar e impor, pela força, ordens compulsórias à ordem estabelecida abaixo delas. As que vieram a existir por meio da inveja, do ciúme e de toda outra descendência de inclinações desse tipo, ele colocou numa ordem de servidão, para controlar os limites mais exteriores e comandar todos os seres e toda geração. Delas procedem seres de enfermidades que matam de repente e estão ávidos por gerar, embora nada fossem no lugar de onde se originaram e ao qual tornarão a voltar.[c] Por isso, ele estabeleceu sobre elas potências dotadas de autoridade, que atuam incessantemente sobre a matéria, para
    que [] a descendência dos seres existentes pudesse, de modo semelhante, existir incessantemente, pois essa é a glória deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O referente de “própria natureza” é ambíguo no testemunho: pode apontar para o Espírito ou para aquele por meio de quem ele atua.'
    reason: Preservar ambiguidade pronominal relevante.
  - marker: b
    text: 'A sequência de agentes nesta frase é incerta: “ele” pode retomar mais de uma figura mencionada no contexto.'
    reason: Evitar resolver uma dificuldade textual e sintática sem revisão direta do copta.
  - marker: c
    text: A construção associa essas entidades às enfermidades, à morte súbita e à geração; a relação sintática exata permanece difícil no testemunho.
    reason: Sinalizar uma passagem obscura sem impor uma identificação específica.
lexical_decisions:
- source_word: archons
  choice: arcontes
  rationale: Mantém o termo técnico tradicional para as potências governantes desta cosmologia; a função é esclarecida pelo contexto.
- source_word: the Word
  choice: o Verbo
  rationale: Preserva o título técnico e sua ressonância conceitual, com forma consagrada e inteligível em português.
- source_word: Demiurge
  choice: Demiurgo
  rationale: Conserva o termo técnico cosmológico, evitando paráfrases que poderiam introduzir uma interpretação teológica.
- source_word: Father of the Totalities
  choice: Pai das Totalidades
  rationale: Mantém o plural abstrato e distintivo do testemunho, sem reduzi-lo simplesmente a “Pai de tudo”.
- source_word: aeon
  choice: éon
  rationale: Emprega transliteração técnica corrente para não confundir o conceito com uma simples era cronológica.
- source_word: repose
  choice: repouso
  rationale: Retém o valor substantivo e soteriológico do termo, em vez de normalizá-lo como mero descanso.
- source_word: powers
  choice: potências
  rationale: Distingue seres ou forças cosmológicas de poder em sentido genérico.
- source_word: system
  choice: sistema
  rationale: Preserva a formulação abstrata do testemunho diante da incerteza sobre o referente cosmológico exato.
theological_decisions:
- issue: Identidade e conhecimento do Demiurgo
  choice: Manter que ele é chamado Deus e Pai, mas desconhece a origem do movimento que atua nele
  alternative: Harmonizá-lo com o Deus supremo ou apresentá-lo explicitamente como falso deus
  rationale: O trecho sustenta deliberadamente a tensão entre seus títulos honrosos, sua função subordinada e sua ignorância.
- issue: Agência do Espírito e do arconte
  choice: Preservar os pronomes e a agência parcialmente ambígua
  alternative: Especificar em cada oração que o Espírito, o Verbo ou o Demiurgo é o agente
  rationale: O testemunho fornecido apresenta transições pronominais incertas, que não devem ser resolvidas sem revisão direta do copta.
- issue: Predeterminação do movimento
  choice: “de maneira predeterminada”
  alternative: “segundo a providência” ou “fatalmente”
  rationale: Mantém o sentido apresentado pelo testemunho sem importar uma doutrina posterior de predestinação ou determinismo.
- issue: Natureza das enfermidades
  choice: “seres de enfermidades”
  alternative: “doenças” ou “demônios causadores de doenças”
  rationale: A expressão parece personificar ou postular entidades, mas “demônios” excederia a evidência fornecida.
translation_notes:
  register: Português moderno, digno e amplamente legível, com vocabulário técnico preservado onde é essencial à cosmologia do tratado. Colchetes, reticências e restaurações entre sinais angulares foram mantidos conforme o testemunho. A tradução é provisória, baseada no testemunho público em inglês; a revisão direta do copta ainda está pendente.
