lexical_decisions:
- source_word: Election
  choice: Eleição
  rationale: Mantém o termo técnico soteriológico e sua personificação, indicada pela inicial maiúscula.
- source_word: Calling
  choice: Vocação
  rationale: Expressa uma condição ou grupo chamado, em contraste técnico com a Eleição; evita reduzir o termo ao simples ato de chamar.
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Preserva a imagem ritual e nupcial característica do tratado em linguagem digna e inteligível.
- source_word: aeon
  choice: éon
  rationale: Transliteração portuguesa do termo técnico cosmológico, evitando equipará-lo sem justificativa a “era” ou “eternidade”.
- source_word: Word
  choice: Verbo
  rationale: Emprega a forma portuguesa tradicional para o Logos personificado e conserva a inicial maiúscula do testemunho.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva como termo técnico capitalizado a noção de pleroma.
- source_word: Human
  choice: Humano
  rationale: Mantém a substantivação e a função técnica da figura, sem introduzir uma identificação interpretativa.
- source_word: Totality / Totalities
  choice: Totalidade / Totalidades
  rationale: Conserva número e capitalização, importantes para a cosmologia do texto.
- source_word: restoration
  choice: restauração
  rationale: Termo natural que mantém a ideia de recomposição ou retorno sem especificar uma doutrina posterior.
- source_word: archetypes
  choice: arquétipos
  rationale: Equivalente técnico corrente, preservando o contraste com “imagens”.
- source_word: conceptualization
  choice: conceituação
  rationale: Mantém a sequência de faculdades ou meios cognitivos sem parafraseá-la.
- source_word: fleshly humans
  choice: humanos carnais
  rationale: Preserva a qualificação antropológica do testemunho, sem suavizá-la para “seres humanos mortais”.
theological_decisions:
- issue: Relação entre a Eleição, Cristo e a câmara nupcial
  choice: Manter a Eleição personificada e a afirmação de que Cristo veio sobretudo por causa dela
  alternative: Explicar a Eleição como conjunto dos eleitos ou como Igreja
  rationale: O testemunho deixa a identidade precisa em tensão; uma explicação denominacional ou sistemática resolveria indevidamente a ambiguidade.
- issue: Referente feminino em “he hopes for her”
  choice: Traduzir literalmente “espera por ela”
  alternative: Identificar “ela” explicitamente como Igreja, Vocação ou Plenitude
  rationale: O antecedente é incerto no testemunho; o pronome preserva a ambiguidade genuína.
- issue: Sujeito de “It possesses” e “so that it attains redemption”
  choice: Usar o pronome feminino “ela” sem nomear o referente
  alternative: Substituir por “a Igreja”, “a Totalidade” ou “a restauração”
  rationale: A cadeia referencial é obscura e não deve ser resolvida por conjectura silenciosa.
- issue: Redenção do próprio Filho
  choice: Conservar “[necessitou] também de redenção” e sua explicação ligada à encarnação
  alternative: Reformular como “realizou a redenção” para evitar dificuldade cristológica
  rationale: A afirmação difícil pertence ao testemunho e deve permanecer, juntamente com o sinal editorial dos colchetes.
- issue: Aqueles da esquerda e da direita
  choice: Manter as designações espaciais sem identificá-las
  alternative: Interpretá-las como poderes maus e bons, ou como grupos específicos
  rationale: O texto apresenta ambos como poderes dos quais há libertação, mas não fornece aqui identificação suficiente.
- issue: “Angelic redemption of the Father”
  choice: “a redenção angélica do Pai”
  alternative: “o redentor angélico enviado pelo Pai”
  rationale: A formulação nominal e sua possível ambiguidade de relação com o Pai devem ser preservadas.
- issue: “his firstborn, and his love, the fleshly Son”
  choice: 'Preservar a série nominal: “seu primogênito, seu amor, o Filho carnal”'
  alternative: Fundir os termos numa identificação explicativa única
  rationale: A sintaxe e as relações de aposição ou enumeração são incertas; a tradução não as harmoniza.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom digno. Termos cosmológicos e soteriológicos capitalizados foram mantidos como vocabulário técnico. Parênteses, colchetes vazios, colchetes de restauração, sinais angulares e elipse editorial reproduzem os sinais do testemunho fornecido. Como a revisão direta do copta está pendente, a redação é provisória e se baseia criticamente no testemunho inglês público, usando a versão POB inglesa apenas como camada de consulta. Não foram acrescentadas notas de rodapé, portanto não há marcadores no texto principal.
