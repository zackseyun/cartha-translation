  text: 'The Election shares in the nature and body of the Savior. It is like a bridal chamber because of its unity and union with him, since it was above all for its sake that Christ came. By contrast, the Calling is appointed for those who rejoice in the bridal chamber and are glad and happy about the union of the bridegroom and the bride. In this way, the place the Calling will receive is the aeon of the images, where the Word has yet to unite with the Fullness. Because of this, the Human of the Church was joyful and glad, and he hopes for her. He consists of spirit, soul, and body, corresponding to the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. He possessed what came from the [Father], which [] the places could receive. He also possessed the limbs we mentioned earlier. When the redemption was proclaimed, the Perfect Human immediately gained the knowledge of how to return quickly to his unity, to the place from which he originated. He joyfully returned to the place from which he had originated, the place from which he had come forth.


    However, his limbs needed a place of instruction, as is in the places prepared to provide it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and receive the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father, until the Totalities acquire a face like his. The restoration at the end, however, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption—that is, the path toward the incomprehensible Father, that is, the return to the pre-existent—and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not only from the control of those <of> the left, and not only an escape from the power of those of the right, whose slaves and sons we believed ourselves to be, and from whom no one escapes without quickly being caught by them again. Instead, redemption is also an ascent <to> the degrees in the Fullness and to those who received names and grasped them according to the ability of each aeon. It is also an entrance into what is silent, with no need for voice, knowledge, conceptualization, or enlightenment, but (where) all things are light, all radiant without any need for enlightenment.


    Angels as well as humans need redemption, as do the image, the Fullnesses of the aeons, and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended upon him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received naturally received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, his love, the fleshly Son, and the heavenly angels were considered worthy to form a fellowship with him on the earth. This is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed upon him, before anyone else.'
translation:
  language: pt
  text: 'A Eleição participa da natureza e do corpo do Salvador. Ela é como uma câmara nupcial por causa de sua unidade e de sua união com ele, pois foi sobretudo por causa dela que Cristo veio. Em contraste, a Vocação está destinada aos que se alegram na câmara nupcial e ficam contentes e felizes com a união do noivo e da noiva. Assim, o lugar que a Vocação receberá é o éon das imagens, onde o Verbo ainda haverá de se unir à Plenitude. Por isso, o Humano da Igreja ficou alegre e contente, e espera por ela. Ele é constituído de espírito, alma e corpo, em correspondência com aquele que elaborou o plano de salvação.


    Dentro (do Humano) havia um humano que era uma unidade, pois ele era a Totalidade e era todos eles. Ele possuía aquilo que procedia do [Pai], que [] os lugares podiam receber. Possuía também os membros que mencionamos antes. Quando a redenção foi proclamada, o Humano Perfeito adquiriu imediatamente o conhecimento de como retornar depressa à sua unidade, ao lugar de onde se originara. Com alegria, retornou ao lugar de onde se originara, ao lugar de onde havia procedido.


    Seus membros, porém, precisavam de um lugar de instrução, como há nos lugares preparados para lhes proporcionar as imagens e os arquétipos, como num espelho, até que todos os membros do corpo da Igreja <sejam unidos> no mesmo lugar e recebam ao mesmo tempo a restauração, mediante a manifestação do corpo inteiro, <…> a restauração à Plenitude.


    Ela possui uma harmonia e uma união comuns e primordiais, que são a harmonia pertencente ao Pai, até que as Totalidades adquiram uma face semelhante à dele. A restauração no fim, porém, <ocorrerá> depois que a Totalidade for revelada naquele que é o Filho, que é a redenção — isto é, o caminho para o Pai incompreensível, isto é, o retorno ao preexistente — e (depois que) as Totalidades se revelarem, da maneira apropriada, naquele que é o caminho para aquele que é inapreensível, indizível, [] invisível e incompreensível, para que ela alcance a redenção.


    Ela será uma libertação não apenas do domínio daqueles <da> esquerda, nem apenas uma fuga do poder daqueles da direita, dos quais acreditávamos ser escravos e filhos e dos quais ninguém escapa sem ser rapidamente capturado de novo por eles. Em vez disso, a redenção é também uma ascensão <aos> graus na Plenitude e àqueles que receberam nomes e os compreenderam segundo a capacidade de cada éon. É também uma entrada no que é silencioso, sem necessidade de voz, conhecimento, conceituação ou iluminação, mas (onde) todas as coisas são luz, todas radiantes, sem necessidade alguma de iluminação.


    Tanto os anjos como os humanos necessitam de redenção, assim como a imagem, as Plenitudes dos éons e os poderes maravilhosamente radiantes. Até o próprio Filho, que é o modelo da redenção da Totalidade, [necessitou] também de redenção, [] porque se tornou humano, sujeitando-se a tudo o que era necessário para nós na carne, nós que somos sua Igreja. Então, quando ele foi o primeiro a alcançar a redenção por meio do Verbo que descera sobre ele, todos os demais alcançaram dele a redenção, acolhendo-o para si. Isso porque aqueles que receberam aquele que (já) havia recebido naturalmente receberam o que estava nele.


    Entre os humanos carnais, a redenção começou a [ser] concedida quando seu primogênito, seu amor, o Filho carnal e os anjos celestiais foram considerados dignos de formar comunhão com ele na terra. Por isso ele é chamado de “a redenção angélica do Pai”, consolando os que haviam se entristecido por causa do conhecimento da Totalidade, pois foi o primeiro a receber esse dom, antes de qualquer outro.'
