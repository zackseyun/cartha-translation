base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/013.yaml
  text: 'The others had a stronger lust for control because they were more honorable [] than the former ones, who had risen up against them. They refused to humble themselves, thinking that they had originated from themselves and had no beginning, and, as for giving birth, that they were the first to give birth to others. The two orders warred against each other, battling for control because of their way of being. As a result, they were flooded with powers and natures that typify mutual combat, possessing lust for control and everything else like it. From these things, empty love of glory drove them to desire control, although not one of them possessed the exalted thought or recognized it.


    The forces of this thought were prepared with the <names> of the pre-existent <ones>, whose representations they are. The order of those of this kind had harmony among themselves. They, however, battled against the order of those of the likeness, while the order of those of the likeness waged war against the likenesses and acted against them in its fury. [] From this it [took place ... their] own [against] each other, many [. . .] necessity positioned them [. . .] so they could prevail [. . .] he did not cease [. . .] and their envy and [their] fury and violence and lust and ignorance succeeded, producing diverse kinds of matter and powers of different kinds, intermixed in great numbers. Meanwhile, the Word, who caused them to be begotten, was awaiting in his mind a revelation of the [hope] that was to come to him from above.


    As the Word roused himself, he received hope and expectation for the Exalted One. As for those of the shadow, he distanced himself from them completely because they warred against him and did not humble themselves before him in the least. But he found rest in those who belonged to memory. As for those who came into being through memory, the Word produced, in an unseen manner and in agreement with their nature, the one who ascended on high, remembering the one who had been deficient, until the light shone on him from above, bestowing life, begotten by the thought of brotherly love among the pre-existent Fullnesses.'
translation:
  language: pt
  text: 'Os outros tinham uma ânsia de domínio mais intensa, porque eram mais honrados [] do que os primeiros, que se haviam levantado contra eles. Estes se recusavam a se humilhar, pois pensavam que tinham se originado de si mesmos e não tinham princípio e, quanto a gerar, que tinham sido os primeiros a gerar outros. As duas ordens guerreavam uma contra a outra, disputando o domínio por causa de seu modo de ser. Como resultado, foram inundadas por poderes e naturezas que caracterizam o combate mútuo, possuindo ânsia de domínio e tudo o mais que se assemelha a ela. Dessas coisas, o amor vazio pela glória os impeliu a desejar o domínio, embora nenhum deles possuísse o pensamento exaltado nem o reconhecesse.


    As forças desse pensamento foram preparadas com os <nomes> dos <seres> preexistentes, dos quais são representações.[a] A ordem dos que eram dessa espécie possuía harmonia entre si. Eles, porém, lutavam contra a ordem dos que pertenciam à semelhança, enquanto a ordem dos que pertenciam à semelhança guerreava contra as semelhanças e agia contra elas em sua fúria. [] A partir disso [aconteceu... o que era] deles próprios [contra] uns aos outros, muitos [...] a necessidade os posicionou [...] para que pudessem prevalecer [...] ele não cessou [...] e a inveja deles, [sua] fúria, violência, ânsia e ignorância tiveram êxito, produzindo diversos tipos de matéria e poderes de diferentes espécies, misturados em grande número. Enquanto isso, a Palavra, que havia causado a geração deles, aguardava em seu pensamento uma revelação da [esperança] que lhe viria do alto.[b]


    Ao se pôr em movimento, a Palavra recebeu esperança e expectativa quanto ao Exaltado. Quanto aos que pertenciam à sombra, afastou-se completamente deles, porque guerreavam contra ela e não se humilhavam diante dela de modo algum. Mas encontrou repouso nos que pertenciam à memória. Quanto aos que vieram a existir por meio da memória, a Palavra produziu, de maneira invisível e de acordo com a natureza deles, aquele que subiu ao alto, lembrando-se daquele que havia sido deficiente, até que a luz brilhou sobre ele do alto, concedendo-lhe vida, gerada pelo pensamento de amor fraternal entre as Plenitudes preexistentes.[c]


    [a] Os sinais < > indicam palavras restauradas pelo editor onde o manuscrito não está plenamente preservado.

    [b] Os colchetes e as reticências preservam lacunas ou reconstruções incertas do texto; por isso, a sintaxe desta passagem permanece fragmentária.

    [c] “Plenitudes” traduz um termo técnico do tratado para as realidades que pertencem à plenitude divina.'
