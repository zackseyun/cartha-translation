    issue: “os primeiros” para “the former ones”
    rationale: “Former” distingue o grupo anterior em contraste com “the others”; “os anteriores” conserva essa relação sem acrescentar a ideia ordinal de que fossem os primeiros.
  - severity: medium
    issue: Pronomes femininos para o referente pessoal da Palavra
    rationale: O testemunho diz que os da sombra guerreavam “against him” e não se humilhavam “before him”. Embora “Palavra” seja gramaticalmente feminino em português, nesta cadeia narrativa o referente é apresentado como agente pessoal masculino; “contra ele” e “diante dele” preservam o dado do testemunho.
