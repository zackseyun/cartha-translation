lexical_decisions:
- source_word: lust for control
  choice: ânsia de domínio
  rationale: Expressa desejo intenso de exercer poder sem a conotação predominantemente sexual que “luxúria” teria no português atual; “domínio” preserva a disputa por controle.
- source_word: the Word
  choice: a Palavra
  rationale: Mantém o título conceitual com inicial maiúscula e o gênero gramatical natural em português, sem identificar silenciosamente a figura com uma formulação teológica posterior.
- source_word: memory
  choice: memória
  rationale: Preserva o vocabulário abstrato e técnico do testemunho, apesar de sua referência exata permanecer ambígua.
- source_word: Fullnesses
  choice: Plenitudes
  rationale: Conserva no plural o termo cosmológico técnico, evitando reduzi-lo à ideia genérica de completude.
- source_word: brotherly love
  choice: amor fraternal
  rationale: Reproduz a dimensão relacional do original testemunhado em registro digno e corrente.
- source_word: likeness / likenesses
  choice: semelhança / semelhanças
  rationale: Mantém a repetição e a distinção interna do texto, sem substituir por “imagem” ou interpretar a natureza dessas entidades.
theological_decisions:
- issue: Identidade da Palavra
  choice: Manter “a Palavra” como designação textual sem explicação cristológica no corpo do texto
  alternative: Traduzir ou explicar como “o Logos” ou identificar explicitamente com Cristo
  rationale: O trecho atribui ações e pensamento à figura, mas não autoriza nesta passagem uma identificação denominacional ou sistemática adicional.
- issue: Referente de “aquele que subiu ao alto” e “aquele que havia sido deficiente”
  choice: Preservar as expressões e seus referentes ambíguos
  alternative: Nomear personagens ou tornar ambos os referentes idênticos
  rationale: A cadeia pronominal é obscura no testemunho e a tradução não deve solucionar silenciosamente essa tensão.
- issue: Agente e relação na frase final
  choice: Traduzir “vida, gerada pelo pensamento de amor fraternal” mantendo a ligação gramatical mais próxima
  alternative: Fazer da luz, da Palavra ou do ascendente o elemento explicitamente gerado
  rationale: A construção permite incerteza quanto ao vínculo exato; a redação conserva a ambiguidade sem impor uma ontologia.
- issue: Estatuto dos seres preexistentes e das Plenitudes
  choice: Usar linguagem descritiva e termos técnicos, sem classificá-los doutrinariamente
  alternative: Cham á-los de anjos, éons ou pessoas divinas
  rationale: Essas identificações excederiam a evidência imediata fornecida e importariam um esquema interpretativo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução segue prioritariamente o testemunho público fornecido, pois a revisão direta do copta ainda está pendente. Mantêm-se colchetes, reticências e sinais angulares como marcas de dano e restauração textual. A repetição de termos como “domínio”, “ordem”, “semelhança”, “memória” e “pensamento” foi preservada por sua provável função conceitual.
