translation:
  language: pt
  text: 'Embora haja muitas outras coisas que poderíamos dizer sobre o tema da Eleição, […] e fosse apropriado falar delas, ainda assim precisamos <falar> mais sobre os da Vocação, como são chamados os da direita, pois não seria proveitoso esquecê-los. Já falamos deles longamente, como se isso bastasse. Por que, então, falamos deles apenas em parte?


    Eu disse que todos os que tiveram origem no Verbo — seja a partir do juízo contra os maus, seja da ira que combate contra eles, seja do afastamento deles mediante conversão, isto é, do retorno aos exaltados, seja da oração e da lembrança dos preexistentes, seja da esperança e da fé de que sua salvação poderia ser [alcançada] por meio de boas obras — todos estes foram considerados dignos, pois procedem das boas inclinações e têm como causa de sua geração um pensamento daquele que É.


    Disse ainda que, antes de o Verbo se envolver voluntariamente com eles de modo invisível, o Exaltado lhes concedeu o pensamento mencionado anteriormente, porque eles [lhe deram atenção]. […] Esse pensamento tornou-se a causa de sua existência. Quando <foram> salvos, não se exaltaram com arrogância, como se nada existisse antes deles. Pelo contrário, confessaram que sua existência teve uma origem e que desejavam conhecer aquele que existia antes deles.


    Disse também que eles se prostraram diante da revelação da luz, que tinha a aparência de um relâmpago, e testemunharam que ela havia aparecido para a salvação deles.


    Eu disse que não somente os que tiveram origem no Verbo receberão o bem; também aqueles que estes produziram de acordo com as boas inclinações desfrutarão do repouso, por causa da riqueza da dádiva. Até os que foram produzidos pelo desejo de dominar, nos quais está a semente desse desejo, receberão a recompensa das boas obras, se tiverem cooperado com os de boa inclinação e se desejarem deliberadamente abandonar o amor vazio pela glória passageira, a fim de guardar o mandamento do Senhor […] da glória. Em vez de uma honra insignificante e transitória, herdarão o reino eterno.


    Foi necessário retomar nosso discurso anterior. Agora, porém, para formular um argumento coerente, precisamos relacionar as causas, os efeitos e a <evidência> quanto à possibilidade de os da direita, sejam puros ou mistos, receberem a dádiva da salvação e do repouso. Portanto, numa exposição convincente, devemos demonstrar isso com base na forma de sua fé.


    Se professamos o reino em Cristo, <eliminamos> toda diversidade de formas, desigualdade e mudança. Pois, no fim, haverá novamente uma unidade, assim como no princípio havia uma unidade: o lugar onde não há homem nem mulher, escravo nem livre, circuncisão nem incircuncisão, anjo nem ser humano, mas Cristo é tudo em todos. Como aquele que não existia no princípio pode ser encontrado na existência? E <qual é> a natureza daquele que não era escravo, visto que ocupará um lugar junto de […] alguém livre? Eles receberão até mesmo uma visão sem mediação, sem precisar crer que as coisas são assim apenas por causa de uma breve palavra proferida por uma voz.


    Isso acontece porque a restauração do que existia antes é uma unidade. Mesmo que alguns sejam exaltados por causa do plano de salvação, tendo sido encarregados das causas das coisas existentes, pondo em ação uma multidão de forças naturais e alegrando-se nelas — sejam anjos ou seres humanos —, alcançarão o reino, a confirmação e a salvação.


    Estas são as razões: aqueles que apareceram na carne creram com firmeza que ele é o Filho do Deus desconhecido, desde a antiguidade inexprimível, a quem ninguém pôde ver. Renunciaram aos deuses diante dos quais antes se prostravam e aos senhores no céu e na terra. Antes mesmo de <ele> ser elevado, quando ainda era criança, testemunharam que ele já pregava. E, quando ele estava no túmulo [como] morto, os anjos creram que ele estava vivo, [recebendo até mesmo] vida […] daquele que havia morrido.


    A multidão de seus serviços sagrados e das maravilhas que haviam realizado nos templos [pagãos][a] foi então convertida em devoção a outro, isto é, a Cristo. A confissão que fizeram dele foi o que lhes deu poder para essa mudança, levando-os a apressar sua aproximação de Cristo. Eles haviam recebido aquela preparação [pagã] somente para depois rejeitá-la em favor daquele que não era <honrado> neste lugar inferior, isto é, no mundo. Em troca de rejeitarem os deuses pagãos, [ganharam] Cristo, que reconheceram como procedente do lugar [exaltado], [do qual] haviam vindo com ele, um lugar de governo divino. Os nomes daqueles a quem tinham adorado, honrado e servido haviam-lhes sido apenas emprestados; agora os transferiam para aquele a quem propriamente se referem.


    Contudo, somente depois de sua ascensão[b] reconheceram que ele era o Senhor deles, acima do qual não há senhor algum. Transferiram-lhe seus reinos, levantaram-se de [seus] tronos, deixando-os vagos, e entregaram suas coroas. Ele, porém, revelou-se a eles pelas razões que já discutimos: para a cura deles e para sua [conversão ao] bom pensamento a respeito de […] […] companheiro e dos anjos […], bem como pela abundância do bem que fizeram em favor disso. [Assim], foram encarregados dos serviços que beneficiam os eleitos, a saber, levar a iniquidade deles ao céu para um julgamento eterno, com [juízo] incontestável e infalível. Continuam a agir em favor deles até que todos entrem na vida terrena e deixem esta vida, enquanto seus corpos [permanecem] na terra. Servem a todos os seus […], tornando-se participantes de seus sofrimentos, perseguições e perigos, que recaíram sobre os santos mais do que sobre os demais.


    Quanto aos servos do maligno, visto que o mal merece destruição <…>, firmemente por causa da [vida em comunhão] que está acima de todos os mundos, a qual é o bom pensamento e a fraternidade deles.


    E a Igreja se lembrará deles como verdadeiros amigos e servos fiéis, quando tiver recebido a redenção daquele que [lhes dá] a recompensa constituída pela alegria que prevalece na câmara nupcial e pelo [… que] habita em sua casa […] que habita no pensamento […] e aquilo que ela deve a […] […] Cristo, que habita com ela, [e pela] espera confiante do Pai [da] Totalidade, pois ela lhes fornecerá anjos para orientação e serviço.


    Os éons[c] se lembrarão dos pensamentos agradáveis de servir à Igreja <e> lhes concederão a recompensa [por] todas as suas meditações. Isso é uma emanação procedente deles: assim como Cristo [cumpriu sua] vontade, a qual produziu as grandes [realidades] exaltadas da Igreja e as concedeu a ela, <assim também> essa emanação será um pensamento em favor destes, fornecendo-lhes as moradas em que habitarão eternamente. [Depois que] rejeitarem a atração para baixo exercida pela deficiência, o poder da Plenitude[d] os impulsionará para o alto, pela grandeza da generosidade e pela doçura do éon preexistente.


    [a] O manuscrito não explicita “pagãos”; o termo foi acrescentado para esclarecer que se trata dos templos e cultos anteriormente abandonados.


    [b] Ou: “elevação”. O termo pode designar a subida ou assunção de Cristo sem especificar aqui seus detalhes.


    [c] “Éons” designa, neste tratado, realidades ou ordens eternas do mundo divino; não significa apenas períodos de tempo.


    [d] “Plenitude” traduz o conceito de totalidade divina, frequentemente conhecido pelo termo grego plērōma.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito não explicita “pagãos”; o termo foi acrescentado para esclarecer que se trata dos templos e cultos anteriormente abandonados.
    reason: Sinalizar uma explicitação contextual introduzida pelo testemunho inglês.
  - marker: b
    text: 'Ou: “elevação”. O termo pode designar a subida ou assunção de Cristo sem especificar aqui seus detalhes.'
    reason: Preservar a amplitude da expressão inglesa provisória “assumption”.
  - marker: c
    text: “Éons” designa, neste tratado, realidades ou ordens eternas do mundo divino; não significa apenas períodos de tempo.
    reason: Explicar um termo cosmológico técnico pouco familiar.
  - marker: d
    text: “Plenitude” traduz o conceito de totalidade divina, frequentemente conhecido pelo termo grego plērōma.
    reason: Esclarecer o uso técnico sem impor interpretação sectária.
lexical_decisions:
- source_word: Election
  choice: Eleição
  rationale: Mantém o termo técnico do tratado e sua distinção em relação à Vocação.
- source_word: Calling
  choice: Vocação
  rationale: Expressa a condição ou grupo dos chamados, preservando o contraste técnico com Eleição.
- source_word: Word
  choice: Verbo
  rationale: Uso cristológico consagrado e natural em português para Logos, sem reduzir o termo a mera fala.
- source_word: repose
  choice: repouso
  rationale: Preserva o valor técnico e escatológico, evitando interpretar como simples descanso físico.
- source_word: singularity
  choice: unidade
  rationale: Comunica a condição não diferenciada descrita no contexto com maior naturalidade do que “singularidade”.
- source_word: aeons
  choice: éons
  rationale: Transliteração técnica apropriada ao vocabulário cosmológico do tratado; explicada em nota.
- source_word: Fullness
  choice: Plenitude
