  revised_text: 'Embora haja muitas outras coisas que poderíamos dizer sobre o tema da Eleição, [] e fosse apropriado falar delas, ainda assim precisamos <falar> mais sobre os da Vocação, como são chamados os da direita, pois não seria proveitoso esquecê-los. Já falamos deles longamente, como se isso bastasse. Por que, então, falamos deles apenas em parte?


    Eu disse que todos os que tiveram origem no Verbo — seja a partir do juízo contra os maus, seja da ira que combate contra eles, seja da conversão que se afasta deles, isto é, do retorno aos exaltados, seja da oração e da lembrança dos preexistentes, seja da esperança e da fé de que sua salvação poderia ser [alcançada] por meio de boas obras — todos estes foram considerados dignos, pois procedem das boas inclinações e têm como causa de sua geração um pensamento daquele que É.


    Disse ainda que, antes de o Verbo se envolver voluntariamente com eles de modo invisível, o Exaltado lhes concedeu o pensamento mencionado anteriormente, porque eles [lhe deram atenção], [] pensamento que se tornou a causa de sua existência. Quando <foram> salvos, não se exaltaram com arrogância, como se nada existisse antes deles. Pelo contrário, confessaram que sua existência teve uma origem e que desejavam conhecer aquele que existia antes deles.


    Disse também que eles se prostraram diante da revelação da luz, que tinha a aparência de um relâmpago, e testemunharam que ela havia aparecido para a salvação deles.


    Eu disse que não somente os que tiveram origem no Verbo receberão o bem; também aqueles que estes produziram de acordo com as boas inclinações desfrutarão do repouso, por causa da riqueza da dádiva. Até os que foram produzidos pelo desejo de dominar, nos quais está a semente desse desejo, receberão a recompensa das boas obras, se tiverem cooperado com os de boa inclinação e se desejarem deliberadamente abandonar o amor vazio pela glória passageira, a fim de guardar o mandamento do Senhor [] da glória. Em vez de uma honra insignificante e transitória, herdarão o reino eterno.


    Foi necessário retomar nosso discurso anterior. Agora, porém, para formular um argumento coerente, precisamos relacionar as causas, os efeitos e a <evidência> quanto à possibilidade de os da direita, sejam puros ou mistos, receberem a dádiva da salvação e do repouso. Portanto, numa exposição convincente, devemos demonstrar isso com base na forma de sua fé.


    Se professamos o reino em Cristo, <eliminamos> toda diversidade de formas, de desigualdade e de mudança. Pois, no fim, haverá novamente uma unidade, assim como no princípio havia uma unidade: o lugar onde não há homem nem mulher, escravo nem livre, circuncisão nem incircuncisão, anjo nem ser humano, mas Cristo é tudo em todos. Como aquele que não existia no princípio pode ser encontrado na existência? E <qual é> a natureza daquele que não era escravo, visto que ocupará um lugar junto de [] alguém livre? Eles receberão até mesmo uma visão sem mediação, sem precisar crer que as coisas são assim apenas por causa de uma breve palavra proferida por uma voz.


    Isso acontece porque a restauração do que existia antes é uma unidade. Mesmo que alguns sejam exaltados por causa do plano de salvação, tendo sido encarregados das causas das coisas existentes, pondo em ação uma multidão de forças naturais e alegrando-se nelas — sejam anjos ou seres humanos —, alcançarão o reino, a confirmação e a salvação.


    E estas são as razões: aqueles que apareceram na carne creram com firmeza que ele é o Filho do Deus desconhecido, inefável desde a antiguidade e a quem ninguém pôde ver. Renunciaram aos deuses diante dos quais antes se prostravam e aos senhores no céu e na terra. Antes mesmo de <ele> ser elevado, quando ainda era criança, testemunharam que ele já pregava. E, quando ele estava no túmulo [como] morto, os anjos creram que ele estava vivo, [recebendo até mesmo] vida [] daquele que havia morrido.


    A multidão de seus serviços sagrados e maravilhas que haviam realizado nos templos (pagãos) foi então transformada em devoção a outro (isto é, a Cristo). A confissão (de Cristo) é o que lhes deu poder para (mudar sua devoção pagã), por apressarem sua aproximação de (Cristo). Haviam recebido aquela preparação (pagã) somente para que depois a rejeitassem em favor daquele (isto é, Cristo) que não era <honrado> neste lugar inferior (isto é, o mundo). Mas, por (rejeitarem os deuses pagãos), [ganharam] Cristo, que reconheceram como procedente do lugar [exaltado], [do qual] haviam vindo com ele, um lugar de governo divino. Os nomes daqueles a quem tinham adorado, honrado e servido haviam-lhes sido emprestados; agora os transferiam para aquele a quem propriamente se referem.


    Contudo, somente depois de sua ascensão[b] reconheceram que ele era o Senhor deles, acima do qual não há senhor algum. Transferiram-lhe seus reinos; levantaram-se de [seus] tronos (deixando-os vagos); entregaram suas coroas. Ele, porém, revelou-se a eles pelas razões que já discutimos: para a cura deles e para sua [conversão ao] bom pensamento a respeito de [. . .] [] companheiro e dos anjos [. . .], e pela abundância do bem que fizeram em favor disso. [Assim], foram encarregados dos serviços que beneficiam os eleitos, a saber, levar a iniquidade deles ao céu para um julgamento eterno, com [juízo] incontestável e infalível. Continuam a agir em favor deles até que todos entrem na vida terrena e deixem esta vida, enquanto seus corpos [permanecem] na terra, servindo a todos os seus [. . .], tornando-se participantes de seus sofrimentos, perseguições e perigos, que recaíram sobre os santos mais do que sobre os demais.


    Quanto aos servos do maligno, visto que o mal merece destruição <…>, firmemente por causa da [vida em comunhão] que está acima de todos os mundos, a qual é o bom pensamento e a fraternidade deles.


    E a Igreja se lembrará deles como verdadeiros amigos e servos fiéis, quando tiver recebido a redenção daquele que [lhes dá] a recompensa constituída pela alegria que prevalece na câmara nupcial e pelo [. . . que] habita em sua casa [. . .] que habita no pensamento [. . .] e aquilo que ela deve a [. . .] [] Cristo, que habita com ela, [e pela] espera confiante do Pai [da] Totalidade, pois ela lhes fornecerá anjos para orientação e serviço.


    Os éons[c] se lembrarão dos pensamentos agradáveis de servir à Igreja, <e> lhes concederão a recompensa [por] todas as suas meditações. Isso é uma emanação procedente deles, para que, assim como Cristo [cumpriu sua] vontade, a qual produziu as grandes [realidades] exaltadas da Igreja e as concedeu a ela, <assim também> essa emanação seja um pensamento em favor destes, fornecendo-lhes as moradas em que habitarão eternamente. [Depois que] rejeitarem a atração para baixo exercida pela deficiência, o poder da Plenitude[d] os impulsionará para o alto, pela grandeza da generosidade e pela doçura do éon preexistente.'
