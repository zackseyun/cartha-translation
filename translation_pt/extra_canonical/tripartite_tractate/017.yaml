translation:
  language: pt
  text: 'O pensamento do Logos, que havia recuperado sua estabilidade e passado a governar os que vieram a existir por meio dele, recebeu o nome de “Éon” e “Lugar” para todos os que ele havia produzido de acordo com a decisão. Recebeu também o nome de “Sinagoga da Salvação”, porque ele se curou da dispersão — isto é, do pensamento múltiplo — e voltou ao pensamento único. De modo semelhante, é chamado “Depósito”, por causa do repouso que alcançou e concedeu somente a si mesmo. […][a] Também é chamado “Noiva”, por causa da alegria daquele que se entregou a ele na esperança de obter fruto da união, daquele mesmo que lhe apareceu.[b] É chamado ainda “Reino”, por causa da firmeza que alcançou enquanto se alegrava por dominar os que haviam guerreado contra ele. E é chamado “Alegria do Senhor”, por causa da alegria com que [ele] se revestiu. A luz permanece com ele e lhe dá a recompensa pelos bens que lhe pertencem, até mesmo o pensamento — ou os pensamentos — da liberdade.[c]


    O éon que mencionamos anteriormente está acima das duas ordens que combatem uma contra a outra. Não é companheiro dos que exercem domínio, nem pertence às enfermidades e fraquezas, coisas relacionadas à memória e à semelhança. Aquilo em que o Logos se colocou era um éon inteiramente alegre, que possuía a forma da matéria, mas também a natureza de sua causa — aquilo que foi revelado —, pois era uma imagem dos que habitam na Plenitude e que vieram a existir das riquezas do deleite Daquele que É.


    Além disso, enquanto se alegrava diante daquele que se revelou, em seu <deleite>, em sua expectativa e na promessa daquilo que havia pedido, ele possuía o nome do Filho, bem como sua essência, seu poder e sua forma.[d] Este é aquele a quem ele amou e em quem se deleitou, […] por quem orações haviam sido oferecidas com amor.[e] Esse éon era luz, desejo de ser firmado, disposição para aprender e olho para ver — qualidades que possuía da parte dos seres exaltados. Além disso, era sabedoria para o pensamento dele em oposição aos que estavam situados abaixo no plano da salvação, palavra para falar e perfeição de outras coisas semelhantes.


    Quanto aos que receberam forma junto com ele segundo a imagem da Plenitude, seus pais são os que se revelaram, sendo cada um deles uma cópia de uma das figuras. Como são formas de masculinidade e não se originam da enfermidade que é a feminilidade, procedem daquele que já havia fugido da enfermidade. <Eles> recebem o nome de “Igreja”, porque reproduzem harmoniosamente a harmonia da assembleia dos que vieram a manifestar-se.[f] Aquilo que veio a existir à imagem da luz também é perfeito, pois é imagem da única luz existente, que é as Totalidades. Embora seja inferior àquele de quem é imagem, ainda possui sua inseparabilidade, pois é uma face da luz inseparável.


    Contudo, os que vieram a existir à imagem de cada um dos éons são, em essência, aquilo que mencionamos anteriormente; em sua atividade, porém, são desiguais, pois ela está presente de modo diferente em cada um deles. Na união uns com os outros, eles são iguais; […][g] mas cada éon conservou as diferenças que lhe são próprias. É por isso que possuem paixões, sendo a paixão uma enfermidade: eles não foram produzidos da unidade da Plenitude, mas prematuramente, a partir de um só, antes que este a recebesse do Pai, ou antes da união com sua Totalidade e sua vontade.[h]


    Apesar disso, tal coisa foi benéfica para o futuro plano da salvação. Foi-lhes permitido atravessar os lugares inferiores, porque esses lugares não podem receber sua chegada repentina, a não ser um de cada vez. A chegada deles é necessária, pois por meio deles tudo será levado à plenitude.


    Em resumo, o Logos recebeu a visão de todas as coisas: das que existiam, das que agora existem e das que existirão, pois lhe foi confiado o plano da salvação de tudo o que existe. Algumas coisas já chegaram a existir, porque havia um propósito para isso. Em contraste, ele preservou dentro de si as sementes que ainda virão a existir, por causa da promessa referente àquilo que havia concebido — a promessa das sementes que ainda haveriam de existir. E produziu sua descendência, isto é, a revelação daquilo que havia concebido. Por algum tempo, porém, as sementes prometidas foram impedidas de vir à existência, pois foram designadas para uma missão quando vier o Salvador com seus companheiros, os primeiros no conhecimento e na glória do Pai.[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito neste ponto. Esta versão é provisória e se baseia no testemunho inglês de domínio público fornecido; a revisão direta do copta ainda está pendente.
    reason: Registrar tanto a perda textual quanto a limitação da base documental.
  - marker: b
    text: A sintaxe e os referentes pessoais da frase sobre a “Noiva” são incertos; a tradução preserva a sequência do testemunho sem identificar de maneira conclusiva quem se entregou ou apareceu a quem.
    reason: Preservar uma ambiguidade real em vez de impor uma interpretação.
  - marker: c
    text: O testemunho assinala incerteza entre o singular “pensamento” e o plural “pensamentos”.
    reason: Refletir a indicação editorial thought<s> da fonte fornecida.
  - marker: d
    text: “Deleite” é uma restauração editorial de texto danificado; também não é inteiramente seguro se todos os pronomes desta frase têm o mesmo referente.
    reason: Sinalizar restauração e ambiguidade pronominal.
  - marker: e
    text: Há uma lacuna no manuscrito antes da expressão “por quem orações haviam sido oferecidas”.
    reason: Marcar material perdido que pode afetar a conexão sintática.
  - marker: f
    text: “Eles” representa uma restauração editorial; “Igreja” traduz aqui um nome cosmológico que o próprio texto relaciona à harmonia de uma assembleia.
    reason: Indicar a restauração e evitar que o termo seja lido automaticamente segundo uma eclesiologia posterior.
  - marker: g
    text: Há uma lacuna no manuscrito entre a igualdade na união e a conservação das diferenças individuais.
    reason: Registrar possível material ausente na transição argumentativa.
  - marker: h
    text: 'A construção final admite mais de uma análise: pode referir-se ao surgimento prematuro a partir de um só antes do recebimento vindo do Pai, ou antes da união com a Totalidade e a vontade desse referente.'
    reason: Manter a ambiguidade sintática e teológica do testemunho.
  - marker: i
    text: “Os primeiros” pode indicar primazia de ordem, posição ou experiência no conhecimento e na glória; a tradução não especifica qual dessas nuances predomina.
    reason: Evitar resolver uma expressão de prioridade cujo sentido exato depende da revisão do copta.
lexical_decisions:
- source_word: Word
  choice: Logos
  rationale: “Logos” preserva o caráter técnico e personificado do termo no tratado, evitando reduzir sua amplitude a uma simples palavra falada.
- source_word: Aeon
  choice: Éon
  rationale: Transliteração consagrada em estudos de textos gnósticos; preserva a entidade e esfera supramundana sem impor uma paráfrase temporal.
- source_word: Place
  choice: Lugar
  rationale: Mantém o título cosmológico concreto e sua possível função de âmbito ou morada.
- source_word: Synagogue of Salvation
  choice: Sinagoga da Salvação
  rationale: Preserva a metáfora de reunião e o título formal, sem substituí-lo por “Igreja” ou “assembleia” nesta ocorrência.
- source_word: Storehouse
  choice: Depósito
  rationale: Expressa um lugar de guarda ou reserva em linguagem corrente e digna, sem a conotação comercial mais forte de “armazém”.
- source_word: Fullness
  choice: Plenitude
  rationale: Mantém o termo cosmológico técnico e sua relação com unidade e totalidade.
- source_word: He Who Is
  choice: Aquele que É
  rationale: Preserva a forma titular e a afirmação ontológica sem identificar explicitamente a expressão com uma fórmula confessional externa.
- source_word: Totalities / Totality
  choice: Totalidades / Totalidade
  rationale: Mantém a distinção numérica do testemunho inglês, apesar da expressão incomum em português.
- source_word: energy
  choice: atividade
  rationale: Comunica a manifestação operante em contraste com “essência”; “energia” poderia soar apenas física no português corrente.
- source_word: passions
  choice: paixões
  rationale: Preserva o vocabulário antropológico antigo, esclarecido no próprio texto como enfermidade.
- source_word: plan of salvation
  choice: plano da salvação
  rationale: Reproduz a dimensão ordenadora e soteriológica sem acrescentar um esquema doutrinário específico.
theological_decisions:
- issue: Identidade e personificação do Logos
  choice: Manter “Logos” e os pronomes pessoais do testemunho
  alternative: Traduzir por “Palavra” ou explicitar uma identificação cristológica
  rationale: O trecho personifica a figura, mas a tradução não deve resolver além do texto sua identidade teológica exata.
- issue: Linguagem de masculinidade, feminilidade e enfermidade
  choice: Traduzir literalmente as categorias do tratado
  alternative: Neutralizar ou reinterpretar as categorias em linguagem contemporânea
  rationale: As categorias pertencem à cosmologia e à argumentação do documento; suavizá-las ocultaria uma tensão genuína do texto.
- issue: “Igreja” como nome cosmológico
  choice: Conservar “Igreja” com inicial maiúscula e explicar sua relação com a assembleia no próprio período
  alternative: Usar apenas “assembleia”
  rationale: A escolha preserva o nome técnico, enquanto a frase subsequente explicita seu sentido coletivo.
- issue: Inferioridade e inseparabilidade da imagem
  choice: Preservar simultaneamente as duas afirmações
  alternative: Harmonizá-las por uma explicação ontológica
  rationale: A tensão entre inferioridade e inseparabilidade é constitutiva do argumento e não deve ser resolvida pela tradução.
- issue: Origem prematura fora da unidade da Plenitude
  choice: Manter a sequência e a ambiguidade de referentes
  alternative: Identificar explicitamente quem ainda não havia recebido a unidade do Pai
  rationale: O testemunho disponível não permite fixar com segurança todos os antecedentes pronominais.
- issue: Consumação por meio dos seres mencionados
  choice: Traduzir “por meio deles tudo será levado à plenitude”
  alternative: Explicitar quem eles são ou qual é o mecanismo da consumação
  rationale: A referência permanece contextual e não deve ser convertida em uma doutrina mais definida.
translation_notes:
  register: Português moderno, formal sem arcaísmo e com legibilidade brasileira. Termos cosmológicos recorrentes recebem inicial maiúscula quando funcionam como nomes ou títulos. A redação busca fluidez, mas conserva repetições, contrastes e ambiguidades relevantes. Lacunas são indicadas por […] e restaurações editoriais por < > ou colchetes, conforme o tipo de intervenção refletido no testemunho. Por depender provisoriamente de uma tradução inglesa pública, o texto requer conferência integral com o copta do Códice de Nag Hammadi I,5 antes da publicação definitiva.
