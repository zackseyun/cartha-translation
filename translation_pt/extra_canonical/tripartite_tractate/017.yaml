review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva de modo consistente a terminologia cosmológica, as lacunas e as incertezas editoriais do testemunho inglês provisório. Contudo, a abertura altera a relação sintática: o texto diz que o pensamento foi chamado “Éon” e “Lugar” por/tendo em vista todos os que o Logos produziu, inclusive o que é chamado “Sinagoga da Salvação”; a redação apresentada faz de “Sinagoga da Salvação” um título adicional do pensamento. A revisão restaura a relação sem resolver a sintaxe difícil além do testemunho.'
  naturalness: O português é em geral claro, formal e adequado. Foram feitos pequenos ajustes de coesão e regência, especialmente em “sabedoria para seu pensamento”, sem simplificar a densidade argumentativa do tratado.
  terminology: “Logos”, “Éon”, “Plenitude”, “Totalidades”, “Igreja” e “Aquele que É” são escolhas apropriadas e coerentes. “Depósito” é uma tradução defensável de “Storehouse” neste registro. As marcas de lacuna, restauração e dúvida singular/plural foram mantidas.
  issues:
  - severity: medium
    issue: A primeira frase separa “Sinagoga da Salvação” como se fosse mais um nome dado ao pensamento.
    rationale: No testemunho, “even that which is called ‘Synagogue of Salvation’” qualifica o conjunto dos que o Logos produziu; a construção é difícil, mas a tradução não deve reconfigurá-la como predicação independente.
  - severity: low
    issue: “Sabedoria para o pensamento dele” é pouco natural em português.
    rationale: “Sabedoria para seu pensamento” conserva a relação expressa pelo testemunho e melhora a leitura sem definir a função cosmológica da sabedoria.
  revised_text: 'O pensamento do Logos, que havia recuperado sua estabilidade e passado a governar os que vieram a existir por meio dele, foi chamado de “Éon” e “Lugar” por todos os que ele havia produzido de acordo com a decisão, inclusive aquilo que é chamado “Sinagoga da Salvação”, porque ele se curou da dispersão — isto é, do pensamento múltiplo — e voltou ao pensamento único. De modo semelhante, é chamado “Depósito”, por causa do repouso que alcançou e concedeu somente a si mesmo. […][a] Também é chamado “Noiva”, por causa da alegria daquele que se entregou a ele na esperança de obter fruto da união, daquele mesmo que lhe apareceu.[b] É chamado ainda “Reino”, por causa da firmeza que alcançou enquanto se alegrava por dominar os que haviam guerreado contra ele. E é chamado “Alegria do Senhor”, por causa da alegria com que [ele] se revestiu. A luz permanece com ele e lhe dá a recompensa pelos bens que lhe pertencem, até mesmo o pensamento — ou os pensamentos — da liberdade.[c]



    O éon que mencionamos anteriormente está acima das duas ordens que combatem uma contra a outra. Não é companheiro dos que exercem domínio, nem pertence às enfermidades e fraquezas, coisas relacionadas à memória e à semelhança. Aquilo em que o Logos se colocou era um éon inteiramente alegre, que possuía a forma da matéria, mas também a natureza de sua causa — aquilo que foi revelado —, pois era uma imagem dos que habitam na Plenitude e que vieram a existir das riquezas do deleite Daquele que É.



    Além disso, enquanto se alegrava diante daquele que se revelou, em seu <deleite>, em sua expectativa e na promessa daquilo que havia pedido, ele possuía o nome do Filho, bem como sua essência, seu poder e sua forma.[d] Este é aquele a quem ele amou e em quem se deleitou, […] por quem orações haviam sido oferecidas com amor.[e] Esse éon era luz, desejo de ser firmado, disposição para aprender e olho para ver — qualidades que possuía da parte dos seres exaltados. Além disso, era sabedoria para seu pensamento, em oposição aos que estavam situados abaixo no plano da salvação, palavra para falar e perfeição de outras coisas semelhantes.



    Quanto aos que receberam forma junto com ele segundo a imagem da Plenitude, seus pais são os que se revelaram, sendo cada um deles uma cópia de uma das figuras. Como são formas de masculinidade e não se originam da enfermidade que é a feminilidade, procedem daquele que já havia fugido da enfermidade. <Eles> recebem o nome de “Igreja”, porque reproduzem harmoniosamente a harmonia da assembleia dos que vieram a manifestar-se.[f] Aquilo que veio a existir à imagem da luz também é perfeito, pois é imagem da única luz existente, que é as Totalidades. Embora seja inferior àquele de quem é imagem, ainda possui sua inseparabilidade, pois é uma face da luz inseparável.



    Contudo, os que vieram a existir à imagem de cada um dos éons são, em essência, aquilo que mencionamos anteriormente; em sua atividade, porém, são desiguais, pois ela está presente de modo diferente em cada um deles. Na união uns com os outros, eles são iguais; […][g] mas cada éon conservou as diferenças que lhe são próprias. É por isso que possuem paixões, sendo a paixão uma enfermidade: eles não foram produzidos da unidade da Plenitude, mas prematuramente, a partir de um só, antes que este a recebesse do Pai, ou antes da união com sua Totalidade e sua vontade.[h]



    Apesar disso, tal coisa foi benéfica para o futuro plano da salvação. Foi-lhes permitido atravessar os lugares inferiores, porque esses lugares não podem receber sua chegada repentina, a não ser um de cada vez. A chegada deles é necessária, pois por meio deles tudo será levado à plenitude.



    Em resumo, o Logos recebeu a visão de todas as coisas: das que existiam, das que agora existem e das que existirão, pois lhe foi confiado o plano da salvação de tudo o que existe. Algumas coisas já chegaram a existir, porque havia um propósito para isso. Em contraste, ele preservou dentro de si as sementes que ainda virão a existir, por causa da promessa referente àquilo que havia concebido — a promessa das sementes que ainda haveriam de existir. E produziu sua descendência, isto é, a revelação daquilo que havia concebido. Por algum tempo, porém, as sementes prometidas foram impedidas de vir à existência, pois foram designadas para uma missão quando vier o Salvador com seus companheiros, os primeiros no conhecimento e na glória do Pai.[i]'
