translation:
  language: pt
  text: "Este é aquele que lhes foi dado para satisfação, alimento, alegria e uma riqueza de iluminação, a qual compreende seu trabalho conjunto, seu conhecimento e sua união com eles.[a] Este é, de fato, aquele que não somente é chamado Filho, mas também é o Filho, porque ele é as Totalidades; e eles sabem quem ele é e que os cobre com vestes. Este é aquele chamado “Filho”, aquele cuja existência eles compreendem e a quem buscavam. Este é aquele que existe como Pai, aquele de quem eles não podem falar e a quem não apreendem. Este é o primeiro que veio a existir. Ninguém pode apreendê-lo nem compreendê-lo. Ou será que alguém pode se aproximar do Exaltado, daquele que, a rigor, é preexistente? Contudo, todos os nomes pensados [ ][b] ou proferidos a respeito dele são usados para honrá-lo, como uma alusão a ele, segundo a capacidade de cada um para glorificá-lo.\n\nAquele que surgiu dele quando ele se estendeu para gerar e produzir conhecimento para as Totalidades, ele [...] todo nome sem falsidade\
    \ e, a rigor, é o único Primeiro, o ser humano procedente do Pai, aquele a quem eu [chamo]:\n\n  a forma sem forma,\n\n  o corpo sem corpo,\n\n  o rosto invisível,\n\n  a palavra indizível,\n\n  a mente inapreensível,\n\n  a fonte que flui dele,\n\n  a raiz dos que foram plantados\n\n  e o deus dos que existem;\n\n  a luz daqueles a quem ele ilumina,\n\n  o amor daqueles a quem ele ama,\n\n  a providência daqueles a quem guia providencialmente,\n\n  a sabedoria daqueles a quem tornou sábios,\n\n  o poder daqueles a quem deu poder,\n\n  a assembleia <daqueles> que ele reúne para si,[c]\n\n  a revelação das coisas procuradas,\n\n  o olho dos que veem,\n\n  o sopro dos que respiram,\n\n  a vida dos que vivem,\n\n  a unidade dos que estão unidos às Totalidades.\n\nTodas essas coisas subsistem no Único, pois ele se reveste inteiramente delas e, ainda assim, nunca é chamado por seu único nome. E, nesse modo singular, elas são igualmente o Único e as Totalidades. Ele não pode ser separado como\
    \ um corpo, nem é dividido pelos nomes que recebeu, como se fosse uma coisa de um modo e [ ] algo [diferente] de outro modo. Além disso, ele não muda em [...] nem se transforma nos nomes que concebe, tornando-se ora isto, ora aquilo, sendo uma coisa agora e, em outro momento, tornando-se algo diferente. Em vez disso, ele permanece inteiramente ele mesmo até o fim. [Ele é], simultânea e eternamente, todas as Totalidades, sem exceção. Ele é aquele que abrange todas elas. Ele apresentou o Pai às Totalidades. De fato, ele é as Totalidades, porque é seu próprio autoconhecimento e é toda qualidade e todo poder. E [ele] mesmo [é] o olho por meio do qual possui conhecimento, contemplando plenamente a si mesmo em si mesmo e possuindo um Filho e uma forma.\n\nPortanto, seus poderes e suas qualidades são incontáveis e nunca ouvidos, por causa da maneira <como> ele os gera. Incontáveis e inseparáveis são aqueles que suas palavras geram, assim como suas instruções e suas Totalidades. Ele os conhece\
    \ — eles, que são aquilo que ele mesmo é —, porque subsistem no único nome, e todos falam por meio dele. E ele os faz surgir para que descubram que existem, segundo suas qualidades individuais, de modo unificado."
