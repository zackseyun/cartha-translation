    reason: Distingue material danificado ou restaurado do texto preservado sem conjecturar o conteúdo ausente.
  - marker: c
    text: Os sinais < > indicam palavras supridas editorialmente no testemunho consultado para completar a construção.
    reason: Mantém visível a intervenção editorial transmitida pela fonte de trabalho.
lexical_decisions:
- source_word: Totalities
  choice: Totalidades
  rationale: Mantém como termo técnico a abrangência coletiva e metafísica do testemunho, sem substituí-lo por “totalidade”, “universo” ou “plenitude”, que resolveriam indevidamente sua referência.
- source_word: mixing with them
  choice: sua união com eles
  rationale: “Mistura” seria excessivamente material em português corrente; “união” comunica a participação conjunta sem eliminar a imagem de integração.
- source_word: the single one
  choice: o Único
  rationale: Emprega um substantivo singular marcado, distinguindo a entidade ou unidade pessoal do simples numeral “um” e preservando sua relação paradoxal com as Totalidades.
- source_word: the human from the Father
  choice: o ser humano procedente do Pai
  rationale: Preserva a designação antropológica e a relação de origem sem restringir o sentido ao sexo masculino nem acrescentar uma identificação doutrinária.
- source_word: unspeakable word
  choice: a palavra indizível
  rationale: Reproduz o paradoxo entre palavra e impossibilidade de expressão em português natural e solene.
- source_word: breath
  choice: sopro
  rationale: Conserva a imagem concreta da respiração e evita introduzir “Espírito”, interpretação teológica não explicitada nesta linha.
theological_decisions:
- issue: Relação entre o Pai, o Filho e as Totalidades
  choice: Preservar literalmente as afirmações de que ele existe como Pai, é o Filho e é as Totalidades.
  alternative: Harmonizar as referências segundo categorias trinitárias posteriores ou separar rigidamente os referentes.
  rationale: O trecho sustenta deliberadamente identificações e distinções em tensão; esclarecê-las doutrinariamente importaria uma estrutura externa ao texto.
- issue: O “primeiro que veio a existir” e o “preexistente”
  choice: Manter lado a lado “veio a existir” e “é preexistente”.
  alternative: Traduzir um dos termos de modo a eliminar a aparente tensão temporal ou ontológica.
  rationale: A tensão pertence ao testemunho fornecido e não deve ser resolvida silenciosamente.
- issue: Uso de “deus” na enumeração
  choice: Traduzir “the god of those who are” como “o deus dos que existem”, com minúscula no contexto da lista.
  alternative: Usar “Deus” e identificar explicitamente o referente com uma formulação confessional.
  rationale: A opção conserva a função predicativa do título sem impor uma decisão editorial sobre nome próprio ou identidade doutrinária.
- issue: Linguagem de autoconhecimento e posse de um Filho
  choice: Conservar que ele é seu próprio autoconhecimento e possui um Filho e uma forma.
  alternative: Reformular para adequar a passagem a uma cristologia ou teologia sistemática específica.
  rationale: A formulação incomum é essencial à argumentação metafísica do tratado e deve permanecer aberta.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom digno e contemplativo. Preservaram-se a repetição retórica, as enumerações poéticas, os paradoxos e a terminologia metafísica. Evitaram-se tanto arcaísmos desnecessários quanto paráfrases confessionais. A tradução é necessariamente provisória porque a evidência copta ainda não foi examinada diretamente.
