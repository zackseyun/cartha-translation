  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do texto copta do Códice I,5 de Nag Hammadi ainda está pendente.
    reason: Declara com transparência a base documental e o limite atual da tradução.
  - marker: b
