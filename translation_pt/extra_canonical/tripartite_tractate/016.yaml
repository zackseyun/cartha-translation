    E <ela>[a] se alegrou com a visita de seus irmãos que vieram visitá-la. Glorificou e louvou aqueles que demonstraram ser uma ajuda para ela. Deu graças por ter escapado dos que se haviam rebelado contra ela, e estimou e honrou a Grandeza e aqueles que estavam decididos a se revelar a ela. Gerou imagens vivas das figuras vivas. Elas são agradáveis e boas, porque procedem de seres vivos e se assemelham a eles em beleza; contudo, não lhes são iguais em verdade, pois não procedem de uma união entre aquele que as produziu [][b] e aquele que se revelou a ele. Mesmo assim, ele atua com sabedoria e conhecimento, unindo completamente a Palavra a si mesmo. Por isso, os que foram produzidos a partir dele são grandes, assim como Aquele que É é verdadeiramente grande.


