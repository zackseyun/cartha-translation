id: TRIP.016
reference: Tripartite Tractate — The Fullness of the Word
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'When the deficient Word became enlightened, his Fullness sprang into being. He escaped from those who at the first had troubled him. He became disentangled from them. He stripped off that prideful thought. When those who at the first had been disobedient to him prostrated and humbled themselves in front of him, he became mingled with the Repose.


    And <he> was joyful because of the visitation of his visiting brothers. He glorified and praised those who were shown to have been a help to him. He gave thanks for escaping from those who had rebelled against him, and esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good, because they exist from living things, resembling them in beauty, yet unequal to them in truth, because they are not from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. And so those who were produced from him are great, just as He Who Is is truly great.


    After he wondered at the beauty of those <who> had appeared to him, he declared himself grateful for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come to be through him, so that they could obtain something good, because he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Those whom he purposefully produced are therefore on chariots, like those who came to be, those who appeared so that they could pass through every place of what is below, so that each one of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory, a revelation of those from the decision of the aeons, which was a unity and a mercy, whereas they are but seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces, and food for those whom the Word produced while praying and glorifying and praising. This is the one he glorified and praised [] while gazing at those he beseeched so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and the hope of the promise, because they possess joy and a wealth of repose and unsullied delights. Bestowing perfection with the goal of vision, he generated those he remembered at the first, when they were not (as yet) with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come to be would not perish by gazing on the light, given that they are unable to bear the great, lofty stature.'
