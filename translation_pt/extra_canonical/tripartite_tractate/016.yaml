lexical_decisions:
- source_word: Word
  choice: Palavra
  rationale: Mantém o termo técnico do testemunho e seu gênero gramatical natural em português; a retomada pronominal feminina decorre da gramática portuguesa, sem decidir a ontologia da figura.
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva o provável valor técnico cosmológico, em vez de reduzi-lo a simples completude.
- source_word: Repose
  choice: Repouso
  rationale: A inicial maiúscula sinaliza o uso técnico ou hipostático presente no testemunho.
- source_word: aeons
  choice: éons
  rationale: Transliteração já corrente em português para o termo técnico da literatura gnóstica, evitando paráfrase interpretativa.
- source_word: Totalities
  choice: Totalidades
  rationale: Conserva a forma abstrata e técnica, bem como a inicial maiúscula do testemunho.
- source_word: those of the likeness / those of the memory
  choice: os que pertencem à semelhança / os que pertencem à memória
  rationale: A formulação relacional preserva categorias obscuras do texto sem identificar indevidamente seus referentes.
- source_word: He Who Is
  choice: Aquele que É
  rationale: Mantém a força titulativa e existencial da expressão, sem impor uma identificação teológica adicional.
- source_word: visitation
  choice: visita
  rationale: Forma natural em português moderno; o contexto já comunica uma chegada significativa, sem exigir o registro mais eclesiástico de 'visitação'.
theological_decisions:
- issue: Gênero e identidade da Palavra
  choice: Usar 'Palavra' e pronomes femininos nas retomadas em que o referente é claramente a Palavra.
  alternative: Usar 'Verbo' e pronomes masculinos, ou alternar para harmonizar todas as retomadas.
  rationale: O português exige concordância gramatical, mas o testemunho fornecido alterna referentes e pronomes. A tradução não identifica automaticamente esta Palavra com uma formulação cristológica posterior e conserva as mudanças do texto quando o referente passa a uma figura masculina.
- issue: Ambiguidade dos referentes pronominais no segundo parágrafo
  choice: Preservar a mudança para o masculino em 'aquele que as produziu' e nas frases seguintes.
  alternative: Uniformizar tudo como referência à Palavra feminina.
  rationale: O testemunho inglês apresenta formas masculinas nesse ponto, e sem revisão copta não é seguro resolver a cadeia referencial.
- issue: Natureza da 'decisão dos éons'
  choice: Traduzir literalmente e manter a relação sintática ambígua com 'unidade e misericórdia'.
  alternative: Explicar que os éons decidiram em unidade e misericórdia.
  rationale: A sintaxe fornecida não determina com segurança se a unidade e a misericórdia caracterizam a decisão, sua origem ou outra realidade.
- issue: Referente de 'isso' no último parágrafo
  choice: Manter o pronome neutro 'isso'.
  alternative: Especificar 'a perfeição', 'a visão', 'a promessa' ou 'a luz'.
  rationale: O antecedente é incerto no testemunho; explicitá-lo importaria uma interpretação não garantida.
- issue: Plano de salvação
  choice: Conservar 'plano de salvação'.
  alternative: Usar 'economia da salvação' ou explicar uma doutrina soteriológica específica.
  rationale: A expressão comunica o sentido básico sem introduzir terminologia confessional nem resolver os mecanismos de salvação pressupostos pelo tratado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com vocabulário técnico preservado onde o tratado parece empregá-lo. Esta é uma tradução provisória baseada no testemunho inglês público fornecido; a revisão direta do copta do Códice de Nag Hammadi I,5 continua pendente. As ambiguidades referenciais e cosmológicas foram mantidas sempre que a evidência apresentada não permite resolvê-las com segurança.
