  text: 'When the deficient Word became enlightened, his Fullness came into being. He escaped from those who had troubled him at first. He disentangled himself from them. He stripped off that prideful thought. When those who had at first disobeyed him prostrated and humbled themselves before him, he became mingled with the Repose.


    And <he> rejoiced because of the visitation of his visiting brothers. He glorified and praised those who had shown themselves to be a help to him. He gave thanks for escaping from those who had rebelled against him, and he esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good because they come from living things and resemble them in beauty, yet they are not equal to them in truth, because they do not come from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. Therefore, those produced from him are great, just as He Who Is is truly great.


    After he marveled at the beauty of those <who> had appeared to him, he declared his gratitude for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come into being through him, so that they could obtain something good. For he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Therefore, those whom he purposefully produced are on chariots, like those who came into being, those who appeared so that they could pass through every place of what is below, so that each of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory—a revelation of those from the decision of the aeons, which was a unity and a mercy—whereas they are only seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised [] while gazing at those whom he beseeched, so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and their hope in the promise, because they possess joy, a wealth of repose, and unsullied delights. Bestowing perfection with vision as the goal, he generated those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come into being would not perish by gazing upon the light, since they are unable to bear the great, lofty stature.'
translation:
  language: pt
  text: 'Quando a Palavra deficiente foi iluminada, sua Plenitude veio à existência. Ela escapou daqueles que, no princípio, a haviam perturbado. Desvencilhou-se deles e se despojou daquele pensamento orgulhoso. Quando os que no princípio lhe haviam desobedecido se prostraram e se humilharam diante dela, ela se uniu ao Repouso.


    E <ela>[a] se alegrou com a visita de seus irmãos visitantes. Glorificou e louvou aqueles que demonstraram ser uma ajuda para ela. Deu graças por ter escapado dos que se haviam rebelado contra ela, e estimou e honrou a Grandeza e aqueles que estavam decididos a se revelar a ela. Gerou imagens vivas das figuras vivas. Elas são agradáveis e boas, porque procedem de seres vivos e se assemelham a eles em beleza; contudo, não lhes são iguais em verdade, pois não procedem de uma união entre aquele que as produziu [][b] e aquele que se revelou a ele. Mesmo assim, ele atua com sabedoria e conhecimento, unindo completamente a Palavra a si mesmo. Por isso, os que foram produzidos a partir dele são grandes, assim como Aquele que É é verdadeiramente grande.


    Depois de se maravilhar com a beleza daqueles <que>[c] lhe haviam aparecido, declarou-se grato por essa visita. A Palavra realizou essa obra com a ajuda daqueles que a auxiliaram, por causa da firmeza dos que vieram à existência por meio dela, para que pudessem obter algo bom. Pois ela se lembrou de orar pelo plano de salvação de todos aqueles que havia produzido, plano que foi firmado para estabelecê-los.


    Portanto, aqueles que ela produziu deliberadamente estão sobre carros, assim como os que vieram à existência, os que apareceram para que pudessem atravessar todos os lugares do que está abaixo, a fim de que a cada um fosse concedido o lugar apropriado à sua natureza.


    Isso é destrutivo para os que pertencem à semelhança, mas benéfico para os que pertencem à memória: uma revelação daqueles que procedem da decisão dos éons, a qual era unidade e misericórdia, ao passo que eles são apenas sementes que ainda não alcançaram a existência plena.


    Aquele que apareceu era uma face do Pai e da harmonia. Era uma veste de todas as graças e alimento para aqueles que a Palavra produziu enquanto orava, glorificava e louvava. Este é aquele a quem ela glorificou e louvou [][d], enquanto contemplava aqueles pelos quais suplicava, para que pudesse aperfeiçoá-los com as imagens que havia produzido.


    A Palavra aumentou a ajuda mútua entre eles e a esperança que tinham na promessa, porque possuem alegria, abundância de repouso e deleites imaculados. Concedendo perfeição tendo em vista a visão, ela gerou aqueles dos quais se lembrara no princípio, quando ainda não estavam com ela. Ela permanece na esperança e na fé no Pai perfeito, assim como as Totalidades. Isso lhe é revelado antes que ela se misture com isso, para que os que vieram à existência não pereçam ao contemplar a luz, visto que não conseguem suportar a grande e elevada estatura.'
