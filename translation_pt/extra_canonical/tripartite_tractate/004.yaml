  terminology: '"Igreja", "Pai", "Filho", "éons", "profundidade", "forma seminal" e "Aquele que É" são escolhas consistentes e não impõem uma leitura confessional posterior. As notas tratam adequadamente o uso técnico de "éons" e as ambiguidades preservadas.'
  issues:
  - severity: low
