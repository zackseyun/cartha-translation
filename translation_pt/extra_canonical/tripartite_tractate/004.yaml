translation:
  language: pt
  text: '[. . .] a Igreja existe nas qualidades e nos atributos nos quais o Pai e o Filho existem, como declarei desde o princípio. Ela subsiste, portanto, nos nascimentos de incontáveis éons.[a] Pelas qualidades e pelos atributos nos quais (a Igreja) [existe], (os éons) também geram de maneira incontável. Isso acontece porque esses (éons) [constituem] a união (da Igreja), que eles [formam] uns com os outros, [com aqueles] que procederam [deles e] com o Filho, para cuja glória existem.


    É impossível, portanto, que a mente os conceba, pois ele é a perfeição daquele lugar.[b] A fala tampouco pode descrevê-los, porque são indizíveis, inomináveis e inapreensíveis. Somente eles podem dar nome a si mesmos e conceber a si mesmos, porque não estão enraizados nestes lugares. Os que estão naquele lugar são indizíveis e incontáveis no sistema [que é] tanto [o modo] como a dimensão, o regozijo, a alegria daquele que é não gerado, sem nome, inominável, inapreensível, invisível e inconcebível. Essa é a plenitude da paternidade, de modo que suas riquezas são um nascimento.


    [] [. . .] dos éons habitavam eternamente no pensamento, porque o Pai era para eles como um pensamento e um lugar. Uma vez estabelecidas as gerações deles, aquele que detém o domínio total desejou tomar e trazer à existência o que era deficiente no [. . .], e trouxe à existência os que [estavam dentro] dele. Contudo, por ele ser [como] é, [ele é] uma fonte que não diminui com a água que dela flui abundantemente.


    Enquanto habitavam no pensamento do Pai, isto é, na profundidade oculta, a profundidade os conhecia, mas eles não podiam conhecer a profundidade em que habitavam. Era-lhes impossível conhecer a si mesmos ou conhecer qualquer outra coisa. Em outras palavras, habitavam com o Pai, mas sua existência não era para si mesmos. Existiam apenas como existe uma semente, e assim se constatava que existiam como um feto. Como por meio de uma palavra, ele os gerou, enquanto subsistiam em forma seminal; aqueles que ele haveria de gerar ainda não tinham recebido dele a existência.


    [] O Pai foi quem primeiro pensou neles. Semeou um pensamento como se fosse uma semente, não somente para que existissem por causa dele, mas também para que existissem por causa de si mesmos; para que, então, existissem no pensamento dele como seres dotados de conhecimento e também existissem por causa de si mesmos. Para que pudessem conhecer o que existe por causa deles, ele generosamente [concedeu a] forma inicial; e, para que [pudessem] conhecer [quem é o Pai], aquele que existe por causa deles, concedeu-lhes o nome de Pai por meio de uma voz que lhes declarava que tudo o que existe, existe por esse nome, que lhes pertence. Isso se deve ao fato de terem alcançado o ser por causa da exaltação que habita no nome — exaltação que eles não reconheceram. Enquanto ainda é feto, a criança tem o que lhe basta, sem ainda ver quem a semeou. A única tarefa deles, portanto, era procurá-lo, reconhecendo que ele existe e desejando constantemente descobrir o que existe.


    Contudo, porque o Pai perfeito é bom, assim como não se <fechou> para eles, fazendo-os existir eternamente apenas em seu pensamento, mas lhes concedeu que também alcançassem existência por causa de si mesmos, do mesmo modo lhes deu o dom de conhecer o que é, isto é, aquele que conhece a si mesmo eternamente.[c] [] [. . .] receber forma [para conhecer] que Aquele que É existe, assim como as pessoas que, ao nascerem neste lugar, entram na luz para poderem ver aqueles que as geraram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éons” translitera um termo usado aqui para realidades ou seres da ordem divina; neste contexto, não significa simplesmente longos períodos de tempo.
    reason: O uso técnico pode não ser conhecido pelo leitor comum e não deve ser confundido com o sentido cronológico moderno.
  - marker: b
    text: O referente de “ele” é incerto no texto preservado; a construção também pode refletir dano ou dificuldade na transmissão.
    reason: Preserva e sinaliza uma ambiguidade pronominal que não pode ser resolvida com segurança a partir do testemunho fornecido.
  - marker: c
    text: A construção permite entender “aquele que conhece a si mesmo eternamente” como explicação de “o que é”, mas a identificação exata não é explicitada.
    reason: Evita atribuir de modo indevido a frase ao Pai, ao Filho ou a outra realidade do sistema do tratado.
lexical_decisions:
- source_word: Church
  choice: Igreja
  rationale: Mantém o termo comunitário tradicional e sua possível carga técnica no tratado, sem substituí-lo por uma interpretação como “assembleia espiritual”.
- source_word: aeons
  choice: éons
  rationale: Transliteração já corrente em português para a entidade/categoria cosmológica do texto; evita reduzi-la ao sentido comum de “eras”.
- source_word: births / give birth / begot
  choice: nascimentos / geram / gerou
  rationale: Preserva a recorrente linguagem de geração e nascimento, central à exposição, com flexão natural em português.
- source_word: thought
  choice: pensamento
  rationale: Mantém a imagem conceitual do testemunho e não a converte em “mente” ou “intenção”, que estreitariam o sentido.
- source_word: depth
  choice: profundidade
  rationale: Conserva a metáfora espacial e sua possível função técnica, inclusive quando o termo é personificado como sujeito que conhece.
- source_word: spermatic form / spermatic seed
  choice: forma seminal / semente
  rationale: “Seminal” preserva a imagem gerativa com dignidade e clareza; “semente” evita uma formulação portuguesa excessivamente clínica na segunda ocorrência.
- source_word: He Who Is
  choice: Aquele que É
  rationale: Reproduz a designação ontológica com maiúsculas, sem identificá-la explicitamente com uma fórmula doutrinária posterior.
theological_decisions:
- issue: Relação ontológica entre Igreja, éons, Pai e Filho
  choice: Preservar a formulação de existência, geração e união sem explicá-la
  alternative: Parafrasear os éons como membros, emanações ou partes da Igreja
  rationale: O trecho apresenta relações cosmológicas densas e parcialmente ambíguas; uma classificação explícita importaria uma interpretação não declarada.
- issue: Referente de “he” em “he being the perfection of that place”
  choice: Traduzir literalmente “pois ele é a perfeição daquele lugar”
  alternative: Identificar o pronome como mente, Filho, Pai ou outro referente
  rationale: O testemunho é sintaticamente obscuro; manter o pronome masculino evita resolver sem base uma possível dificuldade textual.
- issue: “the one who knows himself eternally”
  choice: Manter como aposição de “o que é”
  alternative: Explicitar que se trata do Pai ou de Aquele que É
  rationale: A identificação é plausível, mas não deve ser imposta onde o texto preservado formula a relação por aposição.
- issue: Existir “por causa de si mesmos” e o Pai existir “por causa deles”
  choice: Conservar a reciprocidade verbal, embora teologicamente tensa
  alternative: Suavizar para “para benefício deles” ou “diante deles”
  rationale: A repetição parece deliberada no testemunho e deve permanecer aberta à interpretação, não ser harmonizada.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se colchetes, lacunas e reticências como sinais de dano ou restauração editorial, e os sinais < > como indicação de correção ou suprimento editorial do testemunho. Os parênteses do testemunho foram preservados onde marcam identificações editoriais. Como a revisão direta do copta ainda está pendente, esta é uma tradução provisória e transparente baseada no testemunho inglês público fornecido; evitou-se normalizar passagens obscuras.
