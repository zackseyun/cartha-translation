    rationale: Com dois antecedentes de gêneros distintos, "em que" é a solução natural e evita uma concordância marcada apenas com "atributos".
  - severity: low
    issue: A restauração "[como] é" reduz a formulação do testemunho "[the way] he is".
    rationale: '"[do modo como] é" preserva melhor a estrutura restaurada e mantém explícito que se trata de material editorialmente suprido.'
  - severity: low
