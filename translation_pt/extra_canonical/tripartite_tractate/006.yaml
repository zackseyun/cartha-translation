base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: pt
  text: '<...> Assim como os atos maravilhosos dos silêncios são gerações eternas e descendentes intelectuais, também as qualidades da Palavra são emanações espirituais. Visto que pertencem à fala, [] tanto [os atos maravilhosos] como as qualidades são sementes e pensamentos de seus descendentes, raízes vivas e eternas que aparecem como descendentes originados de si mesmos. Eles existem como mentes e descendentes espirituais para a glória do Pai.


    [Por serem] espíritos e mentes, não precisam de som nem de fala, nem precisam realizar [um ato] para obter aquilo que desejam [ver realizado]. Em vez disso, seguindo o modelo da própria existência [do Pai], [aqueles] que se originam dele geram tudo o que desejam. E ele tem filho<s>: aquele em quem pensam e de quem falam, para quem se movem, em quem subsistem e a quem cantam hinos para glorificá-lo. Pois este é o poder de procriação deles: assemelham-se àqueles dos quais se originaram e estão em harmonia com a ajuda que compartilham, visto que ajudam uns aos outros como fazem os que não foram gerados.


    O Pai, de acordo com sua posição exaltada acima das Totalidades, é desconhecido e inapreensível. Ele possui tamanha grandeza e magnitude que, se ela fosse revelada de modo súbito e imediato, destruiria todos os seres elevados entre os éons que dele se originaram. Por isso, restringiu sua força e seus recursos infinitos, que constituem seu ser [], [permanecendo] indizível e inominável, exaltado acima de toda mente e de toda fala.


    Contudo, é ele quem se estendeu, e aquilo que estendeu formou um fundamento, um lugar e uma morada para o universo. Um de seus nomes é Aquele por Quem, porque ele é o Pai de Todos. Por seu trabalho em favor dos seres existentes, semeou neles o pensamento de procurá-lo. A riqueza de seu [. . .] consiste em compreenderem que ele existe e investigarem aquilo que existia.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Word
  choice: Palavra
  rationale: Preserva o título conceitual e a personificação do testemunho, sem impor uma identificação teológica além do texto.
- source_word: silences
  choice: silêncios
  rationale: Mantém o plural abstrato e técnico do testemunho, sem normalizá-lo para uma entidade singular.
- source_word: intellectual offspring
  choice: descendentes intelectuais
  rationale: Conserva a linguagem de geração e o caráter relativo à mente; evita 'filhos', que estreitaria o sentido.
- source_word: emanations
  choice: emanações
  rationale: É o equivalente técnico mais direto no contexto cosmológico do tratado.
- source_word: aeons
  choice: éons
  rationale: Emprega a transliteração corrente para as entidades ou ordens supramundanas do texto, em vez de reduzir o termo a simples períodos de tempo.
- source_word: Totalities
  choice: Totalidades
  rationale: Preserva a forma plural e a possível função técnica do termo.
- source_word: ungraspable
  choice: inapreensível
  rationale: Expressa impossibilidade de apreensão intelectual sem confundi-la apenas com invisibilidade.
- source_word: subsist
  choice: subsistem
  rationale: Retém a nuance ontológica do testemunho, mais precisa aqui que 'vivem' ou 'permanecem'.
- source_word: the One by Whom
  choice: Aquele por Quem
  rationale: Mantém a fórmula nominal elíptica e sua relação causal ou instrumental, sem completar o que o texto não explicita.
- source_word: what was existent
  choice: aquilo que existia
  rationale: Preserva a referência temporal e ontológica ambígua do testemunho.
theological_decisions:
- issue: Identidade da Palavra
  choice: Manter 'Palavra' como título, sem identificá-la explicitamente com Cristo
  alternative: Traduzir ou explicar como 'Logos/Cristo'
  rationale: O trecho não faz explicitamente essa identificação; acrescentá-la resolveria uma tensão teológica que deve permanecer aberta.
- issue: Seres 'não gerados' no plural
  choice: Manter 'os que não foram gerados'
  alternative: Harmonizar com um único Pai não gerado
  rationale: O plural pertence ao testemunho e pode refletir a cosmologia própria do tratado; não deve ser corrigido por pressupostos doutrinários externos.
- issue: A extensão do Pai
  choice: Traduzir literalmente 'ele quem se estendeu'
  alternative: Interpretar como criação, emanação ou encarnação
  rationale: A imagem é metafísica e ambígua; uma explicação doutrinária no corpo do texto excederia a evidência fornecida.
- issue: Grandeza potencialmente destrutiva do Pai
  choice: Preservar a afirmação de que sua revelação destruiria os seres elevados
  alternative: Suavizar para 'subjugaria' ou 'ofuscaria'
  rationale: A tensão entre transcendência, revelação e preservação dos éons é substantiva no texto.
- issue: child<ren>
  choice: Preservar a marca editorial como 'filho<s>'
  alternative: Escolher definitivamente singular ou plural
  rationale: O testemunho assinala incerteza ou correção editorial, e a fonte copta ainda aguarda revisão direta.
translation_notes:
  register: Português moderno, digno e legível, com terminologia técnica preservada quando necessária. Colchetes, lacunas, reticências e sinais editoriais foram mantidos porque refletem incertezas ou danos textuais do testemunho inglês público. Esta é uma versão provisória baseada nesse testemunho; a revisão direta do copta do Códice de Nag Hammadi I,5 continua pendente.
