    Como um número, o Pai é um, porque vem primeiro e existe sozinho em si mesmo. Contudo, ele não se assemelha a alguém que seja meramente um. Se fosse assim, como poderia ser pai? Pois, sempre que existe um pai, segue-se o nome “filho”. Aquele que é somente o Pai se assemelha à raiz de uma árvore com ramos e fruto. Em sentido estrito, ele é chamado pai porque é incomparável e imutável. Por isso, em sentido estrito, ele é um e é um deus, visto que ninguém está em relação com ele como deus, porque ninguém é seu pai. Pois ele é não gerado: ninguém o gerou, e ninguém o criou. Todo aquele que é pai ou criador de outro também tem pai e criador. Certamente, tal pessoa pode ser pai e criador de alguém que veio a existir por meio dela e que ela criou. Mas, em sentido estrito, ela não é pai nem deus, porque houve [] alguém que [a gerou e] criou. Portanto, em sentido estrito, somente ele é Pai e Deus, aquele a quem ninguém gerou. Quanto às Totalidades,[b] é ele quem as gerou e criou.



