  yaml_path: translation/extra_canonical/tripartite_tractate/001.yaml
  text: '[] When discussing exalted matters, it is fitting to begin with the Father, the root of the Totality, from whom we have received the gift of speaking about him. Before anything besides him came into being, he existed.


    Like a number, the Father is one, because he comes first and is alone in himself. Yet he does not resemble someone who is merely one. If he did, how could he be a father? For whenever a father exists, the name “son” follows. The one who is the Father alone resembles the root of a tree with branches and fruit. Strictly speaking, he is called a father because he is incomparable and unchanging. This is why, strictly speaking, he is one and is a god, since no one stands in relation to him as a god, because no one is his father. For he is unbegotten: no one else begot him, and no one else created him. Anyone who is someone else’s father or creator also has a father and a creator. Certainly, he can be the father and creator of someone who came into being from him and whom he created. But, strictly speaking, he is not a father and is not a god, because there was [] someone who [begot and] created him. Therefore, strictly speaking, only he is Father and God who has had no one beget him. As for
    the Totalities, he is the one who begot and created them.


    He has no beginning and no end, but it is not merely that he has no end. Because he is unbegotten, he is deathless. Yet he is also unchanging in his eternal being, in his self-identity, in what established him, and in what makes him great. He will never be separated from what makes him exist, and no one will compel him to bring forth any intention he has never willed. No one originated the Father’s existence, and so he is unchanging. No one can separate him from his own being and self-identity, in which he exists, or from his greatness, which is why no one can comprehend him. It is impossible for anyone to change his form into something different, to lower him, to change him, or to diminish him. This is <how>, in the fullness of truth, he is the unchangeable and invariable one, with immutability as his garments. It is not merely that he is called “Beginningless” and “Endless”; he was not born, nor will he die. Thus, just as he is without beginning and without end in the way he exists,
    so [] in his greatness he cannot be reached. He is incomprehensible in his wisdom, unfathomable in his power, and unknowable in his sweetness.


    Strictly speaking, only he who is good—the unbegotten Father and the wholly perfect one—is full of his offspring, of every virtue, and of everything valuable. He possesses still more, including the absence of all spite, so that one may find that all who possess anything owe it to him, because he bestows it. Yet he is unattainable and tireless in his giving, rich in the gifts he gives and at rest in the favors he lavishes.


    His category, form, and great scale are such that none have been with him from the beginning. There is no place where he dwells, from which he proceeds, or into which he enters. There is no primal form that he uses as a pattern when he works. No difficulty accompanies him in anything he does, nor is any matter available for him to use in creating what <he> creates. There is no substance inhering in him that he uses to beget whatever he begets, nor is there any coworker accompanying him in his work. To claim anything like this is ignorance. Instead, one should declare that he is good, without defect, perfect, [] entire, since he is the Totality.


    None of the names that are thought or spoken, seen or understood, apply to him, no matter how immensely majestic, glorifying, and reverential they may be. Such names may, however, be spoken for his glory and honor, according to the ability of those who glorify him. As for what inheres in his existence, being, and form, the mind cannot conceive of him, words cannot express him, eyes cannot behold him, and no one can comprehend him. This is because of his unsearchable greatness, his ungraspable depth, his limitless height, and his unlimited <extension>.


    This is the character of what is unbegotten: it does not extend or join itself to anything as something limited does. Instead, he has a character without possessing a face or form, things that can be comprehended through perception. This is why he is incomprehensible.'
translation:
  language: pt
  text: '[] Ao tratar de assuntos elevados, convém começar pelo Pai, a raiz da Totalidade, de quem recebemos o dom de falar a seu respeito. Antes que qualquer outra coisa além dele viesse a existir, ele já existia.


    Como um número, o Pai é um, porque vem primeiro e existe sozinho em si mesmo. Contudo, ele não se assemelha a alguém que seja meramente um. Se fosse assim, como poderia ser pai? Pois, sempre que existe um pai, segue-se o nome “filho”. Aquele que é o Pai somente se assemelha à raiz de uma árvore com ramos e fruto. Em sentido estrito, ele é chamado pai porque é incomparável e imutável. Por isso, em sentido estrito, ele é um e é deus,[a] visto que ninguém está em relação com ele como deus, porque ninguém é seu pai. Pois ele é não gerado: ninguém o gerou, e ninguém o criou. Todo aquele que é pai ou criador de outro também tem pai e criador. Certamente, tal pessoa pode ser pai e criador de alguém que veio a existir por meio dela e que ela criou. Mas, em sentido estrito, ela não é pai nem deus, porque houve [] alguém que [a gerou e] criou. Portanto, em sentido estrito, somente ele é Pai e Deus, aquele a quem ninguém gerou. Quanto às Totalidades,[b] foi ele quem as gerou e criou.


    Ele não tem princípio nem fim; mas não se trata apenas de não ter fim. Por ser não gerado, ele é imortal. Contudo, ele também é imutável em seu ser eterno, em sua identidade própria, naquilo que o estabeleceu e naquilo que o torna grande. Jamais será separado daquilo que o faz existir, e ninguém o obrigará a produzir intenção alguma que ele nunca tenha desejado. Ninguém deu origem à existência do Pai; por isso, ele é imutável. Ninguém pode separá-lo de seu próprio ser e de sua identidade própria, nos quais ele existe, nem de sua grandeza; por isso, ninguém pode compreendê-lo. É impossível que alguém transforme sua forma em algo diferente, que o rebaixe, o altere ou o diminua. É <assim> que, na plenitude da verdade, ele é o imutável e invariável, tendo a imutabilidade como suas vestes. Não se trata apenas de ele ser chamado “Sem Princípio” e “Sem Fim”; ele não nasceu, nem morrerá. Portanto, assim como não tem princípio nem fim no modo como subsiste, também [] em sua grandeza ele é inalcançável:
    incompreensível em sua sabedoria, insondável em seu poder e incognoscível em sua doçura.


    Em sentido estrito, somente aquele que é bom — o Pai não gerado e inteiramente perfeito — está pleno de sua descendência, de toda virtude e de tudo o que tem valor. Ele possui ainda mais, inclusive a ausência de toda maldade, de modo que se possa reconhecer que todos os que possuem alguma coisa a devem a ele, pois é ele quem a concede. Embora seja inalcançável, ele é incansável em dar, rico nos dons que concede e repousando nos favores que prodigaliza.


    Sua categoria, forma e imensa grandeza são tais que ninguém esteve com ele desde o princípio. Não há lugar onde ele habite, de onde proceda ou no qual entre. Não há forma primordial que ele use como modelo ao trabalhar. Nenhuma dificuldade acompanha coisa alguma que faça, nem há matéria à sua disposição para criar aquilo que <ele> cria. Não há substância inerente a ele que use para gerar o que gera, nem colaborador algum que o acompanhe em sua obra. Afirmar qualquer coisa assim é ignorância. Deve-se, antes, declarar que ele é bom, sem defeito, perfeito, [] inteiro, pois ele é a Totalidade.


    Nenhum dos nomes pensados ou pronunciados, vistos ou entendidos se aplica a ele, por mais imensamente majestosos, gloriosos e reverentes que sejam. Tais nomes, porém, podem ser pronunciados para sua glória e honra, conforme a capacidade dos que o glorificam. Quanto ao que é inerente à sua existência, ao seu ser e à sua forma, a mente não pode concebê-lo, as palavras não podem expressá-lo, os olhos não podem contemplá-lo e ninguém pode compreendê-lo. Isso se deve à sua grandeza inescrutável, à sua profundidade inapreensível, à sua altura sem limites e à sua <extensão> ilimitada.


    Este é o caráter do que é não gerado: ele não se estende nem se une a coisa alguma como faz aquilo que é limitado. Ao contrário, ele tem um caráter sem possuir rosto ou forma — coisas que podem ser compreendidas pela percepção. Por isso, ele é incompreensível.


    [a] Ou: “um deus”. A construção permite essa leitura; o contexto logo depois emprega “Pai e Deus” como títulos estritos.


    [b] “Totalidades” preserva o plural do testemunho, em contraste com “a Totalidade” no singular em outras passagens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “um deus”. A construção permite essa leitura; o contexto logo depois emprega “Pai e Deus” como títulos estritos.'
    reason: Sinaliza ambiguidade teologicamente relevante na predicação e evita resolvê-la silenciosamente.
  - marker: b
    text: “Totalidades” preserva o plural do testemunho, em contraste com “a Totalidade” no singular em outras passagens.
    reason: Explica uma alternância terminológica incomum, mas potencialmente significativa.
lexical_decisions:
- source_word: the Totality / the Totalities
  choice: a Totalidade / as Totalidades
  rationale: Preserva a alternância conceitualmente relevante entre singular e plural no testemunho, sem reduzi-los a “universo” ou “todas as coisas”.
- source_word: unbegotten
  choice: não gerado
  rationale: Expressa diretamente a ausência de geração ou progenitor e mantém a distinção em relação a “não criado”.
- source_word: self-identity
  choice: identidade própria
  rationale: Português corrente e digno que conserva a ideia de permanência idêntica a si mesmo.
- source_word: deathless
  choice: imortal
  rationale: Forma natural em português para ausência de morte, sem alterar o sentido do contexto.
- source_word: sweetness
  choice: doçura
  rationale: Mantém a metáfora afetiva e apofática do testemunho em vez de interpretá-la como bondade ou graça.
- source_word: extension
  choice: extensão
  rationale: Preserva a restauração assinalada e o vocabulário espacial e filosófico do trecho.
- source_word: spite
  choice: maldade
  rationale: Escolha abrangente e natural; evita o sentido excessivamente estreito de “rancor” no contexto da perfeição do Pai.
theological_decisions:
- issue: A expressão “is a god” em relação ao Pai
  choice: “é deus”, com nota indicando “um deus”
  alternative: “é um deus” ou “é Deus”
  rationale: Mantém a ambiguidade predicativa do testemunho sem impor de imediato nem um sentido indefinido nem o uso inequívoco como nome próprio; a continuação “Pai e Deus” permanece capitalizada como título.
- issue: Geração e criação
  choice: Manter “gerou” e “criou” como verbos distintos
  alternative: Uniformizar ambos como “fez” ou “originou”
  rationale: A distinção é reiterada pelo texto e pode carregar tensão cosmológica e teológica que não deve ser eliminada.
- issue: Linguagem apofática e atribuição de nomes
  choice: Preservar a afirmação de que nenhum nome se aplica a ele, embora nomes possam honrá-lo
  alternative: Harmonizar a tensão explicando que os nomes se aplicam apenas analogicamente
  rationale: O texto sustenta deliberadamente a tensão entre transcendência inexprimível e linguagem de louvor; não se acrescenta uma solução doutrinária externa.
- issue: “in what established him”
  choice: “naquilo que o estabeleceu”
  alternative: “em sua estabilidade”
  rationale: A formulação é teologicamente difícil, mas o testemunho a apresenta assim. A tradução não a corrige nem sugere que outro ser tenha necessariamente causado o Pai.
- issue: Singular e plural de Totalidade
  choice: Preservar “Totalidade” e “Totalidades”
  alternative: Traduzir ambos por “todas as coisas”
  rationale: A alternância pode refletir terminologia técnica do tratado e deve permanecer visível.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com registro digno. Mantiveram-se os sinais editoriais [] para lacunas e [texto] para reconstruções, bem como <texto> para suplementações do testemunho. Como o copta ainda aguarda revisão direta, esta versão é provisória e se baseia no testemunho inglês público fornecido; procurou-se evitar maior precisão do que a evidência disponível permite.
