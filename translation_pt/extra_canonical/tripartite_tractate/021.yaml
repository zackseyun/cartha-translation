    A criação da humanidade ocorreu como a de todas as outras coisas. De modo invisível, o Verbo espiritual os movia, completando-os por meio do Demiurgo[a] [] e de seus servos angélicos, os quais, juntamente com a Presunção e seus arcontes[b], participaram da obra de formação. Os seres humanos se assemelham a uma sombra da terra, para que fossem como [aqueles] separados das Totalidades[c]. E são criaturas feitas por todos eles, os da direita e os da esquerda, cada uma das ordens conferindo uma forma ao [ser humano, assim como] (a própria Totalidade) havia sido (formada).



    A [forma] que o Verbo produziu era deficiente, como uma [aflição] de enfermidade, pois ele a conduziu ao [esquecimento], à ignorância, à [deficiência] e a toda outra enfermidade. Isso porque o Verbo conferiu apenas a primeira forma, <algo que lhe deu> em ignorância por meio do Demiurgo, para que ele viesse a saber que existe algo exaltado e que necessita [disso]. É isso que o profeta chamou de “o Espírito vivente”, “o sopro dos éons exaltados”[d] e “o invisível”; e esta é a alma vivente que deu vida ao corpo que a princípio não tinha vida, mas aquilo que não tem vida é a ignorância.



    Por conseguinte, convém sustentar que a alma do primeiro ser humano teve origem no Verbo espiritual, embora o Criador supusesse tê-la feito. Aquilo que foi soprado passou por ele como por uma boca.



    De sua substância, o Criador também enviou almas para baixo, porque também [ele] possui o poder de procriação, [] <tendo sido> produzido a partir da representação do Pai. Também os da esquerda produziram um certo tipo de ser humano que lhes era próprio, porque eles igualmente possuem a semelhança do <ser>.



    A substância espiritual é uma realidade unitária e uma única representação, [e] sua enfermidade é uma condição [de muitas] formas. Quanto à substância dos seres anímicos[e], sua condição é dual, pois possui conhecimento e louva o Exaltado, mas <também> se inclina para o mal por causa da inclinação da Presunção. Quanto à substância dos seres materiais, seu modo difere, até mesmo em várias formas; e era uma enfermidade que prevalecia em diversas espécies de inclinação.



    Assim, o primeiro ser humano é uma formação diversa, uma criação diversa, um receptáculo para os da esquerda e os da direita, e um Verbo espiritual cujos interesses se dividem entre cada uma das duas substâncias das quais deriva seu ser.



    É por isso que se diz que um paraíso foi plantado para ele, para que pudesse comer o alimento de três espécies de árvores, pois é um jardim de três ordens e proporciona deleite. A substância nobre e escolhida que havia nele era mais exaltada do que <a> criação, e isso <era> uma afronta para eles. Por isso, deram uma ordem, ameaçando-o com um grave perigo que lhe sobreviria, [] isto é, a morte. Só lhe foi permitido provar e desfrutar das árvores más; quanto à outra árvore, a da dualidade, ele não lhe permitiu comer dela, muito menos da árvore da vida. Isso para impedir que alcançasse uma honra [igual à] deles e para impedir [que ele . . .] eles.



    Por meio da potência maligna chamada “a serpente”, aquele que é mais astuto do que todas as potências malignas, o ser humano <foi> desviado pelo plano dos que pertencem à memória e aos desejos. Ela o fez desobedecer ao mandamento, para que morresse. E ele foi expulso daquele lugar, de todos os seus deleites.



    Esta é a expulsão com que o castigaram, quando foi afastado dos deleites dos que pertencem à semelhança e dos que pertencem à representação. Na realidade, isso foi um ato de providência, para que os seres humanos percebessem que os prazeres duram apenas pouco tempo, em contraste com o lugar eterno de repouso. O Espírito havia ordenado esse ato quando planejou de antemão que o ser humano experimentasse o grande mal, isto é, a morte, que é a ignorância completa da Totalidade, e também provasse todos os males que dela procedem; e que, depois das paixões, das angústias e do que delas procede, alcançasse o maior [] bem, isto é, a vida eterna, que é o conhecimento completo das Totalidades e a obtenção de todo bem.



