translation:
  language: pt
  text: 'A matéria, cuja forma é fluida, é causa da cegueira que prevalece por meio das potências [. . .] nelas tudo isso [. . .], enquanto juntas geram e são [destruídas]. O pensamento colocado entre os da [direita e] os da esquerda é uma potência de [imitação]. Todos aqueles que os primeiros desejam fazer são, por assim dizer, a projeção de uma sombra que acompanha um corpo, e isso <constitui> as raízes das criaturas visíveis.


    Toda a preparação da ordenação das imagens, representações e semelhanças veio a existir por causa daqueles que necessitam de educação, instrução e formação proporcionadas por um espelho, para que o que é pequeno pudesse crescer passo a passo. A razão disso foi que ele criou a humanidade por último, preparando e provendo primeiro para ela as coisas que havia criado por sua causa.


    A criação da humanidade ocorreu como a de todas as outras coisas. De modo invisível, o Verbo espiritual os movia, completando-os por meio do Demiurgo[a] [] e de seus servos angélicos, os quais, juntamente com a Presunção e seus arcontes[b], participaram da obra de formação. Os seres humanos se assemelham a uma sombra da terra, para que fossem como [aqueles] separados das Totalidades[c]. E são criaturas feitas por todos eles, os da direita e os da esquerda, cada uma das ordens conferindo uma forma ao [ser humano, assim como] (a própria Totalidade) havia sido (formada).


    A [forma] que o Verbo produziu era deficiente, como uma [aflição] de fraqueza, pois ele a conduziu ao [esquecimento], à ignorância, à [deficiência] e a toda outra fraqueza. Isso porque o Verbo conferiu apenas a primeira forma, <algo que lhe deu> em ignorância por meio do Demiurgo, para que ele viesse a saber que existe algo exaltado e que necessita [disso]. É isso que o profeta chamou de “o Espírito vivente”, “o sopro dos éons exaltados”[d] e “o invisível”; e esta é a alma vivente que deu vida ao corpo que a princípio não tinha vida, mas aquilo que não tem vida é a ignorância.


    Por conseguinte, convém sustentar que a alma do primeiro ser humano teve origem no Verbo espiritual, embora o Criador supusesse tê-la feito. Aquilo que foi soprado passou por ele como por uma boca.


    De sua própria substância, o Criador também enviou almas para baixo, porque também [ele] possui o poder de procriação, [] <tendo sido> produzido a partir da representação do Pai. Também os da esquerda produziram certa espécie própria de ser humano, porque eles igualmente possuem a semelhança do <ser>.


    A substância espiritual é uma realidade unitária e uma única representação, [e] sua fraqueza é uma condição [de muitas] formas. Quanto à substância dos seres anímicos[e], sua condição é dual, pois possui conhecimento e louva o Exaltado, mas <também> se inclina para o mal por causa da inclinação da Presunção. Quanto à substância dos seres materiais, seu modo difere, até mesmo em várias formas; e era uma fraqueza que prevalecia em diversas espécies de inclinação.


    Assim, o primeiro ser humano é uma formação diversa, uma criação diversa, um depósito para os da esquerda e os da direita, e um Verbo espiritual cujos interesses se dividem entre cada uma das duas substâncias das quais deriva seu ser.


    É por isso que se diz que um paraíso foi plantado para ele, para que pudesse comer o alimento de três espécies de árvores, pois é um jardim de três ordens e proporciona deleite. A substância nobre e escolhida que havia nele era mais exaltada do que <a> criação, e isso <era> uma afronta para eles. Por isso, deram uma ordem, ameaçando-o com um grave perigo que lhe sobreviria, [] isto é, a morte. Só lhe foi permitido provar e desfrutar das árvores más; quanto à outra árvore, a da dualidade, ele não lhe permitiu comer dela, muito menos da árvore da vida. Isso para impedir que alcançasse uma honra [igual à] deles e para impedir [que ele . . .] eles.


    Por meio da potência maligna chamada “a serpente”, aquele que é mais astuto do que todas as potências malignas, o ser humano <foi> desviado pelo plano dos que pertencem à memória e aos desejos. Ela o fez desobedecer ao mandamento, para que morresse. E ele foi expulso daquele lugar, de todos os seus deleites.


    Esta é a expulsão com que o castigaram, quando foi afastado dos deleites dos que pertencem à semelhança e dos que pertencem à representação. Na realidade, isso foi um ato de providência, para que os seres humanos percebessem que os prazeres duram apenas pouco tempo, em contraste com o lugar eterno de repouso. O Espírito havia ordenado esse ato quando planejou de antemão que o ser humano experimentasse o grande mal, isto é, a morte, que é a ignorância completa da Totalidade, e também provasse todos os males que dela procedem; e que, depois das paixões, das angústias e do que delas procede, alcançasse o maior [] bem, isto é, a vida eterna, que é o conhecimento completo das Totalidades e a obtenção de todo bem.


    Por causa da desobediência do primeiro ser humano, a morte reinou. Ela costumava matar todo ser humano enquanto possuía [domínio] e prevalecia, domínio que recebeu [como] reino por causa do <já> mencionado plano de salvação, segundo a vontade do Pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Demiurgo” é um termo técnico para o artífice ou criador do mundo inferior nesta cosmologia; o texto o distingue do Pai e do Verbo espiritual.
    reason: Esclarecer terminologia cosmológica sem inserir juízo denominacional.
  - marker: b
    text: “Arcontes” significa literalmente “governantes” e aqui designa potências da ordem cósmica.
    reason: A transliteração técnica pode não ser familiar ao leitor comum.
  - marker: c
    text: “Totalidades” é um termo técnico do tratado para a plenitude das realidades superiores; o texto também emprega o singular “Totalidade”.
    reason: Preservar a terminologia e explicar sua função geral.
  - marker: d
    text: “Éons” designa aqui realidades ou ordens eternas do mundo superior, não apenas períodos de tempo.
    reason: Evitar a leitura exclusivamente cronológica do termo.
  - marker: e
    text: '“Anímicos” significa “pertencentes à alma” e designa uma das três classes mencionadas pelo tratado: espiritual, anímica e material.'
    reason: Tornar compreensível uma categoria antropológica técnica.
lexical_decisions:
- source_word: Word
  choice: Verbo
  rationale: Preserva o sentido hipostático de Logos e sua ressonância religiosa, sem reduzi-lo a uma simples palavra falada.
- source_word: Demiurge
  choice: Demiurgo
  rationale: Mantém o termo técnico próprio do horizonte cosmológico do tratado.
- source_word: powers
  choice: potências
  rationale: Distingue entidades ou forças cosmológicas de mera autoridade política.
- source_word: archons
  choice: arcontes
  rationale: Transliteração técnica corrente, evitando interpretar o termo apenas como governantes humanos.
- source_word: Totalities / Totality
  choice: Totalidades / Totalidade
  rationale: Conserva a terminologia metafísica do testemunho e a alternância entre plural e singular.
- source_word: aeons
  choice: éons
  rationale: Preserva o termo cosmológico técnico em vez de normalizá-lo como eras.
- source_word: soulish ones
  choice: seres anímicos
  rationale: Representa a categoria intermediária ligada à alma, evitando o sentido moderno pejorativo de psíquicos.
- source_word: presumption
  choice: Presunção
  rationale: A inicial maiúscula sinaliza que o texto parece tratar a qualidade como potência ou entidade personificada.
- source_word: representation
  choice: representação
  rationale: Mantém a distinção recorrente em relação a imagem e semelhança.
theological_decisions:
- issue: Origem da alma do primeiro ser humano
  choice: Preservar a afirmação de que ela procede do Verbo espiritual enquanto o Criador apenas supõe tê-la produzido.
  alternative: Harmonizar o Criador e o Verbo como um único agente.
  rationale: O contraste é explícito e teologicamente essencial para a cosmologia do tratado.
- issue: Sentido da expulsão do paraíso
  choice: Manter simultaneamente o castigo imposto pelas potências e o ato de providência ordenado pelo Espírito.
  alternative: Resolver a expulsão exclusivamente como punição ou exclusivamente como benefício.
  rationale: O texto sustenta deliberadamente ambas as perspectivas.
- issue: Morte e ignorância
  choice: Traduzir a morte como identificação explicativa com a ignorância completa da Totalidade.
  alternative: Tratar a expressão apenas como metáfora livre.
  rationale: A equivalência é formulada diretamente pelo testemunho e deve permanecer visível.
- issue: Árvores do paraíso
  choice: Preservar as três classes — más, dualidade e vida — sem harmonização automática com Gênesis.
  alternative: Reformular segundo as categorias mais conhecidas do relato bíblico canônico.
  rationale: A interpretação tripartida é distintiva desta obra e não deve ser substituída por outra tradição.
- issue: Pronomes e agentes ambíguos
  choice: Manter referências pronominais quando o testemunho não permite identificar com segurança o agente.
  alternative: Nomear o Verbo, o Demiurgo, o Espírito ou as potências em cada ocorrência.
  rationale: Evita resolver silenciosamente ambiguidades reais do texto preservado.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A tradução é provisória porque a revisão direta do copta ainda está pendente e se baseia no testemunho inglês público fornecido. Foram preservados os sinais editoriais do testemunho: colchetes indicam texto restaurado ou lacunar, [. . .] marca lacunas, [] preserva uma lacuna sem conteúdo proposto, parênteses conservam esclarecimentos do testemunho e < > assinalam complementações editoriais. A sintaxe foi suavizada apenas onde isso não eliminava ambiguidades de agente, número ou referência.'
