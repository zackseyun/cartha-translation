translation:
  language: pt
  text: 'É apropriado, [a] em vista da oração que ele ofereceu e da conversão que dela resultou, que alguns perecessem, outros fossem beneficiados e ainda outros fossem separados. Primeiro, ele preparou o castigo dos desobedientes, valendo-se de um poder daquele que havia aparecido, de quem recebeu autoridade sobre todas as coisas, para que ficasse separado dele. Ele é aquele que está abaixo e permanece separado do Exaltado, até preparar exteriormente o plano de salvação para todas as coisas e dar a cada uma o lugar que lhe foi designado.


    A Palavra primeiramente se estabeleceu ao ordenar as Totalidades, como princípio fundamental, causa e governante das coisas que vieram a existir, assim como o Pai, causa do estabelecimento, foi o primeiro a existir depois dele.[b] Criou as imagens preexistentes, que produziu com ações de graças e glorificação.


    Depois, ordenou o lugar para aqueles que havia produzido em glória, o qual é chamado de “Paraíso”, “Delícia”, “Alegria Repleta de Alimento” e “Alegria dos Preexistentes”.[c] Esse lugar preserva a imagem de todas as coisas boas que habitam na Plenitude.


    Depois, ordenou o reino como uma cidade cheia de tudo o que é agradável, isto é, de amor fraternal e de generosidade abundante, repleta [d] de espíritos santos e dos poderes fortes que governam sobre eles, os quais a Palavra produziu e estabeleceu com poder.


    Em seguida, para ser ordenado, veio o lugar da Igreja que se reúne neste lugar, trazendo a forma da Igreja que habita nos éons, para a glorificação do Pai.[e]


    Depois dessas coisas, ordenou o lugar para a fé e a obediência provenientes da esperança. A Palavra as recebeu quando a luz apareceu.[f]


    Em seguida, ordenou o lugar da inclinação à oração e à súplica. A isso seguiram-se o perdão e a palavra a respeito daquele que haveria de aparecer.


    Todo lugar espiritual subsiste em um poder espiritual. Esses lugares diferem dos seres da memória, porque o poder deles está fundamentado em uma imagem, sendo aquilo que separa a Plenitude da Palavra. Em contraste, o poder — que atua na profecia a respeito do futuro — guia os seres da memória, que vieram a existir por causa daquilo que é preexistente.[g] Isso os impede de se misturarem com as coisas que alcançam a existência por meio de uma visão das coisas que permanecem com ele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há uma lacuna no manuscrito neste ponto.
    reason: Representa o sinal [] do testemunho e informa o leitor sobre perda textual.
  - marker: b
    text: A sintaxe do testemunho é difícil; não é claro a quem se refere “dele” nem como se deve entender com precisão a sequência entre o Pai e a Palavra.
    reason: Preserva uma ambiguidade cosmológica e pronominal relevante sem corrigi-la conjecturalmente.
  - marker: c
    text: O testemunho supre a preposição em “dos Preexistentes”; a redação do manuscrito é incerta nesse ponto.
    reason: Representa o sinal editorial <of> do testemunho em forma de nota portuguesa.
  - marker: d
    text: Há uma lacuna no manuscrito neste ponto.
    reason: Representa o segundo sinal [] do testemunho.
  - marker: e
    text: As palavras que ligam “em seguida” a “o lugar” são parcialmente supridas pelo tradutor no testemunho disponível.
    reason: Registra a sinalização parentética do testemunho sem sobrecarregar o texto principal.
  - marker: f
    text: “A Palavra” é uma identificação suprida no testemunho disponível; o texto conservado traz um sujeito implícito ou incerto.
    reason: Representa o sinal [The Word] e evita apresentar a identificação editorial como plenamente preservada.
  - marker: g
    text: A oração “que vieram a existir por causa daquilo que é preexistente” é uma restauração editorial no testemunho disponível.
    reason: Representa o trecho entre sinais angulares e distingue restauração de texto preservado.
lexical_decisions:
- source_word: Word
  choice: Palavra
  rationale: Mantém o termo personificado e sua capitalização, sem introduzir uma identificação teológica além do testemunho fornecido.
- source_word: Totalities
  choice: Totalidades
  rationale: Preserva o termo cosmológico técnico no plural e com inicial maiúscula.
- source_word: Fullness
  choice: Plenitude
  rationale: Equivalente português tradicional e inteligível para o conceito técnico, com capitalização preservada.
- source_word: adorned
  choice: ordenou
  rationale: No contexto cosmológico, comunica organizar e dispor harmoniosamente melhor que o sentido meramente decorativo de “adornar”.
- source_word: aeons
  choice: éons
  rationale: Transliteração corrente em português para o termo técnico, evitando reduzi-lo simplesmente a “eras”.
- source_word: beings of the memory
  choice: seres da memória
  rationale: Tradução formal que conserva a expressão incomum e sua possível função técnica, sem interpretá-la.
- source_word: subsists
  choice: subsiste
  rationale: Preserva a formulação ontológica do testemunho e o registro filosófico do tratado.
- source_word: conversion
  choice: conversão
  rationale: Mantém a amplitude do testemunho, que pode indicar mudança, retorno ou conversão, sem especificar uma leitura doutrinária.
theological_decisions:
- issue: Relação pronominal na frase sobre o Pai e aquele que existe depois
  choice: Preservar a formulação “o Pai... foi o primeiro a existir depois dele”
  alternative: Reorganizar a frase para identificar inequivocamente quem existe depois de quem
  rationale: O testemunho inglês é sintaticamente difícil e a revisão direta do copta está pendente; uma explicitação resolveria indevidamente a relação teológica.
- issue: Identidade daquele que está abaixo e daquele que apareceu
  choice: Manter as referências pronominais sem nomear as figuras
  alternative: Identificá-las como entidades cosmológicas específicas
  rationale: O trecho fornecido não torna as identidades inequívocas, e nomeá-las importaria interpretação externa.
- issue: Alcance do plano de salvação
  choice: “para todas as coisas”
  alternative: “para todos” ou “para toda a criação”
  rationale: Conserva o alcance impessoal e cosmológico de “all things”, sem convertê-lo em afirmação soteriológica mais definida.
- issue: Church
  choice: Igreja
  alternative: assembleia
  rationale: A capitalização indica um conceito técnico personificado ou transcendente; “Igreja” preserva essa função, sem acrescentar uma identidade confessional.
- issue: Espíritos santos
  choice: Usar minúsculas em “espíritos santos”
  alternative: “Espíritos Santos” ou “Espírito Santo”
  rationale: O testemunho traz plural e não exige identificação com uma pessoa divina singular.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com terminologia cosmológica técnica preservada. A tradução é provisória porque se baseia no testemunho inglês público fornecido e a revisão direta do copta ainda está pendente. Lacunas, suplementos e dificuldades sintáticas foram transferidos para marcadores e notas, mantendo todas as marcas [a]–[g] no texto principal.
