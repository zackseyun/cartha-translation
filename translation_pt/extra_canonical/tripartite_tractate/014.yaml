lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Mantém o termo técnico da cosmologia do tratado, em vez de reduzi-lo simplesmente a “eras” ou “seres”, e é inteligível em português com apoio do contexto.
- source_word: Totalities / Totality
  choice: Totalidades / Totalidade
  rationale: Preserva a distinção formal do testemunho e sua terminologia cosmológica, inclusive a alternância entre plural e singular.
- source_word: deficiency / deficient one
  choice: deficiência / o deficiente
  rationale: Conserva a repetição lexical e a personificação presentes no testemunho, sem identificar além da evidência quem é “o deficiente”.
- source_word: Fullness
  choice: Plenitude
  rationale: Emprega o equivalente técnico tradicional e semanticamente direto para a realidade cosmológica descrita.
- source_word: emanation
  choice: emanação
  rationale: Preserva o vocabulário processional do texto e evita paráfrases teologicamente interpretativas.
- source_word: Paraclete
  choice: Paráclito
  rationale: Mantém o título transliterado consagrado em português, sem restringi-lo aqui a uma identificação doutrinária externa ao tratado.
- source_word: Appointed Ones
  choice: Escolhidos
  rationale: Expressa de modo natural aqueles designados ou destinados, embora a nuance exata dependa de futura revisão do copta.
- source_word: radiance
  choice: resplendor
  rationale: Reproduz a imagem luminosa com registro digno e corrente.
theological_decisions:
- issue: A queda dos éons e a intenção do Pai
  choice: “apenas como se fosse uma experiência deles próprios, planejada pelo Pai”
  alternative: Interpretar a queda como plenamente própria dos éons ou eliminar a referência ao planejamento do Pai
  rationale: Mantém a tensão explícita no testemunho entre experiência aparente ou atribuída e propósito paterno, sem harmonização doutrinária.
- issue: Produção do Filho pela harmonia dos éons
  choice: Preservar “produziram o fruto” e identificar a manifestação como “seu Filho amado”
  alternative: Substituir “produziram” por “receberam” ou explicar a geração segundo uma cristologia posterior
  rationale: Conserva a linguagem peculiar do tratado e não a corrige com categorias teológicas externas.
- issue: Relação entre o Filho e as Totalidades
  choice: “revestiu-as de si mesmo” e “o Pai pôde colocar dentro dele as Totalidades”
  alternative: Parafrasear como mera representação simbólica
  rationale: Mantém as afirmações fortes de habitação, inclusão e participação sem definir sua metafísica.
- issue: Criação daquele em quem habitam o Pai e as Totalidades
  choice: Manter “<foi> criado” com sinal editorial
  alternative: Usar “gerado” ou omitir a afirmação para evitar tensão cristológica
  rationale: Segue o testemunho fornecido e preserva o suprimento editorial em sinais angulares, sem resolução confessional.
- issue: Pronome em “whom he desired that they know”
  choice: “o qual ele desejou que conhecessem”
  alternative: Explicitar se “ele” é o Pai ou o Filho
  rationale: A referência pronominal é potencialmente ambígua; a tradução evita decidir silenciosamente seu referente.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução adota equivalência ótima, mantendo termos cosmológicos técnicos, repetições conceituais e sinais editoriais: colchetes para restaurações ou notas de lacuna, reticências entre colchetes para perda textual e sinais angulares para suplementos editoriais. Como a revisão direta do copta ainda está pendente, decisões filológicas mais finas permanecem provisórias.'
