  naturalness: O português é predominantemente claro, solene e natural. As repetições e algumas construções densas refletem adequadamente o caráter técnico e especulativo do tratado.
  terminology: «Éons», «Totalidades», «Plenitude», «emanação» e «Paráclito» são escolhas adequadas. «Designados» traduz «Appointed Ones» com maior precisão e sem a carga teológica adicional de «Escolhidos».
