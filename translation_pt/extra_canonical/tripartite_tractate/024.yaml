  yaml_path: translation/extra_canonical/tripartite_tractate/024.yaml
  text: 'Out of an inclination toward mercy, our Savior became the same as those for whose sake he appeared had become through an instinctive passion—namely, flesh and soul, which constantly rule over them, so that they are destroyed and die. Yet those who [came into being] [] [as] invisible and invisibly, he taught about himself invisibly. He not only took on <himself> the death of those he intended to save, but also embraced the smallness into which they had fallen when they were <born> with body and soul, because he chose to be born as a child with body and soul. He shared in all the other conditions shared by those who had fallen, even though they possessed the light and he was exalted above them, because he chose to be conceived without sin, impurity, or corruption. He was begotten into physical life while dwelling in life, because it had been determined that both would equally become body and soul on account of the passion and shifting inclination from the Word, who had stirred himself
    in conversion.


    But according to the plan of salvation, it was he <who> took upon himself the results of the things we mentioned before—namely, what came into being from the illuminating vision and the firm thought of the Word after his self-conversion, after he stirred himself. This is how those who, like him, assumed body and soul, as well as establishment, stability, and wisdom. It had been determined beforehand that they would come together with the coming of the Savior, which had also been determined beforehand. Only when the Savior had made the decision did they also come. Thus they came, far surpassing in their fleshly emanation those who had been produced from the deficiency, [] because this was how they too underwent bodily emanation, as did the Savior, through the revelation of their union with him.


    These are those of a single substance, namely, the spiritual substance. The plan of salvation, however, is diverse: this is one thing, and that is another. Some emerge from passion and division and need healing. Others issue from the prayer that heals the sick and are appointed to treat the fallen. These are the apostles and the preachers of the message. They are the students of the Savior and the instructors of those who need teaching.


    Why, then, do they also share in the same passions as those who were produced from passion, if, according to the plan of salvation, they were produced in one body with <the> Savior, who did not share in such passions? The Savior was an image of a single entity, being the Totality in bodily form. Consequently, he preserved the pattern of inseparability, from which impassability comes. But they are images of each one who was revealed. This is why they embrace separation from their pattern, since they took on form for the planting that exists beneath heaven and that also [] shares in the evil prevailing in the places they have reached. For the will held the Totality captive under sin, so that by will he could show mercy to the Totality and they could be saved, since the one who is singular is chosen to give life, while all the rest need salvation.


    Because of this, he was the first among those to receive the grace of bestowing the gifts proclaimed by those whom he considered worthy of preaching to others. For <the> seed of the promise of Jesus Christ was put in place, whose revelation and union we have served. The promise made teaching possible, including the return to what they had been in the beginning. They possess a drop inclining them to return to it. This is what they call “redemption,” which is release from captivity and the attainment of freedom.


    The captivity is that of those who were enslaved to ignorance. In contrast, freedom is knowledge of the truth that existed before ignorance and prevails eternally, without beginning and without end. It is what is good, a cure for everything, and a release from the enslaving nature that caused suffering to those who had been produced in a lowly thought of emptiness—the nature of the evil inclination, [] through the thought that degrades them into lust for control. From the wealth of grace that looked upon the children, they received the treasure of freedom. Freedom casts down passion and destroys those things that it had earlier cast away from itself when the Word separated them from himself. He destined them for destruction until <the> the plan of salvation ends, and he allowed them to continue to exist because they too were useful for the things that had been predetermined.'
translation:
  language: pt
  text: 'Por sua inclinação à misericórdia, nosso Salvador tornou-se igual àquilo em que se haviam tornado, por uma paixão instintiva, aqueles por cuja causa ele apareceu — isto é, carne e alma, que constantemente os dominam, de modo que são destruídos e morrem. Contudo, àqueles que [vieram à existência] [...] [como] invisíveis e de modo invisível, ele ensinou invisivelmente a respeito de si mesmo.[a] Ele não somente tomou sobre si a morte daqueles que pretendia salvar, mas também assumiu a pequenez à qual eles haviam caído quando nasceram com corpo e alma, pois se dignou nascer como criança, com corpo e alma. Participou de todas as outras condições compartilhadas pelos que haviam caído, embora possuíssem a luz e ele estivesse exaltado acima deles, pois se dignou ser concebido sem pecado, impureza nem corrupção. Foi gerado para a vida física, embora habitasse na vida, porque havia sido determinado que ambos se tornassem igualmente corpo e alma por causa da paixão e da inclinação instável
    proveniente do Verbo, que se havia despertado em conversão.


    Mas, segundo o plano de salvação, foi ele quem tomou sobre si os resultados das coisas que mencionamos antes — isto é, aquilo que veio à existência a partir da visão iluminadora e do pensamento firme do Verbo, depois de sua conversão a si mesmo, depois de ter se despertado. Foi assim que aqueles que, como ele, assumiram corpo e alma também receberam fundamento, estabilidade e sabedoria.[b] Havia sido predeterminado que eles viessem juntamente com a vinda do Salvador, a qual também havia sido predeterminada. Somente quando o Salvador tomou a decisão é que eles também vieram. Assim, vieram, superando em muito, em sua emanação carnal, os que haviam sido produzidos a partir da deficiência [...] porque também eles passaram por uma emanação corpórea, como o Salvador, mediante a revelação de sua união com ele.


    Esses são os que pertencem a uma única substância, isto é, a espiritual. O plano de salvação, porém, é diverso: uma coisa é esta, outra é aquela. Alguns surgem da paixão e da divisão e precisam de cura. Outros procedem da oração que cura os enfermos e são designados para tratar os que caíram. Estes são os apóstolos e os proclamadores da mensagem. São discípulos do Salvador e instrutores dos que precisam de ensino.


    Por que, então, eles também participam das mesmas paixões que aqueles que foram produzidos a partir da paixão, se, segundo o plano de salvação, foram produzidos em um só corpo com o Salvador, que não participou dessas paixões? O Salvador era imagem de uma entidade única, sendo a Totalidade em forma corpórea. Por isso, preservou o modelo da inseparabilidade, do qual procede a impassibilidade.[c] Eles, porém, são imagens de cada um dos que foram revelados. É por isso que admitem a separação de seu modelo, visto que assumiram forma para a plantação que existe debaixo do céu e que também [...] participa do mal predominante nos lugares aos quais chegaram. Pois a vontade manteve a Totalidade cativa sob o pecado, para que, por vontade, ele pudesse conceder misericórdia à Totalidade e para que eles pudessem ser salvos, já que aquele que é único foi escolhido para dar vida, enquanto todos os demais precisam de salvação.[d]


    Por causa disso, ele foi o primeiro entre os que receberam a graça de conceder os dons proclamados por aqueles que considerou dignos de anunciar a outros. Pois a semente da promessa de Jesus Cristo foi estabelecida, e nós servimos à sua revelação e união. A promessa tornou possível o ensino, inclusive o retorno ao que eles eram no princípio. Eles possuem uma gota que os inclina a retornar àquilo. É isso que chamam de “redenção”: a libertação do cativeiro e a obtenção da liberdade.


    O cativeiro é o daqueles que foram escravizados pela ignorância. Em contraste, a liberdade é o conhecimento da verdade que existia antes da ignorância e permanece eternamente, sem princípio e sem fim. Ela é o bem, a cura para tudo e a libertação da natureza escravizadora que fez sofrer aqueles que haviam sido produzidos num pensamento inferior de vazio — a natureza da inclinação má [...] por meio do pensamento que os rebaixa à ânsia de domínio. Da riqueza da graça que contemplou os filhos, eles receberam o tesouro da liberdade. A liberdade derruba a paixão e destrói aquelas coisas que antes havia lançado para fora de si, quando o Verbo as separou de si mesmo.[e] Ele as destinou à destruição até que termine o plano de salvação e permitiu que continuassem a existir porque também eram úteis para as coisas que haviam sido predeterminadas.


    [a] Há lacunas no manuscrito nesta frase; a relação sintática entre “invisíveis” e “invisivelmente” permanece incerta.

    [b] A frase do testemunho disponível é sintaticamente incompleta; a tradução explicita apenas a ligação mínima necessária.

    [c] “Impassibilidade” significa aqui a condição de não estar sujeito às paixões; o termo técnico preserva o contraste do texto.

    [d] Os referentes de “a vontade”, “ele” e “eles” não são inteiramente claros no testemunho disponível.

    [e] O referente de “ela” pode ser a liberdade, mas a construção permanece difícil e possivelmente afetada pela transmissão do texto.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Há lacunas no manuscrito nesta frase; a relação sintática entre “invisíveis” e “invisivelmente” permanece incerta.
    reason: Sinalizar dano textual e evitar falsa segurança sintática.
  - marker: b
    text: A frase do testemunho disponível é sintaticamente incompleta; a tradução explicita apenas a ligação mínima necessária.
    reason: Informar que a fluência portuguesa depende de uma reconstrução mínima.
  - marker: c
    text: “Impassibilidade” significa aqui a condição de não estar sujeito às paixões; o termo técnico preserva o contraste do texto.
    reason: Tornar acessível um termo técnico sem apagar o vocabulário conceitual.
  - marker: d
    text: Os referentes de “a vontade”, “ele” e “eles” não são inteiramente claros no testemunho disponível.
    reason: Preservar a ambiguidade de agência e referência com implicações teológicas.
  - marker: e
    text: O referente de “ela” pode ser a liberdade, mas a construção permanece difícil e possivelmente afetada pela transmissão do texto.
    reason: Advertir sobre uma passagem textual e sintaticamente obscura.
lexical_decisions:
- source_word: plan of salvation
  choice: plano de salvação
  rationale: Expressão clara e corrente que preserva a dimensão ordenadora do conceito sem impor terminologia confessional mais específica.
- source_word: Word
  choice: Verbo
  rationale: Mantém o uso técnico do tratado para a entidade denominada Logos, com forma reconhecível em português teológico.
- source_word: Totality
  choice: Totalidade
  rationale: Preserva o termo cosmológico técnico e evita reduzi-lo a “todos”, que resolveria indevidamente sua referência.
- source_word: emanation
  choice: emanação
  rationale: Conserva o vocabulário cosmológico do texto, distinguindo-o de nascimento, criação ou geração.
- source_word: impassability
  choice: impassibilidade
  rationale: Preserva o contraste técnico com paixão, acompanhado de nota explicativa para leitores comuns.
- source_word: redemption
  choice: redenção
  rationale: Equivalente natural explicitamente definido pelo próprio trecho como libertação do cativeiro e obtenção da liberdade.
- source_word: planting
  choice: plantação
  rationale: Mantém a metáfora concreta e a possível função técnica do termo, sem substituí-la interpretativamente por “semente” ou “humanidade”.
theological_decisions:
- issue: Participação do Salvador na condição humana e ausência de pecado
  choice: Preservar simultaneamente sua participação nas condições dos caídos e sua concepção sem pecado, impureza nem corrupção.
  alternative: Harmonizar a passagem explicando de que maneira ele participou ou não participou dessas condições.
  rationale: O texto sustenta deliberadamente essa tensão e depois pergunta por que outros compartilham as paixões enquanto o Salvador não; a tradução não deve antecipar uma solução.
- issue: Identidade dos grupos descritos como de uma única substância
  choice: Manter a formulação “uma única substância, isto é, a espiritual”.
  alternative: Identificá-los diretamente com uma categoria doutrinária posterior ou com toda a humanidade.
  rationale: A passagem fornece sua própria categoria, mas não autoriza uma identificação denominacional ou sistemática mais precisa.
- issue: Agência em “a vontade manteve a Totalidade cativa”
  choice: Traduzir literalmente e registrar a incerteza dos referentes em nota.
  alternative: Atribuir explicitamente a ação a Deus, ao Salvador ou a uma vontade inferior.
  rationale: Os pronomes e a agência são ambíguos no testemunho de base; resolvê-los alteraria a teologia da frase.
- issue: Natureza da verdade e da liberdade
  choice: Conservar a afirmação de que a liberdade é o conhecimento da verdade eterna anterior à ignorância.
  alternative: Parafrasear como simples libertação intelectual ou salvação espiritual.
  rationale: A formulação ontológica e soteriológica do tratado deve permanecer intacta, inclusive sua tensão conceitual.
translation_notes:
  register: Português moderno, digno e legível, com preferência por períodos moderadamente segmentados. Termos cosmológicos técnicos — Verbo, Totalidade, emanação e impassibilidade — foram preservados quando a simplificação alteraria o sistema conceitual. Colchetes e reticências indicam lacunas do testemunho; suplementos editoriais seguros foram integrados com cautela. Trata-se de versão provisória baseada no testemunho inglês público fornecido, pois a revisão direta do copta ainda está pendente.
