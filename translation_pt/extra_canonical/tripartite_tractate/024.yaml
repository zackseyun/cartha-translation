    Por que, então, eles também participam das mesmas paixões que aqueles que foram produzidos a partir da paixão, se, segundo o plano de salvação, foram produzidos em um só corpo com o Salvador, que não participou dessas paixões? O Salvador era imagem de uma entidade única, sendo a Totalidade em forma corpórea. Por isso, preservou o modelo da inseparabilidade, do qual procede a impassibilidade.[c] Eles, porém, são imagens de cada um dos que foram revelados. É por isso que admitem a separação de seu modelo, visto que assumiram forma para a plantação que existe debaixo do céu e que também [...] participa do mal predominante nos lugares aos quais chegaram. Pois a vontade manteve a Totalidade cativa sob o pecado, para que, por vontade, ele pudesse conceder misericórdia à Totalidade e para que eles pudessem ser salvos, já que aquele que é único foi escolhido para dar vida, enquanto todos os demais precisam de salvação.[d]



    Por causa disso, ele foi o primeiro entre os que receberam a graça de conceder os dons anunciados por aqueles que considerou dignos de anunciar a outros. Pois a semente da promessa de Jesus Cristo foi estabelecida, e nós servimos à sua revelação e união. A promessa tornou possível o ensino, inclusive o retorno ao que eles eram no princípio. Eles possuem uma gota que os inclina a retornar àquilo. É isso que chamam de “redenção”: a libertação do cativeiro e a obtenção da liberdade.



    O cativeiro é o daqueles que foram escravizados pela ignorância. Em contraste, a liberdade é o conhecimento da verdade que existia antes da ignorância e permanece eternamente, sem princípio e sem fim. Ela é o bem, a cura para tudo e a libertação da natureza escravizadora que fez sofrer aqueles que haviam sido produzidos num pensamento inferior de vazio — a natureza da inclinação má [...] por meio do pensamento que os rebaixa à ânsia de domínio. Da riqueza da graça que se voltou para os filhos, eles receberam o tesouro da liberdade. A liberdade derruba a paixão e destrói aquelas coisas que antes havia rejeitado de si, quando o Verbo as separou de si mesmo.[e] Ele as destinou à destruição até que termine o plano de salvação e permitiu que continuassem a existir porque também eram úteis para as coisas que haviam sido predeterminadas.



