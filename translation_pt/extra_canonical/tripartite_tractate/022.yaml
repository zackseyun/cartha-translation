translation:
  language: pt
  text: 'Quando as duas ordens — [os] da direita e os da esquerda — se unem uma à outra pelo pensamento mediador que está entre elas e lhes dá seu plano comum de salvação, o resultado é que ambas agem com a mesma paixão: os da direita imitam os da esquerda, e os da esquerda imitam os da direita. Às vezes, quando a ordem má, por insensatez, começa a praticar o mal, a ordem <sábia> os imita, sob a forma de um ser masculino, praticando também o mal, como se ela igualmente fosse um poder do mal. Em outras ocasiões, quando a ordem sábia começa a realizar boas obras, a ordem <insensata> também procura fazer o bem, imitando-a.


    Assim, as coisas são estabelecidas por esses tipos de atos [], vindo a existir de tal modo que o semelhante e o dessemelhante se parecem um com o outro. Portanto, os que não receberam instrução não conseguem conhecer a causa das coisas existentes. Por isso, propuseram diversos tipos de explicação. Alguns dizem que as coisas existentes recebem seu ser da providência. São os que veem ordem e padrão nos movimentos da criação. Outros dizem que a existência procede de algo estranho. São os que veem a <diversidade> e o mal decorrente da transgressão dos poderes. Outros dizem que as coisas existentes acontecem por causa do destino. São os que se ocuparam dessa questão. Outros dizem que é uma questão de natureza. Outros, que é uma questão de acaso. A maioria, porém, dentre todos os que só chegaram até os elementos visíveis, nada conhece além deles.


    Os sábios gregos e os bárbaros chegaram apenas até os poderes que vieram a existir por meio da imaginação e do pensamento vazio, <e também> até os que deles procederam mediante o conflito e a conduta rebelde que atua entre eles. Por isso, quando falaram a respeito das coisas que consideravam sabedoria, foram enganados por um <simulacro>. Acreditaram ter alcançado a verdade, [], mas haviam chegado ao erro. Esse erro não dizia respeito apenas a designações de menor importância; os próprios poderes os impediram, convencendo-os de que haviam <compreendido> a Totalidade.[a]


    Consequentemente, a ordem passou a lutar contra si mesma por causa da inimizade orgulhosa de [um descendente] do arconte que é [superior] e que existia antes dele. Por isso, houve entre todos completa discordância a respeito de tudo: da filosofia, dos tipos de medicina, das categorias da retórica, dos tipos de música e das ordens da lógica; tudo não passava de opiniões e teorias. Assim, prevaleceu a <verbosidade>, e <eles> ficaram confusos por não serem capazes de explicar <aqueles> que possuem poder e lhes deram suas teorias.


    Quanto às coisas que surgiram entre a <nação> dos hebreus — os escritos dos seres materiais, <cujo> exemplo os gregos imitam —, tudo o que eles conceberam para expressá-las, os poderes da direita <…>, que inspiraram todos eles a raciocinar <com> palavras e uma representação de si mesmos. Assim começaram sua jornada para alcançar a verdade, valendo-se da variedade mista de poderes que atuava neles.[b]


    Depois disso, chegaram à ordem dos poderes sem mistura, <antes de> alcançarem aquele que foi estabelecido segundo a semelhança do Pai. Ele não é invisível [] <por causa de sua> natureza, mas porque uma sabedoria o oculta, a fim de preservar a forma daquele que é verdadeiramente invisível. Por isso, muitos anjos não conseguiram contemplá-lo. As pessoas da nação hebraica que mencionamos anteriormente — isto é, os justos e os profetas — não pensaram nem disseram coisa alguma a partir da imaginação, de uma imagem ilusória ou de um pensamento obscuro. Em vez disso, cada um, pelo poder que atuava nele e prestando atenção ao que via e ouvia, falou com exatidão, em harmonia uns com os outros e em concordância, assim como os poderes que atuavam neles, pois preservavam sua <unidade> e harmonia mútua. Isso ocorria sobretudo porque louvavam aquele que era mais elevado do que eles e aquele que era maior do que eles, que existia e fora designado porque necessitavam dele.


    Isso o Verbo espiritual produziu entre eles, como em alguém que necessita do Exaltado: com esperança e expectativa, segundo o pensamento que é a semente da salvação, e com uma palavra iluminadora que é a memória, junto com sua descendência e suas emanações, que são os justos e os profetas já mencionados. Eles preservam o louvor de seus pais e o testemunho deles acerca do que é grandioso. Estes vieram a existir [] com expectativa esperançosa e atenção; neles foi semeada <a> semente da oração e da busca, a qual é semeada nos muitos que procuraram ser fortalecidos. Ela se manifesta e os move a amar o Exaltado e a proclamar que essas coisas pertencem ao Único.[c]


    Algo singular atuava neles quando falavam. Contudo, sua visão e suas palavras eram diversas, por causa da diversidade daqueles que lhes comunicavam as visões e as palavras. Portanto, os que deram atenção ao que eles disseram não rejeitam parte alguma, mas acolheram as Escrituras com diversas interpretações. Isso levou ao surgimento de diferentes grupos que existem até hoje entre os judeus. Alguns dizem que Deus é um só, aquele que falou nas antigas Escrituras. Outros dizem que ele é múltiplo; alguns, porém, dizem que Deus é simples e, por natureza, uma única mente. Outros dizem que seus atos estão relacionados às origens do bem e do mal. Outros ainda dizem que ele mesmo é o criador do que veio a existir, enquanto outros dizem que [] ele criou por meio dos anjos. A diversidade de ideias desse tipo reflete a diversidade de formas e a riqueza dos tipos de Escritura, que produziram seus mestre<s> da Lei.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Totalidade” parece ser um termo cosmológico técnico. A tradução conserva a inicial maiúscula, mas seu alcance exato deverá ser verificado no texto copta.
    reason: Evitar que o leitor entenda automaticamente o termo apenas como 'todas as coisas' em sentido comum.
  - marker: b
    text: A sintaxe deste período é fragmentária e difícil de reconstruir. Os sinais < > e <…> preservam restaurações e uma lacuna do testemunho utilizado.
    reason: A tradução depende de um testemunho inglês provisório em um trecho textual e sintaticamente instável.
  - marker: c
    text: Os referentes de “sua descendência”, “suas emanações” e “Estes” são incertos na forma transmitida; a tradução não os identifica de modo definitivo.
    reason: Preservar a ambiguidade referencial e evitar uma interpretação teológica não demonstrada.
  - marker: d
    text: Os colchetes indicam lacunas; os sinais angulares indicam palavras restauradas ou propostas no testemunho de base. A forma “mestre<s>” reproduz uma restauração textual incerta.
    reason: Informar o leitor sobre os sinais críticos mantidos no corpo do texto.
lexical_decisions:
- source_word: orders
  choice: ordens
  rationale: Preserva o termo cosmológico e coletivo do testemunho sem reduzi-lo a grupos meramente humanos.
- source_word: passion
  choice: paixão
  rationale: Mantém a amplitude de um impulso ou afecção compartilhada, sem resolver a nuance como desejo, emoção ou sofrimento.
- source_word: powers
  choice: poderes
  rationale: Conserva a provável referência a entidades ou forças cosmológicas, evitando substituí-la por 'autoridades'.
- source_word: simulacrum
  choice: simulacro
  rationale: Reproduz a ideia de uma aparência ou cópia enganosa e preserva o vocabulário filosófico do trecho.
- source_word: Totality
  choice: Totalidade
  rationale: A inicial maiúscula sinaliza o provável emprego técnico cosmológico, sem explicar além do testemunho disponível.
- source_word: archon
  choice: arconte
  rationale: Usa a transliteração já corrente em estudos de textos gnósticos, em vez de impor 'governante' ou 'príncipe'.
- source_word: spiritual Word
  choice: Verbo espiritual
  rationale: Mantém tanto o valor pessoal/técnico de 'Word' quanto a ressonância religiosa, sem identificar explicitamente a figura com uma doutrina posterior.
- source_word: the Exalted One
  choice: o Exaltado
  rationale: Preserva o título substantivado e sua distinção em relação a outras figuras do discurso.
- source_word: One and Only
  choice: o Único
  rationale: Expressa a singularidade enfática de modo natural em português, sem acrescentar uma fórmula confessional.
- source_word: teachers of the Law
  choice: mestres da Lei
  rationale: É uma formulação natural e digna que mantém a referência à instrução jurídica ou escriturística.
theological_decisions:
- issue: Relação entre as ordens da direita e da esquerda
  choice: Manter a imitação recíproca e a atribuição paradoxal de mal à ordem sábia
  alternative: Harmonizar a passagem para que apenas a ordem má pratique o mal
  rationale: O testemunho sustenta deliberadamente uma tensão cosmológica; a tradução não deve corrigi-la teologicamente.
- issue: Identidade daquele que é ocultado pela sabedoria
  choice: Preservar os pronomes e a sequência referencial sem identificar a figura
  alternative: Nomeá-lo como Deus, Cristo, Demiurgo ou Pai
  rationale: A sintaxe e o sistema de figuras permanecem incertos sem revisão direta do copta.
- issue: Natureza do Verbo espiritual
  choice: Traduzir como 'Verbo espiritual' sem identificação dogmática explícita
  alternative: Identificá-lo diretamente com Jesus Cristo ou tratá-lo como simples discurso
  rationale: O termo pode ter função hipostática, mas o trecho fornecido não autoriza resolver plenamente sua identidade.
- issue: Afirmações judaicas sobre a unidade ou multiplicidade de Deus
  choice: Reproduzir todas as opiniões como discurso relatado
  alternative: Corrigir ou privilegiar uma delas como posição normativa
  rationale: A seção descreve diversidade interpretativa; a tradução deve preservar essa polifonia e não endossar uma opinião.
- issue: Criação direta ou por meio de anjos
  choice: Manter as duas opiniões em paralelo
  alternative: Harmonizá-las numa única doutrina de criação
  rationale: A oposição é parte do argumento do autor sobre interpretações diversas das Escrituras.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se colchetes, sinais angulares, parênteses implícitos quando necessários e a elipse como indicadores de lacunas ou restaurações. Como não foi fornecida uma transcrição copta para confronto direto, esta é uma versão provisória baseada no testemunho inglês de domínio público; requer revisão posterior contra o manuscrito copta do Códice de Nag Hammadi I,5.
