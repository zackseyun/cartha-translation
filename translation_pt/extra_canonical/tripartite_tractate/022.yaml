  revised_text: 'Quando as duas ordens — [os] da direita e os da esquerda — se unem uma à outra pelo pensamento mediador que está entre elas e lhes dá seu plano comum de salvação, o resultado é que ambas agem com a mesma paixão: os da direita imitam os da esquerda, e os da esquerda imitam os da direita. Às vezes, quando a ordem má, por insensatez, começa a praticar o mal, a ordem <sábia> a imita, sob a forma de um ser masculino, praticando também o mal, como se ela igualmente fosse um poder do mal. Em outras ocasiões, quando a ordem sábia começa a realizar boas obras, a ordem <insensata> também procura fazer o bem, imitando-a.



    Assim, as coisas são estabelecidas por esses tipos de atos [], vindo a existir de tal modo que o semelhante e o dessemelhante se assemelham um ao outro. Portanto, os que não receberam instrução não conseguem conhecer a causa das coisas existentes. Por isso, propuseram diversos tipos de explicação. Alguns dizem que as coisas existentes recebem seu ser da providência. São os que veem ordem e padrão nos movimentos da criação. Outros dizem que a existência procede de algo estranho. São os que veem a <diversidade> e o mal da ilegalidade dos poderes. Outros dizem que as coisas existentes acontecem por causa do destino. São os que se ocuparam dessa questão. Outros dizem que é uma questão de natureza. Outros, que é uma questão de acaso. A maioria, porém, dentre todos os que só chegaram até os elementos visíveis, nada conhece além deles.



    Os sábios gregos e os bárbaros chegaram apenas até os poderes que vieram a existir por meio da imaginação e do pensamento vazio, <e também> até os que deles procederam mediante o conflito e a conduta rebelde que atua entre eles. Por isso, quando falaram a respeito das coisas que consideravam sabedoria, foram enganados por um <simulacro>. Acreditaram ter alcançado a verdade, [], mas haviam chegado ao erro. Esse erro não dizia respeito apenas a designações de menor importância; os próprios poderes os impediram, convencendo-os de que haviam <compreendido> a Totalidade.[a]



    Consequentemente, a ordem passou a lutar contra si mesma por causa da inimizade orgulhosa de [um descendente] do arconte que é [superior] e que existia antes dele. Por isso, houve entre todos completa discordância a respeito de tudo: da filosofia, dos tipos de medicina, das categorias da retórica, dos tipos de música e das ordens da lógica; tudo não passava de opiniões e teorias. Assim, prevaleceu a <verbosidade>, e <eles> ficaram confusos por não serem capazes de explicar <aqueles> que possuem poder e lhes deram suas teorias.



    Quanto às coisas que surgiram entre a <nação> dos hebreus — os escritos dos seres materiais, <cujo> exemplo os gregos imitam —, tudo o que conceberam para expressá-las: os poderes da direita <…>, que inspiraram todos eles a raciocinar <com> palavras e uma representação de si mesmos. Assim começaram sua jornada para alcançar a verdade, valendo-se da variedade mista de poderes que atuava neles.[b]



    Depois disso, chegaram à ordem dos poderes sem mistura, <antes de> alcançarem aquele que foi estabelecido segundo a semelhança do Pai. Ele não é invisível [] <por causa de sua> natureza, mas porque uma sabedoria o oculta, a fim de preservar a forma do que é verdadeiramente invisível. Por isso, muitos anjos não conseguiram contemplá-lo. As pessoas da nação hebraica que mencionamos anteriormente — isto é, os justos e os profetas — não pensaram nem disseram coisa alguma a partir da imaginação, de uma imagem ilusória ou de um pensamento obscuro. Em vez disso, cada um, pelo poder que atuava nele e prestando atenção ao que via e ouvia, falou com exatidão, em harmonia uns com os outros e em concordância, assim como os poderes que atuavam neles, pois preservavam sua <unidade> e harmonia mútua. Isso ocorria sobretudo porque louvavam aquele que era mais elevado do que eles e aquele que era maior do que eles, que existia e fora designado porque necessitavam dele.



    Isso o Verbo espiritual produziu entre eles, como em alguém que necessita do Exaltado: com esperança e expectativa, segundo o pensamento que é a semente da salvação, e com uma palavra iluminadora que é a memória, junto com sua descendência e suas emanações, que são os justos e os profetas já mencionados. Eles preservam o louvor de seus pais e o testemunho deles acerca do que é grandioso. Estes vieram a existir [] com expectativa esperançosa e atenção; neles foi semeada <a> semente da oração e da busca, a qual é semeada nos muitos que procuraram ser fortalecidos. Ela se manifesta e os move a amar o Exaltado e a proclamar que essas coisas pertencem ao Único.[c]



    Algo singular atuava neles quando falavam. Contudo, sua visão e suas palavras eram diversas, por causa da diversidade daqueles que lhes comunicavam as visões e as palavras. Portanto, os que deram atenção ao que eles disseram não rejeitam nada disso, mas aceitaram as Escrituras com diversas interpretações. Isso levou ao surgimento de diferentes grupos que existem até hoje entre os judeus. Alguns dizem que Deus é um só, aquele que falou nas antigas Escrituras. Outros dizem que ele é múltiplo; alguns, porém, dizem que Deus é simples e, por natureza, uma única mente. Outros dizem que seus atos estão relacionados às origens do bem e do mal. Outros ainda dizem que ele mesmo é o criador do que veio a existir, enquanto outros dizem que [] ele criou por meio dos anjos. A diversidade de ideias desse tipo reflete a diversidade de formas e a riqueza dos tipos de Escritura, que produziram seus mestre<s> da Lei.[d]'
