    rationale: A redação “nenhum deles deixa de ter domínio sobre aqueles que lhe foram confiados” introduz tanto “domínio” em lugar de “realeza” quanto “aqueles que lhe foram confiados”, elemento ausente do testemunho. A extensão cósmica também foi reformulada além do que a sintaxe incerta permite. Convém conservar a obscuridade e registrá-la em nota.
