  naturalness: O português é em geral claro, contemporâneo e apropriado ao registro do tratado. Os termos técnicos foram usados de maneira consistente. A revisão restitui, no período final, uma redação mais próxima do testemunho, sem pretender resolver uma ambiguidade textual.
  terminology: “Plenitude”, “Palavra”, “Psíquicos”, “éon”, “arcontes”, “semelhança” e “plano da salvação” são escolhas adequadas e coerentes. “Desejo de dominar” transmite bem lust for control sem introduzir a conotação sexual predominante de “luxúria”.
