base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: pt
  text: 'Os seres da memória que estão do lado de fora são humildes e preservam a representação da Plenitude, sobretudo porque participam mutuamente dos nomes que os adornam. A conversão resulta em humildade para com os seres da memória; e a humildade para com eles também é a lei do julgamento, que consiste em condenação e ira.


    A humildade para com eles é também o poder que separa os que caem abaixo deles e os envia para longe. Esse poder os impede [] [de] se espalharem sobre os seres da memória e sobre a conversão. Ele compreende o medo, a confusão, o esquecimento, a perplexidade, a ignorância e as coisas que vieram a existir por meio da imaginação, assim como acontece com uma semelhança. Além disso, nomes elevados são conferidos a essas coisas que, na realidade, eram inferiores. O conhecimento <falta àqueles> que foram produzidos a partir delas por meio do orgulho, do desejo de dominar, da desobediência e da falsidade.


    A cada <um> deles ele conferiu um nome, pois as duas ordens subsistem em um nome. Os que pertencem à memória e à representação são chamados “Os da Direita”, “Psíquicos”[a], “Os Ígneos” e “Os do Meio”. Os que pertencem ao pensamento orgulhoso e à semelhança são chamados “Os da Esquerda”, “Materiais”, “Os Sombrios” e “Os Últimos”.


    Depois que a Palavra estabeleceu cada qual em sua ordem — isto é, as imagens, as representações e as semelhanças —, preservou puro o éon[b] das imagens contra todos os que lutam contra ele, pois é um lugar de alegria. Aos seres da memória, porém, revelou o pensamento do qual se havia despojado. Desejava conduzi-los a uma união material e lhes dar uma ordem organizada e uma morada, para que também produzissem o desejo de enfraquecer, para si mesmos, a atração do mal. Assim, poderiam deixar de se deleitar excessivamente com a glória do que os rodeava e, desse modo, de permanecer no exílio; em vez disso, reconheceriam a enfermidade de que sofriam. [] Dessa maneira, poderiam gerar amor e uma busca incessante por aquele que pode curá-los dessa fraqueza. Para fazê-los assumir uma forma, ele colocou a palavra da beleza sobre os que pertencem à semelhança e também colocou sobre eles a lei do julgamento. Além disso, colocou sobre eles os poderes que as raízes haviam produzido [em] seu desejo
    de dominar. A Palavra se agradou deles porque são úteis no plano da salvação e, por isso, [escolheu] esses poderes para governá-los. Assim, com a ajuda da bela palavra, pela ameaça da [lei] ou pela influência do desejo de dominar, a ordem poderia ser protegida daqueles que a rebaixariam ao mal.


    A Palavra conhece o desejo de dominar que as duas ordens têm em comum. A elas e a todos os demais, concedeu bondosamente o que desejavam, dando a cada um a posição de comando apropriada. Assim, cada um governaria um lugar e uma atividade, submetendo-se aos de ordem superior, comandando a atividade dos lugares inferiores e exercendo domínio de acordo com seu modo de ser. Como resultado, entre os anjos [] e os arcanjos há dirigentes e subordinados em posições de governo e submissão, enquanto as atividades são diversas e de diferentes tipos.


    Cada um dos arcontes[c], com sua raça e seus privilégios, desfruta daquilo a que sua parte designada lhe dá direito. De acordo com a maneira como surgiram, cada um permaneceu em seu posto, encarregado do plano da salvação. E nenhum deles deixa de ter domínio sobre aqueles que lhe foram confiados, desde uma extremidade dos céus até a outra, desde uma extremidade da [terra] até a outra, em todas as regiões da [terra] e entre os que estão debaixo da terra.[d] Há reis e senhores, bem como os que recebem ordens: alguns supervisionam o castigo; outros, a justiça; outros ainda concedem descanso e cura; outros dão instrução; e outros mantêm vigilância.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Psíquicos” significa aqui seres ligados à alma; trata-se de uma designação técnica, não do sentido moderno de poderes paranormais.
    reason: Evitar uma leitura anacrônica de um termo técnico.
  - marker: b
    text: “Éon” pode designar uma era, uma ordem ou um domínio de existência. Aqui o contexto favorece a ideia de um domínio ou ordem.
    reason: Esclarecer um termo cosmológico técnico sem eliminar sua amplitude.
  - marker: c
    text: “Arcontes” significa “governantes” ou “potestades”; no tratado, o termo designa poderes que exercem autoridade em regiões e atividades determinadas.
    reason: Tornar compreensível uma transliteração técnica necessária.
  - marker: d
    text: A sintaxe desta frase no testemunho usado para a tradução é incerta. A redação portuguesa entende que cada governante exerce domínio na esfera que lhe foi atribuída, por toda a extensão dos céus, da terra e das regiões subterrâneas.
    reason: Sinalizar uma decisão interpretativa em passagem textualmente ou sintaticamente difícil.
lexical_decisions:
- source_word: Fullness
  choice: Plenitude
  rationale: Termo técnico consagrado para a totalidade transcendente no vocabulário do tratado, preservado com inicial maiúscula.
- source_word: Soulish
  choice: Psíquicos
  rationale: Preserva a categoria antropológica/técnica do contexto antigo; “da alma” seria mais transparente, mas reduziria seu caráter classificatório.
- source_word: aeon
  choice: éon
  rationale: Transliteração corrente que preserva a amplitude técnica do termo, aqui aparentemente um domínio ou ordem supramundana.
- source_word: Word
  choice: Palavra
  rationale: Mantém a personificação e a possível dimensão hipostática sem identificar silenciosamente a figura com uma formulação denominacional específica.
- source_word: archons
  choice: arcontes
  rationale: Transliteração técnica adequada para potestades governantes; “governantes” perderia parte da terminologia própria do tratado.
- source_word: lust for control
  choice: desejo de dominar
  rationale: Expressa naturalmente a ânsia por poder e controle, evitando a conotação principalmente sexual de “luxúria” em português moderno.
- source_word: likeness
  choice: semelhança
  rationale: Distingue esta categoria de “imagem” e “representação”, preservando a tríade conceitual do texto.
- source_word: plan of salvation
  choice: plano da salvação
  rationale: Tradução direta e inteligível que não especifica além do testemunho como esse plano opera.
theological_decisions:
- issue: Identidade da “Palavra”
  choice: Manter “a Palavra” como título personificado
  alternative: Traduzir ou interpretar explicitamente como “o Logos” ou identificar com Cristo
  rationale: O trecho atribui agência pessoal à figura, mas a identificação completa não deve ser imposta sem revisão direta do copta e do contexto integral.
- issue: Sentido de “humility toward them”
  choice: Traduzir literalmente como “humildade para com eles”
  alternative: Interpretar como “humilhação diante deles” ou “subordinação a eles”
  rationale: O testemunho inglês é semanticamente difícil; a formulação conserva a tensão e evita decidir se se trata de virtude, rebaixamento ou sujeição.
- issue: Estrutura das duas ordens
  choice: Preservar todas as designações paralelas sem harmonizá-las
  alternative: Explicar os grupos como espirituais, psíquicos e materiais segundo um esquema doutrinário posterior
  rationale: O próprio trecho oferece categorias sobrepostas e não autoriza uma sistematização denominacional ou escolar adicional.
- issue: Reinado no período final
  choice: Explicitar com cautela o domínio sobre os que lhes foram confiados e reproduzir a fórmula “de uma extremidade... até a outra”
  alternative: Manter a sintaxe obscura “nenhum carece de realeza sobre eles, do fim...”
  rationale: A sintaxe do testemunho é difícil e possivelmente corrompida; a redação busca legibilidade, enquanto a nota registra a incerteza.
- issue: Marcas de lacuna e restauração
  choice: Conservar colchetes e sinais angulares no corpo
  alternative: Suprimir as marcas ou completar conjecturalmente as lacunas
  rationale: Esses sinais comunicam dano e restauração editorial no testemunho e são essenciais para não apresentar conjecturas como texto seguro.
translation_notes:
  register: Português contemporâneo, digno e de ampla legibilidade, com preferência por estruturas naturais no Brasil sem regionalismos fortes. Mantiveram-se os termos técnicos indispensáveis (“Plenitude”, “éon”, “Psíquicos”, “arcontes”), acompanhados de notas. Os sinais [], [palavra] e <palavra> reproduzem, respectivamente, lacunas, restaurações e complementações editoriais do testemunho. Rascunho necessariamente provisório, pois foi elaborado a partir do testemunho inglês público fornecido; a revisão direta do copta do Códice de Nag Hammadi I,5 continua necessária.
