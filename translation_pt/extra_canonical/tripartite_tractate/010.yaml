base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/010.yaml
  text: 'The emanation of the Totalities, who exist from the existent one, did not happen through separation from one another, like [something] discarded by the one who gives birth to them. Instead, their begetting is like an act of extension, as the Father extends himself to those he loves, so that [those] who originated from him might also become him. Although the present age is a unity, it is divided into units of time, which are divided into years, which in turn are divided into seasons, then seasons into months, months into days, days into hours, and hours into minutes. In the same way, [] the age of truth, because it is one and many, is honored with names both insignificant and important, according to what each one can grasp. By analogy, it is like a spring that, while remaining what it is, nevertheless flows and expands into streams, lakes, canals, and branches. Or it is like a root spreading beneath trees and branching out with their fruit, or like a human body, inseparably divided
    into various branching limbs—primary and secondary, great and small.


    The aeons brought themselves forth in agreement with the third fruit, by free will and through the understanding he gave them for thought. They do not desire to give glory [together with] what the separate Fullnesses brought forth in unison as words of [praise]. Nor do they desire to give glory together with the entire Totality, or to glorify together with any individual aeon who has reached a place or state higher than his own, unless he obtains <what> was desired from the one with a more exalted name and a higher place. [] They receive one another at the higher place, and the one who wished to rise higher begets himself, so to speak, begetting himself together with the other one and with what he is. He is renewed together with the one who came to him from his brother, beholding him and entreating him concerning the matter.


    So that this may happen in this way, the one who desired to give glory says nothing to him about it except this, because a limit on speech has been established in the Fullness. Thus they remain silent about the incomprehensibility of the Father, while still being permitted to speak about their desire to grasp him.'
translation:
  language: pt
  text: 'A emanação das Totalidades, que existem a partir daquele que existe, não aconteceu por se separarem umas das outras, como [algo] descartado por aquele que as gera. Pelo contrário, sua geração se assemelha a um ato de extensão, assim como o Pai se estende àqueles que ama, para que [aqueles] que dele se originaram também pudessem tornar-se ele. Embora seja uma unidade, a era presente é dividida em unidades de tempo, que, por sua vez, são divididas em anos; estes, em estações; as estações, em meses; os meses, em dias; os dias, em horas; e as horas, em minutos. Do mesmo modo, [a] a era da verdade, por ser una e múltipla, é honrada com nomes insignificantes e importantes, conforme cada um é capaz de compreendê-la. Usando uma analogia, ela é como uma fonte que, embora continue sendo o que é, ainda assim flui e se expande em riachos, lagos, canais e ramificações. Ou é como uma raiz que se estende debaixo de árvores e se ramifica com seus frutos; ou como um corpo humano, dividido de maneira
    inseparável em vários membros ramificados — primários e secundários, grandes e pequenos.


    Os éons produziram a si mesmos em conformidade com o terceiro fruto, por livre vontade e mediante o entendimento que ele lhes deu para pensar. Eles não desejam dar glória [juntamente com] aquilo que as Plenitudes distintas produziram em uníssono como palavras de [louvor]. Também não desejam dar glória juntamente com a Totalidade inteira, nem glorificar juntamente com qualquer éon individual que tenha alcançado um lugar ou estado superior ao seu, a menos que ele obtenha <aquilo> que foi desejado daquele que possui um nome mais elevado e um lugar superior. [b] Eles recebem uns aos outros no lugar superior, e aquele que desejou subir mais alto gera a si mesmo, por assim dizer, gerando a si mesmo juntamente com o outro e com aquilo que ele é. Ele é renovado juntamente com aquele que veio até ele da parte de seu irmão, contemplando-o e suplicando-lhe a respeito da questão.


    Para que isso aconteça dessa maneira, aquele que desejou dar glória nada lhe diz a esse respeito, exceto isto, pois na Plenitude foi estabelecido um limite para a fala. Assim, eles permanecem em silêncio a respeito da impossibilidade de compreender o Pai, embora lhes seja permitido falar de seu desejo de compreendê-lo.'
  philosophy: optimal-equivalence
