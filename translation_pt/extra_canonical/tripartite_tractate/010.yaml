lexical_decisions:
- source_word: Totalities
  choice: Totalidades
  rationale: Preserva o termo técnico coletivo da cosmologia do tratado e sua distinção de “Plenitude”.
- source_word: existent one
  choice: aquele que existe
  rationale: Mantém o sentido ontológico sem impor o título bíblico técnico “O Existente”.
- source_word: emanation
  choice: emanação
  rationale: Termo técnico já estabelecido em português para a processão descrita, sem substituir a imagem pela linguagem mais denominacional de criação.
- source_word: age
  choice: era
  rationale: Expressa a unidade temporal da analogia; evita confundi-la automaticamente com o termo técnico “éon”, usado adiante para seres ou entidades.
- source_word: aeons
  choice: éons
  rationale: Transliteração corrente do termo técnico na literatura gnóstica, preservando sua especificidade conceitual.
- source_word: Fullness / Fullnesses
  choice: Plenitude / Plenitudes
  rationale: Mantém o vocabulário técnico e a variação singular/plural do testemunho.
- source_word: grasp
  choice: compreender
  rationale: Comunica tanto apreensão intelectual quanto incapacidade de abarcar; na primeira ocorrência, o pronome explicita o referente feminino “era”.
- source_word: beholding
  choice: contemplando
  rationale: Preserva o caráter elevado e intelectual/visionário do ato, sem reduzi-lo a mero olhar.
theological_decisions:
- issue: Relação entre o Pai e os que dele se originam
  choice: “também pudessem tornar-se ele”
  alternative: “também pudessem tornar-se como ele”
  rationale: O testemunho diz “become him”; acrescentar “como” resolveria a tensão ontológica e enfraqueceria a formulação.
- issue: Autogeração dos éons
  choice: “produziram a si mesmos” e “gera a si mesmo”
  alternative: “foram produzidos” ou “passa a existir”
  rationale: Preserva a linguagem paradoxal de agência reflexiva do texto, sem harmonizá-la com uma doutrina externa de criação.
- issue: Incompreensibilidade do Pai
  choice: “impossibilidade de compreender o Pai”
  alternative: “mistério do Pai”
  rationale: Traduz o conteúdo epistemológico explícito sem convertê-lo em uma formulação teológica mais ampla.
- issue: Identidade do referente masculino na seção dos éons
  choice: manutenção de “ele”, “aquele” e “o outro”
  alternative: identificação explícita de cada referente
  rationale: O testemunho é referencialmente ambíguo; a tradução não atribui identidades que o texto fornecido não estabelece.
translation_notes:
  register: 'Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantiveram-se os termos técnicos “emanação”, “éons”, “Totalidade” e “Plenitude”. Os sinais editoriais do testemunho foram preservados: colchetes internos indicam palavras supridas ou incertas, os marcadores [a] e [b] representam lacunas originalmente assinaladas por colchetes vazios, e os sinais angulares em <aquilo> registram uma restauração editorial. Como a revisão direta do copta ainda está pendente, o texto permanece uma tradução provisória fundamentada no testemunho inglês público fornecido.'
