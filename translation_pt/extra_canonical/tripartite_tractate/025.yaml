base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/025.yaml
  text: 'Humans came to be divided into three natural categories: the spiritual, the soulish, and the material. These correspond to the Word’s threefold inclination, from which the material, the soulish, and the spiritual were produced. Each of the three natural categories is known by its fruit. They were not known at first, however, but only when the Savior came, shone upon the saints, and revealed which category each one belonged to.


    The spiritual category is like light from light and spirit from spirit. When its head appeared, it immediately hurried toward its proper category. Suddenly it grew a body for its head and immediately received knowledge through the revelation.


    The soulish category, by contrast, is like light from fire. It was hesitant to recognize [] the one who appeared to it and even more hesitant to hurry toward him through faith. Instead, although a voice instructed it, <it> was satisfied, because it was not far from the hope of the promise. It received, as it were, assurance of the things to come in the form of a pledge.


    The material category, by contrast, is alien in every way, because it resembles darkness and rejects the light that shines, since its manifestation extinguishes it. Because it did not welcome his <coming>, it is <immoderate> and full of spite toward the revelation of the Lord.


    The spiritual category will receive complete salvation in every respect. The material category will be destroyed in every respect, as happens to an adversary. Because of its middle position, both in the way it was produced and in its nature, the soulish category is duality, corresponding to its inclination toward both good and evil. What has been determined for it is ambiguous <…> and its complete escape <from> what is good.


    Those whom the Word produced according to the preexistent pattern in his thought, when he remembered the Exalted One and prayed for salvation, received salvation immediately. [Because] of the saving thought, they were saved completely by what it produced. The same applies to [the ones] whom these produced in their turn, [] whether angels or humans. Because they acknowledge that one exists who is more exalted than they are, and because they pray and seek after him, they too will receive the same salvation received by those who were produced, since they come from the good inclination. They were assigned the service of proclaiming the Savior’s future coming and his revelation after he had come. Whether angels or humans, when he appointed them to this service, they truly received the nature of their being.


    By contrast, those who came from the thought of lust for control, who came into being through the blow struck by his opponents, were produced by that thought. Since they are mixed, they will receive an ambiguous end. Those who cast off the lust for control that was granted to them only for a time and for particular periods, who glorify the Lord of glory, and who renounce their anger, will receive the reward for their humility, which is unending existence.


    By contrast, those who are arrogant because of their lust for ambition, who love passing glory, and who forget that authority was delegated to them only for particular periods and times—and who therefore did not confess that the Son of God [] is the Lord of all and Savior, and did not renounce their anger or stop imitating the evil ones—will suffer retribution for their ignorance and foolish passion, together with those who have gone astray and wandered away.


    Even more evil are those who committed improper acts against the Lord, as the powers of the left did against him, even putting him to death. They said to themselves, “We will become masters of the Totality if the one proclaimed king of the Totality is killed.” They worked toward this end—the humans and angels who do not belong to the good inclination of those on the right, but come from the mixture. They chose self-glory, even though it is only passing glory and lust, while the way to eternal repose is through humility (that results in) salvation, being of those who are to be saved, those on the right.


    After they praise the Lord, consider what is pleasing to the Church, and sing the hymn of the humble together with her as fully as possible, doing what pleases her, they will share in her sufferings and anguish like those who consider what is good for the Church. They will receive a share in her hope. This applies [] to humans and angels.


    The path of those belonging to the order of the left leads to destruction, because they not only rejected the Lord and devised an evil plot against him, but also directed their hatred, envy, and jealousy against the Church. This is the reason for the condemnation of those who have troubled the Church, even inciting themselves to create <trials> for the Church.'
translation:
  language: pt
  text: 'Os seres humanos vieram a ser divididos em três categorias de natureza: a espiritual, a psíquica[a] e a material. Elas correspondem à tríplice inclinação do Verbo, da qual foram produzidos os materiais, os psíquicos e os espirituais. Cada uma das três categorias de natureza é conhecida por seu fruto. Contudo, elas não eram conhecidas desde o princípio, mas somente quando veio o Salvador, que resplandeceu sobre os santos e revelou a que categoria cada um pertencia.


    A categoria espiritual é como luz procedente de luz e espírito procedente de espírito. Quando sua cabeça apareceu, ela se apressou imediatamente em direção à categoria que lhe correspondia. De repente, formou um corpo para sua cabeça e, pela revelação, recebeu conhecimento de imediato.


    A categoria psíquica, em contraste, é como luz procedente do fogo. Ela hesitou em reconhecer ⟦lacuna⟧ aquele que lhe apareceu e hesitou ainda mais em se apressar em direção a ele por meio da fé. Em vez disso, embora uma voz a instruísse, ⟨ela⟩ se deu por satisfeita, pois não estava longe da esperança da promessa. Recebeu, por assim dizer, a certeza das coisas futuras na forma de uma garantia.[b]


    A categoria material, em contraste, é inteiramente alheia, pois se assemelha às trevas e rejeita a luz que brilha, visto que sua manifestação a extingue.[c] E, por não ter acolhido a ⟨vinda⟩ dele, ela é ⟨desmedida⟩ e cheia de rancor contra a revelação do Senhor.


    A categoria espiritual receberá salvação completa em todos os aspectos. A categoria material será destruída em todos os aspectos, como acontece com um adversário. A categoria psíquica, por ocupar uma posição intermediária tanto no modo como foi produzida quanto em sua natureza, é uma dualidade, em conformidade com sua inclinação para o bem e para o mal. E o que foi determinado para ela é ambíguo ⟨…⟩, bem como sua completa fuga ⟨daquilo⟩ que é bom.[d]


    Aqueles que o Verbo produziu segundo o modelo preexistente em seu pensamento receberam imediatamente a salvação quando ele se lembrou do Excelso e orou por salvação. ⟦Por causa⟧ do pensamento salvador, eles foram completamente salvos por aquilo que esse pensamento produziu. O mesmo se aplica ⟦àqueles⟧ que estes, por sua vez, produziram, ⟦lacuna⟧ quer anjos, quer seres humanos. Por concordarem em reconhecer que existe alguém mais excelso do que eles e em orar e buscá-lo, também receberão a mesma salvação que recebem os que foram produzidos, pois procedem da boa inclinação. Foi-lhes confiado o serviço de anunciar a futura vinda do Salvador e sua revelação depois que ele viesse. Quer fossem anjos, quer seres humanos, quando ele os designou para esse serviço, eles de fato receberam a natureza de seu ser.[e]


    Em contraste, aqueles que procederam do pensamento do desejo de dominar, e que vieram a existir pelo golpe desferido por seus adversários, foram produzidos por esse pensamento. Como são mistos, receberão um fim ambíguo. Aqueles que abandonarem o desejo de dominar — autoridade que lhes foi concedida apenas por certo tempo e por períodos determinados —, glorificarem o Senhor da glória e renunciarem à sua ira receberão a recompensa por sua humildade: uma existência sem fim.


    Em contraste, aqueles que são arrogantes por causa do desejo de grandeza, que amam a glória passageira e se esquecem de que a autoridade lhes foi delegada apenas por períodos e tempos determinados — e que, por isso, não confessaram que o Filho de Deus ⟦lacuna⟧ é o Senhor de todos e Salvador, nem renunciaram à sua ira ou deixaram de imitar os maus — sofrerão a retribuição por sua ignorância e paixão insensata, juntamente com os que erraram e se desviaram.


    Ainda piores são os que praticaram atos impróprios contra o Senhor, como fizeram contra ele as potências da esquerda, chegando até mesmo a matá-lo. Disseram consigo: “Nós nos tornaremos senhores da Totalidade[f] se aquele que foi proclamado rei da Totalidade for morto”. E trabalharam para esse fim: os seres humanos e os anjos que não pertencem à boa inclinação dos que são da direita, mas procedem da mistura. Eles escolheram a glória própria, embora ela seja apenas glória passageira e desejo, ao passo que o caminho para o repouso eterno passa pela humildade, que resulta em salvação e é própria dos que serão salvos, os da direita.[g]


    Depois que louvarem o Senhor, considerarem o que agrada à Igreja e, junto com ela, cantarem tão plenamente quanto possível o hino dos humildes, fazendo o que lhe agrada, participarão de seus sofrimentos e de suas angústias, como aqueles que levam em conta o bem da Igreja. Eles terão parte em sua esperança. Isso se aplica ⟦lacuna⟧ a seres humanos e anjos.


    O caminho dos que pertencem à ordem da esquerda conduz à perdição, pois eles não apenas rejeitaram o Senhor e tramaram um plano maligno contra ele, mas também dirigiram seu ódio, sua inveja e seu ciúme contra a Igreja. Essa é a causa da condenação daqueles que perturbaram a Igreja, chegando até a incitar a si mesmos a criar ⟨provações⟩ para ela.[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Psíquica” significa aqui “relativa à alma” e nomeia a categoria intermediária entre a espiritual e a material; não se refere especificamente à psicologia moderna.
    reason: Esclarecer um termo técnico potencialmente enganoso em português comum.
  - marker: b
    text: A imagem é a de algo dado antecipadamente como garantia do que ainda virá.
    reason: Explicar o valor metafórico de “garantia” sem inserir a explicação no corpo do texto.
  - marker: c
    text: O referente do pronome nesta frase é incerto no testemunho disponível; a tradução conserva essa dificuldade tanto quanto o português permite.
    reason: Sinalizar ambiguidade real sem resolvê-la silenciosamente.
  - marker: d
    text: A passagem está danificada e sua sintaxe é incerta. Os sinais ⟨ ⟩ indicam palavras restauradas ou uma lacuna assinalada no testemunho; ⟦lacuna⟧ indica perda de texto.
    reason: Preservar transparentemente os sinais de dano e restauração da fonte intermediária.
  - marker: e
    text: A relação entre a designação para o serviço e o recebimento da “natureza de seu ser” permanece obscura no texto.
    reason: Evitar uma paráfrase teológica que eliminaria a dificuldade.
  - marker: f
    text: “Totalidade” é um termo cosmológico técnico do tratado para o conjunto pleno da realidade; não foi substituído por “universo”.
    reason: Orientar o leitor quanto ao uso especializado e à capitalização.
  - marker: g
    text: A construção que liga humildade, salvação e “os da direita” é sintaticamente difícil no testemunho; a tradução mantém a associação sem determinar além do texto como cada expressão se relaciona com as demais.
    reason: Preservar tensão e incerteza sintática.
  - marker: h
    text: “Provações” é uma restauração editorial no testemunho fornecido.
    reason: Identificar como reconstrução uma palavra não preservada com segurança.
lexical_decisions:
- source_word: spiritual
  choice: espiritual
  rationale: Mantém a categoria técnica e sua associação explícita com espírito procedente de espírito.
- source_word: soulish
  choice: psíquica
  rationale: Distingue a categoria intermediária da espiritual e da material sem introduzir a ideia moderna de saúde mental; a nota esclarece o sentido técnico ligado à alma.
- source_word: material
  choice: material
  rationale: Reproduz de forma direta a terceira categoria antropológica do tratado.
- source_word: Word
  choice: Verbo
  rationale: É a forma portuguesa tradicional e inteligível para o Logos personificado, sem reduzir o termo a mera fala.
- source_word: inclination
  choice: inclinação
  rationale: Preserva a recorrência conceitual do testemunho, inclusive nas expressões boa inclinação e inclinação para o bem e o mal.
- source_word: Totality
  choice: Totalidade
  rationale: Mantém o termo cosmológico como designação técnica, com inicial maiúscula, em vez de o harmonizar com universo ou criação.
- source_word: pledge
  choice: garantia
  rationale: Comunica o caráter antecipatório de uma segurança dada quanto às coisas futuras; a nota registra a metáfora.
- source_word: powers of the left
  choice: potências da esquerda
  rationale: Preserva a terminologia cosmológica de direita e esquerda sem convertê-la em categorias políticas ou demonológicas posteriores.
theological_decisions:
- issue: Natureza das três categorias humanas
  choice: Manter espiritual, psíquica e material como categorias de natureza do próprio tratado
  alternative: Reformular como simples tipos de comportamento ou estágios espirituais
  rationale: O texto apresenta explicitamente uma divisão segundo natureza e fruto; reinterpretá-la apagaria a antropologia própria do documento.
- issue: Destino da categoria psíquica
  choice: Preservar como ambíguo e textualmente danificado
  alternative: Definir sua salvação ou condenação de modo inequívoco
  rationale: O testemunho declara ambiguidade e contém lacuna/restaurações; não se deve resolver a tensão.
- issue: Salvação e humildade dos seres mistos
  choice: Conservar a possibilidade de existência sem fim para os que renunciam ao domínio e à ira
  alternative: Subordinar a passagem a um esquema soteriológico confessional posterior
  rationale: A tradução segue a lógica interna do tratado sem harmonização denominacional.
- issue: Filho de Deus como Senhor e Salvador
  choice: Manter a afirmação com sinal de lacuna adjacente
  alternative: Completar a lacuna com uma fórmula cristológica conjectural
  rationale: A evidência fornecida não autoriza reconstrução adicional.
- issue: Direita e esquerda
  choice: Manter as categorias simbólico-cosmológicas sem explicação doutrinária importada
  alternative: Identificá-las diretamente com grupos históricos, anjos bons e demônios ou eleitos e réprobos
  rationale: O trecho relaciona essas categorias a inclinações e mistura, mas não justifica todas essas identificações rígidas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantêm-se os termos técnicos indispensáveis — “psíquica”, “Verbo”, “Totalidade”, “potências”, “direita” e “esquerda” — sem harmonização confessional. A redação é necessariamente provisória porque o material fornecido declara que a revisão direta do copta do Códice de Nag Hammadi I,5 ainda está pendente; por isso, lacunas, restaurações e ambiguidades do testemunho inglês de domínio público foram preservadas de modo visível.
