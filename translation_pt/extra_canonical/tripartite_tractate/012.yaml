translation:
  language: pt
  text: 'Contudo, ele foi um <auxiliador> e redentor da opinião e da rebelião deles, porque dele [vem] a conversão chamada “arrependimento”. Isso aconteceu [quando] o Verbo [mudou] sua opinião e seu pensamento. Afastando-se do mal, voltou-se para as coisas boas. Depois da conversão, lembrou-se dos que existem e da oração por aquele que se converteu por meio do que é bom. Primeiro orou àquele que habita na Plenitude e se lembrou dele; depois, de seus irmãos, tanto de cada um separadamente como de todos juntos ao mesmo tempo; mas, antes de todos eles, do Pai.


    [a] A oração em união o ajudou em seu próprio retorno <a> si mesmo e à Totalidade, pois o que o levou a se lembrar dos que existiam desde o princípio foi o fato de ele mesmo ter sido lembrado. Esse era o pensamento distante que chama de longe e o faz retornar.


    Toda a sua oração e lembrança abrangia várias potências que estavam de acordo com o limite mencionado anteriormente, pois nada em seu pensamento é estéril. As potências eram boas e superiores às da semelhança, porque as da semelhança também pertencem a uma natureza [sombria]. Aquilo em que se tornaram teve origem numa ilusão ligada à semelhança e num [pensamento vão] de orgulho; e elas tiveram origem num [pensamento] que primeiro as conheceu. Como são os primeiros seres? São como o <esquecimento> e o sono profundo, semelhantes aos que têm sonhos perturbadores, aos que, em seu sonho, veem <alguém> persegui-los e afligi-los. Para ele, os outros se assemelham a criaturas iluminadas que aguardam o nascer do sol, pois contemplaram nele sonhos que de fato são agradáveis.


    Imediatamente, [b] as emanações do pensamento <cessaram>; já não tinham substância alguma nem honra alguma, [pois] <elas> não se igualam aos que preexistiam. Se eram superiores [às] semelhanças, a única razão de serem elevadas acima delas era terem agido com boa intenção, pois não se originaram da fraqueza que veio a existir. A boa intenção era <daquele que> buscou o Preexistente depois de orar e de se elevar ao bem. Ele semeou nelas a inclinação para buscar e orar ao glorioso Preexistente; semeou nelas a capacidade de pensar [nisso] e de compreender que havia algo maior do que elas, algo que existia antes de elas existirem, embora não soubessem o que era. Ao gerar harmonia e amor mútuo, elas agiram, a partir desse pensamento, em unidade e unanimidade, visto que da unidade e da unanimidade haviam recebido sua existência.


    [a] Há uma lacuna no manuscrito no início deste parágrafo.

    [b] Há uma lacuna no manuscrito depois de “Imediatamente”.'
