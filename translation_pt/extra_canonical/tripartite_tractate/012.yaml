  naturalness: O português é em geral claro e de registro adequado. Foram ajustadas construções levemente pesadas ou menos idiomáticas, especialmente a oração e lembrança como conjunto de potências e a descrição dos sonhos perturbadores, sem simplificar a sintaxe conceitual do tratado.
  terminology: «Verbo», «Plenitude», «Totalidade», «potências», «semelhança», «Preexistente» e «emanações» são escolhas consistentes e adequadas. Mantêm-se «conversão chamada “arrependimento”» e os sinais [ ] e < > para não ocultar o caráter editorialmente incerto do testemunho.
  issues:
  - severity: medium
    issue: Relação de «redeemer from their opinion and rebellion»
    rationale: «Redentor da opinião e da rebelião deles» pode significar que a opinião e a rebelião são redimidas. O inglês apresenta-o como aquele que os liberta/resgata de sua opinião e rebelião; a preposição precisa ser explicitada em português.
  - severity: low
    issue: «the former beings» traduzido por «os primeiros seres»
    rationale: «Primeiros» estreita “former” a anterioridade absoluta. «Seres anteriores» conserva a referência comparativa e a ambiguidade do testemunho.
  - severity: low
    issue: Imagem dos sonhos perturbadores
    rationale: O testemunho diz que, no sonho, alguém os persegue e aflige; «veem alguém persegui-los» acrescenta o ato de ver e torna a construção menos direta.
