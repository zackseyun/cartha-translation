lexical_decisions:
- source_word: conversion called “repentance”
  choice: conversão chamada “arrependimento”
  rationale: Mantém os dois termos conceitualmente distintos e preserva a explicação do próprio texto, sem reduzir ambos a uma única palavra.
- source_word: the Word
  choice: o Verbo
  rationale: “Verbo” é a forma portuguesa tradicional e inteligível para o título técnico Logos, sem acrescentar identificação não explicitada no trecho.
- source_word: Fullness
  choice: Plenitude
  rationale: Conserva como termo técnico, com inicial maiúscula, o conceito cosmológico expresso no testemunho.
- source_word: Totality
  choice: Totalidade
  rationale: Distingue este termo de “Plenitude” e preserva o vocabulário técnico do tratado.
- source_word: powers
  choice: potências
  rationale: “Potências” comunica melhor entidades ou forças hipostasiadas do que o genérico “poderes” neste contexto cosmológico.
- source_word: likeness
  choice: semelhança
  rationale: Preserva a abstração e a repetição terminológica do testemunho, sem interpretar o referente incerto.
- source_word: pre-existent
  choice: Preexistente
  rationale: A inicial maiúscula indica o uso titular no contexto, mantendo aberta a identificação teológica precisa.
- source_word: emanations
  choice: emanações
  rationale: Retém o termo cosmológico técnico, corrente em português e adequado ao contexto do tratado.
theological_decisions:
- issue: Identidade do “Verbo” e do “Preexistente”
  choice: Manter os títulos sem identificação explicativa adicional
  alternative: Identificá-los explicitamente com Cristo, o Pai ou outra figura do sistema do tratado
  rationale: O trecho não resolve sozinho todas as identidades, e uma explicitação importaria interpretação teológica externa.
- issue: Relação entre conversão e arrependimento
  choice: Preservar a fórmula “conversão chamada ‘arrependimento’”
  alternative: Traduzir ambos simplesmente como “arrependimento”
  rationale: A formulação preserva a tensão conceitual e o caráter definidor do enunciado.
- issue: Aquele que lembra e aquele que é lembrado
  choice: Preservar a voz passiva e a reciprocidade da lembrança
  alternative: Nomear explicitamente o agente divino que se lembrou dele
  rationale: O agente não é declarado no testemunho fornecido; nomeá-lo resolveria uma ambiguidade genuína.
- issue: Estatuto das potências e emanações
  choice: Usar linguagem ontológica do testemunho sem normalização doutrinária
  alternative: Reformular como disposições psicológicas ou seres angélicos
  rationale: O texto oscila entre pensamento, potências e entidades; a tradução não deve impor uma ontologia denominacional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A tradução é provisória porque se baseia no testemunho inglês de domínio público e ainda aguarda revisão direta do copta. Preservaram-se entre colchetes as restaurações editoriais e entre sinais angulares as conjecturas ou suplementações do testemunho; colchetes vazios foram convertidos em marcadores de notas para evitar sinais opacos no texto publicado.
