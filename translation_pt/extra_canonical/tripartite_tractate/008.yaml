lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Mantém o termo técnico da cosmologia do tratado, evitando reduzi-lo simplesmente a “eras” ou “seres eternos”.
- source_word: Totalities / Totality
  choice: Todo / Totalidade
  rationale: Preserva a oscilação terminológica do testemunho entre formas coletivas e abstratas, com maiúsculas para marcar seu uso técnico.
- source_word: Fullness
  choice: Plenitude
  rationale: Equivalente tradicional e inteligível para o conceito técnico de plenitude, sem inserir uma explicação doutrinária no corpo do texto.
- source_word: emanations
  choice: emanações
  rationale: Retém a imagem cosmológica de procedência empregada pelo texto.
- source_word: archons
  choice: arcontes
  rationale: Transliteração consagrada do termo técnico, mais precisa que “governantes” neste contexto cosmológico.
- source_word: procreative nature
  choice: natureza geradora
  rationale: Expressa produção ou geração de descendência em linguagem digna e natural, sem a conotação predominantemente sexual de “procriadora”.
- source_word: words of words
  choice: palavras de palavras
  rationale: Conserva a formulação hierárquica e sua possível ressonância técnica, sem decidir se “palavras” deve ser entendido como “logoi” ou seres pessoais.
theological_decisions:
- issue: Igualdade dos seres originados com o Pai
  choice: “gerarem algo igual ou semelhante a ele”
  alternative: “produzirem seres da mesma essência que ele”
  rationale: Preserva a tensão e a amplitude da afirmação sem importar vocabulário ontológico posterior.
- issue: “Eles também são o que ele é”
  choice: Tradução direta da identidade comparativa
  alternative: “eles também se assemelham a ele”
  rationale: A formulação mais forte do testemunho foi mantida, sem atenuação interpretativa.
- issue: Pai, deus e Todo aplicados aos seres derivados
  choice: Manter as predicações em paralelo e com minúscula em “pai” e “deus” quando designam os seres feitos assim
  alternative: Capitalizar todos os títulos ou explicar uma hierarquia divina
  rationale: Distingue graficamente os seres derivados do Pai e de Deus mencionados como fonte, sem negar a elevada linguagem do texto nem impor uma teologia externa.
- issue: Referente de “eles” nas glorificações primeira e segunda
  choice: Manter o pronome e a ambiguidade estrutural
  alternative: Explicitar “os éons produziram” ou “eles constituíram”
  rationale: O testemunho é sintaticamente difícil; a tradução evita decidir além da evidência disponível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Os termos técnicos “éons”, “Plenitude”, “emanações” e “arcontes” foram preservados. As restaurações editoriais entre sinais angulares e os suplementos entre colchetes foram mantidos. A tradução é provisória porque se baseia no testemunho inglês público fornecido; a revisão direta do copta ainda está pendente.
