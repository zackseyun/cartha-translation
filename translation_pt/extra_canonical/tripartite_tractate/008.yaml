translation:
  language: pt
  text: 'Ele não revelou de uma só vez ao Todo as diversas qualidades, nem revelou sua igualdade consigo mesmo àqueles que se originaram dele. Todos os que se originaram dele, <que> são os éons dos éons, [a] por serem emanações e descendência de <sua> natureza geradora, também <geram>, segundo sua própria natureza geradora, para a glória do Pai, pois ele é a causa que os estabeleceu. Como dissemos antes, ele cria os éons como raízes, fontes e pais; e é a ele que glorificam, porque ele possui conhecimento e sabedoria e porque o Todo reconheceu que se originou do conhecimento e da sabedoria da Totalidade.


    Se os que pertencem ao Todo tivessem prestado glória segundo as <capacidades> próprias de cada éon, o que teriam produzido não passaria de um pálido reflexo do Pai, que é a Totalidade. Por isso, no cântico de glória e no poder da unidade dele, da qual procederam, eles foram levados a se mesclar, a se combinar e a se unir uns com os outros. Da assembleia da Plenitude, ofereceram ao Pai uma glorificação digna: uma imagem única e, ao mesmo tempo, múltipla, pois foi produzida para a glória daquele que é um só e porque eles se aproximaram daquele que é, ele próprio, o Todo.


    Isso foi um louvor [dos éons] àquele que produziu o Todo como primícia dos imortais e como um ser eterno. Pois, tendo eles surgido dos éons vivos, perfeitos e plenos por causa daquele que é perfeito e pleno, o estado pleno e perfeito dos que glorificaram de maneira perfeita permaneceu intacto por causa da comunhão. Assim também o Pai perfeito, quando é glorificado, ouve a glorificação que [o] glorifica, para manifestar que eles também são o que ele é.


    A razão da segunda honra concedida a eles foi aquilo que lhes retornou da parte do Pai, quando reconheceram o dom que os capacitava a dar fruto uns entre os outros para o Pai. O resultado foi que, assim como <foram> gloriosamente gerados para o Pai, também se manifestaram de modo perfeito no ato de glorificar.


    Eles foram pais da terceira glorificação, correspondente à liberdade e ao poder que foram gerados com eles e lhes concederam a capacidade de glorificar em conjunto e de glorificar individualmente, por vontade própria. Eles foram a primeira e a segunda glorificações, de modo que ambas são perfeitas e plenas, pois são manifestações do Pai perfeito e pleno e das coisas perfeitas que surgiram da glorificação daquele que é perfeito. O fruto da terceira glorificação, porém, abrange a vontade de cada éon e cada uma das qualidades e poderes do Pai. O fruto é completo e perfeito na medida em que a glória que os éons desejam e podem dar ao Pai resulta tanto da concordância entre eles como de cada um individualmente. É isso que ele ama e sobre o que exerce poder, pois por meio disso o Pai é glorificado. Por essa razão, eles são mentes de mentes, que se mostram palavras de palavras, anciãos de anciãos e graus de graus, sendo exaltados uns acima dos outros.


    Cada um que dá glória possui seu lugar, sua exaltação, sua morada e seu repouso, que constituem a glória que oferece. Todos os que glorificam o Pai têm uma geração eterna, gerando ao se ajudarem mutuamente, porque as emanações são infinitas e imensuráveis e porque não há no Pai vestígio algum de inveja contra os que se originaram dele quanto a gerarem algo igual ou semelhante a ele, visto que ele existe no Todo, gerando e revelando a si mesmo. Ele faz ser pai a quem deseja, e de fato é o Pai dessa pessoa; faz ser deus a quem deseja, e de fato é o Deus dessa pessoa; e faz deles o Todo, <para o qual> ele é a Totalidade. [b] Em sentido estrito, todos os grandes nomes estão reservados ali — nomes dos quais também participam os anjos que vieram a existir no mundo junto com os arcontes, embora não tenham semelhança alguma com os seres eternos.'
