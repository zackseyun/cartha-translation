lexical_decisions:
- source_word: Church
  choice: Igreja
  rationale: Mantém o termo coletivo e teológico tradicional, aqui apresentado como realidade preexistente.
- source_word: only son
  choice: filho único
  rationale: Expressa a singularidade filial sem acrescentar uma interpretação técnica que elimine a tensão com a existência da Igreja.
- source_word: unbegotten
  choice: não foi gerado
  rationale: Forma clara e corrente em português, preservando a afirmação metafísica do testemunho.
- source_word: beginninglessness and endlessness
  choice: não ter princípio nem fim
  rationale: Evita substantivos excessivamente artificiais e conserva os dois atributos paralelos.
- source_word: offspring
  choice: descendência
  rationale: Preserva o caráter coletivo e derivativo sem especificar indevidamente filhos, emanações ou criaturas.
- source_word: aeons
  choice: éons
  rationale: Transliteração corrente no estudo desses textos, adequada ao sentido técnico e distinta de uma simples tradução por “eras”.
- source_word: reposes
  choice: repousa
  rationale: Mantém a imagem relacional e espacial do texto sem explicá-la doutrinariamente.
theological_decisions:
- issue: Preexistência da Igreja juntamente com o Filho
  choice: Preservar literalmente que a Igreja existia desde o princípio
  alternative: Reformular como preexistência apenas ideal ou no propósito divino
  rationale: O testemunho afirma a preexistência sem qualificá-la; explicá-la como meramente ideal resolveria uma tensão que o texto mantém.
- issue: O Filho como filho único e, ao mesmo tempo, irmão
  choice: Manter ambas as afirmações e a formulação paradoxal
  alternative: Harmonizar “irmão” como simples metáfora para os membros da Igreja
  rationale: A passagem trata explicitamente a questão como enigmática, portanto a tradução não deve eliminar o paradoxo.
- issue: O Pai concebe a si mesmo como Filho
  choice: Traduzir a afirmação diretamente
  alternative: Alterar o sujeito ou parafrasear como o Pai concebendo o Filho
  rationale: A redação transmitida é teologicamente incomum, mas deve permanecer visível enquanto não houver revisão direta do copta.
- issue: Referente de “which” em “which ... is called”
  choice: Usar “aquilo que”, evitando um referente gramatical totalmente explícito
  alternative: Identificar diretamente a Igreja ou os indivíduos como “os éons dos éons”
  rationale: A construção do testemunho permite incerteza quanto ao referente imediato; a formulação portuguesa conserva parte dessa ambiguidade.
- issue: Referente de “his nature”
  choice: Usar “a natureza dele”
  alternative: Explicitar “a natureza do Filho”
  rationale: A forma pronominal preserva a referência provável ao Filho sem introduzir explicitação maior que a do testemunho.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções claras. Mantiveram-se os termos técnicos “Igreja” e “éons”, bem como as tensões metafísicas do trecho. Como a revisão direta do copta está pendente, a redação é provisória e se baseia no testemunho inglês público fornecido; colchetes e notas identificam lacunas e restaurações editoriais.
