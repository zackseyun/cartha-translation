translation:
  language: pt
  text: 'Não foi somente o Filho que existiu desde o princípio; a Igreja também existiu desde o princípio. Se alguém pensa que a compreensão de que o Filho é filho único contradiz essa afirmação, por causa do caráter enigmático do assunto, não é assim. Assim como [há uma lacuna][a] o Pai é uma unidade e não se revelou como Pai a ninguém senão a si mesmo, também o Filho foi reconhecido como irmão de ninguém senão de si mesmo, pois não foi gerado e não tem princípio. O Pai admira a si mesmo [como][b] Pai e dá [a si mesmo glória][c], honra e [amor][d]. Além disso, ele concebe a si mesmo como Filho, em conformidade com os atributos de não ter princípio nem fim. Desse modo, a questão fica confirmada.


    Sua descendência incontável e ilimitada é inseparável. Os que existem tiveram origem no Filho e no Pai como os beijos daqueles que se beijam com um pensamento bom e insaciável: o abraço é um só, embora compreenda muitos beijos. O sentido é que a Igreja compreende muitos indivíduos que existiam antes dos éons — aquilo que, em sentido estrito, é chamado de “os éons dos éons”. Essa é a condição dos espíritos santos e imperecíveis, sobre os quais o Filho repousa, pois essa é a natureza dele, assim como o Pai também repousa [há uma lacuna][e] sobre o Filho.'
