  terminology: “Igreja”, “Filho”, “Pai”, “éons” e “espíritos santos e imperecíveis” são escolhas adequadas. “Não gerado e sem princípio” exprime de modo mais direto e estável os dois predicados metafísicos do testemunho do que “não foi gerado e não tem princípio”, sem lhes acrescentar interpretação doutrinária.
