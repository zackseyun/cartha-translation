  naturalness: A redação foi ajustada para um português moderno e fluente, sem normalizar a argumentação metafísica incomum do trecho. As lacunas continuam explicitamente assinaladas, mas foram posicionadas de modo menos disruptivo para a sintaxe portuguesa.
  terminology: Mantêm-se «Filho», «Pai», «Igreja», «éons» e «espíritos santos e imperecíveis». «Não gerado» traduz «unbegotten» de maneira mais precisa do que o pretérito «não foi gerado».
