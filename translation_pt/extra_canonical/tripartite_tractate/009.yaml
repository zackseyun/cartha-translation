base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: pt
  text: 'Todo o conjunto dos éons possui amor e anseio por descobrir o Pai de maneira perfeita e completa, e nisso consiste sua unidade sem restrições. Embora o Pai se revele eternamente, não foi seu desejo que eles o conhecessem de modo automático. Em vez disso, ele permite ser apreendido por meio da busca, enquanto reserva para si sua essência primordial, que não pode ser sondada. O Pai concedeu aos éons desejos fundamentais, pois estes constituem lugares ao longo do caminho que conduz a ele, como uma escola que disciplina a conduta. Ele lhes ofereceu:


    fé nele e oração àquele que não veem,


    e uma esperança firme naquele que não apreendem,


    e um amor fecundo que contempla o que não vê,


    e uma compreensão digna da mente eterna,


    e uma bênção de riqueza e liberdade,


    e uma compreensão que anseia glorificar o Pai por causa do pensamento <dele>.[a]


    [] Pela vontade dele, o Pai exaltado é conhecido por meio do Espírito que respira no interior das Totalidades.[b] Ele chega a lhes comunicar a ideia de buscar aquele que é desconhecido, assim como um aroma agradável leva alguém a procurar sua fonte, pois o aroma do Pai supera os aromas naturais. Sua doçura proporciona aos éons um prazer indescritível e desperta neles a ideia de se unirem àquele que deseja que o conheçam de modo unificado, bem como a de ajudarem uns aos outros no Espírito plantado dentro deles. Embora um grande peso os oprima, eles são renovados de maneira indescritível, pois não podem ser separados daquilo em que foram colocados de modo inapreensível. Eles não falarão, mas permanecerão em silêncio a respeito da glória do Pai, a respeito daquele que pode falar; contudo, dele receberão uma forma.[c]


    Embora a fala não possa descrevê-lo, ele revelou [a si mesmo].[d] Eles o possuem <oculto> num pensamento.[e] É por isso que os éons permanecem em silêncio quanto ao modo como o Pai subsiste em sua forma, sua essência e sua grandeza. [] Ainda assim, os éons são considerados dignos de saber, por meio do Espírito dele, que ele não pode ser nomeado nem compreendido. Por meio de seu espírito — o vestígio da busca por ele —, ele lhes concede a capacidade de apreendê-lo e de falar a seu respeito. Cada éon é um nome, <isto é>, cada um é uma qualidade e um poder do Pai, pois ele existe em muitos nomes, que se combinam e estão em harmonia uns com os outros. Pode-se falar dele por causa da riqueza da linguagem. Do mesmo modo, embora o Pai seja um só nome por causa de sua unidade, ele possui incontáveis qualidades e nomes.'
