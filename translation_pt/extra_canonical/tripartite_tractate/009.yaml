    rationale: 'Os sinais < > devem preservar a palavra suprida ou reconstruída no testemunho. “Eles o possuem <oculto>” altera a evidência textual apresentada: faz “oculto” parecer suprido e deixa o objeto pronominal como texto seguro. A formulação revisada marca “<ele>”, correspondente ao “<him>” do testemunho.'
