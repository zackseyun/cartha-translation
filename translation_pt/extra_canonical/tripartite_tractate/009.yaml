  footnotes:
  - marker: a
    text: Os sinais < > indicam palavras supridas ou reconstruídas no testemunho usado como base.
    reason: Explica a marca textual preservada em “<dele>” sem ocultar a incerteza.
  - marker: b
    text: “Totalidades” é um termo técnico do tratado para as realidades que compõem a plenitude; a extensão exata do termo permanece dependente do contexto cosmológico da obra.
    reason: Auxilia o leitor moderno sem substituir o termo por uma interpretação fechada.
  - marker: c
    text: A construção sobre permanecer em silêncio, “aquele que pode falar” e receber uma forma é sintaticamente obscura no testemunho disponível.
    reason: Assinala uma ambiguidade real que a tradução não deve resolver silenciosamente.
  - marker: d
    text: Os colchetes [ ] assinalam texto restaurado ou uma lacuna no testemunho; os colchetes vazios representam uma lacuna não preenchida.
    reason: Esclarece os sinais críticos presentes no corpo do texto.
  - marker: e
    text: O testemunho traz palavras marcadas por sinais editoriais nesta frase, e a relação entre possuir o Pai, o ocultamento e o pensamento admite mais de uma análise.
    reason: Preserva a incerteza textual e sintática da passagem.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Mantém o termo técnico da cosmologia do tratado, já estabelecido em português, sem reduzi-lo a simples períodos de tempo.
- source_word: whole system
  choice: todo o conjunto
  rationale: Expressa a totalidade ordenada sem impor a conotação moderna e técnica de “sistema”.
- source_word: grasped / grasp
  choice: apreendido / apreender
  rationale: Preserva a dimensão intelectual e experiencial do verbo, distinguindo-a de mero conhecimento factual.
- source_word: primal essence
  choice: essência primordial
  rationale: Conserva a linguagem metafísica do testemunho sem explicação doutrinária adicional.
- source_word: Totalities
  choice: Totalidades
  rationale: A inicial maiúscula sinaliza um termo cosmológico técnico e evita dissolvê-lo em “todas as coisas”.
- source_word: mixing with / joining with
  choice: se unirem a
  rationale: Produz português natural e mantém a ideia de associação íntima, sem especificar uma fusão ontológica que o testemunho não esclarece.
- source_word: form
  choice: forma
  rationale: Mantém a amplitude metafísica do termo em vez de interpretá-lo como aparência, corpo ou identidade.
- source_word: trace
  choice: vestígio
  rationale: Preserva a imagem de um sinal ou rastro parcial relacionado à busca.
- source_word: riches of speech
  choice: riqueza da linguagem
  rationale: Comunica abundância expressiva em português corrente e digno.
theological_decisions:
- issue: Revelação eterna do Pai e conhecimento não automático
  choice: Manter lado a lado a autorrevelação eterna e a busca concedida aos éons
  alternative: Explicar que o Pai se revela apenas parcialmente ou que deliberadamente oculta conhecimento
  rationale: O texto sustenta a tensão entre revelação e inescrutabilidade; resolvê-la acrescentaria uma sistematização ausente.
- issue: Natureza do Espírito
  choice: Usar “Espírito” quando o testemunho apresenta o agente que respira nas Totalidades e “espírito” na expressão posterior
  alternative: Uniformizar todas as ocorrências com maiúscula ou minúscula
  rationale: A variação preserva os sinais do testemunho e não decide se todas as referências designam exatamente a mesma realidade hipostática.
- issue: União dos éons com o Pai
  choice: “se unirem àquele”
  alternative: “fundirem-se com ele” ou “terem comunhão com ele”
  rationale: Evita tanto impor fusão ontológica quanto importar terminologia confessional específica.
- issue: O Pai como muitos nomes e um só nome
  choice: Preservar literalmente a tensão entre unidade e multiplicidade de nomes
  alternative: Interpretar os nomes apenas como títulos ou manifestações
  rationale: A formulação é central à metafísica do trecho e deve permanecer aberta.
- issue: Aquele que pode falar
  choice: Conservar a referência ambígua
  alternative: Identificá-lo explicitamente com o Pai, o Espírito ou um éon
  rationale: A sintaxe do testemunho é obscura; uma identificação explícita excederia a evidência disponível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por sintaxe clara sem banalizar o vocabulário metafísico. “Éons” e “Totalidades” foram mantidos como termos cosmológicos. A tradução é necessariamente provisória porque a base fornecida é um testemunho inglês de domínio público e a revisão direta do copta ainda está pendente. Os sinais [] e < > foram preservados, com notas explicativas, e as passagens sintaticamente obscuras não foram harmonizadas.
