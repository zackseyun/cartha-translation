translation:
  language: pt
  text: 'Ocorreu a um dos éons[a] tentar compreender o caráter incompreensível e glorificá-lo, especialmente o caráter inexprimível do Pai. Por ser uma Palavra[b] proveniente da unidade, ele é um; [contudo], não provém da unidade das Totalidades[c], nem daquele que as produziu, isto é, daquele que produziu a Totalidade, a saber, o Pai. Esse éon era um dos que haviam recebido sabedoria, daqueles cujo pensamento preexistia e por meio do qual produziam o que queriam. Assim, ele recebeu uma sabedoria inata para investigar o fundamento oculto, pois é fruto da sabedoria. O livre-arbítrio gerado com as Totalidades foi uma razão pela qual ele fez […] o que desejava, sem que ninguém o impedisse.


    A intenção desse, que é a Palavra, era boa. Quando foi produzido, apressou-se a glorificar o Pai, embora desejasse algo impossível: queria produzir um ser perfeito a partir de uma união da qual não participava e sem ter recebido ordem para isso. Esse éon foi o último a ser produzido por auxílio mútuo e era pequeno em grandeza. Antes de gerar qualquer coisa para a glorificação da vontade e em união com as Totalidades, ele avançou generosamente, movido por um amor abundante, e dirigiu-se ao que circunda a glória perfeita. Pois a Palavra não foi produzida à margem da vontade do Pai; isto é, não avançou sem ela.


    O Pai, porém, o havia produzido para aqueles que ele sabia ser apropriados para produzir. O Pai e as Totalidades se retiraram dele, para que se estabelecesse o limite fixado pelo Pai, pois isso não se dá pela compreensão do que é incompreensível, mas pela vontade […] do Pai. Além disso, isso aconteceu para que as coisas que vieram a existir se tornassem parte de um plano de salvação que haveria de se desenvolver — e que não poderia deixar de se desenvolver — a fim de revelar a Plenitude[d]. Portanto, não é apropriado falar de modo negativo dessa ação da Palavra; é apropriado, porém, dizer que essa ação da Palavra é causa de um plano de salvação destinado a se desenvolver.


    A Palavra gerou a si mesma como perfeita e única, contentando-se com isso para a glória do Pai que desejava. Aqueles, porém, dos quais queria apoderar-se firmemente, ela os gerou como sombras, imagens e semelhanças. Não conseguiu contemplar a luz; em vez disso, perscrutou as profundezas e duvidou. Daí surgiu uma separação que a perturbou profundamente e um afastamento causado por sua própria dúvida e separação, pelo esquecimento e desconhecimento de si mesma e <daquilo que> existe.


    Sua exaltação de si mesma e sua convicção de que poderia compreender o que é incompreensível se endureceram e criaram raízes nela. Essas fraquezas, porém, permaneceram com ela enquanto estava fora de si, por causa da dúvida a respeito de si mesma, pois <não conseguiu alcançar> as glórias do Pai, cuja grandeza sublime não pode ser imitada. Não as alcançou porque foi incapaz de compreendê-las.


    Aquele que ela produziu por si mesma […] como um único éon apressou-se a subir para o que lhe pertencia. E esse seu parente na Plenitude abandonou aquele que veio a existir na deficiência, juntamente com os que ele havia produzido de maneira imaginária, pois estes não lhe pertencem. Depois de produzir a si mesmo perfeitamente — ele que de fato havia produzido a si mesmo —, enfraqueceu como uma natureza feminina que abandona seu correspondente masculino. Daquilo que nele era deficiente surgiram as coisas provenientes de seu pensamento e de seu orgulho; mas, por meio daquilo que nele é perfeito, ele se afastou da deficiência e [elevou-se] aos que lhe pertencem. Permaneceu na Plenitude como recordação para ele, pois [havia sido] salvo de [seu orgulho].


    Aquele que se apressou a subir e aquele que o atraiu para si não foram estéreis. Ao produzirem um fruto na Plenitude, depuseram o que havia surgido na deficiência. As coisas que vieram a existir do pensamento orgulhoso são semelhantes às Plenitudes: são semelhanças, imagens, sombras e ilusões delas, desprovidas de razão e iluminação e pertencentes ao pensamento vazio, pois não foram produzidas por coisa alguma. […] Por isso, o fim delas corresponderá ao seu princípio, pois aquilo que nunca existiu voltará ao que nunca existirá. Contudo, elas se consideram maiores, mais fortes e mais [honradas] do que os nomes [que as embelezam], dos quais são sombras. São como um belo reflexo [que alguém vê], pois o rosto de uma imagem normalmente recebe sua beleza daquilo que ela reflete.


    Elas pensavam existir por si mesmas e não ter origem, porque não viam nenhuma outra coisa que existisse antes delas. Por isso, viviam em desafio e em atos de rebeldia, sem se humilharem diante daquele por causa de quem vieram a existir. Desejavam dar ordens umas às outras e dominar umas sobre as outras, [em] sua ambição por glória, embora a glória que possuíam contivesse a causa [da] ordem[e] que haveria de existir. Por serem semelhanças das realidades superiores, elas se exaltaram movidas pelo desejo de dominar, cada uma segundo a medida do grande nome cuja sombra era, e cada uma se julgava superior às suas companheiras.


    O pensamento dessas outras não era estéril. Assim como ocorre com <aqueles> cujas sombras elas são, entre os quais cada pensamento se torna um filho, […] aquilo em que elas pensam também se torna sua descendência. Aconteceu, portanto, que delas foi produzida uma multidão de descendentes: combatentes, guerreiros, causadores de tumulto, rebeldes desobedientes, amantes do domínio e todos os demais seres dessa espécie que delas surgiram.


    A Palavra foi a causa de essa multidão vir a existir, e ficou cada vez mais perplexa e admirada. Em vez de perfeição, contemplou deficiência; em vez de união, separação; em vez de firmeza, [fraquezas]; em vez de [repouso], agitações. Ela [não conseguiu] fazê-los parar de [amar] a agitação, nem pôde [destruí-la]. Estava [inteiramente] sem poder; sua Totalidade e sua [perfeição] a haviam abandonado.


    Aqueles que vieram a existir sem conhecer a si mesmos não conheciam as Plenitudes das quais se originaram, nem a causa de sua existência. Nessa situação instável, a Palavra não conseguiu produzir mais nada semelhante às emanações que habitam na Plenitude, as glórias que existem para a glória do Pai. Em vez disso, produziu […] seres pequenos e fracos, limitados pelas fraquezas que também a restringiam.


    A semelhança que estava sozinha nessa situação havia sido a causa daquelas coisas que, desde o princípio, não causaram a própria existência. Aquele que se encontrava nessa condição deficiente continuou produzindo seres deficientes, até pronunciar juízo e condenar os seres irracionais que havia produzido. Lutou contra eles até serem destruídos, isto é, contra aqueles que haviam resistido à condenação, enquanto a ira os perseguia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éon” é um termo cosmológico para uma realidade ou ser eterno; aqui não significa apenas um período de tempo.
    reason: O empréstimo técnico precisa de explicação para leitores comuns.
  - marker: b
    text: Ou “Verbo” ou “Logos”. O termo funciona aqui como título pessoal.
    reason: Registra alternativas tradicionais sem impor uma identificação teológica específica.
  - marker: c
    text: “Totalidades” e “Totalidade” foram mantidas distintas de “Plenitude”, como no testemunho disponível.
    reason: Evita harmonizar termos cosmológicos que o texto diferencia.
  - marker: d
    text: “Plenitude” traduz o termo cosmológico frequentemente conhecido pela forma grega pleroma.
    reason: Esclarece o sentido técnico sem substituir a tradução pelo empréstimo.
  - marker: e
    text: Ou “sistema”. A expressão parece referir-se à ordem estruturada que ainda viria a existir.
    reason: A palavra do testemunho admite mais de uma nuance contextual.
lexical_decisions:
- source_word: aeon
  choice: éon
  rationale: Mantém o termo cosmológico técnico, em vez de reduzi-lo a “era” ou “eternidade”, sentidos que não identificariam adequadamente os seres descritos.
- source_word: Word
  choice: Palavra
  rationale: Reproduz o título pessoal do testemunho e permanece inteligível; “Verbo” e “Logos” seriam alternativas legítimas, mas mais marcadas pela tradição ou pelo tecnicismo.
- source_word: Totalities / Totality
  choice: Totalidades / Totalidade
  rationale: Preserva a distinção formal entre plural e singular e não a harmoniza com “Plenitude”.
- source_word: Fullness / Fullnesses
  choice: Plenitude / Plenitudes
  rationale: Conserva a terminologia cosmológica e sua alternância entre singular e plural, sem identificar silenciosamente o termo com “Totalidade”.
- source_word: emanations
  choice: emanações
  rationale: Mantém o vocabulário cosmológico técnico e a ideia de realidades procedentes que habitam na Plenitude.
- source_word: system
  choice: ordem
  rationale: No contexto, designa uma estrutura ou ordem cósmica futura; “sistema” seria possível, mas menos natural e excessivamente moderno em português.
- source_word: free will
  choice: livre-arbítrio
  rationale: Expressa a faculdade autônoma de desejar e agir mencionada no contexto, sem resolver como ela se relaciona com a vontade do Pai.
theological_decisions:
- issue: A ação da Palavra é boa ou faltosa
  choice: Preservar simultaneamente a boa intenção, o desejo impossível e sua função no plano de salvação.
  alternative: Classificar a ação simplesmente como pecado, queda ou obediência.
  rationale: O texto sustenta deliberadamente a tensão entre deficiência e providência e adverte contra falar da ação apenas de modo negativo.
- issue: Relação entre a vontade da Palavra e a vontade do Pai
  choice: Manter que a Palavra agiu livremente, mas não à margem da vontade do Pai.
  alternative: Resolver a passagem em predestinação absoluta ou independência absoluta.
  rationale: O testemunho afirma ambas as dimensões e não explica plenamente sua conciliação.
