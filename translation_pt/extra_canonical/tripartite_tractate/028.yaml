base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/028.yaml
  text: 'Concerning the true baptism, into which the Totalities descend and in which they come into being, there is no baptism other than this one. It is redemption in God the Father, the Son, and the Holy Spirit, when faith is professed in those names, [which] are the single name of the gospel, [] when someone has believed that the things told to them are real.


    For someone who believes that they exist, this means receiving, invisibly, the Father, the Son, and the Holy Spirit by testifying with firm faith and understanding them with firm hope. On this basis, attaining what someone has believed could become a return for that person, so that the Father could become one with him—the Father (and) God whom he has professed in faith and who granted that he should be made one with him in knowledge.


    The baptism mentioned earlier is called “the garment <that> those who wear it do not remove,” because it is put on by those who have received redemption. It is also called “the confirmation of the unfailing truth,” since it is unmoving and unshakable, firmly grasping those who have received <restoration> while they firmly grasp it. It is called “silence” because of its quietness and immovability. It is also called “bridal chamber” because of the harmonious and inseparable condition of those [whom] <he has> known <and who> have known him. It is also called [] “the light that does not set and is without flame,” not because it fails to give light, but because those who put it on and those whom it clothes are transformed into light. It is also called “eternal life,” which is deathlessness.


    Thus, whatever it is called, including its names <omitted> here, corresponds to all the beautiful things it contains in a manner that is simple, pleasant, inseparable, intricate, perfect, and unshakable. How, then, can it be named except as the Totality? Even if countless names were assigned to it, they would be spoken simply as a way of referring to it, when in fact it transcends all words, all voices, and all thoughts. It transcends everything, and it transcends all silence. So it is <…> with those who are what it is. This is indeed what it is, possessing a face that cannot be spoken or grasped, glorified by those who possess knowledge through what they have grasped.'
translation:
  language: pt
  text: 'Quanto ao verdadeiro batismo, no qual as Totalidades descem e no qual passam a existir, não há outro batismo além deste. Ele é a redenção em Deus Pai, no Filho e no Espírito Santo, quando se professa a fé nesses nomes, [a]os quais são o único nome do evangelho, […] quando alguém crê que são reais as coisas que lhe foram anunciadas.


    Para quem crê que eles existem, isso significa receber, de maneira invisível, o Pai, o Filho e o Espírito Santo, dando testemunho com fé firme e compreendendo-os com esperança firme. Com base nisso, alcançar aquilo em que alguém creu pode tornar-se, para essa pessoa, um retorno, para que o Pai se torne um com ela — o Pai e Deus que ela confessou na fé e que lhe concedeu tornar-se uma com ele no conhecimento.


    O batismo mencionado anteriormente é chamado “a veste <que> aqueles que a usam não tiram”, porque é vestida pelos que receberam a redenção. Também é chamado “a confirmação da verdade infalível”, pois é imóvel e inabalável: segura firmemente os que receberam a <restauração>, enquanto eles também o seguram com firmeza. É chamado “silêncio” por causa de sua quietude e imobilidade. Também é chamado “câmara nupcial”, por causa da condição harmoniosa e inseparável daqueles [que] <ele conheceu e que> o conheceram. Também é chamado […] “a luz que não se põe e não tem chama”, não porque deixe de iluminar, mas porque aqueles que a vestem e aqueles a quem ela reveste são transformados em luz. Também é chamado “vida eterna”, isto é, imortalidade.


    Assim, tudo aquilo de que é chamado, inclusive os nomes <omitidos> aqui, corresponde a todas as coisas belas que ele contém de modo simples, agradável, inseparável, intricado, perfeito e inabalável. Como, então, poderá ser chamado, senão a Totalidade? Ainda que lhe fossem atribuídos inúmeros nomes, eles seriam pronunciados apenas como uma maneira de se referir a ele, quando, na verdade, ele transcende todas as palavras, todas as vozes e todos os pensamentos; transcende tudo e transcende todo silêncio. Assim é <…> com aqueles que são o que ele é. Isto é, de fato, o que ele é: possui uma face indizível e inapreensível e é glorificado por aqueles que possuem conhecimento mediante aquilo que apreenderam.


    [a] O manuscrito apresenta aqui uma construção incerta; “os quais” pode retomar “nomes”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O manuscrito apresenta aqui uma construção incerta; “os quais” pode retomar “nomes”.
    reason: A marca esclarece a incerteza sintática preservada pelos colchetes do testemunho e evita apresentar a relação entre “nomes” e “nome” como textualmente indiscutível.
lexical_decisions:
- source_word: Totalities / Totality
  choice: Totalidades / Totalidade
  rationale: Preserva a terminologia cosmológica técnica do tratado e a distinção singular/plural, sem substituí-la por uma interpretação explicativa.
- source_word: redemption
  choice: redenção
  rationale: Equivalente teológico direto e corrente em português, preservando o campo semântico de libertação/restauração.
- source_word: bridal chamber
  choice: câmara nupcial
  rationale: Mantém a imagem ritual e relacional do texto; evita o mais doméstico “quarto nupcial”.
- source_word: deathlessness
  choice: imortalidade
  rationale: Expressa naturalmente em português a ausência de morte apresentada como explicação de “vida eterna”.
- source_word: unfailing truth
  choice: verdade infalível
  rationale: Conserva a ideia de uma verdade que não falha, em formulação digna e inteligível.
- source_word: face
  choice: face
  rationale: Mantém a metáfora concreta e enigmática do testemunho, sem reduzi-la a “natureza” ou “aspecto”.
- source_word: grasp / grasped
  choice: segurar / apreender
  rationale: Usa “segurar” na reciprocidade concreta da confirmação e “apreender” no contexto cognitivo final, preservando os sentidos contextuais.
theological_decisions:
- issue: Unidade dos nomes trinitários
  choice: “nesses nomes, os quais são o único nome do evangelho”
  alternative: “nesse nome, que é o nome único do evangelho”
  rationale: Preserva a tensão do plural “nomes” com o singular “nome”, sem harmonizar a formulação.
- issue: União com o Pai
  choice: “para que o Pai se torne um com ela”
  alternative: “para que ela retorne ao Pai”
  rationale: Mantém a linguagem forte de unidade presente no testemunho, sem convertê-la numa formulação teológica mais convencional.
- issue: Pai (e) Deus
  choice: “o Pai e Deus”
  alternative: “o Pai, Deus”
  rationale: Retém os dois títulos, mas evita introduzir parênteses não acompanhados de uma explicação manuscritológica segura; a relação sintática continua aberta.
- issue: Conhecer e ser conhecido
  choice: “daqueles [que] <ele conheceu e que> o conheceram”
  alternative: “daqueles que ele conhece e que o conhecem”
  rationale: Conserva os sinais editoriais e a reciprocidade do conhecimento, sem normalizar o tempo verbal ou apagar a restauração.
- issue: Batismo como realidade transcendente
  choice: Mantido o pronome masculino em referência a “batismo”
  alternative: Alternar a referência para “redenção” ou “Totalidade”
  rationale: A cadeia referencial é ambígua, mas o antecedente gramatical mais estável em português é “batismo”; não se acrescentou uma identificação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se colchetes, sinais angulares e reticências para indicar incerteza, restauração editorial e lacunas. Como a revisão direta do copta está pendente, o texto é um rascunho de publicação fundamentado no testemunho inglês público fornecido; evitaram-se reconstruções além das já sinalizadas.
