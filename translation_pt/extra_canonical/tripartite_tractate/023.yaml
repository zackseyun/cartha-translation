  naturalness: O registro é claro, moderno e adequadamente solene. "Inalcançável"/"alcançado" é compreensível, mas não reproduz com precisão a oposição conceitual entre "ungraspable" e "grasped"; "inapreensível"/"apreendido" conserva melhor essa relação no contexto filosófico-teológico.
  terminology: '"Salvador", "não gerado", "incapaz de sofrer" e "Palavra espiritual" são escolhas defensáveis e não impõem leitura confessional. A terminologia de apreensão foi ajustada para refletir a oposição lexical do testemunho.'
