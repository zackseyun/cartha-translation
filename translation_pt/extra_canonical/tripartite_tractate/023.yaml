base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: pt
  text: 'Os profetas, porém, nada falaram por vontade própria. Em vez disso, cada um falou das coisas que viu e ouviu a respeito da proclamação do Salvador. O que ele proclamava — e o tema central da proclamação deles — era o que cada um dizia a respeito da vinda do Salvador: que ela haveria de acontecer. Às vezes, os profetas falam dela como se ele ainda estivesse por nascer; outras vezes, é como se o Salvador falasse pela boca deles, dizendo que o Salvador virá e concederá favor aos que não o conheceram. Por isso, nem todos disseram tudo da mesma maneira. Antes, segundo o poder dado a cada um para falar a respeito dele e do lugar que viu, cada qual pensava que o Salvador nasceria daquele lugar e de lá viria. Assim, nenhum deles sabia de onde ele viria nem quem o geraria. Somente disto foram considerados dignos de falar: que ele nasceria e sofreria. Quanto à sua preexistência e à sua existência eterna como não gerado e incapaz de sofrer <…> não proveniente da Palavra, que veio a existir
    em carne, [a] isso jamais lhes ocorreu.


    E esta é a mensagem que foram inspirados a transmitir acerca da carne dele que haveria de aparecer. Diz-se que seu nascimento foi como o de todos eles, mas que, acima de tudo, procedeu da Palavra espiritual, a causa das coisas que vieram a existir. Aquele de quem o Salvador recebeu sua carne de fato o gerou em forma de semente, quando a luz foi revelada, em conformidade com a palavra prometida de sua revelação, <sendo> de fato o estado de <uma> semente daquilo <que existia>, embora gerado por último.[b] Contudo, aquele a quem o Pai designou para, por meio dele, manifestar a salvação — aquele que é o cumprimento da promessa —, quando desceu à vida, recebeu todos os meios necessários para sua descida. Seu Pai é um só, o único que verdadeiramente é pai para ele: o invisível e incognoscível, inalcançável por natureza, o único que é Deus e que, por sua vontade e sua dádiva, concedeu que ele pudesse ser visto, conhecido e alcançado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A lacuna e a construção interrompida refletem dano ou incerteza textual no testemunho. A relação sintática de “não proveniente da Palavra” com as expressões ao redor não é segura.
