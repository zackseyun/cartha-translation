    rationale: O testemunho apresenta tanto a elipse entre <…> quanto colchetes vazios [], ambos relevantes para indicar dano ou interrupção textual. A nota pode ser ancorada após o sinal, mas não deve substituí-lo.
  - severity: low
    issue: '"inalcançável por natureza" / "alcançado" não espelha exatamente "ungraspable" / "grasped".'
    rationale: O inglês indica uma oposição de apreensão, não primariamente de alcance. "Inapreensível" e "apreendido" preservam a repetição conceitual, sem resolver a referência ambígua do pronome final.
