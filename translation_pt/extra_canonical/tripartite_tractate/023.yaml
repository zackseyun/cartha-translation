lexical_decisions:
- source_word: Savior
  choice: Salvador
  rationale: Equivalente português natural e tradicional, preservando o título soteriológico sem especificação denominacional.
- source_word: unbegotten
  choice: não gerado
  rationale: Mantém a distinção conceitual entre nascimento e geração; evita interpretar o termo simplesmente como 'eterno'.
- source_word: impassible
  choice: incapaz de sofrer
  rationale: Expressa em linguagem corrente o sentido técnico de não estar sujeito ao sofrimento, sem recorrer ao potencialmente ambíguo 'impassível'.
- source_word: spiritual Word
  choice: Palavra espiritual
  rationale: Preserva a terminologia do testemunho e sua possível carga hipostática, sem substituir 'Palavra' por uma interpretação explicativa.
- source_word: grasped
  choice: alcançado
  rationale: Conserva a progressão 'visto, conhecido e alcançado' e a tensão com 'inalcançável por natureza', sem limitar o verbo à compreensão intelectual.
theological_decisions:
- issue: Alternância entre a vinda como acontecimento e o Salvador como pessoa
  choice: Manter 'dela/ela' para a vinda e 'ele' para o Salvador
  alternative: Uniformizar todas as referências como pessoais
  rationale: Preserva a oscilação do testemunho entre o acontecimento anunciado e a pessoa que vem.
- issue: Relação da expressão danificada 'not from the Word' com o contexto
  choice: Traduzir literalmente como 'não proveniente da Palavra' e assinalar a lacuna
  alternative: Reorganizar a frase para atribuir claramente a origem ou a não origem ao Salvador
  rationale: A passagem está textualmente danificada e sintaticamente incerta; uma resolução silenciosa imporia uma cristologia específica.
- issue: Identidade daquele de quem o Salvador recebeu a carne
  choice: 'Manter a referência indefinida: ''Aquele de quem...'''
  alternative: Identificá-lo como pai humano, progenitor ou Palavra
  rationale: O testemunho não identifica inequivocamente a figura, e a tradução não deve preencher essa ambiguidade.
- issue: Sujeito final que pode ser visto, conhecido e alcançado
  choice: Manter o pronome 'ele' sem explicitação adicional
  alternative: Substituir por 'o Pai' ou 'o Salvador'
  rationale: A cadeia referencial permite tensão interpretativa; a explicitação resolveria uma ambiguidade genuína do texto de base.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A tradução é provisória porque o material fornecido se baseia em um testemunho inglês de domínio público e a revisão direta do copta ainda está pendente. Mantiveram-se os sinais editoriais de dano e restauração; dois colchetes vazios do testemunho foram convertidos em marcador de nota no ponto correspondente para evitar uma marca sem conteúdo.
