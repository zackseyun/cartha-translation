base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/015.yaml
  text: 'And <he> invisibly sowed in him a word that was intended to become knowledge, and he gave him power to move away and to cast away from himself those who disobey him. In this way, he revealed himself to him. But to those who came into being for his sake, he revealed a form beyond their grasp. They therefore behaved with hostility toward one another. <He> suddenly revealed himself to them, drawing near in the form of lightning and departing like a flash of lightning. When finishing their mutual entanglement, he ended it [] through the sudden revelation, for which they were unprepared, were not expecting, and did not know.


    This frightened them, and they fell down because they could not endure the appearance of the light that had struck them. The one who appeared devastated the two orders. Just as the beings of memory <have been> called the Little One, so they have only a dim idea of the Exalted One who exists before them, and they have sown within themselves a feeling of astonishment at the Exalted One who is to be manifested. Therefore, they received his revelation and prostrated themselves before him. They became witnesses who were persuaded of <him>, acknowledging that the light which had appeared was stronger than those who resisted them.


    But those of the likeness became terribly afraid because they could not bear to hear about him in the beginning, that a vision of this kind could exist. Consequently, they plunged into the pit of ignorance called “the Outer Darkness,” “Chaos,” “Death,” and “the Abyss.” He placed them below the order of the beings of memory, given that it was evidently stronger than they were. They were considered worthy to rule over the indescribable darkness because they own it, and it is the lot assigned to them. He granted that they too would be of use in the plan of salvation that was to unfold, [] even that of which <they> were unaware.


    There is a [great] difference between the revelation for the one who came into being, the revelation for the one who was deficient, and the revelation for those who came into being because of him. He revealed himself to him within him because he is with him, sharing in his suffering, gradually giving him repose, causing him to grow, lifting him up, and giving himself to him to enjoy in a vision. But to those who fell outside, he revealed himself suddenly and in a flash. Then he quickly withdrew himself, not allowing them to gaze on him.'
translation:
  language: pt
  text: 'E <ele> semeou nele, invisivelmente, uma palavra destinada a se tornar conhecimento, e lhe deu poder para se afastar e expulsar de si os que lhe desobedecem. Foi assim que se revelou a ele. Àqueles, porém, que vieram a existir por causa dele, revelou uma forma que estava além da compreensão deles. Por isso, eles agiram com hostilidade uns contra os outros. <Ele> se revelou de repente a eles, aproximando-se em forma de relâmpago e partindo como um clarão. Ao pôr fim ao envolvimento mútuo deles, desfez-o [] por meio da súbita revelação, para a qual não estavam preparados, que não esperavam e que não conheciam.


    Isso os aterrorizou, e eles caíram, pois não conseguiram suportar a aparição da luz que os atingira. Aquele que apareceu devastou as duas ordens. Assim como os seres da memória <foram> chamados de Pequeno, também eles têm apenas uma vaga noção do Excelso que existe antes deles e semearam dentro de si um sentimento de assombro diante do Excelso que haverá de se manifestar. Por isso, receberam sua revelação e se prostraram diante dele. Tornaram-se testemunhas convencidas a respeito <dele>, reconhecendo que a luz que aparecera era mais forte do que aqueles que lhes resistiam.


    Mas os da semelhança ficaram terrivelmente amedrontados, pois, desde o princípio, não conseguiam suportar ouvir falar dele — que pudesse existir uma visão dessa espécie. Por isso, mergulharam no abismo da ignorância chamado “Trevas Exteriores”, “Caos”, “Morte” e “Abismo”. Ele os colocou abaixo da ordem dos seres da memória, visto que esta era evidentemente mais forte do que eles. Foram considerados dignos de governar sobre as trevas indescritíveis, porque elas lhes pertencem e são a porção que lhes foi designada. Ele concedeu que também eles fossem úteis no plano de salvação que haveria de se desenrolar, [] até mesmo naquele do qual <eles> não tinham consciência.


    Há uma [grande] diferença entre a revelação para aquele que veio a existir, a revelação para aquele que era deficiente e a revelação para os que vieram a existir por causa dele. Ele se revelou a ele dentro dele, porque está com ele, participa de seu sofrimento, concede-lhe repouso pouco a pouco, faz com que cresça, ergue-o e entrega-se a ele para que o desfrute numa visão. Àqueles, porém, que caíram do lado de fora, revelou-se de repente e num clarão. Depois, retirou-se rapidamente, sem lhes permitir contemplá-lo.'
