    rationale: O testemunho traz “even that of which <they> were unaware” após uma lacuna ([]), sem estabelecer de modo seguro que o antecedente seja especificamente “o plano”. “Mesmo no que <eles> ignoravam” preserva a abertura sintática e semântica.
  - severity: low
    issue: “caíram do lado de fora” é pouco idiomático e enfraquece o movimento expresso por “fell outside”.
    rationale: “Caíram fora” é uma formulação portuguesa mais direta, conserva a imagem de queda e evita acrescentar a noção espacial estática de “do lado de fora”.
