  naturalness: O registro é geralmente claro e digno. Foram ajustadas construções menos naturais ou levemente opacas, sobretudo «expulsar de si», a formulação sobre a designação «Pequeno», e «caíram do lado de fora».
  terminology: 'Os termos técnicos e potencialmente técnicos foram mantidos de forma conservadora: «palavra», «conhecimento», «seres da memória», «Excelso», «semelhança», «repouso», «ordens» e «plano de salvação». Não se introduz identificação doutrinária para os referentes.'
  issues:
  - severity: medium
    issue: «expulsar de si os que lhe desobedecem»
    rationale: «Expulsar» tende a sugerir expulsão de um lugar ou domínio e é mais forte que o testemunho, que repete a ideia de afastar/lançar para longe de si. «Afastar de si» preserva melhor a formulação sem especificar o mecanismo.
  - severity: low
    issue: Paralelismo em «Assim como ... foram chamados de Pequeno, também eles têm...»
    rationale: A redação pode ser tornada mais direta e inteligível sem alterar a relação comparativa incomum do testemunho. Aspas em «Pequeno» também ajudam a marcar a designação preservada.
  - severity: low
    issue: «caíram do lado de fora»
    rationale: A expressão soa excessivamente literal e pouco idiomática em português. «Caíram fora» conserva a imagem espacial e a categoria sem acrescentar uma interpretação cosmológica.
