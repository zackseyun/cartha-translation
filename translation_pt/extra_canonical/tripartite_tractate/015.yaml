  naturalness: O registro é moderno, sóbrio e amplamente legível. A revisão pontual melhora a fluidez de “mesmo no que eles ignoravam” e de “caíram fora”, sem eliminar a estranheza conceitual inerente ao tratado.
  terminology: “palavra”, “conhecimento”, “seres da memória”, “Excelso”, “semelhança”, “repouso”, “ordens” e “plano de salvação” são escolhas conservadoras e adequadas. “Pequeno” e “Excelso” mantêm a função titulativa sem identificação doutrinal adicional.
