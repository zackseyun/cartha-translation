lexical_decisions:
- source_word: word
  choice: palavra
  rationale: Preserva o termo conceitual do testemunho sem identificá-lo automaticamente com um título cristológico.
- source_word: knowledge
  choice: conhecimento
  rationale: Mantém o sentido epistemológico e a terminologia característica do tratado.
- source_word: beings of memory
  choice: seres da memória
  rationale: Tradução formal que conserva a categoria técnica, cuja identificação permanece incerta sem revisão do copta.
- source_word: the Exalted One
  choice: o Excelso
  rationale: Forma substantivada, digna e concisa, que preserva o título sem acrescentar identificação teológica.
- source_word: those of the likeness
  choice: os da semelhança
  rationale: Mantém a expressão classificatória e sua possível natureza técnica, sem explicitação conjectural.
- source_word: repose
  choice: repouso
  rationale: Conserva a carga conceitual do termo em vez de reduzi-lo a simples descanso físico.
- source_word: plan of salvation
  choice: plano de salvação
  rationale: Expressão natural em português que preserva a dimensão soteriológica do testemunho.
- source_word: orders
  choice: ordens
  rationale: Preserva a designação de agrupamentos ou níveis sem especificar uma cosmologia além do texto.
theological_decisions:
- issue: Identidade dos referentes pronominais masculinos
  choice: Preservar a sequência de pronomes do testemunho, inclusive onde o referente não é explícito.
  alternative: Substituir os pronomes por títulos ou nomes interpretativos.
  rationale: A passagem depende de antecedentes contextuais não fornecidos e a tradução não deve resolver silenciosamente a ambiguidade.
- issue: A palavra semeada
  choice: Traduzir como “uma palavra”, em minúscula.
  alternative: Empregar “o Verbo” ou capitalizar “Palavra”.
  rationale: O testemunho não exige aqui a identificação direta com o Logos cristológico.
- issue: Utilidade dos seres ignorantes no plano salvífico
  choice: Manter que também eles seriam úteis no plano de salvação.
  alternative: Atenuar para mera permissão ou excluir a participação deles.
  rationale: Preserva a tensão teológica explícita do texto sem harmonização denominacional.
- issue: Diferenças entre três modos de revelação
  choice: Conservar as três categorias em paralelo.
  alternative: Fundir “aquele que veio a existir” com “aquele que era deficiente”.
  rationale: A sintaxe distingue os destinatários, ainda que suas identidades não estejam plenamente claras neste recorte.
- issue: “Compartilhando seu sofrimento”
  choice: Traduzir como “participa de seu sofrimento”.
  alternative: Interpretar como sofrer vicariamente por ele ou apenas compadecer-se dele.
  rationale: Mantém aberta a natureza da participação no sofrimento.
translation_notes:
  register: Português moderno, digno e amplamente legível, com preferência por construções naturais no Brasil sem regionalismos marcados. Os sinais editoriais < >, [ ] e [] foram preservados exatamente como indicadores de restauração, incerteza ou lacuna no testemunho fornecido. Como a revisão direta do copta está pendente, termos possivelmente técnicos foram vertidos de modo conservador, sem notas conjecturais.
