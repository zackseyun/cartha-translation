translation:
  language: pt
  text: 'O Pai o conhecia de antemão, pois, antes que qualquer outra coisa existisse, ele habitava em seus pensamentos, nos quais o Pai também possuía aqueles por cuja causa o revelou. Ele colocou a deficiência sobre aquilo que perdura durante períodos passageiros, para a glória de sua Plenitude. O fato de ser desconhecido o levou a manifestar sua bondade [dando conhecimento de si mesmo].[a]


    Desse modo, ele obteve conhecimento a respeito dele como manifestação de sua benevolência e revelação da riqueza de sua doçura, que é a segunda glória.[b] Assim, ele também se manifestou como causa da ignorância, embora produza conhecimento: uma sabedoria oculta e inapreensível, na qual preserva o conhecimento até o fim, quando as Totalidades tiverem se esgotado em sua busca por Deus, o Pai, a quem ninguém descobriu por sua própria sabedoria ou poder. Ele se digna a conceder-lhes o conhecimento do grande dom do pensamento excelente, por meio de incessante ação de graças a ele.[c] Conforme seu conselho inabalável, ele se revela eternamente àqueles que, por sua vontade, foram considerados dignos do conhecimento do Pai, que por natureza não pode ser conhecido e que, em sua presciência, planejou que eles pudessem obter conhecimento e todo bem que o acompanha, juntamente com a experiência da ignorância e de suas dores.


    Desse modo, eles viriam a experimentar coisas más e poderiam exercitar-se por meio delas [...] por algum tempo, para que pudessem obter o [desfrute das coisas boas] por toda a eternidade.[d] Eles se expõem e são constantemente rejeitados e caluniados por seus inimigos, considerando isso um adorno e uma marca maravilhosa das realidades sublimes. Isso aconteceu para deixar claro que a ignorância dos que desconhecem o Pai era obra deles próprios, em contraste com o poder dele, que lhes tornou possível obter conhecimento a seu respeito.


    Esse conhecimento é apropriadamente chamado de “o conhecimento de todo pensamento possível” e “o tesouro”. E, para aumentar ainda mais o conhecimento, ele é a revelação daqueles que eram conhecidos desde o princípio; é também o caminho para a união e aquele que preexiste.[e] O resultado é que os que crescem em grandeza são os que abandonaram a grandeza que lhes fora designada no plano de salvação, segundo a vontade divina, para que o fim pudesse ser como o princípio.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês fornecido; a revisão direta do copta do Códice de Nag Hammadi I,5 ainda está pendente. As palavras entre colchetes representam restauração editorial.
    reason: Registra a limitação da base documental e explica o sinal de restauração sem misturá-lo ao texto.
  - marker: b
    text: Os referentes de “ele” e “dele” são ambíguos no testemunho disponível; a tradução não os identifica de modo conclusivo.
    reason: Evita atribuir silenciosamente os pronomes ao Pai, ao revelado ou a outra figura.
  - marker: c
    text: A construção traduzida por “por meio de incessante ação de graças a ele” é sintaticamente difícil e pode admitir outra ligação com a frase.
    reason: Sinaliza uma ambiguidade estrutural relevante no testemunho-base.
  - marker: d
    text: As reticências entre colchetes indicam uma lacuna, e “[desfrute das coisas boas]” é uma restauração editorial.
    reason: Preserva e explica os sinais de dano manuscrito e reconstrução.
  - marker: e
    text: “Aquele que preexiste” também pode ser entendido como “o preexistente”; o referente não é especificado no testemunho disponível.
    reason: Mantém aberta a função nominal ou titulária da expressão.
  - marker: f
    text: A frase sobre abandonar a grandeza designada é paradoxal e pode refletir dificuldade textual ou tradutória; foi preservada sem emenda conjectural.
    reason: Impede que uma passagem obscura seja harmonizada ou corrigida sem análise da fonte copta.
lexical_decisions:
- source_word: Fullness
  choice: Plenitude
  rationale: Preserva o provável termo técnico do tratado e sua personificação por meio da inicial maiúscula, sem substituí-lo por uma explicação doutrinária.
- source_word: the Totalities
  choice: as Totalidades
  rationale: Mantém o plural abstrato e técnico do testemunho, evitando reduzi-lo a “todas as coisas” e apagar sua possível função cosmológica.
- source_word: sweetness
  choice: doçura
  rationale: Conserva a metáfora sensorial e afetiva do texto, em vez de normalizá-la como “bondade” ou “graça”.
- source_word: unshakable counsel
  choice: conselho inabalável
  rationale: Reproduz a ideia de deliberação ou propósito firme sem escolher entre leituras sistemáticas como decreto, desígnio ou providência.
- source_word: foreknowledge
  choice: presciência
  rationale: Termo português corrente em registro teológico e filosófico, correspondente ao conhecimento antecipado sem acrescentar determinismo.
- source_word: union
  choice: união
  rationale: Mantém a formulação abstrata e não especifica a natureza da união além do que o testemunho permite.
- source_word: plan of salvation
  choice: plano de salvação
  rationale: Tradução transparente e legível que preserva o sentido teleológico sem importar terminologia denominacional.
theological_decisions:
- issue: Referentes dos pronomes masculinos no primeiro e no segundo parágrafos
  choice: Preservar, tanto quanto o português permite, a alternância ambígua entre “ele”, “o” e “dele”, explicitando “o Pai” apenas uma vez para evitar uma construção ininteligível.
  alternative: Identificar sistematicamente cada pronome com o Pai, o Filho ou outro referente cosmológico.
  rationale: O testemunho fornecido é ambíguo e a revisão direta do copta ainda está pendente; uma identificação uniforme resolveria indevidamente uma tensão textual genuína.
- issue: Deus como “causa da ignorância” e produtor do conhecimento
  choice: Manter as duas afirmações em tensão.
  alternative: Atenuar para “ocasião da ignorância” ou explicar que Deus apenas permitiu a ignorância.
  rationale: A formulação paradoxal faz parte do argumento do texto e não deve ser harmonizada com uma teodiceia externa.
- issue: O Pai incognoscível que concede conhecimento de si
  choice: Traduzir simultaneamente “por natureza não pode ser conhecido” e a concessão do conhecimento do Pai.
  alternative: Distinguir explicitamente conhecimento da essência e conhecimento revelado.
  rationale: Essa distinção pode ser plausível, mas não deve ser inserida sem apoio explícito no segmento.
- issue: Responsabilidade pela ignorância
  choice: Manter que a ignorância era “obra deles próprios”, contrastada com o poder divino de conceder conhecimento.
  alternative: Reformular como culpa moral, livre-arbítrio técnico ou predestinação.
  rationale: A tradução conserva a atribuição de responsabilidade sem convertê-la em uma doutrina sistemática específica.
- issue: Abandono da grandeza designada no plano de salvação
  choice: Manter a afirmação difícil de que os que crescem em grandeza abandonaram a grandeza que lhes fora designada.
  alternative: Emendar o sentido para “receberam” ou “alcançaram” a grandeza designada.
  rationale: Embora paradoxal, a leitura segue o testemunho fornecido e não deve ser corrigida conjecturalmente antes da revisão do copta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se termos técnicos como “Plenitude” e “Totalidades”, as metáforas de “doçura” e “tesouro”, os paradoxos teológicos e os sinais de restauração ou lacuna. A sintaxe foi moderadamente reorganizada para fluência, mas não se resolveram pronomes ambíguos nem dificuldades textuais por meio de expansão doutrinária.
