  text: 'Mary asked him, “Holy Lord, where did your disciples come from, where are they going, and how should they act here?”


    The perfect Savior said to them, “I want you to know that Sophia, the Mother of the World and the consort, wanted by herself, without her male counterpart, to bring these into existence. However, by the will of the Father of the World, so that his ungraspable benevolence could be manifested, he created the curtain between the immortals and those that arrived thereafter, so that the result could follow that [ . . . ]


    (Coptic pages 115-116 missing)


    [] “[. . .] and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory, and [honor and] the gift of [the Father of the World].


    “[Consequently], whoever knows [the Father in perfect] knowledge [will go] to the Father [and repose in] the unbegotten [Father]. However, [whoever knows him imperfectly] will go [to the deficiency] and the repose [of the Ogdoad].


    “[Now], whoever silently knows the immortal [Spirit] of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of [] the Son of Man, he can go to the dwelling-places of those in the Ogdoad.”'
translation:
  language: pt
  text: 'Maria lhe perguntou: “Santo Senhor, de onde vieram os teus discípulos, para onde vão e como devem agir aqui?”


    O Salvador perfeito lhes disse: “Quero que saibam que Sofia, a Mãe do Mundo e a consorte,[a] quis, por si mesma e sem sua contraparte masculina, trazer estes à existência. Contudo, pela vontade do Pai do Mundo, para que sua benevolência insondável pudesse se manifestar, ele criou a cortina entre os imortais e os que vieram depois, para que o resultado se seguisse: [ . . . ]


    (Faltam as páginas coptas 115–116)[b]


    [] “[. . .] e sopro, e pudessem, de dois, tornar-se um, assim como era desde o princípio, para que vocês pudessem produzir muito fruto e subir até Aquele que É desde o princípio, em alegria e glória inexprimíveis, e [honra e] o dom do [Pai do Mundo].


    “[Por conseguinte], quem conhece [o Pai com conhecimento perfeito] [irá] ao Pai e [repousará no] [Pai] não gerado. No entanto, [quem o conhece de modo imperfeito] irá [para a deficiência] e para o repouso [da Ogdóade].[c]


    “[Agora], quem conhece silenciosamente o [Espírito] imortal de luz, refletindo e concordando com a verdade, se me der sinais do Invisível, se tornará luz no Espírito silencioso. Quem conhece o Filho do Homem com conhecimento e amor, se me der um sinal de [] o Filho do Homem, poderá ir para as moradas dos que estão na Ogdóade.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Consorte” indica aqui uma figura emparelhada ou associada; o texto também menciona sua “contraparte masculina”.
    reason: Esclarecer um termo cosmológico incomum sem decidir a natureza exata da relação.
  - marker: b
    text: 'O manuscrito apresenta uma grande lacuna neste ponto: faltam as páginas coptas 115–116. Colchetes e reticências no restante do trecho assinalam perdas, lacunas ou restaurações editoriais do testemunho utilizado.'
    reason: Informar a interrupção material e explicar os sinais editoriais preservados na tradução.
  - marker: c
    text: “Ogdóade” significa literalmente um conjunto de oito e, neste escrito, designa um domínio ou ordem cosmológica.
    reason: Tornar compreensível um termo técnico sem lhe impor uma interpretação denominacional.
lexical_decisions:
- source_word: Sophia
  choice: Sofia
  rationale: Adota a forma portuguesa tradicional do nome grego, preservando-o como figura personificada e não o traduzindo simplesmente por “Sabedoria”.
- source_word: consort
  choice: consorte
  rationale: Mantém a ideia cosmológica de par associado sem impor a noção mais específica de esposa.
- source_word: male (counterpart)
  choice: contraparte masculina
  rationale: Explicita a relação de pareamento presente no testemunho e evita reduzir o termo a “marido”.
- source_word: curtain
  choice: cortina
  rationale: Preserva a imagem concreta do testemunho; “véu” seria possível, mas poderia acrescentar ressonâncias religiosas não exigidas.
- source_word: ungraspable benevolence
  choice: benevolência insondável
  rationale: Expressa algo que não pode ser plenamente apreendido, em português natural e digno.
- source_word: repose
  choice: repouso / repousará
  rationale: Conserva o sentido de descanso ou estado de repouso, sem interpretá-lo como salvação, morte ou absorção.
- source_word: Ogdoad
  choice: Ogdóade
  rationale: Emprega o termo técnico português para o domínio ou conjunto de oito referido pela cosmologia do escrito.
- source_word: He Who Is from the beginning
  choice: Aquele que É desde o princípio
  rationale: Preserva a formulação titulativa e sua ambiguidade ontológica, com maiúscula em “É” para sinalizar o caráter nominal da expressão.
theological_decisions:
- issue: A atuação solitária de Sofia
  choice: “quis, por si mesma e sem sua contraparte masculina, trazer estes à existência”
  alternative: “criou-os sozinha, sem marido”
  rationale: A redação escolhida mantém a volição e a expressão indireta “trazer à existência”, sem transformar a consorte em esposa nem resolver a referência ambígua de “estes”.
- issue: Identidade do Pai do Mundo
  choice: Manter “Pai do Mundo” sem identificação adicional
  alternative: Identificá-lo com uma figura cosmológica específica
  rationale: O fragmento fornecido não autoriza identificar explicitamente essa figura com Yaldabaoth ou com outra entidade.
- issue: Destino de quem conhece imperfeitamente
  choice: “irá para a deficiência e para o repouso da Ogdóade”
  alternative: Interpretar a deficiência como condenação ou a Ogdóade como salvação
  rationale: Preserva a tensão do texto e não impõe uma avaliação doutrinária ausente do testemunho.
- issue: Conhecer silenciosamente o Espírito
  choice: Preservar “conhece silenciosamente” e “Espírito silencioso”
  alternative: Parafrasear como conhecimento místico ou contemplação
  rationale: Mantém a repetição e a possível linguagem técnica sem explicá-la por uma tradição específica.
- issue: “sinais” do Invisível e do Filho do Homem
  choice: Manter “sinais”
  alternative: Traduzir como provas, marcas, sacramentos ou senhas
  rationale: A evidência fornecida não permite escolher entre esses sentidos possíveis.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução é provisória porque se baseia no testemunho inglês público fornecido, estando pendente a revisão direta do copta. Mantiveram-se os colchetes, as reticências e construções fragmentárias onde refletem dano manuscrito ou restauração editorial; não se tentou reconstruir as páginas ausentes. O pronome ambíguo em “trazer estes à existência” foi preservado, embora seja pouco idiomático, para evitar inventar um referente.
