  language: pt
  text: 'Então Tomé lhe perguntou: “Senhor, Salvador, quantos éons[a] estão acima dos céus?”


    O Salvador perfeito disse: “Eu o louvo por perguntar a respeito dos grandes éons, pois suas raízes habitam nas infinitudes. Quando aqueles de quem falei antes foram revelados, ele [proveu...]


    (Faltam as páginas 109 e 110 do manuscrito copta.)[b]


    “[...] [] e chegam a uma unidade, nós os chamamos de ‘Assembleia da Ogdóade’.[c] Ela se manifestou como andrógina e foi designada em parte masculina e em parte feminina. A parte masculina é chamada ‘Assembleia’, enquanto a feminina é chamada ‘Vida’, para que se demonstrasse que a vida de todos os éons veio de uma figura feminina.


    “E todos os nomes foram recebidos do princípio originador. Isso aconteceu porque, da harmonia dele com seu pensamento, surgiram muito rapidamente os poderes chamados ‘deuses’; e, com base em sua sabedoria, [os] deuses dos deuses revelaram deuses, <e os deuses>, com base em sua sabedoria, revelaram senhores. Os senhores dos senhores, com base em seus atos de pensamento, revelaram senhores; e os senhores, com base em seu poder, revelaram arcanjos. Os arcanjos, com base em suas palavras, revelaram anjos, [] simulacros que surgiram deles, dotados de estrutura, forma e nome para todos os éons e seus mundos.


    “E todos os imortais que acabo de descrever exercem autoridade proveniente do Humano Imortal,[d] que é chamado ‘Silêncio’, pois, quando eles contemplaram em silêncio, sem fala exterior, a majestade que pertence a ela foi levada à plenitude. Como os indestrutíveis possuíam autoridade, cada um criou um grande reino na Ogdóade, bem como tronos, templos e firmamentos para suas respectivas majestades, pois todos eles vieram a existir pela vontade da Mãe do Mundo.”


    Então os santos apóstolos lhe disseram: “Senhor, Salvador, fale-nos daqueles que habitam nos éons, pois precisamos indagar a respeito deles.”


    O Salvador perfeito [] disse: “Vocês podem perguntar sobre qualquer coisa, e eu lhes darei a resposta.


    “Eles criaram hostes de anjos — incontáveis miríades — para o serviço e para a glória deles. Criaram espíritos virginais, as luzes inexprimíveis e inabaláveis, pois não experimentam enfermidade nem fraqueza; ao contrário, manifestam vontade.


    “Foi assim que os éons rapidamente chegaram à plenitude, juntamente com os céus e os firmamentos, na glória do Humano Imortal e de sua consorte, Sofia.[e] De lá, todos os éons e mundos, bem como os que vieram depois, receberam o modelo para criar suas semelhanças, tanto nos céus do caos como em seus mundos. E toda natureza, a partir da revelação do caos, habita na luz sem sombra, em alegria indescritível e em júbilo inexprimível. Eles desfrutam continuamente de sua glória, que nunca se apaga, [] e de seu repouso infinito, que é indescritível entre todos os éons e todos os poderes deles que vieram a existir depois. Tudo o que agora lhes contei, eu disse para que vocês brilhassem na luz ainda mais do que estes.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éons” são realidades da cosmologia deste escrito; conforme o contexto, o termo pode envolver dimensões de seres, domínios celestes ou eras. A tradução mantém o termo técnico para não eliminar essa amplitude.
    reason: Esclarecer um termo cosmológico incomum sem resolver sua polissemia.
  - marker: b
    text: 'Neste ponto há uma grande lacuna material: faltam duas páginas do códice copta. Os colchetes, reticências e sinais semelhantes no restante do texto indicam outras perdas, incertezas ou restaurações editoriais do testemunho fornecido.'
    reason: Distinguir a lacuna manuscrita do fluxo normal da composição e explicar os sinais textuais preservados.
  - marker: c
    text: “Ogdóade” significa literalmente um conjunto de oito e, aqui, designa uma assembleia ou âmbito cosmológico.
    reason: Auxiliar leitores não familiarizados com o vocabulário técnico.
  - marker: d
    text: O título também pode ser vertido como “Ser Humano Imortal”. A expressão é mantida sem identificar automaticamente essa figura com outra personagem teológica.
    reason: Preservar a amplitude do título e evitar uma identificação doutrinária não expressa.
  - marker: e
    text: “Sofia” é a forma portuguesa do nome grego que significa “Sabedoria”; neste trecho, ela aparece como a consorte do Humano Imortal.
    reason: Explicar o sentido do nome sem substituí-lo no corpo do texto.
lexical_decisions:
- source_word: aeons
  choice: éons
  rationale: Mantém o termo cosmológico técnico, já corrente em português em estudos de textos gnósticos, sem reduzi-lo a ‘eras’ nem identificar automaticamente seres, regiões e períodos.
- source_word: Assembly of the Ogdoad
  choice: Assembleia da Ogdóade
  rationale: ‘Assembleia’ preserva a personificação coletiva; ‘Ogdóade’ conserva o termo técnico referente ao conjunto ou âmbito de oito.
- source_word: simulacra
  choice: simulacros
  rationale: Preserva a ideia de representações ou formas derivadas e evita suavizar o termo para simples ‘semelhanças’.
- source_word: Immortal Human
  choice: Humano Imortal
  rationale: ‘Humano’ conserva a amplitude antropológica do título e evita impor sexo masculino onde o contexto também emprega referência pronominal feminina.
- source_word: Silence
  choice: Silêncio
  rationale: Mantido como nome ou título personificado, com inicial maiúscula.
- source_word: consort
  choice: consorte
  rationale: Expressa a relação pareada de Sofia com o Humano Imortal sem acrescentar a noção especificamente matrimonial de ‘esposa’.
- source_word: Sophia
  choice: Sofia
  rationale: Adota a forma portuguesa tradicional do nome e preserva sua função como figura nomeada, sem traduzi-la silenciosamente por ‘Sabedoria’.
- source_word: firmaments
  choice: firmamentos
  rationale: Mantém a linguagem cosmológica antiga e sua distinção em relação aos céus.
theological_decisions:
- issue: Linguagem andrógina e origem feminina da vida dos éons
  choice: Preservar explicitamente ‘andrógina’, ‘masculina’, ‘feminina’ e ‘veio de uma figura feminina’
  alternative: Neutralizar a linguagem de gênero ou interpretá-la como mera metáfora
  rationale: O contraste é constitutivo da cosmologia do trecho e não deve ser harmonizado com sistemas teológicos posteriores.
- issue: Oscilação de gênero em torno do Humano Imortal/Silêncio
  choice: Manter ‘Humano Imortal’ e a referência feminina em ‘a majestade que pertence a ela’
  alternative: Uniformizar todos os pronomes no masculino ou no feminino
  rationale: A aparente tensão está no testemunho fornecido e pode refletir a estrutura andrógina ou uma dificuldade textual; a tradução não a resolve silenciosamente.
- issue: Agência criadora de deuses, senhores, arcanjos e anjos
  choice: Traduzir repetidamente ‘revelaram’ e ‘criaram’ conforme o testemunho
  alternative: Substituir por ‘emanaram’, ‘geraram’ ou outra terminologia sistemática
  rationale: Evita importar um esquema emanacionista mais definido do que a redação disponível permite.
- issue: Referente de ‘estes’ na frase final
  choice: Manter o demonstrativo sem explicitar seu referente
  alternative: Identificá-lo como os éons, poderes ou habitantes celestes
  rationale: O antecedente é ambíguo no contexto e deve permanecer assim.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “vocês” no discurso dirigido ao grupo apostólico. A redação segue provisoriamente o testemunho inglês público fornecido, pois a revisão direta do copta ainda está pendente. Foram preservados os sinais de dano e restauração textual — [...], [], <...> — e a ruptura causada pelas páginas ausentes. Termos cosmológicos técnicos foram mantidos quando uma paráfrase reduziria a ambiguidade do texto.
