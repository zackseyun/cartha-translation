translation:
  language: pt
  text: 'Seus discípulos tornaram a perguntar:


    — Dize-nos claramente como eles desceram das realidades invisíveis, daquilo que é imortal, para o mundo da mortalidade.


    O Salvador perfeito disse:


    — O Filho do Homem uniu-se à sua companheira, Sofia, e manifestou uma poderosa luz andrógina. Seu nome masculino é “Salvador, Gerador de Tudo”; seu nome feminino é “Sofia, Geradora de Tudo”, e alguns a chamam “Pístis”.[a]


    — Como [—] uma gota da luz,[b] todo aquele que entra no mundo é enviado por ele ao mundo do Todo-Poderoso, para que seja vigiado por ele. E, pela vontade de Sofia, o grilhão do esquecimento dele prendeu a luz, a fim de que, por esse meio, o que sucedera pudesse ser revelado[c] a todo o mundo empobrecido: isto é, o orgulho e a cegueira do Todo-Poderoso e a ignorância que lhe deu esse nome.


    — Eu, porém, pela vontade da grande Luz, vim a existir nas regiões do alto, libertando-me[d] daquele grilhão e fazendo cessar a atividade dos ladrões. Despertei aquela gota enviada por Sofia, para que, por meu intermédio, ela produzisse muito fruto, alcançasse a perfeição e nunca mais se tornasse deficiente; mas para que, por meu intermédio, o Grande Salvador, ela fosse unida,[e] de modo que a glória dele se manifestasse e Sofia também fosse corrigida daquela deficiência; para que seus [—] filhos[f] nunca mais se tornassem deficientes, mas recebessem honra e glória, subissem até seu Pai e compreendessem a palavra da Luz masculina.


    — E vocês foram enviados pelo Filho, o qual também foi enviado, para que recebessem luz e se separassem do esquecimento dos poderes. Assim, isso nunca mais se manifestaria por causa de vocês — isto é, a fricção impura que se origina do fogo terrível que saiu do falo deles. Pisem sobre a má intenção deles.'
  philosophy: optimal-equivalence
