lexical_decisions:
- source_word: Sophia
  choice: Sofia
  rationale: Mantém o nome personificado em sua forma portuguesa tradicional, sem reduzi-lo simplesmente ao substantivo comum “sabedoria”.
- source_word: Pistis
  choice: Pístis
  rationale: Preserva como nome ou título a forma grega transmitida no testemunho, evitando resolver se deve ser entendida apenas como “fé”.
- source_word: androgynous light
  choice: luz andrógina
  rationale: Conserva a linguagem técnica e a dupla designação masculina e feminina do texto.
- source_word: All-Begetter
  choice: Gerador de Tudo / Geradora de Tudo
  rationale: Reproduz o sentido generativo e marca o contraste gramatical entre os nomes masculino e feminino.
- source_word: invisibilities
  choice: realidades invisíveis
  rationale: Expressa o plural substantivado de modo inteligível sem o reduzir ao singular “mundo invisível”.
- source_word: authorities
  choice: poderes
  rationale: Usa um termo claro que pode designar entidades governantes, sem impor a terminologia confessional “potestades”.
- source_word: impure rubbing
  choice: fricção impura
  rationale: Preserva a formulação corporal incomum e difícil do testemunho, sem eufemismo nem interpretação adicional.
- source_word: phallus
  choice: falo
  rationale: Traduz diretamente o termo anatômico e simbólico, mantendo o registro solene do trecho.
theological_decisions:
- issue: Identidade e avaliação do “Todo-Poderoso”
  choice: Preservar a designação e atribuir-lhe orgulho e cegueira conforme a sintaxe do testemunho
  alternative: Identificá-lo explicitamente com Deus, um demiurgo ou outra figura teológica
  rationale: O trecho não fornece aqui uma identificação inequívoca; explicitá-la importaria uma interpretação doutrinária.
- issue: Referentes dos pronomes masculinos em “por ele” e “dele”
  choice: Manter os pronomes sem substituir por nomes próprios
  alternative: Explicitar “Filho do Homem”, “Todo-Poderoso” ou outra figura em cada ocorrência
  rationale: Os antecedentes são potencialmente ambíguos no testemunho fornecido, e a tradução não deve resolver silenciosamente essa tensão.
- issue: Natureza da união do Filho do Homem com Sofia
  choice: “uniu-se à sua companheira”
  alternative: Interpretar explicitamente como casamento, relação sexual ou união puramente espiritual
  rationale: A formulação mantém a proximidade relacional do original testemunhado sem definir a modalidade da união.
- issue: Salvação como perfeição, união e correção da deficiência
  choice: Conservar a sequência conceitual do texto
  alternative: Reformular em categorias soteriológicas confessionais mais familiares
  rationale: A cosmologia e a linguagem próprias da obra devem permanecer visíveis, sem harmonização com sistemas posteriores.
- issue: Ação final contra os poderes
  choice: “Pisem sobre a má intenção deles”
  alternative: Converter em ordem para destruir seres ou interpretar apenas como metáfora psicológica
  rationale: A tradução mantém o objeto da ordem como a intenção maligna, conforme o testemunho, sem ampliar seu alcance.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A fala de Jesus usa “vocês”, mas mantém “Dize-nos” na fala coletiva dos discípulos para conservar solenidade sem arcaísmo excessivo. Termos cosmológicos incomuns foram preservados em vez de normalizados. Esta é uma versão provisória baseada no testemunho inglês de domínio público fornecido; a revisão direta do copta dos códices de Nag Hammadi III,4 e Berlim 8502,3 continua pendente.
