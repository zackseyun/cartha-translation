  text: 'Matthew said [] to him, “Lord, no one can discover the truth except through you, so teach us the truth.”


    The Savior said, “He Who Is cannot be expressed. No power knew him, no authority, nothing contingent, nor anything created from the foundation of the world until now, but he alone and any to whom he wishes to grant revelation through the one who originated from the First Light. From this point on, I am the Great Savior. This is because he is deathless and eternal.


    “He is eternal, without birth, because anyone who has been born will be destroyed (in death). He is unbegotten, without beginning, because anyone who had a beginning will have an end. Because no one rules over him, he is nameless, since anyone with a name has been created by someone else. And He Who Is has an appearance uniquely his own, [] unlike anything you have seen and understood. Yet it is an enigmatic appearance that transcends everything and surpasses the world. It gazes in every direction (simultaneously) and beholds itself from itself.


    “Because it is infinite, he can never be comprehended.

    He is forever indestructible, with nothing resembling him.

    He is the good that never changes.

    He is without defect.

    He is eternal.

    He is blessed.

    He cannot be known, but he knows himself.

    He is beyond measure; he cannot be traced out.

    He is perfect, without imperfection.

    His blessedness is indestructible.

    He is called ‘Father of the World.’”'
translation:
  language: pt
  text: 'Mateus lhe disse: “Senhor, ninguém pode descobrir a verdade senão por meio de ti; portanto, ensina-nos a verdade.”[a]


    O Salvador disse: “Aquele que É não pode ser expresso. Nenhum poder o conheceu, nenhuma autoridade, nada contingente, nem coisa alguma criada desde a fundação do mundo até agora — somente ele e aqueles a quem ele deseja conceder revelação por meio daquele que teve origem na Primeira Luz. A partir de agora, eu sou o Grande Salvador. Isso se deve ao fato de ele ser imortal e eterno.


    “Ele é eterno, sem nascimento, pois todo aquele que nasceu será destruído na morte. Ele é não gerado, sem princípio, pois todo aquele que teve princípio terá fim. Como ninguém o governa, ele não tem nome, pois todo aquele que tem nome foi criado por outro. E Aquele que É possui uma aparência que lhe é própria,[b] diferente de tudo o que vocês viram e compreenderam. Contudo, é uma aparência enigmática, que transcende todas as coisas e supera o mundo. Ela olha simultaneamente em todas as direções e contempla a si mesma a partir de si mesma.[c]


    “Por ser infinito, ele jamais pode ser compreendido.


    Ele é para sempre indestrutível; nada se assemelha a ele.


    Ele é o bem que nunca muda.


    Ele não tem defeito.


    Ele é eterno.


    Ele é bendito.


    Ele não pode ser conhecido, mas conhece a si mesmo.


    Ele está além de toda medida; não se pode seguir o seu rastro.


    Ele é perfeito, sem imperfeição.


    Sua bem-aventurança é indestrutível.


    Ele é chamado ‘Pai do Mundo’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho indica uma lacuna no manuscrito depois de “disse”; a tradução não tenta reconstruí-la.
    reason: Registrar dano textual sem inserir palavras conjecturais no corpo do texto.
  - marker: b
    text: Há uma lacuna no manuscrito depois de “que lhe é própria”; não foi proposta reconstrução.
    reason: Sinalizar a segunda lacuna indicada pelo testemunho de base.
  - marker: c
    text: A expressão pode ser entendida literalmente como “contempla a si mesma a partir de si mesma”; sua formulação enigmática foi preservada.
    reason: Evitar resolver uma construção metafísica obscura por explicação doutrinária.
lexical_decisions:
- source_word: He Who Is
  choice: Aquele que É
  rationale: Preserva o caráter substantivado e ontológico da designação, com linguagem natural em português e sem reduzi-la simplesmente a um nome próprio.
- source_word: inexpressible
  choice: não pode ser expresso
  rationale: Comunica a impossibilidade de enunciar ou definir essa realidade, evitando o possível sentido meramente emocional de “indescritível”.
- source_word: contingent
  choice: contingente
  rationale: Mantém o termo filosófico do testemunho, isto é, aquilo cuja existência depende de outra realidade, sem resolver a formulação por paráfrase interpretativa.
- source_word: unbegotten
  choice: não gerado
  rationale: Distingue a ausência de geração da expressão anterior “sem nascimento” e preserva a terminologia metafísica do texto.
- source_word: appearance
  choice: aparência
  rationale: Conserva a ambiguidade entre aspecto, manifestação e forma perceptível presente no testemunho disponível.
- source_word: cannot be traced out
  choice: não se pode seguir o seu rastro
  rationale: Preserva a imagem de algo impossível de rastrear ou perscrutar, em vez de nivelá-la à frase anterior sobre medida.
- source_word: blessedness
  choice: bem-aventurança
  rationale: Distingue a qualidade ou estado abstrato do adjetivo anterior “bendito”.
theological_decisions:
- issue: Identidade do sujeito em “A partir de agora, eu sou o Grande Salvador” e na justificativa seguinte
  choice: Preservar a mudança entre “eu” e “ele”
  alternative: Harmonizar os pronomes e atribuir explicitamente a imortalidade ao Grande Salvador ou a Aquele que É
  rationale: O testemunho apresenta tensão referencial genuína; harmonizá-la introduziria uma conclusão cristológica ou cosmológica não explicitada.
- issue: Extensão da revelação concedida
  choice: “somente ele e aqueles a quem ele deseja conceder revelação”
  alternative: Fazer de “qualquer um” uma referência singular ou identificar explicitamente o revelador
  rationale: Mantém a abertura do referente humano ou celestial e a mediação “por meio daquele que teve origem na Primeira Luz”.
- issue: Gênero gramatical na descrição da aparência
  choice: Usar “ela” quando o referente imediato é “aparência” e “ele” nas afirmações sobre Aquele que É
  alternative: Uniformizar todos os pronomes no masculino
  rationale: Reflete a alternância gramatical do testemunho sem converter a aparência em pessoa distinta nem apagar a formulação “por ser infinito, ele”.
- issue: Título final “Father of the World”
  choice: “Pai do Mundo”
  alternative: “Pai do universo” ou “Pai da criação”
  rationale: Preserva o título formal e sua possível carga cosmológica sem ampliá-lo interpretativamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação é provisória porque a revisão direta do copta ainda está pendente e se baseia no testemunho inglês público fornecido. As lacunas do manuscrito foram deslocadas do corpo para notas marcadas, evitando colchetes vazios pouco informativos. Mantiveram-se paralelismo, repetições e tensões pronominais relevantes.
