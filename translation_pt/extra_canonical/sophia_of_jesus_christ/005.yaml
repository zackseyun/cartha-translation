reference: Sophia of Jesus Christ — The Immortal Human, Sophia, and Ogdoad
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'Matthew asked him: “Lord, Savior, how was the Human revealed?”


    The perfect Savior said: “I desire that you know the one who appeared before the world.


    “In the beginning, the infinite, self-grown, [] self-made Father, who was replete with radiant and unspeakable light, when he chose for his likeness to become a great power, the originative principle of that light suddenly appeared as the deathless androgynous Human, so that through that immortal Human they could obtain their salvation and wake up from oblivion through the one sent as the interpreter, who dwells with you until the end of the impoverished thieves. And his consort is the Great Sophia, who in him was ordained from the beginning for union by the self-begotten Father, from the Immortal Human who was first to appear, even as divinity and kingdom, because this was revealed by the Father, [] who is called ‘the Human,’ ‘the Self-Father.’ And for his own majesty, he created a mighty aeon, whose name is Ogdoad, who was granted great authority, even ruling over the impoverished creation.


    “From that light and the threefold male Spirit, which belongs to Sophia, his consort, he created gods and angels <and> archangels, countless myriads for service. This was because this God created divinity and kingdom, so that he was called ‘God of gods,’ ‘King of kings.’ Within him, the Primal Human possesses his singular mind and thought, being precisely (thought), reflection and contemplation, reason [] and power. All the existent qualities are perfect and deathless.


    “Regarding indestructability, they are in fact equal, though regarding power, there is a difference similar to the difference between father and son, <and son> and thought, and the thought and what remains (thereafter). As I stated before, among created entities, the monad comes first. And after everything (else), anything that appeared was revealed from his power. And from created entities appeared everything that was fashioned, and from what was fashioned appeared what was formed, (and) from what was formed (appeared) what was named. This is how from beginning to end the difference arose among the unbegotten ones.”'
