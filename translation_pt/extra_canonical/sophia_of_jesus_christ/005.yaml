translation:
  language: pt
  text: 'Mateus lhe perguntou: “Senhor, Salvador, como o Humano foi revelado?”


    O Salvador perfeito disse: “Desejo que vocês conheçam aquele que apareceu antes do mundo.


    “No princípio, o Pai infinito, auto-originado, [a] feito por si mesmo, que estava pleno de luz radiante e indizível, quando quis que sua semelhança se tornasse um grande poder, fez com que o princípio originador daquela luz aparecesse de repente como o Humano andrógino e imortal, para que, por meio desse Humano imortal, eles pudessem alcançar a salvação e despertar do esquecimento mediante aquele que foi enviado como intérprete e que habita com vocês até o fim dos ladrões empobrecidos. Sua consorte é a Grande Sophia, que, nele, foi destinada desde o princípio à união pelo Pai autogerado, a partir do Humano Imortal que apareceu primeiro, como divindade e reino, pois isso foi revelado pelo Pai, [b] chamado ‘o Humano’, ‘o Pai de Si Mesmo’. E, para sua própria majestade, ele criou um poderoso éon, cujo nome é Ogdóade, ao qual foi concedida grande autoridade, até mesmo o domínio sobre a criação empobrecida.


    “Daquela luz e do Espírito tríplice e masculino, que pertence a Sophia, sua consorte, ele criou deuses, anjos e arcanjos, miríades incontáveis para o serviço. Isso aconteceu porque esse Deus criou divindade e reino, de modo que foi chamado ‘Deus dos deuses’ e ‘Rei dos reis’. Nele, o Humano Primordial possui sua mente e seu pensamento singulares, sendo precisamente pensamento, reflexão e contemplação, razão [c] e poder. Todas as qualidades existentes são perfeitas e imortais.


    “Quanto à indestrutibilidade, eles de fato são iguais; quanto ao poder, porém, há uma diferença semelhante à diferença entre pai e filho, entre filho e pensamento, e entre o pensamento e o que resta depois dele. Como eu disse antes, entre as entidades criadas, a mônada vem primeiro. E, depois de tudo o mais, tudo o que apareceu foi revelado a partir do poder dele. Das entidades criadas surgiu tudo o que foi elaborado; do que foi elaborado surgiu o que foi formado; e do que foi formado surgiu o que recebeu nome. Foi assim que, do princípio ao fim, surgiu a diferença entre os não gerados.”


    [a] Há uma lacuna no testemunho neste ponto.

    [b] Há uma lacuna no testemunho neste ponto.

    [c] Há uma lacuna no testemunho neste ponto.'
