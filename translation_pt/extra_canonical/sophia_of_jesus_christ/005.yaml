lexical_decisions:
- source_word: Human
  choice: o Humano
  rationale: Mantém o uso titular e inclusivo do testemunho, evitando reduzi-lo a ‘homem’ no sentido masculino ou a uma pessoa humana comum.
- source_word: self-grown
  choice: auto-originado
  rationale: Expressa origem em si mesmo em linguagem inteligível, sem confundir o termo com crescimento físico.
- source_word: androgynous
  choice: andrógino
  rationale: Preserva a caracterização cosmológica explícita e sua tensão conceitual.
- source_word: Sophia
  choice: Sophia
  rationale: Conserva o nome técnico da figura; traduzi-lo simplesmente por ‘Sabedoria’ poderia ocultar seu caráter pessoal neste escrito.
- source_word: aeon
  choice: éon
  rationale: Mantém o termo técnico cosmológico, pois ‘era’ ou ‘eternidade’ não comunicaria adequadamente a entidade aqui nomeada.
- source_word: Ogdoad
  choice: Ogdóade
  rationale: Emprega a forma portuguesa tradicional para o termo técnico que designa o conjunto ou domínio de oito.
- source_word: myriads
  choice: miríades
  rationale: Preserva a expressão antiga de multidão inumerável em registro elevado, esclarecida por ‘incontáveis’.
- source_word: monad
  choice: mônada
  rationale: Conserva o termo filosófico técnico para a unidade primordial.
- source_word: unbegotten ones
  choice: os não gerados
  rationale: Mantém a distinção metafísica entre gerar e criar sem harmonizar a aparente tensão com ‘entidades criadas’.
theological_decisions:
- issue: Identidade e gênero do ‘Humano’ primordial
  choice: ‘o Humano andrógino e imortal’
  alternative: ‘o Homem imortal e andrógino’
  rationale: A opção escolhida preserva tanto o caráter titular quanto a inclusão dos polos sexuais indicada por ‘andrógino’, sem impor uma leitura exclusivamente masculina.
- issue: Relação entre o Pai, o Humano Imortal e Sophia
  choice: Preservar a sintaxe densa e as referências pronominais potencialmente ambíguas
  alternative: Explicitar quais ações pertencem a cada figura
  rationale: O testemunho é sintaticamente difícil e uma explicitação resolveria indevidamente relações cosmológicas que permanecem incertas sem revisão copta direta.
- issue: ‘God of gods’ e pluralidade de deuses
  choice: ‘Deus dos deuses’
  alternative: ‘Deus sobre todos os seres divinos’
  rationale: A tradução literal preserva a linguagem teológica própria do documento sem ajustá-la a formulações confessionais posteriores.
- issue: Igualdade em indestrutibilidade e diferença em poder
  choice: Manter ambas as afirmações em contraste
  alternative: Subordinar uma afirmação à outra por explicação doutrinária
  rationale: O texto afirma simultaneamente igualdade quanto à indestrutibilidade e gradação quanto ao poder; a tradução não deve eliminar essa tensão.
- issue: Criados e não gerados
  choice: Preservar a aparente tensão terminológica
  alternative: Harmonizar ‘entidades criadas’ com ‘não gerados’
  rationale: Como a fonte copta ainda não foi revista diretamente e o testemunho inglês apresenta ambos os termos, a tensão deve permanecer visível.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Termos cosmológicos especializados — Sophia, éon, Ogdóade e mônada — foram mantidos quando a simplificação apagaria distinções do documento. A redação é provisória porque se baseia no testemunho público em inglês fornecido; a revisão direta dos manuscritos coptas permanece pendente. As restaurações editoriais marcadas por sinais angulares no testemunho foram incorporadas naturalmente apenas onde necessárias à gramática (‘e arcanjos’; ‘entre filho e pensamento’), enquanto as lacunas quadradas receberam marcadores e notas explícitas.
