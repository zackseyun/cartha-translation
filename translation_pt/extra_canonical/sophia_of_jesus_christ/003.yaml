lexical_decisions:
- source_word: perfect ones / perfect Savior
  choice: perfeitos / Salvador perfeito
  rationale: Mantém a repetição e a terminologia técnica do testemunho sem interpretar “perfeito” como mera maturidade moral.
- source_word: Totalities
  choice: Totalidades
  rationale: Preserva o provável termo cosmológico técnico e sua capitalização, evitando reduzi-lo a “todas as coisas”.
- source_word: unbegotten Father
  choice: Pai infinito e não gerado
  rationale: “Não gerado” conserva a distinção ontológica expressa pelo testemunho e evita o termo mais confessional “ingênito”.
- source_word: Spirit Who Is
  choice: Espírito Que É
  rationale: Reproduz o caráter titular da expressão e sua possível alusão ao ser, sem resolvê-la como simples “Espírito existente”.
- source_word: unmoving generation
  choice: geração imóvel
  rationale: Tradução formal que preserva a imagem cosmológica incomum, em vez de interpretá-la como “imutável” ou “inabalável”.
- source_word: self-begotten God
  choice: Deus autogerado
  rationale: Mantém o vocabulário técnico de auto-originação do testemunho, sem harmonização com categorias teológicas posteriores.
- source_word: indestructability / imperishable
  choice: indestrutibilidade / imperecível
  rationale: Conserva a distinção lexical do testemunho entre a condição abstrata e aquilo que não perece.
- source_word: erred
  choice: se desviaram
  rationale: Expressa erro de entendimento e de rumo sem acrescentar uma categoria doutrinária específica.
theological_decisions:
- issue: Relação entre o Pai, o Espírito Que É e o Deus autogerado
  choice: Preservar os títulos e as relações exatamente como aparecem, sem identificá-los ou separá-los de modo adicional
  alternative: Harmonizar os títulos com uma formulação trinitária posterior ou tratá-los explicitamente como seres independentes
  rationale: O trecho apresenta uma cosmologia própria e ambígua; a tradução não deve importar uma solução denominacional.
- issue: Referente dos pronomes em “presciência dele, o Pai”
  choice: Manter a sequência pronominal e a aposição “o Pai infinito e não gerado”
  alternative: Reestruturar a frase para afirmar inequivocamente que cada pronome se refere ao Pai
  rationale: A sintaxe do testemunho é compacta, e a reformulação poderia eliminar uma ambiguidade real.
- issue: Produção de “corpos e espíritos” pelos espíritos da geração imóvel
  choice: Manter a afirmação sem explicar a natureza dos corpos ou espíritos
  alternative: Interpretar “corpos” como corpos celestes, formas espirituais ou corpos humanos
  rationale: O contexto fornecido não decide entre essas leituras.
- issue: “Grande diferença entre os indestrutíveis”
  choice: Traduzir literalmente, sem especificar em que consiste a diferença
  alternative: Explicar a diferença como hierarquia, natureza ou grau de glória
  rationale: O testemunho afirma a diferença, mas não a define neste trecho.
- issue: “aqueles que são infinitos”
  choice: os infinitos
  alternative: os seres infinitos ou as realidades infinitas
  rationale: A forma substantivada conserva a abertura referencial da expressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe ajustada para clareza sem simplificar a cosmologia técnica. “Vocês” foi usado no discurso plural para legibilidade brasileira e compreensão internacional. A redação é necessariamente provisória, pois foi preparada a partir do testemunho inglês público fornecido; a revisão direta dos manuscritos coptas ainda está pendente. Sinais de restauração e lacuna foram mantidos e explicados em notas.
