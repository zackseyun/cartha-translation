translation:
  language: pt
  text: 'Filipe perguntou: “Senhor, como, então, ele apareceu aos perfeitos?”


    O Salvador perfeito lhe respondeu: “Antes que qualquer coisa visível se tornasse visível, a majestade e a autoridade existiam [a] nele, pois ele abrange a totalidade das Totalidades, ao passo que nada o abrange. Isso porque ele é inteiramente mente; e ele é pensamento e reflexão, consideração, raciocínio e poder. Todos eles são poderes equivalentes, as fontes das Totalidades. E toda a raça deles, do primeiro ao último, está na presciência dele, o Pai infinito e não gerado.”


    Tomé lhe perguntou: “Senhor, Salvador, por que estes vieram a existir e por que foram revelados?”


    O Salvador perfeito respondeu: “Eu procedi do Infinito para contar a vocês todas as coisas. O Espírito Que É foi quem gerou, tendo o poder <de> um gerador [b] e a natureza de quem [concede] forma [c], para que a grande riqueza oculta nele pudesse ser revelada. Por causa de sua misericórdia e de seu amor, ele desejou produzir fruto por si mesmo, para não <desfrutar> sozinho de sua bondade [d], mas para que outros espíritos da geração imóvel pudessem produzir corpos e espíritos, glória e honra em indestrutibilidade, bem como seu dom infinito; assim, seu tesouro poderia ser manifestado pelo Deus autogerado, o Pai de toda indestrutibilidade e daqueles que depois viriam a existir, mas que ainda não haviam aparecido visivelmente. Há uma grande diferença entre os indestrutíveis.”


    Ele exclamou: “Quem tem ouvidos para ouvir a respeito dos infinitos, ouça!” E disse: “Falei aos que estão despertos!”


    Ele prosseguiu [e] e disse: “Tudo o que se originou do que é perecível perecerá, pois se originou do que é perecível. Mas o que se originou do que é imperecível não perecerá; antes, será imperecível.


    Por isso, muitos se desviaram, porque não conheciam essa diferença, e morreram.”


    [a] O testemunho inglês assinala aqui uma lacuna ou incerteza textual por meio de colchetes vazios.

    [b] O termo “de” é uma restauração editorial indicada por sinais angulares no testemunho utilizado; há também uma lacuna ou incerteza logo depois de “gerador”.

    [c] “Concede” é uma restauração editorial indicada por colchetes no testemunho utilizado.

    [d] “Desfrutar” é uma restauração editorial indicada por sinais angulares. A repetição enfática “sozinho (por si mesmo)” do testemunho foi expressa naturalmente como “sozinho”.

    [e] O testemunho inglês assinala aqui uma lacuna ou incerteza textual por meio de colchetes vazios.'
