translation:
  language: pt
  text: 'Maria lhe perguntou: “Então, Senhor, como podemos chegar a conhecer isso?”


    O Salvador perfeito disse: “Comecem pelas coisas ocultas e prossigam até o limite das coisas visíveis; e a emanação do Pensamento lhes revelará por si mesma como a fé nas coisas invisíveis pode ser encontrada no que é visível — coisas que pertencem ao Pai não gerado. Quem tem ouvidos para ouvir, ouça!


    “O Senhor do Mundo não é chamado ‘Pai’, mas ‘Antepassado’, <porque o Pai é> o princípio originador daqueles que se tornarão visíveis; contudo, ele [...] é [o] Antepassado sem princípio.[a] Ele contempla a si mesmo dentro de si, como num espelho, tendo aparecido em sua semelhança como o Autopai divino e <como> aquele que reflete sobre os que refletem, o primeiro existente, o Pai não gerado. De fato, ele é tão antigo <quanto> a luz que está diante dele, mas não se iguala a ela em poder.[b]


    “Depois, ele revelou muitos seres refletores, autogerados, iguais em antiguidade e poder, subsistindo em glória e até mesmo inumeráveis. O povo deles é chamado ‘A Geração Acima da Qual Não Há Reino’, proveniente daquele em que vocês mesmos se tornaram visíveis entre estes <reinos>.[c] E toda essa multidão, acima da qual não há reino, é chamada [...] ‘os Filhos do Pai Não Gerado’, ‘Deus’, ‘[Salvador]’ e ‘Filho de Deus’; a semelhança dele habita com vocês.[d]


    “Ele é o Incognoscível, cheio de toda glória indestrutível e alegria inexprimível. Todos repousam nele, alegrando-se continuamente, com alegria inexprimível, por causa de sua glória que nunca muda e com júbilo imensurável. Antes de agora, isso jamais havia sido ouvido ou conhecido entre todos os éons e seus mundos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os sinais < > indicam palavras supridas no testemunho de consulta; [...] indica uma lacuna ou trecho danificado, e [ ] indica restauração editorial.
    reason: Torna transparentes os sinais textuais preservados no corpo da tradução.
  - marker: b
    text: Os referentes de “ele”, “a luz” e “ela” são incertos nesta passagem; a tradução não procura identificá-los além do que o texto permite.
    reason: Preserva a ambiguidade pronominal e cosmológica do testemunho.
  - marker: c
    text: A construção que relaciona a “Geração” com “aquele em que vocês... se tornaram visíveis” é obscura no testemunho disponível.
    reason: Avisa o leitor de que a dificuldade não foi resolvida por conjectura.
  - marker: d
    text: O texto passa de “multidão” e “Filhos” a títulos no singular; além disso, “[Salvador]” é uma restauração editorial.
    reason: Preserva a tensão entre referências coletivas e singulares e registra a restauração.
lexical_decisions:
- source_word: Forefather
  choice: Antepassado
  rationale: Preserva o contraste explícito com “Pai” e expressa anterioridade sem introduzir um título denominacional. A opção “Progenitor” sugeriria mais diretamente geração biológica.
- source_word: unbegotten
  choice: não gerado
  rationale: Mantém a distinção técnica entre aquele que não foi gerado e os seres posteriormente descritos como autogerados.
- source_word: Thought
  choice: Pensamento
  rationale: A inicial maiúscula sinaliza que o termo funciona como realidade ou entidade personificada no discurso cosmológico.
- source_word: Self-Father
  choice: Autopai
  rationale: Reproduz de modo compacto o composto técnico e evita explicar ou harmonizar uma designação cosmológica obscura.
- source_word: reflecting / reflector
  choice: refletores / aquele que reflete
  rationale: Conserva a linguagem recorrente do espelho e a relação lexical entre as expressões, apesar de sua obscuridade.
- source_word: self-begotten
  choice: autogerados
  rationale: Preserva o paralelo técnico com “Autopai” e o contraste com “Pai não gerado”.
- source_word: nation
  choice: povo
  rationale: “Povo” é natural em português e mantém a ideia de uma coletividade definida, sem a conotação política moderna predominante de “nação”.
- source_word: aeons
  choice: éons
  rationale: Mantém o termo cosmológico técnico, em vez de reduzi-lo simplesmente a períodos de tempo.
- source_word: Unknowable
  choice: Incognoscível
  rationale: 'Expressa uma designação substantivada e técnica: aquele que não pode ser conhecido, não apenas alguém ainda desconhecido.'
theological_decisions:
- issue: Relação entre o Senhor do Mundo, o Pai, o Antepassado e a luz
  choice: Manter referentes pronominais e relações tão ambíguos quanto no testemunho, sem identificá-los entre si
  alternative: Explicitar cada referente e harmonizar todos os títulos como designações de um único ser
  rationale: O texto preservado apresenta tensão sintática e cosmológica genuína; resolvê-la acrescentaria interpretação não garantida pela evidência fornecida.
- issue: Designações coletivas e singulares da multidão
  choice: Conservar a sequência “Filhos...”, “Deus”, “[Salvador]” e “Filho de Deus” tal como atestada
  alternative: Pluralizar todos os títulos ou atribuí-los explicitamente a um indivíduo distinto
  rationale: A alternância entre coletivo, singular e possível título deve permanecer visível, pois pode refletir a própria formulação do texto ou dano manuscrito.
- issue: Natureza do Pensamento
  choice: Usar “Pensamento” com inicial maiúscula sem definição adicional
  alternative: Traduzir como faculdade mental comum ou identificar a entidade com uma figura teológica específica
  rationale: A personificação parece provável, mas sua identidade exata não deve ser imposta.
- issue: Fé no invisível encontrada no visível
  choice: Preservar a formulação epistemológica paradoxal
  alternative: Parafrasear como prova racional do invisível mediante a criação visível
  rationale: A paráfrase resolveria uma relação que o texto deixa aberta e poderia importar uma doutrina externa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A redação é provisória porque a revisão direta do copta ainda está pendente; baseia-se no testemunho inglês público fornecido. Mantiveram-se termos cosmológicos técnicos, marcas de dano e restauração e ambiguidades relevantes, evitando harmonização doutrinária.
