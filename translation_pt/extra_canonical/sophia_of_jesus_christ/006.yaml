lexical_decisions:
- source_word: the Human / Son of Man
  choice: o Ser Humano / o Filho do Homem
  rationale: Distingue a designação cosmológica ampla da expressão titulária tradicional, sem reduzir ambas simplesmente a “homem”.
- source_word: Primal Human
  choice: Ser Humano Primordial
  rationale: Preserva o caráter técnico e cosmológico de “Primal”, em linguagem portuguesa compreensível.
- source_word: the Begetter
  choice: o Gerador
  rationale: Expressa aquele que gera ou produz, evitando “Pai”, que apagaria a distinção entre os títulos presentes.
- source_word: Self-Completed Mind
  choice: a Mente Autocompleta
  rationale: Mantém a composição incomum e seu sentido de completude em si mesma, sem explicação interpretativa adicional.
- source_word: consort
  choice: consorte
  rationale: Preserva a relação de par ou companheira no esquema cosmológico sem impor a categoria matrimonial moderna de “esposa”.
- source_word: Sophia
  choice: Sabedoria
  rationale: Traduz o nome semântico grego para torná-lo inteligível em português; a maiúscula sinaliza seu uso como título ou nome personificado.
- source_word: androgynous
  choice: andrógino
  rationale: Conserva diretamente a caracterização dual do ser manifestado, sem harmonizá-la com categorias teológicas posteriores.
- source_word: First-Begetting / first-begotten
  choice: Primogênito / Primogênita
  rationale: Usa a forma natural e reconhecível em português para o ser primeiro gerado; a assimetria do inglês pode depender do testemunho intermediário e requer revisão copta.
- source_word: aeons
  choice: éons
  rationale: Mantém o termo cosmológico técnico, em vez de reduzi-lo necessariamente a simples períodos cronológicos.
- source_word: self-begotten
  choice: autogerada
  rationale: Preserva a ideia de origem a partir de si mesma e concorda gramaticalmente com “Luz”.
theological_decisions:
- issue: Identidade masculina e feminina do filho andrógino
  choice: Manter os nomes masculino e feminino e as mudanças pronominais correspondentes
  alternative: Uniformizar tudo no masculino ou tratar as duas designações como seres separados
  rationale: O testemunho apresentado atribui explicitamente ambas as designações ao primogênito andrógino; a tradução conserva essa tensão sem solucioná-la.
- issue: Relação entre “Ser Humano”, “Filho do Homem” e “Filho de Deus”
  choice: Preservar as três fórmulas distintas
  alternative: Harmonizá-las como títulos equivalentes de uma única figura
  rationale: A própria pergunta e a resposta exploram relações potencialmente distintas entre esses títulos.
- issue: Origem e autoridade de Cristo
  choice: “exerce a autoridade recebida de seu Pai”
  alternative: “tem poder por causa de seu Pai” ou “governa em lugar de seu Pai”
  rationale: Expressa a procedência paterna da autoridade sem definir uma estrutura metafísica além do que o testemunho permite.
- issue: Referente da alegria diante da glória indestrutível
  choice: Introduzir “Eles se alegram” como retomada contextual dos habitantes angélicos do reino
  alternative: Ligar gramaticalmente o júbilo ao próprio reino ou ao Filho
  rationale: A sintaxe inglesa é comprimida; esta solução produz português legível, mas permanece uma decisão provisória dependente da revisão copta.
- issue: Autogeração da Luz Infinita
  choice: Fazer “autogerada e primordial” modificar “Luz Infinita”
  alternative: Fazer os qualificativos modificarem o falante ou entender “Autogerado” como entidade separada
  rationale: É a leitura mais imediata do testemunho inglês fornecido, embora a estrutura cosmológica possa exigir ajuste após consulta direta ao copta.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Mantêm-se termos técnicos necessários, como “éons”, “andrógino” e “autogerada”. A redação é provisória porque foi feita a partir do testemunho inglês público fornecido; a revisão direta do copta dos códices de Nag Hammadi III,4 e Berlim 8502,3 ainda é necessária. Os colchetes do texto corrido foram convertidos em marcadores de notas para esclarecer as lacunas, enquanto os sinais angulares em <ele> foram preservados como indicação de suplemento editorial.
