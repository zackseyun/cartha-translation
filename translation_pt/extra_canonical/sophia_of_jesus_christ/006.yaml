translation:
  language: pt
  text: 'Bartolomeu então lhe perguntou: “Como <ele> é chamado [a] ‘o Ser Humano’ e ‘o Filho do Homem’ no Evangelho? Qual deles, então, diz respeito ao Filho?”


    O Santo lhe disse: “Quero que você saiba que o Ser Humano Primordial é chamado ‘o Gerador’, ‘a Mente Autocompleta’. Ele contemplou com sua consorte, a Grande Sabedoria, e manifestou seu filho primogênito e andrógino. Seu nome masculino é ‘Filho Primogênito de Deus’, enquanto seu nome feminino é ‘Sabedoria Primogênita, Mãe do Universo’; alguns a chamam ‘Amor’. O Primogênito, chamado ‘Cristo’, criou, do Espírito e da Luz, uma multidão de incontáveis [b] anjos para o serviço, pois exerce a autoridade recebida de seu Pai.”


    Seus discípulos lhe disseram: “Senhor, revela-nos aquele que é chamado ‘o Ser Humano’, para que também possamos compreender com exatidão a sua glória.”


    O Salvador perfeito disse: “Quem tem ouvidos para ouvir, ouça! Por ter sua origem na luz radiante, o Pai Primogênito recebe o nome de ‘Adão, o Olho da Luz’, e seus santos anjos — inexprimíveis e sem sombra — alegram-se continuamente, cheios de júbilo, com os reflexos que receberam de seu Pai. Todo o reino do Filho do Homem, chamado ‘o Filho de Deus’, está repleto de alegria inexprimível e sem sombra e de um júbilo que nunca muda. Eles se alegram com sua glória indestrutível, [c] até agora jamais ouvida nem revelada nos éons e em seus mundos, que vieram a existir depois. Eu me originei da Luz Infinita, autogerada e primordial, para revelar todas as coisas a vocês.”'
