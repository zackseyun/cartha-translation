review_pass:
  verdict: revise
  source_fidelity: A versão preserva em geral a sequência discursiva e os termos cosmológicos do testemunho inglês fornecido, bem como as lacunas. Contudo, ela neutraliza a diferença expressa pelo testemunho entre “first-begetting” e “first-begotten” e traduz “first-begetting Father” como “Pai Primogênito”, formulação que significa antes “Pai nascido primeiro” do que “Pai que primeiro gera”. A formulação sobre o júbilo também introduz um sujeito explícito (“Eles”) ausente do testemunho.
  naturalness: O registro é claro e moderno. A pergunta inicial permanece necessariamente truncada por causa da lacuna, mas a nota deve distinguir com precisão o suplemento entre sinais angulares da lacuna assinalada. Pequenos ajustes tornam a construção sobre a origem e o júbilo mais fluente sem completar indevidamente o texto.
  terminology: “Ser Humano”, “Filho do Homem”, “Gerador”, “Mente Autocompleta”, “consorte”, “andrógino”, “éons” e “autogerada” são escolhas defensáveis. “Sabedoria” para Sophia é possível, desde que se preserve a função de nome/título. Para conservar a distinção do testemunho intermediário, “primeiro-gerador/-geradora” é preferível em “First-Begetting”, enquanto “primogênito” permanece para “first-begotten”.
  issues:
  - severity: medium
    issue: “Pai Primogênito” para “first-begetting Father”
    rationale: Em português, “primogênito” designa normalmente quem nasceu primeiro; não comunica o sentido ativo de “first-begetting” presente no testemunho.
  - severity: medium
    issue: Nivelamento de “First-Begetting” e “first-begotten” como “Primogênito/Primogênita”
    rationale: O testemunho inglês emprega formas diferentes. Mesmo que a terminologia dependa de revisão copta, a tradução não deve apagar essa distinção sem indicação.
  - severity: low
    issue: Nota a mistura suplemento editorial e lacuna na pergunta inicial
    rationale: O sinal <ele> representa o suplemento editorial; o marcador de nota representa a lacuna posterior. A nota deve descrevê-los separadamente.
  - severity: low
    issue: “Eles se alegram” introduz um referente não expresso
    rationale: O testemunho diz que o reino está cheio de alegria e de júbilo por sua glória. A explicitação de um grupo angélico é interpretativa e pode ser evitada.
