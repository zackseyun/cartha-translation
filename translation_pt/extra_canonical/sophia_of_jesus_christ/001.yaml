    reason: Explicar uma formulação obscura sem eliminar sua estranheza nem impor uma leitura doutrinária.
lexical_decisions:
- source_word: fundamental nature
  choice: natureza fundamental
  rationale: Mantém o caráter ontológico e investigativo da expressão sem substituí-la por um sistema filosófico específico.
- source_word: authorities
  choice: autoridades
  rationale: Preserva o termo amplo do testemunho, que pode designar poderes cósmicos, sem explicitar como certa uma identificação técnica ainda dependente de revisão do copta.
- source_word: invisible spirit
  choice: o espírito invisível
  rationale: Conserva a formulação substantiva e a tensão entre invisibilidade e aparência subsequente.
- source_word: pure, perfect flesh
  choice: carne inteiramente pura e perfeita
  rationale: Mantém o vocabulário corpóreo surpreendente do testemunho, sem espiritualizá-lo como 'corpo' ou 'forma'.
- source_word: Infinite Light
  choice: Luz Infinita
  rationale: Usa maiúsculas para refletir seu emprego como realidade transcendente ou designação titulada no contexto.
- source_word: self-originated / self-made
  choice: se origina por si mesmo / fez a si próprio
  rationale: Reproduz a repetição conceitual sem fundir as duas formulações.
- source_word: sowing of impure rubbing
  choice: semeadura da fricção impura
  rationale: Conserva a imagem sexual ou generativa estranha e difícil, evitando resolvê-la por paráfrase doutrinária.
theological_decisions:
- issue: Forma da aparição do Salvador
  choice: Manter 'espírito invisível' ao lado de 'aparência', 'anjo' e 'carne'.
  alternative: Harmonizar as imagens como simples corpo espiritual ou visão simbólica.
  rationale: O testemunho reúne deliberadamente linguagem invisível, angélica e corpórea; a tradução preserva essa tensão.
- issue: Providência, destino e autogoverno do mundo
  choice: Apresentar as três opções como teorias rejeitadas no discurso.
  alternative: Entender a passagem como rejeição absoluta de toda providência divina em qualquer sentido.
  rationale: O contexto imediato critica propostas filosóficas sobre o governo cósmico; a tradução não amplia a afirmação para além do escopo do trecho.
- issue: Aquele que foi enviado primeiro
  choice: Preservar o referente sem identificá-lo explicitamente.
  alternative: Nomeá-lo como Cristo, Salvador, Pai ou outra figura.
  rationale: O pronome e o título permanecem ambíguos no testemunho fornecido, e não convém impor uma identificação teológica.
- issue: Conhecimento concedido e merecimento
  choice: Manter lado a lado 'foi dado' e 'seja digna'.
  alternative: Resolver a relação em favor exclusivo de graça concedida ou mérito humano.
  rationale: A tensão está presente no texto e deve permanecer aberta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O diálogo usa “vocês” e construções naturais, enquanto o discurso conserva densidade filosófica. Esta é uma tradução provisória baseada na testemunha inglesa de domínio público fornecida; a revisão direta dos manuscritos coptas de Nag Hammadi III,4 e do Códice de Berlim 8502,3 continua pendente.
