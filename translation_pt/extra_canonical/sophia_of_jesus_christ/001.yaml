translation:
  language: pt
  text: 'Depois de ressuscitar dentre os mortos, seus doze discípulos e sete mulheres continuaram a segui-lo e viajaram para a Galileia, até o monte [lacuna][a] chamado “Lugar da Colheita e da Alegria”. Quando se reuniram, estavam perplexos a respeito da natureza fundamental do mundo, do plano, da providência divina, do poder das autoridades[b] e de como o Salvador se relaciona com elas no mistério do plano divino. O Salvador apareceu, não em sua forma visível anterior, mas como o espírito invisível. Sua aparência era semelhante à de um anjo alto e radiante; mas não devo descrever aquilo com que ele se parecia, pois nenhum ser mortal seria capaz de suportá-lo. Era carne inteiramente pura e perfeita, como a que ele nos ensinou no monte chamado “Das Oliveiras”, na Galileia.


    E ele disse:


    — A paz esteja com vocês! Eu lhes dou a minha paz!


    Todos ficaram tomados de assombro e medo.


    O Salvador [lacuna][c] riu e lhes perguntou:


    — Sobre o que vocês estão refletindo? Por que estão perplexos? O que procuram?


    Filipe respondeu:


    — A natureza fundamental do mundo e seu plano.


    O Salvador lhes disse:


    — Quero que vocês compreendam isto: todos os que nasceram na terra, desde a fundação do mundo até agora, por serem pó, não conseguiram encontrar Deus, embora tenham procurado saber sobre seu ser e sua semelhança. Os maiores sábios entre eles formularam conjecturas com base na maneira como o mundo está ordenado e como segue seu curso, mas suas conjecturas não alcançaram a verdade.


    “Todos os filósofos dizem que a ordem cósmica é governada de três maneiras diferentes e, por isso, discordam entre si. Alguns afirmam que o mundo governa a si mesmo. [lacuna][d] Outros afirmam que a providência o governa; outros ainda, que é o destino. Mas nenhuma dessas afirmações corresponde à realidade.


    “Repito: nenhuma das três propostas que acabo de mencionar se aproxima da verdade, pois são conjecturas humanas. Eu, porém, vim da Luz Infinita, porque o conheço, e estou aqui para lhes dizer com exatidão o que é a verdade. A vida de tudo o que se origina por si mesmo é impura, pois fez a si próprio. Nada há de sábio na teoria da providência, e a teoria do destino carece de entendimento.


    “A vocês, porém, foi dado conhecer. E qualquer outra pessoa que seja digna do conhecimento o receberá: quem não foi gerado pela semeadura da fricção impura,[e] mas por aquele que foi enviado primeiro, pois este é um imortal entre os mortais.”'
