base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/009.yaml
  text: 'Therefore, let us hold firmly and without ceasing to our hope and to the pledge of our righteousness, who is Jesus Christ. He bore our sins in his own body on the tree. He committed no sin, nor was deceit found in his mouth. Yet for our sake he endured everything, so that we might live in him.


    Therefore, let us imitate his endurance. If we suffer for the sake of his name, let us glorify him. For he gave us this example in his own person, and we believed this.'
translation:
  language: pt
  text: 'Portanto, apeguemo-nos sem cessar à nossa esperança e ao penhor[a] da nossa justiça, que é Jesus Cristo. Ele levou nossos pecados em seu próprio corpo sobre o madeiro. Não cometeu pecado, nem se achou engano em sua boca. Por nossa causa, porém, suportou todas as coisas, para que vivamos nele.


    Portanto, tornemo-nos imitadores da perseverança dele. E, se sofrermos por causa do nome dele, glorifiquemo-lo. Pois ele nos deu esse exemplo em sua própria pessoa, e nós cremos nisso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Penhor” significa aqui uma garantia dada antecipadamente, como um primeiro sinal que assegura o cumprimento do que foi prometido.
    reason: O sentido antigo e teológico de “penhor” pode não ser transparente para todos os leitores modernos.
lexical_decisions:
- source_word: earnest / Greek ἀρραβών (as reflected in the witness)
  choice: penhor
  rationale: Conserva a imagem de uma garantia dada antecipadamente, sem reduzir o termo apenas a uma promessa abstrata; a nota esclarece o sentido para leitores atuais.
- source_word: tree / Greek ξύλον (as reflected in the biblical allusion)
  choice: madeiro
  rationale: Preserva a formulação tradicional da alusão a 1 Pedro 2:24 e a ideia do instrumento de madeira, sem substituir diretamente por “cruz”.
- source_word: endurance
  choice: perseverança
  rationale: Expressa resistência fiel e contínua em linguagem portuguesa natural; “paciência” seria mais estreito e poderia sugerir mera passividade.
- source_word: guile / deceit
  choice: engano
  rationale: É corrente e compreensível, mantendo a ideia de falsidade ou dolo presente na alusão bíblica.
- source_word: in His own person
  choice: em sua própria pessoa
  rationale: Mantém a ênfase de que o próprio Cristo encarnou o exemplo, sem parafrasear além do testemunho disponível.
theological_decisions:
- issue: “penhor da nossa justiça” identificado com Jesus Cristo
  choice: 'Manter a construção pessoal: “o penhor da nossa justiça, que é Jesus Cristo”'
  alternative: “a garantia de que seremos justificados”
  rationale: A alternativa explicaria e estreitaria a relação teológica. A tradução conserva a metáfora e a identificação direta presentes no testemunho.
- issue: Finalidade expressa por “that we might live in Him”
  choice: “para que vivêssemos nele”
  alternative: “para que, por meio dele, tivéssemos vida”
  rationale: Preserva a linguagem participativa e sua possível amplitude teológica, sem convertê-la exclusivamente em instrumentalidade.
- issue: Sofrer “por causa do nome dele”
  choice: Manter “o nome dele” sem explicitação
  alternative: “por confessarmos o nome de Cristo”
  rationale: A formulação mais literal conserva a expressão cristã antiga e não especifica indevidamente a forma ou causa imediata do sofrimento.
- issue: Objeto de “glorifiquemo-lo”
  choice: Referir o pronome a Cristo
  alternative: Entender como glorificar o nome ou glorificar a Deus
  rationale: É a referência imediata mais natural no testemunho inglês fornecido, embora a revisão direta do grego e do latim ainda seja necessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantiveram-se as alusões bíblicas e as tensões teológicas do testemunho, evitando explicações doutrinárias no corpo do texto. Como a revisão direta das fontes gregas e latinas está pendente, esta redação permanece provisória e se apoia no testemunho inglês público fornecido, consultado à luz das prováveis alusões a 1 Pedro 2:22–24.
