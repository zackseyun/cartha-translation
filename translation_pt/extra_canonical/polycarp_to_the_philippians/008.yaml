    Wherefore let us forsake the vain doing of the many and their false teachings, and turn unto the word which was delivered unto us from the beginning, being sober unto prayer and constant in fastings, entreating the all-seeing God with supplications that He bring us not into temptation, according as the Lord said, The Spirit is indeed willing, but the flesh is weak.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/008.yaml
  text: 'For everyone who does not confess that Jesus Christ has come in the flesh is antichrist. Whoever does not confess the testimony of the cross is of the devil. And whoever twists the Lord’s sayings to suit his own desires and says that there is neither resurrection nor judgment—that person is the firstborn of Satan.


    Therefore, let us abandon the empty practices of the many and their false teachings, and turn to the word delivered to us from the beginning. Let us be sober in prayer and steadfast in fasting, pleading with the all-seeing God not to bring us into temptation, just as the Lord said, “The spirit is indeed willing, but the flesh is weak.”'
translation:
  language: pt
  text: 'Pois todo aquele que não confessa que Jesus Cristo veio em carne é anticristo. Quem não confessa o testemunho da cruz é do diabo. E quem distorce as palavras do Senhor para atender aos próprios desejos e diz que não há ressurreição nem juízo, esse é o primogênito de Satanás.


    Portanto, abandonemos as práticas vazias da multidão e seus falsos ensinamentos e voltemo-nos para a palavra que nos foi entregue desde o princípio. Sejamos vigilantes na oração e perseverantes nos jejuns, suplicando ao Deus que tudo vê que não nos deixe cair em tentação, conforme disse o Senhor: “O espírito, na verdade, está disposto, mas a carne é fraca.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: is come in the flesh
  choice: veio em carne
  rationale: Mantém a formulação cristológica concreta do testemunho e sua proximidade com 1 João 4.2–3, sem expandi-la interpretativamente.
- source_word: the testimony of the Cross
  choice: o testemunho da cruz
  rationale: 'Preserva a expressão e sua possível amplitude: tanto o testemunho acerca da cruz quanto o testemunho que ela representa, sem resolver a ambiguidade.'
- source_word: oracles of the Lord
  choice: as palavras do Senhor
  rationale: Em português atual, comunica pronunciamentos dotados de autoridade sem a conotação pagã que “oráculos” pode sugerir ao leitor comum.
- source_word: to his own lusts
  choice: para atender aos próprios desejos
  rationale: Expressa a ideia de adaptar as palavras do Senhor aos desejos pessoais, sem restringir indevidamente o termo a desejos sexuais.
- source_word: the firstborn of Satan
  choice: o primogênito de Satanás
  rationale: Conserva a metáfora forte e incomum do testemunho, sem suavizá-la para “filho” ou convertê-la em explicação.
- source_word: the vain doing of the many
  choice: as práticas vazias da multidão
  rationale: Mantém tanto o caráter inútil ou vazio das condutas quanto a referência coletiva aos muitos.
- source_word: being sober unto prayer
  choice: Sejamos vigilantes na oração
  rationale: “Vigilantes” transmite, em contexto de oração, sobriedade, lucidez e prontidão espiritual com naturalidade em português.
- source_word: the all-seeing God
  choice: o Deus que tudo vê
  rationale: Reproduz de modo claro e digno o epíteto, sem recorrer a uma forma erudita pouco corrente.
theological_decisions:
- issue: Identificação de quem não confessa a encarnação
  choice: é anticristo
  alternative: é o anticristo
  rationale: A ausência de artigo no testemunho inglês favorece uma caracterização, em harmonia com a linguagem joanina, sem identificar necessariamente uma única figura escatológica.
- issue: Relação com o testemunho da cruz
  choice: é do diabo
  alternative: pertence ao diabo
  rationale: A formulação mais literal preserva a relação teológica sem especificar se se trata de origem, pertença ou alinhamento.
- issue: Petição sobre a tentação
  choice: que não nos deixe cair em tentação
  alternative: que não nos conduza à tentação
  rationale: A forma escolhida é natural e reconhecível em português e evita sugerir que Deus seja o agente moral da tentação, embora a formulação permaneça uma petição para ser preservado dela.
- issue: Contraste entre espírito e carne
  choice: O espírito, na verdade, está disposto, mas a carne é fraca
  alternative: O Espírito, na verdade, está disposto, mas a carne é fraca
  rationale: A inicial minúscula preserva a leitura imediata do espírito humano em contraste com a fraqueza corporal, sem inserir explicitamente uma referência ao Espírito Santo que o contexto citado não exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A redação evita arcaísmos desnecessários e preserva as afirmações incisivas e as metáforas do testemunho. Esta versão é necessariamente provisória, pois foi elaborada a partir do testemunho inglês público fornecido; a revisão direta das tradições manuscritas grega e latina ainda está pendente.
