  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  text: 'For every one who shall not confess that Jesus Christ is come in the flesh, is antichrist: and whosoever shall not confess the testimony of the Cross, is of the devil; and whosoever shall pervert the oracles of the Lord to his own lusts and say that there is neither resurrection nor judgment, that man is the firstborn of Satan.


    Wherefore let us forsake the vain doing of the many and their false teachings, and turn unto the word which was delivered unto us from the beginning, being sober unto prayer and constant in fastings, entreating the all-seeing God with supplications that He bring us not into temptation, according as the Lord said, The Spirit is indeed willing, but the flesh is weak.'
