review_pass:
  verdict: revise
  source_fidelity: A redação preserva bem as três advertências e a imagem deliberadamente forte de «o primogênito de Satanás». Contudo, «práticas vazias da multidão» interpreta e estreita τὴν ματαιότητα τῶν πολλῶν, que se refere mais amplamente à vaidade/futilidade dos muitos. Além disso, «não nos deixe cair em tentação» altera a formulação da petição transmitida («não nos introduza/leves em tentação»), substituindo-a por uma explicação protetiva tradicional.
  naturalness: O português é claro, moderno e de registro apropriado. «A vaidade dos muitos» é natural e mantém a amplitude do original; «sóbrios para a oração» reproduz com maior precisão a exortação sem perder legibilidade.
  terminology: «Veio em carne», «testemunho da cruz», «palavras do Senhor», «juízo» e «primogênito de Satanás» são escolhas adequadas. A expressão «em carne» e a metáfora «primogênito» devem permanecer sem notas doutrinárias explicativas.
  issues:
  - severity: medium
    issue: «práticas vazias da multidão» restringe «a vaidade dos muitos».
    rationale: O termo subjacente abrange a vaidade ou futilidade em sentido geral, não apenas práticas. «Dos muitos» também é mais fiel que «da multidão», que pode sugerir um grupo presente e delimitado.
  - severity: medium
    issue: «que não nos deixe cair em tentação» interpreta a petição citada.
    rationale: A tradição textual citada conserva a formulação de pedir a Deus que não nos introduza/conduza à tentação. A alternativa do rascunho explica o sentido de preservação, mas não mantém a expressão recebida.
  - severity: low
    issue: «vigilantes na oração» explicita parcialmente «sóbrios para a oração».
    rationale: É uma formulação possível, mas «sóbrios para a oração» conserva mais diretamente a noção de sobriedade/autodomínio do texto, sem reduzir o termo a vigilância.
  revised_text: 'Pois todo aquele que não confessa que Jesus Cristo veio em carne é anticristo. Quem não confessa o testemunho da cruz é do diabo. E quem distorce as palavras do Senhor para atender aos próprios desejos e diz que não há ressurreição nem juízo, esse é o primogênito de Satanás.


    Portanto, abandonemos a vaidade dos muitos e os seus falsos ensinamentos e voltemo-nos para a palavra que nos foi entregue desde o princípio. Sejamos sóbrios para a oração e perseverantes nos jejuns, suplicando ao Deus que tudo vê que não nos introduza em tentação, conforme disse o Senhor: “O espírito, na verdade, está disposto, mas a carne é fraca.”'
  revised_footnotes: []
  revision_rationale: 'A revisão corrige duas explicitações que reduziam a fidelidade ao texto: restaura a amplitude de «a vaidade dos muitos» e conserva a formulação da petição para não ser introduzido em tentação. Também emprega «sóbrios para a oração», equivalente mais próximo e ainda natural do apelo à sobriedade orientada à oração. Não foram acrescentadas notas, pois as expressões potencialmente ambíguas permanecem compreensíveis e devem continuar sem resolução interpretativa.'
