review_pass:
  verdict: revise
  source_fidelity: A redação acompanha de perto o testemunho inglês fornecido. Contudo, “preservem são todo o corpo” restringe indevidamente o explícito “save the whole body”; a tradução deve manter “salvem”, com nota para a provável dimensão comunitária/metafórica. “Desviados” também é mais específico do que “erring” e deve ser substituído por formulação que retenha simplesmente o erro. A dificuldade de “suas cartas no princípio” deve permanecer assinalada, pois a revisão direta das tradições grega e latina ainda está pendente.
  naturalness: 'O texto é claro e de registro apropriado. Foram feitos pequenos ajustes para maior naturalidade e precisão: “encargo” para a responsabilidade recebida, “por ser tão ignorante” para a censura a Valente, e “membros frágeis e errantes” para preservar a imagem sem acrescentar a noção de desvio/apostasia.'
  terminology: “Presbítero”, “ganância”, “idolatria”, “juízo”, “santos”, “arrependimento” e “edificam” são adequados. “Encargo” evita identificar sem necessidade o termo genérico para a função recebida com uma categoria ministerial moderna. “Salvar” é conservado no apelo relativo ao corpo inteiro, sem definição teológica adicional.
  issues:
  - severity: medium
    issue: A tradução substitui “save the whole body” por “preservem são todo o corpo”.
    rationale: Embora a imagem possa referir-se à saúde e integridade da comunidade, o testemunho emprega “save”. A substituição reduz a amplitude semântica e deixa a nota registrando como alternativa justamente a redação mais fiel.
  - severity: low
    issue: “Membros ... desviados” é mais interpretativo que “frail and erring members”.
    rationale: “Desviados” pode sugerir afastamento religioso ou apostasia, enquanto o texto fala de membros frágeis que erram. “Errantes” preserva a formulação sem especificar a natureza do erro.
  - severity: low
    issue: A nota a explica a construção difícil com alternativas excessivamente especulativas.
    rationale: Com a revisão direta do grego e do latim pendente, é mais seguro identificar a dificuldade sintática e preservar a formulação do testemunho, sem propor uma explicação específica.
  revised_text: 'Eu me entristeci profundamente por Valente, que antes era presbítero entre vocês, por ser tão ignorante do encargo que lhe foi confiado. Por isso, advirto vocês a se manterem longe da ganância, a serem puros e verdadeiros e a se afastarem de todo mal.


    Mas, se alguém não consegue dominar a si mesmo nessas questões, como pode ordenar a outro que o faça? Se alguém não se mantiver longe da ganância, será contaminado pela idolatria e julgado como um dos gentios que não conhecem o juízo do Senhor. Ora, não sabemos que os santos julgarão o mundo, como Paulo ensina?


    Contudo, não encontrei nem ouvi falar de coisa semelhante entre vocês, em cujo meio o bendito Paulo trabalhou e que eram suas cartas no princípio.[a] Pois ele se gloria de vocês em todas aquelas igrejas que, naquele tempo, eram as únicas que conheciam a Deus; pois nós ainda não o conhecíamos.


    Por isso, estou profundamente entristecido por ele e por sua esposa. Que o Senhor lhes conceda verdadeiro arrependimento. Também vocês devem manter-se sóbrios nessa questão. Não os tratem como inimigos, mas restaurem-nos como membros frágeis e errantes, para que salvem todo o corpo de vocês.[b] Agindo assim, vocês edificam uns aos outros.'
  revised_footnotes:
