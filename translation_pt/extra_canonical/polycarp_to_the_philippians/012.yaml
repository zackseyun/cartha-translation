base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/012.yaml
  text: 'I was deeply grieved for Valens, who was formerly a presbyter among you, because he understands so little of the office entrusted to him. Therefore, I warn you to keep away from greed and to be pure and truthful. Keep away from every evil.


    But if someone cannot control himself in these matters, how can he command another to do so? If anyone does not keep away from greed, he will be defiled by idolatry and judged as one of the Gentiles who do not know the judgment of the Lord. Nay, do we not know that the saints will judge the world, as Paul teaches?


    But I have neither found nor heard of any such thing among you, among whom the blessed Paul labored and who were his letters in the beginning. For he boasts about you in all those churches that alone knew God at that time; for we did not yet know Him.


    Therefore, I am deeply grieved for him and for his wife, to whom may the Lord grant true repentance. You yourselves also must be sober in this matter. Do not regard such people as enemies, but restore them as frail and erring members, so that you may save the whole body of you. For by doing this, you build one another up.'
translation:
  language: pt
  text: 'Eu me entristeci profundamente por Valente, que antes era presbítero entre vocês, pois ele compreende tão pouco o ministério que lhe foi confiado. Por isso, advirto vocês a se manterem longe da ganância, a serem puros e verdadeiros e a se afastarem de todo mal.


    Mas, se alguém não consegue dominar a si mesmo nessas questões, como pode ordenar a outro que o faça? Se alguém não se mantiver longe da ganância, será contaminado pela idolatria e julgado como um dos gentios que não conhecem o juízo do Senhor. Ora, não sabemos que os santos julgarão o mundo, como Paulo ensina?


    Contudo, não encontrei nem ouvi falar de coisa semelhante entre vocês, em cujo meio o bendito Paulo trabalhou e que eram suas cartas no princípio.[a] Pois ele se gloria de vocês em todas aquelas igrejas que, naquele tempo, eram as únicas que conheciam a Deus; nós, porém, ainda não o conhecíamos.


    Por isso, estou profundamente entristecido por ele e por sua esposa. Que o Senhor lhes conceda verdadeiro arrependimento. Também vocês devem manter-se sóbrios nessa questão. Não tratem essas pessoas como inimigas, mas restaurem-nas como membros frágeis e desviados, para que preservem são todo o corpo de vocês.[b] Agindo assim, vocês edificam uns aos outros.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “eram suas cartas no princípio” é incomum e seu sentido exato é incerto no testemunho disponível. Pode relacionar os filipenses às cartas de Paulo ou à parte inicial de uma carta dele. A formulação foi preservada até que se faça a revisão direta da tradição grega e latina.
    reason: Registrar uma dificuldade textual e sintática real sem resolvê-la por conjectura.
  - marker: b
    text: 'Ou: “para que salvem todo o corpo de vocês”. Aqui, a imagem parece ser a de conservar íntegra e saudável toda a comunidade.'
    reason: Preservar a amplitude do verbo do testemunho e esclarecer a metáfora corporal sem impor um sentido soteriológico técnico.
lexical_decisions:
- source_word: presbyter
  choice: presbítero
  rationale: Mantém o título ministerial antigo sem substituí-lo por um cargo eclesiástico moderno de alcance potencialmente diferente.
- source_word: covetousness
  choice: ganância
  rationale: Expressa em linguagem corrente o desejo desordenado de possuir, especialmente adequado ao vínculo do trecho com a idolatria.
- source_word: office
  choice: ministério
  rationale: Comunica uma responsabilidade confiada e exercida em favor da comunidade, com maior naturalidade do que “ofício” neste contexto.
- source_word: sober
  choice: manter-se sóbrios
  rationale: Preserva a metáfora moral de vigilância, autocontrole e lucidez, sem reduzi-la ao consumo de álcool.
- source_word: restore
  choice: restaurem-nas
  rationale: Retém o chamado à recuperação e reintegração dos membros que erraram, em contraste com tratá-los como inimigos.
- source_word: edify
  choice: edificam
  rationale: Conserva a imagem comunitária de construção mútua, já natural no registro cristão em português.
theological_decisions:
- issue: Relação entre ganância e idolatria
  choice: “será contaminado pela idolatria”
  alternative: “será considerado idólatra”
  rationale: A formulação escolhida preserva a linguagem de contaminação do testemunho fornecido e não transforma a relação em uma identificação doutrinária mais explícita do que o texto permite.
- issue: Os santos julgarão o mundo
  choice: Afirmação mantida como pergunta retórica e atribuída ao ensino de Paulo
  alternative: Explicar de que modo ou em que momento ocorrerá esse julgamento
  rationale: O trecho alude ao ensino paulino sem desenvolver sua mecânica; a tradução não deve resolver essa tensão escatológica.
- issue: “Salvar” o corpo comunitário
  choice: “preservem são todo o corpo de vocês”
  alternative: “salvem todo o corpo de vocês”
  rationale: A escolha conserva a metáfora corporal e torna claro o sentido provável de manter íntegra a comunidade, evitando impor uma afirmação técnica sobre salvação eterna.
- issue: Arrependimento de Valente e sua esposa
  choice: “Que o Senhor lhes conceda verdadeiro arrependimento”
  alternative: “Que o Senhor conceda a eles verdadeiro arrependimento”
  rationale: Mantém o arrependimento como dom pedido ao Senhor, sem especificar uma teoria sobre a relação entre graça e resposta humana.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O plural “vocês” evita arcaísmo; “presbítero” preserva o título histórico. A redação é provisória, pois o material fornecido declara que a revisão direta das fontes grega e latina ainda está pendente; por isso, a expressão difícil sobre as “cartas” de Paulo foi mantida e anotada, não harmonizada silenciosamente.
