  naturalness: 'O texto é claro e de registro apropriado. Duas alterações leves melhoram a fluência sem alterar o sentido: “Porém” funciona melhor que “Apenas” como conector adversativo neste contexto, e “eterno sumo sacerdote” é a ordem mais natural em português.'
  terminology: “Sagradas Escrituras”, “sumo sacerdote”, “longanimidade”, “quinhão”, “santos” e “dentre os mortos” mantêm registro bíblico compreensível. “Autoridades e governantes” traduz de forma prudente os termos políticos gerais, sem impor equivalências institucionais modernas. A nota sobre o colchete e a nota sobre o singular sintaticamente difícil são necessárias e bem orientadas.
