base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/013.yaml
  text: 'For I am convinced that you are well trained in the sacred writings, and nothing is hidden from you. But this has not been granted to me. Only, as it is said in these Scriptures, “Be angry and do not sin,” and, “Do not let the sun set on your wrath.” Blessed is the one who remembers this; and I trust that this is in you.


    Now may the God and Father of our Lord Jesus Christ, and the eternal High Priest himself, the [Son of God Jesus Christ, build you up in faith and truth, and in all gentleness and in all avoidance of wrath and in forbearance and long-suffering and in patient endurance and in purity; and may he grant you a lot and portion among his saints, and to us with you, and to all who are under heaven, who will believe in our Lord and God Jesus Christ and in his Father who raised him from the dead.


    Pray for all the saints. Pray also for kings and powers and princes, and for those who persecute and hate you and for the enemies of the cross, that your fruit may be manifest among all people, that you may be perfect in him.'
translation:
  language: pt
  text: '12 Pois estou convencido de que vocês são bem instruídos nas Sagradas Escrituras e de que nada lhes está oculto. A mim, porém, isso não foi concedido. Apenas, como se diz nessas Escrituras: “Fiquem irados, mas não pequem”, e: “Não deixem que o sol se ponha sobre a ira de vocês”. Feliz é quem se lembra disso; e confio que isso está presente em vocês.


    Que o Deus e Pai de nosso Senhor Jesus Cristo e o próprio sumo sacerdote eterno, [o Filho de Deus, Jesus Cristo,[a] os edifique[b] na fé e na verdade, em toda brandura, ausência de ira, tolerância, longanimidade, perseverança paciente e pureza. E que ele conceda a vocês quinhão e parte entre os seus santos; também a nós juntamente com vocês e a todos os que estão debaixo do céu e que vierem a crer em nosso Senhor e Deus Jesus Cristo e em seu Pai, que o ressuscitou dentre os mortos.


    Orem por todos os santos. Orem também pelos reis, pelas autoridades e pelos governantes, pelos que perseguem e odeiam vocês e pelos inimigos da cruz, para que o fruto de vocês se torne manifesto entre todos e para que vocês sejam perfeitos nele.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O colchete inicial reproduz o sinal de lacuna ou restauração presente no testemunho fornecido; não há colchete de fechamento correspondente nesse testemunho.
    reason: Preservar de modo transparente a incerteza textual indicada pela fonte de consulta.
  - marker: b
    text: 'A construção do testemunho é difícil: menciona “o Deus e Pai” e “o próprio sumo sacerdote eterno”, mas emprega a ação no singular. A tradução conserva essa tensão em vez de impor uma concordância no plural.'
    reason: Sinalizar uma ambiguidade sintática com possível relevância para a identificação do agente da bênção.
lexical_decisions:
- source_word: sacred writings
  choice: Sagradas Escrituras
  rationale: Expressão portuguesa corrente e digna para os escritos sagrados, preservando a referência explícita a textos reconhecidos como Escritura.
- source_word: Be ye angry and sin not
  choice: Fiquem irados, mas não pequem
  rationale: Mantém a forma imperativa e a tensão da citação, sem transformar a ira em simples hipótese.
- source_word: lot and portion
  choice: quinhão e parte
  rationale: Preserva o paralelismo distributivo e a linguagem de herança do testemunho.
- source_word: avoidance of wrath
  choice: ausência de ira
  rationale: Evita interpretar a expressão apenas como autocontrole e conserva seu sentido forte, embora pouco idiomático.
- source_word: forbearance and long-suffering and patient endurance
  choice: tolerância, longanimidade, perseverança paciente
  rationale: Mantém três virtudes distintas e evita fundi-las em uma única ideia genérica de paciência.
- source_word: powers and princes
  choice: autoridades e governantes
  rationale: Usa termos políticos compreensíveis no português moderno sem pressupor títulos institucionais específicos.
- source_word: fruit
  choice: fruto
  rationale: Conserva a metáfora moral e espiritual do texto.
theological_decisions:
- issue: Identificação de Jesus Cristo como “nosso Senhor e Deus”
  choice: nosso Senhor e Deus Jesus Cristo
  alternative: nosso Senhor Jesus Cristo, que é Deus
  rationale: Preserva a formulação compacta e sua força cristológica sem acrescentar uma oração explicativa ausente do testemunho.
- issue: Relação entre o Pai e Jesus na bênção
  choice: manter os dois referentes e o verbo no singular, com nota
  alternative: usar o plural “os edifiquem”
  rationale: O testemunho fornecido apresenta uma construção sintaticamente difícil e depois retoma um agente no singular. A tradução não resolve silenciosamente se a ação deve ser atribuída conjuntamente ou ao referente mais próximo.
- issue: “perfeitos nele”
  choice: perfeitos nele
  alternative: maduros nele
  rationale: Mantém a amplitude teológica e moral de “perfect”, sem restringi-la ao conceito de maturidade.
- issue: Os que “vierem a crer”
  choice: que vierem a crer
  alternative: que crerão
  rationale: Expressa naturalmente em português a referência futura sem determinar se se trata de previsão, condição ou grupo definido.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais como “vocês”. A tradução é provisória porque o material fornecido declara que a revisão direta do grego e do latim ainda está pendente; por isso, não se alegam decisões filológicas além do testemunho público em inglês. Mantiveram-se alguns termos bíblicos tradicionais, como “longanimidade”, “quinhão” e “dentre os mortos”, onde ajudam a conservar distinções e ressonâncias do texto.
