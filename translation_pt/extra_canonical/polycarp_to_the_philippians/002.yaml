review_pass:
  verdict: revise
  source_fidelity: 'A revisão do grego disponível exige correções em pontos materiais. μιμήματα τῆς ἀληθοῦς ἀγάπης não designa simplesmente “seguidores”, mas pessoas apresentadas como exemplos/expressões do verdadeiro amor. Além disso, τοῖς πρέπουσιν τοῖς ἁγίοις δεσμοῖς é mais bem expresso como grilhões dignos dos santos, e λύσας τὰς ὠδῖνας τοῦ ᾅδου não afirma de modo inequívoco que Cristo foi libertado das dores do Hades: descreve a ação de Deus ao desfazer essas dores. A redação revista preserva a coordenação “por Deus e por nosso Senhor” e a ambiguidade da imagem do Hades.'
  naturalness: O texto é geralmente claro e de registro adequado, mas “Ele suportou enfrentar” é pouco idiomático e a retomada “Alegrei-me também” transforma desnecessariamente a segunda oração coordenada em uma nova declaração. A revisão usa períodos naturais, mantendo a solenidade sem arcaísmo.
  terminology: “Verdadeiro amor” fica em minúsculas, pois o grego não impõe personificação; a nota anterior atribuía peso excessivo à capitalização editorial do testemunho inglês. “Grilhões” comunica melhor o contexto de prisão do que “correntes”, e “Hades” é mantido sem substituição doutrinariamente restritiva.
  issues:
  - severity: high
    issue: “Seguidores do verdadeiro Amor” para μιμήματα τῆς ἀληθοῦς ἀγάπης
    rationale: A expressão grega se refere a exemplos, modelos ou expressões do verdadeiro amor, não a seguidores. A tradução anterior altera a caracterização das pessoas recebidas.
  - severity: medium
    issue: “Santas correntes” para os vínculos “dignos dos santos”
    rationale: O qualificativo πρέπουσιν (“apropriados, dignos”) se relaciona com os grilhões em referência aos santos; “santas” desloca o sentido.
  - severity: high
    issue: “Deus o ressuscitou, libertando-o das dores do Hades”
    rationale: O particípio λύσας descreve Deus desfazendo/soltando as dores do Hades. A forma anterior introduz Cristo como objeto direto dessa libertação, restringindo uma construção que o texto não formula assim.
  - severity: medium
    issue: Capitalização de “Amor” e nota a
    rationale: A capitalização do testemunho inglês não basta para personificar o substantivo grego. A versão deve preservar a expressão sem decidir o referente por meio de maiúscula.
  - severity: low
    issue: “Ele suportou enfrentar até mesmo a morte”
    rationale: A construção é pesada em português e duplica a ideia. “Enfrentou até a morte” é natural e conserva o sentido.
  revised_text: '**Policarpo aos Filipenses — 1**


    Alegrei-me muito com vocês em nosso Senhor Jesus Cristo, porque acolheram aqueles que são exemplos do verdadeiro amor e os acompanharam em sua viagem, como convinha a vocês — homens cingidos por grilhões dignos dos santos, que são as coroas dos que foram verdadeiramente escolhidos por Deus e por nosso Senhor;


    bem como porque a raiz firme da fé de vocês, famosa desde os tempos antigos, permanece até agora e produz fruto para nosso Senhor Jesus Cristo. Ele enfrentou até a morte por nossos pecados, e Deus o ressuscitou, desfazendo as dores do Hades.[a] Embora não o tenham visto, vocês creem nele com alegria indescritível e cheia de glória. Muitos desejam entrar nessa alegria, pois vocês sabem que são salvos pela graça, não por obras, mas pela vontade de Deus, por meio de Jesus Cristo.'
  revised_footnotes:
  - marker: a
    text: 'Hades: termo antigo para o mundo ou domínio dos mortos. A expressão “dores do Hades” foi mantida, sem substituí-la por “inferno” ou reduzi-la a uma explicação teológica específica.'
    reason: Preserva o termo e a imagem do texto, bem como a construção que descreve Deus desfazendo as dores do Hades.
  revision_rationale: A revisão dá prioridade ao texto grego sobre o testemunho inglês provisório. Ela corrige “seguidores” para uma formulação que representa μιμήματα como pessoas que exemplificam o verdadeiro amor, elimina a personificação não exigida por meio de maiúscula, ajusta a descrição dos grilhões e evita fazer de Cristo o objeto explícito da ação em “desfazendo as dores do Hades”. A nota remanescente está ancorada em [a] e corresponde exatamente ao termo anotado.
