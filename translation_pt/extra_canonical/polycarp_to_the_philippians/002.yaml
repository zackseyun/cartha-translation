    E porque a raiz firme da fé de vocês, conhecida desde os primeiros tempos, permanece até agora e produz fruto para nosso Senhor Jesus Cristo. Ele suportou enfrentar até mesmo a morte por nossos pecados, e Deus o ressuscitou, tendo desfeito as dores do Hades.[b] Nele, embora não o tenham visto, vocês creem com alegria indescritível e cheia de glória. Muitos desejam entrar nessa alegria, pois vocês sabem que são salvos pela graça, não por obras, mas pela vontade de Deus, por meio de Jesus Cristo.'
