base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/002.yaml
  text: 'I rejoiced greatly with you in our Lord Jesus Christ because you welcomed the followers of true Love and escorted them on their way, as was fitting for you—those men encircled in holy chains, which are the crowns of those who are truly chosen by God and our Lord;


    and because the steadfast root of your faith, renowned since the earliest times, remains until now and bears fruit for our Lord Jesus Christ. He endured even death for our sins, and God raised him, releasing the pains of Hades. In him,


    though you did not see him, you believe with inexpressible and glorious joy. Many desire to enter into this joy, since you know that you are saved by grace, not by works, but by the will of God through Jesus Christ.'
translation:
  language: pt
  text: '**Policarpo aos Filipenses — 1**


    Alegrei-me muito com vocês em nosso Senhor Jesus Cristo, porque acolheram os seguidores do verdadeiro Amor[a] e os acompanharam em sua viagem, como era digno de vocês — homens envolvidos em santas correntes, que são as coroas daqueles que foram verdadeiramente escolhidos por Deus e por nosso Senhor.


    Alegrei-me também porque a raiz firme da fé de vocês, conhecida desde os primeiros tempos, permanece até agora e produz fruto para nosso Senhor Jesus Cristo. Ele suportou enfrentar até mesmo a morte por nossos pecados, e Deus o ressuscitou, libertando-o das dores do Hades.[b] Embora não o tenham visto, vocês creem nele com alegria indescritível e cheia de glória. Muitos desejam entrar nessa alegria, pois vocês sabem que são salvos pela graça, não por obras, mas pela vontade de Deus, por meio de Jesus Cristo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Verdadeiro Amor” também pode ser entendido como “amor verdadeiro”. A inicial maiúscula preserva a possível personificação presente no testemunho usado para esta versão.
    reason: Sinaliza uma ambiguidade lexical e referencial que não deve ser resolvida sem a revisão direta do grego e do latim.
  - marker: b
    text: 'Hades: termo antigo para o mundo ou domínio dos mortos; aqui não foi substituído por “inferno”, pois essa palavra poderia restringir indevidamente o sentido.'
    reason: Evita uma identificação teológica excessivamente específica e preserva a imagem do testemunho.
lexical_decisions:
- source_word: true Love (English witness; underlying Greek review pending)
  choice: verdadeiro Amor
  rationale: Preserva a formulação e a personificação sugerida pela inicial maiúscula no testemunho disponível, sem identificar de modo definitivo o referente.
- source_word: saintly bonds
  choice: santas correntes
  rationale: Mantém a imagem concreta e honorífica das correntes de prisioneiros por causa da fé.
- source_word: diadems
  choice: coroas
  rationale: “Coroas” comunica naturalmente em português a imagem antiga de honra e vitória; “diademas” seria menos corrente e poderia sugerir apenas realeza.
- source_word: steadfast root
  choice: raiz firme
  rationale: Conserva a metáfora agrícola e expressa estabilidade em linguagem atual.
- source_word: Hades
  choice: Hades
  rationale: Translitera o termo e evita substituí-lo interpretativamente por “inferno”, “sepultura” ou “morte”.
- source_word: joy unutterable and full of glory
  choice: alegria indescritível e cheia de glória
  rationale: Preserva os dois qualificativos e a provável ressonância de 1 Pedro 1.8 em português natural.
theological_decisions:
- issue: Referência de “verdadeiro Amor”
  choice: Manter “Amor” com inicial maiúscula e acrescentar nota de ambiguidade
  alternative: Traduzir como “amor verdadeiro” em sentido puramente abstrato ou identificar explicitamente o Amor com Cristo
  rationale: O testemunho inglês personifica a expressão, mas a revisão direta da tradição grega e latina ainda está pendente; a tradução não deve resolver o referente sem base suficiente.
- issue: “Escolhidos por Deus e por nosso Senhor”
  choice: Preservar os dois termos coordenados
  alternative: Fundir a expressão como “escolhidos por nosso Deus e Senhor”
  rationale: A redação disponível distingue “Deus” e “nosso Senhor”; fundi-los imporia uma decisão sintática e cristológica que a base fornecida não autoriza.
- issue: Dores do Hades
  choice: Manter a expressão figurada e o termo Hades
  alternative: Interpretar como “poder da morte”, “dores da morte” ou “tormentos do inferno”
  rationale: A formulação ecoa linguagem bíblica tradicional e admite mais de uma compreensão; a tradução conserva essa tensão.
- issue: Graça, obras e vontade de Deus
  choice: 'Traduzir diretamente: “salvos pela graça, não por obras, mas pela vontade de Deus”'
  alternative: Acrescentar explicações sobre mérito, fé ou predestinação
  rationale: O texto deve manter sua afirmação soteriológica sem importar formulações confessionais posteriores.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Empregou-se “vocês” para o plural e períodos moderadamente segmentados para clareza. Esta é uma versão provisória baseada no testemunho inglês de domínio público fornecido e consultada à luz da POB inglesa; a revisão direta da tradição manuscrita grega e latina permanece pendente.
