base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/014.yaml
  text: 'You yourselves and Ignatius wrote to me, asking that if anyone should go to Syria, he might carry your letters there. And I will do this, if I get a suitable opportunity, either I myself or the one whom I shall send as an ambassador on your behalf also.


    The letters of Ignatius which were sent to us by him, and as many others as we had with us, we send to you, according as you gave charge; they are attached to this letter. From them you will be able to gain great advantage, for they comprise faith and endurance and every kind of edification that pertain to our Lord. Moreover, concerning Ignatius himself and those who were with him, if you have any reliable news, let us know.'
translation:
  language: pt
  text: 'Vocês mesmos e Inácio me escreveram, pedindo que, se alguém fosse à Síria, levasse para lá as cartas de vocês. Farei isso quando surgir uma oportunidade adequada, seja eu mesmo, seja aquele que eu enviar também como representante de vocês.


    Conforme pediram, enviamos a vocês as cartas de Inácio que ele nos remeteu, juntamente com todas as outras que tínhamos conosco. Elas seguem anexas a esta carta. Vocês poderão tirar grande proveito delas, pois contêm fé, perseverança e toda espécie de edificação relacionada ao nosso Senhor. Além disso, se tiverem alguma notícia segura a respeito do próprio Inácio e dos que estavam com ele, informem-nos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta da tradição manuscrita grega e latina ainda está pendente.
    reason: A fonte disponibilizada identifica expressamente a necessidade de futura conferência nas línguas antigas; a nota torna transparente a base textual limitada desta versão.
lexical_decisions:
- source_word: fit opportunity
  choice: oportunidade adequada
  rationale: Expressa de modo natural a ideia de uma ocasião apropriada, sem acrescentar urgência ou certeza.
- source_word: ambassador
  choice: representante
  rationale: No contexto epistolar, indica alguém enviado em nome da comunidade; evita a conotação diplomática estatal que “embaixador” costuma ter no português moderno.
- source_word: endurance
  choice: perseverança
  rationale: Termo corrente e digno que comunica constância sob provação.
- source_word: edification
  choice: edificação
  rationale: Preserva o vocabulário cristão antigo e continua compreensível no português contemporâneo.
- source_word: sure tidings
  choice: notícia segura
  rationale: Mantém a ênfase na confiabilidade da informação sem pressupor seu conteúdo.
theological_decisions:
- issue: Relação de “fé, perseverança e toda espécie de edificação” com o Senhor
  choice: relacionada ao nosso Senhor
  alternative: que pertencem ao nosso Senhor
  rationale: A formulação conserva a relação ampla e um tanto ambígua do testemunho inglês, sem definir se todos os elementos “pertencem” ao Senhor ou se dizem respeito a ele.
- issue: Situação de Inácio e de seus companheiros
  choice: a respeito do próprio Inácio e dos que estavam com ele
  alternative: sobre o destino de Inácio e de seus companheiros
  rationale: Não explicita prisão, martírio ou destino final, pois esses detalhes não estão declarados neste trecho.
translation_notes:
  register: Português moderno, amplamente internacional e de boa legibilidade brasileira. Emprega “vocês” para a segunda pessoa do plural, frases diretas e tom epistolar digno. Evita arcaísmos como “vós”, preservando termos cristãos ainda correntes, como “fé”, “perseverança” e “edificação”.
