review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho inglês fornecido e não introduz detalhes sobre a situação de Inácio. A formulação temporal «quando surgir uma oportunidade» torna mais afirmativa a condição expressa por «if I get a fit opportunity»; convém conservar explicitamente o «se».
  naturalness: O português é claro, moderno e adequado ao tom epistolar. «Se eu tiver uma oportunidade adequada» soa natural e preserva melhor a modalidade condicional. «Que dizem respeito ao nosso Senhor» torna explícito que a expressão final se aplica à enumeração inteira.
  terminology: «Perseverança», «edificação», «Inácio», «Síria» e «representante» são escolhas apropriadas. «Representante» comunica a função de enviado sem a conotação estatal contemporânea de «embaixador».
  issues:
  - severity: low
    issue: Modalidade condicional em «Farei isso quando surgir uma oportunidade adequada».
    rationale: O testemunho diz «if I get a fit opportunity», apresentando a ação como dependente de Polycarpo obter uma ocasião propícia, não apenas da futura ocorrência dela.
  - severity: low
    issue: Concordância e alcance em «edificação relacionada ao nosso Senhor».
    rationale: Embora compreensível, o singular «relacionada» pode parecer referir-se somente a «edificação». Uma oração no plural deixa claro que fé, perseverança e toda espécie de edificação são os elementos em questão, sem interpretar além do testemunho.
  revised_text: 'Vocês mesmos e Inácio me escreveram, pedindo que, se alguém fosse à Síria, levasse para lá as cartas de vocês. Farei isso se eu tiver uma oportunidade adequada, seja eu mesmo, seja aquele que eu enviar também como representante de vocês.


    Conforme pediram, enviamos a vocês as cartas de Inácio que ele nos remeteu, juntamente com todas as outras que tínhamos conosco. Elas seguem anexas a esta carta. Vocês poderão tirar grande proveito delas, pois contêm fé, perseverança e toda espécie de edificação que dizem respeito ao nosso Senhor. Além disso, se tiverem alguma notícia segura a respeito do próprio Inácio e dos que estavam com ele, informem-nos.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta da tradição manuscrita grega e latina ainda está pendente.
    reason: A fonte disponibilizada identifica expressamente a necessidade de futura conferência nas línguas antigas; a nota torna transparente a base textual limitada desta versão.
