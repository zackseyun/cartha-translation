review_pass:
  verdict: revise
  source_fidelity: A recomendação de Crescente e a referência à sua conduta são transmitidas adequadamente. Contudo, «Recebam igualmente sua irmã como pessoa recomendada» acrescenta «igualmente», transforma uma declaração futura em imperativo e explicita o acolhimento de modo que vai além de «tereis a irmã dele recomendada». A despedida também deve conservar a relação menos definida entre «no Senhor Jesus Cristo» e «em graça».
  naturalness: O português é claro, moderno e digno. «Vocês terão a irmã dele recomendada» é natural no contexto epistolar e preserva melhor a construção de recomendação; «Passem bem no Senhor Jesus Cristo, na graça» mantém uma despedida fluente sem fundir indevidamente os sintagmas.
  terminology: «Crescente», «irrepreensível», «Senhor Jesus Cristo» e «todos os seus» são escolhas adequadas. A formulação revista preserva «graça» como expressão final independente, sem atribuí-la explicitamente como possessivo a Cristo.
  issues:
  - severity: medium
    issue: A sentença sobre a irmã de Crescente foi ampliada e reconfigurada.
    rationale: '«Recebam igualmente» não corresponde explicitamente ao testemunho fornecido: «equally» não está presente, e «you shall have ... commended» é declaração futura, não ordem direta de recebê-la. «Vocês terão a irmã dele recomendada» conserva a construção e sua concisão.'
  - severity: medium
    issue: A despedida resolve uma ambiguidade sintática do texto de consulta.
    rationale: «na graça do Senhor Jesus Cristo» faz de «graça» um complemento possessivo/dependente de «Senhor Jesus Cristo», ao passo que o testemunho diz «in the Lord Jesus Christ in grace». A redação revista mantém ambos os sintagmas sem impor essa relação.
  revised_text: Escrevo-lhes estas coisas por meio de Crescente, a quem recomendei a vocês há pouco e agora torno a recomendar, pois ele tem vivido de modo irrepreensível entre nós; e creio que também entre vocês será assim. Vocês terão a irmã dele recomendada quando ela chegar até vocês. Passem bem no Senhor Jesus Cristo, na graça, vocês e todos os seus. Amém.[a]
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta da tradição manuscrita grega e latina ainda está pendente.
    reason: Torna transparente que, nesta etapa, não foi possível verificar diretamente as formas e variantes das fontes antigas.
  revision_rationale: A revisão remove a adição de «igualmente», restaura o valor declarativo futuro da frase sobre a irmã de Crescente e preserva a justaposição ambígua de «no Senhor Jesus Cristo» e «na graça» na despedida. As demais escolhas do rascunho permanecem apropriadas ao testemunho inglês de consulta e ao registro português solicitado.
