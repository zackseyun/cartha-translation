base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/015.yaml
  text: I write these things to you through Crescens, whom I commended to you recently and now commend to you, for he has walked blamelessly with us; and I believe that he will do so with you likewise. But you shall have his sister commended when she comes to you. Fare well in the Lord Jesus Christ in grace, you and all yours. Amen.
translation:
  language: pt
  text: Escrevo-lhes estas coisas por meio de Crescente, a quem recomendei a vocês há pouco e agora torno a recomendar, pois ele tem vivido de modo irrepreensível entre nós; e creio que também entre vocês será assim. Recebam igualmente sua irmã como pessoa recomendada, quando ela chegar até vocês. Passem bem, na graça do Senhor Jesus Cristo, vocês e todos os seus. Amém.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A revisão direta da tradição manuscrita grega e latina ainda está pendente.
    reason: Torna transparente que, nesta etapa, não foi possível verificar diretamente as formas e variantes das fontes antigas.
lexical_decisions:
- source_word: by Crescens
  choice: por meio de Crescente
  rationale: Expressa que Crescente é o portador da carta, sem sugerir que seja coautor; usa a forma portuguesa tradicional do nome.
- source_word: commended
  choice: recomendei / como pessoa recomendada
  rationale: Mantém a ideia de apresentação favorável e pedido implícito de acolhimento, evitando acrescentar detalhes ausentes no testemunho disponível.
- source_word: walked blamelessly
  choice: tem vivido de modo irrepreensível
  rationale: Traduz o sentido ético da expressão de maneira natural em português moderno; “vivido” comunica melhor a conduta habitual do que o decalque “andado”.
- source_word: all yours
  choice: todos os seus
  rationale: Preserva a formulação ampla e algo indeterminada do testemunho, sem decidir se se refere à família, à casa ou à comunidade ligada aos destinatários.
theological_decisions:
- issue: Relação sintática de “in grace” com a despedida e com “the Lord Jesus Christ”
  choice: Passem bem, na graça do Senhor Jesus Cristo
  alternative: Passem bem no Senhor Jesus Cristo, em graça
  rationale: A redação escolhida é natural em português e conserva graça, Senhor e despedida estreitamente associados, sem desenvolver uma interpretação doutrinária adicional.
- issue: Valor temporal de “I believe also with you in like manner”
  choice: creio que também entre vocês será assim
  alternative: creio que também entre vocês tenha sido do mesmo modo
  rationale: Segue a leitura contextual adotada pelo texto inglês de consulta, segundo a qual Policarpo espera conduta semelhante junto aos filipenses; a decisão permanece provisória até a revisão direta da tradição grega e latina.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção preserva o caráter pessoal de uma recomendação epistolar antiga. Evitou-se arcaísmo como “saudai” ou o decalque “andou irrepreensivelmente”; manteve-se, porém, a concisão solene da despedida.
