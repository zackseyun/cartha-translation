review_pass:
  verdict: revise
  source_fidelity: A minuta acompanha de perto o testemunho inglês fornecido e preserva adequadamente a cadeia de referentes, a condição em «se fizermos» e as duas citações finais. Contudo, «Não retribuamos» transforma uma abstinência subordinada na oração condicional em uma nova exortação independente. A formulação deve permanecer ligada a «abstendo-nos».
  naturalness: O português é em geral claro, moderno e apropriado ao tom exortativo. «Cinjam a cintura» não é uma formulação idiomática natural para a imagem de cingir os lombos; uma equivalência funcional no texto, com nota literal, é preferível. A redação da medida também deve indicar que a medida é aplicada aos destinatários, não que eles próprios são literalmente «medidos».
  terminology: «Temor», «injustiça», «cobiça», «amor ao dinheiro», «maledicência», «falso testemunho», «vivos e mortos» e «reino de Deus» são escolhas adequadas. Mantêm-se «Felizes» e «os pobres», sem harmonização com formulações canônicas distintas.
  issues:
  - severity: medium
    issue: «Não retribuamos mal por mal» muda a sintaxe da fonte.
    rationale: 'O trecho descreve a conduta que acompanha fazer a vontade de Deus, caminhar nos mandamentos e amar o que ele amou: «abstendo-nos ... sem retribuir». O subjuntivo independente introduz uma exortação adicional que não está explicitamente estruturada assim no testemunho.'
  - severity: medium
    issue: «Cinjam a cintura» é pouco idiomático e pode sugerir circundar a cintura, em vez de ajustar a veste para agir.
    rationale: A imagem antiga é a de cingir os lombos. «Preparem-se para agir» transmite sua função de forma natural; a nota conserva a expressão literal e a imagem material.
  - severity: low
    issue: «Vocês serão medidos novamente» não comunica com precisão a reciprocidade da medida aplicada aos ouvintes.
    rationale: A fonte diz que a medida usada pelos destinatários lhes será aplicada. «A medida que usarem será usada para medir vocês» torna essa relação explícita sem ampliar o sentido.
  revised_text: 'Portanto, preparem-se para agir[a] e sirvam a Deus com temor e verdade. Abandonem a conversa vã e vazia e o erro da maioria, pois vocês creram naquele que ressuscitou dentre os mortos nosso Senhor Jesus Cristo e lhe deu glória e um trono à sua direita. A ele foram sujeitas todas as coisas que estão no céu e na terra; a ele serve toda criatura que respira. Ele vem como juiz dos vivos e dos mortos. Deus requererá seu sangue daqueles que lhe desobedecem.[b]


    Aquele que o ressuscitou dentre os mortos também nos ressuscitará, se fizermos a sua vontade, andarmos em seus mandamentos e amarmos aquilo que ele amou, abstendo-nos de toda injustiça, cobiça, amor ao dinheiro, maledicência e falso testemunho, sem retribuir mal por mal, insulto por insulto, golpe por golpe ou maldição por maldição.


    Em vez disso, lembremo-nos das palavras que o Senhor proferiu ao ensinar: “Não julguem, para que não sejam julgados. Perdoem, e vocês serão perdoados. Tenham misericórdia, para que recebam misericórdia. A medida que usarem será usada para medir vocês”. E também: “Felizes os pobres e os perseguidos por causa da justiça, pois deles é o reino de Deus”.'
  revised_footnotes:
  - marker: a
    text: 'Literalmente, “cinjam os lombos”: imagem de prender a roupa comprida à cintura para ficar pronto para agir.'
