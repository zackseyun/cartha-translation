review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o testemunho fornecido e preserva adequadamente as listas morais, a condição ligada à ressurreição e as duas citações do Senhor. Contudo, “à sua direita” desloca para Jesus um referente que, no encadeamento do testemunho e na trilha inglesa, é Deus; isso deve ser explicitado. Também convém manter de modo consistente a segunda pessoa do plural na exortação negativa.
  naturalness: O português é moderno, legível e adequado ao registro exortativo. “Cinjam a cintura” conserva a imagem sem arcaísmo excessivo, com nota explicativa. “Mas lembrem-se” e “Não retribuam” dão à última seção uma progressão mais direta e coerente.
  terminology: “Temor”, “mandamentos”, “injustiça”, “cobiça”, “amor ao dinheiro”, “maledicência”, “falso testemunho”, “vivos e mortos” e “reino de Deus” são escolhas apropriadas. “Felizes” é uma equivalência moderna aceitável para a bem-aventurança. A nota sobre o sangue deve explicar o idioma judicial e a ambiguidade do referente de “lhe”, sem desfazer no texto essa ambiguidade.
  issues:
  - severity: high
    issue: O referente de “à sua direita” ficou ambíguo e tende a ser lido como Jesus.
    rationale: O antecedente imediato de “sua” na redação portuguesa é Jesus Cristo, mas o testemunho inglês especifica que a posição/trono é à direita de Deus. A tradução deve explicitar “à direita de Deus”.
  - severity: medium
    issue: “Não retribuamos” muda a pessoa verbal em relação ao restante da passagem.
    rationale: 'A seção é dirigida a “vocês”/segunda pessoa plural: “fizerem”, “andarem”, “amarem”, “abstendo-se”. “Não retribuam” preserva a mesma interlocução.'
  - severity: low
    issue: “Em vez disso, lembremo-nos” é uma reformulação menos direta da transição exortativa.
    rationale: “Mas lembrem-se” preserva melhor o contraste adversativo e a continuidade das ordens no plural.
  revised_text: 'Portanto, cinjam a cintura[a] e sirvam a Deus com temor e verdade. Abandonem a conversa vã e vazia e o erro da maioria, pois vocês creram naquele que ressuscitou dentre os mortos nosso Senhor Jesus Cristo e lhe deu glória e um trono à direita de Deus. A ele foram sujeitas todas as coisas que estão no céu e na terra; a ele serve toda criatura que respira. Ele vem como juiz dos vivos e dos mortos. Deus exigirá deles o seu sangue, daqueles que lhe desobedecem.[b]


    Aquele que o ressuscitou dentre os mortos também nos ressuscitará, se fizermos a sua vontade, andarmos em seus mandamentos e amarmos aquilo que ele amou, abstendo-nos de toda injustiça, cobiça, amor ao dinheiro, maledicência e falso testemunho. Não retribuam mal por mal, insulto por insulto, golpe por golpe ou maldição por maldição.


    Mas lembrem-se das palavras que o Senhor proferiu ao ensinar: “Não julguem, para que não sejam julgados. Perdoem, e vocês serão perdoados. Tenham misericórdia, para que recebam misericórdia. Com a medida que usarem, vocês serão medidos novamente”. E também: “Felizes os pobres e os perseguidos por causa da justiça, pois deles é o reino de Deus”.'
  revised_footnotes:
  - marker: a
    text: 'Literalmente, “cinjam os lombos”: imagem de prender a roupa comprida à cintura para ficar pronto para agir.'
    reason: Esclarece a imagem idiomática antiga conservada em “cinjam a cintura”.
  - marker: b
    text: A construção associa “o seu sangue” a Jesus Cristo. O pronome em “lhe desobedecem” pode referir-se a Deus ou a Cristo. “Exigir o sangue” é uma expressão judicial que indica pedir contas por sua morte.
    reason: Preserva a ambiguidade pronominal e explica o sentido forense da expressão, sem impor uma leitura doutrinária.
  revision_rationale: A revisão explicita que a glória e o trono são dados a Cristo à direita de Deus, conforme o encadeamento do testemunho e a trilha inglesa. Ajusta ainda a coerência da pessoa verbal e torna a transição final mais diretamente exortativa. A formulação sobre o sangue foi levemente reordenada para tornar claro que se trata do sangue de Cristo, conservando a ambiguidade do pronome em “lhe desobedecem”, explicada em nota.
