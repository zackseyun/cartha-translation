base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/003.yaml
  text: 'Therefore, prepare yourselves for action and serve God in fear and truth. Abandon vain and empty talk and the error of the many, because you have believed in him who raised our Lord Jesus Christ from the dead and gave him glory and a throne at God’s right hand. All things in heaven and on earth were subjected to him. Every creature that breathes serves him. He is coming as judge of the living and the dead. God will require his blood from those who disobey him.


    Now he who raised him from the dead will also raise us, if we do his will, walk in his commandments, and love the things he loved, abstaining from all unrighteousness, covetousness, love of money, evil speaking, and false witness—not repaying evil for evil, insult for insult, blow for blow, or curse for curse.


    Instead, remember the words the Lord spoke when he taught: “Do not judge, so that you will not be judged. Forgive, and you will be forgiven. Have mercy, so that you may receive mercy. With the measure you use, it will be measured to you again.” And again: “Blessed are the poor and those who are persecuted for righteousness’ sake, for theirs is the kingdom of God.”'
translation:
  language: pt
  text: 'Portanto, cinjam a cintura[a] e sirvam a Deus com temor e verdade. Abandonem a conversa vã e vazia e o erro da maioria, pois vocês creram naquele que ressuscitou dentre os mortos nosso Senhor Jesus Cristo e lhe deu glória e um trono à sua direita. A ele foram sujeitas todas as coisas que estão no céu e na terra; a ele serve toda criatura que respira. Ele vem como juiz dos vivos e dos mortos. Deus requererá seu sangue daqueles que lhe desobedecem.[b]


    Aquele que o ressuscitou dentre os mortos também nos ressuscitará, se fizermos a sua vontade, andarmos em seus mandamentos e amarmos aquilo que ele amou, abstendo-nos de toda injustiça, cobiça, amor ao dinheiro, maledicência e falso testemunho. Não retribuamos mal por mal, insulto por insulto, golpe por golpe ou maldição por maldição.


    Em vez disso, lembremo-nos das palavras que o Senhor proferiu ao ensinar: “Não julguem, para que não sejam julgados. Perdoem, e vocês serão perdoados. Tenham misericórdia, para que recebam misericórdia. Com a medida que usarem, vocês serão medidos novamente”. E também: “Felizes os pobres e os perseguidos por causa da justiça, pois deles é o reino de Deus”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Literalmente, “cinjam os lombos”: imagem de prender a roupa comprida à cintura para ficar pronto para agir.'
    reason: Esclarecer um idioma antigo preservado parcialmente no texto.
  - marker: b
    text: A construção associa “seu sangue” a Jesus Cristo; o pronome em “lhe desobedecem” pode referir-se a Deus ou a Cristo. “Requerer o sangue” significa exigir prestação de contas por sua morte.
    reason: Preservar e explicar a ambiguidade pronominal e o idioma judicial sem resolvê-los silenciosamente.
lexical_decisions:
- source_word: gird up your loins (ἀναζωσάμενοι τὰς ὀσφύας, conforme a tradição grega conhecida)
  choice: cinjam a cintura
  rationale: Conserva a imagem antiga de preparar a roupa para agir, mas usa uma formulação portuguesa inteligível; a nota explicita o sentido idiomático.
- source_word: fear and truth
  choice: temor e verdade
  rationale: Mantém os dois substantivos e evita reduzir “temor” a mero respeito ou “verdade” a sinceridade.
- source_word: vain and empty talking
  choice: conversa vã e vazia
  rationale: Reproduz a ênfase redundante do testemunho sem recorrer a vocabulário excessivamente arcaico.
- source_word: quick and dead
  choice: vivos e mortos
  rationale: Emprega o sentido histórico de “quick”, isto é, vivos, em português corrente e solene.
- source_word: covetousness, love of money
  choice: cobiça, amor ao dinheiro
  rationale: Preserva a distinção e a acumulação entre o desejo ganancioso em geral e o apego específico ao dinheiro.
- source_word: evil speaking
  choice: maledicência
  rationale: Expressa fala difamatória ou nociva em registro digno, sem restringi-la apenas a insultos.
- source_word: Blessed
  choice: Felizes
  rationale: Comunica de modo natural a condição declarada nas bem-aventuranças, sem acrescentar uma interpretação sacramental ou denominacional.
theological_decisions:
- issue: Referente daquele que dá glória e um trono
  choice: “lhe deu glória e um trono à sua direita”
  alternative: “deu-lhe glória e o fez sentar-se à direita de Deus”
  rationale: A opção escolhida mantém a formulação do testemunho e evita inserir o verbo “sentar” ou harmonizar plenamente com uma passagem canônica específica.
- issue: Referentes em “Deus requererá seu sangue daqueles que lhe desobedecem”
  choice: Preservar os pronomes potencialmente ambíguos e explicar em nota
  alternative: Explicitar “o sangue de Cristo” e “os que desobedecem a Deus”
  rationale: O encadeamento permite relacionar “seu sangue” a Cristo, mas a referência de “lhe” pode ser percebida como Deus ou Cristo. A tradução não resolve silenciosamente essa tensão.
- issue: Ressurreição condicionada pela oração com “se”
  choice: Manter “também nos ressuscitará, se fizermos...”
  alternative: 'Reformular como simples evidência moral: “e, como resultado, faremos...”'
  rationale: Preserva a forma condicional e sua tensão teológica, sem impor uma sistematização posterior.
- issue: Identidade dos pobres
  choice: “os pobres”
  alternative: “os pobres em espírito”
  rationale: O testemunho fornecido diz apenas “os pobres”; não se harmoniza a citação com uma forma canônica mais extensa.
- issue: Reino de Deus
  choice: “reino de Deus”
  alternative: “reino dos céus”
  rationale: Mantém a forma transmitida no testemunho em vez de harmonizá-la com Mateus.
translation_notes:
  register: 'Português moderno, amplamente internacional e com boa legibilidade brasileira; tom exortativo, digno e comunitário, com tratamento por “vocês”. A redação conserva paralelismos e repetições relevantes, mas evita arcaísmos como “cingir os lombos” no corpo principal. Como o material fornecido identifica a revisão direta do grego/latim como pendente e apresenta sobretudo um testemunho inglês de domínio público, esta é uma minuta publicação provisória: decisões que dependem da forma exata dos manuscritos devem ser auditadas contra a tradição grega e latina antes da edição definitiva.'
