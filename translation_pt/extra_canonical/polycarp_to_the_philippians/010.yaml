review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês fornecido: preserva a exortação à obediência, a «palavra da justiça», a perseverança, a metáfora da corrida, a presença do Senhor e a formulação sobre aquele que morreu e foi ressuscitado por Deus. Contudo, «saíram do meio de vocês» pode sugerir afastamento ou saída, enquanto o testemunho diz que outros «vieram» dentre eles.'
  naturalness: O registro é claro e digno. «Estejam convencidos» é possível, mas «convencidos de que» liga-se mais diretamente à construção participial do testemunho. «Lugar que lhes é devido» é compreensível, embora «lugar que lhes é próprio» seja mais idiomático sem alterar o sentido.
  terminology: As formas Inácio, Zósimo, Rufo, Paulo e apóstolos são adequadas. «Palavra da justiça», «perseverança», «bem-aventurados» e «mundo presente» preservam a terminologia e a amplitude do texto. A nota provisória é necessária, pois não foi fornecido texto grego ou latino para conferência direta.
  issues:
  - severity: medium
    issue: «saíram do meio de vocês» para «who came from among yourselves»
    rationale: «Sair» pode indicar que essas pessoas deixaram a comunidade; «vieram do meio de vocês» reproduz o movimento expresso pelo testemunho sem essa conotação adicional.
  - severity: low
    issue: Ligação de «being persuaded»
    rationale: «Convencidos de que» preserva melhor o valor participial dependente da exortação do que um novo imperativo, «Estejam convencidos».
  - severity: low
    issue: «lugar que lhes é devido»
    rationale: «Lugar que lhes é próprio» é uma formulação portuguesa mais natural para «their due place», sem definir a natureza desse lugar ou impor uma leitura doutrinária.
  revised_text: 'Portanto, exorto todos vocês a obedecer à palavra da justiça e a praticar toda perseverança, que vocês viram com os próprios olhos nos bem-aventurados Inácio, Zósimo e Rufo, e também em outros que vieram do meio de vocês, bem como no próprio Paulo e nos demais apóstolos.


    Convencidos de que nenhum deles correu em vão, mas em fé e justiça, e de que estão no lugar que lhes é próprio, na presença do Senhor, com quem também sofreram. Pois não amaram o mundo presente, mas aquele que morreu por nós e que Deus ressuscitou para nós.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega e latina.
    reason: A revisão direta das línguas-fonte ainda está pendente, conforme os metadados fornecidos.
  revision_rationale: A revisão substitui uma expressão que poderia introduzir a ideia não atestada de que os demais deixaram a comunidade, ajusta a ligação sintática do particípio e melhora a naturalidade de «due place». Mantêm-se as ambiguidades teológicas e a nota que registra a limitação da base textual disponível.
