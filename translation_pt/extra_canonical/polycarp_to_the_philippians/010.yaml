base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/010.yaml
  text: 'Therefore, I urge all of you to obey the word of righteousness and to practice all endurance, which you saw with your own eyes in the blessed Ignatius, Zosimus, and Rufus, and also in others who came from among you, as well as in Paul himself and the rest of the apostles;


    being convinced that none of these ran in vain, but in faith and righteousness, and that they are in their rightful place in the presence of the Lord, with whom they also suffered. For they did not love the present world, but the one who died for our sake and was raised by God for us.'
translation:
  language: pt
  text: 'Portanto, exorto todos vocês a obedecer à palavra da justiça e a praticar toda perseverança, como vocês mesmos viram nos bem-aventurados Inácio, Zósimo e Rufo, bem como em outros que saíram do meio de vocês, no próprio Paulo e nos demais apóstolos.


    Estejam convencidos de que nenhum deles correu em vão, mas em fé e justiça, e de que estão no lugar que lhes é devido, na presença do Senhor, com quem também sofreram. Pois não amaram o mundo presente, mas aquele que morreu por nós e que Deus ressuscitou para nós.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega e latina.
    reason: A revisão direta das línguas-fonte ainda está pendente, conforme os metadados fornecidos.
lexical_decisions:
- source_word: word of righteousness
  choice: palavra da justiça
  rationale: 'Preserva a formulação compacta e sua possível amplitude: a mensagem caracterizada pela justiça ou que conduz a ela.'
- source_word: all endurance
  choice: toda perseverança
  rationale: Expressa constância paciente sob provação em português corrente e digno.
- source_word: blessed
  choice: bem-aventurados
  rationale: Mantém o sentido religioso honorífico sem necessariamente definir formalmente seu estatuto.
- source_word: ran not in vain
  choice: não correu em vão
  rationale: Conserva a metáfora apostólica da corrida, importante no contexto cristão primitivo.
- source_word: present world
  choice: mundo presente
  rationale: Mantém o contraste temporal e moral do testemunho sem expandi-lo interpretativamente.
theological_decisions:
- issue: Estado dos mártires ou fiéis falecidos diante do Senhor
  choice: estão no lugar que lhes é devido, na presença do Senhor
  alternative: estão em seu lugar apropriado junto ao Senhor
  rationale: Segue de perto o testemunho fornecido sem especificar uma doutrina mais detalhada do estado intermediário.
- issue: Referente de “com quem também sofreram”
  choice: com quem também sofreram
  alternative: por quem também sofreram
  rationale: Preserva a leitura do testemunho inglês e a tensão possível da expressão, sem substituir associação com Cristo por causa ou benefício.
- issue: Ressurreição de Cristo em favor dos fiéis
  choice: que Deus ressuscitou para nós
  alternative: que Deus ressuscitou dentre os mortos para o nosso bem
  rationale: Mantém a construção breve e teologicamente carregada do testemunho, sem acrescentar “dentre os mortos”, ausente no material fornecido.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se a metáfora de correr, a expressão “palavra da justiça” e formulações teológicas potencialmente ambíguas. Os nomes seguem formas portuguesas tradicionais: Inácio, Zósimo e Rufo.'
