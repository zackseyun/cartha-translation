review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha de perto o testemunho inglês fornecido: preserva a exortação à obediência, a referência nominal a Inácio, Zósimo e Rufo, a metáfora da corrida, a localização diante do Senhor e a formulação de que Deus ressuscitou aquele que morreu por nós. A revisão direta das tradições grega e latina continua pendente, como indicado na nota.'
  naturalness: 'Há duas construções que pedem ajuste: “outros que saíram do meio de vocês” altera levemente “who came from among yourselves”, e “no próprio Paulo” fica sintaticamente mal encaixado após “bem como”. Além disso, “Estejam convencidos” introduz uma nova exortação que não corresponde com precisão ao particípio explicativo do testemunho; “convencidos de que” mantém melhor a ligação com a frase anterior.'
  terminology: “Palavra da justiça”, “perseverança”, “bem-aventurados”, “correram em vão”, “mundo presente” e os nomes tradicionais em português são adequados. Mantém-se “na presença do Senhor” sem impor uma leitura doutrinária mais específica.
  issues:
  - severity: medium
    issue: “saíram do meio de vocês” para “came from among yourselves”
    rationale: “Saíram” pode sugerir afastamento ou partida; “vieram do meio de vocês” reproduz de modo mais direto a origem indicada pelo testemunho.
  - severity: medium
    issue: Construção “bem como em outros..., no próprio Paulo”
    rationale: A coordenação é pouco natural e pode dificultar que se entenda que o mesmo exemplo de perseverança foi visto também em Paulo e nos demais apóstolos.
  - severity: medium
    issue: “Estejam convencidos”
    rationale: O imperativo introduzido em novo período é mais forte que o particípio “being persuaded”. “Convencidos de que” conserva a dependência sintática e o fluxo argumentativo.
  revised_text: 'Portanto, exorto todos vocês a obedecer à palavra da justiça e a praticar toda perseverança, a qual vocês mesmos viram nos bem-aventurados Inácio, Zósimo e Rufo, e também em outros que vieram do meio de vocês, bem como no próprio Paulo e nos demais apóstolos.


    Convencidos de que nenhum deles correu em vão, mas em fé e justiça, e de que estão no lugar que lhes é devido, na presença do Senhor, com quem também sofreram. Pois não amaram o mundo presente, mas aquele que morreu por nós e que Deus ressuscitou para nós.[a]'
  revised_footnotes:
  - marker: a
    text: Tradução provisória baseada no testemunho inglês de domínio público fornecido. A redação deverá ser conferida diretamente com a tradição manuscrita grega e latina.
    reason: A revisão direta das línguas-fonte ainda está pendente, conforme os metadados fornecidos.
  revision_rationale: A revisão corrige a relação de origem dos “outros”, torna paralela e clara a enumeração de Inácio, Zósimo, Rufo, outros fiéis, Paulo e os apóstolos, e substitui um imperativo não exigido pelo testemunho por uma construção que preserva a relação explicativa. Não foram acrescentadas interpretações doutrinárias.
