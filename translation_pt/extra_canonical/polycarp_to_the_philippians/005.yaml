base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/005.yaml
  text: 'But the love of money is the beginning of all troubles. Therefore, knowing that we brought nothing into the world and cannot carry anything out, let us arm ourselves with the armor of righteousness, and let us first teach ourselves to walk in the commandment of the Lord;


    and then teach our wives also to walk in the faith that has been given to them, and in love and purity, cherishing their own husbands in all truth, loving everyone equally in all chastity, and training their children in the discipline of the fear of God.


    Our widows must be sober-minded concerning the faith of the Lord, interceding without ceasing for everyone, abstaining from all slander, evil speaking, false witness, love of money, and every evil thing. They know that they are God’s altar, that all sacrifices are carefully inspected, and that nothing escapes him—neither their thoughts, their intentions, nor any of the secret things of the heart.'
translation:
  language: pt
  text: 'Mas o amor ao dinheiro é o começo de todos os males. Portanto, sabendo que nada trouxemos para o mundo e que nada podemos levar dele, revistamo-nos da armadura da justiça e ensinemos primeiro a nós mesmos a andar segundo o mandamento do Senhor.


    Depois, ensinemos também nossas esposas a andar na fé que lhes foi dada, no amor e na pureza; a amar seus próprios maridos com toda a fidelidade; a amar a todos por igual, com pleno domínio próprio; e a educar seus filhos na disciplina do temor de Deus.


    Nossas viúvas devem ser sensatas no que diz respeito à fé do Senhor, intercedendo sem cessar por todos e abstendo-se de toda calúnia, maledicência, falso testemunho, amor ao dinheiro e todo tipo de mal, sabendo que são o altar de Deus, que todos os sacrifícios são examinados cuidadosamente e que nada lhe escapa: nem os pensamentos delas, nem suas intenções, nem qualquer dos segredos do coração.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: love of money
  choice: amor ao dinheiro
  rationale: Expressão natural e precisa, que mantém o vício como afeição desordenada pelo dinheiro, não como simples posse de bens.
- source_word: beginning of all troubles
  choice: começo de todos os males
  rationale: Preserva a formulação do testemunho fornecido sem substituí-la pela conhecida expressão bíblica “raiz de todos os males”.
- source_word: armor of righteousness
  choice: armadura da justiça
  rationale: Conserva a metáfora militar e a possível ressonância escriturística.
- source_word: walk
  choice: andar / viver
  rationale: “Andar” foi mantido na primeira ocorrência por seu caráter ético e bíblico; na construção referente às esposas, “viver” evita uma formulação portuguesa pesada sem alterar o sentido.
- source_word: in all truth
  choice: com toda a fidelidade
  rationale: No contexto do amor conjugal, “fidelidade” comunica de modo idiomático a verdade e lealdade da conduta, sem reduzir a frase à mera veracidade verbal.
- source_word: in all chastity
  choice: com pleno domínio próprio
  rationale: A tradição grega subjacente é associada a enkrateia, termo mais amplo que castidade e referente a autocontrole ou continência; “domínio próprio” evita restringir indevidamente o sentido à sexualidade.
- source_word: training of the fear of God
  choice: disciplina do temor de Deus
  rationale: Mantém tanto a ideia formativa de educação e correção quanto a expressão religiosa tradicional “temor de Deus”.
- source_word: sober-minded
  choice: sensatas
  rationale: Comunica lucidez, prudência e autocontrole em português corrente, sem sugerir apenas abstinência de álcool.
- source_word: God’s altar
  choice: altar de Deus
  rationale: Preserva literalmente a metáfora cultual aplicada às viúvas.
- source_word: sacrifices are carefully inspected
  choice: todos os sacrifícios são examinados cuidadosamente
  rationale: Mantém a imagem da inspeção cultual, na qual as ofertas são avaliadas e nada fica oculto.
theological_decisions:
- issue: Relação entre o ensino pessoal e o ensino das esposas
  choice: “aprendamos... Depois, ensinemos também nossas esposas”
  alternative: “ensinemos primeiro a nós mesmos... e depois também nossas esposas”
  rationale: A redação escolhida soa natural e conserva a prioridade da autoformação antes da instrução de outras pessoas.
- issue: Alcance de “todos” no amor e na intercessão
  choice: “a todos por igual” e “por todos”
  alternative: Restringir as expressões aos membros da comunidade cristã
  rationale: O testemunho não explicita uma limitação; a tradução mantém o alcance universal da formulação.
- issue: Identidade das viúvas como altar de Deus
  choice: A metáfora foi mantida sem explicação doutrinária no corpo do texto
  alternative: Parafrasear como referência às orações ou ao serviço das viúvas
  rationale: A imagem possui tensão teológica própria e não deve ser reduzida a uma interpretação específica.
- issue: Responsabilidade pelo exame dos sacrifícios
  choice: 'Construção passiva: “são examinados cuidadosamente”'
  alternative: “Deus examina cuidadosamente todos os sacrifícios”
  rationale: A voz passiva preserva a forma do testemunho e evita explicitar um agente que está apenas implícito, embora o contexto aponte para Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se imagens bíblicas e cultuais importantes, mas estruturas arcaicas foram atualizadas. Esta minuta é necessariamente provisória porque o material fornecido identifica como pendente a revisão direta da tradição manuscrita grega e latina; as decisões foram tomadas com base no testemunho inglês de domínio público e nas indicações lexicais disponíveis.
