  terminology: «Amor ao dinheiro», «armadura da justiça», «temor de Deus», «domínio próprio» e «altar de Deus» são escolhas adequadas. «Domínio próprio» é especialmente defensável para enkrateia, sem restringir o termo à castidade sexual. Acrescenta-se o artigo em «o altar de Deus», em conformidade com a imagem definida do texto.
