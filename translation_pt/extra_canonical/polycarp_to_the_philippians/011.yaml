base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/011.yaml
  text: 'Therefore stand firm in these things and follow the example of the Lord, being firm in the faith and immovable, kindly affectionate toward one another in love of the brotherhood, partners with the truth, forestalling one another in the gentleness of the Lord, and despising no one.


    When you are able to do good, do not delay, for pitifulness delivers from death. Be all subject to one another, having your conduct blameless among the Gentiles, so that by your good works you may receive praise and the Lord may not be blasphemed in you.


    But woe to the one through whom the name of the Lord is blasphemed. Therefore teach all people soberness, in which you yourselves also walk.'
translation:
  language: pt
  text: 'Portanto, permaneçam firmes nessas coisas e sigam o exemplo do Senhor: firmes e inabaláveis na fé; com amor fraternal, sejam afetuosos uns com os outros; unidos à verdade; antecipando-se uns aos outros na mansidão do Senhor; e não desprezando ninguém.


    Quando puderem fazer o bem, não o adiem, pois a misericórdia livra da morte.[a] Sujeitem-se todos uns aos outros e mantenham uma conduta irrepreensível entre os gentios, para que, por suas boas obras, vocês recebam louvor e o Senhor não seja blasfemado por causa de vocês.[b]


    Mas ai daquele por meio de quem o nome do Senhor é blasfemado! Portanto, ensinem a todos o domínio próprio,[c] que vocês mesmos também praticam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “A misericórdia livra da morte” tem forma proverbial. O termo pode abranger atos de misericórdia, inclusive a esmola; o testemunho disponível não especifica se “morte” é física, espiritual ou escatológica.
    reason: Preserva a amplitude prática de “Pitifulness” e a ambiguidade quanto à natureza da morte, sem impor uma interpretação teológica.
  - marker: b
    text: 'Mais literalmente: “o Senhor não seja blasfemado em vocês”. A expressão pode indicar que a má conduta dos cristãos levaria outros a blasfemar o Senhor por causa deles.'
    reason: Registra a construção do testemunho e explica a opção idiomática no texto.
  - marker: c
    text: “Domínio próprio” também pode ser entendido como sobriedade, sensatez ou moderação.
    reason: O termo do testemunho inglês abrange um campo moral mais amplo do que a simples ausência de embriaguez.
lexical_decisions:
- source_word: Stand fast / firm and immovable
  choice: permaneçam firmes... firmes e inabaláveis
  rationale: Preserva a repetição enfática do testemunho e usa linguagem portuguesa natural.
- source_word: love of the brotherhood
  choice: amor fraternal
  rationale: Expressa o afeto próprio da comunidade de irmãos sem restringi-lo a irmãos do sexo masculino.
- source_word: partners with the truth
  choice: unidos à verdade
  rationale: Comunica associação e compromisso com a verdade de modo idiomático, sem acrescentar uma definição teológica de 'verdade'.
- source_word: forestalling one another
  choice: tomando a iniciativa de tratar uns aos outros
  rationale: O verbo inglês antigo indica antecipar-se ou adiantar-se; a formulação conserva essa iniciativa recíproca.
- source_word: Pitifulness
  choice: compaixão
  rationale: Representa a ideia de misericórdia ou prática compassiva, evitando o sentido moderno negativo de 'lastimável'.
- source_word: conversation
  choice: conduta
  rationale: O inglês antigo refere-se ao modo de viver, não apenas à fala.
- source_word: Gentiles
  choice: gentios
  rationale: Mantém o termo histórico para os povos não judeus, embora no contexto possa também designar os de fora da comunidade cristã.
- source_word: soberness
  choice: domínio próprio
  rationale: No contexto moral, indica sensatez, moderação e autocontrole, não apenas abstinência de álcool.
- source_word: walk
  choice: vivem
  rationale: Traduz naturalmente a metáfora ética de conduzir a própria vida.
theological_decisions:
- issue: A afirmação de que a compaixão livra da morte
  choice: Manter literalmente a afirmação, com nota sobre seu caráter proverbial e possíveis ecos bíblicos.
  alternative: Explicitar que se trata de livramento espiritual, físico ou de expiação de pecados.
  rationale: O testemunho não determina sozinho a natureza da morte nem o mecanismo do livramento; explicá-los no texto resolveria indevidamente a tensão.
- issue: Reciprocidade da sujeição
  choice: Sujeitem-se todos uns aos outros
  alternative: Sujeitem-se todos às autoridades ou aos líderes.
  rationale: Preserva a reciprocidade explícita do testemunho sem importar uma estrutura eclesiástica específica.
- issue: O Senhor ser blasfemado 'em vocês'
  choice: por causa de vocês
  alternative: em vocês
  rationale: A formulação portuguesa comunica a relação causal provável e evita uma expressão pouco natural, enquanto a nota registra a forma mais literal.
- issue: Receber louvor pelas boas obras
  choice: vocês recebam louvor
  alternative: as boas obras sejam louvadas ou Deus receba louvor
  rationale: Mantém o sujeito indicado pelo testemunho disponível, sem redirecionar teologicamente o louvor.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. Emprega segunda pessoa plural por meio de “vocês”, evita arcaísmos e conserva paralelismo, imperativos comunitários e tensão moral. Como a revisão direta do grego e do latim ainda está pendente, as decisões mais sensíveis são apresentadas com cautela e as ambiguidades são sinalizadas em notas.
