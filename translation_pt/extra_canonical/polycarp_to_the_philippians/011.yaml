  naturalness: O texto é claro, atual e de registro apropriado. A reformulação de «love of the brotherhood kindly affectioned one to another» como «com amor fraternal, sejam afetuosos uns com os outros» evita a redundância algo pesada de «amando afetuosamente ... no amor fraternal».
  terminology: «Amor fraternal», «gentios», «conduta irrepreensível», «blasfemado» e «domínio próprio» são escolhas adequadas. A nota de «domínio próprio» preserva corretamente o campo de sobriedade, sensatez e moderação.
