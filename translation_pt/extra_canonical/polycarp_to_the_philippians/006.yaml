base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/006.yaml
  text: 'Knowing, then, that God is not mocked, we ought to walk in a manner worthy of his commandment and his glory.


    Likewise, deacons should be blameless before his righteousness, as deacons of God and Christ and not of human beings. They must not be slanderers, double-tongued, or lovers of money, but self-controlled in everything, compassionate, diligent, and walking according to the truth of the Lord, who became a servant (deacon) of all. For if we please him in this present world, we will also receive the world to come, just as he promised to raise us from the dead. And if we conduct ourselves in a manner worthy of him, we will also reign with him—if indeed we have faith.


    Likewise, the younger men must be blameless in everything, caring above all for purity and restraining themselves from every evil. For it is good to refrain from the desires of the world, because every desire wages war against the Spirit. Neither the sexually immoral, nor effeminate people, nor those who defile themselves with men will inherit the kingdom of God, nor will those who do improper things. Therefore, it is right to abstain from all these things, submitting yourselves to the presbyters and deacons as to God and Christ. The virgins must walk with a blameless and pure conscience.'
translation:
  language: pt
  text: 'Sabendo, portanto, que Deus não se deixa zombar, devemos viver de maneira digna de seu mandamento e de sua glória.


    Da mesma forma, os diáconos devem ser irrepreensíveis diante de sua justiça, como diáconos de Deus e de Cristo, e não de seres humanos. Não devem ser caluniadores, nem falar com duplicidade, nem amar o dinheiro, mas ser moderados em tudo, compassivos, diligentes e viver segundo a verdade do Senhor, que se tornou servo[a] de todos. Pois, se lhe agradarmos neste mundo presente, receberemos também o mundo futuro, conforme ele nos prometeu ressuscitar dentre os mortos. E, se vivermos de maneira digna dele, também reinaremos com ele — se de fato tivermos fé.


    Da mesma forma, os jovens devem ser irrepreensíveis em tudo, zelando acima de tudo pela pureza e refreando-se de todo mal. Pois é bom abster-se dos desejos que há no mundo, porque todo desejo guerreia contra o Espírito.[b] Nem os sexualmente imorais, nem os efeminados,[c] nem os que se contaminam com homens herdarão o reino de Deus; tampouco os que praticam coisas impróprias. Portanto, é correto abster-se de todas essas coisas e sujeitar-se aos presbíteros e diáconos como a Deus e a Cristo. As virgens devem viver com consciência irrepreensível e pura.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo traduzido por “servo” está ligado à palavra que também dá origem a “diácono”, preservando o jogo entre serviço e ofício.
    reason: Explicar o jogo lexical explícito no testemunho sem inserir “diácono” de modo pouco natural no corpo do texto.
  - marker: b
    text: “Espírito” pode referir-se ao Espírito de Deus; a forma exata e qualquer possível ambiguidade dependem da revisão direta da tradição grega e latina.
    reason: Preservar a incerteza decorrente da base provisória em testemunho inglês.
  - marker: c
    text: “Efeminados” traduz provisoriamente um termo antigo de sentido e aplicação discutidos; não deve ser automaticamente identificado com uma categoria moderna de orientação sexual ou identidade de gênero.
    reason: Evitar anacronismo e excesso interpretativo em terminologia sexual disputada.
lexical_decisions:
- source_word: walk / walking (source wording pending Greek/Latin review)
  choice: viver
  rationale: Em português atual, “viver de maneira digna” e “viver segundo” comunicam naturalmente a metáfora ética de caminhar, sem perder seu sentido comportamental.
- source_word: deacons
  choice: diáconos
  rationale: Mantém o título eclesial reconhecível e preserva sua repetição no trecho.
- source_word: minister (deacon)
  choice: servo[a]
  rationale: “Servo” expressa a função de serviço atribuída ao Senhor; a nota preserva o provável jogo lexical com “diácono” sem produzir uma formulação portuguesa artificial.
- source_word: double-tongued
  choice: falar com duplicidade
  rationale: Expressa discurso insincero ou contraditório em linguagem corrente, sem restringi-lo apenas à mentira.
- source_word: presbyters
  choice: presbíteros
  rationale: Preserva o termo eclesial histórico sem convertê-lo em um cargo denominacional moderno específico.
- source_word: lusts / desire
  choice: desejos
  rationale: Mantém a amplitude do termo do testemunho, cujo alcance não precisa ser exclusivamente sexual no primeiro uso.
- source_word: Spirit
  choice: Espírito
  rationale: A inicial maiúscula preserva a provável referência ao Espírito divino, enquanto a nota reconhece a possível ambiguidade semântica diante da revisão ainda pendente.
- source_word: effeminate persons
  choice: efeminados[c]
  rationale: Mantém provisoriamente a distinção tripla do testemunho e sua terminologia historicamente áspera; a nota adverte que o referente exato depende da confirmação do texto-fonte.
- source_word: virgins
  choice: virgens
  rationale: Tradução direta do grupo ascético ou social nomeado, sem explicitação interpretativa adicional.
theological_decisions:
- issue: Promessa da ressurreição e reinado condicionado
  choice: “se vivermos de maneira digna dele, também reinaremos com ele — se de fato tivermos fé”
  alternative: Reformular para subordinar a conduta exclusivamente à fé ou tratar o reinado como certeza incondicional
  rationale: Preserva a tensão parenética e as duas condições presentes no testemunho, sem harmonização doutrinária.
- issue: Submissão aos presbíteros e diáconos “como a Deus e a Cristo”
  choice: Conservar a comparação literalmente
  alternative: Atenuar para “como representantes de Deus e de Cristo”
  rationale: O texto oferece uma comparação retórica forte; acrescentar “representantes” resolveria uma tensão que o testemunho não resolve.
- issue: Referência ao Espírito
  choice: Usar “Espírito” com maiúscula e nota de ambiguidade
  alternative: “espírito” como dimensão humana
  rationale: O testemunho inglês favorece referência divina e ecoa linguagem apostólica, mas a revisão direta do grego/latim ainda está pendente.
- issue: Lista de termos sexuais
  choice: Traduzir os itens separadamente e assinalar a incerteza do termo “efeminados”
  alternative: Fundir todos sob “pessoas sexualmente imorais” ou modernizar com categorias identitárias
  rationale: A fusão apagaria distinções do testemunho, enquanto categorias modernas poderiam importar sentidos não demonstrados pelo texto antigo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A tradução é necessariamente provisória porque o material fornecido declara pendente a revisão direta do grego e do latim. Evitaram-se arcaísmos como “andar dignamente”, “maledicentes” e “avarentos” quando alternativas atuais preservavam o sentido. Mantiveram-se “diáconos” e “presbíteros” por sua relevância histórica e eclesial.
