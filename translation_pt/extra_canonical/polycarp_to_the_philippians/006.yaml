review_pass:
  verdict: revise
  source_fidelity: 'A tradução acompanha de perto o testemunho inglês fornecido e preserva adequadamente a estrutura parenética, os cargos de diáconos e presbíteros, a condição relativa ao reinado com Cristo e as distinções da lista moral. Há, porém, uma ambiguidade sintática relevante em “conforme ele nos prometeu ressuscitar dentre os mortos”: a redação pode sugerir que nós prometemos ressuscitar, enquanto o testemunho diz que Deus prometeu ressuscitar-nos.'
  naturalness: O português é moderno, claro e de registro apropriado. “Viver de maneira digna” e “falar com duplicidade” são soluções naturais. A correção proposta torna explícito, em português corrente, o sujeito e o objeto da promessa de ressurreição.
  terminology: “Diáconos”, “presbíteros”, “Espírito” e “virgens” foram mantidos com consistência histórica. “Servo” com nota preserva de modo satisfatório o jogo lexical assinalado pelo testemunho. A nota sobre “efeminados” limita corretamente leituras anacrônicas, sem apagar a formulação distinta do texto.
  issues:
  - severity: medium
    issue: Ambiguidade em “conforme ele nos prometeu ressuscitar dentre os mortos”.
    rationale: No contexto, “ele” é Deus/Cristo e a promessa é ressuscitar “a nós”. Em português, a colocação de “nos” antes de “prometeu” pode ser entendida como objeto de prometer, deixando “ressuscitar” sem objeto expresso. “Conforme ele prometeu ressuscitar-nos dentre os mortos” reproduz inequivocamente o sentido do testemunho.
