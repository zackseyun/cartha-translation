base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/007.yaml
  text: 'The elders must also be compassionate and merciful toward everyone. They must bring back the sheep that have gone astray, visit all who are sick, and not neglect a widow, an orphan, or a poor person. Instead, they must always provide for what is honorable in the sight of God and of people. They must abstain from all anger, favoritism, and unjust judgment; stay far from every love of money; not be quick to believe anything against anyone; and not be hasty in judgment, knowing that we are all debtors of sin.


    So if we ask the Lord to forgive us, we also ought to forgive. For we are before the eyes of our Lord and God, and we must all stand before the judgment seat of Christ, and each person must give an account of himself.


    Therefore, let us serve him with fear and complete reverence, as he himself commanded, along with the apostles who preached the good news to us and the prophets who proclaimed beforehand the coming of our Lord. Let us be zealous for what is good, abstaining from offenses, from false brothers, and from those who bear the name of the Lord hypocritically and lead foolish people astray.'
translation:
  language: pt
  text: 'Também os presbíteros devem ser compassivos e misericordiosos para com todos, trazendo de volta as ovelhas que se desviaram, visitando todos os enfermos e não negligenciando a viúva, o órfão ou o pobre. Devem, porém, cuidar sempre do que é honroso diante de Deus e das pessoas, abstendo-se de toda ira, parcialidade e julgamento injusto; mantendo-se longe de todo amor ao dinheiro; não se apressando a acreditar em acusação alguma contra ninguém, nem a julgar precipitadamente, sabendo que todos nós somos devedores do pecado.[a]


    Portanto, se pedimos ao Senhor que nos perdoe, também nós devemos perdoar, pois estamos diante dos olhos de nosso Senhor e Deus. Todos teremos de comparecer perante o tribunal de Cristo, e cada um prestará contas de si mesmo.


    Sirvamos, portanto, a ele com temor e toda reverência, conforme ele próprio ordenou, assim como os apóstolos que nos anunciaram as boas-novas e os profetas que proclamaram de antemão a vinda de nosso Senhor. Sejamos zelosos pelo bem, afastando-nos das causas de tropeço,[b] dos falsos irmãos e daqueles que levam hipocritamente o nome do Senhor e desviam pessoas insensatas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Devedores do pecado” reproduz uma expressão difícil do testemunho disponível; ela também pode sugerir pessoas culpadas por causa do pecado ou sujeitas à dívida que ele acarreta.
    reason: Preservar uma ambiguidade teológica e lexical genuína sem tornar o corpo do texto obscuro por explicação excessiva.
  - marker: b
    text: 'Ou: “ofensas” ou “ocasiões de queda”.'
    reason: Registrar a amplitude possível da expressão enquanto a revisão direta das fontes grega e latina permanece pendente.
lexical_decisions:
- source_word: presbyters
  choice: presbíteros
  rationale: Mantém o termo histórico-eclesial de modo reconhecível em português, sem reduzir antecipadamente sua função ao sentido mais amplo de “anciãos”.
- source_word: infirm
  choice: enfermos
  rationale: Expressa naturalmente pessoas debilitadas ou doentes e preserva o dever pastoral de visitá-las.
- source_word: respect of persons
  choice: parcialidade
  rationale: Comunica em português atual a ideia de favorecer pessoas indevidamente, sem a estranheza do calque “acepção de pessoas”.
- source_word: love of money
  choice: amor ao dinheiro
  rationale: Preserva a formulação moral direta e não a restringe apenas à avareza manifesta.
- source_word: debtors of sin
  choice: devedores do pecado
  rationale: Mantém a expressão difícil e sua tensão sem decidir se indica dívida decorrente do pecado, sujeição a ele ou culpa.
- source_word: offenses
  choice: causas de tropeço
  rationale: Representa a provável noção de obstáculos morais ou ocasiões de queda, deixando a amplitude semântica indicada em nota.
- source_word: foolish men
  choice: pessoas insensatas
  rationale: Evita restringir a referência a homens do sexo masculino e transmite a falta de discernimento sugerida pelo testemunho.
theological_decisions:
- issue: Identidade dos “presbíteros”
  choice: presbíteros
  alternative: anciãos
  rationale: O termo mantém a designação comunitária antiga sem impor uma equivalência exata com ofícios de tradições posteriores.
- issue: Sentido de “devedores do pecado”
  choice: preservar literalmente a formulação
  alternative: culpados de pecado / sujeitos ao pecado
  rationale: A evidência fornecida não permite resolver com segurança a relação expressa; a tradução conserva a ambiguidade teológica.
- issue: Relação entre a ordem de Cristo, os apóstolos e os profetas
  choice: “conforme ele próprio ordenou, assim como os apóstolos... e os profetas...”
  alternative: tratar todos como autores coordenados do mesmo mandamento
  rationale: A redação evita atribuir uma sintaxe excessivamente precisa a um trecho que, no testemunho inglês, admite mais de uma ligação entre os agentes.
- issue: “Nosso Senhor e Deus” e “tribunal de Cristo”
  choice: manter ambas as formulações sem harmonização explicativa
  alternative: identificar ou distinguir explicitamente os referentes
  rationale: Preserva a linguagem recebida e sua tensão cristológica sem acrescentar interpretação denominacional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregaram-se “presbíteros” para precisão histórica, “boas-novas” para linguagem corrente e “pessoas” em referências humanas genéricas. Como a revisão direta das tradições manuscritas grega e latina está pendente, o texto é um rascunho cauteloso fundamentado no testemunho inglês público fornecido; as ambiguidades mais relevantes foram preservadas ou assinaladas em notas.
