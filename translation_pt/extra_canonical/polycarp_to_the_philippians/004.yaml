revisions:
- from: 'Irmãos, escrevo-lhes estas coisas a respeito da justiça, não porque eu mesmo tenha assumido essa incumbência, mas porque vocês me convidaram.


    Pois nem eu nem qualquer outro como eu é capaz de alcançar a sabedoria do bendito e glorioso Paulo. Quando esteve entre vocês, ele ensinou pessoalmente aos homens daquele tempo, com cuidado e firmeza, a palavra da verdade. E, quando estava ausente, escreveu-lhes uma carta. Se a examinarem atentamente, poderão ser edificados na fé que lhes foi dada.


