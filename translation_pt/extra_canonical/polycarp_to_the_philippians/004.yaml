base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/004.yaml
  text: 'Brothers, I write these things to you concerning righteousness, not because I laid this charge upon myself, but because you invited me.


    For neither I nor anyone else like me is able to follow the wisdom of the blessed and glorious Paul, who, when he came among you, carefully and surely taught face to face with the men of that day the word concerning truth; and who also, when he was absent, wrote a letter to you. If you look diligently into it, you will be able to be built up unto the faith given to you,


    which is the mother of us all, while hope follows after and love goes before—love toward God and Christ and toward our neighbor. For if anyone is occupied with these, that person has fulfilled the commandment of righteousness; for whoever has love is far from all sin.'
translation:
  language: pt
  text: 'Irmãos, escrevo-lhes estas coisas a respeito da justiça, não porque eu mesmo tenha me imposto essa tarefa, mas porque vocês me convidaram.


    Pois nem eu nem qualquer outro como eu somos capazes de acompanhar a sabedoria do bendito e glorioso Paulo, que, quando esteve entre vocês, ensinou pessoalmente aos homens daquele tempo, com cuidado e firmeza, a palavra que diz respeito à verdade e que também, quando estava ausente, lhes escreveu uma carta. Se a examinarem atentamente, poderão ser edificados na fé que lhes foi dada,


    que é a mãe de todos nós; a esperança segue, e o amor vai à frente — o amor a Deus, a Cristo e ao nosso próximo. Pois, se alguém se dedica a essas coisas, cumpre o mandamento da justiça, porque quem tem amor está longe de todo pecado.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: brethren
  choice: Irmãos
  rationale: Mantém a forma de tratamento comunitária e familiar do testemunho, em linguagem corrente e digna.
- source_word: righteousness
  choice: justiça
  rationale: Preserva o campo moral e teológico do termo sem o restringir a uma formulação denominacional.
- source_word: able to follow the wisdom
  choice: capaz de alcançar a sabedoria
  rationale: Evita o sentido potencialmente enganoso de acompanhar fisicamente e expressa a reconhecida incapacidade de igualar ou atingir a sabedoria de Paulo.
- source_word: the word which concerneth truth
  choice: a palavra da verdade
  rationale: Formulação portuguesa natural que preserva a relação estreita entre a mensagem ensinada e a verdade.
- source_word: be builded up unto the faith
  choice: ser edificados na fé
  rationale: Conserva a metáfora antiga de edificação, ainda inteligível no registro cristão moderno.
- source_word: occupied with these
  choice: se ocupa dessas coisas
  rationale: Mantém a amplitude da expressão, sem reduzi-la apenas a reflexão, prática ou posse interior.
- source_word: commandment of righteousness
  choice: mandamento da justiça
  rationale: Tradução formal que preserva a possível tensão entre um mandamento específico e a exigência moral da justiça.
theological_decisions:
- issue: A fé como “mãe de todos nós”
  choice: Essa fé é a mãe de todos nós
  alternative: A justiça é a mãe de todos nós
  rationale: O antecedente mais próximo no testemunho fornecido é “a fé que lhes foi dada”; a tradução mantém essa ligação sem explicar ou reformular a metáfora.
- issue: Ordem entre fé, esperança e amor
  choice: a esperança vem depois dela, e o amor vai adiante
  alternative: a esperança a acompanha, e o amor a precede
  rationale: Preserva a imagem e a ordem do testemunho sem transformar a frase numa hierarquia teológica sistemática.
- issue: Relação entre amor e ausência de pecado
  choice: quem tem amor está longe de todo pecado
  alternative: quem ama não comete pecado algum
  rationale: Mantém a formulação espacial e exortativa do testemunho, evitando convertê-la numa afirmação absoluta de impecabilidade.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O tratamento no plural usa “vocês”, enquanto a prosa conserva termos tradicionais ainda transparentes, como “justiça”, “fé” e “edificados”. Como a revisão direta do grego e do latim está pendente e o material fornecido é um testemunho inglês de domínio público, a redação evita notas textuais ou afirmações de certeza que ultrapassem a evidência disponível.
