review_pass:
  verdict: revise
  source_fidelity: 'A saudação, os destinatários, a designação «presbíteros», a condição de peregrinação da igreja e a bênção procedente de Deus Todo-Poderoso e de Jesus Cristo, nosso Salvador, são transmitidas com fidelidade ao testemunho ინგლისês fornecido. Contudo, «entre vocês» altera levemente o alvo da bênção: o original a dirige aos destinatários («a vocês»), não a apresenta como algo que ocorre reciprocamente no grupo.'
  naturalness: O texto é claro, digno e natural em português moderno. «Vive como peregrina» comunica bem a imagem de sojourneth. A formulação da bênção fica mais idiomática e exata com «se multipliquem para vocês».
  terminology: «Presbíteros» é uma escolha historicamente apropriada e não define indevidamente o alcance do termo. «Deus Todo-Poderoso», «Jesus Cristo» e «nosso Salvador» preservam a terminologia do testemunho. «Filipos» é a forma portuguesa corrente.
  issues:
  - severity: low
    issue: «sejam multiplicadas entre vocês»
    rationale: «Entre vocês» pode sugerir uma distribuição ou relação interna entre os membros. A fórmula epistolar do testemunho deseja que misericórdia e paz sejam multiplicadas aos destinatários; «para vocês» preserva esse direcionamento sem introduzir essa nuance adicional.
  revised_text: 'Policarpo e os presbíteros que estão com ele, à igreja de Deus que vive como peregrina em Filipos: que a misericórdia e a paz da parte de Deus Todo-Poderoso e de Jesus Cristo, nosso Salvador, se multipliquem para vocês.'
  revised_footnotes: []
  revision_rationale: A única revisão substitui «entre vocês» por «para vocês», a fim de conservar o destinatário da bênção conforme o testemunho disponível. O restante do texto é mantido, inclusive «vive como peregrina», que representa adequadamente a noção de residência temporária/peregrinação sem reduzir a expressão a mera localização.
