base_translation:
  language: en
  yaml_path: translation/extra_canonical/polycarp_to_the_philippians/001.yaml
  text: 'Polycarp and the elders who are with him, to the church of God residing in Philippi: May mercy and peace from God Almighty and Jesus Christ our Savior be multiplied to you.'
translation:
  language: pt
  text: 'Policarpo e os presbíteros que estão com ele, à igreja de Deus que peregrina em Filipos: que a misericórdia e a paz da parte de Deus Todo-Poderoso e de Jesus Cristo, nosso Salvador, se multipliquem para vocês.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: presbyters
  choice: presbíteros
  rationale: Mantém o termo eclesial antigo com maior precisão histórica do que «anciãos», sem definir além do testemunho disponível a natureza exata do ofício.
- source_word: sojourneth
  choice: vive como peregrina
  rationale: Preserva a imagem de residência temporária e identidade peregrina, em vez de reduzi-la simplesmente a «reside».
- source_word: be multiplied
  choice: sejam multiplicadas entre vocês
  rationale: Conserva a fórmula epistolar enfática e comunica em português natural a ideia de misericórdia e paz concedidas em abundância.
theological_decisions:
- issue: Fonte conjunta da misericórdia e da paz
  choice: «da parte de Deus Todo-Poderoso e de Jesus Cristo, nosso Salvador»
  alternative: «da parte de Deus Todo-Poderoso, por meio de Jesus Cristo, nosso Salvador»
  rationale: A coordenação do testemunho inglês apresenta Deus e Jesus Cristo sem explicitar mediação; a tradução preserva essa relação e não acrescenta uma construção teológica ausente.
- issue: Sentido eclesiológico de «sojourneth»
  choice: «igreja de Deus que vive como peregrina em Filipos»
  alternative: «igreja de Deus que reside em Filipos»
  rationale: A escolha mantém a tensão entre localização concreta e condição peregrina, sem convertê-la em uma afirmação denominacional específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Emprega «vocês» na bênção, evita arcaísmos sintáticos e conserva «presbíteros» e a imagem da peregrinação por precisão histórica. Como a revisão direta do grego e do latim ainda está pendente, o texto permanece necessariamente provisório e fundamentado no testemunho inglês público fornecido.
