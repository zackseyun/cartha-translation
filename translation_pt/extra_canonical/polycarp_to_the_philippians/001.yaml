review_pass:
  verdict: revise
  source_fidelity: 'A saudação, os remetentes, os destinatários e a dupla origem da bênção são transmitidos com fidelidade. Contudo, «entre vocês» altera o alvo dativo de «a vocês» (ὑμῖν): a fórmula deseja que misericórdia e paz sejam concedidas/avultem em favor dos destinatários, não que ocorram reciprocamente entre eles.'
  naturalness: O texto é claro e de registro apropriado. «Que ... se multipliquem para vocês» é uma formulação moderna e natural que conserva o caráter de bênção epistolar sem o sentido relacional introduzido por «entre vocês».
  terminology: «Presbíteros» preserva adequadamente o termo histórico sem especificar um modelo eclesiástico posterior. «Igreja de Deus», «Deus Todo-Poderoso» e «Jesus Cristo, nosso Salvador» são escolhas estáveis e fiéis. «Que peregrina em Filipos» mantém a nuance de permanência como estrangeira/temporária de «sojourneth» de modo mais conciso.
  issues:
  - severity: medium
    issue: «sejam multiplicadas entre vocês»
    rationale: O texto-fonte dirige a bênção aos leitores («a vocês»), ao passo que «entre vocês» sugere uma realidade ou interação interna e recíproca na comunidade. A alteração é evitável e não é exigida pelo português.
  revised_text: 'Policarpo e os presbíteros que estão com ele, à igreja de Deus que peregrina em Filipos: que a misericórdia e a paz da parte de Deus Todo-Poderoso e de Jesus Cristo, nosso Salvador, se multipliquem para vocês.'
  revised_footnotes: []
  revision_rationale: A revisão limita-se a corrigir o complemento da bênção, de «entre vocês» para «para vocês», e a tornar mais direta a expressão da condição peregrina. Preserva-se a coordenação entre Deus Todo-Poderoso e Jesus Cristo, sem acrescentar uma relação de mediação, bem como o termo histórico «presbíteros».
