base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/009.yaml
  text: 'Furthermore, concerning the ears, he says that it is our heart that he circumcised. The Lord says in the prophet, “With the hearing of the ears they listened to me.” And again he says, “Those who are far away will hear with their ears and will understand what I have done.” And, “Be circumcised in your hearts,” says the Lord.


    And again he says, “Hear, Israel, for this is what the Lord your God says. Whoever desires to live forever, let him hear with his ears the voice of my servant. ~y” And again he says, “Hear, heaven, and give ear, earth, for the Lord has spoken these things as a testimony.” And again he says, “Hear the words of the Lord, you rulers of this people.” And again he says, “Hear, my children, the voice of one crying in the wilderness.” Therefore he circumcised our ears so that, by hearing the word, we might believe.


    But moreover, the circumcision in which they place their confidence is abolished, for he has said that a circumcision not of the flesh should be practiced. But they transgressed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—so I find the commandment—“Do not sow among thorns; be circumcised into your Lord.” And what does he say? “Be circumcised in the hardness of your heart, and then you will not harden your neck.” Take this also: “Behold,” says the Lord, “all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.”


    But you will say, “In truth, the people has been circumcised as a seal.” No, for so likewise is every Syrian and Arabian and all the priests of the idols. Do all those, then, also belong to their covenant? Moreover, the Egyptians are also included among the circumcised.


    Therefore learn fully about all things, children of love: Abraham, who first appointed circumcision, looked forward in the spirit to Jesus when he circumcised, having received the ordinances of three letters.


    For Scripture says, “And Abraham circumcised of his household eighteen males and three hundred.” What, then, was the knowledge given to him? Understand that he says the eighteen first, and then, after an interval, three hundred. In the eighteen, “I” stands for ten and “H” for eight. Here you have JESUS (IHSOYS). And because the cross in the “T” was to have grace, he also says three hundred. Thus he reveals Jesus in the two letters, and the cross in the remaining one.


    He who placed within us the innate gift of his covenant knows: no one has ever learned from me a more genuine word. But I know that you are worthy.'
translation:
  language: pt
  text: 'Além disso, a respeito dos ouvidos, ele diz que foi o nosso coração que ele circuncidou. O Senhor diz por meio do profeta: “Ao ouvirem com os ouvidos, deram-me atenção.” E diz novamente: “Os que estão longe ouvirão com os ouvidos e compreenderão o que fiz.” E: “Sejam circuncidados no coração”, diz o Senhor.


    E diz novamente: “Ouça, ó Israel, pois assim diz o Senhor, seu Deus: Quem deseja viver para sempre ouça com os ouvidos a voz do meu servo.”[a] E diz novamente: “Ouça, ó céu, e dê ouvidos, ó terra, pois o Senhor falou estas coisas como testemunho.” E diz novamente: “Ouçam as palavras do Senhor, governantes deste povo.” E diz novamente: “Ouçam, meus filhos, a voz daquele que clama no deserto.” Portanto, ele circuncidou nossos ouvidos para que, ouvindo a palavra, crêssemos.


    Além disso, a circuncisão na qual eles depositam confiança foi abolida, pois ele disse que se deve praticar uma circuncisão que não é da carne. Eles, porém, transgrediram, porque um anjo maligno lhes ensinou astúcia.


    Ele lhes diz: “Assim diz o Senhor, seu Deus” — é assim que encontro o mandamento —: “Não semeiem entre espinhos; sejam circuncidados para o seu Senhor.”[b] E o que ele diz? “Sejam circuncidados na dureza do seu coração; então vocês não endurecerão a sua cerviz.” Considere também isto: “Vejam”, diz o Senhor, “todas as nações são incircuncisas no prepúcio, mas este povo é incircunciso no coração.”


    Mas você dirá: “Na verdade, o povo foi circuncidado como sinal.” Não, pois também o são todos os sírios e árabes e todos os sacerdotes dos ídolos. Acaso todos eles também pertencem à aliança deles? Além disso, os egípcios também estão entre os circuncidados.


    Aprendam, portanto, plenamente acerca de todas as coisas, filhos do amor: Abraão, que primeiro instituiu a circuncisão, contemplou antecipadamente Jesus no Espírito quando circuncidou, tendo recebido as determinações de três letras.


    Pois a Escritura diz: “E Abraão circuncidou, dentre os de sua casa, dezoito e trezentos homens.”[c] Que conhecimento, então, lhe foi dado? Entendam que ele menciona primeiro os dezoito e, depois de um intervalo, os trezentos. Nos dezoito, “I” vale dez e “H”, oito. Aí vocês têm JESUS (IHSOYS).[d] E, visto que a cruz, representada pelo “T”, haveria de trazer graça, ele menciona também trezentos. Assim, revela Jesus nas duas letras e, na restante, a cruz.


    Aquele que colocou em nós o dom inato de sua aliança sabe: ninguém jamais recebeu de mim palavra mais autêntica. Mas sei que vocês são dignos dela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O testemunho inglês fornecido contém neste ponto o sinal intrusivo “~y”, provavelmente um artefato editorial ou de paginação; ele não foi incorporado ao texto.
    reason: Documentar a omissão de material evidentemente extratextual no testemunho de base.
  - marker: b
    text: “Sejam circuncidados para o seu Senhor” reproduz uma formulação textual difícil. A relação exata expressa pela preposição é incerta no testemunho disponível.
    reason: Preservar a dificuldade textual sem substituí-la silenciosamente por uma formulação teologicamente mais clara.
  - marker: c
    text: A formulação segue a ordem usada pelo autor — dezoito e trezentos — para permitir a interpretação numérica que vem a seguir; compare Gênesis 14:14, que totaliza trezentos e dezoito.
    reason: Explicar a ordem incomum sem harmonizar o argumento do autor.
  - marker: d
    text: 'O argumento usa letras gregas como numerais: Ι (iota) = 10, Η (eta) = 8 e Τ (tau) = 300. ΙΗ são as duas primeiras letras da forma grega de “Jesus”, ΙΗΣΟΥΣ, e Τ foi entendido pelo autor como figura da cruz. As formas latinizadas I, H e T foram mantidas para acompanhar o testemunho fornecido.'
    reason: Tornar inteligível ao leitor moderno o raciocínio alfabético-numérico da passagem.
lexical_decisions:
- source_word: περιέτεμεν / circumcised
  choice: circuncidou
  rationale: Mantém a metáfora central e sua conexão deliberada entre coração, ouvidos e rito corporal.
- source_word: ἀκροβυστία / foreskin
  choice: prepúcio
  rationale: Termo anatômico direto e corrente, necessário ao contraste com a incircuncisão do coração.
- source_word: σφραγίς / seal
  choice: sinal
  rationale: Em português corrente, “sinal” comunica melhor a função identificadora alegada para a circuncisão; evita sugerir apenas um objeto físico, embora “selo” seja alternativa formal.
- source_word: πανουργία / cleverness
  choice: astúcia
  rationale: Preserva a conotação negativa do ensino atribuído ao anjo maligno sem suavizá-lo como mera inteligência.
- source_word: δόγματα / ordinances
  choice: determinações
  rationale: Conserva a ideia de instruções ou disposições recebidas, sem impor o sentido técnico posterior de “dogmas”.
- source_word: σύμφυτος δωρεά / innate gift
  choice: dom inato
  rationale: Reproduz a formulação incomum do testemunho, deixando aberta a relação exata entre o dom, o autor e a aliança.
theological_decisions:
- issue: Agente da circuncisão do coração e dos ouvidos
  choice: Manter o pronome “ele” sem identificar explicitamente o referente
  alternative: Explicitar “Deus”, “o Senhor” ou “Cristo”
  rationale: O texto fornecido alterna referências pronominais e não resolve sempre o antecedente; a tradução preserva essa ambiguidade.
- issue: Afirmação sobre a circuncisão ritual
  choice: “foi abolida”
  alternative: “foi invalidada” ou “está anulada”
  rationale: Preserva a força polêmica do testemunho sem acrescentar uma teoria posterior sobre lei, igreja ou aliança.
- issue: “um anjo maligno”
  choice: Traduzir literalmente e sem identificar a figura
  alternative: Identificá-lo como Satanás
  rationale: O testemunho não nomeia o anjo; uma identificação explícita importaria interpretação.
- issue: Leitura cristológica dos números e letras
  choice: Preservar a exegese alfabético-numérica do autor
  alternative: Corrigir ou harmonizar com a forma hebraica de Gênesis 14:14
  rationale: A passagem depende da numeração grega e constitui o argumento histórico do texto, mesmo não correspondendo ao sentido simples da passagem de Gênesis.
- issue: “no Espírito”
  choice: Usar inicial maiúscula, sem ampliar a frase
  alternative: “em espírito”
  rationale: O contexto apresenta uma percepção profética voltada para Jesus; a maiúscula é plausível, mas a formulação continua breve e não define uma doutrina técnica de inspiração.
- issue: Aliança no parágrafo final
  choice: “sua aliança”
  alternative: “a aliança dele” ou “a aliança de Deus”
  rationale: Mantém a referência pronominal do testemunho sem explicitar além da evidência fornecida.
translation_notes:
  register: Português moderno, dignificado e amplamente legível no Brasil, com plural em “vocês” e imperativos correspondentes. As citações foram mantidas em estilo bíblico corrente, sem arcaísmos como “vós”, “cerviz” sendo preservado apenas na expressão tradicional “endurecer a cerviz”. Trata-se de rascunho necessariamente provisório, pois o material fornecido informa que a revisão direta do grego/latim ainda está pendente; por isso, dificuldades e possíveis artefatos do testemunho inglês foram sinalizados em notas em vez de resolvidos por conjectura.
