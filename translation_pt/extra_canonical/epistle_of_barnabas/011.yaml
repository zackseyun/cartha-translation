  register: Português moderno, digno e de leitura ampla, com preferência por sintaxe natural no Brasil sem regionalismos marcados. As citações mantêm cadência bíblica moderada. Como a revisão direta do grego/latim está pendente e o material fornecido é um testemunho inglês de domínio público, a redação permanece cautelosa, preservando lacunas e ambiguidades em vez de reconstruí-las.
