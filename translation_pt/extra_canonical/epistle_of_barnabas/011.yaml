    issue: “Firmando no espírito nosso temor e nossa esperança em Jesus” interpreta além do necessário a construção final.
    rationale: O testemunho diz “resting ... in the spirit”, e a construção antiga é apropriadamente preservada em português por “tendo, no espírito, nosso temor e nossa esperança em Jesus”, como a própria nota alternativa reconhece.
  - severity: low
    issue: “destas coisas” explicita um substantivo ausente na última citação.
    rationale: O demonstrativo pode permanecer sem essa explicitação (“destas”), preservando melhor sua referência aberta e a transição para a interpretação do autor.
