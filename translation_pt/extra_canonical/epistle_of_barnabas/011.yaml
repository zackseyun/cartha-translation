lexical_decisions:
- source_word: ἄφεσις / remission (witness)
  choice: perdão
  rationale: Expressa em português corrente a remissão de pecados, sem introduzir uma teoria específica da expiação.
- source_word: βάπτισμα / baptism (witness)
  choice: batismo
  rationale: Preserva o termo técnico cristão empregado pelo autor e sua relação explícita com a descida à água.
- source_word: λάκκος / pit (scriptural citation tradition)
  choice: cisterna
  rationale: No contraste com a fonte da vida, “cisterna” reproduz melhor a imagem profética de um reservatório escavado, embora o testemunho inglês diga genericamente “pit”.
- source_word: σκεῦος / vessel (probable source term)
  choice: recipiente
  rationale: Mantém a metáfora de algo que contém ou porta o Espírito em linguagem compreensível; “vaso” é registrado em nota como alternativa tradicional.
- source_word: ἐπιστροφή / conversion (witness sense)
  choice: conversão
  rationale: Conserva o sentido de mudança ou retorno sem especificar um rito ou modelo denominacional.
- source_word: φόβος / fear
  choice: temor
  rationale: “Temor” mantém a reverência religiosa e evita que a expressão seja reduzida a mero pânico.
theological_decisions:
- issue: Relação entre batismo, água e perdão dos pecados
  choice: “o batismo que traz o perdão dos pecados”
  alternative: “o batismo para o perdão dos pecados”
  rationale: Segue a afirmação causal do testemunho sem ampliá-la nem explicar seu mecanismo sacramental.
- issue: Esperança depositada na cruz
  choice: Preservar literalmente “depositam sua esperança na cruz”
  alternative: Explicitar “em Cristo crucificado”
  rationale: Mantém a formulação e a exegese próprias do autor, sem resolver ou modernizar a metonímia.
- issue: “Recipiente do seu Espírito”
  choice: Manter o referente sem identificá-lo explicitamente
  alternative: Identificá-lo como corpo, pessoa, Igreja ou terra
  rationale: O contexto fornecido não determina inequivocamente o referente; a ambiguidade teológica foi preservada.
- issue: Temor e esperança em Jesus “no espírito”
  choice: “firmando no espírito nosso temor e nossa esperança em Jesus”
  alternative: “tendo nosso temor e nossa esperança em Jesus por meio do Espírito”
  rationale: Evita transformar “espírito” inequivocamente no Espírito Santo ou em uma instrumentalidade que o texto não esclarece.
