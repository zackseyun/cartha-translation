base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/011.yaml
  text: 'But let us ask whether the Lord took care to reveal beforehand anything about the water and the cross. Now concerning the water, it is written with reference to Israel that they would not receive the baptism that brings forgiveness of sins, but would build for themselves.


    For the prophet says, “Be astonished, heaven, and let the earth shudder even more at this, for this people has done two evil things: they abandoned me, the fountain of life, and they dug for themselves a pit of death.


    “Is my holy mountain of Sinai a desert rock? For you shall be like the young birds that flutter aloft when deprived of their nest.”


    And again the prophet says, “I will go before you and level mountains, crush gates of bronze, and break iron bars in pieces. I will give you treasures—dark, concealed, and unseen—so that they may know that I am the Lord God.”


    And, “You shall dwell in a lofty cave of a strong rock.” And, “His water shall be sure. You shall see the King in glory, and your soul shall meditate on the fear of the Lord.”


    And again he says in another prophet, “The one who does these things shall be like the tree planted beside divided streams of water, which shall yield its fruit in its proper season. Its leaf shall not fall off, and everything he does shall prosper.


    “Not so the ungodly, not so. Instead, they are like the dust that the wind scatters from the face of the earth. Therefore, ungodly people shall not stand in the judgment, nor sinners in the council of the righteous. For the Lord knows the way of the righteous, but the way of the ungodly shall perish.”


    You understand how he pointed out the water and the cross at the same time. For this is the meaning: Blessed are those who set their hope on the cross and go down into the water. For he speaks of the reward “in its proper season.” “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves shall not fall off.” By this he means that every word that comes from your mouth in faith and love shall lead many to conversion and hope.


    And again another prophet says, “The land of Jacob was praised above the whole earth.” He means this: He glorifies the vessel of his Spirit.


    What does he say next? “There was a river flowing from the right hand, and beautiful trees grew up from it. Whoever eats from them shall live forever.”


    He says this because we go down into the water burdened with sins and filth, and we rise from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. “Whoever eats from these shall live forever.” He means this: “Whoever,” he says, “hears these things being spoken and believes shall live forever.”'
translation:
  language: pt
  text: 'Mas perguntemos se o Senhor teve o cuidado de revelar de antemão algo a respeito da água e da cruz. Quanto à água, está escrito acerca de Israel que eles não receberiam o batismo que traz o perdão dos pecados, mas construiriam para si mesmos.[a]


    Pois o profeta diz: “Espante-se, ó céu, e que a terra estremeça ainda mais diante disso, porque este povo cometeu dois males: abandonaram a mim, a fonte da vida, e cavaram para si uma cisterna de morte.


    “Acaso o meu santo monte Sinai é uma rocha deserta? Pois vocês serão como filhotes de ave que esvoaçam no alto quando ficam privados do ninho.”


    E novamente o profeta diz: “Irei adiante de você, nivelarei montanhas, esmagarei portas de bronze e despedaçarei ferrolhos de ferro. Darei a você tesouros escuros, ocultos e invisíveis, para que saibam que eu sou o Senhor Deus.”


    E: “Você habitará numa caverna elevada de uma rocha firme.” E: “Sua água será segura. Vocês verão o Rei em glória, e a alma de vocês meditará no temor do Senhor.”


    E novamente ele diz em outro profeta: “Aquele que faz essas coisas será como a árvore plantada junto às correntes de águas, a qual dará seu fruto no tempo devido. Sua folha não cairá, e tudo o que ele fizer prosperará.


    “Não são assim os ímpios, não são assim; pelo contrário, são como o pó que o vento espalha da face da terra. Por isso, os ímpios não permanecerão de pé no juízo, nem os pecadores no conselho dos justos. Pois o Senhor conhece o caminho dos justos, mas o caminho dos ímpios perecerá.”


    Vocês entendem como ele indicou ao mesmo tempo a água e a cruz. Pois o sentido é este: felizes os que depositam sua esperança na cruz e descem à água. Ele fala da recompensa “no tempo devido”. “Então”, diz ele, “eu retribuirei”. Mas o que ele diz a respeito do presente? “Suas folhas não cairão.” Com isso ele quer dizer que toda palavra que sair da boca de vocês com fé e amor levará muitos à conversão e à esperança.


    E novamente outro profeta diz: “A terra de Jacó foi louvada acima de toda a terra.” Ele quer dizer isto: Deus glorifica o recipiente do seu Espírito.[b]


    O que ele diz em seguida? “Havia um rio que fluía do lado direito, e dele brotaram belas árvores. Quem comer delas viverá para sempre.”


    Ele diz isso porque descemos à água carregados de pecados e imundície e dela subimos dando fruto no coração, firmando no espírito nosso temor e nossa esperança em Jesus.[c] “Quem comer destas coisas viverá para sempre.” Ele quer dizer isto: “Quem”, diz ele, “ouvir estas coisas que estão sendo ditas e crer viverá para sempre.”


    [a] A frase termina de modo incompleto nos testemunhos que fundamentam esta versão: “mas construiriam para si mesmos”. Não se acrescentou um objeto que eliminasse essa lacuna.

    [b] Ou: “o vaso do seu Espírito”.

    [c] A construção também pode ser entendida como “tendo, no espírito, nosso temor e nossa esperança em Jesus”.'
