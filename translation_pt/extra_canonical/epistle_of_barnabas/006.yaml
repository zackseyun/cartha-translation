base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/006.yaml
  text: 'When, then, he gave the commandment, what does he say? “Who is it who disputes with me? Let him oppose me. Or who is it who goes to court with me? Let him draw near to the servant of the Lord.


    Woe to you, for you will all grow old like a garment, and the moth will consume you.” And again the prophet says, since he was appointed like a hard stone for crushing: “Behold, I will place in the fountains of Zion a very precious, chosen, honored chief cornerstone.”


    Then again, what does he say? “And whoever sets his hope on him will live forever.” Is our hope, then, set on a stone? Far from it! Rather, it is because the Lord has established his flesh in strength. For he says, “And he set me like a hard rock.”


    And the prophet says again, “The stone that the builders rejected has become the head and the corner.” And again he says, “This is the great and wonderful day that the Lord made.”


    I am writing to you more simply so that you may understand—I who am the scum of your love.


    What, then, does the prophet say again? “The assembly of evildoers gathered around me; they surrounded me as bees surround a honeycomb”; and, “They cast lots for my garment.”


    Since, then, he was about to be revealed in the flesh and to suffer, his suffering was revealed beforehand. For the prophet says concerning Israel, “Woe to their soul, for they have devised an evil plan against themselves, saying, ‘Let us bind the righteous one, for he is of no use to us.’”


    What does the other prophet, Moses, say to them? “Behold, this is what the Lord God says: Enter the good land that the Lord swore to Abraham, Isaac, and Jacob, and inherit it—a land flowing with milk and honey.”


    But what does knowledge say? Understand: Set your hope on him who is about to be revealed to you in the flesh, namely Jesus. For a human is suffering earth, since Adam’s creation came from the face of the earth.


    What, then, does he say? “Into the good land, a land flowing with milk and honey.” Blessed is our Lord, brothers, who established among us wisdom and understanding of his secret things. For the prophet speaks a parable concerning the Lord. Who will understand it except one who is wise and prudent and loves his Lord?


    Since, then, he renewed us through the forgiveness of sins, he made us into a new type, so that we would have the soul of children, as though he were creating us again.


    For Scripture speaks concerning us when he says to the Son, “Let us make humanity according to our image and according to our likeness, and let them rule over the beasts of the earth, the birds of heaven, and the fish of the sea.” And when the Lord saw the beautiful creation of us humans, he said, “Increase and multiply and fill the earth.” These words refer to the Son.


    Again I will show you how the Lord speaks concerning us. He made a second creation at the end, and the Lord says, “Behold, I make the last things like the first.” Referring to this, then, the prophet proclaimed, “Enter a land flowing with milk and honey, and be lords over it.”


    Behold, then, we have been created anew, as he says again in another prophet: “Behold, says the Lord, I will take from these”—that is, from those whom the Spirit of the Lord foresaw—“their stony hearts, and I will put hearts of flesh into them,” for he himself was to be revealed in the flesh and to dwell in us.


    For the dwelling place of our heart is a holy temple to the Lord, my brothers.


    For the Lord says again, “With what shall I appear before the Lord my God and be glorified? I will confess you in the assembly of my brothers, and I will sing to you in the midst of the assembly of the saints.” We, therefore, are those whom he brought into the good land.


    What, then, are the milk and the honey? The child is first kept alive by honey and then by milk. In the same way, we also, being kept alive by our faith in the promise and by the word, will live and be lords of the earth.


    Now we have already said above, “And let them increase and multiply and rule over the fish.” But who is able [now] to rule over beasts, fish, and birds of heaven? For we ought to understand that ruling implies power, so that one gives orders and exercises dominion.


    If, then, this does not happen now, surely he spoke to us about the hereafter, when we ourselves will be made perfect so that we may become heirs of the Lord’s covenant.'
translation:
  language: pt
  text: 'Quando, pois, ele deu o mandamento, o que diz? “Quem é aquele que contende comigo? Que se oponha a mim. Ou quem é aquele que entra em juízo comigo? Que se aproxime do servo do Senhor.


    Ai de vocês, pois todos envelhecerão como uma veste, e a traça os consumirá.” E novamente diz o profeta, visto que ele foi destinado, como pedra dura, para o esmagamento: “Eis que porei nas fontes de Sião uma pedra muito preciosa, escolhida, honrada, principal pedra angular.”[a]


    Então, novamente, o que diz? “E todo aquele que nele puser a esperança viverá para sempre.” Acaso nossa esperança está posta numa pedra? De modo nenhum! Antes, é porque o Senhor firmou sua carne com poder. Pois ele diz: “E ele me firmou como rocha dura.”


    E o profeta diz novamente: “A pedra que os construtores rejeitaram tornou-se a cabeça da esquina.” E outra vez diz: “Este é o grande e maravilhoso dia que o Senhor fez.”


    Escrevo a vocês de modo mais simples, para que entendam — eu, que sou o refugo do amor de vocês.[b]


    O que, então, diz novamente o profeta? “A assembleia dos malfeitores reuniu-se ao meu redor; cercaram-me como abelhas cercam um favo”; e: “Lançaram sortes sobre a minha veste.”


    Uma vez que ele estava prestes a manifestar-se na carne e a sofrer, seu sofrimento foi manifestado de antemão. Pois o profeta diz a respeito de Israel: “Ai da alma deles, porque tramaram contra si mesmos um plano maligno, dizendo: ‘Amarremos o justo, porque ele não nos é útil.’”


    O que lhes diz o outro profeta, Moisés? “Eis o que diz o Senhor Deus: Entrem na boa terra que o Senhor jurou dar a Abraão, Isaque e Jacó, e tomem posse dela — terra que mana leite e mel.”


    Mas o que diz o conhecimento? Entendam: ponham sua esperança naquele que está prestes a manifestar-se a vocês na carne, isto é, Jesus. Pois o ser humano é terra que sofre, uma vez que a criação de Adão veio da superfície da terra.[c]


    O que, então, diz ele? “Para a boa terra, terra que mana leite e mel.” Bendito seja nosso Senhor, irmãos, que estabeleceu entre nós sabedoria e entendimento de seus mistérios. Pois o profeta fala uma parábola acerca do Senhor. Quem a compreenderá, senão aquele que é sábio e prudente e ama seu Senhor?


    Uma vez que ele nos renovou pelo perdão dos pecados, fez de nós um novo tipo, para que tivéssemos alma de crianças, como se estivesse nos criando novamente.


    Pois a Escritura fala a nosso respeito quando ele diz ao Filho: “Façamos o ser humano segundo a nossa imagem e segundo a nossa semelhança, e que eles governem os animais da terra, as aves do céu e os peixes do mar.” E, quando o Senhor viu a bela criação de nós, seres humanos, disse: “Cresçam, multipliquem-se e encham a terra.” Essas palavras se referem ao Filho.


    Mostrarei novamente a vocês como o Senhor fala a nosso respeito. No fim, ele fez uma segunda criação, e o Senhor diz: “Eis que faço as últimas coisas como as primeiras.” Referindo-se a isso, o profeta proclamou: “Entrem numa terra que mana leite e mel e exerçam domínio sobre ela.”


    Vejam, portanto: fomos criados de novo, como ele diz ainda em outro profeta: “Eis que”, diz o Senhor, “tirarei destes” — isto é, daqueles que o Espírito do Senhor conheceu de antemão — “seus corações de pedra e porei neles corações de carne”; pois ele próprio haveria de manifestar-se na carne e habitar em nós.


    Com efeito, a morada de nosso coração é templo santo para o Senhor, meus irmãos.


    Pois o Senhor diz novamente: “Com que comparecerei diante do Senhor, meu Deus, e serei glorificado? Eu te confessarei na assembleia de meus irmãos e cantarei a ti no meio da assembleia dos santos.” Nós, portanto, somos aqueles que ele conduziu à boa terra.


    O que são, então, o leite e o mel? A criança é mantida viva primeiro pelo mel e depois pelo leite. Do mesmo modo, também nós, mantidos vivos pela fé na promessa e pela palavra, viveremos e exerceremos domínio sobre a terra.


    Já dissemos acima: “E que eles cresçam, multipliquem-se e governem os peixes.” Mas quem é capaz [agora] de governar os animais, os peixes e as aves do céu?[d] Pois devemos entender que governar implica poder, de modo que alguém dê ordens e exerça domínio.


    Se, portanto, isso não acontece agora, certamente ele falou a nós acerca do mundo futuro, quando nós mesmos seremos aperfeiçoados, para que nos tornemos herdeiros da aliança do Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “fontes de Sião” reproduz a leitura da testemunha fornecida. A forma e a combinação das citações diferem de versões bíblicas correntes.
    reason: Sinalizar uma leitura textual distintiva sem harmonização conjectural.
  - marker: b
    text: “Refugo do amor de vocês” é uma expressão deliberadamente autodepreciativa e incomum; também poderia ser vertida como “escória do amor de vocês”.
    reason: Explicar uma metáfora difícil cuja estranheza pertence ao texto.
  - marker: c
    text: Literalmente, “o ser humano é terra que sofre”. A formulação associa a humanidade ao solo do qual Adão foi formado, mas seu sentido exato permanece difícil.
    reason: Preservar e esclarecer uma expressão obscura sem resolver sua ambiguidade.
  - marker: d
    text: A palavra “agora” aparece entre colchetes porque é uma indicação textual/editorial na testemunha usada como base e sua posição no texto requer confirmação pela revisão do grego e do latim.
    reason: Conservar o sinal textual solicitado e informar seu caráter provisório.
lexical_decisions:
- source_word: servant of the Lord
  choice: servo do Senhor
  rationale: Mantém a identificação ambígua da citação sem especificar se o referente é profético, messiânico ou coletivo.
- source_word: fountains of Zion
  choice: fontes de Sião
  rationale: Preserva a leitura distintiva da testemunha fornecida, sem harmonizá-la com formas bíblicas mais conhecidas como 'fundamentos de Sião'.
- source_word: offscouring
  choice: refugo
  rationale: Reproduz a autodepreciação forte do autor em português atual e digno; 'escória' seria possível, mas pode soar mais agressivo e menos relacional.
- source_word: man is earth suffering
  choice: o ser humano é terra que sofre
  rationale: Mantém a formulação difícil e sua provável associação entre humanidade, terra e sofrimento, sem corrigir conjecturalmente o texto.
- source_word: new type
  choice: novo tipo
  rationale: Conserva a linguagem tipológica explícita, evitando substituí-la por 'nova natureza', que acrescentaria uma interpretação teológica.
- source_word: secret things
  choice: mistérios
  rationale: Expressa de maneira natural os conteúdos ocultos ou secretos de Deus no contexto sapiencial, sem sugerir esoterismo moderno.
- source_word: be lords over it
  choice: exerçam domínio sobre ela
  rationale: Transmite autoridade e governo sem a construção pouco natural 'sejam senhores dela'.
- source_word: hereafter
  choice: mundo futuro
  rationale: Comunica o horizonte escatológico pretendido de forma corrente, sem definir com maior precisão a etapa ou estado em questão.
theological_decisions:
- issue: Referentes dos pronomes divinos e messiânicos
  choice: Manter 'ele' em minúscula e os referentes contextualmente implícitos
  alternative: Capitalizar pronomes referentes a Deus ou a Cristo
  rationale: O português moderno normalmente não exige maiúsculas reverenciais, e a minúscula preserva possíveis oscilações de referente no argumento.
- issue: Interpretação cristológica das citações da pedra
  choice: Preservar a explicação do autor de que a esperança está naquele manifestado na carne
  alternative: Inserir explicitamente 'Cristo' em cada citação
  rationale: O capítulo identifica Jesus mais adiante, mas nem todas as citações contêm essa identificação lexical; explicitá-la em cada ponto eliminaria a progressão argumentativa.
- issue: Fala divina em Gênesis dirigida ao Filho
  choice: 'Traduzir literalmente a afirmação do autor: ''quando ele diz ao Filho'''
  alternative: Reformular como uma interpretação posterior do plural divino
  rationale: A leitura protológica do autor é parte do texto e deve permanecer visível, sem ser endossada nem atenuada editorialmente.
- issue: Habitação divina e coração como templo
  choice: Manter a relação entre manifestação na carne, habitação em nós e templo do coração
  alternative: Sistematizar como doutrina trinitária ou eclesiológica
  rationale: O texto reúne essas imagens sem desenvolver uma formulação sistemática; a tradução conserva essa tensão.
- issue: Domínio futuro sobre a criação
  choice: Traduzir como expectativa do 'mundo futuro' e aperfeiçoamento dos herdeiros
  alternative: Definir o evento como milênio, céu ou nova criação
  rationale: O texto afirma uma realização futura, mas não especifica um esquema escatológico denominacional.
translation_notes:
  register: Português moderno, amplamente internacional, com leitura natural no Brasil. Empregaram-se 'vocês' e formas verbais correspondentes, preservando tom epistolar digno. As citações mantêm paralelismo e alguma solenidade, mas evitam arcaísmos. Este é um rascunho fundamentado na testemunha inglesa pública fornecida; a revisão direta dos testemunhos gregos e latinos continua necessária, sobretudo nas citações compostas, em 'fontes de Sião', 'terra que sofre' e no colchete de '[agora]'.
