    O que, então, diz ele? “Para a boa terra, terra que mana leite e mel.” Bendito seja nosso Senhor, irmãos, que estabeleceu entre nós sabedoria e entendimento de seus mistérios. Pois o profeta fala uma parábola acerca do Senhor. Quem a compreenderá, senão aquele que é sábio e prudente e ama seu Senhor?


    Uma vez que ele nos renovou pelo perdão dos pecados, fez de nós um novo tipo, para que tivéssemos alma de crianças, como se estivesse nos criando novamente.


    Pois a Escritura fala a nosso respeito quando ele diz ao Filho: “Façamos o ser humano segundo a nossa imagem e segundo a nossa semelhança, e que eles governem os animais da terra, as aves do céu e os peixes do mar.” E, quando o Senhor viu a bela criação de nós, seres humanos, disse: “Cresçam, multipliquem-se e encham a terra.” Essas palavras se referem ao Filho.


    Mostrarei novamente a vocês como o Senhor fala a nosso respeito. No fim, ele fez uma segunda criação, e o Senhor diz: “Eis que faço as últimas coisas como as primeiras.” Referindo-se a isso, o profeta proclamou: “Entrem numa terra que mana leite e mel e exerçam domínio sobre ela.”


    Vejam, portanto: fomos criados de novo, como ele diz ainda em outro profeta: “Eis que”, diz o Senhor, “tirarei destes” — isto é, daqueles que o Espírito do Senhor previu — “seus corações de pedra e porei neles corações de carne”; pois ele próprio haveria de manifestar-se na carne e habitar em nós.


    Com efeito, a morada de nosso coração é templo santo para o Senhor, meus irmãos.


    Pois o Senhor diz novamente: “Com que comparecerei diante do Senhor, meu Deus, e serei glorificado? Eu te confessarei na assembleia de meus irmãos e cantarei a ti no meio da assembleia dos santos.” Nós, portanto, somos aqueles que ele conduziu à boa terra.


    O que são, então, o leite e o mel? A criança é mantida viva primeiro pelo mel e depois pelo leite. Do mesmo modo, também nós, mantidos vivos pela fé na promessa e pela palavra, viveremos e exerceremos domínio sobre a terra.


    Já dissemos acima: “E que eles cresçam, multipliquem-se e governem os peixes.” Mas quem é capaz [agora] de governar os animais, os peixes e as aves do céu?[d] Pois devemos entender que governar implica poder, de modo que alguém dê ordens e exerça domínio.


    Se, portanto, isso não acontece agora, certamente ele falou a nós acerca do mundo futuro, quando nós mesmos seremos aperfeiçoados, para que nos tornemos herdeiros da aliança do Senhor.'
