  footnotes:
  - marker: a
    text: “Agente” traduz provisoriamente o incomum “Active One” do testemunho inglês fornecido. A identidade e a forma exata do título dependem de revisão direta dos testemunhos gregos e latinos.
    reason: Sinalizar ambiguidade lexical e teológica relevante sem resolvê-la no corpo do texto.
  - marker: b
    text: “Ciência” conserva provisoriamente o termo do testemunho inglês; aqui pode ter o sentido amplo de saber ou instrução, a confirmar pela revisão da língua-fonte.
    reason: Evitar uma precisão lexical indevida enquanto a revisão grega/latina está pendente.
lexical_decisions:
- source_word: Active One
  choice: Agente
  rationale: Preserva o caráter incomum e potencialmente titular da expressão do testemunho fornecido, sem identificá-la silenciosamente com Deus, Cristo ou o Maligno.
- source_word: ordinances
  choice: mandamentos
  rationale: Em português corrente, comunica normas ou determinações do Senhor de modo mais natural que “ordenanças”, sem especificar ritos.
- source_word: long-suffering
  choice: longanimidade
  rationale: Mantém a distinção em relação a “paciência” e conserva o registro ético antigo em linguagem ainda reconhecível.
- source_word: self-restraint
  choice: domínio próprio
  rationale: Expressão moderna e clara para autocontrole moral.
- source_word: science
  choice: ciência
  rationale: Retém a amplitude e a estranheza do testemunho inglês provisório, sem reduzi-la a um tipo específico de saber antes da revisão grega/latina.
- source_word: whole burnt offerings
  choice: holocaustos
  rationale: Termo bíblico tradicional para ofertas totalmente queimadas; o contexto sacrificial impede o sentido moderno não ritual.
- source_word: oblation
  choice: oferta
  rationale: Vocábulo natural e amplo que preserva a ideia cultual sem tecnicismo desnecessário.
- source_word: broken heart
  choice: coração quebrantado
  rationale: Formulação bíblica consagrada e inteligível para contrição ou humilhação interior.
theological_decisions:
- issue: Identidade do “Active One”
  choice: Manter como “Agente”, com nota de incerteza
  alternative: Explicitar “o Maligno” ou “Deus”
  rationale: O material fornecido assinala a expressão como título potencialmente significativo ou ambíguo; a tradução não deve resolver a identidade sem revisão da fonte antiga.
- issue: Anulação dos sacrifícios
  choice: Traduzir diretamente “anulou essas coisas”
  alternative: Abrandar para “deixou de exigir essas coisas”
  rationale: Preserva a força e a tensão teológica do testemunho, sem harmonização denominacional.
- issue: A nova lei e sua oferta
  choice: Conservar a linguagem cultual de lei, jugo e oferta não feita por mãos humanas
  alternative: Interpretar a oferta como oração, eucaristia ou vida moral
  rationale: O texto não identifica explicitamente a oferta; a tradução mantém a abertura interpretativa.
- issue: Contraste com os pais que saíram do Egito
  choice: Manter a pergunta e a resposta negativa sem explicação harmonizadora
  alternative: Acrescentar distinção entre tipos, ocasiões ou finalidades de sacrifício
  rationale: Preserva a argumentação própria da epístola e sua tensão com outras formulações escriturísticas.
- issue: “nossa vida” no encerramento
  choice: Manter “nossa vida”
  alternative: Interpretar como “vida eterna” ou “salvação”
  rationale: Evita definir além do que consta no testemunho disponível.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. O discurso profético usa “vocês” para clareza plural. Mantêm-se termos bíblicos reconhecíveis, como “holocaustos”, “longanimidade” e “coração quebrantado”, quando carregam distinções relevantes. Como o material-base declara pendente a revisão direta do grego/latim, as escolhas mais incertas foram preservadas e anotadas, não conjecturalmente resolvidas.
