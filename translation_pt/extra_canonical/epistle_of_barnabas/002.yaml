base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: pt
  text: 'Vendo, pois, que os dias são maus e que o próprio Agente[a] detém a autoridade, devemos cuidar de nós mesmos e buscar os mandamentos do Senhor.


    Os auxílios da nossa fé são o temor e a paciência; e nossos aliados, a longanimidade e o domínio próprio.


    Enquanto essas virtudes permanecem em espírito puro nas coisas referentes ao Senhor, a sabedoria, a compreensão, a ciência[b] e o conhecimento se alegram com elas.


    Pois ele nos revelou, por meio de todos os profetas, que não deseja sacrifícios, nem holocaustos, nem ofertas. Em certa ocasião, disse:


    “Que me importa a multidão dos sacrifícios de vocês?”, diz o Senhor. “Estou farto de holocaustos; não desejo a gordura de cordeiros nem o sangue de touros e bodes, nem mesmo quando vocês vêm apresentar-se diante de mim. Ou quem exigiu essas coisas das mãos de vocês? Não continuem a pisar o meu pátio. Se trouxerem farinha fina, será em vão; o incenso é uma abominação para mim. Não suporto as luas novas e os sábados de vocês.”


    Ele, portanto, anulou essas coisas, para que a nova lei de nosso Senhor Jesus Cristo, livre do jugo da imposição, tivesse uma oferta não feita por mãos humanas.


    E ele lhes diz novamente: “Acaso ordenei aos pais de vocês, quando saíram da terra do Egito, que me trouxessem holocaustos e sacrifícios?


    “Não. Esta foi a ordem que lhes dei: Nenhum de vocês guarde no coração rancor contra o seu próximo, e não amem juramento falso.”


    Assim, a menos que sejamos insensatos, devemos compreender a intenção da bondade de nosso Pai. Pois ele fala conosco porque deseja que não nos desviemos como eles, mas que procuremos saber como nos aproximar dele.


    Assim, ele nos diz: “O sacrifício para Deus é um coração quebrantado; o aroma agradável ao Senhor é um coração que glorifica o seu Criador.” Portanto, irmãos, devemos aprender com precisão o que diz respeito à nossa salvação, para que o Maligno, introduzindo em nós o erro, não nos arremesse para longe da nossa vida.'
