  footnotes:
  - marker: a
    text: A redação e a pontuação desta prescrição são incertas nos testemunhos antigos; também se pode entender que as vísceras sejam comidas “sem lavar, com vinagre”.
    reason: A construção transmitida é incomum, e o vínculo sintático de “com vinagre” não é totalmente seguro.
  - marker: b
    text: “Ráquia” translitera o nome de uma planta nos testemunhos. Sua identificação botânica exata é incerta; o texto a descreve como um espinheiro de brotos ou fruto doce.
    reason: Evita identificar sem base suficiente uma espécie botânica obscura.
lexical_decisions:
- source_word: children of gladness
  choice: filhos da alegria
  rationale: Preserva a forma metafórica e afetiva do testemunho sem substituí-la por uma paráfrase interpretativa.
- source_word: quick and dead
  choice: vivos e mortos
  rationale: Expressão corrente em português para o par escatológico tradicional.
- source_word: vessel of his Spirit
  choice: receptáculo de seu Espírito
  rationale: Mantém a imagem corporal de recipiente e a ambiguidade do possessivo, evitando explicá-la como simples corpo humano.
- source_word: type / symbol
  choice: figura
  rationale: “Figura” comunica a correspondência tipológica antiga em linguagem compreensível, sem impor terminologia confessional mais técnica.
- source_word: whole burnt offering
  choice: holocausto
  rationale: Termo sacrificial estabelecido em português para uma oferta inteiramente queimada; o contexto impede o sentido histórico moderno.
- source_word: goad it
  choice: espetá-lo
  rationale: Expressa a ação hostil de ferir ou picar o bode, sem especificar um instrumento não garantido pelo testemunho.
- source_word: Rachia
  choice: Ráquia
  rationale: Transliteração portuguesa provisória do nome da planta conservado no testemunho, cuja identificação é incerta.
- source_word: take hold of me
  choice: apoderar-se de mim
  rationale: Conserva a força da imagem de agarrar ou obter, embora a formulação seja deliberadamente intensa e incomum.
theological_decisions:
- issue: Agência e finalidade do sofrimento do Filho
  choice: “sofreu para que sua ferida nos desse vida” e “por nossa causa”
  alternative: “foi ferido para nos vivificar” ou “em nosso lugar”
  rationale: Preserva a linguagem causal do testemunho sem converter a passagem em uma formulação técnica de uma teoria específica da expiação.
- issue: “Seu Espírito” no receptáculo oferecido
  choice: Manter “o receptáculo de seu Espírito”
  alternative: Explicitar como “seu corpo”
  rationale: A metáfora antiga e a relação entre pessoa, carne e Espírito permanecem abertas no texto; explicitar “corpo” eliminaria essa tensão.
- issue: “Novo povo”
  choice: Manter “meu novo povo”
  alternative: “meu povo da nova aliança” ou identificação denominacional
  rationale: Traduz a formulação do testemunho sem desenvolver implicações eclesiológicas ou supersessionistas além do que o capítulo afirma.
- issue: Pronome em “pelas mãos deles”
  choice: Conservar o referente implícito
  alternative: Identificar explicitamente os judeus, sacerdotes ou povo
  rationale: O discurso alterna sacerdotes e povo, e o testemunho não resolve de modo inequívoco o alcance do pronome.
- issue: Vinda futura e reconhecimento de Jesus
  choice: Manter o futuro e a fala de reconhecimento
  alternative: Harmonizar explicitamente com uma doutrina detalhada da segunda vinda
  rationale: Preserva a perspectiva escatológica do autor sem acrescentar um esquema teológico externo.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com formas brasileiras naturais (“vocês”, “prestem atenção”). Mantiveram-se as repetições retóricas, as citações não canônicas atribuídas à Escritura e ao profeta, e as imagens tipológicas incomuns. Este rascunho permanece necessariamente provisório porque o material fornecido declara pendente a revisão direta dos testemunhos gregos e latinos.
