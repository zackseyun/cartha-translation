  language: pt
  text: 'Entendam, portanto, filhos da alegria, que o bom Senhor nos revelou de antemão todas as coisas, para que soubéssemos a quem devemos dar graças e louvor em tudo.


    Se, pois, o Filho de Deus, sendo Senhor e futuro Juiz dos vivos e dos mortos, sofreu para que sua ferida nos desse vida, creiamos que o Filho de Deus não poderia ter sofrido senão por nossa causa.


    Além disso, quando foi crucificado, deram-lhe vinagre e fel para beber. Ouçam como os sacerdotes do templo revelaram isso. Há na Escritura um mandamento: “Quem não observar o jejum certamente morrerá.” Visto que o Senhor estava prestes a oferecer, em sua própria pessoa, o receptáculo de seu Espírito como sacrifício por nossos pecados, ele ordenou que também se cumprisse a figura apresentada em Isaque, que foi oferecido sobre o altar.


    O que, então, ele diz no profeta? “Que comam do bode oferecido durante o jejum por todos os pecados deles.” Prestem muita atenção: “Somente os sacerdotes comam todas as vísceras, sem lavá-las, com vinagre.”[a]


    Por quê? “Já que vocês darão a mim — que estou prestes a oferecer minha carne pelos pecados do meu novo povo — fel com vinagre para beber, comam somente vocês, enquanto o povo jejua e se lamenta vestido de pano de saco e coberto de cinzas.” Isso servia para mostrar que ele teria de sofrer pelas mãos deles.


    Prestem atenção aos mandamentos que ele deu: “Tomem dois bodes, belos e semelhantes, e ofereçam-nos. O sacerdote tome um deles para oferecê-lo como holocausto pelos pecados.”


    Mas o que devem fazer com o outro? “Esse é maldito”, diz ele. Observem como se revela a figura de Jesus.


    “Todos vocês devem cuspir nele, espetá-lo, pôr lã escarlate ao redor de sua cabeça e então lançá-lo no deserto.” Feito isso, aquele que leva o bode ao deserto o conduz para lá, retira a lã e a coloca no ramo chamado Ráquia,[b] a mesma planta cujos brotos costumamos comer quando os encontramos no campo. Somente o fruto desse espinheiro é tão doce.


    O que, então, isso significa? Prestem atenção. Um está junto ao altar, e o outro é maldito. Além disso, o maldito é coroado. Pois, naquele dia, eles o verão trazendo sobre sua carne o longo manto escarlate e dirão: “Não é este aquele que outrora crucificamos, desprezamos e em quem cuspimos? Verdadeiramente, este era aquele que então dizia ser o Filho de Deus.”


    Mas em que ele se assemelha ao bode? É por isso que o texto diz que os bodes devem ser belos e semelhantes: para que, quando o virem vir naquele tempo, fiquem admirados com sua semelhança com o bode. Vejam, portanto, a figura de Jesus que haveria de sofrer.


    Mas o que significa colocarem a lã entre os espinhos? É uma figura de Jesus apresentada à igreja, pois quem desejasse retirar a lã escarlate teria de sofrer muito por causa da natureza terrível do espinho e, por meio da aflição, conseguir dominá-lo. Assim ele diz: “Os que desejam ver-me e alcançar meu reino devem apoderar-se de mim por meio de tribulação e aflição.”'
