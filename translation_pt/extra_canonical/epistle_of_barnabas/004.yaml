    Do mesmo modo, Daniel fala a respeito da mesma coisa: “Vi o quarto animal, perverso, forte e mais indomável do que todos os animais da terra. Vi que dele surgiram dez chifres e, dentre estes, um pequeno chifre e uma excrescência; e vi que ele humilhou de uma só vez três dos grandes chifres.”[c]


    Portanto, vocês devem compreender. Além disso, peço-lhes ainda uma coisa, como alguém que é um de vocês e que ama cada um de vocês mais do que minha própria alma: estejam atentos a si mesmos agora e não se tornem semelhantes a certas pessoas que acumulam pecado sobre pecado, dizendo que a nossa aliança também continua pertencendo a elas.


    Ela é nossa; eles, porém, a perderam para sempre desta maneira, logo depois que Moisés a recebeu. Pois a Escritura diz: “Moisés permaneceu no monte, jejuando quarenta dias e quarenta noites, e recebeu do Senhor a aliança: tábuas de pedra escritas pelo dedo da mão do Senhor.”[d]


    Mas eles a perderam ao se voltarem para os ídolos. Pois assim diz o Senhor: “Moisés, Moisés, desça depressa, porque o seu povo, que você tirou da terra do Egito, agiu contra a lei.”[e] Moisés compreendeu e lançou de suas mãos as duas tábuas. Assim, a aliança deles foi despedaçada, para que a aliança do amado Jesus fosse selada em nossos corações, na esperança que nasce da fé nele.


    Embora eu desejasse escrever muitas coisas — não como mestre, mas como convém a alguém que ama vocês, para que não fiquem privados daquilo que possuímos —, apressei-me em lhes escrever, pois sou escravo dedicado de vocês. Portanto, estejamos atentos nestes últimos dias. Todo o tempo de nossa fé de nada nos servirá se agora, no tempo da iniquidade e em meio aos escândalos que virão, não resistirmos como convém a filhos de Deus, para que o Negro não consiga entrar.[f]


    Fujamos de toda vaidade. Odiemos por completo as obras do caminho mau. Não se isolem, recolhendo-se à parte como se já estivessem justificados; antes, reúnam-se e deliberem sobre o bem comum.


    Pois a Escritura diz: “Ai dos que são sábios para si mesmos e entendidos aos próprios olhos.”[g] Tornemo-nos espirituais; tornemo-nos um templo aperfeiçoado para Deus. Na medida do que estiver ao nosso alcance, exercitemo-nos no temor de Deus e procuremos guardar seus mandamentos, para que nos alegremos em suas ordenanças.[h]


    O Senhor julga o mundo sem parcialidade; cada pessoa receberá segundo suas obras. Se alguém for bom, sua justiça irá adiante dele no caminho; se for mau, a retribuição por sua maldade estará diante dele. Para que não aconteça que, se relaxarmos como pessoas chamadas, adormeçamos sobre nossos pecados, e o príncipe do mal adquira poder contra nós e nos expulse do reino do Senhor.


    Compreendam também isto, meus irmãos: quando vocês virem que, mesmo depois de tantos sinais e prodígios realizados em Israel, eles ainda assim foram abandonados, estejamos atentos para que não sejamos encontrados entre aqueles de quem a Escritura diz: “Muitos são chamados, mas poucos são escolhidos.”[i]'
