base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/004.yaml
  text: 'Therefore, we ought to investigate the present deeply and search out the things that have power to save us. Let us flee completely from all the works of lawlessness, so that the works of lawlessness do not overpower us. Let us hate the error of the present age, so that we may be loved for what is to come.


    Let us give our soul no relief that would allow it to associate with sinners and wicked people, so that we are not made like them.


    The last offense is at hand, concerning which Scripture speaks, as Enoch says. For this reason the Master has shortened the seasons and the days, so that his beloved may hasten and come to His inheritance.


    The prophet also speaks in this way: “Ten reigns shall reign upon the earth, and after them another king will arise, who will bring three of the kings low under one.”


    In the same way Daniel speaks concerning the same thing: “I saw the fourth beast, wicked and strong and more unmanageable than all the beasts of the earth. I saw ten horns arise from it, and from these a little horn, an outgrowth, and I saw how it brought three of the great horns low under one.”


    Therefore, you ought to understand. Moreover, I ask you this one thing as one of you, loving each of you more than my own soul: pay attention to yourselves now, and do not become like certain people who pile sin upon sin, saying that our covenant also remains theirs.


    It is ours, but they lost it forever in this way, just after Moses had received it. For Scripture says: “Moses was on the mountain, fasting for forty days and forty nights, and he received the covenant from the Lord—tablets of stone written by the finger of the Lord’s hand.”


    But they lost it by turning to idols. For the Lord says: “Moses, Moses, come down quickly, for your people, whom you brought out of the land of Egypt, have acted lawlessly.” Moses understood and threw the two tablets from his hands. Their covenant was shattered, so that the covenant of the beloved Jesus might be sealed upon our hearts in the hope that springs from faith in him.


    Although I would gladly write many things—not as a teacher, but as is fitting for one who loves you, so that you may not fall short of what we possess—I was eager to write to you, since I am your devoted slave. Therefore, let us be watchful in these last days. For the whole time of our faith will benefit us nothing unless now, in the season of lawlessness and amid the offenses that are to come, we resist as is fitting for God’s sons, so that the Black One may not gain an entrance.


    Let us flee from all vanity. Let us completely hate the works of the evil way. Do not, entering in privately, stand apart by yourselves, as though you were already justified, but gather together and consult about the common good.


    For Scripture says: “Woe to those who are wise for themselves and understanding in their own sight.” Let us become spiritual. Let us become a temple made perfect for God. As far as it lies within us, let us train ourselves in the fear of God, [and] let us strive to keep his commandments, so that we may rejoice in his ordinances.


    The Lord judges the world without partiality. Each person will receive according to his deeds. If someone is good, his righteousness will go before him on the way. If someone is evil, the repayment for his evildoing is before him, so that perhaps,


    if we relax as people who are called, we may fall asleep over our sins, and the prince of evil may gain power against us and thrust us out of the Lord’s kingdom.


    Moreover, understand this also, my brothers. When you see that, even after so many signs and wonders were performed in Israel, they were still abandoned, let us pay attention, so that perhaps we are not found to be, as Scripture says, “Many are called, but few are chosen.”'
translation:
  language: pt
  text: 'Portanto, devemos examinar profundamente o tempo presente e buscar aquilo que tem poder para nos salvar. Fujamos por completo de todas as obras da iniquidade, para que elas não nos dominem; e odiemos o engano do tempo presente, para que sejamos amados por causa do que está por vir.


    Não demos à nossa alma nenhuma folga que lhe permita conviver com pecadores e pessoas perversas, para que não venhamos a nos tornar semelhantes a eles.


    O último escândalo está próximo, aquele de que fala a Escritura, conforme diz Enoque.[a] Pois foi para isso que o Senhor abreviou os tempos e os dias: para que seu amado se apressasse e chegasse à sua herança.


    Também o profeta fala deste modo: “Dez reinos reinarão sobre a terra; depois deles se levantará outro rei, que humilhará três dos reis de uma só vez.”[b]


    Do mesmo modo, Daniel fala a respeito da mesma coisa: “Vi o quarto animal, perverso, forte e mais indomável do que todos os animais da terra. Vi que dele surgiram dez chifres e, dentre estes, um pequeno chifre, uma excrescência; e vi que ele humilhou de uma só vez três dos grandes chifres.”[c]


    Portanto, vocês devem compreender. Além disso, peço-lhes ainda uma coisa, como alguém que é um de vocês e que ama cada um de vocês mais do que a própria vida: estejam atentos a si mesmos agora e não se tornem semelhantes a certas pessoas que acumulam pecado sobre pecado, dizendo que a nossa aliança também continua pertencendo a elas.


    Ela é nossa; eles, porém, a perderam para sempre desta maneira, logo depois que Moisés a recebeu. Pois a Escritura diz: “Moisés permaneceu no monte, jejuando quarenta dias e quarenta noites, e recebeu do Senhor a aliança: tábuas de pedra escritas pelo dedo da mão do Senhor.”[d]


    Mas eles a perderam ao se voltarem para os ídolos. Pois assim diz o Senhor: “Moisés, Moisés, desça depressa, porque o seu povo, que você tirou da terra do Egito, agiu contra a lei.”[e] Moisés compreendeu e lançou de suas mãos as duas tábuas. Assim, a aliança deles foi despedaçada, para que a aliança do amado Jesus fosse selada em nosso coração, na esperança que nasce da fé nele.


    Embora eu desejasse escrever muitas coisas — não como mestre, mas como convém a alguém que ama vocês, para que não fiquem privados daquilo que possuímos —, apressei-me em lhes escrever, pois sou escravo dedicado de vocês. Portanto, estejamos atentos nestes últimos dias. Todo o tempo de nossa fé de nada nos servirá se agora, no tempo da iniquidade e em meio aos escândalos que virão, não resistirmos como convém a filhos de Deus, para que o Negro não encontre uma brecha.[f]


    Fujamos de toda vaidade. Odiemos por completo as obras do caminho mau. Não se isolem, recolhendo-se à parte como se já estivessem justificados; antes, reúnam-se e deliberem sobre o bem comum.


    Pois a Escritura diz: “Ai dos que são sábios para si mesmos e entendidos aos próprios olhos.”[g] Tornemo-nos espirituais; tornemo-nos um templo aperfeiçoado para Deus. Na medida do que estiver ao nosso alcance, exercitemo-nos no temor de Deus e procuremos guardar seus mandamentos, para que nos alegremos em suas ordenanças.[h]


    O Senhor julga o mundo sem parcialidade; cada pessoa receberá segundo suas obras. Se alguém for bom, sua justiça irá adiante dele no caminho; se for mau, a retribuição por sua maldade estará diante dele. Portanto, não relaxemos como pessoas chamadas, para não adormecermos sobre nossos pecados, nem permitirmos que o príncipe do mal adquira poder contra nós e nos expulse do reino do Senhor.


    Compreendam também isto, meus irmãos: quando vocês virem que, mesmo depois de tantos sinais e prodígios realizados em Israel, eles ainda assim foram abandonados, estejamos atentos para que não sejamos encontrados entre aqueles de quem a Escritura diz: “Muitos são chamados, mas poucos são escolhidos.”[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A obra de Enoque aqui evocada não faz parte da Bíblia hebraica tradicional; o texto exato da citação ou alusão é incerto.
    reason: Identifica a fonte atribuída e sinaliza a incerteza textual sem resolver a questão canônica.
  - marker: b
    text: A formulação parece resumir Daniel 7:24. O testemunho transmitido traz uma expressão incomum, literalmente próxima de “humilhar três dos reis sob um”; aqui ela foi vertida “de uma só vez”, sem identificar historicamente os reis.
    reason: Explica uma construção obscura e evita uma interpretação histórica não exigida pelo texto.
  - marker: c
    text: Alusão a Daniel 7:7–8, 20, 24. “Excrescência” reproduz a imagem incomum preservada no testemunho; “de uma só vez” corresponde à mesma expressão obscura da frase anterior.
    reason: Indica a base bíblica e preserva a estranheza da imagem.
  - marker: d
    text: Cf. Êxodo 24:18; 31:18; 34:28. A expressão “dedo da mão do Senhor” é enfática e foi mantida.
    reason: Registra a combinação de alusões escriturísticas e uma formulação incomum.
  - marker: e
    text: Cf. Êxodo 32:7. “Agiu contra a lei” também pode ser entendido de modo mais geral como “agiu perversamente”.
    reason: Preserva a amplitude semântica provável do termo ligado à iniquidade.
  - marker: f
    text: “O Negro” é uma designação antiga e incomum do poder maligno, ligada simbolicamente às trevas; não se refere à cor da pele nem a um povo. “Encontre uma brecha” traduz a imagem de conseguir entrada.
    reason: Evita uma leitura racial moderna equivocada e explica a metáfora.
  - marker: g
    text: Cf. Isaías 5:21. “Para si mesmos” também pode ser expresso como “aos próprios olhos”.
    reason: Sinaliza a alusão e a variação idiomática.
  - marker: h
    text: O testemunho inglês assinala um “e” restaurado antes de “procuremos”; a tradução portuguesa integra naturalmente a coordenação, sem depender dessa palavra.
    reason: Documenta a restauração textual indicada na base fornecida.
  - marker: i
    text: 'Cf. Mateus 22:14. A aplicação do dito é exortativa: o autor adverte seus próprios leitores a permanecerem vigilantes.'
    reason: Identifica a citação e esclarece sua função no contexto sem impor uma doutrina.
lexical_decisions:
- source_word: lawlessness / ἀνομία (presumed)
  choice: iniquidade; agir contra a lei
  rationale: “Iniquidade” preserva o peso moral e o vínculo com ausência ou violação da lei; na citação dirigida a Moisés, “agiu contra a lei” mantém mais visível esse componente lexical.
- source_word: offence / σκάνδαλον (presumed)
  choice: escândalo
  rationale: Mantém o termo apocalíptico tradicional e sua ambiguidade entre tropeço, ocasião de queda e crise, sem reduzi-lo apenas a “ofensa”.
- source_word: Master / κύριος or δεσπότης (source review pending)
  choice: Senhor
  rationale: Forma portuguesa digna e natural; a identificação lexical exata depende da revisão direta do grego e do latim.
- source_word: Black One / ὁ μέλας (presumed)
  choice: o Negro
  rationale: Preserva a designação incomum e personificada do testemunho, evitando substituí-la interpretativamente por “Diabo” ou “Maligno”; a nota esclarece o sentido antigo.
- source_word: ordinances
  choice: ordenanças
  rationale: Conserva a distinção possível em relação a “mandamentos” na mesma frase, sem especificar indevidamente um sistema ritual ou jurídico.
- source_word: devoted slave / περίψημα (possible source term; review pending)
  choice: escravo dedicado
  rationale: Segue com cautela o testemunho fornecido, mantendo a linguagem forte de autodepreciação e serviço; a base original precisa ser confirmada.
theological_decisions:
- issue: A afirmação de que a aliança pertence aos cristãos e foi perdida por Israel
  choice: Traduzir diretamente a argumentação do autor antigo
  alternative: Atenuar a afirmação ou harmonizá-la com teologias posteriores da aliança
  rationale: A tradução deve preservar a tensão histórica e teológica do texto, sem endossá-la, corrigi-la ou importar uma doutrina denominacional.
- issue: “Para que seu amado se apressasse e chegasse à sua herança”
  choice: Manter “seu amado” no singular
  alternative: Interpretar coletivamente como “seus amados” ou explicitamente como Jesus
  rationale: O singular do testemunho é genuinamente ambíguo quanto ao referente; não foi resolvido silenciosamente.
- issue: Julgamento segundo as obras
  choice: Manter “cada pessoa receberá segundo suas obras”
  alternative: Acrescentar uma explicação sobre fé, graça ou mérito
  rationale: Preserva a formulação parenética do autor e evita harmonização dogmática externa.
- issue: Possibilidade de exclusão do reino
  choice: Conservar a advertência de que o príncipe do mal pode expulsar os chamados do reino
  alternative: Reformular como mera perda de recompensa ou como hipótese irreal
  rationale: O texto apresenta uma advertência real; sua força não deve ser reduzida segundo sistemas soteriológicos posteriores.
- issue: “Muitos são chamados, mas poucos são escolhidos”
  choice: Manter a citação em sua forma tradicional e sem comentário doutrinário
  alternative: Definir “chamados” e “escolhidos” segundo uma escola teológica
  rationale: A tradução conserva a tensão do dito sem impor uma interpretação confessional.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil, com tom exortativo, solene e comunitário. Evitaram-se arcaísmos como “aprouve”, “convosco” e inversões excessivas. A tradução é necessariamente provisória porque o material fornecido declara que a revisão direta dos testemunhos grego e latino ainda está pendente; decisões sobre termos presumidos foram, por isso, registradas com cautela. As citações foram apresentadas com fluidez moderna, e construções fragmentadas do testemunho inglês foram reorganizadas apenas onde necessário para inteligibilidade, sem reduzir as advertências ou tensões teológicas do autor.
