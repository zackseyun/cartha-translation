  text: 'But forasmuch as Moses said, “You shall not eat seine [sic] nor eagle nor falcon nor crow nor any fish that has no scale upon it,” he received in his understanding three ordinances.


    Yes, and further he says to them in Deuteronomy, “And I will lay as a covenant upon this people my ordinances.” So then it is not a commandment of God that they should not bite with their teeth, but Moses spoke it in spirit.


    Accordingly, he mentioned the swine with this intent: “You shall not cleave,” he says, “to such people as are like swine.” That is, when they are in luxury they forget the Lord, but when they are in want they recognize the Lord, just as the swine, when it eats, does not know its lord; but when it is hungry it cries out, and when it has received food again it is silent.


    “Neither shall you eat eagle nor falcon nor kite nor crow.” “You shall not,” he says, “cleave to, or be likened to, such people as do not know how to provide food for themselves by toil and sweat, but in their lawlessness seize what belongs to others; and, as if walking in guilelessness, watch and search about for someone to rob in their rapacity.” Just as these birds alone do not provide food for themselves, but sit idle and seek how they may eat the meat that belongs to others, being pestilent in their evil-doings.


    “And you shall not eat,” he says, “lamprey nor polypus nor cuttlefish.” He means, “You shall not become like such people as are desperately wicked and already condemned to death,” just as these fishes alone are accursed and swim in the depths, not swimming on the surface like the rest, but dwelling on the ground beneath the deep sea.


    Moreover, “You shall not eat the hare.” Why so? “You shall not be found a corrupter of boys, nor shall you become like such persons”; for the hare gains one passage in the body every year, and according to the number of years it lives it has just so many orifices.


    Again, “Neither shall you eat the hyena.” “You shall not,” he says, “become an adulterer or a fornicator, neither shall you resemble such persons.” Why so? Because this animal changes its nature year by year, becoming at one time male and at another female.


    Moreover, he has hated the weasel also, and with good reason. “You shall not,” he says, “become such as those people of whom we hear as working iniquity with their mouth for uncleanness, neither shall you cleave to impure women who work iniquity with their mouth.” For this animal conceives with its mouth.


    Concerning meats, then, Moses received three decrees to this effect and uttered them in a spiritual sense; but they accepted them according to the lust of the flesh, as though they referred to eating.


    And David also receives knowledge of the same three decrees, and says, “Blessed is the man who has not gone in the counsel of the ungodly”—even as the fishes go in darkness into the depths—“and has not stood in the path of sinners”—just as those who pretend to fear the Lord sin like swine—“and has not sat on the seat of the destroyers”—as the birds that are seated for prey. You now have the complete lesson concerning eating.


    Again Moses says, “You shall [eat] everything that divides the hoof and chews the cud.” What does he mean? He who receives the food knows him who gives him the food and, being refreshed, appears to rejoice in him. Well said he, having regard to the commandment. What then does he mean? Cleave to those who fear the Lord: to those who meditate in their heart on the distinction of the word which they have received; to those who tell of the ordinances of the Lord and keep them; and to those who know that meditation is a work of gladness and who chew the cud of the word of the Lord. But why that which divides the hoof? Because the righteous person both walks in this world and at the same time looks for the holy world to come. You see how wise a lawgiver Moses was.


    But whence should they perceive or understand these things? Howbeit, we, having justly perceived the commandments, tell them as the Lord willed. To this end he circumcised our ears and hearts, that we might understand these things.'
translation:
  language: pt
  text: '**Barnabé 10**


    Moisés disse: “Não comam porco, nem águia, nem falcão, nem milhafre, nem corvo, nem peixe algum que não tenha escamas.” Ao compreender isso, ele recebeu três preceitos.


    Além disso, Deus lhes diz em Deuteronômio: “Estabelecerei os meus preceitos como aliança com este povo.” Portanto, o mandamento de Deus não trata simplesmente de não morder com os dentes; Moisés falou em sentido espiritual.


    Assim, mencionou o porco com esta intenção: “Não se apegue”, diz ele, “a pessoas semelhantes a porcos.” Quando vivem na abundância, elas se esquecem do Senhor; quando passam necessidade, reconhecem o Senhor. Do mesmo modo, enquanto come, o porco não reconhece seu dono; quando sente fome, porém, grita e, depois de receber alimento, volta a ficar calado.


    “Não coma águia, nem falcão, nem milhafre, nem corvo.” Isto quer dizer: “Não se apegue nem se torne semelhante a pessoas que não sabem obter seu sustento com trabalho e suor, mas que, em sua transgressão, apoderam-se do que pertence aos outros. Fingindo andar com inocência, ficam à espreita e procuram alguém a quem possam roubar em sua avidez.” Da mesma forma, essas aves não obtêm seu próprio alimento, mas ficam ociosas, procurando comer a carne que pertence a outros animais, e são uma peste em suas más ações.


    “Não coma moreia, nem polvo, nem sépia.” Isto significa: “Não se torne semelhante a pessoas tão perversas que já estão condenadas à morte.” Esses peixes são os únicos amaldiçoados e nadam nas profundezas; não nadam perto da superfície como os demais, mas vivem no fundo, debaixo do mar profundo.


    Além disso: “Não coma lebre.” Por quê? “Não seja corruptor de meninos nem se torne semelhante a tais pessoas.” Pois a lebre adquire a cada ano mais uma abertura no corpo e, conforme o número de anos que vive, possui igual número de orifícios.[a]


    Também: “Não coma hiena.” “Não se torne adúltero nem pratique imoralidade sexual; não se assemelhe a tais pessoas.” Por quê? Porque esse animal muda de natureza de ano em ano, sendo ora macho, ora fêmea.[b]


    Ele também rejeitou a doninha, e com razão. “Não se torne semelhante àqueles de quem ouvimos que praticam impureza com a boca, nem se apegue a mulheres impuras que praticam impureza com a boca.” Pois esse animal concebe pela boca.[c]


    Portanto, a respeito dos alimentos, Moisés recebeu três determinações com esse sentido e as enunciou espiritualmente. Eles, porém, por causa do desejo da carne, entenderam-nas como se tratassem de comida.


    Também Davi recebeu conhecimento dessas mesmas três determinações e disse: “Feliz o homem que não andou no conselho dos ímpios” — assim como os peixes descem na escuridão para as profundezas —, “não se deteve no caminho dos pecadores” — como aqueles que fingem temer o Senhor, mas pecam como porcos —, “nem se assentou no lugar dos destruidores” — como as aves que ficam pousadas à espera de presa. Agora vocês têm toda a instrução a respeito dos alimentos.


    Moisés também diz: “Comam todo animal que tem o casco dividido e rumina.” O que isso quer dizer? Quem recebe o alimento reconhece aquele que lhe dá o alimento e, depois de saciado, demonstra alegrar-se nele. Moisés falou bem, tendo em vista o mandamento. Então, o que isso quer dizer? Apeguem-se aos que temem o Senhor: aos que meditam no coração sobre a distinção contida na palavra que receberam; aos que anunciam e guardam os preceitos do Senhor; aos que sabem que a meditação é uma prática alegre e ruminam a palavra do Senhor. Mas por que o animal de casco dividido? Porque o justo caminha neste mundo e, ao mesmo tempo, aguarda o mundo santo que há de vir. Vejam como Moisés foi um legislador sábio!


    Mas como poderiam eles perceber ou compreender essas coisas? Nós, porém, tendo compreendido corretamente os mandamentos, os anunciamos conforme o Senhor quis. Foi para isso que ele circuncidou nossos ouvidos e nosso coração: para que compreendêssemos essas coisas.


    [a] Esta afirmação reproduz uma crença zoológica da Antiguidade; o texto a emprega em sua interpretação moral.


    [b] Esta afirmação reproduz uma crença antiga sobre a hiena.


    [c] Esta afirmação reproduz uma crença antiga sobre a reprodução da doninha.'
  philosophy: optimal-equivalence
