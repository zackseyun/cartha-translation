lexical_decisions:
- source_word: 'δεῖγμα provável: χοῖρος / swine'
  choice: porco
  rationale: Termo comum e natural, preservando a associação moral desenvolvida pelo autor.
- source_word: ἀετός, ἱέραξ, ἴκτινος, κόραξ (lista zoológica provável)
  choice: águia, falcão, milhafre, corvo
  rationale: Equivalentes zoológicos tradicionais em português; corrige-se o erro tipográfico inglês “seine” pelo contexto e pela própria explicação subsequente.
- source_word: κολλᾶσθαι provável
  choice: apegar-se
  rationale: Expressa associação estreita sem o arcaísmo de “unir-se” ou “aderir”, preservando a força ética.
- source_word: πολύπους / σηπία e termo da moreia/lampreia
  choice: polvo, sépia, moreia
  rationale: Mantém a nomenclatura zoológica antiga com termos reconhecíveis; “sépia” é mais preciso que o genérico “choco” em registro internacional.
- source_word: ἀναμαρυκᾶσθαι provável
  choice: ruminar
  rationale: Preserva tanto o sentido alimentar literal quanto a metáfora de meditar repetidamente na palavra.
- source_word: δικαιώματα
  choice: preceitos / determinações
  rationale: “Preceitos” funciona nas citações e na formulação teológica; “determinações” evita repetição quando o texto enumera três regras.
- source_word: πονηρία / ἀνομία
  choice: perversidade / transgressão
  rationale: Distingue o caráter moral da violação normativa, sem impor terminologia confessional.
theological_decisions:
- issue: Natureza espiritual das leis alimentares
  choice: Preservar a afirmação do autor de que Moisés falou em sentido espiritual
  alternative: Apresentar as leis como simultaneamente literais e alegóricas
  rationale: O capítulo contrapõe explicitamente o sentido espiritual à recepção delas como meras regras de alimentação; a tradução não deve harmonizar essa tensão com outras leituras.
- issue: Referente de “ele” nas ações divinas
  choice: Usar “Deus” uma vez para esclarecer o sujeito e depois conservar “ele”
  alternative: Capitalizar todos os pronomes divinos
  rationale: A explicitação inicial evita confusão; pronomes em minúscula seguem o uso moderno e não acrescentam uma distinção ausente no texto antigo.
- issue: Condenação moral e sexual
  choice: Traduzir de modo direto, mas sem ampliar as categorias do autor
  alternative: Modernizar ou suavizar as proibições
  rationale: Preserva-se o conteúdo histórico e a severidade retórica, evitando importar terminologia denominacional ou categorias contemporâneas não presentes.
- issue: “Mundo santo que há de vir”
  choice: mundo santo que há de vir
  alternative: era santa futura / reino futuro
  rationale: Mantém a imagem cosmológica e a expectativa escatológica sem decidir se o referente é uma era, um reino ou uma nova criação.
- issue: Circuncisão de ouvidos e coração
  choice: Manter a metáfora literalmente
  alternative: Parafrasear como “abriu nossa compreensão”
  rationale: A linguagem de circuncisão é teologicamente carregada e central ao argumento; deve permanecer visível.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos inclusivos no plural quando o discurso se dirige à comunidade e singular nas formulações alegóricas citadas. A tradução é necessariamente provisória porque o material fornecido identifica a revisão direta do grego/latim como pendente; foram corrigidos apenas erros evidentes do testemunho inglês (“seine” por “swine”, “now” por “know” e o verbo omitido em “You shall eat”). As alegações zoológicas antigas foram mantidas e contextualizadas em notas.
