base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/001.yaml
  text: 'I greet you, sons and daughters, in the name of the Lord who loved us, in peace.


    Seeing that the ordinances of God are great and rich unto you, I rejoice with exceedingly great and overflowing joy over your blessed and glorious spirits; so innate is the grace of the spiritual gift you have received.


    Therefore, I congratulate myself all the more, hoping to be saved, because I truly see that the Spirit has been poured out among you from the riches of the Lord’s fountain. The greatly desired sight of you amazed me so much concerning you.


    Being persuaded of this, and knowing within myself that, after saying many things among you, I know that the Lord traveled with me on the way of righteousness, I am also wholly compelled to love you more than my own soul—for great faith and love dwell in you through the hope of the life that is his—considering this, therefore, that,


    if I take care to share with you some portion of what I received, it will become my reward for having ministered to such spirits, I was eager to send you something small, so that together with your faith you might also have complete knowledge.


    Well then, there are three ordinances of the Lord: *the hope of life, which is the beginning and end of our faith; righteousness, which is the beginning and end of judgment; and love displayed in gladness and exultation, the testimony of works of righteousness.*


    For the Lord made known to us through his prophets things past and present, giving us likewise the firstfruits of the taste of things future. Seeing each of these things coming to pass one by one, just as he said, we ought to offer a richer and higher offering to the fear of him. But I, not as though I were a teacher, but as one of you, will set out a few things by which you will be gladdened in the present circumstances.'
translation:
  language: pt
  text: '**Barnabé 1**


    Saúdo vocês, filhos e filhas, em paz, no nome do Senhor que nos amou.


    Ao ver como são grandes e ricos os preceitos de Deus concedidos a vocês, sinto uma alegria imensa e transbordante por causa do espírito abençoado e glorioso de vocês. Tão profundamente enraizada está em vocês a graça do dom espiritual que receberam!


    Por isso, alegro-me ainda mais por mim mesmo, na esperança de ser salvo, pois realmente vejo que o Espírito foi derramado entre vocês das riquezas da fonte do Senhor. O tão desejado encontro com vocês deixou-me profundamente admirado com o que vi em vocês.


    Convencido disso e consciente de que, depois de lhes dizer muitas coisas, reconheci que o Senhor me acompanhava no caminho da justiça, sinto-me inteiramente impelido a amá-los mais do que à minha própria vida. De fato, uma grande fé e um grande amor habitam em vocês por meio da esperança da vida que pertence a ele.


    Assim, considerando que, se eu me empenhar em compartilhar com vocês uma parte do que recebi, terei como recompensa ter servido a espíritos como os de vocês, apressei-me a lhes enviar estas poucas palavras, para que, além da fé, vocês também tenham conhecimento pleno.


    Pois bem, três são os preceitos do Senhor: a esperança da vida, princípio e fim da nossa fé; a justiça, princípio e fim do juízo; e o amor demonstrado em alegria e exultação, testemunho das obras de justiça.


    O Senhor nos deu a conhecer, por meio de seus profetas, as coisas passadas e presentes e também nos concedeu provar antecipadamente as primícias das coisas futuras. Vendo que cada uma delas acontece conforme ele disse, devemos oferecer ao temor dele uma oferta cada vez mais rica e elevada. Quanto a mim, não como mestre, mas como um de vocês, apresentarei algumas coisas pelas quais vocês poderão alegrar-se nas circunstâncias presentes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιώματα / “ordinances”
  choice: preceitos
  rationale: Mantém a ideia de determinações ou princípios estabelecidos por Deus sem restringi-la indevidamente a ritos ou estatutos legais.
- source_word: πνεύμασιν / “spirits”
  choice: espírito / espíritos
  rationale: Preserva a linguagem antropológica e a possível ambiguidade do texto, em vez de substituí-la por “caráter”, “coração” ou “pessoas”.
- source_word: δόγματα / “ordinances”
  choice: preceitos
  rationale: No enunciado tríplice, “preceitos” é natural e amplo; evita o sentido moderno e institucional que “dogmas” poderia sugerir.
- source_word: ψυχή / “soul”
  choice: vida
  rationale: Na expressão comparativa de amor, “minha própria vida” comunica naturalmente o valor da própria pessoa, sem excluir a dimensão semítica de ψυχή.
- source_word: ἀπαρχή / “firstfruits”
  choice: primícias
  rationale: Conserva a imagem cultual de uma porção inicial que antecipa a plenitude futura.
- source_word: κρίσις / “judgment”
  choice: juízo
  rationale: Preserva a tensão da afirmação segundo a qual a justiça é princípio e fim do juízo, sem explicar se se trata de julgamento divino, discernimento ou justiça judicial.
theological_decisions:
- issue: A esperança da vida “que é dele”
  choice: “a vida que pertence a ele”
  alternative: “a vida que vem dele” ou “a vida que é sua”
  rationale: A formulação conserva a relação possessiva do testemunho fornecido e não resolve se a vida é própria do Senhor, concedida por ele ou compartilhada com os fiéis.
- issue: Esperança de salvação do autor
  choice: “na esperança de ser salvo”
  alternative: “confiando que serei salvo”
  rationale: Mantém a modalidade de esperança e evita transformar a frase em certeza sistemática ou em dúvida doutrinária.
- issue: Derramamento do Espírito
  choice: “o Espírito foi derramado entre vocês”
  alternative: “sobre vocês” ou “em vocês”
  rationale: “Entre vocês” preserva a dimensão comunitária do testemunho sem excluir a recepção individual.
- issue: Relação entre fé, justiça, amor e obras
  choice: Manter a enumeração e sua sintaxe compacta
  alternative: Reformular como uma explicação teológica explícita
  rationale: O texto associa esperança, fé, justiça, juízo, amor e obras sem definir exaustivamente suas relações; a tradução não impõe um esquema doutrinário posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. O período longo do testemunho foi dividido para clareza, preservando sua progressão lógica. Como a solicitação informa que a revisão direta dos testemunhos gregos e latinos ainda está pendente, esta minuta é necessariamente provisória e foi controlada pelo testemunho inglês fornecido, com cautela quanto a ambiguidades lexicais e teológicas.
