base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/016.yaml
  text: 'Moreover, I will also tell you about the temple: how these wretched men were led astray and placed their hope in the building, rather than in their God who made them, as though it were a house of God.


    For, almost like the Gentiles, they consecrated him in the temple. But what does the Lord say when abolishing the temple? Learn: “Who has measured heaven with a span, or measured the earth with his hand? Have not I?” says the Lord. “Heaven is my throne, and the earth is the footstool of my feet. What kind of house will you build for me? Or what will be my resting place?” You perceive that their hope is vain.


    Furthermore, he says again, “Behold, those who pulled down this temple will themselves build it.”


    And so it happens. Because they went to war, it was pulled down by their enemies. Now even the servants of their enemies will build it up.


    Again, it was revealed how the city, the temple, and the people of Israel would be betrayed. For Scripture says, “And it shall be in the last days that the Lord will deliver the sheep of the pasture, and the fold and its tower, over to destruction.” And it happened as the Lord had spoken.


    But let us inquire whether there is any temple of God. There is, in the place where he himself undertakes to make and complete it. For it is written, “And it shall come to pass, when the week is being completed, that the temple of God will be built gloriously in the name of the Lord.”


    I find, then, that there is a temple. How, then, will it be built in the name of the Lord? Understand. Before we believed in God, the dwelling place of our heart was corrupt and weak, truly a temple built by hands. For it was full of idolatry and was a house of demons, because we did everything that was contrary to God.


    But it will be built in the name of the Lord. Pay attention, then, so that the temple of the Lord may be built gloriously.


    How? Understand. By receiving the forgiveness of our sins and hoping in the Name, we became new, created afresh from the beginning. Therefore God truly dwells in our habitation, within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching—he himself prophesying in us, he himself dwelling in us, opening for us who had been enslaved to death the door of the temple, which is the mouth, and giving us repentance—leads us to the incorruptible temple.


    For the one who desires to be saved does not look to the person, but to him who dwells and speaks within that person, being amazed that he has never before heard these words from the speaker’s mouth, nor ever desired to hear them. This is the spiritual temple built for the Lord.'
translation:
  language: pt
  text: 'Além disso, também lhes falarei a respeito do templo: como aqueles infelizes, tendo sido desencaminhados, puseram sua esperança no edifício, e não no Deus que os criou, como se o edifício fosse a casa de Deus.


    Pois, quase como os gentios, eles o consagraram no templo.[a] Mas o que diz o Senhor ao abolir o templo? Aprendam: “Quem mediu o céu com a mão aberta, ou mediu a terra com a palma da mão? Não fui eu?”, diz o Senhor. “O céu é o meu trono, e a terra, o estrado dos meus pés. Que espécie de casa vocês construirão para mim? Ou qual será o lugar do meu repouso?” Vocês percebem que a esperança deles é inútil.


    Além disso, ele diz novamente: “Vejam! Os mesmos que derrubaram este templo o reconstruirão.”


    E assim acontece. Como eles foram à guerra, o templo foi derrubado por seus inimigos. Agora, até os próprios servos de seus inimigos o reconstruirão.


    Também foi revelado como a cidade, o templo e o povo de Israel seriam entregues.[b] Pois a Escritura diz: “E acontecerá, nos últimos dias, que o Senhor entregará à destruição as ovelhas do pasto, o aprisco e sua torre.” E aconteceu conforme o Senhor havia falado.


    Mas investiguemos se existe algum templo de Deus. Existe: no lugar onde ele mesmo se dispõe a fazê-lo e completá-lo.[c] Pois está escrito: “E acontecerá, quando a semana estiver chegando ao fim, que o templo de Deus será construído gloriosamente em nome do Senhor.”


    Concluo, portanto, que existe um templo. Como, então, ele será construído em nome do Senhor? Entendam. Antes de crermos em Deus, a morada do nosso coração era corrupta e fraca, verdadeiramente um templo construído por mãos humanas. Pois estava cheia de idolatria e era uma casa de demônios, porque fazíamos tudo o que era contrário a Deus.


    Mas ela será construída em nome do Senhor. Prestem atenção, portanto, para que o templo do Senhor seja construído gloriosamente.


    Como? Entendam. Ao recebermos o perdão dos nossos pecados e depositarmos a esperança no Nome,[d] tornamo-nos novos, recriados desde o princípio. Por isso, Deus habita verdadeiramente em nossa morada, dentro de nós. Como? A palavra da sua fé, o chamado da sua promessa, a sabedoria dos seus preceitos e os mandamentos do ensino; ele mesmo profetiza em nós e habita em nós, abre para nós — que éramos escravos da morte — a porta do templo, isto é, a boca, e, concedendo-nos arrependimento, conduz-nos ao templo incorruptível.[e]


    Pois quem deseja ser salvo não olha para a pessoa, mas para aquele que nela habita e fala, admirado por nunca antes ter ouvido tais palavras da boca de quem fala, nem jamais ter desejado ouvi-las. Este é o templo espiritual construído para o Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O referente de “o” é incerto no testemunho fornecido; pode apontar para Deus, como na tradução inglesa, mas a revisão direta do grego e do latim ainda está pendente.
    reason: Preservar uma ambiguidade pronominal relevante sem ocultá-la.
  - marker: b
    text: “Entregues” também pode ser entendido como “traídos”, conforme o contexto e a leitura do verbo subjacente.
    reason: Registrar a amplitude semântica refletida pelo testemunho inglês.
  - marker: c
    text: A expressão também pode ser entendida como “no lugar em que ele mesmo promete fazê-lo e completá-lo”.
    reason: A formulação do testemunho permite nuance de compromisso ou promessa.
  - marker: d
    text: “O Nome” é uma designação reverencial; o texto não explicita aqui o referente.
    reason: Evitar resolver silenciosamente uma referência teológica condensada.
  - marker: e
    text: A construção deste período é densa. A tradução entende Deus como aquele que profetiza, habita, abre, concede arrependimento e conduz ao templo incorruptível.
    reason: Tornar transparente uma decisão sintática com implicação teológica.
lexical_decisions:
- source_word: temple / οἶκος imagery (source-language review pending)
  choice: templo; casa; morada
  rationale: 'Mantém as distinções metafóricas do testemunho: o edifício cultual, a casa atribuída a Deus e a habitação interior, sem reduzir todas a um único termo.'
- source_word: building
  choice: edifício
  rationale: Distingue o prédio material do posterior ato metafórico de construir o templo espiritual.
- source_word: span / hand
  choice: mão aberta / palma da mão
  rationale: Expressa medidas corporais antigas em português compreensível, preservando a variação do testemunho em vez de nivelá-la.
- source_word: betrayed / delivered up
  choice: entregues / entregará
  rationale: Preserva o sentido básico de entrega ao poder alheio e evita impor, na primeira ocorrência, uma conotação específica de traição.
- source_word: ordinances
  choice: preceitos
  rationale: Termo atual e digno para instruções normativas, sem sugerir necessariamente ordenanças sacramentais.
- source_word: the Name
  choice: o Nome
  rationale: Mantém a forma reverencial e teologicamente densa do testemunho, sem substituir explicitamente por um referente não nomeado.
- source_word: incorruptible
  choice: incorruptível
  rationale: Conserva o contraste teológico com a antiga morada corrupta.
- source_word: repentance
  choice: arrependimento
  rationale: Equivalente religioso corrente e amplo, sem restringir o conceito a penitência ritual.
theological_decisions:
- issue: Crítica ao templo e ao povo de Israel
  choice: Preservar a retórica histórica do autor, incluindo “aqueles infelizes” e “povo de Israel”
  alternative: Suavizar ou generalizar a crítica para evitar linguagem antijudaica
  rationale: A tradução não deve apagar a postura polêmica do texto antigo; ao mesmo tempo, não a amplia nem a aplica a judeus contemporâneos.
- issue: Referente de “ele” em “eles o consagraram no templo”
  choice: Manter o pronome ambíguo “o”
  alternative: Explicitar “Deus” ou “o templo”
  rationale: O testemunho fornecido não resolve com segurança o referente; a nota registra a ambiguidade.
- issue: Agente que faz e completa o templo
  choice: “ele mesmo se dispõe a fazê-lo e completá-lo”
  alternative: Identificar explicitamente o agente como Deus ou o Senhor
  rationale: Mantém a referência pronominal do testemunho e evita uma harmonização não demonstrada pela evidência fornecida.
- issue: Natureza do templo espiritual
  choice: Apresentar a morada interior de Deus por meio da palavra, promessa, preceitos, ensino e profecia
  alternative: Identificá-lo diretamente com a igreja institucional ou apenas com o indivíduo
  rationale: O trecho usa linguagem corporativa e interior sem formular essa identificação denominacional.
- issue: Sintaxe do período sobre Deus habitar e conduzir
  choice: Tratar Deus como agente da profecia, habitação, abertura, concessão e condução
  alternative: Fazer da lista anterior o sujeito gramatical de “conduz”
  rationale: A repetição “ele mesmo” favorece a ação divina, embora a construção do testemunho seja sintaticamente densa; a redação conserva a sequência sem impor uma doutrina adicional.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. Mantiveram-se a exortação direta no plural, a aspereza polêmica do documento antigo e a metáfora progressiva do templo material ao espiritual. Como o material fornecido declara pendente a revisão direta do grego/latim, o texto é um rascunho editorial fundamentado no testemunho público inglês, com incertezas relevantes sinalizadas em notas.
