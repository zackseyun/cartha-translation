  yaml_path: translation/extra_canonical/epistle_of_barnabas/012.yaml
  text: 'In the same way again he defines concerning the cross in another prophet, who says, “And when will these things be accomplished?” says the Lord. “Whenever a tree is bent and stands upright, and whenever blood drips from a tree.” Again you are taught concerning the cross and him who was to be crucified.


    And again he says in Moses, when war was waged against Israel by people of another nation, and so that he might remind them, when war was waged against them, that because of their sins they had been delivered unto death: the Spirit says to the heart of Moses that he should make a type of the cross and of him who was to suffer, for unless, he says, they set their hope on him, war will be waged against them forever. Therefore Moses piles arms one upon another in the midst of the encounter, and, standing on higher ground than anyone else, stretches out his hands; and so Israel again is victorious. But whenever he lowers them, they are slain with the sword.


    Why was this? That they might learn that they cannot be saved unless they set their hope on him.


    And again, in another prophet, he says, “The whole day long I have stretched out my hands to a disobedient people who gainsaid my righteous way.”


    Again Moses makes a type of Jesus: how he must suffer, and how he himself, whom they will think to have destroyed, shall make alive in an emblem when Israel was falling. For the Lord caused all kinds of serpents to bite them, and they died—for the transgression was wrought in Eve through the serpent—so that he might convince them that, because of their transgression, they would be delivered over to the affliction of death.


    Furthermore, though Moses gave the command, “You shall not have a molten or carved image for your God,” he himself made one, that he might show them a type of Jesus. So Moses makes a bronze serpent, sets it up conspicuously, and summons the people by proclamation.


    When they had assembled together, they entreated Moses that he should offer intercession for them, so that they might be healed. And Moses said to them, “Whenever one of you is bitten, let him come to the serpent placed on the tree, and let him believe and hope that the serpent, being itself dead, can make alive; and immediately he shall be saved.” And so they did. Here again, in these things also, you have the glory of Jesus: in him and unto him are all things.


    What again does Moses say to Jesus—Joshua—the son of Nun, when he gives him this name, as being a prophet, so that all the people might give ear to him alone, because the Father reveals all things concerning his Son Jesus?


    Therefore Moses says to Jesus the son of Nun, giving him this name, when he sent him as a spy into the land, “Take a book in your hands, and write what the Lord says: how the Son of God shall cut up by the roots all the house of Amalek in the last days.”


    Behold, again it is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh in a figure. Since people will say that Christ is the son of David, David himself prophesies, being afraid and understanding the error of sinners: “The Lord said to my Lord, ‘Sit at my right hand until I set your enemies as a footstool under your feet.’”


    And again Isaiah says, “The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before him, and I will break down the strength of kings.” See how David calls him Lord and does not call him Son.'
translation:
  language: pt
  text: 'Do mesmo modo, ele volta a explicar a cruz por meio de outro profeta, que diz: “E quando se cumprirão essas coisas?”, diz o Senhor. “Quando uma árvore se dobrar e tornar a ficar em pé, e quando sangue gotejar de uma árvore.” Mais uma vez, você é instruído a respeito da cruz e daquele que seria crucificado.


    Ele também fala por meio de Moisés, quando homens de outra nação guerreavam contra Israel. Para lembrá-los, em meio à guerra travada contra eles, de que por causa de seus pecados haviam sido entregues à morte, o Espírito diz ao coração de Moisés que ele fizesse uma representação da cruz e daquele que haveria de sofrer, pois, se não pusessem nele a sua esperança, a guerra seria travada contra eles para sempre. Moisés, então, empilhou armas umas sobre as outras no meio do combate e, ficando num lugar mais alto que todos, estendeu as mãos; assim Israel voltou a vencer. Mas, sempre que ele as abaixava, os israelitas eram mortos à espada.[a]


    Por que aconteceu isso? Para que aprendessem que não podem ser salvos se não puserem nele a sua esperança.


    E ele diz ainda, por meio de outro profeta: “O dia inteiro estendi as mãos a um povo desobediente, que se opunha ao meu caminho justo.”


    Novamente, Moisés faz uma representação de Jesus: mostra como ele deve sofrer e como aquele que eles pensarão ter destruído dará vida, mediante um sinal, quando Israel estava perecendo. Pois o Senhor fez com que serpentes de toda espécie os mordessem, e eles morreram — porque a transgressão se realizou em Eva por meio da serpente —, a fim de convencê-los de que, por causa de sua transgressão, seriam entregues ao sofrimento da morte.


    Além disso, embora Moisés tivesse dado o mandamento: “Não tenham como seu Deus uma imagem fundida ou esculpida”, ele próprio fez uma, a fim de lhes mostrar uma representação de Jesus. Moisés fez, portanto, uma serpente de bronze, colocou-a num lugar bem visível e convocou o povo por meio de uma proclamação.


    Quando se reuniram, suplicaram a Moisés que intercedesse por eles para que fossem curados. Moisés lhes disse: “Sempre que um de vocês for mordido, venha até a serpente colocada sobre o madeiro; creia e espere que a serpente, embora esteja morta, pode dar vida, e imediatamente será salvo.” E assim fizeram. Aqui, novamente, também nessas coisas, você vê a glória de Jesus: nele e para ele são todas as coisas.


    E o que Moisés diz a Jesus — Josué —, filho de Num, ao dar-lhe esse nome como profeta, para que todo o povo ouvisse somente a ele, visto que o Pai revela todas as coisas a respeito de seu Filho Jesus?[b]


    Moisés, portanto, diz a Jesus, filho de Num, ao dar-lhe esse nome quando o enviou para espionar a terra: “Tome um livro em suas mãos e escreva o que o Senhor diz: que, nos últimos dias, o Filho de Deus arrancará pela raiz toda a casa de Amaleque.”


    Vejam: mais uma vez, é Jesus — não um filho de homem, mas o Filho de Deus —, e ele foi revelado em figura na carne. Como as pessoas dirão que o Cristo é filho de Davi, o próprio Davi profetiza, temendo e compreendendo o erro dos pecadores: “O Senhor disse ao meu Senhor: ‘Sente-se à minha direita, até que eu ponha os seus inimigos como estrado debaixo dos seus pés.’”


    E Isaías também diz: “O Senhor disse ao meu Cristo, o Senhor, cuja mão direita segurei, para que as nações o ouvissem; e destruirei a força dos reis.” Vejam como Davi o chama de Senhor e não de Filho.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O relato alude à batalha contra Amaleque em Êxodo 17. A formulação “empilhou armas” é incomum e segue o testemunho fornecido; algumas tradições textuais e traduções entendem que Moisés colocou uma arma, ou armas, umas sobre as outras.
    reason: Sinalizar uma dificuldade textual e imagética sem corrigir conjecturalmente o texto principal.
  - marker: b
    text: Em grego, “Jesus” e “Josué” são o mesmo nome, Iēsous. O autor fundamenta parte de seu argumento nessa identidade de nome.
    reason: Explicar um jogo nominal indispensável que não é diretamente visível em português.
lexical_decisions:
- source_word: τύπος / typus (reflected by “type” in the witness)
  choice: representação
  rationale: Expressa uma figura ou padrão interpretativo sem impor ao leitor o jargão teológico moderno “tipo”; “figura” foi mantida onde o próprio trecho contrasta a revelação figurativa.
- source_word: ξύλον (probable behind “tree”)
  choice: árvore / madeiro
  rationale: Na primeira citação, “árvore” preserva a imagem incomum; no episódio da serpente, “madeiro” comunica o objeto erguido e mantém a associação com a cruz sem traduzir explicitamente por “cruz”.
- source_word: Ἰησοῦς
  choice: Jesus — Josué
  rationale: O argumento depende de o grego empregar o mesmo nome para Jesus e Josué; a forma dupla torna isso inteligível em português.
- source_word: χριστός
  choice: Cristo / meu Cristo
  rationale: Preserva tanto o título cristológico quanto a formulação peculiar da citação atribuída a Isaías, sem harmonizá-la com versões bíblicas correntes.
- source_word: ἀντιλέγω (reflected by “gainsaid”)
  choice: opor-se
  rationale: “Opor-se” é atual e inteligível, conservando a ideia de resistência ou contradição.
theological_decisions:
- issue: Leitura cristológica dos episódios de Moisés
  choice: Preservar as afirmações do autor como representações de Jesus
  alternative: Reformular como simples analogias posteriores
  rationale: O texto apresenta esses acontecimentos como revelações figurativas intencionais; enfraquecer isso apagaria sua argumentação própria.
- issue: Capacidade da serpente morta de dar vida
  choice: Manter a formulação paradoxal
  alternative: Explicar que Deus curava quem olhava para a serpente
  rationale: A frase é teologicamente incomum, mas pertence ao raciocínio cristológico do autor e não deve ser harmonizada silenciosamente com Números.
- issue: Jesus como “não um filho de homem, mas o Filho de Deus”
  choice: Conservar o contraste literalmente
  alternative: Interpretar “filho de homem” como o título “Filho do Homem”
  rationale: A expressão é ambígua e pode contrastar origem meramente humana com filiação divina; a tradução evita capitalização interpretativa.
- issue: Davi chama Cristo de Senhor, não de Filho
  choice: Manter a conclusão do autor sem correção
  alternative: Explicar ou conciliar com a filiação davídica
  rationale: A tensão faz parte da exegese do documento e deve permanecer visível.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com preferência por construções naturais no Brasil sem regionalismos marcados. As citações foram mantidas próximas da forma peculiar apresentada pelo testemunho, sem harmonização automática com traduções canônicas. Como a revisão direta do grego e do latim ainda está pendente, decisões relativas a variantes e retroversões permanecem provisórias.
