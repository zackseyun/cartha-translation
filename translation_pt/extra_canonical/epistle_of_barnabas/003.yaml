base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: pt
  text: 'Por isso, ele volta a falar a eles a respeito dessas coisas:


    “Por que vocês jejuam para mim?”, diz o Senhor, “de modo que hoje se ouça a voz de vocês clamando em alta voz? Este não é o jejum que escolhi”, diz o Senhor; “não consiste em uma pessoa humilhar a própria alma.


    Nem mesmo se vocês curvarem o pescoço como um arco, vestirem pano de saco e fizerem das cinzas o seu leito — nem assim chamarão isso de jejum aceitável.


    Mas a nós ele diz: “Vejam! Este é o jejum que escolhi”, diz o Senhor: “Soltem todo laço de injustiça, desatem as cordas apertadas dos contratos impostos à força,[a] mandem livres as pessoas oprimidas e despedacem todo vínculo injusto. Repartam o seu pão com quem tem fome; se virem alguém nu, deem-lhe roupa. Levem para casa os que não têm abrigo; e, se virem uma pessoa humilhada, não a desprezem, nem desprezem ninguém da sua casa e da sua própria descendência.


    Então a luz de vocês romperá como a manhã, e a sua cura surgirá depressa. A justiça irá adiante de vocês, e a glória de Deus os cercará.


    Então vocês clamarão, e Deus os ouvirá. Enquanto ainda estiverem falando, ele dirá: ‘Aqui estou!’ Isso acontecerá se vocês afastarem de si o jugo, o apontar do dedo e a palavra de murmuração; se repartirem de coração o seu pão com quem tem fome e tiverem compaixão da alma humilhada.”


    Foi com esse propósito, portanto, meus irmãos, que aquele que é paciente, prevendo que o povo por ele preparado em seu Amado[b] creria com simplicidade, nos revelou de antemão todas as coisas, para que nós, como principiantes, não naufragássemos contra a lei deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “títulos de dívida obtidos à força” ou “obrigações coercivas”.
    reason: O vocabulário jurídico-social da citação admite mais de uma formulação específica em português.
  - marker: b
    text: 'Ou: “por meio de seu Amado”. A expressão “seu Amado” provavelmente se refere a Jesus, mas a relação exata indicada pela preposição permanece aberta.'
    reason: Preserva a ambiguidade sintática e evita resolver silenciosamente uma formulação cristológica.
lexical_decisions:
- source_word: χρεωγράφων βιαίων (reconstructed from the Isaianic citation)
  choice: contratos impostos à força
  rationale: Expressa instrumentos de dívida ou obrigações escritas obtidas coercivamente, sem restringir indevidamente o termo a uma única forma jurídica.
- source_word: τεθραυσμένους
  choice: os oprimidos
  rationale: O sentido literal de pessoas quebrantadas ou esmagadas, no contexto de libertação social, é comunicado naturalmente por “oprimidos”.
- source_word: ἁπλότης
  choice: simplicidade
  rationale: Preserva a possível ideia de sinceridade, singeleza ou receptividade sem escolher apenas uma dessas nuances.
- source_word: ναυαγήσωμεν
  choice: naufragássemos
  rationale: Mantém a metáfora forte do autor em português corrente e inteligível.
- source_word: ὁ μακρόθυμος / long-suffering
  choice: aquele que é paciente
  rationale: Conserva a perífrase reverente e a ideia de longanimidade, sem inserir explicitamente um referente não nomeado nesta frase.
theological_decisions:
- issue: Referente de “aquele que é paciente”
  choice: Manter a designação indireta
  alternative: Traduzir explicitamente como “Deus, que é paciente”
  rationale: Embora o contexto aponte para Deus, a formulação transmitida é perifrástica; a tradução não deve tornar explícito o que o texto deixa implícito.
- issue: Relação expressa por “em seu Amado”
  choice: Preservar “em seu Amado” com nota
  alternative: Interpretar como “por meio de seu Amado” ou “por causa de seu Amado”
  rationale: A preposição admite mais de uma relação possível, e a formulação tem peso cristológico; a ambiguidade é mantida.
- issue: “Lei deles”
  choice: Conservar o pronome distintivo “deles”
  alternative: Generalizar como “a lei” ou identificar como “a lei judaica”
  rationale: Mantém a tensão retórica do autor sem acrescentar uma identificação denominacional ou étnica mais explícita do que a frase fornecida.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” nas falas dirigidas ao grupo e imperativos naturais. A redação segue prioritariamente a evidência apresentada no testemunho antigo e sua citação de Isaías 58, consultando o POB inglês apenas como camada de controle. Como a revisão direta integral dos testemunhos gregos e latinos foi indicada como pendente, decisões textuais particularmente incertas foram formuladas com cautela e, quando necessário, assinaladas em nota.
