  yaml_path: translation/extra_canonical/epistle_of_barnabas/013.yaml
  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: pt
  text: 'Agora vejamos se é este povo ou o primeiro povo que possui a herança, e se a aliança se refere a nós ou a eles.


    Ouçam, pois, o que a Escritura diz a respeito dos povos: “Isaque orou por Rebeca, sua mulher, porque ela era estéril, e ela concebeu. Então Rebeca foi consultar o Senhor. E o Senhor lhe disse: ‘Duas nações estão em seu ventre, e dois povos em seu interior; um povo vencerá o outro, e o maior servirá ao menor.’”


    Vocês devem compreender quem é Isaque, quem é Rebeca e a respeito de quem ele mostrou que um povo é maior que o outro.


    Em outra profecia, Jacó fala mais claramente a José, seu filho, dizendo: “Eis que o Senhor não me privou de ver o seu rosto; traga-me seus filhos, para que eu os abençoe.”


    José levou Efraim e Manassés, desejando que Manassés fosse abençoado, porque era o mais velho; por isso, José o conduziu à mão direita de seu pai Jacó. Jacó, porém, viu no Espírito uma figura do povo que viria depois. E o que ele diz? “Jacó cruzou as mãos, pôs a mão direita sobre a cabeça de Efraim, o segundo e mais novo, e o abençoou. José disse a Jacó: ‘Passe a mão direita para a cabeça de Manassés, pois ele é meu filho primogênito.’ Jacó disse a José: ‘Eu sei, meu filho, eu sei; mas o maior servirá ao menor. Contudo, este também será abençoado.’”


    Observem em relação a quem ele determinou que este povo fosse o primeiro e o herdeiro da aliança.


    Se, além disso, ele também o registrou por meio de Abraão, chegamos à plenitude do nosso conhecimento. O que, então, ele diz a Abraão, quando este creu sozinho e isso lhe foi atribuído como justiça? “Eis que fiz de você, Abraão, pai de nações que creem em Deus sem serem circuncidadas.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A redação deste capítulo é provisória, baseada no testemunho inglês de domínio público fornecido. A conferência direta dos testemunhos gregos e latinos ainda é necessária; algumas citações bíblicas aparecem em forma combinada ou diferente do texto bíblico corrente.
    reason: A fonte informa que a revisão nas línguas antigas está pendente, e a última citação amplia a formulação conhecida de Gênesis 17:5 com linguagem interpretativa sobre fé e incircuncisão.
lexical_decisions:
- source_word: this people / the first people
  choice: este povo / o primeiro povo
  rationale: Mantém a contraposição retórica do testemunho sem identificar explicitamente os grupos além do que o texto faz.
- source_word: inheritance
  choice: herança
  rationale: Preserva a linguagem bíblica e jurídica ligada à aliança.
- source_word: vanquish
  choice: vencerá
  rationale: Expressa de modo natural a relação de prevalência ou domínio presente no testemunho fornecido.
- source_word: type
  choice: figura
  rationale: ‘Figura’ comunica uma correspondência antecipatória sem impor terminologia técnica confessional.
- source_word: in the Spirit
  choice: no Espírito
  rationale: Mantém a possível referência ao Espírito divino e a capitalização adotada pela camada inglesa auditada.
- source_word: ascribed for righteousness
  choice: isso lhe foi atribuído como justiça
  rationale: Conserva a linguagem de atribuição e evita substituir a formulação por uma interpretação doutrinária mais específica.
- source_word: in uncircumcision
  choice: sem serem circuncidadas
  rationale: Torna a expressão compreensível em português atual, preservando o contraste com a circuncisão.
theological_decisions:
- issue: Identidade de ‘este povo’ e ‘o primeiro povo’
  choice: Manter as designações indiretas
  alternative: Explicitar ‘cristãos’ e ‘Israel/judeus’
  rationale: O capítulo argumenta por tipologia, mas a tradução não deve inserir identificações que não aparecem expressamente nesta passagem.
- issue: Referente dos pronomes divinos ambíguos
  choice: Usar ‘ele’ em minúscula onde o referente permanece incerto
  alternative: Capitalizar como referência inequívoca a Deus
  rationale: O testemunho oscila entre narrador, Escritura e Deus; a tradução preserva essa tensão em vez de resolvê-la silenciosamente.
- issue: Leitura tipológica de Jacó
  choice: ‘uma figura do povo que viria depois’
  alternative: ‘um tipo profético da Igreja’
  rationale: Preserva a interpretação tipológica do autor sem nomear diretamente a comunidade posterior.
- issue: Fé de Abraão e justiça
  choice: ‘quando este creu sozinho e isso lhe foi atribuído como justiça’
  alternative: ‘quando somente ele creu e foi considerado justo’
  rationale: Mantém tanto a possível ênfase na singularidade de Abraão quanto a formulação de atribuição, sem harmonização teológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com formas brasileiras naturais (‘vocês’, ‘traga-me’) e vocabulário bíblico reconhecível. As citações foram pontuadas para clareza, sem modernizar a argumentação tipológica nem eliminar suas repetições.
