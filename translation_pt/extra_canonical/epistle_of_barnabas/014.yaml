lexical_decisions:
- source_word: covenant
  choice: aliança
  rationale: É o equivalente português corrente e biblicamente reconhecível, adequado tanto às tábuas quanto à relação estabelecida por Deus.
- source_word: fathers
  choice: pais
  rationale: Preserva a formulação ancestral do testemunho sem restringi-la interpretativamente a “patriarcas”.
- source_word: molten images / cast-metal images
  choice: imagens de metal fundido
  rationale: Expressa em português natural o processo de fabricação e evita limitar as imagens a uma forma específica não declarada.
- source_word: inheritance
  choice: herança
  rationale: Mantém a metáfora de pertencimento e posse divina presente em “povo de sua herança”.
- source_word: word
  choice: palavra
  rationale: Preserva a possível amplitude do termo, sem decidir entre mensagem, proclamação ou referência pessoal.
- source_word: humble
  choice: humildes
  rationale: Segue o testemunho fornecido e preserva a qualidade espiritual/social sem substituí-la por “pobres” na ausência de revisão grega direta.
- source_word: recompense / repayment
  choice: retribuição
  rationale: Termo atual e digno que conserva a ideia de resposta judicial, sem determinar se é exclusivamente punição ou recompensa.
theological_decisions:
- issue: Consumação dos pecados de “eles”
  choice: “chegassem à consumação de seus pecados”
  alternative: “fossem aperfeiçoados em seus pecados”
  rationale: A opção escolhida mantém a tensão e a dureza da formulação, mas evita sugerir que o pecado foi moralmente aperfeiçoado; uma nota registra a dificuldade.
- issue: Quem herdou a aliança
  choice: “daquele que a herdou, isto é, o Senhor Jesus”
  alternative: “por meio do herdeiro dela, o Senhor Jesus”
  rationale: Preserva explicitamente a linguagem de herança e a identificação cristológica feita pelo autor, sem harmonização adicional.
- issue: A aliança estabelecida “em nós”
  choice: “estabelecesse em nós a aliança por meio da palavra”
  alternative: “estabelecesse conosco a aliança por meio da palavra”
  rationale: Mantém a incomum interioridade da expressão do testemunho, em vez de normalizá-la para uma fórmula convencional.
- issue: Referentes de “eles” e “nós”
  choice: Manter os pronomes coletivos do texto
  alternative: Explicitar “Israel” e “cristãos”
  rationale: Evita acrescentar identificações denominacionais ou históricas que o trecho não formula diretamente, preservando também sua tensão retórica.
- issue: Identidade do servo e do Senhor
  choice: “Moisés ... como servo, mas o próprio Senhor...”
  alternative: Explicitar o Senhor como Cristo em toda a frase
  rationale: A tradução deixa a progressão cristológica ocorrer no próprio texto, que identifica depois o Senhor Jesus, sem antecipar uma resolução interpretativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega tratamento por “você” nas citações proféticas para evitar formas arcaicas, mantendo solenidade por meio da sintaxe e do vocabulário. O texto é necessariamente provisório porque o material fornecido declara pendente a revisão direta dos testemunhos gregos e latinos; por isso, não se apresentam como resolvidas as ambiguidades que dependem dessa verificação.
