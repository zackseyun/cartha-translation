  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: pt
  text: 'Sim, de fato. Mas, quanto à aliança que ele jurou aos pais dar ao povo, vejamos se realmente a deu. Ele a deu, mas eles mesmos não foram considerados dignos de recebê-la por causa de seus pecados.


    Pois o profeta diz: “Moisés jejuou no monte Sinai durante quarenta dias e quarenta noites, para receber a aliança do Senhor e entregá-la ao povo. E [Moisés][a] recebeu do Senhor as duas tábuas, escritas no Espírito pelo dedo da mão do Senhor.” Moisés as tomou e as levou para entregá-las ao povo.


    E o Senhor disse a Moisés: “Moisés, Moisés, desça depressa, pois o seu povo, que você tirou da terra do Egito, agiu perversamente.” Moisés percebeu que eles haviam feito novamente para si imagens de metal fundido; então lançou as tábuas de suas mãos, e as tábuas da aliança do Senhor se despedaçaram.


    Moisés as recebeu, mas eles mesmos não foram considerados dignos. Como, então, nós as recebemos? Observem isto: Moisés as recebeu como servo, mas o próprio Senhor as deu a nós, para que fôssemos o povo de sua herança, depois de suportar pacientemente por nossa causa.


    Ele, porém, foi manifestado para que, ao mesmo tempo, eles chegassem à consumação de seus pecados[b] e nós recebêssemos a aliança por meio daquele que a herdou, isto é, o Senhor Jesus. Ele foi preparado de antemão para isso: a fim de que, manifestando-se pessoalmente, resgatasse das trevas o nosso coração, que já havia sido entregue à morte e abandonado à perversidade do erro, e assim estabelecesse em nós a aliança por meio da palavra.


    Pois está escrito que o Pai lhe ordena que nos liberte das trevas e prepare para si um povo santo.


    Por isso, o profeta diz: “Eu, o Senhor, seu Deus, chamei você em justiça; tomarei você pela mão e o fortalecerei. Eu o dei como aliança para a raça[c] e luz para as nações, para abrir os olhos dos cegos, tirar de suas correntes os que estão presos e, da prisão, os que estão sentados nas trevas.” Compreendemos, portanto, de onde fomos resgatados.


    Novamente o profeta diz: “Eis que estabeleci você como luz para as nações, para que seja salvação até os confins da terra.” Assim diz o Senhor que resgatou você, isto é, Deus.


    Novamente o profeta diz: “O Espírito do Senhor está sobre mim; por isso ele me ungiu para anunciar boas-novas aos humildes. Enviou-me para curar os que têm o coração quebrantado, proclamar libertação aos cativos e recuperação da vista aos cegos, proclamar o ano aceitável do Senhor e o dia da retribuição, e consolar todos os que choram.”


    [a] O nome “Moisés” aparece entre colchetes porque é uma restauração indicada pelo testemunho de tradução utilizado.


    [b] Ou: “fossem plenamente consumados em seus pecados”. A expressão difícil pode indicar que os pecados chegaram à sua medida completa, sem especificar aqui o modo exato dessa consumação.


    [c] Ou: “para o povo”. O testemunho utilizado traz “raça”; a revisão direta dos testemunhos gregos e latinos ainda é necessária.'
