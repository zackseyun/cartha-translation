  text: 'For this purpose the Lord endured handing over his flesh to corruption, so that we might be cleansed by the forgiveness of sins, a cleansing that comes through the blood of his sprinkling.


    For the Scripture concerning him contains some things relating to Israel and some relating to us. It says: “He was wounded for your transgressions, and he was bruised for our sins. By his stripes we were healed. Like a sheep he was led to slaughter, and like a lamb silent before its shearer.”


    Therefore, we ought to be very thankful to the Lord, because he has revealed the past to us, made us wise concerning the present, and not left us without understanding concerning the future.


    Now the Scripture says, “Not unjustly is the net spread for the birds.” He means that a person will justly perish if, despite knowing the way of righteousness, he forces himself onto the way of darkness.


    There is also this, my brothers: If the Lord endured suffering for our souls, though he was Lord of the whole world—the one to whom God said at the foundation of the world, “Let us make man in our image and likeness”—then how did he endure suffering at the hands of human beings?


    Understand this. The prophets, having received grace from him, prophesied concerning him. But he himself endured suffering so that he might destroy death and show forth the resurrection of the dead, because it was necessary for him to be manifested in the flesh;


    so that at the same time he might redeem the promise made to the fathers and, by preparing the new people for himself, show while he was on earth that, having brought about the resurrection, he himself will exercise judgment.


    Furthermore, he preached, teaching Israel and performing so many wonders and miracles, and he loved him exceedingly.


    When he chose his own apostles, who were to proclaim his gospel—men who were sinners beyond every sin, so that he might show that he came not to call the righteous but sinners—then he manifested himself to be the Son of God.


    For if he had not come in the flesh, people could not have looked upon him and been saved, since they cannot face the rays of the sun, which will cease to be and is the work of his own hands.


    Therefore, the Son of God came in the flesh for this purpose: to sum up the complete tale of their sins against those who persecuted and killed his prophets.


    For this purpose, then, he endured. For God says that the wounds of his flesh came from them: “When they strike their own shepherd, then the sheep of the flock will be lost.”


    But he himself desired to suffer in this way, for it was necessary for him to suffer on a tree. For he that prophesied said concerning him, “Spare my soul from the sword,” and, “Pierce my flesh with nails, for the congregations of evildoers have risen up against me.”


    And again he says, “Behold, I have given my back to stripes and my cheeks to smitings, and I have set my face as a hard rock.”'
translation:
  language: pt
  text: '**Barnabé 5**


    Foi para isto que o Senhor suportou entregar sua carne à corrupção: para que fôssemos purificados pelo perdão dos pecados, purificação que se dá pelo sangue da sua aspersão.[a]


    Pois a Escritura a respeito dele contém algumas palavras dirigidas a Israel e outras dirigidas a nós. Ela diz: “Ele foi ferido por causa das transgressões de vocês e esmagado por causa dos nossos pecados; por suas feridas fomos curados. Como ovelha, foi levado ao matadouro; e, como cordeiro calado diante de quem o tosquia, não abriu a boca.”


    Portanto, devemos ser muito agradecidos ao Senhor, porque ele nos revelou o passado, deu-nos sabedoria quanto ao presente e não nos deixou sem entendimento quanto ao futuro.


    Ora, a Escritura diz: “Não é sem razão que se estende a rede diante das aves.”[b] Isso significa que perecerá com justiça aquele que, embora conheça o caminho da justiça, obriga a si mesmo a seguir pelo caminho das trevas.


    Há ainda isto, meus irmãos: se o Senhor suportou sofrer por nossa vida,[c] embora fosse o Senhor do mundo inteiro — aquele a quem Deus disse desde a fundação do mundo: “Façamos o ser humano à nossa imagem e semelhança” —, como foi que ele suportou sofrer pelas mãos dos seres humanos?


    Entendam: os profetas, tendo recebido dele a graça, profetizaram a respeito dele. Ele próprio, porém, suportou o sofrimento para destruir a morte e tornar manifesta a ressurreição dos mortos, pois era necessário que se manifestasse em carne.


    Assim, ao mesmo tempo, ele cumpriria a promessa feita aos pais e, preparando para si o novo povo, mostraria, enquanto ainda estava na terra, que, depois de realizar a ressurreição, ele próprio exercerá o juízo.[d]


    Além disso, ele pregou, ensinando Israel e realizando tantos sinais e prodígios, e amou Israel profundamente.[e]


    Quando escolheu seus próprios apóstolos, que proclamariam seu evangelho — homens mais pecadores do que todo pecado,[f] para mostrar que não veio chamar justos, mas pecadores —, então manifestou que era o Filho de Deus.


    Pois, se ele não tivesse vindo em carne, os seres humanos não poderiam contemplá-lo e ser salvos, visto que nem sequer conseguem olhar de frente para os raios do sol, que deixará de existir e é obra das mãos dele.


    Portanto, o Filho de Deus veio em carne com este propósito: levar à plenitude os pecados daqueles que perseguiram e mataram os profetas dele.[g]


    Foi para isso, portanto, que ele suportou o sofrimento. Pois Deus declara que os ferimentos na carne dele vieram da parte deles: “Quando ferirem o seu próprio pastor, então as ovelhas do rebanho se perderão.”[h]


    Mas ele próprio quis sofrer dessa maneira, pois era necessário que sofresse sobre o madeiro. Aquele que profetizou a respeito dele disse: “Poupa da espada a minha vida”; e: “Traspassa minha carne com pregos, pois ajuntamentos de malfeitores se levantaram contra mim.”[i]


    E diz ainda: “Eis que entreguei minhas costas aos açoites e minhas faces às bofetadas; firmei meu rosto como rocha dura.”


    **Notas**


    [a] “Sangue da sua aspersão” conserva a linguagem ritual do texto, que associa a purificação ao sangue aspergido.


    [b] A formulação proverbial é difícil. Também pode ser entendida de modo mais literal: “Não injustamente se estende a rede para as aves”.


    [c] O termo também pode ser traduzido por “nossas almas”. Aqui, “vida” expressa a pessoa viva sem decidir uma antropologia específica.


    [d] A relação temporal e lógica entre a ressurreição e o juízo é compacta no texto: ele realiza a ressurreição e ele mesmo julga.


    [e] O pronome do texto retoma Israel. O nome foi repetido para evitar ambiguidade em português.


    [f] Expressão deliberadamente extrema e difícil, que pode também ser vertida: “mais transgressores do que qualquer pecado”. Ela ressalta a condição pecadora dos apóstolos antes do chamado, sem especificar pecados individuais.


    [g] A expressão pode significar “recapitular”, “completar” ou “levar ao ponto culminante” os pecados deles. A construção atribui os pecados aos perseguidores e assassinos dos profetas.


    [h] A citação combina a imagem do pastor ferido com a dispersão ou perda das ovelhas. “Se perderão” preserva a forma do testemunho apresentado neste capítulo.


    [i] A sequência reúne formulações escriturísticas em uma citação composta. “Madeiro” designa a madeira ou árvore da execução e, neste contexto, a cruz.'
