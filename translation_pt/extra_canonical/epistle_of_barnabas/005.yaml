lexical_decisions:
- source_word: καταφθορά / corruption (witness)
  choice: corrupção
  rationale: Mantém a força física e mortal da entrega da carne, sem suavizá-la como simples sofrimento.
- source_word: ἄφεσις τῶν ἁμαρτιῶν / remission of sins
  choice: perdão dos pecados
  rationale: Formulação corrente e clara em português, capaz de abranger remissão e liberação da culpa.
- source_word: αἷμα τοῦ ῥαντίσματος / blood of sprinkling
  choice: sangue da sua aspersão
  rationale: Preserva a imagem ritual incomum em vez de paráfrase interpretativa.
- source_word: ψυχή / soul-life
  choice: vida
  rationale: No contexto, refere-se à vida ou pessoa pela qual o Senhor sofre; a nota registra a alternativa tradicional “alma”.
- source_word: ἀποδῷ τὴν ἐπαγγελίαν / render the promise
  choice: cumpriria a promessa
  rationale: Expressa naturalmente a realização do que foi prometido, evitando o português pouco claro “redimir a promessa”.
- source_word: σημεῖα καὶ τέρατα / wonders and miracles
  choice: sinais e prodígios
  rationale: Mantém o par tradicional de termos e sua função reveladora.
- source_word: ἀνακεφαλαιόω / sum up, recapitulate
  choice: levar à plenitude
  rationale: Conserva a ideia de consumação dos pecados sem impor uma leitura técnica única; alternativas são anotadas.
- source_word: ξύλον / tree, wood
  choice: madeiro
  rationale: Preserva tanto o suporte material quanto a alusão à cruz, sem substituir diretamente o termo por “cruz”.
theological_decisions:
- issue: Relação entre perdão, purificação e sangue
  choice: 'Manter a cadeia textual: purificação pelo perdão, por meio do sangue da aspersão'
  alternative: Reformular como uma teoria sistemática de expiação
  rationale: O texto associa esses elementos de maneira compacta; a tradução não define além disso o mecanismo teológico.
- issue: O referente na criação (“aquele a quem Deus disse”)
  choice: Conservar a aplicação da fala “Façamos” ao Senhor
  alternative: Diluir a construção ou identificar explicitamente uma doutrina trinitária posterior
  rationale: A cristologia do autor deve permanecer visível, mas sem receber terminologia dogmática não presente no texto.
- issue: “Por nossa vida/almas”
  choice: Usar “por nossa vida” e registrar “almas” em nota
  alternative: Fixar “almas” como uma substância separável do corpo
  rationale: Preserva a amplitude semítica e grega do termo e evita resolver uma questão antropológica que a frase não desenvolve.
- issue: Pecaminosidade dos apóstolos
  choice: Preservar a hipérbole difícil “mais pecadores do que todo pecado”
  alternative: Suavizar para “homens comuns e pecadores”
  rationale: A retórica extrema pertence ao argumento sobre o chamado dos pecadores e não deve ser normalizada silenciosamente.
- issue: Consumação dos pecados dos perseguidores
  choice: Traduzir como “levar à plenitude os pecados”
  alternative: Interpretar como expiar, perdoar ou simplesmente enumerar esses pecados
  rationale: A passagem é teologicamente tensa e parece tratar da culminação ou recapitulação da culpa dos perseguidores; não convém convertê-la em linguagem inequívoca de perdão.
- issue: Ressurreição e juízo pelo Filho
  choice: Manter que ele realiza a ressurreição e exerce pessoalmente o juízo
  alternative: Generalizar ambos como atos impessoais de Deus
  rationale: A repetição enfática do sujeito no testemunho sustenta essa afirmação cristológica.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. Períodos longos foram moderadamente segmentados, sem apagar a progressão argumentativa. As citações mantêm tom escriturístico sem arcaísmos como “eis que” apenas onde a fórmula é retoricamente pertinente. Como o material fornecido identifica a revisão direta do grego/latim como pendente, o rascunho segue prioritariamente a evidência lexical recuperável do testemunho antigo refletido na tradição fornecida e assinala em notas as principais incertezas que exigem colação final.
