review_pass:
  verdict: revise
  source_fidelity: 'A tradução conserva a estrutura e os contrastes centrais do testemunho fornecido: dois caminhos, luz/trevas, os anjos de Deus e de Satanás, e a oposição entre eternidade e a presente era de iniquidade. Mantém-se prudentemente a ambiguidade sintática de «caminhos de ensino e de poder».'
  naturalness: Há uma pequena aspereza em «a outra lição e ensino» e em «estão posicionados». «Outro ensinamento e outra instrução» e «estão postados» soam mais naturais em português atual sem reduzir o paralelismo do original.
  terminology: «Caminhos», «luz», «trevas», «iniquidade», «Senhor» e «senhor» são escolhas adequadas. A nota preserva de modo útil o caráter editorial da distinção de maiúsculas, sem apresentar a convenção como propriedade dos manuscritos.
  issues:
  - severity: low
    issue: Formulação inicial pouco natural
    rationale: «Passemos, porém, a outra lição e ensino» coordena dois substantivos próximos de modo pouco idiomático e deixa «outra» com escopo gramaticalmente desconfortável. A revisão explicita a coordenação sem mudar o sentido.
  - severity: low
    issue: «Estão posicionados» é excessivamente técnico
    rationale: Para anjos «stationed» no testemunho inglês, «estão postados» preserva a ideia de posição/designação e é mais idiomático no registro da passagem.
  revised_text: 'Passemos, porém, a outro ensinamento e a outra instrução. Há dois caminhos de ensino e de poder: um, o da luz; o outro, o das trevas. Há uma grande diferença entre os dois caminhos. Num deles estão postados os anjos de Deus que dão luz; no outro, os anjos de Satanás.


    O primeiro é o Senhor desde toda a eternidade e por toda a eternidade; o outro, porém, é senhor deste presente tempo de iniquidade.[a]'
  revised_footnotes:
  - marker: a
    text: A distinção entre «Senhor» e «senhor» por meio de inicial maiúscula ou minúscula é editorial; os manuscritos antigos não fazem essa diferenciação. O contraste do texto é entre o domínio eterno do primeiro e o domínio limitado ao presente tempo de iniquidade do outro.
    reason: Evita que uma convenção moderna de capitalização resolva silenciosamente a tensão da frase.
  revision_rationale: Foram feitas apenas correções seguras de idiomaticidade e registro. A redação continua dependente do testemunho inglês fornecido; sem consulta direta aos testemunhos grego e latino, não se deve estreitar a relação sintática entre «ensino e poder» nem sistematizar o contraste entre os dois senhores.
