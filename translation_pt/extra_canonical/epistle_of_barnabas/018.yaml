base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: pt
  text: 'Passemos, porém, a outra lição e ensino. Há dois caminhos de ensino e poder: um, o da luz; o outro, o das trevas. E há uma grande diferença entre os dois caminhos. Num deles estão posicionados os anjos de Deus que dão luz; no outro, os anjos de Satanás.


    O primeiro é o Senhor desde toda a eternidade e por toda a eternidade; o outro, porém, é senhor deste tempo presente de iniquidade.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A distinção entre «Senhor» e «senhor» por meio de inicial maiúscula ou minúscula é editorial; os manuscritos antigos não fazem essa diferenciação. O contraste do texto é entre o domínio eterno do primeiro e o domínio limitado ao presente tempo de iniquidade do outro.
    reason: Evita que uma convenção moderna de capitalização silenciosamente resolva a tensão da frase.
lexical_decisions:
- source_word: two ways
  choice: dois caminhos
  rationale: Mantém a imagem ética tradicional dos dois caminhos em linguagem portuguesa natural.
- source_word: teaching and power
  choice: ensino e poder
  rationale: Conserva os dois substantivos e sua relação deliberadamente aberta, sem explicar de modo indevido se qualificam os caminhos ou constituem esferas distintas.
- source_word: light giving angels of God
  choice: os anjos de Deus que dão luz
  rationale: Reproduz a função expressa pelo testemunho inglês sem recorrer ao adjetivo pouco natural «lucíferos» ou a uma paráfrase teológica.
- source_word: season of iniquity that now is
  choice: este tempo presente de iniquidade
  rationale: Expressa tanto o caráter atual quanto a duração limitada da era de iniquidade.
theological_decisions:
- issue: O uso de «Lord» tanto para o primeiro quanto para o outro
  choice: «o Senhor» para o primeiro e «senhor» para o outro, com nota
  alternative: Empregar «Senhor» com inicial maiúscula em ambos os casos
  rationale: A distinção tipográfica facilita a leitura sem negar que o texto atribui ao outro um domínio temporário; a nota preserva a tensão e informa que a capitalização não pertence aos manuscritos antigos.
- issue: Contraste entre domínio eterno e domínio presente
  choice: Manter «desde toda a eternidade e por toda a eternidade» em contraste com «deste tempo presente»
  alternative: Parafrasear como soberania absoluta de Deus e autoridade passageira de Satanás
  rationale: Preserva a formulação temporal e sua força teológica sem acrescentar uma sistematização não explicitada no trecho.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A redação é provisória porque o material fornecido é um testemunho inglês de domínio público; a revisão direta dos testemunhos gregos e latinos ainda está pendente.
