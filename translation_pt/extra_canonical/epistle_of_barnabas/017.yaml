base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: pt
  text: 'Até onde me foi possível explicar tudo a vocês com simplicidade, minha alma espera que eu não tenha omitido nada [das questões relacionadas à salvação e, assim, deixado de cumprir meu desejo].[a]


    Pois, se eu lhes escrevesse sobre as coisas presentes ou futuras, vocês não as entenderiam, porque estão expressas em parábolas. Quanto a isso, basta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As palavras entre colchetes refletem uma restauração ou incerteza na transmissão manuscrita indicada pelo testemunho usado como base.
    reason: Preservar de forma visível o sinal de restauração ou dano manuscrito presente no material fornecido, sem apresentar o trecho como textualmente seguro.
lexical_decisions:
- source_word: with all simplicity
  choice: com simplicidade
  rationale: Preserva a ideia de exposição franca e acessível sem acrescentar sentidos como ingenuidade ou simplismo.
- source_word: my soul hopeth
  choice: minha alma espera
  rationale: Mantém a expressão pessoal e enfática do testemunho, em vez de reduzi-la simplesmente a “espero”.
- source_word: things immediate or future
  choice: as coisas presentes ou futuras
  rationale: Segue a leitura contextual refletida na camada de consulta, mantendo o contraste temporal sem especificar indevidamente quais acontecimentos estão em vista.
- source_word: put in parables
  choice: estão expressas em parábolas
  rationale: Formulação natural em português que conserva a ideia de conteúdo comunicado sob forma parabólica.
- source_word: So much then for this
  choice: Quanto a isso, basta
  rationale: Reproduz de modo corrente e digno a fórmula conclusiva que encerra o assunto.
theological_decisions:
- issue: Alcance das questões relacionadas à salvação
  choice: Manter a formulação ampla “questões relacionadas à salvação”
  alternative: Especificar doutrinas, práticas ou acontecimentos salvíficos
  rationale: O testemunho fornecido não identifica essas questões; a tradução evita impor uma delimitação teológica ausente.
- issue: Natureza das “coisas presentes ou futuras”
  choice: Preservar a referência geral
  alternative: Interpretá-las explicitamente como profecias, acontecimentos escatológicos ou mistérios
  rationale: O texto mantém o referente indeterminado e relaciona sua dificuldade à expressão em parábolas; explicá-lo mais seria resolver uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e compreensão internacional. O plural “vocês” foi usado como forma corrente de tratamento. Esta redação é provisória, pois se baseia no testemunho inglês público fornecido; a revisão direta dos testemunhos gregos e latinos ainda está pendente.
