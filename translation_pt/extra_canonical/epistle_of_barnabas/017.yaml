review_pass:
  verdict: revise
  source_fidelity: 'A redação acompanha fielmente o testemunho inglês fornecido: conserva a limitação da capacidade do autor, a esperança de não haver omitido matéria relativa à salvação, a oposição entre realidades presentes e futuras e a formulação parabólica. A lacuna/restauração entre colchetes é preservada. Ajusta-se apenas a formulação portuguesa de «failed in my desire», para expressar com mais precisão a ideia de frustrar o propósito/intenção do autor, sem especificá-lo teologicamente.'
  naturalness: O texto é claro e de registro apropriado. A revisão melhora a fluência da construção dentro dos colchetes e posiciona a chamada de nota diretamente no trecho textual restaurado a que se refere.
  terminology: «Salvação», «parábolas» e a referência não interpretada a «coisas presentes ou futuras» são adequadas. «Minha alma espera» mantém deliberadamente a expressão pessoal do testemunho, em registro digno e compreensível.
  issues:
  - severity: low
    issue: A expressão «deixado de cumprir meu desejo» é menos idiomática e pode sugerir a realização de um desejo pessoal.
    rationale: O inglês «failed in my desire» comunica antes o insucesso ou a frustração da intenção do autor. «Frustrado meu propósito» reproduz melhor esse valor, sem impor conteúdo ao propósito.
  - severity: low
    issue: A chamada da nota ocorre após o ponto final, e não junto ao material entre colchetes.
    rationale: Como a nota explica precisamente o status textual da restauração, é mais claro ancorá-la imediatamente após o trecho restaurado.
  revised_text: 'Até onde me foi possível explicar tudo a vocês com simplicidade, minha alma espera que eu não tenha omitido nada [das questões relacionadas à salvação e, assim, frustrado meu propósito][a].


    Pois, se eu lhes escrevesse sobre as coisas presentes ou futuras, vocês não as entenderiam, porque estão expressas em parábolas. Quanto a isso, basta.'
  revised_footnotes:
  - marker: a
    text: As palavras entre colchetes refletem uma restauração ou incerteza na transmissão manuscrita indicada pelo testemunho usado como base.
    reason: Preservar de forma visível o sinal de restauração ou dano manuscrito presente no material fornecido, sem apresentar o trecho como textualmente seguro.
  revision_rationale: A revisão é limitada a uma melhoria semântica e idiomática no trecho restaurado («frustrado meu propósito») e ao reposicionamento da chamada de nota. Mantêm-se a ambiguidade do referente temporal e o sinal explícito de incerteza textual.
