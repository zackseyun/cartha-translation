review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente a progressão do testemunho: a exposição simples, a esperança de não ter omitido matéria relativa à salvação, a limitação quanto a assuntos presentes/futuros e a referência à linguagem parabólica. Convém conservar explicitamente a intensidade de “with all simplicity” e formular de modo mais direto a relação entre a omissão e o fracasso do propósito do autor.'
  naturalness: O texto é claro e de registro apropriado. Pequenos ajustes tornam a primeira frase mais fluente e evitam a construção algo pesada “deixado de cumprir meu desejo”.
  terminology: “Salvação” e “parábolas” são escolhas adequadas e não introduzem interpretação teológica. “Assuntos relativos à salvação” é uma formulação portuguesa natural para o referente amplo de “matters pertaining unto salvation”.
  issues:
  - severity: low
    issue: A intensidade de “with all simplicity” ficou atenuada.
    rationale: “Com simplicidade” comunica o sentido básico, mas “com toda simplicidade” representa melhor a ênfase do testemunho sem soar artificial.
  - severity: low
    issue: “Deixado de cumprir meu desejo” é menos idiomático e ligeiramente impreciso para “failed in my desire”.
    rationale: A formulação “não tenha realizado meu propósito” expressa de forma natural que uma eventual omissão frustraria a intenção declarada do autor, sem definir o conteúdo teológico do trecho restaurado.
  - severity: low
    issue: A chamada de nota vem depois do ponto final.
    rationale: Como a nota explica especificamente o material entre colchetes, a chamada deve seguir o colchete e preceder o ponto, deixando claro o seu alcance.
  revised_text: 'Na medida em que pude expor-lhes tudo com toda simplicidade, minha alma espera que eu não tenha omitido nada [dos assuntos relativos à salvação e, assim, não tenha realizado meu propósito][a].


    Pois, se eu lhes escrevesse sobre as coisas presentes ou futuras, vocês não as entenderiam, pois elas são apresentadas em parábolas. Quanto a isso, basta.'
  revised_footnotes:
  - marker: a
    text: As palavras entre colchetes refletem uma restauração ou incerteza na transmissão manuscrita indicada pelo testemunho usado como base.
    reason: Preservar visivelmente o sinal de restauração ou dano manuscrito presente no material fornecido, sem apresentar o trecho como textualmente seguro.
  revision_rationale: A revisão conserva a ambiguidade do referente temporal e o sentido amplo da salvação, reforça a ênfase da exposição “com toda simplicidade”, melhora a formulação portuguesa da finalidade frustrada e posiciona a chamada de nota junto ao trecho restaurado.
