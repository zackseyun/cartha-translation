source:
  text: 'So far as it was possible with all simplicity to declare it unto you, my soul hopeth that I have not omitted anything [of the matters pertaining unto salvation and so failed in my desire].


    For if I should write to you concerning things immediate or future, ye would not understand them, because they are put in parables. So much then for this.'
