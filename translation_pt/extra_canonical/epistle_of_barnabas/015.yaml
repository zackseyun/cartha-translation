lexical_decisions:
- source_word: Ten Words
  choice: Dez Palavras
  rationale: Preserva a designação antiga do Decálogo, em vez de substituí-la silenciosamente por uma forma interpretativa mais familiar.
- source_word: hallow / make holy
  choice: santificar
  rationale: Mantém de modo consistente a ligação verbal entre o sábado santificado por Deus e sua santificação pelas pessoas.
- source_word: observe the Sabbath
  choice: guardar o sábado
  rationale: Expressão bíblica corrente e natural em português para a observância do sábado.
- source_word: bring all things to an end
  choice: levar todas as coisas ao seu fim
  rationale: Reproduz a ideia escatológica sem especificar indevidamente destruição ou consumação.
- source_word: Lawless One
  choice: Iníquo
  rationale: Trata a expressão como título pessoal e preserva sua força escatológica; a nota registra a possibilidade lexical mais literal.
- source_word: eighth day
  choice: oitavo dia
  rationale: Conserva a terminologia simbólica do autor e sua relação explícita com a ressurreição e o novo mundo.
- source_word: keep the eighth day for rejoicing
  choice: celebramos com alegria o oitavo dia
  rationale: Oferece português natural sem apagar a ideia de observância comunitária festiva.
theological_decisions:
- issue: Interpretação dos seis dias como seis mil anos
  choice: Mantida como afirmação interpretativa do autor
  alternative: Atenuar como mera possibilidade ou acrescentar concordância editorial
  rationale: O texto apresenta diretamente essa leitura escatológica; a tradução não deve endossá-la nem corrigi-la.
- issue: Identidade de quem descansará no sétimo dia
  choice: Mantido o pronome “ele”
  alternative: Explicitar “Deus”, “o Senhor” ou “o Filho”
  rationale: O testemunho fornecido deixa tensão referencial no contexto; explicitar resolveria uma ambiguidade genuína.
- issue: Possibilidade presente de santificar o sábado
  choice: Preservada a construção argumentativa difícil do texto
  alternative: Reformular para dizer categoricamente que ninguém pode guardar o sábado agora
  rationale: A frase tem lógica retórica compacta e potencialmente estranha; uma paráfrase mais forte importaria uma conclusão não formulada desse modo.
- issue: Justificação, promessa e santificação
  choice: 'Mantida a sequência passiva: justificados, recebendo a promessa e santificados'
  alternative: Explicar o agente, o mecanismo ou a ordem da salvação
  rationale: Preserva a formulação teológica do autor sem acrescentar uma estrutura confessional posterior.
- issue: Oitavo dia e outro mundo
  choice: Mantida a identificação expressa pelo autor
  alternative: Interpretar explicitamente como domingo, nova criação ou era eterna
  rationale: O texto associa o oitavo dia à ressurreição e ao começo de outro mundo, mas não requer que a tradução imponha terminologia doutrinária adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se o tratamento coletivo por “vocês”, o vocativo “filhos” e a cadência argumentativa do texto antigo. As citações foram vertidas conforme aparecem no capítulo, sem harmonização automática com traduções bíblicas canônicas. Como a revisão direta das testemunhas gregas e latinas está pendente, o texto é um rascunho de publicação fundamentado prioritariamente na evidência fornecida e conserva cautela especial em ambiguidades, títulos e restaurações.
