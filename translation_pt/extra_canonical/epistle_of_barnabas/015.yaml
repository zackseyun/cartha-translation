  terminology: «Dez Palavras», «santificar», «guardar o sábado», «Iníquo», «justificados» e «oitavo dia» são escolhas consistentes e adequadas. A nota sobre «Iníquo» preserva a alternativa lexical sem impor uma identificação doutrinária. A nota da restauração entre colchetes permanece devidamente ancorada.
