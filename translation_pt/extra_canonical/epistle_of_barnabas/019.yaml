translation:
  language: pt
  text: '**Barnabé 19 — O caminho da luz**


    Este, portanto, é o caminho da luz: se alguém deseja percorrer o caminho até o lugar que lhe foi destinado,[a] deve dedicar-se com zelo às suas obras. O conhecimento que nos foi dado para que possamos andar nesse caminho é o seguinte:


    Ame aquele que fez você; tema aquele que o criou; glorifique aquele que o resgatou da morte. Seja sincero de coração e rico de espírito. Não se associe aos que andam no caminho da morte. Odeie tudo o que não agrada a Deus. Odeie toda hipocrisia. Jamais abandone os mandamentos do Senhor.


    Não se exalte; antes, seja humilde em todas as coisas. Não tome glória para si. Não planeje o mal contra o seu próximo. Não acolha a arrogância em sua alma.


    Não pratique imoralidade sexual. Não cometa adultério. Não corrompa meninos.[b] Não pronuncie a palavra de Deus entre pessoas impuras.[c] Ao repreender alguém por uma transgressão, não faça acepção de pessoas. Seja manso. Seja tranquilo. Tema as palavras que ouviu. Não guarde rancor contra seu irmão.


    Não fique em dúvida sobre se algo acontecerá ou não. Não use o nome do Senhor em vão. Ame o seu próximo mais do que a própria vida. Não mate uma criança por aborto, nem a mate depois de nascer.[d] Não deixe de corrigir seu filho ou sua filha; pelo contrário, ensine-lhes desde a juventude o temor de Deus.


    Não cobice os bens do seu próximo. Não seja ganancioso. Não se apegue de coração aos poderosos, mas ande com os humildes e justos. Receba como boas as coisas que lhe acontecerem, sabendo que nada acontece sem Deus.[e] Não tenha mente dividida nem língua dupla.


    Sujeite-se a seus senhores como a uma figura de Deus, com respeito e temor.[f] Não dê ordens com amargura ao seu servo ou à sua serva, pois eles depositam a esperança no mesmo Deus. Do contrário, talvez deixem de temer o Deus que está acima de vocês dois. Pois ele não veio chamar com parcialidade, mas chamar aqueles que o Espírito preparou.


    Faça seu próximo participar de todas as coisas e não diga que coisa alguma pertence somente a você. Pois, se vocês participam juntos do que é imperecível, quanto mais das coisas perecíveis! Não seja precipitado no falar, pois a boca é uma armadilha de morte. Tanto quanto lhe for possível, seja puro por amor à sua alma.


    Não seja encontrado estendendo as mãos para receber e recolhendo-as na hora de dar. Ame como a menina dos olhos todo aquele que lhe anuncia a palavra do Senhor.


    Lembre-se do dia do juízo, noite e dia. Todos os dias, procure os santos: ou trabalhe por meio da palavra, indo exortá-los e refletindo em como salvar almas por sua palavra, ou trabalhe com as próprias mãos para obter resgate por seus pecados.[g]


    Não hesite em dar, nem murmure quando der; antes, reconheça aquele que paga generosamente a sua recompensa. Guarde o que recebeu, sem acrescentar nem retirar coisa alguma. Odeie por completo o Maligno. Julgue com justiça.


    Não provoque divisão; antes, promova a paz entre os que estão em conflito, reconciliando-os. Confesse seus pecados. Não vá orar com a consciência má.


    Este é o caminho da luz.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão também pode ser entendida como “até o lugar que lhe foi designado”; o destino exato não é explicado.
    reason: Preservar a indeterminação de “appointed place”.
  - marker: b
    text: No contexto da lista de proibições sexuais, “corromper meninos” provavelmente se refere à exploração ou ao abuso sexual de menores do sexo masculino.
    reason: Esclarecer uma expressão antiga sem substituir a formulação do texto.
  - marker: c
    text: 'A construção é obscura: pode proibir falar a palavra de Deus em ambiente impuro ou fazê-la sair de modo associado à impureza.'
    reason: Sinalizar uma dificuldade textual e semântica real.
  - marker: d
    text: O texto proíbe em sequência matar a criança antes e depois do nascimento.
    reason: Tornar explícita a estrutura paralela da frase sem acrescentar uma teoria posterior.
  - marker: e
    text: Literalmente, conforme o testemunho fornecido, “nada é feito sem Deus”. O texto não especifica se fala de ação, vontade ou permissão divina.
    reason: Preservar a tensão sobre providência e causalidade.
  - marker: f
    text: A linguagem reflete uma sociedade antiga em que existiam escravidão e servidão; traduzi-la não implica endosso dessas instituições.
    reason: Fornecer contexto histórico necessário ao leitor moderno.
  - marker: g
    text: “Resgate por seus pecados” conserva uma expressão difícil do testemunho; ela não define de que modo o trabalho se relacionaria com perdão, reparação ou arrependimento.
    reason: Evitar harmonização doutrinária de uma formulação teologicamente tensa.
lexical_decisions:
- source_word: way of light
  choice: caminho da luz
  rationale: Mantém a imagem central e o contraste tradicional com o caminho da morte.
- source_word: simple in heart
  choice: sincero de coração
  rationale: Comunica integridade e ausência de duplicidade em português atual, sem sugerir falta de inteligência.
- source_word: boldness
  choice: arrogância
  rationale: No contexto de vícios interiores, o termo indica atrevimento presunçoso, não coragem virtuosa.
- source_word: fornication
  choice: imoralidade sexual
  rationale: Expressão abrangente e inteligível para a conduta sexual ilícita indicada pelo testemunho.
- source_word: corrupt boys
  choice: corrompa meninos
  rationale: Preserva a formulação direta e seu objeto explícito; a nota esclarece a provável dimensão sexual sem estreitar indevidamente o texto.
- source_word: double-minded / double-tongued
  choice: mente dividida / língua dupla
  rationale: Conserva o paralelismo e as imagens de indecisão e fala insincera.
- source_word: masters / bondservant / handmaid
  choice: senhores / servo / serva
  rationale: Representa as relações sociais antigas do testemunho sem modernizá-las como simples emprego.
- source_word: apple of the eye
  choice: menina dos olhos
  rationale: Equivalente idiomático consagrado e compreensível em português.
- source_word: schism
  choice: divisão
  rationale: Evita restringir o sentido a uma definição eclesiástica técnica posterior.
- source_word: Evil One
  choice: Maligno
  rationale: Preserva a referência pessoal sugerida pela forma substantivada e pela inicial maiúscula do testemunho.
theological_decisions:
- issue: A afirmação de que nada acontece sem Deus
  choice: nada acontece sem Deus
  alternative: nada acontece sem a permissão de Deus
  rationale: A versão escolhida preserva a formulação forte e sua tensão teológica; acrescentar “permissão” resolveria uma ambiguidade que o testemunho fornecido não resolve.
- issue: A linguagem de resgate relacionado aos pecados
  choice: para obter resgate por seus pecados
  alternative: como expressão de arrependimento por seus pecados
  rationale: Mantém a linguagem soteriológica difícil do testemunho sem substituí-la por uma interpretação doutrinária.
- issue: Submissão aos senhores como figura de Deus
  choice: como a uma figura de Deus
  alternative: como se servissem a Deus
  rationale: Conserva a comparação explícita e não transforma a relação analógica em identidade ou aprovação irrestrita da instituição.
- issue: Matar uma criança por aborto
  choice: Não mate uma criança por aborto
  alternative: Não provoque aborto
  rationale: Preserva tanto o verbo forte quanto a referência à criança presentes no testemunho, sem suavizar ou ampliar a formulação.
- issue: Salvar almas pela palavra humana
  choice: como salvar almas por sua palavra
  alternative: como Deus pode salvar pessoas por meio de sua palavra
  rationale: Mantém a agência expressa no testemunho e sua tensão, sem inserir uma explicação teológica ausente.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos diretos em vez de formas arcaicas em segunda pessoa. A cadência repetitiva da instrução moral foi mantida. Como o material fornecido identifica a revisão direta dos testemunhos gregos e latinos como pendente, esta redação é necessariamente provisória e se apoia no testemunho inglês público apresentado, com ambiguidades relevantes marcadas em notas.
