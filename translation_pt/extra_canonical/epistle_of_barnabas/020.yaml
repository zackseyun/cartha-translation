translation:
  language: pt
  text: 'Mas o caminho do Sombrio[a] é tortuoso e cheio de maldição. É o caminho da morte eterna acompanhada de castigo; nele estão as coisas que destroem a alma das pessoas: idolatria, insolência, exaltação do poder[b], hipocrisia, duplicidade de coração, adultério, homicídio, saque, orgulho, transgressão, traição, maldade, obstinação, feitiçaria, magia, cobiça e ausência do temor de Deus.


    Os que seguem esse caminho perseguem as pessoas de bem, odeiam a verdade, amam a mentira, não reconhecem a recompensa da justiça, não se apegam ao bem nem ao julgamento justo, não dão atenção à viúva e ao órfão e permanecem vigilantes não para temer a Deus, mas para praticar o mal. Deles, a mansidão e a paciência mantêm-se muito distantes. Amam coisas vãs, correm atrás de recompensa, não se compadecem do pobre nem trabalham em favor de quem está oprimido pelo trabalho; estão sempre prontos a caluniar e não reconhecem aquele que os criou. Matam crianças, corrompem as criaturas de Deus, viram as costas ao necessitado, oprimem o aflito, defendem os ricos, julgam injustamente os pobres e são pecadores em todas as coisas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “do Negro” ou “daquele que é negro”, isto é, uma figura caracterizada pela escuridão moral. “Sombrio” evita uma leitura racial imprópria no português atual.
    reason: A metáfora antiga pode produzir uma conotação racial inexistente ou indevida para leitores modernos.
  - marker: b
    text: A expressão também pode ser entendida como “altivez do poder”. O testemunho inglês fornecido traz a forma incomum “exhalation of power”; a tradução aqui é provisória até uma revisão integral dos testemunhos gregos e latinos.
    reason: Há incerteza no testemunho de consulta e a expressão exige verificação direta nas fontes antigas.
lexical_decisions:
- source_word: the Black One (τοῦ μέλανος, conforme a tradição grega associada)
  choice: o Sombrio
  rationale: Mantém a imagem moral de escuridão aplicada ao agente do caminho mau, sem a conotação racial que “o Negro” teria no português atual.
- source_word: crooked
  choice: tortuoso
  rationale: Preserva a metáfora de um caminho moral desviado e irregular.
- source_word: boldness
  choice: insolência
  rationale: No catálogo de vícios, expressa atrevimento arrogante, não coragem positiva.
- source_word: exhalation/exaltation of power
  choice: exaltação do poder
  rationale: O testemunho inglês fornecido traz a expressão incomum “exhalation of power”, mas a evidência grega tradicionalmente associada aponta para a ideia de elevação ou altivez do poder; a tradução conserva essa formulação sem interpretá-la como uma doutrina específica.
- source_word: doubleness of heart
  choice: duplicidade de coração
  rationale: Preserva a imagem antropológica e moral antiga, em linguagem inteligível.
- source_word: wakeful
  choice: permanecem vigilantes
  rationale: Mantém o contraste retórico entre vigilância para Deus e dedicação alerta ao mal.
- source_word: forbearance
  choice: paciência
  rationale: Termo corrente que comunica tolerância perseverante e domínio diante da provocação.
- source_word: creatures of God
  choice: criaturas de Deus
  rationale: Retém a amplitude e a ambiguidade do referente, sem restringi-lo indevidamente a pessoas, filhos ou criação em geral.
theological_decisions:
- issue: Identidade do “Sombrio”
  choice: Manter o epíteto sem acrescentar “Diabo” ou “Satanás” ao texto
  alternative: Traduzir interpretativamente como “o Diabo”
  rationale: O epíteto provavelmente designa o poder pessoal do mal, mas a tradução preserva a forma figurada e a tensão do texto.
- issue: “morte eterna acompanhada de castigo”
  choice: Manter morte e castigo como elementos associados, sem definir sua relação metafísica
  alternative: Explicitar “castigo consciente eterno” ou fundir castigo e morte numa única noção
  rationale: A redação fornecida afirma morte eterna com castigo, mas não resolve neste ponto a natureza exata desse castigo.
- issue: “não reconhecem aquele que os criou”
  choice: Usar inicial minúscula no pronome e preservar a referência descritiva
  alternative: Empregar “Aquele” com maiúscula devocional
  rationale: A referência a Deus é clara pelo contexto; a minúscula segue o uso moderno sem diminuir o conteúdo teológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O longo catálogo foi pontuado e parcialmente desdobrado em frases para clareza, sem alterar sua progressão moral. A redação é provisória porque o material fornecido declara que a revisão direta do grego e do latim ainda está pendente.
