review_pass:
  verdict: revise
  source_fidelity: A tradução acompanha de perto o catálogo de vícios e preserva adequadamente a imagem do caminho da morte eterna e do castigo. Contudo, «exaltação do poder» é menos preciso para a expressão tradicionalmente associada a ὕψος δυνάμεως, que designa elevação/altivez ligada ao poder, não necessariamente o ato de exaltar o poder. Além disso, «para praticar o mal» explicita além do necessário o conciso «para o mal».
  naturalness: O português é claro, moderno e de registro apropriado. O longo período foi bem organizado em frases sem perda relevante do encadeamento. Os pequenos ajustes propostos melhoram a precisão sem sacrificar a legibilidade.
  terminology: «Sombrio» mantém o epíteto sem racializá-lo e sem identificar interpretativamente a figura como Diabo ou Satanás. «Insolência», «duplicidade de coração», «temor de Deus», «mansidão» e «paciência» são escolhas adequadas. «Altivez do poder» é preferível a «exaltação do poder» neste catálogo de vícios.
  issues:
  - severity: medium
    issue: «exaltação do poder» para a expressão associada a ὕψος δυνάμεως
    rationale: «Exaltação» pode sugerir louvor ou glorificação do poder. «Altivez do poder» conserva melhor a noção de elevação arrogante, mantendo a concisão e a ambiguidade do catálogo.
  - severity: low
    issue: «mas para praticar o mal»
    rationale: 'A formulação torna explícita uma ação que o texto apresenta de modo mais elíptico: vigilantes «para o mal». «Mas para o mal» preserva melhor a amplitude da expressão.'
  revised_text: 'Mas o caminho do Sombrio[a] é tortuoso e cheio de maldição. É o caminho da morte eterna acompanhada de castigo; nele estão as coisas que destroem as almas das pessoas: idolatria, insolência, altivez do poder[b], hipocrisia, duplicidade de coração, adultério, homicídio, saque, orgulho, transgressão, traição, maldade, obstinação, feitiçaria, magia, cobiça e ausência do temor de Deus.


    Os que seguem esse caminho perseguem as pessoas de bem, odeiam a verdade, amam a mentira, não reconhecem a recompensa da justiça, não se apegam ao bem nem ao julgamento justo, não dão atenção à viúva e ao órfão e permanecem vigilantes não por temor de Deus, mas para o mal. Deles, a mansidão e a paciência mantêm-se muito distantes. Amam coisas vãs, correm atrás de recompensa, não se compadecem do pobre nem trabalham em favor de quem está oprimido pelo trabalho; estão sempre prontos a caluniar e não reconhecem aquele que os criou. Matam crianças, corrompem as criaturas de Deus, viram as costas ao necessitado, oprimem o aflito, defendem os ricos, julgam injustamente os pobres e são pecadores em todas as coisas.'
  revised_footnotes:
  - marker: a
    text: Literalmente, “do Negro” ou “daquele que é negro”; trata-se de um epíteto antigo associado à escuridão moral. “Sombrio” evita uma leitura racial imprópria no português atual.
    reason: Preserva a função figurada do epíteto sem acrescentar uma identificação interpretativa da personagem.
  - marker: b
