    reason: O ponto é lexicalmente incerto no testemunho inglês de consulta; a nota explicita a provisoriedade sem escolher uma interpretação doutrinária.
  revision_rationale: 'Foram feitas apenas correções seguras: «altivez do poder» evita a sugestão de glorificação presente em «exaltação do poder», e «mas para o mal» deixa de explicitar indevidamente o sentido elíptico do original. Também se ajustou «a alma» para «as almas», refletindo melhor o plural possessivo do testemunho. As notas foram atualizadas para refletir a incerteza textual e lexical declarada no material fornecido.'
