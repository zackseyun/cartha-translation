base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: pt
  text: 'Portanto, é bom aprender os preceitos do Senhor, todos os que foram escritos acima, e andar neles. Pois quem pratica essas coisas será glorificado no reino de Deus; mas quem escolhe o que lhes é contrário perecerá juntamente com suas obras. É para isso que há ressurreição; é para isso que há retribuição.


    Peço aos que entre vocês ocupam posição mais elevada: se estiverem dispostos a aceitar de mim um bom conselho, mantenham entre vocês aqueles a quem possam fazer o bem. Não deixem de fazê-lo.


    Está próximo o dia em que tudo será destruído juntamente com o Maligno. O Senhor está próximo, e com ele a sua recompensa.[a]


    Peço-lhes repetidas vezes: sejam bons legisladores uns para os outros; continuem sendo conselheiros fiéis de vocês mesmos; eliminem do meio de vocês toda hipocrisia.


    E que Deus, o Senhor do mundo inteiro, lhes dê sabedoria, discernimento, instrução, conhecimento de seus preceitos e perseverança.


    Deixem-se ensinar por Deus, procurando com diligência saber o que o Senhor requer de vocês, e ajam de modo que sejam achados no dia do juízo.[b]


    Mas, se vocês guardam alguma lembrança do bem, lembrem-se de mim ao praticarem essas coisas, para que tanto o meu desejo como a minha vigilância produzam algum bom resultado. Peço-lhes isso como um favor.[c]


    Enquanto esse bom vaso estiver com vocês, não deixem de cumprir nenhuma dessas coisas; antes, investiguem-nas constantemente e cumpram todo mandamento, pois eles são dignos disso.[d]


    Por essa razão, empenhei-me ainda mais em escrever-lhes, na medida do que me foi possível, para lhes dar alegria. Passem bem, filhos do amor e da paz. O Senhor da glória e de toda graça esteja com o espírito de vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O Senhor está próximo, bem como a sua recompensa”. A expressão pode indicar a recompensa que ele traz ou concede.'
    reason: Preserva a concisão e a ambiguidade do possessivo no testemunho.
  - marker: b
    text: O texto não especifica em que condição eles deverão ser “achados” no dia do juízo.
    reason: Evita completar a frase com ideias como “fiéis”, “justos” ou “irrepreensíveis” sem apoio no testemunho fornecido.
  - marker: c
    text: Alguns testemunhos ou traduções repetem “essas coisas” nesta frase. A repetição parece ser acidental e não foi mantida no texto principal.
    reason: O inglês fornecido contém duplicação, mas a redação contínua e natural indica provável erro de transmissão ou reprodução.
  - marker: d
    text: “Vaso” é uma metáfora para a vida corporal; o referente exato de “eles são dignos disso” é incerto no testemunho disponível.
    reason: Registra tanto a explicação tradicional da metáfora quanto a obscuridade da oração final, sem resolvê-la dogmaticamente.
lexical_decisions:
- source_word: ordinances
  choice: preceitos
  rationale: Expressa normas ou determinações do Senhor em português atual e digno, sem restringir o termo a decretos civis nem identificá-lo automaticamente com a Lei mosaica.
- source_word: walk in them
  choice: andar neles
  rationale: Preserva a metáfora ética tradicional do testemunho, ainda inteligível em contexto religioso, em vez de reduzi-la simplesmente a 'obedecer'.
- source_word: recompense / reward
  choice: retribuição / recompensa
  rationale: Mantém a linguagem de resposta divina às obras e também a variação do testemunho, sem decidir antecipadamente se a retribuição é exclusivamente positiva ou negativa.
- source_word: Evil One
  choice: Maligno
  rationale: Conserva a referência pessoal sugerida pelo título com artigo e inicial maiúscula, sem inserir o nome 'Diabo'.
- source_word: judgment
  choice: discernimento
  rationale: No catálogo de dons, 'discernimento' comunica capacidade de avaliar bem e evita confusão imediata com o posterior 'dia do juízo'.
- source_word: learning
  choice: instrução
  rationale: É natural em português e denota formação recebida, distinguindo-se de sabedoria, discernimento e conhecimento.
- source_word: patience
  choice: perseverança
  rationale: No contexto exortativo, comunica constância resistente melhor que a possível leitura moderna de mera tolerância a incômodos.
- source_word: good vessel
  choice: esse bom vaso
  rationale: Preserva a metáfora corporal do testemunho sem incorporar ao texto principal a explicação editorial '(do corpo)'.
- source_word: children of love and peace
  choice: filhos do amor e da paz
  rationale: Mantém a forma afetiva e comunitária da despedida, sem substituir 'filhos' por um termo genericamente fraterno.
theological_decisions:
- issue: Relação entre obras, glorificação, perdição, ressurreição e retribuição
  choice: Preservar as afirmações em sua sequência direta, sem explicar o mecanismo soteriológico.
  alternative: Reformular como prova de fé, mérito, condenação jurídica ou graus de recompensa.
  rationale: O testemunho relaciona conduta e destino escatológico, mas não define nessa passagem como essa relação deve ser sistematizada.
- issue: Sentido de 'a sua recompensa'
  choice: Manter o possessivo ligado ao Senhor e registrar a ambiguidade em nota.
  alternative: Traduzir explicitamente como 'a recompensa que ele dará' ou 'a recompensa dele'.
  rationale: A expressão pode evocar a recompensa trazida ou concedida pelo Senhor, e a formulação concisa preserva a tensão.
- issue: Ser 'achado' no dia do juízo
  choice: Conservar a voz passiva e não acrescentar um predicativo.
  alternative: Traduzir 'achados irrepreensíveis', 'justos' ou 'fiéis'.
  rationale: O testemunho fornecido não declara em que condição serão achados; completar a ideia importaria conteúdo interpretativo.
- issue: Referente de 'eles são dignos disso'
  choice: Manter a formulação próxima e explicar a incerteza em nota.
  alternative: Resolver como 'os mandamentos merecem ser cumpridos' ou como 'vocês são dignos deles'.
  rationale: A construção do testemunho é obscura, e uma resolução silenciosa eliminaria uma ambiguidade textual real.
- issue: Espírito na bênção final
  choice: Usar inicial minúscula em 'espírito de vocês'.
  alternative: Entender como referência direta ao Espírito Santo.
  rationale: A sintaxe da bênção aponta naturalmente para o espírito dos destinatários; não se deve introduzir uma identificação trinitária que o texto não explicita.
translation_notes:
  register: Português moderno, amplamente internacional, com boa legibilidade brasileira. O tratamento plural usa “vocês”, evitando regionalismos marcados. O tom é exortativo e digno, mas sem arcaísmos desnecessários. Como a revisão direta do grego e do latim ainda está pendente, a redação é explicitamente conservadora diante de construções obscuras do testemunho inglês público.
