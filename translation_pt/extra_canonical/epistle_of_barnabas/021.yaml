  terminology: “Preceitos”, “Maligno”, “discernimento”, “dia do juízo” e “filhos do amor e da paz” são escolhas adequadas. “Vaso” deve conservar o esclarecimento parentético do testemunho, sem impor interpretação além de “do corpo”.
  issues:
  - severity: medium
    issue: A repetição “essas coisas, essas coisas” foi retirada do texto principal.
    rationale: O testemunho inglês fornecido a contém duas vezes, e a revisão direta dos testemunhos grego/latino está explicitamente pendente. Não é seguro emendar o texto nem afirmar que a duplicação seja acidental com base apenas nesses dados.
  - severity: medium
    issue: O aposto “(do corpo)” foi omitido após “bom vaso”.
    rationale: O aposto pertence ao testemunho-base e deve ser mantido no texto, ou sua omissão exigiria confirmação textual não disponibilizada.
  - severity: low
    issue: A nota c atribui a repetição a “alguns testemunhos ou traduções” e sugere acidente de transmissão.
    rationale: A documentação disponibilizada só estabelece a repetição no testemunho inglês-base; não fundamenta uma afirmação sobre outros testemunhos nem uma avaliação de erro.
  - severity: low
    issue: “Não deixem de cumprir nenhuma dessas coisas” antecipa o verbo posterior “cumpram” e estreita “be lacking in none”.
    rationale: “Não careçam de nenhuma destas coisas” conserva melhor a distinção entre não lhes faltar tais qualidades/instruções e buscar/cumprir os mandamentos.
  revised_text: 'Portanto, é bom aprender os preceitos do Senhor, todos os que foram escritos acima, e andar neles. Pois quem pratica essas coisas será glorificado no reino de Deus; mas quem escolhe o que lhes é contrário perecerá juntamente com suas obras. É para isso que há ressurreição; é para isso que há retribuição.


