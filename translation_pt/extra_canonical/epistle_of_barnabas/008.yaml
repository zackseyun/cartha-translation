review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a estrutura argumentativa, a alternância «novilha/bezerro», a tensão entre doze e três crianças e as formulações cristológicas abruptas do testemunho inglês. Contudo, «jovens» interpreta e restringe indevidamente children, e «aspereza repugnante» acrescenta uma noção física que o testemunho fornecido não exprime para foulness.
  naturalness: O português é em geral claro e de registro apropriado. «Crianças» é mais fiel, embora mantenha a estranheza deliberada do texto ritual; «cada pessoa do povo» torna explícito o valor distributivo de one by one.
  terminology: «Figura», «novilha», «bezerro», «madeiro», «lã escarlate», «hissopo» e «evangelho» são escolhas adequadas. «Imundície do hissopo» conserva, sem explicação interpretativa no corpo do texto, a expressão deliberadamente anômala do testemunho.
  issues:
  - severity: medium
    issue: «children» foi traduzido por «jovens» em todas as ocorrências.
    rationale: O testemunho inglês diz children e não permite fixar que sejam jovens. «Jovens» evita uma estranheza ritual, mas introduz uma determinação etária não fornecida pela base disponível.
  - severity: medium
    issue: «aspereza repugnante do hissopo» expande «the foulness of the hyssop».
    rationale: «Aspereza» não corresponde a nenhum elemento do testemunho inglês e transforma uma expressão obscura em explicação botânica. É preferível conservar a dificuldade com «imundície do hissopo» e anotá-la.
  - severity: low
    issue: «asperjam o povo, um por um» deixa algo ambíguo quem é considerado individualmente.
    rationale: O inglês one by one qualifica a aplicação aos membros do povo; «aspergissem cada pessoa do povo» comunica melhor o sentido distributivo sem alterar o conteúdo.
  revised_text: 'Mas o que vocês pensam que significa a figura em que se dá a Israel a ordem de que aqueles homens cujos pecados chegaram à plenitude ofereçam uma novilha, a matem e a queimem; e depois que as crianças recolham as cinzas, coloquem-nas em recipientes e prendam a lã escarlate a um madeiro — vejam, aqui novamente estão a figura da cruz e a lã escarlate — e o hissopo; e que, feito isso, as crianças aspergissem cada pessoa do povo, para que fossem purificadas de seus pecados?


    Entendam com que clareza isso lhes é dito: o bezerro[a] é Jesus; os homens que o oferecem, sendo pecadores, são aqueles que o levaram para ser morto. Depois disso, já não são homens que o oferecem; a glória já não é para os pecadores.[b]


    As crianças que aspergem são aquelas que nos anunciaram o perdão dos pecados e a purificação do nosso coração. A elas, que eram doze em número, como testemunho para as tribos — pois há doze tribos de Israel —, ele deu autoridade sobre o evangelho, para que o anunciassem.


    Mas por que as crianças que aspergem são três em número? Como testemunho para Abraão, Isaque e Jacó, porque estes são poderosos diante de Deus.[c]


    Depois há a colocação da lã sobre o madeiro. Isso significa que o reino de Jesus está na cruz e que aqueles que põem nele a sua esperança viverão para sempre.[d]


    E por que estão a lã e o hissopo ao mesmo tempo? Porque em seu reino haverá dias maus e repugnantes, nos quais seremos salvos; pois quem sofre dor na carne é curado pela imundície do hissopo.[e]


    Para nós, de fato, é evidente que essas coisas aconteceram por esse motivo; para eles, porém, eram obscuras, porque não ouviram a voz do Senhor.'
