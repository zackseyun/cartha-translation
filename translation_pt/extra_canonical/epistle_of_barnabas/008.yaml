review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência argumentativa, as oscilações «novilha/bezerro» e «doze/três», e a linguagem tipológica do testemunho inglês. Contudo, «jovens» restringe sem apoio o sentido de children, e «aspereza repugnante» introduz uma característica física não expressa pelo testemunho, que fala de «foulness». A formulação referente à lã e ao hissopo também pode refletir mais de perto a construção cumulativa e estranha do texto.
  naturalness: O registro é geralmente claro e moderno. Há, porém, um problema de modo verbal em «que ... os jovens aspergem», pois a construção requer subjuntivo («aspergissem»). «O povo, um por um» soa pouco natural; «o povo, um a um» comunica melhor a distribuição individual. A revisão conserva o caráter por vezes abrupto do autor sem criar aspereza portuguesa desnecessária.
  terminology: «Figura», «novilha», «bezerro», «lã escarlate», «hissopo», «evangelho» e «madeiro» são escolhas defensáveis. «Crianças» é a opção mais fiel para children, sem pretender fixar uma faixa etária. Para foulness, «caráter repugnante» preserva a avaliação negativa sem impor a noção de aspereza.
  issues:
  - severity: medium
    issue: «Jovens» traduz children de modo restritivo.
    rationale: O testemunho disponível diz repetidamente children, sem fornecer base para especificar que se tratavam de jovens. «Crianças» conserva a designação textual e sua possível estranheza ritual.
  - severity: medium
    issue: «Aspereza repugnante do hissopo» acrescenta um traço físico interpretativo.
    rationale: O testemunho apenas apresenta a expressão obscura «foulness of the hyssop». «Aspereza» não é exigida pelo texto fornecido; uma formulação mais geral preserva a dificuldade.
  - severity: low
    issue: «Que ... os jovens aspergem» está em modo verbal inadequado.
    rationale: 'Após «que», nesta oração dependente de mandamento, o português pede subjuntivo: «aspergissem».'
  - severity: low
    issue: «O povo, um por um» é pouco idiomático.
    rationale: «Um a um» expressa de modo mais natural que a aspersão alcança as pessoas individualmente.
  revised_text: 'Mas o que vocês pensam que significa a figura na qual se ordena a Israel que aqueles homens cujos pecados chegaram à plenitude ofereçam uma novilha, a matem e a queimem; e depois que as crianças recolham as cinzas, coloquem-nas em recipientes e enrolem a lã escarlate em torno de um madeiro — vejam: aqui novamente estão a figura da cruz e a lã escarlate — com o hissopo; e que, feito isso, as crianças aspergissem o povo, um a um, para que fossem purificados de seus pecados?


    Entendam como isso lhes é dito com toda clareza: o bezerro[a] é Jesus; os homens que o oferecem, sendo pecadores, são aqueles que o ofereceram para ser morto. Depois disso, não há mais homens que o ofereçam; a glória não é mais para pecadores.[b]


    As crianças que aspergem são aquelas que nos anunciaram o perdão dos pecados e a purificação de nossos corações; àquelas que eram doze, como testemunho para as tribos — pois há doze tribos de Israel —, ele deu autoridade sobre o evangelho, para que o anunciassem.


    Mas por que as crianças que aspergem são três? Como testemunho para Abraão, Isaque e Jacó, porque estes são poderosos diante de Deus.[c]


    Depois há a colocação da lã sobre o madeiro. Isso significa que o reino de Jesus está na cruz e que aqueles que nele põem sua esperança viverão para sempre.[d]


    E por que há a lã e o hissopo ao mesmo tempo? Porque, em seu reino, haverá dias maus e repugnantes, nos quais seremos salvos; pois quem sofre dor na carne é curado pelo caráter repugnante do hissopo.[e]


    Para nós, de fato, é evidente que essas coisas aconteceram por esse motivo; para eles, porém, eram obscuras, porque não ouviram a voz do Senhor.'
