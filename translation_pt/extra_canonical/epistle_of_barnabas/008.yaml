base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: pt
  text: 'Mas, na opinião de vocês, o que significa a figura em que se ordena a Israel que aqueles homens cujos pecados chegaram à plenitude ofereçam uma novilha, a matem e a queimem; depois, que os jovens recolham as cinzas e as coloquem em recipientes, prendam a lã escarlate a um madeiro — vejam: aqui novamente estão a figura da cruz e a lã escarlate — junto com o hissopo; e que, feito isso, os jovens asperjam o povo, um por um, para que sejam purificados de seus pecados?


    Entendam com que clareza isso é dito a vocês: o bezerro[a] é Jesus; os homens que o oferecem, por serem pecadores, são aqueles que o entregaram para ser morto. Depois disso, já não são homens que o oferecem; a glória já não pertence aos pecadores.[b]


    Os jovens que aspergem são aqueles que nos anunciaram o perdão dos pecados e a purificação do nosso coração. A eles, que eram doze, como testemunho das tribos — pois são doze as tribos de Israel —, ele deu autoridade sobre o evangelho, para que o anunciassem.


    Mas por que os jovens que aspergem são três? Como testemunho de Abraão, Isaque e Jacó, porque eles são poderosos diante de Deus.[c]


    Há, então, a colocação da lã sobre o madeiro. Isso significa que o reino de Jesus está na cruz e que aqueles que nele põem a esperança viverão para sempre.[d]


    E por que a lã e o hissopo aparecem juntos? Porque em seu reino haverá dias maus e repugnantes, nos quais seremos salvos; pois quem sofre dor na carne é curado por meio da aspereza repugnante do hissopo.[e]


    Para nós, de fato, é evidente que essas coisas aconteceram por esse motivo; para eles, porém, eram obscuras, porque não ouviram a voz do Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho primeiro menciona uma “novilha” e depois a chama de “bezerro”; a mudança foi preservada conforme o testemunho disponível.
    reason: Registrar uma oscilação lexical relevante sem harmonização silenciosa.
  - marker: b
    text: A redação desta frase é abrupta e seu sentido exato é incerto no testemunho disponível; a tradução conserva essa dificuldade.
    reason: Sinalizar genuína obscuridade textual e interpretativa.
  - marker: c
    text: O parágrafo anterior fala de doze jovens; aqui o texto fala de três. As duas referências foram mantidas.
    reason: Preservar a tensão interna do texto.
  - marker: d
    text: “O reino de Jesus está na cruz” também poderia ser entendido como uma afirmação de que seu reino se manifesta ou se estabelece por meio da cruz; a construção foi mantida sem resolver essa relação.
    reason: Preservar ambiguidade teológica.
  - marker: e
    text: A expressão relativa ao hissopo é incomum e pode aludir às características ásperas ou desagradáveis da planta. A formulação permanece provisória até a revisão direta dos testemunhos gregos e latinos.
    reason: Explicar uma expressão obscura e a limitação da base documental fornecida.
lexical_decisions:
- source_word: type
  choice: figura
  rationale: “Figura” comunica ao leitor comum a correspondência simbólica pretendida, sem impor o tecnicismo “tipo”; a referência à cruz permanece explícita no contexto.
- source_word: heifer / calf
  choice: novilha / bezerro
  rationale: Preserva a mudança lexical do testemunho fornecido, em vez de harmonizá-la silenciosamente.
- source_word: children
  choice: jovens
  rationale: No contexto ritual, “jovens” soa mais natural que “crianças” e evita sugerir necessariamente crianças pequenas, embora a idade exata permaneça incerta sem revisão direta do grego/latim.
- source_word: tree
  choice: madeiro
  rationale: Mantém o campo semântico de madeira/árvore e torna natural a alusão à cruz, sem traduzir diretamente como “cruz” antes da explicação do autor.
- source_word: scarlet wool
  choice: lã escarlate
  rationale: Tradução direta e tradicional da expressão ritual, preservando a cor e o material.
- source_word: hyssop
  choice: hissopo
  rationale: Nome corrente da planta ritual bíblica em português.
- source_word: foulness
  choice: aspereza repugnante
  rationale: Conserva a avaliação negativa e a associação física do hissopo sugeridas pelo testemunho, sem suavizar o raciocínio incomum do autor.
- source_word: authority over the Gospel
  choice: autoridade sobre o evangelho
  rationale: Mantém a construção do testemunho e sua possível amplitude, sem reduzi-la a mera permissão para pregar.
theological_decisions:
- issue: Identificação cristológica do sacrifício ritual
  choice: “o bezerro é Jesus”
  alternative: “o bezerro representa Jesus”
  rationale: A formulação copulativa preserva a força tipológica do autor e não a enfraquece por paráfrase.
- issue: O reino de Jesus “está na cruz”
  choice: Preservar literalmente a afirmação
  alternative: Interpretar como “é estabelecido por meio da cruz” ou “se manifesta na cruz”
  rationale: A expressão é teologicamente densa e ambígua; a tradução não deve decidir silenciosamente como cruz e reino se relacionam.
- issue: Referência aos ofertantes pecadores
  choice: Manter a identificação com os que entregaram Jesus para a morte
  alternative: Especificar um grupo histórico ou religioso
  rationale: O texto não autoriza importar uma identificação denominacional ou étnica mais precisa.
- issue: Os patriarcas são “poderosos diante de Deus”
  choice: poderosos diante de Deus
  alternative: estimados por Deus / têm poder junto de Deus
  rationale: A formulação conserva a tensão da afirmação sem definir se se trata de honra, influência ou intercessão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Empregou-se “vocês” em vez de formas arcaicas. O texto é necessariamente provisório, pois a base fornecida é uma testemunha inglesa de domínio público e a revisão direta do grego/latim ainda está pendente. As construções abruptas, a alternância novilha/bezerro e a discrepância entre doze e três foram preservadas e anotadas.
