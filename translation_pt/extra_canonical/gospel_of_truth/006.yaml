  terminology: “Julgamento”, “Palavra”, “vasos”, “Erro”, “Conhecimento”, “Verdade”, “Pai” e “Espírito Santo” mantêm tanto o vocabulário imagético quanto os conceitos técnicos do trecho. A personificação por maiúsculas é consistente. “Tomou corpo” conserva a força de ⲣⲟⲩⲥⲱⲙⲁ sem impor a formulação dogmática “encarnou-se”.
