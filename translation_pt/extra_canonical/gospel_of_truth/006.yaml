  consult_excerpt: 'It’s like some who’ve left their home, having jars that weren’t any good in places. They broke them, but the master of the house doesn’t suffer any loss. Instead he rejoices, because in place of the bad jars are ones that are full and complete. For this is 26 the judgment that’s come from above; it’s judged everyone. It’s a drawn, two-edged sword which cuts both ways. The Word, which is in the hearts of those who speak it, appeared. It isn’t just a sound, but it was incarnated (embodied).

    A great disturbance arose among the jars, because some were empty, others filled; some provided for, others poured out; some purified, others broken. All the realms were shaken and disturbed, because they didn’t have order or stability. Error was anxious. It didn’t know what to do; it grieved, mourned, and hurt itself, because it knew nothing. The knowledge, which is its (Error’s) destruction, approached it (Error) and all that emanated from it. Error is empty, with nothing inside it.

    Truth came into their midst, and all that emanated knew it. They welcomed the Father in Truth with a complete power that joins them with the Father. Truth is the Father’s mouth; the Holy Spirit is his tongue. Everyone who loves the Truth and are joined to the 27 Truth are joined to the Father’s mouth. By his tongue they’ll receive the Holy Spirit. This is the revelation of the Father and his manifestation to his generations. He revealed what was hidden of himself; he explained it, because who has anything, if not the Father alone?'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/006.yaml
  text: 'For this is the judgment that came down from above[a]; it judged everyone. It is a sword, two‑edged, that cuts on both sides. The Word, which is in the hearts of those who speak it, appeared: it is not a mere sound, but it put on a body. A great disturbance arose among the jars: some were empty, and others were filled; some were provided for, and others poured out; some were purified, and others were broken. All the realms were shaken and agitated, for they had neither order nor stability.


    Error became anxious within itself; it did not know what it should do. It grieved and mourned and struck at itself, for it knew nothing. The Knowledge that is its undoing approached it—and all that had come forth from it—for Error is empty and has nothing within it.


    Truth came in their midst, and all who are from it knew it. They greeted the Father in Truth with a complete Power that joins them to the Father. Truth is the mouth of the Father; the Holy Spirit is his tongue. Whoever is joined to the mouth of the Father will receive the Holy Spirit by his tongue. This is the revelation of the Father and his manifestation to his generations: he revealed what of himself was hidden, he explained it—for who has anything[b], if not the Father alone?'
translation:
  language: pt
  text: 'Pois este é o julgamento que veio do alto; julgou a todos. É uma espada desembainhada, de dois gumes, que corta de ambos os lados. A Palavra, que está no coração daqueles que a proclamam, manifestou-se: não era apenas um som, mas tomou corpo.


    Uma grande perturbação surgiu entre os vasos: alguns estavam vazios, outros, cheios; alguns foram abastecidos, outros, derramados; alguns foram purificados, outros, quebrados.[a] Todos os domínios foram abalados e agitados, pois não tinham ordem nem estabilidade.


    O Erro ficou angustiado, sem saber o que fazer. Afligiu-se, lamentou-se e feriu a si mesmo, pois nada sabia. O Conhecimento, que é a destruição do Erro, aproximou-se dele e de tudo o que dele procedera. Pois o Erro é vazio e nada há dentro dele.


    A Verdade veio para o meio deles, e todos os que dela procediam a reconheceram. Eles acolheram o Pai na Verdade, com um poder completo que os une ao Pai. A Verdade é a boca do Pai; o Espírito Santo é a sua língua. Todo aquele que está unido à boca do Pai receberá o Espírito Santo por meio de sua língua.[b] Esta é a revelação do Pai e sua manifestação às suas gerações. Ele revelou aquilo que nele estava oculto e o explicou, pois quem possui alguma coisa, senão somente o Pai?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alguns termos desta série são incertos; também se pode entender: “alguns foram enchidos, outros, esvaziados; alguns foram preparados, outros, quebrados”.'
    reason: A sequência de estados dos vasos contém vocábulos de leitura e nuance contextual discutidas; a nota preserva a incerteza sem sobrecarregar o texto.
  - marker: b
    text: A expressão também pode ser entendida como “por meio da língua dele”, isto é, da língua do Pai; no contexto imediato, essa língua é identificada com o Espírito Santo.
    reason: O referente do possessivo deve permanecer ligado à metáfora precedente, sem eliminar sua tensão entre Pai e Espírito.
lexical_decisions:
- source_word: ⲡⲥⲁⲁⲧⲡⲉ
  choice: julgamento
  rationale: O contexto apresenta uma avaliação vinda do alto que alcança a todos; “julgamento” conserva o sentido judicial sem o reduzir a mera decisão.
- source_word: ⲙⲫⲟⲥⲛⲉⲩ
  choice: de dois gumes
  rationale: A expressão qualifica a espada e é esclarecida pela frase paralela “corta de ambos os lados”.
- source_word: ⲡⲓⲱⲉ / λόγος (contraste contextual)
  choice: som / Palavra
  rationale: Mantém o contraste entre um ruído ou som meramente audível e a Palavra dotada de presença efetiva.
- source_word: ⲣⲟⲩⲥⲱⲙⲁ
  choice: tomou corpo
  rationale: Reproduz de modo natural a expressão de corporificação, sem impor uma formulação dogmática posterior.
- source_word: ⲥⲕⲉⲩⲟⲥ
  choice: vasos
  rationale: O termo designa recipientes ou utensílios; “vasos” preserva a imagem doméstica e admite os estados de estar cheio, vazio, purificado ou quebrado.
- source_word: ⲧⲡⲗⲁⲛⲏ
  choice: o Erro
  rationale: 'A inicial maiúscula e o artigo tornam perceptível a personificação: o Erro se angustia, lamenta e é destruído pelo Conhecimento.'
- source_word: ⲡⲓⲥⲁⲩⲛⲉ
  choice: o Conhecimento
  rationale: Conserva a oposição conceitual e personificada entre Conhecimento e Erro, sem inserir o termo técnico grego no corpo do texto.
- source_word: ⲧⲙⲛⲧⲙⲏⲉ
  choice: a Verdade
  rationale: A Verdade atua como realidade personificada e é identificada metaforicamente com a boca do Pai.
- source_word: ⲥⲧⲁⲥⲓⲥ
  choice: estabilidade
  rationale: O empréstimo grego indica firmeza ou condição estável e forma um par natural com “ordem”.
theological_decisions:
- issue: Personificação do Erro
  choice: “o Erro”, como agente personificado
  alternative: “o engano” ou “a ilusão”, em sentido abstrato
  rationale: Os verbos de angústia, ignorância, lamento e autolesão exigem que a personificação permaneça visível.
- issue: Corporificação da Palavra
  choice: “tomou corpo”
  alternative: “encarnou-se” ou “tornou-se um corpo”
  rationale: A escolha mantém a força corporal da expressão, mas evita resolver além do texto a natureza precisa dessa corporificação.
- issue: Metáfora da boca e da língua
  choice: Manter literalmente a Verdade como boca do Pai e o Espírito Santo como sua língua
  alternative: Parafrasear como expressão e voz do Pai
  rationale: As imagens corporais estruturam o modo pelo qual revelação, união e recepção do Espírito são descritas.
- issue: Origem dos que reconhecem a Verdade
  choice: “todos os que dela procediam”
  alternative: “tudo o que dela procedia”
  rationale: O contexto permite referência pessoal ou coletiva; a formulação pessoal harmoniza-se com reconhecer e acolher sem transformar a procedência em doutrina sistemática.
