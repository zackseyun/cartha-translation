  terminology: '"Evangelho", "Pai", "Palavra", "Salvador" e "Pleroma" são escolhas consistentes e não denominacionais. A nota deve caracterizar Pleroma como termo técnico, em vez de identificá-lo simplesmente com "a Plenitude", para preservar sua função específica no escrito.'
