base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/001.yaml
  text: The Gospel of Truth is joy for those who have received grace from the Father of Truth[a], so that they might know him through the power of the Word that came forth from the Pleroma—the one who is in the thought and the mind of the Father. He is called “Savior”; that is the name of the work he will do to save those who had become ignorant of the Father. And the name “Gospel” is the revelation of hope, the discovery for those who seek him.
translation:
  language: pt
  text: O Evangelho da Verdade é alegria para os que receberam a graça do Pai da Verdade, para que pudessem conhecê-lo pelo poder da Palavra que veio do Pleroma[a] — aquela que está no pensamento e na mente do Pai. Ele é chamado “Salvador”; esse é o nome da obra que realizará para salvar os que haviam se tornado ignorantes do Pai. E o nome “Evangelho” é a revelação da esperança, a descoberta para os que o buscam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Termo grego que significa literalmente “plenitude”; neste escrito, é usado como termo técnico.
    reason: Explica o sentido lexical de Pleroma sem eliminar nem definir excessivamente sua função técnica no texto.
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: Evangelho
  rationale: O empréstimo grego funciona como termo teológico e, na frase final, como nome explicitamente discutido pelo autor; “Evangelho” preserva essa ressonância e a autorreferência.
- source_word: ⲧⲙⲏⲉ
  choice: verdade
  rationale: Equivalente direto e corrente do substantivo copta.
- source_word: ⲭⲁⲣⲓⲥ (empréstimo grego, reconstruído no trecho)
  choice: graça
  rationale: Mantém o sentido de favor ou dom recebido e se encaixa naturalmente na construção “a graça de conhecê-lo”.
- source_word: ⲡⲓⲱⲧ
  choice: Pai
  rationale: Preserva o título divino reiterado no texto.
- source_word: ⲧϭⲁⲙ
  choice: poder
  rationale: Expressa a eficácia pela qual o conhecimento se torna possível.
- source_word: ⲡⲓϣⲉϫⲉ / ⲡⲥⲁϫⲉ
  choice: Palavra
  rationale: O substantivo é apresentado como vindo do Pleroma e recebe referência pessoal; a inicial maiúscula sinaliza essa personificação sem substituir o termo por “Logos”.
- source_word: ⲡⲡⲗⲏⲣⲱⲙⲁ
  choice: Pleroma
  rationale: A transliteração preserva o termo técnico para a plenitude divina; a nota oferece o sentido lexical ao leitor comum.
- source_word: ⲛⲟⲩⲥ
  choice: mente
  rationale: Traduz de modo claro o empréstimo filosófico grego νοῦς e mantém a distinção do termo paralelo “pensamento”.
- source_word: ⲡⲥⲱⲧⲏⲣ
  choice: Salvador
  rationale: É o título tradicional e corresponde diretamente ao empréstimo grego σωτήρ.
- source_word: ⲡⲟⲩⲱⲛϩ ⲃⲁⲗ
  choice: revelação
  rationale: A expressão idiomática de abrir ou tornar manifesto, no contexto, indica a revelação da esperança.
- source_word: ⲕⲱⲧⲉ ⲛⲥⲱϥ
  choice: o buscam
  rationale: Forma concisa e natural que conserva a procura intencional expressa no copta.
- source_word: ⲡⲣⲁⲛ
  choice: o nome
  rationale: Traduz explicitamente “nome” e conserva o paralelo retórico entre “Salvador”, o nome da obra, e “Evangelho”.
theological_decisions:
- issue: Relação entre graça e conhecimento na abertura
  choice: “a graça de conhecê-lo”
  alternative: “graça [...], para que pudessem conhecê-lo”
  rationale: A construção genitiva tradicionalmente reconhecida no texto liga a graça ao ato de conhecer; a redação escolhida mantém essa relação sem desenvolver uma finalidade não exigida.
- issue: Personificação da Palavra
  choice: “Palavra” com inicial maiúscula
  alternative: “palavra” ou “Logos”
  rationale: A referência pessoal e sua procedência do Pleroma justificam a maiúscula, mas “Palavra” evita impor uma identificação dogmática mais precisa do que o trecho declara.
- issue: Tratamento de πλήρωμα
  choice: “Pleroma” com nota explicativa
  alternative: “Plenitude” no corpo do texto
  rationale: O empréstimo funciona como termo técnico no universo conceitual do escrito; a nota mantém a leitura acessível sem apagar esse caráter.
- issue: Obra do Salvador
  choice: “salvar os que haviam se tornado ignorantes do Pai”
  alternative: “redimir os que haviam se tornado ignorantes do Pai”
  rationale: “Salvar” estabelece o vínculo lexical e retórico com o título “Salvador”; o objeto da salvação continua sendo enunciado sem converter a ignorância em uma doutrina sistemática.
- issue: Sentido de “Evangelho” na frase final
  choice: “o nome ‘Evangelho’”
  alternative: “a palavra ‘Evangelho’”
  rationale: O copta lê ⲡⲣⲁⲛ, “nome”, e cria um paralelo deliberado com o nome “Salvador”; traduzir “palavra” ocultaria esse vínculo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe fluida e vocabulário teológico não denominacional. “Pai”, “Palavra”, “Salvador” e “Evangelho” recebem maiúscula por sua função titular ou pessoal no contexto; “verdade”, “pensamento”, “mente” e “esperança” permanecem substantivos comuns. A pontuação divide o período copta longo sem eliminar seus paralelos conceituais.
