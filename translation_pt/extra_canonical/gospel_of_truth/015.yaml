  consult_excerpt: 'Each one will speak about the place from which they came, and they’ll hurry to return again to the place where they received their restoration to receive from the place where they were, receiving a taste from that place and receiving nourishment, receiving growth.

    And their place of rest is their fullness. All that have emanated from the Father, then, are fullnesses, and the roots of all that have emanated from him are within the one who caused them all to grow. He gave them their destinies. Then each one was revealed, so that through their own thought […] for the place to which they send their thought is their root, which takes them up through all the heights, up to the Father. They embrace his head, which is rest for them, and they’re grasped, approaching him, as though to say that they receive his expression by means of kisses. But they’re not revealed 42 in this way, because they neither exalted themselves, nor wanted the Father’s glory, nor did they think of him as trivial or harsh or wrathful; but he’s without evil, unperturbed, and sweet. He knows every realm before they’ve come into existence, and he has no need to be instructed.

    This is the way of those who possess something of the immeasurable greatness from above, as they wait for the complete one alone, who’s a Mother for them. And they don’t go down to Hades, nor do they have envy or groaning, nor death within them, but they rest in the one who rests, not striving nor twisting around in the search for Truth. But they themselves are the Truth, and the Father is within them, and they’re in the Father, being complete. They’re undivided from the truly good one. They don’t need anything, but they rest, refreshed in the Spirit. And they’ll listen to their root. They’ll devote themselves to those things that they’ll find in their root and not suffer loss to their soul. This is the place of the blessed; this is their place.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/015.yaml
  text: 'But these are not revealed in this way[a].


    For they neither exalted themselves, nor did they diminish the Father’s glory, nor did they reckon him as small, nor as harsh, nor as wrathful; rather, he is without evil, unperturbed, and sweet. He knows everything before it comes to be, and he has no need to be instructed by anyone.


    This is the way of those who possess something of the immeasurable Greatness from above, as they await the Complete One alone, who is a Mother for them. And they do not go down to Hades, nor is there envy among them, nor groaning, nor death within them; rather, they rest in the One who rests—neither striving nor writhing in the search for the Truth. Instead, they themselves are the Truth, and the Father is within them, and they are in the Father, being complete, undivided from the truly Good One. They are not in want of anything, but they rest, refreshed in the Spirit. And they will listen to their root; they will devote themselves to the things in which they will find their root, and they will not suffer loss to their soul[c][b]. This is the place of the blessed—this is their place.'
translation:
  language: pt
  text: '**O lugar de descanso**


    Mas estes não são revelados dessa maneira.[a] Pois não exaltaram a si mesmos, nem diminuíram a glória do Pai, nem o consideraram pequeno, severo ou irado. Pelo contrário, ele é sem maldade, imperturbável e doce. Conhece todos os lugares antes que venham a existir e não precisa ser instruído.


    Esse é o modo daqueles que possuem, do alto, algo da Grandeza imensurável, enquanto aguardam somente aquele que é Completo,[b] que é uma Mãe para eles. Eles não descem,[c] nem há entre eles inveja, gemido ou morte. Em vez disso, descansam naquele que descansa, sem se afadigarem nem se contorcerem à procura da Verdade. Eles mesmos, porém, são a Verdade; o Pai está neles, e eles estão no Pai. São completos, inseparáveis daquele que é verdadeiramente Bom. Não carecem de coisa alguma; antes, repousam, revigorados no Espírito. E escutarão sua raiz; dedicarão sua atenção às coisas nas quais encontrarão sua raiz,[d] e não sofrerão perda de sua alma. Este é o lugar dos bem-aventurados; este é o lugar deles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase começa como continuação do período da página anterior do códice.
    reason: O início material da página preserva apenas a conclusão da construção verbal, e a nota alerta para a transição sem importar texto ausente para esta seção.
  - marker: b
    text: Também se pode traduzir por “aquele que é Perfeito”.
    reason: ϫⲏⲕ pode indicar tanto completude quanto perfeição.
  - marker: c
    text: Literalmente, “não vão para baixo”. No contexto, a descida pode aludir ao mundo dos mortos.
    reason: O copta exprime diretamente apenas o movimento descendente; a possível referência ao mundo dos mortos é contextual, não explícita.
  - marker: d
    text: 'A construção muda entre formas plurais e singulares: literalmente, “as coisas nas quais ele encontrará sua raiz”.'
    reason: Preserva-se em nota a oscilação gramatical do copta, sem tornar o corpo do texto artificial em português.
lexical_decisions:
- source_word: ϣⲱⲱⲧ
  choice: diminuíram
  rationale: O verbo significa cortar, reduzir, deixar faltar ou diminuir; aqui seu objeto é a glória do Pai. Evita-se a leitura errônea ‘desejar’.
- source_word: ⲥⲁϣ
  choice: severo
  rationale: Expressa dureza ou aspereza. ‘Severo’ é corrente e preserva o contraste com ‘doce’.
- source_word: ⲃⲁⲗⲕⲉ
  choice: irado
  rationale: O termo raro pertence ao campo da ira e contrasta com a descrição positiva que segue.
- source_word: ⲁⲧⲡⲉⲑⲁⲩ
  choice: sem maldade
  rationale: Preserva a forma privativa, sem converter a expressão em uma afirmação doutrinária mais específica como ‘sem pecado’.
- source_word: ⲁⲧϣⲧⲁⲣⲧⲣ
  choice: imperturbável
  rationale: Comunica ausência de agitação ou perturbação.
- source_word: ⲟⲩϩⲗⲟϭ
  choice: doce
  rationale: Mantém a imagem concreta do copta e seu contraste com severidade e ira, em vez de interpretá-la como ‘bondoso’ ou ‘gracioso’.
- source_word: ⲙⲛⲧⲛⲁϭ ⲛⲁⲧϣⲓⲧⲥ
  choice: Grandeza imensurável
  rationale: Reproduz a abstração ‘grandeza’ qualificada como sem medida; a inicial maiúscula indica seu emprego como realidade personificada ou técnica no tratado.
- source_word: ⲡⲉⲧϫⲏⲕ ⲁⲃⲁⲗ
  choice: somente aquele que é Completo
  rationale: ϫⲏⲕ enfatiza inteireza ou plenitude; ⲁⲃⲁⲗ é entendido contextualmente com valor exclusivo. A formulação portuguesa evita o pouco natural ‘o Completo’ sem apagar o título.
- source_word: ⲁϩⲣⲏⲓ
  choice: Hades
  rationale: No contexto, o movimento descendente aponta para o mundo dos mortos; ‘Hades’ evita associações posteriores específicas de ‘inferno’.
- source_word: ⲧⲙⲏⲉ
  choice: Verdade
