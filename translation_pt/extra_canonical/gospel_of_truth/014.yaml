  naturalness: 'O registro é adequado e legível. Foram suavizadas duas construções que soavam excessivamente literais: a dos ouvidos “cheios” e a oração sobre o Perfeito. As repetições deliberadas de “nome” foram mantidas.'
  terminology: “Pai”, “Filho”, “nome”, “inominável”, “inefável”, “indescritível”, “Profundidade” e “Pleroma” são escolhas consistentes. A nota sobre os éons foi ajustada para não apresentar como dado interpretativo a linguagem de “emanação”.
