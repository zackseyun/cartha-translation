  language: pt
  text: 'O nome do Pai é o Filho. Ele é aquele que primeiro deu um nome àquele que veio dele mesmo — sendo ele próprio — e o gerou como Filho. Deu-lhe o nome que era seu. Tudo o que está ao redor do Pai lhe pertence: o nome é seu, e o Filho é seu. Ele pode ser visto; o nome, porém, é invisível, porque somente ele é o mistério do Invisível, que chega aos ouvidos plenamente cheios dele por sua ação. De fato, o nome do Pai não é pronunciado, mas revelado por meio de um Filho. Assim, portanto, o nome é grande. Quem poderá pronunciar para ele um nome, o grande nome, senão somente aquele a quem o nome pertence e os filhos do nome — aqueles nos quais repousa o nome do Pai e que, por sua vez, repousam no nome dele? Visto que o Pai não foi gerado, somente ele o gerou para si como nome, antes de fazer surgir os éons[a], para que o nome do Pai estivesse sobre a cabeça deles como Senhor. Esse é o nome verdadeiro, confirmado em seu mandamento com pleno poder. Pois seu nome não provém de palavras nem
    do ato de nomear; antes, é invisível. Ele deu um nome somente a ele — àquele que existe. Pois quem não existe não tem nome para receber. Que nome dariam a quem não existe? Mas aquele que existe também existe com seu nome, e somente ele o conhece; e ele deu um nome somente a ele.


    Este é o Pai; seu nome é o Filho. Ele não o ocultou dentro de si; antes, ele existia. Somente o Filho deu um nome. O nome, portanto, pertence ao Pai, pois o nome do Pai é o Filho Amado. De onde, de fato, ele encontraria um nome, a não ser do Pai?


    Mas certamente alguém perguntará a seu próximo: “Quem dará um nome àquele que existia antes dele?”, como se os descendentes não recebessem nome daqueles que os geraram. Primeiro, portanto, convém considerarmos o que é o nome: é o nome verdadeiro, o nome que vem do Pai, pois é o nome próprio. Ele não recebeu o nome como algo emprestado, como acontece com os demais, segundo a forma em que cada um é produzido. Este é o nome próprio; não há outro que o tenha dado a ele. Antes, ele é inominável, inefável e indescritível, até que aquele que é Perfeito fale a respeito dele — ele, o único que tem poder para pronunciar seu nome e vê-lo.


    Quando lhe agradou que seu santo nome fosse seu Filho, ele deu o nome àquele que veio da Profundidade[b] e revelou seus segredos, sabendo que o Pai não tem inveja. Por isso, ele o fez vir, para que falasse sobre o Lugar e sobre o lugar de descanso de onde havia vindo, e para que glorificasse o Pleroma[c], a grandeza do nome dele e a doçura do Pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Éons: termo técnico para realidades ou ordens do âmbito divino; também pode ser traduzido por “eras”.'
    reason: Esclarece o termo cosmológico sem introduzir uma teoria específica de emanações.
  - marker: b
    text: “Profundidade” traduz o grego bathos, empregado aqui como designação da realidade divina insondável.
    reason: Explica o uso técnico e titular do termo.
  - marker: c
    text: Pleroma significa “plenitude” e, neste escrito, designa a plenitude do âmbito divino.
    reason: Torna compreensível o empréstimo técnico preservado na tradução.
lexical_decisions:
- source_word: ⲣⲉⲛ
  choice: nome
  rationale: Preserva o termo central do trecho e sua carga de identidade, pertença e revelação.
- source_word: ⲡⲓⲱⲧ / ⲡϣⲏⲣⲉ
  choice: Pai / Filho
  rationale: Mantém os títulos relacionais e o paralelismo explícito do copta.
- source_word: ⲟⲩⲁⲧⲛⲉⲩ
  choice: invisível
  rationale: Expressa naturalmente a formação privativa baseada no verbo “ver”.
- source_word: ⲙⲛⲧⲧⲁⲉⲓⲣⲉⲛ
  choice: ato de nomear
  rationale: Torna claro em português o substantivo abstrato e preserva seu contraste com “palavras”.
- source_word: ⲟⲩⲁⲧϯⲣⲉⲛ / ⲟⲩⲁⲧⲧⲉ / ⲟⲩⲁⲧⲙⲉⲉⲩⲉ
  choice: inominável / inefável / indescritível
  rationale: Reproduz a tríade apofática sem reduzir os três termos a uma única ideia.
- source_word: ⲃⲁⲑⲟⲥ
  choice: Profundidade
  rationale: Traduz o empréstimo grego e assinala com maiúscula seu emprego como realidade ou título cosmológico.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Pleroma
  rationale: Conserva o termo técnico para a plenitude divina e o explica em nota.
- source_word: ⲟⲩⲁⲧⲡⲉⲑⲁⲩ
  choice: não tem inveja
  rationale: Reproduz o sentido privativo ligado à inveja, sem substituí-lo por “maldade” ou “ciúme”.
- source_word: ⲛⲉϥⲡⲉⲑⲏⲡ
  choice: seus segredos
  rationale: Reflete literalmente as “coisas ocultas” e preserva a nuance de revelação do que estava escondido.
theological_decisions:
- issue: Identidade entre o nome do Pai e o Filho
  choice: “O nome do Pai é o Filho”
  alternative: “O nome do Pai é revelado como o Filho”
  rationale: A construção equativa é mantida sem transformar a identificação direta em mera manifestação.
- issue: Relação entre geração e nomeação
  choice: Manter as formulações paradoxais do texto sobre o Pai gerar o Filho “como nome” e dar-lhe o próprio nome
  alternative: Harmonizar a passagem em uma explicação sistemática da geração do Filho
  rationale: O texto combina identidade, geração, nomeação e revelação sem resolver plenamente a tensão entre elas.
- issue: Descrições apofáticas
  choice: “inominável, inefável e indescritível”
  alternative: “não pode ser nomeado, dito nem concebido”
  rationale: A tríade nominal preserva o registro teológico elevado e as distinções do original.
- issue: Termos cosmológicos
  choice: “éons”, “Profundidade” e “Pleroma”
  alternative: “eras”, “Abismo” e “plenitude”
  rationale: Os termos escolhidos preservam a especificidade cosmológica do escrito; notas breves evitam opacidade desnecessária.
- issue: Ausência de inveja no Pai
  choice: “o Pai não tem inveja”
  alternative: “o Pai não tem ciúme”
  rationale: “Inveja” corresponde melhor ao termo privativo e ao motivo da livre revelação dos segredos.
translation_notes:
  register: Português moderno, digno e de ampla legibilidade brasileira. A sintaxe foi suavizada onde necessário, mas foram preservadas as repetições de “nome”, as identificações abruptas e as tensões entre visibilidade, nomeação, geração e revelação. Os termos técnicos indispensáveis receberam notas breves.
