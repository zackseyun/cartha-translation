  consult_excerpt: 'What, then, did he want them to think of themselves? He wanted to them to think, “I’ve come into being like the shadows and phantoms of the night.” When the light shines on the terror which they received, they know that it’s nothing. In this way, they were ignorant of the Father, whom 29 they didn’t see. Since it was terror and disturbance and instability and doubt and division, many illusions were at work among them, and vain ignorance, like they were deep in sleep and found themselves in nightmares. Either they’re running somewhere, or unable to run away from someone; or they’re fighting, or being beaten; or they’ve fallen from heights, or fly through the air without wings. Sometimes, too, it’s like someone is killing them, even though no one’s chasing them; or they themselves are killing those around them, covered in their blood. Until those who are going through all these nightmares can wake up, they see nothing, because these things are nothing.

    That’s the way it is with those who’ve cast off ignorance like sleep. They don’t regard it as anything, nor do they regard its 30 other works as real, but they abandon them like a dream in the night. They value the knowledge of the Father like they value the light. The ignorant have acted like they’re asleep; those who’ve come to knowledge have acted like they’ve awakened. Good for the one who returns and awakens! Blessed is the one who’s opened the eyes of those who can’t see! The Holy Spirit hurried after them to revive them. Having given a hand to the one who lay on the ground, it set them up on their feet, because they hadn’t yet arisen. It gave them the knowledge of the Father and the revelation of the Son, because when they saw him and heard him, he granted them to taste him and to grasp the beloved Son.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/008.yaml
  text: 'What, then, did he want them to think? That they had come to be like a shadow and a phantasm of the night.


    When light falls upon the terror that they had received, it turns out to be nothing. In this way they were ignorant of the Father, whom they did not see. For it was terror and disturbance and instability and division and doubt; many empty illusions were at work among them, and vain nothingness—as if they were sunk in sleep and, in their dreams, found themselves in nightmares.


    Either they are running to some place, or they are unable to flee from someone; or they are fighting, or they are being beaten; or they fall from heights, or they fly through the air without wings. Sometimes also someone is killing them even though no one pursues them; or they themselves are killing those around them, and they are smeared with their blood. Until those who are going through all these things awaken, they see nothing—because these things are nothing.


    So it is with those who have cast off ignorance like sleep: they do not reckon it to be anything, nor do they reckon its other works to be real; rather, they abandon them like a dream of the night. They value the knowledge of the Father like the light. Those who were ignorant acted as if asleep; those who have come to know acted as if awake.


    Good is the one who returns and awakens![a] Blessed is the one who opens the eyes of the blind!


    The Spirit ran after them in order to make them live. Having given a hand to the one who lay on the ground, it set them on their feet, for they had not yet arisen. It granted them the knowledge of the Father and the revelation of the Son; for when they saw him and heard him, he allowed them to taste him and to grasp the beloved Son.'
translation:
  language: pt
  text: '**A parábola dos pesadelos**


    Que queria, então, que eles pensassem? Que tinham vindo a existir como uma sombra e um fantasma da noite.


    Quando a luz incide sobre o terror que haviam recebido, vê-se que ele nada é. Foi assim que permaneceram ignorantes a respeito do Pai, a quem não viram. Pois havia terror, perturbação, instabilidade, divisão e dúvida; muitas ilusões vazias agiam entre eles, bem como um nada vão — como se estivessem mergulhados no sono e, em seus sonhos, se vissem em meio a pesadelos.


    Ora correm para algum lugar, ora não conseguem fugir de alguém; ora lutam, ora são espancados; ora caem de lugares altos, ora voam pelo ar sem asas. Às vezes, também, alguém os mata, embora ninguém os persiga; ou eles mesmos matam os que estão ao seu redor e ficam manchados com o sangue deles. Até que despertem, os que passam por todas essas coisas nada veem, porque essas coisas nada são.


    Assim acontece com os que se livraram da ignorância como do sono: não a consideram coisa alguma, nem consideram reais as outras obras dela; pelo contrário, abandonam-nas como um sonho da noite. Dão ao conhecimento do Pai o mesmo valor que dão à luz. Os que eram ignorantes agiram como se estivessem dormindo; os que vieram a conhecer agiram como se estivessem acordados.


    Bom é aquele que retorna e desperta![a] Bem-aventurado aquele que abre os olhos dos cegos!


    O Espírito correu atrás deles para lhes dar vida. Deu a mão àquele que jazia no chão e o pôs de pé, pois ele ainda não se havia levantado. Concedeu-lhes o conhecimento do Pai e a revelação do Filho; pois, quando o viram e o ouviram, ele lhes permitiu saboreá-lo e apreender o Filho amado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Bem-aventurado é aquele que retorna e desperta!”'
    reason: Registra a leitura alternativa tradicional desta frase, embora o texto copta distinga aqui «bom» de «bem-aventurado» na frase seguinte.
lexical_decisions:
- source_word: ⲣⲡⲧⲉ
  choice: sombra
  rationale: Mantém a imagem de algo insubstancial e forma um par natural em português com “fantasma”.
- source_word: ⲱⲡⲧ
  choice: fantasma
  rationale: Preserva a ideia de uma aparição irreal sem reduzir o termo a uma simples imagem.
- source_word: ⲧⲣⲙⲣⲟⲩ
  choice: terror
  rationale: Conserva a intensidade do termo no catálogo de estados afetivos e mentais.
- source_word: ⲙⲛⲧⲁⲧⲧⲁⲕⲁⲣⲉⲓⲥ
  choice: perturbação
  rationale: Exprime desordem e agitação sem restringir indevidamente o sentido.
- source_word: ⲙⲛⲧϩⲏⲧ
  choice: instabilidade
  rationale: Comunica a falta de firmeza sugerida pelo contexto.
- source_word: ⲥⲛⲉⲩ
  choice: divisão
  rationale: Mantém tanto o sentido de separação quanto sua dimensão interior e comunitária.
- source_word: ⲡⲱϣⲉ
  choice: dúvida
  rationale: Adequa-se ao contexto epistemológico e à associação com divisão e ignorância.
- source_word: ⲙⲙⲛⲧⲁ
  choice: um nada vão
  rationale: Conserva, em linguagem compreensível, as nuances de não ser, vazio e inutilidade.
- source_word: ⲡϭⲁⲗ
  choice: sono
  rationale: Mantém a metáfora central que relaciona ignorância, sonho e despertar.
- source_word: ⲛⲉⲉⲓ
  choice: sonhos
  rationale: O contexto é o de sonhos comuns e pesadelos, não de visões proféticas.
- source_word: ⲥⲙⲙⲛⲧⲟⲩ
  choice: despertar
  rationale: Marca a passagem metafórica da ignorância para o conhecimento.
- source_word: ⲡⲓⲡⲛⲁ
  choice: o Espírito
  rationale: A atuação pessoal do referente favorece “Espírito”; não se acrescenta “Santo”, ausente da forma preservada neste trecho.
theological_decisions:
- issue: Identidade de ⲡⲓⲡⲛⲁ
  choice: “o Espírito”, sem acrescentar “Santo”
  alternative: “o espírito” ou “o sopro”
  rationale: As ações de perseguir, vivificar, erguer e conceder conhecimento apontam para um agente pessoal, mas a tradução evita explicitar uma qualificação não presente no texto desta passagem.
- issue: Terminologia do conhecimento do Pai
  choice: “conhecimento do Pai”
  alternative: “gnose do Pai”
  rationale: “Conhecimento” é acessível e traduz diretamente o conceito, sem importar terminologia técnica desnecessária; o contexto preserva seu caráter transformador e salvífico.
- issue: Contraste entre “bom” e “bem-aventurado”
  choice: “Bom é...” seguido de “Bem-aventurado...”
  alternative: Empregar “bem-aventurado” nas duas frases
  rationale: Preserva a distinção lexical do copta entre o qualificativo “bom” e o empréstimo grego que significa “bem-aventurado”.
- issue: Realidade das obras da ignorância
  choice: “não consideram reais as outras obras dela”
  alternative: “não consideram as outras obras coisa alguma”
  rationale: A formulação conserva a afirmação forte sobre a irrealidade dessas obras sem convertê-la numa tese metafísica mais definida do que o texto exige.
- issue: Pronomes na conclusão
  choice: Preservar “o viram... ele lhes permitiu... saboreá-lo”
  alternative: Substituir todos os pronomes por “o Filho”
  rationale: O encadeamento pronominal do texto permite alguma tensão quanto ao referente; explicitar tudo eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de “ora... ora...” dá ritmo à sequência dos pesadelos; termos centrais como Pai, Filho, Espírito, ignorância, conhecimento, sono, luz e despertar foram mantidos de modo consistente. Evitaram-se tanto coloquialismos quanto vocabulário esotérico importado.
