  rationale: Mantém o artigo definido e a designação teológica recorrente do texto.
- source_word: ⲡⲧⲏⲣϥ̄
  choice: o Todo
  rationale: Expressa a totalidade em sentido técnico, com forma natural em português e sem importar uma explicação sectária.
- source_word: ⲧⲁⲅⲁⲡⲏ
  choice: amor
  rationale: Equivalente direto e natural do empréstimo grego agápē no contexto.
- source_word: ϣⲧⲁ
  choice: deficiência
  rationale: Conserva o contraste conceitual com a Plenitude; 'falta' seria possível, mas apagaria parte da terminologia do tratado.
- source_word: ⲟⲩⲁⲉⲓⲛ
  choice: Luz
  rationale: Mantém a imagem definida e possivelmente personificada; a inicial maiúscula sinaliza seu peso teológico.
- source_word: ϫⲏⲕ ⲉⲃⲟⲗ
  choice: completa
  rationale: Comunica inteireza e consumação sem a carga moral adicional que 'perfeita' pode sugerir.
- source_word: ⲥⲡⲉⲣⲙⲁ
  choice: semente
  rationale: Preserva de modo transparente a metáfora geradora do empréstimo grego sperma.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ / ⲡⲓⲡ[ⲛⲁ] (OCR incerto no fim da linha)
  choice: Plenitude
  rationale: O contexto e a tradição textual sustentam o termo técnico 'Plenitude'; a inicial maiúscula evita a transliteração pouco acessível 'Pleroma'.
- source_word: ⲡⲛⲁ
  choice: Espírito
  rationale: O referente é o Espírito do Pai; a maiúscula explicita o referente divino sem definir além do que o contexto permite.
- source_word: ⲛⲉϥϣⲏⲣⲉ
  choice: seus filhos
  rationale: Preserva a metáfora filial e a forma gramatical do copta; não se restringe semanticamente a filhos adultos do sexo masculino.
theological_decisions:
- issue: Sentido técnico de 'Todo' e 'Plenitude'
  choice: Empregar maiúsculas em 'Todo' e 'Plenitude'
  alternative: todo e plenitude em minúsculas; transliterar 'Pleroma'
  rationale: As maiúsculas indicam loci teológicos reificados no discurso do tratado, mas evitam impor uma definição sistemática ou terminologia inacessível.
- issue: Inclusividade de ⲛⲥⲛⲏⲩ, pressuposto na linha inicial conforme a leitura textual estabelecida
  choice: verdadeiros irmãos e irmãs
  alternative: verdadeiros irmãos; verdadeiros irmãos e irmãs espirituais
  rationale: A expressão portuguesa torna explícito o grupo misto normalmente abrangido pelo plural masculino, sem acrescentar 'espirituais', termo ausente.
- issue: Relação entre a Luz, a semente, o coração e a Plenitude
  choice: Conservar a cadeia de relativos e seus referentes parcialmente ambíguos
  alternative: Reformular para identificar de modo inequívoco cada referente
  rationale: O copta permite alguma oscilação referencial; a tradução não decide silenciosamente se cada oração modifica a Luz, a semente ou uma realidade correlata.
- issue: Suposto texto depois do encerramento
  choice: Não incluir o material gerado pelo OCR após a longa sequência de sinais espúrios
  alternative: Traduzir o parágrafo secundário apresentado na camada inglesa após uma grande lacuna
  rationale: A página-fonte é identificada como sem texto visível nessa área, o OCR atingiu limite de tokens e produziu milhares de sinais repetidos antes de material desconexo. Esse trecho não constitui evidência manuscrita segura para o Evangelho da Verdade e não deve entrar no texto publicado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara e vocabulário teológico apenas onde o próprio texto o exige. A abertura mantém seu caráter conclusivo e contrastivo. Evitaram-se arcaísmos, jargão denominacional e reconstruções especulativas. As maiúsculas em Lugar de Descanso, Todo, Verdade, Luz, Plenitude e Espírito marcam usos teológicos ou personificados, não nomes dogmaticamente definidos.
