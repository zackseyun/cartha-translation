- source_word: ⲙ̄ⲡⲙⲁ ⲛ̄ⲙ̄ⲧⲁⲛ
  choice: Lugar de Descanso
  rationale: Preserva a imagem de repouso e seu possível valor técnico e escatológico; as maiúsculas sinalizam um locus teológico sem recorrer a uma paráfrase doutrinária.
- source_word: ⲡⲓⲱⲧ
