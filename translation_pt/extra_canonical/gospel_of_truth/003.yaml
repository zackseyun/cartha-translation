revisions:
- from: 'O Pai, aquele que não pode ser contido, guardou dentro de si a plenitude deles, dando-a a eles como retorno a si mesmo, com conhecimento uno em plenitude. Foi ele quem produziu o Todo; o Todo está nele, e o Todo necessita dele. Assim como alguém que é desconhecido, ele deseja ser conhecido e amado. Pois de que o Todo necessitava, senão do conhecimento do Pai?


    Ele se tornou um guia, sereno e tranquilo. Veio aos lugares de instrução e pronunciou a Palavra como mestre. Os que eram sábios no próprio coração aproximaram-se dele para pô-lo à prova. Ele, porém, os confundiu, porque eram vazios. Eles o odiaram, porque não eram verdadeiramente sábios. Depois de todos eles, vieram também as criancinhas, aquelas a quem pertence o conhecimento do Pai. Quando foram fortalecidas, receberam instrução acerca das expressões do Pai. Conheceram e foram conhecidas; receberam glória e deram glória.


