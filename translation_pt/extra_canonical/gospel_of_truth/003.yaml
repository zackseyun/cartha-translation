lexical_decisions:
- source_word: ⲡⲧⲏⲣϥ
  choice: o Todo
  rationale: Preserva o emprego substantivado e técnico para a totalidade sem reduzi-lo ao universo físico; quando funciona como quantificador, o contexto permite formas comuns como “todas as coisas”.
- source_word: ⲥⲁⲩⲛⲉ
  choice: conhecimento
  rationale: É natural em português e mantém o tema central do tratado sem introduzir o rótulo técnico posterior “gnose” no texto principal.
- source_word: ϫⲱⲕ
  choice: plenitude
  rationale: Expressa conclusão, inteireza e perfeição. Aqui evita transformar prematuramente a imagem em “corpo”, embora a linguagem posterior sobre membros permaneça ao fundo.
- source_word: ⲥⲧⲟⲩⲱⲣⲁⲩ
  choice: retorno
  rationale: No contexto da dádiva guardada pelo Pai, a forma aponta para restauração ou retorno; “retorno” mantém o movimento em direção ao Pai.
- source_word: ⲡⲓϫⲱⲱⲙⲉ
  choice: livro
  rationale: Mantém a imagem recorrente do Livro Vivo e permite a comparação jurídica subsequente sem impor o formato material de um rolo.
- source_word: ⲙⲉⲉⲩⲉ / ⲛⲟⲩⲥ
  choice: pensamento / mente
  rationale: Conserva o paralelismo entre o termo copta e o empréstimo grego nous, além do registro contemplativo do trecho.
- source_word: ⲇⲓⲁⲑⲏⲕⲏ
  choice: testamento
  rationale: A abertura do documento e a riqueza de um falecido tornam explícita a metáfora jurídica de herança; “aliança” apagaria essa relação.
- source_word: ⲇⲓⲁⲧⲁⲅⲙⲁ
  choice: decreto
  rationale: Reproduz o sentido administrativo e público do empréstimo grego, em associação com o verbo publicar.
- source_word: ⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: incorruptibilidade
  rationale: Mantém o contraste abstrato e solene com os trapos perecíveis, sem explicar além do que diz o texto.
theological_decisions:
- issue: Caráter técnico de “o Todo”
  choice: Manter “o Todo” como entidade coletiva
  alternative: “a totalidade” ou “o universo”
  rationale: A expressão inclui tudo o que procede do Pai, mas o texto não a limita ao cosmos físico. A forma substantivada preserva a amplitude metafísica.
- issue: Relação entre o Pai, a plenitude e o Todo
  choice: Preservar que a plenitude é guardada no Pai e concedida como retorno a ele
  alternative: Explicitar isso como uma doutrina sistemática de emanação e reintegração
  rationale: O texto afirma tanto a origem no Pai quanto a necessidade de retorno, mas não convém importar uma reconstrução denominacional ou escolar mais detalhada.
- issue: A morte daquele que toma o livro
  choice: Traduzir literalmente que está determinado que quem o tomar seja morto
  alternative: Interpretar diretamente como profecia exclusiva da crucificação de Jesus
  rationale: A sequência aplica a declaração a Jesus, mas a formulação inicial é geral e enigmática; a tradução preserva essa tensão.
- issue: Instrumento da morte e lugar da proclamação
  choice: “pregado a uma árvore” e “na cruz”
  alternative: Uniformizar ambos como “cruz” ou ambos como “madeiro”
  rationale: A redação distingue as duas imagens. Mantê-las conserva o jogo entre árvore, fruto, documento e proclamação pública.
- issue: A morte de Jesus como vida para muitos
  choice: Preservar a afirmação sem desenvolver uma teoria da expiação
  alternative: Acrescentar linguagem de substituição, resgate ou satisfação
  rationale: O texto declara o efeito vivificador da morte, mas não define aqui seu mecanismo.
translation_notes:
  register: Português moderno, solene e legível, com períodos moderados e paralelismo preservado. Emprega “o Todo”, “plenitude”, “Livro Vivo dos Vivos” e “incorruptibilidade” como termos recorrentes do universo conceitual do tratado. Evita “gnose”, vocabulário confessional importado e explicações doutrinárias dentro do texto. As passagens danificadas foram vertidas de modo contínuo apenas onde a sintaxe e o testemunho editorial fornecido permitem uma reconstrução responsável.
