  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/003.yaml
  text: 'The Father—the one who cannot be contained—is the one who kept the All within himself[a], and the All is within him, and all have need of him. He kept their wholeness within himself; he was not jealous, for what jealousy could there be between him and his members? If, in this way, the All had already received it, they could not have come to him. He keeps it for them within himself, to give it to them so that they may return to him with a single knowledge in rest, in one body.


    Like one who is unknown, he desires to be known and to be loved—for what did all need except the Father’s knowledge? He became a guide—peaceful and unhurried. He came into the places of learning and spoke the Word as a teacher. Those who were wise in their own hearts came up to test him; yet he confounded them, for they were vain. They hated him because they were not wise in the Truth. After them the little children came also—theirs is the Father’s knowledge. When they were strengthened, they received instruction about the Father’s expressions. They knew, and they were known. They received glory and gave glory. In their heart the Living Book of the Living was revealed, written in the thought and in the mind of the Father, and before the foundation of all, within his incomprehensibility—a book that no one has the power to take, since it is appointed for the one who takes it to be killed. It is impossible that anyone be manifested among those entrusted with salvation unless that book should
    appear.


    Because of this, the merciful and faithful Jesus endured patiently until he took that book, for he knows that his death is life for many. As long as a testament has not been opened, the wealth of the deceased master of the house is hidden; so also, while the Father of the All was invisible, all things were hidden, for they are from him, from whom every realm comes. Because of this, Jesus was manifested; he put on that book; he was nailed to a tree; he published the Father’s decree on the cross.


    O the great teaching! He drew himself down to death; he clothed himself in eternal life; he stripped off the perishable rags; he put on incorruptibility, which no one can take from him. When he entered the empty places of dread, he passed by those who had been stripped by forgetfulness—being knowledge and completion—proclaiming what is in the heart to those who are ready to receive instruction.'
translation:
  language: pt
  text: 'O Pai guardava dentro de si a plenitude deles, para lhes dar descanso e conhecimento, a fim de que retornassem a ele em plenitude. Foi ele quem produziu o Todo; o Todo está nele, e o Todo necessita dele. Ele guardou dentro de si a plenitude deles, que não deu ao Todo. O Pai não foi ciumento. Pois que ciúme poderia haver entre ele e seus membros? Se o Todo a tivesse recebido dessa maneira, não poderia ter vindo ao Pai. Ele guarda dentro de si a plenitude deles para dá-la a eles, a fim de que retornem a ele com um conhecimento único, em plenitude.


    Como alguém que é desconhecido, ele deseja ser conhecido e amado. Pois de que o Todo necessitava, senão do conhecimento do Pai?


    Ele se tornou um guia, sereno e tranquilo. Veio aos lugares de instrução e pronunciou a Palavra como mestre. Os que eram sábios no próprio coração aproximaram-se dele para pô-lo à prova. Ele, porém, os confundiu, porque eram vazios. Eles o odiaram, porque não eram sábios na Verdade. Depois deles todos, vieram também as criancinhas; delas é o conhecimento do Pai. Quando foram fortalecidas, receberam instrução acerca das expressões do Pai. Conheceram e foram conhecidas; receberam glória e deram glória.


    No coração delas foi revelado o Livro Vivo dos Vivos, escrito no pensamento e na mente do Pai, antes da fundação do Todo, em sua incompreensibilidade. É o livro que ninguém tem poder para tomar, pois está determinado que aquele que o tomar seja morto. Não é possível que alguém seja revelado entre os que foram incumbidos da salvação, se aquele livro não aparecer.


    Por isso, o misericordioso e fiel Jesus suportou pacientemente os sofrimentos até tomar aquele livro, pois sabia que sua morte é vida para muitos. Enquanto um testamento não é aberto, permanece oculta a riqueza do falecido senhor da casa. Do mesmo modo, enquanto o Pai do Todo permanecia invisível, todas as coisas estavam ocultas, pois são daquele de quem provém todo domínio.


    Por isso, Jesus foi revelado. Ele se revestiu daquele livro, foi pregado a uma árvore e publicou o decreto do Pai na cruz.


    Ó grandioso ensinamento! Ele se fez descer até a morte e se revestiu da vida eterna. Despiu-se dos trapos perecíveis e vestiu-se de incorruptibilidade, que ninguém pode tirar dele. Quando entrou nos lugares vazios do terror, passou por aqueles que haviam sido despidos pelo esquecimento. Sendo ele conhecimento e plenitude, proclamou o que está no coração aos que estão preparados para receber instrução.'
