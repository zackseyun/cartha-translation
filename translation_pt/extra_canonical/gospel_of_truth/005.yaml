revisions:
- from: 'Jesus, o de infinita doçura.[a]


    O Pai revelou o seu seio; seu seio é o Espírito Santo. Ele manifestou aquilo que está oculto em si mesmo; aquilo que está oculto em si mesmo é seu Filho, para que, pelas misericórdias do Pai, os Éons[b] o conheçam, deixem de se afadigar na busca pelo Pai e descansem nele, sabendo que este é o Descanso.


    O Pai preencheu a Deficiência e dissolveu sua aparência — sua aparência é o mundo no qual ela serviu. Pois onde há inveja e discórdia, há Deficiência; mas onde há Unidade, há Plenitude. Visto que a Deficiência veio a existir porque o Pai não era conhecido, quando o Pai for conhecido, a partir desse momento a Deficiência deixará de existir. Assim como a ignorância de uma pessoa se dissolve quando ela passa a conhecer, e assim como a escuridão se dissolve quando a luz aparece, também a Deficiência é dissolvida pela Plenitude. A partir de então, sua aparência já não se manifesta, mas será dissolvida na harmonia da Unidade.


    Por enquanto, as obras deles estão dispersas; mas, no devido tempo, a Unidade levará os Éons à Plenitude. Dentro da Unidade, cada um receberá a si mesmo; e, dentro do Conhecimento, eles se purificarão da multiplicidade para a Unidade, consumindo em si mesmos a matéria como o fogo a consome, a escuridão pela luz e a morte pela vida. Se, de fato, essas coisas aconteceram a cada um de nós, convém que pensemos no Todo,[c] para que esta casa seja santa e silenciosa em favor da Unidade.'
