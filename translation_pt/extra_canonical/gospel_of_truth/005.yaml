  warnings: []
  consult_excerpt: 'His Wisdom meditates on the Word,

    his teaching speaks it,

    his knowledge has revealed it,

    his patience is a crown upon it,

    his joy is in harmony with it,

    his glory has exalted it,

    his image has revealed it,

    his rest has received it,

    his love made a body around it,

    his faith embraced it.

    In this way, the Word of the Father goes out in all, as the fruit 24 [of] his heart and an expression of his will. But it supports all. It chooses them and also takes the expression of all, purifying them, returning them to the Father and to the Mother, Jesus of infinite sweetness.

    The Father reveals his bosom, and his bosom is the Holy Spirit. He reveals what’s hidden of himself; what’s hidden of himself is his Son – so that through the mercies of the Father, the generations may know him and cease their work in searching for the Father, resting in him and knowing that this is the rest. He’s filled the need and dissolved its appearance – its appearance is the world in which it served, because where there’s envy and strife there’s need, but where there’s Unity there’s completion. Since need came into being because the Father wasn’t known, when the Father is known, from then on, need will no longer exist. As someone’s ignorance dissolves when they gain knowledge, and as darkness dissolves when the light appears, 25 so also need dissolves in completion. So the appearance is revealed from then on, but it’ll dissolve in the harmony of Unity.

    For now, their works lie scattered. In time, Unity will complete the realms. Within Unity each one will receive themselves, and within knowledge they’ll purify themselves from multiplicity into Unity, consuming matter within themselves like fire, and darkness by light, death by life. If indeed these things have happened to each one of us, then it’s right for us to think about all, so that this house will be holy and silent for the Unity.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/005.yaml
  text: 'Jesus of the infinite sweetness[a].


    The Father made his bosom known; his bosom is the Holy Spirit. He manifested what is hidden of himself; what is hidden of himself is his Son, so that, through the mercies of the Father, the Aeons might know him, cease from searching for the Father, and rest in him, knowing that this is the Rest.


    The Father filled the deficiency and dissolved its appearance—its appearance is the world in which it had served. For in the place where there is envy and strife, there is deficiency; but in the place where there is Unity, there is completion. Since the deficiency came to be because the Father was not known, when the Father is known, from that time the deficiency will no longer be—just as a person’s ignorance is dissolved when knowledge is present, and just as darkness is dissolved when the light appears. So also the deficiency is dissolved by the completion. From then on its appearance is no longer manifest, and it will be dissolved in the concord of Unity.


    For now their works are scattered; but in time Unity will complete the Aeons. Within Unity each one will receive himself, and within Knowledge they will purify themselves from multiplicity into Unity—consuming matter within themselves like fire, and darkness by light, and death by life. If indeed these things have happened to each of us, it is necessary to think concerning the All[d][c][b], so that this house may be holy and still for the sake of Unity.'
translation:
  language: pt
  text: 'Jesus, o de infinita doçura.


    O Pai revelou o seu seio; seu seio é o Espírito Santo. Ele manifestou aquilo que está oculto em si mesmo; aquilo que está oculto em si mesmo é seu Filho, para que, pelas misericórdias do Pai, os Éons[a] o conheçam, deixem de se afadigar na busca pelo Pai e descansem nele, sabendo que este é o Descanso.


    O Pai preencheu a Deficiência e dissolveu sua aparência — sua aparência é o mundo no qual ela serviu. Pois onde há inveja e discórdia, há Deficiência; mas onde há Unidade, há Plenitude. Visto que a Deficiência veio a existir porque o Pai não era conhecido, quando o Pai for conhecido, a partir desse momento a Deficiência deixará de existir. Assim como a ignorância de uma pessoa se dissolve quando ela passa a conhecer, e assim como a escuridão se dissolve quando a luz aparece, também a Deficiência é dissolvida pela Plenitude. A partir de então, sua aparência já não se manifesta, mas será dissolvida na harmonia da Unidade.


    Por enquanto, as obras deles estão dispersas; mas, no devido tempo, a Unidade completará os Éons. Dentro da Unidade, cada um receberá a si mesmo; e, dentro do Conhecimento, eles se purificarão da multiplicidade para a Unidade, consumindo em si mesmos a matéria como o fogo a consome, a escuridão pela luz e a morte pela vida. Se, de fato, essas coisas aconteceram a cada um de nós, convém que pensemos no Todo,[b] para que esta casa seja santa e silenciosa para a Unidade.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Éons” translitera o termo grego para realidades ou ordens do âmbito divino; também pode significar “eras” em outros contextos.
    reason: Explicar ao leitor comum um termo cosmológico técnico retido na tradução.
  - marker: b
    text: 'Ou: “em relação à totalidade”. O termo pode ter aqui o sentido técnico de “o Todo”.'
    reason: Registrar a amplitude semântica da expressão sem limitar sua referência.
lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: ignorância
  rationale: Expressa literalmente a ausência de conhecimento e mantém o contraste recorrente com ⲥⲁⲩⲛⲉ, “Conhecimento”.
- source_word: ⲧⲙⲛⲧⲟⲩⲉⲉⲓⲛ / ⲙⲛⲧⲟⲩⲉⲉⲓ
  choice: Unidade
  rationale: Preserva o valor técnico da unidade contraposta à multiplicidade; a inicial maiúscula distingue o conceito cosmológico do uso numérico comum.
- source_word: ⲥⲭⲏⲙⲁ
  choice: aparência
  rationale: O empréstimo grego indica aqui a configuração ou manifestação exterior da Deficiência; “aparência” se ajusta à afirmação de que ela deixa de se manifestar.
- source_word: ⲕⲟⲥⲙⲟⲥ
  choice: mundo
  rationale: É a forma portuguesa natural para o empréstimo grego neste contexto, sem perder a referência à ordem presente.
- source_word: ⲧϩⲩⲗⲏ
  choice: matéria
  rationale: Mantém o sentido filosófico do empréstimo grego ὕλη e sua função na imagem do fogo que consome.
- source_word: ⲁⲓⲱⲛ
  choice: Éon
  rationale: Conserva o termo cosmológico técnico em vez de reduzi-lo ao sentido comum de “era” ou “idade”.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Conhecimento
  rationale: A inicial maiúscula assinala o uso soteriológico e técnico, sem recorrer ao estrangeirismo “gnose” no texto principal.
- source_word: ⲡⲏⲡ / ⲡⲉⲑⲏⲡ
  choice: seio
  rationale: Reproduz a imagem de intimidade e revelação e permite conservar a identificação explícita com o Espírito Santo.
- source_word: ⲃⲱⲗ ⲁⲃⲁⲗ
  choice: dissolver
  rationale: Mantém a repetição temática do mesmo verbo aplicado à aparência, à ignorância, à escuridão e à Deficiência.
- source_word: ⲡⲧⲏⲣϥ
  choice: o Todo
  rationale: A forma substantivada e com inicial maiúscula preserva o possível sentido técnico de totalidade, sem restringi-lo a “todas as pessoas”.
theological_decisions:
- issue: Identificação do seio do Pai com o Espírito Santo
  choice: “seu seio é o Espírito Santo”
  alternative: Tratar “seio” apenas como metáfora de presença íntima
  rationale: A construção copta é explicitamente equativa; a tradução conserva a afirmação sem explicá-la ou atenuá-la.
- issue: Relação entre Deficiência, Unidade e Plenitude
  choice: Manter os três termos como conceitos personificados, com iniciais maiúsculas
  alternative: 'Usar apenas substantivos comuns: falta, unidade e completude'
  rationale: O argumento depende da oposição conceitual entre a multiplicidade deficiente e a consumação na Unidade, embora o texto não forneça uma sistematização completa.
- issue: Negação na manifestação da aparência
  choice: “sua aparência já não se manifesta”
  alternative: “sua aparência se manifesta”
  rationale: 'A leitura com a partícula negativa ⲁⲛ é confirmada pela sintaxe e pela progressão do argumento: aquilo que é dissolvido pela Plenitude deixa de aparecer.'
- issue: Sentido de ⲡⲧⲏⲣϥ
  choice: “o Todo”
  alternative: “todos” ou “todas as coisas”
  rationale: A forma pode designar a totalidade em sentido técnico. “O Todo” preserva essa possibilidade sem decidir se a referência é pessoal, cósmica ou ambas.
translation_notes:
  register: Português moderno, digno e legível, com preferência por construções naturais no Brasil e compreensíveis internacionalmente. Os termos técnicos indispensáveis — Éons, Unidade, Plenitude, Conhecimento e o Todo — são mantidos ou destacados com moderação. A repetição de “dissolver” foi preservada por sua importância retórica e conceitual. Evitaram-se explicações confessionais e harmonizações com sistemas teológicos posteriores.
