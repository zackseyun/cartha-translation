  consult_excerpt: 'Now those who will receive teaching [are] the living who are written in the Book of the Living. They receive teaching about themselves, and they receive it from the Father, returning to him again.

    Since the completion of all is in the Father, it’s necessary for all to go up to him. Then, if someone has knowledge, they receive what are their own, and he draws them to himself, because the one who’s ignorant is in need. And it’s a great need, since they need what will complete them. Since the completion of all is in the Father, it’s necessary for all to go up to him, and for each one to receive what are their own. He inscribed these things beforehand, having prepared them to give to those who came out from him.

    Those whose names he knew beforehand were called at the end, so that the one who has knowledge is the one whose name the Father has called, because those whose name hasn’t been spoken are ignorant. Indeed, how can someone hear if their name hasn’t been called? For the one who’s ignorant until the end is a delusion of forgetfulness, and they’ll dissolve with it. Otherwise, why do these miserable ones have no 22 name? Why do they have no voice?

    So if someone has knowledge, they’re from above. If they’re called, they hear, they reply, and they turn to the one who calls them. And they go up to him, and they know how they are called. Having knowledge, they do the will of the one who called them, they want to please him, and they receive rest. Each one’s name becomes their own. The one who has knowledge like this knows where they come from and where they’re going. They know like one who, having been drunk, turns from their drunkenness, and having returned to themselves, restores what are their own.

    He’s returned many from Error. He went before them to the realms from which they had moved away. They had received Error because of the depth of the one who surrounds every realm, though nothing surrounds him. It’s a great wonder that they were in the Father, not knowing him, and that they were able to come out by themselves, since they weren’t able to grasp and know the one in whom they were. He revealed his will as knowledge in harmony with all that emanated from him.

    This is the knowledge of the living book which he revealed to the 23 generations at the end, letters from him revealing how they’re not vowels or consonants, so that one might read them and think they’re meaningless, but they’re letters of the Truth – they speak and know themselves. Each letter is a complete thought, like a book that’s complete, since they’re letters written by the Unity, the Father having written them so that the generations, by means of his letters, might know the Father.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/004.yaml
  text: 'As for the names of the Living, they are written in the Book of the Living.

    They receive instruction about themselves; they receive it from the Sonship, so that the one who hears may answer, may turn back, and may look toward the one who called his name. He does his will, he follows after him, and he says that they are his who have been named by him. Each one knows from where he has been called; he does his will, he desires to please him, and he receives rest. Each one’s name becomes his own.

    Since, then, the completion of the All is in him, it is necessary for the All to go up, and for each one to receive what is his. He wrote them beforehand—having prepared them in his thought and in his will—to give to those who went forth from him.

    Those whom he knew by name beforehand were called at the end, so that the one who has knowledge is the one whose name the Father has spoken; for the one whose name has not been uttered is ignorant. And how will such a one hear, if his name has not been called? For the ignorant one until the end is a product of Error, and he will dissolve together with it. Otherwise, why do these pitiable ones have no name? Why do they have no voice?

    Thus, if someone has knowledge, he is from above. If he is called, he hears; he answers; he turns to the one who calls him; he goes up to him; and he knows the manner in which he is called. Possessing knowledge, he does the will of the one who called him, he desires to be pleasing to him, and he receives rest. His name becomes his own. Such a knower knows from where he came and where he is going. He knows like one who, having been drunk, turned away from his drunkenness, and having returned to himself, has set again in order the things that are his.

    He has brought many back from Error. He went before them to the places from which they had moved away. They had received Error because of the depth of the one who surrounds every place—though nothing surrounds him. A great wonder: that they were in the Father and did not know him, and that they were able to come forth by themselves, though they were not able to grasp and to know the one in whom they were. He revealed his will as knowledge, in harmony with all that went out from him.

    This is the knowledge of the Living Book which he revealed to the generations at the end—letters from him showing that they are not vowels nor consonants, so that someone would read them and suppose they are empty, but they are letters of the Truth: they speak, and they know themselves. Each letter is a complete thought, like a book that is complete, since they are letters written by the Unity, the Father having written them so that the generations, by means of his letters from him, might know the Father.'
translation:
  language: pt
  text: 'Quanto aos nomes dos Vivos, eles estão escritos no Livro dos Vivos.[a]


    Eles recebem instrução a respeito de si mesmos; recebem-na da Filiação,[b] para que aquele que ouve responda, volte e olhe para aquele que o chamou pelo nome. Ele faz a vontade daquele que o chamou, segue-o e declara que lhe pertencem os que foram nomeados por ele. Cada um sabe de onde foi chamado; faz a vontade daquele que o chamou, deseja agradar-lhe e recebe descanso. O nome de cada um passa a lhe pertencer.


    Uma vez que a plenitude do Todo está nele, é necessário que o Todo suba e que cada um receba o que lhe pertence. Ele os escreveu de antemão — depois de prepará-los em seu pensamento e em sua vontade — para entregá-los aos que saíram dele.


    Aqueles cujos nomes ele conheceu de antemão foram chamados no fim. Assim, aquele que tem conhecimento é aquele cujo nome o Pai pronunciou, pois quem não teve seu nome pronunciado é ignorante. E como poderá alguém assim ouvir, se seu nome não foi chamado? Pois aquele que permanece ignorante até o fim é produto do Erro e se dissolverá com ele. Se não fosse assim, por que esses infelizes não têm nome? Por que não têm voz?


    Portanto, se alguém tem conhecimento, vem do alto. Quando é chamado, ouve, responde, volta-se para quem o chama, sobe até ele e sabe de que modo é chamado. Tendo conhecimento, faz a vontade daquele que o chamou, deseja agradar-lhe e recebe descanso. Seu nome passa a lhe pertencer. Quem conhece dessa maneira sabe de onde veio e para onde vai. É como alguém que, depois de se embriagar, afastou-se de sua embriaguez e, voltando a si, pôs novamente em ordem aquilo que lhe pertence.


    Ele trouxe muitos de volta do Erro. Foi adiante deles até os lugares dos quais haviam se afastado. Eles receberam o Erro por causa da profundidade daquele que envolve todos os lugares, embora nada o envolva. É uma grande maravilha: eles estavam no Pai e não o conheciam; e puderam sair por si mesmos, embora não fossem capazes de compreender e conhecer aquele em quem estavam. Ele revelou sua vontade como conhecimento, em harmonia com tudo o que saiu dele.


    Este é o conhecimento do Livro Vivo,[a] que ele revelou às gerações no fim: letras vindas dele, mostrando que não são vogais nem consoantes, de modo que alguém as leia e suponha que sejam vazias. Pelo contrário, são letras da Verdade: elas falam e conhecem a si mesmas. Cada letra é um pensamento completo, como um livro completo, pois são letras escritas pela Unidade.[c] O Pai as escreveu para que as gerações, por meio das letras que vêm dele, conheçam o Pai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão copta pode ser entendida como «Livro dos Vivos» ou «Livro Vivo». A primeira forma destaca os vivos cujos nomes estão inscritos; a segunda, o caráter vivo do próprio livro. As duas nuances aparecem no texto.
    reason: Preservar a ambiguidade sintática e teológica da designação do livro.
  - marker: b
    text: «Filiação» traduz um termo técnico que também pode significar «condição de filho». Aqui ele pode designar uma realidade coletiva ou hipostática, não necessariamente apenas «o Filho».
    reason: Evitar uma identificação pessoal ou denominacional não exigida pelo copta.
  - marker: c
    text: «Unidade» também pode ser traduzida por «Unicidade» ou «o Um».
    reason: Registrar alternativas legítimas para o substantivo abstrato de caráter metafísico.
lexical_decisions:
- source_word: ⲡⲗⲁⲛⲏ
  choice: Erro
  rationale: Mantém o substantivo grego πλάνη como realidade personificada ou reificada no discurso; a inicial maiúscula preserva essa força sem definir sua ontologia.
- source_word: ⲡⲓⲱⲧ
  choice: o Pai
  rationale: Conserva o título divino definido do copta em linguagem portuguesa corrente.
- source_word: ⲥⲁⲛϩⲣⲉ
  choice: Filiação
  rationale: Preserva o caráter técnico e abstrato do termo, evitando reduzi-lo simplesmente a uma referência pessoal ao Filho.
- source_word: ⲥⲧⲏⲣⲟⲩ
  choice: descanso
  rationale: Expressa de modo natural o repouso de caráter soteriológico presente no contexto.
- source_word: ⲥⲁⲩⲛⲉ
  choice: conhecer / conhecimento
  rationale: O verbo copta significa conhecer; a tradução mantém o motivo recorrente do conhecimento, distinguindo-o dos verbos de subida presentes no contexto.
- source_word: ⲡⲧⲏⲣϥ / ⲡⲉⲥⲧⲏⲣⲟⲩ
  choice: o Todo
  rationale: A forma substantivada designa a totalidade em sentido cosmológico; a inicial maiúscula sinaliza seu uso técnico.
- source_word: ⲙⲛⲧⲟⲩⲉⲉⲓ
  choice: Unidade
  rationale: Mantém a força abstrata e metafísica da fonte que escreve as letras.
- source_word: ⲟⲩⲱϣ
  choice: vontade
  rationale: Traduz a volição divina sem acrescentar uma definição doutrinária.
- source_word: ⲙⲟⲩⲧⲉ
  choice: chamar / chamar pelo nome
  rationale: Preserva o jogo entre nomear e chamar, central ao trecho, com formulação natural em português.
- source_word: ⲃⲁⲑⲟⲥ
  choice: profundidade
  rationale: Tradução direta do empréstimo grego βάθος, mantendo a imagem cosmológica.
- source_word: ⲕⲧⲁⲉⲓⲧ
  choice: envolver
  rationale: Reproduz a imagem espacial daquele que abrange todos os lugares, mas não é abrangido por nada.
- source_word: ⲙⲛⲧⲙⲏⲉ
  choice: Verdade
  rationale: A inicial maiúscula conserva o caráter reificado do termo no contexto das letras vivas.
- source_word: ⲡⲓϫⲱⲱⲙⲉ ⲉⲧⲁⲛϩ
  choice: Livro Vivo
  rationale: A construção admite a leitura adjetiva 'livro vivo'; ela foi mantida na ocorrência explícita, enquanto o título temático 'Livro dos Vivos' aparece no início.
theological_decisions:
- issue: Sentido de ⲥⲁⲛϩⲣⲉ
  choice: Filiação
  alternative: condição de filho / o Filho
  rationale: A opção conserva a possível dimensão hipostática e coletiva sem identificar silenciosamente o termo com uma pessoa específica.
- issue: Designação da totalidade
  choice: o Todo
  alternative: todas as coisas / a totalidade
  rationale: A forma substantivada preserva o uso cosmológico e a tensão entre o Todo, sua plenitude no Pai e sua subida.
- issue: Livro dos Vivos e Livro Vivo
  choice: manter as duas formulações no texto e explicar a ambiguidade em nota
  alternative: uniformizar todas as ocorrências como Livro dos Vivos
  rationale: O copta permite mais de uma relação sintática; manter a variação evita resolver uma ambiguidade genuína e também preserva a ligação entre os nomes inscritos e o livro que é vivo.
- issue: Personificação de Erro e Verdade
  choice: Erro e Verdade com iniciais maiúsculas
  alternative: erro e verdade em minúsculas
  rationale: As maiúsculas sinalizam o caráter reificado no discurso, sem impor que sejam pessoas ou hipóstases em sentido estrito.
- issue: Pronomes masculinos e referentes
  choice: preservar os referentes pronominais sem substituí-los por identificações doutrinárias
  alternative: explicitar cada referente como Pai, Filho ou Salvador
  rationale: O texto mantém certas transições referenciais ambíguas; explicitá-las resolveria indevidamente sua tensão.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com sintaxe de boa legibilidade brasileira. Termos técnicos foram mantidos apenas quando carregam peso conceitual no copta e foram esclarecidos por notas. As repetições de chamar, nome, conhecer, vontade e pertencer foram preservadas por estruturarem o argumento. Não se acrescentou um marcador inicial equivalente a “agora”, pois não há no trecho fornecido um vocábulo temporal explícito que o exija.
