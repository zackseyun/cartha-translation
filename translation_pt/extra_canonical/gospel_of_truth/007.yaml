theological_decisions:
- issue: Relação entre o Pai e o não ser
  choice: “firma a partir do não ser”
  alternative: “cria do nada”
  rationale: A formulação escolhida preserva a linguagem ontológica do texto sem importar para a passagem a doutrina posterior da criação ex nihilo.
- issue: Vocabulário dos éons
  choice: “éon”
  alternative: “era” ou “reino”
  rationale: O termo técnico mantém a alteridade conceitual do texto e evita uma interpretação cosmológica excessivamente simplificada.
- issue: Designação ontológica ⲡⲉⲧϣⲟⲟⲡ
  choice: “aquele que é”
  alternative: “o Existente”
  rationale: A opção conserva a possível força titular, mas evita uma capitalização ou forma lexical que resolveria em excesso sua referência teológica.
- issue: Afirmação sobre os que ainda não vieram à existência
  choice: “não são nada; pelo contrário, eles existem naquele...”
  alternative: “não existem”
