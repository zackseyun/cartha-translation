  consult_excerpt: 'He’s good. He knows his plants, because he planted them in his paradise. Now his paradise is a place of rest. This 37 is the completion in the Father’s thought, and these are the words of his meditation. Each of his words is the work of his one will in the revelation of his Word. When they were still in the depths of his thought, the Word – which was the first to come out – revealed them along with a mind that speaks the one Word in a silent grace. He was called “the Thought,” since they were in it before being revealed. It happened, then, that he was the first to come out at the time when it pleased the one who wanted it. Now the Father rests in his will, and is pleased with it.

    Nothing happens without him, nor does anything happen without the will of the Father, but his will is incomprehensible. His trace is the will, and no one can know him, nor does he exist for people to scrutinize so that they might grasp him, but when he wills, what he wills is this – even if the sight doesn’t please them in any way before God – the will of the Father, because he knows the beginning of all of them, and their end, for in the end he’ll greet them directly. Now the end is receiving knowledge of the one who’s hidden; this is the Father, 38 from whom the beginning has come, and to whom all who’ve come out from him will return. They were revealed for the glory and the joy of his name.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/013.yaml
  text: 'He is the Good—within the Father’s Thought[a], in contemplation.


    The utterance of his meditation—each one, every one of his words—is the work of his Will. For they are speech in the Light, outside, belonging to his Saying: while they were still in the depths of his Thought, the Logos—the first to come forth—manifested them, with a Mind that speaks the one Word in a silent grace. He was called “the Thought,” because they were in it before they were manifested outside. And so it happened that he was the first to come forth, at the time when it pleased the will of the one who willed it.


    The Will is that in which the Father rests. Nothing happens without him, nor does anything happen without the Will of the Father. But his Will is uninvestigable; his trace is the Will. No one can know him, nor does he exist in such a way as for them to scrutinize him so that they might grasp him; rather, what he wills—this is what happens, even if their sight should not be pleasing in any way before God—the Will of the Father. For the Father knows their beginning and their end; for in their end he will greet them face to face. And the end is the knowledge of the Hidden One; and the Hidden One is the Father—from whom the beginning came forth and to whom all who came forth from him will return[c][b]. They were manifested for the glory and the joy of his Name.'
translation:
  language: pt
  text: 'Este é o cumprimento no Pensamento do Pai: estas são as palavras de sua meditação. Cada uma de suas palavras é obra de sua única Vontade, na manifestação de sua Palavra. Enquanto ainda estavam nas profundezas de seu Pensamento, o Logos[a] — o primeiro a vir para fora — as manifestou, juntamente com uma Mente que profere a única Palavra numa graça silenciosa. Ele foi chamado «o Pensamento», porque elas estavam nele antes de serem manifestadas. Assim, ele foi o primeiro a vir para fora, no tempo em que agradou àquele que o quis.


    A Vontade é aquilo em que o Pai repousa e de que se agrada. Nada acontece sem ele, nem coisa alguma acontece sem a Vontade do Pai. Mas sua Vontade é insondável; seu traço é a Vontade. Ninguém pode conhecê-lo, nem ele existe de tal modo que possam examiná-lo para o apreender. Pelo contrário, aquilo que ele quer é o que acontece — ainda que isso de modo algum lhes pareça agradável diante de Deus —, pois essa é a Vontade do Pai. Pois o Pai conhece o princípio de todos eles e o seu fim; no fim, ele os receberá face a face.[b] E o fim é o conhecimento do Oculto; e o Oculto é o Pai, de quem veio o princípio e para quem retornarão todos os que dele vieram. Eles foram manifestados para a glória e a alegria de seu Nome.


    O Nome do Pai é o Filho. Foi ele quem, no princípio, deu nome àquele que veio dele. Este permaneceu sendo ele mesmo, e o Pai o gerou como Filho. Deu-lhe o seu Nome, o Nome que lhe pertencia. Ele tem conhecimento e possui tudo o que está sob o Pai; possui o Nome e possui o Filho. Eles têm poder para pronunciar o Nome, mas não podem vê-lo, pois ele é o mistério do Invisível, que chega aos ouvidos inteiramente cheios dele, por meio daquele a quem pertence. De fato, o Nome do Pai não é pronunciado, mas é manifestado por meio de um Filho.


    Assim, o Nome é grande. Quem, então, poderia pronunciar o Nome dele, o grande Nome, senão somente aquele a quem o Nome pertence e os filhos do Nome, nos quais repousou o Nome do Pai e que, por sua vez, repousaram em seu Nome? Visto que o Pai não foi gerado, somente ele o gerou para si como Nome, antes de produzir os éons,[c] para que o Nome do Pai estivesse sobre a cabeça deles como Senhor — isto é, o Nome verdadeiro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Logos» é o termo grego para «Palavra»; aqui funciona como designação pessoal ou técnica.
    reason: Esclarece o empréstimo técnico sem substituí-lo no texto principal.
  - marker: b
    text: A expressão também pode ser entendida como «ele os saudará diretamente» ou «os acolherá face a face».
    reason: O verbo e a expressão adverbial admitem mais de uma nuance relacional.
  - marker: c
    text: «Éons» pode significar «eras»; neste contexto, também pode designar realidades ou ordens cósmicas emanadas.
    reason: O empréstimo grego possui sentidos temporal e cosmológico, sem que o texto elimine inteiramente essa amplitude.
lexical_decisions:
- source_word: ⲡⲗⲟⲅⲟⲥ (logos)
  choice: Logos
  rationale: Mantém o empréstimo técnico grego presente no copta; o contexto imediatamente o associa à Palavra, preservando tanto a personificação quanto o campo semântico.
- source_word: ⲛⲟⲩⲥ (nous)
  choice: Mente
  rationale: Termo claro em português e adequado à faculdade cognitiva personificada que profere a Palavra.
- source_word: ⲭⲁⲣⲓⲥ (charis)
  choice: graça
  rationale: Preserva o empréstimo cristão usual e a expressão paradoxal do texto, “graça silenciosa”.
- source_word: ⲙⲉⲩⲉ / ⲙⲉⲉⲓⲛⲉ
  choice: Pensamento / meditação
  rationale: “Pensamento” com inicial maiúscula sinaliza a realidade personificada; “meditação” expressa o sentido processual no contexto paralelo.
- source_word: ⲟⲩⲱϣ
  choice: Vontade
  rationale: A inicial maiúscula reflete a reificação da vontade do Pai sem afirmar uma ontologia mais definida do que a do texto.
- source_word: ⲓⲭⲛⲟⲥ (ichnos)
  choice: marca
  rationale: Comunica a ideia de vestígio ou sinal deixado, com naturalidade em português; “rastro” seria uma alternativa mais concreta.
- source_word: ⲥⲟⲟⲩⲛⲉ
  choice: conhecimento
  rationale: Conserva o sentido soteriológico sem impor no texto principal a transliteração técnica “gnose”.
- source_word: ⲡⲉⲉⲓ ⲉⲑⲏⲡ
  choice: o Oculto
  rationale: Preserva a expressão como título substantivado do Pai.
- source_word: ⲣⲉⲛ
  choice: Nome
  rationale: A inicial maiúscula acompanha a personificação e o desenvolvimento teológico explícito do Nome no trecho.
- source_word: ⲁⲓⲱⲛ
  choice: éons
  rationale: Mantém o termo cosmológico técnico do empréstimo grego, evitando reduzi-lo simplesmente a “eras”.
theological_decisions:
- issue: Relação entre Logos, Pensamento e Palavra
  choice: Manter “Logos” como designação técnica e “Palavra” na expressão verbal paralela
  alternative: Uniformizar todas as ocorrências como “Palavra”
  rationale: O texto emprega vocabulário técnico grego e, ao mesmo tempo, explora o sentido de fala; a distinção conserva essa tensão.
- issue: Personificação da Vontade
  choice: Empregar “Vontade” com inicial maiúscula onde ela funciona como realidade reificada
  alternative: Usar “vontade” sempre em minúscula como simples atributo
  rationale: A Vontade é apresentada como aquilo em que o Pai repousa e como sua marca, mas a tradução evita defini-la explicitamente como pessoa independente.
- issue: Conhecimento do Oculto
  choice: Traduzir como “conhecimento do Oculto”
  alternative: “gnose do Deus oculto”
  rationale: A formulação direta preserva o valor técnico e a identificação subsequente com o Pai sem acrescentar terminologia polêmica ou explicativa.
- issue: Identificação do Nome do Pai com o Filho
  choice: Traduzir diretamente “O Nome do Pai é o Filho”
  alternative: Parafrasear o Nome como mera revelação feita pelo Filho
  rationale: A afirmação forte e ambígua pertence ao próprio argumento do texto e não deve ser atenuada por interpretação denominacional.
- issue: O Pai gera o Nome para si
  choice: Preservar a formulação reflexiva e paradoxal
  alternative: Explicá-la como nomeação posterior do Filho
  rationale: O texto associa geração, nome e preexistência antes dos éons; explicar essa relação resolveria indevidamente sua tensão metafísica.
translation_notes:
  register: Português moderno, digno e legível, com preferência por construções correntes no Brasil e compreensíveis internacionalmente. Mantiveram-se maiúsculas apenas nas abstrações claramente reificadas pelo discurso (Pensamento, Vontade, Nome) e nos títulos (Pai, Filho, Oculto). A sintaxe contemplativa e algumas formulações paradoxais foram conservadas, mas os períodos foram organizados para leitura pública clara.
