theological_decisions:
- issue: Relação causal entre o Pai e o Esquecimento
  choice: “por causa dele”, esclarecido pelo fato de o Pai não ser conhecido
  alternative: “a partir do Pai” ou “por meio do Pai”
  rationale: O trecho nega expressamente que o Esquecimento proceda do Pai e, em seguida, apresenta o desconhecimento do Pai como a ocasião de seu surgimento. A tradução mantém essa tensão entre origem negada e causa circunstancial.
- issue: Natureza da beleza preparada pelo Erro
  choice: “certa beleza” ligada a um substituto enganoso
  alternative: beleza genuína apenas mal compreendida
  rationale: O texto associa essa beleza à ação enganosa do Erro e a contrapõe à Verdade, que está além da beleza; não se afirma, contudo, mais do que o caráter substitutivo dessa apresentação.
- issue: Personificação de Erro, Esquecimento e Verdade
  choice: iniciais maiúsculas e concordância com substantivos abstratos
  alternative: tratar todos apenas como conceitos impessoais
  rationale: A fonte atribui ação especialmente ao Erro e estabelece uma oposição dramática entre essas realidades. A capitalização torna isso visível sem pressupor que sejam pessoas em sentido pleno.
- issue: “Os que estão no meio”
  choice: preservar a expressão espacial ambígua
  alternative: identificá-los como uma classe cosmológica específica
  rationale: A expressão pode ter valor técnico no ambiente do tratado, mas o trecho não define o grupo. A tradução evita importar um sistema interpretativo não explicitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantiveram-se os períodos argumentativos e as imagens da fonte, mas com pontuação atual. “Inabarcável” e “Inconcebível” preservam o registro elevado; “não deem atenção” comunica a exortação sem arcaísmo. As maiúsculas em Pai, Erro, Esquecimento e Verdade sinalizam o uso titular ou personificado do tratado.
