  consult_excerpt: 'Since all searched for the one from whom they had come – all were within him, the uncontainable, inconceivable one who’s beyond every thought – (and) since ignorance of the Father caused anguish and terror, and the anguish grew thick like a fog, so that no one could see – Error was strengthened. It worked on its own matter in vain, not knowing the Truth.

    It happened in a deluding way, as it (Error) prepared with power, in beauty, a substitute for the Truth. Now this wasn’t humiliating for the uncontainable, inconceivable one, because the anguish and forgetfulness and delusion of deceit were like nothing, whereas the Truth is established, unchangeable, unperturbed, beyond beauty. Because of this, disregard Error, since it has no root.

    It happened in a fog concerning the Father. It happens (now) since it (Error) prepares works in forgetfulness and terror, so that with them it (Error) might attract those in the middle and imprison them.

    The forgetfulness of Error wasn’t revealed; it wasn’t a 18 [thought] from the Father. Forgetfulness didn’t come into being from the Father, though it did come into being because of him. What comes into being within him is the knowledge, which was revealed so that forgetfulness might be dissolved, and the Father might be known. Forgetfulness came into being because the Father was unknown, so when the Father comes to be known, forgetfulness won’t exist anymore.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/002.yaml
  text: 'Since all were searching for the One from whom they had come forth — and they were all within him, the uncontainable, inconceivable One beyond every thought — and since ignorance of the Father brought distress and dread, and the distress thickened like a fog so that no one could see, Error was strengthened. It worked at its own matter to no purpose, because it did not know the Truth.


    It came about in a delusive manner: Error arrayed, with power and with a certain beauty, a substitute for the Truth. Yet this did not disgrace the Uncontainable, the Inconceivable; for the distress and the Forgetfulness and the illusion of deceit are as nothing, while the Truth stands firm — unchanging, untroubled, beyond beauty. Because of this, disregard Error, for it has no root.


    It happened in a fog with respect to the Father; and it happens even now: Error prepares works in Forgetfulness and in fear, so that by means of them it might draw those who are in the middle and imprison them.


    The Forgetfulness of Error was not revealed; it was not a thought from the Father. Forgetfulness did not come into being from the Father — though it did come into being on account of him. What comes into being within him is the knowledge, which was manifested so that Forgetfulness might be dissolved and the Father might be known. Since Forgetfulness arose because the Father was unknown, once the Father comes to be known, Forgetfulness will no longer exist.'
translation:
  language: pt
  text: '**O Erro e o Esquecimento**


    Visto que todos buscavam aquele de quem haviam procedido — e todos estavam nele, o Inabarcável, o Inconcebível, aquele que está além de todo pensamento —, e visto que o desconhecimento do Pai causou angústia e terror, e a angústia se adensou como neblina, de modo que ninguém conseguia ver, o Erro ganhou força. Trabalhou inutilmente em sua própria matéria, pois não conhecia a Verdade.


    Isso aconteceu de maneira enganosa: com poder e certa beleza, o Erro preparou um substituto para a Verdade. Isso, porém, não humilhou o Inabarcável, o Inconcebível, pois a angústia, o Esquecimento e a ilusão do engano nada são, enquanto a Verdade permanece firme — imutável, imperturbável e além da beleza. Por isso, não deem atenção ao Erro, pois ele não tem raiz.


    Isso aconteceu numa neblina a respeito do Pai; e ainda acontece: o Erro prepara obras no Esquecimento e no medo, para, por meio delas, atrair os que estão no meio[a] e aprisioná-los.


    O Esquecimento do Erro não foi revelado; não era um pensamento procedente do Pai. O Esquecimento não veio a existir a partir do Pai, embora tenha vindo a existir por causa dele[b]. O que vem a existir nele é o conhecimento, que foi manifestado para que o Esquecimento se dissolvesse e o Pai fosse conhecido. Como o Esquecimento surgiu porque o Pai não era conhecido, quando o Pai vier a ser conhecido, o Esquecimento deixará de existir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Os que estão no meio” pode designar os que ocupam uma posição intermediária; o texto não explica aqui quem são.
    reason: Preservar uma possível nuance cosmológica sem impor uma identificação doutrinária.
  - marker: b
    text: Isto é, porque ele não era conhecido, e não porque o Esquecimento tivesse sua origem no Pai.
    reason: Esclarecer a distinção causal expressa no próprio contexto e impedir que “por causa dele” seja confundido com procedência.
lexical_decisions:
- source_word: ⲧⲡⲗⲁⲛⲏ
  choice: o Erro
  rationale: O termo designa erro, desvio ou engano e aparece personificado em oposição à Verdade; a inicial maiúscula preserva essa função literária e cosmológica.
- source_word: ⲁⲧⲙⲉⲉⲩⲉ
  choice: o Esquecimento
  rationale: Expressa ausência de lembrança ou pensamento. “Esquecimento” é natural em português e, com maiúscula, conserva sua personificação no argumento.
- source_word: ⲡⲓⲱⲧ
  choice: o Pai
  rationale: Título central da fonte para a origem transcendente; a forma tradicional é clara e não acrescenta definição doutrinária.
- source_word: ⲥⲁⲩⲛⲉ
  choice: angústia
  rationale: No agrupamento com terror e neblina, “angústia” comunica sofrimento opressivo melhor do que uma tristeza genérica.
- source_word: ⲟⲩⲱⲛϩ
  choice: foi manifestado
  rationale: Mantém a força revelatória do verbo no contexto em que o conhecimento se torna patente e desfaz o Esquecimento.
- source_word: ⲧⲙⲛⲧⲙⲏⲉ
  choice: a Verdade
  rationale: A abstração é personificada e contraposta ao Erro; a maiúscula reproduz essa oposição sem a explicar além do texto.
- source_word: ⲡⲕⲉⲕⲉⲓ
  choice: a neblina
  rationale: Preserva a imagem de obscuridade densa que impede a visão e representa o desconhecimento do Pai.
