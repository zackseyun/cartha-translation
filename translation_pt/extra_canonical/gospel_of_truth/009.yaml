lexical_decisions:
- source_word: ⲟⲉⲓⲛ
  choice: Luz
  rationale: A inicial maiúscula assinala a Luz como realidade salvífica personificada no discurso do tratado.
- source_word: ⲡϣⲉϫⲉ
  choice: Palavra
  rationale: Preserva o sentido de palavra ou enunciado revelador e sua possível função técnica, sem recorrer ao termo menos acessível «Logos».
- source_word: ⲁⲧⲉⲙⲁϩⲧⲉ
  choice: aquele que não pode ser contido
  rationale: Expressa concretamente a formação negativa ligada a segurar ou conter e mantém a descrição transcendente do Pai.
- source_word: ⲧⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: incorruptibilidade
  rationale: Conserva a qualidade abstrata que explica por que o caminho dele não podia ser impedido; «inapreensível» traduz a qualificação associada no contexto.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Conhecimento
  rationale: A inicial maiúscula preserva o peso salvífico e técnico do conhecimento no tratado, em linguagem portuguesa acessível.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Erro
  rationale: O substantivo é apresentado como força ou domínio atuante; a inicial maiúscula comunica essa personificação.
- source_word: ⲥⲁⲓ
  choice: cativeiro
  rationale: Transmite um estado de sujeição oposto à libertação oferecida pela revelação.
- source_word: ⲕⲟⲗⲁⲥⲓⲥ
  choice: castigos
  rationale: Sentido básico do empréstimo grego no plural e par natural de «açoites».
- source_word: ⲙⲁⲥⲧⲓⲅⲝ
  choice: açoites
  rationale: Mantém a imagem concreta de punição física sem diluí-la no termo genérico «tormentos».
- source_word: ⲙⲁⲉⲓⲧ
  choice: Caminho
  rationale: Reproduz a função orientadora e salvífica na série final; a inicial maiúscula acompanha os demais predicados de peso técnico.
theological_decisions:
- issue: Personificação de ⲡⲗⲁⲛⲏ
  choice: «Erro», com inicial maiúscula, como poder ou domínio hostil
  alternative: «engano», como substantivo comum
  rationale: O contexto atribui ao Erro atuação sobre pessoas; a personificação preserva a cosmologia do texto sem explicá-la além do que ele diz.
- issue: Genitivo em «Espírito de poder»
  choice: Manter «o Espírito de poder»
  alternative: «o Espírito poderoso»
  rationale: A construção nominal preserva a forma e a ambiguidade do original, sem reduzir o poder a mero adjetivo.
- issue: Relação entre a vinda carnal e a incorruptibilidade
  choice: Manter lado a lado «forma carnal» e «incorruptibilidade»
  alternative: Harmonizar a tensão por meio de uma paráfrase cristológica
  rationale: O texto afirma ambas as ideias e não explica sua relação; a tradução não impõe uma solução doutrinária.
- issue: Agente dos castigos e açoites
  choice: Retomar «castigos e açoites» com «estes» e «os»
  alternative: Identificá-los explicitamente com seres ou poderes demoníacos
  rationale: O original permite linguagem reificada ou personificada, mas não exige uma identificação denominacional ou ontológica mais específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. Foram mantidas as imagens de sopro, parto, caminho e contaminação. As maiúsculas em Luz, Pensamento, Palavra, Erro e Conhecimento indicam o uso reificado ou técnico no tratado. Não se reproduziu a nota inglesa anterior porque a revisão textual mais recente identifica seu conteúdo como tradução fantasma resultante de erros de OCR; por isso, não há marcadores nem notas nesta seção.
