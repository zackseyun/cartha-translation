- from: 'Quando ele se revelou, ensinou-lhes acerca do Pai — aquele que não pode ser contido — e soprou neles o que está no Pensamento, cumprindo a vontade dele. Muitos receberam a Luz e se voltaram para ele, pois os que pertenciam à matéria eram estranhos: não contemplaram sua forma nem o conheceram. Ele veio por meio de uma forma carnal, e nada pôde impedir seu caminho, porque a incorruptibilidade é inapreensível.


    Ele disse coisas novas ao expressar o que está no coração do Pai e trouxe à luz a Palavra completa. Quando a Luz falou por sua boca e sua voz deu à luz a vida, ele lhes deu Pensamento, entendimento, misericórdia, salvação e o Espírito de poder, procedentes da infinitude e da doçura do Pai.


    Ele fez cessar os castigos e os açoites, pois estes conduziam ao Erro e ao cativeiro os que necessitavam de misericórdia. Ele os desfez e, por meio do Conhecimento, lançou-os em confusão.


    Assim, ele se tornou:


    — Caminho para os que andavam perdidos;


    — Conhecimento para os que eram ignorantes;


    — Descoberta para os que buscavam;


    — Força para os que vacilavam;


    — Pureza para os que estavam contaminados.'
