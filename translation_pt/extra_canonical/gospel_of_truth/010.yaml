  consult_excerpt: 'He’s the shepherd who left behind the ninety- 32 nine sheep which weren’t lost. He went and searched for the one which was lost. He rejoiced when he found it, because ninety-nine is a number expressed with the left hand. However, when the one is found, the numerical sum moves to the right hand. In this way, what needs the one – that is, the whole right hand – draws what it needs, takes it from the left hand, and moves it to the right, so the number becomes one hundred. This is a symbol of the sound of these numbers; this is the Father.

    Even on the Sabbath, he worked for the sheep which he found fallen in the pit. He saved the life of the sheep, having brought it up from the pit, so that you may know in your hearts – you’re children of the knowledge of the heart – what is the Sabbath, on which it isn’t right for salvation to be idle, so that you may speak of the day which is above, which has no night, and of the light that doesn’t set, because it’s complete. Speak then from the heart, because you’re the completed day, and the light that doesn’t cease dwells within you. Speak of the Truth with those who search for it, and of knowledge with those who’ve sinned in their Error.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/010.yaml
  text: 'He is the shepherd who left the ninety‑nine sheep that had not gone astray[a], and he went and sought the one that had wandered. When he found it, he rejoiced over it, because ninety‑nine is a number on the left hand. But when the one is found, the reckoning moves to the right hand. In this way, what needs the one—that is, the whole of the right hand—draws what it needs, taking it from the left hand and transferring it to the right, so that the number becomes a hundred. This is a sign of the sound of these numbers; it is the Father.


    Even on the Sabbath he labored for the sake of the sheep that he found fallen into the pit. He saved the life of the sheep, having brought it up out of the pit, so that you may know in your heart—since you are children of the knowledge of the heart—what the Sabbath is: that on it it is not fitting for salvation to be idle, so that you may speak of the Day which is above, which has no night, and of the Light that does not set, because it is complete. Speak, then, from the heart, for you are the perfect Day, and the light that does not fail dwells within you. Speak of the Truth with those who seek it[b], and of Knowledge with those who have sinned in their Error.'
translation:
  language: pt
  text: 'Ele é o pastor que deixou as noventa e nove ovelhas que não se haviam perdido e foi procurar a que se desviara. Quando a encontrou, alegrou-se por causa dela, pois noventa e nove é um número representado na mão esquerda. Quando, porém, o um é encontrado, a contagem passa para a mão direita. Assim, aquilo que precisa do um — isto é, a mão direita inteira — atrai o que lhe falta, tomando-o da mão esquerda e transferindo-o para a direita, de modo que o número se torna cem. Este é um sinal do som[a] desses números: é o Pai.


    Mesmo no sábado, ele trabalhou pela ovelha que encontrou caída numa cova. Salvou a vida da ovelha, tirando-a da cova, para que vocês saibam em seu coração — pois são filhos do conhecimento do coração — o que é o sábado: nele não convém que a salvação fique inativa. Assim, vocês poderão falar do Dia que está no alto, que não tem noite, e da Luz que não se põe, porque é completa. Falem, portanto, a partir do coração, pois vocês são o Dia completo, e a Luz que não se extingue habita em vocês. Falem da Verdade com os que a procuram e do Conhecimento com os que pecaram em seu Erro.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “da voz”.
    reason: O termo na expressão acústica pode ser entendido como 'som' ou 'voz'; a nota preserva a ambiguidade sem sugerir no texto principal um sujeito falante.
lexical_decisions:
- source_word: ⲥⲁⲩ
  choice: ovelha(s)
  rationale: É o termo copta comum para ovelha; o número é determinado pelo contexto, que alterna entre as noventa e nove e a ovelha individual.
- source_word: ⲥⲱⲣⲙ / forma verbal de desviar-se
  choice: não se haviam perdido / se desviara
  rationale: A variação verbal do copta é preservada em português sem acrescentar a noção não expressa de estar 'no Erro' na primeira frase.
- source_word: ⲟⲩⲱⲡⲉ
  choice: número / contagem
  rationale: O contexto trata de numeração manual; 'número' designa o valor e 'contagem' expressa naturalmente sua passagem de uma mão para a outra.
- source_word: ⲧⲁⲉⲓⲉ / ⲙⲣⲏⲧⲉ
  choice: mão esquerda / mão direita
  rationale: A explicitação de 'mão' conserva o contraste do antigo sistema de contagem manual.
- source_word: ⲧⲱⲱⲛⲉ
  choice: o um
  rationale: Trata-se do numeral que completa noventa e nove; a minúscula evita transformá-lo sem necessidade em título metafísico.
- source_word: ⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: sábado
  rationale: É a forma portuguesa corrente para a referência judaica ao Sabbath, adequada ao registro narrativo.
- source_word: ⲡⲟⲩϫⲁⲉⲓ
  choice: salvação
  rationale: Mantém o peso soteriológico do substantivo, em vez de reduzi-lo apenas a um resgate físico.
- source_word: ϫⲏⲕ
  choice: completa / completo
  rationale: Preserva a ideia de plenitude ou consumação tanto para a Luz quanto para o Dia, sem introduzir uma distinção lexical ausente do copta.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Erro
  rationale: No encerramento, o empréstimo grego funciona no contraste técnico com Conhecimento; a inicial maiúscula sinaliza essa dimensão personificada sem explicá-la em excesso.
theological_decisions:
- issue: Personificação de ⲡⲗⲁⲛⲏ
  choice: Erro, com inicial maiúscula, somente na ocorrência nominal final
  alternative: erro, em sentido genérico; ou inserir 'no Erro' na procura da ovelha
  rationale: O uso final participa da oposição característica entre Erro e Conhecimento. A frase inicial, porém, emprega linguagem verbal de desvio e não justifica acrescentar a entidade 'Erro'.
- issue: Imagem transcendente do Dia, da Luz, da Verdade e do Conhecimento
  choice: Iniciais maiúsculas nos termos empregados como realidades simbólicas ou metafísicas
  alternative: Minúsculas em todos os termos
  rationale: As maiúsculas preservam o caráter técnico do discurso do Evangelho da Verdade sem identificar essas imagens com uma formulação doutrinária posterior.
- issue: A salvação no sábado
  choice: '''não convém que a salvação fique inativa'''
  alternative: '''não é lícito deixar de salvar'''
  rationale: A formulação escolhida conserva a personificação e a tensão soteriológica do substantivo copta, sem reduzir a sentença a uma regra moral sobre resgates.
- issue: Conhecimento do coração
