  consult_excerpt: 'This is the Word of the Gospel of the discovery of the fullness, which comes for those who are awaiting 35 the salvation which is coming from above. The hope for which they’re waiting is waiting for those whose image is light with no shadow in it. If at that time the fullness comes, the need of matter doesn’t come through the infinity of the Father, who comes to give time to the need – although no one can say that the incorruptible one will come like this. But the depth of the Father multiplied, and the thought of Error didn’t exist with him. It’s something that’s fallen, which is easily set upright in the discovery of the one who’s to come to what he’ll return, because the return is called “repentance.”

    Because of this, incorruptibility breathed out. It followed after the one who sinned, so that they might rest, because forgiveness is what remains for the light in need, the Word of fullness. For the doctor hurries to the place where there’s sickness, because that’s what he (or she) wants to do. The one in need, then, doesn’t hide it, because one (the doctor) has what they need. In this way the fullness, which has no need but fills the need, is what he 36 provided from himself to fill up what’s needed, so that they might receive grace; because when they were in need, they didn’t have grace. Because of this, a diminishing took place where there is no grace. When what was diminished was restored, what they needed was revealed as fullness. This is the discovery of the light of Truth which enlightened them, because it doesn’t change.

    Because of this, they spoke of Christ in their midst: “Seek, and those who were disturbed will receive a return – and he’ll anoint them with ointment.” The ointment is the mercy of the Father, who will have mercy on them. But those whom he anointed are those who have been completed, because full jars are the ones that are anointed. But when the anointing of one dissolves, it empties, and the cause of the need is the place where the ointment leaks, because a breath and its power draws it. But from the one who has no need, no seal is removed, nor is anything emptied, but what it needs is filled again by the Father, who’s complete.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/012.yaml
  text: 'The speech of the Good News about the finding of the Fullness is for those who await the salvation that comes from above[a]. While they wait for it, the hope belongs to those whose image is light with no shadow in it. When, then, the Fullness arrives, the need of hylē (matter) is not from the immeasurability of the Father; he comes to grant a season to the need. Yet no one is able to say that the Incorruptible comes in such a manner. Rather, the Depth of the Father grew and multiplied, and the thought of Error was not with him. Error is a fall—something easy to set upright by the finding of the one who will come back to that to which he returns, for the return is named change of mind.


    Because of this, Incorruptibility breathed forth; it pursued the one who had sinned, so that he might find rest. For what remains for the light in need is forgiveness—the Word of the Fullness. For the physician runs to the place where sickness is, because that is what he wills. And the one in need does not hide, for someone possesses what that one needs. In this way the Fullness—which has no need—provided from itself to fill up the need, so that they might receive grace. For when they were in need, grace was not with them. Because of this, a diminishing took place where there is no grace; and when what was diminished was restored, the need was shown as Fullness. This is the finding of the light of the Truth that enlightened them, for it is unchangeable.


    Because of this, they spoke concerning the Messiah in their midst: “Seek, and those who were disturbed will return, and he will anoint them with chrism.” The chrism is the mercy of the Father, and he will have mercy on them. Now those whom he anointed are the perfect—for full vessels are the ones anointed. But when the anointing of one dissolves, it is emptied, and the cause of the need is the place where the ointment leaks out, because a breath and its power draw it. Yet from the one who has no need no seal is loosened, and nothing is emptied; rather, what it needs the Father—who is complete—fills again with him. He is good; he knows his plantings, because it is he who planted them in his Paradise[c][b]. Now his Paradise is his place of rest.'
translation:
  language: pt
  text: 'A Palavra da Boa-Nova acerca da descoberta da Plenitude destina-se aos que aguardam a salvação que vem do alto.[a] Enquanto a aguardam, a esperança pertence àqueles cuja imagem é luz sem sombra alguma. Portanto, quando a Plenitude chega, a necessidade da matéria — hylē — não procede da infinitude do Pai; ele vem conceder um tempo à necessidade. Contudo, ninguém é capaz de dizer que o Incorruptível venha dessa maneira. Pelo contrário, a Profundidade do Pai cresceu e se multiplicou, e o pensamento do Erro não estava com ele. O Erro é uma queda, algo que facilmente se põe de pé mediante a descoberta daquele que voltará àquilo para onde retorna, pois o retorno recebe o nome de mudança de mente.[b]


    Por isso, a Incorruptibilidade soprou e foi atrás daquele que havia pecado, para que ele encontrasse descanso. Pois o que resta para a luz necessitada é o perdão — a Palavra da Plenitude. O médico corre para onde há doença, porque essa é a sua vontade. E quem está em necessidade não a esconde, pois há alguém que possui aquilo de que ele necessita. Assim, a Plenitude, que não tem necessidade alguma, forneceu de si mesma o que preencheria a necessidade, para que eles recebessem graça. Pois, quando estavam em necessidade, não tinham a graça consigo. Por isso houve uma diminuição onde não havia graça. Quando aquilo que havia diminuído foi restaurado, o que faltava revelou-se como Plenitude. Essa é a descoberta da luz da Verdade, que os iluminou, pois ela é imutável.


    Por isso, falaram a respeito do Messias[c] no meio deles: “Busquem, e os que foram perturbados retornarão; e ele os ungirá com o crisma”.[d] O crisma é a misericórdia do Pai, e ele terá misericórdia deles. Os que ele ungiu são os perfeitos, pois os recipientes cheios são os que são ungidos. Mas, quando a unção de um deles se desfaz, ela se esvazia; e a causa da necessidade é o lugar por onde o unguento escorre, porque um sopro, com sua força, o atrai. Contudo, daquele que não tem necessidade, selo algum é desatado, nem coisa alguma se esvazia. Antes, aquilo de que ele necessita, o Pai — que é completo — torna a preencher consigo mesmo.[e] Ele é bom e conhece suas plantações, porque foi ele quem as plantou em seu Paraíso. Ora, seu Paraíso é seu lugar de descanso.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução possível: “A Palavra da Boa-Nova acerca da descoberta da Plenitude vem aos que estão esperando — a esperança que aguardam pertence àqueles cuja imagem é luz sem sombra alguma”.'
    reason: A sintaxe do início e o vínculo entre ‘vir’, ‘aguardar’, ‘salvação’ e ‘esperança’ admitem mais de uma segmentação.
  - marker: b
    text: Ou “arrependimento”. O termo grego metanoia pode indicar mudança de mente, conversão ou arrependimento.
    reason: Preserva a amplitude semântica do empréstimo grego e a tradução religiosa tradicional.
  - marker: c
    text: Ou “Cristo”.
    reason: O nome abreviado copta representa o grego Christos, que pode funcionar como título (‘Messias’) ou como designação tradicional (‘Cristo’).
  - marker: d
    text: “Crisma” é o óleo de unção; também se pode traduzir aqui simplesmente por “óleo” ou “unguento”.
    reason: Esclarece um termo ritual pouco comum sem eliminar a imagem material do texto.
  - marker: e
    text: 'A referência dos pronomes nesta frase é incerta; também é possível entender: “Antes, o Pai, que é completo, torna a preencher aquilo que lhe falta”.'
    reason: A construção copta permite mais de uma identificação para aquilo ou aquele que é preenchido.
lexical_decisions:
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Plenitude
  rationale: Preserva o sentido literal e o peso técnico do termo grego plērōma no discurso valentiniano, sem exigir transliteração no corpo do texto.
- source_word: ⲧϩⲩⲗⲏ
  choice: matéria — hylē
  rationale: Traduz o empréstimo filosófico grego de modo compreensível e conserva sua forma técnica para sinalizar a ressonância cosmológica.
- source_word: ⲁⲧⲧⲉⲕⲟ / ⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: Incorruptível / Incorruptibilidade
  rationale: Distingue o uso pessoal do abstrato e mantém a terminologia ligada ao que não sofre corrupção.
- source_word: ⲃⲁⲑⲟⲥ
  choice: Profundidade
  rationale: Mantém literalmente o epíteto cosmológico do Pai, sem o interpretar como um abismo hostil.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Erro
  rationale: Conserva a personificação teológica do termo e sua ligação contextual com pensamento, queda e restauração.
- source_word: ⲙⲉⲧⲁⲛⲟⲓⲁ
  choice: mudança de mente
  rationale: Expõe o valor cognitivo do empréstimo grego no paralelo explícito com retorno, enquanto a nota preserva a tradução tradicional.
- source_word: ⲡⲥⲁⲉⲓⲛ
  choice: médico
  rationale: Forma corrente e natural em português para o agente da metáfora terapêutica.
- source_word: ⲧⲱϩⲥ
  choice: recipientes
  rationale: Mantém a imagem concreta de objetos que podem ser cheios, ungidos e esvaziados, evitando uma espiritualização antecipada.
- source_word: ⲧⲉⲗⲓⲟⲥ
  choice: perfeitos
  rationale: Preserva o registro técnico do empréstimo grego e sua associação imediata com plenitude e completude.
- source_word: ⲥⲧⲟ / ⲧⲱϩⲥ
  choice: crisma / óleo / unção
  rationale: Usa 'crisma' onde a dimensão ritual é explícita, mas emprega 'óleo' e 'unção' nas frases em que a ação física de escorrer ou desfazer-se precisa permanecer clara.
- source_word: ⲡⲭⲥ
  choice: Messias
  rationale: Traduz o valor titular de Christos; a nota registra a forma tradicional 'Cristo'.
- source_word: ⲡϣⲧⲁ
  choice: necessidade / aquilo que faltava
  rationale: Conserva o contraste com preencher e Plenitude, variando apenas onde a expressão idiomática portuguesa exige maior naturalidade.
- source_word: ⲧⲱϭⲉ
  choice: plantar / plantações
  rationale: Restaura a metáfora agrícola confirmada no manuscrito e sua ligação com o Paraíso do Pai.
theological_decisions:
- issue: Sentido de ⲙⲉⲧⲁⲛⲟⲓⲁ
  choice: mudança de mente
  alternative: arrependimento
  rationale: O texto define o termo por meio do retorno, deixando em primeiro plano a reorientação; a alternativa tradicional é mantida em nota sem impor uma leitura penitencial.
- issue: Título ⲡⲭⲥ
  choice: Messias
  alternative: Cristo
  rationale: O contexto apresenta um título sobre o qual se fala; a nota conserva a forma cristológica tradicional.
- issue: Imagens do crisma e do selo
  choice: crisma; selo
  alternative: óleo de unção; marca
  rationale: A linguagem ritual é mantida sem explicar seu mecanismo sacramental ou vinculá-la a uma tradição eclesial posterior.
- issue: Relação entre necessidade, matéria e o Pai
  choice: a necessidade da matéria não procede da infinitude do Pai
  alternative: a necessidade da matéria não vem por meio da infinitude do Pai
  rationale: A formulação preserva a negação de origem sem resolver plenamente a difícil sintaxe da passagem nem atribuir a necessidade ao Pai.
- issue: Agente e complemento na frase final sobre o preenchimento
  choice: o Pai torna a preencher consigo mesmo aquilo de que ele necessita
  alternative: o Pai torna a preencher aquilo que lhe falta
  rationale: Mantém a imagem de preenchimento pelo Pai e evita decidir de modo excessivo se o pronome se refere à pessoa, ao recipiente ou à carência.
translation_notes:
  register: Português moderno, digno e amplamente internacional, com legibilidade brasileira. Mantiveram-se em maiúscula os termos personificados ou técnicos centrais — Plenitude, Incorruptível, Incorruptibilidade, Profundidade, Erro e Verdade — e evitou-se explicar o sistema valentiniano dentro da tradução. A prosa conserva as repetições deliberadas de necessidade, preencher, graça e plenitude, mas reduz rigidez sintática quando isso não altera a ambiguidade do copta.
