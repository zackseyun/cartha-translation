- from: 'A Palavra da Boa-Nova acerca da descoberta da Plenitude destina-se aos que aguardam a salvação que vem do alto.[a] Enquanto a aguardam, a esperança pertence àqueles cuja imagem é luz sem sombra alguma. Portanto, quando a Plenitude chega, a necessidade da matéria — hylē — não procede da infinitude do Pai; ele vem conceder um tempo à necessidade. Contudo, ninguém é capaz de dizer que o Incorruptível venha dessa maneira. Pelo contrário, a Profundidade do Pai cresceu e se multiplicou, e o pensamento do Erro não estava com ele. O Erro é uma queda, algo que facilmente se põe de pé mediante a descoberta daquele que voltará àquilo para onde retorna, pois o retorno recebe o nome de mudança de mente.[b]


    Por isso, a Incorruptibilidade soprou e foi atrás daquele que havia pecado, para que ele encontrasse descanso. Pois o que resta para a luz necessitada é o perdão — a Palavra da Plenitude. O médico corre para onde há doença, porque essa é a sua vontade. E quem está em necessidade não a esconde, pois há alguém que possui aquilo de que ele necessita. Assim, a Plenitude, que não tem necessidade alguma, forneceu de si mesma o que preencheria a necessidade, para que eles recebessem graça. Pois, quando estavam em necessidade, não tinham a graça consigo. Por isso houve uma diminuição onde não havia graça. Quando aquilo que havia diminuído foi restaurado, o que faltava revelou-se como Plenitude. Essa é a descoberta da luz da Verdade, que os iluminou, pois ela é imutável.


    Por isso, falaram a respeito do Messias[c] no meio deles: “Busquem, e os que foram perturbados retornarão; e ele os ungirá com o crisma”.[d] O crisma é a misericórdia do Pai, e ele terá misericórdia deles. Os que ele ungiu são os perfeitos, pois os recipientes cheios são os que recebem a unção. Mas, quando a unção de um deles se desfaz, ele se esvazia; e a causa da necessidade é o lugar por onde o óleo escorre, porque um sopro, com sua força, o atrai. Contudo, daquele que não tem necessidade, selo algum é desatado, nem coisa alguma se esvazia. Antes, aquilo de que ele necessita, o Pai — que é completo — torna a preencher consigo mesmo.[e] Ele é bom e conhece suas plantações, porque foi ele quem as plantou em seu Paraíso. Ora, seu Paraíso é seu lugar de descanso.'
