  source_fidelity: 'Em geral, a tradução acompanha de perto o copta e preserva adequadamente os termos técnicos e as ambiguidades centrais. Há, porém, uma imprecisão na imagem dos recipientes: o texto diz que os recipientes cheios são os que são ungidos, não apenas os que ‘recebem a unção’. Além disso, na sequência, o referente imediato que se dissolve e se esvazia é a unção, e o líquido que escorre é melhor mantido como ‘unguento’, conforme a imagem do texto, do que especificado como ‘óleo’.'
  naturalness: O português é claro, moderno e de registro apropriado. A revisão torna a cadeia de imagens — unção, recipiente, unguento e vazamento — mais coesa e menos sujeita a uma leitura em que a pessoa, em vez da unção, se esvazia.
  terminology: ‘Plenitude’, ‘matéria — hylē’, ‘Incorruptível’, ‘Incorruptibilidade’, ‘Profundidade’, ‘Erro’, ‘mudança de mente’, ‘crisma’, ‘Messias’ e ‘Paraíso’ são escolhas defensáveis e consistentes. As notas preservam alternativas relevantes sem impor uma interpretação confessional.
  issues:
  - severity: medium
    issue: Os recipientes cheios são descritos como os que ‘recebem a unção’.
    rationale: O copta e o rastro inglês dizem que os recipientes cheios são aqueles que são ungidos. ‘Recebem a unção’ é possível como paráfrase, mas enfraquece a construção passiva e a ligação direta entre os recipientes e a unção.
  - severity: medium
    issue: ‘Quando a unção de um deles se desfaz, ele se esvazia’ desloca o referente para uma pessoa masculina; ‘óleo’ especifica indevidamente o líquido.
    rationale: A cadeia sintática e a imagem do texto tratam da unção que se dissolve/esvazia e do unguento que escorre. Em português, ‘ele’ tende a identificar o recipiente ou a pessoa como o que se esvazia. ‘Unguento’ mantém o termo material sem decidir que se trata especificamente de óleo.
