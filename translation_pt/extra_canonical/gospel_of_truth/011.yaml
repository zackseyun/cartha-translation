  consult_excerpt: '33 Strengthen the feet of those who stumble, and reach out to those who are sick. Feed those who are hungry, and give rest to those who are weary. Raise up those who want to arise, and awaken those who sleep, because you’re the understanding that’s unsheathed. If strength is like this, it becomes stronger.

    Be concerned about yourselves. Don’t be concerned about other things which you’ve rejected from yourselves. Don’t return to eat your vomit. Don’t be eaten by worms, because you’ve already shaken it off. Don’t become a dwelling-place for the devil, because you’ve already brought him to naught. Don’t strengthen your obstacles which are collapsing, as though you’re a support. For the lawless one is nothing, to be treated more harshly than the just, doing his works among others.

    Do then the Father’s will, because you’re from him. For the Father is sweet, and goodness is in his will. He knows what’s yours, that you may find rest in them. For by the fruits they know what’s yours, because the children of the Father 34 are his fragrance, since they’re from the grace of his expression. Because of this, the Father loves his fragrance, and reveals it in every place. And when it mixes with matter, it gives his fragrance to the light, and in tranquility he causes it to rise above every form and every sound. For it’s not the ears that smell the fragrance, but it’s the Spirit that smells, and draws the fragrance to itself, and sinks down into the Father’s fragrance. He shelters it, then, and takes it to the place from which it came, from the first fragrance which has grown cold. It’s something in a soul-endowed delusion, like cold water sunk into loose earth. Those who see it think that it’s just earth. Afterwards, it dissolves again. If a breath draws it, it becomes warm.
    So the fragrances which are cold are from the division. Because of this, faith came. It dissolved the division, and it brought the fullness that’s warm with love, so that the cold may not return, but rather the unitary thought of completion.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/011.yaml
  text: 'Make firm the feet of those who stumble[a]; stretch out a hand to the sick. Give food to those who are hungry, and give rest to those who are weary. Raise up those who wish to arise, and awaken those who sleep—for you are the Understanding that has been unsheathed. And if strength is of this sort, it grows stronger.


    Be concerned for yourselves; do not be concerned with other things that you have cast away from yourselves. Do not turn back to eat your vomit. Do not be moth-eaten, do not be worm-eaten, for you have already shaken it off. Do not become a house for the Devil, for you have already brought him to nothing. Do not prop up your stumbling-blocks that are collapsing, as though you were a support. For the lawless one is nothing, to be dealt with more severely than the just, while doing his works among others.


    Therefore do the Father’s will, because you are from him. For the Father is sweet, and goodness is in his will. He knows what is yours, so that you may find rest in them. For by the fruits they know what is yours, because the children of the Father are his fragrance, since they come from the grace of his Face. For this reason the Father loves his fragrance and reveals it in every place; and when it mingles with hylē, he gives his fragrance to the Light, and in his quiet he causes it to surpass every form and every sound. For it is not the ears that smell the fragrance, but the Spirit smells it, draws the fragrance to itself, and sinks down into the fragrance of the Father. Then he shelters it and leads it back to the place from which it came—from the first fragrance that had grown cold. It is something within a soul-endowed formation, like cold water sunk into a clod of loose earth[b]. Those who see it suppose it is only earth; afterward it is dissolved again. And if a breath draws it,
    it becomes warm. Thus the fragrances that are cold are from the division. Because of this, Faith came: it dissolved the division and brought the Pleroma that is warm with agapē, so that the cold would not return, but rather the unity (monad) of Thought of perfection[c]. This Logos made it manifest.'
translation:
  language: pt
  text: 'Fortaleçam os pés dos que tropeçam e estendam a mão aos enfermos. Alimentem os que têm fome e deem descanso aos cansados. Levantem os que desejam se levantar e despertem os que dormem, pois vocês são o Entendimento que foi desembainhado. Se a força é assim, ela se torna ainda mais forte.


    Cuidem de vocês mesmos. Não se ocupem de outras coisas que já expulsaram de si. Não voltem a comer o próprio vômito. Não se deixem consumir por traças nem por vermes, pois vocês já se livraram disso. Não se tornem morada do Diabo, pois já o reduziram a nada. Não deem sustentação aos obstáculos que estão desmoronando, como se fossem seu apoio. Pois o transgressor da lei nada é: ele deve ser tratado com mais severidade do que o justo, enquanto pratica suas obras entre os outros.


    Portanto, façam a vontade do Pai, porque vocês procedem dele. O Pai é doce, e em sua vontade há bondade. Ele conhece o que pertence a vocês, para que nisso encontrem descanso. Pois é pelos frutos que se reconhece o que pertence a vocês, porque os filhos do Pai são sua fragrância, já que procedem da graça de seu rosto. Por isso, o Pai ama sua fragrância e a manifesta em todo lugar. Quando ela se mistura com a matéria[a], ele transmite sua fragrância à Luz e, em sua quietude, faz com que ela supere toda forma e todo som. Pois não são os ouvidos que percebem a fragrância; é o Espírito que a percebe, atrai-a para si e mergulha na fragrância do Pai. Então ele a abriga e a conduz de volta ao lugar de onde veio — à fragrância primeira, que havia esfriado.


    Ela é algo presente numa formação dotada de alma, como água fria que penetrou num torrão de terra solta. Os que a veem pensam que é apenas terra; depois, ela torna a se dissolver. E, se um sopro a atrai, ela se aquece. Assim, as fragrâncias frias procedem da divisão. Por isso veio a Fé: ela dissolveu a divisão e trouxe a Plenitude[b], aquecida pelo amor, para que o frio não voltasse, mas permanecesse a unicidade do Pensamento da perfeição. Este é o Logos[c] que revelou a descoberta da Plenitude aos que a buscam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto emprega o termo grego hylē, «matéria», usado aqui em sentido cosmológico.
    reason: Esclarecer o termo técnico sem deixá-lo opaco no texto principal.
  - marker: b
    text: «Plenitude» traduz o grego plērōma, termo que pode indicar a totalidade ou plenitude divina.
    reason: Preservar a densidade teológica e cosmológica do empréstimo grego.
  - marker: c
    text: Logos é um termo grego que pode significar «palavra», «discurso» ou «razão».
    reason: Manter a polissemia do termo em vez de fixar uma única interpretação.
lexical_decisions:
- source_word: ⲧⲁϫⲣⲟ
  choice: fortaleçam
  rationale: Expressa o imperativo de tornar firme ou dar estabilidade; «fortaleçam» é natural em português e preserva a ação sobre os pés dos que tropeçam.
- source_word: ⲙⲛⲧⲣⲙⲛϩⲏⲧ
  choice: Entendimento
  rationale: Mantém a personificação do entendimento no predicativo dirigido à comunidade, sem reduzi-lo a mera capacidade mental.
- source_word: ⲇⲓⲁⲃⲟⲗⲟⲥ
  choice: Diabo
  rationale: O empréstimo grego designa aqui uma potência hostil pessoal; a forma portuguesa tradicional é clara e direta.
- source_word: ⲥⲧⲁⲉⲓ
  choice: fragrância
  rationale: Preserva a metáfora recorrente de identidade, origem e percepção espiritual; «fragrância» tem registro digno sem ser obscuro.
- source_word: ϩⲩⲗⲏ
  choice: matéria
  rationale: Traduz o empréstimo grego hylē em linguagem acessível, com nota que conserva seu valor técnico no discurso cosmológico.
- source_word: ⲥⲱⲣⲁϩⲧ
  choice: quietude
  rationale: Comunica repouso e tranquilidade contemplativa, adequando-se ao contraste com formas e sons.
- source_word: ⲣ ⲥⲁⲧⲡⲉ
  choice: supere
  rationale: O verbo indica excelência ou superioridade qualitativa, não necessariamente ascensão espacial.
- source_word: ⲡⲗⲁⲥⲙⲁ
  choice: formação
  rationale: O empréstimo grego plasma significa algo formado ou moldado; evita a interpretação indevida «ilusão».
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Plenitude
  rationale: Traduz o termo técnico de modo inteligível, mantendo inicial maiúscula e explicação em nota para assinalar seu emprego cosmológico.
- source_word: ⲗⲟⲅⲟⲥ
  choice: Logos
  rationale: A transliteração preserva a amplitude de sentido do termo grego — palavra, discurso, razão — sem decidir silenciosamente entre essas possibilidades.
theological_decisions:
- issue: Personificação da Fé
  choice: «Fé» com inicial maiúscula
  alternative: «fé» como qualidade ou atitude abstrata
  rationale: A sintaxe apresenta a Fé como aquela que vem e age; a maiúscula sinaliza a personificação sem acrescentar uma identificação doutrinária específica.
- issue: Vocabulário cosmológico técnico
  choice: Traduzir hylē como «matéria» e plērōma como «Plenitude», com notas
  alternative: Manter todas as formas gregas transliteradas no corpo do texto
  rationale: A solução mantém legibilidade para leitores comuns e, ao mesmo tempo, registra nas notas os termos técnicos subjacentes.
- issue: Identidade do agente nos movimentos da fragrância
  choice: Preservar a sequência pronominal do texto, sem explicar sistematicamente se o agente é o Pai ou o Espírito
  alternative: Nomear repetidamente um único agente
  rationale: O trecho muda de referentes de maneira densa; explicitar além do texto eliminaria uma ambiguidade genuína.
- issue: Unidade final
  choice: «a unicidade do Pensamento da perfeição»
  alternative: «a mônada do Pensamento perfeito»
  rationale: «Unicidade» expressa o contraste com a divisão e evita importar um esquema técnico mais definido do que a formulação copta exige.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural e vocabulário amplamente compreensível no Brasil e em outros contextos lusófonos. Os termos técnicos foram traduzidos quando isso favorece a leitura, recorrendo a notas breves; «Logos» foi mantido por sua polissemia. A imagética incomum de fragrância, frio, matéria e formação dotada de alma foi preservada, sem normalização doutrinária.
