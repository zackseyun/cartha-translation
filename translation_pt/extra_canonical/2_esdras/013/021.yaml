translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A formulação segue o texto latino fornecido, que começa diretamente com a promessa de explicação e não contém a introdução “ele me respondeu e disse” presente na camada inglesa de consulta.
