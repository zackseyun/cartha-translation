  text: And he answered me and said, “I will tell you the interpretation of the vision, and I will also explain to you the matters about which you have spoken.”
translation:
  language: pt
  text: E eu lhe direi a interpretação da visão, mas também lhe explicarei os assuntos sobre os quais você falou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dicam tibi
  choice: lhe direi
  rationale: Reproduz diretamente o futuro latino e mantém o destinatário explícito de modo natural em português.
- source_word: adaperiam tibi
  choice: lhe explicarei
  rationale: No contexto de interpretação, expressa o sentido figurado de revelar ou esclarecer, sem recorrer a um literalismo pouco natural como “abrirei”.
- source_word: de quibus locutus es
  choice: sobre as quais você falou
  rationale: Preserva a referência às questões mencionadas pelo interlocutor e traduz naturalmente a construção latina com de.
