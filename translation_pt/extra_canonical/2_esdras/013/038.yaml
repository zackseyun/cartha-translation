  text: quibus incipient cruciari, Quae adsimilatae sunt flammae, et perdet eos sine labore et legem quae igni adsimilata est. Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/038.yaml
  text: with which they are about to be tormented, which are likened to a flame; and he will destroy them without effort, and the law, which is likened to fire.
translation:
  language: pt
  text: com as quais começarão a ser atormentados, as quais são comparadas a uma chama; e ele os destruirá sem esforço, e a lei, que é comparada ao fogo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim coordena literalmente “a lei” com “os”, como outro objeto de “destruirá”. Algumas interpretações poderiam tomar a lei como o meio da destruição, mas essa relação não está expressa gramaticalmente no texto latino.
    reason: A construção é semanticamente inesperada e pode suscitar uma leitura instrumental; a nota preserva a forma do texto e informa a ambiguidade interpretativa sem alterar o corpo da tradução.
lexical_decisions:
- source_word: incipient cruciari
  choice: começarão a ser atormentados
  rationale: Reproduz o aspecto incoativo de «incipient» e a construção passiva de «cruciari» em português natural.
- source_word: adsimilatae sunt flammae
  choice: são comparadas a uma chama
  rationale: Mantém a imagem explícita de semelhança, sem transformar a comparação em identidade.
- source_word: sine labore
  choice: sem esforço
  rationale: Expressa de modo corrente a ideia de realizar algo sem trabalho ou dificuldade.
- source_word: legem quae igni adsimilata est
  choice: a lei, que é comparada ao fogo
  rationale: Conserva «legem» como objeto acusativo e mantém a comparação explícita com o fogo.
theological_decisions:
- issue: Relação sintática entre «perdet», «eos» e «legem»
  choice: Traduzir «e também a lei» como segundo objeto de «destruirá»
  alternative: 'Entender a lei como meio: «ele os destruirá sem esforço pela lei»'
  rationale: O latim traz «et legem» no acusativo, coordenado a «eos», e não apresenta preposição nem outra marca de valor instrumental. A tradução preserva essa construção difícil, sem resolver silenciosamente sua tensão.
translation_notes:
  register: Português moderno, digno e acessível, com continuidade em minúscula por se tratar de um fragmento que começa no meio da frase. A repetição de «as quais» foi mantida para refletir a ligação relativa do latim e evitar especificar um antecedente ausente neste recorte.
