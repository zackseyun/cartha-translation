id: 2ES.13.36
reference: 2 Esdras 13:36
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cacumen montis Sion. Sion autem ueniet et ostendetur omnibus parata et aedificata, sicut uidisti montem sculpi sine manibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/036.yaml
  text: But he will stand upon the summit of Mount Zion. And Zion will come and be shown to all, prepared and built, just as you saw the mountain carved out without hands.
translation:
  language: pt
  text: Mas ele ficará de pé no cume do monte Sião. E Sião virá e será mostrada a todos, pronta e edificada, assim como você viu o monte ser talhado sem mãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cacumen
  choice: cume
  rationale: Expressa com precisão o ponto mais alto do monte e mantém o registro digno do texto.
- source_word: parata et aedificata
  choice: pronta e edificada
  rationale: Preserva os dois particípios latinos e sua distinção, sem tornar a frase artificial em português.
- source_word: sculpi
  choice: ser talhado
  rationale: Representa o sentido de formar ou recortar por entalhe e se ajusta naturalmente à imagem de um monte produzido sem ação humana.
- source_word: sine manibus
  choice: sem mãos
  rationale: Mantém literalmente a expressão tradicional e sua possível ressonância de ação não humana ou divina, sem explicitá-la.
theological_decisions:
- issue: O modo pelo qual Sião 'virá' e será revelada
  choice: E Sião virá e será mostrada a todos
  alternative: E Sião aparecerá diante de todos
  rationale: A tradução conserva separadamente os verbos latinos ueniet e ostendetur, evitando fundi-los ou explicar a natureza da vinda.
- issue: Agente implícito em 'será mostrada' e 'sem mãos'
  choice: Manter o agente não declarado
  alternative: será mostrada por Deus; talhado por Deus
  rationale: O latim não nomeia o agente; explicitar Deus resolveria uma implicação teológica que o texto deixa implícita.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A construção 'ficará de pé' comunica o valor de posição de stare sugerido pela camada inglesa e pelo contexto, enquanto 'monte Sião' segue o uso bíblico corrente. Não são necessárias notas de rodapé.
