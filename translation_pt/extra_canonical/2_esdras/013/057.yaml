  text: et profectus sum et transii in campum, multum glorificans et laudans Altissimum de mirabilibus, quae per tempus faciebat,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/057.yaml
  text: And I departed and went into the field[a], greatly glorifying and praising the Most High for the wonders that he did in their times,
translation:
  language: pt
  text: E parti e fui para o campo, glorificando e louvando muito o Altíssimo pelas maravilhas que ele realizava ao longo do tempo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus sum et transii in campum
  choice: parti e fui para o campo
  rationale: Expressa naturalmente o movimento indicado pelos dois verbos latinos, sem a rigidez pouco idiomática de «passei para o campo».
- source_word: multum glorificans et laudans
  choice: glorificando e louvando muito
  rationale: Mantém os dois particípios e a intensidade de «multum» em português claro e digno.
- source_word: Altissimum
  choice: o Altíssimo
  rationale: Equivalente tradicional e transparente do título divino latino.
- source_word: de mirabilibus
  choice: pelas maravilhas
  rationale: Neste contexto, «de» introduz o motivo do louvor; «pelas» comunica essa relação com naturalidade.
- source_word: quae per tempus faciebat
  choice: que ele realizava ao longo do tempo
  rationale: Preserva o aspecto durativo de «faciebat» e traduz a expressão temporal sem impor a ideia mais específica de atos meramente ocasionais.
