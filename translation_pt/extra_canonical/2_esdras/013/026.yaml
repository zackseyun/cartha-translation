revisions:
- from: Este é aquele a quem o Altíssimo preservou por muitos tempos, o qual, por si mesmo, libertará sua criação e ele próprio dirigirá os que restaram.
  to: Este é aquele que o Altíssimo tem guardado ao longo de muitos tempos, que, por si mesmo, libertará a sua criação e ele próprio dirigirá os que foram deixados.
  rationale: A revisão corrige o aspecto de conservat conforme o latim fornecido, melhora a fluência temporal e preserva de modo mais explícito a passiva de derelicti sunt. Não introduz identificação teológica da figura nem restringe “criação” ou os “deixados”.
