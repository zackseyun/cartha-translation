id: 2ES.13.26
reference: 2 Esdras 13:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ipse est quem conservat Altissimus multis temporibus, qui per semet ipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/026.yaml
  text: This is he whom the Most High has kept for many ages, who will by himself deliver his creation, and he himself will direct those who are left.
translation:
  language: pt
  text: Este é aquele que o Altíssimo tem guardado ao longo de muitos tempos, que, por si mesmo, libertará a sua criação e ele próprio dirigirá os que foram deixados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conservat
  choice: preservou
  rationale: O perfeito latino é vertido de modo natural, indicando a preservação realizada pelo Altíssimo ao longo de muitos tempos.
- source_word: multis temporibus
  choice: por muitos tempos
  rationale: Mantém a expressão temporal ampla do latim sem especificar indevidamente 'eras' ou 'séculos'.
- source_word: per semet ipsum
  choice: por si mesmo
  rationale: Preserva a ênfase reflexiva de semet ipsum e a ideia de ação sem agente intermediário expresso.
- source_word: liberabit
  choice: libertará
  rationale: Equivalente direto e corrente para a ação futura de livrar ou pôr em liberdade.
- source_word: creaturam suam
  choice: sua criação
  rationale: Conserva a amplitude de creatura, que pode designar o conjunto criado, sem restringi-lo a um grupo específico.
- source_word: disponet
  choice: dirigirá
  rationale: Expressa a ideia de ordenar, dispor ou conduzir; 'dirigirá' é claro em português e não fecha excessivamente o alcance do verbo.
- source_word: qui derelicti sunt
  choice: os que restaram
  rationale: Reproduz o sentido passivo/resultativo dos que foram deixados ou permaneceram, em formulação natural.
theological_decisions:
- issue: Identidade da figura preservada pelo Altíssimo
  choice: aquele
  alternative: o homem / o Messias
  rationale: O versículo usa apenas o pronome demonstrativo ipse; não se acrescenta aqui uma identificação teológica além do texto.
- issue: Alcance de 'sua criação'
  choice: sua criação
  alternative: suas criaturas / seu povo
  rationale: Mantém a formulação abrangente e a possível ambiguidade de creaturam suam, sem restringir o referente.
- issue: Sentido de disponet quanto aos sobreviventes
  choice: dirigirá
  alternative: porá em ordem / estabelecerá
  rationale: O verbo admite nuances de ordenar, organizar e conduzir; a escolha conserva um sentido amplo sem impor uma função específica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com estrutura solene sem arcaísmos. A repetição enfática de ipse foi preservada por 'ele próprio'.
