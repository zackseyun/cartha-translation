id: 2ES.13.5
reference: 2 Esdras 13:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi post haec, et ecce congregabatur multitudo hominum, quorum non erat numerus, de quattuor ventis caeli, ut debellarent hominem qui ascenderat de mari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/005.yaml
  text: And after this I looked, and behold, a multitude of men was gathering, whose number was beyond counting, from the four winds of heaven, to make war against the man who had come up from the sea.
translation:
  language: pt
  text: E, depois disso, vi, e eis que uma multidão de homens, cujo número não se podia contar, reunia-se, vinda dos quatro ventos do céu, para guerrear contra o homem que havia subido do mar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: congregabatur
  choice: reunia-se
  rationale: O imperfeito latino descreve uma multidão em processo de reunião; a forma reflexiva é natural em português e preserva o aspecto contínuo.
- source_word: quorum non erat numerus
  choice: cujo número não se podia contar
  rationale: Expressa idiomaticamente a ideia de uma multidão inumerável sem reduzir a frase à formulação menos natural «não havia número».
- source_word: de quattuor ventis caeli
  choice: vinda dos quatro ventos do céu
  rationale: Mantém a imagem cosmológica e direcional do latim; «vinda» explicita de modo natural que a multidão procedia dessas quatro direções.
- source_word: debellarent
  choice: para guerrear contra
  rationale: Preserva a finalidade hostil e militar do verbo sem pressupor que a multidão conseguiria vencer o homem.
- source_word: ascenderat de mari
  choice: havia subido do mar
  rationale: O mais-que-perfeito composto conserva a anterioridade indicada pelo mais-que-perfeito latino.
theological_decisions:
- issue: Identidade do homem que sobe do mar
  choice: o homem que havia subido do mar
  alternative: uma identificação interpretativa ou título messiânico explícito
  rationale: O versículo chama a figura apenas de «homem»; a tradução mantém essa designação sem antecipar sua interpretação posterior.
- issue: Resultado do confronto
  choice: para guerrear contra
  alternative: para derrotar
  rationale: Embora «debellare» possa incluir a ideia de subjugar, o contexto imediato apresenta a intenção da multidão, não o êxito do ataque; a escolha evita afirmar antecipadamente o resultado.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva-se «e eis que» para representar o marcador visionário latino «et ecce» e «quatro ventos do céu» como imagem tradicional e transparente.
