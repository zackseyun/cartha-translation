  text: And it happened after seven days that I dreamed a dream in the night.
translation:
  language: pt
  text: E aconteceu que, depois de sete dias, tive um sonho durante a noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: somniavi somnium
  choice: tive um sonho
  rationale: A construção latina repete a mesma raiz, mas a expressão idiomática e natural em português é “ter um sonho”; “sonhei um sonho” soaria marcada e desnecessariamente literal.
- source_word: nocte
  choice: durante a noite
  rationale: Transmite com clareza a circunstância temporal do ablativo latino e preserva a ênfase de que o sonho ocorreu à noite.
