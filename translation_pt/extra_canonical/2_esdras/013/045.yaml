  rationale: Completa a expressão de duração «um ano e meio», preservada pelo contexto textual e pela camada inglesa auditada.
- source_word: regio illa
  choice: aquela região / essa região
  rationale: Usa «aquela» ao descrever o percurso e «essa» na identificação subsequente, de modo natural em português, sem alterar o referente.
- source_word: uocatur
  choice: se chama
  rationale: Equivalente corrente e claro do latim passivo «é chamada».
- source_word: Arzareth
  choice: Arzareth
  rationale: Mantém a forma do topônimo apresentada na edição-fonte e na camada inglesa.
