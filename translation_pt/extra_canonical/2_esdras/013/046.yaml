  text: 'usque in nouissimo tempore: et nunc iterum coeperunt uenire; Iterum altissimus statuit uenas fluminis, ut possint transire.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/046.yaml
  text: Then they lived there until the last time[46]; and now they have begun to come again; again the Most High has stopped up the channels of the river[a], so that they can cross.
translation:
  language: pt
  text: Eles habitaram ali até o tempo do fim. E agora voltaram a vir. De novo, o Altíssimo fechou os canais do rio, para que possam atravessar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: usque in nouissimo tempore
  choice: até o tempo do fim
  rationale: Expressa naturalmente em português o sentido temporal e escatológico da locução latina, preservando o singular de tempore sem sugerir apenas uma ocasião anterior.
- source_word: coeperunt uenire
  choice: começaram novamente a vir
  rationale: Mantém o perfeito latino e o valor iterativo de iterum, sem especificar origem ou destino não declarados.
- source_word: statuit uenas fluminis
  choice: fechou os canais do rio
  rationale: No contexto da travessia, statuit indica deter ou bloquear o fluxo, e uenas é uma metáfora para os canais ou cursos do rio.
- source_word: ut possint transire
  choice: para que pudessem atravessar
  rationale: O imperfeito do subjuntivo em português ajusta a finalidade à ação passada de fechar os canais e conserva a ideia de tornar possível a travessia.
theological_decisions:
- issue: Sentido escatológico de nouissimo tempore
  choice: tempo do fim
  alternative: último tempo
  rationale: A opção escolhida comunica com clareza a referência ao período final, sem resolver além do texto quando esse período começa ou como deve ser entendido teologicamente.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do latim quando natural. A repetição de “novamente/De novo” foi mantida porque o texto latino repete iterum. Não se incluiu a nota inglesa sobre Arzareth, pois esse nome não aparece neste versículo; tampouco se manteve o marcador [46], que aparenta estar deslocado e não corresponde a uma nota pertinente ao texto fornecido.
