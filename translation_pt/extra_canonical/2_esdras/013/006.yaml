  yaml_path: translation/extra_canonical/2_esdras/013/006.yaml
  text: And I looked, and behold, he carved out for himself a great mountain and flew upon it.
translation:
  language: pt
  text: E olhei, e eis que ele talhou para si um grande monte e voou sobre ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sculpsit
  choice: talhou
  rationale: Expressa de modo natural o ato de formar ou esculpir o monte, preservando a imagem concreta do latim.
- source_word: sibimet ipso
  choice: para si
  rationale: Mantém o valor reflexivo enfático da expressão latina sem tornar o português artificial.
- source_word: montem magnum
  choice: um grande monte
  rationale: Tradução direta e idiomática, adequada ao registro visionário.
- source_word: volavit super eum
  choice: voou sobre ele
  rationale: Preserva a relação espacial potencialmente ambígua de super, sem acrescentar a ideia de movimento ascendente.
theological_decisions:
- issue: Relação espacial entre o homem e o monte
  choice: voou sobre ele
  alternative: voou para cima dele / pousou nele
  rationale: O latim super eum pode indicar posição acima ou movimento sobre o monte; a tradução escolhida conserva a formulação espacial sem introduzir pouso nem subida explícita.
translation_notes:
  register: Português moderno, claro e digno, com a cadência visionária preservada pela sequência «E olhei, e eis que». «Monte» foi preferido a «montanha» por concisão e por seu uso corrente em linguagem bíblica, sem arcaísmo excessivo.
