  text: but I only saw how he sent out from his mouth like a wave of fire, and from his lips a breath of flame, and from his tongue he shot out sparks of storm.
translation:
  language: pt
  text: mas vi apenas como ele fazia sair de sua boca, como uma onda de fogo, e de seus lábios, um sopro de chama; e de sua língua lançava faíscas de tempestade.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fluctum ignis
  choice: onda de fogo
  rationale: Reproduz diretamente a imagem do latim e mantém a linguagem vívida em português natural.
- source_word: spiritum flammae
  choice: sopro de chama
  rationale: Neste contexto, “sopro” expressa naturalmente algo emitido pelos lábios, sem apagar por completo a amplitude semântica de spiritus, indicada em nota.
- source_word: scintillas tempestatis
  choice: faíscas de tempestade
  rationale: Preserva a combinação imagética incomum do original, sem reinterpretá-la como relâmpagos ou raios.
- source_word: emittit / emittebat
  choice: fazia sair / lançava
  rationale: Emprega formas narrativas naturais em português e acompanha a ação contemplada na visão, sem tornar a alternância aspectual latina artificialmente rígida.
theological_decisions:
- issue: Sentido de spiritus em spiritum flammae
  choice: sopro de chama
  alternative: espírito de chama / vento de chama
  rationale: A referência à emissão pelos lábios favorece “sopro”, mas a nota registra a polissemia do termo latino para não excluir silenciosamente outras nuances.
translation_notes:
  register: Português moderno, claro e digno, com imagens deliberadamente incomuns preservadas. A construção “algo como” torna natural a comparação introduzida por sicut sem transformar a onda em objeto definido.
