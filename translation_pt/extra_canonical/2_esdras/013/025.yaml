  text: 'For this is the interpretation of the vision: because you saw a man coming up from the heart of the sea,[a]'
translation:
  language: pt
  text: 'Pois esta é a interpretação da visão: porque você viu um homem subindo do coração do mar.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «E esta é a interpretação da visão».'
    reason: «Enim» é principalmente explicativo («pois»), mas em português também pode ser vertido de modo mais solto por uma coordenação contextual.
lexical_decisions:
- source_word: enim
  choice: Pois
  rationale: Expressa o valor explicativo da partícula latina pós-positiva, ligando esta declaração ao contexto anterior.
- source_word: interpretatio visionis
  choice: interpretação da visão
  rationale: Correspondência direta e natural aos substantivos latinos.
- source_word: quia vidisti
  choice: você viu
  rationale: Neste contexto, quia introduz o conteúdo da visão a ser interpretado; a formulação direta evita que «porque» sugira, em português, uma relação causal inadequada.
- source_word: virum ascendentem
  choice: um homem subindo
  rationale: Preserva a referência masculina e o aspecto progressivo do particípio latino.
- source_word: de corde maris
  choice: do coração do mar
  rationale: Mantém a imagem metafórica concreta do latim, em vez de reduzi-la a «meio» ou «profundezas».
theological_decisions:
- issue: Identidade do homem visto
  choice: um homem
  alternative: o homem
  rationale: O latim traz virum sem artigo e o versículo não explicita aqui a identidade da figura; a tradução preserva essa apresentação sem impor uma identificação teológica.
- issue: Relação introduzida por quia
  choice: você viu
  alternative: porque você viu
  rationale: O conteúdo da visão é mantido sem converter a frase em uma explicação causal potencialmente enganosa em português; a tensão interpretativa permanece na nota.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. «Coração do mar» conserva deliberadamente a imagem antiga. O marcador da nota aparece no texto principal.
