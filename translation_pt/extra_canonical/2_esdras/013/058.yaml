  text: et quoniam gubernat tempora et quae sunt in temporibus inlata. et sedi ibi tribus diebus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/058.yaml
  text: and because he governs the times and the things that are brought about in the times[a]. And I sat there for three days.
translation:
  language: pt
  text: e porque ele governa os tempos e as coisas que são produzidas nos tempos.[a] E fiquei sentado ali durante três dias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução anterior incluía aqui: “E parti e fui para o campo, glorificando e louvando grandemente o Altíssimo pelas maravilhas que ele realizou em seus tempos, e porque ele governa os tempos e as coisas que são produzidas nos tempos. E fiquei sentado ali durante três dias.” A primeira parte, porém, pertence ao versículo anterior.'
    reason: previous_rendering
lexical_decisions:
- source_word: gubernat
  choice: governa
  rationale: Corresponde diretamente ao sentido de dirigir ou reger e preserva a afirmação de soberania temporal.
- source_word: tempora
  choice: os tempos
  rationale: Mantém o plural latino e sua possível abrangência de épocas, períodos e momentos determinados.
- source_word: quae sunt in temporibus inlata
  choice: as coisas que acontecem no decorrer deles
  rationale: Expressa em português natural a ideia das coisas introduzidas, produzidas ou ocorridas dentro dos tempos, sem impor uma agência não explicitada.
- source_word: sedi ibi tribus diebus
  choice: fiquei sentado ali durante três dias
  rationale: Preserva a postura indicada por sedi e apresenta a duração de modo idiomático.
theological_decisions:
- issue: Agência por trás dos acontecimentos nos tempos
  choice: as coisas que acontecem no decorrer deles
  alternative: as coisas que são produzidas nos tempos
  rationale: O particípio passivo inlata admite a noção de coisas trazidas ou realizadas, mas não nomeia o agente; a tradução evita explicitar uma causalidade teológica além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O início em minúscula preserva a continuidade sintática indicada pelo latim e pelo contexto editorial. A nota registra a tradução anterior e esclarece a correção do limite do versículo.
