  source_fidelity: A leitura principal «Oseias» segue a decisão textual indicada pelo dossiê e é devidamente documentada em nota. Contudo, o rascunho desloca «a quem ... levou cativo» do rei Oseias para as dez tribos. No texto de base, o relativo se refere ao rei; em seguida, «os» se refere às tribos transportadas através do rio.
