  text: these are the ten tribes that were led away captive from their own land in the days of King Hoshea[40], whom Shalmaneser king of the Assyrians led away captive; and he carried them across the River[a], and they were taken into another land.
translation:
  language: pt
  text: Essas são as dez tribos que foram levadas cativas de sua própria terra nos dias do rei Oseias[a], a quem Salmanasar, rei dos assírios, levou cativo; e ele as fez atravessar o rio, e elas foram levadas para outra terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino preservado diz «nos dias do rei Josias». As antigas versões siríaca, etíope e árabe trazem «Oseias», nome que corresponde ao rei de Israel na época do exílio assírio das tribos do norte.
    reason: textual_variant
lexical_decisions:
- source_word: terra sua
  choice: sua própria terra
  rationale: Expressa naturalmente a ideia de terra natal ou território pertencente às tribos, sem acrescentar uma identificação geográfica ausente do texto.
- source_word: captiuum duxit
  choice: levou-as para o cativeiro
  rationale: Preserva a força da expressão latina de conduzir alguém como cativo, evitando uma repetição pouco natural de «levou cativas».
- source_word: trans flumen
  choice: atravessassem o rio
  rationale: Mantém a referência indefinida do latim; não identifica explicitamente o rio como o Eufrates.
- source_word: translati sunt in terram aliam
  choice: foram conduzidas para outra terra
  rationale: Conserva a passiva e o deslocamento forçado indicado pelo contexto.
theological_decisions:
- issue: Nome do rei no contexto do exílio assírio das tribos do norte
  choice: Oseias no texto principal
  alternative: Josias, conforme o latim preservado («Iosiae»)
  rationale: Embora o testemunho latino fornecido leia «Josias», Oseias é sustentado pelas antigas versões siríaca, etíope e árabe e corresponde ao contexto autoral do exílio assírio. A divergência real da tradição latina é preservada em nota, em vez de ser ocultada.
translation_notes:
  register: Português atual, claro e digno, com sintaxe acessível e nomes bíblicos correntes no uso brasileiro. O texto principal segue a leitura considerada mais antiga, enquanto a forma do testemunho latino é apresentada de modo transparente na nota.
