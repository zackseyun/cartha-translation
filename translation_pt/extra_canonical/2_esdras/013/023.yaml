  yaml_path: translation/extra_canonical/2_esdras/013/023.yaml
  text: he who brings the danger at that time will himself protect those who fall into danger[a], those who have works and faith toward the Most Mighty.
translation:
  language: pt
  text: Aquele que trará o perigo naquele tempo, ele próprio protegerá os que caírem em perigo, os que têm obras e fé no Mais Poderoso.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «o Poderosíssimo».'
    reason: Registra uma alternativa formal para o título divino superlativo Fortissimum; «o Mais Poderoso» é mais idiomático em português moderno.
lexical_decisions:
- source_word: adferet periculum
  choice: trouxer o perigo
  rationale: Preserva o sentido literal de causar ou trazer o perigo, sem explicitar uma agência ou finalidade que o latim não especifica.
- source_word: ipse custodibit
  choice: protegerá ele mesmo
  rationale: Mantém a ênfase de ipse sobre o próprio agente e traduz custodire de modo natural no contexto de pessoas em perigo.
- source_word: qui in periculo inciderint
  choice: os que caírem em perigo
  rationale: Reproduz a imagem de incidere in periculum e conserva o valor prospectivo do subjuntivo perfeito latino.
- source_word: habent operas et fidem
  choice: têm obras e fé
  rationale: Conserva os dois elementos coordenados e a formulação teologicamente aberta, sem redefinir a relação entre obras e fé.
- source_word: ad Fortissimum
  choice: para com o Poderosíssimo
  rationale: Para com reflete a orientação expressa por ad; Poderosíssimo preserva a força superlativa do título divino substantivado Fortissimum.
theological_decisions:
- issue: Força superlativa do título divino Fortissimum
  choice: o Poderosíssimo
  alternative: o Poderoso
  rationale: Fortissimum é superlativo, não mero adjetivo positivo; a tradução escolhida preserva essa distinção e o uso como título divino.
- issue: Relação entre obras e fé
  choice: os que têm obras e fé
  alternative: os que praticam boas obras e têm fé
  rationale: O latim não inclui boas nem distingue verbalmente a posse das obras da posse da fé; a redação mantém a concisão e a tensão do texto-fonte.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção «protegerá ele mesmo» retém a ênfase latina, e «para com» mantém a direção relacional de ad sem impor uma formulação confessional específica.
