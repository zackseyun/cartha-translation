  source_fidelity: A tradução preserva adequadamente a sintaxe difícil e o referente incerto de “has quae ... adpropiauerunt”, sem identificar indevidamente “essas coisas” com as nações ou com as impiedades. “Repreenderá” traduz bem arguet; “impiedades”, impietates; e “lhes lançará em rosto” comunica a força confrontadora de inproperabit coram eis. “Tormentos” mantém a ambiguidade de cruciamenta.
