id: 2ES.13.37
reference: 2 Esdras 13:37
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ipse autem filius meus arguet quae aduenerunt gentes impietates eorum, has quae tempestati adpropiauerunt, et inproperabit coram eis mala cogitamenta eorum et cruciamenta,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/037.yaml
  text: But he[37], my Son, will rebuke the impieties of the nations that have come, these things that have drawn near like a storm; and he will reproach them to their faces with their evil thoughts and torments[a],
translation:
  language: pt
  text: Mas ele[a], meu Filho, repreenderá as impiedades das nações que vieram — essas coisas que se aproximaram como uma tempestade — e lhes lançará em rosto[b] seus maus pensamentos e tormentos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Na interpretação, o “monte Sião” e o monte “talhado sem mãos” são relacionados entre si. A imagem evoca intencionalmente um espaço santo feito ou revelado por Deus, e não um monte comum formado pelo trabalho humano.
    reason: cross_reference
  - marker: b
    text: 'Ou: “porá diante delas”.'
    reason: previous_rendering
lexical_decisions:
- source_word: arguet
  choice: repreenderá
  rationale: Expressa a ação de censurar ou declarar culpado, preservando o tom judicial e acusatório do latim.
- source_word: impietates
  choice: impiedades
  rationale: Mantém o sentido religioso e moral amplo do termo latino sem restringi-lo a uma doutrina específica.
- source_word: tempestati adpropiauerunt
  choice: se aproximaram como uma tempestade
  rationale: Segue a leitura contextual adotada pelo texto de consulta, reproduzindo a imagem de uma aproximação semelhante a uma tempestade, apesar da construção latina difícil.
- source_word: inproperabit coram eis
  choice: lhes lançará em rosto
  rationale: Locução portuguesa corrente que conserva tanto a força acusatória de inproperabit quanto a ideia de confrontação direta presente em coram eis.
- source_word: cruciamenta
  choice: tormentos
  rationale: Equivalente direto que preserva a coordenação ambígua com 'maus pensamentos', sem definir se os tormentos são praticados, concebidos ou sofridos.
theological_decisions:
- issue: Relação entre o Filho e o juízo das nações
  choice: Conservar 'meu Filho' e os verbos de repreensão em sentido direto
  alternative: Explicitar o Filho como juiz messiânico ou executor de uma sentença divina
  rationale: O texto atribui a ação ao Filho, mas não formula aqui uma explicação doutrinária de sua identidade ou do mecanismo do juízo.
- issue: Referente de 'essas coisas'
  choice: Manter a formulação relativamente aberta
  alternative: Substituir por 'essas nações' ou identificar explicitamente as impiedades como aquilo que se aproximou
  rationale: A sintaxe latina é irregular e o referente de has quae não é inteiramente seguro; a tradução evita resolver silenciosamente essa dificuldade.
- issue: Função de 'maus pensamentos e tormentos'
  choice: Preservar os dois termos coordenados como conteúdo da censura
  alternative: Interpretar os tormentos como a punição que o Filho lhes imporá
  rationale: A construção não determina inequivocamente se 'tormentos' designa culpa, intenção ou castigo; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A locução 'lançar em rosto' foi mantida por sua precisão acusatória; embora ligeiramente solene, continua transparente no contexto. Os travessões ajudam a tornar legível a sintaxe difícil sem eliminar sua ambiguidade.
