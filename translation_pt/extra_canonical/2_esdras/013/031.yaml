  yaml_path: translation/extra_canonical/2_esdras/013/031.yaml
  text: And bewilderment of mind will come upon those who inhabit the earth. And they will plan to make war, one against another, city against city, place against place,
translation:
  language: pt
  text: 'E uma perturbação mental sobrevirá aos que habitam a terra. Eles pensarão em guerrear uns contra os outros: cidade contra cidade, lugar contra lugar,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excessus mentis
  choice: perturbação mental
  rationale: A expressão latina indica um estado em que a mente perde seu equilíbrio ou domínio habitual. “Perturbação mental” preserva a amplitude do sentido sem especificar indevidamente loucura, êxtase ou mero espanto.
- source_word: ueniet ... super eos
  choice: sobrevirá aos
  rationale: Reproduz de modo natural em português a ideia de algo que vem sobre as pessoas.
- source_word: cogitabunt bellare
  choice: pensarão em guerrear
  rationale: Mantém o elemento deliberativo de cogitabunt e o sentido bélico de bellare, sem transformar o propósito em ação já consumada.
- source_word: in alios alii
  choice: uns contra os outros
  rationale: Expressa naturalmente a reciprocidade hostil da construção latina.
- source_word: locus locum
  choice: lugar contra lugar
  rationale: Conserva o paralelismo e a generalidade do latim, sem substituir “lugar” por uma unidade política mais específica.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura profética preservada. A tradução mantém a ambiguidade de excessus mentis e o paralelismo crescente da segunda frase.
