source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut non potest hoc vel scrutinare vel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram videre Filium meum vel eos qui cum eo sunt nisi in tempore diei.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/052.yaml
  text: And he said to me, “Just as no one can search out or know what is in the depths of the sea, so no one on earth can see my Son, or those who are with him, except at the time of that day.”
translation:
  language: pt
  text: 'E ele me disse: “Assim como ninguém pode investigar nem saber o que há nas profundezas do mar, também ninguém na terra poderá ver o meu Filho nem os que estão com ele, a não ser no tempo daquele dia.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scrutinare
  choice: investigar
  rationale: Expressa a ideia de examinar ou sondar para descobrir, em português atual e digno.
- source_word: in profundo maris
  choice: nas profundezas do mar
  rationale: Reproduz naturalmente a imagem espacial do latim sem reduzir o singular coletivo a uma localização rasa.
- source_word: Filium meum
  choice: o meu Filho
  rationale: Preserva a relação e a ênfase do possessivo latino; a inicial maiúscula identifica o título/referente messiânico no contexto.
- source_word: in tempore diei
  choice: no tempo daquele dia
  rationale: Mantém a formulação temporal e a referência escatológica sem convertê-la em “seu dia”; “daquele” torna a expressão natural em português e acompanha a revisão inglesa auditada.
theological_decisions:
- issue: Possibilidade de ver o Filho antes do tempo determinado
  choice: “ninguém na terra poderá ver o meu Filho nem os que estão com ele, a não ser no tempo daquele dia”
  alternative: “ninguém na terra pode ver...”
  rationale: O futuro latino non poterit indica impossibilidade até o tempo assinalado; a tradução preserva essa dimensão prospectiva sem explicar além do texto.
- issue: Referência de “daquele dia”
  choice: manter a expressão sem explicitação
  alternative: “no dia da manifestação dele”
  rationale: O latim não define aqui a natureza do dia; explicá-lo importaria uma interpretação e eliminaria a concisão e a tensão escatológica do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A construção é digna e clara, com paralelismo preservado entre a inescrutabilidade das profundezas do mar e a impossibilidade de ver o Filho antes do tempo determinado.
