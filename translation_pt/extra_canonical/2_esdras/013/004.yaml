  source_fidelity: 'A tradução transmite com precisão a sequência e a imagem do latim: a voz sai da boca da figura, os que a ouvem pegam fogo, e a comparação com a cera que se derrete diante do fogo é preservada. «Por onde quer que» reproduz adequadamente o alcance distributivo de ubicumque. Embora voces esteja no plural, «sua voz» é uma solução portuguesa natural no paralelismo com a voz que sai de sua boca e não introduz uma alteração interpretativa segura.'
  naturalness: O português é moderno, claro e suficientemente solene para o contexto visionário. «Pegavam fogo» é idiomático e torna bem o valor ativo e incoativo de ardescebant; «ao sentir o fogo» mantém de modo fluente a personificação presente no original.
  terminology: «Voz», «boca», «cera», «derrete» e «fogo» são escolhas diretas e consistentes. As notas explicam de modo apropriado a possibilidade de artigo indefinido em vox e a nuance incoativa de ardescebant, sem impor leitura teológica.
