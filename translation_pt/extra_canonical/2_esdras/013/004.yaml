id: 2ES.13.4
reference: 2 Esdras 13:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ubicumque exiebat vox de ore eius, ardescebant omnes qui audiebant voces eius. sicut liquescit cera quando senserit ignem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/004.yaml
  text: And wherever a voice went out from his mouth[a], all who heard his voice burned[b], just as wax melts when it senses the fire.
translation:
  language: pt
  text: E, por onde quer que a voz saísse de sua boca[a], todos os que ouviam sua voz pegavam fogo[b], assim como a cera se derrete ao sentir o fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “uma voz”.'
    reason: O latim não possui artigo; embora o contexto favoreça a referência definida, a formulação indefinida continua gramaticalmente possível.
  - marker: b
    text: 'Ou: “começavam a arder”.'
    reason: Ardescebant é uma forma ativa incoativa, com o sentido de começar a queimar ou pegar fogo.
lexical_decisions:
- source_word: ubicumque
  choice: por onde quer que
  rationale: Reproduz o sentido distributivo e espacial da expressão latina de modo natural em português.
- source_word: vox
  choice: a voz
  rationale: Embora o latim não tenha artigo, o contexto aponta para a voz específica daquele homem; o artigo definido evita uma indefinição artificial.
- source_word: ardescebant
  choice: pegavam fogo
  rationale: O imperfeito ativo e incoativo de ardesco indica que começavam a arder; “pegavam fogo” preserva esse aspecto e a imagem concreta.
- source_word: sicut liquescit cera
  choice: assim como a cera se derrete
  rationale: Mantém a comparação explícita e o presente proverbial do latim em português corrente.
- source_word: quando senserit ignem
  choice: ao sentir o fogo
  rationale: Expressa de maneira concisa a relação temporal do latim sem eliminar a personificação da cera que “sente” o fogo.
theological_decisions:
- issue: A voz como agente de combustão no cenário visionário
  choice: Manter literalmente que os ouvintes “pegavam fogo”
  alternative: Interpretar como destruição figurada ou juízo espiritual
  rationale: O texto descreve uma imagem visionária concreta e não explica se ela deve ser entendida de modo literal ou simbólico; a tradução não resolve essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “voz” preserva a ligação verbal do latim, embora o segundo termo latino esteja no plural (voces), que nesse contexto pode designar a voz, as palavras ou as declarações dele.
