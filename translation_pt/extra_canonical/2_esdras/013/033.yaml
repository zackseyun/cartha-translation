review_pass:
  verdict: revise
  source_fidelity: A primeira oração preserva adequadamente a passiva de reuelabitur e a apresentação do Filho como o homem visto em movimento ascendente. Contudo, unusquisque é distributivo pessoal (“cada um”), não se refere gramaticalmente às nações como coletividades femininas; “cada uma” altera esse referente. Regio é mais precisamente “região” do que “terra”.
  naturalness: A redação é em geral clara e adequada ao português moderno. A revisão proposta mantém a cadência solene e torna explícita, de forma natural, que o conflito é recíproco entre os envolvidos.
  terminology: “Meu Filho”, “será revelado”, “nações” e “voz” são escolhas adequadas. “Deixar a guerra que travam uns contra os outros” conserva o singular coletivo bellum e a reciprocidade de in alterutro sem introduzir interpretação teológica.
  issues:
  - severity: medium
    issue: “cada uma” toma as nações como referente de unusquisque.
    rationale: O latino unusquisque é “cada um/cada pessoa”. Além disso, a sequência “sua região” e a guerra recíproca se formula melhor com referente pessoal distributivo.
  - severity: low
    issue: “terra” para regionem.
    rationale: Embora possível em contexto amplo, “região” reproduz mais diretamente o sentido territorial-administrativo de regio e evita restringir ou deslocar o significado.
  revised_text: Meu Filho, que você viu como um homem subindo, será revelado. E acontecerá que, quando todas as nações ouvirem a sua voz, cada um deixará a sua própria região e a guerra que travam uns contra os outros,
  revised_footnotes: []
