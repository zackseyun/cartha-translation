  text: reuelabitur filius meus quem uidisti uirum ascendentem. Et erit, quando audierint omnes gentes uocem eius, et derelinquet unusquisque regionem suam et bellum quod habent in alterutro,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/033.yaml
  text: my Son will be revealed, whom you saw as a man ascending. And it shall be, when all the nations hear his voice, each will leave his own land and the war that they have against one another,
translation:
  language: pt
  text: Meu Filho, que você viu como um homem subindo, será revelado. E acontecerá que, quando todas as nações ouvirem a sua voz, cada um deixará a sua própria região e a guerra que travam uns contra os outros,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuelabitur
  choice: será revelado
  rationale: Mantém o valor passivo e escatológico do verbo latino sem explicitar quem realiza a revelação.
- source_word: filius meus
  choice: meu Filho
  rationale: Tradução direta; a inicial maiúscula sinaliza o título referente à figura apresentada pelo locutor sem acrescentar uma identificação não expressa neste versículo.
- source_word: uirum ascendentem
  choice: como um homem subindo
  rationale: Preserva tanto a caracterização visual como homem quanto o sentido progressivo de ascendentem, sem transformar o particípio em uma afirmação teológica mais específica sobre ascensão.
- source_word: omnes gentes
  choice: todas as nações
  rationale: Equivalente corrente e contextual de gentes para coletividades nacionais.
- source_word: derelinquet unusquisque regionem suam
  choice: cada uma abandonará sua própria terra
  rationale: O referente distributivo são as nações; a concordância feminina torna isso claro em português, e 'terra' comunica naturalmente regionem neste contexto.
- source_word: bellum quod habent in alterutro
  choice: a guerra que mantém contra as outras
  rationale: Expressa a hostilidade recíproca entre as nações em português natural, preservando o singular coletivo bellum.
theological_decisions:
- issue: Identidade do 'Filho'
  choice: Não explicitar além de 'meu Filho'
  alternative: Identificá-lo diretamente como o Messias ou Cristo
  rationale: O texto latino fornece apenas filius meus neste versículo; a tradução preserva essa formulação e deixa a identificação ao contexto.
- issue: Sentido de ascendentem
  choice: subindo
  alternative: ascendendo
  rationale: '''Subindo'' é português mais comum e mantém aberta a natureza exata do movimento visto, enquanto ''ascendendo'' poderia evocar mais fortemente uma ascensão teológica formal.'
- issue: Agente de 'será revelado'
  choice: Manter a passiva sem agente
  alternative: Deus revelará meu Filho
  rationale: O original não nomeia o agente, e explicitá-lo resolveria uma informação deixada implícita.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A ordem foi ajustada para soar natural em português, preservando a sequência lógica do latim. O versículo termina com vírgula porque a frase continua no contexto imediato.
