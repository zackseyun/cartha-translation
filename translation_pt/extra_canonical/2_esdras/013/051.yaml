  yaml_path: translation/extra_canonical/2_esdras/013/051.yaml
  text: 'And I said[a], “Lord Master, show me this: why did I see the man coming up from the heart of the sea?” And he said to me:'
translation:
  language: pt
  text: 'E eu disse: “Ó Soberano Senhor[a], mostra-me isto: por que vi o homem subir do coração do mar?” E ele me disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Mestre, Senhor”.'
    reason: Registra uma forma alternativa de representar separadamente, e na mesma ordem, os dois títulos latinos “Dominator Domine”.
lexical_decisions:
- source_word: Dominator Domine
  choice: Ó Soberano Senhor
  rationale: Reproduz a dupla invocação solene do latim em português natural e preserva a ideia de autoridade expressa por “Dominator”.
- source_word: de corde maris
  choice: do coração do mar
  rationale: Mantém a imagem concreta e apocalíptica do texto-fonte, sem reduzi-la a uma expressão explicativa como “do meio do mar”.
- source_word: ascendentem
  choice: subir
  rationale: Expressa diretamente o movimento ascendente do homem visto na visão.
theological_decisions:
- issue: Sentido do título “Dominator Domine”
  choice: Ó Soberano Senhor
  alternative: Senhor, Mestre
  rationale: “Soberano Senhor” comunica com dignidade a autoridade do primeiro título e o vocativo do segundo; a alternativa mais literal na forma, mas menos natural, é registrada em nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural e preservação da imagem “coração do mar”. A oração final foi mantida neste versículo conforme o texto latino.
