  yaml_path: translation/extra_canonical/2_esdras/013/014.yaml
  text: From the beginning you have shown these wonders to your servant[a], and you have counted me worthy to receive my supplication.
translation:
  language: pt
  text: Desde o princípio, mostraste estas maravilhas ao teu servo e me consideraste digno de acolheres a minha súplica.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “me consideraste digno de que recebesses a minha súplica”.'
    reason: Registra uma tradução mais formal da oração latina introduzida por ut, enquanto o texto principal usa o infinitivo pessoal para maior naturalidade e clareza em português.
lexical_decisions:
- source_word: ab initio
  choice: Desde o princípio
  rationale: Reproduz de modo natural a expressão temporal latina e mantém seu tom solene.
- source_word: demonstrasti
  choice: mostraste
  rationale: Expressa diretamente o ato de fazer ver ou revelar, sem acrescentar uma interpretação técnica.
- source_word: mirabilia haec
  choice: estas maravilhas
  rationale: Preserva o demonstrativo e o sentido de feitos ou coisas extraordinárias.
- source_word: servo tuo
  choice: ao teu servo
  rationale: Mantém a linguagem relacional e reverente do texto.
- source_word: dignum me habuisti
  choice: me consideraste digno
  rationale: Equivalência idiomática clara para a construção latina que significa julgar ou ter alguém por digno.
- source_word: susciperes
  choice: acolheres
  rationale: O verbo latino está na segunda pessoa do singular; o infinitivo pessoal português deixa claro que é Deus quem acolhe a súplica. “Acolher” comunica receber favoravelmente, sem garantir explicitamente a concessão do pedido.
- source_word: deprecationem meam
  choice: a minha súplica
  rationale: Preserva o sentido de pedido humilde e insistente e a ligação lexical com o ato de suplicar no contexto imediato.
theological_decisions:
- issue: Quem recebe a súplica na oração final
  choice: Deus é o sujeito de “acolheres”
  alternative: “me consideraste digno de receber a minha súplica”, com o servo como possível sujeito gramatical
  rationale: A forma latina susciperes é segunda pessoa singular e aponta para o destinatário da oração como aquele que a recebe; a tradução portuguesa evita a ambiguidade gramatical introduzida pela formulação inglesa revisada.
- issue: Sentido de Deus receber a súplica
  choice: “acolheres”
  alternative: “atenderes”
  rationale: “Acolher” preserva a ideia de aceitar ou receber a petição sem resolver além do texto se ela foi plenamente atendida ou concedida.
translation_notes:
  register: Português moderno, claro e reverente, com leitura natural no Brasil e compreensão internacional. O infinitivo pessoal “acolheres” preserva com precisão o sujeito da forma verbal latina.
