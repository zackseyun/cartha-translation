lexical_decisions:
- source_word: uolentes uenire
  choice: querendo vir
  rationale: Reproduz diretamente o particípio de intenção e o infinitivo latino, mantendo a ligação com o contexto anterior.
- source_word: expugnare
  choice: derrotá-lo
  rationale: O verbo indica vencer ou subjugar mediante ataque, sentido mais forte do que simplesmente iniciar uma agressão. “Derrotá-lo” é natural em português e não pressupõe necessariamente a captura de uma cidade ou fortificação.
