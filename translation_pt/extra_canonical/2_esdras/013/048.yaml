  yaml_path: translation/extra_canonical/2_esdras/013/048.yaml
  text: But those of your people who are left[a], who are found within my holy border, shall be saved.
translation:
  language: pt
  text: Mas os que restarem do teu povo e forem encontrados dentro dos limites do meu território santo serão salvos.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino não conserva o verbo principal desta oração. Algumas versões antigas trazem “viverão”; outras, “serão salvos”.
    reason: textual_variant
lexical_decisions:
- source_word: derelicti sunt de populo tuo
  choice: os que restarem do seu povo
  rationale: Expressa em português natural os sobreviventes ou remanescentes dentre o povo, sem acrescentar a ideia de “até mesmo”, ausente do latim.
- source_word: intra terminum meum Sanctum
  choice: dentro dos limites do meu território santo
  rationale: “Terminus” pode indicar limite, fronteira ou território delimitado; esta formulação preserva a noção espacial e torna claro que “santo” caracteriza o domínio pertencente ao falante.
- source_word: '[verbo principal ausente no latim]'
  choice: serão salvos
  rationale: O latim transmitido não conserva o predicado da oração. As versões antigas relacionadas preservam a ideia de viver ou ser salvo; “serão salvos” segue o testemunho etíope e árabe e produz uma oração completa, em consonância com a reconstrução adotada na camada de consulta.
theological_decisions:
- issue: Natureza da promessa feita aos remanescentes
  choice: serão salvos
  alternative: viverão
  rationale: Os testemunhos antigos divergem entre “viver” e “ser salvo”. A tradução adota “serão salvos”, mas registra a alternativa em nota para não eliminar a ambiguidade textual nem definir além da evidência a natureza exata dessa salvação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição explicativa “os que...” acompanha a estrutura relativa do latim sem tornar a frase excessivamente literal.
