  verdict: revise
  source_fidelity: A tradução preserva adequadamente o sentido de derelicti ... de populo tuo e da relativa qui inueniuntur intra terminum meum sanctum. A oração principal não está preservada no latim transmitido; «serão salvos» é uma reconstrução apoiada por versões antigas e é corretamente qualificada pela nota, que também registra «viverão».
  naturalness: A frase é clara, mas a repetição de «os que» e o possessivo «seu» tornam a formulação um pouco menos direta. Em discurso dirigido a Deus, «teu» é mais claro em português, e a coordenação das duas relativas melhora a fluência.
  terminology: «Território santo» comunica aceitavelmente o domínio delimitado por terminum; «dentro dos limites do meu território santo» mantém a imagem espacial sem reduzir o termo a uma interpretação teológica específica. «Serão salvos» permanece acompanhado de nota textual que preserva a alternativa «viverão».
  issues:
  - severity: low
    issue: Possessivo «seu»
    rationale: Em português, «seu povo» pode ser ambiguamente lido como referência a uma terceira pessoa. «Teu povo» reflete de modo mais inequívoco o vocativo implícito do original.
  - severity: low
    issue: Repetição estrutural desnecessária
    rationale: A sequência «os que restarem ..., os que forem encontrados ...» é compreensível, mas as duas orações relativas se referem ao mesmo grupo. Coordená-las dá leitura mais natural sem alterar o sentido.
  revised_text: Mas os que restarem do teu povo e forem encontrados dentro dos limites do meu território santo serão salvos.[a]
