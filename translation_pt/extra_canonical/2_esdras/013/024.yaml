  text: Therefore know that those who are left are more blessed than those who have died.
translation:
  language: pt
  text: Portanto, saiba que os que restaram são mais bem-aventurados do que os que morreram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scito ergo
  choice: Portanto, saiba
  rationale: Reproduz a conclusão introduzida por ergo e o imperativo singular scito em português natural e digno.
- source_word: magis beatificati sunt
  choice: são mais bem-aventurados
  rationale: Preserva explicitamente o comparativo magis e o sentido de beatificati, sem reduzi-lo apenas a felicidade subjetiva.
- source_word: qui derelicti
  choice: os que restaram
  rationale: No contraste com os mortos, derelicti designa os que ficaram ou sobreviveram; “restaram” comunica isso com clareza sem acrescentar uma causa.
- source_word: super eos qui mortui sunt
  choice: do que os que morreram
  rationale: Verte naturalmente a construção comparativa latina super eos e mantém o perfeito de mortui sunt.
theological_decisions:
- issue: Natureza da bem-aventurança dos sobreviventes
  choice: mais bem-aventurados
  alternative: mais felizes
  rationale: “Bem-aventurados” preserva a possível dimensão objetiva e religiosa do latim beatificati, sem especificar em que consiste essa condição.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. O imperativo singular “saiba” acompanha o latim scito.
