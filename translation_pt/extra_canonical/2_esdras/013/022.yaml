lexical_decisions:
- source_word: quoniam
  choice: Pois
  rationale: Preserva o nexo explicativo ou causal do latim com uma conjunção natural e digna em português.
- source_word: derelicti sunt
  choice: foram deixados
  rationale: Mantém a construção passiva e a repetição deliberada do texto, sem especificar por quem ou em que sentido foram deixados.
- source_word: interpretatio
  choice: interpretação
  rationale: Equivalente direto e adequado ao contexto de explicação da visão.
theological_decisions:
- issue: Sentido dos que foram e não foram deixados
  choice: Preservar a formulação sem identificar os grupos
  alternative: Explicitar como sobreviventes e não sobreviventes
  rationale: O versículo introduz uma interpretação posterior; antecipar a identidade ou o destino dos grupos eliminaria a ambiguidade presente no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A expressão topicalizante «quanto ao que você disse» evita a construção pouco natural «você disse sobre» sem perder o vínculo sintático com os dois grupos.
