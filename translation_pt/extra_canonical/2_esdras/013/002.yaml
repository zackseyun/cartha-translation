  text: And behold[a], a wind arose from the sea to stir up all its waves.
translation:
  language: pt
  text: E eis que do mar se levantava um vento, para agitar todas as suas ondas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: e eis que
  rationale: Preserva o marcador vívido de atenção do latim, em linguagem bíblica ainda clara no português moderno.
- source_word: de mari
  choice: do mar
  rationale: Mantém a indicação de origem expressa pela preposição latina de.
- source_word: ventus exsurgebat
  choice: se levantava um vento
  rationale: O imperfeito traduz o aspecto em desenvolvimento de exsurgebat, enquanto 'se levantava' é uma expressão natural para o surgimento do vento.
- source_word: ut conturbaret
  choice: para agitar
  rationale: Expressa naturalmente a finalidade ou o resultado pretendido da oração latina com ut, sem especificar além do texto.
- source_word: omnes fluctus eius
  choice: todas as suas ondas
  rationale: Conserva a totalidade de omnes e a referência possessiva ao mar.
theological_decisions:
- issue: Possível restauração da passagem ausente em alguns testemunhos latinos
  choice: Traduzir somente o texto latino fornecido para 13:2
  alternative: Acrescentar aqui a introdução da figura semelhante a um homem, preservada em versões orientais
  rationale: A cláusula adicional não consta do texto-fonte latino fornecido e pertence à sequência textual posterior; inseri-la neste versículo ultrapassaria a evidência delimitada para a presente unidade.
translation_notes:
  register: Português moderno, claro e solene, com leve sabor bíblico em 'e eis que'. A ordem foi ajustada para fluência sem perder a progressão nem o aspecto verbal do latim.
