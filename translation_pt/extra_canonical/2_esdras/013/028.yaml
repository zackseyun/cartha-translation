  text: 'et quoniam non tenebat frameam neque vas bellicosum, corrumpitenim impetum eius multitudinis quae venerat ad expugnare eum, haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/028.yaml
  text: 'and that he held neither sword nor weapon of war, yet destroyed the assault of the multitude that had come to attack him, this is the interpretation:'
translation:
  language: pt
  text: 'e que ele não empunhava espada nem arma de guerra, mas destruía a investida da multidão que tinha vindo para atacá-lo, esta é a interpretação:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: frameam
  choice: espada
  rationale: Neste contexto, o substantivo latino designa uma espada; a escolha também corresponde à revisão lexical auditada.
- source_word: vas bellicosum
  choice: arma de guerra
  rationale: Expressão portuguesa natural que preserva o sentido amplo do latim, literalmente um instrumento ou implemento bélico.
- source_word: corrumpit ... impetum
  choice: destruir o ataque
  rationale: Reproduz a ideia de aniquilar ou desfazer a investida hostil, sem tornar a formulação artificial em português.
- source_word: ad expugnare eum
  choice: para combatê-lo
  rationale: Expressa a ação hostil dirigida contra ele sem introduzir uma especificidade militar maior do que o contexto exige.
theological_decisions:
- issue: Modo pelo qual a multidão é vencida
  choice: manter o contraste entre a ausência de armas e a destruição do ataque
  alternative: explicitar que ele vence por poder sobrenatural ou por sua palavra
  rationale: O versículo apenas apresenta o sinal a ser interpretado; não se antecipa aqui a explicação teológica que vem depois.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A estrutura introdutória foi mantida porque o versículo conduz diretamente à interpretação subsequente.
