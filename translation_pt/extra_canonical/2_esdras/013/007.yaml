  text: But I sought to see the region or place from which the mountain had been carved, and I could not.
translation:
  language: pt
  text: Eu, porém, procurei ver a região ou o lugar de onde o monte havia sido esculpido, e não consegui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaesivi videre
  choice: procurei ver
  rationale: Reproduz de modo natural a ideia de empenho em observar ou descobrir, sem ampliar o sentido.
- source_word: regionem vel locum
  choice: a região ou o lugar
  rationale: Mantém a alternativa expressa pelo latim vel e conserva ambos os termos.
- source_word: unde sculptus esset mons
  choice: de onde o monte havia sido esculpido
  rationale: Preserva a imagem incomum do monte como algo esculpido e o valor anterior da forma verbal latina.
- source_word: et non potui
  choice: mas não consegui
  rationale: Em português, a relação adversativa implícita no contexto é expressa naturalmente por “mas”; “não consegui” completa de modo idiomático a ação de procurar ver.
