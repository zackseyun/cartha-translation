  rationale: O demonstrativo retoma o homem já mencionado sem acrescentar a ênfase de “o mesmo”, que não é necessária aqui.
- source_word: descendentem de monte
  choice: descendo do monte
  rationale: Reproduz de modo natural e direto a ação simultânea expressa pelo particípio latino.
- source_word: advocantem ad se
  choice: chamando para junto de si
  rationale: Preserva tanto a ideia de convocar/chamar quanto o movimento em direção ao próprio homem.
- source_word: multitudinem aliam pacificam
  choice: outra multidão pacífica
  rationale: Mantém a ordem e a relação adjetival do latim, com linguagem corrente em português.
