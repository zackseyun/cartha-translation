  text: And because you saw breath and fire and storm coming out from his mouth,[a]
translation:
  language: pt
  text: E, visto que você viu sair da boca dele algo como sopro, fogo e tempestade,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “algo como espírito, fogo e tempestade”.'
    reason: Registra o sentido alternativo possível de spiritum sem apagar a comparação expressa por ut.
lexical_decisions:
- source_word: quoniam
  choice: visto que
  rationale: Introduz a retomada explicativa daquilo que foi visto, de modo natural em português.
- source_word: ut spiritum
  choice: algo como sopro
  rationale: Preserva o valor comparativo de ut na descrição visionária; 'sopro' se ajusta ao que sai da boca, sem excluir totalmente as noções próximas de vento ou espírito.
- source_word: ignem
  choice: fogo
  rationale: Equivalente direto e natural.
- source_word: tempestatem
  choice: tempestade
  rationale: Mantém a imagem intensa do latim sem especificar além da fonte.
- source_word: de ore eius exire
  choice: sair da boca dele
  rationale: Reproduz com clareza o movimento indicado pelo latim.
theological_decisions:
- issue: Sentido de spiritum
  choice: sopro
  alternative: espírito ou vento
  rationale: No contexto de algo que procede da boca junto com fogo e tempestade, 'sopro' é a leitura contextual mais natural; a nota conserva a ambiguidade lexical.
- issue: Valor de ut
  choice: algo como
  alternative: omitir a comparação
  rationale: O marcador comparativo pertence ao texto latino e preserva a natureza de semelhança própria da visão apocalíptica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível. A formulação preserva tanto a retomada explicativa quanto a linguagem aproximativa da visão.
