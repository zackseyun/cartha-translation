lexical_decisions:
- source_word: reposita
  choice: reservadas
  rationale: Expressa aquilo que foi guardado ou destinado para um tempo futuro, de modo natural em português.
- source_word: in novissimis diebus
  choice: para os últimos dias
  rationale: Em ligação com “reservadas”, a preposição “para” comunica que essas coisas estão guardadas para ocorrer nos últimos dias.
- source_word: occurrentes eis
  choice: se depararem com elas
  rationale: Mantém o sentido direto de encontrar ou enfrentar as coisas mencionadas, com o pronome plural retomando corretamente “as coisas”.
- source_word: qui derelicti sunt
  choice: os que forem deixados para trás
  rationale: Preserva a forma passiva e o caráter futuro do contexto, usando uma expressão portuguesa clara para os que restarem.
theological_decisions:
- issue: Sentido de occurrentes
  choice: se depararem com elas
  alternative: as alcançarem
  rationale: O latim pode indicar encontrar/deparar-se com algo, enquanto testemunhos versionais podem favorecer a ideia de alcançar. O texto principal segue mais de perto o valor lexical latino, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com continuidade sintática intencional, pois o versículo é um fragmento que prossegue no contexto. “Últimos dias” conserva a linguagem escatológica tradicional sem acrescentar interpretação denominacional.
