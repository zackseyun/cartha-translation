  yaml_path: translation/extra_canonical/2_esdras/013/041.yaml
  text: But they formed this plan among themselves, that they would leave the multitude of the nations and go on into a more distant region, where no human race had ever lived, so that there they might keep their statutes,
translation:
  language: pt
  text: 'Mas fizeram este plano: deixar a multidão das nações e partir para uma região mais distante, onde o gênero humano nunca havia habitado, para que ao menos ali observassem seus estatutos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: consilium hoc
  choice: este plano
  rationale: Expressa de modo natural e fiel a ideia de uma decisão ou propósito deliberado.
- source_word: multitudinem gentium
  choice: a multidão das nações
  rationale: Preserva a imagem coletiva do latim e mantém 'nações' como equivalente amplo de gentes.
- source_word: ulteriorem regionem
  choice: uma região mais distante
  rationale: Reproduz o sentido comparativo de ulterior sem especificar uma direção ausente no texto.
- source_word: genus humanum
  choice: o gênero humano
  rationale: Mantém a formulação abrangente e solene do original.
- source_word: legitima sua
  choice: seus estatutos
  rationale: Traduz normas próprias e estabelecidas, evitando restringir indevidamente o termo a uma categoria ritual ou jurídica específica.
theological_decisions:
- issue: Finalidade da migração
  choice: para que ao menos ali observassem seus estatutos
  alternative: para que ali guardassem suas leis
  rationale: Mantém a oração de finalidade e a nuance de uel ('ao menos'), sem definir teologicamente a natureza exata de legitima.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluida e leve solenidade bíblica. Nenhuma nota de rodapé foi necessária.
