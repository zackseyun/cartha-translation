  yaml_path: translation/extra_canonical/2_esdras/013/020.yaml
  text: Yet it is easier for one in danger to come into these things than to pass through the age like a cloud and not see what happened in the last days.” And he answered me and said:[a]
translation:
  language: pt
  text: 'Contudo, é mais fácil alguém que está em perigo chegar a estas coisas do que partir deste mundo como uma nuvem e não ver o que aconteceu no fim.[a] Então ele me respondeu e disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “... e não ver o que aconteceu nos últimos dias”. Lit. “a partir do século/era”; neste contexto, a expressão provavelmente se refere a partir deste mundo.'
    reason: Registra a possível extensão temporal de in novissimo e a gama lexical de saeculum, sem sugerir a leitura menos provável de «atravessar uma era».
lexical_decisions:
- source_word: periclitantem
  choice: quem está em perigo
  rationale: Expressa de modo natural o particípio latino, mantendo a ideia de alguém exposto a perigo ou provação.
- source_word: venire in haec
  choice: chegar a essas coisas
  rationale: Preserva a formulação ampla do latim, que pode se referir aos acontecimentos ou circunstâncias descritos no contexto.
- source_word: pertransire sicut nubem a saeculo
  choice: passar deste mundo como uma nuvem
  rationale: Entende a saeculo como expressão de afastamento — partir deste mundo — e conserva a comparação explícita com uma nuvem. A ambiguidade de saeculum é registrada em nota.
- source_word: in novissimo
  choice: no tempo do fim
  rationale: Torna explícito em português o valor temporal e escatológico da expressão sem restringi-la necessariamente a dias específicos.
- source_word: Et respondit ad me et dixit
  choice: Então ele me respondeu e disse
  rationale: Reproduz integralmente a fórmula narrativa presente no texto-fonte, ainda que soe deliberadamente repetitiva em português.
theological_decisions:
- issue: Sentido escatológico de in novissimo
  choice: no tempo do fim
  alternative: nos últimos dias; no fim
  rationale: A escolha preserva a referência ao período final sem definir com precisão maior do que a permitida pela expressão latina.
- issue: Sentido de a saeculo
  choice: deste mundo
  alternative: através desta era
  rationale: O contexto favorece a ideia de partir do mundo antes de presenciar os acontecimentos finais, mas a polissemia de saeculum permite uma leitura relacionada à era; por isso, a alternativa consta em nota.
translation_notes:
  register: Português moderno, claro e digno, com leve solenidade narrativa. A repetição “respondeu e disse” foi mantida por corresponder à fórmula do texto latino.
