  text: and an innumerable multitude will be gathered into one, as you saw,
translation:
  language: pt
  text: e uma multidão incontável será reunida em uma só, como você viu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: colligetur in unum
  choice: será reunida em uma só
  rationale: Preserva tanto a voz passiva futura quanto a ideia explícita de convergência em uma unidade, em vez de apenas indicar que a multidão se ajuntará.
- source_word: multitudo innumerabilis
  choice: uma multidão incontável
  rationale: Formulação natural e digna que corresponde diretamente ao sentido latino.
- source_word: sicut uidisti
  choice: como você viu
  rationale: Tradução direta, clara e corrente da referência à visão anterior do interlocutor.
theological_decisions:
- issue: Natureza da unidade expressa por “in unum”
  choice: em uma só
  alternative: num só lugar
  rationale: O latim afirma reunião em unidade, mas não especifica se essa unidade é espacial, coletiva ou de outro tipo; a tradução evita acrescentar “lugar” e conserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A construção “em uma só” retoma gramaticalmente “multidão” e mantém a ênfase do latim em unum.
