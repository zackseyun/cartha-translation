  yaml_path: translation/extra_canonical/2_esdras/013/054.yaml
  text: For you have forsaken what belongs to you and have devoted yourself to what belongs to me, and have searched out my law.
translation:
  language: pt
  text: Pois você abandonou o que é seu, ocupou-se com o que é meu e examinou a minha lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquisti
  choice: deixou de lado
  rationale: Expressa o abandono voluntário do que lhe pertencia sem sugerir necessariamente negligência moral.
- source_word: tua
  choice: o que era seu
  rationale: Reproduz o neutro plural substantivado latino de modo natural em português.
- source_word: circa mea vacasti
  choice: dedicou-se ao que é meu
  rationale: O idiomatismo latino indica ocupar-se ou aplicar-se às coisas de Deus; esta formulação preserva o contraste com 'o que era seu'.
- source_word: legem meam exquisisti
  choice: buscou conhecer a minha lei
  rationale: Exquiro comunica busca diligente e investigação; 'buscou conhecer' é claro e natural sem reduzir o sentido a mera procura física.
