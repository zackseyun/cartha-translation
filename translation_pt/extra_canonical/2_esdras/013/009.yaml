  text: pugnare. Et ecce ut uidit impetum multitudinis uenientis, non leuauit manum suam, neque frameam tenebat, neque
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/009.yaml
  text: And behold, when he saw the assault of the coming multitude, he did not lift his hand, nor did he hold a spear, nor any weapon of war;
translation:
  language: pt
  text: E eis que, quando viu o ataque da multidão que se aproximava, não levantou a mão, nem empunhava lança alguma, nem qualquer arma de guerra;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et ecce
  choice: E eis que
  rationale: Preserva a fórmula narrativa enfática do latim em português natural e digno.
- source_word: impetum
  choice: o ataque
  rationale: No contexto de uma multidão hostil que avança para combater, “ataque” expressa melhor a investida agressiva do que termos mais vagos como “ímpeto”.
- source_word: multitudinis uenientis
  choice: da multidão que se aproximava
  rationale: Mantém a relação participial e comunica com naturalidade que a multidão vinha na direção dele, sem sugerir apenas uma qualidade abstrata de “vindoura”.
- source_word: non leuauit manum suam
  choice: não levantou a mão
  rationale: Reproduz de perto a expressão latina; o possessivo é dispensável em português e sua omissão evita rigidez.
- source_word: frameam tenebat
  choice: empunhava lança alguma
  rationale: “Framea” designa uma arma de haste, frequentemente uma lança; “empunhava” traduz idiomaticamente “tenebat” no contexto bélico, e “alguma” reforça a negação coordenada.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com cadência narrativa bíblica moderada. A tradução conserva a imagem de ausência de gesto e de armas, sem explicar antecipadamente como o personagem enfrentará a multidão.
