  text: For then the Most High performed signs, and held back the channels of the river until they had crossed.
translation:
  language: pt
  text: Pois então o Altíssimo realizou sinais e deteve os canais do rio até que eles atravessassem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  choice: o Altíssimo
  rationale: Título divino tradicional e direto, preservando o sentido superlativo do latim.
- source_word: signa
  choice: sinais
  rationale: Equivalente natural que mantém a ideia de manifestações extraordinárias sem especificar sua natureza.
- source_word: statuit
  choice: deteve
  rationale: No contexto do rio, expressa fazer parar ou conter o fluxo, de modo mais natural que o sentido básico de estabelecer.
- source_word: uenas fluminis
  choice: os canais do rio
  rationale: A expressão latina literalmente fala das 'veias' do rio; 'canais' comunica em português os cursos ou braços pelos quais a água flui.
- source_word: usquequo transirent
  choice: até que eles atravessassem
  rationale: Preserva a construção temporal e o sujeito plural implícito, referido ao grupo mencionado no contexto.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do latim. Não se acrescentou 'por eles/para eles', pois isso não aparece no texto latino fornecido.
