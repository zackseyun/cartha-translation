lexical_decisions:
- source_word: disposuisti
  choice: orientou
  rationale: Expressa a ideia de ordenar ou dispor a própria vida segundo um princípio, em português natural.
- source_word: in sapientiam
  choice: pela sabedoria
  rationale: O latim indica a sabedoria como âmbito, norma ou princípio orientador; “pela sabedoria” comunica isso com clareza sem tornar a formulação excessivamente literal.
- source_word: sensum
  choice: o entendimento
  rationale: Neste contexto, sensus designa discernimento ou compreensão intelectual, não mera sensação.
- source_word: matrem
  choice: sua mãe
  rationale: Preserva diretamente a metáfora familiar do texto latino.
theological_decisions:
- issue: Personificação do entendimento como mãe
  choice: chamou o entendimento de sua mãe
  alternative: considerou o entendimento sua mãe
  rationale: “Chamou” traduz vocasti de modo direto e conserva a personificação e sua possível tensão metafórica, sem explicá-la teologicamente.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” e preservação do paralelismo entre orientar a vida pela sabedoria e chamar o entendimento de mãe.
