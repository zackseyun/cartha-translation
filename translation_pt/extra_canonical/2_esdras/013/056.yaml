source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et propter hoc ostendi tibi haec, merces apud Altissimum. erit enim post alios tres dies, ad te alia loquar et exponam tibi gravia et mirabilia.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/056.yaml
  text: Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”
translation:
  language: pt
  text: Por isso, mostrei a você estas coisas, pois há uma recompensa junto ao Altíssimo. Pois, depois de mais três dias, falarei novamente com você e lhe explicarei coisas importantes e maravilhosas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: merces apud Altissimum
  choice: há uma recompensa junto ao Altíssimo
  rationale: Mantém a imagem de recompensa e a construção relacional/locativa de apud, sem especificar indevidamente quem a receberá.
- source_word: post alios tres dies
  choice: daqui a mais três dias
  rationale: Expressa em português natural o intervalo adicional indicado por alios.
- source_word: gravia et mirabilia
  choice: coisas profundas e maravilhosas
  rationale: No contexto de revelações a serem explicadas, “profundas” comunica o valor figurado de gravia melhor que o literal “pesadas”, enquanto “maravilhosas” preserva mirabilia.
theological_decisions:
- issue: Destinatário ou fundamento da recompensa
  choice: “há uma recompensa junto ao Altíssimo”, sem explicitar o beneficiário
  alternative: “você receberá uma recompensa do Altíssimo”
  rationale: O latim não declara explicitamente o destinatário nem formula o Altíssimo como agente do ato de recompensar; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação conserva o tom revelatório e evita arcaísmos.
source_grounding:
  english_pob_role: consult_only
