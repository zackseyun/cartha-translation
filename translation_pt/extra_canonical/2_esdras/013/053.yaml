base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/053.yaml
  text: This is the interpretation of the dream that you saw[53], and why you alone have been enlightened concerning these things.
translation:
  language: pt
  text: Esta é a interpretação do sonho que você viu e a razão pela qual somente você foi iluminado sobre estas coisas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: somnii quem vidisti
  choice: do sonho que você teve
  rationale: Em português natural, «ter um sonho» expressa com clareza o latim literal «o sonho que você viu», sem alterar o sentido.
- source_word: propter quod
  choice: a razão pela qual
  rationale: Reproduz a relação causal do latim e evita a possível leitura interrogativa de uma formulação apenas com «por que».
- source_word: inluminatus es
  choice: foi iluminado
  rationale: Preserva a metáfora passiva do texto latino, que indica entendimento ou revelação recebida sem especificar explicitamente o agente.
- source_word: haec solus
  choice: somente você ... acerca destas coisas
  rationale: Mantém a ênfase de «solus» na exclusividade do destinatário e entende «haec» como o conteúdo sobre o qual ele recebeu esclarecimento.
theological_decisions:
- issue: Natureza e agente da iluminação
  choice: Manter «foi iluminado» sem nomear o agente nem explicar o modo da revelação.
  alternative: «Deus lhe revelou» ou «você recebeu entendimento».
  rationale: O latim usa uma forma passiva e metafórica, sem identificar expressamente o agente; explicitar Deus ou substituir a imagem resolveria uma ambiguidade que o texto preserva.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por «você». A frase conserva a concisão do latim e sua linguagem de iluminação reveladora. A nota inglesa fornecida sobre «At the time of his day» não corresponde ao texto latino deste versículo e, por isso, não foi incorporada.
