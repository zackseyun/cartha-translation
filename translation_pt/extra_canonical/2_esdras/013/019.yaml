id: 2ES.13.19
reference: 2 Esdras 13:19
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter hoc vae, viderunt enim pericula magna et necessitates multas, sicut ostendunt somnia haec.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/019.yaml
  text: But as for those who are left—woe to them for this reason! For they will see great dangers and many distresses[a], as these dreams show.
translation:
  language: pt
  text: Por isso, ai deles![a] Pois viram grandes perigos e muitas aflições, como mostram estes sonhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, apenas “ai!”, sem pronome expresso.
    reason: Registra a elipse do latim e a pequena explicitação necessária para uma exclamação natural em português.
lexical_decisions:
- source_word: propter hoc vae
  choice: Por isso, ai deles!
  rationale: Reproduz a relação causal e torna natural em português a exclamação latina elíptica; o referente de “deles” é inferido do verbo plural seguinte, sem acrescentar a ideia de sobreviventes, ausente do texto latino fornecido.
- source_word: viderunt
  choice: viram
  rationale: Mantém o perfeito latino, em vez de adotar o futuro da camada inglesa.
- source_word: pericula magna
  choice: grandes perigos
  rationale: Equivalência direta e idiomática.
- source_word: necessitates multas
  choice: muitas aflições
  rationale: Neste contexto, necessitates indica situações opressivas ou angústias, não simples necessidades materiais.
- source_word: somnia haec
  choice: estes sonhos
  rationale: Preserva o sentido normal de somnia e o demonstrativo latino.
theological_decisions:
- issue: Referência aos que ficaram
  choice: Não incluir “os que ficaram”
  alternative: “Quanto aos que ficaram, ai deles por isso!”
  rationale: A expressão não aparece no texto latino apresentado; incluí-la faria a tradução depender da camada inglesa em vez da evidência-fonte.
- issue: Tempo verbal de viderunt
  choice: 'Passado: “viram”'
  alternative: 'Futuro: “verão”'
  rationale: O texto latino tem o perfeito viderunt. Embora o contexto visionário possa favorecer uma leitura prospectiva, a tradução principal preserva a forma verbal efetivamente atestada.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A formulação é concisa e mantém o tom de advertência. O passado do latim e a ausência de qualquer menção explícita aos sobreviventes foram preservados.
