source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi, et ecce convolabat ipse homo cum nubibus caeli. et ubi vultum suum convertebat ut consideraret, tremebant omnia quae sub eo videbantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/003.yaml
  text: And I looked[a], and behold, that man was flying with the clouds of heaven; and wherever he turned his face to look, everything seen beneath him trembled.
translation:
  language: pt
  text: E olhei, e eis que aquele homem voava com as nuvens do céu; e, para onde quer que voltasse o rosto a fim de olhar, tudo o que se via debaixo dele tremia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma possível leitura refletida em outras versões antigas: “tudo o que era visto por ele tremia”.'
    reason: Registra a tensão entre o latim transmitido, que diz literalmente “debaixo dele”, e a possível leitura de agência preservada por testemunhos versionais.
lexical_decisions:
- source_word: convolabat
  choice: voava
  rationale: Expressa de modo natural o movimento aéreo indicado pelo verbo latino, sem acrescentar direção ou velocidade não explicitadas.
- source_word: ipse homo
  choice: aquele homem
  rationale: Retoma enfaticamente a figura já apresentada na visão; em português, “aquele homem” é mais natural do que o calque “o próprio homem” neste contexto.
- source_word: cum nubibus caeli
  choice: com as nuvens do céu
  rationale: Mantém a associação deliberadamente ampla de cum, sem substituí-la por “sobre” ou “nas”, que especificariam uma relação espacial não expressa.
- source_word: ubi vultum suum convertebat ut consideraret
  choice: para onde quer que voltasse o rosto a fim de olhar
  rationale: Reproduz o sentido iterativo/indefinido de ubi no contexto e conserva a finalidade expressa por ut.
- source_word: sub eo videbantur
  choice: se via debaixo dele
  rationale: 'Representa diretamente o latim transmitido: sub eo indica posição inferior, enquanto a construção impessoal portuguesa comunica com naturalidade videbantur.'
theological_decisions:
- issue: Relação entre o olhar do homem e o tremor das coisas
  choice: tudo o que se via debaixo dele tremia
  alternative: tudo o que era visto por ele tremia
  rationale: O texto latino existente favorece claramente a leitura espacial com sub eo, evitando afirmar que seu olhar causava o tremor. A alternativa pode refletir uma possível construção grega de agente e conta com apoio de outras versões antigas, por isso é registrada em nota sem substituir o texto-fonte latino.
translation_notes:
  register: Português moderno, claro e digno, com cadência visionária preservada por “E olhei, e eis que”. A formulação evita arcaísmos desnecessários e mantém a ambiguidade testemunhal em nota.
