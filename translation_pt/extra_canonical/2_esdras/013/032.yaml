  text: nação contra nação[a] e reino contra reino. E acontecerá que, quando essas coisas sucederem e ocorrerem os sinais que antes mostrei a você, então
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «povo contra povo».'
