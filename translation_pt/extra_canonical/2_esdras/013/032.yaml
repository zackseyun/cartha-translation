lexical_decisions:
- source_word: gens ad gentem
  choice: nação contra nação
  rationale: Preserva o caráter coletivo e o registro apocalíptico da expressão latina, além do paralelismo com «reino contra reino».
- source_word: regnum aduersus regnum
  choice: reino contra reino
  rationale: Tradução direta que mantém o paralelismo e a oposição expressa por adversus.
- source_word: contingent signa
  choice: ocorrerem os sinais
  rationale: Expressa naturalmente em português o surgimento ou cumprimento dos sinais anunciados.
- source_word: ante ostendi tibi
  choice: antes mostrei a você
  rationale: Mantém a referência temporal de ante e traduz tibi em linguagem moderna e amplamente compreensível.
theological_decisions:
- issue: Referente coletivo de gens
  choice: nação
  alternative: povo
  rationale: «Nação» reflete melhor o valor de gens neste contexto apocalíptico e se harmoniza com o contraste político de «reino», sem eliminar a alternativa lexical possível.
- issue: Frase deixada em suspensão por et tunc
  choice: terminar com «então»
  alternative: completar a oração com material do versículo seguinte
  rationale: A fonte termina o versículo com et tunc; conservar «então» preserva a divisão textual e a expectativa sintática sem importar conteúdo do versículo seguinte.
translation_notes:
  register: Português moderno, digno e de leitura natural, com sintaxe próxima da fonte. O início em minúscula e o final suspenso refletem que o versículo integra uma frase que atravessa seus limites.
