source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multitudo tempestatis. Et concidit super multitudinis impetum quod paratum erat pugnare, et succendit omnes, ut subito nihil uideretur de innumerabili multitudine nisi solummodo puluis cineris et fumi odor. et uidi et extiti. Et post haec uidi ipsum hominem descendentem de monte et aduocantem ad se multitudinem aliam pacificam. Et accedebant ad eum uultus hominum multorum, quorundam gaudentium, quorundam tristantium, aliqui uero alligati, aliqui adducentes ex eis qui offerebantur. et ego a multitudine pauoris expergefactus sum et deprecatus sum altissimum et dixi : Tu ab initio demonstrasti seruo tuo mirabilia haec, et dignum me habuisti ut susciperes deprecationem meam; Et nunc demonstra mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/011.yaml
  text: And all these were mixed together—the wave of fire, the breath of flame, and the great storm—and it fell upon the assault of the multitude that had prepared to fight, and burned them all up, so that suddenly nothing could be seen of the innumerable multitude except only the dust of ashes and the smell of smoke. And I saw it and was astonished.
translation:
  language: pt
  text: E todas essas coisas se misturaram — a onda de fogo, o sopro de chama e a grande tempestade —, e isso caiu sobre a investida da multidão que se preparava para lutar e incendiou a todos, de modo que, de repente, nada se via daquela multidão incontável, a não ser pó de cinzas e cheiro de fumaça. Eu vi isso e fiquei pasmado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudo tempestatis
  choice: a grande tempestade
  rationale: Expressa a intensidade ou massa da tempestade em português natural, em consonância com o contexto da enumeração.
- source_word: impetum
  choice: o ataque
  rationale: Preserva a ideia de investida hostil da multidão preparada para combater.
- source_word: succendit omnes
  choice: consumindo a todos pelo fogo
  rationale: Comunica que todos foram incendiados e destruídos, sem reduzir o verbo apenas a um ato inicial de atear fogo.
- source_word: puluis cineris
  choice: pó de cinzas
  rationale: Mantém de perto a imagem concreta do latim, em formulação compreensível no português atual.
- source_word: fumi odor
  choice: cheiro de fumaça
  rationale: Tradução direta e idiomática da expressão latina.
- source_word: extiti
  choice: fiquei assombrado
  rationale: No contexto da visão, representa a reação súbita e intensa do vidente sem especificar uma interpretação além do que o texto permite.
theological_decisions:
- issue: Natureza do juízo exercido pelo homem da visão
  choice: Manter as imagens de fogo, chama e tempestade sem explicá-las teologicamente
  alternative: Identificar explicitamente as imagens com uma forma específica de juízo divino ou messiânico
  rationale: O versículo apresenta a cena visionária, mas não fornece aqui uma explicação doutrinária; a tradução preserva essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. A primeira oração segue a evidência contextual preservada na camada inglesa auditada, pois o trecho latino fornecido começa no fim da expressão correspondente. A divisão em três frases evita um período excessivamente longo sem alterar a progressão da visão.
