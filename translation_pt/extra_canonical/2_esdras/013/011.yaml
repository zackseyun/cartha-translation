revisions:
- from: E todas essas coisas se misturaram — a onda de fogo, o sopro de chama e a grande tempestade — e caíram sobre o ataque da multidão que estava preparada para lutar, consumindo a todos pelo fogo. De repente, daquela multidão incontável, nada se via, a não ser pó de cinzas e cheiro de fumaça. Eu vi isso e fiquei assombrado.
  to: E todas essas coisas se misturaram — a onda de fogo, o sopro de chama e a grande tempestade —, e isso caiu sobre a investida da multidão que se preparava para lutar e incendiou a todos, de modo que, de repente, nada se via daquela multidão incontável, a não ser pó de cinzas e cheiro de fumaça. Eu vi isso e fiquei pasmado.
  rationale: A revisão torna singular o fenômeno que cai sobre a investida, em conformidade com *quod* e com o audit trail inglês, e ajusta a reação final para uma formulação portuguesa mais precisa. O restante da redação é mantido, inclusive a ambiguidade e a linguagem imagética da visão.
