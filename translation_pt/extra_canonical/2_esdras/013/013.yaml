- from: 'E muitos rostos humanos se aproximavam dele: alguns alegres, outros tristes; alguns estavam amarrados, e outros traziam os que eram conduzidos. Então despertei, tomado de grande pavor, supliquei ao Altíssimo e disse:'
  to: 'E muitos rostos humanos se aproximavam dele: alguns se alegrando, outros se entristecendo; alguns estavam amarrados, e outros traziam os que eram conduzidos. E eu despertei por causa do grande pavor, supliquei ao Altíssimo e disse:'
  rationale: A revisão remove o conector temporal acrescentado, torna explícita a coordenação enfática de «E eu» e restaura a relação causal entre o pavor intenso e o despertar. Também aproxima «gaudentium» e «tristantium» de seu caráter participial, sem alterar a imagem ou resolver de modo excessivo a construção textual difícil relativa aos que eram conduzidos.
