base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/013.yaml
  text: 'And many human faces were coming to him: some rejoicing, some grieving; some were bound, and some were bringing those who were being led. And I awoke from the greatness of my fear, and I made supplication to the Most High and said,'
translation:
  language: pt
  text: 'E muitos rostos humanos se aproximavam dele: alguns se alegrando, outros se entristecendo; alguns estavam amarrados, e outros traziam os que eram conduzidos. E eu despertei por causa do grande pavor, supliquei ao Altíssimo e disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: accedebant ad eum
  choice: se aproximavam dele
  rationale: Expressa de modo natural o movimento em direção a ele, preservando o aspecto contínuo do imperfeito latino.
- source_word: vultus hominum multorum
  choice: muitos rostos humanos
  rationale: Mantém a imagem incomum e visual de vultus sem restringir hominum ao sexo masculino.
- source_word: alligati
  choice: amarrados
  rationale: Termo corrente e concreto para pessoas presas por laços, sem especificar algemas ou correntes ausentes do texto.
- source_word: adducentes ex eis qui offerebantur
  choice: traziam os que eram conduzidos
  rationale: Evita a leitura sacrificial de offerebantur e comunica que essas pessoas eram levadas ou apresentadas, embora a construção latina seja difícil.
- source_word: a multitudine pavoris
  choice: tomado de grande pavor
  rationale: Reproduz idiomaticamente a intensidade do medo indicada pela expressão latina.
- source_word: deprecatus sum
  choice: supliquei
  rationale: Verbo natural e digno que comunica um pedido insistente dirigido ao Altíssimo.
