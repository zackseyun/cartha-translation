lexical_decisions:
- source_word: magis
  choice: quanto mais
  rationale: Mantém o valor comparativo do latim e a ligação desta frase com o contexto anterior.
- source_word: adzelabor
  choice: me indignarei contra
  rationale: Expressa um zelo intenso dirigido contra os culpados; em português corrente, «me indignarei contra» comunica melhor a reação judicial hostil do que o pouco natural «terei zelo contra».
- source_word: super peccata
  choice: por causa de seus pecados
  rationale: Torna explícita a relação causal e fornece em português o referente possessivo implícito no contexto latino.
- source_word: Quomodo
  choice: Como
  rationale: Preserva a palavra inicial da frase seguinte, embora o versículo termine de forma incompleta.
theological_decisions:
- issue: Natureza da reação divina em adzelabor
  choice: me indignarei contra
  alternative: serei zeloso contra
  rationale: Evita reduzir o termo simplesmente a ira, mas usa uma formulação portuguesa natural que conserva a intensidade e a orientação contrária do zelo divino.
translation_notes:
  register: Português moderno, claro e digno. A terminação abrupta em «Como» foi preservada porque Quomodo inicia a oração que continua no versículo seguinte.
