lexical_decisions:
- source_word: mala
  choice: desgraças
  rationale: No contexto, o plural substantivado indica calamidades ou males que sobrevêm às pessoas; “desgraças” comunica isso com clareza no português atual.
- source_word: repellat ea
  choice: afastá-las
  rationale: Preserva a ideia de repelir ou fazer recuar as calamidades, com formulação natural e digna.
- source_word: quis est qui
  choice: quem poderá
  rationale: A pergunta retórica latina indaga quem seria capaz de repelir essas desgraças; a construção portuguesa expressa naturalmente essa força modal.
