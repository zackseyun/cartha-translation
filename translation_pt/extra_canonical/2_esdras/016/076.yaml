  text: Não tenham medo nem hesitem, pois Deus é o guia de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: timeatis
  choice: tenham medo
  rationale: Equivalente natural e direto do latim timeatis, mantendo a proibição dirigida a mais de uma pessoa.
- source_word: haesitemini
  choice: hesitem
  rationale: Reflete o sentido de vacilar ou ficar indeciso, sem introduzir a ideia mais específica de dúvida intelectual.
- source_word: dux
  choice: guia
  rationale: Neste contexto, expressa quem conduz e orienta; corresponde com naturalidade ao predicativo latino dux.
theological_decisions:
- issue: Relação de Deus com os destinatários
  choice: Deus é o guia de vocês
  alternative: Deus é o seu guia
  rationale: A forma explícita no plural evita que o possessivo português seja entendido como singular ou formal e preserva vester, dirigido ao grupo.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos no plural formulados segundo o uso brasileiro corrente. A coordenação “nem” preserva as duas proibições paralelas do latim.
