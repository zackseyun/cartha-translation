  yaml_path: translation/extra_canonical/2_esdras/016/027.yaml
  text: The grape will yield itself for the vintage[a], and who will gather it? For there will be great desolation in places.
translation:
  language: pt
  text: A uva se entregará para a vindima, e quem a recolherá?[a] Pois haverá grande desolação em lugares.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «e quem a atará?»; no contexto, pode referir-se a juntar ou recolher as uvas.
    reason: Preserva o sentido lexical de *adligabit* e a incerteza da imagem agrícola, enquanto o texto principal oferece uma formulação compreensível no contexto da vindima.
lexical_decisions:
- source_word: uva
  choice: a uva
  rationale: Mantém a imagem concreta e a personificação do singular latino, em vez de substituí-la por «a videira» ou generalizá-la como «as uvas».
- source_word: tradet se ad vindemiam
  choice: se entregará para a vindima
  rationale: Preserva a personificação vívida de tradet se e expressa ad vindemiam em português natural, sem reduzir a frase a «amadurecerá».
- source_word: adligabit eam
  choice: a recolherá
  rationale: No contexto da vindima, comunica a ação de juntar ou recolher a uva. Como adligabit significa literalmente «atará/amarrará», essa particularidade é preservada em nota.
- source_word: desertio multa
  choice: grande desolação
  rationale: Muita modifica «desolação», indicando intensidade ou extensão; «grande desolação» é idiomático e fiel.
- source_word: locis
  choice: em alguns lugares
  rationale: O plural latino é indefinido e não traz artigo; «em alguns lugares» evita o pouco natural «em lugares» sem transformar multa em modificador de «lugares».
theological_decisions: []
translation_notes:
  register: Português atual, digno e de leitura ampla, com estrutura coordenada próxima do latim. A personificação da uva foi mantida, e a dificuldade lexical de adligabit foi explicitada sem importar interpretação teológica.
