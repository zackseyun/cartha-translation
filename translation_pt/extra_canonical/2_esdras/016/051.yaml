  text: zelatur fornicariam mulierem idonea et bona ualde, Sic zela bitur iusticia iniquitatem cum exornat se, et accusat eam in faciem, cum uenerit qui defendat exquirentem omnem peccatum super terram. Propterea nolite similari eam nec operibus eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/051.yaml
  text: As a respectable and very beautiful woman is indignant toward a prostitute[a], so righteousness will be indignant toward iniquity when it adorns itself, and will accuse it to its face when he comes who defends the one who searches out every sin upon the earth[b]. Therefore do not be like it or its works.
translation:
  language: pt
  text: Assim como uma mulher digna e muito boa se indigna com uma prostituta[a], assim também a justiça se indignará com a injustiça quando esta se enfeitar, e a acusará diretamente, quando vier aquele que defende quem investiga todo pecado sobre a terra[b]. Portanto, não se tornem semelhantes a ela nem às suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim neste trecho é difícil e condensado. A imagem parece comparar a justiça e a injustiça sob as figuras de uma mulher digna e de uma prostituta, apresentando a justiça como aquela que expõe abertamente a injustiça.
    reason: textual_variant
  - marker: b
    text: 'Também é possível entender: “Assim como uma mulher digna e muito boa se indigna com uma prostituta, assim a justiça se indignará com a injustiça quando ela se enfeitar e a acusará diretamente, quando vier aquele que defende quem investiga todo pecado sobre a terra.” A relação exata entre “aquele que defende” e “quem investiga” é incerta no latim.'
    reason: previous_rendering
lexical_decisions:
- source_word: zelatur / zelabitur
  choice: se indigna / se indignará
  rationale: Preserva o valor de zelo indignado ou reação veemente sugerido pelo verbo latino, sem reduzi-lo necessariamente a mero ódio.
- source_word: fornicariam mulierem
  choice: uma prostituta
  rationale: Expressa de modo direto e natural a figura feminina contrastada com a mulher digna.
- source_word: idonea et bona ualde
  choice: digna e muito bela
  rationale: O latim é difícil; 'digna' comunica idonea, enquanto 'muito bela' segue a compreensão contextual de bona ualde refletida pela tradição de tradução.
- source_word: iusticia / iniquitatem
  choice: a justiça / a injustiça
  rationale: Mantém o contraste moral personificado do texto latino em linguagem portuguesa corrente.
- source_word: cum exornat se
  choice: quando esta se enfeitar
  rationale: Torna explícito que o sujeito é a injustiça e preserva a ideia de adornar-se ou apresentar-se de modo atraente.
- source_word: accusat eam in faciem
  choice: a acusará face a face
  rationale: Conserva a acusação aberta e direta indicada pela expressão latina.
- source_word: nolite similari eam nec operibus eius
  choice: não se tornem semelhantes a ela nem às suas obras
  rationale: Reproduz a proibição final omitida em versões anteriores e mantém como referente mais provável a injustiça personificada.
theological_decisions:
- issue: Identidade daquele que vem e relação entre 'defendat' e 'exquirentem'
  choice: “quando vier aquele que defende quem investiga todo pecado sobre a terra”
  alternative: “quando vier aquele que vindica o que investiga todo pecado sobre a terra” ou entender as expressões como referentes à mesma figura divina
  rationale: A sintaxe latina é comprimida e ambígua. A tradução preserva a distinção gramatical possível entre quem vem, quem defende e quem investiga, sem impor uma identificação teológica não explicitada.
- issue: Personificação e gênero da injustiça
  choice: Retomar 'a injustiça' por “esta”, “a” e “ela”
  alternative: Usar construções impessoais ou neutras
  rationale: Em português, 'injustiça' é feminino, e a retomada feminina mantém com naturalidade a personificação e o paralelo com a prostituta.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção conserva a personificação moral e a ambiguidade da cláusula final, evitando identificar de forma dogmática suas figuras.
