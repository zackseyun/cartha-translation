revisions:
- from: Assim como uma mulher digna e muito bela se indigna com uma prostituta[a], assim também a justiça se indignará com a injustiça quando esta se enfeitar, e a acusará face a face, quando vier aquele que defende quem investiga todo pecado sobre a terra[b]. Portanto, não se tornem semelhantes a ela nem às suas obras.
  to: Assim como uma mulher digna e muito boa se indigna com uma prostituta[a], assim também a justiça se indignará com a injustiça quando esta se enfeitar, e a acusará diretamente, quando vier aquele que defende quem investiga todo pecado sobre a terra[b]. Portanto, não se tornem semelhantes a ela nem às suas obras.
