  text: Uma espada foi enviada contra vocês; quem é que a desviará?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: est uobis gladius
  choice: Uma espada foi enviada contra vocês
  rationale: O latim preservado começa literalmente com “há para vocês uma espada”, mas o contexto imediato e a frase seguinte, “Inmissus est”, sustentam a ideia de uma espada desencadeada ou enviada contra os destinatários. A formulação portuguesa reúne naturalmente essas duas expressões, em consonância com a evidência textual e a camada inglesa auditada.
- source_word: auertat illum
  choice: fazê-la recuar
  rationale: “Avertere” significa desviar, afastar ou fazer voltar. “Fazê-la recuar” comunica de modo claro a impossibilidade de deter e repelir a espada já enviada, mantendo a imagem do original.
