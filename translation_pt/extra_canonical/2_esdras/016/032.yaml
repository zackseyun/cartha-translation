  text: So in those days, three or four will remain from those who search their houses with the sword.
translation:
  language: pt
  text: Assim, naqueles dias, restarão três ou quatro dentre os que revistam as casas deles à espada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: remanebunt
  choice: restarão
  rationale: Expressa de modo natural a ideia de sobreviver ou permanecer após a devastação, sem acrescentar um agente não explícito.
- source_word: ab scrutantibus
  choice: dentre os que revistam
  rationale: Preserva a construção latina difícil com ab como ideia de separação ou proveniência, refletida também na camada inglesa, em vez de torná-la passiva à força.
- source_word: domos eorum
  choice: as casas deles
  rationale: Mantém o referente pronominal masculino ou misto e a referência concreta às casas.
- source_word: in romphea
  choice: à espada
  rationale: Traduz a expressão instrumental como ação armada; «à espada» é conciso, digno e idiomático em contexto de violência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene. A formulação mantém a dificuldade sintática do latim sem tentar identificar além do texto quem são os três ou quatro ou quem revista as casas.
