  source_fidelity: A tradução preserva a estrutura difícil de «sic remanebunt ... tres vel quattuor ab scrutantibus domos eorum in romphea». «Restarão» corresponde bem a remanebunt, e «dentre os que revistam» mantém, sem resolver indevidamente, a relação de separação/proveniência expressa por ab scrutantibus. «À espada» traduz adequadamente o instrumental in romphea.
