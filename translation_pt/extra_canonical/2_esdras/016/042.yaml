  rationale: Mantém a ligação conclusiva ou exortativa com o contexto anterior sem explicitar além do latim.
- source_word: aduenae
  choice: estrangeiros
  rationale: Expressa pessoas que vivem fora de sua terra ou sem pertencimento estável; é natural e preserva a imagem de transitoriedade.
- source_word: terrae
  choice: na terra
  rationale: O genitivo latino pode ter valor de relação/localidade; esta formulação segue o sentido contextual e a leitura auditada em inglês.
- source_word: Qui uendit
  choice: quem vende
  rationale: Reproduz de modo direto e inclusivo a construção substantivada latina.
- source_word: quasi qui fugiet
  choice: como quem haverá de fugir
  rationale: Preserva o futuro fugiet e a comparação introduzida por quasi, sem transformar a fuga em mera possibilidade ou iminência.
theological_decisions:
- issue: Caráter transitório da relação com a terra e os bens
  choice: Preservar as imagens de estrangeiro e de fuga sem explicação interpretativa
  alternative: Parafrasear como um chamado ao desapego dos bens terrenos
  rationale: O texto apresenta imagens escatológicas tensas, mas não formula explicitamente uma doutrina do desapego; a tradução não deve resolver a imagem em uma interpretação.
translation_notes:
