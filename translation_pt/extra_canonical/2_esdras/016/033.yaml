source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et relinquetur deserta terra, et agri eius inveteraverunt, et viae eius et omnes semitae germinabunt spinas, eo quod non transient oves per eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/033.yaml
  text: And the land will be left desolate[a], and its fields will grow old, and its roads and all its paths will sprout thorns, because sheep will not pass through them.
translation:
  language: pt
  text: E a terra ficará deserta, seus campos envelhecerão[a], e suas estradas e todas as suas veredas produzirão espinhos, porque ovelhas não passarão por ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: se deteriorarão.'
    reason: Inveteraverunt significa literalmente envelhecer ou tornar-se velho, podendo no contexto descrever campos que se deterioram por abandono.
lexical_decisions:
- source_word: terra
  choice: terra
  rationale: Mantém o sentido de território ou chão habitado que ficará desolado; o contexto favorece a terra como região, não o planeta.
- source_word: agri
  choice: campos
  rationale: Equivalente natural para áreas cultiváveis ou rurais pertencentes à terra mencionada.
- source_word: inveteraverunt
  choice: envelhecerão
  rationale: Reproduz de perto o sentido de inveterare, ‘envelhecer, tornar-se velho’; o contexto futuro orienta a forma verbal, embora o latim admita a ideia contextual de deterioração por abandono.
- source_word: viae ... semitae
  choice: estradas ... veredas
  rationale: Distingue vias maiores de caminhos menores em português corrente e digno.
- source_word: germinabunt spinas
  choice: produzirão espinhos
  rationale: Expressa literalmente a imagem de brotar ou fazer nascer espinhos sem introduzir ‘sarças’, ausente do texto latino.
- source_word: oves
  choice: ovelhas
  rationale: Mantém o plural e a imagem pastoril do original.
- source_word: per eam
  choice: por ela
  rationale: O pronome latino singular feminino retoma naturalmente terra, também singular e feminino, e não as estradas e veredas plurais.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com estrutura próxima do latim. A personificação ‘campos envelhecerão’ foi preservada por fidelidade lexical, acompanhada de nota para esclarecer a nuance contextual.
