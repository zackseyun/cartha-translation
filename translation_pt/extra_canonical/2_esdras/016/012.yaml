  text: Will not the earth be utterly crushed before him? The earth quakes[a], and its foundations; the sea surges from the deep, and its waves and its fish will be troubled before the Lord and before the glory of his power.
translation:
  language: pt
  text: A terra não será completamente esmagada diante dele? A terra tremeu, bem como os seus alicerces; o mar se agita das profundezas, e suas ondas e seus peixes serão perturbados diante do Senhor e da glória do seu poder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: funditus conteretur
  choice: será completamente esmagada
  rationale: Preserva o futuro passivo e a ideia enfática de destruição total expressa por “funditus”.
- source_word: a facie ipsius / a facie domini
  choice: diante dele / diante do Senhor
  rationale: Mantém a imagem relacional e espacial de “facies” sem reduzi-la apenas a causalidade.
- source_word: mare fluctuatur de profundo
  choice: o mar se agita desde as profundezas
  rationale: Expressa naturalmente o movimento impetuoso do mar que procede do profundo.
- source_word: disturbabuntur
  choice: ficarão perturbados
  rationale: Conserva o futuro passivo do latim e permite que o verbo governe tanto as ondas quanto os peixes.
- source_word: gloria uirtutis eius
  choice: a glória do seu poder
  rationale: “Poder” comunica o sentido de força ou potência de “virtus” neste contexto teofânico.
theological_decisions:
- issue: Efeito da presença divina sobre a criação
  choice: diante do Senhor e da glória do seu poder
  alternative: por causa do Senhor e da glória do seu poder
  rationale: A formulação escolhida preserva a imagem tradicional de reação perante a presença divina, sem excluir a nuance causal.
- issue: Mudança de tempos verbais na descrição apocalíptica
  choice: tremeu; se agita; ficarão perturbados
  alternative: treme; se agita; ficarão perturbados
  rationale: Mantém os tempos verbais atestados no latim — perfeito, presente e futuro — em vez de uniformizá-los e apagar a tensão temporal do texto.
translation_notes:
  register: Português atual, claro e solene, com sintaxe acessível. A alternância temporal do latim foi preservada, e “bem como” torna explícita a extensão do tremor aos alicerces sem introduzir uma nova ação.
