revisions:
- from: A terra não será completamente esmagada diante dele? A terra tremeu[a], bem como os seus alicerces; o mar se agita desde as profundezas, e suas ondas e seus peixes ficarão perturbados diante do Senhor e da glória do seu poder.
  to: A terra não será completamente esmagada diante dele? A terra tremeu, bem como os seus alicerces; o mar se agita das profundezas, e suas ondas e seus peixes serão perturbados diante do Senhor e da glória do seu poder.
  rationale: Remove-se a nota sem apoio necessário, pois o perfeito latino já está corretamente representado por «tremeu» e não deve ser relativizado por uma alternativa no presente. Ajustam-se «desde as profundezas» para «das profundezas» e «ficarão perturbados» para «serão perturbados», preservando o sentido e os tempos do original.
