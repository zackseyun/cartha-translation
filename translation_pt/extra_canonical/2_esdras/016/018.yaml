source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in illis diebus? Initium dolorum et multi gemitus, initium famis et multi interient, initium bellorum et formidabunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/018.yaml
  text: 'In those days: the beginning of pains and much groaning, the beginning of famine and many will perish, the beginning of wars and they will be afraid, the beginning of evils and all will tremble.'
translation:
  language: pt
  text: 'Naqueles dias: o começo das dores e muitos gemidos; o começo da fome, e muitos perecerão; o começo das guerras, e terão medo; o começo dos males, e todos tremerão.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dolorum
  choice: das dores
  rationale: Mantém o sentido amplo e concreto do latim, sem restringi-lo a dores de parto ou a um sofrimento especificamente interpretado.
- source_word: multi gemitus
  choice: muitos gemidos
  rationale: Reproduz naturalmente em português o plural latino e preserva a construção nominal da sequência.
- source_word: interient
  choice: perecerão
  rationale: Expressa a ideia de morrer ou ser destruído com a solenidade adequada ao registro profético.
- source_word: formidabunt
  choice: terão medo
  rationale: Traduz diretamente o verbo latino sem acrescentar uma intensidade ou um sujeito não expresso no texto fornecido.
- source_word: malorum
  choice: dos males
  rationale: Preserva a abrangência semântica de males, que pode incluir calamidades e desgraças, sem resolver essa amplitude.
- source_word: trepidabunt
  choice: tremerão
  rationale: Mantém a imagem corporal e emocional do temor presente na tradição textual refletida pela camada inglesa auditada.
theological_decisions:
- issue: Sujeito implícito de formidabunt
  choice: eles terão medo
  alternative: os governantes terão medo
  rationale: O texto latino fornecido não identifica o sujeito; por isso, não se acrescenta “os governantes” nem outro grupo específico.
- issue: Estrutura profética nominal
  choice: preservar a repetição “o começo...”
  alternative: expandir para “começarão...” ou “haverá...”
  rationale: A repetição conserva a força retórica e a tensão da formulação latina sem explicitar relações sintáticas ausentes.
- issue: Cláusula final sobre os males
  choice: incluir “o começo dos males, e todos tremerão”
  alternative: omitir a cláusula por não constar no recorte latino apresentado
  rationale: A cláusula consta na camada inglesa auditada e corresponde à continuação textual associada a este versículo; sua inclusão preserva a extensão editorial indicada para 2 Esdras 16:18.
translation_notes:
  register: Português moderno, claro e solene, com pontuação em membros paralelos para conservar o ritmo profético. Evitou-se linguagem arcaica e qualquer identificação interpretativa do sujeito de “terão medo”.
