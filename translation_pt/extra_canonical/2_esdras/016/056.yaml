  yaml_path: translation/extra_canonical/2_esdras/016/056.yaml
  text: He who said, “Let heaven be made,” and it was made; and by his word the stars were founded.
translation:
  language: pt
  text: 'Aquele que disse: “Faça-se o céu”, e foi feito; e por sua palavra as estrelas foram fundadas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fiat caelum
  choice: “Faça-se o céu”
  rationale: Preserva a forma volitiva e solene do latim, com uma formulação natural e reconhecível em português.
- source_word: factum est
  choice: “ele foi feito”
  rationale: Mantém a correspondência explícita entre a ordem e seu cumprimento; o pronome retoma “o céu” com clareza.
- source_word: in uerbo illius
  choice: “por sua palavra”
  rationale: Neste contexto, a preposição latina in expressa o meio ou poder eficaz pelo qual as estrelas foram estabelecidas.
- source_word: stellae fundatae
  choice: “as estrelas foram firmadas”
  rationale: “Firmadas” conserva a imagem de fundamento e estabilidade de fundatae sem sugerir literalmente a construção de alicerces físicos.
theological_decisions:
- issue: Agente implícito e poder criador da palavra
  choice: Manter “Aquele que disse” e “por sua palavra” sem identificar mais especificamente o agente.
  alternative: Explicitar “Deus” ou interpretar “palavra” como uma pessoa divina.
  rationale: O trecho latino não nomeia o agente neste versículo nem resolve a natureza de “sua palavra”; a tradução preserva essa formulação sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com cadência solene adequada ao discurso criacional. Não há necessidade de notas textuais neste versículo.
