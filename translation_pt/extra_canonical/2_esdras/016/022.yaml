source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce erit annonae vilitas in brevi super terram, ut putent sibi esse directam pacem. tunc superflorescent mala super terram, gladius et famis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/022.yaml
  text: 'Behold[a], grain will soon be cheap upon the earth, so that they will think peace has been secured for them[b]. Then evils will spring up upon the earth: sword and famine.'
translation:
  language: pt
  text: 'Eis que[a], em breve, os cereais ficarão baratos sobre a terra, de modo que pensarão que a paz está garantida para eles[b]. Então os males brotarão em abundância sobre a terra: espada e fome.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A tradição latina deste capítulo contém um bloco de material duplicado em torno dos versículos 22–35. A presente tradução segue uma só vez a sequência mais completa, em vez de repetir os mesmos juízos.
    reason: compositional_layer
  - marker: b
    text: 'Ou: “que a paz foi estabelecida para eles”.'
    reason: translation_alternative
lexical_decisions:
- source_word: annonae vilitas
  choice: os cereais ficarão baratos
  rationale: A expressão latina indica a baixa do preço dos cereais ou dos mantimentos. Esta formulação comunica de modo claro e natural a aparente abundância econômica que levará o povo a uma falsa sensação de segurança.
- source_word: in brevi
  choice: em breve
  rationale: Mantém explicitamente o elemento temporal do texto latino.
- source_word: directam pacem
  choice: a paz está garantida para eles
  rationale: Expressa em português natural a ideia de uma paz considerada assegurada ou posta em ordem, sem afirmar que essa percepção corresponde à realidade.
- source_word: superflorescent
  choice: brotarão em abundância
  rationale: Conserva a imagem vegetal intensificada do verbo latino e transmite a rápida proliferação dos males.
- source_word: gladius et famis
  choice: espada e fome
  rationale: Preserva as imagens tradicionais e concisas de guerra e carestia presentes no texto latino, sem acrescentar material da tradição duplicada.
theological_decisions:
- issue: A paz percebida antes dos juízos
  choice: pensarão que a paz está garantida para eles
  alternative: pensarão que a paz foi estabelecida para eles
  rationale: A tradução mantém a tensão entre a percepção humana de segurança e o surgimento subsequente dos males. Não declara que Deus realmente garantiu essa paz.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. “Eis que” preserva o tom profético; “brotarão em abundância” mantém a figura expressiva do latim sem soar artificial.
