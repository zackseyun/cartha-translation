  yaml_path: translation/extra_canonical/2_esdras/016/062.yaml
  text: He formed man, and put a heart in the midst of the body, and gave him spirit and life and understanding,
translation:
  language: pt
  text: Ele formou o ser humano, pôs-lhe um coração no meio do corpo e deu-lhe espírito, vida e entendimento,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hominem
  choice: o ser humano
  rationale: Expressa o sentido genérico de humanidade em português atual, sem restringir indevidamente a referência ao sexo masculino.
- source_word: medio corporis
  choice: no meio do corpo
  rationale: Reproduz de modo direto e natural a localização indicada pelo latim.
- source_word: misit ei
  choice: deu-lhe
  rationale: Embora «misit» tenha o sentido básico de «enviou» ou «pôs», neste contexto a construção indica a concessão de espírito, vida e entendimento; «deu-lhe» é natural e coincide com o sentido contextual sem acrescentar doutrina.
- source_word: spiritum et uitam et intellectum
  choice: espírito, vida e entendimento
  rationale: Mantém os três termos distintos e a coordenação do original, preservando «espírito» sem decidir além do texto se se trata de fôlego vital ou de uma dimensão espiritual.
theological_decisions:
- issue: Sentido de «spiritum»
  choice: espírito
  alternative: fôlego
  rationale: «Espírito» conserva a amplitude semântica e a possível tensão antropológica do latim; «fôlego» resolveria a expressão apenas no sentido de vida física.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A vírgula final foi mantida porque o trecho fornecido continua sintaticamente no contexto.
