source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: thesauros illorum, qui metitus est mare et conceptum eius; Qui conclusit mare in medio aquarum et suspendit terram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/058.yaml
  text: He searches the deep and its treasures; he has measured the sea and what it contains; he has enclosed the sea in the midst of the waters and suspended the earth.
translation:
  language: pt
  text: Ele sonda as profundezas e os seus tesouros; mediu o mar e o que ele contém; encerrou o mar no meio das águas e suspendeu a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: thesauros illorum
  choice: os seus tesouros
  rationale: Conserva a imagem de riquezas ocultas pertencentes às profundezas, em concordância com o contexto preservado na tradição textual.
- source_word: metitus est mare
  choice: mediu o mar
  rationale: Tradução direta e natural do perfeito latino, que descreve a ação divina de determinar a extensão do mar.
- source_word: conceptum eius
  choice: o que ele contém
  rationale: Expressa em português corrente o conteúdo ou aquilo que está encerrado no mar, sem tornar a formulação mais específica do que o latim permite.
- source_word: conclusit mare in medio aquarum
  choice: encerrou o mar no meio das águas
  rationale: Mantém a linguagem cosmológica e a aparente tensão entre o mar e as águas, sem tentar harmonizá-la.
- source_word: suspendit terram
  choice: suspendeu a terra
  rationale: Preserva literalmente a imagem cosmológica do texto latino.
theological_decisions:
- issue: Sujeito divino implícito
  choice: Ele
  alternative: Deus
  rationale: O latim emprega formas verbais e um relativo com sujeito recuperado do contexto; o pronome preserva essa referência sem introduzir explicitamente um nome ausente neste trecho.
- issue: Linguagem cosmológica
  choice: Manter “no meio das águas” e “suspendeu a terra”
  alternative: Reformular segundo uma descrição cosmológica moderna
  rationale: As imagens pertencem à afirmação poética e teológica do texto e devem ser preservadas, não atualizadas ou explicadas na tradução.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. “Sonda” comunica investigação profunda sem coloquialismo; a sequência de três orações conserva o ritmo solene do original e da camada inglesa auditada.
