  text: quosdam ex uobis et cibabunt idolis occisam. Et qui consenserint eis, erint illis in derisum et in inproperium et in conculcationem;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/070.yaml
  text: some of you[a], and they will feed you food sacrificed to idols. And those who consent to them will be for them an object of derision and reproach and trampling underfoot.
translation:
  language: pt
  text: alguns de vocês[a], e os alimentarão com comida sacrificada aos ídolos. E os que consentirem com eles serão, para eles, objeto de zombaria, insulto e pisoteio.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase começa no versículo anterior.
    reason: O texto latino deste versículo se inicia com o acusativo «alguns de vocês», dependente da oração precedente; a nota esclarece a construção fragmentária sem completá-la por conjectura.
lexical_decisions:
- source_word: quosdam ex uobis
  choice: alguns de vocês
  rationale: Reproduz o acusativo latino que dá continuidade à oração do versículo anterior, sem inventar nesta unidade o verbo que o rege.
- source_word: cibabunt idolis occisam
  choice: os alimentarão com comida sacrificada aos ídolos
  rationale: O objeto plural retomado por «os» é «alguns de vocês»; «comida sacrificada aos ídolos» expressa naturalmente o sentido cultual de idolis occisam, cuja forma latina pressupõe alimento ou carne.
- source_word: consenserint eis
  choice: consentirem com eles
  rationale: Mantém o sentido de concordar ou aquiescer às pessoas mencionadas, sem especificar além do latim a natureza desse consentimento.
- source_word: in derisum et in inproperium et in conculcationem
  choice: objeto de zombaria, insulto e pisoteio
  rationale: Preserva a sequência tríplice de substantivos e comunica em português corrente a humilhação expressa pelo latim.
theological_decisions:
- issue: Natureza da comida imposta
  choice: comida sacrificada aos ídolos
  alternative: carne sacrificada aos ídolos
  rationale: «Comida» evita afirmar que o referente implícito seja necessariamente carne, ao mesmo tempo que preserva a associação explícita com sacrifícios idolátricos.
- issue: Resultado para os que consentem
  choice: serão, para eles, objeto de zombaria, insulto e pisoteio
  alternative: serão ridicularizados, insultados e pisoteados por eles
  rationale: A formulação nominal acompanha mais de perto erint illis e a construção tríplice do texto, sem transformar silenciosamente todos os termos em verbos passivos.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Conservou-se a abertura sintaticamente dependente do versículo anterior e a tríade enfática final.
