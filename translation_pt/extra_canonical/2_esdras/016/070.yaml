  verdict: approve
  source_fidelity: A tradução preserva corretamente a abertura fragmentária e dependente do versículo anterior (quosdam ex uobis), sem suprir um verbo não presente nesta unidade. «Os alimentarão com comida sacrificada aos ídolos» comunica adequadamente cibabunt idolis occisam e evita restringir indevidamente o alimento a carne. A oração final conserva erint illis e a tríade nominal in derisum et in inproperium et in conculcationem.
  naturalness: O português é moderno, claro e de registro apropriado. «Serão, para eles, objeto de zombaria, insulto e pisoteio» é um pouco solene, mas é natural e reproduz bem a ênfase e a estrutura do latim. A nota torna inteligível a abertura sintaticamente incompleta.
  terminology: «Comida sacrificada aos ídolos» é terminologia cultual precisa e amplamente compreensível. «Consentirem com eles» representa de modo não excessivamente interpretativo consenserint eis. Os termos «zombaria», «insulto» e «pisoteio» mantêm a sequência de humilhações do texto-fonte.
