  yaml_path: translation/extra_canonical/2_esdras/016/075.yaml
  text: 'Hear, my chosen ones, says the Lord: behold, days of tribulation are here, and from them I will deliver you. Do not fear or hesitate,'
translation:
  language: pt
  text: 'Ouçam, meus escolhidos, diz o Senhor: eis que chegaram os dias de tribulação, e deles eu os livrarei. Não tenham medo nem hesitem,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite
  choice: Ouçam
  rationale: Imperativo plural direto e natural em português moderno.
- source_word: electi mei
  choice: meus escolhidos
  rationale: Preserva a designação substantivada e a relação expressa pelo possessivo.
- source_word: ecce
  choice: eis que
  rationale: Mantém o valor apresentativo e solene da expressão latina.
- source_word: adsunt
  choice: chegaram
  rationale: Expressa que os dias já estão presentes, sem reduzi-los a algo apenas próximo.
- source_word: dies tribulationis
  choice: os dias de tribulação
  rationale: Correspondência formal clara, preservando a linguagem apocalíptica.
- source_word: de his liberabo uos
  choice: deles eu os livrarei
  rationale: Mantém a referência aos dias de tribulação e explicita naturalmente o objeto plural em português.
- source_word: Ne timeatis nec haesitemini
  choice: Não tenham medo nem hesitem
  rationale: Formulação corrente que conserva os dois imperativos negativos e sua distinção.
theological_decisions:
- issue: Alcance do livramento prometido
  choice: deles eu os livrarei
  alternative: eu os livrarei dessas tribulações
  rationale: A tradução mantém o antecedente gramatical de his, os dias de tribulação, sem definir de que modo ou em que momento ocorrerá o livramento.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A vírgula final foi preservada porque o versículo termina com uma oração que continua no contexto subsequente.
