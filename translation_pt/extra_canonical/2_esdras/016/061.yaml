  yaml_path: translation/extra_canonical/2_esdras/016/061.yaml
  text: He placed pools upon the mountain tops[a], to send forth rivers from the heights so that the earth might drink.
translation:
  language: pt
  text: Pôs também lagos nos cumes das montanhas, para fazer correr rios do alto, a fim de que a terra bebesse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lacus
  choice: lagos
  rationale: O termo latino designa lagos ou reservatórios de água; “lagos” é natural em português e preserva a imagem de águas situadas nos cumes das montanhas.
- source_word: super uertices montium
  choice: nos cumes das montanhas
  rationale: Reproduz com clareza a localização expressa pelo latim, sem tornar a frase excessivamente literal.
- source_word: ad emittendum flumina ab eminenti
  choice: para fazer correr rios do alto
  rationale: Expressa a finalidade e o movimento descendente dos rios a partir das elevações; “do alto” conserva o sentido de “ab eminenti” em linguagem corrente.
- source_word: ut potaret terra
  choice: a fim de que a terra bebesse
  rationale: Mantém “a terra” como sujeito do verbo e preserva a personificação poética explícita no latim.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com preservação da imagem poética da terra que bebe. O “também” traduz o valor continuativo de “et” e ajuda a refletir que a frase prossegue uma enumeração anterior. A oração seguinte e incompleta (“Qui finxit hominem...”) não foi incluída, pois pertence ao versículo subsequente.
