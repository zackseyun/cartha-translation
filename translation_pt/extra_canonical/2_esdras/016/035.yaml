review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva corretamente as distinções centrais: sponsi («noivos») em contraste com uiri («maridos»), e a morte na guerra em contraste com a fome. Contudo, «Sem terem quem as ajude» fica sintaticamente ligado aos sujeitos subsequentes («seus noivos ... seus maridos»), podendo comunicar que são os homens que não têm auxílio. No latim, non habentes adiutorium se refere às mulheres indicadas por earum. Além disso, «aniquilados» intensifica exterentur além do necessário; «perecerão de fome» traduz naturalmente a destruição causada pela fome.'
  naturalness: «Elas ficarão sem ajuda» explicita de modo claro e moderno o referente feminino sem criar uma oração participial solta. «Perecerão de fome» é idiomático, solene sem ser arcaico, e mantém o paralelismo do versículo.
  terminology: «Noivos» e «maridos» mantêm adequadamente o contraste lexical latino. «Consumidos na guerra» conserva a imagem de consumentur. «Perecerão de fome» é mais proporcional ao sentido de exterentur do que «serão aniquilados».
  issues:
  - severity: medium
    issue: Referente ambíguo e ligação sintática inadequada na abertura
    rationale: Em «Sem terem quem as ajude, seus noivos...», o infinitivo flexionado pode ser entendido como tendo «noivos» e «maridos» por sujeito, embora o latim apresente as mulheres como as que estão sem auxílio.
  - severity: low
    issue: «Serão aniquilados» é excessivamente enfático para exterentur
    rationale: O verbo latino expressa perecimento/destruição pela fome, mas «aniquilados» pode sugerir extinção total ou violência mais explícita do que o texto requer.
  revised_text: Elas ficarão sem ajuda; seus noivos serão consumidos na guerra, e seus maridos perecerão de fome.
