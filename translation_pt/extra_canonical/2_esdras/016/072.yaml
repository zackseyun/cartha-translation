  yaml_path: translation/extra_canonical/2_esdras/016/072.yaml
  text: They will be like madmen[a], sparing no one, plundering and ravaging those who still fear the Lord.
translation:
  language: pt
  text: Eles serão como loucos[a], sem poupar ninguém, saqueando e devastando os que ainda temem o Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eles serão como loucos, sem poupar ninguém, ainda saqueando e devastando os que temem o Senhor.”'
    reason: Registra a possível ligação alternativa de “ainda”, preservada na tradução anterior.
lexical_decisions:
- source_word: quasi insani
  choice: como loucos
  rationale: Reproduz de modo natural e direto a comparação latina, sem transformar a imagem em diagnóstico clínico.
- source_word: neminem parcentes
  choice: sem poupar ninguém
  rationale: Expressa com clareza a ideia absoluta de não mostrar misericórdia a pessoa alguma.
- source_word: ad diripiendum et deuastandum
  choice: saqueando e devastando
  rationale: Mantém os dois atos coordenados do latim em português corrente e vigoroso.
- source_word: adhuc timentes dominum
  choice: os que ainda temem o Senhor
  rationale: Pela posição e pela construção, adhuc modifica timentes, destacando os que continuam a temer o Senhor.
theological_decisions:
- issue: Ligação sintática de adhuc
  choice: “ainda” modifica “temem o Senhor”
  alternative: “ainda” modifica “saqueando e devastando”
  rationale: No texto latino, adhuc aparece imediatamente antes de timentes dominum, favorecendo a leitura de perseverança no temor do Senhor; a variante anterior é registrada em nota por ser possível na história da tradução.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O pronome “Eles” preserva a continuidade contextual; “Senhor” segue o uso bíblico consagrado.
