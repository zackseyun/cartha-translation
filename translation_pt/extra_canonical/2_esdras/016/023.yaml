base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/023.yaml
  text: And they will lose their lives upon the earth[a], and the sword will scatter those who survive the famine.
translation:
  language: pt
  text: E perderão a vida sobre a terra[a], e a espada dispersará os que tiverem sobrevivido à fome.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra versão textual diz: “Pois muitos dos que habitam a terra morrerão de fome, e a espada destruirá os que sobreviverem à fome.”'
    reason: Registra a leitura latina alternativa anteriormente traduzida, sem substituí-la pelo texto-fonte fornecido.
lexical_decisions:
- source_word: aporiant vitam
  choice: perderão a vida
  rationale: O verbo latino tardio «aporiant» sugere ficar privado de algo ou perdê-lo; com «vitam», a expressão natural em português é «perderão a vida».
- source_word: super terram
  choice: sobre a terra
  rationale: Reproduz de perto a expressão espacial do texto latino sem acrescentar a ideia de habitantes, que pertence a outra variante.
- source_word: gladius dispersit
  choice: a espada dispersará
  rationale: «Espada» representa metonimicamente a violência bélica. Embora «dispersit» tenha forma de perfeito, o contexto profético futuro e a consulta inglesa auditada favorecem «dispersará», preservando o sentido próprio de dispersão.
- source_word: quae superaverint a fame
  choice: os que tiverem sobrevivido à fome
  rationale: O relativo neutro latino é vertido idiomaticamente como referência a pessoas; o futuro perfeito é preservado por «tiverem sobrevivido».
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do latim onde isso permanece natural. A formulação evita importar a leitura variante para o corpo do versículo.
