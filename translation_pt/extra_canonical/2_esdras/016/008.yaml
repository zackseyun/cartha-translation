  text: A strong archer has shot an arrow; who will turn it back? The Lord God sends evils, and who will drive them away?
translation:
  language: pt
  text: Um arqueiro forte disparou uma flecha; quem poderá fazê-la voltar? O Senhor Deus envia calamidades; quem poderá afastá-las?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagittam a sagittario forti missam
  choice: uma flecha [...] disparou um arqueiro forte
  rationale: Reformula naturalmente em português a construção latina, preservando a imagem da flecha lançada por um arqueiro forte.
- source_word: Dominus Deus
  choice: o Senhor Deus
  rationale: Equivalente tradicional, claro e direto do título divino latino.
- source_word: mala (preservado na tradição textual refletida pela camada de consulta)
  choice: calamidades
  rationale: No contexto, refere-se a males enviados como desastres ou juízos, não à maldade moral praticada por Deus; “calamidades” conserva esse sentido sem criar ambiguidade ética desnecessária.
theological_decisions:
- issue: Deus como aquele que envia “males”
  choice: envia calamidades
  alternative: envia males
  rationale: A escolha mantém a afirmação teológica de que os desastres estão sob a ação soberana de Deus, sem sugerir que Deus produza maldade moral.
- issue: Força retórica das perguntas
  choice: quem poderá fazê-la voltar? / quem poderá afastá-las?
  alternative: quem a fará voltar? / quem as expulsará?
  rationale: “Poderá” explicita o sentido de impossibilidade humana pressuposto pelas perguntas retóricas, sem identificar quem age nem resolver além do texto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. As duas perguntas paralelas foram preservadas, assim como a imagem concreta do arqueiro e a tensão da ação divina irresistível.
