  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/041.yaml
  text: 'Hear the word, my people: prepare yourselves for battle, and in the midst of evils be like strangers on the earth.'
translation:
  language: pt
  text: Escutem a palavra, meu povo; preparem-se para a batalha e, em meio aos males, sejam como estrangeiros na terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite
  choice: Escutem
  rationale: Preserva o imperativo plural latino e comunica atenção obediente de modo natural.
- source_word: plebs mea
  choice: meu povo
  rationale: Expressa diretamente o vocativo coletivo, sem a conotação depreciativa que “plebe” pode ter no português atual.
- source_word: parate uos in pugnam
  choice: preparem-se para a batalha
  rationale: Reproduz o imperativo reflexivo plural e o sentido concreto de preparação para combate.
- source_word: in malis
  choice: em meio aos males
  rationale: Mantém a amplitude de mala, que pode abranger males, aflições e calamidades, sem restringir o sentido.
- source_word: sicut advenae terrae
  choice: como estrangeiros na terra
  rationale: Segue a continuação atestada pela tradição textual refletida na camada inglesa e verte advenae de modo claro, preservando a ideia de não pertencimento.
theological_decisions:
- issue: Sentido de “estrangeiros na terra”
  choice: Manter a imagem sem explicação interpretativa
  alternative: Explicitar como desapego dos bens terrenos ou identidade espiritual celestial
  rationale: O texto apresenta uma comparação aberta; explicá-la no corpo do versículo imporia uma leitura teológica específica.
translation_notes:
  register: Português contemporâneo, digno e acessível, com imperativos plurais coerentes com o latim. A formulação conserva a imagem e a amplitude semântica do texto, evitando linguagem denominacional.
