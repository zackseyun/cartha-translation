  text: Assim como num olival restarão três ou quatro azeitonas,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quemadmodum
  choice: assim como
  rationale: Introduz naturalmente em português a comparação expressa pelo latim.
- source_word: in oliveto
  choice: num olival
  rationale: Traduz o local de modo preciso e corrente, sem acrescentar a ideia ausente de «em cada árvore».
- source_word: relinquentur
  choice: ficam
  rationale: Expressa com naturalidade o sentido passivo-resultativo de serem deixadas ou restarem após a devastação.
- source_word: tres vel quattuor olivae
  choice: três ou quatro azeitonas
  rationale: Mantém o número e a alternativa do texto latino; «azeitonas» é o termo português normal para o fruto.
theological_decisions:
- issue: Intensidade da imagem de escassez
  choice: Não acrescentar «em cada árvore».
  alternative: «em cada árvore ficam três ou quatro azeitonas»
  rationale: O latim diz apenas «in oliveto», isto é, «num olival». A expansão reduziria a força da imagem apocalíptica e introduziria informação sem apoio textual.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa. A vírgula final foi preservada porque o fragmento fornecido funciona como oração comparativa que prossegue no contexto.
