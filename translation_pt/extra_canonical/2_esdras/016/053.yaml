  text: a justiça reinará sobre nós.[a] Que o pecador não diga que não pecou,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uma redação anterior, baseada numa divisão diferente dos versículos, trazia: «Pois eis que, dentro de muito pouco tempo, a injustiça será tirada da terra, e a justiça reinará sobre nós.»'
    reason: Registra a redação anterior mencionada na camada inglesa e esclarece que ela decorre de uma diferença de delimitação textual.
lexical_decisions:
- source_word: iusticia
  choice: justiça
  rationale: Correspondência direta e natural ao substantivo latino, preservando seu sentido moral amplo.
- source_word: regnabit
  choice: reinará
  rationale: Mantém a metáfora régia e o valor futuro do latim.
- source_word: in nos
  choice: sobre nós
  rationale: Neste contexto, expressa naturalmente o domínio da justiça; evita o pouco idiomático «em nós».
- source_word: Non dicat
  choice: Que ... não diga
  rationale: Reproduz com naturalidade a proibição ou exortação expressa pelo subjuntivo latino.
- source_word: peccator
  choice: pecador
  rationale: Equivalente lexical direto, corrente no registro bíblico moderno.
- source_word: non se peccasse
  choice: que não pecou
  rationale: Transmite em português corrente a declaração indireta reflexiva, cujo sujeito é o próprio pecador.
theological_decisions:
- issue: Alcance da imagem de a justiça reinar «in nos»
  choice: reinará sobre nós
  alternative: reinará em nós
  rationale: «Sobre nós» preserva a ideia de governo exercido pela justiça sem restringir a frase a uma transformação interior.
- issue: Afirmação do pecador acerca do próprio pecado
  choice: que não pecou
  alternative: que não tenha pecado
  rationale: O indicativo é mais direto e natural após «diga», mantendo o conteúdo da alegação sem acrescentar nuance teológica.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência bíblica. A pontuação final mantém a vírgula porque o trecho fornecido continua no versículo seguinte ou na unidade textual subsequente.
