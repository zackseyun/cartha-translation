lexical_decisions:
- source_word: In his
  choice: em meio a essas coisas
  rationale: Mantém a referência ampla e pouco especificada do latim, sem transformar a expressão em uma interpretação mais definida como “nessas calamidades”.
- source_word: quid facient
  choice: o que farão
  rationale: Equivalência direta e natural da pergunta em português.
- source_word: mala / malorum
  choice: males
  rationale: Conserva o plural substantivado e evita restringi-lo a um tipo específico de calamidade.
