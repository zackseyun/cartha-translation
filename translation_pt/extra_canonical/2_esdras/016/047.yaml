  text: laborant; Fructus enim illorum alienigenae metent et substantiam illorum rapient et domus euertent et filios eorum captiuabunt, quia in captiuitate et fame generant natos suos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/047.yaml
  text: for foreigners will reap their fruits and plunder their goods and overturn their houses and take their children captive[a], because in captivity and famine they beget their children.
translation:
  language: pt
  text: pois estrangeiros colherão os frutos deles, saquearão os seus bens, derrubarão suas casas[a] e levarão seus filhos para o cativeiro, porque é no cativeiro e na fome que eles geram seus filhos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “destruirão suas casas”.'
    reason: O latim euertent pode indicar tanto derrubar concretamente quanto destruir ou arruinar.
lexical_decisions:
- source_word: alienigenae
  choice: estrangeiros
  rationale: Expressa de modo direto e natural pessoas de outro povo ou terra, sem acrescentar uma conotação étnica ausente do termo.
- source_word: substantiam
  choice: bens
  rationale: Neste contexto de saque, o termo indica posses ou patrimônio, não 'substância' em sentido abstrato.
- source_word: domus euertent
  choice: derrubarão suas casas
  rationale: O verbo latino aplicado a edifícios comunica arruinar ou pôr abaixo; 'derrubarão' conserva a imagem concreta e soa natural em português.
- source_word: filios eorum captiuabunt
  choice: levarão seus filhos para o cativeiro
  rationale: Reproduz o sentido de capturar e reduzir ao cativeiro, com formulação corrente e dignificada.
- source_word: generant natos suos
  choice: geram seus filhos
  rationale: Mantém a formulação enfática do latim, embora 'natos' e 'filios' pertençam ao mesmo campo semântico.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene. A oração começa com “pois” porque enim liga esta afirmação ao contexto anterior. O laborant inicial foi entendido como o encerramento da unidade precedente, de acordo com a segmentação refletida no texto de consulta.
