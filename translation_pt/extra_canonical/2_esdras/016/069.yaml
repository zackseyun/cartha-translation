  yaml_path: translation/extra_canonical/2_esdras/016/069.yaml
  text: For behold[a], a burning wrath is kindled against you, a great multitude[b], and they will seize some of you and feed them with meat sacrificed to idols.
translation:
  language: pt
  text: Pois eis que uma ira se inflama contra vocês, e uma grande multidão agarrará alguns de vocês e lhes dará carne sacrificada aos ídolos para comer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase também pode significar que alguns são capturados e mortos em ligação com o culto aos ídolos, ou que, depois de mortos, são entregues como alimento. O latim é áspero e bastante condensado.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: “e, depois de matá-los, os darão como alimento aos ídolos”.'
    reason: previous_rendering
lexical_decisions:
- source_word: Ecce enim
  choice: Pois eis que
  rationale: Mantém tanto a ligação explicativa de enim quanto a fórmula enfática ecce, em português bíblico atual e compreensível.
- source_word: incenditur ardor super uos
  choice: se acende contra vocês a fúria
  rationale: Reproduz a imagem de algo que se incendeia e expressa o sentido hostil de super vos; “fúria” comunica aqui melhor que o literal e pouco natural “calor”.
- source_word: turba copiosa
  choice: uma grande multidão
  rationale: Equivalente natural para a expressão latina que descreve uma massa numerosa de perseguidores.
- source_word: rapient
  choice: agarrarão
  rationale: Preserva a ideia de captura violenta do verbo rapere sem restringi-la necessariamente a um sequestro formal.
- source_word: cibabunt idolis occisos (consultation-layer reconstruction reflected in the audited English)
  choice: lhes darão de comer carne sacrificada aos ídolos
  rationale: Segue a leitura contextual em que o objeto alimentar implícito é carne de animal abatido em sacrifício idolátrico, evitando afirmar sem nota que os próprios fiéis seriam mortos e oferecidos como alimento.
theological_decisions:
- issue: Identidade do que foi morto e relação com os ídolos na frase final comprimida
  choice: Os capturados são forçados a comer carne sacrificada aos ídolos.
  alternative: Os capturados são mortos e entregues como alimento aos ídolos.
  rationale: A leitura principal corresponde ao contexto de coerção idolátrica e à revisão textual auditada, mas a construção latina é áspera e admite outra análise; por isso, a alternativa permanece explicitamente registrada nas notas.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com boa legibilidade brasileira. A pontuação em duas frases esclarece os agentes sem eliminar a tensão do latim. Os dois marcadores foram ancorados na expressão final a que suas notas efetivamente dizem respeito.
