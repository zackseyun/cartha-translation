base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/009.yaml
  text: Evils[a], and who will repel them? Fire will come forth from his wrath, and who is there to quench it?
translation:
  language: pt
  text: Males[a] — e quem os repelirá? Da sua ira sairá fogo — e quem o apagará?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “Desgraças”.
    reason: O latim mala pode designar males em geral ou calamidades e desgraças concretas.
lexical_decisions:
- source_word: mala
  choice: Males
  rationale: O neutro plural latino pode abranger males, calamidades ou desgraças. “Males” preserva essa amplitude e concorda naturalmente com o pronome plural seguinte.
- source_word: repellet
  choice: repelirá
  rationale: Mantém o sentido futuro de afastar ou rechaçar os males, sem especificar por quais meios isso ocorreria.
- source_word: exiet
  choice: sairá
  rationale: Traduz diretamente o futuro de exire e, em português, não cria a ambiguidade inglesa de “go out” com o sentido de apagar-se.
- source_word: iracundia
  choice: ira
  rationale: “Ira” é a forma corrente e digna para a cólera divina expressa pelo termo latino.
theological_decisions:
- issue: Origem do fogo na ira divina
  choice: “Da sua ira sairá fogo”
  alternative: “O fogo da sua ira irromperá”
  rationale: A redação escolhida conserva a relação expressa por ex iracundia eius sem transformar a ira e o fogo numa única realidade nem acrescentar a ideia mais intensa de irrupção.
- issue: Amplitude de mala
  choice: “Males”
  alternative: “Desgraças”
  rationale: “Males” preserva a possível referência tanto a calamidades concretas quanto ao mal em sentido mais amplo, evitando resolver uma ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e solene, com ordem sintática natural. Os travessões preservam a força retórica das duas perguntas paralelas sem introduzir explicações ausentes do texto.
