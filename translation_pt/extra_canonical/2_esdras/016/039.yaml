  text: quemadmodum praegnans in nono mense filium suum inadpropinquante hora partus eius, ante horas duas vel tres gementes dolores circum ventrem eius, et prodiente infante de ventre non tardabit uno puncto,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/039.yaml
  text: As when a pregnant woman in the ninth month[a], when the hour of her delivery draws near, two or three hours beforehand labor pains surround her womb, and when the child comes forth from the womb, it does not delay a single moment,
translation:
  language: pt
  text: Assim como uma mulher grávida de um filho, no nono mês, quando se aproxima a hora do parto, duas ou três horas antes as dores do parto envolvem-lhe o ventre e, quando a criança sai do ventre, não demora nem um só instante,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnans in nono mense filium suum
  choice: uma mulher grávida de seu filho, no nono mês
  rationale: Explicita em português o substantivo feminino subentendido em praegnans e preserva filium suum, elemento presente no latim.
- source_word: ante horas duas vel tres
  choice: duas ou três horas antes
  rationale: Ante indica anterioridade, não duração; a expressão situa o começo das dores antes do nascimento.
- source_word: gementes dolores
  choice: as dores do parto
  rationale: No contexto imediato, são as dores que acompanham o trabalho de parto; esta formulação é natural e precisa em português.
- source_word: circum ventrem eius
  choice: cercam seu ventre
  rationale: Conserva a imagem espacial do latim circum, em vez de reduzi-la apenas à localização das dores.
- source_word: non tardabit uno puncto
  choice: não demora nem um só instante
  rationale: Expressa idiomaticamente a ideia de não haver sequer o menor intervalo de demora.
