  text: 'ecce verbum Domini, excipite eum, ne discredatis de quibus dicit Dominus:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/037.yaml
  text: 'Behold, the word of the Lord: receive it; do not disbelieve what the Lord says.'
translation:
  language: pt
  text: 'Eis a palavra do Senhor: recebam-na e não deixem de crer no que o Senhor diz.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Eis
  rationale: Mantém a fórmula enfática de apresentação do latim em linguagem bíblica digna e reconhecível.
- source_word: verbum Domini
  choice: a palavra do Senhor
  rationale: Correspondência direta e natural, preservando a expressão teológica sem explicá-la além do texto.
- source_word: excipite eum
  choice: recebam-na
  rationale: O verbo latino pode significar acolher ou receber; o pronome é vertido de acordo com o gênero de “palavra” em português e com o referente indicado pelo contexto.
- source_word: ne discredatis
  choice: não deixem de crer
  rationale: Expressa de modo corrente a proibição de descrer, evitando o pouco natural “não desacreditem” neste contexto.
- source_word: de quibus dicit Dominus
  choice: no que o Senhor diz
  rationale: Reproduz naturalmente o sentido da construção latina, sem o peso artificial de “nas coisas das quais o Senhor fala”.
theological_decisions:
- issue: Possível personificação de “verbum” pelo pronome masculino “eum”
  choice: 'Tratar o pronome como referência à palavra do Senhor: “recebam-na”'
  alternative: “recebam-no”, entendendo uma referência pessoal ou uma personificação explícita
  rationale: Embora “eum” seja masculino e “verbum” seja neutro no latim clássico, o contexto imediato apresenta a palavra como objeto a ser recebido. A irregularidade de concordância não basta para impor uma leitura cristológica ou pessoal ausente da formulação explícita.
translation_notes:
  register: Português moderno, claro e solene, com imperativos no plural (“recebam”, “não deixem”), apropriados à exortação dirigida a uma coletividade. A formulação evita literalismo sintático sem eliminar a ênfase do original.
