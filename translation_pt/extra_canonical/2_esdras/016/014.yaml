  text: to the ends of the earth. Behold, evils are sent out, and they will not return until
translation:
  language: pt
  text: até os confins da terra. Eis que males são enviados e não voltarão até que
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in fines terrae
  choice: até os confins da terra
  rationale: Expressa naturalmente o alcance até as extremidades da terra e preserva a continuidade com o contexto anterior.
- source_word: Ecce
  choice: Eis que
  rationale: Mantém a partícula enfática e o registro solene do latim.
- source_word: mala
  choice: males
  rationale: Preserva o plural substantivado e sua amplitude sem especificar calamidades particulares.
- source_word: mittuntur
  choice: são enviados
  rationale: Reproduz a voz passiva sem identificar quem os envia.
- source_word: non reuertentur
  choice: não voltarão
  rationale: Equivalência direta que conserva a personificação dos males.
- source_word: donec
  choice: até que
  rationale: Mantém deliberadamente a oração incompleta, pois o fragmento fornecido termina nessa conjunção.
theological_decisions:
- issue: Agente do envio dos males
  choice: 'Manter a voz passiva: “são enviados”'
  alternative: Explicitar Deus como agente
  rationale: O texto latino não nomeia o agente; explicitá-lo resolveria indevidamente uma ambiguidade teológica.
- issue: Conclusão da oração introduzida por donec
  choice: Encerrar em “até que”
  alternative: Completar a oração com conteúdo conjectural
  rationale: A fonte apresentada termina em “donec”; qualquer complemento seria acréscimo sem apoio textual.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. O início em minúscula e o final suspenso preservam o caráter fragmentário e a continuidade do trecho fornecido.
