  choice: devastarão
  rationale: Mantém diretamente a ideia de arruinar ou destruir, em paralelo com o verbo seguinte.
- source_word: diripient
  choice: saquearão
  rationale: Expressa a tomada violenta de bens e pode reger naturalmente tanto “bens” como “casas” neste contexto.
- source_word: substantias
  choice: os bens
  rationale: No latim tardio, refere-se aqui às posses ou propriedades materiais, não à “substância” em sentido abstrato.
- source_word: domos
  choice: as casas
  rationale: Tradução direta do objeto coordenado; não se acrescenta a ideia de expulsar os moradores, ausente do texto latino.
