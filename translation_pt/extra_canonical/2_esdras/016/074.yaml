  text: suas eos eicient. Tunc parebit probatio electorum meorum, ut aurum quod probatur ab igne.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/074.yaml
  text: Then the testing of my chosen ones will appear[a][b], like gold that is tested by fire.
translation:
  language: pt
  text: Então se manifestará a provação dos meus escolhidos[a][b], como o ouro que é provado pelo fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então se manifestará o caráter provado dos meus escolhidos, como o ouro que é provado pelo fogo”.'
    reason: previous_rendering
  - marker: b
    text: O latim probatio pode indicar tanto o processo de pôr à prova quanto a autenticidade comprovada que resulta desse processo.
    reason: lexical_alternative
lexical_decisions:
- source_word: probatio
  choice: provação
  rationale: Preserva o sentido principal de processo de pôr à prova e, ao mesmo tempo, permite a nuance de comprovação resultante, mantendo a ligação lexical e temática com probatur.
- source_word: parebit
  choice: se manifestará
  rationale: Expressa que a provação — ou o resultado comprovado dela — ficará evidente, sem sugerir apenas aparecimento físico.
- source_word: electorum meorum
  choice: dos meus escolhidos
  rationale: Tradução direta e natural do genitivo latino, sem acrescentar uma definição teológica de quem são os escolhidos.
- source_word: aurum quod probatur ab igne
  choice: o ouro que é provado pelo fogo
  rationale: Mantém a comparação e a construção passiva do latim, bem como a correspondência entre probatio e probatur.
theological_decisions:
- issue: A natureza de probatio
  choice: provação
  alternative: caráter provado; autenticidade comprovada
  rationale: O contexto e a comparação com o ouro favorecem o processo de prova, mas o substantivo latino também pode indicar a genuinidade demonstrada por esse processo; a ambiguidade é preservada nas notas.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Provação” mantém o tom bíblico sem ser arcaico. O fragmento inicial “suas eos eicient” é uma continuação incompleta da frase anterior no recorte latino e, de acordo com a delimitação do versículo na camada auditada, não foi incorporado a 16:74.
