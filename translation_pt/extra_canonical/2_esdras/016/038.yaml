source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dominus: Ecce adpropinquant mala et non tardantur. Quemadmodum praegnans in nono mense filium suum, adpropinquante hora partus eius, ante horas duas uel tres gementes dolores circum uentrem eius, et prodiente infante de uentre non tardabit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/038.yaml
  text: Behold, evils are drawing near and are not delayed, just as a pregnant woman in the ninth month with her child, when the hour of her delivery draws near, for two or three hours great pains surround her womb, and when the child comes forth from the womb, it will not delay.
translation:
  language: pt
  text: 'O Senhor diz: «Eis que os males se aproximam e não tardam. Assim como uma mulher grávida de seu filho, no nono mês, quando se aproxima a hora do parto, sente, durante duas ou três horas, dores intensas ao redor do ventre e, quando a criança sai do ventre, o parto não tardará.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominus
  choice: O Senhor diz
  rationale: O latim preservado traz “dominus” antes da declaração; a formulação com “diz” torna natural em português sua função introdutória, implícita na pontuação da edição.
- source_word: mala
  choice: os males
  rationale: Mantém o plural amplo e ameaçador do latim sem restringi-lo a calamidades de uma espécie específica.
- source_word: adpropinquant ... non tardantur
  choice: se aproximam e não tardarão
  rationale: Reproduz a iminência e a ausência de demora em português corrente; o futuro na segunda oração comunica que sua chegada não será adiada.
- source_word: gementes dolores circum uentrem eius
  choice: sente dores que lhe apertam o ventre
  rationale: Expressa de modo natural as dores intensas ao redor do ventre; “apertam” conserva a imagem de dores circundantes sem a construção pouco idiomática “dores gemedoras”.
- source_word: prodiente infante de uentre non tardabit
  choice: quando a criança começa a sair do ventre, o nascimento não tardará
  rationale: Explicita “o nascimento” como referente natural do singular “não tardará”, evitando em português a impressão de que a criança, e não o parto, seja o sujeito da demora.
theological_decisions:
- issue: Referente de “non tardabit” na comparação final
  choice: o nascimento não tardará
  alternative: a criança não tardará
  rationale: O contexto é a hora do parto e a saída da criança. A escolha conserva a imagem escatológica de um acontecimento iminente sem atribuir artificialmente à criança a ação de tardar.
translation_notes:
  register: Português moderno, digno e acessível, com cadência profética. A comparação obstétrica foi mantida integralmente, e a sintaxe latina foi suavizada apenas onde necessário para clareza natural.
