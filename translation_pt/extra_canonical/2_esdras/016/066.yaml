revisions:
- from: E vocês ficarão envergonhados quando os seus pecados vierem à luz diante de todos, e as suas injustiças se levantarão como acusadoras naquele dia.
  to: E vocês ficarão envergonhados quando os seus pecados vierem à luz diante das pessoas, e as suas iniquidades se apresentarão como acusadoras naquele dia.
  rationale: A revisão elimina uma ampliação indevida, torna mais exata a imagem de comparecimento das iniquidades como acusadoras e preserva o tom solene e a ambiguidade escatológica de “naquele dia”. Não é necessária nota, pois a redação revista comunica o sentido sem dificuldade estrutural.
  reviewer_model: gpt-5.6-terra
