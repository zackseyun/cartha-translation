  text: confusi eritis, cum processerint peccata uestra coram hominibus, et iniquitates erint quae accusatores stabunt in die illo. Quid
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/066.yaml
  text: And you will be put to shame when your sins come forth before men[a], and your iniquities will stand as accusers on that day.
translation:
  language: pt
  text: E vocês ficarão envergonhados quando os seus pecados vierem à luz diante das pessoas, e as suas iniquidades se apresentarão como acusadoras naquele dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confusi eritis
  choice: vocês ficarão envergonhados
  rationale: Expressa naturalmente o estado futuro de vergonha ou humilhação indicado pelo latim, sem reduzir o sentido a mera confusão mental.
- source_word: processerint
  choice: vierem à luz
  rationale: No contexto da exposição pública dos pecados, comunica que eles se manifestarão ou serão revelados, mantendo o tom solene.
- source_word: coram hominibus
  choice: diante de todos
  rationale: Representa de modo idiomático a exposição perante as pessoas em geral; a alternativa mais formal e literal é registrada em nota.
- source_word: iniquitates
  choice: injustiças
  rationale: Preserva a dimensão moral de atos contrários à justiça, em linguagem corrente e digna.
- source_word: accusatores stabunt
  choice: se levantarão como acusadoras
  rationale: Conserva tanto a imagem de comparecer ou permanecer de pé quanto a personificação das próprias injustiças como acusadoras.
- source_word: in die illo
  choice: naquele dia
  rationale: Mantém a fórmula escatológica do texto sem explicitar além do que a fonte afirma.
theological_decisions:
- issue: Personificação das injustiças no juízo
  choice: as suas injustiças se levantarão como acusadoras
  alternative: as suas injustiças os acusarão
  rationale: A formulação escolhida preserva a imagem peculiar da fonte, na qual as próprias injustiças comparecem de pé na função de acusadoras, sem identificar outro agente acusador.
- issue: Referência escatológica de “naquele dia”
  choice: naquele dia
  alternative: no dia do juízo
  rationale: Evita resolver por explicitação uma referência que o latim deixa formulada apenas de modo alusivo.
translation_notes:
  register: Português moderno, claro e solene, com tratamento plural por “vocês” para ampla legibilidade brasileira. A tradução mantém a vívida personificação jurídica e evita linguagem excessivamente arcaica.
