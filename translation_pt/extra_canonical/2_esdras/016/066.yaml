review_pass:
  verdict: revise
  source_fidelity: A tradução capta a vergonha futura, a exposição pública dos pecados e a personificação forense das iniquidades. Contudo, “diante de todos” amplia *coram hominibus* (“diante das pessoas/dos homens”), e “se levantarão” tende a sugerir o ato de erguer-se, enquanto *stabunt* descreve a posição ou comparecimento das iniquidades como acusadoras.
  naturalness: A redação é clara e tem registro adequadamente solene. “Vierem à luz” é uma boa equivalência idiomática para *processerint*. “Se apresentarão como acusadoras” é natural em português moderno e conserva melhor a imagem jurídica de comparecer perante o juízo.
  terminology: “Iniquidades” preserva melhor o valor moral-religioso de *iniquitates* e a ligação com a linguagem judicial do versículo do que “injustiças”, que em português atual pode remeter mais facilmente a injustiças sociais ou sofridas.
  issues:
  - severity: medium
    issue: Ampliação de coram hominibus
    rationale: “Diante de todos” introduz a ideia de totalidade que o latim não exprime. “Diante das pessoas” mantém a exposição perante seres humanos sem acrescentar esse alcance.
  - severity: medium
    issue: Sentido de stabunt
    rationale: “Se levantarão” privilegia o início do movimento de levantar-se. No contexto jurídico-personificado, *stabunt* indica que as iniquidades comparecerão/estarão postas como acusadoras; “se apresentarão como acusadoras” transmite essa função de modo natural.
  - severity: low
    issue: Escolha para iniquitates
    rationale: “Injustiças” é possível, mas “iniquidades” é mais preciso para faltas morais pessoais que figuram como acusadoras e preserva o registro solene da passagem.
  revised_text: E vocês ficarão envergonhados quando os seus pecados vierem à luz diante das pessoas, e as suas iniquidades se apresentarão como acusadoras naquele dia.
  revised_footnotes: []
  revision_rationale: A revisão elimina uma ampliação indevida, torna mais exata a imagem de comparecimento das iniquidades como acusadoras e preserva o tom solene e a ambiguidade escatológica de “naquele dia”. Não é necessária nota, pois a redação revista comunica o sentido sem dificuldade estrutural.
