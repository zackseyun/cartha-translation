lexical_decisions:
- source_word: qui nubunt
  choice: os que se casam
  rationale: Traduz naturalmente a oração relativa latina e preserva a estrutura paralela da série.
- source_word: sic quasi
  choice: como se
  rationale: Expressa a comparação contrafactual de modo corrente em português, sem inserir um imperativo ausente neste versículo.
- source_word: filios non facturi
  choice: não fossem ter filhos
  rationale: Reproduz a perífrase futura latina em linguagem natural; aqui filios facere significa gerar ou ter filhos.
- source_word: qui non nubunt
  choice: os que não se casam
  rationale: Mantém o paralelismo antitético com a primeira oração.
- source_word: vidui
  choice: viúvos
  rationale: Equivalente direto do plural masculino latino, preservando a imagem concisa do texto.
theological_decisions:
- issue: Força exortativa herdada do contexto anterior
  choice: Manter a construção elíptica, sem acrescentar «sejam»
  alternative: «os que se casam, sejam como se...»
  rationale: O imperativo que governa a sequência vem do contexto anterior; não está expresso neste versículo. A elipse preserva o ritmo da enumeração e permite que o contexto forneça a força exortativa.
translation_notes:
  register: Português moderno, claro e digno, com formulação concisa. A pontuação e o paralelismo refletem a estrutura latina; «como se não fossem ter filhos» é idiomático e conserva o valor de quasi com a perspectiva futura de facturi.
