  rationale: Expressão portuguesa natural que preserva o futuro e o sentido de produzir fruto.
- source_word: vindicemietilla (vindemiet illa)
  choice: o colherá
  rationale: Vindemiare designa propriamente colher uvas ou fazer a vindima, mas o antecedente amplo “árvores” favorece o verbo geral “colher”; o pronome “o” retoma coletivamente “fruto”.
