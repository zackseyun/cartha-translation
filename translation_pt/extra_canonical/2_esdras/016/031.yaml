  text: or as in a harvested vineyard an exposed cluster remains from those who carefully search the vintage,[a]
translation:
  language: pt
  text: ou como, numa vinha já vindimada, resta um cacho exposto, deixado por aqueles que examinam cuidadosamente a colheita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “resta um cacho visível, apesar daqueles que vasculham cuidadosamente a colheita”.'
    reason: A relação indicada por ab pode ser entendida como agência — o cacho foi deixado pelos que fizeram a busca — ou como separação/escape — ele permaneceu apesar da busca deles.
lexical_decisions:
- source_word: vinea vindemiata
  choice: vinha já vindimada
  rationale: Reproduz de modo conciso o sentido da vinha cuja vindima já foi realizada, sem reduzir a expressão a uma simples indicação temporal.
- source_word: subremanet
  choice: resta
  rationale: Expressa a ideia de algo que permanece para trás depois da colheita.
- source_word: racemus patens
  choice: um cacho exposto
  rationale: Mantém o singular de racemus e traduz patens como visível, descoberto ou exposto.
- source_word: scrutantibus vindemiam diligenter
  choice: aqueles que examinam cuidadosamente a colheita
  rationale: Distingue vindemiam, a colheita ou vindima, de vinea, a vinha, e conserva a ideia de busca minuciosa.
