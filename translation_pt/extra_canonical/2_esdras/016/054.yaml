id: 2ES.16.54
reference: 2 Esdras 16:54
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam carbones ignis conburet super caput eius qui dicit: non peccaui coram deo et gloria ipsius. Ecce dominus cognoscit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/054.yaml
  text: For coals of fire will burn upon the head of the one who says[a], “I have not sinned before God and his glory.” Behold, the Lord knows.
translation:
  language: pt
  text: 'Pois ele queimará brasas de fogo sobre a cabeça daquele que diz: “Não pequei diante de Deus e de sua glória.” Eis que o Senhor sabe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conburet
  choice: ele queimará
  rationale: O verbo latino está na terceira pessoa do singular, futuro do indicativo ativo e em uso transitivo; o sujeito implícito é preservado pelo pronome, sem identificar além do que o texto explicita.
- source_word: carbones ignis
  choice: brasas de fogo
  rationale: Reproduz de forma natural a expressão latina, mantendo 'brasas' como objeto direto de 'queimará'.
- source_word: coram deo
  choice: diante de Deus
  rationale: Equivalente português corrente e formal para coram, com o sentido de estar perante Deus.
- source_word: gloria ipsius
  choice: sua glória
  rationale: Mantém a referência pronominal do latim e sua concisão, sem explicitar indevidamente o referente.
- source_word: Ecce
  choice: Eis que
  rationale: Preserva a partícula apresentativa e enfática em registro bíblico ainda compreensível.
- source_word: cognoscit
  choice: sabe
  rationale: Neste contexto, cognoscere indica conhecimento; 'sabe' é mais natural em português do que 'conhece' sem objeto expresso.
theological_decisions:
- issue: Sujeito implícito de conburet
  choice: “ele queimará”, mantendo o sujeito apenas implícito no contexto
  alternative: “o Senhor queimará” ou tratar “brasas” como sujeito de “queimarão”
  rationale: A forma singular ativa exige um sujeito implícito e toma 'brasas de fogo' como objeto. Identificá-lo expressamente como o Senhor seria plausível, mas acrescentaria algo que a oração latina não declara.
- issue: Relação entre Deus e sua glória
  choice: preservar “diante de Deus e de sua glória”
  alternative: simplificar para “diante da glória de Deus”
  rationale: A coordenação latina entre Deus e sua glória é teologicamente incomum, mas genuína; a tradução não a resolve nem a funde.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve cadência bíblica em “Eis que”. A construção conserva a sintaxe difícil da fonte onde ela carrega sentido, mas corrige a leitura gramatical que fazia das brasas o sujeito do verbo.
