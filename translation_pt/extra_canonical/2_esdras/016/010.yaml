lexical_decisions:
- source_word: est qui extinguat eum?
  choice: Haverá quem o apague?
  rationale: Preserva a pergunta retórica e traduz extinguat de modo direto, mantendo a imagem de apagar ou extinguir sem explicá-la.
- source_word: Coruscabit
  choice: Ele relampejará
  rationale: O verbo latino indica emitir clarões ou relâmpagos; “relampejará” conserva a imagem e a força verbal do original.
- source_word: timebit
  choice: terá medo
  rationale: Equivalente natural e claro para o futuro latino, sem intensificar o sentido para “estremecer” ou suavizá-lo para mero respeito.
theological_decisions:
- issue: Referente do pronome eum e do sujeito implícito de coruscabit
  choice: Manter o masculino singular em “o” e “ele”
  alternative: Explicitar o referente pelo contexto, como “o fogo” ou uma figura divina
  rationale: O versículo isolado não nomeia o referente; explicitá-lo resolveria uma referência que o texto latino deixa dependente do contexto.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura retórica próxima do latim. “Relampejará” é expressivo e inteligível, embora menos frequente na fala cotidiana.
