  yaml_path: translation/extra_canonical/2_esdras/016/055.yaml
  text: all the works of men and their devices and their thoughts and their hearts. He who said[a], “Let the earth be made,” and it was made;
translation:
  language: pt
  text: 'todas as obras dos seres humanos, suas invenções, seus pensamentos e seus corações. Aquele que disse[a]: “Faça-se a terra”, e ela foi feita;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Eis que o Senhor conhece todas as obras dos seres humanos, suas invenções, seus pensamentos e seus corações.”'
    reason: Preserva, em português, a nota de variante/divisão textual registrada na trilha de auditoria inglesa.
lexical_decisions:
- source_word: opera hominis
  choice: obras dos seres humanos
  rationale: Reproduz o sentido coletivo de atividades e feitos humanos sem restringir a referência ao sexo masculino.
- source_word: adinventiones illorum
  choice: seus projetos
  rationale: O latim indica invenções, planos ou maquinações; “projetos” preserva a amplitude sem pressupor intenção maligna.
- source_word: cogitatum illorum
  choice: seus pensamentos
  rationale: Expressa naturalmente o conteúdo mental indicado pelo latim, apesar da forma textual incomum cogitatum.
- source_word: corda illorum
  choice: seus corações
  rationale: Mantém a metáfora antropológica tradicional e sua amplitude bíblica.
- source_word: fiat terra
  choice: Faça-se a terra
  rationale: Preserva a forma volitiva/passiva do latim e o tom solene da ordem criadora.
theological_decisions:
- issue: Sujeito de “Qui dixit”
  choice: Aquele que disse
  alternative: Ele, que disse
  rationale: Mantém o relativo latino e não acrescenta neste recorte o nome “Senhor”, que aparece no versículo anterior segundo a divisão fornecida.
- issue: Limite textual do versículo
  choice: Iniciar com “todas as obras...” e incluir a criação da terra
  alternative: Iniciar com “Eis que o Senhor conhece...”
  rationale: Segue exatamente o trecho latino atribuído a 16:55; a expressão “Ecce dominus cognoscit” pertence ao recorte anterior.
translation_notes:
  register: Português atual, digno e de leitura ampla, com construção solene em “Faça-se a terra”. O fragmento começa sintaticamente ligado ao versículo anterior, conforme o limite textual fornecido; o ponto após “corações” acompanha a segmentação da fonte.
