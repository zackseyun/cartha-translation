base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/034.yaml
  text: Virgins will mourn, having no bridegrooms; women will mourn, having no husbands; their daughters will mourn, having no help.
translation:
  language: pt
  text: As virgens lamentarão por não terem noivos; as mulheres lamentarão por não terem maridos; e suas filhas lamentarão sem auxílio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugebunt
  choice: lamentarão
  rationale: Expressa de modo natural e digno o luto ou pesar intenso indicado pelo verbo latino.
- source_word: virgines
  choice: virgens
  rationale: Mantém a designação explícita do texto latino, sem substituí-la por uma categoria interpretativa.
- source_word: sponsos
  choice: noivos
  rationale: Preserva a distinção lexical entre sponsos e viros presente no paralelismo do versículo.
- source_word: adiutorium
  choice: quem as ajude
  rationale: Neste contexto pessoal e familiar, traduz naturalmente a ideia de auxílio sem especificar indevidamente quem prestaria essa ajuda.
theological_decisions:
- issue: Identidade do auxílio ausente às filhas
  choice: quem as ajude
  alternative: amparo
  rationale: O latim não identifica a pessoa ou a forma do auxílio; a tradução mantém essa abertura, sem atribuí-lo especificamente a marido, pai ou outro protetor.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. A repetição de “lamentarão” reproduz a força retórica do original; a conjunção “e” antes do terceiro membro favorece a fluidez em português.
