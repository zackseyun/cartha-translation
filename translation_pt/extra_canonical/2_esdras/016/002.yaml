  text: Mourn for them[a], because your destruction has drawn near.
translation:
  language: pt
  text: Lamentem por eles, pois a destruição de vocês se aproximou.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dolete eos
  choice: Lamentem por eles
  rationale: O imperativo plural latino pede uma exortação coletiva. “Lamentem por eles” expressa de modo natural o pesar dirigido a respeito de “eles”, sem acrescentar conteúdo ausente no texto.
- source_word: contritio uestra
  choice: a destruição de vocês
  rationale: Neste registro profético e apocalíptico, contritio denota ruína ou destruição. “Destruição” preserva a solenidade e evita o literalismo pouco natural de “esmagamento”.
- source_word: adpropinquauit
  choice: se aproximou
  rationale: O perfeito latino apresenta a calamidade como já chegada perto; “se aproximou” conserva esse aspecto e a urgência profética.
