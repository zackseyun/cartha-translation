  text: the breath of God Almighty[a], who made all things and searches out hidden things in hidden places. Surely he knows your devising.
translation:
  language: pt
  text: o sopro de Deus Todo-Poderoso, que fez todas as coisas e perscruta coisas ocultas em lugares ocultos. Certamente ele conhece o plano de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiramentum
  choice: sopro
  rationale: Expressa de modo natural o sentido de sopro ou respiração, preservando a imagem concreta do latim.
- source_word: scrutatur
  choice: perscruta
  rationale: Preserva a ideia de examinar ou investigar profundamente, em registro digno e corrente.
- source_word: absconsa in absconsis
  choice: o que está oculto em lugares ocultos
  rationale: Mantém a repetição enfática e a ambiguidade do original quanto ao segundo termo.
- source_word: adinuentionem uestram
  choice: o plano de vocês
  rationale: O substantivo está no singular e, neste contexto, indica uma trama, concepção ou plano; 'plano' é claro sem especificar além do texto.
theological_decisions:
- issue: Relação sintática do início do versículo
  choice: Iniciar diretamente com 'o sopro do Deus Todo-Poderoso'
  alternative: Iniciar com 'e o sopro do Deus Todo-Poderoso'
  rationale: O texto latino fornecido para 16:63 não contém a conjunção inicial; acrescentá-la absorveria material do versículo anterior.
- issue: Extensão do versículo
  choice: Encerrar em 'o plano de vocês'
  alternative: Acrescentar 'e o que vocês pensam no coração'
  rationale: A cláusula adicional pertence ao início de 16:64 segundo os limites do texto latino fornecido.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A repetição de 'oculto' foi preservada por refletir a formulação enfática do latim.
