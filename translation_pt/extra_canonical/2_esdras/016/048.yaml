  yaml_path: translation/extra_canonical/2_esdras/016/048.yaml
  text: And those who conduct business do so for plunder[a], as long as they adorn themselves;
translation:
  language: pt
  text: E os que negociam, negociam para o saque[a], enquanto se enfeitam[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “negociam em meio à rapina”. A expressão latina *in rapina* admite mais de uma relação entre a atividade comercial e o saque.'
    reason: A construção latina é concisa e não especifica plenamente a relação semântica entre negociar e a rapina; a nota preserva essa ambiguidade.
  - marker: b
    text: O latim diz literalmente “enfeitam” ou “adornam”, sem indicar expressamente quem ou o que é enfeitado.
    reason: O objeto de *exornant* está ausente no texto latino; a leitura reflexiva no texto principal é plausível pelo contexto, mas não é gramaticalmente explícita.
lexical_decisions:
- source_word: negociantur
  choice: negociam / fazem negócios
  rationale: O verbo latino indica exercer comércio ou realizar negócios. A leve variação evita uma repetição pouco natural em português sem apagar a repetição enfática do original.
- source_word: in rapina
  choice: para o saque
  rationale: Preserva a formulação concisa e a ambiguidade do latim, que pode indicar negócios destinados a se tornarem despojo ou negócios ligados à rapina, sem acrescentar explicitamente uma construção passiva.
- source_word: quamdiu
  choice: enquanto
  rationale: Expressa naturalmente a simultaneidade ou duração indicada pelo latim, sem forçar a leitura estritamente temporal de “durante todo o tempo em que”.
- source_word: exornant
  choice: se enfeitam
  rationale: Segue a leitura contextual refletida na camada inglesa, embora o verbo latino seja formalmente ativo e não traga objeto expresso; a incerteza é registrada em nota.
