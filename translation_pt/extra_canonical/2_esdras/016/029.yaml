  text: For ten will be left from a city[a], and two from the countryside, who have hidden themselves in the forest and in clefts of the rocks.
translation:
  language: pt
  text: Pois restarão dez de uma cidade e dois do campo, os que se tiverem escondido na floresta e nas fendas das rochas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: relinquentur
  choice: restarão
  rationale: Reproduz o futuro passivo latino com uma construção portuguesa natural, indicando os sobreviventes que ficarão.
- source_word: ex agro
  choice: do campo
  rationale: Mantém o contraste espacial com “da cidade”; ager aqui designa a zona rural ou o campo.
- source_word: in silva
  choice: na floresta
  rationale: Traduz diretamente silva, sem acrescentar a ideia não expressa de vegetação densa.
- source_word: in fissuras petrarum
  choice: nas fendas das rochas
  rationale: Preserva a imagem concreta do latim e o plural de ambos os substantivos.
- source_word: absconderint
  choice: se tiverem escondido
  rationale: Expressa o valor provável de futuro perfeito em relação a “restarão”, preservando a noção de que essas pessoas sobreviverão por terem buscado esconderijo.
