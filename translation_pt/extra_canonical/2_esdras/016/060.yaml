  text: super aquas fundauit eum; Qui posuit in deserto fontes aquarum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/060.yaml
  text: He stretched out heaven like a vaulted chamber, and founded it upon the waters; who placed springs of waters in the desert.
translation:
  language: pt
  text: Ele estendeu o céu como uma abóbada e o fundou sobre as águas; foi ele quem pôs fontes de água no deserto.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fundauit
  choice: fundou
  rationale: Reproduz diretamente o sentido de estabelecer sobre um fundamento, preservando a imagem do texto latino.
- source_word: super aquas
  choice: sobre as águas
  rationale: Mantém a relação espacial expressa por super sem explicá-la além do que diz a fonte.
- source_word: fontes aquarum
  choice: fontes de água
  rationale: Tradução transparente da expressão latina; a repetição de “água” também conserva o estilo da fonte.
- source_word: in deserto
  choice: no deserto
  rationale: Forma corrente e fiel para indicar o lugar onde as fontes foram postas.
theological_decisions:
- issue: Referente do pronome eum
  choice: Preservar o pronome masculino “o” sem identificar seu referente
  alternative: Acrescentar “o céu” com base no texto inglês de consulta
  rationale: O trecho latino fornecido contém eum, mas não nomeia seu referente. Acrescentar “o céu” ou a oração sobre estendê-lo importaria conteúdo ausente da evidência original apresentada.
- issue: Valor de Qui
  choice: “foi ele quem”, retomando enfaticamente o mesmo agente
  alternative: “o qual” ou simplesmente “ele”
  rationale: Qui introduz uma nova caracterização do agente divino. A construção escolhida é natural em português e mantém a continuidade sem criar um antecedente nominal inexistente no excerto.
translation_notes:
  register: Português moderno, claro e digno, com leve paralelismo poético. A tradução segue estritamente o latim fornecido; por isso, não inclui a oração inglesa “Estendeu o céu como uma abóbada”, que não aparece no excerto original apresentado.
