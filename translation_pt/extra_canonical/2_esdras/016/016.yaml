source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: donec consumat fundamenta terrae. Quemadmodum non redit sagitta missa a sagittario ualido, sic non reuertentur mala quae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/016.yaml
  text: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
translation:
  language: pt
  text: Assim como uma flecha disparada por um arqueiro forte não volta, também não voltarão os males enviados sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagitta missa
  choice: uma flecha disparada
  rationale: Expressa de modo natural em português a flecha lançada pelo arqueiro, sem perder a imagem concreta do latim.
- source_word: a sagittario ualido
  choice: por um arqueiro forte
  rationale: Traduz diretamente o agente e o sentido de força ou vigor de “ualido”, em linguagem clara e atual.
- source_word: mala
  choice: os males
  rationale: Mantém a amplitude do termo latino, que pode abranger calamidades, desgraças ou juízos, sem restringi-lo a uma interpretação específica.
- source_word: non reuertentur
  choice: não voltarão
  rationale: Preserva o futuro e o paralelismo verbal com “não volta” na comparação da flecha.
theological_decisions:
- issue: Natureza dos “males” enviados sobre a terra
  choice: os males
  alternative: as calamidades / as pragas
  rationale: A opção mais ampla preserva a ambiguidade de “mala” e evita definir de antemão a natureza exata dos acontecimentos.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima do latim. A frase inicial “donec consumat fundamenta terrae” parece concluir o versículo anterior e, por isso, não foi incorporada ao texto de 16:16. A formulação final segue o conteúdo completo atestado pela camada inglesa auditada, pois o excerto latino fornecido termina de modo incompleto em “quae”.
