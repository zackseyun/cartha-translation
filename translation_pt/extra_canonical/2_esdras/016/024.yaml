  verdict: revise
  source_fidelity: A tradução reproduz com precisão «stercora», o futuro passivo de «proicientur», «derelinquetur deserta» e «demolientur». Contudo, «non habent» é presente do indicativo no latim; «não terão» o transforma em futuro. Além disso, a separação em duas frases torna menos explícita a coordenação repetida por «et».
  naturalness: «E os mortos serão lançados fora como esterco» e «será deixada deserta» são formulações claras, modernas e adequadas. «Não têm quem os console» é natural em português e permite conservar o presente do original, embora esteja inserido num quadro profético.
  terminology: «Esterco», «console», «deserta» e «demolidas» são escolhas corretas, de registro digno e fiéis ao texto. Não há termos teológicos ou nomes próprios que exijam normalização.
  issues:
