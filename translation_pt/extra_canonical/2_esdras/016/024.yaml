  yaml_path: translation/extra_canonical/2_esdras/016/024.yaml
  text: And the dead will be cast out like dung[a], and they will have no one to comfort them, and the earth will be left desolate, and its cities will be demolished.
translation:
  language: pt
  text: E os mortos serão lançados fora como esterco, e não têm quem os console, e a terra será deixada deserta, e suas cidades serão demolidas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: stercora
  choice: esterco
  rationale: Mantém a imagem forte e concreta do latim, em linguagem clara e corrente.
- source_word: proicientur
  choice: serão lançados fora
  rationale: Reproduz o futuro passivo e a ideia de descarte expressa pelo verbo latino.
- source_word: consolentur
  choice: console
  rationale: A construção natural «não terão quem os console» preserva o sentido de alguém que lhes dê consolo.
- source_word: derelinquetur deserta
  choice: será deixada deserta
  rationale: Conserva tanto a ideia de abandono quanto o estado de desolação, sem acrescentar uma relação causal.
- source_word: demolientur
  choice: serão demolidas
  rationale: Equivalente direto do futuro passivo latino, adequado à destruição das cidades.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura coordenada próxima do latim. O presente latino «non habent» foi vertido no futuro («não terão») por coerência com os futuros que dominam a frase e porque descreve a condição dos mortos no cenário anunciado. Não se manteve a nota inglesa herdada, pois sua alternativa introduz uma relação causal («pois») ausente no texto latino.
