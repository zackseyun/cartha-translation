    issue: Tempo verbal de «non habent»
    rationale: O latim traz presente ativo, literalmente «não têm», enquanto o rascunho usa o futuro «não terão». A coexistência de futuro e presente no original deve ser preservada, sem harmonização temporal.
  - severity: low
    issue: Coordenação entre as cláusulas
    rationale: O segundo «et» introduz «a terra será deixada deserta» como continuação coordenada, não como uma nova frase independente. Manter a sequência de «e» reflete melhor a estrutura sem prejudicar a leitura.
