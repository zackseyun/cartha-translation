  text: By his word the stars were established, and he knows the number of the stars.
translation:
  language: pt
  text: Por sua palavra, as estrelas foram estabelecidas, e ele conhece o número delas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uerbo illius … fundatae sunt (início da frase preservado apenas parcialmente no trecho latino fornecido)
  choice: Por sua palavra, as estrelas foram estabelecidas
  rationale: Mantém a imagem da palavra divina como meio pelo qual as estrelas foram firmadas, seguindo a evidência textual refletida na camada inglesa auditada e sem ampliar a afirmação para uma formulação doutrinária mais específica.
- source_word: nouit numerum stellarum
  choice: ele conhece o número delas
  rationale: Traduz diretamente o sentido de conhecimento completo da quantidade das estrelas; o pronome evita uma repetição pesada em português sem alterar o referente.
theological_decisions:
- issue: Agência divina na ordenação das estrelas
  choice: “Por sua palavra” expressa o meio da ação divina sem identificar explicitamente “palavra” com uma pessoa.
  alternative: “Pela Palavra dele”, com maiúscula e possível leitura cristológica.
  rationale: O latim permite o sentido comum de palavra ou ordem; a tradução preserva essa formulação e não introduz uma identificação teológica que o verso não explicita.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. A formulação conserva o paralelismo entre o estabelecimento das estrelas e o conhecimento divino de seu número.
