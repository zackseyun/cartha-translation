  text: Foi enviado fogo sobre vocês; quem poderá apagá-lo?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ignis
  choice: o fogo
  rationale: Reproduz diretamente o substantivo latino e soa natural em português como referência ao fogo de juízo já anunciado.
- source_word: uobis
  choice: sobre vocês
  rationale: Expressa o dativo de direção ou incidência em português corrente e mantém o destinatário plural.
- source_word: extinguat
  choice: apagá-lo
  rationale: É a forma idiomática usual para extinguir fogo, com pronome que retoma claramente «o fogo».
theological_decisions:
- issue: Força retórica da pergunta «quis est qui extinguat illum?»
  choice: quem poderá apagá-lo?
  alternative: quem há que o apague?
  rationale: A formulação com «poderá» comunica naturalmente a impossibilidade implícita na pergunta retórica sem acrescentar uma identificação teológica do agente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. O ponto e vírgula liga o anúncio do juízo à pergunta retórica. O trecho final latino «Inmissa sunt» pertence ao início da frase seguinte e, por isso, não foi incorporado a este versículo.
