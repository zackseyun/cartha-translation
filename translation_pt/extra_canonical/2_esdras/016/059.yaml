lexical_decisions:
- source_word: super aquam
  choice: sobre a água
  rationale: Preserva o singular do latim aquam e a relação espacial expressa por super.
- source_word: uerbo suo
  choice: por sua palavra
  rationale: Expressa naturalmente o meio ou poder pelo qual a ação é realizada, sem acrescentar interpretação.
- source_word: extendit caelum
  choice: estendeu o céu
  rationale: Tradução direta e corrente do latim, mantendo a imagem cosmológica.
- source_word: quasi cameram
  choice: como uma abóbada
  rationale: Neste contexto, camera designa uma estrutura arqueada ou abobadada; “abóbada” comunica a imagem celeste com clareza em português.
theological_decisions:
- issue: Continuidade da construção relativa do hino
  choice: Aquele que
  alternative: Ele
  rationale: Mantém o relativo latino Qui e a continuidade sintática e doxológica com o contexto anterior, sem transformar o trecho em uma oração independente.
- issue: Ação criadora mediante a palavra
  choice: por sua palavra
  alternative: com sua palavra
  rationale: “Por” preserva a possível ideia instrumental ou eficiente do latim, sem explicar além do que o texto afirma.
translation_notes:
  register: Português moderno, digno e acessível, com construção solene adequada ao contexto hínico. O ponto e vírgula final preserva a continuidade da sequência de orações relativas. A primeira ação é completada com base na evidência contextual auditada, pois o recorte latino fornecido começa no meio da oração.
