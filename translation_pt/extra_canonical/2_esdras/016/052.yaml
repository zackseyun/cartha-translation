lexical_decisions:
- source_word: Quoniam
  choice: Pois
  rationale: Introduz a razão ou explicação, preservando a ligação lógica com o contexto anterior.
- source_word: ecce
  choice: eis que
  rationale: Mantém a partícula de chamada de atenção em registro bíblico claro e corrente.
- source_word: adhuc pusillum
  choice: daqui a pouco
  rationale: Expressa naturalmente em português o breve intervalo temporal indicado pelo latim.
- source_word: tolletur
  choice: será removida
  rationale: Preserva a voz passiva e o sentido amplo de tirar ou afastar, sem especificar indevidamente o agente ou o modo.
- source_word: iniquitas
  choice: a iniquidade
  rationale: Equivalente tradicional e semanticamente adequado para a injustiça ou perversidade moral mencionada.
theological_decisions:
- issue: Agente da remoção da iniquidade
  choice: 'Manter a construção passiva: “será removida”'
  alternative: Explicitar Deus como agente
  rationale: O texto latino não nomeia o agente; explicitá-lo eliminaria uma ambiguidade genuína.
translation_notes:
  register: Português moderno, claro e digno, com a fórmula bíblica corrente “eis que”. A conjunção final “e” foi mantida porque o trecho-fonte termina no meio da frase e continua no versículo ou segmento seguinte. A nota inglesa herdada não foi reproduzida, pois pertence à redação anteriormente desalinhada com este versículo.
