  text: 'Quoniam fortis dextera eius quae arcum tendit : sagittae eius acutae quae ab ipso mittuntur, non deficient cum coeperint mitti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/013.yaml
  text: For mighty is his right hand that bends the bow; his arrows that are shot by him are sharp[a], and they will not fail when they begin to be shot.
translation:
  language: pt
  text: Pois forte é a sua mão direita, que retesa o arco; afiadas são as suas flechas, disparadas por ele, e elas não falharão quando começarem a ser disparadas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortis dextera eius
  choice: forte é a sua mão direita
  rationale: Mantém a ênfase e a ordem marcada do latim, em linguagem portuguesa clara e solene.
- source_word: arcum tendit
  choice: retesa o arco
  rationale: No contexto de arquearia, «retesar» expressa com precisão o ato de pôr o arco sob tensão.
- source_word: sagittae eius acutae
  choice: afiadas são as suas flechas
  rationale: Preserva o predicativo «afiadas» e o paralelismo enfático da frase latina.
- source_word: mittuntur / mitti
  choice: disparadas / ser disparadas
  rationale: «Disparar» é natural para flechas e conserva a repetição do mesmo verbo presente no texto-fonte.
- source_word: non deficient
  choice: não falharão
  rationale: Conserva a amplitude de deficere e, no contexto da arquearia, permite o sentido de não errar nem ficar aquém, sem restringi-lo indevidamente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imagética concreta de arquearia. A construção enfática do latim foi preservada sem acrescentar conteúdo ausente da fonte.
