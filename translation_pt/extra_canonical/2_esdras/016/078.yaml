  text: your sins[a], nor let your iniquities prevail over you. Woe to those who are bound fast by their sins and covered over by their iniquities, just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire.
translation:
  language: pt
  text: os seus pecados, nem deixem que as suas iniquidades prevaleçam sobre vocês. Ai dos que estão presos pelos próprios pecados e cobertos pelas próprias iniquidades, assim como um campo é cercado por uma floresta e a sua semente é coberta de espinhos; ninguém passa por ele; ele fica isolado e é entregue para ser devorado pelo fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: supereleuent
  choice: prevaleçam sobre
  rationale: Expressa de modo natural a ideia de as iniquidades se erguerem acima das pessoas e as dominarem.
- source_word: constringuntur
  choice: estão presos
  rationale: Conserva a imagem de pessoas fortemente constrangidas ou atadas pelos próprios pecados, em português corrente.
- source_word: obteguntur
  choice: cobertos
  rationale: Mantém a metáfora espacial do latim e seu paralelismo com o campo coberto de espinhos.
- source_word: silua
  choice: floresta
  rationale: Equivalente direto que preserva a imagem de vegetação densa cercando o campo.
- source_word: semina eius
  choice: sua semente
  rationale: Trata semina como coletivo no contexto agrícola, sem introduzir uma distinção ausente no texto.
- source_word: excluditur
  choice: fica isolado
  rationale: Transmite que o campo é fechado e tornado inacessível, evitando a formulação pouco natural 'é excluído'.
- source_word: ad deuorationem ignis
  choice: para ser devorado pelo fogo
  rationale: Preserva a imagem vigorosa de devoração presente no substantivo latino.
theological_decisions:
- issue: Relação entre pecado e domínio sobre a pessoa
  choice: iniquidades não prevaleçam sobre vocês
  alternative: iniquidades não se elevem acima de vocês
  rationale: A escolha comunica o efeito de domínio sugerido por supereleuent sem acrescentar uma doutrina específica sobre sua mecânica.
- issue: Imagem dos pecadores presos e cobertos
  choice: presos pelos próprios pecados e cobertos pelas próprias iniquidades
  alternative: atados por seus pecados e recobertos por suas iniquidades
  rationale: Mantém as duas imagens paralelas do texto e a responsabilidade pessoal, com linguagem natural e não confessional.
translation_notes:
  register: Português moderno, claro e solene, com formas amplamente compreensíveis e boa legibilidade brasileira. A repetição de “próprios” explicita naturalmente o reflexivo latino suis. “Campo pelo qual” repete o antecedente para evitar ambiguidade entre campo, floresta, semente e espinhos.
