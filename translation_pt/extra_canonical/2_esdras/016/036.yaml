source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite uero ista et cognoscite ea, serui domini. Ecce uerbum domini, excipite eum, ne discredatis de quibus dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/036.yaml
  text: But hear these things and know them, slaves of the Lord. Behold, the word of the Lord; receive it; do not disbelieve the things he speaks.
translation:
  language: pt
  text: Mas ouçam estas coisas e conheçam-nas, escravos do Senhor. Eis a palavra do Senhor; recebam-no. Não deixem de crer nas coisas de que ele fala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite uero
  choice: Mas ouçam
  rationale: O imperativo plural é preservado diretamente; «mas» expressa o valor adversativo de uero no contexto.
- source_word: cognoscite ea
  choice: conheçam-nas
  rationale: Mantém o sentido básico de cognoscere e o objeto pronominal, sem ampliar para «compreendam».
- source_word: serui domini
  choice: escravos do Senhor
  rationale: Traduz literalmente serui, preservando a imagem antiga de pertencimento e sujeição, em vez de atenuá-la como «servos».
- source_word: Ecce uerbum domini
  choice: Eis a palavra do Senhor
  rationale: Formulação digna e corrente que conserva a apresentação enfática de ecce.
- source_word: excipite eum
  choice: recebam-na
  rationale: Excipere aqui indica acolher ou receber; o pronome latino masculino retoma uerbum, mas em português concorda com «palavra», no feminino.
- source_word: ne discredatis
  choice: Não deixem de crer
  rationale: Expressa a proibição de descrer sem recorrer ao pouco natural «não descreiam».
- source_word: de quibus dicit
  choice: nas coisas de que ela fala
  rationale: Conserva a construção relativa e entende o sujeito implícito de dicit como «a palavra do Senhor», sem introduzir um referente masculino inexistente em português.
theological_decisions:
- issue: Referente do sujeito implícito em «dicit»
  choice: «ela», retomando «a palavra do Senhor»
  alternative: «ele», referindo-se ao Senhor
  rationale: O antecedente sintaticamente mais próximo é uerbum; a nota registra que o latim permite outra leitura, evitando resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos plurais de ampla legibilidade brasileira. «Escravos» preserva a força social e metafórica de serui; a ambiguidade final é mantida por nota.
