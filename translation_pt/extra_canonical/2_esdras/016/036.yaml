revisions:
- from: Mas ouçam estas coisas e conheçam-nas, escravos do Senhor. Eis a palavra do Senhor; recebam-na. Não deixem de crer nas coisas de que ela fala.[a]
  to: Mas ouçam estas coisas e conheçam-nas, escravos do Senhor. Eis a palavra do Senhor; recebam-no. Não deixem de crer nas coisas de que ele fala.
  rationale: 'A revisão conserva a redação adequada da primeira metade, mas restaura em português o referente masculino indicado por eum e por dicit. Não é necessária nota: embora a justaposição de «palavra» e «ele» seja sintaticamente densa, o masculino do latim fornece apoio textual suficiente para traduzir o referente como o Senhor.'
  reviewer_model: gpt-5.6-terra
