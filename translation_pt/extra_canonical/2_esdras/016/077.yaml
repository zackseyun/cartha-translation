  yaml_path: translation/extra_canonical/2_esdras/016/077.yaml
  text: For God is your guide. And you who keep my commandments and my ordinances, says the Lord God, do not let your sins weigh you down, nor let your iniquities prevail over you.
translation:
  language: pt
  text: 'Pois Deus é o guia de vocês. E vocês que guardam os meus mandamentos e os meus preceitos, diz o Senhor Deus: não deixem que os seus pecados pesem sobre vocês, nem que as suas iniquidades prevaleçam contra vocês.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho latino fornecido termina em “ne praeponderent uos” (“não deixem que pesem sobre vocês”); a explicitação de “pecados” e a oração sobre as “iniquidades” seguem a continuação preservada na forma textual refletida pela camada inglesa auditada.
    reason: Sinalizar com transparência que o excerto latino apresentado está truncado no fim, embora a versão de consulta preserve a continuação do versículo.
lexical_decisions:
- source_word: dux
  choice: guia
  rationale: Expressa de modo natural a função de quem conduz, sem restringir o termo ao sentido militar de “comandante”.
- source_word: mandata et praecepta
  choice: mandamentos e preceitos
  rationale: Mantém os dois termos coordenados do latim e sua proximidade semântica, usando vocabulário bíblico claro e corrente.
- source_word: ne praeponderent uos
  choice: não deixem que ... pesem sobre vocês
  rationale: Reproduz a imagem de peso do verbo latino e formula a exortação em português natural.
- source_word: iniquitates ... praevaleant (continuação refletida na camada inglesa auditada)
  choice: iniquidades prevaleçam contra vocês
  rationale: Preserva a distinção entre pecados e iniquidades e a ideia de estas obterem domínio ou vantagem sobre os destinatários.
theological_decisions:
- issue: Relação entre guardar os mandamentos e a advertência contra o pecado
  choice: Manter as duas afirmações lado a lado, sem explicar causalidade ou mérito
  alternative: Interpretar a guarda dos mandamentos como causa da proteção divina ou como prova explícita de salvação
  rationale: O texto exorta os que guardam os mandamentos, mas não define aqui a relação teológica exata entre obediência, proteção e pecado.
- issue: Força da exortação final
  choice: “não deixem”
  alternative: “que não pesem”
  rationale: A construção comunica claramente a responsabilidade exortativa dirigida aos ouvintes, sem transformar a frase em promessa divina.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com “vocês” para o plural e sintaxe direta. A repetição de “meus” conserva a ênfase possessiva do discurso divino; “Pois” liga naturalmente a afirmação inicial ao contexto anterior.
