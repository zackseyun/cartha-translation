source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelis eius? Ecce iudex deus, timete eum; desinite a peccatis uestris et obliuiscimini iniquitates uestras iam agere eas sempiterno, et deus educabit uos et liberabit de omni tribulatione.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/068.yaml
  text: Behold[a], God is judge; fear him. Cease from your sins, and forget your iniquities, never to practice them again; and God will lead you out and deliver you from every tribulation.
translation:
  language: pt
  text: Eis que Deus é o juiz; temam-no. Abandonem os seus pecados e esqueçam-se de suas iniquidades, para nunca mais as praticar. E Deus os conduzirá para fora e os livrará de toda tribulação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  choice: Eis que
  rationale: Mantém a função enfática e solene da partícula latina em português natural.
- source_word: iudex deus
  choice: Deus é o juiz
  rationale: Supre a cópula implícita no latim e preserva a ênfase definida em Deus como juiz.
- source_word: desinite a peccatis uestris
  choice: Abandonem os seus pecados
  rationale: Expressa de modo idiomático a ordem de cessar e afastar-se dos pecados.
- source_word: obliuiscimini iniquitates uestras iam agere eas sempiterno
  choice: esqueçam-se de voltar a praticar suas iniquidades para sempre
  rationale: Reproduz a construção incomum de 'esquecer-se de praticar', deixando claro o sentido de nunca mais cometer tais iniquidades e preservando a extensão temporal de 'sempiterno'.
- source_word: educabit uos
  choice: os conduzirá para fora
  rationale: Preserva o sentido de educere, isto é, conduzir para fora, sem acrescentar um lugar não expresso.
- source_word: liberabit de omni tribulatione
  choice: os livrará de toda tribulação
  rationale: Tradução direta e natural que conserva o alcance distributivo de 'omni'.
theological_decisions:
- issue: Relação entre abandonar o pecado e o livramento divino
  choice: Manter as duas exortações seguidas por 'E Deus...', sem inserir uma relação causal explícita
  alternative: Traduzir 'então Deus' ou 'por isso Deus'
  rationale: O latim usa apenas 'et'; explicitar causalidade ou condição resolveria uma relação que o texto deixa implícita.
- issue: Identificação de Deus como juiz
  choice: Deus é o juiz
  alternative: Deus é juiz
  rationale: O substantivo predicativo latino pode admitir ambas as formas; o artigo preserva o tom enfático do contexto sem introduzir uma doutrina adicional.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais no plural dirigidas aos leitores. A expressão inicial 'angelis eius?' foi tratada como remanescente do contexto ou da segmentação anterior, pois não integra a sentença completa deste versículo na camada inglesa auditada e termina com pontuação interrogativa.
