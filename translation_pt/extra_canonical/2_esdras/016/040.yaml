  text: so also the evils will not delay to come forth upon the earth, and the age will groan, and pains will surround it.
translation:
  language: pt
  text: Num só instante.[a] Assim também os males não tardarão a irromper sobre a terra; a era gemerá, e dores a cercarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “num só instante” parece concluir a frase do versículo anterior em algumas divisões do texto.
    reason: Esclarece uma provável questão de delimitação versicular sem omitir palavras presentes na fonte latina fornecida.
lexical_decisions:
- source_word: uno puncto
  choice: Num só instante
  rationale: Expressa a ideia temporal do latim de modo natural e conciso; a pontuação indica que a expressão provavelmente conclui o pensamento anterior.
- source_word: mala
  choice: os males
  rationale: Mantém a amplitude do plural latino, que pode abranger desgraças, calamidades e males em sentido geral.
- source_word: ad prodiendum super terram
  choice: a irromper sobre a terra
  rationale: “Irromper” transmite o movimento de vir à tona ou manifestar-se com força, enquanto “sobre a terra” conserva a imagem e a preposição do latim.
- source_word: saeculum
  choice: esta era
  rationale: Preserva o sentido temporal e apocalíptico de saeculum sem recorrer ao português arcaizante “século” com esse significado.
- source_word: dolores circumtenent illum
  choice: dores a cercarão
  rationale: Reproduz a imagem de dores que envolvem a era por todos os lados, com concordância pronominal natural em português.
theological_decisions:
- issue: Sentido de saeculum
  choice: esta era
  alternative: o mundo
  rationale: O latim permite nuances de era, ordem presente ou mundo. “Esta era” conserva a tensão temporal do contexto apocalíptico e evita resolver o termo diretamente como espaço habitado.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe corrente. Mantém-se a personificação apocalíptica da era que geme e é cercada por dores.
