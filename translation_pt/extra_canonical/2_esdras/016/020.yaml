  text: Behold, famine and plague and tribulation have been sent as scourges for correction.
translation:
  language: pt
  text: Eis a fome, a peste e a tribulação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  choice: Eis
  rationale: Preserva a fórmula enfática e solene do latim de modo natural em português bíblico atual.
- source_word: fames
  choice: fome
  rationale: Equivalente direto e corrente.
- source_word: plaga
  choice: peste
  rationale: Neste elenco de calamidades, designa uma praga ou epidemia; “peste” é conciso e idiomático.
- source_word: tribulatio
  choice: tribulação
  rationale: Mantém o sentido amplo de aflição ou sofrimento coletivo e preserva o registro bíblico sem especificá-lo indevidamente.
theological_decisions:
- issue: Finalidade corretiva das calamidades
  choice: Não explicitar que foram enviadas como flagelos para correção
  alternative: “foram enviadas como flagelos para correção”
  rationale: Essa afirmação consta da camada inglesa consultiva, mas não aparece no texto latino fornecido, que termina em “tribulatio”. Acrescentá-la atribuiria explicitamente a essas calamidades uma origem e finalidade teológicas não presentes na evidência-fonte apresentada.
translation_notes:
  register: Português moderno, claro e digno. A construção nominal breve reproduz a força de “Ecce” sem acrescentar um verbo ou predicado ausente no latim fornecido. O trecho inicial “facient, cum venerint mala?” parece pertencer ao contexto imediatamente anterior e, por isso, não foi incluído no texto de 2 Esdras 16:20.
