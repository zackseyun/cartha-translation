lexical_decisions:
- source_word: scrutinabit
  choice: examinará
  rationale: Expressa a ideia de investigar ou perscrutar cuidadosamente, em linguagem natural e digna.
- source_word: omnia opera eorum
  choice: todas as obras deles
  rationale: Mantém a abrangência de omnia e o sentido moralmente neutro de opera, sem antecipar um juízo sobre as ações.
- source_word: traducet
  choice: exporá
  rationale: Neste contexto, o verbo latino indica tornar alguém publicamente manifesto ou sujeito à vergonha; “exporá” preserva essa força sem acrescentar uma condenação não explicitada.
- source_word: Et vos
  choice: E vocês
  rationale: Reproduz o início incompleto da frase seguinte, preservado no limite editorial do versículo.
theological_decisions:
- issue: Sujeito explícito e conexão conclusiva
  choice: Portanto, o Senhor
  alternative: Ele
  rationale: Embora o trecho latino fornecido comece em scrutinabit e tenha o sujeito implícito, o contexto textual identifica o Senhor; “Portanto” conserva a ligação argumentativa refletida pela tradição editorial consultada.
- issue: Alcance de “todos” em traducet vos omnes
  choice: todos vocês
  alternative: vocês todos
  rationale: Mantém o alcance universal da segunda pessoa plural sem especificar além do texto quem compõe o grupo interpelado.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A expressão final deliberadamente incompleta preserva a divisão do versículo e deve continuar no versículo seguinte.
