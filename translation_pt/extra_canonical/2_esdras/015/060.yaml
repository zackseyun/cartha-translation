  yaml_path: translation/extra_canonical/2_esdras/015/060.yaml
  text: They will strike the idle city and lay waste some portion of your land, and they will destroy part of your glory, returning again from devastated Babylon. And you will be broken down by them like stubble, and they will be to you like fire.
translation:
  language: pt
  text: Atacarão a cidade ociosa e devastarão uma porção da tua terra; destruirão parte da tua glória, ao voltarem outra vez da Babilônia devastada. Serás derrubada por eles como restolho, e eles serão para ti como fogo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: allident
  choice: Atacarão
  rationale: O verbo latino indica golpear ou investir contra; “atacarão” comunica naturalmente a ação hostil sem especificar um modo não expresso.
- source_word: ciuitatem otiosam
  choice: a cidade ociosa
  rationale: Mantém a descrição incomum e potencialmente ambígua de otiosam, que pode sugerir inatividade, indolência ou despreocupação, sem a interpretar como uma qualidade específica não explicitada.
- source_word: exterent
  choice: devastarão
  rationale: No contexto de invasão, exprime arruinar ou consumir a terra, em português corrente e digno.
- source_word: gloriae tuae
  choice: tua glória
  rationale: Preserva a amplitude semântica de gloria, que pode abranger esplendor, honra ou grandeza.
- source_word: rursum reuertentes
  choice: regressando
  rationale: O sentido reiterativo de rursum e reuertentes fica expresso naturalmente pelo verbo “regressar”, evitando a redundância pouco idiomática “voltando novamente”.
- source_word: pro stipula
  choice: como palha seca
  rationale: Stipula designa restolho ou palha; “palha seca” torna clara a imagem de material frágil e combustível que prepara a comparação com o fogo.
