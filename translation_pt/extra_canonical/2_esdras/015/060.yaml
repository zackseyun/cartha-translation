  - severity: low
    issue: A força repetitiva de rursum em rursum reuertentes fica apenas implícita em «regressando».
    rationale: Embora «regressar» indique retorno, «rursum» reforça que retornam outra vez. «Ao voltarem outra vez» explicita essa ênfase sem alterar o sentido.
  revised_text: Atacarão a cidade ociosa e devastarão uma porção da tua terra; destruirão parte da tua glória, ao voltarem outra vez da Babilônia devastada. Serás derrubada por eles como restolho, e eles serão para ti como fogo.
