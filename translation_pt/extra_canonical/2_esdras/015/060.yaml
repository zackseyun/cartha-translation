  source_fidelity: 'O texto transmite corretamente as ações principais: atacar a cidade, devastar parte da terra, destruir parte da glória, voltar da Babilônia subvertida e a comparação final com restolho e fogo. Contudo, «palha seca» acrescenta a qualificação «seca», ausente de stipula, e «regressando» não explicita plenamente a ênfase iterativa de rursum reuertentes.'
  naturalness: O português é claro, moderno e adequado ao registro profético. «Cidade ociosa» preserva de modo apropriado a expressão latina incomum e ambígua. A pequena reformulação proposta mantém fluidez sem reduzir a ênfase do original.
  terminology: «Atacarão», «devastarão», «tua glória» e «fogo» são escolhas adequadas. «Restolho» é equivalente mais preciso de stipula no símile e evita a expansão interpretativa em «palha seca».
  issues:
