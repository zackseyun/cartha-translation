source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia adpropinquavit gladius et extritio illorum, et exsurget gens contra gentem ad pugnam, et romphea in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/015.yaml
  text: For the sword and their destruction have drawn near[a], and nation will rise against nation for battle, and broadswords will be in their hands.
translation:
  language: pt
  text: Pois a espada e a destruição deles se aproximaram[a]; nação se levantará contra nação para a batalha, e espadas largas estarão nas mãos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, menos provavelmente: “A espada deles e o esmagamento estão próximos”.'
    reason: Registra a leitura alternativa tradicional da relação de «illorum» e do sentido mais concreto de «extritio», embora a sintaxe favoreça o texto principal.
lexical_decisions:
- source_word: adpropinquavit
  choice: já se aproximaram
  rationale: Reproduz o aspecto perfeito do verbo latino e concorda naturalmente em português com o sujeito composto “a espada e a destruição”.
- source_word: extritio illorum
  choice: a destruição deles
  rationale: “Illorum” liga-se mais naturalmente a “extritio”; neste contexto apocalíptico, “destruição” expressa melhor o sentido de ruína do que o literal “esmagamento”.
- source_word: exsurget gens contra gentem
  choice: nação se levantará contra nação
  rationale: Mantém de perto a construção e a imagem do latim, em linguagem bíblica clara e atual.
- source_word: romphea
  choice: espadas de lâmina larga
  rationale: Comunica o tipo de espada longa ou larga indicado pelo empréstimo latino, evitando um termo técnico pouco conhecido.
- source_word: in manibus eorum
  choice: nas mãos deles
  rationale: Preserva a cláusula locativa explícita e o referente masculino plural do latim.
theological_decisions:
- issue: Relação do pronome “illorum” com a espada e a destruição
  choice: 'O pronome qualifica diretamente “destruição”: “a destruição deles”.'
  alternative: “A espada deles e o esmagamento.”
  rationale: A posição e a construção latina favorecem a ligação de “illorum” a “extritio”; assim, a espada é o instrumento de juízo que se aproxima, não necessariamente uma arma pertencente a eles. A alternativa é registrada em nota por representar uma leitura anterior possível, embora menos provável.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência bíblica. A pontuação separa as duas cenas proféticas com clareza; “espadas de lâmina larga” evita tanto um arcaísmo obscuro quanto uma generalização excessiva.
