  verdict: revise
  source_fidelity: 'A tradução acompanha de perto a sequência e as imagens do latim: a saída da floresta, a vinda com grande força, a disposição para a batalha, a devastação de parte da terra assíria e a imagem dos dentes. «Tomarão posição para lutar» é uma representação natural e adequada de constabunt in pugnam. Contudo, «próprios» introduz uma ênfase que não está explicitamente em suis, que simplesmente identifica os dentes como pertencentes aos carmônios.'
