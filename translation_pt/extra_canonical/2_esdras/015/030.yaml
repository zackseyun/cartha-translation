source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Carmonii insanientes in ira exient de silva et advenient in virtute magna et constabunt in pugnam cum illis et vastabunt portionem terrae Assyriorum in dentibus suis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/030.yaml
  text: The Carmonians[a], raging in wrath, will come out from the forest, and they will come with great force and stand for battle against them, and they will lay waste the portion of the land of the Assyrians with their teeth.
translation:
  language: pt
  text: Os carmônios[a], enfurecidos, sairão da floresta, avançarão com grande força e tomarão posição para lutar contra eles. Com seus dentes, devastarão uma parte da terra dos assírios.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, possivelmente, «carmânios», povo da Carmânia.
    reason: A forma latina transmitida é «Carmonii», mas pode representar uma variante gráfica de «Carmanii»; a nota preserva a leitura do texto e informa a possível identificação histórica.
lexical_decisions:
- source_word: Carmonii
  choice: carmônios
  rationale: Translitera de modo natural a forma etnônima do texto latino, sem substituir silenciosamente a grafia transmitida por uma identificação histórica conjectural com os carmânios da Carmânia.
- source_word: insanientes in ira
  choice: enfurecidos
  rationale: Expressa em português corrente a ideia de estar tomado por ira intensa; evita a formulação pouco natural «enlouquecidos na ira».
- source_word: constabunt in pugnam
  choice: tomarão posição para lutar
  rationale: Comunica o sentido militar de se postar ou formar para o combate, com linguagem clara e digna.
- source_word: portionem terrae Assyriorum
  choice: uma parte da terra dos assírios
  rationale: Mantém o valor partitivo de «portionem» sem sugerir necessariamente uma divisão territorial formal.
- source_word: in dentibus suis
  choice: com os próprios dentes
  rationale: Preserva a imagem concreta e incomum do latim, sem interpretá-la como mera metáfora de violência.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A repetição latina de formas de «vir» foi suavizada por «sairão» e «avançarão», sem perda da progressão narrativa; a imagem estranha dos dentes foi mantida literalmente.
