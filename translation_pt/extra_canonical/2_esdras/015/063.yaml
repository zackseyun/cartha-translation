lexical_decisions:
- source_word: praeda habebunt
  choice: terão despojos
  rationale: Reproduz a ideia de obter ou possuir o que foi tomado, sem acrescentar um objeto ausente no latim.
- source_word: gloriam faciei tuae
  choice: a glória do seu rosto
  rationale: Mantém a expressão concreta e solene do latim, inclusive sua possível referência à honra, ao esplendor ou à aparência.
- source_word: exterminabunt
  choice: destruirão
  rationale: No latim do texto, o verbo comunica eliminação ou ruína; «destruirão» é claro e natural em português sem restringir indevidamente o sentido.
theological_decisions:
- issue: Sentido metafórico de «a glória do seu rosto»
  choice: Preservar literalmente a expressão
  alternative: Explicitar como «a sua honra» ou «o esplendor do seu rosto»
  rationale: O contexto fornecido não permite decidir com segurança entre honra, esplendor e aparência; a tradução conserva a ambiguidade do original.
translation_notes:
  register: Português moderno, digno e de leitura natural. Emprega «seu» por ampla legibilidade brasileira; o referente é singular, como indica «tuae».
