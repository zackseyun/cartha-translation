  yaml_path: translation/extra_canonical/2_esdras/015/061.yaml
  text: They will be fire to you. And they will devour you and your cities, your land and your mountains; all your forests and your fruitful trees they will burn with fire.
translation:
  language: pt
  text: Eles serão fogo contra você. Devorarão você e suas cidades, sua terra e seus montes; queimarão no fogo todas as suas florestas e suas árvores frutíferas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erunt tibi ignis
  choice: Eles serão fogo contra você
  rationale: Preserva a metáfora direta do latim e expressa o dativo tibi de modo natural no contexto de hostilidade.
- source_word: deuorabunt
  choice: Devorarão
  rationale: Mantém a imagem forte e concreta do verbo latino, sem atenuá-la para “destruirão”.
- source_word: ciuitates tuas
  choice: suas cidades
  rationale: Equivalência direta e corrente em português.
- source_word: terram
  choice: sua terra
  rationale: O possessivo é exigido pela sequência e pelo sentido testemunhado no texto completo consultado; “terra” preserva a amplitude do referente.
- source_word: montes
  choice: montes
  rationale: Termo natural e formalmente próximo, adequado ao paralelismo geográfico.
- source_word: silvas
  choice: florestas
  rationale: “Florestas” comunica com clareza o sentido coletivo de silvae no português atual.
- source_word: ligna fructifera
  choice: árvores frutíferas
  rationale: Evita o literalismo inadequado “madeiras frutíferas” e transmite o referente botânico.
- source_word: igni cremabunt
  choice: queimarão no fogo
  rationale: Conserva a menção enfática ao fogo presente no latim e o futuro verbal.
