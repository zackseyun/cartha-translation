source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Babylonem et exterent eam. Conuenient ad ipsam et circuibunt eam et effundent sidus et omnem iram super eam, et subibit puluis et fumus usque ad caelum, et omnes in circuitu lugebunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/044.yaml
  text: Babylon[a], and they will destroy her. They will gather against her and surround her and pour out a storm and all wrath upon her, and dust and smoke will rise up to heaven, and all around her will mourn.
translation:
  language: pt
  text: Babilônia, e eles a destruirão. Eles se reunirão contra ela, a cercarão e derramarão sobre ela uma tempestade[a] e toda a ira. A poeira e a fumaça subirão até o céu, e todos ao redor dela lamentarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, literalmente, «um astro». O termo latino também pode evocar um fenômeno tempestuoso neste contexto.
    reason: Preserva a ambiguidade de sidus, cujo sentido comum é «astro», mas que no contexto pode designar uma tempestade.
lexical_decisions:
- source_word: Conuenient ad ipsam
  choice: Eles se reunirão contra ela
  rationale: O verbo latino indica que virão ou se ajuntarão junto dela; o contexto hostil favorece «contra ela».
- source_word: sidus
  choice: uma tempestade
  rationale: Embora o sentido mais comum seja «astro», neste contexto de ira derramada e destruição o termo é mais naturalmente entendido como um fenômeno tempestuoso; a ambiguidade lexical é preservada em nota.
- source_word: subibit puluis et fumus usque ad caelum
  choice: A poeira e a fumaça subirão até o céu
  rationale: Reproduz de modo natural em português a imagem e o limite espacial do latim.
- source_word: omnes in circuitu lugebunt
  choice: todos ao redor dela lamentarão
  rationale: Mantém o objeto do lamento implícito, como no texto latino, sem acrescentar «por ela».
