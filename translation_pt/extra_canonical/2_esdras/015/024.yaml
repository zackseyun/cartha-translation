  text: Woe to those who sin and do not keep my commandments, says the Lord.
translation:
  language: pt
  text: Ai daqueles que pecam e não guardam os meus mandamentos, diz o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vae
  choice: Ai
  rationale: Mantém a fórmula profética de lamento e condenação do latim em linguagem bíblica natural e reconhecível.
- source_word: observant
  choice: guardam
  rationale: No contexto de mandamentos, “guardar” expressa observar e cumprir, preservando o sentido do verbo latino.
- source_word: mandata mea
  choice: os meus mandamentos
  rationale: Correspondência direta e natural, conservando a primeira pessoa do discurso divino.
theological_decisions:
- issue: Relação entre pecar e não guardar os mandamentos
  choice: Manter as duas ações coordenadas por “e”
  alternative: Interpretar a segunda ação como explicação da primeira (“pecam ao não cumprir...”)
  rationale: O latim usa coordenação simples e não explicita se a segunda oração define, exemplifica ou acrescenta algo à primeira; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com a fórmula profética tradicional “Ai daqueles” e sem arcaísmos desnecessários.
