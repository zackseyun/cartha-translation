  verdict: approve
  source_fidelity: A tradução transmite com precisão a declaração futura de não poupar (non parcam illis), os dois imperativos plurais (discedite; nolite contaminare) e a designação filii apostatae. “Não terei piedade deles” comunica adequadamente a recusa de clemência, e “Afastem-se” conserva a ordem de retirada sem acrescentar destino. “A minha santificação” mantém deliberadamente a formulação abstrata e potencialmente concreta de sanctificationem meam, sem a estreitar para “santuário”.
  naturalness: O português é atual, claro e de registro solene apropriado. A expressão “a minha santificação” é incomum em português corrente, mas essa estranheza é justificável e necessária para não resolver interpretativamente a ambiguidade do latino; a nota fornece orientação suficiente ao leitor.
  terminology: “Filhos apóstatas” é fiel e compreensível. “Profanar” é uma boa escolha contextual para contaminare quando o objeto é apresentado como pertencente à esfera santa de Deus. A nota distingue corretamente a tradução textual da alternativa concreta “meu santuário”, sem apresentar essa alternativa como obrigatória.
