source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non parcam illis, discedite, filii apostatae, nolite contaminare sanctificationem meam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/025.yaml
  text: I will not spare them. Depart[a], you apostate children; do not defile my sanctification.
translation:
  language: pt
  text: Não terei piedade deles. Afastem-se, filhos apóstatas; não profanem a minha santificação.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim sanctificationem meam significa literalmente “minha santificação” e também pode indicar “aquilo que me é santo”. Neste contexto de profanação, alguns entendem a expressão concretamente como “meu santuário”, mas ela pode abranger de modo mais amplo o que pertence à santidade de Deus.
    reason: lexical_alternative
lexical_decisions:
- source_word: non parcam illis
  choice: Não terei piedade deles
  rationale: Expressa de modo natural a decisão divina de não poupar nem mostrar clemência, preservando a força da construção latina.
- source_word: discedite
  choice: Afastem-se
  rationale: Imperativo plural que comunica a ordem de partir ou retirar-se sem especificar um destino ausente no latim.
- source_word: filii apostatae
  choice: filhos apóstatas
  rationale: Mantém a forma de tratamento e o sentido de filhos que abandonaram ou se rebelaram contra a fidelidade devida.
- source_word: contaminare
  choice: profanem
  rationale: No contexto de algo pertencente à santidade divina, “profanar” comunica melhor a contaminação religiosa do que o sentido meramente físico de “contaminar”.
- source_word: sanctificationem meam
  choice: a minha santificação
  rationale: Segue de perto a expressão latina e preserva sua amplitude e estranheza, sem reduzi-la interpretativamente a “santuário”.
theological_decisions:
- issue: Referente de sanctificationem meam
  choice: a minha santificação
  alternative: o meu santuário / aquilo que me é santo
  rationale: O latim pode designar concretamente algo santo, inclusive um santuário, mas não o explicita. A tradução mantém a formulação abstrata e deixa a alternativa contextual em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos no plural de uso brasileiro. A formulação incomum “minha santificação” foi preservada deliberadamente por fidelidade à ambiguidade lexical do latim.
