  text: Pois, por causa do orgulho deles, as cidades serão perturbadas, as casas serão destruídas e as pessoas terão medo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superbiam
  choice: orgulho
  rationale: Expressa de modo natural e direto a arrogância ou soberba causadora do juízo; “orgulho” é amplamente compreensível no português moderno.
- source_word: civitates turbabuntur
  choice: as cidades serão lançadas em confusão
  rationale: Preserva a voz passiva e o sentido de perturbação ou desordem urbana sem restringir o termo a agitação emocional.
- source_word: domus exterentur
  choice: as casas serão destruídas
  rationale: Verte o sentido de arrasamento ou destruição de forma clara e digna.
- source_word: homines metuent
  choice: as pessoas ficarão com medo
  rationale: Traduz o plural humano genérico de maneira inclusiva e natural, preservando o futuro e o sentido simples de temor.
