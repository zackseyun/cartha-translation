revisions:
- from: 'Já não ficarei calado diante das impiedades que eles cometem, nem continuarei tolerando as injustiças que praticam. Vejam: o sangue inocente e justo clama a mim, e as almas dos justos clamam sem cessar.'
  to: Já não me calarei sobre as impiedades que eles praticam impiamente, nem tolerarei o que fazem injustamente. Eis que o sangue inocente e justo clama a mim, e as almas dos justos clamam incessantemente.
  rationale: A revisão restitui a dupla caracterização latina das ações — elas são “impiedades” e são praticadas “impiamente” — e conserva *inique* como qualificação do modo de agir. Também substitui o imperativo interpretativo “Vejam” pela partícula profética “Eis que”.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:21:54Z'
review_pass:
  verdict: revise
  source_fidelity: A redação omite a qualificação explícita de *inreligiose* em *quae inreligiose agunt*. Embora “impiedades” expresse parte do campo semântico, o latim intensifica deliberadamente a acusação ao descrever também o modo como as praticam. Além disso, “as injustiças que praticam” transforma *in his quae inique exercent* (“o que fazem/praticam injustamente”) em um substantivo que não está expresso no original.
  naturalness: A formulação revista preserva o paralelismo e o tom profético em português moderno. “Eis que” é uma introdução enfática corrente em registros bíblicos e evita dirigir um imperativo plural (“Vejam”) a um público que o latim não explicita.
  terminology: “Impiedades” mantém a dimensão moral-religiosa de *impietates*. “Impiamente” restitui a força de *inreligiose* sem introduzir uma interpretação denominacional. “Incessantemente” reproduz adequadamente a persistência de *perseveranter*.
  issues:
  - severity: medium
    issue: Omissão de “inreligiose”
    rationale: “que eles cometem” não traduz a qualificação adverbial em *quae inreligiose agunt*. A repetição conceitual do latim deve ser mantida, ainda que resulte em ênfase deliberada.
  - severity: low
    issue: Substantivação de “in his quae inique exercent”
    rationale: “As injustiças que praticam” é compreensível, mas desloca o foco do original, que fala das coisas/atos que eles realizam injustamente. “O que fazem injustamente” é mais próximo.
  - severity: low
    issue: “Vejam” explicita um destinatário plural
    rationale: '*Ecce* funciona como partícula demonstrativa/enfática, não necessariamente como imperativo dirigido a ouvintes. “Eis que” conserva melhor essa função.'
  revised_text: Já não me calarei sobre as impiedades que eles praticam impiamente, nem tolerarei o que fazem injustamente. Eis que o sangue inocente e justo clama a mim, e as almas dos justos clamam incessantemente.
  revised_footnotes: []
