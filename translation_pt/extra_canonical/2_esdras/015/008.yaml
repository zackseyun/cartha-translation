id: 2ES.15.8
reference: 2 Esdras 15:8
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam non silebo impietates eorum quae inreligiose agunt, nec sustinebo in his quae inique exercent. ecce sanguis innoxius et iustus clamat ad me, et animae iustorum clamant perseveranter.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/008.yaml
  text: I will no longer keep silent about their impieties[a], which they commit irreligiously, nor will I endure the things they carry out unjustly. Behold, innocent and righteous blood cries out to me, and the souls of the righteous cry out continually.
translation:
  language: pt
  text: Já não me calarei sobre as impiedades que eles praticam impiamente, nem tolerarei o que fazem injustamente. Eis que o sangue inocente e justo clama a mim, e as almas dos justos clamam incessantemente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impietates
  choice: impiedades
  rationale: Mantém o sentido moral e religioso do termo latino, sem o reduzir a simples falta de prática religiosa.
- source_word: quae inreligiose agunt
  choice: que eles cometem
  rationale: Em português, “cometer impiedades” já comunica de modo natural a força de inreligiose; repetir “impiamente” seria pesado e redundante.
- source_word: nec sustinebo
  choice: nem continuarei tolerando
  rationale: Expressa a cessação da tolerância divina indicada pelo futuro latino no contexto de “já não”.
- source_word: in his quae inique exercent
  choice: as injustiças que praticam
  rationale: Formulação corrente que preserva a ideia de ações realizadas injustamente.
- source_word: ecce
  choice: Vejam
  rationale: Reproduz a chamada enfática de atenção de ecce em linguagem moderna e digna.
- source_word: sanguis innoxius et iustus
  choice: o sangue inocente e justo
  rationale: Preserva os dois qualificativos do texto latino e sua personificação como sangue que clama.
- source_word: perseveranter
  choice: sem cessar
  rationale: Transmite a continuidade persistente do clamor de forma natural em português.
theological_decisions:
- issue: Referente das impiedades e das injustiças
  choice: Preservar a referência coletiva e genérica por meio de “eles”
  alternative: Explicitar um grupo de perseguidores ou ímpios
  rationale: O versículo não identifica aqui o grupo com maior precisão; explicitá-lo acrescentaria interpretação.
- issue: Relação entre sangue e almas que clamam
  choice: Manter ambas as imagens paralelas sem harmonizá-las
  alternative: Entender o sangue apenas como metáfora das almas dos mortos
  rationale: O texto apresenta separadamente o sangue inocente e as almas dos justos; a tradução conserva essa tensão imagética.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom permanece solene e profético, evitando tanto arcaísmos como “eis” quanto expressões excessivamente coloquiais.
