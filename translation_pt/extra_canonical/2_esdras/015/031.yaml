id: 2ES.15.31
reference: 2 Esdras 15:31
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et post haec supervalescet draco nativitatis memoria suae, et si converterint se conspirantes in virtute magna ad persequendos eos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/031.yaml
  text: And after this the dragon[a], mindful of its origin, will prevail; and if they turn, conspiring in great force to pursue them[b],
translation:
  language: pt
  text: E depois disso o dragão[a], lembrando-se de sua origem, prevalecerá; e, se eles se voltarem, unindo-se com grande força para persegui-los[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase sobre “o dragão, lembrando-se de sua origem” é textualmente obscura. A tradução preserva a imagem incomum, em vez de substituí-la por uma conjectura mais fluente.
    reason: textual_variant
  - marker: b
    text: 'Ou: “se eles se voltarem, conspirando com grande força para persegui-los”.'
    reason: previous_rendering
lexical_decisions:
- source_word: supervalescet
  choice: prevalecerá
  rationale: Expressa o fortalecimento e predomínio indicados pelo verbo latino, mantendo o tom profético.
- source_word: nativitatis memoria suae
  choice: lembrando-se de sua origem
  rationale: Reproduz a construção obscura do latim de modo inteligível, sem eliminar sua imagem incomum; 'origem' é natural e semanticamente mais amplo que 'nascimento' neste contexto.
- source_word: conspirantes
  choice: unindo-se
  rationale: No contexto de mobilização militar, indica ação conjunta ou formação de aliança; evita a ideia moderna, mais estreita, de conspiração secreta.
- source_word: converterint se
  choice: se eles se voltarem
  rationale: Mantém o valor reflexivo e condicional da expressão latina sem a rigidez de uma tradução palavra por palavra.
theological_decisions:
- issue: Identidade e imagem do dragão
  choice: Preservar literalmente 'o dragão' e a lembrança de sua origem
  alternative: Identificar ou explicar o dragão no corpo do texto
  rationale: O versículo não explicita a identidade do dragão, e a cláusula é textualmente obscura; interpretá-la no texto resolveria indevidamente a ambiguidade apocalíptica.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe profética fluente. A vírgula final foi preservada porque o versículo continua no seguinte. A tradução conserva a obscuridade real da cláusula sobre o dragão, mas verte conspirantes pelo sentido contextual de união para ação militar.
