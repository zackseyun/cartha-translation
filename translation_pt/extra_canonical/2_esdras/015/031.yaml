  source_fidelity: 'A tradução acompanha fielmente o latim: «depois disso» verte et post haec; «prevalecerá» reproduz supervalescet; «lembrando-se de sua origem» preserva, sem resolver, a expressão obscura nativitatis memoria suae; e «se eles se voltarem, unindo-se com grande força para persegui-los» representa adequadamente converterint se conspirantes in virtute magna ad persequendos eos. A vírgula final é correta, pois a oração permanece incompleta no fim do versículo.'
  naturalness: O português é atual, claro e de registro profético adequado. «Unindo-se com grande força» é natural e comunica melhor no contexto de mobilização hostil o valor de conspirantes do que uma formulação que sugira necessariamente intriga secreta.
  terminology: «Dragão», «origem» e «prevalecerá» são escolhas apropriadas. A nota a preserva a dificuldade textual e imagética sem impor identificação interpretativa ao dragão. A nota b distingue de modo útil a alternativa mais literal «conspirando».
