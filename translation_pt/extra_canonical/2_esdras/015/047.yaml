  verdict: approve
  source_fidelity: 'A tradução corresponde de perto ao latim fornecido: «Vae tibi, misera» é bem vertido por «Ai de você, miserável»; «adsimilasti ei» preserva a comparação com o referente feminino («se fez semelhante a ela»); e «ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus» é adequadamente expresso como enfeitar as filhas para a prostituição, com as finalidades de agradar aos amantes e gloriar-se neles. O «eius,» inicial parece ser resíduo ou continuação textual do contexto precedente, não um elemento sintaticamente integrado à oração do versículo tal como apresentada; sua ausência no texto do versículo acompanha o audit trail inglês e não prejudica a fidelidade da unidade traduzida.'
