  text: eius, Vae tibi, misera, propter quod adsimilasti ei, ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/047.yaml
  text: Woe to you, miserable one, because you made yourself like her and adorned your daughters for prostitution, to please and glory in your lovers.
translation:
  language: pt
  text: Ai de você, miserável, porque se fez semelhante a ela e enfeitou suas filhas para a prostituição, a fim de agradar a seus amantes e gloriar-se neles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vae tibi
  choice: Ai de você
  rationale: Mantém a fórmula profética de lamento e condenação em português natural e solene.
- source_word: misera
  choice: miserável
  rationale: Conserva o feminino singular e a força depreciativa do latim, sem especificar além do texto.
- source_word: adsimilasti ei
  choice: se fez semelhante a ela
  rationale: Expressa a assimilação deliberada indicada pelo verbo e preserva o referente feminino sem identificá-lo interpretativamente.
- source_word: ornasti filias tuas
  choice: enfeitou suas filhas
  rationale: Traduz diretamente a ação de adornar ou preparar, com linguagem corrente.
- source_word: in fornicatione
  choice: para a prostituição
  rationale: Neste contexto, ligado a agradar amantes, a formulação indica a finalidade sexual e acompanha a leitura da camada inglesa auditada.
- source_word: ad placendum et gloriandum in amatoribus
  choice: a fim de agradar a seus amantes e gloriar-se neles
  rationale: Preserva as duas finalidades coordenadas e explicita naturalmente em português o complemento pronominal de 'gloriar-se'.
theological_decisions:
- issue: Possível dimensão figurada de fornicação e amantes
  choice: Manter a linguagem concreta de prostituição e amantes
  alternative: Interpretar explicitamente como idolatria ou alianças políticas
  rationale: O versículo usa imagens sexuais sem declarar aqui sua aplicação figurada; a tradução não deve resolver essa tensão por meio de uma interpretação teológica adicionada.
translation_notes:
  register: Português moderno, digno e acessível, com cadência profética. Emprega tratamento por 'você' para ampla legibilidade brasileira e mantém o feminino singular do destinatário.
