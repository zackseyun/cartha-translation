source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et a territorio Assyriorum subsessor subsedebiteos et consumet unum ex illis, et erit timor et tremor in exercitum illorum et inconstabilitio in regno illorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/033.yaml
  text: And from the territory of the Assyrians an ambusher will lie in wait for them and consume one of them, and there will be fear and trembling in their army and instability in their kingdom.
translation:
  language: pt
  text: E, do território dos assírios, um emboscador ficará à espreita deles e consumirá um deles; haverá medo e tremor no exército deles e instabilidade no reino deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: subsessor
  choice: um emboscador
  rationale: O substantivo latino designa alguém que arma uma emboscada; a tradução preserva a figura pessoal e hostil.
- source_word: subsedebit eos
  choice: ficará à espreita deles
  rationale: Expressa de modo natural em português a ação de esperar ocultamente para atacar, sem repetir desnecessariamente a ideia já presente em “emboscador”.
- source_word: consumet
  choice: consumirá
  rationale: Mantém a força e a amplitude do verbo latino, que pode indicar destruir ou dar cabo de alguém.
- source_word: inconstabilitio
  choice: instabilidade
  rationale: Reproduz o sentido do substantivo latino tardio, indicando falta de firmeza ou estabilidade política.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do latim. A repetição de “deles” foi mantida para conservar claros os referentes; “assírios” aparece em minúscula conforme o uso ortográfico corrente para gentílicos.
