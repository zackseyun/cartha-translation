  yaml_path: translation/extra_canonical/2_esdras/015/023.yaml
  text: And fire went out from his wrath and devoured the foundations of the earth[a], and sinners like straw set ablaze.
translation:
  language: pt
  text: E da ira dele saiu fogo, que devorou os fundamentos da terra[a] e os pecadores como palha em chamas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, com pausa enfática: “que devorou os fundamentos da terra — e os pecadores, como palha em chamas”.'
    reason: A sequência latina permite diferenças de pontuação e ênfase, embora 'os fundamentos da terra' e 'os pecadores' sejam naturalmente entendidos como objetos de 'devorou'.
lexical_decisions:
- source_word: exiit ignis ab ira eius
  choice: da ira dele saiu fogo
  rationale: Mantém a imagem e a ordem conceitual do latim em português natural, sem reduzir a ira a mera causa abstrata.
- source_word: devoravit
  choice: devorou
  rationale: Reproduz diretamente a metáfora forte de consumo pelo fogo.
- source_word: fundamenta terrae
  choice: os fundamentos da terra
  rationale: Correspondência formal clara, preservando o alcance cósmico da expressão.
- source_word: peccatores quasi stramen incensum
  choice: os pecadores como palha em chamas
  rationale: Expressa a comparação de modo corrente e vívido; 'em chamas' traduz o estado indicado por incensum sem sugerir apenas uma ação futura.
theological_decisions:
- issue: Relação sintática entre o verbo 'devorou', os fundamentos da terra e os pecadores
  choice: Tratar ambos como objetos de 'devorou', com a comparação ligada aos pecadores
  alternative: Pontuar depois de 'terra', criando maior impressão de uma segunda oração elíptica
  rationale: A construção latina coordena 'fundamenta terrae et peccatores' sob 'devoravit'; a tradução preserva essa leitura sem inserir verbo inexistente.
translation_notes:
  register: Português atual, digno e amplamente inteligível, com construção de legibilidade brasileira. A formulação conserva o paralelismo e a intensidade poética do latim.
