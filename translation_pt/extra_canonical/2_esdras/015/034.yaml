lexical_decisions:
- source_word: ecce
  choice: Eis que
  rationale: Preserva o chamado enfático de atenção do latim em registro bíblico digno e compreensível.
- source_word: nubs
  choice: nuvens
  rationale: A forma transmitida parece representar 'nubes'; o sentido plural é confirmado pela concordância posterior em 'illorum'.
- source_word: facies illorum
  choice: seu aspecto
  rationale: Expressa naturalmente a aparência das nuvens sem impor a imagem mais literal de 'faces'.
- source_word: horrida valde
  choice: muito terrível
  rationale: Mantém a intensidade de 'valde' e o caráter aterrador de 'horrida'.
- source_word: plena irae et procellae
  choice: cheio de ira e tempestade
  rationale: O adjetivo latino no feminino singular parece concordar com 'facies'; em português, 'cheio' concorda com 'aspecto', preservando a construção e suas imagens.
