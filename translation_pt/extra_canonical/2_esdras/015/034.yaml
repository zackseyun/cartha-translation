  text: Behold, clouds from the east and from the north as far as the south, and their appearance is very dreadful, full of wrath and storm.
translation:
  language: pt
  text: Eis que vêm nuvens do oriente e do norte até o sul, e seu aspecto é muito terrível, cheio de ira e tempestade.
