source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: novit Deus qui peccantin eum, propterea tradet eos in mortem et in occisionem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/026.yaml
  text: God knows those who sin against him[a]; therefore he will hand them over to death and slaughter.
translation:
  language: pt
  text: Deus conhece os que pecam contra ele; por isso, ele os entregará à morte e à matança.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: novit
  choice: conhece
  rationale: 'Expressa de modo direto e natural o perfeito latino com sentido presente: Deus sabe quem são e conhece os que pecam.'
- source_word: peccant in eum
  choice: pecam contra ele
  rationale: A preposição latina «in» com «peccant» indica que o pecado é dirigido contra Deus; «contra ele» preserva essa relação com clareza.
- source_word: tradet
  choice: entregará
  rationale: Mantém o valor futuro e a ideia de colocar essas pessoas sob o poder ou destino indicado a seguir.
- source_word: in mortem et in occisionem
  choice: à morte e à matança
  rationale: Preserva os dois termos coordenados do latim. «Matança» comunica morte violenta e coletiva sem suavizar «occisionem».
theological_decisions:
- issue: Relação lógica entre as duas orações
  choice: por isso
  alternative: pois Deus conhece os que pecam contra ele
  rationale: «Propterea» introduz explicitamente a consequência na segunda oração. Não se acrescentou «pois» no início, porque não há conjunção causal correspondente antes de «novit Deus» no texto latino.
- issue: Sentido de «conhecer»
  choice: conhece
  alternative: sabe quem são
  rationale: A tradução mantém o verbo simples e sua possível densidade relacional ou judicial, sem reduzi-lo apenas à identificação intelectual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A formulação conserva a concisão e a severidade do latim.
