  source_fidelity: 'O texto traduz com precisão a sequência latina: «novit Deus» por «Deus conhece», «qui peccant in eum» por «os que pecam contra ele», e o futuro «tradet» por «entregará». «À morte e à matança» preserva os dois destinos coordenados de «in mortem et in occisionem», inclusive a força violenta do segundo termo.'
