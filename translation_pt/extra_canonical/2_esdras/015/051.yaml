source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: exsurget ardor qui emissus est super te. Et infirmaberis et paupera a plaga et mastigata a uulneribus, ut non possis tuos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/051.yaml
  text: The burning that has been sent out against you will rise up[a], and you will be weakened and made poor by the blow, and scourged by wounds, so that you will not be able to receive your own.
translation:
  language: pt
  text: O ardor lançado contra ti se levantará, e tu ficarás enfraquecida e empobrecida pelo golpe, açoitada por feridas, de modo que não possas receber os teus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim preservado termina aqui com uma construção incompleta, literalmente: “de modo que não possas os teus”. O verbo “receber” foi suprido para completar o sentido.'
    reason: textual_or_grammatical_gap
lexical_decisions:
- source_word: ardor
  choice: ardor
  rationale: Preserva a imagem de calor intenso ou queima sem a restringir indevidamente a incêndio, ira ou febre.
- source_word: exsurget
  choice: se levantará
  rationale: Reproduz o sentido básico de surgir ou erguer-se e mantém a personificação do ardor.
- source_word: infirmaberis
  choice: ficarás enfraquecida
  rationale: Expressa a passiva futura e concorda com a destinatária feminina indicada pelas formas latinas.
- source_word: paupera a plaga
  choice: empobrecida pelo golpe
  rationale: Mantém o valor concreto de paupera e entende plaga como golpe, sentido favorecido pelo campo semântico de açoite e feridas no contexto imediato.
- source_word: mastigata a uulneribus
  choice: açoitada por feridas
  rationale: Conserva a imagem corporal de castigo de mastigata e a ligação explícita com feridas.
- source_word: tuos
  choice: os teus
  rationale: Mantém o masculino plural substantivado e sua referência não especificada, sem identificar os envolvidos como poderosos, amantes ou outro grupo.
theological_decisions:
- issue: Identidade de “os teus”
  choice: 'Manter a expressão aberta: “os teus”'
  alternative: Explicitar “teus homens”, “teus aliados”, “teus poderosos” ou “teus amantes”
  rationale: O latim tuos não identifica o grupo; explicá-lo importaria uma interpretação ausente do texto fornecido.
- issue: Verbo ausente após possis
  choice: Suprir “receber” e assinalar a lacuna em nota
  alternative: Imprimir literalmente a construção incompleta “não possas os teus”
  rationale: A forma latina fornecida é sintaticamente incompleta. A suplementação produz português legível, enquanto a nota torna transparente que o verbo não está preservado no trecho latino.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “tu” coerente com a segunda pessoa singular do latim. Mantiveram-se a destinatária feminina e as imagens físicas de golpe, açoite e feridas. A ambiguidade de “os teus” foi preservada, e a única suplementação necessária foi explicitada em nota.
