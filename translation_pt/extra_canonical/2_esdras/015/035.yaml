base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/035.yaml
  text: And they will strike one another and pour out an abundant storm upon the earth[a], their storm[b]; and there will be blood from the sword up to the horse's belly.
translation:
  language: pt
  text: E eles se chocarão uns contra os outros e derramarão sobre a terra uma tempestade abundante[a] e a tempestade deles[b]; e haverá sangue desde a espada até o ventre do cavalo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim sidus está no singular aqui e nas ocorrências desta seção. Pode significar “estrela” ou “astro”, mas também “tempestade” ou um fenômeno celeste; o verbo “derramar” e o adjetivo “abundante” favorecem “tempestade” neste contexto.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, preservando o sentido mais comum de sidus: “derramarão sobre a terra uma estrela abundante e a estrela deles”.'
    reason: previous_rendering
lexical_decisions:
- source_word: conlident se invicem
  choice: se chocarão uns contra os outros
  rationale: Preserva a ideia recíproca de colisão ou confronto violento sem especificar além do latim como ocorrerá o ataque.
- source_word: sidus copiosum
  choice: uma tempestade abundante
  rationale: Embora sidus normalmente possa significar “estrela” ou “astro”, também admite o sentido de fenômeno meteorológico violento. Effundent (“derramarão”), copiosum (“abundante”) e o contexto favorecem “tempestade”.
- source_word: sidus illorum
  choice: a tempestade deles
  rationale: Repete o mesmo sentido de sidus adotado na oração anterior e conserva a repetição enfática e incomum do texto latino.
- source_word: a gladio usque ad ventrem equi
  choice: desde a espada até o ventre do cavalo
  rationale: Mantém os dois limites expressos pelo latim sem introduzir a ideia não explicitada de que o sangue “subirá” até determinada altura.
theological_decisions:
- issue: Natureza de sidus na imagem apocalíptica
  choice: tempestade no texto principal, com a ambiguidade registrada em nota
  alternative: estrela ou astro
  rationale: O contexto e a combinação com “derramar” e “abundante” selecionam melhor o sentido meteorológico, mas a polissemia genuína do termo latino deve permanecer visível ao leitor.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com construção deliberadamente próxima do latim na repetição de “tempestade” e na expressão final “desde a espada até o ventre do cavalo”. O ponto e vírgula organiza o longo período sem eliminar sua tensão apocalíptica.
