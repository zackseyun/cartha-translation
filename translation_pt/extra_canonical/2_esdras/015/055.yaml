  yaml_path: translation/extra_canonical/2_esdras/015/055.yaml
  text: The wages of a prostitute are in your bosom[a]; therefore you will receive repayment.
translation:
  language: pt
  text: O pagamento de uma prostituta está em seu colo[a]; por isso, você receberá retribuição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na dobra da sua roupa”.'
    reason: O latim “sinus” pode referir-se ao colo ou à dobra frontal da veste, onde se guardavam coisas.
lexical_decisions:
- source_word: merces fornicariae
  choice: o pagamento de uma prostituta
  rationale: “Fornicariae” é genitivo de “fornicaria” (prostituta), e “merces” indica pagamento, salário ou recompensa. A formulação preserva a referência concreta à prostituta, sem convertê-la no abstrato “prostituição”.
- source_word: in sinus tuos
  choice: está no seu colo
  rationale: O plural latino “sinus” pode designar o colo ou a dobra frontal da roupa usada para guardar ou receber algo. “No seu colo” mantém a imagem corporal e é natural em português; a nota registra a alternativa concreta.
- source_word: redditionem percipies
  choice: você receberá a devida retribuição
  rationale: “Redditio” expressa devolução ou retribuição, enquanto “percipies” significa receber. “Devida retribuição” comunica o retorno correspondente aos atos sem especificar além do texto se é recompensa ou castigo.
theological_decisions:
- issue: Caráter da retribuição
  choice: devida retribuição
  alternative: pagamento de volta; castigo
  rationale: O contexto sugere juízo, mas o latim “redditionem” formula a ideia de retorno/retribuição. Evita-se inserir explicitamente “castigo”, preservando a relação verbal entre pagamento e retribuição.
- issue: Texto anteriormente associado ao versículo
  choice: traduzir somente o latim fornecido para 15:55
  alternative: incorporar o texto sobre os escolhidos, a fome e a espada
  rationale: O trecho alternativo pertence aos versículos seguintes segundo a evidência indicada e resultaria em desalinhamento de versificação.
translation_notes:
  register: Português atual, claro e digno, com tratamento por “você” para legibilidade ampla. A construção conserva a imagem incisiva e o paralelismo entre pagamento e retribuição.
