source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non miserebitur homo proximo suo ad irritum faciendum in domos eorum in gladium, ad diripiendas substantias eorum propter famem panis et tribulationem multam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/019.yaml
  text: A man will have no pity on his neighbor, but will rush upon their houses with the sword, plundering their possessions because of hunger for bread and great distress.
translation:
  language: pt
  text: Ninguém terá compaixão do seu próximo, mas destruirá as suas casas à espada e saqueará os seus bens, por causa da fome de pão e da grande tribulação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non miserebitur homo proximo suo
  choice: Ninguém terá compaixão do seu próximo
  rationale: Expressa naturalmente a negação generalizante do latim, preservando a relação com o próximo.
- source_word: ad irritum faciendum in domos eorum in gladium
  choice: mas atacará à espada a casa dele
  rationale: O trecho latino é sintaticamente difícil e possivelmente corrompido; a formulação segue o sentido contextual de uma investida violenta contra a moradia, sem reproduzir uma construção obscura em português.
- source_word: ad diripiendas substantias eorum
  choice: e saqueará os seus bens
  rationale: “Saquear” comunica com precisão a tomada violenta; “bens” é uma equivalência atual e abrangente para substantias.
- source_word: propter famem panis et tribulationem multam
  choice: por causa da fome de pão e da grande tribulação
  rationale: Mantém a imagem explícita da escassez de pão e traduz tribulatio de modo formal, digno e teologicamente não restritivo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O singular foi mantido de modo coerente (“seu próximo”, “a casa dele”, “seus bens”), evitando a oscilação pronominal da camada inglesa. A passagem latina difícil foi vertida segundo o sentido provável no contexto.
