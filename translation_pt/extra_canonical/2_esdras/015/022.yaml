  text: non parcet dextera mea super peccantes nec cessabit romphea super effundentes sanguinem innocuum super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/022.yaml
  text: My right hand will not spare the sinners[a], nor will the sword cease against those who shed innocent blood upon the earth.
translation:
  language: pt
  text: Minha mão direita não poupará os pecadores, nem a espada deixará de agir contra os que derramam sangue inocente sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dextera mea
  choice: minha mão direita
  rationale: Reproduz diretamente a imagem latina, que representa o poder atuante de quem fala sem explicitar além do texto.
- source_word: non parcet
  choice: não poupará
  rationale: Equivalente natural e preciso para a recusa de mostrar clemência.
- source_word: romphea
  choice: espada
  rationale: O termo latino, tomado do grego ῥομφαία, designa aqui a arma de juízo; “espada” evita especificidade anacrônica.
- source_word: nec cessabit ... super
  choice: nem ... deixará de agir contra
  rationale: “Deixará de agir” completa em português o sentido contextual de cessabit, enquanto “contra” expressa naturalmente super como direção hostil do juízo.
- source_word: effundentes sanguinem innocuum
  choice: os que derramam sangue inocente
  rationale: Mantém o idioma bíblico tradicional e ainda corrente para matar inocentes.
- source_word: super terram
  choice: sobre a terra
  rationale: Correspondência direta que conserva o alcance espacial da declaração.
theological_decisions:
- issue: Agente e alcance do juízo simbolizado pela espada
  choice: Manter a espada como imagem ativa do juízo, sem identificar seu agente humano ou sobrenatural.
  alternative: Explicitar que Deus fará a espada atacar ou matar os culpados.
  rationale: O latim afirma apenas que a espada não cessará contra eles; uma identificação adicional resolveria indevidamente a imagem.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A metáfora da mão direita e o idioma “derramar sangue inocente” foram preservados.
