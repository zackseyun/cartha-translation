  yaml_path: translation/extra_canonical/2_esdras/015/052.yaml
  text: Would I be so zealous against you[a], says the Lord,
translation:
  language: pt
  text: Acaso eu agiria com tanto zelo contra você[a], diz o Senhor,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Acaso eu teria tanto ciúme de você, diz o Senhor,”.'
    reason: O verbo latino pode exprimir tanto zelo ardente quanto ciúme; a alternativa preserva essa ambiguidade lexical.
lexical_decisions:
- source_word: Numquid
  choice: Acaso
  rationale: Introduz naturalmente uma pergunta retórica que espera resposta negativa.
- source_word: sic zelabo
  choice: agiria com tanto zelo
  rationale: Conserva a ideia de zelo intenso dirigido contra alguém, aqui no contexto de juízo, sem sugerir meramente inveja ou ciúme romântico. O futuro latino tem valor modal na pergunta retórica.
- source_word: te
  choice: contra você
  rationale: Mantém a segunda pessoa do singular e explicita a direção hostil do zelo no contexto.
theological_decisions:
- issue: Sentido do zelo divino
  choice: zelo exercido em juízo contra a destinatária
  alternative: ciúme em relação à destinatária
  rationale: O contexto favorece ardor punitivo, mas a nota preserva a possibilidade lexical de ciúme ou zelo possessivo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém a pergunta retórica e a vírgula final, pois a frase continua no versículo seguinte.
