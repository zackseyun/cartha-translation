lexical_decisions:
- source_word: ecce
  choice: Eis
  rationale: Preserva de modo conciso e digno a partícula latina que chama a atenção para o que é apresentado.
- source_word: visio horribilis
  choice: uma visão horrível
  rationale: Mantém a força de horribilis, que descreve algo aterrador, sem suavizá-lo para apenas “impressionante” ou “sombrio”.
- source_word: facies illius
  choice: sua face
  rationale: Conserva a imagem concreta de facies e a formulação deliberadamente incomum do texto, sem reduzi-la a “aparência”.
- source_word: ab oriente
  choice: vem do oriente
  rationale: Expressa naturalmente em português a procedência indicada por ab, entendendo oriente como a direção leste.
