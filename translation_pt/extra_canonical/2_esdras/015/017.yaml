review_pass:
  verdict: revise
  source_fidelity: A conjunção inicial «Pois» traduz adequadamente enim, e «alguém» preserva o valor genérico de homo. Contudo, o latim coordena as ações com et («e»), sem marcar contraste; «mas» introduz uma oposição que não está expressa na fonte. «Ir a uma cidade» representa mais diretamente in civitatem ire do que «entrar numa cidade».
  naturalness: «Pois alguém desejará ir a uma cidade e não poderá» é claro, natural e mantém o tom profético sóbrio. A construção final elíptica («não poderá [ir]») é idiomática em português e reproduz a elipse latina.
  terminology: Não há termos teológicos ou nomes próprios neste versículo. «Alguém» é uma solução inclusiva e natural para o uso genérico de homo.
  issues:
  - severity: medium
    issue: «mas» traduz et como adversativa.
    rationale: A fonte diz «et non poterit» (“e não poderá”). Embora o contexto possa tornar a sequência contrastante, o conectivo latino não codifica essa adversatividade; «e» preserva melhor a coordenação simples.
  - severity: low
    issue: «entrar numa cidade» é mais específico do que ire in civitatem.
    rationale: Ire significa “ir”, e a preposição in aponta para o destino/entrada. «Ir a uma cidade» é a formulação portuguesa mais direta sem acrescentar a nuance específica de atravessar a entrada.
