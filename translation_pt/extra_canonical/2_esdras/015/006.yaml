  source_fidelity: A relação introduzida por «propter quod» é causal, não meramente conclusiva; «porque» a representa melhor que «Por isso». «adimpletae sunt» indica que as obras chegaram à plenitude/foram plenamente realizadas; «se completaram» é menos preciso e pode sugerir apenas encerramento.
  naturalness: «Porque a iniquidade se espalhou por toda a terra, e as obras deles chegaram à plenitude» é natural, claro e mantém um registro bíblico moderno.
  terminology: «Iniquidade» corresponde mais diretamente a «iniquitas» e preserva o registro moral-jurídico do texto. «Obras» traduz «operationes» sem acrescentar «nocivas». Não se deve introduzir a alternativa inglesa «obras nocivas», pois ela não é apoiada pelo texto latino fornecido.
