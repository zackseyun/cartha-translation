    rationale: No contexto sintático, a locução dá a razão para o enunciado precedente; «porque» preserva essa função causal, enquanto «por isso» tende a inverter a relação lógica.
  - severity: low
    issue: «se completaram» para «adimpletae sunt»
    rationale: A forma reflexiva é possível, mas não exprime tão claramente a noção de plenitude/preenchimento do particípio latino. «Chegaram à plenitude» mantém a ambiguidade sem interpretar seu alcance.
