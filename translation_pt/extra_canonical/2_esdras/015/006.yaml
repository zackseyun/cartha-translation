lexical_decisions:
- source_word: propter quod
  choice: Por isso
  rationale: Expressa naturalmente em português a relação conclusiva ou causal da locução latina.
- source_word: superposuit iniquitas omnem terram
  choice: a maldade se espalhou por toda a terra
  rationale: Reproduz o sentido de a iniquidade cobrir ou estender-se sobre toda a terra, com formulação corrente em português.
- source_word: operationes eorum
  choice: as obras deles
  rationale: Traduz diretamente o texto latino sem acrescentar a ideia de obras nocivas, ausente nesta edição.
- source_word: adimpletae sunt
  choice: se completaram
  rationale: Preserva a imagem de atos que atingiram seu pleno cumprimento sem explicitar uma interpretação sobre medida, quantidade ou juízo.
theological_decisions:
- issue: Sentido da plenitude das obras
  choice: se completaram
  alternative: chegaram à sua plenitude
  rationale: A opção escolhida mantém a tensão do latim, que pode indicar cumprimento, consumação ou preenchimento, sem definir em que sentido as obras ficaram completas.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A redação conserva o paralelismo e evita importar a variante «obras nocivas».
