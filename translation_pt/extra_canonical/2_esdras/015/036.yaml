lexical_decisions:
- source_word: femur hominis
  choice: a coxa de um homem
  rationale: “Femur” designa a coxa; a construção genitiva foi vertida naturalmente sem perder a referência genérica a um ser humano do sexo masculino.
- source_word: suffraginem cameli
  choice: o jarrete de um camelo
  rationale: O latim “suffrago” refere-se à articulação posterior da perna de um animal; “jarrete” é o equivalente anatômico preciso em português.
- source_word: timor et tremor multus
  choice: grande medo e tremor
  rationale: Mantém os dois termos coordenados e entende “multus” como indicação da grande intensidade do medo e do tremor.
- source_word: super terram
  choice: sobre a terra
  rationale: Tradução direta que conserva a abrangência territorial da expressão latina.
