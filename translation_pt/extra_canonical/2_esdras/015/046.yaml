  text: And you[a], Asia, partner in the splendor of Babylon and in the glory of her person—
translation:
  language: pt
  text: E tu[a], Ásia, companheira no esplendor da Babilônia e na glória de sua figura—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A forma de se dirigir à Ásia como companheira da Babilônia reflete uma camada de composição distinta do núcleo judaico de 4 Esdras. A retórica deste trecho pertence ao apêndice cristão latino posterior, comumente chamado de 6 Esdras.
    reason: compositional_layer
lexical_decisions:
- source_word: consors
  choice: companheira
  rationale: Expressa participação ou associação com Babilônia, preservando a personificação feminina de Ásia.
- source_word: in specie Babylonis
  choice: no esplendor da Babilônia
  rationale: Neste contexto retórico, species denota aspecto vistoso ou esplendor, e não simplesmente forma ou espécie.
- source_word: gloria personae
  choice: glória de sua aparência
  rationale: Persona pode referir-se à figura, presença ou aparência exterior; esta formulação preserva o sentido visual sem impor a acepção moderna de personalidade.
theological_decisions:
- issue: Identificação retórica de Ásia com uma associada de Babilônia
  choice: Manter a apóstrofe e a personificação sem explicação no corpo do texto
  alternative: Explicitar Ásia como participante do poder ou luxo de Babilônia
  rationale: O latim formula uma acusação poética e deixa indefinida a natureza exata da associação; a tradução preserva essa tensão.
translation_notes:
  register: Português atual, digno e de leitura ampla. A vírgula vocativa e o travessão final preservam a apóstrofe e a continuação sintática do versículo.
