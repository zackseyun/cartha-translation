  text: 'Eis que trarei sobre o mundo males, diz o Senhor: espada, fome, morte e destruição,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: Eis que
  rationale: Preserva a fórmula enfática de anúncio do latim em registro bíblico digno e ainda compreensível.
- source_word: induco
  choice: trarei sobre
  rationale: Expressa naturalmente o sentido causativo e direcional de introduzir ou fazer vir algo sobre alguém.
- source_word: orbem terrarum
  choice: o mundo
  rationale: Equivalente corrente para a expressão latina que designa o mundo habitado ou toda a terra.
- source_word: mala
  choice: males
  rationale: Mantém a amplitude do plural latino, sem restringi-lo a calamidades específicas além das enumeradas.
- source_word: gladium
  choice: espada
  rationale: Conserva a imagem concreta que também pode representar guerra ou violência, sem explicitar essa extensão interpretativa.
- source_word: famem
  choice: fome
  rationale: Correspondência direta e natural.
- source_word: mortem
  choice: morte
  rationale: Correspondência direta, mantendo sua distinção em relação ao termo final.
- source_word: interitum
  choice: destruição
  rationale: Distingue interitum de mortem e comunica ruína ou extermínio de modo amplo.
theological_decisions:
- issue: Agência divina na vinda dos males
  choice: trarei sobre o mundo males
  alternative: permitirei que males venham sobre o mundo
  rationale: O texto atribui diretamente a ação ao Senhor; uma formulação permissiva resolveria indevidamente a tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com coordenação cumulativa preservada na série “espada, fome, morte e destruição”. A pontuação mantém o versículo como introdução de uma enumeração que pode continuar no contexto.
