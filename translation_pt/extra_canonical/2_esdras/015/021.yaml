review_pass:
  verdict: revise
  source_fidelity: O texto latino tem presente («faciunt») com «usque hodie», portanto «fazem até hoje» é a correspondência mais direta. «Têm feito» é possível em português, mas desloca o enunciado para um perfeito composto e é menos estritamente fiel ao presente da fonte. «electis meis», «faciam et reddam» e «in sinum ipsorum» estão adequadamente representados por «meus escolhidos», «farei e retribuirei» e «no colo deles».
  naturalness: A redação é clara e de registro apropriado. «Assim como fazem ... assim farei» é natural em português contemporâneo e preserva melhor o paralelismo da frase. A nota explica com utilidade a imagem de «colo», mas não deve chamar de literal uma tradução que já foi escolhida precisamente para comunicar o sentido concreto de sinus.
  terminology: «Senhor Deus» traduz adequadamente «Dominus Deus». «Escolhidos» é termo estabelecido e não especifica indevidamente sua identidade. «Retribuirei» preserva o valor judicial de reddam sem impor uma interpretação denominacional.
  issues:
  - severity: low
    issue: Tempo verbal de faciunt
    rationale: «Têm feito» é gramatical e compreensível, mas o presente latino pede preferencialmente «fazem», sobretudo na construção com «até hoje».
  - severity: low
    issue: Formulação da nota
    rationale: '«Literalmente, “no colo deles”» é impreciso: «colo» é uma boa equivalência contextual para sinus, não uma glosa literal inequívoca. A nota pode explicar a imagem sem essa rotulagem.'
  revised_text: 'Assim como fazem aos meus escolhidos até hoje, assim farei e retribuirei no colo deles.[a] Assim diz o Senhor Deus:'
  revised_footnotes:
  - marker: a
    text: A expressão evoca a dobra da roupa usada para receber ou carregar algo.
    reason: Esclarece a imagem concreta de in sinum ipsorum, preservada por «no colo deles», sem caracterizá-la indevidamente como uma tradução literal.
  revision_rationale: A revisão restitui o presente de faciunt («fazem») e ajusta a nota para que ela explique a metáfora antiga de sinus de modo preciso. O restante da tradução preserva fielmente o paralelismo, a retribuição expressa por reddam e a fórmula profética final.
