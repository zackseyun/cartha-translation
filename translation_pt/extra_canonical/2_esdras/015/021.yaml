base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/021.yaml
  text: 'As they have done to my chosen ones to this day[a], so I will do and repay into their lap. Thus says the Lord God:'
translation:
  language: pt
  text: 'Assim como fazem aos meus escolhidos até hoje, assim farei e retribuirei no colo deles.[a] Assim diz o Senhor Deus:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão evoca a dobra da roupa usada para receber ou carregar algo.
    reason: Esclarece a imagem concreta de in sinum ipsorum, preservada por «no colo deles», sem caracterizá-la indevidamente como uma tradução literal.
lexical_decisions:
- source_word: electis meis
  choice: meus escolhidos
  rationale: Reproduz de modo natural o sentido de pessoas escolhidas por Deus, sem acrescentar uma definição teológica mais específica.
- source_word: reddam
  choice: retribuirei
  rationale: Expressa a ideia de devolver ou dar em resposta ao que foi feito, adequada ao contexto de retribuição judicial.
- source_word: in sinum ipsorum
  choice: no colo deles
  rationale: Preserva a imagem concreta do sinus, a dobra frontal da roupa onde algo podia ser depositado, evitando o sentido predominantemente anatômico que “seio” teria no português atual.
theological_decisions:
- issue: Correspondência entre o tratamento dado aos escolhidos e a ação divina
  choice: “assim farei e retribuirei”
  alternative: “farei o mesmo e lhes darei a paga”
  rationale: Mantém os dois verbos latinos, faciam e reddam, e preserva a tensão da formulação sem explicitar além do texto a natureza exata da ação divina.
translation_notes:
  register: Português moderno, claro e digno, com estrutura deliberadamente próxima do paralelismo latino. “Têm feito” traduz faciunt em combinação natural com “até hoje”, ressaltando uma conduta que vem ocorrendo até o presente. O marcador [a] aparece no texto principal.
