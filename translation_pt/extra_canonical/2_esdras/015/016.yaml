  timestamp: '2026-07-14T01:27:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente constabilitio como “instabilidade”, non curabunt como “não darão atenção” e a construção singular “chefe dos seus nobres”. Contudo, “confiantes em seu próprio poder” introduz a noção psicológica de confiança, que não é expressa por in potentia sua. A locução final deve permanecer mais literalmente ambígua: “em seu poder”.'
  naturalness: O texto é claro e de registro apropriado. “Uns prevalecendo sobre os outros” representa de modo mais direto e natural a construção alii alios supervalescentes do que “dominando uns aos outros”.
  terminology: '“Chefe dos seus nobres” reproduz corretamente principem megestanorum suorum: um líder singular associado aos nobres/magnatas. A alternativa em nota pode conservar “príncipe” e “magnatas”, sem tornar esses termos a leitura principal.'
  issues:
  - severity: medium
    issue: “confiantes em seu próprio poder” explicita uma atitude interior não presente no latim.
    rationale: In potentia sua significa literalmente “em seu poder” e pode indicar a condição, esfera ou exercício de poder dos agentes. “Confiantes” restringe indevidamente essa ambiguidade.
  - severity: low
    issue: “dominando uns aos outros” é menos direto para alii alios supervalescentes.
    rationale: A formulação “uns prevalecendo sobre os outros” mantém a oposição entre grupos de pessoas e o aspecto de prevalecer/sobrepujar, sem sugerir uma reciprocidade estrita.
  revised_text: Pois haverá instabilidade entre as pessoas; uns prevalecendo sobre os outros, não darão atenção ao seu rei nem ao chefe dos seus nobres[a], em seu poder.
  revised_footnotes:
  - marker: a
    text: 'Ou: “ao príncipe de seus magnatas”.'
    reason: Preserva uma alternativa lexical para principem megestanorum, mantendo o singular “príncipe” e o sentido de magnatas/nobres.
  revision_rationale: A revisão elimina a interpretação psicológica acrescentada por “confiantes” e conserva a ambiguidade sintática e semântica da locução latina final. Também torna mais transparente a relação de prevalência entre uns e outros, sem alterar o tom profético nem a referência a um chefe singular dos nobres.
