revisions:
- from: Pois haverá instabilidade entre os seres humanos; dominando uns aos outros, eles não darão atenção ao seu rei nem ao chefe dos seus nobres[a], confiantes em seu próprio poder.
  to: Pois haverá instabilidade entre as pessoas; uns prevalecendo sobre os outros, não darão atenção ao seu rei nem ao chefe dos seus nobres[a], em seu poder.
  rationale: A revisão elimina a interpretação psicológica acrescentada por “confiantes” e conserva a ambiguidade sintática e semântica da locução latina final. Também torna mais transparente a relação de prevalência entre uns e outros, sem alterar o tom profético nem a referência a um chefe singular dos nobres.
