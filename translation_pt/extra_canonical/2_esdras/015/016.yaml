base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/016.yaml
  text: For there will be instability among men; overpowering one another[a], they will pay no attention to their king or to the chief of their nobles, in their power.
translation:
  language: pt
  text: Pois haverá instabilidade entre as pessoas; uns prevalecendo sobre os outros, não darão atenção ao seu rei nem ao chefe dos seus nobres[a], em seu poder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao príncipe de seus magnatas”.'
    reason: Preserva uma alternativa lexical para principem megestanorum, mantendo o singular “príncipe” e o sentido de magnatas/nobres.
lexical_decisions:
- source_word: constabilitio
  choice: instabilidade
  rationale: O termo latino é incomum ou textualmente problemático; “instabilidade” acompanha o sentido contextual sem especificar indevidamente revolta, guerra ou sedição.
- source_word: alis alios supervalescentes
  choice: dominando uns aos outros
  rationale: Representa a ideia recíproca de uns prevalecerem sobre outros, em português natural, sem restringi-la necessariamente a combate físico.
- source_word: non curabunt
  choice: não darão atenção
  rationale: Expressa o sentido de não se importar com, não respeitar ou não levar em conta as autoridades mencionadas.
- source_word: principem megestanorum suorum
  choice: chefe dos seus nobres
  rationale: Preserva o substantivo singular principem regendo o plural genitivo megestanorum, isto é, uma figura principal entre os nobres ou magnatas.
- source_word: in potentia sua
  choice: confiantes em seu próprio poder
  rationale: Liga a expressão reflexiva aos que dominam e desconsideram as autoridades, tornando inteligível a relação sintática sem apagar que o latim a coloca no fim da frase.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com vocabulário amplamente compreensível. A construção mantém o tom profético e a tensão social do texto latino, evitando tornar “instabilidade” mais específica do que a fonte permite.
