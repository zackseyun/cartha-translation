  text: because they are faithful and true. Do not fear the thoughts against you, nor let the unbelief of those who speak against you trouble you.
translation:
  language: pt
  text: porque são fiéis e verdadeiras. Não tenha medo dos pensamentos contra você, nem deixe que as incredulidades dos que falam contra você o perturbem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fideles et ueri
  choice: fiéis e verdadeiras
  rationale: Mantém os dois predicativos latinos e concorda naturalmente em português com o referente implícito, provavelmente as palavras ou coisas escritas.
- source_word: cogitationibus aduersum te
  choice: pensamentos contra você
  rationale: Traduz cogitationibus de modo lexicalmente próximo, sem estreitar o sentido para planos ou maquinações.
- source_word: incredulitates
  choice: incredulidades
  rationale: Preserva o plural do texto latino e sua possível referência às diversas manifestações de descrença.
- source_word: contra dicentium
  choice: dos que falam contra você
  rationale: Reproduz a ideia de oposição verbal sem interpretar o grupo mais especificamente como contraditores, acusadores ou adversários formais.
theological_decisions:
- issue: Referente implícito de “fiéis e verdadeiras”
  choice: Manter o referente implícito
  alternative: Explicitar “estas palavras são fiéis e verdadeiras”
  rationale: O trecho começa no meio da construção, e explicitar o substantivo acrescentaria material não presente neste versículo.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A formulação conserva a estrutura exortativa e evita interpretar “pensamentos” como conspirações ou planos.
