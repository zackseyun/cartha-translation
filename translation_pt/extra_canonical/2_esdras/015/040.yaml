base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/040.yaml
  text: And great and mighty clouds full of wrath[a], and a star, will be lifted up to destroy all the earth and those who dwell in it, and they will pour out a dreadful star upon every high and lofty place.
translation:
  language: pt
  text: E grandes e poderosas nuvens, cheias de ira, e uma estrela se elevarão para destruir toda a terra e os seus habitantes; e derramarão uma estrela terrível sobre todo lugar alto e elevado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nubes magnae et validae
  choice: grandes e poderosas nuvens
  rationale: Preserva os dois qualificativos latinos e emprega uma formulação natural e solene em português.
- source_word: plenae irae
  choice: cheias de ira
  rationale: O genitivo latino irae depende de plenae e descreve as nuvens, não a estrela.
- source_word: sidus
  choice: uma estrela
  rationale: O substantivo neutro no nominativo funciona como sujeito coordenado com nubes; a mesma imagem é mantida na ocorrência acusativa posterior.
- source_word: exterant
  choice: destruir
  rationale: No contexto da ameaça apocalíptica, exprime a eliminação devastadora da terra e de seus habitantes.
- source_word: fundent
  choice: derramarão
  rationale: Mantém a imagem incomum e concreta do verbo latino, sem substituí-la por uma interpretação explicativa.
- source_word: super omnem altum et eminentem
  choice: sobre todo lugar alto e elevado
  rationale: Supre naturalmente em português o substantivo elíptico exigido pelos adjetivos substantivados no latim, sem alterar a referência espacial.
theological_decisions:
- issue: Imagem apocalíptica da estrela derramada
  choice: Manter literalmente «derramarão uma estrela terrível»
  alternative: Interpretar a estrela como fogo, calamidade ou juízo
  rationale: O texto latino conserva uma imagem deliberadamente extraordinária; explicá-la teologicamente eliminaria sua tensão e ambiguidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com coordenação e pontuação que deixam claro que tanto as nuvens quanto a estrela são sujeitos de «se elevarão». A estranheza da imagem final foi preservada por fidelidade ao texto latino.
