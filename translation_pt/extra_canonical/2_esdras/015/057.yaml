  text: ciuitates tuae conterentur, et omnes tui in campo gladio cadent; Et qui sunt in montibus fame peribunt, et manducabunt carnes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/057.yaml
  text: Your cities will be shattered[a], and all your people in the field will fall by the sword. And those in the mountains will perish by famine and will eat flesh.
translation:
  language: pt
  text: As suas cidades serão arrasadas, e todo o seu povo que estiver no campo cairá à espada. E os que estiverem nos montes morrerão de fome e comerão carne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase continua no versículo seguinte, onde o latim acrescenta o possessivo suas (“sua”; neste contexto, “a própria”), especificando que comerão a própria carne.
    reason: Esclarece o limite do texto latino entre os versículos sem atribuir ao latim, de modo impreciso, a expressão portuguesa “a própria”.
lexical_decisions:
- source_word: ciuitates tuae conterentur
  choice: As suas cidades serão arrasadas
  rationale: “Arrasadas” expressa de modo natural e vigoroso a destruição indicada por conterentur, sem sugerir apenas dano parcial.
- source_word: omnes tui in campo
  choice: todo o seu povo que estiver no campo
  rationale: O latim omnes tui é elíptico, literalmente “todos os seus”; “todo o seu povo” explicita o referente humano em português corrente, enquanto “que estiver no campo” preserva a localização.
- source_word: gladio cadent
  choice: cairá à espada
  rationale: Mantém a expressão bíblica tradicional e compreensível para morte em combate ou por execução violenta.
- source_word: fame peribunt
  choice: morrerão de fome
  rationale: Tradução direta e idiomática de perecer em consequência da fome.
- source_word: manducabunt carnes
  choice: comerão carne
  rationale: O trecho latino deste versículo termina apenas com carnes, sem o possessivo suas, que pertence ao segmento textual seguinte; por isso não se antecipa aqui “a própria carne”.
theological_decisions:
- issue: Objeto de “comerão” no limite entre os versículos
  choice: comerão carne
  alternative: comerão a própria carne
  rationale: 'A tradução respeita o recorte do texto latino fornecido: o possessivo suas ocorre depois deste limite. A nota informa a continuação sem incorporá-la prematuramente ao texto principal.'
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. Emprega “arrasadas” e “todo o seu povo” para evitar construções excessivamente literais e pouco naturais, preservando a força e a progressão do latim.
