base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/012.yaml
  text: Let Egypt mourn[a], and its foundations, because of the plague of blows and scourging that the Lord will bring upon it.
translation:
  language: pt
  text: Que o Egito e os seus alicerces lamentem, por causa da praga de golpes e açoites[a] que o Senhor fará vir sobre ele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «flagelação».
    reason: Registra uma alternativa portuguesa mais técnica para mastigati, preservando seu sentido físico; o marcador foi colocado junto ao termo pertinente, pois «castigo» seria possível em sentido ampliado, mas suavizaria a imagem.
lexical_decisions:
- source_word: lugeat
  choice: lamentem
  rationale: Expressa de modo direto e digno o sentido de prantear ou estar de luto; o plural em português acomoda o sujeito composto «o Egito e os seus alicerces».
- source_word: fundamenta
  choice: alicerces
  rationale: Mantém a imagem concreta das fundações do Egito e soa natural no português moderno.
- source_word: plaga
  choice: praga
  rationale: Preserva o termo apocalíptico para uma calamidade enviada como juízo, sem reduzi-lo a uma simples ferida.
- source_word: verberati
  choice: golpes
  rationale: Conserva a força física do campo lexical de bater ou golpear e forma uma expressão portuguesa natural.
- source_word: mastigati
  choice: açoites
  rationale: Mantém o sentido específico e violento de flagelação, sem suavizá-lo para um termo abstrato.
- source_word: inducet
  choice: fará vir
  rationale: Reproduz a ideia causativa de trazer ou fazer sobrevir a praga.
theological_decisions:
- issue: Agente do juízo
  choice: «que o Senhor fará vir»
  alternative: «que virá da parte do Senhor»
  rationale: Mantém a afirmação explícita do texto latino de que o Senhor introduz a calamidade, sem atenuar a tensão teológica.
- issue: Referente do pronome final
  choice: «sobre ele»
  alternative: «sobre eles»
  rationale: Toma o Egito como referente coletivo principal, em consonância com a leitura da camada inglesa; os alicerces pertencem a esse referente personificado.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. A personificação do Egito e de seus alicerces foi preservada.
