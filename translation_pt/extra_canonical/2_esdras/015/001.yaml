  text: Eis, fala aos ouvidos do meu povo as palavras da profecia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  choice: Eis que
  rationale: Preserva a partícula latina de chamada de atenção em formulação bíblica ainda clara no português moderno.
- source_word: loquere
  choice: fala
  rationale: Traduz diretamente o imperativo singular presente, com naturalidade e dignidade.
- source_word: in aures plebi meae
  choice: aos ouvidos do meu povo
  rationale: Mantém a imagem concreta do latim sem recorrer à construção menos natural 'na audição de'.
- source_word: sermones prophetiae
  choice: as palavras da profecia
  rationale: Conserva a relação genitiva e evita especificar se são palavras proféticas em geral ou o conteúdo de uma profecia determinada.
theological_decisions:
- issue: Sentido de 'prophetiae'
  choice: da profecia
  alternative: proféticas
  rationale: A tradução mantém o substantivo e sua possível amplitude, sem converter silenciosamente o genitivo em adjetivo nem determinar a natureza exata da profecia.
translation_notes:
  register: Português moderno, solene e acessível. A expressão 'aos ouvidos' preserva a metáfora do texto-fonte e é idiomática em contexto bíblico.
