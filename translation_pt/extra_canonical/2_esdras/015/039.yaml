  text: And the winds from the east will grow strong and shut it in[a], along with the cloud that he raised up in wrath; and the star appointed to bring destruction will be violently assailed by the east wind, the south wind[b], and the west wind.
translation:
  language: pt
  text: E os ventos do leste ganharão força e o encerrarão[a], junto com a nuvem que ele levantou em sua ira; e a estrela destinada a causar destruição será violentamente atacada pelo vento do leste, pelo vento do sul[b] e pelo vento do oeste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Este versículo contém uma das passagens latinas mais difíceis do capítulo. A tradução procura refletir uma leitura em que forças cósmicas são encerradas e atacadas, mas a sintaxe e os referentes são incertos.
    reason: textual_variant
  - marker: b
    text: 'Ou: “e a nuvem que ele levantou em sua ira, e a estrela destinada a causar destruição para o leste e o oeste, serão lançadas em confusão”.'
    reason: previous_rendering
lexical_decisions:
- source_word: superinvalescent
  choice: ganharão força
  rationale: Expressa de modo natural o futuro intensivo do verbo latino, indicando que os ventos se tornarão poderosos.
- source_word: recludent
  choice: encerrarão
  rationale: Segue o sentido contextual de fechar ou confinar, embora o verbo e seu referente pertençam a uma passagem latina difícil.
- source_word: sidus
  choice: estrela
  rationale: Equivalente corrente e adequado ao cenário cósmico do versículo.
- source_word: ad faciendam exteritionem
  choice: destinada a causar destruição
  rationale: Reproduz a ideia de finalidade ou incumbência da construção latina sem tornar a frase artificial em português.
- source_word: violabitur
  choice: será violentamente açoitada
  rationale: Comunica a força passiva de sofrer ataque ou violência, cabendo aos ventos a função de agentes.
- source_word: orientalem notum et occidentem
  choice: vento leste, vento sul e vento oeste
  rationale: Entende os três termos como designações dos ventos oriental, meridional e ocidental; explicita 'vento' para clareza em português.
theological_decisions:
- issue: Referentes e sintaxe na descrição das forças cósmicas
  choice: Manter o pronome sem identificar seu referente e apresentar a nuvem como elemento também encerrado
  alternative: Reestruturar a nuvem e a estrela como sujeitos da oração final
  rationale: O latim traz eum e nubem como objetos de recludent, mas o antecedente de eum é incerto. A tradução preserva essa incerteza sem acrescentar uma identificação teológica.
- issue: Agentes que atacam a estrela
  choice: Interpretar leste, sul e oeste como ventos que açoitam a estrela
  alternative: Entender a frase como destruição dirigida ao leste e ao oeste ou como uma enumeração em desordem
  rationale: A construção passiva violabitur e a preposição ab favorecem a leitura de agência ou origem, e notum designa o vento sul.
translation_notes:
  register: Português moderno, digno e acessível, com imagens cósmicas preservadas. A formulação evita esclarecer indevidamente os referentes obscuros do latim e usa repetição de “vento” para tornar inteligível a enumeração dos pontos cardeais.
