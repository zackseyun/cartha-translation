  text: but I will lead them out with a mighty hand and an uplifted arm, and I will strike Egypt with plagues as before, and I will destroy all its land.
translation:
  language: pt
  text: Mas eu o farei sair com mão poderosa e braço erguido; ferirei o Egito com uma praga, como antes, e destruirei toda a sua terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: educam eum
  choice: eu os tirarei de lá
  rationale: Embora o latim preservado traga literalmente o singular «eu o conduzirei para fora», o referente contextual é coletivo, como indica a camada inglesa auditada. O plural natural em português comunica esse sentido, e «de lá» explicita apenas o valor de saída presente em educam.
- source_word: in manu potenti et brachio excelso
  choice: com mão poderosa e braço erguido
  rationale: Mantém as imagens tradicionais de poder e libertação, com formulação clara e digna em português.
- source_word: plaga
  choice: pragas
  rationale: O singular latino pode designar coletivamente o castigo ou a série de golpes; o plural remete naturalmente às pragas do êxodo e corresponde ao sentido contextual «como antes».
- source_word: corrumpam
  choice: destruirei
  rationale: Neste contexto de juízo sobre toda a terra do Egito, «destruirei» expressa com clareza a força de corrumpam, sem a possível ambiguidade moral de «corromperei».
theological_decisions:
- issue: Referente singular ou coletivo em «educam eum»
  choice: eu os tirarei de lá
  alternative: eu o tirarei de lá
  rationale: O texto latino traz pronome singular, mas o contexto recebido entende como coletivo o povo libertado. A tradução segue esse referente contextual e evita sugerir, sem base suficiente, um único indivíduo.
- issue: Número de «plaga»
  choice: com pragas
  alternative: com uma praga
  rationale: O singular latino admite valor coletivo, e a comparação «como antes» aponta para os múltiplos golpes contra o Egito. O plural preserva melhor essa alusão sem acrescentar conteúdo estranho ao contexto.
translation_notes:
  register: Português moderno, internacional e de fácil leitura no Brasil. A redação conserva o paralelismo solene de mão e braço, evita arcaísmos desnecessários e mantém o tom profético de juízo.
