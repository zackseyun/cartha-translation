    issue: «males» é pouco idiomático neste contexto
    rationale: Embora etimologicamente possível, «males» soa rígido e menos natural na enumeração portuguesa. «Calamidades» comunica o valor abrangente de mala como desastres de juízo e prepara naturalmente a lista subsequente.
