  yaml_path: translation/extra_canonical/2_esdras/015/049.yaml
  text: 'I will send evils upon you: widowhood and poverty and famine and sword and pestilence[a], to lay waste your houses, for violation'
translation:
  language: pt
  text: 'Deus: “Enviarei calamidades sobre você: viuvez, pobreza, fome, espada e peste, para devastar as suas casas, para a violação[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para a profanação”. O sentido exato de “violação” e sua ligação com a continuação da frase são incertos.'
    reason: O latim ad uiolationem é uma segunda expressão de finalidade paralela a ad deuastandas domus tuas. Uiolatio pode indicar violação, profanação ou dano, e o fragmento termina no meio do período.
lexical_decisions:
- source_word: Inmittam tibi mala
  choice: Enviarei males sobre você
  rationale: Expressa de modo natural a ação futura e o sentido adversativo do dativo latino tibi.
- source_word: uiduitatem
  choice: viuvez
  rationale: Equivalente direto do substantivo latino, preservando a ideia de perda do cônjuge.
- source_word: gladium
  choice: espada
  rationale: Mantém a imagem concreta da espada como calamidade ligada à guerra e à violência.
- source_word: pestem
  choice: peste
  rationale: Equivalente corrente e digno para doença epidêmica devastadora.
- source_word: ad deuastandas domus tuas
  choice: para devastar as suas casas
  rationale: Preserva a construção final latina e o plural domus.
- source_word: ad uiolationem
  choice: para a violação
  rationale: Mantém a segunda expressão de finalidade paralela introduzida por ad e evita convertê-la em expressão de modo.
theological_decisions:
- issue: Agente da declaração de juízo
  choice: 'Deus diz: “Enviarei”'
  alternative: “Enviarei” sem identificação explícita do falante
  rationale: O fragmento fornecido contém deus antes da fala; a formulação identifica o falante sem acrescentar interpretação doutrinária.
- issue: Sentido de uiolatio
  choice: violação
  alternative: ruína
  rationale: “Violação” corresponde mais diretamente ao latim e preserva sua amplitude e sua possível ligação sintática com a continuação do período.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A enumeração solene e as duas expressões de finalidade do latim foram preservadas; o término abrupto reflete o fragmento fornecido.
