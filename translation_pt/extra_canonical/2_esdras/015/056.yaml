source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut facies electis meis, dicit Dominus, sic faciet tibi Deus et tradet te in malis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/056.yaml
  text: As you do to my chosen ones[a], says the Lord, so God will do to you and will hand you over to evils.
translation:
  language: pt
  text: Assim como você fizer aos meus escolhidos, diz o Senhor, assim Deus fará a você e o entregará aos males.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut facies ... sic faciet
  choice: Assim como você fizer... assim... fará
  rationale: Preserva a estrutura comparativa e retributiva do latim, bem como o valor futuro de facies e faciet.
- source_word: electis meis
  choice: meus escolhidos
  rationale: Equivalente direto e natural para o dativo plural, entendido como as pessoas escolhidas por Deus.
- source_word: tradet te
  choice: o entregará
  rationale: Mantém o sentido de pôr o destinatário sob o poder ou domínio dos males.
- source_word: in malis
  choice: a males
  rationale: Preserva a expressão plural e relativamente aberta do latim, sem restringi-la a uma calamidade específica.
theological_decisions:
- issue: Alternância entre 'o Senhor' e 'Deus'
  choice: Preservar ambos os títulos tal como aparecem no texto latino
  alternative: Uniformizar os dois como 'o Senhor' ou 'Deus'
  rationale: A alternância pertence à fonte e não deve ser eliminada, embora ambos se refiram ao agente divino.
- issue: Natureza dos 'males'
  choice: Manter o plural genérico 'males'
  alternative: Interpretar como 'desgraças', 'calamidades' ou 'sofrimentos'
  rationale: O latim malis é semanticamente amplo; a tradução conserva essa tensão sem definir se se trata de calamidades, condições adversas ou males em sentido mais abrangente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com colocação pronominal adequada à leitura brasileira. O singular 'você' explicita o destinatário singular indicado por te/tibi, sem acrescentar identificação ausente no versículo.
