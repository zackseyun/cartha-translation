  yaml_path: translation/extra_canonical/2_esdras/015/053.yaml
  text: says the Lord[a], "If you had not killed my chosen ones all along, exulting with the striking of your hands and speaking over their death
translation:
  language: pt
  text: 'diz o Senhor: “Se você não tivesse matado os meus escolhidos o tempo todo, exultando ao bater palmas e falando sobre a morte deles'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omni tempore
  choice: o tempo todo
  rationale: Expressa a ação contínua ou reiterada de maneira natural em português, sem ampliar o sentido para uma afirmação absoluta além do contexto.
- source_word: exultans percussione manuum
  choice: exultando ao bater palmas
  rationale: No contexto de celebração maliciosa, percussio manuum indica o gesto de bater palmas; esta formulação preserva tanto o júbilo hostil quanto a imagem das mãos.
- source_word: electos meos
  choice: os meus escolhidos
  rationale: Tradução direta e não denominacional de electos, preservando a ideia de pessoas escolhidas pelo Senhor.
- source_word: dicens super mortem eorum
  choice: falando sobre a morte deles
  rationale: Mantém a amplitude de super e não especifica indevidamente se as palavras eram de escárnio, triunfo ou acusação.
theological_decisions:
- issue: Construção condicional incompleta com nisi
  choice: “Se você não tivesse matado...”
  alternative: “Se você não tivesse matado...?”
  rationale: O período continua no versículo seguinte; mantém-se a oração condicional aberta, sem importar para este versículo a pergunta nem as palavras de 15:54.
translation_notes:
  register: Português moderno, digno e acessível. A sintaxe fica deliberadamente incompleta no fim do versículo porque a frase prossegue no versículo seguinte; por isso, a citação não é encerrada aqui.
