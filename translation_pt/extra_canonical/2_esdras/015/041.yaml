    issue: “rios” para rivi
    rationale: O latim rivus normalmente se refere a um riacho, regato ou curso de água menor, não ao termo mais amplo e normalmente maior “rio”. A tradução deve preservar essa escala.
  - severity: low
    issue: “águas abundantes” para aquas multas
    rationale: Embora aceitável, “muitas águas” corresponde mais diretamente à formulação latina e permite que plenitudine retenha sua própria força lexical na oração seguinte.
  revised_text: fogo, granizo, espadas voadoras[a] e muitas águas, para que até todos os campos e todos os riachos se encham pela plenitude daquelas águas.
