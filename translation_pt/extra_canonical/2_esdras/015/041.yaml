base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/041.yaml
  text: fire and hail and flying swords and many waters[b][a], so that even all the fields and all the rivers will be filled from the abundance of those waters.
translation:
  language: pt
  text: fogo, granizo, espadas voadoras[a] e muitas águas, para que até todos os campos e todos os riachos se encham pela plenitude daquelas águas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “grandes espadas voadoras”.'
    reason: Romphaea pode referir-se mais especificamente a uma espada grande, embora “espadas” seja a tradução mais natural no contexto apocalíptico.
lexical_decisions:
- source_word: rompheas volantes
  choice: espadas voadoras
  rationale: No latim bíblico e apocalíptico, romphaea pode designar uma espada grande, mas aqui funciona naturalmente como termo geral para uma arma de juízo; “espadas voadoras” preserva a imagem sem introduzir tecnicismo indevido.
- source_word: aquas multas
  choice: águas abundantes
  rationale: A expressão indica grande quantidade de água; “águas abundantes” é natural em português e prepara a referência subsequente à sua abundância.
- source_word: ut etiam impleantur
  choice: de modo que até ... fiquem cheios
  rationale: “De modo que” expressa o resultado introduzido por ut, e “até” preserva a ênfase explícita de etiam.
- source_word: a plenitudine aquarum illarum
  choice: pela abundância daquelas águas
  rationale: Mantém tanto a ideia causal/instrumental de a quanto a referência demonstrativa de illarum.
