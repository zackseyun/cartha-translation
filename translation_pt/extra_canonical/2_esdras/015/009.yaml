source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: vindicans vindicabo illos, dicit Dominus, et accipiam omnem sanguinem innocuum ex illis ad me.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/009.yaml
  text: I will surely avenge them[a], says the Lord, and I will require from them all innocent blood for myself.
translation:
  language: pt
  text: Eu certamente os vingarei[a], diz o Senhor, e exigirei deles, para mim, todo o sangue inocente.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Ao vingá-los, eu os vingarei».'
    reason: Registra a forma mais literal da construção enfática latina «vindicans vindicabo».
lexical_decisions:
- source_word: vindicans vindicabo
  choice: certamente os vingarei
  rationale: A construção cognata intensifica o verbo; em português atual, «certamente» transmite essa ênfase sem a redundância pouco natural de uma reprodução palavra por palavra.
- source_word: accipiam ... ex illis ad me
  choice: exigirei deles, para mim
  rationale: Expressa a ideia de tomar ou reclamar deles em favor do próprio Senhor, mantendo o caráter judicial da declaração sem ampliar o texto.
- source_word: omnem sanguinem innocuum
  choice: todo o sangue inocente
  rationale: Preserva a formulação concreta do latim e sua referência ao sangue de inocentes, sem substituir a imagem por uma explicação interpretativa.
theological_decisions:
- issue: Sentido judicial de Deus exigir o sangue inocente
  choice: exigirei deles, para mim, todo o sangue inocente
  alternative: tomarei deles para mim todo o sangue inocente
  rationale: «Exigirei» comunica melhor em português a cobrança judicial implícita, enquanto «para mim» conserva a afirmação de que o Senhor reclama esse sangue em causa própria; evita-se explicar além do que o texto diz como essa exigência será executada.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira. A ordem «deles, para mim» foi pontuada para distinguir a fonte da cobrança de seu destinatário e preservar os dois complementos do latim.
