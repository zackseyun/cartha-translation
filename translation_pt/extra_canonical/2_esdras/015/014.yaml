  rationale: Fórmula portuguesa natural e solene para uma declaração profética de desgraça.
- source_word: qui habitant in eum
  choice: dos que nele habitam
  rationale: Reproduz de modo direto a referência aos habitantes do mundo e mantém o pronome masculino exigido por «mundo».
theological_decisions:
- issue: Sentido escatológico ou espacial de saeculum
  choice: mundo
  alternative: era
  rationale: O verbo «habitam» aponta fortemente para um domínio espacial; a alternativa lexical genuína é preservada em nota, sem impor uma leitura teológica específica.
