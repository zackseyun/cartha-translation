source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuis qui te cupierunt semper. Fornicarian odibilem imitata es in omnibus operibus eius et adinuentionibus eius; propterea dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/048.yaml
  text: 'You have imitated that hateful prostitute in all her works and devices; therefore God says:'
translation:
  language: pt
  text: Você imitou aquela prostituta odiosa em todas as obras e maquinações dela; por isso, ele diz:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino diz literalmente “por isso, ele diz”, sem identificar aqui quem fala; pelo contexto, pode tratar-se de Deus.
    reason: A camada inglesa explicita “God”, mas essa palavra não aparece no segmento latino fornecido. A nota preserva a diferença textual e a ambiguidade formal.
lexical_decisions:
- source_word: Fornicarian odibilem
  choice: aquela prostituta odiosa
  rationale: “Prostituta” expressa de modo natural e direto o substantivo latino, enquanto “odiosa” preserva a forte avaliação do original. “Aquela” representa o valor demonstrativo sugerido pelo acusativo definido no contexto e acompanha a formulação da camada de consulta.
- source_word: imitata es
  choice: Você imitou
  rationale: Mantém a segunda pessoa do singular e o aspecto perfeito da forma latina em linguagem portuguesa atual.
- source_word: in omnibus operibus eius
  choice: em todas as obras ... dela
  rationale: Reproduz a abrangência de “omnibus” e conserva a referência feminina inequívoca de “eius”.
- source_word: adinuentionibus eius
  choice: maquinações dela
  rationale: No contexto condenatório, “maquinações” comunica planos ou expedientes concebidos maliciosamente, sem o sentido moderno geralmente positivo de “invenções”.
- source_word: propterea dicit
  choice: por isso, ele diz
  rationale: Preserva a ligação causal e o presente verbal. O pronome explicita apenas o sujeito gramatical exigido pelo português corrente, sem identificá-lo além do que consta no trecho latino fornecido.
theological_decisions:
- issue: Identidade do sujeito de “dicit”
  choice: ele diz
  alternative: Deus diz
  rationale: O texto latino fornecido não contém “Deus”; portanto, a tradução evita acrescentar explicitamente essa identificação, embora o contexto possa apontar para Deus como aquele que fala.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. O fragmento inicial “tuis qui te cupierunt semper” foi tratado como remanescente do versículo anterior, pois é sintaticamente independente do início “Fornicarian odibilem imitata es” e não consta na unidade inglesa auditada.
