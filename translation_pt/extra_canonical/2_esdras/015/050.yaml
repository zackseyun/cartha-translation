  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gloria uirtutis tuae
  choice: a glória da sua força
  rationale: Preserva a construção genitiva e o sentido amplo de uirtus como força ou poder, sem introduzir uma interpretação moral como “virtude”.
- source_word: sicut flos siccabitur
  choice: murchará como uma flor
  rationale: No contexto da imagem floral, “murchará” expressa naturalmente siccabitur (“secará”) em português atual.
- source_word: cum
  choice: quando
  rationale: Mantém a oração temporal incompleta no limite deste versículo, como no texto latino fornecido.
theological_decisions:
- issue: Referente da segunda pessoa do singular
  choice: sua
  alternative: tua
  rationale: O português moderno de ampla legibilidade brasileira favorece “sua”; o contexto mantém o destinatário singular sem acrescentar identificação teológica.
translation_notes:
  register: Registro atual, digno e acessível. O fragmento começa no meio de uma frase e termina com uma oração temporal incompleta; ambas as características foram preservadas. A nota inglesa sobre o calor não pertence ao texto latino fornecido deste versículo e, por isso, não foi incluída.
