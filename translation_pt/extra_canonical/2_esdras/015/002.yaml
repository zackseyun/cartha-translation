lexical_decisions:
- source_word: inmisero in os tuum
  choice: porei em sua boca
  rationale: Expressa naturalmente a imagem latina de Deus colocar as palavras na boca do destinatário, preservando a primeira pessoa e o futuro.
- source_word: carta
  choice: rolo
  rationale: No contexto antigo, o latim carta designa o suporte de escrita; “rolo” comunica com clareza o objeto material provável, em consonância com a camada inglesa auditada.
theological_decisions:
- issue: Referente implícito de quos e do objeto de escrever
  choice: que ... sejam escritos
  alternative: as palavras que ... e faça com que sejam escritas
  rationale: Mantém a dependência sintática do versículo anterior e não acrescenta no corpo do texto um substantivo ausente neste fragmento latino; a forma masculina plural acompanha o antecedente esperado no contexto.
translation_notes:
  register: Português moderno, digno e acessível. Mantém-se a forma de tratamento “sua” por legibilidade brasileira ampla. O trecho é sintaticamente dependente do versículo anterior, como no latim.
