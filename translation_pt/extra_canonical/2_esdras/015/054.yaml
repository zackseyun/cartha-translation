base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/054.yaml
  text: When were you made drunk? Adorn the beauty of your face! The wages of a harlot are in your bosom[a]; therefore you will receive repayment.
translation:
  language: pt
  text: Quando você ficou embriagada? Adorne a beleza do seu rosto! A paga de prostituta está em seu colo[a]; por isso, você receberá a retribuição.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “em seu seio”.
    reason: O latim sinus pode designar o colo ou regaço, as dobras da roupa e também o seio; o contexto não determina uma única imagem anatômica ou vestimentária.
lexical_decisions:
- source_word: inebriata es
  choice: você se embriagou
  rationale: Reproduz a forma feminina e a pergunta dirigida à cidade personificada, em linguagem portuguesa natural.
- source_word: Exorna speciem uultus tui
  choice: Enfeite a beleza do seu rosto
  rationale: Mantém tanto a ordem imperativa quanto a referência explícita à aparência ou beleza do rosto, sem simplificar a expressão latina.
- source_word: Merces fornicariae
  choice: A paga de prostituta
  rationale: O genitivo singular fornicariae aponta mais diretamente para a paga pertencente a uma prostituta do que para a noção abstrata de prostituição, preservando a personificação.
- source_word: in sinus tuos
  choice: está em seu colo
  rationale: Colo expressa de modo corrente a região formada pelas dobras da roupa ou pelo regaço, sentido possível de sinus neste contexto de pagamento recebido.
- source_word: redditionem recipies
  choice: você receberá a retribuição
  rationale: Preserva a repetição conceitual de dar de volta e receber, bem como o tom judicial de recompensa ou paga correspondente.
theological_decisions:
- issue: Personificação feminina da cidade como prostituta
  choice: Manter as formas femininas e a expressão concreta “paga de prostituta”
  alternative: 'Tornar a linguagem abstrata: “a paga da prostituição”'
  rationale: O latim trata a destinatária como figura feminina concreta; a tradução não deve apagar essa imagem profética nem transformá-la em doutrina mais específica.
translation_notes:
  register: Português moderno, digno e direto, com legibilidade brasileira e vocabulário amplamente compreensível. A formulação conserva a aspereza retórica e a personificação feminina do latim.
