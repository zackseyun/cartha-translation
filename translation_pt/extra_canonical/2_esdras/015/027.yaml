id: 2ES.15.27
reference: 2 Esdras 15:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam enim venerunt super orbem terrarum mala, et manebitis in illis; non enim liberabit vos Deus, propter quod peccastis in eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/027.yaml
  text: For already evils have come upon the world, and you will remain in them; for God will not deliver you, because you have sinned against him.
translation:
  language: pt
  text: Pois os males já vieram sobre o mundo, e vocês permanecerão no meio deles; porque Deus não os livrará, visto que vocês pecaram contra ele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mala
  choice: os males
  rationale: Mantém o sentido amplo do plural latino, sem restringi-lo a calamidades, sofrimentos ou atos maus.
- source_word: orbem terrarum
  choice: o mundo
  rationale: Expressão natural em português para a totalidade da terra habitada.
- source_word: manebitis in illis
  choice: vocês permanecerão no meio deles
  rationale: Conserva a ideia de continuar sob ou dentro desses males, evitando sugerir que os destinatários os praticarão.
- source_word: liberabit
  choice: livrará
  rationale: Expressa resgate ou libertação do perigo e corresponde naturalmente ao contexto.
- source_word: propter quod
  choice: visto que
  rationale: Representa a relação causal explícita do latim em linguagem corrente e digna.
theological_decisions:
- issue: Relação entre pecado e ausência de livramento
  choice: 'Preservar a afirmação causal direta: Deus não os livrará, visto que pecaram contra ele.'
  alternative: Atenuar a causalidade, tratando o pecado apenas como circunstância.
  rationale: O texto latino estabelece explicitamente a causa com «propter quod»; a tradução não deve suavizar essa tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com «vocês» para o plural e construção direta. «No meio deles» esclarece o referente de «neles» sem eliminar a imagem de permanência entre os males.
