base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/013.yaml
  text: Let those who cultivate the land mourn, because their seed will fail, and their trees will be laid waste by blight and hail and by a dreadful star.
translation:
  language: pt
  text: Lamentem os que cultivam a terra, pois suas sementes falharão, e suas árvores serão devastadas pela ferrugem, pelo granizo e por um astro terrível.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cultores operantes terram
  choice: os que cultivam a terra
  rationale: Reproduz de modo natural e próximo ao latim a ideia daqueles que trabalham cultivando o solo, sem restringir o referente a uma categoria profissional moderna.
- source_word: semina
  choice: sementes
  rationale: Mantém o sentido agrícola concreto e o plural do texto latino.
- source_word: uredine
  choice: ferrugem
  rationale: Termo agrícola corrente para a doença vegetal designada pelo latim uredo, adequado ao contexto de devastação das árvores.
- source_word: sidus terribile
  choice: astro terrível
  rationale: Preserva a amplitude de sidus, que pode designar estrela ou corpo celeste, sem especificar além do texto.
theological_decisions:
- issue: Natureza do sidus terribile
  choice: astro terrível
  alternative: estrela terrível
  rationale: O latim permite uma referência celeste mais ampla; 'astro' conserva essa indeterminação e evita identificar o fenômeno com uma estrela em sentido estrito.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formulação próxima à estrutura e às imagens agrícolas do latim. O subjuntivo exortativo 'Lamentem' traduz lugeant com clareza.
