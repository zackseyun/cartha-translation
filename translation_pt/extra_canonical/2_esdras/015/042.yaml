  text: And they will tear down cities and walls, mountains and hills, trees of the forests and grass of the meadows.
translation:
  language: pt
  text: E destruirão cidades e muralhas, montes e colinas, árvores das florestas e o feno.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demolient
  choice: destruirão
  rationale: Expressa de modo natural e abrangente a demolição ou devastação de todos os elementos enumerados.
- source_word: ligna siluarum
  choice: árvores das florestas
  rationale: Neste contexto de devastação da paisagem, ligna designa as árvores ou a vegetação lenhosa das florestas, não apenas madeira já cortada.
- source_word: fena
  choice: o feno
  rationale: Traduz diretamente o plural neutro latino de fenum, que pode designar feno ou capim ceifável; evita acrescentar 'dos campos', ausente do texto latino fornecido.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e solene. A enumeração compacta do latim foi preservada. O fragmento inicial “campi et omnes ruii plenitudine aquarum illarum” parece concluir a frase do versículo anterior e, em consonância com a segmentação da consulta inglesa, não foi incluído neste versículo.
