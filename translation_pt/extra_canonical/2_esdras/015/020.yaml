id: 2ES.15.20
reference: 2 Esdras 15:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce ego convoco, dicit Deus, omnes reges terrae ad movendum, qui sunt a borea et a noto et ab euro et a libano, ad convertendos in se et reddere quae dederunt illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/020.yaml
  text: Behold[a], I am summoning, says God, all the kings of the earth to stir up, those who are from the north and the south and the east and Lebanon, to turn against one another and repay what they gave them.
translation:
  language: pt
  text: “Eis que eu convoco”, diz Deus, “todos os reis da terra para se mobilizarem — os que vêm do norte, do sul, do leste e do Líbano[a] —, para que se voltem uns contra os outros e retribuam o que lhes deram.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim preservado diz “do Líbano”. Alguns entendem que a leitura original seria “do sudoeste”, completando a enumeração dos quatro ventos ou direções.
    reason: Registra uma provável dificuldade de transmissão textual sem substituir silenciosamente a leitura da edição latina fornecida.
lexical_decisions:
- source_word: ecce
  choice: Eis que
  rationale: Preserva o marcador enfático e solene do latim em linguagem bíblica ainda compreensível.
- source_word: convoco
  choice: eu convoco
  rationale: Mantém o presente e a ênfase explícita no agente divino.
- source_word: ad movendum
  choice: para se mobilizarem
  rationale: Expressa naturalmente a ideia de serem postos em movimento ou incitados, sem especificar além do que o contexto permite.
- source_word: a borea et a noto et ab euro
  choice: do norte, do sul, do leste
  rationale: Traduz os nomes dos ventos por suas direções correspondentes, tornando clara a enumeração geográfica.
- source_word: a libano
  choice: do Líbano
  rationale: Segue o texto latino fornecido; a provável variante ou corrupção textual que pode indicar o sudoeste é registrada em nota.
- source_word: ad convertendos in se
  choice: para que se voltem uns contra os outros
  rationale: Verte o sentido recíproco de in se de modo idiomático e preserva a hostilidade sugerida pelo contexto.
- source_word: reddere quae dederunt illis
  choice: retribuam o que lhes deram
  rationale: Preserva a formulação de reciprocidade e a referência pronominal pouco explícita do latim, sem identificar indevidamente quem são os beneficiários ou alvos.
theological_decisions:
- issue: Agência divina e ação dos reis
  choice: Deus convoca os reis, que então se mobilizam e se voltam uns contra os outros
  alternative: Deus move diretamente os reis ou os faz voltar-se uns contra os outros
  rationale: A construção latina liga a convocação a formas finais, mas não define com precisão o mecanismo da ação; a tradução mantém a soberania da convocação e a atuação dos reis sem elaborar uma doutrina de causalidade.
- issue: Referente de illis em quae dederunt illis
  choice: manter o pronome implícito em “lhes”
  alternative: explicitar “aos outros reis”, “aos povos” ou “a eles”
  rationale: O referente não é inequívoco no versículo latino. A forma portuguesa conserva essa abertura em vez de impor uma identificação interpretativa.
translation_notes:
  register: Português moderno, claro e digno, com cadência profética. “Eis que” conserva a solenidade do anúncio; “mobilizarem” evita a rigidez de uma tradução literal do gerúndio latino. Travessões delimitam a descrição dos reis e facilitam a leitura da longa construção.
