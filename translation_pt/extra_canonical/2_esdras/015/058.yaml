  text: and drink their own blood because of hunger for bread and thirst for water[a]. Unhappy one, as the foremost you will come[b], and again you will receive evils.
translation:
  language: pt
  text: e beberão o próprio sangue por causa da fome de pão e da sede de água. Infeliz! Você virá como a principal[a][b] e novamente receberá males.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim primaria indica aquela que ocupa o primeiro lugar ou uma posição de destaque. Aqui, provavelmente ironiza a antiga proeminência da Ásia, mas a nuance exata é incerta.
    reason: lexical_alternative
  - marker: b
    text: 'Outra tradução possível: «como a primeira»; tradicionalmente, também se tem traduzido «como a principal entre as mulheres».'
