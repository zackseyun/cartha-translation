lexical_decisions:
- source_word: a fame panis et siti aquae
  choice: por causa da fome de pão e da sede de água
  rationale: Reproduz a construção causal latina e mantém o paralelismo entre fome/pão e sede/água em português natural.
- source_word: Infelix
  choice: Infeliz de você!
  rationale: O adjetivo funciona como exclamação de desgraça dirigida à Ásia personificada; esta formulação é clara e idiomática sem enfraquecer o tom profético.
- source_word: primaria
  choice: como a principal
  rationale: O feminino concorda com a Ásia personificada, e «principal» preserva a ideia de primazia ou posição elevada sem acrescentar explicitamente «entre as mulheres».
- source_word: mala
  choice: males
  rationale: Mantém a amplitude do substantivo latino, que pode abranger calamidades, desgraças ou sofrimentos.
