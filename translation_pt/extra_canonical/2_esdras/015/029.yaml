source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exient nationes draconum Arabum in curris multis, et sibilatus eorum a die itinerisfertur super terram, ut etiam timeant et trepidentur omnes qui illos audient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/029.yaml
  text: And nations of Arabian dragons will come out with many chariots[a], and their hissing is carried over the earth from a day's journey away[b], so that all who hear them will fear and tremble.
translation:
  language: pt
  text: E sairão nações de dragões árabes, em muitos carros[a], e o seu silvo será levado pela terra, de uma distância de um dia de viagem[b], de modo que todos os que os ouvirem terão medo e tremerão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “nações de dragões árabes” segue de perto o difícil latim nationes draconum Arabum. A imagem pode ser simbólica, monstruosa ou etnográfica, de uma maneira que já não pode ser plenamente recuperada apenas do latim.
    reason: textual_variant
  - marker: b
    text: Isto é, o silvo podia ser ouvido à distância correspondente a um dia de viagem.
    reason: previous_rendering
lexical_decisions:
- source_word: nationes draconum Arabum
  choice: nações de dragões árabes
  rationale: Segue de perto a difícil expressão latina e preserva sua ambiguidade, sem decidir se a imagem é simbólica, monstruosa ou etnográfica.
- source_word: in curris multis
  choice: em muitos carros
  rationale: Traduz literalmente curris como carros, no sentido antigo de veículos ou carros de guerra, sem especificar além do latim.
- source_word: sibilatus eorum
  choice: seu silvo
  rationale: Silvo reproduz a imagem sonora de sibilatus e combina naturalmente com a menção de dragões.
- source_word: a die itineris
  choice: à distância de um dia de viagem
  rationale: Entende dies itineris como medida de distância e a como indicação de afastamento, em conformidade com o uso latino e a revisão mais recente.
- source_word: timeant et trepidentur
  choice: terão medo e tremerão
  rationale: Mantém os dois verbos de temor, com formulação natural em português.
theological_decisions:
- issue: Identidade das “nações de dragões árabes”
  choice: Preservar literalmente a imagem ambígua
  alternative: Interpretar como povos árabes, criaturas monstruosas ou símbolo militar
  rationale: O latim sozinho não permite resolver com segurança a natureza da expressão; explicitá-la no texto importaria uma interpretação não demonstrável.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A sintaxe preserva o tom profético e a estranheza genuína da imagem latina; “carros” permanece deliberadamente não especificado.
