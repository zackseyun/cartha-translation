  text: And those who see that wrath will shudder[a], and trembling will seize them. And after this, abundant storm-clouds will be stirred up.
translation:
  language: pt
  text: E os que virem aquela ira ficarão horrorizados,[a] e o tremor se apoderará deles. E, depois disso, numerosas nuvens de tempestade serão agitadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E haverá grande medo e tremor sobre a terra, e os que virem aquela ira ficarão horrorizados, e o tremor se apoderará deles. Depois disso, numerosas nuvens de tempestade serão agitadas”.'
    reason: Registra a tradução anterior, que incluía no início palavras pertencentes ao final do versículo 36.
lexical_decisions:
- source_word: horrebunt
  choice: ficarão horrorizados
  rationale: Expressa a reação intensa de pavor indicada pelo latim, em linguagem portuguesa natural, sem reduzir o verbo a mero espanto.
- source_word: iram illam
  choice: aquela ira
  rationale: Mantém o demonstrativo e o sentido direto de ira.
- source_word: tremor adprehendet illos
  choice: o tremor se apoderará deles
  rationale: Reproduz a imagem de algo que os alcança e domina, com formulação idiomática em português.
- source_word: nimbi copiosi
  choice: densas nuvens de tempestade
  rationale: Nimbi indica nuvens carregadas ou de tempestade, e copiosi sugere grande quantidade ou densidade; a escolha evita confundir o termo com 'poderosas'.
- source_word: movebuntur
  choice: serão agitadas
  rationale: Preserva a voz passiva e o sentido de movimento ou agitação sem especificar um agente ausente no texto.
