id: 2ES.7.28
reference: 2 Esdras 7:28
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: revelabitur enim Filius meus Iesus cum his qui cum eo, et iucundabit qui relicti sunt annis quadringentis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/028.yaml
  text: For my son Jesus will be revealed with those who are with him[a][b], and he will make glad those who remain for four hundred years.
translation:
  language: pt
  text: Pois meu Filho Jesus[b] será revelado com os que estão com ele, e, durante quatrocentos anos, alegrará os que restarem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A posição da expressão latina também permite entender: “e alegrará os que permanecerem por quatrocentos anos”.'
    reason: ambiguity
  - marker: b
    text: 'O latim apresenta uma formulação marcadamente distinta nestes dois versículos: 7:28 diz filius meus Iesus (“meu Filho Jesus”), enquanto 7:29 diz filius meus Christus (“meu Filho, o Messias”). A passagem descreve um período de quatrocentos anos, seguido da morte do Messias, de sete dias de silêncio primordial e, depois, da ressurreição — uma das passagens messiânicas mais notáveis da antiga literatura apocalíptica judaica.'
    reason: messianic_passage
lexical_decisions:
- source_word: revelabitur
  choice: será revelado
  rationale: Mantém a voz passiva e o caráter apocalíptico do verbo latino.
- source_word: Filius meus Iesus
  choice: meu Filho Jesus
  rationale: Reproduz diretamente a expressão latina, inclusive o nome próprio específico deste versículo.
- source_word: cum his qui cum eo
  choice: com os que estão com ele
  rationale: Supre naturalmente em português o verbo elíptico no latim sem especificar quem são essas pessoas.
- source_word: iucundabit
  choice: alegrará
  rationale: Expressa de modo corrente o sentido causativo de proporcionar alegria.
- source_word: qui relicti sunt
  choice: os que restarem
  rationale: Conserva o sentido escatológico dos que forem deixados ou permanecerem, sem introduzir uma identificação teológica adicional.
- source_word: annis quadringentis
  choice: durante quatrocentos anos
  rationale: Entende o ablativo como duração temporal ligada à ação de alegrar, mas registra em nota a possível ligação com os que permanecem.
theological_decisions:
- issue: Identificação messiânica explícita em «Filius meus Iesus»
  choice: meu Filho Jesus
  alternative: meu Filho, o Messias
  rationale: O texto latino deste versículo diz explicitamente Iesus; substituí-lo por «Messias» apagaria a variação textual marcante em relação ao versículo seguinte.
- issue: Referente de «os que estão com ele»
  choice: manter a expressão indefinida
  alternative: identificá-los como santos, anjos ou seguidores
  rationale: O latim não identifica o grupo, portanto a tradução preserva essa abertura.
- issue: Âmbito temporal dos quatrocentos anos
  choice: ligar a duração à ação de alegrar
  alternative: ligá-la à permanência dos que restarem
  rationale: O ablativo de duração favorece a leitura de que a alegria se estende por quatrocentos anos, embora a posição final da expressão permita alguma ambiguidade, preservada em nota.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. A colocação de «durante quatrocentos anos» evita que a leitura principal sugira que somente o ato de permanecer dure esse período, enquanto a nota conserva a ambiguidade possível do latim.
