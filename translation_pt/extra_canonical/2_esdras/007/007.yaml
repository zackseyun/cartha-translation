  text: But its entrance is narrow and set on a precipice, so that on the right there is fire and on the left deep water.
translation:
  language: pt
  text: Mas a entrada dela é estreita e está situada sobre um precipício, de modo que à direita há fogo e à esquerda, água profunda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: entrada
  rationale: Equivalente direto e natural no contexto de acesso à cidade.
- source_word: angustus
  choice: estreita
  rationale: Preserva a ideia espacial de uma passagem de pouca largura.
- source_word: in praecipiti positus
  choice: fica à beira de um precipício
  rationale: Expressa em português corrente a localização perigosa indicada pelo latim, sem tornar a imagem excessivamente literal ou obscura.
- source_word: aqua alta
  choice: águas profundas
  rationale: Neste contexto de perigo lateral, alta descreve a grande profundidade da água; o plural idiomático soa natural em português.
