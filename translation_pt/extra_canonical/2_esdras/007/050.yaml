  text: For this reason the Most High did not make one age, but two.
translation:
  language: pt
  text: Por isso, o Altíssimo não fez uma só era, mas duas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Propter hoc
  choice: Por isso
  rationale: Expressa de modo natural e direto a relação causal do latim.
- source_word: Altissimus
  choice: o Altíssimo
  rationale: Mantém o título divino tradicional e o valor substantivado do latim.
- source_word: aetas/saeculum (continuação pressuposta pelo texto da edição consultada)
  choice: era
  rationale: No contraste entre duas ordens temporais, “era” comunica melhor a ideia de períodos ou mundos sucessivos do que “idade”.
theological_decisions:
- issue: Natureza das “duas eras”
  choice: Preservar a formulação concisa sem identificar explicitamente as eras
  alternative: Explicitar “esta era e a era futura”
  rationale: A explicitação resolveria além do que o versículo afirma e importaria uma interpretação contextual para o texto principal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. A formulação conserva o contraste enfático entre “uma só era” e “duas”. O trecho latino fornecido termina após “Altissimus”; a continuação foi corroborada pela camada inglesa auditada e pelo sentido editorial do versículo.
