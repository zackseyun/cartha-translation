  text: But they were not persuaded and contradicted him[a], and they formed for themselves vain thoughts[b],
translation:
  language: pt
  text: Mas eles não se deixaram convencer e se opuseram a ele, e formaram para si pensamentos vãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non sunt persuasi
  choice: não se deixaram convencer
  rationale: Expressa naturalmente em português a recusa indicada pela construção passiva latina, sem sugerir mera falta involuntária de compreensão.
- source_word: contradixerunt ei
  choice: se opuseram a ele
  rationale: No contexto de rejeição ao mandamento divino, transmite a força de resistência de contradicere melhor do que o português moderno “contradizer”, que pode sugerir apenas discordância verbal.
- source_word: constituerunt sibi
  choice: formaram para si
  rationale: Mantém de perto a imagem do latim e a ideia reflexiva de produzirem ou adotarem tais pensamentos para si mesmos.
- source_word: cogitamenta vanitatis
  choice: pensamentos vãos
  rationale: Reproduz de modo claro e idiomático o genitivo de qualidade latino, preservando o sentido de pensamentos vazios, inúteis ou ilusórios.
theological_decisions:
- issue: Força da reação humana a Deus
  choice: se opuseram a ele
  alternative: o contradisseram
  rationale: A escolha comunica resistência e rebeldia no contexto, sem acrescentar uma formulação doutrinária; a alternativa é lexicalmente mais estreita, mas em português pode soar como simples contestação verbal.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e sem coloquialismo. O contraste inicial e a sequência coordenada do latim foram preservados.
