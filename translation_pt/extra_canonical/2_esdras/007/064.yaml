source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non esse natum, ut non sensus inde fieret. Nunc autem nobiscum crescit sensus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/064.yaml
  text: But now understanding grows with us[a], and because of this we are tormented, because we perish knowing it.
translation:
  language: pt
  text: Agora, porém, o entendimento cresce conosco[a], e por isso somos atormentados, porque perecemos sabendo disso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “porque, embora saibamos, perecemos”.'
    reason: Registra a leitura concessiva alternativa preservada pela tradição de tradução, embora o contexto favoreça a ideia de perecer com plena consciência.
lexical_decisions:
- source_word: sensus
  choice: entendimento
  rationale: No contexto, indica consciência ou capacidade de compreender, não mera percepção sensorial; “entendimento” preserva o sentido cognitivo e corresponde ao argumento sobre saber que se está perecendo.
- source_word: nobiscum crescit
  choice: cresce conosco
  rationale: Reproduz de modo natural a imagem latina de uma capacidade que se desenvolve junto com a pessoa.
theological_decisions:
- issue: Relação entre conhecimento, perecimento e tormento
  choice: “porque perecemos sabendo disso”
  alternative: “porque, embora saibamos, perecemos”
  rationale: A formulação principal toma o particípio implícito na camada textual consultada em valor circunstancial, indicando que os seres humanos perecem conscientes do próprio destino; evita introduzir a ideia concessiva de que o conhecimento deveria impedir a perdição.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do latim. “Agora, porém” marca o contraste; “somos atormentados” conserva a força do argumento sem explicitação doutrinária adicional.
