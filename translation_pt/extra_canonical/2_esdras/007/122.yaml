id: 2ES.7.122
reference: 2 Esdras 7:122
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam incipiet gloria Altissimi protegere eos qui caste conversati sunt, nos autem pessimis viis ambulavimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/122.yaml
  text: And since the glory of the Most High will begin to protect those who have conducted themselves chastely[a], but we have walked in the most evil ways?
translation:
  language: pt
  text: E, uma vez que a glória do Altíssimo começará a proteger os que se conduziram com pureza, mas nós caminhamos pelos piores caminhos?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: uma vez que
  rationale: Expressa o valor causal do latim, sem enfraquecê-lo para uma condição hipotética.
- source_word: protegere
  choice: proteger
  rationale: Equivalente direto e natural, preservando a ação protetora da glória do Altíssimo.
- source_word: caste conversati sunt
  choice: levaram uma vida pura
  rationale: Comunica conduta moral e religiosa íntegra em linguagem portuguesa natural, evitando restringir caste à castidade sexual.
- source_word: pessimis viis ambulavimus
  choice: caminhamos pelos piores caminhos
  rationale: Mantém a metáfora bíblica do caminhar e o superlativo de pessimis.
theological_decisions:
- issue: Amplitude moral de caste
  choice: vida pura
  alternative: vida casta
  rationale: No contraste com os “piores caminhos”, caste parece abranger a conduta moral e religiosa como um todo; “casta” poderia ser entendida hoje quase exclusivamente em sentido sexual.
- issue: Relação lógica introduzida por quoniam
  choice: uma vez que
  alternative: se
  rationale: O latim apresenta uma razão ou fato pressuposto, não uma condição; a formulação preserva a tensão interrogativa do contexto sem transformá-la em hipótese.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção interrogativa e o contraste entre a proteção futura e a má conduta passada foram mantidos, bem como a metáfora de caminhar por caminhos.
