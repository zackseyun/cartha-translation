source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nam maioris saeculi introitus spatiosi et securi et facientes inmortalitatis fructum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/013.yaml
  text: For the entrances of the greater age are broad and secure[a], and they produce the fruit of immortality.
translation:
  language: pt
  text: Pois as entradas da era maior[a] são amplas e seguras e produzem o fruto da imortalidade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Outras versões antigas trazem “era futura” ou “era vindoura”.
    reason: Registra a importante variante textual relativa a maioris, possivelmente decorrente de uma antiga confusão entre termos gregos para “maior” e “futura”.
lexical_decisions:
- source_word: nam
  choice: Pois
  rationale: Expressa o valor explicativo e causal da conjunção latina, ligando o versículo ao contraste anterior.
- source_word: maioris saeculi
  choice: da era maior
  rationale: Traduz diretamente o texto latino de Bensly, preservando saeculum como a era ou ordem temporal em contraste com a presente.
- source_word: introitus
  choice: as entradas
  rationale: Mantém a imagem concreta e o plural do latim.
- source_word: spatiosi et securi
  choice: amplas e seguras
  rationale: Reproduz com naturalidade os dois predicativos latinos, sem acrescentar interpretação.
- source_word: facientes inmortalitatis fructum
  choice: produzem o fruto da imortalidade
  rationale: Verte facientes de modo idiomático em português e preserva a metáfora do fruto.
theological_decisions:
- issue: Identificação da era escatológica
  choice: era maior
  alternative: era futura / era vindoura
  rationale: O texto latino principal traz maioris, portanto a tradução conserva sua leitura. A variante sustentada por outras versões antigas é registrada em nota, sem substituir silenciosamente o texto-base.
translation_notes:
  register: Português moderno, claro e digno, com construção sintática simples. “Era” comunica melhor o sentido temporal e escatológico de saeculum do que “século” no uso português atual.
