id: 2ES.7.11
reference: 2 Esdras 7:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter eos enim feci saeculum, et quando transgressus est Adam constitutiones meas, iudicatum est quod factum est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/011.yaml
  text: For their sake I made the world[a], and when Adam transgressed my ordinances, what had been made was judged.
translation:
  language: pt
  text: Pois foi para eles que fiz o mundo[a]; e, quando Adão transgrediu os meus preceitos, o que havia sido feito foi julgado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pois foi por causa deles que fiz a era”.'
    reason: Saeculum pode designar tanto o mundo quanto uma era, e propter pode admitir nuance causal além da leitura final ou benefativa adotada no texto.
lexical_decisions:
- source_word: propter eos
  choice: para eles
  rationale: 'A expressão é entendida em sentido final ou benefativo: o mundo foi feito em favor deles. A formulação também permanece natural e concisa em português.'
- source_word: saeculum
  choice: mundo
  rationale: Embora saeculum também possa significar “era”, neste contexto é objeto de feci e se relaciona com “o que havia sido feito”, indicando o mundo criado. A alternativa é preservada em nota.
- source_word: constitutiones meas
  choice: os meus preceitos
  rationale: “Preceitos” comunica normas estabelecidas por Deus sem restringir o termo a uma categoria jurídica ou denominacional específica.
- source_word: iudicatum est quod factum est
  choice: o que havia sido feito foi julgado
  rationale: Mantém a construção passiva e a referência abrangente do latim, sem explicitar além da fonte quem julgou nem restringir o alcance daquilo que foi feito.
theological_decisions:
- issue: Relação entre a transgressão de Adão e o julgamento da criação
  choice: 'Preservar a afirmação passiva e abrangente: “o que havia sido feito foi julgado”.'
  alternative: Explicitar que Deus condenou o mundo criado por causa do pecado de Adão.
  rationale: O latim não nomeia o agente de iudicatum est e não formula explicitamente toda a cadeia causal; a tradução conserva essa tensão e evita acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no mundo lusófono. A ordem foi levemente ajustada para expressar com naturalidade a finalidade de propter eos, mantendo a estrutura e a ambiguidade essenciais do latim.
