base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/073.yaml
  text: They have defrauded her whom they received. And what will they have to say in the judgment[a], or how will they answer in the last times?
translation:
  language: pt
  text: Defraudaram aquela que receberam. E o que terão a dizer no juízo, ou como responderão nos últimos tempos?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fraudauerunt
  choice: Defraudaram
  rationale: Mantém o sentido forte de agir fraudulentamente ou com deslealdade, sem reduzir o verbo a uma simples falta de obediência.
- source_word: eam quam acceperunt
  choice: aquela que receberam
  rationale: Preserva o pronome feminino do latim e sua referência ao antecedente no contexto, sem explicitar no corpo do versículo um substantivo ausente desta cláusula.
- source_word: Et quid habebunt dicere
  choice: E o que terão a dizer
  rationale: Reproduz a coordenação direta de Et quid e mantém o estilo paratático da passagem.
- source_word: in iudicio
  choice: no juízo
  rationale: Expressão portuguesa natural que conserva a dimensão judicial e escatológica do termo latino.
- source_word: in ... temporibus nouissimis
  choice: nos últimos tempos
  rationale: Segue a formulação escatológica tradicional e natural, sem determinar além do texto a duração ou a natureza desses tempos.
theological_decisions:
- issue: Identidade do referente feminino em eam
  choice: Manter “aquela”
  alternative: Explicitar “a lei”
  rationale: Embora o contexto indique provavelmente a lei recebida, o texto desta unidade emprega um pronome feminino; manter a referência pronominal evita inserir no versículo uma explicitação interpretativa.
- issue: Força escatológica de iudicium e temporibus nouissimis
  choice: “juízo” e “últimos tempos”
  alternative: “julgamento” e “fim dos tempos”
  rationale: A escolha conserva a linguagem judicial e a pluralidade temporal do latim sem identificar indevidamente a expressão com uma formulação teológica mais específica.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com estrutura próxima do latim. “Defraudaram” é deliberadamente forte e algo formal, refletindo fraudauerunt; a sintaxe pronominal preserva a coesão com o contexto anterior.
