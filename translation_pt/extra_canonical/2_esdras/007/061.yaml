source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nominatum est; Et non contristabor super multitudinem eorum qui perierunt, ipsi enim sunt qui uapori assimilati sunt et flammae, fumo adaequati sunt et exarserunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/061.yaml
  text: And I will not grieve over the multitude of those who have perished[a], for they are the ones who have been made like vapor and likened to flame, compared to smoke, and have burned up.
translation:
  language: pt
  text: E não me entristecerei com a multidão dos que pereceram,[a] pois são eles os que foram feitos semelhantes ao vapor e à chama, foram comparados à fumaça e arderam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução anteriormente adotada: “pois são como vapor e são comparados à chama e à fumaça”.'
    reason: Registra a formulação anterior, embora a sintaxe latina associe mais diretamente o vapor e a chama ao primeiro verbo, e a fumaça ao segundo.
lexical_decisions:
- source_word: contristabor super
  choice: me entristecerei com
  rationale: Expressa de modo natural em português a tristeza em relação à multidão, sem ampliar o sentido.
- source_word: qui perierunt
  choice: os que pereceram
  rationale: Mantém o perfeito latino e o sentido forte de perecer.
- source_word: uapori assimilati sunt et flammae
  choice: foram feitos semelhantes ao vapor e à chama
  rationale: Preserva o paralelismo dos dois dativos ligados a assimilati sunt e a voz passiva do latim.
- source_word: fumo adaequati sunt
  choice: comparados à fumaça
  rationale: Distingue esta segunda construção da anterior e conserva sua relação específica com 'fumaça'.
- source_word: exarserunt
  choice: arderam
  rationale: Traduz o ato de incendiar-se ou arder sem acrescentar explicitamente a ideia de extinção.
theological_decisions:
- issue: Agência na comparação dos que pereceram
  choice: foram feitos semelhantes
  alternative: tornaram-se semelhantes
  rationale: A forma passiva latina foi mantida, sem identificar quem realizou a ação nem resolver sua possível implicação teológica.
- issue: Força de exarserunt
  choice: arderam
  alternative: consumiram-se
  rationale: '''Arderam'' conserva a imagem do fogo sem afirmar além do texto que foram totalmente destruídos ou extintos.'
translation_notes:
  register: Português atual, digno e amplamente compreensível, com construção próxima do latim sem rigidez artificial. A expressão isolada “nominatum est” foi entendida como remanescente da frase anterior na segmentação da fonte, conforme também indica a camada inglesa auditada, e não foi incorporada ao versículo.
