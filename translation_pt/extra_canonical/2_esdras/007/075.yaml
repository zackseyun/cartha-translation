  text: Before you[a], Lord, show your servant, Lord, whether after death, or now when each of us gives up his soul, whether, if we are kept, we will be kept in rest until
translation:
  language: pt
  text: Diante de ti, Senhor, mostra, Senhor, ao teu servo se, depois da morte ou agora, quando cada um de nós entrega a sua alma, se, caso formos guardados[a], seremos guardados em repouso até
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «certamente seremos guardados».'
    reason: A sequência latina conseruati conseruabimur pode ser entendida como a condição explicitada na tradução («caso formos guardados, seremos guardados») ou como uma construção enfática, possivelmente de fundo semítico.
lexical_decisions:
- source_word: coram te
  choice: Diante de ti
  rationale: Reproduz de modo direto a expressão latina de presença ou comparecimento, sem acrescentar uma oração ausente no segmento.
- source_word: reddimus ... animam suam
  choice: cada um de nós entrega a sua alma
  rationale: Mantém a ideia de devolver ou entregar a própria alma no momento da morte, em português natural e solene.
- source_word: in requie
  choice: em repouso
  rationale: Conserva o sentido de estado de descanso, sem especificar uma concepção teológica além do texto.
- source_word: donec
  choice: até
  rationale: Mantém deliberadamente o término incompleto do segmento latino fornecido.
theological_decisions:
- issue: Sentido de conseruati conseruabimur
  choice: caso sejamos guardados, seremos guardados
  alternative: seremos certamente guardados
  rationale: A tradução principal preserva a forma condicional e a repetição do texto latino. A leitura enfática, possivelmente reflexo de uma construção semítica, é registrada em nota sem eliminar a ambiguidade.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com repetição deliberada de “Senhor” e “guardados” para refletir a fonte. O período termina em “até” porque o trecho latino fornecido está incompleto.
