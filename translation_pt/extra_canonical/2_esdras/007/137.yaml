source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si enim non multiplicaverit, non vivificabitur saeculum cum his qui habitant in eo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/137.yaml
  text: For if he does not multiply them[a], the age will not be given life with those who dwell in it.
translation:
  language: pt
  text: Pois, se ele não os multiplicar[a], a era não receberá vida com os que nela habitam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim não expressa diretamente o sujeito nem o objeto de «multiplicar»; pelo contexto, também se pode entender: «se não houver multiplicação».'
    reason: source_ambiguity
lexical_decisions:
- source_word: multiplicaverit
  choice: multiplicar
  rationale: Preserva o sentido básico do verbo latino e, com «não... multiplicar», expressa naturalmente em português a condição futura indicada pelo futuro perfeito latino.
- source_word: vivificabitur
  choice: receberá vida
  rationale: Reproduz o passivo latino com linguagem natural e digna, sem reduzir o sentido a mera sobrevivência.
- source_word: saeculum
  choice: a era
  rationale: Mantém a referência ao período ou ordem do mundo, evitando restringi-la a «mundo» ou «eternidade».
- source_word: habitant in eo
  choice: nela habitam
  rationale: Conserva a relação pronominal com «a era» e o presente do latim.
theological_decisions:
- issue: Referente implícito de «multiplicaverit»
  choice: ele não os multiplicar
  alternative: não houver multiplicação
  rationale: O latim omite tanto o sujeito expresso quanto o objeto; o contexto e a camada inglesa sustentam «ele/os», mas a nota registra a ambiguidade textual.
- issue: Força da condição verbal
  choice: se ele não os multiplicar, ... não receberá
  alternative: se ele não os multiplicasse, ... não receberia
  rationale: A construção latina usa futuro perfeito na condição e futuro do indicativo na consequência, não uma hipótese contrária aos fatos.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A formulação preserva a sequência causal e a condição futura do latim, bem como o termo conceitualmente aberto «era».
