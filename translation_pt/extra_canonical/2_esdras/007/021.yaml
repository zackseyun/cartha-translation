review_pass:
  verdict: revise
  source_fidelity: A redação transmite adequadamente a ênfase de mandans enim mandavit e a relação entre agir, viver, observar e não ser punido. Contudo, «aos que vieram, quando vieram» neutraliza a distinção formal do latim entre o particípio presente venientibus e o perfeito venerunt.
  naturalness: A repetição «vieram, quando vieram» soa pouco natural em português e não reproduz exatamente o contraste aspectual latino. «Aos que vinham, quando vieram» é claro, conserva a repetição deliberada e distingue os dois tempos verbais.
  terminology: «Senhor», «ordenou», «viver», «observar» e «punidos» são escolhas fiéis, de registro digno e amplamente compreensíveis. Não é necessário explicitar Lei, salvação ou vida eterna.
