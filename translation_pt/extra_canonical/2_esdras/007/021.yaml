source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mandans enim mandavit Dominus venientibus quando venerunt, quid facientes viverent, et quid observantes non punirentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/021.yaml
  text: For the Lord indeed commanded those who came, when they came, what they should do to live, and what they should observe so as not to be punished.
translation:
  language: pt
  text: Pois o Senhor de fato ordenou aos que vinham, quando vieram, o que deveriam fazer para viver e o que deveriam observar para não serem punidos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enim
  choice: Pois
  rationale: Mantém a ligação explicativa ou causal com o contexto anterior.
- source_word: mandans enim mandavit
  choice: de fato ordenou
  rationale: Representa a construção enfática latina sem introduzir a ideia não expressa de severidade.
- source_word: quid facientes viverent
  choice: o que deveriam fazer para viver
  rationale: Reproduz com naturalidade a relação entre agir e viver, sem precisar além do texto a natureza dessa vida.
- source_word: quid observantes non punirentur
  choice: o que deveriam observar para não serem punidos
  rationale: “Observar” corresponde a observantes e preserva a finalidade negativa expressa por non punirentur.
theological_decisions:
- issue: Relação entre conduta, vida e punição
  choice: 'Preservar a formulação direta: fazer para viver e observar para não ser punido.'
  alternative: Explicitar salvação, vida eterna, mérito ou obediência à Lei.
  rationale: O latim não especifica aqui a natureza da vida, o conteúdo do que deve ser observado nem um sistema soteriológico; explicitá-los resolveria indevidamente a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. A repetição “vieram, quando vieram” foi mantida porque corresponde à repetição deliberada de venientibus quando venerunt no texto latino.
