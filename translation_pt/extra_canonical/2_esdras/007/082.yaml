lexical_decisions:
- source_word: Secunda via
  choice: O segundo caminho
  rationale: Mantém a estrutura enumerativa e a metáfora do latim, em continuidade com «Via prima».
- source_word: non possunt
  choice: não podem
  rationale: Reproduz diretamente o presente latino sem acrescentar por conta própria um advérbio temporal.
- source_word: reuersionem bonam facere
  choice: fazer um bom arrependimento
  rationale: A continuação textual atestada da frase usa «reuersionem bonam», literalmente uma boa volta ou conversão; no contexto moral, «bom arrependimento» comunica esse sentido com naturalidade e coincide com a evidência de consulta.
- source_word: ut vivant
  choice: para viver
  rationale: Expressa de modo natural a finalidade indicada pela construção latina.
theological_decisions:
- issue: Se a impossibilidade de se arrepender deve ser explicitamente limitada ao estado presente após a morte
  choice: Não inserir «agora» no texto principal
  alternative: «porque agora não podem fazer um bom arrependimento para viver»
  rationale: O contexto pode conferir força temporal à impossibilidade, mas «non possunt» não contém «nunc» nem «iam». A tradução preserva a formulação não explicitada do texto latino e registra a leitura contextual em nota.
