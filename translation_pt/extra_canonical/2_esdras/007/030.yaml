source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et convertetur saeculum in antiquum silentium diebus septem sicut in prioribus initiis, ita ut nemo derelinquatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/030.yaml
  text: And the age will return to the ancient silence for seven days, as in the former beginnings, so that no one is left behind.
translation:
  language: pt
  text: E a era retornará ao antigo silêncio por sete dias, como nos inícios anteriores, de modo que ninguém seja deixado para trás.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: a era
  rationale: Preserva o sentido temporal e cósmico de saeculum neste contexto escatológico, sem o limitar a “mundo” ou “século” no sentido moderno.
- source_word: convertetur
  choice: retornará
  rationale: Expressa de modo natural o movimento de volta a um estado anterior indicado pelo latim.
- source_word: antiquum silentium
  choice: antigo silêncio
  rationale: Mantém a imagem solene e deliberadamente enigmática do texto-fonte.
- source_word: in prioribus initiis
  choice: nos primeiros começos
  rationale: Reproduz a formulação enfática do latim, ainda que incomum, sem reduzir a possível alusão às origens primordiais.
- source_word: nemo derelinquatur
  choice: ninguém permaneça
  rationale: No contexto de silêncio e ausência universal, derelinquatur indica que nenhuma pessoa continuará ou ficará presente; “permaneça” transmite isso naturalmente sem acrescentar a ideia relacional de abandono.
theological_decisions:
- issue: Natureza do retorno da era ao silêncio primordial
  choice: 'Mantida a linguagem figurada e ambígua: “a era retornará ao antigo silêncio”'
  alternative: “o mundo voltará ao silêncio antigo”
  rationale: O latim não explica se saeculum designa o mundo, a ordem presente ou um período cósmico; “era” conserva melhor essa abertura.
- issue: Sentido de nemo derelinquatur
  choice: “de modo que ninguém permaneça”
  alternative: “de modo que ninguém seja deixado para trás”
  rationale: A alternativa pode sugerir que alguns agentes abandonam outros, noção não exigida pela construção passiva latina. A escolha preserva o quadro de ausência total após os acontecimentos anteriores.
translation_notes:
  register: Português moderno, solene e acessível, com sintaxe próxima do original. “Primeiros começos” foi preservado por seu caráter primordial e enfático, apesar de não ser a formulação mais coloquial.
