  text: et omnis qui liberatus est de praedictis malis, ipse videbit mirabilia mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/027.yaml
  text: And everyone who is delivered from the evils foretold will see my wonders[a].
translation:
  language: pt
  text: E todo aquele que for liberto dos males anunciados verá as minhas maravilhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: liberatus est
  choice: for liberto
  rationale: A forma latina é um perfeito passivo, mas, no contexto futuro da oração principal, descreve quem vier a ser libertado; o futuro do subjuntivo é natural em português.
- source_word: praedictis malis
  choice: males anunciados
  rationale: Preserva o sentido de males previamente declarados ou preditos sem restringir indevidamente a expressão a uma formulação técnica de profecia.
- source_word: mirabilia mea
  choice: as minhas maravilhas
  rationale: Mantém o termo amplo para atos ou realidades extraordinárias pertencentes a Deus, sem explicá-los além do texto.
- source_word: ipse videbit
  choice: verá
  rationale: O pronome enfático e resumitivo latino reforça o sujeito já expresso. Em português corrente, a flexão verbal retoma naturalmente o sujeito, enquanto «esse verá» soaria artificial e poderia introduzir um contraste ausente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com estrutura natural e leve solenidade adequada ao discurso apocalíptico. A retomada enfática de ipse não foi reproduzida por um pronome explícito porque isso criaria aspereza e possível contraste indevido em português.
