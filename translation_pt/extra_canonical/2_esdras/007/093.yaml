base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/093.yaml
  text: 'The second order: because they see the entanglement in which the souls of the ungodly wander[a], and the punishment that awaits them.'
translation:
  language: pt
  text: 'A segunda ordem: porque veem o emaranhado[a] em que vagueiam as almas dos ímpios e o castigo que as espera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a perplexidade”.
    reason: Registra a possibilidade de entender «complicationem» em sentido mais abstrato, sem substituir no texto a imagem principal de enredamento, coerente com «uagantur».
lexical_decisions:
- source_word: complicationem
  choice: emaranhado
  rationale: Preserva a imagem de algo enredado ou intrincado, coerente com o verbo espacial “vagueiam”, em vez de reduzir a expressão a um estado meramente psicológico.
- source_word: uagantur
  choice: vagueiam
  rationale: Reproduz o sentido de andar sem rumo e mantém a imagem espacial da frase latina.
- source_word: Secundus ordo
  choice: A segunda ordem
  rationale: Mantém a formulação enumerativa do texto e a ligação com a sequência do contexto.
theological_decisions:
- issue: Natureza da condição das almas dos ímpios
  choice: “o emaranhado em que vagueiam”
  alternative: “a perplexidade em que se encontram”
  rationale: A tradução conserva a metáfora concreta e não define além do texto se essa condição é espacial, mental ou espiritual.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A colocação de “as almas dos ímpios” após o verbo preserva a fluidez e mantém inequívoco o referente.
