source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: semita autem est una sola inter eos posita, hoc est ignis et aqua, ut non capiat semita nisi solummodo vestigium hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/008.yaml
  text: But there is only one path laid between them[a], that is, between the fire and the water, so that the path can hold only a man's footprint.
translation:
  language: pt
  text: Mas há uma só vereda posta entre eles — isto é, entre o fogo e a água —, de modo que a vereda não comporte mais que a pegada de uma pessoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: semita
  choice: vereda
  rationale: Expressa uma passagem estreita e corresponde naturalmente à imagem do texto, sem sugerir uma estrada larga.
- source_word: una sola
  choice: apenas uma
  rationale: Preserva a ênfase combinada de singularidade e exclusividade.
- source_word: inter eos posita
  choice: posta entre eles
  rationale: Mantém a construção espacial e o referente pronominal do latim.
- source_word: hoc est ignis et aqua
  choice: isto é, entre o fogo e a água
  rationale: Conserva a fórmula explicativa hoc est e explicita em português a relação espacial exigida pelo contexto, sem reduzir a expressão a uma simples enumeração.
- source_word: non capiat ... nisi solummodo
  choice: só comporta
  rationale: Transmite de maneira natural a limitação de capacidade indicada pela construção exclusiva latina.
- source_word: vestigium hominis
  choice: a pegada de uma pessoa
  rationale: Representa vestigium como a marca ou espaço de um único passo; 'uma pessoa' comunica hominis de forma inclusiva e corrente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com leve tom literário em 'vereda'. A repetição de 'vereda' preserva a coesão e a ênfase do original. Nenhuma nota é necessária, pois a explicação 'entre o fogo e a água' pode ser incorporada diretamente sem eliminar a construção epexegética.
