  text: The seventh way is greater than all the ways mentioned above[a], because they will waste away in confusion and be consumed in horrors and wither in fears, seeing the glory of the Most High, before whom they sinned while they lived[b], and before whom they will begin to be judged in the last times.
translation:
  language: pt
  text: A sétima via é mais intensa do que todas as vias mencionadas acima[a], porque eles definharão em confusão, serão consumidos por horrores e murcharão de medo ao verem a glória do Altíssimo, diante de quem pecaram enquanto viviam[b] e diante de quem começarão a ser julgados nos últimos tempos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Diversas palavras deste versículo apresentam dificuldades textuais na tradição latina. O sentido geral, porém, é suficientemente claro: os perversos sofrem a angústia mais intensa ao serem confrontados com a glória do Altíssimo, diante de quem pecaram.'
    reason: textual_variant
  - marker: b
    text: 'Outra possibilidade de ordenação: “A sétima via, mais intensa do que todas as vias mencionadas acima: eles definharão em confusão, serão consumidos por horrores e murcharão de medo, vendo a glória do Altíssimo, diante de quem pecaram enquanto viviam e diante de quem começarão a ser julgados nos últimos tempos”.'
    reason: previous_rendering
lexical_decisions:
- source_word: uia
  choice: via
  rationale: Mantém a imagem recorrente das sete vias ou experiências da alma, em linguagem clara e digna.
- source_word: maior
  choice: mais intensa
  rationale: Neste contexto, o comparativo indica que a sétima via supera as anteriores em gravidade, não em tamanho físico.
- source_word: detabescent
  choice: definharão
  rationale: Reproduz o futuro e a ideia de consumir-se ou desfazer-se progressivamente.
- source_word: in confusione
  choice: em confusão
  rationale: Preserva a amplitude do latim, que pode envolver desconcerto, desonra ou vergonha, sem restringi-lo a uma única nuance.
- source_word: consumentur in horroribus
  choice: serão consumidos por horrores
  rationale: Conserva a voz passiva, o futuro e o sentido de terror de horroribus.
- source_word: ma(s/r)cescent in timoribus
  choice: murcharão de medo
  rationale: Expressa a imagem de perder o vigor sob o efeito do temor e mantém o tempo futuro.
- source_word: uidentes
  choice: ao verem
  rationale: Traduz o particípio de modo natural sem transformá-lo na causa introduzida por quoniam.
- source_word: incipient ... iudicari
  choice: começarão a ser julgados
  rationale: Mantém tanto o aspecto incoativo de incipient quanto a construção passiva.
theological_decisions:
- issue: Relação entre pecado, visão da glória e juízo
  choice: diante de quem pecaram ... e diante de quem começarão a ser julgados
  alternative: por quem começarão a ser julgados
  rationale: A repetição de coram enfatiza estar perante o Altíssimo; a tradução evita explicitar além do texto a agência do julgamento.
- issue: Sentido de maior aplicado à sétima via
  choice: mais intensa
  alternative: maior
  rationale: O contexto aponta para maior severidade da angústia. A formulação escolhida comunica isso sem acrescentar uma classificação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tom é solene sem ser arcaico; os futuros verbais e a sequência causal do latim foram preservados.
