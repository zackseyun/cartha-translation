- source_word: primis noctibus
  choice: nas primeiras noites
  rationale: Preserva o plural e a formulação temporal do latim sem especificar mais do que a fonte.
- source_word: missus est ... qui missus fuerat
  choice: foi novamente enviado ... que tinha sido enviado
  rationale: Mantém a repetição deliberada do verbo e explicita com “novamente” que se trata de um novo envio do mesmo anjo, sentido exigido pelo contexto e refletido na camada inglesa auditada.
