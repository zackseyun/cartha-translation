base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/099.yaml
  text: '[him][a], whom the living serve and from whom the glorious begin to receive their reward. This is the order of the souls of the righteous, as it is now announced; [and these are] the previously described ways of torment, which'
translation:
  language: pt
  text: '[dele], a quem os vivos servem e de quem os gloriosos começam a receber sua recompensa. Esta é a ordem das almas dos justos, como agora se anuncia[a]; [e estes são] os caminhos de tormento anteriormente descritos, que'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “como se anuncia a partir de agora”.'
    reason: A locução latina «a modo» pode designar o momento presente ou, conforme o contexto, o início de algo que prossegue daí em diante.
lexical_decisions:
- source_word: cui seruiunt uiuentes
  choice: a quem os vivos servem
  rationale: Mantém a relação dativa e o sentido direto de serviço ou culto, sem especificar além do latim.
- source_word: a quo incipiunt gloriosi mercedem recipere
  choice: de quem os gloriosos começam a receber sua recompensa
  rationale: Preserva o valor de origem de «a quo», o aspecto incoativo de «incipiunt» e o uso substantivado de «gloriosi».
- source_word: ordo animarum iustorum
  choice: ordem das almas dos justos
  rationale: «Ordem» conserva a ideia de sequência ou disposição apresentada no contexto, sem reduzi-la a uma simples lista.
- source_word: a modo
  choice: a partir de agora
  rationale: Expressa o valor temporal prospectivo da locução, embora «agora» também seja possível no contexto.
- source_word: praedictae uiae cruciatus
  choice: os caminhos de tormento anteriormente descritos
  rationale: Traduz «praedictae» contextualmente como algo já exposto e mantém a metáfora dos caminhos.
theological_decisions:
- issue: Referente de «gloriosi»
  choice: os gloriosos
  alternative: os que foram glorificados
  rationale: A forma latina é adjetival substantivada e não explicita se a glória é condição presente, resultado de uma ação passada ou designação proléptica; a tradução conserva essa abertura.
- issue: Elemento elíptico antes de «praedictae uiae»
  choice: '[e estes são]'
  alternative: sem qualquer complemento editorial
  rationale: A inserção entre colchetes torna inteligível a transição abrupta do fragmento latino, deixando claro que as palavras não estão expressas no texto preservado.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe suficientemente formal para refletir a enumeração do contexto. Os colchetes preservam os suprimentos editoriais do texto-fonte, e a oração final permanece incompleta porque continua no versículo seguinte.
