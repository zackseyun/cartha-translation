review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva bem a sequência sintática, o aspecto incoativo de «começam a receber» e a elipse editorial assinalada por colchetes. Contudo, «pelos quais» atribui a «quas» um sentido instrumental/locativo que não está expresso: o relativo retoma «caminhos» como objeto da oração que continua no versículo seguinte. «Ut a modo adnuntiatur» é melhor vertido no texto principal como «como agora se anuncia», com a leitura prospectiva registrada em nota.'
  naturalness: «Como agora se anuncia» é mais idiomático e menos pesado que «conforme é anunciada a partir de agora», sem perder a solenidade moderada do contexto. A oração final deliberadamente incompleta é mantida, pois o latim fornecido também se interrompe em «quas».
  terminology: «Almas dos justos», «os gloriosos», «recompensa» e «tormento» são escolhas adequadas e não impõem interpretação teológica adicional. «Os gloriosos» conserva de modo útil a substantivação ambígua de «gloriosi».
  issues:
  - severity: medium
    issue: «pelos quais» para «quas»
    rationale: O acusativo feminino plural «quas» retoma «uiae» e introduz a oração que prossegue no versículo seguinte; não significa «por meio dos quais» nem «através dos quais». «que» preserva a função relativa sem antecipar o restante da oração.
  - severity: low
    issue: Valor principal de «a modo»
    rationale: Embora possa ter força prospectiva («a partir de agora»), no contexto parentético «ut a modo adnuntiatur» a formulação principal mais direta e natural é «como agora se anuncia». A alternativa prospectiva deve permanecer em nota.
