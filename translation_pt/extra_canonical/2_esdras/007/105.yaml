  text: para que, por ele, compreenda, durma, coma ou seja curado; assim, ninguém jamais rogará por outra pessoa, pois então todos carregarão, cada um, suas próprias injustiças ou justiças.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eo
  choice: em seu lugar
  rationale: O pronome latino tem valor substitutivo no contexto da série; a formulação portuguesa preserva a ideia de alguém realizar ou experimentar algo em lugar de outro, sem acrescentar um referente ausente do trecho fornecido.
- source_word: intellegat
  choice: compreenda
  rationale: Equivalente direto e natural do subjuntivo latino, mantido na série verbal.
- source_word: curetur
  choice: seja curado
  rationale: Preserva a voz passiva do latim.
- source_word: rogabit
  choice: rogará
  rationale: Neste contexto, o verbo indica súplica ou intercessão; “rogar” conserva esse sentido religioso sem especificar indevidamente o destinatário.
- source_word: portabunt
  choice: carregarão
  rationale: Mantém a metáfora judicial e moral de portar o que é próprio de cada pessoa.
- source_word: iniustitias suas aut iustitias
  choice: suas próprias injustiças ou justiças
  rationale: Preserva os plurais e a alternativa explícita do latim, sem converter os termos em abstrações singulares ou em “atos” não expressos.
theological_decisions:
- issue: Impossibilidade de intercessão no momento referido
  choice: “ninguém jamais rogará por outra pessoa, pois então...”
  alternative: “ninguém jamais rogará por outra pessoa, mas...”
  rationale: O explicativo latino enim exige relação causal, não contraste; tunc foi ligado ao ato de carregar, de acordo com a sintaxe da fonte.
- issue: Responsabilidade universal e individual
  choice: “todos carregarão, cada um, suas próprias...”
  alternative: “cada um carregará...”
  rationale: A redação conserva tanto omnes (“todos”) quanto unusquisque (“cada um”), mantendo a ênfase simultaneamente universal e individual.
translation_notes:
  register: Português moderno, digno e acessível. A abertura permanece como continuação sintática de um contexto anterior, conforme o trecho latino fornecido. Não foi incorporada a expressão inglesa sobre “um amigo muito querido”, pois ela não consta neste segmento da fonte latina apresentado.
