  text: 'o perigo, para que guardassem perfeitamente a lei do Legislador. Por isso, isto é a respeito deles:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: periculum
  choice: o perigo
  rationale: Mantém o sentido direto do latim e a continuidade do fragmento, que começa no meio de uma frase.
- source_word: uti perfecte custodirent
  choice: para que guardassem perfeitamente
  rationale: Expressa naturalmente a finalidade ou o resultado indicado por “uti” com o subjuntivo, preservando “perfecte” sem enfraquecê-lo.
- source_word: legislatoris legem
  choice: a lei do Legislador
  rationale: Reproduz a construção enfática do original e mantém a designação pessoal “Legislador”.
- source_word: Propter quod hic de his
  choice: Por isso, isto é a respeito deles
  rationale: Conserva a referência relativamente aberta de “hic” e “de his”, sem acrescentar “ensino” ou outro substantivo ausente do texto.
theological_decisions:
- issue: Identidade do “Legislador”
  choice: Legislador, com inicial maiúscula
  alternative: legislador, com inicial minúscula
  rationale: A forma funciona como designação pessoal de Deus no contexto, mas a tradução não acrescenta um nome ou título mais específico que o latim.
- issue: Conteúdo de “hic”
  choice: isto
  alternative: este é o ensino
  rationale: O latim não contém um substantivo equivalente a “ensino”; “isto” preserva a concisão e a abertura referencial do original.
translation_notes:
  register: Português moderno, claro e digno. Como o versículo é um fragmento sintático, inicia-se com letra minúscula para indicar sua continuidade com o texto anterior; os dois-pontos finais preservam a introdução do que segue.
