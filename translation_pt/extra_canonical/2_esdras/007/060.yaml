  text: quod difficile est, gaudet super eum, qui uabet abundantiam ; Sic et a me repromissa creatura, iocundabor enim super paucis et qui saluabuntur, propterea quod ipsi sunt qui gloriam meam nunc dominatiorem fecerunt, et per quos nunc nomen meum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/060.yaml
  text: 'So also with the creation promised by me: I will rejoice over the few who will be saved[a], because they are the ones who have now made my glory more dominant, and through whom my name is now named.'
translation:
  language: pt
  text: 'Assim também será com a criação que prometi: eu me alegrarei com os poucos que serão salvos[a], porque foram eles que agora tornaram maior a minha glória e por meio dos quais o meu nome agora é nomeado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «que são salvos».'
    reason: Registra a alternativa tradicional da camada inglesa consultada, embora o futuro «serão salvos» corresponda diretamente ao latim saluabuntur.
lexical_decisions:
- source_word: repromissa creatura
  choice: a criação que prometi
  rationale: Expressa naturalmente a construção latina e mantém Deus como agente da promessa, sem o peso pouco idiomático de «criação prometida por mim».
- source_word: iocundabor
  choice: eu me alegrarei
  rationale: Preserva o futuro e o sentido de alegria do verbo latino.
- source_word: paucis ... qui saluabuntur
  choice: os poucos que serão salvos
  rationale: Mantém o futuro passivo inequívoco de saluabuntur e a referência escatológica aos poucos.
- source_word: gloriam meam ... dominatiorem fecerunt
  choice: tornaram maior a minha glória
  rationale: Dominatiorem é comparativo e sugere aumento de proeminência ou domínio. «Maior» conserva o comparativo em português natural, sem introduzir a ideia verbal distinta de «prevalecer».
- source_word: nomen meum ... nominatur
  choice: o meu nome agora é invocado
  rationale: Embora nominatur possa significar literalmente «é nomeado», nesse contexto a expressão portuguesa «o nome é invocado» comunica de modo natural que o nome divino é pronunciado ou confessado por meio deles.
theological_decisions:
- issue: Tempo da salvação
  choice: que serão salvos
  alternative: que são salvos
  rationale: O latim saluabuntur é futuro passivo do indicativo; a tradução não transforma a salvação futura em estado presente.
- issue: Sentido de dominatiorem
  choice: tornaram maior a minha glória
  alternative: fizeram a minha glória mais dominante
  rationale: A opção escolhida preserva o grau comparativo sem impor a formulação pouco natural «mais dominante» nem decidir exatamente de que modo a glória se torna superior.
- issue: Uso do nome divino
  choice: por meio dos quais o meu nome agora é invocado
  alternative: por meio dos quais o meu nome agora é nomeado
  rationale: «Invocado» é idiomático em contexto religioso e conserva a relação instrumental marcada por per quos, sem acrescentar uma doutrina denominacional.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e vocabulário amplamente internacional. A construção mantém o encadeamento solene do latim, mas evita calques pouco naturais.
