base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/094.yaml
  text: 'The third order: seeing the testimony that he who formed them bore concerning them[a], that while they lived they kept the law that was entrusted to them.'
translation:
  language: pt
  text: 'A terceira ordem: elas veem o testemunho que aquele que as formou prestou a respeito delas,[a] de que, enquanto viviam, guardaram a lei que lhes foi confiada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o testemunho que aquele que as formou lhes prestou”.'
    reason: O dativo latino “eis” pode indicar que o testemunho foi dirigido às almas, em vez de ser entendido como testemunho a respeito delas.
lexical_decisions:
- source_word: Tertius ordo
  choice: A terceira ordem
  rationale: Mantém a enumeração formal do texto latino e sua ligação com as etapas anteriores.
- source_word: uidentes
  choice: verem
  rationale: Reproduz o particípio de percepção sem convertê-lo em uma oração causal com “porque”.
- source_word: testimonium quod testificatus est
  choice: o testemunho que ... deu
  rationale: Expressão natural em português para o cognato enfático latino, sem a formulação pesada “testemunho que testemunhou”.
- source_word: qui plasmauit eas
  choice: aquele que as formou
  rationale: Preserva a imagem de formar ou moldar; o pronome feminino retoma as almas.
- source_word: serua-
  choice: guardaram a lei que lhes foi confiada
  rationale: Segue a continuação textual atestada e o contexto fornecido, usando “guardar” para a observância da lei e “confiada” para expressar sua entrega como encargo.
theological_decisions:
- issue: Relação do testemunho com as almas
  choice: deu a respeito delas
  alternative: lhes deu
  rationale: O dativo latino “eis” admite tensão entre testemunho dirigido a elas e testemunho em favor delas/a respeito delas. O texto principal adota a leitura contextual de testemunho acerca delas, preservando a alternativa em nota.
- issue: Estrutura de “uidentes”
  choice: verem
  alternative: porque veem
  rationale: O latim muda para um particípio, sem marcador causal explícito; a tradução evita acrescentar causalidade e conserva a forma enumerativa.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A formulação mantém a concisão enumerativa e a ambiguidade relevante do dativo latino.
