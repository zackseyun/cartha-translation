base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/095.yaml
  text: 'The fourth order: they understand the rest in which[a], now gathered in their storehouses, they will rest in great silence, guarded by angels, and the glory that remains for them in the last times.'
translation:
  language: pt
  text: 'A quarta ordem: compreendem o descanso no qual, agora reunidos em suas câmaras, descansarão em profundo silêncio, guardados pelos anjos, e a glória que permanece para eles nos últimos tempos.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase sobre a glória que permanece para os justos nos últimos tempos é textualmente incerta no latim; ainda assim, o sentido geral — repouso sob a guarda dos anjos agora e glória futura — é seguro.
    reason: textual_variant
lexical_decisions:
- source_word: Quartus ordo
  choice: A quarta ordem
  rationale: Mantém a estrutura enumerativa do texto latino e a terminologia das etapas ou categorias descritas no contexto.
- source_word: promptuariis
  choice: câmaras
  rationale: O termo latino pode designar depósitos ou recintos de guarda. “Câmaras” comunica aqui um lugar reservado onde os justos estão reunidos, sem a conotação moderna e excessivamente material de “depósitos”.
- source_word: cum silentio multo
  choice: em profundo silêncio
  rationale: Reproduz de modo natural e digno a intensidade de multo, em vez do pouco idiomático “com muito silêncio”.
- source_word: manentem gloriam
  choice: a glória que permanece para eles
  rationale: Conserva o sentido de manentem e evita transformar explicitamente a expressão em “glória reservada”, embora essa seja uma possível implicação.
theological_decisions:
- issue: Relação temporal entre o repouso presente e a glória futura
  choice: Preservar a distinção entre estarem agora reunidos nas câmaras, o descanso descrito no futuro e a glória dos últimos tempos
  alternative: Harmonizar os verbos como se todo o repouso já estivesse plenamente presente
  rationale: O latim combina nunc com requiescent e depois menciona a glória nos últimos tempos. A tradução mantém essa tensão temporal sem impor uma sistematização escatológica.
- issue: Natureza das “câmaras”
  choice: Usar linguagem espacial genérica, sem identificar o lugar com uma doutrina específica do estado intermediário
  alternative: Nomear o lugar como céu, paraíso, limbo ou outro conceito doutrinário
  rationale: O texto fala em promptuaria, mas não fornece aqui uma identificação teológica mais precisa.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A ordem sintática foi suavizada para fluência, preservando a tensão temporal e a incerteza textual do original.
