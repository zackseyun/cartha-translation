  revision_rationale: A revisão esclarece que a bondade é a base ou motivação da dádiva, não necessariamente seu objeto, e substitui uma designação fracionária pouco idiomática por uma equivalência portuguesa clara. Mantêm-se a passiva, o registro solene, a ambiguidade relativa ao alívio das iniquidades e a vírgula final que assinala a continuidade sintática.
