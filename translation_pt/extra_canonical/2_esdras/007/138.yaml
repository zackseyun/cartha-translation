  text: Et donator, quoniam si non donaverit de bonitate sua, ut adleventur hii qui iniquitates fecerunt de suis iniquitatibus, non poterit decies millesima pars hominum vivificari,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/138.yaml
  text: And he is generous[a], because if he did not give from his goodness, so that those who have committed iniquities might be relieved of their iniquities, not even a ten-thousandth part of mankind could be made alive,
translation:
  language: pt
  text: E ele é generoso, porque, se não desse, por sua bondade, para que os que cometeram iniquidades fossem aliviados de suas iniquidades[a], nem sequer uma parte em dez mil da humanidade poderia ser vivificada,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “libertos de suas iniquidades”.'
    reason: A construção latina adleventur ... de suis iniquitatibus pode evocar tanto o alívio de um fardo quanto a libertação daquilo que oprime.
lexical_decisions:
- source_word: donator
  choice: generoso
  rationale: Embora o latim possa designar literalmente “aquele que dá”, aqui a forma predicativa expressa a disposição divina de dar; “generoso” comunica isso de modo natural e digno em português.
- source_word: adleventur ... de suis iniquitatibus
  choice: fossem aliviados de suas iniquidades
  rationale: Preserva a imagem de retirada ou redução de um fardo sem especificar se se trata das próprias iniquidades, da culpa ou de suas consequências.
- source_word: decies millesima pars
  choice: a décima milésima parte
  rationale: 'Reproduz com precisão a fração latina: uma parte em dez mil.'
- source_word: vivificari
  choice: ser vivificada
  rationale: Mantém a voz passiva e o sentido forte de receber vida, sem reduzir a expressão a mera sobrevivência.
theological_decisions:
- issue: Como entender o alívio relacionado às iniquidades
  choice: aliviados de suas iniquidades
  alternative: libertos de suas iniquidades
  rationale: A formulação principal conserva a amplitude de adleventur de e evita decidir se o texto fala de perdão, remoção da culpa, libertação do pecado ou mitigação de suas consequências.
translation_notes:
  register: Português atual, claro e solene, com ampla legibilidade brasileira. A vírgula final foi mantida porque o versículo continua a construção sintática do contexto.
