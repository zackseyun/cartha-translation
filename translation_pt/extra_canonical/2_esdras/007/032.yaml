source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et terra reddet qui in eam dormiunt, et pulvis qui in eo silentio habitant, et promptuaria reddent quae eis commendatae sunt animae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/032.yaml
  text: And the earth will give back those who sleep in it[a], and the dust those who dwell in it in silence, and the storehouses will give back the souls entrusted to them.
translation:
  language: pt
  text: E a terra devolverá os que nela dormem, e o pó, os que nele habitam em silêncio, e os depósitos devolverão as almas que lhes foram confiadas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reddet
  choice: devolverá / devolverão
  rationale: Preserva a ideia de restituir aquilo que estava guardado, repetida na primeira e na terceira oração.
- source_word: dormiunt
  choice: dormem
  rationale: Mantém a metáfora tradicional do sono para os mortos sem explicitar além do texto.
- source_word: pulvis
  choice: pó
  rationale: Equivalente direto e natural, preservando o paralelismo entre terra e pó.
- source_word: promptuaria
  choice: depósitos
  rationale: Expressa lugares de armazenamento ou guarda sem impor uma localização cosmológica específica.
- source_word: commendatae sunt
  choice: foram confiadas
  rationale: Comunica que as almas foram entregues à guarda dos depósitos, mantendo a construção passiva.
theological_decisions:
- issue: Relação entre os mortos, a terra, o pó e as almas guardadas
  choice: Manter as três imagens distintas e coordenadas
  alternative: Fundir as imagens numa explicação explícita da ressurreição
  rationale: O latim apresenta terra, pó e depósitos como agentes paralelos de restituição; explicá-los teologicamente reduziria a força e a possível tensão das imagens.
- issue: Alcance de «em silêncio»
  choice: Ligá-lo aos que habitam no pó
  alternative: TratÁ-lo como variante referente aos que dormem na terra
  rationale: A sintaxe de «qui in eo silentio habitant» favorece a segunda oração, e o texto latino fornecido contém tanto «dormiunt» quanto «silentio habitant» como descrições paralelas, não alternativas.
translation_notes:
  register: Português moderno, claro e digno, com estrutura coordenada próxima do latim. A elipse do verbo após «o pó» evita repetição pesada sem obscurecer o sentido. «Nele» retoma gramaticalmente «pó».
