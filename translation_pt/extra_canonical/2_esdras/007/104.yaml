base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/104.yaml
  text: 'And he answered me and said[a], “Because you have found favor before my eyes, I will show you this also: the day of judgment is a decisive day and will display to all the seal of truth. For just as a father does not send a son, or a son a father, or a master a slave, or a friend a beloved one[b], to speak on his behalf in the judgment'
translation:
  language: pt
  text: 'E ele me respondeu e disse[a]: “Visto que você encontrou favor diante dos meus olhos, também lhe mostrarei isto: o dia do julgamento é um dia decisivo e mostrará a todos o selo da verdade. Pois, assim como um pai não envia um filho, nem um filho, seu pai, nem um senhor, seu servo, nem um amigo, alguém muito querido[b], para falar em seu favor no julgamento,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Parte deste versículo pertence ao fragmento restaurado que não consta da maioria dos manuscritos latinos medievais. Os exemplos ressaltam que, na vida comum, uma pessoa não pode simplesmente tomar o lugar de outra, servindo de analogia para o julgamento final.
    reason: recovered_fragment
  - marker: b
    text: O latim é conciso e sua relação exata é incerta. fidus pode significar “amigo” ou “pessoa fiel”, e carissimum significa “alguém muito querido”.
    reason: textual_ambiguity
lexical_decisions:
- source_word: inuenisti gratiam ante oculos meos
  choice: você encontrou favor diante dos meus olhos
  rationale: Preserva o idiomatismo bíblico do latim, com linguagem clara e digna em português moderno.
- source_word: dies decretorius
  choice: um dia decisivo
  rationale: Expressa o caráter determinante e irrevogável do dia do julgamento sem acrescentar uma interpretação doutrinária específica.
- source_word: signaculum ueritatis
  choice: o selo da verdade
  rationale: Mantém a imagem concreta e teologicamente aberta do latim.
- source_word: fidus carissimum
  choice: o amigo, a pessoa amada
  rationale: O latim é conciso e algo irregular; a formulação portuguesa segue a relação pessoal indicada no texto e evita restringir carissimum a parentesco ou papel específico.
- source_word: ut pro
  choice: para falar em seu favor no julgamento
  rationale: A frase latina fornecida termina de modo truncado em 'ut pro'; a continuação é expressa conforme a camada de consulta auditada, deixando claro o sentido de representação em favor de outra pessoa.
theological_decisions:
- issue: Caráter pessoal e intransferível do julgamento
  choice: Manter a série de relações humanas como analogia, sem explicá-la no corpo do versículo
  alternative: Explicitar que ninguém pode interceder ou responder judicialmente por outra pessoa
  rationale: O trecho formula a ideia por analogia e não define aqui todas as implicações teológicas da intercessão; explicá-las no texto resolveria uma tensão que o original preserva.
- issue: Sentido de 'selo da verdade'
  choice: Preservar literalmente a metáfora
  alternative: Traduzir como 'prova definitiva da verdade'
  rationale: A alternativa interpreta a função do selo, enquanto o original mantém uma imagem que pode envolver autenticação, confirmação ou revelação.
translation_notes:
  register: Português moderno, amplamente compreensível e com boa legibilidade brasileira. O tratamento por “você” mantém naturalidade contemporânea; o paralelismo e termos como “julgamento” e “selo da verdade” conservam o tom bíblico solene. A pontuação final indica que a frase continua além do trecho transmitido.
