source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si quis enim volens voluerit ingredi mare videre eum vel dominari eius, si non transierit angustum, in latitudinem venire quomodo poterit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/005.yaml
  text: For if anyone desires to enter the sea[a], to see it or to master it, how will he be able to come into the broad place unless he passes through the narrow place?
translation:
  language: pt
  text: Pois, se alguém deseja entrar no mar, para vê-lo ou dominá-lo, como poderá chegar ao lugar amplo sem passar pelo lugar estreito?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volens voluerit
  choice: deseja
  rationale: A duplicação latina intensifica a vontade, mas, em português natural, o presente «deseja» expressa adequadamente a condição sem acrescentar uma ênfase possivelmente excessiva.
- source_word: ingredi mare
  choice: entrar no mar
  rationale: Mantém o objeto de «entrar» e reproduz diretamente a imagem espacial do latim.
- source_word: videre eum
  choice: vê-lo
  rationale: O pronome masculino retoma «mar», preservando a referência do latim.
- source_word: dominari eius
  choice: dominá-lo
  rationale: Expressa a ideia de exercer domínio sobre o mar; a regência latina é incomum, mas o sentido é claro no contexto.
- source_word: angustum
  choice: lugar estreito
  rationale: O adjetivo substantivado indica uma passagem ou espaço estreito; «lugar estreito» torna a imagem clara sem especificá-la além do texto.
- source_word: in latitudinem
  choice: ao lugar amplo
  rationale: Traduz o contraste espacial com «lugar estreito» em português corrente, evitando o abstrato pouco natural «à largura».
theological_decisions:
- issue: Imagem do caminho estreito para o espaço amplo
  choice: Preservar a imagem espacial sem explicação interpretativa
  alternative: Explicitar a passagem como sofrimento presente e salvação futura
  rationale: O versículo apresenta uma analogia cuja aplicação é desenvolvida pelo contexto; inserir sua interpretação aqui eliminaria a tensão retórica do texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura retórica próxima do latim. A repetição simétrica «lugar amplo / lugar estreito» preserva o contraste e evita formulações abstratas.
