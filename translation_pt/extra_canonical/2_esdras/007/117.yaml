source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim prodest omnibus in praesenti vivere in tristitia et mortuos sperare punitionem?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/117.yaml
  text: For what does it profit all to live in sorrow in the present and[a], when dead, to expect punishment?
translation:
  language: pt
  text: Pois, que proveito há para todos[a] em viver, no presente, na tristeza e, quando mortos, esperar punição?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “em todos viverem”.'
    reason: O dativo omnibus liga-se naturalmente a “que proveito há”, mas os mesmos indivíduos também são o sujeito implícito dos infinitivos; a alternativa torna explícita essa relação sintática.
lexical_decisions:
- source_word: Quid enim prodest
  choice: Pois que proveito há
  rationale: Reproduz a pergunta retórica e o valor explicativo de enim em português natural.
- source_word: omnibus
  choice: para todos
  rationale: Mantém diretamente o dativo latino, sem acrescentar “homens” nem restringir a referência universal.
- source_word: in praesenti
  choice: no presente
  rationale: Preserva o contraste temporal e escatológico entre o presente e o futuro, em vez de reduzi-lo ao simples advérbio “agora”.
- source_word: vivere in tristitia
  choice: viver na tristeza
  rationale: Expressa de modo claro e digno a condição contínua indicada pelo infinitivo e pela locução latina.
- source_word: mortuos
  choice: quando mortos
  rationale: Reflete diretamente o predicativo latino, sem explicitar além da fonte uma sequência como “depois da morte”.
- source_word: sperare punitionem
  choice: esperar o castigo
  rationale: Aqui sperare significa aguardar ou ter por expectativa, não desejar; “castigo” comunica punitionem em linguagem corrente.
theological_decisions:
- issue: Relação entre a vida presente e o castigo na morte
  choice: “no presente” e “quando mortos”
  alternative: “agora” e “depois da morte”
  rationale: A tradução mantém o contraste escatológico do texto e evita definir com maior precisão do que o latim tanto a natureza do presente quanto a cronologia do castigo.
- issue: Alcance de omnibus
  choice: “para todos”
  alternative: “para todos os homens”
  rationale: O latim diz apenas “todos”; não se acrescenta uma especificação de gênero ou classe ausente da fonte.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conserva-se “no presente” por sua relevância no contraste apocalíptico do contexto, embora seja uma formulação um pouco mais marcada do que “agora”.
