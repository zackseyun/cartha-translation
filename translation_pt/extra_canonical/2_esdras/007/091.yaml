lexical_decisions:
- source_word: Imprimis
  choice: Primeiro
  rationale: Reproduz a abertura ordinal que introduz a primeira das etapas ou ordens descritas no contexto.
- source_word: uident cum exultatione multa
  choice: veem com grande alegria
  rationale: Expressa naturalmente a visão acompanhada de intensa exultação, sem enfraquecer a força de «multa».
- source_word: gloriam eius qui suscipit eas
  choice: a glória daquele que as recebe
  rationale: Mantém a construção relacional do latim e o referente feminino plural de «eas», retomado por «elas/as» no contexto.
theological_decisions:
- issue: Identidade daquele que recebe as almas
  choice: daquele que as recebe
  alternative: de Deus, que as recebe
  rationale: O texto latino não explicita o referente; a formulação escolhida preserva essa referência implícita e evita acrescentar uma identificação interpretativa.
translation_notes:
  register: Português atual, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. «Sermo» não foi traduzido aqui porque, conforme a segmentação da edição fornecida, conclui o versículo anterior.
