  yaml_path: translation/extra_canonical/2_esdras/007/123.yaml
  text: And because paradise will be shown, whose fruit remains incorruptible, in which there is fullness and healing,
translation:
  language: pt
  text: E porque o paraíso será mostrado, cujo fruto permanece incorruptível, no qual há fartura e cura,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  choice: porque
  rationale: Expressa o valor causal do latim, em vez de introduzir uma condição.
- source_word: paradisus
  choice: paraíso
  rationale: Equivalente direto, corrente e apropriado ao registro bíblico.
- source_word: incorruptus
  choice: incorruptível
  rationale: Preserva a ideia de um fruto não sujeito à corrupção ou deterioração.
- source_word: saturitas
  choice: fartura
  rationale: Comunica abundância capaz de satisfazer plenamente, com naturalidade em português.
- source_word: medella
  choice: cura
  rationale: Reproduz de modo claro o sentido de remédio, restauração ou cura.
theological_decisions:
- issue: Relação lógica introduzida por quoniam
  choice: porque
  alternative: se
  rationale: O texto latino apresenta uma razão, não uma condição; a tradução mantém essa relação sem reinterpretá-la.
- issue: Natureza da saturitas no paraíso
  choice: fartura
  alternative: plenitude
  rationale: “Fartura” preserva o sentido concreto de satisfação abundante sem impor uma noção teológica abstrata.
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência bíblica. A ordem relativa de “cujo fruto” foi preservada por clareza e proximidade formal; “e nele há” torna natural em português a construção latina in quo est.
