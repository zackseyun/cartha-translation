  yaml_path: translation/extra_canonical/2_esdras/007/079.yaml
  text: to him who gave it[a], to worship the glory of the Most High first of all. And if indeed it is one of those who have spurned and have not kept the way of the Most High, and of those who have despised the law,
translation:
  language: pt
  text: àquele que a deu, para adorar antes de tudo a glória do Altíssimo. E, se de fato ela for uma das que rejeitaram e não guardaram o caminho do Altíssimo, e das que desprezaram a lei,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad eum qui dedit
  choice: àquele que a deu
  rationale: Reproduz o fragmento sintaticamente dependente que encerra a unidade anterior; o pronome feminino retoma naturalmente “alma” no contexto.
- source_word: adorare
  choice: adorar
  rationale: Expressa diretamente o culto prestado à glória do Altíssimo, em registro bíblico natural.
- source_word: primum
  choice: antes de tudo
  rationale: Traduz o valor adverbial de prioridade, evitando a formulação menos natural “primeiro”.
- source_word: spreuerunt
  choice: rejeitaram
  rationale: Comunica desprezo acompanhado de recusa deliberada, sem ampliar o sentido.
- source_word: non seruauerunt
  choice: não guardaram
  rationale: “Guardar o caminho” preserva a metáfora e é uma construção bíblica clara em português.
- source_word: contempserunt
  choice: desprezaram
  rationale: Equivalente direto que mantém a força negativa distinta de “rejeitaram”.
- source_word: legem
  choice: a lei
  rationale: Mantém a ausência de possessivo no trecho latino fornecido, sem inserir “dele” por inferência contextual.
theological_decisions:
- issue: Referente feminino implícito em «esset eorum»
  choice: ela for uma das que
  alternative: for uma daquelas pessoas que
  rationale: O contexto fala da alma; o feminino preserva essa referência sem introduzir “pessoa”, ausente no latim.
- issue: Trecho atravessa os limites editoriais dos versículos
  choice: Traduzir exatamente o segmento latino fornecido, ainda que comece com o fim da unidade anterior e termine no meio de uma enumeração
  alternative: Restaurar os limites tradicionais de 7:79 com material dos segmentos adjacentes
  rationale: A tradução deve corresponder à evidência-fonte apresentada; completar ou remover material alteraria o segmento solicitado.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência bíblica. A abertura e o encerramento fragmentários foram mantidos porque refletem o recorte latino fornecido. Nenhum marcador de nota foi usado, pois não há nota textual necessária para esta redação.
