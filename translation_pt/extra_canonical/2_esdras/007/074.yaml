lexical_decisions:
- source_word: longanimitatem habuit
  choice: tem sido paciente
  rationale: Expressa em português atual a ideia de longanimidade ou tolerância prolongada, sem recorrer ao termo menos comum «longanimidade».
- source_word: saeculum
  choice: esta era
  rationale: Preserva o sentido temporal e escatológico de «era», em vez de reduzir a expressão ao mundo físico.
- source_word: prouidit
  choice: previu
  rationale: Neste contexto, traduz o sentido de ver ou conhecer antecipadamente, em consonância com a leitura contextual do texto latino.
- source_word: inueni gratiam
  choice: encontrei favor
  rationale: Mantém a fórmula bíblica de obter aceitação ou benevolência diante de alguém.
theological_decisions:
- issue: Razão da paciência do Altíssimo
  choice: não por causa deles, mas por causa dos tempos que ele previu
  alternative: não por causa deles, mas por causa dos tempos que ele estabeleceu
  rationale: A formulação mantém a distinção do latim entre os habitantes da era e os tempos previstos, sem acrescentar uma doutrina específica de predestinação.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural. A frase final permanece aberta porque o trecho fornecido termina no meio da fala.
