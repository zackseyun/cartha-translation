  text: For how long has the Most High shown long-suffering to those who inhabit the age—not for their sake, but because of the times that he has foreseen! And I answered and said, “If I have found favor
translation:
  language: pt
  text: 'Pois por quanto tempo o Altíssimo tem sido paciente com os que habitam esta era — não por causa deles, mas por causa dos tempos que ele previu! E eu respondi: “Se encontrei favor'
