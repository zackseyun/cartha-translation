lexical_decisions:
- source_word: æramentum
  choice: bronze
  rationale: Termo natural e tradicional para a liga metálica; no contexto da enumeração de metais, comunica melhor o referente do que uma tradução excessivamente técnica.
- source_word: fictile
  choice: barro
  rationale: O substantivo latino designa material ou objeto moldado de argila; aqui, na série de materiais, «barro» é claro e idiomático.
- source_word: Multiplicatur ... super
  choice: é mais abundante do que
  rationale: No contexto comparativo, expressa aumento ou maior quantidade, e não simples superioridade de valor.
