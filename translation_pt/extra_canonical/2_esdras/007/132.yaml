source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: scio, domine, quoniam nunc vocatus est Altissimus misericors, in eo quod misereatur qui nondum in saeculo advenerunt,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/132.yaml
  text: And I answered and said[a], “I know, Lord, that the Most High is now called merciful because he has mercy on those who have not yet come into the age,”
translation:
  language: pt
  text: 'Então respondi e disse: “Sei, Senhor, que o Altíssimo é agora chamado misericordioso, porque tem misericórdia dos que ainda não vieram ao mundo[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vieram para esta era”.'
    reason: Preserva a leitura mais literal de saeculum e sua possível ressonância escatológica, embora “vieram ao mundo” seja mais idiomático no contexto.
lexical_decisions:
- source_word: in saeculo advenerunt
  choice: vieram ao mundo
  rationale: Neste contexto, a expressão latina funciona naturalmente como referência à entrada na existência humana, isto é, ao nascimento. A formulação portuguesa é clara e idiomática, enquanto a nota preserva a possibilidade de leitura mais literal e escatológica.
- source_word: misericors / misereatur
  choice: misericordioso / tem misericórdia
  rationale: Mantém a repetição lexical deliberada do latim e a relação explícita entre o título atribuído ao Altíssimo e sua ação.
- source_word: nunc vocatus est
  choice: é agora chamado
  rationale: Reproduz o valor temporal de nunc e a construção passiva sem interpretar quem lhe dá esse nome.
- source_word: Et respondi et dixi
  choice: Então respondi e disse
  rationale: Conserva os dois verbos da fórmula narrativa latina, usando uma ligação natural em português.
theological_decisions:
- issue: Sentido de saeculum na expressão in saeculo advenerunt
  choice: 'Texto principal: “vieram ao mundo”'
  alternative: “vieram para esta era”
  rationale: A expressão pode designar idiomaticamente o ingresso na vida humana, mas saeculum também participa do horizonte escatológico das eras em 4 Esdras. O texto principal privilegia a expressão natural, e a nota conserva a tensão lexical.
- issue: Fundamento de o Altíssimo ser chamado misericordioso
  choice: 'Manter a relação causal explícita: “porque tem misericórdia”'
  alternative: Parafrasear como uma qualidade geral de Deus
  rationale: O latim vincula diretamente o título misericors à ação expressa por misereatur; a tradução mantém essa afirmação sem ampliar sua interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição “misericordioso / misericórdia” e a fórmula “respondi e disse” foram mantidas por sua relevância textual. A vírgula final indica que a fala prossegue no versículo seguinte.
