source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: praesens saeculum non est finis, gloria in eo non frequens manet, propter hoc oraverunt qui potuerunt pro invalidis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/112.yaml
  text: And he answered me and said[a], “The present age is not the end; glory does not remain in it continually. Therefore those who were able prayed for the weak.
translation:
  language: pt
  text: 'E ele me respondeu e disse: “A era presente não é o fim; nela, a glória não permanece continuamente.[a] Por isso, os que puderam oraram pelos fracos.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nela, a glória não permanece frequentemente”.'
    reason: O latim frequens pode salientar frequência, embora o contexto favoreça a ideia de continuidade ou permanência.
lexical_decisions:
- source_word: praesens saeculum
  choice: a era presente
  rationale: Expressa o período ou ordem presente em contraste escatológico com o fim, sem sugerir apenas um século cronológico.
- source_word: finis
  choice: o fim
  rationale: Mantém a formulação escatológica direta e a amplitude do termo latino.
- source_word: gloria
  choice: a glória
  rationale: Preserva o termo teologicamente amplo sem especificar indevidamente se se trata de glória divina, humana ou futura.
- source_word: non frequens manet
  choice: não permanece continuamente
  rationale: No contexto, comunica a falta de permanência da glória na era presente; também preserva o verbo manet, enquanto a nota registra a leitura mais estritamente ligada ao valor de frequência de frequens.
- source_word: qui potuerunt
  choice: os que tinham condições
  rationale: Reproduz a ideia dos que podiam fazê-lo sem acrescentar uma capacidade específica ausente no texto.
- source_word: invalidis
  choice: pelos fracos
  rationale: Termo natural e abrangente para pessoas sem força ou capacidade, sem restringir o sentido a doença física.
theological_decisions:
- issue: Natureza da glória na era presente
  choice: Não identificar de quem é a glória nem definir sua manifestação
  alternative: Explicitar como glória de Deus ou glória futura
  rationale: O latim diz apenas gloria; qualquer identificação mais precisa resolveria uma ambiguidade genuína do texto.
- issue: Identidade dos fracos
  choice: Manter a designação geral “os fracos”
  alternative: Interpretar como pecadores, enfermos ou espiritualmente débeis
  rationale: Invalidis não determina uma categoria teológica ou física específica.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe direta. “Era presente” evita o sentido cronológico estreito de “século presente”, e “tinham condições” transmite capacidade sem soar arcaico.
