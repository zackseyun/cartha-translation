  text: nec enim sciunt cruciamenta nec salutem post mortem repromissam sibi. Nobis autem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/067.yaml
  text: for they do not know torments[a], nor the salvation promised to them after death. But as for us,
translation:
  language: pt
  text: pois eles não conhecem os tormentos[a], nem a salvação que lhes foi prometida depois da morte. Nós, porém,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uma tradução anterior trazia aqui: “Mas de que nos aproveita sermos preservados com vida, se somos atormentados com tormento?”. Essas palavras correspondem ao início do versículo seguinte.'
    reason: previous_rendering
lexical_decisions:
- source_word: cruciamenta
  choice: os tormentos
  rationale: O plural latino designa sofrimentos ou castigos intensos; “tormentos” preserva o número e a força do termo sem especificar uma modalidade não expressa.
- source_word: salutem
  choice: a salvação
  rationale: Equivalente direto e natural de “salutem”, adequado ao contraste com “tormentos”.
- source_word: repromissam sibi
  choice: que lhes foi prometida
  rationale: Expressa com naturalidade a construção passiva e mantém “sibi” como referência aos mesmos indivíduos do sujeito de “sciunt”.
- source_word: Nobis autem
  choice: Nós, porém,
  rationale: Mantém a transição contrastiva e a frase deliberadamente incompleta no limite do versículo.
theological_decisions:
- issue: Relação entre morte, tormentos e salvação
  choice: 'Manter a coordenação literal: eles não conhecem nem os tormentos nem a salvação prometida depois da morte.'
  alternative: Explicitar que tanto os tormentos quanto a salvação ocorrem depois da morte.
  rationale: No latim, “post mortem” modifica diretamente a salvação prometida; estender a expressão também aos tormentos resolveria uma relação sintática que o texto não explicita.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe simples. A vírgula final preserva a transição inacabada “Nobis autem” e sinaliza que o pensamento continua no versículo seguinte.
