  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/124.yaml
  text: but we will not enter[a], for we have lived in ungrateful places?
translation:
  language: pt
  text: Mas nós não entraremos, pois vivemos em lugares desagradáveis[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: inóspitos; literalmente, “ingratos”.'
    reason: O latim ingratis pode descrever lugares desagradáveis, pouco acolhedores ou inóspitos; a nota preserva sua forma mais literal.
lexical_decisions:
- source_word: ingrediemur
  choice: entraremos
  rationale: Mantém o futuro do indicativo latino e não acrescenta um objeto que o texto não expressa.
- source_word: ingratis locis
  choice: lugares desagradáveis
  rationale: Nesse contexto, ingratus qualifica os lugares como pouco aprazíveis, hostis ou inóspitos; “desagradáveis” comunica esse sentido com naturalidade, sem impor a ideia moral de “vergonhosos”.
- source_word: conversati sumus
  choice: vivemos
  rationale: O perfeito de conversari aqui indica ter vivido ou permanecido em certos lugares; “vivemos” é claro e idiomático.
theological_decisions:
- issue: Relação causal e força interrogativa da frase
  choice: “pois vivemos...?”
  alternative: “porque vivemos...?”
  rationale: Preserva a pergunta retórica e a ligação causal expressa por enim sem explicar ou resolver a tensão do argumento.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A ordem foi mantida próxima do latim, e nenhum objeto foi acrescentado ao verbo “entraremos”.
