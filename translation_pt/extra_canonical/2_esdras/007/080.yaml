  text: eius, et eorum qui oderunt eos qui timent eum, Haec inspirationes in habitationes non
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/080.yaml
  text: these spirits will not enter habitations[a], but will wander from now on in torments, always grieving and sad, in seven ways.
translation:
  language: pt
  text: Esses espíritos não entrarão em habitações[a], mas, de agora em diante, vagarão em tormentos, sempre aflitos e tristes, de sete maneiras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Tais espíritos não entrarão em habitações, mas, de agora em diante, vagarão em tormentos, sempre aflitos e tristes”.'
    reason: Registra a tradução anterior e a possibilidade de entender o demonstrativo de modo qualitativo; a expressão “de sete maneiras” permanece no texto principal por introduzir estruturalmente a enumeração seguinte.
lexical_decisions:
- source_word: Haec inspirationes
  choice: Esses espíritos
  rationale: O latim transmitido apresenta uma construção incomum, mas o contexto trata dos espíritos dos ímpios após a morte. “Esses” preserva o valor demonstrativo de “Haec” sem o generalizar como “tais”.
- source_word: in habitationes
  choice: em moradas
  rationale: Mantém a imagem espacial e o plural do latim, com linguagem natural e digna em português.
- source_word: amodo
  choice: de agora em diante
  rationale: Expressa com clareza o início e a continuidade da condição descrita.
- source_word: in tormentis
  choice: em tormentos
  rationale: Tradução direta que preserva a força do termo e evita explicação teológica adicional.
- source_word: dolentes semper et tristes
  choice: sempre aflitos e tristes
  rationale: Reproduz os dois aspectos emocionais sem fundi-los; “aflitos” soa mais natural aqui do que o literal “doloridos”.
- source_word: per septem vias
  choice: por sete caminhos
  rationale: Preserva a fórmula estrutural que introduz as sete modalidades enumeradas nos versículos seguintes.
theological_decisions:
- issue: Identidade e destino pós-morte dos sujeitos
  choice: “Esses espíritos” e a descrição de que não entrarão em moradas, mas vagarão em tormentos
  alternative: Explicitar “as almas dos ímpios” ou definir a natureza das “moradas”
  rationale: A tradução conserva a terminologia e a tensão do texto sem impor uma antropologia ou escatologia denominacional.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. A redação segue prioritariamente a evidência latina restaurada do fragmento de Bensly, incluindo “por sete caminhos”, ausente no trecho latino truncado fornecido, mas atestado no fragmento e necessário à sequência imediata.
