  text: Mas eles não creram nele, nem nos profetas que vieram depois dele, nem mesmo em mim, que lhes falei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: crediderunt
  choice: creram
  rationale: Mantém o sentido direto de confiar ou dar crédito, com formulação bíblica natural em português.
- source_word: post eum prophetis
  choice: nos profetas que vieram depois dele
  rationale: Explicita a relação temporal expressa por post eum sem acrescentar identificação ausente no texto latino.
- source_word: locutus sum ad eos
  choice: falei com eles
  rationale: Reproduz de modo natural a ação de dirigir-lhes a palavra; evita o menos idiomático «falei a eles».
theological_decisions:
- issue: Identidade dos referentes de «nele» e «em mim»
  choice: Preservar os pronomes sem identificar seus referentes no versículo
  alternative: Substituir os pronomes por nomes ou títulos inferidos do contexto
  rationale: O texto latino emprega apenas ei e mihi; explicitar identidades resolveria uma referência que este versículo deixa dependente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «nem» preserva a progressão enfática do latim.
