source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si ergo modo, quando corruptibile increvit et iniustitia multiplicata est, exoraverunt iusti pro impiis quare et tunc sic non erit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/111.yaml
  text: If then now[a], when corruption has increased and unrighteousness has multiplied, the righteous prayed for the ungodly, why will it not also be so then?”
translation:
  language: pt
  text: Se, portanto, agora, quando a corrupção aumentou e a injustiça se multiplicou, os justos intercederam pelos ímpios, por que não será assim também naquele tempo?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por que não será assim naquele tempo?”'
    reason: O latim “et” em “et tunc” tem naturalmente força aditiva (“também”), mas pode ser entendido de modo menos explícito na fluência da pergunta.
lexical_decisions:
- source_word: corruptibile
  choice: a corrupção
  rationale: Embora o latim use literalmente o neutro substantivado “o que é corruptível”, no contexto a ideia é o avanço da corrupção; esta formulação é natural em português e concorda com o paralelismo com a injustiça.
- source_word: exoraverunt
  choice: intercederam
  rationale: O verbo, acompanhado de “pro impiis”, indica súplica em favor de outros; “intercederam pelos” expressa isso com clareza e dignidade.
- source_word: impiis
  choice: ímpios
  rationale: Mantém o contraste moral e religioso com “os justos” sem acrescentar uma definição denominacional.
- source_word: et tunc
  choice: também naquele tempo
  rationale: Preserva tanto o valor aditivo de “et” (“também”) quanto o sentido temporal de “tunc” (“naquele tempo”).
theological_decisions:
- issue: Intercessão dos justos pelos ímpios no tempo futuro
  choice: Preservar a pergunta de Ezra sem explicar se essa intercessão será possível ou eficaz naquele tempo
  alternative: Resolver a pergunta segundo uma doutrina específica sobre o juízo e a intercessão após a morte
  rationale: O texto formula uma tensão teológica por meio de uma pergunta; a tradução não deve antecipar nem impor sua resposta.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. “Naquele tempo” evita a possível ambiguidade de “então” e mantém o contraste entre o presente e o tempo futuro mencionado no contexto.
