  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: beati praesentes et obseruantes quae a te constituta sunt; Sed et [de] quibus erat oratio mea, quis enim est de praesentibus, qui non peccauit, uel quis natus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/046.yaml
  text: Blessed are those who are present and keep what has been established by you. But as for those about whom my prayer was made, who indeed is there among those now present who has not sinned, or what one born has not transgressed your covenant?
translation:
  language: pt
  text: Felizes os que estão presentes e guardam o que estabeleceste. Mas, quanto àqueles de quem tratava minha oração, quem, entre os presentes, não pecou? Ou quem nasceu e não transgrediu tua aliança?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: beati
  choice: Felizes
  rationale: Expressa naturalmente a bem-aventurança do latim sem recorrer a uma formulação excessivamente técnica.
- source_word: praesentes
  choice: os que agora vivem
  rationale: No contexto, refere-se aos seres humanos da geração presente, não apenas a pessoas fisicamente presentes diante do interlocutor.
- source_word: obseruantes
  choice: guardam
  rationale: Verbo corrente na linguagem bíblica para observar e cumprir aquilo que Deus determinou.
- source_word: quae a te constituta sunt
  choice: o que estabeleceste
  rationale: Reproduz a construção passiva latina em português natural, preservando Deus como agente.
- source_word: de quibus erat oratio mea
  choice: àqueles pelos quais fiz minha oração
  rationale: Mantém o sentido intercessório de oratio neste contexto e a referência pessoal do pedido anterior.
- source_word: peccauit
  choice: pecou
  rationale: Equivalente direto e teologicamente não interpretativo.
- source_word: quis natus
  choice: que pessoa nascida
  rationale: Conserva a formulação abrangente do texto, sem restringi-la ao sexo masculino.
- source_word: testamentum tuum
  choice: tua aliança
  rationale: No uso bíblico, testamentum frequentemente traduz a ideia de aliança; 'testamento' seria enganoso para o leitor moderno neste contexto.
theological_decisions:
- issue: Alcance de 'praesentes'
  choice: os que agora vivem
  alternative: os que estão presentes
  rationale: A pergunta trata da pecaminosidade universal entre os vivos; a escolha comunica esse alcance contextual sem transformar a frase em afirmação sobre presença física.
- issue: Caráter absoluto das perguntas retóricas
  choice: nunca pecou / nunca transgrediu
  alternative: não pecou / não transgrediu
  rationale: Em português, 'nunca' torna explícito o valor existencial da pergunta latina, sem acrescentar uma conclusão doutrinária além da retórica do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário bíblico amplamente reconhecível. As duas perguntas foram separadas para dar fluidez, preservando o paralelismo e a tensão retórica.
