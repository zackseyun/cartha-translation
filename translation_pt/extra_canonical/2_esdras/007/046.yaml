revisions:
- from: Felizes os que agora vivem e guardam o que estabeleceste. Mas, quanto àqueles pelos quais fiz minha oração, quem, dentre os que agora vivem, nunca pecou? Ou que pessoa nascida nunca transgrediu tua aliança?
  to: Felizes os que estão presentes e guardam o que estabeleceste. Mas, quanto àqueles de quem tratava minha oração, quem, entre os presentes, não pecou? Ou quem nasceu e não transgrediu tua aliança?
  rationale: A revisão restaura a ambiguidade de praesentes por meio de «presentes», evita a intensificação introduzida por «nunca» e ajusta a referência à oração ao enunciado latino. «Quem nasceu» transmite de modo idiomático e abrangente quis natus, sem restringi-lo a um sexo.
  reviewer_model: gpt-5.6-terra
