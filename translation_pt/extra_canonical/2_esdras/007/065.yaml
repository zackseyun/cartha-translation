  text: et propter hoc torquemur, quoniam scientes perimus. Lugeat hominum genus, et agrestes bestiae laetentur, lugeant omnes qui nati sunt, quadripedia uero et pecora
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/065.yaml
  text: And because of this we are tormented, because though we know, we perish. Let the race of man mourn, and let the beasts of the field rejoice; let all who have been born lament, but let the four-footed animals and the cattle be glad.
translation:
  language: pt
  text: E por causa disso somos atormentados, porque, embora saibamos, perecemos. Que o gênero humano chore, e que os animais selvagens se alegrem; lamentem todos os que nasceram, mas alegrem-se os quadrúpedes e o gado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: torquemur
  choice: somos atormentados
  rationale: Mantém o sentido forte e passivo do verbo latino, sem restringi-lo a sofrimento físico ou psicológico.
- source_word: scientes
  choice: embora saibamos
  rationale: 'Expressa naturalmente em português o valor concessivo do particípio no contexto: o conhecimento não impede a perdição.'
- source_word: hominum genus
  choice: o gênero humano
  rationale: Reproduz a referência coletiva a toda a humanidade em registro digno e corrente.
- source_word: agrestes bestiae
  choice: os animais selvagens
  rationale: Distingue os animais não domesticados dos quadrúpedes e rebanhos mencionados depois.
- source_word: quadripedia
  choice: os quadrúpedes
  rationale: Equivalente direto e compreensível para os animais de quatro patas.
- source_word: pecora
  choice: os rebanhos
  rationale: No contexto, designa coletivamente os animais domésticos de criação; “rebanhos” preserva esse caráter coletivo.
theological_decisions:
- issue: Relação entre conhecimento e perdição
  choice: “porque, embora saibamos, perecemos”
  alternative: “porque perecemos sabendo”
  rationale: A formulação concessiva acompanha a leitura contextual refletida na fonte de consulta e conserva a tensão de que o conhecimento não livra os seres humanos da perdição, sem explicar sua causa teológica.
- issue: Verbo elíptico na cláusula final
  choice: Repetir “alegrem-se”
  alternative: Manter apenas “mas os quadrúpedes e os rebanhos”
  rationale: O latim omite o verbo na última cláusula, mas ele é claramente recuperado do paralelo anterior; explicitá-lo produz uma frase completa e natural em português sem acrescentar novo conteúdo.
translation_notes:
  register: Português moderno, internacional e de fácil leitura no Brasil, com tom solene apropriado ao lamento. A alternância entre “chore”, “se alegrem” e “lamentem” preserva o paralelismo e evita rigidez excessiva.
