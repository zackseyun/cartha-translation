source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post dies septem, et excitabitur qui nondum vigilat saeculum et morietur corruptum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/031.yaml
  text: And after seven days, the age that is not yet awake will be awakened, and what is corrupt will die.
translation:
  language: pt
  text: E, depois de sete dias, a era que ainda não está desperta será despertada, e o que está corrompido morrerá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: a era
  rationale: No contexto escatológico, traduz o sentido temporal de saeculum de modo natural, sem restringi-lo a “mundo” nem ao período fixo de um século.
- source_word: excitabitur ... nondum vigilat
  choice: que ainda não está desperta será despertada
  rationale: Preserva a imagem e a repetição semântica do latim, bem como o caráter passivo de excitabitur.
- source_word: corruptum
  choice: o que está corrompido
  rationale: Reflete o neutro substantivado e a condição expressa pelo latim, evitando substituí-la pela ideia distinta de mera corruptibilidade.
theological_decisions:
- issue: Referente de saeculum e corruptum
  choice: 'Manter formulações gerais: “a era” e “o que está corrompido”'
  alternative: Explicitar “o mundo futuro” e “o mundo corrupto” ou “os corruptíveis”
  rationale: O latim não identifica de modo inequívoco esses referentes; a tradução preserva a ambiguidade e a tensão escatológica em vez de impor uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A estrutura paralela e a imagem de despertar foram preservadas.
