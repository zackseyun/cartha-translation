source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam super stellas fulgebunt facies eorum qui abstinentiam habuerunt, nostrae vero facies super tenebras nigrae?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/125.yaml
  text: And because the faces of those who practiced self-control will shine above the stars[a], but our faces will be blacker than darkness?
translation:
  language: pt
  text: E já que os rostos dos que tiveram domínio próprio brilharão mais que as estrelas[a], mas os nossos serão mais negros que as trevas?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «acima das estrelas».
    reason: Preserva a leitura espacial formalmente possível de super stellas, embora o paralelismo com «mais negros que as trevas» favoreça o sentido comparativo.
lexical_decisions:
- source_word: quoniam
  choice: já que
  rationale: Expressa o valor causal de quoniam sem confundi-lo com o interrogativo português «por que» e preserva a frase como pergunta retórica ligada ao contexto.
- source_word: facies eorum / nostrae facies
  choice: o rosto dos que / o nosso
  rationale: O latim usa plurais distributivos; o singular coletivo é mais natural em português e mantém a referência ao rosto de cada grupo.
- source_word: abstinentiam habuerunt
  choice: exerceram autocontrole
  rationale: Comunica a prática continuada de contenção ou domínio de si, sem restringir o sentido a uma forma específica de abstinência.
- source_word: super stellas fulgebunt
  choice: brilhará mais que as estrelas
  rationale: Super com acusativo funciona aqui naturalmente como comparação, em paralelo com super tenebras nigrae; a nota conserva a leitura espacial formalmente possível.
- source_word: super tenebras nigrae
  choice: mais negro que as trevas
  rationale: Reproduz a comparação enfática e o paralelismo com o brilho superior ao das estrelas.
theological_decisions:
- issue: Natureza do autocontrole mencionado
  choice: autocontrole em sentido amplo
  alternative: abstinência ascética específica
  rationale: Abstinentia pode abranger contenção e domínio próprio; o versículo não identifica uma prática ascética particular.
- issue: Sentido de super stellas
  choice: 'comparativo: mais que as estrelas'
  alternative: 'espacial: acima das estrelas'
  rationale: O paralelismo com «mais negro que as trevas» favorece a leitura comparativa, mas a formulação latina permite que a alternativa espacial seja registrada em nota.
translation_notes:
  register: Português moderno, claro e digno, com construção causal adequada à pergunta retórica. Preferiu-se o singular coletivo para evitar uma formulação pesada, sem alterar a referência distributiva do plural latino.
