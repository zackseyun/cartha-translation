  yaml_path: translation/extra_canonical/2_esdras/007/017.yaml
  text: Then I answered and said[a], “O sovereign Lord, behold, you have ordained in your law that the righteous will inherit these things[b], but the ungodly will perish.
translation:
  language: pt
  text: 'Então respondi e disse: “Ó Senhor Soberano, eis que estabeleceste em tua lei que os justos herdarão estas coisas, mas os ímpios perecerão.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Ó Soberano Senhor
  rationale: Traduz o duplo vocativo latino como um título solene e natural em português, preservando a ideia de autoridade soberana.
- source_word: ecce
  choice: eis que
  rationale: Mantém o marcador retórico que chama atenção para a premissa extraída da lei.
- source_word: disposuisti
  choice: estabeleceste
  rationale: No contexto de uma determinação registrada na lei, expressa adequadamente o ato de dispor ou ordenar sem acrescentar uma nuance denominacional.
- source_word: iusti
  choice: os justos
  rationale: Equivalente direto e corrente para a categoria moral indicada pelo latim.
- source_word: haec
  choice: estas coisas
  rationale: Preserva a referência demonstrativa ampla e sua possível ambiguidade contextual.
- source_word: impii
  choice: os ímpios
  rationale: Mantém o contraste moral e teológico explícito com os justos.
- source_word: peribunt
  choice: perecerão
  rationale: Reproduz o sentido futuro do verbo latino sem especificar a natureza do perecimento.
theological_decisions:
- issue: Natureza da herança e do perecimento
  choice: Manter as formulações gerais “herdarão estas coisas” e “perecerão”
  alternative: Explicitar o conteúdo da herança ou interpretar o perecimento como uma forma específica de juízo
  rationale: O versículo não define aqui nem o referente completo de “estas coisas” nem a natureza exata do perecimento; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, solene e acessível. A construção “respondi e disse” foi mantida para refletir a fórmula narrativa enfática do latim; “Ó Soberano Senhor” conserva o caráter formal da invocação.
