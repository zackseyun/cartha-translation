source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem data dabitur civitas homini in hereditatem, si non heres antepositum periculum pertransierit, quomodo accipiet hereditatem suam?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/009.yaml
  text: If a city is given to a man for an inheritance[a], if the heir does not pass through the danger set before him, how will he receive his inheritance?
translation:
  language: pt
  text: Se, porém, uma cidade for dada a alguém como herança, se o herdeiro não atravessar o perigo posto diante dele, como receberá a sua herança?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: autem
  choice: porém
  rationale: Marca a conexão contrastiva ou continuativa com o argumento anterior sem acrescentar um advérbio temporal inexistente.
- source_word: civitas
  choice: cidade
  rationale: Equivalente direto e natural para a imagem concreta empregada no texto.
- source_word: homini
  choice: a alguém
  rationale: Expressa o sentido indefinido de homini em português corrente, sem pressupor que o referente seja especificamente masculino.
- source_word: in hereditatem
  choice: como herança
  rationale: Formulação idiomática que preserva a ideia de a cidade ser concedida na condição de herança.
- source_word: heres
  choice: herdeiro
  rationale: Mantém a relação lexical explícita com hereditatem e hereditatem suam.
- source_word: antepositum periculum
  choice: o perigo posto diante dele
  rationale: Preserva a imagem de um perigo previamente colocado à frente do herdeiro.
- source_word: pertransierit
  choice: atravessar
  rationale: Transmite o movimento de passar por inteiro através do perigo, com a condição futura expressa naturalmente em português.
- source_word: accipiet hereditatem suam
  choice: receberá a sua herança
  rationale: Mantém o futuro e a relação possessiva explícita do latim.
theological_decisions:
- issue: Caráter condicional do recebimento da herança
  choice: Preservar as duas orações condicionais sem explicar sua aplicação teológica
  alternative: Reformular como declaração direta sobre mérito, salvação ou perseverança
  rationale: O versículo apresenta uma analogia em forma de pergunta; explicitar uma doutrina específica resolveria indevidamente a tensão do texto.
- issue: Ênfase possível em data dabitur
  choice: Traduzir de modo natural como “for dada”
  alternative: Acrescentar “certamente” ou “de fato será dada”
  rationale: Embora a duplicação verbal possa refletir uma construção enfática subjacente, o latim transmitido não exige um intensificador lexical, e acrescentá-lo tornaria a ênfase mais determinada do que a evidência permite.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem foi ajustada para a sintaxe natural do português, preservando o contraste de autem, a imagem da cidade-herança e a pergunta retórica.
