  text: et proposuerunt sibi circumventiones delictorum. et superdixeruntAltissimum non esse, et vias eius non cognoverunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/023.yaml
  text: and set before themselves schemes of sins, and even said that the Most High does not exist, and they did not know his ways.
translation:
  language: pt
  text: e elaboraram planos de pecado; chegaram até a dizer que o Altíssimo não existe e não conheceram os seus caminhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: proposuerunt sibi
  choice: puseram diante de si
  rationale: Reproduz de modo natural a ideia de colocar ou estabelecer algo perante si mesmos.
- source_word: circumventiones delictorum
  choice: as armadilhas dos pecados
  rationale: Preserva a imagem de engano ou cilada em circumventiones e o sentido moral de delictorum, sem definir se os pecados armam ciladas ou se são ciladas concebidas pelos próprios rebeldes.
- source_word: superdixerunt
  choice: chegaram até a dizer
  rationale: Expressa a força aditiva e intensificadora de super-, indicando um passo adicional na rebelião.
- source_word: Altissimum
  choice: o Altíssimo
  rationale: Mantém o título divino tradicional e transparente em português.
- source_word: vias eius
  choice: os caminhos dele
  rationale: Conserva a metáfora bíblica de vias como conduta, vontade e modo de agir de Deus.
theological_decisions:
- issue: Negação da existência do Altíssimo
  choice: que o Altíssimo não existe
  alternative: que não há Altíssimo
  rationale: Traduz diretamente non esse como negação de existência, sem atenuá-la para mera negação de autoridade ou presença.
- issue: Relação entre as ciladas e os pecados
  choice: as armadilhas dos pecados
  alternative: planos para pecar
  rationale: Mantém a construção genitiva e sua possível tensão sem determinar além do latim se os pecados são a origem, o conteúdo ou a natureza das armadilhas.
translation_notes:
  register: Português moderno, digno e acessível, com coordenação próxima do ritmo latino. O mais-que-perfeito composto foi evitado; o mais-que-perfeito simples liga naturalmente as ações ao contexto narrativo anterior.
