  text: let those times come[a], in which you will begin to renew the creation, or are we tormented from now on?” And he answered me and said, “I will show you this also; but as for you, do not mingle with them
translation:
  language: pt
  text: '“Que venham aqueles tempos em que começarás a renovar a criação[a], ou somos atormentados desde agora?” Ele me respondeu: “Também te mostrarei isto; tu, porém, não te mistures com eles.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a criatura”.
    reason: O substantivo latino creaturam pode referir-se tanto à criação como ordem criada quanto a uma criatura em particular.
lexical_decisions:
- source_word: ueniant
  choice: Que venham
  rationale: Expressa naturalmente em português o valor jussivo do presente do subjuntivo latino, sem reduzi-lo a simples futuro.
- source_word: creaturam
  choice: a criação
  rationale: Neste contexto apocalíptico, pode designar o conjunto da ordem criada; a alternativa mais individual, “a criatura”, é registrada em nota.
- source_word: amodo
  choice: desde agora
  rationale: Conserva o sentido temporal de sofrimento iniciado já no presente, em vez de sugerir apenas imediatismo pontual.
- source_word: commisceri
  choice: te mistures
  rationale: Reproduz o sentido reflexivo de associar-se ou confundir-se com um grupo, em linguagem atual e digna.
- source_word: tu autem
  choice: tu, porém
  rationale: Mantém tanto a ênfase do pronome expresso quanto o contraste introduzido por autem.
theological_decisions:
- issue: Alcance de creaturam
  choice: “a criação”, com nota alternativa
  alternative: “a criatura”
  rationale: O latim admite referência à ordem criada ou a uma criatura; o contexto favorece a renovação da criação, mas a ambiguidade lexical merece ser preservada em nota.
- issue: Referente de eis (“eles”)
  choice: Manter o pronome sem explicitar o grupo
  alternative: Identificar “eles” como os desprezadores ou os atormentados
  rationale: O trecho latino fornecido não nomeia o referente dentro deste versículo. Explicitá-lo importaria material do versículo seguinte e resolveria indevidamente a referência.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A fala inicial permanece como continuação de uma pergunta anterior, conforme a delimitação do texto-fonte. A fórmula latina “respondeu-me e disse” foi vertida simplesmente por “me respondeu”, evitando redundância pouco natural sem perda de conteúdo discursivo.
