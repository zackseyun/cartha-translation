base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/036.yaml
  text: And the pit of torment will appear[a], and opposite it will be the place of rest; and the furnace of Gehenna will be shown[b], and opposite it the paradise of delight.
translation:
  language: pt
  text: E aparecerá[a][b] o lago de tormento, e diante dele estará o lugar de descanso; e será mostrada a fornalha da Geena, e diante dela estará o paraíso de delícias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os versículos 7:36–105 constituem o chamado «Fragmento Perdido» de Bensly. Eles foram omitidos da maioria dos manuscritos latinos medievais — omissão por vezes relacionada ao ensino desta seção de que a intercessão pelos condenados é recusada — e, por isso, não aparecem na Vulgata nem na KJV de 1611. Nessas edições, o versículo 7:35 era seguido diretamente pelo trecho que as edições antigas numeravam como 7:36, cerca de setenta versículos adiante. Robert Bensly recuperou o fragmento de um manuscrito espanhol em 1875, e ele foi restaurado nas edições críticas modernas.
    reason: recovered_fragment
  - marker: b
    text: 'Ou: «Então aparecerá o lago de tormento».'
    reason: previous_rendering
lexical_decisions:
- source_word: lacus tormenti
  choice: lago de tormento
  rationale: Traduz diretamente o latim lacus, sem adotar «abismo» ou «poço» da camada inglesa.
- source_word: contra illum
  choice: diante dele
  rationale: Expressa a contraposição espacial de contra com naturalidade, preservando o paralelismo entre os destinos.
- source_word: locus requietionis
  choice: lugar de descanso
  rationale: Mantém o sentido concreto e escatológico de requietio em linguagem clara e digna.
- source_word: clibanus gehennae
  choice: fornalha da Geena
  rationale: «Fornalha» representa clibanus, e «Geena» conserva o nome tradicional sem o reduzir genericamente a «inferno».
- source_word: iucunditatis paradisus
  choice: paraíso de delícias
  rationale: Preserva o contraste com o tormento e reproduz a ideia de prazer ou deleite do texto latino restaurado.
theological_decisions:
- issue: Contraste escatológico entre tormento e descanso
  choice: Preservar imagens e lugares distintos, postos face a face
  alternative: Generalizar como céu e inferno
  rationale: O texto apresenta pares concretos — lago/lugar e fornalha/paraíso — e não autoriza sua substituição por uma sistematização doutrinária.
- issue: Geena
  choice: Transliterar como «Geena»
  alternative: Traduzir como «inferno»
  rationale: A transliteração mantém a referência específica e evita fundi-la com outros termos e conceitos escatológicos.
translation_notes:
  register: Português moderno, claro e solene, de ampla compreensão e com legibilidade brasileira. Conserva-se a sequência coordenada iniciada por «E», refletindo o Et latino e o ritmo polissindético do contexto. O paralelismo foi mantido com «diante dele/diante dela». O texto principal incorpora a continuação do versículo atestada pelo fragmento latino restaurado e refletida na camada inglesa auditada.
