  yaml_path: translation/extra_canonical/2_esdras/007/043.yaml
  text: of the glory of the Most High[a], by which all will begin to see what has been set before them[b]. A period
translation:
  language: pt
  text: da glória do Altíssimo, pela qual todos começarão a ver o que foi posto diante deles. Um período
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: claritatis Altissimi
  choice: da glória do Altíssimo
  rationale: No contexto escatológico, "claritas" exprime a glória ou esplendor do Altíssimo; "glória" é natural, digna e mantém a linguagem teológica do texto.
- source_word: unde
  choice: pela qual
  rationale: Retoma "glória" e expressa o meio pelo qual todos começarão a ver, sem transformar o relativo em mera indicação espacial.
- source_word: quae anteposita sunt
  choice: o que foi posto diante deles
  rationale: Preserva a construção passiva e a ideia de coisas apresentadas ou colocadas diante das pessoas.
- source_word: Spatium
  choice: Um período
  rationale: Como início truncado da frase seguinte, "período" comunica duração temporal sem completar o sentido ausente no fragmento fornecido.
theological_decisions:
- issue: Agente ou meio da visão universal
  choice: '"pela qual", fazendo da glória do Altíssimo o meio pelo qual todos veem'
  alternative: '"de onde", com possível sentido espacial ou causal'
  rationale: O antecedente imediato é "claritatis"; a formulação mantém a relação sintática e não acrescenta uma explicação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O fragmento termina deliberadamente em "Um período", pois "Spatium" inicia a oração seguinte e o restante não consta do texto-fonte fornecido. As notas inglesas [a] e [b] não correspondem ao conteúdo deste fragmento latino e, por isso, não foram importadas.
