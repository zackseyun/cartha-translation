revisions:
- from: 'E ele respondeu: “Este é o pensamento da luta que travou o ser humano nascido sobre a terra:[a]'
  to: 'E ele respondeu e disse: “Este é o pensamento da luta que o ser humano nascido na terra travou:[a]”'
  rationale: A revisão preserva mais plenamente a fórmula verbal do latim, melhora a sintaxe portuguesa e mantém o perfeito de certavit no texto principal. A nota conserva, de modo delimitado, a alternativa modal sem apresentar como leitura principal algo que o latim fornecido não exprime.
