  text: 'Et respondit et dixit: hoc est cogitamentum certaminis, quem certavit qui super terram natus est homo,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/127.yaml
  text: 'And he answered and said[a], “This is the thought of the struggle that the man born on the earth has fought:'
translation:
  language: pt
  text: 'E ele respondeu e disse: “Este é o pensamento da luta que o ser humano nascido na terra travou:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o pensamento da luta que o ser humano nascido na terra deve travar:”'
    reason: Registra a interpretação modal tradicional da construção, enquanto o texto principal segue o perfeito latino certavit («travou»).
lexical_decisions:
- source_word: cogitamentum
  choice: pensamento
  rationale: Mantém a correspondência direta com o latim e evita interpretar o termo como mera ‘explicação’ ou ‘sentido’.
- source_word: certaminis / certavit
  choice: luta / travou
  rationale: Reproduz a repetição etimológica do latim de modo natural em português e preserva o pretérito de certavit.
- source_word: homo
  choice: ser humano
  rationale: Expressa o valor humano genérico sem sugerir necessariamente um homem específico ou exclusivamente o sexo masculino.
- source_word: super terram natus
  choice: nascido sobre a terra
  rationale: Conserva a formulação espacial do latim, adequada ao registro apocalíptico.
theological_decisions:
- issue: Valor genérico ou individual de homo
  choice: ser humano
  alternative: o homem
  rationale: O contexto permite uma referência genérica à condição humana; ‘ser humano’ evita transformar a expressão em alusão inequívoca a um indivíduo específico.
- issue: Tempo e modalidade de certavit
  choice: que travou
  alternative: que deve travar
  rationale: O texto latino transmitido emprega o perfeito certavit, não uma forma de obrigação. A variante interpretativa modal é registrada em nota, sem substituir a leitura formal no texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A fórmula redundante latina ‘respondit et dixit’ foi vertida naturalmente por ‘respondeu’; a ambiguidade interpretativa relevante foi preservada em nota.
