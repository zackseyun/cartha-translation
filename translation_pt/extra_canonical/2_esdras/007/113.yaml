source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dies enim iudicii erit finis temporis huius et initium futuri inmortalistemporis, in quo pertransivit corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/113.yaml
  text: For the day of judgment will be the end of this time and the beginning of the immortal time to come[a], in which corruption has passed away,
translation:
  language: pt
  text: Pois o dia do juízo será o fim deste tempo e o início do tempo imortal que há de vir[a], no qual a corrupção terá passado,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “do futuro tempo imortal”.'
    reason: Registra uma tradução mais diretamente formal da ordem e do valor adjetival da expressão latina futuri inmortalis temporis.
lexical_decisions:
- source_word: futuri inmortalis temporis
  choice: do tempo imortal que há de vir
  rationale: Preserva o sentido escatológico de futurus e a oposição entre o tempo presente e o tempo vindouro, em linguagem natural e solene.
- source_word: pertransivit corruptela
  choice: a corrupção terá passado
  rationale: O futuro perfeito em português explicita a perspectiva futura estabelecida por «o dia do juízo», ao mesmo tempo que mantém o aspecto concluído do perfeito latino.
theological_decisions:
- issue: Contraste escatológico entre dois tempos
  choice: deste tempo ... do tempo imortal que há de vir
  alternative: deste mundo ... da era imortal futura
  rationale: Mantém o termo latino tempus em ambos os membros e não transforma sem necessidade «tempo» em «mundo» ou «era», preservando a formulação e a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção «que há de vir» conserva o registro apocalíptico sem soar técnica ou artificial.
