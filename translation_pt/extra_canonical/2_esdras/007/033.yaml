source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et revelabitur Altissimus super sedem iudicii, et pertransibunt misericordiae, et longanimitas congregabitur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/033.yaml
  text: And the Most High will be revealed upon the seat of judgment[a], and mercies will pass away, and long-suffering will be gathered up,
translation:
  language: pt
  text: E o Altíssimo se revelará sobre o trono do juízo, e as misericórdias passarão, e a longanimidade será recolhida.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedem iudicii
  choice: trono do juízo
  rationale: Embora sedes possa significar “assento”, no contexto da manifestação judicial do Altíssimo, “trono” expressa naturalmente a sede régia de julgamento sem alterar o sentido.
- source_word: pertransibunt misericordiae
  choice: as misericórdias passarão
  rationale: 'Preserva a imagem e a formulação privativa do latim: as manifestações de misericórdia deixarão de estar disponíveis no momento do juízo.'
- source_word: longanimitas
  choice: a paciência
  rationale: Aqui designa a tolerância prolongada de Deus antes do juízo. “Paciência” é corrente e clara em português; “longanimidade” seria mais formal e menos acessível.
- source_word: congregabitur
  choice: será retirada
  rationale: O sentido literal é “será reunida/recolhida”, mas, no paralelismo escatológico com as misericórdias que passam, a expressão comunica que a tolerância será recolhida, isto é, retirada. “Será retirada” torna esse valor idiomático claro.
theological_decisions:
- issue: Fim da misericórdia e da tolerância no cenário do juízo
  choice: Manter a afirmação forte de que as misericórdias passarão e a paciência será retirada.
  alternative: Abrandar como mera diminuição da misericórdia ou como mudança de ênfase.
  rationale: O texto latino apresenta duas ações privativas paralelas e não autoriza suavizar a tensão teológica.
- issue: Valor de congregabitur
  choice: Traduzir idiomaticamente como “será retirada”.
  alternative: Traduzir formalmente como “será recolhida”.
  rationale: A alternativa conserva melhor a superfície lexical, mas pode sugerir apenas ajuntamento. No contexto, “retirada” comunica com maior clareza o término da tolerância, sem acrescentar uma conclusão doutrinária externa.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção solene sem arcaísmos. A pontuação separa as três declarações coordenadas e evita uma frase excessivamente encadeada.
