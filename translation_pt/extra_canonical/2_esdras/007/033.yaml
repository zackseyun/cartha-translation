    issue: “a paciência será retirada” para longanimitas congregabitur
    rationale: “Paciência” reduz o termo técnico/moral longanimitas, e “retirada” resolve interpretativamente uma expressão que, no latim, diz literalmente que ela será reunida ou recolhida. “A longanimidade será recolhida” conserva melhor o léxico e a imagem do original, deixando que o paralelismo com o desaparecimento das misericórdias comunique o efeito privativo.
