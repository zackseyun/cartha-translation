  text: And he said to me, “Rise, Ezra, and hear the words that I have come to speak to you.”
translation:
  language: pt
  text: 'E ele me disse: “Levante-se, Esdras, e ouça as palavras que vim dizer a você.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surge
  choice: Levante-se
  rationale: Imperativo natural e digno em português, preservando o chamado direto para que Esdras se ponha de pé.
- source_word: sermones
  choice: as palavras
  rationale: Neste contexto, o latim indica aquilo que será dito, não necessariamente discursos formais; “palavras” conserva bem o sentido.
- source_word: veni loqui ad te
  choice: vim dizer a você
  rationale: Expressa em português corrente a finalidade da vinda, sem a formulação menos natural “vim falar a você” neste encaixe sintático.
