source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo tu quare conturbaris, corruptibilis cum sis? et quid moveris tu, cum sis mortalis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/015.yaml
  text: So now why are you disturbed[a], seeing that you are corruptible? And why are you shaken, seeing that you are mortal?
translation:
  language: pt
  text: Então, por que você se perturba, já que é corruptível? E por que se abala, já que é mortal?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbaris
  choice: se perturba
  rationale: Expressa de modo natural o estado de inquietação ou agitação indicado pelo verbo latino.
- source_word: corruptibilis
  choice: corruptível
  rationale: Preserva a relação direta com a condição sujeita à corrupção e à deterioração, sem reduzi-la apenas à mortalidade.
- source_word: moveris
  choice: se abala
  rationale: No paralelismo com conturbaris, comunica agitação ou instabilidade, evitando o sentido moderno de comoção sentimental que 'se comove' poderia sugerir.
- source_word: mortalis
  choice: mortal
  rationale: Equivalente direto, claro e corrente do adjetivo latino.
theological_decisions:
- issue: Relação entre corruptibilidade e mortalidade
  choice: Manter os dois termos distintos
  alternative: Traduzir ambos de modo geral como fragilidade ou mortalidade
  rationale: O texto latino apresenta duas condições correlatas, mas não idênticas; preservar ambas mantém o paralelismo e a tensão conceitual.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por 'você' para ampla legibilidade brasileira. O paralelismo das duas perguntas e das orações causais foi preservado.
