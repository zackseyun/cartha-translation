lexical_decisions:
- source_word: non paucos
  choice: Não poucos
  rationale: Mantém a formulação enfática e a ligação contrastiva com «mas», sem transformar a expressão em «muitos».
- source_word: pene omnes
  choice: quase todos
  rationale: Reproduz diretamente o alcance de «pene» sem exagerá-lo para «todos».
- source_word: qui creati sunt
  choice: os que foram criados
  rationale: Preserva a voz passiva e a abrangência do referente humano no texto.
- source_word: audi
  choice: Ouça
  rationale: Imperativo natural e digno em português; mantém a frase em aberto, como ocorre no segmento latino fornecido.
theological_decisions:
- issue: Alcance de «quase todos»
  choice: Manter «quase todos» sem explicar o destino ou a condição dessas pessoas
  alternative: Explicitar que se trata dos perdidos ou condenados
  rationale: O fragmento fornecido não declara aqui qual condição está sendo atribuída aos criados; a tradução não deve importar do contexto uma conclusão teológica para dentro deste versículo.
translation_notes:
  register: Português atual, claro e digno, com legibilidade brasileira. «Então ele me respondeu» expressa naturalmente «et respondit ad me et dixit» sem conservar uma redundância semítica pouco idiomática. A fala fica deliberadamente incompleta porque o texto-fonte termina em «audi» e continua no versículo seguinte.
