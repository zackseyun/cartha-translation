  text: nem, neque pluuiam, neque rorem, Neque meridiem, neque noctem, neque ante lucem, neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/042.yaml
  text: neither rain nor dew, neither noon nor night nor dawn, neither brightness nor splendor nor light, but only the radiance of the glory of the Most High, by which all will begin to see what has been set before them.
translation:
  language: pt
  text: nem chuva nem orvalho, nem meio-dia nem noite nem alvorada, nem brilho nem esplendor nem luz, mas somente o fulgor da glória do Altíssimo, pelo qual todos começarão a ver o que foi posto diante deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pluuiam / rorem
  choice: chuva / orvalho
  rationale: Equivalentes diretos e naturais, preservando os dois fenômenos distintos da enumeração latina.
- source_word: meridiem
  choice: meio-dia
  rationale: Mantém a referência temporal concreta do latim, em paralelo com noite e alvorada.
- source_word: ante lucem
  choice: alvorada
  rationale: Expressa em português corrente o período anterior ou inicial da luz do dia; evita o pouco natural «antes da luz» dentro da enumeração.
- source_word: nitorem / claritatem / lucem
  choice: brilho / esplendor / luz
  rationale: Preserva a sequência de três termos luminosos com vocábulos distintos, sem apagar a sobreposição semântica do original.
- source_word: splendorem claritatis Altissimi
  choice: fulgor da glória do Altíssimo
  rationale: «Fulgor» distingue o esplendor único que permanece dos termos negados antes; «glória» comunica naturalmente a claritas divina neste contexto.
- source_word: quae praeposita sunt
  choice: o que foi posto diante deles
  rationale: Conserva a imagem espacial e a indefinição do referente, sem explicar além do texto.
theological_decisions:
- issue: Natureza da iluminação no estado descrito
  choice: «o fulgor da glória do Altíssimo»
  alternative: «o resplendor da claridade do Altíssimo»
  rationale: A formulação escolhida mantém a origem divina da iluminação e segue o uso religioso natural de «glória», sem definir sua natureza metafísica.
- issue: Referente de «o que foi posto diante deles»
  choice: manter o referente indefinido
  alternative: explicitar como juízo, recompensa ou realidade futura
  rationale: O texto não identifica aqui aquilo que é colocado diante de todos; explicá-lo importaria uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e solene, com cadência enumerativa preservada. A repetição de «nem» reproduz a estrutura retórica do latim; «mas somente» oferece uma oposição natural em português. Nenhuma nota de rodapé foi necessária.
