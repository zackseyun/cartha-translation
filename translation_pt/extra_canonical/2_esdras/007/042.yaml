  source_fidelity: O texto preserva a enumeração negativa do latim (chuva, orvalho, meio-dia, noite, alvorada, brilho, esplendor e luz), bem como a contraposição exclusiva introduzida por «mas somente». «Pelo qual todos começarão a ver» reproduz adequadamente o relativo instrumental e o valor incoativo de «incipient». A formulação «o que foi posto diante deles» conserva a indeterminação imagética de «quae praeposita sunt».
  naturalness: O português é moderno, claro e mantém uma cadência solene apropriada. A repetição de «nem» é natural em uma enumeração enfática. «Fulgor da glória do Altíssimo» soa idiomático e corresponde bem ao registro religioso-literário do contexto.
  terminology: «Altíssimo» é a forma estabelecida e amplamente compreensível para Altissimus. «Fulgor da glória» acompanha de modo natural o audit trail inglês («radiance of the glory») sem definir doutrinariamente a natureza dessa luz. Os termos de luminosidade anteriores permanecem distintos.
