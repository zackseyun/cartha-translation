  text: Quid enim nobis prodest, si promissum est nobis inmortale tempus, nos vero mortalia opera egimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/119.yaml
  text: For what does it profit us if an immortal age has been promised to us, but we have done mortal works?
translation:
  language: pt
  text: Pois, de que nos serve que nos tenha sido prometido um tempo imortal, se fizemos obras mortais?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid enim nobis prodest
  choice: Pois que proveito temos
  rationale: Reproduz de modo natural a pergunta retórica e mantém a partícula explicativa enim por meio de “Pois”.
- source_word: inmortale tempus
  choice: um tempo imortal
  rationale: Preserva a formulação latina e sua possível dimensão escatológica sem a especificar como “era” ou “vida eterna”.
- source_word: mortalia opera egimus
  choice: praticamos obras mortais
  rationale: Mantém o contraste lexical direto entre “imortal” e “mortais”; “praticamos” expressa com naturalidade obras realizadas.
theological_decisions:
- issue: Sentido escatológico de inmortale tempus
  choice: tempo imortal
  alternative: era imortal
  rationale: A tradução formal preserva a imagem e a ambiguidade do latim, sem definir se tempus designa uma era futura, uma condição ou a vida eterna.
- issue: Sentido moral de mortalia opera
  choice: obras mortais
  alternative: obras que levam à morte
  rationale: Mantém a tensão do original sem introduzir explicitamente uma relação causal ou uma interpretação moral não expressa no texto.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A estrutura antitética e a pergunta retórica do latim foram preservadas.
