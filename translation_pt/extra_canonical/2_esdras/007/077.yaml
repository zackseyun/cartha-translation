review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a exortação negativa, o tormento, o tesouro de obras guardado com o Altíssimo e sua revelação apenas nos últimos tempos. Contudo, «o» em «os que o desprezaram» introduz um objeto explícito que não está presente no latim sobrevivente («qui speruerunt»); o referente deve permanecer não expresso.
  naturalness: O registro é claro e moderno. «Não se conte entre» é compreensível, mas «não se considere entre» é ligeiramente mais idiomático em português contemporâneo, sem perder o sentido inclusivo de «connumeres te».
  terminology: «Altíssimo», «tesouro de obras», «atormentados» e «últimos tempos» são escolhas fiéis e apropriadas. «Guardado junto ao Altíssimo» exprime com maior precisão «repositus apud Altissimum» do que «reservado ... junto ao», preservando tanto a custódia quanto o destinatário indicado por «tibi».
  issues:
  - severity: medium
    issue: Objeto indevidamente explicitado em «os que o desprezaram».
    rationale: O latim não fornece objeto para «speruerunt». Embora o contexto anterior possa sugerir um referente, a tradução não deve fixá-lo por meio de «o».
  - severity: low
    issue: «Reservado para você junto ao Altíssimo» pode enfraquecer a imagem de algo depositado/guardado com o Altíssimo.
    rationale: «Repositus apud Altissimum» descreve literalmente um tesouro posto ou guardado com/junto ao Altíssimo; «guardado» preserva melhor essa imagem.
  revised_text: os que desprezaram; e não se considere entre os que são atormentados. Pois há para você um tesouro de obras guardado junto ao Altíssimo, mas ele não lhe será mostrado até os últimos tempos.
