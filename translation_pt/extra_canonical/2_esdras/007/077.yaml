  text: who have shown contempt[a], and do not count yourself among those who are tormented. For a treasury of works is laid up for you with the Most High, but it will not be shown to you until the last times.
translation:
  language: pt
  text: os que desprezaram; e não se considere entre os que são atormentados. Pois há para você um tesouro de obras guardado junto ao Altíssimo, mas ele não lhe será mostrado até os últimos tempos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: speruerunt
  choice: desprezaram
  rationale: Expressa de modo natural o sentido de rejeitar com desprezo; o objeto permanece implícito, como no latim.
- source_word: connumeres te
  choice: se conte entre
  rationale: Preserva a imagem de incluir-se ou ser contado num grupo, em português corrente.
- source_word: cruciantur
  choice: são atormentados
  rationale: Mantém o sentido passivo de sofrimento intenso sem especificar uma forma de tormento não indicada pelo texto.
- source_word: thesaurus operum
  choice: um tesouro de obras
  rationale: Conserva a metáfora concreta de um tesouro acumulado e a amplitude de operum, que pode abranger obras ou feitos.
- source_word: repositus apud Altissimum
  choice: reservado para você junto ao Altíssimo
  rationale: Comunica tanto a ideia de algo guardado em benefício do destinatário quanto sua localização sob a custódia do Altíssimo.
- source_word: in nouissimis
  choice: nos últimos tempos
  rationale: Interpreta o plural substantivado no sentido escatológico temporal sugerido pelo contexto, sem definir com maior precisão esses tempos.
theological_decisions:
- issue: O sentido de “tesouro de obras”
  choice: Manter a expressão metafórica sem explicar como as obras se relacionam com recompensa ou mérito.
  alternative: Traduzir como “recompensa por suas obras”.
  rationale: O latim fala literalmente de um tesouro de obras e não explicita uma teoria de mérito, recompensa ou salvação.
- issue: Referente implícito em “os que o desprezaram”
  choice: Manter o objeto implícito.
  alternative: Acrescentar “o Altíssimo”, “a lei” ou outro referente.
  rationale: O trecho latino preserva apenas a forma verbal relativa; explicitar um objeto resolveria uma ligação que depende do contexto anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A abertura fragmentária foi preservada porque o versículo começa com uma oração relativa ligada ao contexto anterior. Empregou-se “você” para acompanhar a interpelação direta de modo natural.
