  text: 'patientur amodo qui neglexerint. Et respondi et dixi : ergo dabitur tempus animabus postquam separatae fuerint de corporibus, ut uideant de quo mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/100.yaml
  text: And I answered and said, “Then will time be given to the souls, after they have been separated from the bodies, to see that of which you told me?”
translation:
  language: pt
  text: 'E respondi e disse: “Então será dado tempo às almas, depois de terem sido separadas dos corpos, para verem aquilo de que me falaste?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tempus
  choice: tempo
  rationale: Mantém diretamente a noção de um período ou oportunidade concedida, sem especificar duração.
- source_word: animabus
  choice: às almas
  rationale: Correspondência direta ao latim, preservando a referência às almas em contraste com os corpos.
- source_word: separatae fuerint de corporibus
  choice: tiverem sido separadas dos corpos
  rationale: Preserva a voz passiva e a anterioridade da separação em relação ao ato de ver.
- source_word: uideant de quo mihi
  choice: verem aquilo de que me falaste
  rationale: Reproduz a construção relativa formal de de quo, seguindo a camada inglesa auditada; o verbo implícito é expresso naturalmente em português.
theological_decisions:
- issue: Estado das almas depois da separação do corpo
  choice: Manter a formulação interrogativa e a distinção entre almas e corpos
  alternative: Explicitar uma doutrina específica sobre o estado intermediário ou o destino após a morte
  rationale: O texto pergunta se lhes será concedido tempo para ver, sem definir aqui a natureza desse estado nem resolver suas implicações teológicas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A fórmula “respondi e disse” conserva o paralelismo solene do original; “aquilo de que me falaste” mantém a precisão relativa sem soar excessivamente arcaico.
