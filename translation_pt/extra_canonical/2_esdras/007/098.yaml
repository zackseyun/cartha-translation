source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: incipient stellarum adsimilarí lumini, amodo non corrupti. Septimus ordo, qui est omnibus supradictis maior, quoniam exultabunt cum fiducia et quoniam confidebunt non confusi, et gaudebunt non reuerentes, festinant enim uidere uultum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/098.yaml
  text: 'The seventh order[a], which is greater than all the orders mentioned above: they will exult with confidence, and trust without being put to shame, and rejoice without fear, for they hasten to see the face of him whom they served while living, and from whom they, being glorified, are to receive their reward.'
translation:
  language: pt
  text: 'A sétima ordem, que é maior do que todas as mencionadas acima: eles exultarão com confiança, confiarão sem serem envergonhados e se alegrarão sem medo, pois se apressam para ver o rosto daquele a quem serviram enquanto viviam e de quem, glorificados[a], receberão sua recompensa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, são eles que estão glorificados; o latim não descreve aqui a recompensa como gloriosa.
    reason: Esclarece a concordância gramatical da continuação latina e impede que o adjetivo seja ligado incorretamente a «recompensa».
lexical_decisions:
- source_word: Septimus ordo
  choice: A sétima ordem
  rationale: Mantém a terminologia enumerativa do latim e a ligação com as ordens anteriores, sem substituir o conceito por uma interpretação mais específica.
- source_word: exultabunt cum fiducia
  choice: exultarão com confiança
  rationale: Reproduz tanto a alegria intensa de exultabunt quanto a segurança expressa por cum fiducia.
- source_word: confidebunt non confusi
  choice: confiarão sem ser envergonhados
  rationale: Preserva a relação entre confiar e não sofrer vergonha ou decepção; evita o sentido moderno mais estreito de 'confusos'.
- source_word: gaudebunt non reuerentes
  choice: se alegrarão sem medo
  rationale: Neste contexto, reuerentes expressa temor ou receio, não reverência cultual.
- source_word: festinant uidere uultum
  choice: se apressam para ver o rosto
  rationale: Mantém a força ativa de festinant e a expressão concreta 'ver o rosto'.
- source_word: gloriosi ... mercedem
  choice: já glorificados ... sua recompensa
  rationale: Conforme a evidência latina registrada para a continuação, gloriosi qualifica as pessoas, e não mercedem, a recompensa.
theological_decisions:
- issue: Estado glorificado dos justos e recebimento da recompensa
  choice: de quem, já glorificados, receberão sua recompensa
  alternative: de quem receberão sua recompensa gloriosa
  rationale: A concordância latina faz de gloriosi um predicativo do sujeito plural. A tradução não transfere a glória para a recompensa nem define além do texto a natureza dessa glorificação.
- issue: Sentido de 'ver o rosto'
  choice: ver o rosto daquele a quem serviram
  alternative: comparecer diante daquele a quem serviram
  rationale: A formulação concreta preserva a linguagem teológica do texto sem reduzi-la a uma simples audiência ou explicá-la como visão beatífica em termos doutrinários posteriores.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe clara. Conserva 'ordem', 'ver o rosto' e 'recompensa' por sua importância estrutural e teológica, evitando vocabulário confessional específico.
