lexical_decisions:
- source_word: ingredientur
  choice: entrarão
  rationale: Futuro de ingredior; mantém a forma do fragmento latino. A negação que completa o sentido encontra-se no fim do versículo anterior.
- source_word: uagantes erunt
  choice: vagarão
  rationale: Expressa a ideia de andar sem rumo ou permanecer errante, de modo natural em português.
- source_word: amodo
  choice: de agora em diante
  rationale: Equivalente temporal claro e corrente.
- source_word: in cruciamentis
  choice: em tormentos
  rationale: Preserva o sentido de sofrimentos ou suplícios intensos sem acrescentar uma interpretação específica.
- source_word: dolentes semper et tristes
  choice: sempre pesarosos e tristes
  rationale: Distingue dolentes, que indica dor ou pesar, de tristes, evitando reduzir os dois termos a um só.
theological_decisions:
- issue: Relação sintática com o versículo anterior
  choice: Manter “entrarão” no texto deste versículo e explicar em nota que a negação está no versículo anterior
  alternative: Inserir “não entrarão” neste versículo
  rationale: O trecho latino fornecido começa com ingredientur, mas completa o non final do versículo 80. A solução preserva a divisão textual da edição sem ocultar a sintaxe.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção próxima do latim sem sacrificar a naturalidade.
