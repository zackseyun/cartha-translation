  text: enter[a], but from now on they will wander in torments, always grieving and sad.
translation:
  language: pt
  text: entrarão[a], mas, de agora em diante, vagarão em tormentos, sempre pesarosos e tristes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A frase continua o versículo anterior: o “não” que rege “entrarão” aparece no fim do versículo 80.'
