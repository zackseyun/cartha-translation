  text: 'feruerunt et extincti sunt. Et respondit et dixi: O tu terra, quid peperisti, si sensus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/062.yaml
  text: And I answered and said, “O earth, what have you brought forth, if understanding has been made from dust, like the rest of creation?
translation:
  language: pt
  text: 'E respondi e disse: “Ó terra, o que geraste, se o entendimento foi feito do pó, como o restante da criação?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peperisti
  choice: geraste
  rationale: Preserva a imagem da terra personificada como aquela que dá origem aos seres, em linguagem natural e digna.
- source_word: sensus
  choice: entendimento
  rationale: Expressa a capacidade racional ou consciente sem restringir o termo a um sentido físico ou a uma faculdade teológica específica.
- source_word: pulvere
  choice: pó
  rationale: Equivalente direto, com a ressonância antropológica tradicional do ser formado do pó.
- source_word: cetera creatura
  choice: o restante da criação
  rationale: Formulação coletiva natural em português, correspondente ao sentido de todas as demais coisas criadas.
theological_decisions:
- issue: Sentido interrogativo de quid
  choice: o que geraste
  alternative: por que geraste
  rationale: O latim permite que quid seja entendido como pronome interrogativo ou, em certos usos, como 'por quê'. Segue-se a leitura do texto de consulta, preservando a pergunta sobre aquilo que a terra produziu sem impor uma interpretação causal.
translation_notes:
  register: Português moderno, claro e solene. O tratamento direto “Ó terra” conserva a personificação e o tom de lamento. O segmento inicial do testemunho latino (“feruerunt et extincti sunt”) pertence ao fechamento do contexto anterior e não foi incorporado ao texto deste versículo, de acordo com a delimitação apresentada no texto de consulta.
