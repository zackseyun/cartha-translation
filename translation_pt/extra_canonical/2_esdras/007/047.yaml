  text: And now I see that the age to come will bring joy to few[a], but torments to many.
translation:
  language: pt
  text: E agora vejo que a alegria da era futura será para poucos, mas os tormentos, para muitos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et nunc video
  choice: E agora vejo
  rationale: Reproduz de modo direto a progressão do discurso latino e mantém a ligação com o contexto anterior.
- source_word: futuri saeculi
  choice: era futura
  rationale: Expressa o período ou mundo por vir em português atual, sem restringir indevidamente o sentido escatológico de saeculum.
- source_word: iocunditatem
  choice: alegria
  rationale: Comunica de maneira natural o sentido de prazer, satisfação ou deleite presente no substantivo latino.
- source_word: ad paucos ... multis autem tormenta
  choice: a poucos ... mas tormentos a muitos
  rationale: Mantém o contraste distributivo entre os poucos que recebem alegria e os muitos aos quais cabem tormentos, evitando fazer de “tormentos” um verbo ou objeto de “alegria”.
theological_decisions:
- issue: Relação sintática entre a era futura, a alegria e os tormentos
  choice: A era futura “trará” alegria a poucos e tormentos a muitos
  alternative: A alegria da era futura caberá a poucos, mas os tormentos, a muitos
  rationale: A redação principal é natural em português e corresponde ao sentido contextual; a nota preserva a construção mais formalmente próxima do latim e sua possível análise sintática.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. “Era futura” foi preferido a formas mais marcadamente tradicionais, como “mundo vindouro”, para manter ampla inteligibilidade sem perder o sentido escatológico.
