lexical_decisions:
- source_word: Hic
  choice: Este
  rationale: O demonstrativo latino é proximal e retoma «die iudicii» (o dia do juízo), por isso «este» preserva sua força, em vez de «aquele».
- source_word: talis
  choice: é um dia ... que
  rationale: A construção idiomática comunica em português a ideia de um dia de tal natureza, sem tornar a frase excessivamente literal.
- source_word: neque ... neque ... neque
  choice: não tem ... nem ... nem
  rationale: Mantém a negação coordenada e a enumeração enfática do latim em português natural.
