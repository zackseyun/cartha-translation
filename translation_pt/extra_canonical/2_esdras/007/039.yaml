  text: Este é um dia de tal natureza[a] que não tem sol, nem lua, nem estrelas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «Este dia é tal que não tem sol, nem lua, nem estrelas».'
