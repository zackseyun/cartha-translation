source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quomodo corruptibile effugerint nunc, et futurum quomodo hereditatem possidebuut, adhuc autem uidentes angustum et [labore] plenum, quoniam liberati sunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/096.yaml
  text: 'The fifth order: they rejoice that they have now escaped what is corruptible[a], and how they will inherit what is to come, while still seeing the narrow and toil-filled way, because they have been delivered.'
translation:
  language: pt
  text: 'A quinta ordem: eles se alegram por terem agora escapado do que é corruptível e por haverem de herdar o que há de vir, enquanto ainda veem o caminho estreito e cheio de esforço, pois foram libertados.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: corruptibile
  choice: o que é corruptível
  rationale: Mantém a substantivação e a amplitude do latim, sem limitar o referente ao corpo, ao mundo ou à mortalidade.
- source_word: futurum
  choice: o que há de vir
  rationale: Expressa naturalmente o substantivo latino e preserva seu referente escatológico amplo.
- source_word: hereditatem possidebunt
  choice: herdarão
  rationale: O verbo português reúne de modo claro a ideia idiomática de possuir como herança.
- source_word: angustum et labore plenum
  choice: o caminho estreito e cheio de esforço
  rationale: “Caminho” é explicitado pelo contexto e pelo adjetivo substantivado; “cheio de esforço” traduz labore plenum sem introduzir uma imagem denominacional específica.
- source_word: liberati sunt
  choice: foram libertados
  rationale: Conserva a voz passiva e não explicita o agente, como no texto latino.
theological_decisions:
- issue: Valor dos dois usos paralelos de quomodo
  choice: por terem... e por herdarem
  alternative: como escaparam... e como herdarão
  rationale: No latim tardio, quomodo pode introduzir discurso indireto com valor próximo de “que”. A construção portuguesa com “por” liga naturalmente os dois motivos à alegria e mantém o paralelismo sem transformar as cláusulas em perguntas sobre o modo.
- issue: Relação entre a visão do caminho difícil e a libertação
  choice: embora ainda vejam... pois foram libertados
  alternative: enquanto ainda veem... porque foram libertados
  rationale: A formulação conserva tanto adhuc autem quanto quoniam e a tensão do texto, sem acrescentar o lugar amplo, o deleite ou a imortalidade, ausentes do trecho latino fornecido.
translation_notes:
  register: Português moderno, digno e acessível, com boa legibilidade brasileira. A repetição paralela foi preservada por duas construções com “por”; evitou-se explicar além do latim o referente de “corruptível” e o agente da libertação.
