revisions:
- from: 'A quinta ordem: eles se alegram por terem agora escapado do que é corruptível e por herdarem o que há de vir, embora ainda vejam o caminho estreito e cheio de esforço, pois foram libertados.'
  to: 'A quinta ordem: eles se alegram por terem agora escapado do que é corruptível e por haverem de herdar o que há de vir, enquanto ainda veem o caminho estreito e cheio de esforço, pois foram libertados.'
  rationale: A revisão esclarece o futuro da herança e substitui a concessão não marcada no latim por uma construção temporal que reflete adhuc («ainda»). Conserva-se a dupla construção causal ligada à alegria como equivalente natural do paralelismo de quomodo, bem como a ambiguidade sintática e referencial do segmento final.
