  yaml_path: translation/extra_canonical/2_esdras/007/084.yaml
  text: 'The fourth way: they consider for themselves in the last times the torment laid up for them.'
translation:
  language: pt
  text: 'O quarto caminho: considerarão, por si mesmos, nos últimos tempos, o tormento que lhes está reservado.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quarta uia
  choice: O quarto caminho
  rationale: Mantém a fórmula enumerativa e a imagem de “caminho” do latim.
- source_word: considerabunt sibi
  choice: considerarão, por si mesmos
  rationale: Conserva tanto o sentido reflexivo de sibi quanto o valor contemplativo de considerabunt, sem transformar o verbo em simples percepção visual.
- source_word: in nouissimis
  choice: nos últimos tempos
  rationale: Reproduz a expressão escatológica de modo claro e corrente em português.
- source_word: '[repositum tormentum]'
  choice: o tormento que lhes está reservado
  rationale: Segue a continuação textual atestada refletida na camada inglesa auditada; “reservado” comunica naturalmente a ideia de algo guardado ou preparado para eles.
theological_decisions:
- issue: Caráter futuro e pessoal do castigo
  choice: “o tormento que lhes está reservado”
  alternative: “o tormento acumulado para eles”
  rationale: “Reservado” preserva a passividade e a destinação do tormento sem especificar seu agente nem acrescentar uma explicação doutrinária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com ordem levemente formal para conservar a estrutura enumerativa e a tensão do latim. A expressão “por si mesmos” retém o elemento reflexivo, embora o português idiomático normalmente o omitisse.
