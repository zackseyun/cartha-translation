  yaml_path: translation/extra_canonical/2_esdras/007/129.yaml
  text: For this is the way that Moses spoke of to the people while he lived, saying, ‘Choose life for yourself, that you may live.’
translation:
  language: pt
  text: 'Pois este é o caminho de que Moisés falou ao povo enquanto vivia, dizendo: “Escolha para si a vida, para que viva.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: via
  choice: caminho
  rationale: Mantém a imagem concreta e o sentido figurado do latim, em linguagem bíblica natural.
- source_word: elige tibi vitam
  choice: Escolha para você a vida
  rationale: Preserva o imperativo singular e o dativo reflexivo tibi sem reduzir sua ênfase.
- source_word: ut vivas
  choice: para que viva
  rationale: Reproduz a construção final do latim e conserva a relação verbal entre escolher a vida e viver.
theological_decisions:
- issue: Relação entre “este caminho” e a fala de Moisés
  choice: “o caminho do qual Moisés falou”
  alternative: “o caminho que Moisés indicou”
  rationale: A formulação escolhida conserva a referência de quam com dixit sem acrescentar a ideia interpretativa de que Moisés indicou ou ensinou esse caminho.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com concordância no singular e tratamento implícito por “você”; a fala direta usa “Escolha” e “viva” de modo consistente.
