  text: Non enim cogitavimus viventes quando iniquitatem faciebamus, quidincipientes post mortem pati.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/126.yaml
  text: For while we lived and committed iniquity[a], we did not consider what we would begin to suffer after death.”
translation:
  language: pt
  text: Pois, enquanto vivíamos e praticávamos a iniquidade, não consideramos o que começaríamos a sofrer[a] depois da morte.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que teríamos de sofrer”.'
    reason: Registra a alternativa modal atestada na camada inglesa consultiva, sem substituir a tradução principal, que preserva a força incoativa de incipere.
lexical_decisions:
- source_word: iniquitatem faciebamus
  choice: praticávamos a iniquidade
  rationale: Mantém o sentido ativo de cometer ou praticar o mal, preservando o termo moralmente forte “iniquidade” em linguagem portuguesa natural.
- source_word: cogitavimus
  choice: não refletimos sobre
  rationale: Expressa aqui a ideia de considerar seriamente ou levar em conta, mais adequada ao contexto do que o simples “pensar”.
- source_word: incipientes … pati
  choice: começaríamos a sofrer
  rationale: 'Preserva a força incoativa de incipere, destacada pela tradição textual e pela revisão mais recente: o sofrimento teria início depois da morte.'
- source_word: post mortem
  choice: depois da morte
  rationale: Tradução direta, clara e corrente da expressão temporal latina.
theological_decisions:
- issue: Início do sofrimento após a morte
  choice: “o que começaríamos a sofrer”
  alternative: “o que teríamos de sofrer”
  rationale: A leitura adotada conserva o aspecto incoativo do verbo latino sem introduzir uma ideia modal de obrigação que não é explicitada pelo texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para leitores brasileiros e compreensão internacional. A formulação mantém o tom confessional do discurso e a tensão escatológica do texto sem acrescentar explicações doutrinárias.
