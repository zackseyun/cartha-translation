base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/116.yaml
  text: 'And I answered and said[a], “This is my first and last word: it would have been better not to give the earth to Adam, or else, when it had already been given, to restrain him so that he would not sin.”'
translation:
  language: pt
  text: 'E respondi: “Esta é a minha primeira e última palavra: teria sido melhor não dar a terra a Adão ou, depois de já lha ter dado, refreá-lo para que ele não pecasse.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non dare terram Adam
  choice: que a terra não tivesse produzido Adão
  rationale: A construção pode ser entendida como acusativo com infinitivo, com terram como sujeito e Adam como objeto. Neste contexto de 4 Esdras, dare pode ter o sentido de ‘produzir’ ou ‘dar à luz’, retomando o motivo da terra que produz Adão.
- source_word: cum iam dedisset
  choice: depois de já o ter produzido
  rationale: Mantém a terra como sujeito implícito e eum (‘o’) como referência a Adão, em paralelo com a oração anterior.
- source_word: coercere eum
  choice: que o contivesse
  rationale: Expressa a ideia de restringir ou impedir Adão, sem especificar um meio de coerção ausente no latim.
- source_word: hic sermo meus primus et novissimus
  choice: Esta é a minha primeira e última palavra
  rationale: Formulação portuguesa natural e digna que preserva o caráter enfático e conclusivo de primus et novissimus.
theological_decisions:
- issue: Quem dá ou produz, e o que é dado ou produzido
  choice: A terra produz Adão
  alternative: Deus dá a terra a Adão
  rationale: A sintaxe latina isolada permite ler Adam como dativo, mas o paralelismo com dedisset e o uso contextual de dare para a terra produzir Adão favorecem a leitura em que terram é o sujeito do infinitivo. A alternativa genuína é registrada em nota, sem ocultar a ambiguidade.
- issue: Natureza da afirmação de Esdras
  choice: Mantida como fala do personagem, sem explicação doutrinária
  alternative: Atenuar ou harmonizar a afirmação sobre a criação e o pecado
  rationale: O texto expressa a tensão teológica do lamento de Esdras; a tradução não a resolve nem a transforma em afirmação normativa do narrador.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira e compreensão internacional. Emprega ‘Adão’, ‘pecasse’ e ‘o contivesse’ em registro bíblico atual, sem arcaísmos desnecessários.
