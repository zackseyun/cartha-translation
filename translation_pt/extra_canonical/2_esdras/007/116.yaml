    rationale: 'No texto latino fornecido, *terram* é mais naturalmente o objeto de *dare*, e *Adam* é o destinatário: «dar a terra a Adão». A sequência *cum iam dedisset* refere-se a essa doação.'
  - severity: medium
    issue: A nota apresenta como alternativa uma leitura que deve ser a tradução principal.
    rationale: A nota atual chama «outra tradução possível» à construção que melhor corresponde à sintaxe e à progressão do latim; ela deve substituir o texto principal, não ser tratada como alternativa.
