id: 2ES.7.14
reference: 2 Esdras 7:14
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si ergo non ingredientes ingressi fuerint qui vivunt angusta et vana haec, non poterunt recipere quae sunt reposita.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/014.yaml
  text: Therefore[a], if those who live do not enter these narrow and vain things, they cannot receive what has been stored up.
translation:
  language: pt
  text: Portanto, se os que vivem não entrarem[a] nestas coisas estreitas e vãs, não poderão receber as coisas que estão reservadas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim emprega aqui uma construção duplicada, literalmente semelhante a “não entrando, tiverem entrado”.
    reason: A nota preserva a forma enfática e incomum de ingredientes ingressi fuerint, que não pode ser reproduzida literalmente em português sem obscurecer o sentido.
lexical_decisions:
- source_word: ingredientes ingressi fuerint
  choice: entrarem
  rationale: A construção verbal duplicada significa, no contexto da condição negativa, que os vivos não chegam a entrar. A tradução simples é natural em português, enquanto a nota registra a forma incomum do latim.
- source_word: angusta et vana haec
  choice: nestas coisas estreitas e vãs
  rationale: Preserva os dois adjetivos concretos e a referência demonstrativa do latim, sem interpretar em excesso a natureza dessas realidades.
- source_word: quae sunt reposita
  choice: as coisas que estão reservadas
  rationale: Mantém a forma passiva e a ideia de algo guardado para recepção futura, sem acrescentar explicitamente para quem foi reservado.
theological_decisions:
- issue: Relação entre a entrada nas dificuldades presentes e o recebimento do que está reservado
  choice: Preservar a condição negativa tal como formulada
  alternative: Explicitar que se trata de suportar provações para receber recompensas futuras
  rationale: O versículo não identifica expressamente as “coisas estreitas e vãs” nem as “coisas reservadas”; explicá-las no corpo do texto eliminaria a tensão e a abertura do original.
translation_notes:
  register: Português atual, digno e de leitura ampla. “Os que vivem” conserva a expressão substantivada do original; “coisas estreitas e vãs” mantém sua linguagem deliberadamente difícil sem impor uma interpretação denominacional.
