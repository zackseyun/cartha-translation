  rationale: Expressão portuguesa natural que mantém o sentido temporal do latim e a forma tradicional do nome próprio.
- source_word: multi pro multis
  choice: muitos por muitos
  rationale: Conserva o paralelismo e a concisão retórica do original, sem restringir a relação a uma interpretação teológica específica.
theological_decisions:
- issue: Natureza da ação indicada por pro
  choice: Manter simplesmente «por»
  alternative: «intercedeu pelo» / «oraram por»
  rationale: O fragmento depende sintaticamente do contexto anterior e não repete o verbo; explicitar «interceder» ou «orar» resolveria uma elipse que o texto latino preserva.
