translation:
  language: pt
  text: os quais começarão a ser julgados nos últimos tempos.[a] Pois dos que guardaram os caminhos—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim conservado começa no meio da frase com quem, forma singular que pode significar «a quem» ou «o qual», mas traz o verbo plural incipient e o infinitivo passivo iudicari, «ser julgados». A ligação sintática com o trecho anterior é incerta.
    reason: Explicar a construção latina fragmentária e justificar a preservação da voz passiva sem ocultar a discordância formal.
  - marker: b
    text: O texto-fonte fornecido se interrompe no meio de seruaue-, provavelmente uma forma de seruare, «guardar»; por isso, a frase permanece incompleta.
    reason: Sinalizar que a interrupção pertence ao fragmento disponibilizado e evitar uma complementação conjectural.
lexical_decisions:
- source_word: iudicari
  choice: ser julgados
  rationale: O infinitivo latino é passivo; esta tradução evita convertê-lo sem indicação em «julgar», de sentido ativo.
- source_word: nouissimis temporibus
  choice: nos últimos tempos
  rationale: Equivalência direta e natural para a expressão escatológica latina, sem especificar além do texto.
- source_word: uias seruaue-
  choice: guardaram os caminhos—
  rationale: Traduz uias por «caminhos» e o verbo truncado como forma de seruare, «guardar»; o travessão conserva a interrupção do fragmento.
theological_decisions:
- issue: Voz do julgamento e sintaxe do relativo inicial
  choice: «os quais começarão a ser julgados»
  alternative: «a quem começarão a julgar»
  rationale: Embora quem isoladamente sugira «a quem/o qual», iudicari é passivo e incipient está no plural. Como o trecho começa no meio de uma construção, a tradução conserva a voz passiva e registra a irregularidade em nota, sem decidir quem exerce o julgamento.
- issue: Caráter incompleto da oração introduzida por Nam eorum
  choice: manter a oração suspensa
  alternative: completar com material de outra forma textual ou do contexto posterior
  rationale: O testemunho fornecido termina no meio da palavra seruaue- e deixa o genitivo eorum sem complemento expresso; completar a frase importaria texto não presente no recorte-fonte.
translation_notes:
  register: Português atual, sóbrio e inteligível, com «últimos tempos» e «caminhos» para preservar o registro bíblico sem arcaísmo excessivo. A abertura e o encerramento abruptos foram mantidos porque o latim fornecido é fragmentário.
