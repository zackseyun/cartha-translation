lexical_decisions:
- source_word: miserator
  choice: compassivo
  rationale: Expressa a qualidade daquele que se compadece, preservando a ligação lexical com o verbo seguinte.
- source_word: miseretur
  choice: tem compaixão
  rationale: Reproduz de modo natural a repetição intencional da raiz latina ligada a misericórdia e compaixão.
- source_word: conversionem faciunt
  choice: voltam
  rationale: A expressão latina indica mudança de direção ou retorno; neste contexto, “voltam” é claro e não acrescenta uma formulação teológica mais específica como “se arrependem”.
- source_word: in lege eius
  choice: para a sua lei
  rationale: Com o verbo de retorno, “para” comunica naturalmente a orientação em direção à lei, em consonância com o sentido contextual do latim.
theological_decisions:
- issue: Natureza da conversão
  choice: voltam para a sua lei
  alternative: se arrependem segundo a sua lei
  rationale: A opção escolhida preserva a imagem de retorno presente em conversionem facere sem identificar de forma indevida o termo com uma doutrina técnica de arrependimento.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo lexical entre “compassivo” e “tem compaixão”. A vírgula preserva a estrutura coordenada e explicativa do fragmento.
