  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid prodest, quoniam salutati saluabimur, si tormento tormentabimur? Omnes enim qui nati sunt, conmixti sunt iniquitatibus, et pleni sunt peccatis, et grauidi delictis;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/068.yaml
  text: What does it profit that we will be saved[a], if we will be tormented? For all who have been born are mixed with iniquities, and are full of sins and burdened with transgressions.
translation:
  language: pt
  text: Que proveito há em sermos salvos, se seremos atormentados? Pois todos os que nasceram estão mesclados com iniquidades, cheios de pecados e carregados de transgressões.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quid prodest
  choice: Que proveito há
  rationale: Reproduz de modo natural a pergunta retórica sobre utilidade ou benefício.
- source_word: salutabimur / saluabimur
  choice: sermos salvos
  rationale: Expressa o sentido passivo futuro no contexto sem acrescentar uma ênfase de certeza que o latim não marca inequivocamente.
- source_word: tormento tormentabimur
  choice: seremos atormentados
  rationale: Mantém a ideia de sofrer tormento; evita introduzir um advérbio de intensidade não explicitado no texto latino.
- source_word: conmixti sunt iniquitatibus
  choice: estão mesclados com iniquidades
  rationale: Conserva a imagem incomum de mistura presente em conmixti, sem substituí-la por uma interpretação como 'enredados'.
- source_word: grauidi delictis
  choice: carregados de transgressões
  rationale: Transmite o peso figurado de grauidi em português corrente e digno.
theological_decisions:
- issue: Relação entre salvação e tormento
  choice: Manter a tensão da pergunta sem explicá-la
  alternative: Interpretar a salvação como provisória, futura ou limitada
  rationale: O versículo formula uma aparente tensão entre ser salvo e ser atormentado, mas não define aqui como esses conceitos se relacionam.
- issue: Condição universal dos nascidos
  choice: todos os que nasceram
  alternative: todos os seres humanos
  rationale: A formulação escolhida segue diretamente o latim omnes enim qui nati sunt e evita ampliar ou sistematizar sua afirmação.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo entre 'mesclados', 'cheios' e 'carregados'. A imagem menos habitual de estar 'mesclado com iniquidades' foi preservada por fidelidade ao texto latino.
