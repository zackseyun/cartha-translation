  text: 'The third way: they see the reward laid up for those who have trusted the covenants of the Most High.'
translation:
  language: pt
  text: 'O terceiro caminho: elas veem a recompensa reservada para os que confiaram nas alianças do Altíssimo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tertia uia
  choice: O terceiro caminho
  rationale: Mantém a imagem e a enumeração do latim, em continuidade natural com os caminhos anteriores.
- source_word: uident
  choice: elas veem
  rationale: O sujeito implícito são as almas mencionadas no contexto; o pronome explicita isso de modo natural em português.
- source_word: repositam mercedem
  choice: a recompensa reservada
  rationale: Expressa o sentido de uma recompensa guardada ou posta de lado para o futuro.
- source_word: his qui [testamentis altissimi crediderunt]
  choice: para os que confiaram nas alianças do Altíssimo
  rationale: A formulação segue a continuação textual atestada na tradição latina e preservada na camada inglesa auditada; “confiaram” comunica o valor relacional de credere com dativo, e “alianças” representa testamenta no plural.
theological_decisions:
- issue: Natureza da resposta às alianças
  choice: confiaram nas alianças
  alternative: creram nas alianças
  rationale: “Confiaram” soa mais natural em português e preserva a dimensão de confiança de credere, sem acrescentar uma formulação doutrinária específica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A referência a “elas” retoma as almas do contexto imediato. O trecho latino fornecido termina em “his qui”; a conclusão é sustentada pela continuação textual da tradição latina refletida na edição e pela versão inglesa auditada.
