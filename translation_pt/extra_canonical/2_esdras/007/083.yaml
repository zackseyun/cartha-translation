  source_fidelity: 'A tradução preserva com precisão a estrutura e o sentido do latim: «Tertia uia» como «O terceiro caminho», «uident» como «elas veem» (com retomada contextual legítima das almas), e «repositam mercedem» como «a recompensa reservada». A continuação atestada «his qui testamentis Altissimi crediderunt», embora não conste integralmente no recorte latino apresentado, é corretamente refletida por «para os que confiaram nas alianças do Altíssimo» e está em conformidade com a trilha de auditoria inglesa.'
