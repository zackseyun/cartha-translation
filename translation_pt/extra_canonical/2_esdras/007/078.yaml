source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'temporibus. Nam de morte sermo est: quando profectus fuerit terminus sententiae ab Altissimo ut homo moriatur, recedente inspiratione de corpore ut dimittatur iterum'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/078.yaml
  text: 'Concerning death, the matter is this: when the decree has gone forth from the Most High that a man should die, as the breath departs from the body so that it may be sent back again,'
translation:
  language: pt
  text: 'Quanto à morte, a questão é esta: quando tiver saído do Altíssimo o decreto de que uma pessoa morra, ao deixar o sopro vital o corpo para ser enviado de volta,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sermo est
  choice: a questão é esta
  rationale: Expressa naturalmente a introdução do assunto sem transformar sermo em uma doutrina ou ensinamento formal.
- source_word: profectus fuerit terminus sententiae
  choice: tiver partido [...] a determinação
  rationale: Mantém a imagem de uma decisão que procede do Altíssimo; “determinação” comunica o sentido judicial de sententia sem tornar a formulação excessivamente técnica.
- source_word: homo
  choice: uma pessoa
  rationale: Representa o ser humano de modo genérico e natural no português atual.
- source_word: inspiratio
  choice: sopro vital
  rationale: Preserva o sentido primário de respiração ou alento que anima o corpo, sem identificar de modo inequívoco o termo com “espírito”.
- source_word: dimittatur iterum
  choice: para ser enviado de volta
  rationale: Conserva a voz passiva, a finalidade e a ideia de retorno presentes no latim, sem acrescentar um destino que o trecho não especifica.
theological_decisions:
- issue: Natureza daquilo que deixa o corpo na morte
  choice: sopro vital
  alternative: espírito
  rationale: O latim inspiratione favorece “sopro/alento”. A escolha evita impor uma definição antropológica mais específica do que a fonte permite.
- issue: Destino do sopro vital
  choice: para ser enviado de volta
  alternative: para voltar àquele que o deu
  rationale: O texto fornecido não identifica o destinatário do retorno. A tradução preserva essa indeterminação e não importa material de outro contexto bíblico.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe deliberadamente aberta no fim porque o trecho latino também continua além deste versículo. “Quanto à morte” verte o tópico sem acrescentar um marcador temporal inexistente. O fragmentário “temporibus.” no início da evidência pertence à frase anterior e, por isso, não foi incorporado.
