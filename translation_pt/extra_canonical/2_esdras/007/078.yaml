review_pass:
  verdict: revise
  source_fidelity: A tradução representa adequadamente sermo est como introdução do tema, conserva a determinação procedente do Altíssimo, verte homo de modo genérico e preserva a indeterminação quanto ao destino do sopro. Contudo, a ordem de «ao deixar o sopro vital o corpo» torna menos clara e menos natural a construção do ablativo absoluto recedente inspiratione de corpore.
  naturalness: «Tiver partido do Altíssimo a determinação» é compreensível, mas soa pouco idiomático em português atual. «Tiver saído do Altíssimo o decreto» preserva a metáfora de procedência e oferece leitura mais fluida. A colocação «ao deixar o corpo, para ser enviado de volta» deixa claro que o sujeito é «o sopro vital».
  terminology: «Questão» é apropriado para sermo neste contexto. «Decreto» exprime com naturalidade terminus sententiae, conforme o sentido decisório/judicial atestado também na trilha inglesa, sem introduzir doutrina. «Sopro vital» continua sendo uma opção prudente para inspiratione; não se deve especificar que seja «espírito» nem acrescentar a quem ele retorna.
  issues:
  - severity: low
    issue: Ordem sintática pouco natural e referente momentaneamente obscuro em «ao deixar o sopro vital o corpo».
    rationale: O latim diz que a inspiratio se retira do corpo. Reordenar para «ao deixar o corpo» torna o sujeito e a relação com «para ser enviado de volta» mais transparentes.
  - severity: low
    issue: «Tiver partido do Altíssimo a determinação» é uma formulação marcada em português moderno.
    rationale: «Tiver saído do Altíssimo o decreto» conserva o movimento figurado do original e melhora a idiomaticidade, mantendo a origem da decisão no Altíssimo.
  revised_text: 'Quanto à morte, a questão é esta: quando tiver saído do Altíssimo o decreto de que uma pessoa morra, ao deixar o sopro vital o corpo para ser enviado de volta,'
