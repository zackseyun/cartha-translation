id: 2ES.7.18
reference: 2 Esdras 7:18
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iusti autem ferent angusta sperantes spatiosa; qui enim impie gesserunt, et angustiam passi sunt et spatiosa non viderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/018.yaml
  text: But the righteous will endure narrow things[a], hoping for broad things[b]; for those who have acted ungodly have both suffered narrowness and not seen the broad things.
translation:
  language: pt
  text: Mas os justos suportarão as estreitezas[a], esperando as amplidões[b]; pois os que agiram de modo ímpio tanto sofreram a estreiteza como não viram as amplidões.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as dificuldades”. O texto mantém uma imagem espacial, em contraste com “as amplidões”.'
    reason: Esclarecer o sentido figurado sem apagar a metáfora literal do latim.
  - marker: b
    text: Isto é, realidades amplas ou espaçosas; o texto não especifica aqui sua natureza.
    reason: A forma latina é um adjetivo neutro plural substantivado, cuja referência permanece aberta.
lexical_decisions:
- source_word: iusti
  choice: os justos
  rationale: Equivalente direto e corrente, preservando a categoria moral do texto.
- source_word: ferent
  choice: suportarão
  rationale: Expressa a ideia de carregar ou aguentar circunstâncias penosas, sem eliminar a orientação futura da forma latina.
- source_word: angusta / angustiam
  choice: as estreitezas / a estreiteza
  rationale: Mantém a metáfora espacial deliberada e a coesão lexical em contraste com spatiosa; o plural substantivado e o singular do latim também são preservados.
- source_word: sperantes
  choice: esperando
  rationale: Conserva a esperança dirigida às realidades amplas ainda não alcançadas.
- source_word: spatiosa
  choice: as amplidões
  rationale: Substantivação natural em português que preserva a imagem espacial e se repete nas duas ocorrências.
- source_word: qui enim impie gesserunt
  choice: pois os que agiram de modo ímpio
  rationale: Traduz a conduta ímpia sem acrescentar uma identidade denominacional ou uma condenação além do texto.
- source_word: et ... et ...
  choice: tanto ... como ...
  rationale: Reproduz a correlação enfática dos dois resultados sofridos pelos ímpios.
theological_decisions:
- issue: Contraste entre a aflição presente e a realidade futura esperada
  choice: Preservar a metáfora de estreiteza e amplidão
  alternative: Explicitar como sofrimento presente e recompensa futura
  rationale: O latim emprega imagens espaciais e não define diretamente a natureza das 'amplidões'; explicá-las teologicamente resolveria uma abertura genuína do texto.
- issue: Sentido temporal de ferent
  choice: 'Futuro: “suportarão”'
  alternative: 'Presente habitual: “suportam”'
  rationale: A forma latina é futuro do indicativo, e sua orientação deve permanecer explícita.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por correspondência formal onde a metáfora espacial e a correlação retórica são decisivas. “Amplidões” é menos coloquial, mas preserva melhor o paralelismo com “estreitezas” do que uma paráfrase interpretativa.
