id: 2ES.7.92
reference: 2 Esdras 7:92
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: requiescent enim per septem ordines. Ordo primus, quoniam cum labore multo certati sunt, ut uincerent cum eis plasmatum cogitamentum malum, ut non eas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/092.yaml
  text: 'The first order: because with much struggle they have fought to overcome the evil thought formed with them, so that it might not lead them astray from life into death.'
translation:
  language: pt
  text: 'Pois repousarão em sete ordens. A primeira ordem: porque lutaram com muito esforço para vencer o mau pensamento formado com elas, para que ele não as desviasse da vida para a morte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: requiescent
  choice: descansarão
  rationale: Reproduz diretamente a ideia de repouso futuro, em linguagem natural e digna.
- source_word: septem ordines / Ordo primus
  choice: sete etapas / A primeira etapa
  rationale: Neste contexto, ordo indica uma sequência de estados ou graus de repouso; “etapa” comunica essa progressão com mais clareza do que o possível, porém ambíguo, “ordem”.
- source_word: cum labore multo certati sunt
  choice: em meio a muita luta, combateram
  rationale: Preserva tanto o esforço intenso quanto a imagem de combate presentes no latim.
- source_word: cum eis plasmatum cogitamentum malum
  choice: o mau pensamento formado juntamente com elas
  rationale: Mantém a formulação incomum e teologicamente significativa de que esse mau pensamento foi formado junto com as almas, sem explicá-la como pecado original, inclinação natural ou influência externa.
- source_word: ut non eas … a vita in mortem
  choice: a fim de que ele não as desviasse da vida para a morte
  rationale: “Desviasse” expressa de modo natural o movimento moral da vida para a morte refletido na tradição textual e na camada inglesa auditada.
theological_decisions:
- issue: Origem ou natureza do “mau pensamento”
  choice: formado juntamente com elas
  alternative: inerente a elas / criado dentro delas
  rationale: A redação conserva a tensão de plasmatum cum eis e evita definir uma doutrina antropológica que o texto não explicita.
- issue: Sentido de ordines
  choice: etapas
  alternative: ordens / graus
  rationale: “Etapas” apresenta os sete estados como uma sequência sem impor uma hierarquia metafísica rígida; a alternativa literal “ordens” seria menos clara em português corrente.
translation_notes:
  register: Português moderno, amplo e digno, com boa legibilidade brasileira. A construção deliberadamente incomum “formado juntamente com elas” preserva a ambiguidade do original, enquanto “etapas” torna inteligível a progressão dos sete ordines.
