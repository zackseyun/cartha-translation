  naturalness: A redação revista permanece natural em português moderno e evita a duplicação algo pesada de «em meio a muita luta, combateram». «Ordens» é plenamente compreensível neste enquadramento enumerativo.
  terminology: «Ordens» preserva o termo estrutural do original sem decidir se são estágios, graus ou categorias. «Formado com elas» conserva a formulação incomum *cum eis plasmatum* sem impor explicação teológica.
