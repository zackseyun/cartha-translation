id: 2ES.7.29
reference: 2 Esdras 7:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post annos hos, et morietur Filius meus Christus et omnes qui spiramentum habent hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/029.yaml
  text: And after these years, my Son the Messiah will die, and all who have human breath.
translation:
  language: pt
  text: E acontecerá que, depois desses anos, meu Filho, o Messias, morrerá, bem como todos os que têm alento humano.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filius meus Christus
  choice: meu Filho, o Messias
  rationale: “Filius meus” é traduzido diretamente por “meu Filho”; aqui, o latim “Christus” funciona como título e é expresso por “o Messias”, em conformidade com o sentido de “Ungido” e com a camada inglesa auditada.
- source_word: spiramentum habent hominis
  choice: têm alento humano
  rationale: A formulação preserva a referência ao sopro vital próprio dos seres humanos, evitando o português pouco natural “têm o alento do homem”.
- source_word: et omnes
  choice: bem como todos
  rationale: Neste contexto, “bem como” liga naturalmente à morte já afirmada do Filho sem alterar o alcance universal de “omnes”.
theological_decisions:
- issue: A morte do Filho/Messias
  choice: meu Filho, o Messias, morrerá
  alternative: meu filho Cristo morrerá
  rationale: Mantém a afirmação teologicamente tensa e explícita do texto latino, sem suavizar “morietur”; “Messias” comunica o título “Christus”, e a maiúscula em “Filho” identifica o título na fala divina.
- issue: Alcance de “todos os que têm alento humano”
  choice: todos os que têm alento humano
  alternative: todos os seres humanos
  rationale: Conserva a imagem concreta do alento presente no latim e não acrescenta uma explicação interpretativa sobre identidade, época ou extensão.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com boa legibilidade brasileira. A abertura “E acontecerá que” conserva a cadência profética do latim; “alento humano” mantém sua imagem sem soar excessivamente literal.
