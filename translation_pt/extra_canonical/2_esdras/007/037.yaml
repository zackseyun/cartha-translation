source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'gehennae ostendetur, et contra eum iocunditatis paradisus. Et dicet tunc Altissimus ad excitatas gentes : uidete et intellegite quem negastis, uel cui non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/037.yaml
  text: And then the Most High will say to the awakened nations[a], “Look and understand whom you denied, or whom you did not serve, or whose ways you despised.
translation:
  language: pt
  text: 'Então o Altíssimo dirá às nações despertadas[a]: “Vejam e entendam quem vocês negaram, a quem não serviram e cujos caminhos desprezaram.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nações que foram levantadas”.
    reason: Registra a alternativa semântica de excitatas, que pode indicar tanto terem sido despertadas como terem sido levantadas.
lexical_decisions:
- source_word: excitatas
  choice: despertadas
  rationale: Preserva a imagem de despertar ou ser acordado presente no latim e no contexto de sono e ressurreição, sem reduzi-la ao sentido mais genérico de levantar.
- source_word: uidete et intellegite
  choice: Vejam e entendam
  rationale: Reproduz os dois imperativos de modo claro, natural e digno em português contemporâneo.
- source_word: negastis
  choice: negaram
  rationale: Mantém o sentido direto de negar ou rejeitar alguém, sem acrescentar uma interpretação teológica mais específica.
theological_decisions:
- issue: Sentido de excitatas no contexto do juízo e da ressurreição
  choice: nações despertadas
  alternative: nações que foram levantadas
  rationale: “Despertadas” conserva a metáfora contextual de sono e despertar; a alternativa possível é registrada em nota para preservar a nuance passiva e a possível referência à ressurreição.
translation_notes:
  register: Português atual, claro e solene, com formas verbais de terceira pessoa plural (“vocês”) para ampla legibilidade brasileira. A coordenação final foi apresentada naturalmente em português, acompanhando a redação auditada, embora o trecho latino fornecido termine de modo incompleto em “uel cui non”.
