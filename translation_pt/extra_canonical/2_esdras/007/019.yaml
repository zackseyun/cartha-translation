  source_fidelity: 'A tradução principal capta adequadamente o sentido comparativo mais provável de super nas duas orações e preserva o paralelismo: o interlocutor não é mais qualificado para julgar nem mais entendido que Deus. Contudo, «juiz melhor que» não é a ordem idiomática normal em português e pode soar como se «melhor» qualificasse outra relação; «melhor juiz do que» exprime com clareza o comparativo implícito no contexto.'
