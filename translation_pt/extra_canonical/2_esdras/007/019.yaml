  yaml_path: translation/extra_canonical/2_esdras/007/019.yaml
  text: And he said to me[a], “You are not a judge over the Lord, nor one who understands over the Most High.”
translation:
  language: pt
  text: 'E ele me disse: “Você não é melhor juiz do que o Senhor, nem tem mais entendimento do que o Altíssimo.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, mais literalmente: “Você não é juiz sobre o Senhor, nem alguém entendido acima do Altíssimo.” O latim super pode expressar tanto a ideia de estar sobre ou acima de alguém quanto uma comparação.'
    reason: Preserva a ambiguidade semântica de super e registra uma tradução mais estritamente formal.
lexical_decisions:
- source_word: iudex
  choice: juiz
  rationale: Preserva o substantivo latino e a imagem de alguém que pretende avaliar ou julgar melhor que o Senhor.
- source_word: super
  choice: melhor que / mais ... que
  rationale: No paralelismo das duas orações, super é entendido em sentido comparativo; essa formulação produz português natural sem perder a correspondência entre os membros.
- source_word: intellegens
  choice: tem ... entendimento
  rationale: Expressa o particípio latino de maneira corrente e digna, evitando o pouco natural «é mais entendedor».
- source_word: Altissimum
  choice: o Altíssimo
  rationale: Mantém o título divino tradicional e semanticamente direto.
theological_decisions:
- issue: Sentido de super nas duas orações
  choice: 'Leitura comparativa: «melhor que» e «mais ... que»'
  alternative: 'Leitura espacial ou hierárquica: «sobre/acima do Senhor» e «sobre/acima do Altíssimo»'
  rationale: O paralelismo favorece a mesma relação comparativa em ambos os membros, mas o latim super admite formalmente a leitura «sobre/acima de»; a nota preserva essa ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção comparativa paralela evita a formulação pouco natural «entende sobre o Altíssimo», enquanto a nota conserva a possibilidade literal do latim.
