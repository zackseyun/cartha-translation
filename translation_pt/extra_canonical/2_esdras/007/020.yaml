base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/020.yaml
  text: For let many of those now present perish[a], rather than the law of God that has been set forth be neglected.
translation:
  language: pt
  text: Pois, que pereçam muitos dos que agora estão presentes, em vez de a lei de Deus que foi apresentada ser negligenciada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que muitos dos que agora vivem pereçam”.'
    reason: Praesentes pode referir-se diretamente aos presentes ou, em sentido contextual mais amplo, aos que vivem no tempo atual.
lexical_decisions:
- source_word: enim
  choice: Pois
  rationale: Preserva a ligação explicativa ou causal com o contexto anterior.
- source_word: multi praesentes
  choice: muitos dos que agora estão presentes
  rationale: Mantém o sentido mais direto de praesentes e evita restringi-lo sem necessidade a 'os que agora vivem'.
- source_word: pereant
  choice: pereçam
  rationale: Reproduz a força volitiva do subjuntivo latino no contraste formulado pelo versículo.
- source_word: quam neglegatur
  choice: em vez de ser negligenciada
  rationale: Expressa naturalmente em português a preferência comparativa do latim, conservando a voz passiva.
- source_word: quae anteposita est Dei lex
  choice: a lei de Deus que foi apresentada
  rationale: Entende anteposita est como aquilo que foi posto diante das pessoas ou exposto, sem acrescentar um objeto indireto ausente do texto latino.
theological_decisions:
- issue: Contraste entre a perdição de muitos e a preservação da lei divina
  choice: Manter literalmente a preferência contundente expressa pelo texto
  alternative: Suavizar como mera previsão de que muitos perecerão
  rationale: O subjuntivo pereant em correlação com quam neglegatur apresenta uma formulação volitiva ou preferencial; suavizá-la eliminaria a tensão teológica genuína.
translation_notes:
  register: Português moderno, digno e acessível, com construção próxima do latim. A forma 'Pois que ... pereçam' preserva a força volitiva, embora deliberadamente solene; a nota registra a alternativa sem substituir o sentido lexical mais direto de praesentes.
