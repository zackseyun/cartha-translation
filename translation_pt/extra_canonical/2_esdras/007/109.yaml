  text: and Elijah for those who received rain and for the dead man, that he might live,
translation:
  language: pt
  text: e Elias, por aqueles que receberam chuva e pelo morto, para que voltasse a viver,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Helias
  choice: Elias
  rationale: Forma portuguesa tradicional e amplamente reconhecida do nome bíblico.
- source_word: pro his qui pluviam acceperunt
  choice: por aqueles que receberam chuva
  rationale: Mantém a construção de intercessão introduzida por pro e traduz literalmente a referência aos beneficiários da chuva.
- source_word: pro mortuo
  choice: pelo morto
  rationale: Reproduz de modo conciso a expressão latina, sem explicitar uma identidade que o texto não fornece.
- source_word: ut viveret
  choice: para que voltasse a viver
  rationale: Expressa naturalmente, no contexto de um morto, a finalidade de que ele recuperasse a vida.
theological_decisions:
- issue: Natureza da ação de Elias em favor das pessoas e do morto
  choice: Preservar a formulação elíptica “por... e pelo...”
  alternative: Explicitar “Elias orou por...”
  rationale: O fragmento depende sintaticamente do contexto anterior e não contém aqui um verbo explícito; acrescentar “orou” resolveria uma elipse que deve ser preservada.
- issue: Sentido de ut viveret
  choice: “para que voltasse a viver”
  alternative: “para que vivesse”
  rationale: A alternativa é mais formalmente literal, mas, aplicada a alguém já chamado de morto, a redação escolhida comunica com clareza a restauração à vida sem acrescentar agente ou mecanismo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com fluidez brasileira. A vírgula antes da oração final ajuda a marcar sua relação específica com “o morto”.
