revisions:
- from: E porque nos foi anunciada de antemão uma esperança eterna, mas nós nos tornamos completamente fúteis?
  to: E, visto que nos foi anunciada previamente uma esperança eterna, nós, porém, nos tornamos completamente fúteis?
  rationale: Substitui-se «porque» por «visto que» para representar quoniam sem converter a pergunta elíptica numa pergunta de causa. Conservam-se a esperança eterna, a oposição marcada por vero e a intensificação de pessime vani.
