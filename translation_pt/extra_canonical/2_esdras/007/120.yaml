  text: E, visto que nos foi anunciada previamente uma esperança eterna, nós, porém, nos tornamos completamente fúteis?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praedicta est
  choice: foi anunciada de antemão
  rationale: Preserva o sentido de algo previamente declarado ou anunciado, sem restringi-lo à ideia técnica de profecia.
- source_word: perennis spes
  choice: uma esperança eterna
  rationale: Expressa a esperança duradoura e imperecível indicada por perennis em linguagem natural e digna.
- source_word: pessime vani
  choice: completamente fúteis
  rationale: No contexto, vani comunica vacuidade ou inutilidade, não vaidade pessoal; pessime intensifica fortemente a expressão.
theological_decisions:
- issue: Relação lógica entre a esperança anunciada e a condição humana
  choice: manter a pergunta com «E porque... mas...»
  alternative: transformar a frase em afirmação ou explicitar uma conclusão teológica
  rationale: O latim apresenta uma pergunta elíptica e tensa; a tradução conserva essa forma sem resolver silenciosamente sua lógica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil; tom solene, porém acessível. Não se acrescentou nota porque a alternativa inglesa registrada não corresponde a uma ambiguidade textual útil para esta redação portuguesa.
