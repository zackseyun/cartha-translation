  text: And now understand from your own words, because you said that understanding grows with us.
translation:
  language: pt
  text: E agora entenda, com base nas suas próprias palavras, pois você disse que o entendimento cresce conosco.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de sermonibus tuis
  choice: com base nas suas próprias palavras
  rationale: Expressa naturalmente que a conclusão deve ser tirada do que o interlocutor acabou de dizer; “próprias” torna explícita em português a força do possessivo latino.
- source_word: intellege
  choice: entenda
  rationale: Imperativo direto e corrente, correspondente ao latino.
- source_word: sensus
  choice: o entendimento
  rationale: Neste contexto, designa a faculdade ou capacidade de compreender; preserva a formulação da fonte sem especificar indevidamente “conhecimento” ou “consciência”.
- source_word: nobiscum crescit
  choice: cresce conosco
  rationale: 'Mantém a imagem e a possível ambiguidade do latim: o entendimento se desenvolve junto de nós ou à medida que crescemos.'
