  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
translation:
  language: pt
  text: 'Portanto, os que habitam na terra serão atormentados por esta razão: embora tivessem entendimento, praticaram a iniquidade; embora tivessem recebido mandamentos, não os guardaram; e, embora tivessem obtido a lei, agiram de modo traiçoeiro para com ela.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: commorantes sunt in terra
  choice: os que habitam na terra
  rationale: Expressa de modo natural e fiel a ideia de permanecer ou viver na terra.
- source_word: hinc
  choice: por esta razão
  rationale: Torna explícito o valor causal do advérbio no contexto.
- source_word: sensum habentes
  choice: embora tivessem entendimento
  rationale: 'Preserva a concessão implícita: possuíam capacidade de compreender, mas ainda assim praticaram o mal.'
- source_word: iniquitatem fecerunt
  choice: praticaram a iniquidade
  rationale: Mantém o vocabulário moral e jurídico do latim em registro bíblico claro.
- source_word: mandata accipientes non seruauerunt ea
  choice: embora tivessem recebido mandamentos, não os guardaram
  rationale: “Guardar” é natural no português bíblico e conserva o sentido de observar ou cumprir os mandamentos.
- source_word: legem consecuti
  choice: embora tivessem obtido a lei
  rationale: Reproduz o sentido de alcançar ou receber posse da lei sem identificar indevidamente o modo dessa obtenção.
- source_word: dealt deceitfully with it (English consultation layer; continuation absent from the supplied Latin excerpt)
  choice: agiram de modo traiçoeiro para com ela
  rationale: Segue a camada inglesa auditada para a oração final, com referência inequívoca à lei, sem acrescentar objeto ou interpretação denominacional.
theological_decisions:
- issue: Fundamento do tormento
  choice: Manter a sequência causal entre entendimento, mandamentos, lei e responsabilidade moral.
  alternative: Generalizar a causa como simples incredulidade ou pecado.
  rationale: O texto atribui responsabilidade especificamente ao contraste entre o conhecimento recebido e a conduta praticada.
- issue: Identidade da lei
  choice: Traduzir simplesmente como “a lei”.
  alternative: Especificar “a Lei de Moisés” ou outra identificação.
  rationale: O texto não explicita essa identificação; preserva-se sua abertura referencial.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo concessivo preservado. O mais-que-perfeito composto (“tivessem recebido”, “tivessem obtido”) articula naturalmente as ações anteriores ao fracasso moral. Não foram acrescentadas notas ao texto.
