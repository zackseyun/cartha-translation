review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente a sequência e a personificação do latim. Contudo, «será revelada» torna ostendetur mais específico do que «será mostrada», e «permanecerão vigilantes» acrescenta a noção durativa de permanência que não está explicitamente em vigilabunt.
  naturalness: O texto é claro, solene e natural em português moderno. «Vigiarão» é mais direto, idiomático e próximo do verbo latino do que «permanecerão vigilantes».
  terminology: «Obra», «recompensa», «atos de justiça» e «atos de injustiça» mantêm os termos gerais e o paralelismo do original, sem impor interpretação teológica adicional.
  issues:
  - severity: low
    issue: «Será revelada» para ostendetur
    rationale: O verbo ostendere significa primariamente «mostrar» ou «tornar visível». «Revelar» pode sugerir a divulgação de algo antes oculto, nuance possível no contexto, mas não exigida pelo texto.
  - severity: low
    issue: «Permanecerão vigilantes» para vigilabunt
    rationale: A formulação acrescenta a ideia de continuidade («permanecerão»). «Vigiarão» reproduz mais diretamente o futuro de vigilare e conserva a personificação.
  - severity: low
    issue: «Obras de justiça/injustiça»
    rationale: É defensável, mas «atos de justiça/injustiça» expressa de modo mais natural o plural concreto e preserva a simetria do inglês de controle sem confundir o opus singular inicial com os plurais finais.
