  text: et opus subsequetur et merces ostendetur. et iustitiae vigilabunt et iniustitiae non dormibunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/035.yaml
  text: And the deed will follow, and the reward will be shown, and acts of righteousness will keep watch, and acts of unrighteousness will not sleep.
translation:
  language: pt
  text: E a obra seguirá, e a recompensa será mostrada; os atos de justiça vigiarão, e os atos de injustiça não dormirão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus
  choice: a obra
  rationale: Preserva o substantivo singular latino e sua referência ampla ao que foi realizado, sem restringi-lo a um ato específico.
- source_word: subsequetur
  choice: virá em seguida
  rationale: Expressa com naturalidade a ideia de seguir ou vir depois, mantendo a sequência escatológica do texto.
- source_word: merces
  choice: a recompensa
  rationale: Equivalente corrente que conserva a noção de retribuição devida, sem especificar se favorável ou punitiva além do que o contexto permite.
- source_word: ostendetur
  choice: será revelada
  rationale: Transmite a manifestação pública da recompensa; em português, 'revelada' é mais natural neste contexto solene do que a tradução estritamente literal 'mostrada'.
- source_word: iustitiae
  choice: as obras de justiça
  rationale: O plural abstrato latino pode indicar manifestações ou atos justos; a explicitação por 'obras' produz português inteligível e preserva o paralelismo com opus.
- source_word: vigilabunt
  choice: permanecerão vigilantes
  rationale: Conserva a imagem de vigiar ou manter-se desperto, evitando reduzi-la simplesmente a 'despertarão'.
- source_word: iniustitiae
  choice: as obras de injustiça
  rationale: Mantém o paralelismo com iustitiae e representa manifestações concretas da injustiça sem introduzir uma categoria denominacional.
- source_word: non dormibunt
  choice: não dormirão
  rationale: Tradução direta que preserva a personificação e o contraste com 'permanecerão vigilantes'.
theological_decisions:
- issue: Natureza da obra e da recompensa no juízo
  choice: 'Manter os referentes em termos gerais: ''a obra'' e ''a recompensa''.'
  alternative: Explicitar 'as ações de cada pessoa' e 'a retribuição correspondente'.
  rationale: O latim não identifica explicitamente o agente nem define a recompensa; a tradução conserva essa abertura e a tensão judicial do enunciado.
- issue: Personificação de justiça e injustiça
  choice: Preservar a imagem de obras que vigiam e não dormem.
  alternative: Interpretar como obras que serão lembradas ou permanecerão registradas.
  rationale: A alternativa explicaria uma possível implicação, mas eliminaria a personificação marcante do original.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com paralelismo deliberado entre 'obras de justiça' e 'obras de injustiça'. A pontuação com ponto e vírgula organiza as duas declarações paralelas sem alterar sua relação. Não há marcadores de nota, pois nenhuma nota é necessária.
