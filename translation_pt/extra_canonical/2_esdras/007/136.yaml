base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/136.yaml
  text: and of great mercy[a], because he multiplies mercies for those who are present and those who have passed away and those who are to come.
translation:
  language: pt
  text: e de grande misericórdia[a], porque multiplica as misericórdias para os que estão presentes, os que já se foram e os que ainda virão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «rico em misericórdias, porque multiplica cada vez mais as misericórdias».'
    reason: Registra uma tradução alternativa para multae misericordiae e a possível força intensiva ou comparativa de magis.
lexical_decisions:
- source_word: multae misericordiae
  choice: de grande misericórdia
  rationale: O genitivo latino expressa qualidade ou característica; em português, «de grande misericórdia» conserva o sentido sem transformar indevidamente o singular coletivo em «misericórdias».
- source_word: multiplicat magis misericordias
  choice: multiplica as misericórdias
  rationale: «Multiplica» já comunica aumento. O comparativo/intensivo magis não exige a ideia progressiva de «cada vez mais», embora essa leitura permaneça possível e seja registrada em nota.
- source_word: qui praeterierunt
  choice: os que já se foram
  rationale: Expressão natural para pessoas de gerações passadas, compatível com o sentido de terem passado ou falecido.
- source_word: qui futuri sunt
  choice: os que ainda virão
  rationale: Forma idiomática que preserva a referência às pessoas ou gerações futuras.
theological_decisions:
- issue: Alcance temporal da misericórdia divina
  choice: Manter as três categorias — presentes, passados e futuros — sem explicar como a misericórdia alcança cada grupo.
  alternative: Interpretar a frase como uma afirmação específica sobre salvação após a morte ou predestinação.
  rationale: O texto enumera grupos temporais, mas não define o mecanismo nem as consequências teológicas dessa misericórdia; explicitar uma doutrina iria além do latim.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A coordenação inicial «e» foi preservada porque o versículo continua a descrição anterior. O marcador [a] aparece no texto principal.
