source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et legem eius spreverunt et sponsiones eius abnegaverunt et legitimis eius fidem non habuerunt et opera eius non perfecerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
translation:
  language: pt
  text: Desprezaram a sua lei, negaram as suas promessas[a], não foram fiéis aos seus estatutos e não realizaram as suas obras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “rejeitaram as suas garantias”.'
    reason: “Garantias” explicita a nuance de sponsiones como promessas formalmente empenhadas, sem sugerir “alianças” nem acrescentar informação ausente do texto.
lexical_decisions:
- source_word: spreverunt
  choice: desprezaram
  rationale: Reproduz diretamente a ideia de tratar a lei com desprezo ou desdém.
- source_word: sponsiones
  choice: promessas
  rationale: Sponsio designa aqui promessas ou garantias empenhadas; 'alianças' introduziria uma categoria que o latim normalmente expressa por testamentum.
- source_word: legitimis
  choice: estatutos
  rationale: No contexto da lei divina, refere-se às determinações ou normas estabelecidas por Deus.
- source_word: fidem non habuerunt
  choice: não confiaram
  rationale: Preserva o sentido básico de não depositar fé ou confiança nos estatutos, sem restringir a expressão apenas à obediência.
- source_word: opera eius non perfecerunt
  choice: não realizaram as suas obras
  rationale: Mantém a formulação concreta do latim e sua possível referência às obras requeridas por Deus.
theological_decisions:
- issue: Sentido de sponsiones eius
  choice: suas promessas
  alternative: suas alianças
  rationale: O substantivo latino sponsio indica promessa ou garantia empenhada; a linguagem específica de aliança seria normalmente outra.
- issue: Relação de fides com os estatutos
  choice: não confiaram nos seus estatutos
  alternative: não foram fiéis aos seus estatutos
  rationale: A construção fidem habere com dativo favorece 'confiar em/dar crédito a'; a alternativa enfatizaria lealdade ou observância e reduziria a ambiguidade.
translation_notes:
  register: Português atual, digno e de leitura ampla, com paralelismo verbal claro. Conserva 'suas obras' por fidelidade ao texto, embora a expressão permaneça semanticamente aberta.
