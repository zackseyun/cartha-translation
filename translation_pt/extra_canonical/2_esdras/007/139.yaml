source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et iudex, si non ignoverit his qui creati sunt verbo eius et deleverit multitudinem contemptionum, non fortassis derelinquenturinnumerabilem multitudinem nisi pauci valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/139.yaml
  text: And if the Judge did not forgive those who were created by his word and blot out the multitude of acts of contempt[b][a], perhaps only a very few would be left from an innumerable multitude.
translation:
  language: pt
  text: E, se o Juiz não perdoasse aos que foram criados por sua palavra nem apagasse a multidão dos atos de desprezo, talvez restassem apenas pouquíssimos de uma multidão inumerável.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex
  choice: o Juiz
  rationale: Mantém o título definido e sua função judicial no argumento, sem acrescentar uma oração como “ele é juiz”, que o latim não exige.
- source_word: ignoverit
  choice: perdoasse
  rationale: Expressa o perdão concedido às pessoas e, com “se” e “talvez”, forma em português uma hipótese natural e coerente.
- source_word: verbo eius
  choice: por sua palavra
  rationale: Reproduz o meio ou agente expresso pelo ablativo latino e conserva a linguagem teológica da criação pela palavra divina.
- source_word: deleverit
  choice: apagasse
  rationale: Preserva a imagem de eliminar ou cancelar atos registrados, em vez de generalizar como simples tolerância.
- source_word: contemptionum
  choice: atos de desprezo
  rationale: Conserva o sentido específico de desprezo, desdém ou rejeição deliberada, mais forte que o genérico “ofensas”.
- source_word: nisi pauci valde
  choice: apenas pouquíssimos
  rationale: Transmite com naturalidade a força enfática de valde aplicada aos poucos que restariam.
theological_decisions:
- issue: Relação entre perdão e juízo
  choice: 'Manter ambos na mesma hipótese: o Juiz perdoa e apaga os atos de desprezo.'
  alternative: Explicitar uma doutrina sobre como o perdão se relaciona com o juízo.
  rationale: O texto põe em tensão a identidade do Juiz e sua ação perdoadora, mas não explica o mecanismo teológico; a tradução não deve resolvê-lo.
- issue: Força de contemptionum
  choice: atos de desprezo
  alternative: ofensas
  rationale: A escolha preserva a ideia de desprezo ou afronta deliberada presente no termo latino, sem reduzi-la a uma categoria genérica de pecado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção “se... não... nem...” deixa claro que a negação abrange os dois verbos. O subjuntivo imperfeito com “talvez... restassem” apresenta a situação como hipótese, sem importar o causal “porque”, ausente no texto latino.
