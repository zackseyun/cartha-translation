  yaml_path: translation/extra_canonical/2_esdras/007/085.yaml
  text: 'The fifth way: they see the dwelling place of the others guarded by angels[a]'
translation:
  language: pt
  text: 'O quinto caminho: elas veem a morada dos outros guardada por anjos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quinta uia
  choice: O quinto caminho
  rationale: Mantém a estrutura enumerativa do latim em linguagem portuguesa natural.
- source_word: aliorum habitaculum
  choice: a morada dos outros
  rationale: Habitaculum está no singular e designa uma morada coletiva; “dos outros” preserva sem explicitar a identidade que o trecho não declara.
- source_word: ab angelis conseruari
  choice: guardada por anjos
  rationale: A construção passiva latina expressa que a morada é mantida sob guarda ou proteção dos anjos; “guardada” reproduz isso com clareza e concisão.
theological_decisions:
- issue: Identidade de aliorum (“dos outros”)
  choice: Preservar a expressão aberta “dos outros”
  alternative: Explicitar “dos justos” ou “das outras almas”
  rationale: Embora o contexto possa identificar o grupo, o trecho latino diz apenas aliorum; a tradução não deve resolver silenciosamente essa referência.
- issue: Número de habitaculum
  choice: Usar o singular “morada”
  alternative: Usar o plural “moradas”
  rationale: O texto latino traz inequivocamente o substantivo singular habitaculum, entendido como morada coletiva.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. O pronome “elas” retoma as almas mencionadas no contexto; “morada” evita a rigidez de “habitação” sem perder o sentido do original.
