  text: But its entrance will be set in a narrow place[b][a], so that it would be like a river.
translation:
  language: pt
  text: Mas sua entrada estará situada num lugar estreito, de modo que será semelhante a um rio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  choice: entrada
  rationale: Equivalente direto e natural para o acesso ao lugar mencionado no contexto.
- source_word: in angusto loco
  choice: num lugar estreito
  rationale: Preserva a imagem espacial do latim sem tornar a formulação artificial.
- source_word: erit ... positus
  choice: será situada
  rationale: Mantém o futuro e o sentido passivo da construção latina, com concordância natural com «entrada».
- source_word: similis fluminis
  choice: se assemelhe a um rio
  rationale: Expressa com clareza a comparação indicada por «similis» e conserva «rio» como referente explícito.
theological_decisions:
- issue: Valor de ut esset
  choice: para que se assemelhe
  alternative: de modo que se assemelhasse
  rationale: A oração pode indicar finalidade ou resultado. «Para que» preserva a abertura para ambos no contexto, enquanto o presente do subjuntivo é a forma portuguesa natural após uma oração principal no futuro; reproduzir mecanicamente o imperfeito latino tornaria a sequência temporal pouco natural.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e preservação do futuro passivo e da imagem do rio.
