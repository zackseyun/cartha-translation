source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'seruiuistis, uel cuius diligentias spreuistis. Uidete contra et in contra: hic iocunditas et requies, et ibi ignis et tormenta; haec autem loqueris dicens ad eos in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/038.yaml
  text: 'Look on this side and on that: here are delight and rest, and there are fire and torments. These are the words he will speak to them on the day of judgment.'
translation:
  language: pt
  text: 'Olhem para um lado e para o outro: aqui há alegria e descanso; ali, fogo e tormentos. Mas estas coisas lhes dirás no dia do juízo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Uidete contra et in contra
  choice: Olhem para um lado e para o outro
  rationale: Reproduz de modo natural o contraste espacial enfático da expressão latina, sem tentar eliminar sua formulação incomum.
- source_word: iocunditas et requies
  choice: alegria e descanso
  rationale: Mantém os dois substantivos e o contraste com fogo e tormentos; “alegria” comunica de forma corrente o sentido positivo de iocunditas.
- source_word: ignis et tormenta
  choice: fogo e tormentos
  rationale: Tradução direta que conserva tanto o singular coletivo “fogo” quanto o plural “tormentos”.
- source_word: loqueris dicens ad eos
  choice: dirás a eles
  rationale: Preserva a segunda pessoa do singular do latim e expressa naturalmente em português a construção redundante “falarás, dizendo a eles”.
theological_decisions:
- issue: Pessoa gramatical de quem pronunciará as palavras
  choice: dirás a eles
  alternative: ele falará a eles
  rationale: O latim loqueris está na segunda pessoa do singular; por isso, a tradução não segue a terceira pessoa adotada na camada inglesa.
translation_notes:
  register: Português atual, claro e digno. Emprega-se “Olhem” para o imperativo plural, evitando o arcaísmo “Vede”; mantém-se “dirás” para marcar com precisão a segunda pessoa singular sem acrescentar um pronome regionalmente marcado.
