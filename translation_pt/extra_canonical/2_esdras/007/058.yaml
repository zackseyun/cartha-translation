  text: 'Et dixi : dominator domine, quod abundat uilius, quod enim rarius pretiosius est.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/058.yaml
  text: And I said[a], “O Lord, ruler, what is more abundant is of less value[b], for what is rarer is more precious.”
translation:
  language: pt
  text: 'E eu disse: “Ó Senhor soberano[a], o que é mais abundante tem menos valor[b], pois o que é mais raro é mais precioso.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Ó Senhor, governante”.'
    reason: Registra uma forma alternativa de explicitar dominator como título distinto de domine, sem transformar a invocação em oração relativa.
  - marker: b
    text: 'Ou: “vale menos”; ou, em sentido econômico, “é mais barato”.'
    reason: O latim uilius pode indicar menor valor ou menor preço; o texto principal preserva o sentido mais amplo exigido pelo contraste com “mais precioso”.
lexical_decisions:
- source_word: dominator domine
  choice: Ó Soberano Senhor
  rationale: Reproduz a dupla forma de tratamento no vocativo com uma expressão natural, solene e bíblica em português, sem transformar os títulos em uma oração explicativa.
- source_word: quod abundat
  choice: o que é mais abundante
  rationale: Preserva o sentido comparativo sugerido pelo contraste com quod rarius e evita restringir a máxima a uma categoria específica.
- source_word: uilius
  choice: tem menos valor
  rationale: Expressa o valor inferior em contraste direto com pretiosius, mantendo o registro reflexivo mais amplo do que a alternativa comercial 'é mais barato'.
- source_word: pretiosius
  choice: mais precioso
  rationale: Mantém o contraste lexical e conceitual com uilius, além do tom elevado da afirmação.
theological_decisions:
- issue: Forma de tratamento divino em dominator domine
  choice: Ó Soberano Senhor
  alternative: Ó Senhor que governa
  rationale: A escolha mantém os dois títulos e o caráter litúrgico da invocação, sem impor uma interpretação denominacional; a alternativa explicita verbalmente dominator, mas é menos formal.
translation_notes:
  register: Português moderno, claro e digno, com uma forma de tratamento solene. A construção proverbial e o paralelismo entre abundância/raridade e menor valor/maior preciosidade foram preservados.
