  yaml_path: translation/extra_canonical/2_esdras/007/034.yaml
  text: But judgment alone will remain, and truth will stand, and faith will grow strong.
translation:
  language: pt
  text: Mas somente o juízo permanecerá; a verdade ficará firme, e a fé se fortalecerá.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicium
  choice: o juízo
  rationale: Mantém o sentido judicial e escatológico do termo latino, sem acrescentar uma interpretação denominacional.
- source_word: solum remanebit
  choice: somente ... permanecerá
  rationale: Reproduz a ênfase exclusiva de solum e o aspecto duradouro de remanebit em português natural.
- source_word: veritas stabit
  choice: a verdade ficará firme
  rationale: Expressa a metáfora de permanecer de pé com uma formulação idiomática, preservando a ideia de estabilidade e vindicação.
- source_word: fides convalescet
  choice: a fé se fortalecerá
  rationale: Convalescet indica ganhar força ou tornar-se vigorosa; a tradução conserva fides como “fé” sem decidir entre possíveis nuances de fé e fidelidade.
theological_decisions:
- issue: Sentido de fides
  choice: a fé
  alternative: a fidelidade
  rationale: “Fé” é a correspondência mais direta e mantém aberta a amplitude semântica de fides no contexto, evitando definir antecipadamente se se trata de crença, confiança ou fidelidade.
- issue: Força escatológica de iudicium
  choice: o juízo
  alternative: o julgamento
  rationale: “Juízo” preserva o tom solene e a possível referência ao juízo final, sem explicitar no texto aquilo que o latim deixa implícito.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A pontuação marca as três afirmações paralelas sem alterar sua relação lógica.
