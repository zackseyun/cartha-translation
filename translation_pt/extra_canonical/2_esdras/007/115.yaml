source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tunc ergo nemo poterit misereri eius qui in iudicio victus fuerit, neque demergere eum qui vicerit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/115.yaml
  text: Therefore no one will then be able to have mercy on one who has been defeated in the judgment[a], nor to cast down one who has prevailed.
translation:
  language: pt
  text: Portanto, naquele momento ninguém poderá ter misericórdia daquele que tiver sido vencido no julgamento[a], nem derrubar aquele que tiver prevalecido.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “derrotado”.'
    reason: Registra uma alternativa lexical direta para victus, embora 'vencido' preserve melhor em português o paralelo com quem prevaleceu.
lexical_decisions:
- source_word: Tunc ergo
  choice: Portanto, naquele momento
  rationale: Conserva tanto a relação conclusiva de ergo quanto a referência temporal de tunc em português natural.
- source_word: misereri eius
  choice: ter misericórdia daquele
  rationale: Reproduz diretamente a construção latina e mantém a ideia de compaixão, sem acrescentar a possibilidade de livramento.
- source_word: in iudicio victus fuerit
  choice: tiver sido vencido no julgamento
  rationale: Mantém a metáfora de derrota e o contexto forense explícito; evita substituir victus por 'condenado', interpretação mais específica.
- source_word: demergere
  choice: derrubar
  rationale: Expressa o sentido de fazer cair ou rebaixar, com naturalidade, sem impor uma imagem física excessivamente específica como 'submergir'.
- source_word: qui vicerit
  choice: aquele que tiver prevalecido
  rationale: No paralelo forense com victus e in iudicio, vicerit indica quem venceu ou prevaleceu no julgamento, não necessariamente em combate.
theological_decisions:
- issue: Sentido forense ou marcial de victus/vicerit
  choice: vencido no julgamento / prevalecido
  alternative: condenado / vencedor
  rationale: A redação preserva os verbos correlatos de derrota e vitória, enquanto 'no julgamento' orienta o leitor para o quadro forense sem transformar a metáfora em uma formulação dogmática mais explícita.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe futura ('tiver sido', 'tiver prevalecido') acompanha a perspectiva temporal do latim sem soar arcaica.
