source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: O tu quid fecisti, Adam? si enim tu peccasti, non est factum solius tuus casus sed etnostrum qui ex te advenimus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/118.yaml
  text: O Adam[a], what have you done? For if you sinned, your fall was not yours alone, but also ours, we who have come from you.
translation:
  language: pt
  text: Ó Adão, o que você fez? Pois, se[a] foi você quem pecou, sua queda não foi somente sua, mas também nossa, nós que viemos de você.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “embora tenha sido você quem pecou”.'
    reason: O latim si pode ser entendido aqui como condicional (“se”) ou, pelo contexto argumentativo, como concessivo (“embora”).
lexical_decisions:
- source_word: O tu quid fecisti, Adam?
  choice: Ó Adão, o que você fez?
  rationale: Mantém a exclamação e a interpelação direta do latim em português atual e natural.
- source_word: tu peccasti
  choice: foi você quem pecou
  rationale: A construção clivada reproduz a ênfase do pronome latino tu, sem acrescentar dúvida quanto à identidade do agente.
- source_word: casus
  choice: queda
  rationale: No contexto do pecado de Adão, “queda” expressa o revés moral e suas consequências, além de conservar a linguagem tradicionalmente reconhecível.
- source_word: qui ex te advenimus
  choice: nós que viemos de você
  rationale: Traduz de modo direto a origem ou descendência expressa por ex te, preservando a primeira pessoa do plural.
theological_decisions:
- issue: Valor de si em “si enim tu peccasti”
  choice: se foi você quem pecou
  alternative: embora tenha sido você quem pecou
  rationale: O latim permite a leitura formalmente condicional, enquanto o contexto pode favorecer valor concessivo. O texto principal conserva “se” e a nota registra a alternativa, sem decidir silenciosamente a tensão.
- issue: Alcance coletivo de “casus”
  choice: sua queda não foi somente sua, mas também nossa
  alternative: sua ruína não atingiu somente você, mas também a nós
  rationale: A formulação escolhida mantém a afirmação do texto de que a queda pertence tanto a Adão quanto a seus descendentes, sem explicar a natureza dessa participação segundo uma doutrina específica.
translation_notes:
  register: Português moderno, claro e digno, com “você” para ampla legibilidade brasileira. A repetição “sua... sua... nossa” preserva o contraste retórico do original.
