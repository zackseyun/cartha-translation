  text: self-indulgence has been ended, unbelief has been cut off, but righteousness has grown and truth has arisen.
translation:
  language: pt
  text: a falta de domínio próprio chegou ao fim, a incredulidade foi eliminada, mas a justiça cresceu e a verdade surgiu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intemperantia
  choice: falta de domínio próprio
  rationale: Expressa a ausência de autocontrole ou moderação de modo natural e abrangente, sem restringir o termo à indulgência em prazeres.
- source_word: soluta est
  choice: chegou ao fim
  rationale: No contexto escatológico, comunica que essa condição deixou de existir; evita o sentido literal inadequado de 'foi solta'.
- source_word: abscisa est
  choice: foi eliminada
  rationale: Preserva a imagem de remoção decisiva de algo 'cortado', em português claro e corrente.
- source_word: iustitia
  choice: justiça
  rationale: Equivalente tradicional e semanticamente amplo, capaz de abranger retidão e justiça.
- source_word: orta est
  choice: surgiu
  rationale: Reproduz naturalmente a ideia de aparecer, despontar ou levantar-se.
theological_decisions:
- issue: Relação adversativa entre a remoção do mal e o crescimento da justiça
  choice: mas
  alternative: porém / e
  rationale: Traduz autem como contraste leve entre o fim da falta de domínio próprio e da incredulidade e o florescimento da justiça e da verdade, sem acrescentar interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. A formulação mantém os quatro verbos no passado e a progressão entre o desaparecimento dos vícios e o surgimento das virtudes.
