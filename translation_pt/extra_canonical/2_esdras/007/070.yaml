source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: et quando Altissimus faciens faciebat saeculum, Adam et omnes qui cum eo uenerunt, primum praeparauit iudicium et quae sunt iudicii.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/070.yaml
  text: And he answered me and said[a], “When the Most High was making the age, he first prepared judgment and the things of judgment for Adam and all who came with him.”
translation:
  language: pt
  text: 'Ele me respondeu: “Quando o Altíssimo criava o mundo, primeiro preparou o juízo e tudo o que diz respeito ao juízo para Adão e todos os que vieram com ele[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradição textual: “dele”.'
    reason: Registra a variante preservada em outra tradição sem substituir a leitura clara do texto-base latino, cum eo, «com ele».
lexical_decisions:
- source_word: saeculum
  choice: mundo
  rationale: Neste contexto de criação, o latim se refere à ordem criada ou ao mundo, não apenas a um período cronológico; «mundo» é natural e claro em português.
- source_word: iudicium
  choice: juízo
  rationale: Preserva o sentido judicial e escatológico do termo latino sem especificar indevidamente «condenação» ou «sentença».
- source_word: quae sunt iudicii
  choice: tudo o que diz respeito ao juízo
  rationale: Expressa de modo natural a construção ampla do latim, que abrange as realidades ou elementos próprios do juízo.
- source_word: cum eo
  choice: com ele
  rationale: Traduz diretamente a preposição latina cum e evita substituir o texto-base pela ideia interpretativa de descendência a partir de Adão.
theological_decisions:
- issue: Relação de Adão e dos demais com o juízo preparado
  choice: «para Adão e todos os que vieram com ele» modifica «preparou»
  alternative: Ligá-los à criação do mundo ou traduzir «os que vieram dele»
  rationale: A ordem e a sintaxe latinas apoiam que o juízo foi preparado para esse grupo; «cum eo» significa literalmente «com ele», embora outra tradição textual possa sugerir origem ou descendência.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição enfática faciens faciebat foi vertida pelo aspecto durativo «criava», evitando uma reprodução artificial da construção latina.
