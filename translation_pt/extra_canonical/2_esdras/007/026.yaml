base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/026.yaml
  text: For behold[a], the time will come, and it will be when the signs that I foretold to you will come, and the bride will appear, and the city that is appearing[b], and what is now withdrawn from the earth will be shown.
translation:
  language: pt
  text: 26 Pois eis[a] que virá o tempo, e será quando vierem os sinais que te predisse; aparecerá a noiva, e aparecerá a cidade que está aparecendo[b], e será mostrado aquilo que agora é retirado da terra.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: As imagens paralelas da noiva que aparece e da cidade condensam, provavelmente, a restauração de Sião/Jerusalém em simbolismo apocalíptico. O latim é conciso e não explica a relação entre a noiva e a cidade.
    reason: compositional_layer
  - marker: b
    text: 'Outra tradução tradicional: “a cidade agora escondida aparecerá”. Essa forma reflete uma reconstrução do texto subjacente, não a redação explícita do latim aqui traduzido.'
    reason: previous_rendering
lexical_decisions:
- source_word: ecce enim
  choice: Pois eis
  rationale: Preserva tanto a ligação explicativa de enim quanto a fórmula enfática ecce, em português digno e compreensível.
- source_word: apparescens civitas
  choice: a cidade que está aparecendo
  rationale: Reproduz o particípio presente latino sem substituí-lo pela reconstrução conjectural de uma cidade atualmente escondida.
- source_word: subducitur terra
  choice: é retirado da terra
  rationale: Mantém o sentido passivo de subducitur e entende terra como ablativo de separação, sem especificar o referente além do que o texto permite.
theological_decisions:
- issue: Relação entre a noiva e a cidade
  choice: Mantê-las como imagens paralelas, sem identificá-las explicitamente
  alternative: Explicar que a noiva é a própria cidade restaurada
  rationale: O latim apresenta sponsa e civitas lado a lado, mas não esclarece sua relação; a tradução preserva essa tensão imagética.
- issue: Leitura de apparescens civitas
  choice: Traduzir o latim transmitido como “a cidade que está aparecendo”
  alternative: “a cidade agora escondida aparecerá”
  rationale: A alternativa depende de uma reconstrução do texto subjacente e não corresponde diretamente ao latim fornecido.
- issue: Referente de quae em quae nunc subducitur terra
  choice: Verter de modo indefinido como “aquilo que”
  alternative: 'Relacionar quae diretamente à cidade: “a cidade que agora está retirada da terra será mostrada”'
  rationale: Embora a concordância latina possa apontar para civitas, a sequência é textualmente difícil; a formulação indefinida acompanha a camada de consulta auditada e evita resolver silenciosamente uma possível corrupção ou compressão do texto.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A sintaxe foi levemente regularizada com ponto e vírgula e “assim como”, sem apagar a sequência incomum e tensa do latim.
