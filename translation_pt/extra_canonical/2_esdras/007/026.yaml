  terminology: “Noiva”, “cidade”, “sinais” e “mostrado” são escolhas adequadas. “A cidade que está aparecendo” preserva, com clareza suficiente, o particípio presente latino; a nota b explica corretamente a alternativa baseada em reconstrução subjacente.
