  yaml_path: translation/extra_canonical/2_esdras/007/121.yaml
  text: And if dwellings of health and safety have been laid up, but we have conducted ourselves wickedly?
translation:
  language: pt
  text: E, visto que foram reservadas moradas de saúde e segurança, mas nós nos comportamos mal?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reposita sunt
  choice: foram reservadas
  rationale: Expressa a ideia de que essas moradas foram guardadas ou destinadas para o futuro, de modo natural em português.
- source_word: habitacula
  choice: moradas
  rationale: Mantém o sentido concreto de lugares de habitação, com registro digno e corrente.
- source_word: sanitatis et securitatis
  choice: de saúde e segurança
  rationale: Traduz diretamente os substantivos latinos sem acrescentar uma interpretação teológica.
- source_word: male conversati sumus
  choice: nós nos comportamos mal
  rationale: Reproduz a ideia de conduta moralmente má; é mais natural em português atual do que uma formulação como “vivemos perversamente”.
theological_decisions:
- issue: Natureza das moradas reservadas
  choice: moradas de saúde e segurança
  alternative: moradas de salvação e proteção
  rationale: A tradução conserva os sentidos lexicais de sanitas e securitas e não identifica explicitamente as moradas com uma doutrina específica da salvação.
- issue: Força moral de male
  choice: nos comportamos mal
  alternative: procedemos perversamente
  rationale: A escolha preserva a avaliação moral negativa sem intensificá-la além do que o advérbio latino exige.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A estrutura interrogativa e o contraste marcado por “mas” foram preservados.
