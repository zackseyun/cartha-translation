  text: et quare non accepisti in corde tuo quod futurum, sed quod in praesenti?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/016.yaml
  text: And why have you not taken to heart what is to come, rather than what is present?”
translation:
  language: pt
  text: E por que você não levou a sério o que está por vir, em vez do que está presente?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: accepisti in corde tuo
  choice: levou a sério
  rationale: A expressão latina significa literalmente acolher ou receber no coração; em português atual, “levar a sério” comunica naturalmente a ideia de considerar profundamente, sem exigir uma metáfora pouco idiomática.
- source_word: quod futurum
  choice: o que está por vir
  rationale: Preserva a orientação futura e a formulação aberta do latim, sem especificar acontecimentos não mencionados.
- source_word: quod in praesenti
  choice: o que está presente
  rationale: Mantém o contraste temporal direto com “o que está por vir” e evita restringir o sentido a uma situação específica.
theological_decisions:
- issue: Contraste entre o futuro e o presente
  choice: Preservar o contraste sem explicar a natureza do que virá
  alternative: Interpretar explicitamente como a era futura em contraste com a vida atual
  rationale: O texto latino não identifica aqui o referente; explicitá-lo introduziria uma interpretação teológica além da evidência desta frase.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A frase mantém a forma interrogativa e o contraste conciso do original.
