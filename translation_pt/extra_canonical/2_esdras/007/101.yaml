  yaml_path: translation/extra_canonical/2_esdras/007/101.yaml
  text: And he said[a], “For seven days they will have freedom, so that they may see the things that were foretold.”
translation:
  language: pt
  text: 'E ele disse: “Durante sete dias elas terão liberdade, para que vejam as coisas que foram preditas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: libertas
  choice: liberdade
  rationale: Equivalente direto que preserva a formulação do latim sem explicar indevidamente a natureza dessa liberdade.
- source_word: praedicti
  choice: foram preditas
  rationale: Mantém a voz passiva e o sentido de algo anunciado de antemão, sem transformar a expressão em uma referência específica ao que foi dito a Esdras.
theological_decisions:
- issue: Referente feminino plural de “earum”
  choice: elas
  alternative: as almas
  rationale: O pronome feminino plural remete ao contexto anterior; conservar o pronome evita inserir no versículo um substantivo ausente do trecho latino fornecido.
- issue: Valor temporal de “septem diebus”
  choice: Durante sete dias
  alternative: Por sete dias
  rationale: Expressa com naturalidade a duração indicada pelo ablativo latino, sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural e correspondência próxima ao latim. O começo fragmentário “dixisti?” pertence ao fim da fala anterior no recorte editorial; a tradução deste versículo começa em “Et dixit”. Não se acrescentou “a mim” nem material posterior ausente da fonte fornecida.
