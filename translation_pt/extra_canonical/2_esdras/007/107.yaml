  text: e Josué, depois dele, por Israel, nos dias de Acar[a], e Samuel, nos dias de Saul,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Josué” reflete o latim Iesus, forma usada tanto para Josué como para Jesus. Neste contexto do Antigo Testamento, trata-se de Josué, filho de Num.
    reason: lexical_alternative
lexical_decisions:
- source_word: Iesus
  choice: Josué
  rationale: No contexto veterotestamentário, a forma latina Iesus designa Josué, filho de Num; “Josué” evita a ambiguidade indevida que “Jesus” criaria em português.
- source_word: Achar
  choice: Acar
  rationale: Translitera diretamente a forma latina Achar segundo a ortografia portuguesa, sem harmonizá-la silenciosamente com a forma mais conhecida “Acã”.
