  text: 'O sexto caminho: veem como algumas delas passarão para o tormento[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “de entre elas”; a expressão é partitiva, não enfática.
    reason: Esclarece o valor de de eis e evita a leitura “elas mesmas”, sem transformar a nota em alternativa interpretativa.
lexical_decisions:
- source_word: Sexta uia
  choice: O sexto caminho
  rationale: Mantém a metáfora enumerada do latim em linguagem natural e digna.
- source_word: uidentes quemadmodum
  choice: elas veem como
  rationale: Reproduz o particípio de percepção e introduz naturalmente, em português, aquilo que é visto.
- source_word: de eis
  choice: algumas dentre elas
  rationale: Expressa o sentido partitivo de de eis, isto é, algumas do grupo, sem o confundir com um pronome enfático como 'elas mesmas'.
- source_word: pertransient in cruciamentum
  choice: passarão para o tormento
  rationale: Conserva o movimento indicado por pertransient e o singular cruciamentum.
theological_decisions:
- issue: Identidade das pessoas que passam para o tormento
  choice: algumas dentre elas
  alternative: elas mesmas
  rationale: A construção latina de eis é partitiva; não sustenta a leitura enfática 'elas mesmas'. O feminino retoma as almas no contexto imediato.
translation_notes:
  register: Português moderno, claro e solene. O feminino pronominal retoma as almas mencionadas no contexto; 'tormento' permanece no singular conforme o latim.
