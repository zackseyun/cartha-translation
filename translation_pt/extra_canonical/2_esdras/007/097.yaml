  text: et spatiosum, [quod incipient] recipere fruniscentes et immortales. Sextus ordo, quando eis ostendetur, quomodo incipiet uultus eorum fulgere sicut sol, et quomodo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/097.yaml
  text: 'The sixth order: when it will be shown to them how their face will begin to shine like the sun, and how they will begin to be made like the light of the stars, being from then on incorruptible.'
translation:
  language: pt
  text: 'A sexta ordem: quando lhes será mostrado como o rosto deles começará a brilhar como o sol e como eles começarão a tornar-se semelhantes às luzes das estrelas, sendo daí em diante incorruptíveis.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sextus ordo
  choice: A sexta ordem
  rationale: Mantém a designação formal da sexta etapa na sequência descrita pelo texto, sem substituir a imagem estrutural de ordo por uma interpretação mais específica.
- source_word: ostendetur
  choice: será mostrado
  rationale: Reproduz o valor futuro e a voz passiva do latim.
- source_word: uultus eorum
  choice: o rosto deles
  rationale: Preserva o singular coletivo do latim e evita possível ambiguidade de referência do possessivo isolado “seu”.
- source_word: fulgere sicut sol
  choice: brilhar como o sol
  rationale: Equivalência direta, natural e digna para a comparação latina.
- source_word: stellarum luminibus adsimilari
  choice: tornar-se semelhantes à luz das estrelas
  rationale: Expressa com clareza a transformação comparativa indicada pelo latim, em consonância com a continuação textual atestada na tradição crítica e registrada na camada inglesa auditada.
- source_word: incorrupti amodo
  choice: daí em diante incorruptíveis
  rationale: Conserva tanto a condição de incorruptibilidade quanto o sentido temporal prospectivo de amodo.
theological_decisions:
- issue: Natureza da transformação dos justos
  choice: Mantida como descrição futura de luminosidade e incorruptibilidade
  alternative: Explicitar uma transformação corporal, glorificação ou divinização
  rationale: O texto descreve o resultado por imagens, mas não define sua natureza metafísica; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do latim sem rigidez excessiva. Não foram necessárias notas de rodapé.
source_grounding:
  english_pob_role: consult_only
