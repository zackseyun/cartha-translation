lexical_decisions:
- source_word: Multum enim melius est illis quam nobis
  choice: Pois é muito melhor para eles do que para nós
  rationale: Reproduz a comparação e o valor explicativo de enim em português natural e digno.
- source_word: sperant iudicium
  choice: esperam o juízo
  rationale: Mantém a amplitude de sperant, que neste contexto pode indicar esperar ou aguardar, sem acrescentar uma interpretação teológica.
- source_word: tormenta
  choice: os tormentos
  rationale: Conserva o sentido forte e concreto do termo latino, em registro compreensível.
- source_word: salutem post mortem promissam
  choice: a salvação prometida depois da morte
  rationale: Preserva tanto a ideia de promessa quanto a localização temporal, sem explicitar quem fez a promessa.
theological_decisions:
- issue: Relação entre juízo, tormentos e salvação após a morte
  choice: Manter os três elementos coordenados sem harmonização explicativa
  alternative: Explicar os tormentos e a salvação como resultados específicos do juízo
  rationale: O texto os menciona sem definir detalhadamente sua relação; a tradução preserva essa tensão e evita importar um esquema doutrinário.
