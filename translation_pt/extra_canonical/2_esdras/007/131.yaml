  text: quoniam non esset tristitia in perditione eorum, sicut et futurum est gaudium super eos quibus persuasa est salus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/131.yaml
  text: For there should be no grief over their destruction[a], just as there will be joy over those to whom salvation has been promised.”
translation:
  language: pt
  text: Pois não deveria haver tristeza pela perdição deles[a], assim como haverá alegria por aqueles a quem a salvação foi assegurada.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «não haveria tristeza pela perdição deles».'
    reason: O imperfeito do subjuntivo latino «esset» pode ser entendido com nuance potencial («haveria») ou normativa («deveria haver»).
lexical_decisions:
- source_word: quoniam
  choice: Pois
  rationale: Introduz a razão ou explicação da afirmação anterior; evita o sentido conclusivo de «portanto».
- source_word: tristitia in perditione eorum
  choice: tristeza pela perdição deles
  rationale: Em português, «tristeza pela» expressa naturalmente o pesar diante da perdição ou ruína mencionada pelo latim.
- source_word: gaudium super eos
  choice: alegria por aqueles
  rationale: Reproduz de modo idiomático a alegria a respeito dessas pessoas, sem sugerir posição física sobre elas.
- source_word: quibus persuasa est salus
  choice: aqueles a quem a salvação foi assegurada
  rationale: O passivo de «persuadere», construído com dativo, comunica aqui que a salvação lhes foi tornada certa ou garantida. «Assegurada» preserva melhor essa força do que a formulação pouco natural «persuadida» e não introduz explicitamente a ideia distinta de uma promessa.
theological_decisions:
- issue: Modalidade de «non esset tristitia»
  choice: não deveria haver tristeza
  alternative: não haveria tristeza
  rationale: O imperfeito do subjuntivo «esset» admite nuance normativa ou potencial. A tradução principal mantém a leitura normativa sem converter o verbo em futuro indicativo; a alternativa é registrada em nota.
- issue: Força de «persuasa est salus»
  choice: a salvação foi assegurada
  alternative: a salvação foi tornada certa
  rationale: A expressão indica que a salvação foi confirmada ou feita certa para seus destinatários. Evita-se especificar um mecanismo teológico ou transformar a frase necessariamente em uma promessa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural para leitores brasileiros e compreensão internacional. Conserva o contraste entre tristeza e alegria e mantém a modalidade do subjuntivo latino visível por meio da nota.
