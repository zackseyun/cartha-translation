  yaml_path: translation/extra_canonical/2_esdras/007/051.yaml
  text: One age, but two. For you have said that the righteous are not many, but few,
translation:
  language: pt
  text: Uma era, mas duas. Pois tu disseste que os justos não são muitos, mas poucos,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: era
  rationale: No contexto escatológico, «era» comunica melhor um período ou ordem do mundo do que «século», sem eliminar a concisão do latim.
- source_word: iustos
  choice: os justos
  rationale: Equivalente religioso e moral direto de «iustos», natural no português bíblico contemporâneo.
- source_word: Tu enim, quia dixisti
  choice: Pois tu disseste
  rationale: Reproduz a função explicativa de «enim» e verte naturalmente a construção latina, cujo «quia» introduz o conteúdo declarado.
theological_decisions:
- issue: Sentido da oposição «unum saeculum, sed duo»
  choice: Uma era, mas duas.
  alternative: Um mundo, mas dois.
  rationale: Mantém a formulação abrupta e a tensão do texto latino, sem acrescentar substantivos ou explicações que determinem em que sentido a era é uma e, ao mesmo tempo, duas.
translation_notes:
  register: Português moderno, digno e conciso, com uso de «tu» por corresponder ao tratamento explícito do latim. A pontuação final com vírgula preserva o caráter incompleto da frase e sua continuidade no versículo seguinte.
