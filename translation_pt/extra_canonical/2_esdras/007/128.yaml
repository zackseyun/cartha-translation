translation:
  language: pt
  text: se for vencido, sofrerá o que você disse; mas, se vencer, receberá o que eu digo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: victus fuerit
  choice: for vencido
  rationale: Reproduz a construção passiva e condicional do latim sem acrescentar quem o vence.
- source_word: patiatur
  choice: sofrerá
  rationale: No contexto condicional, expressa a consequência futura indicada pelo latim; o verbo mantém o sentido amplo de padecer ou sofrer.
- source_word: vicerit
  choice: vencer
  rationale: Mantém o contraste direto com “for vencido” e não explicita objeto ausente no original.
- source_word: recipiet
  choice: receberá
  rationale: Equivalente direto e natural, preservando sem especificação aquilo que será recebido.
theological_decisions:
- issue: Referentes de “o que você disse” e “o que eu digo”
  choice: Mantê-los sem explicação adicional
  alternative: Explicitar o conteúdo referido com base no contexto mais amplo
  rationale: O versículo latino usa referências anafóricas breves; explicitá-las resolveria uma abertura que o texto preserva.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade brasileira ampla. O paralelismo condicional e o contraste entre derrota e vitória foram preservados.
