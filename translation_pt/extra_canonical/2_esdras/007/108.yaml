  text: et David pro confractione, et Salomon pro eis qui in sanctificationem,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/108.yaml
  text: and David for the destruction[a], and Solomon for those in sanctification,
translation:
  language: pt
  text: e Davi pela destruição, e Salomão pelos que estavam na consagração[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dedicação»; provavelmente se refere à dedicação do templo.
    reason: Esclarece o provável referente histórico de sanctificationem sem transformar essa interpretação contextual na única leitura possível do texto principal.
lexical_decisions:
- source_word: confractione
  choice: destruição
  rationale: Preserva o sentido forte de quebrantamento, ruína ou destruição do substantivo latino, sem restringi-lo indevidamente a uma praga.
- source_word: sanctificationem
  choice: consagração
  rationale: Traduz diretamente a ideia de tornar santo ou dedicar, mantendo aberta a possibilidade contextual de referência à dedicação do templo.
- source_word: pro eis qui in sanctificationem
  choice: pelos que estavam na consagração
  rationale: O latim é sintaticamente elíptico; a inclusão de «estavam» produz português compreensível sem acrescentar a ideia não expressa de que essas pessoas viriam ao santuário.
theological_decisions:
- issue: Natureza da «consagração» associada a Salomão
  choice: Manter «consagração» no texto
  alternative: Traduzir especificamente como «dedicação do templo»
  rationale: Embora o contexto possa aludir à dedicação do templo e à oração intercessória de Salomão, o latim usa um termo mais amplo. A tradução preserva essa amplitude, e a nota informa a leitura contextual provável.
translation_notes:
  register: Português moderno, claro e digno. A coordenação fragmentária e a vírgula final são preservadas porque o versículo integra uma enumeração mais ampla.
