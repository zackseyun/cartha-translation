revisions:
- from: poderão eles, no julgamento justo[a], desculpar os ímpios ou suplicar por eles ao Altíssimo — os pais pelos filhos, os filhos pelos pais, os irmãos pelos irmãos e os parentes pelos que lhes são próximos?
  to: Poderão eles, no justo juízo, desculpar os ímpios ou suplicar ao Altíssimo por eles, como pais pelos filhos, filhos pelos pais, irmãos pelos irmãos e parentes pelos vizinhos?
