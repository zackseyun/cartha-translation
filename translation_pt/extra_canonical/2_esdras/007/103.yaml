  yaml_path: translation/extra_canonical/2_esdras/007/103.yaml
  text: will they be able to excuse the ungodly at the righteous judgment[a], or to entreat the Most High for them, as fathers for children, or children for parents, brothers for brothers, relatives for neighbors,
translation:
  language: pt
  text: Poderão eles, no justo juízo, desculpar os ímpios ou suplicar ao Altíssimo por eles, como pais pelos filhos, filhos pelos pais, irmãos pelos irmãos e parentes pelos vizinhos?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: impios
  choice: os ímpios
  rationale: Mantém a caracterização moral e religiosa do latim sem a reduzir a mera injustiça social.
- source_word: excusare
  choice: desculpar
  rationale: Expressa a tentativa de apresentar uma defesa ou obter isenção de culpa no contexto do julgamento.
- source_word: deprecari pro eis
  choice: suplicar por eles
  rationale: Reproduz a ideia de intercessão em favor de alguém, com linguagem natural e solene.
- source_word: Altissimum
  choice: o Altíssimo
  rationale: Título divino tradicional e diretamente correspondente ao latim.
- source_word: adfines
  choice: os parentes
  rationale: No contexto da enumeração de vínculos humanos, o termo abrange familiares e pessoas ligadas por parentesco; “parentes” é claro e não restringe indevidamente a afinidade a parentes por casamento.
- source_word: proximis
  choice: pelos que lhes são próximos
  rationale: Preserva a amplitude relacional de proximis, que pode indicar pessoas próximas ou semelhantes a ‘próximos’, sem limitar o sentido a vizinhos geográficos.
theological_decisions:
- issue: Possibilidade de intercessão no julgamento
  choice: Formulação interrogativa, sem declarar antecipadamente se tal intercessão será eficaz
  alternative: Traduzir como uma afirmação de impossibilidade
  rationale: O trecho fornecido apresenta a pergunta sobre desculpar ou suplicar pelos ímpios; a tradução conserva a tensão retórica sem inserir uma resposta doutrinária.
- issue: Sentido de iudicii iusti
  choice: “no julgamento justo”
  alternative: “do justo juízo”
  rationale: A leitura locativa se ajusta ao contexto escatológico e à versão de consulta, enquanto a nota registra uma formulação mais literal possível.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática ajustada para tornar explícito que cada grupo intercede por outro. O travessão introduz naturalmente a enumeração preservada no latim.
