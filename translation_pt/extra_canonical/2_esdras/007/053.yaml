lexical_decisions:
- source_word: ad numerum eorum
  choice: conforme o número deles
  rationale: Preserva a referência ao número ou quantidade dos objetos sem especificar além do que o latim permite.
- source_word: compones eos tibi
  choice: você os organizará para si
  rationale: Traduz o futuro de componere como organizar ou dispor, mantendo o dativo de interesse tibi.
- source_word: plumbum autem et fictile abundat
  choice: mas o chumbo e o barro existem em abundância
  rationale: Expressa o contraste de autem e o sentido de abundat. Fictile pode designar material de barro ou objeto de barro; aqui, em paralelo com chumbo, a leitura material é a mais natural.
