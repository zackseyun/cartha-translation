  source_fidelity: O futuro latino «incipient» pede «começarem», não o presente «começam». «A uaso corruptibili» é mais fielmente expresso por «do vaso corruptível» do que por «longe do». Além disso, «in eo tempore» significa «naquele tempo»; o pronome «nele» introduz uma ligação sintática ao vaso que o latim citado não explicita. A continuação sobre o perigo e a guarda da lei é mantida de acordo com o trilho de auditoria inglês, que preserva a extensão do versículo.
  naturalness: A revisão conserva um registro solene, mas torna a construção temporal e a referência pronominal mais naturais em português. «Com labor» é levemente mais formal que «com esforço» e preserva melhor «cum labore».
  terminology: «Altíssimo», «vaso corruptível» e «Legislador» são adequados e devem permanecer. «Almas» é mantido em nota como referente contextual, sem o inserir como substantivo no texto.
