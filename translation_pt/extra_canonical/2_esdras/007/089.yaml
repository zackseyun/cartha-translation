    issue: Tempo verbal de «incipient»
    rationale: O presente «começam» não reproduz o valor prospectivo do futuro latino. «Quando começarem» preserva a formulação temporal sem resolver além do necessário.
  - severity: medium
    issue: «Longe do vaso» e «habitaram nele»
    rationale: «A uaso» indica afastamento/origem («do vaso»), não exige «longe». «In eo tempore» refere-se ao tempo, não afirma gramaticalmente que elas habitaram no vaso; a inserção de «nele» resolve indevidamente a ambiguidade.
  - severity: low
    issue: Objeto de «suportaram»
    rationale: O texto auditado inglês explicita «danger» no singular. «O perigo» é mais próximo desse singular do que «perigos».
