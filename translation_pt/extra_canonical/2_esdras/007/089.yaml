  text: runt Altissimi ordo est hic, quando incipient seruari a uaso corruptibili. In eo tempore commoratae seruierunt cum labore Altissimo, et omni hora sustinuerunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/089.yaml
  text: This is the order of the Most High, when they began to be kept from the corruptible vessel. In that time they dwelt in it, they served the Most High with labor, and every hour they endured danger, so that they might perfectly keep the law of the Lawgiver.
translation:
  language: pt
  text: Esta é a ordem do Altíssimo, quando elas[a] começarem a ser preservadas do vaso corruptível. Naquele tempo, permaneceram, serviram ao Altíssimo com labor e, a cada hora, suportaram o perigo, a fim de poderem guardar perfeitamente a lei do Legislador.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Elas” se refere, pelo contexto, às almas. “Vaso corruptível” é uma imagem do corpo mortal. A expressão latina «in eo tempore commoratae» pode significar simplesmente que permaneceram naquele tempo; ela não liga explicitamente essa permanência ao vaso.
    reason: Esclarece o referente feminino implícito e a metáfora, sem introduzir no texto uma relação sintática que o latim não explicita.
lexical_decisions:
- source_word: ordo
  choice: ordem
  rationale: 'Preserva o termo latino e sua possível abrangência: ordem, disposição ou sequência estabelecida.'
- source_word: seruari a uaso corruptibili
  choice: ser guardadas longe do vaso corruptível
  rationale: Mantém a construção passiva e a imagem concreta do texto transmitido, sem substituir explicitamente o vaso pelo corpo.
- source_word: commoratae
  choice: habitaram
  rationale: Expressa permanência ou morada; o feminino plural pressupõe as almas como referente contextual.
- source_word: cum labore
  choice: com esforço
  rationale: Português corrente e digno para serviço prestado sob fadiga ou trabalho penoso.
- source_word: sustinuerunt
  choice: suportaram
  rationale: Conserva a ideia de perseverar sob provação sem especificar além do necessário.
- source_word: Legislator
  choice: Legislador
  rationale: Mantém o título pessoal e sua relação verbal com a lei.
theological_decisions:
- issue: Identidade do “vaso corruptível”
  choice: Conservar a metáfora no texto e explicar em nota sua provável referência ao corpo mortal.
  alternative: Traduzir diretamente como “corpo mortal”.
  rationale: A metáfora pertence à formulação transmitida e não deve ser silenciosamente resolvida, embora o contexto escatológico indique o corpo.
- issue: Referente do pronome feminino plural
  choice: Usar “elas” e esclarecer que o referente contextual são as almas.
  alternative: Inserir “as almas” diretamente no texto.
  rationale: O trecho latino fornecido não traz o substantivo expresso; a nota torna a referência compreensível sem acrescentá-la ao corpo do versículo.
- issue: Relação entre habitação e vaso
  choice: Traduzir “habitaram nele”, seguindo a leitura contextual preservada pela camada inglesa auditada.
  alternative: Traduzir apenas “permaneceram naquele tempo”, conforme uma leitura estrita de “in eo tempore commoratae”.
  rationale: A formulação recebida relaciona a morada ao vaso corruptível, mas o latim citado permite tensão sintática; a nota registra essa ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Preservam-se “Altíssimo”, “vaso corruptível” e “Legislador” por seu valor literário e teológico. A tradução segue equivalência ótima e evita explicitar no texto principal o que permanece implícito ou ambíguo no latim.
