  text: Therefore, Ezra, empty things are for the empty, and full things for the full.
translation:
  language: pt
  text: Por isso, Esdras, as coisas vazias são para os vazios, e as coisas plenas, para os plenos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  choice: Por isso
  rationale: Expressa naturalmente em português a relação conclusiva ou causal do latim.
- source_word: vacua vacuis
  choice: as coisas vazias são para os vazios
  rationale: Preserva o paralelismo e a formulação enigmática do latim, sem especificar indevidamente o referente neutro de vacua nem o referente plural de vacuis.
- source_word: plena plenis
  choice: as coisas plenas, para os plenos
  rationale: Mantém a antítese simétrica entre vazio e plenitude; a elipse do verbo na segunda oração é natural em português e corresponde à concisão do original.
theological_decisions:
- issue: Referentes de vacua/vacuis e plena/plenis
  choice: Manter as expressões genéricas «coisas vazias», «vazios», «coisas plenas» e «plenos»
  alternative: Explicitar como pessoas, realidades, bens ou destinos
  rationale: O latim é deliberadamente conciso e não identifica os referentes; explicitá-los resolveria uma ambiguidade genuína e poderia introduzir interpretação teológica não exigida pelo texto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com estrutura proverbial e paralelismo preservados. A vírgula na segunda oração marca a elipse de «são» sem alterar o sentido.
