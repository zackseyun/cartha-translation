  source_fidelity: 'O texto traduz fielmente a sequência latina: «cor malum» como «coração mau»; «increuit in nos» como «cresceu em nós»; e os efeitos sucessivos de alienação, corrupção, caminhos de morte, veredas de perdição e afastamento da vida. Embora o latim conservado leia «ab his» (“destas coisas”), a opção principal «de Deus» é textualmente defensável à luz do conjunto das versões antigas, e a nota informa com precisão a divergência do testemunho latino.'
