  terminology: «Coração mau», «corrupção», «caminhos da morte», «veredas da perdição» e «vida» preservam as imagens e o registro moral-antropológico do texto sem impor interpretação denominacional. A alternância entre «caminhos» e «veredas» conserva de modo útil a distinção estilística entre itinera e semitas.
