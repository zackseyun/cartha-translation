  text: tinebit futuram saeculi iocunditatem facere, multis autem tormenta. Increuit enim in nos cor malum, quod nos abalienauit ab his, et deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita; et hoc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/048.yaml
  text: For an evil heart has grown in us[a], which has alienated us from these things and led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life; and this not for a few, but for almost all who have been created.”
translation:
  language: pt
  text: Pois um coração mau cresceu em nós, e ele nos afastou de Deus[a], levou-nos à corrupção e aos caminhos da morte, mostrou-nos as veredas da perdição e distanciou-nos da vida — e isso não aconteceu com poucos, mas com quase todos os que foram criados.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim diz “destas coisas”. Outras versões antigas trazem “dele”, isto é, “de Deus”.
    reason: Registra a importante divergência textual entre o latim preservado e as antigas versões derivadas de outros testemunhos.
lexical_decisions:
- source_word: cor malum
  choice: um coração mau
  rationale: Mantém a imagem antropológica do latim, em linguagem clara e corrente, sem substituí-la por uma interpretação como “inclinação má”.
- source_word: increuit in nos
  choice: cresceu em nós
  rationale: Reproduz diretamente o sentido de crescimento expresso por increuit e preserva a formulação enfática da fonte.
- source_word: itinera mortis
  choice: caminhos da morte
  rationale: Conserva a metáfora de percurso e o plural da fonte.
- source_word: semitas perditionis
  choice: veredas da perdição
  rationale: Distingue semitas de itinera e mantém o tom solene sem deixar de ser compreensível.
- source_word: longe fecit nos a uita
  choice: distanciou-nos da vida
  rationale: Expressa com naturalidade a ideia causativa de tornar alguém distante da vida.
theological_decisions:
- issue: Referente de ab his
  choice: de Deus
  alternative: destas coisas
  rationale: Embora o latim preservado tenha ab his, “destas coisas”, a evidência conjunta das antigas versões siríaca, etíope, árabe e armênia aponta para um Vorlage grego equivalente a “dele”, isto é, de Deus. A leitura latina provavelmente resulta da confusão entre formas gregas semelhantes. A variante é explicitada em nota, sem ocultar a leitura do testemunho latino principal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A coordenação foi levemente explicitada com “e ele” para evitar que a longa sequência de verbos se torne obscura. A oração final foi formulada como “isso não aconteceu” para dar sentido natural ao fragmento latino continuado, preservado integralmente pela tradição textual do versículo.
