source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et facti sunt introitus huius saeculi angusti et dolentes et laboriosi, paucae autem et malae et periculorum plenae et laborum magnorum fultae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/012.yaml
  text: And the entrances of this age became narrow and painful and laborious[a], few and evil, full of dangers and burdened with great hardships.
translation:
  language: pt
  text: E as entradas desta era se tornaram estreitas, dolorosas[a] e trabalhosas, poucas e más, cheias de perigos e sobrecarregadas de grandes dificuldades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “causadoras de dor”.
    reason: Esclarece o valor causativo provável de dolentes quando aplicado a entradas, em vez de sugerir que elas próprias sentem tristeza.
lexical_decisions:
- source_word: introitus huius saeculi
  choice: as entradas desta era
  rationale: Reproduz diretamente a imagem das vias de entrada e traduz saeculum como “era”, adequado ao contraste escatológico do contexto.
- source_word: angusti
  choice: estreitas
  rationale: Equivalente natural e formal do adjetivo latino, preservando a imagem de acesso restrito.
- source_word: dolentes
  choice: dolorosas
  rationale: No uso aplicado a entradas ou caminhos, indica aquilo que causa dor; “dolorosas” evita atribuir às entradas o sentimento de tristeza.
- source_word: laboriosi
  choice: difíceis
  rationale: Expressa o caráter penoso e trabalhoso das entradas em português corrente, sem repetir antecipadamente a linguagem dos grandes sofrimentos ao fim do verso.
- source_word: paucae autem et malae
  choice: poucas e ruins
  rationale: Mantém a coordenação simples e a avaliação negativa do latim; a conjunção adversativa não é explicitada porque soa pouco natural nesta sequência em português e não altera o contraste contextual.
- source_word: periculorum plenae
  choice: cheias de perigos
  rationale: Correspondência direta e idiomática.
- source_word: laborum magnorum fultae
  choice: sobrecarregadas de grandes sofrimentos
  rationale: Fultae literalmente sugere sustentadas ou apoiadas, mas, associada a labores, comunica aqui entradas marcadas ou carregadas de grandes padecimentos; “sobrecarregadas” preserva o peso da imagem.
theological_decisions:
- issue: Sentido escatológico de saeculum
  choice: era
  alternative: mundo
  rationale: “Era” preserva a dimensão temporal de saeculum e o provável contraste entre a era presente e a futura, sem reduzir o termo ao mundo criado.
- issue: Agência implícita em facti sunt
  choice: se tornaram
  alternative: foram feitas
  rationale: A forma latina admite leitura resultativa ou passiva. “Se tornaram” preserva a formulação sem introduzir explicitamente um agente divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a enumeração densa do latim e a imagem concreta das entradas, evitando vocabulário excessivamente arcaico.
