    issue: «difíceis» para laboriosi
    rationale: Embora possível, «difíceis» é genérico. «Trabalhosas» preserva o sentido de exigirem labor e também o paralelismo lexical com laborum.
  - severity: low
    issue: «grandes sofrimentos» para laborum magnorum
    rationale: «Sofrimentos» pode ser consequência dos labores, mas laborum designa mais diretamente trabalhos árduos ou grandes dificuldades. A revisão evita essa restrição sem perder a imagem de peso em fultae.
  - severity: low
    issue: «ruins» para malae
    rationale: «Más» transmite de maneira mais direta a qualificação negativa de malae e é natural no registro da passagem.
