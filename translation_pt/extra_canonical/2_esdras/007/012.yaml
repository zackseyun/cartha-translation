  source_fidelity: A redação acompanha de perto a sequência e as imagens do latim. Contudo, «difíceis» enfraquece laboriosi, que enfatiza algo trabalhoso/penoso, e «grandes sofrimentos» restringe laborum («trabalhos; dificuldades árduas») a padecimento.
  naturalness: A frase é clara, fluente e de registro apropriado. «Entradas» mantém a metáfora do original; a enumeração é naturalmente legível em português.
  terminology: «Era», «estreitas», «dolorosas», «más», «perigos» e «sobrecarregadas» são escolhas adequadas. «Más» é mais próximo de malae do que «ruins» neste contexto. «Trabalhosas» conserva melhor o campo lexical de laboriosi.
