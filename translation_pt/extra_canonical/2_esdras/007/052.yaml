lexical_decisions:
- source_word: impios
  choice: os ímpios
  rationale: Equivalente direto e tradicional, sem restringir o termo a um grupo religioso específico.
- source_word: multiplicari
  choice: se multiplicarem
  rationale: Preserva o infinitivo passivo latino em uma construção portuguesa natural que expressa aumento em número.
- source_word: audi haec
  choice: ouça isto
  rationale: Mantém a interpelação direta no singular e introduz a comparação que segue.
- source_word: lapides electos
  choice: pedras escolhidas
  rationale: Traduz formalmente electos como 'escolhidas'; 'preciosas' é possível pelo sentido contextual, mas explicita uma qualidade não lexicalmente obrigatória.
- source_word: paucos valde
  choice: pouquíssimas
  rationale: Expressa de modo natural a forte intensificação de valde aplicada a paucos.
theological_decisions:
- issue: Sentido moral de impios
  choice: ímpios
  alternative: maus
  rationale: ‘Ímpios’ preserva a dimensão moral e religiosa do termo latino sem definir uma doutrina específica sobre a identidade ou o destino dessas pessoas.
- issue: Caráter incompleto da comparação
  choice: Manter a oração aberta com vírgula
  alternative: Completar a pergunta com material preservado em outras versões
  rationale: O trecho latino fornecido termina após paucos valde; acrescentar chumbo e barro importaria conteúdo fora deste segmento, apesar de evidências textuais em outras testemunhas.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade ampla no Brasil. A construção “quanto ao fato de” torna natural a sintaxe latina sem resolver além do texto a tensão entre o grande número dos ímpios e as poucas pedras escolhidas.
