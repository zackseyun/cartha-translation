  text: 'But hear this about the multiplication of the ungodly: if you have very few choice stones,[a]'
translation:
  language: pt
  text: 'Mas, quanto ao fato de os ímpios se multiplicarem, ouça isto: se você tiver pouquíssimas pedras escolhidas,[a]'
