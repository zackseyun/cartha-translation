  source_fidelity: A tradução preserva o contrafactual de «Melius enim erat», a referência enfática a «ipsum pulverem» como «o próprio pó» e a relação causal-final pela qual o entendimento procede do pó. «Não viesse a existir» comunica apropriadamente a não-entrada do pó na existência, sem a imagem inadequada de nascimento biológico.
