source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: factus est de puluere, sicut et cetera creatura! Melius enim erat ipsum pulverem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/063.yaml
  text: For it would have been better if the dust itself had not come into being, so that understanding might not have come from it.
translation:
  language: pt
  text: Pois teria sido melhor que o próprio pó não viesse a existir, para que dele não viesse o entendimento.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pulverem
  choice: pó
  rationale: Equivalente direto e natural para o latim, preservando a imagem da matéria da qual o ser humano foi formado.
- source_word: Melius enim erat
  choice: Pois teria sido melhor
  rationale: Expressa em português corrente o juízo contrafactual do texto, mantendo a ligação explicativa de enim.
- source_word: non nasci / non ... factum esse (sentido refletido na tradição textual consultada)
  choice: não viesse a existir
  rationale: Evita sugerir nascimento biológico do pó e comunica com clareza a ideia de não chegar à existência.
- source_word: intellectus
  choice: entendimento
  rationale: Mantém o sentido amplo de faculdade de compreender, sem restringi-lo a conhecimento, sabedoria ou uma capacidade teologicamente definida.
theological_decisions:
- issue: Relação entre a existência humana, o pó e o entendimento
  choice: Manter a formulação paradoxal sem explicá-la
  alternative: Explicitar que o pó representa o ser humano ou interpretar o entendimento como consciência moral
  rationale: O enunciado associa o entendimento ao pó de modo retórico e tenso; uma explicação no corpo do texto resolveria uma ambiguidade que deve permanecer.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A repetição de «viesse» preserva o paralelismo causal e contrafactual. O trecho latino fornecido está truncado após «ipsum pulverem»; a continuação foi vertida segundo a evidência refletida na camada inglesa auditada e na tradição textual indicada.
