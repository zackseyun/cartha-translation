  yaml_path: translation/extra_canonical/2_esdras/007/106.yaml
  text: And I answered and said[a], “How then do we now find that first Abraham prayed for the Sodomites, and Moses for the fathers who sinned in the wilderness,
translation:
  language: pt
  text: 'Então respondi: “Como, pois, vemos agora que Abraão foi o primeiro a interceder pelos sodomitas, e Moisés pelos antepassados que pecaram no deserto,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: respondi et dixi
  choice: respondi
  rationale: A fórmula latina redundante é vertida de modo natural em português; «respondi» já introduz adequadamente a fala.
- source_word: invenimus modo
  choice: vemos agora
  rationale: Preserva a ideia de constatação presente sem o artificialismo de «encontramos agora».
- source_word: rogavit ... propter
  choice: interceder por
  rationale: No contexto da oração em favor de outros, «interceder por» comunica com precisão o sentido de pedir ou suplicar em benefício de alguém.
- source_word: primus Abraham
  choice: Abraão foi o primeiro
  rationale: O adjetivo latino «primus» concorda com Abraão e o apresenta como o primeiro de uma sequência de intercessores, não como alguém que primeiro orou por Sodoma antes de orar por outra causa.
- source_word: Sodomitas
  choice: sodomitas
  rationale: Correspondência lexical direta e inteligível para os habitantes de Sodoma.
- source_word: patribus
  choice: antepassados
  rationale: No contexto histórico do deserto, designa os ancestrais do povo, evitando a possível leitura de pais imediatos.
theological_decisions:
- issue: Natureza da ação de Abraão e Moisés
  choice: interceder
  alternative: orar / suplicar
  rationale: «Interceder» mantém explícito que a oração foi feita em favor de terceiros, sem acrescentar uma doutrina específica sobre mediação.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A oração permanece aberta no fim, pois o versículo continua sintaticamente nos versículos seguintes.
