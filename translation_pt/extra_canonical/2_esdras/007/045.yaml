  text: 'tibi autem soli ostendi haec. Et respondi tunc et dixi: domine, et nunc dico:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/045.yaml
  text: 'But to you alone I showed these things. Then I answered and said[a], “Lord, then I said, and now I say:'
translation:
  language: pt
  text: 'Mas foi somente a você que mostrei estas coisas. Então respondi e disse: “Senhor, eu disse naquela ocasião e agora digo:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim também pode ser entendido assim: “Então respondi e disse: ‘Senhor, e agora digo:’”.'
    reason: Preserva a ambiguidade sintática de tunc no testemunho latino.
lexical_decisions:
- source_word: tibi autem soli
  choice: Mas foi somente a você
  rationale: Preserva o contraste de autem e a ênfase exclusiva de soli em português natural.
- source_word: ostendi haec
  choice: mostrei estas coisas
  rationale: Tradução direta de ostendi e haec, sem especificar além do que o latim diz.
- source_word: respondi ... et dixi
  choice: respondi e disse
  rationale: Mantém a fórmula dupla do texto-fonte, embora seja parcialmente redundante em português.
- source_word: tunc ... nunc
  choice: naquela ocasião ... agora
  rationale: Expressa o contraste temporal aparente entre tunc e nunc sem transformar tunc simplesmente em marcador narrativo.
theological_decisions:
- issue: Relação sintática de tunc com respondi ou com a fala de Esdras
  choice: 'Vincular tunc ao conteúdo da fala: “eu disse naquela ocasião e agora digo”'
  alternative: '“Então respondi e disse: ‘Senhor, e agora digo’”'
  rationale: A posição do latim é difícil, mas o contraste explícito tunc/nunc e o apoio das versões antigas favorecem a referência ao que Esdras disse antes e diz agora. A ambiguidade do latim é registrada em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A formulação conserva a repetição semítica/antiga “respondi e disse” e deixa os dois-pontos finais, pois a frase introduz a continuação no versículo seguinte.
