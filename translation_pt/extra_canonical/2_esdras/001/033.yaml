  text: 'Thus says the Lord Almighty: Your house is desolate. I will cast you out like stubble before the wind.'
translation:
  language: pt
  text: 'Assim diz o Senhor Todo-Poderoso: A casa de vocês está deserta. Eu os lançarei fora como o vento lança a palha.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dominus omnipotens
  choice: Senhor Todo-Poderoso
  rationale: Equivalente português tradicional e claro para o título divino latino, sem acrescentar uma interpretação denominacional.
- source_word: domus vestra deserta est
  choice: A casa de vocês está deserta
  rationale: Preserva o presente de «est» e traduz «vestra» em português moderno de ampla compreensão; «deserta» mantém a imagem de abandono ou devastação.
- source_word: proiciam vos
  choice: Eu os lançarei fora
  rationale: Expressa a força e a direção de «proiciam» e torna explícito o futuro verbal.
- source_word: sicut uentus stipulam
  choice: como o vento lança a palha
  rationale: Supre naturalmente em português o verbo elíptico da comparação latina; «palha» comunica o resíduo vegetal leve levado pelo vento.
theological_decisions:
- issue: Referente de «domus vestra»
  choice: Manter «casa» sem definir se significa edifício, família, dinastia ou comunidade
  alternative: Explicitar «família», «linhagem» ou «templo»
  rationale: O latim conserva amplitude semântica, e o contexto fornecido não justifica resolver a imagem em favor de uma única leitura.
translation_notes:
  register: Português moderno, digno e de leitura natural, com «vocês» em vez de formas regionais ou arcaizantes. A redação segue a reconstrução integral do versículo atestada pela camada de consulta, pois o trecho latino fornecido começa e termina no meio de linhas («serta est»; «Et filii pro-»).
