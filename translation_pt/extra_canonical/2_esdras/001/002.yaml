  text: filho de Aías, filho de Fineias, filho de Eli, filho de Amarias, filho de Azias, filho de Meraiote, filho de Arna, filho de Uzias, filho de Borith, filho de Abisua, filho de Fineias, filho de Eleazar,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filii
  choice: filho de
  rationale: A repetição latina introduz cada elo da genealogia; a fórmula portuguesa natural e precisa é “filho de”.
- source_word: Achiae
  choice: Aías
  rationale: Forma portuguesa tradicional correspondente ao nome latino Achias/Achiae; mantém-se a variante registrada em nota.
- source_word: Abissei
  choice: Abisua
  rationale: No contexto da linhagem sacerdotal de Esdras, o nome corresponde a Abisua, e não a Abisai; isso também se harmoniza com a sequência genealógica de Esdras 7:1–5.
- source_word: Oziae
  choice: Uzias
  rationale: Equivalente português bíblico do nome representado pela forma latina Oziae.
- source_word: Marimoth
  choice: Meraiote
  rationale: Emprega a forma bíblica portuguesa reconhecível para o ancestral sacerdotal, em vez de simples transliteração da grafia latina.
