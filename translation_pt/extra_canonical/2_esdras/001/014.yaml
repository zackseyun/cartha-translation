  yaml_path: translation/extra_canonical/2_esdras/001/014.yaml
  text: I gave you Moses as a leader and Aaron as a priest. I provided you light by a pillar of fire, and I did great wonders among you.
translation:
  language: pt
  text: Eu dei a vocês Moisés como líder e Arão como sacerdote. Proporcionei a vocês luz por meio de uma coluna de fogo e realizei grandes maravilhas no meio de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ducem
  choice: líder
  rationale: Expressa de modo natural e atual a função de Moisés como aquele que conduzia o povo, sem acrescentar um título não presente no latim.
- source_word: sacerdotem
  choice: sacerdote
  rationale: Equivalente direto e tradicional para a função religiosa atribuída a Arão.
- source_word: praestiti
  choice: proporcionei-lhes
  rationale: Preserva o sentido de prover ou fornecer luz e evita repetir mecanicamente “dei” na oração anterior.
- source_word: per columnam ignis
  choice: por meio de uma coluna de fogo
  rationale: Reproduz com clareza a ideia instrumental de per e mantém a conhecida imagem bíblica.
- source_word: mirabilia
  choice: maravilhas
  rationale: Termo amplo e acessível que preserva o caráter extraordinário dos atos sem restringi-los a uma categoria técnica.
- source_word: in [uobis]
  choice: entre vocês
  rationale: Segue a leitura contextual refletida na camada inglesa auditada; o trecho latino fornecido termina apenas com a preposição “in”, indicando continuação textual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. O “Eu” explicita o sujeito enfático da sequência, e “lhes/vocês” mantém uma forma de tratamento corrente e coerente.
