  text: 'Quando inuocabitis me, ego non exaudiam uos: maculastis enim manus uestras sanguine, et pedes uestri inpigri sunt ad committenda homicidia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/026.yaml
  text: When you call upon me, I will not hear you, for you have defiled your hands with blood, and your feet are swift to commit murder.
translation:
  language: pt
  text: Quando vocês me invocarem, eu não os ouvirei, pois mancharam suas mãos com sangue, e seus pés são rápidos para cometer homicídios.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inuocabitis
  choice: invocarem
  rationale: Preserva o sentido de apelar ou clamar a Deus, em linguagem bíblica natural e corrente.
- source_word: non exaudiam
  choice: não os ouvirei
  rationale: Expressa a recusa divina de atender ao clamor, seguindo de perto o latim sem acrescentar uma explicação interpretativa.
- source_word: maculastis
  choice: mancharam
  rationale: Mantém a imagem concreta de mãos contaminadas pela culpa de sangue.
- source_word: inpigri sunt
  choice: são rápidos
  rationale: O adjetivo latino indica prontidão ou diligência; neste contexto negativo, 'rápidos' comunica disposição imediata para a violência.
- source_word: homicidia
  choice: homicídios
  rationale: Reproduz o plural latino e abrange atos de matar seres humanos sem restringir indevidamente o sentido a um único episódio.
theological_decisions:
- issue: Sentido de Deus não ouvir
  choice: não os ouvirei
  alternative: não os atenderei
  rationale: A formulação preserva a imagem auditiva do texto e a tensão entre invocar a Deus e ele recusar-se a ouvir, sem transformar explicitamente 'ouvir' em 'responder'.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por 'vocês' para clareza internacional com boa legibilidade brasileira. A estrutura paralela e as imagens de mãos e pés foram preservadas.
