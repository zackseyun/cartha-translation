source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non quasi me dereliquistis, sed uos ipsos, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/027.yaml
  text: It is not as though you have forsaken me[a], but yourselves, says the Lord.
translation:
  language: pt
  text: “Não é como se vocês me tivessem abandonado, mas a vocês mesmos”, diz o Senhor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não é tanto a mim que vocês abandonaram, mas a vocês mesmos”, diz o Senhor.'
    reason: Oferece uma formulação portuguesa mais idiomática para a negação retórica de «Non quasi», sem eliminar a ambiguidade da construção latina.
lexical_decisions:
- source_word: dereliquistis
  choice: tivessem abandonado
  rationale: O perfeito latino indica uma ação já realizada; depois de «como se», o português exige o subjuntivo composto para expressar naturalmente essa relação temporal.
- source_word: me ... uos ipsos
  choice: a mim, mas a vocês mesmos
  rationale: Mantém o contraste enfático entre a pessoa do Senhor e os próprios destinatários.
- source_word: dicit dominus
  choice: diz o Senhor
  rationale: Reproduz de forma direta e tradicional a fórmula declarativa latina.
theological_decisions:
- issue: Sentido da contraposição entre abandonar o Senhor e abandonar a si mesmos
  choice: 'Preservar literalmente a tensão retórica: «a mim, mas a vocês mesmos»'
  alternative: Explicitar que, ao abandonar o Senhor, eles prejudicaram ou condenaram a si mesmos
  rationale: O texto não explica em que sentido abandonaram a si mesmos; explicitar as consequências resolveria uma tensão que o original deixa aberta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «vocês» para a segunda pessoa do plural. A construção principal conserva de perto o «Non quasi» latino, enquanto a nota oferece uma leitura idiomática possível.
