source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non ignem uobis pro blasphemiis dedi, sed mittens lignum in aqua dulce feci flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/023.yaml
  text: I did not give you fire for your blasphemies, but by casting wood into the water I made the stream sweet.
translation:
  language: pt
  text: Não lhes dei fogo por causa de suas blasfêmias; pelo contrário, lançando madeira na água, tornei doce o riacho.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pro blasphemiis
  choice: por causa de suas blasfêmias
  rationale: Expressa naturalmente o valor causal de pro sem decidir se o fogo seria punição ou resposta às blasfêmias.
- source_word: lignum
  choice: madeira
  rationale: Mantém o termo latino genérico e evita especificar indevidamente um pedaço, galho ou tipo de madeira.
- source_word: dulce feci flumen
  choice: tornei doce o riacho
  rationale: Preserva a construção causativa e a imagem de tornar potável ou agradável uma corrente antes amarga, sem explicitar além do texto.
theological_decisions:
- issue: Relação entre o fogo e as blasfêmias
  choice: Não lhes dei fogo por causa de suas blasfêmias
  alternative: Não lhes dei fogo como castigo por suas blasfêmias
  rationale: A tradução conserva a formulação ampla do latim e não acrescenta explicitamente a noção de castigo.
- issue: Contraste entre juízo e provisão
  choice: pelo contrário
  alternative: mas
  rationale: Torna claro o contraste introduzido por sed, sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, digno e acessível, com pronomes de terceira pessoa para ampla legibilidade brasileira. A ordem foi levemente ajustada para fluidez, preservando o particípio latino mittens por meio de “lançando”.
