  yaml_path: translation/extra_canonical/2_esdras/001/031.yaml
  text: When you bring offerings to me[a], I will turn my face from you; for I have rejected your feast days and new moons and circumcisions of the flesh.
translation:
  language: pt
  text: Quando vocês me trouxerem ofertas[a], desviarei o meu rosto de vocês, pois rejeitei suas festas, luas novas e circuncisões da carne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim diz literalmente “quando vocês trouxerem”, sem mencionar expressamente o que é trazido. Este capítulo pertence à camada cristã posterior muitas vezes chamada de 5 Esdras. A rejeição de “festas, luas novas e circuncisões da carne” reflete a voz polêmica dessa camada e não deve ser confundida com a teologia da apocalipse judaica dos capítulos 3–14.
    reason: compositional_layer_and_textual_explication
lexical_decisions:
- source_word: obtulleritis
  choice: trouxerem ofertas
  rationale: O verbo latino, forma ortográfica de obtuleritis, significa literalmente “tiverem trazido/oferecido”. O objeto fica implícito no fragmento; “ofertas” explicita de modo mínimo o sentido cultual indicado pelo contexto, em consonância com a camada de consulta inglesa.
- source_word: auertam faciem meam a uobis
  choice: desviarei de vocês o meu rosto
  rationale: Mantém a imagem antropomórfica e a construção semítica preservada pelo latim, com formulação clara em português.
- source_word: dies enim festos uestros et neomenias
  choice: pois rejeitei suas festas, luas novas
  rationale: “Festas” traduz naturalmente dies festos; “luas novas” é a designação bíblica corrente para neomenias e conserva a referência ao calendário cultual.
- source_word: circumcisiones carnis
  choice: circuncisões da carne
  rationale: Tradução formal que preserva o plural incomum e a ênfase polêmica em “da carne”, sem reinterpretá-la teologicamente.
- source_word: repudiavi
  choice: rejeitei
  rationale: Expressa com clareza a recusa enfática do perfeito latino, sem acrescentar nuances ausentes do texto.
theological_decisions:
- issue: Voz polêmica contra práticas cultuais
  choice: Preservar literalmente a rejeição de festas, luas novas e circuncisões da carne, acompanhada de nota sobre a camada composicional.
  alternative: Harmonizar a declaração com a teologia da apocalipse judaica dos capítulos 3–14 ou suavizar a rejeição.
  rationale: O texto pertence à camada cristã posterior comumente chamada 5 Esdras. A tradução não deve apagar sua tensão interna nem atribuir essa voz indistintamente ao núcleo judaico da obra.
- issue: Objeto implícito de obtuleritis
  choice: Explicitar “ofertas” no texto e assinalar a questão em nota.
  alternative: Traduzir apenas “Quando vocês trouxerem” ou especificar um tipo particular de sacrifício.
  rationale: O latim preservado não apresenta objeto expresso neste trecho. “Ofertas” comunica o contexto cultual sem restringi-lo a uma categoria sacrificial específica.
translation_notes:
  register: Português moderno, digno e acessível, com “vocês” para o plural e imagens bíblicas preservadas. A formulação mantém a aspereza da polêmica do texto e evita harmonização denominacional.
