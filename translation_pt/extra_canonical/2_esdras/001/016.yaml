source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ad tutelam dedi, et illic murmurastis, Et non triumphastis in nomine meo de perditione inimicorum uestrorum, sed adhuc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/016.yaml
  text: I gave for protection[a], and there you grumbled. You did not exult in my name over the destruction of your enemies, but still
translation:
  language: pt
  text: Eu dei para proteção[a], e ali vocês murmuraram. E não exultaram em meu nome por causa da destruição dos seus inimigos, mas ainda...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “dei para proteção”; o objeto direto de “dei” não está expresso no latim.
    reason: A formulação latina é elíptica. A nota explica a omissão sem identificar ou acrescentar a dádiva.
lexical_decisions:
- source_word: ad tutelam dedi
  choice: Eu lhes dei proteção
  rationale: O latim diz literalmente “dei para proteção”, com o objeto não expresso. A formulação portuguesa comunica naturalmente a função protetora sem inventar qual foi a dádiva.
- source_word: illic murmurastis
  choice: ali vocês murmuraram
  rationale: “Ali” preserva a referência espacial de illic, e “murmuraram” mantém o sentido de queixa ou contestação de murmurare.
- source_word: triumphastis
  choice: exultaram
  rationale: Neste contexto, triumphare significa alegrar-se ou exultar, não necessariamente vencer em combate.
- source_word: de perditione inimicorum uestrorum
  choice: por causa da destruição dos seus inimigos
  rationale: A construção de + ablativo indica o motivo ou assunto da exultação. “Por causa de” evita sugerir que eles venceriam a própria destruição.
- source_word: sed adhuc
  choice: mas ainda...
  rationale: O trecho fornecido termina de modo incompleto. As reticências preservam essa suspensão sem acrescentar conteúdo ausente.
theological_decisions:
- issue: Agente e natureza da proteção concedida
  choice: Não identificar o objeto implícito de dedi
  alternative: Explicitar uma dádiva ou ato protetor específico com base no contexto mais amplo
  rationale: O segmento latino não nomeia o que foi dado para proteção; explicitar algo resolveria indevidamente a elipse textual.
- issue: Exultação “em meu nome” diante da destruição dos inimigos
  choice: Preservar literalmente a relação entre o nome divino e a exultação
  alternative: Parafrasear como louvor ou atribuição da vitória a Deus
  rationale: A expressão in nomine meo admite nuances teológicas que não devem ser reduzidas por paráfrase.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para legibilidade brasileira e compreensão internacional. A interrupção final do texto-fonte foi mantida por reticências.
