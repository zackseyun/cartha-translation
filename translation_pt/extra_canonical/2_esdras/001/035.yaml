base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/035.yaml
  text: I will give your houses to a people that is coming[a], who, without hearing me, believe; to whom I have shown no signs, yet they will do what I have commanded.
translation:
  language: pt
  text: Darei as casas de vocês ao povo que vem[a]. Sem me ouvirem, eles creem; não lhes mostrei sinais, mas farão o que ordenei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ao povo que está chegando”.'
    reason: Registra a possibilidade de verter populo uenienti com uma construção progressiva, preservando o particípio presente.
lexical_decisions:
- source_word: domus uestras
  choice: as casas de vocês
  rationale: Reproduz de modo natural o objeto direto e o possessivo plural do latim.
- source_word: populo uenienti
  choice: ao povo que está chegando
  rationale: Preserva o particípio presente latino e a ideia de um povo em processo de chegada.
- source_word: qui me non audientes credunt
  choice: que, sem me ouvir, crê
  rationale: Mantém a simultaneidade de non audientes e o presente de credunt, em contraste com o futuro facient.
- source_word: quibus signa non ostendi
  choice: embora eu não lhe tenha mostrado sinais
  rationale: Expressa naturalmente o contraste contextual; ostendi pode ser perfeito, aqui vertido como pretérito perfeito composto de valor resultativo.
- source_word: facient quae praecepi
  choice: fará o que ordenei
  rationale: Conserva o futuro facient e entende quae como aquilo que foi ordenado.
theological_decisions:
- issue: Contraste entre fé presente e obediência futura
  choice: “crê” ... “fará”
  alternative: “crerá” ... “fará”
  rationale: O latim distingue explicitamente credunt, presente, de facient, futuro; a tradução preserva essa tensão temporal.
- issue: Relação entre não ouvir e crer
  choice: “sem me ouvir, crê”
  alternative: “embora não tenha me ouvido, crerá”
  rationale: A escolha não transforma o particípio presente em ação passada nem o verbo presente em futuro.
translation_notes:
  register: Português moderno, digno e acessível, com concordância coletiva no singular para “povo”. A pontuação torna claros os contrastes sem resolver além do necessário a sintaxe latina.
