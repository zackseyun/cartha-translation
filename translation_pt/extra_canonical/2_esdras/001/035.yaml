review_pass:
  verdict: revise
  source_fidelity: A tradução preserva adequadamente «Darei» e o contraste temporal fundamental entre credunt (presente) e facient (futuro). Contudo, o latim retoma o antecedente coletivo segundo o sentido plural («qui ... credunt; quibus ... facient»). O singular «crê ... fará» apaga essa concordância plural explícita. Além disso, «embora» introduz uma concessão interpretativa que não está expressa por uma conjunção no latim, embora o contraste seja claramente sugerido pela justaposição.
  naturalness: «O povo que está chegando, que, sem me ouvir, crê» é compreensível, mas soa algo pesado e a alternância entre o coletivo singular e os relativos latinos plurais fica pouco natural em português. Uma retomada pronominal plural torna a frase mais clara e fluente.
  terminology: «Casas de vocês», «povo que vem/está chegando», «sinais» e «ordenar» são escolhas adequadas. «Sem me ouvirem» conserva a ação simultânea do particípio non audientes sem a transformar em falta passada de audição.
  issues:
  - severity: medium
    issue: Os verbos «crê» e «fará» estão no singular, enquanto credunt e facient estão no plural.
    rationale: Embora populo seja formalmente singular, os relativos e verbos latinos estão no plural, por concordância segundo o sentido com os membros do povo. A versão deve conservar esse dado semântico e gramatical.
  - severity: low
    issue: «Embora eu não lhe tenha mostrado sinais» explicita uma relação concessiva por meio de «embora».
    rationale: O texto latino apresenta a oração relativa sem conjunção concessiva. O contraste pode ser expresso por «mas» na coordenação, sem caracterizar a oração relativa como uma concessiva formal.
  revised_text: Darei as casas de vocês ao povo que vem[a]. Sem me ouvirem, eles creem; não lhes mostrei sinais, mas farão o que ordenei.
  revised_footnotes:
  - marker: a
    text: 'Ou: “ao povo que está chegando”.'
    reason: Registra a possibilidade de verter populo uenienti com uma construção progressiva, preservando o particípio presente.
