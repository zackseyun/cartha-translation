- from: Darei as casas de vocês ao povo que está chegando[a], que, sem me ouvir, crê; embora eu não lhe tenha mostrado sinais, fará o que ordenei.
  to: Darei as casas de vocês ao povo que vem[a]. Sem me ouvirem, eles creem; não lhes mostrei sinais, mas farão o que ordenei.
  rationale: A revisão mantém o presente «creem» e o futuro «farão», reproduz a referência plural de qui/quibus/facient e evita introduzir uma conjunção concessiva ausente do texto. A divisão em frases preserva a sequência e os contrastes do latim de modo natural em português.
