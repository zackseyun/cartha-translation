  text: populi uenientis gratiam, cuius paruuli exultant cum laetitia, me non uidentes oculis carnalibus, sed spiritu credent quae dixi. Et nunc, pater, aspice cum gloria et uide populum uenientem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/037.yaml
  text: the favor of the people that is coming[a], whose little ones rejoice with gladness, not seeing me with bodily eyes, but in spirit believing what I have said. And now, Father, look with glory and see the people that is coming
translation:
  language: pt
  text: o favor[a] do povo que vem, cujas crianças exultam de alegria, sem me verem com olhos carnais, mas em espírito crerão no que eu disse. E agora, Pai, contempla com glória e vê o povo que vem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “a graça”.
    reason: O latim gratiam pode significar tanto “favor” quanto “graça” neste contexto.
lexical_decisions:
- source_word: gratiam
  choice: favor
  rationale: O acusativo latino significa aqui “favor” ou “graça”. “Favor” preserva o sentido relacional sem impor uma leitura teológica mais específica; a alternativa consta em nota.
- source_word: parvuli
  choice: crianças
  rationale: Expressa naturalmente os “pequenos” ou “pequeninos” do povo mencionado, sem sugerir necessariamente pequenez figurada.
- source_word: oculis carnalibus
  choice: olhos carnais
  rationale: Mantém o contraste explícito entre a visão corporal e a fé “em espírito”, bem como a tensão teológica do latim.
- source_word: spiritu
  choice: em espírito
  rationale: 'Conserva a formulação concisa e sua ambiguidade: pode indicar o âmbito ou o meio espiritual da fé.'
- source_word: aspice cum gloria
  choice: contempla com glória
  rationale: Reproduz cum gloria sem decidir se a glória acompanha o ato, caracteriza seu modo ou indica seu âmbito; “contempla” também evita apagar a distinção em relação ao verbo seguinte, vide.
- source_word: populum uenientem
  choice: o povo que vem
  rationale: Traduz o particípio presente de modo natural e mantém a ideia de um povo em aproximação ou surgimento.
theological_decisions:
- issue: Contraste entre não ver corporalmente e crer espiritualmente
  choice: “Embora não me vejam com olhos carnais, em espírito crerão”
  alternative: “sem me verem com olhos físicos, mas crendo pelo Espírito”
  rationale: A redação escolhida preserva o futuro credent e evita identificar spiritu de maneira inequívoca com o Espírito Santo, identificação que o latim não exige.
- issue: Sentido de gratia
  choice: “favor” no texto, com “graça” em nota
  alternative: “graça” no texto principal
  rationale: Ambos são possíveis. “Favor” é claro no contexto e evita antecipar um sentido teológico técnico, sem ocultar a alternativa tradicional.
translation_notes:
  register: Português moderno, digno e acessível, com construção próxima do latim. O início em minúscula conserva o caráter fragmentário e a continuidade sintática com o versículo anterior. A conjunção “Embora” torna natural a relação entre o particípio presente negativo e o verbo futuro, sem alterar o contraste central.
