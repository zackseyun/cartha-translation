base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/021.yaml
  text: I covered you with the leaves of trees[a]. I divided fertile lands for you; I drove out the Canaanites and Perizzites and Philistines from before you. What shall I do for you? says the Lord.
translation:
  language: pt
  text: Eu cobri vocês com folhas de árvores. Dividi terras férteis para vocês[a] e expulsei da presença de vocês os cananeus, os ferezeus e os filisteus. Que farei?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim diz literalmente: “Dividi para vocês terras férteis”, expressão condensada que pode se referir à distribuição da terra entre as tribos de Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: folia arborum uos texi
  choice: Eu cobri vocês com folhas de árvores
  rationale: Traduz diretamente a imagem concreta do latim, sem tentar explicar ou substituir a expressão incomum.
- source_word: Diuisi uobis terras pingues
  choice: Dividi terras férteis para vocês
  rationale: Mantém o verbo amplo “dividi” e traduz literalmente a ideia de terras produtivas, sem decidir se se trata especificamente da distribuição tribal.
- source_word: a facie uestra proieci
  choice: expulsei da presença de vocês
  rationale: Reproduz a construção espacial do latim em português claro e digno; “expulsei” comunica adequadamente a remoção forçada expressa por proieci.
- source_word: quid faciam
  choice: Que farei por vocês?
  rationale: Conserva a pergunta aberta; “por vocês” explicita a relação contextual já estabelecida por uobis na frase anterior e segue a leitura da camada inglesa auditada.
theological_decisions:
- issue: Identificação de quem fala
  choice: — diz o Senhor
  alternative: Omitir a fórmula, pois ela não aparece no trecho latino fornecido
  rationale: A fórmula é preservada conforme a delimitação versicular da camada inglesa auditada, que identifica explicitamente o Senhor como locutor; ela não introduz uma interpretação denominacional.
translation_notes:
  register: Português atual, claro e solene, com “vocês” para ampla legibilidade brasileira. A imagem incomum das folhas foi mantida, assim como a formulação condensada sobre a divisão das terras. O marcador da nota foi colocado junto à expressão que ela explica.
