  yaml_path: translation/extra_canonical/2_esdras/001/011.yaml
  text: I destroyed all the nations before them, and in the east I scattered the people of the two provinces, Tyre and Sidon, and killed all their enemies.
translation:
  language: pt
  text: Destruí diante deles todas as nações; no leste, dispersei o povo das duas províncias, Tiro e Sidom, e matei todos os seus adversários.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: a facie eorum
  choice: diante deles
  rationale: Preserva a expressão espacial latina e comunica que as nações foram eliminadas do caminho ou da presença deles, sem explicitar além do texto.
- source_word: in oriente
  choice: no leste
  rationale: Tradução direta e natural da indicação geográfica.
- source_word: prouinciarum duarum
  choice: das duas províncias
  rationale: Mantém a designação administrativa do texto latino e sua relação com Tiro e Sidom.
- source_word: dissipaui
  choice: dispersei
  rationale: Expressa o sentido de espalhar ou desbaratar uma população.
- source_word: aduersarios
  choice: adversários
  rationale: Preserva o termo amplo do latim, sem restringi-lo a inimigos militares.
