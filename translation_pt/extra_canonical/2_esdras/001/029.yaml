id: 2ES.1.29
reference: 2 Esdras 1:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vt essetis mihi in populum, et ego uobis in deum, et uos mihi in filios, et ego uobis in patrem ? Ita uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/029.yaml
  text: that you should be my people[a], and I should be your God, and you should be my sons, and I should be your father?
translation:
  language: pt
  text: para que vocês fossem meu povo, e eu fosse o Deus de vocês, e vocês fossem meus filhos[a], e eu fosse o pai de vocês?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “meus filhos e minhas filhas”.
    reason: Preserva a possível abrangência coletiva de filios sem apagar no texto principal a imagem lexical de pai e filhos.
lexical_decisions:
- source_word: populum
  choice: povo
  rationale: Equivalente direto e natural, preservando a linguagem relacional de aliança.
- source_word: in deum
  choice: o Deus de vocês
  rationale: Expressa em português corrente a relação indicada pela construção latina com in, sem tornar a frase excessivamente literal.
- source_word: filios
  choice: filhos
  rationale: Mantém o masculino lexical do latim e a imagem explícita de pai e filhos, além da ligação com o versículo anterior; em português, “filhos” também pode ter sentido coletivo inclusivo.
- source_word: in patrem
  choice: o pai de vocês
  rationale: Reproduz de modo natural a relação paterna afirmada no latim.
theological_decisions:
- issue: Alcance de filios
  choice: filhos
  alternative: filhos e filhas; crianças
  rationale: O latim emprega filios, que sustenta a tradução específica “filhos” e reforça a correspondência com “pai”; a nota preserva a possibilidade de uso coletivo inclusivo.
translation_notes:
  register: Português moderno, claro e digno, com “vocês” para ampla legibilidade brasileira. A repetição coordenada preserva a cadência retórica do latim. O fragmento final Ita vos parece iniciar a frase seguinte e, de acordo com o limite do versículo refletido na camada inglesa auditada, não foi incorporado a esta tradução.
