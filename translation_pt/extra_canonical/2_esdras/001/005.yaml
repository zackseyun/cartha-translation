source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vade et nuntia populo meo facinora ipsorum et filiis eorum iniquitates, quas in me admiserunt, ut nuntient filiis filiorum suorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/005.yaml
  text: “Go and declare to my people their evil deeds, and to their children the iniquities that they have committed against me, so that they may tell their children's children.
translation:
  language: pt
  text: “Vá e anuncie ao meu povo os atos perversos deles e, aos seus filhos, as iniquidades que cometeram contra mim, para que anunciem aos filhos de seus filhos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vade
  choice: Vá
  rationale: Reproduz de modo natural e direto o imperativo singular latino.
- source_word: nuntia
  choice: anuncie
  rationale: Mantém o sentido de comunicar publicamente ou dar a conhecer, sem restringi-lo a mera conversa.
- source_word: facinora
  choice: atos perversos
  rationale: Expressa a forte conotação moral de crimes ou malfeitos graves, em linguagem atual e abrangente.
- source_word: iniquitates
  choice: iniquidades
  rationale: Preserva o vocabulário moral e teológico distinto do termo anterior.
- source_word: in me admiserunt
  choice: cometeram contra mim
  rationale: Representa a construção latina idiomática para ofensas praticadas contra alguém.
- source_word: filiis filiorum suorum
  choice: filhos de seus filhos
  rationale: Preserva literalmente a expressão geracional, sem substituí-la por um termo interpretativo como “netos”.
theological_decisions:
- issue: Referente do sujeito em “ut nuntient”
  choice: para que eles as contem
  alternative: para que as contem
  rationale: O pronome explícito favorece a leitura gramatical de que os filhos transmitirão as iniquidades à geração seguinte, embora o latim permita certa continuidade coletiva do povo e de seus descendentes.
- issue: Objeto transmitido à geração seguinte
  choice: as
  alternative: isso
  rationale: O pronome feminino plural retoma mais imediatamente “iniquidades”, sem afirmar que somente os atos designados pelo primeiro substantivo estão excluídos do relato.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A formulação conserva o paralelismo entre “atos perversos” e “iniquidades” e mantém a cadeia explícita de gerações do latim.
