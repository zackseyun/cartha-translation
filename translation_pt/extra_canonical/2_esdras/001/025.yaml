  text: 'Quoniam me dereliquistis, et ego uos derelinquam: petentibus uobis a me misericordiam, non miserebor uestri.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/025.yaml
  text: Because you have forsaken me, I also will forsake you. When you ask me for mercy, I will not have mercy on you.
translation:
  language: pt
  text: Pois vocês me abandonaram, e eu também os abandonarei. Quando vocês me pedirem misericórdia, não terei misericórdia de vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquistis / derelinquam
  choice: abandonaram / abandonarei
  rationale: Preserva a repetição enfática do mesmo verbo latino e expressa com naturalidade a ruptura relacional.
- source_word: petentibus uobis a me misericordiam
  choice: Quando vocês me pedirem misericórdia
  rationale: Reproduz de modo claro a construção temporal circunstancial do latim, sem acrescentar conteúdo.
- source_word: non miserebor uestri
  choice: não terei misericórdia de vocês
  rationale: Mantém a correspondência lexical com misericordiam e a força direta da declaração.
theological_decisions:
- issue: Reciprocidade do abandono divino
  choice: eu também os abandonarei
  alternative: eu também deixarei vocês
  rationale: Mantém a tensão explícita do texto entre o abandono praticado pelo povo e a resposta divina, sem suavização teológica.
- issue: Negativa futura de misericórdia
  choice: não terei misericórdia de vocês
  alternative: não me compadecerei de vocês
  rationale: Conserva a repetição conceitual de misericórdia presente no latim e evita interpretar ou limitar o alcance da sentença.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “vocês” para a segunda pessoa plural e preservação do paralelismo contundente do original.
