source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu autem excute comam capitis tui et proice omnia mala super illos, quoniam non obaudierunt legi meae; populus autem indisciplinatus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/008.yaml
  text: But you[a], shake out the hair of your head and cast all evils upon them, because they have not obeyed my law; they are an undisciplined people.
translation:
  language: pt
  text: Mas você, sacuda os cabelos da cabeça e lance sobre eles todos os males, porque não obedeceram à minha lei; são, porém, um povo indisciplinado.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “um povo rebelde”.
    reason: Registra uma alternativa contextual possível para indisciplinatus, embora 'indisciplinado' seja lexicalmente mais direto.
lexical_decisions:
- source_word: excute comam capitis tui
  choice: sacuda os cabelos da cabeça
  rationale: Reproduz de modo claro e natural a ação concreta expressa pelo latim, sem transformar a imagem em uma interpretação.
- source_word: proice omnia mala super illos
  choice: lance sobre eles todos os males
  rationale: Mantém o sentido distributivo de omnia e a imagem direcional de super illos.
- source_word: non obaudierunt legi meae
  choice: não obedeceram à minha lei
  rationale: Traduz diretamente a falta de obediência à lei, preservando a ligação com a caracterização seguinte.
- source_word: populus autem indisciplinatus
  choice: são, porém, um povo indisciplinado
  rationale: Indisciplinatus significa primariamente sem disciplina ou instrução; 'indisciplinado' conserva essa especificidade e sua relação com a desobediência à lei.
theological_decisions:
- issue: Natureza da censura expressa por indisciplinatus
  choice: povo indisciplinado
  alternative: povo rebelde
  rationale: A tradução principal preserva o valor lexical específico do latim, enquanto a nota registra a leitura contextual possível sem reduzir o termo a rebeldia genérica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento singular por “você”. A ordem e as imagens do latim foram preservadas sem sacrificar a fluidez.
source_grounding:
  english_pob_role: consult_only
