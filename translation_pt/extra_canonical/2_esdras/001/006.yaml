source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quia peccata parentum illorum in illis creuerunt: obliti enim me sacrificauerunt diis alienis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/006.yaml
  text: For the sins of their fathers have increased in them; for they forgot me and sacrificed to foreign gods.
translation:
  language: pt
  text: Pois os pecados dos pais deles cresceram neles, porque se esqueceram de mim e ofereceram sacrifícios a deuses estrangeiros.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: parentum illorum
  choice: dos pais deles
  rationale: Reproduz de modo natural a referência aos antepassados imediatos sem ampliar o latim para «antepassados».
- source_word: in illis creuerunt
  choice: cresceram neles
  rationale: 'Preserva a imagem e a possível tensão do original: os pecados dos pais se desenvolveram ou se intensificaram nos descendentes.'
- source_word: obliti enim me
  choice: porque se esqueceram de mim
  rationale: Expressa com clareza a relação explicativa introduzida por «enim» e mantém Deus como objeto do esquecimento.
- source_word: sacrificauerunt
  choice: ofereceram sacrifícios
  rationale: Formulação idiomática e digna em português para o ato cultual indicado pelo verbo latino.
- source_word: diis alienis
  choice: a deuses estrangeiros
  rationale: Mantém o sentido literal de divindades alheias ao Deus de Israel, sem substituir por uma interpretação como «falsos deuses».
theological_decisions:
- issue: Relação entre os pecados dos pais e os descendentes
  choice: «os pecados dos pais deles cresceram neles»
  alternative: «eles aumentaram os pecados de seus pais»
  rationale: A construção latina põe «os pecados» como sujeito de «cresceram» e «neles» como âmbito; a tradução conserva essa formulação ambígua, sem decidir se se trata de herança, repetição ou agravamento moral.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe próxima do original. «Pais» e «deuses estrangeiros» preservam as escolhas concretas do latim; não foram acrescentadas explicações confessionais.
