  yaml_path: translation/extra_canonical/2_esdras/001/024.yaml
  text: What shall I do to you, Jacob? You would not obey me, Judah. I will turn to other nations, and I will give them my name, that they may keep my statutes.
translation:
  language: pt
  text: O que farei com você, Jacó? Você não quis me obedecer, Judá. Eu me voltarei para outras nações e lhes darei o meu nome, para que guardem os meus estatutos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi faciam
  choice: O que farei com você
  rationale: Expressa naturalmente em português a pergunta dirigida a Jacó, mantendo a abertura retórica do latim sem especificar uma ação não declarada.
- source_word: noluisti me obaudire
  choice: Você não quis me obedecer
  rationale: Preserva o valor volitivo de noluisti, mais forte e preciso que simplesmente “não obedeceu”.
- source_word: transferam me
  choice: Eu me voltarei
  rationale: Comunica a mudança de orientação para outros povos de modo natural, sem sugerir necessariamente deslocamento físico.
- source_word: alias gentes
  choice: outras nações
  rationale: Mantém o sentido coletivo de gentes e a terminologia bíblica corrente.
- source_word: legitima mea
  choice: os meus estatutos
  rationale: “Estatutos” representa adequadamente prescrições estabelecidas e conserva o registro bíblico-jurídico.
theological_decisions:
- issue: Sentido de dar o nome divino a outras nações
  choice: lhes darei o meu nome
  alternative: farei com que levem o meu nome
  rationale: Mantém a formulação concreta e sua possível amplitude teológica, sem decidir se indica pertença, invocação, identidade ou autoridade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” para leitura brasileira natural. A repetição dos vocativos “Jacó” e “Judá” preserva a estrutura e a tensão do texto latino.
