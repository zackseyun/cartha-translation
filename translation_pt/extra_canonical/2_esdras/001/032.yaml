base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/032.yaml
  text: I sent my servants the prophets to you, whom you received and killed and tore their bodies apart; their blood I will require, says the Lord.
translation:
  language: pt
  text: Enviei a vocês os meus servos, os profetas; vocês os receberam, mataram e despedaçaram seus corpos. Eu exigirei contas pelo sangue deles, diz o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pueros meos prophetas
  choice: os meus servos, os profetas
  rationale: Embora pueros possa significar literalmente “meninos” ou “jovens”, neste contexto designa os enviados subordinados de Deus; “servos” expressa naturalmente a função, e “os profetas” conserva a aposição latina.
- source_word: acceptos
  choice: receberam
  rationale: Mantém o sentido direto de accipere no particípio, sem introduzir a ideia mais específica de prender ou agarrar.
- source_word: interfecistis
  choice: mataram
  rationale: Equivalente claro e corrente para a ação de tirar a vida.
- source_word: laniastis corpora illorum
  choice: despedaçaram seus corpos
  rationale: Preserva a violência de laniare, que indica dilacerar ou esquartejar, em português natural.
- source_word: sanguinem exquiram
  choice: exigirei contas pelo sangue deles
  rationale: Exquirere aqui comunica a exigência judicial de responsabilidade pelo sangue derramado; a formulação portuguesa torna explícita essa força idiomática sem definir além do necessário a forma da retribuição.
theological_decisions:
- issue: A exigência divina relativa ao sangue dos profetas
  choice: Eu exigirei contas pelo sangue deles
  alternative: Eu requererei o sangue deles
  rationale: A opção escolhida preserva a linguagem de responsabilização e juízo, evitando que o português sugira literalmente que Deus pede a entrega física do sangue.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A segunda pessoa plural latina foi vertida por “vocês”, forma corrente e internacionalmente inteligível. O fragmento “Haec dicit dominus omnipotens: domus uestra de-” pertence ao início do versículo seguinte e não foi incluído em 1:32.'
