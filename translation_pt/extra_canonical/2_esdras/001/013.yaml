  text: Surely I brought you through the sea[a], and in trackless places I made roads secure for you.
translation:
  language: pt
  text: De fato, eu os fiz atravessar o mar e, em lugares sem caminho, tornei seguras estradas para vocês.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nempe ego
  choice: De fato, eu
  rationale: Representa a ênfase afirmativa de “nempe” e mantém explícito o sujeito enfático “ego”, sem acrescentar uma fórmula de fala ausente no versículo.
- source_word: uos mare traieci
  choice: eu os fiz atravessar o mar
  rationale: 'Expressa o valor transitivo/causativo de “traicere”: Deus fez o povo passar de um lado ao outro do mar.'
- source_word: plateas uobis in inuia munitas
  choice: em lugares sem caminho, abri para vocês estradas seguras
  rationale: “In invia” designa lugares onde não há caminho; “plateas” refere-se a vias ou estradas amplas, e “munitas” indica que foram preparadas, firmadas ou tornadas seguras. “Abri ... estradas seguras” comunica naturalmente a criação e preparação dessas vias.
theological_decisions:
- issue: Possível continuação da fórmula “Assim diz o Senhor” do versículo anterior
  choice: Não repetir a fórmula neste versículo
  alternative: '“Assim diz o Senhor: eu os fiz atravessar...”'
  rationale: O texto latino deste versículo começa com “Nempe ego” e não contém a fórmula de mensageiro; transportá-la do versículo anterior apagaria a abertura enfática própria do versículo 13.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A tradução conserva a afirmação enfática inicial e evita tanto o literalismo pouco natural de “fortifiquei estradas” quanto a introdução de material ausente no latim.
