  yaml_path: translation/extra_canonical/2_esdras/001/020.yaml
  text: You ate the bread of angels for food. When you were thirsty[a], did I not split the rock, and waters flowed in abundance? Because of the heat I covered you with the leaves of trees.
translation:
  language: pt
  text: Como alimento, vocês comeram o pão dos anjos. Quando estavam com sede, não fendi a rocha, e a água não correu em abundância? Por causa do calor…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho latino fornecido termina aqui, deixando a frase incompleta.
    reason: A fonte citada encerra-se em «propter aestus»; não é seguro acrescentar a continuação presente na camada inglesa sem apoio no texto latino fornecido.
lexical_decisions:
- source_word: in escam
  choice: Como alimento
  rationale: Expressa de modo natural a função alimentar indicada pela locução latina, sem alterar sua ligação com «pão dos anjos».
- source_word: panem angelorum
  choice: o pão dos anjos
  rationale: Tradução direta, preservando a conhecida expressão bíblica e sua possível carga alusiva.
- source_word: petram excidi
  choice: fendi eu a rocha
  rationale: Mantém a imagem concreta de abrir a rocha e conserva a ênfase interrogativa de «Nonne».
- source_word: fluxerunt aquae in satietate
  choice: fazendo correr água em abundância
  rationale: Resolve com naturalidade a coordenação latina dentro da pergunta e comunica que a água correu em quantidade suficiente para saciar.
- source_word: propter aestus
  choice: Por causa do calor
  rationale: Tradução direta; as reticências assinalam que o trecho latino fornecido termina com uma locução incompleta.
theological_decisions:
- issue: Identidade do «pão dos anjos»
  choice: Manter literalmente «pão dos anjos»
  alternative: Explicitar como maná ou alimento celestial
  rationale: O latim não identifica expressamente o pão como maná nesta frase; a tradução preserva a alusão sem resolver além do texto.
- issue: Agente que fende a rocha
  choice: Preservar a primeira pessoa divina implícita em «excidi»
  alternative: Usar uma formulação passiva ou impessoal
  rationale: A pergunta atribui diretamente a ação ao locutor; «não fendi eu» mantém essa ênfase.
translation_notes:
  register: Português atual, digno e acessível, com «vocês» para o plural dirigido ao povo e sintaxe natural de ampla legibilidade brasileira. A formulação evita arcaísmos, preserva a imagem bíblica e sinaliza de forma transparente a interrupção da fonte.
