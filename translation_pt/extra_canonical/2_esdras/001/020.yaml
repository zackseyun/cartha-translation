  - severity: low
    issue: A inversão «não fendi eu» soa mais elevada/arcaizante do que o registro moderno solicitado.
    rationale: O sujeito de primeira pessoa já está expresso pela flexão verbal latina; não é necessário introduzir a ênfase adicional de «eu».
