  yaml_path: translation/extra_canonical/2_esdras/001/030.yaml
  text: Thus I gathered you as a hen gathers her chicks under her wings[a]. But now what shall I do with you? I will cast you out from before my face.
translation:
  language: pt
  text: Assim eu reuni vocês, como uma galinha reúne seus pintinhos debaixo de suas asas. Mas agora, o que farei com vocês? Eu expulsarei vocês da minha presença.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: collegi
  choice: reuni
  rationale: Expressa de modo natural o sentido de ajuntar e acolher, preservando a imagem da galinha e seus pintinhos.
- source_word: pullos suos
  choice: seus pintinhos
  rationale: Na comparação com a galinha, 'pintinhos' é a equivalência corrente e inequívoca.
- source_word: proiciam uos a facie mea
  choice: Eu os expulsarei da minha presença
  rationale: Traduz idiomaticamente a expulsão para longe da face divina, sem perder o sentido relacional de exclusão da presença.
theological_decisions:
- issue: Imagem do acolhimento sob as asas
  choice: como a galinha reúne seus pintinhos debaixo das asas
  alternative: como uma galinha recolhe seus pintinhos sob as asas
  rationale: Mantém a comparação concreta do latim sem acrescentar interpretação teológica.
- issue: Expressão antropomórfica 'a facie mea'
  choice: da minha presença
  alternative: de diante da minha face
  rationale: A formulação escolhida comunica em português natural o valor idiomático da expressão, sem negar sua imagem subjacente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por 'vocês' para legibilidade brasileira. 'Assim' preserva o nexo com o fim do versículo anterior, onde o latim traz 'Ita uos'. A continuação truncada 'Oblationes mihi cum' pertence ao versículo seguinte e não foi incluída.
