  text: But you[a], speak to them, saying, ‘Thus says the Lord:’
translation:
  language: pt
  text: 'Mas você[a], fale com eles, dizendo: “Assim diz o Senhor:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quanto a você, fale com eles e diga:”.'
    reason: Registra a possibilidade de entender “uero” como uma transição enfática, em vez de estritamente adversativa.
lexical_decisions:
- source_word: Tu uero
  choice: Mas você
  rationale: “uero” funciona aqui como partícula adversativa ou enfática de transição, não como conclusão; “Mas você” preserva o contraste com o contexto anterior.
- source_word: loquere ad eos
  choice: fale com eles
  rationale: Equivalência natural e direta para a ordem dirigida ao interlocutor.
- source_word: dicens
  choice: dizendo
  rationale: Mantém o particípio latino e introduz formalmente a mensagem citada.
- source_word: haec dicit dominus
  choice: Assim diz o Senhor
  rationale: Reproduz a fórmula profética tradicional com linguagem clara e dignificada.
theological_decisions:
- issue: Fórmula de discurso divino
  choice: Manter “Assim diz o Senhor” neste versículo
  alternative: Transferir a fórmula para o versículo seguinte
  rationale: A fonte latina inclui explicitamente “haec dicit dominus” neste ponto; sua manutenção preserva a sintaxe e a divisão textual fornecidas.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. O tratamento “você” comunica com clareza o pronome explícito e enfático “Tu”; a fórmula “Assim diz o Senhor” conserva o registro profético solene.
