base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/003.yaml
  text: sons of Aaron[a], of the tribe of Levi, who were captives in the region of the Medes, in the reign of Artaxerxes king of the Persians.
translation:
  language: pt
  text: filhos de Arão, da tribo de Levi, que eram cativos[a] na região dos medos, durante o reinado de Artaxerxes, rei dos persas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim traz o singular: “que era cativo”.'
    reason: O antecedente Filii (“filhos”) está no plural, mas qui fuit captiuus aparece no singular. O texto principal regulariza a concordância conforme o sentido, sem ocultar a forma da fonte.
lexical_decisions:
- source_word: Filii Aaron
  choice: filhos de Arão
  rationale: Reproduz o plural latino Filii e conserva a forma bíblica corrente do nome Aaron em português.
- source_word: ex tribu Leui
  choice: da tribo de Levi
  rationale: Expressa de modo natural a origem ou pertença indicada por ex.
- source_word: captiuus
  choice: cativos
  rationale: O termo descreve a condição de cativeiro, não explicitamente o ato de serem capturados.
- source_word: in regione Medorum
  choice: na região dos medos
  rationale: Mantém a referência geográfica e étnica do latim sem modernizá-la indevidamente.
- source_word: in regno Artaxersis regis Persarum
  choice: durante o reinado de Artaxerxes, rei dos persas
  rationale: Em contexto cronológico, regnum designa o reinado; a aposição identifica Artaxerxes como rei dos persas.
theological_decisions: []
translation_notes:
  register: Português atual, claro e digno, com ordem próxima à fonte. Emprega-se “eram cativos” para refletir um estado contínuo e concordar com “filhos”; a irregularidade numérica do latim é preservada em nota.
