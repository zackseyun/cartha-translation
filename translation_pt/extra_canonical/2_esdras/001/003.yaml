source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Filii Aaron ex tribu Leui, qui fuit captiuus in regione Medorum, in regno Artaxersis regis Persarum.
