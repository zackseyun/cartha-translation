lexical_decisions:
- source_word: non uiderunt
  choice: Eles não viram
  rationale: Mantém a formulação sem objeto explícito do latim, sem acrescentar “profetas” ou outro complemento não presente no texto fornecido.
- source_word: memorabuntur
  choice: se lembrarão
  rationale: Expressa em português corrente o sentido de trazer à memória, conforme o uso tardio refletido no contexto, embora a forma latina seja incomum.
- source_word: antiquitatum eorum
  choice: da sua antiguidade
  rationale: Preserva a amplitude de antiquitas, que pode indicar a antiguidade, os tempos antigos ou aquilo que pertence ao passado, sem restringir o sentido no texto principal.
- source_word: Testor
  choice: Invoco como testemunhas
  rationale: Reproduz o início da fórmula de apelo a testemunhas; o plural antecipa os objetos coordenados que seguem no contexto, sem inseri-los neste versículo.
