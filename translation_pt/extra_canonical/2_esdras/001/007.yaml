source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nonne ego eos eduxi de terra Aegypti, de domo seruitutis? ipsi autem irritauerunt me et consilia mea spreuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/007.yaml
  text: Was it not I who brought them out of the land of Egypt, out of the house of slavery? But they provoked me and despised my counsels.
translation:
  language: pt
  text: Não fui eu que os tirei da terra do Egito, da casa da escravidão? Eles, porém, me provocaram e desprezaram os meus conselhos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eduxi
  choice: tirei
  rationale: Expressa de modo natural e direto o ato de fazer sair, preservando a referência ao êxodo.
- source_word: domo seruitutis
  choice: casa da escravidão
  rationale: Mantém a imagem tradicional e concreta do latim, em vez de reduzi-la a uma expressão abstrata.
- source_word: irritauerunt
  choice: provocaram
  rationale: No contexto, indica que o povo despertou a indignação divina; “provocaram” preserva o objeto implícito expresso pelo pronome “me”.
- source_word: consilia
  choice: conselhos
  rationale: Correspondência direta que pode abranger orientações, desígnios ou determinações, sem estreitar indevidamente o sentido.
- source_word: spreuerunt
  choice: desprezaram
  rationale: Preserva a ideia forte de tratar os conselhos divinos com desdém ou rejeição.
theological_decisions:
- issue: Agência divina no êxodo
  choice: Não fui eu que os tirei
  alternative: Não fui eu que os fiz sair
  rationale: A formulação mantém a ênfase retórica na ação pessoal de Deus e soa natural em português.
- issue: Sentido de consilia mea
  choice: meus conselhos
  alternative: meus desígnios
  rationale: “Conselhos” preserva a amplitude lexical e acompanha a evidência latina sem interpretar a expressão exclusivamente como decretos soberanos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem “Eles, porém” marca com clareza o contraste do latim ipsi autem sem tornar a frase excessivamente literal.
