source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis. uos autem mei obliti estis, dicit dominus. Haec dicit dominus omnipotens: coturnix uobis in signo fuit, castra uobis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/015.yaml
  text: 'But you have forgotten me[a], says the Lord. Thus says the Lord Almighty: Quail were a sign for you; camps were for you'
translation:
  language: pt
  text: 'Mas vocês se esqueceram de mim, diz o Senhor. Assim diz o Senhor Todo-Poderoso: A codorniz foi um sinal para vocês; o acampamento[a] foi para vocês.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “os acampamentos”.'
    reason: A forma latina 'castra' é plural, mas frequentemente funciona como plurale tantum com o sentido singular de “acampamento”.
lexical_decisions:
- source_word: mei obliti estis
  choice: vocês se esqueceram de mim
  rationale: Reproduz diretamente a acusação latina, em linguagem portuguesa natural e atual.
- source_word: dominus omnipotens
  choice: Senhor Todo-Poderoso
  rationale: É a forma tradicional, clara e semanticamente correspondente ao título latino.
- source_word: coturnix
  choice: a codorniz
  rationale: Mantém o singular do latim e a referência ao sinal associado à codorniz.
- source_word: in signo fuit
  choice: foi um sinal
  rationale: Expressa de modo idiomático a construção latina 'foi para vocês como sinal', sem acrescentar interpretação.
- source_word: castra
  choice: o acampamento
  rationale: Embora tenha forma plural, 'castra' é normalmente um plurale tantum latino que pode designar um único acampamento; o singular também se ajusta ao contexto do acampamento de Israel.
- source_word: uobis
  choice: para vocês
  rationale: Conserva a relação dativa sem introduzir ideias não expressas, como dádiva ou proteção.
theological_decisions:
- issue: Função do acampamento
  choice: foi para vocês
  alternative: dei a vocês um acampamento para proteção
  rationale: A versão escolhida não acrescenta um sujeito verbal, o ato de dar nem a finalidade de proteção, elementos ausentes do trecho latino fornecido.
- issue: Valor de 'castra'
  choice: o acampamento
  alternative: os acampamentos
  rationale: O singular representa o uso comum de 'castra' como plurale tantum, enquanto a nota preserva a possibilidade de leitura formalmente plural.
translation_notes:
  register: Português moderno, claro e digno, com formas de tratamento amplamente compreensíveis. A formulação deliberadamente concisa preserva a expressão pouco determinada do latim e evita importar a antiga expansão interpretativa “dei... para proteção”.
