  yaml_path: translation/extra_canonical/2_esdras/001/034.yaml
  text: And your sons will not produce offspring, because they neglected my commandment among you and did what is evil before me.
translation:
  language: pt
  text: E os filhos de vocês não gerarão descendência, porque negligenciaram o meu mandamento entre vocês e fizeram o que é mau diante de mim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creationem non facient
  choice: não gerarão descendência
  rationale: Expressa de modo natural a ideia de não produzir prole, sem recorrer ao sentido moderno mais amplo de “criação”.
- source_word: neglexerunt
  choice: negligenciaram
  rationale: Preserva o sentido de não dar a devida atenção ou obediência ao mandamento, sem intensificá-lo para “desprezaram”.
- source_word: uobiscum
  choice: entre vocês
  rationale: Neste contexto, o latim literalmente “com vocês” é entendido de forma mais natural como a presença ou vigência do mandamento no meio do povo.
- source_word: coram me
  choice: diante de mim
  rationale: Mantém a expressão relacional e judicial do latim em português bíblico corrente.
