  text: 'Haec dicit dominus omnipotens : nonne ego uos rogaui ut pater filios et ut mater filias et nutrix paruulos suos,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/028.yaml
  text: 'Thus says the Lord Almighty: Have I not entreated you[a], as a father his sons, and as a mother her daughters, and a nurse her little children,'
translation:
  language: pt
  text: 'Assim diz o Senhor Todo-Poderoso: Não supliquei a vocês, como um pai suplica aos filhos, como uma mãe às filhas e como uma ama de leite aos seus pequeninos,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rogaui
  choice: supliquei
  rationale: O perfeito de «rogo» pode expressar um pedido insistente ou uma súplica. «Supliquei» preserva a força emotiva da censura divina melhor do que o simples «pedi», sem transformar a frase em uma pergunta sobre informação.
- source_word: nutrix
  choice: ama
  rationale: No contexto da comparação familiar, «ama» designa a mulher que amamenta ou cuida de crianças pequenas e conserva a imagem pessoal do latim.
- source_word: paruulos suos
  choice: seus pequeninos
  rationale: Reproduz o caráter afetuoso e a pouca idade sugeridos por «parvulos», evitando limitar a expressão a filhos biológicos.
- source_word: dominus omnipotens
  choice: Senhor Todo-Poderoso
  rationale: Equivalente português tradicional, claro e direto para o título divino latino.
theological_decisions:
- issue: Imagens parentais aplicadas à maneira como Deus trata o povo
  choice: Preservar paralelamente as imagens de pai, mãe e ama
  alternative: Uniformizar as comparações sob uma única imagem parental
  rationale: O texto acumula deliberadamente três relações de cuidado; manter todas elas conserva sua amplitude retórica e teológica sem explicar além da fonte.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com «a vocês» para representar o plural latino «uos». Mantiveram-se as comparações concisas e a vírgula final, pois o versículo continua na unidade seguinte.
