review_pass:
  verdict: revise
  source_fidelity: 'O sentido central está bem preservado: «rogaui» comunica um apelo insistente, e as três comparações parentais/de cuidado são mantidas. Contudo, «nutrix» designa mais especificamente uma ama de leite, não apenas uma ama em sentido amplo. Também é mais natural em português explicitar o verbo na primeira comparação, deixando-o subentendido nas seguintes.'
  naturalness: «Não supliquei a vocês, como um pai aos filhos» é compreensível, mas a elipse depois de «pai» soa truncada no português atual. «Como um pai suplica aos filhos» mantém a concisão subsequente e torna a construção fluente.
  terminology: «Senhor Todo-Poderoso» é adequado para «dominus omnipotens». «Ama de leite» representa com maior precisão «nutrix»; «pequeninos» conserva bem o valor afetivo de «paruulos».
  issues:
  - severity: low
    issue: «Ama» é menos específico do que «nutrix».
    rationale: No latim, «nutrix» normalmente se refere à mulher que amamenta e cria uma criança; «ama de leite» transmite essa função sem reduzir a imagem a uma cuidadora doméstica genérica.
  - severity: low
    issue: A primeira comparação está excessivamente elíptica em português.
    rationale: O latim pode omitir o verbo após «ut pater», mas em português «como um pai aos filhos» não flui tão naturalmente. Explicitar «suplica» uma vez preserva o paralelismo sem acrescentar sentido.
  revised_text: 'Assim diz o Senhor Todo-Poderoso: Não supliquei a vocês, como um pai suplica aos filhos, como uma mãe às filhas e como uma ama de leite aos seus pequeninos,'
  revised_footnotes:
  - marker: a
    text: 'Ou: “Não pedi a vocês, como um pai pede aos filhos”.'
    reason: O verbo latino «rogo» pode significar simplesmente «pedir», embora neste lamento o contexto também sustente o sentido mais intenso de «suplicar».
  revision_rationale: A revisão conserva o apelo enfático de «rogaui», torna a primeira comparação idiomática em português e traduz «nutrix» de modo mais preciso como «ama de leite». A vírgula final é preservada porque a frase continua no versículo seguinte.
