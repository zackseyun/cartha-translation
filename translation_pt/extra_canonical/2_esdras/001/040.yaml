base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/040.yaml
  text: Nahum and Habakkuk[a], Zephaniah, Haggai, Zechariah, and Malachi[b], who is also called the angel of the Lord.”
translation:
  language: pt
  text: Naum e Habacuque, Sofonias, Ageu, Zacarias e Malaquias, que também é chamado de «anjo do Senhor»[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «mensageiro do Senhor». A expressão pode estar ligada a uma interpretação do nome Malaquias; contudo, o latim usa angelus, termo que normalmente significa «anjo» nesse contexto. Isso não exige que o profeta seja identificado com a figura distinta chamada «o anjo do Senhor» em outras passagens.
    reason: lexical_alternative
lexical_decisions:
- source_word: angelus domini
  choice: o anjo do Senhor
  rationale: No latim cristão antigo, angelus normalmente designa um anjo; esta tradução preserva a escolha lexical do texto em vez de reduzi-la à etimologia do nome Malaquias. A alternativa «mensageiro do Senhor» é registrada em nota.
- source_word: qui et ... uocatus est
  choice: que também é chamado
  rationale: Reproduz de modo natural a oração relativa singular e a ideia de uma designação adicional.
theological_decisions:
- issue: Identidade de Malaquias como «anjo do Senhor»
  choice: Manter literalmente que Malaquias é chamado «o anjo do Senhor».
  alternative: Entender a expressão apenas como explicação do nome Malaquias, «mensageiro do Senhor».
  rationale: A formulação latina usa angelus e atribui o título diretamente a Malaquias. A tradução não deve apagar a possível tradição angelológica nem afirmar além do texto que ele seja necessariamente a figura distinta conhecida em outras passagens como «o anjo do Senhor».
translation_notes:
  register: Português moderno, claro e digno, com as formas tradicionais e amplamente reconhecidas dos nomes proféticos. A enumeração e a referência singular a Malaquias seguem de perto o latim.
