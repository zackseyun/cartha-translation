  text: Reges multos propter eos subuerti, Pharaonem cum pueris suis et omnem exercitum eius percussi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/010.yaml
  text: For their sake I overthrew many kings; I struck Pharaoh with his servants and all his army.
translation:
  language: pt
  text: Por causa deles, derrubei muitos reis; feri o faraó, seus servos e todo o seu exército.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter eos
  choice: Por causa deles
  rationale: Expressa de modo natural a ideia de ação em favor deles no contexto, sem tornar a formulação mais específica do que o latim.
- source_word: subuerti
  choice: derrubei
  rationale: Preserva a imagem de depor ou arruinar reis e corresponde ao sentido forte do verbo latino.
- source_word: pueris suis
  choice: seus servos
  rationale: Embora puer possa significar criança, jovem ou servo, o contexto régio e militar favorece 'servos', em concordância com a camada inglesa auditada.
- source_word: percussi
  choice: feri
  rationale: Mantém a formulação direta e abrangente do latim, sem especificar morte ou destruição total além do que o verbo exige.
theological_decisions:
- issue: Agência divina no juízo contra governantes e exércitos
  choice: 'Mantida em primeira pessoa: ''derrubei'' e ''feri''.'
  alternative: Formulação passiva ou atenuada, como 'foram derrotados'.
  rationale: O texto latino atribui explicitamente as ações ao locutor divino; uma construção passiva apagaria essa ênfase.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe direta. O artigo em 'o faraó' segue o uso natural em português, e o ponto e vírgula preserva as duas ações paralelas do versículo.
