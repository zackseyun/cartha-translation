source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc usque murmuratis. Vbi sunt beneficia quae praestiti uobis? nonne in deserto cum esuriretis et sitiretis proclamastis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/017.yaml
  text: Until now you have kept murmuring. Where are the benefits that I bestowed on you? Did you not cry out in the wilderness when you were hungry and thirsty,
translation:
  language: pt
  text: Até agora vocês continuam murmurando. Onde estão os benefícios que concedi a vocês? Não foi no deserto, quando estavam com fome e com sede, que vocês clamaram,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc usque
  choice: Até agora
  rationale: Expressa naturalmente o limite temporal contínuo do latim.
- source_word: murmuratis
  choice: vocês continuam murmurando
  rationale: Preserva o sentido de que a murmuração se estende até o presente, em linguagem bíblica clara e corrente.
- source_word: beneficia
  choice: benefícios
  rationale: Mantém a amplitude do termo latino, que pode designar favores, atos de bondade ou benefícios concedidos.
- source_word: praestiti
  choice: concedi
  rationale: Comunica a ideia de proporcionar ou outorgar benefícios, sem a solenidade pouco natural de 'outorguei'.
- source_word: proclamastis
  choice: vocês clamaram
  rationale: No contexto de fome e sede no deserto, 'clamaram' representa bem um grito ou apelo em voz alta.
theological_decisions:
- issue: Destinatário implícito do clamor
  choice: Não acrescentar 'a mim'
  alternative: vocês clamaram a mim
  rationale: Embora o contexto possa sugerir que o clamor se dirige a Deus, o latim não explicita o complemento; a tradução preserva essa ausência.
- issue: Valor interrogativo de nonne
  choice: Não foi ... que vocês clamaram?
  alternative: Vocês não clamaram?
  rationale: A construção escolhida preserva a expectativa de resposta afirmativa marcada por nonne e mantém em foco as circunstâncias no deserto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas brasileiras naturais. O plural 'vocês' evita regionalismo excessivo. A vírgula final foi mantida porque o versículo termina em uma oração que prossegue no contexto seguinte.
