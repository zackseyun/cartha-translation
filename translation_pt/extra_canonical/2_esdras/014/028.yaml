  text: grinati sunt patres nostri ab initio in Aegypto, et liberati sunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/028.yaml
  text: From the beginning[a], our fathers sojourned in Egypt, and they were delivered.
translation:
  language: pt
  text: Desde o princípio[a], nossos pais viveram como estrangeiros no Egito e foram libertados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nossos pais viveram desde o princípio como estrangeiros no Egito”.'
    reason: O lugar de ab initio permite alguma ambiguidade quanto ao seu vínculo sintático.
lexical_decisions:
- source_word: grinati sunt
  choice: viveram como estrangeiros
  rationale: O verbo latino raro, entendido no contexto como permanência em condição de estrangeiros ou peregrinos, pede uma expressão portuguesa clara sem perder essa condição social.
- source_word: patres nostri
  choice: nossos pais
  rationale: Preserva a expressão ancestral tradicional e seu vínculo coletivo com as gerações de Israel.
- source_word: ab initio
  choice: desde o princípio
  rationale: Reproduz de perto o valor temporal do latim, embora sua ligação sintática admita mais de uma leitura.
- source_word: liberati sunt
  choice: foram libertados
  rationale: Mantém a voz passiva e não acrescenta agente nem complemento ausente no texto latino.
theological_decisions:
- issue: Agente da libertação não expresso
  choice: foram libertados
  alternative: Deus os libertou
  rationale: A tradução conserva a passiva do texto e evita explicitar um agente que o versículo não nomeia.
- issue: Ligação de ab initio
  choice: Desde o princípio, nossos pais viveram como estrangeiros no Egito
  alternative: Nossos pais viveram desde o princípio como estrangeiros no Egito
  rationale: A leitura principal toma a locução como enquadramento temporal da afirmação; a nota preserva a possibilidade de ligá-la mais diretamente à permanência no Egito.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil. “Viveram como estrangeiros” comunica com mais clareza do que o pouco corrente “peregrinaram” o provável sentido do verbo latino raro.
