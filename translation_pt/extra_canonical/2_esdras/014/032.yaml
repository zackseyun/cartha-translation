  text: pois ele é juiz, tirou de vocês, no tempo devido, o que havia dado. E
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex cum sit
  choice: pois, sendo juiz
  rationale: Preserva o valor causal de cum com o subjuntivo sit, sem acrescentar “justo”, adjetivo ausente do trecho latino fornecido.
- source_word: abstulit a uobis
  choice: ele tirou de vocês
  rationale: Expressa diretamente a ação passada de retirar algo dos destinatários, em português corrente e amplo.
- source_word: in tempore
  choice: no tempo devido
  rationale: Transmite o sentido temporal contextual da expressão sem tornar a formulação excessivamente literal.
- source_word: quod donauerat
  choice: o que havia dado
  rationale: O mais-que-perfeito composto preserva que a dádiva antecedeu sua retirada; “dado” é natural e não restringe indevidamente o sentido de donaverat.
- source_word: Et
  choice: E
  rationale: Mantém a conjunção final, embora a frase continue no versículo seguinte.
theological_decisions:
- issue: Qualificação do juiz
  choice: juiz
  alternative: juiz justo
  rationale: O texto latino deste segmento contém apenas iudex; acrescentar “justo” importaria uma palavra não presente na evidência fornecida.
- issue: Relação entre a condição de juiz e a retirada
  choice: 'relação causal: “pois, sendo juiz”'
  alternative: relação meramente temporal ou circunstancial
  rationale: A construção cum sit, com subjuntivo, sustenta naturalmente a leitura causal, preservada sem ampliar sua implicação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A conjunção final “E” foi preservada para refletir a continuidade sintática do texto-fonte. A antiga nota inglesa sobre “agora vocês estão aqui...” não foi mantida, pois registra uma tradução anterior desalinhada com este trecho latino, não uma variante legítima desta cláusula.
