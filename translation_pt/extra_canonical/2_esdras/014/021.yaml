  rationale: Reproduz diretamente o perfeito passivo latino e o acontecimento concreto descrito.
- source_word: propter quod
  choice: por isso
  rationale: Expressa de modo natural em português a relação causal ou consecutiva do latim.
- source_word: quae a te
  choice: as coisas que fizeste
  rationale: Segue a compreensão refletida pela camada inglesa auditada; o latim transmitido é elíptico, literalmente 'as coisas por/de ti', e requer complemento verbal em português.
theological_decisions:
- issue: Sentido da expressão elíptica «quae a te»
  choice: as coisas que fizeste
  alternative: as coisas que vêm de ti
  rationale: O texto latino fornecido termina numa expressão elíptica. A redação escolhida acompanha a leitura contextual registrada na camada inglesa, mas evita ampliar o conteúdo além da ação atribuída a Deus.
translation_notes:
  register: Português moderno, claro e digno, com construção causal fluente. «Lei» recebe inicial maiúscula por designar a Lei divina específica.
