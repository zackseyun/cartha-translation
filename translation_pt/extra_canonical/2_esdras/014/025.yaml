  yaml_path: translation/extra_canonical/2_esdras/014/025.yaml
  text: these five, because they are ready to write quickly. And you shall come here, and I will kindle in your heart a lamp of understanding that will not be extinguished until the things that you begin to write are finished.
translation:
  language: pt
  text: esses cinco, pois estão preparados para escrever depressa. E você virá aqui, e eu acenderei em seu coração uma lâmpada de entendimento, que não se apagará até que se concluam as coisas que você começará a escrever.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: parati sunt ad scribendum uelociter
  choice: estão preparados para escrever depressa
  rationale: Reproduz de modo natural tanto a prontidão dos cinco como a rapidez da escrita, sem acrescentar a ideia mais específica de habilidade.
- source_word: lucernam intellectus
  choice: uma lâmpada de entendimento
  rationale: Preserva a metáfora concreta e a relação genitiva do latim; “entendimento” é claro e digno em português moderno.
- source_word: quoadusque finiantur quae incipies scribere
  choice: até que termine aquilo que você começar a escrever
  rationale: Expressa com naturalidade a duração indicada por “quoadusque” e conserva a referência ampla ao conteúdo que será escrito.
theological_decisions:
- issue: Natureza da iluminação concedida ao escriba
  choice: lâmpada de entendimento
  alternative: lâmpada da inteligência
  rationale: A formulação conserva a imagem do texto sem definir além dele se a iluminação é intelectual, espiritual ou profética.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “você” evita a rigidez de “tu” em grande parte do Brasil, enquanto o futuro verbal preserva o tom solene da promessa.
