  text: and hurry to depart from these times[a]; for the things you have now seen
translation:
  language: pt
  text: e apresse-se a deixar estes tempos; pois as coisas que você viu agora
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festina
  choice: apresse-se
  rationale: Reproduz de modo natural o imperativo latino, mantendo seu sentido de urgência.
- source_word: transmigrare
  choice: deixar
  rationale: Neste contexto, expressa com clareza a ideia de partir ou passar para fora da época presente, sem impor uma descrição mais específica do modo dessa partida.
- source_word: a temporibus his
  choice: estes tempos
  rationale: Mantém o plural e a referência demonstrativa do latim.
- source_word: Quae
  choice: as coisas que
  rationale: Preserva o relativo neutro plural e deixa a oração incompleta como no recorte latino deste versículo.
- source_word: uidisti nunc
  choice: você viu agora
  rationale: Tradução direta e corrente do perfeito latino com o advérbio temporal.
theological_decisions:
- issue: Natureza da partida ordenada
  choice: deixar estes tempos
  alternative: partir destes tempos / migrar destes tempos
  rationale: O latim não especifica aqui morte, arrebatamento ou outro mecanismo; a formulação escolhida preserva essa abertura sem soar artificial.
- issue: Complementação da oração final
  choice: não acrescentar “males” nem “acontecer”
  alternative: pois os males que você viu acontecer agora
  rationale: “mala” e “contigisse” pertencem ao versículo seguinte na divisão fornecida; acrescentá-los aqui ultrapassaria a evidência textual de 14:15.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O ponto e vírgula conserva a ligação entre as orações. A terminação sintaticamente aberta é intencional, pois a frase continua no versículo seguinte.
