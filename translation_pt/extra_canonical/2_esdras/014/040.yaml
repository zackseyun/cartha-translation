  text: 'eius ut ignis similis. Et accepi et bibi, et in eo cum bibissem cor meum eructuabat intellectum et in pectus meum increscebat sapientia, nam spiritus meus conseruabat memoriam : Et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/040.yaml
  text: And I took it and drank[a], and when I had drunk it, my heart poured forth understanding, and wisdom increased in my breast, for my spirit retained memory.
translation:
  language: pt
  text: Então eu o tomei e bebi. Depois que o bebi, meu coração fazia jorrar entendimento, e a sabedoria crescia em meu peito, pois meu espírito conservava a memória.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: retinha a memória.'
    reason: Registra uma tradução igualmente possível de conseruabat memoriam; “retinha” enfatiza a manutenção do conteúdo ou da faculdade da memória.
lexical_decisions:
- source_word: accepi
  choice: tomei
  rationale: No contexto, indica receber ou tomar o conteúdo oferecido; “tomei” liga-se naturalmente a “e bebi” sem especificar além do latim.
- source_word: cor meum eructuabat intellectum
  choice: meu coração fazia jorrar entendimento
  rationale: Preserva a imagem enfática de eructuabat (“fazia brotar/jorrar”) sem recorrer ao sentido fisiológico mais comum de “arrotar”, inadequado ao registro em português.
- source_word: in pectus meum increscebat sapientia
  choice: a sabedoria crescia em meu peito
  rationale: Mantém a imagem corporal e o aspecto progressivo do imperfeito latino increscebat.
- source_word: conseruabat memoriam
  choice: conservava a memória
  rationale: Traduz diretamente a ideia de preservar ou reter a memória, faculdade essencial para a posterior ditagem, mantendo o objeto explícito do verbo.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imagens do latim preservadas. O marcador foi colocado junto de “memória”, expressão à qual a variante realmente se refere; a posição após “drank” na camada inglesa parece ser um deslocamento editorial.
