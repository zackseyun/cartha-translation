  text: Therefore now set your house in order[a], and reprove your people, and comfort their humble ones, and renounce the corruptible life now.
translation:
  language: pt
  text: Agora, portanto, põe em ordem a tua casa, repreende o teu povo, consola os humildes dentre eles e renuncia já à vida perecível.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vida corrompida”.'
    reason: O latim corruptae pode indicar tanto aquilo que está sujeito à deterioração e à morte quanto aquilo que foi corrompido.
lexical_decisions:
- source_word: dispone domum tuam
  choice: põe em ordem a tua casa
  rationale: Expressão portuguesa natural que conserva a imagem doméstica e o sentido de preparar ou organizar os próprios assuntos.
- source_word: corripe populum tuum
  choice: repreende o teu povo
  rationale: “Repreender” preserva a força corretiva de corripere sem acrescentar uma forma específica de disciplina.
- source_word: humiles eorum
  choice: os humildes dentre eles
  rationale: Mantém o sentido básico de humiles e explicita de modo natural que essas pessoas pertencem ao povo mencionado, sem decidir se são humildes de espírito ou socialmente abatidas.
- source_word: renuntia iam corruptae vitae
  choice: renuncia já à vida perecível
  rationale: O contexto imediato favorece a mortalidade e a transitoriedade da existência; “perecível” comunica isso com mais clareza que “corrupta”, enquanto a nota preserva a possível leitura moral ou de decadência.
theological_decisions:
- issue: Sentido de corruptae vitae
  choice: vida perecível
  alternative: vida corrompida
  rationale: A referência contextual à condição mortal favorece a ideia de uma vida sujeita à deterioração e à morte, mas o latim também pode sugerir corrupção; a ambiguidade legítima é preservada em nota.
translation_notes:
  register: Português moderno, digno e direto, com formas de segunda pessoa do singular adequadas à fala dirigida a Esdras. A coordenação verbal reproduz a sequência enfática de ordens do latim.
