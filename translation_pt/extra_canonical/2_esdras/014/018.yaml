source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et respondi et dixi coram te, domine, Ecce enim ego abibo,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/018.yaml
  text: Then I answered and said before you[a], Lord, "Behold, I will go,"
translation:
  language: pt
  text: 'Então respondi e disse diante de ti, Senhor[a]: “Pois eis que eu partirei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: Então respondi e disse diante de ti: “Senhor, pois eis que eu partirei.”'
    reason: A pontuação do texto latino permite ligar o vocativo “Senhor” à oração introdutória ou à fala que vem em seguida.
lexical_decisions:
- source_word: coram te
  choice: diante de ti
  rationale: Reproduz diretamente a ideia de falar na presença de alguém, mantendo o tratamento singular do latim.
- source_word: Ecce enim
  choice: Pois eis que
  rationale: Preserva tanto a partícula apresentativa ecce (“eis que”) quanto o valor explicativo ou causal de enim (“pois”), apesar da construção deliberadamente solene.
- source_word: abibo
  choice: partirei
  rationale: Expressa o futuro do verbo latino abire, isto é, ir embora ou partir, sem acrescentar destino ou finalidade.
theological_decisions:
- issue: Relação sintática do vocativo domine com a fala introdutória ou com a citação seguinte
  choice: '“Senhor” é tratado como vocativo da oração introdutória: “disse diante de ti, Senhor”'
  alternative: 'Iniciar a fala citada com o vocativo: “Senhor, pois eis que partirei”'
  rationale: A pontuação latina favorece a ligação de domine ao que precede, mas a ausência de sinais de citação nos manuscritos permite a outra segmentação; a alternativa é registrada em nota sem resolver indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com uso de “ti” adequado à oração dirigida a Deus. A formulação conserva a repetição semítica “respondi e disse” presente no latim e mantém a força de “eis que”.
