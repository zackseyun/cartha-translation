source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu enim reciperis ab hominibus, et conuerteris residuum cum filio meo et cum similibus tuis usquequo finiantur tempora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/009.yaml
  text: For you will be taken up from among men[a], and you will remain with my son and with those like you until the times are finished.
translation:
  language: pt
  text: Pois você será tirado do meio dos seres humanos e permanecerá[a] com meu filho e com os que são semelhantes a você, até que os tempos cheguem ao fim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «passará o restante do tempo».'
    reason: A expressão latina «conuerteris residuum» é incomum e pode enfatizar mais diretamente o período restante, embora o limite temporal já apareça no fim do versículo.
lexical_decisions:
- source_word: reciperis ab hominibus
  choice: será tirado do meio dos seres humanos
  rationale: Expressa a ideia de ser retirado da convivência humana sem especificar além do latim o modo dessa retirada.
- source_word: conuerteris residuum
  choice: permanecerá
  rationale: No contexto, indica que Esdras passará o período restante com o filho de Deus; «permanecerá» comunica essa duração naturalmente, enquanto a oração final explicita seu limite.
- source_word: cum similibus tuis
  choice: com os que são semelhantes a você
  rationale: Preserva a formulação ampla do latim, sem identificar de modo especulativo quem são esses semelhantes.
- source_word: usquequo finiantur tempora
  choice: até que os tempos cheguem ao fim
  rationale: Mantém o plural «tempos» e o sentido escatológico aberto da expressão latina.
theological_decisions:
- issue: Natureza da retirada de Esdras do meio da humanidade
  choice: será tirado do meio dos seres humanos
  alternative: será elevado dentre os seres humanos
  rationale: A tradução escolhida não define se se trata de ascensão, trasladação ou outra forma de retirada, preservando a relativa indeterminação de «reciperis».
- issue: Identidade dos semelhantes a Esdras
  choice: os que são semelhantes a você
  alternative: os seus semelhantes
  rationale: A formulação explícita permanece acessível e não restringe o grupo a profetas, justos ou outras categorias teológicas não nomeadas no texto.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por «você» para ampla legibilidade brasileira. A redação conserva a ambiguidade sobre a forma da retirada de Esdras e evita identificar os que lhe são semelhantes.
