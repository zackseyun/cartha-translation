  text: or the things that are about to happen[a]. For if I have found favor before you, send the Holy Spirit into me, and I will write everything that has happened in the world from the beginning, the things that were written in your law, so that men may be able to find the path[c][b], and that those who wish
translation:
  language: pt
  text: ou as coisas que começarão a acontecer. Pois, se encontrei favor diante de ti, infunde em mim o Espírito Santo, e escreverei tudo o que aconteceu no mundo[a] desde o princípio, as coisas que estavam escritas na tua lei, para que as pessoas possam encontrar o caminho e para que aqueles que quiserem
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na era”.'
    reason: O latim saeculum pode designar tanto o mundo e seu curso histórico quanto uma era; neste contexto, «no mundo» é favorecido por «desde o princípio».
lexical_decisions:
- source_word: incipient operari
  choice: começarão a acontecer
  rationale: A expressão latina indica acontecimentos que começarão a ocorrer; esta formulação preserva o aspecto incoativo e soa natural em português.
- source_word: inmitte in me
  choice: envia para dentro de mim
  rationale: Mantém a direção explícita do latim, em vez de reduzir a expressão a um simples 'envia-me'.
- source_word: saeculo
  choice: mundo
  rationale: Em 'in saeculo ab initio', o contexto aponta para o âmbito da história do mundo desde o princípio, embora 'era' também seja lexicalmente possível.
- source_word: homines
  choice: as pessoas
  rationale: Representa o sentido humano genérico do latim em português atual, sem restringi-lo ao sexo masculino.
- source_word: semitam
  choice: o caminho
  rationale: Equivalente idiomático e digno para a imagem de uma senda ou vereda a ser encontrada.
theological_decisions:
- issue: Identificação e capitalização de spiritum sanctum
  choice: o Espírito Santo
  alternative: o espírito santo
  rationale: O pedido apresenta o Espírito Santo como agente divino enviado para capacitar Esdras; a capitalização segue o uso português corrente sem acrescentar uma definição doutrinária não expressa no texto.
- issue: Sentido temporal ou cósmico de saeculum
  choice: no mundo
  alternative: na era
  rationale: A qualificação 'desde o princípio' favorece a totalidade da história do mundo; a alternativa temporal é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e alcance internacional. O fragmento inicial e a oração final permanecem incompletos porque o versículo continua sintaticamente o contexto anterior e o versículo seguinte.
