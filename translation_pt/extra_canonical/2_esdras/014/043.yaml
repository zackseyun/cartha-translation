  yaml_path: translation/extra_canonical/2_esdras/014/043.yaml
  text: They wrote by day, but at night they ate bread. As for me, I spoke by day, and at night I was not silent.
translation:
  language: pt
  text: Durante quarenta dias, eles escreviam de dia e, à noite, comiam pão. Quanto a mim, eu falava de dia e, à noite, não me calava.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: XL diebus
  choice: Durante quarenta dias
  rationale: Expressa de modo natural em português a duração indicada pelo ablativo latino.
- source_word: scribebant
  choice: escreviam
  rationale: O imperfeito preserva a ação habitual ou contínua ao longo dos quarenta dias.
- source_word: manducabant panem
  choice: comiam pão
  rationale: Tradução direta e idiomática, sem especificar uma refeição além do que diz o latim.
- source_word: loquebar
  choice: eu falava
  rationale: Mantém o contraste explícito entre a atividade dos escribas e a do narrador.
- source_word: non [tacebam]
  choice: não me calava
  rationale: O texto latino termina com elipse após «non»; o verbo subentendido é recuperado pelo contexto e pela tradição textual, resultando numa formulação natural em português.
theological_decisions:
- issue: Intensidade e continuidade da revelação ditada
  choice: «eu falava de dia e, à noite, não me calava»
  alternative: «eu ditava de dia e não ficava em silêncio à noite»
  rationale: Preserva o verbo latino geral «loquebar» e a tensão retórica do contraste dia/noite, sem importar a ideia mais específica de ditado.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. Conserva o paralelismo entre dia e noite e a mudança enfática para «Quanto a mim».
