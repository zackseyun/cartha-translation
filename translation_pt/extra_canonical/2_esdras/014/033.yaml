  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
translation:
  language: pt
  text: Agora vocês estão aqui, e seus irmãos estão dentro de vocês[a]. Portanto, se governarem a mente e instruírem o coração,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mais para o interior”. A expressão latina é incomum e pode ter sentido espacial.'
    reason: Preservar a ambiguidade lexical de introrsum uestrum sem abandonar a tradução mais direta no texto principal.
lexical_decisions:
- source_word: introrsum uestrum
  choice: dentro de vocês
  rationale: Reproduz de modo direto a expressão latina incomum, sem substituir no texto principal a ideia de interioridade por uma localização geográfica interpretativa.
- source_word: imperaueritis sensui uestro
  choice: governarem a mente
  rationale: Expressa o exercício de autoridade indicado por imperare de maneira natural em português; “mente” comunica sensus neste contexto de disciplina interior.
- source_word: erudieritis cor uestrum
  choice: instruírem o coração
  rationale: Mantém a imagem antropológica do latim e o paralelismo entre mente e coração.
theological_decisions:
- issue: Relação entre os irmãos e os destinatários em introrsum uestrum
  choice: estão dentro de vocês
  alternative: estão mais para o interior
  rationale: A formulação latina favorece literalmente “dentro de vocês”, mas é incomum e pode admitir uma leitura espacial; a ambiguidade é preservada em nota, sem impor uma interpretação teológica.
- issue: Limite do versículo e oração condicional incompleta
  choice: Encerrar com vírgula após “coração”
  alternative: Acrescentar a consequência preservada no versículo seguinte
  rationale: O texto latino fornecido termina na prótase condicional; completar a frase importaria material do versículo 34 e alteraria o limite textual.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais naturais. Conserva-se a estrutura condicional suspensa do texto-fonte, pois sua consequência pertence ao versículo seguinte.
