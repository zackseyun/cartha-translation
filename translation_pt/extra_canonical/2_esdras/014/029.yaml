  text: And they received the law of life, which they did not keep, which you also transgressed after them.
translation:
  language: pt
  text: E eles receberam a lei da vida, que não guardaram e que vocês também transgrediram depois deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: legem uitae
  choice: a lei da vida
  rationale: Reproduz diretamente a construção latina e preserva seu sentido teológico sem explicá-lo além do texto.
- source_word: custodierunt
  choice: guardaram
  rationale: “Guardar” é natural no registro bíblico e expressa observar e conservar fielmente a lei.
- source_word: transgressed
  choice: transgrediste
  rationale: Mantém a referência ao destinatário singular e o sentido de violar a lei, conforme a continuação atestada na camada de consulta auditada.
- source_word: after them
  choice: depois deles
  rationale: Preserva a relação temporal e a possível ideia de seguir o exemplo dos antepassados, sem tornar essa implicação explícita.
theological_decisions:
- issue: Relação entre “lei” e “vida”
  choice: lei da vida
  alternative: lei que dá vida
  rationale: A formulação nominal preserva a concisão e a ambiguidade do latim “legem uitae”, sem decidir se a vida é origem, conteúdo ou efeito da lei.
translation_notes:
  register: Português atual, digno e de leitura ampla, com leve cadência bíblica. A repetição de “que” conserva as duas orações relativas coordenadas sem acrescentar uma conjunção ausente na forma revisada.
