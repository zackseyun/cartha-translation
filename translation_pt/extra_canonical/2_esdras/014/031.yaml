  text: the inheritance in the land of Zion, and you and your fathers committed iniquity and did not keep the ways that the Most High commanded you; the Righteous One
translation:
  language: pt
  text: a herança na terra de Sião, e vocês e seus antepassados praticaram a iniquidade e não guardaram os caminhos que o Altíssimo lhes ordenou; o Justo
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sortem
  choice: a herança
  rationale: No fragmento, o acusativo latino designa a porção recebida na terra de Sião. “Herança” expressa naturalmente essa ideia no contexto, embora o termo também possa significar “quinhão” ou “sorte”.
- source_word: patres uestri
  choice: seus antepassados
  rationale: “Antepassados” comunica o sentido coletivo de patres neste contexto histórico com mais clareza do que o literal “pais”.
- source_word: iniquitatem fecistis
  choice: praticaram a iniquidade
  rationale: Mantém a formulação moral e jurídica do latim, em português corrente e digno.
- source_word: non seruastis uias
  choice: não guardaram os caminhos
  rationale: Preserva a metáfora bíblica dos “caminhos” e o sentido de observar ou obedecer.
- source_word: Altissimus
  choice: o Altíssimo
  rationale: Equivalente tradicional, claro e não denominacional do título divino latino.
- source_word: Iustus
  choice: o Justo
  rationale: Mantém o adjetivo substantivado e a forma fragmentária do texto-fonte, sem acrescentar um substantivo ou verbo ausente.
theological_decisions:
- issue: Forma isolada de “Iustus” no fim do fragmento
  choice: o Justo
  alternative: o justo
  rationale: A inicial maiúscula do texto e o contexto favorecem um título divino substantivado. A tradução não completa a oração nem especifica uma função, preservando a tensão e a incompletude do fragmento.
- issue: Responsabilidade intergeracional
  choice: “vocês e seus antepassados praticaram a iniquidade”
  alternative: “vocês e seus pais cometeram injustiça”
  rationale: A redação conserva a atribuição conjunta de culpa presente no latim, sem explicá-la ou atenuá-la teologicamente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. A redação preserva deliberadamente tanto o início quanto o encerramento fragmentários do trecho latino fornecido.
