  text: and behold[a], a voice called me, saying, “Ezra, open your mouth and drink what I am giving you.” And I opened my mouth, and behold, a full cup
translation:
  language: pt
  text: 'E eis que[a] uma voz me chamou, dizendo: “Esdras, abra a boca e beba o que estou lhe dando.” E abri a boca, e eis um cálice cheio'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E aconteceu no dia seguinte, e eis que uma voz me chamou, dizendo: ‘Esdras, abra a boca e beba o que lhe dou para beber.’ E abri a boca, e eis que um cálice cheio era-me estendido.”'
    reason: Registra a versão anterior, que incluía expressões hoje atribuídas aos trechos adjacentes.
lexical_decisions:
- source_word: ecce
  choice: e eis que / e eis
  rationale: Preserva o valor apresentativo e enfático do latim, com formulação bíblica ainda clara em português atual.
- source_word: potiono
  choice: estou lhe dando
  rationale: Expressa com naturalidade a ideia de dar algo para beber, evitando a repetição pouco idiomática de “beba o que lhe dou para beber”.
- source_word: calix plenus
  choice: um cálice cheio
  rationale: Tradução direta que conserva a imagem e também a frase incompleta no limite deste versículo.
theological_decisions:
- issue: Frase final sem verbo e delimitação do versículo
  choice: Manter “e eis um cálice cheio” sem completar a ação
  alternative: “e eis que me estendiam um cálice cheio”
  rationale: O texto latino fornecido termina em “et ecce calix plenus”; o verbo e o complemento da alternativa pertencem ao trecho seguinte e não devem ser importados para este versículo.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Mantém-se “eis” por seu valor apresentativo, sem completar artificialmente a frase interrompida no fim do versículo.
