  footnotes:
  - marker: a
    text: 'Formulação anterior: “E, quando tiver terminado, tornará públicas algumas coisas e entregará outras em segredo aos sábios. Amanhã, a esta hora...”'
    reason: Registra a formulação anterior para fins de auditoria. A tradução principal é preferível porque o latim não traz conjunção antes de cum e inclui enim antes da indicação temporal.
lexical_decisions:
- source_word: quaedam ... quaedam
  choice: algumas coisas ... outras
  rationale: Mantém a referência neutra e não especificada do latim, sem antecipar se se trata exatamente de livros, escritos ou conteúdos.
- source_word: absconse trades
  choice: entregará ... em segredo
  rationale: Expressa de modo natural tanto o ato de transmitir quanto o caráter reservado da entrega.
- source_word: enim
  choice: pois
  rationale: Preserva a ligação explicativa explícita entre a ordem anterior e o início da escrita no dia seguinte.
- source_word: profectus sum
  choice: parti
  rationale: Reproduz o sentido de sair ou pôr-se a caminho, em registro narrativo digno e corrente.
- source_word: congregaui omnem
  choice: reuni toda a...
  rationale: Mantém a frase incompleta do testemunho fornecido e respeita o singular acusativo omnem, sem inventar o substantivo ausente.
theological_decisions:
- issue: Identidade das coisas que seriam divulgadas ou reservadas
  choice: algumas coisas ... outras
  alternative: alguns livros ... outros
  rationale: O latim usa pronomes neutros e não nomeia aqui o referente; a tradução conserva essa abertura em vez de identificar explicitamente os itens como livros.
translation_notes:
  register: Português moderno, claro e digno, com futuro do presente no discurso direto. A elipse após “terminado” acompanha o latim. As reticências finais assinalam que o texto-fonte fornecido termina no meio da oração.
