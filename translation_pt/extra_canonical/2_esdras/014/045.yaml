lexical_decisions:
- source_word: conpleti essent XL dies
  choice: ao se completarem os quarenta dias
  rationale: Reproduz com naturalidade a oração temporal latina e mantém a ideia de que o período chegou ao fim.
- source_word: altissimus
  choice: o Altíssimo
  rationale: Equivalente tradicional, claro e digno do título divino latino.
- source_word: priora quae scripsisti
  choice: os escritos anteriores que você fez
  rationale: Entende priora como aquilo que foi escrito antes, evitando restringi-lo indevidamente a 'os primeiros escritos'.
- source_word: in palam pone
  choice: torne-os públicos
  rationale: Expressa de modo corrente a ordem de colocar os escritos abertamente à disposição do público.
- source_word: et
  choice: e
  rationale: Mantém a conjunção final e a frase aberta, pois a continuação pertence ao versículo seguinte na delimitação da fonte.
