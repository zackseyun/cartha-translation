  text: Algo me era oferecido; estava cheio de algo semelhante à água[a], mas sua cor era como fogo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “estava cheio como de água”. O latim é conciso; «como» pode indicar comparação ou conteúdo semelhante a água.'
