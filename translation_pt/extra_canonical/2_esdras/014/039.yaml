lexical_decisions:
- source_word: porrigebatur mihi
  choice: Ele me foi oferecido
  rationale: Expressa de modo natural a ação passiva de porrigere com o destinatário mihi. O pronome retoma o objeto mencionado no contexto, sem identificá-lo novamente no versículo.
- source_word: hoc erat plenum sicut aqua
  choice: estava cheio de algo semelhante à água
  rationale: A formulação portuguesa explicita de maneira mínima o conteúdo subentendido após 'cheio' e conserva a comparação introduzida por sicut.
- source_word: color autem
  choice: mas sua cor
  rationale: O contraste de autem é adequadamente expresso por 'mas'; o possessivo recupera o referente de hoc.
