id: 2ES.14.20
reference: 2 Esdras 14:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem iterum nati fuerint, quis commonebit ? Positum est enim saeculum in tenebris, et qui inhabitant in eo sine lumine ;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/020.yaml
  text: But those who will be born afterward—who will warn them? For the age lies in darkness[a], and those who dwell in it are without light.
translation:
  language: pt
  text: Mas os que nascerem depois — quem os advertirá? Pois esta era jaz nas trevas[a], e os que nela habitam estão sem luz.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi posta nas trevas”.'
    reason: Preserva a possibilidade de entender positum est como perfeito passivo com sentido de ação, embora o uso locativo favoreça uma leitura estativa.
lexical_decisions:
- source_word: iterum nati fuerint
  choice: nascerem depois
  rationale: No contexto, a expressão aponta para as gerações que nascerão posteriormente; esta formulação comunica com naturalidade a referência temporal futura.
- source_word: commonebit
  choice: advertirá
  rationale: Expressa a ideia de alertar ou admoestar alguém diante de uma situação perigosa, sem restringir o verbo a mera lembrança.
- source_word: saeculum
  choice: era
  rationale: Aqui designa o tempo ou a ordem presente, e não simplesmente um período de cem anos nem, de modo inequívoco, o mundo físico.
- source_word: positum est ... in tenebris
  choice: jaz nas trevas
  rationale: 'O perfeito passivo com complemento locativo tem sentido naturalmente estativo: a era se encontra ou jaz nas trevas. A escolha preserva a imagem e evita impor uma ênfase causal.'
- source_word: sine lumine
  choice: sem luz
  rationale: Tradução direta e idiomática que conserva o contraste entre trevas e luz.
theological_decisions:
- issue: Possível agência implícita em positum est
  choice: jaz nas trevas
  alternative: foi posta nas trevas
  rationale: A formulação principal descreve o estado presente sem afirmar quem teria colocado a era nas trevas; a alternativa mais literalmente passiva é preservada em nota.
translation_notes:
  register: Português atual, claro e digno, com ampla legibilidade brasileira. O travessão ressalta a pergunta sem alterar sua relação sintática; “jaz” mantém a força imagética do latim em registro bíblico ainda compreensível.
