lexical_decisions:
- source_word: demonstraui
  choice: mostrei
  rationale: Tradução direta e natural do perfeito latino, mantendo Deus como sujeito e o destinatário no singular.
- source_word: interpretationes
  choice: interpretações
  rationale: Preserva o sentido amplo do termo latino sem especificar além da fonte.
- source_word: in corde tuo repone ea
  choice: guarde tudo isso no coração
  rationale: Mantém a imagem bíblica do coração como lugar de memória e reflexão; “tudo isso” retoma naturalmente os três elementos antepostos.
