lexical_decisions:
- source_word: sicut praecepisti mihi
  choice: como me ordenaste
  rationale: Reproduz de modo natural e fiel a comparação e a ordem dirigida ao narrador.
- source_word: corripiam
  choice: repreenderei
  rationale: O verbo latino pode indicar repreender, censurar ou corrigir; “repreenderei” preserva aqui a ideia de confrontar o povo por sua conduta.
- source_word: praesentem populum
  choice: o povo que vive agora
  rationale: O contraste com os que nascerão depois, no versículo seguinte, mostra que praesentem tem sentido temporal, referindo-se à geração atual, não apenas a pessoas fisicamente presentes.
