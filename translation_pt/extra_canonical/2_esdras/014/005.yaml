lexical_decisions:
- source_word: enarraui
  choice: contei-lhe
  rationale: Reproduz de modo natural o sentido de relatar ou expor algo a alguém.
- source_word: mirabilia multa
  choice: muitas maravilhas
  rationale: Mantém o sentido amplo de feitos ou coisas extraordinárias sem especificá-los indevidamente.
- source_word: temporum secreta
  choice: os segredos dos tempos
  rationale: Preserva a formulação apocalíptica e a repetição lexical do latim.
- source_word: temporum finem
  choice: o fim dos tempos
  rationale: Tradução direta que conserva a possível dimensão escatológica da expressão.
- source_word: praecepi ei dicens
  choice: 'dei-lhe esta ordem:'
  rationale: Expressa idiomaticamente a fórmula latina que introduz o conteúdo da ordem, evitando o pouco natural «ordenei-lhe, dizendo».
theological_decisions:
- issue: Sentido de «fim dos tempos»
  choice: Preservar «o fim dos tempos» sem explicação interpretativa
  alternative: «o término das épocas»
  rationale: A expressão pode ter força escatológica, e o texto não deve resolver essa amplitude por paráfrase.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo preservado. A fórmula final foi vertida idiomaticamente e introduz a continuação com dois-pontos.
