  text: But let no one come near me now, nor seek me for forty days.”
translation:
  language: pt
  text: Mas agora, ninguém se aproxime de mim nem me procure durante quarenta dias.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O fragmento latino preservado traz «requirent me usque diebus XL», literalmente com o futuro plural “procurarão a mim” e uma construção temporal difícil. A tradução segue a proibição exigida pelo contexto e preservada em outras formas do texto.
    reason: Explicita a divergência gramatical do fragmento latino sem atribuir-lhe uma literalidade que ele não tem e sem obscurecer a instrução no texto principal.
lexical_decisions:
- source_word: requirent me
  choice: me procure
  rationale: No contexto, o verbo latino exprime procurar ou buscar Esdras; o singular em português concorda naturalmente com “ninguém”.
- source_word: usque diebus XL
  choice: durante quarenta dias
  rationale: Expressa em português corrente o período completo indicado pela construção latina.
