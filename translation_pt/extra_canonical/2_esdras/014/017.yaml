lexical_decisions:
- source_word: mala
  choice: males
  rationale: Mantém o sentido amplo do neutro plural latino e a ligação sintática com o contexto anterior.
- source_word: Prolongabit enim magis ueritas
  choice: Pois a verdade se afastará ainda mais
  rationale: O uso contextual de prolongare expressa aumento de distância ou afastamento, em contraste direto com adpropinquabit, ‘se aproximará’.
- source_word: adpropinquabit mendacium
  choice: a mentira se aproximará
  rationale: Reproduz com clareza o contraste espacial e moral entre a verdade que se afasta e a mentira que chega perto.
- source_word: festinat ... uenire
  choice: se apressa a chegar
  rationale: Conserva tanto a ideia de urgência de festinat quanto o movimento de uenire.
- source_word: aquila
  choice: águia
  rationale: Equivalente direto, preservando a referência à figura vista anteriormente na visão.
theological_decisions:
- issue: Personificação da verdade e da mentira
  choice: Preservar os verbos de movimento aplicados à verdade e à mentira
  alternative: Explicitar que as pessoas abandonarão a verdade e aceitarão a mentira
  rationale: O texto latino personifica ambas e não identifica explicitamente os agentes humanos; a tradução conserva essa imagem e sua ambiguidade.
- issue: Sentido da chegada da águia
  choice: Traduzir literalmente sem identificar o referente simbólico
  alternative: Interpretar a águia como um império, governante ou evento específico
  rationale: O versículo remete à visão, mas não resolve aqui a identidade ou o significado exato do símbolo.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais de segunda pessoa singular (‘viste’) adequadas ao discurso direto solene. O início em minúscula preserva o fato de que o versículo começa no meio de uma frase vinda do contexto anterior.
