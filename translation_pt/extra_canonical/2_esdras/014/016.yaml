  source_fidelity: A tradução representa com fidelidade o fragmento latino. “Coisas piores do que essas voltarão a acontecer” preserva deteriora horum e o futuro passivo facientur sem introduzir um agente. A construção correlativa “quanto mais..., mais...” corresponde adequadamente a quantum... tantum. “Os males” é uma recuperação contextual legítima do sujeito elíptico de multiplicabunt.
  naturalness: O português é moderno, claro e de registro apropriado. O travessão comunica bem que o versículo começa no meio de uma unidade sintática procedente do contexto anterior. “Esta era” é compreensível, e a nota oferece a alternativa interpretativa “mundo”.
  terminology: “Era” para saeculum é uma opção defensável no contexto apocalíptico e não fecha indevidamente a ambiguidade lexical, que está devidamente assinalada em nota. “Males” e “coisas piores” mantêm a distinção textual entre mala e deteriora.
