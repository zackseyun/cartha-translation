  yaml_path: translation/extra_canonical/2_esdras/014/016.yaml
  text: —worse things than these will happen again. For the weaker the age becomes through old age[a], the more evils will multiply.
translation:
  language: pt
  text: —coisas piores do que essas voltarão a acontecer. Pois, quanto mais esta era se enfraquece com a velhice[a], mais os males se multiplicarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “este mundo se enfraquece por causa da velhice”. O termo latino pode significar tanto “era” como “mundo”.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: deteriora
  choice: coisas piores
  rationale: Conserva o comparativo neutro plural do latim sem restringi-lo antecipadamente apenas a “males”.
- source_word: iterum
  choice: voltarão a
  rationale: 'Expressa com naturalidade a ideia de repetição: acontecer novamente.'
- source_word: facientur
  choice: acontecer
  rationale: Traduz o futuro passivo idiomático como ocorrência, evitando o sentido ativo incorreto de “farão” ou “produzirão”.
- source_word: saeculum
  choice: esta era
  rationale: No contexto apocalíptico, designa a era presente; a nota registra a amplitude possível do termo.
- source_word: inualidum fit
  choice: se enfraquece
  rationale: Reproduz o processo de tornar-se fraco ou debilitado em linguagem portuguesa natural.
- source_word: multiplicabunt
  choice: os males se multiplicarão
  rationale: Supre o sujeito “os males”, implícito no fragmento latino e recuperável do contexto imediato.
theological_decisions:
- issue: Valor do passivo futuro em facientur
  choice: “acontecer”
  alternative: “serão feitas”
  rationale: A formulação impessoal preserva a ocorrência futura dos males sem atribuir explicitamente a ação a Deus nem a causas naturais.
- issue: Imagem do envelhecimento da era
  choice: Manter a personificação da era que se enfraquece com a velhice
  alternative: Explicitar uma interpretação cosmológica ou moral
  rationale: O texto apresenta a era como envelhecida e debilitada; a tradução mantém a imagem e sua tensão apocalíptica sem impor uma explicação doutrinária.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. O travessão conserva a ligação sintática com o versículo anterior, pois o fragmento começa no meio da frase.
