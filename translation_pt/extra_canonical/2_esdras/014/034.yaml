  text: you will be kept alive[a], and after death you will obtain mercy. For judgment will come after death, when again
translation:
  language: pt
  text: vocês serão mantidos vivos e, depois da morte, alcançarão misericórdia. Pois o juízo virá depois da morte, quando novamente[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase continua no versículo seguinte.
    reason: O segmento latino deste versículo termina em *quando iterum* (“quando novamente”), deixando a oração deliberadamente incompleta por causa da divisão dos versículos.
lexical_decisions:
- source_word: uiui conseruati eritis
  choice: vocês serão preservados vivos
  rationale: Mantém a segunda pessoa do plural, o futuro passivo e a ideia explícita de permanecer com vida.
- source_word: misericordiam consequemini
  choice: alcançarão misericórdia
  rationale: Expressa de modo natural o sentido de obter ou alcançar misericórdia, sem acrescentar artigo ausente no latim.
- source_word: Iudicium enim post mortem ueniet
  choice: Pois o juízo virá depois da morte
  rationale: Preserva a relação explicativa de enim, a sequência temporal e a referência definida ao juízo.
- source_word: quando iterum
  choice: quando novamente
  rationale: Reproduz deliberadamente a oração incompleta no limite do versículo, sem importar o verbo que pertence ao trecho seguinte.
theological_decisions:
- issue: Relação entre morte, misericórdia e juízo
  choice: Manter as afirmações em sua sequência literal, sem explicar como se relacionam teologicamente
  alternative: Harmonizar ou explicitar a natureza do juízo e da misericórdia após a morte
  rationale: O texto latino apenas afirma a obtenção de misericórdia depois da morte e a vinda posterior do juízo; qualquer harmonização acrescentaria interpretação doutrinária.
- issue: Final suspenso do versículo
  choice: Encerrar com “quando novamente”
  alternative: Completar com “voltarmos a viver”
  rationale: O verbo que completa a oração está no segmento latino do versículo seguinte; incluí-lo aqui repetiria o erro anterior de divisão textual.
translation_notes:
  register: Português atual, digno e de leitura ampla, com preferência por construções transparentes. O início em minúscula e o final suspenso refletem que este trecho continua a frase anterior e prossegue no versículo seguinte.
