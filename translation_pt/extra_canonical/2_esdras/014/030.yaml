  text: And you transgressed after them. And the land was given to you in the land of Zion[a], but both you and your fathers committed iniquity and did not keep the ways that the Most High commanded you.
translation:
  language: pt
  text: E vocês transgrediram depois deles. E a vocês foi dada terra na terra de Sião, mas tanto vocês como seus pais[a] cometeram iniquidade e não guardaram os caminhos que o Altíssimo ordenou a vocês.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “mas vocês e seus pais cometeram iniquidade”.'
    reason: Registra a alternativa de tradução transmitida na camada de consulta auditada, junto à construção correlativa «tanto vocês como seus pais» que ela afeta.
lexical_decisions:
- source_word: transgressi estis
  choice: transgrediram
  rationale: Mantém o sentido direto do perfeito latino, com linguagem bíblica ainda clara no português atual.
- source_word: post eos
  choice: depois deles
  rationale: Preserva a formulação temporal e a possível ideia de seguir o exemplo das gerações anteriores, sem explicitar além do texto.
- source_word: et uos et patres uestri
  choice: tanto vocês como seus pais
  rationale: Reproduz a construção correlativa com duplo et e sua ênfase na culpa compartilhada entre as gerações.
- source_word: iniquitatem egistis
  choice: cometeram iniquidade
  rationale: Expressa de forma natural a ação moral indicada pelo latim, sem reduzir sua força teológica.
- source_word: Altissimus
  choice: Altíssimo
  rationale: Equivalente tradicional, claro e não sectário para o título divino.
theological_decisions:
- issue: Responsabilidade entre gerações
  choice: tanto vocês como seus pais
  alternative: vocês e seus pais
  rationale: A tradução conserva a ênfase gramatical do duplo et sem sugerir culpa herdada; o texto atribui a prática da iniquidade a ambos os grupos.
- issue: Relação de post eos com a transgressão
  choice: transgrediram depois deles
  alternative: seguiram o exemplo deles na transgressão
  rationale: A opção escolhida preserva a ambiguidade do latim entre sucessão temporal e imitação moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Emprega “vocês” para o plural de segunda pessoa e conserva termos bíblicos transparentes como “iniquidade” e “Altíssimo”.
