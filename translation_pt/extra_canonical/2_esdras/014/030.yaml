  source_fidelity: A tradução preserva adequadamente «transgressi estis», «post eos», a correlação «et vos et patres vestri», «iniquitatem egistis» e «Altissimus». Porém, «vobis» significa “a vocês”, não “lhes”; o mesmo se aplica ao destinatário de «praecepit vobis».
  naturalness: O registro é claro e moderno. “Foi dada a vocês terra” é uma ordem um pouco marcada, mas reproduz com clareza a construção e evita introduzir artigo definido ou indefinido não expresso no latim.
