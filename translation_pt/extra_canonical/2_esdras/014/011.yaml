id: 2ES.14.11
reference: 2 Esdras 14:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: XII enim partibus diuisum est saeculum, et transierunt eius X iam et dimidium xmae partis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/011.yaml
  text: For the age has been divided into twelve parts[a], and ten of its parts have already passed, and half of the tenth part.
translation:
  language: pt
  text: Pois a era foi dividida em doze partes, e nove delas já passaram[a], além da metade da décima parte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino traz “dez”, provavelmente por erro de cópia; várias versões antigas trazem “nove”, em harmonia com a metade da décima parte e com o versículo seguinte.
    reason: Registra a variante do testemunho latino e explica a adoção da leitura sustentada pela evidência textual e pelo contexto.
lexical_decisions:
- source_word: saeculum
  choice: a era
  rationale: No contexto apocalíptico, refere-se ao período ou era presente, não simplesmente a um século de cem anos.
- source_word: X
  choice: nove
  rationale: Embora o texto latino limpo traga o numeral X (‘dez’), a sequência ‘metade da décima parte’ e o cálculo do versículo seguinte indicam IX (‘nove’); as antigas versões siríaca, etíope, árabe e armênia também sustentam ‘nove’.
- source_word: et dimidium xmae partis
  choice: além da metade da décima parte
  rationale: Expressa naturalmente que, depois de nove partes completas, também transcorreu metade da décima, preservando a progressão numérica pretendida.
theological_decisions:
- issue: Contagem das partes transcorridas
  choice: nove partes e metade da décima
  alternative: dez partes e metade da décima
  rationale: A leitura literal do numeral X no manuscrito latino produz uma sequência internamente incoerente e conflita com as duas partes e meia restantes no versículo 12. A emenda para IX é apoiada por múltiplas versões antigas e preserva a cronologia apocalíptica do trecho.
translation_notes:
  register: Português moderno, claro e digno. “Era” evita o sentido cronológico moderno de “século”; a construção numérica foi formulada de modo natural sem ocultar a variante textual.
