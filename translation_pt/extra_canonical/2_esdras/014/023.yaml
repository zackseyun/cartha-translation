  text: those who are to live in the last days may live.” And he answered me and said, “Go, gather the people, and say to them not to seek you
translation:
  language: pt
  text: 'vivam os que hão de viver nos últimos dias”. E ele me respondeu e disse: “Vá, reúna o povo e diga-lhes que não o procurem'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuere ... uiuant
  choice: vivam os que hão de viver
  rationale: Conserva a repetição do verbo latino e supre o sujeito implícito exigido pelo fragmento, sem acrescentar uma identificação não expressa.
- source_word: in nouissimis
  choice: nos últimos dias
  rationale: Expressão portuguesa natural que preserva o sentido escatológico do plural latino substantivado.
- source_word: uadens congrega populum
  choice: Vá, reúna o povo
  rationale: Reproduz de modo corrente e direto a sequência de ordens.
- source_word: ut non te quaerant
  choice: que não procurem você
  rationale: Mantém a finalidade/conteúdo da instrução e torna explícito, em português corrente, que o objeto da procura é Esdras.
theological_decisions:
- issue: Identidade dos que viverão nos últimos dias
  choice: os que hão de viver nos últimos dias
  alternative: eles vivam nos últimos dias
  rationale: O latim preservado começa no meio de uma oração e não nomeia o grupo. A formulação escolhida fornece apenas o sujeito gramatical implícito, sem definir quem são essas pessoas.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O versículo começa como continuação sintática do anterior e termina sem fechar as aspas, pois a fala prossegue no versículo seguinte.
