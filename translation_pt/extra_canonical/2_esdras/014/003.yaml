source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Reuelans reuelatus sum super rubum, et locutus sum Moysi, quando populus meus seruiebat in Aegypto,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/003.yaml
  text: I revealed myself in the bush[a], and I spoke to Moses when my people were serving in Egypt.
translation:
  language: pt
  text: Eu me revelei na sarça[a] e falei com Moisés quando o meu povo vivia em servidão no Egito.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «revelando, fui revelado»; a duplicação pode dar ênfase à declaração.
    reason: Preserva a forma incomum e a possível força enfática de Reuelans reuelatus sum sem produzir português artificial no texto principal.
lexical_decisions:
- source_word: Reuelans reuelatus sum
  choice: Eu me revelei
  rationale: A construção duplicada é um semitismo enfático, literalmente algo como «revelando, fui revelado». A tradução principal comunica o sentido em português natural, enquanto a nota preserva a forma e a possível ênfase do original.
- source_word: super rubum
  choice: na sarça
  rationale: Embora super possa significar «sobre», o contexto da manifestação a Moisés favorece a expressão portuguesa consagrada e natural «na sarça».
- source_word: seruiebat in Aegypto
  choice: vivia em servidão no Egito
  rationale: Neste contexto, serviebat descreve a condição de sujeição do povo no Egito; «vivia em servidão» evita sugerir mero serviço voluntário e mantém o aspecto durativo do imperfeito.
theological_decisions:
- issue: Ênfase da fórmula duplicada Reuelans reuelatus sum
  choice: Manter uma formulação natural no texto e registrar a duplicação enfática em nota
  alternative: «Eu certamente me revelei» ou «Eu me revelei claramente»
  rationale: A duplicação provavelmente preserva uma construção semítica enfática, mas o valor exato da ênfase não é seguro. Evita-se definir no texto se ela expressa certeza, intensidade ou publicidade da revelação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. «Sarça» mantém o vocabulário bíblico amplamente reconhecido; «vivia em servidão» explicita naturalmente a condição histórica sem recorrer a formulação excessivamente interpretativa.
