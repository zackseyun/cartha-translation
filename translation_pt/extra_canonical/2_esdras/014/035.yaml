  text: we will live again; and then the name of the righteous will appear, and the deeds of the ungodly will be disclosed. But let no one come near me now, nor
translation:
  language: pt
  text: reviveremos; então o nome dos justos aparecerá, e as obras dos ímpios serão reveladas. Mas ninguém se aproxime de mim agora, nem
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuiuiscemus
  choice: reviveremos
  rationale: Traduz diretamente a ideia de voltar à vida, preservando a primeira pessoa do plural e sem explicitar além do latim o modo desse retorno.
- source_word: iustorum nomen
  choice: o nome dos justos
  rationale: Mantém a formulação singular coletiva do latim e sua possível referência à identidade ou reputação dos justos.
- source_word: apparebit
  choice: se tornará conhecido
  rationale: Expressa de modo natural que o nome dos justos virá a público ou será manifesto, sem reduzir o verbo a uma aparição visual.
- source_word: impiorum facta
  choice: as obras dos ímpios
  rationale: ‘Obras’ conserva o sentido moral de facta neste contraste com os justos e é claro no registro bíblico moderno.
- source_word: ostendentur
  choice: serão reveladas
  rationale: Preserva a ideia de que as obras serão expostas ou dadas a conhecer.
- source_word: accedat
  choice: se aproxime
  rationale: Equivalente natural e direto para a proibição de chegar perto do falante.
theological_decisions:
- issue: Natureza de reuiuiscemus
  choice: reviveremos
  alternative: ressuscitaremos
  rationale: ‘Reviveremos’ preserva a afirmação do retorno à vida sem impor uma formulação teológica mais específica do que o verbo latino exige.
- issue: Sentido de nomen apparebit
  choice: o nome dos justos se tornará conhecido
  alternative: o nome dos justos aparecerá
  rationale: A escolha mantém a ambiguidade entre identidade, reconhecimento e reputação, ao mesmo tempo que soa natural em português.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. O fragmento termina deliberadamente em ‘nem’, preservando a continuação incompleta do texto-fonte fornecido.
