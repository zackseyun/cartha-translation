source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et ecce uox exiuit contra me de rubo et dixit : Ezra, Ezra ! et dixi: ecce ego, domine. et surrexi super pedes meos, et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/002.yaml
  text: 'And behold, a voice came to me from a bush and said, “Ezra, Ezra!” And I said, “Here I am, Lord.” And I stood on my feet, and it said to me:'
translation:
  language: pt
  text: 'E eis que uma voz veio a mim de um arbusto e disse: “Esdras, Esdras!” Eu respondi: “Aqui estou, Senhor.” Então me pus de pé, e a voz me disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: e eis que
  rationale: Preserva o marcador enfático e narrativo latino em linguagem bíblica ainda compreensível no português atual.
- source_word: uox exiuit contra me
  choice: uma voz veio a mim
  rationale: Expressa naturalmente o movimento da voz em direção ao narrador; uma tradução literal como “saiu contra mim” sugeriria oposição indevida em português.
- source_word: de rubo
  choice: de um arbusto
  rationale: Mantém o sentido comum de rubus sem identificar de modo mais específico a espécie vegetal.
- source_word: ecce ego
  choice: Aqui estou
  rationale: Equivalente idiomático português da fórmula de prontidão e resposta à chamada.
- source_word: surrexi super pedes meos
  choice: me pus de pé
  rationale: Reproduz o sentido da expressão latina em formulação corrente e digna.
theological_decisions:
- issue: Identidade da voz
  choice: “a voz me disse” na última oração
  alternative: “ele me disse” ou simplesmente “disse-me”
  rationale: O antecedente gramatical explícito é uox; repetir “a voz” evita atribuir silenciosamente uma identidade pessoal ou divina além do que este versículo declara.
- issue: Forma de tratamento domine
  choice: Senhor
  alternative: senhor
  rationale: A inicial maiúscula reflete que Esdras parece dirigir-se à voz divina no contexto, sem acrescentar um nome ou título mais específico.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência bíblica. Conserva “e eis que” por seu valor enfático; evita o pouco natural “levantando-me sobre os meus pés”. A pontuação final introduz a fala do versículo seguinte.
