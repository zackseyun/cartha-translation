  yaml_path: translation/extra_canonical/2_esdras/014/004.yaml
  text: And I sent him, and he led my people out of Egypt, and I brought him up onto Mount Sinai, and I kept him with me many days.
translation:
  language: pt
  text: E eu o enviei, e ele tirou o meu povo do Egito; eu o conduzi ao monte Sinai e o mantive comigo por muitos dias.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eduxit
  choice: tirou
  rationale: Expressa de modo natural o ato de fazer o povo sair do Egito, preservando o sujeito masculino indicado por «eum».
- source_word: adduxi eum super montem Sina
  choice: eu o conduzi ao monte Sinai
  rationale: Mantém a mudança de sujeito para Deus e traduz a direção até o monte em português natural, sem acrescentar que chegou ao topo.
- source_word: detinui eum apud me
  choice: o mantive comigo
  rationale: Reproduz a ideia de fazê-lo permanecer junto de Deus durante um período prolongado.
theological_decisions:
- issue: Alternância do agente na saída do Egito
  choice: «ele tirou o meu povo do Egito»
  alternative: «ele conduziu o meu povo para fora do Egito»
  rationale: Preserva a afirmação de que o enviado atua como agente da saída, sem eliminar a atuação divina expressa nas orações seguintes.
translation_notes:
  register: Português moderno, claro e digno, com coordenação próxima da estrutura latina. Emprega «monte Sinai», forma amplamente reconhecida, e evita formulações arcaicas.
