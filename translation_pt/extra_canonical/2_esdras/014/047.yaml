  text: you may hand them over to the wise among your people. For in them is the vein of understanding[a], the fountain of wisdom, and the river of knowledge.”
translation:
  language: pt
  text: que você os entregue aos sábios do seu povo. Pois neles está o veio do entendimento[a], a fonte da sabedoria e o rio do conhecimento.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a nascente do entendimento”.'
    reason: O latim vena pode evocar um veio ou uma nascente; a nota preserva essa possibilidade sem apagar a distinção lexical em relação a fons, “fonte”.
lexical_decisions:
- source_word: tradas eos
  choice: você os entregue
  rationale: Expressa a forma verbal dependente do contexto anterior e preserva o objeto masculino plural, referente aos escritos.
- source_word: sapientibus de populo tuo
  choice: aos sábios do seu povo
  rationale: Tradução direta e natural do dativo e da relação partitiva expressa por de.
- source_word: uena intellectus
  choice: o veio do entendimento
  rationale: “Veio” conserva a metáfora de vena como veio ou filão, sem confundi-la com fons, traduzido em seguida por “fonte”.
- source_word: sapientiae fons
  choice: a fonte da sabedoria
  rationale: Mantém a imagem hídrica e a construção nominal do latim.
- source_word: scientiae flumen
  choice: o rio do conhecimento
  rationale: Reproduz a terceira imagem da sequência e distingue flumen de fons.
theological_decisions:
- issue: Referente de “in his”
  choice: “neles”, sem explicitação adicional
  alternative: “nesses livros” ou “nesses escritos”
  rationale: O referente é recuperável do contexto, e a forma pronominal preserva a concisão e evita acrescentar ao versículo um substantivo não presente nesta oração.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A metáfora menos comum “veio do entendimento” foi mantida por fidelidade à sequência latina; a alternativa interpretativa aparece em nota.
