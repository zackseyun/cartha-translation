base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/042.yaml
  text: And the Most High gave understanding to the five men[a], and they wrote in succession the things that were spoken, in characters that they did not know[b]. And they sat there forty days.
translation:
  language: pt
  text: Abriu-se a minha boca, e já não se fechou. Então o Altíssimo deu entendimento a cinco homens, e eles, revezando-se[b], escreveram as coisas que eram ditas, com sinais que não conheciam[a]. E sentaram-se.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão pode indicar caracteres desconhecidos, sinais taquigráficos ou formas de escrita possibilitadas por intervenção divina; o latim não especifica.
    reason: lexical_alternative
  - marker: b
    text: Ou “em sucessão”; isto é, um após outro.
    reason: previous_rendering
lexical_decisions:
- source_word: apertum est os meum et non est clausum amplius
  choice: Abriu-se a minha boca e não tornou a se fechar
  rationale: Mantém a imagem e o aspecto durativo do latim, em português natural e solene.
- source_word: ex successione
  choice: revezando-se
  rationale: Expressa a sucessão dos escribas — um após outro ou por turnos — em vez de sugerir apenas a ordenação do conteúdo.
- source_word: quae dicebantur
  choice: o que lhes era ditado
  rationale: No contexto da atividade dos escribas, comunica que eles registravam as palavras pronunciadas, sem identificar além do texto quem as pronunciava.
- source_word: notis quas non sciebant
  choice: usando sinais que não conheciam
  rationale: Preserva a amplitude de notis, que pode indicar caracteres, sinais gráficos ou formas de escrita, sem especificar indevidamente.
- source_word: et sederunt
  choice: E permaneceram sentados ali
  rationale: Traduz o estado continuado indicado no contexto e liga naturalmente a ação à duração de quarenta dias atestada pela tradição textual consultada.
theological_decisions:
- issue: Natureza da capacitação concedida pelo Altíssimo
  choice: deu entendimento aos cinco homens
  alternative: inspirou os cinco homens
  rationale: A tradução mantém o termo intellectum e evita definir a capacitação como uma doutrina específica de inspiração.
- issue: Natureza dos sinais desconhecidos
  choice: sinais que não conheciam
  alternative: caracteres que não conheciam
  rationale: Mantém aberta a possibilidade de caracteres, taquigrafia ou outra forma de escrita divinamente habilitada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A abertura do versículo, presente no texto latino fornecido, foi preservada. Os marcadores foram posicionados junto às expressões às quais suas notas efetivamente se referem.
