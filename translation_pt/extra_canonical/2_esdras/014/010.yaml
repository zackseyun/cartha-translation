source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quoniam saeculum perdidit iuuentutem suam, et tempora adpropinquant senescere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/010.yaml
  text: For the age has lost its youth, and the times are drawing near to old age.
translation:
  language: pt
  text: Pois a era perdeu sua juventude, e os tempos se aproximam da velhice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: esta era
  rationale: No contexto, designa a era ou ordem presente; “esta era” preserva o sentido temporal e evita a ambiguidade moderna de “século” como período de cem anos.
- source_word: perdidit iuuentutem suam
  choice: perdeu a juventude
  rationale: Reproduz diretamente a personificação do original latino em linguagem natural e digna.
- source_word: tempora
  choice: os tempos
  rationale: Mantém o plural e o paralelismo temporal do texto-fonte.
- source_word: adpropinquant senescere
  choice: se aproximam da velhice
  rationale: Expressa idiomaticamente a imagem de os tempos estarem chegando à condição de velhice, sem explicá-la ou resolver sua tensão escatológica.
theological_decisions:
- issue: Imagem da era presente envelhecendo
  choice: Preservar literalmente a personificação da era e dos tempos
  alternative: Interpretar explicitamente como anúncio de que o fim do mundo está próximo
  rationale: O latim emprega uma metáfora temporal e escatológica, mas não explicita aqui “fim do mundo”; a tradução conserva a imagem sem acrescentar uma interpretação doutrinária.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Tom conciso e solene; mantém o paralelismo e a personificação do latim.
source_grounding:
  english_pob_role: consult_only
