  text: But keep the last seventy[a], so that you may hand them over to the wise among your people.
translation:
  language: pt
  text: Que os dignos e os indignos os leiam. Mas guarda os últimos setenta[a], para entregá-los aos sábios do teu povo.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Os últimos setenta livros são apresentados como sabedoria reservada aos sábios do povo de Esdras, um aspecto central da maneira como 4 Esdras retrata a revelação oculta.
    reason: compositional_layer
lexical_decisions:
- source_word: legant
  choice: que ... leiam
  rationale: 'O subjuntivo latino expressa permissão ou determinação indireta: que sejam lidos por ambos os grupos.'
- source_word: digni et indigni
  choice: os dignos e os indignos
  rationale: Mantém o contraste explícito do latim sem explicar por que alguém seria considerado digno ou indigno.
- source_word: Nouissimos ... LXX
  choice: os últimos setenta
  rationale: Traduz diretamente a posição final desse conjunto de livros; o referente 'livros' é recuperado pelo contexto imediato.
- source_word: conseruabis
  choice: guarda
  rationale: O futuro latino tem força diretiva no contexto; o imperativo em português é natural e corresponde à instrução dada a Esdras.
- source_word: sapientibus de populo tuo
  choice: aos sábios do teu povo
  rationale: Segue a formulação preservada na tradição textual e refletida na camada inglesa de consulta, com linguagem clara e digna.
theological_decisions:
- issue: Acesso público e revelação reservada
  choice: Preservar o contraste entre a leitura pelos dignos e indignos e a reserva dos últimos setenta aos sábios
  alternative: Suavizar 'indignos' ou apresentar todos os livros como igualmente públicos
  rationale: O contraste é uma característica deliberada da apresentação da revelação no capítulo e não deve ser harmonizado.
- issue: Identidade dos 'sábios'
  choice: Manter apenas 'os sábios do teu povo'
  alternative: Identificá-los com sacerdotes, escribas ou algum grupo religioso específico
  rationale: O texto não define mais precisamente o grupo, portanto a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A coordenação adversativa conserva o contraste entre os livros de leitura aberta e os livros reservados. O pronome 'os' na primeira frase retoma os livros mencionados no contexto anterior.
