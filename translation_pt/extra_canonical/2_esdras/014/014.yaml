source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dimitte abs te mortales cogitationes, et proice abs te pondera humana, et exue te iam infirmam naturam, et repone in unam partem molestissima tibi cogitamenta, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/014.yaml
  text: And put away from yourself mortal thoughts, and cast off from yourself human burdens, and strip off now your weak nature, and set aside the thoughts that are most grievous to you,
translation:
  language: pt
  text: Afasta de ti os pensamentos mortais, livra-te dos fardos humanos, despe-te agora de tua natureza fraca e põe de lado os pensamentos que mais te afligem,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte abs te
  choice: Afasta de ti
  rationale: Expressa de modo natural a ideia de fazer partir ou remover de si, preservando o imperativo.
- source_word: mortales cogitationes
  choice: os pensamentos mortais
  rationale: Mantém a formulação concreta e a possível ambiguidade entre pensamentos sujeitos à mortalidade e pensamentos próprios dos mortais.
- source_word: proice abs te pondera humana
  choice: livra-te dos fardos humanos
  rationale: Comunica a imagem de lançar para longe os pesos humanos em português atual, sem perder a força de rejeição.
- source_word: exue te iam infirmam naturam
  choice: despe-te agora de tua natureza fraca
  rationale: Preserva a metáfora de tirar uma vestimenta e traduz infirmam como fraqueza, sem acrescentar uma interpretação doutrinária.
- source_word: repone in unam partem
  choice: põe de lado
  rationale: Equivalente idiomático da expressão latina, que indica separar ou deixar à parte.
- source_word: molestissima tibi cogitamenta
  choice: os pensamentos que mais te afligem
  rationale: Reproduz o superlativo e a relação pessoal indicada por tibi em linguagem clara.
theological_decisions:
- issue: Sentido de «natureza fraca»
  choice: Manter a expressão sem explicar sua extensão teológica
  alternative: Traduzir como «condição mortal» ou «fraqueza humana»
  rationale: O latim diz infirmam naturam; uma formulação mais interpretativa poderia identificar indevidamente essa natureza com mortalidade, pecado ou corporeidade.
- issue: Sentido de «pensamentos mortais»
  choice: Preservar a ambiguidade literal
  alternative: «pensamentos de mortal» ou «pensamentos sobre a morte»
  rationale: Mortales pode caracterizar os pensamentos de mais de uma maneira; o contexto imediato não exige que a tradução escolha apenas uma.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com colocação pronominal natural para leitores brasileiros. A sequência de quatro imperativos e as metáforas corporais do latim foram preservadas. A vírgula final reflete a continuação sintática do texto-fonte fornecido.
