  naturalness: O português é moderno, claro e de registro digno. As formas imperativas e pronominais («Afasta de ti», «livra-te», «despe-te», «põe») soam naturais para o público-alvo. «Fardos humanos» e «os pensamentos que mais te afligem» são formulações idiomáticas e mantêm a força do original.
