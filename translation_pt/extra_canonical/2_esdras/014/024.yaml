lexical_decisions:
- source_word: buxos
  choice: tabuinhas para escrever
  rationale: O substantivo latino designa literalmente objetos de buxo e, neste contexto, tabuinhas de escrita feitas dessa madeira. A tradução explicita a função em português natural.
- source_word: quinque
  choice: os cinco
  rationale: Preserva a palavra final do latim e deixa claro que ela resume os cinco homens nomeados.
- source_word: Ethanum
  choice: Etã
  rationale: Adota a forma bíblica portuguesa corrente do nome próprio latino Ethan, com adaptação fonológica natural.
