  yaml_path: translation/extra_canonical/2_esdras/003/032.yaml
  text: Or has any other nation known you besides Israel? Or what tribes have believed the covenants like this Jacob?[a]
translation:
  language: pt
  text: Ou alguma outra nação te conheceu além de Israel? Ou quais tribos creram nas alianças como estas tribos de Jacó?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «como este Jacó». A construção latina é incomum e pode ser entendida como referência a Jacó ou às tribos de Jacó.'
    reason: Preserva a ambiguidade de «haec Iacob» e registra a alternativa representada na tradição de tradução consultada.
lexical_decisions:
- source_word: alia gens
  choice: alguma outra nação
  rationale: Em pergunta retórica, traduz naturalmente a ideia de qualquer outra nação, sem introduzir o interrogativo «qual» ausente do latim.
- source_word: cognovit te
  choice: te conheceu
  rationale: Mantém o sentido direto e relacional de cognoscere e o objeto de segunda pessoa.
- source_word: testamentis
  choice: nas alianças
  rationale: O dativo regido por crediderunt é expresso idiomaticamente por «crer em»; no contexto bíblico, testamentum designa alianças, e o latim não traz possessivo.
- source_word: haec Iacob
  choice: estas tribos de Jacó
  rationale: Entende haec como retomada elíptica de tribus e Iacob como especificação de pertencimento; a repetição de «tribos» torna a referência clara em português.
theological_decisions:
- issue: Referência de «haec Iacob»
  choice: estas tribos de Jacó
  alternative: este Jacó
  rationale: A forma feminina haec pode retomar tribus no latim tardio, favorecendo a referência às tribos de Jacó. Como a construção é textual e gramaticalmente difícil, a leitura alternativa é preservada em nota, sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A ordem retórica das duas perguntas e o plural «alianças» foram preservados; evitou-se acrescentar o possessivo «tuas», ausente do texto latino.
