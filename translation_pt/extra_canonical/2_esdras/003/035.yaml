  text: aut quando non peccaverunt in conspectu tuo qui habitant terram, aut quae gens sic observavit mandata tua?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/035.yaml
  text: Or when have those who dwell on the earth not sinned in your sight? Or what nation has so kept your commandments?
translation:
  language: pt
  text: Ou quando foi que os habitantes da terra não pecaram diante de ti? Ou que nação guardou assim os teus mandamentos?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in conspectu tuo
  choice: diante de ti
  rationale: Expressão natural e digna que preserva a ideia de pecar na presença e sob o olhar de Deus.
- source_word: qui habitant terram
  choice: os habitantes da terra
  rationale: Mantém o sentido coletivo e universal da construção latina em português corrente.
- source_word: sic observavit
  choice: guardou assim
  rationale: ‘Guardou’ é idiomático para a observância de mandamentos, enquanto ‘assim’ preserva o advérbio sic e sua possível referência ao grau ou modo de obediência.
theological_decisions:
- issue: Universalidade do pecado humano
  choice: 'Formular como pergunta retórica: ‘quando foi que ... não pecaram?’'
  alternative: ‘alguma vez os habitantes da terra deixaram de pecar?’
  rationale: A formulação conserva a força retórica do latim sem transformar a implicação em uma declaração doutrinária explícita.
- issue: Sentido de sic na observância dos mandamentos
  choice: Preservar ‘assim’ sem explicitar seu referente
  alternative: ‘guardou tão fielmente’
  rationale: O latim deixa em aberto se sic indica modo, grau ou comparação contextual; explicitar ‘fielmente’ resolveria indevidamente essa ambiguidade.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla inteligibilidade internacional. Mantém o paralelismo das duas perguntas retóricas.
