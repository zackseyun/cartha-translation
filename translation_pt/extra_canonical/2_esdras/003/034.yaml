  text: nunc ergo pondera in statera nostras iniquitates et eorum qui habitant in saeculo, et invenietur momentum puncti ubi declinet.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/034.yaml
  text: Now therefore weigh our iniquities in the balance[a], and those of the inhabitants of the world; and it will be found at what point it inclines.
translation:
  language: pt
  text: Agora, pois, pesa na balança as nossas iniquidades e as dos que habitam no mundo; e se verá para que lado o ponteiro se inclina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim é difícil: literalmente, «e será encontrado o movimento do ponto/indicador, onde ele se inclina». A expressão pode referir-se ao movimento ou à posição do indicador da balança.'
    reason: Registra a ambiguidade de momentum puncti ubi declinet sem impor uma alternativa locativa nem deixar ambíguo o referente pronominal.
lexical_decisions:
- source_word: pondera in statera
  choice: pesa na balança
  rationale: Reproduz de modo natural a imagem explícita da pesagem e mantém o imperativo singular do latim.
- source_word: iniquitates
  choice: iniquidades
  rationale: Conserva o sentido moral e jurídico de atos ou estados contrários à justiça, sem o reduzir simplesmente a “pecados”.
- source_word: qui habitant in saeculo
  choice: os que habitam no mundo
  rationale: Neste contexto, saeculum designa o mundo ou a ordem presente habitada; “mundo” é claro e idiomático em português.
- source_word: momentum puncti ubi declinet
  choice: para que lado o ponteiro se inclina
  rationale: Entende momentum como o movimento ou a inclinação do indicador da balança e punctum como seu ponto/ponteiro; a formulação comunica com clareza o resultado comparativo da pesagem.
theological_decisions:
- issue: Objeto da comparação moral
  choice: “as nossas iniquidades e as dos que habitam no mundo”
  alternative: “a nossa iniquidade e a dos habitantes do mundo”
  rationale: Mantém o plural latino e não determina de antemão qual grupo será considerado mais culpado.
- issue: Resultado da pesagem
  choice: “para que lado o ponteiro se inclina”
  alternative: “em que ponto ele se inclina”
  rationale: A escolha expressa a imagem da balança sem declarar explicitamente o veredito, preservando a tensão do pedido; a ambiguidade lexical é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. A colocação enclítica “pesa” foi preferida por clareza; a metáfora judicial da balança foi conservada.
