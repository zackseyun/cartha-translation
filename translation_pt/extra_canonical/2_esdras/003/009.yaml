  text: Iterum autem in tempore induxisti diluuium super habitantes saeculum, et perdidisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/009.yaml
  text: Again, in time, you brought the flood upon the inhabitants of the world, and destroyed them.
translation:
  language: pt
  text: Novamente, mais tarde, trouxeste o dilúvio sobre os habitantes do mundo e os destruíste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iterum autem
  choice: Novamente
  rationale: Expressa a retomada narrativa de modo natural; autem funciona aqui como partícula de continuidade e não exige um adversativo explícito.
- source_word: in tempore
  choice: no devido tempo
  rationale: Preserva a ideia temporal da expressão latina e evita a formulação pouco natural «no tempo».
- source_word: induxisti diluuium
  choice: trouxeste o dilúvio
  rationale: Reproduz diretamente a ação causativa de fazer o dilúvio vir sobre alguém, em português corrente e digno.
- source_word: habitantes saeculum
  choice: habitantes do mundo
  rationale: 'O acusativo saeculum após habitantes tem sentido espacial: os que habitavam o mundo.'
- source_word: perdidisti eos
  choice: os destruíste
  rationale: No contexto do dilúvio, perdere indica causar a destruição ou morte; «destruíste» mantém a força do verbo.
theological_decisions:
- issue: Agência divina no dilúvio
  choice: trouxeste o dilúvio... e os destruíste
  alternative: permitiste que o dilúvio viesse... e eles pereceram
  rationale: O latim atribui diretamente a Deus ambas as ações; a tradução não atenua essa tensão teológica.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais de segunda pessoa singular coerentes com a oração dirigida a Deus. Sem necessidade de notas textuais.
