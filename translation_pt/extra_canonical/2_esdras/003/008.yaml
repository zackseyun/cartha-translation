source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et ambulauit unaquaeque gens in uoluntate sua, et impie agebant coram te et spernebant, et tu non prohibuisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/008.yaml
  text: And each nation walked according to its own will[a], and acted impiously before you and despised you, and you did not hinder them.
translation:
  language: pt
  text: E cada nação seguiu a própria vontade[a], agiu de modo ímpio diante de ti e te desprezou; e tu não as impediste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “andou segundo a própria vontade”.'
    reason: Registra a metáfora literal de «ambulavit» e a construção latina «in voluntate sua», enquanto o texto principal emprega português mais natural.
lexical_decisions:
- source_word: ambulauit
  choice: seguiu
  rationale: No contexto de conduta, o latim «ambulavit» tem sentido figurado de viver ou proceder; «seguiu» comunica naturalmente a ideia em português.
- source_word: in uoluntate sua
  choice: a própria vontade
  rationale: Preserva a autonomia voluntariosa expressa pelo latim, em formulação idiomática e clara.
- source_word: impie agebant
  choice: agiu de modo ímpio
  rationale: Reproduz diretamente a ideia de agir sem reverência a Deus, mantendo o registro bíblico.
- source_word: spernebant
  choice: te desprezou
  rationale: Expressa o repúdio ou desdém dirigido a Deus no texto latino.
- source_word: non prohibuisti eos
  choice: não as impediste
  rationale: «Impedir» corresponde a «prohibere» neste contexto; o pronome feminino retoma naturalmente «cada nação».
theological_decisions:
- issue: Deus não impediu as nações de agir impiamente
  choice: tu não as impediste
  alternative: tu não as proibiste
  rationale: A tradução mantém a tensão do texto sobre a não intervenção divina, sem explicá-la como aprovação, permissão moral ou incapacidade.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O singular distributivo de «cada nação» rege os verbos no singular; o ponto e vírgula destaca, sem resolver, o contraste com a não intervenção divina.
