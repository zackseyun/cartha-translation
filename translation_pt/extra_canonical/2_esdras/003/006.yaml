  yaml_path: translation/extra_canonical/2_esdras/003/006.yaml
  text: And you brought him into paradise, which your right hand had planted before the earth came into being.
translation:
  language: pt
  text: E o conduziste ao paraíso, que a tua mão direita havia plantado antes que a terra viesse a existir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: induxisti
  choice: conduziste
  rationale: Reproduz de modo natural o sentido de levar ou fazer entrar, mantendo a segunda pessoa singular dirigida a Deus.
- source_word: paradisum
  choice: paraíso
  rationale: Equivalente tradicional, claro e direto do latim.
- source_word: dextera tua
  choice: a tua mão direita
  rationale: Preserva a imagem antropomórfica e a formulação bíblica do texto-fonte, sem reduzi-la apenas a 'poder'.
- source_word: antequam terra adueṅtaret
  choice: antes que a terra viesse a existir
  rationale: Expressa o surgimento da terra neste contexto cosmogônico e evita a leitura mais limitada de mera aparição visual.
theological_decisions:
- issue: Imagem da mão direita divina
  choice: Manter literalmente 'a tua mão direita'
  alternative: Traduzir de forma interpretativa como 'o teu poder'
  rationale: A imagem concreta pertence ao texto e não deve ser substituída silenciosamente por sua possível interpretação teológica.
- issue: Estado da terra antes do paraíso
  choice: Dizer 'antes que a terra viesse a existir'
  alternative: Dizer 'antes que a terra aparecesse'
  rationale: A formulação escolhida acompanha o valor contextual do verbo latino e a sequência da criação, sem acrescentar uma teoria específica sobre como a terra passou a existir.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com colocação pronominal natural em registro bíblico formal. Não há notas de rodapé neste versículo.
