lexical_decisions:
- source_word: in multitudine magna
  choice: em grande multidão
  rationale: Mantém de forma direta a expressão latina e sua ligação com o contexto anterior.
- source_word: Et factum est
  choice: E aconteceu que
  rationale: Reproduz o giro narrativo latino em português natural e digno.
- source_word: cum educeres
  choice: quando fizeste sair
  rationale: O imperfeito do subjuntivo em uma oração histórica com «cum» é vertido por uma construção temporal idiomática; «fizeste sair» preserva o sentido causativo de conduzir para fora.
- source_word: semen
  choice: a descendência
  rationale: Neste contexto humano e coletivo, «descendência» comunica o sentido figurado de «semente» sem acrescentar um possuidor ausente no fragmento latino.
