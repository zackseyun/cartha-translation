  text: because I saw the desolation of Zion and the abundance of those who lived in Babylon.
translation:
  language: pt
  text: porque vi a desolação de Sião e a abundância dos que viviam na Babilônia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desertionem
  choice: desolação
  rationale: No contexto, designa o estado devastado e abandonado de Sião; “desolação” preserva tanto a ruína quanto o abandono.
- source_word: habundantiam
  choice: prosperidade
  rationale: Aqui contrasta com a desolação de Sião e indica a condição próspera ou abundante dos habitantes da Babilônia; “prosperidade” expressa esse sentido com naturalidade em português.
- source_word: habitabant
  choice: viviam
  rationale: Tradução corrente e natural do imperfeito latino, preservando a ação contínua no passado.
- source_word: in Babilone
  choice: na Babilônia
  rationale: Forma geográfica consagrada em português e adequada ao sentido locativo do latim.
theological_decisions:
- issue: Contraste entre Sião e Babilônia
  choice: Manter o contraste entre “desolação” e “prosperidade” sem explicação adicional
  alternative: Traduzir literalmente habundantiam como “abundância”
  rationale: A formulação preserva a tensão do texto entre a ruína da cidade santa e o bem-estar de seus habitantes no exílio, sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e inteligibilidade internacional. A conjunção inicial “porque” mantém a dependência sintática do contexto anterior.
