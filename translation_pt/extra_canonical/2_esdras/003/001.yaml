id: 2ES.3.1
reference: 2 Esdras 3:1
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: anno tricesimo ruinae civitatis eram in Babylone, ego Salathihel qui et Ezras, et conturbatus sum super cubili meo recumbens, et cogitationes meae ascendebant super cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/001.yaml
  text: In the thirtieth year after the ruin of the city[a], I was in Babylon—I, Salathiel, who am also Ezra—and as I lay on my bed, I was troubled, and my thoughts came up upon my heart,
translation:
  language: pt
  text: No trigésimo ano depois da ruína da cidade, eu estava na Babilônia — eu, Salatiel, que também sou Esdras. Enquanto estava deitado em minha cama, fiquei perturbado, e meus pensamentos subiam ao meu coração.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meus pensamentos vinham à mente”.'
    reason: Oferece o sentido idiomático provável de super cor meum sem apagar, no texto principal, a imagem literal do coração.
lexical_decisions:
- source_word: ruinae civitatis
  choice: depois da ruína da cidade
  rationale: Expressa naturalmente a relação temporal do genitivo latino no contexto, sem identificar a cidade além do que diz a fonte.
- source_word: Salathihel qui et Ezras
  choice: Salatiel, também chamado Esdras
  rationale: Reproduz a dupla designação pessoal de modo claro e corrente em português.
- source_word: conturbatus sum
  choice: fiquei perturbado
  rationale: Conserva a força emocional do verbo latino sem especificar indevidamente medo, tristeza ou confusão.
- source_word: cogitationes meae ascendebant super cor meum
  choice: meus pensamentos subiam ao meu coração
  rationale: Mantém a imagem ascensional e o coração como centro interior do pensamento, embora a expressão seja marcada em português.
theological_decisions:
- issue: Identidade de Salatiel e Esdras
  choice: também chamado Esdras
  alternative: que também sou Esdras
  rationale: A construção latina qui et Ezras indica uma dupla designação, mas não exige uma explicação sobre a natureza dessa identidade.
- issue: Sentido de cor
  choice: coração
  alternative: mente
  rationale: Preserva a antropologia e a imagem da fonte, evitando resolver o coração interior como mera faculdade intelectual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência brasileira. A segunda oração foi separada para evitar um período excessivamente longo. A formulação marcada “subiam ao meu coração” preserva deliberadamente o possível semitismo da fonte latina.
