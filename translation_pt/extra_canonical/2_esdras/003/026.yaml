  text: doing in all things as Adam and all his generations did[a]; for they too had an evil heart.
translation:
  language: pt
  text: fazendo em tudo como fizeram Adão e todas as suas gerações, pois eles também tinham um coração maligno.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “faziam uso de um coração maligno”.'
    reason: Registra de forma concisa a alternativa ligada ao verbo latino *utebantur*, sem alterar o sentido principal nem impor uma explicação interpretativa.
lexical_decisions:
- source_word: in omnibus facientes
  choice: fazendo em tudo
  rationale: Mantém a abrangência da expressão latina e produz uma formulação natural em português.
- source_word: omnes generationes eius
  choice: todas as suas gerações
  rationale: Preserva a referência ampla aos descendentes ou sucessivas gerações de Adão sem restringir o sentido.
- source_word: utebantur ... cor malignum
  choice: tinham um coração maligno
  rationale: Embora utor signifique normalmente “usar”, nesta construção do latim tardio pode indicar possuir ou ter uma condição. “Tinham” evita sugerir que o coração maligno era uma ferramenta utilizada deliberadamente.
- source_word: cor malignum
  choice: um coração maligno
  rationale: “Coração” conserva a imagem antropológica do texto, e o artigo indefinido oferece em português uma expressão natural para a condição atribuída a cada um.
theological_decisions:
- issue: Natureza do “coração maligno”
  choice: tinham um coração maligno
  alternative: faziam uso de um coração maligno
  rationale: A tradução apresenta o coração maligno como uma condição que eles possuíam, sem acrescentar uma explicação doutrinária sobre sua origem ou transmissão.
translation_notes:
  register: Português moderno, claro e digno, com ordem sintática natural e proximidade da estrutura latina. A repetição de “todas” e “também” preserva a ênfase inclusiva do original.
