base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/036.yaml
  text: Men indeed, by name, you may find who have kept your commandments, but nations you will not find.
translation:
  language: pt
  text: De fato, encontrarás homens, individualmente, que guardaram os teus mandamentos; mas não encontrarás nações.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homines quidem
  choice: De fato, encontrarás homens
  rationale: “De fato” expressa o valor enfático e contrastivo de quidem sem tornar a frase artificial em português.
- source_word: per nomina
  choice: individualmente
  rationale: O latim significa literalmente “por nomes”, isto é, pessoas identificáveis uma a uma; “individualmente” comunica esse sentido com clareza e naturalidade.
- source_word: servasse mandata tua
  choice: que guardaram os teus mandamentos
  rationale: “Guardar os mandamentos” é uma formulação bíblica corrente e reproduz o sentido de observância de servare.
- source_word: gentes
  choice: nações
  rationale: Preserva o contraste entre homens particulares e povos considerados coletivamente, sem restringir o termo a um sentido étnico ou religioso.
theological_decisions:
- issue: Contraste entre indivíduos e coletividades
  choice: homens, individualmente / nações
  alternative: homens pelo nome / gentios
  rationale: A tradução mantém o contraste do texto entre pessoas identificáveis e nações inteiras. “Gentios” importaria uma especificação teológica que o contexto e o latim gentes não exigem aqui.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. O futuro simples conserva a força da afirmação dirigida ao interlocutor.
