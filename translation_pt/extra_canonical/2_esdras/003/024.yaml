source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'suscitasti tibi seruum nomine Dauid. Et dixisti ei aedificare ciuitatem nominis tui, et offerre tibi in ea de tuis oblationes. Et factum est hoc annis multis, et deliquerunt qui habitabant ciuitatem, In omnibus facientes sicut fecit Adam et omnes generationes eius, utebantur enim et ipsi cor malignum. Et tradidisti ciuitatem tuam in manibus inimicorum tuorum. Et dixi ego tunc in corde meo : numquid meliora faciunt qui habitant Babilonem? et propter hoc dominauit Sion? Factum est autem cum uenissem huc, et uidi impietates, quorum non est numerus, et delinquentes multos uidit anima mea hoc tricesimo anno; et excessit cor meum, Quoniam uidi quomodo sustines eos peccantes, et pepercisti impie agentibus, et perdidisti populum tuum, et conseruasti inimicos tuos, Et non significasti nihil nemini quomodo debeat derelinqui uia haec. numquid meliora facit Babilon quam Sion? Aut alia gens cognouit te praeter Israel ? aut quae tribus crediderunt testamentis tuis sicut haec Iacob? Quarum merces
    non comparuit, neque labor fructificauit. pertransiens enim pertransiui in gentibus, et uidi habundantes eas, et non memorantes mandatorum tuorum. Nunc ergo pondera in statera nostras iniquitates, et eorum qui habitant in saeculo ; et inuenietur momentum puncti ubi declinet. Aut quando non peccauerunt in conspectu tuo qui habitant terram ? aut quae gens sic obseruauit mandata tua? Homines quidem per nomina inuenies seruasse mandata tua, gentes autem non inuenies.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/024.yaml
  text: And you told him to build a city for your name[a], and in it to offer to you offerings from what is yours.
translation:
  language: pt
  text: E lhe disseste que construísse uma cidade para o teu nome e que nela te oferecesse ofertas do que é teu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Também pode ser traduzido: “e que nela te apresentasse, do que é teu, ofertas”.'
    reason: A ordem das palavras em «de tuis oblationes» permite destacar de modos diferentes que as ofertas procedem daquilo que pertence a Deus.
lexical_decisions:
- source_word: aedificare ciuitatem nominis tui
  choice: construísse uma cidade para o teu nome
  rationale: Mantém a formulação cultual do latim, em que a cidade é edificada para levar, honrar ou abrigar o nome de Deus, sem explicitar apenas uma dessas nuances.
- source_word: offerre tibi in ea
  choice: que nela te oferecesse
  rationale: Reproduz com clareza o destinatário e o lugar da oferta, em português natural.
- source_word: de tuis oblationes
  choice: ofertas do que é teu
  rationale: Preserva tanto o substantivo cultual «ofertas» quanto a afirmação de que aquilo que se oferece já pertence a Deus.
theological_decisions:
- issue: Sentido de «cidade para o teu nome»
  choice: para o teu nome
  alternative: dedicada ao teu nome
  rationale: A tradução escolhida conserva a linguagem teológica condensada do original, sem resolver se a expressão indica dedicação, presença, posse ou reputação.
- issue: Relação entre as ofertas e aquilo que pertence a Deus
  choice: ofertas do que é teu
  alternative: ofertas tiradas dos teus bens
  rationale: 'Mantém a tensão do original: o ser humano oferece a Deus aquilo que já é dele, sem restringir «de tuis» a bens materiais.'
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de «tu» coerente com a oração dirigida a Deus. A repetição «oferecesse ofertas» foi mantida por refletir o cognato latino e por ser aceitável neste registro cultual.
