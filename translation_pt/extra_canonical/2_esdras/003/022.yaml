id: 2ES.3.22
reference: 2 Esdras 3:22
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sunt. Et facta est permanens infirmitas, et lex in corde populi cum malignitate radicis, et discessit quod bonum est, et mansit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/022.yaml
  text: Thus weakness became permanent, and the law was in the heart of the people with the evil root; and what was good departed, and what was evil remained.
translation:
  language: pt
  text: Assim, a fraqueza tornou-se permanente, e a lei estava no coração do povo com a malignidade da raiz; o que era bom se foi, e o que era mau permaneceu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: permanens infirmitas
  choice: a fraqueza tornou-se permanente
  rationale: Reproduz com naturalidade a ideia de uma condição de fraqueza que passou a perdurar, sem especificar além do latim a sua natureza.
- source_word: cum malignitate radicis
  choice: junto com a raiz maligna
  rationale: Expressa a coexistência da lei e da raiz má no coração do povo. Embora o latim diga literalmente “com a malignidade da raiz”, a formulação preserva a imagem da raiz e acompanha o sentido contextual.
- source_word: discessit quod bonum est
  choice: o que era bom se foi
  rationale: “Se foi” comunica de modo claro e atual o afastamento do bem indicado por discessit.
- source_word: mansit
  choice: permaneceu
  rationale: Mantém o contraste lexical entre aquilo que se foi e aquilo que ficou; “o que era mau” é suprido pelo paralelismo e pelo contexto.
theological_decisions:
- issue: Relação entre a lei e a raiz maligna no coração do povo
  choice: “junto com a raiz maligna”
  alternative: “com a malignidade da raiz”
  rationale: A tradução não atribui malignidade à lei nem resolve a tensão entre a presença da lei e a do mal; apresenta ambas coexistindo no coração, conforme o contexto e a sintaxe.
translation_notes:
  register: 'Português moderno, claro e digno, com legibilidade brasileira. A estrutura paralela final foi preservada: o bem parte, enquanto o mal permanece.'
