id: 2ES.3.33
reference: 2 Esdras 3:33
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarum merces non conparuit neque labor fructificavit? pertransiens enim pertransivi in gentibus, et vidi abundantes eas et non memorantes mandatorum tuorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/033.yaml
  text: Yet their reward has not appeared[a], nor has their labor borne fruit. For I have passed through the nations and seen them prospering, though they do not remember your commandments.
translation:
  language: pt
  text: No entanto, a recompensa delas não apareceu, nem o seu trabalho deu fruto? Pois percorri as nações e as vi prosperando[a], embora não se lembrem dos teus mandamentos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “vivendo em abundância”.'
    reason: O particípio latino abundantes pode indicar tanto prosperidade quanto uma condição de abundância.
lexical_decisions:
- source_word: merces
  choice: recompensa
  rationale: Mantém o sentido direto de pagamento, retribuição ou recompensa, sem especificar indevidamente sua natureza.
- source_word: labor fructificavit
  choice: o seu trabalho deu fruto
  rationale: Preserva a metáfora agrícola do latim em uma formulação natural em português.
- source_word: pertransiens enim pertransivi
  choice: Pois percorri
  rationale: Expressa o movimento amplo e efetivo indicado pela construção enfática latina, evitando uma repetição artificial em português.
- source_word: abundantes
  choice: prosperando
  rationale: No contexto, descreve as nações em condição de abundância ou prosperidade; esta escolha é corrente e natural em português.
- source_word: non memorantes
  choice: não se lembrem
  rationale: Reproduz a ideia de não ter presentes na memória os mandamentos, sem ampliá-la automaticamente para 'não obedecer'.
theological_decisions:
- issue: Contraste entre a falta de fruto do grupo anterior e a prosperidade das nações
  choice: Manter o contraste sem explicar a razão da prosperidade
  alternative: Explicitar que se trata de prosperidade material concedida apesar da desobediência
  rationale: O texto constata a tensão, mas não define aqui a natureza da abundância nem formula uma explicação teológica para ela.
- issue: Força de non memorantes
  choice: Traduzir literalmente como 'não se lembrem'
  alternative: Traduzir como 'não obedecem' ou 'desprezam'
  rationale: A alternativa interpretaria a memória como obediência; a redação escolhida preserva a formulação e a tensão do original.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Conservou-se a pergunta do texto latino e a referência feminina plural em “delas” e “as”, sem suprir um antecedente ausente neste versículo isolado.
