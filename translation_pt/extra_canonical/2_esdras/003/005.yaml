source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dedit tibi Adam, corpus mortuum ? sed et ipsum figmentum manuum tuarum erat, et insufflasti in eum spiritum uitae, et factus est uiuens coram te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/005.yaml
  text: And you gave Adam a dead body? Yet he too was the work of your hands, and you breathed into him the spirit of life, and he became alive before you.
translation:
  language: pt
  text: E deste a Adão um corpo morto? Contudo, ele também era obra das tuas mãos; sopraste nele o espírito de vida, e ele se tornou vivo diante de ti.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dedit tibi Adam
  choice: deste a Adão
  rationale: Segue a leitura do texto latino tal como transmitido, embora a construção seja incomum no contexto; evita corrigir silenciosamente a fonte.
- source_word: corpus mortuum
  choice: um corpo morto
  rationale: Tradução direta que preserva a formulação forte e a possível tensão do original.
- source_word: figmentum manuum tuarum
  choice: obra das tuas mãos
  rationale: Expressão natural e digna em português, mantendo a imagem de algo formado por Deus.
- source_word: spiritum uitae
  choice: o espírito de vida
  rationale: Conserva a terminologia tradicional e a possível amplitude semântica de spiritus.
- source_word: factus est uiuens coram te
  choice: ele se tornou vivo diante de ti
  rationale: Reproduz o sentido do latim de maneira clara, sem reduzir coram te a uma simples indicação espacial.
theological_decisions:
- issue: Estado inicial do corpo de Adão
  choice: um corpo morto
  alternative: um corpo sem vida
  rationale: Mantém a força e a estranheza de mortuum, sem harmonizar a expressão com formulações teológicas mais familiares.
- issue: Sentido de spiritus
  choice: espírito
  alternative: sopro
  rationale: O latim diz spiritum uitae; “espírito de vida” preserva a formulação e sua abertura semântica, enquanto o verbo “sopraste” já comunica a imagem do sopro.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa singular coerentes na referência a Deus. A pergunta e a construção incomum do texto-fonte foram preservadas, sem emenda conjectural.
