  text: Et factum est cum coepissent multiplicari qui habitabant super terram, et multiplicauerunt filios et populos et gentes multas, et coeperunt iterato impietatem facere plus quam priores.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/012.yaml
  text: And it happened that when those who lived on the earth began to multiply, they multiplied children and peoples and many nations, and they began again to act impiously, more than those before them.
translation:
  language: pt
  text: E aconteceu que, quando os habitantes da terra começaram a se multiplicar, multiplicaram filhos, povos e muitas nações; e novamente começaram a praticar a impiedade, mais do que os que os precederam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicari / multiplicauerunt
  choice: se multiplicar / multiplicaram
  rationale: Preserva a repetição deliberada do verbo latino, sem introduzir o sentido mais específico de «gerar».
- source_word: impietatem facere
  choice: praticar a impiedade
  rationale: Expressa de modo natural e formal a construção latina, mantendo seu sentido religioso e moral amplo.
- source_word: priores
  choice: os que os precederam
  rationale: Torna explícita em português a referência substantivada aos anteriores, sem determinar além do texto se são antepassados ou gerações anteriores.
theological_decisions:
- issue: Comparação da impiedade com os anteriores
  choice: mais do que os que os precederam
  alternative: mais do que seus antepassados
  rationale: Mantém a amplitude de «priores» e evita restringir a comparação especificamente aos antepassados.
translation_notes:
  register: Português atual, digno e de leitura ampla. A repetição de «multiplicar» foi mantida por fidelidade ao latim, embora resulte numa formulação menos idiomática; o ponto e vírgula organiza o período longo sem alterar sua progressão.
