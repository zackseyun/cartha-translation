source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi ego tunc in corde meo: numquid meliora faciunt qui habitant in Babylone, et propter hoc dominabit Sion?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/028.yaml
  text: Then I said in my heart[28], ‘Do those who live in Babylon act better, and is that why Zion is ruled?’
translation:
  language: pt
  text: 'Então eu disse no meu coração[a]: “Será que os habitantes da Babilônia agem melhor e, por isso, Sião está sob domínio?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim neste ponto é difícil e talvez reflita uma linha alterada durante a transmissão. A queixa de Esdras contrasta a aparente prosperidade da Babilônia com a queda de Sião; a tradução preserva a pergunta retórica sem impor uma reconstrução mais fluente.
    reason: alternative_reading
lexical_decisions:
- source_word: in corde meo
  choice: no meu coração
  rationale: Mantém a expressão idiomática semítica preservada pelo latim, natural e compreensível em português bíblico atual.
- source_word: meliora faciunt
  choice: agem melhor
  rationale: Traduz diretamente a comparação moral ou comportamental sem especificar atos que o texto não nomeia.
- source_word: qui habitant in Babylone
  choice: os habitantes da Babilônia
  rationale: Formulação concisa e natural que conserva a referência aos que vivem na Babilônia.
- source_word: dominabit Sion
  choice: Sião está sob domínio
  rationale: O latim transmitido é difícil; esta formulação conserva Sião como aquilo que é dominado, sem inserir explicitamente a Babilônia como sujeito.
theological_decisions:
- issue: Relação entre a conduta da Babilônia e a sujeição de Sião
  choice: Preservar a pergunta retórica que sugere, sem afirmar, que a melhor conduta dos babilônios explicaria a sujeição de Sião.
  alternative: Explicitar que a Babilônia conquistou ou passou a dominar Sião.
  rationale: O texto expressa a perplexidade de Esdras, mas não identifica de modo inequívoco o agente de dominabit; explicitar a Babilônia resolveria indevidamente a dificuldade textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A construção “disse no meu coração” preserva o sabor bíblico; “está sob domínio” evita a forma pouco natural e ambígua de uma tradução excessivamente literal do latim.
