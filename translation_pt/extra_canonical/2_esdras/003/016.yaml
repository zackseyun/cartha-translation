translation:
  language: pt
  text: dele, e lhe deste Isaque; e a Isaque deste Jacó e Esaú. Separaste Jacó para ti, mas separaste Esaú; e Jacó se tornou
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: segregasti tibi
  choice: Separaste Jacó para ti
  rationale: Preserva tanto a ideia de pôr à parte quanto a destinação expressa pelo dativo tibi, em português natural.
- source_word: separasti
  choice: afastaste
  rationale: 'Distingue este verbo do anterior em português e conserva o contraste: Jacó é separado para Deus, enquanto Esaú é afastado.'
- source_word: factus est
  choice: se tornou
  rationale: Equivalente natural do latim e mantém a frase incompleta no limite do fragmento.
theological_decisions:
- issue: Contraste entre Jacó e Esaú
  choice: Separaste Jacó para ti, mas afastaste Esaú
  alternative: Escolheste Jacó para ti, mas rejeitaste Esaú
  rationale: Evita introduzir linguagem teológica mais específica de eleição e rejeição que não aparece explicitamente nos verbos latinos, preservando o paralelismo e sua tensão.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe próxima do latim sem rigidez artificial. O início e o fim fragmentários foram preservados porque o versículo fornecido continua uma frase anterior e termina antes de completar a seguinte.
