  yaml_path: translation/extra_canonical/2_esdras/003/004.yaml
  text: And I said, “O Lord who rules, did you not speak from the beginning, when you formed the earth—and this you did alone—and commanded the dust
translation:
  language: pt
  text: 'E eu disse: “Ó Senhor soberano, não falaste desde o princípio, quando formaste a terra — e fizeste isso sozinho — e ordenaste ao pó'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Senhor soberano
  rationale: Reproduz a invocação enfática e a ideia de domínio em português natural e digno, sem a formulação pouco idiomática “Senhor dominador”.
- source_word: ab initio
  choice: desde o princípio
  rationale: Preserva o sentido temporal de origem ou ponto inicial expresso por ab initio.
- source_word: plasmasti
  choice: formaste
  rationale: Expressa o ato de moldar ou dar forma, apropriado ao contexto da criação da terra.
- source_word: imperasti pulveri
  choice: ordenaste ao pó
  rationale: Mantém a construção do latim e a personificação implícita do pó como destinatário da ordem.
theological_decisions:
- issue: A atuação exclusiva de Deus na formação da terra
  choice: e fizeste isso sozinho
  alternative: e isso somente
  rationale: Entende solus como referente ao sujeito divino, em consonância com a sintaxe e com a camada inglesa auditada, sem acrescentar agentes ou mecanismos de criação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A oração permanece incompleta no fim, como no trecho-fonte fornecido, sem acrescentar conteúdo do versículo seguinte.
