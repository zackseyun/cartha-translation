lexical_decisions:
- source_word: nihil nemini
  choice: nada a ninguém
  rationale: Reproduz os dois elementos negativos do latim e mantém a ligação sintática com o final do versículo anterior, sem acrescentar um verbo ausente neste segmento.
- source_word: quomodo debeat derelinqui via haec
  choice: sobre como se deve abandonar este caminho
  rationale: Emprega uma construção impessoal natural em português para o subjuntivo passivo latino, preservando a ideia de necessidade expressa por debeat.
- source_word: numquid
  choice: Acaso
  rationale: Introduz uma pergunta retórica que, no contexto, tende a esperar resposta negativa.
- source_word: meliora facit
  choice: faz melhor
  rationale: Tradução direta e idiomática que conserva a formulação comparativa abrangente do latim, sem especificar em que sentido Babilônia faria melhor.
- source_word: Babylon quam Sion
  choice: Babilônia ... do que Sião
  rationale: Mantém os nomes tradicionais e expressa com clareza a comparação latina.
theological_decisions:
- issue: Comparação moral entre Babilônia e Sião
  choice: faz melhor
  alternative: age melhor
  rationale: A opção principal conserva a amplitude de facit e evita restringir a pergunta apenas à conduta moral; a alternativa legítima é registrada em nota.
- issue: Fragmento sintaticamente dependente do versículo anterior
  choice: manter o início fragmentário conforme a divisão da fonte
  alternative: suprir 'não revelaste' neste versículo
  rationale: A divisão de Bensly coloca nihil nemini no versículo 31, mas a oração depende de et non significasti no versículo 30. Não se repete o verbo para não alterar a versificação nem introduzir material ausente do segmento.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O começo em minúscula e a forma fragmentária foram mantidos porque o versículo continua sintaticamente a oração anterior na edição latina.
