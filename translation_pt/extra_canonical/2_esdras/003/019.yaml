source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tremere fecisti abyssos, et conturbasti saeculum. Et transiit gloria tua portas quattuor, ignis et terrae motus et spiritus et gelus; ut dares semini Iacob legem, et generationi Israel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/019.yaml
  text: and made the depths tremble and troubled the age. And your glory passed through the four gates—fire and earthquake and wind and frost—that you might give the law to the seed of Jacob[19], and your commandment to the generation of Israel.
translation:
  language: pt
  text: e fizeste tremer os abismos e perturbaste a era. E a tua glória passou pelas quatro portas — fogo, terremoto, vento e geada —, para dares a lei à descendência de Jacó[a] e à geração de Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão «a tua glória passou pelas quatro portas — fogo, terremoto, vento e geada» é textual e imageticamente difícil. A tradução conserva a estranha imagem teofânica do latim, sem harmonizá-la com Êxodo.
    reason: textual_variant
lexical_decisions:
- source_word: abyssos
  choice: os abismos
  rationale: Preserva a imagem plural do latim e sua força cósmica.
- source_word: saeculum
  choice: o mundo
  rationale: Neste contexto cósmico, 'mundo' comunica com naturalidade o âmbito criado perturbado, embora o termo latino também possa indicar era ou século.
- source_word: spiritus
  choice: vento
  rationale: Na série de fenômenos teofânicos, o sentido meteorológico de spiritus é o mais natural.
- source_word: gelus
  choice: geada
  rationale: Mantém o fenômeno de frio intenso expresso pelo latim sem o tornar abstrato.
- source_word: semini Iacob
  choice: à descendência de Jacó
  rationale: Expressa em português corrente o sentido coletivo de 'semente'.
theological_decisions:
- issue: As quatro portas e os quatro fenômenos teofânicos
  choice: 'Manter literalmente a imagem difícil: ''pelas quatro portas — fogo, terremoto, vento e geada'''
  alternative: Harmonizar a descrição com a teofania do Sinai em Êxodo
  rationale: O latim apresenta uma formulação estranha, mas inteligível; preservá-la evita resolver silenciosamente uma dificuldade textual e imagética.
- issue: Ausência de complemento após 'generationi Israel' no texto latino fornecido
  choice: Traduzir apenas 'e à geração de Israel'
  alternative: Acrescentar 'o teu mandamento', como no inglês de consulta
  rationale: O texto latino apresentado não contém um substantivo correspondente a 'mandamento'; não se deve suprir conteúdo sem apoio na fonte.
translation_notes:
  register: Português moderno, digno e acessível, com preferência por formulações naturais no Brasil e compreensíveis internacionalmente. A construção e a imagética incomuns do original foram preservadas.
source_grounding:
  english_pob_role: consult_only
