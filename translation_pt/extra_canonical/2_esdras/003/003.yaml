source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uentilatus est spiritus meus ualde, et coepi loqui ad altissimum uerba timorata,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/003.yaml
  text: And my spirit was greatly stirred[a], and I began to speak fearful words to the Most High,
translation:
  language: pt
  text: E meu espírito ficou profundamente agitado,[a] e comecei a dirigir ao Altíssimo palavras cheias de temor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “foi fortemente sacudido”.'
    reason: Registra a imagem mais concreta de uentilatus est, que pode descrever o espírito como violentamente sacudido ou revolvido.
lexical_decisions:
- source_word: uentilatus est
  choice: ficou profundamente agitado
  rationale: O verbo latino descreve o espírito como sacudido ou revolvido intensamente. “Ficou profundamente agitado” preserva a força da imagem em português natural.
- source_word: spiritus meus
  choice: meu espírito
  rationale: Correspondência direta ao latim, mantendo aberta a referência à dimensão interior do narrador.
- source_word: altissimum
  choice: Altíssimo
  rationale: Título divino tradicional e claro em português, com a reverência indicada pelo contexto.
- source_word: uerba timorata
  choice: palavras cheias de temor
  rationale: Evita a ambiguidade moderna de “palavras temerosas”, que poderia sugerir palavras assustadoras, e expressa que o discurso é proferido com temor ou apreensão.
theological_decisions:
- issue: Natureza do temor ao falar com Deus
  choice: palavras cheias de temor
  alternative: palavras ansiosas
  rationale: O latim não especifica se o sentimento é reverência, medo ou apreensão. A formulação escolhida preserva essa amplitude sem reduzir o sentido a ansiedade psicológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível. A ordem foi levemente naturalizada, sem eliminar a intensidade do latim nem definir em excesso a natureza do temor.
