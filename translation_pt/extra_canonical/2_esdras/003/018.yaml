lexical_decisions:
- source_word: inclinasti caelos
  choice: inclinaste os céus
  rationale: Reproduz diretamente a imagem cósmica do latim, com linguagem natural e solene.
- source_word: statuisti terram
  choice: firmaste a terra
  rationale: Traduz o texto latino apresentado, no qual statuisti significa estabelecer, firmar ou pôr em seu lugar, sem adotar no corpo do texto a emenda conjectural 'fizeste tremer'.
- source_word: commouisti orbem
  choice: moveste o mundo
  rationale: Mantém a distinção verbal do latim e verte orbem, neste contexto cósmico, pelo português corrente 'mundo'.
theological_decisions:
- issue: Sequência de ações cósmicas e variante textual em statuisti terram
  choice: firmaste a terra
  alternative: fizeste tremer a terra
  rationale: O texto-base latino fornecido lê statuisti, 'firmaste/estabeleceste'. A leitura 'fizeste tremer' é apoiada por versões antigas e pode refletir um texto grego anterior, mas deve ser indicada em nota, não inserida silenciosamente no texto principal.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo verbal conciso. A forma de segunda pessoa do singular preserva o discurso direto dirigido a Deus no contexto.
