  text: E isso aconteceu durante muitos anos. E os que habitavam a cidade a abandonaram,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est hoc
  choice: isso aconteceu
  rationale: Reproduz de modo natural e próximo o sentido do latim, sem transformar a expressão em mera continuidade temporal.
- source_word: annis multis
  choice: durante muitos anos
  rationale: Expressa claramente a duração indicada pelo ablativo temporal latino.
- source_word: dereliquerunt
  choice: a abandonaram
  rationale: 'Traduz o verbo como abandono e explicita, por meio do pronome feminino, o objeto subentendido mais provável: a cidade.'
- source_word: qui habitabant civitatem
  choice: os que habitavam a cidade
  rationale: Mantém a construção relativa e o sentido residencial de habitabant em português corrente e digno.
theological_decisions:
- issue: O sentido de dereliquerunt
  choice: a abandonaram
  alternative: pecaram
  rationale: O latim atestado significa que eles deixaram ou abandonaram; não há fundamento lexical neste texto para introduzir a ideia de pecado.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “E” preserva a coordenação simples do original. A vírgula final foi mantida porque o versículo continua sintaticamente no contexto seguinte.
