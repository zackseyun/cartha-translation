source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lex tua in eis fructum. Cor enim malignum baiolans primus Adam transgressus et uictus est, sed et omnes qui ex eo nati
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/021.yaml
  text: For the first Adam, bearing an evil heart, transgressed and was overcome; and so also did all who were born from him.
translation:
  language: pt
  text: Pois o primeiro Adão, levando em si um coração maligno, transgrediu e foi vencido; e o mesmo aconteceu com todos os que dele nasceram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Cor enim malignum baiolans
  choice: Pois... levando em si um coração maligno
  rationale: Mantém a imagem de portar ou carregar um coração maligno, expressa por baiolans, em português natural; enim é vertido por “Pois”, preservando a relação explicativa com o contexto.
- source_word: primus Adam
  choice: o primeiro Adão
  rationale: Reprodução direta da expressão latina, que identifica Adão como o primeiro.
- source_word: transgressus et uictus est
  choice: transgrediu e foi vencido
  rationale: 'Preserva os dois verbos e a distinção de voz: Adão comete a transgressão e, em seguida, é vencido.'
- source_word: sed et omnes qui ex eo nati
  choice: e o mesmo aconteceu com todos os que dele nasceram
  rationale: O latim elíptico estende aos descendentes de Adão os predicados anteriores. A formulação portuguesa explicita apenas a elipse gramatical, sem definir de que modo cada predicado se aplica.
theological_decisions:
- issue: Extensão da transgressão e da derrota de Adão aos seus descendentes
  choice: “e o mesmo aconteceu com todos os que dele nasceram”
  alternative: “e também todos os que dele nasceram transgrediram e foram vencidos”
  rationale: A redação escolhida preserva a abrangência e a concisão da elipse latina, sem acrescentar uma explicação doutrinária sobre herança, culpa ou modo de participação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. “Coração maligno” conserva a força moral do latim; “levando em si” evita a possível leitura meramente física de “carregando” e mantém a metáfora.
