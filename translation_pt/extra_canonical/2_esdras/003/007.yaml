source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et huic mandasti diligentiam tuam ; et praeteriit eam, et statim instituisti in eum mortem et in nationibus eius, et natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/007.yaml
  text: And to him you gave your command; but he transgressed it, and at once you appointed death for him and for his descendants, and from him were born nations and tribes, peoples and clans, without number.
translation:
  language: pt
  text: E a ele deste o teu mandamento; mas ele o transgrediu, e imediatamente estabeleceste a morte para ele e para os seus descendentes. Dele nasceram nações e tribos, povos e clãs sem número.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: diligentiam tuam
  choice: o teu mandamento
  rationale: No contexto, a expressão designa a ordem ou incumbência divina dada a Adão. “Mandamento” comunica naturalmente essa força normativa sem acrescentar a ideia de que fosse um único mandamento.
- source_word: praeteriit eam
  choice: ele o transgrediu
  rationale: O verbo latino indica ultrapassar ou violar o que foi ordenado; “transgrediu” preserva o sentido moral e a referência ao mandamento.
- source_word: instituisti ... mortem
  choice: determinaste a morte
  rationale: Reproduz a ideia de estabelecer ou decretar a morte, sem especificar além do texto a maneira como ela foi imposta.
- source_word: in nationibus eius
  choice: para os seus descendentes
  rationale: Embora literalmente incomum, “em suas nações”, a expressão no contexto aponta para a posteridade de Adão. “Descendentes” oferece o sentido contextual de modo claro e concorda com a sequência sobre os povos nascidos dele.
- source_word: gentes et tribus, populi et cognationes
  choice: nações e tribos, povos e clãs
  rationale: Mantém os quatro termos coletivos e sua progressão, usando equivalentes atuais e distintos em português.
- source_word: quorum non est numerus
  choice: sem número
  rationale: Formulação concisa e digna que preserva a ideia de uma multidão incontável.
theological_decisions:
- issue: Alcance da morte decretada após a transgressão de Adão
  choice: para ele e para os seus descendentes
  alternative: nele e em suas nações
  rationale: A tradução comunica o alcance corporativo expresso pelo latim no contexto, sem desenvolver uma explicação doutrinária sobre culpa herdada ou sobre o modo de transmissão da morte.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e tratamento divino na segunda pessoa do singular. A tradução conserva a enumeração retórica do original e evita a adição de “único” ao mandamento.
