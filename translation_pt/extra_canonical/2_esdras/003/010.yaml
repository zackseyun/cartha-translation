source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est in uno casus corum, sicut Adac mors, sic et his diluuium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/010.yaml
  text: 'And one fate came upon them all: as death came to Adam, so the flood came to these also.'
translation:
  language: pt
  text: 'E um só destino sobreveio a todos eles: assim como a morte veio a Adão, também o dilúvio veio sobre estes.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in uno casus
  choice: um só destino
  rationale: Expressa a ideia de um destino comum e único, preservando de perto a formulação latina, embora o texto transmitido seja sintaticamente difícil.
- source_word: corum (provavelmente eorum)
  choice: a todos eles
  rationale: Segue o sentido contextual e a leitura refletida pela tradição editorial, referindo-se coletivamente ao grupo anterior.
- source_word: sicut Adac mors
  choice: assim como a morte veio a Adão
  rationale: Torna natural em português a construção nominal elíptica do latim sem alterar a comparação.
- source_word: sic et his diluuium
  choice: também o dilúvio veio a estes
  rationale: Mantém o demonstrativo his como “estes” e traduz et como “também”, preservando o paralelo contrastivo.
theological_decisions:
- issue: Paralelo entre a morte de Adão e o dilúvio sobre seus descendentes
  choice: Preservar a comparação direta sem explicar sua natureza
  alternative: Interpretar ambos explicitamente como castigos divinos ou consequências do pecado
  rationale: O versículo estabelece o paralelo, mas não explicita aqui sua relação teológica; a tradução não deve resolver além do texto.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima ao latim. “Sobreveio” conserva a solenidade narrativa sem soar arcaico; “um só destino” mantém a ênfase do texto-fonte.
