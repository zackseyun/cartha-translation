  text: quoniam vidi quomodo sustines eos peccantes et pepercisti impie agentibus, et perdidisti populum tuum et conservasti inimicos tuos, et non significasti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/030.yaml
  text: For I saw how you endure those who sin and have spared those who act impiously[a], but have destroyed your people and preserved your enemies, and have not made it clear
translation:
  language: pt
  text: Pois vi como suportas os que pecam e poupaste os que agem de modo ímpio, mas destruíste o teu povo e preservaste os teus inimigos, e não o tornaste claro.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sustines
  choice: suportas
  rationale: Preserva o presente latino e expressa a tolerância continuada diante dos que pecam.
- source_word: pepercisti
  choice: poupaste
  rationale: Mantém o perfeito latino, distinguindo esta ação já realizada do presente de “suportas”.
- source_word: impie agentibus
  choice: os que agem de modo ímpio
  rationale: Reproduz o sentido ativo da expressão sem recorrer a um rótulo substantivado potencialmente mais amplo.
- source_word: perdidisti
  choice: destruíste
  rationale: Mantém o aspecto de ação consumada do perfeito latino no contexto da queixa de Esdras.
- source_word: conservasti
  choice: preservaste
  rationale: Expressa a conservação dos inimigos como ação realizada e mantém o paralelismo com “destruíste”.
- source_word: non significasti
  choice: não o tornaste claro
  rationale: Conserva a formulação incompleta do texto latino e evita acrescentar o conteúdo daquilo que Deus não tornou claro.
theological_decisions:
- issue: Contraste entre a tolerância dos pecadores e o tratamento dado ao povo de Deus
  choice: mas destruíste o teu povo
  alternative: e destruíste o teu povo
  rationale: Embora o latim use a conjunção “et”, o contexto estabelece um contraste forte; “mas” o comunica naturalmente sem alterar a substância da acusação.
- issue: Alternância dos tempos verbais
  choice: presente em “suportas” e pretérito perfeito em “poupaste”, “destruíste” e “preservaste”
  alternative: uniformizar todos os verbos no presente
  rationale: A alternância está explicitamente marcada no latim e sustenta a tensão entre a tolerância atual e atos já consumados.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas verbais em segunda pessoa singular coerentes com a fala dirigida a Deus. A oração final permanece deliberadamente aberta, como no texto latino fornecido.
