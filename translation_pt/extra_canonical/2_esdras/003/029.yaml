id: 2ES.3.29
reference: 2 Esdras 3:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Factum est autem cum venissem huc, et vidi impietates quorum non est numerus, et delinquentes multos vidit anima mea hoc tricesimo anno. et excessit cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/029.yaml
  text: But when I came here and saw impieties beyond number[a], my soul saw many sinners in this thirtieth year, and my heart overflowed.
translation:
  language: pt
  text: Aconteceu, porém, que, quando vim para cá, vi atos de impiedade sem conta; neste trigésimo ano, minha alma viu muitos pecadores, e meu coração desfaleceu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “meu coração ficou transtornado”. A expressão latina também pode sugerir que o coração falhou ou saiu de seu estado normal.'
    reason: Preservar a amplitude idiomática de “excessit cor meum”, cuja força exata não é totalmente determinada.
lexical_decisions:
- source_word: impietates
  choice: atos de impiedade
  rationale: Expressa a ideia de condutas ímpias de modo natural em português, sem reduzir o termo apenas a uma disposição interior.
- source_word: quorum non est numerus
  choice: sem conta
  rationale: Equivalente idiomático e fiel a “dos quais não há número”, indicando quantidade incalculável.
- source_word: delinquentes
  choice: pecadores
  rationale: No contexto da queixa moral de Esdras, designa os que transgridem; “pecadores” é claro, corrente e não excessivamente jurídico.
- source_word: vidit anima mea
  choice: minha alma viu
  rationale: Mantém a personificação e a repetição deliberada do verbo “ver” presentes no latim.
- source_word: excessit cor meum
  choice: meu coração desfaleceu
  rationale: Traduz a expressão como colapso ou profunda perturbação interior, evitando o sentido emocional moderno de “transbordou”, que não é exigido pelo latim.
theological_decisions:
- issue: Natureza da reação expressa por “excessit cor meum”
  choice: meu coração desfaleceu
  alternative: meu coração ficou transtornado
  rationale: A formulação principal comunica abatimento intenso sem acrescentar uma interpretação doutrinária; a nota preserva a amplitude da expressão latina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A ordem foi levemente ajustada para evitar que “neste trigésimo ano” pareça modificar apenas “pecadores”, sem eliminar a repetição enfática de “vi/viu” do texto latino.
