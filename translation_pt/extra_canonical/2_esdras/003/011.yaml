base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/011.yaml
  text: But you left one of them, Noah with his household; from him came all the righteous.
translation:
  language: pt
  text: Mas deixaste um deles, Noé com a sua família; dele procederam todos os justos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dereliquisti
  choice: deixaste
  rationale: Reproduz diretamente a ideia de deixar ou preservar alguém dentre os demais, sem explicitar além do latim.
- source_word: domo sua
  choice: a sua família
  rationale: Neste contexto, domus designa as pessoas da casa de Noé, não o edifício; “família” é natural e claro em português moderno.
- source_word: ex eo
  choice: dele procederam
  rationale: Expressa origem ou descendência mantendo a formulação abrangente do latim.
- source_word: iustos omnes
  choice: todos os justos
  rationale: Preserva a afirmação universal e a terminologia moral-teológica do texto-fonte.
theological_decisions:
- issue: Sentido de “todos os justos”
  choice: Manter literalmente “todos os justos”
  alternative: Explicitar como “todos os descendentes justos” ou “toda a humanidade justa”
  rationale: O latim não define o alcance exato da expressão; a tradução preserva essa possível tensão em vez de a resolver.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com fluidez brasileira. Emprega-se “tu” implícito na forma verbal, coerente com a oração dirigida a Deus e sem repetição desnecessária do pronome.
