source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: temporum finem solo secrete noctu. Et disposuisti ei testamentum aeternum, et dixisti ei ut non unquam derelinqueres semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/015.yaml
  text: And you established with him an everlasting covenant, and said that you would never forsake his seed.
translation:
  language: pt
  text: E estabeleceste com ele uma aliança eterna e lhe disseste que jamais abandonarias a sua descendência.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testamentum aeternum
  choice: uma aliança eterna
  rationale: No contexto da relação divina com o patriarca, “aliança” expressa com clareza o sentido pactuai de testamentum, enquanto “eterna” preserva diretamente aeternum.
- source_word: semen
  choice: a sua descendência
  rationale: Embora o sentido literal seja “semente”, aqui o termo designa os descendentes; “descendência” é natural em português moderno e mantém o valor coletivo.
- source_word: derelinqueres
  choice: abandonarias
  rationale: Traduz a ideia de deixar ou desamparar, em formulação corrente e digna.
theological_decisions:
- issue: Relação da promessa com a descendência do patriarca
  choice: “jamais abandonarias a sua descendência”
  alternative: “nunca abandonarias a sua semente”
  rationale: A tradução não especifica como a promessa se cumpre nem restringe seu alcance; apenas verte o sentido coletivo de semen de modo inteligível.
translation_notes:
  register: Português moderno, claro e solene, com formas verbais na segunda pessoa do singular para conservar a oração dirigida diretamente a Deus. O fragmento inicial “temporum finem solo secrete noctu” foi entendido como pertencente ao contexto anterior, conforme a delimitação do versículo apresentada na camada inglesa auditada.
