  choice: começou a consolá-la
  rationale: Reproduz de modo natural em português o aspecto incoativo de “inchoasti” e mantém explícito o objeto feminino de “eam”.
- source_word: Nunc autem iam
  choice: mas agora já
  rationale: Mantém os três elementos do latim e a formulação deliberadamente incompleta causada pelo limite do versículo, sem antecipar o conteúdo do versículo seguinte.
