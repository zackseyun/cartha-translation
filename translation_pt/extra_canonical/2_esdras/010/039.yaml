  yaml_path: translation/extra_canonical/2_esdras/010/039.yaml
  text: For he has seen your upright way[a], because you were grieving without ceasing for your people and mourning greatly for Zion.
translation:
  language: pt
  text: Pois ele viu o seu caminho reto[a], porque você se entristecia sem cessar pelo seu povo e lamentava profundamente por Sião.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seu modo correto de proceder».'
    reason: Esclarece o sentido moral de rectam uiam sem eliminar a metáfora de «caminho» do texto principal.
lexical_decisions:
- source_word: rectam uiam tuam
  choice: o seu caminho reto
  rationale: Preserva a metáfora do latim e comunica conduta moral íntegra; em português, «caminho reto» é natural nesse sentido, embora também possa ser entendido literalmente.
- source_word: sine intermissione contristabaris
  choice: você se entristecia sem cessar
  rationale: Reproduz a continuidade da tristeza expressa por sine intermissione e pelo imperfeito contristabaris.
- source_word: ualde lugebas
  choice: lamentava profundamente
  rationale: Expressa a grande intensidade de ualde e o luto ou pesar de lugebas em português corrente e digno.
theological_decisions:
- issue: Sentido de quoniam
  choice: porque
  alternative: pois / visto que
  rationale: 'Mantém explicitamente a relação causal: o caminho reto foi reconhecido em razão da tristeza contínua pelo povo e do profundo lamento por Sião.'
- issue: Referente de «ele»
  choice: Preservar o pronome sem identificar o referente no versículo
  alternative: Explicitar o nome do agente a partir do contexto
  rationale: O fragmento fornecido contém apenas a continuação da frase; identificar o agente aqui resolveria uma referência que o texto deste versículo deixa dependente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por «você» conforme o singular latino. A formulação mantém o paralelismo entre a tristeza contínua pelo povo e o profundo lamento por Sião.
