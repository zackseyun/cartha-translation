  text: see our mourning and what has happened to us? For Zion[a], the mother of us all, is grieving in sorrow and humiliation
translation:
  language: pt
  text: vês o nosso luto e o que nos aconteceu? Pois Sião, a mãe de todos nós, está profundamente entristecida, em tristeza e humilhação.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: luctum
  choice: luto
  rationale: Expressa o pesar coletivo e profundo do latim sem restringi-lo apenas ao ato de chorar.
- source_word: quae nobis contigerunt
  choice: o que nos aconteceu
  rationale: Formulação natural em português que preserva o sentido abrangente do plural neutro latino.
- source_word: Sion mater nostra omnium
  choice: Sião, a mãe de todos nós
  rationale: Reproduz a aposição e entende nostra omnium como 'de todos nós', sem acrescentar uma segunda referência à maternidade.
- source_word: in tristitia contristatur et humilitate
  choice: está entristecida em meio à tristeza e à humilhação
  rationale: Mantém os dois substantivos do latim e o vínculo etimológico entre tristitia e contristatur de modo inteligível, evitando introduzir a ideia ausente de que Sião já 'foi abatida'.
theological_decisions:
- issue: Personificação de Sião como mãe
  choice: Preservar diretamente 'Sião, a mãe de todos nós'
  alternative: Explicitar Sião como Jerusalém ou como figura de uma comunidade religiosa específica
  rationale: O texto personifica Sião, mas não identifica aqui de modo explícito todo o alcance teológico dessa imagem; a tradução não deve resolvê-lo.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A abertura em minúscula preserva o caráter de continuação indicado no texto de consulta; a pergunta mantém a forma de uides. A expressão repetitiva do latim foi suavizada apenas o necessário para soar natural, sem eliminar 'tristeza' nem 'humilhação'.
