  yaml_path: translation/extra_canonical/2_esdras/010/013.yaml
  text: whom I bore with sorrows and brought forth with pains; but the earth, according to the way of the earth, goes away, as does the multitude now present in it’—
translation:
  language: pt
  text: a quem dei à luz com tristezas e com dores a fiz nascer; mas a terra, seguindo o curso da terra, vai embora, assim como a multidão que agora nela está’—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quem
  choice: a quem
  rationale: Mantém o pronome relativo masculino e a ligação sintática com o antecedente no contexto.
- source_word: cum meroribus peperi
  choice: dei à luz em meio a tristezas
  rationale: Expressa o parto indicado por peperi e conserva o sentido emocional de meroribus sem sugerir apenas dor física.
- source_word: cum doloribus genui
  choice: gerei com dores
  rationale: Preserva o paralelismo da segunda oração e traduz doloribus de modo direto.
- source_word: secundum uiam terrae
  choice: seguindo o curso da terra
  rationale: Verte o latinismo literalmente possível como uma expressão portuguesa natural para o modo ou ciclo próprio da terra.
- source_word: multitudo praesens
  choice: a multidão que agora nela está
  rationale: Entende praesens como presença atual na terra, de acordo com a construção contextual.
theological_decisions:
- issue: Relação entre a partida da terra e a da multidão
  choice: “a terra ... vai embora, assim como a multidão”
  alternative: “a multidão que agora nela está foi embora”
  rationale: A pontuação e a sintaxe do latim são difíceis, mas terra é o nominativo mais imediato de abiit; a redação mantém essa leitura sem acrescentar uma interpretação teológica.
translation_notes:
  register: Português moderno, digno e acessível, com cadência poética. A construção conserva o contraste introduzido por autem e a personificação da terra, evitando um decalque pouco natural de “caminho da terra”.
