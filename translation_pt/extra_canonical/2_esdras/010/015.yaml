  text: Now therefore, keep your grief within yourself, and bravely bear the misfortunes that have happened to you.
translation:
  language: pt
  text: Agora, pois, guarda dentro de ti mesma a tua dor e suporta com coragem as desgraças que te aconteceram.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: retine apud temet ipsam
  choice: guarda dentro de ti
  rationale: Reproduz de modo natural a ideia de conter ou conservar a dor consigo mesma; o feminino latino não precisa ser marcado no pronome português.
- source_word: dolorem tuum
  choice: a tua dor
  rationale: Mantém o sentido direto e pessoal de dolor, sem restringi-lo indevidamente a luto ou tristeza.
- source_word: fortiter fer
  choice: suporta com coragem
  rationale: Expressa tanto a resistência indicada por fer quanto a coragem ou firmeza de fortiter em português corrente e digno.
- source_word: casus
  choice: desgraças
  rationale: No contexto, designa acontecimentos adversos ou infortúnios, não meros eventos neutros.
- source_word: quae tibi contigerunt
  choice: que te aconteceram
  rationale: Tradução direta e idiomática da oração relativa, preservando que as adversidades sobrevieram à interlocutora.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com tratamento em segunda pessoa singular para preservar a interpelação direta. A formulação segue de perto o latim sem soar artificial.
