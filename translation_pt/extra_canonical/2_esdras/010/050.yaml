  text: For because you were grieved from your soul, and because you suffer for her from your whole heart, he showed you the splendor of her glory and the beauty of her majesty. Therefore I told you to remain in
translation:
  language: pt
  text: Porque você se entristeceu profundamente e porque sofre por ela de todo o coração, ele lhe mostrou o esplendor da glória dela e a beleza da sua majestade. Por isso, eu lhe disse que permanecesse em
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex animo contristatus es
  choice: você se entristeceu no íntimo da sua alma
  rationale: Preserva a referência explícita a animus sem recorrer à formulação pouco natural “a partir da alma”; “no íntimo” comunica a profundidade da tristeza.
- source_word: ex toto corde pateris pro ea
  choice: sofre por ela de todo o coração
  rationale: Mantém a imagem de totalidade interior e o referente feminino, com ordem natural em português.
- source_word: claritatem gloriae eius
  choice: o esplendor da glória dela
  rationale: Traduz claritas como brilho esplêndido e conserva a construção genitiva, evitando reduzir gloria a mera aparência.
- source_word: pulchritudinem decoris eius
  choice: a beleza da sua majestade
  rationale: Distingue decor de claritas e expressa a dignidade/imponência do termo latino, sem repetir “esplendor”.
- source_word: ut maneres in
  choice: que permanecesse em
  rationale: Mantém deliberadamente a frase incompleta do testemunho fornecido, que continua no versículo seguinte.
theological_decisions:
- issue: Sujeito de ostendit
  choice: ele lhe mostrou
  alternative: '[o Altíssimo] lhe mostrou'
  rationale: O latim traz apenas o sujeito implícito; não se insere uma identificação interpretativa ausente deste versículo.
- issue: Referente dos pronomes femininos
  choice: por ela / da glória dela / da sua majestade
  alternative: pela cidade / da glória da cidade / da majestade da cidade
  rationale: Conserva o referente pronominal do texto e evita explicitação interpretativa desnecessária.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição causal de quoniam... et quoniam foi preservada. O final suspenso foi mantido porque a fonte termina em “in” e a oração prossegue no contexto seguinte.
