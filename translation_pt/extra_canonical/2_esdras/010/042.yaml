source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'non speciem mulieris uides, sed apparuit tibi ciuitas aedificari; Et quoniam enarrabat tibi de casu filii sui, haec absolutio est:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/042.yaml
  text: 'You no longer see the form of a woman[a], but a city appeared to you being built. And as for her telling you about the misfortune of her son, this is the interpretation:'
translation:
  language: pt
  text: 'Você não vê a figura de uma mulher[a]; em vez disso, apareceu-lhe uma cidade sendo construída. E, quanto ao que ela lhe contava sobre a desgraça do filho dela, esta é a interpretação:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Você já não vê a figura de uma mulher”.'
    reason: O latim non nega diretamente o ato de ver; no contexto da transformação da mulher em cidade, também pode ser entendido temporalmente como “já não”.
lexical_decisions:
- source_word: speciem mulieris
  choice: a figura de uma mulher
  rationale: “Figura” expressa a forma ou aparência visível sem sugerir apenas beleza ou fisionomia.
- source_word: apparuit tibi ciuitas aedificari
  choice: apareceu a você uma cidade sendo construída
  rationale: Preserva tanto o aparecimento da cidade quanto o processo passivo de sua construção.
- source_word: casu filii sui
  choice: a desgraça do filho
  rationale: Neste contexto, casus designa a calamidade ou perda sofrida pelo filho; “desgraça” mantém a formulação ampla do latim.
- source_word: absolutio
  choice: interpretação
  rationale: No contexto da explicação de uma visão, absolutio indica o esclarecimento ou interpretação de seu significado.
theological_decisions:
- issue: Referência de sui em “filii sui”
  choice: do filho
  alternative: de seu filho / do filho dela
  rationale: O contexto identifica a mulher como a pessoa que narrava a desgraça; a formulação concisa evita introduzir ênfase ausente no latim, embora o referente seja contextual.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do latim onde isso permanece natural. O contraste foi explicitado por “em vez disso”, e o aspecto contínuo de enarrabat foi conservado em “contava”.
