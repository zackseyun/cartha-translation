base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/047.yaml
  text: And as for what she said to you[a], ‘I nourished him with toil,’ this was the dwelling of Jerusalem.
translation:
  language: pt
  text: 'E, quanto ao que ela lhe disse: “Eu o criei com esforço”, isso representava o período em que Jerusalém foi habitada.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a habitação de Jerusalém”.'
    reason: Registra uma tradução mais formal de habitatio Hierusalem; no contexto, a expressão se refere à condição ou ao período de Jerusalém ser habitada, não a um edifício.
lexical_decisions:
- source_word: nutrivi eum
  choice: Eu o criei
  rationale: O verbo latino nutrire pode indicar alimentar, sustentar ou criar. No contexto de uma mãe falando do filho, “criei” expressa naturalmente o cuidado continuado sem restringi-lo apenas à alimentação.
- source_word: cum labore
  choice: com muito esforço
  rationale: Traduz a ideia de trabalho penoso e dificuldade em português corrente; “muito” torna explícita a intensidade naturalmente implicada pela expressão contextual.
- source_word: habitatio Hierusalem
  choice: o período em que Jerusalém foi habitada
  rationale: Habitatio designa aqui o estado ou período de habitação da cidade, não uma casa ou edifício. A formulação evita a leitura equivocada de “morada de Jerusalém” como estrutura física.
- source_word: haec erat
  choice: isso representava
  rationale: No contexto da explicação alegórica, a cópula identifica o elemento da visão com sua realidade simbolizada. “Representava” comunica essa relação com clareza sem alterar seu conteúdo.
theological_decisions:
- issue: Relação alegórica entre a fala da mulher e a história de Jerusalém
  choice: “isso representava”
  alternative: “isso era”
  rationale: A passagem interpreta os detalhes da visão como correspondências simbólicas. A escolha explicita a função alegórica já presente no contexto, sem acrescentar uma interpretação confessional.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “lhe”. A tradução privilegia equivalência ótima e esclarece o sentido contextual de habitatio sem apresentar Jerusalém como uma construção usada para morar.
