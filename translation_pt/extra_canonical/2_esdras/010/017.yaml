  yaml_path: translation/extra_canonical/2_esdras/010/017.yaml
  text: Therefore go into the city to your husband.” And he said to me:[a]
translation:
  language: pt
  text: “Entra, pois, na cidade, para junto de teu marido.” E disse-me:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim não explicita o sujeito; também se pode entender: “E ele me disse” ou “E ela me disse”.'
    reason: Preservar a ambiguidade gramatical de “dixit” quanto à identidade e ao gênero de quem fala.
lexical_decisions:
- source_word: ingredere
  choice: Entra
  rationale: Traduz diretamente o imperativo latino de ingresso, mantendo a imagem de entrar na cidade.
- source_word: ergo
  choice: pois
  rationale: Expressa a consequência ou conclusão indicada pelo conectivo latino de modo natural em português.
- source_word: ad virum tuum
  choice: para junto de teu marido
  rationale: Preserva o movimento em direção ao marido sem acrescentar uma ação não expressa no texto.
- source_word: Et dixit ad me
  choice: E disse-me
  rationale: Reproduz a introdução da fala e evita inserir um pronome de gênero que não aparece explicitamente no latim.
theological_decisions:
- issue: Identidade de quem fala em “Et dixit ad me”
  choice: 'Manter o sujeito implícito: “E disse-me”'
  alternative: “E ele me disse” ou “E ela me disse”
  rationale: A forma latina “dixit” indica terceira pessoa do singular, mas não marca gênero nem traz sujeito expresso. A tradução preserva essa ambiguidade textual em vez de resolvê-la silenciosamente.
translation_notes:
  register: Português moderno, digno e acessível, com leve solenidade narrativa. A colocação “disse-me” mantém fluidez literária e deixa o sujeito implícito, como no latim.
