  yaml_path: translation/extra_canonical/2_esdras/010/051.yaml
  text: For this reason I told you to remain in the field where no house has been built[a].
translation:
  language: pt
  text: Por isso eu lhe disse que permanecesse no campo onde nenhuma casa foi construída[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “onde nenhuma casa foi edificada”.'
