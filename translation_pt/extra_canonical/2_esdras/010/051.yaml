lexical_decisions:
- source_word: propterea enim
  choice: Por isso
  rationale: Expressa de modo natural a relação causal ou explicativa do latim; o valor de enim fica incorporado na conexão com o contexto.
- source_word: maneres
  choice: permanecesse
  rationale: O imperfeito do subjuntivo após dixi tibi é bem representado pelo subjuntivo em discurso indireto português.
- source_word: in campo
  choice: no campo
  rationale: Equivalência direta e idiomática de lugar.
- source_word: ubi domus non est aedificata
  choice: onde nenhuma casa foi construída
  rationale: A construção negativa com domus no singular indefinido é expressa naturalmente por “nenhuma casa”; “foi construída” comunica o perfeito passivo latino sem o recuo temporal indevido de “tinha sido construída”.
