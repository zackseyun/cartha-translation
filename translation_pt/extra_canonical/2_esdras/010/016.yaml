source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si enim iustificaveris terminum Dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/016.yaml
  text: For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.
translation:
  language: pt
  text: Pois, se reconheceres como justo o decreto de Deus, receberás teu filho no tempo devido e serás louvada entre as mulheres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustificaveris
  choice: reconheceres como justo
  rationale: O verbo latino pode significar declarar, reconhecer ou considerar justo. A formulação preserva a ideia de afirmar a justiça do ato divino sem sugerir que a pessoa torna Deus justo.
- source_word: terminum Dei
  choice: o decreto de Deus
  rationale: Neste contexto, terminus indica uma determinação, decisão ou limite estabelecido por Deus; “decreto” comunica naturalmente a decisão divina.
- source_word: recipies
  choice: receberás
  rationale: Equivalente direto do futuro latino, mantendo aberta a maneira pela qual o filho será recebido.
- source_word: in tempore
  choice: no tempo devido
  rationale: Expressa o sentido temporal idiomático de que isso ocorrerá no momento apropriado, sem especificar quando.
- source_word: in mulieribus conlaudaberis
  choice: serás louvada entre as mulheres
  rationale: Reproduz a construção comparativa/social do latim e concorda com a destinatária feminina indicada pelo contexto e por mulieribus.
theological_decisions:
- issue: Sentido de iustificaveris em relação à decisão divina
  choice: reconheceres como justo o decreto de Deus
  alternative: justificares a determinação de Deus
  rationale: Evita a possível impressão de que a interlocutora confere justiça a Deus; ela reconhece a justiça da determinação divina.
- issue: Natureza da promessa de receber o filho
  choice: receberás teu filho
  alternative: terás teu filho de volta
  rationale: A tradução mais direta não define se se trata de restauração, reencontro ou outra forma de recebimento, preservando a abertura do texto latino.
translation_notes:
  register: Português moderno, digno e acessível, com uso de segunda pessoa singular em harmonia com a forma verbal do original. A construção é concisa e mantém a sequência condicional, a promessa e o louvor público.
