  text: 'dixi: Quoniam derelinquens dereliquisti me: ego quidem feci secundum sermones tuos et exiui in campum et ecce uidi et uideo quod non possum enarrare. et dixit ad me: Sta ut uir et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/032.yaml
  text: And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”
translation:
  language: pt
  text: 'E eu disse: “Porque me abandonaste por completo. Eu, de fato, fiz conforme as tuas palavras e saí para o campo. E eis que vi, e ainda vejo, algo que não sou capaz de descrever.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquens dereliquisti me
  choice: me abandonaste por completo
  rationale: A repetição enfática do particípio e do verbo cognato em latim intensifica o abandono; a formulação portuguesa transmite essa ênfase de modo natural.
- source_word: secundum sermones tuos
  choice: conforme as tuas palavras
  rationale: Mantém o sentido de agir em obediência ou conformidade com o que foi dito, sem acrescentar uma interpretação mais específica.
- source_word: ecce uidi et uideo
  choice: e eis que vi, e ainda vejo
  rationale: Preserva tanto o marcador de surpresa ou atenção quanto a mudança deliberada do passado para o presente.
- source_word: quod non possum enarrare
  choice: algo que não sou capaz de descrever
  rationale: Enarrare pode indicar narrar ou expor em palavras; 'descrever' é natural no contexto de uma visão inexprimível.
theological_decisions:
- issue: Acusação de abandono dirigida ao interlocutor celestial
  choice: Porque me abandonaste por completo
  alternative: Porque, ao partir, me deixaste
  rationale: A construção latina é enfática e apresenta uma acusação real de abandono; não foi suavizada nem reinterpretada como simples afastamento físico.
translation_notes:
  register: 'Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A transição temporal de ''vi'' para ''ainda vejo'' foi mantida. A cláusula latina final ''et dixit ad me: Sta ut uir et'' parece iniciar a unidade seguinte e, em consonância com a delimitação do texto inglês auditado para 10:32, não foi incluída neste versículo.'
