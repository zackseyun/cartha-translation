  source_fidelity: 'O texto traduz com fidelidade o trecho latino fornecido: «filium luget» é adequadamente expresso por «Ela chora pelo filho»; «inchoasti consolare eam» preserva o valor incoativo em «você começou a consolá-la»; e «de his quae contigerunt» é corretamente vertido como «a respeito do que havia acontecido». «tinham de ser reveladas a você» representa bem o gerundivo «tibi aperienda [erant]» no registro revelatório do contexto. A oração incompleta «Et nunc uidens altissimus», que inicia o segmento seguinte, não foi incorporada indevidamente.'
