id: 2ES.10.49
reference: 2 Esdras 10:49
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: filium luget, et tu inchoasti consolare eam de his quae contigerunt †haec erant tibi aperienda†. Et nunc uidens altissimus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/049.yaml
  text: And behold[a], you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be revealed to you.
translation:
  language: pt
  text: Ela chora pelo filho, e você começou a consolá-la a respeito do que havia acontecido. Essas coisas tinham de ser reveladas a você.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tinham de ser abertas para você”.'
    reason: Preserva o sentido mais literal de aperienda, enquanto o texto principal expressa seu valor contextual de revelação.
lexical_decisions:
- source_word: filium luget
  choice: chora pelo filho
  rationale: Expressa em português natural o luto indicado por luget; o contexto permite o artigo definido, sem precisar acrescentar explicitamente o possessivo.
- source_word: inchoasti consolare eam
  choice: você começou a consolá-la
  rationale: Mantém o aspecto incoativo de inchoasti e o referente feminino de eam em linguagem clara e atual.
- source_word: de his quae contigerunt
  choice: a respeito do que havia acontecido
  rationale: Conserva a relação temática de de his e usa o mais-que-perfeito composto para situar os acontecimentos antes da tentativa de consolação.
- source_word: aperienda
  choice: reveladas
  rationale: Embora o sentido básico seja “abertas”, no contexto apocalíptico o termo designa algo desvendado ou dado a conhecer; “reveladas” comunica esse valor com naturalidade.
theological_decisions:
- issue: Sentido apocalíptico de aperienda
  choice: reveladas
  alternative: abertas
  rationale: A escolha comunica a divulgação de realidades ocultas sem especificar conteúdo doutrinário além do que o latim sugere; a tradução mais concreta é preservada em nota.
- issue: Material presente na camada inglesa, mas ausente do texto latino fornecido
  choice: não incluir “E eis que você viu a aparência dela”
  alternative: seguir integralmente a redação inglesa de consulta
  rationale: A tradução parte primeiro da evidência original fornecida. A frase adicional não aparece no trecho latino apresentado e, por isso, não deve ser importada sem apoio textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O fragmento final “Et nunc uidens altissimus” parece iniciar a frase seguinte e não foi incorporado a este versículo, em conformidade com a segmentação da camada inglesa auditada.
