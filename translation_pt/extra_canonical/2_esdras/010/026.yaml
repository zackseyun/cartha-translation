  text: E eis que, de repente, ela soltou um grande grito, cheio de terror, de modo que a terra estremeceu com o som. E vi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  choice: eis que
  rationale: Preserva o marcador de apresentação e surpresa do latim, sem omiti-lo.
- source_word: emisit sonum vocis magnum
  choice: soltou um grande grito
  rationale: Expressa em português natural a construção latina literalmente equivalente a ‘emitiu um grande som de voz’.
- source_word: timore plenum
  choice: cheio de terror
  rationale: ‘Terror’ comunica a intensidade do temor que caracteriza o grito neste contexto.
- source_word: commoveretur terra
  choice: a terra estremeceu
  rationale: Reproduz com clareza o abalo físico indicado pelo verbo latino, mantendo a relação consecutiva.
- source_word: et vidi
  choice: E vi
  rationale: Mantém a cláusula final no versículo e traduz vidi diretamente, preservando a continuação sintática indicada pela vírgula.
