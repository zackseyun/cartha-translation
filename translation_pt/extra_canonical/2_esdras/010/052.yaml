  text: campo, ubi domus non est aedificata. Sciebam enim ego quoniam altissimus incipiebat tibi ostendere haec. Propterea dixi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/052.yaml
  text: For I knew that the Most High was beginning to show you these things[a]. Therefore I said
translation:
  language: pt
  text: 'Pois eu sabia que o Altíssimo estava começando a mostrar-lhe essas coisas. Por isso, eu disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  choice: o Altíssimo
  rationale: Mantém o título divino tradicional e corresponde diretamente ao latim.
- source_word: incipiebat ... ostendere
  choice: estava começando a mostrar
  rationale: Preserva o aspecto progressivo de incipiebat com o infinitivo ostendere, sem substituir a formulação por uma leitura meramente prospectiva como “estava prestes a mostrar”.
- source_word: tibi
  choice: lhe
  rationale: Expressa naturalmente o objeto indireto singular em português amplo e corrente.
- source_word: Propterea dixi
  choice: 'Por isso, eu disse:'
  rationale: Reproduz a relação consequencial; os dois-pontos sinalizam que a fala prossegue no versículo seguinte.
theological_decisions:
- issue: Sentido temporal de incipiebat ostendere
  choice: estava começando a mostrar
  alternative: estava prestes a mostrar
  rationale: A tradução escolhida segue mais diretamente a forma verbal latina e não resolve em favor de uma nuance prospectiva que, embora possível no contexto, não é inequívoca.
- issue: Ênfase do pronome ego
  choice: eu sabia
  alternative: eu mesmo sabia
  rationale: O pronome explícito foi representado, mas sem acrescentar a ênfase forte de “eu mesmo”, que o latim não exige.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. A oração inicial do trecho latino (“campo, ubi domus non est aedificata”) foi entendida como o término do versículo anterior, em conformidade com a delimitação fornecida para 2 Esdras 10:52.
