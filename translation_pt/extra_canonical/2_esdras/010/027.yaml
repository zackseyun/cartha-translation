  text: 'et ecce amplius mulier non conparebat mihi, sed civitas aedificabatur et locus demonstrabatur de fundamentis magnis. et timui et clamavi voce magna et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/027.yaml
  text: And behold[a], the woman no longer appeared to me, but a city was being built, and a place with great foundations was being revealed. Then I was afraid and cried out with a loud voice and said,
translation:
  language: pt
  text: 'E eis que a mulher já não aparecia diante de mim, mas uma cidade estava sendo construída, e um lugar com grandes alicerces estava sendo revelado[a]. Então tive medo, clamei em alta voz e disse:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «e um lugar estava sendo revelado a partir de grandes alicerces».'
    reason: «De fundamentis magnis» pode ser entendido descritivamente, como na tradução principal, ou com nuance de procedência; a nota preserva a alternativa sem decidir além do que o latim permite.
lexical_decisions:
- source_word: et ecce
  choice: E eis que
  rationale: Preserva o marcador de surpresa e de transição da visão, em linguagem bíblica ainda compreensível.
- source_word: non conparebat mihi
  choice: já não aparecia diante de mim
  rationale: Expressa naturalmente o desaparecimento da mulher do campo de visão do vidente sem acrescentar o verbo 'olhar'.
- source_word: sed
  choice: em vez disso
  rationale: Torna claro o forte contraste entre a mulher que deixa de aparecer e a cidade que surge na visão.
- source_word: civitas aedificabatur
  choice: uma cidade estava sendo construída
  rationale: Mantém o aspecto progressivo e a voz passiva do imperfeito latino.
- source_word: locus demonstrabatur de fundamentis magnis
  choice: um lugar com grandes alicerces estava sendo revelado
  rationale: Entende 'de fundamentis magnis' como descrição qualitativa do lugar, uso plausível do latim tardio, e conserva a voz passiva e o caráter visionário de 'demonstrabatur'.
- source_word: timui
  choice: tive medo
  rationale: Formulação corrente e direta para a reação pontual do vidente.
- source_word: clamavi voce magna
  choice: clamei em alta voz
  rationale: Equivalente português natural da expressão semítica preservada no latim.
theological_decisions:
- issue: Relação entre o lugar revelado e os grandes alicerces
  choice: um lugar com grandes alicerces estava sendo revelado
  alternative: um lugar estava sendo revelado a partir de grandes alicerces
  rationale: A construção tardia 'de' + ablativo pode funcionar como descrição de qualidade; a leitura escolhida também se ajusta melhor ao cenário de uma cidade em construção, sem impor uma origem espacial pouco clara.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com leve cadência bíblica. A tradução mantém a progressão visionária, as passivas e a frase aberta que introduz a fala do versículo seguinte.
