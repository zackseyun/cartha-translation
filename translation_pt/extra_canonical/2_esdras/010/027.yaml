    reason: «De fundamentis magnis» pode ser entendido descritivamente, como na tradução principal, ou com nuance de procedência; a nota preserva a alternativa sem decidir além do que o latim permite.
  revision_rationale: Substitui-se «em vez disso» por «mas» para refletir com precisão o contraste de «sed», sem sugerir uma relação de substituição. Acrescenta-se uma nota ancorada em «grandes alicerces» para registrar a alternativa interpretativa de «de fundamentis magnis» presente na auditoria inglesa. O restante do texto permanece fiel e natural.
