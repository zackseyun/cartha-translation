  source_fidelity: A tradução reproduz adequadamente a sequência visionária, o imperfeito passivo de «aedificabatur» e «demonstrabatur», e as reações pontuais «timui» e «clamavi». Contudo, «em vez disso» intensifica «sed» para uma substituição que o latim não exige; «mas» conserva melhor o contraste simples. A ambiguidade residual de «de fundamentis magnis», registrada na trilha inglesa, deve ser assinalada por nota.
  naturalness: O português é claro, moderno e mantém uma cadência apropriada. «Mas» é mais natural e menos interpretativo neste encadeamento do que «em vez disso».
  terminology: «E eis que», «cidade», «grandes alicerces», «tive medo» e «clamei em alta voz» são adequados. «Um lugar com grandes alicerces» expressa naturalmente a leitura descritiva de «de fundamentis magnis».
