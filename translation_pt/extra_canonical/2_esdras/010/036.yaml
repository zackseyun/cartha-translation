  text: Or is my mind deceived, and is my soul dreaming?
translation:
  language: pt
  text: Ou será que minha mente está sendo enganada e minha alma está sonhando?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fallitur
  choice: estou sendo enganado
  rationale: O latim preservado apresenta uma forma passiva, literalmente «é enganado». Como o sujeito parece depender do contexto imediatamente anterior ou de uma tradição textual subjacente, a formulação em primeira pessoa comunica naturalmente a dúvida do falante sem inserir «mente», que não aparece neste trecho latino.
- source_word: anima mea
  choice: minha alma
  rationale: Mantém o equivalente direto e teologicamente não restritivo de anima, sem o reduzir a «mente» ou «imaginação».
- source_word: somniatur
  choice: está sonhando
  rationale: Reproduz o sentido de estar em estado de sonho e mantém o paralelismo interrogativo.
theological_decisions:
- issue: Relação entre engano e sonho
  choice: Manter duas possibilidades coordenadas na mesma pergunta
  alternative: Interpretar o sonho como explicação do engano
  rationale: O texto apresenta as ideias lado a lado, e não determina explicitamente uma relação causal entre elas.
translation_notes:
  register: Português atual, digno e de ampla compreensão. O fragmento fornecido começa no meio de uma construção; por isso, a tradução evita acrescentar «mente», presente na camada inglesa, mas não no latim citado.
