source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vbi est Vriel angelus, qui a principio uenit ad me ? quoniam ipse me fecit uenire in multitudinem excessus mentis huius, et factus est finis meus in corruptione, et oratio mea in inproperium. Et cum essem loquens ego haec, et ecce uenit ad me
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/028.yaml
  text: “Where is Uriel the angel[28], who came to me at the beginning? For it was he who brought me into this great bewilderment of mind, and my end has become corruption[a], and my prayer a reproach.”
translation:
  language: pt
  text: “Onde está o anjo Uriel, que veio a mim no princípio? Pois foi ele quem me fez entrar nesta grande perturbação da mente[a]; meu fim se tornou ruína[b], e minha oração, opróbrio.” Enquanto eu dizia essas coisas, eis que ele veio até mim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “nesta abundância deste arrebatamento da mente”. A expressão descreve um estado visionário avassalador, não simples confusão nem necessariamente alegria.
    reason: lexical_alternative
  - marker: b
    text: Ou “corrupção” ou “destruição”.
    reason: lexical_alternative
lexical_decisions:
- source_word: multitudinem excessus mentis huius
  choice: nesta profunda perturbação da mente
  rationale: A expressão latina é enfática e descreve um deslocamento avassalador da mente, ligado à experiência visionária. “Perturbação” evita a conotação moderna de alegria que “êxtase” pode sugerir, enquanto “profunda” comunica a intensidade de multitudinem.
- source_word: corruptione
  choice: ruína
  rationale: No contexto, o termo indica destruição ou perdição como desfecho, não necessariamente corrupção moral. “Ruína” é natural em português e preserva a gravidade da declaração.
- source_word: oratio mea in inproperium
  choice: minha oração, motivo de vergonha
  rationale: A construção significa que sua oração acabou resultando em opróbrio, censura ou vergonha. A formulação escolhida é clara e mantém o paralelismo com a oração anterior.
- source_word: et ecce uenit ad me
  choice: eis que ele veio até mim
  rationale: Mantém a fórmula narrativa enfática ecce e inclui a frase final presente na fonte latina.
theological_decisions:
- issue: Natureza de excessus mentis
  choice: profunda perturbação da mente
  alternative: grande êxtase da mente
  rationale: A tradução não define a experiência como alegria religiosa nem a reduz a confusão cotidiana; expressa um estado mental visionário e avassalador, preservando a tensão do texto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe acessível e leve solenidade narrativa. O paralelismo da lamentação foi preservado sem reproduzir mecanicamente a construção latina.
