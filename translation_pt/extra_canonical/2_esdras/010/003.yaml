  yaml_path: translation/extra_canonical/2_esdras/010/003.yaml
  text: And it happened, when all had stopped comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.
translation:
  language: pt
  text: E aconteceu que, quando todos tinham parado de me consolar para que eu descansasse, levantei-me à noite, fugi e vim, como você vê, para este campo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quievissent
  choice: pararam
  rationale: No contexto, o verbo indica que todos interromperam sua ação de consolá-lo; “pararam” é natural e preserva essa relação com o infinitivo seguinte.
- source_word: ut me consolarentur ut quiescerem
  choice: de me consolar para que eu descansasse
  rationale: 'Mantém as duas orações finais e a sequência do latim: os presentes pararam de consolá-lo com o propósito de permitir que descansasse.'
- source_word: surrexi nocte
  choice: levantei-me de noite
  rationale: Tradução direta e natural que conserva a referência temporal sem especificar uma hora não indicada.
- source_word: in hoc campo
  choice: para este campo
  rationale: “Campo” corresponde a campus, e “para” expressa o movimento de chegada ao lugar indicado pelo narrador.
