  text: Therefore I beg you to show your servant the meaning of this departure.” And he answered me and[a]
translation:
  language: pt
  text: Portanto, peço-te que mostres ao teu servo o significado deste transe.” E ele me respondeu e[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «deste arrebatamento». O latim *excessus* pode referir-se a um estado visionário fora do estado habitual ou de profunda perturbação.
    reason: Registra uma alternativa para *excessus* e sua amplitude sem atribuir ao termo um sentido físico ou doutrinário específico.
lexical_decisions:
- source_word: demonstres
  choice: mostres
  rationale: Traduz diretamente o subjuntivo latino em uma construção portuguesa natural após «peço-te que».
- source_word: seruo tuo
  choice: ao teu servo
  rationale: Preserva a autodesignação humilde e a segunda pessoa singular do texto latino.
- source_word: de excessu hoc
  choice: o significado desse arrebatamento
  rationale: O latim é elíptico; no contexto visionário, «excessus» indica saída do estado habitual, êxtase ou transe. «Arrebatamento» conserva essa amplitude melhor que «partida», embora possa exigir esclarecimento.
- source_word: Et respondit ad me et
  choice: E ele me respondeu e
  rationale: Mantém deliberadamente a oração incompleta no limite do versículo, como no texto-fonte.
theological_decisions:
- issue: Natureza de «excessus»
  choice: arrebatamento
  alternative: transe; êxtase; afastamento
  rationale: Evita reduzir o termo a uma partida física e também evita a associação moderna de «êxtase» apenas com euforia; conserva o sentido de uma experiência visionária fora do estado comum.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas pronominais tradicionais moderadas. A terminação abrupta «e» foi preservada por corresponder ao texto latino e à divisão fornecida.
