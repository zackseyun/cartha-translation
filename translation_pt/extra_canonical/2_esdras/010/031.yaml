lexical_decisions:
- source_word: Quid tibi est
  choice: O que você tem?
  rationale: Expressão portuguesa natural que conserva a pergunta direta sobre o estado do interlocutor.
- source_word: conturbaris
  choice: está perturbado
  rationale: Mantém o sentido de agitação ou aflição interior sem especificar indevidamente uma causa.
- source_word: intellectus tuus
  choice: o seu entendimento
  rationale: Equivalente direto e corrente para a faculdade de compreender.
- source_word: sensus cordis tui
  choice: a percepção do seu coração
  rationale: Preserva a distinção entre intellectus e sensus e mantém a linguagem antropológica de 'coração' do texto latino.
