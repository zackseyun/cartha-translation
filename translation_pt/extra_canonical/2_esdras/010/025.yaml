  source_fidelity: 'A tradução reproduz com precisão os elementos conservados no latim: «E aconteceu», a circunstância temporal, «eis que» para ecce, o brilho súbito e intenso do rosto, e a transformação da sua aparência em algo fulgurante. Mantém também «de modo que até», refletindo sem disfarce a interrupção de ut etiam. A restauração entre colchetes é explicitamente assinalada e corresponde ao sentido preservado pelas versões-filhas indicado no dossiê ინგლისês.'
