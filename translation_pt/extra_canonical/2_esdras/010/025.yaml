  text: Et factum est cum loquebar ad eam, et ecce facies eius fulgebat ualde subito et species coruscus fiebat uultus eius, ut etiam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/025.yaml
  text: And it happened[25], while I was speaking to her, that behold, her face suddenly shone exceedingly, and the appearance of her face became flashing[a], so that even [I was greatly afraid of her].
translation:
  language: pt
  text: E aconteceu que, enquanto eu falava com ela, eis que seu rosto de repente brilhou intensamente, e a aparência de seu rosto tornou-se fulgurante,[a] de modo que até [fiquei com muito medo dela].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “eis que seu rosto de repente brilhou intensamente, e sua aparência resplandeceu”.'
    reason: previous_rendering
  - marker: b
    text: O texto latino se interrompe depois de ut etiam (“de modo que até”). As palavras entre colchetes são restauradas com base nas antigas versões siríaca e etíope, que dizem que ele ficou com muito medo dela; a etíope também pode indicar medo de se aproximar dela.
    reason: textual_variant
lexical_decisions:
- source_word: ecce
  choice: eis que
  rationale: Preserva o marcador enfático e visionário do latim, natural no registro bíblico português.
- source_word: fulgebat ualde subito
  choice: de repente brilhou intensamente
  rationale: Reproduz tanto a súbita mudança quanto o alto grau de luminosidade, em ordem portuguesa natural.
- source_word: species coruscus fiebat uultus eius
  choice: a aparência de seu rosto tornou-se fulgurante
  rationale: Evita transformar species e vultus em dois sujeitos distintos e comunica a aparência cintilante do rosto, apesar da construção latina irregular.
- source_word: ut etiam
  choice: de modo que até
  rationale: Mantém a oração consecutiva interrompida no testemunho latino.
theological_decisions:
- issue: Restauração do texto após a interrupção latina
  choice: '[fiquei com muito medo dela]'
  alternative: Encerrar o versículo em «de modo que até», seguindo apenas o latim preservado
  rationale: A restauração entre colchetes segue o conteúdo atestado pelas versões-filhas, sem ocultar que as palavras faltam no texto latino fornecido.
translation_notes:
  register: Português moderno, claro e digno, com leve cadência bíblica. «Eis que» conserva o sinal apocalíptico; «fulgurante» expressa coruscus sem criar dois referentes faciais. Os colchetes tornam transparente a restauração apoiada nas versões antigas.
