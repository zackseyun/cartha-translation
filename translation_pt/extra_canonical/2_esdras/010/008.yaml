source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: humiliata est, lugete ualidissime. Et nunc quoniam omnes lugemus, et tristes estis, quoniam omnes contristati sumus, tu
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/008.yaml
  text: She has been humbled; mourn most bitterly. And now[a], since we all mourn and are sad, since we are all grieved—but you
translation:
  language: pt
  text: Ela foi humilhada; lamentem com a maior amargura. E agora, visto que todos nós lamentamos e estamos tristes[a], visto que todos fomos entristecidos — mas você...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim traz literalmente “vocês estão tristes”; “estamos tristes” segue o paralelismo com “todos nós lamentamos” e “todos fomos entristecidos”.
    reason: Registra uma provável corrupção ou irregularidade do texto latino sem ocultar a leitura literal do testemunho.
lexical_decisions:
- source_word: humiliata est
  choice: Ela foi humilhada
  rationale: Mantém o perfeito passivo latino e o referente feminino, sem substituir a humilhação pela ideia de lamento.
- source_word: lugete ualidissime
  choice: lamentem com a maior amargura
  rationale: Preserva o imperativo plural de lugete e comunica de modo natural a intensidade superlativa de ualidissime no contexto de luto.
- source_word: contristati sumus
  choice: fomos entristecidos
  rationale: Conserva a forma passiva e a abrangência da primeira pessoa do plural, evitando reduzir a expressão simplesmente a um estado emocional.
- source_word: tu
  choice: mas você...
  rationale: Mantém o pronome singular enfático e o final abrupto do fragmento. O travessão e as reticências indicam que a frase fica incompleta; 'mas' explicita com naturalidade o contraste já reconhecido pela camada de consulta inglesa.
theological_decisions:
- issue: Alternância textual entre segunda e primeira pessoa do plural em tristes estis
  choice: estamos tristes, com nota textual
  alternative: vocês estão tristes
  rationale: A primeira pessoa cria paralelismo com omnes lugemus e omnes contristati sumus e corresponde à leitura contextual adotada na revisão auditada, enquanto a forma efetivamente impressa no latim é preservada em nota.
- issue: Final incompleto do testemunho fornecido
  choice: manter a interrupção em 'mas você...'
  alternative: completar a ideia com 'se entristece por um só filho'
  rationale: A continuação não consta do texto latino fornecido; completá-la importaria material além da evidência apresentada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O plural de “lamentem” preserva a morfologia do latim, embora o trecho termine dirigindo-se a uma pessoa no singular. O caráter fragmentário do final foi mantido deliberadamente.
