  yaml_path: translation/extra_canonical/2_esdras/010/030.yaml
  text: And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,
translation:
  language: pt
  text: O anjo que tinha vindo a mim no início viu-me; e eis que eu estava prostrado como morto, e meu entendimento estava transtornado. Ele segurou minha mão direita, fortaleceu-me e pôs-me de pé,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: positus ut mortuus
  choice: prostrado como morto
  rationale: Expressa de modo natural a condição física indicada pelo latim, preservando a comparação explícita com um morto.
- source_word: intellectus meus alienatus erat
  choice: meu entendimento havia me abandonado
  rationale: Reproduz a perda ou o alheamento da capacidade de compreender sem definir com precisão excessiva se houve inconsciência, confusão ou êxtase.
- source_word: tenuit dexteram meam
  choice: segurou minha mão direita
  rationale: Mantém o sentido concreto de dexteram no contexto, conforme também atestado pela tradição de consulta.
- source_word: confortauit me
  choice: fortaleceu-me
  rationale: Preserva o sentido direto de comunicar força ou ânimo.
- source_word: statuit me super
  choice: me pôs de pé
  rationale: O texto latino fornecido termina de modo truncado em super; a formulação completa o gesto idiomaticamente, em acordo com o contexto e com a camada inglesa auditada.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com leve cadência narrativa bíblica. A pontuação separa a condição do vidente da ação restauradora do anjo. A vírgula final foi mantida porque o versículo continua sintaticamente na sequência.
