revisions:
- from: E eis que eu estava prostrado como morto, e meu entendimento havia me abandonado. Então ele segurou minha mão direita, fortaleceu-me e me pôs de pé,
  to: O anjo que tinha vindo a mim no início viu-me; e eis que eu estava prostrado como morto, e meu entendimento estava transtornado. Ele segurou minha mão direita, fortaleceu-me e pôs-me de pé,
