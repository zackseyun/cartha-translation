  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu ergo excute tuam multam tristitiam, et depone abs te multitudinem dolorum, ut tibi repropitietur fortis, et requiem faciat tibi altissimus, requietionem laborum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/024.yaml
  text: Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”
translation:
  language: pt
  text: Portanto, sacuda de si a sua grande tristeza e afaste de si a multidão de dores, para que o Poderoso volte a lhe ser favorável e o Altíssimo lhe dê descanso, alívio de seus trabalhos.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: excute
  choice: sacuda de si
  rationale: Preserva a imagem vigorosa de livrar-se de algo, em vez de apenas dizer “abandone”.
- source_word: repropitietur
  choice: volte a lhe ser favorável
  rationale: O prefixo latino re- sugere renovação do favor; a formulação evita o termo menos acessível “repropiciar-se”.
- source_word: fortis
  choice: o Poderoso
  rationale: Aqui funciona como título divino substantivado; “Poderoso” é natural e mantém a força do latim.
- source_word: requiem ... requietionem laborum
  choice: descanso, alívio de seus trabalhos
  rationale: Mantém a repetição sem produzir uma construção portuguesa pesada; “alívio” explicita o segundo termo ligado aos trabalhos penosos.
theological_decisions:
- issue: Relação entre abandonar a tristeza e o renovado favor divino
  choice: “para que o Poderoso volte a lhe ser favorável”
  alternative: “e então o Poderoso voltará a lhe ser favorável”
  rationale: Mantém a construção final do latim ut com subjuntivo, sem transformar explicitamente a ação humana em garantia causal do favor divino.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” implícito nas formas “sua/lhe” e paralelismo próximo ao original latino.
