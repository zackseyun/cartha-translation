source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem contristaris in uno filio. Interroga enim terram et dicet tibi, quoniam haec est quae debeat lugere tantorum super eam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/009.yaml
  text: But you are grieving over one son. For ask the earth[a], and it will tell you that it is she who ought to mourn for so many upon her.
translation:
  language: pt
  text: Mas você está entristecida por um único filho. Pois pergunte à terra[a], e ela lhe dirá que é ela quem deve lamentar por tantos que estão sobre ela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Pergunte à terra”.'
    reason: Registra a alternativa de apresentação editorial já preservada na camada de consulta inglesa; em português, a redação é idêntica salvo a capitalização quando tratada como início independente.
lexical_decisions:
- source_word: contristaris
  choice: está entristecida
  rationale: Mantém o sentido de tristeza profunda dirigido à interlocutora feminina, em linguagem natural e digna.
- source_word: in uno filio
  choice: por um único filho
  rationale: Expressa a causa do pesar; “único” preserva o contraste com os muitos mencionados no fim do versículo.
- source_word: Interroga ... terram
  choice: pergunte à terra
  rationale: Reproduz diretamente o imperativo latino e a personificação da terra.
- source_word: debeat lugere
  choice: deve lamentar
  rationale: Preserva a ideia de obrigação ou adequação expressa pelo subjuntivo com debere, sem intensificação interpretativa.
- source_word: tantorum super eam
  choice: por tantos que estão sobre ela
  rationale: Mantém a formulação elíptica e abrangente do latim, sem acrescentar que esses muitos nasceram ou morreram.
theological_decisions:
- issue: Personificação e referente feminino de haec
  choice: “é ela quem deve lamentar”, referindo-se à terra
  alternative: “esta é que deve lamentar”
  rationale: A personificação está explícita no contexto e a retomada por “ela” é clara em português, sem resolver além do texto a identidade dos “tantos”.
translation_notes:
  register: Português moderno, claro e solene, com ampla legibilidade brasileira. O feminino em “entristecida” decorre da interlocutora no contexto. Conservou-se a elipse de “tantos” e evitou-se importar a ideia de que brotam, nascem ou morrem sobre a terra.
