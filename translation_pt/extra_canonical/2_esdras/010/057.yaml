source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: audire. Tu autem beatus es prae multis, et uocatus es apud
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/057.yaml
  text: But you are blessed above many[a], and you have been called by the Most High, as only a few have been.
translation:
  language: pt
  text: Mas você é mais bem-aventurado do que muitos e foi chamado para junto do Altíssimo[a], como poucos foram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, segundo outra compreensão da expressão latina, “chamado pelo Altíssimo”.
    reason: A expressão uocatus es apud é incomum neste contexto. Apud normalmente indica proximidade ou presença, mas algumas traduções entendem o Altíssimo como aquele que chama.
lexical_decisions:
- source_word: beatus
  choice: mais bem-aventurado
  rationale: Mantém o sentido de condição favorecida ou abençoada e o tom religioso do texto, sem reduzir a ideia a mera felicidade emocional.
- source_word: prae multis
  choice: do que muitos
  rationale: Expressa naturalmente a comparação indicada por prae, sem sugerir necessariamente posição espacial ou autoridade sobre outros.
- source_word: uocatus es apud
  choice: foi chamado para junto de
  rationale: Vocatus es indica que o destinatário recebeu um chamado; apud aponta para proximidade ou presença junto de alguém, não marca de modo normal o agente da voz passiva. A formulação portuguesa preserva ambos os elementos com naturalidade.
theological_decisions:
- issue: Relação entre o chamado e o Altíssimo
  choice: chamado para junto do Altíssimo
  alternative: chamado pelo Altíssimo
  rationale: O latim apud favorece presença, proximidade ou associação, enquanto a expressão de agência seria normalmente construída com ab. A tradução evita transformar silenciosamente o Altíssimo no agente, embora reconheça essa leitura tradicional em nota.
translation_notes:
  register: Português moderno, digno e acessível, com “você” segundo o padrão editorial. “Bem-aventurado” conserva o registro religioso, e “como poucos foram” completa em português natural a elipse latina.
