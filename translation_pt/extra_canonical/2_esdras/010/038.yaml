  yaml_path: translation/extra_canonical/2_esdras/010/038.yaml
  text: And he said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.
translation:
  language: pt
  text: 'E ele disse: “Ouça-me, e eu o instruirei e lhe direi a respeito das coisas que você teme, porque o Altíssimo lhe revelou muitos mistérios.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dixit
  choice: disse
  rationale: Traduz diretamente o verbo latino, sem acrescentar a ideia de que ele respondeu, ausente no texto-fonte.
- source_word: audi me
  choice: Escute-me
  rationale: Imperativo natural e direto em português, preservando o pedido enfático para que o interlocutor ouça.
- source_word: doceam te
  choice: eu lhe ensinarei
  rationale: Mantém a promessa de instrução e explicita o objeto indireto de modo natural.
- source_word: de quibus times
  choice: sobre as coisas que você teme
  rationale: Preserva a referência ampla e algo ambígua do latim, sem especificar indevidamente quais são os temores.
- source_word: altissimus
  choice: o Altíssimo
  rationale: Conserva o título divino tradicional e claramente reconhecível em português.
- source_word: mysteria multa
  choice: muitos mistérios
  rationale: Equivalência direta que mantém o sentido de realidades ocultas reveladas por Deus.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com uso de “você” e “lhe” de ampla compreensão brasileira. A expressão final incompleta “Vidit enim” não foi incluída, pois inicia a frase seguinte e não integra o conteúdo completo deste versículo na delimitação fornecida.
