source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et evertimus omnes lumina, et surrexerunt omnes cives mei ad consolandam me, et quievi usque in alium diem usque noctem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/002.yaml
  text: Then we all put out the lamps[a], and all my fellow citizens rose up to comfort me, and I rested until the next day, until night.
translation:
  language: pt
  text: Então todos nós apagamos as lâmpadas, e todos os meus concidadãos se levantaram para me consolar. E descansei até o dia seguinte, até a noite.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: evertimus
  choice: apagamos
  rationale: No contexto de lâmpadas, exprime de modo natural em português o ato de extinguir suas luzes.
- source_word: omnes
  choice: todos nós
  rationale: A forma latina é nominativa plural e modifica o sujeito implícito de evertimus, não o substantivo neutro lumina.
- source_word: lumina
  choice: as lâmpadas
  rationale: Embora literalmente possa significar 'luzes', o contexto e a tradição textual indicam as lâmpadas que foram apagadas.
- source_word: cives mei
  choice: meus concidadãos
  rationale: Conserva o sentido cívico e coletivo do latim sem recorrer a uma paráfrase vaga.
- source_word: quievi
  choice: descansei
  rationale: Representa diretamente a ideia de repouso ou cessação expressa pelo verbo latino.
