  yaml_path: translation/extra_canonical/2_esdras/010/029.yaml
  text: And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.
translation:
  language: pt
  text: E, enquanto eu falava estas coisas, eis que veio a mim o anjo que tinha vindo a mim no início e me viu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et cum essem loquens ego haec
  choice: E, enquanto eu dizia essas coisas
  rationale: Reproduz com naturalidade o valor temporal da construção latina e mantém o pronome implícito, como é usual em português.
- source_word: et ecce
  choice: eis que
  rationale: Preserva o marcador narrativo de súbita atenção, em registro bíblico digno e ainda compreensível.
- source_word: qui in principio venerat ad me
  choice: que tinha vindo a mim no princípio
  rationale: O mais-que-perfeito composto expressa a anterioridade de venerat; “no princípio” conserva a formulação do latim sem especificar além do texto.
- source_word: et vidit me
  choice: e me viu
  rationale: Mantém literalmente a afirmação final e sua possível tensão contextual, sem reinterpretá-la como simples encontro ou observação.
