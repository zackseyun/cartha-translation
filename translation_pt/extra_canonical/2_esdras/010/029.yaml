    issue: «no princípio» para «in principio»
    rationale: No contexto, a expressão remete à primeira visita do anjo no relato, não exige a ressonância mais forte de «no princípio» em português. «No início» mantém a anterioridade narrativa com menor carga interpretativa.
  - severity: low
    issue: «dizia essas coisas» para «essem loquens ... haec»
    rationale: Embora não seja incorreto, «falava estas coisas» conserva mais diretamente o verbo de fala em curso e o demonstrativo próximo do latim, em português bíblico natural.
  revised_text: E, enquanto eu falava estas coisas, eis que veio a mim o anjo que tinha vindo a mim no início e me viu.
