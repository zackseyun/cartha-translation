  text: 'This, then, is the interpretation of the vision: the woman who appeared to you a little while ago, whom'
translation:
  language: pt
  text: 'Esta, então, é a interpretação da visão: a mulher que apareceu a você há pouco, a quem'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lectus uisionis
  choice: interpretação da visão
  rationale: O texto latino parece apresentar uma forma textual problemática ou corrompida; pelo contexto e pela tradição textual, a expressão introduz a explicação da visão. “Interpretação” preserva melhor essa função do que “significado”.
- source_word: ante paululum
  choice: há pouco
  rationale: Expressão natural e concisa em português para indicar que a aparição ocorreu pouco tempo antes.
- source_word: Quam
  choice: a quem
  rationale: Mantém a oração relativa incompleta e a continuidade sintática com o versículo seguinte, sem completar artificialmente o sentido.
