  text: germinantium. Et ex ipsa initia omnes nacti, et alii ueniunt, et ecce pene omnes in perditionem ambulant et in exterminium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/010.yaml
  text: From her all have had their beginnings, and others come; and behold, nearly all walk to destruction and to extermination.
translation:
  language: pt
  text: Dela todos tiveram seu começo, e outros vêm; e eis que quase todos caminham para a perdição e para o extermínio.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex ipsa
  choice: dela
  rationale: Retoma naturalmente, no feminino, a figura mencionada no contexto, preservando a referência do latim.
- source_word: initia omnes nacti
  choice: todos tiveram seu começo
  rationale: Expressa em português corrente a ideia de todos terem recebido ou alcançado nela sua origem.
- source_word: alii ueniunt
  choice: outros ainda vêm
  rationale: O advérbio «ainda» torna claro o sentido continuativo da chegada de outros, sem acrescentar conteúdo substantivo.
- source_word: ambulant
  choice: caminham
  rationale: Mantém a metáfora do percurso presente no latim, em vez de reduzi-la a um simples «vão».
- source_word: perditionem ... exterminium
  choice: perdição ... extermínio
  rationale: Conserva os dois termos distintos e sua intensidade cumulativa, sem fundi-los nem ampliar a frase.
theological_decisions:
- issue: Alcance de «pene omnes»
  choice: quase todos
  alternative: a maioria
  rationale: «Quase todos» corresponde diretamente ao latim e preserva a força abrangente da afirmação.
- issue: Relação entre «perditionem» e «exterminium»
  choice: para a perdição e para o extermínio
  alternative: para a perdição, isto é, para o extermínio
  rationale: A coordenação conserva a tensão entre dois destinos ou descrições paralelas, sem interpretá-los como estritamente idênticos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o paralelismo e a solenidade do original sem soar arcaica.
