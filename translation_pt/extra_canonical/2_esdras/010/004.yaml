  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/004.yaml
  text: And I have come[a], as you see, into this field. I intend to return to the city no more, but to stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”
translation:
  language: pt
  text: E vim, como você vê, para este campo. Pretendo[a] não voltar mais à cidade, mas permanecer aqui. Não comerei nem beberei; sem cessar, vou lamentar e jejuar até morrer.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Penso não voltar mais à cidade, mas permanecer aqui”.'
    reason: Registra a possibilidade menos firme para cogito, sem deslocar o valor de iam non, que indica não retornar mais.
lexical_decisions:
- source_word: cogito
  choice: Pretendo
  rationale: Com infinitivos, o verbo latino expressa aqui propósito ou decisão, não mera reflexão hesitante.
- source_word: iam non reuerti
  choice: não voltar mais
  rationale: Reproduz naturalmente o sentido de “já não voltar” ou “não voltar daí em diante”.
- source_word: hic consistere
  choice: permanecer aqui
  rationale: No contexto, consistere indica ficar ou estabelecer-se naquele lugar.
- source_word: sine intermissione lugere et ieiunare
  choice: sem cessar, vou lamentar e jejuar
  rationale: Mantém a continuidade enfática da lamentação e do jejum em linguagem portuguesa natural.
