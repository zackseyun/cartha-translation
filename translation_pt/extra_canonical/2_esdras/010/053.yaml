  yaml_path: translation/extra_canonical/2_esdras/010/053.yaml
  text: Therefore I told you to come into the field[a], where there is no foundation of a building.
translation:
  language: pt
  text: Por isso, eu lhe disse que viesse ao campo[a], onde não há alicerce de uma construção.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «terreno».
    reason: Registra a amplitude lexical de agrum, que pode indicar um campo ou uma área de terra específica.
lexical_decisions:
- source_word: agrum
  choice: campo
  rationale: O termo latino designa aqui um campo ou terreno específico, em continuidade com o local não edificado do contexto, sem ampliar o sentido para toda a zona rural.
- source_word: fundamentum aedificii
  choice: alicerce de construção alguma
  rationale: Expressa de modo natural em português a ausência de qualquer construção fundada naquele terreno, preservando a relação entre fundamentum e aedificii.
