    issue: A abertura «Ela ainda está por acontecer» introduz um pronome feminino e a nuance temporal «ainda» que não são exigidos pela breve construção latina.
    rationale: «Futura est» pode funcionar de forma elíptica/impessoal antes de «manebis hic». «Acontecerá que» preserva a prospectividade sem identificar um referente feminino a partir do contexto nem acrescentar «ainda».
