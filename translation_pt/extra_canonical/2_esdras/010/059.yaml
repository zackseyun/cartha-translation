source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: futura est manebis hic, Et ostendet tibi altissimus eas uisiones somniorum quae faciet altissimus his qui habitant super terram in nouissimis diebus. Et dormiui illam noctem et aliam sicut praecepit mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/059.yaml
  text: and the Most High will show you those dream-visions that the Most High will bring about for those who dwell on the earth in the last days.”[a]
translation:
  language: pt
  text: Acontecerá que você ficará aqui, e o Altíssimo lhe mostrará aquelas visões em sonhos daquilo que o Altíssimo fará aos que habitam sobre a terra nos últimos dias.[a] E dormi naquela noite e também na noite seguinte, conforme ele me ordenou.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “daquilo que o Altíssimo fará para os que habitam sobre a terra”.'
    reason: O dativo latino «his qui habitant» pode ser entendido de modo mais favorável («para») ou de modo não especificado («aos»); a nota preserva essa ambiguidade.
lexical_decisions:
- source_word: futura est
  choice: Ela ainda está por acontecer
  rationale: A expressão latina é elíptica e tem referente feminino no contexto anterior; a tradução preserva a referência sem tentar identificá-la no próprio versículo.
- source_word: uisiones somniorum
  choice: visões em sonhos
  rationale: Expressa naturalmente a relação entre visões e sonhos, sem reduzir a frase simplesmente a 'sonhos'.
- source_word: quae faciet altissimus
  choice: daquilo que o Altíssimo fará
  rationale: Evita a ideia pouco natural de 'fazer visões' e acolhe a leitura subjacente segundo a qual as visões revelam as coisas que o Altíssimo realizará.
- source_word: his qui habitant super terram
  choice: aos que habitam sobre a terra
  rationale: Mantém o dativo latino sem decidir se a ação é benéfica ou hostil; 'sobre a terra' conserva a formulação apocalíptica.
- source_word: in nouissimis diebus
  choice: nos últimos dias
  rationale: Equivalente português tradicional e claro para a expressão escatológica latina.
- source_word: illam noctem et aliam
  choice: naquela noite e também na noite seguinte
  rationale: Em contexto temporal, aliam indica outra noite subsequente; 'seguinte' torna a sequência natural em português.
theological_decisions:
- issue: Sentido do dativo his qui habitant
  choice: o Altíssimo fará aos que habitam
  alternative: o Altíssimo fará para os que habitam / fará acontecer entre os que habitam
  rationale: O dativo não especifica por si só benefício nem juízo. 'Aos' preserva essa abertura e evita impor caráter favorável ou hostil às ações anunciadas.
- issue: Relação de quae com as visões
  choice: visões em sonhos daquilo que o Altíssimo fará
  alternative: visões em sonhos que o Altíssimo produzirá
  rationale: A formulação escolhida representa as visões como revelação de acontecimentos futuros, de acordo com a evidência textual auditada, sem tratar 'visões' como objeto idiomático de 'fazer'.
translation_notes:
  register: Português moderno, digno e acessível, com repetição deliberada de “o Altíssimo” conforme o latim. A abertura permanece elíptica porque “futura est” depende de um referente feminino no contexto anterior. O marcador [a] aparece no texto principal.
