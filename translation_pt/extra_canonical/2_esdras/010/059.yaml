review_pass:
  verdict: revise
  source_fidelity: A construção inicial latina, embora elíptica e textualmente difícil, é mais bem representada como uma oração impessoal prospectiva ligada a «você ficará aqui», não como uma referência definida a um antecedente feminino («Ela»). O restante preserva bem «visiones somniorum», a repetição de «o Altíssimo», o caráter aberto do dativo «his qui habitant» e a sequência das duas noites.
  naturalness: O texto é claro, moderno e de registro apropriado. «Acontecerá que você ficará aqui» resolve em português a elipse sintática inicial sem introduzir um referente não expresso. «Visões em sonhos» e «sobre a terra» soam naturais no registro apocalíptico.
  terminology: «O Altíssimo», «últimos dias» e «visões em sonhos» são escolhas consistentes e adequadas. «Aos que habitam sobre a terra» conserva, sem interpretação confessional, a direção indeterminada do dativo latino; a nota registra a alternativa favorecedora.
  issues:
