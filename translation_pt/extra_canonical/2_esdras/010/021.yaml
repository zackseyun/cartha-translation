lexical_decisions:
- source_word: sanctificatio nostra
  choice: o nosso santuário
  rationale: Embora sanctificatio possa significar literalmente “santificação” ou “consagração”, neste contexto de altar e templo designa naturalmente o lugar santo, isto é, o santuário.
- source_word: deserta effecta est
  choice: ficou desolado
  rationale: Reproduz a ideia de ter sido reduzido a um estado de abandono e devastação, com expressão natural em português.
- source_word: demolitum est
  choice: foi demolido
  rationale: Mantém a imagem concreta de derrubada ou desmantelamento do altar.
- source_word: destructum est
  choice: foi destruído
  rationale: Equivalente direto, preservando o paralelismo verbal da sequência.
