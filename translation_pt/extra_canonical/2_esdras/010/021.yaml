  text: For you see that our sanctuary has been laid waste, our altar has been torn down, and our temple has been destroyed.
translation:
  language: pt
  text: Pois você vê que o nosso santuário ficou desolado, o nosso altar foi demolido e o nosso templo foi destruído.
