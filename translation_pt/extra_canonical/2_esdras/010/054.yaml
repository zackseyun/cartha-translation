  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tibi ut uenires in agrum, ubi non est fundamentum aedificii. Nec enim poterat opus aedificii hominis sustinere in loco ubi incipiebat altissimi ciuitas ostendi. Tu ergo noli timere, neque expauescat cor tuum, sed ingredere et uide splendorem et magnitudinem aedificii, quantum capax est tibi uisus oculorum uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/054.yaml
  text: For no work of human building could endure in the place where the city of the Most High was beginning to be shown.
translation:
  language: pt
  text: Pois nenhuma construção humana poderia se manter no lugar onde a cidade do Altíssimo começava a ser mostrada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus aedificii hominis
  choice: construção humana
  rationale: Expressa de modo natural e conciso a obra arquitetônica feita por seres humanos, sem a formulação pouco idiomática “obra de edificação do homem”.
- source_word: sustinere
  choice: se manter
  rationale: No contexto de uma construção situada em determinado lugar, comunica a ideia de subsistir ou permanecer de pé.
- source_word: altissimi
  choice: Altíssimo
  rationale: Mantém o título divino tradicional e reconhecível em português.
- source_word: incipiebat ... ostendi
  choice: começava a ser mostrada
  rationale: Preserva tanto o aspecto incoativo de “incipiebat” quanto a voz passiva de “ostendi”, sem identificar explicitamente quem mostrava a cidade.
theological_decisions:
- issue: Agente da manifestação da cidade
  choice: 'Manter a construção passiva: “começava a ser mostrada”'
  alternative: “começava a aparecer” ou “Deus começava a mostrar”
  rationale: O latim não nomeia o agente; a tradução conserva essa abertura e não acrescenta uma identificação teológica ausente do texto.
translation_notes:
  register: Português moderno, digno e acessível, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A frase preserva a relação causal introduzida por “Nec enim” mediante “Pois”.
