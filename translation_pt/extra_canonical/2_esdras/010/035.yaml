lexical_decisions:
- source_word: sciebam
  choice: eu sabia
  rationale: Preserva o imperfeito de scire e a repetição lexical com non scio, sem introduzir a ideia de ver, ausente no latim.
- source_word: audio
  choice: ouço
  rationale: Equivalente direto e natural do presente latino, mantendo a mudança temporal do imperfeito para o presente.
- source_word: quae non scio
  choice: o que não sei
  rationale: Mantém a repetição de scire e a formulação deliberadamente paradoxal do texto.
- source_word: Aut numquid
  choice: ou será que
  rationale: Expressa com naturalidade a introdução interrogativa latina, sem completar o raciocínio interrompido.
- source_word: sensus meus
  choice: o meu entendimento
  rationale: Neste contexto cognitivo, entendimento comunica melhor sensus do que sensação ou sentido, embora o termo latino tenha amplitude semântica.
theological_decisions:
- issue: Relação paradoxal entre saber, ouvir e não saber
  choice: 'Preservar literalmente a tensão: “eu sabia, e ouço o que não sei”'
  alternative: 'Explicitar ou harmonizar o sentido, por exemplo: “vi o que não conhecia e ouço o que não entendo”'
  rationale: O latim repete formas de scire e não autoriza substituir o primeiro verbo por ver nem o segundo por entender.
- issue: Cláusula final incompleta
  choice: Manter a interrupção com reticências
  alternative: Completar a pergunta com conteúdo inferido do contexto subsequente
  rationale: O trecho fornecido termina em sensus meus; completar a oração resolveria indevidamente uma lacuna sintática do versículo isolado.
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do latim. A repetição de “sabia/sei” foi mantida intencionalmente, apesar de sua estranheza retórica.
