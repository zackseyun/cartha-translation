  yaml_path: translation/extra_canonical/2_esdras/010/045.yaml
  text: And as for her saying to you that she had been barren for thirty years[a][45], this is because there were three thousand years in the world when no offering had yet been offered in her.
translation:
  language: pt
  text: E, quanto ao que ela lhe disse — que havia sido estéril por trinta anos —, isso se deve ao fato de que houve três mil anos no mundo[a][45] durante os quais ainda não havia sido apresentada nela oferta alguma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «na era».
    reason: previous_rendering
  - marker: '45'
    text: A formulação latina por trás de «três mil anos» é condensada e difícil. Esta interpretação segue a cronologia simbólica do capítulo, na qual os trinta anos da mulher correspondem a uma época muito mais longa anterior à apresentação de ofertas em Sião.
    reason: textual_variant
lexical_decisions:
- source_word: saeculo
  choice: no mundo
  rationale: Neste contexto, indica o transcurso da história do mundo; «na era» continua possível e é registrada em nota.
- source_word: oblatio oblata
  choice: se havia apresentado oferta alguma
  rationale: Reproduz de modo natural a construção enfática latina e conserva o sentido cultual de oblatio.
- source_word: in ea
  choice: nela
  rationale: Mantém a referência feminina à cidade simbolizada pela mulher, sem explicitar além do texto.
- source_word: annis triginta
  choice: por trinta anos
  rationale: Preserva a duração expressa pelo ablativo latino e sua função na correspondência simbólica.
theological_decisions:
- issue: Correspondência entre os trinta anos da mulher e a cronologia simbólica de Sião
  choice: três mil anos
  alternative: três anos
  rationale: Embora o latim preservado esteja comprimido («anni saeculo tres»), a leitura de três mil anos corresponde à cronologia simbólica desenvolvida no capítulo e ao testemunho interpretativo auditado; a dificuldade textual é mantida em nota.
- issue: Referente de «nela»
  choice: manter o pronome feminino
  alternative: explicitar «em Sião» ou «na cidade»
  rationale: O pronome conserva a identificação simbólica sem resolver de forma mais explícita do que a fonte a relação entre mulher e cidade.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição literal «oferta oferecida» foi evitada em favor da expressão idiomática «apresentado oferta», sem perder o teor cultual. Os marcadores foram colocados junto à expressão cronológica a que suas notas efetivamente se referem.
