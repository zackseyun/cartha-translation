revisions:
- from: E, quanto ao fato de ela ter dito que havia sido estéril por trinta anos, isso se deve a que houve três mil anos no mundo[a][45] durante os quais ainda não se havia apresentado nela oferta alguma.
  to: E, quanto ao que ela lhe disse — que havia sido estéril por trinta anos —, isso se deve ao fato de que houve três mil anos no mundo[a][45] durante os quais ainda não havia sido apresentada nela oferta alguma.
  rationale: A revisão melhora a naturalidade da relação causal e torna a referência à fala da mulher mais direta, conservando o sentido contextual. Mantêm-se «três mil anos», «no mundo» e o pronome «nela», bem como as notas e seus marcadores, para preservar tanto a cronologia simbólica quanto a dificuldade do latim.
