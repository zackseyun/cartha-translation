  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et psalterium nostrum humiliatum est et hymnus noster conticuit et exultatio nostra dissoluta est, et lumen candelabri nostri extinctum est et arca testamenti nostri direpta est et sancta nostra contaminata sunt, et nomen quod nominatumest super nos paene profanatum est, et liberi nostri contumeliam passi sunt, et sacerdotes nostri succensi sunt et Levitae nostri in captivitate abierunt, et virgines nostrae coinquinatae sunt et mulieres nostrae vim passae sunt, et iusti nostri rapti sunt et parvuli nostri proditisunt, et iuvenes nostri servierunt et fortes nostri invalidi facti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/022.yaml
  text: Our harp has been brought low[a], our hymn has fallen silent, our rejoicing has been dissolved, the light of our lampstand has been extinguished, the ark of our covenant has been plundered, our holy things have been defiled, and the name that was called over us has been almost profaned. Our children have suffered insult, our priests have been burned, our Levites have gone into captivity, our virgins have been defiled, our women have suffered violence, our righteous men have been carried off, our little ones have been betrayed, our young men have been enslaved[b], and our strong men have become weak.
translation:
  language: pt
  text: Nossa harpa foi humilhada[a], nosso hino emudeceu, nossa alegria se desfez, a luz do nosso candelabro se apagou, a arca da nossa aliança foi saqueada, nossas coisas santas foram profanadas, e o nome invocado sobre nós foi quase profanado. Nossos filhos sofreram humilhação, nossos sacerdotes foram queimados, nossos levitas foram levados para o cativeiro, nossas virgens foram contaminadas, nossas mulheres sofreram violência, nossos justos foram levados à força, nossas crianças foram entregues[b], nossos jovens foram escravizados, e nossos homens fortes se tornaram fracos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Nosso saltério”.'
    reason: O latim psalterium nomeia um instrumento de cordas que também pode ser transliterado como “saltério”.
  - marker: b
    text: 'Ou: “foram traídas”.'
    reason: O latim proditi sunt pode significar tanto “foram entregues” quanto “foram traídas”.
lexical_decisions:
- source_word: psalterium
  choice: harpa
  rationale: Designa o instrumento de cordas, não o cântico; “harpa” é corrente e compreensível em português.
- source_word: humiliatum est
  choice: foi humilhada
  rationale: Mantém a personificação e a imagem forte do latim, em vez de explicá-la como simples abatimento físico.
- source_word: exultatio nostra dissoluta est
  choice: nossa alegria se desfez
  rationale: Reproduz a ideia de dissolução ou desintegração com expressão natural em português.
- source_word: nomen quod nominatum est super nos
  choice: o nome invocado sobre nós
  rationale: Preserva a fórmula bíblica de pertencimento e identificação ligada ao nome, sem a tornar excessivamente literal.
- source_word: coinquinatae sunt
  choice: foram violadas
  rationale: No contexto paralelo de calamidades sofridas por virgens e mulheres, comunica profanação sexual; o termo português mantém a gravidade sem explicitação adicional.
- source_word: proditi sunt
  choice: foram entregues
  rationale: O particípio latino pode indicar entrega ao inimigo ou traição; “entregues” preserva melhor a amplitude contextual, com a alternativa registrada em nota.
- source_word: servierunt
  choice: foram escravizados
  rationale: No contexto de conquista e cativeiro, exprime de modo natural que os jovens foram reduzidos à servidão.
theological_decisions:
- issue: A fórmula do nome chamado sobre o povo
  choice: o nome invocado sobre nós
  alternative: o nome pelo qual somos chamados
  rationale: A opção escolhida conserva a construção bíblica de o nome divino ser posto ou invocado sobre o povo e evita reduzir a expressão a uma simples denominação.
- issue: Sentido de proditi sunt aplicado às crianças
  choice: foram entregues
  alternative: foram traídas
  rationale: O latim admite tanto entrega quanto traição. O texto principal evita pressupor um ato específico de deslealdade interna, enquanto a nota preserva essa possibilidade.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com paralelismo cumulativo preservado. Empregou-se “aliança” para testamentum no sentido bíblico, “levitas” em minúscula conforme o uso corrente e formas verbais naturais sem apagar as imagens fortes do original.
