source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quod omnium maius, signaculum Sion, quoniam resignata est de gloria sua nunc et tradita est in manibus eorum qui nos oderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/023.yaml
  text: And what is greatest of all[a][23], the seal of Zion—for now she has been unsealed from her glory and handed over into the hands of those who hate us.
translation:
  language: pt
  text: E, o que é maior que tudo, o selo de Sião[a], pois agora ela foi desselada de sua glória[b] e entregue nas mãos dos que nos odeiam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “o selo de Sião” é difícil. Pode referir-se à glória distintiva de Sião, à sua condição autenticada ou a algum sinal emblemático de honra; a imagem do latim foi mantida em vez de ser substituída por uma interpretação.
    reason: lexical_alternative
  - marker: b
    text: 'Ou: “foi despojada de sua glória”.'
    reason: previous_rendering
lexical_decisions:
- source_word: signaculum Sion
  choice: o selo de Sião
  rationale: Preserva a imagem concreta e difícil do latim, sem reduzi-la a uma interpretação como distintivo, honra ou glória.
- source_word: resignata est de gloria sua
  choice: ela foi desselada de sua glória
  rationale: Mantém a relação imagética entre signaculum e resignata e segue o feminino singular dos verbos latinos, cujo referente é Sião. A formulação incomum reflete a dificuldade real do original; uma alternativa idiomática aparece em nota.
- source_word: tradita est in manibus eorum qui nos oderunt
  choice: entregue nas mãos dos que nos odeiam
  rationale: Reproduz naturalmente o idioma latino de entrega ao poder de inimigos e conserva a primeira pessoa plural.
theological_decisions:
- issue: Sentido de “o selo de Sião”
  choice: Conservar a metáfora sem explicá-la no corpo do texto
  alternative: Parafrasear como “a glória distintiva de Sião” ou “a condição autenticada de Sião”
  rationale: O referente exato é incerto; explicitar uma única leitura eliminaria uma ambiguidade genuína do texto.
- issue: Referente dos verbos femininos resignata est e tradita est
  choice: 'Tratar Sião como sujeito feminino: “ela”'
  alternative: Tratar “o selo” como sujeito
  rationale: As formas femininas singulares concordam com Sion, e não com o neutro signaculum.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A construção deliberadamente incomum “desselada de sua glória” preserva o jogo de imagens do latim; a nota oferece a leitura mais idiomática.
