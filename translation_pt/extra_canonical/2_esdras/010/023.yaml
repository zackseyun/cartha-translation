  verdict: approve
  source_fidelity: A tradução preserva adequadamente a estrutura enfática e algo elíptica de *quod omnium maius, signaculum Sion*. “O selo de Sião” mantém a imagem difícil de *signaculum Sion* sem impor uma explicação. “Ela” corretamente retoma Sião, em conformidade com os particípios femininos singulares *resignata* e *tradita*, e “entregue nas mãos dos que nos odeiam” reproduz com fidelidade o sentido de *tradita est in manibus eorum qui nos oderunt*.
  naturalness: O português é atual e compreensível. “Desselada de sua glória” é propositalmente incomum, mas é uma escolha defensável para conservar a ligação imagética com “selo”; a nota fornece uma alternativa idiomática. A elipse após “o que é maior que tudo” reflete o caráter abrupto e retórico do latim.
  terminology: “Sião”, “selo”, “glória” e “entregue nas mãos” são escolhas terminologicamente adequadas. As notas explicam a incerteza de “selo de Sião” e identificam de modo apropriado a alternativa menos literal para *resignata est*.
