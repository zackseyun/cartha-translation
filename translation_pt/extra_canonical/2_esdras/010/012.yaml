- source_word: terrae
  choice: o da terra
  rationale: A elipse portuguesa retoma “lamento” e preserva a comparação expressa pelo genitivo latino.
- source_word: fructum uentris mei
  choice: o fruto do meu ventre
  rationale: Mantém a metáfora corporal e familiar do latim, clara no contexto da perda de um filho.
