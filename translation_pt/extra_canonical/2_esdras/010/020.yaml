id: 2ES.10.20
reference: 2 Esdras 10:20
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: noli facere sermonem hunc, sed consenti persuaderi – quid enim casus Sion – et consolare propter dolorem Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/020.yaml
  text: Do not say this[a], but consent to be persuaded—for how great is Zion’s downfall!—and be comforted because of Jerusalem’s sorrow.
translation:
  language: pt
  text: Não diga isso, mas aceite ser persuadido — quão grande é, pois, a queda de Sião! — e console-se por causa da dor de Jerusalém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli facere sermonem hunc
  choice: Não diga essas coisas
  rationale: A expressão latina significa literalmente não ‘fazer este discurso’, mas, em português corrente, a proibição de proferir tais palavras é comunicada com naturalidade por ‘não diga essas coisas’.
- source_word: consenti persuaderi
  choice: deixe-se convencer
  rationale: Preserva a ideia de consentir em ser persuadido, evitando a formulação rígida ‘consinta em ser persuadido’.
- source_word: casus Sion
  choice: a queda de Sião
  rationale: ‘Casus’ pode indicar queda, ruína ou desgraça; ‘queda’ conserva de modo conciso a imagem e a gravidade do termo latino.
- source_word: consolare propter dolorem Hierusalem
  choice: encontre consolo por causa da dor de Jerusalém
  rationale: Expressa o imperativo reflexivo/passivo de ‘consolare’ e mantém ‘propter’ como relação causal, sem transformar a dor de Jerusalém naquilo que deve ser consolado.
theological_decisions:
- issue: Valor retórico de ‘quid enim casus Sion’
  choice: pois quão grande é a queda de Sião!
  alternative: por causa das calamidades de Sião
  rationale: O latim não apresenta aqui um marcador causal equivalente a ‘por causa de’. ‘Quid enim’ introduz uma exclamação abrupta e enfática, que deve ser preservada sem resolver a construção como frase causal.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. Os travessões preservam a interrupção parentética e a exclamação do latim.
