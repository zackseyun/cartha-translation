  text: tu ergo noli timere neque expavescat cor tuum, sed ingredere et vide splendorem vel magnitudinem aedificii, quantum capax est tibi visu oculorum videre.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/055.yaml
  text: Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor or the greatness of the building, as much as your eyes are able to see.
translation:
  language: pt
  text: Portanto, não tenha medo, nem se apavore o seu coração; entre e veja o esplendor ou a grandeza do edifício, até onde seus olhos forem capazes de enxergar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: noli timere
  choice: não tenha medo
  rationale: Expressão natural e direta que preserva a proibição no singular.
- source_word: neque expavescat cor tuum
  choice: nem se apavore o seu coração
  rationale: Mantém a imagem do coração como sujeito e a intensidade de expavescat, em registro digno e compreensível.
- source_word: ingredere
  choice: entre
  rationale: Traduz o imperativo de ingressar no edifício de modo conciso.
- source_word: splendorem vel magnitudinem
  choice: o esplendor ou a grandeza
  rationale: Preserva vel como alternativa («ou»), sem convertê-lo em coordenação.
- source_word: aedificii
  choice: do edifício
  rationale: Equivalente direto e adequado ao contexto arquitetônico.
- source_word: quantum capax est tibi visu oculorum videre
  choice: até onde seus olhos forem capazes de enxergar
  rationale: Reformula a construção latina algo redundante em português natural, preservando o limite imposto pela capacidade visual.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com imperativos no singular em tratamento por «você» implícito. A formulação conserva a imagem semítica do coração e a ambiguidade lexical de vel.
