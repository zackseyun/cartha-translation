  text: Then I left off the words in which I had still been engaged, and I answered in anger and said,
translation:
  language: pt
  text: 'Então interrompi as palavras que ainda estava proferindo, respondi com indignação e disse:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliqui
  choice: interrompi
  rationale: No contexto, indica que Esdras deixou de prosseguir no discurso em que estava ocupado; “interrompi” comunica isso naturalmente em português.
- source_word: sermones in quibus adhuc eram
  choice: as palavras que ainda estava dizendo
  rationale: Reproduz de modo idiomático a ideia latina de estar ainda ocupado com aquelas palavras, sem tornar a construção artificial.
- source_word: respondi cum
  choice: respondi com ira
  rationale: O texto fornecido termina em “cum”, mas a continuação atestada e refletida na camada inglesa completa a expressão como resposta irada; mantém-se a formulação sem acrescentar objeto indireto ausente no latim citado.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A coordenação “respondi com ira e disse” preserva a repetição semítica transmitida pelo latim. Não se acrescenta “a ela”, pois o objeto indireto não aparece no texto latino fornecido.
