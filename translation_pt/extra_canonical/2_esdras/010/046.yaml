lexical_decisions:
- source_word: tres
  choice: Três coisas
  rationale: Mantém o numeral do texto latino e segue a leitura adotada pela camada de consulta, embora a construção permaneça abrupta no fragmento.
- source_word: aedificauit
  choice: edificou
  rationale: Reproduz o sentido concreto de construir e conserva o tom narrativo digno.
- source_word: obtulit oblationes
  choice: apresentou ofertas
  rationale: Expressa o ato cultual sem tornar a formulação desnecessariamente técnica nem introduzir um tipo específico de sacrifício.
- source_word: sterilis
  choice: a mulher estéril
  rationale: O adjetivo latino é substantivado no contexto; a explicitação de 'mulher' é natural em português e corresponde à figura mencionada.
- source_word: peperit
  choice: deu à luz
  rationale: É a expressão portuguesa corrente e precisa para o ato de gerar um filho.
- source_word: Et quod tibi dixit quoniam
  choice: E quanto ao que ela lhe disse, que...
  rationale: Preserva a ligação sintática incompleta com o versículo seguinte; 'ela' retoma naturalmente a figura feminina do contexto.
