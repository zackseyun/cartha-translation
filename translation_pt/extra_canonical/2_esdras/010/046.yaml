review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva adequadamente o numeral «três», a construção/edificação, as ofertas e o nascimento do filho. Contudo, «quanto ao» acrescenta uma moldura topical que não está expressa em «Et quod», e as reticências são uma intervenção editorial desnecessária: o «que» final já conserva por si a dependência sintática que continua no versículo seguinte. Dada a sintaxe manifestamente abrupta deste trecho do fragmento latino e a leitura da trilha inglesa («three things ... in the city»), a ordem portuguesa pode ser tornada clara sem resolver ou ocultar a dificuldade textual.'
  naturalness: «Três coisas Salomão edificou na cidade» é compreensível, mas tem uma ordem marcadamente calcada. «Salomão construiu três coisas na cidade» é português moderno e conserva a mesma informação. «Deu à luz» e «apresentou ofertas» são naturais e apropriados ao registro.
  terminology: «Salomão», «ofertas», «mulher estéril» e «deu à luz um filho» são escolhas adequadas. «Construiu» transmite com clareza a força de aedificauit; não há questão teológica ou denominacional envolvida.
