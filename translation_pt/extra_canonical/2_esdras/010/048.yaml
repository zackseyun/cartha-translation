  yaml_path: translation/extra_canonical/2_esdras/010/048.yaml
  text: And as for her saying to you[a], ‘My son, when he entered his bridal chamber, died, and disaster befell him,’ this was the ruin that came upon Jerusalem.
translation:
  language: pt
  text: 'E, quanto ao que ela lhe disse[a]: “Meu filho, ao entrar em seu quarto nupcial, morreu, e uma desgraça lhe sobreveio”, isto foi a ruína que sobreveio a Jerusalém.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “ela lhe disse que seu filho, ao entrar em seu quarto nupcial, morreu e uma desgraça lhe sobreveio”.'
    reason: Registra a possibilidade de entender quod como introdutor de discurso indireto; o discurso direto explica melhor “meu filho” no contexto.
lexical_decisions:
- source_word: thalamo
  choice: quarto nupcial
  rationale: Expressa de modo claro e natural o aposento associado às núpcias, preservando a imagem do latim.
- source_word: casus
  choice: desgraça
  rationale: No contexto, indica uma calamidade ou infortúnio que atingiu o filho, e não simplesmente uma queda física.
- source_word: ruina Hierusalem
  choice: a ruína que sobreveio a Jerusalém
  rationale: Mantém a identificação simbólica da morte do filho com a catástrofe sofrida por Jerusalém.
theological_decisions:
- issue: Forma da fala introduzida por quod
  choice: 'Discurso direto: “Meu filho...”'
  alternative: 'Discurso indireto: “que meu filho...”'
  rationale: O pronome de primeira pessoa meus favorece a leitura de quod como introdutor de citação direta; a alternativa gramatical é preservada em nota.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A formulação conserva a metáfora nupcial e a relação simbólica com a ruína de Jerusalém.
