  text: 'et dixit ad me: non potes. et dixi: quare, domine, aut quidnascebar, aut quare non fiebat matrix matris meae mihi sepulchrum, ut non viderem laborem Iacob et defatigationem generis Israhel?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/035.yaml
  text: And he said to me[a], 'You cannot.' And I said, 'Why, Lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see the trouble of Jacob and the weariness of the stock of Israel?'
translation:
  language: pt
  text: 'E ele me disse: “Você não pode.” Então eu disse: “Por que, senhor? Por que nasci? Por que o ventre de minha mãe não se tornou meu túmulo, para que eu não visse o sofrimento de Jacó e a exaustão da descendência de Israel?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: matrix matris meae
  choice: o ventre de minha mãe
  rationale: Expressão natural e fiel para o útero materno, sem perder a imagem concreta do texto latino.
- source_word: labor Iacob
  choice: o sofrimento de Jacó
  rationale: Neste lamento, labor indica aflição penosa, não meramente trabalho; “sofrimento” comunica o sentido com clareza.
- source_word: defatigationem generis Israhel
  choice: a exaustão da descendência de Israel
  rationale: “Exaustão” preserva a força de defatigatio, e “descendência” representa genus sem reduzir a expressão simplesmente a uma entidade política.
theological_decisions:
- issue: Forma de tratamento em “domine”
  choice: meu senhor[a]
  alternative: Senhor
  rationale: O interlocutor imediato é o ser celestial que fala com Esdras; a forma em minúscula evita identificar silenciosamente esse interlocutor com Deus, enquanto a nota preserva a leitura tradicional possível.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo retórico preservado nas perguntas sucessivas. A construção “não se tornou meu túmulo” mantém a imagem incisiva do original.
