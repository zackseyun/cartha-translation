  text: And I fasted for seven days[a], wailing and weeping, as Uriel the angel had commanded me.
translation:
  language: pt
  text: E eu jejuei durante sete dias, lamentando e chorando, como o anjo Uriel me havia ordenado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ieiunavi
  choice: jejuei
  rationale: Tradução direta e natural do perfeito latino, mantendo a ação na primeira pessoa.
- source_word: diebus septem
  choice: durante sete dias
  rationale: Expressa com clareza e naturalidade a duração indicada pelo ablativo latino.
- source_word: ululans et plorans
  choice: lamentando e chorando
  rationale: Preserva as duas manifestações de dor sem recorrer a uma formulação excessivamente incomum; 'lamentando' comunica o lamento audível de ululans, e 'chorando' corresponde a plorans.
- source_word: sicut mihi mandavit
  choice: como ... me havia ordenado
  rationale: O mais-que-perfeito em português deixa clara a anterioridade da ordem em relação ao jejum, implícita no contexto latino.
- source_word: Urihel angelus
  choice: o anjo Uriel
  rationale: Adota a forma portuguesa corrente do nome e uma ordem nominal natural, preservando o título.
