lexical_decisions:
- source_word: interroga
  choice: Pergunte
  rationale: Imperativo natural em português, preservando o sentido direto de consultar ou interrogar.
- source_word: quae parit
  choice: uma mulher que dá à luz
  rationale: O relativo feminino latino pressupõe uma mulher; o artigo indefinido expressa corretamente o caráter geral da afirmação.
- source_word: dicet tibi
  choice: ela lhe dirá
  rationale: Mantém o futuro e o objeto indireto do latim em linguagem corrente.
- source_word: Dices enim ei
  choice: Pois você lhe dirá
  rationale: Conserva tanto a conjunção explicativa quanto o verbo latino 'dizer', sem antecipar uma interpretação contextual como 'perguntar'.
- source_word: quare
  choice: Por que
  rationale: Introduz a pergunta que continua além do limite deste versículo.
