  yaml_path: translation/extra_canonical/2_esdras/005/042.yaml
  text: 'And he said to me[a], ''I will liken my judgment to a crown: as there is no delay for the last, so there is no haste for the first.'''
translation:
  language: pt
  text: 'E ele me disse: “Compararei meu juízo a uma coroa[a]: assim como não há demora para os últimos, também não há pressa para os primeiros.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Coroa” também pode ser entendida como “círculo” ou “anel”; nesse caso, a comparação ressaltaria a simetria entre os primeiros e os últimos.
    reason: lexical_alternative
lexical_decisions:
- source_word: adsimilabo
  choice: Compararei
  rationale: Expressa de modo natural e direto a ideia de estabelecer uma semelhança, sem tornar a frase excessivamente literal.
- source_word: coronae
  choice: a uma coroa
  rationale: Mantém o sentido lexical principal do latim, preservando em nota a possível imagem de círculo ou anel.
- source_word: novissimorum / priorum
  choice: para os últimos / para os primeiros
  rationale: Conserva o contraste temporal e a simetria da formulação latina em português claro.
- source_word: tarditas / velocitas
  choice: demora / pressa
  rationale: Reproduz o contraste entre tardança e rapidez de maneira idiomática no contexto do juízo.
