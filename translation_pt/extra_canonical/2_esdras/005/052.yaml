  yaml_path: translation/extra_canonical/2_esdras/005/052.yaml
  text: For you will say to her, "Why are those whom you have now borne not like those who came before, but smaller in stature?"
translation:
  language: pt
  text: 'Pois você lhe dirá: “Por que os que você deu à luz agora não são semelhantes aos de antes, mas têm menor estatura?” E ela mesma lhe dirá: “Outros são os que, no vigor da juventude...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quos peperisti
  choice: os que você deu à luz
  rationale: Mantém a imagem explícita de parto e a referência aos filhos, sem acrescentar um substantivo ausente no latim.
- source_word: minores statu
  choice: têm menor estatura
  rationale: Traduz diretamente a comparação física expressa por statu, em português natural.
- source_word: Et dicet tibi et ipsa
  choice: E ela mesma lhe responderá
  rationale: O valor enfático de et ipsa é preservado por “ela mesma”; “responderá” expressa naturalmente a fala provocada pela pergunta.
- source_word: in iuuentute uirtutis
  choice: no vigor da juventude
  rationale: Preserva a associação entre juventude e força/vigor, evitando uma formulação excessivamente literal e obscura.
theological_decisions:
- issue: Inclusão da oração que inicia a resposta da mulher
  choice: 'Manter “E ela mesma lhe responderá: ‘Uns são os que nascem no vigor da juventude...’”'
  alternative: Encerrar o versículo após a pergunta, como no texto inglês de consulta
  rationale: O texto latino fornecido inclui essa oração. A tradução segue prioritariamente a evidência da fonte original, e as reticências indicam que a frase continua no versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para legibilidade ampla. A estrutura interrogativa e a metáfora materna foram preservadas. A frase final permanece deliberadamente incompleta porque o excerto latino termina em meio à resposta.
