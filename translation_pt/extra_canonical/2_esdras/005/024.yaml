  text: and from all the lands of the world you chose for yourself one pit[a], and from all the flowers of the world you chose for yourself one lily,
translation:
  language: pt
  text: e, dentre todas as terras do mundo, escolheste para ti uma só cova[a]; e, dentre todas as flores do mundo, escolheste para ti um só lírio,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, segundo uma redação anterior: “e, dentre todas as profundezas do mar, encheste para ti um só rio; e, dentre todas as cidades construídas, santificaste Sião para ti”.'
    reason: previous_rendering
lexical_decisions:
- source_word: ex omnium terrarum orbis
  choice: dentre todas as terras do mundo
  rationale: Reproduz o sentido abrangente da expressão latina em português natural, com «dentre» indicando seleção.
- source_word: elegisti tibi
  choice: escolheste para ti
  rationale: Mantém tanto o ato de escolher como o dativo de interesse expresso por «tibi».
- source_word: foveam unam
  choice: uma só cova
  rationale: «Cova» é o equivalente direto e inteligível de «fovea»; «uma só» ressalta a singularidade contrastiva de «unam» sem tentar corrigir a leitura incomum do texto.
- source_word: lilium unum
  choice: um só lírio
  rationale: Traduz literalmente o substantivo e preserva o paralelismo com «uma só cova».
theological_decisions:
- issue: A imagem incomum de Deus escolher uma cova
  choice: Preservar «uma só cova» no texto principal
  alternative: Substituir pelo texto de uma tradição ou numeração diferente sobre o abismo do mar, um rio e Sião
  rationale: A leitura fornecida pelo texto latino deste versículo é inequívoca quanto a «foveam unam». A estranheza da imagem não autoriza harmonização nem importação do versículo seguinte.
translation_notes:
  register: Português moderno, claro e digno, com forma verbal «escolheste» coerente com a oração dirigida diretamente a Deus. O paralelismo e a repetição do original foram preservados.
