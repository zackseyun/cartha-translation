source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'de signis autem: ecce dies venient, et adprehendentur qui inhabitant super terram in excessu multo, et abscondetur veritatis via, et sterilis erit a fide regio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/001.yaml
  text: 'But concerning the signs: behold[a], days are coming when those who dwell on the earth will be seized with great terror, and the way of truth will be hidden, and the land will be barren of faith.'
translation:
  language: pt
  text: 'Quanto aos sinais: eis que virão dias em que os habitantes da terra serão tomados de grande terror[a], o caminho da verdade ficará oculto, e a terra será estéril de fé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “de grande perplexidade”.
    reason: Preserva uma tradução alternativa possível para o latim “in excessu multo” e seu provável substrato grego.
lexical_decisions:
- source_word: in excessu multo
  choice: de grande terror
  rationale: A expressão latina provavelmente reflete o grego ἐν ἐκστάσει μεγάλῃ e, neste contexto apocalíptico, indica pânico ou terror intenso; a nota preserva a possibilidade de perplexidade.
- source_word: adprehendentur
  choice: serão tomados
  rationale: Conserva a imagem passiva de serem dominados ou acometidos por um estado intenso, com formulação natural em português.
- source_word: regio
  choice: a terra
  rationale: Neste contexto, designa o território ou mundo habitado; “a terra” é claro e mantém o paralelismo com os habitantes da terra.
- source_word: sterilis erit a fide
  choice: será estéril de fé
  rationale: Mantém a metáfora agrícola forte e incomum do latim sem suavizá-la para uma simples ausência de fé.
theological_decisions:
- issue: Natureza de “in excessu multo”
  choice: grande terror
  alternative: grande perplexidade
  rationale: O contexto de sinais escatológicos favorece terror ou pânico, mas a amplitude semântica do provável substrato grego permite perplexidade; por isso, a alternativa é registrada em nota.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A construção “eis que virão dias” preserva o tom profético; “estéril de fé” mantém deliberadamente a metáfora marcante do texto-fonte.
