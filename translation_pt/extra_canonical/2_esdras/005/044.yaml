base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/044.yaml
  text: And he answered me and said[a], 'The creature cannot hasten faster than the Creator, nor can the age sustain those who were created in it all at once.'
translation:
  language: pt
  text: 'Ele me respondeu: “A criatura não pode apressar-se mais do que o Criador, nem a era pode sustentar de uma só vez aqueles que nela foram criados.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creatura
  choice: a criatura
  rationale: Mantém o sentido concreto e a correspondência lexical do latim, sem excluir a possibilidade de representar coletivamente a ordem criada.
- source_word: festinare super
  choice: apressar-se mais do que
  rationale: Expressa naturalmente o valor comparativo de super neste contexto, em vez de lhe dar um sentido espacial.
- source_word: saeculum
  choice: a era
  rationale: Preserva o sentido temporal e cosmológico do termo latino, mais específico aqui do que “mundo”.
- source_word: sustinere
  choice: sustentar
  rationale: Conserva a imagem de suportar ou comportar o peso/conjunto dos seres criados.
- source_word: in unum
  choice: de uma só vez
  rationale: 'Indica simultaneidade: a era não comporta todos os seus seres criados ao mesmo tempo.'
theological_decisions:
- issue: Relação entre a criatura e o Criador
  choice: não pode apressar-se mais do que o Criador
  alternative: não pode ultrapassar o Criador
  rationale: A formulação comparativa preserva a tensão do texto sem introduzir uma ideia espacial ou doutrinária mais definida do que o latim exige.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com estrutura concisa. O início foi vertido simplesmente como “Ele me respondeu”, evitando a redundância pouco natural de “respondeu-me e disse” sem perda substantiva.
