source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: his qui ante uos, Et qui post uos quam et uos, quasi iam senescentis creaturae et fortitudinem iuuentutis praeterientis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/055.yaml
  text: 'Therefore consider also for yourself: you are smaller in stature than those before you, and those who come after you will be smaller than you, as of a creation already growing old and passing beyond the strength of youth.'
translation:
  language: pt
  text: 'Portanto, considera também a teu próprio respeito: és menor em estatura do que os que vieram antes de ti, e os que vierem depois de ti serão menores do que tu, como uma criação que já envelhece e deixa para trás o vigor da juventude.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: senescentis creaturae
  choice: uma criação que já envelhece
  rationale: Preserva a personificação e o aspecto progressivo de senescere, em linguagem portuguesa natural.
- source_word: fortitudinem iuuentutis
  choice: o vigor da juventude
  rationale: “Vigor” expressa de modo idiomático a força própria da juventude sem restringir o sentido à força física.
- source_word: praeterientis
  choice: deixa para trás
  rationale: Conserva a imagem de ultrapassar ou passar além do vigor juvenil, evitando explicar em excesso a metáfora.
- source_word: minor ... his qui ante uos
  choice: menor em estatura do que os que vieram antes de ti
  rationale: Segue o sentido comparativo explicitado pelo contexto textual e preservado na camada inglesa auditada; “em estatura” mantém a imagem de tamanho em vez de convertê-la genericamente em inferioridade.
theological_decisions:
- issue: O envelhecimento da criação
  choice: manter a criação personificada como envelhecendo e perdendo o vigor juvenil
  alternative: interpretar como decadência moral ou redução literal da altura humana
  rationale: O latim apresenta uma metáfora cosmológica ampla e não especifica se a diminuição é física, moral ou espiritual; a tradução preserva essa tensão.
translation_notes:
  register: Português atual, digno e acessível, com tratamento por “tu” para conservar a interpelação individual refletida no contexto auditado. A construção metafórica foi mantida sem explicação doutrinária adicional.
