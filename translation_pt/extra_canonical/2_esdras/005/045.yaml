  source_fidelity: 'A tradução mantém adequadamente o sentido coletivo de creatura como “criação”, a repetição de in unum (“de uma só vez”) e a distinção argumentativa entre sustinebit e portare. Contudo, “resistirá” não representa bem sustinebit neste contexto: sugere oposição ou resistência, enquanto o sujeito, “a criação”, é apresentado como perdurando/continuando a existir diante da vida simultânea de todos.'
  naturalness: O texto é claro, de registro apropriado e natural em português moderno. “Perdurará” é uma formulação fluente e mais precisa que “resistirá”; “suportar” preserva a ideia de portare na oração final.
  terminology: “Criação que criaste” conserva a repetição etimológica de creatam creaturam e comunica corretamente o alcance coletivo. A nota alternativa “criatura” é pertinente e não impõe uma interpretação indevida.
