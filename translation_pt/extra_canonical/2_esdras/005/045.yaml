  text: 'cabis a te creatam creaturam in unum ? si ergo uiuentes uiuent in unum et sustinebit creatura, poterit et nunc portare praesentes in unum. Et dixit ad me : interroga matricem mulieris et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/045.yaml
  text: And I said[a], “How then did you say to your servant that you will surely give life to the creation created by you all at once? If then the living will live all at once and the creation will endure, it can also now bear those who are present all at once.”
translation:
  language: pt
  text: 'E eu disse: “Como, então, disseste ao teu servo que certamente darás vida, de uma só vez, à criação que criaste[a]? Se, portanto, os vivos viverão todos de uma só vez e a criação perdurará, ela também pode agora suportar todos os que estão presentes de uma só vez.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “à criatura que criaste”.
    reason: O latim creatura pode designar tanto a criação coletivamente quanto uma criatura; o contexto favorece o sentido coletivo.
lexical_decisions:
- source_word: creatam creaturam
  choice: à criação que criaste
  rationale: Preserva a repetição etimológica do latim e o sentido coletivo de creatura, confirmado por uiuentes e pela retomada de creatura na frase seguinte.
- source_word: in unum
  choice: de uma só vez
  rationale: Expressa aqui a simultaneidade coletiva, repetida nas duas ocorrências do versículo.
- source_word: sustinebit
  choice: resistirá
  rationale: Mantém a ideia de a criação subsistir ou aguentar sob a presença simultânea dos vivos, sem confundi-la com portare na oração seguinte.
- source_word: portare
  choice: suportar
  rationale: Traduz a capacidade da criação de comportar ou sustentar todos os presentes.
- source_word: praesentes
  choice: todos os que estão presentes
  rationale: Torna explícito em português o substantivo implícito no particípio latino, sem restringir sua referência.
theological_decisions:
- issue: Sentido coletivo de creatura
  choice: criação
  alternative: criatura
  rationale: O contexto fala dos vivos em conjunto e da capacidade do mundo criado de suportá-los simultaneamente; “criação” comunica melhor esse alcance coletivo, embora “criatura” continue linguisticamente possível.
- issue: Força temporal de uiuentes uiuent
  choice: os vivos viverão
  alternative: os que forem vivificados viverão
  rationale: Conserva a formulação e a tensão do latim sem interpretar uiuentes como referência técnica à ressurreição.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A repetição “de uma só vez” foi mantida para refletir a argumentação do original.
