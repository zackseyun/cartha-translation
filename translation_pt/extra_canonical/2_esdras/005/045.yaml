    issue: “resistirá” para sustinebit
    rationale: O latim sustinebit tem aqui a criação como sujeito e exprime que ela subsistirá, perdurará ou se manterá; não que ela resistirá a algo. A mudança evita deslocar o sentido para uma ação de oposição.
