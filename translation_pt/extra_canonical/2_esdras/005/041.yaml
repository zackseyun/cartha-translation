  text: 'meum aut finem caritatis quam populo meo promisi. Et dixi: sed ecce, domine, tu praees his qui in fine sunt, et quid facient qui ante nos sunt aut nos aut hi qui post nos ? Et dixit ad'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/041.yaml
  text: And I said[a], 'But behold, Lord, you preside over those who are at the end. And what will those do who were before us, or we ourselves, or those who will be after us?'
translation:
  language: pt
  text: 'E eu disse[a]: “Mas eis que, Senhor, tu governas os que estão no fim. E o que farão os que vieram antes de nós, ou nós mesmos, ou os que virão depois de nós?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução anterior trazia: “Senhor, tu governas os que estão no fim. Mas o que...”.'
    reason: Registra a formulação alternativa preservada na camada inglesa consultada; contudo, a sequência latina favorece “Mas eis que, Senhor...” e depois “E o que...”.
lexical_decisions:
- source_word: praees
  choice: governas
  rationale: O verbo latino indica estar à frente, presidir ou governar. “Governas” é claro e natural em português, sem perder a ideia de autoridade sobre o grupo mencionado.
- source_word: qui in fine sunt
  choice: os que estão no fim
  rationale: Mantém a formulação temporal e a possível amplitude de “fim”, sem especificar indevidamente “fim dos tempos”.
- source_word: qui ante nos sunt
  choice: os que vieram antes de nós
  rationale: Expressa em português corrente a referência às gerações anteriores; uma tradução rígida como “os que estão antes de nós” seria menos natural.
- source_word: hi qui post nos
  choice: os que virão depois de nós
  rationale: Torna explícita a relação temporal futura já indicada pelo contexto, sem acrescentar conteúdo teológico.
theological_decisions:
- issue: Sentido escatológico de “in fine”
  choice: no fim
  alternative: no fim dos tempos
  rationale: O latim diz apenas “in fine”. A tradução preserva a ambiguidade e evita impor uma identificação escatológica mais específica do que a fonte exige.
- issue: Forma de tratamento “domine”
  choice: Senhor
  alternative: senhor
  rationale: A maiúscula é apropriada no registro bíblico português quando Deus é diretamente invocado, sem alterar o valor lexical do vocativo latino.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe natural para ampla leitura lusófona e boa legibilidade brasileira. Conservou-se “eis que” por seu valor discursivo e tom solene, sem arcaísmo excessivo.
