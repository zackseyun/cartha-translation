id: 2ES.5.4
reference: 2 Esdras 5:4
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem tibi dederit Altissimus vivere, et videbis post tertiam turbatam, et relucescet subito sol noctu et luna interdie.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/004.yaml
  text: But if the Most High grants that you live[a], you will see after the third disturbance that the sun will suddenly shine at night, and the moon by day.
translation:
  language: pt
  text: Mas, se o Altíssimo lhe conceder continuar vivo, você verá, depois da terceira perturbação[a], o sol brilhar de repente durante a noite, e a lua durante o dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Algumas versões antigas trazem “depois da terceira trombeta”; o texto latino preservado diz “depois da terceira perturbação”.
    reason: Registra uma variante textual antiga e significativa sem substituir silenciosamente a leitura da edição latina usada como fonte.
lexical_decisions:
- source_word: Altissimus
  choice: o Altíssimo
  rationale: Preserva o título divino tradicional e corresponde diretamente ao latim.
- source_word: dederit ... vivere
  choice: lhe conceder continuar vivo
  rationale: Expressa de modo natural a ideia de receber do Altíssimo a possibilidade de permanecer vivo até presenciar os sinais.
- source_word: post tertiam turbatam
  choice: depois da terceira perturbação
  rationale: Segue o texto latino preservado, entendendo turbatam como referência elíptica a uma perturbação ou convulsão; a possível corrupção textual é indicada em nota.
- source_word: relucescet subito sol noctu
  choice: o sol brilhar de repente durante a noite
  rationale: Reproduz com clareza a inversão sobrenatural descrita pelo latim, sem tornar relucescet excessivamente técnico.
- source_word: luna interdie
  choice: a lua durante o dia
  rationale: Tradução direta e idiomática do contraste temporal latino.
theological_decisions:
- issue: Leitura textual de turbatam em contraste com a tradição de “trombeta”
  choice: Manter “perturbação” no texto principal e registrar “trombeta” em nota
  alternative: Adotar “depois da terceira trombeta” no texto principal
  rationale: A edição latina fornecida lê turbatam, enquanto versões antigas refletem uma leitura equivalente a “trombeta”, possivelmente anterior à corrupção do texto latino. A solução preserva a evidência da fonte principal sem ocultar a alternativa relevante para a imagem apocalíptica.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para leitura ampla no Brasil. A ordem da frase foi levemente ajustada para fluidez, mantendo a sequência e o caráter apocalíptico do original.
