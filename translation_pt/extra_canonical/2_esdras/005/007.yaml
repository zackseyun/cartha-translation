  source_fidelity: 'O texto traduz com fidelidade os elementos latinos: mare Sodomiticum por “mar de Sodoma”, pisces reiciet por “lançará peixes para fora”, e dabit vocem noctu por “durante a noite, emitirá um som”. O perfeito non nouerunt é adequadamente conservado em “não conheceram”, e o objeto subentendido de omnes autem audient é explicitado naturalmente em “o ouvirão”.'
