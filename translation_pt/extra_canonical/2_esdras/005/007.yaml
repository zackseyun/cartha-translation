base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/007.yaml
  text: And the Sea of Sodom will cast out fish[a], and by night it will utter a sound that many have not known[b], but all will hear it.
translation:
  language: pt
  text: E o mar de Sodoma lançará peixes para fora[a] e, durante a noite, emitirá um som que muitos não conheceram[b], mas todos o ouvirão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “mar de Sodoma” provavelmente se refere ao mar Morto; a tradução, porém, conserva a forma alusiva do latim em vez de usar o nome convencional posterior.
    reason: cultural_note
  - marker: b
    text: 'Mais literalmente: “dará uma voz que muitos não conheceram”; também se pode entender o final como: “mas todos ouvirão a sua voz”.'
    reason: translation_note
lexical_decisions:
- source_word: mare Sodomiticum
  choice: mar de Sodoma
  rationale: Expressa naturalmente o adjetivo geográfico latino e preserva a alusão a Sodoma, sem substituí-la diretamente pelo nome convencional posterior, mar Morto.
- source_word: pisces reiciet
  choice: lançará peixes para fora
  rationale: Mantém a imagem concreta e extraordinária de reiciet, que indica lançar ou expelir para fora.
- source_word: dabit vocem
  choice: emitirá um som
  rationale: Traduz a expressão latina de modo natural em português; 'dará uma voz' seria excessivamente literal e pouco idiomático, enquanto 'som' se ajusta ao mar como sujeito.
- source_word: non nouerunt
  choice: não conheceram
  rationale: Preserva o perfeito latino e a formulação incomum, sem converter silenciosamente a frase em simples estado presente.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com sintaxe fluente e leve tonalidade profética. Conserva-se a estranheza significativa do perfeito latino em “não conheceram”, enquanto “emitirá um som” evita um calque pouco natural.
