theological_decisions:
- issue: Identidade dos que ainda não vieram
  choice: Mantida indefinida
  alternative: Explicitar como pessoas ainda não nascidas ou israelitas ainda por vir
  rationale: O segmento latino não define a identidade do grupo; explicitá-la resolveria indevidamente a ambiguidade.
