base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/025.yaml
  text: and from all the depths of the sea you filled for yourself one stream[a], and from all the cities that have been built you sanctified Zion for yourself,
translation:
  language: pt
  text: e, de todas as profundezas do mar, encheste para ti um só riacho[a]; e, de todas as cidades construídas, santificaste Sião para ti,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra versão, por um alinhamento diferente dos versículos, traz: “e, dentre todas as aves criadas, escolheste para ti uma só pomba; e, dentre todos os animais formados, providenciaste para ti uma só ovelha”.'
    reason: Esclarece que a leitura registrada corresponde ao texto associado ao versículo seguinte em outro alinhamento, sem apresentar isso como variante textual do texto latino-base deste versículo.
lexical_decisions:
- source_word: abyssis maris
  choice: profundezas do mar
  rationale: Reproduz diretamente o sentido do latim, mantendo a imagem das profundezas marítimas.
- source_word: rivum unum
  choice: um só riacho
  rationale: 'Traduz rivum como um curso de água pequeno e unum com valor distintivo: um só entre todos.'
- source_word: sanctificasti
  choice: santificaste
  rationale: Preserva o sentido cultual e teológico do verbo latino sem o reduzir a mera escolha ou separação.
- source_word: tibi / tibimet ipsi
  choice: para ti
  rationale: Mantém a repetição enfática do pertencimento a Deus nas duas orações.
- source_word: Sion
  choice: Sião
  rationale: Forma portuguesa tradicional e amplamente reconhecida do topônimo bíblico.
theological_decisions:
- issue: Sentido de santificasti aplicado a Sião
  choice: santificaste Sião para ti
  alternative: separaste Sião para ti
  rationale: A tradução formal conserva tanto a ideia de consagração quanto a possível dimensão de separação sagrada, sem resolver a tensão em favor de apenas um aspecto.
translation_notes:
  register: Português atual, digno e acessível, com paralelismo preservado. O marcador [a] aparece imediatamente após “riacho”, conforme a exigência editorial.
