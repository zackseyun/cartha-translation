  yaml_path: translation/extra_canonical/2_esdras/005/013.yaml
  text: They will labor[a], but their ways will not be directed. I have been permitted to tell you these signs; and if you pray again and weep as you do now, and fast for seven days, you will hear again things greater than these.
translation:
  language: pt
  text: Eles trabalharão, mas seus caminhos não serão guiados.[a] Foi-me permitido contar a você estes sinais. Se você orar novamente, chorar como está chorando agora e jejuar durante sete dias, ouvirá outra vez coisas maiores do que estas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “não prosperarão em seus caminhos”.'
    reason: Registra o provável sentido idiomático de dirigentur uiae sem eliminá-lo do texto principal por interpretação.
lexical_decisions:
- source_word: laborabunt
  choice: trabalharão
  rationale: Reproduz diretamente o futuro latino e mantém o sentido amplo de esforço ou trabalho.
- source_word: non dirigentur uiae eorum
  choice: seus caminhos não serão bem encaminhados
  rationale: Preserva a imagem concreta dos caminhos sendo dirigidos, sem reduzir a expressão apenas à ideia interpretativa de prosperidade.
- source_word: permissum est mihi
  choice: Foi-me permitido
  rationale: Mantém a construção passiva e não explicita quem concedeu a permissão, pois o latim também deixa o agente implícito.
- source_word: ploraueris sicut et nunc
  choice: chorar como está chorando agora
  rationale: Expressa de modo natural a comparação com o choro presente de Esdras.
- source_word: audies iterato horum maiora
  choice: ouvirá outra vez coisas maiores do que estas
  rationale: Conserva tanto a repetição indicada por iterato quanto a comparação horum maiora.
theological_decisions:
- issue: Sentido de non dirigentur uiae eorum
  choice: seus caminhos não serão bem encaminhados
  alternative: não prosperarão em seus caminhos
  rationale: A alternativa comunica o provável valor idiomático de êxito, mas a redação adotada permanece mais próxima da metáfora latina e evita resolver inteiramente sua possível ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com construção direta. O tratamento por “você” favorece ampla legibilidade brasileira, enquanto o passivo “Foi-me permitido” conserva a indeterminação do agente no original.
