review_pass:
  verdict: revise
  source_fidelity: A tradução preserva todas as cláusulas do latim, inclusive a oração inicial que deve pertencer a este versículo. «Trabalharão», «Foi-me permitido», a oração condicional e «ouvirá outra vez coisas maiores do que estas» correspondem adequadamente ao texto-fonte. Contudo, «seus caminhos não serão bem encaminhados» acrescenta «bem», ausente de non dirigentur, e produz uma formulação pouco idiomática.
  naturalness: O texto é em geral claro e de registro apropriado. «Seus caminhos não serão guiados» conserva a imagem passiva sem a redundância e a estranheza de «bem encaminhados».
  terminology: Não há nomes próprios nem termos teológicos controversos neste versículo. A nota mantém, de modo adequado, «prosperarão em seus caminhos» como explicitação possível do valor idiomático, sem o impor ao texto principal.
  issues:
  - severity: medium
    issue: «seus caminhos não serão bem encaminhados»
    rationale: O advérbio «bem» não tem correspondente no latim non dirigentur e tende a transformar a negação da direção/guia em uma noção de qualidade. Além disso, «encaminhados» repetido após «caminhos» é estilisticamente pesado. «Não serão guiados» é mais natural e conserva a metáfora e a voz passiva.
  revised_text: Eles trabalharão, mas seus caminhos não serão guiados.[a] Foi-me permitido contar a você estes sinais. Se você orar novamente, chorar como está chorando agora e jejuar durante sete dias, ouvirá outra vez coisas maiores do que estas.
