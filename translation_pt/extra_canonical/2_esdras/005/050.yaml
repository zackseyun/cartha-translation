  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/050.yaml
  text: 'And I asked and said[a], ''Since you have now given me a way, I will speak before you: is our mother, of whom you spoke to me, still young, or is she already drawing near to old age?'''
translation:
  language: pt
  text: 'E perguntei e disse: “Já que agora me deste um caminho, falarei diante de ti: pois nossa mãe, de quem me falaste, ainda é jovem ou[a] já se aproxima da velhice?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A palavra latina correspondente a “ou” foi restaurada pelos editores no texto preservado.
    reason: textual
lexical_decisions:
- source_word: coram te
  choice: diante de ti
  rationale: Mantém o sentido espacial e relacional da expressão latina, com linguagem natural e digna em português.
- source_word: nam
  choice: pois
  rationale: Preserva a ligação explicativa da pergunta com o raciocínio anterior, explicitamente marcada no texto latino.
- source_word: mater nostra
  choice: nossa mãe
  rationale: Tradução direta que conserva a metáfora materna sem interpretá-la no corpo do texto.
- source_word: adhuc iuuenis est
  choice: ainda é jovem
  rationale: Reproduz de modo simples o contraste temporal indicado por adhuc.
- source_word: iam senectuti adpropinquat
  choice: já se aproxima da velhice
  rationale: Conserva tanto o aspecto progressivo de adpropinquat quanto o contraste entre adhuc e iam.
theological_decisions:
- issue: Identidade metafórica de “nossa mãe”
  choice: Manter “nossa mãe” sem explicação interpretativa no texto
  alternative: Identificá-la explicitamente como Sião, Jerusalém ou a criação
  rationale: O versículo retoma uma figura mencionada no contexto, mas não a identifica aqui de forma explícita; manter a metáfora preserva a formulação e a tensão do texto.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A fórmula “perguntei e disse” foi mantida por refletir a expressão narrativa da fonte; “pois” conserva o nexo explícito de nam, embora a construção resulte um pouco mais marcada em português.
