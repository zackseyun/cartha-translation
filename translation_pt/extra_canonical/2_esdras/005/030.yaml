  text: And if you indeed hate your people[a], they ought to be chastised by your own hands.
translation:
  language: pt
  text: E, se de fato odeias o teu povo, ele deve ser castigado por tuas próprias mãos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: odiens odisti
  choice: de fato odeias
  rationale: Reproduz a força enfática da construção intensiva sem ampliá-la indevidamente para «odeias por completo».
- source_word: populum tuum
  choice: o teu povo
  rationale: Tradução direta e natural, preservando a relação pessoal expressa pelo possessivo.
- source_word: tuis manibus
  choice: por tuas próprias mãos
  rationale: Mantém a ênfase no agente pessoal da disciplina.
- source_word: castigari
  choice: ser castigado
  rationale: Preserva o sentido de punição ou correção disciplinar do verbo latino, sem o reduzir a mera repreensão.
theological_decisions:
- issue: A afirmação de que Deus odeia o seu povo
  choice: 'Preservar a formulação condicional e enfática: «se de fato odeias»'
  alternative: Abrandar para «se estás irado com» ou intensificar para «se odeias completamente»
  rationale: O texto apresenta uma acusação retórica tensa; a tradução não deve eliminar essa tensão nem exceder a intensidade indicada pela construção latina.
- issue: Agente do castigo
  choice: «por tuas próprias mãos»
  alternative: «sob tua autoridade»
  rationale: A imagem concreta das mãos é explícita na fonte e ressalta que o castigo deveria proceder diretamente de Deus.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento em segunda pessoa singular coerente com a fala dirigida a Deus. A ordem foi levemente naturalizada sem perder a ênfase do latim.
