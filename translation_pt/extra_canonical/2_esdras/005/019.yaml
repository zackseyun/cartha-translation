  text: And I said to him[a], 'Go away from me, and do not come near me until seven days have passed, and then you may come to me.' And he did as I said and withdrew from me.
translation:
  language: pt
  text: 'E eu lhe disse[a]: “Afaste-se de mim e não se aproxime até se passarem sete dias; então venha até mim.” Ele fez o que eu disse e se retirou.'
  philosophy: optimal-equivalence
  footnotes:
