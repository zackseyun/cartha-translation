lexical_decisions:
- source_word: vade a me
  choice: Afaste-se de mim
  rationale: Expressa naturalmente a ordem para que a pessoa vá embora, sem a rigidez pouco idiomática de uma tradução como “vá de mim”.
- source_word: non ad me accedas
  choice: não se aproxime
  rationale: Reproduz a proibição de chegar perto do narrador em português claro e atual.
- source_word: usque diebus septem
  choice: até se passarem sete dias
  rationale: Mantém o valor temporal de limite, em vez de sugerir apenas uma duração genérica de sete dias.
- source_word: tunc venies ad me
  choice: então venha até mim
  rationale: Verte a instrução futura de modo idiomático, preservando a ideia de voltar à presença do narrador.
- source_word: audivit ut dixi
  choice: fez o que eu disse
  rationale: Neste contexto, audire indica dar ouvidos ou obedecer; a ação seguinte confirma que a pessoa acatou a ordem.
- source_word: recessit a me
  choice: se retirou
  rationale: Conserva o sentido narrativo de afastar-se da presença do narrador em registro digno e natural.
