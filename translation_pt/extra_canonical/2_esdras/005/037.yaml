  text: reuirida mihi aridos flores, Et aperi mihi clausa prumptuaria et produc mihi inclusos in eis flatos, aut monstra mihi uocis imaginem, et tunc ostendam tibi eum laborem quem rogas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/037.yaml
  text: Restore to me the dried flowers[a], and open for me the storehouses that are shut, and bring out for me the winds enclosed in them, or show me the image of a voice; then I will show you that labor which you ask.
translation:
  language: pt
  text: Faz reverdecer para mim as flores secas[a], abre para mim os depósitos que estão fechados e faz sair os ventos encerrados neles, ou mostra-me a imagem de uma voz; então te mostrarei aquela aflição sobre a qual perguntas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Faz reviver para mim as flores secas”.'
    reason: A forma latina sugere fazer as flores secas reverdecerem novamente; a alternativa explicita o sentido mais geral de restauração da vida.
lexical_decisions:
- source_word: reuirida ... aridos flores
  choice: Faze reviver ... as flores secas
  rationale: Expressa a imagem paradoxal de fazer flores já secas voltarem à vida. A forma latina inicial é incomum, mas o sentido exigido pelo contexto é claro.
- source_word: prumptuaria
  choice: depósitos
  rationale: Termo corrente e abrangente para lugares onde algo fica guardado; preserva a imagem de recintos fechados que contêm os ventos.
- source_word: flatos
  choice: ventos
  rationale: No contexto cosmológico, refere-se a correntes de ar encerradas em depósitos; 'ventos' é mais natural do que 'sopros'.
- source_word: uocis imaginem
  choice: a imagem de uma voz
  rationale: Mantém literalmente a combinação deliberadamente impossível ou enigmática, sem explicá-la como som, forma ou aparência.
- source_word: eum laborem
  choice: aquela aflição
  rationale: Labor pode significar trabalho, fadiga, sofrimento ou aflição. Aqui retoma laborem Iacob de 5:35 e designa a aflição de Jacó, não uma tarefa realizada.
- source_word: quem rogas
  choice: sobre a qual perguntas
  rationale: No contexto, Ezra pede esclarecimento a respeito da aflição. Esta formulação evita o sentido moderno de 'rogar' como súplica e não acrescenta 'ver', ausente do texto latino fornecido.
theological_decisions:
- issue: Sentido de laborem na referência anafórica à aflição de Jacó
  choice: aflição
  alternative: trabalho / fadiga
  rationale: O contexto imediato trata do sofrimento ou aperto de Jacó. Traduzir por 'trabalho' quebraria essa referência e sugeriria atividade produtiva.
translation_notes:
  register: Português moderno, claro e digno, com construções compreensíveis tanto no Brasil quanto em outros contextos lusófonos. Conservam-se as imagens paradoxais do original e sua sequência retórica.
