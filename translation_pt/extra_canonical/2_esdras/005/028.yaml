  text: et nunc Domine, ut quid tradidisti unum plurimiset praeparasti unam radicem super alias et dispersisti unicum tuum in multis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/028.yaml
  text: And now[a], Lord, why have you handed over the one to the many, and prepared one root above the others, and scattered your only one among the many?
translation:
  language: pt
  text: E agora, Senhor, por que entregaste um só a tantos, preparaste uma raiz acima das outras e dispersaste o teu único entre muitos?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ut quid
  choice: por que
  rationale: Expressa de modo natural a pergunta de razão ou propósito formulada pelo latim.
- source_word: tradidisti
  choice: entregaste
  rationale: Mantém a ideia de pôr alguém ou algo sob o poder de outros, sem restringi-la a uma derrota militar específica.
- source_word: unum
  choice: o um
  rationale: Preserva a forma singular e a correspondência retórica com plurimis, sem acrescentar explicitamente «povo» ou «Israel».
- source_word: praeparasti
  choice: preparaste
  rationale: Reproduz diretamente o verbo latino e conserva aberta a natureza da ação divina sobre a «raiz».
- source_word: radicem
  choice: raiz
  rationale: Mantém a metáfora do texto-fonte.
- source_word: dispersisti
  choice: dispersaste
  rationale: Comunica espalhamento ou dispersão entre muitos, em linguagem bíblica corrente.
- source_word: unicum tuum
  choice: o teu único
  rationale: Conserva a expressão substantivada e sua possível referência coletiva, sem inserir um referente ausente do latim.
theological_decisions:
- issue: Identidade de «unum» e «unicum tuum»
  choice: Manter «o um» e «o teu único» sem identificar expressamente o referente.
  alternative: Traduzir como «teu único povo» ou «Israel».
  rationale: O contexto pode apontar para Israel, mas o versículo emprega imagens e formas substantivadas; explicitar o referente eliminaria uma ambiguidade genuína e enfraqueceria o paralelismo.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com estrutura retórica próxima do latim. A formulação incomum «o um» foi mantida deliberadamente para preservar o contraste enfático entre unum e plurimis; «o teu único» conserva a tensão metafórica sem complemento interpretativo.
