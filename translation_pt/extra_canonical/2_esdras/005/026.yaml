id: 2ES.5.26
reference: 2 Esdras 5:26
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus creatis volatilibus nominasti tibi columbam unam, et ex omnibus plasmatis pecoribus providisti tibi ovem unam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/026.yaml
  text: and from all the birds that have been created you named for yourself one dove[a], and from all the cattle that have been formed you provided for yourself one sheep,
translation:
  language: pt
  text: e, dentre todas as aves criadas, nomeaste para ti uma única pomba; e, dentre todos os animais de criação formados, providenciaste para ti uma única ovelha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: volatilibus
  choice: aves
  rationale: O substantivo latino refere-se amplamente aos seres que voam; em português corrente, “aves” expressa naturalmente o sentido neste contexto.
- source_word: nominasti tibi
  choice: escolheste para ti
  rationale: Embora nominasti possa significar literalmente “nomeaste”, aqui a construção paralela indica designação ou eleição dentre um conjunto; “escolheste” comunica esse valor idiomático sem sugerir apenas atribuição de nome.
- source_word: plasmatis pecoribus
  choice: animais domésticos formados
  rationale: Pecora designa animais de criação ou rebanho, e plasmatis ressalta que foram moldados ou formados; a formulação preserva ambos os elementos.
- source_word: providisti tibi
  choice: providenciaste para ti
  rationale: Mantém o sentido básico de providere no perfeito e o paralelismo com “para ti”.
- source_word: unam
  choice: uma única
  rationale: Torna explícito o contraste entre todos os seres da categoria e o único exemplar escolhido, preservando a ênfase repetida no latim.
theological_decisions:
- issue: Possível simbolismo da pomba e da ovelha
  choice: Manter as imagens sem identificar explicitamente seus referentes
  alternative: Explicitar que representam entidades coletivas ou religiosas específicas
  rationale: O versículo apresenta as figuras, mas não identifica diretamente o que simbolizam; explicá-las no texto resolveria uma ambiguidade que a fonte preserva.
- issue: Variante correspondente ao texto do versículo seguinte
  choice: Traduzir exclusivamente o texto latino fornecido para 5:26
  alternative: Incluir em nota a redação sobre os povos e a lei
  rationale: A redação alternativa registrada na camada inglesa foi identificada como tradução deslocada de 5:27, não como variante textual genuína de 5:26; por isso não deve constar como nota desta passagem.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado entre as duas orações. Evitou-se vocabulário excessivamente técnico; “animais domésticos” foi usado para distinguir pecora das aves e indicar animais de criação.
