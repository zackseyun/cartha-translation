  text: Rise therefore and eat some bread[a], and do not abandon us like a shepherd his flock into the hands of evil wolves.
translation:
  language: pt
  text: Levante-se, portanto, e coma um pouco de pão[a]. Não nos abandone como um pastor abandona seu rebanho nas mãos de lobos malignos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uma tradução anterior trazia: «E eu lhe disse: “Afaste-se de mim e não se aproxime de mim durante sete dias; depois poderá vir até mim”. Ele ouviu o que eu disse e se retirou de mim.» Esse texto corresponde ao versículo seguinte, não ao texto latino deste versículo.'
    reason: previous_rendering
lexical_decisions:
- source_word: exsurge
  choice: Levante-se
  rationale: Reproduz o imperativo singular latino em linguagem atual e digna.
- source_word: gusta panem alicuius
  choice: coma um pouco de pão
  rationale: Expressa de modo natural o sentido contextual de tomar algum alimento; evita o pouco idiomático e provavelmente textual «pão de alguém».
- source_word: derelinquas
  choice: abandone
  rationale: Conserva a força do verbo latino, que indica deixar alguém entregue ao perigo.
- source_word: luporum malignorum
  choice: lobos malignos
  rationale: Mantém a imagem concreta e a qualificação moral do latim sem acrescentar interpretação.
