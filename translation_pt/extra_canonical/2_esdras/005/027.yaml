source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus multiplicatis populis adquisisti tibi populum unum, et ab omnibus probatam legem donasti huic quem desiderasti populo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/027.yaml
  text: and from all the multiplied peoples you acquired for yourself one people[a], and to this people whom you desired you gave the law approved by all.
translation:
  language: pt
  text: e, dentre todos os povos que se multiplicaram, adquiriste para ti um só povo; e a esse povo, que desejaste, deste a lei aprovada por todos.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex omnibus multiplicatis populis
  choice: dentre todos os povos que se multiplicaram
  rationale: Reproduz a ideia de multiplicação expressa pelo particípio latino multiplicatis sem recorrer à formulação pouco natural “povos multiplicados”.
- source_word: adquisisti tibi populum unum
  choice: adquiriste para ti um só povo
  rationale: Mantém o sentido direto de adquisisti tibi e a ênfase contrastiva de unum no padrão que distingue um povo dentre muitos.
- source_word: ab omnibus probatam legem
  choice: a lei aprovada por todos
  rationale: Segue a construção passiva do latim e conserva a referência abrangente, mas não explicitada, de omnibus.
- source_word: huic quem desiderasti populo
  choice: a esse povo, que desejaste
  rationale: Preserva o desejo ou eleição particular expresso por desiderasti, com ordem natural em português.
theological_decisions:
- issue: Relação entre o único povo e os muitos povos
  choice: um só povo dentre todos os povos
  alternative: o povo único dentre muitos
  rationale: A formulação escolhida mantém a ênfase numérica e eletiva do latim sem acrescentar uma identificação confessional específica.
- issue: Referente de “ab omnibus”
  choice: por todos
  alternative: em tudo comprovada
  rationale: O ablativo latino favorece a leitura agentiva “por todos”, também refletida na camada inglesa, embora o referente de “todos” permaneça não especificado.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas verbais de segunda pessoa singular coerentes com a fala dirigida a Deus. Não se incluiu a nota da camada inglesa porque ela reproduz uma tradução anterior de outro versículo, não uma variante textual de 2 Esdras 5:27.
