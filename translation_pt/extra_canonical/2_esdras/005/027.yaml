  source_fidelity: 'O texto português acompanha de perto o latim: «dentre todos os povos que se multiplicaram» traduz ex omnibus multiplicatis populis de modo idiomático; «adquiriste para ti um só povo» preserva adquisisti tibi populum unum e sua ênfase seletiva; e «a lei aprovada por todos» representa ab omnibus probatam legem sem especificar indevidamente quem são «todos».'
