  source_fidelity: 'A comparação principal é bem transmitida: infans é adequadamente entendido como uma criança muito pequena, parit como dar à luz, e a segunda oração conserva a ideia de que a mulher envelhecida já não continua a gerar. Contudo, o rascunho omite a frase final do texto latino: “Et interrogaui et dixi : cum iam dederis mihi uiam, loquar”. Essa omissão deixa de fora a transição narrativa e a fala do interlocutor.'
  naturalness: O português é fluente e de registro apropriado. “Criança de colo” é compreensível para leitores brasileiros e internacionais. A formulação “continua a dar à luz” expressa naturalmente, sob a negação coordenada, o valor de adhuc no contexto.
  terminology: “Dispus o mundo que criei” representa de modo direto disposui e saeculum. A nota pode registrar “era” como alternativa possível, sem definir saeculum de modo excessivamente estreito como “ordem temporal”. “Permissão” comunica idiomaticamente o valor de uia neste contexto (“dar licença/permitir que fale”).
