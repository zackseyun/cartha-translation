  text: 'admodum enim infans non parit nec ea quae senuit adhuc, sic ego disposui a me creatum saeculum. Et interrogaui et dixi : cum iam dederis mihi uiam, loquar'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/049.yaml
  text: For just as an infant does not bear children[a], nor does one who has grown old bear any longer, so I ordered the age that I created.'
translation:
  language: pt
  text: 'Pois, assim como uma criança de colo não dá à luz, nem aquela que envelheceu continua a dar à luz, assim dispus o mundo que criei.[a] E perguntei e disse: “Visto que já me deste permissão, falarei.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “assim dispus a era que criei”. O latim saeculum pode referir-se ao mundo ou a uma era.'
    reason: Preserva a amplitude semântica de saeculum e a alternativa mais formal para disposui.
lexical_decisions:
- source_word: infans
  choice: criança de colo
  rationale: Expressa a tenra idade indicada pelo latim sem usar um termo excessivamente técnico; no contexto, mantém o contraste entre o começo e a velhice.
- source_word: parit
  choice: dá à luz
  rationale: Traduz diretamente o ato de parir e permite conservar a elipse verbal na segunda oração de modo claro em português.
- source_word: ea quae senuit
  choice: aquela que envelheceu
  rationale: Preserva o pronome feminino do latim e evita acrescentar explicitamente “mulher”, embora isso esteja implícito.
- source_word: adhuc
  choice: continua a
  rationale: No contexto negativo, indica que a pessoa envelhecida já não prossegue dando à luz; esta formulação é mais natural em português do que uma reprodução rígida de “ainda”.
- source_word: disposui
  choice: estabeleci a ordem
  rationale: Comunica a ideia de dispor ou ordenar deliberadamente, sem reduzir o verbo apenas a uma ordem verbal.
- source_word: saeculum
  choice: mundo
  rationale: Aqui designa a ordem criada em seu percurso temporal; “mundo” é natural no contexto, enquanto “era” poderia sugerir apenas um período cronológico.
theological_decisions:
- issue: Sentido temporal e cósmico de saeculum
  choice: mundo
  alternative: era / tempo
  rationale: O contexto compara as etapas da ordem criada às fases da vida. “Mundo” mantém o referente abrangente, e a nota registra a dimensão temporal possível.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe fluente. A imagem fisiológica foi mantida sem eufemismo, e o feminino implícito no latim foi preservado sem explicitação desnecessária.
