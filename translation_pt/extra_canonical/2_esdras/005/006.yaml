  text: And one whom those who dwell on the earth do not expect will reign, and the birds will migrate.
translation:
  language: pt
  text: E reinará alguém que os habitantes da terra não esperam; e as aves migrarão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quem non sperant
  choice: alguém que ... não esperam
  rationale: Preserva a referência indefinida do latim e o sentido de uma pessoa cujo governo não é esperado pelos habitantes da terra.
- source_word: qui inhabitant super terram
  choice: os habitantes da terra
  rationale: Expressão natural e fiel ao sentido de quem habita sobre a terra.
- source_word: volatilia
  choice: as aves
  rationale: Equivalente corrente e digno para os seres alados mencionados no texto.
- source_word: conmigrationem facient
  choice: migrarão
  rationale: Traduz de modo natural a locução latina que indica realizar uma migração, sem acrescentar a ideia não exigida de migrarem juntas.
theological_decisions:
- issue: Identidade daquele que reinará
  choice: alguém
  alternative: aquele
  rationale: O texto não identifica a figura nem exige uma interpretação messiânica ou política específica; a forma indefinida preserva essa abertura.
- issue: Sentido de sperant
  choice: não esperam
  alternative: não têm esperança em
  rationale: Neste contexto, o sentido provável é expectativa quanto a quem reinará. A tradução evita transformar a frase numa declaração sobre confiança ou esperança religiosa.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. Mantém o paralelismo das duas indicações portentosas e usa ponto e vírgula para separar as orações sem enfraquecer sua ligação.
