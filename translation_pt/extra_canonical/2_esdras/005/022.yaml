  text: et resumpsit anima mea spiritum intellectus, et iterum coepi loqui coram Altissimo sermones
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/022.yaml
  text: And my soul recovered the spirit of understanding[a], and again I began to speak before the Most High.
translation:
  language: pt
  text: E minha alma recobrou o espírito de entendimento, e novamente comecei a falar diante do Altíssimo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: resumpsit
  choice: recobrou
  rationale: Expressa a recuperação de algo que havia sido perdido ou interrompido, preservando o sentido do latim.
- source_word: anima mea
  choice: minha alma
  rationale: Mantém a formulação antropológica do texto-fonte sem reduzi-la simplesmente a «eu».
- source_word: spiritum intellectus
  choice: o espírito de entendimento
  rationale: Preserva a construção e sua possível tensão entre uma disposição interior, uma capacidade de compreender e um espírito associado ao entendimento.
- source_word: iterum coepi loqui
  choice: tornei a falar
  rationale: Forma natural em português para indicar que o narrador começou novamente a falar.
- source_word: coram Altissimo
  choice: diante do Altíssimo
  rationale: Equivalência direta e digna, mantendo o título divino.
- source_word: sermones
  choice: falar
  rationale: O objeto interno «palavras/discursos» é naturalmente incorporado ao verbo em português; explicitá-lo resultaria redundante neste contexto.
theological_decisions:
- issue: Natureza do «espírito de entendimento»
  choice: Manter a expressão «espírito de entendimento»
  alternative: Traduzir de modo interpretativo como «capacidade de compreender» ou «lucidez»
  rationale: O latim permite mais de uma compreensão da expressão; a redação escolhida conserva a ambiguidade sem impor uma explicação psicológica ou teológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão ampla no espaço lusófono. A nota da camada inglesa não foi reproduzida porque registra uma versão anterior desalinhada, correspondente ao conteúdo do versículo seguinte, e não uma variante pertinente ao texto latino deste versículo.
