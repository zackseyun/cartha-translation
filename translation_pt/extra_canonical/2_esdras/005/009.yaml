  yaml_path: translation/extra_canonical/2_esdras/005/009.yaml
  text: and women will give birth to monstrous things in menstruation. And in sweet waters salty waters will be found[a], and all friends will make war on one another, and then understanding will be hidden, and insight will withdraw into its storehouse.
translation:
  language: pt
  text: e as mulheres darão à luz seres monstruosos ligados à menstruação.[a] Nas águas doces serão encontradas águas salgadas; todos os amigos guerrearão uns contra os outros. Então o entendimento ficará oculto, e a inteligência se recolherá ao seu depósito. Será procurado por muitos, mas não será encontrado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão latina menstruata monstra é obscura. Mais literalmente, poderia ser traduzida como “monstros menstruados” ou “monstros menstruais”, mas o latim preservado não deixa clara a relação exata entre os seres monstruosos e a menstruação.
    reason: lexical_alternative
lexical_decisions:
- source_word: menstruata monstra
  choice: seres monstruosos ligados à menstruação
  rationale: A expressão latina é obscura. A formulação preserva tanto a ideia de nascimentos monstruosos quanto a ligação explícita com a menstruação, sem definir uma relação que o latim não esclarece.
- source_word: dulcibus aquis salsae
  choice: nas águas doces serão encontradas águas salgadas
  rationale: O adjetivo feminino plural salsae parece substantivar aquae; a repetição de “águas” torna o contraste natural e claro em português.
- source_word: semetipsos expugnabunt
  choice: guerrearão uns contra os outros
  rationale: Expugnare tem força hostil, de atacar ou combater; esta formulação preserva a imagem de conflito entre amigos.
- source_word: sensus
  choice: entendimento
  rationale: No contexto, indica a capacidade de compreender, que se torna inacessível.
- source_word: intellectus
  choice: inteligência
  rationale: Mantém uma distinção possível em relação a sensus sem impor uma diferença técnica excessivamente precisa.
- source_word: promptuarium
  choice: depósito
  rationale: Designa um lugar onde algo é guardado; “depósito” conserva a metáfora de retirada e ocultação em linguagem atual.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe clara. A tradução conserva as imagens apocalípticas e a distinção lexical entre sensus e intellectus, além de incluir a oração final presente no texto latino fornecido.
