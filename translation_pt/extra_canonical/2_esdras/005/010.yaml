  text: et quaeretur a multis et non invenietur, et multiplicabitur iniustitia et incontinentia super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/010.yaml
  text: And it will be sought by many and will not be found, and unrighteousness and lack of self-control will be multiplied on the earth.
translation:
  language: pt
  text: E muitos procurarão, mas não encontrarão; e a injustiça e a falta de domínio próprio se multiplicarão sobre a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaeretur
  choice: a procurarão
  rationale: A forma passiva latina, sem objeto expresso neste versículo, depende do contexto anterior. Em português, o pronome feminino preserva essa referência implícita de maneira natural.
- source_word: iniustitia
  choice: injustiça
  rationale: Equivalente direto que preserva tanto o sentido moral quanto o social do termo latino.
- source_word: incontinentia
  choice: falta de domínio próprio
  rationale: Expressa em linguagem atual a ausência de autocontrole ou contenção moral, sem restringir o termo apenas à sexualidade.
- source_word: super terram
  choice: sobre a terra
  rationale: Mantém a imagem e a extensão universal da expressão latina.
theological_decisions:
- issue: Referente não expresso de quaeretur / non invenietur
  choice: ela
  alternative: isso; forma passiva sem pronome
  rationale: O latim não nomeia o que será procurado neste versículo, mas a forma verbal pressupõe um referente contextual. O pronome feminino sinaliza essa dependência sem inserir um substantivo interpretativo.
translation_notes:
  register: Português moderno, claro e digno, com coordenação próxima à estrutura latina. A primeira oração foi vertida de modo idiomático, evitando uma passiva impessoal pouco natural em português.
