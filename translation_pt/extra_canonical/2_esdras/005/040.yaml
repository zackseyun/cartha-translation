base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/040.yaml
  text: And he said to me[a], 'Just as you cannot do one of these things that have been spoken[b], so you cannot find out the judgment.'
translation:
  language: pt
  text: '“Você me perguntou?”[a] E ele me disse: “Assim como você não pode fazer nenhuma dessas coisas de que se falou, também não poderá descobrir o juízo.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino fornecido começa com “Você me perguntou?”, expressão que pode ser o final de uma frase iniciada no contexto anterior.
    reason: textual_boundary
lexical_decisions:
- source_word: unum de his quae dicta sunt
  choice: nenhuma dessas coisas de que se falou
  rationale: Em uma oração negativa, esta formulação transmite naturalmente em português o sentido de não conseguir fazer sequer uma das coisas mencionadas.
- source_word: inuenire iudicium
  choice: descobrir o juízo
  rationale: Mantém a imagem de alcançar conhecimento ou compreensão do juízo, sem especificar se se trata do processo, da decisão ou do propósito do julgamento.
theological_decisions:
- issue: Referente e alcance de “iudicium”
  choice: o juízo
  alternative: a decisão / o sentido do juízo
  rationale: O latim não traz possessivo nem explicação adicional; por isso, a tradução conserva a formulação definida e sua possível amplitude teológica.
- issue: Material sobre o propósito ou a consumação do amor prometido
  choice: não incluído
  alternative: acrescentar uma oração sobre o fim ou propósito do amor
  rationale: Essa oração não consta no texto latino fornecido e, portanto, não deve ser reconstruída a partir de outras formas textuais ou de notas herdadas.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A estrutura comparativa do latim foi preservada de modo natural, e não se acrescentou material ausente da fonte apresentada.
