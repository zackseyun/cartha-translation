lexical_decisions:
- source_word: sub tempus senectutis
  choice: perto da velhice
  rationale: Expressa de modo natural a ideia temporal de aproximação presente em sub com acusativo, sem sugerir um momento rigidamente pontual.
- source_word: deficiente matrice
  choice: quando o ventre já está perdendo a força
  rationale: Verte matrix no sentido de ventre materno e deficiente como um processo de enfraquecimento, em linguagem clara e digna.
- source_word: alii ... et alii
  choice: uns ... e outros
  rationale: Preserva o contraste entre os dois grupos de nascidos com uma construção idiomática em português.
