  text: And she herself will say to you[a], "Different are those born in the strength of youth, and different are those born toward the time of old age, when the womb is failing."
translation:
  language: pt
  text: 'E ela mesma lhe dirá[a]: “Uns são os que nasceram no vigor da juventude, e outros, os que nasceram ao se aproximar a velhice, com o útero enfraquecendo.”'
  philosophy: optimal-equivalence
  footnotes:
