source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et de ligno sanguis stillabit, et lapis dabit vocem suam; et populi commovebuntur, et gressus commutabuntur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/005.yaml
  text: And blood will drip from wood[a], and the stone will give its voice, and peoples will be shaken, and steps will be changed.
translation:
  language: pt
  text: E sangue gotejará da madeira[a]; a pedra fará ouvir a sua voz, os povos serão abalados, e os passos serão mudados.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: da árvore.'
    reason: O substantivo latino lignum pode referir-se tanto à madeira quanto a uma árvore, conforme o contexto.
lexical_decisions:
- source_word: ligno
  choice: madeira
  rationale: O latim lignum pode designar madeira, lenho ou árvore. “Madeira” preserva a imagem concreta sem introduzir por si só uma associação teológica específica.
- source_word: stillabit
  choice: gotejará
  rationale: Reproduz diretamente a ideia de líquido que cai em gotas e mantém o caráter portentoso da imagem.
- source_word: dabit vocem suam
  choice: fará ouvir a sua voz
  rationale: Expressa em português natural a personificação da pedra, sem reduzir a imagem a uma interpretação como “gritará”.
- source_word: commovebuntur
  choice: serão abalados
  rationale: Mantém a voz passiva e o campo semântico de comoção ou agitação do verbo latino.
- source_word: gressus commutabuntur
  choice: os passos serão mudados
  rationale: Conserva a formulação concreta e enigmática do latim, bem como sua voz passiva, sem especificar indevidamente se se trata de rumos, trajetos ou comportamento.
theological_decisions:
- issue: Possível associação de lignum com a cruz
  choice: madeira
  alternative: madeiro
  rationale: Embora “madeiro” seja possível, pode sugerir especificamente a cruz no uso bíblico cristão. O texto latino, isoladamente, não exige essa identificação.
translation_notes:
  register: Português moderno, claro e digno. A coordenação solene e as imagens apocalípticas foram preservadas; a última frase permanece deliberadamente enigmática, como no latim.
