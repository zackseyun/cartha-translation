  text: it labored to the point of failing. And the angel who had come, who was speaking in me, took hold of me and strengthened me and set me on my feet.
translation:
  language: pt
  text: Fatigou-se a ponto de desfalecer. E o anjo que tinha vindo, que falava em mim[a], segurou-me, fortaleceu-me e pôs-me de pé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, segundo uma formulação mais natural em português, “que falava comigo”. O latim diz literalmente “em mim”.
    reason: Registra a ambiguidade da preposição latina sem eliminar do texto principal sua leitura mais formal.
lexical_decisions:
- source_word: laborauit, ut deficeret
  choice: Fatigou-se a ponto de desfalecer
  rationale: Reproduz a ideia de esforço ou desgaste que chega ao colapso, sem acrescentar um sujeito explícito ausente deste trecho latino.
- source_word: tenuit me
  choice: segurou-me
  rationale: Expressa de modo natural a ação física de sustentar ou tomar alguém, sem intensificar o verbo para “agarrou”.
- source_word: confortauit me
  choice: fortaleceu-me
  rationale: Mantém o sentido latino de comunicar força, adequado ao contexto em que o narrador precisa ser posto novamente de pé.
- source_word: statuit me super pedes
  choice: pôs-me de pé
  rationale: Formulação portuguesa natural e fiel à imagem concreta de ser colocado sobre os próprios pés.
theological_decisions:
- issue: Sentido de loquebatur in me
  choice: que falava em mim
  alternative: que falava comigo
  rationale: Preserva a formulação incomum e potencialmente significativa do latim in me, sem normalizá-la silenciosamente como simples diálogo.
translation_notes:
  register: Português moderno, digno e acessível, com construção concisa. O sujeito da primeira oração permanece implícito, como no fragmento latino recebido; a ênclise mantém amplitude lusófona sem prejudicar a compreensão brasileira.
