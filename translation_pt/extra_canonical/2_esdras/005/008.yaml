  yaml_path: translation/extra_canonical/2_esdras/005/008.yaml
  text: And chaos will come in many places[a], and fire will often break out, and wild beasts will leave their own region,
translation:
  language: pt
  text: a sua voz. E haverá caos em muitos lugares[a], o fogo irromperá com frequência, e os animais selvagens deixarão sua região,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “abrir-se-ão abismos em muitos lugares”. O latim chaos também pode designar “abismo” ou “fenda profunda”.'
    reason: Registra a possível imagem física de chaos sem fixá-la na tradução principal.
lexical_decisions:
- source_word: chaos fiet
  choice: abrir-se-ão abismos
  rationale: Neste contexto apocalíptico, o latim chaos provavelmente designa uma abertura profunda, abismo ou fenda, não apenas desordem. A formulação portuguesa comunica a imagem física e preserva o caráter futuro do sinal.
- source_word: per loca multa
  choice: em muitos lugares
  rationale: Equivalência direta e natural para a distribuição do fenômeno por numerosos locais.
- source_word: ignis frequenter emittetur
  choice: o fogo irromperá com frequência
  rationale: Emittetur é literalmente ‘será lançado/emitido’; ‘irromperá’ expressa de modo natural o surgimento repetido de fogo sem especificar uma causa não indicada pelo texto.
- source_word: bestiae agrestes
  choice: os animais selvagens
  rationale: Forma corrente e abrangente para feras ou animais não domesticados.
- source_word: transmigrabunt regionem suam
  choice: deixarão a sua região
  rationale: Transmigrabunt indica migração ou passagem para fora do território habitual; a escolha segue o sentido contextual sem acrescentar destino.
theological_decisions:
- issue: Natureza de chaos como sinal apocalíptico
  choice: Imagem física de abismos que se abrem
  alternative: ‘Haverá caos’ ou ‘surgirá o caos’
  rationale: O substantivo latino pode ser formalmente transliterado como ‘caos’, mas seu sentido antigo inclui abismo ou vasto vazio. O contexto de sinais físicos e a evidência textual comparativa favorecem a imagem de fendas ou abismos, enquanto a nota preserva a ambiguidade lexical.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Mantém a sequência coordenada e o ritmo profético do latim. A vírgula final foi conservada porque o trecho fornecido continua no versículo seguinte ou na unidade textual subsequente.
