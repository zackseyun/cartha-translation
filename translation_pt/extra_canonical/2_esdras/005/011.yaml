id: 2ES.5.11
reference: 2 Esdras 5:11
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multiplicabitur iniustitia et incontinentia super terram. Et interrogabit regio proximam suam et dicet: numquid per te'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/011.yaml
  text: Injustice and lack of self-control will be multiplied upon the earth. And one region will ask its neighbor and say, 'Has righteousness passed through you?'
translation:
  language: pt
  text: 'A injustiça e a falta de domínio próprio se multiplicarão sobre a terra. E uma região perguntará à sua vizinha: “Será que a justiça passou por você?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniustitia
  choice: injustiça
  rationale: Correspondência direta e natural, preservando o contraste implícito com a justiça na pergunta seguinte.
- source_word: incontinentia
  choice: falta de domínio próprio
  rationale: Expressa a ausência de autocontrole moral; evita “incontinência”, que no português atual pode sugerir sobretudo uma condição fisiológica.
- source_word: multiplicabitur
  choice: se multiplicarão
  rationale: O verbo latino está no singular porque precede uma construção coordenada, mas em português a concordância natural com os dois sujeitos exige o plural.
- source_word: regio proximam suam
  choice: uma região ... à região vizinha
  rationale: Mantém a personificação e o sentido espacial de uma região próxima, em linguagem clara e corrente.
- source_word: per te
  choice: por você
  rationale: Reproduz a interpelação direta à região personificada e o sentido de passagem indicado pela construção latina, conforme preservado pela camada de consulta.
theological_decisions:
- issue: Sentido de “justiça” na pergunta
  choice: A justiça passou por você?
  alternative: A justiça que torna alguém justo passou por você?
  rationale: A expansão explicativa não consta do trecho latino fornecido e resolveria interpretativamente uma formulação que deve permanecer concisa.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira. “Falta de domínio próprio” foi preferido a um latinismo potencialmente ambíguo; a personificação das regiões foi preservada.
