  text: nec enim poteras facere qui facti sunt et qui sunt et qui futuri sunt in unum, ut celerius iudicium tuum ostendas ? Et re-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/043.yaml
  text: And I answered and said[a], 'For could you not make those who have been made, and those who are, and those who will be, all at once, so that you might show your judgment more quickly?'
translation:
  language: pt
  text: Pois não podias fazer de uma só vez os que foram feitos, os que existem e os que existirão, para mostrares mais depressa o teu julgamento?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nec enim
  choice: Pois não
  rationale: Preserva tanto a negação interrogativa quanto o vínculo explicativo expresso por enim, sem acrescentar uma fórmula narrativa ausente do texto latino fornecido.
- source_word: qui facti sunt et qui sunt et qui futuri sunt
  choice: os que foram feitos, os que existem e os que existirão
  rationale: Mantém a sequência temporal e a distinção do latim entre os já criados, os existentes e os futuros.
- source_word: in unum
  choice: de uma só vez
  rationale: No contexto, indica que todos seriam feitos conjuntamente, possibilitando que o julgamento fosse manifestado mais cedo.
- source_word: iudicium tuum ostendas
  choice: mostrares ... o teu julgamento
  rationale: Reproduz diretamente a ideia de tornar manifesto o julgamento divino, sem especificar indevidamente sentença, juízo final ou execução da pena.
theological_decisions:
- issue: Possibilidade divina e ordem temporal da criação
  choice: não podias fazer
  alternative: não poderias ter feito
  rationale: O imperfeito latino poteras pode ser lido como capacidade situada no plano criador imaginado pela pergunta. A formulação escolhida conserva a pergunta retórica sem impor uma leitura contrafactual mais forte.
- issue: Sentido de iudicium
  choice: julgamento
  alternative: juízo
  rationale: “Julgamento” é claro em português contemporâneo e mantém em aberto se o referente é o processo, a manifestação ou o resultado do juízo divino.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe interrogativa natural. A fórmula “E eu respondi e disse” da camada inglesa não foi incluída porque não aparece no texto latino fornecido para este versículo; o conectivo nec enim foi representado por “Pois não”.
