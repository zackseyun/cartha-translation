source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uidere. Et dixi: dominator domine, quis enim est qui potest haec scire, nisi qui cum hominibus habitationem non habet?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/038.yaml
  text: And I said, 'Lord, Master, who indeed can know these things, except one who does not dwell among men?'
translation:
  language: pt
  text: 'E eu disse: “Senhor, Soberano, quem, de fato, pode saber essas coisas, senão aquele que não habita entre os seres humanos?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  choice: Senhor, Soberano
  rationale: Mantém os dois títulos do latim e sua ordem, em linguagem digna e natural; “Soberano” expressa dominator sem recorrer ao pouco natural “Dominador”.
- source_word: quis enim est qui potest haec scire
  choice: quem, de fato, pode saber essas coisas
  rationale: Reproduz a pergunta retórica e o valor enfático de enim sem tornar a frase excessivamente literal.
- source_word: nisi qui cum hominibus habitationem non habet
  choice: senão aquele que não habita entre os seres humanos
  rationale: Traduz a construção idiomática de habitação por um verbo corrente, preservando a ideia de não morar no meio da humanidade.
theological_decisions:
- issue: Identidade daquele que não habita entre os seres humanos
  choice: aquele
  alternative: alguém
  rationale: O relativo latino qui não identifica explicitamente a figura. “Aquele” preserva a referência singular e a ambiguidade, sem acrescentar uma identificação teológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A repetição de títulos é preservada por corresponder ao texto latino; “seres humanos” comunica hominibus de modo inclusivo e natural.
