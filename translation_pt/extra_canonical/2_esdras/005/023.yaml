  text: And I said[a], 'Sovereign Lord, from every forest of the earth and from all its trees you have chosen one vine,
translation:
  language: pt
  text: 'E eu disse[a]: “Ó Senhor soberano, de cada floresta da terra e de todas as suas árvores escolheste uma só videira,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uma versão anterior trazia: “e, dentre todas as terras do mundo, escolheste para ti uma só cova; e, dentre todas as flores do mundo, escolheste para ti um só lírio”. Esse texto corresponde ao versículo seguinte, não a este.'
