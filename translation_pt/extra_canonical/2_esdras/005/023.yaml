lexical_decisions:
- source_word: Dominator Domine
  choice: Ó Senhor soberano
  rationale: Reproduz a invocação enfática e o sentido de autoridade de “Dominator”, em português natural e reverente.
- source_word: ex omni silva terrae
  choice: dentre todas as florestas da terra
  rationale: Expressa o valor distributivo de “omni silva” sem tornar a frase artificial em português.
- source_word: ex omnium arborum eius
  choice: e dentre todas as suas árvores
  rationale: Mantém o paralelo com a expressão anterior; “suas” retoma naturalmente “terra”.
- source_word: vineam unam
  choice: uma só videira
  rationale: Preserva a ênfase de “unam” na escolha singular da videira.
theological_decisions:
- issue: A eleição de uma única videira entre todas as árvores
  choice: Preservar literalmente a imagem da escolha
  alternative: Explicitar no texto a identidade simbólica da videira
  rationale: O versículo deixa o referente simbólico implícito; identificá-lo aqui resolveria antecipadamente a imagem e importaria interpretação.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A ordem foi levemente naturalizada, sem perder o paralelismo nem a imagem do latim.
