  yaml_path: translation/extra_canonical/2_esdras/005/034.yaml
  text: him more than he who made him?' And I said[a], 'No, lord, but I have spoken in grief, for my inward parts torment me every hour as I seek to grasp the path of the Most High and to search out part of his judgment.' And he said to me, 'You cannot.' And I said, 'Why, lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see Jacob's trouble?'
translation:
  language: pt
  text: 'a ele mais do que aquele que o fez?” E eu disse: “Não, senhor; falei movido pela aflição, pois o meu íntimo me atormenta a toda hora, enquanto procuro compreender o caminho do Altíssimo e investigar uma parte do seu juízo”. Ele me disse: “Você não pode”. E eu disse: “Por quê, senhor? Ou por que nasci? Ou por que o ventre de minha mãe não se tornou a minha sepultura, para que eu não visse a aflição de Jacó?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dolens
  choice: porque estou aflito
  rationale: Expressa a dor ou aflição que motiva a fala, em português natural, sem restringi-la indevidamente à tristeza emocional.
- source_word: renes mei
  choice: o meu íntimo
  rationale: Literalmente, 'meus rins'; no uso antropológico antigo, designa o interior da pessoa, sede de emoções e angústia. 'Meu íntimo' preserva o sentido sem produzir uma leitura anatômica enganosa.
- source_word: adprehendere semitam
  choice: compreender o caminho
  rationale: Adprehendere significa agarrar, alcançar ou apreender; no contexto de investigação intelectual e espiritual, 'compreender' comunica a metáfora com clareza.
- source_word: partem iudicii eius
  choice: uma parte do seu juízo
  rationale: 'Mantém a modéstia epistêmica do original: Esdras procura investigar apenas uma parte do juízo do Altíssimo.'
- source_word: laborem Iacob
  choice: a aflição de Jacó
  rationale: Labor pode indicar sofrimento, penúria ou tribulação; 'aflição' é natural e preserva a referência coletiva e teológica a Jacó.
theological_decisions:
- issue: Referente de 'domine'
  choice: senhor
  alternative: Senhor
  rationale: O interlocutor imediato é o ser celestial do diálogo, não uma identificação inequívoca com Deus; a minúscula evita resolver essa questão em favor de uma leitura divina direta.
- issue: Alcance da incapacidade humana
  choice: “Você não pode”
  alternative: “Não és capaz”
  rationale: Reproduz a afirmação breve e absoluta non potes, sem acrescentar explicações teológicas ausentes do texto.
- issue: Sentido de 'iudicium'
  choice: juízo
  alternative: julgamento
  rationale: '''Juízo'' conserva a possível amplitude entre decisão, justiça e modo divino de julgar, sem reduzir o termo a um único ato judicial.'
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento por “você” no diálogo e sintaxe natural. O versículo começa no meio de uma pergunta herdada do contexto anterior; essa abertura fragmentária foi preservada. As imagens antigas foram mantidas quando claras, e a expressão antropológica “meus rins” foi traduzida funcionalmente como “meu íntimo”.
