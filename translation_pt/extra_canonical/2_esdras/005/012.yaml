id: 2ES.5.12
reference: 2 Esdras 5:12
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pertransiit iustitia, iustum faciens ? et haec negabit. Et erit in illo tempore, et sperabunt homines et non impetrabunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/012.yaml
  text: Has righteousness passed through[a], or one who does righteousness? And it will say no. And it will be at that time that men will hope and not obtain;
translation:
  language: pt
  text: 'Acaso passou a justiça, ou alguém que pratica a justiça? E ela[a] responderá: “Não”. Naquele tempo, as pessoas terão esperança, mas não obterão o que esperam;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isto é, provavelmente, a terra mencionada no versículo anterior; literalmente, “e esta negará”.
    reason: Esclarece o referente contextual do pronome feminino latino e registra a forma mais literal da expressão.
lexical_decisions:
- source_word: pertransiit
  choice: passou
  rationale: Mantém o sentido de atravessar ou passar, completando a pergunta iniciada no contexto anterior, sem acrescentar um objeto ausente no trecho latino.
- source_word: iustitia
  choice: a justiça
  rationale: Equivalente direto e natural de “iustitia”, preservando a formulação abstrata do texto.
- source_word: iustum faciens
  choice: alguém que pratica a justiça
  rationale: Expressa o idiomatismo semítico subjacente, isto é, a pessoa que age justamente, e evita a leitura de que alguém torna outra pessoa justa.
- source_word: haec negabit
  choice: 'ela responderá: “Não”'
  rationale: Transmite de modo idiomático a negação personificada; o feminino latino remete provavelmente à terra mencionada no contexto anterior.
- source_word: sperabunt homines et non impetrabunt
  choice: as pessoas terão esperança, mas não obterão o que esperam
  rationale: Torna explícito em português o complemento implícito de “obter”, sem definir indevidamente qual seria o objeto da esperança.
theological_decisions:
- issue: Referente do pronome feminino em “haec negabit”
  choice: Manter a personificação com “ela” e esclarecer em nota sua provável referência à terra
  alternative: 'Usar a forma impessoal “a resposta será: ‘Não’”'
  rationale: A opção escolhida conserva a forma feminina e a personificação do latim, ao mesmo tempo que evita deixar o leitor sem indicação do referente contextual.
- issue: Sentido de “iustum faciens”
  choice: “alguém que pratica a justiça”
  alternative: “alguém que torna justo”
  rationale: O contexto e o idiomatismo subjacente favorecem a ideia de agir com justiça, não a de justificar outra pessoa; assim não se introduz uma afirmação soteriológica estranha ao trecho.
translation_notes:
  register: Português moderno, claro e digno, com “as pessoas” para o genérico “homines”. A pergunta abrupta foi preservada por depender do versículo anterior. O ponto e vírgula final mantém a continuidade sintática com o versículo seguinte sem importar para este versículo a cláusula pertencente a 5:13.
