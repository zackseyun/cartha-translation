  source_fidelity: 'A tradução preserva adequadamente a pergunta elíptica do latim: «passou a justiça, ou alguém que pratica a justiça?». «Alguém que pratica a justiça» representa bem o idiomatismo de iustum faciens, sem introduzir o sentido distinto de tornar alguém justo. «Ela responderá: “Não”» transmite de modo natural haec negabit, conservando a personificação e a negação. A cláusula final reproduz sperabunt homines et non impetrabunt e mantém corretamente o ponto e vírgula que assinala continuidade com o versículo seguinte.'
