source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit inconposita vestigio quam nunc vides regnare regionem, et videbunt eam desertam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/003.yaml
  text: And the region that you now see ruling will be a trackless waste, and they will see it desolate.
translation:
  language: pt
  text: E a região que agora você vê dominar se tornará uma vastidão sem caminhos, e eles a verão desolada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem
  choice: região
  rationale: Equivalente direto e natural, preservando a referência territorial sem restringi-la a 'terra'.
- source_word: regnare
  choice: dominar
  rationale: Expressa aqui o exercício de poder ou preeminência atribuído à região, de modo mais natural em português do que o literal 'reinar' aplicado a um território.
- source_word: inconposita vestigio
  choice: uma vastidão sem caminhos
  rationale: A expressão latina é difícil e sugere um território desordenado ou não demarcado por rastros/caminhos; esta formulação conserva a imagem de uma extensão intransitável sem impor precisão ausente no texto.
- source_word: desertam
  choice: desolada
  rationale: Mantém o sentido predicativo do latim e evita acrescentar uma ação causativa não expressa.
