  source_fidelity: 'A tradução preserva adequadamente a estrutura e o sentido do latim: regionem como “região”, a região personificada que se vê exercer domínio, a imagem difícil de inconposita vestigio como um lugar sem caminhos/rastros, e desertam como “desolada”. “Vastidão sem caminhos” é uma solução interpretativamente comedida para a expressão obscura e corresponde bem ao audit trail inglês “trackless waste”.'
