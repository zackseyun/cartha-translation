  text: the angel who had come to me on the previous night was with me[a], and he said to me, 'Hear me, and I will instruct you; pay attention to me, and I will add further.'
translation:
  language: pt
  text: 'O anjo que tinha vindo até mim na noite anterior estava comigo[a] e me disse: “Escute-me, e eu o instruirei; preste atenção em mim, e acrescentarei algo mais.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma divisão anterior dos versículos: “E eu disse: ‘Fale, meu senhor.’ Ele me respondeu: ‘Você se deixou perturbar profundamente por causa de Israel. Será que você o amou mais do que aquele que o criou?’”'
    reason: Registra a redação anterior decorrente de outra segmentação do texto, enquanto o corpo segue exatamente o trecho latino atribuído a este versículo na edição indicada.
lexical_decisions:
- source_word: praeterita nocte
  choice: na noite anterior
  rationale: Expressa de modo natural o sentido temporal do latim, sem a redundância literal de “na noite passada anteriormente”.
- source_word: audi me
  choice: Escute-me
  rationale: Mantém o imperativo dirigido pessoalmente a Esdras em linguagem atual e digna.
- source_word: instruam te
  choice: eu o instruirei
  rationale: Conserva o sentido direto de ensinar ou orientar presente em “instruam”.
- source_word: intende mihi
  choice: preste atenção em mim
  rationale: Reproduz o chamado enfático para que o interlocutor atente ao anjo.
- source_word: adiciam
  choice: acrescentarei mais
  rationale: O verbo fica sem objeto explícito no trecho latino; a formulação preserva essa abertura e indica continuação do ensinamento.
theological_decisions:
- issue: Referente implícito de “adiciam”
  choice: acrescentarei mais
  alternative: acrescentarei outras coisas
  rationale: O latim não declara o que será acrescentado. A tradução evita especificar conteúdo doutrinário ou narrativo não expresso.
- issue: Construção “est angelus ad me”
  choice: O anjo ... estava comigo
  alternative: O anjo ... estava junto de mim
  rationale: A construção latina é incomum, mas no contexto indica a presença do anjo junto a Esdras; “estava comigo” é natural e não acrescenta interpretação teológica.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. Emprega “você” apenas na nota, onde é necessário explicitar o pronome; no texto principal, as formas oblíquas mantêm fluidez e dignidade. A pontuação evidencia os dois imperativos paralelos e a promessa correspondente.
