  rationale: Expressa de modo natural em português a localização sobre a terra, sem tornar a frase pesada.
- source_word: per tempus
  choice: no tempo deles
  rationale: Segue a leitura contextual refletida na camada inglesa auditada, entendendo a expressão como o tempo designado aos que foram semeados, sem acrescentar a ideia distributiva de “cada um”.
theological_decisions:
- issue: Metáfora do ventre da terra
  choice: ventre da terra
  alternative: matriz da terra
  rationale: “Ventre” é claro, digno e acessível, além de preservar a imagem corporal sem impor uma interpretação cosmológica específica.
translation_notes:
  register: Português moderno, claro e solene, com construção natural para leitores brasileiros e compreensão internacional. O pronome sujeito foi mantido em “ele me disse”, enquanto o segundo “eu” ficou implícito, como é idiomático em português.
