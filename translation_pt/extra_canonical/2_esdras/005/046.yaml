  text: And he said to it, “If you bear ten, why over time? Ask it therefore to give birth to ten at one time.” And I said, “Certainly it cannot, but—”
translation:
  language: pt
  text: 'Você dirá a ela: “Se você dá à luz dez, por que ao longo do tempo? Peça-lhe, então, que dê à luz dez de uma só vez.” E eu disse: “Certamente ela não poderá, mas—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dices ad eam
  choice: Você dirá a ela
  rationale: Preserva o futuro e o referente feminino implícito no latim, sem acrescentar interpretativamente ‘ventre de uma mulher’.
- source_word: decem si paris
  choice: Se você dá à luz dez
  rationale: Traduz parere no sentido obstétrico e mantém ‘dez’ sem explicitar ‘filhos’, que não consta nesta unidade textual.
- source_word: per tempus
  choice: ao longo do tempo
  rationale: Expressa a ideia temporal do latim sem introduzir a noção mais específica de etapas.
- source_word: roga ergo eam
  choice: Peça-lhe, então
  rationale: Mantém a terceira pessoa feminina do referente e a ligação inferencial de ergo.
- source_word: det decem in unum
  choice: que dê à luz os dez de uma só vez
  rationale: No contexto, det retoma a ação de gerar/dar à luz; in unum indica simultaneidade. O artigo ‘os’ retoma os dez já mencionados.
- source_word: non utique poterit
  choice: Certamente ela não pode
  rationale: Utique reforça a negativa; o presente idiomático em português comunica incapacidade geral, embora o latim use o futuro poterit.
