  text: And those who opposed your promises have trampled those who believed your covenants[a].
translation:
  language: pt
  text: E aqueles que se opunham às tuas promessas pisotearam os que criam nas tuas alianças.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uma versão anterior trazia aqui: “E, se odiaste o teu povo com ódio, ele deveria ser castigado por tuas próprias mãos”. Esse texto corresponde ao versículo seguinte.'
    reason: Registra a leitura anterior mencionada na camada de consulta, esclarecendo que decorreu de desalinhamento de versículos.
lexical_decisions:
- source_word: conculcaverunt
  choice: pisotearam
  rationale: Expressa de modo direto a ação de calcar aos pés, preservando também seu possível sentido figurado de oprimir.
- source_word: contradicebant
  choice: se opunham
  rationale: No contexto, indica resistência ou oposição às promessas divinas, não apenas contradição verbal.
- source_word: sponsionibus tuis
  choice: tuas promessas
  rationale: Sponsio designa compromisso ou promessa; esta opção é natural e mantém a distinção em relação a testamentis.
- source_word: testamentis
  choice: alianças
  rationale: No registro bíblico latino, testamentum pode representar aliança ou pacto; 'alianças' é claro e contextualmente adequado.
- source_word: credebant
  choice: criam
  rationale: Preserva o valor verbal de confiar ou crer nas alianças, sem explicitar além do texto.
theological_decisions:
- issue: Relação entre promessas e alianças
  choice: 'Manter os dois termos distintos: ''promessas'' e ''alianças''.'
  alternative: Uniformizar ambos como 'promessas' ou 'alianças'.
  rationale: O latim emprega substantivos diferentes, sponsionibus e testamentis, cuja distinção pode ser significativa.
- issue: Objeto de 'pisotearam'
  choice: Entender 'os que criam nas tuas alianças' como objeto direto.
  alternative: Reformular a sintaxe para atribuir outra relação entre os dois grupos.
  rationale: A estrutura latina contrapõe com naturalidade os que resistiam às promessas aos que criam nas alianças e apresenta estes últimos como vítimas.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação conserva o paralelismo e a tensão do latim sem acrescentar uma identificação denominacional dos grupos.
