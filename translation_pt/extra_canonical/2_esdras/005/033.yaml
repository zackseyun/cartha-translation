  yaml_path: translation/extra_canonical/2_esdras/005/033.yaml
  text: '...before you.'' And I said[a], ''Speak, my lord.'' And he said to me, ''You have become greatly beside yourself in mind over Israel; or have you loved him more...'
translation:
  language: pt
  text: '“…diante de ti.” E eu disse[a]: “Fala, meu senhor.” E ele me disse: “Ficaste completamente fora de ti a respeito de Israel; ou será que o amaste mais…”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Tradução anterior: “E eu disse: ‘Não, senhor, mas falei em minha aflição, pois minhas entranhas me atormentam a toda hora, enquanto procuro compreender o caminho do Altíssimo e sondar uma parte do seu juízo.’” Essa redação corresponde ao versículo seguinte na segmentação da fonte latina adotada.'
    reason: Preserva o registro de auditoria da tradução anterior sem apresentá-la incorretamente como leitura alternativa de 2 Esdras 5:33.
lexical_decisions:
- source_word: loquere
  choice: Fala
  rationale: Imperativo direto e natural, preservando o número singular e o tom do pedido.
- source_word: dominus meus
  choice: meu senhor
  rationale: Mantém o vocativo respeitoso do latim sem pressupor que se trate de um título divino.
- source_word: ualde in excessu mentis factus es
  choice: Ficaste completamente fora de ti
  rationale: A expressão idiomática comunica o forte descontrole ou transtorno mental indicado pelo latim, mais precisamente do que apenas ‘muito angustiado’.
- source_word: in Israel
  choice: por causa de Israel
  rationale: Neste contexto, a preposição indica o foco ou motivo da perturbação, e não localização física.
- source_word: aut plus dilexisti
  choice: ou será que o amaste mais
  rationale: Preserva a pergunta alternativa, o objeto masculino retomado pelo pronome e o caráter incompleto do fragmento.
theological_decisions:
- issue: Referência de dominus meus
  choice: meu senhor, em minúsculas
  alternative: meu Senhor
  rationale: O contexto imediato apresenta um interlocutor a quem se dirige respeito; o latim não exige identificar o título como referência direta a Deus.
- issue: Intensidade de in excessu mentis
  choice: fora de ti
  alternative: muito angustiado em tua mente
  rationale: A formulação escolhida preserva a ideia mais forte de estar fora de si, sem reduzi-la silenciosamente a mera aflição emocional.
translation_notes:
  register: Português atual, digno e acessível, com formas de segunda pessoa do singular para conservar o caráter direto do diálogo. As reticências iniciais e finais indicam que o texto fornecido começa e termina no meio de frases.
