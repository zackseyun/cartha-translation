  source_fidelity: 'A tradução mantém os elementos atestados: o imperativo dirigido no singular, «filhos», o particípio «dormientes», a relação explicativa de «quoniam» e o futuro enfático «ego eos educam». «Que dormem» preserva sem interpretação adicional a possível imagem de sono/morte. A continuação «dos lugares ocultos da terra» segue a trilha inglesa fornecida para completar o «de» no excerto latino apresentado.'
