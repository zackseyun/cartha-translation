  yaml_path: translation/extra_canonical/2_esdras/002/030.yaml
  text: Remember your sleeping children, for I will bring them out from the hidden places of the earth,
translation:
  language: pt
  text: Lembre-se de seus filhos que dormem, pois eu os tirarei dos lugares ocultos da terra,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filios tuos
  choice: seus filhos
  rationale: Traduz diretamente o plural latino; “filhos” preserva a relação familiar e pode abranger os descendentes no contexto.
- source_word: dormientes
  choice: que dormem
  rationale: Mantém a imagem participial do sono sem explicá-la como morte, preservando a possível tensão metafórica.
- source_word: memorare
  choice: Lembre-se de
  rationale: Imperativo natural em português, correspondente ao chamado para recordar ou ter em mente.
- source_word: quoniam
  choice: pois
  rationale: Expressa a relação explicativa ou causal com registro digno e corrente.
- source_word: ego eos educam
  choice: eu os tirarei
  rationale: O futuro de educere indica conduzir ou fazer sair; “tirarei” é idiomático e mantém o movimento para fora.
- source_word: de
  choice: dos lugares ocultos da terra
  rationale: O texto latino fornecido termina na preposição “de” e está incompleto; a complementação segue a evidência da camada inglesa auditada, que preserva a leitura contextual “hidden places of the earth”.
theological_decisions:
- issue: Sentido de “dormientes”
  choice: que dormem
  alternative: mortos
  rationale: Não se explicita a imagem como referência inequívoca aos mortos; a formulação conserva a linguagem do texto e sua ambiguidade teológica.
translation_notes:
  register: Português moderno, claro e digno, com construção natural para leitores brasileiros e compreensão internacional. A vírgula final foi mantida porque o trecho apresentado continua sintaticamente.
