  text: They stood boldly for the name of the Lord. Then the angel said to me[a], “Go, announce to my people what and how great are the wonders of the Lord God that you have seen.”
translation:
  language: pt
  text: 'Permaneceram firmes pelo nome do Senhor. Então o anjo me disse: “Vá e anuncie ao meu povo quais e quão grandes são as maravilhas do Senhor Deus que você viu.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fortiter
  choice: firmes
  rationale: Em ligação com steterunt, expressa coragem e constância sem transformar a imagem de permanecer de pé em combate explícito.
- source_word: pro nomine domini
  choice: em favor do nome do Senhor
  rationale: Preserva o sentido de lealdade e atuação em defesa do nome, evitando limitar pro à ideia causal de “por causa de”.
- source_word: adnuntia
  choice: anuncie
  rationale: Equivalente direto e natural para a ordem de tornar algo conhecido publicamente.
- source_word: qualia et quanta mirabilia
  choice: que maravilhas ... e quão grandiosas elas são
  rationale: Reproduz os dois aspectos da expressão latina — a natureza das maravilhas e sua grandeza — em português corrente, sem a construção rígida “quais e quão grandes maravilhas”.
theological_decisions:
- issue: Sentido de pro nomine domini
  choice: em favor do nome do Senhor
  alternative: por causa do nome do Senhor
  rationale: O latim pode indicar tanto compromisso em favor do nome quanto sofrimento ou firmeza por causa dele. A escolha mantém em primeiro plano a lealdade ativa sem introduzir uma doutrina específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com uso de “você” na fala direta. A colocação “mantiveram-se” conserva um tom literário moderado; a reformulação final evita uma sequência adjetival artificial em português.
