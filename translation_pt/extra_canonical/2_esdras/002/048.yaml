  rationale: A revisão torna a primeira oração mais idiomática sem decidir além do necessário a nuance de pro nomine. Na fala do anjo, restaura-se o paralelismo de qualia e quanta como qualificadores de mirabilia, mantendo uma sintaxe portuguesa formal mas compreensível. A nota é removida porque a ambiguidade relevante fica adequadamente preservada no próprio texto.
