  text: He answered and said to me[47], “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.
translation:
  language: pt
  text: 'Ele me respondeu: “Ele é o Filho de Deus,[a] a quem eles confessaram nesta era”. Então comecei a exaltar os que permaneceram firmes pelo nome do Senhor.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A identificação explícita da figura coroada como “o Filho de Deus” é característica da camada composicional cristã posterior deste capítulo e não deve ser projetada sem cautela sobre o apocalipse judaico dos capítulos 3–14.
    reason: compositional_layer
lexical_decisions:
- source_word: ipse est filius dei
  choice: Este é o Filho de Deus
  rationale: Mantém a identificação explícita e enfática da figura, em linguagem portuguesa natural e solene.
- source_word: in saeculo
  choice: neste mundo
  rationale: O latim pode designar o mundo ou a era presente. “Neste mundo” é claro no contexto e preserva o sentido temporal-existencial sem impor uma formulação técnica.
- source_word: confessi sunt
  choice: eles confessaram
  rationale: Preserva o verbo de confissão pública e sua possível carga religiosa, em vez de reduzi-lo a mero reconhecimento.
- source_word: magnificare
  choice: exaltar
  rationale: Expressa a ideia de honrar e enaltecer pessoas; “magnificar” seria menos natural no português corrente.
- source_word: fortiter ... steterunt
  choice: permaneceram firmes
  rationale: Traduz idiomaticamente a perseverança corajosa indicada pela expressão latina atestada na continuação tradicional do versículo.
theological_decisions:
- issue: Identidade da figura coroada
  choice: Filho de Deus
  alternative: filho de Deus
  rationale: A expressão latina é explícita e funciona aqui como título identificador; a capitalização segue o referente cristológico imediato sem acrescentar conteúdo ao texto.
- issue: Sentido de “in saeculo”
  choice: neste mundo
  alternative: nesta era
  rationale: A expressão admite ambos os sentidos. “Neste mundo” é natural e permanece semanticamente próxima do latim, sem resolver de modo dogmático a relação entre era presente e mundo habitado.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A frase final segue a continuação latina tradicional refletida pela camada inglesa auditada, pois o excerto latino fornecido termina de forma truncada em “qui”.
