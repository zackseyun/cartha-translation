source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: misericordiam. Ego autem te, pater, testem inuoco super matrem filiorum, quia noluerunt testamentum meum seruare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/005.yaml
  text: But I call on you[a], Father, as a witness against the mother of the children, because they were unwilling to keep my covenant,
translation:
  language: pt
  text: Mas eu te invoco, Pai, como testemunha contra a mãe dos filhos[a], porque eles não quiseram guardar a minha aliança,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “a respeito da mãe dos filhos”.'
    reason: Preserva a possível leitura menos adversativa de super, embora o contexto judicial favoreça “contra”.
lexical_decisions:
- source_word: testem inuoco
  choice: invoco [...] como testemunha
  rationale: Reproduz de modo natural e digno a fórmula de convocar alguém como testemunha, preservando seu caráter judicial.
- source_word: super matrem filiorum
  choice: contra a mãe dos filhos
  rationale: No contexto judicial de “testem invoco”, super com acusativo tem força adversativa; o pedido hostil do versículo seguinte reforça “contra”. O latim não traz demonstrativo equivalente a “estes”.
- source_word: noluerunt [...] seruare
  choice: não quiseram guardar
  rationale: Expressa diretamente a recusa ou falta de disposição indicada por noluerunt, sem intensificá-la desnecessariamente como “recusaram-se”.
- source_word: testamentum meum
  choice: a minha aliança
  rationale: Neste contexto de relação divina e obrigação de fidelidade, testamentum tem o sentido bíblico de aliança, mais claro em português moderno do que “testamento”.
theological_decisions:
- issue: Força de super na acusação contra a mãe
  choice: contra a mãe dos filhos
  alternative: a respeito da mãe dos filhos / sobre a mãe dos filhos
  rationale: A construção judicial e o contexto favorecem o sentido adversativo, mas a nota preserva a amplitude possível da preposição latina.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima ao latim sem rigidez. A palavra inicial “misericordiam” pertence ao fechamento da frase anterior na divisão editorial e, por isso, não foi incorporada ao texto de 2:5.
