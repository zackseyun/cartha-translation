  yaml_path: translation/extra_canonical/2_esdras/002/039.yaml
  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
translation:
  language: pt
  text: Os que passaram da sombra desta era[a] receberam do Senhor vestes esplêndidas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “deste mundo”.'
    reason: O latim saeculi pode designar tanto a era presente quanto o mundo presente.
lexical_decisions:
- source_word: Qui se ... transtulerunt
  choice: Os que passaram
  rationale: Trata a oração relativa latina substantivada como sujeito da oração principal, sem acrescentar uma conjunção inexistente.
- source_word: umbra saeculi
  choice: sombra desta era
  rationale: “Era” expressa o sentido temporal de saeculum em linguagem natural; “desta” torna explícita em português a era presente implícita no contexto, sem eliminar a alternativa lexical “mundo”.
- source_word: splendidas tunicas
  choice: vestes esplêndidas
  rationale: “Vestes” comunica o sentido de tunicas sem sugerir indevidamente a peça moderna chamada “túnica”; “esplêndidas” preserva a qualidade expressa pelo adjetivo latino.
- source_word: a domino acceperunt
  choice: receberam do Senhor
  rationale: Reproduz diretamente a procedência indicada por a domino e mantém “Senhor” como título.
theological_decisions:
- issue: Relação sintática com o versículo anterior
  choice: 'Frase independente: “Os que... receberam...”'
  alternative: 'Oração relativa ligada ao versículo anterior: “os que... e receberam...”'
  rationale: Qui introduz uma oração relativa substantivada que funciona como sujeito de acceperunt; não há no latim uma conjunção equivalente a “e”.
- issue: Sentido de saeculi
  choice: “desta era” no texto, com “mundo” em nota
  alternative: “deste mundo”
  rationale: O latim admite uma nuance temporal (“era”) e uma nuance cósmico-social (“mundo”); a nota preserva essa amplitude sem decidir uma interpretação escatológica específica.
translation_notes:
  register: Português moderno, claro e digno, com estrutura sintática natural e vocabulário amplamente compreensível. A formulação conserva a imagem da sombra e evita inserir o “e” da versão anterior.
