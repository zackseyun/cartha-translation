  text: and I will give you the first seat in my resurrection[23]. Pause and rest[a],
translation:
  language: pt
  text: Eu lhe darei o primeiro assento na minha ressurreição.[a] Repouse e aquiete-se,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “o primeiro assento na minha ressurreição”. A expressão provavelmente indica primazia ou honra na ressurreição, e não apenas o ato de sentar-se.
    reason: lexical_alternative
lexical_decisions:
- source_word: primam sessionem
  choice: o primeiro assento
  rationale: Mantém a imagem concreta do latim (“primeiro assento”), que pode indicar primazia ou honra, sem reduzir a expressão a uma interpretação específica.
- source_word: in resurrectione mea
  choice: na minha ressurreição
  rationale: Reproduz de modo direto a construção latina e preserva a relação, potencialmente significativa, entre a ressurreição e quem fala.
- source_word: Pausa et quiesce
  choice: Repouse e fique em paz
  rationale: No latim tardio e cristão, pausare pode designar repouso, inclusive em contexto escatológico; quiescere acrescenta a ideia de quietude e paz. A formulação evita o sentido moderno de uma simples pausa temporária.
theological_decisions:
- issue: Sentido de “primeiro assento” na ressurreição
  choice: Preservar a metáfora de assento e explicar sua possível conotação de primazia ou honra em nota
  alternative: Traduzir diretamente como “primeiro lugar”
  rationale: O latim emprega sessionem, e a tradução literal conserva uma imagem teologicamente sugestiva sem decidir se ela expressa ordem, posição ou honra.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. “Repouse e fique em paz” comunica o valor de repouso e quietude do duplo imperativo latino sem sugerir apenas uma interrupção momentânea.
