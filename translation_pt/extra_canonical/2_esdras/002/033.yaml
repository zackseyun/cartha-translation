  yaml_path: translation/extra_canonical/2_esdras/002/033.yaml
  text: I[a], Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and spurned the commandment of the Lord. Therefore I say to you, O nations,
translation:
  language: pt
  text: 'Eu, Esdras, recebi no monte Horebe uma ordem do Senhor para ir a Israel; mas, quando cheguei até eles, eles me rejeitaram e repudiaram[a] o mandamento do Senhor. Por isso digo a vocês, ó nações:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Outra tradução: “desprezaram”. O latim indica uma rejeição ativa e contundente.'
    reason: Registra a tradução anterior e esclarece a força de respuerunt sem enfraquecer o texto principal.
lexical_decisions:
- source_word: reprobauerunt
  choice: rejeitaram
  rationale: Expressa de modo direto e natural a rejeição da pessoa enviada.
- source_word: respuerunt
  choice: repudiaram
  rationale: O verbo latino indica rejeição ativa e enfática, não apenas desprezo interior; “repudiaram” preserva essa força em português corrente e digno.
- source_word: mandatum
  choice: mandamento
  rationale: Mantém o caráter de ordem divina e a terminologia bíblica reconhecível.
- source_word: gentes
  choice: nações
  rationale: Preserva o sentido coletivo e a possível referência aos povos não israelitas sem restringi-lo explicitamente a “gentios”.
theological_decisions:
- issue: Identidade e alcance de gentes
  choice: nações
  alternative: gentios
  rationale: “Nações” conserva a amplitude lexical do latim e evita resolver além do texto se a palavra designa todos os povos ou especificamente os não judeus.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e compreensão internacional. A construção mantém a sequência narrativa e a apóstrofe final aberta para o versículo seguinte.
