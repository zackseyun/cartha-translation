  text: The mother who bore them says to them, “Go, children, for I am a widow and forsaken.”
translation:
  language: pt
  text: 'A mãe que os deu à luz lhes diz: “Vão, filhos, pois sou viúva e abandonada.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mater, quae eos generauit
  choice: A mãe que os deu à luz
  rationale: Reproduz de modo natural e preciso a ideia de gerar e dar à luz, mantendo o pronome plural referente aos filhos.
- source_word: ite, filii
  choice: Vão, filhos
  rationale: Mantém o imperativo plural e o vocativo sem acrescentar o possessivo “meus”, ausente do latim.
- source_word: uidua sum et derelicta
  choice: sou viúva e fui abandonada
  rationale: “Sou viúva” expressa o estado presente; “fui abandonada” traduz derelicta de forma idiomática, preservando a distinção entre viuvez e abandono.
