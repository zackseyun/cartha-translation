  text: nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/026.yaml
  text: None of them will perish[a], for I will require them from your number. Do not be anxious, for when the day of distress and anguish comes,
translation:
  language: pt
  text: Nenhum deles perecerá, pois eu os requererei dentre os teus. Não fiques ansiosa, pois, quando chegar o dia de aflição e angústia,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: interiet
  choice: perecerá
  rationale: Preserva o sentido forte de morrer ou perder-se, em registro bíblico claro e corrente.
- source_word: requiram
  choice: requererei
  rationale: Mantém a força jurídica e de prestação de contas do verbo latino, sem reduzi-lo a simplesmente procurar.
- source_word: de numero tuo
  choice: dentre os teus
  rationale: Expressa naturalmente em português que eles pertencem ao grupo confiado à destinatária, evitando o literalismo pouco idiomático 'do teu número'.
- source_word: Noli satagere
  choice: Não fiques ansiosa
  rationale: Comunica a proibição de inquietar-se ou preocupar-se, dirigindo-se no feminino à figura materna do contexto.
- source_word: pressurae et angustiae
  choice: aflição e angústia
  rationale: Reproduz os dois termos coordenados e sua intensificação sem fundi-los.
theological_decisions:
- issue: Força de requiram
  choice: eu os requererei dentre os teus
  alternative: eu os procurarei entre os teus
  rationale: O verbo pode envolver buscar ou exigir; 'requererei' preserva a possível ideia de Deus exigir prestação de contas sem resolver a tensão em favor de mera localização.
translation_notes:
  register: Português moderno, digno e acessível, com segunda pessoa singular coerente com a destinatária feminina do contexto. A frase permanece aberta no fim, como no recorte latino fornecido.
