source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domini compleuerunt. Filiorum tuorum, quos optabas, plenus est numerus, roga imperium domini, ut sanctificetur populus tuus, qui uocatus est ab initio.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/041.yaml
  text: The number of your children[a], whom you desired, is complete. Ask for the Lord’s authority, that your people, who were called from the beginning, may be sanctified.
translation:
  language: pt
  text: Está completo o número dos teus filhos, que desejavas. Pede a autoridade do Senhor, para que o teu povo, chamado desde o princípio, seja santificado.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plenus est numerus
  choice: Está completo o número
  rationale: Expressa de modo natural em português que o número previsto foi alcançado, preservando a ideia de plenitude do latim.
- source_word: optabas
  choice: desejavas
  rationale: Mantém o sentido direto de desejo sem intensificá-lo como “ansiavas” ou “almejavas”.
- source_word: roga imperium domini
  choice: Suplica à autoridade do Senhor
  rationale: Preserva imperium como autoridade soberana e entende roga como dirigir uma súplica, evitando sugerir que a pessoa deva receber autoridade do Senhor.
- source_word: sanctificetur
  choice: seja santificado
  rationale: Conserva a voz passiva e o vocabulário religioso explícito do texto latino.
theological_decisions:
- issue: O sentido de imperium domini
  choice: autoridade do Senhor
  alternative: poder do Senhor; domínio do Senhor
  rationale: “Autoridade” comunica o governo soberano indicado por imperium sem reduzir o termo a força nem introduzir uma formulação denominacional.
- issue: A referência temporal de qui uocatus est ab initio
  choice: o teu povo, chamado desde o princípio
  alternative: o teu povo, que foi chamado desde o princípio
  rationale: Mantém a oração relativa ligada a “povo” e não especifica por quem ou para qual finalidade ele foi chamado.
translation_notes:
  register: Português moderno, digno e acessível, com construção concisa. A sintaxe mantém a relação explícita entre “chamado desde o princípio” e “o teu povo”. O fragmento inicial “domini compleuerunt.” parece pertencer ao contexto textual anterior e não foi incorporado à tradução da sentença completa correspondente ao versículo.
