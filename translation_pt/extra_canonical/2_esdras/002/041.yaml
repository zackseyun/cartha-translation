revisions:
- from: Está completo o número dos teus filhos, que desejavas. Suplica à autoridade do Senhor que o teu povo, chamado desde o princípio, seja santificado.
  to: Está completo o número dos teus filhos, que desejavas. Pede a autoridade do Senhor, para que o teu povo, chamado desde o princípio, seja santificado.
  rationale: 'A revisão corrige a regência de «suplicar a», que fazia da autoridade do Senhor o destinatário da petição. Mantém-se «autoridade» para imperium, a passiva «seja santificado» e a ligação de «chamado desde o princípio» a «o teu povo». Não é necessária nota: a ordem portuguesa deixa essa ligação inequívoca, e a variante assinalada no audit trail inglês é meramente de posicionamento sintático.'
