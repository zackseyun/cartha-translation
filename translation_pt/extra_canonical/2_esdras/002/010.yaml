  yaml_path: translation/extra_canonical/2_esdras/002/010.yaml
  text: 'Thus says the Lord to Ezra: Announce to my people that I will give them the kingdom of Jerusalem, which I was going to give to Israel.'
translation:
  language: pt
  text: 'Assim diz o Senhor a Esdras: “Anuncie ao meu povo que lhes darei o reino de Jerusalém, que eu iria dar a Israel.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntia
  choice: Anuncie
  rationale: Imperativo natural e digno em português, preservando a ideia de proclamação pública.
- source_word: regnum Hierusalem
  choice: o reino de Jerusalém
  rationale: Tradução formal que conserva a expressão incomum e sua possível ambiguidade, sem reinterpretá-la como cidade, território ou governo.
- source_word: quod daturus eram
  choice: que eu daria
  rationale: Expressa de modo natural a perífrase latina de intenção passada, sem acrescentar que a dádiva tenha sido definitivamente revogada.
theological_decisions:
- issue: Relação entre “meu povo” e “Israel”
  choice: Manter as duas designações distintas, sem identificar nem contrastar explicitamente seus referentes.
  alternative: Explicitar que “meu povo” seria outro grupo em substituição a Israel.
  rationale: O latim deixa a relação implícita; a tradução preserva essa tensão teológica em vez de resolvê-la.
translation_notes:
  register: Português moderno, claro e solene, com tratamento imperativo na terceira pessoa. A ordem e o discurso direto foram mantidos próximos do latim.
