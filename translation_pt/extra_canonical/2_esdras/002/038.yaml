  yaml_path: translation/extra_canonical/2_esdras/002/038.yaml
  text: He has called the heavenly kingdom. Rise and stand, and see the number
translation:
  language: pt
  text: Ele chamou os reinos celestiais.[a] Levantem-se, permaneçam de pé e vejam o número
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em latim, literalmente: “chamou os reinos celestiais”; a construção é abrupta, e “reinos” está no plural.'
    reason: Sinaliza a sintaxe incomum e o plural do texto-fonte sem corrigi-los silenciosamente.
lexical_decisions:
- source_word: caelestia regna
  choice: os reinos celestiais
  rationale: Preserva o plural do latim e evita harmonizá-lo com o singular da camada inglesa.
- source_word: uocauit
  choice: chamou
  rationale: Reproduz diretamente o sentido básico do perfeito latino, sem acrescentar destinatário ou finalidade não expressos.
- source_word: Surgite et state
  choice: Levantem-se, permaneçam de pé
  rationale: Mantém os dois imperativos plurais e torna explícita, em português natural, a ideia durativa de state.
- source_word: uidete numerum
  choice: vejam o número
  rationale: Conserva a formulação incompleta do trecho latino, sem antecipar o complemento encontrado no contexto seguinte.
theological_decisions:
- issue: Número dos reinos celestiais
  choice: 'Manter o plural: “os reinos celestiais”'
  alternative: “o reino celestial”
  rationale: O texto latino traz regna no plural; não há razão textual suficiente para normalizá-lo segundo uma formulação teológica mais habitual.
- issue: Objeto ou finalidade implícita de “chamou”
  choice: Não acrescentar palavras
  alternative: “chamou vocês para os reinos celestiais”
  rationale: Embora a frase latina seja abrupta, ela não expressa explicitamente “vocês” nem a preposição “para”; a tradução preserva essa tensão sintática.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com imperativos na terceira pessoa do plural. A redação preserva tanto a estranheza da primeira oração quanto a interrupção final do versículo.
