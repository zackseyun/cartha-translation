  naturalness: «Recebam do Senhor e alegrem-se, dando graças àquele que os chamou para os reinos celestiais» é claro, solene e natural em português moderno de ampla compreensão. O objeto elíptico após «Recebam do Senhor» é incomum, mas é intencional e justificadamente preserva a forma incompleta/aberta do testemunho latino fornecido.
  terminology: «Senhor», «dando graças», «chamou» e «reinos celestiais» são escolhas adequadas. «Reinos» preserva o plural latino sem impor uma harmonização teológica. A âncora [a] está bem colocada, imediatamente após a expressão afetada.
