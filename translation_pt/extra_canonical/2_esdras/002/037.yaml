  yaml_path: translation/extra_canonical/2_esdras/002/037.yaml
  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: pt
  text: Recebam do Senhor[a] e alegrem-se, dando graças àquele que os chamou para os reinos celestiais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O latim disponível diz literalmente: “Recebam do Senhor”, sem declarar o que deve ser recebido. Algumas formas do texto ou traduções suprem aqui uma expressão como “o que foi confiado” ou “a alegria da sua glória”.'
    reason: Sinalizar a ausência do objeto no texto latino fornecido e preservar a incerteza textual sem sobrecarregar o corpo do versículo.
lexical_decisions:
- source_word: domini accipite
  choice: Recebam do Senhor
  rationale: O latim fornecido traz o imperativo «accipite» sem objeto expresso, seguido ou associado ao genitivo «domini». A tradução conserva essa construção aberta, sem importar como objeto «a alegria da sua glória», expressão que não aparece no trecho latino apresentado.
- source_word: iocundamini
  choice: alegrem-se
  rationale: Equivalente natural e digno para o imperativo latino, preservando a exortação no plural.
- source_word: gratias agentes
  choice: dando graças
  rationale: Reproduz diretamente a construção participial latina em português corrente.
- source_word: ei qui uos ... vocavit
  choice: àquele que os chamou
  rationale: Segue a formulação refletida pela camada de consulta e mantém o destinatário plural; «chamou» exprime o perfeito latino.
- source_word: ad caelestia regna
  choice: para os reinos celestiais
  rationale: Mantém o plural «regna» e a direção indicada por «ad», conforme a continuação atestada e refletida na consulta inglesa.
theological_decisions:
- issue: Objeto de «accipite»
  choice: 'Deixar o objeto implícito: «Recebam do Senhor»'
  alternative: «Recebam do Senhor a alegria da sua glória» ou «Recebam o que lhes foi confiado pelo Senhor»
  rationale: O trecho latino apresentado não contém um substantivo que corresponda claramente a nenhuma dessas expansões. Deixar o objeto implícito preserva a ambiguidade textual e evita decidir entre reconstruções concorrentes.
- issue: Plural de «regna»
  choice: «reinos celestiais»
  alternative: «reino celestial»
  rationale: O plural segue a forma latina e evita harmonização teológica desnecessária com a expressão mais comum no singular.
translation_notes:
  register: Português moderno, claro e solene, com imperativos na terceira pessoa do plural, de boa legibilidade brasileira e compreensão internacional. A formulação evita tanto arcaísmos como expansões não sustentadas pelo trecho latino.
