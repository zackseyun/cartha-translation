lexical_decisions:
- source_word: Noli timere
  choice: Não tenha medo
  rationale: Expressa naturalmente em português a proibição latina, preservando seu tom direto de encorajamento.
- source_word: mater filiorum
  choice: mãe de filhos
  rationale: Mantém a formulação explícita e um pouco incomum do latim, sem acrescentar uma identificação não presente no texto.
- source_word: elegi
  choice: escolhi
  rationale: Equivalente direto de elegi, preservando a ideia de escolha divina sem explicitação teológica adicional.
- source_word: dicit dominus
  choice: diz o Senhor
  rationale: Reproduz a fórmula declarativa do original em linguagem bíblica corrente e digna.
theological_decisions:
- issue: Identidade da “mãe de filhos”
  choice: Manter a referência sem identificar a mãe
  alternative: Explicitar a mãe como Sião, Jerusalém ou a comunidade do povo de Deus
  rationale: O versículo isolado não nomeia sua identidade; explicitá-la resolveria no texto uma referência que o original deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. O tratamento por “você” torna a fala direta natural; a expressão “mãe de filhos” é preservada por fidelidade à formulação latina.
