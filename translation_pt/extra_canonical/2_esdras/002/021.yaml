  - severity: low
    issue: “meu esplendor” enfraquece a terminologia tradicional de claritas.
    rationale: Embora semanticamente defensável, “minha glória” é a equivalência mais direta e preserva melhor a linguagem religiosa da passagem.
  - severity: low
    issue: A nota usa “o aleijado” para o antecedente contextual.
    rationale: O ponto filológico é válido, mas “a pessoa manca” ou a menção ao latino claudum comunica-o com registro mais adequado.
