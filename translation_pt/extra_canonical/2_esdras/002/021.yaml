  text: inridere noli, tutare mancum et caecum ad uisionem claritatis meae admitte, Senem et iuuenem intra muros tuos serua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/021.yaml
  text: Do not mock; shelter the lame and the blind[a], admit them to the sight of my glory. Keep the old and the young within your walls.
translation:
  language: pt
  text: Não zombe[a]; proteja a pessoa com deficiência física e dê ao cego acesso à visão da minha glória. Guarde o idoso e o jovem dentro dos seus muros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim não declara aqui de quem não se deve zombar. Pelo contexto, a frase pode retomar claudum (“a pessoa manca”), no fim do versículo anterior.
    reason: Preserva a ausência de objeto expresso neste versículo e informa a provável ligação com o contexto anterior, em registro respeitoso.
lexical_decisions:
- source_word: inridere noli
  choice: Não zombe
  rationale: Mantém a proibição direta do latim sem acrescentar no corpo do texto um objeto que não está expresso neste versículo.
- source_word: tutare
  choice: proteja
  rationale: Expressa de modo natural o sentido de guardar, defender ou dar amparo.
- source_word: mancum
  choice: quem tem uma deficiência física
  rationale: O latim designa uma pessoa privada do uso pleno de um membro ou fisicamente incapacitada; a formulação evita linguagem pejorativa e não a confunde com o cego mencionado em seguida.
- source_word: caecum ... admitte
  choice: conduza o cego
  rationale: Admitte significa permitir a entrada ou o acesso; 'conduza ... à visão' comunica esse acesso em português corrente sem sugerir que o mesmo verbo rege também mancum.
- source_word: claritatis meae
  choice: meu esplendor
  rationale: Claritas pode indicar brilho, esplendor ou glória; 'esplendor' preserva aqui a imagem visual associada a visio.
- source_word: Senem et iuuenem ... serua
  choice: Guarde o idoso e o jovem
  rationale: Reproduz os dois grupos etários e o imperativo de mantê-los em segurança.
- source_word: intra muros tuos
  choice: dentro dos seus muros
  rationale: Conserva a imagem concreta de proteção no interior das muralhas da comunidade ou cidade.
theological_decisions:
- issue: Objeto não expresso de inridere noli
  choice: Não completar o objeto no texto principal
  alternative: Não zombe do aleijado
  rationale: Neste recorte latino, o verbo não traz objeto explícito. O contexto e a divisão anterior podem ligar a proibição a claudum, no fim do versículo precedente, mas inseri-lo sem nota eliminaria uma questão textual e de delimitação do versículo.
- issue: Relação sintática de mancum e caecum
  choice: Ligar tutare a mancum e admitte a caecum
  alternative: Proteja a pessoa com deficiência física e o cego e conduza ambos à visão
  rationale: 'A sequência latina favorece dois pares: tutare mancum e caecum ... admitte. Isso evita estender indevidamente a admissão à visão a ambas as pessoas.'
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com tratamento inclusivo em 'quem tem uma deficiência física'. Os imperativos permanecem diretos, e as imagens de visão, esplendor e muros são preservadas.
