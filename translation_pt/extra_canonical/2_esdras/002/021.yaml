  source_fidelity: A tradução preserva a ordem geral dos imperativos e distingue corretamente tutare mancum de caecum ... admitte. Contudo, “conduza” não corresponde bem a admitte, que significa admitir, permitir acesso ou acolher; conduz sugere acompanhar fisicamente e altera a ação expressa pelo latim. “Esplendor” é possível para claritas, mas “glória” mantém melhor o termo religioso e a correspondência com a tradição textual e a trilha inglesa.
  naturalness: O texto é claro e moderno. “Dê ao cego acesso à visão da minha glória” é mais idiomático que “conduza o cego à visão” e expressa a concessão de acesso sem introduzir a ideia de guia físico.
  terminology: “Pessoa com deficiência física” é uma solução respeitosa e suficientemente abrangente para mancum. “Glória” é preferível para claritatis neste contexto. A nota deve evitar tratar “aleijado” como formulação recomendada; pode referir-se ao termo latino claudum ou a “a pessoa manca” como antecedente contextual.
