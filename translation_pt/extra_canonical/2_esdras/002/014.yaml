    rationale: No latim, «quia uiuo ego» integra a mesma declaração introduzida por «enim». A ligação por vírgula preserva mais precisamente a relação discursiva e evita que «Porque» inicie uma frase de modo desnecessariamente abrupto.
  - severity: low
