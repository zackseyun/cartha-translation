source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Testare, testare caelum et terram, omisi enim malum et creaui bonum, quia uiuo ego, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/014.yaml
  text: Bear witness[a], bear witness, O heaven and earth, for I have put away evil and created good, because I live, says the Lord.
translation:
  language: pt
  text: Toma, toma o céu e a terra por testemunhas, pois afastei o mal e criei o bem, porque eu vivo — diz o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Testare, testare
  choice: Toma, toma ... por testemunhas
  rationale: O imperativo latino é repetido com força enfática. Como «caelum et terram» está em construção acusativa, a formulação portuguesa entende o céu e a terra como testemunhas convocadas e preserva a repetição.
- source_word: omisi enim malum
  choice: pois afastei o mal
  rationale: «Omisi» pode indicar deixar de lado, abandonar ou afastar; «afastei» comunica a remoção do mal sem acrescentar uma explicação teológica.
- source_word: creaui bonum
  choice: criei o bem
  rationale: Tradução direta de «creavi bonum», mantendo o contraste formal entre o mal e o bem.
- source_word: quia uiuo ego
  choice: Porque eu vivo
  rationale: Preserva a afirmação enfática de vida expressa pelo verbo e pelo pronome latino, sem converter a frase em fórmula de juramento mais explícita do que o texto.
theological_decisions:
- issue: A afirmação divina sobre afastar o mal e criar o bem
  choice: 'Preservar literalmente o contraste: «afastei o mal e criei o bem»'
  alternative: Explicitar o mal como calamidade ou interpretar «criar o bem» de modo doutrinário
  rationale: O latim não delimita aqui o sentido de «malum» nem explica a natureza de «bonum»; a tradução conserva essa amplitude e tensão.
translation_notes:
  register: Português moderno, solene e acessível. A repetição inicial foi mantida por ser retoricamente marcada no texto latino; o travessão antes de «diz o Senhor» dá clareza à fórmula declarativa.
