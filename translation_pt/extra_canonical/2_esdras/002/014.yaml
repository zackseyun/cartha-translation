  source_fidelity: A tradução preserva corretamente a repetição enfática de «Testare, testare», a convocação do céu e da terra como testemunhas, o contraste «malum / bonum» e a ênfase de «uiuo ego». A vírgula antes de «porque eu vivo» conserva melhor a ligação sintática e retórica do latim do que a separação por ponto.
  naturalness: «Toma, toma o céu e a terra por testemunhas» é uma formulação solene, clara e idiomática em português. «Porque eu vivo» funciona naturalmente como a razão ligada à declaração anterior quando permanece na mesma frase.
  terminology: «o mal», «o bem» e «o Senhor» são escolhas diretas, estáveis e adequadas ao registro. A nota alternativa proposta não é necessária e introduz uma leitura menos favorecida pela construção acusativa latina, além de soar menos natural em português.
