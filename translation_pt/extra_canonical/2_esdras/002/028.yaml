  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/028.yaml
  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: pt
  text: Minhas mãos cobrirão você, para que seus filhos não vejam a Geena. Alegre-se,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Manus meae
  choice: Minhas mãos
  rationale: Reproduz diretamente o plural latino e preserva a imagem pessoal e protetora.
- source_word: tegent te
  choice: cobrirão você
  rationale: Mantém o futuro e o sentido concreto de cobrir ou resguardar, sem explicitar além do texto.
- source_word: filii tui
  choice: seus filhos
  rationale: Equivalente natural e direto, preservando a referência aos descendentes ou filhos do destinatário.
- source_word: gehennam
  choice: a Geena
  rationale: Translitera o termo tradicional, preservando sua referência escatológica sem substituí-lo interpretativamente por “inferno”.
- source_word: Iocundare
  choice: Alegre-se
  rationale: Imperativo singular natural em português, correspondente ao chamado à alegria.
theological_decisions:
- issue: Sentido de Gehenna
  choice: Geena
  alternative: inferno
  rationale: “Geena” conserva o termo específico do texto e evita resolver sua nuance escatológica por meio de um termo teologicamente mais amplo.
- issue: Relação expressa por ne
  choice: para que ... não vejam
  alternative: de modo que ... não vejam
  rationale: Preserva a construção final do latim, apresentando a proteção como voltada a impedir essa visão, sem acrescentar uma explicação causal.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A vírgula final foi mantida porque o versículo termina com um imperativo que continua sintaticamente no contexto seguinte.
