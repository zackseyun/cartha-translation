source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/035.yaml
  text: For everlasting light will shine for you through all eternity. Flee the shadow of this age; receive the joy of glory.
translation:
  language: pt
  text: Pois a luz perpétua brilhará para vocês por toda a eternidade. Fujam da sombra desta era; recebam a alegria da glória.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lux perpetua
  choice: a luz perpétua
  rationale: Preserva de modo direto a expressão latina e seu tom escatológico.
- source_word: lucebit uobis
  choice: brilhará para vocês
  rationale: Reproduz o futuro e o destinatário plural em português natural e amplamente compreensível.
- source_word: per aeternitatem temporis
  choice: por toda a eternidade
  rationale: Expressa idiomaticamente a duração ilimitada indicada pela formulação latina, sem a construção pouco natural «pela eternidade do tempo».
- source_word: umbram saeculi huius
  choice: a sombra desta era
  rationale: Mantém a imagem de «sombra» e traduz saeculum como «era», preservando o contraste escatológico sem restringi-lo a «mundo».
- source_word: iocunditatem gloriae
  choice: a alegria da glória
  rationale: Conserva a relação genitiva ambígua do latim, sem decidir se a glória produz a alegria ou constitui seu conteúdo.
theological_decisions:
- issue: Valor de saeculum em contexto escatológico
  choice: desta era
  alternative: deste mundo
  rationale: «Era» preserva melhor a possível contraposição entre a ordem presente e a vindoura, sem importar uma condenação absoluta da criação.
- issue: Relação entre alegria e glória
  choice: a alegria da glória
  alternative: a alegria gloriosa
  rationale: A construção nominal mantém a tensão e a ambiguidade do genitivo gloriae; o adjetivo resolveria a relação interpretativamente.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos no plural («Fujam», «recebam») e «vocês» para legibilidade brasileira e compreensão internacional. A conjunção «Pois» mantém a ligação explicativa de quia com o contexto anterior.
