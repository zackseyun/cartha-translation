base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/016.yaml
  text: And I will raise the dead from their places[16], and I will bring them out from the tombs[a], because I have known my name in them.
translation:
  language: pt
  text: E ressuscitarei os mortos dos seus lugares e os farei sair dos túmulos, porque conheci neles o meu nome.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A frase latina é incomum e também pode ser entendida de modo mais idiomático como «porque reconheço neles o meu nome». Outros entendimentos propostos são «porque o meu nome é conhecido entre eles» e, por conjectura, «porque eles conheceram o meu nome». O texto principal conserva a construção do latim existente, que é a única testemunha textual desta cláusula.
    reason: textual_variant
lexical_decisions:
- source_word: resuscitabo
  choice: ressuscitarei
  rationale: Reproduz diretamente o futuro latino e, no contexto dos mortos, expressa de modo natural a volta à vida.
- source_word: de locis suis
  choice: dos lugares onde estão
  rationale: Transmite o sentido de procedência de seus respectivos lugares sem o português pouco natural «dos seus lugares» neste contexto.
- source_word: monumentis
  choice: túmulos
  rationale: No contexto funerário, monumenta designa sepulturas ou túmulos; «túmulos» é claro e corrente.
- source_word: educam illos
  choice: os farei sair
  rationale: Conserva o valor causativo de educere, isto é, conduzir ou fazer sair de dentro dos túmulos.
- source_word: cognoui
  choice: conheci
  rationale: Mantém o perfeito latino sem transformar a frase em uma afirmação passiva nem transferir o sujeito do conhecimento para as pessoas.
theological_decisions:
- issue: A relação entre Deus, seu nome e os ressuscitados na oração final
  choice: porque conheci neles o meu nome
  alternative: porque reconheço neles o meu nome; porque eles conheceram o meu nome; porque o meu nome é conhecido entre eles
  rationale: A redação preserva a construção atestada, na qual Deus é o sujeito de cognoui e «meu nome» é o objeto. Embora a frase seja incomum, não se adota uma conjectura nem se resolve silenciosamente sua tensão teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A formulação final conserva deliberadamente a estranheza genuína do latim.
