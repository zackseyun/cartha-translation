  text: teus filhos; fortalece, pois, os pés deles. Os servos que te dei,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: filios
  choice: filhos
  rationale: O plural latino pode designar filhos ou crianças; «filhos» preserva de modo natural a relação expressa no contexto.
- source_word: confirma
  choice: fortalece
  rationale: O imperativo significa tornar firme ou fortalecer; com «os pés», «fortalece» mantém a imagem concreta e soa natural em português.
- source_word: pedes eorum
  choice: os pés deles
  rationale: Tradução direta que preserva a metáfora corporal do texto latino.
- source_word: servos
  choice: servos
  rationale: Mantém o sentido social e religioso amplo do latim sem especificar uma função não indicada.
- source_word: dedi
  choice: dei
  rationale: O pretérito perfeito traduz diretamente a ação concluída do perfeito latino.
theological_decisions:
- issue: Identidade dos «filhos» e dos «servos»
  choice: Manter ambos os termos sem identificar explicitamente um grupo com o outro
  alternative: Tratá-los como o mesmo grupo ou explicar quem representam
  rationale: O fragmento não resolve a relação entre os dois grupos; explicá-la importaria uma interpretação alheia ao texto.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por «tu» coerente com as formas possessivas e verbais. A conjunção latina «enim» foi preservada por «pois». A vírgula final foi mantida porque a oração relativa continua no versículo seguinte.
