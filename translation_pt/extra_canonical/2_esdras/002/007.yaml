review_pass:
  verdict: revise
  source_fidelity: A primeira oração do texto principal, «Que a descendência deles cesse», não é sustentada pela redação latina fornecida, generatio eorum fiat, que, embora seja textualmente problemática no contexto imprecatório, significa em termos literais «que a descendência/geração deles venha a existir». A nota reconhece a dificuldade, mas o texto não deve resolver por conjectura uma lacuna ou corrupção não indicada no original-base. As demais orações correspondem bem ao latim.
  naturalness: «Sejam dispersos entre as nações; sejam seus nomes apagados da terra» é português atual, claro e de registro bíblico adequado. «Que a descendência deles venha a existir» é menos idiomático por refletir uma formulação latina estranha no contexto, mas é a maneira mais clara de preservar a leitura transmitida sem impor uma emenda; a nota explica a tensão.
  terminology: «Descendência», «nações», «apagados da terra», «desprezaram» e «aliança» são escolhas adequadas. «Aliança» traduz testamentum no sentido bíblico pertinente, sem carga denominacional indevida.
  issues:
  - severity: high
    issue: A tradução principal substitui o sentido expresso de generatio eorum fiat por «Que a descendência deles cesse».
    rationale: O latim-base não contém um verbo de cessação. O caráter de imprecação das frases seguintes pode sugerir corrupção, omissão ou uma dificuldade de transmissão, mas não autoriza que a tradução apresente uma reconstrução contextual como se fosse o texto.
  - severity: medium
    issue: A nota atual descreve corretamente a tensão, mas o texto principal já resolveu a dificuldade de modo conjectural.
    rationale: Em uma passagem de leitura disputada ou anômala, a tradução deve preservar a ambiguidade ou anomalia do texto-base e usar a nota para indicar a possível explicação contextual.
  revised_text: Que a descendência deles venha a existir[a]. Sejam dispersos entre as nações; sejam seus nomes apagados da terra, porque desprezaram a minha aliança.
  revised_footnotes:
  - marker: a
    text: O latim transmitido diz literalmente algo como “Que a geração deles venha a existir”. Essa formulação parece destoar das imprecações que seguem; o texto pode estar incompleto ou corrompido. Algumas traduções adotam, por causa do contexto, um sentido como “Que a descendência deles cesse”.
    reason: Preserva no texto a leitura do latim-base e informa com transparência a dificuldade textual e a interpretação contextual alternativa.
  revision_rationale: A revisão retira da tradução principal a emenda contextual não atestada no latim fornecido. Mantém-se a formulação literal, apesar de sua tensão contextual, e a nota apresenta de modo não dogmático a possível leitura imprecatória adotada na trilha inglesa.
