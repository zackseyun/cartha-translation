  yaml_path: translation/extra_canonical/2_esdras/002/007.yaml
  text: May their offspring cease. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.
translation:
  language: pt
  text: Que a descendência deles cesse[a]. Sejam dispersos entre as nações; sejam seus nomes apagados da terra, porque desprezaram a minha aliança.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim transmitido diz literalmente algo como “Que a geração deles venha a existir”. A tradução no texto segue o sentido imprecatório indicado pelo contexto; a redação latina pode estar incompleta ou corrompida.
    reason: Preservar transparência quanto à diferença entre a forma latina disponível e o sentido contextual adotado.
lexical_decisions:
- source_word: generatio eorum fiat
  choice: Que a descendência deles cesse
  rationale: “Generatio” pode designar geração, linhagem ou descendência. O sentido cessativo não está expresso de maneira clara no latim transmitido, mas é adotado no texto principal por corresponder ao caráter imprecatório da sequência e à leitura contextual preservada na camada inglesa auditada; a dificuldade textual é explicitada em nota.
- source_word: Dispergantur in gentes
  choice: Sejam dispersos entre as nações
  rationale: Mantém a forma passiva e o valor de desejo ou ordem do subjuntivo latino; “nações” é natural e não introduz a conotação pejorativa de “pagãos”.
- source_word: nomina eorum deleantur a terra
  choice: sejam seus nomes apagados da terra
  rationale: Reproduz a imagem de eliminação da memória ou presença deles, sem restringi-la a uma interpretação específica.
- source_word: spreuerunt testamentum meum
  choice: desprezaram a minha aliança
  rationale: “Desprezar” comunica adequadamente a rejeição desdenhosa de “spernere”; “aliança” é o equivalente bíblico corrente de “testamentum” neste contexto.
theological_decisions:
- issue: Sentido da primeira imprecação
  choice: Que a descendência deles cesse
  alternative: Que a geração deles venha a existir
  rationale: O latim fornecido, tomado isoladamente, parece dizer literalmente “que a geração deles venha a existir”, o que entra em tensão com a série de juízos do versículo. Em vez de ocultar o problema de transmissão ou resolver silenciosamente a tensão, o texto adota a leitura contextual e registra a forma literal em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. Os paralelismos e as formas passivas da imprecação foram preservados; evitou-se linguagem denominacional.
