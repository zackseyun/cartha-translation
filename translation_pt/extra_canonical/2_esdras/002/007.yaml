review_pass:
  verdict: revise
  source_fidelity: 'A primeira cláusula do rascunho (“Que a descendência deles cesse”) não é sustentada pelo latim fornecido: generatio eorum fiat significa, em sua forma transmitida, “que a descendência deles venha a existir/surja”. Embora a sequência seja imprecativa, não é seguro inserir “cesse” no texto sem apoio explícito no original. As demais cláusulas reproduzem bem o passivo jussivo e o sentido do latim.'
  naturalness: “Que surja a descendência deles” é português atual e claro, ainda que a justaposição com as maldições seguintes permaneça estranha; essa estranheza pertence ao texto latino transmitido e deve ser preservada com nota. “Sejam dispersos entre as nações” e “sejam seus nomes apagados da terra” são naturais e de registro bíblico sóbrio.
  terminology: “Descendência”, “nações”, “apagados” e “aliança” são escolhas adequadas. “Aliança” é o equivalente bíblico corrente de testamentum neste contexto, sem impor uma leitura confessional.
  issues:
  - severity: high
    issue: A tradução principal altera a primeira cláusula de afirmação/jussivo para uma imprecação cessativa.
    rationale: O verbo fiat, no texto latino apresentado, não contém negação nem verbo que signifique “cessar”. O contexto hostil não autoriza suprir essa ideia no texto principal; a dificuldade deve ser sinalizada em nota.
  - severity: medium
    issue: A nota afirma que o texto latino “pode estar incompleto ou corrompido”.
    rationale: Sem aparato crítico ou evidência textual fornecida, essa afirmação é especulativa. É mais fiel descrever a formulação transmitida e sua tensão com o contexto, sem diagnosticar corrupção.
  revised_text: Que surja a descendência deles[a]. Sejam dispersos entre as nações; sejam seus nomes apagados da terra, porque desprezaram a minha aliança.
  revised_footnotes:
  - marker: a
    text: 'O latim transmitido diz literalmente: “Que a descendência deles venha a existir” ou “surja”. A formulação contrasta com as imprecações que se seguem; a tradução preserva essa dificuldade textual sem acrescentar “cesse”, ideia não expressa no latim fornecido.'
    reason: Preservar a ambiguidade e a tensão da redação latina transmitida, sem introduzir uma resolução conjectural no texto principal.
  revision_rationale: A revisão restitui o sentido formal de generatio eorum fiat e substitui uma solução contextual não expressa pelo original por uma tradução que conserva a tensão do texto transmitido. As cláusulas restantes permanecem inalteradas por serem fiéis, naturais e terminologicamente adequadas.
