lexical_decisions:
- source_word: Mortuos ubi inueneris
  choice: Onde quer que encontrares mortos
  rationale: Reproduz o sentido distributivo de ubi com o futuro perfeito do subjuntivo inueneris, em formulação portuguesa clara e solene.
- source_word: signans
  choice: marca-os
  rationale: Mantém a ação concreta e deliberadamente não especificada de assinalar os mortos, sem explicar de que modo ou com que finalidade.
- source_word: commenda sepulchro
  choice: confia-os à sepultura
  rationale: Preserva a imagem e o tom de commenda, que sugere entregar ou confiar alguém à sepultura, em vez de reduzir a expressão simplesmente a 'sepulta-os'.
- source_word: et dabo
  choice: e eu darei
  rationale: Traduz literalmente a oração incompleta do texto fornecido e não antecipa o complemento presente no contexto seguinte.
