base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/012.yaml
  text: which I had prepared for them. The tree of life shall be for them as the fragrance of perfume[a], and they shall neither labor nor grow weary.
translation:
  language: pt
  text: que eu havia preparado para eles. A árvore da vida será para eles aroma de perfume[a], e eles não labutarão nem se cansarão.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aroma de unguento”.'
    reason: Registra o sentido mais concreto de unguenti, embora “perfume” seja mais natural e comunique melhor a referência ao aroma em português atual.
lexical_decisions:
- source_word: quae praeparaueram illis
  choice: que eu havia preparado para eles
  rationale: Mantém a oração relativa fragmentária e o mais-que-perfeito do latim, sem acrescentar um antecedente ausente do trecho fornecido.
- source_word: Lignum uitae
  choice: A árvore da vida
  rationale: Equivalente tradicional, claro e direto para a expressão latina.
- source_word: in odorem unguenti
  choice: aroma de perfume
  rationale: Expressa a construção predicativa do latim sem convertê-la explicitamente em comparação; “perfume” comunica em português atual o aroma agradável de unguentum neste contexto.
- source_word: laborabunt neque fatigabuntur
  choice: não labutarão nem se cansarão
  rationale: Distingue o esforço penoso de laborare do cansaço expresso por fatigari, em linguagem compreensível e digna.
theological_decisions:
- issue: Relação entre a árvore da vida e o aroma
  choice: será para eles aroma de perfume
  alternative: será para eles como aroma de perfume
  rationale: A construção latina in odorem apresenta resultado ou predicação, sem partícula comparativa explícita; a tradução preserva essa formulação em vez de impor um símile.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. Preserva-se o início fragmentário do versículo conforme a delimitação da fonte e usa-se “labutarão” para conservar a ideia de trabalho penoso.
