id: 2ES.2.13
reference: 2 Esdras 2:13
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Petite et accipietis, rogate uobis dies paucos ut minorentur; iam paratum est uobis regnum: uigilate.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/013.yaml
  text: Ask[13], and you will receive; pray that your few days may be shortened. The kingdom is already prepared for you[a]; keep watch.
translation:
  language: pt
  text: Peçam, e receberão; orem para que seus poucos dias sejam abreviados.[13][a] O Reino já está preparado para vocês; vigiem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '13'
    text: A frase sobre orar para que os “poucos dias” sejam abreviados é difícil no latim. Provavelmente se refere ao abreviamento da era presente ou da aflição atual, e não ao desejo de ter uma vida curta.
    reason: lexical_alternative
  - marker: a
    text: 'Outra tradução possível, embora menos provável: “orem para que seus dias sejam poucos e abreviados”.'
    reason: previous_rendering
lexical_decisions:
- source_word: Petite
  choice: Peçam
  rationale: Imperativo plural de petere, seguido da promessa de receber; a forma corrente preserva a relação direta entre pedir e receber.
- source_word: rogate
  choice: orem
  rationale: No contexto apocalíptico, rogate expressa uma súplica dirigida a Deus; “orem” distingue esta petição do “peçam” anterior sem alterar o sentido básico.
- source_word: dies paucos ut minorentur
  choice: para que seus poucos dias sejam abreviados
  rationale: 'Preserva a leitura gramatical mais provável do acusativo antecipado: “poucos dias” é o sujeito lógico de “sejam abreviados”, não dois predicados independentes.'
- source_word: iam paratum est uobis regnum
  choice: O Reino já está preparado para vocês
  rationale: Mantém iam como “já”, o estado resultante de paratum est e o dativo uobis como beneficiário.
- source_word: uigilate
  choice: vigiem
  rationale: Imperativo plural de vigilare, com o sentido escatológico de permanecer alerta.
theological_decisions:
- issue: Sentido de “poucos dias” e de seu abreviamento
  choice: Manter literalmente “seus poucos dias sejam abreviados”, explicando a dificuldade em nota
  alternative: Interpretar explicitamente como o abreviamento da era presente ou da aflição
  rationale: O latim provavelmente evoca um horizonte apocalíptico, mas não nomeia de modo explícito a era ou a aflição; a tradução conserva a tensão sem transformar a frase em desejo inequívoco de vida curta.
- issue: Temporalidade do Reino
  choice: “já está preparado”
  alternative: “está agora preparado”
  rationale: “Já” reproduz naturalmente iam e preserva a tensão entre a preparação presente do Reino e sua manifestação futura.
translation_notes:
  register: Português moderno, claro e digno, com formas plurais de ampla legibilidade brasileira. “Reino” recebe inicial maiúscula como referência escatológica específica, sem acrescentar uma identificação não expressa no texto.
