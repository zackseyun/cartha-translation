  text: 'memorare quid fecerim Sodomae et Gomorrae, Quorum terra iacet in picis glebis et aggeribus cinerum: sic dabo eos qui me non audierunt, dicit dominus omnipotens.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/009.yaml
  text: Remember what I did to Sodom and Gomorrah[a], whose land lies in clods of pitch and heaps of ashes. So I will give those who did not listen to me, says the Lord Almighty.
translation:
  language: pt
  text: Lembre-se do que fiz a Sodoma e Gomorra, cuja terra jaz entre torrões de betume e montes de cinzas. Assim farei com os que não me deram ouvidos[a], diz o Senhor Todo-Poderoso.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “Assim os darei”. Neste contexto, o verbo latino também pode ter o sentido de “farei” ou “tratarei”.
    reason: Preserva a forma incomum de dabo eos e informa a ambiguidade do latim sem impor no texto principal a ideia específica de abandono ou entrega.
lexical_decisions:
- source_word: memorare
  choice: Lembre-se
  rationale: Reproduz o imperativo singular latino em português corrente e digno, sem a tonalidade excessivamente arcaica de “lembra-te”.
- source_word: picis glebis
  choice: torrões de betume
  rationale: Mantém a imagem concreta de glebae (“torrões” ou “blocos”) e traduz pix pelo termo amplo e histórico “betume”.
- source_word: aggeribus cinerum
  choice: montes de cinzas
  rationale: Expressa naturalmente os amontoados ou elevações de cinza indicados por aggeribus.
- source_word: me non audierunt
  choice: não me deram ouvidos
  rationale: Comunica o sentido idiomático de ouvir com atenção e obedecer, sem reduzir a frase à mera percepção sonora.
- source_word: dominus omnipotens
  choice: Senhor Todo-Poderoso
  rationale: Equivalente português tradicional, claro e semanticamente direto do título latino.
theological_decisions:
- issue: Sentido de “sic dabo eos” no anúncio de juízo
  choice: Assim farei com os que
  alternative: Assim entregarei os que / Assim os darei
  rationale: No latim tardio deste escrito, dare pode funcionar com o sentido de fazer ou tratar. O contexto retoma diretamente “o que fiz” a Sodoma e Gomorra; a formulação escolhida torna esse paralelo claro, enquanto a nota conserva a forma literalmente possível e a ambiguidade lexical.
translation_notes:
  register: Português moderno, solene e amplamente compreensível, com boa legibilidade brasileira. A sintaxe preserva o encadeamento do latim e a imagem áspera da devastação, evitando arcaísmos desnecessários.
