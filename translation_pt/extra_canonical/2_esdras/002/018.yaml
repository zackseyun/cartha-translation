  text: I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,
translation:
  language: pt
  text: Eu enviarei a você, como ajuda, os meus servos Isaías e Jeremias. Segundo o conselho deles, santifiquei e preparei para você doze árvores carregadas de frutos variados,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mittam tibi adiutorium
  choice: Eu lhe enviarei como auxílio
  rationale: Reproduz a construção latina, na qual Isaías e Jeremias são enviados como ajuda, em português natural.
- source_word: pueros meos
  choice: os meus servos
  rationale: No contexto, puer pode designar servos ou ministros; “servos” evita a leitura inadequada de “meninos” e corresponde à função profética.
- source_word: ad quorum consilium
  choice: Segundo o conselho deles
  rationale: Preserva a referência explícita ao conselho de Isaías e Jeremias sem explicar além do que o latim afirma.
- source_word: sanctificaui et paraui
  choice: santifiquei e preparei
  rationale: Mantém os dois verbos e sua distinção, inclusive a dimensão sacra de sanctificaui.
- source_word: arbores xii grauatās uariis
  choice: doze árvores carregadas de frutos variados
  rationale: “Carregadas” expressa gravatas; “frutos” é exigido pelo sentido contextual e aparece na tradição textual da passagem, embora esteja elíptico no trecho latino fornecido.
theological_decisions:
- issue: Agência divina e conselho profético
  choice: Segundo o conselho deles, santifiquei e preparei
  alternative: Para o conselho deles, santifiquei e preparei
  rationale: A leitura instrumental ou normativa de ad quorum consilium é a mais natural neste contexto, mas não se amplia a frase para definir de que modo o conselho dos profetas participa da ação divina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento por “você” em conformidade com a legibilidade brasileira. A vírgula final foi preservada porque o versículo continua sintaticamente no seguinte.
