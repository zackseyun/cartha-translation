base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/040.yaml
  text: Receive your number[40], Zion, and gather in your white-robed ones[a], who have fulfilled the law of the Lord.
translation:
  language: pt
  text: Recebe o teu número, Sião, e reúne os teus trajados de branco[a], que cumpriram a lei do Senhor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo latino também pode ser traduzido literalmente por “os teus candidatos”; deriva de uma palavra associada ao branco brilhante e, aqui, indica pessoas trajadas de branco.
    reason: lexical_alternative
lexical_decisions:
- source_word: Recipe
  choice: Recebe
  rationale: Preserva o imperativo direto do latim e mantém a personificação de Sião.
- source_word: numerum tuum
  choice: o teu número
  rationale: Mantém a expressão deliberadamente incomum e a imagem de um grupo contado, sem substituir o sentido por uma paráfrase interpretativa como “os que são teus”.
- source_word: conclude
  choice: reúne
  rationale: No contexto, indica ajuntar e acolher o grupo pertencente a Sião; “encerra” seria literal, mas pouco natural e poderia sugerir aprisionamento.
- source_word: candidatos
  choice: os teus vestidos de branco
  rationale: Expressa a imagem central de pessoas trajadas de branco, ligada a candidus/candidatus, e evita o sentido político moderno de “candidatos”.
- source_word: qui legem [Domini impleverunt]
  choice: que cumpriram a lei do Senhor
  rationale: Segue a continuação textual refletida na tradição da passagem e na camada inglesa auditada; “cumpriram” comunica de modo natural a observância completa indicada pelo contexto.
theological_decisions:
- issue: Identidade dos vestidos de branco
  choice: Não identificar explicitamente o grupo como batizados, mártires ou outra classe específica.
  alternative: Traduzir ou explicar o termo como “recém-batizados” ou “mártires”.
  rationale: Embora essas associações sejam possíveis no latim cristão, o texto fornecido não determina uma delas; a imagem das vestes brancas deve permanecer aberta.
- issue: Sentido de “o teu número”
  choice: Conservar a formulação numérica.
  alternative: Parafrasear como “os que te pertencem” ou “o número completo dos teus”.
  rationale: A expressão pode evocar tanto uma quantidade determinada quanto o conjunto contado dos que pertencem a Sião; a tradução não deve eliminar essa tensão.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem vocativa foi mantida próxima do latim. A formulação incomum “o teu número” foi preservada para não apagar a imagem apocalíptica de um povo contado.
