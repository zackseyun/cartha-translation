  text: tuos usque dum uenio et praedica illis misericordiam, quoniam exuberant fontes mei, et gratia mea non deficiet. Ego Ezra accepi praeceptum a domino in monte Choreb,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/032.yaml
  text: Embrace your children until I come[a], and proclaim mercy to them, because my springs overflow and my grace will not fail.
translation:
  language: pt
  text: Abrace seus filhos até que eu venha; anuncie-lhes a misericórdia, pois minhas fontes transbordam, e minha graça não faltará.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuos
  choice: seus filhos
  rationale: O adjetivo possessivo substantivado aparece no trecho latino fornecido como continuação de uma expressão iniciada antes do recorte; o contexto textual preservado e a tradição da passagem identificam o referente como os filhos. A forma natural em português exige explicitar o substantivo.
- source_word: praedica illis misericordiam
  choice: anuncie-lhes a misericórdia
  rationale: Mantém o sentido de proclamar ou anunciar publicamente, sem transformar a misericórdia em ato já realizado nem introduzir vocabulário denominacional.
- source_word: fontes mei
  choice: minhas fontes
  rationale: Conserva a imagem concreta das fontes, em vez de substituí-la por uma abstração como abundância.
- source_word: exuberant
  choice: transbordam
  rationale: Expressa naturalmente a ideia de correr em abundância e além da capacidade, preservando o presente do latim.
- source_word: gratia mea non deficiet
  choice: minha graça não faltará
  rationale: Reproduz o futuro indicativo deficiet e comunica que a graça não se esgotará nem deixará de estar disponível.
theological_decisions:
- issue: Relação entre misericórdia e graça
  choice: 'Preservar os dois termos distintos: “misericórdia” e “graça”.'
  alternative: Uniformizar ambos como “misericórdia” ou “favor”.
  rationale: O latim distingue misericordiam de gratia; manter essa distinção evita reduzir a amplitude teológica do enunciado.
- issue: Tempo verbal da promessa sobre a graça
  choice: 'Futuro: “não faltará”.'
  alternative: 'Presente: “não falta”.'
  rationale: Deficiet é futuro do indicativo, enquanto exuberant está no presente; a mudança temporal parece intencional e deve ser preservada.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A coordenação e as imagens concretas do latim foram mantidas. A frase “Eu, Esdras, recebi uma ordem do Senhor no monte Horebe” foi excluída por pertencer ao início do versículo seguinte.
