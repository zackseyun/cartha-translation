  rationale: 'A revisão apenas torna inequívoca, mediante ponto e vírgula, a coordenação dos imperativos que está no latim: o destinatário deve abraçar seus filhos e anunciar-lhes a misericórdia, enquanto o locutor declara que virá. Não altera o sentido, as imagens nem os tempos verbais do texto-fonte.'
