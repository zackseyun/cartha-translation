review_pass:
  verdict: revise
  source_fidelity: 'A tradução preserva corretamente os elementos centrais: os filhos, a vinda do locutor, a proclamação da misericórdia, as fontes que transbordam e a promessa futura de que a graça não faltará. Contudo, o imperativo latino singular "praedica" deve permanecer claramente dirigido ao destinatário, não poder ser lido como ação do locutor.'
  naturalness: O português é moderno e natural. Porém, sem uma separação mais forte, "até que eu venha e anuncie-lhes" pode ser entendido como "até que eu venha e [eu] anuncie-lhes", apesar de "anuncie" dever ser imperativo dirigido à pessoa interpelada. O ponto e vírgula elimina essa ambiguidade de escopo.
  terminology: '"Misericórdia" e "graça" traduzem adequadamente os termos distintos misericordiam e gratia. "Não faltará" reproduz de modo natural o futuro latino non deficiet; "fontes" e "transbordam" preservam a imagem e o presente de exuberant.'
  issues:
  - severity: medium
    issue: Ambiguidade sintática quanto a "anuncie-lhes".
    rationale: Em latim, praedica é imperativo singular, coordenado com o imperativo anterior, ao passo que venio tem o locutor como sujeito. Na redação corrente, a sequência após "até que" pode fazer "anuncie-lhes" parecer coordenado a "eu venha". Uma pausa forte explicita que se trata de uma segunda ordem ao destinatário.
  revised_text: Abrace seus filhos até que eu venha; anuncie-lhes a misericórdia, pois minhas fontes transbordam, e minha graça não faltará.
