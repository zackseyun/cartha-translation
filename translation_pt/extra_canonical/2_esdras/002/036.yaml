base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/036.yaml
  text: Flee the shadow of this age; receive the gladness of your glory[a]. I openly call my Savior to witness.
translation:
  language: pt
  text: Fujam da sombra desta era; recebam a alegria da glória de vocês. Invoco abertamente o meu Salvador como testemunha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de modo menos provável: “Dou testemunho abertamente do meu Salvador”.'
    reason: Registra a possível leitura não técnica de testor, ao mesmo tempo que mantém no texto principal o valor idiomático mais bem sustentado pelo acusativo pessoal.
lexical_decisions:
- source_word: Fugite
  choice: Fujam
  rationale: Imperativo plural direto, preservando a exortação do latim.
- source_word: umbram saeculi huius
  choice: a sombra desta era
  rationale: Mantém a metáfora de umbra e traduz saeculum no sentido temporal de 'era', sem explicá-la indevidamente.
- source_word: iucunditatem gloriae vestrae
  choice: a alegria da glória de vocês
  rationale: Reproduz a relação genitiva do latim de modo claro e natural, sem decidir se a glória é presente ou futura.
- source_word: ego testor palam saluatorem meum
  choice: Invoco abertamente o meu Salvador como testemunha
  rationale: Testor com acusativo pessoal significa idiomaticamente chamar ou invocar alguém como testemunha; a formulação evita o sentido diferente de dar testemunho a respeito do Salvador.
theological_decisions:
- issue: Função do Salvador na declaração solene
  choice: O Salvador é invocado como testemunha
  alternative: Dou testemunho abertamente do meu Salvador
  rationale: A construção latina testor + acusativo pessoal favorece claramente a invocação de alguém como testemunha, embora uma leitura menos técnica possa ser percebida como testemunho acerca dele.
translation_notes:
  register: Português atual, digno e acessível, com 'vocês' para o plural de segunda pessoa e paralelismo exortativo preservado. O marcador da nota foi colocado junto à oração a que se refere.
