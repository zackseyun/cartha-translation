  yaml_path: translation/extra_canonical/2_esdras/002/044.yaml
  text: Then I asked the angel and said, “Who are these, lord?”
translation:
  language: pt
  text: 'Então perguntei ao anjo: “Quem são estes, senhor?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tunc
  choice: Então
  rationale: Mantém a progressão narrativa temporal do latim.
- source_word: interrogaui angelum et dixi
  choice: perguntei ao anjo
  rationale: Em português natural, o verbo de pergunta já incorpora a ideia de falar; reproduzir literalmente “perguntei... e disse” seria redundante sem acrescentar conteúdo.
- source_word: qui sunt hi
  choice: Quem são estes
  rationale: Representa diretamente a pergunta sobre a identidade do grupo indicado.
- source_word: domine
  choice: senhor
  rationale: Preserva a forma de tratamento no vocativo sem acrescentar o possessivo “meu”, ausente do texto latino.
theological_decisions:
- issue: Referente e valor do vocativo domine
  choice: senhor, em minúscula
  alternative: Senhor; meu senhor
  rationale: O contexto imediato identifica o interlocutor como o anjo. A minúscula evita transformar indevidamente o tratamento cortês em título divino, e a ausência de “meu” segue o latim.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A construção redundante do latim “interroguei... e disse” foi vertida pela forma idiomática “perguntei”, sem perda semântica.
