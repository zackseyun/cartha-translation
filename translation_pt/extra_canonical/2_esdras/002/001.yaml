source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/001.yaml
  text: 'Thus says the Lord: I brought this people out of slavery[a], and I gave them commandments through my slaves the prophets, whom they were unwilling to hear, but they made my counsels void.'
translation:
  language: pt
  text: 'Assim diz o Senhor: Eu tirei este povo da escravidão e lhe dei mandamentos por meio dos meus escravos, os profetas, a quem não quiseram ouvir; mas tornaram sem efeito os meus conselhos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eduxi ... de seruitute
  choice: tirei ... da escravidão
  rationale: Expressa naturalmente em português a libertação para fora de uma condição de servidão, preservando a força do latim.
- source_word: pueros meos prophetas
  choice: meus servos, os profetas
  rationale: Neste contexto, pueros designa agentes subordinados a Deus, não crianças; «servos» é a equivalência contextual adequada, e a aposição identifica-os como profetas.
- source_word: irrita fecerunt
  choice: tornaram sem efeito
  rationale: Conserva o sentido de invalidar ou frustrar, sem sugerir apenas irritação emocional, falso cognato possível em português.
- source_word: consilia
  choice: conselhos
  rationale: Mantém a amplitude do termo latino, que pode abranger conselhos, propósitos ou planos, sem resolver indevidamente essa nuance.
theological_decisions:
- issue: Objeto da recusa em ouvir
  choice: «a quem não quiseram ouvir», referindo-se aos profetas
  alternative: «não quiseram ouvir» sem objeto expresso
  rationale: O relativo latino quos retoma explicitamente «meus servos, os profetas» como objeto de audire; a tradução preserva essa rejeição direta dos mensageiros.
- issue: Relação entre a recusa e a anulação dos conselhos
  choice: manter a oposição com «mas»
  alternative: ligar as duas ações apenas por coordenação neutra
  rationale: O latim sed contrasta a recusa em ouvir com a ação subsequente de tornar sem efeito os conselhos divinos.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla inteligibilidade internacional. A estrutura do latim foi preservada sem sacrificar a fluência. A antiga nota inglesa não foi mantida porque registra uma formulação anterior corrigida, não uma variante ou ambiguidade real da fonte.
