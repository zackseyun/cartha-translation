    rationale: Embora «servos» possa funcionar em registro religioso, pueri neste contexto designa os subordinados do Senhor e o audit trail inglês estabeleceu expressamente «slaves» para não suavizar esse termo. «Meus escravos, os profetas» preserva essa força e a ligação com «escravidão» no mesmo versículo.
