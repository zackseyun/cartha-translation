  verdict: revise
  source_fidelity: A tradução reproduz adequadamente a retirada da escravidão, a entrega dos mandamentos por intermédio dos profetas, a recusa explícita de ouvi-los e a subsequente invalidação dos conselhos divinos. Contudo, «pueros meos» deve ser vertido aqui por «meus escravos», em consonância com o sentido de pessoas pertencentes/subordinadas ao Senhor e com o audit trail inglês, que preserva deliberadamente «slaves» neste termo.
  naturalness: A redação é clara, moderna e adequada ao português internacional. «A quem não quiseram ouvir» preserva corretamente o objeto pessoal expresso pelo relativo latino quos; «tornaram sem efeito» comunica bem irrita fecerunt.
  terminology: «Escravidão» e «escravos» mantêm a relação lexical e social expressa no latim (seruitute; pueros) sem atenuar o segundo termo para «servos». «Mandamentos», «profetas» e «conselhos» são escolhas adequadas; «conselhos» preserva a amplitude de consilia.
  issues:
