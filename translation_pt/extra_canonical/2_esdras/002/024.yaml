  terminology: «Descanso» conserva adequadamente a abertura semântica de requies. «Cuidadora», apoiado pela nota que registra «ama» e «nutriz», comunica a função de nutrix sem impor uma identificação familiar ou eclesiológica. A tradução mantém a imagem concreta de confirma pedes eorum.
