  source_fidelity: 'O texto traduz fielmente os elementos do latim: «populus meus» por «Meu povo», «quia ueniet requies tua» por «pois o seu descanso virá», e a exortação dirigida à nutrix. A continuação «alimente seus filhos e fortaleça os pés deles» corresponde à continuação atestada no rastro inglês («nutri filios tuos et confirma pedes eorum»), sem alegorizar a imagem dos pés.'
