  text: populus meus, quia ueniet requies tua. Nutrix bona, nutri
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/024.yaml
  text: My people, for your rest will come. Good nurse, nourish your children, and strengthen their feet.
translation:
  language: pt
  text: Meu povo, pois o seu descanso virá. Boa cuidadora[a], alimente seus filhos e fortaleça os pés deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Boa ama” ou “Boa nutriz”.'
    reason: O latim nutrix designa uma mulher que alimenta e cuida de crianças, podendo referir-se a uma ama, nutriz ou cuidadora.
lexical_decisions:
- source_word: requies
  choice: descanso
  rationale: Preserva o sentido direto de repouso ou alívio prometido, sem especificar indevidamente se é temporal, escatológico ou espiritual.
- source_word: nutrix
  choice: cuidadora
  rationale: Expressa em português atual a mulher que nutre e cuida de crianças. O termo latino pode indicar uma ama ou nutriz; a nota registra essa nuance sem recorrer no texto principal a um vocábulo pouco comum.
- source_word: nutri
  choice: alimente
  rationale: Traduz de modo natural o ato concreto de nutrir, mantendo a imagem materna ou cuidadora.
- source_word: confirma pedes eorum
  choice: fortaleça os pés deles
  rationale: Conserva a imagem corporal do texto, sem interpretá-la como mera firmeza moral ou espiritual.
theological_decisions:
- issue: Natureza do descanso prometido
  choice: descanso
  alternative: repouso definitivo
  rationale: O latim não define a natureza nem o momento desse descanso; a tradução preserva essa abertura.
- issue: Identidade da figura feminina chamada nutrix
  choice: Boa cuidadora
  alternative: Boa mãe
  rationale: Evita identificá-la explicitamente como mãe quando o termo latino descreve sua função de nutrir e cuidar, não necessariamente uma relação biológica.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção acessível ao público brasileiro. O possessivo singular em “seu descanso” acompanha o tratamento coletivo de “meu povo”. A continuação “seus filhos... pés deles”, atestada na camada inglesa auditada, foi mantida; o trecho latino fornecido na solicitação termina materialmente em “nutri”.
