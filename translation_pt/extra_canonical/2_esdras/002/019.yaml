  text: and as many springs flowing with milk and honey[a], and seven mighty mountains having roses and lilies, in which I will fill your children with joy.
translation:
  language: pt
  text: e outras tantas fontes de onde correm leite e mel, e sete montanhas imensas com rosas e lírios[a], nas quais encherei [seus filhos][b] de alegria.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tendo rosa e lírio”; os singulares têm sentido coletivo.
    reason: Registra a forma mais literal do latim e explica o plural idiomático na tradução.
  - marker: b
    text: O trecho latino fornecido não explicita o objeto de “encherei”; “seus filhos” é suprido pelo contexto e indicado por colchetes.
    reason: Distingue claramente a suplementação contextual das palavras atestadas no trecho latino.
lexical_decisions:
- source_word: totidem fontes
  choice: outras tantas fontes
  rationale: Preserva a ideia de um número correspondente ao mencionado no contexto anterior, com expressão natural em português.
- source_word: fluentes lac et mel
  choice: que correm leite e mel
  rationale: Reproduz a imagem concreta de fontes das quais fluem leite e mel.
- source_word: montes inmensos septem
  choice: sete montanhas imensas
  rationale: Mantém o número e a grandeza expressa por inmensos em ordem natural no português.
- source_word: habentes rosam et lilium
  choice: cobertas de rosas e lírios
  rationale: O latim emprega os singulares coletivos rosam e lilium; o plural transmite naturalmente a abundância floral, e 'cobertas de' expressa de modo idiomático habentes neste cenário.
- source_word: in quibus gaudio replebo
  choice: nas quais encherei seus filhos de alegria
  rationale: Mantém in quibus como referência locativa às montanhas. O objeto 'seus filhos', não expresso no trecho latino fornecido, é suprido conforme o contexto preservado na tradição de consulta e devidamente assinalado em nota.
