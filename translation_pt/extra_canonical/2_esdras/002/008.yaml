lexical_decisions:
- source_word: Vae tibi
  choice: Ai de ti
  rationale: Expressão portuguesa corrente e solene que preserva a fórmula de ameaça e lamento do latim.
- source_word: Assur
  choice: Assíria
  rationale: O nome latino designa aqui a Assíria personificada, tratada diretamente na segunda pessoa.
- source_word: iniquos
  choice: os injustos
  rationale: Mantém a referência substantivada a pessoas caracterizadas pela injustiça, sem restringi-la a um tipo específico de malfeitor.
- source_word: penes te
  choice: junto de ti
  rationale: Reproduz de modo natural a ideia de pessoas mantidas consigo ou em seu âmbito, preservando a amplitude da expressão latina.
- source_word: gens mala
  choice: Ó nação má
  rationale: Mantém o vocativo enfático e a ligação sintática aberta com o versículo seguinte.
