source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et in medio eorum erat iuuenis statura celsus, eminentior omnibus illis, et singulis eorum capitibus inponebat coronas, et magis exaltabatur: ego autem miracul[o] tenebar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/043.yaml
  text: And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the heads of each one of them, and he was more exalted still; and I was held in wonder.
translation:
  language: pt
  text: E no meio deles estava um jovem de elevada estatura, mais alto que todos os outros. Ele colocava coroas na cabeça de cada um deles e era ainda mais exaltado. E eu fiquei tomado de admiração.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuuenis
  choice: jovem
  rationale: Reproduz diretamente o substantivo latino sem especificar além do que o texto permite.
- source_word: statura celsus
  choice: de elevada estatura
  rationale: Preserva o tom digno e a referência explícita à grande altura.
- source_word: eminentior omnibus illis
  choice: mais alto que todos os outros
  rationale: No contexto de estatura, expressa naturalmente o comparativo físico sem excluir a possível conotação de proeminência.
- source_word: singulis eorum capitibus inponebat coronas
  choice: colocava coroas na cabeça de cada um deles
  rationale: Formulação idiomática em português que mantém a distribuição individual indicada por singulis, embora capitibus seja plural em latim.
- source_word: magis exaltabatur
  choice: era ainda mais exaltado
  rationale: Mantém a voz passiva e a relativa abertura semântica de exaltabatur, sem decidir se se trata de altura, honra ou glorificação.
- source_word: miraculo tenebar
  choice: fiquei tomado de admiração
  rationale: Comunica de modo natural o estado de assombro maravilhado expresso pelo latim.
theological_decisions:
- issue: Sentido de magis exaltabatur
  choice: era ainda mais exaltado
  alternative: erguia-se ainda mais alto
  rationale: A tradução escolhida preserva a ambiguidade entre elevação visível e exaltação honorífica, evitando impor uma interpretação exclusivamente física ou teológica.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A divisão em três frases evita um período excessivamente longo, sem alterar a progressão da visão.
