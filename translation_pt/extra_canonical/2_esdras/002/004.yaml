source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/004.yaml
  text: because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask the Lord.
translation:
  language: pt
  text: porque vocês pecaram diante do Senhor Deus e fizeram diante de mim o que é mau. Agora, porém, o que farei por vocês? Pois sou viúva e estou abandonada. Vão, meus filhos, e peçam ao Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram domino deo
  choice: diante do Senhor Deus
  rationale: Preserva de modo natural a ideia de agir na presença de Deus e mantém o título divino completo.
- source_word: quod malum est
  choice: o que é mau
  rationale: Reproduz a formulação substantivada do latim sem limitar o sentido a uma ação específica.
- source_word: quid faciam uobis?
  choice: o que farei por vocês?
  rationale: Neste contexto, o dativo uobis indica benefício ou interesse; a formulação portuguesa é natural e preserva a pergunta desolada da voz feminina.
- source_word: uidua sum et derelicta
  choice: sou viúva e estou abandonada
  rationale: Mantém os dois predicados e torna explícito em português o estado continuado expresso por derelicta.
- source_word: ite, filii
  choice: Vão, meus filhos
  rationale: Usa o imperativo corrente no português brasileiro e traduz filii conforme a relação expressa pela voz feminina; o possessivo é natural no vocativo português.
- source_word: petite a domino
  choice: peçam ao Senhor
  rationale: Traduz literalmente o pedido dirigido ao Senhor sem acrescentar um objeto como 'misericórdia', ausente do texto latino.
theological_decisions:
- issue: Objeto não expresso de petite
  choice: peçam ao Senhor
  alternative: peçam misericórdia ao Senhor
  rationale: O latim não declara o que deve ser pedido. A tradução conserva essa abertura e evita introduzir uma interpretação teológica específica.
- issue: Identidade da voz feminina
  choice: mantida sem identificação explicativa
  alternative: explicitar a voz como Sião, Jerusalém ou uma mãe personificada
  rationale: O versículo apresenta apenas a autodescrição como viúva e abandonada; a tradução não resolve no próprio texto uma identificação dependente do contexto.
translation_notes:
  register: Português moderno, digno e amplamente inteligível, com legibilidade brasileira. Emprega 'vocês' e o imperativo 'vão', evitando tanto arcaísmos quanto paráfrase explicativa. A repetição de 'diante' acompanha a estrutura latina e reforça a dimensão relacional das duas acusações.
