  text: Mother, with your children, because I will deliver you, says the Lord.
translation:
  language: pt
  text: Mãe, com teus filhos, pois eu te livrarei, diz o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mater
  choice: Mãe
  rationale: Vocativo direto, preservado sem acrescentar um verbo ausente no texto latino.
- source_word: cum filiis tuis
  choice: com seus filhos
  rationale: Correspondência natural e direta; no contexto do vocativo, «seus» se refere à mãe.
- source_word: eripiam
  choice: livrarei
  rationale: Expressa resgate ou libertação de perigo sem especificar uma ameaça que o texto não nomeia.
- source_word: dicit dominus
  choice: diz o Senhor
  rationale: Fórmula declarativa simples e fiel ao latim.
theological_decisions:
- issue: Ausência de verbo imperativo após «Mãe»
  choice: 'Preservar a formulação elíptica: «Mãe, com seus filhos»'
  alternative: Acrescentar «alegre-se» ou outro imperativo
  rationale: O latim fornecido não contém um verbo correspondente; acrescentá-lo resolveria indevidamente a elipse e alteraria o texto.
- issue: Referente e gênero do objeto de «eripiam»
  choice: «eu a livrarei»
  alternative: «eu livrarei vocês»
  rationale: O pronome latino «te» é singular e se dirige à mãe; a tradução conserva esse foco gramatical, sem estender explicitamente o objeto aos filhos.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A estranheza sintática inicial foi mantida porque corresponde à formulação elíptica do texto latino, sem importar «Alegre-se» da versão anterior.
