source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Mater, complectere filios tuos, educa illos cum laetitia sicut columba, confirma pedes eorum, quoniam te elegi, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/015.yaml
  text: Mother, embrace your children; bring them up with gladness like a dove; strengthen their feet, for I have chosen you, says the Lord.
translation:
  language: pt
  text: Mãe, abrace seus filhos; crie-os com alegria, como uma pomba; firme os pés deles, pois eu escolhi você, diz o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: complectere
  choice: abrace
  rationale: Transmite de modo natural o imperativo latino de acolher nos braços ou estreitar com afeto.
- source_word: educa
  choice: crie-os
  rationale: No contexto materno, expressa cuidar da formação e do crescimento dos filhos, sem limitar o sentido à instrução escolar.
- source_word: cum laetitia
  choice: com alegria
  rationale: Equivalência direta e corrente para a expressão latina.
- source_word: confirma pedes eorum
  choice: firme os pés deles
  rationale: Preserva a imagem corporal do latim e seu possível sentido figurado de dar estabilidade ou força.
- source_word: elegi
  choice: escolhi
  rationale: Representa diretamente o verbo latino, mantendo a escolha divina como fundamento da exortação.
theological_decisions:
- issue: Identidade e função de “Mãe”
  choice: Manter o vocativo “Mãe” sem explicação no texto
  alternative: Identificar a mãe como Sião, Jerusalém ou outra figura coletiva
  rationale: O versículo dirige-se simplesmente a “Mater”; explicitar uma identificação resolveria uma referência que este trecho isolado deixa implícita.
- issue: Referente da comparação “como uma pomba”
  choice: Conservar a comparação após “com alegria”, sem reformulação interpretativa
  alternative: Explicitar se a mãe cria os filhos como uma pomba ou se a alegria é comparável à de uma pomba
  rationale: A sintaxe latina admite alguma tensão quanto ao vínculo exato de “sicut columba”; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas de tratamento naturais para leitores brasileiros. A imagem “firme os pés deles” foi mantida apesar de não ser uma expressão cotidiana, por seu valor poético e possível alcance figurado.
