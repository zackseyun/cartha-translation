translation:
  language: pt
  text: para que os entregues à vergonha e a mãe deles à pilhagem, para que não
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: des eis confusionem
  choice: os entregues à vergonha
  rationale: O latim expressa literalmente dar-lhes vergonha; em português, «entregar à vergonha» comunica com naturalidade a ideia de sujeição a uma condição de desonra, sem acrescentar um agente.
- source_word: matrem eorum
  choice: a mãe deles
  rationale: Tradução direta, preservando a referência materna e sem identificar além do que o fragmento declara.
- source_word: in direptionem
  choice: à pilhagem
  rationale: «Pilhagem» representa a ação de saquear ou espoliar indicada por direptio e mantém o paralelismo com «à vergonha».
- source_word: ne
  choice: para que
  rationale: Neste fragmento incompleto, ne introduz uma oração final negativa cujo conteúdo continua no versículo seguinte; «para que» preserva a ligação sintática, deixando a negação para o termo subsequente que ela rege.
theological_decisions:
- issue: Identidade da «mãe deles»
  choice: Manter «a mãe deles» sem explicação interpretativa
  alternative: Identificá-la como cidade, nação ou comunidade
  rationale: O fragmento latino não explicita o referente; identificá-lo resolveria indevidamente uma ambiguidade contextual.
- issue: Força de ne no fim do fragmento
  choice: Traduzir a ligação final como «para que» e deixar a oração aberta
  alternative: Antecipar «para que não» neste versículo
  rationale: Embora ne costume introduzir finalidade negativa, a negação incide sobre a continuação ainda não fornecida. Não se deve formular uma oração portuguesa truncada em «para que não» sem seu complemento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com leitura natural no Brasil. A redação conserva a estrutura fragmentária e a continuidade sintática com o versículo seguinte.
