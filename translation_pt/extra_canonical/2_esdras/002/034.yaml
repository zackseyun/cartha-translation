source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/034.yaml
  text: 'Therefore I say to you[a], Gentiles who hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom,'
translation:
  language: pt
  text: 'Portanto, digo a vocês, gentios[a] que ouvem e entendem: esperem pelo seu pastor; ele dará a vocês o descanso eterno, pois está próximo aquele que virá no fim da era. Estejam preparados para as recompensas do Reino,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “nações que ouvem e entendem”.
    reason: Registra o sentido lexical mais amplo possível de gentes, embora o contexto favoreça “gentios”.
lexical_decisions:
- source_word: gentes (refletido pela tradição textual e pelo contexto imediato)
  choice: gentios
  rationale: No contexto cristão latino, em contraste com Israel no versículo anterior, o termo designa especificamente os não judeus; “gentios” preserva essa oposição melhor que o sentido genérico de “nações”.
- source_word: expectate
  choice: esperem por
  rationale: Expressa de modo natural a ideia de aguardar a chegada ou atuação do pastor.
- source_word: requiem aeternitatis
  choice: o descanso eterno
  rationale: Equivalência portuguesa natural para o descanso próprio da eternidade, sem ampliar a afirmação.
- source_word: in finem saeculi
  choice: no fim desta era
  rationale: “Era” preserva o sentido temporal e escatológico de saeculum sem confundi-lo necessariamente com o fim do mundo físico.
- source_word: praemia regni
  choice: as recompensas do Reino
  rationale: Mantém o plural praemia e o genitivo regni, usando a forma corrente e dignificada “Reino” neste contexto teológico.
theological_decisions:
- issue: Identidade dos destinatários em contraste com Israel
  choice: gentios
  alternative: nações
  rationale: O contexto imediato e o uso cristão de gentes favorecem a referência aos não judeus; a alternativa lexical é preservada em nota.
- issue: Sentido escatológico de saeculum
  choice: fim desta era
  alternative: fim do mundo
  rationale: “Desta era” conserva a amplitude do latim e evita decidir que a expressão se refere especificamente à destruição do mundo físico.
translation_notes:
  register: Português moderno, claro e digno, com formas brasileiras amplamente compreensíveis. O imperativo plural latino foi vertido por construções naturais com “vocês”; o travessão preserva a aposição enfática referente àquele que virá.
