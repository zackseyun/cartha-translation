source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: alii plorabunt et tristes erunt, tu autem hilaris et copiosa eris. Zelabunt gentes et nihil aduersus te poterunt, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/027.yaml
  text: Others will weep and be sorrowful[a], but you will be cheerful and abundant. The nations will be jealous, and they will be able to do nothing against you, says the Lord.
translation:
  language: pt
  text: Outros chorarão e ficarão tristes, mas você estará alegre e terá abundância. As nações terão ciúmes de você, e nada poderão fazer contra você, diz o Senhor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: alii
  choice: Outros
  rationale: Mantém o contraste explícito com a destinatária singular representada por “você”.
- source_word: hilaris
  choice: alegre
  rationale: Expressa de forma natural o estado positivo que se opõe ao choro e à tristeza.
- source_word: copiosa
  choice: terá abundância
  rationale: O adjetivo latino feminino concorda com a destinatária e denota condição abundante; a formulação verbal soa natural em português sem especificar indevidamente o objeto da abundância.
- source_word: Zelabunt
  choice: terão ciúmes de você
  rationale: No contexto, o verbo indica inveja ou ciúme dirigido contra a destinatária; explicitar o complemento recupera a relação subentendida em latim.
- source_word: nihil aduersus te poterunt
  choice: nada poderão fazer contra você
  rationale: Traduz a expressão idiomática latina de incapacidade para agir contra a destinatária, sem acrescentar um tipo específico de ação.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. O tratamento por “você” preserva a referência singular de “tu/te”; não se explicita a identidade feminina da destinatária além do que o contexto literário fornecer.
