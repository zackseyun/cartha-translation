  text: Et sumam mihi gloriam illorum et dabo eis tabernacula aeterna,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/011.yaml
  text: And I will take for myself their glory[a], and I will give them everlasting tabernacles[b],
translation:
  language: pt
  text: E tomarei para mim a glória deles[a] e lhes darei moradas eternas[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo “deles” pode referir-se a um grupo diferente das pessoas a quem serão dadas as moradas.
    reason: O latim distingue illorum de eis, o que pode sinalizar referentes diferentes.
  - marker: b
    text: 'Ou: “tendas eternas”.'
    reason: Tabernacula pode designar tendas ou, de modo mais amplo, moradas.
lexical_decisions:
- source_word: sumam mihi
  choice: tomarei para mim
  rationale: Reproduz de modo natural tanto a ação de tomar quanto o interesse reflexivo expresso por mihi.
- source_word: gloriam illorum
  choice: a glória deles
  rationale: Mantém o sentido possessivo e a referência anafórica de illorum sem introduzir no texto principal uma identificação não explicitada neste versículo.
- source_word: tabernacula aeterna
  choice: moradas eternas
  rationale: Expressa em português corrente o sentido de habitações permanentes, preservando a possibilidade imagética de 'tendas' em nota.
theological_decisions:
- issue: Relação entre illorum ('deles') e eis ('lhes')
  choice: Manter formas pronominais distintas e registrar a possível diferença de referentes em nota
  alternative: Explicitar no texto 'a glória daqueles outros'
  rationale: O latim pode contrastar dois grupos, mas o versículo isolado não identifica de modo inequívoco os referentes; explicitar 'aqueles outros' resolveria uma ambiguidade real.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do latim. A vírgula final foi mantida porque a frase continua no versículo seguinte segundo a segmentação da fonte.
