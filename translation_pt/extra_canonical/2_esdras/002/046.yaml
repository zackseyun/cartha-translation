source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi ad angelum: ille iuuenis quis est, qui eis coronas inponit et palmas in manus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/046.yaml
  text: And I said to the angel[a], “Who is that young man who places crowns on them and palms in their hands?”
translation:
  language: pt
  text: 'E eu disse ao anjo[a]: “Quem é aquele jovem que coloca coroas sobre eles e ramos de palmeira nas mãos deles?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Então eu disse”.'
    reason: Registra a tradução alternativa tradicional, embora o latim apresente a conjunção simples Et, traduzida no texto principal por “E”.
lexical_decisions:
- source_word: Et
  choice: E
  rationale: Preserva a conjunção coordenativa simples do latim, sem transformá-la no advérbio temporal “então”.
- source_word: iuuenis
  choice: jovem
  rationale: Expressa de modo natural a referência a um homem jovem, sem acrescentar uma identificação não presente no texto.
- source_word: coronas inponit
  choice: coloca coroas sobre eles
  rationale: Transmite o ato de pôr as coroas sobre as pessoas; “sobre eles” evita acrescentar explicitamente “na cabeça”, ausente no latim.
- source_word: palmas
  choice: ramos de palmeira
  rationale: Torna claro o sentido concreto de folhas ou ramos de palmeira e evita a ambiguidade moderna de “palmas” como aplausos ou partes das mãos.
- source_word: in manus
  choice: nas mãos deles
  rationale: Reproduz diretamente a localização indicada pelo latim em português natural.
theological_decisions:
- issue: Identidade do jovem
  choice: Mantida apenas a designação “aquele jovem”
  alternative: Identificá-lo como Cristo, o Filho de Deus ou outra figura específica
  rationale: O versículo formula uma pergunta e não identifica ainda a personagem; antecipar uma identificação resolveria indevidamente a progressão do texto.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira. A construção preserva a coordenação do latim e evita explicitar elementos não declarados, como “na cabeça”.
