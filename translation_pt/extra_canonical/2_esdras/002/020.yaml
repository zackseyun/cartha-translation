base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/020.yaml
  text: Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked, care for the broken and the weak, the lame
translation:
  language: pt
  text: Defende o direito da viúva, faze justiça ao órfão, dá ao necessitado, protege quem não tem pai, veste quem está nu e cuida do ferido, do fraco e daquele que não pode andar...[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino disponível para este versículo termina em claudum (“aquele que não pode andar”), deixando a construção incompleta; a continuação pertence ao trecho seguinte.
    reason: Sinalizar com transparência a frase truncada na fonte e evitar completá-la por conjectura.
lexical_decisions:
- source_word: Viduam iustifica
  choice: Defende o direito da viúva
  rationale: O latim pede que se faça justiça à viúva ou que sua causa seja vindicada; esta formulação comunica o sentido jurídico e protetor em português natural.
- source_word: pupillo iudica
  choice: faze justiça ao órfão
  rationale: A expressão significa julgar em favor do órfão ou tratar justamente sua causa, não julgá-lo como acusado.
- source_word: egenti da
  choice: dá ao necessitado
  rationale: Tradução direta e corrente de egens, a pessoa que passa necessidade.
- source_word: orfanum tuere
  choice: protege quem não tem pai
  rationale: Distingue orfanum de pupillus no paralelismo e expressa o sentido antigo específico de pessoa privada de proteção paterna.
- source_word: Confractum
  choice: ferido
  rationale: Confractus pode indicar alguém quebrantado, alquebrado ou fisicamente lesionado; 'ferido' é claro sem restringir indevidamente a causa.
- source_word: debilem
  choice: fraco
  rationale: Preserva o sentido amplo de debilidade, sem impor uma condição médica específica.
- source_word: claudum
  choice: quanto ao que não pode andar...
  rationale: Claudus designa quem tem dificuldade ou incapacidade para andar. A formulação evita um termo potencialmente pejorativo e mantém a frase suspensa, como no fragmento latino fornecido.
theological_decisions:
- issue: Relação entre justiça e cuidado dos vulneráveis
  choice: Manter uma série de imperativos concretos sem acrescentar motivação teológica
  alternative: Explicitar que tais atos constituem dever religioso ou caridade
  rationale: O texto latino ordena as ações, mas neste trecho não declara sua fundamentação; acrescentá-la resolveria além da evidência disponível.
translation_notes:
  register: Português moderno, digno e acessível, com imperativos na forma tradicional coerente ('faze', 'dá', 'protege', 'veste', 'cuida'). A tradução evita linguagem técnica e preserva a interrupção material da fonte.
