  source_fidelity: A série de imperativos é vertida com boa fidelidade, e é correto não completar conjecturalmente o acusativo final claudum, pois o fragmento latino fornecido termina aí. Contudo, «quanto ao que não pode andar» introduz uma mudança de tópico ausente do latim e deixa de apresentar claudum como mais um objeto de cura.
  naturalness: O registro imperativo é natural e coerente. A coordenação direta de «daquele que não pode andar» com os objetos precedentes é mais fluente e reproduz melhor a sintaxe interrompida da fonte.
  terminology: «Defende o direito da viúva», «faze justiça ao órfão», «necessitado», «quem não tem pai», «ferido» e «fraco» são escolhas aceitáveis. «Quem não tem pai» preserva adequadamente a distinção lexical pretendida entre pupillo e orfanum, sem impor uma leitura doutrinária.
