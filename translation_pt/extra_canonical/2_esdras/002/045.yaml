source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Qui respondens dixit mihi: hi sunt qui mortalem tunicam deposuerunt et inmortalem sumpserunt et confessi sunt nomen dei: modo coronantur et accipiunt palmas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/045.yaml
  text: He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”
translation:
  language: pt
  text: 'Ele me respondeu: “Estes são os que despiram a veste mortal e se revestiram da veste imortal, e confessaram o nome de Deus. Agora estão sendo coroados e recebendo palmas.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortalem tunicam deposuerunt
  choice: despiram a veste mortal
  rationale: Preserva a metáfora do ato de tirar uma peça de roupa; “veste” é natural e digna em português.
- source_word: inmortalem sumpserunt
  choice: revestiram-se da imortal
  rationale: Expressa de modo idiomático o contraste com “despiram” e mantém “veste” subentendida, como no latim.
- source_word: confessi sunt nomen dei
  choice: confessaram o nome de Deus
  rationale: Mantém a formulação teológica e pública de confessar ou professar o nome divino, sem restringi-la a mero reconhecimento.
- source_word: palmas
  choice: palmas
  rationale: Conserva a imagem das palmas como símbolos de vitória, em vez de interpretá-las como ramos de palmeira no corpo do texto.
theological_decisions:
- issue: Natureza da veste imortal
  choice: revestiram-se da imortal
  alternative: receberam a veste imortal
  rationale: A tradução preserva a metáfora e o paralelismo do texto sem definir se a veste representa ressurreição, glorificação ou outra realidade escatológica.
- issue: Valor de “confessaram”
  choice: confessaram o nome de Deus
  alternative: professaram o nome de Deus
  rationale: “Confessaram” conserva a amplitude do latim confessi sunt e evita explicar indevidamente as circunstâncias dessa confissão.
translation_notes:
  register: Português moderno, claro e solene, com paralelismo preservado. A construção “Ele me respondeu” evita a redundância pouco natural de “respondendo, disse-me”, sem perda de conteúdo.
