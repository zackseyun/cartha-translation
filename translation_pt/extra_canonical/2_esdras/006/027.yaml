lexical_decisions:
- source_word: delebitur
  choice: será apagado
  rationale: Reproduz de modo natural o sentido de eliminar ou apagar, mantendo a voz passiva do latim.
- source_word: malum
  choice: o mal
  rationale: Equivalente direto, abrangente e teologicamente não restritivo.
- source_word: extinguetur
  choice: será extinto
  rationale: Preserva a imagem de extinguir presente no latim e o paralelismo com a primeira oração.
- source_word: dolus
  choice: o engano
  rationale: Expressa a ideia de fraude, dolo ou falsidade em linguagem corrente e ampla.
theological_decisions:
- issue: Relação causal indicada por enim
  choice: Pois
  alternative: Porque
  rationale: Mantém a conexão explicativa com o contexto anterior sem especificar além do que o latim indica.
- issue: Possível redação alternativa herdada
  choice: Traduzir somente delebitur enim malum et extinguetur dolus
  alternative: A fé/fidelidade florescerá, e a corrupção será vencida
  rationale: A alternativa pertence a outra cláusula latina e não ao texto-fonte fornecido para este versículo; por isso, não foi incorporada ao corpo da tradução.
translation_notes:
  register: Português moderno, claro e digno, com estrutura paralela próxima do latim. O marcador foi colocado após a frase à qual a nota se refere.
