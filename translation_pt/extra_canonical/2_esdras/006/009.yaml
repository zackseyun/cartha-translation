  text: finis enim huius saeculi Esau, et principium sequentis Iacob.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/009.yaml
  text: For Esau is the end of this age[a], and Jacob is the beginning of the one that follows.
translation:
  language: pt
  text: Pois o fim desta era é Esaú, e o princípio da que vem depois é Jacó.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculi
  choice: era
  rationale: No contexto apocalíptico, o latim saeculum designa uma era ou ordem temporal, não simplesmente um século de cem anos.
- source_word: finis
  choice: fim
  rationale: Equivalente direto que preserva a correspondência retórica entre o fim da era presente e o princípio da seguinte.
- source_word: principium sequentis
  choice: o princípio da que vem depois
  rationale: Expressa de modo natural em português a elipse latina, entendendo-se 'era', sem precisar repetir o substantivo.
- source_word: Esau ... Iacob
  choice: Esaú ... Jacó
  rationale: Emprega as formas tradicionais e amplamente reconhecidas dos nomes bíblicos em português.
theological_decisions:
- issue: Relação simbólica de Esaú e Jacó com as duas eras
  choice: 'Manter a identificação direta: o fim é Esaú, e o princípio é Jacó.'
  alternative: Explicitar que Esaú e Jacó apenas simbolizam ou representam as eras.
  rationale: O texto formula uma identificação metafórica direta; acrescentar 'simboliza' ou 'representa' resolveria e explicaria além do que a fonte declara.
- issue: Ordem retórica das cláusulas
  choice: Preservar 'o fim desta era é Esaú' e 'o princípio ... é Jacó'.
  alternative: 'Antepor os nomes: ''Esaú é o fim...'' e ''Jacó é o princípio...''.'
  rationale: A ordem escolhida conserva a topicalização latina de finis e principium e responde com mais nitidez ao contraste contextual entre fim e princípio.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. 'Era' evita o sentido cronológico moderno de 'século'. A construção paralela conserva a concisão e a força oracular do latim.
