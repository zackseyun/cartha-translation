source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et sciritabuntur, Et subito apparebunt seminata loca non seminata, et plena prumptuaria subito inuenientur uacua, Et tuba canet cum sono, quam cum omnes audierint subito expauescent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/022.yaml
  text: And suddenly places sown will appear unsown, and full storehouses will suddenly be found empty, and the trumpet will sound, which when all hear, they will suddenly be terrified.
translation:
  language: pt
  text: E, de repente, os campos semeados parecerão não semeados, e os celeiros cheios serão encontrados de repente vazios. A trombeta soará e, quando todos a ouvirem, ficarão subitamente apavorados.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminata loca
  choice: os campos semeados
  rationale: Embora literalmente signifique “lugares semeados”, “campos semeados” expressa em português natural a referência a terras cultivadas.
- source_word: prumptuaria
  choice: celeiros
  rationale: O termo latino designa depósitos ou armazéns de provisões; “celeiros” comunica com clareza o contexto agrícola, sem acrescentar uma especificação indevida.
- source_word: expauescent
  choice: ficarão subitamente apavorados
  rationale: O verbo indica forte espanto ou terror; “ficarão apavorados” preserva a intensidade e combina naturalmente com o advérbio “subitamente”.
theological_decisions:
- issue: Identidade e significado da trombeta
  choice: Manter apenas “a trombeta”, sem identificar seu agente ou função escatológica específica.
  alternative: Explicitar que seria uma trombeta divina, angelical ou de juízo.
  rationale: O texto latino não identifica quem toca a trombeta nem explica sua função; a tradução preserva essa abertura.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição latina de subito é preservada semanticamente nas duas cenas, mas a segunda ocorrência inicial é integrada por “serão encontrados” para evitar rigidez; na cláusula final, “subitamente” mantém a ênfase temporal explícita.
