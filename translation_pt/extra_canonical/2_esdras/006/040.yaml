  yaml_path: translation/extra_canonical/2_esdras/006/040.yaml
  text: Then you commanded that light should be brought forth from your treasuries, so that your works might then appear.
translation:
  language: pt
  text: Então ordenaste que fosse trazida luz dos teus tesouros, para que então aparecessem as tuas obras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dixisti
  choice: ordenaste
  rationale: No contexto do ato criador, o verbo de dizer expressa uma ordem eficaz; «ordenaste» comunica isso naturalmente em português.
- source_word: de thesauris tuis
  choice: dos teus tesouros
  rationale: Preserva a imagem concreta do latim e sua associação com reservas pertencentes a Deus.
- source_word: proferri
  choice: fosse trazida à luz
  rationale: Mantém o sentido passivo de fazer sair ou apresentar, usando uma formulação idiomática que também conserva o jogo com «luz».
- source_word: lumen quod luminis
  choice: a luz
  rationale: O texto latino transmitido parece conter uma irregularidade ou corrupção em «quod luminis». Segue-se o sentido claro atestado pela consulta inglesa, sem acrescentar o antigo indefinido «alguma».
- source_word: ut apparerent tunc opera tua
  choice: para que então aparecessem as tuas obras
  rationale: Reproduz a finalidade, o valor temporal de «tunc» e o plural de «opera».
theological_decisions:
- issue: Origem da luz nos tesouros divinos
  choice: Preservar literalmente «dos teus tesouros»
  alternative: Parafrasear como «da tua reserva» ou omitir a imagem
  rationale: A metáfora pertence ao texto e não deve ser harmonizada com uma doutrina específica da criação.
- issue: Relação entre a luz e o aparecimento das obras
  choice: Manter a oração final «para que»
  alternative: 'Transformá-la em simples resultado: «e assim»'
  rationale: O latim «ut» apresenta a manifestação das obras como finalidade, tensão que a tradução deve conservar.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com formas verbais de segunda pessoa singular coerentes com a fala dirigida a Deus. A repetição «trazida à luz a luz» é deliberada para refletir o vocabulário do texto, embora soe marcada.
