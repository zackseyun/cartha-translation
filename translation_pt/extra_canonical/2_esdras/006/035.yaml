lexical_decisions:
- source_word: et factum est post haec
  choice: Depois disso
  rationale: Expressa de modo natural em português a transição narrativa latina, sem carregar a fórmula com um literalismo desnecessário.
- source_word: flevi iterum
  choice: tornei a chorar
  rationale: Preserva tanto a ação de chorar quanto a ideia de repetição indicada por iterum.
- source_word: similiter ieiunavi septem diebus
  choice: do mesmo modo, jejuei durante sete dias
  rationale: Mantém similiter e apresenta a duração do jejum em português corrente.
- source_word: ut suppleam tres ebdomadas
  choice: para completar as três semanas
  rationale: Traduz diretamente a finalidade e o sentido de perfazer o período mencionado.
- source_word: quae dictae sunt mihi
  choice: de que me haviam falado
  rationale: Reflete dictae sunt mihi sem introduzir a noção interpretativa de que as semanas foram designadas ou determinadas; a formulação portuguesa é natural e conserva a referência ao que fora dito ao narrador.
