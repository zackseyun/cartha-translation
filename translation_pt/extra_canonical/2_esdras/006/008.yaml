base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/008.yaml
  text: And he said to me[a], “From Abraham to Abraham, because from him Jacob and Esau were born; for Jacob’s hand held Esau’s heel from the beginning. For Esau is the end of this age[b], and the beginning
translation:
  language: pt
  text: 'Ele me disse: “De Abraão até Abraão[a], porque dele nasceram Jacó e Esaú; pois, desde o princípio, a mão de Jacó segurava o calcanhar de Esaú. Porque Esaú é o fim desta era[b], e o princípio”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão “De Abraão até Abraão” é obscura no testemunho latino. Outras versões antigas trazem “De Abraão até Isaque”, leitura coerente com a explicação seguinte, pois Jacó e Esaú nasceram de Isaque.
    reason: textual_variant
  - marker: b
    text: 'Ou: “deste mundo”.'
    reason: translation_alternative
lexical_decisions:
- source_word: saeculi
  choice: era
  rationale: No contexto apocalíptico, o latim saeculum designa a era ou ordem presente, não simplesmente um século cronológico.
- source_word: calcaneum
  choice: calcanhar
  rationale: Equivalente direto e natural, preservando a alusão ao nascimento de Jacó e Esaú.
- source_word: ab initio
  choice: desde o princípio
  rationale: Mantém o valor temporal do latim e a formulação solene do contexto.
theological_decisions:
- issue: A expressão latina obscura “ab Abraham usque ad Abraham”
  choice: De Abraão até Abraão
  alternative: De Abraão até Isaque
  rationale: O texto principal segue o testemunho latino fornecido e preserva sua dificuldade genuína; a provável correção apoiada pelas versões antigas é informada em nota, sem ser introduzida silenciosamente.
- issue: Sentido escatológico de “saeculum”
  choice: desta era
  alternative: deste mundo
  rationale: “Era” preserva melhor a contraposição apocalíptica entre a ordem presente e a que começa, sem transformar necessariamente saeculum em referência ao mundo físico.
- issue: Fragmento final incompleto
  choice: e o princípio
  alternative: completar a frase com o versículo seguinte
  rationale: A tradução conserva exatamente o limite e a incompletude do trecho-fonte fornecido, sem antecipar material não incluído.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com legibilidade brasileira. A sintaxe acompanha de perto o latim sem ocultar a corrupção provável nem completar o fragmento final.
