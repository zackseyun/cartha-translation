- source_word: in nihilum deputatae sunt
  choice: consideradas como nada
  rationale: Reproduz de modo natural a ideia de serem avaliadas ou tidas como insignificantes, sem acrescentar uma explicação ausente do texto.
- source_word: dominari nostri
  choice: dominam sobre nós
  rationale: Expressa o sentido exigido pelo contexto e refletido pela tradição textual, apesar da forma latina irregular de 'nostri'.
- source_word: devorarenos
  choice: nos devoram
  rationale: Entende a grafia aglutinada como 'devorare nos' e mantém a metáfora forte de consumir ou destruir.
