lexical_decisions:
- source_word: aliud noli querere
  choice: Não pergunte mais nada
  rationale: Expressa naturalmente a proibição e conserva o sentido de aliud, ‘outra coisa/mais nada’, no contexto de perguntas adicionais.
- source_word: Et respondi et dixi
  choice: Então respondi
  rationale: Em português, ‘respondi e disse’ é redundante; a forma condensada comunica com naturalidade o valor narrativo da expressão latina.
- source_word: O dominator domine
  choice: Ó Senhor soberano
  rationale: Preserva a combinação enfática de dominator e domine como uma invocação digna, sem recorrer à formulação pouco natural ‘Senhor que governa’.
- source_word: si inueni gratiam
  choice: se encontrei favor
  rationale: Mantém a fórmula de petição do latim e sua continuação sintaticamente aberta, conforme o limite do versículo fornecido.
theological_decisions:
- issue: Sentido do título dominator domine
  choice: Ó Senhor soberano
  alternative: Ó Senhor que governa
  rationale: ‘Senhor soberano’ representa os dois elementos do título latino de modo idiomático e não introduz uma distinção doutrinária ausente do texto.
- issue: Frase incompleta no fim do versículo
  choice: Manter ‘se encontrei favor’ sem completar a oração
  alternative: Completar a petição com material do versículo seguinte
  rationale: O testemunho fornecido termina nesse ponto; preservar a oração aberta respeita a versificação e evita acrescentar palavras não presentes neste segmento.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A invocação mantém solenidade, e o término incompleto conserva deliberadamente a continuidade com o versículo seguinte.
