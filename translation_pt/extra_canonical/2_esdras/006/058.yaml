base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/058.yaml
  text: But we[a], your people, whom you have called your firstborn, your only one, your beloved, your dear one[b], have been handed over into their hands.
translation:
  language: pt
  text: Mas nós, o teu povo, a quem chamaste teu primogênito, teu unigênito, teu emulador[a], teu muito amado, fomos entregues[b] nas mãos deles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Teu emulador” traduz um termo latino difícil, que pode indicar alguém que procura igualar ou imitar outro, um rival ou alguém movido por zelo. A frase acumula títulos de honra ligados à aliança com Israel, sem suavizá-los numa paráfrase.
    reason: lexical_alternative
  - marker: b
    text: Ou “fomos dados”; aqui, porém, o verbo latino tem mais especificamente o sentido de entregar alguém ao poder de outros.
    reason: previous_rendering
lexical_decisions:
- source_word: primogenitum
  choice: primogênito
  rationale: Preserva diretamente o título de honra e aliança expresso pelo latim.
- source_word: unigenitum
  choice: unigênito
  rationale: Mantém a distinção em relação a “primogênito” e a força singular do título latino.
- source_word: aemulatorem
  choice: zeloso
  rationale: O termo latino é difícil e pode designar alguém movido por zelo, um seguidor zeloso ou até um rival. “Zeloso” mantém o campo semântico mais provável no contexto da relação de aliança, sem confundi-lo com carissimum.
- source_word: carissimum
  choice: muito amado
  rationale: Expressa naturalmente o superlativo afetivo latino e conserva este título separado de aemulatorem.
- source_word: traditi sumus in manibus eorum
  choice: fomos entregues nas mãos deles
  rationale: Traduz a força de tradere como entregar ou pôr sob o poder de outros, preservando também a imagem idiomática das mãos.
theological_decisions:
- issue: Acúmulo de títulos dados por Deus a Israel
  choice: Manter os quatro títulos em sequência
  alternative: Resumi-los numa paráfrase geral sobre Israel ser o povo amado de Deus
  rationale: A repetição é deliberada e intensifica a tensão entre a honra da eleição de Israel e sua entrega aos adversários.
- issue: Sentido de aemulatorem
  choice: Traduzir como “teu zeloso” e registrar a dificuldade em nota
  alternative: “teu rival”, “teu imitador” ou “teu amado”
  rationale: O latim admite mais de uma nuance; a tradução escolhida é contextualmente plausível, enquanto a nota evita apresentar como indiscutível uma interpretação incerta.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com formas de segunda pessoa singular coerentes com o tom de oração. A construção conserva a longa sequência retórica do latim e a expressão bíblica “nas mãos deles”.
