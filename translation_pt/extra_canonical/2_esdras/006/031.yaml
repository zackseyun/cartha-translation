source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'haec ueni tibi ostendere †et uentura† nocte. Si ergo iterum rogaueris et iterum ieiunaueris septem diebus, iterum tibi renuntiabo horum maiora per diem. Quoniam auditu audita est uox tua apud altissimum ; uidit enim fortis directionem tuam et prouidit pudicitiam quam a iuuentute tua habuisti. Et propter hoc misit me demonstrare tibi haec omnia et dicere tibi : confide et noli timere, Et noli festinare in prioribus temporibus cogitare uana, ut non properes in nouissimis temporibus. Et factum est post haec, et fleui iterum et similiter ieiunaui septem diebus, ut supplerem tres ebdomadas quae dictae sunt mihi. Et factum est in octaua nocte et cor meum iterato turbabatur in me, et coepi loqui coram altissimo ; Inflammabatur enim spiritus meus ualde, et anima mea anxiabatur. Et dixi : O domine, loquens locutus es ab initio creaturae, in primo die dicens : fiat caelum et terra, et tuum uerbum opus perfecit. Et erat tunc spiritus uolans, et tenebrae circumferebantur et silentium, sonus
    uocis hominis nondum erat abs te. Tunc dixisti de thesauris tuis proferri lumen aliquod luminis ut apparerent tunc opera tua. Et die secundo iterum creasti spiritum firmamenti et imperasti ei ut diuidcret et diuisionem faceret inter aquas, ut pars quidem sursum recederet, pars uero deorsum maneret. Et tertio die imperasti aquis congregari in septima parte terrae, sex uero partes siccasti et conseruasti ut ex his sint'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/031.yaml
  text: Therefore, if you pray again and fast again for seven days, I will again declare to you greater things than these by day.
translation:
  language: pt
  text: Portanto, se você orar novamente e jejuar novamente por sete dias, novamente lhe anunciarei, durante o dia, coisas maiores do que estas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: rogaueris
  choice: orar
  rationale: Neste contexto de busca por revelação divina, o latim indica dirigir uma súplica ou pedido a Deus; “orar” é natural e preciso em português.
- source_word: ieiunaueris septem diebus
  choice: jejuar por mais sete dias
  rationale: Expressa a duração do novo período de jejum e torna explícito, de modo natural, o valor reiterativo de iterum.
- source_word: renuntiabo
  choice: revelarei
  rationale: O verbo pode significar anunciar ou comunicar. No contexto de uma revelação transmitida por um mensageiro celestial, “revelarei” comunica com naturalidade a ideia sem acrescentar conteúdo doutrinário.
- source_word: horum maiora
  choice: coisas ainda maiores do que estas
  rationale: Preserva a comparação com as revelações já apresentadas e o valor intensificador do contexto.
- source_word: per diem
  choice: durante o dia
  rationale: Mantém a referência temporal literal do latim, sem tentar resolver por conjectura seu alcance exato.
theological_decisions:
- issue: Relação entre oração, jejum e revelação
  choice: Preservar a construção condicional do texto
  alternative: Apresentar oração e jejum como garantia geral de revelação divina
  rationale: A promessa é dirigida especificamente ao vidente dentro da narrativa; a tradução não a transforma em princípio universal.
- issue: Sentido de renuntiabo
  choice: “eu lhe revelarei”
  alternative: “eu lhe anunciarei”
  rationale: “Revelarei” se ajusta ao contexto apocalíptico, embora “anunciarei” seja lexicalmente possível; a escolha não especifica a natureza ou o meio da revelação.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A ordem foi ajustada para fluência, preservando a condição, a repetição e a expressão temporal do latim.
