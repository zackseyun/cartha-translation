  text: and when I begin to inquire of those who have unjustly harmed others by their injustice[a], and
translation:
  language: pt
  text: e começarei a interrogar os que, com sua injustiça, causaram dano injustamente[a], e
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “começarei a pedir contas aos que, com sua injustiça, causaram dano injustamente”.'
    reason: Registra a possível nuance judicial de inquirere sem resolver indevidamente a ambiguidade no texto principal.
lexical_decisions:
- source_word: inquirere ... ab eis
  choice: interrogar os
  rationale: Expressa de modo natural a ideia de indagar ou investigar junto às pessoas em questão, sem tornar explícita no texto principal a nuance judicial possível.
- source_word: qui iniuste nocuerunt iniustitia sua
  choice: os que, com sua injustiça, causaram dano injustamente
  rationale: Preserva tanto a repetição enfática entre iniuste e iniustitia quanto a ausência, no latim, de um objeto explícito para nocuerunt.
theological_decisions:
- issue: Possível nuance judicial de inquirere
  choice: interrogar
  alternative: pedir contas
  rationale: O latim admite uma investigação ou inquirição que pode ter caráter judicial, mas não exige que essa nuance seja explicitada; a alternativa é registrada em nota.
translation_notes:
  register: Português atual, digno e amplamente compreensível. A repetição de “injustiça/injustamente” foi mantida por corresponder à ênfase do latim. O “e” final foi preservado porque a frase continua no versículo seguinte; não se importou para este versículo a cláusula sobre a humilhação de Sião.
