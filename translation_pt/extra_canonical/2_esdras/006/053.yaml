  yaml_path: translation/extra_canonical/2_esdras/006/053.yaml
  text: And on the sixth day you commanded the earth to create before you livestock and beasts and creeping things;
translation:
  language: pt
  text: E, no sexto dia, ordenaste à terra que criasse diante de ti os animais domésticos, os animais selvagens e os animais que rastejam;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iumenta
  choice: animais domésticos
  rationale: Neste catálogo da criação, designa de modo abrangente os animais mantidos pelo ser humano, em contraste com os animais selvagens; evita restringir o sentido a gado bovino ou a animais de carga.
- source_word: bestias
  choice: animais selvagens
  rationale: Expressa naturalmente o contraste com iumenta e corresponde ao sentido contextual de feras ou animais não domesticados.
- source_word: reptilia
  choice: animais que rastejam
  rationale: Mantém a categoria ampla dos seres que se movem rente ao chão, sem reduzi-la ao sentido zoológico moderno de “répteis”.
- source_word: coram te
  choice: diante de ti
  rationale: Preserva a formulação relacional e solene do latim sem explicitar além do texto.
- source_word: crearet
  choice: criasse
  rationale: Mantém a imagem textual da terra produzindo seres por ordem divina.
theological_decisions:
- issue: A terra como agente da criação
  choice: ordenaste à terra que criasse
  alternative: ordenaste que a terra produzisse
  rationale: A tradução conserva a personificação e a agência gramatical de terrae ut crearet, sem reformular a relação entre o mandamento divino e a ação da terra.
translation_notes:
  register: Português atual, claro e digno, com tratamento divino na segunda pessoa do singular. A enumeração mantém o paralelismo entre três categorias de animais e termina com ponto e vírgula, refletindo a continuidade do período.
