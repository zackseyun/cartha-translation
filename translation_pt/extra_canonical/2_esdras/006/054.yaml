source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et super his Adam quem constituisti ducem super omnibus factis quae fecisti, et ex eo educimur nos omnes quem elegisti populum. Haec autem omnia dixi coram te, domine, quoniam dixisti quia propter nos creasti primogenitum saeculum. Residuas autem gentes ab Adam natas dixisti eas nihil esse et quoniam saliuae adsimilatae sunt et sicut stillicidium de uaso similasti habundantiam eorum. Et nunc, domine, ecce istae gentes quae in nihilum deputatae sunt dominantur nostri et deuorant nos. Nos autem populus tuus quem uocasti primogenitum, unigenitum, aemulatorem, carissimum traditi sumus in manibus eorum. Et si propter nos creatum est saeculum, quare non haereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/054.yaml
  text: And over these is Adam[a], whom you appointed ruler over all the works that you made; and from him we all have come, the people whom you have chosen.
translation:
  language: pt
  text: E acima deles está Adão,[a] a quem estabeleceste como governante sobre todas as obras que fizeste; e dele descendemos todos nós, o povo que escolheste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E, além deles, [está] Adão, a quem estabeleceste como governante sobre todas as obras que fizeste. Dele descendemos todos nós, o povo que escolheste.”'
    reason: A construção latina inicial é elíptica e também pode introduzir Adão como estando além dos seres anteriormente enumerados, em vez de declarar explicitamente sua posição acima deles.
lexical_decisions:
- source_word: super his
  choice: acima de todos eles
  rationale: Expressa de modo natural a posição de Adão sobre os seres e obras mencionados no contexto; “todos” explicita em português a abrangência contextual sem mudar o sentido.
- source_word: ducem
  choice: governante
  rationale: No contexto, indica alguém posto à frente e com autoridade sobre as obras criadas; “governante” evita a conotação predominantemente militar de “chefe” ou “comandante”.
- source_word: educimur
  choice: procedemos
  rationale: Comunica origem ou descendência a partir de Adão, em registro digno e compreensível.
- source_word: quem elegisti populum
  choice: o povo que escolheste
  rationale: Mantém a expressão em aposição a “todos nós”, identificando-os como o povo escolhido, sem introduzir uma conjunção que criaria um segundo grupo.
theological_decisions:
- issue: Relação entre “todos nós” e “o povo que escolheste”
  choice: 'Aposição: “todos nós, o povo que escolheste”'
  alternative: 'Coordenação: “todos nós e o povo que escolheste”'
  rationale: A construção latina identifica “nos omnes” com “populum” dentro da oração relativa; a coordenação separaria indevidamente os grupos e enfraqueceria o contraste do contexto com as demais nações.
- issue: Alcance de “sobre/acima deles”
  choice: “acima de todos eles”
  alternative: “sobre estes”
  rationale: A formulação preserva a primazia de Adão em relação aos elementos criados anteriormente, sem acrescentar uma interpretação doutrinária específica.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A pontuação conserva a ligação estreita entre o governo confiado a Adão e a origem nele do povo escolhido.
