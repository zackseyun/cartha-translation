  text: e antes que as belas flores fossem vistas, e antes que fossem estabelecidas as forças dos movimentos[a], e antes que
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “as forças dos terremotos”.'
