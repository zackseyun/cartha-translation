lexical_decisions:
- source_word: decores flores
  choice: as belas flores
  rationale: Reproduz naturalmente o sentido de flores belas ou formosas, preservando a imagem concreta do texto latino.
- source_word: motus uirtutes
  choice: as forças dos movimentos
  rationale: Mantém a construção do latim sem restringir motus ao sentido mais interpretativo de terremotos; a alternativa contextual é registrada em nota.
- source_word: confirmarentur
  choice: fossem estabelecidas
  rationale: Expressa o valor passivo de confirmarentur no contexto da ordenação ou fixação das forças cósmicas.
theological_decisions:
- issue: Referência de motus a movimentos em geral ou a terremotos
  choice: movimentos
  alternative: terremotos
  rationale: O latim motus admite o sentido amplo de movimentos e, em contexto apocalíptico, pode também designar terremotos. O texto principal preserva a formulação menos restritiva, sem eliminar a leitura contextual.
translation_notes:
  register: Português moderno, claro e digno. A repetição de “e antes que” e o final sintaticamente incompleto foram preservados porque o trecho-fonte termina dessa maneira.
