  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/028.yaml
  text: and the truth, which has been fruitless for so long, will be revealed.”
translation:
  language: pt
  text: e será revelada a verdade, que por tanto tempo não deu fruto.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendebitur
  choice: será revelada
  rationale: Embora o sentido básico seja “será mostrada”, no contexto escatológico “será revelada” comunica com naturalidade que a verdade se tornará manifesta.
- source_word: sine fructu fuit
  choice: não deu fruto
  rationale: Preserva a metáfora concreta do latim e soa mais natural em português do que “foi infrutífera” ou “esteve sem fruto”.
- source_word: tantis temporibus
  choice: por tanto tempo
  rationale: Expressa idiomaticamente a longa duração indicada pelo latim, sem introduzir precisão ausente do texto.
theological_decisions:
- issue: Natureza da falta de fruto da verdade
  choice: Manter a afirmação metafórica sem explicar por que ou em que sentido a verdade não deu fruto.
  alternative: Explicitar que a verdade ficou oculta, foi rejeitada ou não produziu efeito.
  rationale: O latim afirma somente que a verdade esteve “sem fruto”; especificar a causa ou o sentido resolveria uma ambiguidade legítima.
translation_notes:
  register: Português moderno, claro e digno, com preservação da metáfora agrícola do original e da ordem enfática centrada na revelação futura da verdade.
