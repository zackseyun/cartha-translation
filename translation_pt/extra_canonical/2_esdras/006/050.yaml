  text: the name of the second you called Leviathan. And you separated them from each other[a], for the seventh part where the water had been gathered could not hold them.
translation:
  language: pt
  text: Ao segundo chamaste Leviatã. E os separaste um do outro[a], pois a sétima parte, onde a água havia sido reunida, não podia contê-los.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “E os separaste um do outro, pois a sétima parte, onde a água havia sido reunida, não podia conter ambos.”'
    reason: A alternativa explicita que o objeto subentendido de «conter» são os dois seres; o latim não emprega uma palavra correspondente a «ambos».
lexical_decisions:
- source_word: nomen secundi uocasti Leuiathan
  choice: Ao segundo deste o nome de Leviatã
  rationale: Reproduz naturalmente em português a construção latina em que o nome do segundo ser é chamado Leviatã, sem omitir a primeira oração do versículo.
- source_word: separasti ea ab alterutro
  choice: os separaste um do outro
  rationale: O pronome neutro plural latino retoma os dois seres mencionados no contexto; o masculino plural é a retomada não marcada e natural em português.
- source_word: septima pars ubi erat aqua congregata
  choice: a sétima parte, onde a água havia sido reunida
  rationale: Mantém a referência cosmológica à sétima parte e expressa o mais-que-perfeito implícito na relação temporal do latim.
- source_word: capere
  choice: conter
  rationale: Neste contexto espacial, 'conter' comunica com clareza a incapacidade daquela parte aquática de comportar os seres.
theological_decisions: []
translation_notes:
  register: Português atual, digno e direto, com formas verbais tradicionais dirigidas a Deus (“deste”, “separaste”), em continuidade com o tom de oração do contexto. A tradução conserva a divisão do versículo da edição latina indicada.
