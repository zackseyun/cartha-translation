source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam auditu audita est vox tua apud Altissimum. vidit enim Fortis directionem tuam et providit pudicitiam quam a iuventute tua habuisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/032.yaml
  text: For your voice has indeed been heard before the Most High; for the Mighty One has seen your conduct and has taken note of the purity that you have had from your youth.
translation:
  language: pt
  text: Pois a sua voz foi de fato ouvida diante do Altíssimo; o Poderoso viu a sua conduta e atentou para a pureza que você tem desde a juventude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auditu audita est
  choice: foi de fato ouvida
  rationale: A construção enfática latina é representada de modo natural em português por “de fato”, sem a redundância pouco idiomática de uma tradução literal.
- source_word: apud Altissimum
  choice: diante do Altíssimo
  rationale: “Diante de” expressa presença e recepção perante o Altíssimo, em linguagem bíblica natural.
- source_word: Fortis
  choice: o Poderoso
  rationale: Preserva o título divino substantivado e sua força sem introduzir uma identificação interpretativa adicional.
- source_word: directionem tuam
  choice: a sua conduta
  rationale: No contexto, directionem refere-se ao modo de proceder; “conduta” é claro e evita restringir o sentido a “retidão”.
- source_word: providit
  choice: atentou para
  rationale: Comunica observação cuidadosa e consideração, adequadas ao contexto, sem sugerir o sentido moderno predominante de “providenciar”.
- source_word: pudicitiam
  choice: pureza
  rationale: Mantém o teor moral do termo, que pode abranger castidade ou modéstia, sem estreitá-lo desnecessariamente.
- source_word: quam a iuventute tua habuisti
  choice: que você conserva desde a juventude
  rationale: O perfeito latino descreve uma qualidade mantida desde a juventude até o presente; o presente “conserva” torna essa continuidade natural em português.
theological_decisions:
- issue: Alcance moral de pudicitiam
  choice: pureza
  alternative: castidade
  rationale: “Pureza” preserva a amplitude do termo e não limita a afirmação exclusivamente à moral sexual.
- issue: Sentido ético de directionem
  choice: conduta
  alternative: retidão
  rationale: “Conduta” traduz o modo de proceder sem transformar explicitamente a observação em um juízo abstrato de justiça moral.
translation_notes:
  register: Português moderno, digno e acessível, com tratamento por “você” conforme a legibilidade brasileira ampla. A formulação conserva o paralelismo causal do latim e os títulos divinos.
