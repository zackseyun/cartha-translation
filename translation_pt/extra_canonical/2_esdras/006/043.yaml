  text: Pois a tua palavra saiu, e a obra foi feita imediatamente.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O recorte latino fornecido começa no meio do versículo e termina em «Verbum enim» («Pois, de fato, a palavra...»). O restante é traduzido conforme o texto latino completo atestado para o versículo.
