lexical_decisions:
- source_word: Verbum
  choice: palavra
  rationale: Equivalente direto e natural de *verbum*; no contexto, designa a ordem criadora de Deus.
- source_word: processit (pressuposto pelo texto completo da tradição)
  choice: saiu
  rationale: Preserva a imagem de a palavra proceder de Deus, sem explicá-la como simples fala ou decreto.
- source_word: statim
  choice: imediatamente
  rationale: Expressa com clareza a realização instantânea da obra após a palavra divina.
- source_word: opus factum est
  choice: a obra se realizou
  rationale: 'Português natural e digno que mantém o sentido passivo/resultativo: a obra veio a existir ou foi efetuada.'
theological_decisions:
- issue: Natureza eficaz da palavra divina
  choice: Manter a sequência entre a palavra que sai e a obra que se realiza
  alternative: Explicitar que Deus criou tudo por uma ordem
  rationale: A formulação preserva a afirmação do texto sem acrescentar uma definição teológica não expressa no versículo.
translation_notes:
  register: Português moderno, claro e solene, com leitura natural no Brasil e ampla compreensão internacional. A construção “a tua palavra saiu” conserva a imagem antiga sem soar excessivamente técnica.
