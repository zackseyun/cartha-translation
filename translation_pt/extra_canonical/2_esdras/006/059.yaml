revisions:
- from: E, se o mundo foi criado por nossa causa, por que não possuímos como herança o mundo que é nosso? Até quando será assim?”
  to: E, se o mundo foi criado para nós, por que não possuímos como herança o nosso mundo? Até quando será assim?”
  rationale: A revisão elimina uma ambiguidade portuguesa evitável em «por nossa causa» e torna a segunda ocorrência possessiva mais idiomática. Conserva-se «mundo» para ambas as ocorrências de saeculum, a linguagem de herança, o sujeito inclusivo não especificado e o caráter elíptico da pergunta final.
