  naturalness: A redação é clara e de registro adequado. «Para nós» e «o nosso mundo» são formulações mais diretas e naturais, sem perder a ênfase possessiva do latim.
  terminology: «Mundo» é uma opção defensável para saeculum e deve ser mantida consistentemente. «Possuímos como herança» reproduz adequadamente hereditatem possidemus.
