id: 2ES.6.59
reference: 2 Esdras 6:59
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si propter nos creatum est saeculum, quare non hereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/059.yaml
  text: And if the world was created for our sake, why do we not possess our world as an inheritance? How long will this be?”
translation:
  language: pt
  text: E, se o mundo foi criado para nós, por que não possuímos como herança o nosso mundo? Até quando será assim?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: mundo
  rationale: Neste contexto, o termo designa a ordem ou era criada destinada ao povo; “mundo” preserva a formulação concreta e acompanha a repetição do latim sem impor uma distinção ausente no texto.
- source_word: propter nos
  choice: por nossa causa
  rationale: Expressa com naturalidade que a criação ocorreu em consideração a “nós”, sem tornar a finalidade mais específica do que o latim.
- source_word: hereditatem possidemus
  choice: possuímos como herança
  rationale: Mantém tanto a ideia de posse quanto a de herança, centrais à pergunta retórica.
- source_word: nostrum saeculum
  choice: o mundo que é nosso
  rationale: Torna clara em português a força de nostrum, preservando a tensão entre o mundo destinado ao povo e sua falta de posse atual.
- source_word: usquequo haec
  choice: Até quando será assim?
  rationale: Reproduz idiomaticamente a pergunta elíptica latina, cujo sentido literal é “até quando estas coisas?”.
theological_decisions:
- issue: Finalidade da criação e herança ainda não possuída
  choice: Preservar a afirmação interrogativa de que o mundo foi criado “por nossa causa” e é “nosso”, sem explicar quem constitui o grupo ou quando ocorrerá a posse.
  alternative: Explicitar uma finalidade salvífica, uma identidade étnica específica ou uma herança escatológica futura.
  rationale: O versículo formula uma tensão teológica, mas não a resolve; a tradução não deve acrescentar uma interpretação denominacional ou temporal.
translation_notes:
  register: Português moderno, claro e digno, com estrutura retórica próxima do latim. A repetição de “mundo” é deliberada, e o fecho elíptico foi vertido de modo idiomático.
