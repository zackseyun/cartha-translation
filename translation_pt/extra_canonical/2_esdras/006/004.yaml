source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: colligerentur innumerabiles militiae angelorum, Et antequam extollerentur altitudines aerum, et antequam nominarentur mensurae firmamentorum, et antequam aestimaretur scabellum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/004.yaml
  text: and before the heights of the air were lifted up[a], and before the measures of the firmaments were named, and before the footstool was measured,
translation:
  language: pt
  text: e antes que as alturas dos ares fossem elevadas, antes que se dessem nomes às medidas dos firmamentos e antes que o escabelo fosse medido[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “fosse avaliado” ou “estimado”.
    reason: O latim aestimaretur tem sentido mais amplo que a medição física e pode indicar avaliação ou estimativa.
lexical_decisions:
- source_word: altitudines aerum
  choice: as alturas dos ares
  rationale: Mantém o plural do latim e a imagem cosmológica, sem reduzir aerum ao singular nem identificá-lo de modo interpretativo com o céu.
- source_word: extollerentur
  choice: fossem elevadas
  rationale: Reproduz o sentido passivo de erguer ou elevar, em português natural e digno.
- source_word: nominarentur mensurae firmamentorum
  choice: se dessem nomes às medidas dos firmamentos
  rationale: Expressa com clareza o passivo latino 'fossem nomeadas', preservando tanto o plural 'medidas' quanto o plural 'firmamentos'.
- source_word: scabellum
  choice: escabelo
  rationale: Preserva o termo cosmológico e bíblico tradicional para um pequeno apoio destinado aos pés; não acrescenta 'de Sião', ausente do latim.
- source_word: aestimaretur
  choice: fosse medido
  rationale: No contexto da ordenação das dimensões cósmicas, 'medido' é a formulação mais natural; uma nota conserva o sentido lexical mais amplo de estimar ou avaliar.
theological_decisions:
- issue: Identificação do escabelo
  choice: não especificar a quem ou a que pertence
  alternative: o escabelo de Sião ou o escabelo de Deus
  rationale: O texto latino diz apenas scabellum; qualquer complemento resolveria uma referência que a fonte deixa implícita.
- issue: Natureza dos firmamentos
  choice: manter o plural 'firmamentos'
  alternative: singular 'firmamento' ou paráfrase 'céus'
  rationale: O plural latino firmamentorum pode refletir uma cosmologia de múltiplos firmamentos e deve ser preservado sem harmonização.
translation_notes:
  register: Português atual, solene e acessível, com estrutura paralela adequada ao discurso de criação. A frase inicial da evidência fornecida, colligerentur innumerabiles militiae angelorum, foi tratada como sobreposição do versículo anterior, em conformidade com a delimitação de 2 Esdras 6:4 na camada inglesa auditada.
