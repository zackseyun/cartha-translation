source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tertio die imperasti aquis congregari in septima parte terrae, sex vero partes siccasti et conservasti, ut ex his sint coram te ministrantia seminata adeo et culta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/042.yaml
  text: And on the third day you commanded the waters to be gathered into the seventh part of the earth, but six parts you dried up and preserved, so that from these there might be before you things sown and cultivated, serving you.
translation:
  language: pt
  text: E, no terceiro dia, ordenaste que as águas se reunissem na sétima parte da terra; as outras seis partes, porém, secaste e preservaste, para que delas houvesse, diante de ti, coisas semeadas e cultivadas que te servissem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in septima parte terrae
  choice: na sétima parte da terra
  rationale: Expressa de modo natural em português a concentração das águas em uma das sete partes da terra, sem tornar a formulação mais específica que o latim.
- source_word: sex vero partes
  choice: as outras seis partes, porém
  rationale: “Outras” explicita naturalmente o contraste quantitativo implícito entre a sétima parte ocupada pelas águas e as seis restantes; “porém” preserva o valor adversativo de vero.
- source_word: siccasti et conservasti
  choice: secaste e preservaste
  rationale: 'Mantém os dois atos distintos do texto latino: tornar secas as seis partes e conservá-las.'
- source_word: seminata adeo et culta
  choice: coisas semeadas e cultivadas
  rationale: Preserva a substantivação neutra e abrangente do latim, evitando restringi-la indevidamente a “plantações” ou “campos”.
- source_word: ministrantia
  choice: que te servissem
  rationale: Traduz o particípio com uma oração relativa idiomática e conserva a ideia de serviço diante de Deus.
theological_decisions:
- issue: Referente e função de “ministrantia”
  choice: Ligar “que te servissem” a “coisas semeadas e cultivadas”
  alternative: Entender o particípio de forma mais ampla, como ligado ao que procede das seis partes secas
  rationale: A concordância neutra plural favorece a ligação gramatical com “seminata ... et culta”; a tradução mantém essa relação sem explicar em que consiste o serviço.
- issue: Sentido de “coram te”
  choice: diante de ti
  alternative: ao teu dispor
  rationale: A tradução formal preserva tanto a dimensão espacial quanto a relacional da expressão, sem interpretar o serviço como mera utilidade.
translation_notes:
  register: Português atual, digno e de leitura ampla, com formas verbais em segunda pessoa singular coerentes com a oração dirigida a Deus. A estrutura foi levemente reorganizada para fluidez, preservando a sequência e a tensão sintática do latim.
