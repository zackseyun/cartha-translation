revisions:
- from: E, no terceiro dia, ordenaste que as águas se reunissem na sétima parte da terra; as outras seis partes, porém, secaste e preservaste, para que delas viessem a existir diante de ti coisas semeadas e cultivadas que te servissem.
  to: E, no terceiro dia, ordenaste que as águas se reunissem na sétima parte da terra; as outras seis partes, porém, secaste e preservaste, para que delas houvesse, diante de ti, coisas semeadas e cultivadas que te servissem.
