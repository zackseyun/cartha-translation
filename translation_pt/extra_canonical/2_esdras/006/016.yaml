  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/016.yaml
  text: Because the speech concerns them[a], they will tremble and be shaken, for they know that their end must be changed.”
translation:
  language: pt
  text: Pois a mensagem diz respeito a eles[a], eles tremerão e serão abalados, pois sabem que o fim deles deve ser mudado.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Como a mensagem diz respeito a eles, eles tremerão e serão abalados, pois sabem que o fim deles deve ser mudado.”'
    reason: Registra a formulação causal alternativa, correspondente à redação anterior, sem alterar o sentido do latim.
lexical_decisions:
- source_word: sermo (refletido na camada de consulta como “speech”)
  choice: declaração
  rationale: Expressa uma fala ou pronunciamento que trata deles, em português natural e digno, sem restringir o sentido a uma conversa informal.
- source_word: finem eorum
  choice: o fim deles
  rationale: Mantém literalmente a referência ao destino ou término deles, sem decidir além do que o texto afirma.
- source_word: oportet commutari
  choice: precisa ser mudado
  rationale: Preserva tanto a necessidade expressa por “oportet” quanto a forma passiva de “commutari”, sem especificar quem efetua a mudança.
theological_decisions:
- issue: Natureza da mudança do “fim” deles
  choice: “o fim deles precisa ser mudado”
  alternative: “o destino deles deve mudar”
  rationale: A redação escolhida conserva a passiva e a tensão do texto, evitando interpretar “fim” exclusivamente como destino e evitando identificar o agente da mudança.
translation_notes:
  register: Português moderno, amplamente internacional e de leitura natural no Brasil. A repetição de “eles” evita possível ambiguidade de sujeito. Mantiveram-se a imagem de tremor e abalo, a passiva final e as aspas de fechamento herdadas do contexto maior.
