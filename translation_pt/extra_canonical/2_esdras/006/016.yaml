  source_fidelity: A tradução preserva a relação causal de *quoniam*, o tremor e o abalo, bem como a necessidade passiva em *oportet commutari*. Contudo, *sermo* é mais bem representado aqui por “mensagem” do que por “declaração”, que sugere indevidamente um pronunciamento formal.
  naturalness: “Como a declaração diz respeito a eles” é compreensível, mas soa menos natural e um tanto burocrático no português moderno. “Pois a mensagem diz respeito a eles” é mais fluente e mantém a causalidade do texto.
  terminology: “Fim deles” conserva a abertura de *finem eorum*, sem fixá-lo como “destino”; “deve ser mudado” traduz adequadamente a necessidade de *oportet* e a voz passiva de *commutari*.
