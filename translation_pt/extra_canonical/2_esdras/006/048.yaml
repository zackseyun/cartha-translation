  yaml_path: translation/extra_canonical/2_esdras/006/048.yaml
  text: 'gathered together[a], that it might produce animals, birds, and fish; and so it happened: the mute water, which had no life, produced living creatures as it had been commanded.'
translation:
  language: pt
  text: 'foi reunida para produzir animais, aves e peixes. E assim aconteceu: a água muda e sem vida produziu[a] animais, conforme lhe havia sido ordenado.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim tem uma construção comprimida; “produziu” é suprido pelo contexto.
    reason: Explica de forma direta a elipse sintática sem introduzir uma paráfrase interpretativa concorrente.
lexical_decisions:
- source_word: congregata
  choice: foi reunida
  rationale: O particípio feminino retoma a água mencionada no contexto e descreve sua reunião; a forma verbal completa a continuação fragmentária do versículo anterior em português natural.
- source_word: uolatilia
  choice: aves
  rationale: Embora o termo latino denote literalmente seres que voam, no catálogo da criação refere-se naturalmente às aves.
- source_word: aqua muta et sine anima
  choice: a água muda e sem vida
  rationale: Preserva a personificação de muta e expressa sine anima sem sugerir, em português moderno, uma doutrina específica sobre a alma.
- source_word: animalia
  choice: criaturas vivas
  rationale: No segundo uso, a expressão destaca o contraste entre a água sem vida e os seres animados que ela produz, além de manter a coerência com o relato da criação.
theological_decisions:
- issue: A água é descrita como sine anima
  choice: sem vida
  alternative: sem alma
  rationale: “Sem vida” comunica o contraste cosmológico do texto sem transformar uma expressão latina comum para algo inanimado numa afirmação antropológica ou metafísica.
- issue: Verbo implícito na oração final latina
  choice: produziu
  alternative: 'fez o que lhe havia sido ordenado: criaturas vivas'
  rationale: A sintaxe transmitida é comprimida e irregular; “produziu” é recuperado do procrearet anterior e torna explícito o sentido exigido pelo contexto, sem acrescentar uma nova ação.
translation_notes:
  register: Português atual, claro e digno, com fluidez brasileira e compreensão internacional. Mantém a imagem poética da “água muda” e sinaliza em nota a construção latina comprimida.
