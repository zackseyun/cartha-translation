id: 2ES.6.5
reference: 2 Esdras 6:5
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Sion, Et antequam inuestigarentur praesentes anni, et antequam abalienarentur eorum qui nunc peccant adinuentiones, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/005.yaml
  text: and before the present years were searched out[a], and before the devices of those who now sin were estranged, and before those who have stored up faith were sealed—
translation:
  language: pt
  text: e antes que os anos presentes fossem investigados[a], e antes que se tornassem alheios os planos dos que agora pecam, e antes que fossem selados os que acumularam fé—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “fossem esquadrinhados”.'
    reason: O verbo latino pode indicar investigar ou examinar minuciosamente; a alternativa preserva essa nuance.
lexical_decisions:
- source_word: inuestigarentur
  choice: fossem investigados
  rationale: Mantém a imagem latina de examinar ou esquadrinhar os anos, sem reduzir o sentido a mera contagem ou determinação.
- source_word: abalienarentur
  choice: se tornassem alheios
  rationale: Reproduz a ideia de afastamento ou alienação do latim e preserva a formulação incomum, em vez de explicar de modo conjectural o que acontece aos planos.
- source_word: adin adinuentiones (adinventiones)
  choice: planos
  rationale: No contexto moral, o termo pode designar invenções, maquinações ou projetos; “planos” é claro e não acrescenta necessariamente uma conotação de conspiração.
- source_word: consignarentur
  choice: fossem selados
  rationale: Conserva a metáfora tradicional do selo e a subordinação temporal introduzida por antequam.
- source_word: fidem thesaurizaverunt
  choice: acumularam fé
  rationale: Preserva a metáfora de entesourar ou armazenar fé, ainda que seja pouco habitual em português.
theological_decisions:
- issue: Relação temporal da última oração
  choice: e antes que fossem selados
  alternative: e foram selados
  rationale: O subjuntivo latino continua a sequência regida por antequam; repetir “antes que” evita transformar a oração subordinada em declaração independente.
- issue: Sentido da alienação dos planos pecaminosos
  choice: se tornassem alheios os planos
  alternative: fossem frustrados os planos
  rationale: “Frustrados” resolveria interpretativamente uma expressão obscura; a redação escolhida preserva a tensão e a estranheza do texto latino.
translation_notes:
  register: Português atual, digno e legível, com repetição deliberada de “antes que” para conservar a estrutura temporal. A sintaxe incomum de “se tornassem alheios os planos” foi mantida para não eliminar uma ambiguidade real do latim. O travessão final indica que a frase continua no versículo seguinte.
