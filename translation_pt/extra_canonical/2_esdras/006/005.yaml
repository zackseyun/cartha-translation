  source_fidelity: 'A tradução preserva a cadeia temporal introduzida por antequam, inclusive na oração final: “e antes que fossem selados”. “Os anos presentes” corresponde a praesentes anni; “se tornassem alheios os planos” mantém, sem resolver indevidamente, a formulação obscura de abalienarentur ... adinventiones; e “acumularam fé” conserva a metáfora de fidem thesaurizaverunt. O travessão reproduz adequadamente a continuação sintática no versículo seguinte.'
