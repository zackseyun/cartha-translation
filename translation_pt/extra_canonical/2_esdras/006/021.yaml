review_pass:
  verdict: revise
  source_fidelity: 'O sentido geral está bem representado: o latim descreve crianças de um ano que falarão e bebês nascidos prematuramente aos três e quatro meses que viverão. Contudo, «com sua própria voz» altera o plural explícito de uocibus suis e soa como se cada criança tivesse uma única voz contrastada com outra; «com suas vozes» reproduz melhor a formulação, ainda incomum, do texto-fonte.'
  naturalness: A redação é clara e de registro adequado. «Bebês de um ano» é mais natural e lexicalmente mais próximo de anniculi infantes do que «crianças de um ano», sem prejudicar a inteligibilidade. A construção «de três e quatro meses» preserva a coordenação algo abrupta do latim; não se deve explicá-la como idade gestacional.
  terminology: «Bebês» reproduz adequadamente infantes nas duas ocorrências e «prematuros» traduz immaturos. «Darão à luz» é idiomático e fiel. Não há termo teológico que exija padronização neste versículo.
  issues:
