    rationale: O texto diz literalmente «com suas vozes» (plural). A forma singular «com sua própria voz» é possível de modo distributivo, mas perde a correspondência formal e introduz uma ênfase de «própria» menos necessária.
  - severity: low
    issue: Escolha lexical para anniculi infantes
    rationale: «Crianças de um ano» é compreensível, mas «bebês de um ano» mantém a repetição de infantes que ocorre no latim e é apropriado para essa idade.
