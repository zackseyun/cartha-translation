base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/021.yaml
  text: And year-old infants will speak with their voices[a], and pregnant women will give birth to premature infants of three and four months[b], and they will live.
translation:
  language: pt
  text: E bebês de um ano falarão com suas vozes, e mulheres grávidas darão à luz bebês prematuros de três e quatro meses, e eles viverão.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: anniculi infantes
  choice: crianças de um ano
  rationale: Expressa diretamente a idade indicada por anniculi e evita a formulação menos natural «bebês de um ano».
- source_word: loquentur uocibus suis
  choice: falarão com sua própria voz
  rationale: Mantém o sentido explícito do latim e a ênfase incomum em que as crianças falarão com a própria voz.
- source_word: immaturos ... infantes
  choice: bebês prematuros
  rationale: Reproduz tanto a imaturidade indicada por immaturos quanto o sentido infantil de infantes, em linguagem portuguesa natural.
- source_word: trium et quatuor mensium
  choice: de três e quatro meses
  rationale: Preserva a coordenação e a concisão do latim sem acrescentar uma explicação sobre idade gestacional que o texto não explicita.
- source_word: et uiuent
  choice: e eles viverão
  rationale: Conserva a afirmação enfática e extraordinária de que os bebês prematuros sobreviverão.
theological_decisions:
- issue: Natureza dos sinais descritos
  choice: Traduzir literalmente os fenômenos extraordinários sem explicá-los
  alternative: Interpretá-los explicitamente como milagres ou sinais escatológicos
  rationale: O versículo relata os acontecimentos, mas não os qualifica teologicamente nesta frase; a tradução não deve acrescentar uma interpretação.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A tradução segue o latim fornecido e não inclui a ideia de «saltar» ou «mover-se ativamente», ausente neste texto. Não foram usadas notas de rodapé porque as alternativas registradas na camada inglesa não correspondem a uma dificuldade real do latim apresentado.
