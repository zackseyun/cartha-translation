  text: but Leviathan you gave the moist seventh part, and you have kept it to be food for whom you wish and when you wish.
translation:
  language: pt
  text: Ao Leviatã, porém, deste a sétima parte, a parte úmida; e os guardaste[a] para servirem de alimento a quem quiseres e quando quiseres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim diz literalmente “os guardaste para que se tornem alimento”, no plural, provavelmente referindo-se a Beemote e Leviatã juntos.
    reason: O recorte isolado pode sugerir um referente singular, mas “ea” e “fiant” são formas plurais; a nota preserva e esclarece essa referência contextual.
lexical_decisions:
- source_word: septimam partem humidam
  choice: a sétima parte, a parte úmida
  rationale: 'Explicita a relação apositiva: a sétima parte da criação é a parte coberta de água, sem tornar a frase excessivamente técnica.'
- source_word: Leuiathan
  choice: Leviatã
  rationale: Emprega a forma portuguesa tradicional e amplamente reconhecida do nome.
- source_word: ut fiant in [escam]
  choice: para servirem de alimento
  rationale: Expressa naturalmente em português a finalidade indicada por “ut” e o sentido do complemento preservado pela tradição textual.
- source_word: quibus vis et quando vis
  choice: a quem quiseres e quando quiseres
  rationale: Conserva a referência à vontade soberana do interlocutor divino, com formulação idiomática e digna.
theological_decisions:
- issue: Referente do plural latino “ea ... fiant”
  choice: “os ... servirem”, retomando conjuntamente Beemote e Leviatã no contexto
  alternative: “o ... servir”, retomando apenas Leviatã, ou “a ... servir”, retomando a parte úmida
  rationale: Embora este recorte comece com Leviatã, “ea” e “fiant” são plurais neutros e apontam naturalmente para as duas criaturas mencionadas no contexto anterior. A tradução mantém esse dado gramatical em vez de harmonizá-lo silenciosamente com um referente singular.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe acessível. A repetição “a sétima parte, a parte úmida” torna explícita a aposição latina. O plural contextual foi preservado e sinalizado por nota devido à possível estranheza quando o versículo é lido isoladamente.
