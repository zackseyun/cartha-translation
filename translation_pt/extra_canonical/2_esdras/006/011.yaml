lexical_decisions:
- source_word: ante oculos tuos
  choice: diante dos teus olhos
  rationale: Mantém a expressão idiomática e solene do latim, natural também em português bíblico contemporâneo.
- source_word: Vt demonstres
  choice: para que mostres
  rationale: Reproduz a ideia de finalidade expressa por “ut” e o sentido direto de revelar ou tornar visível.
- source_word: seruo tuo
  choice: ao teu servo
  rationale: Tradução formal e natural da autodesignação reverente do suplicante.
- source_word: finem signorum
  choice: o fim dos sinais
  rationale: Preserva a formulação concisa e sua possível ambiguidade entre o término e o desfecho dos sinais, sem acrescentar interpretação.
theological_decisions:
- issue: Sentido escatológico de “finem signorum”
  choice: o fim dos sinais
  alternative: o desfecho dos sinais
  rationale: A opção escolhida conserva a ambiguidade do latim “finem” e evita definir se se trata do término cronológico, da consumação ou do resultado dos sinais.
translation_notes:
  register: Português moderno, claro e solene, com tratamento em segunda pessoa do singular coerente com o registro bíblico. O fragmento começa no meio de uma frase, conforme o texto latino fornecido.
