  yaml_path: translation/extra_canonical/2_esdras/006/001.yaml
  text: And he said to me[a], “At the beginning of the earthly world, before the ends of the age were established, and before the gatherings of the winds blew,
translation:
  language: pt
  text: 'E ele me disse: “No princípio do mundo terreno, antes que se estabelecessem as saídas do mundo[a], antes que soprassem os agrupamentos dos ventos, antes que soassem as vozes dos trovões, antes que brilhassem os clarões dos relâmpagos e antes que fossem firmados…”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em sentido cosmológico: “os confins do mundo” ou “as extremidades do mundo”.'
    reason: O latim exitus saeculi pode referir-se às saídas, aberturas ou confins do mundo; a nota esclarece a imagem cosmológica sem fixar uma reconstrução mais específica.
lexical_decisions:
- source_word: initium terreni orbis
  choice: No princípio do mundo terreno
  rationale: Mantém a linguagem cosmológica do latim e a formulação temporal pressuposta pelo contexto, em português claro e solene.
- source_word: starent exitus saeculi
  choice: se firmassem os limites da era
  rationale: “Firmassem” expressa o sentido contextual de starent como algo estabelecido; “limites” preserva a ideia de extremidades ou termos de exitus, enquanto “era” mantém o valor temporal possível de saeculum. A alternativa cosmológica espacial é registrada em nota.
- source_word: spirarent conuentiones uentorum
  choice: soprassem os ventos reunidos
  rationale: Evita o português artificial de “reuniões dos ventos”, mas conserva tanto a ação de soprar quanto a noção de ajuntamento presente em conventiones.
- source_word: sonarent uoces tonitruum
  choice: soassem as vozes dos trovões
  rationale: Reproduz a personificação e o plural do texto latino sem suavizar sua imagem poética.
- source_word: splenderent nitores coruscuum
  choice: brilhassem os clarões dos relâmpagos
  rationale: Expressa naturalmente a imagem luminosa de nitores e o referente meteorológico de coruscuum.
- source_word: confirmarentur
  choice: fossem firmados…
  rationale: Conserva a voz passiva e deixa visível que a oração continua além do trecho fornecido, sem inventar o sujeito ausente.
theological_decisions:
- issue: Sentido temporal ou espacial de saeculum em exitus saeculi
  choice: limites da era
  alternative: saídas do mundo
  rationale: O latim permite leitura temporal (“era”) e cosmológica espacial (“mundo”). O texto principal acompanha de perto a forma latina, e a nota preserva a alternativa relevante sem impor uma reconstrução cosmológica específica.
translation_notes:
  register: Português moderno, digno e acessível, com imagens poéticas preservadas. A reticência final indica que a fonte fornecida interrompe a oração depois de confirmarentur; nenhum complemento foi acrescentado por conjectura.
