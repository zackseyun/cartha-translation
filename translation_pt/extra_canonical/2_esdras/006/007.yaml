  text: Then I answered and said[a], “What will be the dividing of the times? Or when will be the end of the former and the beginning of the one that follows?”
translation:
  language: pt
  text: 'Então respondi e disse: “Qual será a divisão dos tempos? Ou quando será o fim do tempo anterior e o início do seguinte?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: divisio temporum
  choice: divisão dos tempos
  rationale: Preserva a imagem e a formulação do latim, que pergunta pelo ponto de separação entre dois tempos ou eras.
- source_word: prioris finis
  choice: o fim do tempo anterior
  rationale: Torna explícito em português o substantivo elíptico ligado a prioris, mantendo o contraste temporal.
- source_word: sequentis initium
  choice: o início do seguinte
  rationale: Reproduz o paralelismo entre o tempo anterior e o seguinte sem transformar sequentis numa oração mais interpretativa.
theological_decisions:
- issue: Natureza dos dois períodos mencionados
  choice: tempos
  alternative: eras
  rationale: O latim temporum permite uma referência apocalíptica a eras, mas não exige esse termo técnico; “tempos” conserva a amplitude e a ambiguidade do texto.
translation_notes:
  register: Português atual, digno e de leitura fluida. A repetição “respondi e disse” foi mantida por refletir a fórmula narrativa do texto-fonte. A explicitação de “tempo” após “fim” evita uma construção obscura em português, enquanto “do seguinte” mantém o paralelismo conciso.
