source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: faciens, ut ex hoc mirabilia tua nationes enarrent. Et tunc conseruasti duo animalia, nomen uni uocasti Behemoth et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/049.yaml
  text: 'Then you preserved two living creatures: the name of the one you called Behemoth[a], and the name of the second you called Leviathan.'
translation:
  language: pt
  text: 'Então preservaste dois seres vivos: a um chamaste Beemote e ao outro, Leviatã.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beemote e Leviatã são criaturas primordiais conhecidas da tradição bíblica e judaica posterior; aqui aparecem como criaturas preservadas no relato da criação recontado por Esdras.
    reason: Referência contextual à tradição bíblica e pós-bíblica associada aos dois nomes.
lexical_decisions:
- source_word: conseruasti
  choice: preservaste
  rationale: Mantém o sentido de conservar ou guardar com vida, em correspondência direta com o latim.
- source_word: duo animalia
  choice: dois seres vivos
  rationale: No contexto, «seres vivos» evita a possível impressão moderna de animais comuns e conserva a amplitude de animalia.
- source_word: nomen uni uocasti
  choice: a um deste o nome
  rationale: Formulação natural em português que comunica o ato de nomear expresso pelo latim, sem reproduzir sua construção de modo rígido.
- source_word: Behemoth / Leviathan
  choice: Beemote / Leviatã
  rationale: Emprega as formas tradicionais e reconhecíveis em português para os nomes dessas criaturas.
theological_decisions:
- issue: Natureza de Beemote e Leviatã
  choice: seres vivos
  alternative: animais
  rationale: A tradução não define se são animais ordinários, monstros primordiais ou figuras simbólicas; preserva a abertura do texto e esclarece a tradição apenas em nota.
translation_notes:
  register: Português moderno, digno e de leitura natural, com formas nominais tradicionais no uso bíblico lusófono. O trecho latino fornecido termina após «et», mas a continuação do paralelismo é atestada pela camada inglesa auditada; por isso, a frase foi completada com Leviatã.
