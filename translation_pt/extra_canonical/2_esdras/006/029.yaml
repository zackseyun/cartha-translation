- source_word: locus super quem stabam
  choice: o lugar sobre o qual eu estava em pé
  rationale: Reproduz com clareza a relação espacial e explicita o sentido de «stabam» em português natural.
- source_word: ecce
  choice: eis que
  rationale: Mantém o marcador de percepção súbita e o tom narrativo solene do texto.
- source_word: Et dixit ad me
  choice: E ele me disse
  rationale: Inclui a oração final presente no segmento latino e prepara a fala seguinte.
