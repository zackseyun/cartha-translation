  text: On the fourth day you commanded the brightness of the sun[a], the light of the moon, and the arrangement of the stars to be made,
translation:
  language: pt
  text: No quarto dia, porém, ordenaste que fossem feitos o esplendor do sol, a luz da lua e a disposição das estrelas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quarta autem die
  choice: No quarto dia, porém
  rationale: Mantém a referência temporal e o valor conectivo de autem sem tornar a frase artificial.
- source_word: imperasti fieri
  choice: ordenaste que fossem feitos
  rationale: Expressa naturalmente em português a construção latina com imperasti e o infinitivo passivo fieri, cujo alcance abrange os três elementos enumerados.
- source_word: solis splendorem
  choice: o esplendor do sol
  rationale: Tradução direta que preserva a distinção entre o esplendor solar e a luz lunar.
- source_word: lunae lumen
  choice: a luz da lua
  rationale: Equivalência formal, clara e corrente.
- source_word: stellarum dispositionem
  choice: a disposição das estrelas
  rationale: Preserva o sentido de organização, ordenação ou arranjo expresso por dispositio, sem especificar indevidamente constelações.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe natural. O plural masculino em “fossem feitos” concorda com a enumeração mista e deixa claro que a ordem divina se aplica ao esplendor do sol, à luz da lua e à disposição das estrelas.
