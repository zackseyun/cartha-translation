  text: And it said, “Behold, days are coming, and it will be that when I begin to draw near to visit those who dwell on the earth,
translation:
  language: pt
  text: 'E ele disse: “Eis que vêm dias, e acontecerá que, quando eu começar a me aproximar para visitar os que habitam a terra,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pinquare incipio
  choice: eu começar a me aproximar
  rationale: O trecho preservado corresponde ao final de *appropinquare incipio*; a tradução conserva tanto o aspecto incoativo de *incipio* quanto a ideia de aproximação.
- source_word: ut uisitem
  choice: para visitar
  rationale: Mantém de modo direto a finalidade expressa por *ut* e o sentido amplo de *visitare*, sem decidir antecipadamente se a visita implica inspeção, juízo ou intervenção.
- source_word: habitantes in terra
  choice: os que habitam a terra
  rationale: Formulação natural e próxima do latim, preservando a referência geral aos moradores da terra.
theological_decisions:
- issue: Sentido da visita divina
  choice: visitar
  alternative: julgar / castigar
  rationale: O latim *uisitem* não especifica por si só o resultado da visita; a tradução preserva essa abertura sem impor uma interpretação teológica.
translation_notes:
  register: Português moderno, claro e digno. A estrutura temporal deliberadamente permanece suspensa, pois o versículo continua na unidade seguinte. A abertura segue a camada inglesa auditada para o material que antecede o fragmento latino fornecido.
