source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quando suppleta fuerit humilitas Sion, Et cum supersignabitur saeculum quod incipiet pertransire, haec signa faciam: libri aperientur ante faciem firmamenti, et omnes uidebunt simul,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/020.yaml
  text: 'when the humiliation of Zion is completed[a], and when the age that is beginning to pass away is marked out, I will perform these signs: the books will be opened before the face of the firmament, and all will see together.'
translation:
  language: pt
  text: 'quando se completar a humilhação de Sião e quando for marcada a era que começa a passar, farei estes sinais: os livros serão abertos diante da face do firmamento, e todos verão ao mesmo tempo.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “quando se completar a humilhação de Sião e quando for selada a era que começa a passar, farei estes sinais: os livros serão abertos diante da face do firmamento, e todos verão juntos”.'
    reason: Registra "selada" como alternativa legítima para o raro supersignabitur e "juntos" para simul, sem alterar a ambiguidade do objeto de verão.
lexical_decisions:
- source_word: suppleta fuerit
  choice: se completar
  rationale: Expressa o cumprimento ou término indicado pelo perfeito passivo de suppleo, em português natural.
- source_word: humilitas Sion
  choice: a humilhação de Sião
  rationale: Preserva o sentido de rebaixamento ou condição humilhada de Sião sem convertê-lo interpretativamente em humildade.
- source_word: saeculum
  choice: o mundo
  rationale: Neste contexto apocalíptico, saeculum pode designar a ordem mundial ou era presente; 'mundo' mantém a formulação tradicional e concreta, com a alternativa 'era' registrada em nota.
- source_word: supersignabitur
  choice: for marcado
  rationale: O verbo raro sugere que algo recebe uma marca ou selo; 'marcado' evita especificar em excesso a natureza dessa ação.
- source_word: faciam
  choice: farei
  rationale: Traduz diretamente facio, sem substituí-lo por 'mostrarei'.
- source_word: libri aperientur
  choice: os livros serão abertos
  rationale: Mantém a imagem apocalíptica de livros celestes abertos; o artigo definido é natural no contexto.
- source_word: ante faciem firmamenti
  choice: diante da face do firmamento
  rationale: Preserva deliberadamente a imagem espacial e solene do latim.
- source_word: omnes uidebunt simul
  choice: todos verão ao mesmo tempo
  rationale: Traduz simultaneidade de modo claro, sem decidir explicitamente se todos verão a mesma coisa ou uns aos outros.
theological_decisions:
- issue: Referência de saeculum
  choice: o mundo
  alternative: a era
  rationale: A palavra pode referir-se tanto ao mundo presente quanto à era presente. O texto principal adota 'mundo', mas a nota conserva a leitura temporal.
- issue: Natureza de supersignabitur
  choice: for marcado
  alternative: for selado
  rationale: A tradução mantém a ação de assinalar sem impor a imagem mais específica de um selo, embora essa seja uma possibilidade lexical legítima.
- issue: Objeto de 'todos verão'
  choice: deixado implícito
  alternative: todos os verão / todos se verão
  rationale: O latim não fornece objeto expresso; acrescentá-lo resolveria indevidamente a ambiguidade.
translation_notes:
  register: Português moderno, solene e acessível. Conserva as imagens apocalípticas de Sião, dos livros e do firmamento, além das ambiguidades relevantes do latim.
