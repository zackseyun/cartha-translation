revisions:
- from: 'E acontecerá naquele tempo: amigos guerrearão contra amigos como se fossem inimigos, e a terra ficará apavorada junto com os que nela habitam; os canais das fontes ficarão parados, sem correr durante três horas.'
  to: 'E acontecerá naquele tempo: amigos guerrearão contra amigos como inimigos, e a terra ficará apavorada junto com os que nela habitam; os veios das fontes ficarão imóveis, sem correr durante três horas.'
