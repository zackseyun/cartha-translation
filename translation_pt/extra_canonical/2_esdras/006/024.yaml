  register: Português moderno, digno e acessível, com estrutura profética preservada. O ponto e vírgula organiza a sequência de sinais sem alterar sua relação temporal. A cláusula final, ausente do trecho latino fornecido após “uenae fontium”, foi mantida conforme a camada inglesa auditada, que preserva a continuação textual do versículo.
