review_pass:
  verdict: revise
  source_fidelity: A tradução transmite adequadamente a sucessão de sinais e o sentido associativo de cum em «terra ... com os que nela habitam». Contudo, «como se fossem inimigos» explicita além do necessário o comparativo ut inimici, que pode ser conservado de modo mais direto como «como inimigos». «Veios das fontes» corresponde mais precisamente a uenae fontium do que «canais das fontes».
  naturalness: O texto é claro e de registro profético natural. «Veios das fontes» é uma imagem idiomática e mais próxima do original; «ficarão imóveis, sem correr» preserva a imagem extraordinária sem redundância excessiva.
  terminology: '«Veios» preserva a metáfora física de uenae e evita especificar estruturas construídas, como «canais». Não são necessárias notas de rodapé: a formulação portuguesa não introduz a ambiguidade instrumental que motivou a nota inglesa.'
  issues:
  - severity: low
    issue: «como se fossem inimigos» torna explícita uma inferência interpretativa.
    rationale: O latim ut inimici diz literalmente «como inimigos»; a forma mais concisa mantém a comparação sem definir se os amigos deixam ou não de ser amigos.
  - severity: medium
    issue: «canais das fontes» é mais específico que uenae fontium.
    rationale: Uenae designa veios, cursos ou condutos naturais de água; «veios das fontes» preserva melhor essa imagem e não sugere necessariamente canais artificiais.
  revised_text: 'E acontecerá naquele tempo: amigos guerrearão contra amigos como inimigos, e a terra ficará apavorada junto com os que nela habitam; os veios das fontes ficarão imóveis, sem correr durante três horas.'
