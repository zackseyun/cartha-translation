  text: Et erit in illo tempore debellabunt amici amicos ut inimici, et expauescet terra cum his qui inhabitant eam, et uenae fontium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/024.yaml
  text: 'And it will be in that time: friends will make war on friends like enemies[a], and the earth will be terrified along with those who dwell in it, and the channels of the springs will stand still so as not to run for three hours.'
translation:
  language: pt
  text: 'E acontecerá naquele tempo: amigos guerrearão contra amigos como inimigos, e a terra ficará apavorada junto com os que nela habitam; os veios das fontes ficarão imóveis, sem correr durante três horas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: debellabunt amici amicos ut inimici
  choice: amigos guerrearão contra amigos como se fossem inimigos
  rationale: Reproduz de modo natural a hostilidade entre amigos e explicita o valor comparativo de ut, sem sugerir que eles tenham literalmente deixado de ser amigos.
- source_word: expauescet terra cum his qui inhabitant eam
  choice: a terra ficará apavorada junto com os que nela habitam
  rationale: 'Entende cum em sentido associativo: tanto a terra quanto seus habitantes participam do terror.'
- source_word: uenae fontium
  choice: os canais das fontes
  rationale: Traduz a imagem de veios ou condutos pelos quais corre a água das fontes, em linguagem clara e corrente.
