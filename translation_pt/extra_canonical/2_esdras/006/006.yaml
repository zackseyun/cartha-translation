  yaml_path: translation/extra_canonical/2_esdras/006/006.yaml
  text: Then I considered, and these things were made through me and not through another, so also the end will be through me and not through another.”
translation:
  language: pt
  text: Então pensei, e estas coisas foram feitas por mim, e não por outro; assim também o fim será por mim, e não por outro.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: cogitaui
  choice: pensei
  rationale: Reproduz de modo natural e direto o sentido de reflexão ou deliberação do latim, sem acrescentar um objeto ausente no texto.
- source_word: per me
  choice: por meu intermédio
  rationale: Expressa agência mediada com clareza, distinguindo-a de uma simples localização ou causa vaga.
- source_word: finis
  choice: o fim
  rationale: Mantém a formulação ampla e escatologicamente aberta do latim, sem especificar além da fonte.
theological_decisions:
- issue: Agência divina na criação e no fim
  choice: por meu intermédio, e não por outro
  alternative: por mim, e não por outro
  rationale: A escolha conserva a força de per me e a afirmação enfática de agência exclusiva, sem resolver além do texto a relação precisa entre agente e meio.
- issue: Relação entre a origem das coisas e o fim
  choice: assim também o fim virá
  alternative: do mesmo modo, também o fim será por meu intermédio
  rationale: Torna natural em português a construção elíptica latina ut et finis per me, suprindo apenas o verbo exigido pelo idioma e preservando o paralelismo.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo enfático. A pontuação acompanha a unidade citada, que termina com aspas de fechamento por continuar uma fala iniciada anteriormente.
