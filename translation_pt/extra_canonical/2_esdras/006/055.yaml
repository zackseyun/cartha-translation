source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: haec autem omnia dixi coram te, Domine, quoniam dixisti quia propter nos creasti primogenitum saeculum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/055.yaml
  text: But I have said all these things before you[a], Lord, because you said that for our sake you created the first world.
translation:
  language: pt
  text: Mas eu disse tudo isso diante de ti, Senhor, porque disseste que foi por nossa causa que criaste o mundo primogênito.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim traz literalmente «o mundo primogênito». Algumas outras versões antigas dizem «este mundo»; também se pode entender saeculum como «era».
    reason: textual_variant_and_lexical_ambiguity
lexical_decisions:
- source_word: autem
  choice: Mas
  rationale: Marca a transição e o contraste entre a recapitulação anterior e a queixa teológica que se segue.
- source_word: coram te
  choice: diante de ti
  rationale: Reproduz de modo natural e direto a ideia de falar na presença de Deus.
- source_word: propter nos
  choice: por nossa causa
  rationale: Expressa a finalidade ou motivação indicada pelo latim sem restringi-la a uma formulação denominacional.
- source_word: primogenitum saeculum
  choice: o mundo primogênito
  rationale: Preserva a formulação incomum do texto latino fornecido e sua tensão, em vez de corrigi-la silenciosamente; aqui saeculum designa o mundo ou a era.
theological_decisions:
- issue: A expressão latina incomum primogenitum saeculum e a divergência das versões antigas
  choice: Manter no texto principal «o mundo primogênito» e registrar a variante em nota
  alternative: «este mundo» ou «o primeiro mundo»
  rationale: «Mundo primogênito» corresponde diretamente ao latim apresentado. Algumas versões antigas apoiam «este mundo», enquanto «primeiro mundo» interpreta e suaviza a expressão; a nota preserva a evidência textual sem decidir silenciosamente a cosmologia do autor.
translation_notes:
  register: Português moderno, claro e digno, com tratamento bíblico em segunda pessoa («ti», «disseste», «criaste»). A construção incomum «mundo primogênito» foi mantida por fidelidade ao texto latino e esclarecida em nota.
