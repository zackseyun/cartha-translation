  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/034.yaml
  text: and do not hasten to think vain thoughts about the former times[a][b], so that you may not be hasty concerning the last times.’”
translation:
  language: pt
  text: e não se apresse a pensar coisas vãs sobre os tempos passados[a][b], para que não se precipite a respeito dos últimos tempos.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “para que não se afaste apressadamente dos últimos tempos”.'
    reason: Registra a leitura separativa possível da preposição latina a, embora seja menos provável no contexto.
  - marker: b
    text: A formulação desta advertência é textualmente difícil. O sentido parece ser uma proibição contra especulações impacientes e vazias sobre os tempos anteriores, que poderiam distorcer a maneira como Esdras encara os últimos tempos.
    reason: Sinaliza a dificuldade textual e preserva a incerteza interpretativa.
lexical_decisions:
- source_word: festinare ... cogitare
  choice: apressar-se a alimentar pensamentos
  rationale: Expressa naturalmente em português a ideia de entregar-se com pressa à cogitação, sem perder a força da proibição.
- source_word: vana
  choice: pensamentos vãos
  rationale: Preserva o sentido de reflexões vazias, inúteis ou sem fundamento.
- source_word: prioribus temporibus
  choice: tempos passados
  rationale: Forma corrente e clara para os tempos anteriores, mantendo o contraste com os últimos tempos.
- source_word: properes
  choice: seja precipitado
  rationale: Mantém o paralelismo semântico com festinare e comunica impaciência irrefletida.
- source_word: a novissimis temporibus
  choice: a respeito dos últimos tempos
  rationale: Entende a preposição a/ab em sentido relacional, preservando o paralelismo contextual entre os tempos passados e os últimos tempos.
theological_decisions:
- issue: Sentido escatológico de novissimis temporibus
  choice: últimos tempos
  alternative: tempos mais recentes
  rationale: O contexto contrasta épocas anteriores com o fim esperado; a tradução mantém essa referência escatológica sem especificar uma cronologia doutrinária.
- issue: Relação expressa por a em a novissimis temporibus
  choice: a respeito dos últimos tempos
  alternative: para longe dos últimos tempos
  rationale: A leitura relacional faz melhor sentido no contexto da impaciência de Esdras pelo fim e conserva o paralelismo da frase; a leitura separativa permanece registrada em nota por refletir uma tradução possível da forma latina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção conserva a tensão entre a especulação sobre o passado e a impaciência quanto ao fim.
