  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/015.yaml
  text: do not be terrified, because the word concerns the end, and the foundations of the earth will tremble and be shaken, because the discourse is about them.
translation:
  language: pt
  text: não fique apavorado, pois a palavra diz respeito ao fim; e os fundamentos da terra tremerão e serão abalados, porque é a respeito deles que se fala.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: expauescas
  choice: fique apavorado
  rationale: Expressa o temor intenso do verbo latino, em linguagem portuguesa natural; com a negação, forma a exortação «não fique apavorado».
- source_word: de fine uerbum
  choice: a palavra diz respeito ao fim
  rationale: Reproduz a construção concisa segundo a qual a palavra ou mensagem tem por assunto o fim.
- source_word: fundamenta terrae
  choice: os fundamentos da terra
  rationale: Mantém a imagem cosmológica do texto latino sem explicá-la ou reinterpretá-la.
- source_word: tremescet et commoue-
  choice: tremerão e serão abalados
  rationale: Segue a leitura restaurada indicada pela edição e pela revisão auditada; usa o plural exigido por «fundamentos» em português e preserva os dois movimentos verbais.
- source_word: de ipsis sermo
  choice: é a respeito deles que se fala
  rationale: Transmite naturalmente que os fundamentos da terra são o assunto do discurso, sem acrescentar um agente.
theological_decisions:
- issue: Referente de «fim»
  choice: manter «o fim» sem especificação
  alternative: explicitar «o fim dos tempos» ou «o fim do mundo»
  rationale: O latim diz apenas «de fine»; explicitar a natureza do fim resolveria uma ambiguidade que o texto preserva.
- issue: Personificação dos fundamentos da terra
  choice: conservar a ação atribuída aos fundamentos
  alternative: interpretar como terremoto ou como reação dos habitantes da terra
  rationale: O texto apresenta diretamente os fundamentos como aqueles que tremem e são abalados; a tradução não deve substituir a imagem por uma interpretação.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A ordem das orações e as duas relações causais foram preservadas, enquanto a formulação final foi tornada idiomática.
