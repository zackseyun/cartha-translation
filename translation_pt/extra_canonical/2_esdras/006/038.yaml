  text: 'et dixi: o Domine, loquens locutus es ab initio creaturae in primo die dicens: fiat caelum et terra, et tuum verbum opus perfecit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/038.yaml
  text: And I said[a], “O Lord, from the beginning of creation, on the first day, you spoke, saying, ‘Let heaven and earth be made,’ and your word accomplished the work.”
translation:
  language: pt
  text: 'E eu disse: “Ó Senhor, desde o princípio da criação, no primeiro dia, tu falaste, dizendo: ‘Que o céu e a terra sejam feitos’, e a tua palavra realizou a obra.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab initio creaturae
  choice: desde o princípio da criação
  rationale: Mantém o sentido temporal e a ordem do latim, em formulação natural e solene em português.
- source_word: loquens locutus es
  choice: tu falaste
  rationale: A construção intensiva do latim é difícil de reproduzir sem artificialidade; o verbo explícito com pronome preserva alguma ênfase, sem acrescentar um advérbio interpretativo.
- source_word: fiat caelum et terra
  choice: Façam-se o céu e a terra
  rationale: Reproduz o jussivo/passivo latino e mantém a referência conjunta ao céu e à terra.
- source_word: tuum verbum
  choice: a tua palavra
  rationale: Equivalência direta de verbum, preservando a personificação ou agência possível sem decidir seu alcance teológico.
- source_word: opus perfecit
  choice: realizou a obra
  rationale: Expressa que a palavra levou a obra a efeito; evita sugerir necessariamente apenas conclusão temporal, embora 'completou' seja possível.
theological_decisions:
- issue: Possível força enfática de loquens locutus es
  choice: tu falaste
  alternative: tu de fato falaste
  rationale: O latim contém uma duplicação verbal provavelmente enfática, mas sua reprodução literal seria pouco natural. Não se acrescentou 'de fato' porque isso pode soar contrastivo e resolver em excesso a função retórica.
- issue: Agência da palavra divina
  choice: a tua palavra realizou a obra
  alternative: a tua palavra completou a obra
  rationale: A formulação conserva a palavra como sujeito agente, sem identificá-la explicitamente com uma pessoa divina nem reduzir 'verbum' a simples ordem.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do latim. Emprega 'tu' em concordância com o vocativo e conserva a linguagem solene do ato criador.
