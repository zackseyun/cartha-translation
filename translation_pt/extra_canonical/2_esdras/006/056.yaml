source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: residuas autem gentes ab Adam natas dixisti eas nihil esse, et quoniam salivae adsimilatae sunt, et sicut stillicidium de vaso similasti abundantiam eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/056.yaml
  text: But the rest of the nations, which have come from Adam, you said are nothing, and that they are like spittle; and you compared their abundance to a drop from a vessel.
translation:
  language: pt
  text: Mas disseste que as demais nações, nascidas de Adão, nada são e que são semelhantes à saliva; e comparaste a abundância delas a uma gota de um recipiente.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: residuas autem gentes
  choice: Mas as demais nações
  rationale: Reproduz o contraste de autem e o sentido de residuas como as nações restantes, além do povo em foco no contexto.
- source_word: ab Adam natas
  choice: nascidas de Adão
  rationale: Mantém de forma direta a origem comum expressa pelo latim, sem restringir o sentido a uma linhagem específica.
- source_word: salivae adsimilatae sunt
  choice: são semelhantes à saliva
  rationale: Preserva a imagem depreciativa concreta do texto latino.
- source_word: abundantiam eorum
  choice: a multidão delas
  rationale: Neste contexto, abundantia indica grande número; o pronome é vertido no feminino para concordar naturalmente com 'nações' em português.
- source_word: stillicidium de vaso
  choice: uma gota que cai de um recipiente
  rationale: Expressa a ideia de uma gota ou pequeno gotejamento proveniente de um vaso, em português claro e sem acrescentar uma localização não indicada.
theological_decisions:
- issue: A afirmação de que as demais nações 'nada são'
  choice: nada são
  alternative: não têm valor
  rationale: Mantém a formulação absoluta e a tensão retórica do texto, sem reinterpretá-la como uma avaliação moral ou metafísica mais específica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe próxima do original. 'Recipiente' evita a possível leitura exclusivamente litúrgica ou anatômica de 'vaso', enquanto conserva o sentido genérico de vasum.
