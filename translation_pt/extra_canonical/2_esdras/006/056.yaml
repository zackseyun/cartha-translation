  source_fidelity: A tradução reproduz bem a estrutura argumentativa e as imagens depreciativas do latim. Contudo, “uma gota que cai” explicita um movimento que não é afirmado por *stillicidium de vaso*; a formulação mais estrita é “uma gota de um recipiente”. “Abundância” preserva melhor o campo semântico de *abundantiam* sem resolver interpretativamente o termo como mera quantidade numérica.
  naturalness: O português é claro, moderno e de registro apropriado. A coordenação com “que são semelhantes à saliva” é natural, embora a repetição de “que” ajude a tornar explícita a dependência de “disseste”.
