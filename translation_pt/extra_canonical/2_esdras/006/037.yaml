  text: For my spirit was greatly inflamed, and my soul was distressed.
translation:
  language: pt
  text: Pois o meu espírito ardia intensamente, e a minha alma estava angustiada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inflammabatur
  choice: ardia
  rationale: Expressa de modo natural a imagem latina de estar inflamado, preservando sua intensidade sem sugerir necessariamente ira.
- source_word: spiritus meus
  choice: o meu espírito
  rationale: Mantém o referente e a terminologia antropológica do texto latino.
- source_word: valde
  choice: intensamente
  rationale: Reproduz o alto grau indicado pelo advérbio latino em português corrente.
- source_word: anima mea
  choice: a minha alma
  rationale: Preserva a distinção formal entre spiritus e anima presente no original.
- source_word: anxiabatur
  choice: estava angustiada
  rationale: Comunica aflição interior e forte inquietação de maneira digna e compreensível.
theological_decisions:
- issue: Distinção entre espírito e alma
  choice: Preservar “espírito” e “alma” como termos distintos
  alternative: Tratar ambos genericamente como o íntimo ou o ser interior
  rationale: O latim emprega spiritus e anima em paralelo; a tradução não deve apagar nem explicar além do texto essa possível distinção antropológica.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A imagem do espírito que arde foi mantida, enquanto a construção perifrástica em “estava angustiada” reflete o estado interior expresso pelo imperfeito latino.
