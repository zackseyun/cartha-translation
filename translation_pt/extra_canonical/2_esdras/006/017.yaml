base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/017.yaml
  text: And it happened, when I heard, that I stood upon my feet and listened, and behold, a voice was speaking, and its sound was like the sound of many waters.
translation:
  language: pt
  text: Quando ouvi, levantei-me e fiquei de pé, e escutei. E eis que uma voz falava, e seu som era como o som de muitas águas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est cum audissem
  choice: Quando ouvi isso
  rationale: Reproduz com naturalidade a construção narrativa latina sem o calque pouco idiomático “aconteceu que, quando ouvi”.
- source_word: surrexi super pedes meos
  choice: levantei-me e fiquei de pé
  rationale: Preserva tanto a ação de se levantar quanto a ideia explícita de estar sobre os pés.
- source_word: audiui
  choice: escutando
  rationale: No contexto, indica atenção continuada à voz; a forma evita a repetição ambígua de “ouvi” em português.
- source_word: ecce
  choice: e eis que
  rationale: Mantém o marcador vívido de percepção e surpresa do relato.
- source_word: uox loquens
  choice: uma voz falava
  rationale: Expressão natural em português que conserva a voz como sujeito da fala.
- source_word: sonus aquarum multarum
  choice: o som de muitas águas
  rationale: Mantém literalmente a imagem tradicional e solene do latim.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno, com cadência narrativa e preservação da imagem solene de “muitas águas”. O trecho latino fornecido prossegue no início do versículo seguinte (“Et dixit...”), mas a tradução limita-se ao conteúdo correspondente a 2 Esdras 6:17, em acordo com a referência e a camada inglesa auditada.
