  yaml_path: translation/extra_canonical/2_esdras/006/026.yaml
  text: It will be turned into another understanding[a]. For evil will be blotted out, and deceit will be extinguished. But faith will flourish, and corruption will be overcome[b],
translation:
  language: pt
  text: Será transformado em outra forma de pensar. Pois o mal será apagado, e o engano será extinto. Mas a fé florescerá, e a corrupção será vencida,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conuertetur in sensum alium
  choice: Será transformado em outra forma de pensar
  rationale: Mantém a voz passiva e a referência implícita do latim, enquanto expressa sensus de modo natural como maneira de pensar, sem especificar um sujeito que o trecho fornecido não nomeia.
- source_word: delebitur malum
  choice: o mal será apagado
  rationale: Reproduz a imagem de delebitur, que indica apagar ou eliminar completamente.
- source_word: extinguetur dolus
  choice: o engano será extinto
  rationale: Preserva a metáfora de extinguir e traduz dolus pelo termo amplo e corrente “engano”.
- source_word: florebit fides
  choice: a fé florescerá
  rationale: Conserva diretamente a imagem de florescimento presente no latim.
- source_word: uincetur corruptela
  choice: a corrupção será vencida
  rationale: Mantém a voz passiva e o sentido de derrota expresso por uincetur.
theological_decisions:
- issue: Referente implícito de conuertetur
  choice: Não explicitar o sujeito
  alternative: “O coração será transformado” ou “ele será transformado”
  rationale: O trecho latino fornecido contém apenas um verbo passivo singular cujo referente depende do contexto anterior; inserir “coração” importaria palavras ausentes desta unidade, e “ele” seria pouco natural e igualmente dependente de antecedente.
- issue: Sentido de fides
  choice: “fé”
  alternative: “fidelidade”
  rationale: O latim permite nuances de fé e fidelidade; “fé” preserva a formulação tradicional e a amplitude teológica sem acrescentar um agente ou objeto.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe próxima do latim sem rigidez excessiva. A vírgula final foi mantida porque o texto-fonte termina em continuidade com a oração seguinte.
