  yaml_path: translation/extra_canonical/2_esdras/006/051.yaml
  text: And you gave Behemoth one part, which was dried up on the third day, to dwell in it, where there are a thousand mountains;
translation:
  language: pt
  text: E deste a Beemote uma parte, que secou no terceiro dia, para que ele habitasse nela, onde há mil montanhas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Behemoth
  choice: Beemote
  rationale: Forma portuguesa tradicional e reconhecível do nome da criatura, preservada como nome próprio.
- source_word: unam partem
  choice: uma parte
  rationale: Correspondência direta e natural ao latim, sem explicitar além do que o texto diz.
- source_word: quae siccata est
  choice: que foi seca
  rationale: Mantém a voz passiva e a referência da oração relativa a “uma parte”.
- source_word: tertio die
  choice: no terceiro dia
  rationale: Expressão temporal natural em português e coerente com o contexto da criação.
- source_word: ut habitet in ea
  choice: para que ele habitasse nela
  rationale: Expressa a finalidade e deixa claro, sem paráfrase excessiva, que Beemote é o sujeito de “habitar”.
- source_word: mille montes
  choice: mil montanhas
  rationale: Tradução literal, preservando a imagem e o número do texto.
theological_decisions:
- issue: Natureza e identificação de Beemote
  choice: Manter “Beemote” como nome próprio, sem identificar a criatura com um animal específico.
  alternative: Traduzir ou explicar Beemote como hipopótamo, monstro ou outra criatura.
  rationale: O texto não resolve a identidade de Beemote; uma identificação específica importaria uma interpretação não exigida pela fonte.
translation_notes:
  register: Português atual, claro e digno, com estrutura próxima da fonte. Preferiu-se “habitasse” após “para que” para manter a relação de finalidade em uma narrativa passada.
