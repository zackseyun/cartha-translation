  source_fidelity: 'A tradução reproduz com fidelidade a oração latina: o sobrevivente/remanescente dentre os acontecimentos anunciados («tiver restado depois de todas essas coisas») será salvo, verá a salvação divina e o fim da era. A formulação temporal explicita de modo aceitável a implicação contextual de derelictus ... ex omnibus istis, sem introduzir conteúdo doutrinário.'
