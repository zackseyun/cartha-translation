base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/025.yaml
  text: And it will be that everyone who is left from all these things that I have foretold to you will be saved and will see my salvation and the end of my age[a].
translation:
  language: pt
  text: E acontecerá que todo aquele que tiver restado depois de todas essas coisas que predisse a você será salvo e verá a minha salvação e o fim da minha era.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «o fim do meu mundo».
    reason: O latim saeculum pode significar «era», «época» ou «mundo» entendido como a ordem presente.
lexical_decisions:
- source_word: derelictus fuerit ex omnibus istis
  choice: tiver restado depois de todas essas coisas
  rationale: Expressa em português natural a ideia de alguém que permanece ou sobrevive após os acontecimentos anunciados, sem o calque pouco idiomático «de todas essas coisas».
- source_word: salvabitur
  choice: será salvo
  rationale: Mantém a forma passiva e o sentido direto do latim.
- source_word: salutare meum
  choice: a minha salvação
  rationale: O adjetivo substantivado latino designa a salvação ou o ato salvador que pertence a Deus; «minha salvação» preserva a formulação teológica sem explicá-la em excesso.
- source_word: finem saeculi mei
  choice: o fim da minha era
  rationale: «Era» comunica o sentido temporal e escatológico de saeculum melhor que «século» no português atual, preservando a primeira pessoa do texto.
theological_decisions:
- issue: Sentido escatológico de saeculum
  choice: minha era
  alternative: meu mundo
  rationale: Saeculum pode referir-se tanto a uma era quanto à ordem do mundo. O contexto favorece o período ou era que chega ao fim, mas a nota registra a alternativa legítima.
- issue: Referente de «minha salvação»
  choice: Preservar a expressão sem explicitação
  alternative: meu ato salvador
  rationale: O latim permite entender tanto a salvação pertencente a Deus quanto sua manifestação salvadora; a tradução mantém essa tensão.
translation_notes:
  register: Português moderno, claro e digno, com estrutura próxima do latim sem rigidez. «A você» assegura ampla legibilidade internacional e naturalidade brasileira; «tiver restado depois de» torna explícita a relação temporal sugerida pelo contexto apocalíptico.
