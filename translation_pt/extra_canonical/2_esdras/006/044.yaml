lexical_decisions:
- source_word: fructus multitudinis inmensus
  choice: uma abundância imensurável de frutos
  rationale: Expressa naturalmente em português o fruto coletivo que surgiu em quantidade incomensurável.
- source_word: concupiscentia gustus multiformis
  choice: múltiplos deleites para o paladar
  rationale: Evita sugerir que um sentimento subjetivo foi criado e comunica a variedade agradável dos frutos, sem apagar a leitura mais literal registrada em nota.
- source_word: flores colore inimitabiles
  choice: flores de cores inimitáveis
  rationale: Mantém a força superlativa da descrição latina em linguagem clara e digna.
- source_word: odores odoramentis inuestigabiles
  choice: aromas de fragrância insondável
  rationale: Preserva a repetição semântica e o sentido de uma fragrância impossível de sondar ou esgotar.
