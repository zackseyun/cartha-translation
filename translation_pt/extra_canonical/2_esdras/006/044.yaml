  text: For at once there came forth fruit in immeasurable abundance[a], and manifold delights of taste, and flowers of inimitable color, and scents of unsearchable fragrance. These things were made on the third day.
translation:
  language: pt
  text: Pois imediatamente surgiu uma abundância imensurável de frutos, múltiplas delícias[a] para o paladar, flores de cores inimitáveis e aromas de fragrância insondável. Essas coisas foram feitas no terceiro dia.
