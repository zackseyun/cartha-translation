id: 2ES.6.39
reference: 2 Esdras 6:39
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erat tunc spiritus volans, et tenebrae circumferebantur et silentium, sonus vocis hominis nondum erat abs te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/039.yaml
  text: And at that time the spirit was moving[a], and darkness and silence were surrounding everything; the sound of a human voice was not yet from you.
translation:
  language: pt
  text: E, naquele tempo, o espírito se movia[a], e as trevas e o silêncio envolviam tudo; o som da voz humana ainda não provinha de ti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “pairava”.
    reason: O latim volans pode descrever movimento, voo ou a ação de pairar; a nota preserva essa amplitude imagética.
lexical_decisions:
- source_word: spiritus
  choice: espírito
  rationale: Mantém o sentido mais direto do latim e a associação com o relato da criação, sem explicitar no corpo do texto se se trata do Espírito divino, de um espírito ou do vento.
- source_word: volans
  choice: se movia
  rationale: Expressão neutra e natural que preserva a ideia de movimento sem restringi-la ao sentido literal de voar; a possibilidade de 'pairava' é indicada em nota.
- source_word: circumferebantur
  choice: envolviam tudo
  rationale: Verte de modo idiomático o movimento ou a presença ao redor expressos pelo verbo latino; 'tudo' torna explícito em português o âmbito implícito da formulação.
- source_word: sonus vocis hominis
  choice: o som da voz humana
  rationale: Reproduz com clareza a construção latina, usando 'humana' como equivalente natural de hominis neste contexto.
- source_word: abs te
  choice: provinha de ti
  rationale: Preserva a noção de origem ou procedência, sem acrescentar explicitamente que a voz foi criada por Deus.
theological_decisions:
- issue: Identidade de spiritus no cenário da criação
  choice: espírito, em minúscula
  alternative: Espírito, em maiúscula; ou vento
  rationale: O latim não contém distinção gráfica que determine a identificação. A minúscula conserva a ambiguidade e evita impor uma interpretação trinitária ou meramente meteorológica.
- issue: Sentido da origem expressa por abs te
  choice: a voz humana ainda não provinha de ti
  alternative: a voz humana ainda não tinha sido criada por ti
  rationale: A tradução escolhida mantém a formulação de origem ou agência do latim sem transformar a alusão em uma declaração explícita sobre criação.
translation_notes:
  register: Português moderno, claro e solene, com tratamento por “ti” adequado à fala dirigida a Deus. A coordenação e o ponto e vírgula conservam o ritmo contemplativo do latim.
