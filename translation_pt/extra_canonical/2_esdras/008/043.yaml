lexical_decisions:
- source_word: in tempore
  choice: no tempo certo
  rationale: Expressa de modo natural a ideia temporal do latim, que neste contexto indica a chuva recebida na ocasião adequada.
- source_word: corruptum fuerit
  choice: for arruinado
  rationale: Mantém o sentido de algo que se perde ou se estraga por chuva excessiva, sem especificar além do que o fragmento permite.
- source_word: multitudine pluuiae
  choice: excesso de chuva
  rationale: Transmite em português corrente a abundância danosa indicada pelo latim.
- source_word: homo
  choice: ser humano
  rationale: Representa o sentido genérico de homo, abrangendo a humanidade, e evita uma leitura exclusivamente masculina.
- source_word: plasmatus est
  choice: foi formado
  rationale: Conserva a imagem de modelagem pelas mãos divinas e corresponde diretamente ao verbo latino.
theological_decisions:
- issue: A relação entre o ser humano e a imagem divina
  choice: é chamado de tua imagem
  alternative: é a tua imagem
  rationale: A formulação consultiva diz que o ser humano é chamado imagem de Deus; não se intensifica a afirmação para uma identificação sem qualificação.
- issue: Referente implícito de “corruptum” e “hoc”
  choice: ele
  alternative: a semente
  rationale: O fragmento latino depende do contexto anterior e não nomeia aqui o referente. O pronome preserva essa dependência e evita inserir explicitamente “semente” no texto.
translation_notes:
  register: Português moderno, claro e digno, com formas amplamente compreensíveis no Brasil e em outros contextos lusófonos. A sintaxe conserva o caráter de continuação do trecho, que começa no meio de uma frase.
