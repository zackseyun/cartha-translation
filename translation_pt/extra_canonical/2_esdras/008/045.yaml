  text: let it not be upon us[a], but spare your people and have mercy on your inheritance, for you have mercy on your own creation.”
translation:
  language: pt
  text: que isso não recaia sobre nós[a]. Poupa, porém, o teu povo e tem misericórdia da tua herança, pois tens misericórdia da tua criação.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, conforme uma divisão textual anterior, pode-se iniciar o versículo com: “Poupa, porém, o teu povo...”'
