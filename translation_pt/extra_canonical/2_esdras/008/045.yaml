lexical_decisions:
- source_word: super nos
  choice: recaia sobre nós
  rationale: A expressão completa a negação iniciada no versículo anterior e formula uma súplica para que aquilo não venha sobre o orante e seu povo.
- source_word: parce
  choice: Poupa
  rationale: Traduz diretamente o imperativo latino, preservando o tom de súplica.
- source_word: haereditati tuae
  choice: tua herança
  rationale: Mantém a metáfora bíblica tradicional do povo como herança de Deus.
- source_word: tuae enim creaturae misereris
  choice: pois tens misericórdia daquilo que tu mesmo criaste
  rationale: Expressa com naturalidade que o objeto da misericórdia é a própria criação de Deus, sem limitar creatura a um indivíduo específico.
theological_decisions:
- issue: Referente de creaturae
  choice: daquilo que tu mesmo criaste
  alternative: da tua criatura
  rationale: O latim pode ser vertido literalmente no singular, mas a formulação escolhida preserva a amplitude referencial e evita sugerir, sem base suficiente, uma única criatura individual.
translation_notes:
  register: Português moderno, claro e reverente. A abertura em minúscula sinaliza que a frase continua sintaticamente o versículo anterior; o ponto após a súplica produz uma leitura natural sem apagar essa continuidade.
