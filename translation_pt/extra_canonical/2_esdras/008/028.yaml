  text: but remember those who have willingly acknowledged your fear. Do not be willing to destroy those who have had the ways of cattle[a], but look upon those who
translation:
  language: pt
  text: mas lembra-te dos que reconheceram voluntariamente o temor a ti. Não queiras destruir os que tiveram comportamento de animais, mas olha para os que
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: memorare
  choice: lembra-te
  rationale: Imperativo de memória ativa dirigido a Deus; a forma pronominal é natural e digna em português.
- source_word: ex uoluntate
  choice: de boa vontade
  rationale: Expressa ação voluntária e evita o sentido moderno de simples desejo; a construção latina também admite referência à vontade de Deus, registrada em nota.
- source_word: tuum timorem
  choice: o temor de ti
  rationale: Torna claro que Deus é o objeto do temor, sem sugerir que se trate do temor sentido por Deus.
- source_word: cognouerunt
  choice: reconheceram
  rationale: No contexto, indica reconhecer ou admitir reverentemente a autoridade divina, mais do que apenas adquirir conhecimento intelectual.
- source_word: pecorum mores
  choice: modos de animais
  rationale: Preserva a comparação depreciativa do latim sem restringir pecora ao sentido português mais estreito de 'gado'.
- source_word: respicias
  choice: olha para
  rationale: Mantém o contraste entre destruir e voltar a atenção favorável para alguém, sem explicitar além do texto.
theological_decisions:
- issue: Referente de ex uoluntate
  choice: de boa vontade
  alternative: segundo a tua vontade
  rationale: A leitura adverbial voluntária é sintaticamente natural e está de acordo com a consulta inglesa, mas a possível referência à vontade divina é preservada em nota.
- issue: Sentido de temor
  choice: o temor de ti
  alternative: o teu temor
  rationale: A formulação escolhida preserva Deus como objeto do temor e evita uma ambiguidade possessiva desnecessária em português.
translation_notes:
  register: Português moderno, claro e reverente, com tratamento na segunda pessoa singular. A frase termina em “os que” porque o trecho latino fornecido e a divisão do versículo interrompem a oração nesse ponto; não se completou o sentido por conjectura.
