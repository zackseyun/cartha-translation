  text: 'plantat, sed non in tempore omnia quae seminata sunt saluabuntur, sed nec omnia quae plantata sunt radicabunt, sic et qui in saeculo seminati sunt non omnes saluabuntur. Et respondi et dixi : si inueni gratiam coram te loquar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/041.yaml
  text: plants[a], but not everything that has been sown will be saved in its time, nor will everything that has been planted take root; so also those who have been sown in the world will not all be saved.” And I answered and said, “If I have found favor before you, let me speak.”
translation:
  language: pt
  text: 'planta, mas nem tudo o que foi semeado será salvo em seu tempo, nem tudo o que foi plantado criará raízes. Assim também, nem todos os que foram semeados no mundo[a] serão salvos”. Então respondi: “Se encontrei favor diante de ti, permite-me falar”.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “na era”.'
    reason: O latim saeculum pode ter sentido espacial (“mundo”) ou temporal (“era”, “época”).
lexical_decisions:
- source_word: plantat
  choice: planta
  rationale: Mantém o verbo inicial como continuação direta do versículo anterior, sem importar para este versículo o sujeito ou outros elementos do contexto precedente.
- source_word: in tempore
  choice: em seu tempo
  rationale: Reproduz de perto a expressão temporal latina e conserva o paralelo agrícola.
- source_word: radicabunt
  choice: criará raízes
  rationale: Expressão natural em português para o ato de uma planta se enraizar.
- source_word: in saeculo
  choice: no mundo
  rationale: No contexto, designa o âmbito da existência humana; a possível leitura temporal, “na era”, é preservada em nota.
- source_word: si inueni gratiam coram te
  choice: se encontrei favor diante de ti
  rationale: Preserva a fórmula respeitosa do latim em linguagem bíblica clara e atual.
- source_word: loquar
  choice: permite-me falar
  rationale: Expressa naturalmente o subjuntivo de pedido após a fórmula condicional, sem convertê-lo numa afirmação categórica.
theological_decisions:
- issue: Repetição de saluabuntur
  choice: Traduzir ambas as ocorrências com formas de “ser salvo”
  alternative: Traduzir a primeira como “ser preservado” e a segunda como “ser salvo”
  rationale: A repetição lexical sustenta explicitamente a comparação entre as sementes e as pessoas; mantê-la evita enfraquecer a tensão soteriológica do texto.
- issue: Sentido de saeculum
  choice: “mundo” no texto, com “era” em nota
  alternative: “era” no texto principal
  rationale: “Mundo” se ajusta bem à imagem dos seres humanos semeados no âmbito da existência presente, enquanto a nota conserva a ambiguidade lexical latina.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A abertura em minúscula sinaliza que “planta” continua a frase do versículo anterior. Evitou-se repetir neste versículo o agricultor e as muitas sementes mencionados anteriormente, pois esses elementos não aparecem no texto latino fornecido de 8:41.
