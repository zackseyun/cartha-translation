lexical_decisions:
- source_word: contempserunt
  choice: desprezaram
  rationale: Expressa diretamente o sentido de tratar com desprezo ou desconsiderar, mantendo a força do perfeito latino.
- source_word: uias eius
  choice: os caminhos dele
  rationale: Preserva a referência masculina singular de «eius» e evita a possível ambiguidade de «seus caminhos» em português.
- source_word: dereliquerunt
  choice: abandonaram
  rationale: Verbo corrente e digno que comunica claramente a ideia de deixar para trás ou desertar.
- source_word: Adhuc autem et
  choice: Além disso, também
  rationale: Reproduz a transição aditiva do fragmento latino; a formulação permanece incompleta porque o texto-fonte termina no conectivo «et».
