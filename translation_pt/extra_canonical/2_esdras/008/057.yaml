  register: Português moderno, claro e digno. Mantiveram-se a inicial minúscula e o término sintaticamente incompleto, pois a unidade fornecida começa e termina no meio de uma frase. A nota inglesa de «previous_rendering» não foi reproduzida, porque descreve uma tradução anterior de outro trecho latino, não uma variante legítima desta unidade.
