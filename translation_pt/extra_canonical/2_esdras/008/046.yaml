  yaml_path: translation/extra_canonical/2_esdras/008/046.yaml
  text: And he answered me and said[a], “What is present is for the present, and what is future is for the future.
translation:
  language: pt
  text: 'E ele me respondeu e disse: “O que é presente é para os que vivem no presente, e o que é futuro, para os que vivem no futuro.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “O que pertence ao presente é para o presente, e o que pertence ao futuro, para o futuro.”'
    reason: Registra a possível compreensão temporal abstrata de praesentibus e futuris, preservando a ambiguidade de interpretação.
lexical_decisions:
- source_word: quae sunt praesentia
  choice: o que é presente
  rationale: Reproduz de modo natural a construção relativa latina e mantém o paralelismo com quae futura.
- source_word: praesentibus
  choice: para os que estão presentes
  rationale: O dativo plural pode designar as pessoas que pertencem ao tempo presente; a formulação preserva esse valor pessoal indicado pela morfologia.
- source_word: quae futura futuris
  choice: o que é futuro, para os que estarão no futuro
  rationale: Mantém a oposição escatológica e o paralelismo entre as realidades presentes e futuras e seus respectivos destinatários.
theological_decisions:
- issue: Se praesentibus e futuris indicam pessoas ou períodos abstratos
  choice: 'Traduzir no texto principal como grupos de pessoas: “os que estão presentes” e “os que estarão no futuro”.'
  alternative: 'Entender os dativos em sentido temporal abstrato: “para o presente” e “para o futuro”.'
  rationale: As formas latinas são dativos plurais e admitem naturalmente referência pessoal, adequada ao contraste apocalíptico; a leitura temporal tradicional continua registrada em nota para não eliminar a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo conciso. A oração incompleta “Multum enim tibi restat ut” foi tratada como o início do versículo seguinte, conforme a divisão tradicional, e não foi incluída em 8:46.
