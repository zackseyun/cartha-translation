  text: you[a], and have not judged yourself among the righteous, so that you might be more greatly glorified.
translation:
  language: pt
  text: a ti,[a] e não te julgaste entre os justos, para que sejas ainda mais glorificado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino deste versículo começa no meio de uma frase, continuando a oração do versículo anterior.
    reason: A forma inicial «a ti» é um fragmento sintático herdado da divisão dos versículos; a nota evita que o leitor a tome por uma frase portuguesa defeituosa.
lexical_decisions:
- source_word: non iudicasti te inter iustos
  choice: não te julgaste entre os justos
  rationale: Mantém a construção reflexiva e a ideia de não se incluir ou considerar entre os justos, sem transformar o texto em uma declaração objetiva sobre sua justiça.
- source_word: ut plurimum glorificeris
  choice: para que sejas ainda mais glorificado
  rationale: Preserva a construção final com ut e o passivo de glorificeris; «ainda mais» comunica naturalmente a força comparativa/intensificadora de plurimum neste contexto.
theological_decisions:
- issue: O motivo de não se considerar entre os justos e sua relação com a glorificação
  choice: para que sejas ainda mais glorificado
  alternative: de modo que sejas grandemente glorificado
  rationale: A tradução conserva a relação final expressa por ut e não explica quem glorifica a pessoa nem resolve a tensão entre humildade e glorificação.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. Conservou-se o início fragmentário exigido pelo texto latino e pela divisão tradicional dos versículos.
