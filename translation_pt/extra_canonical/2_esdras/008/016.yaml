- source_word: lugeo
  choice: choro
  rationale: Expressa de modo natural e digno o lamento intenso indicado pelo verbo latino.
- source_word: tristis sum
  choice: estou triste
  rationale: Tradução direta que preserva a distinção em relação a «lugeo».
- source_word: semine Iacob
  choice: descendência de Jacó
  rationale: Comunica em português atual o sentido genealógico coletivo de «semente», evitando uma literalidade pouco natural.
