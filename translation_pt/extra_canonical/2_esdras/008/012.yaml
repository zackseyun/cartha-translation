- source_word: tuae iustitiae
  choice: com a tua justiça
  rationale: O genitivo latino ligado a «enutristi» pode indicar aquilo com que ele foi nutrido; «com» comunica isso naturalmente em português.
- source_word: erudisti
  choice: instruíste
  rationale: Equivalente claro e atual para ensinar ou formar.
- source_word: corripuisti
  choice: corrigiste
  rationale: Preserva o sentido de repreender com finalidade corretiva sem intensificá-lo indevidamente.
- source_word: tuo intellectu
  choice: por meio do teu entendimento
  rationale: Torna explícito o valor instrumental do ablativo e evita que «com» sugira mera companhia.
