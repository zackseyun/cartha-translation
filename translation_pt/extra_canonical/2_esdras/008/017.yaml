  yaml_path: translation/extra_canonical/2_esdras/008/017.yaml
  text: Because of this I am troubled. Therefore I will begin to pray before you for myself and for them[a], because I see the falls of us who inhabit the earth.
translation:
  language: pt
  text: Por isso, estou perturbado. Portanto, começarei a orar diante de ti por mim e por eles, pois vejo as nossas quedas, nós que habitamos a terra.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conturbor
  choice: estou perturbado
  rationale: Expressa de modo natural o presente passivo latino e conserva a forte inquietação do orador.
- source_word: coram te
  choice: diante de ti
  rationale: Mantém a imagem relacional e reverente do latim em português bíblico atual.
- source_word: lapsos nostros qui inhabitamus
  choice: como nós, os que habitamos a terra, caímos
  rationale: Entende lapsos como forma participial referente ao próprio grupo do orador. A formulação evita o português artificial «nossas quedas» e preserva a força de uma condição de queda, em vez de reduzi-la a pequenas falhas.
theological_decisions:
- issue: Força moral e existencial de lapsos
  choice: caímos
  alternative: temos falhas / nossas falhas
  rationale: «Caímos» conserva o peso da condição humana lamentada no contexto e não enfraquece o termo para meras imperfeições.
- issue: Referente de pro eis
  choice: por eles
  alternative: por elas
  rationale: O referente não aparece neste versículo; mantém-se o pronome masculino plural sem explicitar sua identidade, preservando a dependência do contexto.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento reverente na segunda pessoa singular. A sintaxe final foi tornada idiomática sem resolver além do necessário a construção latina difícil.
