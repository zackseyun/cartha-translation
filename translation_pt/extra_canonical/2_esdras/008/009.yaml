  rationale: Expressa o sentido contextual de o ventre devolver ou produzir novamente, sem perder a ideia de repetição indicada por «iterum».
theological_decisions:
- issue: Agente e objeto da preservação
  choice: Conservar as expressões indefinidas «aquilo que preserva» e «aquilo que é preservado».
  alternative: Identificar explicitamente a mãe, o ventre, o embrião ou Deus.
  rationale: O latim é abstrato e não identifica de modo inequívoco os referentes; explicitá-los resolveria indevidamente a ambiguidade.
- issue: «tua preservação»
  choice: Manter a segunda pessoa e a formulação nominal.
  alternative: Parafrasear como «pelo teu poder protetor» ou «porque tu os guardas».
  rationale: A redação conserva a atribuição direta ao interlocutor divino e o paralelismo lexical da fonte.
translation_notes:
  register: Português moderno, digno e de ampla compreensão. A frase termina de modo incompleto porque o texto fornecido termina em «quae» («aquilo que»), continuando no versículo ou segmento seguinte.
