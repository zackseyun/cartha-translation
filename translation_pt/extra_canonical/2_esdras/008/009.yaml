- source_word: seruat / seruatur / seruabuntur / seruatione
  choice: preserva / é preservado / serão preservados / preservação
  rationale: Mantém deliberadamente a repetição lexical e o jogo verbal do latim, sem explicar além do que o fragmento afirma.
- source_word: matrix
