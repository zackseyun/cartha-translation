  text: mas para os que te serviram em verdade. Não dês atenção[a] aos esforços dos que agem de modo ímpio,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Não consideres”.'
    reason: O verbo latino pode significar dirigir a atenção a algo ou levá-lo em consideração.
lexical_decisions:
- source_word: servierunt (preservado apenas parcialmente no trecho como erunt)
  choice: serviram
  rationale: O início do trecho latino conserva apenas o final da forma verbal, enquanto o contexto textual sustenta o sentido de prestar serviço a Deus.
- source_word: in veritate
  choice: em verdade
  rationale: Mantém de forma direta a ideia de serviço caracterizado pela verdade ou fidelidade, sem eliminar essa possível amplitude.
- source_word: adtendas
  choice: dês atenção
  rationale: Expressa em português atual o ato de dirigir a atenção ou consideração a algo, evitando o sentido de cuidar ou resolver.
- source_word: impie agentium
  choice: dos que agem de modo ímpio
  rationale: Reproduz tanto a ação quanto sua caracterização moral, sem restringir o referente a um grupo específico.
- source_word: studia
  choice: esforços
  rationale: No contexto, indica empenhos, intentos ou ocupações; “esforços” é natural e preserva a orientação ativa do termo.
theological_decisions:
- issue: Sentido de in veritate
  choice: em verdade
  alternative: com fidelidade
  rationale: A tradução mais formal preserva a tensão entre verdade e fidelidade, sem decidir por apenas uma dessas nuances.
- issue: Referente de impie agentium
  choice: os que agem de modo ímpio
  alternative: os ímpios
  rationale: A formulação verbal acompanha o latim e evita transformar uma descrição de conduta numa categoria fixa de pessoas.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com construção natural para leitores brasileiros. A pontuação final em vírgula preserva a continuidade sintática do texto latino para o versículo seguinte.
