  text: 'E respondi e disse: “Eis que agora, Senhor, me mostraste uma multidão'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spondi et dixi
  choice: E eu respondi
  rationale: O texto representa a fórmula latina equivalente a «respondi et dixi». Em português atual, «respondi» transmite naturalmente a fórmula sem a redundância pouco idiomática de «respondi e disse».
- source_word: Ecce nunc, domine
  choice: Vê, Senhor, agora
  rationale: «Vê» preserva a força discursiva de ecce, enquanto «Senhor» mantém o vocativo e «agora» corresponde a nunc.
- source_word: demonstrasti mihi multi-
  choice: me mostraste uma multidão
  rationale: O fragmento multi- é o início de «multitudinem», palavra dividida no limite do versículo na edição latina. «Uma multidão» preserva o início da construção, que será completada no versículo seguinte.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível. A frase permanece aberta no fim do versículo porque o manuscrito impresso divide «multitudinem» entre os versículos 62 e 63; não se acrescentou aqui o complemento pertencente ao versículo seguinte.
