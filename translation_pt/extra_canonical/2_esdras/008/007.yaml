  text: will bear the place of a man. For you alone are one[a], and we are one thing formed by your hands, as you have spoken.
translation:
  language: pt
  text: ocupará o lugar de um ser humano.[a] Pois tu és único, e nós somos uma só obra moldada por tuas mãos, como disseste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Algumas versões antigas pressupõem: “terá a forma de um ser humano”. É possível que o latim “lugar” reflita uma antiga confusão textual entre palavras gregas semelhantes para “lugar” e “forma”.'
    reason: Registra uma variante antiga relevante e a provável explicação do difícil locum latino sem substituir silenciosamente o texto da edição-base.
lexical_decisions:
- source_word: portabit locum hominis
  choice: ocupará o lugar de um ser humano
  rationale: Reproduz o futuro de portabit e o sentido idiomático de locum hominis em português natural, sem transformar no texto principal a possível reconstrução subjacente baseada nas versões antigas.
- source_word: Solus enim es
  choice: Pois só tu és único
  rationale: Expressa a singularidade indicada por solus, preservando a formulação teológica concisa e evitando o português pouco natural de uma tradução mecânica como 'só tu és'.
- source_word: una plasmatio
  choice: uma única obra moldada
  rationale: Plasmatio designa aquilo que foi formado ou modelado; 'obra moldada' mantém a imagem artesanal e liga-se naturalmente à menção das mãos de Deus.
- source_word: manuum tuarum
  choice: por tuas mãos
  rationale: Mantém diretamente a metáfora antropomórfica do latim em linguagem corrente e digna.
theological_decisions:
- issue: Singularidade divina em Solus enim es
  choice: só tu és único
  alternative: só tu existes
  rationale: A alternativa poderia sugerir que nenhuma outra realidade existe. A opção adotada afirma a incomparabilidade ou singularidade de Deus sem introduzir essa conclusão metafísica.
- issue: Unidade da humanidade como una plasmatio
  choice: uma única obra moldada
  alternative: uma só criatura
  rationale: A escolha preserva tanto a unidade coletiva quanto a imagem de formação pelas mãos divinas, sem reduzir plasmatio simplesmente a um indivíduo criado.
- issue: Leitura de locum em contraste com a provável reconstrução 'forma'
  choice: lugar no texto principal, com a variante explicada em nota
  alternative: forma de um ser humano
  rationale: O texto latino fornecido traz locum, enquanto versões antigas e uma possível reconstrução do grego apontam para 'forma'. Manter 'lugar' no texto e registrar 'forma' em nota conserva transparentemente a tensão textual.
translation_notes:
  register: Português moderno, claro e solene, com legibilidade brasileira e vocabulário amplamente internacional. “Ser humano” evita que hominis seja entendido como referência exclusiva ao sexo masculino. A nota preserva a incerteza textual real.
