source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam uiuificans uiuificas nunc in matrice plasmatum corpus et praestas membra, conseruatur in igni et aqua tua creatio et nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/008.yaml
  text: And because[a], giving life, you now give life in the womb to the body that has been formed, and you provide its members, your creation is preserved in fire and water, and for nine months your formation bears your creature that has been created in it.
translation:
  language: pt
  text: E, visto que, ao dar vida, agora dás vida no ventre ao corpo já formado e lhe concedes membros, tua criação é preservada no fogo e na água; e, por nove meses, tua formação sustenta tua criatura, que nele foi criada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuificans uiuificas
  choice: ao dar vida, agora dás vida
  rationale: Preserva a repetição enfática do particípio e do verbo cognato, com construção natural em português.
- source_word: in matrice
  choice: no ventre
  rationale: Neste contexto de gestação, «ventre» comunica de modo claro e digno o sentido de matrix.
- source_word: plasmatum corpus
  choice: o corpo já formado
  rationale: Traduz o particípio passivo de plasmare sem sugerir apenas criação abstrata; «já» expressa o estado resultante.
- source_word: praestas membra
  choice: lhe concedes membros
  rationale: Mantém o sentido de prover ou conceder os membros ao corpo formado.
- source_word: conseruatur
  choice: é preservada
  rationale: Reproduz a voz passiva e o sentido de conservação ou proteção.
- source_word: tua plasmatio
  choice: tua formação
  rationale: Mantém a relação lexical com plasmatum e evita identificar o termo, sem apoio textual, com um órgão específico.
- source_word: patitur
  choice: carrega
  rationale: No contexto dos nove meses de gestação, expressa a ideia de suportar ou levar no interior, sem o tom inadequadamente negativo de «sofre».
- source_word: in eo
  choice: ali
  rationale: O pronome latino tem referência difícil; o advérbio evita impor em português um antecedente gramatical específico.
theological_decisions:
- issue: Agência divina na formação pré-natal
  choice: Mantida a segunda pessoa dirigida a Deus em «dás vida», «concedes» e «tua».
  alternative: Reformular como processo natural impessoal.
  rationale: O texto atribui diretamente a Deus a vivificação, a concessão dos membros e a formação; a tradução conserva essa afirmação sem ampliá-la doutrinariamente.
- issue: Referência ambígua de «in eo»
  choice: «ali»
  alternative: «nela», referindo-se explicitamente à formação ou ao ventre.
  rationale: A concordância latina não permite identificar com segurança o antecedente, e a tradução não deve resolver silenciosamente essa dificuldade.
translation_notes:
  register: Português moderno, claro e solene, com formas de segunda pessoa singular para conservar a oração dirigida a Deus. A sintaxe foi levemente reorganizada para fluidez, mantendo a repetição de «dar vida» e a difícil imagem final.
