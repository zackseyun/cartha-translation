- from: E, visto que, ao dar vida, agora dás vida no ventre ao corpo já formado e lhe concedes membros, tua criação é preservada no fogo e na água[a]; e, durante nove meses, tua formação carrega a criatura que criaste, a qual foi criada ali.
  to: E, visto que, ao dar vida, agora dás vida no ventre ao corpo já formado e lhe concedes membros, tua criação é preservada no fogo e na água; e, por nove meses, tua formação sustenta tua criatura, que nele foi criada.
