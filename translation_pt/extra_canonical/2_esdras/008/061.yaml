  verdict: revise
  source_fidelity: 'O texto latino preservado diz diretamente «[haec] omnibus demonstraui nisi tibi et tibi similibus paucis»: “mostrei [estas coisas] a todos, exceto a você e a poucos como você”. A redação proposta inverte indevidamente o alcance de «nisi», fazendo de Esdras e dos poucos semelhantes os únicos destinatários, quando são a exceção.'
  naturalness: “Você” é apropriado ao registro-alvo. “A poucos como você” é mais natural e igualmente fiel a «tibi similibus paucis». O travessão após “E” representa adequadamente a palavra interrompida no fim do fragmento.
  terminology: Não há termo teológico técnico a ajustar. “Estas coisas” é uma explicitação contextual prudente do objeto de «demonstraui», também refletida na trilha inglesa.
  issues:
  - severity: high
    issue: Inversão do sentido de «nisi»
    rationale: «Omnibus demonstraui nisi tibi et tibi similibus paucis» significa que a demonstração foi feita a todos, com exceção de Esdras e de poucos como ele; não que tenha sido feita somente a eles.
  - severity: medium
    issue: Nota de rodapé introduz uma ambiguidade inexistente
    rationale: A alternativa proposta na nota é, na realidade, o sentido gramatical normal do latim preservado. O contexto não justifica alterar esse sentido nem apresentar a tradução invertida como preferível.
  revised_text: Eu mostrei estas coisas a todos, exceto a você e a poucos como você. E—
