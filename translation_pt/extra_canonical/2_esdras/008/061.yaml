  text: I have shown these things to all[a], but to you and to a few like you. And—
translation:
  language: pt
  text: Eu mostrei estas coisas a todos, exceto a você e a poucos como você. E—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnibus demonstraui nisi tibi et tibi similibus paucis
  choice: Não mostrei estas coisas a todos, mas somente a você e a poucos semelhantes a você
  rationale: 'A frase latina preservada começa no meio da construção. Lida no contexto transmitido, “nisi” introduz a exceção: a revelação não foi dada a todos, mas a Esdras e a poucos semelhantes a ele. “Estas coisas” explicita em português o objeto subentendido de “demonstraui”.'
- source_word: et re-
  choice: E—
  rationale: O texto-fonte termina com uma palavra truncada depois de “et”. O travessão preserva a interrupção sem inventar a continuação não fornecida.
theological_decisions:
- issue: Destinatários da revelação
  choice: não a todos, mas somente a você e a poucos semelhantes a você
  alternative: a todos, exceto a você e a poucos semelhantes a você
  rationale: Embora o fragmento isolado possa parecer permitir uma leitura com “todos” como destinatários, o uso de “nisi” e o contexto da oração incompleta sustentam a leitura exclusiva tradicional, sem definir teologicamente quem seriam os “semelhantes” a Esdras.
translation_notes:
  register: Português moderno, claro e digno, com tratamento por “você” para ampla legibilidade brasileira. A interrupção final do manuscrito foi mantida por meio de travessão.
