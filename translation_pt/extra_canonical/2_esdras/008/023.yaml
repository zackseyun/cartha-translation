    rationale: Embora «presença» seja uma leitura contextual possível, ela se afasta da imagem de «aspectus», que se refere mais diretamente a aparência, aspecto ou visão. «Aparência» conserva essa imagem sem impor uma descrição física.
  - severity: low
    issue: Construção causativa com «se derreterem»
    rationale: O latim «tabescere facit montes» significa que a indignação faz os montes derreter. O infinitivo simples em português torna a relação causativa mais direta.
