  text: 'terribilis, cuius aspectus arefacit abyssos et indignatio tabescere facit montes et ueritas testificatur : Exaudi, domine, orationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/023.yaml
  text: 'terrible, whose appearance dries up the depths, and whose indignation makes the mountains melt, and whose truth bears witness: Hear, O Lord, the prayer'
translation:
  language: pt
  text: 'terrível, cuja aparência seca os abismos, cuja indignação faz os montes derreter e cuja verdade dá testemunho: Ouve, Senhor, a oração'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terribilis
  choice: terrível
  rationale: Preserva o sentido de alguém que inspira temor, mantendo o tom elevado da invocação.
- source_word: aspectus
  choice: presença
  rationale: No contexto, comunica a manifestação ou o comparecimento aterrador, com mais naturalidade do que uma referência apenas à aparência visual.
- source_word: arefacit abyssos
  choice: resseca os abismos
  rationale: Reproduz diretamente a imagem de fazer secar as profundezas.
- source_word: indignatio
  choice: indignação
  rationale: Mantém o termo formal e a força da reação divina expressa no latim.
- source_word: tabescere facit montes
  choice: faz os montes se derreterem
  rationale: Conserva a construção causativa e a imagem do desfazimento dos montes.
- source_word: ueritas testificatur
  choice: verdade dá testemunho
  rationale: Tradução direta que preserva a personificação e não explicita o conteúdo do testemunho.
- source_word: Exaudi
  choice: Ouve
  rationale: Forma natural e dignificada de súplica, que neste contexto implica atender favoravelmente.
theological_decisions:
- issue: Agente e conteúdo de «ueritas testificatur»
  choice: cuja verdade dá testemunho
  alternative: cuja fidelidade o atesta
  rationale: Mantém a ambiguidade do substantivo «verdade» e do conteúdo não expresso do testemunho, sem inserir interpretação explicativa.
- issue: Sentido de «aspectus» aplicado a Deus
  choice: cuja presença
  alternative: cujo aspecto
  rationale: «Presença» expressa naturalmente o efeito da manifestação divina sem sugerir necessariamente uma descrição física, embora «aspecto» seja lexicalmente possível.
translation_notes:
  register: Português atual, solene e amplamente compreensível, com paralelismo mantido pelas três ocorrências de «cuja». O fragmento começa em continuação sintática e termina com «a oração», conforme o recorte do versículo fornecido.
