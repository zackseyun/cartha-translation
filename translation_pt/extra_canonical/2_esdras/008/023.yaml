  naturalness: O registro é solene e natural para uma oração. «Aparência» e o infinitivo simples após «faz» soam idiomáticos e preservam o paralelismo do trecho.
  terminology: «Terrível», «abismos», «indignação» e «verdade dá testemunho» são escolhas adequadas. «Senhor» mantém o vocativo devocional sem acrescentar interpretação.
