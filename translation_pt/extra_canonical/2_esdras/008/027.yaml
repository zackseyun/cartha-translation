  text: mas para os que guardaram as tuas alianças com sofrimentos. Não penses naqueles que agiram falsamente diante de ti,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: testamenta
  choice: alianças
  rationale: No contexto religioso, o plural latino designa compromissos ou alianças estabelecidos por Deus; «alianças» é natural e preserva esse sentido.
- source_word: cum doloribus
  choice: com sofrimentos
  rationale: Mantém a relação ampla expressa por cum sem especificar indevidamente se as alianças foram guardadas durante, por meio de ou apesar dos sofrimentos.
- source_word: custodierunt
  choice: guardaram
  rationale: Reproduz o sentido de observar, conservar ou cumprir fielmente.
- source_word: Neque cogites
  choice: Não penses
  rationale: Tradução direta da proibição, deixando o complemento desenvolver-se na continuação da frase.
- source_word: qui in
  choice: naqueles que agiram falsamente diante de ti
  rationale: A fonte latina fornecida termina no início da expressão; a redação segue a continuação atestada na camada inglesa auditada, em português natural.
theological_decisions:
- issue: Natureza de testamenta
  choice: alianças
  alternative: testamentos; mandamentos
  rationale: «Alianças» preserva a linguagem relacional e religiosa sem reduzir o termo a disposições testamentárias ou identificá-lo especificamente com mandamentos.
- issue: Relação entre fidelidade e sofrimento
  choice: com sofrimentos
  alternative: em meio a sofrimentos; por meio de sofrimentos
  rationale: A formulação evita decidir se o sofrimento é circunstância, instrumento ou acompanhamento da guarda das alianças.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com leitura natural no Brasil. Conservou-se a estrutura fragmentária do versículo e a vírgula final, pois a frase continua no versículo seguinte.
