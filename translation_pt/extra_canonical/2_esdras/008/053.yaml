translation:
  language: pt
  text: A sabedoria foi aperfeiçoada de antemão. A raiz foi selada por vocês[a], a fraqueza foi extinguida por vocês, e a morte foi escondida; o Hades fugiu, e
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, em uma tradução anterior: “Pois para vocês o paraíso foi aberto, a árvore da vida foi plantada, a era futura foi preparada, a abundância foi deixada pronta, a cidade foi construída, o descanso foi determinado, a bondade foi aperfeiçoada”. Essa redação corresponde ao conteúdo tradicionalmente associado ao versículo anterior, não às palavras latinas aqui impressas.'
    reason: previous_rendering
lexical_decisions:
- source_word: ante perfecta sapientia
  choice: A sabedoria foi aperfeiçoada de antemão
  rationale: Preserva a construção passiva e o valor temporal de ante, sem completar ou harmonizar o fragmento com o contexto anterior.
- source_word: Radix
  choice: A raiz
  rationale: Equivalente direto, mantendo a imagem metafórica sem interpretação adicional.
- source_word: signata est
  choice: foi selada
  rationale: Reproduz o perfeito passivo latino e conserva a possível ideia de fechamento, autenticação ou proteção.
- source_word: a uobis
  choice: por vocês
  rationale: Na construção passiva, a com ablativo indica naturalmente o agente; a forma moderna 'vocês' oferece ampla legibilidade em português.
- source_word: infirmítas
  choice: a fraqueza
  rationale: Termo corrente que preserva a amplitude de debilidade ou incapacidade do latim.
- source_word: extincta est
  choice: foi extinguida
  rationale: Mantém a metáfora e a voz passiva do original, em vez de reduzir o sentido a 'acabou'.
- source_word: mors absconsa est
  choice: a morte foi escondida
  rationale: Tradução direta da leitura restaurada mors e do perfeito passivo absconsa est.
- source_word: infernus
  choice: o Hades
  rationale: Distingue o domínio dos mortos de uma formulação especificamente ligada ao castigo final; preserva a personificação em 'fugiu'.
theological_decisions:
- issue: Sentido de infernus
  choice: o Hades
  alternative: o mundo dos mortos / o inferno
  rationale: '''Hades'' conserva a referência ao domínio dos mortos e evita impor a noção posterior e mais estreita de lugar de punição eterna.'
- issue: Agência em a uobis
  choice: por vocês
  alternative: de vocês / para vocês
  rationale: A sintaxe latina favorece agente da passiva. A formulação é mantida mesmo que pareça teologicamente tensa, sem corrigir o texto por conjectura contextual.
- issue: Leitura entre colchetes [mors] na fonte
  choice: a morte
  alternative: omitir o substantivo ou sinalizar lacuna no corpo
  rationale: A edição fornece mors como restauração inteligível; a tradução o inclui, ao mesmo tempo que registra sua condição textual em nota.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A sequência final permanece aberta em “e”, pois o texto latino fornecido também termina com et e continua no versículo seguinte. A repetição de “por vocês” foi preservada para refletir a sintaxe e a tensão do original.
