  yaml_path: translation/extra_canonical/2_esdras/008/002.yaml
  text: But I will set forth a comparison before you[a], Ezra. Just as, if you ask the earth, it will tell you that it yields much clay, from which earthen vessels are made, but little dust from which gold comes[b],
translation:
  language: pt
  text: Mas apresentarei diante de você uma comparação[a], Esdras. Se você perguntar à terra, ela lhe dirá que produz muito mais terra, da qual se fazem objetos de barro, mas pouco pó, do qual vem o ouro[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “lhe direi uma comparação”.'
    reason: Registra uma tradução mais direta de dicam, enquanto a redação principal também exprime coram te.
  - marker: b
    text: 'Ou: “pouco pó, do qual o ouro se forma”.'
    reason: Explicita a alternativa mais literal para aurum fit, sem introduzir uma noção de extração.
lexical_decisions:
- source_word: Dicam autem coram te similitudinem
  choice: Mas apresentarei diante de você uma comparação
  rationale: Preserva tanto a introdução adversativa de autem quanto o elemento explícito coram te, em português natural e digno.
- source_word: terram multam magis
  choice: terra em quantidade muito maior
  rationale: Mantém terra e expressa a força comparativa de magis, destacando a desproporção em relação ao pouco pó aurífero.
- source_word: fictile
  choice: objetos de barro
  rationale: O substantivo latino designa aquilo que é feito de barro; a forma plural genérica é clara e idiomática em português.
- source_word: puluerem unde aurum fit
  choice: pó do qual se obtém ouro
  rationale: Representa o pó ou material terroso de onde provém o ouro sem sugerir que o ouro seja literalmente fabricado.
theological_decisions:
- issue: Desproporção entre o material comum e o ouro
  choice: Preservar explicitamente “quantidade muito maior” em contraste com “apenas um pouco”
  alternative: Simplificar para “muita terra” e “pouco pó”
  rationale: A formulação latina multam magis sustenta o contraste quantitativo que conduz a comparação, sem explicitar antecipadamente sua aplicação teológica.
translation_notes:
  register: Português contemporâneo, amplamente compreensível e com leve solenidade narrativa. O tratamento por “você” favorece a legibilidade brasileira sem coloquialismo. A vírgula final foi mantida porque o versículo continua sintaticamente no seguinte.
