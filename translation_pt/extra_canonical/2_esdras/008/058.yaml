  text: they trampled his righteous ones. And they said in their hearts that there is no God[a], though they indeed know that they will die. Just as
translation:
  language: pt
  text: 'pisotearam os seus justos. E disseram no coração: “Deus não existe”, embora saibam muito bem que morrerão. Assim como'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iustos eius
  choice: os justos dele
  rationale: Expressa de modo claro e natural os justos que pertencem a ele, sem transformar o adjetivo substantivado em uma categoria mais específica.
- source_word: conculcauerunt
  choice: pisotearam
  rationale: Preserva a imagem forte de calcar ou esmagar sob os pés, em português atual e acessível.
- source_word: non esse deum
  choice: Deus não existe
  rationale: Reproduz diretamente a negação da existência de Deus no discurso interior; “não há Deus” também seria possível, mas é ligeiramente menos explícito.
- source_word: scientes sciunt
  choice: saibam muito bem
  rationale: Transmite em português natural a ênfase da construção redundante latina, evitando o literalismo pouco idiomático “sabendo, sabem”.
- source_word: moriuntur
  choice: morrerão
  rationale: 'O presente latino é entendido em sentido futuro no conteúdo conhecido: eles sabem que hão de morrer.'
- source_word: Sicut
  choice: Assim como
  rationale: Mantém a ligação comparativa incompleta com o versículo seguinte, sem completar artificialmente a frase.
theological_decisions:
- issue: A negação de Deus pelos ímpios
  choice: “Deus não existe”
  alternative: “não há Deus”
  rationale: A formulação conserva a afirmação do texto como pensamento atribuído aos personagens, sem suavizá-la nem acrescentar uma interpretação sobre ateísmo teórico ou prático.
- issue: Referente de “eius”
  choice: “dele”
  alternative: “de Deus”
  rationale: Mantém o pronome do texto-fonte e evita explicitar um referente que este fragmento pressupõe do contexto anterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. Conserva-se o início em minúscula e o final suspenso porque o trecho fornecido continua uma frase anterior e termina abrindo uma comparação. A antiga nota inglesa não foi mantida, pois contém material deslocado dos versículos anteriores, não uma variante textual legítima de 8:58.
