source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: serui tui et auribus percipe precationem figmenti tui, intende uerba mea. Dum enim uiuo loquar et dum sapio respondeam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/024.yaml
  text: Hear[a], Lord, the prayer of your servant, and give ear to the petition of your creature; pay attention to my words. For while I live I will speak, and while I have understanding I will answer.
translation:
  language: pt
  text: Ouve, Senhor, a oração do teu servo e dá ouvidos à súplica daquele que formaste; presta atenção às minhas palavras. Pois enquanto eu viver, falarei e, enquanto tiver entendimento, responderei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: auribus percipe
  choice: dá ouvidos
  rationale: Expressão idiomática e digna em português que preserva a imagem auditiva do latim sem o literalismo pouco natural de “recebe com os ouvidos”.
- source_word: precationem
  choice: súplica
  rationale: Transmite uma petição fervorosa dirigida a Deus e distingue o termo de “oração”, usado na oração anterior.
- source_word: figmenti tui
  choice: daquele que formaste
  rationale: Preserva a imagem de alguém moldado ou formado por Deus, evitando tanto o impessoal “coisa formada” quanto o mais genérico “criatura”.
- source_word: intende
  choice: presta atenção
  rationale: Equivalente natural do imperativo latino no contexto de um pedido para que Deus atenda às palavras.
- source_word: dum sapio
  choice: enquanto tiver entendimento
  rationale: Reproduz o sentido cognitivo de sapio de modo claro, sem restringi-lo a sabedoria moral.
- source_word: respondeam
  choice: responderei
  rationale: Mantém o paralelismo verbal e o valor futuro assumido no contexto, em correspondência com loquar.
theological_decisions:
- issue: Imagem de Deus como aquele que forma o suplicante
  choice: daquele que formaste
  alternative: tua criatura
  rationale: A formulação escolhida conserva de modo mais explícito a humildade criacional presente em figmentum, sem acrescentar uma formulação doutrinária específica.
- issue: Relação entre fala e entendimento
  choice: enquanto tiver entendimento, responderei
  alternative: enquanto for sábio, responderei
  rationale: “Entendimento” mantém aberto se o texto se refere à capacidade racional, à consciência ou à sabedoria, sem converter a frase numa reivindicação de virtude pessoal.
translation_notes:
  register: Português moderno, claro e reverente, com boa legibilidade brasileira. Mantém o paralelismo das duas orações finais e usa a expressão bíblica corrente “dá ouvidos” sem arcaísmo excessivo.
