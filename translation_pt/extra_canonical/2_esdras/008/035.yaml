source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in veritate enim nemo de genitis est qui non impie gessit, et de confitentibus qui non deliquit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/035.yaml
  text: For truly there is no one among those born who has not acted impiously[a], and among those who confess, no one who has not sinned.
translation:
  language: pt
  text: Pois, na verdade, não há ninguém entre os que nasceram que não tenha agido com impiedade, nem, entre os que confessam[a], quem não tenha pecado.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim preservado lê “os que confessam”. Muitas versões antigas apoiam “os que existem”, possivelmente refletindo uma leitura original diferente.
    reason: textual_variant
lexical_decisions:
- source_word: in veritate enim
  choice: Pois, na verdade
  rationale: Expressa tanto a conexão explicativa de enim como a ênfase asseverativa de in veritate em português natural.
- source_word: de genitis
  choice: entre os que nasceram
  rationale: Reproduz o sentido de pessoas nascidas com linguagem corrente e preserva o paralelismo da frase.
- source_word: impie gessit
  choice: tenha agido com impiedade
  rationale: Mantém o valor moral e religioso de impie sem reduzir a expressão simplesmente a 'pecado'.
- source_word: confitentibus (provável corrupção de consistentibus)
  choice: entre os que existem
  rationale: Adota a leitura restaurada consistentibus, apoiada pelo paralelismo com genitis e pelo consenso das antigas versões derivadas; a leitura latina preservada é indicada em nota.
- source_word: deliquit
  choice: tenha pecado
  rationale: Verte de modo claro o sentido de cometer uma falta moral ou pecado no contexto.
theological_decisions:
- issue: Universalidade do pecado humano
  choice: não há ninguém... que não tenha...
  alternative: todos agiram... todos pecaram
  rationale: A dupla formulação negativa preserva a forma enfática do texto e não amplia nem restringe sua afirmação.
- issue: Leitura textual de confitentibus
  choice: os que existem
  alternative: os que confessam
  rationale: A leitura alternativa explica melhor o paralelismo e é confirmada pelas versões antigas, mas a leitura efetivamente preservada no latim permanece documentada em nota para não ocultar a incerteza textual.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém o paralelismo e a tensão retórica do original sem linguagem denominacional.
