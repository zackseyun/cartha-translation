lexical_decisions:
- source_word: mortificabis
  choice: farás morrer
  rationale: Expressa diretamente o sentido causativo do futuro latino, em português natural e solene.
- source_word: creaturam
  choice: criatura
  rationale: Mantém o mesmo termo nas duas ocorrências, preservando a repetição deliberada do texto latino.
- source_word: uiuificabis
  choice: darás vida
  rationale: Transmite com clareza o sentido de fazer viver ou vivificar, em linguagem corrente e digna.
theological_decisions:
- issue: Agência divina sobre a morte e a vida
  choice: Preservar as formulações diretas «farás morrer» e «darás vida»
  alternative: Atenuar para «permitirás que morra» ou interpretar como ressurreição
  rationale: O latim atribui diretamente ambas as ações ao interlocutor; a tradução não deve suavizar essa tensão nem especificar um mecanismo não declarado.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A repetição de «como tua criatura» é mantida por corresponder à repetição exata de «ut tuam creaturam» no texto-fonte.
