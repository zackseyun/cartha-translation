    rationale: A anteposição de «para vocês» antes do sujeito é possível, mas a colocação após o verbo é mais natural para leitores contemporâneos sem perda de fidelidade.
  - severity: low
    issue: «Foi deixada pronta» para praeparata
    rationale: A expressão é compreensível, mas acrescenta a nuance verbal de «deixar». «Foi preparada» reproduz diretamente o particípio latino e conserva o paralelismo da enumeração.
