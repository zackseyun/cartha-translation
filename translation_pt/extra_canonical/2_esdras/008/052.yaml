  text: gloriam. Vobis enim apertus est paradisus, plantata est arbor uitae, paratum est futurum tempus, praeparata est habundantia, aedificata est ciuitas, probata est requies, perfecta est bonitas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/052.yaml
  text: For paradise has been opened to you[a], the tree of life has been planted, the age to come has been prepared, abundance has been made ready, the city has been built, rest has been approved, goodness has been perfected,
translation:
  language: pt
  text: Pois o paraíso foi aberto para vocês, a árvore da vida foi plantada, o tempo vindouro foi preparado, a abundância foi preparada, a cidade foi construída, o descanso foi aprovado, e a bondade foi aperfeiçoada,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vobis enim
  choice: Pois para vocês
  rationale: Preserva a relação explicativa de enim e o plural de vobis, com ordem natural em português.
- source_word: paradisus
  choice: o paraíso
  rationale: Equivalente direto e tradicional, claro para leitores modernos.
- source_word: arbor uitae
  choice: a árvore da vida
  rationale: Mantém a expressão bíblica consagrada e a correspondência formal com o latim.
- source_word: futurum tempus
  choice: o tempo vindouro
  rationale: Expressa o tempo futuro esperado sem impor a formulação teológica mais específica «era vindoura».
- source_word: habundantia
  choice: a abundância
  rationale: Reproduz diretamente a ideia de provisão abundante, sem especificar em que ela consiste.
- source_word: probata est requies
  choice: o descanso foi aprovado
  rationale: Conserva o valor básico de probata como algo aprovado ou reconhecido, sem trocar a imagem por «designado».
- source_word: perfecta est bonitas
  choice: a bondade foi aperfeiçoada
  rationale: Mantém a construção passiva e o sentido de algo levado à perfeição.
theological_decisions:
- issue: Sentido escatológico de futurum tempus
  choice: o tempo vindouro
  alternative: a era vindoura
  rationale: A escolha preserva o horizonte futuro do texto, mas evita tornar tempus mais tecnicamente teológico do que o latim exige.
- issue: Agente das ações passivas
  choice: Manter as formas passivas sem indicar agente
  alternative: Explicitar Deus como agente
  rationale: O latim não nomeia o agente; explicitá-lo resolveria uma informação deixada implícita na fonte.
translation_notes:
  register: Português atual, digno e acessível, com paralelismo preservado. O pronome plural «vocês» favorece ampla legibilidade brasileira. A conjunção «e» antes do último membro torna a enumeração natural sem alterar sua estrutura.
