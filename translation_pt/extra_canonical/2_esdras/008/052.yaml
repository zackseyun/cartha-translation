review_pass:
  verdict: revise
  source_fidelity: A sequência de passivas e os referentes do latim estão corretamente representados. A revisão proposta preserva o valor explicativo de enim, o plural de vobis e a distinção entre paratum e praeparata, sem explicitar o agente implícito.
  naturalness: A ordem «Pois para vocês o paraíso foi aberto» é compreensível, mas é mais marcada do que o necessário no português atual. «Pois o paraíso foi aberto para vocês» é mais fluente, mantendo a ênfase e o paralelismo. «Foi preparada» é também uma correspondência mais direta e idiomática para praeparata do que «foi deixada pronta».
  terminology: «Paraíso», «árvore da vida», «tempo vindouro», «abundância», «cidade», «descanso» e «bondade» são adequados. «O descanso foi aprovado» mantém, de modo deliberadamente não interpretativo, o sentido de probata est; embora a formulação seja incomum, não deve ser substituída por uma leitura teológica mais específica, como «designado».
  issues:
