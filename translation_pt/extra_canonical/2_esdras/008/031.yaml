  text: julgados, mas ama aqueles que sempre confiaram na tua glória. Pois nós e nossos pais vivemos segundo costumes mortais; tu, porém,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicati
  choice: julgados
  rationale: Mantém o particípio passivo e o início fragmentário do trecho latino, que continua uma oração iniciada no contexto anterior.
- source_word: diligas
  choice: ama
  rationale: O presente do subjuntivo latino pode ter força volitiva ou imperativa neste contexto de súplica; o imperativo português é natural e preserva o pedido dirigido a Deus.
- source_word: confiderunt
  choice: confiaram
  rationale: Traduz diretamente o perfeito latino, sem convertê-lo num estado presente.
- source_word: mortalibus moribus egimus
  choice: vivemos segundo costumes mortais
  rationale: Conserva a imagem de uma conduta marcada pela mortalidade; 'vivemos' expressa naturalmente o sentido contextual de egimus.
- source_word: tu autem
  choice: tu, porém,
  rationale: Preserva a contraposição e a interrupção da fonte, sem completar o pensamento com material não fornecido.
theological_decisions:
- issue: Objeto do amor divino em contraste com os julgados
  choice: manter 'julgados, mas ama aqueles...' sem explicitar sujeito ou relação sintática ausente
  alternative: completar a oração com um sujeito ou verbo recuperado do contexto anterior
  rationale: O excerto começa no meio de uma construção; completar silenciosamente resolveria uma ambiguidade textual que a fonte fornecida não permite solucionar.
- issue: Sentido de 'costumes mortais'
  choice: preservar a associação entre conduta humana e mortalidade
  alternative: interpretar como 'caminhos pecaminosos'
  rationale: Embora o contexto possa implicar pecado e fragilidade, o latim diz mortalibus, não peccatis; a tradução evita acrescentar uma qualificação teológica não expressa.
translation_notes:
  register: Português moderno, digno e acessível, com uso de 'tu' coerente com a oração dirigida a Deus. A pontuação final mantém deliberadamente a frase incompleta, conforme o fragmento latino fornecido.
