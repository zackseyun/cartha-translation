  source_fidelity: O texto preserva cuidadosamente o caráter fragmentário do início («julgados») e do fim («tu, porém,»), sem suprir material que não consta no excerto latino. «Ama» transmite de modo natural o valor volitivo do subjuntivo diligas; «sempre confiaram na tua glória» corresponde a qui semper in tua gloria confiderunt. «Vivemos segundo costumes mortais» representa adequadamente mortalibus moribus egimus, mantendo a referência à conduta humana marcada pela condição mortal, sem introduzir a noção não expressa de pecado.
  naturalness: O português é claro, moderno e de registro apropriado para uma oração. A construção inicial e o encerramento em suspensão soam inevitavelmente incompletos, mas isso reflete fielmente os limites do texto-fonte fornecido, e a pontuação os sinaliza bem.
  terminology: «Glória», «pais», «mortal» e o tratamento por «tu» são coerentes com o registro bíblico e com o latim. «Costumes mortais» é uma formulação um pouco formal, mas é compreensível e conserva a imagem e a amplitude semântica de moribus.
