  yaml_path: translation/extra_canonical/2_esdras/008/022.yaml
  text: whose service turns to wind and fire[a], whose word is sure and whose sayings endure, whose ordering is strong and whose command is fearful[b],
translation:
  language: pt
  text: dos quais o serviço se transforma em vento e fogo[a][b], cuja palavra é firme e cujos ditos perduram, cuja ordenação é poderosa e cuja ordem é temível,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim traz seruatio (“preservação”) aqui, mas, neste contexto angélico, o sentido costuma ser entendido como “serviço” ou “ministério”. A tradução segue o sentido contextual e assinala a dificuldade do texto.
    reason: textual_variant
  - marker: b
    text: 'Ou: “dos quais o serviço está no vento e no fogo”.'
    reason: previous_rendering
lexical_decisions:
- source_word: seruatio … conuertitur
  choice: serviço se transforma
  rationale: Embora seruatio normalmente signifique “preservação”, o contexto angélico favorece “serviço”; conuertitur exige a ideia verbal de transformação, omitida em versões anteriores.
- source_word: dicta perseuerantia
  choice: declarações permanecem
  rationale: Reproduz o sentido duradouro de perseuerantia em português natural, sem enfraquecer o paralelismo.
- source_word: dispositio fortis
  choice: ordenação é poderosa
  rationale: “Ordenação” conserva a noção de disposição ou arranjo estabelecido; “poderosa” expressa fortis neste contexto.
- source_word: iussio
  choice: ordem
  rationale: “Ordem” comunica de modo corrente o ato de mandar, evitando confusão com “mandamento” como termo técnico do Decálogo.
theological_decisions:
- issue: Referente das orações relativas
  choice: Manter “serviço” na primeira oração e atributos divinos no singular nas seguintes
  alternative: Tratar todas as orações como atributos do mesmo referente
  rationale: A evidência latina distingue o referente angélico plural da primeira oração do cuius singular das orações seguintes, preservando a mudança de referente sem explicitá-la além do texto.
- issue: Imagem de vento e fogo
  choice: “se transforma em vento e fogo”
  alternative: “está no vento e no fogo”
  rationale: A tradução conserva o verbo conuertitur e a imagem cosmológica, sem decidir se se trata de mudança de natureza, manifestação ou função.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Mantém-se o período em minúscula e com vírgula final porque o versículo é parte de uma oração contínua. A formulação preserva o paralelismo e a mudança implícita de referente.
