  verdict: approve
  source_fidelity: A tradução segue de perto o latim preservado. «Habitas a eternidade» comunica adequadamente o valor temporal de seculum neste apelo doxológico. «Cujos olhos são elevados» conserva o predicado de oculi elati sem introduzir um objeto de visão. «Cujas câmaras superiores estão no ar» trata superiora como neutro plural substantivado coordenado com oculi, e não como objeto de «olhos»; isso é compatível com a leitura arquitetônica atestada no percurso editorial. «Trono ... inestimável» traduz com precisão thronus inextimabilis. As reticências representam corretamente a interrupção material do excerto em gloria incon-.
