  text: And he said[a], “Lord, you who inhabit eternity, whose eyes are exalted and whose heights are in the air,
translation:
  language: pt
  text: 'E disse: “Senhor, tu que habitas a eternidade, cujos olhos são elevados e cujas câmaras superiores estão no ar, cujo trono é inestimável e cuja glória...”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inhabitas seculum
  choice: habitas a eternidade
  rationale: Neste contexto doxológico, seculum indica a duração eterna; a formulação preserva a imagem de Deus habitando a eternidade.
- source_word: oculi elati
  choice: olhos são elevados
  rationale: Mantém a predicação do latim sem acrescentar a ideia não expressa de olhar para algo.
- source_word: superiora
  choice: câmaras superiores
  rationale: O neutro plural substantivado, em paralelo com o grego subjacente ὑπερῷα e a imagem bíblica das moradas celestes, favorece 'câmaras superiores' em vez do genérico 'alturas'.
- source_word: in aerem
  choice: no ar
  rationale: Reproduz de modo natural a localização cósmica indicada pelo latim, apesar da forma acusativa incomum após in.
- source_word: thronus inextimabilis
  choice: trono é inestimável
  rationale: Preserva o sentido de algo cujo valor ou grandeza não pode ser calculado.
theological_decisions:
- issue: Referente de superiora
  choice: câmaras superiores de Deus
  alternative: alturas; coisas elevadas contempladas pelos olhos de Deus
  rationale: A sintaxe apresenta superiora como elemento nominativo paralelo a oculi, e não como objeto do olhar; a leitura arquitetônica também corresponde melhor à tradição textual subjacente.
- issue: Sentido de seculum
  choice: eternidade
  alternative: era; mundo
  rationale: A invocação divina e o uso tradicional da expressão apoiam o sentido temporal de eternidade, sem identificar Deus com a criação.
translation_notes:
  register: Português moderno, digno e acessível, com paralelismo litúrgico. As reticências preservam o fato de que o trecho latino fornecido termina no meio da frase ('gloria incon-').
