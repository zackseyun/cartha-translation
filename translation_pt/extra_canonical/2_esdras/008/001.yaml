source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: hoc saeculum fecit altissimus propter multos, futurum autem propter paucos.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/001.yaml
  text: And he answered me and said[a], “The Most High made this age for many, but the age to come for few.”
translation:
  language: pt
  text: 'E ele me respondeu e disse: “O Altíssimo fez esta era para muitos, mas a era futura para poucos.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: hoc saeculum
  choice: esta era
  rationale: Traduz diretamente o demonstrativo hoc e saeculum, preservando a distinção lexical em relação a uma formulação explícita como “era presente”.
- source_word: futurum
  choice: a era futura
  rationale: O adjetivo substantivado retoma saeculum; explicitar “era” produz português natural e mantém o contraste temporal.
- source_word: Altissimus
  choice: o Altíssimo
  rationale: Equivalente tradicional, claro e digno do título divino latino.
- source_word: propter multos ... propter paucos
  choice: para muitos ... para poucos
  rationale: Neste contexto, “para” expressa de modo natural que cada era foi feita em vista dos respectivos grupos, sem impor uma explicação adicional.
theological_decisions:
- issue: Alcance de “muitos” e “poucos”
  choice: Manter a formulação absoluta “para muitos... para poucos”
  alternative: Explicitar quem são os muitos e os poucos
  rationale: O versículo não identifica nem define esses grupos; a tradução preserva a tensão e evita acrescentar uma interpretação soteriológica específica.
- issue: Contraste entre as eras
  choice: “esta era” e “a era futura”
  alternative: “o mundo presente” e “o mundo vindouro”
  rationale: “Era” representa melhor saeculum como período ou ordem temporal e conserva a oposição do texto sem transformar o termo em referência primariamente espacial.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A construção redundante latina “respondeu e disse” foi condensada em “respondeu”, pois a fala direta já comunica o ato de dizer; o conteúdo e o contraste foram integralmente preservados.
