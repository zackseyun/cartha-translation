  verdict: revise
  source_fidelity: A tradução de prehensibilis como “incompreensível” é defensável no contexto fragmentário e deve continuar assinalada. “Exército dos anjos” traduz bem exercitus angelorum. Contudo, Quorum é plural e retoma os anjos; “cujo serviço” pode ser lido como referente a Deus e não representa adequadamente esse plural. Além disso, seruatio é mais seguramente vertido aqui de modo não interpretativo como “preservação”, em conformidade com a trilha de auditoria inglesa.
  naturalness: “Permanece tremendo” é compreensível, mas ligeiramente menos idiomático e menos direto do que “está ... com tremor”. A reformulação conserva o caráter de oração incompleta no início e no fim do trecho.
  terminology: “Preservação” mantém a opacidade e a amplitude de seruatio melhor que “serviço”, que introduz uma interpretação ministerial específica. “A preservação deles” torna explícita, em português natural, a referência plural de quorum sem decidir o sentido preciso da expressão seguinte.
  issues:
