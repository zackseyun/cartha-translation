  text: incomprehensible, before whom the host of angels stands with trembling, whose preservation is turned into wind and fire, whose word
translation:
  language: pt
  text: incompreensível[a], diante de quem está o exército dos anjos com tremor, e cuja preservação[b] se transforma em vento e fogo, cuja palavra
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O trecho latino fornecido começa com prehensibilis, “compreensível”; pelo contexto, porém, pode conservar apenas o final de incomprehensibilis, “incompreensível”.
    reason: Registrar de modo transparente a dificuldade textual no início do fragmento.
  - marker: b
    text: O latim quorum é plural e se refere aos anjos. Seruatio também pode significar “guarda” ou “observância”; o sentido preciso da expressão permanece incerto.
    reason: Preservar a referência plural e a amplitude semântica de seruatio sem impor uma interpretação.
lexical_decisions:
- source_word: prehensibilis
  choice: incompreensível
  rationale: Embora o trecho fornecido comece por prehensibilis, o contexto e a forma textual pressuposta indicam que se trata do final de incomprehensibilis; a tradução conserva o sentido contextual adotado na edição de consulta, assinalando a dificuldade em nota.
- source_word: exercitus angelorum
  choice: o exército dos anjos
  rationale: Equivalência direta e natural para a hoste ou multidão organizada de anjos.
- source_word: adstat ... cum tremore
  choice: permanece tremendo
  rationale: Adstat indica estar ou permanecer diante de alguém; cum tremore expressa temor reverente ou tremor, sem exigir que a tradução escolha entre essas nuances.
- source_word: seruatio
  choice: serviço
  rationale: No contexto dos anjos e da alusão tradicional a vento e fogo, 'serviço' comunica melhor sua função ou ministração. O termo latino isolado também pode significar observância, guarda ou preservação, por isso a ambiguidade é registrada em nota.
- source_word: in uento et igni conuertitur
  choice: se transforma em vento e fogo
  rationale: Mantém a imagem concreta e o valor passivo/reflexivo de conuertitur sem explicar além do texto.
- source_word: cuius uerbum
  choice: cuja palavra
  rationale: Tradução formal do sintagma incompleto, preservando o encadeamento com o versículo seguinte.
theological_decisions:
- issue: Natureza do serviço angélico em vento e fogo
  choice: cujo serviço se transforma em vento e fogo
  alternative: cuja preservação é convertida em vento e fogo
  rationale: A escolha preserva a associação dos anjos com vento e fogo sem definir se eles próprios mudam de forma, se sua atividade se manifesta nesses elementos ou se o texto descreve outra relação.
translation_notes:
  register: Português moderno, claro e digno, com sintaxe adequada a um fragmento que começa e termina no meio de uma frase. Preferiu-se 'exército dos anjos' por ampla inteligibilidade e 'permanece tremendo' para conservar tanto a postura diante de Deus quanto o tremor.
