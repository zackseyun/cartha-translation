    issue: Referente de Quorum não é preservado com clareza.
    rationale: O latim usa o relativo plural Quorum, referente ao exercitus angelorum/anjos. “Cujo serviço” está no singular e, pela posição, tende a ser entendido como posse de “quem” (Deus).
  - severity: medium
    issue: “Serviço” é uma especificação interpretativa de seruatio.
    rationale: Embora possa haver associação contextual com ministério angélico, seruatio admite sentidos como preservação, guarda ou observância. “Preservação” é mais formal e preserva melhor a incerteza.
