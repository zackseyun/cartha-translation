source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: possis diligere meam creaturam super me, tu autem frequenter temetipsum proximasti iniustis, numquam Sed et in hoc mirabilis eris coram altissimo, Quoniam humiliasti te, sicut decet
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/047.yaml
  text: Can you love my creation more than I do? But you have often drawn yourself near to the unrighteous. Never do so. Yet even in this you will be marvelous before the Most High[a], because you have humbled yourself, as is fitting.
translation:
  language: pt
  text: Você pode amar a minha criação mais do que eu? Mas muitas vezes você se colocou ao lado dos injustos. Nunca faça isso. Ainda assim, até nisso você será admirável diante do Altíssimo, porque se humilhou, como convém.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: possis diligere
  choice: Você pode amar
  rationale: Mantém a forma interrogativa e o sentido de capacidade ou possibilidade expresso pelo subjuntivo latino no contexto.
- source_word: meam creaturam
  choice: a minha criação
  rationale: Reproduz diretamente o referente coletivo de creaturam em linguagem natural.
- source_word: temetipsum proximasti iniustis
  choice: você se colocou ao lado dos injustos
  rationale: O reflexivo proximasti indica aproximação ou colocação junto de alguém, não comparação mental; a formulação portuguesa preserva a ideia de autoinclusão ou proximidade.
- source_word: mirabilis eris
  choice: você será admirável
  rationale: Conserva o futuro e o valor de mirabilis, isto é, alguém digno de admiração ou assombro.
- source_word: humiliasti te, sicut decet
  choice: se humilhou, como convém
  rationale: Tradução direta e digna, preservando tanto a ação reflexiva quanto a avaliação de que ela é apropriada.
theological_decisions:
- issue: Relação entre o amor divino e o amor de Esdras pela criação
  choice: Você pode amar a minha criação mais do que eu?
  alternative: Você seria capaz de amar a minha criatura mais do que eu?
  rationale: A pergunta retórica preserva a primazia implícita do amor de Deus sem acrescentar uma explicação doutrinária ausente do latim.
- issue: Sentido da aproximação aos injustos
  choice: se colocou ao lado dos injustos
  alternative: contou-se entre os injustos
  rationale: A escolha mantém a imagem espacial de proximasti e deixa aberta a tensão entre identificação humilde e inclusão entre os injustos, sem tornar explícita uma interpretação teológica específica.
translation_notes:
  register: Português moderno, claro e digno, com boa legibilidade brasileira e alcance internacional. O tratamento por “você” favorece naturalidade contemporânea; “Altíssimo” conserva o título tradicional. Não foi adotada a nota inglesa “comparou-se com”, pois ela não representa adequadamente o latim proximasti.
