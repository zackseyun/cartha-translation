source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deliquit. In hoc enim adnuntiabitur iusticia tua et bonitas tua, domine, cum misertus fueris eis qui non habent substantiam operum bonorum. Et respondit ad me et dixit: recte locutus es aliqua, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/036.yaml
  text: For in this your righteousness and your goodness will be declared, Lord, when you have mercy on those who have no store of good works.”
translation:
  language: pt
  text: 'Pois é nisto que se manifestarão a tua justiça e a tua bondade, Senhor: quando tiveres misericórdia daqueles que não têm reserva de boas obras.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adnuntiabitur
  choice: se manifestarão
  rationale: Expressa que a justiça e a bondade de Deus serão dadas a conhecer ou evidenciadas; o plural concorda naturalmente em português com os dois sujeitos coordenados.
- source_word: iusticia tua et bonitas tua
  choice: a tua justiça e a tua bondade
  rationale: Mantém os dois atributos distintos e a repetição possessiva do latim em linguagem clara e digna.
- source_word: misertus fueris
  choice: tiveres misericórdia
  rationale: Preserva a construção temporal e o sentido de agir misericordiosamente, sem acrescentar uma explicação teológica.
- source_word: non habent substantiam operum bonorum
  choice: não têm provisão de boas obras
  rationale: Substantia pode indicar haveres, recursos ou reserva; “provisão” conserva a imagem de algo de que essas pessoas carecem, sem reduzir a frase simplesmente a “não praticaram boas obras”.
theological_decisions:
- issue: Relação entre a misericórdia divina e a ausência de boas obras
  choice: Manter a afirmação direta de que Deus demonstra misericórdia aos que não têm provisão de boas obras.
  alternative: Explicitar mérito, arrependimento ou incapacidade moral.
  rationale: O latim não fornece essas qualificações; mantê-las ausentes preserva a tensão teológica do texto.
translation_notes:
  register: Português moderno, claro e solene, com construção compreensível tanto no Brasil quanto em outros contextos lusófonos. O trecho foi limitado ao conteúdo do versículo apresentado no inglês de consulta; as palavras latinas adjacentes pertencem ao contexto anterior e ao início do versículo seguinte.
