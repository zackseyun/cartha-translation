  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/025.yaml
  text: Do not look upon the offenses of your people[a], but upon those who have served you in truth.
translation:
  language: pt
  text: Não olhes para as transgressões do teu povo[a], mas para os que te serviram em verdade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Uma redação anterior incluía aqui: “Pois, enquanto eu viver, falarei, e, enquanto tiver entendimento, responderei”. Essas palavras pertencem ao versículo anterior no texto latino.'
    reason: previous_rendering
lexical_decisions:
- source_word: delicta
  choice: transgressões
  rationale: Expressa violações ou faltas morais com dignidade e clareza, sem restringir o termo a crimes jurídicos.
- source_word: aspicias
  choice: olhes para
  rationale: Preserva a imagem direta do latim e, no contexto, o sentido de levar em conta ou considerar.
- source_word: in ueritate
  choice: em verdade
  rationale: Mantém a formulação teologicamente aberta do latim, que pode indicar sinceridade, fidelidade ou conformidade com a verdade.
- source_word: seruierunt
  choice: serviram
  rationale: Reconstitui a palavra dividida no testemunho (“serui-” / “erunt”) e traduz naturalmente o perfeito latino.
theological_decisions:
- issue: Objeto do olhar divino na segunda oração
  choice: “mas para os que te serviram em verdade”
  alternative: “mas olha para aqueles que te serviram fielmente”
  rationale: A redação escolhida conserva o paralelismo e a ambiguidade de “in ueritate”, sem reduzi-la apenas à fidelidade.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com emprego de “tu” coerente com a oração dirigida a Deus. A nota registra a antiga diferença de divisão dos versículos sem inserir no texto palavras ausentes desta unidade latina.
