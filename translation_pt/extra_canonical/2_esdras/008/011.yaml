  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mamillis, praeberi lac, fructum mamillarum, Vt nutriatur id quod plasmatum est usque in tempus aliquem, et postea dispones eum tuae misericordiae. Enutristi eum tuae iusticiae et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/011.yaml
  text: from the breasts[a], milk is provided, the fruit of the breasts, so that what has been formed may be nourished for a certain time, and afterward you direct him by your mercy. You nourished him in your righteousness and instructed him in your law and corrected him by your understanding,
translation:
  language: pt
  text: dos seios, seja fornecido leite, fruto dos seios, para que aquilo que foi formado seja alimentado até certo tempo; depois, tu o guiarás por tua misericórdia.[a] Tu o nutriste em tua justiça, o instruíste em tua lei e o corrigiste com teu entendimento,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “tu o entregarás à tua misericórdia”.'
    reason: O dativo tuae misericordiae pode ser entendido como instrumental, ligado ao modo da direção, ou como complemento de dispones, no sentido de confiar ou entregar alguém à misericórdia.
lexical_decisions:
- source_word: praeberi lac
  choice: seja fornecido leite
  rationale: O infinitivo passivo latino depende da construção do contexto anterior; em português, a forma passiva subjuntiva preserva essa continuidade sintática e exprime que o leite é dado.
- source_word: fructum mamillarum
  choice: fruto dos seios
  rationale: Mantém a imagem concreta e a aposição do latim, em que o leite é descrito como produto dos seios.
- source_word: usque in tempus aliquem
  choice: até certo tempo
  rationale: Reproduz o limite temporal indicado por usque in e o caráter indefinido de aliquem.
- source_word: dispones eum
  choice: tu o guiarás
  rationale: Disponere pode significar ordenar, dirigir ou governar; 'guiarás' comunica direção ativa em português natural e preserva o futuro do latim.
- source_word: corripuisti
  choice: o corrigiste
  rationale: Expressa a ideia de corrigir ou repreender com finalidade formativa, adequada ao paralelismo com nutrir e instruir.
theological_decisions:
- issue: Relação entre a misericórdia divina e o ato de disponere
  choice: tu o guiarás por tua misericórdia
  alternative: tu o entregarás à tua misericórdia
  rationale: A leitura instrumental se harmoniza com as expressões paralelas 'em tua justiça' e 'com teu entendimento' e preserva a ação divina de dirigir. A nota registra a alternativa gramatical sem resolver silenciosamente a ambiguidade.
translation_notes:
  register: Português moderno, claro e digno, com formas verbais explícitas para conservar o tom de oração dirigida a Deus. O início permanece sintaticamente ligado ao contexto anterior, como no fragmento latino. A vírgula final foi mantida porque o texto fornecido continua além deste versículo.
