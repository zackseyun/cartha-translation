source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Conuenisti enim obaudire et profecta es nolens, non enim tibi est datum spatium nisi solum modicum uiuere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/005.yaml
  text: For you have consented to obey and have advanced unwillingly[a], for no span has been given to you except only a little while to live.
translation:
  language: pt
  text: Pois consentiste em obedecer e partiste contra a vontade[a], porque não te foi dado senão um breve tempo para viver.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “puseste-te a caminho contra a vontade”.'
    reason: A locução alternativa explicita o sentido de iniciar uma jornada presente no latim profecta es e evita que “partiste” seja entendido exclusivamente como referência à morte.
lexical_decisions:
- source_word: conuenisti
  choice: consentiste
  rationale: O perfeito de conuenire, neste contexto com infinitivo, expressa concordância ou consentimento; a segunda pessoa singular preserva o discurso direto à alma.
- source_word: obaudire
  choice: em obedecer
  rationale: Obaudire indica dar ouvidos de modo obediente, não apenas escutar.
- source_word: profecta es
  choice: partiste
  rationale: O perfeito de proficisci significa normalmente partir ou pôr-se a caminho. “Partiste” é conciso e mantém a imagem de uma jornada sem impor a ideia de progresso.
- source_word: nolens
  choice: contra a vontade
  rationale: Traduz literalmente a ideia de não querer, com expressão natural em português.
- source_word: spatium nisi solum modicum uiuere
  choice: senão um breve tempo para viver
  rationale: Reproduz o limite temporal do latim em português claro, sem a redundância pouco natural de “senão apenas”.
theological_decisions:
- issue: Sentido metafórico de profecta es no discurso dirigido à alma
  choice: partiste
  alternative: puseste-te a caminho
  rationale: A tradução conserva a metáfora de jornada e sua possível relação com a breve vida, sem especificar se a partida se refere ao início da vida, ao curso dela ou à morte.
translation_notes:
  register: Português moderno, digno e direto, com segunda pessoa do singular coerente com o discurso à alma. A ordem e a ligação causal do latim foram preservadas de modo natural.
