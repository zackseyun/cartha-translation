source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tua imago nominatus, quoniam similatus est, per quem omnia plasmasti, et similasti eum semini agricolae. Non, domine
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/044.yaml
  text: called your image[a], because he has been made like you, through whom you formed all things, and you have likened him to the farmer’s seed. No, Lord
translation:
  language: pt
  text: chamado de tua imagem, porque foi feito semelhante a ti, por causa de quem formaste todas as coisas[a], e o comparaste à semente do agricultor. Não, Senhor
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “por meio de quem formaste todas as coisas”.'
    reason: O latim per quem admite leitura instrumental, embora o contexto favoreça a leitura de finalidade ou benefício.
lexical_decisions:
- source_word: tua imago nominatus
  choice: chamado tua imagem
  rationale: Mantém o sentido predicativo de nominatus e a formulação do fragmento latino, no qual o referente humano é chamado imagem de Deus.
- source_word: similatus est
  choice: foi feito semelhante a ti
  rationale: Expressa o passivo latino e explicita o complemento implícito indicado por tua imago, sem identificar imagem e semelhança de modo técnico.
- source_word: per quem omnia plasmasti
  choice: por causa de quem formaste todas as coisas
  rationale: Embora per quem possa ser instrumental em latim, o contexto de 4 Esdras apresenta a humanidade como finalidade da criação, não como seu agente; a nota preserva a leitura formal alternativa.
- source_word: similasti eum semini agricolae
  choice: o comparaste à semente do agricultor
  rationale: Similare com dativo significa comparar ou assemelhar; 'semente do agricultor' conserva a imagem agrícola sem ampliá-la.
- source_word: Non, domine
  choice: Não, Senhor
  rationale: Preserva a interrupção abrupta do fragmento fornecido, sem acrescentar palavras oriundas do contexto posterior.
theological_decisions:
- issue: O papel da humanidade na criação em per quem
  choice: por causa de quem
  alternative: por meio de quem
  rationale: A opção principal evita apresentar o ser humano como agente mediador da criação e corresponde ao tema contextual de que o mundo foi feito em benefício da humanidade; a ambiguidade lexical do latim é mantida em nota.
translation_notes:
  register: Português atual, digno e de leitura ampla, com sintaxe próxima do fragmento latino. A abertura e o encerramento permanecem fragmentários porque o trecho fornecido começa e termina no meio do discurso.
