id: 2ES.8.29
reference: 2 Esdras 8:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: neque volueris perdere qui pecorum mores habuerunt, sed respicias eos qui legem tuam splendide docuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/029.yaml
  text: Do not desire to destroy those who have had the ways of cattle[a], but look upon those who have taught your law splendidly.
translation:
  language: pt
  text: Não queiras destruir os que viveram como animais[a]; olha, porém, para os que ensinaram com excelência a tua lei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “tiveram os modos [ou costumes] dos animais”. O termo latino pode referir-se a animais de rebanho ou, de modo mais amplo, a animais irracionais.
    reason: Preserva a imagem e a extensão lexical de pecorum mores, enquanto o texto principal usa uma formulação portuguesa mais natural.
lexical_decisions:
- source_word: neque volueris perdere
  choice: Não queiras destruir
  rationale: Preserva a forma volitiva negativa do latim, com dignidade e naturalidade em português.
- source_word: qui pecorum mores habuerunt
  choice: os que viveram como animais
  rationale: Traduz idiomaticamente a ideia de ter modos ou costumes próprios de animais, evitando que “costumes” seja entendido apenas como hábitos sociais.
- source_word: sed respicias eos
  choice: olha, porém, para os
  rationale: Mantém o contraste introduzido por sed e o sentido de dirigir um olhar favorável ou atento, sem explicitar além do texto.
- source_word: qui legem tuam splendide docuerunt
  choice: os que ensinaram com excelência a tua lei
  rationale: “Com excelência” comunica o valor adverbial de splendide sem sugerir luminosidade literal; mantém “ensinaram” como verbo transitivo aplicado à lei.
theological_decisions:
- issue: Sentido favorável de respicias
  choice: olha ... para
  alternative: leva em consideração / contempla com favor
  rationale: A tradução conserva a abertura semântica do verbo latino e não torna explícita uma ideia de favor que, embora provável no contexto, permanece implícita.
- issue: Caracterização dos pecadores por pecorum mores
  choice: viveram como animais
  alternative: tiveram costumes de animais
  rationale: A formulação idiomática preserva a comparação moral forte sem identificar uma espécie específica nem acrescentar uma doutrina antropológica.
translation_notes:
  register: Português moderno, claro e reverente, com legibilidade brasileira e alcance internacional. A construção “Não queiras” mantém o tom de súplica solene; “com excelência” evita tanto o arcaísmo quanto uma leitura literal indevida de splendide.
