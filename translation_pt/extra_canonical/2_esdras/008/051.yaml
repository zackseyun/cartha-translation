lexical_decisions:
- source_word: tu autem
  choice: Mas você
  rationale: Preserva o contraste marcado por autem e a ênfase do pronome tu, em português moderno e amplamente compreensível.
- source_word: pro te intellege
  choice: entenda por si mesmo
  rationale: Reproduz o imperativo intellege e a expressão reflexiva pro te sem acrescentar um objeto não expresso no latim.
- source_word: de similibus tuis inquire gloriam
  choice: busque a glória entre os seus semelhantes
  rationale: Segue a leitura contextual de de como âmbito em que se busca a glória; 'seus semelhantes' traduz similibus tuis com dignidade e naturalidade.
theological_decisions:
- issue: Sentido de de similibus tuis
  choice: entre os seus semelhantes
  alternative: a respeito dos seus semelhantes / para os seus semelhantes
  rationale: A construção latina admite alguma elasticidade, mas 'entre' expressa de modo natural o âmbito da busca e acompanha a revisão auditada, sem impor uma interpretação teológica adicional.
translation_notes:
