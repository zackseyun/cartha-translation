  text: to inquire about the multitude of those who perish. For they too[a], having received freedom, despised the Most High and his law
translation:
  language: pt
  text: ao indagar sobre a multidão dos que perecem. Pois eles também, tendo recebido a liberdade, desprezaram o Altíssimo e a sua lei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inquirendo de
  choice: ao indagar sobre
  rationale: Reproduz o gerúndio latino e sua ligação sintática com o contexto anterior, mantendo o início fragmentário fornecido para o versículo.
- source_word: multitudine eorum qui pereunt
  choice: a multidão dos que perecem
  rationale: Tradução direta e natural, sem atenuar o sentido de perdição expresso por pereunt.
- source_word: libertatem
  choice: a liberdade
  rationale: Mantém o termo amplo do latim, sem especificá-lo doutrinariamente como 'livre-arbítrio'.
- source_word: spreuerunt
  choice: desprezaram
  rationale: Expressa a rejeição desdenhosa indicada pelo verbo latino.
- source_word: altissimum
  choice: o Altíssimo
  rationale: Preserva o título divino substantivado e tradicional, em linguagem corrente.
theological_decisions:
- issue: Natureza da liberdade recebida
  choice: liberdade
  alternative: livre-arbítrio
  rationale: O latim libertatem não define aqui uma teoria específica da vontade; 'liberdade' preserva essa abertura sem importar uma formulação denominacional.
- issue: Destino dos muitos
  choice: os que perecem
  alternative: os que estão perdidos
  rationale: O presente pereunt descreve o perecer e não exige que se resolva se o estado é processual, presente ou escatológico.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com boa legibilidade brasileira. A formulação começa de modo sintaticamente dependente porque o texto latino fornecido também começa com o gerúndio inquirendo, ligado ao contexto anterior.
