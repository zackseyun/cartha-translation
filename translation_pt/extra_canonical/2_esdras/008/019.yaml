source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ideo audi meam uocem et intellege sermonum meorum, et loquar coram te. Initium uerborum orationis Ezrae priusquam adsumeretur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/019.yaml
  text: Therefore hear my voice and understand my words[a][b], and I will speak before you.” The beginning of the words of Ezra’s prayer before he was taken up.
translation:
  language: pt
  text: Por isso, ouve a minha voz e compreende as minhas palavras, e falarei diante de ti”. Início das palavras da oração de Esdras antes de ele ser levado.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Este é o início das palavras da oração de Esdras antes de ele ser levado”.'
    reason: Registra a tradução anterior, que torna explícita a cópula subentendida, embora ela não apareça no latim.
  - marker: b
    text: A cláusula final, “Início das palavras da oração de Esdras antes de ele ser levado”, parece funcionar como uma transição composicional ou escribal. Ela foi mantida no texto porque consta do testemunho latino usado aqui.
    reason: Explica a provável camada composicional sem remover material presente na fonte latina.
lexical_decisions:
- source_word: Ideo
  choice: Por isso
  rationale: Expressa de modo natural a relação conclusiva ou causal do latim, sem tornar a conexão mais forte do que o original.
- source_word: audi meam uocem
  choice: ouve a minha voz
  rationale: Mantém a imagem concreta e o imperativo singular do texto latino.
- source_word: intellege sermonum meorum
  choice: compreende as minhas palavras
  rationale: Reproduz o sentido do pedido em português corrente; evita a forma pouco natural «compreende dos meus discursos».
- source_word: loquar coram te
  choice: falarei diante de ti
  rationale: Preserva tanto o valor futuro do subjuntivo latino neste contexto quanto a expressão relacional «diante de ti».
- source_word: Initium uerborum orationis Ezrae
  choice: Início das palavras da oração de Esdras
  rationale: Conserva a estrutura nominal, sem verbo, da rubrica latina.
- source_word: priusquam adsumeretur
  choice: antes de ele ser levado
  rationale: Mantém a voz passiva e a relativa abertura semântica de adsumeretur, sem explicitar destino ou agente.
theological_decisions:
- issue: Sentido de adsumeretur
  choice: antes de ele ser levado
  alternative: antes de ele ser arrebatado
  rationale: «Arrebatado» poderia impor uma leitura específica de ascensão sobrenatural; «levado» preserva a ambiguidade do latim.
- issue: Natureza da frase final
  choice: 'Rubrica nominal sem cópula: «Início das palavras...»'
  alternative: 'Frase declarativa: «Este é o início das palavras...»'
  rationale: O latim apresenta uma construção nominal sem verbo, provavelmente uma transição composicional ou escribal; a tradução mantém essa forma em vez de normalizá-la silenciosamente.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com tratamento singular em «ti». A redação preserva a mudança abrupta da fala para a rubrica final e não acrescenta «Este é» ao texto principal.
