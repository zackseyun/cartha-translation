- source_word: si non ascenderit
  choice: se ... não brotar
  rationale: No contexto agrícola, ascenderit descreve a semente que desponta ou nasce; “brotar” comunica isso com clareza.
- source_word: non enim accepit
  choice: porque não recebeu
  rationale: Mantém o valor explicativo de enim e a formulação incompleta do texto latino, sem acrescentar um objeto ausente.
theological_decisions:
- issue: Caráter fragmentário da oração
  choice: Manter a frase suspensa após “recebeu”
  alternative: Completar com “a tua chuva no tempo devido” e a cláusula sobre chuva excessiva
  rationale: Esses complementos não constam do texto latino fornecido. Mantê-los apenas como informação de nota evita apresentar uma reconstrução ou forma mais longa como se fosse o texto-base.
