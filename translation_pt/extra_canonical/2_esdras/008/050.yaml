reference: 2 Esdras 8:50
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Propter quod miseriae multae miserabiles efficientur qui habitant saeculum in nouissimis, quia in multa superbia ambulaūerunt. Tu autem pro te intellege et de similibus tuis inquire
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/050.yaml
  text: Therefore many grievous miseries will come upon those who inhabit the world in the last times[a], because they have walked in great pride. But understand for yourself, and inquire concerning those like yourself.
translation:
  language: pt
  text: Por isso, muitas e dolorosas aflições sobrevirão aos que habitam o mundo nos últimos tempos, porque andaram com grande orgulho. Mas, quanto a você, compreenda e procure saber a respeito dos que são semelhantes a você.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: miseriae multae miserabiles
  choice: muitas e dolorosas aflições
  rationale: Reproduz de modo natural a intensidade da expressão latina, evitando a formulação pouco idiomática “misérias miseráveis”.
- source_word: qui habitant saeculum
  choice: aos que habitam o mundo
  rationale: Neste contexto, saeculum designa o mundo ou a ordem presente habitada; “mundo” é claro e corresponde à tradição textual.
- source_word: in nouissimis
  choice: nos últimos tempos
  rationale: A expressão indica o período final, sem especificar uma cronologia além do que o latim afirma.
- source_word: in multa superbia ambulauerunt
  choice: andaram com grande orgulho
  rationale: Preserva a metáfora bíblica de “andar” como modo de viver e traduz superbia por “orgulho” sem acrescentar interpretação denominacional.
- source_word: pro te intellege
  choice: quanto a você, compreenda
  rationale: Mantém o objeto de “compreender” implícito, como no latim, e entende pro te como mudança de foco para o destinatário.
- source_word: de similibus tuis inquire
  choice: procure saber a respeito dos que são semelhantes a você
  rationale: Expressa inquire em português corrente e preserva a referência aberta aos que se assemelham ao destinatário.
theological_decisions:
- issue: Identidade dos “semelhantes a você”
  choice: Manter a expressão sem identificar explicitamente o grupo.
  alternative: Explicitar que se trata dos justos ou dos piedosos.
  rationale: O verso latino não nomeia o grupo; explicitá-lo resolveria uma referência contextual que o texto deixa implícita.
- issue: Sentido escatológico de in nouissimis
  choice: “nos últimos tempos”
  alternative: “no fim do mundo”
  rationale: A alternativa seria mais específica do que o latim e poderia importar uma interpretação cronológica ou cosmológica.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência brasileira. A tradução conserva a metáfora “andaram” e a referência aberta de “os que são semelhantes a você”. A nota [a] da camada inglesa não foi mantida, pois registra uma tradução anterior pertencente ao versículo precedente, não uma variante sustentada pelo texto latino fornecido.
