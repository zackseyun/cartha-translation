  text: According to your words, so it will be. For truly I will not think
translation:
  language: pt
  text: Conforme as tuas palavras, assim acontecerá. Pois, verdadeiramente, não pensarei
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuxta sermones tuos
  choice: Conforme as tuas palavras
  rationale: Expressa de modo natural a conformidade indicada por iuxta, preservando a referência direta às palavras do interlocutor.
- source_word: sic et fiet
  choice: assim acontecerá
  rationale: Mantém a correlação entre iuxta e sic; o futuro impessoal traduz fiet com clareza.
- source_word: Quoniam uere
  choice: Pois, verdadeiramente
  rationale: Preserva tanto o nexo explicativo de quoniam quanto a ênfase de uere, sem completar o pensamento.
- source_word: non cogitabo
  choice: não pensarei
  rationale: Reproduz literalmente o futuro de cogitare e conserva a oração incompleta transmitida pelo fragmento.
theological_decisions:
- issue: Sentido incompleto de «não pensarei»
  choice: Manter a frase aberta, sem objeto acrescentado
  alternative: Completar por conjectura, por exemplo, «não pensarei nos pecadores»
  rationale: O texto latino fornecido termina em non cogitabo; completar a ideia resolveria indevidamente uma lacuna textual e poderia introduzir interpretação teológica não atestada.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com segunda pessoa singular («tuas») por se tratar de discurso direto. A construção permanece deliberadamente incompleta, acompanhando o testemunho latino disponível.
