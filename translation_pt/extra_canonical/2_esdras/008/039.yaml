  text: but I will rejoice over the formation of the righteous[a], and over their pilgrimage also, and their salvation, and the reception of their reward.
translation:
  language: pt
  text: mas eu me alegrarei com a formação dos justos, com a peregrinação deles, com a salvação deles e com o recebimento da recompensa deles.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Em termos mais literais, o latim traz os substantivos sem possessivos expressos: “a peregrinação, a salvação e o recebimento da recompensa”; pelo contexto, eles se referem aos justos.'
    reason: Registrar a forma sintática do original e a razão da explicitação dos possessivos na tradução.
lexical_decisions:
- source_word: peregrinationis
  choice: peregrinação deles
  rationale: O genitivo latino indica a peregrinação ou condição transitória dos justos; o possessivo explicita em português a referência ao antecedente sem transformar o termo em conceito abstrato.
- source_word: saluationis
  choice: salvação deles
  rationale: Mantém o sentido direto de salvação e explicita que se trata da salvação dos justos.
- source_word: mercedis receptionis
  choice: recebimento de sua recompensa
  rationale: Reproduz tanto receptionis quanto mercedis em linguagem natural e digna; “recompensa” preserva o sentido de retribuição ou prêmio.
- source_word: plasma iustorum (preservado na camada inglesa auditada e no contexto latino imediatamente anterior)
  choice: formação dos justos
  rationale: “Formação” conserva a imagem de algo moldado ou formado e evita decidir indevidamente entre criação, constituição e estado formado.
theological_decisions:
- issue: Referente dos genitivos peregrinationis, saluationis e mercedis receptionis
  choice: Explicitar que pertencem aos justos por meio de “deles/sua”
  alternative: 'Deixar os substantivos sem possessivo: “a peregrinação, a salvação e o recebimento da recompensa”'
  rationale: Os genitivos dependem naturalmente da referência imediatamente anterior aos justos. Em português, os possessivos evitam que sejam entendidos como abstrações independentes, sem acrescentar uma distinção doutrinária.
- issue: Sentido de plasma
  choice: formação
  alternative: criação; criatura; corpo formado
  rationale: “Formação” preserva a amplitude lexical e a possível imagem do ato ou resultado de moldar, sem resolver uma ambiguidade que o texto não resolve.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira e vocabulário amplamente internacional. A repetição de “com” e “deles” torna explícita a coordenação e evita referentes ambíguos. O início em minúscula reflete a continuação sintática do trecho anterior indicada pelo texto fornecido.
