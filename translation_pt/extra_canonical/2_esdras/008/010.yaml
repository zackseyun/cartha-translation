  - severity: low
    issue: «Daqueles mesmos» acrescenta valor demonstrativo
    rationale: Em «ex ipsis membris», ipsis é intensivo («os próprios membros» / «os mesmos membros»), não um demonstrativo equivalente a «daqueles». A formulação revista conserva a ênfase sem acrescentar distância deítica.
