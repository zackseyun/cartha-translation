  source_fidelity: A forma «nele» não corresponde ao antecedente feminino expresso por «ea» no texto latino. Além disso, «daqueles mesmos membros» introduz uma nuance demonstrativa que não está explicitamente em «ipsis»; «dos próprios membros» transmite de modo mais direto a ênfase intensiva.
  naturalness: «Nela» e «dos próprios membros» soam naturais em português moderno. A sintaxe permanece deliberadamente incompleta, como no fragmento-fonte.
  terminology: «Ordenaste», «membros» e «isto é» são escolhas adequadas para imperasti, membris e hoc est. «Próprios» preserva a ênfase de ipsis sem especificar indevidamente um demonstrativo.
