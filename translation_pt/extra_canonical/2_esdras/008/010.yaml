  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in ea
  choice: nele
  rationale: O pronome latino retoma um referente de gênero feminino no contexto anterior; em português, a forma contraída natural depende do substantivo retomado. Aqui, “nele” segue a referência contextual subentendida e preserva a ligação anafórica.
- source_word: creata fuerint
  choice: foram criadas
  rationale: Expressa de modo claro e natural a passiva do perfeito latino no trecho subordinado.
- source_word: Imperasti
  choice: ordenaste
  rationale: Mantém a força de uma ordem soberana e a segunda pessoa do singular.
- source_word: ex ipsis membris
  choice: daqueles mesmos membros
  rationale: “Daqueles” liga os membros ao referente já mencionado, enquanto “mesmos” conserva a ênfase de ipsis; “membros” mantém a metáfora corporal e a continuidade da frase.
- source_word: hoc est
  choice: isto é
  rationale: Equivalente idiomático direto, preservando a frase inacabada que será explicada na continuação.
