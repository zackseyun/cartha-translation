  yaml_path: translation/extra_canonical/2_esdras/008/032.yaml
  text: For if you desire to have mercy on us, then you will be called merciful, for we are sinners.
translation:
  language: pt
  text: Pois, se desejares ter misericórdia de nós, então serás chamado misericordioso, porque somos pecadores.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desideraueris
  choice: desejares
  rationale: Preserva de modo natural o sentido volitivo do verbo latino e a forma condicional da oração.
- source_word: ut nostri miserearis
  choice: ter misericórdia de nós
  rationale: Expressão portuguesa corrente e digna para o latim, sem alterar o objeto da misericórdia.
- source_word: misericors uocaberis
  choice: serás chamado misericordioso
  rationale: Mantém a formulação passiva e a ligação lexical entre ter misericórdia e ser chamado misericordioso.
- source_word: nobis enim [peccatoribus] / propter nos peccatores
  choice: porque somos pecadores
  rationale: Segue o sentido atestado pelo fragmento e pela reconstrução editorial refletida no texto fornecido, em português idiomático.
theological_decisions:
- issue: Fundamento do apelo à misericórdia divina
  choice: porque somos pecadores
  alternative: porque não temos obras de justiça
  rationale: A alternativa não consta deste fragmento latino; a tradução conserva o paradoxo do apelo, no qual a condição pecadora humana serve de ocasião para Deus ser chamado misericordioso.
translation_notes:
  register: Português moderno, claro e reverente, com sintaxe natural e tratamento verbal na segunda pessoa do singular, adequado ao discurso dirigido a Deus.
