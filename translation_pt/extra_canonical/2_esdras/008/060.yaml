  text: que os fez e foram ingratos àquele que lhes preparou a vida. Por isso, o meu julgamento agora se aproxima, o qual não
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui fecit eos
  choice: que os fez
  rationale: Mantém a oração relativa e a referência ao Criador, sem acrescentar um sujeito ausente neste fragmento.
- source_word: ingrati fuerunt ei
  choice: foram ingratos àquele
  rationale: Expressa diretamente a ingratidão dirigida à mesma pessoa que lhes deu origem e preparou a vida.
- source_word: praeparauit eis uitam
  choice: lhes preparou a vida
  rationale: Reproduz de perto o verbo latino e preserva a formulação teológica sem explicá-la além do texto.
- source_word: iudicium meum
  choice: o meu julgamento
  rationale: ‘Julgamento’ abrange aqui tanto o ato judicial quanto sua manifestação, preservando a amplitude de iudicium.
- source_word: modo adpropinquat
  choice: agora se aproxima
  rationale: Conserva tanto a referência temporal de modo quanto a ideia de iminência em adpropinquat.
- source_word: Quod non
  choice: o qual eu não
  rationale: Mantém a frase incompleta e sua ligação sintática com ‘meu julgamento’, pois o trecho fornecido termina no meio da oração.
theological_decisions:
- issue: Identidade daquele que fez as pessoas e lhes preparou a vida
  choice: Manter a referência pronominal implícita no fragmento
  alternative: Explicitar ‘Deus’ ou ‘o Altíssimo’
  rationale: O latim não repete o título divino neste ponto; explicitá-lo eliminaria a dependência do contexto anterior.
- issue: Sentido de iudicium
  choice: ‘julgamento’
  alternative: ‘juízo’ ou ‘sentença’
  rationale: ‘Julgamento’ preserva melhor a possível amplitude entre processo, decisão e intervenção judicial, sem restringir o termo a uma sentença já pronunciada.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. A sintaxe fragmentária do fim foi preservada porque o texto-fonte fornecido termina em ‘Quod non’, continuando no versículo ou segmento seguinte. Não foram mantidas as notas inglesas [a] e [b], pois pertencem a uma versão anterior desalinhada com este trecho latino e não se ancoram em nenhuma expressão da tradução corrigida.
