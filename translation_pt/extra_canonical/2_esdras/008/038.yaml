base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/038.yaml
  text: For truly I will not think upon the formation of those who have sinned[a], nor upon their death, nor their judgment, nor their destruction; but I will rejoice over the creation of the righteous,
translation:
  language: pt
  text: Pois, de fato, não pensarei na formação dos que pecaram[a], nem na morte deles, nem no julgamento deles, nem na destruição deles; mas me alegrarei com a criação dos justos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “nem na morte, nem no julgamento, nem na destruição”.'
    reason: O genitivo eorum (“deles”) pode ser entendido como regendo toda a série de substantivos ou, de maneira mais estrita, apenas plasma (“formação”).
lexical_decisions:
- source_word: plasma
  choice: formação
  rationale: O termo latino designa aquilo que foi moldado ou o ato de formar; “formação” preserva a imagem e se ajusta naturalmente a “dos que pecaram”.
- source_word: peccauerunt
  choice: pecaram
  rationale: Tradução direta do perfeito latino, identificando os que cometeram pecado sem acrescentar uma caracterização denominacional.
- source_word: iudicium
  choice: julgamento
  rationale: Mantém o sentido judicial e escatológico amplo do termo, sem especificar sentença ou condenação.
- source_word: perditionem
  choice: destruição
  rationale: Expressa perda ou ruína definitiva sem introduzir uma explicação teológica além do texto.
- source_word: iocundabor super
  choice: me alegrarei com
  rationale: Forma portuguesa natural para a ideia de regozijar-se a respeito de ou por causa de algo.
- source_word: iustorum figmentum
  choice: a criação dos justos
  rationale: “Criação” comunica a obra formada, enquanto “dos justos” preserva a relação genitiva sem decidir se o foco recai no ato criador ou nas criaturas formadas.
theological_decisions:
- issue: Alcance de eorum sobre mortem, iudicium e perditionem
  choice: Entender “deles” como aplicável à morte, ao julgamento e à destruição dos que pecaram.
  alternative: 'Ler os três substantivos de modo geral: “nem na morte, nem no julgamento, nem na destruição”.'
  rationale: A sequência de acusativos é paralela a plasma, e eorum pode naturalmente reger toda a série. Essa leitura também evita transformar a frase numa afirmação universal de que morte e julgamento em si não serão considerados, embora a nota preserve a possibilidade sintática mais estrita.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com construção paralela clara. A repetição de artigos foi reduzida na enumeração para maior naturalidade, e “deles” foi colocado ao final para indicar seu alcance sobre os três elementos.
