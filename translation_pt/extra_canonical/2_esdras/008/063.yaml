  text: you have shown me a multitude of signs that you will begin to do in the last times[a], but you have not shown me at what time.”
translation:
  language: pt
  text: “Mostraste-me uma multidão de sinais que começarás a realizar nos últimos tempos[a], mas não me mostraste quando.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “que realizarás nos últimos tempos”.'
    reason: O latim incipies facere significa literalmente “começarás a fazer”, mas pode refletir uma construção da língua de origem com simples valor futuro.
lexical_decisions:
- source_word: multitudinem signorum
  choice: uma multidão de sinais
  rationale: Preserva a força quantitativa de multitudo sem impor artigo definido, inexistente em latim.
- source_word: incipies facere
  choice: começarás a realizar
  rationale: Traduz diretamente o valor incoativo de incipies e usa “realizar” como verbo natural para sinais; a possível função perifrástica de futuro é registrada em nota.
- source_word: in nouissimis
  choice: nos últimos tempos
  rationale: Expressa naturalmente o sentido escatológico do plural latino no português corrente.
- source_word: quo tempore
  choice: quando
  rationale: Equivalente idiomático e claro de “em que tempo”, sem alterar a pergunta sobre a ocasião exata.
theological_decisions:
- issue: Valor de incipies facere
  choice: começarás a realizar
  alternative: realizarás
  rationale: O texto latino apresenta formalmente o verbo “começar”, mas, por ser latim de tradução, a construção pode funcionar como futuro perifrástico. O texto principal conserva a forma explícita, e a nota preserva a alternativa.
translation_notes:
  register: Português moderno, claro e digno, com colocação pronominal natural e terminologia escatológica amplamente compreensível. A repetição de “mostraste-me” acompanha o paralelismo do original.
