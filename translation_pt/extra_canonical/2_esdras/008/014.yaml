  text: your work. If therefore you destroy the one who was formed with such great labors[a], why then was he made?
translation:
  language: pt
  text: tua obra. Portanto, se destruíres aquele que foi moldado com tão grande esforço, por que, então, ele foi feito?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuum opus
  choice: tua obra
  rationale: Mantém a expressão nominal e sua ligação sintática com o contexto anterior.
- source_word: perdideris
  choice: destruíres
  rationale: No contexto, o verbo indica levar a criatura à perdição ou destruição; “destruíres” expressa isso com clareza sem acrescentar meios não presentes no texto latino fornecido.
- source_word: plasmatus
  choice: moldado
  rationale: Preserva a imagem de formar ou modelar uma criatura, em vez do termo mais genérico “feito”.
- source_word: tantis laboribus
  choice: com tão grande esforço
  rationale: Transmite a intensidade de tantis e o custo implicado em laboribus de maneira natural em português.
theological_decisions:
- issue: Contraste entre o esforço da criação e a destruição da criatura
  choice: Preservar a pergunta retórica sem explicar sua implicação teológica
  alternative: Explicitar que Deus não deveria destruir aquilo que criou
  rationale: O texto apresenta uma tensão argumentativa, não uma conclusão doutrinária; a tradução deve conservar essa tensão.
translation_notes:
  register: Português moderno, digno e acessível. Conservou-se a abertura fragmentária “tua obra”, pois ela retoma o contexto anterior. Não foram incorporadas as expressões “por tua ordem” ou “por um decreto fácil”, ausentes do trecho latino fornecido.
