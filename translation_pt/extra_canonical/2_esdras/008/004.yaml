source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: absorbe ergo anima sensum et deuoret quod sapit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/004.yaml
  text: And I answered and said[a], “Therefore let the soul receive understanding, and let it devour wisdom.”
translation:
  language: pt
  text: 'E respondi e disse: “Engole, pois, ó alma, o entendimento, e que ela devore o que é sábio.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou “o que tem sabor”. O verbo latino pode relacionar-se tanto a ter sabor quanto a ser sábio ou compreender, prolongando a imagem de engolir e devorar.
    reason: Preservar a ambiguidade lexical e o possível jogo de palavras em quod sapit.
lexical_decisions:
- source_word: absorbe
  choice: Engole
  rationale: O imperativo singular e a imagem de ingestão são preservados de modo direto; “absorver” seria mais abstrato e enfraqueceria sua ligação com “devore”.
- source_word: anima
  choice: ó alma
  rationale: 'Embora a forma latina possa ser nominativa ou vocativa, o imperativo absorbe favorece fortemente a leitura vocativa: a alma é interpelada diretamente.'
- source_word: sensum
  choice: o entendimento
  rationale: Neste contexto, sensus designa compreensão ou discernimento, não mera sensação física.
- source_word: deuoret
  choice: que ela devore
  rationale: Preserva a mudança do imperativo direto absorbe para o subjuntivo de terceira pessoa deuoret, mesmo que a construção latina seja tensa e pouco regular.
- source_word: quod sapit
  choice: o que é sábio
  rationale: Mantém a oração relativa e o campo semântico de sapit ligado à sabedoria, sem reduzi-la simplesmente ao substantivo abstrato “sabedoria”; a possível alusão ao sabor é registrada em nota.
theological_decisions:
- issue: A alma como destinatária ou sujeito gramatical
  choice: 'Interpelação direta: “ó alma”'
  alternative: “que a alma absorva o entendimento”
  rationale: A leitura como vocativo corresponde melhor ao imperativo absorbe e evita transformar silenciosamente a ordem direta em uma construção jussiva de terceira pessoa.
- issue: Sentido de quod sapit
  choice: “o que é sábio”
  alternative: “a sabedoria” ou “o que tem sabor”
  rationale: A formulação conserva a ambiguidade concreta e sapiencial do latim, sem resolver a expressão em favor de uma abstração teológica.
translation_notes:
  register: Português moderno e digno, com a repetição solene “respondi e disse” mantida. A construção “e que ela devore” conserva a mudança gramatical peculiar do latim; a nota esclarece o jogo semântico sem sobrecarregar o texto principal.
