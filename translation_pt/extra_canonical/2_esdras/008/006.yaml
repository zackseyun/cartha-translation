base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/006.yaml
  text: O Lord over us[a], if you permit your servant to pray before you, and give us seed for the heart and cultivation for the understanding, from which fruit may come, by which every corruptible one may live[b],
translation:
  language: pt
  text: Ó Senhor que estás sobre nós, se permitires que nós, teu servo, oremos diante de ti[a] e nos dês semente para o coração e cultivo para o entendimento, de que resulte fruto, pelo qual possa viver todo ser corruptível[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim passa de «teu servo», no singular, para «oremos» e «nos», no plural.
    reason: source_grammar
  - marker: b
    text: 'Ou: «todo ser sujeito à corrupção».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: super nos
  choice: que estás sobre nós
  rationale: Preserva a imagem espacial e a ideia de senhorio do latim, evitando reduzir a expressão simplesmente a «nosso Senhor».
- source_word: semen cordis
  choice: semente para o coração
  rationale: Mantém a metáfora agrícola e a relação genitiva sem explicitar indevidamente o que a semente representa.
- source_word: sensui culturam
  choice: cultivo para o entendimento
  rationale: Conserva o paralelismo agrícola entre semente, cultivo e fruto; «entendimento» comunica aqui a faculdade de compreender.
- source_word: corruptus
  choice: ser corruptível
  rationale: No contexto apocalíptico, indica sobretudo quem está sujeito à deterioração e à morte, sem sugerir necessariamente depravação moral.
theological_decisions:
- issue: Mudança do singular «servo» para o plural «oremos/nos»
  choice: Preservar a mudança gramatical no texto
  alternative: 'Regularizar tudo no singular: «permitires ao teu servo orar... e lhe deres»'
  rationale: O latim apresenta deliberadamente «servo tuo» no singular e «oremus/nobis» no plural. A tradução conserva essa tensão em vez de identificar ou harmonizar silenciosamente o servo e a comunidade.
- issue: Sentido de «corruptus»
  choice: ser corruptível
  alternative: ser corrompido
  rationale: «Corruptível» expressa mortalidade e sujeição à deterioração, sentido mais provável neste contexto, enquanto «corrompido» tenderia a impor uma leitura primordialmente moral.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com sintaxe deliberadamente marcada em «ao teu servo que oremos» para conservar a mudança de número do texto latino. A pontuação final mantém a continuidade da oração para o versículo seguinte.
