lexical_decisions:
- source_word: corruptio in obliuionem
  choice: a corrupção caiu no esquecimento
  rationale: O latim apresenta uma expressão direcional elíptica, literalmente «corrupção para o esquecimento». A forma verbal «caiu» torna a relação inteligível em português sem alterar a ideia de a corrupção desaparecer no esquecimento.
- source_word: Transierunt dolores
  choice: As dores passaram
  rationale: Reproduz diretamente o perfeito latino e o plural «dolores», em linguagem natural.
- source_word: ostensus est
  choice: foi revelado
  rationale: Mantém a forma passiva e o caráter incompleto da oração, cujo sujeito masculino aparece no contexto seguinte; «revelado» comunica com naturalidade a ideia de algo que foi tornado manifesto.
theological_decisions:
- issue: Sujeito não expresso de «ostensus est»
  choice: Não explicitar o sujeito neste versículo
  alternative: Antecipar do contexto seguinte o substantivo a que o particípio se refere
  rationale: O trecho latino termina sem nomear o sujeito. Preservar essa abertura evita completar silenciosamente o texto ou resolver sua estrutura além da evidência fornecida.
translation_notes:
  register: Português moderno, sóbrio e acessível. O início elíptico foi levemente explicitado para fluência; o final permanece sintaticamente aberto, como no texto latino.
