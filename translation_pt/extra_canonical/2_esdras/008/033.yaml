  text: For the righteous[a], who have many works laid up with you, will receive their reward from their own works.
translation:
  language: pt
  text: Pois os justos, que têm muitas obras guardadas junto de ti, receberão a recompensa por suas próprias obras.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iusti enim
  choice: Pois os justos
  rationale: “Enim” introduz a razão ou explicação que dá continuidade ao argumento; “pois” preserva essa ligação melhor que uma conjunção adversativa.
- source_word: opera[e] multae repositae apud te
  choice: muitas obras guardadas junto de ti
  rationale: Mantém a imagem de obras acumuladas ou reservadas na presença de Deus, sem explicá-la além do texto.
- source_word: ex propriis operibus recipient mercedem
  choice: receberão a recompensa por suas próprias obras
  rationale: Reproduz a relação expressa por “ex” entre as próprias obras e a recompensa, com formulação natural em português.
theological_decisions:
- issue: Relação entre obras e recompensa
  choice: Preservar a afirmação direta de que os justos recebem recompensa por suas próprias obras
  alternative: Reformular como recompensa concedida pela graça apesar das obras
  rationale: O texto latino associa explicitamente a recompensa às próprias obras; uma harmonização teológica acrescentaria ao texto uma interpretação denominacional.
translation_notes:
  register: Português moderno, claro e digno, com tratamento de Deus na segunda pessoa do singular. A frase causal foi preservada como continuação do raciocínio do contexto.
