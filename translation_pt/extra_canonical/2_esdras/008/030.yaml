  rationale: Com “indignar-se”, o português corrente pede “contra” ou “com”; “contra” expressa naturalmente o alvo da indignação.
- source_word: bestiis peius sunt
  choice: são piores do que os animais
  rationale: Mantém a comparação explícita do latim. “Animais” é mais natural e abrangente em português moderno que “bestas”, sem enfraquecer o juízo severo.
theological_decisions:
- issue: Possível ideia de serem considerados ou julgados piores que os animais
  choice: são piores do que os animais
  alternative: são considerados piores do que os animais
  rationale: O texto latino fornecido termina em “sunt” e não contém “iudicati”; por isso, não se acrescenta uma noção de avaliação ou julgamento ausente desta fonte.
