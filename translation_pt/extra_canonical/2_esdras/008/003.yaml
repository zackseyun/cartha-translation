source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'sic et actus praesentis saeculi: Multi quidem creati sunt, pauci autem saluabuntur.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/003.yaml
  text: 'so also is the course of the present age: many indeed have been created[a], but few will be saved.'
translation:
  language: pt
  text: 'assim também é o curso da era presente: muitos, de fato, foram criados, mas poucos serão salvos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: actus
  choice: curso
  rationale: Aqui, o singular latino descreve o curso, funcionamento ou ordem característica da era presente; “atos” sugeriria indevidamente ações morais humanas e enfraqueceria a analogia do contexto.
- source_word: praesentis saeculi
  choice: da era presente
  rationale: “Era presente” expressa naturalmente o sentido temporal e escatológico de saeculum neste contexto.
- source_word: Multi quidem ... pauci autem
  choice: muitos, de fato, ... mas poucos
  rationale: Preserva o contraste enfático entre a grande quantidade dos criados e a pequena quantidade dos que serão salvos.
- source_word: creati sunt
  choice: foram criados
  rationale: Mantém a voz passiva e a referência explícita à criação.
- source_word: saluabuntur
  choice: serão salvos
  rationale: Mantém o futuro passivo e não explicita o agente, como no latim.
theological_decisions:
- issue: Relação entre criação e salvação
  choice: Preservar literalmente o contraste entre muitos criados e poucos salvos
  alternative: Suavizar ou explicar o contraste em termos de resposta humana, eleição ou destino final
  rationale: O texto latino faz uma afirmação concisa e teologicamente tensa sem explicar a causa; a tradução não deve resolver essa tensão.
translation_notes:
  register: Português atual, digno e amplamente compreensível, com boa legibilidade brasileira. A construção mantém a concisão sentenciosa do latim e usa “curso” para evitar a leitura equivocada de actus como “atos” ou “obras”.
