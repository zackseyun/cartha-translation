revisions:
- from: Pois aquilo que foi predito receberá vocês, mas a sede e os tormentos que foram preparados receberão a eles. Pois o Altíssimo não quis que o ser humano fosse destruído; eles mesmos, porém, embora criados, profanaram o nome dele.
