source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enim uos susipient quae praedicta sunt, sic eos sitis et cruciatus quae parata sunt. non enim altissimus uoluit hominem disperdi ; Sed ipsi qui creati sunt coinquinauerunt nomen eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/059.yaml
  text: For what has been foretold will receive you[a], but thirst and torments, which have been prepared, will receive them. For the Most High did not will that man should be destroyed; but they themselves, who were created, defiled his name.
translation:
  language: pt
  text: Pois as coisas que foram preditas vos receberão, mas a sede e os tormentos preparados os receberão. Pois o Altíssimo não quis que o ser humano fosse destruído; mas eles mesmos, que foram criados, profanaram o seu nome.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae praedicta sunt
  choice: aquilo que foi predito
  rationale: Mantém a formulação abrangente do neutro plural latino em português natural, sem especificar indevidamente quais acontecimentos ou promessas foram preditos.
- source_word: susipient
  choice: receberá / receberão
  rationale: Reproduz a imagem incomum, mas intencional, de pessoas sendo recebidas tanto pelo que foi predito quanto pelos castigos; evita substituir a metáfora por uma interpretação.
- source_word: sitis et cruciatus
  choice: a sede e os tormentos
  rationale: Traduz diretamente os dois substantivos e preserva o plural de cruciatus.
- source_word: hominem
  choice: o ser humano
  rationale: Expressa aqui o sentido genérico de humanidade ou pessoa humana, sem limitar a referência ao sexo masculino.
- source_word: disperdi
  choice: fosse destruído
  rationale: Conserva a voz passiva e o sentido forte do verbo latino, em vez de suavizá-lo para apenas 'morrer' ou 'perecer'.
- source_word: coinquinauerunt nomen eius
  choice: profanaram o nome dele
  rationale: Em contexto religioso, 'profanaram' comunica de modo natural a ideia de manchar ou contaminar o nome divino; 'dele' deixa claro que o referente é o Altíssimo.
theological_decisions:
- issue: Vontade do Altíssimo e responsabilidade das criaturas
  choice: não quis que o ser humano fosse destruído; eles mesmos, porém... profanaram
  alternative: não determinou que a humanidade perecesse; mas os seres criados macularam
  rationale: A redação conserva a tensão do texto entre a vontade do Altíssimo e a responsabilidade dos próprios seres criados, sem desenvolver uma doutrina adicional sobre decreto, liberdade ou juízo.
- issue: Valor de sic entre os destinos contrastantes
  choice: mas
  alternative: assim / do mesmo modo
  rationale: Embora sic normalmente signifique 'assim', a estrutura contrapõe o destino de 'vocês' ao de 'eles'. 'Mas' torna essa relação inteligível em português, em consonância com o contexto, sem alterar os sujeitos nem os castigos mencionados.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. Conservou-se a imagem de 'receber' apesar de sua estranheza, por estar claramente presente no latim. Não se reproduziu a nota da camada inglesa ('Ainda mais, pisotearam os seus justos'), pois ela pertence à cláusula latina anterior e não constitui variante legítima deste versículo.
