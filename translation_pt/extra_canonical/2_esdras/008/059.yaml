  rationale: A revisão remove a concessão interpretativa indevida, restaura o plural dos elementos preditos e dos verbos correspondentes e ajusta os complementos de «receber» à norma e ao registro literário. Mantém-se a metáfora incomum de ser «recebido» pelos destinos anunciados, bem como a ambiguidade textual quanto à identidade precisa dos grupos designados por «vós» e «eles».
