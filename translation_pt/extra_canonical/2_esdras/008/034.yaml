source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid est enim homo, ut ei indigneris, aut genus corruptibile, ut ita amariceris de ipso.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/034.yaml
  text: For what is man, that you should be angry with him, or a corruptible race, that you should be so embittered against it?
translation:
  language: pt
  text: Pois o que é o ser humano, para que te indignes contra ele? Ou o que é uma raça corruptível, para que estejas tão amargurado contra ela?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homo
  choice: ser humano
  rationale: Expressa o sentido genérico do latim homo em português moderno, sem restringi-lo ao sexo masculino.
- source_word: indigneris
  choice: te indignes contra
  rationale: Preserva o sentido de indignação ou ira dirigida contra alguém e mantém o tom retórico da oração.
- source_word: genus corruptibile
  choice: raça corruptível
  rationale: Mantém a formulação coletiva e a condição sujeita à corrupção e à mortalidade; aqui, “raça” significa a humanidade como estirpe, não uma categoria étnica.
- source_word: amariceris
  choice: fiques tão amargurado
  rationale: Reproduz o estado de amargura expresso pelo verbo latino, sem reduzi-lo simplesmente a ira.
theological_decisions:
- issue: Antropologia implícita em genus corruptibile
  choice: raça corruptível
  alternative: humanidade mortal
  rationale: A tradução conserva a imagem e a ambiguidade de corruptibile, que pode envolver mortalidade, perecibilidade e corrupção, sem explicá-la teologicamente no corpo do versículo.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com paralelismo retórico preservado. O pronome divino permanece em minúscula, conforme o uso editorial contemporâneo, e não foram acrescentadas explicações interpretativas ao texto.
