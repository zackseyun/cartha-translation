review_pass:
  verdict: revise
  source_fidelity: A primeira oração traduz com fidelidade homo e indigneris. Na segunda, genus corruptibile é adequadamente mantido como coletivo humano, e «contra ela» explicita corretamente o referente neutro ipso. Contudo, a construção «fiques tão amargurado contra ela» é pouco idiomática em português moderno e enfraquece a relação adversativa expressa por amariceris de ipso.
  naturalness: «Ficar amargurado contra» soa forçado; «estar tão amargurado contra» é mais natural e preserva o sentido de um estado de amargura/ressentimento dirigido contra a humanidade. A repetição de «o que é» conserva de modo claro o paralelismo retórico elíptico do latim.
  terminology: «Ser humano» é uma boa equivalência inclusiva para homo. «Raça corruptível» é defensável como tradução formal de genus corruptibile, embora «raça» tenha hoje associações étnicas; no contexto, o modificador e o paralelismo deixam claro o sentido coletivo da humanidade. «Corruptível» preserva a amplitude de perecível/mortal e sujeito à corrupção.
  issues:
  - severity: medium
    issue: 'Construção pouco natural: «fiques tão amargurado contra ela».'
    rationale: Em português moderno, «ficar amargurado contra» não é uma colocação fluente. «Estar tão amargurado contra» expressa de forma mais idiomática o estado indicado por amariceris, sem reduzir o termo a simples ira nem eliminar sua direção contra o referente.
  revised_text: Pois o que é o ser humano, para que te indignes contra ele? Ou o que é uma raça corruptível, para que estejas tão amargurado contra ela?
  revised_footnotes: []
  revision_rationale: A revisão limita-se a substituir uma construção verbal pouco natural por uma formulação portuguesa mais fluente. Também explicita o artigo indefinido em «uma raça», correspondente ao valor de genus na pergunta retórica, sem alterar o sentido coletivo ou a ambiguidade de corruptibile.
