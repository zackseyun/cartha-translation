  text: 'est tuo iussu, facili ordine, et utquid fiebat? Et nunc dicens dicam: de omni homine tu magis scis, de populo autem tuo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/015.yaml
  text: 'It is by your command[a], in an easy order, and why was it done? And now I will speak: concerning every man you know better, but concerning your people'
translation:
  language: pt
  text: 'Isso acontece por tua ordem, de modo simples — e por que foi feito? Agora direi: tu sabes mais a respeito de cada ser humano, mas, a respeito do teu povo,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuo iussu
  choice: por tua ordem
  rationale: Expressa de modo direto a ideia de algo ocorrer por determinação divina.
- source_word: facili ordine
  choice: de modo simples
  rationale: Evita a expressão pouco natural «em uma ordem fácil», preservando a ideia de facilidade ou simplicidade no modo como isso ocorre.
- source_word: utquid fiebat
  choice: por que foi feito?
  rationale: Mantém a pergunta causal do latim sem tentar explicar seu referente, que permanece ambíguo no fragmento.
- source_word: dicens dicam
  choice: direi
  rationale: A construção enfática é vertida naturalmente em português; «falando, direi» seria rígido e redundante.
- source_word: de omni homine
  choice: a respeito de cada ser humano
  rationale: «Cada ser humano» comunica o sentido distributivo de omni homine em linguagem atual e inclusiva.
- source_word: magis scis
  choice: sabes mais
  rationale: Preserva o comparativo magis, embora o termo de comparação não esteja expresso no trecho.
theological_decisions:
- issue: Objeto e finalidade da ação divina
  choice: Manter os referentes implícitos
  alternative: Explicitar o que acontece por ordem de Deus e por que foi criado ou realizado
  rationale: O fragmento latino não identifica claramente esses referentes; acrescentá-los resolveria indevidamente a ambiguidade textual.
- issue: Frase interrompida no fim do versículo
  choice: Encerrar com vírgula, deixando a oração aberta
  alternative: Completar com material do versículo seguinte
  rationale: A fonte fornecida termina em «de populo autem tuo»; a tradução respeita esse limite e não importa palavras ausentes.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com preferência por construções naturais. A sintaxe interrompida no final foi preservada porque o trecho-fonte termina no meio do contraste.
