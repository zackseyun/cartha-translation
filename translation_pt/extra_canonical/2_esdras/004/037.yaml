  text: and measured the times[a], and numbered the times, and he will not move or stir them until what was foretold is fulfilled.’”
translation:
  language: pt
  text: e mediu os tempos e os enumerou; ele não os moverá nem os agitará até que se cumpra o que foi predito[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «a medida predita».'
    reason: A forma latina praedicta, com verbo no singular, pode pressupor um substantivo feminino como «medida», embora esse substantivo não esteja expresso no texto.
lexical_decisions:
- source_word: mensurauit tempora
  choice: mediu os tempos
  rationale: Mantém diretamente a imagem do latim, em linguagem clara e solene.
- source_word: numero numerauit tempora
  choice: enumerou
  rationale: O verbo português expressa a ideia de contar ou numerar, preservando o jogo semântico do latim sem a formulação artificial «contou por número».
- source_word: non commouebit nec excitabit
  choice: não os moverá nem os agitará
  rationale: Conserva os dois verbos coordenados e a força imagética do texto, sem interpretar o segundo como «acelerar», «despertar» ou outra noção mais específica.
- source_word: usque dum impleatur praedicta
  choice: até que se cumpra o que foi predito
  rationale: Reproduz a ideia de cumprimento e trata praedicta de modo substantivado, sem acrescentar explicitamente um nome ausente no texto latino preservado.
theological_decisions:
- issue: O controle divino dos tempos
  choice: ele não os moverá nem os agitará
  alternative: eles não se moverão nem serão agitados
  rationale: A forma verbal latina é ativa e singular, apontando para o mesmo agente que mediu e enumerou os tempos; a tradução preserva essa agência sem explicar além do texto.
- issue: Referente implícito de praedicta
  choice: o que foi predito
  alternative: a medida predita
  rationale: Embora a concordância latina possa sugerir um substantivo feminino subentendido, «medida» não aparece expressamente nesta forma do texto; a redação escolhida preserva a abertura da expressão.
translation_notes:
  register: Português moderno, digno e de leitura ampla. A repetição pesada do latim numero numerauit foi condensada em «enumerou», enquanto a dupla verbal «moverá nem agitará» foi mantida para conservar a tensão e a imagem do original.
