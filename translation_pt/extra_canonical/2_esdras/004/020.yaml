    issue: Sentido potencialmente enganoso de «por ti mesmo»
    rationale: Em português moderno, «fazer/julgar por si mesmo» normalmente ressalta autonomia (“sem auxílio de outros”). O latim «tibi» aponta antes para a relação do julgamento com a própria pessoa do interlocutor. A revisão conserva a abertura semântica e produz uma leitura mais fiel.
