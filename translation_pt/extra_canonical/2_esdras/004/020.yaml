  text: 'a mim e disse: “Julgaste bem; por que, então, não julgaste a teu próprio respeito?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: bene
  choice: bem
  rationale: Expressa de modo natural e direto a avaliação positiva do julgamento, sem intensificar o sentido.
- source_word: tibi
  choice: por ti mesmo
  rationale: Mantém a ideia reflexiva de julgar em favor de si ou no próprio caso, com formulação corrente e próxima da ambiguidade do latim.
theological_decisions:
- issue: Alcance de “iudicasti tibi”
  choice: “julgaste por ti mesmo”
  alternative: “julgaste o teu próprio caso”
  rationale: A alternativa explicita uma referência judicial ao próprio caso que o dativo latino “tibi” não determina por si só; a tradução escolhida preserva melhor sua abertura sem resolver a tensão.
translation_notes:
  register: Português moderno, digno e acessível, com legibilidade brasileira e formas pronominais amplamente compreensíveis. A abertura fragmentária “a mim” foi preservada porque o texto-fonte fornecido começa no meio da oração.
