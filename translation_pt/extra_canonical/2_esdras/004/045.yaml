base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/045.yaml
  text: 'If it is possible[a], and if I am fit, show me this also: whether more is to come than has passed, or whether more has passed over.'
translation:
  language: pt
  text: 'Se for possível e se eu estiver apto, mostra-me também isto: se há mais por vir do que passou, ou se mais já passou sobre.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O texto latino deste versículo termina literalmente com “passou sobre”; “nós” vem no início do versículo seguinte na sequência do texto.
    reason: Esclarece a elipse produzida pela divisão editorial dos versículos, sem acrescentar ao texto deste versículo a palavra que inicia o seguinte.
lexical_decisions:
- source_word: idoneus
  choice: apto
  rationale: Expressa capacidade ou condição adequada sem introduzir a conotação moral mais forte de “digno”.
- source_word: plus quam praeteriit habet uenire
  choice: há mais por vir do que já passou
  rationale: Reproduz de modo natural a comparação temporal e mantém a construção impessoal do latim.
- source_word: plura pertransierunt super
  choice: mais já passou sobre nós
  rationale: Conserva a imagem de algo que “passou sobre” alguém; “nós”, situado no começo do versículo seguinte na sequência latina, completa a construção.
theological_decisions: []
translation_notes:
  register: Português moderno, claro e digno. A formulação preserva a dupla condição inicial e a imagem incomum do tempo que passou “sobre nós”, sem transformá-la numa comparação mais simétrica não explicitada pelo texto.
