id: 2ES.4.23
reference: 2 Esdras 4:23
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Non enim uolui interrogare de superioribus uiis, sed de his quae pertranseunt per nos cotidie: propter quod, Israel datus est in obprobrium gentibus, quem dilexisti populum datus est tribubus impiis, et lex patrum nostrorum in inritum deducta'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/023.yaml
  text: 'For I did not want to ask about the ways above[a], but about the things that happen among us daily: why Israel has been given over as a reproach to the nations, why the people whom you loved has been given over to ungodly tribes, and why the law of our fathers has been brought to nothing.'
translation:
  language: pt
  text: 'Pois eu não quis perguntar sobre os caminhos do alto, mas sobre aquilo que acontece entre nós todos os dias[a]: por que Israel foi entregue ao desprezo das nações, por que o povo que amaste foi entregue a tribos ímpias e por que a lei de nossos pais foi reduzida a nada.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “aquilo que nos sobrevém todos os dias”; literalmente, “aquilo que passa através de nós todos os dias”.'
    reason: O latim conserva uma formulação que pode ser entendida como acontecimentos ocorridos entre a comunidade ou como coisas que lhe sobrevêm.
lexical_decisions:
- source_word: superioribus uiis
  choice: caminhos do alto
  rationale: Preserva a referência espacial ou transcendente do latim em português natural, sem especificar além do que o texto diz.
- source_word: quae pertranseunt per nos cotidie
  choice: aquilo que acontece entre nós todos os dias
  rationale: Expressa em português corrente o sentido contextual de acontecimentos vividos diariamente pela comunidade; a tradução mais literal e a possível nuance de algo que lhes sobrevém são registradas em nota.
- source_word: in obprobrium gentibus
  choice: ao desprezo das nações
  rationale: Comunica que Israel foi entregue à desonra e ao escárnio por parte das nações, evitando o pouco natural 'em opróbrio'.
- source_word: tribubus impiis
  choice: tribos ímpias
  rationale: Mantém tanto o substantivo coletivo do latim quanto seu juízo religioso, sem substituir 'tribos' por um termo mais amplo.
- source_word: in inritum deducta
  choice: foi reduzida a nada
  rationale: Reproduz a ideia de tornar a lei ineficaz ou sem efeito em linguagem clara e digna.
theological_decisions:
- issue: Natureza dos 'caminhos do alto'
  choice: Manter a expressão sem explicar se designa mistérios celestes, providência divina ou outra realidade superior.
  alternative: Interpretar explicitamente como 'os caminhos celestiais' ou 'os mistérios do céu'.
  rationale: O latim não define a referência, e explicá-la no corpo do texto eliminaria uma ambiguidade genuína.
- issue: Sentido da anulação da lei
  choice: Traduzir como 'reduzida a nada', preservando a denúncia retórica sem formular uma tese sobre a validade teológica da lei.
  alternative: Traduzir como 'revogada' ou 'abolida'.
  rationale: Essas alternativas poderiam sugerir uma ab-rogação formal ou divina que o texto não afirma.
translation_notes:
  register: Português moderno, claro e solene, com boa legibilidade brasileira. A repetição de “por que” explicita o paralelismo das três queixas já implícito no latim, sem alterar seu conteúdo.
