  text: Did not the souls of the righteous ask about these things in their chambers[a], saying, ‘How long shall I hope thus? And when will the fruit of the threshing floor of our reward come?’ And Jeremiel answered them[b],
translation:
  language: pt
  text: 'Não perguntaram as almas dos justos sobre essas coisas em seus aposentos[a], dizendo: “Até quando esperarei assim[b]? E quando virá o fruto da eira da nossa recompensa?” E Jeremiel lhes respondeu:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A imagem das almas em “depósitos” ou aposentos reservados antecipa a comparação com o parto nos vv. 40–42: elas são mantidas nesses lugares até que se complete o número determinado.'
    reason: cross_reference
  - marker: b
    text: O latim traz “esperarei”, no singular; pelo sujeito plural e pela expressão “nossa recompensa”, outras versões antigas e alguns tradutores entendem “esperaremos”.
    reason: textual_variant
lexical_decisions:
- source_word: suis
  choice: seus aposentos
  rationale: O possessivo latino remete ao lugar reservado em que estão as almas, expresso no contexto textual mais amplo. “Aposentos” mantém a imagem espacial sem impor a ideia mais específica de um armazém.
- source_word: fructus areae mercedis nostrae
  choice: o fruto da eira da nossa recompensa
  rationale: Preserva a metáfora agrícola incomum e sua relação genitiva, sem reduzi-la simplesmente a “nossa recompensa”.
- source_word: Hieremiel
  choice: Jeremiel
  rationale: Transliteração portuguesa clara do nome próprio latino.
theological_decisions:
- issue: Número verbal em spero
  choice: “esperarei”, no singular
  alternative: “esperaremos”, no plural
  rationale: O texto latino preservado traz a primeira pessoa do singular, embora as almas falem coletivamente e digam “nossa recompensa”. A tradução mantém essa tensão textual, enquanto a nota registra a alternativa apoiada pelo contexto e por outras versões antigas.
- issue: Condição intermediária das almas justas
  choice: “em seus aposentos”
  alternative: “em seus depósitos” ou “em seus celeiros”
  rationale: A formulação comunica um lugar reservado sem definir além do texto a natureza desse estado nem introduzir uma doutrina confessional específica.
translation_notes:
  register: Português moderno, claro e digno, com pontuação direta no discurso citado. Conserva-se a metáfora da eira e a discordância de número do testemunho latino, esclarecida em nota.
