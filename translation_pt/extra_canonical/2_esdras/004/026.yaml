  text: 'inuocatum est super nos? de his interrogaui. Et respondit ad me et dixit: si fueris uidebis, et si uixeris frequenter miraberis,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/026.yaml
  text: And he answered me and said, “If you are, you will see; and if you live, you will often marvel,”
translation:
  language: pt
  text: 'E ele me respondeu e disse: “Se fores, verás; e, se viveres, muitas vezes te maravilharás.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: si fueris
  choice: Se fores
  rationale: Preserva a forma do verbo latino esse (‘ser’) e sua distinção em relação a si vixeris (‘se viveres’), sem acrescentar uma ideia como ‘se viveres o bastante’.
- source_word: frequenter
  choice: muitas vezes
  rationale: Expressa o sentido reiterativo de frequenter em português natural, sem introduzir uma noção de duração.
- source_word: miraberis
  choice: te maravilharás
  rationale: Mantém o sentido de espanto ou admiração intensa do verbo latino mirari e o tom elevado da passagem.
theological_decisions:
- issue: Relação entre si fueris e si vixeris
  choice: 'Manter duas formulações distintas: “Se fores” e “se viveres”'
  alternative: Uniformizar ambas como “se viveres” ou explicar a primeira como “se viveres o bastante”
  rationale: O latim emprega verbos diferentes e apresenta uma formulação incomum na primeira oração. A tradução conserva essa tensão em vez de a resolver interpretativamente.
translation_notes:
  register: Português moderno, digno e amplamente inteligível. Conserva a repetição semítica/latina “respondeu e disse” e a estranheza deliberada de “Se fores”, refletindo de perto o texto-fonte.
