source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'transisset flamma et uidi et ecce superauit fumus. Et post hoc transiit coram me nubs plena aquae et inmisit pluuiam impetu multam, et cum transisset impetus pluuiae superauerunt in ea guttae. Et dixit ad me ; cogita tibi ; sicut enim crescit pluuia amplius quam guttae et ignis amplius quam fumus, sic superhabundauit quae transiuit mensura, superauerunt autem guttae et fumus. Et oraui et dixi : putas uiuo usque in diebus illis ? uel quis erit in diebus illis ? Respondit ad me et dixit : de signis de quibus me interrogas, ex parte possum tibi dicere, de uita autem tua non sum missus dicere tibi, sed nescio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/049.yaml
  text: and behold[a], smoke remained behind. After this a cloud full of water passed before me and sent forth a great driving rain, and when the force of the rain had passed, drops remained behind in it.
translation:
  language: pt
  text: Depois que a chama passou, vi que, eis que, restou fumaça. Depois disso, uma nuvem cheia de água passou diante de mim e lançou uma grande chuva impetuosa; e, quando passou a força da chuva, restaram nela gotas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superauit
  choice: restou / restaram
  rationale: Neste contexto, o verbo indica aquilo que ficou para trás depois que o fenômeno principal passou; «restar» reproduz naturalmente essa ideia em português.
- source_word: nubs plena aquae
  choice: uma nuvem cheia de água
  rationale: Tradução direta, clara e fiel da expressão latina.
- source_word: inmisit pluuiam impetu multam
  choice: lançou uma chuva forte e impetuosa
  rationale: Conserva tanto a ação de fazer cair a chuva quanto a noção de grande intensidade expressa por «impetu multam».
- source_word: superauerunt in ea guttae
  choice: restaram nela algumas gotas
  rationale: Mantém explicitamente «in ea» («nela»), cujo referente é a nuvem, e emprega «algumas» de modo idiomático sem sugerir que todas as gotas permaneceram.
theological_decisions: []
translation_notes:
  register: Português moderno, digno e acessível, com estrutura próxima do latim sem sacrificar a naturalidade. O demonstrativo enfático «e eis que» preserva o tom visionário.
