source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: De quibus si mihi renunciaueris unam ex his, et ego tibi demonstrabo uiam quam desideras uidere, et doceam te quare cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/004.yaml
  text: If you report to me one of these[a], then I also will show you the way that you desire to see, and I will teach you why the heart is evil.”
translation:
  language: pt
  text: Se você me disser uma destas coisas[a], eu também lhe mostrarei o caminho que deseja ver e lhe ensinarei por que o coração é mau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Se você me explicar uma destas coisas”.'
    reason: O latim renunciaueris pode indicar relatar ou dar uma explicação/resposta; a nota preserva essa amplitude lexical.
lexical_decisions:
- source_word: renunciaueris
  choice: disser
  rationale: O verbo latino pode significar anunciar, relatar ou dar uma resposta. No contexto do desafio, “disser” é natural em português e mantém a ideia de apresentar uma resposta, sem acrescentar a noção de capacidade.
- source_word: uiam
  choice: caminho
  rationale: Equivalente direto e natural de uiam, preservando a imagem do texto.
- source_word: cor malignum
  choice: o coração é mau
  rationale: A construção latina elíptica é expressa naturalmente em português com a cópula “é”, mantendo “coração” em sentido moral e antropológico.
theological_decisions:
- issue: Natureza da condição em si mihi renunciaueris
  choice: Se você me disser
  alternative: Se você puder me explicar
  rationale: A forma verbal latina apresenta uma condição direta; não contém um verbo de capacidade. A tradução evita introduzir “puder” e deixa em aberto se a resposta consiste em relatar, declarar ou explicar.
- issue: Sentido de quare cor malignum
  choice: por que o coração é mau
  alternative: por que existe um coração mau
  rationale: A opção escolhida segue a leitura predicativa mais natural da frase elíptica e não transforma “coração” em referência explícita a um coração particular.
translation_notes:
  register: Português moderno, claro e digno, com construção condicional direta. O pronome “lhe” favorece ampla legibilidade brasileira sem tornar o registro coloquial demais.
source_grounding:
  english_pob_role: consult_only
