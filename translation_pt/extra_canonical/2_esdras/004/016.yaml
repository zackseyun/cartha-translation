  yaml_path: translation/extra_canonical/2_esdras/004/016.yaml
  text: 'Likewise also the plan of the waves of the sea: for the sand stood fast and held them back.'
translation:
  language: pt
  text: 'Assim também o intento das ondas do mar: a areia permaneceu firme e as conteve.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'O texto latino preservado neste ponto é fragmentário: «tomou-a; igualmente também o intento das ondas do mar, pois permaneceu firme». A areia como sujeito e a ideia de que ela conteve as ondas são uma reconstrução exigida pelo contexto textual.'
    reason: Distinguir o texto latino efetivamente preservado da reconstrução contextual adotada na tradução.
lexical_decisions:
- source_word: cogitatus
  choice: intento
  rationale: O latim exprime pensamento, propósito ou desígnio. “Intento” preserva a personificação das ondas sem sugerir um plano racional excessivamente elaborado.
- source_word: fluctuum maris
  choice: das ondas do mar
  rationale: Correspondência direta e natural ao genitivo latino.
- source_word: stetit
  choice: permaneceu firme
  rationale: Reproduz a ideia de estar ou manter-se de pé, ressaltando aqui a resistência da areia diante das ondas.
theological_decisions:
- issue: Personificação das ondas
  choice: Manter “intento das ondas”
  alternative: “movimento das ondas”
  rationale: A formulação latina cogitatus atribui figuradamente intenção ou pensamento às ondas; a tradução conserva essa tensão poética em vez de reduzi-la a mero movimento físico.
translation_notes:
  register: Português moderno, claro e digno. A construção mantém o paralelismo e a personificação do original, enquanto explicita com cautela o sujeito implícito exigido pelo contexto.
