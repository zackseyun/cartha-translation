  yaml_path: translation/extra_canonical/2_esdras/004/032.yaml
  text: When ears of grain without number are sown[a], how great a threshing floor they will begin to make! And he answered and said to me, “Until—
translation:
  language: pt
  text: 'Quando tiverem sido semeadas espigas incontáveis,[a] que grande eira começarão a formar! E ele respondeu e me disse: “Até—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Quando tiverem sido semeadas as espigas cujo número não se pode contar, que grande eira começarão a formar!”'
    reason: Registra uma tradução mais formal da oração relativa latina e preserva sua possível ênfase no número das espigas.
lexical_decisions:
- source_word: spicae quarum non est numerus
  choice: espigas incontáveis
  rationale: Expressa de modo natural a ideia de espigas cujo número não pode ser contado, preservando a imagem agrícola.
- source_word: aream
  choice: eira
  rationale: É o termo português específico para o espaço onde os grãos são debulhados.
- source_word: incipient facere
  choice: começarão a formar
  rationale: Mantém o aspecto incoativo de incipient e traduz facere de maneira idiomática no contexto.
- source_word: Et respondit et dixi
  choice: E ele respondeu e me disse
  rationale: O latim transmitido contém aparente incongruência entre a terceira pessoa de respondit e a primeira pessoa de dixi; pelo contexto e pela camada inglesa auditada, entende-se dixi como corrupção ou forma por dixit, sem transformar a frase numa fala do narrador.
- source_word: usque-
  choice: Até—
  rationale: Preserva a interrupção do texto-fonte, indicando que a frase continua no segmento seguinte.
