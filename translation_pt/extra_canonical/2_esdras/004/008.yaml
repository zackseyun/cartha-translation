source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Dicebas fortassis mihi : in abyssum non descendi, neque in infernum adhuc, neque in caelis unquam ascendi.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/008.yaml
  text: Perhaps you would have said to me[a], ‘I have not descended into the abyss, nor yet into Hades, nor have I ever ascended into heaven.’
translation:
  language: pt
  text: 'Talvez você me dissesse: “Não desci ao abismo, nem ainda ao mundo dos mortos[a], nem jamais subi ao céu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Hades”.'
    reason: Registra uma transliteração tradicional possível para o domínio dos mortos, preservando a alternativa lexical sem sobrecarregar o texto principal.
lexical_decisions:
- source_word: abyssum
  choice: abismo
  rationale: Equivalente direto e natural que preserva a imagem cosmológica do latim e sua distinção em relação a infernum.
- source_word: infernum
  choice: mundo dos mortos
  rationale: Expressa em português atual o domínio dos mortos indicado pelo latim, sem introduzir desnecessariamente associações da mitologia grega; a alternativa tradicional “Hades” é registrada em nota.
- source_word: caelis
  choice: céu
  rationale: Embora a forma latina seja plural, “subir ao céu” é a expressão idiomática e tradicional em português neste contexto.
- source_word: descendi / ascendi
  choice: desci / subi
  rationale: Mantém o contraste espacial e verbal explícito do texto-fonte em linguagem portuguesa natural.
theological_decisions:
- issue: Relação entre “abismo” e “infernum”
  choice: 'Manter dois lugares distintos: “abismo” e “mundo dos mortos”'
  alternative: Fundir ambos numa única ideia de profundezas ou inferno
  rationale: O latim os coordena como destinos diferentes; preservar a distinção evita resolver a cosmologia do texto.
- issue: Sentido de infernum
  choice: mundo dos mortos
  alternative: inferno; Hades
  rationale: “Inferno” pode sugerir especificamente lugar de punição final, algo que o termo não exige aqui; “mundo dos mortos” conserva maior amplitude sem impor uma doutrina posterior.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com “você” para legibilidade brasileira e construção direta. A modalidade de dicebas fortassis é vertida por “Talvez você me dissesse”, preservando o caráter hipotético sem tornar a frase artificial.
