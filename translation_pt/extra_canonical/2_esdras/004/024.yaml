source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: est, et dispositionis scriptae nusquam sunt. Et pertransimus de saeculo ut locustae, et uita nostra ut uapor, et nec digni sumus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/024.yaml
  text: and the written ordinances are nowhere to be found. And we pass through the age like locusts[a], and our life is like vapor, and we are not worthy,
translation:
  language: pt
  text: e as disposições escritas não se encontram em parte alguma.[a] E atravessamos esta era como gafanhotos, e nossa vida é como vapor, e não somos dignos,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A afirmação de que “as disposições escritas não se encontram em parte alguma” provavelmente se refere à perda efetiva ou à anulação da ordem escrita autorizada de Israel em meio à catástrofe, e não necessariamente ao desaparecimento físico de todos os manuscritos.
    reason: lexical_alternative
lexical_decisions:
- source_word: dispositionis scriptae
  choice: disposições escritas
  rationale: Mantém o sentido amplo de determinações ou ordenamentos registrados por escrito, sem restringi-lo indevidamente a um termo jurídico ou denominacional específico.
- source_word: pertransimus de saeculo
  choice: atravessamos esta era
  rationale: Expressa a ideia de passar através do tempo presente, evitando a leitura mais definitiva de 'deixamos este mundo'.
- source_word: ut locustae
  choice: como gafanhotos
  rationale: Tradução direta da comparação latina, preservando sua imagem coletiva e sua possível conotação de transitoriedade.
- source_word: uita nostra ut uapor
  choice: nossa vida é como vapor
  rationale: Conserva a metáfora breve e concreta do texto-fonte.
- source_word: nec digni sumus
  choice: nem sequer somos dignos
  rationale: Reproduz a negação enfática e mantém a oração incompleta, que prossegue no versículo seguinte.
theological_decisions:
- issue: Sentido da ausência das disposições escritas
  choice: Formulação literal no texto, com esclarecimento em nota sobre possível perda de vigência ou acesso
  alternative: Interpretar diretamente como destruição física de todos os manuscritos
  rationale: O latim afirma que não são encontradas em parte alguma, mas não determina se isso significa desaparecimento material total ou perda efetiva da ordem escrita sob a catástrofe.
- issue: Sentido de saeculum
  choice: esta era
  alternative: o mundo
  rationale: Era preserva melhor a dimensão temporal de saeculum e evita resolver a expressão como referência exclusivamente espacial ao mundo.
translation_notes:
  register: Português moderno, digno e acessível, com vocabulário de ampla compreensão. A vírgula final preserva o caráter incompleto da oração no trecho fornecido.
