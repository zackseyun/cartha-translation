  text: and said, ‘Come, let us go up and subdue the forest of the plain, so that there too we may gain for ourselves another region.’ But the plan concerning the forest was in vain, for fire came and consumed it.
translation:
  language: pt
  text: 'e disseram: “Venham, subamos e subjuguemos a floresta da planície, para que também ali obtenhamos para nós outra região.” Mas o plano a respeito da floresta foi inútil, pois veio fogo e a consumiu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: debellemus
  choice: dominemos
  rationale: Expressa a ideia de vencer e sujeitar pela força, sem restringir o verbo a uma formulação militar pouco natural neste contexto alegórico.
- source_word: siluam campi
  choice: a floresta da planície
  rationale: Reproduz diretamente a construção latina e preserva o contraste imagético entre floresta e planície.
- source_word: consummemus nobismetipsis aliam regionem
  choice: obtenhamos para nós outra região
  rationale: No contexto, o verbo indica adquirir ou assegurar um território; a formulação portuguesa comunica esse sentido com naturalidade.
- source_word: cogitatus siluae
  choice: o plano a respeito da floresta
  rationale: Evita a leitura ambígua de que a própria floresta formulou o plano e indica que se trata do projeto dirigido contra ela.
- source_word: in uano
  choice: foi inútil
  rationale: Transmite que o plano não produziu resultado, em português claro e corrente.
