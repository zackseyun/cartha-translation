id: 2ES.4.9
reference: 2 Esdras 4:9
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc autem non interrogaui te nisi de igne et uento et die, per quae transisti, et sine quibus esse non potes, et non respondisti mihi de eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/009.yaml
  text: But now I have asked you only about fire and wind and day[a], through which you have passed and without which you cannot exist, and you have not answered me about them.
translation:
  language: pt
  text: Mas agora eu só lhe perguntei sobre o fogo, o vento e o dia, pelos quais você passou e sem os quais não pode existir, e você não me respondeu a respeito deles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nunc autem
  choice: Mas agora
  rationale: Preserva o contraste e a transição temporal do latim em português natural.
- source_word: non interrogaui te nisi
  choice: eu só lhe perguntei
  rationale: Expressa de modo idiomático a construção restritiva latina, literalmente 'não lhe perguntei senão'.
- source_word: die
  choice: dia
  rationale: Mantém o sentido direto do substantivo latino e a coordenação com fogo e vento.
- source_word: per quae transisti
  choice: pelos quais você passou
  rationale: Conserva a imagem e a relativa do texto latino sem acrescentar explicação ausente da fonte.
- source_word: sine quibus esse non potes
  choice: sem os quais não pode existir
  rationale: Reproduz a afirmação existencial do latim, preservando sua possível tensão conceitual.
- source_word: de eis
  choice: a respeito deles
  rationale: Retoma coletivamente os três elementos de maneira clara e digna.
theological_decisions:
- issue: Alcance da impossibilidade expressa em 'esse non potes'
  choice: não pode existir
  alternative: não pode viver
  rationale: '''Existir'' corresponde mais diretamente a ''esse'' e evita restringir a afirmação ao sentido biológico de viver.'
translation_notes:
  register: Português moderno, claro e digno, com tratamento por 'você' para ampla legibilidade brasileira. A sintaxe acompanha de perto o latim, mas a restrição 'non... nisi' foi vertida de forma idiomática. Não se inseriu nota, pois a nota inglesa decorre de pontuação de uma versão anterior e não de uma variante ou ambiguidade da fonte.
