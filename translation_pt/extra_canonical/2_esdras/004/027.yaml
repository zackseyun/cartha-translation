- from: porque esta era se apressa cada vez mais para passar. Pois ela não é capaz de comportar as coisas que foram prometidas para os justos nos tempos determinados, porque esta era está cheia de tristeza e fraquezas.
  to: porque esta era está se apressando para passar. Pois ela não pode comportar as coisas que foram prometidas nos tempos devidos, porque esta era está cheia de tristeza e fraquezas.
  rationale: A revisão elimina a intensificação progressiva não expressa no original e corrige a análise de in temporibus iustis, que se refere aos tempos devidos/apropriados, não aos justos. Mantêm-se o registro digno, a coesão e a ambiguidade funcional de capiet portare, sem acrescentar uma interpretação teológica.
