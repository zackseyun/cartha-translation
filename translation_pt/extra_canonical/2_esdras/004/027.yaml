reference: 2 Esdras 4:27
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam festinans festinat saeculum pertransire; Non enim capiet portare quae in temporibus iustis repromissa sunt, quoniam plenum mesticia est saeculum hoc et infirmitatibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/027.yaml
  text: because the age is hastening quickly to pass away. For it cannot bear the things that have been promised for the righteous in their proper times, because this age is full of sorrows and weaknesses.
translation:
  language: pt
  text: porque esta era está se apressando para passar. Pois ela não pode comportar as coisas que foram prometidas nos tempos devidos, porque esta era está cheia de tristeza e fraquezas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  choice: era
  rationale: No contexto apocalíptico, designa a ordem ou era presente, não simplesmente o mundo físico.
- source_word: festinans festinat
  choice: se apressa cada vez mais
  rationale: Reproduz de modo natural a construção intensiva latina, evitando a redundância pouco idiomática de uma tradução palavra por palavra.
- source_word: capiet portare
  choice: é capaz de comportar
  rationale: Preserva a imagem da capacidade desta era de conter ou sustentar as realidades prometidas, sem reduzir o sentido a mera tolerância emocional.
- source_word: repromissa sunt
  choice: foram prometidas
  rationale: Expressa com clareza o perfeito passivo; o prefixo latino não exige aqui 'prometidas novamente'.
- source_word: in temporibus iustis
  choice: nos tempos determinados
  rationale: Entende iustis como tempos apropriados ou devidos, mantendo a noção de ocasião estabelecida sem sugerir que os próprios períodos tenham caráter moral.
- source_word: mesticia
  choice: tristeza
  rationale: O singular coletivo latino é vertido naturalmente como substantivo singular em português.
- source_word: infirmitatibus
  choice: fraquezas
  rationale: Mantém a amplitude do termo latino, que pode abranger debilidades e enfermidades.
theological_decisions:
- issue: Destinatários das promessas
  choice: prometidas para os justos
  alternative: prometidas aos justos
  rationale: A construção latina disponível, quae ... repromissa sunt seguida de in temporibus iustis, é sintaticamente difícil; seguindo a leitura contextual e a camada inglesa auditada, entende-se iustis como referência aos justos, enquanto temporibus comunica os tempos próprios. A formulação com 'para' evita afirmar além do texto se eles são apenas destinatários ou beneficiários.
- issue: Relação entre a era presente e as promessas
  choice: não é capaz de comportar
  alternative: não pode suportar
  rationale: 'Mantém a personificação e a tensão apocalíptica: a era presente, cheia de tristeza e fraquezas, não possui capacidade para conter o que foi prometido.'
translation_notes:
  register: Português moderno, digno e acessível, com cadência apocalíptica. A repetição de 'esta era' foi mantida para conservar a coesão e a ênfase do original.
