base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/039.yaml
  text: We are all full of impiety. And perhaps because of us the threshing floor of the righteous is kept back[a], because of the sins of those who dwell there.
translation:
  language: pt
  text: Todos nós estamos cheios de impiedade. E talvez, por nossa causa, a eira dos justos seja retida[a], por causa dos pecados dos habitantes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: «seja impedida»; também pode ter o sentido de «seja atrasada».'
    reason: O latim «prohibeatur» expressa impedimento ou retenção; no contexto, isso também pode resultar em demora.
lexical_decisions:
- source_word: impietatem
  choice: impiedade
  rationale: Equivalente direto que preserva o sentido moral e religioso do latim em registro digno e corrente.
- source_word: prohibeatur
  choice: seja impedida
  rationale: Preserva o sentido amplo de ser obstada, retida ou impedida, sem reduzi-lo apenas a uma demora temporal.
- source_word: area
  choice: eira
  rationale: Mantém a imagem agrícola específica do lugar onde o cereal é debulhado e joeirado.
- source_word: inhabitantium
  choice: dos que nela habitam
  rationale: Traduz literalmente a ideia dos habitantes e entende o referente implícito como a eira, conforme o advérbio pronominal exigido pelo português.
theological_decisions:
- issue: Sentido de «a eira dos justos»
  choice: Manter a metáfora sem explicá-la no corpo do texto
  alternative: Interpretar explicitamente como colheita, recompensa ou morada dos justos
  rationale: O latim conserva uma imagem teologicamente sugestiva, mas não explicita seu referente; a tradução não deve resolver essa ambiguidade.
- issue: Força de «prohibeatur»
  choice: seja impedida
  alternative: seja atrasada
  rationale: «Impedida» mantém a noção de obstáculo ou retenção e não transforma necessariamente o enunciado em simples atraso cronológico.
translation_notes:
  register: Português moderno, claro e solene, com sintaxe natural e preservação da metáfora agrícola e da ambiguidade do original latino.
