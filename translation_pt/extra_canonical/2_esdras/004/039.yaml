- from: Todos nós estamos cheios de impiedade. E talvez, por nossa causa, a eira dos justos seja impedida[a], por causa dos pecados dos que nela habitam.
  to: Todos nós estamos cheios de impiedade. E talvez, por nossa causa, a eira dos justos seja retida[a], por causa dos pecados dos habitantes.
  rationale: Substitui-se «dos que nela habitam» por «dos habitantes», pois o latim não especifica onde eles habitam. «Seja retida» torna mais natural em português a imagem de uma eira que é «mantida de volta», preservando o valor amplo de *prohibeatur* e registrando alternativas legítimas na nota.
