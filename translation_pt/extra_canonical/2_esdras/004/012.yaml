  text: 'do que, tendo vindo, viver na impiedade, sofrer e não entender por que. E ele me respondeu e disse: “Partindo,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quam
  choice: do que
  rationale: Conserva a comparação iniciada no contexto anterior, embora o trecho fornecido comece no segundo termo dela.
- source_word: aduenientes
  choice: tendo vindo
  rationale: Reproduz o particípio perfeito e a ideia de haver chegado à existência ou a esta condição, sem explicitar além do latim.
- source_word: impietatibus
  choice: impiedade
  rationale: O plural latino pode expressar a esfera ou prática da impiedade; o singular abstrato é natural em português e preserva o sentido moral-religioso.
- source_word: pati
  choice: sofrer
  rationale: Equivalente direto e abrangente, sem especificar a causa ou a forma do sofrimento.
- source_word: de qua re
  choice: por quê
  rationale: Expressa naturalmente a falta de compreensão da razão do sofrimento.
- source_word: proficiscens
  choice: Partindo
  rationale: Mantém o particípio presente e o final suspenso do versículo, que continua sintaticamente no versículo seguinte.
theological_decisions:
- issue: Natureza da impiedade
  choice: viver na impiedade
  alternative: viver em atos de impiedade
  rationale: A formulação abstrata preserva a amplitude do plural latino sem introduzir uma lista ou interpretação específica de pecados.
- issue: Final fragmentário com proficiscens
  choice: “Partindo,
  alternative: “Vai,
  rationale: O particípio deve ser preservado, pois provavelmente participa de uma construção semítica continuada no versículo seguinte; convertê-lo em imperativo alteraria a relação gramatical.
translation_notes:
  register: Português moderno, digno e legível. A redação preserva tanto o início dependente do contexto anterior quanto o encerramento deliberadamente incompleto. A fórmula latina respondit ad me et dixit foi vertida de modo natural como “ele me respondeu”, evitando a redundância pouco idiomática “respondeu-me e disse” sem perda de conteúdo.
