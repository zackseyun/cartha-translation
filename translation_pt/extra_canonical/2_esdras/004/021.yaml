id: 2ES.4.21
reference: 2 Esdras 4:21
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: metipso? Quemadmodum enim terra siluae data est et mare fluctibus suis, sic et qui super terram inhabitant quae sunt super terram intellegere solummodo possunt, et qui super caelos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/021.yaml
  text: For just as the earth has been given to the forest[a], and the sea to its waves, so also those who dwell upon the earth can understand only what is on the earth, and he who is above the heavens, what is above the heavens.”
translation:
  language: pt
  text: Pois, assim como a terra foi dada à floresta, e o mar, às suas ondas, também os que habitam sobre a terra só podem compreender o que está sobre a terra; e aquele[a] que está acima dos céus pode compreender o que está acima dos céus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O latim também pode ser entendido, isoladamente, como “os que estão acima dos céus”; versões antigas, porém, apoiam o singular.
    reason: Registra a ambiguidade morfológica de qui sem ocultar a evidência textual que favorece a leitura singular.
lexical_decisions:
- source_word: siluae
  choice: à floresta
  rationale: Reproduz diretamente o dativo latino e preserva a imagem incomum do texto, sem substituí-la por uma interpretação conjectural.
- source_word: intellegere solummodo possunt
  choice: só podem compreender
  rationale: Expressa de modo natural em português tanto a limitação indicada por solummodo quanto a capacidade indicada por possunt.
- source_word: super terram / super caelos
  choice: sobre a terra / acima dos céus
  rationale: Mantém o paralelismo espacial, usando formulações idiomáticas em português para cada contexto.
- source_word: qui super caelos
  choice: aquele que está acima dos céus
  rationale: O latim qui é formalmente ambíguo quanto ao número, mas as versões antigas derivadas do grego apontam para o singular; a formulação preserva a referência pessoal sem acrescentar explicitamente o nome de Deus.
theological_decisions:
- issue: Número e referente de qui super caelos
  choice: aquele que está acima dos céus
  alternative: os que estão acima dos céus
  rationale: Embora qui possa ser singular ou plural em latim, o testemunho das versões siríaca e etíope favorece o singular, em contraste entre os seres humanos terrenos e aquele que está acima dos céus. Não se explicita “Deus” no corpo do texto porque o latim usa apenas a expressão relativa.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo próximo ao latim. A elipse do segundo verbo foi explicitada como “pode compreender” para garantir clareza em português, sem alterar o sentido. A imagem difícil “a terra foi dada à floresta” foi preservada.
