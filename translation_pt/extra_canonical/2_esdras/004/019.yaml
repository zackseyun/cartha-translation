  yaml_path: translation/extra_canonical/2_esdras/004/019.yaml
  text: I said, “Both have devised a vain plan, for the earth has been given to the forest, and the place of the sea to bear its waves.” And he answered
translation:
  language: pt
  text: 'Eu disse: “Ambos conceberam um plano inútil, pois a terra foi dada à floresta, e ao lugar do mar foi dado suportar suas ondas.” E ele respondeu:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: utrique
  choice: Ambos
  rationale: Reproduz diretamente a referência aos dois elementos personificados mencionados no contexto.
- source_word: uanam cogitationem cogitauerunt
  choice: conceberam um plano inútil
  rationale: Expressa o jogo etimológico latino de maneira natural em português e conserva a ideia de um intento sem possibilidade de êxito.
- source_word: terra enim data est siluae
  choice: pois a terra foi dada à floresta
  rationale: Mantém a construção passiva e a relação de domínio ou espaço atribuída à floresta.
- source_word: maris locus
  choice: o lugar do mar
  rationale: Tradução formal que preserva a estrutura e a personificação do texto latino.
- source_word: portare fluctus suos
  choice: para sustentar suas ondas
  rationale: Sustentar comunica que o espaço próprio do mar contém e suporta suas ondas, sem acrescentar uma cópula ausente no latim.
- source_word: Et respondit
  choice: 'E ele respondeu:'
  rationale: Mantém a transição incompleta para a fala do versículo seguinte; os dois-pontos sinalizam naturalmente sua continuação.
