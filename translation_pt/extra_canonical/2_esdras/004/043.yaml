base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/043.yaml
  text: They hasten to return the things that were entrusted from the beginning. Then what you desire to see will be shown to you.
translation:
  language: pt
  text: Eles se apressam a devolver aquilo que foi confiado desde o princípio. Então será mostrado a você algo a respeito daquilo que deseja ver.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinant
  choice: se apressam
  rationale: Reproduz de modo natural a ideia de agir com pressa.
- source_word: reddere
  choice: devolver
  rationale: Preserva o sentido de restituir algo recebido sob responsabilidade.
- source_word: ea quae commendata sunt
  choice: aquilo que lhes foi confiado
  rationale: Expressa o valor de commendare como confiar ou entregar aos cuidados de alguém; o pronome indireto fica implícito no latim, mas é exigido pela construção natural em português.
- source_word: ab initio
  choice: desde o princípio
  rationale: Mantém a referência temporal e o registro solene do original.
- source_word: demonstrabitur
  choice: será mostrado
  rationale: Conserva a voz passiva e não identifica um agente que o texto latino deixa sem nome.
- source_word: concupiscis uidere
  choice: deseja ver
  rationale: Neste contexto, concupiscere indica desejo intenso, sem exigir a conotação negativa que «cobiçar» costuma ter em português.
theological_decisions:
- issue: Agente da revelação futura
  choice: 'Voz passiva: «lhe será mostrado»'
  alternative: «Deus lhe mostrará»
  rationale: O original não nomeia o agente; a tradução preserva essa indeterminação e evita acrescentar uma identificação teológica.
- issue: Referente do sujeito plural
  choice: «Eles» sem identificação adicional
  alternative: Explicitar quem se apressa
  rationale: O versículo depende do contexto anterior para o referente; não se deve resolver no próprio texto uma referência que o latim mantém pronominal.
translation_notes:
  register: Português moderno, claro e digno, com legibilidade brasileira. Emprega «você» por naturalidade ampla no Brasil, enquanto «lhe» evita repetição e mantém fluidez. Não são necessárias notas de rodapé.
