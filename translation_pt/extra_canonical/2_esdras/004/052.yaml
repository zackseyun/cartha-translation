base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/052.yaml
  text: You ask insistently; I can tell you in part[a], but concerning your life, I have not been sent to tell you, and I do not know.
translation:
  language: pt
  text: Você insiste em perguntar; em parte posso lhe dizer[a], mas, quanto à sua vida, não fui enviado para lhe dizer e também não sei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'A resposta de Uriel permanece deliberadamente parcial: ele só pode dizer algo em parte e não foi enviado para falar sobre a vida de Esdras; além disso, declara não saber. A recusa ressalta a limitação do acesso humano ao tempo estabelecido por Deus.'
    reason: compositional_layer
lexical_decisions:
- source_word: perrogas
  choice: Você insiste em perguntar
  rationale: O verbo latino intensivo indica perguntar repetidamente ou com insistência; a formulação preserva essa força sem acrescentar conteúdo.
- source_word: ex parte
  choice: em parte
  rationale: Correspondência direta que mantém o caráter limitado da revelação.
- source_word: de vita autem tua
  choice: mas, quanto à sua vida
  rationale: Expressa com naturalidade a mudança de assunto marcada por autem e conserva a referência possivelmente ambígua à vida ou duração da vida de Esdras.
- source_word: non sum missus
  choice: não fui enviado
  rationale: Mantém a forma passiva e a ideia de uma missão cuja autoridade vem de outro, sem explicitar o agente.
- source_word: sed nescio
  choice: e não sei
  rationale: Neste contexto, sed pode introduzir a declaração adicional com valor adversativo ou continuativo; 'e' segue a coordenação adotada na camada inglesa e soa natural, sem apagar a contundência da ignorância declarada.
theological_decisions:
- issue: Limites do conhecimento e da missão do mensageiro
  choice: Preservar tanto 'não fui enviado' quanto 'não sei' como afirmações distintas
  alternative: Fundir as duas ideias ou interpretar 'não sei' apenas como recusa em revelar
  rationale: O latim apresenta explicitamente as duas afirmações; mantê-las conserva a tensão entre falta de autorização e falta de conhecimento.
- issue: Sentido de 'sua vida'
  choice: Traduzir literalmente como 'sua vida'
  alternative: Explicitar como 'quanto tempo você viverá' ou 'sua duração de vida'
  rationale: A expressão latina de vita tua pode apontar para a duração da vida, mas não a explicita; a tradução preserva a ambiguidade genuína.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. O pronome 'lhe' evita regionalizar excessivamente a fala; a ordem da frase permanece próxima do latim sem soar artificial.
