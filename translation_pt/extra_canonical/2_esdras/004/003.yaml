  text: 'Et dixi ; ita, dominus meus. et respondit mihi et dixit : tres uias missus sum ostendere tibi, et tres similitudines proponere coram te ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/003.yaml
  text: And I said, “Yes, my lord.” And he answered me and said, “I have been sent to show you three ways, and to set three comparisons before you.
translation:
  language: pt
  text: 'E eu disse: “Sim, meu senhor.” E ele me respondeu e disse: “Fui enviado para te mostrar três caminhos e apresentar perante ti três comparações.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ita
  choice: Sim
  rationale: No contexto, funciona como resposta afirmativa natural à fala anterior.
- source_word: dominus meus
  choice: meu senhor
  rationale: Preserva a forma respeitosa de tratamento sem atribuir necessariamente identidade divina ao interlocutor.
- source_word: tres uias
  choice: três caminhos
  rationale: Equivalente direto de «tres vias», mantendo a imagem e sua possível amplitude figurada.
- source_word: tres similitudines
  choice: três comparações
  rationale: Traduz «similitudines» no sentido de analogias ou problemas comparativos apresentados ao interlocutor, sem especificá-los como parábolas.
- source_word: proponere coram te
  choice: apresentar diante de você
  rationale: Conserva tanto a ideia de propor/apresentar quanto a expressão espacial e retórica «coram te».
theological_decisions:
- issue: Identidade do interlocutor em «dominus meus»
  choice: meu senhor
  alternative: meu Senhor
  rationale: A inicial minúscula preserva o tratamento honorífico do mensageiro e evita identificar implicitamente o interlocutor com Deus.
- issue: Agente implícito de «missus sum»
  choice: Fui enviado
  alternative: Ele me enviou
  rationale: A voz passiva mantém não nomeado o agente, como no texto latino, preservando a ambiguidade textual.
translation_notes:
  register: Português moderno, claro e digno, com ampla legibilidade brasileira. A repetição latina «respondit mihi et dixit» foi vertida naturalmente por «me respondeu», sem perda relevante de conteúdo; manteve-se a distinção entre «caminhos» e «comparações».
