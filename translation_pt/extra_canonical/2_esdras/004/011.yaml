    rationale: O latim diz corrupto saeculo, sem demonstrativo. «Era corrupta» transmite o sentido sem essa especificação adicional.
  - severity: low
    issue: «Seu vaso» é potencialmente ambíguo em endereço direto
    rationale: vas tuum está inequivocamente na segunda pessoa. «Teu vaso» torna essa referência explícita em português amplo e preserva a forma do original.
  - severity: low
    issue: A nota começa com uma identificação interpretativa categórica
    rationale: «Isto é» apresenta como definição o que é uma explicação plausível da metáfora. Uma formulação modal preserva melhor a abertura da imagem.
