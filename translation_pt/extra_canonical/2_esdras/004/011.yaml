source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uas tuum capere altissimi uiam, et iam exteritus corrupto saeculo intelligere incorruptionem? et cum haec audissem, cecidi in faciem meam, Et dixi illi: melius erat nos non adesse,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/011.yaml
  text: how can your vessel grasp the way of the Most High[a], and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face, and I said to him, “It would have been better for us not to exist,”
translation:
  language: pt
  text: 'Como pode o teu vaso[a] compreender o caminho do Altíssimo e, já desgastado por uma era corrupta, entender a incorruptibilidade?” Quando ouvi essas coisas, caí com o rosto em terra e lhe disse: “Teria sido melhor que nós não existíssemos,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, «teu vaso». A imagem pode referir-se à capacidade limitada do ser humano.
    reason: Esclarece a metáfora incomum sem substituir o seu sentido aberto no texto.
lexical_decisions:
- source_word: vas tuum
  choice: o seu vaso
  rationale: Preserva a metáfora concreta e incomum do latim, que apresenta a limitada capacidade humana como um recipiente, sem substituí-la por uma interpretação explicativa.
- source_word: capere
  choice: compreender
  rationale: Neste contexto, o verbo une as ideias de conter e apreender mentalmente; “compreender” comunica naturalmente o sentido cognitivo, enquanto “vaso” conserva a imagem de capacidade limitada.
- source_word: saeculo
  choice: era
  rationale: “Era” expressa o sentido temporal e moral de saeculum aqui, evitando restringi-lo a um século de cem anos ou ampliá-lo automaticamente para “mundo”.
- source_word: incorruptionem
  choice: incorruptibilidade
  rationale: Mantém o substantivo abstrato e seu contraste explícito com a era corrupta.
- source_word: nos non adesse
  choice: que nós não existíssemos
  rationale: Traduz idiomaticamente a ideia contextual de não estar presente ou não ter existência, em concordância com a reação desesperada do falante.
theological_decisions:
- issue: A capacidade humana diante do caminho do Altíssimo
  choice: Manter a pergunta e a metáfora do vaso sem explicá-las no corpo do texto
  alternative: Parafrasear como “como pode a mente humana compreender”
  rationale: A formulação da fonte enfatiza limitação sem identificar explicitamente o vaso com mente, corpo ou alma; a tradução não deve resolver essa imagem de modo doutrinário.
- issue: Relação entre desgaste, era corrupta e compreensão da incorruptibilidade
  choice: Conservar “já desgastado por esta era corrupta” junto ao sujeito metafórico
  alternative: Reformular para tornar o referente exclusivamente a pessoa ou a humanidade
  rationale: A sintaxe associa o desgaste ao “vaso”, mas a imagem naturalmente abrange a pessoa; manter essa construção preserva a tensão da fonte.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com sintaxe natural. Conservou-se a metáfora marcante de “vaso” e o contraste “corrupta/incorruptibilidade”. A vírgula final reflete que a fala continua no versículo seguinte.
