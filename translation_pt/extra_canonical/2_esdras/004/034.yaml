id: 2ES.4.34
reference: 2 Esdras 4:34
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'respondit ad me et dixit: non festinas tu super altissimum, tu enim festinas propter temetipsum, nam excelsus pro multis. Nonne de his interrogauerunt animae iustorum in promptuariis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/034.yaml
  text: And he answered me and said[a], “You do not hasten more than the Most High, for you hasten for your own sake, but the Most High for many. Have not the souls of the righteous in their chambers asked about these things?”
translation:
  language: pt
  text: 'Ele me respondeu e disse: “Você não se apressa mais do que o Altíssimo, pois se apressa por causa de si mesmo, enquanto o Excelso se apressa em favor de muitos. Não perguntaram as almas dos justos, em suas câmaras[a], sobre essas coisas?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: O termo latino também pode significar “depósitos”, “armazéns” ou “lugares reservados”.
    reason: Esclarece a amplitude semântica de promptuariis e preserva a imagem ambígua do texto-fonte.
lexical_decisions:
- source_word: festinas
  choice: se apressa
  rationale: Mantém o verbo ativo latino e expressa com naturalidade a urgência ou impaciência de Esdras.
- source_word: super altissimum
  choice: mais do que o Altíssimo
  rationale: 'Aqui, super introduz uma comparação: Esdras não se apressa mais do que Deus.'
- source_word: propter temetipsum
  choice: por causa de si mesmo
  rationale: Preserva a ênfase reflexiva de temetipsum e o contraste entre o interesse individual de Esdras e o interesse divino por muitos.
- source_word: pro multis
  choice: em favor de muitos
  rationale: Distingue o sentido benéfico de pro do propter anterior e torna claro que a ação do Excelso visa ao bem de muitos.
- source_word: promptuariis
  choice: câmaras
  rationale: No contexto das almas dos justos que aguardam, 'câmaras' é uma equivalência tradicional e inteligível, embora o termo latino também possa designar depósitos ou lugares reservados.
theological_decisions:
- issue: Forma declarativa de non festinas tu
  choice: “Você não se apressa mais do que o Altíssimo”
  alternative: “Você se apressa mais do que o Altíssimo?”
  rationale: O latim não traz partícula interrogativa nessa oração, enquanto a pergunta seguinte é explicitamente marcada por Nonne. A tradução preserva, portanto, a afirmação do texto.
- issue: Alternância entre altissimum e excelsus
  choice: “o Altíssimo” e depois “o Excelso”
  alternative: Repetir “o Altíssimo” nas duas ocorrências
  rationale: Preserva a variação lexical do latim sem sugerir referentes diferentes; ambos são títulos do mesmo Deus.
- issue: Estado intermediário das almas dos justos
  choice: “em suas câmaras”
  alternative: Explicitar um céu, purgatório ou outro local definido
  rationale: Mantém a imagem espacial do texto e evita impor uma identificação doutrinária que o versículo não fornece.
translation_notes:
  register: Português moderno, digno e de ampla compreensão, com legibilidade brasileira. A repetição de “se apressa” torna explícito o verbo elíptico na segunda parte do contraste, sem alterar seu sentido.
