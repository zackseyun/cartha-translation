  text: Considere agora quanto fruto da impiedade uma semente gerou. Quando
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: seminis
  choice: uma semente
  rationale: Mantém o substantivo latino sem acrescentar uma qualificação como «má», ausente no trecho fornecido.
- source_word: fructum impietatis
  choice: fruto de impiedade
  rationale: Reproduz a imagem agrícola e conserva o sentido moral-religioso de «impietas» sem explicá-lo em excesso.
- source_word: generauerit
  choice: produziu
  rationale: Expressa de modo natural o resultado gerado pela semente; o perfeito latino é adequadamente representado pelo pretérito perfeito.
- source_word: Quando
  choice: Quando
  rationale: Preserva a palavra que inicia uma oração ainda incompleta e continua no versículo ou trecho seguinte.
theological_decisions:
- issue: A natureza moral da semente
  choice: Não qualificar a semente como má
  alternative: «uma semente má» ou «uma semente de maldade»
  rationale: Neste fragmento, a impiedade qualifica o fruto, não explicitamente a semente; acrescentar «má» resolveria uma associação que o texto deixa implícita.
translation_notes:
  register: Português moderno, claro e digno, com formulação deliberadamente fragmentária no fim para refletir o «Quando» do texto-fonte. O pronome reflexivo sugerido pela camada inglesa não aparece no latim fornecido e, por isso, não foi acrescentado.
