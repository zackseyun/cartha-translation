  rationale: Correspondência direta e digna para a imagem de um forno intensamente aceso.
- source_word: transiit coram me
  choice: passou diante de mim
  rationale: Preserva o movimento e a localização expressos no latim.
- source_word: factum est cum
  choice: aconteceu que, quando
  rationale: Mantém deliberadamente a oração incompleta do fragmento-fonte, que continua no versículo seguinte.
