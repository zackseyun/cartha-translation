id: 2ES.4.29
reference: 2 Esdras 4:29
language:
  code: pt
  name: Portuguese
  native_name: Português
  variant: modern broadly international Portuguese with Brazilian readability
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod seminatum est, et discesserit locus ubi seminatum est malum, non ueniet ager ubi seminatum est bonum. Quoniam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/029.yaml
  text: For if what has been sown is not reaped[a], and the place where the evil has been sown does not pass away, the field where the good has been sown will not come.
translation:
  language: pt
  text: Pois, se aquilo que foi semeado não for colhido[a], e o lugar onde o mal foi semeado não desaparecer, o campo onde o bem foi semeado não virá.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “Assim, se aquilo que foi semeado não for colhido, e o lugar onde o mal foi semeado não desaparecer, o campo onde o bem foi semeado não virá.”'
    reason: Registra a tradução anterior do conectivo inicial, “Assim”, em vez de “Pois”.
lexical_decisions:
- source_word: seminatum est
  choice: foi semeado
  rationale: Mantém a mesma forma nas três ocorrências, preservando o paralelismo deliberado do latim e expressando de modo natural em português a ação já realizada.
- source_word: discesserit
  choice: desaparecer
  rationale: No contexto, o verbo indica que o lugar do mal deve deixar de existir ou sair de cena; “desaparecer” comunica isso com clareza sem acrescentar uma explicação teológica.
- source_word: ager
  choice: campo
  rationale: Conserva a imagem agrícola e o contraste entre o lugar em que o mal foi semeado e o campo em que o bem foi semeado.
- source_word: ueniet
  choice: virá
  rationale: Reproduz diretamente a metáfora escatológica da chegada do campo do bem, sem substituí-la por uma interpretação como “surgirá” ou “aparecerá”.
theological_decisions:
- issue: Relação temporal entre a remoção do mal e a chegada do bem
  choice: 'Preservar a construção condicional: o campo do bem não virá enquanto a colheita e o desaparecimento do lugar do mal não ocorrerem.'
  alternative: Explicitar a passagem entre a era presente e a era futura.
  rationale: O versículo usa imagens agrícolas e espaciais, sem nomear explicitamente eras ou formular um sistema escatológico; a tradução mantém essa tensão metafórica.
- issue: Estado prévio do mal e do bem semeados
  choice: 'Traduzir as três ocorrências de seminatum est do mesmo modo: “foi semeado”.'
  alternative: Variar entre “foi semeado”, “está semeado” e “será semeado”.
  rationale: A repetição exata no latim apresenta tanto o mal quanto o bem como já semeados e sustenta o paralelismo retórico, sem resolver além do texto como essa realidade deve ser entendida.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e compreensão internacional. A repetição de “foi semeado” é intencional para reproduzir o paralelismo do texto latino. O conectivo final Quoniam foi entendido como início da frase seguinte, conforme a segmentação refletida na referência e na camada inglesa auditada.
