  text: And I answered and said, “How long, and when will these things be? Why are our years few and evil?”
translation:
  language: pt
  text: 'Então respondi: “Até quando? Quando acontecerão essas coisas? Por que nossos anos são poucos e maus?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quo et quando haec?
  choice: Até quando? Quando acontecerão essas coisas?
  rationale: O latim está condensado e elíptico. A formulação explicita em português o sentido temporal das duas perguntas, em consonância com o contexto e sem especificar além disso a natureza dos acontecimentos.
- source_word: modici
  choice: poucos
  rationale: Expressa de modo natural a ideia de anos reduzidos em número ou duração.
- source_word: mali
  choice: maus
  rationale: Preserva a formulação ampla do latim, sem restringi-la a 'difíceis', 'infelizes' ou 'cheios de sofrimento'.
theological_decisions:
- issue: Sentido dos anos 'maus'
  choice: Manter a expressão ampla “anos... maus”
  alternative: “anos difíceis” ou “anos de sofrimento”
  rationale: O texto latino não define se o mal é moral, experiencial ou calamitoso; a tradução conserva essa tensão.
translation_notes:
  register: Português moderno, claro e digno. A abertura “Então respondi” traduz naturalmente a sequência narrativa, enquanto as perguntas breves preservam a urgência do original.
