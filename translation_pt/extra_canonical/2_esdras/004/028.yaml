  text: Seminatum est enim malum, de quo me interrogas de eo, et necdum uenit destrictio ipsius. Si ergo non messum fuerit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/028.yaml
  text: For the evil about which you ask me has been sown[a], and its destruction has not yet come. If therefore it is not reaped,
translation:
  language: pt
  text: Pois o mal sobre o qual você me pergunta foi semeado, e sua colheita ainda não chegou. Portanto, se ele não for ceifado,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Seminatum est
  choice: foi semeado
  rationale: Preserva diretamente a metáfora agrícola do texto latino.
- source_word: malum
  choice: o mal
  rationale: Equivalente natural e semanticamente direto, mantendo o mal como aquilo que foi semeado.
- source_word: destrictio ipsius
  choice: sua colheita
  rationale: Neste contexto, destrictio deriva do campo semântico de colher/recolher e dá continuidade à metáfora de semear e ceifar; 'destruição' provavelmente refletiria confusão com destructio.
- source_word: messum fuerit
  choice: for ceifado
  rationale: Traduz o perfeito passivo de metere e conserva a imagem agrícola.
theological_decisions:
- issue: Relação entre o mal semeado e sua futura colheita
  choice: Manter a metáfora agrícola sem explicá-la como juízo ou destruição
  alternative: Traduzir destrictio como 'destruição' ou explicitar a colheita como punição
  rationale: O verso não resolve aqui todas as implicações teológicas da metáfora; a tradução deve preservar sua tensão e sua continuidade literária.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil. A oração final permanece incompleta porque o texto fornecido termina no início da condição, que continua no versículo seguinte.
