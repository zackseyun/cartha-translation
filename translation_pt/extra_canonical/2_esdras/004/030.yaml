  text: For a grain of evil seed was sown in Adam’s heart from the beginning, and how much ungodliness it has produced until now, and will still produce until the threshing floor comes! But consider within yourself the grain of evil
translation:
  language: pt
  text: Pois um grão de semente má foi semeado no coração de Adão desde o princípio. Quanta impiedade esse grão produziu até agora e ainda produzirá, até que venha a eira! Mas considera, por ti mesmo, o grão do mal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: granum seminis mali
  choice: um grão de semente má
  rationale: Mantém a imagem agrícola e a construção do latim, em português natural e inteligível.
- source_word: impietatis
  choice: impiedade
  rationale: Preserva o sentido religioso e moral amplo do termo latino, sem o reduzir a uma forma específica de pecado.
- source_word: area
  choice: eira
  rationale: Conserva a metáfora escatológica do lugar de debulha, em vez de explicá-la ou substituí-la por uma interpretação.
- source_word: Aestima autem apud te
  choice: Considera, porém, dentro de ti
  rationale: Expressa a reflexão interior indicada por apud te e mantém a transição adversativa de autem.
- source_word: granum mali
  choice: o grão do mal
  rationale: Distingue a expressão final, literalmente 'grão do mal', da anterior 'grão de semente má', sem harmonizá-las indevidamente.
theological_decisions:
- issue: Relação entre Adão, a semente má e a impiedade posterior
  choice: Manter a metáfora e a sequência causal sem explicar a origem ou a transmissão do mal
  alternative: Explicitar uma doutrina de pecado original, culpa herdada ou corrupção transmitida
  rationale: O texto afirma que a semente foi semeada no coração de Adão e que produziu impiedade, mas não define aqui um mecanismo teológico específico.
- issue: Sentido escatológico de area
  choice: Traduzir pela imagem concreta 'eira'
  alternative: Interpretar como 'juízo', 'colheita' ou 'fim dos tempos'
  rationale: A imagem pode evocar julgamento escatológico, mas a tradução deve preservar sua forma metafórica e sua tensão interpretativa.
translation_notes:
  register: Português moderno, digno e acessível, com sintaxe levemente solene apropriada ao gênero. A segunda frase foi formulada como exclamação para refletir a força retórica de et quantum no contexto. Nenhum marcador de nota foi usado, pois não há notas.
