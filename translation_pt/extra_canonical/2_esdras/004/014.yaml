  text: and said[a], ‘Come, let us go and make war against the sea, so that it may withdraw before us, and we may make for ourselves other forests.’ In the same way the waves of the sea also devised a plan,
translation:
  language: pt
  text: 'e disseram: “Venham, façamos guerra contra o mar, para que ele recue diante de nós e façamos para nós outras florestas.” Do mesmo modo, também as ondas do mar conceberam um plano,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: alias siluas
  choice: outras florestas
  rationale: O latim alias significa “outras”, não “mais”; a tradução preserva também o paralelo com aliam regionem no versículo seguinte.
- source_word: recedat coram nos
  choice: recue diante de nós
  rationale: Reproduz de modo natural a ideia de o mar retirar-se perante as florestas.
- source_word: cogitauerunt
  choice: conceberam um plano
  rationale: No contexto personificado e deliberativo, expressa a elaboração intencional de um plano sem a formulação pesada de “pensaram pensamentos”.
- source_word: faciamus ... bellum
  choice: façamos guerra
  rationale: Mantém a linguagem bélica direta do latim e soa natural em português.
