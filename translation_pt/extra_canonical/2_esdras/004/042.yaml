  text: They are likened to the womb of souls. For just as she who gives birth hastens to escape the necessity of childbirth[a], so also these
translation:
  language: pt
  text: São semelhantes ao ventre das almas. Pois, assim como aquela que dá à luz se apressa em escapar da aflição do parto[a], assim também o são...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Literalmente, “da necessidade do parto”.
    reason: Registra o sentido formal de necessitas, enquanto o texto principal expressa o valor contextual de aflição ou aperto inevitável.
lexical_decisions:
- source_word: matrici
  choice: ao ventre
  rationale: O latim matrix, neste contexto de parto, designa o ventre materno; “ventre” comunica a imagem com naturalidade, enquanto “matriz” seria excessivamente técnica ou ambígua em português moderno.
- source_word: necessitatem partus
  choice: da aflição do parto
  rationale: Embora necessitas possa significar literalmente “necessidade”, no contexto da mulher que deseja concluir o parto a expressão aponta para a condição penosa e inevitável do trabalho de parto. “Aflição” preserva essa força experiencial sem restringi-la apenas à dor física.
- source_word: festinabit quae parit
  choice: a mulher que dá à luz se apressa
  rationale: Reproduz de modo natural a construção latina e mantém a imagem da parturiente sem acrescentar conteúdo ausente do trecho.
- source_word: haec
  choice: estas
  rationale: Mantém o demonstrativo neutro plural latino em forma feminina portuguesa, remetendo às entidades mencionadas no contexto anterior, sem identificá-las dentro deste fragmento.
theological_decisions:
- issue: A metáfora animarum matrici
  choice: ventre das almas
  alternative: matriz das almas
  rationale: A opção escolhida conserva a metáfora de gestação e nascimento de modo compreensível, sem explicar teologicamente o que esse “ventre” representa.
- issue: Sentido de necessitas no parto
  choice: aflição do parto
  alternative: necessidade do parto
  rationale: O contexto favorece sofrimento ou aperto inevitável, mas a nota registra o valor mais literal para não ocultar a amplitude do termo latino.
translation_notes:
  register: Português atual, digno e acessível, com sintaxe próxima do latim. As reticências indicam que a frase fica incompleta no excerto fornecido, terminando em sic et haec.
