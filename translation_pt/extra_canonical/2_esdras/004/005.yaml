  text: 'Et dixi : loquere, dominus meus. et dixit ad me : uade, pondera mihi ignis pondus, aut mensura mihi satum uenti, aut reuoca mihi diem quae praeteriit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/005.yaml
  text: And I said[a], “Speak, my lord.” And he said to me, “Go, weigh for me the weight of fire, or measure for me the measure of wind, or call back for me the day that has passed.”
translation:
  language: pt
  text: 'E eu disse: “Fala, meu senhor.” E ele me disse: “Vai, pesa para mim o peso do fogo, ou mede para mim a medida do vento[a], ou chama de volta para mim o dia que passou.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: A expressão latina traduzida por “mede para mim a medida do vento” apresenta dificuldade textual. O sentido é claramente o de uma exigência impossível — quantificar o vento —, mas não se sabe ao certo qual unidade está por trás dessa formulação.
    reason: textual_variant
lexical_decisions:
- source_word: pondera mihi ignis pondus
  choice: pesa para mim o peso do fogo
  rationale: Mantém de modo inteligível a repetição enfática e a formulação paradoxal do latim.
- source_word: mensura mihi satum uenti
  choice: mede para mim a medida do vento
  rationale: Segue a construção paralela adotada pela camada de consulta e conserva a ideia de uma exigência impossível, sem tentar definir a unidade incerta expressa pelo texto latino problemático.
- source_word: reuoca mihi diem quae praeteriit
  choice: chama de volta para mim o dia que passou
  rationale: Reproduz a personificação de reuoca e a impossibilidade de fazer retornar um dia passado.
theological_decisions:
- issue: Forma de tratamento dominus meus
  choice: meu senhor
  alternative: meu Senhor
  rationale: O interlocutor imediato é o ser celestial que fala com Esdras; a inicial minúscula evita identificar implicitamente esse interlocutor com Deus, sem diminuir o respeito da forma de tratamento.
translation_notes:
  register: Português moderno, claro e digno, com leitura natural no Brasil e ampla compreensão internacional. A estrutura paralela das três ordens impossíveis foi preservada, assim como a repetição deliberada em “pesa ... o peso” e “mede ... a medida”.
