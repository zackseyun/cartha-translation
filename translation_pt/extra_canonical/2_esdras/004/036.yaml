  text: 'archangelus et dixit: quando impletus fuerit numerus similium uobis, quoniam in statera ponderauit saeculum, Et mensura'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/036.yaml
  text: And the archangel answered and said, ‘When the number of those like you is completed, for he has weighed the age in a balance,
translation:
  language: pt
  text: 'E o arcanjo respondeu e disse: “Quando se completar o número dos que são semelhantes a vocês, pois ele pesou a era numa balança,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: archangelus
  choice: o arcanjo
  rationale: Correspondência direta e natural ao termo latino, sem acrescentar o nome Jeremiel, ausente no texto fornecido.
- source_word: similium uobis
  choice: dos que são semelhantes a vocês
  rationale: Preserva a comparação explícita e a ambiguidade do latim quanto à identidade exata desse grupo.
- source_word: saeculum
  choice: a era
  rationale: Neste contexto apocalíptico, designa o tempo ou a ordem do mundo presente; “era” mantém o sentido temporal sem restringi-lo a “mundo”.
- source_word: in statera ponderauit
  choice: pesou ... numa balança
  rationale: Conserva a imagem concreta do ato de pesar e a formulação idiomática em português.
theological_decisions:
- issue: Sujeito de “ponderauit”
  choice: ele
  alternative: Deus
  rationale: O latim traz o sujeito implícito e não nomeia Deus nesta unidade; manter o pronome evita explicitar uma identificação teológica que o trecho apenas pressupõe.
- issue: Identidade do arcanjo
  choice: não nomeada
  alternative: Jeremiel
  rationale: O nome Jeremiel não consta do texto latino fornecido e, portanto, não deve ser importado do contexto ou de outra tradição textual.
- issue: Relação introduzida por “quoniam”
  choice: pois
  alternative: porque
  rationale: “Pois” preserva a relação explicativa/causal sem resolver além do necessário como a pesagem da era fundamenta a conclusão do número.
translation_notes:
  register: Português moderno, digno e de leitura ampla, com tratamento plural por “vocês”. A sintaxe formular “respondeu e disse” foi mantida por refletir o original. A vírgula final preserva o caráter incompleto da unidade fornecida, que continua no versículo ou segmento seguinte.
