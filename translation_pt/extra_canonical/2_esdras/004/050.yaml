  text: 'et dixit ad me: cogita tibi. sicut enim crescit pluvia amplius quam guttae, et ignis amplius quam fumus, sic superabundavit quae transivit mensura, superaverunt autem guttae et fumus.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/050.yaml
  text: 'And he said to me[a], “Consider for yourself: just as the rain is greater than the drops, and the fire greater than the smoke, so what has passed has greatly exceeded the measure, but the drops and the smoke remain.”'
translation:
  language: pt
  text: 'E ele me disse: “Pensa nisto: assim como a chuva é maior do que as gotas, e o fogo é maior do que a fumaça, também a medida que já passou foi muito maior[a]; mas ainda restam as gotas e a fumaça.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou: “o que passou excedeu em muito a medida”.'
    reason: Preserva a ambiguidade sintática de quae transivit mensura e a leitura adotada pela camada inglesa de consulta.
lexical_decisions:
- source_word: cogita tibi
  choice: Pensa nisto
  rationale: Expressa de modo natural a exortação reflexiva do latim, sem a formulação pouco idiomática “pensa para ti mesmo”.
- source_word: pluvia amplius quam guttae
  choice: a chuva é maior do que as gotas
  rationale: Mantém a comparação quantitativa do texto e a imagem entre o todo e a pequena parte restante.
- source_word: ignis amplius quam fumus
  choice: o fogo é maior do que a fumaça
  rationale: Preserva o paralelismo sintático e imagético com chuva e gotas.
- source_word: superabundavit
  choice: foi muito maior
  rationale: No contexto comparativo introduzido por amplius, comunica abundância ou superioridade marcante em português corrente.
- source_word: superaverunt
  choice: ainda restam
  rationale: O verbo pode indicar aquilo que sobrou ou permaneceu; “ainda restam” torna explícito esse sentido contextual sem acrescentar um lugar ou momento não declarado.
theological_decisions:
- issue: Relação entre a medida passada e o que resta
  choice: a medida que já passou foi muito maior
  alternative: o que passou excedeu em muito a medida
  rationale: A concordância de quae transivit com mensura favorece a leitura “a medida que passou”. A alternativa continua gramatical e contextualmente possível, por isso é preservada em nota, sem decidir uma interpretação cronológica além do texto.
translation_notes:
  register: Português moderno, claro e digno, com paralelismo preservado. O advérbio “já” e a expressão “ainda restam” tornam natural em português o contraste entre a porção passada e a porção remanescente.
