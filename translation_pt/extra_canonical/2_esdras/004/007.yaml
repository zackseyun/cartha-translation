source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me : si eram interrogans te dicens : quantae habitationes sunt in corde maris, aut quantae uenae sunt in principio abyssi, aut quantae uiae sunt super firmamentum, aut qui sunt exitus paradisi ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/007.yaml
  text: And he said to me, “If I had asked you, saying, ‘How many dwellings are in the heart of the sea? Or how many springs are at the source of the deep? Or how many ways are above the firmament? Or what are the exits of paradise?’
translation:
  language: pt
  text: 'E ele me disse: “Se eu lhe tivesse perguntado: ‘Quantas moradas há no coração do mar? Ou quantas fontes há no princípio do abismo? Ou quantos caminhos há acima do firmamento? Ou quais são as saídas do paraíso?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: habitationes
  choice: moradas
  rationale: Preserva o sentido concreto de lugares de habitação e o tom elevado da passagem.
- source_word: in corde maris
  choice: no coração do mar
  rationale: Mantém a imagem semítica preservada pelo latim, em vez de reduzi-la a uma explicação como “nas profundezas do mar”.
- source_word: uenae
  choice: fontes
  rationale: No contexto das águas do abismo, o latim venae designa veios ou nascentes; “fontes” comunica naturalmente a ideia em português.
- source_word: in principio abyssi
  choice: no princípio do abismo
  rationale: Conserva a formulação espacial ou originária ambígua de principium, sem fixá-la exclusivamente como “fonte” ou “começo”.
- source_word: uiae
  choice: caminhos
  rationale: Equivalente direto e natural, preservando a imagem cosmológica.
- source_word: firmamentum
  choice: firmamento
  rationale: Mantém o termo cosmológico tradicional e reconhecível, sem reinterpretar a concepção antiga do céu.
- source_word: exitus paradisi
  choice: saídas do paraíso
  rationale: Traduz literalmente exitus e preserva a pergunta incomum do texto, sem harmonizá-la com “entradas” ou “limites”.
theological_decisions:
- issue: Cosmologia antiga da passagem
  choice: Preservar “coração do mar”, “abismo”, “acima do firmamento” e “saídas do paraíso”
  alternative: Modernizar ou explicar as imagens cosmológicas
  rationale: O versículo apresenta perguntas retóricas dentro de sua própria cosmologia literária; a tradução não deve resolver nem substituir essas imagens.
translation_notes:
  register: Português moderno, digno e amplamente compreensível, com legibilidade brasileira. A estrutura interrogativa foi levemente regularizada para fluidez, mantendo todas as imagens e ambiguidades relevantes do latim.
